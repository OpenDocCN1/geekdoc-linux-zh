- img_proc: true
  md: 'The following are the same as the previous # and ## expansions, except they
    remove text from the end of the string contained in parameter rather than from
    the beginning.


    ```

    $${parameter%pattern}

    ${parameter%%pattern}

    ```


    Here is an example:


    ```

    $me@linuxbox ~$ foo=file.txt.zip

    $me@linuxbox ~$ echo ${foo.*}

    file.txt

    $me@linuxbox ~$ echo ${foo%%*}

    ```


    The following expansions perform a search-and-replace operation on the contents
    of parameter:


    ```

    $${parameter/pattern/string}

    ${parameter//pattern/string}

    ${parameter#pattern/string}

    ${parameter%%pattern/string}

    ```


    If text is matching wildcard pattern, it is replaced with the contents of string.
    In the normal form, only the first occurrence of pattern is replaced. In the //
    form, all occurrences are replaced. The # form requires that the match occur at
    the beginning of the string, and the % form requires the match to occur at the
    end of the string. In every form, /string may be omitted, catching the text matched
    by pattern to be deleted.


    ```

    $me@linuxbox ~$ foo=JPG.JPG

    $me@linuxbox ~$ echo ${foo/JPG/jpg}

    jpg.JPG

    $me@linuxbox ~$ echo ${foo//JPG/jpg}

    jpg.JPG

    $me@linuxbox ~$ echo ${foo#JPG/jpg}

    jpg.JPG

    $me@linuxbox ~$ echo ${foo%/JPG}

    JPG.JPG

    ```


    Parameter expansion is a good thing to know. The string manipulations can be used
