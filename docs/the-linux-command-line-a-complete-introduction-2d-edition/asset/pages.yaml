  pgno: 329
- img_proc: true
  md: 'such as boldface, by having the printer a character, backspace, and print the
    character again to get a darker print impression on the page. We can actually
    witness this if we use nroff to render a page and examine the output using cat
    -A.


    ```

    me@linux~$ zcat /usr/share/man/man1/ls.1.gz | nroff -man | cat -A | head

