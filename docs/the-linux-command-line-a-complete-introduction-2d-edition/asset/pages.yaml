  md: '# diff—Compare Files by Line


    Like the comm program, diff is used to detect the differences between files. However,
    diff is a much more complex tool, supporting many output formats and the ability
    to process large collections of files at once. diff is often used by software
    developers to examine changes between versions of program source code and thus
    the ability to recursively examine differences of source code, often referred
    to as source trees. A common use for diff is the creation of diff files or patches
    that are used by programs such as patch (which we''ll discuss shortly) to convert
    one version of a file (or) to another version.


    If we use diff at our previous example files:


    ```

    me@linuxbox ~]$ diff file1.txt file2.txt

    d1o

    <a>

    4a

    > e

    ```


    we see its default style of output: a description of the differences between the
    two files. In the default format, each group of changes is preceded by a change
    command in the form of range operation to describe the positions and types of
    changes required to convert the first file to the second file, as outlined in
    Table 20-4.


    Table 20-4: diff Change Commands

    | Change | Description |

    |---|---|n| r1ar2 | Append the lines at the position r2 in the second file to
    the position r1 in the first file. |

    | r1cr2 | Change [replace] the lines at position r1 with the lines at position
    r2 in the second file. |

    | r1dr2 | Delete the lines in the first file at position r1, which would have
    appeared at range r2 in the second file |


    In this format, a range is a comma-separated list of the starting line and the
    ending line. While this is the default (mostly for POSIX compliance) and backward
    compatibility with traditional Unix versions of diff), it is not widely used as
    or, optional formats. Two of the most popular formats are the context format and
    the unified format.


    When viewed using the context format (the -c option), we will see this:


    ```

    me@linuxbox ~]$ diff -c file1.txt file2.txt

    *** file1.txt 2008-12-23 06:40:13.000000000-0500

    --- file2.txt 2008-12-23 06:40:34.000000000-0500

    *** 1,4 ****

    - a

    - b

    ```'
