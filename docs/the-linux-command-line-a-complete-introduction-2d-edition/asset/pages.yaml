- img_proc: true
  md: '# Setting Up a Named Pipe


    First, we must create a named pipe. This is done using the mkfifo command.


    ```

    me@linux ~]$ mkfifo pipe1

    me@linux ~]$ ls -1 pipe1

    prw-r-x-- 1 me  0 2018-07-17 06:41 pipe1

    ```


    Here we use mkfifo to create a named pipe called pipe. Using ls, we examine the
    file and see that the first letter in the attributes field is p, indicating that
    it is a named pipe.


    # Using Named Pipes


    To demonstrate how the named pipe works, we will need two terminal windows (or
    alternately, two virtual consoles). In the first terminal, we enter a simple command
    and redirect its output to the named pipe.


    ```

    me@linux ~]$ ls -1 > pipe1

    ```


    After we press ENTER, the command will appear to hang. This is because there is
    nothing receiving data from the other end of the pipe yet. When this occurs, it
    is said that the pipe is blocked. This condition will clear once we attach a process
    to the other end and it begins to read input from the pipe. Using the second terminal
    window, we enter this command:


    ```

    me@linux ~]$ cat < pipe1

    ```


    The directory listing produced from the first terminal window appears in the second
    terminal as the output from the cat command. The ls command in the first terminal
    successfully completes once it is no longer blocked.


    # Summing Up


    Well, we have completed our journey. The only thing left to do now is practice,
    practice, practice. Even though we covered a lot of ground in our trek, we barely
    scratched the surface as far as the command line goes. There are still thousands
    of command line programs left to be discovered and enjoyed. Start digging around
    in /usr/bin and you''ll see!'
