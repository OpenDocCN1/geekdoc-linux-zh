  md: '# REVERTING TO TRADITIONAL COLLATION ORDER


    You can opt to have your system use the traditional (ASCII) collation order by
    changing the value of the LANG environment variable. As we saw earlier, the LANG
    variable contains the name of the language and character set used in your locale.
    This value was originally determined when you selected an installation language
    as your Linux version was installed.

    To see the settings, use the Locale command.


    ```

    [me@linuxbox ~]$ locale

    LANG=en_US.UTF-8

    LC_TYPE=en_US.UTF-8

    LC_NUMERIC=en_US.UTF-8

    LC_TIME=en_US.UTF-8

    LC_COLLATE=en_US.UTF-8

    LC_MONETARY=en_US.UTF-8

    LC_MESSAGES=en_US.UTF-8

    LC_PAPER=en_US.UTF-8

    LC_ADDRESS=en_US.UTF-8

    LC_TELEPHONE=en_US.UTF-8

    LC_MEASUREMENT=en_US.UTF-8

    LC_IDENTIFICATION=

    ```


    To change the locale to use the traditional Unix behaviors, set the LANG variable
    to POSIX.


    ```

    [me@linuxbox ~]$ export LANG=POSIX

    ```


    Note that this change converts the system to use US English (more specifically,
    ASCII) be sure if this is really what you want.

    You can make this change permanent by adding this line to your .bashrc file:


    ```

    export LANG=POSIX

    ```


    # POSIX bas vs. Extended Regular Expressions


    Just when we thought this couldn''t get any more confusing, we discover that POSIX
    also splits regular expression implementations into two kinds: basic regular expressions
    (BRE) and extended regular expressions (ERE). The features we have covered so
    far are supported by any application that is POSIX compliant and implements BRE.
    Our grep program is one such.

    What''s the difference between BRE and ERE? It''s a matter of metacharacters.
    With BRE, the following metacharacters are recognized:


    ```

    ^ $ . [ ] *

    ```'
