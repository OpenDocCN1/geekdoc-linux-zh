  md: 'the archive. -v option can be added to increase the verbosity of the listing.
    Note that when the archive extraction conflicts with an existing file, the user
    is prompted before the file is replaced.


    Like tar, zip can make use of standard input and output, though that is somewhat
    less usual. It is possible to pipe a list of filenames to zip via the -@ option.


    ```

    [linuxbox foo]$ cd

    @[linuxbox ~]$ find playground -name "file-A" | zip -@file-A

    ```


    Here we use find to generate a list of files matching the test -name "file-A"
    and then pipe the list into zip, which creates the archive file-A.zip containing
    the selected files.

    zip also supports writing its output to standard output, but its use is limited
    because few programs can make use of the output. Unfortunately, unzip does not
    accept standard input. This prevents zip and unzip from being used together to
    perform network file copying like tar.

    zip can, however, accept standard input, so it can be used to compress the output
    of other programs.


    ```

    [linuxbox ~]$ ls -l /etc/ | zip ls-etc.zip

    : -(deflated 80%)

    ```


    In this example, we pipe the output of ls into zip. Like tar, unzip interprets
    the trailing dash as "use standard input for the input.\nThe unzip program allows
    its output to be sent to standard output when the -p (for pipe) option is specified.


    ```

    [linuxbox ~]$ unzip -p ls-etc.zip | less

    ```


    We touched on some of the basic things that zip/unzip can do. They have a lot
    of options that add to their flexibility, though some are platform specific to
    other systems. The main pages for both zip and unzip are pretty good and contain
    useful examples; however, the main use of these programs is for exchanging files
    with Windows systems, rather than performing compression and archiving on Linux,
    where tar and gzip are greatly preferred.


    # Synchronizing Files and Directories


    A common strategy for maintaining a backup copy of a system involves keeping one
    or more directories synchronized with another directory (or either the local system
    (usually a removable storage device of some kind) or a remote system. We might,
    for example, have a local copy of a website under development and synchronize
    it from time to the "live" copy on a web server.


    In the Unix-like world, the preferred tool for this is rsync. The program can
    synchronize both local and remote directories by using'
