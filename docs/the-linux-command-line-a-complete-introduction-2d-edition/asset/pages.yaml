  md: '# 24


    # WRITING YOUR FIRST SCRIPT


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_354_0.png)


    In the preceding chapters, we assembled an arsenal of command line tools. While
    these tools can solve many kinds of computing problems, we are still limited to
    manually using them by one on the command line. Wouldn''t it be great if we could
    get the shell to do more of the work? By joining our tools together into programs
    of our own design, the shell can carry out complex sequences of tasks all by itself.
    We can enable it to do this by writing shell scripts.


    # What Are Shell Scripts?


    In the simplest terms, a shell script is a file containing a series of commands.
    The shell reads this file and carries out the commands as though they have been
    entered directly on the command line.


    The shell is somewhat unique, in that it is both a powerful command line interface
    to the system and a scripting language interpreter. As we will'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'see, most of the things that can be done on the command line can be done in
    scripts, and most of the things that can be done in scripts can be done on the
    command line.


    We have covered many shell features, but we have focused on those features most
    used directly on the command line. The shell also provides a set of features usually
    (but not always) used when writing programs.


    # How to Write a Shell Script


    To successfully create and run a shell script, we need to do three things.


    +   Write a script. Shell scripts are ordinary text files. So, we need a text
    editor to write them. The best editors will provide syntax highlighting, allowing
    us to see a color-coded view of the elements of the script. Syntax highlighting
    will help us spot certain kinds of common errors. vi, edit, kate, and many other
    editors are good candidates for writing scripts.


    +   Make the script executable. The system is rather fussy about not letting any
    old file be treated as a program, and for good reason! We need to set the script''s
    permissions to allow execution.


    +   Put the script somewhere the shell can find it. The shell automatically searches
    directories for executable files when no explicit path is specified. For maximum
    convenience, we place our scripts in these directories.


    # Script File Format


    In keeping with programming tradition, we''ll create a "Hello World" program to
    demonstrate an extremely simple script. Let''s fire up our text editors and enter
    the following script:


    ```

    #!/bin/bash

    ```


    ```

    # This is our first script.

    ```


    ```

    echo ''Hello World!''

    ```


    The last line of our script is pretty familiar; it''s just an echo command with
    a string argument. The second line is also familiar. It looks like a comment that
    we have used in many of the configuration files we have examined and edited. One
    thing about comments in shell scripts is that they may also appear at the ends
    of lines provided they are preceded by at least one whitespace character, like:


    ```

    echo ''Hello World!'' # This is a comment

    ```


    Everything from the # symbol onward on the line is ignored. Like many things,
    this works on the command line, too.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '[me@linuxbox ~]$ echo ''Hello World!'' # This is a comment too

    Hello World!


    Though comments are of little use on the command line, they will work.

    The first line of our script is a little mysterious. It looks as if it should
    be a comment since it starts with #, but it looks too purposeful to be just that.

    The #! character sequence is, in fact, a special construct called a shebang.

    shebang is used to tell the kernel name of the interpreter that should be\used
    to execute the script that follows. Every shell script should include this as

    its first line.


    Let''s save our script file hello_world.


    # Executable Permutations


    The next thing we have to do is make our script executable. This is easily

    done chmod.


    ```

    [me@linuxbox ~]$ ls -l hello_world

    -RW-R--R-- 1 me 63 2018-03-07 10:10 hello_world

    [me@linuxbox ~]$ chmod 755 hello_world

    [me@linuxbox ~]$ ls -l hello_world

    -RWX-XR-X 1 me 63 2018-03-07 10:10 hello_world

    ```


    There are two common permission settings for scripts: 755 for scripts

    t everyone can execute and 700 for scripts that only the owner can execute.

    Note that scripts must be readable to be executed.


    # Script File Location


    With the permissions set, we can now execute our script.


    ```

    [me@linuxbox ~]$ ./hello_world

    Hello World!

    ```


    For the script to run, we must precede the script name with an explicit

    path. If we don''t, we get this:


    ```

    [me@linuxbox ~]$ hello_world

    bash: hello_world: command not found

    ```


    Why is this? What makes our script different from other programs?

    As turns out, nothing. Our script is fine. Its location is the problem.

    In Chapter 11, we discussed the PATH environment variable and its effect

    on how the system searches for executable programs. To recap, the system

    seches a list of directories each time it needs to find an executable

    program, if no explicit path is specified. This is how the system knows to

    execute /bin/ls when we type ls me is one of the directories the system automatically
    searches. The list of

    directories is held within an environment variable named PATH. The'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'variable contains a colon-separated list of directories to be searched. We

    view the contents of PATH.


    ```

    me@linuxbox ~]$ echo $PATH

    home/me/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/usr/games

    ```


    Here we see our list of directories. If it were located in any of

    d own in the list, our problem would be solved. Notice the first

    directory in the list, /home/me/bin. Most Linux distributions configure the

    PATH variable to contain a bin directory in the user''s home directory to allow

    users to execute their own programs. So, if we create the bin directory and

    place our script within, it should start to work like other programs.


    ```

    me@linuxbox ~]$ mkdir bin

    me@linuxbox ~]$ mv hello_world bin

    me@linuxbox ~]$ hello_world

    ```


    Hello world!


    And so it does.

    If the PATH variable does not contain the directory, we can easily add

    by including this line in our .bashrc file:


    ```

    export PATH=/bin:$PATH

    ```


    After this change is made, it will take effect in each new terminal session.

    To apply the change to the current terminal session, we must have the shell

    reread the .bashrc file. This can be done by "sourcing" it.


    ```

    me@linuxbox ~]$ . .bashrc

    ```


    The dot (.) is a synonym for the source command, a shell

    builtin that reads a specified file of shell commands and treats it like input

    from the keyboard.


    Ubuntu (and most Debian-based distributions) automatically adds the ~/bin

    directory to the PATH variable if the ~/bin directory exists when the user''s
    .bashrc file

    is executed. So, on Ubuntu systems, if we create the ~/bin directory and log out

    log in, everything works.


    # Good Locations for Scripts


    The ~/bin directory is a good place to put scripts intended for personal

    out If we use a script that everyone on a system is allowed to use, the

    traditional location is /usr/local/bin. Scripts intended for use by the system

    administrator are often located in /usr/local/sbin. In most cases, loc

    plied software, whether scripts or compiled programs, should be placed in

    t /usr/local hierarchy and not in /bin or /usr/bin. These directories are

    spec by the Linux Filesystem Hierarchy Standard to contain only files

    supplied and maintained by the Linux distributor.'
