    # WILDCARDS WORK IN THE GUI, TOO


    Wildcards are especially valuable not only because they are used frequently on
    the command line but because they are also supported by some graphical file managers.


    +   * In Nautilus (the file manager for GNOME), you can select files using the
    Edit ► Select Pattern item menu. Enter a file selection pattern with wildcards
    and the files in the currently viewed directory will be highlighted

    * In some versions of Dolphin and Konqueror (the file managers for KDE), you can
    enter wildcards directly on the location bar. For example, if you want to see
    all the files starting with a lowercase u in the /usr/bin/directory, enter /usr/bin/u*
    in the location bar and it will display the result.


    Many ideas originally found in the command line interface make their way into
    the graphical interface, too. It is one of many things that make the Linux desktop
    powerful.


    Wildcards can be used with any command that accepts filenames as arguments, but
    we''ll talk more about that in Chapter 7.'
