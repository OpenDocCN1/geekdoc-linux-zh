  md: '# Array Operations


    There are many common array operations. Such things as deleting arrays, determining
    their size, sorting, and so on, have many applications in scripting.


    # Outputting the Entire Contents of an Array


    The subscripts * and @ can be used to access every element in an array. With positional
    parameters, the @ notation is the more useful of the two. Here is a demonstration:


    ```

    [me@linuxbox]$ animals="a dog" "a cat" "a fish"

    [me@linuxbox]$ for i in ${animals[*]}; do echo $i;

    a

    dog

    a

    cat

    a

    fish

    [me@linuxbox]$ for i in ${animals[@]}; do echo $i;

    a

    dog

    a

    cat

    a

    fish

    [me@linuxbox]$ for i in "${animals[*]}"; do echo $i;

    dog a cat fish

    [me@linuxbox]$ for i in "${animals[@]}"; do echo $i;

    dog

    a

    cat

    a

    fish

    ```


    We create the array animals and assign it two word-string strings. We then execute
    four loops to see the effect of word splitting on the array contents. The behavior
    of notations ${animals[*]} and ${animals[@]} is identical until they are quoted.
    The * notation results in a single word containing the array''s contents, while
    the @ notation results in two-word strings, which matches the array''s “real”
    contents.


    # Determining the Number of Array Elements


    Using parameter expansion, we can determine the number of elements in an array
    in much the same way as finding the length of a string. Here is an example:


    ```

    [me@linuxbox]$ a[100]=foo

    [me@linuxbox]$ echo ${#a[@]} # number of array elements

    1

    [me@linuxbox]$ echo ${#a[100]} # length of element 100

    ```'
