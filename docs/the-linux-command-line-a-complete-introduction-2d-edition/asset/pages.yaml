    # Another Option: a2ps


    The a2ps program (available in most distribution repositories) is interesting.
    As we can surmise from its name, it is a format conversion program, and it is
    much more. Its name originally meant “ASCII to PostScript,” and it was used to
    prepare text files for printing on PostScript printers. Over the years, the capabilities
    of the program have grown, and now it means “Anything to PostScript.” While its
    name suggests a format-conversion program, it is actually a printing program.
    It sends its default output to the system’s default printer rather than standard
    output. The program’s default behavior is that of a “pretty printer,” meaning
    that it improves the appearance of output. We can use the program to create a
    PostScript file on our desktop.'
