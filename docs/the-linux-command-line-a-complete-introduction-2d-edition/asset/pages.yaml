    One element of the environment that neither set nor printenv displays is aliases.
    To see them, enter the alias command without arguments.


    ```

    me@linuxbox ~$ alias

    alias ls=''ls -d * --color=tty''

    alias ll=''ls -1 --color=tty''

    alias ls=''ls --color=tty''

    alias vi=''vim''

    alias which=''alias /usr/bin/which --tty-alias --read-alias --show-dot --show-tilde''

    ```


    # Some Interesting Variables


    The environment contains quite a few variables, and though the environment will
    differ from the one presented here, we will likely see the variables listed in
    Table 11-1 in our environment.'
