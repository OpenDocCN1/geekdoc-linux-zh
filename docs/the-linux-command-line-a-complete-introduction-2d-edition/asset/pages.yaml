  md: 'In the examples that follow, it is vitally important that you pay close attention
    to the actual device names in use on your system and do not use the names used
    in this text! Also note that audio CDs are not the same as CD-ROMs. Audio CDs
    do not contain file systems and thus cannot be mounted in the usual sense.


    Now that we have the device name of the CD-ROM drive, remount it at another location
    in the file system tree. To do this, we become the superuser (using the command
    appropriate for our system) and unmount the device with the mount (notice the
    spelling) command.


    ```

    [me@linuxbox ~]$ su

    Password:

    [root@linuxbox ~]# unmount /dev/sdc

    ```


    The next step is to create a new mount point for the disk. A mount point is simply
    a directory somewhere on the file system tree. There''s nothing special about
    it. It doesn''t have to be an empty directory, though if you mount a device on
    a non-empty directory, you will not be able to see the directory''s previous contents
    until you unmount the device. For our purposes, we will create a new directory.


    ```

    [root@linuxbox ~]# mkdir /mnt/cdrom

    ```


    Finally, we mount the CD-ROM at the new mount point. The -t option is used to
    specify the file system type.


    ```

    [root@linuxbox ~]# mount -t iso9660 /dev/sdc /mnt/cdrom

    ```


    Afterward, we examine the contents of the CD-ROM via the mount point.


    ```

    [root@linuxbox ~]# cd /mnt/cdrom

    [root@linuxbox cdrom]# ls

    ```


    Notice what happens when we try to unmount the CD-ROM.


    ```

    [root@linuxbox cdrom]# unmount /dev/sdc

    unmount: /mnt/cdrom: device is busy

    ```


    Why is this? The reason is that we cannot unmount a device if it is being used
    by someone or some process. In this case, we changed our working directory to
    the mount point for the CD-ROM, which causes the device to be busy. We can easily
    remedy the issue by changing the working directory to something other than the
    mount point.


    ```

    [root@linuxbox cdrom]# cd

    [root@linuxbox ~]# unmount /dev/hdc

    ```


    Now the device unmounts successfully.'
