  md: '# Document Formatting Systems


    So far, we have examined the simple text-formatting tools. These are good for
    small, tasks, but what about larger jobs? One of the reasons that Unix became
    a popular operating system among technical and scientific users (aside from providing
    a powerful multitasking, multiuser environment for all kinds of software development)
    is that it offered tools that could be used to produce many types of documents,
    particularly scientific and academic publications. In fact, as the GNU documentation
    describes, preparation was instrumental to the development of Unix.


    The first version of UNIX was developed on a PDP-7 which was sitting around Bell
    Labs. In 1971 the developers wanted to get a PDP-11 for further work on the operating
    system. In order to justify the cost for this system, they proposed that they
    would implement a document formatting system for the AT&T patients of McIllroy''s
    roff, written by J. Ossanna.


    Two families of document formatters dominate the field: those descended from the
    original roff program, including roff and troff, and those based on Donald Knuth''s
    TeX (pronounced "tek") typesetting system. And the dropped E in the middle is
    part of its name.


    The name roff is derived from the term run off in, "I''ll run off for a copy for
    you." The roff program is used to format documents for output to devices that
    used monospaced fonts, such as character terminals and typewriter-style printers.
    At the time of its introduction, this included nearly all devices attached to
    computers. The later troff program documents for output on typesetters, devices
    used to produce "camera-ready" type for commercial printing. Most computer printers
    today are able to simulate the output of typesetter. The roff family also includes
    other programs that are used to prepare portions of documents. These include eqn
    (for mathematical equations) and tbl (for tables).


    The TeX system (in stable form) first appeared in 1989 and has, to some degree,
    displaced troff as the tool of choice for typesetter output. We are not covering
    TeX here, because of its complexity (there are entire books about it) and because
    it is not installed by default on most Linux systems.


    For interested in installing TeX, check out the texlive package, which can be
    found in most distribution repositories, and the LaTeX graphical content editor.


    # roff


    roff is a suite of programs containing the GNU implementation of troff. It also
    includes a script that is used to emulate roff and the rest of the roff family
    as well.'
