  md: '# 19


    # REGULAR EXPRESSIONS


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_256_0.png)


    In the next few chapters, we are going to look at tools used to manipulate text.
    As we have seen, text data plays an important role on all Unix-like systems, such
    as Linux. But before we can fully appreciate all the features offered by these
    tools, first we have to examine a technology that is frequently associated with
    the most sophisticated uses of these tools—regular expressions.


    As we have navigated the many features and facilities offered by the command line,
    we have encountered some arcane features, such as shell expansion and quoting,
    keyboard shortcuts, and command history, not to mention the vi editor. Regular
    expressions continue this “tradition” and may be (arguably) the vi arcane feature
    of them all. This is not to suggest that the time it takes to learn about them
    is not worth the effort. Quite the contrary. A good understanding will enable
    us to perform amazing feats, though their full value may not be immediately apparent.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# What Are Regular Expressions?


    Simply put, regular expressions are symbolic notations used to identify patterns
    in text. In some ways, they resemble the shell''s wildcard method of matching
    file and pathnames but on a much grand scale. Regular expressions are supported
    by many command line tools and most programming languages to facilitate the solution
    of text manipulation problems. However, to further confuse things, not all regular
    expressions are the same; they vary slightly tool to tool and from programming
    language to language. For our discussion, we will limit ourselves to regular expressions
    as described in the POSIX standard (which will cover most of the command line
    tools), as opposed to many programming languages (most notably Perl), which use
    slightly larger and richer sets of notations.


    # grep


    The main program we will use to work with regular expressions is our old pal grep.
    The name grep is actually derived from the phrase "global expression print," so
    we can see that grep has something to do with regular expressions. In essence,
    grep searches files for text matching a specified regular expression and outputs
    any line containing a standard output.


    So far, we have used grep with fixed strings, like so:


    ```

    [me@linuxbox ~]$ ls /usr/bin | grep zip

    ```


    This will list all the files in the /usr/bin directory whose names contain the
    substring zip. grep program accepts options and arguments this way, where regex
    is a regular expression:


    ```

    grep [options] regex [file...]

    ```


    Table 19-1 describes the commonly used grep options.


    Table 19-1: grep Options

    | Option | Long option | Description |

    | -i | --ignore-case | Do not distinguish between uppercase and lowercase characters.
    |

    | -v | --invert-match | Invert match. Normally, grep prints lines that contain
    a match. This option causes grep to print every line that does not contain a match.
    |

    | -c | --count | Print the number of matches (or non-matches if the -v option
    is also specified) instead of the lines themselves. |

    | -l | --files-with-matches | Print the name of each file that contains a match
    instead of the lines themselves. |'
  merge: -1
  pgno: 257
- img_proc: true
  md: '| Option | Long option | Description |

    | --- | --- | --- |

    | -L | --files-without-match | Like the -l option, but print only the names of
    files that do not contain matches. |

    | -n | --line-number | Prefix each matching line with the number of the file.
    |

    | -h | --no-filename | For multiple searches, suppress the output of filenames.
    |


    To fully explore grep, let''s create some text files to search.


    ```

    me[linuxbox ~]$ ls /bin > dirlist-bin.txt

    me[linuxbox ~]$ ls /usr/bin > dirlist-usr-bin.txt

    me[linuxbox ~]$ ls /usr/sbin > dirlist-usr-sbin.txt

    me[linuxbox ~]$ ls dirlist*.txt

    dirlist-bin.txt dirlist-usr-sbin.txt

    dirlist-usr-bin.txt

    ```


    We can perform a simple search of our list of files like this:


    ```

    me[linuxbox ~]$ grep bzip dirlist*.txt

    dirlist-bin.txt:bzip2

    dirlist-bin.txt:bzip2recover

    ```


    In this example, grep searches all the listed files for the string bzip and finds
    two matches, in both the file dirlist-bin.txt. If we were interested only in the
    list of files that contained matches rather than the matches themselves, we could
    specify the -l option.


    ```

    me[linuxbox ~]$ grep -l bzip dirlist*.txt

    dirlist-bin.txt

    ```


    Conversely, if we wanted to see only a list of the files that did not contain
    a match, we could do this:


    ```

    me[linuxbox ~]$ grep -L bzip dirlist*.txt

    dirlist-sbin.txt

    dirlist-usr-bin.txt

    dirlist-usr-sbin.txt

    ```


    # ### Metacharacters and Literals


    While it might seem apparent, our grep searches have been using regular expressions
    all along, albeit very simple ones. The regular expression bzip is taken to mean
    that a match will occur only if the line in the file contains at least four characters
    and that somewhere in the line the characters b, z, i, and p are found in order,
    with no other characters in between. The characters in the string bzip are all
    literal characters, in that they may'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'themselves. In addition to literals, regular expressions may also include metacharacters
    that are used to specify more complex matches. Regular expression metacharacters
    consist of the following:


    ^ $. [ { } - ? * + ( ) |


    All other characters are considered literals, though the backslash character is
    used in a few cases to create metasquences, as well as allowing the metacharacters
    to be escaped and treated as literals instead of interpreted metacharacters.


    As we can see, many of the regular expression metacharacters are also characters
    that meaning to the shell when expansion is performed. When we pass regular expressions
    containing metacharacters on the command line, it is vital that they be enclosed
    in quotes to prevent the shell from attempting to expand them.


    # The Any Character


    The first metacharacter we will look at is the dot (.) or period character, which
    is used to match any character. If we include it in a regular expression, it match
    any character in that character position. Here''s an example:


    ```

    me@linux~}$ grep -h ''.zip'' dirlist.txt

    zip2

    bzip2

    bzip2recover

    gzip

    gzip

    funzip

    gpg-zip

    prezip

    prezip

    prezip-bin

    unzip

    unipsfx

    ```


    We searched for any line in our files that matches the regular expression .zip.
    There are a couple of interesting to note about the results. Notice that the zip
    program was not found. This is because the inclusion of the metacharacter in our
    regular expression increased the length of the required match to four characters,
    and the name zip contains only three, it does not match. Also, if any files in
    our lists had the file extension .zip, they would have been matched as well, because
    the period character in the file extension would be matched by the “any character”,
    too.


    # Anchors


    The caret (^) and dollar sign ($) are treated as anchors in regular expressions.
    This means they cause the match to occur only if the regular expression is found
    at the beginning of the line (^) or at the end of the line ($).'
  merge: -1
  pgno: 259
- img_proc: true
  md: '```

    [me@linuxbox ~]$ grep -h ''^zip'' dirlist*.txt

    zip

    zipcloak

    zipgrep

    zipinfo

    zipnote

    zipsplit

    [me@linuxbox ~]$ grep -h ''$zip$'' dirlist*.txt

    pzip

    gzip

    funzip

    GPG-zip

    preunzip

    prezip

    unzip

    zip

    [me@linuxbox ~]$ grep -h ''^zip$'' dirlist*.txt

    zip

    ```


    Here we searched the list of files for the string zip located at the beginning
    of the line, at the end of the line, and on a line where it is both at the beginning
    and the end of the line (i.e., by itself on the line). Note that the regular expression
    $^ (a beginning and an end with nothing in between) will match blank lines.


    # A CROSSWORD PUZZLE HELPER


    Even with our limited knowledge of regular expressions, we can do something useful.\
    My wife loves crossword puzzles, and she will sometimes ask me for help with a
    particular question. Something like, "What''s a five-letter word third is j and
    last letter is r that means...?" This kind of question could get me thinking.
    Did you know that your Linux system contains a dictionary? It does. Take a look
    in the /usr/share/dict directory, and you might find one or several. The dictionary
    files located there are just lists of words, one per line, arranged in alphabetical
    order. On my system, the word file contains just over 98,500 words. To find possible
    answers to the crossword puzzle above, we could this:


    ```

    [me@linuxbox ~]$ grep -i ''^...r$'' /usr/share/dict/words

    Major

    major

    ```


    Using this expression, we can find all the words in our dictionary file that are
    five letters long and have a j in the third position and an r in the last position.'
