  md: '# 23


    # # COMPILING PROGRAMS


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_340_0.png)


    In this chapter, we will look at how to build programs by compiling source code.
    The availability of source code is the essential freedom that makes Linux possible.
    The entire ecosystem of Linux development relies on free exchange between developers.
    For many desktop users, compiling is a lost art, It used to be quite common, but
    today, distribution providers maintain huge repositories of precompiled binaries,
    ready to download and use. At press time, the Debian repository (one of the largest
    of any of the distributions) contains more than 68,000 packages.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'So why compile software? There are two reasons.


    +   - **Availability.** Despite the number of precompiled programs in distribution
    repositories, some distributions may not include all the desired applications.
    In this case, the only way to get the desired program is to compile it from source.


    +   - **Timeliness.** While some distributions specialize in cutting-edge versions
    of programs, many do not. This means that the latest version of a program, compiling
    is necessary.


    Compiling software from source code can become complex and technical and well
    beyond the reach of many users. However, many compiling tasks are easy and involve
    only a few steps. It all depends on the package. We will look at a very simple
    case to provide an overview of the process and as a starting point for those who
    want to undertake further study.


    ```

    make Utility to maintain programs

    ```


    # # What Is Compiling?


    Simple put, compiling is the process of translating source code (the human-readable
    description of a program written by a programmer) into the native language of
    the computer''s processor.


    The computer''s processor (or CPU) works at an elemental level, executing programs
    in what is called machine language. This is a numeric code that describes extremely
    small operations, as "add this byte," "point to this location in memory," or "copy
    this byte." Each of instructions is expressed in binary (ones and zeros). The
    earliest computer programs were written using this numeric code, which may explain
    why programmers who wrote were to smoke a lot, drink gallons of coffee, and what
    need glasses.


    This problem was overcome by the advent of assembly language, which replaced the
    numeric codes with (slightly) easier-to-use character mnemonics such as CPY (for
    copy) and MOV (for move). Programs in assembly language are processed into machine
    language by a program called an assembler. Assembly language is still used today
    for specialized programming tasks, such as device drivers and embedded systems.


    We next come to what are called high-level programming languages, which allow
    the program to be less concerned with the details of what the processor is doing
    and more solving the problem by hand. Early ones (developed during the 1950s)
    include FORTRAN (designed for scientific and technical tasks) and COBOL (designed
    for business applications). Both are still in limited use today.


    While there are many popular programming languages, two predominate. Most programs
    for modern systems are written in C or C++. In the examples to follow, we will
    be compiling a C program.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'Programs written in high-level programming languages are converted into machine
    language by processing them with another program, called a compiler. Some compilers
    translate high-level instructions into assembly language and then use an assembler
    to perform the final stage of translation into machine language.


    A process often in conjunction with compiling is linking. There are many common
    tasks performed by programs, for instance, opening a file. Many programs perform
    this task, but it would be wasteful to have each program implement its own routine
    to open files. It makes more sense to have a single piece of programming that
    knows how to open files and to allow all programs it need to share. Providing
    support for common tasks is accomplished by what are called libraries. They can
    contain multiple routines, each performing some common task that multiple programs
    can share. If we look in the /lib and /usr/lib directories, we can see where many
    of them live. A program called a linker is used to form the connections between
    the output of the compiler and the libraries that the compiled program requires.
    The final result of this process is the executable program file, ready for use.


    # All Programs Compiled?


    No. As we have seen, there are programs such as shell scripts that do not require
    compiling. They are executed directly. These are written in languages known as
    scripting or interpreted languages. These languages have grown in popularity in
    recent years and include Perl, Python, PHP, Ruby, and many others.


    Scripted languages are executed by a special program called an interpreter. An
    interpreter inputs the program file and executes each instruction contained within
    it. In general, interpreted programs execute more slowly than compiled programs.
    This is because each source code instruction in an interpreted program is translated
    every time it is carried out, whereas with a compiled program, a source code instruction
    is translated only once, and this translation is permanently recorded in the final
    executable file.


    Why are interpreted languages so popular? For many programming chores, the results
    are “Fast enough,” but the real advantage is that it is generally faster to develop
    interpreted programs than compiled programs. Programs are usually developed in
    a repeating cycle of code, compile, test. As a program grows in size, the compilation
    phase of the cycle can become quite long. Interpreted languages remove the compilation
    step and speed up program development.


    # Compiling a C Program


    Let’s compile something. Before we do that, however, we’re going to need some
    tools like the compiler, the linker, and make. The C compiler used almost universally
    in the Linux environment is gcc (GNU C Compiler),'
