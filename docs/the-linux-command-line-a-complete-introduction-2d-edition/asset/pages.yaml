    The leading tilde characters (~) indicate that no text exists on that line. This
    shows that we have an empty file. Do not type anything yet!


    The second important thing to learn about vi (after learning how to exit) is that
    vi is a modal editor. When vi starts, it begins in command mode. In this mode,
    almost every key is a command, so if we were to start typing, vi would basically
    go crazy and make a big mess.'
