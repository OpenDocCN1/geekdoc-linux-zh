    subshell is being provided by a file named /dev/fd/63.

    Process substitution is often used with loops containing read. Here is an example
    of a read loop that processes the contents of a directory listing by a subshell:


    ```

    #!/bash

    ```


    ```

    while read -sub demo of process substitution attr links group size date filename;
    do cat << EOF

    ```


    ```

    Filename: $filename

    Size: $size

    Owner: $owner

    Group: $group

    Modified: $date time

    Links: $links

    Attributes: $attr

    ```


    ```

    EOF

    done <<(ls -l | tail -n +2)

    ```


    The loop executes for each line of a directory listing. The listing itself is
    produced on the final line of the script. This line redirects the output of the
    process substitution into the standard input of the loop. The tail command is
    included in the process substitution pipeline to eliminate the first line of the
