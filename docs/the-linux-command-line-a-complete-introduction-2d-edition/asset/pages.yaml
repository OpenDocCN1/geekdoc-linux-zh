  md: '(Depending on the Linux distribution, we will get a different list of files,
    possibly an empty list. This example is from Ubuntu.) This command produces—a
    list of only the files whose names begin with an uppercase letter, but with the
    following command we get an entirely different result (only a partial listing
    of the results is):


    ```

    me@linux~$ ls /usr/sbin/[A-Z]*

    /usr/sbin/biosdecode

    /usr/sbin/chat

    /usr/sbin/chpasswd

    /usr/sbin/chpasswd

    /usr/sbin/chroot

    /usr/sbin/cleanup-info

    /usr/sbin/complain

    /usr/sbin/console-kit-daemon

    ```


    Why that this? It''s a long story, but here''s the short version:

    When Unix was first developed, it knew only ASCII characters, and this feature
    reflects that fact. In ASCII, the first 32 characters (0–31) are control codes
    such as tabs, backspaces, and carriage returns. The next 32 (32–63) contain printable
    characters, including punctuation characters and the numbers 0–9. The 32 (numbers
    64–95) contain the uppercase letters and a few more punctuation symbols. The final
    31 (numbers 96–127) contain the lowercase letters and yet more punctuation symbols.
    Based on this arrangement, systems using ASCII used a *collation* that looks like:


    ```

    ABCDEFGHIABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmmnopqrstuvwxyz

    ```


    This differs from proper dictionary order, which is like this:


    ```

    aABBcCcdeEeFfGhHIiJkLlMmNOoPpQqRrSsTtUvVwXyZz

    ```


    The popularity of Unicode spread beyond the United States, there grew a need to
    support characters not found in US English. The ASCII table was expanded to use
    a full eight bits, adding characters 128–255, which accommodated many languages.
    To support this, the POSIX standards introduced a concept called a *locale*, which
    could be adjusted to select the character set needed for a particular location.
    We can see the language setting of our system using the following command:


    ```

    me@linux~$ echo $LANG

    en_US.UTF-8

    ```


    With this setting, POSIX-compliant applications will use a dictionary collation
    order rather than ASCII order. This explains the behavior of the previous commands.
    A character range of [A-Z] when interpreted in dictionary order includes all of
    the alphabetic characters except the lowercase a, here our results.'
