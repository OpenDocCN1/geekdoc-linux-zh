- img_proc: true
  md: '# THE CONSOLE BEHIND THE CURTAIN


    Even if we have no terminal emulator running, several terminal sessions continue
    to run behind the graphical desktop. We can access these sessions, called virtual
    consoles, by pressing CTRL-ALT-F1 through CTRL-ALT-F6 on most Linux distributions.
    When a session is accessed, it presents a login prompt which we can enter our
    username and password. To switch from one virtual console to another, press ALT-F1
    through ALT-F6. On most systems, we can return to the graphical desktop by pressing
    ALT--7.


    To see the current amount of free space on our disk drives, enter df.


    | Filesystem | 1K-blocks | Used | Available | Use% | Mounted on |

    |--- | --- | --- | --- | --- | --- |

    | /dev/sda2 | 1515452 | 5012392 | 9949716 | 34% | / |

    | /dev/sda5 | 59631908 | 26542424 | 30008432 | 47% | /home |

    | /dev/sda1 | 147764 | 17370 | 122765 | 13% | /boot |

    | tmpfs | 256856 | 0 | 256856 | 0% | /dev/shm |


    Likewise, to display the amount of free memory, enter the free command.


    # Ending a Terminal Session


    We can end a terminal session by closing the terminal emulator window, by entering
    the exit command at the shell prompt, or by pressing CTRL-D.


    ```

    $ exit

    ```


    # Summing Up


    This chapter marked the beginning of our journey to the Linux command line, with
    an introduction to the shell, a brief lesson on how to start and end a terminal
    session. We also saw how to issue simple commands and perform a little light command-line
    editing. That wasn''t so scary, was it?


    In the next chapter, we''ll learn a few more commands and wander around the Linux
    file system.'
  merge: -1
