- img_proc: true
  md: '# Program Source Code


    Many of the command line programs found on Unix-like systems were created to support
    system administration and software development, and text processing programs are
    no exception. Many of them are designed to solve software development problems.
    The reason text processing is important to software developers is that all software
    starts out as text. Source code, part of the program the programmer actually writes,
    is always in text format.


    # Revisiting Some Old Friends


    Back in Chapter 6 we learned about some commands that are able to accept standard
    input in addition to command line arguments. We touched on them briefly then,
    but now we will take a closer look at how they can be used to perform text processing.


    # cat


    The cat program has a number of interesting options. Many of them are used to
    help visualize text content. One example is the -A option, which is used to display
    non-printing characters in the text. There are times when we want to know whether
    control characters are embedded in our otherwise visible text. The most common
    of these are tab characters (as opposed to spaces) and carriage returns, often
    present as end-of-line characters in MS-DOS-style text files. Another common situation
    is a file containing lines of text with trailing spaces.


    Let''s create a test file using cat as a primitive word processor. To do this,
    we''ll just enter the command cat (along specifying a file for redirected output)
    and type our text, followed by ENTER to properly end the line and then CTRL-D
    to indicate that we have reached end of file. In this example, we enter a leading
    tab character and follow the line with some trailing spaces:


    ```

    @linux ~$ foo.txt

    The quick brown fox jumped over the lazy dog.

    @linux ~$

    ```


    Next, we use cat with the -A option to display the text.


    ```

    @linux ~$ cat -A foo.txt

    ^$The quick brown fox jumped over the lazy dog. $

    @linux ~$

    ```


    As we can see in the results, the tab character in our text is represented by
    ^I. This is a common notation that means CTRL-I, as it turns out, is the same
    as a tab character. We also see that a $ appears at the true end of the line,
    indicating that our text contains trailing spaces.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# MS-DOS TEXT VS. UNIX TEXT


    One of the reasons you may want to use cat to look for non-printing characters
    in text is to spot hidden carriage returns. Where do hidden carriage returns come
    from? DOS and Windows! Unix and DOS don''t define the end of a line the same way
    in text. Unix ends with a linefeed character (ASCII 10), while MS-DOS and its
    derivatives use the sequence carriage return (ASCII 13) and linefeed to terminate
    each line of text.


    There are several ways to convert files from DOS to Unix format. On many Linux
    systems, there are programs dos2unix and unix2dos, which can convert text files
    to and from DOS format. However, if you don''t have dos2unix on your system, don''t
    worry. The process of converting text from DOS to Unix format is simple; it involves
    the removal of the offending carriage returns. That is easily accomplished by
    a couple of the programs discussed later in this chapter.


    cat also has options that are used to modify text. The two most prominent are
    -n, which numbers lines, and -s, which suppresses the output of multiple lines.
    We can demonstrate this:


    ```

    @melinuxbox]$ cat > foo.txt

    The quick brown fox

    ```


    ```

    jumped over the lazy dog.

    @melinuxbox]$ cat -ns foo.txt

    1 The quick brown fox

    2

    3 jumped over the lazy dog.

    @melinuxbox]$

    ```


    In this example, we create a new version of foo.txt test file, which contains
    two lines of text separated by blank lines. After processing cat with the -ns
    options, the extra blank line is removed, and the remaining lines are numbered.
    While this is not much of a process to perform on, it is a process.


    # sort


    The sort program starts the contents of standard input, or one or more files specified
    on the command line, and sends the results to standard output. Using the same
    technique that we used with cat, we can demonstrate processing of standard input
    directly from the keyboard as follows:


    ```

    @melinuxbox]$ sort > foo.txt

    c

    b

    a

    ```'
  merge: -1
