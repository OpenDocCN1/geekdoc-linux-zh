    \ this example, we look for the longest string found within a file. When given\
    \ one or more filenames on the command line, the program uses the strings program\
    \ (which is included in the GNU binutils package) to generate a list of readable\
    \ text \"words\" in each file. The for loop processes each word in turn and determines\
    \ whether the current word is the longest found so far. When the loop completes,\
    \ the longest word is displayed.\n\nOne to note here is, contrary to our usual\
