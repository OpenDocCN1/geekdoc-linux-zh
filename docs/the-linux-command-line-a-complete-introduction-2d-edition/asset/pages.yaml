  md: "# A More Modern Version of test\n\nModern versions of bash include a compound\
    \ command that acts as an enhanced replacement for test. It uses the following\
    \ syntax:\n\n```\n[[ expression ]]\n```\n\nwhere, like test, expression is an\
    \ expression that evaluates to either a true or false result. The [[ ]] command\
    \ is similar to test (it supports all of its expressions) but adds an important\
    \ string expression.\n\n```\nstring1 =~ regex\n```\n\nThis returns true if string1\
    \ is matched by the regular expression regex. This opens up a lot of possibilities\
    \ for performing such tasks as data validation. In our earlier example of the\
    \ integer expressions, the script would fail if the constant INT contained anything\
    \ except an integer. The script needs a way to verify that the constant contains\
    \ an integer. Using [[ ]] with the =~ string expression operator, we could improve\
    \ the script this way:\n\n```\n#!/bin/bash\n\n# test-integer2: evaluate the value\
    \ of an integer.\n\nINT=5\n\nif [[ \"$INT\" =~ ^[0-9]+$ ]]; then\n  if [ \"$INT\"\
    \ -eq 0 ]; then\n    echo \"$INT is zero.\"\n  else\n    if [ \"$INT\" -lt 0 ];\
    \ then\n      echo \"$INT is negative.\"\n    else\n      echo \"$INT is positive.\"\
    \n    fi\n    if [ $((INT % 2)) -eq 0 ]; then\n      echo \"$INT is even.\"\n\
    \    else\n      echo \"$INT is odd.\"\n    fi\nelse\n  echo \"$INT is not an\
    \ integer.\" >2\n  exit 1\n```\n\nBy applying the regular expression, we are able\
    \ to limit the value of INT to only strings that begin with an optional minus\
    \ sign, followed by one or more numerals. This expression also eliminates the\
    \ possibility of empty values."
  merge: -1
  pgno: 388
- img_proc: true
  md: "Another added feature of [[ ]] is that the == operator supports pattern matching\
    \ the same pathname expansion does. Here's an example:\n\n```\n[me@linuxux ~]$\
    \ FILE=foo.bar\n[me@linuxux ~]$ if [[ $FILE == foo.* ]]; then\n echo \"FILE matches\
    \ pattern 'foo.*'\nfi\nfoo.bar matches pattern 'foo.*'\n```\n\nThis makes [[ ]]\
    \ useful for evaluating file and pathnames.\n\n# (())-Designed Integers\n\nIn\
    \ addition to the [[ ]] compound command, bash also provides the (( )) compound\
    \ command, which is useful for operating on integers. It supports a full set of\
    \ arithmetic evaluations, a subject we will cover fully in Chapter 34. (( )) is\
    \ used to perform arithmetic tests. An arithmetic test results in true if the\
    \ result of the arithmetic evaluation is non-zero.\n\n```\n[me@linuxux ~]$ if\
    \ ((1)); then echo \"It is true.\"; fi\nIt is true.\n[me@linuxux ~]$ if ((0));\
    \ then echo \"It is true.\"; fi\nIt is true.\n```\n\nUsing (( )), we can slightly\
    \ simplify the test-integer2 script like this:\n\n```\n#!/bin/bash\n\n# test-integer2a:\
    \ evaluate the value of an integer.\n\nINT=-5\n\nif [[ \"$INT\" = ^-?[0-9]+$ ]];];\
    \ then\n  if ((INT == 0)); then\n    echo \"INT is zero.\"\n  else\n    if ((INT\
    \ < 0)); then\n      echo \"INT is negative.\"\n    else\n      if (((INT % 2))\
    \ == 0)); then\n        echo \"INT is even.\"\n      else\n        echo \"INT\
    \ is odd.\"\n      fi\n    fi\n  fi\nelse\n  echo \"INT is not an integer.\" >&2\n\
    \  exit 1\n```"
  merge: -1
  pgno: 389
- img_proc: true
  md: "Notice that we use less-than and greater-than signs and that == is used to\
    \ test for equivalence. This is a more natural-looking syntax for integers. Notice\
    \ it too, because the compound command (( )) is part of the shell syntax rather\
    \ than an ordinary command and deals only with integers, it is able to recognize\
    \ variables by name and does not require expansion to be performed. We'll discuss\
    \ (( )) and the related arithmetic expansion further in Chapter 34.\n\n# Combining\
    \ Expressions\n\nIt's also to combine expressions to create more complex evaluations.\
    \ Expressions are combined using logical operators. We saw these in Chapter 17\
