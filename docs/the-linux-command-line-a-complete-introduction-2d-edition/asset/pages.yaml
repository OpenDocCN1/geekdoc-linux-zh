  md: 'machine~sized device from the computer room. In recent years, the typical desktop
    hardware configuration has become quite dynamic, and Linux has evolved to become
    more flexible than its ancestors.


    In the examples in the previous section, we took advantage of the modern Linux
    desktop''s capability to “automagically” mount the device and then determine the
    name after the fact. But what if we are managing a server or other environment
    where this does not occur? How can we figure it out?


    First, let''s look at how system names devices. If we list the contents of the
    /dev (where all devices live), we can see that there are lots of devices.


    ```

    me@linuxbox ~$ 1s /dev

    ```


    The contents of this listing reveal some patterns of device naming.

    Table 15-2 outlines a few of these patterns.


    # Table 15-2: Linux Storage Device Names


    | Pattern | Device |

    | --- | --- |

    | /dev/* | Floppy disk drives.

    | /dev/hd* | IDE (PATA) disks on older systems. Typical motherboards contain two
    IDE connectors or channels, each with a cable with two attachment points for drives.
    The first drive on the call is the master device, and the second is the slave
    device. The device names are ordered such that /dev/sda refers to the master device
    on the first channel; /dev/hdc is the master device on the second channel, and
    a trailing digit indicates the number on the device. For example, /dev/sda1 refers
    to the first partition on the first hard drive on the system, /dev/hda refers
    to the entire drive.|


    | /dev/lp* | Printers |

    | /dev/sd* | SCSI disks. On modern Linux systems, the kernel treats all disk-like
    devices (including PATA/SATA hard disks, flash drives, and USB mass devices as
    portable mobile players and digital cameras) as SCSI disks. The rest of the naming
    system is similar to the other /dev/hd* naming scheme previously described.|


    | /dev/sr* | Optical drives (CD/DVD readers and burners).|


    In addition, we see symbolic links such as /dev/cdrom, /dev/dvd, and /dev/floppy,
    which point to the device files, provided as a convenience.


    If you are working on a system that does not automatically mount removable devices,
    you can use the following technique to determine how the removable device is named
    when it is attached. First, start a real-time view of the /var/log/messages or
    /var/log/syslog file (you may require user privileges for this).


    ```

    me@linuxbox ~$ sudo tail -f /var/log/messages

    ```'
