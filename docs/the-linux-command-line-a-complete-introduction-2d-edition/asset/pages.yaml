    This is handy if we want only the contents of a directory without

    creating another layer of directories within the destination. We can think of

    it as being source/* in its outcome, but this method will copy all of the

    source directory content including the hidden files.


    As a practical example, let''s consider the imaginary external hard drive

    that we used earlier with. If we attach the drive to our system and, once

    again, it is mounted at /media/BigDisk, we can perform a useful system

    backup by first creating a directory named /backup on the external drive

    then using rsync to copy the most important stuff from our system to

    the external drive.


    ```

    [me@linuxbox ~]$ mkdir /media/BigDisk/backup

