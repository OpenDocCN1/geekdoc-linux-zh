    # # Monitoring and Controlling Print Jobs


    As Unix printing systems are designed to handle multiple print jobs from multiple
    users, CUPS is designed to do the same. Each printer is given a print queue, where
    jobs are parked until they can be psyched to the printer. CUPS supplies several
    command line programs that are used to manage print status and print queues. Like
    the lpr and lp programs, these management programs are modeled after the corresponding
    programs from the Berkeley and System V printing systems.'
