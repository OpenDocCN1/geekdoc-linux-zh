    # Putting Regular Expressions to Work


    Let''s look at some of the commands we already know and see how they can be used
    with regular expressions.


    # Validating a Phone List with grep


    In our earlier example, we looked at single phone numbers and checked them for
    proper formatting. A more realistic scenario would be checking a list of numbers,
    so let''s make a list. We''ll do this by reciting a magical incantation to the
    command line. It will be magic because we have not covered most of the commands
    involved, but worry not. We will get there in future chapters. Here is the incantation.


    ```

    [me@linuxbox~$]$ for i in {1..10}; do echo "($RANDOM:0:3)-$($RANDOM:0:3)-$($RANDOM:0:4)"
    >> phonelist.txt; done

    ```


    This command will produce a file named phonelist.txt containing 10 phone numbers.
    Each time the command is repeated, another 10 numbers are added to the list. We
    can also change the value 20 near the beginning of the command to produce more
    or fewer phone numbers. If we examine the contents of the file, however, we see
    a problem.


    ```

    [me@linuxbox~$]$ cat phonelist.txt

    (232) 298-2265

    ```'
