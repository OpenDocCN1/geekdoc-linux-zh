- img_proc: true
  md: 'rsync remote-update protocol, which allows rsync to quickly detect the differences
    between two directories and perform the minimum amount of copying required to
    bring them into sync. This makes rsync very fast and economical to use, compared
    to other kinds of copy programs.

    sync is invoked like this:


    rsync options source destination


    where source and destination are one of the following:


    +   * A local file or directory

    * A remote file or directory in the form of [user]@host:path

    * A rsync server specified with a URI of rsync://[user]@host(:port)/path


    Note that either the source or the destination must be a local file.

    Remote-to-remote copying is not supported.

    Let''s try rsync on some local files. First, let''s clean out our foo directory.


    ```

    [linuxbox] ~$ rm -rf foo/*

    ```


    Next, we''ll synchronize the playground directory with a corresponding copy in
    foo.


    ```

    [linuxbox] ~$ rsync -av playground foo

    ```


    We''ve included both the -a option (for archiving—causes recursion and preservation
    of file attributes) and the -v option (verbose output) to make a mirror of the
    playground directory within foo. While the command runs, we will see a list of
    the files and directories being copied. At the end, we will see a summary message
    like this indicating the amount of copying performed:


    ```

    sent 135759 bytes received 57870 bytes 387258.00 bytes/sec

    total size is 3230 speedup is 0.02

    ```


    If we run the command again, we will see a different result:


    ```

    [linuxbox] ~$ rsync -av playground foo

    building file list ... done

    ```


    ```

    sent 22635 bytes received 20 bytes 45310.00 bytes/sec

    total size is 3230 speedup is 0.14

    ```


    Notice there was no listing of files. This is because rsync detected that there
    were no differences between ~/playground and ~/foo/playground,'
  merge: -1
