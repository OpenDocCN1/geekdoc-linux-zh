    ftp> ls

    200 PORT command success. Consider using PASV.

    150 Here comes the directory listing.

    -rw-r--r-- 1 500 733079552 Apr 25 03:53 ubuntu-18.04-desktop-amd64.iso

    226 Directory send OK.

    ftp> lcd Desktop

