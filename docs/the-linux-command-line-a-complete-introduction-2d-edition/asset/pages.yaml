  md: '# INTRODUCTION


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_26_0.png)


    I want to tell you a story. No, not the story of how, in 1991, Linus Torvalds
    wrote the first version of the Linux kernel. You can read that story in lots of
    Linux books. Nor am I going to tell you the story of how, some years earlier,
    Richard Stallman began the GNU Project to create a free Unix-like operating system.
    That’s an important story too, but most other Linux books have that one, as well.


    No, I want to tell you the story of how you take back control of your computer.

    When I began working with computers as a college student in the late 1970s, there
    was a revolution going on. The invention of the microprocessor had made it possible
    for ordinary people like you and to actually own a computer. It’s hard for many
    people to imagine what the world was like when only big business and big government
    ran all the computers. Let’s just say, you couldn''t get much done.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Today, the world is very different. Computers are everywhere, from tiny wristwatches
    to giant data centers to everything in between. In addition to ubiquitous computers,
    we also have a ubiquitous network connecting them together. This has created a
    wondrous new age of personal empowerment and creative freedom, the last couple
    of decades something has been happening. A few corporations have been imposing
    their control over most of the world''s computers and deciding what you can and
    cannot do with them. Frankly, people from all over the world are doing something
    about it. They are fighting to maintain control of their computers by writing
    their own software. They are building Linux.


    Many people say "freedom" with regard to Linux, but I don''t think most people
    know what this freedom means. Freedom is the power to decide what your computer
    does, and the only way to have this freedom is to know what your computer is doing.
    Freedom is a computer that without secrets, one where everything can be known
    if you care enough to find out.


    # Why Use the Command Line?


    Have you ever noticed in the movies when the "superhacker”—you know, the guy who
    can break into the ultra-secure military computer in less than 30 seconds sits
    at the computer, he never touches a mouse? Because filmmakers realize that, as
    human beings, instinctively know the only way to get anything off a computer is
    by typing on a keyboard?


    Most computer users today are familiar with the *user interface (GUI)* and have
    been taught by vendors and pundits that the *command line interface (CLI)* is
    a terrifying thing of the past. This is unfortunate because a good command line
    interface is a marvelously expressive way of communicating with a computer in
    the same way the written word is for human beings. It''s said that "graphical
    interfaces make tasks easy, while command line interfaces make tasks difficult,"
    and this is still very true today.


    Since Linux is modeled after the Unix family of operating systems, it shares the
    same heritage of command line tools as Unix. Unix came into prominence during
    the early 1980s (although it was first developed a decade earlier), before the
    widespread adoption of the graphical interface and, as a result, developed an
    extensive command line interface instead. In fact, one of the strongest reasons
    early adopters of Linux chose over it, Windows NT was the powerful command line
    interface that made the "difficult tasks possible."


    # This Book Is About


    This book is a broad overview of "living" on the Linux command line. Unlike some
    books that concentrate on just a single program, such as the shell program bash,
    this book will try to convey how to get along with the'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'command line interface in a larger sense. How does it all work? What can it
    do? What''s the best way to use it?


    **This is not a book about Linux system administration.** Any serious discussion
    of the command line will invariably lead to system administration topics, this
    book touches on only a few administration issues. It will, however, prepare the
    reader for additional study by providing a solid foundation in the use of the
    command line, an essential tool for any serious system administration task.


    **This book is Linux-centric.** Many other books try to broaden their appeal by
    including other platforms like generic Unix and macOS. In doing so, they “water
    down” their content to feature only general topics. This book, on the other hand,
    covers only contemporary Linux distributions. Ninety-five percent of the content
    is useful for users of other Unix-like systems, but this book is highly targeted
    at the modern Linux command line.


    # Who Should Read This Book


    This book is for new users who have migrated from other platforms. Most like you
    are a “power user” of some version of Microsoft Windows. Perhaps your boss has
    told you to administer a Linux, or you''re entering the exciting new world of
    single board computers (SBC) such as the Raspberry Pi. You may just be a desktop
    user who is tired of all the security problems and want to give a Linux a try.
    That''s fine. All are welcome here.


    That said, there is no shortcut to Linux enlightenment. Learning the command line
    is challenging and takes real effort. It''s not that it''s hard, but that it''s
    vast. The average Linux system has thousands of programs you can employ on the
    command line. Consider yourself warned; the command line is no causal endeavour.


    On the other hand, learning the Linux command line is extremely rewarding. If
    you think you''re a “power user” now, just wait. You don''t know what real power
    is—yet. And, unlike many other computer skills, knowledge of the command line
    is long-lasting. The skills learned today will be useful 10 years from now. The
    command line survived the test of time.


    It is also assumed that you have no programming experience, but don''t worry,
    we''ll start you down that path as well.


    # What''s in This Book


    This material is presented in a carefully chosen sequence, much like a tutor sitting
    next to you to guide you along. Many authors treat this material in a “systematic”
    fashion, exhaustively covering each topic in order. This makes sense from a writer''s
    perspective but can be very confusing to new users.


    Another goal is to acquaint you with the Unix way of thinking, which is different
    from the Windows way of thinking. Along the way, we''ll go on a few side trips
    to help you understand why certain things work the way they'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'do and how they got that way. Linux is not just a piece of software; it''s
    also a small part of the larger Unix culture, which has its own language and history.
    I might throw in a rant or two, as well.


    This book is divided into four parts, each covering some aspect of the command
    line experience.


    +   - **Part 1, “Learning the Shell,”** starts our exploration of the basic language
    of the command line including such things as the structure of commands, file system
    navigation, command line editing, and finding help and documentation for commands.

    - **Part 2, “Configuration and the Environment,”** covers editing configuration
    files that control the computer''s operation from the command line.

    - **Part 3, “Common Tasks and Essential Tools,”** explores many of the ordinary
    tasks that are commonly performed from the command line. Unix-like operating systems,
    such as Linux, contain many “classic” command line programs that are used to perform
    powerful operations on data.

    - **Part 4, “Writing Scripts,”** introduces shell programming, an Admittedly rudimentary
    but easy-to-learn technique for automating many computing tasks. By learning shell
    programming, you will become familiar with concepts that can be applied to many
    other programming languages.


    # # How to Read This Book


    Start at the beginning of the book and follow it to the end. It isn''t written
    as a reference work; it''s really more like a story with a beginning, middle,
    and end.


    # # Prerequisites


    To use this book, all you will need a working Linux installation. You can get
    this in one of two ways:


    **Install Linux on a (not so new) computer.** It doesn''t matter which distribution
    you choose, though most people today start out with Ubuntu, Fedora, or OpenSUSE.
    If in doubt, try Ubuntu first. Installing a modern Linux distribution can be ridiculously
    easy or ridiculously difficult depending on your hardware. I suggest a desktop
    computer that is a couple of years old and has at least 2GB of RAM and 6GB of
    hard disk space. Avoid laptops and wireless networks if all possible, as these
    are often more difficult to get working.


    **Use a “live CD” or USB flash drive.** One of the cool things you can do with
    many Linux distributions is run them directly from a CD-ROM or USB drive without
    installing them. Just go into your BIOS setup and set your computer to boot from
    a CD-ROM drive or USB device and reboot. Using this method is a great way to test
    a computer'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'for Linux compatibility prior to installation. The disadvantage is that it
    may be slow compared to having Linux installed on your hard drive. Both Ubuntu
    and Fedora (among others) have live versions.


    Regardless of how you install Linux, you''ll need to have occasional superuser
    (i.e., administrative) privileges to carry out the lessons in this book.


    After you have a working installation, start reading and following along with
    your own computer: Most of the material in this book is "hands on," so sit down
    and get typing!


    # WHY I DON''T CALL IT "GNU/LINUX"


    In some quarters, it''s politically correct to call the Linux operating system
    "GNU/Linux operating system." The problem with "Linux" is that there is no completely
    correct way to name it because it was written by many different people in a vast,
    distributed development effort. Technically speaking, Linux is the name of the
    operating system''s kernel. The kernel is very important of course, since it makes
    the operating system go, but it''s not enough to form a complete operating system.


    Richard Stallman, the genius-philosopher who founded the Free Software movement,
    started the Free Software Foundation, formed the GNU Project, wrote the first
    version of the GNU C Compiler (gcc), created the GNU General Public License (the
    GPL), etc., etc., etc He insists that you call "GNU/Linux" to properly reflect
    the contributions of the GNU Project. While the GNU Project predicates the Linux
    kernel and the project''s contributions are extremely deserving of recognition,
    placing them in the name is unfair to everyone one who made significant contributions.
    Besides, I think "Linux/GNU" would be more technically accurate since the kernel
    boots first and everything runs on top.


    In popular usage, Linux refers to the kernel and all the other free and open source
    software found in the typical distribution, that is, the entire Linux ecosystem,
    seems to prefer one-word names like DOS, Windows, macOS, Solaris, Irix, and AIX.
    I have chosen to use the popular format. If, you prefer to use "GNU/Linux" instead,
    please perform a mental search-and-replace while reading this book. I won''t mind.


    # What''s New in the Second Edition


