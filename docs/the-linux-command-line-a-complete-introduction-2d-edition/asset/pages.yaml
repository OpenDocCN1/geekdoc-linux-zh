  md: '# 34


    # # STRINGS AND NUMBERS


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_450_0.png)


    Computer programs are all about working with data. In past chapters, we have focused
    on processing data at the file level. However, many programming problems need
    to be solved using smaller units of data such as strings and numbers.


    In this chapter, we will look at several shell features that are used to manipulate
    strings and numbers. The shell provides a variety of parameter expansions that
    perform string operations. In addition to arithmetic expansion (which we touched
    upon in Chapter 7), there is a well-known command line program called bc, which
    performs higher-level math.


    # ## Parameter Expansion


    Though parameter expansion came up in Chapter 7, we did not cover it in detail
    because most parameter expansions are used in scripts rather than on the command
    line. We have already worked with some forms of parameter expansion, for example,
    shell variables. The shell provides many more.'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'It''s always good practice to enclose parameter expansions in double quotes
    to prevent unwanted word splitting, unless there is a specific reason not to.
    This is especially true when dealing with filenames since they can often include
    embedded spaces and assorted nastiness.


    # Basic Parameters


    The simplest form of parameter expansion is reflected in the ordinary use of variables.
    Here''s an example:


    ```

    $a

    ```


    When expanded, this becomes whatever the variable contains. Simple parameters
    may also be surrounded by braces.


    ```

    ${a}

    ```


    This has no effect on the expansion but is required if the variable is adjacent
    to other text, which may confuse the shell. In this example, we attempt to create
    a file by appending the string _file to the contents of the variable a:


    ```

    [me@linux ~]$a="foo"

    [me@linux ~]$ echo "$a_file"

    ```


    If we perform this sequence of commands, the result will be nothing because the
    shell will try to expand a variable named a_file rather than a. This problem can
    be solved by adding braces around the “real” variable name.


    ```

    [me@linux ~]$ echo "${a}_file"

    foo_file

    ```


    We have also seen that positional parameters greater than nine can be accessed
    by surrounding the number in braces. For example, to access the eleventh positional
    parameter, we can do this:


    ```

    ${11}

    ```


    # Expansions to Manage Empty Variables


    Several parameter expansions are intended to deal with nonexistent and empty variables.
    These expansions are handy for handling missing positional parameters and assigning
    default values to parameters. Here is one expansion:


    ```

    ${parameter:-word}

    ```'
  merge: -1
  pgno: 451
- img_proc: true
  md: 'If parameter is unset (i.e., does not exist) or is empty, this expansion results
    in the value of word. If parameter is not empty, the expansion results in the
    value of parameter.


    ```

    [me@linuxbox ~] foo=

    [me@linuxbox ~] echo ${foo:-substitute value if unset}

    substitute if unset

    [me@linuxbox ~] echo $foo

    ```


    ```

    [me@linuxbox ~] foo=bar

    [me@linuxbox ~] echo ${foo:-substitute value if unset}

    bar

    [me@linuxbox ~] echo $foo

    ```


    Here is another expansion, in which we use the equal sign instead of a dash:

    ${parameter=word}


    If parameter is unset or empty, this expansion results in the value of word. In
    addition, the value of word is assigned to parameter. If parameter is not empty,
    the expansion results in the value of parameter.


    ```

    [me@linuxbox ~] foo=

    [me@linuxbox ~] echo ${foo:"default value if unset"}

    default if unset

    [me@linuxbox ~] echo $foo

    [me@linuxbox ~] echo $foo-bar

    [me@linuxbox ~] echo ${foo:"default value if unset"}

    bar

    [me@linuxbox ~] echo $foo

    ```


    > Positional and other special parameters cannot be assigned this way.


    Here we use a question:

    ${parameter?word}


    If parameter is unset or empty, this expansion causes the script to exit with
    an error, and the contents of word are sent to standard error. If parameter is
    not empty, the expansion results in the value of parameter.


    ```

    [me@linuxbox ~] foo=

    [me@linuxbox ~] echo ${foo?"parameter is empty"}

    bash: foo: parameter is empty

    [me@linuxbox ~] echo $?

    ```'
