    # How a Process Works


    When a system starts up, the kernel initiates a few of its own activities as processes
    and launches a program called init. init, in turn, runs a series of shell scripts
    (located in /etc) called init scripts, which start all the system services. Many
    of these services are implemented as daemon programs, programs that just sit in
    the background and do their thing without having any user interface. So, even
    if we are not logged in, the system is at least a busy performing routine stuff.


    The fact that a program can launch other processes is expressed in the process
    scheme as a parent process producing a child process.

    The kernel maintains information about each process to help things organized.
    For example, each process is assigned a number called a process ID (PID). PIDs
    are assigned in ascending order, with init always getting PID 1. The kernel also
    keeps track of the memory assigned to each process, as well as the processes''
    readiness to resume execution. Like files, processes also have owners and user
    IDs, and so on.


    # Viewing Processes


    The most used command to view processes (there are several) is ps. The ps program
    has a lot of options, but in its simplest form it is ps like this:


    ```

    [me@linux ~$ ps

    PID TTY TIME CMD

    5198 pts/1 00:00:00 bash

    1029 pts/1 00:00:00 ps

    ```


    The result in example lists two processes, process 5198 and process 10129, which
    are bash and ps, respectively. As we can see, by default, ps doesn''t show us
    very much, just the processes associated with the current terminal session. To
    see more, we need add some options; however, before we do that, let''s look at
    the other fields produced by ps. TTY is for "teletype" and refers to the controlling
    terminal for the process. The TIME is the amount of CPU time consumed by the process.
    As we can see, neither process makes the computer very hard.

    If we add an option, we can get a bigger picture of what the system is doing.


    ```

    [me@linux ~$ ps x

    PID TTY STAT TIME COMMAND

    ```'
