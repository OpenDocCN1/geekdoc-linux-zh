    going to demonstrate the solution to a common problem—setting up a shared directory.
    Imagine that we have two users named bill and karen. Both have music collections
    and want to set up a shared directory, where they each store their music files
    as Ogg Vorbis or MP3. User bill has access to superuser privileges via sudo.


