    The sed command is far the most commonly used editing command. We will demonstrate
    just some of its power by performing an edit on our distros.txt file. We discussed
    earlier how the date field in distros.txt was not in "computer-friendly" format.
    When the date is formatted MM/DD/YYYY, it would be better (for ease of sorting)
