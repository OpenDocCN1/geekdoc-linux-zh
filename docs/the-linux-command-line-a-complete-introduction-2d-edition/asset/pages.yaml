    There is a zless program, too. It performs the same function as the previous pipeline.


    # bzip2


    The bzip2 program, by Julian Seward, is similar to gzip but uses a different compression
    algorithm that achieves higher levels of compression at the cost of compression
    speed. In most regards, it works in the same fashion as gzip. A file compressed
    with bzip2 is denoted with the extension .bz2.


    ```

    [me@linuxbox ~]$ ls -l /etc > foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw-r--r-- 1 me 15738 2018-10-17 13:51 foo.txt

    [me@linuxbox ~]$ bzip2 foo.txt

    [me@linuxbox ~]$ ls -l foo.txt.bz2

    -rw-r--r-- 1 me 2792 2018-10-17 13:51 foo.txt.bz2

    [me@linuxbox ~]$ bunzip2 foo.txt.bz2

    ```'
