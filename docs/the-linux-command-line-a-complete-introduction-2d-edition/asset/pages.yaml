  md: '# 29


    # FLOW CONTROL: LOOPING

    WITH WHILE/UNTIL


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_406_0.png)


    In the previous chapter, we developed a menu-driven program to produce various
    kinds of system information. The program works, but it still has a significant
    usability problem. It executes only a single choice and then terminates. Even
    worse, if an invalid selection is made, the program terminates with an error,
    without giving the user an opportunity to try again. It would be better if we
    somehow construct the program so that it could repeat the menu display and selection
    over and over, until the user chooses to exit the program.


    In this chapter, we will look at a programming concept called looping, which can
    be used to make portions of programs repeat. The shell provides three compound
    commands for looping. We will look at two of them in this chapter and the third
    in a later chapter.'
  merge: -1
  pgno: 406
- img_proc: true
  md: "# Looping\n\nDaily life is full of repeated activities. Going to work each\
    \ day, walking the dog, and slicing a carrot are all tasks that involve repeating\
    \ a series of steps. Let's consider slicing a carrot. If we express this activity\
    \ in pseudocode, it might look something like this:\n\n+   1. Get cutting board.\n\
    2. Get knife.\n3. Place carrot on cutting board.\n4. Lift knife.\n5. Advance carrot.\n\
    6. Slice carrot.\n7. If entire carrot sliced, then quit; else go to step 4.\n\n\
    Steps 4 through 7 form a loop. The actions within the loop are repeated until\
    \ the condition, \"entire carrot sliced,\" is reached.\n\n# while\n\nbash can\
    \ express a similar idea. Let's say we wanted to display five numbers in sequential\
    \ order from 1 to 5. A bash script could be constructed as follows:\n\n```\n#!/bin/bash\n\
    \n# while-count: display a series of numbers\n\ncount=1\n\nwhile [[ \"$count\"\
    \ -le 5 ]];\n  echoecho \"$count\"\n  count=$((count + 1))\ndone\necho \"Finished.\"\
    \n```\n\n> When executed, this script displays the following:\n\n```\n[me@linuxbox\
    \ ~]$ while-count\n1\n2\n3\n4\n5\nFinished.\n```\n\n> The syntax of the while\
    \ command is as follows:\n\n```\nwhile commands; do commands; done\n```"
  merge: -1
  pgno: 407
- img_proc: true
  md: "Like if, while evaluates the exit status of a list of commands. As long as\
    \ the exit status is zero, it performs the commands inside the loop. The previous\
    \ script, the variable count is created and assigned an initial value of 1. The\
    \ while command evaluates the exit status of the ([]) compound command. As long\
    \ as the ([]) command returns an exit status of zero, the commands within the\
    \ loop are executed. At the end of each cycle, the ([]) command is repeated. After\
    \ 5 iterations of the loop, value of count has increased to 6, the ([]) command\
    \ no longer returns an exit status of zero, and the loop terminates. The program\
    \ continues with the next statement following the loop.\n\nWe use a while loop\
    \ to improve the read-menu program from the previous chapter.\n\n```\n#!/bin/bash\n\
    ```\n\n# while-menu: a menu driven system information program\n\nDELAY=3 # $ Number\
    \ of seconds to display results\n\n```\nwhile [ \"$REPLY\" != 0 ]]; do\n  clear\n\
    \  cat <<_EOF_\n    Please Select:\n    1. Display System Information\n    2.\
    \ Display Disk Space\n    3. Display Home Space Utilization\n    0. Quit\n```\n\
    \n```\nEOF\nread -p \"Enter selection [0-3] > \"\n```\n\n```\nif [ \"$REPLY\"\
    \ ~ ^[0-3]$$ ]; then\n  if [ \"$REPLY\" == 1 ]; then\n    echo \"Hostname: $HOSTNAME\"\
    \n    uptime\n    sleep \"$DELAY\"\n  fi\n  if [ \"$REPLY\" == 2 ]; then\n   \
    \ df -h\n    sleep \"$DELAY\"\n  fi\n  if [ \"$REPLY\" == 3 ]; then\n    if [\
    \ \"$($id -u\") -eq 0 ]; then\n      echo \"Home Space Utilization (All Users)\"\
    \n      du -sh /home/*\n    else\n      echo \"Home Space Utilization ($USER)\"\
    \n      du -sh $HOME\n    fi\n  fi\n```\n\n```\nsleep \"$DELAY\"\n```"
  merge: -1
  pgno: 408
- img_proc: true
  md: "```\nelse\necho \"Invalid entry.\"\nsleep \"$DELAY\"\n```\n\n```\ndone\necho\
    \ \"Program terminated.\"\n```\n\nBy enclosing the menu in a while loop, we are\
    \ able to have as long as repeat the menu display after each selection. The loop\
    \ continues as long as REPLY is not equal to 0 and the menu is displayed again,\
    \ giving the user the opportunity to make another selection. At the end of each\
    \ action, a sleep command is executed, so the program will pause for a few seconds\
    \ to allow the results of the selection to be seen before the screen is cleared\
    \ and the menu is replayed. Once REPLY is equal to 0, indicating the \"quit\"\
    \ selection, the loop terminates, and execution continues with the line following\
    \ done.\n\n# Breaking Out of a Loop\n\nbash provides two builtin commands that\
    \ can be used to control program flow inside. The break command immediately terminates\
    \ a loop, and program control resumes with the next statement following the loop.\
    \ The continue command causes the remainder of the loop to be skipped, and program\
