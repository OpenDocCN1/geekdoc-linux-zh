  md: 'Of particular concern are leading hyphens. For example, it''s perfectly legal
    to have a filename named -rf ~. Consider for a moment what happens when that filename
    is passed to rm.


    To defend against this problem, we want to change our rm command in the file deletion
    script from:


    ```

    rm *

    ```


    to the following:


    ```

    rm ./*

    ```


    This will prevent a filename starting with a hyphen from being interted as a command
    option. As a general rule, always precede wildcards (such as *) with . / to prevent
    misinterpretation by commands. This includes things like *.pdf and ???.mp3, for
    example.


    # PORTABLE FILENAMES


    To ensure that a filename is portable between multiple platforms (i.e., different
    types of computers and operating systems), care be taken to limit which characters
    are included in a filename. There is a standard called the POSIX Portable Filename
    Character Set that can be used to maximize the chances that a filename will work
    across different systems. The standard is pretty simple. The only characters allowed
    are the uppercase letters A-Z, the lowercase letters a-z, the numerals 0-9, period
    (.), hyphen (-), and underscore (_). The standard suggests that filenames not
    begin with a hyphen.


    # Verifying Input


    A general rule of good programming is that if a program accepts input, it must
    be able to deal with anything it receives. This usually means that input must
    be carefully screened to ensure that only valid input is accepted for further
    processing. We saw an example of this in the previous chapter when we studied
    the read command. One script contained the following test to verify a menu selection:


    ```

    [[ $REPLY =~ ^[0-3]$ ]]

    ```


    This test is very specific. It will return a zero exit status only if the string
    entered by the user is a numeral in the range of zero to three. Nothing else will
    be accepted. Sometimes these kinds of tests can be challenging to write, but the
    effort is necessary to produce a high-quality script.'
