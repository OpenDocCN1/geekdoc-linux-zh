  md: 'by bulk copying of the repository. One of these repositories is kept at Duke
    University; we could mirror it using our local copy of rsync and their rsync server
    like this:


    ```

    [me@linuxbox]$ mkdir fedora-devel

    [me@linuxbox]$ rsync -av --delete rsync://archive.linux.duke.edu/fedora/linux/development/rawhide/Everything/x86_64/os/
    fedora-devel

    ```


    In this example, we use the remote rsync server, which consists of a protocol
    (rsync://), followed by the remote hostname (archive.linux.duke.edu), followed
    by the pathname of the repository.


    # Summing Up


    We''ve looked at the common compression and archiving programs used on Linux and
    other Unix-like operating systems. For archiving files, the tar/gzip combination
    is the preferred method on Unix-like systems, while zip/unzip is used for interoperability
    with Windows systems. Finally, we looked at the rsync program (a personal favorite),
    which is very handy for efficient synchronization of files and directories across
    systems.'
