    # User-Defined Actions


    In addition to the predefined actions, we can invoke arbitrary commands. The traditional
    way of doing this is with the -exec action. This me action works like this:


    ```

    -exec command { };

    ```


    Here, command is the name of a command, {} is a symbolic representation of the
    current pathname, the semicolon is a required delimiter indicating the end of
    the command. Here''s an example of using -exec to act like the -delete action
    discussed earlier:


    ```

    -exec rm {''} '';

    ```


    Again, because the brace and semicolon characters have special meaning to the
    shell, they must be quoted or escaped.

    ''s also possible to execute a user-defined action interactively. By using the
    -ok action in -exec, the user is prompted for execution of each specified command.


    ```

    find -type f -name ''foo*'' -ok ls -1 ''{}'' '';

    < ls ... /home/me/bin/foo > ? y

    -fwxrxr-x -1 me 2027-10-29 18:44 /home/me/bin/foo

    < ls ... /home/me.foo.txt > ? y

    -Iw-I-- -1 me 2016-09-19 12:53 /home/me/foo.txt

    ```


    In this example, we search for files starting with the string foo and execute
    the command ls -1 each time one is found. Using the -ok action prompts the user
    before the ls command is executed.


    # Improving Efficiency


    When the -exec action is used, it launches a new instance of the specified command
    each time a matching file is found. There are times when we might prefer to combine
    all of the search results and launch a single instance of the command. Rather
    than executing the commands like this:


    ```

    ls -1 file1

    ls -1 file2

    ```'
