    # Finding Ugly Filenames with find


    The command supports a test based on a regular expression. There is an important
    consideration to keep in mind when using regular expressions in find vers grep.
    Whereas grep will print a line when the line contains a string that matches an
    expression, find requires that the pathname exactly matches the regular expression.
    In this example, we will use find with a regular expression to find every pathname
    that contains any character that is not a member of the following:


    ```

    [_./0-9a-zA-Z-]

    ```


    Such a scan would reveal pathnames that contain embedded spaces and other potentially
    offensive characters.


    ```

    me[linux~]$ $ find -regex ''[^_./0-9a-zA-Z].*''

    ```


    Because of the requirement for an exact match of the entire pathname, we use .*
    at both ends of the expression to match zero or more instances of any character.
    In the middle of the expression, we use a negated bracket expression containing
    our set of acceptable pathname characters.'
