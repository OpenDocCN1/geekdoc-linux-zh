  md: "# SHELL FUNCTIONS IN YOUR .BASHRC FILE\n\nShell functions make excellent replacements\
    \ for aliases and are actually the preferred method of creating small commands\
    \ for personal use. Aliases are limited in the kind of commands and shell features\
    \ they support, whereas shell functions allow anything that can be scripted. For\
    \ example, if we liked the report_disk_space shell function that we developed\
    \ for our script, we could create a similar function named ds for our .bashrc\
    \ file:\n\n```\nds () {\n  echo \"Disk Space Utilization For $HOSTNAME\"\n  df\
    \ -h\n}\n```\n\n# Summing Up\n\nIn this chapter, we introduced a common method\
    \ of program design called top-down design, and we saw how shell functions are\
    \ used to build the stepwise refinement that it requires. We also saw how local\
    \ variables can be used to make shell functions independent from one another and\
    \ from the program in which they are placed. This makes it possible for shell\
    \ functions to be written in a portable manner and to be reusable by allowing\
    \ them to be placed in multiple programs; this is a great saver."
