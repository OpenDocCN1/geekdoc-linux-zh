  md: '# SCRIPT


    In addition to the command history feature in bash, most Linux distributions include
    a program called script that can be used to record an entire shell session and
    store it in a file. The basic syntax of the command is as follows:


    ```

    script file

    ```


    where file is the name of the file used for storing the recording. If no file
    is specified, the typescript is used. See the script man page for a complete list
    of the program''s options and features.


    # Summing Up


    In this chapter, we covered some of the keyboard tricks that the shell provides
    to help hardcore typists reduce their workloads. As time goes by and we become
    more involved with the command line, we can refer back to this chapter to pick
    up more of these tricks. For now, consider them optional and potentially helpful.'
