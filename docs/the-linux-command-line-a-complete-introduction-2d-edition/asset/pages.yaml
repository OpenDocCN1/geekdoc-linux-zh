  md: '# UBUNTU AND SUDO


    One of the recurrent problems for regular users is how to perform certain tasks
    that require superuser privileges. These tasks include installing and updating
    software, editing system configuration files, and accessing devices. In the Windows
    world, this is often done by giving users administrative privileges. This allows
    users to perform these tasks. However, it also enables programs executed by the
    user to have the same capabilities. This is desirable in most cases, but it also
    permits malware (malicious software) such as viruses to have free of the computer.


    In the Unix world, there has always been a larger division between regular users
    and administrators, owing to the multiuser heritage of Unix. The approach in Unix
    is to grant superuser privileges only when needed. To do this, the su and sudo
    commands are commonly used.


    Up until a few of years ago, Linux distributions relied on sudo for this purpose.
    sudo didn''t require the configuration that required, and having a root account
    is traditional in Unix. This introduced a problem. Users tempted to operate as
    root unnecessarily. In fact, some users operated their systems as root exclusively
    because it does away with all annoying "permission denied" messages. This is how
    you reduce the security of a Linux system to that of a Windows system. Not a good
    idea.


    When Ubuntu was, its creators took a different task. By default, Ubuntu disables
    logins to the root account (by failing to set a password for the account) and
    instead uses sudo to grant superuser privileges. The initial user account is granted
    full access to superuser privileges via sudo and may grant similar powers to subsequent
    user accounts.


    # chown: Change File Owner and Group


    The chown command is used to change the owner and group owner of a file or directory.
    Superuser privileges are required to use this command. The syntax of chown looks
    like this:


    ```

    chown [owner][[:group]] file...

    ```


    chown can change the file owner and/or the file group owner depending on the first
    argument of the command. Table 9-7 provides some examples.


    # Table 9-7: chown Argument Examples


    | Argument | Results |

    | --- | --- |

    | bob | Changes the ownership of the file from its current owner to user bob.
    |

    | bob:users | Changes the ownership of the file from its current owner to user
    bob and changes the file group owner to group users. |


    Chapter 9'
  merge: -1
  pgno: 125
- img_proc: true
  md: '| Argument | Results |

    | :admins | Changes the group owner to the group admins. The file owner is unchanged.
    |

    | bob | Changes the file owner from the current owner to user bob and changes
    the group owner to the login group of user bob. |


    Let''s say we have two users: jan, who has access to superuser privileges, and
    tony, who does not. Janet wants to copy a file from her home directory to the
    home directory of tony. Because jan wants to be able to edit the file, jan changes
    the ownership of the copied file to tony.


    ```

    $janet@linuxbox ~$ sudo cp myfile.txt "tony"

    $janet@linuxbox ~$ sudo -l ~/tony/myfile.txt

    -rw-r-- 1 root root 2018-03-20 14:30 /home/tony/myfile.txt

    $janet@linuxbox ~$ sudo chown "tony"

    $janet@linuxbox ~$ sudo -l ~/tony/myfile.txt

    -rw-r-- 1 tony tony 2018-03-20 14:30 /home/tony/myfile.txt

    ```


    Here we use sudo to copy the file from her home directory to the home directory
    of tony. Next, janet changes the ownership of the file in the root (a result of
    using sudo). Using the trailing colon in the first argument, janet also changed
    the group ownership of the file to the login group of tony, which happens to be
    group.


    Notice that after the first use of sudo, janet was not prompted for password.
    This is because sudo, in most configurations, "trusts" for ever its timer runs
    out.


    # chgrp: Change Group Ownership


    In versions of Unix, the chown command changed only file ownership, not group
    ownership. For purpose, a separate command, chgrp, was used. It works the same
    way as chown, except for being more limited.


    # Exercising Our Privileges


