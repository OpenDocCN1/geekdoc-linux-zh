  md: '# 13


    # # CUSTOMIZING THE PROMPT


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_176_0.png)


    In this chapter, we will look at a seemingly trivial detail—our shell prompt.
    This examination will reveal some of the inner workings of the shell and the terminal
    emulator program.


    Like many things in Linux, the shell prompt is highly configurable, and we have
    we pretty much taken it for granted, the prompt is a really useful device once
    we learn how to control it.


    # ## Anatomy of a Prompt


    Our default prompt looks something like this:


    ```

    ```me@linuxbox ~$```

    ```


    Notice that it contains our username, our hostname, and our current working directory,
    but how did it get that way? Very simply, it turns out. The prompt is defined
    by an environment variable named PS1 (short for "prompt string 1"). We can view
    the contents of PS1 with the echo command.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '```

    [me@linuxbox ~]$ echo $PS1

    \u@\h \W\$

    ```


    Don''t worry if your results are not the same as this example. Every Linux distribution
    defines the prompt string a little differently, some quite exotically.


    From the results, we can see that PS1 contains a few of the characters we see
    in our prompt such the brackets, the at-sign, and the dollar sign, but the rest
    are merely. The astute among us will recognize these as backslash-escaped special
    characters like those we saw in Chapter 7. Table 13-1 provides a partial list
    of the characters that the bash treats specially in the prompt string.


    # Table 13-1: Escape Codes Used in Shell Prompts


    | Sequence | Value displayed |

    | --- | --- |

    | \a | ASCII bell. This makes the computer beep when it is encountered. |

    | \d | Current date in day, month, date format. For example, "Mon May 26." |

    | \h | Hostname of the local machine minus the trailing domain name. |

    | \j | Number of jobs running in the current shell session. |

    | \l | Name of the current terminal device. |

    | \n | A newline character. |

    | \r | A carriage return. |

    | \s | Name of the shell program. |

    | \t | Current time in 24-hour hours:minutes:seconds format. |

    | \T | Current time in 12-hour format. |

    | \@ | Current time in 12-hour AM/PM format. |

    | \A | Current time in 24-hour hours:minutes format. |

    | \u | Username of the current user. |

    | \v | Version number of the shell. |

    | \V | Version and release numbers of the shell. |

    | \w | Name of the current working directory. |

    | \! | History number of the current command. |

    | \# | Number of commands entered during this shell session. |

    | \$ | This displays a $ character unless we superuser privileges. In that case,
    it displays a $ instead. |

    | \[ | Signals the start of a series of one or more non-printing characters. This
    is used to embed non-printing control characters that terminate the emulator in
    some way, as moving the cursor or changing text colors. |

    | \] | Signals the end of a non-printing character sequence. |'
