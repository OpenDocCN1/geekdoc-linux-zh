- img_proc: true
  md: '# AN SSH CLIENT FOR WINDOWS?


    Let''s say you are sitting at a Windows machine but you need to log in to your
    Linux server and get some real work done; what do you do? Get an SSH client program
    for your Windows box, of course There are a number of these. The most popular
    one is probably PuTTY by Simon Tatham and his team. The PuTTY program displays
    a terminal window and allows a Windows user to open an SSH (or telnet) session
    on a remote host. The program also provides analogs for the scp and sftp programs.


    PuTTY is available at www.chiark.greenend.org.uk/~sgtatham/putty/.


    # Summing Up


    In this chapter, we surveyed the field of networking tools found on most Linux
