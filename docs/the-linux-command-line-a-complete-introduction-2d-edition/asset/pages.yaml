  md: '# wget


    Another popular command-line program for file downloading is wget. It is useful
    for downloading content from both web and FTP sites. Single files, multiple files,
    and even entire sites can be downloaded. To download the first page of linuxcommand.org,
    we could do this:


    ```

    [me@linuxbox ~$] wget http://linuxcommand.org/index.php

    --12:02:51-- http://linuxcommand.org/index.php

    => ''index.php''

    Resolving linuxcommand.org... 66.35.250.210]:80... connected.

    HTTP request sent, awaiting response... 200 OK

    Length: unspecified [text/html]

    ```


    ```

    [ <=> ] 3,120 --K/s ''index.php'' saved [3120]

    ```


    The program''s many options allow wget to recursively download, download files
    in background (allowing you to log off continue downloading), and complete the
    download of a partially downloaded file. These features are well documented in
    its better-than-average man page.


    # Secure Communication with Remote Hosts


    For many years, Unix-like operating systems have had the capability to be administered
    remotely via a network. In the early days, the general adoption of the Internet,
    there were a couple of popular programs used to log in remote hosts. These were
    the login and telnet programs. These programs, however, suffer from the same fatal
    flaw that the ftp program does; they transmit all communications (including login
    names and passwords) in cleartext. This makes them wholly inappropriate for use
    in the Internet Age.


    # ssh


    To address this problem, a new protocol called Secure Shell (SSH) was developed.
    SSH solves the two problems of secure communication with a remote host.


    +   * It authenticates the remote host is who it says it is (thus preventing so-called
    man-in-the-middle attacks).

    * It encrypts all of the communications between the local and remote hosts.


    SSH consists of two parts. An SSH server runs on the remote host, listening for
    incoming connections, by default, on port 22, while an SSH client uses on the
    local system to communicate with the remote server.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Most Linux distributions ship an implementation of SSH called OpenSSH from
    the OpenBSD project. Some distributions include both the client and the server
    packages by default (for example, Red Hat), others (such as Ubuntu) supply only
    the client. To enable a system to receive remote connections, it must have the
    OpenSSH-server package installed, configured, and running, and if the system is
    either running or behind a firewall) it must allow incoming network connections
    over TCP port 22.


    # TIP


    If you don''t have a remote system to connect to but want to try these examples,
    make sure the OpenSSH-server package is installed on your system and use localhost
    as the name of the remote host. That way, your machine will create network connections
    with it.


    The SSH client program to connect to remote servers is called, appropriately enough,
    ssh. To connect to a remote host named remote-sys, you use the ssh client program
    like:


    ```

    @linuxux ~$ ssh remote-sys

    The authenticity of host ''remote-sys (192.168.1.4)'' can''t be established.

    RSA key fingerprint is 41:ed:7a:df:23:19:bf:3c:a5:17:bc:61:b3:7f:d9:bb:

    Are you sure you want to continue connecting (yes/no)?

    ```


    The first time the connection is attempted, a message is displayed that the authenticity
    of the remote host cannot be established. This is because the client program has
    never seen this remote host before. To accept the credentials of the remote host,
    enter yes when prompted. Once the connection is established, the user is prompted
    for a password.


    Warning: Permanently added ''remote-sys,192.168.1.4'' (RSA) to the list of known
    hosts.

    me@remote-sys''s password:


    After the password is successfully entered, we receive the shell prompt from the
    remote system.


    ```

    Last login: Sat Aug 25 13:00:48 2018

    me@remote-sys~$

    ```


    The remote session continues until the user enters the exit command at the remote
    shell prompt, closing the remote connection. At this point, the local shell session
    resumes, and the local shell prompt reappears.


    ```

    @linuxux ~$ ssh bob@remote-sys

    bob@remote-sys''s password:

    Last login: Sat Aug 25 13:03:21 2018

    [bob@remote-sys~$]

    ```'
