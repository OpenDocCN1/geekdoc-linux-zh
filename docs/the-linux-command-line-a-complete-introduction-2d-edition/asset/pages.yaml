    This is not a complete list. The find man page has all the details.


    # Operators


    Even with all the tests that find provides, we might still need a better way to
    describe the logical relationships between the tests. For example, if we needed
    to determine whether all the files and subdirectories in a directory had secure
    permissions? We would look for all the files with permissions that are not 0600
    and the directories with permissions that are not 0700. Fortunately, find provides
    a way to combine tests using logical operators to create more logical relationships.
    To the aforementioned test, we would do:


    ```

    me@linuxbox~$ find ~ \-type f -not -perm 0600 \-or \-type d -not -perm 0700

    ```


    Yikes! That looks weird. What is all this stuff? Actually, the operators that
    are not complicated once you get to know them. Table 17-4 describes the logical
    operators used with find.


    # Table 17-4: find Logical Operators


    | Operator | Description |

    | -and | Match if the tests on both sides of the operator are true. This can be
    shortened to -a. Note that when no operator is present, -and is implied by default.
    |

    | -or | Match if a test on one side of the operator is true. This can be shortened
    to -o. |

    | -not | Match if the test following the operator is false. This can be abbreviated
    with an exclamation point! |


    Group tests and operators together to form large expressions. This is used to
    control the precedence of logical evaluations. find evaluates from left to right.
    It is often necessary to override the default evaluation order to obtain the desired
    result. Even if not needed, it is helpful to use the grouping characters to increase
    the readability of the command. Note that since parentheses have special meaning
    to the shell, they must be quoted when using them on the command line to allow
    them to be passed as arguments to find. Usually the backslash character is used
    to escape them.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'With this list of operators in hand, let''s deconstruct our find command. When
    viewed from the uppermost level, we see that our tests are arranged as two groupings
    separated by an -or operator.


    ```

    ( expression 1 ) -or ( expression 2 )

    ```


    This makes sense because we are searching for files with a certain set of permissions
    and directories with a different set. If we are looking for both files and directories,
    why do we use -and instead of -or? As find scans through the files and directories,
    each one is evaluated to whether it matches the specified tests. We want to know
    whether it is either a file with bad permissions or a directory with bad permissions.
    It can''t be both at the same time. So if we expand the grouped expressions, we
    can see it the this way:


    ```

    ( file with bad permissions ) -or ( directory with bad permissions )

    ```


    Our next challenge is to test for "bad permissions." How do we do that? We don''t.
    What will we test for "not good permissions" because we know what "good permissions"
    are. In the case of files, we define good as as 0600, and for directories, we
    define it as 0700. The expression that will test for "not good" permissions is
    as follows:


    ```

    -type f -and -not -permissions 0600

    ```


    For directories it is as follows:


    ```

    -type d -and -not -permissions 0700

    ```


    As noted in Table 17-4, the -and operator can be safely removed because it is
    implied by default. So if we put this all together, we get our final command.


    ```

    find ~ ( -type f -not -permissions 0600 ) -or ( -type d -not -permissions 0700
    )

    ```


    However, because the parentheses have special meaning to the shell, we must escape
    them to prevent the shell from trying to interpret them. Preceding each one with
    a backslash character does the trick.


    There is another feature of logical operators that is important to understand.
    Let''s say that we have two expressions separated by a logical operator.


    ```

    expr1 -operator expr2

    ```


    In all cases, expr1 will always be performed; however, the operator will determine
    whether expr2 is performed. Table 17-5 outlines how it works.'
  merge: -1
  pgno: 232
