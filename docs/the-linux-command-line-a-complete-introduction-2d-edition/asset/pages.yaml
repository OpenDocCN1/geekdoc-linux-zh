  md: 'explain things to the humans. Using the editor, change our additions to look
    like this:


    # # Change umask to make directory sharing easier


    ```

    umask 0002

    ```


    # # Ignore duplicates in command history and increase

    # history story to 1000 lines


    ```

    export HISTCONTROL=ignoredups

    export HISTSIZE=1000

    ```


    # # Add some helpful aliases


    ```

    alias 1ls=''ls -d * --color=auto''

    alias 1ls=''ls -l --color=auto''

    ```


    Ah, much better! With our changes complete, press CTRL-O to save our modified
    .bashrc file, and press CTRL-X to exit nano.


    # WHY COMMENTS ARE IMPORTANT


    Whenever you modify configuration files, it''s a good idea to add some comments
    to document your changes. Sure, you''ll probably remember what changed tomorrow,
    but what about six months from now? Do yourself a favor and add some comments.
    While you''re at it, it''s not a bad idea to keep a log of what you make.


    Shell scripts and bash startup files use a symbol to begin a comment. Other configuration
    files may use other symbols. Most configuration files will have comments. Use
    them as a guide.


    You will often see lines in configuration files that are commented out to prevent
    them from being used by the affected project. This is done to give the reader
    suggestions for possible configuration choices or examples of correct configuration
    syntax. For example, the .bashrc file of Ubuntu 18.04 contains lines:


    ```

    # some more aliases

    #alias 1ls=''ls -1''

    #alias 1la=''ls -A''

    #alias 1ls=''ls -CF''

    ```


    The last three lines are valid alias definitions that have been commented out.
    If you remove the leading # symbols from these lines, a technique called uncommenting,
    you will activate the aliases. Conversely, if you add a symbol to the beginning
    of a line, you can deactivate a configuration line while preserving the information
    it contains.


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_155_0.png)'
