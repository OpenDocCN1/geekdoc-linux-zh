    expressions, several of the characters in our regular expression will be taken
    as literals, rather than as metacharacters. We can solve both problems with a
    liberal application of backslashes to escape the offending characters.


    ```

    sed ''s/([0-9]{2})\\([0-9]{2})\\([0-9]{4})\$3-1-\2/'' distros.txt

