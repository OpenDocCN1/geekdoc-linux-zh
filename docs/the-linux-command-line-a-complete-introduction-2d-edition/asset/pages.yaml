    # Match an Element Zero or More Times


    Like the ? metacharacter, the * is used to denote an optional item; however, unlike
    the ?, it may occur any number of times, not just once. Let''s say we wanted to
    see whether a string was a sentence; that is, it starts with an uppercase letter,
    contains any number of uppercase and lowercase letters and ends with a period.
    To match this (crude) definition of sentence, we could use a regular expression
    like this:


    ```

    ([[:upper:]][[:upper:][lower:]]* )*\.

    ```


    The expression consists of three items: a bracket expression containing both the
    [:upper:] and [:lower:] character classes and a space, and a period escaped with
    a backslash. The second element is trailed with an * metacharacter so that the
    leading uppercase letter in our sentence, any number of uppercase and lowercase
    letters and spaces may follow it and still match.


    Regular Expressions 237'
