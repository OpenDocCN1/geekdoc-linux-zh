    # # Array Elements


    So, what are arrays good for? Just as many data-management tasks can be performed
    with a spreadsheet program, many programming tasks can be performed with arrays.

    Let''s consider a simple data-gathering and presentation example. We will construct
    a script that executes the modification of the files in a specified directory.
    From this data, our script will output a table showing at what hour of the day
    the files were last modified. Such a script could be used to determine when a
