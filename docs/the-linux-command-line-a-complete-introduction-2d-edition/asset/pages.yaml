  md: '# More Process-Related Commands


    Because monitoring processes is an important system administration task, there
    are a lot of commands for it. Table 10-6 lists some to play with.


    Table 10-6: Other Process-Related Commands


    | Command | Description |

    | --- | --- |

    | ptree | Outputs a process list arranged in a tree-like pattern showing the parent-child
    relationships between processes. |

    | vstat | Outputs a snapshot of system resource usage including memory, swap,
    and disk I/O. To see a continuous display, follow the command with a time delay
    [in seconds] for updates. Here''s an example: vstat 5. Terminate the output with
    CTRL-C. |

    | xload | A graphical program that draws a graph showing system load over time.
    |

    | tload | Similar to the xload program but draws the graph in the terminal. Terminate
    the output with CTRL-C. |


    # Summing Up


    Most modern systems feature a mechanism for managing multiple processes, Linux
    provides a rich set of tools for this purpose. Given that Linux is the world''s
    most deployed server operating system, this makes a lot of sense. Unlike some
    other systems, however, Linux relies primarily on command line tools for process
    management. Though there are graphical process tools for Linux, the command line
    tools are greatly preferred because of their speed and light footprint. While
    the GUI tools may look pretty, they often create a lot of system load themselves,
    which somewhat defeats the purpose.'
