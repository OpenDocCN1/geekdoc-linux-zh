- img_proc: true
  md: '# Display a Program’s Info Entry


    The GNU Project provides an alternative to man pages for their programs, called
    info. Info manuals are displayed with a reader program named, appropriately enough.
    info. Info pages are hyperlinked much like web pages.

    Here is a sample:


    ```

    File: coreutils.info, Next: dir invocation, Up:

    Directory listing

    10.1 ''ls'': List directory contents

    =====================

    The `ls` lists information about files (of any type, including directories). Options
    and file arguments can be interleaved arbitrarily, as usual.

    For non-option command-line arguments that are directories, by default `ls` lists
    the contents of directories, not recursively, and omitting files with names beginning
    with ''.''. For other non-option arguments, by default `ls` lists the filename.
    If no non-option argument is specified, `ls` operates on the current directory,
    acting as if it had been invoked with a single argument of ''.''.

    By default, the output is sorted alphabetically, according to the

    --zz-Info:(coreutils.info.gz) invocation, 63 lines --Top

    ```


    The info program reads files, which are tree structured into individual nodes,
    each containing a single topic. Info files contain hyperlinks that can move you
    from node to node. A hyperlink can be identified by its leading asterisk and is
    activated by placing the cursor upon it and pressing ENTER.


    To invoke info, type info followed optionally by the name of a program. Table
    5-2 describes the commands used to control the reader while displaying an info
    page.


    # Table 5-2: info Commands


    | Command | Action |

    | --- | --- |

    | ? | Display command help |

    | UP or BACKSPACE | Display previous page |

    | PAGE DOWN or spacebar | Display next page |

    | n | Next–display the next node |

    | p | Previous–display the previous node |

    | U | Up–display the parent node of the currently displayed node, usually a menu
    |

    | ENTER | Follow the hyperlink at the cursor position |

    | Q | Quit |


    Most of the command line programs we have discussed so far are of the GNU Project’s
    coreutils package, so typing the following:


    ```

    $ me@linuxbox ~ info coreutils

    ```'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'will display a menu page with hyperlinks to each program contained in the coreutils
    package.


    # README and Other Program Documentation Files


    Many packages installed on your system have documentation files residing in the
    /usr/share/doc directory. Most of these are stored in ordinary text format and
    can be viewed with the less command. Some of the files are in HTML format and
    can be viewed with a web browser. We may encounter some files ending with a .gz
    extension. This indicates that they have been compressed with the gzip compression
    program. The gzip package includes a special version of less zled that will display
    the contents of gzip files.


    # Creating Our Own Commands with alias


    Now for our first experience with programming! We will create a command of our
    own using the alias command. But before we start, we need to reveal a small command
    trick. It''s possible to put more than one command on a line by separating each
    command with a semicolon. It works like this:


    ```

    command1; command2; command3...

    ```


    Here''s the example we use:


    ```

    [me@linuxbox ~]$ cd /usr; ls; cd -

    bin games include local sbin share src

    home/me~

    [me@linuxbox ~]$

    ```


    As we can see, we have combined three commands on one line. First we change the
    working directory to /usr, then list the directory, and finally return to the
    original directory (by using cd -) so we end up where we started. Now let''s turn
    this sequence into a new command using alias. The first thing we have to do is
    dream a name for our new command. Let''s try test. Before we do that, it would
    be a good idea to find out whether the name test is already being used. To find
    out, we can use the type command- again.


    ```

    [me@linuxbox ~]$ type test

    test is a shell builtin

    ```


    Oops! The name test is already taken. Let''s try foo.


    ```

    [me@linuxbox ~]$ type foo

    bash: type: foo: not found

    ```'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'Great! foo is not taken. So, let''s create our alias.


    ```

    @me@linux~$ alias foo=''cd /usr; ls; cd -''

    ```


    Notice the structure of this command, shown here:


    ```

    alias name=''string''

    ```


    After the command alias, we give our alias a name followed immediately (no whitespace
    allowed) by an equal sign, followed immediately by a quoted string containing
    the meaning to be assigned to the name. After we define our alias, we can use
    it anywhere the shell would expect a command. Let''s try it.


    ```

    @me@linux~$ foo

    bins games include lib sbin share src

    home/me

    @me@linux~$

    ```


    We can also use the type command to see our alias.


    ```

    @me@linux~$ type foo

    foo is aliased to cd /usr; ls; cd -

    ```


    To remove an alias, the unalias command is used, so:


    ```

    @me@linux~$ unalias foo

    @me@linux~$ type foo

    bash: type: foo: not found

    ```


    While we purposefully avoided naming our aliases with an existing command, it
    is not uncommon to do so. This is often done to apply a commonly desired option
    to each invocation of a common command. For instance, we saw earlier how the ls
    command is often aliased to add color support.


    ```

    @me@linux~$ type ls

    ls is aliased to ''ls --color=tty''

    ```


    To see all the aliases defined in the environment, use the alias command without
    arguments. Here are some of the aliases defined by default on a Fedora system.
    Try to figure out all they do.


    ```

    @me@linux~$ alias

    alias 1.=''ls -d .* --color=tty''

    alias 1l=''ls --color=tty''

    alias 1s=''ls --color=tty''

    ```'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'There is one tiny problem with defining aliases on the command line. They vanish
