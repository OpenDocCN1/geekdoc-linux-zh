  md: '# # 11

    THE ENVIRONMENT


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_146_0.png)


    As we discussed earlier, the shell maintains a body of information during our
    shell session called the environment. Programs use the data stored in the environment
    to determine facts about the system''s configuration. While most programs use
    configuration files to store program settings, some programs also look for values
    stored in the environment to adjust their behavior. Knowing this, we can use the
    environment to customize our shell experience.


    In this chapter, we will work with the following commands:


    +   - `printenv` Print part or all of the environment

    - `set` Set shell options

    - `export` Export environment to subsequently executed programs

    - `alias` Create an alias for a command'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# # What Is Stored in the Environment?


    The shell stores two basic types of data in the environment; though, with bash,
    the types are largely indistinguishable. They are environment variables and shell
    variables. Shell variables are bits of data placed there by bash, and environment
    variables are everything else. In addition to variables, the shell stores programmatic
    data, namely, aliases and shell functions. Covered aliases in Chapter 5 and we
    will cover shell functions (which are related to shell scripting) in Part IV of
    this book.


    # ## Examining the Environment


    To see what is stored in the environment, we can use either the set builtin in
    bash or the printenv program. The set command will show both the shell and environment
    variables, while printenv will only display the layer. Because the list of environment
    contents will be fairly long, it is best to pipe the output of each command into


    ```

    me@linuxbox ~$ printenv | less


    Doing so, we get something that looks like this:


    USER=me

    PAGER=less

    LSCOLOR=Gfxxccdxbxegedababagacad

    XDG_CONF,DIRS=/etc/xdg/xdg-ubuntu=/usr/share/upstart/xdg:/etc:/xdg

    PATH=/home/me/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/bin:/bin:/usr/games:/usr/local/games

    DESKTOP_SESSION=ubuntu

    QT_IM_MODULE=ibus

    QPA_PLATFORMTHEME=appmenu-qt5

    JOB=dbus

    Pw=/home/me

    XMODIFIERS=@im-ibus

    GNOME_KEYRING_PID=1850

    LANG=en_UTF-8

    GDM LANG=en US

    MANDATORY_PATH=/usr/share/gconf/ubuntu.mandatory.path

    MASTER_HOST=+linuxbox

    IM_CONFIG_PHASE=1

    COMPIZ_CONFIG_PROFILE=ubuntu

    GDMSESSION=ubuntu

    SESSIONTYPE=gnome-session

    XDG_SEAT=seato

    HOME=/home/me

    SHLVL=2

    LANGUAGE=en_US

    ```'
