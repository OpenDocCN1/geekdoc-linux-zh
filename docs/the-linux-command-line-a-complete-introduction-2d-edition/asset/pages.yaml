  pgno: 357
- img_proc: true
  md: '# More Formatting Tricks


    One of the key goals of serious script writing is ease of maintenance; that is,
    the ease with which a script may be modified by its author or others to adapt
    it to changing needs. Making a script easy to read and understand one way to facilitate
    easy maintenance.


    # Long Option Names


    Many of the commands we have studied feature both short and long option names.
    For instance, the ls command has many options that can be expressed in either
    short or long form. For example, the following:


    ```

    [me@linuxbox ~$] ls -ad

    ```


    is equivalent to this:


    ```

    [me@linuxbox ~$ ls --all directory

    ```


    In the interests of reduced typing, short options are preferred when entering
    options on the command line, but when writing scripts, long options can provide
    improved readability.


    # Indentation and Line Continuation


    When employing long commands, readability can be enhanced by spreading the command
    over several lines. In Chapter 17, we looked at a particularly long example of
    the find command.


    ```

    [me@linuxbox ~$ find playground \-type f -not -perm 0600 -exec \

    chmod 0600 {} \ '';'' \ -or \-type d -not -perm 0700 -exec \

    chmod 0700 {} \ '';'' \]

    ```


    Obviously, this command is a little to figure out at first glance. A script, this
    command might be easier to understand if written in this way:


    ```

    find playground \

    \-type f \\

    -not -perm 0600 \\

    -exec chmod 0600 {} \''; '';'' \\

    ) \\

    -or \

    ) \\

    -type d \\

    -not -perm 0700 \\

    -exec chmod 0700 {} \''; '';'' \\

    \)

    ```


    By using line continuations (backslash-linefeed sequences) and indentation, the
    logic of this complex command is more clearly described to the reader. This technique
    works on the command line, though it is seldom used,'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'as it is awkward to type and edit. One difference between a script and a command
    line is that the script may employ tab characters to achieve indentation, whereas
    the command line cannot since tabs are used to activate completion.


    # CONFIGURING VIM FOR SCRIPT WRITING


    The vim text editor has many, many configuration settings. There are several common
    options that can facilitate script writing.

    The turns on syntax highlighting:


    ```

    :syntax on

    ```


    With this setting, different elements of syntax will be displayed in different
    colors when viewing a script. This is helpful for identifying certain kinds of
    programming errors. It looks cool, too. Note that for this feature to work, you
    must have a complete version of vim installed, and the file you are editing must
    have a shebang indicating the file is a script. If you have difficulty with the
    previous command, try :set syntax=sh indent.

    The turns on the option to highlight search results:


    ```

    :set hlsearch

    ```


    Say we search for the echo. With this option on, each instance of the word will
    be highlighted.

    The sets the number of columns occupied by a tab character:


    ```

    :set tabindex=4

    ```


    The default is eight columns. Setting the value to 4 (which is a common practice)
    allows long lines to fit more easily on the screen.

    The default turns on the “autoindent”:


    ```

    :set autoindent

    ```


    This causes vim to indent a new line the same amount as the line just typed. This
    speeds up typing on many kinds of programming constructs. To stop indentation,
    press CTRL-D.

    Changes can be made permanent by adding these commands to your ~/.vimrc.


    # Summing Up


    In this first chapter of scripting, we looked at how scripts are written and easily
    to execute on our system. We also saw how we can use various formatting techniques
    to improve the readability (and thus the maintain) of our scripts. In future chapters,
    ease of maintenance will come up again and again as a central principle in good
    script writing.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# # 25

    # STARTING A PROJECT


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_360_0.png)


    Starting with this chapter, we will begin to build a program. The purpose of this
    project is to see how various shell features are used to create programs, and,
    more importantly, create good programs.


    The program we will write is a report generator. It will present various statistics
    about our system and its status and will produce this report in HTML format so
    we can view it with a web browser such as Firefox or Chrome.


    Programs are usually built up in a series of stages, with each stage adding features
    and capabilities. The first stage of our program will produce a minimal HTML document
    that contains no system information. That will come later.'
  merge: -1
  pgno: 360
- img_proc: true
  md: "# First Stage: Minimal Document\n\nThe first thing we need to know is the format\
    \ of a well-formed HTML document. It looks like this:\n\n```\n<html>\n  <head>\n\
    \    <title>Page Title</title>\n  </head>\n  <body>\n    Page body.\n  </body>\n\
    </html>\n```\n\nIf we enter this into our text editor and save the file as foo.html,\
