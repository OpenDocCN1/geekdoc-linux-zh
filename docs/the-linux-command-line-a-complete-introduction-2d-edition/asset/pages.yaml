  md: '# Using test


    By far, the command used most frequently with if is test. The test command performs
    a variety of checks and comparisons. It has two equivalent forms. The first, shown
    shown here:


    test expression


    And the second, more popular form, here:


    [ expression ]


    where expression is an expression that is evaluated as either true or false. The
    test command returns an exit status of 0 when the expression is true and a status
    of 1 when the expression is false.


    It is interesting to note that both test and { are actually commands. In bash
    they also exist as programs in /usr/bin for use with other shells. The expression
    is actually just its arguments with the { command requiring that the } character
    be provided as its final argument.


    The test and [ commands support a wide range of useful expressions


    # File Expressions


    Table 27-1: test File Expressions to evaluate the status of files.


    | Expression | Is true if: |

    | --- | --- |

    | file1 -ef file2 | file1 and file2 have the same inode numbers (the two filenames
    refer to the same file by hard linking). |

    | file1 -nt file2 | file1 is newer than file2. |

    | file1 -ot file2 | file1 is older than file2. |

    | -b file | file exists and is a block-special (device) file. |

    | -c file | file exists and is a character-special (device) file. |

    | -d file | file exists and is a directory. |

    | -e file | file exists. |

    | -f file | file exists and is a regular file. |

    | -g file | file exists and is set-group-ID. |

    | -G file | file exists and is owned by the effective group. |

    | -k file | file exists and has its "sticky bit" set. |

    | -L file | file exists and is a symbolic link. |

    | -0 file | file exists and is owned by the effective user. |

    | -p file | file exists and is a named pipe. |

    | -r file | file exists and is readable (has readable permission for the effective
    user). |'
  merge: -1
