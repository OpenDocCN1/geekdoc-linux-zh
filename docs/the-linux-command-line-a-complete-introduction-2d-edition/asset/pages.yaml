  md: 'Table 13-2 lists the available text colors. Notice that the colors are divided
    into two groups, differentiated by the application of the bold character attribute
    (1), which creates the appearance of “light” colors.


    # Table 13-2: Escape Sequences Used to Set Text Colors


    | Sequence | Text color | Sequence | Text color |

    |---|---|---|--|

    | \033[0;30m] | Black | \033[1;30m] | Dark gray |

    | \033[0;31m] | Red | \033[1;31m] | Light red |

    | \033[0;32m] | Green | \033[1;32m] | Light green |

    | \033[0;33m] | Brown | \033[1;33m] | Yellow |

    | \033[0;34m] | Blue | \033[1;34m] | Light blue |

    | \033[0;35m] | Purple | \033[1;35m] | Light purple |

    | \033[0;36m] | Cyan | \033[1;36m] | Light cyan |

    | \033[0;37m] | Light gray | \033[1;37m] | White |


    Let’s try to make a prompt (seen here as Gray). We’ll insert the escape code at
    the beginning.


    ```

    <me@linuxbox ~$ PS1="[\033[0;31m]<u@h W\$$

    <me@linuxbox ~$>

    ```


    That works, but notice that all the text that we type after the prompt will display
    in red. To fix this, we will add another escape code to the end of the prompt
    that tells the terminal emulator to return to the previous color.


    ```

    <me@linuxbox ~$ PS1="[\033[0;31m]<u@h W\$\[\033[0m]"

    <me@linuxbox ~$>

    ```


    That’s better!

    It’s also possible to set the background color using the codes listed in Table
    13-3. The background colors do not support the bold attribute.


    # Table 13-3: Escape Sequences Used to Set Background Color


    | Sequence | Background color | Sequence | Background color |

    |---|---|---|--|

    | \033[0;40m] | Black | \033[0;44m] | Blue |

    | \033[0;41m] | Red | \033[0;45m] | Purple |

    | \033[0;42m] | Green | \033[0;46m] | Cyan |

    | \033[0;43m] | Brown | \033[0;47m] | Light gray |


    We can create a prompt with a red background by applying a simple change to the
    first escape code.


    ```

    <me@linuxbox ~$ PS1="[\033[0;41m]<u@h W\$\[\033[0m]"

    <me@linuxbox ~$>

    ```'
