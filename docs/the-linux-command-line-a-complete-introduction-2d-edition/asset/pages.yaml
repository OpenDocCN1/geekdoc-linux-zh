  md: '# 17


    # # SEARCHING FOR FILES


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_226_0.png)


    As we have wandered around our Linux system, one thing has become abundantly clear:
    a typical Linux system has a lot of files! This raises the question, “How do we
    find things?” We already know that the Linux file system is well organized according
    to conventions passed down from one generation of Unix-like systems to the next,
    but the sheer number of files can present a daunting problem.


    In this chapter, we will look at two tools that are used to find files on a system.


    +   - `locate` Find files by name

    - `find` Search for files in a directory hierarchy


    We will also look at a command that is often used with file-search commands to
    process the resulting list of files.


    `xargs` Build and execute command lines from standard input'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'In addition, we will introduce a couple of commands to assist us in our explorations.


    +   touch Change file times

    stat Display file or file system status


    # locate—Find Files the Easy Way


    The locate program performs a rapid database search of pathnames, and then outputs
    every name that matches a given substring. Say, for example, we want to find all
    the programs that begin with zip. Because we are looking for programs, we can
    assume that the name of the directory containing the programs would end with bin/.
    Therefore, we could try to use locate this way to find our files:


    ```

    [melinuxux ~$ locate bin/zip

    ```


    locate will search its database of pathnames and output any that can contain the
    string bin/zip.


    ```

    /usr/bin/zip

    /usr/bin/zipcloak

    /usr/bin/zipgrep

    /usr/bin/zipinfo/usr/bin/zipnote

    /usr/bin/zsplit

    ```


    If the search requirement is not so simple, we can combine locate with other tools
    such as grep to design more interesting searches.


    ```

    [melinuxux ~$ locate zip | grep bin

    /bin/bunzip2

    /bin/bzip2

    /bin/bzip2recover

    /bin/gunzip

    /bin/gzip

    /usr/bin/funzip

    /usr/bin/gpg-zip

    /usr/bin/preunzip

    /usr/bin/prezip

    /usr/bin/prezip-bin

    /usr/bin/unzip

    /usr/bin/unzipsfx

    /usr/bin/zip

    /usr/bin/zipcloak

    /usr/bin/zipgrep

    /usr/bin/zipinfo

    /usr/bin/zipnote

    /usr/bin/zsplit

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'The locate program has been around for a number of years, and there are several
    variants in common use. The two most common found in modern Linux distributions
    are solace and locate, though they are usually accessed by a symbolic link named
    locate. The different versions of Locate have overlapping options. Some versions
    include regular expression matching (which we''ll cover in Chapter 19) and wildcard
    support. Check the main page for locate to determine which version of locate is
    installed.


    # WHERE DOES THE LOCATE DATABASE COME FROM?


    You might notice that, on some distributions, locate fails to work just after
    the system is installed, but if you try again the next day, it works fine. What
    gives? The locate database is created by another program named updated. Usually,
    it is run periodically as a cron job, that is, task performed at regular intervals
    by the cron daemon. Most systems equipped with locate run after a day. Because
    the database is not updated continuously, you will notice that very recent files
    do not show up when using locate. To overcome this, it''s possible to run the
    updated program manually by becoming the superuser at the prompt.


    # find—Find Files the Hard Way


    While the locate program can find a file solely on its name, the find program
    searches a given directory (and its subdirectories) for files based on a variety
    of attributes. We''re going to spend a lot of time with find because it has a
    lot of interesting features that we will see again and again when we start to
    cover programming concepts in later chapters.


    In its simplest use, find is one or more names of directories to search. For example,
    to produce a list of our home directory, we can use:


    ```

    me@linuxbox~$ find ~

    ```


    On most active user accounts, this will produce a large list. Because the list
    is sent to standard output, we can pipe the list into other programs. Let''s use
    wc to count the number of files.


    ```

    me@linuxbox~$ find ~ | wc -1

    47068

    ```


    Wow, we''ve been busy! The beauty of find is that it can be used to identify files
    that meet specific criteria. It does this through the (slightly strange) application
    of options, tests, and actions. We''ll look at the tests first.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Tests


    Let''s say we know a list of directories from our search. To do this, we could
    add the following test:


    ```

    me@linuxbox~$ find -type d | wc -1

    1695

    ```


    Adding the test -type d limited the search to directories. Conversely, we could
    have limited the search to regular files with this test:


    ```

    me@linuxbox~$ find -type f | wc -1

    38737

    ```


    Table 17-1 lists the common file type tests supported by find.


    # Table 17-1: find File Types


    | File type | Description |

    | b | Block special device file |

    | c | Character special device file |

    | d | Directory |

    | f | Regular file |

    | l | Symbolic link |


    We can also search by size and filename by adding some additional tests. Let''s
    look for all the regular files that match the wildcard pattern *.JPG and are larger
    than one megabyte.


    ```

    me@linuxbox~$ find -type f -name "*.JPG" -size +1M | wc -1

    840

    ```


    In this example, we add the -name test followed by the wildcard pattern. Notice
    how we enclose it in quotes to prevent pathname expansion by the shell. Next,
    we add the -size test followed by the size +1M. The leading plus sign indicates
    that we are looking for files larger than the specified number. A leading minus
    sign would change the meaning of the string to be smaller than the specified number.
    Using no sign means "match the value exactly." The trailing letter M indicates
    that the unit of measurement is megabytes.


    Table 17-2: find Size Units


    | Character | Unit |

    | b | 512-byte blocks. This is the default if no unit is specified. |

    | c | Bytes. |

    | w | 2-byte words. |


    198 Chapter 17'
