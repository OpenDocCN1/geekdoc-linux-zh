    ```

    [melinux ~]$ days=(Sun Mon Wed Thu Fri Sat)

    ```


    It is also possible to assign values to a specific element by specifying a subscript
    for each value.


    ```

    [melinux ~]$ days={[0]=Sun[1]=Mon[2]=Tue[3]=Wed[4]=Thu[5]=Fri[6]=Sat]

