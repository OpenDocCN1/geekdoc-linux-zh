  md: '# Entering Insert Mode


    To add some text to our file, we must first enter insert mode. To do this, we
    press the i key. Afterward, we should see the following at the bottom of the screen
    if vim is running in its usual enhanced mode (this will not appear in vi compatible
    mode):


    ```

    -- INSERT --

    ```


    Now we can enter some text. Try this:


    The quick brown fox jumped over the lazy dog.


    To exit insert mode and return to command mode, press the ESC key.


    # Saving Our Work


    To save the change we just made to our file, we must enter an ex command while
    in command mode. This is easily done by pressing the : key. After doing this,
    a colon character should appear at the bottom of the screen.


    To write our modified file, we follow the colon with a w and then press ENTER.


    ```

    :w

    ```


    The file will be written to the hard drive, and we should get a confirmation message
    at the bottom of the screen, like this:


    ```

    "foo.txt" [New] 1L, 46C written

    ```


    > If you read the vim documentation, you will notice that (confusingly) command
    mode is called normal mode and ex commands are called command mode. Beware.


    # Moving the Cursor Around


    While in command mode, vi offers a large number of movement commands, some of
    which it shares with less. Table 12-1 lists a subset.


    Table 12-1: Cursor Movement Keys


    | Key | Moves the cursor |

    | l or right arrow | Right one character. |

    | h or left arrow | Left one character. |

    | j or down arrow | Down one line. |'
