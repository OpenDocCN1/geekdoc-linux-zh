    # ### Join Lines of Two Files on a Common Field


    In some ways, join is like paste in that it adds columns to a file, but it uses
    a unique way to do it. A join is an operation usually associated with relational
    databases data from multiple tables with a shared key is combined to form a desired
    result. The join program performs the same operation. It joins data from multiple
    files based on a shared key.


    To see how a join operation is used in a relational database, let''s imagine a
    small database consisting of two tables, each containing a single record. The
    first table, called CUSTOMERS, has three fields: a customer number (ORDERNUM),
    the customer''s first name (FNAME), and the customer''s last name (LNAME):


    ```

    CUSTNUM FNAME LNAME

    ======= ========

    4681934 John Smith

    ```


    The second table is ORDERS and contains four fields: an order number (ORDERNUM),
    the customer number (CUSTNUM), the quantity (QUAN), and the item ordered (ITEM).


    | ORDERNUM | CUSTNUM | QUAN | ITEM |

    | ======= | ======= | ==== | ======= |

    | 3014953305 | 4681934 | 1 | Blue Widget |


    Note that both tables share the field CUSTNUM. This is important because it allows
    a relationship between the tables.


    Performing a join operation would allow us to combine the fields in the two tables
    to achieve a useful result, such as preparing an invoice. Using the matching values
    in the CUSTNUM fields of both tables, a join operation could produce the following:


    ```

    FNAME LNAME QUAN ITEM

    ===== ==== =====

    John Smith 1 Blue Widget

    ```


