    # Comparing Text


    It is often useful to compare versions of text files. For system administrators
    and software developers, this is particularly important. A system may, for example,
    need to compare an existing configuration file to a previous version to diagnose
    a system problem. Likewise, a programmer needs to see what changes have been made
    to programs over time.


    # **Compare Two Sorted Files by Line**


    The program compares two text files and displays the lines that are unique to
    each and the lines they have in comm. To demonstrate, we will create two nearly
    identical text files using cat.


    ```

    [me@linuxbox ~$ cat > file1.txt

    a

    b

    c

    d

    [me@linuxbox ~$ cat > file2.txt

    b

    c

    d

    ```


    Next, we will compare the two files using comm.


    ```

    [me@linuxbox ~$ comm file1.txt file2.txt

    a

    b

    c

    d

    ```


    As we can see, comm produces three columns of output. The first column contains
    lines unique to the first file argument, and the third column contains the lines
    shared by both files. comm supports options in the form -n, where n is either
    1, 2, or 3. When used, these options specify which columns to suppress. For example,
    if we wanted to output only the lines shared by both files, we would suppress
    the output of the first and second columns.


    ```

    [me@linuxbox ~$ comm -12 file1.txt file2.txt

    b

    c

    d

    ```'
