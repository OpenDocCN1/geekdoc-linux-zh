  md: '# 12


    # A GENTLE INTRODUCTION TO VI


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_158_0.png)


    There is an old joke about a visitor to New York City asking for directions to
    the famous passerby for the city''s classical music venue.


    Visitor: Excuse me, how do I get to Carnegie Hall?

    Passerby: Practice, practice, practice!


    Learning the Linux command line, like becoming an accomplished pianist, is not
    something that we pick up in an afternoon. It takes years of practice. In this
    chapter, we will introduce the vi (pronounced vee eye) text editor, one of the
    core programs in the Unix tradition. vi is somewhat notorious for its difficult
    user interface, but when we see a master sit down at the keyboard and begin to
    “play,” will indeed be witness to some great art. We won’t become masters in this
    chapter, but when we are done, we will know how to play the equivalent of “Chopsticks”
    in vi.'
