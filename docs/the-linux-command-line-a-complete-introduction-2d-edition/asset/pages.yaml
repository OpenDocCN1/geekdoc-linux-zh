  md: '# ROT13: THE NOT-SO-SECRET DECODER RING


    One usage of tr is to perform ROT13 encoding of text. ROT13 is a trivial type
    of encryption based on a simple substitution cipher. Calling ROT13 encryption
    is generous; text obfuscation is more accurate. It is sometimes used on text to
    obscure potentially offensive content. The method simply moves every character
    13 places up the alphabet. Because this is halfway through 26 characters, performing
    the algorithm a second time on the text restores it to its original form. Use
    the following to perform this encoding with tr:


    ```

    echo "secret text" | tr a-ZA-Z n-za-MN-ZA-M

    frprg grkg

    ```


    Performing the same procedure a second time results in the translation:


    ```

    echo "frprg grkg" | tr a-ZA-Z n-za-MN-ZA-M

    secret text

    ```


    A number of email programs and Usenet news readers support ROT13 encoding. Wikipedia
    contains a good article on the subject at http://en/wikipedia.org/wiki/ROT13.


    # sed—Stream Editor for Filtering and Transforming Text


    The name is short for stream editor. It performs text editing on a stream of text,
    either a set of specified files or standard input. sed is powerful and somewhat
    complex program (there are entire books about it), so we will not cover it here.


    In general, the way sed works is that it is given a single editing command (on
    the command line) or the name of a script file containing multiple commands, and
    it performs these commands upon each line in the stream of text. Here is a simple
    example of action in:


    ```

    $me@linuxbox~$ echo "front" | sed ''s/front/back/''

    back

    ```


    In this, we produce a one-word stream of text using echo and pipe into it sed,
    in turn, carries out the instruction s/front/back/ upon the text and produces
    the output as a result. We can also recognize this command as resembling the "substitution"
    (search-and-replace) command in vi.


    In sed with a single letter. In the previous example, the substitution command
    is represented by the letter s and is followed by the search-and-replace strings,
    separated by the slash character as a delimiter. The choice of the delimiter character
    is arbitrary. By convention, the slash


