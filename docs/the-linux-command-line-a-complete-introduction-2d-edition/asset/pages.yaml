  md: '# Command Line Editing


    bash uses a library (a shared collection of routines that different programs can
    use) called Readline to implement command line editing. We have already seen some
    of this. We know, for example, the arrow keys move the cursor, but there are many
    more features. Think of these as additional tools that we can employ in our work.
    It''s not important to learn all of them, but many of them are very useful. Pick
    and choose as desired.


    > Some of the key sequences covered in this chapter (particularly those that use
    the ALT key) may be intercepted by the GUI for other functions. All of the key
    sequences will work properly when using a virtual console.


    # Cursor Movement


    Table 8-1 describes the keys used to move the cursor.


    | Key | Action |

    | --- | --- |

    | CTRL-A | Move cursor to the beginning of the line. |

    | CTRL-E | Move cursor to the end of the line. |

    | CTRL-F | Move cursor forward one character; same as the right arrow key. |

    | CTRL-B | Move cursor backward one character; same as the left arrow key. |

    | ALT-F | Move cursor forward one word. |

    | ALT-B | Move cursor backward one word. |

    | CTRL-L | Clear the screen and move the cursor to the top-left corner. The clear
    command does the same thing. |


    # Modifying Text


    Because it''s possible we might make a mistake while composing commands, we need
    a way to correct them efficiently. Table 8-2 describes keyboard commands that
    are used to edit characters on the command line.


    # Table 8-2: Text Editing Commands


    | Key | Action |

    | --- | --- |

    | CTRL-D | Delete the character at the cursor location. |

    | CTRL-T | Transpose (exchange) the character at the cursor location with the
    one preceding. |

    | ALT-T | Transpose the word at the cursor location with the one preceding. |

    | ALT-L | Convert the characters from the cursor location to the end of the word
    to lowercase. |

    | ALT-U | Convert the characters from the cursor location to the end of the word
    to uppercase. |'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Cutting and Pasting (Killing and Yanking) Text


    The Readline documentation uses the terms *killing* and *yanking* to refer to
    what we commonly call cutting and pasting (see Table 8-3). Items that are cut
    are stored in a buffer (a temporary storage area in memory) called the *kill-ring*.


    Table 8-3: Cut-and-Paste Commands


    | Key | Action |

    | --- | --- |

    | CTRL-K | Kill text from the cursor location to the end of line. |

    | CTRL-U | Kill text from the cursor location to the beginning of the line. |

    | ALT-D | Kill text from the cursor location to the end of the current word. |

    | ALT-BACKSPACE | Kill text from the cursor location to the beginning of the current
    word. If the cursor is at the beginning of a word, kill the previous word. |

    | CTRL-Y | Yank text from the kill-ring and insert it at the cursor location.
    |


    # THE META KEY


    If you venture into the Readline documentation, which can be found in the “READLINE”
    section of the bash man page, you will encounter the term *meta key*. On modern
    keyboards, this maps to the ALT key; however, this wasn''t always the case.

    Back in the dim times (before PCs after Unix), everybody had their own computer.
    What they might have had was a device called a *terminal*. A terminal was a communication
    device that featured a text screen and a keyboard and just enough electronics
    to display text characters and move the cursor around. It was attached (usually
    by serial cable) to a larger computer or the communication network of a larger
    computer. There were many different kinds of terminals, and they all had keyboards
    and display features. Because they all tended to at least understand ASCII, developers
    wanting portable applications wrote to the lowest common denominator. Unix systems
    have an elaborate way of dealing with terminals and their different display features.
    Because the developers of Readline could not be sure of the presence of a dedicated
    extra control key, they invented one and called it *meta*. While the ALT key serves
    as the meta key on modern keyboards, you can also press and release the ESC key
    to get the same effect as holding down the ALT key if you''re still using a terminal
    (which you can still do in Linux!).'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Completion


    Another way that the shell can help you is through a mechanism called completion.
    Completion occurs when you press the TAB key while typing a command. Let''s see
    how this works. Given a home directory that looks like this:


    ```

    me[linuxbox ~]$ ls

    Desktop ls-output.txt Pictures Videos

    Documents Music Public

    ```


    try typing the following, but don''t press ENTER:


    ```

    me[linuxbox ~]$ ls 1

    ```


    Now press TAB.


    ```

    me[linuxbox ~]$ ls ls-output.txt

    ```


    See how the shell completed the line for you? Let''s try another one. Again, don''t
    press ENTER.


    ```

    me[linuxbox ~]$ ls D

    ```


    Press TAB.


    ```

    me[linuxbox ~]$ ls D

    ```


    No completion, just nothing. This happened because D matches more than one entry
    in the directory. For completion to be successful, the “clue” you give has to
    be unambiguous. If we go further, as with the following:


    ```

    me[linuxbox ~]$ ls Do

    ```


    and press TAB:


    ```

    me[linuxbox ~]$ ls Documents

    ```


    the completion is successful.


    While this example shows completion of pathnames, which is its most common use,
    completion will also work on variables (if the beginning of the word is a $),
    usernames (if the word begins with ~), commands (if the word is the first word
    on the line), and hostnames (if the beginning of the word is @). Hostname completion
    works only for hostnames listed in /etc/hosts.


    A number of control and meta key sequences are associated with completion, as
    listed in Table 8-4.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Table 4-4: Completion Commands


    | Key | Action |

    |--- | --- |

    | ALT? | Display a list of possible completions. On most systems, you can also
    do this by pressing the TAB key a second time, which is much easier. |

    | ALT-* | Insert all possible completions. This is useful when you want to use
    more than one possible match. |


    There are quite a few more that are rather obscure. A list appears in the bash
    man page under "READLINE."


    # PROGRAMMABLE COMPLETION


    Recent versions of bash have a facility programmable completion. Programmable
    completion allows you (or more likely, your distribution provider) to add more
    completion rules. Usually this is done to add support for specific applications.
    For example, it is possible to add completions for the option list of a command
    or match particular file types that an application supports. Ubuntu has a fairly
    large set defined by default.'' completion is implemented by shell functions,
    a kind of mini shell script that we will cover in later chapters. If you are curious,
    try the following:


    ```

    set | less

    ```


    Now see whether you can find them. Not all distributions include them by default.


    # Using History


    As we discovered in Chapter 1, bash maintains a history of commands that have
    been entered. This list of commands is kept in your home directory in a file bash_history.
    The history facility is a useful resource for reducing the amount of typing you
    have to do, especially when combined with command line editing.


    # Searching History


    At any time, we can view the contents of the command history list by doing the
    following:


    ```

    [me@linuxbox ~]$ history | less

    ```'
