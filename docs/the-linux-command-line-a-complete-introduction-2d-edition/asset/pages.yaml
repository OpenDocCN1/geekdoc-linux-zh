- img_proc: true
  md: '# DEALING WITH FUNNY FILENAMES


    Unix-like systems allow embedded spaces (and even newline!) in filenames. This
    causes problems for programs like xargs which construct argument lists for other
    programs. An embedded space will be treated as a delimiter, and the resulting
    command will interpret each-separated word as a separate argument. To overcome
    this, find and xargs allow the optional use of a null character as an argument
    separator. A null character is defined in ASCII as the character represented by
    the zero (as opposed to, for example, the space character, which is defined in
    ASCII as the character represented by the number 32). The find command provides
    the action -print, which produces null-separated output, and the xargs command
    handles --null [ -0] option, which accepts null-separated input. Here''s an example:


    ```

    find ~ -iname ''*.jpg'' -print0 | xargs ls -1

    ```


    Using this technique, we can ensure that all files, even those containing embedded
    spaces in their names, are handled correctly.


    # A Return to the Playground


    It''s time to put find to some (almost) practical use. We''ll create a playground
    and try some of what we have learned.


    First, let''s create a playground with lots of subdirectories and files.


    ```

    [me@linuxbox ~]$ mkdir -p playground/dir-(001..100)

    [me@linuxbox ~]$ touch playground/dir-(001..100)/file-(A..Z)

    ```


    Marvel at the power of the command! With these two lines, we created a playground
    directory containing 100 subdirectories each containing 26 empty files. Try that
    with the GUI!


    The method we employed to accomplish this magic invoked a familiar command (mkdir),
    an exotic shell expansion (braces), and a new command, touch. By combining mkdir
    with the -p option (which causes mkdir to create the parent directories of the
    specified paths) with brace expansion, we were able to create 100 subdirectories.


    The touch command is usually used to set or update the access, change, and modify
    times of files. However, if a filename argument is that of a non-existent file,
    it creates an empty file.


    In our playground, we created 100 instances of file-A. Let''s find them.


    ```

    [me@linuxbox ~]$ find playground -type f -name ''file-A''

    ```


    Note that unlike ls, find does not produce results in sorted order. The order
    is determined by the size of the storage device. We can confirm that we actually
    have 100 instances of the file this way.'
  merge: -1
  pgno: 237
