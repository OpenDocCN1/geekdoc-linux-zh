  md: '# 15


    # # STORAGE MEDIA


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_196_0.png)


    In previous chapters, we looked at manipulating data at the file level. In this
    chapter, we will consider data at the device level.

    Linux has amazing capabilities for handling storage devices, whether physical
    storage such as hard disks, network storage, or virtual storage devices such as
    RAID (Redundant Array of Independent Disks) and LVM (Logical Volume Manager).


    However, because this is not a book about system administration, we will not try
    to cover this entire topic in depth. What we will try to do is introduce some
    of the concepts and key commands that are used to manage storage devices.


    To carry out the exercises in this chapter, we will use a USB flash drive and
    a CD-RW disc (for systems equipped with a CD-ROM burner).'
