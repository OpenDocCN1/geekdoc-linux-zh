    # apply—A diff to an Original


    The patch program is used to apply changes to text files. It diff is generally
    used to convert older-version files into newer versions. Let''s consider a famous
    example. The Linux kernel is developed by a large, loosely organized team of contributors
    who submit a constant stream of small changes to the source code. The Linux kernel
    consists of several million lines of code, while the changes are made by one contributor
    at one time are quite small. It makes no sense for a contributor to send each
    developer an entire kernel tree each time a small change is made. Instead, a diff
    is submitted. The diff file contains the change from the previous version of the
    kernel to the new version with the contributor''s changes. The receiver uses the
    patch program to apply the change to their own source tree. Using diff/patch offers
    two significant advantages.


    +   - The diff is small, compared to the full size of the source tree.

    - The diff concisely shows the change being made, allowing reviewers of the patch
    to quickly evaluate it.


    Of course, diff/patch will work on any text file, not just source code. it would
    be equally applicable to configuration files or any other text.

    To prepare a diff file for use with patch, the GNU documentation suggests using
    old diff as follows:


    ```

    diff -Naur old_file new_file > diff_file

    ```


    where old_file and new_file are either single files or directories containing
    files. The r option supports recursion of a directory tree.'
