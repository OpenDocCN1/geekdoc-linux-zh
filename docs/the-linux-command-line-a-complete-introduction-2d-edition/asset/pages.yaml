  md: 'Seeing that test and [[ ]] roughly the same thing, which is preferable? test
    traditional (and part of the POSIX specification for standard shells, which are
    often used for system startup scripts), whereas [[ ]] is specific to bash (and
    a few other modern shells). It''s important to know how to use test since it is
