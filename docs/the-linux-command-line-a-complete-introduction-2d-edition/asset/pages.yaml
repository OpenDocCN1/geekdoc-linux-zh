    # Summing Up


    In the chapters that follow, we will explore most of different programs covering
    a wide range of application areas. While these programs are commonly installed
    by default, we may need to install additional packages if the necessary programs
    are not already installed on our system. With our newfound knowledge (and appreciation)
    of package management, we should have no problem installing and managing the programs
    we need.


    > THE LINUX SOFTWARE INSTALLATION MYTH

    People migrating from other platforms sometimes fall victim to the myth that software
    is difficult to install under Linux and that the variety of packaging schemes
    by different distributions is a hindrance. Well, it is a hindrance, but only to
    proprietary software vendors that want to distribute binary-only versions of their
    secret software.

    The Linux software ecosystem is based on the idea of open source code. If a program
    developer releases source code for a program, it is likely that a person associated
    with a distribution will package the program and include it in their repository.
    This method ensures that the program is well integrated'
