    | k | Kilobytes (units of 1,024 bytes). |

    | M | Megabytes (units of 1,048,576 bytes). |

    | G | Gigabytes (units of 1,073,741,824 bytes). |


    find supports a large number of tests. Table 17-3 provides a rundown of the common
    ones. Note that in cases where a numeric argument is required, the same + and
