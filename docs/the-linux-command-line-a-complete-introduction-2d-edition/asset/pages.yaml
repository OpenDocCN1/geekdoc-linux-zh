  md: '# 14


    # PACKAGE MANAGEMENT


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_186_0.png)


    If we spend any time in the Linux community, we hear many opinions as to which
    of the many Linux distributions is “best.” Often, these discussions get really
    silly, focusing on such things as the prettiness of the desktop background (some
    people won''t use Ubuntu because of its default color scheme!) and other trivial
    matters.


    The most important determinant of distribution quality is the packaging system
    and the vitality of the distribution''s support community. As we spend more time
    with Linux, we will see that its software landscape is extremely dynamic. Things
    are constantly changing. Most of the top-tier Linux distributions release new
    versions every six months and many individual program updates every day. To keep
    up with this blizzard of software, we need good tools for package management.


    Package management is a method of installing and maintaining software on the system.
    Today, most people can satisfy all of their needs by installing packages from
    their Linux distributor. This contrasts'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'with the early days of Linux, when one had to download and compile code to
    install software. There isn''t anything wrong with compiling source code; in fact,
    having access to source code is the great wonder of Linux. It gives us (and everyone
    else) the ability to examine and improve the system. It''s just that having a
    precompiled package is faster and easier to deal with.


    In this chapter, we will look at some of the command line tools used for package
    management. While all the major distributions provide powerful and sophisticated
    graphical programs for maintaining the system, it is important to learn about
    the command line programs, too. They can perform many tasks that are difficult
    (or impossible) to do with their graphical counterparts.


    # Packaging Systems


    Different distributions use different packaging systems, and as a general rule,
    a package intended for one distribution is not compatible with another distribution.
    Most distributions fall into one of two packaging technologies: the Debian deb
    camp and the Red Hat rpm camp. There are some important exceptions as Gentoo,
    Slackware, and Arch, but most others use one of these two systems, as shown in
    Table 14-1.


    Table 14-1: Major Packaging System Families


    | Packaging system | Distributions (partial list) |

    |---|---|

    | Debian (.deb) | Debian, Ubuntu, Linux Mint, Raspberry |

    | Red Hat-style (.rpm) | Fedora, CentOS, Red Hat Enterprise Linux, OpenSUSE


    # How a Package System Works


    The method of the software distribution found in the proprietary industry usually
    entails buying a piece of installation media such as an "install disk" or visiting
    each vendor''s website and downloading the product and running an "installation
    wizard" to install a new application on the system.


    Linux doesn''t work that way. Virtually all software for a Linux system will be
    found on the Internet. Most of it will be provided by the distribution vendor
    in the form of package files, and the rest will be available in source code that
    can be installed manually. We''ll talk about how to install software by compiling
    source code in Chapter 23.


    # Package Files


    The basic unit of software in a packaging system is the package file. A package
    is a compressed collection of files that comprise the software package. A package
    may consist of numerous programs and data files that support the programs. In
    addition to the files to be installed, the package file also'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'includes metadata about the package, such as a text description of the package
    and its contents. Additionally, many packages contain pre- and post-installation
    scripts that perform configuration tasks before and after the package installation.


    Package files are created by a person known as a package maintainer, often (but
    not always) an employee of the distribution vendor. The package maintainer gets
    the software in source code from the upstream provider (the author of the program),
    compiles it, and creates the package metadata and any necessary installation scripts.
    Often, the package maintainer will apply modifications to the original source
    code to improve the program''s integration with the other parts of the Linux distribution.


    # Repositories


    While some software projects choose to perform their own packaging and distribution,
    most packages today are created by the distribution vendors and interested third
    parties. Packages are made available to the users of a distribution in central
    repositories that may contain thousands of packages, each specially built and
    maintained for the distribution.


    A distribution may maintain several different repositories for different stages
    of the software development life cycle. For example, there will us "testing" repository
    that contains packages that have just been built and are intended for use by brave
    souls who are looking for bugs before the packages are released for general distribution.
    A distribution will often have "development" repository where work-in-progress
    packages destined for inclusion in the distribution''s next major release are
    kept.


    A distribution may also have third-party repositories. These are often needed
    to supply software that, for legal reasons such as patents or DRM-circumvention
    issues, cannot be included with the distribution. Perhaps the best known case
    is of encrypted DVD support, which is not legal in the United States. The third-party
    repositories operate in countries where software patents and anti-circumvention
    laws do not apply. Repositories are usually independent of the distribution they
    support, and to use them, one must know about them and manually include them in
    the configuration files for the package management system.


    # Dependencies


    Programs are seldom "stand alone"; rather they rely on the presence of other software
    components to get their work done. Common activities, such as input/output, for
    example, are handled by routines shared by many programs. These routines are stored
    in shared libraries, which provide essential services to more than one program.
    If a package requires a shared resource such as a shared library, it is said to
    have a dependency. Modern package management systems provide some method of dependency
    resolution to ensure that when a package is installed, all of its dependencies
    are installed, too.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# High- and Low-Level Package Tools


    Package management systems usually consist of two types of tools.


    +   - Low-level tools that handle tasks such as installing and removing package
    files

    - High-level tools that perform metadata searching and dependency resolution


    In this chapter, we will look at the tools supplied with Debian-style systems
    (such as Ubuntu and many others) and those used by Red Hat. While all Red Hat-style
    distributions rely on the same low-level program (rpm), they use different high-level
    tools. For our discussion, we will cover the high-level program yum, used by Red
    Hat Enterprise Linux and CentOS. Other Red Hat-style distributions provide high-level
    tools with comparable features (see Table 14-2).


    Table 14-2: Packaging System Tools


    | Distributions | Low-level tools | High-level tools |

    |---|---||

    | Debian-style | dpkg | apt-get, apt, aptitude |

    | Fedora, Red Hat Enterprise Linux, CentOS | rpm | yum, dnf |


    # Common Package Management Tasks


    Many operations can be performed with the command line package management tools.
    We will look at the most common. Be aware that the low-level tools also support
    the creation of package files, an activity outside the scope of this book.


    In the discussion that follows, the term *package_name* refers to the actual name
    of a package rather than the term *package_file*, which is the name of the file
    that contains the package.


    # Finding a Package in a Repository


    Using the high-level tools to search repository metadata, a package can be located
    based on its name or description (see Table 14-3).


    Table 14-3: Package Search Commands


    | Style | Command(s) |

    |---|---|n| Debian | apt-get update, apt-cache search search_string |

    | Red Hat | yum search search_string |'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'For example, to search a yum repository for the emacs text editor, we can use
    this command:


    yum search emacs



    # Installing a Package from a Repository


    High-level tools permit a package to be downloaded from a repository and installed
    with full dependency resolution (see Table 14-4).


    Table 14-4: Package Installation Commands


    | Style | Command(s) |

    | --- | --- |

    | Debian | apt-get update

    | | apt-get install package_name

    | Red Hat | yum install package_name |


    For example, to install the emacs text editor from an apt repository on a Debian
    system, we can use this command:


    apt-get update; apt-get install emacs



    # Installing a Package from a Package File


    If a package file has been downloaded from a source other than a repository, it
    can be installed directly (though without dependency resolution) using a low-level
    tool (see Table 14-5).


    Table 14-5: Low-Level Package Installation Commands


    | Style | Command(s) |

    | --- | --- |

    | Debian | dpkg -i package_file

    | Red Hat | rpm -i package_file |


    For example, if the emacs-22.1-7.fc7-i386.rpm package file had been downloaded
    from a non-repository site, it would be installed this way:


    rpm -i emacs-22.1-7.fc7-i386.rpm



    > NOTE Because this technique uses the low-level rpm program to perform the installation,
    no dependency resolution is performed. If rpm discovers a missing dependency,
    rpm will exit with an error.'
