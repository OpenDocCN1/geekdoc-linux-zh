  md: 'In most cases, you can think of cat as analogous to the TYPE command in DOS.
    You can use it to display files without paging. For example, the following will
    display the contents of the file ls-output.txt:


    ```

    $me@linuxbox~$ cat ls-output.txt

    ```


    cat is often used to display short text files. Because cat can accept more than
    one file as an argument, it can also be used to join files. Suppose we have downloaded
    a large file that has been split into multiple parts (multimedia files are often
    split via Usenet), and we want to join them back together. If the files were named
    as:


    ```

    movie.mpg.001 movie.mpg.002 ... movie.mpg.099

    ```


    we could join them back together with this command:


    ```

    cat movie.mpg.* > movie.mpg

    ```


    Because wildcards always expand in sorted order, the arguments will be arranged
    in the correct order. This is all well and good, but what does this have to do
    with standard input? Nothing yet, but let''s try something else. What happens
    if we enter cat with no arguments?


    ```

    $me@linuxbox~$ cat

    ```


    Nothing happens; it just sits there like it''s hung. It might seem that way, but
    it''s really exactly what it''s supposed to do. If cat is not given any arguments,
    it reads from standard input, and standard input is, by default, attached to the
    keyboard, it''s waiting for us to type something! Try adding the following text
    and pressing ENTER:


    ```

    $me@linuxbox~$ cat

    The quick brown fox jumped over the lazy dog.

    ```


    Next, type CTRL-D (i.e., hold down the CTRL key and press D) to tell cat that
    it has reached end of file (EOF) of standard input.


    ```

    $me@linuxbox~$ cat

    The quick brown fox jumped over the lazy dog.

    The quick brown fox jumped over the lazy dog.

    ```


    In the absence of filename arguments, cat copies standard input to output, so
