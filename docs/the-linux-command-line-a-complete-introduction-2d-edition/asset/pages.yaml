    Up to now, we''ve encountered any commands that make use of standard input (actually
    we have, but we''ll reveal that surprise a little bit later), so need to introduce
    one.


    # cat: Concatenate Files


    The cat command reads one or more files and copies them to standard output like
    so:


    ```

    cat filename

    ```'
