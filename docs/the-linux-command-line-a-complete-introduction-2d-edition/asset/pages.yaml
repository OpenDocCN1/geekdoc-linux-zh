  md: '![](img/0cf46e6370424e4fc9bc72ba090b1e02_120_0.png)


    # umask: Set Default Permissions


    The umask command controls the default permissions given to a file it is created.
    It uses octal notation to express a mask of bits to be removed from a file''s
    mode attributes. Let''s take a look.


    ```

    ```

    [melinuxbox ~]$ rm -f foo.txt

    [melinuxbox ~]$ umask

    0002

    [melinuxbox ~]$ > foo.txt

    [melinuxbox ~]$ ls -l foo.txt

    -rw-rw-- 1 me 2018-03-06 14:53 foo.txt

    ```

    ```


    We first removed any old command to make sure we were starting fresh. Now we ran
    the umask without an argument to see the current value. It responded with the
    value 0002 (the value 0002 is another common default value), which is the octal
    representation of our mask. We create a new instance of the file foo.txt and observe
    its permissions.


    We can see that both the owner and group get read and write permissions, while
    everyone gets only read permission. The reason that world does not have write
    permission is because of the value of the umask. Let''s repeat our experiment,
    this ourselves.


    ```

    ```

    [melinuxbox ~]$ rm foo.txt

    [melinuxbox ~]$ umask 0002

    [melinuxbox ~]$ > foo.txt

    [melinuxbox ~]$ ls -l foo.txt

    -rw-rw-- 1 me 2018-03-06 14:58 foo.txt

    ```

    ```'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'When we set the mask to 0000 (effectively turning it off), we see that the
    file is now world writable. To understand how this works, we have to look at octal
    numbers again. If we take the mask, expand it into binary, and compare it to the
    attributes, we can see what happens.


    | Original file mode | --- | IW- IW- |

    |---|---|--|

    | Mask | 000 000 000 010 |

    | Result | --- | IW- I-- ||


    Ignore for the moment the leading zeros (we''ll get to those in a minute) and
    observe that where the 1 appears in our mask, an attribute was removed—in this
    case, the write permission is gone. That''s what the mask does. Everywhere a 1
    appears in the binary value of the mask, an attribute is unset. If we look at
    a mask value of 0022, we can see what it does.


    | Original file mode | --- | IW- IW- |

    |---|---|--|

    | Mask | 000 000 010 010 |

    | Result | --- | IW- I-- |


    Again, where a 1 appears in the binary value, the corresponding attribute is unset.
    Play with some values (try seven) to get how to use this works. When you''re done,
    remember to clean up.


    ```

    [me@linux]$ rm foo.txt; umask 0002

    ```


    Most of the time we don''t have to change the mask; the default provided by your
    distribution will be fine. In high-security situations, however, we will want
    to control it.


    # Special Permissions


    Though we usually see an octal permission mask expressed as a three-digit, it
    is more technically correct to express it in four digits. Why? Because, in addition
    to read, write, and execute permissions, there are some other, less used, permissions
    settings.


    The first of these is the setuid (octal 4000). When applied to an executable file,
    it changes the effective user ID from that of the real user (the user actually
    running the program) to that of the program''s owner. Most often this is given
    to a few programs by the superuser. When an ordinary user runs a program that
    is setuid root, the program runs with the effective privileges of the superuser.
    This allows them to access files and directories that an ordinary user would normally
    be prohibited from accessing. Clearly, because this raises security concerns,
    the number of setuid programs must be held to an absolute minimum.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'The second less-used setting is the setgid bit (octal 2000), which, like the
    setuid bit, changes the effective group ID from the real group ID of the real
    user to that of the file owner. If the setgid bit is set on a directory, newly
    created files in the directory will be given the group ownership of the directory
    rather than the file''s creator. This is useful in a shared directory when members
    of a common group need access to all the files in the directory, regardless of
    the file owner''s primary group.


    The third is the sticky bit (octal 1000). This is a leftover from ancient Unix,
    where it was possible to mark an executable file as "not swappable". On files,
    Linux ignores the sticky bit, but if applied to a directory, it prevents users
    from deleting or renaming files unless the user is either the owner of the directory,
    the owner of the file, or the superuser. This is often used to control access
    to a shared directory, such as /tmp.


    Here are some examples using chmod with symbolic notation to set these special
    permissions. First, here''s an example of assigning setuid to a


    ```

    chmod u+s program

    ```


    Next, here''s an example of assigning setgid to a directory:


    ```

    chmod g+s dir

    ```


    Finally, here''s an example of assigning the sticky bit to a directory:


    ```

    chmod +t dir

    ```


    When viewing the output from ls -l, you can determine the special permissions.
    Here are some examples. First, an example of a program that is setuid:


    ```

    -rwsrxr-x

    ```


    Here''s an example of a directory that has the setgid attribute:


    ```

    drwxrxr-x

    ```


    Here''s an example of a directory with the sticky bit set:


    ```

    drwxrwxrwt

    ```


    # Changing Identities


    At various times, we may find it necessary to take on the identity of another
    user. Often, we want to gain superuser privileges to carry out some administrative
    task, but it is also possible to "become" another'
