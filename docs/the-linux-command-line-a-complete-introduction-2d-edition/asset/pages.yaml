  md: "# 33\n\n# FLOW CONTROL: LOOPING\nWITH FOR\n\n![](img/0cf46e6370424e4fc9bc72ba090b1e02_444_0.png)\n\
    \nIn this final chapter on flow control, we will look at another of the shell's\
    \ looping constructs. The for loop differs from the while and until loops in that\
    \ it provides a means of processing sequences during a loop. This turns out to\
    \ be very useful when programming. Accordingly, the for loop is a popular construct\
    \ in bash scripting.\n\nA for loop is implemented, naturally enough, with the\
    \ for compound command. In bash, for is available in two forms.\n\n# for: Traditional\
    \ Shell Form\n\nThe original for command's syntax is as follows:\n\n```\nfor variable\
    \ [in words]; do\n  commands\ndone\n```"
  merge: -1
  pgno: 444
- img_proc: true
  md: "where variable is the name of a variable that will increment during the execution\
    \ of the loop, words is an optional list of items that will be sequentially assigned\
    \ to variable, and commands are the commands that are to be executed each iteration\
    \ of the loop.\n\nThe for command is useful on the command line. We can easily\
    \ demonstrate how it works.\n\n```\n[me@linuxbox ~]$ for i in A B C D; do echo\
    \ $i; done\nA\n\nC\nD\n```\n\nIn this example, for is given a list of four words:\
    \ A, B, C, and D. With a list of four words, the loop is executed four times.\
    \ Each word is assigned to the variable i. Inside the loop, we have an echo command\
    \ that displays the value of i to show the assignment. As with the while and until\
    \ loops, the done keyword completes the loop.\n\nThe really powerful feature of\
    \ for is one of interesting ways we can create the list of words. For example,\
    \ we can do it through brace expansion, like so:\n\n```\n[me@linuxbox ~]$ for\
    \ i in {A..D}; do echo $i; done\nA\n\nC\nD\n```\n\nor we could use a pathname\
    \ expansion, as follows:\n\n```\n[me@linuxbox ~]$ for i in distros*.txt; do echo\
    \ \"$\"\ndistros-by-date.txt\ndistros-dates.txt\ndistros-key-names.txt\ndistros-key-vernums.txt\n\
    distros-names.txt\ndistros.txt\ndistros-vernums.txt\ndistros-versions.txt\n```\n\
    \nPathname expansion provides a nice, clean list of pathnames that can be processed\
    \ in the loop. The one precaution needed is to check that the expansion matched\
    \ something. By default, if the expansion fails to match any files, the wildcards\
    \ themselves (distros*.txt in the preceding example) will be returned. To guard\
    \ against this, we would code the preexample in a script like this:\n\n```\nfor\
    \ i in distros*.txt; do\n  if [[ -e \"$i\" ]]; then\n    echo \"$i\"\n```"
