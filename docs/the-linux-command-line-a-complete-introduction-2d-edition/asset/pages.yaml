- img_proc: true
  md: "Let's look at some ways design could be improved. First, it might be wise to\
    \ ensure that the dir_name variable expands into only one word by quoting it and\
    \ make the execution of rm contingent on the success of cd.\n\n```\ncd \"$dir_name\"\
    \ && rm *\n```\n\nThis way, if the cd command fails, the rm command is not carried\
    \ out. This is better but still leaves the possibility that the variable, dir_name,\
    \ is unset or empty, which would result in the files in the user's home directory\
    \ being deleted. This could also be achieved by checking that the dir_name actually\
    \ contains the name of an existing directory.\n\n```\n[[ \"$dir_name\" ]] && cd\
    \ \"$dir_name\" && rm *\n```\n\nOften, it is best to include logic to terminate\
    \ the script and report an error when a situation such as the shown previously\
    \ occurs.\n\n```\n# Delete files in directory dir_name\nif [[ ! -d \"$dir_name\"\
    \ ]]; then\n    echo \"No such directory: '$dir_name'\" >2\n    exit 1\nfi\nif\
    \ ! cd \"$dir_name\"; then\n    echo \"Cannot cd to '$dir_name'\" >2\n    exit\
    \ 1\nfi\nif ! rm *; then\n    echo \"File deletion failed. Check results\" >2\n\
    \    exit 1\nfi\n```\n\nHere, we check both the name, to see that it is an existing\
    \ directory, and the success of the cd command. If either fails, a descriptive\
    \ error message is sent to standard error, and the script terminates with an exit\
    \ status to indicate a failure.\n\n# Watch Out for Filenames\n\nThere is another\
    \ problem with this file deletion script that is more obscure but could be very\
    \ dangerous. Unix (and Unix-like operating systems) has, in the opinion of me,\
    \ a serious design flaw when it comes to filenames there are only two characters\
    \ that cannot be included in a filename. The first is the / character since it\
    \ is used to separate elements of a pathname, and the second is the null character\
    \ (a zero byte), which is used internally to mark the ends of strings. Everything\
    \ else is legal including spaces, tabs, line feeds, carriage returns, and so on."
