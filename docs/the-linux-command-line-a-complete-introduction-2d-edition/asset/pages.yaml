    file''s times have been updated.


    ```

    [me@linuxux ~]$ touch playground/timestamp

    [me@linuxux ~]$ stat playground/timestamp

    File: ''playground/timestamp''

    Size: 0 Blocks: 0 IO Block: 4096 empty file

    Device: 80h/205id Inode: 14265061 Links: 1

    Access: (644/rw-r--) Uid: (1001/me) Gid: (1001/me)

