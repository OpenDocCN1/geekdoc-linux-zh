    # Testing and Repairing File Systems


    In our early discussion of the /etc/fstab file, we saw some mysterious digits
    at the end of each file. Each time the system boots, it routinely checks the integrity
    of the file systems before mounting them. This is done by the fsck program (short
    for "file system check"). The last number in fstab entry specifies the order in
    which the devices are to be checked. In our previous example, we see that the
    root file system is checked first, followed by the home and boot file systems.
    Devices with a zero as the last digit are not routinely checked.


    In addition to checking the integrity of file systems, fsck can also repair corrupt
    file systems with varying degrees of success, depending on the amount of damage.
    In Unix-like file systems, recovered portions of files are placed in the lost-found
    directory, located in the root of each file system.


    To check the file drive (which should be unmounted first), we could do the following:


    ```

    [me@linuxbox ~] sudo fsck /dev/sdb1

    fsck 1.40.8 (13-Mar-2016)

    efsck 1.40.8 (13-Mar-2016)

    dev/sdb1: clean, 11/3904 files, 1661/15608 blocks

    ```


    These days, file system corruption is quite rare unless there is a hardware problem,
    such as a failing disk drive. On most systems, file system corruption detected
    at boot time will cause the system to stop and direct you to run fsck before continuing.


    > WHAT THE FSCK?

    In Unix, the word fsck is often used in place of a popular word with which it
    shares three letters. This is especially appropriate, given that you will probably
    be uttering the aforementioned fsck if you find yourself in a situation where
    you are forced to run fsck.'
