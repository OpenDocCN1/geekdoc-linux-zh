    # Shutting Down the System


    The process of shutting down the system involves the orderly termination of all
    the processes on the system, as well as performing some vital housekeeping chores
    (such as syncing all of the mounted file systems) before the system powers off.
    Four commands can perform this function:


    +   - halt

    - poweroff

    - reboot

    - shutdown


    The first three are pretty self-explanatory and are generally used with any command
    line options. Here''s an example:


    ```

    [melinuxbox ~]$ sudo reboot

    ```


    The shutdown command is a bit more interesting. With it, we can specify which
    of the actions to perform (halt, power down, or reboot) and provide a time delay
    to the shutdown event. Most often it is used like this to halt the system:


    ```

    [melinuxbox ~]$ sudo shutdown -h now

    ```


    or like this to reboot the system:


    ```

    [melinuxbox ~]$ sudo shutdown -r now

    ```


    The delay can be specified in a variety of ways. See the shutdown page for details.
    Once the shutdown command is executed, a message is "broadcast" to all logged-in
    users warning them of the impending event.'
