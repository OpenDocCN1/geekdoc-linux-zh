  md: '# Slicing and Dicing


    The next three programs we will discuss are used to peel columns of text out of
    files and recombine them in useful ways.


    # cut—Remove Sections from Each Line of Files


    The cut program is used to extract a section of text from a line and output the
    extracted section to standard output. It can accept multiple file arguments or
    from standard input.


    Specifying the section of the line to be extracted is somewhat awkward and is
    specified using the options in Table 20-3.


    **Table 20-3:** cut Selection Options


    | Option | Long option | Description |

    | --- | --- | --- |

    | -c list | --characters=list | Extract the portion of the line defined by list.
    The list may consist of one or more comma-separated numerical ranges. |

    | -f list | --fields=list | Extract one or more fields from the line defined as
    list. The list may contain one or more fields or ranges separated by commas. |

    | -d delim | --delimiter=delim | When -f is specified, use delim as the field
    delimiter. By default, fields must be separated by a single tab character. |

    | | --complement | Extract the entire line of text, except for those portions
    specified by -c and/or -f. |


    As we can see, the cut extracts text is rather inflexible, cut is used to extract
    text from files that are produced by other programs, rather than text directly
    typed by humans. We''ll take a look at our distros.txt file to see whether it
    is "clean" enough to be a good specimen for our cut examples. If we use cut with
    the -A option, we can see whether the file meets requirements of tab-separated
    files.


    ```

    [me@linux ~]$ cut -A distros.txt

    SU~I10.2/I10/07/2006

    Fedora^I10.11/I25/2008

    SU~I10.1/I06/19/2008

    Ubuntu^I8.04/I04/24/2008

    Fedora^I18/I11/08/2007

    SU~I10.3/I10/04/2007

    Ubuntu^16.6/I10/26/2006

    Fedora^I7.I05/31/2007

    Ubuntu^17.10/I10/18/2007

    Ubuntu^17.04/I04/19/2007

    SU~I10.1*I05/11/2006

    Fedora^I16/I10/24/2006

    Fedora^I19/I05/13/2006

    ```'
