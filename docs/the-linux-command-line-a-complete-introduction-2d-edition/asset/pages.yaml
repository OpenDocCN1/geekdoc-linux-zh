  md: '# Table 12-1: Cursor Movement Keys (continued)


    | Key | Moves cursor |

    |---|---|

    | k or up arrow | Up one line. |

    | 0 (zero) | To the beginning of the current line. |

    | ^ | To the first non-whitespace character on the current line. |

    | $ | To the end of the current line. |

    | w | To the beginning of the next word or punctuation characters. |

    | W | To the beginning of the next word, ignoring punctuation characters. |

    | b | To the beginning of the previous word or punctuation character. |

    | B | To the beginning of the previous word, ignoring punctuation characters.
    |

    | CTRL-F or PAGE DOWN | Down one page. |

    | CTRL-B or PAGE UP | Up one page. |

    | numberG | To one line. For example, 1g moves to the first line of the file.
    |

    | G | To the last line of the file.|


    Why are the h, j, k, and l keys used for cursor movement? When vi was originally
    written, not all video terminals had arrow keys, and skilled typists could use
    regular keyboard keys to move the cursor without ever having to lift their fingers
    from the keyboard.


    Many commands in vi can be prefixed with a number, as the G command listed in
    Table 12-1. By prefixing a command with a number, we may specify the number of
    times a command is to be carried out. For example, the command 5j causes vi to
    move the cursor down five lines.


    # Basic Editing


    Most editing consists of a few basic operations such as inserting text, deleting
    text, and moving text around by cutting and pasting, vi of course supports all
    of these operations in its own unique way. vi also provides a limited form of
    undo. If we press the u key while in command mode, vi will undo the change that
    you made. This will come in handy as we try some of the basic editing commands.


    # Appending Text


    vi has several different ways of entering insert mode. We have already used the
    i command to insert text.


    Let''s go back to our foo.txt file for a moment.


