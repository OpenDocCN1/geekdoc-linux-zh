    In it, we see a number of files. Programs by the GNU Project, and many others,
    will supply the documentation files README, INSTALL, NEWS, and COPYING. These
    files contain the description of the program, how to build and install it, and
    its licensing terms. It is always a good idea to carefully read the README and
    INSTALL files before attempting to build the program.


    The other interesting files in this directory are the ones ending with c and h.


    ```

    [me@linuxbox diction-1.11]$ ls *.c

    diction.c getopt1.c getopt.c misc.c sentence.c style.c

    [me@linuxbox diction-1.11]$ ls *.h

    getopt.h getopt_int.h misc.h sentence.h

