    The parent script continues and executes a wait command with the PID of the child
    process. This causes the parent script to pause until the child exits, which point
    the parent script concludes.


    When executed, the parent and child scripts produce the following output:


    ```

    [me@linuxbox ~$ async-parent

    Parent: starting...

    Parent: launching child script...

    Parent: child (PID= 6741) launched.

    Parent: continuing...

    Child: child is running...

    Parent: pausing to wait for child to finish...

    Child: child is done. Exiting.

    Parent: child is finished. Continuing...

    Parent: parent is done. Exiting.

    ```


    # Named Pipes


    In most Unix-like systems, it is possible to create a special type of file called
    a named pipe. Named pipes are used to create a connection between two processes
    and can be used just like other types of files. They are not popular, but they''re
    good to know about.


    There is a common programming architecture called client-server, which can make
    use of a communication method such as named pipes, as well as other kinds of interprocess
    communication such as network connections.


    The widely used type of client-server system is, of course, a web browser communicating
    with a web server as the client, making requests to the server, and the server
    responds to the browser with web pages.


    Named pipes behave like files but actually form first-in-first-out (FIFO) buffers.
    As with ordinary (unnamed) pipes, data goes in one end and emerges out the other.
    With named pipes, it is possible to set up something like this:


    ```

    process1 > named_pipe

    ```


    and this:


    ```

    process2 < named_pipe

    ```


    and it will behave like this:


    ```

    process1 | process2

    ```'
