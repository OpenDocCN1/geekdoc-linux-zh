    ```


    The ^H (CTRL-H) characters are the backspaces used to create the bold-face face
    effect. Likewise, we can also see a backspace/underscore sequence to produce underlining.


    # Graphical Printers


    The development of GUIs led to major changes in printer technology. As computers
    moved to more picture-based displays, printing moving from character-based to
    graphical techniques. This was facilitated by the advent of the low-cost laser
    printer, instead of printing fixed characters, could print tiny dots anywhere
    in the printable area of the page. This made printing proportional fonts (like
    those used by typesetters), and even photographs and high-quality diagrams, possible.


    However, moving from a character-based scheme to a graphical scheme presented
    a formidable technical challenge. Here''s why: the number of bytes needed to fill
    a page using a character-based printer can be calculated this way (assuming 60
    lines per page containing 80 characters):


    60 × 80 = 4,800


    In comparison, a 300 dot per inch (DPI) laser printer (assuming an 80-inch area
    per page) requires this many bytes:


    (8 × 300) × (10 × 300) / 8 = 900,000 bytes


    Many of the slow PC networks simply could not handle the lately of data required
    to print a full page on a laser printer, so it was clear that a clever invention
    was needed.


    That invention turned out to be the page description language (PDL). A page description
    language is a programming language that describes the contents of a page. Basically
    it says, “Go to this position, draw a character in 10-point Helvetica to this
    position ... until the entire page is described. The first PDL was PostScript
    from Adobe Systems, which is still in wide use today. The PostScript language
    is a complete programming language tailored for typography and other kinds of
    graphics and imaging. It includes built-in support for 35 standard, high-quality
    fonts, plus the ability to'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'accept additional font definitions at runtime. At first, support for PostScript
    was built into the printers themselves. This solved the data transmission problem.
    The typical PostScript program was very verbose compared to the simple stream
    of character-based printers, which was much smaller than the number of bytes required
    to represent the entire page. The printer accepted a PostScript program as input.
    It contained its own processor and memory (oftimes making the printer a more powerful
    computer than the computer to which it was attached) and executed a special program
    called a PostScript interpreter, which read the incoming PostScript program and
    rendered the results into its internal memory, forming the pattern of bits (dots)
    that was transferred to the paper. The generic name for this process of rendering
    something into a large pattern (a bitmap is a raster image processor (RIP)).


    As the years went, by both computers and networks became much faster. This allowed
    the RIP to move from the printer to the host computer, which, in turn, permitted
    high-quality printers to be much less expensive.


    Many printers today still accept character-based strings, but many low-cost printers
    do not. They rely on the host computer''s RIP to provide a stream of bits to print
    as dots. There are some PostScript printers, too.


    # Printing with Linux


    Modern Linux systems employ two software suites to perform and manage printing.
    The first, the Common Unix Printing System (CUPS), provides print drivers and
    print-job management, and the second, Ghostscript, a PostScript interpreter, acts
    as a RIP.


    CUPS manages printers by creating and maintaining print queues. As we discussed
    in the earlier history lesson, Unix printing was originally designed to manage
    a centralized printer by multiple users. Since printers are slow by nature, compared
    to the computers that are feeding them, printing systems need a way to schedule
    multiple print jobs and keep things organized. CUPS also has the ability to recognize
    different types of data (within reason) and can convert files to a printable format.


    # Preparing Files for Printing


    As command line users, we are most interested in printing text, though it is possibly
    to print other data formats as well.


    # pr-Convert Text Files for Printing


    We looked at pr a little in the previous chapter. Now we will examine some of
    its options used in conjunction with printing. In our history of printing, we
    saw how character-based printers use monospaced fonts, resulting in fixed numbers
    of characters per line and lines per page. pr is used to adjust text to fit on
    a specific page size, with optional page headers and margins. Table 22-1 summarizes
    its most commonly used options.'
