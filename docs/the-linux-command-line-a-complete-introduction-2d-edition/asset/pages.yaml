  md: '# BANISH YOUR MOUSE


    The Linux Command Line will take you from your first terminal keystrokes to writing
    full programs in the latest version of bash, the most popular Linux shell.


    The second edition of this worldwide best seller includes coverage of bash 4.x
    features like new redirection operators and shell expansions. An updated shell
    scripting discusses modern, robust shell scripting practices and ways of avoiding
    common types of dangerous failures.


    As with the first edition, you''ll learn timeless command line skills like file
    navigation, environment configuration, command chaining, and pattern matching
    with regular expressions. You''ll explore the philosophy behind the many command
    line tools and the rich heritage that your Linux machine inherits from Unix supercomputers
    of yore—all handed down by generations of mouse-shunning guns.


    As you work through the book''s short, easily digestible chapters, you''ll learn
    how to:


    +   - Create and delete files, directories, and symlinks


    +   - Administer your system, from networking and package installation to process
    management


    +   - Use standard input and output, redirection, and pipelines


    +   - Edit files with vi, the world''s most popular text editor


    +   - Write shell scripts to automate common boring tasks


    +   - Slice and dice text files with cut, paste, grep, patch, and sed


    Once you''ve overcome your initial ''shell shock,'' you''ll find that the command
    line is a natural and expressive way to communicate with your computer.


    # ABOUT THE AUTHOR


    William Shotts was a software professional and avid Linux user for more than 15
    years. He has an extensive background in software development, including technical
    support, quality assurance, and documentation. He is also the creator of LinuxCommand.org,
    a Linux education and advocacy site featuring news, reviews, and extensive support
    for using the Linux command line.


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_505_0.png)


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_505_1.png)'
