    # Arithmetic Expansion


    The shell allows arithmetic to be performed by expansion. This allows us to use
    the shell prompt as a calculator.


    ```

    me@linuxbox ~]$ echo $(((2 + 2))

    4

    ```


    Arithmetic expansion uses the following format:


    ```

    $((expression))

    ```


    where expression is an arithmetic expression consisting of values and arithmetic
    operators.

    Arithmetic expansion supports only integers (whole numbers, no decimals) but can
    perform a number of different operations. Table 7-1 describes a few of the supported
    operators.


    # Table 7-1: Arithmetic Operators


    | Operator | Description |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division (but remember, since expansion supports only integer arithmetic,
    results are integers) |

    | % | Modulo, which simply means “remainder” |

    | ** | Exponentiation |


    Spaces are not significant in arithmetic expressions, and expressions may be nested.
    For example, to multiply 5 squared by 3, we can use this:


    ```

    me@linuxbox ~]$ echo $((5**2) * 3)

    75

    ```


    Single parentheses may be used to group multiple subexpressions. With this technique,
    we can rewrite the previous example and get the same result using a single expansion
    instead of two.'
