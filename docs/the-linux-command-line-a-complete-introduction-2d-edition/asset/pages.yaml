    # # Summing Up


    In this chapter, we saw how Unix-like systems such as Linux manage user permissions
    to allow the read, write, and execution access to files and directories. The basic
    ideas of this system of permissions date back to the early days of Unix and have
    stood up pretty well to the test of time. But the native permissions mechanism
    in Unix-like systems lacks the fine granularity of more modern systems.'
