  md: "| Option | Description |\n| --- | --- |\n| -r | Raw mode. Do not interpretslash\
    \ characters as escapes. |\n| -s | Silent mode. Do not echo characters to the\
    \ display as they are typed. This is useful when inputting passwords and other\
    \ confidential information. |\n| -t seconds | Timeout. Terminate input after seconds.\
    \ read returns a non-zero exit status if an input times out. |\n| -u fd | Use\
    \ input from file descriptor fd, rather than standard input.\n\nUsing the various\
    \ options, we can do interesting things with read. For example, with the -p option,\
    \ we can provide a prompt string.\n\n```\n```bash\n#!/bin/bash\n\n# read-single:\
    \ read multiple values into default variable\nread -p \"Enter one or more values\
    \ > \"necho \"REPLY = '$REPLY'\n```\n```\n\nWith the -t and -s options, we can\
    \ write a script that reads \"secret\" and times out if the input is not completed\
    \ in a specified time.\n\n```\n```bash\n#!/bin/bash\n\n# read-secret: input a\
    \ secret passphrase\nif read -t 10 -sp \"Enter secret passphrase > secret_pass\"\
    ; then\n    echo -e \"\\nSecret passphrase = '$secret_pass\"\nelse\n    echo -e\
    \ \"\\nTimed out\" >&2\n    exit 1\n```\n```\n\nThe script prompts the user for\
    \ a secret passphrase and waits ten seconds for input. If the entry is not completed\
    \ within the specified time, the script exits with an error. Because the -s option\
    \ is included, the characters of the passphrase are not echoed to the display\
    \ as they are typed.\nIt's possible to supply the user with a default response\
    \ using the -e and -i options together.\n\n```\n```bash\n#!/bin/bash\n\n# read-default:\
    \ supply a default value if user presses Enter key.\nread -e p \"What is your\
    \ user name? \" -i $USER\necho \"You answered: '$REPLY'\n```\n```"
