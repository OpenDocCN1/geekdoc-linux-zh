    is important to enclose the command in quotes, as we do not want expansion to
    occur in our shell but rather in the new shell.


    ```

    [me@linuxbox ~]$ su -c ''ls -l /root/*''

    Password:

    rw------- 1 root       754 2007-08-11 03:19 /root/anaconda-ks.cfg

