  md: 'For example, to make a zip archive of our playground, we would do this:


    ```

    me@linuxbox ~$ zip -r playground.zip playground

    ```


    Unless we include the -r option for recursion, only the playground directory (none
    of its contents) is stored. Although the addition of the extension .zip is automatic,
    we will include the file extension for clarity. During the creation of the zip
    archive, zip will normally display a series of messages like this:


    ```

    adding: playground/dir-020/file-Z (stored 0%)

    adding: playground/dir-020/file-Y (stored 0%)

    adding: playground/dir-020/file-X (stored 0%)

    adding: playground/dir-087/ (stored 0%)

    adding: playground/dir-087/file-S (stored 0%)

    ```


    These messages show the status of each file added to the archive. zip will add
    files to the archive using one of two storage methods: either it will "store"
    a file without compression, as shown here, or it will "deflate" the file that
    performs compression. The numeric value displayed indicates the amount of compression
    achieved. Since our playground contains only empty files, no compression is performed
    on its contents.


    Extracting the contents of a zip file is straightforward when using the unzip
    program.


    ```

    me@linuxbox ~$ cd foo

    me@linuxbox foo$ unzip ../playground.zip

    ```


    One to think about zip (as opposed to tar) is that if an existing archive is specified,
    it is updated rather than replaced. This means the existing archive is preserved,
    but new files are added, and matching files are replaced.


    We can list and extract files selectively from a zip archive by specifying them
    to unzip.


    ```

    me@linuxbox ~$ unzip -l playground.zip playground/dir-087/file-Z

    Archive: ../playground.zip

    ```


    | Length Date Time Name |

    | 0 10-05-18 09:25 playground/dir-087/file-Z |

    | 0 1 file |


    ```

    me@linuxbox ~$ cd foo

    me@linuxbox foo$ unzip ../playground.zip playground/dir-087/

    Archive: ../playground.zip

