  md: '# Table 17-5: find AND/OR Logic


    | Results of expr1 | Operator | expr2 is ... |

    |---|---|---|

    | True | -and | Always performed |

    | False | -and | Never performed |

    | True | -or | Never performed |

    | False | -or | Always performed |


    Why does this happen? It''s done to improve performance. Take -and, for example.
    We know that the expression expr1 -and expr2 cannot be true if the result of expr1
    is false, so there is no point in performing expr2. Likewise, we have the expression
    expr1 -or expr2 and the result of expr1 is true, there is no point in performing
    expr2, as we already know that the expression expr1 -or expr2 is true.


    OK, so it helps it faster. Why is this important? It''s important because we can
    rely on this behavior to control how actions are performed, as we will see soon.


    # Predefined Actions


    Let''s get some work done! Having a list of results from our find command is useful,
    but what we really want to do is act on the items of the list. Unfortunately,
    find allows actions to be performed based on the search results. There are a set
    of predefined actions and several ways to apply user-defined actions. First, let''s
    look at a few of the predefined actions listed in Table 17-6.


    # Table 17-6: Predefined find Actions


    | Action | Description |

    |---|---|

    | -delete | Delete the currently matching file. |

    | -ls | Perform the equivalent of ls -dils on the matching file. Output is sent
    to standard output. |

    | -print | Output the full pathname of the matching file to standard output. This
    is the default action if no other action is specified. |

    | -quit | Quit once a match has been made. |


    As with the tests, there are many more actions. See the find page for full details.

    In the first example, we did this:


    ```

    find ~

    ```


    This produced a list of every file and subdirectory contained within our home
    directory. It produced a list because the -print action is implied if'
