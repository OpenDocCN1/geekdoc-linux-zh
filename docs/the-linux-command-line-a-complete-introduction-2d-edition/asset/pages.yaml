    # # In—Create Links


    The ln command is used to create hard or symbolic links. It is used in one of
    two ways. The following creates a hard link:


    ln file link


    The following creates a symbolic link:


    ln -s item link


    where item is either a file or a directory.


    # # Hard Links


    Hard links are the Original Unix way of creating links, compared to symbolic links,
    which are more modern. By default, every file has a single hard link that gives
    the file name. When we create a hard link, we create an additional directory entry
    for a file. Hard links have two important limitations.


    +   - A hard link cannot reference a file outside its file system. This means
    a link cannot reference a file that is not on the same disk partition.

    - A hard link may not reference a directory.


    A hard link is indistinguishable from the file itself. Unlike a symbolic link,
    when you list a directory containing a hard link, you will see no indication of
    the link. When a hard link is deleted, the link is removed, but the contents of
    the file itself continue to exist (that is, its space is de-allocated) until all
    links to the file are deleted.


    It is important to be aware of hard links because you might encounter them from
    time to time, but modern practice prefers symbolic links, which we will cover
    next.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Symbolic Links


    Symbolic links were created to overcome the limitations of hard links. They work
    by creating a special type of file that contains a text pointer to the referred
    file or directory. In this regard, they operate in the same way as a Windows shortcut,
    though of course they predate the Windows feature by many years.


    A file pointed to by a symbolic link and the symbolic link are are indistinguishable
    from one another. For example, if you write something to the symbolic link, the
    referred file is written to. When you delete a symbolic link, however, only the
    link is deleted, not the file. If the file is deleted before the symbolic link,
    the link will continue to exist but point to nothing. In this case, the link is
    said to be broken. In many implementations, the ls command will display broken
    links in a distinguishing color, such as red, to reveal their presence.


    The concept of links can seem confusing, but hang in there. We''re going to try
    all this stuff, and it will, ideally, become clear.


    # Building a Playground


    Because we are going to do some real file manipulation, let''s build a safe place
    to "play" with our file manipulation commands. We need a directory to work in.
    We''ll create one in our home directory and call it playground.


    # Creating Directories


    The mkdir command is used to create a directory. To create our playground directory,
    we will first make sure we are in our home directory and then create the new directory.


    ```

    [me@linux ~]$ cd

    [me@linuxbox ~]$ mkdir playground

    ```


    To make our playground a little more interesting, let''s create a couple of directories
    inside it called dir1 and dir2. To do this, we will change our current working
    directory to playground and execute another mkdir.


    ```

    [me@linuxbox ~]$ cd playground

    [me@linuxbox playground]$ mkdir dir1 dir2

    ```


    Note that the mkdir command will accept multiple arguments allowing us to create
    both directories with a single command.


    # Copying Files


    Next, let''s get some data into our playground. We''ll do this by copying a file.
    Using the cp command, we''ll copy the passwd file from the /etc directory to the
    current working directory.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '```

    [me@linuxbox playground]$$ cp /etc/passwd .

    ```


    Notice how we used shorthand for the current working directory, the single trailing
    period. So now if we perform an ls, we will see our file.


    ```

    [me@linuxbox playground]$$ ls -1

    total 12

    drwxrwx-x 2 me 4096 2018-01-10 16:40 dir1

    drwxrwx-x 2 me 4096 2018-01-10 16:40 dir2

    --rw-r--r-- 1 me 1650 2018-01-10 16:07 passwd

    ```


    Now, for fun, let''s repeat the copy using the -v option (verbose) to see what
    it does.


    ```

    [me@linuxbox playground]$$ cp -v /etc/passwd

    /etc/passwd -> ''./passwd''

    ```


    The cp command performed the copy again but this time displayed a concise message
    indicating what it was performing. Notice that cp overwrite the first copy without
    any warning. Again, this is a case of cp assuming we know we''re doing. To get
    a warning, we will include the -i (interactive) option.


    ```

    [me@linuxbox playground]$$ cp -i /etc/passwd

    cp: overwrite "./passwd"?

    ```


    Responding to the prompt by entering a y will cause the file to be overwritten;
    any other character (for example, n) will cause cp to leave the file alone.


    # Moving and Renaming Files


    Now, the name passwd doesn''t seem very playful and this is a playground, let''s
    change it to something else.


