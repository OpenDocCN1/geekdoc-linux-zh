- img_proc: true
  md: 'Here is the syntax of a subshell:


    ```

    (command1; command2; [command3;...])

    ```


    The two differ in that a group command surrounds its commands with braces and
    a subshell uses parentheses. It is important to note that of the way bash implements
    group commands, the braces must be separated from the commands by a space and
    the last command must be terminated with either a semicolon or a newline prior
    to the closing brace.


    So, what are group commands and subshells go for? While they have an important
    difference (which we will get in a moment), they are both used to manage redirection.
    Let''s consider a script that performs redirections on multiple commands.


    ```

    ls -l output.txt

    echo "Listing of foo.txt" >> output.txt

    cat foo.txt >> output.txt

    ```


    This is pretty straightforward. Three commands have their output redirected to
    a file named output.txt. Using a group command, we could code this as follows:


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; } > output.txt

    ```


    Using a subshell is similar.


    ```

    (ls -l; echo "Listing of foo.txt"; cat foo.txt) > output.txt

    ```


    Using this technique we have saved some typing, but where a group command or subshell
    really shines is with pipelines. When constructing a pipeline of commands, it
    is often useful to combine the results of several commands into a single stream.
    Group commands and subshells make this easy.


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; } | lpr

    ```


    Here we have combined the output of our three commands and piped them into a printed
    report.


    In the script that follows, we will use group commands and several programming
    techniques that can be employed in conjunction with associative arrays. This script,
    array-2, when given the name of a directory, prints a listing of the files in
    the directory along with the names of the file''s owner and group owner. At the
    end of the listing, the script prints a tally of files belonging to each owner
    and group. Here we see the results (compressed for brevity) when the script is
    given the directory /usr/bin:


    ```

    @me@linux~$ array-2 /usr/bin

    /usr/bin/2to3-2.6      root      root

    ```'
