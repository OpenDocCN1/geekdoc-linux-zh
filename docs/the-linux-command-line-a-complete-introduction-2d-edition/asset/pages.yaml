  md: '# Try the color codes and see what you can create!


    > > NOTE

    Besides the normal (0) and bold (1) character attributes, text may be given underscore
    (4), blinking (5), and inverse (7) attributes. In the interests of good taste,
    many terminal emulators refuse to honor the blinking attribute, however.


    # # Moving the Cursor


    Escape codes can be used to position the cursor. This is commonly used to provide
    a clock or some other kind of information at a different location on the screen,
    such as in an upper corner each time the prompt is drawn. 13-4 lists the escape
    codes that position the cursor.


    Table 13-4:** Cursor Movement Escape Sequences


    | Escape code | Action |

    |--- |--- |

    | \033[1;cH | Move the cursor to line 1 and column c |

    | \033[nA | Move the cursor up n lines |

    | \033[nB | Move the cursor down n lines |

    | \033[nC | Move the cursor forward n characters |

    | \033[nD | Move the cursor backward n lines |

    | \033[2J | Clear the screen and move the cursor to the upper-left corner (line
    0, Column 0) |

    | \033[K | Clear from the cursor position to the end of the current line |

    | \033[s | Store the current cursor position |

    | \033[u | Recall the stored cursor position |


    Using the codes in Table 13-4, we will construct a prompt that draws a red bar
    at the top of the screen containing a clock (rendered in yellow text) each time
    the prompt is displayed. The code for the prompt is this formidable-looking string:


    ```

    PS1="\033[0m\033[0;41m\033[K\033[1;33m\033[u]\[033[0m\\u@/h\>$"

    ```


    Table 13-5:** Breakdown of Complex Prompt String


    | Sequence | Action |

    |--- |--- |

    | \[ | Begin a non-printing character sequence. The purpose of this is to allow
    bash to properly calculate the size of the visible prompt. Without an accurate
    calculation, command line editing features cannot position the cursor correctly.
    |'
