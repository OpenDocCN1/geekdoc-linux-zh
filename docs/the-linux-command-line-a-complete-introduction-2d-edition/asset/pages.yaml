    \ echo statements will usually do the trick.\n\n```\n#!/bin/bash\n\n# trouble:\
    \ script to demonstrate common errors\n```\n\n```\nnumber=1\necho \"number=$number\"\
    \ # DEBUG\nset -x # Turn on tracing\nif [$number = 1 ]; then\n  echo \"Number\
    \ is equal to 1\"\nelse\n  echo \"Number is not equal to 1\"\nfi\nset +x # Turn\
    \ off tracing\n```\n\nIn this example, we simply display the value of the variable\
    \ number and mark the added line with a comment to facilitate its later identification\
    \ and removal. This technique is particularly useful when watching the behavior\
    \ of loops and arithmetic within scripts.\n\n# Summing Up\n\nIn this chapter,\
    \ we looked at just a few of the problems that can crop out during development.\
    \ Of course, there are many more. The techniques described here will enable finding\
    \ most common bugs. Debugging is a fine art that is developed through experience,\
    \ both in knowing how to avoid bugs (testing constantly throughout development)\
    \ and in finding bugs (effective use of tracing)."
