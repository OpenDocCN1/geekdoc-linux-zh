    the length of element 100, which contains the string foo. It is interesting to
    note that while we assigned our string 100, bash reports only one element in the
    array. This differs from the behavior of some other languages in which the unused
    elements of the array (elements 0-99) would be initialized with empty values and
    counted. In bash, array elements exist only if they have been assigned a value
    regardless of their subscript.


    # ### Finding the Subscripts Used by an Array


    As bash allows arrays to contain "gaps" in the assignment of subscripts, it is
    sometimes useful to determine which elements actually exist. This can be done
    with a parameter expansion using the following forms:


    ```

    ${!array[*]}

    ${!array[@]}

    ```


    where array is the name of an array variable. Like the other expansions we use
    * and the @ enclosed in quotes is the most useful, as it expands into separate
    words.


    ```

    [me@linuxbox ~]$ foo=$[2]=a [4]=[6]=c

    [me@linuxbox ~]$ foo for i in "${foo[@]}"; do echo $i; done

    [me@linuxbox ~]$ foo for i in "${!foo[@]}"; do echo $i; done

    ```


    # ### Adding Elements to the End of an Array


    Knowing the number of elements in an array is no help if we need to append values
    to the end of an array since the values returned by the * and @ notation do not
    tell us the maximum array index in. Fortunately, the shell provides us with a
    solution. By using the ++ assignment operator, we can mathematically append values
    to the end of an array. Here, we assign three values


    ```

    [me@linuxbox ~]$ foo=$[a b c]

    [me@linuxbox ~]$ echo "${foo[@]}"

    [me@linuxbox ~]$ foo+=(d e f)

    [me@linuxbox ~]$ echo "${foo[@]}"

    ```'
