    Most commands use options, which consist of a single character pre-

    ceded by a dash, for example, -1. Many commands, however, including

    tose from the GNU Project, also support long options, consisting of a word

    followed by two dashes. Also, many commands allow multiple short options

    to string together. In the following example, the ls command is given

    two options, which are the -l option to produce long format output, and the

