  md: '# #6


    # # REDIRECTION


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_80_0.png)


    In this lesson we are going to unleash what may be the coolest feature of the
    command line. It''s called I/O redirection. The “I/O” stands for input/output,
    and with this facility you can redirect the input and output of commands and to
    from files, as well as connect multiple commands together into powerful pipelines.
    To show off this facility, we will introduce the following commands:


    +   - cat Concatenate files

    - sort Sort lines of text

    - uniq Report or omit repeated lines

    - grep Print lines matching a pattern

    - wc Print newline, word, and byte counts for each file

    - head Output the first part of a file

    - tail Output the last part of a file

    - tee Read from standard input and write to standard output and files'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Standard Input, Output, and Error


    Many of the programs that we have used so produce output of some kind. This output
    often consists of two types.


    +   - The program''s results; that is, the data program is designed to produce

    - Status and error messages that tell us how the program is getting along


    If we look at a command like ls, we can see that it displays its results and its
    error messages on the screen.


    Keeping with the Unix theme of "everything is a file," programs as ls actually
    send their results to a special file called standard output (often expressed as
    stdout) and errors to another file called standard error (stderr). By default,
    both standard output and standard error are linked to the screen and not saved
    into a disk file.


    In addition, many programs take input from a facility called input (stdin), which
    is, by default, attached to the keyboard.

    /O redirection allows us to change where output goes and where input comes from.
    Normally, output goes to the screen and input comes from the keyboard, but with
    I/O redirection, we can change that.


    # Redirecting Standard Output


    I/O redirection allows us to redefine where standard output goes. To redirect
    standard output to another file instead of the screen, we use the > redirection
    operator followed by the name of the file. Why would we want to do this? It''s
    often useful to store the output of a command in a file. For example, we could
    tell the shell to send the output of the ls command to the file ls-output.txt
    instead of the screen.


    ```

    $me@linuxbox ~$ ls -1 /usr/bin > ls-output.txt

    ```


    Here, we created a list of the /usr/bin directory and sent the results to the
    file ls-output.txt. Let''s examine the redirected output of the command, here:


    ```

    $me@linuxbox ~$ ls -l ls-output.txt

    -rw-r--r-- 1 me 167888 2018-02-01 15:07 ls-output.txt

    ```


    Good—a nice, large, text file. If we look at the file with less, we will see that
    the file ls-output.txt does indeed contain the results from our ls command.


    ```

    $me@linuxbox ~$ less ls-output.txt

    ```


    Now, let''s repeat our redirection test, but this with a twist. We will change
    the name of the directory to one that does not exist.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '```

    [me@linuxbox ~]$ ls -l /bin/usr > ls-output.txt

    ls: cannot access /bin/usr: No such file or directory

    ```


    We received an error message. This makes sense since we specified the nonexistent
    directory /bin/usr, but why was the error message displayed on the screen being
    redirected to the file ls-output.txt? The answer is that the ls program does not
    send its error messages to standard output. Instead, like well-written Unix programs,
    it sends its messages to standard error. Because we redirected only standard output
    and the error message was still sent to the screen. We''ll see how to redirect
    standard error in just a minute, but let''s look at what happened to our output.


    ```

    [me@linuxbox ~]$ ls -l ls-output.txt

    -rw-r--r-- 1 me 0 2018-02-01 15:08 ls-output.txt

    ```


    The file has zero length! This is because when we redirect output with the > redirection
    operator, the destination file is always overwritten from the beginning. Because
    our ls command generated no results and only an error message, the redirection
    started to rewrite the file and then stopped because of error, resulting in its
    truncation. In fact, if we ever need to truncate a file (or create a new, empty
    file), we can use a trick like this:


    ```

    [me@linuxbox ~]$ ls > ls-output.txt

    ```


    Simply using the redirection operator with no command preceding it will truncate
    an existing file or create a new, empty file.

    So, how can we append the redirected output to a file instead of overwriting the
    file from the beginning? For that, we use the >> redirection operator, like so:


    ```

    [me@linuxbox ~]$ ls -l /usr/bin >> ls-output.txt

    ```


    Using the >> operator will result in the output being appended to the file. If
    the file does not already exist, it is created just as the > operator has before.
    Let''s put it to the test.


    ```

    [me@linuxbox ~]$ ls -1 /usr/bin >> ls-output.txt

    [me@linuxbox ~]$ ls -1 /usr/bin >> ls-output.txt

    [me@linuxbox ~]$ ls -1 /usr/bin >> ls-output.txt

    [me@linuxbox ~]$ ls -1 ls-output.txt

    -rw-r--r-- 1 me 503634 2018-02-01 15:45 ls-output.txt

    ```


    We repeated the command three times, resulting in an output file three times as
    large.'
