  md: "# Menus\n\nA common type of interactivity is called menu-driven. In menu-driven\
    \ pro-grams, the user is presented with a list of choices and is asked to choose\
    \ one. For example, we could imagine a program that presented the following:\n\
    \nPlease Select:\n\n+   1. Display System Information\n2. Display Disk Space\n\
    3. Display Home Space Utilization\n4. Quit\n\nEnter selection [0-3] >\n\nUsing\
    \ what we learned from writing our sys_info_page program, we can construct a menu-driven\
    \ program to perform the tasks on the pre-vious menu.\n\n```\n#!/bin/bash\n\n\
    # read-menu: a menu driven system information program\n\nclear\necho \"\nPlease\
    \ Select:\n\n1. Display System Information\n2. Display Disk Space\n3. Display\
    \ Home Space Utilization\n4. Quit\n\nread -p \"Enter selection [0-3] \" >\n\n\
    if [[ \"$REPLY\" = ^[0-3]$ ]];]; then\n  if [[ \"$REPLY\" == 0 ]];]; then\n  \
    \  echo \"Program terminated.\"\n    exit\n  fi\n  if [[ \"$REPLY\" == 1 ]];];\
    \ then\n    echo \"Hostname: $HOSTNAME\"\n    uptime\n    exit\n  fi\n  if [[\
    \ \"$REPLY\" == 2 ]];]; then\n    df -h\n    exit\n  fi\n  if [[ \"${$(id -u)}\"\
    \ -eq 0 ]];]; then\n    echo \"Home Space Utilization (All Users)\"\n    du -sh\
    \ /home/*\n  else\n    echo \"Home Space Utilization ($USER)\" \n```"
