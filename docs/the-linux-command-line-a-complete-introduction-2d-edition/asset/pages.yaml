  md: 'regular user for such things testing an account. There are three ways to take
    on an alternate identity.


    +   1. Log out and log back in as the alternate user.

    2. Use the sudo command.

    3. Use the sudo command.


    We will skip the first technique because we know how to do it and it lacks the
    convenience of the other two. From within our own shell, the sudo command allows
    you to assume the identity of another user and start a new shell with that user''s
    ID or execute a single command as that. The sudo command allows an administrator
    to set up a configuration file called /etc/sudoers and define specific commands
    that particular users are permitted to execute under an assumed identity. The
    choice of which command to use is largely determined by which Linux distribution
    you use. Your distribution probably includes both commands, but its configuration
    will favor one or the other. We''ll start with


    # su: Run a Shell with Substitute User and Group IDs


    The su command is used to start a shell as another user. The command syntax looks
    like this:


    su [-1] [user]


    If -l option is included, the resulting shell session is a login shell for the
    specified user. This means the user''s environment is loaded and the working directory
    is changed to the user''s home directory. This is usually what we want. If the
    user is not specified, the superuser is assumed. Notice (strangely) the -l may
    be abbreviated as -, which is how it is often used. To start a shell for the superuser,
    we would do this:


    ```

    me@linuxbox su -

    Password:

    root@linux #

    ```


    After entering the command, we are prompted for the superuser''s password. If
    it is successfully entered, a new shell appears indicating that this shell has
    superuser privileges (the trailing # rather than a $), and the current working
    directory is now the home directory for the superuser (/root). Once in the new
    shell, we can carry out commands as the superuser. When finished, enter exit to
    return to the previous shell.


    ```

    root@linux ~]# exit

    me@linuxbox ~

    ```'
