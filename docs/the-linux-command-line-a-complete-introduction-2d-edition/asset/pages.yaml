  md: '# bc—An Arbitrary Precision Calculator Language


    We have seen how the shell can handle many types of integer arithmetic, but what
    if we need to perform higher math or even just use floating-point numbers? The
    answer is, no. At least directly with the shell. To do this, we need to use an
    external program. There are several approaches we can take. Embedding Perl or
    AWK programs is one possible solution, but unfortunately, it''s outside the scope
    of this book.


    Another approach is to use a specialized calculator program. One such program
    found on many Linux systems is called bc.

    The bc program reads a file written in its own C-like language and executes it.
    A bc script may be a separate file, or it may be read from standard input. The
    bc language supports a few features including variables, loops, and programmer-defined
    functions. We won''t cover bc entirely here, but just enough to get a taste: bc
    is well documented by its man page.


    Let''s start with a simple example. We''ll write a bc script to add 2 plus 2


    ```

    /* A very simple bc script */


    2 + 2

    ```


    The first line of the script is a comment. bc uses the same syntax for comments
    as the C programming language. Comments, which may span multiple lines, begin
    with /* and end with */.


    # Using bc


    If we save the previous script as foo.bc, we can run it this way:


    ```

    [me@linuxbox ~$] bc foo.bc

    1.06.94

    ```


    Copyright 1991-1994, 1997, 1998, 2000, 2004, 2006 Free Software Foundation, Inc.

    This is free software with ABSOLUTELY NO WARRANTY.

    For details type `warranty''.

    4


    If we look carefully, we can see the result at the very bottom, after the copyright
    message. This message can be suppressed with the -q (quiet) option.'
