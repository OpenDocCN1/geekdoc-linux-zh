  md: 'The reason this is of interest that man pages are rendered by groff, using
    the mandoc macro package. In fact, we can simulate the man command with the following
    pipeline:


    ```

    [me@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc -T ascii |

    head

    ```


    ls - list directory contents


    SYNOPSIS

    ls [OPTIONS]... [FILE]...


    Here we use the groff program with the options set to specify the mandoc macro
    package and the output driver for ASCII groff can produce output in several formats.
    If no format is specified, PostScript is output by default.


    ```

    [me@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc |

    %%PS-Adobe-3.0

    %%Creator: groff version 1.38.1

    %%CreationDate: Feb 5 13:44:37 2009

    %%DocumentNeededResources: font Times-Roman

    %%+ font Times-Bold

    %%+ font Times-Italic

    %%DocumentSuppliedResources: procets groff 1.18 1

    %%Pages: 4

    %%PageOrder: Ascend

    %%Orientation: Portrait

    ```


    We briefly mentioned PostScript in the previous chapter and will again in the
    next chapter. PostScript is a page description language that is used to describe
    the contents of a printed page to a typesetter-like device. If we take the output
    of our command and store it to a file (assuming that we are using a graphical
    desktop with a Desktop directory), any icon for the output file should appear
    on the desktop.


    ```

    [me@linuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc ~ ~/Desktop/ls.ps

    ```


    Double-clicking the icon, a page viewer would start up and reveal the file in
    its rendered form, as shown in Figure 21-1.


    What we see is a nicely typeset man page for ls! In fact, it is possible to convert
    the PostScript file into a Portable Document Format (PDF) file with this command:


    ```

    [me@linuxbox ~$ ps2pdf ~/Desktop/ls.ps ~/ls.pdf

    ```


    The ps2pdf program is part of the ghostscript package, which is installed on most
    Linux systems that support printing.'
