  md: '# scp and sftp


    The OpenSSH package also includes two programs that can make use of an SSH-encrypted
    tunnel to copy files across the network. The first scp (secure copy), is used
    much like the familiar cp program to copy files. The most notable difference is
    that the source or destination pathnames may be preceded by the name of a remote
    host, followed by a colon actor. For example, if we wanted to copy a document
    document.txt from our home directory on the remote system, remote-sys, to the
    current working directory on our local system, we could do this:


    ```

    me@linuxbox ~$ scp remote-sys:document.txt

    me@remote-sys''s password:

    document.txt 100% 5581 5.5KB/s 00:00

    me@linuxbox ~$

    ```


    As with ssh, you may apply a username to the beginning of the remote host''s name
    if the desired remote host account name does not match that of the local system.


    ```

    me@linuxbox ~$ sftp@remote-sys:document.txt

    ```


    The second SSH file-copying program is sftp, which as its name implies, is a replacement
    for the ftp program. sftp works much like the original ftp program we used earlier;
    however, instead of transmitting everything in cleartext, it uses an encrypted
    tunnel. sftp has an advantage over conventional ftp in it does not require an
    FTP server to be running on the remote host. It requires only the SSH server.
    This means that any remote machine that connect with the SSH client can also be
    used as an FTP-like server. Here is a sample session.


    ```

    me@linuxbox ~$ sftp remote-sys

    Connecting to remote-sys...

    me@remote-sys''s password:

    sftp> ls

    ubuntu-8.04-desktop-i386.iso

    sftp> cd ubuntu-8.04-desktop-i386.iso

    sftp> get ubuntu-8.04-desktop-i386.iso ubuntu-8.04-desktop-i386.iso

    Fetching /home/me/ubuntu-8.04-desktop-i386.iso 100% 699MB/s 01:35

    sftp> bye

    ```


    > The SFTP protocol is supported by many of the graphical file managers found
    in Linux distributions. Using either GNOME or KDE, we can enter a URI beginning
    sftp:// into the location bar and operate on files stored on a remote system running
    an SSH server.'
  merge: -1
