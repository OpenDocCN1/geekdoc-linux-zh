  md: '# 8


    # # ADVANCED KEYBOARD TRICKS


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_104_0.png)


    I often kiddingly describe Unix as “the operating system for people who like to
    type.” Of course, the fact that it even has a command line is a testament to that;
    however, command line users dont like to type that much. Why else would want so
    many commands have such short names like cp, ls, mv, and rm? In fact, one of the
    most cherished goals of the command line is laziness—doing the work with the fewest
    number of keystrokes. Another goal is never having to lift your fingers from the
    keyboard and reach for the mouse. In this chapter, we will look at bash features
    that make keyboard use faster and more efficient.


    The following commands will make an appearance:


    +   - `clear` Clear the terminal screen


    +   - `history` Display or manipulate the history list'
