- img_proc: true
  md: '# Activating Our Changes


    The changes we have made to our .bashrc will not take effect until we close our
    terminal session and start a new one because the .bashrc file is read only at
    the beginning of a session. However, we can force bash to reread the modified
    .bashrc file with the following command:


    ```

    me@linux~$ source ~/.bashrc

    ```


    After doing this, we should be able to see the effect of our changes. Try one
    of the new aliases.


    ```

    me@linux~$ 11

    ```


    # Summing Up


    In this chapter, we learned an essential skill: editing configuration files with
    a text editor. Moving forward, as we read man pages for commands, take note of
    the environment variables that commands support. There may be a gem or two. In
    later chapters, we will learn about shell functions, a powerful feature that you
    can also include in the bash startup files to add to your arsenal of custom commands.'
