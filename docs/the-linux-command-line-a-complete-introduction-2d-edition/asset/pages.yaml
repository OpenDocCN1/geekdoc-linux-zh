    One to remember about symbolic links is that file operations are carried out on
    the link''s, not the target. rm is an exception. When you delete a link, it is
    the link that is deleted, not the target.


    Finally, we will remove our playground. To do this, we will return to our home
    directory and use rm with the recursive option (-r) to delete playground and all
