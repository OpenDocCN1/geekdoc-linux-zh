  md: '# 20


    # TEXT PROCESSING


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_276_0.png)


    All Unix-like operating systems rely heavily on text files for data storage. So
    it makes sense that there are many tools for manipulating text. In this chapter,
    we will look at programs that are used to "slice and dice" text. In the next chapter,
    we will look at more text processing, focusing on programs that are used to format
    text for printing and other kinds of human consumption.


    This chapter will revisit some old friends and introduce us to some new ones:


    +   - cat Concatenate files and print on the standard output

    - sort Sort lines of text files

    - uniq Report or omit repeated lines

    - cut Remove sections from each line of files

    - paste Merge lines of files'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'join Join lines of two files on a common field


    comm Compare two sorted files by line


    diff Compare files line by line


    patch Apply a diff to an original


    tr Translate or delete characters


    sed Stream editor for filtering and transforming text


    aspell Interactive spellchecker


    # Applications of Text


    So far, we have learned a couple of text editors (nano and vim), looked at a bunch
    of configuration files, and witnessed the output of dozens of commands, all in
    text. But what else is text used for? For many things, it turns out.


    # Documents


    Many write documents using plain text formats. While it is easy to see how a small
    text file could be useful for keeping simple notes, it is also possible to write
    large documents in text format. One popular approach is to write a large document
    in a text format and then embed a markup language to describe the formatting of
    the finished document. Many scientific papers are written using this method, as
    Unix-based text processing systems were among the first systems that supported
    the advanced typographical layout needed by writers in technical disciplines.


    # Web Pages


    The world''s most popular type of electronic document is probably the web page.
    Web pages are text documents that either use Hypertext Markup Language (HTML)
    or Extensible Markup Language (XML) as markup languages to describe the document''s
    visual format.


    # Email


    Email is an intrinsically text-based medium. Even non-text attachments are converted
    into a text representation for transmission. We can see this for ourselves by
    downloading an email message and viewing it in less. We will see that the message
    begins with a header that describes the source of the message and the processing
    it received during its journey, followed by the body of the message with its content.


    # Printer Output


    On Unix-like systems, output destined for a printer is sent as plain text, or
    if the page contains graphics, it is converted into a text format page description
    language known as PostScript, which is then sent to a program that generates the
    graphic dots to be printed.'
  merge: -1
