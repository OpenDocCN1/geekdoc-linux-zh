  md: '# Logic


    As we discovered in Chapter 27, the (( )) compound command supports a variety
    of comparison operators. There are a few more that can be used to evaluate logic.
    Table 34-6 provides the complete list.


    # Table 34-6: Comparison Operators


    | Operator | Description |

    | --- | --- |

    | <= | Less than or equal to. |

    | >= | Greater than or equal to. |

    | < | Less than. |

    | > | Greater than. |

    | == | Equal to. |

    | != | Not equal to. |

    | && | Logical OR. |


    expr1?expr2:expr3 Comparison (ternary) operator. If expression expr1 evaluates
    to nonzero (arithmetic true), then expr2; else expr3.


    When used for logical operations, expressions follow the rules of arithmetic logic;
    that, expressions that evaluate as zero are considered false, while non-zero expressions
    are considered true. The (( )) compound command maps the results into the shell
    normal exit codes.


    ```

    [melinux] ~$ if ((1)); then echo "true"; else echo "false"; fi true

    [melinux] ~$ if ((0)); then echo "true"; else echo "false"; fi false

    ```


    The strongest of logical operators is the ternary operator. This operator (which
    is modeled after the one in the C programming language) performs a stand-alone
    logical test. It can be used as a kind of if/then/else statement. It acts on three
    arithmetic expressions (strings won''t work), and if the first expression is true
    (or non-zero), the second expression is performed. Otherwise, the third expression
    is performed. We can try this on the command line:


    ```

    [melinux] ~$ a=0

    [melinux] ~$ ((a1?+a:--a))

    [melinux] ~$ echo $a

    ```'
