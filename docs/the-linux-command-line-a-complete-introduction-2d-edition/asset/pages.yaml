- img_proc: true
  md: 'While roff and its descendants are used to make formatted documents, do they
    in a way that is rather foreign to modern users. Most documents today are produced
    using word processors that are able to perform both the composition and the layout
    of a document in a single step. Prior to the advent of the graphical word processor,
    documents were often produced in two-step process using the use of a text editor
    to perform composition, and a processor, such as troff, to apply the formatting.
    Instructions for the programming were embedded into the composed text through
    the use of a markup language. The modern analog for such a process is the web
    page, which is composed using a text editor of some kind and then rendered by
    a web browser using HTML as the markup language to describe the final page layout.


    We''re not going to cover groff in its entirety, as many elements of its markup
    language deal with rather arcane details of typography. Instead, we will concentrate
    on one of its macro packages that remains in wide use. These macro packages condense
    many of its low-level commands into a smaller set of high-level commands that
    make groff much easier.


    For a moment, let''s consider the humble man page. It lives in the /usr/share/man
    directory as a gzip-compressed text file. If we were to examine its uncompressed
    contents, we would see the following (the man page for ls 1 is:


    ```

    @melinuxbox ~$ zcat /usr/share/man/man1/ls.1.gz | head

    ```


    ```

    . DO NOT MODIFY THIS FILE! It was generated by help2man 1.47.3.

    .TH LS "1" "January 2018" "GNU coreutils 8.28" "User Commands"

    .SH NAME

    ls [\- list directory contents

    .SH SYNOPSIS

    ls 1

    \fI,OPTION!\fR]... \fI,FILE\/fR...

    .SH DESCRIPTION

    \" Add any additional description here

    .PP

    ```


    Compared to the man page in its normal presentation, we can begin to see a correlation
    between the markup language and its results.


    ```

    @melinuxbox ~$ man ls | head

    LS(1) User Commands LS(1)

    ```


    NAME

    ls - list directory contents


    SYNOPSIS

    ls [OPTION]... [FILE]...'
