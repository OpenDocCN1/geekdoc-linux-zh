    # Controlling Processes


    Now that we can see and monitor processes, let''s gain some control over them.
    For our experiments, we''re going to use a little program called xlogo as our
    guinea pig. The xlogo program is a sample program supplied with the X System (the
    underlying engine that makes the graphics on our display go), which simply displays
    a resizable window containing the X logo. First, we''ll get to know our test subject.


    ```

    $me@linuxbox~$ xlogo

    ```


    After entering the command, a small window containing the logo should appear somewhere
    on the screen. On some systems, xlogo might print a warning message, but it can
    be safely ignored.


    > If your system does not include the xlogo program, try using edit or kwrite
    instead.


    We can verify that xlogo is running by resizing its window. If the logo is redrawn
    in the new size, the program is running.

    Notice how our shell prompt returned? This is because the shell is waiting for
    the program to finish, just like the other programs we have used so far. If we
    close the xlogo window (see Figure 10-1), the prompt returns.


