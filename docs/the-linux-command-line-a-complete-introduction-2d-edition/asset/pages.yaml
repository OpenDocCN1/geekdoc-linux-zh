- img_proc: true
  md: "On this example system, the wildcard * expands into 82 arguments. How can we\
    \ process many? The shell provides a method, albeit clumsy, to do this. The shift\
    \ command causes all the parameters to \"move down one\" each time it is executed.\
    \ In fact, by using shift, it is possible to get by with only one parameter (in\
    \ addition to $0, which never changes).\n\n```\n#!/bin/bash\n```\n\n```\n# posit-param2:\
    \ script to display all arguments\n\ncount=1\n\nwhile [[ $# -gt 0 ]]; do\n  echo\
    \ \"Argument = $1\"\n  count=$((count + 1))\n  shift\n```\n\nEach time shift is\
    \ executed, the value of $2 is moved to $1, the value of $3 is moved to $2, and\
    \ so on. The value of # is also reduced by one.\nin the posit-param2 program,\
    \ we create a loop that iterates the number of arguments remaining and continues\
    \ as long as there is at least one. We display the current argument, increment\
    \ the variable count with each iteration of the loop to provide a running count\
    \ of arguments processed, and finally, execute a shift to load $1 with the next\
    \ argument. Here is the program at:\n\n```\n[me@linuxbox~$ posit-param2 a b c\
    \ d\nArgument 1 = a\nArgument 2 = b\nArgument 3 = c\nArgument 4 = d\n```\n\n#\
    \ Simple Applications\n\nEven without shift, it is possible to write useful applications\
    \ using positional parameters. By way of example, here is a simple file information\
    \ program:\n\n```\n#!/bin/bash\n```\n\n```\n# file-info: simple file information\
    \ program\n\nPROGNAME=\"$(basename \"$0\")\n```\n\n```\nif [[ -e \"$1\" ]]; then\n\
    \  echo -e \"\\nFile Type:\"\n  echo \"$1\"\n  echo -e \"\\nFile Status:\"\n \
    \ stat \"$1\"\nelse\n  echo \"$PROGNAME: usage: $PROGNAME file\" >&2\n```"
  merge: -1
  pgno: 435
- img_proc: true
  md: "This program displays the file type (determined by the file command) and the\
    \ file status (from the stat command) of a specified file. One interesting-feature\
    \ of this program is the PRONAME variable. It is given the value that results\
    \ from the basename \"$0\" command. The basename command removes the leading portion\
    \ of a pathname, leaving only the name of a file. In example, basename removes\
    \ the leading portion of the pathname contained in the $0 program, the full pathname\
    \ of our example program. This value is useful when constructing methods such\
    \ as the usage message at the end of the program. By coding it, the script can\
    \ be renamed, and the message automatically adjusts to contain the name of the\
    \ program.\n\n# Using Positional Parameters with Shell Functions\n\nJust as positional\
    \ parameters are used to pass arguments to shell scripts, they can also be used\
    \ to pass arguments to shell functions. To demonstrate, we will convert the file_info\
    \ script into a shell function.\n\n```\nfile_info() {\n# file_info: function to\
    \ display file information\nif [ -e \"$1\" ]]; then\n    echo \"\\nFile Type:\"\
    \n    file \"$1\"\n    echo -e \"\\nFile Status:\"\n    stat \"$1\"\nelse\n  \
    \  echo \"$FUNCNAME usage: $FUNCNAME file\" >&2\n    return 1\n}\n```\n\nNow,\
    \ if a script incorporates the file_info shell function calls the function with\
    \ a filename argument, the argument will be passed to the function.\n\nWith this\
    \ capability, we can write many useful functions that not only be used in scripts\
    \ but also be used within our bash environment. Notice that the PRONAME variable\
    \ was changed to the shell variable FUNCNAME. The shell automatically updates\
    \ this variable to keep track of the currently executed function. Note that $0\
    \ always contains the full-name of the first item on the command (i.e., the name\
    \ of the program) and does not contain the name of the shell function as we might\
    \ expect.\n\n# Handling Positional Parameters en Masse\n\nIt is sometimes useful\
    \ to manage all the positional parameters as a group. For example, we might want\
    \ to write a \"wrapper\" around another program."
  merge: -1
  pgno: 436
- img_proc: true
  md: "This means we creat script or shell function that simplifies the invocation\
    \ of another program. The wrapper, in this case, supplies a list of command line\
    \ options and passes a list of arguments to the lower-level\n\nThe shell provides\
    \ two special parameters for this purpose. They both expand the complete list\
    \ of positional parameters but differ in rather subtle ways. Table 32-1 describes\
    \ these parameters.\n\n# Table 32-1: The * and @ Special Parameters\n\n| Parameter\
    \ | Description |\n| --- | --- |\n| $* | Expands into the list of positional parameters,\
    \ starting with 1. When surrounded by double quotes, it expands into a double-quoted\
    \ string containing all of the positional parameters, each separated by the first\
    \ character of the IFS variable (by default a space character). |\n| @@ | Expands\
    \ into the list of positional parameters, when surrounded by double quotes, it\
    \ expands each positional parameter into a separate word as if it was surrounded\
    \ by double quotes. |\n\nHere is a script that shows these special parameters\
    \ in action:\n\n```\n#!/bin/bash\n\n# posit-param3: script to demonstrate $* and\
    \ @\n\nprint_params() {\n  echo \\$1 = \"$1\"\n  echo \\$2 = \"$2\"\n  echo \\\
    $3 = \"$3\"\n  echo \\$4 = \"$4\"\n}\n```\n\n```\npass_params() {\n  echo -e \"\
    \\n\" '*$* : \\'; print_params $*\"\n  echo -e \"\\n\" '*$* : \\'; print_params\
    \ \"$*\"\n  echo -e \"\\n\" '*@@ : \\'; print_params \"@\"\n  echo -e \"\\n\"\
    \ '*@@ : \\'; print_params \"$*@\"\n}\n```\n\n```\npass_params \"word\" \"words\
    \ with spaces\"\n```\n\nIn this rather convoluted program, we create two arguments,\
    \ called word and words with spaces, and pass them on to the pass_params function,\
    \ using each of the four methods available with the special parameters $* and\
    \ @. When executed, the script reveals the differences.\n\n```\n[melinuxbox ~$\
    \ posit-param3\n$ :\n```"
