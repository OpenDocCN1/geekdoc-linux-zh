- img_proc: true
  md: 'we may prefer to execute this way:


    ls -1 file1 file2


    This causes the command to be executed only one time rather than multiple times.
    There are two ways to do this: the traditional way, using the external command
    xargs, and the alternate way, using a new feature in find itself. We''ll talk
    about the alternate find.


    By changing the trailing semicolon to a plus sign, we activate the capability
    of find to combine the results of the search into an argument for a single execute
    of the desired command. Returning to our example, this will execute each time
    a matching file is found:


    ```

    find -type f -name ''foo*'' -exec ls -1 ''{}'' + ;\n-IwXf-XR-X 1 me 224 2007-10-29
    18:44 /home/me/bin/foo

    -Iw-I-I-- 1 me 06 2016-09-19 12:53 /home/me/foo.txt

    ```


    By changing the command to the following:


    ```

    find -type f -name ''foo*'' -exec ls -1 ''{} +''\n-IwXf-XR-X 1 me 224 2007-10-29
    18:44 /home/me/bin/foo

    -Iw-I-I-- 1 me 06 2016-09-19 12:53 /home/me/foo.txt

    ```


    we get the same result, but the system has to execute the ls command only once.


    # xargs


    The xargs command performs an interesting function. It accepts input from standard
    input and converts it into an argument list for a single command. With our example,
    we would use it like this:


    ```

    find -type f -name ''foo*'' -print xargs ls -1\n-IwXf-XR-X 1 me 224 2007-10-29
    18:44 /home/me/bin/foo

    -Iw-I-I-- 1 me 06 2016-09-19 12:53 /home/me/foo.txt

    ```


    Here we see the output of the find command piped into xargs, which, in turn, constructs
    an argument list for the ls command and executes it.


    > While the number of arguments that can be placed into a command line is quite
    large, it''s not unlimited. It is possible to create commands that are too long
    for the shell to accept. When a command line exceeds the maximum length supported
    by the system, xargs executes the specified command with the maximum number of
    arguments possible and repeats this process until standard input is exhausted.
    To see the maximum size of the command line, execute xargs with the --show-limits
    option.'
