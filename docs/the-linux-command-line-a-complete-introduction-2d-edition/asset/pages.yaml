  md: '# Redirecting Standard Error


    Redirecting standard error lacks the ease of a dedicated redirection operator.
    To redirect standard error, we must refer to its file descriptor. A program can
    produce output on any of several file streams. While we have referred to the first
    three of these file streams as standard input, output, and error, the shell references
    them internally as file descriptors 0, 1, and 2. The shell provides a notation
    for redirecting files using the file descriptor number. Because standard error
    is the same as file descriptor number, we can redirect standard error with this
    notation:


    ```

    [melinuxbox ~]$ ls -1 /bin/usr 2>ls-error.txt

    ```


    The file descriptor 2 is placed immediately before the redirection operator to
    perform the redirection of standard error to the file ls-error.txt.


    # Redirecting Standard Output and Standard Error to One File


    There are cases in which we may want to capture all of the output to a single
    file. To do this, we must redirect both standard output and standard error at
    the same time. There are two ways to do this. Shown here is the traditional way,
    which works with old versions of the shell:


    ```

    [melinuxbox ~]$ ls -1 /bin/usr > ls-output.txt 2>&1

    ```


    Using this method, we perform two redirections. First we redirect standard output
    to the file ls-output.txt, and then we redirect file descriptor 2 (standard error)
    to file descriptor 1 (standard output) using the notation 2>&1.


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_83_0.png)'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'Recent versions of bash provide a second, more streamlined method for performing
    this combined redirection, shown here:


    ```

    me@linuxbox ~$ ls -1 /bin/usr & ls-output.txt

    ```


    In this example, we use the notation & to redirect both standard output and standard
    error to the file ts-output.txt. You may also append the standard output and standard
    error streams to a single file like so:


    ```

    me@linuxbox ~$ ls -1 /bin/usr &> ls-output.txt

    ```


    # Disposing of Unwanted Output


    Sometimes "silence is golden" and we don''t want output from a command; we just
    want to throw it away. This applies particularly to error and status messages.
    The system provides a way to do this by redirecting output to a special file /dev/null.
    This file is a system device referred to as a bit bucket, which accepts input
    and does nothing with it. To suppress error messages from a command, we do this:


    ```

    me@linuxbox ~$ ls -1 /bin/usr 2> /dev/null

    ```


    # /DEV/NULL IN UNIX CULTURE


    > The bit bucket is an ancient Unix concept, and because of its universality,
    it has appeared in many parts of Unix culture. When someone says they are sending
    your comments to /dev/null, now you know what it means. For more examples, see
    the Wikipedia article on /dev/null.


