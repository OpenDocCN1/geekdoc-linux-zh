    # Sending a Job to a Printer


    The CUPS printing suite supports two methods of printing historically used on
    Unix-like systems. One method, called Berkeley or LPD (used in the Berkeley Software
    Distribution of Unix), uses the lpr program, while the other method, called SysV
    (from the System V version of Unix), uses the lp program. Both programs do roughly
    the same thing. Choosing one over the other is a matter of personal taste.'
  merge: -1
