- img_proc: true
  md: 'As we can see, bzip2 can be used the same way as gzip. All the options (except
    for -r) that we discussed for gzip are also supported in bzip2. Note, however,
    that the compression-level option (-number) has a different meaning to bzip2.
    bzip2 comes with bzip2 and bcat for decompressing files. bzip2 also comes with
    the bzip2recover program, which will try to recover damaged bzip2 files.


    # DON''T BE COMPRESSIVE COMPULSIVE


    I occasionally see people attempting to compress a file that has already been
    compressed with an effective compression algorithm by doing something like this:


    ```

    $ gzip picture.jpg

    ```


    Don''t do it. You''re probably just wasting time and space! If you apply compression
    to a file that is already compressed, you will usually end up with a larger file.
    This is because all compression techniques involve some overhead is added to the
    file to describe the compression. If you try to compress a file that already contains
    no redundant information, the compression will most not result in any savings
    to offset the additional overhead.


    # Archiving Files


    A common file-management task often used in conjunction with compression is archiving.
    Archiving is the process of gathering up many files and bundling them together
    into a single large file. Archiving is often done as part of system backups. It
    is also used when old data is moved to some type of long-term storage.


    # tar


    In the Unix-like world of software, the tar program is the classic tool for archiving
    files. Its name, short for tape archive, reveals its roots as a tool for making
    backup tapes. While it is still used for traditional task, it is equally adept
    on other storage devices. We often see filenames with the extension .tar or .tgz,
    which indicate a "plain" tar archive and a gzipped archive, respectively. A tar
    archive can consist of a group of separates, one or more directory hierarchies,
    or a mixture of both. The command syntax works like this:


    ```

    tar mode[options] pathname...

    ```


    Here, mode is one of the operating modes listed in Table 18-2 (only a partial
    list is shown here; see the tar man page for a complete list).'
