    We''re going to assume a little background in networking. In this, the Internet
    age, everyone using a computer needs a basic understanding of networking concepts.
    To make full use of this chapter, we should be familiar with the following terms:


    +   - Internet Protocol (IP)

    - Host and domain name

    - Uniform Resource Identifier (URI)


    > Some of the commands we will cover may (depending on your distribution) require
    the installation of additional packages from your distribution''s repositories,
    and may require superuser privileges to execute.


    # Examining and Monitoring a Network


    If you''re not the system administrator, it''s often helpful to examine the performance
    and operation of a network.


    ping

    The most basic network command is ping. The ping command sends a special network
    packet called an ICMP ECHO_REQUEST to a specified host. Most network devices receiving
    this packet will reply to it, allowing the network connection to be verified.


    > It is possible to configure network devices (including Linux hosts) to ignore
    these packets. This is usually done for security reasons to partially obscure
    a host from a potential attacker. It is also common for firewalls to be configured
    to block ICMP traffic.


    For example, to see whether we can reach linuxcommand.org (one of our favorite
    sites), we can use ping like this:


    ```

    $me@linuxbox~$ ping linuxcommand.org

    ```


    Once started, ping continues to send packets at a specified interval (the default
    is two seconds) until it is interrupted.


    ```

    me@linuxbox~$ ping linuxcommand.org (66.35.250.210): 64(84) bytes of data.

    64 bytes from host.sourceforge.net (66.35.250.210): icmp_seq=1 ttl=43 time=107
    ms

    64 bytes from host.sourceforge.net (66.35.250.210): icmp_seq=2 ttl=43 time=108
    ms

    64 bytes from host.sourceforge.net (66.35.250.210): icmp_seq=3 ttl=43 time=106
    ms

    ```'
