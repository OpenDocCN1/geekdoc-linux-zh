    Wow! that is an ugly-looking command. But it works. In just one step we have changed
    the data format in our file. It is also a perfect example of why regular expressions
    are sometimes jokingly referred to as a write-only medium. We can write them,
    but sometimes cannot read them. Before we are tempted to run away in terror from
    this command, let''s look at how it was constructed. First, we know that the command
    will have this basic structure:


    ```

    sed ''/regex/replacement/'' distros.txt

    ```


    Our next step is to figure out a regular expression that will isolate the date.
    Because it is in MM/DD/YYYY format and appears at the end of the line, we can
    use an expression like:


    ```

    [0-9]{2}/[0-9]{2}/[0-9]{4}$

    ```


    This matches two digits, two digits, a slash, four digits, and the end of line.
    So that we take care of replacement we must introduce a new regular expression
    feature that appears in some applications that use BRE. This feature is called
    back references and works like this: if the sequence n appears in replacement
    where n is a number from 1 to 9, the sequence will refer to the corresponding
    subexpression in the preceding expression. To create the subexpressions, we simply
    enclose in parentheses like:


    ```

    ([0-9]{2})([0-9]{2})([0-9]{4})$

    ```


    We have three subexpressions. The first contains the month, the second contains
    the day of the month, and the third contains the year. Now we can construct replacement
    as follows:


    ```

    \3-\-\1-\2

    ```


    This gives us a year, a dash, the month, a dash, and the day. Now, our command
    looks like this:


    ```

    sed ''/([0-9]{2})([0-9]{2})([0-9]{4})$/\\3-\1-\2/'' distros.txt

    ```


