- img_proc: true
  md: '# YOU CAN''T PIPE READ


    While the read command normally takes input from standard input, you cannot do
    this:


    echo "foo" | read


    > We would expect this to work, but it does not. The command will appear to succeed,
    but the REPLY variable will always be empty. Why is this?

    The explanation has to do with the way the shell handles pipelines. In (and other
    shells such as sh), pipelines create subshells. These are copies of the shell
    and its environment that are used to execute the command in the pipeline. In the
    previous example, read is executed in a subshell.

    Subshells in Unix-like systems create copies of the environment for use while
    they execute. When the processes finish, the copy of the environment is destroyed.
    This means that a subshell can alter the environment of its parent process. read
    assigns variables, which then become part of the environment. In the previous
    example, read assigns value foo to the variable REPLY in its subshell''s environment,
    but when the command exits, the shell and its environment are destroyed, and the
    effect of the assignment is lost.

    Using here strings is one way to work around this behavior. Another method is
    discussed in Chapter 36.


    # Validating Input


    With our ability to have keyboard input comes an additional programming challenge:
    validating input. Often the difference between a well-written program and a poorly
    written one lies in the program''s ability to deal with the unexpected. Frequently,
    the unexpected appears in the form of bad input. We''ve done a little of this
    with our evaluation programs in the previous chapter, where we checked the values
    of integers and screened empty values and non-numeric characters. It is important
    to perform these kinds of programming checks every time a program receives input
    to guard against invalid data. This is especially important for programs that
    are shared by multiple users. Omitting these safeguards in the interests of economy
    might be excused if a program is to be used once and only by the author to perform
    some special task. Even then, if the program performs dangerous tasks such as
    deleting files, it would be wise to include data validation, just in case.'
