    # Logical Errors


    Unlike syntactic errors, logical errors do not prevent a script from running.
    The script will run, but it will not produce the desired result because of a problem
    with its logic. There are countless numbers of possible logical errors, here are
    a few of the most common found in scripts:


    +   * **Incorrect conditional expressions.** It''s easy to incorrectly code an
    if/then/else expression and have the wrong logic carried out. Sometimes the logic
    will be reversed, or it will be incomplete.

    * **Off by one errors.** When coding loops, it is possible to overlook that the
    loop may require that the counting starts with zero, rather than one, for the
    code to conclude at the correct point. These kinds of errors result in either
    a loop "going off the end" by counting too far or a loop missing the last iteration
    by terminating one iteration too soon.

    * **Unanticipated situations.** Most logical errors result from a program encountering
    data or situations that were unforeseen by the programmer. As we have seen, this
    can also include unanticipated expansions, such as a filename that contains embedded
    spaces that expands into multiple command arguments rather than a single filename.


    # Defensive Programming


    It is important to verify assumptions when programming. This means a careful evaluation
    of the exit status of programs and commands that are used by a script. Here is
    an example, based on a true story. An unfortunate system administrator wrote a
    script to perform a maintenance task on an important server. The script contained
    the following two lines of code:


    ```

    cd $dir_name

    rm *

    ```


    There is nothing intrinsically wrong with these two lines, as long as the directory
    named in the variable, dir_name, exists. But what happens if it does not? In that
    case, cd command fails, and the script continues to the next line and deletes
    the files in the current working directory. Not the desired outcome at all! The
    hapless administrator destroyed an important part of the server because of this
    design decision.'
