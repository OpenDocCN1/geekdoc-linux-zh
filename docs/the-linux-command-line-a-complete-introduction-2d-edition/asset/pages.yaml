  md: "```\n$ PS1=\\a h \\$ \n17:33 linux $\n```\n\nAdding time-of-day to our prompt\
    \ will be useful if we need to keep track of when we perform certain tasks. Finally,\
    \ we'll make a new prompt that is similar to our original.\n\n```\n17:37 linuxbox\
    \ PS1=\"\\u0h \\W\\$\nme@linuxbox ~$\n```\n\nTry the other sequences listed in\
    \ Table 13-1 and see whether you can come up with a brilliant new prompt.\n\n\
    # Adding Color\n\nMost emulator programs respond to certain non-printing characters\
    \ to control such things as character attributes (such as color, text, and the\
    \ dreaded blinking text) and cursor position. We'll cover cursor position in a\
    \ little bit, but first we'll look at color.\n\n# TERMINAL CONFUSION\n\nIn ancient\
    \ times, when terminals were hooked to remote computers, there were competing\
    \ brands of terminals, and they all worked differently. They had different keyboards,\
    \ and they all had different ways of interpreting control information. Unix and\
    \ Unix-like systems have two complex subsystems to deal with behavior of terminal\
    \ control (called termcap and terminfo). If you look in the deepest recesses of\
    \ your terminal emulator settings, you might find a setting for the type of terminal\
    \ emulation.\n\nIn an effort to make terminals some sort of common language, the\
    \ American Standards Institute (ANSI) developed a standard set of characters to\
    \ control video terminals. Old-time DOS users will remember the ANSI.SYS file\
    \ that was used to enable interpretation of these codes.\n\nCharacter color is\
    \ controlled by sending the terminal emulator ANSI escape code embedded in the\
    \ stream of characters to be displayed. The control code does not \"print out\"\
    \ on the display; rather, it is interpreted by the terminal as an instruction.\
    \ As we saw in Table 13-1, the \\ and sequences are used to encapsulate non-printing\
    \ characters. An ANSI escape code begins with an octal 033 (the code generated\
    \ by the ESC key), followed by an optional attribute, followed by an instruction.\
    \ For example, the code to set the text to normal (attribute = 0), black text\
    \ is as follows:\n\n```\n\\033[0;30m\n```"
