  md: 'We will look at the following commands:


    +   - mount Mount a file system

    - ummount Unmount a file system

    - fsck Check and repair a file system

    - fdisk Manipulate disk partition table

    - mkfs Convert and copy a file

    - genisimage (mksofs) Create an ISO 9660 image file

    - wodim (cdrecord) Write data to optical storage media

    - md5sum Calculate an MD5 checksum


    # Mounting and Unmounting Storage Devices


    Recent advances in the Linux desktop have made storage device management extremely
    easy for desktop users. For the most part, we attach a device to our system and
    it “just works.” In the old days (say, 2004), this had to be done manually. On
    non-desktop systems (i.e., servers) this is still a largely manual procedure since
    servers often have extreme storage needs and complex configuration requirements.


    The first step in managing a storage device is attaching the device to the file
    system tree. This process, called mounting, allows the device to interact with
    the operating system. As we recall from Chapter 2, Unix-like operating systems
    (like Linux) maintain a single file system tree with devices attached at various
    points. This contrasts with other operating systems such as Windows which maintain
    separate file system trees for each device (for example C:\D:\, etc.).


    A file /etc/fstab (for “file system table”) lists the devices (typically hard
    partitions) that are mounted at boot time. Here is an example /etc/fstab from
    an Fedora system:


    | LABEL=/12 | | ext4 | defaults | 1 1 |

    | LABEL=/home | /home | ext4 | defaults | 1 2 |

    | LABEL=/boot | | ext4 | defaults | 1 2 |

    | tmpfs | /dev/shm | tmpfs | defaults | 0 0 |

    | devpts | /dev/pts | devpts | gid=5,mode=620 | 0 0 |

    | sysfs | /sys | sysfs | defaults | 0 0 |

    | proc | /proc | proc | defaults | 0 0 |

    | LABEL=SWAP-sda3 | swap | swap | defaults | 0 0 |


    Most of the file systems listed are virtual and not applicable to our discussion.
    For our purposes, the interesting ones are the first three.


    | LABEL=/12 | | ext4 | defaults | 1 1 |

    | LABEL=/home | /home | ext4 | defaults | 1 2 |

    | LABEL=/boot | /boot | ext4 | defaults | 1 2 |'
