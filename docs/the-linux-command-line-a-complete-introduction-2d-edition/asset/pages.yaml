  md: 'In addition to the = notation, the shell also provides notations that perform
    some very useful assignments, as described in Table 34-4.


    # Table 34-4: Assignment Operators


    | Notation | Description |

    | --- | --- |

    | parameter = value | Simple assignment. Assigns value to parameter. |

    | parameter += value | Addition. Equivalent to parameter = parameter + value.
    |

    | parameter -= value | Subtraction. Equivalent to parameter = parameter - value.
    |

    | parameter *= value | Multiplication. Equivalent to parameter = parameter * value.
    |

    | parameter /= value | Integer division. Equivalent to parameter = parameter /
    value. |

    | parameter %= value | Modulo. Equivalent to parameter = parameter % value. |

    | parameter++ | Variable post-increment. Equivalent to parameter = parameter +
    1 (however, see the following discussion). |

    | parameter-- | Variable pre-decrement. Equivalent to parameter = parameter -
    1. |

    | ++parameter | Variable pre-increment. Equivalent to parameter = parameter +
    1. |


    These assignment operators provide a convenient shorthand for common arithmetic
    tasks. Of special interest are the (++) and--) operators, which increase or decrease
    the value of their parameters by one. This style of notation is taken from the
    C programming language and has been incorporated into a number of other programming
    languages, including bash.


    The operators may appear either at the front of a parameter or at the end. While
    they either increment or decrement the parameter by one, the two placements have
    a subtle difference. If placed at the front of the parameter, the parameter is
    incremented (or decremented) before the parameter is returned. If placed after,
    the operation is performed after the parameter is returned. This is rather strange,
    but it is the intended behavior.


    ```

    [linux ~] foo=1

    [linux ~] echo $((foo))

    1

    ```


    > If we assign the value of one to the variable foo and then increment it with
    the ++ operator placed after the parameter name, foo is returned with the value
    of one. However, if we look at the value of a second time, we see the incremented
    value. If we place the ++ operator in front of the parameter, we get the more
    expected behavior.


    ```

    [linux ~] foo=1

    [linux ~] echo $((foo))

    2

    ```'
