- img_proc: true
  md: '# Extra Credit


    It''s often useful to verify the integrity of an ISO image that we have downloaded.
    In most cases, a distributor of an ISO image will also supply a checksum file.
    A checksum is the result of an exotic mathematical calculation resulting in a
    number that represents the content of the target file. If the contents of the
    file change by even one bit, the resulting checksum will be much different. The
    most common method of checksum generation uses the md5sum program. When you use
    md5sum, it produces a unique hexadecimal number.


    ```

    md5sum image.iso

    34e35470f9bb7fb85c96f63f94ece image.iso

    ```


    After you download an image, you should run md5sum against it and compare the
    results with the md5sum value supplied by the publisher.

    in addition to checking the integrity of a downloaded file, we can use md5sum
    to verify newly written optical media. To do this, we first calculate the checksum
    of the image file and then calculate a checksum for the media. The trick to verifying
    media is to limit the calculation to only the portion of the optical media that
    contains the image. We do this by determining the number of 2,048-byte blocks
    the image contains (optical media is always written in 2,048-byte blocks) and
    reading that many blocks from the media. On some types of media, this is not required.
    CD-R and CD-RW disks written in disc-at-once mode can be checked this way.


    ```

    md5sum /dev/cdrom

    34e35470f9bb7fb85c96f63f94ece /dev/cdrom

    ```


    Many types of media, such as DVDs, require a precise calculation of the number
    of blocks. In the following example, we check the integrity of the image file
    `dvd-image.iso` and the disc in the DVD reader `/dev/dvd`. Can you figure out
    how this works?


    ```

    md5sum dvd-image.iso; dd if=/dev/dvd bs=2048=$($(stat -c "%s" "dvd-image.iso")
    / 2048 )) | md5sum

    ```'
  merge: -1
  pgno: 211
