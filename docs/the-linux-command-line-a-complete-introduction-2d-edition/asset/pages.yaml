- img_proc: true
  md: '# What Exactly Are Commands?


    A command can be one of four different things.


    +   - An executable program like all the other files we saw in /usr/bin. Within
    this category, programs can be compiled binaries such as programs written in C
    and C++, or programs written in scripting languages such as the shell, Perl, Python,
    Ruby, and so on.

    - A command built into the shell itself. bash supports a number of commands internally
    called shell builtins. the cd command, for example, is a shell builtin.

    - A shell function. Shell functions are miniature shell scripts incorporated into
    the environment. We will cover configuring the environment and writing shell functions
    in later chapters, but for now, be aware that they exist.

    - An alias. Aliases are commands that we can define ourselves, built from other
    commands.


    # Identifying Commands


    It is often useful to know exactly which of the four kinds of commands is being
    used, and Linux provides a couple of ways to find out.


    type—Display a Command’s Type


    The type command is a shell builtin that displays the kind of command the shell
    will execute, given a particular command name. It works like this:


    ```

    type command

    ```


    ```

    [melinuxbox ~]$ type type

    type is a shell builtin

    [melinuxbox ~]$ type ls

    is is aliased to ls --color=tty

    [melinuxbox ~]$ type cp

    cp is /bin/cp

    ```


    Here we see the results for three different commands. Notice the one for ls (taken
    from a Fedora system) and how the ls command is actually an alias for ls command
    with the --color=tty option added. Now we know why the output from ls is displayed
    in color!


    which—Display an Executable’s Location


    Sometimes there is more than one version of an executable program installed on
    a system. While this is not common on desktop systems, it’s'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'not unusual on larger servers. To determine the exact location of a given executable,
    the which command is used.


    ```

    ```

    @linuxbox~$ which ls

    bin/ls

    ```

    ```


    works only for executable programs, not builtins or aliases that are substitutes
    for actual executable programs. When we try to use which on a shell builtin—for
    example, cd—we either get no response or get an error message.


    ```

    ```

    @linuxbox~$ which cd

    /usr/bin: no cd in (/usr/local/bin:/usr/bin:/usr/local/games:/usr/games)

    ```

    ```


    This is a fancy way of saying "command not found."


    # # Getting a Command''s Documentation


    With this knowledge of what a command is, we can now search for the documentation
    available for each kind of command.


    # ## help—Get Help for Shell Builtins


    bash has a built-in help available for each of the shell builtins. To use it,
    type help followed by the shell builtin. Here''s an example:


    ```

    ```

    @linuxbox~$ help cd

    cd: cd [-L[-P [-e]] [[@]] [dir]

    Change the current directory to DIR.

    ```

    ```


    Change the current directory to DIR. The default DIR is the value of the HOME
    shell.


    The variable CDPATH defines the search path for the directory containing DIR.
    Alternative directory names in CDPATH are separated by a colon (:). A null directory
    name is the same as the current directory. If DIR begins with a slash (/), then
    CDPATH is not used.


    If the directory is not found, and the shell option "cdable" is set, the word
    is assumed to be a variable name. If that variable has a value, its value is used
    for DIR.


    Options:


    +   - L symbolic links to be followed: resolve symbolic links in DIR after processing
    instances of ''''

    - P use the physical directory structure without following symbolic links: resolve
    symbolic links in DIR before processing instances of ''''

    - e if the -P option is supplied, and the current directory cannot be determined
    successfully, exit with a non-zero status

    - @ on systems that support it, present a file with extended attributes as a directory
    containing the file attributes'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'The default is to follow symbolic links, as if `-L` were specified.

    ..` is processed by removing the immediately previous pathname component back
    to a slash or the beginning of DIR.


    Exit Status:

    Returns 0 if the directory is changed, and if `$PWD` is set successfully when

    -P is used; non-zero otherwise.


    A note on notation: When square brackets appear in the description of a command,
    they indicate optional items. A vertical bar character indicates mutually exclusive
    items. In the case of the cd command above:


    ```

    cd [-l|[-P[-e]]]`

    ```


    This notation says that the command may be followed optionally by a -l or a -P
    and further, if the -P option is specified the -e option may also be included
    by the optional argument dir.

    The output of help for the cd commands is concise and accurate, it is by no means
    tutorial and we can see, it also seems to mention a lot of things we haven''t
    talked about yet! Don''t worry. We''ll get there.


    # --help—Display Usage Information


    Many executable programs support a --help option that displays a description of
    the command''s supported syntax and options. For example:


    ```

    me@linuxbox~$ mkdir --help

    Usage: mkdir [OPTION]... DIRECTORY...

    Create the DIRECTORY(ies), if they do not already exist.

    ```


    +   Mandatory arguments to long options are mandatory for short options too.

    -Z, --context=CONTEXT (Linux) set security context to CONTEXT

    -m, --mode=MODE set file mode (in chmod), not=rwx umask

    -p, --parents no error if exists, make directories as needed

    -v, --verbose print a message for each created directory

    --help display this help and exit

    --version output version information and exit


    Report bugs to bug-coreutils@gnu.org.

    Some programs do not support the --help option, but try it anyway. Often it results
    in an error message that will reveal the same usage information.


    # man—Display a Program''s Manual Page


    Most executable programs intended for command line provide a formal piece of documentation
    called a *manual* or *man page*. A special programming language called man is
    used to view them. It is used like this:


    ```

    man program

    ```'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'where program is the name of the command to view.

    Man pages vary somewhat in format but generally contain the following:


    +   - A title (the page name)

    - A synopsis of the command''s syntax

    - A description of the command''s purpose

    - A listing and description of each of the command''s options


    Man pages, however, not usually include examples as a reference, not a tutorial.
    As an example, let''s try viewing the man page for the ls command.


    ```

    me@linuxbox ~$ man ls

    ```


    On most Linux systems, man uses less to display the manual page, so all of the
    familiar commands work while displaying the page.

    The "manual" that man displays is broken into sections and covers not only user
    commands but also system administration commands, programming interfaces, file
    formats, and more. Table 5-1 describes the layout of


    # Table 5-1: Man Page Organization


    | Section | Contents |

    |---|---|

    | 1 | User commands |

    | 2 | Programming interfaces for kernel system calls |

    | 3 | Programming interfaces to the C library |

    | 4 | Special files such as device nodes and drivers |

    | 5 | File formats |

    | 6 | Games and amusements as screen savers |

    | 7 | Miscellaneous |

    | 8 | System administration commands |


    Sometimes we need to refer to a specific section of the manual to find what we
    are looking for. This is particularly true if we are looking for a file format
    that is also the name of a command. Without specifying a section number, we will
    always get the first instance of a match, probably in section 1. To specify a
    section number, we use man like this:


    ```

    man section search_term

    ```


    Here''s an example:


    ```

    me@linuxbox ~$ man 5 passwd

    ```


    This will display the man page describing the file format of the /etc/passwd file.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# apropos—Display Appropriate Commands


    It is also possible to search the list of man pages for possible matches based
    on a search term. It is weird but sometimes helpful. Here is an example of a search
    for man pages using the search term partition:


    ```

    [me@linuxbox~$] apropos partition

    part (8) - simple wrapper around the "add partition" ioctl

    all-swaps (7) - event signalling that all swap partitions have been ac...

    cfdisk (8) - display or manipulate disk partition table

    cgdisk (8) - Curses-GUID partition table (GPT) manipulator

    delpart (8) - simple wrapper around the "del partition" ioctl

    fdisk (8) - manipulate disk partition table

    fixparts (8) - MTR partition table repair utility

    gdisk (8) - Interactive GUID partition table (GPT) manipulator

    partition (1) - partition and hard disk

    partprobe (8) - Inform the OS of partition table changes

    partx (8) - tell the Linux kernel about the presence and numbering...

    resizepart (8) - simple wrapper around the "resize partition" ioctl

    sfdisk (8) - partition table manipulator for Linux

    sdisk (8) - Command-line partition table (GPT) manipulator fo.

    ```


    The first field in each line of output is the name of the man page, and the second
    field shows the section. Note that the man command with the -k option performs
    the same function as apropos.


    # whatis—Display One-line Page Descriptions


    The whatis program displays the name and a one-line description of a man page
    matching a specified keyword.


    ```

    [me@linuxbox~$] whatis ls

    ls (1) - list directory contents

    ```


    | THE MOST BRUTAL MAN PAGE OF ALL |

    As we have seen, the manual pages supplied with Linux and other Unix-like systems
    are installed as reference documentation and not as tutorials. Many man pages
    are hard to read, but I think the grand prize for difficulty has go to the man
    page for bash. As I was doing research for this book, I gave the bash man page
    careful review to ensure that it was covering most of its topics. When printed,
    it''s more than 80 pages long and extremely dense, and its structure makes absolutely
    no sense to a new user.

    The other hand, it is very accurate and concise, as well as being extremely complete.
    So check it out if you dare and look forward to the day when you can read and
    it all makes sense. |'
