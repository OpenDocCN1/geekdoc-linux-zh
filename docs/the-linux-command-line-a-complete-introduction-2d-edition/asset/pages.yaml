  md: "# DESIGN IS A FUNCTION OF TIME\n\nWhen I was a college student studying industrial\
    \ design, a wise professor stated that the amount of design on a project was determined\
    \ by the amount of time to the designer. If you were given five minutes to design\
    \ a device “that kills flies,” you designed a flyswater. If you were given five\
    \ months, you might come up with a laser-guided “antifly system” instead.\n\n\
    The same principle applies to programming. Sometimes a “quick-and-dirty” script\
    \ will do if it's going to be used once and only by the programmer. That kind\
    \ of script is common and should be developed quickly to make the effort economical.\
    \ Such scripts don't need a lot of comments and defensive checks. On the other\
    \ hand, if a script is intended for production use, that is, a script that will\
    \ be used over and over for an important task or by multiple users, needs more\
    \ careful development.\n\n# Testing\n\nTesting is an important step in every kind\
    \ of software development, including scripts. There is a saying in the open source\
    \ world, “release early, release often,” that reflects this fact. By releasing\
    \ early and often, software gets more exposure to use and testing. Experience\
    \ has shown that bugs are much easier to find, and much less expensive to fix,\
    \ if they are found early in the development cycle.\n\nIn Chapter 26, we saw how\
    \ stubs can be used to verify program flow. From the earliest stages of script\
    \ development, they are a valuable technique to check the progress of our work.\n\
    \nLet's look at the file-deletion problem previously and see how this could be\
    \ coded for easy testing. Testing the original fragment of code would be dangerous\
    \ since its purpose is to delete files, but we could code the code to make the\
    \ test safe.\n\n```\nif [[ -d $dir_name ]]; then\n    if cd $dir_name; then\n\
    \        echo * # TESTING\n    else\n        echo \"cannot cd to '$dir_name\"\
    \ >&2\n        exit 1\n    fi\nelse\n    echo \"no such directory: '$dir_name\"\
    \ >&2\n    exit 1\nfi\nexit # TESTING\n```\n\nBecause the error conditions already\
    \ already output useful messages, we don't have to add any. The most important\
    \ change is placing an echo command just"
