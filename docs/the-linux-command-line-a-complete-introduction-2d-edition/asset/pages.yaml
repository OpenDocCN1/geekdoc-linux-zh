    Here we use a plus sign:


    ```

    $${parameter:+word}

    ```


    If parameter is unset or empty, the expansion results in nothing, If parameter
    is not empty, the value of word is substituted for parameter; how-ever, the value
    of parameter is not changed.


    ```

    [me@linuxux ~]$ foo=

    [me@linuxux ~]$ echo ${foo:"substitute value if set"}

    ```


    ```

    [me@linuxux ~]$ foo=bar

    [me@linuxux ~]$ echo ${foo:"substitute value if set"}

    ubstitute value if set

    ```


    # Expansions That Return Variable Names


    The shell has the ability to return the names of variables. This is used in some
    rather exotic situations.


    ```

    ${{!prefix*}

    ${!prefix@}

    ```


    This expansion returns the names of existing variables with names beginning with
    prefix. According to the bash documentation, both forms of the expansion perform
    identically. Here we list all the variables in the environment that begin with
    BASH:


    ```

    [me@linuxux ~]$ echo ${BASH*}

    BASH_ARGC BASH_ARGV BASH_COMMAND BASH_COMPLETION BASH_COMPLETION_DIR BASH_LINENO
    BASH_SOURCE BASH_SUBSHELL BASH_VERSINFO BASH_VERSION

    ```


    # String Operations


    There is a large set of expansions that can be used to operate on strings. Many
    of these expansions are particularly suited for operations on pathnames. The following
    expansion:


    ```

    $${parameter}

    ```


    expands into the length of the string contained by parameter. Normally, parameter
    is a string; however, if parameter is either or *, then the expansion results
    in the number of positional parameters.'
