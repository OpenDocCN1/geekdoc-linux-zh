- img_proc: true
  md: 'If no character is specified, "all" will be assumed. The operation may be a
    + indicating that a permission is to be added, a - indicating a permission is
    to be taken away, or = indicating that only the specified permissions are to be
    applied and all others are removed. Permissions are specified with the r, w, and
    x characters. Table 9-6 provides examples of symbolic notation.


    # Table 9-6: chmod Symbolic Notation Examples


    | Notation | Meaning |

    | U+X | Add execute permission for the owner |

    | U-X | Remove execute permission from the owner |

    | +X | Add execute permission for the owner, group, and world. This is equivalent
    to a+x |

    | O-IW | Remove the read and write permissions from anyone besides the owner and
    group owner |

    | GO=IW | Set the group and anyone besides the owner to have read and write permissions.
    If either the group or the world previously had execute permission, it is removed
    |

    | U+X,GO=ZX | Add execute permission for the owner and set the permissions for
    the group and others to read and execute. Multiple specifications may be separated
    by commas |


    Some people prefer to use octal notation, and some like the symbolic. Symbolic
    notation does offer the advantage of allowing you to set a single attribute without
    disturbing any of the others.

    Take a look at the chmod man page for more details and a list of options.

    A word of caution regarding the --recursive option: it acts on both files and
    directories, so it''s not as useful as we would hope because we rarely want files
    and directories to have the same permissions.


    # Setting Mode with the GUI


    Now that we have seen the permissions on files and directories are set, we can
    better understand the permission dialogs in the GUI. In both Files (GNOME) and
    Dolphin (KDE), right-clicking a file or directory icon will expose a properties
    dialog. Figure 9-1 provides an example from GNOME. Here we can see the settings
    for the owner, group, and world.'
