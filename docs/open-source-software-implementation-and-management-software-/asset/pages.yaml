    # 10.5.4 Functional Specification


    A functional specification (spec) is a list of features to be included in the
    project, prioritized and spelled out in sufficient detail. The right level of
    detail is first a matter of trust and communication. Outsourced projects often
    have very detailed specifications. The ideal is just enough detail to enable a
    developer to build the system that is needed. Too much detail leads to time wasted
    on a paper process. Too little detail leads to coding in a vacuum.'
