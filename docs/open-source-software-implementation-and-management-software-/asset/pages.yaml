  md: '# Managing System Implementation


    In this chapter, we will look at system deployment in the large organization and
    see how the current state of the art is affected by using open source tools and
    methods.


    Contemporary system implementation in the organization is usually not a matter
    of custom development versus package deployment, but of both. A solution is established
    by assembling products and integrating them with custom components. The process
    consists of product selection, customization and integration, deployment, and
    then ongoing support.


    To discuss the issues, we will fit the deployment effort into a framework with
    models for the implementation team and process and a set of principles. Then we
    will review issues of migration and support.


    # 10.1 Implementation Roles


    A software development or installation team is generally a very mixed team, regarding
    skill types and levels and often other factors, but it runs as a team of peers.
    There may be varying talent and experience, but good teams tend to be highly demanding
    of talent and work effort. Teams must also well with other groups in the company,
    which may have different skills and motivations, and must interact externally
