  md: '# 6.1 Contents of the Operating System


    In closed code systems, the vendor decides what is included in the operating system.
    The vendor performs integration testing and provides a means for online update.
    Further, the packages in the operating system are distributed and supported by
    the vendor. They may have licensed or purchased from third parties originally,
    such as DoubleSpace or Internet Explorer in Windows, but they are from the vendor
    now. There is an incentive for this set of packages to grow, since this encourages
    users of the closed code system to purchase upgrades from time to time. The vendor
    generally provides indemnification (against the code not being their license)
    and any other warranties, which are usually disclaimers of warranty.


    In closed code systems, there are two additional categories. First, there are
    applications sold by the vendor for an additional fee, such as Office and SQL
    Server on Windows, ilife and Keynote on the Mac, or Zen on NetWare. Microsoft
    calls this “platform,” and I’ll use that term. These can be very important sources
    of profit. Office is the engine of profit for Microsoft.


    Second, there are applications sold or distributed by third parties. Novell calls
    this “ecosystem,” and I’ll use that term. It is usually the existence of this
    ecosystem that makes the operating system active. Over time, the code vendors
    will attempt to expand their “platform” at the expense of their “ecosystem.” The
    launch of a new version of Windows or the Mac is an opportunity to showcase a
    set of packages that was previously part of the ecosystem and is now part of platform.
    Although this is usually presented as “innovation,” as something new that was
    not included previously, it is really incorporation. The selling of Windows Media
    Player by Microsoft, or iTunes by Apple, is an example of this. Hopefully, in
    a healthy economy, the ecosystem can grow through innovation, by solving new problems.


    The distinctions between operating system, platform, and ecosystem arguably exist
    with open source, at least not strongly. There are some cases where the distribution
    vendor develops additional code (platform). This may be distributed exclusively,
    as SuSE Ya2 has until now, or nonexclusively, such as Red Hat RPM or Tux. They
    may also be sold, probably not exclusively, such as Ximian Desktop 2 (XD2). Linux
    distributors do not earn significant revenue from such enhancements now, but that
    may change. Both Novell and Red Hat have plans to do more of this.


    The expectation in open source is that packages may come from third parties. There
