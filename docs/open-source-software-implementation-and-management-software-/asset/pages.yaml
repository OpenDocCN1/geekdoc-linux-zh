- img_proc: true
  md: 'The alternatives for message receivers and stores are POP3 and IMAP. IMAP is
    richer and generally preferable. Exchange stores support either protocol. The
    native Exchange store appears to be IMAP-like but differs slightly, that Outlook
    IMAP support can be quirky. Sometimes we choose to use POP3 with Outlook for that
    reason. Choices for IMAP servers include Courier-IMAP and Cyrus IMAPD.


    For a directory server, we prefer OpenLDAP. Postfix and Courier-IMAP or Cyrus
    IMAPD can access OpenLDAP for authentication.


    Many organizations like to have a browser-based mail client. Horde is an example
    of a server that supports browser-based email. Horde looks similar to Outlook
    Web Access and provides similar functions. It can access OpenLDAP for authentication,
    address lookups, and contacts.


    # 7.5 Systems Management


    The basic choice for open source systems management, as in other areas as database,
    is whether to adopt open source tools and methods completely, which will involve
    getting or developing administrators with UNIX administration skill sets, or to
    adopt closed code system management tools, which are generally cross-platform
    and may be in the organization. Both approaches will probably be needed. However
    attractive the graphical tools, system administrators usually need a thorough
    understanding of the platforms they are using.


    The next level, if needed, systems administration is programming using a cross-platform
    scripting language. This will allow us to develop more flexible and automated
    approaches to, for instance, backing up and managing the size of users. The good
    news is that is a long tradition of scripting in UNIX, and the work to do this
    is well understood and available. The bad news is that although it is compatible
    with Windows systems, it is not compatible with the approaches that have generally
    used in Windows.


    The closed code tools are comprehensive and graphical, so they look wonderful
    in use. The open source tools are generally targeted to a more experienced administrator,
    and lean more to the UNIX philosophy of "doing one thing well." There is no reason
    not to use tools of both types. Many organizations that use Tivoli or Unicenter
    also employ open source tools such as Snort for intrusion detection and write
    shell or Perl scripts to manage their own applications.


    Closed code tools available for Linux:'
