  md: '# Bibliography


    I have occasionally heard complaints that open source software is not well documented,
    but that is not my experience. What I find is that there is an overwhelming amount
    of information available for the major software products. This information is
    available in several forms. This bibliography lists published hardcover books,
    but some software is extensively doced with online tutorials or HOWTOs which are
    freely available. The tutorials for MySQL and the GIMP for example, or the German
    guide to open source migration are of excellent quality but not to my knowledge
    available as bound books. There are also many books from several publishers covering
    the major products, including Linux, Apache, and the development tools. In general,
    the web site of a product will refer to the available documentation. Some of these
    web sites are listed in this book; others can be found through a web search engine
    such as Google.


    The books below were used by me in the last year while planning or working on
    this book. The selection is pretty arbitrary, except that I selected them at the
    time as being the most current and having the best coverage, and found them useful
    and interesting. I separated them into three categories; books on general issues,
    on system administration, and on software development including databases.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Software History and Philosophy, Business Principles, Open Source


    | Title | Author | Publisher | Description |

    | --- | --- | --- | --- |

    | Open Sources | DiBona et al (ed) | O''Reilly | A collection of essays from the
    leaders of the open source movement (Stallman, Torvalds, Wall, Perens, etc.) at
    a critical time in its development. |

    | From Airline Reservations to Sonic Hedgehog | Martin Campbell-Kelly | MIT Press
    | A great book on software history with particularly good coverage of areas that
    get insufficient attention, including mainframe software and custom corporate
    development. |

    | The Future of Ideas | Lawrence Lessig | Vintage Books | An essential book on
    the balance of rights that impact intellectual property and the developing threats
    to that balance. |

    | Linux and the Unix Philosophy | Mike Gancarz | Digital Press | This is an economically
    written introduction to the key points of the Unix system development, which is
    important to understand. The book is a classic text that was recently updated
    for Linux. |

    | The Business and Economics of Linux and Open Source | Martin Fink | Prentice
    Hall | A good management overview of open source issues by a manager who has been
    influential in its adoption. The book covers many general issues, but is particularly
    focused on managers at software and systems integration companies. |

    | Loosely Coupled: The Missing Pieces of Web Services | Doug Kaye | RDS Press
    | A high-level view from a successful software manager of how to achieve business
    integration using web services. It has an honest treatment of what works now and
    what is still to be developed. |

    | Understanding Open Source Software Development | Feller & Fitzgerald | Addison-Wesley
    | An academic analysis of the impact of open source development methods on the
    software industry. |'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Software History and Philosophy, Business Principles, and Open Source (continued)


    | Title | Author | Publisher | Description |

    |---|---|---|--|\| The Innovator''s Dilemma | Clayton Christensen | HarperBusiness
    Essentials | The best-selling, highly influential book on disruptive technologies
    and their impact on established industries. The follow up, "The Innovator''s Solution,"
    develops the theory further. |

    | Technological Revolutions and Financial Capital | Carlota Perez | Edward Elgar
    | A good analysis of how technology is financed and sold, which provides useful
    analogies to use in analyzing introduction. |

    | Crossing the Chasm | Geoffrey Moore | HarperBusiness Essentials | The famous
    summary of principles for the successful marketing of high technology products
    beyond their initial niches. |


    # System Administration


    | Title | Author | Publisher | Description |

    |---|---|---|--|

    | Fedora for Dummies | Jon "maddog" Hall | Wiley | A good starter book on Linux
    from a veteran evangelist. The book includes a full copy of Fedora Linux on DVD.
    |

    | Moving to Linux | Marcel Gagne | Addison-Wesley | A simple book appropriate
    for end users using Windows. The book is well-illustrated and includes a Knopp
    live CD so the reader can evaluate Linux immediately. |

    | Red Hat Linux and Fedora Unleashed | Ball & Duff | Sams | This immense is the
    latest in a series that has been released to cover every Red Hat version for years.
    It includes Fedora Core Linux on DVD |

    | Unix System Administration Handbook, 2nd Edition | Nemeth et al | Prentice Hall
    | A long-established classic on Unix systems administration. |'
