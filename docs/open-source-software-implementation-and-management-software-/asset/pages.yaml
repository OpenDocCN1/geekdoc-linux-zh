  md: "# 5.5.1 Portal Components\n\nAny content management portal is going to need\
    \ all or most of these technologies, either included or integrated: a directory,\
    \ Web server, application development tools for creating additional custom components,\
    \ indexing and search, and mail and calendaring. Usually a product will use the\
    \ vendor (or its partners) strategic technology for most of these. Microsoft and\
    \ IBM products use their own directory, database, Web server, development tools,\
    \ and mail. The Plumtree portal uses the BEA WebLogic application.\n\nIn most\
    \ cases, the product can be configured to use at least some extremal products.\
    \ A commitment to interoperability is really needed, so that other ways of developing\
    \ are not locked out in the future. In the case of an open source portal, we will\
    \ expect to be able to use open source components, such as OpenLDAP, Apache, MySQL,\
    \ and an open source development language. We would also want access to legacy\
    \ databases, other systems through Web services, and shared authentication.\n\n\
    There is no clear line between the Web publishing discussed in the previous section\
    \ and the more powerful products discussed here. A requirements process is going\
    \ to be needed to determine the right product.\n\n# Authentication and Personalization\n\
    \nAlmost all customers will need an authentication system, or a system to determine\
    \ who can perform functions with which content. Generally, this will need to work\
    \ with existing infrastructure, LDAP (including Active Directory), a proprietary\
    \ or embedded directory (such as NT or Exchange 5.5), or one that is database\
    \ based.\n\nForms-based login uses an authentication system to personalize content\
    \ display and to control access to all functions. Role-based developp supports\
    \ multiple roles for an identity.\n\n# Content Management\n\nComposition and presentation\
    \ of files in various formats, including Office, PDF, HTML, XML, links (both internal\
    \ and external), and composed articles with dynamic content, are needed. This\
    \ information delivered in consistent user-defined hierarchies and other easy-to-navigate\
    \ structures appropriate to the business. The system specifies how new content\
    \ gets in. A process must be defined for each type of content to ensure that content\n\
    \ be captured and entered correctly."
  merge: -1
