- img_proc: true
  md: '# 5.3.2 Migration


    Email can have all of the migration problems of a desktop application, including
    end-user center reliance and familiarity, with the migration problems of a complex
    data center application that has integration and third-party tools issues. It
    is high risk, because in modern organizations email is a mission-critical application.
    Whether migration is possible depends on the organization, the pattern of use
    and expectations of users, and the willingness of administrators to adopt new
    tools.


    Since email has client and server components, migration can involve replacing
    either or both. Replacing clients is discussed in section 5.6. Replacing servers
    involves careful procedures to retain mails and mailboxes; there are some tools
    available to help with this. Servers can be replaced while leaving the clients
    in place, or clients can be changed concurrently. Client settings will need to
    be changed, and client behavior may change, depending on the migration.


    The most common email servers on the Internet, according to an analysis by the
    email vendor Qmail, are:


    +   - Sendmail, 42%

    - Other UNIX mail servers, 22%

    - Microsoft Exchange, 18%

    - Other servers, 18%


    It is reasonably simple if you need to migrate mail from UNIX to Linux systems.
    You almost certainly have the option of directly using the same mail server and
    client and setting up the server platform on Linux and supporting the clients
    unchanged. Of course, with any migration, you would need to back up the mail store,
    test the whole plane, and so on. In addition, you can look into alternative server
    and client software.


    # 5.3.3 PC-Based Mail Systems


    The tradition of mail in PC networks is different from UNIX, In the 1980s, when
    local area networks (LANs) were being installed, mail servers were supplied by
    the LAN suppliers Microsoft, Novell, and IBM. The products were originally built
    around LANs with weaker standards and Internet support and less scalability than
    UNIX systems, but they were gen'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 5.3 Email


    erally easier to administer and use. These products, now Microsoft Exchange, IBM/Lotus
    Notes, and Novell Groupwise, have now incorporated Internet and mail standards
    as IMAP and are capable of large scale. They have also extended the services they
    provide beyond mail to include other related activities, and lies a problem for
    migration. These extended activities are useful, but they are different in each
    mail system and there are no standards for them. In a word, these extensions are
    proprietary, but many organizations rely on them.


    If an organization uses these mail servers to provide a basic set of mail functions,
    it should not be a large challenge to migrate it. However, if it uses the proprietary
    gateway functions of Novell, Groupwise, or Exchange, there will be issues that
    could make the effort difficult or impossible. With Microsoft Office, a full open
    source mail implementation that will meet most needs is not difficult to do. However,
    setting up the exact look and feel of an existing Microsoft Exchange and Outlook
    system is difficult in detail.


    Exchange and Notes are problematic to replace because they bundle functions together
    in their own unique ways. Lotus Notes, for instance, combines forms, small databases,
    replication, and user application development in a way. There are generally no
    direct equivalents in groupware. Lotus Notes databases and forms and Microsoft
    Exchange public folders and forms will need to be replaced, either by custom Web
    applications or by open source groupware.


    Groupwise differs in detail and is always linked to the Novell directory. Novell
    is now a major Linux vendor, and Novell users may want to look at a migration
    to Novell directory and Groupwise on Linux as an alternative.


    # 5.3.4 Replacing Exchange


    It is possible to replace Exchange with all open source products. Exchange itself
    is an integration of several different functions, and to replace it fully is necessary
    to do similar integration. These functions are:


    +   - Message send and receive


    +   - Message store and index


    +   - Global directory (Active Directory) integration for authentication and employee
    lookups'
  merge: -1
