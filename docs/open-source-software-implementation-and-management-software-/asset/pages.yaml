  md: '# Database Servers


    new technology and ecommerce applications on the Amazon and Google scale that
    may run higher volumes than these, but most business systems are orders of magnitude
    smaller.


    # The TPC Benchmark


    TPC stems from a debit-credit benchmark for banking transactions that Transaction
    Processing Council (TPC) originated at Bank of America in 1972. The Transaction
    Processing Council was set up to monitor an evolving series of benchmarks starting
    from TP1 in an independent manner. TPC-C, which was introduced in 1992, is the
    major published transactional benchmark and has responded to limitations discovered
    in earlier benchmarks. The benchmark supports a mix of five transaction types
    and requires all elements of the database, such as numbers of customers, to scale
    along with transaction measures. TPC are published with the relevant cost data
    so price/performance can be considered, and there are clear rules on how cost
    is calculated. The benchmark is only for hardware and software that can be ordered
    by customers and is shipping now or will be available within a few months. Reviewing
    the actions of various competitors, the TPC has met this continual challenge by
    developing methods to control and eventually prevent this. The TPC is a good organization
    for publishing benchmarks measuring business database transaction performance
    as we have or are likely to have.


    # Limitations of the TPC-C Benchmark


    The TPC-C benchmark is expensive to run. Because of why it scales, and the precision
    needed to meet the standards correctly, it signifies time and money to run a benchmark
    (some $1M). So only limited number of these are run, depending on the vendors
    that choose to spend this money. We can only use the data to approximate a solution
    we are considering. Our chosen hardware and software are not likely to have been
    specifically tested, and we will look for something similar.


    The cost also means that running our own TPC-C benchmark is almost certainly prohibitive,
    but it is generally desirable to do this. Another method is needed to allow us
    to get really specific in addressing our needs.


    TPC cannot enforce that the methods used for the benchmark are the methods actually
    used in the real world. One reason the benchmark is expensive is that the skills
    to set it up are unusual, because it is now usually'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 7.3 Database Servers


    run on quite specialized software that ordinary organizations would not use, as
    follows:


    +   - Most vendors use custom C++ code and the Tuxedo application server, while
    recommending Java application servers.

    - Big data measurements use tricks such as distributed partitioned views, which
    customers don''t like to maintain, and materialized views, which customers do
    not benefit from.

    - TPC-C prohibits methods such as queuing that allows smaller databases to manage
    high-peak workloads.


    The highest-performance TPC-C numbers are now so big that dwarf normal needs by
    orders of magnitude. Compared with what most people are doing, this is like comparing
    a jet fighter to a crop-sprayer. Most customer database needs are nothing like
    the top of the TPC-C performance table, and most customers would probably be better
    off with something less expensive and, easier to use.


    What we can say about TPC-C is that if database/platform combination appears in
    the performance table, that combination is capable of tremendous potential performance
    beyond almost all practical customer needs. If a system is in there, it can do
    the job.


    The TPC-C price/performance table shows a very different set of platforms. The
    largest systems (compared with a jet fighter) turn out to be more expensive per
    transaction than mid-sized and mid-priced systems, so the price/performance table
    is dominated by these mid-sized systems. Given the difficulty of building large
