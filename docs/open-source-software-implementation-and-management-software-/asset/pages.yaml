  md: '# 8 Open Source Desktop Applications


    # 8.1 Introduction


    # 8.1.1 The Open Source Desktop


    A complete open source desktop with applications can be easily installed and demonstrated
    on a typical personal computer using Linux. Most people would agree that such
    desktops are attractive, powerful, and as easy to learn from scratch as Windows.
    These desktops can be significantly less expensive than closed code systems, since
    they can save the operating system cost the cost of applications as Microsoft
    Office.


    It is also possible to build a desktop on Windows, where all the applications
    are open source. Again, this can be attractive, powerful, and easy to learn. In
    many situations where the operating system is already installed, as on on home
    computers, there is no savings to replace it with Linux, but there are huge cost
    savings from replacing applications as Office with open source.


    The important open source desktop applications, which will be discussed in turn,
    are:


    +   - Graphical desktops

    - Web browsers


    +   - Office programs (word processing, spreadsheet, presentation soft-ware)


    +   - Professional applications (graphics, database front ends, Web designers)


    +   - Personal applications (media players, games)'
  merge: -1
