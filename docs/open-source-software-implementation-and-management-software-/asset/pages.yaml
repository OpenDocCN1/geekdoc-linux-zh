  md: '# 5.6 Manage User Desktops


    It is also possible to run OpenOffice and many open source mail programs on Windows.
    Switching mail can get us off Exchange CALs and helps to manage the persistent
    virus and worm problems with Outlook.


    We should analyze our office suite to determine how many users could be switched
    to OpenOffice without disruption, and what the cost could be. There may be some
    users who can start using OpenOffice now—for instance, calls, using one or two
    dedicated applications, or browser-only users. Many others will not be able to
    migrate, but we can prepare for a possible move in the future. If appropriate
    policies are in place to simplify a future move, we will be prepared if licensing
    changes or other events encourage us to move later.


    Depending on the status of license agreements and the feasibility, this is potentially
    a significant saving. 3,000 users at $300 per user is $1 million. This can be
    done across an entire organization if it is highly integrated. In many organizations,
    smaller business units may have different patterns of use, and this may be the
    right level to approach it.


    At this time, we can consider other suites or portal-based clients in the mix,
    since the analysis is the same. Desktop application management is regarded as
    expensive as many IT organizations. Although portal-based (browser-only) plans
    seem unattractive when we can give OpenOffice to everyone who doesn''t have a
    suite and a 10GB drive, for some organizations the cost of maintaining software
    at those clients will make the portal attractive.


    Any plan for a two-tier system with open source (or portal) and legacy users is
    going to face interoperability costs as a serious issue. While all these can save
    money, they will need careful analysis of the organization and its patterns of
    use.


