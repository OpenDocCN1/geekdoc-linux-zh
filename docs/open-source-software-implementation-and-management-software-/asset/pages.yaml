    # 9.2.2 Perl


    Perl has an enthusiastic community and a well-respected leader, Larry Wall. It
    is a practical, portable language. A major asset of Perl is its database of reusable
    code, CPAN. Using CPAN, it is possible for Perl to quickly find solutions to problems
    that are new to them but have been met and solved by others. Other languages have
    built similar systems modeled on CPAN, but perhaps not so effectively.


    Referring to Table 9.1, we see that Perl is somewhat widely used than PHP or Python,
    perhaps because it is the oldest of the three. Perl is best known for scripting,
    such as system administrators, and as a Web language (e.g., Apache mod_perl).
    Perl is a good language for sophisticated scripting. It is criticized for being
    hard to understand and is probably a better choice for individuals than teams.


    Perl applications include several system administration tools, including Webmin,
    the very popular SpamAssassin tool, and the Movable Type Weblog tool. Perl code
    runs the high-volume Slashdot and Kuro5hin sites.


