  md: 'Some small startup companies have done this. For most people, open source solutions
    will be adopted one product at a time. Most adopters will not be able to, or discard
    all closed code software at this time, and there is no reason they should need
    to. Many new solutions, such as IBM WebSphere, contain a mixture of open software
    and closed code.


    It is possible to run open source products on existing Windows installations,
    or to migrate code programs that you have to run on Linux.


    #  1.1.4 Does “Open Source” Mean Linux?


    It is possible to adopt open source without using Linux at all. Many developers,
    may use open source on Windows. On servers, for example, Apache is an open source
    server that runs on Windows and UNIX servers and IBM mainframes as well as Linux.


    For workstations, OpenOffice rivals Microsoft Office in functionality and can
    be installed from CD or the Internet in less than five minutes for no cost on
    Windows desktops. The Mozilla open source browser can be chosen, for instance,
    to standardize on a single browser for Windows and the Mac.


    We will look at some scenarios for Linux and some for other open source products.


    #  1.1.5 Does Open Source Require Different Business Methods?


    It is not necessary to adopt an open source approach to distribution in order
    to use open source software, and most organizations do not. Many companies develop
    closed code products that run on open source software and sell them for a profit;
    this includes almost every large software company today—IBM, HP, Oracle, SAP,
    and Apple. Other companies develop applications that run on open source for their
    own purposes—for instance, Google, Amazon, and eBay—without feeling in any way
    restricted by open source licensing or development models.


    It is never a problem to develop an application for your own use in an organization,
    or to sell or distribute an application written in an open source language, or
    to run on an open source platform. Nor is it a problem to distribute the open
    source software alongside yours.


    If you change or extend the open source software and redistribute it, you may
    have responsibilities under the license. In that situation, it is nec-'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Definition of Terms


    essary to look carefully at the license and choose one that works for your business
    model.


    # I.1.6 All Systems Will Be Open Source One Day?


    Given installed systems and sales trends, we can be certain that over the next
    few years open source and closed code software will coexist. In the long run,
    there is reason to expect some balance. There are advantages to open source but
    also limits.


    First, both commercial and government organizations have legitimate reasons for
    secrets. Organizations such as the CIA and Merrill Lynch, of which have deployed
    open source quite widely, are never going to open up all their code for public
    scrutiny.


    Second, some classes of applications appear to be more likely to fit the open
    source model than others. There is very little market share for open source in
    ERP and CRM systems or in large commercial databases. This may change, and the
    development of open source for these enterprise systems may be a matter of time,
    but it would certainly take many years for that to happen. Alternatively, we may
    discover rules of thumb that limit the open source model to certain areas and
    find that complex business areas never become open source.


    Third, there could be a trend toward closed code applications. Some people argue
    that a new wave of innovation might demonstrate the added value that closed code
    companies can offer. Others say that in the legal climate, such as patent law,
    might be introduced that would tilt the balance in favor of closed code systems
    again.


    # I.1.7 Is Open Source a Fad That Will Go Away?


    The information technology business has seen its share of fads. But this seems
    like a trend of the kind we see in other industries as they mature. Mature products
    such as office suites often become commodities. Mature services often become organized
    to more closely reflect the real costs—in this, in service and support rather
    than the original code.


    Already, the majority of organizations have some role for programs such as Linux,
    Apache, and Perl. It is likely that at some point organizations will have some
    open source widely deployed. So far, we are seeing open source software improve,
    if anything, more rapidly than closed code software. The open source cost advantage
    may narrow if closed code prices come down, but it is going to continue to exist.'
  merge: -1
