  md: '# System Administration (continued)


    | Title | Author | Description |

    | --- | --- | --- |

    | Migration Guide: A guide to migrating the basic software components on server
    and workstation computers | KBSt Publication Service | This is an indispensable
    guide with great practical detail for anyone migrating to open source from a Windows
    environment. This book comes out of the German government and Munich migration
    projects. It is well translated from German. |

    | The Official SAMBA-3 HOWTO and Reference Guide | Terpstra and Vernooij (ed)
    | Prentice Hall | An indispensable guide to Samba. There are several books on
    this subject; this has full coverage of Samba 3 and is written specifically for
    Windows administrators. |

    | LDAP System Administration | Gerald Carter | O''Reilly | A practical manual
    on administration of LDAP. All examples refer to the OpenLDAP open source product.
    |

    | Open Source Network Administration | Kretchmar | Prentice Hall | A "from the
    trenches" look at practical open source tools for network management. Kretchmar
    is a systems administrator at a large university. |

    | Linux Security for Large-Scale Enterprise Networks | Becker | Digital Press
    | A book on the larger scale issues of Linux security. |

    | Securing Linux | Konis et al | SANS Press | A short book with practical scripts
    for securing Linux in detail.'
