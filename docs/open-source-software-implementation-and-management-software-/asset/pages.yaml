  md: '# A.4 Top Ten Reasons to Use Open Source Software


    # A.3 Next Steps


    Develop personal skills. Install Linux on a system; the easiest way is to use
    Knopix, so if nothing else do that. Get your hands on open source software that
    meets your needs.


    Join a local user group. There is no substitute for personal meetings. I would
    be much worse without user groups, and I am convinced every one needs user group
    involvement. This is important in any software, but more so with open source,
    because some of the other communication channels are less effective. Open source
    user groups are also more likely to contain deep technical resources. I believe
    it is because of access to the source code, that people can help themselves; the
    opportunity to contribute, motivates; and the absence of dominant vendors tend
    to turn their groups into marketing events. such as Slashdot and Freshmart.


    Develop an open source strategy. Always include open source software in the alternatives
    for evaluation when buying products. Prepare for the open source sales model,
    the absence of sales representation and freebies, and the low-key branding and
    press coverage. For complex deployments, plan measures now to set up for migration
    later.


    Consider open source now if you need to:


    +   - Buy or replace infrastructure products.

    - Select standards, particularly for interoperability and integration.

    - Build, buy, or rewrite applications.

    - Deploy solutions in new areas, such as suppliers, channel, customer access,
    community access, call centers, and retail stores.


    # A.4 Top Ten Reasons to Use Open Source Software


    +   1. The open source development model has worked for over 25 years for highly
    complex and secure systems.

    2. Open source is the international solution because of the cost model, ability
    to employ local talent, and capacity for localization.

    3. You can access a growing pool of skilled professionals who share with and learn
    from each other.'
