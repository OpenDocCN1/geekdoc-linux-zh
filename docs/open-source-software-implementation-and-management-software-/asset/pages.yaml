  md: '# The Cost of Open Source Systems


    Of course, it is not difficult to price open source software products, since they
    are almost all free. The difficulty comes when we move past this to do these more
    difficult things:


    +   - Price comparable closed code products.

    - Price all associated costs, including hardware, staffing, and support costs,
    to derive a total cost of ownership (TCO).


    In this chapter, we will compare open source software prices with similar closed
    code software. Of course, there are not always similar products and where there
    are, we may have a preference for one feature set over another. In this chapter,
    we will only compare costs.


    Then we will examine the total cost of ownership of open source and closed code
    products and compare them. To do this, we will take some scenarios for businesses
    of different sizes. The estimates for hardware and staffing are kept very simple,
    and you are invited to substitute your own numbers.


    Because many factors differ, this is only a framework, which will need to be adjusted
    for a particular organization. The tables here are available at the Web site www.kawana.org/opensource
    for download if you would like to adjust them for your own situation. Figure 12.1
    illustrates the major cost elements, which are staffing, hardware, and software,
    usually in that order.


    We will review these costs by category, and then put the unit prices into simple
    tables. We can use these tables as the cost basis for some typical scenarios.
    In all cases, we should substitute our local information into this table, since
    our prices vary.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '276


    12.1 Total Cost of Ownership


    # Figure 12.1nCost elements.


