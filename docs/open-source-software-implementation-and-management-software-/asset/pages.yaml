  md: '# Software Development


    | Title | Author | Publisher | Description |

    | --- | --- | --- | --- |

    | Microsoft Secrets | Cusumano & Selby | Simon & Schuster | There have been many
    books published on the theme of secrets in Microsoft. Despite the title, this
    book is the best reference on how development was done at Microsoft. |

    | Dynamics of Software Development | Jim McCarthy | Addison-Wesley | This book
    has a powerful set of principles enriched by great stories on development from
    a successful manager of complex tools including C++. |

    | JBOSS Administration and Development | Stark & Fleury | Sams | An overview of
    the JBOSS source JEE application server. Fleury is the product architecture. |

    | MySQL | Paul Dubois | Sams | A large, comprehensive book on MySQL, covering
    administration and development with C, Perl, and PHP: The Second Edition covers
    MySQL 4. |

    | Python Essential Reference | David Beazley | New Riders | In my view, this is
    the best reference on Python. |

    | PHP and MySQL Development | Welling & Thomson | Sams | A definitive book on
    PHP development by professional instructors. |

    | PostgreSQL Developers Handbook | Kunde & Schon | Sams | An extensive, comprehensive
    book with chapters on development from different languages. |

    | Programming with GNU Software | Loukides & Oram | O''Reilly | Basic reference
    using Emacs, the GNU/C++ compiler, and revision control, which are the essential
    tools for maintaining most open source software. |

    | The Wiki Way | Leaf & Cunningham | Addison-Wesley | Cunningham invented the
    Wiki idea. The book is illustrated with examples in Perl and includes a CD-ROM
    with wiki software and Apache for Windows or Linux. |'
