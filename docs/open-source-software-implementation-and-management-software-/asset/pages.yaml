    # 10.4 Implementation Principles


    Many principles of system implementation are relevant to all development are the
    same as now they have always been at successful software houses. Managers know
    that the future is uncertain and we cannot control all of the developments in
    a significant project. This uncertainty means we should not commit to fixed schedules
    and prices. This uncertainty includes the competitive outlook and business context.
    Often, projects must change direction because of the actions of competitive or
    complementary systems. Our uncertainty also includes which code will get written.
    We cannot predict the completion date of any but the most trivial tasks, and significant
    pieces of code can have surprising effects or performance characteristics.


    # 10.4.1 Resource Trade-offs


