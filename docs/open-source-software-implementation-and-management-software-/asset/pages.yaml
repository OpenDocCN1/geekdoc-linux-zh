    PHP is a Web development language similar to Active Server Pages and Java Server
    Pages. PHP originally stood for Personal Home Page; it was like Front Page original
    but has evolved into an object-oriented language.


    PHP is primarily a Web language, but it can be used for scripting, and there is
    a version of PHP for GUI development called PHP-GTK.


    PHP is the newest of the languages in Table 9.1, with a young community that is
    growing fast (about 50 percent annually), whereas Perl and Python are stable or
    shrinking. Because of this, it seems likely that PHP will be the #2 language in
    the open source community, overtaking Perl and Java, within a year or two. It
    is already the leading language for Web development (most of which is not open
    source).


