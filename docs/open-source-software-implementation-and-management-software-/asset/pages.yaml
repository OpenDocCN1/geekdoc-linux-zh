  md: '# One-Time Migration


    If you plan a one-time migration versus continuing interoperability, you can handle
    most of the problems in a reasonable way. If your intention is to stop using Office
    and migrate all documents to OpenOffice, you will find that most documents will
    transfer with minor format changes that will not bother users on a one-time basis.
    Hundreds of documents may be transferred with a few hours clean-up work. For example,
    page numbering may be slightly off, some fonts may be replaced in a way you don''t
    like, and some complex references to external files may need to be checked. In
    this situation you can test as many documents as you need, and arrange for some
    expertise to be available to support the migration.


    # Two-Way Interoperability


    If you intend to continue transferring documents back and forth on a daily basis,
    the hours spent "fixing up" documents will add up indefinitely and become an impossible
    burden. That is why patterns of use need to be analyzed. Any plan that involves
    a regular exchange of complex documents back and forth between the different office
    products will need to be reviewed carefully, and preferably altered to eliminate
    this chaos.


    # The Effect of Switching Costs


    OpenOffice is a good product that meets the needs of most people in most organizations
    for an office suite. It is good enough. Most people can install OpenOffice and
    gain a system that does everything you need. However, most organizations already
    have Microsoft Office in place, and that changes everything. Unlike server products
    where switching is easy or undetectable, changing the desktop is a big deal.


    As discussed, migration of documents is not a small task. For some productive
    people, this is going to represent months of work having to be revisited and potentially
    lost. For the average person, it means inconvenience without compensation. Retraining
    is also an issue, as OpenOffice is similar but certainly not identical to Microsoft
    Office. Depending on the organization, this can cause high costs and some dissatisfaction.


    The effect of switching costs such as migration of documents and retraining of
    users makes this unattractive for many organizations. Figure 8.7 shows the effect
    of these switching costs using the innovation diagram reviewed previously. These
    costs can delay economic adoption for years or indefinitely. If, for example,
    each user needs a day or two of training, that could wipe out the saving in licensing
    costs. This is why we will first see OpenOffice adopted where users have not already
    invested'
