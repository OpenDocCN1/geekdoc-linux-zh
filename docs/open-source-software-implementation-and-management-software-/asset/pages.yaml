  md: '# 3.3 How Choosing Source Is More Difficult for You


    # Package of Products


    The differences in the way open source and closed systems are packaged and can
    lead to misleading comparisons. Open source distributions generally include office
    suites, various personal tools, databases and other development tools, often several
    of each kind. These are automatically installed for you if you select a profile
    such as "professional" or "developer," and at no additional charge. Because the
    closed vendors fund the reviews, they may choose to essentially define the functions
    to review as what they have included themselves and ignore the others.


    # Timing Reviews against Release Dates


    There are differences in the timing of releases and the reviews. This one might
    ought to balance but systematically favors the closed code vendors, because they
    fund the reviews and thus pick the timing. The review will compare a late beta
    product with its new features against an older product from open source.


    In one example, a study focused on ease of installation did not compare the currently
    available versions of Windows Small Business Server (SBS) and Red Hat. At the
    time, Red Hat Enterprise Linux 2.1 was in production and SBS (based on Windows
    2003 Server) was in beta. The study did not wait for a beta of RHEL 3, which is
    much easier to install.


    # Competitors and Product Versions


    Another issue is product versioning. The same review which compared Red Hat Enterprise
    Linux 2.1 (RHEL) with Microsoft Small Business Server did not compare similar
    products. Small Business Server is a low-end version of Windows with restrictions
    on number of users and output, bundled with a limited-use version of the SQL database
    and other products, such as a fax server and a wizard-based front end, which were
    included specifically to improve ease of installation for small businesses. RHEL
    is the version of Red Hat Linux designed and priced for use by large ("Enterprise")
    businesses, having for instance, clustering and a choice of full-function database
    packages. RHEL should be compared with the more expensive Microsoft Windows Advanced
    Server. More importantly, Small Business Server should have been compared with
    Red Hat Linux 9, which was a production release at the time. Red Hat Linux 9 was
    positioned for smaller and home businesses and was much easier to install.'
