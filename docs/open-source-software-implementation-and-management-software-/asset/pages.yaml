    It is often difficult to find people to work on less glamorous code, or on non-coding
    issues such as documentation. Documentation is an area where an organization using
    open source can contribute very naturally. This can be expanded by benchmarking
    and best practices.


    Sometimes there may be an opportunity to release code to open source. For this
