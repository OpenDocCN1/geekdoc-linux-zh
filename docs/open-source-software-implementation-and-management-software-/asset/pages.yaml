    # ## 1.2.1 Early Years


    In the 1950s, the first business computers were introduced, based on work done
    during World War II. These were practically one-of-a-kind machines, running custom
    programs written in binary code, later assembler language. They were extremely
    expensive and it was thought by some (such as a famous IBM market estimate) that
