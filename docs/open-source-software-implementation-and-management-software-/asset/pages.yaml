    # Formats


    There are some serious problems with using the Microsoft Office formats. They
    are proprietary, subject to change, and not documented. It is quite difficult
    for third parties to access them, although some good programs are available. Using
    these formats in correspondence, for instance, is implicitly requiring others
    to acquire the Office programs when they may not need or them


    OpenOffice uses a zipped set of XML files. The Open-Office format is generally
    no more than half the size of the MS Office files (unless bit maps or other uncompressible
    attachments dominate the size). The OpenOffice format is also simple to read using
    standard tools, because the XML format is published.


    It has been pointed out that Microsoft Office documents keep earlier versions
    of documents and author information in the file in ways others do not expect.
    Authors have been caught by data discovered in their Microsoft Office files that
    they did not know were. New digital formats in Microsoft Office 2003 are likely
    to cause problems in accessing data from older or less expensive versions of Office.


    Microsoft Office cannot read OpenOffice formats at all, while OpenOffice reads
    Microsoft formats well. OpenOffice can create PDF files directly, while Microsoft
    Office has to use a third-party tool.


