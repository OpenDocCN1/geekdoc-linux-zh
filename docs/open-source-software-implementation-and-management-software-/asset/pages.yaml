- img_proc: true
  md: 'The spec should break the product into features, explain the features, and
    indicate whether they are required or desirable. For most business systems, features
    will be broken into presentation, business, and data tiers.


    Because it is repetitive, comprehensive, and subject to change, a spec should
    usually be maintained as a spreadsheet or in some database-driven format.


    #  10.5.5 Technical Specification


    The technical specification should indicate how the functional spec should be
    implemented. This includes the technical architecture and details of each of the
    included components. Many people would call this technical architecture. It should
    be sufficiently detailed for skilled developers to build the system. It includes:


    +   - Logical model of the system

    - Physical model

    - Key design points, technology choices, and proofs of concept

    - Infrastructure for development, testing, and deployment

    - Interoperability, including data flows and events

    - Migration, including data conversion

    - Security, including authentication/authorization and threat management

    - Data stores, including schema

    - Management by operations, including logging and monitoring


    #  10.6 Migration


    In a migration, risks are higher than with a new system because expectations are
    higher and users have something to lose. If we have to replace an existing system
    with a new one, we need to take extra care to plan carefully, test everything
    thoroughly, and still be prepared for unexpected problems that require backing
    out changes. Problems may not be our fault now, they will be after a migration.
    This work will increase the costs and the time to implement the system.'
