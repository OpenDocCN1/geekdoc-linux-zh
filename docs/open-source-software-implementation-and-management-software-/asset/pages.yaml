    # 10.4.3 Support Elements


    In order to control team-based application design and development, we must put
    a structure in place. All design work and code must be managed through source
    control. Application components must be put in a place where they can be reviewed
    and reused. Code must be consolidated onto a central server for integration testing.
    In order to tie the pieces together and keep them working together, application
    components must be packaged and deployed to staging and production servers.


    Code in all application tiers should be to run in a debug mode, reporting everything
    we may need to know. We need facilities to run the application; monitor processing,
    performance, and results; and compare these previous runs. We need the ability
    to find components that we can include in our solution—preferably open source
    but possibly in cases not. In open source, source code management is generally
    done with CVS. There are alternatives; Subversion, which is an update to CVS by
    the original developers, is worth evaluating because it is easier to learn and
    use. If the organization is already using a particular source code management
    system, that could continue to be used. Projects can be found using SourceForge
    for the most open source code, and Freshwater, which serves as an index search
    for particular types of projects, such as an application or a solution implemented
    in a particular language.


    # 10.4.4 Watching for Problems


    Projects that are running into trouble can be measured technically, such as through
    bug reports or performance measures. They also reveal themselves in human factors.
    In team communications, there may be an emphasis on secrecy or blame. Items may
    be piling up waiting for someone, perhaps a new hire, to do. The schedules of
    our team members may be expanding, leaving no time for other life activities such
    as shopping, so those get done during the day. Possibly the parking lot is full
    at midnight because there are heroes working away at all hours, the schedule is
    still slipping. Unlike a technology concept, a product should have a clear focus
    on the customer and his or her needs. The product should be tending toward something.
    Its size and performance should be stabilizing.'
