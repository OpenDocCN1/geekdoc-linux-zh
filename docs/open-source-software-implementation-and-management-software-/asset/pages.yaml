  md: '242


    10.8 Support


    Level 1 support is usually managed internally (or outsourced directly). By definition,
    these issues are hand-holding or other trivial activities and need to be resolved
    inexpensively, not by calling a vendor. Level 2 support can be handled internally,
    through the software vendor, or through a third party or community process. Level
    3 support requires developers with access to the source code. This is the bulk
    of what maintenance programmers do on custom code within organizations. It is
    a service that you must get from a closed code fogy for your software, since nobody
    else can perform it, so you must contract for it. For instance, look at support
    for Microsoft Office. Level 1 will be provided by an internal help desk. Level
    2 will generally be routed to Microsoft Product Support Services, to a similar
    organization at IBM or HP, or be handled internally by some large organizations.
    Level 3 must be handled by reporting a defect and allowing it to be handled by
    the Microsoft Office group. The correct reporting of a defect is potentially a
    lot of work in, and this will be handled by the level 2 support, which may be
    outsourced.


    For open source, a lot of people worry that there is no place to turn for support.
    It is never true, there is always the option of supporting yours, as you do for
    custom software. It is certainly not for the serious, commonly used products as
    Linux and Apache. They are at least responsive to level 3 defect as any commercial
    vendor; there is an active community providing level 2 support; vendors will enter
    into commercial contracts to provide it with service-level agreements. The major
    difference between open source is that you do not have to buy support from the
    software vendor.


    For smaller open source products, the system is like the source code you might
    use with a startup. There is a market risk that the product will not succeed,
    or will tail off before you are finished with it, and in case you may have to
    take the maintenance.


    Some companies would like to buy warranties or other insurance-like arrangements.
    It is difficult to get in open source; if this is needed, you will probably need
    to deal with a large company such as IBM or HP.


    In practice, when you have a problem it is always going to be your responsibility,
    legally and in practice. Software licenses always state that the software is not
    warranted for your particular purpose. Vendors will make their best efforts to
    work around problems, but if this involves purchasing additional hardware or rewriting
    your software to approach the problem differently, that will be your responsibility.'
