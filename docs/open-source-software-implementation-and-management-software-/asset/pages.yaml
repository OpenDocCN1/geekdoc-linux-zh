  md: '# 7.3 Database Servers


    # 7.3.1 Classes of Database Servers


    We are going to cover all databases here, even desktop ones. We will treat desktop
    servers as a small class of database server, and some elements of desktop systems
    as client tools. For example, Microsoft Access can be regarded as a database application
    that administrators and updates a database server. The server for Access can be
    an Access database, which can be local or remote, or it can be a SQL Server, upgraded
    by the wizard provided by Microsoft, built directly using Access tools, or another
    database accessed with ODBC.


    Some types of database products need to be looked at separately:


    +   - Online transaction processing (OLTP) servers

    - Data warehouse servers

