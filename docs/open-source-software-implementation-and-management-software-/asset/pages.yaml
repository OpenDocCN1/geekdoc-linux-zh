  md: '# About the Author


    I have been a corporate developer and consultant for over 20 years in London,
    New York, Chicago, and the southeastern United States. I started on IBM mainframes,
    an early PC enthusiast, and had some Digital VAX experience, but I really fell
    in love with UNIX when I first saw networked Sun workstations. After that, I had
    a UNIX consulting business for several years. AI had me as a major client, so
    the flavor of UNIX was mostly IBM system engineers on TCP/IP and the Internet
    at a time when it was new to most of them. I was the subject matter consultant
    on a couple of books about AI system administration.


    In 1993, I wrote a book on the development strategies and methods of that time,
    generally called client/server computing. Research for that book convinced me
    that what was then called Windows NT was the best upcoming opportunity, so from
    1994 to 2002, I worked for Microsoft on server adoption and enterprise consulting.
    This was mostly Microsoft Consulting, including two years managing product sales
    for development tools and database. This included introduction of SQL Server 7.0,
    which altered price/performance in the database market five years ago in the way
    open source databases are doing today. At one time I was a Microsoft Certified
    Systems Engineer, Solution Developer, and Trainer (MCP #22989), but most of my
    MCP qualifications have expired.


    In my last job with Microsoft as a .Net architect, my team was often called upon
    to debate with or otherwise compete with, and also to interoperate with open source
    systems. In the course of these activities, I was surprised and impressed by the
    quality of the open source products, and I resolved to switch to them.


    Since 2002, I have been developing and consulting on open source software, particularly
    migration from and interoperability with Microsoft'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'Windows systems, I have contributed to a couple of small open source projects,
    but I consider my role to be more a consultant than an open source developer.


    I have done a lot of training, in technologies from OLTP to UNIX and TCP/IP has
    to Microsoft .Net, and in how to build high-performance online systems, complex
    distributed software, and reliable server farms. Although the details differ,
    many of the important in developing systems are the same, and this book will emphasize
    those similarities as well as the differences.


    # Writing Environment


    This book was developed, written, and tested from September 2003 to March 2004
    using the following systems, which all share files and printers using Samba:


    +   * ASUS dual-processor server running Red Hat Enterprise Linux 3.

    * LinuxCertified notebook running SuSE Professional Linux 9.

    * Dell Latitude 1400 running Fedora Core 1. This old lightweight system has a
    1024 × 768 screen, which makes a good screenshot.

    * Dell Inspiron 4100 running Windows 2003 Server for interoperability and cross-platform
    testing.

    * Toshiba R100 network running SuSE Standard Server 8 under VMware on Windows
    XP.

    * Apple Powerbook G4 running Mac OS X 10.3 for interoperability and cross-platform
    testing.


    All of the systems run MySQL, Apache, Python, PHP, and OpenOffice. Text was written
    with OpenOffice Writer, spreadsheets with OpenOffice Calc. Screenshots and other
    maps were edited with GIMP. Line art was done with Dia and Microsoft Visio.


    Final files were assembled using a Mac platform (Apple PowerMac G4 dual-processor
    and PowerBook G4) and Adobe software (FrameMaker 7, Distiller, Acrobat, and PhotoShop).
    The final file for printing was delivered in PDF format.'
  merge: -1
