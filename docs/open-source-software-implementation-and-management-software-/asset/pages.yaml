  md: '# # 2

    # Where Open Source Is Successful


    This is a game of picking winners, so we begin this chapter with a definition
    of the playing field. Then we will look at the areas where open source is succeeding
    and the areas where open source has advantages and disadvantages, real apparent.


    # ## 2.1 Analytical Framework


    This section looks at how technology is adopted, when, and by which organizations.
    Important issues are disruptive innovation, lock-in, and the type of adoptions.


    # ### 2.1.1 Disruptive Innovations


    In Clayton Christensen’s, *The Innovator’s Dilemma*, the argument is made that
    businesses are threatened by “disruptive innovations,” which are new approaches
    that come from under their radar. Ironically, the businesses that pay the closest
    attention to the needs of their best customers and sales channels are the most
    vulnerable to such threats, because the needs of those customers and channels
    are not well satisfied by the innovation in its early stages.


    F examples of disruptive technologies include the personal computer, which is
    an obvious success, and the electric vehicle, which has great potential but has
    not really broken out. A large part of Christensen’s book focuses on the history
    of specific products, such as steam shovels and disk drives, that offer detailed
    examples of successful cycles of disruption. The disk drive story, for instance,
    is mostly one of smaller and less capable drives finding new functions, solving
    new sorts of problems, and then growing up to replace the larger, previous generation.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# 2.1 Analytical Framework


    # Figure 2.1

    Successive

    disruptive

    technologies.


    ![](img/5e95216d5535a91da78910a98b306b74_42_0.png)


    Disruptive innovations often take the form of being “good enough” as opposed to
    “better,” at least as the incumbents see it. When a disruptive product is compared
    with existing choices, there may be severe current limitations in the Y axis,
    but the new product is much simpler and cheaper in a way that is important to
    some customers. This type of activity happens in industries where products are
    improving faster than customer needs. This is common in technology.


    In 2.1, we see three technologies, A, B, and C, whose performance (on the Y axis)
    is compared over time (on the X axis). For the sake of argument, let them be three
    sizes of disk drive, such as 3.5, 2.5, and 1.8 inches. The performance measure
    is capacity (GB). The new products will be smaller in size and price.


