  md: '# # How Open Source Software Is Developed


    The methods of development used for open source software are often discussed.
    From the famous essay by Eric Raymond, “The Cathedral and the Bazaar,” to recent
    press articles, anecdotes suggest that there is something new, different, and
    better about the open source model. But we have no consistent picture of how open
    source is developed or of the alternative development models to which it should
    be compared.


    # ## 9.1 Methodology


    As far as open source is concerned, there appear to be several models that we
    are in use. These include:


    +   - An individual working largely alone

    - A “bazaar,” or large loosely knit dispersed product team

    - A conventional colocated product team


    Commonly, products transition between these structures over time, and they also
    merge these ideas. Most often, a product starts with an individual or a product
    team and later moves toward the bazaar, often retaining central ownership.


    Some open source software has been built on the bazaar model, where a loosely
    structured, large network of people with little formal organization cooperates.
    To be clear, there has to be a seed product first, that can run, distributed,
    and tested to get the process going, and that is generally created by an individual.
    Also, all accounts suggest Apache, Linux, and BSD were tightly structured around
    a small central leadership team. The first example of the bazaar could be the
    Berkeley effort to get AT&T'
