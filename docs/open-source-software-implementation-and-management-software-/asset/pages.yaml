  md: '# 13.3 Mixing Open and Closed Code


    The majority of open source developers spend most of their time on closed code
    development. Most open source developers work primarily on internal or closed
    code development within companies, so they are quite familiar with closed code.


    Most open source products above the operating system are offered on one or more
    closed platforms, generally Windows and UNIX. Products that use databases offset
    some closed code databases, most often Oracle.


    Open source products are often sold as part of a bundled sale, which includes
    closed code products. Large organizations purchase the top level of the software
    and service stack from a major closed code vendor. Their primary purchase might
    be outsourcing or other services from IBM Global Services, Accenture, or CSC;
    software from IBM, BEA, Oracle, or SAP; hardware from IBM, HIT or Dell, with Linux
    and other open source products included in the overall scale.


    Table 13.1 shows examples of open source and closed code deployed together.


    The common hybrid case is simply organizations that obtain a variety of open source
    and closed code products, and then deploy them to meet


