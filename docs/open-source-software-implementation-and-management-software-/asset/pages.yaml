  md: '# # Open Source Software: Definitions and History


    If you are going to become an advocate for open source software, there will be
    some definitions, frequently asked questions, and historic issues that will be
    raised repeatedly. We will cover them in this chapter.


    # ## I.I Definition of Terms


    Open source software is software that must be distributed with source code included
    or easily available, such as by free download from the Internet. The source code
    should be in the same form that a programmer would actually use to maintain it—not,
    for instance, a generated, obfuscated, or intermediate code form. The license
    of this software will not restrict others from distributing the code or modifications
    and derived works under the same terms. It will not discriminate against people
    or fields of endeavor. Sample licenses are included in an appendix.


    The Open Source Definition is included in Appendix B. The Open Source Definition
    (OSD) was originally written by Bruce Perens for Debian Linux and was created
    in 1997. It is an established definition of open source that is simple without
    being too simple, and it includes several licenses that are acceptable.


    Some people call software like this, distributed under licenses such as the GPL,
    Apache, or Mozilla licenses, “Open Source Software.” Others call it “Free Software.”
    Yet others, particularly in Europe, call “Free/Libre or Open Source Software”
    (FLOSS). Capitalization of these terms varies. There are other expressions in
    we use, but the most widely used term seems to be open source. In this book, we
    will refer to software that meets the Open Source Definition as “open source.”
    This is a simple expression that avoids capitalization and acronyms such as “OSS,”
    both of which are annoying to read repeatedly.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 1.1 Definition of Terms


    The alternatives to open source can be called proprietary software, commercial
    software, or, alternatively, nonfree, or closed software. These may have slightly
    different meanings, since there can be different ways of failing to meet the tests
    of open source. Some of these terms strike a reader as derogatory, although that
    is not intended, probably because in our society "freedom" and "openness" sound
    more attractive than their opposites. For our purposes, it will be helpful to
    have a term for these alternatives. We will refer to software that does not meet
    the OSD as "closed code." In this use we are using Lawrence Lessig in the book,
    The Future of Ideas. If a piece of software (product) combines open and closed
    elements, such as Apple OS, it will be defined as closed. So any software product,
    as licensed, will be defined as either open or closed.


    There is a third that we will use in two special cases. Some software is offered
    under different licenses. It may be offered to some groups as open source and
    to others as closed. Note that to meet the terms of the OSD (to be considered
    open source), this must be at the user''s discretion. This is a hybrid licensing
    model.


    We can apply the term hybrid when looking at a group of products. If a group of
    products is purchased or installed together, some of which are open source and
    some closed code, we will call the result a hybrid system. An example would be
    IBM WebSphere, which includes Apache (open source) and some other products that
    are closed code.


    First, we will deal with a few frequently asked.


    # 1.1.1 What Is Free Software?


    The open source dates from 1997, when a group of people, including Eric Raymond,
    Tim O''Reilly, and Bruce Perzens, decided that the term free software and some
    of the arguments employed in support of it making the idea less attractive to
    many businesses. They decided, as a marketing decision, to emphasize technical
    and practical advantages of open source rather than arguments from principle.
    Those positions are'
  merge: -1
  pgno: 24
