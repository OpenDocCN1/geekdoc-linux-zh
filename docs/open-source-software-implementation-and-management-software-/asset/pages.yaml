    # 12.1.2 Hardware Costs


    Hardware costs include servers, clients, networking equipment, and other appliances
    as firewalls. Hardware costs are generally about the same between Windows and
    Linux, unless there is some unusual performance causing a difference. Usually,
    the same hardware can be used at all levels. Before the recent releases of the
    Linux 2.6 kernel or some specialized late 2.4 kernels, as Red Hat Enterprise Linux
    3, Linux threading was slower than the hardware allowed, and this had a negative
    effect on database and application measures.


    Table 12.2 estimates for hardware. Most organizations will use a few standard
    boxes so that service parts can be stockpiled and one set of trained users can
    maintain all the systems. I have used commodity systems of the type commonly used
    for Windows and Linux. Most systems can be put together with these components.
    There are, of course, much more expensive servers available for specialized purposes.


    # 12.1.3 Software Costs


    The closed comparative software prices that follow are given for Microsoft. The
    major vendors track each other’s pricing and Microsoft’s pricing is much more
    transparent than other vendors. In my experience, Microsoft is very rarely expensive
    for the same class of product than IBM or Oracle, and its pricing is relatively
    stable, easy to get, and easy to work with.


    Microsoft server prices are discounted for volume purchasing. This can reduce
    prices by 25 percent for a large organization, or in some cases.'
