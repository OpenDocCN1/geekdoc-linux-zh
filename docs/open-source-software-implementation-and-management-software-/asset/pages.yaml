    # A.2.1 Setting up Interoperability


    We will need to establish interoperability between Linux systems and our existing
    systems. There are several ways to do this, starting with those with a single
    machine. Options include a dual-boot system, running Linux on Windows, and running
    Windows on Linux. Of these, the most generally useful is to create a dual-boot
    system.


    # A.2.2 Dual Boot


    Dual-boot machine can start in either Windows or Linux, for example, but we must
    choose. If we need an application from the "other side," we must stop and restart,
    and that is inconvenient. If a machine is dual boot, you can see how it compares
    on the same hardware—for instance, speed, graphics. Second, if you have difficulty
    with something in the course of testing (which might be a seldom used Windows
    program or a logon via medium you only use on the road), you preserve the ability
    to boot in Windows to do that. Finally, you can later take off whichever operating
    system you don''t.


    To set up a dual-boot system, which leaves your Windows install intact and allows
    testing of a full version of Linux, you will need a disk drive with a minimum
    size of about 10GB (5GB for each system). The dual boot is a little harder to
    set up in the first place, and there is a slight risk that setting up the dual
    boot will disable the Windows system. Any data you should be backed up before
    trying this, and you may need some expert help for this if a problem occurs. If
    you have a new system, you can install Windows using half the drive, and then
    install Linux on the unused space.


    Since I often find systems with Windows installed and data on them, only from
    the manufacturer, I usually use the program Partition Magic,'
