  md: '# 10.9 Summary


    In this chapter, we reviewed how to manage a team, the process and roles, and
    the more important typical deliverable documents. There are some improvements
    to consider suggested by successful practices in the open source software community.


    For most organizations, the new issues posed by open source software are less
    that they will be creating it than that they will be using the software, employing
    or otherwise interacting with authors, and integrating it with their own work.
    There may be opportunities to use open source methods within the organization.
    There may be a need to review policies that may be possibly restrictive on copyright
    and work for in the light of open source possibilities.


    The issue of support is critical for organizations adopting open source software.
    The organization needs a clear policy about what it expects in the way of support,
    what it is willing to provide, and what it wants to pay for. Given this, the resources
    are available to deliver this, generally at non reasonable prices and with more
    flexibility than from closed vendors.'
