  md: '# 5.3.5 Integrated Exchange Replacements


    If you are on Exchange and want to find a comprehensive product to move to, as
    opposed to the custom integration solution, there are at least two good choices.
    There is an open source product, Exchange4Linux, which is probably a replacement
    for Exchange in smaller organizations with a few hundred email users.


    Organizations with thousands of users that may want to move from Exchange to a
    Linux platform may want to look at the closed code product Scalix. Scalix has
    licensed OpenMail, integrates the other functions previously, and offers services
    such as migration from Exchange. An alternative is Samsung Contact, also based
    on HP OpenMail.


    # 5.4 Groupware and Collaboration


    The open source community has been effective at building tools that support the
    community. A promising possibility is to look at these community tools to perform
    a currently unfed function in your organization. In addition to looking at equals
