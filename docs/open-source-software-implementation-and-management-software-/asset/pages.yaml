  md: '# 4.6 Summary


    For most people, the first thing we can do is set up an open source lab, and use
    the lab as a base to review and publicize open source activity, evaluate or create
    test solutions, and train technical and user personnel. The lab should deploy
    the Linux distributions and other software on which you would like to standardize.
    This prepares the path for the other steps. We can train developers in one or
    two source languages, Python and PHP; and train administrators in Linux, Samba,
    OpenLDAP, and Perl or Python scripting.


    We can migrate infrastructure servers to open source using a combination of Samba
    on Linux servers and network-attached storage appliances. This saves money on
    client licensing and simplifying management. We can start with simple file/print
    sharing without strong security concerns. If we have directory-based security
    needs, we need to choose between using Samba 3 to support Active Directory or
    consider deploying OpenLDAP as a replacement for or alongside the closed source
    directory.


    We can build one or more LAMP applications. This tool set simplifies development
    and can save money over alternatives. The most likely simple success will be to
    build some PHP applications using Apache or whichever database currently used
    could be new applications or rewrites of old code trapped on obsolete platforms
    or databases.


    We can investigate and begin bringing in new open source systems to the underserved.
    We may be able to open up opportunities for solutions that were not possible before.
    Likely groups to consider include franchises; business partners; customers; employees
    in factories, warehouses, and stores; and the local community. In such groups
    we have influence but cannot control the operating environment or software purchasing.
    Offering office suites, image manipulation, or email and messaging without licensing
    fees may allow us to offer systems or exchange information without great expense.


    We can migrate applications and databases from other operating systems, such as
    UNIX and Novell, to Linux and one or two standardized databases. This can simplify
    system and application management and take out old recurring costs. If it is a
    database that we are planning on continuing, such as Oracle, we can migrate to
    Oracle on Linux. If it is an obsolete or deprecated database system, as Progress,
    Brieve, or Access, we can move it to MySQL or PostgreSQL. For applications which
    we wish to replace, we can look at new packages running on Linux or develop new
    Web applications using LAMP.


