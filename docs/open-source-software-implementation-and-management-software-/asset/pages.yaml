  md: '# 1.2 A History of Software


    The Internet switched to the full TCP/IP protocol in 1981. At that time, Berkeley
    Internet Name Domain (BIND), the open source program that implements DNS and names
    maps as "news.google.com" to Internet addresses as "10.1.203.45," was written.
    Program runs on 95 percent of Internet name servers and all the root DNS servers.
    Those have been accessed by every transaction machines on the Internet from 1981
    until today, so it is probably the most used program by the Internet.


    From 1981 through the 1990s, the Internet, as measured by connected systems, users,
    and information transfer, was approximately doubling every year. Rate of growth
    would only be sustainable if almost everyone in the Western world started to use
    it. It looked the limit on growth would be the difficulty of use, since the maine
    applications were mail, file transfer, and remote use (Telnet), and they all required
    technical skills and needs. Then the World Wide Web was invented.


    # 1.2.9 The World Wide Web


    Around 1991, HTML and the World Wide Web were invented at CERN, the European Center
    for Nuclear Research, and at the time the largest Internet site in Europe, by
    Tim Berners-Lee. It spread quickly. In 1993, the Mosaic browser was developed
    at the National Center for Supercomputing Applications (NCSA) in Illinois. Work
    on the server began in 1995, based on prior work on the NCSA Web server.


    The Web server and browser solved the problem of ease of use for Internet users,
    as well as the problem of a simple model for GUI network development and deployment.
    It turned out to be the most important development in the history of computer
    software. We may not yet understand all of its implications.


    Berners-Lee might have licensed the Web idea using the GPL, which would have ensured
    it was open source, but he put it in the public domain. This meant that open source
    and closed code developers are free to use the ideas and code. For a while, it
    was not clear whether the Web would take a closed direction. Netscape had acquired
    much of the NCSA development team and planned to sell closed code browsers and
    servers. Microsoft licensed the original Web code and planned to distribute closed
    code browsers and servers with custom extensions with Windows. If the protocols
    were extended by competing closed code companies, there might in effect be not
    one but several proprietary Webs by now, as there are competing incompatible versions
    of instant messenger software.'
