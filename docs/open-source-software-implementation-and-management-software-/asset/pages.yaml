- img_proc: true
  md: '# 13.5 Other Intellectual Property Issues


    A dual license strategy relies on code ownership. It will be difficult in practice
    to get a large group of contributors to assign ownership to a commercial organization.
    In fact, the cases of dual licensing listed, and others I know of, have the look
    of a commercial company, where development is in house and external contributions
    are signed over and compensated for.


    # 13.5 Other Intellectual Property Issues


    While the term intellectual property is a good description of this area, it includes
    the specific ideas of trademark, copyright, and patents, as well as contracts,
    including licensing agreements and employment contract terms such as right for
    hire. It is important not to confuse these, as it is always helpful when looking
    at a particular claim to see which of these is based on rather than using terminology
    as “intellectual property.”


    Open source licenses use intellectual property law in general, and copyright in
    particular, to selectively distribute works for broad use while retaining ownership
    and restricting certain behavior that would have an adverse effect on others.
    These licenses are voluntary and can gain their power from the ownership of the
    author.


    Open source software should not be confused with public domain. Open source uses
    copyright and licensing law to enforce intellectual rights, essentially like any
    other licensing agreement but with a particular purpose in mind. Including public
    domain as an option, then, our distribution choices come down to these:


    +   * Closed code—you grant a license with restrictions that you specify, typically
    including relicensing and publication of proprietary information, and retain ownership.

    * Open source (reciprocal, e.g., GPL)—you grant a license with restrictions on
    relicensing of derivatives and retain ownership.

    * Open source (nonreciprocal)—you grant a broad license and retain ownership.

    * Public domain—you relinquish ownership and all rights to it permanently.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 13.5.1 Provenance


    There is always risk in any business decision, including software licensing, and
    open source is generally similar. One area where some open source products may
    have more risk is provenance. Provenance is the issue of whether that you have
    licensed from some party was actually to offer. This is a concern with any type
    of licensing. Programmers working for a vendor might have copied code into the
    product from elsewhere. If this was proprietary, it would contaminate your system
    and your system would fall under restrictions imposed by code''s licensing terms.
    It might expose you to a license fee, for instance, or a requirement to have your
    source.


    All projects need to maintain records of where any contributed code was obtained.
    Because some open source projects receive code from many contributors, it might
    be more onerous for them. For others, it is no different from any other project.
    When acquiring a product, we need to make sure this provenance work was done.


    There are occasionally specific allegations that a piece of open source software
    is stolen "intellectual property" from private companies. This may happen, but
    it is not common. It is illegal to appropriate code, to use others'' trademarks,
    or to obtain others'' secrets. There is nothing unusual about open source in this
    regard. The laws against these activities have been used often and still apply.
    However, it is the nature of open source that all the code is available for inspection,
    any wrongdoing is far more likely to be caught with closed code. Although open
    source software has been around for 30 years, yet has been found. There is no
    lawsuit that has succeeded in proving that any amount of closed code has been
    incorporated into open source. If such a lawsuit were won, then offending code
    would need to be replaced, but the status of open source in general would not
    be different.


    The same laws also apply if a closed code developer appropriates trademarked material
    or trades secrets. There have been several lawsuits in the private sector. There
    may be issues where closed developers wrongly use appropriate open source code,
    which is easy to get. The company Black Duck was founded to address this problem.
    Organizations with a concern that open source code has made its way into their
    products can use the Black Duck product to search online open source libraries
    for code that looks like code in their products.


    Of course, it is fine if an open source product is functionally equivalent to
    closed code software, was built cleanly without access to that code and'
  merge: -1
