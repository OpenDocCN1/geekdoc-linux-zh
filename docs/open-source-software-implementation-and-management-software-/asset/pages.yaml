    # 6.5.2 Booting from a CD


    One very useful Linux distribution to mention is Knoppix. Knoppix is based on
    Debian and the KDE desktop with OpenOffice and a powerful set of programs. It
    comes on a single bootable CD, so you have nothing to install. It recognizes devices,
    including the network.


    Knoppix is great for evaluations or loaner machines, because it just works. It
    is also a good base to fix up Windows or nonbooting boxes. This is very useful
    for system repair or to provide Linux tools to work with non-Linux systems. For
    example, you could use the Linux “parted” utility to alter partitions on a system
    that boots in Windows.


    Knoppix is easy and attractive to use. You can get a good look at a working Linux
    system and get some work done on it. Knoppix is at 3.3 and is well tested and
    popular. Figure 6.3 shows Knoppix in the process of booting from a CD. Figure
    6.4 shows the Knoppix screen after booting with the KDE desktop visible, Konqueror
    open, and Mozilla and OpenOffice available on the menu.


    There are alternative “live” (bootable) CDs, including some on business-sized
    CDs or that can boot from USB devices. SuSE Linux 9.1 Professional is self-booting,
    so I expect all distributions will be. Until then, Knoppix is the best known and
    most mature, so for most people it is the one to try first. For those who prefer
    Gnome, there is a similar product called Gnoppix, but this is in beta and I would
    advise waiting for it to reach 1.0 and sticking with Knoppix for now.'
