  md: '# 11.3.2 Queuing


    One of the most important elements of design for performance is to use asynchronous
    methods correctly to decouple components from each other—for instance, front end
    from back end. There are several names for this but I''ll simply call it queuing.
    A correct use of queuing was behind many of the most successful transaction processing
    systems of the last 40 years. IBM IMS/DC and the Tandem (now HP) NonStop platform
    both used asynchronous design effectively within their products, which have been
    extensively used in the financial industry over the last 30+ years.


    There are ways to achieve the design feature without using message products, such
    as writing queues into the file system or database, and that is what most people
    do.


    Queuing offers improvement to an application in reliability and throughput. The
    first advantage of queuing is that it increases reliability. Queuing decouples
    a business transaction from issues of server, client, or network availability—in
    other words, it can provide “success in the face of failure.” Queuing also allows
    us to remove tight coupling from business partners, who may have different capacities
    or availability cycles. For example, our order processing may depend on a shipping
    component. But possibly shipping delays or is not in operation at all time. We
    acknowledge orders now and queue them for later processing and shipping.


    The second advantage of queuing is that it allows us to economically manage large
    variations in demand. Businesses do not experience demand for services, but have
    many cycles from hourly and daily to periodic, and also experience heavy volumes
    by unusual events. Examples include workers logging in at the beginning of the
    day, “end of month” payroll processing, the effect of TV advertising on a home
    shopping channel, or the effect of the Superbowl on a sports site. It is common
    for peak events to be an order of magnitude over normal. For example, suppose
    we are building a system that we expect will do 1 million transactions a day.
    We take orders around the clock, seven days a week. Peak orders might be in the
    morning from 9:30 A.M. to 12:00 noon and in the afternoon from 2:00 P.M. to 5:00
    P.M. The average order rate for this system is around 50,000 an hour, but possibly
    a peak hour could be 500,000 orders. If ordering and shipping are tightly coupled,
    the shipping system will need to be sized for 500,000 orders per hour. If ordering
    is loosely coupled to shipping, so that it can pass off orders into a queue without
    waiting for fulfillment, a shipping system sized for 50,000 orders per hour could
    handle the workload, although we would probably size it larger than that to pre-'
  merge: -1
