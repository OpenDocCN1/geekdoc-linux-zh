  md: '# A.2 Installing an Evaluation Linux System


    which runs from Windows and allows resizing of existing partitions. This is not
    open source but is fairly inexpensive for workstations, and it is likely that
    administrative staff in a Windows-based organization have this already. One alternative
    if your partition(s) is FAT32 is the Linux program “parted,” but this does not
    work to resize NTFS partitions.


    Once the dual-boot system is working, you will want to set up file from the Linux
    system to the Windows partition. Windows systems cannot read Linux partitions.
    Linux systems as a rule can read and write FAT and FAT32 and can read from but
    not write to NTFS partitions. For two-way communication, it is better if the Windows
    system has at least some partition as FAT32. Some Linux systems will mount the
    Windows partition automatically. If they do not, it is necessary to edit the /etc/fstab
    file with something like this, and ensure that appropriate permissions are granted:


    ```

    //dev/hdal  /mnt/xp ntfs

    ```


    # A.2.3 Running Linux on Windows


    Instead of booting one of Linux or Windows as needed, it is possible to run the
    one under the other. To run Linux (or at least UNIX) under Windows, we can use
    emulation or a virtual machine. Emulations include:


    +   - Cygwin (open source)

    - Microsoft Services for UNIX (SFU)

    - Commercial packages such as MKS


    Cygwin is the open source package that provides a UNIX-like set of utilities and
    APIs under Windows. This allows a program such as PostgreSQL to run under Windows.
    It is also popular with technical staff who are used to the UNIX command line
    and would like the features under Windows. SFU, which is functionally similar
    to Cygwin, is available as a no-download from Microsoft.


    People who need to switch between operating systems will use a virtual machine
    system, which allows the systems to run simultaneously without reboot. The leading
    such system is VMware. The workstation product is reasonably priced and very powerful,
    and I use it. It is an excellent tool for developers testing different versions
    of their products, for'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'example. VMware is available for Windows or Linux as the underlying operating
    system, and will then run the other as a guest (as well as other systems such
    as Novell). Microsoft also offers a similar product, Virtual PC.


    Some people are tempted to try VMware on Windows to support their first Linux
    installation. I do not recommend that. VMware supports operating systems; as I
    wrote, it does not support the latest Fedora or SuSE workstation versions. Setting
    up VMware is an art in itself. When completed, your system networks from the Linux
    or Windows sides, can read files both, and operates quickly in a full graphical
    environment. However, setup issues may occur that leave you in an incomplete situation,
    and debugging will involve learning and getting support from VMware (not Linux).
    VMware is an excellent choice for a lab environment where the first couple of
    Linux systems are set up.


    # A.2.4 Running Windows on Linux


    In this direction, the choice is emulation or a virtual machine. In addition to
    running Linux on Windows, VMware can be used to run Windows on Linux. For example,
    we could set up Windows XP, Windows NT4, and Windows ME systems on a single Linux
    box and test an application on them. The Windows systems will access installed
    printers, network cards, and so on.


    A common problem with Linux systems is the need to run some Windows applications
    that are not available on Linux—for example, Microsoft Office, the MacroMedia
    Director plug-in, and many games. To support this, emulation is required. Crossover
    Office, from CodeWeavers, lets you run Windows Office, Photoshop, Lotus Notes,
    Visio, and browser plug-ins on Windows (e.g., QuickTime, Microsoft Office Viewers,
    and Macromedia Director). You need to get specific versions of Crossover Office
    for the programs you want to run, and you license the programs themselves.


    Wine (for Windows Emulation) is the open source product that underlies Crossover
    Office (and is sponsored by it). Wine exposes the Windows APIs so that a program
    written for Windows can run on Linux. This is mostly aided by developers.


    It is possible to run Microsoft Windows drivers under Linux in order to access
    hardware that has only been released with Windows drivers, using drivers from
    Linuxxant.


    Another alternative to achieve the need of running Windows programs is using Citrix
    clients to access Windows programs on servers.'
