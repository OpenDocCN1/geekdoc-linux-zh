    # Why Open Source Is Cross-Platform


    Open code developers are able to develop cross-platform. The languages that are
    used for open source (C++, Perl, Java, PHP, Python) are all available on Linux,
    Windows, and other UNIX platforms, including the Mac. So are key elements of the
    development platform: shell, database, Web server, support tools. The most awkward
    area is GUI tools, and this is often the reason for surprising cross-platform
    limitations. There are three good GUI tools: Qt, wxWindows, and TCL. No one is
    the right choice across Linux, Mac OS and Windows when you consider performance,
    native support, and licensing. Qt is the only one for embedded systems, but dual
    licensed and wxWindows is fast and powerful but not native on the Mac, where it
    runs in X11 with an Aqua manager. TCL does not use native tools on any platform
    and is not very powerful. See Table 9.5.


    Open source developers are motivated to develop cross-platform. They favor Linux
    much than the general public but work in a mixed world. At OSCON 2003, which contained
    a broad set of open source users and developers, I observed a fairly even split
    among Linux, Mac, and Windows (30-30-40). Open source developers favor Linux even
    more, with hard core developers using Linux. But of course, in the general market,
    the most programmers address, the distribution is strongly Windows (3-3-94).


    The structure of open source projects allows for cross-platform development where
    there is a market. In a small closed code company, limited resources must be deployed
