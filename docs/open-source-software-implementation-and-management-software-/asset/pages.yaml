    # Managing Distributions and Packages


    The first choice for an organization to make is whether to purchase an “enterprise
    distribution” with support or to “roll their own” with a system. Many organizations
    may do both, depending on the environment. You can choose among:


    +   - Outsourcing distribution (Red Hat, Xian Red Carpet)

    - Roll your own but use a package distribution mechanism (Debian)

    - Outsource your custom package creation (Progeny Platform Systems)

    - Modifying a distribution to suit, and distribute it as you wish


    Today, when you run a Linux distribution, Mac OS X, or Windows, you can (and should)
    choose a software update system from the vendor that will distribute updates and
    patches automatically. Package formats RPM, used by Red Hat and SuSE, and DEB,
    used by Debian (and derivatives) and also optionally by Red Hat Fedora. The package
    formats are used with front-end commands for application. RPM is used with the
    front ends update and YUM, while DEB is usually used with APT.


