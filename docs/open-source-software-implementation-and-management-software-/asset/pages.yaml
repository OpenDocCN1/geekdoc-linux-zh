  md: '# 22 2.1 Analytical Framework


    In a commodity explanation, as a solution becomes mature it becomes more difficult
    to differentiate by innovation, and eventually all suppliers tend to the same
    low margins over cost of goods. In software, with distribution costs close to
    zero, the product price will tend to zero and the only money to be made will be
    in service and training.


    We have seen software become better and less expensive over time, but we have
    certainly not seen it tending toward zero in margin or price. This possibility
    has been resisted up to by something called “net-work effects” or “increasing
    returns,” but which we call “lock-in.” If there is an advantage to using the same
    product as other people, a market may go “winner takes all”; the winning product
    can change a substantial premium because possible switching to new technology
    can be made more difficult by locking customers to existing patterns of or or
    interfaces.


    The operating system and office suite markets are cases where vendors control
    and network effects predominate; another clear case of this is instant messaging.
    It is very difficult to switch off these systems. The Web market is largely a
    commodity/standards market, and the Web server market even so. Although vendors
    such as Netscape and Microsoft resisted this, you can change browsers or Web servers
    easily Mail by itself is a commodity market, but typical vendors extensions as
    calendaring and for management are not. Database is a commodity at the API level,
    such as using ODBC or JDBC, but the vendors have done as much to resist this by
    introducing attractive proprietary extensions.


    Vendors will be looking to increase differentiation and encourage customers to
    be locked in to a single product. Customers will be well advised to look for standards,
    either legislated or de facto, allowing them to “pick and choose” and switch easily.


    The effect of switching costs in Figure 2.1 is to lower the line of the new technology
    by the amount of the costs. This makes it harder to adopt the new technology against
    the old, as it appears effectively when those costs are considered. If switching
    costs are high, the new technology will have to be deployed into new uses until
    it is much better than the old, which could take years. The switching costs, although
    one time, create a situation where the vendor can earn a premium indefinitely.
    In Figure 2.2, the switching cost lowers the line of the new product, delaying
    its adoption.


    In the open source case'
