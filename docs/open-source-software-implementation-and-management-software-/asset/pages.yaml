    and physical components). There is no strict rule that should be exactly three
    tiers, or any other number. As specific examples, business components can call
    business components, and database procedures can be nested. These are application
    architecture choices. In particular, there is no need for logical components to
    be implemented as physical components communicating via containers, as in the
    EJB and COM+ architectures. This is actually very expensive in terms of performance
    in many situations and should be discouraged. The usual design is to run application
    components on the Web server to avoid remote calls.


