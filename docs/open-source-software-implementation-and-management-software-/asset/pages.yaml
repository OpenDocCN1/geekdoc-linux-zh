    # 12.2 Types of Costs


    We take into account several cost factors that weigh heavily, including fixed,
    off-budget, sunk, and switching costs. In a direct comparison of two new systems,
    where things are equal, open source software will be less expensive in almost
    every case. But often the comparison is in some sense a migration, where there
    will be a big advantage to the incumbent, likely Windows today. This is what most
    TCO studies comparing proprietary software against open source actually do. In
    a migration, assumptions favoring the incumbent product will increase staffing
    costs and dominate the software savings. There are even some incumbent advantages'
