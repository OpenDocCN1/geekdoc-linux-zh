  md: '# 10.7 Interacting with the Open Source Community


    In any case, a maintainer from a successful open source project has a project
    management background. Maintainers have managed code contributions; motivated
    and given credit; attracted/retained developers and other resources, mostly without
    using money; developed or adopted processes for code management and release. That
    is a good set of skills, even if the project you work on is directly relevant
    to you.


    # 10.7.2 Employee Agreements


    There are several issues where organizations generally do not have policies today,
    but may need to develop one. This may involve a review of relevant employment
    contracts. The following are some examples, but this is not an exhaustive list;
    there may be other issues.


    Some employees will want to be allowed to work on open source projects while on
    organization projects—for instance, by sharing utility code or returning enhancements
    to open source software. This is reasonable, but may conflict with current employment
    agreements. Others may wish to contribute to open source software on their own
    time. This is also reasonable, but many organizations have blanket policies prohibiting
    it. It is also the question of copyright ownership. Most open software projects,
    including Samba and Apache, do not allow retention of copyright by the contributing
    company. This again may conflict with current policies. Some employees may only
    be willing to work on open source, and your company will probably not be doing
    open source exclusively. This may require a special arrangement—for instance,
    they may have to work as contractors rather than employees.


    # 10.7.3 Repaying the Community


    Organizations that benefit from open source software often develop methods for
    paying the community. The simplest can allowing employees to work and contribute
    to the community, as well as serving as a reference and otherwise being a good
    citizen. There may be opportunities for sponsoring enhancements that are relevant
    to your organization''s use. By directing investment towards enhancements your
    organization needs, you may gain leverage in the direction of the product.


    In negotiating with open source developers, it may be helpful to bear in mind
    the motivation discussed in the previous chapter. Money is an element, but so
    is a measure of fame and an opportunity to work on something worthwhile. If your
    organization is able to offer a proposition that'
  merge: -1
