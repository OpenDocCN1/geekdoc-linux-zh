    # 11.4.5 Data Formats


    The problem of data marshalling, which is an issue for interoperability techniques,
    occurs at several levels. At the lowest level is the issue of character representation:
    encoding (Unicode), line endings (carriage return and/or line feed), and byte
    order (big or little endian). At the next level, we need a system for tagging
    field names, then for data typing, and then to manage linkages between fields
    to support hierarchical representations. Above this are semantic issues, such
    as agreement on the content and relationships of fields. Shared database stores
    many of these directly, but more complex relationships still need to be mapped
    to XML.'
