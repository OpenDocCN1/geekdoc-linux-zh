    # 3.3.2 Specific Product Reviews Will Not Favor Open Source


    Product reviews are generally conducted fairly and in a reproducible manner by
    an independent company, and in that sense are fair. There is no shortage of general
    information from reviewers and vendors indicating that open source in general
    and Linux are important upcoming trends. This book has already quoted several
    of these statements, and they continue to be published regularly. The views of
    companies such as Gartner and IDC have been very helpful in spreading the word
    in these areas to organizations that might have been uncertain or unnecessarily
    conservative.


    However, specific reviews comparing an open source product to a closed code competitor
    are another matter. This type of review is generally commissioned by one party,
    and that party gets to select aspects of the review that are not explicitly stated
    but bear heavily on the results. The standard practice in the industry, and generally
    leads to a “rough justice" over time as different vendors sponsor reviews and
    comparisons at times and issues of their choosing.


    In the case of open source, the same process leads to a systematic bias against
    the open source product, because that product invariably has less money (and spends
    on marketing). To look at this in more detail, there are four ways that specific
    product reviews can be misleading. The control-


    +   * The package of products under consideration

    * The timing of the review against release dates

    * The competitors to compare against and the versions of the product to compare

    * The behavior being evaluated (e.g., performance, stability, ease of use)'
