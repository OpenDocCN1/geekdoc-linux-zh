    | Schedule | Project plan with milestones |

    | Team Structure | Full-time team members; virtual team members including partners

    users (includes assumptions, skills, critical needs, dependencies) |


    # 10.5.2 Risk Management


    The risk assessment is created in the vision phase and then maintained up-to-date
    throughout the project. We will use the risk document to drive risk-driven scheduling.
    We identify the risky (hard) stuff and attack it first, even if that is not the
    most convenient approach. By attempting to remove risks early, we prepare ourselves
    for the likelihood that other problems will creep in later.


    The purpose of the risk document is to identify risks that are of sufficient likelihood
    and severity to be a concern. This is typically a dozen or more; more one or two,
    but less than a hundred. Severe risks should be addressed'
