- img_proc: true
  md: '# Linux Desktop Share


    Linux has come a long way in power and ease of use, but it is still not widely
    used on the desktop. Linux has now overtaken since 1994 the Mac in sales to become
    the #2 operating system on the desktop. IDC reports that Linux grew from 2.8 percent
    in 2002 to 3.2 percent in 2003, while the Mac remained at 3 percent. This is significant,
    but is still only a small share. Windows has a 94 percent share. IDC forecasts
    growth to 6 percent for Linux in 2007, but will will be over 90 percent.


    These figures probably undercut Linux presence on desktops now and in the future.
    Linux is uninterrupted, because it is very often not purchased. Windows shifts
    on essentially every new PC, and where users are replacing Windows with Linux
    they are probably not getting measured effectively. It is also used in connected
    niches, some of which are very high growth, as some new Asian nations involving
    millions of desktops. The major computer companies—IBM, HP, and Sun—all have programs
    to encourage Linux desktop adoption now, and some major corporate announcements
    have been made. Linux exceeded expectations in the past, and may grow on the desktop
    much faster than currently predicted.


    # Limitations to Desktop Linux Adoption


    Whatever Linux growth may be, in the next three or four years we know that will
    continue to be an order of magnitude more Windows than Linux users. This has an
    effect on the availability of hardware, applications, and support services. Each
    of these limits the possibilities of Linux desktop deployment significantly.


    # Hardware


    Approximately half of corporate personal computers are now notebooks rather than
    desktops. It is that group is least likely to adopt Linux quickly. Setting up
    Linux on a notebook system is still likely to need some custom work, and there
    are hardware limitations, including wireless support, such as Intel Centrino and
    most 802.11g cards; some graphics cards and advanced power management. Notebook
    users may have to accept some loss of functionality to run Linux. Notebook users
    are typically professional users, and are not likely to accept compromises unless
    they are developers or committed to open source for some other reason.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Graphical Desktops


    # Applications


    Given the disparity in installation share, it is perhaps surprising that there
    are many applications available for Linux desktops, and there are generally several
    good choices in the major categories. Smaller niche applications are more of a
    problem. There are many thousands of applications in the Windows “ecosystem”,
    usually written to the Windows tools and interfaces, often addressing specific
    vertical industries.


    In a migration situation, any specific application may be a “must-have” for a
    group of users Microsoft Office is just the biggest, best-known example of this.
    Section 8.6.1 has some tactics for this situation, but often this will necessitate
    Windows on some systems.


    # Support Services


    There are thousands of corporate employees, and many more people in outsourced
    services, working with users of Windows desktops in support and training roles.
    Some of these have qualifications as MCES, others do not; but most have a significant
    investment in the skills needed to support Windows systems and the common applications
    deployed on them. There is little incentive for these people to learn their jobs
    using a new technology, and in some areas the skills to support activities such
    as solving issues with Linux systems that will not boot or training users in OpenOffice
    may not be available yet. It will be several years until this situation is resolved
    entirely.


    # Graphical Desktops


    It is possible to start and run Linux in a character mode, but this is reserved
    for installation and debugging situations nowadays. Linux is usually installed
    to start in a graphical mode, running a window system, and a desktop system will
    usually run a desktop manager with a set of integrated utilities. If you want
    to work in the shell using a command line and typing commands, as you probably
    did sometimes in Windows, you can open a terminal. Linux users use the command
    line more than Windows users, partly because it is more powerful.


    Essentially all Linux users use the X Windows (X11) as the graphical user interface
    (GUI)—generally XFree86, which is the most used port of X11 on Intel. This is
    the underlying code of Linux graphical interface systems. Exceptions include some
    servers that may not need a GUI and run in character mode, and some embedded systems
    that use other GUI systems not based on X11 to get better performance, such as
    Qtopia, which is used on the Sharp Zaurus.'
  merge: -1
