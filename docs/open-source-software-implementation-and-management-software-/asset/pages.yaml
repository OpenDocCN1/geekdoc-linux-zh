    more share, and open source databases are beginning to be a possible choice. Because
    database pricing is per processor, users tend to go for big machines with fast
    processors in this range. A cheaper, say $150K, box would cost as much as the
    big one for database, so price/performance goes off.


    The obvious choice in this category is Oracle, with most share and references.
