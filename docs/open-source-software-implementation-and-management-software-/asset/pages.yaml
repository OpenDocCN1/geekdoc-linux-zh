    includes wikis, Weblogs, Real Simple Syndication (RSS), and other software for
    building and connecting communities.


    # 5.4.1 Wiki


    The wiki (see http://wiki.org/wiki.cgi?WelcomeVisitors), first created in 1995
    by Ward Cunningham, allows users to read, create, and edit Web pages on a site
    using any browser. This includes not only content, but also organization as new
    pages and links. This is one of the simplest forms of content publishing. Any
    user can usually participate. There are thousands of wikis, built using dozens
    of different software packages (wiki engines). A master list of wikis is at http://c2.com/cgi/wikiEngines.


    Good implementations among many available in different languages include Qwiki
    and the powerful Twiki, aimed at corporate intranets (Perl); TikiWiki and MediaWiki
    (PHP); Zwiki (Python); SnipSnap; QuickWiki (Java). Originally, security and workflow
    were simple or non-existent, but many systems support these needs quite well,
    so this'
