    # 8.3 Web Browsers


    When developing applications, we do not usually want to require a particular browser
    and operating system. In many cases, we cannot know which browser an application
    user will be using. Even if we can determine this, in a customer or business situation,
    it is probably an unreasonable restriction to impose. So when developing, we will
    usually plan to support a choice of browsers.


    In principle, we know that if too many people write to a specific browser, that
    could destroy one of the best features of the Web, its independence from particular
    hardware and software platforms. Generally, the best plan is to write for several
    browsers. Of course, we do not want to much of a testing burden. Table 8.1 has
    some good choices for browsers available on different platforms. We should probably
    plan to test on Mozilla, IE, and one other, probably Konqueror or Opera.


