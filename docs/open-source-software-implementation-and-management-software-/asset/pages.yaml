  md: '# 13


    # Licensing


    Software licensing has always been a part of the process of managing systems.
    The issues around open source licensing are not really different from licensing
    in general, but they seem to receive more attention at the moment.


    Many professionals find legal issues and, in particular, licensing, one of their
    least favorite parts of the job. However, it is essential for all of us to know
    the basics of licensing. We will cover the basics in a simple way here. If your
    needs are more complex, you will require a lawyer.


    If open source licensing documents seem long and difficult to read, you are probably
    just not to reading legal documents. Typical closed licensing agreements such
    as those from Microsoft or Oracle are no better. They are usually longer and more
    difficult, and very often restrictive.


    # 13.1 Types of Licenses


    Open source licenses can be divided into two groups: the reciprocal or "free"
    licenses, of which the GNU General Public License (GPL) is best known, and the
    nonreciprocal or "open" licenses, such as the BSD and Apache licenses.


    Reciprocal licenses contain a provision that requires on licensing the code must
    be open source. This is reciprocal in the sense that if a distributor receives
    the source code, it passes on to others. For example, Linux uses the GPL. If you
    choose to distribute an operating system based on Linux with some changes you
    have contributed, you must distribute the source code to that system.


    Nonreciprocal licenses do not contain a relicensing provision, so they allow derivative
    works from open source code to revert to closed. This is nonreciprocal in the
    sense that a distributor can receive source code but may not'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'necessarily pass it on. So, for example, Apple uses FreeBSD code as part of
    Mac OS X without needing to distribute the Mac OS source code.


    # 13.1.1 Relensing Only Matters If You Distribute


    Some people use the term vinal for reciprocal. The implication is that handling
    licenses is dangerous, as Microsoft sometimes suggests. It is true that Microsoft
    needs to be careful when using products with the GPL. Microsoft is a distributor
    of products, such as compilers and operating systems, which could also apply to
    derivatives. This is a risk it can handle: Microsoft actually distributes a product
    (Microsoft Services for UNIX) that includes components licensed under the GPL.
    This risk only applies to organizations that are distributing software that extends
    the GPL-licensed product. Software companies that distribute code partly on GPL-licensed
    products need to establish guidelines on their use.


    # 13.1.2 Reciprocal Licenses Are Similar to Commercial Licenses


    Reciprocal licenses are quite similar to commercial (closed source) licenses,
    which commonly contain terms that restrict relicensing and distribution of information.
    A common commercial restriction prevents you from licensing the software or derivative
    works. The GPL has provisions that affect your subsequent licensing of derivative
    works, which is less restrictive than preventing relicensing. Commercial licenses
    normally require you to agree not to disclose proprietary information that you
    acquired under the license to others. This may include elements of source code
    (such as APIs) and other information such as performance data. The GPL requires
    that you disclose the source code you acquired, and any you you have added, to
    others.


    # 13.2 Licenses in Use


    There are many licenses in use today, but only a few need to be considered by
    most organizations. The Freshmart site lists about 50 categories of licenses,
    some of which are groups of licenses, but only about 20 are used by at least 100
    projects. Figure 13.1 shows the distribution of licenses as reported on Freshmart.
    Over two-thirds use the GPL, and about one-sixth use one of the LGPL, BSD, Apache,
    Mozilla, or MIT licenses. One of these five licenses should suffice for most purposes.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 13.2 Licenses in Use


    ![](img/5e95216d5535a91da78910a98b306b74_321_0.png)


    # 13.2.1 Reciprocal Licenses


    The GPL is the original "free software" license. It is used by Linux and many
    other core tools and will be used by everyone at some time. The GPL is also an
    important piece of work in its own right, and a source of controversy in many
    quarters, so everyone should read it.


    The Mozilla Public License is similar to the GPL but with clearer terms in requiring
    future use.


    # 13.2.2 Nonreciprocal Licenses


    The other licenses (LGPL, BSD, Apache, and MIT) are nonreciprocal. The Lesser
    General Public License (LGPL) is a nonreciprocal version of the GPL intended for
    certain libraries. There are two forms of the BSD license. The new form admits
    an advertising clause in the license that was officially rescinded when the Director
    of the Office of Technology Licensing of the University of California stated on
    July 22, 1999 that clause 3 was "here deleted in its entirety." The new BSD license
    is thus equivalent to the MIT license, except for a no-endorsement final clause.
    The MIT license is best known for its use in the X Windows System. The Apache
    license is very similar.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 13.3 Mixing Open and Closed Code


    The nonreciprocal licenses are less restrictive than the GPL on distributors.
    Subsequent users can use, modify, and redistribute the code without distributing
    their source code. This lack of restriction for the distributor removes the rights
    of users downstream to see that code. The restriction that the GPL places on distributors
    has the effect of later users retaining their rights to view and modify code.


    Some companies take open source software, add little or nothing, and resell the
    result as a closed code solution. Reciprocal licenses address this by ensuring
    that companies cannot extend code without giving it back for others to offer.
    Of course, these companies may add by improving support, documentation, bundling
    the product for a particular market, or developing a complementary product. They
    just gain a proprietary advantage from changes to the code, since these enhancements
    must go back to the community.


    # 13.2.3 Which License to Use


    It is strongly recommended that if you are distributing your own open source product
    you adopt one of these licenses without alteration:


    +   - GNU General Public License

    - Mozilla Public License

    - BSD, Apache, or MIT license

    - GNU Lesser General Public License


    The alternative is to hire an attorney who specializes in these issues to develop
    a custom license, as large companies as IBM do.


    The GPL, Mozilla Public License, and BSD license are attached as Appendix D. Machine-readable
    copies of these and other licenses can be obtained at http://www.opensource.org/licenses.


    # 13.3 Mixing Open and Closed Code


    It is quite possible to use closed code and some open open source software together.
    This is common today and is likely to be the way most systems are built in the
    future.'
  merge: -1
  pgno: 322
