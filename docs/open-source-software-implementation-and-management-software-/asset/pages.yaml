    # 6.5.1 Consumer Linux Choices


    For consumers, Linux distributions to consider, in addition to versions of Red
    Hat and SuSE, includes Lindows and Xandros, formerly Corel Linux, is based on
    Debian with the KDE desktop. It installs easily and offers an automatic dual-boot
    version on a machine with Windows installed. Lindows, also Debian, is available
