  md: '# 12.4 Summary


    These days, many CIOs want to commoditize core computing. By abstracting the applications
    they are running from the infrastructure layer, they can allow the business more
    flexibility. Systems that are more flexible can select solutions for their business
    impact without being constrained by the technology they have deployed. They can
    scale systems up or down and distribute or outsource functions. They can share
    components and infrastructure between systems. This also lowers staffs by allowing
    a more consistent approach to infrastructure and sharing components and tools.
    Cost is also lowered by the ability to negotiate for components from multiple
    vendors and to escape the premium vendors obtain from lock-in.


    Many organizations have a proliferation of staff doing infrastructure and desktop
    maintenance and want to get under control. By stripping costs out of the infrastructure
    and desktop, the money will be to support the business. The industry structure
    shifting shown in Figure 12.7 indicates the direction we are going. The emphasis
    is shifting further "up the stack."


    Systems employing open source software will be less expensive than alternatives.
    This is clear in any straightforward comparison. In some circumstances, as infrastructure,
    where software costs are small compared with staffing, this difference may not
    be large in TCO measurements. In situations where there are many users running
    desktop software or server


