  md: '# 8.4 The Office Suite


    In considering the office suite, we will consider the word processing, spreadsheet,
    and presentation programs, although the open source suites, such as Microsoft,
    include other programs, such as drawing and image management. In terms of Microsoft
    Office, then, we are looking at replacements for Word, Excel, and PowerPoint.
    We will discuss database front-end and mail front-end programs as Access and Outlook
    elsewhere under separate headings. There are excellent open source equivalents
    of these and other Office programs, such as drawing, organizational charts, spell
    checking, and so on, but the core components are usually seen as three.


    There are alternative open source office suites:


    +   - OpenOffice

    - KOffice

    - Gnome Office


    KOffice and Gnome Office contain some good products, and many individuals may
    find them to be exactly what they need, particularly when working with other programs
    from those desktops (KDE and Gnome). OpenOffice is clearly the strongest. It has
    three very powerful programs, and it is the best office suite for working with
    Microsoft formats. OpenOffice has a great deal of momentum, with millions of users,
    far more than the others. OpenOffice has been adopted as part of the standard
    desktops of Red, SuSE, Xim, Sun, and UserLinux. OpenOffice works well on Windows
    and Linux. Anyone recommending an office suite as a standard to recommend OpenOffice.
    An alternative might not be using a suite, but allowing individual programs to
    be selected. In my view there are three practical methods that can combine within
    a population to approach the office suite:


    +   - Install OpenOffice as the default standard desktop on Linux and Windows.

    - Leave Microsoft Office on desktops of satisfied users, and allow users to specify
    Microsoft Office on new installs if they need it for a reason.'
