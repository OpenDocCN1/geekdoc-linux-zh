  md: '# 7.1 Infrastructure Services


    implementation of the Windows Networking facility called Server Message Block
    (SMB). The name Samba is a play on SMB. The protocol traces back to the period
    when IBM, 3Com, and Microsoft were working together; it is also used in OS/2;
    and is also known as the Internet File System (CIFS).


    We may be able to arrange file sharing within (inside a firewall) by implementing
    one of a few simple approaches. If information is either private or enterprise
    wide (public), then we don''t need a directory system. We can create and share
    public shares on file sharing systems and teach users to use information for sharing
    to those shares. On Novell systems, these were usually set up as virtual drives.
    Once we get beyond public/private into allowing groups or individuals to access
    specific information, we will probably need a directory of some sort, although
    not necessarily LDAP. Using Samba, at least version 3, the choices are:


    +   - Use Samba can act as a client to NT server for authentication or work like
    an NT primary domain server for NT4 replacement, in which case users are migrated
    from the NT4 server to Samba.


    +   - Use Active Directory, Samba can act as a client for authentication to a
    Windows 2000/2003 Server running Active Directory (but not as a server).


    +   - Set up OpenLDAP or another LDAP server and use that as the directory for
    file sharing.


    There are several dependent components for Samba. Samba shares printers using
    the local printing facility (generally CUPS today on Linux). It also relies on
    WINS for naming services de facto. Originally, SMB was based on NetBIOS, later
    on NetBIOS over TCP/IP (with the NetBEUI stack removed). It can now run without
    NetBIOS, which many organizations require. To see and work with Samba files—for
    instance, to create file shares or access them—you will need a GUI tool such as
    Nautilus or Conqueror that supports SMB.


    # 7.1.2 Directory Services


    OpenLDAP is based on the original LDAP server, written at the University of Michigan.
    It takes a little more to set up the commercial alter-'
