  md: '# 7.3 Database Servers


    Postgres supports stored procedures, triggers, and views, which MyMySQL 4.1 does
    not. This is a strong argument for Postgres for experienced database developers,
    who are used to having these functions.


    Postgres is a good database server with a strong following in the open community,
    but in business it is perceived as lagging MySQL in adoption, marketing, and support
    arrangements offered by Great Bridge and Red Hat (the Red Hat database was based
    on Postgres) did not make much headway.


    # MySQL


    The MySQL database server is robust, fast, and a very good cross-platform product
    on clients, including Windows and the Mac and the variety of UNIX servers. It
    has a small footprint and good management tools. The product is distributed by
    the Swedish company, MySQL AB. MySQL is used much more than PostgreSQL the company
    estimates about 4M users worldwide. The product has momentum, with considerable
    enhancement happening, and last year'' acquisition of MaxDB will likely lead to
    more enterprise-scale features.


    MySQL is dual-licensed, meaning it is available under a commercial license or
    the GPL. Because linking with the GPL-based libraries requires your code to go
    GPL, commercial developers who are not open source will want to pay for the commercial
    license. Also, the MySQL company asks commercial users to buy an unlimited commercial
    license. That commercial license is $500 for the product, including InnoDB, which
    is transactional—that is, unlimited processes and users. MySQL is powerful and
    inexpensive for commercial users and it open for government, education, and personal
    users.


    Historically, MySQL has missed some SQL standard features that many users regard
    as essential. This was originally a start of design decisions, and the product
    was intended to be fast above all. There is now a published plan to catch up on
    these, which is in progress. Transactions (ACID) were released in Version 4.0,
    which the previously distinct InnoDB engine was incorporated in the main product.
    Subqueries are in Version 4.1, which is close to production as I write. Stored
    procedures will be in Version 5.0 and triggers in 5.1.


    MySQL is powerful enough for most purposes and easy to use. It is widely used
    in business organizations, including large systems such as Sabre. It powers the
    OSDN sites, including Slashdot, Freshmeat, and SourceForge, which is used by Google
    and Yahoo!'
