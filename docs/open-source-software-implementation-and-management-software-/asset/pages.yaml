    # There Have Been Past Changes of Leadership


    Microsoft''s dominance of office suites was no foregone conclusion. It was not
    the leader in any office category originally, or for many years. The first personal
    computers in business were the CP/M-based machines of the 1970s. Top-selling programs
    were WordStar, VisiCalc, and dBASE II, offering processing, spreadsheet, and database
    functions, respectively. On MS-DOS, WordStar and VisiCalc were replaced by WordPerfect
    and Lotus 1-2-3, respectively. They were better products.


    Microsoft''s products, Word and Multiplan, mediocre sellers. Microsoft products
    did better on the Apple. With the introduction of Windows 3.1, the Microsoft products
    (now Excel, Word, and the purchased PowerPoint) proved technically superior and
    pulled into the lead. Office rose to its high share on the basis of steadily improving
    performance and falling prices over a period of years, from the mid-1980s to the
    mid-1990s.


    So the standard office programs changed a couple of times in the past. When there
    were clear technical differences, new programs gained dominance. These changes
    have been very painful, in use and in for even inside Microsoft Office. Spreadsheet
    moves from VisiCalc to Lotus 1-2-3 to Microsoft Office 95 to Office 97 replaced
    all of the program''s macro languages (WordBasic, Excel VBA, AccessBASIC) with
    VBA 5 and changed all the file storage formats, as had the previous move from
    Office 4.2 to Office. But the products had more room for improvement, and many
    of the early users were more technology-oriented early adopters, often single-product
    users. Expectations for support were lower, and there was a base of many users
    to spread to. It going to be more difficult today to find a large group of office
    suite users with any desire to switch products.


