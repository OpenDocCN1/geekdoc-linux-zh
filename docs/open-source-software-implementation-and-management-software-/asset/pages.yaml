  md: '# 2.1 Analytical Framework


    If certain assumptions hold, we can expect that the customer will switch

    when the newer technology crosses the dotted line representing the cus-

    er''s. The two important assumptions in this model are:


    +   - The new technologies must have some advantage in another dim-\sion, that
    they are significantly less expensive or less difficult to

    use the old.

    - The switching costs must be fairly low, as they are when substituting

    a part in product design.


    With disks, the drive is lighter and cheaper and switching costs

    are low. In this case, Figure 2.1 suggests that the customer represented by the

    dotted line will switch from A to B at T2 and from B to C at T3.


    There are simplifications in this graph. The technology lines are parallel,

    meaning that the technologies are improving at the same rate. Often, the

    new technology starts to improve at a better rate than the old. Also, the cus-

    er requirement is generally not a single line but a distribution.


    Also, note that today disruptive innovation becomes tomorrow’s

    incumbent, where it may be attacked later.


    # Open Source as Disruptive Innovation


    Much open software qualifies as this sort of “disruptive innovation"

    at this stage. Open source systems are usually less expensive than the alter-

    ative and easier to use. In some cases, open source systems are a little\more
    difficult to use, but this appears to be related to their immaturity and

    novalty rather than anything fundamental.


    Often today, although not always, open source is following a closed code

    technology, catching up in performance or scale while offering lower price\and
    other advantages. Performance and price/performance in the computer

    industry are always improving faster than the typical customer can absorb,

    but this is particularly true in the recessionary atmosphere of today. In other

    words, the customer is prepared to see many systems as “good enough.”


    # Lock-In


    From the customer’s view, Figure 2.1 represents “commodity.” The

    customer has limited new needs and is ready to substitute less expensive

    products as they improve. Improvements along the line are incorrect

    attempts by vendors to avoid this commodity trap.'
