    # # Infrastructure Software


    In this category, we will include the operating system and any essential tools
    for networking and system management. There is a variety of open source administration
    tools available. Windows includes directory, file, and print services; simple
    routing; and a web server, we will count them in also. In Windows environments,
    firewall and proxy services (ISA) and mail (Exchange) are additional products,
    and we will factor into the costs since organizations generally need those services.
    There is a simple mail server included with Windows Server, but this is not used
    for enterprise.


    The majority of Windows customers do not use the more expensive server products
