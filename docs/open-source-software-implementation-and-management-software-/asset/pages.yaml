    Estimates on the number of open source developers vary, but cluster around a million.
    Most of them work (usually most of the time in closed code development). So we
    are talking about the same people.


    This is partly because what they have in common is success. For example, great
    open source and great open source projects usually have great developers in, and
    other projects generally do not. Certainly in closed software companies, these
    three methods (group team, product team, individual) all have their counterparts.


    In general, individuals stay longer with open source projects, often transitioning
    to some sort of consulting or honorary role but not leaving completely. Individuals
    do not seem to last as long as closed code software, tending to move on to other
    projects. Anders Heljberg has been long Delphi, C#, and moved on again, while
    Guido Van Rossum is still working on Python (among other things) and Larry Wall
    on Perl. Dave Cutler left the Windows'
