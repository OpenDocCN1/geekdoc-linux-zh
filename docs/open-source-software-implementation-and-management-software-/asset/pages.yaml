- img_proc: true
  md: '# 13.6 Summary


    does not copy the expression closely, and has no copyright or trademark infringements.
    There were major lawsuits over “look and feel” between Apple and Microsoft over
    Windows’ similarity to the Macintosh, and between Borland and Lotus over Quattro
    Pro’s similarity to Lotus 1-2-3, but they were resolved.


    The software issue is another area, and there may be grounds for long-term concern
    here. Bill Gates has said that patents are interpreted now in ways that would
    have made software development as we know it impossible in the Past. In addition,
    legislation as the Digital Millennium Copyright Act (DMCA) and proposals regarding
    Digital Rights Management (DRM) threaten to extend restrictions further. These
    issues are complex and cannot be covered useless here. I suggest referring to
    Lawrence Less’s books, particularly *Free Culture* and *The Future of Ideas*;
    searching the Electronic Freedom Foundation, Free Software, and Open Source sites
    for the software patent issue and DMCA; and visiting the Creative Commons site
    for other information and activities.


    # 13.6 Summary


    There are legal issues, as with open source software, as there are with closed
    code. There are risks, as there with all business decisions. Companies can breach
    contracts, go bankrupt, and so on, as they always could. Support arrangements
    need to be specified and contracted for, as they always do.


    There is little in open source that is different from principle closed code. For
    example, a company such as MySQL will offer either a commercial license or a GPL
    license for the same code. Clearly, support arrangements, concerns about provenance,
    and many other issues are the same whichever you choose.


    Open source software is always voluntary. Developers of software can choose the
    licensing model for their work, and adopters of software can choose products from
    the many licensing models available. It is one more choice we can consider in
    either case.'
