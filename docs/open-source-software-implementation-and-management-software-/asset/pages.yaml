  md: '# 7.4 Mail Servers


    talk about grids. Microsoft will emphasize price/performance and ease of management.
    Microsoft also pushes its extensions, such as DTS and Analytics, Web-based access,
    and XML everything. IBM in particular goes for integration; DB2 is usually sold
    on IBM platforms along with WebSphere.


    Oracle and IBM run their UNIX benchmarks on the Tuxedo application server. They
    use this platform because it is much faster and less expensive than their standard
    application servers. However, Tuxedo is an old system that is difficult to develop
    for, and it is almost never used for real business databases. When IBM and Oracle
    are selling systems to business customers, they recommend IBM WebSphere and Oracle
    Application Server, respectively.


    When benchmarking, Oracle always looks at large databases and compares performance.
    Microsoft has some large performance numbers, but prefers to look at small to
    medium databases and compare price/performance. Oracle runs its mid-market benchmark
    on the same box as Microsoft and gets a slightly better result. It is not going
    to do that on smaller boxes, where the cost of the database dominates.


    # 7.4 Mail Servers


    In the UNIX and open source world, mail servers are split between message agents
    (MTA), which are senders, and receivers/message stores.


    Mail is usually sent via the SMTP protocol and accessed with the POP3 or IMAP
    protocol. This works about the same with closed code mail servers such as Exchange,
    but both sending and receiving programs are called Exchange (or Groupwise or Notes).


    We have mentioned Sendmail, the venerable program that may be the oldest open
    source program in widespread use. After paying it due respect, it is time to admit
    that Sendmail is an old program and may not be the best mail server to consider
    today. It has a reputation for being difficult to configure and a history of security
    problems. The consensus these days is that you should choose Postfix instead of
    Exim and Qmail, but we will look at Postfix here.


    Postfix is fast, scales well, and is reasonably self-evident to configure. It
    can use different formats for the message store (Maildir or Mbox). We usually
    prefer the Maildir format, which stores each message in a single file. This makes
    message processing with external tools much simpler.'
