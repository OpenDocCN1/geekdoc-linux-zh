  md: '# A.2 Installing an Evaluation Linux System


    drive running Windows XP or Windows 2000 Professional. Then we can set it up as
    dual boot so it can be started as either a Windows or a Linux system. We do this
    by partitioning the hard drive as half Windows, half Linux using Partition Manager,
    and then installing from a CD-based copy of Linux with all software. On such a
    system we can learn and test all software mentioned in this book, and yet continue
    to run Windows and any software that we need requires it.


    Many organizations already have some equipment and space set aside for this type
    of activity, and the only cost involved will be the time to set up the systems
    and evaluate them. Such a project involves a few days to a weeks of staff, and
    would be encompassed during downtime from other projects. If space and equipment
    are dedicated over some months, and training is conducted and analysis work performed
    to support migrations, then we will need budget for a significant project.


    # A.2 Installing an Evaluation Linux System


    Most evaluating Linux will want to put their hands on a Linux system and get a
    feel for how it compares to what they are used to. As with any system, it is more
    difficult to install a system correctly than to use it. Installation is a place
    where potential users can get frustrated or even give up before getting a system
    to work. The following text we will try to steer you to the right machine and
    Linux distribution to make installation go.


    The installation problem occurs with Windows; when I worked for Microsoft, I went
    into retail stores on occasions such as Christmas and Windows launches to meet
    the public. My favorite part of this was meeting people who had attempted to install
    a new version of Windows for themselves and got stuck. However, with Windows you
    can always choose to buy a new computer that is set up correctly, and that option
    is still with Linux.


    If you don''t have the time to install Linux, you can just run it from a live
    CD using Knoppix or another distribution that loads that way. This is a great
    method for initial evaluation and is also useful for experienced users who are
    borrowing or repairing a machine.


    Most systems can run Linux, but not all systems are easy to install. It is common
    for a new user to spend a few days setting up information to solve problems such
    as listed in Table A.1. If our goal is to spend a week learning how to manage
    Apache and Samba and review the operation of OpenOffice, Evolution, and KDE, it
    is worth thinking about'
