    Linux, starting from around 1992 and Apache, starting around 1995, led by Brian
    Behrendorf.


    Some open source software is built by tightly structured teams that are modeled
    in a way to conventional software development organizations. Examples include
    Gnome and MySQL. Some open source software was built by conventional software
    companies, which have converted the product to open source. Examples include OpenOffice,
    Mozilla, Eclipse, and Firebird SQL. These organizations have changed more or less
    have gradually retained elements of their original structure.


    Some open source was built by individuals working alone, but is not maintained
    by a loose team. Examples, which date back to the early open source still in use,
    include Sendmail, GNU Emacs and C, Samba, and Perl. Since the open source model
    requires some code that works and some belief that a solution has potential, it
    generally begins this way. Apache and BSD started from an existing code base rather
    than an individual''s work, but Linux and GNU clearly began with an individual,
    some new ideas.


    # # 9.1.1 Open Source Compared with Closed Code


    If we compare successful open source development to the successful development
