  md: '# 5.3 Email


    any other modern directory software is being used, because they can optionally
    support many different activities. Fortunately, from a migration perspective,
    most organizations seem to do only what they need to.


    # 5.2.1 Migration and Interoperability


    Unfortunately, for many organizations interoperability will be the hardest part
    of the problem, as usual. There are tools to migrate directory content on a one-shot
    basis, and it is not especially difficult to get or build a tool to replicate
    directory information from a master directory to a copy, as you may do in some
    cases when synchronizing Samba to a Windows environment.


    In cases, it may be necessary to have two or more directories, which are both
    masters (e.g., Active Directory and Open LDAP), and a process for synchronizing
    them. This is unattractive, whatever you call it, really means adding a third
    directory to the mix, but there are several products that support this if it must
    be done. Many large organizations have to do this as a consequence of acquisitions
    or legacy systems.


    # 5.3 Email


    Email is the most common use of Linux servers, after security (firewall and intrusion
    detection) and Web serving. A new Linux installation with email is easy to set
    up. This is not surprising, since email has been a part of UNIX since the earliest
    distributions. Every Linux system can be configured as an email server and/or
    client, with several options available for each. These Linux mail choices are
    the same in concept, but are also actually the same programs as the mail choices
    on other UNIX systems.


    # 5.3.1 UNIX Mail Systems


    Open source servers, such as Sendmail, Postfix, and Exim, and clients, such as
    Oak, Pine, and Eudora, have long been available on Solaris, AIX, and other UNIX
    systems. Commercial UNIX mail servers, such as HP OpenMail, now sold through licensees
    such as Samsung Contact, also run on Linux.


    That is not to say that there have not been recent improvements on Linux, as Evolution,
    a new mail client unique to Linux, and Horde, a Web-based mail server.'
  merge: -1
