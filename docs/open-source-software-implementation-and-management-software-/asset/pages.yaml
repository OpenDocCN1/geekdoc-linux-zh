    is a trend to more types of outsourcing, so that teams are more virtual and probably
    have little in common except the specific project. Project hires are more common,
    so transparency of work and rapid testing are more critical. Teams must work to
    industry-wide standards, because there is no time or system to create project-specific
    ones. Much more in the past, we are now working with people outside our immediate
    attention, including customers, competitors, industry bodies, standards bodies,
    and the open source community.


    It is useful to find ways of extending the team to bring in extra resources while
    maintaining coordination of efforts. Here, the work of the open source community
    can be directly applied to corporate development. Open source practices have demonstrated
