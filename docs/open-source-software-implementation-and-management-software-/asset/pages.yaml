  md: '# Preface


    Open source software is now under serious consideration in many organizations.
    The success of several open source products, particularly Apache and Linux, in
    the enterprise has come surprisingly quickly, given that they were not commercially
    available ten years ago. It is important for managers responsible for adopting
    technology to be fully aware of the issues that open source represents to their
    organizations.


    A set of technologies is nothing new to the information technology professional,
    of course. There are always new technologies and business structures, and the
    steps we take to evaluate and adopt them are not so different. Each new set of
    innovations can also bring new kinds of challenges. Open source offers, in addition
    to a very rich set of technologies with long histories, a set of new ways to look
    at certain problems. Issues that are new include:


    +   - A variety of new licensing options, and claims from some quarters that of
    these introduce new business risks

    - Opportunities to deal with the loosely structured community that creates open
    source, from selecting distributions and buying products to hiring and retaining
    staff

    - The possibility that open source software is built and maintained in a different
    way, and the implications this has for our organizations


    The biggest challenge we all face at this time is the difficult climate our industry
    is in. This is a very tight time for spending, and every technology decision needs
    to be justified by carefully analyzing costs and risks. Fortunately, open source
    may be able to help us here, and this book will stick'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'closely to the areas where we can achieve a clear and reasonably rapid return
    on investment.


    # # Intended Audience for This Book


    This book is written for professional managers and implementers of information
    technology, who are not currently experts in open source software, but who will,
    the next year or so, evaluate it and then, in many cases, adopt the technologies,
    tools, and practices for themselves and their teams.


    The book is aimed, in a sense, at generalists. That is partly because open source
    software is a set of disruptive technologies rather than in line with what is
    in place. When a set of technologies is mature, we often react to these in specialized,
    rigid ways. As a new set of technologies is introduced, they often combine differently.
    The Web, for instance, changed the boundaries of what many people do. Also, with
    new ideas, it is often necessary to do everything building the business case by
    doing hands-onexperimentation. With each component, we will look at the business
    case, at the technology from an overview, and at the way it works to install and
    use.


    This is a self-teaching guide to the issues faced in transitioning to this new
    set of technologies. The issues range from business and social concerns through
    technology and architecture to cookbook-style details. The book should:


    +   - Convince you that there are roles for open source software in your organization


    +   - Place open source development in the context of software history


    +   - Enumerate the various scenarios involving open source that are more (or
    less) appropriate for most organizations over the next couple of years


    +   - Give you enough examples and successful references for the constituents
    so you feel comfortable entering a process of selecting and using them


    +   - Contrast and compare open source products among themselves and with products
    for the Windows systems and others that are most widely used today so you know
    what they are and which ones you''ll need'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# How This Book Is Structured


    +   - Guide the process of getting an open source lab off the ground quickly and
    without errors and wasted time to the point where you can run it yourself.


    This book is aimed at the group known as technology marketers as the "early majority."
    These are not the first people to adopt technology, who often do it for its own
    sake. It is the group of people who, in their professional life, take new ideas
    in technology and practice and have the vision and practical leadership to put
    them in widespread business use in their organizations.


    The emphasis of the book is on developing new uses for systems using open source
    software rather than just the migration of existing systems. In my experience,
    it is difficult to justify migrations and to achieve customer satisfaction. Migration
    and interoperability always play a part in system introduction and are thoroughly
    covered, but only as a tactical element.


    # How This Book Is Structured


    First, given the independent history of the open source community, it is useful
    to deal with the people, organizations, and programs that have brought us to this
    point; however, we will do briefly, because there are many good sources of this
    information available.


    Next, we cover the question of which open source systems are ready for use in
    any circumstance, particularly in large conventional organizations (including
    commercial businesses and government organizations). We will look at the advantages
    open source has offered to others and offer to you, as well as the challenges
    you will likely face in attempting to adopt it and introduce it in your organization.


    After this, the book looks at the systems that can be implemented now from the
    perspective of a business decision maker. My emphasis is the systems that will
    work and deliver value quickly, the measures used to determine that, and the road
    maps for deployment. We separate the systems, where open source is already a preferred
    choice that will work in almost every organization, from those where a careful
    evaluation must be made or where there is more work to be done before a pragmatic
    decision select open source.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The next major part of the book reviews the technology components of open source
    software, including strengths, weaknesses, and migration and interoperability
    issues, including:


    +   - The Linux operating system, the BSD alternative, and their variations and
    distributions

    - How open source systems have actually been developed; the methods and languages
    used, and lessons we can learn from them

    - Server applications, including infrastructure, Web, database, and communication
    servers

    - Desktop applications, including desktops, browsers, office suites, and a variety
    of professional and personal applications


    Next, we cover the methods for managing open source in the organization, including
    best practices for management of infrastructure, development, costs, risks, and
    licensing. There are sections on how to introduce open source to the organization,
    the specific hands-on details of setting up an open source lab, pitfalls to avoid
    as a new user of these technologies, and best practices and tricks for interoperability.
    The business scenarios are reviewed using simple spreadsheet to assess costs,
    benefits, and risks, so you can use them as a basis for analyzing your own situation.


    Finally, there are chapters on licensing and on essential resources for followup,
    including books and Web sites. In the open source community, the information is
    always out there; the trick is to navigate to it efficiently.


    I''ve attempted to keep the style and language used in this book simple. Each
    chapter is quite long and contains complete treatment of a subject, but is structured
    into segments so that useful information can be gained in a short sitting. There
    is some theory, but every theoretical point is illustrated with real-life examples.'
  merge: -1
