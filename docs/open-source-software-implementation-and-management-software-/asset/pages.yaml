    #  9.1.2 Open Source Compared with Corporate Development


    Comparing open source development to corporate development, we do see bigger variations.
    First, both open source and closed code developers pay a very high price for failure;
    they disappear as organizations and are not actually being considered here. Corporate
    developers can fail and live again, and analysis shows that most corporate systems
    fail on measures of time, cost, and quality. So we are really measuring software
    products across all corporate practices, mostly not successful.


    Second, corporate development is not usually maintained over the same time frames
    and with the same levels of staffing and consistency as open source. Where it
    is, with the reservation system Sabre or with some financial systems, it often
    approaches the software product in style and sometimes even in formal structure.


    Third, while the software toolkit is similar to open source (mostly C/C++ with
    other languages used for peripheral development and frontendcripting), the corporate
    developer favors proprietary toolkits that have shifted over time, currently Java
    based, and as a result has no substantial-consistent track record of tools or
    practices.


    #  9.1.3 Open Source Development Tools


    The open source community is conservative and frugal in tool use. Open source
    tools include CVS; Emacs and other text editors; GNU Make, debugger, and other
    tools; and Jakarta ANT. All these tools have a long duration and are very effective.
    They have crude but robust features and are often ugly when first approached,
    but are well understood in the community. In other words, they are like Ken Olsen''s
    old remark about UNIX as the "Russian truck."'
