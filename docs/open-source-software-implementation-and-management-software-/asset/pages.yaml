    because all applications are in a common perimeter, it will be hard to escape.
    Depending on the vendor, this could be very expensive and inflexible, and may
    not necessarily be secure.


    Strategies for interoperability can be placed under the broad headings of shared
    access to data, including file transfer and shared database, and process communication,
    including Web services. Whatever approach is chosen, if data formats are complex,
    as they generally are, there is a need for data standards. These are usually structured
    around XML. The preferred alternatives are shared database and Web services.


    # 11.4.1 Shared Data


    We can share data using a file system or a database. For knowledge management,
    we will often use file transfer or shared access to files. This can include FTP;
    network file sharing with Samba, NFS, or iFolders; files sent as mail attachments.
    This is a good way to manage slowly changing data that is distributed from a central
    point. It can also be used to replicate databases in some circumstances. We can
    map a database into XML and send it as a file.


    There are some basic problems of file sharing that must be addressed. Windows,
    Linux, and the Mac encode text files differently, and binary data is subject to
    platform variations. Network file shares are subject to more frequent and different
    types of error from local files.


    This is a very difficult way to manage transactional data. If the data changes
    regularly, the file distribution becomes absurdly large and we must start looking
    at delta mechanisms. If managing multicaster replication is a hard problem. Even
    simple file drops need planning to deal with locking and event notification. Once
    we get the simple cases, it takes time for a database.


    # Shared Database


    Shared database is the preferred way of doing cross-system interoperability. The
    database handles a range of data types, the network communication issues, and
    transactions and serialization.


    Database replication is often a requirement. With homogeneous databases, this
