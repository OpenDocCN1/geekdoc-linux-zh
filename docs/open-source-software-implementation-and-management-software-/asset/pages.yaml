    Titanium systems running Red Hot Enterprise Linux and MySQL for pricing. The application
    is written in C++ (GNU 3.2.3). Each MySQL system has a 50GB to 60GB database.
    The NonStop systems are the databases. Golden Data Extractor is used Nonstop to
    replicate data from the master to the pricing systems. This design allows complex
    processing to be performed on the more scalable systems.


    Replication can be used to update transactions from read-only. Figure 11.8 shows
    a scheme modeled on Slashdot that works for high-volume content management. Read
    access is a hundred to a thousand times the volume of write access, as on many
    Web sites. Updates are applied as by one database and replicated to as many others
    as volume requires.


