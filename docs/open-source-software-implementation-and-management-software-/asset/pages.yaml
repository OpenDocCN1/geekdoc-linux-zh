  md: '# 12.2 Types of Costs


    to Windows in a new installation situation, at least perceived. Decision makers
    may be unfamiliar with open source and inclined to assign higher risks or expect
    to pay for services.


    # 12.2.1 Fixed Costs


    IT and higher management costs above the level of project management are a given
    and will not vary by project activities.


    Network and desktop infrastructure, including firewalls, storage area networks,
    and personal computers, can be treated as a fixed cost when looking at applications
    in most contemporary organizations. If we are funding a project that brings technology
    to a new population, we will have to consider these costs in the project, but
    they will in case be the same for open source or closed code.


    # 12.2.2 Off-Budget Costs


    End-user costs, including training, possible downtime or dissatisfaction, and
    self-supporting (“messing around”), can be important, and some cost models show
    these costs as the highest single cost component. However, they are not usually
    reported as costs by IT organizations, because they are not on the budget.


    The effect on users may be reflected more commonly in penalties related to a service-level
    agreement, but more as a constraint on the IT organization, which must maintain
    a particular level of service. The effect of off-budget costs, when included,
    is to make estimates of user downtime and dissatisfaction the largest elements
    of the cost models, although these are very difficult to measure objectively.


    These elements are not included in the models here. Instead it is assumed that
    the systems being compared will offer equivalent availability and of use. This
    is very likely to be true for server systems, which run on the same hardware and
    are not directly visible to the end user. It is easy to demonstrate for desktop
    systems, and may be a factor to consider. Presumably, organizations that do not
    find desktop systems equivalent in this regard will not deploy them regardless
    of cost savings.


    # 12.2.3 Sunk Costs


    Sunk costs are the costs already spent on existing systems and are not recoverable.
    It is difficult to get money for old systems, particularly after the dot-'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 12.2 Types of Costs


    com bubble; many systems that are a couple of years old are only worth about ten
    cents on the dollar on the hardware, a quick search on eBay will reveal. Software
    and support costs and other soft costs, such as training, can add up to much more
    than hardware and will never be recovered.


    The effect of switching costs is to make it more difficult to move to new technology,
    because the acquisition cost of the new system is compared with the residual value
    of the existing system, which is much less than it.


    # 12.2.4 Switching Costs


    Switching costs are the additional costs it will take to move from an existing
    system to a proposed one, as opposed to keeping the existing one. The effect of
    switching costs is to make technology harder to adopt. The first application with
    a new technology will cost more than subsequent ones, because of training of developers
    and administrators, who presumably know the technology, and because of first purchase
    of developer tools, and other infrastructure that will be reused for future applications.
    If there were a single standard before, adding the new technology also leads to
    having to support two technologies, which may lead to additional cost.


    Sunk costs are similar to a switching cost in effect, since they existing systems
    and skills appear less expensive than they would be acquired now. However, existing
    systems still have costs, since equipment has to be maintained, software upgraded,
    and new staff trained. Often, after a period of time, an existing system must
    undergo a migration of its own, and this is the best time to consider a switch.


    Staffing is usually the highest cost in a TCO calculation, and the effect on staffing
    costs of migration will usually be to increase them. IT staff will need to be
    retired or retrained, possibly with expensive training. If there are end users,
    they also need to be retrained. They may also have satisfaction or quality issues
    in the transition. Of course, these are generally off-budget costs, but they may
    need to be included as a one-time cost when part of a conversion project.


    If we look each year at our existing system, the switching costs will always be
    there. Because they effectively raise the price of the alternative, they act as
    a premium to the vendor of the existing solution. Any charge less than the switching
    cost is not sufficient to cause the switch. Although a switching cost is a one-time
    charge, this "vendor premium," which the cost makes possible, can be applied every
    year, as shown in Figure 12.3.'
