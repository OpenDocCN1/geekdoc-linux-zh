- img_proc: true
  md: '# Complex Web Publishing


    Authors must be able to compose and edit content with any browser, special technical
    knowledge, and tag it or profile it. They should also be able to use their preferred
    tools for content development, and the portal product for markup only. Content
    should be templatable, so new material can be quickly incorporated in defined
    styles.


    Managers must be able to edit and delete content, define and edit page and template
    layout, quickly and on a per role basis. Expired and deleted content should be
    handled correctly.


    The product may need to allow comparison and reversion, so a user can view all
    versions of some page(s) and can revert back to that use if needed. Some reports
    on content state and use would be helpful.


    Some content management users need extensive workflow features. This includes
    delegation of content management to users with appropriate roles, and a process
    for review of content before display if appropriate. One of the critical process
    tasks is to determine not what content is captured, but what format it needs to
    be in meet business needs.


    Web sites with fresh content provide a compelling reason for return visits. Designing
    a content management solution should also incorporate the design of business processes
    to ensure that the content is current, fresh, and reliable. Some content may need
    to be updated hourly, others annually. Processes may need to be established for
    each type of content cycle.


    # Indexing and Search


    Search can be free-text or structured (based on a classification schema), but
    it should probably be both. For most organizations, a specific search should be
    offered for internal people and locations, and often for products and services.


    It is important to define the right classification schema for content. Defining
    this metadata is very user and content specific. Some users may be willing to
    define an unlimited number of “tags” on content as they enter it. Other users
    may only have patience or time for a small number of tags. This must be analyzed
    and determined for each type of content and content source.


    All documents available from the portal need to be indexed for searching, including
    content internal and external to the product in several formats. Ideally, an internal
    search should work like well-known engines, such as Google. Unlike Web engines,
    there may be authentication issues with documents you are allowed to see.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Component Integration


    As with a daily newspaper, a portal needs both headlines and a rich set of content.
    The headline item is often some kind of balanced scorecard, preferably personalized,
    such as an analysis report comparing personal and district sales with others.
    The content often includes a variety of legacy applications. The portal product
    needs to allow development and integration of this type of material, whether internal
    or third party, in a rapid and flexible way.


    # Internationalization


    Many organizations will need support for multiple portals with different languages
    from one or several servers, that all content is displayed in the appropriate
    language while using a common database/server configuration.


    # Migration


    Direct migration is not usually viable because of the differences between product
    features and architectures. Of course, most data and applications should be accessible
    using purpose-built migration scripts with appropriate planning.


    # 5.5.2 Open Source Content Portals


    There are a number of products in this area, depending on definition, and in another
    year it may have changed. I will select three open source products, which I know
    to have many users, significant growth and buzz, and architectures that allow
    rapid deployment of functional applications but scale to support complex custom
    development when needed. These are:


    +   - Plone

    - PHP-Nuke

    - eGroupWare


    Plone is developed in Python, using the Content Management Framework and the Zope
    engine. Python can be used to extend the application. PHP-Nuke and eGroupWare
    are both developed in PHP and can be extended with that language.'
  merge: -1
