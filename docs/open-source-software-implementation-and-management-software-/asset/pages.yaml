  md: '# # A

    Resources


    # ## A.I Managing an Open Source Lab


    An open source software lab will serve as a resource for:


    +   - Selling the advantages of open source software to executives who want to
    understand what it is all about.

    - Demonstrating relevant products and practices, and their operation and features,
    for users and professionals who want to see the software before using.

    - Identifying internal systems and people who already have been successful.

    - Developing solutions to problems in the organization that can be assembled from
    these products and practices.

    - Training professionals, developers, and system administrators, who want to evaluate
    open source software and learn to use it.

    - Testing system operation—for instance, to check vendor claims, make sure elements
    work together, and practice migrations.

    - Benchmarking capacity and performance—for instance, database performance in
    requests/seconds, or the number of users supported by a directory.


    This is such a useful list of activities, and a simple lab is so easy to get started,
    that is the first thing we should do in the course of investigating and/or introducing
    open source software.'
  merge: -1
