  md: '# 3.5 Summary


    One problem with UNIX was the trademark issue. Linux can be freely used without
    trademark acknowledgment to another company so there is not the name fragmentation
    around Linux that occurred with UNIX, which was marketed variously as Solaris,
    HP-UX, Xenix, Irix, Aix, Tru64, and SCO Xenix, others.


    Companies competed to enhance UNIX with proprietary improvements that were only
    available on their systems. Linux requires enhancements to be made available to
    put back into the (core) code base, so the technical divergences that happened
    in UNIX cannot occur. It also appears that UNIX discovered that their efforts
    to create proprietary enhancements at the operating system level were very expensive
    and did give them a good return, at according to IBM and Hewlett-Packard.


    # Is Open Source Really Cheaper When You Consider All the Costs?


    Vendors may point out that if you price a system including middleware, such as
    IBM WebSphere or BEA WebLogic; database software, such as Oracle; or hardware,
    such as a mainframe, a solution involving open source may not be cheaper (or much
    cheaper) than a system with open source.


    Maybe it is not always cheaper in those cases. Customers don''t want cheaper.
    Maybe they like the solutions involving WebSphere, WebLogic, Oracle, or Linux
    on a mainframe and think they are worth the money.


    On the other hand, you can certainly build systems using open source products
    without expensive middleware and do a great many things with them, and this book
    will cover many of them. Further, in the expensive hybrid systems mentioned previously,
    the open source is providing inexpensive and flexible elements to the solution
    and is never specifically the cause of the high cost.


    # 3.5 Summary


    There are some differences in buying open source, because it is marketed and sold
    in a different way. But there are very real advantages to these products. Considered
    separately, several are simply the best price/performance available in their category.
    Considered together, open source software offers a group of integrated solutions
    to many common problems faced by large enterprises.'
