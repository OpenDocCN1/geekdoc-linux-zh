    # Integration


    OpenOffice can connect to databases using the access methods ADO, JDBC, or ODBC.
    It can for instance connect to Access using ADO, MySQL using JDBC, and SQL Server
    using ODBC.


    OpenOffice formats are XML based and published, so integration with other systems
    is simpler than Microsoft Office. It is not necessary with OpenOffice to buy more
