  md: 'their internal needs or their customers'' needs. Google, for example, employs
    a great deal of open source software in systems development. Its own software
    is not open source, and there are license restrictions on access to most Google
    services to prevent others from getting a free ride—instance, by repubishing a
    Google search as their own.


    As this example shows, a company can develop closed code using open source tools
    and distribute it on open source systems, as long as it follows a few rules. Enhancements
    that an organization makes to the open source software it uses, however, MUST
    be contributed.


    It is common to take open source projects, add a layer of additional functionality
    in closed code, offer support for both their enhancements and the open source
    base, and charge a fee. This describes IBM WebSphere, Red Hat, and some other
    distribution companies. It is a healthy part of the process, because customers
    have a choice of whether to choose the enhanced bundle or the open source system.


    # 13.4 Dual Licensing


    Some products are dual licensed. They are available with either an open source
    license or a commercial license. Examples of such products are:


    +   - Qt, from TrollTech, the GUI toolkit used by KDE

    - MySQL, from MySQL AB, the database server

    - Berkeley DB, from SleepyCat Software, the embedded database program


    The dual license allows these companies to offer open source products to those
    who are developing open source software, or to individual users. Depending on
    their intentions or organization, others may be required to pay for a commercial
    license.


    There are probably many ways to do this, the path taken by these companies is
    to license under the GPL, and then offer a commercial license to companies that
    would prefer not to meet the GPL terms. This exact strategy requires a development
    tool, such as a toolkit or database; it leverages the property of the GPL so that
    if you link to it you fall under its terms. Vendors of a pure application might
    need to write different licensing terms, but of course they could.'
  merge: -1
