  md: '# 8.2 Graphical Desktops


    X11 was written in the early 1980s and made available under an open source license
    similar to Berkeley. There had been several previous X versions but X11 became
    widely adopted and the numbering stopped. There were alternative windowing systems,
    such as Sun’s Network-extensible Windowing System (NeWS), but X11 won out and
    became the facto standard for windowing on UNIX and similar systems. X11 was innovative
    in important ways. Unlike its rivals, the Windows and Mac GUI, it is portable
    across many systems and is not hooked to a particular operating system. It separates
    the display component (or X server) from the client and network. It supports virtual
    desktops, so you can scroll across a much larger space than the physical display.
    And it is much customizable than other systems.


    X11 by design was not prescriptive on window management or look and feel. The
    intention was that different organizations could innovate and enhance these areas,
    rather than enforcing a standard. For some time, UNIX vendors attempted to distinguish
    themselves from each other, so it became customary to develop different window
    managers and style guides. Eventually, there was a movement toward adoption of
    a set of standards for the UNIX desktop. This became the Common Desktop Environment
    (CDE), which adopted standards based around Motif, which was Windowslike. Unfortunately,
    Motif/CDE was not open source at that time, which slowed the effort.


    The X11 toolkit is written in the C language and accessed at quite a low level,
    so it is not easy to program. “Widget sets” were developed to make this development
    more consistent and less level; these evolved into object-oriented APIs, and there
    are several proposals to replace this with new code, but it is not like to hap-pen
    soon.


    So Linux systems have a common graphical code base, but alternative of window
    managers, look and feel, and development toolkits. With other areas, we get the
    double-edged benefits and costs of choice of here. There are some really interesting
    customization options. For unusual systems, such as very large or some custom
    areas, this separation of interface allows great flexibility. Any application
    can create its own look. So embedded systems can have a simple proprietary look
    like a TiVo or a high-performance interface like the Sharp Zaurus. We can use
    this to make a retail or call center application look exactly the way we want.
    Also, power users can configure their systems as they wish. There are a variety
    of windowing managers for specialized uses, such as system administrators or developers.'
  merge: -1
