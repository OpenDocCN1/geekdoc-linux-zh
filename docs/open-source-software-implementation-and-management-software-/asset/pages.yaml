  md: '# 5.4.3 Weblogs


    Weblogs ("blogs") are a common method for building community; they went increasingly
    mainstream this year as the political community adopted them. There are several
    choices of software for creating Weblogs. Movable Type, probably the leader, is
    dual licensed, written in Perl with BDB and MySQL. Movable Type offers a Web service
    version, TypePad. Another Weblog is b2, which is open source software written
    in PHP with MySQL.


    Real Syndication (RSS) is a standard for consolidating data from many feeds into
    one single viewer. Good Weblog supports RSS.


    Figures 5.6 and 5.7 are sample pages of blogs developed with Movable Type and
    b2, respectively.


    # 5.4.4 Instant Messaging


    Instant messaging (IM) is an application with high growth. In some places it is
    supplanting email, since it is faster and works well with cell phones. Consumer
    IM has been damaged by competition between proprietary formats. Possibly open
    source software can resolve this. The GAIM instant messaging client works with
    many servers, the open


