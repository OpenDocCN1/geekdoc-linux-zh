    # 12.3 Scenarios


    The following examples illustrate two companies with greatly varying numbers of
    internal desktops: 50 and 15,000. They have different scenarios of internal and
    external applications that represent different issues. We will calculate likes
    for infrastructure, development, and production products separately and then sum
    them. Costs will include hardware (expected to last three years), software purchase,
    software maintenance (typically 25 percent of the purchase cost per year), development
    (one-time), management (for the three years), and any switching costs (one-time).


    Cost savings generally need to be produced in two years or less to justify the
    return on investment (ROI) of a project. Longer time frames are riskier because
    the project may outcast the personalities and circumstances that justified it
    and the technologies deployed may be surpassed. Small projects should probably
