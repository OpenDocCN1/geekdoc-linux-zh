- img_proc: true
  md: '# 5.5 Complex Web Publishing


    This category is on the borderline between build and buy. In any organization,
    but especially in a large one, information is stored on a variety of devices or
    software. So portal selection is really the process of selecting a vendor, or
    vendors, for a set of infrastructure and development tools and components.


    The ready-made portal software is most useful to smaller companies and those that
    are new; others will have many existing systems and processes for these offerings
    to fit, and will do more custom development over time. In either case, the portal
    is a sample that serves as a jump-start.


    The following are examples of portal offerings:


    +   * Plumtree Studio Server

    * IBM WebSphere Portal Server

    * Sun Planet Portal Server

    * Red Hat Portal Server

    * Microsoft Sharepoint Portal Server

    * PHP-Nuke

    * eGroupWare


    The following are content management servers:


    +   * Vignette

    * Red Hat Content Management Server

    * Microsoft Content Management Server

    * Plone

    * Bricolage


    These are overlapping categories, since a substantial portal includes content
    management. They will be treated as one requirement here. The goal of a content
    management solution is to allow business users to be able to easily create, retrieve,
    and share content for intranets, extranets, and ebusiness/government. The organization
    and structure of the content must be determined by be relevant to the people who
    create and use it.


    Chapter 5'
