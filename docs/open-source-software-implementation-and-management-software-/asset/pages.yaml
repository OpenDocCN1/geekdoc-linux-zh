  md: '# 3.1.4 Open Source Avoids Proprietary Information Formats


    It is unusual for open source to implement proprietary data formats, but it is
    not possible. Open code could use proprietary keys to make data inaccessible even
    though the algorithms are public, as is done routinely for security reasons. Open
    code could use legal means to protect data storage even though the algorithms
    are known, in the same way that Unisys did with the GIF format for years.


    But the most common method used by closed companies to implement proprietary formats
    is simply not publishing them, combined with changing the formats periodically
    and reserving the right to do so. Because open source code can be read (and copied),
    this method is not available to open source products. Generally, open source as
    a matter of principle avoids proprietary control also.


    Unfortunately, it has been the general practice for vendors to develop proprietary
    formats that are not fully documented, and to reserve the right to change those
    formats. This is not usually defended as a right; it is often argued that it is
    technically too difficult to publish the formats and maintain over time in a consistent
    manner.


    Information created by individuals and corporations belongs to them, or in some
    cases to broader bodies, so legal constraints on data access are unlikely to apply
    to individuals publishing their own information. Government information may belong
    to all people, for instance. This is not usually bounded by time and place.


    Examples of proprietary data formats include Microsoft Office (Word/Excel/PowerPoint),
    and also enterprise server software such as SAP, People-Soft, and so on. Documents
    you create may last for years. It is not unusual have to convert the formats several
    times. For example, at some time, you may want to show them on the Web or on a
    Palm Pilot. You should never pay a license fee to access your own data as many
    vendors require, and to be sure that you can always access it.


    # 3.1.5 Open Source Allows Integration between Products


    With open source, because data and code specs and source code are available, you
    can always make things work together by examining these documents. With proprietary
    systems, you are dependent on the code owner to make changes (or not).'
