    # 12.1 Total Cost of Ownership


    There is a simple answer to the question of open source software costs, where
    open source solutions are comparable to closed code alternatives. When compared
    with similar closed code systems, open source systems as a general rule cost:


    +   - Much less for software

    - No more and often less for hardware

    - If other things are equal, no more for anything else


    As far as software costs are concerned, we will review tables with the prices
    for common open source and closed code products, and see that open source software
    costs much less.


    As far as hardware is concerned, open source products are available for effectively
    all current hardware platforms, including the systems with the best/performance.
    Open source performance on a platform is usually similar to closed code competitors,
    as already discussed throughout this book. So hardware for open source software
    generally costs the same as for the least expensive system for closed code. In
    most cases, we are comparing'
  merge: -1
