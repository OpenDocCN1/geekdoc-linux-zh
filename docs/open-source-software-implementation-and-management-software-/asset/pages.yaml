    # 5.5 Complex Web Publishing


    Complex Web publishing includes content content management and portal servers.
    Portals consolidate information and tools from a variety of sources and present
    them in a single user interface. A portal is a collection of applications and
    infrastructure, not a distinct application in itself. These are targeted at a
    set of customers, internal or external. Portals include some content management
    as a core function, but this is often offered as a separate product.


    Content management servers are often derived from professional organizations,
    such as newsrooms or publishing systems, with syndication as a core competence.
    They offer powerful control over document management, workflow as approval processes,
    and content distribution. Unlike portals, they are often sold to nontechnical
    management, who like the control features.'
