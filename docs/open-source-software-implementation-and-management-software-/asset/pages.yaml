  md: '# 9.1.4 Managing People


    Some articles, particularly introductory ones, make open source development seem
    like altruism, communism, or something else unrealistic and unlikely to survive,
    but we should dismiss this. History shows that this approach to software development
    is about as old as software itself and grows out of earlier models for academic
    and scientific work that are much older.


    We find really similar motivations in open source as anywhere else we look in
    detail. One obvious similarity is to the research scientist. Many scientists don''t
    get rich (although a few do), but they make a living and see a clear career and
    skill progression. They often don''t care what kind of car they drive anyway.
    They really enjoy the work they do, both for its results and its intrinsic nature.
    And they enjoy publication and recognition, such as the occasional conference
    where they get together with their peers. As with the research scientist, the
    software engineer in a commercial world often has a culture conflict with the
    salespeople and others in the corporate end of the business.


    Motivation in the software community includes:


    +   - Playing with technologies and experiencing the sheer fun of writing code

    - Getting something done that an individual needs, such as inventing the Perl
    language, or a peer-to-peer music sharing system

    - Earning money, or enhancing career and skill development (which is deferred
    money)

    - Ego gratification, such as publishing, leadership, or belonging to a community
    and helping others


    Managing people in closed source software development has always involved pulling
    all of these levers. Technology developers are not as directly motivated by money
    as salespeople. In open source product development, the money motivation is probably
    not as high as in other places. The ego factor seems to be higher in many cases
    and, of course, the ability to select what to work on. This is an age-old story
    of handling creative people.


    Although the developers of open source products need to be managed differently
    in some ways, the people who are implementing and managing'
