    areas, and use tools to see the actual database queries running.


    +   - Review the application requirements and design against the database design.
    It is common for implementers of the application not to be aware of data volumes,
    and database administrators not to be familiar with application logic.


    +   - Use database-specific optimizations, as stored procedures, cursors, indexes,
    and prepared statements, correctly. In MySQL, this includes the storage type.


    +   - Find a clean way to pool database connections that the pool is maintained,
    rather than continually connecting and dropping.


