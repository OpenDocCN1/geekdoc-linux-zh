- img_proc: true
  md: '# 12.1 Total Cost of Ownership


    the same hardware running Windows or UNIX on the one hand versus Linux on the
    other.


    Other things may not be equal and total cost of ownership (TCO) studies offer
    an opportunity to show that. There are many forms of these, and there is a small
    industry that compares and contrasts TCO ROI versus other terms. Here, we will
    keep this simple and use TCO to include the costs involved over a reasonable period
    of time when making a software decision.


    The issue usually comes down to staffing costs. There are published TCO studies
    that attempt to show that open source software costs more than you, or that hardware
    costs more for Linux in some specific situation, but that from obviously biased
    sources and are not really credible. The three cost elements of TCO are staffing,
    hardware, and software. Of these, staffing dwarfs the others in all the scenarios
    we will look at. Because of the dominance of staffing costs, even where open source
    software saves millions, this will not represent a particularly large difference
    in TCO. However, in some cases TCO can secure the real savings by adding large
    costs, which are effectively fixed, such as system administration and support,
    to both sides of a comparison.


    # 12.1.1 Staffing Costs


    Personnel costs dominate staffing costs for infrastructure. Because of this, the
    savings from open source software as Linux and MySQL will be small compared with
    the costs of personnel for development and management.


    An IDC report on Windows and Linux infrastructure costs estimates the TCO cost
    breakdown for infrastructure, as shown in Figure 12.2.


    This may underestimate software costs, but it is broadly consistent with work
    by Gartner on IT costs, which again shows costs and downtime as the major costs
    for infrastructure. So for IT infrastructure systems, the impact of a system on
    system administration and end users can be ten times more important than its purchase
    cost. This indicates how inexpensive IT infrastructure is today measured at the
    server. Desktop costs alter this substantially, as we will see later.


    Application solutions can be much more expensive. Large applications can incur
    millions of dollars in costs for software acquisition or development, as well
    as large server hardware costs, particularly for database sys-'
  merge: -1
