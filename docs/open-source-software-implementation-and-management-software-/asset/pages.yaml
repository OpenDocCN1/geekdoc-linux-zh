  md: '# 6.6 Summary


    The ecosystem around the Linux operating system is dynamic, with many companies
    and rapidly changing versions, stable in important ways. Applications developed
    for Linux run on all the distributions and versions without change. A Linux vendor
    could discontinue a distribution, but systems it distributed could be migrated
    to other Linux versions without a large disruption. This issue is actually more
    of a concern for closed code products. Many times, closed code vendors have gone
    bankrupt, been acquired, or discontinued a product, and their customers were into
    migration to a replacement at an untimely time. This happened with the DEC TOPS-20
    and OS/2 operating systems, for example.


    Unlike closed code systems, Linux does not rely on having a single successful
    vendor. The open source model means another company can always pick the code base
    and continue. Some Linux distributors, as with some source companies, have gone
    into bankruptcy organization or out of business, but this has not had a serious
    impact on their customers. Linux distributors, such as Red Hat, have been consistently
    successful.


    It may be that in the future, Linux will consolidate around one or two major vendors.
    Perhaps, in the worst case, we''ll be back where we were in the past, with vendors
    calling the shots, as in the 1980s with IBM or, more recently, with Microsoft.
    But open source is different in that you will always have choices. Any company
    can set up distribute, support, or training in Red Linux. You may make a decision
    to consolidate buying from IBM Global Services, but you are still going to be
    able to get other components that you need (hardware, other software, support,
    consulting) from other vendors.


    Linux distributions are sufficiently similar that a customer can always select
    another distributor. Applications and custom solutions developed for one distribution
    will work with another. There might be some dislocation, but less than involved
    in a closed source situation of the same type.


    The Linux operating system has developed the past ten years at an extraordinarily
    fast rate and is now the operating system of choice for many systems—from the
    very largest supercomputers to the very smallest appliances and hand-held systems,
    as well as for typical uses of business server computers of all sizes.


    In this book, we repeatedly made the point that open source systems are good enough
    for many purposes. Linux is more than that. It is simply the best operating system
    in many respects and for most purposes. It is more'
  merge: -1
  pgno: 164
- img_proc: true
  md: secure than other general-purpose operating systems, has the fastest networking
    stack of any system, scales to the smallest appliances and the largest clusters,
    and is constantly improving.
