  md: '# 7.3.3 Open Source Database Choices


    There are three open source databases to consider seriously for general use, in
    my view. These are Berkeley DB, PostgreSQL, and MySQL. They are all widely used.


    Two more systems play in niches. MaxDB was formerly known as SAP DB and before
    Adidas-G or Supra. It has some major clients, mostly in Europe, but has never
    caught on in the United States with the pull of its integration with SAP. Its
    role will probably be to bring technologies for incorporation future large-scale
    versions of MySQL. Despite being a solid product that has been around for some
    time, Firebird, formerly Interbase, has not grown beyond a small niche.


    # Berkeley DB


    Berkeley DB is a core tool under several important open source products, and apparently
    has 200 million deployments. Berkeley DB (BDB) is a highperformance derivative
    of the old "DBM" databases, which have been part of UNIX and UNIX-like operating
    systems from the beginning.


    As an embedded, or application-specific, database, BDB is included with products,
    without the user being aware. This is like Brieve or Microsoft Jet and MSDE engines.
    It is a flat-file database, not SQL.


    BDB has a dual licensing model. It is open source (GPL license) when used in open
    source products or at a single site. When distributed with a commercial product,
    there is a commercial license.


    Berkeley DB is used by Sendmail, Apache, and OpenLDAP servers, the Netscape and
    Mozilla browsers, the Python and Perl programming languages. Commercial customers
    include Sun, Google, Veritas, TIBCO, Cisco, Amazon, and HP.


    # PostgreSQL


    PostgreSQL is an open source database, available under the BSD license/copyright
    regime. It is based on the Postgres project designed at Berkeley in the 1980s,
    and before that on performed on the Ingres database by Michael Stonebreaker since
    1974. It was not a SQL-based product until 1995. Ingles and Postgres were developed
    on BSD UNIX. It is available now on Linux and UNIX, including the Mac, but it
    is not native on Windows, running in the Cygwin emulation.


    Postgres has historically offered better support than MySQL for standard SQL behavior,
    although MySQL seems to be catching up. Currently,'
