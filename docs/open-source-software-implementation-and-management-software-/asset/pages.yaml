  md: '# How Choosing Open Source Is More Difficult for You


    There are some ways the computer business is structured that will make it more
    difficult for you to choose open source software and advocate it in your organization.


    The business has traditionally consisted of large companies with a direct sales
    force and substantial marketing budgets. These are able to provide direct sales
    people in support of a corporate evaluation, and to feed a stream of independent
    reviews and trade journalism that generates demand for the products. The shape
    of the business also influences the structure of applications into "suites" or
    other forms of bundle.


    Open source software does not have the direct sales force, the marketing budgets,
    or the incentive to bundle product. As a consequence, it can seem "weird," unless
    you are expecting this.


    # 3.3.1 Open Source Has Les Complete Level of Sales Support


    # No Direct Sales Model


    There are not many products, particularly in the early stages of adoption, many
    products that sell themselves. Without a direct sales force, products are unlikely
    to be adopted. Indeed, otherwise good products may not be considered. Microsoft
    Test, for example, was a product as good as the competition, but it never sold
    since it was too expensive and had no direct sales force; eventually it was given
    away to Rational.


    It is difficult to sell products that cost less than a threshold value through
    a direct sales force. This value is driven by simple arithmetic applied to a sales
    pipeline. A single rep may be able to track a dozen realistic opportunities and
    close one or two month. In this business, a rep may receive 5 percent to 8 percent
    of the sale. To make a good living on these numbers, each sale has to average
    around $100,000. This value has not changed substantially in a generation, although
    it fluctuates depending on whether times are bad or good.


    The problem of funding a direct sales force makes it hard for open products if
    they are sufficiently complex to require a direct sales. It is a particular problem
    if they must compete against a direct sales force, as do JBoss and MySQL. Databases
    and application servers are almost sold directly. These two companies also follow
    dual licensing (the)'
