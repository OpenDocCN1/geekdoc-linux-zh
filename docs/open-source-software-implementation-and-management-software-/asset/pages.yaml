    # 3.3.3 Open Source Products Are Not Bundled, Branded, or Integrated


    Bundling is when several products come packaged together. There is generally some,
    often limited, integration. Branding is when several products are named similarly
    so that all can benefit from the reputation of some.


    # Bundling


    Closed source products have several incentives to pursue bundled software (that
    is, to put together several solutions with incentives to buy them together), branding
    strategies (associate products with each other), or to create tie-ins between
    products. These incentives are as:


    +   - Often, this is needed to bring the direct sales force sufficient revenue
    to keep operating.


    +   - It is an advantage for a sales force to have more products to sell to the
    same customer they are calling anyway.


    +   - If individual product revenues rise and fall over time, a portfolio of products
    can smooth the results.


    +   - People may need products to work together. If the products are closed source,
    the most likely way for them to work together efficiently is if one vendor, with
    access to the source, makes it happen.'
