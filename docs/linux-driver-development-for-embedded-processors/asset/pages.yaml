    # MMIO (Memory-Mapped I/O) - Device Access


    In the IMX6 processor, the peripheral devices are mapped in the physical memory
    layout, which means that you have the same address bus for memory and devices.
    The same instructions are used to access memory and devices. (e.g., on ARM®: ldr,
    str are used to load/store register value from/to the memory address as well as
    the serial port register). Go to Chapter 2 "Memory Maps" of the IMX6DQRM to see
    the i.MX6 physical memory map.


    The Linux driver cannot access physical addresses directly - MMU mapping is needed.
    To access I/O memory, drivers need to have a virtual address that the processor
    can handle, because I/O memory is not mapped by default in virtual memory.


    The following figure represents the i.MX6 GPIO01_DR register physical address
    mapping:


    # GPIO memory map


    | Absolute address (hex) | Register name | Width (in bits) | Access | Reset value
    | Section/page |

    |---|---|---|---|---|--|

    | 209 C000 | GPIO data register (GPIO01 DR) | 32 | R/W | 0000 0000h | 28.5.1/1423
    |

    | 209 C004 | GPIO direction register (GPIO01 GDIR) | 32 | R/W | 0000 0000h | 28.5.2/1424
    |'
