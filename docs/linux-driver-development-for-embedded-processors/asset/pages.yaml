    # NXP IOMUX Controller (IOMUX)


    The IOMUX Controller (IOMUX), together with the IOMUX, enables the IC to share
    one pad to several functional blocks. This sharing is done by multiplexing the
    pad''s input and output signals, as shown in the following image:


    ![](img/739a35b59067f8a55eff80a58765146f_159_1.png)


    Every module requires a specific pad setting (such as pull up or keeper), and
    for each pad, there are up to eight muxing options (called ALT modes). The pad
    settings parameters are controlled by the IOMUXC.


    The IOMUX consists only of combinatorial logic combined from several basic IOMUX
    cells. Each basic IOMUX cell handles only one pad signal''s muxing.


    The following figure illustrates the IOMUX/IOMUXC connectivity in the system:'
  merge: -1
