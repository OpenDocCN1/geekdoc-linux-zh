    # Platform Device Drivers in the User Space


    Device drivers in Linux are traditionally run in the Kernel space, but can also
    be run in the User space. It is not always necessary to write a device driver
    for a device, especially in applications where no applications compete for the
    device. The most useful example of this is a memory mapped device, but you can
    also do this with devices in the I/O space. The Linux User space provides several
    advantages for applications, including more robust and flexible process management,
    standardized system call interface, simpler resource management, a large number
    of libraries for XML, and regular expression parsing, among others. Each call
    to the Kernel (system call) must perform a switch to supervisor mode and back
    again. This takes time, which can become a performance bottleneck if the calls
    are frequent. It makes applications more straightforward to debug by providing
    memory isolation and independent restart. At the same time, while Kernel space
    applications need to conform to General Public License guidelines, User space
    applications are not bound by such restrictions.


    On the other hand, User space drivers have their own drawbacks. Interrupt handling
    is the biggest challenge for a User space driver. The function handling an interrupt
    is called in privileged execution mode, often called supervisor mode. User space
    drivers have no permission to execute in privileged execution mode, making it
    impossible for User space drivers to implement an interrupt handler. To deal with
    this problem you can perform polling'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'or have a small Kernel space driver handling only the interrupt. In the latter
    case you can inform the User space driver of an interrupt either by a blocking
    call, which unblocks when an interrupt occurs, or using a POSIX signal to preempt
    the User space driver. If your driver must be accessible to multiple processes
    at once, and/or manage contention for a resource, you also need to write a real
    device driver at the Kernel level, and a User space driver will not be sufficient
    or even possible when used for DMA transfers is also non-trivial for User space
    drivers. In the Kernel space there are also frameworks that help to solve dependencies.


    The main advantages and disadvantages of using User space and Kernel space drivers
    are summarized below:


    +   1. User Space Driver Advantages:


    +   - Easy to debug as debug tools are more readily available for application
    development.

    - User space services such as floating point are available.

    - Device access is very efficient as there is no system call required.

    - The application API of Linux is very stable.

    - The driver can be written in any language, not just C.


    +   2. User Space Driver Disadvantages:


    +   - No access to the Kernel frameworks and services.

    - Interrupt handling cannot be done in User space. It must be handled by a Kernel
    driver.

    - There is no predefined API to allow applications to access the device driver.


    +   3. Kernel Space Driver Advantages:


    +   - Run in the kernel space in the highest privilege mode to allow access to
    interrupts and hardware resources.

    - There are a lot of Kernel services such that Kernel space drivers can be designed
    for complex devices.

    - The Kernel provides an API to the User space which allows multiple applications
    to access the Kernel space driver simultaneously.


    +   4. Kernel Space Driver Disadvantages:


    +   - System call overhead to access drivers.

    - Challenging to debug.

    - Frequent Kernel API changes. Kernel drivers built for one Kernel version may
    not build for another.'
