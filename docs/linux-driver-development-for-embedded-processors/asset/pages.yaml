- img_proc: true
  md: "# Character Drivers\n\nIn this Kernel module lab you will interact with the\
    \ User space through an ioctl_test application. You will use open() and ioctl()\
    \ system calls in your application, and write its corresponding driver callback\
    \ operations on the Kernel side, to provide the communication between the User\
    \ and Kernel space.\n\nIn the first lab you saw what a basic \"helloworld\" driver\
    \ looks like. This driver didn't do much except some text during installation\
    \ and removal. In this lab you will expand this driver to create a device with\
    \ a \"major\" and \"minor\" number. You will also create an User application to\
    \ interact with the driver. Finally, you will handle file operations in the driver\
    \ to service requests from the User space.\n\nThe main code sections of the driver\
    \ will now be:\n\n+   1. Include the header files required to support character\
    \ devices:\n\n```\n#include <linux/cdev.h>\n#include <linux/fs.h>\n```\n\n+  \
    \ 2. Add the following definition for the major number:\n\n```\n#define MY_MAJOR_NUM\
    \ 202\n```\n\n+   3. One of the first things you will need to do when setting\
    \ up a char device is to obtain one or more device numbers to work with. The necessary\
    \ function for this task is register_chrdev_region, which is declared in <linux/fs.h>.\
    \ Add the following lines of code to the hello_init() function to allocate the\
    \ device numbers when the module is loaded. MKDEV() macro will combine a major\
    \ number and a minor number to a dev_t data type that is used to hold the device\
    \ numbers.\n\n```\nregister_chrdev_region(MKDEV(MY_MAJOR_NUM, 0), 1, \"my_char_device\"\
    );\n```\n\n+   4. Add the following line of code to the hello_exit() function\
    \ to return the device numbers when the module is removed:\n\n```\nunregister_chrdev_region(MKDEV(MY_MAJOR_NUM,\
    \ 0), 1);\n```\n\n+   5. Add the struct file_operations. The file_operations structure\
