  md: '# Chapter 5


    ![](img/739a35b59067f8a55eff80a58765146f_160_0.png)


    © 2016 NXP B.V.


    The main IOMUXC features are:


    +   1. 32-bit software control registers (IOMUXC_SW_MUX_CTL_PAD_<PAD NAME> or
    IOMUXC_SW_MUX_CTL_GRP_<GROUP NAME>) to configure one of eight alternate (ALT)
    MUX mode for each pad or a predefined group of pads and enable forcing of an input
    path for the pad(s) (SION bit).


    +   2. 32-bit software pad control registers (IOMUXC_SW_PAD_CTL_PAD_<PAD NAME>
    or IOMUXC_SW_PAD_CTL_GRP_<GROUP NAME>) to configure specific pad settings of each
    pad, or a predefined group of pads.


    +   3. 32-bit general purpose registers - 14 (GPR0 to GPR13) 32-bit registers
    according to SoC requirements for any usage.


    +   4. 32-bit input select registers to control the input path to a module when
    more than one pad drives this module input.


    Each SW MUX/PAD CTL IOMUXC register handles only one pad or one pad''s group.
    The minimum number of registers required by software are implemented by hardware.
    For


