  md: '# Cache Coherency


    DMA can lead to cache coherency problems. Imagine a CPU equipped with a cache
    and external memory that can be accessed directly by devices using DMA. When the
    CPU accesses X in the memory, the current value will be stored in the cache. Subsequent
    operations on X will update the cached copy of X, but not the external memory
    version of X, assuming a write-back cache. If the cache is not flushed to the
    memory the next time a (DMA) tries to access X, the device will receive a stale
    value of X. Similarly, if the cached copy of X is not invalidated when a device
    (DMA) writes a new value to the memory, then the CPU will operate on a stale value
    of X. This issue can be addressed in one of two ways in system design:


    +   1. Cache-coherent systems implement a method in hardware whereby external
    writes are signalled to the cache controller which then performs a cache invalidation
    for DMA writes or cache flush for reads. I/O coherent systems (e.g., Cortex-A9
    with ACP) implement a hardware mechanism where accesses to shared DMA memory regions
    are routed to the cache controller which will invalidate (for DMA writes) or cleans
    (for DMA reads) the relevant cache lines.


    +   2. Non-coherent systems (like the i.MX6 Cortex A9) leave this to software,
    where the OS must ensure that the cache lines are flushed before an outgoing DMA
    transfer is started and invalidated before a memory range affected by an incoming
    DMA transfer is accessed. The OS must make sure that the memory range is not accessed
    by any running threads in the meantime. The latter approach introduces some overhead
    to the DMA operation, as most hardware requires a loop to invalidate each cache
    line individually.


    # DMA Engine Subsystem


    There are several kinds of addresses involved in the DMA API, and it''s important
    to understand the differences. As seen in Chapter 7, the Kernel normally uses
    virtual addresses. Any address returned by kmalloc(), valloc(), and similar interfaces
    is a virtual address and can be stored in a "void *". The virtual memory system
    (TLB, page tables, etc.) translates virtual addresses to CPU physical addresses,
    which are stored as phys_addr_t or resource_size_t.


    The Kernel manages device resources like registers as physical addresses. These
    are the addresses in /proc/iomem. The physical address is not directly useful
    to a driver; it must use the ioremap() function to map the space and produce a
    virtual address.'
  merge: -1
