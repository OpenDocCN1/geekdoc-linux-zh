  md: '# # Target File System Applications


    Several applications will be used during drivers development that should be properly
    installed in your i.MX6 filesystem:


    +   1. Dropbear SSH Server:


    Dropbear is a relatively small SSH server and client. It runs on a variety of
    POSIX based platforms. Dropbear is open source software, distributed under a MIT
    style license. It is particularly useful for embedded Linux (or other Unix) systems,
    such as wireless routers. Secure copy (scp) and secure shell (ssh) clients are
    included with the dropbear package. Go to https://matt.ucc.asn.au/dropbear/dropbear.html
    for further details.


    +   2. I2C-Tools:


    This package contains a heterogeneous set of I2C tools for the Linux Kernel. These
    tools were originally part of the lm-sensors project but were fairly split into
    their own package for convenience. They compile, run and have been tested on GNU/Linux.


    These are the main tools of the I2C tools suite:


    +   - i2cdect: User space program to scan an I2C bus for devices. It outputs a
    table with the list of detected devices on the specified bus.

    - i2cget: small helper program to read registers visible through the I2C bus (or
    SMBus)

    - i2cset: small helper program to set registers visible through the I2C bus.


    +   3. Evtest: Input device event monitor.


    Evtest is an open source tool that can be used for testing the USB HID class drivers
    and any other drivers based on event framework. It helps visualization of the
    event layer events that a USB HID device like a USB keyboard or a USB mouse or
    a keypad or a touchscreen might generate. Thus it can be used to test USB HID
    (USB Mouse and keyboard), keypad and touchscreen modules.


    The evtest tool supports:


