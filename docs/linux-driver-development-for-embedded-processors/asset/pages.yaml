- img_proc: true
  md: '# Memory Management Drivers


    ![](img/739a35b59067f8a55eff80a58765146f_281_0.png)


    Each task will have its own unique page tables residing in physical memory. Typically,
    much of the memory system is organized so that the virtual-to-physical address
    mapping is fixed, with page table entries that never change. This is typically
    used to contain operating system code and data, and also the page tables used
    by individual tasks. Whenever an application is started, the operating system
    will allocate itself a set of page table entries which map both the actual code
    and data used by the application to physical memory. If the application requires
    mapping in code or extra data space (for example through a malloc() call), the
    Kernel will subsequently modify these tables. When a task completes and the application
    is no longer running, the Kernel can remove any associated page table entries
    and re-use the space for a new application. Upon a task switch, the Kernel switches
    page table entries to the page in the next thread to run.


    The page tables are split in two and TTBR registers are used: TTBR0 points to
    the level 1 page table for User space processes (so the bottom range) and TTBR1
    to the level 1 page table for the Kernel space. During a context switch, only
    TTBR0 is changed and as a consequence the Kernel Kernel pages are always mapped.
    There will be different level 1 page table and level 2 page tables per process,
    the location of each level 1 page table is updated in a context switch via TTBR0.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Translation Lookaside Buffers (TLB)


    The Translation Lookaside Buffer (TLB) is a cache of page translations within
    the MMU. During memory access, the MMU first checks whether the translation is
    cached in the TLB. If the requested translation is available, we have a TLB hit,
    and the TLB provides the translation of the physical address immediately. If the
    TLB does not have a valid translation for an external page table walk is required.
    This newly loaded translation can then be cached in the TLB for possible reuse.


    The exact structure of the TLB differs between implementations of the ARM® processors.
    There are one or more micro-TLBs, which are situated close to the instruction
    and data caches. Addresses with entries which hit in the micro-TLB require no
    additional memory look-up and no cycle penalty. However, the micro-TLB has only
    small number of mappings (typically eight on the instruction side and eight on
    the data side). This is backed by a larger main TLB (typically 64 entries), but
    there may be some penalty associated with accesses which miss in the micro-TLB
    but which hit in the main TLB.


    ![](img/739a35b59067f8a55eff80a58765146f_282_0.png)'
