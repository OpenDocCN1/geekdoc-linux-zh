    \ struct of_device_id my_of_ids[] = {\n  .compatible = \"arrow,hellokeys\",\n\n\
    };\n```\n\n```\nMODULE_DEVICE_TABLE(of, my_of_ids);\n```\n\nCreate an array of\
    \ structs of_device_id's where you specify `.compatible` strings that the Kernel\
    \ will use to bind your driver to devices represented in the Device Tree when\
    \ the module is inserted. This will automatically trigger your driver's `probe()`\
    \ function if the Device Tree contains a compatible device entry.\n\n# 3. Add\
    \ a platform driver structure that will be registered to the platform bus:\n\n\
    ```\nstatic struct platform_driver my_platform_driver = {\n  .probe = my_probe,\n\
    \  .remove = my_remove,\n  .driver = {\n    .name = \"hellokeys\",\n    .of_match_table\
    \ = my_of_ids,\n    .owner = THIS_MODULE,\n  }\n};\n```\n\n4. After loading the\
    \ Kernel module, the function my_probe() will be called when a device matching\
    \ one of the supported device ids is discovered. The function my_remove() will\
    \ be called when the device is unloaded. Therefore my_probe does the role of the\
    \ hello_init function and my_remove does the role of the hello_exit function.\
