    a pad with a canonical name SD1_DAT1 has a pad mux register named IOMUXC_SW_MUX_CTL_PAD_SD1_DAT1,
    that is responsible for configuring the pad with five several different modes,
    as shown below:


    SD1_DATA1, ECSPI5_SS0, PWM3_OUT, GPT_CAPTURE2, and GPIO1_IO17.


    There''s also an IOMUXC_SW_PAD_CTL_PAD_SD1_DATA1 register for each pad that''s
    responsible for configuring the physical drive characteristic of the pad (e.g.,
    hysteresis, pull-up/down, speed, drive strength), which could, again, be mapped
    to any of the five functions above.'
