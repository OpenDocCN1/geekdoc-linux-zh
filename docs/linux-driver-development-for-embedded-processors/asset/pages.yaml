  md: '# # Chapter 4

    Character Drivers


    Typically, an operating system is designed to hide the underlying hardware details
    from the user or user application. Applications do, however, require the ability
    to access data that is captured by hardware peripherals, as well as the ability
    to drive peripherals with output. Since the peripheral registers are accessible
    only by the Linux Kernel, only the Kernel is able to collect data streams as they
    are captured by these peripherals.


    Linux requires a mechanism to transfer data from the Kernel to User space. This
    transfer of data is handled via device nodes, which are also known as virtual
    files. Device nodes exist within the root filesystem, though they are not true
    files. When a user reads from a device node, the Kernel copies the data stream
    captured by the underlying driver into the application memory space. When a user
    writes to a device node, the Kernel copies the data stream provided by the application
    into the data buffers of the device, which are eventually output via the underlying
    hardware. These virtual files can be opened and "read from" or "written to" by
    the user application using system calls.


    Each device has a unique driver that handles requests from user applications that
    are eventually passed to the core. Linux supports three types of devices: character
    devices, block devices and network devices. While the concept is the same, the
    difference in the drivers for each of these devices is in the manner in which
    the files are "opened" and "read from" or "written to". Character devices are
    the most common devices which are read and written directly without buffering.
    For example keyboards, monitors, printers, serial ports, etc. Block devices can
    only be written to and read from in multiples of the block size, typically 512
    or 1024 bytes. They may be randomly accessed i.e., any block can be read or written
    no matter where it is on the device. A classic example of a block device is a
    hard disk device. Network devices are accessed via the BSD socket interface and
    the networking subsystems.'
  merge: -1
  pgno: 124
- img_proc: true
  md: "# Character Drivers\n\nCharacter devices are identified by a 'c' in the first\
    \ column of a listing, and block devices are identified by a 'b'. The access permissions,\
    \ owner, and group of the device is provided for each device.\n\nFrom the point\
    \ of view of an application, a character device is essentially a file. A process\
    \ only knows a /dev file path. The process opens the file (using open()) system\
    \ call) and performs standard file operations (e.g., read(), write()).\n\nIn order\
    \ to achieve this, a character driver must implement the operations described\
    \ in the struct file_operations structure (defined as struct type in Linux/include/linux/fs.h)\
    \ and register them. In the file_operations struct below only some of the most\
    \ common operations for a character driver are shown:\n\n```\nstruct file_operations\
    \ {\n    ssize_t (*read) (struct file *, char __user *,\n                   size_t,\
    \ loff_t *);\n    ssize_t (*write) (struct file *, const char __user *,\n    \
    \               size_t, loff_t *);\n    long (*locked_ioctl) (struct file *,\n\
    \                unsigned int, unsigned long);\n    int (*mmap) (struct file *,\
    \ struct vm_area_struct *);\n    int (*open) (struct inode *, struct file *);\n\
    \    int (*release) (struct inode *, struct file *);\n};\n```\n\nThe Linux filesystem\
    \ layer will ensure that the driver's operations are called when a User space\
    \ application makes the corresponding system call (On the Kernel side the driver\
    \ implements and registers callback operations)."
  merge: -1
