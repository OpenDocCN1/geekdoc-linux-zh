    The events/n threads implement workqueues. Workqueues are a general mechanism
    for deferring work. They are not limited in usage to handling interrupts. The
    workqueue contains a linked list of tasks (bottom half works) to be run at a deferred
    time.


    Workqueues let your driver create a Kernel thread'
