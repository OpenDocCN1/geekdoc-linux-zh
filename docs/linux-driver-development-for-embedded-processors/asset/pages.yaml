  md: "# # Chapter 3\n The Simplest Drivers\n\nA key concept in the design of the\
    \ Linux embedded system is the separation of user applications from the underlying\
    \ hardware. User space applications are not allowed to access peripheral registers,\
    \ storage media or even RAM memory directly. Instead, the hardware is accessed\
    \ via Kernel drivers, and RAM memory is managed by the memory management unit\
    \ (MMU), with applications operating on virtual addresses.\n\nThis separation\
    \ provides robustness. If it is assumed that the Linux Kernel is operating correctly\
    \ then allowing only the Kernel to interact with underlaying hardware keeps applications\
    \ from accidentally or maliciously misconfiguring hardware peripherals and placing\
    \ them in unknown states.\n\nThis separation provides portability. If only the\
    \ Kernel drivers manage the hardware specific code, these drivers need to be modified\
    \ in order to port a system from one hardware platform to another. Applications\
    \ access a set of driver APIs that is consistent across hardware platforms, allowing\
    \ applications to be moved from one platform to another with little or no modification\
    \ to the source code.\n\nDevice drivers can be Kernel modules or statically built\
    \ into the Kernel image. The default Kernel builds most drivers into the Kernel\
    \ statically so they are started automatically. A Kernel module is not necessarily\
    \ a device driver; it is an extension of the Kernel. The Kernel modules are loaded\
    \ into virtual memory of the Kernel. Building a device driver as a module makes\
    \ the development easier since it can be loaded, tested, and unloaded without\
    \ rebooting the Kernel. The Kernel modules are usually located in /lib/modules/<kernel_version>\
    \ on the root filesystem."
  merge: -1
  pgno: 112
- img_proc: true
  md: '# The Simplest Drivers


    Every Linux Kernel module has an init() and an exit() function. The init function
    is called once when the driver is loaded and the exit function is called when
    the driver is removed. The init() function lets the OS know what the driver is
    capable of and what of its function be called when a certain event takes place
    (e.g., register driver to the bus, register a char device.. The exit() function
    free all the resources that were requested by the init function.


    Macros module_init() and module_exit() export the symbols for the init and exit
    functions such that the Kernel code that loads your module can identify these
    entry points.


    There are a collection of macros used to identify various attributes of a module.
    These strings get packaged into the module and can be accessed by various tools.
    The most important module description macro is the MODULE_LICENSE macro. If this
    macro is not set to some sort of GPL license tag, the Kernel will become tainted
    when you load your module. When the Kernel is tainted, it means it is in a state
    that is not supported by the community. Most Kernel developers will ignore bug
    reports involving tainted kernels, and community members may ask that you correct
    the tainting condition before they can proceed with diagnosing problems related
    to the Kernel. In addition, some debugging functionality and API calls may be
    disabled when the Kernel is tainted.


    # Licensing


    The Linux Kernel is licensed under the GNU General Public License version 2. This
    license gives you the right to use, study, modify and share the software freely.
    However, when the software is redistributed, modified or unmodified, the GPL requires
    that you redistribute the software under the same license, with the source code.
    If modifications are made to the Linux Kernel (for example to adapt it to your
    hardware), it is a derivative work of the Kernel, and therefore must be released
    under GPLv2. However, you''re only required to do so at the time the device starts
    to be distributed to your customers, not to the entire world.


    The Kernel modules provided in this book are released under the GPL license. For
    more information on open source software licenses please see http://opensource.org/licenses.'
