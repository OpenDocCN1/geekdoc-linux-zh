    ```

    ~/solidrun-release-bsp/poky/build$ cat pn-depends.dot | grep -v -e

    ''-native'' | grep -v digraph | grep -v ''image'' | awk ''{print $1}'' |

    sort uniq core-image-x11.txt

    ```


    ```

