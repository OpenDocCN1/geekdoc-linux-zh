  md: "Free the allocated private structure. Using the devm* managed API allows automatic\
    \ freeing of device or module release time. In this driver you will add devm*\
    \ functions to the ioaccel_remove() function purely for educational purposes.\n\
    \n```\ndevm_kfree(&client->dev, ioaccel);\n```\n\n11. Write the ioaccel_poll()\
    \ function. This function will be called every 50ms, the OUT_MSB register (0x01)\
    \ of the m8ba8451 accelerometer will be read (using i2c_smbus_read_byte_data(i)).\
    \ The first parameter of the i2c_smbus_read_byte_data(i) function is a pointer\
    \ to our i2c_client structure. This function will allow you to get the m8ba8451\
    \ i2c address (0x1c). The 0x1c value will be retrieved from client->address. After\
    \ binding, the i2c bus driver gets this i2c address value from the ioaccel Tree\
    \ node and stores it in the i2c_client structure. After that, the value is sent\
    \ to the ioaccel_probe() function via a client pointer variable that to this i2c_client.\n\
    \nTwo input events KEY_1 and KEY_2 will be reported with values of 0 or 1 depending\
    \ on the SABRE board's tilt. You can use a different range of values to report\
    \ these events.\n\n```\nstatic void ioaccel_poll(struct input_pooled_dev *pl_dev)\n\
    {\n    struct ioaccel_dev *ioaccel = pl_dev->private;\n    int val = 0;\n    val\
    \ = i2c_smbus_read_byte_data(ioaccel->i2c_client,\n        OUT_X_MSB);\n\n   \
    \ /* 0x10 < val < 0x20 -> generate KEY 1 */\n    /* 0x20 < val < 0xe0 -> generate\
    \ KEY 2 */\n    if ( (val > 0x10) && (val < 0xe0) {\n        input_event(ioaccel->pooled_input->input,\n\
    \            EV_KEY, KEY_1, 1);\n    } else {\n        input_event(ioaccel->pooled_input->input,\n\
    \            EV_KEY, KEY_1, 0);\n    }\n    if ( (val > 0x20) && (val < 0xe0)\
