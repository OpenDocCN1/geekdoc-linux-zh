    # System Call Interface and C Runtime Library


    The system call is the fundamental interface between an application and the Linux
    Kernel. System calls are the only means by which a User application can interact
    with the Kernel. In other words, they are the bridge between the User space and
    kernel space ensures that User space programs cannot freely access Kernel internal
    resources, ensuring the security and stability of the system. The system calls
    elevate the privilege of the User process.


    The system call interface is generally not invoked directly (even though it could
    be) but rather through wrapper functions over the C runtime library. Some of these
    wrapper functions are only thin layers over the system call (just checking and
    setting the calls parameters) while others add additional functionality. The following
    image shows some system calls and their descriptions:'
