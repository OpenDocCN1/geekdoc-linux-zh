  md: "# Device Drivers\n\nEvery device driver registers itself with the bus_type\
    \ using driver_register(). After that the device model core tries to bind it with\
    \ a device. When a device that can be handled by a particular driver is detected,\
    \ the probe() member of the driver is called and the device configuration data\
    \ can be retrieved from the Device Tree node for non-discoverable devices.\n\n\
    Each device driver is responsible for instantiating and registering an instance\
    \ of the struct device_driver (located in Linux/include/linux/device.h) with the\
    \ device model core. The struct device_driver is defined as:\n\n```\nstruct device_driver\
    \ {\n    const char *name;\n    struct bus_type *bus;\n\n    struct module *owner;\n\
    \    const char *mod_name;\n\n    bool suppress_bind_attrs;\n\n    const struct\
    \ of device_id *of_match_table;\n    struct acpi_device_id *acpi_match_table;\n\
    \n    int (*probe) (struct device *dev);\n    int (*remove) (struct device *dev);\n\
    \    void (*shutdown) (struct device *dev);\n    int (*suspend) (struct device\
    \ *dev, pm_message_t state);\n    int (*resume) (struct device *dev);\n    const\
    \ struct attribute_group **groups;\n\n    const struct dev_pm_ops *pm;\n\n   \
    \ struct driver_private *p;\n};\n```\n\nThe bus member is a pointer to the bus_type\
    \ to which the device driver is registered.\n\nThe probe member is a callback\
    \ function that is called for each device detected that is supported by the driver.\
    \ The driver should instantiate itself for each device and initialize the device\
    \ as well.\n\nThe remove member is a callback function that is called to unbind\
    \ the driver from the device. This happens when the device is physically removed,\
