    Linux is a clone of the operating system Unix, written from scratch by Linus Torvalds
    with assistance from a loosely-knit team of hackers across the Net. It aims towards
    POSIX and Single Unix Specification compliance.


    It has all the features you would expect in a modern fully-fledged Unix implementation,
    including true multitasking, virtual memory, shared libraries, demand loading,
    copy-on-write executables, proper memory management, and multitask networking
    including IPv4 and IPv6.


    Although originally developed for 32-bit x86-based PCs (386 or higher), today
    Linux also runs on a multitude of processor architectures, in both 32 and 64-bit
    variants.


    The Linux Kernel is the lowest level of software running on a Linux system. It
    is charged with managing the hardware, running User Programs, and maintaining
    the overall security and integrity of the whole system. It is this Kernel which,
    its initial release by Linus Torvalds in 1991, jump-started the development of
    Linux as a whole. The Kernel is a relatively small part of the software on a full
    Linux system (many other large components from the GNU project, the GNOME and
    KDE desktop projects, the X.org project, and many other sources), but the Kernel
    is the core which determines how well the system will work and is the piece which
    is truly unique to Linux.


    The Kernel which forms the core of the Linux system is the result of one of the
    largest software projects ever attempted. Regular two-to-three month releases
    deliver updates to Linux users, each with new features, added device support,
    and improved performance. The rate of change in the Kernel is high and increasing,
    with over 10,000 patches going into each Kernel release. Each of these releases
    contains the work of more than 1,600 developers representing over 200 corporations.


    As Kernels move from the mainline into the stable category, two things can happen:


    +   1. They can reach End of Life after a few bugfix revisions, which means that
    Kernel maintainers will release no more bugfixes for this Kernel version, or

    2. They can be put into longterm maintenance, which means that maintainers will
    provide bugfixes for this Kernel revision for a much longer period of time.


    If the version you are using is marked EOL, you should consider upgrading to the
    next major version as there will be no more bugfixes provided for the Kernel version
    you are using.'
