  md: "These are the main steps to use workqueues:\n\n+   1. Create a workqueue (workqueue_struct)\
    \ with one or more associated Kernel threads.\n2. Create Kernel thread/s to service\
    \ the workqueue_struct using create_singlethread_workqueue(), create_workqueue()\
    \ or using default events/n worker threads. Kernel threads run functions submitted\
    \ to the workqueue.\n3. Create a work element (work_struct), an object of type\
    \ struct work_struct identifies the deferred work and handler function to use.\
    \ It is initialized using INIT_WORK(), where the first argument points to space\
    \ allocated by kmalloc and the second argument is a function that does the deferred\
    \ work.\n4. Submit the work element to the workqueue_struct using queue_work(),\
    \ or to the default Kernel worker thread using schedule_work().\n5. Kernel worker\
    \ threads extract work from the workqueue and activate the specified bottom-half\
    \ handler.\n\n![](img/739a35b59067f8a55eff80a58765146f_240_0.png)\n\n# Workqueue\
    \ Process Control\n\n+   1. A \"work\" item is created as shown in the example\
    \ below:\n\n```\nstruct ADC_data {\n    struct work_struct work;\n};\n```"
