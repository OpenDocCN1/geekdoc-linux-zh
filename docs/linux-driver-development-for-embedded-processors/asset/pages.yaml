  md: '# Chapter 6


    The other half of the picture, of course, is waking up. Some thread of execution
    (a different process, or an interrupt handler) has to perform the wakeup for you,
    since your process is, of course, asleep. The basic function that wakes up sleeping
    processes is called wake_up. It comes in several forms (but only two of them will
    be reviewed now):


    ```

    void wake_up(wait_queue_head_t *queue); /* wake up all processesnwaiting on the
    given queue *7

    void wake_up_interruptible(wait_queue_head_t *queue); /* restricts itself to processes
    an interruptible sleep /*

    ```


    You are going to develop a Kernel module that causes a process to sleep and then
    wakes it via an interrupt. You can check the driver behavior in the image below.
    When the user application attempts to read (system call) from the device the process
    is to sleep. Every time we press or release the SW5 button, the generated interrupt
    will wake the process and the driver’s read callback function will send to User
    space the type of interrupt that was set (Press or Release). Once you have exited
    the user application, you can read all the interrupts were generated from a file.


    ![](img/739a35b59067f8a55eff80a58765146f_252_0.png)


