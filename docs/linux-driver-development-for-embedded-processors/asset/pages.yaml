  md: '# LAB 9.1: "Input subsystem accelerometer" Module


    ![](img/739a35b59067f8a55eff80a58765146f_354_0.png)


    In this Kernel module you will control the SABRE on-board NXP i2c MMA8451 accelerometer.
    Go to http://www.nxp.com/products/sensors/accelerometers/3-axis-accelerometers/2g-4g-8g-low-g-14-bit-digital-accelerometer:MMA8451Q
    to get the recommended documentation and data-sheet of this device.


    The MMA8451 is attached to the i2c1 bus controller of the i.MX6 processor. The
    SABRE board is being used as a steering wheel. Our driver will scan periodically
    the value of one of the accelerometer axes, and depending of tilt of the SABRE
    board generates different events that are exposed to the application evtest.


    In the accelerometer Kernel module you will use the polled input. A polled input
    device provides a skeleton for supporting simple input devices that do not raise
    interrupts but have to be periodically scanned or polled to detect changes in
    their state.


    A polled input device is described by the struct input_polled_dev structure (located
    in Linux/include/linux/input-polldev.h):'
  merge: -1
  pgno: 354
- img_proc: true
  md: "```\nstruct polled_dev {\n    void *private;\n\n    void (*open)(struct input_polled\
    \ dev *dev);\n    void (*close)(struct input_polled dev *dev);\n    void (*poll)(struct\
    \ input_polled dev *dev);\n    unsigned int poll_interval; /* msec */\n    unsigned\
    \ int poll_interval_max; /* msec */\n    unsigned int poll_interval_min; /* msec\
    \ */\n\n    struct input_dev *input;\n};\n```\n\n/* private: */\nstruct delayed_work\
    \ work;\n};\n\nYou will allocate and free the struct input_polled_dev using the\
    \ functions:\n\n```\nstruct input_polled_dev *allocate_polled_device(void);\n\
    void input_free_polled_device(struct input_polled_dev *dev);\n```\n\nThe accelerometer\
    \ driver will support KEY events, with KEY_1 and KEY_2 events that will be depending\
    \ of the SABRE board's tilt; set_bit() is an atomic operation allowing it to set\
    \ a particular bit to 1.\n\n```\nset_bit(EV_KEY, ioaccel->input_polled->input->evbit);\
    \ /* supported event types (support for EV_KEY events) */\nset_bit(KEY_1, ioaccel->input_polled->input->keybit);\
    \ /* Set the event code support (event KEY_1) */\nset_bit(KEY_2, ioaccel->input_polled->input->keybit);\
    \ /* Set the event code support (event KEY_2) */\n```\n\nThe struct input_polled_dev\
    \ will be handled by the poll() callback function. This function handles the device\
    \ and posts input events. The poll_interval field will be set to 50 ms in your\
    \ driver. Inside the poll() function events are set by the driver using the following\
    \ handler:\n\n```\ninput_event(struct input_dev *dev, unsigned int type, unsigned\
    \ int code,\nint value);\n```\n\nAfter submitting the events, the input core must\
    \ be notified using the function:\n\n```\nvoid input_sync(struct input_dev *dev);\n\
    ```\n\nThe device registration/unregistration is done with the following functions:\n\
    \n```\nint input_register_polled_device(struct input_polled_dev *dev);\nvoid input_unregister_polled_device(struct\
    \ input_polled_dev *dev);\n```"
