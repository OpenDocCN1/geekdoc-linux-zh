  md: '# LAB 9.2: "IIO subsystem DAC" Module


    User Space


    ![](img/739a35b59067f8a55eff80a58765146f_372_0.png)


    This new Kernel module will control the Linear Technology LTC2607 device. The
    LTC2607 is a dual 12-bit, 2.7V to 5.5V rail-to-rail voltage output DAC. It uses
    a 2-wire, i2c compatible serial interface. The LTC2607 operates in both the standard
    mode (clock rate of 100kHz) and the fast mode (clock rate of 400kHz).


    The driver will control each LTC2607 internal DAC individually or both DAC + B
    in a simultaneous mode. The IIO framework will generate three separate sysfs files
    (attributes) used for sending data to the dual DAC from the User space application.


    The i2c bus will be taken from the SABRE Board Mini-PCIE connector. Pin 30 is
    the i2c CLK and Pin 32 is the i2c DATA. These pins are connected to the i.MX6
    i2c3 bus controller.


    Open the SABRE schematic and look for the Mini-PCIE connector on page 16:'
  merge: -1
