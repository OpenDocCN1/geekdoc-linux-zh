    \ = param;\n    return true;\n}\n```\n\n6. Create a \"completion\" event:\n\n\
    A common pattern in Kernel programming involves initiating some activity outside\
    \ of the\ncurrent thread, waiting for that activity to complete. This activity\
    \ can be the creation of\na new Kernel thread or User space process, a request\
    \ to an existing process, or some sort\nof hardware-based action (like a DMA transfer).\
    \ In such cases, it can be tempting to use a\nsemaphore for synchronization of\
    \ the two tasks, with code such as:\n\n```\nstruct semaphore sem;\ninit MUTEX_LOCKED(&sem);\n\
    start external_task(&sem);\ndown(&sem);\n```\n\nThe external task can then call\
    \ up(&sem) when its work is done. As is turns out, semaphores\nare not the best\
    \ tool to use in this situation. In normal use, code attempting to lock a\nsemaphore\
    \ finds that semaphore available almost all the time; if there is significant\n\
    contention for the semaphore, performance suffers and the locking scheme needs\
    \ to be\nreviewed. Semaphores have been heavily optimized for the available case.\
    \ When used\nto communicate task completion in the way shown above, however, the\
    \ calling down\nwill always have to wait; performance will suffer accordingly.\
    \ Semaphores can also be\nubject to a (difficult) race condition when used in\
    \ this way if they are declared as automatic\nvariables. In some cases, the semaphore\
    \ can vanish before the process calling up is finished\nwith it.\n\nThese concerns\
    \ inspired the addition of the completion interface in the 2.4.7 Kernel.\nCompletions\
    \ are a lightweight mechanism with one task: one thread to tell another\nthat\
    \ the job is done. Create a dynamic completion event in your driver with:"
