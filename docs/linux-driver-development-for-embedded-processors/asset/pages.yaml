    \ simply expands\nthis (located in Linux/include/linux/init.h):\n\n```\n#define\
    \ module_init(x)    __initcall(x);\n```\n\nand then you follow this (located in\
    \ Linux/include/linux/init.h):\n\n```\n#define __initcall(fn)          device_initcall\n\
    #define device_initcall(fn)    device_initcall(fn, 6)\n```\n\nSo, now, module_init(my_func)\
    \ means __define_initcall(my_func, 6). This is _define_initcall:\n\n```\n#define\
    \ __initcall(fn, id) \\\\\n    static inlinecall_t  __initcall##fn##  used \\\\\
    \n    attribute((__section(\".initcall\" \"#id .init\"))) = fn\n```\n\nwhich means,\
    \ so far, you have:\n\n```\nstatic __initcall my_func6  used\n    attribute((__section(\"\
    .initcall6.init\\))) = fn;\n```\n\nThis means a new symbol is created, __initcall_my_func6,\
    \ that's put in the ELF section\nnamed .initcall6.init, and as you can see, it\
    \ points to the specific function (fn). Adding all\nthe functions to this section\
