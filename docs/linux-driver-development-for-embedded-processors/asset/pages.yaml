  md: 'This macro is defined as the structure that describes the machine, or the board.
    It contains more members than a name and a type. These members are part of the
    machine_desc structure that is declared with the macro.


    The MACHINE_START macro becomes a data structure when the compiler builds the
    file that holds it. Usually this structure is declared in a file where the initialization
    of the current board is made. This means the file is inside the mach-xx folder
    as well can be seen in the __mach_desc_MX6Q_SABRESdata structure example.


    The bootloader needs to be modified to pass the right machine number. If you are
    using U-Boot, you need to copy the machine numbers generated by Linux/arch/arm/include/asm/machtypes.h
    to the U-Boot file Linux/arch/arm/include/asm/mach-types.h.


    The bootloader creates and initializes a Kernel-tagged list that contains the
    information such as size and location of the system memory (RAM). The bootloader
    sets the register r0 to zero, r1 to the ARM® machine number, and r2 to the physical
    address of the tagged list (ATAG pointer in R2) and finally calls the compressed
    Kernel image.


    The ATLASS is a list of tagged elements, each starting with length and a tag (e.g.,
    ATAG_CORE, ATAG_CMDLINE, ATAG_MEM, ATAG_NONE). The physical layout information
    is passed to the Kernel with the ATAG_MEM parameter. This parameter contains two
    fields, one for the size of memory, and another for the physical start address
    of this memory. The value is overridden by the Kernel command line parameter mem,
    and by using this, the bootloader passes the size of the physical memory.


    The specific function for the tag retrieving is void __init_setup_arch(char **cmndline_p)
    (located in Linux/arch/arm/kernel/setup.c). This function is called from the function
    asmlinkage void __init_start_kernel(void) (located in Linux/init/main.c).'
