    A bare attribute contains no means to read or write the value of the attribute.
    Subsystems


    In the Linux device model each structure (bus, driver, device) has an embedded
    kobject

    al also an attribute structure that can be exported to sysfs. See below the device_attribute

    structure for the device:


    ```

    struct device_attribute {

    struct attribute attr;

    size_t (*show) (struct device *dev, struct device_attribute *attr,

    char (*buf);

    size_t (*store) (struct device *dev, struct device_attribute

    *attr, const char *buf, size_t count);

    };

    ```


    The attributes can be created with the following macros:


    +   - BUS ATTR(name, mode, show, store);

    - DEVICE ATTR(name, mode, show, store);

    - DRIVER ATTR(name, mode, show, store);


    For example, declaring:


    ```

    static DEVICE ATTR(foo, S_IWUSR | S_IRUGO, show_foo, store_foo);

    ```


    is equivalent to doing:


    ```

    static struct device_attribute dev_attr_foo = {

    .attr = {

    .name = "foo",

    .mode = S_IWUSR | S_IRUGO,

    }

    .show = show_foo,

    .store = store_foo,

    };

    ```


    The macro DEVICE_ATTR() is used to create the attribute and requires the following
    inputs:


    +   - A name for the attribute in the filesystem.

    - Permissions which determine if the attribute can be read and/or written. The
    macros for\modes are defined in Linux/include/linux/stat.h.

    - A function to read the data from the driver.'
