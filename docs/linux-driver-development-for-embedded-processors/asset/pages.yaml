  md: '# Building the System


    To install the repo utility, perform these steps:


    +   1. Create a bin folder in the home directory:


    ```

    $ mkdir ~/bin

    $ curl http://commondatatastorage.googleapis.com/git-repo-downloads/repo >n~/bin/repo

    $ chmod a+x ~/bin/repo

    ```


    +   2. Add the following line to the .bashrc file to ensure that the ~/bin folder
    is in your PATH variable:


    ```

    export PATH=~/bin:$PATH

    ```


    # Yocto Project Setup


    The NXP Yocto Project BSP Release directory contains a "sources" directory, which
    contains the recipes used to build, one or more build directories, and a set of
    scripts used to set up the environment.


    The recipes used to build the project come from both the community and NXP. The
    Yocto Project layers are downloaded and placed in the sources directory. This
    sets up the recipes that are used to build the project.


    The following example shows how to download the NXP Yocto Project Community BSP
    recipe layers. For this example, a directory called "fsl-release-bsp" is created
    for the project:


    ```

    $ mkdir fsl-release-bsp

    $ cd fsl-release-bsp

    $ git config --global user.name "Your Name"

    $ git config --global user.email "Your Email"

    $ git config --list

    $ repo init -u git://git.freescale.com/imx/fsl-arm-yocto-bsp.git -b imx-

    3.13.14.28-1.0.0 ga

    $ repo sync

    ```


    When this process is completed, the source code is checked out into the directory
    fsl-release-bsp/sources.


    You can perform periodic repo synchronization with the command "repo sync" to
    update the latest code.'
