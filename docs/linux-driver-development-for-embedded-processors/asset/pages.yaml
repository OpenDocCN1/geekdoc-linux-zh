    # LAB 7.1: "Linked list memory allocation" Module


    ![](img/739a35b59067f8a55eff80a58765146f_303_0.png)


    In this Kernel module you will allocate a circular single linked list composed
    of several nodes in the Kernel memory. Each node will be composed of two variables:


    +   1. A char *buffer that points to a memory buffer allocated with devm_kmalloc()
    using a "for" loop.


    +   2. A "next" pointer that points to the next node of the linked list.


    The linked list will be managed through the variable items of a structure named
    liste.'
