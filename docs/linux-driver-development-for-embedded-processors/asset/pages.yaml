  md: '# Bootloader


    Linux cannot be started in an embedded device without a small amount of machine
    specific code to initialize the system. Linux requires the bootloader code to
    do very little, although several bootloaders provide extensive additional functionality.
    The minimal requirements are:


    +   - Configuration of the memory system.

    - Loading of the Kernel image and the Device Tree at the correct addresses.

    - Optional loading of an initial RAM disk at the correct memory address.

    - Setting of the Kernel command-line and other parameters (e.g. Device Tree, machine
    type).


    It is also usually expected that the bootloader initializes a serial console for
    the Kernel in addition to these basic tasks.


    There are different bootloader options that come in all shapes and sizes. U-Boot
    is the standard bootloader for ARM® Linux. The i.MX Linux BSP used throughout
    this book contains the U-Boot v2014.04 package. The U-Boot Mainland is located
    at http://git.denx.de/u-boot.git


    These are some main of U-Boot features:


    +   1. Small: U-Boot is a bootloader, i.e. its primary purpose in the system is
    to load an operating system. That means U-Boot is necessary to perform a certain
    task, but it is not worth spending significant resources on. Typically U-Boot
    is stored in the relatively small NOR flash memory, which is expensive compared
    to the much larger NAND devices normally used to store the operating system and
    the application.


    A usable and useful configuration of U-Boot, including a basic interactive command
    interpreter, support for download over Ethernet and the capability to program
    the flash should fit in no more than 128 KB.


    +   2. Fast: The user is not interested in running U-Boot. In most embedded systems
    they are not even aware that U-Boot exists. The user wants to run some application
    code, and they want to do that as soon as possible after switching the device.
    Initialize devices only when they are needed within U-Boot, i don''t initialize
    the Ethernet interface(s) unless U-Boot performs a download over Ethernet; don''t
    initialize any IDE or USB devices unless U-Boot actively tries to load files from
    these, etc.


    +   3. Portable: U-Boot is a bootloader, but it is also a tool for board bring-up,
    for production testing, and for other activities that are very closely related
    to hardware development. So far, it has been ported to several hundreds of different
    boards on about 30 different processor families.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '4. Configurable: U Boot is a powerful tool with many, many extremely useful
    features. The maintainer or user of each board will have to decide which features
    are important and what shall be included with their specific board configuration
    to meet the current requirements and restrictions.


    5. Debuggable: U-Boot is not only a tool, it is also also for hardware bring-up,
    so debugging U Boot often means that you don''t know if you are tracking a problem
    in the U-Boot software or in the hardware you are running on. Code that is clean
    and easy to understand and debug is all the more important to everyone. One important
    feature of U-Boot is to enable output to the (usually serial) console as soon
    as possible in the boot process, if ever this causes tradeoffs in other areas
    like memory footprint. All initialization steps shall print "begin doing this"
    message before they actually start, and some "done" message when they complete.
    For example, RAM initialization and size detection print a "RAM: before they start
    and "256 MB\n" when done. The purpose of this is that you can always see which
    initialization step was running if any problems occur. This is important not only
    during software development, but also for the service people dealing with broken
    hardware in the field. U-Boot should be debuggable with simple JTAG or BDM equipment.
    It should use a simple, single-threaded execution model.


