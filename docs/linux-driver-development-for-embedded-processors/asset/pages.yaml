    The PIN_FUNC_ID max needed (located in Linux/arch/arm/boot/dts/imx6q-pinfunc.h)
    to mux this pad as a GPIO is MX6Q0L_PAD_GPIO_2__GPIO1_I002.


    If you apply the bank/bit to the Linux User space formula:


    linux gpio number = (gpio_bank - 1) * 32 + gpio_bit


    GPIO1_I002 maps to (1-1) * 32 + 2 = 2, so we will control the LED using bit 2
    of the first GPIO data register GPIO1_DR, and its corresponding GPIO direction
    register GPIO1_GDIR. The 32-bit GPIO_DR register stores data that is ready to
    be driven to the output lines. If the IOMUXC is in GPIO mode and a given GPIO
    direction bit is set, then the corresponding DR bit is driven to the output. If
    a given GPIO direction bit is cleared, then a read of GPIO_DR reflects the value
    of the corresponding signal.


