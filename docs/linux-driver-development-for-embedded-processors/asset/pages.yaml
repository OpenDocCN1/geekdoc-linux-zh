    to help that process by completing the initialization of that VMA.


    The Linux frame buffer and the Video 4 Linux, version 2 (V4L2) are two examples
    of drivers that use the mmap() function to map Kernel buffers to the User space.


    See in the figure below how the memory is mapped from the Kernel to the User space
    using mmap():


    ![](img/739a35b59067f8a55eff80a58765146f_341_0.png)


    +   1. See the main points below to implement mmap() in the User space:


    +   - The call to mmap() requires an address and size for the memory being mapped
    into the space.

    - The application passes zero for the address to map, since it doesn''t know the
    address of the buffer allocated in the Kernel driver.

    - The size cannot be zero or mmap() will return an error.


    ```

