  md: '# About the Author


    Alberto Liberal is a Field Application Engineer at Arrow Electronics withover
    15 years of experience in embedded systems. For the last few years at Arrow he
    has been supporting high-end processors and FPGAs, Alberto is a Linux fan and
    has presented numerous technical seminars and practical workshops about Embedded
    Linux and Linux device drivers during the past few years. Alberto ''s other fields
    of expertise include multimedia SoCs and real-time operating systems (RTOS). He
    currently lives in Madrid, Spain, and his great passion is taking long walks with
    his daughter through the center of Madrid. He also enjoys reading about cinema
    and watching sci-fi movies.'
