  md: '# Creating Device Files with devmtmps


    Before Linux 2.6.32, on basic Linux systems, the device files had to be created
    manually using the mknod command. The coherency between device files and devices
    handled by the Kernel was left to the system developer. With the 2.6 series of
    stable Kernel, a new virtual filesystem called sysfs came about. The job of sysfs
    is to export a view of the system''s hardware configuration to the User space
    processes.


    You may wonder how sysfs knows about the devices present on a system and what
    device numbers should be used for them. Drivers that have been compiled into the
    Kernel directly register their objects with a sysfs as they are detected by the
    Kernel. For drivers compiled as modules, this registration will happen when the
    module is loaded. Once the sysfs filesystem is mounted (on /sys), data that the
    drivers register with sysfs is available to the User space processes and for processing
    (including modifications to device nodes). The Kernel uses sysfs to export device
    nodes to User space to be used by udev.


    Device files are created by the Kernel via the devmtmps filesystem. Any driver
    that wishes to register a device node will go through the devmtmps (via the core
    driver) to do it. When a devmtmps instance is mounted on /dev, the device node
    will initially be created with a fixed name, permissions, and owner. All device
    nodes are owned by root and have the default mode of 0600.


    Shortly after, the Kernel will send a udevd. Based on the files within the /etc/udev/rules.d,
    /lib/udev/rules.d, and /run/udev/rules.d directories, udev will create additional
    symlinks to the device node, or change its permissions, owner, or group, or modify
    the internal udev database entry (name) for that object. The rules in these three
    directories are numbered and all three directories are merged. If udev cannot
    find a rule for the device it is creating, it will leave the permissions and ownership
    at whatever devmtmps used initially.


    The CONFIG_DEVMTMPS_MOUNT Kernel option makes the Kernel mount devmtmps automatically
    at boot except booting in an initramfs.


    Use a terminal where the "environment-set-cortex9hf-vfp-non-pok-linux-gnueabi"
    was not sourced and open the menuconfig window. Navigate from the main menu ->
    Device Drivers -> Generic Driver Options -> Maintain a devmps说什么 to mount at /dev.
    Hit <spacebar> once to see a <* appear next to the new configuration as shown
    in the figure below. Hit <Exit> until you exit the menuconfig GUI and remember
    to save the new configuration.'
  merge: -1
  pgno: 138
