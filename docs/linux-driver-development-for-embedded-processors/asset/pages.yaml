    The runtime library (C-standard library) defines macros, type definitions and
    functions for string handling mathematical functions, input/output processing,
    memory allocation and several other functions that rely on OS services. The runtime
    library provides applications with access to OS resources and functions by abstracting
    the OS system interface.


    Several C libraries are available: glibc, uClibc, eglibc, dietlibc, newlib. The
    choice of the C library must be made at the time of the cross-compiling toolchain
    generation, as the GCC compiler is compiled against a C library.


    The GNU C library, glibc, is the default C library used in the Yocto project.
    The GNU C Library is primarily designed to be a portable and high performance
    C library. It follows all relevant standards including ISO C11 and POSIX1-2008.
    It is also internationalized and has one of the most complete internationalization
    interfaces known. You can find the glibc manual at https://www.gnu.org/software/glibc/manual/


    # System Shared Libraries


    System shared libraries are libraries that are loaded by programs when they start.
    When a shared library is installed properly, programs that start afterwards use
    the new shared library. System shared libraries are typically linked with a User
    application to provide it access to a specific system functionality. This functionality
    can be either self-contained like compression or encryption algorithms or access
    to underlying Kernel resources or hardware. In the latter case the library provides
    a simple API that abstracts the complexities of the Kernel or direct access.


    In other words, system shared libraries encapsulate system functionality and therefore
    are an essential building block when building applications that interact with
    the system. Every shared library has a special name called the "soname". The soname
    has the prefix "lib", the name of the library, the phrase \so", followed by a
    period and a version number that is incremented whenever the interface changes
    (as a special exception, the lowest-level) C'
