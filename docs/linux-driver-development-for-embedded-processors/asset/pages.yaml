  md: '# Building the System


    # Setting up Yocto on the HummingmingBoard


    The HummingBoard uses the NXP i.MX6 System-on-a-Chip. The BSP layer for this SoC
    is meta-fsl-arm. It is actively maintained, supports several i.MX6 based systems,
    and contains recipes for NXP specific software, like the GPU and VPU libraries,
    U-Boot and Linux Kernel forks etc. Support for additional platforms is contained
