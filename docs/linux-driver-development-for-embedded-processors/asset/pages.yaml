  md: '# # Debugfs Virtual Filesystem


    Debugfs exists as a simple way for kernel developers to make information available
    to user space. Unlike /proc, which is only meant for information about a process,
    or sysfs, which has strict one-value-per-file rules, debugfs has no rules at all.
    Developers can put any information they want there. The debugfs filesystem is
    also intended to not serve as a ABI to user space; in theory, there are no stability
    constraints placed on files exported there.


    The debugfs filesystem is mounted automatically at startup but this is not always
    the case. If you need to mount it:


    ```

    root@imx6qsabres:~# mount -t debugfs none /sys/kernel/debug/

    ```


    Moreover, it has to be in the kernel configuration. Use a terminal from which
    the environment-cortexa9hf-vfp-non-poky-linux was sourced and open the menocfig
    window. Navigate from the main menu -> Kernel hacking -> Compile-time checks and
    compiler options -> Debug Filesystem. <space> once to see a * appear next to the
    new configuration as shown in the figure below. Hit <Exit> until you exit the
    menocfig GUI and save the new configuration.


    ~/my-linux-imx$ make menocfig ARCH=arm


    ![](img/739a35b59067f8a55eff80a58765146f_258_0.png)'
