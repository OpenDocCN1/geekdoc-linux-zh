- img_proc: true
  md: '# Device Tree Interrupt Handling


    Unlike address range translation which follows the natural structure of the tree,
    Interrupt signals can originate from and terminate on any device in a machine.
    Unlike device addressing which is naturally expressed in the Device Tree, interrupt
    signals are expressed as links between nodes independent of the tree. Four properties
    are used to describe interrupt connections:


    +   1. The **interrupt-controller** property is an empty property, declaring a
    node as a device that receives interrupt signals.


    +   2. The **interrupt-cells** is a property of the interrupt controller node
    that indicates the number of cells in the interrupts property for the child device
    nodes (for example, cortex-a9-gic interrupt controller indicates three cells for
    the ecpi1 and gpio1 controllers. The gpio1 controller is also an interrupt parent
    controller for GPIOx and indicates two cells for the slave nodes interrupts property).
    It is similar to the #address-cells and #size-cells properties.


    +   3. The **interrupt-parent** is a property of a device node containing a handle
    to the interrupt controller that it is attached to. Nodes that do not have an
    interrupt-parent property can also inherit the property from their parent node.


    +   4. The **interrupts** property is a property of a device node containing a
    list of interrupt specifiers, one for each interrupt output signal on the device.


    The interrupt links between several related DT nodes are shown in the following
    figure. This is a real example you can check in the i.MX6 SABRE board:'
  merge: -1
