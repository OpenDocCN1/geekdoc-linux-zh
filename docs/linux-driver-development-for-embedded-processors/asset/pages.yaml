  md: "# Sleep and Wake up in the Driver\n\n1. Declare a static wait queue:\n\n```\n\
    static DECLARE_WAIT_QUEUE QUEUE_HEAD(hello_keys_wait);\n```\n\n2. Put the user\
    \ process to sleep. Add the code below in the ltc2422_read_raw() callback function:\n\
    \n```\nwait_event_interruptible(hello_keys_wait, done);\n```\n\n3. Wake up the\
    \ process in the interrupt´s Bottom half handler:\n\n```\nwake_up(&hello_keys_wait);\n\
    ```\n\n# Workqueue\n\n1. Declare the work item and the workqueue inside our private\
    \ data structure:\n\n```\n#include <linux/workqueue.h>\n\nstruct ADC_data {\n\t\
    struct workqueue_struct *ADC_wq;\n\tstruct work_struct work;\n\tstruct spi_device\
    \ *spi;\n\tuint8 t buffer[4];\n\tchar name[8];\n};\n```\n\n2. Create a new workqueue\
    \ and the associated worker threads inside the probe() function. The Legacy Workqueue\
    \ interface is deprecated and has been replaced by the CMWQ (Concurrency Managed\
    \ Workqueues). CMWQ maintain compatibility with the original workqueue API providing\
    \ a richer, more expressive and better performing API. Use \"alloc_workqueue\"\
    \ function instead of the deprecated \"create_workqueue\" one. For more info about\
    \ CMWQ see:\n\nLinux/Documentation/workqueue.txt\n\nYou are going to create a\
    \ work at runtime with INIT_WORK(), where the second argument is a function that\
    \ does the deferred work:\n\n```\nst->ADC_wq = alloc_workqueue(\"ADC_wq\", 0,\
    \ 0);\nINIT_WORK(&st->work, ADC_trigger_int);\n```"
