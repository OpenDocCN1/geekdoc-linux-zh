- img_proc: true
  md: '# 2. fdt manipulates the FDT


    +   - fdt addr <addr> <length>: sets the FDT location to <addr>.

    - fdt boardsetup: performs board-specific setup.

    - fdt move <fd> <newaddr>: copies the FDT to <addr>.

    - fdt resize resizes the FDT to size + padding to 4 K address.

    - fdt print <path> <prop>: recursive print starting at <path>.

    - fdt set <path> <prop> <val>: sets <property> to <val>.

    - fdt mknode <path> <node>: creates a new node after <path>.

    - fdt rm <path> <prop>: deletes the node or <property>.

    - fdt header: displays information.

    - fdt chosen <start> <end>: adds/updates the /chosen branch in the tree.


    # Parsing the Device Tree on a Running Linux Kernel


    Once the system runs, it is possible to inspect the Device Tree structure by accessing
    the /proc filesystem. If CONFIG_PROC_DEVICETREE is set in the Kernel configuration
    options, you can view the actual DT parsed by the Kernel under /proc/device-tree/
    directory.


    Open minicom and perform booting. Press the RESET SW2 to begin a boot sequence.
    Stop the U-Boot sequence by pressing any key, then perform network booting with
    the "run netboot command.


    ```

    U-Boot > run netboot /* start network booting */

    root@imx6qsabresd:~# ls -al /proc/device-tree/ /* list all the nodes available
    /*

    ```'
