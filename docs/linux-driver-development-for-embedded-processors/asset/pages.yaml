    # How UIO Works


    Each UIO device is accessed through a device file and several sysfs attribute
    files. The device file will be called /dev/uio0 for the first device, and /dev/uio1,
    /dev/uio2 and so on for subsequent devices.


    The UIO driver in the Kernel creates attributes in the sysfs system describing
    the UIO device. The directory /sys/class/uio is the root for all the attributes.
    A separate numbered directory is created under /sys/class/uio for each UIO device:


    +   1. First UIO device: /sys/class/uio/uio0.

    2. /sys/class/uio/uio0/name contains the name of the device which correlates to
    the name in the uio_info structure.

    3. /sys/class/uio/uio0/maps is a directory that has all the memory ranges for
    the device. Each UIO device can have its own directory or more memory regions
    available for memory mapping. Each mapping has its own directory in sysfs, the
    first mapping appears as /sys/class/uio/uio/maps/map0/. Subsequent mappings create
    directories map1/, map2/, and so on. These directories will only appear if the
    size of the mapping is not 0. Each mapX/ directory contains four read-only files
    that show attributes of the memory:


    +   - name: A string identifier for this mapping. This is optional, the string
    can be set to this to make it easier for the User space to find the correct mapping.

    - addr: The address of memory that can be mapped.

    - size: The size, in bytes, of the memory pointed to by addr.

    - offset: The offset, in bytes, that can be added to the pointer returned by mmap()
    to get the actual device memory. This is important if the device''s memory is
    not page aligned. Remember that pointers returned by mmap() are always page aligned,
    so it is a good practice to always add this offset.


    Interrupts are handled by reading from /dev/uioX. A blocking read() from /dev/uioX
    will return as soon as an interrupt occurs. You can also use select() on /dev/uioX
    to wait for an interrupt. The integer value read from /dev/uioX represents the
    total interrupt count. You can use this number to figure out if you missed interrupts.


    The device memory is mapped into the process address space by calling the mmap()
    function of the UIO driver.'
