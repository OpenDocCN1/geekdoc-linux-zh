  md: '# Parsing the Device Tree on a Running U-Boot


    If the bootloader is Device Tree capable it needs to have CONFIG_OF_LIBFDT defined
    in "u-boot/include/configs/mx6sabre_common.h".


    If the bootloader is Device Tree incapable you need to build Kernel with the following
    options enabled:


    CONFIG_ARM_APPENDENDED_DTB

    CONFIG_ARM_ATAG_DTB_COMPAT


    With the option CONFIG_ARM_APPENDENDED_DTB, the boot code will look for a Device
    Tree binary (DTB) appended to zimage (e.g., cat zimage imx6q-sabresd.dtb > zimage-dtb).
    With the option CONFIG_ARM_ATAG_DTB_COMPAT, zimage can extract the information
    from the ATAG list and store it at run time in the appended DTB.


    U-Boot on current NXP platforms has several commands that allow you to view and
    manipulate the FDT itself:


    +   1. bootm has FDT-related subcommands:


    +   - bootm fdt: relocates the flattened Device Tree.

    - bootm go: performs fix-up actions and boots the operating system.


    ![](img/739a35b59067f8a55eff80a58765146f_104_0.png)'
  merge: -1
