    \nIn this section you will see a simpler approach to management of GPIO using\
    \ the GPIOlib framework (located in Linux/driver/gpio/golib.c). The gpioolib driver\
    \ provides sysfs entries to control the GPIO in User space. It also allows GPIO\
    \ programming in the Kernel space using its exported interface. Most drivers use\
    \ sysfs only for configuration and debugging and maintain a device node for data\
    \ transfer. The gpioolib is a special case where the entire device interaction\
    \ is controlled via sysfs. This provides simpler control, particularly from the\
    \ terminal command line, but is also less efficient.\n\n# Using gpiolib from the\
    \ User Space\n\nUsing gpiolib from User space has the ability to export GPIO control\
    \ and status for use with applications using sysfs. No other driver like cat and\
    \ echo can be used to quickly read the current value of a GPIO input or to set\
    \ the level of a GPIO output.\n\nThe first step to access a GPIO pin is to export\
    \ the pin. There is a big number of GPIO pins on a processor, so it would not\
    \ make sense to maintain a directory with direction files for every pin by default.\
    \ The driver requires you to export the GPIO before it creates these files."
