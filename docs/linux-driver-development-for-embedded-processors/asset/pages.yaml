  md: '# Preface


    Embedded systems have become an integral part of our daily life. They are deployed
    in mobile devices, networking infrastructure, home and consumer devices, digital
    signage, medical imaging, automotive infotainment and many other industrial applications.
    The use of embedded systems is growing exponentially. Today ’s processors are
    made from silicon, which itself is fashioned from one of the most abundant materials
    on earth: sand. Processor technology has moved from 90nm fabrication in the year
    2000 to 14nm today, and it is expected to shrink to 7nm or 5nm by 2021.


    Today ’s embedded processors range from multicore 64-bit quad core CPUs, manufactured
    in advanced 14nm processes, powerful GPUs that enable console quality games and
    next generation virtual reality applications to single core embedded processors
    for power efficient, cost optimized applications designed for the growing IoT
    (Internet of Things) consumer and industrial, mass markets. Nowadays, it is possible
    to have an embedded linux system running in a $4 processor and new processors
    are, shrinking this cost.


    The flexibility of Linux embedded, the availability of powerful, energy efficient
    processors designed for embedded computing and the low cost of new processors
    are encouraging many industrial companies to come up with new developments based
    on embedded processors. Current engineers have in their hands powerful tools for
    developing applications previously unimaginable, but they need to understand the
    countless features that Linux offers today.


    Embedded firmware developers need to understand the lower level hardware function
    controls, to be able to write interfaces to multiple peripherals - meaning peripherals,
    GPIOs, serial buses, timers, DMA, CAN, USB, and LCD.


    The following could be a real example of low level hardware control: A Linux embedded
    firmware developer is designing a Linux application that needs to talk with three
    different UARTS. They are using a Linux SCB (Single board computer) with three
    UARTS available, but when the application is being tested it looks like there
    are only two functional UARTS. The'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Linux Driver Development for Embedded Processors


    reason is that processors have pins multiplexed to different functions, and the
    same pin can be an UART pin, I2C pin, a SPI pin, a GPIO, etc.. To activate the
    third UART, the firmware first must load the SBC DT (Device Tree) source within
    the kernel sources. Second, they must check the Device Tree file if the missing
    UART device node is created and enabled. If the UART device node is not included
    in the Device Tree it has to be created using the other created UART nodes as
    a reference. After that, the new UART pads must be multiplexed for UART functionality,
    making sure they are not conflicting with other devices in the DT that use the
    same pins for an alternate function.


    The Device Tree is a binary file containing the description of your SoC (System
    on Chip) and your board. Before moving to the Device Tree, this information was
    previously hard-coded in the kernel source code. A small change, such as the modification
    of an I2C peripheral''s address would force a recompilation of the kernel image
    to be run. The fast growth of ARM*-based SoC and platforms led to the inclusion
    of a lot of very similar C code in the Kernel sources to support each processor
    and every board, listing all the peripherals, their configuration, and etc. The
    main purpose of using the Device Tree in the newer kernels was to separate a large
    part of the hardware description from the kernel sources.


    If you are thinking of creating a new SoC board you have to verify that your SoC
    is supported by the Linux Kernel, then create a new "Board.dts" Device Tree source
    describing your platform''s devices and make sure it includes the relevant "SoC.dtsi"
    file that describes your chosen SoC system. If needed, you have to develop the
    missing Linux drivers for the devices that are on your board outside the SoC.


    In Device Linux systems the drivers are loaded by the kernel when the device is
    declared in the Device Tree. The driver retrieves the configuration data from
    the DT node (e.g. the physical addresses allocated to the device, which interrupt(s)
    the device triggers, and also device specific information). Throughout this book,
    you will see the important role of the Device Tree for the development of our
    Linux drivers and it will be inevitably explained in detail.


    This book will teach you how to develop drivers for Device Tree embedded systems.
    You will learn how to write different types of Linux drivers as well as the appropriate
    APIs (Application Program Interfaces) and methods to interface with the Kernel
    and the User space. This is a book meant to be practical, but also provides an
    important theoretical base. More than 20 drivers will be presented that can be
    easily reproduced in any i.MX6 platform. You only need to have an i.MX6 board
    that has some GPIOs, a SPI controller and an I2C controller available to develop
    all the drivers. All the drivers have been tested in two different platforms,
    the NXP i.MX6 SABRE board and the SolidRun HummingBoard to demonstrate how easily
    a driver can be ported from one platform to the other. You will learn how to develop
    drivers from the simplest ones to drivers that manage accelerometers, DACs'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'via I2C and ADCs via SPI. There will also be development of DMA drivers, drivers
    that manage interrupts and User space drivers using the UIO framework.


    This book is a learning tool to start developing drivers without any previous
    field, the intention in its writing has to develop drivers without a high level
    of complexity that both serve to reinforce the main driver development concepts
    and can be a starting point to help you develop your own drivers. And, remember
    that the best way to develop a driver is not to write it from scratch. You can
    reuse free code from similar Linux mainline drivers. All the drivers written throughout
    this book are GPL licensed, so you can modify and redistribute them under the
    same license.


    # Why the i.MX6 Processor?


    The i.MX6 series of applications processors is a feature and performance scalable
    multicore platform that includes single, dual and quad core families based on
    the ARM® Cortex-architecture, including the Cortex-A9, combined Cortex-A9 + Cortex-M4
    cores and Cortex-A7-based solutions up to 1.2 GHz. One of the main target the
    industrial market, so most of the hardware and software documentation related
    to the processor and its development boards can be easily found and downloaded
    from the NXP website. Unlike other processors, the i.MX6 can be used in any design
    ranging from small quality industrial equipment to high volume low cost multimedia
    devices. The i.MX6 will also fit the needs of long term embedded customers from
    the NXP''s Product Longevity Program.


    There is also a strong i.MX community of i.MX developers and users sharing knowledge,
    development tips and code. You can find it at https://community.nxp.com/community/imx


    All these advantages have led to a high ecosystem around the i.MX processor based
    on Embedded Board Solutions (System on Modules, and Single Board Computers), Open
    Source Development Boards and Reference Designs. Spend just a moment searching
    i.MX6 SOM in the Internet and you will be surprised by the wide variety of solutions
    to be found.


    # Who is this Book For?


    This book is ideal for Linux embedded application developers that want to know
    how to develop drivers from scratch. It is also indicated for embedded software
    developers that have developed drivers for non-Device Tree Kernels and want to
    learn how to create new Device Tree-based ones. And finally it is for students
    and hobbyists who want to learn how to deal with the low level hardware of embedded
    platforms using Linux. Before reading this book, having'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Linux Driver Development for Embedded Processors


    prior, basic knowledge of C language, Linux embedded and Yocto Project tools would
    be helpful, though not mandatory.


    # # How this Book is Structured


    Chapter 1, Building the System, starts by describing the main parts of an Embedded
    Linux system and the different ways to build it, explaining why the Yocto Project
    image was chosen as our build option. Next, it describes in detail how to build
    a Linux embedded image using Yocto and how to compile kernel images and Linux
    modules outside Yocto. The Linux image generated will be used throughout the rest
    of the book for the development of drivers and applications. finally, this chapter
    describes how to configure the free Eclipse IDE to develop the drivers.


    Chapter 2, The Linux Device and Drivel Model, explains the relationship between
    "Bus" drivers, "Bus controller" drivers and "Device" drivers. It also provides
    an introduction to the Device Tree and describes a Linux device model example
    for the i2c subsystem.


    Chapter 3, The Simplest Drivers, covers several simple drivers that are not yet
    interacting with User applications using "system calls". You will use the Eclipse
    IDE to create, compile and deploy the drivers in your i.MX6 target board. This
    chapter will let you to check that your driver development ecosystem is working
    properly.


    Chapter 4, Character Drivers, describes the architecture of the character drivers.
    It explains how driver operations are called from the User space using system
    calls and how to exchange data between the Kernel and the User space. It also
    explains how to identify and create each Linux driver. Several drivers are written
    that will exchange information with the User space using different methods for
    the creation of the device nodes. The first one will use the traditionally static
    device creation method with "mknode" command, the second one will show how to
    create device files and the last one will create the device files using the "microsoft
    framework". This chapter also explains how to create a device class, and a driver
    entry under the sysfs.


    Chapter 5, Platform Drivers, describes what a platform driver is, how it is statically
    described in the Device Tree, and the process of associating the device with the
    driver called "binding". In this chapter you will develop your first driver interacting
    with the hardware. Before developing the driver, careful explanation will be provided
    about the way that the pads of the i.MX6 can be multiplexed to different functions
    and how to select the required muxing option within the Device Tree. This chapter
    also describes the Pinctrl Subsystem. You will develop drivers that control external
    devices mapping of peripheral register addresses from physical to virtual and
    writing/reading to these virtual addresses from the Kernel space. You will also


    XX'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Preface


    see how to add "sysfs" support to a platform driver to control the hardware via
    sysfs entries. Finally, this chapter explains how to develop a User space driver
    using the UIO framework.


    **Chapter 6, Handling Interrupts in Platform Drivers**, introduces interrupt hardware
    and software in Linux embedded processors, explaining the interrupt controllers
    and the interrupt-capable peripheral nodes are linked within the Device Tree.
    You will develop drivers that manage interrupts from external hardware. The "Top
    half" and "Bottom half" interrupt processing focusing in the implementation of
    "workqueues" will be described. Finally, this chapter shows how an User application
    is to sleep using a "wait queue" and wakes up via an interrupt.


    **Chapter 7, Memory Management Drivers**, explains the MMU (Memory Management
    Unit), and the different types of addresses used in Linux. It also describes the
    i.MX6 kernel booting in detail, explaining how the Linux model is populated with
    the Device Tree information, and the different drivers and platforms matching
    process. Finally, this chapter describes the different memory allocators.


    **Chapter 8, DMA Drivers**, gives you information about the NXP SDMA controller,
    the "Linux Engine System", and the different types of DMAs. Several drivers are
    developed that manage memory to memory transactions without CPU intervention,
    using DMA scatter/gather mappings and DMA from the User space using the mmap()
    system call.


    **Chapter 10, Porting Kernel Modules to the HummingBoard**, introduces the i.MX6
    SolidRun HummingBoard SBC. It shows how easily any Kernel module for the i.MX6
    SABRE board can be ported to this new platform. It also describes how to set up
    Yocto for the HummingBoard and introduces the Yocto Project Package Management
    "smart" to update, add, remove or query the packages on a target device at runtime
    using a host server.


    # XXI'
