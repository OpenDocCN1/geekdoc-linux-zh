  md: '# # LAB 4.1: "helloworld character" Module


    ![](img/739a35b59067f8a55eff80a58765146f_128_0.png)


    Linux systems in general traditionally used a static device creation method, whereby
    a great number of device nodes were created under /dev (sometimes literally thousands
    of nodes), regardless of whether or not the corresponding hardware devices actually
    existed. This was typically done via a MAKEDEV script, which contains a number
    of calls to the mknod program with the relevant major and minor device numbers
    for every possible device that might exist in the world.


    This is not the right approach to create device nodes nowadays, as you have to
    create a block or character device file entry manually and associate it with the
    device as shown in the I.MX6 target terminal command line below:


    ```

    root@imx6qsabres:~# mknod /dev/mydev c 202 108

    ```


    Despite all this, you will develop your character driver using this static method
    purely for educational purposes, and you will see in the few next drivers a better
    way to create the device nodes using devtmpfs and miscellaneous framework.'
  merge: -1
