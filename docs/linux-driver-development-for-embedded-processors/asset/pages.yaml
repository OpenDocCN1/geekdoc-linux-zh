- img_proc: true
  md: '# Handling Interrupts in Platform Drivers


    - dev_id is a pointer to some data. When using shared IRQs it cannot be NULL,
    as it is used as an identifier for free_irq().


    The role of an interrupt handler is to give feedback to its device about interrupt
    reception and to read or write data according to the meaning of the interrupt
    being served. The hardware will replay the interrupt (interrupt flood) or not
    generate other interrupt until you acknowledge it. The method of acknowledging
    an interrupt can vary from reading an interrupt controller register, reading the
    content of a register, or clearing an "interrupt-pending" bit. Some processors
    have an interrupt signal that takes care of this automatically in hardware.


    Your driver should support interrupt sharing whenever this is possible. It is
    possible if and only if your driver can detect whether your hardware has triggered
    the interrupt or not. The argument *dev_id is a sort of client data; void * argument
    is passed to devm_request_irq() function, and this same pointer is passed back
    as an argument to the handler when the interrupt happens. You usually pass a pointer
    to your device data structure in dev_id, so a driver that manages several instances
    of the same device doesn''t need any extra code in the interrupt handler to find
    out which device is in charge of the current interrupt event. If the handler found
    that its device did, indeed, need attention, it should return IRQ_HANDLED. If
    the driver detects that it was not your hardware that caused the interrupt, it
    will do nothing and return IRQ_NONE, allowing the Kernel to call the next possible
    interrupt handler.


    # Releasing an Interrupt Handler


    This is done automatically in normal situations:


    ```

    void devm_free_irq(struct device *dev, unsigned int irq, void *dev_id);

    ```


    # Interrupt Handler Prototype


    The role of an interrupt handler is to give feedback to its device about interrupt
    reception and to read or write data according to the meaning of the interrupt
    being served. A typical task for an interrupt handler is awakening processes sleeping
    on the device. The function prototype is shown below:


    ```

    return_t (*handler) (unsigned int irq, void *dev_id);

    ```


    +   - irq is the IRQ number.

    - dev_id, the opaque pointer that was passed to devm_request_irq().'
  merge: -1
