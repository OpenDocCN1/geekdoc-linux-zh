  md: "# Input Framework as an I2C Interaction\n\n1. Include the required header files:\n\
    \n```\n#include <linux/i2c.h> /* struct i2c_driver, struct i2c_client(), i2c_\n\
    get_client_data(), i2c_set_client_data() */\n```\n\n2. Create a struct i2c_driver:\n\
    \n```\nstatic struct i2c_driver ioaccel_driver = {\n    .name = \"ioaccel\",\n\
    \    .owner = THIS MODULE,\n    .of_match_table = ioaccel_dt_ids,\n    .probe\
    \ = ioaccel_probe,\n    .remove = ioaccel_remove,\n    .id_table = i2c_ids,\n\
    };\n```\n\n3. Register to the I2C bus as a driver:\n\n```\nmodule_i2c_driver(ioaccel_driver);\n\
    ```\n\n4. Add \"ioaccel\" to the list of devices supported by the driver:\n\n\
    ```\nstatic const struct device_id ioaccel_dt_ids[] = {\n    .compatible = \"\
    arrow,ioaccel\",\n    \n};\nMODULE_DEVICE_TABLE(of, ioaccel_dt_ids);\n```\n\n\
    5. Define an array of i2c_device_id structures:\n\n```\nstatic const struct i2c_device_id\
    \ i2c_ids[] = {\n    .name = \"ioaccel\",\n    \n};\nMODULE_DEVICE_TABLE(i2c,\
    \ i2c_ids);\n```\n\n6. Use SMBus commands for accessing registers:\n\n```\ni2c_smbus_write_byte_data(client,\
    \ CRTL_REG1, CRTL_REG1_ACTIVE); /* Set\nactive the accelerometer */\n```"
