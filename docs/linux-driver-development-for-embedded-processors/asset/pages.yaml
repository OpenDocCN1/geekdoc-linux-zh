  md: "```\nroot@imx6gsabsres:/# ls /sys/class/i2c-dev/\ni2c-0 i2c-1 i2c-2\nroot@imx6gsabsres:/#\
    \ cat /sys/class/i2c-dev/i2c-0/dev\n89:0\nroot@imx6gsabsres:/# _\n```\n\n# The\
    \ Kobject Infrastructure\n\nSysfs is tied inherently to the kobject infrastructure.\
    \ The kobject is the fundamental structure of the device model, it allows sysfs\
    \ representation. The struct kobject is defined as follows:\n\n```\nstruct kobject\
    \ {\n    const char *name;\n    struct list_head entry;\n    struct kobject *parent;\n\
    \    struct kset *kset;\n    struct kobj_type *ktype;\n    struct sysfs_dire *sd;\n\
    \    struct kref *kref;\n    /* ... */\n};\n```\n\nFor every kobject that is registered\
    \ with the system, a directory is created for it in sysfs. Every directory is\
    \ created as a subdirectory of the kobject's parent, expressing internal object\
    \ hierarchies. Inside struct kobject there is a pointer Ktype to the Kobj-type\
    \ structure. Kobj_type controls what happens when the kobject is created and deleted.\
    \ The struct kobj_type is defined as:\n\n```\nstruct kobj_type {\n    void (*release)(struct\
    \ kobject *kobj);\n    const struct sysfs_ops *sysfs_ops;\n    struct attribute\
    \ *default_attrs;\n    struct kobj_ns_type_operations (*(child_ns_type)(struct\
    \ kobject *kobj);\n    const void *(*namespace)(struct kobject *kobj);\n};\n```\n\
    \nKobj_type also contains attributes that can be exported to sysfs directories\
    \ (directories are created with kobj_create_add_add() function) as files (files\
    \ are created with sysfs_create_file()). These attributes can be \"read/write\"\
    \ via \"show\" methods using the struct sysfs_ops that is pointed via the sysfs_ops\
    \ pointer variable (in the struct kobj_type).\n\n```\nstruct sysfs_ops {\n   \
    \ ssize_t (*show)(struct kobject *, struct attribute,\n        char *);\n    ssize_t\
    \ (*store)(struct kobject *, struct attribute,\n        const char *, size_t);\n\
    };\n```"
