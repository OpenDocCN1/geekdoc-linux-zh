  md: 'By default the majority of the Linux drivers are not integrated into the Kernel
    image (e.g., zimage). These drivers are built as dynamic modules. This will result
    in .ko (kernel object) files being placed in the Kernel tree. These .ko files
    are the dynamic Kernel modules. Whenever you make a change to the Kernel it generally
    recommended that you rebuild your Kernel modules and then reinstall the Kernel.
    Otherwise the Kernel modules may not load or run. The command to build these modules
    is:


    ```

    ~my-linux-imx$ make modules

    ```


    To compile the Kernel image, modules, and all the Device Tree files in a single
    step:


    ```

    ~my-linux-imx$ make

    ```


    Once the Kernel modules, dtb files and modules have been compiled they must be
    installed. In the case of the Kernel image this can be installed by copying the
    zimage file to the location where it will be read from. The Device Tree binaries
    should also be copied to the same directory that the Kernel image was copied to:


    ```

    ~my-linux-imx$ cp /arch/arm/boot/zimage /var/lib/tftpboot

    ~my-linux-imx$ cp /arch/arm/boot/dts/imx6q-sabresdb.db /var/lib/tftpboot

    ```


    To Install the Kernel modules you use another make command similar to the others,
    but with an additional parameter which gives the base location where the modules
    should be installed. This command will create a directory tree from that location
    such us lib/modules/<kernel> which will contain the dynamic modules corresponding
    to this version of the Kernel. The base location should usually be the root of
    your target filesystem.


    ```

    ~my-linux-imx$ source /opt/poky/1.7/environment-setup-cortexa9hf-vfp-

    neon-poky-linux-gnueabi /* be sure the toolchain script is sourced */

    ~my-linux-imx$ sudo make ARCH=arm INSTALL_MOD_PATH=/nfsroot modules_

    install

    ```'
