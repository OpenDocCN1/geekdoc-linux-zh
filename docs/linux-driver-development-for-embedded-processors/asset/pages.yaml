  md: '# # Chapter 1

    Building the System


    # ## Introduction to Embedded Linux


    The Linux Kernel is one of the largest and most successful open source projects
    that has ever come about. The huge rate of change and number of individual contributors
    show that it has a vibrant and active community, constantly stimulating evolution
    of the kernel. This rate of change continues to increase, as does the number of
    developers and companies involved in the process. The development process has
    proved that it is able to scale to higher speeds without trouble. The Linux Kernel
    together with GNU software and many other open-source components provides a completely
    free operating system, GNU/Linux. Embedded Linux is the usage of the Linux Kernel
    and various other open-source components in embedded systems.


    Embedded Linux is used in embedded systems such as consumer electronics (e.g.,
    set-top boxes, smart TVs, PVRs (personal video recorders), IVI (in-vehicle infotainment),
    networking equipment (such as routers, switches, WAPs (wireless access points)
    or wireless routers), machine control, industrial automation, navigation equipment,
    spacecraft flight software, and medical instruments in general.


    Thanks to their versatility, operating systems based on the Linux Kernel like
    Android can be also found in mobile devices that are actually touchscreen-based
    embedded devices, such as smartphones and tablets. New operating systems based
    on Android like Brillo provide a simpler, smaller IoT-focused operating system.
    Android and Brillo both use the Linux Kernel under the hood.


    There are many advantages of using Linux in embedded systems. The following list
    shows some of these benefits:'
