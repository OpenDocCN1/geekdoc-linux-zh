    \ Semiconductor, Inc. */\n * /boot params = MX6 PHYS_OFFSET + 0x100,\n * .fixup\
    \ = fixup mach board,\n * .map_io = mx6 map io,\n * .init_irq = mx6_init_irq,\n\
    \ * .init_machine = mx6_sabresd_board_init,\n * .timer = &mx6_sabresd_timer,\n\
    \ * .reserve = mx6_sabresd_reserve,\nMACHINE_END\n```\n\nThe MACHINE_START definition\
    \ (Linux/arch/arm/include/asm/mach/arch.h) is the declaration of the machine_desc\
