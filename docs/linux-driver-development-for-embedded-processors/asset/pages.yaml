  md: '# Kernel UIO API


    The UIO API is small and simple to use:


    +   1. The struct uio_info tells the framework the details of your driver. Some
    of the members are required, others are optional. These are some of the struct
    uio_info members:


    +   - const char *name: Required. The name of your driver as it will appear in
    sysfs. It is recommended to use the name of your module for this.


    +   - const char *version: Required. This string appears in /sys/class/uio/uioX/version.


    +   - struct uio_mem mem[MAX_UIO_MAPS]: Required if you have memory that can be
    mapped with mmap(). If you have a way to fill one of the uio_mem structures. See
    the description below for details.


    +   - long irq: Required. If your hardware generates an interrupt, it''s your
    module task to determine the irq number during initialization. If you don''t have
    a hardware generated interrupt but want to trigger the interrupt handler in some
    other way, set irq to UIO_IRQ_CUSTOM, which this rarely makes sense.


    +   - unsigned long irq_flags: Required if you''ve set irq to a hardware interrupt
    number. The flags given here will be used in the call to request(irq).


    +   - int (mmap)(struct uio_info *info, struct vm_area_struct *vma): Optional.
    If you need a special mmap() you can set it here. If pointer is not NULL, your
    mmap() will be called instead of the built-in one.


    +   - int (*open)(struct uio_info *info, struct inode *inode): Optional. You might
    want to have your own open(), e.g. to enable inter_info only when your device
    is actually used


    +   - int (*release)(struct uio_info *info, struct inode *inode): Optional. If
    you define your own open(), you will probably also want a custom release() ) function.


    +   - int (*ircontrol)(struct uio_info *info, s32 irq_on): Optional. If you need
    to enable or disable interrupts from users by writing to /dev/uio, you can implement
    this function. The parameter irq_on will be 0 to disable interrupts and 1 to enable
    them.


    Your device will have one or more memory regions that can be mapped to User space.
    For each region, you have to set up a uio_mem mem in the mem[] array. Here''s
    a description of the fields of struct uio_mem:


    +   - int memtype: Required if mapping is used. Set UIO_MEM_PHYS if you have physical
    memory to be mapped. Use UIO_MEM_LOGICAL for logical memory (e.g., allocated by
    kmalloc()). There''s also UIO_MEM_VIRTUAL for virtual memory.


    +   - unsigned long addr: Required if mapping is used. Fill in the address of
    your memory block. This address is the one that appears in sysfs.'
