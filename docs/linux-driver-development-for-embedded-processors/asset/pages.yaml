    # # DMA from User Space


    Linux provides frameworks that allow the User space to interface with Kernel space
    for many types of devices (except DMA). User space DMA is defined as the ability
    to access buffers for DMA transfers and control transfers from a User space application.


    For larger buffers copying data with copy_to_user() and copy_from_user() is inefficient
    and in the case of DMA it defeats the purpose of using DMA to move the data. Mapping
    a Kernel allocated memory buffer into User space removes the need to copy data.


    A process can allocate memory on its heap at runtime using malloc(). This mapping
    is taken care by the Kernel, however a process can also manipulate its memory
    map in an explicit way using the mmap() function.


    The mmap() file operation allows memory of the device driver to be mapped into
    the address space of the User space process. When a User space process calls mmap
    to map device memory into its address space, the system responds by creating a
    new VMA to represent that mapping. A driver that supports mmap (and, thus, that
    implements the mmap needs'
