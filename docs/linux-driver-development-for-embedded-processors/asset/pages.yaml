    # MMU Management


    The NXP i.MX6 Cortex-A9 processor operates using virtual addresses. The Memory
    Management Unit, MMU, translates addresses of code and data from the virtual view
    of memory to the physical addresses in the real system.


    Almost every virtual memory implementation divides a virtual address space into
    blocks of contiguous virtual memory addresses, called pages. In order to translate
    virtual addresses of a process into physical addresses used by the hardware to
    actually process'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'instructions, the MMU makes use of the page tables. These contain a series
    of entries, each of which describes the physical address translation for the memory
    map. Page table entries are organized by virtual address. In addition to describing
    the translation of that virtual page to a physical page, they also provide access
    permissions and memory attributes for that page.


    Addresses generated by the processor core are virtual addresses. The MMU essentially
    replaces the most significant bits of this virtual address with some other value,
    to generate the physical address (effectively defining a base address of a piece
    of memory). The lower bits are the same in both addresses (effectively defining
    an offset in physical memory from that base address).


    The ARM® MMU supports entries in the page tables, which can represent 1 Mbyte
    (section), 64 Kbytes (large page) or 4 Kbytes (small page) of virtual memory.
    The ARM® MMU supports a multi-level page table architecture with two levels of
    page table: level 1 (L1) and level 2 (L2). The process in which the MMU accesses
    page tables to translate addresses is known as page walking. Page table L1 will
    translate 1 Mbyte pages, whereas page table L2 will translate 4 Kbytes and 64
    Kbytes pages.


    The L1 page table divides the 4GB address space into 4096 equal 1MB sections.
    The L1 page table contains 4096 entries, each entry being sized. Each entry can
    be the base address of a level 2 page table or a page table entry for translating
    a 1MB section. If the page table entry is translating a 1MB section, it gives
    the base address of the 1MB page in physical memory.


    To locate the relevant entry in the L1 page table, the top 12 bits (2^12=4096)
    of the virtual address are summed to the Translation Table Base Address (virtual
    to the Page table in RAM), obtaining the index to one of the 4096 words within
    the L1 page table. Once the address entry in the L1 page table is located, the
    upper 12 bits of the table value replace the 12 bits of the virtual address. The
    lower 20 bits of the virtual address combined with the upper 12 bits of the table
    entry generate the physical address of the 1Mbyte (section).


    A L2 page table divides the 1MB section further into either large pages of 64KB
    or small pages of 4KB size each. Each L2 page table entry is 4 bytes and besides
    the page base address also contains access bits and other information, such as
    whether data of this page should be cached or executed. There are 256 L2 page
    table entries per table, thus a L2 page table consumes 1KB of memory.'
