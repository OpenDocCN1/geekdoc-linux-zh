  md: "Platform devices structures are filled with a list of Device Tree properties\
    \ such as addresses and IRQs when the binding is done. The struct platform_device\
    \ is defined as follows:\n\n```\nstruct platform_device {\n    *name;\n    u32\
    \      id;\n    struct device dev;\n    u32      num_resources;\n    struct resource\
    \ *resource;\n};\n```\n\nThe resource array can be used to determine where various\
    \ resources, including memory-mapped I/O registers and interrupt lines, can be\
    \ found.\n\nThere are a number of helper functions for getting data out of the\
    \ resource array; these include:\n\n+   1. platform_get_resource() gets a resource\
    \ for a device, and returns a resource structure filled with the resource values,\
    \ so that you can use these values later in the driver code, for instance to map\
    \ them in the virtual space using dev_ioremap() function if they are physical\
    \ memory addresses (specified with IORESOURCE_MEM type).\n\nplatform_get_resource()\
    \ is defined as a function in drivers/base/platform.c, and defined as a function\
    \ prototype in include/linux/platform_device.h.\n\nIn the platform_get_resource()\
    \ function all the array resources are checked until the resource is found, and\
    \ then the struct is returned. See the code of the function below:\n\n```\nstruct\
    \ resource *platform_get_resource(struct platform_device *dev,\n    unsigned int\
    \ type, unsigned int num)\n{\n    int i;\n    for (i = 0; i < dev->num_resources;\
    \ i++) {\n        struct resource *r = &dev->resource[i];\n        if (type ==\
    \ resource_type(r) && num-- == 0)\n            return r;\n    }\n    return NULL;\n\
    }\n```\n\n```\nstruct resource *platform_get_resource(struct platform_device *dev,\n\
    \    unsigned int type, unsigned int num);\n```\n\nThe first parameter tells the\
    \ function which device you are interested in, so it can extract the info needed."
  merge: -1
  pgno: 197
- img_proc: true
  md: "- The second parameter depends on what kind of resource you are handling. If\
    \ it is memory\n(or anything that can be mapped as memory) then it's IORESOURCE_MEM.\
    \ You can see all the\nmacros at Linux/include/linux/ioport.h.\n- The last parameter\
    \ determines which resource of that type is desired, with zero indicating\nthe\
    \ one. Thus, for example, a driver could find its second MMIO region (reg property)\
    \ in\nthe Device Tree node with:\n\n```\nr = platform_get_resource(pdev, IORESOURCE_MEM,\
    \ 1);\n```\n\nThe return value is a pointer to a type struct resource var (defined\
    \ in Linux/include/linux/\nioport.h):\n\n```\nstruct resource {\n    resource_size_t\
    \ start; /* unsigned int (resource_size_t) */\n    resource_size_t end;\n    const\
    \ char *name;\n    unsigned long flags;\n    unsigned long desc;\n    struct resource\
    \ *parent, *sibling, *child;\n};\n```\n\nThe resource_size() function will return\
    \ the memory size that will be mapped using the\nreturned struct resource:\n\n\
    ```\nstatic inline resource_size_t resource_size(const struct resource *res)\n\
    {\n    return res->end - res->start + 1;\n}\n```\n\n+   2. platform_get_irq()\
    \ gets the interrupt resource described by the interrupt property in\nDevice Tree\
    \ node. You will see more about this function in the next chapter.\n\n+   3. of_get_property()\
    \ finds a property with a given name for a given node."
