  md: "# Handling Interrupts in Platform Drivers\n\nSee pseudocode the GIC interrupt\
    \ controller initialization below:\n\n```\nstart_kernel()\n  init_irq()\n    machine_desc->init_irq()\
    \ // imx6q_init_irq() is called\n    irchip_init()\n      of_irq_init()\n    \
    \    gic_of_init() // actual controller initialization.\n        gic_init_bases()\n\
    \          irq_domain_add_linear()\n```\n\nThe irq_domain_add_linear() function\
    \ adds linear reverse map maintaining a fixed size table indexed by the hwirq\
    \ number. When a hwirq is mapped, an irq_desc is allocated for the hwirq, and\
    \ the IRQ number is stored in the table.\n\nThe Linear map is a good choice when\
    \ the maximum number of hwirqs is fixed and a relatively small number (~ 256).\
    \ The advantages of this map are fixed time lookup for IRQ numbers, and irq_descs\
    \ are only allocated for in-use IRQs. The disadvantage is that the table must\
    \ be as large as the possible hwirq number. The majority of drivers should use\
    \ the linear map.\n\nAfter the initialization of the interrupt controllers, the\
    \ interrupts can be used by the drivers through the request_irq() function to\
    \ register device-specific interrupt handlers. In addition to the native interrupt\
    \ lines supported from the interrupt controller, the number of interrupts is also\
    \ expanded to support GPIO interrupts. This allows drivers to use the standard\
    \ interrupt interface supported by ARM® devices running Linux OS, such as the\
    \ request_irq() and free_irq() functions. When you call request_irq() the Kernel\
    \ appends your IRQ handler to the list of IRQ handlers registered for that particular\
    \ IRQ line, it does not change the exception table.\n\n# Interrupt Propagation\n\
    \nThe following figure represents the DT connection between the interrupt hardware\
    \ (the SW5 pushbutton) and the i.MX6 SoC interrupt controllers. This scheme will\
    \ be used later in this chapter for your first Kernel module that manages interrupts.\
    \ See the declaration of each interrupt node controller in the Linux/arch/arm/boot/dts/imx6qldli.dtsi\
    \ file."
