  md: '# Handling Interrupts in Platform Drivers


    2. A "work queue" must be created:


    ```

    struct workqueue struct *create_workqueue(char *name);

    ```


    the "work" to be done will be sent to the created workqueue.


    A work queue is destroyed with:


    ```

    void destroy workqueue(struct workqueue struct *wq);

    ```


    3. The work item will be initialized with INIT_WORK():


    ```

    INIT_WORK(struct work*, func(struct work*));

    ```


    where the first argument points to the work space allocated by kmalloc, as shown
    below:


    ```

    kmalloc(sizeof(struct delayed work), GFP KERNEL);

    ```


    and the second argument is the function that will do the work.


    4. A work item is enqueued in the workqueue using the following function:


    ```

    queue_work(struct workqueue struct *, struct struct work *);

    ```


    where the first argument is the object returned by "create workqueue" and the
    second argument is the object used as first argument to INIT_WORK.


    5. To flush the work queue and block until complete, use this:


    ```

    flush_workqueue(struct workqueue struct *wq);

    ```


    In LAB 9.5: "IIO subsystem ADC with hardware triggering" Module of Chapter 9 will
    show how to use workqueues in a real driver example.'
