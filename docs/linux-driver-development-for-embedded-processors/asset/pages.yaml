  md: '# Building the System


    References to community layers in this document are for all the layers in Yocto
    Project except "meta-fsl-bsp-release", "meta-browser" and "meta-qtq5". NXP i.MX
    boards are configured in the "meta-fsl-arm layer". This includes U-Boot, the Linux
    Kernel, and reference board specific details.


    The contents of the NXP BSP Release layer are recipes and machine configurations.
    In many cases, other layers implement recipes or include files and the NXP release
    layer provides updates to the recipes by either appending to a current recipe,
    or including a component and updating with patches or source locations. Most NXP
    release layer recipes are very small because they use the community has provided
    and update what is needed for each new package version that is unavailable in
    the other layers.


    The NXP BSP Release layer also provides image recipes that include all the components
    needed for a system image to boot, making it easier for the user. Components can
    be built individually or through an image recipe, which pulls in all components
    required in an image into one build process.


    NXP Kernel and U-Boot releases are accessed through NXP public git servers at
    http://git.freescale.com/git/


    However, several components are released as packages on the NXP mirror. The package-based
    recipes pull files from the NXP mirror instead of a git location and generate
    the package needed.


    Kernel L3.14.28_1.0.0 is released for Yocto Project 1.7 (Dizzy). The same recipes
    for Yocto Project 1.7 are going to be upstreamed and made available on Yocto Project
    1.8. The Yocto Project release cycle lasts roughly six months.


    The recipes and patches in meta-fsl-bsp-release will be upstreamed to the community
    layers. Once that is for a particular component, the files in meta-fsl-bsp-release
    are no longer needed and the NXP Yocto Community BSP will provide support.


    The Yocto file system uses the repo tool to download the source files which must
    be installed first. The build takes place on a Linux machine (Ubuntu 14.04 32-bit
