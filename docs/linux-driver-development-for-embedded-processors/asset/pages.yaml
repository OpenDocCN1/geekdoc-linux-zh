  md: '# Handling Interrupts in Platform Drivers


    Once the GPIO has been exported, the direction is set by writing the string value
    of "in" or "out" into the "direction" virtual file in the GPIO directory. If the
    GPIO is an output, it may be driven high or low by writing the characters "1"
    or "0" respectively, into the "value" virtual file. If the GPIO is an input, the
    value may be sampled by reading from the "value" virtual file.


    When the access is finished the GPIO may unexported, which will remove the gpio
    pin directory and the virtual files within.


    See how the GPIO sysfs virtual files can be manipulated from the terminal command
    line and from the user application code in the example below:


    ```

    root@imx6qsabres:~# echo /sys/class/gpio/gpio2/direction /* terminal command */

    ```


    /* C code equivalent to terminal input command above */


    ```

    FILE *fp = fopen("/sys/class/gpio/gpio2/direction", "w");

    fwrite("out", 1, sizeof("out"), fp);

    fclose(fp);

    ```


    You will need to enable "GPIO sysfs" in the Kernel before GPIOs are accessible
    User space.


    Open the menuconfig window. Navigate from the main menu -> Device Drivers -> GPIO
