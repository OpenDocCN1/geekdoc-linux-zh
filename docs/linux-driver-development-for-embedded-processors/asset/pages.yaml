    # LAB 5.1: "Platform device" Module


    ![](img/739a35b59067f8a55eff80a58765146f_152_0.png)


    The functionality of this platform driver probe() is the same as the misc char
    driver, but this time you will register your char device in the probe() function
    instead of init() function. When the Kernel module is loaded (insmod <module name>.ko),
    the platform device driver registers itself with the platform bus driver using
    platform_driver_register(). The probe() is called when the platform device driver
    matches its "compatible_of_device_id" entry with the "compatible property" of
    the DT device node. The process of associating a device with a device driver is
    called binding. The main code sections of the driver will now be described:


    +   1. Include the platform device header file which contains the structure and
    function definitions required by platform devices/drivers:


    ```

    #include <linux/platform_device.h>

    ```'
