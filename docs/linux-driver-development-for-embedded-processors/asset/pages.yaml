    The SW5 pushbutton of the SABRE board will be connected to each of its eight masked
    to the i.MX6 processor using the gpio1_5 pin of the gpio1 controller.


    In the i.MX6 processor each GPIO input has a dedicated edge-detect circuit which
    can be configured through software to detect rising edges, falling edges, logic
    low-levels or logic high-levels on the input signals. The outputs of the edge
    detect circuits are optionally masked by setting the corresponding bit in the
    interrupt mask register GPIO_IMR. These qualified outputs are OR''ed together
    to generate two one-bit interrupt lines:


    +   - Combined interrupt indication for GPIOx signals 0 - 15

    - Combined interrupt indication for GPIOx signals 16 - 31


    In addition, GPIO1 provides visibility to each its high low order interrupt sources
    (i.e., GPIO1 interrupt n, for n = 0 - 7). However, individual interrupt indications
    from other GPIOx are not available.


    After processing SW5 there will be a level change on the gpio1_5 pin that makes
    the GPIO controller generate an interrupt with hardware irq number = 5, this interrupt
    will be notified to the GIC interrupt controller via an IRQ signal with hardware
    irq number = 98 (see Table


    205'
