  md: '# Chapter 9


    ![](img/739a35b59067f8a55eff80a58765146f_390_0.png)


    The Serial Peripheral Interface (SPI) is a synchronous four wire serial link used
    to connect microcontrollers to sensors, memory, and peripherals. It''s a simple
    ''de facto'' standard, not complicated enough to require a standardization body.
    The SPI uses a master/slave configuration.


    ![](img/739a35b59067f8a55eff80a58765146f_390_1.png)


    The three signal wires hold a clock (SCK, often on the order of 10 MHz), and parallel
    data lines with ''Master Out, Slave In'' (MOSI) or ''Master In, Slave Out'' (MISO)
    signals. There are four clock modes through which data is exchanged; mode-0 and
    mode-3 are most commonly used. Each clock cycle shifts data out and data in; the
    clock doesn''t cycle except when there is a bit shift. Not all data bits are used;
    not every protocol uses those full duplex capabilities.


    SPI uses a ''chip select'' to activate a generic spi slave device, so those three
    signal wires may be connected to several chips in pairs. All SPI supports chipselects;
    they are usually active low lines, labeled nCSx for slave ''x'' (e.g. nCS0). Some
    devices have other signals, including an interrupt to the master.


    There is a de-generic spi device driver (located in Linux/drivers/spi/spidev.c)
    which you can enable through the Kernel configuration CONFIG_SPI_SPIDEV. It creates
    a device node for each controller over which you access spi chips from the User
    space. The device nodes are named spidev[bus],[chip select].'
