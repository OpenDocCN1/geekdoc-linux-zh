    # i.MX6 Interrupt Hardware Operation


    NXP iMX6 devices The Global Interrupt Controller (GIC) collects up to 128 interrupt
    requests from all the iMX6Dual/Quad sources and provides an interface to reach
    all of the CPU cores. The first 32 interrupts are used for interrupts that are
    private to the CPUs interface. All interrupts other than the private CPU type
    are hooked up to the GPC in the same order.


    Each source can be enabled or disabled by configuring the Interrupt Enable Register
    or using the Interrupt/Disable Number Registers. When an interrupt source is enabled
    and the corresponding interrupt source is asserted, the Interrupt Controller asserts
    a normal or a fast interrupt request depending on the associated Interrupt Type
    Register setting.


    Interrupt Controller can only be accessed in supervisor mode. The Interrupt Controller
    requests are prioritized in the following order: fast interrupts and normal interrupts
    in order of highest priority level, highest source number with the same priority.
    There are sixteen normal interrupt levels for all interrupt sources, with zero
    level being the lowest priority. The interrupt levels are configurable through
    eight normal interrupt priority level registers. Those registers, along with the
    Normal Interrupt Mask Register, support software-controlled priority levels for
    normal interrupts and priority masking.'
