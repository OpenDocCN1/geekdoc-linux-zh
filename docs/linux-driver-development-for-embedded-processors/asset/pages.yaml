  md: '# Building the System


    Linux Kernel is released under GNU GPL version 2 and is therefore Free Software
    as defined by the Free Software Foundation. You may read the entire copy of the
    license in the COPYING file distributed with each release of the Linux Kernel.


    Some of the subsystems the Kernel is comprised of are listed below:


    +   - /arch/<arch>: Architecture specific code

    - /arch/<arch>/mach: Machine/board specific code

    - /Documentation: Kernel documentation. Do not miss it!

    - /ipc: Inter process communication

    - /mm: Memory management

    - /fs: File systems

    - /include: Kernel headers

    - /include/asm-<arch>: Architecture and machine dependent headers

    - /include/linux: Linux core headers

    - /init: Linux initialization (including main.c)

    - /block: Kernel block layer code

    - /net: Networking functionality

    - /lib: Common Kernel helper functions

    - /kernel: Common Kernel structures

    - /arch: Architecture specific code

    - /crypto: Cryptography code

    - /security: Security components

    - /drivers: Built-in drivers (does not include loadable modules)

    - /Makefile: Top Linux makefile (sets arch and version)

    - /scripts: Scripts for internal or external use


    The official home for the mainline Linux Kernel source code is www.kernel.org.
    You can download the source code either directly from the kernel.org website as
    a compressed tar.xz file or you can download it through git, the Kernel''s preferred
    source code control system.


    There are several main categories into which Kernel releases may fall:


    +   1. Prepatch: Prepatch or "RC" Kernels are mainline Kernel pre-releases that
    are mostly aimed at other Kernel developers and Linux enthusiasts. They must be
    compiled from source and usually contain new features that must be tested before
    they can be put into a stable release. Prepatch Kernels are maintained and released
    by Linus Torvalds.


    +   2. Mainline: The mainline tree is maintained by Linus Torvalds. It''s the
    tree where all new features are introduced and where all the exciting new development
    happens. New mainline Kernels are released every 2-3 months.'
  merge: -1
