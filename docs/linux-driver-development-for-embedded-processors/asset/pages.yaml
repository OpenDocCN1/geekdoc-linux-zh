  md: '# # Chapter 8 DMA Drivers


    DMA is the hardware mechanism that allows peripheral components to transfer their
    I/O data to and from main memory without the need to involve the system processor.
    Use of this mechanism can greatly increase throughput to and from a device, because
    a great deal of computational overhead is eliminated.


    The CPU manages DMA operations via a DMA controller unit. While the DMA transfer
    is in progress, the CPU can continue executing code. When the DMA transfer is
    completed, the DMA controller will signal the CPU with an interrupt.


    Typical scenarios of block memory copy where DMA can be useful are network packet
    routing and video streaming. DMA is a particular advantage in situations where
    the blocks to be transferred are large or the transfer is a repetitive operation
    that would consume a large portion of potentially useful CPU processing time.


    # ## NXP Smart Direct Memory Access Controller (SDMA)


    The Smart Direct Memory Access (SDMA) controller in i.MX6 Series Applications
    Processors offer highly-competitive DMA features with software-based virtual-DMA
    flexibility. It enables data transfers between peripheral I/O devices and internal/external
    memories. The SDMA controller helps maximize system performance by off-loading
    the ARM® core in dynamic data routing.


    The following figure shows a block diagram of the SDMA controller. It includes
    a custom RISC core along with its RAM, ROM, DMA units, and the scheduler:'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# DMA Drivers


    ![](img/739a35b59067f8a55eff80a58765146f_313_0.png)


    © 2016 NXP B.V.


    The DMA core executes short routines to perform DMA transfers; these are called
    scripts. The DMA core interfaces to its own memory via the "SDMA system bus".
    The SDMA system bus supports a 32-bit data path and a 16-bit address bus. The
    system bus datapath is used for both 16-bit instruction (program) memory access
    and 32-bit data access. DMA units interface to the core via the "Functional Unit
    Bus" and dedicated registers to perform DMA transfers.


    The DMA memory contains a ROM and a RAM. The ROM contains startup scripts (for
    example, boot code) and other common utilities, which are referenced by the scripts
    that reside in the RAM. The internal RAM is divided into a context area and a
    script area. Every transfer channel requires one context area to keep the contents
    of the core and unit registers while inactive. Channel scripts are downloaded
    into the internal RAM by the SDMA using a dedicated channel that is started during
    the boot sequence.


    Downloads are invoked using commands and pointers provided by the ARM® platform.
    Every channel contains a corresponding channel script located in RAM and/or ROM
    that can be reconfigured independently as-needed. Channel scripts can be stored
    in an external memory'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Chapter 8


    downloaded when needed. The SDMA can be configured with any mixture of scripts
    to enable an endless combination of supported services.


    The scheduler monitors and detects DMA requests, mapping them to channels, mapping
    individual channels to a pre-configured priority. At any given point, the scheduler
    presents the highest priority channel that requires service to the SDMA core.
    A special SDMA core instruction is used to conditionally yield the current channel
    being executed to an channel that requires service. (If and only if) there is
    an eligible channel pending, the current channel execution is preempted. There
    are two yield instructions that determine the eligible channels differently: In
    the first version, eligible channels are pending channels with a strictly higher
    priority than the current channel priority. In the second version (yieldge), eligible
    channels are pending channels with a priority that is greater or equal to the
    current channel priority.


    The scheduler detects devices that need service through its 48 DMA requests. After
    a request is detected, the scheduler determines the channel(s) that is (are) triggered
    by this request and marks it (them) as pending in the Channel Pending (EP) register.
    The priorities of all the pending channels are continuously evaluated in order
    to update the highest priority. The channel pending flag is cleared by the channel
    script when the transfer completed.


    The ARM® platform control block contains the control registers used to configure
    the 32 individual channels. There are 48 Channel Enable registers, and every register
    maps one DMA request to any desired combination of channels. The 32 Priority registers
    are used to assign a programmable 1-of-7 level priority to every possible channel.
    This block also contains all control registers that the ARM® platform can access.
    The 48 DMA requests that are connected to the scheduler come from a variety of
    sources. The "receive register full" and "transmit register empty" signals found
    in the UART and USB ports are typical examples of DMA requests that can be connected
    to the SDMA. These requests can be used to trigger a specific SDMA channel, or
    several channels.


    # NXP Smart Direct Memory Access Controller (SDMA) API


    The NXP Smart Direct Memory Access Controller (SDMA) API driver controls the SDMA
    hardware. It provides an API to other drivers for transferring data between MCU
    memory space and the peripherals. It supports the following features:


    +   1. Loading channel scripts from the MCU memory space into SDMA internal RAM.

    2. Loading context parameters of the scripts.


