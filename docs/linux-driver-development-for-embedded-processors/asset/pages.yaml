    # DMA Scatter/Gather Mappings


    The allocated buffer can be fragmented in the physical memory and does not need
    to be allocated contiguously. These allocated physical memory blocks are mapped
    to a contiguous buffer in the calling virtual address space, thus enabling easy
    access to the allocated physical memory blocks.


    There are different ways to send contents of several buffers over DMA. They can
    be sent one at a time mapping each or with scatter/gather, they can send them
    all at once (speed). Many devices can accept a scatterlist of array pointers and
    lengths. Scatterlist entries must be the size of a page (except ends).


    Scatter/gather I/O allows the system to perform DMA I/O operations on buffers
    which are scattered throughout physical memory. For example, the case of a large
    (multi-)page buffer created in the user space. The application sees a continuous
    range of virtual addresses, but the physical pages behind these addresses will
    almost certainly not be adjacent to each other. If that buffer is to be written
    to a device in a single I/O operation, one of two things must be done: (1) the
    data must be copied into a physically-contiguous buffer, or (2) the device must
    be able to work with a list of physical addresses and lengths, grabbing the right
    amount of data from each segment. Scatter/gather I/O, eliminating the need to
    copy data into contiguous buffers, can greatly increase the efficiency of I/O
    operations while simultaneously getting around the problem generated by the creation
    of large, physically-contiguous buffers.


    First, create a scatterlist to perform a scatterlist DMA transfer:


    ```

    struct scatterlist *sg;

    ```'
