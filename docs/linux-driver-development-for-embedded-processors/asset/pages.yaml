  md: "3. Register to the I2C bus as a driver:\n\n```\nmodule_i2c_driver(ltc2607_driver);\n\
    ```\n\n4. Add \"ltc2607\" to the list of devices supported by the driver:\n\n\
    ```\nstatic const struct device_id dac_dt_ids[] = {\n    { .compatible = \"arrow,ltc2607\"\
    , },\n};\nMODULE_DEVICE_TABLE(of, dac_dt_ids);\n```\n\n5. Define an array of i2c\
    \ device_id structures:\n\n```\nstatic const struct i2c device_id ltc2607_id[]\
    \ = {\n    { \"ltc2607\", 0 },\n};\nMODULE_DEVICE_TABLE(i2c, ltc2607_id);\n```\n\
    \n# IIO Industrial Framework as an IIO Device\n\n1. Include the required header\
    \ files:\n\n2. If the driver needs to support multiple devices then pointers must\
    \ be kept between physical devices (devices as handled by the physical bus, I2C\
    \ in this case) and logical devices (devices handled by subsystems, like the Industrial\
    \ subsystem in this case). This way, when the remove() routine is called (typically\
    \ if the bus detects the removal of a device), you can find out logical device\
    \ to unregister. Conversely, when there is an event on the logical side (such\
    \ as executing the IIO_raw writing callback function), you can find out which\
    \ I2C slave corresponds to, to do the specific things with the hardware.\n\nThis\
    \ need is typically implemented by creating a \"private\" data structure to manage\
    \ the device and implement such pointers between the physical and logical worlds.\n\
    \nTo detect multiple devices using the same driver, you have to declare several\
    \ nodes in the Device Tree. In general, the role of the Device Tree is to make\
    \ indiscoverable devices discoverable and fit them into the Linux device driver\
    \ model. These devices must be defined manually. The probe function in the driver\
    \ is called for each device, so in the probe() function body, you must not use\
    \ any global pointer variable.\n\nEach device's private structure is allocated\
    \ dynamically for each probe call. A pointer to the"
  merge: -1
  pgno: 377
- img_proc: true
  md: "private structure has to be stored somewhere. The bus abstraction gives us\
    \ void pointer to a struct device. Some getter/setter functions are defined (e.g.,\
    \ i2c_set_clientdata/i2c_get_clientdata), so that you can attach/get each private\
    \ structure to/from the struct device at probe/remove calls.\n\nIn the Ltc2607\
    \ Kernel module you can connect just one physical device to the bus, but there\
    \ is a way to manage the driver’s behavior when more than one LTC2607 DAC is connected\
    \ to the i2c3 bus. The 0x72 i2c address has been selected via external hardware\
    \ configuration using the CA0, CA1 and CA2 pins, but the address 0x73 is always\
    \ present in the device apart from the selected 0x72 i2c address. So, you will\
    \ add two different nodes to the Device Tree, with one an i2c address of 0x72\
    \ and the other one with the i2c address of 0x73, simulating different devices.\
    \ In your custom hardware two or more different devices can be added to the same\
    \ i2c bus and controlled using the same driver.\n\nSee the two nodes that must\
    \ be added to the device tree i2c3 node controller below, as was already explained\
    \ in the previous Device Tree section:\n\n```\nltc26072 {\n  compatible = \"arrow,ltc2607\"\
    ;\n  reg = <0x72>;\n}\n```\n\n```\nltc260773 {\n  compatible = \"arrow,ltc2607\"\
    ;\n  reg = <0x73>;\n}\n```\n\nAdd the following private structure to your code:\n\
    \n```\nstruct ltc2607_device {\n  struct i2c_client *client;\n  char name[8];\n\
    }\n```\n\n3. In the ltc2607_probe() function, declare an instance of this structure:\n\
    \n```\nstruct ltc2607_device *data;\n```\n\n4. To be able to access the private\
