  md: '# Memory Management Drivers


    # RAM


    ATAGS <R2>


    ![](img/739a35b59067f8a55eff80a58765146f_285_0.png)


    Kernel


    Very early in the boot process (Linux/arch/arm/kernel/head.S), before calling
    start_kernel(), in non-Device Tree Linux systems, the Kernel calls __lookup_machine_type
    (located in Linux/arch/arm/kernel/head-common.S) that gets the machine type and
    compares it with the .arch.info.init (filled with the MACHINE_START macro declaration).
    If found, it knows the machine descriptions and continues the boot process.


    After determining the type of processor it is running on, the function __create_page_tables()
    (located in Linux/arch/arm/kernel/head.S) is called. This sets up an initial set
    of MMU tables used only during this initialization. It finds the physical address
    of RAM in the system and determines where to place the L1 page entry. This placing
    is immediately below the Kernel entry point (recall that an L1 page table is 16KB
    with 4096 entries, so must start 16KB below). Mappings are created using 1MB systems,
    with no L2 page tables. The function then creates a section entry in L1 for the
    Kernel code to be mapped into physical memory. At this stage of the boot, only
    the Kernel direct memory is mapped.


    After the initial page tables are setup, the system branches to a function that
    invalidates the caches and TLB. The next step is to enable the MMU. When the MMU
    is enabled, you are working with virtual rather than physical addresses. The code
    in __enable_mmu() enables the caches, branch predictors and then the MMU.


    In Device Tree Linux systems the machine type is defined in the Device Tree itself.
    The bootloader can dynamically add some information to the Device Tree and passes
    a pointer to the tree, located in system memory, through R2 (for ARM® architectures).
    R2 contains DTB address. With the Device Tree method, the bootloader loads both
    the Kernel image and the compiled Device Tree binary into RAM memory and passes
    the memory'
