    # Kernel Space


    # IO Space


    You have just developed a driver for the dual DAC, and the next challenge will
    be to develop a driver that reads the analog outputs from the DAC device. To accomplish
    this task you will use the LTC2422 dual ADC spi device that is included in the
    DC934A board. The LTC2607 DAC outputs are connected to both LTC2422 ADC inputs.
    Prior to developing the driver you are going going to read the DAC analog outputs
    using the Linux user space SPI API.


    The LTC2422 Linear Tech device is a 2-channel 2.7V to 5.5V micropower 20-bit analog-digital
    converter with an integrated oscillator,8ppm INL and 1.2ppm RMS noise. This device
    uses delta-sigma technology and a new digital filter architecture that settles
    in a single cycle. This eliminates the latency found in conventional sigma delta
    converters and simplifies- multiplexed applications. This converter can accept
    an external reference voltage from 0.1V to VCC.


    The LTC2422 serial output data stream is 24 bits long. The first 4 bits represent
    status information indicating the sign, selected channel, input range and conversion
    state. The next'
