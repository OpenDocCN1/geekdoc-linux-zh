- img_proc: true
  md: '# Kernel Frameworks for Device Drivers


    20 bits are the conversion result, MSB first.


    Bit 23 (first output bit) is the end of conversion (EOC) indicator. This bit is
    available at the SDO pin during the conversion and sleep states whenever the CS
    pin is LOW. This bit is HIGH during the conversion and goes LOW when the conversion
    is complete.


    Bit 22 (second output bit) for the LTC2422, this bit is LOW for the last conversion
    performed on CH0 and HIGH for CH1. This bit always LOW for the LTC2421.


    Bit 21 (third output bit) is the conversion result sign indicator (SIG). If VIN
    is >0, this bit is HIGH. If VIN is <0, this bit is LOW. The sign bit changes during
    the conversion.


    Bit 20 (fourth output bit) is the extended input range (EXR) indicator. If the
    input is within the normal input range 0 ≤ VIN < VREF, this bit is LOW. If the
    input is outside the normal range, VIN > VREF or VIN = 0, this bit is HIGH.


    Bit 19 (fifth output bit) is the most significant bit (MSB).


    Bits 19-0 are the 20-conversion result MSB first.


    Bit 0 is the least significant bit (LSB).


    Data is shifted out of the SDO pin under control of the serial clock (SCK). Whenever
    CS is HIGH, SDO remains high and any SCK clock pulses are generated by the internal
    data shift register. In order to shift the conversion result out of the device,
    CS must be driven LOW. EOC is seen on the SDO pin of the device once CS is pulled
    LOW. EOC changes real time from HIGH to LOW at the completion of a conversion.
    This signal may be used as an interrupt for an external microcontroller. Bit 23
    (EOC) can be captured on the first rising edge of SCK. Bit 22 is shifted out of
    the device on the first falling edge of SCK. The final data bit (Bit 0) is shifted
    out on the falling edge of the 23rd SCK and may be latched on the rising edge
    of the 24th SCK pulse. On the falling edge of the 24th SCK pulse, SDO goes HIGH
    indicating a new conversion cycle has been initiated. This bit serves as EOC (Bit23)
    for the next conversion cycle.


    ![](img/739a35b59067f8a55eff80a58765146f_389_0.png)


    The DC934A schematic you can see that the LTC2607 DAC output B is connected to
    LTC2422 channel O and that the LTC2607 DAC output A is connected to the LTC2422
    channel 1.'
