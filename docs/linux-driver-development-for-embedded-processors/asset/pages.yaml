  md: "# Input Framework as an Input Device\n\n1. Include the required header files:\n\
    \n```\n# include linux/input-polled.h /* struct input_polled_dev, input_\nallocate_polled_device(),\
    \ input_register_polled_device() */\n```\n\n2. The device model needs to keep\
    \ pointers between physical devices (devices handled by\nthe physical bus, I2C\
    \ in this case) and logical devices (devices handled by subsystems, like the\n\
    Input subsystem in this case).\n\nThis need is typically implemented by creating\
    \ a \"private\" data structure to manage the device\n implement such pointers\
    \ between the physical and logical worlds. This private structure\nallows the\
    \ driver to manage multiple devices using the same driver. Your accelerometer\
    \ driver\ndiscover only one device, but you will see later in the IIO framework\
    \ driver example how\nseveral devices can be discovered using the same driver.\
    \ Add the definition below to\nyour code:\n\n```\nstruct ioaccel_dev {\n    struct\
    \ i2c_client *i2c_client;\n    struct input_polled_dev *polled_input;\n};\n```\n\
    \n3. In the ioaccel_probe() function, declare an instance of this structure:\n\
    \n```\nstruct ioaccel_dev *ioaccel;\n```\n\n4. In the ioaccel_probe() function\
    \ allocate one private structure for the new i2c slave device. a\npinter to the\
    \ struct i2c_client is passed as an argument to the ioaccel_probe() function when\n\
    there a match between the DT i2c device node compatible property \"arrow,ioaccel\"\
    \ and the\ndriver's \"arrow,ioaccel\" compatible string.\n\n```\nioaccel = devm_kzalloc(client->dev,\
    \ sizeof(struct ioaccel_dev),\n             GFP_KERNEL);\n```\n\n5. To be able\
    \ to access your private data structure in other parts of the driver, you need\
    \ to\nattach it to the i2c_client structure using the i2c_set_clientdata() function.\
    \ This function\nstores ioaccel in client->dev->driver_data. You can retrieve\
    \ the ioaccel pointer using the\nfunction i2c_get_clientdata(client);\n\n```\n\
    i2c_set_clientdata(client, ioaccel); /* write it in the probe() function\n*/\n\
    ioaccel = i2c_get_clientdata(client); /* write it in the remove()\nfunction */\n\
    ```"
