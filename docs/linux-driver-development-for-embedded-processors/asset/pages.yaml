- img_proc: true
  md: '# Bus Controller Drivers


    For a specific bus type there could be many different controllers provided by
    different vendors. Each of these controllers needs a corresponding bus controller
    driver. The role of a bus controller driver in maintenance of the device model,
    is similar to that of any other device driver in that, it registers itself with
    driver_register(). But apart from registering itself, it also detects devices
    on the bus it is controlling and registers the devices on the bus using device_register().


    When a bus controller probe() function creates the devices on its bus, the device
    creation will result in the device driver probe() function being called if the
    device driver has already been registered.


    On embedded systems, devices are not necessarily connected through a bus enumeration,
    hotplugging, and providing unique identifiers for devices. For example, the devices
    on i2c buses or spi buses, or the devices directly included as part of the system-on-chip.
    These devices are still part of the device model, but instead of being dynamically
    detected they are statically described using the Kernel source code (older Kernels)
    or via the Device Tree (file loaded with Kernel).


    Non-Device systems rely on a static list of platform devices for all non-discoverable
    devices. For Device Tree systems we can have two kind of devices:


    +   1. Platform devices: Platform devices are that typically appear as autonomous
    entities in the system. This includes legacy port-based devices and host bridges
    to peripheral buses, and most controllers integrated into system-on-chip platforms.
    What they use in common is direct addressing from a CPU bus.


    of_platform_populate() function (called from machine_init()) walks through the
    nodes (nodes should have a compatible property) in the Device Tree creating platform
    devices at runtime from it.


    Creation of platform devices, registration of platform drivers and binding of
    drivers to devices is done within the do_initcalls() function. This will be detailed
    in the "I.MX6 Kernel Booting and I/O Physical to Virtual Static Memory Mapping
    section in Chapter 7.


    +   2. Non-discoverable devices connected to other buses (For example i2c bus
    or SoC specific buses). These devices are not created by the of_platform_populate()
    function. They are typically created by the bus driver probe() function.'
  merge: -1
