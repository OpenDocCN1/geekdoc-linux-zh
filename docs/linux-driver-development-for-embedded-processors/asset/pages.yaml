    # Deploy and Run a Cross-compiled Application


    To execute a cross-compiled Linux application you have to deploy it on the i.MX6
    target device. This procedure can be boring and painful, in particular if you
    have to reprogram the system each time. Different solutions will be explored in
    order to ease deployment of your cross-compiled application during development
    phase. Two methods will be used SCP (secure copy) and NFS (network file system).
    Your "app" application will be transferred from the host to the target. The scp
    command will help you with this task. Secure Copy (scp) is an application that
    will allow you to remotely copy files or whole directory trees through an encrypted
    connection (actually ssh data connection).'
