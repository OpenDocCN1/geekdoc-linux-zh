  md: '# SABRE for Smart Devices Based on the i.MX 6Quad


    ![](img/739a35b59067f8a55eff80a58765146f_367_0.png)


    # Industrial I/O (IIO) Subsystem Drivers


    The main purpose of the Industrial I/O subsystem (IIO) is to provide support for
    devices that in some sense perform either analog-to-digital conversion (ADC),
    digital-to-analog conversion (DAC) or both. The aim is to fill the gap between
    the somewhat similar hmonon and Input subsystems. Hmonon is directed at low sample
    rate sensors used to monitor and control the system itself, like fan speed control
    or temperature measurement. Input is, as its suggests, focused on human interaction
    input devices (keyboard, mouse, touchscreen). In some cases there is considerable
    overlap between these and IIO.


    Devices that fall into the IIO category include:


    +   1. Analog to digital converters (ADCs)

    2. Accelerometers

    3. Capacitance to digital converters (CDCs)

    4. Digital to analog converters (DACs)

    5. Gyroscopes

    6. Inertial measurement units (IMUs)

    7. Color and light sensors

    8. Magnetometers

    9. Pressure sensors

    10. Proximity sensors

    11. Temperature sensors'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'Usually these sensors are connected via SPI or I2C. A common use case of the
    sensors devices is to have combined functionality (e.g. light plus proximity sensor).
    However typical DMA mastered devices such as ones connected to a high speed synchronous
    serial or high speed synchronous parallel peripherals are also subject to this
    subsystem.


    # Application Area


    ![](img/739a35b59067f8a55eff80a58765146f_368_0.png)


    # Kernel Area


    IIO Subsystem


    IIO Device Drivers


    Hardware


    The Industrial I/O core offers:


    +   1. A unified framework for writing drivers for many different types of embedded
    sensors.

    2. A standard interface to User space applications manipulating sensors.


    The implementation can be found under Linux/drivers/iio/industrialio-*

    An IIO device usually corresponds to a single hardware sensor and it provides
    all the information needed by a driver handling a device. First, have a look at
    the functionality embedded in an IIO device, then you will see how a driver makes
    use of an IIO device.


    There are two ways for a User space application to interact with an IIO driver:


    +   1. /sys/bus/iio/deviceX - this represents a hardware sensor and groups together
    the data channels of the same chip.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# /dev/lio:device - this is the character node interface used for buffered
    data transfer\and for events information retrieval.


    A typical IIO driver will register itself as an i2c or spi driver and will create
    two routines, probe()

    and remove().


    At probe():


    +   1. The driver will call devm_lio_device_alloc(), which allocates memory for
    IIO device.

    2. The driver will initialize IIO device fields with device specific information
    (e.g., device name,

    device channels).

    3. The driver will call devm_lio_device_register(), that registers the device
    to the IIO core.

    he device is global to the rest of the driver functions until it is unregistered.
    After this call the

    device is ready to accept requests from User space applications.


    # IIO Devices Interface


    Attributes are sysfs files used to expose chip info and also allowing applications
    to set various

    configuration parameters. For a device with index X, attributes can be found under
    /sys/bus/

    lio/lio:device/X directory. These are some common attributes:


    +   1. name - description of the physical chip.

    2. dev - shows the major:minor pair associated with /dev/lio:deviceX node.

    3. device configuration attributes (sampling_frequency_available).

    4. data channel access attributes (out_voltage0_raw).

    5. buffer/, events/, trigger/, scan elements/.


    The available standard attributes for IIO devices are described in the Documentation/ABI/

    testing/sysfs-bus-lio file in the Linux Kernel sources.


    # IIO Device Channels


    An IIO device channel is a representation of a data channel. An IIO device can
    have one

    multiple channels. For example:


    +   1. A thermometer sensor has one channel representing the temperature measurement.

    2. A light sensor with two channels indicating the measurements in the visible
    and infrared

    sspectrum.

    3. An accelerometer can have up to three channels representing acceleration on
    the X, and Y

    Z axes.'
  merge: -1
  pgno: 369
- img_proc: true
  md: "An IIO channel is described by the struct iio_chan_spec.\n\nIn the next lab\
    \ you are going to develop a Kernel module that controls three channels of a dual\
    \ digital-to-analog converter, channel 0 represents the digital value sent to\
    \ DAC A, channel 1 represents the digital value sent to DAC B, and channel 2 represents\
    \ a digital value that will be simultaneously sent to both DAC A and DACB. You\
    \ can see the IIO channels definition that will be used in the next developed\
    \ digital-to-analog converter driver:\n\n```\nstatic const struct iio_chan_spec\
    \ ltc2607_channel[] = {\n    .type = IIO_VOLTAGE,\n    .indexed = 1,\n    .output\
    \ = 1,\n    .channel = 0,\n    .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),\n\
    },\\{\n    .type = IIO_VOLTAGE,\n    .indexed = 1,\n    .output = 1,\n    .channel\
    \ = 1,\n    .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),\n},\\{\n    .type =\
    \ IIO_VOLTAGE,\n    .indexed = 1,\n    .output = 1,\n    .channel = 2,\n    .info_mask_separate\
    \ = BIT(IIO_CHAN_INFO_RAW),\n};\n```\n\nChannel sysfs attributes exposed to the\
    \ User space are specified in the form of bitmasks. Depending on their shared\
    \ info, attributes can be set in one of the following masks:\n\n+   1. info_mask_separate,\
    \ attributes will be specific to this channel.\n2. info_mask_shared_by_type, attributes\
    \ are shared by all channels of the same type.\n3. info_mask_shared_by_dir, attributes\
    \ are shared by all channels of the same direction.\n4. info_mask_shared_by_all,\
    \ attributes are shared by all channels.\n\nWhen there are multiple data channels\
    \ per channel type there are two ways to distinguish between them:\n\n+   1. Set\
    \ the .modified field of iio_chan_spec to 1. Modifiers are specified using the\
    \ .channel2 field of the iio_chan_spec structure and are used to indicate a physically\
    \ unique characteristic of the channel such as its direction or spectral response.\
    \ For example, a light sensor can have two channels, one for infrared light and\
    \ one for both infrared and visible light."
