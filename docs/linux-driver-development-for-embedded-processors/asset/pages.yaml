  md: 'Run the following commands to clean up the environment variables to their defaults:


    ```

    U-Boot > env default -f -a

    U-Boot > saveenv

    U-Boot > reset

    ```


    To perform network booting using a DHCP server, set the following environment
    variables at the U-Boot prompt:


    ```

    U-Boot > dhcp /* get IP address 10.0.0.10 using DHCP */

    U-Boot > setenv serverip 10.0.0.1 /* this is our host ip address */

    U-Boot > setenv image ''zImage'' /* the name of our kernel image */

    U-Boot > setenv fdt file ''imx6q-sabresd.dtb'' /* specify the filename of the
    device file *

    U-Boot > setenv nfsroot /nfsroot /* nfsroot is the root for the NFS server, where
    we untared the target''s root filesystem */

    U-Boot > saveenv /* save the environment variables */

    U-Boot > run netboot /* start network booting */

    ```


    To perform network booting, without using a DHCP server, set the following environment
    variables at the U-Boot prompt:


    ```

    U-Boot > setenv serverip 10.0.0.1

    U-Boot > setenv ipaddr 10.0.0.1

    U-Boot > setenv image ''zImage''

    U-Boot > setenv fdt file ''imx6q-sabresd.dtb''

    U-Boot > setenv nfsroot /nfsroot

    U-Boot > setenv ip_dyn no /* disable DHCP on boot */

    U-Boot > setenv narget ''setenv bootargs \

    consoleconsole=(console),$(baudrate) $(smp) root=/dev/nfs rootwait

    rw ip=10.0.0.10:10.0.0.1:10.0.0.0.255.255.255.0:eth0:off

    nfsroot=$(serverip):$(nfsroot),v3,tcp

    U-Boot > saveenv

    U-Boot > run netboot

    ```'
