  md: "# # Chapter 2\n The Linux Device and Driver model\n\n# ## The Linux Device\
    \ and Driver Model\n\nUnderstanding the Linux device and driver model is central\
    \ to developing device drivers in Linux. A unified device model was added in Linux\
    \ Kernel 2.6 to provide a single mechanism for representing devices and describing\
    \ their topology in the system. The Linux device and driver model is an universal\
    \ way of organizing devices and drivers into buses. Such a system provides several\
    \ benefits:\n\n+   - Minimization of code duplication.\n- Clean code organization\
    \ with the device drivers separated from the controller drivers, the hardware\
    \ description separated from the drivers themselves, etc.\n- Capability to determine\
    \ all the devices in the system, view their status and power state, what bus they\
    \ are attached to and determine which driver is responsible for them.\n- Capability\
    \ to generate a complete and valid tree of the entire device structure of the\
    \ system, including all buses and interconnections.\n- The capability to link\
    \ devices to their drivers and viceversa.\n- Categorization of devices by their\
    \ type (classes), such as input devices, without the need to understand the physical\
    \ device topology.\n\nThe device model involves terms like \"device\", \"driver\"\
    , and \"bus\".\n\n+   - device: A physical or virtual object which attaches to\
    \ a bus.\n- driver: A software entity which may probe for be bound to devices,\
    \ and which can perform certain management functions."
  merge: -1
  pgno: 92
- img_proc: true
  md: "# The Linux Device and Driver model\n\n- bus: A device which serves as an attachment\
    \ point for other devices.\n\nThe device model is organized around three main\
    \ data structures:\n\n+   1. The struct bus_type structure, which represents one\
    \ type of bus (e.g.; USB, PCI, I2C).\n2. The struct device_driver structure, which\
    \ represents one driver capable of handling certain devices on a certain bus.\n\
    3. The struct device_driver structure, which represents one device connected to\
    \ a bus.\n\nThe Linux device and driver model code has been split into several\
    \ parts:\n\n+   1. Bus drivers (core).\n2. Bus controller drivers.\n3. Device\
    \ drivers (connected to a bus).\n\n# Bus Drivers\n\nFor each bus supported by\
    \ the Kernel there is a generic bus driver. A bus is a channel between the processor\
    \ and one more devices. For the purposes of the device model, all devices are\
    \ connected via a bus, even if it is an internal, virtual, \"platform\" bus.\n\
    \nThe device driver allocates a struct bus_type and registers it with the Kernel's\
    \ list of bus types. The struct bus_type structure (Linux/include/linux/device.h)\
    \ represents one type of bus (USB, PCI, I2C, etc.). The registration of the bus\
    \ in a system is done using bus_register(). The struct bus_type is defined as:\n\
    \n```\nstruct bus_type {\n    const char *name;\n    const char *dev_name;\n \
    \   struct device *dev_root;\n    struct device attribute *dev_attrs;\n    const\
    \ struct attribute_group **bus_groups;\n    const struct attribute_group **dev_groups;\n\
    \    const struct attribute_group **drv_groups;\n\n    int (*match)(struct device\
    \ *dev, struct device_driver *drv);\n    int (*uevent)(struct device *dev, struct\
    \ device *dev, struct kobj_uevent *env);\n    int (*probe)(struct device *dev);\n\
    \    int (*remove)(struct device *dev);\n    void (*shutdown)(struct device *dev);\n\
    \n    int (*online)(struct device *dev);\n    int (*offline)(struct device *dev);\n\
    \n    int (*suspend)(struct device *dev, struct pm_message_t state);\n    int\
    \ (*resume)(struct device *dev);n\n```"
  merge: -1
  pgno: 93
- img_proc: true
