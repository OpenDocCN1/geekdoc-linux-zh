  md: '# # Chapter 6

    Handling Interrupts in Platform Drivers


    # ## Interrupt Handling


    An IRQ is an interrupt request from a device. They can come in over a pin or over
    a packet. Several devices may be connected to the same pin, thus sharing an IRQ.


    The IRQ number is an enumeration of the possible interrupt sources on a machine.
    Typically what is enumerated is the number of input pins all of the interrupt
    controllers in the system. The IRQ number is a virtual interrupt ID, and hardware
    independent.


    The current design of the Linux Kernel uses a single large number space where
    each separate IRQ source is assigned a different number. This is simple when there
    is only one interrupt controller, but in systems with multiple interrupt controllers
    the Kernel must ensure that each one gets non-overlapping allocations of Linux
    IRQ numbers.


    The number of interrupt controllers registered as unique irchips is growing; for
    example subdividers of different kinds such as GPIO controllers avoid re-implementing
    identical callback mechanisms such as the IRQ core system by modelling their interrupt
    handlers as irchips cascading interrupt controllers. Here the interrupt number
    loses all correspondence to hardware interrupt numbers, the hwirq (hardware irq
    number) is a peripheral interrupt identifier in the actual hardware interrupt
    controller. Whereas in past, IRQ numbers could be chosen so that they match the
    hardware IRQ line into the root interrupt controller (i.e., the component actually
    firing the interrupt line to the CPU) nowadays this number is just a number. For
    this reason we need a mechanism to separate controller-local interrupt numbers,
    called hardware irq''s, from Linux IRQ numbers.'
