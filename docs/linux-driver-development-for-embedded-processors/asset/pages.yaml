  md: "The scatterlist struct (located in /include/linux/scatterlist.h) is defined\
    \ as follows:\n\n```\nstruct scatterlist {\n    unsigned long page_link;\n   \
    \ unsigned int offset;\n    unsigned int length;\n    dma_addr_t dma address;\n\
    \    unsigned int dma_length;\n};\n```\n\nInitialize a scatterlist array with:\n\
    \n```\nvoid sg_init_table(struct scatterlist *sg, unsigned int nents);\n```\n\n\
    Here, sg points to the allocated array, and nents is the number of allocated scatter/gather\
    \ entries.\n\nSet each entry in the allocated array sg to point at given data:\n\
    \n```\nvoid sg_set_buf(struct scatterlist *sg, const void *buf, unsigned int buflen);\n\
    ```\n\nHere, buf is the virtual address pointer of your allocated buffer and buflen\
    \ is the length of the allocated buffer.\n\nMap the scatterlist to get the DMA\
    \ addresses. For each buffer in the input scatterlist, dma_map_sg determines the\
    \ proper bus address to give to the device:\n\n```\nint dma_map_sg(device, sg,\
    \ nent, direction)\n```\n\nReturns the number of DMA buffers to send (<= nent).\n\
    \nOnce the transfer is complete, a scatter/gather mapping is unmapped with a call\
    \ to dma_unmap_sg:\n\n```\nvoid dma_unmap_sg(device, sg, nent, direction);\n```\n\
    \nThere is also a for_each_sg() macro which can be used to iterate through an\
    \ entire scatterlist, it will typically be used in code which looks like:\n\n\
    ```\nint i, count = dma_map_sg(dev, sglist, nents, direction);\nstruct scatterlist\
    \ *sg;\nfor_each_sg(sglist, sg, count, i) {\n    hw_address[i] = sg_dma_address(sg);\n\
    \    hw_len[i] = sg_dma_len(sg);\n}\n```"
