    The Ksoftirqd/0 thread is an aid to implement softirqs. Softirqs are raised by
    interrupt handlers to receive bottom half processing. On SMP machines like the
    i.MX6 Quad where multiple thread instances can run on different processors in
    parallel, one instance of Ksoftirqd is created by CPU (Ksoftirqd/n, where n is
