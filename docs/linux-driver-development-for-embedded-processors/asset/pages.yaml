    # Linux Pinctrl Subsystem


    In the old Linux pin muxing code had its own pin-muxing code with a specific API.
    A lot of similar functionality was implemented in different ways. The pin-mux
    had to be done at the SoC level, and couldn''t be requested by device drivers.


    The newinct subsystem mainly developed and maintained by Linus Walleij, from Linaro/ST-Ericsson
    aims at solving these problems. It is implemented in Linux/drivers/pinctrl and
    provides:


    +   1. An API to register a pinctrl driver (IOMUXC driver) i.e., entities knowing
    the list of pins, functions, and how to configure them. Used by SoC specific drivers
    to expose pin-mux capabilities.

    2. An API for device drivers to request the muxing of a certain set of pins.

    3. Interaction with the GPIO framework.


    The pin control subsystem in Linux deals with:'
