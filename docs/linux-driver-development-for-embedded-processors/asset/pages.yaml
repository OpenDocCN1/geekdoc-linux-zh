    \nConnect the daughter to the i.MX6 i2c3 bus controller which is accessible via\
    \ the HummingBoard microBUS Click Module. Open the imx6dl-hummingboard2.dtsi file.\
    \ Add the mma8451 node inside the i2c3 node:\n\n```\nclock-frequency = <100000>;\n\
    ppintrl-names = \"default\";\nppintrl-0 = <<pintrl_hummingboard2_i2c3>;\nstatus\
    \ = \"okay\";\n\nmma8451@i2c {\n    compatible = \"arrow,mma8451\";\n    reg =\
    \ <0x1c>;\n}\n```\n\nThe evtest application is needed to test this driver. The\
    \ application is not included in the \"core-image-x11\".\n\nSee the packages provided\
    \ by our core-image-x11 to verify that evtest application is not included:\n\n\
    ```\n~/solidrun-release-bsp/poky$ source oe-init-build-env\n~/solidrun-release-bsp/poky/build$\
