    klist_drivers member of the subsys_private structure is a list of drivers that
    can handle devices on that bus. This list is updated by the driver_register()
    which is called when a driver initializes


    When a new device is plugged into the system, the bus controller driver detects
    the device and calls device_register(). When a device is registered by the bus
    controller driver, the parent member of the struct device is pointed to the bus
    controller device so to build the physical device list. The list of drivers associated
    with the bus is iterated over to find out if there are any drivers that can handle
    the device. The match function provided in the bus_type structure is used to check
    if a given driver can handle a given device. When a driver is found to handle
    the device, the driver member of the struct device is pointed to the corresponding
    driver.


    When a Kernel module is inserted into the Kernel and the driver calls driver_register(),
    the list of devices associated with the bus is iterated over to find out if there
    are any devices that the driver can handle using the match function.


    When a match is found, the device is associated with the device driver and the
    driver s probe() function is called, this is what we call binding.


    When does a driver attempt to bind a device?


    +   1. When the driver is registered (if the device already exits).

    2. When the device is created (if the driver is already registered).


    Summarizing, the bus driver registers a bus in a system and:


    +   1. Allows registration of bus controller drivers, whose role is to detect
    devices, and

    2. Allows registration of device drivers.

    3. Matches devices and drivers.'
