    \ driver will now be described:\n\n+   1. Include header files:\n\n```\n#include\
    \ <linux/wait.h> /* DECLARE_WAIT_QUEUE_HEAD() && wait_event_interruptible() &&\
    \ wake_up() */\n#include <linux/sched.h>\n```\n\n+   2. Declare wait queue:\n\n\
    ```\nstatic DECLARE_WAIT_QUEUE_HEAD(hello_keys_wait);\n```\n\n+   3. Sleep the\
    \ process within the kernel's callback function, and put the process in a wait\
    \ queue waiting for a specific event. Set the condition to be evaluated before\
    \ waking up:\n\n```\nret = wait_event_interruptible(hello_keys_wait, buf_wr !=\
    \ buf_rd);\n```\n\n+   4. In the ISR get the P/R values:\n\n```\nval = gpio_get_value(gpio_nb);\n\
    pr_info(\"Button state: 0x%08X\\n\", val);\nif (val == 0)\n    hello_keys_buf[buf_wr++]\
