  md: '# SLAB Allocator API


    The Linux Kernel slab allocation sub-system provides a general interface for creating
    and destroying a memory cache regardless of the type of SLAB allocator.


    +   1. The Kmem_cache_create() function creates a new memory cache:


    ```

    struct kmem_cache *kmem_cache_create(const char *name, size_t size, size_t align,
    unsigned long flags, void (*ctor)(void))

    ```


    +   - name: A string which is used in /proc/slabinfo to identify this cache.

    - size: The size of objects to be created in this cache.

    - align: Additional space added to each object (for some additional data).

    - flags: SLAB flags.

    - constructor: Used to initialize objects.


    Returns a pointer to the cache on success, NULL on failure.


    +   2. The Kmem_cache_destroy() function allows destruction of a memory cache
    by providing the kmem_cache object of the destroyed cache:


    ```

    void kmem_cache_destroy(struct kmem_cache *cp)

    ```


    SLOB, SLAB and SLUB allocators provide two functions for allocating (taking from
    cache) and freeing (putting back into the cache) a Kernel object. Defined as a
    function in Linux/mm/slab.c, these are Linux/mm/slob.c or Linux/mm/slab.c depending
    on the chosen SLAB technique.


    +   1. The Kmem_cache_alloc() function allocates an object of a specified type
    from a cache (a cache for specified object must be created before allocation):


    ```

    void *kmem_cache_alloc(struct kmem_cache *s, gfp_t gfpflags)

    ```


    +   2. The Kmem_cache_free() function frees an object and puts it back in the
    cache:


    ```

    void kmem_cache_free(struct kmem_cache *s, void *x)

    ```


    Assume that Linux Kernel module needs to allocate and release an object of a particular
    type. The kmem_cache_create() function to create a cache of that type struct,
    so that it can satisfy subsequent allocations (and releases). Based on the size
    of the struct, the SLAB allocator calculates the number of memory pages required
    for storing each slab cache'
