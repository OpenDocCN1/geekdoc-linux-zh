  md: '# Porting Kernel Modules to the HummingBoard Platform


    These are the main points of the new driver:


    +   1. The driver will support single tap detection on any of the 3 axis. The
    tap detection threshold is defined by the THRESH_TAP register (Address 0x1D).
    The SINGLE_TAP bit of the INT_SOURCE register (Address 0x30) is set when a single
    acceleration greater than the value in the THRESH_TAP register (Address 0x1D)
    occurs for less than is specified in the DUR register (Address 0x21). The single
    tap interrupt is triggered when the acceleration goes below the threshold, as
    long as DUR has not been exceeded. See page 28 of the ADXL345 Data Sheet.


    +   2. A threaded interrupt will be added to the driver to serve the single tap
    interrupt. In a threaded interrupt the interrupt handler is executed inside a
    thread. It is allowed to block during the interrupt handler, which is often needed
    for I2C/SPI devices as the interrupt handler needs to communicate with them. In
    this driver we are going to communicate via SPI with the ADXL345 device inside
    the interrupt handler.


    3. Two types of Linux input events will be generated:


    +   - EV_KEY type events, with BTN_TOUCH event when the single tap interrupt is
    triggered.

    - EV_ABS type events, with ABS_X, ABS_Y, and ABS_Z code when a DATA_READY or WATERMARK
    event has occurred. The EV_ABS events are generated the interrupt handler when
    a single tap interrupt has been triggered.


    4. You will create several sysfs entries to access the driver from the User Space.
    You can select the sample rate, calibrate the device, and read the 3 axis values
    using sysfs hooks.


    The sysfs attributes will be created with the DEVICE ATTR(name, mode, show, store)
    macro:


    ```

    static DEVICE_ATTR(calibrate, 0664, adxl345_calibrate_show,

    adxl345_calibrate_store);

    static DEVICE_ATTR(rate, 0664, adxl345_rate_show,

    adxl345_rate_store);

    static DEVICE_ATTR(position, S_IRUGO, adxl345_position, NULL);

    static DEVICE_ATTR(read, S_IRUGO, adxl345_position_read, NULL);

    ```


    These attributes can be organized into a group as:


    ```

    static struct attribute *adxl345_attributes[] = {

    &dev_attr_calibrate.attr,

    &dev_attr_rate.attr,

    &dev_attr_position.attr,

    &dev_attr_read.attr,

    NULL

    };

    ```'
