  md: "# Miscellaneous Character Driver\n\nThe Misc Framework is an interface exported\
    \ by the Linux Kernel that allows modules to register their individual minor numbers.\n\
    \nThe device driver implemented as a \"misc\" character driver uses the major\
    \ number allocated by the Linux Kernel for miscellaneous devices. This eliminates\
    \ the need to define a unique major number for the driver; this is important,\
    \ as a conflict between major numbers has become increasingly likely, and use\
    \ of the misc device class is an effective tactic. Each probed device is dynamically\
    \ assigned a minor number, and is listed with a directory entry within the sysfs\
    \ pseudo-filesystem under /sys/class/misc/.\n\nMajor number 10 is officially assigned\
    \ to the misc driver. Modules can register individual minor numbers with the misc\
    \ driver and take care of a small device, needing only a single entry point.\n\
    \n# Registering a Minor Number\n\n```\nstruct miscdevice {\n    int minor;\n \
    \   const char *name;\n    const struct file_operations *fops;\n    struct list_head\
    \ list;\n    struct device *parent;\n    struct device *this_device;\n    const\
    \ char *nodename;\n    umode_t mode;\n};\n```\n\n+   1. Minor is the minor number\
    \ being registered.\n2. Name is the name for this device, found in the /proc/misc\
    \ file.\n3. fops is a pointer to the file_operations structure.\n4. Parent is\
    \ the struct device that represents the hardware device exposed by this driver.\n\
    \nThe misc driver exports two functions, misc_register() and misc_deregister(),\
    \ for user modules to register and un their own minor number. These functions\
    \ are defined as function prototypes in Linux/include/linux/miscdevice.h and defined\
    \ as a function in Linux/drivers/misc.c."
  merge: -1
  pgno: 144
- img_proc: true
  md: "# Character Drivers\n\n```\nint misc_register(struct miscdevice *misc);\nint\
    \ misc_deregister(struct miscdevice *misc);\n```\n\nThe misc_register() function\
    \ registers a miscellaneous device with the Kernel. If the minor number is set\
    \ to MISC_DYNAMIC_MINOR a minor number is dynamically assigned and placed in the\
    \ minor field of the miscdevice structure. For other cases the minor number requested\
    \ is used.\n\nThe structure passed is linked into the Kernel and may not be destroyed\
    \ until it has been unregistered. By default, an open() syscall to the device\
    \ sets the file->private_data to point to the structure. Drivers don't need open\
    \ in fops for this. A zero is returned on success and a negative errno code for\
    \ failure.\n\nThe typical code sequence for assigning a dynamic minor number is\
    \ as follows:\n\n```\nstatic struct miscdevice my_dev;\n\nint init module(void)\n\
    {\n    int retval;\n    my_dev.minor = MISC_DYNAMIC_MINOR;\n    my_dev.name =\
    \ \"my device\";\n    my_dev.fops = &my_fops;\n    retval = misc_register(&my_dev);\n\
    \    if (retval) return retval;\n    pr_info(\"my: got minor %i\\n\", my_dev.minor);\n\
    \    return 0;\n}\n```"
