    # User Defined I/O: UIO


    The Linux Kernel provides a framework for developing User space drivers called
    UIO. This is a generic Kernel driver that allows you to write User space drivers
    that are able to access device registers and handle interrupts.


    There are three distinct UIO device drivers provided by Linux under "Linux/drivers/uio"
    folder:


    +   1. UIO Driver (Linux/drivers/uio.c)


    +   - The UIO driver creates files attributes in the sysfs describing the UIO
    device. It also maps the device memory into the process address space using its
    mmap(4) function.

    - A minimal Kernel space driver uio_pdrv("UIO platform driver"), uio_pdrv_genirq("UIO
    platform driver with generic interrupts"), or user provided kernel driver is required
    to setup the UIO framework. The uio.c driver contains common support routines
    that are used by the uio_pdrv and uio_pdrv_genirq drivers.'
