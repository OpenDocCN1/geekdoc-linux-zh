  md: 'where dev is a struct device *, addr is the pointer that contains the virtual
    buffer address (allocated with kmalloc()), size is the buffer size, and the direction
    choices are: DMA bidirectional, DMA_TO_DEVICE or DMA_FROM_DEVICE. The dma_handle
    is the DMA bus address returned for the device.


    How to unmap it:


    ```

    dma_unmap_single(dev, dma_handle, size, direction);

    ```


    You should call dma_unmap_single() when the DMA activity is finished, e.g., from
    the interrupt that indicated that the DMA transfer is done.


    These are the rules for streaming DMA mapping:


    +   - A buffer can only be used in the direction specified.

    - A mapped buffer belongs to the device, not the processor. The device driver
    must keep its hands off the buffer until it is unmapped.

    - A buffer used to send data to a device must contain the data before it is mapped.

    - The buffer must not be unmapped while DMA is still active, or serious system
    instability is guaranteed.'
