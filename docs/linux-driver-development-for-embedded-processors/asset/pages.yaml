  md: '3. sdma_open() set up the capabilities for the channel that will be requested,
    initialize the

    struct imx_dma_data, and request the dma channel from the dma engine:


    ```

    dma_cap_mask_t dma_m2m mask; /* capabilities that the channel will

    satisfy /*

    dma_cap_zero(dma_m2m mask);

    dma_cap_set(dma MEMCPY, dma_m2m mask);

    m2m_dma_data.peripheral_type = IMX_DATATYPE_MEMORY;

    m2m_dma_data.priority = DMA_PRIO_HIGH;

    dma_m2m_chan = dma_request_channel(dma m2m mask, dma m2m filter,

    dma_m2m_data); /* dma m2m_filter: optional callback to disposition

    available channels and dma_m2m_data: opaque parameter to pass to dma_m2m

    filter */

    ```


    The dma_cap_set() function sets transfer types your driver supports. It takes
    various

    flags as an argument:


    +   DMA_MEMCPY: Memory to memory copy.

    DMA_SG: Memory to memory scatter gather.

    DMA_INTERLEAVE: Memory to memory interleaved transfer.

    DMA_XOR: Memory to memory XOR.

    DMA_XOR_VAL: Memory buffer parity check using XOR.

    DMA_PQ: Memory to memory P+Q computation.

    DMA_PQ_VAL: Memory buffer parity check using P+Q.

    DMA_INTERRUPT: The device is able to generate a dummy transfer that will

    generate interrupts.

    DMA_SLAVE: Memory to device transfers.

    DMA_CYCLIC: The device is to handle cyclic transfers.


    The dma_request_channel() function provides parameters to allow a specific channel
    to be

    requested when there are multiple channels. When allocating a channel the dma
    engine finds

    the first channel that matches the mask and calls the function:


    ```

    struct dma_chan *dma_request_channel(dma_cap_mask_t mask,

    dma_filter_fn filter_fn, void *filter_param)

    ```


    dma_filter_fn is defined as:


    ```

    typedef bool (*filter_fn) (struct dma_chan *chan, void *filter_param)

    ```


    +   - filter_fn (dma_m2m_filter) will be called once for each free channel that
    has a

    capability in mask.

    - filter_fn is expected to return ''true'' when the desired dma channel is found.'
