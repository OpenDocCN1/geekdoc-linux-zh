  md: '# Platform Drivers


    Focus on both of the directories shown above:


    # 1. The List of Devices: /sys/devices


    This directory contains a filesystem representation of the Device Tree. It maps
    directly to the internal Kernel Device Tree, which is a hierarchy of struct device.
    There are three directories that are present on all systems:


    +   - system: This contains devices at the heart of the system, including a collection
    of both global and individual CPU attributes (cpu) and clocks.

    - virtual: This contains devices that are memory-based. You will find the memory
    devices that appear as /dev/null,/dev/random, and /dev/zero in virtual/mem. You
    will find the loopback device, lo, in virtual/net.

    - platform: This contains devices that are not connected via a conventional hardware
    bus. This could be anything other on an embedded device.


    ```

    root@imx6qsabsres:/# ls /sys/devices/

    ARMV7 Cortex-A9 iio0_sysfs_trigger soc0

    breakpoint platform software virtual

    ```


    /sys/devices tree contains a snapshot of the internal state of the Kernel Device
    Tree. Devices will be added and removed dynamically as the machine runs, and between
    different Kernel versions, the layout of the devices within this tree will change.
    Do not rely on the format of this tree because of this. If a program wishes to
    find different things in the tree, use use the /sys/class structure and rely on
    the symlinks there to point to the proper location within the /sys/devices tree
    of the individual devices.


    # 2. The Device Drivers Grouped by Classes: /sys/class


    Thesys/class directory consist of a group of subdirectories describing individual
    classes of devices in the Kernel. The individual directories consist of either
    subdirectories or symlinks to other directories.


    For example, you will find i2c controller drivers in /sys/class/i2c-dev. Each
    registered i2c adapter gets a number, starting from 0. You can examine /sys/class/i2c-dev/
    to see which number corresponds to which adapter.


    Some attribute files are writable and allow you to tune parameters in the driver
    at runtime. The dev attribute is particularly interesting. If you look at its
    value, you will find the major and minor numbers of the device:'
