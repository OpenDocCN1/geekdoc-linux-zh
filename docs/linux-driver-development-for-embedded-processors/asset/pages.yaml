  md: 'address of the Device Tree binary into the Kernel as part of the launch. The
    Kernel, once it is running, looks at the memory address, reads the device information,
    configures things appropriately and gets on with the job of running the Linux
    system.


    U-Boot can make some automatic modifications to the Device Tree blob before passing
    it to the Kernel, adding run-time learnt platform-specific information, such as
    the information derived from the reset configuration word (RCW), environment variables,
    and hardware configuration. The most common areas that U-Boot touches are related
    to frequency, MAC addresses, peripheral MMU settings, and memory size. Within
    U-Boot, the main function where this all occurs is ft_board_setup(). You have
    to define CONFIG_OF_BOARD_SETUP in the U-Boot config file for your board and provide
    ft_board_setup() in your board code. The Kernel unflattens and parses the Device
    Tree.


    ![](img/739a35b59067f8a55eff80a58765146f_286_0.png)


    If you have a Device Tree capable U-Boot bootloader, it just needs to have the
    CONFIG_OF_LIBFDT (located in include/configs/mx6qsabre_common.h) defined to turn
    on Device Tree support (##define CONFIG_OF_LIBFDT).


    In the mx6qsabre_common.h header file the environment variables are also defined
    (e.g., kernel_addr_initrd_address dtb_address).


    MACHINE_START begins DT_MACHINE_START in the DT kernel booting. .dt_compat is
    used to match the machine with the Device Tree root node''s compatible property.
    Once the root node''s compatible property is the machine''s .dt_compat, the corresponding
    functions are called; dt_compat[] allows the kernel to know which DT_MACHINE structure
    to use depending on the DTB that is passed at boot time.'
