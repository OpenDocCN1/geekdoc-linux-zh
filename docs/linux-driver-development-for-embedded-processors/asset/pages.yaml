  md: '# # Chapter 10

    Porting Kernel Modules to the HummingBoard Platform


    In this last chapter you are going to see how easily the i.MX6 SABRE Kernel labs
    can be ported to a new hardware platform, the SolidRunHummingBoard. Most of the
    modifications should be done in the HummingBoard''s Device Tree to allow the drivers
    to access to the HummingBoard i.MX6 Quad''s accessible pins. These pins are going
    to be connected to external devices (e.g. LED, pushbutton, accelerometer, Linear
    Tech ADC and Linear Tech DAC). For the Kernel modules that are not interacting
    with any external hardware the potting will be completely transparent, so there
    won''t be any modification in the Device Tree or driver''s source code.


    You will port the labs using the HummingBoard-Gate and HummingBoard-Edge SBC and
    you can also choose between MicroSom i.MX6 Quad or MicroSom i.MX6 Dual. Go to

    https://wiki.solid-run.com/freescale-imx6-family/hummingboard/ and

    http://wiki.solid-run.com/doku.php?id=products:imx6:micros to get the full HummingBoard
    and i.MX6 MicroSom documentation.


    Download the HummingBoard-Gate and the MicroSom i.MX6 Quad schematics at

    http://wiki.solid-run.com/doku.php?id=products:imx6:documents


    The HummingBoard-Gate is the first SBC to include an integrated microBUST™ socket
    offering an easy hardware configuration to mikroElektronika''s wide range of click
    boards add-on modules. The microBUST™ pinout and the click board ecosystem is
    especially suitable for developers who are working on multi-purpose, modular products.'
  merge: -1
