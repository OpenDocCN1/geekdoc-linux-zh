    due to its modularity and configurability.

    - Open source. No royalties or licensing fees.

    - Ported to a broad range of hardware architectures, platforms and devices.

    - Broad support of applications and communication protocols (e.g., TCP/IP stack,
    USB stack,

    graphical toolkit libraries).

    - Large support from an active community of developers.


    These are the main components of a Linux embedded system: Bootloader, Kernel,
