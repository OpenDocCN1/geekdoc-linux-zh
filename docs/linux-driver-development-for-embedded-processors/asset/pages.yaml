- img_proc: true
  md: '# DMA Drivers


    I/O devices use a third kind of address: a bus address. If a device performs DMA
    to read or write memory, the addresses used by the device are bus addresses. In
    some systems, bus addresses are identical to CPU physical addresses.


    If the device supports DMA, the driver sets up a buffer using kmalloc() or a similar
    interface, which returns a virtual address (X). The virtual memory system maps
    X to a physical address (Y) in system RAM. The driver can use virtual address
    X to access the buffer, but the device itself cannot because DMA does not go through
    the CPU virtual memory system. This is part of the reason for the DMA API: the
    driver can give a virtual address X to an interface like dma_map_single(), which
    returns the DMA address (Z). The driver then tells the device to perform DMA to
    Z.


    In order for Linux to use the dynamic DMA mapping, it needs some help from the
    drivers, namely it has to take into account that DMA addresses should be mapped
    only for the time they are actually used and unmapped after the DMA transfer.


    The memory allocated by the DMA should be physically contiguous. Any memory allocated
    by kmalloc() (up to 128 KB) or __get_free_pages() (up to 8MB) can be used. What
    cannot be used is valloc() memory allocation (it would have to setup DMA on each
    individual physical page).


    # Types of DMA Mappings


    There are two types of DMA mappings:


    +   1. Coherent DMA Mappings


    Uses uncached memory mapping from the Kernel space, usually allocated using **dma_alloc_coherent()**
    . The Kernel allocates a suitable buffer and sets the mapping for the driver.
    Can simultaneously be accessed by the CPU and device, so this has to be in a cache
    coherent memory area. Usually allocated for the whole time the module is loaded.
    Buffers are usually mapped during driver initialization, unmapped at the end and
    to do this hardware guarantee that the device and the CPU can access the data
    in parallel and will see updates made by each other without any explicit flushing.


    To allocate and map large (PAGE_SIZE or so) consistent DMA regions, you should
    use:


    ```

    #include <linux/dma-mapping.h>

    dma_addr_t dma_handle;

    cpu_addr = dma_alloc_coherent(dev, size, &dma_handle, gfp);

    ```'
