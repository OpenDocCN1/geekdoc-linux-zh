  md: '3. Stable: After each mainline Kernel is released, it is considered "stable".
    Any bug fixes for a stable Kernel are backported from the mainline tree and applied
    by a designated stable Kernel maintainer. There are usually only a few buggy Kernel
    releases until next mainline Kernel becomes available - unless it is designated
    a "longterm maintenance kernel". Stable Kernel updates are released on as-needed
    basis, usually 2-3 a month.


    4. Longterm: There are usually several "longterm maintenance" releases provided
    for the purposes of backporting bugfixes for older trees. Only important bugfixes
    are applied to these Kernels and they don''t usually see frequent releases, especially
    for older trees.


