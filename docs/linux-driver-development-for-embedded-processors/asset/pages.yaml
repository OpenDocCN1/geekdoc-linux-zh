    | | GPIO1_DR_V=0xC0C9E6000 |

    |---||

    | Kernel Virtual Addresses | 0xFFFFFFFF (4GB) |

    | Kernel Logical Addresses | GPIO1_DR = 0x0209C000 |

    | | Physical address space |

    | | PAGE_OFFSET | I/O Memory |

    | Userspace Addresses | RAM without direct mapping to kernel space |

    | | RAM with direct mapping to kernel space |

    | | 0x00000000 |


    GPIO1_DR_V = ioremap(GPIO1_DR, sizeof(u32))


    You can obtain this I/O virtual address by two different functions:


    +   1. Map and remove mapping using ioremap()/iounmap(). The ioremap function
    accepts the physical address and the size of the area. It returns a pointer to
    virtual memory that can be dereferenced (or NULL if mapping is impossible).


    ```

    void iomem *ioremap(phys addr_t offset, unsigned long size)

    void iounmap(void *address);

    ```


    +   2. Map and remove mapping attached to the driver device using devm_ioremap()/devm_iounmap()
    managed functions (defined as a function prototype in Linux/include/linux/io.h
    and defined as a function in Linux/lib/devres.c) that simplify driver code and
    error handling.


    Each device structure dev has a linked list of resources (devres_head list_head
    structure in struct device). Calling a managed resource allocator involves adding
    the resource to the list. The resources are released in reverse order when the
    probe() function exits with an error status or after the remove() function returns.
    The use of managed functions in the probe() function removes the needed resource
    releases on error handling, replacing goto''s and other resource releases with
    just a return. It also remove resource releases in remove() function.


    ```

    void iomem *devm_ioremap(struct device *dev, resource_size_t offset, resource_size_t
    size);

    ```'
