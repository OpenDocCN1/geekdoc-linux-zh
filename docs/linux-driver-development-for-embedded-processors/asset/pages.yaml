    # Interrupt Driver Management


    Linux Kernel performs operations in two contexts:


    +   1. Process context: on request from a User space process (synchronously).
    Process context is the mode of operation the Kernel is in while it is executing
    on behalf of a process, for example, executing a system call.


    +   2. Interrupt context: on request from a hardware interrupt controller (asynchronously).
    This special context is also called "atomic context" because code executing in
    this context is unable to block.


    Interrupts are scheduled by the CPU and run asynchronously. The Kernel could be
    in any state when interrupt occurs. So the interrupt context cannot access the
    user buffers, and can not sleep. Handlers can''t run actions that may sleep, because
    there is nothing to resume their execution. Memory must be allocated with the
    GFP_ATOMIC flag.


    # Registering an Interrupt Handler


    A driver needs to register a handler for its device''s interrupts. To perform
    this task is recommended to use the managed API for automatic freeing at device
    or module release time:


    ```

    int devm_request_irq(struct device *dev,

    unsigned int irq,

    irq handler_t handler,

    unsigned long irq_flags,

    const char *devname,

    void *dev_id);

    ```


    +   - irq is the requested IRQ channel. For platform devices, use platform_get_irq()
    to retrieve the interrupt number.

    - handler is a pointer to the IRQ handler.

    - irq_flags are option masks.

    - devname is the registered name.'
