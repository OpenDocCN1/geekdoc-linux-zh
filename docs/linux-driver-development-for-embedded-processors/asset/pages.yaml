    ```


    ```

    usutils

    util-linux

    zlib

    ```


    Use the "find" command in your bsp sources directory to discover the package receive:


    ```

    ~/solidrun-release-bsp/poky$ find -type f -name "*i2c-tools*.bb"

    ```


    You can add "i2c-tools" to your package-image-x11 image via two methods:


    1. Adding the following line of code to conf/local.conf:


    ```

    IMAGE_INSTALL_append = " i2c-tools "

    ```


    2. Using the smart package management.


    The smart package management system is available in Yocto Project for managing
    packages on a target machine. A host is configured as a server for the packages
    and on the target "package-management" feature is enabled for working with the
    packages. You can update, add, remove or query the packages on a target device
    at runtime.


    During the process of building an image, Bitbake executes ingredients in recipes
    to create packages and places them into the package feed repository. After all
    required packages for the image are ready, Bitbake gets the packages from the
    repository to generate the image.


    Set the variable PACKAGE_CLASSES in the configuration file conf/local.conf with
    the "rpm" package format (package_rpm).'
