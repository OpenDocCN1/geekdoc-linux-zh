- img_proc: true
  md: '# The interrupt handler returns:


    +   1. IRQ_HANDLED - request recognized and handled (irq line free), system ready
    for next request.

    2. IRQ_NONE - request not handled (device does not signal it). Kernel will try
    to run next handler on current line. If no line available - error occurs (spurious
    interrupt) and line is blocked.


    # Top Half and Bottom Half Interrupt Processing


    The interrupt handlers usually have two parts, the top half and the bottom half:


    +   1. The top half does what needs to be done immediately, the time critical
    stuff. Basically the top half itself is the interrupt handler. It should complete
    as quickly as possible since all interrupts are disabled. It schedules a bottom
    half to handle the hard processing.


    +   2. The bottom half does the rest of the processing that has been deferred
    - the time dependent, less critical actions. It is signaled by the ISR. A bottom
    half is used to process data, letting the top half to deal with incoming interrupts.
    Interrupts are enabled when a bottom half runs. Interrupts can be disabled if
    necessary, but generally this should be avoided as this goes against the basic
    purpose of having a bottom half - processing data while listening for new interrupts.
    Bottom halves are implemented in Linux as softirqs, tasklets or workqueues.


    # Workqueues


    A Kernel thread is a way to implement background tasks inside the Kernel. The
    task can be handling asynchronous events or sleep-waiting for an event to occur.
    Kernel threads are similar to user processes, except that they live in the Kernel
    space and have access to Kernel functions and data structures.


    To see the Kernel threads in the running system, run the ps command. The names
    of the Kernel threads are surrounded by square brackets:'
