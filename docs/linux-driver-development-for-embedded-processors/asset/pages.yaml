- img_proc: true
  md: '- unsigned long size: Fill in the size of the memory block addr that points
    to. If the size is zero, the mapping is considered unused. Note that you must
    initialize size with zero for all unused mappings.


    - void *internal_addr: If you have to access this memory region from within your
    kernel module, you will want to map it internally by using something like ioremap().
    Addresses returned by this function cannot be mapped to User space, so you must
    not store it in addr. Use internal_addr instead to remember such an address.


    2. The function uio_register_device() connects the driver to the UIO framework:


    +   - Requires a struct uio_info as an input.


    +   - It is typically called from the probe() function of a platform device driver.


    +   - It creates the device file /dev/uio# (starting from 0) and all associated
    sysfs file attributes.


    +   - The function uio_unregister_device() disconnects the driver from the UIO
    framework deleting the device file /dev/uio#.'
