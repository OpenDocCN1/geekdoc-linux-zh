  md: '# # Building the Linux Kernel


    The Kernel will be configured and built outside of the Yocto build system.


    Copy Kernel sources from the Yocto tmp directory (that was generated after building
    your image with bitbake) to your own Kernel directory:


    ```

    ```

    $ mkdir my-linux-imx

    $ cp -rpa /fsl-release-bsp/build imx6_qt5 x11/tmp/imx6sabresd-poky-linux-gnuabi/linux-imx/3.14.28-r0/git/*
    ~/my-linux-imx/

    $ cd ~/my-linux-imx/

    ```

    ```


    Setup the Poky toolchain environment:


    ```

    ```

    ~/my-linux-imx$ source /opt/poky/1.7/environment-setup-cortex9hf-vfp-neon-poky-linux-gnuabi

    ```

    ```


    Prior to compiling the Linux Kernel it is often a good idea to make sure that
    the Kernel sources are clean and there are no remnants left over from a previous
    build:


    +   1. clean - Remove most generated files but keep the config and build support
    to build external modules.

    2. mrproper - Remove all generated files + config + various backup files.

    3. distclean - mrproper + remove editor backup and patch files.


    ```

    ```

    ~/my-linux-imx$ make distclean

    ```

    ```


    It is often easiest to start with a base default configuration and then customize
    it for your case if needed. The imx_v7_defconfig (located in Linux/arch/arm/configs)
    will be used as a starting point:


    ```

    ```

    ~/my-linux-imx$ make imx_v7_defconfig

    ```

    ```


    When you want to customize the Kernel configuration the easiest way is to use
    the built-in Kernel configuration systems. One of the most popular configuration
    systems is the menuconfig utility. Use a terminal from which the environment-cortex9hf-vfp-neon-poky-linux-gnuabi
    was not sourced. Use "cd /" to search in menuconfig:


    ```

    ```

    ~/my-linux-imx$ make menuconfig ARCH=arm

    ```

    ```'
