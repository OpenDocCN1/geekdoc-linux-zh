    void *start, /* Often 0, preferred starting address */

    size_t length, /* Length of the mapped area */

    int prot, /* Permissions: read, write, execute */

    int flags, /* Options: shared mapping, private copy... */

    int fd, /* Open file descriptor */

    off_t offset

    ); -

