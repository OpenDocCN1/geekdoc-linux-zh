- img_proc: true
  md: '# Porting Kernel Modules to the HummingBoard Platform


    The microBUS™ standard defines mainboard sockets and add-on boards used for interfacing
    microcontrollers or microprocessors (mainboards) with integrated circuits and
    modules (add-on boards).


    The purpose of microBUS™ is to enable easy hardware expandability with a large
    number of standardized add-on boards, each carrying a single sensor, transceiver,
    display, encoder, motor driver, connection port, or any other electronic module
    or integrated circuit.


    Created by MikroElektronika, microBUS™ is an open standard - anyone can implement
    microBUS™ in their hardware design, as long as the requirements set by the MikroBUS
    specification are being met.


    The HummingBoard-Gate Top View with the on-board microBUS may be seen in the image
    below:


    ![](img/739a35b59067f8a55eff80a58765146f_425_0.png)'
