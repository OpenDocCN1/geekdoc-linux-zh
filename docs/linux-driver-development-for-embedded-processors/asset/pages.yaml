- img_proc: true
  md: "```\nstruct platform_driver {\n    int (*probe)(struct platform_device *);\n\
    \    int (*remove)(struct platform_device *);\n    void (*shutdown)(struct platform_device\
    \ *);\n    int (*suspend)(struct device *,\n        pm_message t state);\n   \
    \ int (*suspend_late)(struct platform_device *,\n        pm_message t state);\n\
    \    int (*resume_early)(struct platform_device *);\n    int (*resume)(struct\
    \ platform_device *);\n    struct device_driver driver;\n};\n```\n\nIn the platform_driver\
    \ structure you can see a function pointer variable that points to a function\
    \ named `probe()`. The `probe()` function is called when the \"bus driver\" pairs\
    \ \"device\" to the \"device driver\". The `probe()` function is responsible for\
    \ initializing the device and registering it in the appropriate Kernel framework.\n\
    \n+   1. probe() gets a pointer to the \"device structure\" as an argument (e.g.,\
    \ struct pci_dev *, struct usb_dev *, struct platform_device *, struct i2c_client\
    \ *).\n2. It initializes the device, I/O memory, allocates buffers, registers\
    \ interrupt handlers, timers, and on...\n3. It registers the device to specific\
    \ framework(s) (e.g., network, misc, serial, input, industrial).\n\nThe `suspend()`/resume()`\
    \ functions are used by devices that support low power management features.\n\n\
    The platform driver responsible for the platform device should be registered to\
    \ the platform core using the `platform_driver_register(struct platform_driver\
    \ *drv)` function. Register your platform driver in your module init function,\
    \ and unregister your platform driver in the module exit function as shown in\
    \ the following example:\n\n```\nstatic int hello_init(void) {\n    pr_info(\"\
    demo init enter\\n\");\n    platform_driver_register(&my_platform_driver);\n \
    \   pr_info(\"hello_init exit\\n\");\n    return 0;\n}\n```\n\n```\nstatic void\
    \ hello_exit(void) {\n    pr_info(\"demo exit enter\\n\");\n    platform_driver_unregister(&my_platform_driver);\n\
    \    pr_info(\"demo exit exit\\n\");\n}\n```"
