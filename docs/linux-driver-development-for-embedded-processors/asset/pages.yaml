  md: "# Handling Interrupts in Platform Drivers\n\n3.1. ARM® domain interrupt summary\
    \ on page 221 of the IMX6DQRM. GIC will forward a corresponding IRQ signal to\
    \ one or both of the A9 cores. Software code that is running on the A9 core can\
    \ then query the GIC to determine which peripheral device caused the interrupt,\
    \ and take appropriate action.\n\nThere will be a chained interrupts approach,\
    \ this means that there is a fast IRQ handler for the GPIOs that gets called in\
    \ a chain from the parent IRQ handler, most typically the system interrupt controller.\
    \ This means the GPIO irq is registered using `irq_set_chained_handler()` or the\
    \ corresponding `gopchip_set_chained_irq()` helper function.\n\nSee the handler\
    \ setup for the i.MX6 system interrupt controller in Linux/drivers/gpio/gpio-mxc.c:\n\
