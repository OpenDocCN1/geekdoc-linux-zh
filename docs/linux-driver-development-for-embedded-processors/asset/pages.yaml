  md: '- environment-setup: script to export SDK environment variables.


    - sysroots directory: SDK tools, library and header files. Two sub-directories
    one for the host (i686) and for the target (cortex9hf).


    Host libraries (under /opt/poky/1.7/sysroots/i686-pokysdk-linux/lib) and target
    libraries (under /opt/poky/1.7/sysroots/cortex9hf-vfp-neon-poky-linux-gnueabi/lib)
    have to be strictly identical to avoid dependency issue. They must have the same
    version, the same configuration and the same compilation options.


    ![](img/739a35b59067f8a55eff80a58765146f_52_0.png)


    Note that you can find some information about the SDK just by reading suffixes:


    +   - cortex9hf: SDK for cortexa9 hard float (with floating point unit support).

    - vfp: with support of vector floating point unit.

    - neon: with neon coprocessor support.

    - linux: for the Linux operating system.

    - gnueabi: gnu embedded application binary interface.


    To setup the SDK you have to source the environment script:


    ```

    ~$ /opt/poky/1.7/environment-setup-cortex9hf-vfp-neon-poky-linux-

    gnueabi

    ```


    This script will export environment variables such as us:


    +   - CC: C compiler with target compilation options.

    - CFLAGS: Additional C flags, used by the C compiler.

    - CXX: C++ compiler.

    - CXXFLAGS: Additional C++ flags, used by the CPP compiler.

    - LD: Linker.'
