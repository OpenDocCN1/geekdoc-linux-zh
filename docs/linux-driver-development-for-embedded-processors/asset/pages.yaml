    # Adding Sysfs Support to a Platform Driver


    Sysfs is a virtual file system that exports information about devices and drivers
    from the Kernel device model. It provides a means to export Kernel data structures,
    its attributes, and the linkages between them to User space. Various programs
    use sysfs: udev, mdev, Isusb, lspci.


    Since the Linux driver model was introduced in version 2.6, the sysfs represents
    all devices and drivers as Kernel objects. You can see the Kernel''s view of the
    system laid by in /sys, as shown here:


    +   - /sys/bus/ - contains the list of buses.

    - /sys/devices/ - contains the list of devices.

    - /sys/bus/<bus> - devices on a given bus.

    - /sys/bus/<bus> - drivers - the drivers grouped by classes (frameworks): net,
    input, block.

    - /sys/class - the drivers grouped by classes (frameworks).

    - /sys/bus/<bus>/devices/<device>/driver - symlink to driver, that manages the
    given device.'
