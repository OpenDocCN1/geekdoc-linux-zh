  md: '# Chapter 7


    2) and the number of objects that can be stored on each slab. Then, it returns
    a pointer of type kmem_cache as a reference to the created cache.


    At the time of creating a new cache, the SLAB allocator generates a number of
    slabs and populates them with the allocated and initialized objects. When creation
    of a new object of the same type is needed it makes a request to the SLAB allocator
    through the kmem_cache_alloc() function with the pointer (of type kmem_cache)
    to the cache. If the cache has a free object, it immediately returns it. However,
    if all objects within the cache slabs are already in use (active), the SLAB allocator
    increases the cache by making a request to the Page Allocator through the alloc_pages()
    function to get free pages. After receiving free pages from the page allocator,
    the SLAB allocator creates one or more slabs (in the free physical pages) and
    populates them with the new allocated and initialized objects. On the other hand,
    at the time of releasing the object, it is called kmem_cache_free() function with
    the cache and object pointers as the parameters. The SLAB allocator marks the
    object as free and keeps the object in the cache for the subsequent requests.


    # Kmalloc Allocator


    This is the allocator for the driver code. For large sizes it relies on the page
    allocator, for smaller sizes it relies on generic SLAB caches, named Kmalloc-xxx
    in /proc/slabinfo. The allocated area is guaranteed to be physically contiguous
    and uses the same flags as the page allocator (GFP_KERNEL, GFP_ATOMIC, GFP_DMA,
    etc.). Maximum sizes for ARM are 4 MB and 128MB for total allocations. The Kmalloc
    allocator should be used as the primary allocator unless there is a strong reason
    to use another one.


    # Kmalloc Allocator


    +   1. Allocating memory with Kmalloc/Kzalloc:


    ```

    #include <linux/slab.h>

    static inline void *kmalloc(size_t size, int flags);

    void *kzalloc(size_t size, gfp_t flags); /* Allocates a zero-initialized buffer
    */

    ```


    +   - Allocates size by and returns pointer to the virtual memory area.

    - size: number of bytes to allocate.

    - flags: same flags as the page allocator.


    To free a block of memory previously allocated with kmalloc():

    void kfree(const void *objp);


    2. Conforming to unified device model, memory allocations can be attached to the
    device. devm_kmalloc function is a resource-managed kmalloc:'
