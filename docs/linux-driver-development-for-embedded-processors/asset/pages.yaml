    by forking the official Kernel tree. The intent is to separately develop support
    for a particular piece of hardware or subsystem and to integrate this into the
    official Kernel at a later point. This process is called mainline and describes
    the task to integrate the new feature or hardware support to the upstream (official)
    Kernel. These are called Distribution Kernels.


    It is easy to tell if you are running a Distribution Kernel. Unless you downloaded,
    compiled and installed your version of Kernel from kernel.org, you are running
    a Distribution Kernel. To find out the version of your Kernel, run -:


