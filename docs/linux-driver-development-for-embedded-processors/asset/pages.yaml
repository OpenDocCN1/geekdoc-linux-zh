    - They provide the required Kernel space driver for UIO.


    - They work with the Device Tree. The Device Tree node for the device needs to
    use "generic-uio" in its compatible property.


    - The UIO platform device driver is configured from the Device Tree and registers
    a UIO device.


    ![](img/739a35b59067f8a55eff80a58765146f_210_0.png)


    The UIO Platform Device Driver can be replaced by a User provided Kernel driver.
    The kernel space driver is a platform driver configured from the Device Tree that
    registers a UIO device inside the probe() function. The Device Tree node for the
    device can use whatever you want in the compatible property as it only has to
    match with the compatible string used in the Kernel space driver, as with any
    other platform device driver. The User provided Kernel driver can handle the interrupt
    and then communicate data to the User space driver through other mechanisms such
    as shared memory.'
