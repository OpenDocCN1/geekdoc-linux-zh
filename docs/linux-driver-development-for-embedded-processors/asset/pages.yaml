  md: '# # Chapter 9 Kernel Frameworks for Device Drivers


    Many device drivers are not implemented directly as character drivers. They are
    implemented under a framework, specific to a given device type (e.g., framebuffer,
    V4L, serial, IIO). The framework factors out the common parts of drivers for the
    same type of devices to reduce code duplication.


    The framework allows provision of a coherent User space interface for every type
    of device, regardless of the driver. The application can still see many of the
    device drivers as character devices. For example the network framework of Linux
    provides a socket API such that an application can connect to a network using
    any network driver without knowing the details of the network driver.


    Throughout this chapter you will explore two frameworks in detail, the Input subsystem
    and the Industrial I/O (IIO) subsystem. Several Kernel modules are going to be
    developed that will help you to understand the use of the frameworks to develop
    drivers for the same type of devices.


    Observe in the following image how the driver interfaces with a framework to expose
    the hardware to User applications and also with a bus infrastructure, part of
    the device model that communicates with the hardware:'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Kernel Frameworks for Device Drivers


    ![](img/739a35b59067f8a55eff80a58765146f_351_0.png)


    # Input Subsystem Drivers


    The Input subsystem takes care of all the input events coming from the human user.
    Input device drivers will capture the hardware event information in a uniform
    format (**struct input_event**) and report to the core layer, then the core layer
    sorts the data, escalates to the appropriate event-handling driver, and finally
    through the events layer passes to the User space. Applications using /dev device
    node can get event information.


    Initially written to support the USB HID (Human Interface Device) devices, the
    Input subsystem quickly grew up to handle all kind of inputs (using USB or not):
    keyboards, mice, joysticks, touchscreens, etc.


    The Input subsystem is split in two parts:


    +   1. Device drivers: they talk to the hardware (e.g., USB, I2C), and provide
    events (e.g., keystrokes, accelerometer movements coordinates) to the input core.


    +   2. Event handlers: Input event drivers that get events from device drivers
    and pass them via various interfaces. The *evdev* is a generic input event interface
    in the Linux Kernel. It generalizes raw input events from device drivers and makes
    them available through character devices in the /dev/input/ directory. The event
    interface will represent each input device as a /dev/input/event<X> character
    device.'
