  md: '# Building the System


    The script, fsl-setup-release.sh, simplifies the setup for NXP machines. To use
    the script, the name of the specific machine to be built for needs to be specified
    as well as the graphical backend desired. The script sets up a directory and the
    configuration files for the specified machine and backend.


    Use the machine configuration for the board that is being used and specify the
    graphical backend desired. The backend can be x11, (Frame Buffer), dfb (DirectFB),
    or Wayland.


    Note: If you download one of the last NXP BSP releases check the supported backends
    in the Freescale Yocto Project User''s Guide BSP documentation, some backends
    as DirectFB cannot be supported any more. Go to www.nxp.com/imxtools for i.MX6
    Software and Tools to see the last BSP documentation.


    The command below is used to set up a directory and configuration files for the
    specified board and backend. After this step, the build environment is initialized
    and configured for building an image:


    ```

    $ MACHINE<machine name> source fsl-setup-release.sh -b <build dir> -e

    <backend>

    ```


    Note: This command can be different in the last BSP releases. Check the "Freescale
    Yocto Project User''s Guide" BSP documentation.


    MACHINE==machine configuration is the machine name which points to the configuration
    file in meta-fsl-arm/conf/machine. The setup script checks for a valid machine.
    Without setting MACHINE, the setup script assumes imx6qabsred as the default.
    The i.MX machine files are provided in meta-fsl-arm/conf/machine and Machine.
    The MACHINE configuration can also be changed in <build dir>/conf/local.conf.


    The following code shows a small part of a local.conf file created from the fsl-setup-release.sh
    script:


    ```

    MACHINE ?= ''imx6qabsred''

    DISTRO ?= ''poky''

    ACCEPT_FSL_EULA = "1"

