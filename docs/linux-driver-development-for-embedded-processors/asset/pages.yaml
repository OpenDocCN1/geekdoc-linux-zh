    # Device Tree Source (DTS)


    The DTS is a textual representation of a Device Tree. It includes data structure
    for hardware descriptions and is compiled (by dtc) into a binary Device Tree,
    that is interpreted by the Kernel.


    Device Trees are well described in the Power.org Standard for Embedded Power Architecture
    Platform Requirements (ePAPER) at https://www.power.org/documentation/epapr-version-1-1/


    The ePAPER defines a concept, a Device Tree, to describe system hardware and separate
    that description from the Kernel image. The Device Tree is a tree structure with
    nodes that describe the physical devices in the system that cannot be dynamically
    detected by software. The nodes are organized in a hierarchical parent/child relationship.
    Nodes are organized in a hierarchy as a collection of property and value tokens.
    Sub-nodes define the relationship of devices within the hierarchy (e.g., i2c devices
    are children of an i2c controller node). The Device Tree starts from the root
    node ''/'' which will be used to match with a machine_desc entry. This matching
    will be described in the root "I.MX6 Kernel Booting and I/O Physical to Virtual
    Static Memory Mapping" section in Chapter 7. A node:'
