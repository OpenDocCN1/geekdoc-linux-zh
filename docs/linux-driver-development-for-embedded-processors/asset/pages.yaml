  md: "# Handling Interrupts in Platform Drivers\n\nThe `irq_alloc_*()` and `irq_free_*()`\
    \ APIs provide allocation of hardware irq numbers, but they don't provide any\
    \ support for reverse mapping of the controller-local IRQ (hwirq) number into\
    \ the Linux IRQ space.\n\nThe `irq_domain` library adds mapping between hwirq\
    \ and IRQ numbers on top of the `irq_alloc_*` API. An `irq_domain` for manage\
    \ mapping is preferred over interrupt drivers open-coding their own reverse mapping\
    \ scheme; `irq_domain` also implements translation from an abstract `irq_fswspec`\
    \ structure to hwirq numbers (Device Tree and ACPI GSI so far), and can be easily\
    \ extended to support other IRQ topology sources.\n\n# iMX6 Interrupt Software\
    \ Overview\n\nFor ARM® architecture-based processors, normal interrupt and fast\
    \ interrupt are two different exception types. The exception vector addresses\
    \ can be configured to start at low address (0x0) or high address (0xFFFF). The\
    \ Linux OS implementation running on ARM® architecture uses the high-vector address\
    \ model.\n\nThe iMX6 Quad SoC and specific code for Linux Device Tree systems\
    \ is located in the Linux/arch/arm/mach-imx6c directory. The mach-imx6c contains\
    \ a DT_MACHINE_START declaration that together with the imx6_dt_compat list will\
    \ be used to populate a `machine_desc` structure (located in Linux/arch/arm/include/asm/arch.h).\
    \ The `machine_desc` structure describes boot customizations for a specific Device\
    \ Tree. The structure `machine_desc` is defined as follows:\n\n```\nstruct machine_desc\
    \ {\n    unsigned int nr;                /* architecture number *\n    *name;\
    \                          /* architecture name *\n    const char *stag_offset;\
    \        /* tagged list (relative) *\n    unsigned long *dt_compat;      /* array\
    \ of device tree *\n    const char *const;              /* 'compatible' strings\
    \ *\n\n    unsigned int nr_irqs;           /* number of IRQs *\n    #ifdef CONFIG_ZONE_DMA\n\
    \    phys_addr_t dma_size_t;        /* size of DMA-able area *\n    #endif\n\n\
    \    unsigned int video_start;       /* start of video RAM *\n    unsigned int\
    \ video_end;         /* end of video RAM *\n\n    unsigned char reserve_lp0 :1;\
    \   /* never has lp0 *\n    unsigned char reserve_lp1 :1;   /* never has lp1 *\n\
    \    unsigned char reserve_lp2 :1;   /* never has lp2 *\n    enum reboot_mode\
    \ reboot_mode;   /* default restart mode *\n    struct smp_operations *smp;  \
    \  /* SMP operations *\n    bool (*smp_init)(void);\n};\n```"
