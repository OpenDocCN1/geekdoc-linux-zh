  md: '# LAB 4.2: "class character" Module


    ![](img/739a35b59067f8a55eff80a58765146f_139_0.png)


    In this Kernel module lab you will use your previous "helloworld_char_driver"
    at the starting point, but this time the device node will be created using "devtmpfs"
    instead of doing it manually.


    In the next chapter, in the "Adding Sysfs support to a platform driver" section,
    the directories created under /sys/class in detail. In your current driver you
    will add an entry in the /sys/class directory. The /sys/class directory offers
    a view of the device drivers grouped by classes.


    When register_chdev_region() tells the Kernel that there is a driver with a specific
    major number, it doesn''t specify anything about the type of driver, so it will
    not create an entry under /sys/class. This entry is necessary so that devtmpfs
    can create a device node under /dev. Drivers will have a class name and a device
    name under /sys for each created device.


    The driver creates the class using the next Kernel API:


    +   - class_create() creates a class in the /sys/class/class directory.

    - class_destroy() removes the class.'
