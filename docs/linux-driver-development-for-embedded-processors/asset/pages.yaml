    - /usr/local/lib: Non-system libraries


    # Root Filesystem


    The root filesystem is where all the files contained in the file hierarchy (including
    device nodes) are stored. The root filesystem is mounted as /, containing all
    the libraries, applications and data.


    The folder structure of the root filesystem is defined by FHS (Filesystem-Hierarchy-Standard).
    The FHS defines the names, locations, and permissions for many file types and
    directories. It thereby ensures compatibility between different Linux distributions
    and allows application to make assumptions about where to find specific system
    files and configurations.


    A Linux embedded root filesystem usually includes:


    +   - /bin: Commands needed during bootstrap that may be used by normal users
    (probably after bootup).

    - /sbin: Like /bin, but the commands are not intended for normal users, although
    they may use them if necessary and allowed. /sbin is not usually in the default
    path of normal users, but will be in root''s default path.

    - /etc: Configuration files specific to the machine.

    - /home: Like My Documents in Windows.

    - /root: The home directory for root user. This is usually not accessible to other
    users on the system.

    - /lib: Essential shared libraries and Kernel modules.

    - /dev: Device files. These are virtual files that help the user interface with
    the various devices on the system.

    - /tmp: Temporary files. As the name suggests, programs running often store temporary
    files in here.

    - /boot: Files used by the bootstrap loader. Kernel images are often kept there
    instead of in root directory. If there are many Kernel images, the directory can
    easily grow large, and it might be better to keep it in a separate filesystem.

    - /mnt: Mount point for mounting a filesystem temporarily.

    - /opt: Add-on application software packages.

    - /usr: Secondary hierarchy.

    - /var: Variable data.

    - /sys: Exports information about devices and drivers from the Kernel device model
    to User space, and is also used for configuration.

    - /proc: Represent the current state of the Kernel.'
