  md: '# USERSSPACE


    ![](img/739a35b59067f8a55eff80a58765146f_126_0.png)


    # KERNEL


    The Kernel driver will use the specific functions copy_from_user() and copy_to_user()
    to exchange data with the User space as shown in the figure above.


    Both read() and write() methods return a negative value if an error occurs. A
    return value greater than or equal to 0, instead, tells the calling program how
    many bytes have been successfully transferred. If some data is transferred correctly
    and then an error happens, the return value must be the count of bytes successfully
    transferred, and the error does not get reported until the next time the function
    is called. Implementing this convention requires, of course, that your driver
    remember that the error has occurred so it can return the error status in the
    future.


    The return value for read() is interpreted by the calling application program:


    +   1. If the value equals the count argument passed to the read system call,
    the requested number of bytes has been transferred. This is the optimal case.


    +   2. If the value is positive, but smaller than the count, then only part of
    the data has been transferred. This may happen for a number of reasons, depending
    on the device. Most often,'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'the application program retries the read. For instance, if you read using the
    fread function, the library function reissues the system call until completion
    of the requested data transfer. If the value is 0, end-of-file was reached (and
    no data was read).


    3. A negative value means there was an error. The value specifies what the error
    was, according to <linux/errno.h>. Typical values returned on error include -EINTR
    (interrupted system call) or -EFAULT (bad address).


    In Linux every device is identified by two numbers: a **major** number and a **minor**
    number. These numbers can be seen by invoking `ls -l /dev`. Every device driver
    registers its major number with the Kernel and is completely responsible for managing
    its minor numbers. When accessing a device file, the major number selects which
    device driver is being called. The major number is used by the Kernel to identify
    the correct device driver when the device is accessed. The role of the minor number
    is device dependent, and is handled internally within the driver. For instance,
    the i.MX6 has several hardware UART ports. The same driver can be used to control
    all the UARTS, but each physical UART needs its own device node, so the device
    nodes for these UARTS will all have the same major number, but will have unique
    minor numbers.'
  merge: -1
