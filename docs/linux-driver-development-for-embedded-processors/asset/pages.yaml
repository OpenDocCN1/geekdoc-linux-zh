    # Device Tree Blob (DTB) and Device Tree Compiler (DTC)


    The Device Tree Compiler (DTC) is the tool used to compile the source into a binary
    form. Source code for the DTC is located under /Linux/scripts/dtc directory.


    The output of the Device Tree compiler is a Device Tree blob (DTB), which is a
    binary form that gets loaded by the boot loader and parsed by the Linux Kernel
    at boot. The DTBs to be generated at build time are listed in /Linux/arch/arm/boot/dts/Makefile,
    although they can be manually compiled by the DTC at any time.


    This is the Device Tree data life cycle:


    +   1. dtc creates .dtb from .dt (.dtb can be appended to the zimage).

    2. Boot loader copies .dtb into memory FDT. The bootloader can make some automatic
    modifications to the blob before passing it to the Kernel - mainly adding and
    modifying information that is learnt at run-time. See the board-specific function
    ft_board_setup() and related routines (dtb to dtb'' in the following figure).

    3. Linux Kernel reads FDT, creates Expanded DT (DFT) and Expanded DT can be modified
    by Linux Kernel.'
