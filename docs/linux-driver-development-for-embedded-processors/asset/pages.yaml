  md: '# LAB 3.2: "helloworld with parameters" Module


    ![](img/739a35b59067f8a55eff80a58765146f_117_0.png)


    Many Linux loadable kernel modules (LKM) have parameters that can be set at load
    time, boot time, and sometimes at run-time. In this Kernel module you are going
    to pass a parameter to the command line that will be set during the module loading.
    You can also read the parameters via the sysfs filesystem.


    The sysfs is a virtual filesystem provided by the Linux Kernel that exports information
    about various Kernel subsystems, hardware devices, and associated device drivers
    from the Kernel''s device model to User space through virtual files. In addition
    to providing information about various devices and Kernel subsystems, exported
    virtual files are also used for their configuration.


    The definition of module parameters is done via the macro `module_param()`.


    ```

    module_param(name, type, perm); /* the perm argument specifies the permissions
    of the corresponding file in sysfs. */

    ```'
