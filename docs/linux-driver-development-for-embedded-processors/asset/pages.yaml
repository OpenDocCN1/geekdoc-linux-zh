  md: '# # Chapter 5

    Platform Drivers


    So far you have been building your driver as a loadable driver module which was
    loaded during run time. The character driver is complete and has been thoroughly
    tested with a User space application. In your next assignment, you will convert
    the character driver to a platform driver. On embedded systems, devices are often
    not connected through a bus, allowing enumeration or "hotplugging" for these devices.


    However, you still want all of these devices to be part of the device model. Such
    devices, instead of being dynamically detected, must be statically described:


    +   1. By direct instantiation of struct platform_device structures, as done on
    a few old ARM® non-Device Tree base platforms. Definition is done in the board-specific
    or SoC specific code.


    +   2. In the Device Tree, a hardware description file used on some architectures.
    As you saw in Chapter 2, the device drivers match with the physical devices described
    in the .ts file. After matching the driver''s probe() function is called. A "of_match_table"
    has to be included in the driver''s code to allow this matching.


    Amongst the non-discoverable devices, a huge family is directly part of a system-on-chip:
    UART controllers, Ethernet controllers, spi or i2c controllers, graphic or audio
    devices, etc. in the Linux Kernel, a special bus, called the platform bus has
    been created to handle such devices. It supports platform drivers (struct platform
    device) like any other bus (USB, PCI), except that devices are enumerated instead
    of being discovered dynamically.


    Each platform driver is responsible for instantiating and registering an instance
    of struct platform_driver with the device model. The most important members of
    the struct platform_driver are shown below:'
  merge: -1
