  md: '# Kernel Frameworks for Device Drivers


    You are going to use this spidev driver to access the LTC2422 spi device.


    SPI devices have a limited Linux User space API, supporting basic half-duplex
    read() and write() as you spi slave devices. Using ioctl() requests, full duplex
    transfers and device i/O configurations are also available.


    Some reasons you might want to use this User space interface includes:


    +   1. Prototyping in an environment that isn''t crash-prone; stray pointers in
    User space won''t normally bring down a Linux system.


    +   2. Developing simple protocols to talk to microcontrollers acting as spi slaves,
    which you may need to change often.


    Of course there are drivers that can never be written in User space, because they
    need to access Kernel interfaces (such as IRQ handlers or other layers of the
    driver stack) that are not accessible to User space. See more info about the spidev
    driver at https://www.kernel.org/doc/Documentation/spidev


