  md: '# Introduction to the Device Tree


    What is the Device Tree (DT)?


    +   1. The DT is a data structure for describing hardware rather than hard coding
    every detail of the device into an operating system.


    +   2. The data structure itself is a simple tree of named nodes and properties:


    +   - Nodes contain properties and child nodes.

    - Properties are simple name-value pairs, containing zero or more data values
    providing information about a node.


    What advantages does it provide?


    +   - Platform devices are created at run-time by the Kernel by parsing the Device
    Tree nodes.

    - Device nodes can carry configuration data for the devices.

    - Allows the Kernel code and board specific configuration data to be decoupled
    (A step towards realization of single Kernel binary images for ARM® based platforms).


    ![](img/739a35b59067f8a55eff80a58765146f_98_0.png)'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# The Linux Device and Driver model


    The Device Tree can provide the following hardware configurations to the Kernel:
    CPUs, memory, buses, peripheral connections, interrupt controllers, GPIO controllers,
    clock controllers, etc.


    There are three main Device Tree components that will be explained in more detail:


    +   1. Device Tree Source (DTS)

    2. Device Tree Blob (DTB)

    3. Device Tree Compiler (DTC)


    ![](img/739a35b59067f8a55eff80a58765146f_99_0.png)


    One SoC may have several machines, or correspond to many products and boards.
    Device Tree files are not monolithic, they can be split in several files, including
    each other:


    +   - dts files are board level definitions. The .dts extension denotes device
    tree source.

    - dtsi files are included by the .dts files and generally contain SoC-level definitions.


    By convention, .dtsi files are included files, containing definitions of SoC-level
    information, while .dts files are final device trees containing board-level information.

    The .dtsi extension denotes device tree source include.'
  merge: -1
