    # i.MX6 Hardware Naming Convention


    A pin represents a physical input or output carrying an electrical signal. Every
    input or output signal goes through a physical pin from or to a component. The
    term "pin" is used especially in schematics. Contact pads are designated surface
    areas of a printed circuit board or die of an integrated circuit. A pin of component
    is soldered to a pad.


    The term "pin" should be used for components and the term "pad" should be used
    for PCBs. Since pins become pads on the BGA components, both terms are mixed.
    Moreover, on the BGA packages, the term "ball" is used. The term "ball" indicates
    a ball of soldering material attached to every pad during the manufacture process,
    usually from the bottom side of a component.


    +   1. Every ball on the i.MX6 chip has a pad name provided by NXP, for instance
    T1.

    2. Each pad has a logical/canonical name. This is the name that is shown on the
    schematic symbol inside the part, next to the pin and pin number (GPIO_2). This
    name depends on the meaning of the signal.

    3. The schematics assign a net name to the functional wire connected to the pad
    (KEY_ROW). This attempts to provide a description of what the wire is actually
    used for. The net name is usually the same as or similar to the pin name.


    There is a strict 1:1:1 mapping of balls to canonical names to net names. For
    example:


    +   1. Ball T1 -> GPIO_2 -> KEY_ROW6

    2. Ball C20 -> SD1_DAT1 -> CSIO_RST_B'
