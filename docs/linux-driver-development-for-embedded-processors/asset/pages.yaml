  md: "mmap() returns a pointer to a process virtual address. If you translate this\
    \ virtual address to the physical space you can see that it matchs with the physical\
    \ memory space that was allocated by the Kernel. This process virtual address\
    \ is different from the Kernel virtual address returned by kzalloc(), but both\
    \ virtual addresses share the same physical address. Once the memory is mapped\
    \ the User space can read and write to it.\n\n2. See the main points below to\
    \ implement mmap() in the Kernel space:\n\n+   - Implement a mmap() file operation\
    \ and add it to the driver's file operations:\n\n```\nint (*mmap)( *, /* Open\
    \ file structure */\nstruct file *, \nstruct vm_area_struct * /* Kernel VMA structure\
    \ */\n```\n\n+   - Initialize the mapping. This can be done in most cases with\
    \ the remap_pfn_range() function, which takes care of the job.\n\n```\n#include\
    \ <linux/mm.h>\n\nint remap_pfn_range(\nstruct vm_area_struct *, /* VMA struct\
    \ */\nunsigned long virt_addr, /* Starting user virtual address */\nunsigned long\
    \ pfn, /* pfn of the starting physical address, use dma_map\nsingle() to get it\
    \ from pointer to the virtual address of the allocated\nbuffer */\nunsigned long\
    \ size, /* Mapping size */\npgprot_t pg_prot * /* Page permissions */\n);\n```\n\
    \nThe remap_pfn_range() function is the easiest way to implement mmap() function.\
    \ Only one argument has to be created as all others come in the VMA structure.\
    \ The third argument of the remap_pfn_range() is the page frame number which is\
    \ based on the physical address."
