    |---|---|---|---|

    | ALT0 | ECSP1_SS0 | PUS - 100K OHM_PU | |

    | ALT1 | PWM3_OUT | PUE - PULL | |

    | ALT2 | GPT_CAPTURE2 | PKE - ENABLED | |

    | ALT3 | GPIO1_IO17 | ODE - DISABLED | |

    | ALT4 | | SPEED - MEDIUM | |

    | | | DSE - 40_OHM | |

    | | | SPE - SLOW |


    © 2016 NXP B.V.


    Almost every pad has a GPIO function, in the SD1_DAT1 is GPIO1_IO17 and GPIO functions
    are internally tracked by a bank/bit convention. There are seven banks of GPIOs
    with up to 32 bits each. In the i.MX6 index is 1-based, not 0 based, but the register
    addresses are all 0-based, requiring you to subtract 1 from the name.


    This is the Linux User space naming convention:


    +   1. Almost every pad has a GPIO function as one of its up to eight iomux modes.

    2. Linux uses a single integer to enumerate all pads, therefore NXP''s bank/bit
    notation for GPIOs must be mapped.

    3. The bank/bit to Linux userspace formula is:


    ```

    linux gpio number = (gpio_bank - 1) * 32 + gpio_bit

    ```


    So, GPIO1_IO17 maps to (1 - 1) * 32 + 17 = 17.'
