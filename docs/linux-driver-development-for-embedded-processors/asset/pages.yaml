    builds an image. Bitbake provides various useful options for developing a single
    component. To run with a bitbake parameter, the command looks like this: bitbake
    <parameter> <component>


    Each component build has multiple tasks, such as fetching, configuration, packaging,
    and deploying to the target roots. The Bitbake image gathers all the components
    required by the image and build in order of the dependency task. The first build
    is the toolchain along with the tools required for the components to build. Additional
    parameters can be used for specific activities described below:


    ![](img/739a35b59067f8a55eff80a58765146f_48_0.png)


    +   - Fetches if the downloads state is not marked as done.

    - Cleans the entire component build directory. All the changes in the build directory
    will be lost. The roots and state of the component are also cleared. The component
    is also removed from the download directory.

    - Deploys an image or component to the roots.

    - Continues building components even if a build break occurs.

    - It is not recommended that the source code under the tmp directory is changed
    directly, but if it is, the Yocto Project might not rebuild it unless this option
    is used. Use this option to force a recompile after the image is deployed.

    - Lists a dependency tree for an image or component.

    - Turns on debug 3 levels deepe. Each D adds another level of debug.


