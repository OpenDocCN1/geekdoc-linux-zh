  md: '# # Chapter 7

    Memory Management Drivers


    Linux is a virtual memory system, meaning that the addresses seen by user programs
    do not directly correspond to the physical addresses used by the hardware. Kernel
    and user processes use virtual addresses, and address translation is done in the
    hardware MMU (Memory Management Unit). With virtual memory, programs running on
    the system can allocate far more memory than is physically available; indeed,
    even a single process can have a virtual address space larger than the system''s
    physical memory.


    When a program is instantiated on a computer, the operating system moves the executable
    file into memory and the processor starts executing the instructions within. Some
    of these instructions may be used to prepare the initial environment for the process,
    and once executed will not be referenced for the duration of the process. The
    observation that memory may contain inactive code, and that the active part of
    a program differs during process execution, gives ground for a memory management
    system where only the active parts of a program are kept main memory while inactive
    parts may then be moved to secondary storage, freeing memory space.


    We are going to name secondary storage to the non volatile memory where our program
    flows are stored (e.g., Nand Flash, eMMC), and main memory to the RAM memory where
    linux programs are running (e.g., DDR2, DDR3).'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'The following is a list of address types used in Linux:


    +   1. User Virtual Addresses


    These are the regular addresses seen by User space programs. User addresses are
    either 32 or 64 bits in length, depending on the underlying hardware architecture,
    and each process has its own virtual address space. The virtual address space
    is split; the lower part is used for the User space and the upper part is used
    for the Kernel. If we assign 1GB of virtual address space for the Kernel on 32-bit
    processors, the split is at 0XC0000000.


    # Virtual address space


    ![](img/739a35b59067f8a55eff80a58765146f_275_0.png)


    +   2. Physical Addresses


    The addresses used between the processor and the system''s memory. Physical addresses
    are 32-bit or 64-bit quantities; even 32-bit systems can use larger physical addresses
    in some situations.


    +   3. Bus Addresses


    The addresses used between peripheral buses and memory. Often, they are the same
    as the physical addresses used by the processor, but that is not necessarily the
    case. Some architectures can provide an I/O memory management unit, IOMMU, that
    remaps addresses between a bus and main memory. Programming the IOMMU is an extra
    step that must be performed when setting up DMA operations. NXP iMX6 processors
    do not use an IOMMU.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 4. Kernel Logical Addresses


    These make up the normal address space of the Kernel. These are the virtual addresses
    above CONFIG_PAGE_OFFSET. On most architectures, logical addresses and their associated
    physical addresses differ only by a constant offset, this makes converting between
    physical and virtual addresses easy. The kmalloc() function returns a pointer
    variable that points to a Kernel logical address space that is mapped to continuous
    physical pages. The Kernel logical memory space cannot be swapped out. Kernel
    logical addresses can be converted to and from physical addresses using the macros:
    __pa(x) and __va(x).


    # 5. Kernel Virtual Addresses


    Kernel virtual addresses are similar to logical addresses in that they are a mapping
    from a kernel space address to a physical address. Kernel virtual addresses do
    not necessarily have the linear, one-to-one mapping to physical addresses that
    characterize the logical address space, however. All logical addresses are Kernel
    virtual addresses, but many Kernel virtual addresses are not logical addresses.
    For example, the function vmalloc() will return a block of virtual memory, however
    this memory is only continuous in virtual space, it may not be continuous in physical
    space. Memory returned by loremap() will also be dynamically placed in this region.
    Machine specific static mappings are also located here, through iotable_init().


    ![](img/739a35b59067f8a55eff80a58765146f_276_0.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# User Process Virtual to Physical Memory Mapping


    In Linux, Kernel space is present and maps the same physical memory in all processes.
    Kernel code and data are always addressable, ready to handle interrupts or system
    calls at any time. By contrast, the mapping for the user-mode portion of the address
    space changes whenever a process switches happens.


    Every User space process, has its own virtual memory layout, containing four logical
    areas:


    +   1. Text segment - program code, stores the binary image of the process (../bin/app
    ).


    +   2. Data segment (data+bss+heap) - various data structures created and initialized
    at the start of a process or while it is running (e.g., heap). The heap provides
    runtime memory allocation, like the stack, for data that must outlive the function
    doing the allocation, unlike the stack. In C, the main interface to heap allocation
    is the malloc() function. A data segment stores static initialized variables,
    and BSS segment uninitialized static variables filled with zeros.


    +   3. Memory mapping segment - here the Kernel maps the contents of files directly
    to memory. Any application can ask for such a mapping via the Linux mmap() system
    call (including dynamic libraries, for instance /lib/libc.so). It is also possible
    to create an anonymous memory mapping that does not correspond to any files, being
    used instead for program data. In Linux, if you request a large block of memory
    via malloc(), the C library will create such an anonymous mapping instead of using
    heap memory.


    +   4. Stack segment - starts near the end of area available to process, and grows
    downwards: stores local variables and function parameters in most programming
    languages. Calling a method or function pushes a new frame onto the stack. The
    stack frame is destroyed when the function returns. This simple design, possible
    because the data obeys LIFO order, means that no complex data structure is needed
    to track stack contents, a simple pointer to the top of the stack will do. Pushing
    and popping is thus very fast and deterministic. Also, the constant reuse of stack
    regions tends to keep active stack memory in the CPU caches, speeding up access.
    Each thread in a process gets its own stack.'
