  md: '# Chapter 1


    The Linux i.MX BSP package contains several root filesystems. The file system
    specific libraries and common Linux utilities. They are named with the following
    convention: [image recipe]-[backend]-[platform][board].{ext3|sdcard}. The ext3
    extension indicates a standard-file system. It can be mounted on NFS or its contents
    are stored on a boot media such as SD/MMc card. After building an iYoct project
    places the root filesystem in the build/tmp/deploy/images/folder.


    # Linux Boot Process


    These are the main stages of a Linux embedded boot process:


    +   1. The boot process begins at POR (Power On Reset) where the hardware reset
    logic forces the ARM core to begin execution starting from the on-chip boot ROM.
    The boot ROM can support several devices (e.g, NOR flash, NAND Flash, SD/MM).
    In the i.MX6 processor the on-chip boot ROM sets up the DDR memory controller.
    The DCD (device configuration data) feature allows boot ROM code to obtain SoC
    configuration from an external Program Image residing on the boot device. As an
    example, DCD can be used to program the DDR controller for optimal settings improving
    the boot performance. After setting up the DDR controller the boot ROM loads the
    U-Boot image to external DDR and runs it.

    2. The U-Boot loads both the Kernel image and the compiled Device Tree binary
    into RAM and passes the memory address of the Device Tree binary into the Kernel
    as part of the launch.

    3. The U-Boot jumps to the Kernel code.


    ![](img/739a35b59067f8a55eff80a58765146f_38_0.png)


    | | R1 | 0xffffffff |

    | | R2 | dtb address |


    4. Kernel runs low level Kernel initialization, enabling MMU and creating the
    initial table of memory pages, and setting caches. This is done in Linux/arch/arm/kernel/head.s.
    The file head.s contains CPU architecture specific but platform independent initialization
    code. Then the system switches to the non architecture specific kernel startup
    function start_kernel().'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Building the System


    5. Kernel runs start_kernel() (located in Linux/init/main.c) that:


    +   - Initializes the Kernel core (e.g., memory, scheduling, interrupts, ...)

    - Initializes statically compiled drivers.

    - Mounts the root filesystem based on boottargs passed to the Kernel from U-Boot.

    - Executes the first user process, init.


    +   6. The process init, by default, /init for initramfs, and /sbin/init for a
    regular filesystem. The three init programs that you usually find in Linux embedded
    devices are BusyBox init, System V init, and systemd. If System V is used then
    the process init reads its configuration file, /etc/inittab, and executes several
    scripts that perform final system initialization.


    The Yocto Project allows you to choose between System V init and systemd, with
    System V init the default.


    In the following image you can see the Linux embedded boot process:


    ![](img/739a35b59067f8a55eff80a58765146f_39_0.png)


    # Building an Embedded Linux System


    Building an embedded Linux system requires you to:'
  merge: -1
  pgno: 39
- img_proc: true
  md: '1. Select a cross toolchain. The toolchain is the starting point for the development
    process as it is used to build all subsequent software packages. The toolchain
    consists of the following parts: Assembler, Compiler, Linker, Debugger, Runtime
    Libraries and Utilities. A cross compiler is a compiler capable of creating executable
    code for a platform other than the one on which the compiler is running.


    2. Select the different packages that will run on the target (Bootloader, Kernel
    and Root filesystem).


    3. Configure and build these packages.


    4. Deploy them on the device.


    There are several different ways to build an embedded linux system:


    +   - Manually (creating your own scripts): this option gives you total control,
    but it is also tedious and harder to reproduce builds on other machines. It also
    requires a good understanding of the software component installation process.
    For example, create a root filesystem from the ground up by yourself means


    +   - Download the source code of all software components (libraries, utilities,
    or applications).


    +   - Solve all dependencies and version conflicts and apply patches.


    +   - Configure each software component.


    +   - Install each software component.


    2. Using complete distributions (e.g., Debian/Ubuntu): easy to get started, but
    harder to customize. A Linux distribution is a preselected Kernel version and
    a root filesystem with a preselected set of libraries, utilities and applications.


    3. Using Build frameworks (e.g., Buildroot, Yocto): This option allows you to
    customize and reproduce builds easily. This is becoming the most popular option
    in the Linux embedded space. A Build framework typically consists of scripts and
    configuration meta-data that control the build process. The Build framework typically
    downloads, configures compiles and installs all required components of the system
    version conflicts and dependencies into account. It allows for example to create
    a customized root filesystem. The Build framework output is a complete image including
    toolchain, bootloader, kernel and root filesystem.


    The "Yocto Project" is our framework of choice to build the images described in
    this document, although other methods can be used.'
