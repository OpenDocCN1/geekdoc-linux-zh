    output as the VREF (select JP1 VREF A jumper) and this 5V output will also be
    used to supply the LTC2607 DAC (select 5V REEF in jumper JP2).


    Using the 5V regulator (5V REG in JP2) as the source for VCC has the VCC may be
    slightly lower than VREF, which may affect the full-scale error. Selecting the
    5V REF as the'
