  md: '# # Porting Linux Kernel Modules Labs to the HummingBoard


    The required Device Tree and Kernel modules source files modifications to port
    all the SABRE kernel modules labs to the HummingBoard SBC will now be described.


    All the Device Tree modifications should be done in the imx6qdl-hummingboard2.dtsi
    file (lo-cated in Linux/arch/arm/boot/dts).


    You will connect to the external devices using the mikroBUS Click Module (see
    page 6 of the HummingBoard schematic).


    ![](img/739a35b59067f8a55eff80a58765146f_439_0.png)


    You do not interact with hardware devices until Chapter 5, so the drivers developed
    in previous chapters not need any modification to be ported to the HummingBoard.


    # LAB 5.2: "LED Platform device" Module and LAB 5.3: "LED sysfs Platform device"
    Module


    Connect the "MikroElektronika Button R click" backlight LED to the PWM1_OUT pin
    of the HummingBoard mikroBUS Module. See the Button R click board at http://www.mikroe.com/click/button-r/


    As already seen in Chapter 5 every ball on the physical i.MX6 chip has a name
    by assigned by NXP and each pad has a canonical name. The canonical name is shown
    on the schematic symbol inside the part, next to the pin and pin number.'
  merge: -1
  pgno: 439
- img_proc: true
  md: "The PWM1_OUT pin is connected to the DISPO_DAT8 canonical name (Go to page\
    \ 4 of the SR-uSOM-MX6 schematic).\n\nAlmost every pad has a GPIO function, for\
    \ the DISPO_DAT8 pad this is GPIO4_1029.\n\nOpen the imx6qdl-hummingboard2.tsi\
    \ file. Add the hellokeys and the pinctrl_led configuration node inside \"phand\
    \ to iomux node\" (&iomux):\n\n```\nhellokeys {\n    compatible = \"arrow,hellokeys\"\
