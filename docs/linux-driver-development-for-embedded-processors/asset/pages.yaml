  md: '# Kernel Memory Allocators


    The Linux Kernel provides a few memory allocation methods. The main one is the
    Allocator that works on pages. The SLAB allocator is built upon Page Allocator,
    getting memory from it and handling it using smaller entities. Kernel memory allocators
    allocate physical pages, and Kernel allocated memory cannot be swapped out, so
    no fault handling is required. Most Kernel memory allocation functions also return
    a pointer to a Kernel virtual address to be used within the Kernel space.


    ![](img/739a35b59067f8a55eff80a58765146f_297_0.png)


    # PAGE Allocator


    The Page Allocator is responsible for the management of page allocations to the
    entire system. This code manages lists of physically contiguous pages and maps
    them into the MMU page tables, so as to provide other Kernel subsystems with valid
    physical address ranges when the Kernel requests them (Physical to Virtual Address
    mapping is handled by a higher layer of the VM). The name Buddy Allocator is derived
    from the algorithm this subsystem uses to maintain its free lists. All pages in
    RAM are cataloged by the Buddy Allocator and grouped into lists. Each list represents
    clusters of 2n pages, where n is incremented in each list. If no entries exist
    on the requested list, an entry from the next list is broken into two separate
    clusters and is returned to the caller while the other is added to the next list
    down. When an allocation is returned to the buddy allocator, the reverse process
    happens. Note that the Buddy Allocator also manages memory zones, which define
    pools of memory that have different purposes.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Page Allocator API


    To allocate memory, these are some of the available functions:


    ```

    unsigned long get_zeroed_page(int flags) /* Returns the virtual address of

    a free page, initialized to zero */n

    ```


    The most common flags are:


    +   GFP_KERNEL: Standard Kernel memory allocation. The allocation may block in
    order to find

    enough available memory. For most needs, except in an interrupt handler context.

    GFP_ATOMIC: RAM allocated from code which is not allowed to block (interrupt handlers

    critical sections). Never blocks, allows to access emergency pools, but can fail
    if no free

    memory is readily available.

    GFP_DMA: Allocates memory in an area of the physical memory usable for DMA transfers.


    ```

    unsigned long __get_free_page(int flags) /* Same, but doesnt initialize

    the contents */


    ```


    ```

    unsigned long __get_free_pages(int flags, unsigned int order) /* Returns

    t starting virtual address of an area of several contiguous pages in

    physical RAM, with the order being log2(number_of_pages). Can be computed

    from the size with the get_order() function */


    ```


    # SLAB Allocator


    The SLAB allocator allows creation of "caches", one cache for each object type
    (e.g., inode_

    cache, dentry_cache, buffer_head, vm_area_struct). Each cache contains many "slabs"

    (usually one page long and always contiguous), and each slab contains multiple
    initialized

    objects.


    The primary intention of the slab allocation technique was to efficiently manage
    the allocation

    of Kernel objects and prevent memory fragmentation caused by memory allocation
    and

    deallocation. The Kernel objects are the allocated and initialized objects of
    the same type that

    are usually represented in the form of struct in C. These objects are only used
    by the Kernel

    core, modules, and drivers that run in the Kernel space. The object size can be
    smaller or

    gr than the page size. The SLAB allocator takes care of increasing or reducing
    the size of

    the cache as needed, depending on the number of allocated objects, using the Page
    Allocator

    to allocate and free pages.


    The SLAB allocator consists of a variable number of caches that are linked together
    on a

    double linked circular list called a "cache chain".'
  merge: -1
  pgno: 298
- img_proc: true
  md: "In order to reduce fragmentation, the slabs are sorted in three groups:\n\n\
    +   - Full slabs with zero free objects.\n- Partial slabs.\n- Empty slabs with\
    \ no allocated objects.\n\nIf partial slabs exist, then new allocations come from\
    \ these slabs, otherwise from empty slabs\n new slabs are allocated.\n\nIn the\
    \ Linux Kernel there are three different implementations of the slab allocation\
    \ technique,\nnamely SLAB, SLUB and SLOB. The SLUB allocation is used by default\
    \ in the i.MX62 Linux\nKernel.\n\n![](img/739a35b59067f8a55eff80a58765146f_299_0.png)\n\
    \nCONFIG_SLAB: legacy.\nCONFIG_SLOB: Simple allocator, saves about 0.5MB of memory,\
    \ but does not scale well. It is\nused for very small systems with limited memory\
    \ (option activates after selecting CONFIG_\nBEDDED).\nCONFIG_SLUB: Default since\
    \ 2.6.23. Simpler than SLAB, scales better."
