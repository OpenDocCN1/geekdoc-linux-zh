  md: "# Interrupt Management\n\nSplit the execution of the interrupt handler in two\
    \ parts, the Top half and the Bottom half.\n\n![](img/739a35b59067f8a55eff80a58765146f_416_0.png)\n\
    \n+   1. Handler (Top half):\n\nThe workqueues are a general mechanism for deferring\
    \ work. You will enqueue the work in the workqueue with queue_work(). See the\
    \ Handler code below:\n\n```\nstatic irq_return_t hello_keys_isr(int irq, void\
    \ *data)\n{\n    pr_info(\"interrupt received. key: %s\\n\", HELLO_KEYS_NAME);\n\
    \    struct iio_dev *dev = data;\n    /* recover ADC data to enqueue work in the\
    \ workqueue */\n    struct ADC_data *job = iio_priv(indio dev);\n    queue_work(job->ADC_wq,\
    \ &job->work);\n    return IRQ_HANDLED;\n}\n```\n\n+   2. Bottom Half:\n\nIn the\
    \ Bottom half you will wake up the User process:\n\n```\nstatic void ADC_trigger_int(struct\
    \ work_struct *work_s)\n{\n    pr_info(\"ISR bottom done\");\n    done = true;\n\
    \    wake_up(&hello_keys_wait);\n}\n```"
