    3. Loading buffer descriptor parameters of the scripts.

    4. Controlling execution of the scripts.

    5. Callback mechanism at the end of script execution.


    The driver provides an API for other drivers to control SDMA channels. The SDMA
    channels run dedicated scripts according to peripheral and transfer types. The
    SDMA API driver is responsible for loading the scripts into SDMA memory, initializing
    the channel descriptors, and controlling the buffer descriptors and SDMA registers.


    The table below provides a list of drivers that use SDMA and the number of SDMA
    physical channels used by each driver. A driver can specify the SDMA channel number
    that it wishes to use, static channel allocation, or can have the SDMA driver
    provide a free SDMA channel for the driver to use, dynamic channel allocation.
    For dynamic channel allocation, the list of SDMA channels is scanned from channel
    32 to channel 1. Upon finding a free channel, that channel is allocated for the
    requested DMA transfers.


