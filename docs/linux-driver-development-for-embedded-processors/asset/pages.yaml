    # Configure Network Booting for a Development Setup


    During the development of the driver labs we use both TFTP and NFS servers in
    our host system and only the U-Boot bootloader will be stored in the SD card.
    The bootloader will fetch the Linux Kernel from the TFTP server and the Kernel
    will mount the root filesystem from the NFS server. Changes to either the Kernel
    or the root filesystem will be made available without the need to reprogram the
    SD.


    # Installing a TFTP Server


    If you are not already running a TFTP server, follow the next steps to install
    and configure a TFTP server on your Ubuntu 14.04 host:


    ```

    ~ sudo apt-get install ttfpd-hpa

    ```


    The ttfpd-hpa configuration is installed in /etc/default/ttfppd-hpa. By default,
    it uses /var/lib/tftpboot as the root TFTP folder. Change the folder permissions
    to make it accessible to all users using the following command:


    ```

    ~ sudo chmod 1777 /var/lib/tftpboot

    ```


    Check the TFTP server status with "netstat -a | grep tftp". If there is no result


    # Installing an NFS Server


    If you are not already running an NFS server, follow the next steps to install
    and configure on your Ubuntu 14.04 host:


    ```

    ~ sudo apt-get install nfs-kernel-server

    ```'
