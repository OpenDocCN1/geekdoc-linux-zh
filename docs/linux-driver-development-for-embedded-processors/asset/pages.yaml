- img_proc: true
  md: 'In the following figure you can see the general memory layout of the SLAB allocator:


    ![](img/739a35b59067f8a55eff80a58765146f_300_0.png)


    To understand Linux kernel SLAB allocators, the following terms are defined, which
    appear frequently in the SLAB allocator source code:


    +   1. **Cache**: Cache is a group of the Kernel objects of the same type. Cache
    is identified by a name that is usually the same as the C structure name. The
    Kernel uses a doubly-linked list to link the created caches.


    +   2. **Slab**: Slab is the contiguous block of memory stored in one or more
    physical page(s) of the main memory. Each cache has a number of slabs that store
    the actual Kernel objects of the same type.


    +   3. **Kernel object**: The Kernel object is the allocated and initialized instance
    of a C struct. Each slab may contain some objects (depending on the size of the
    slab and each object). A Kernel object in the slab can be either active (object
    is being used by the Kernel) or free (the object is in the memory pool and ready
    to be used upon request).'
