    # An I2C Device Model Example


    A Linux device model example for the i2c subsystem will now be described. You
    will develop several i2c drivers along this book, so it is interesting to know
    how all the parts of the i2c subsystem are interrelated.


    +   1. The core of the i2c subsystem is located under Linux/drivers/i2c directory.
    The i2c core API is a set of functions to send data to a device connected to an
    i2c bus.


    +   2. The i2c controller drivers are located under Linux/drivers/i2c/busses directory.
    The i2c controller is a platform device (attached to a platform bus) and the driver
    code is a set of functions that are called by the i2c core API (send/receive data
    on the physical i2c bus).


    +   3. The i2c device drivers are located throughout Linux/drivers/, depending
    on the type of device (e.g., drivers/input for input devices). The driver code
    is specific to the device (e.g., accelerometer, digital analog converter.-) using
    the i2c core API to send and receive data.


    See the i2c subsystem Kernel in the following figure. The "I2C-imx" driver registers
    the i2c controllers to the platform bus core, and the "i2c client" drivers are
    registered to the i2c bus core.


    ![](img/739a35b59067f8a55eff80a58765146f_107_0.png)'
