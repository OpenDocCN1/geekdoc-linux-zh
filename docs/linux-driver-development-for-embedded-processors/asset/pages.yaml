  md: '# LAB 6.2: "Switch interrupt platform device" Module that Wakes up an Application


    ![](img/739a35b59067f8a55eff80a58765146f_250_0.png)


    What does it mean for a process to **sleep**? When a process is put to sleep,
    it is marked as being in a special state and removed from the scheduler''s run
    queue. Until something comes along change that state, the process will not be
    scheduled on any CPU and, therefore, will not run. A sleeping process has been
    shunted off to the side of the system, waiting for some future event to happen.


    causing a process to sleep is an easy thing for a Linux device driver to do. There
    are, however, a couple of rules that you must keep in mind to be able to sleep
    the process in a safe manner. The first of rules is: never sleep when you are
    running in an atomic context. You also cannot sleep if you have disabled interrupts.
    It is legal to sleep while holding a semaphore, but you should look very carefully
    at any code that does. If code sleeps while holding a semaphore, any other thread
    waiting for that semaphore also sleeps. So any sleeping that happens while holding
    semaphores should be short, and you should convince yourself that by holding the
    semaphore, you are not blocking the process that will eventually wake you up.
    Another thing to remember with sleeping is that, when you wake up, you never know
    how long'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Handling Interrupts in Platform Drivers


    your process may have been out of the CPU or what may have changed in the mean
    time. You also do not usually know if another process may have been sleeping due
    to the same event.


    Other relevant point is that your process cannot sleep unless it is assured that
    somebody will wake it up. The code doing the waking must also be able to find
    your process to be able to do its job. Making it possible for your sleeping process
    to be found through a data structure called a wait queue. A wait queue is a list
    of processes, all waiting for a specific event.


    In Linux, a wait queue is managed by means of a "wait queue head," a structure
    of type wait_queue_head_t which is defined in Linux/linux/wait.h. A wait queue
    head can be defined and initialized statically with:


    ```

    DECLARE_WAIT_QUEUE_HEAD(name);

    ```


    or dynamically as follows:


    ```

    wait_queue_head t my_queue;

    init_wait_queue_head(&my_queue);

    ```


    When a process sleeps, it does so in expectation that some condition will become
    true in the future. As noted before, any process that sleeps must check to be
    sure that the condition it was waiting for is really true when it wakes up.


    The simplest way of sleeping in the Linux Kernel is a macro called wait_event
    (with a few variants); it combines handling the details of sleeping with a check
    on the condition a process is waiting for. The forms of wait_event are:


    ```

    wait_event(queue, condition)

    wait_event_interruptible(queue, condition)

    wait_event_timeout(queue, condition, timeout)

    wait_event_interruptible_timeout(queue, condition, timeout)

    ```


    In all of the above forms, queue is the wait queue head to use. The condition
    is an arbitrary boolean expression that is evaluated by the macro before after
    sleeping; until the condition evaluates to a true value, the process continues
    to sleep. If you use wait_event, your process is put into an uninterruptible sleep.
    The preferred alternative is wait_event_interruptible, which can be interrupted
    by signals. The timeout versions (wait_event_timeout and wait_event_interruptible_timeout)
    may wait for a limited time; after that time period (expressed in jiffies) expires,
    the macros return with a value of zero regardless of how the condition evaluates.'
