    \ ( 4 KB)\nfixmap : 0xffff0000 - 0xfffe0000 ( 896 KB)\nvmalloc : 0xc0000000 -\
    \ 0xff000000 (1000 MB)\nlowmem : 0x80000000 - 0xc0000000 (1024 MB)\npkmap : 0x87fe0000\
    \ - 0x80000000 ( 2 MB)\nmodules : 0x87ff0000 - 0x87fe0000 ( 14 MB)\n  .text :\
    \ 0x80d20000 - 0x80d1fccd (13408 KB)\n  .init : 0x80d20000 - 0x80d2c2c0 ( 329\
