    Starting with Linux Kernel version 3.8 ARM® board has an unique Device Tree binary
    required by the Kernel. Therefore, you will need to build and install the correct
    dtb for the target device. All Device Tree files are located at Linux/arch/arm/boot/dts/.
    To build an individual Device Tree file find the name of the dts file for the
