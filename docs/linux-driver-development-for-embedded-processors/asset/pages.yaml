  md: '# LAB 9.5: "IIO subsystem ADC with hardware triggering" Module


    ![](img/739a35b59067f8a55eff80a58765146f_412_0.png)


    In the last Kernel module lab you are going to combine some of the concepts you
    have learned in the course of this book. You will reuse part of the LTC2422_dual
    driver, but this time the ADC conversion will be started using a hardware trigger.
    The SW5 pushbutton will generate an interrupt that triggers the ADC conversion.
    A wait queue will be used to synchronize the Kernel code running in process and
    interrupt contexts. The execution of the interrupt handler is split into two parts:
    The Top half that should be completed as quickly as possible and the Bottom half
    that offloads data processing from interrupt handlers.


    The following figure details the main parts of the new driver:'
