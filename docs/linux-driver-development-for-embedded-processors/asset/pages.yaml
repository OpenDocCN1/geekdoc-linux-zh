    ![](img/739a35b59067f8a55eff80a58765146f_266_0.png)


    In this lab you will write a driver that uses the gpiolib subsystem to configure
    two GPIO pins that are going to control an LED and receive an interrupt from the
    SW5 pushbutton.


    These are the main points of your driver:


    +   1. You will configure both GPIO pins inside the probe() function using the
    gpiolib functions described in the previous section: gpio_request(), gpio_direction_output(),
    gpio_direction_input() and gpio_export().


    +   2. You will turn the LED on/off from the user application led_app. Use the
    copy_from_user() function to send values from the User space to the my_dev_write()
    Kernel function.


    +   3. You are going to create sysfs entries to turn the LED on/off from the User
    space using shell commands. The Kernel function will receive the values from the
    User space.


    +   4. You will register a SW5 GPIO interrupt handler inside the probe() function.
    When the interrupt is generated the LED will be toggled within the interrupt service
    routine hello_keys_isr() using the "gpiolib" gpio_set_value() function.'
