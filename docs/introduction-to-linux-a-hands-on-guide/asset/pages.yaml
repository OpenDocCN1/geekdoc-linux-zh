  md: '# Introduction to Linux


    # 7.5.2.2. DEB (.deb) packages


    # 7.5.2.2.1. What are Debian packages?


    This package format is the default on GNU/Linux, where dselect, and nowadays more
    common, aptitude, is the standard tool for managing the packages. It is used to
    select packages that you want to install or upgrade, but it will also run during
    the installation of a Debian system and help you to define the access method to
    use, to list available packages and configure packages.


    The Debian web site contains all information you need, including a "dselect Documentation
    for Beginners".


    According to the latest news, the Debian package format is becoming more and more
    popular. At the time of this writing, 5 of the top-10 distributions use it. Also
    apt-get (see Section 7.5.3.2 is becoming extremely popular, on non-Debian systems.


    # 7.5.2.2.2. Examples with dpkg tools


    Checking whether a package is installed using the dpkg. For instance, if you want
    to know which version of the software is installed on your:


    ```

    nghtswggorefest: $ dpkg -l "gallery*"

    Desired=Unknown/Install/Remove/Unpacked/Failed/Failed-config/Half-installed

    Status=NotInstalled/Installed/Config-files-required/X-both-problems (Status,Err:
    uppercase=bad)

    Name                               Version             Description

    ===============================================================================

    ii gallery                           1.5-large2          a web-based photo album
    written in php

    ```


    The "ii" prefix means the package is installed. Should you use "un" as a prefix,
    that means the package is known in the list that your computer keeps, but it is
    not installed.


    Searching package a file belongs to is done using the -S dpkg:


    ```

    nghtswggorefest: $ dpkg -S /bin/cat

    coreutils: /bin/cat

    ```


    More information can be found in the Info pages for dpkg.


    # 7.5.2.3. Source packages


    The largest part of Linux programs is Free/Open Source, source packages are available
    for these programs. Source files are needed for compiling your own program version.
    Sources for a program can be downloaded from its web site, as of a compressed
    tarball (program-version.tar.gz or similar). For RPM-based distributions, the
    source is often provided in the program-version.src.rpm. Debian, and most distributions
    based on it, provide themselves the adapted source which can be obtained using
    apt-get


    Specific requirements, dependencies and installation instructions are provided
    in the README file. You will probably need a compiler, gcc. This GNU C compiler
    is installed in most Linux systems and is ported to many other platforms.'
