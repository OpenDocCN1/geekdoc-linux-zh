    Mandra and Mandriva provide so-called RPMI tools, a set of wrapper programs that
    make installing new software easier for the user. These tools combine with RPMrake
    and MandrakeUpdate to provide everything for smooth install and uninstall of software
    packages. Mandrake offers an extended range of services and can automatically
    notify administrators when updates are available for your particular Mandrake
    system.


    Also the KDE and Gnome desktop suites have their own (graphical) versions of package
    managers.


