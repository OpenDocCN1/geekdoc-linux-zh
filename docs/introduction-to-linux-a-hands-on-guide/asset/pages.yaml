    # 6.2.2. Basic commands


    # 6.2.2.1. Moving through the text


    Moving through the text is usually possible with the arrow keys. If not, try:


    +   * h to move the cursor to the left

    * i to move it to the right

    * k to move up

    * j to move down


    SHIFT-G will pull the prompt at the end of the document.


    # 6.2.2.2. Basic operations


    These are some popular commands:


    +   * dd will delete n lines starting from the current cursor position.

    * dw will delete n words at the right side of the cursor.

    * x will delete the character on which the cursor is positioned

    * n moves to n line of the file.

    * w will save (write) the file

    * q will exit the editor.

    * q! forces the exit when you want to quit a file containing unsaved changes.

    * wq will save and exit

    * new will save the text to newfile.

    * qw overrides read-only permission (if you have the permission to override permissions,
    for instance when you are using the root account).

    * / search the string in the file and position the cursor on the first match below
    its position.

    * / will perform the same search again, moving the cursor to the next match.

    * i, /s/anotherword/g will replace word with anotherword throughout the file.

    * yy will copy a block of text.

    * np will paste it n times.

    * recover will recover a file after an unexpected interruption.


    # 6.2.2.3. Commands that switch the editor to insert mode


    +   * a append: it moves the cursor one position to the right before switching
    to insert mode

    * i insert

    * o insert a blank line under the current cursor position and move the cursor
    to that line.'
