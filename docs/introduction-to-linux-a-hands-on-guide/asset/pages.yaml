    # 8.2.2. Graphical printer configuration


    Most distributions come with a GUI for configuring networked and local (parallel
    port or USB) printers. They let you choose the printer type from a list and allow
    easy testing. You don''t have to bother about syntax and location of configuration
    files. Check your system documentation before you attempt your printer.


    CUPS can also be configured using a web interface that runs on port 631 on your
    computer. To check if this feature is enabled, try browsing to localhost:631/help
    or localhost:631.


    # 8.2.3. Buying a printer for Linux


    As more and more printer vendors make drivers for CUPS available, CUPS will allow
    easy connection with almost any printer that you can plug into a serial, parallel,
    or USB port, plus any printer on the network. CUPS will ensure a uniform presentation
    to you and your applications of all different types of printers.


    Printers that only come with a Win9 driver would be problematic if they have no
    support. Check with http://linuxprinting.org/ when in doubt.


    In the past, your best choice would have been a printer with native PostScript
    support in the firmware, nearly all UNIX or Linux software producing output, produces
    it in PostScript, the publishing industry''s printer control language of choice.
    PostScript printers are usually a bit more expensive, but it is a device-independent,
    open programming language and you''re always 100% sure that they will work. Within
    days, however, the importance of this rule is dwindling.


    # 8.3. Print problems


    In this section, we will discuss what you can do as a user when something goes
    wrong. We won''t discuss any problems that have to do with the daemon-part of
    the printing service, as that is a task for system administrators.


    # 8.3.1. Wrong file


    If you print the wrong file, the job may be canceled using the command lprm jobID,
    where jobID is in the form printername-printjobnumber (from information displayed
    by lpq or lpstat). This will work if other jobs are waiting to be printed in this
    printer''s queue. However be quick if you are the only using this printer, jobs
    are usually queued and send to the printer in order. Once they arrive on the printer,
    it is too late to remove jobs using Linux tools.


    What you can try in those cases, or in cases where the wrong driver is configured
    and only comes out of the printer, is power off the printer. However, that might
    not be the best course of action, as you might cause paper jams and other irregularities.


    # 8.3.2. My printer hasn''t come out


    Use the lpq command and see if you can spot your job:'
