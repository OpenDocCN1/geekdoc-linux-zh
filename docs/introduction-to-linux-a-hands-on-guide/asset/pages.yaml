  md: '# Chapter 4. Processes


    Next to files, processes are the most important things on a UNIX/Linux system.
    In this chapter, we will take a closer look at those processes. We will learn
    more about:


    +   * Multi-user processing and multi-tasking

    * Process types

    * Controlling processes with different signals

    * Process attributes

    * The life cycle of a process

    * System startup and shutdown

    * SUID and SGID

    * System speed and response

    * Scheduling processes

    * The Pixie cron system

    * How to get the most out of your system


    # 4.1. Processes inside out


    # 4.1.1. Multi-user and multi-tasking


    Now that we are more used to our environment and are able to communicate a little
    bit with our system, it is time to study the processes we can start in a single
    process. Some commands initiates a series of processes, as for **mozilla**, others
    like ls, are executed as a single command.


    Furthermore, Linux is based on UNIX, where it has been common policy to have multiple
    users running multiple commands, at the same time and on the same system. It is
    obvious that measures to be taken to have the CPU manage all these processes,
    and that functionality has to be provided so users can switch between processes.
    In some cases, processes will continue to run even when the user who started them
    logs out. Users need means to reactivate interrupted processes.


    We will explain the structure of Linux processes in the next sections.


    # 4.1.2. Process types


    # 4.1.2.1. Interactive processes


    Interactive processes are initialized and controlled through a terminal session.
    In other words, there has to be someone connected to the system to start these
    processes; they are not started automatically as per system functions. These processes
    can run in the foreground, occupying the terminal that started the program, and
    you can''t start other applications as long as this is running in the foreground.
    Alternatively, you can run in the background, so the terminal which you started
    the program can accept new commands while the program is running. Until now, we
    mainly focused on processes in the foreground - the length of time to run them
    was too short to notice - but viewing a file with the **less** command is a good
    example of a command terminating the terminal session. In this case, the activated
    program is waiting for you to do something. The program is still connected to
    the terminal where it started, and the terminal is only useful for entering commands
    this program can understand. Other commands will just result in errors or'
