  md: '# Introduction to Linux


    I don''t have these applications on my system!

    A of the tools and applications discussed in the above sections are optional software.
    It is possible that such applications are not installed on your system by default,
    but that you can find them in your distribution as additional packages. It might
    also be very well that the application you are looking for is not in your distribution
    at all. In that case, you need to download it from the application''s web site.


    # 11.2.3. Volume control


    aumix and alsmixer are two common text tools for adjusting audio controls. Use
    the arrow keys to toggle settings. The alsmixer has a graphical interface when
    started from the Gnome menu or gnome-alsmixer from the command line. The kmix
    tool does the same in KDE.


    Regardless of how you choose to listen to music or other sounds, remember that
    there may be other people who not be interested in hearing you or your computer.
    Try to be courteous, especially in office environments. Use a quality headset,
    rather than the ones with small ears. This is better for your ears and causes
    less distraction for your colleagues.


    # 11.2.3. Recording


    Various tools are available that the allow you to record voice and music. For
    recording voice you can use arecord on the command line:


    ```

    alexey@russia:~ record /var/tmp/myvoice.wav

    Recording WAVE ''/var/tmp/myvoice.wav'': Unsigned 8 bit, Rate 8000 Hz, Mono

    Aborted by signal Interrupts...

    "Interrupt" means that the application has caught Ctrl+C. Play the sample using
    the play command.

    ```


    This is a good test that you can execute before testing applications that need
    voice input, Voice over IP (VoIP). Keep in mind that the microphone input should
    be activated. If you don''t hear your own voice, check your sound settings. It
    often happens that the microphone is muted or on low volume. This can be easily
    adjusted using alsmixer or your distribution-specific graphical interface to the
    sound system.


    In KDE you can use the kree utility, Gnome provides the gnome-sound-recorder.


    # 11.3. Video playing, streams and television watching


    Various players are available:


    +   - xine: a free video player

    - ogle: DVD player.

    - okle: KDE version of ogle

    - mplayer: Movie Player for Linux

    - totem: both audio and video files, audio CDs, VCD and Video.

    - replay: a Real alternative, see HelixDNA.

    - koffaffeine: media player for KDE3.


    Most likely, you will find one of these in your grace menus.


    Chapter 11. Sound and Video'
