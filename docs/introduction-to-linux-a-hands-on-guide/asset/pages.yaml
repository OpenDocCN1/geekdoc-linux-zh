    # 3.2.4. The most important configuration files


    As we mentioned before, most configuration files are stored in the /etc directory.
    Content can be viewed using the cat command, which sends text files to the standard
    output (usually your monitor). The syntax is straight forward:


    ```

    cat file1 file2 ... fileN

    ```


    In this section we try to give an overview of the most common configuration files.
    This is certainly not a complete list. Adding extra packages may also add configuration
    files in /etc. When reading the configuration files, you will find that they are
    quite well commented and self-explanatory. Some files also have pages which contain
    extra documentation, as man group.


    Table 3-3. Most common configuration files


    | File | Information/service |

    | aliases | Mail aliases use with the Sendmail and Postfix mail server. Running
    a mail server on each and every system has long common use in the UNIX world,
    and almost every Linux distribution still comes with a Sendmail package. In this
    local user names are matched with real names as they occur in E-mail addresses,
    or with other local addresses |

    | apache | Config files for the Apache web server. The system-wide configuration
    file for the Bourne Shell. Defines functions and aliases for all users. Others
    shells may have their own system-wide config files, like csh |

    | crontab and the cron.* | Configuration of tasks to be executed periodically
    - backups, updates of the system databases, cleaning of the system, rotating logs
    etc |

    | default | Default options for certain commands, such as useradd | files | Known
    file systems: ext3, vfat, iso9660 etc | fstab | Lists partitions and their mount
    points | ftp* | Configuration of the ftp-server: who can connect, what parts of
    the system are accessible etc. | group | Configuration file for user groups. Use
    the shadow utilities groupadd groupmod groupdel to edit this file. Edit manually
    only if you really know what you are doing. |


