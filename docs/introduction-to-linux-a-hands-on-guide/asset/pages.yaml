    # 4.2. Boot process, Init and shutdown


    # 4.2.1. Introduction


    One of the most powerful aspects of Linux concerns its method of starting and
    stopping the operating system, where it loads specified programs using their particular
    configurations, permits you to change those configurations to control the boot
    process, and shuts down in a graceful and ordered way.


    Beyond the question of controlling the boot or shutdown process, the open nature
    of Linux makes it much easier to determine the exact source of most problems associated
    with starting or shutting down your system. A basic understanding of this process
    is quite beneficial to everyone who uses a Linux system.


    A lot of Linux systems use lilo, the Linux Loader for booting operating systems.
    We will only discuss GRUB, which is easier to use and more flexible. Should you
    need information about lilo refer to the man pages and HOWTOs. Both systems support
    dual boot installations, we refer to the HOWTOs on this subject for practical
    examples and background information.


    # 4.2.2. The boot process


    When an x86 system is booted, the processor looks at the end of the system memory
    for the BIOS (Basic Input/Output System) and runs it. The BIOS program is written
    into read-only memory and is always available for use. The BIOS provides the lowest
    level interface to peripheral devices and controls the first step of the boot
    process.


    The BIOS tests the system, looks for and checks peripherals, and then looks for
    a drive to boot the system. Usually it checks the floppy drive (or CD-ROM drive
    on many newer systems) for bootable media, by present, and then it looks to the
    hard drive. The order of the drives for booting is usually controlled by a particular
    setting on the system. Since Linux is installed on the hard drive, the BIOS looks
    for a Master Boot Record (MBR) starting at the first sector of the hard drive,
    loads its contents into memory, then passes control to.


    This MBR contains instructions on how to load the GRUB (or LILO) boot-loader,
    using a pre-selected operating system. The MBR then loads the boot-loader which
    takes over the process (if the boot-loader is installed in the MBR). In the default
    Hat Linux configuration GRUB uses the settings in the MBR to display boot options
    in a menu. Once GRUB has received the correct instructions for the operating system
    to start, from its command line or configuration file, it finds the necessary
    boot file and hands off control to the machine that operates it.


    # 4.2.3. GRUB features


    This method is called direct loading where instructions are used to directly load
    the operating system, with no intermediate code between the boot-loaders and the
    system''s main files (such as the kernel). The boot process used by other operating
    systems may differ slightly from the above, however. For example Microsoft DOS
    and Windows operating systems completely overwrite anything on the MBR when they
    are installed without incorporating any of the current MBR configuration. This
    destroys any information stored in the MBR by other operating systems, such as
    Linux. The Microsoft operating systems as well as other other operating systems,
    are loaded using a chain loading method. With this method, the MBR points to the
    first sector of the partition holding the operating system, where it finds the
    special files


