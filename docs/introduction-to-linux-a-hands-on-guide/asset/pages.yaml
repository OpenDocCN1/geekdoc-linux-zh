    # 7.5. Installing new software


    # 7.5.1. General


    Most people are surprised to see that they have a running, usable computer after
    installing Linux; most distributions can ample support for video and network cards,
    monitors and other external devices, so there is usually no to install extra drivers.
    Also common tools as office suites, web browsers, E-mail and other network client
    programs are included in the main distributions. Even so, an initial installation
    might meet your requirements.


    If you can''t find what you need, maybe it is not installed on your system. It
    may also be that you have the required software, but it does not work as is supposed
    to. Remember that Linux moves fast, and software improves on a daily basis. Don''t
    waste your time troubling problems that might already be resolved.


    You can update your system or add packages to it at any time you want. Most software
    comes in packages. Extra software may be found on your installation CDs or on
    the Internet. The website of your Linux distribution is a good place to start
    looking for additional software and instructions about how to install it on your
    type of Linux, Appendix A. Always read the documentation that comes with new software,
    and installation guidelines the package might contain. All software comes with
    a README file, which you are very advised to read.


    # 7.5.2. Package formats


    # 7.5.2.1. What is RPM?


    RPM, the RedHat Package Manager, is a powerful package manager that you can use
    to install, update and remove packages. It allows you to search for packages and
    keep track of the files that come with each package. A system is built-in so you
    can verify the authenticity of packages downloaded from the Internet. Advanced
    users can build their own packages with RPM.


    An RPM package consists of an archive of files and meta-data used to install and
    erase the archive files. The meta-data includes helper scripts, file attributes,
    and descriptive information about the package. Packages come in two varieties:
    binary packages, used to encapsulate software to be installed, and source packages,
    containing the source code and recipe necessary to produce binary packages.


