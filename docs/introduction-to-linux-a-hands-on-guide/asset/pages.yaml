  md: '# Introduction to Linux


    On systems using Nixie cron, jobs that occur hourly, daily, weekly and monthly
    are kept in separate directories /etc to keep an overview, as opposed to the standard
    UNIX cron function, where all tasks are entered into one big file.


    Example of a Nixie crontab file:


    ```

    [root@blob /etc]# more crontab

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=


    # run-parts

    # commands to execute every hour

    01 * * * run-parts /etc/cron.hourly

    # commands to execute every day

    02 4 * * run-parts /etc/cron.daily

    # commands to execute every week

    22 4 * * run-parts /etc/cron.weekly

    # commands to execute every month

    42 1 * * run-parts /etc/cron.monthly

    ```


    # Alternative


    You could also use the crontab -1 command to display crontabs.

    Some variables are set, and after there''s the scheduling, one line per job, sorting
    with time and date fields. The first field contains the minutes (from 0 to 59),
    the second defines the hour of execution (0-23), the third is the day of the month
    (1-31), the number of the month (1-12), the last day of the week (0-7, 0 and 7
    are Sunday). An asterisk in these fields represents the acceptable range for the
    field. Lists are allowed; to execute a job from Monday to Friday 1-5 in the last
    field, to execute a job on Monday, Wednesday and Friday after 1,3,5.


    Then comes the user who should run the processes listed in the last column. The
    example is from a Nixie cron configuration where root runs the run-parts on regular
    intervals, with the appropriate directories as options. In these directories,
    the actual jobs to be executed at the scheduled time are stored as shells, like
    this little script is run to update the database using the locate


    ```

    billy@ashost cron.daily]$ cat slocate.cron

    !/bin/sh

    renice +19 -p $$ -f "/tmp,msfs,ncpfs,cron,devpts" -e \

    /usr/bin/updatedb -f "/tmp,/var/tmp,/tmpafs,/net"

    ```


    Users are supposed to edit their crontabs in a safe way using the crontab -e command.
    This will prevent a user from accidentally opening more than one of his/her crontab
    file. The default is vi (see Chapter 6, but you can use any editor, such as gvim
