  md: '# Introduction to Linux


    The tar tool supports the creation of incremental backups, using the -N option.
    With this option, you can specify a date, and tar will check modification time
    of all specified files against this date. If files are changed more recent than
    date, they will be included in the backup. The example below uses the timestamp
    on a previous archive as the date value. The initial archive is created and the
    timestamp of the initial backup file is shown. A new file is created, upon which
    we make a backup, containing only this new file:


    ```

    jimmy: tar cvfp /var/tmp/javaproggies.tar java/*.java

    java/error.java

    java/hello.java

    java/income2.java

    java/income.java

    java/inputdevice.java

    java/input-java

    java/master.java

    java/method1.java

    java/mood.java

    java/moodwaitress.java

    java/test3.java

    java/TestOne.java

    java/TestTwo.java

    java/Vehicle.java

    ```


    ```

    jimmy: ls -l /var/tmp/javaproggies.tar

    -rw-r--r-- jimmy 10240 Jan 21 11:58 /var/tmp/javaproggies.tar

    ```


    ```

    jimmy: touch java/newprog.java

    ```


    ```

    jimmy: tar -N /var/tmp/javaproggies.tar \

    -cvp /var/tmp/incremental-javaproggies.tar java/*.java 2> /dev/null

    java/newprog.java

    ```


    ```

    jimmy: cd /var/tmp/

    ```


    ```

    jimmy: tar xvf incremental-javaproggies.tar

    java/newprog.java

    ```


    Standard errors are redirected to /dev/null. If you do not, tar will print a message
    for unchanged file, telling you it won''t be bumped.


    This way of working has the disadvantage that it looks at timestamps on files.
    Say that you download an archive into the directory containing your backups, and
    the archive contains files that have been created years ago. When checking the
    timestamps of those files against the timestamp on the initial archive, the new
    files will appear old to tar, and will not be included in an incremental backup
    made using the -N option.


    A better choice would be the -g option, which will create a list of files to backup.
    When making incremental backups, files are checked against this list. This is
    how it works:


    ```

    jimmy: tar cvfp work-200030121.tar -g snapshot-200030121 work/

    work:

    work/file1

    work/file2

    work/file3

    ```


    ```

    jimmy:-> file snapshot-200030121

    ```


    Chapter 9. Fundamental Backup Techniques'
