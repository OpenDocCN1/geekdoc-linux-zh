  md: '# Introduction to Linux


    # ## 11.2. Sound and video playing


    # ### 11.2.1. CD playing and copying


    The cdp package comes with many distributions and provides cdp and cdplay, a text-based
    CD player. Desktop managers usually include a graphical tool, such as the gnome-cd
    player in Gnome, .wav can be started from a menu.


    Be sure to understand the difference between an audio CD and a CD data. You do
    not have to mount an audio CD into the file system to listen to it. This is because
    the data on a CD are not Linux file system data; they are accessed and sent to
    the audio output channel directly, using a CD player. If your CD is a CD data
    containing .mp3 files, you will first need to mount it into the file system, and
    then use one of the programs that we discuss below in order to play the music.
    How to mount CDs into the file system is explained in Section 7.5.5.


    The cdparanoia tool from the package with the same name reads audio directly as
    data from the CD, without analog conversions, and writes to a file or pipe in
    different formats, of .wav is probably the most popular. Various tools for convert
    to other formats, such as .mp3, come with many distributions or are downloadable
    as separate packages. The GNU project provides several CD playing, ripping and
    encoding tools, database managers; see the Free Software Directory, Audio section
    for detailed information.


    Audio-CD creation is eased, among others, with the kaudiocreat from the KDE suite.
    It comes with clear information from the KDE Center.


    CD burning is covered in Section 9.2.2.


    # ## 11.2.2. Playing music files


    # #### 11.2.2.1. mp3 files


    The popular .mp3 format is widely supported on Linux machines. Most distributions
    include multiple programs that can play these files. Many other applications,
    XMMS, which is presented in the screenshot below, is one of the most-spread, partially
    because it has the same look and feel as the Windows tool.


    11-1. XMMS mp3 player


    ![](img/bfb21474172a1e0fa05428a183709039_197_0.png)


    Also very popular for playing music are AmarOK, a KDE application that is steadily
    gaining popularity, MPlayer, which can also play movies.


    +   - Restrictions'
