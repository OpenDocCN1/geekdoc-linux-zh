  md: '# Introduction to Linux


    We mentioned both the Gnome and KDE desktops a couple of times. These are the
    most popular ways of managing your desktop, although there are many, many others.
    Whatever desktop you chose to work with is fine - as long as you know how to open
    a terminal. However, we will continue to refer off Gnome and KDE for the most
    popular ways of achieving tasks.


    #  2.1.3. Text mode


    You know''re in text mode when the whole screen is black, showing (in most cases
    white) characters. A text mode screen typically shows some information about the
    machine you are working on, the name of the machine and a prompt waiting for you
    to log in:


    ```

    RedHat Linux Release 8.0 (Psyche)

    blast login: _

    ```


    The login is different from a graphical login, in that you have to hit the Enter
    key after providing your user name, because there are no buttons on the screen
    that you can click with the mouse. Then you should type your password, followed
    by another Enter. You won''t see any indication that you are entering something,
    except an asterisk, and you won''t see the cursor move. But this is normal on
    Linux and for security reasons.


    When the system has accepted you as a valid user, you may get more information,
    called the message of the day, which can be anything. Additionally, it is possible
    on UNIX systems to display a fortune cookie, which contains some general wise
    or unwise (this is up to you) thoughts. After that, you will be given a shell,
    with the same prompt that you would get in graphical mode.


    > Don''t log as root

    Also in text mode: log in as root only to setup and configuration that absolutely
    requires administrator privileges, as adding users, installing software packages,
    and performing networking and other system configuration. Once you are finished,
    immediately leave the special account and resume your work as a non-privileged
    user. Alternatively, some systems, like Ubuntu, force you to use sudo, so that
    you do not need direct access to the administrative account.

    Logging out is due to the logout command, followed by Enter. You are successfully
    disconnected from the system when you see the login screen again.


    > The power button

    While Linux was not meant to be shut off without activation of the proper procedures
    for halting the system, hitting the power button is equivalent to starting those
    processes on newer systems. However, powering off an old system going through
    the halt process might cause severe damage! If you want to be sure, always use
    the Shut down when you log out of the graphical interface, or when on the login
    screen (where you have to give your user name and password) look around for a
    shutdown button.


    Now that we know how to connect and disconnect from the system, we''re ready for
    our first commands.'
