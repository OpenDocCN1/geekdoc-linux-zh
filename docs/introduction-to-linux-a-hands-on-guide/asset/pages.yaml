    # 8. What do you need?


    You will require a computer and a medium containing a Linux distribution. Most
    of this guide applies to all

    Linux distributions - UNIX in particular. Apart from time, there are no further
    requirements.


    The Installation HOW contains helpful information on how to obtain Linux software
    and install it on your

    computer. Hardware requirements and coexistence with other operating systems are
    also discussed.


