    # 4.3.5.1. Priority


    The priority or importance of a job is defined by its nice number. A program with
    a high nice number is friendly to other programs, other users and the system;
    it is not an important job. The lower the nice number, the more important a job
    is and the more resources it will take without sharing them.


    Making a job by increasing its nice number is only useful for processes that use
    a lot of CPU time (compilers, math applications and the like). Processes that
    always use a lot of I/O time are automatically rewarded by the system and given
    a higher priority (a lower nice number), for example keyboard input always gets
    highest priority on a system.


    Defining the priority of a program is done with the nice command.


    Most systems also provide the BSD renice command, which allows you to change the
    niceness of a running command. Again, read the main page for your system-specific
    information.


    +   Interactive programs


    It is NOT a good idea to nice or renice an interactive program or a job running
    in the foreground. Use of these commands is usually a task for the system administrator.
    Read the main page for more info on extra functionality available to the system
    administrator.


    # 4.3.5.2. CPU resources


    On every Linux system, many programs want to use the CPU(s) at the same time,
    even if you are the only user on the system. Every program needs a certain amount
    of cycles on the CPU to run. There may be times when there are not enough cycles
    because the CPU is too busy. The uptime command is wildly inaccurate (it only
    displays what is normal), but far from being useless. There are some actions you
    can undertake if you think your CPU is blame for the unresponsiveness of your
    system:


    +   - Run heavy when the load is low. This may be the case on your system during
    the night. Next section for scheduling.

    - Prevent the system from doing unnecessary work: stop daemons and programs that
    you don''t use, use locate instead of a heavy find, ...

    - Run big jobs with a low priority


    If none of these solutions are an option in your particular situation, you may
    want to upgrade your CPU. On a UNIX machine this is a job for the system admin.


    # 4.3.5.3. Memory resources


    When the currently running processes expect more memory than the system has physically
    available, a Linux system will not crash; it will start paging, or swapping, making
    the process use the memory on disk or in swap space, moving contents of the physical
    memory (pieces of running programs or programs in the case of swapping) to disk,
    reclaiming the physical memory to handle more processes. This slows the system
    down enormously since access to disk is much slower than access to memory. The
    top command can be used to display memory and swap use. Systems using glibc offer
    the memusage and memusagest commands to visualize memory usage.


