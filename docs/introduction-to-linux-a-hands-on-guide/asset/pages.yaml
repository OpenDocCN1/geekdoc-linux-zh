  md: '# Introduction to Linux


    How can you find out which partition a directory is on? Using the df command with
    a dot (.) as as an option shows the partition the current directory belongs to,
    and informs about the amount of space used on that partition:


    ```

    sandra:/lib> df -h

    Filesystem      Size Used Avail Mounted on

    /dev/hda7       980M  163M  767M 18% /

    ```


    As a general rule, every directory under the root directory is the root partition,
    unless it has a separate entry in the full listing from df (or df -h) with no
    other options.


    Read more in man hier.


    # 3.1.3.2. The file system in reality


    For most users and for most system administration tasks, it is enough to accept
    that files and directories are ordered in a tree-like structure. The computer,
    however, doesn''t understand a thing about tree-structures.


    Every partition has its own inode. By imagining all those files together, we can
    form an idea of the tree-structure of the system, but it is not as simple as that.
    In a file system, a file is represented by an inode, a kind of serial number containing
    information about the actual data that makes up the file: to whom this belongs,
    and where it is located on the hard disk.


    Every partition has its own set of inodes; throughout a system with multiple partitions,
    files with the same inode number can exist.


    Each inode describes a data structure on the hard disk, storing the properties
    of a file, including the physical location of the file data. When a hard disk
    is initialized to accept data storage, usually during the initial system installation
    or when adding extra data to an existing system, a fixed number of inodes per
    partition is created. This number will be the maximum amount of files, of all
    types (including directories, special files, links etc.) that can exist at the
    same time on the partition. We typically count 1 inode per 2 to 8 kilobytes of
    storage.


    At the time a new file is created, it gets a free inode. In that inode is the
    following information:


    +   * Owner and group of the file.

    * File type (regular, directory, ...)

    * Permissions on the file Section 3.4.1

    * Date and time of creation, last read and change.

    * Date and time this information has been changed in the inode.

    * Number of links to this file (see later in this chapter).

    * File size

    * An address defining the actual location of the file.


    The only information not included in an inode, is the file name and directory.
    These are stored in the special directory files. By comparing file names and inode
    numbers, the system can make up a tree-structure that the user understands. Users
    can display inode numbers using the -i option to ls. The inodes have their own
    separate space on the disk.


    Chapter 3. About files and the file system'
