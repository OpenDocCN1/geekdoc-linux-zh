  md: '# Introduction to Linux


    For host based IDS, this is done with utilities that monitor the file system for
    changes. System files that have changed in some way, but should not change, are
    a dead give-away that something is amiss. Anyone gets in and root access will
    presumably make changes to the system somewhere. This is usually the first thing
    done, so he can get back in a backdoor, or to launch an attack against someone
    else, in which case he has no choice but to add files to the system. Some systems
    with the tripwire monitoring system, which is documented at the Tripwire Open
    Source Project website.


    Network intrusion detection is handled by a system that sees all the traffic that
    passes the firewall (not by portscanners, who advertise usable ports). Snort is
    an Open Source example of such a program. Whitecats.com features some Intrusion
    detection database, arachNIDS.


    # 10.5.6. More tips


    Some things you should keep in mind:


    +   - Do not allow root logins. UNIX developers come up with the su over two decades
    ago for extra security.

    - Direct access is always dangerous and susceptible to human errors, by it allowing
    root login or by the su - command. When using su, it is even better to use sudo
    to only execute the command that you need extra permissions for, and to afterwards
    to your own environment.

    - Take passwords seriously. Use change passwords regularly.

    - Try to always use SSH or SSL. Avoid telnet, FTP and E-mail clients and other
    client programs which send unencrypted passwords over the network. Security is
    not only about securing your computer, it is also about securing your passwords.

    - Limit resources by quota or limit.

    The mail for root should be delivered to, or at least read by, an actual person.

    - The SANS institute has more tips and tricks, sorted by distribution, with mailing
    list service.

    - Check the origin of new software, get it from a trusted place/site. Verify new
    packages before installing.

    - When using a non-permanent Internet connection, shut it down as soon as you
    don''t need it anymore.

    - Run private services on odd ports instead of the ones expected by possible hackers.

    - Know your system. After a while, you can almost feel when something is happening.


    # 10.5.7. Have I been hacked?


    How can you tell? This is a checklist of suspicious events:


    +   - Mysterious open ports, strange processes.

    - System utilities (common commands) behaving strange.

    - Login problems.

    - Unexplained bandwidth usage.

    - Damaged or missing log files, syslog daemon behaving strange.

    - Interfaces in unusual modes.

    - Unexpectedly modified configuration files.

    - Strange entries in shell history files.

    - Unidentified temporary files.'
  merge: -1
