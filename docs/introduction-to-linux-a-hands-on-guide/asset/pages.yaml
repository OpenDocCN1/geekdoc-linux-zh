  md: '# Glossary


    This section contains an alphabetical overview of commands discussed in this document.


    # A


    +   - **a2ps**: Format files for printing on a PostScript printer, see Section
    8.1.2.

    - **acroread**: PDF viewer, see Section 8.1.2.2.

    - **adduser**: Create a new user or update default new user information.

    - **alias**: Create a shell alias for a command.

    - **alsacon**: Configure sound card using the ALSA driver, see Section 11.1.2.

    - **alsamixer**: Tune ALSA sound device output, see Section 11.2.2.3.

    - **anacron**: Execute commands periodically, does not assume continuously running
    machine.

    - **apropos**: Search the watis database for strings, see Section 2.3.3.2.

    - **apt**: APT package handling utility, see Section 7.5.3.2.

    - **arecord**: Record a sound sample, see Section 11.2.3.

    - **aspell**: Spell checker.

    - **at, at, atrm**: Queue, examine or delete jobs for later execution, see Section
    4.1.2.2 and Section 4.4.3.

    - **aumix**: Adjust audio mixer, see Section 11.2.2.3.

    - **(g)**: Pattern scanning and processing language.


