- img_proc: true
  md: '# Introduction to Linux


    Each layer can use only the functionality of the layer below; each layer can only
    export functionality to the layer above. In other words layers communicate only
    with adjacent layers. Let''s take the example of your E-mail message again: you
    enter it into the application layer. In your computer, it travels down the transport
    and network layer. Your computer puts it through the network with that layer.
    That is also the layer that will move the message around the world. At the destination,
    the receiving computer will accept the message and it will display it using the
    transport and application layer.


    +   - It''s really much complicated

    The above and following sections are included because you will come across some
    networking terms sooner or later; they will give you some starting points, which
    you want to find out about the details.


    # ## 10.1.2. Some popular networking protocols


    Linux supports many different networking protocols. We list the most important:


    # ### 10.1.2.1. TCP/IP


    The Transport Control Protocol and the Internet Protocol are the two most popular
    ways of communicating on the Internet. A lot of applications, as as your browser
    and E-mail program, are built on top of this protocol suite.


    Very simply, IP provides a solution for sending packets of information from one
    machine to another, while TCP ensures that the packets are arranged in streams,
    so that packets from different applications don''t get mixed up, and that the
    packets are sent and received in the correct order


    A good starting point for learning about TCP and IP is in the following documents:


    +   - man ip: Describes the IPv4-protocol implementation on Linux (version 4 currently
    being the most wide-spread edition of the IP protocol).

    - man tcp: Implementation of the TCP protocol.

    - RFC793, RFC1122, RFC2001 for TCP, RFC791, RFC1122 and RFC1112 for IP.


    The Request For Comments contain the descriptions of networking standards, protocols,
    applications and implementation. These documents are managed by the Internet Engineering
    Task Force, an international community connected with the smooth operation of
    the Internet and the evolution and development of the Internet architecture.


    Your ISP usually has an RFC archive available, or you can browse the RFCs at http://www.ietf.org/rfc.html.


    # ### 10.1.2.2. TCP/IPv6


    Nobody expected the Internet to grow as fast as it does. IP proved to have some
    disadvantages when a really large number of computers is in a network, the most
    important being the availability of unique addresses to assign to each machine
    participating. Thus, IP version 6 was devised to meet the needs of today''s Internet.


    Chapter 10. Networking'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Introduction to Linux


    Unfortunately, not all applications and services support IPv6, yet a migration
    is being set in motion in many environments that can benefit from IPv6. For some
    applications, the old protocol is still used, for applications that have reworked
    the new version is already active. So when checking your network configuration,
    sometimes it be a bit confusing since all kinds of measures can be taken to hide
    one protocol from other so the two do not mix up connections.


    More information can be found in the following documents:


    +   * man7 ipv6: the Linux IPv6 protocol implementation.

    * RFC1883 describing the IPv6 protocol.


    # 10.1.2.3. PPP, SLIP, PLIP, PPPoE


    The Linux kernel has built-in support for PPP (Point-to-Protocol), SLIP (Serial
    Line IP), PLIP (Parallel Line IP) and PPPPP over Ethernet. PPP is the most popular
    way individual users access their ISP (Internet Service Provider), in densely
    populated areas where it is often replaced by PPPOE, the protocol used for ADSL
    (Asymmetric Digital Line) connections.


    Most Linux distributions provide easy-to-use tools for setting up an Internet
    connection. The only thing you basically need is a username and password to connect
    your Internet Service Provider (ISP), and a telephone number in the case of PPP.
    These data are entered in the graphical configuration tool, which will likely
    allow for starting and stopping the connection to your provider.


    # 10.1.2.4. ISDN


    The Linux kernel has built-in ISDN capabilities. ISDNctl controls ISDN PC cards
    and can emulate a modem with the Haydens command set ("AT" commands). The possibilities
    range from simply using a terminal program to connect to the Internet.


    Check your system documentation.


    # 10.1.2.5. AppleTalk


    Appletalk is the name of Apple''s internetworking stack. It allows a peer-to-peer
    network model which provides basic functionality as file and printer sharing.
    Each machine can simultaneously act as a client and a server, and the software
    and hardware necessary are included with every Apple computer.


    Linux provides full AppleTalk networking. Netalak is a kernel-level implementation
    of the AppleTalk Protocol Suite, originally for BSD-derived systems. It includes
    support for AppleTalk, serving UNIX AFS files using Samba and serving UNIX printers
    and accessing AppleTalk printers.


    # 10.1.2.6. SMB/NMB


    For compatibility with MS Windows environments, the Samba suite, including be
    installed on any UNIX-like system provides the NMB and SMB protocols. The Server
    Message Block (also called Session Message Block, NetBIOS or LanManager protocol)
    is used on Windows 3.11, 95/98, 2K and XP to share drives.


    The basic functions of the Samba suite are: sharing drives with Windows machines,
    accessing SMB shares from Linux machines, sharing Windows printers and sharing
    Windows printers


    Chapter 10. Networking'
