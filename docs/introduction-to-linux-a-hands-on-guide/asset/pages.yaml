    # 9.4.1.2. GNU Privacy Guard


    On systems you will use GPG, the GNU Privacy Guard, which is a suite of programs
    that are compatible with the PGP (Pretty Good Privacy) tools that are commercially
    available.


    In this guide we will discuss the very simple usage of the encryption tools and
    show you what you will need in order to generate an encryption key and to encrypt
    data for yourself, which you can then store in a public place. More advanced usage
    directions can be found in the pages of the various commands.


    # 9.4.2. Generate a key


    Before you start encrypting your data, you need to create a pair of keys. The
    pair consists of a private and public key. You can send the public key to correspondents,
    who can use it to encrypt data for you, which you decrypt with your private key.
    You always keep the private key, never share it with anybody, or they will be
    able to decrypt data that is only destined for you. Just to make sure that no
    accidents happen, the private key is protected by a password. The key you paired
    is created using this:


    ```

    willy@ubuntu:~$ gpg --key-gen

    gpg (GnuPG) 1.4.2, Copyright (C) 2005 Free Software Foundation, Inc.

    This program comes with ABSOLUTELY NO WARRANTY.

    This is free software, and you are welcome to redistribute it

