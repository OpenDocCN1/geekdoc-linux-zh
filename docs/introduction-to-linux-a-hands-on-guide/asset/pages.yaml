  md: '# Introduction to Linux


    # 10.3.7. The Domain Name System


    All these applications use DNS services to map IP addresses to host names and
    versa. A DNS server does not know all the IP addresses in the world, but with
    other servers it can query to find an unknown address. Most UNIX systems can run
    named, which is part of the BIND (Berkeley Internet Domain Name) package distributed
    by the Internet Software Consortium. It can run as a stand-alone caching nameserver,
    which is often done on Linux systems to speed up network access.


    Your main configuration file is /etc/resolv.conf, which determines the order in
    which Domain Names Servers are contacted:


    ```

    search somewhere.org

    nameserver 192.168.42.1

    nameserver 193.74.208.133

    ```


    More information can be found in the Info pages on named, in /usr/share/doc/bind/<version>
    files and on the Bind project homepage. The DNS HOWTO covers the use of BIND as
    a DNS server.


    # 10.3.8. DHCP


    DHCP is the Dynamic Host Configuration Protocol, which is gradually replacing
    old boot in larger environments. It is used to control virtual networking parameters
    as IP addresses and name servers of hosts. DHCP is backward compatible with bootp.
    For configuring the server, you will need to read the HOWTO.


    DHCP client machines will usually be configured using a GUI that enables dhcpd,
    the DHCP client daemon. Check your system documentation if you need to configure
    your machine as a DHCP client.


    # 10.3.9. Authentication services


    # 10.3.9.1. Traditional


    Traditionally, users are authenticated locally, using the information stored in
    /etc/passwd and /etc/shadow on each system. Even when using a network service
    for authenticating, the local files will always be present to configure system
    accounts for administrative use, such as the root account, the daemon accounts
    and others accounts for additional programs and purposes.


    These files are the first candidates to be examined by hackers, make sure the
    permissions and ownership are strictly set as:


    ```

    bob:~$ ls -l /etc/passwd /etc/shadow

    -rw-r--r-- 1 root root 1803 Mar 10 13:08 /etc/passwd

    -r--------r----- 1 root root 1116 Mar 10 13:08 /etc/shadow

    ```


    # 10.3.9.2. PAM


    Linux can use PAM, the Pluggable Authentication Module, a flexible method of UNIX
    authentication. Advantages of PAM:


    +   A common authentication scheme that can be used with a wide variety of applications.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Introduction to Linux


    +   • PAM can be implemented with various applications without having to recompile
    the applications to specifically support PAM.

    • Great flexibility and control over authentication for the administrator and
    application developer.

    • Application developers do not need to develop their program to a particular
    authentication scheme. Instead, they can focus purely on the details of their
    program.


    The directory /etc/pam.d contains the PAM configuration files (used to be /etc/pam.conf).
    Each application or service has its own file. Each line in the file has four elements:


    +   • auth: provides the actual authentication (perhaps asking for checking a
    password) and sets credentials, such as group membership or Kerberos tickets.

    • account: checks to make sure access is allowed for the user (the account has
    not expired, the user is allowed to log in at this time of day, and so on).

    • password: used to set passwords.

    • session: used after a user has been authenticated. This module performs additional
    tasks which are needed to allow access (for example, mounting the user''s home
    directory or their mailbox available).


    The order in which modules are stacked, so that multiple modules can be used,
    is very important.


    +   • Control flags: tell which module acts upon failure or success. Values can
    be required, sufficient or optional.

    • Module Path: path to the particular module to be used, usually in /lib/security.

    • Arguments: information for the modules


    Shadow passwords are automatically detected by PAM.


    More information can be found in the pam man pages or at the Linux-PAM project
    homepage.


    # 10.9.3. LDAP


    The Lightweight Directory Access Protocol is a client-server system for accessing
    global or local directory services over a network. On Linux, the OpenLDAP implementation
    is used. It includes slapd, a stand-alone server; slurpd, a stand-alone LDAP replication
    server; libraries implementing the LDAP protocol and services of utilities, tools
    and sample clients.


    The main benefit of LDAP is the consolidation of certain types of information
    within your organization. For example, all of the lists of users within your organization
    can be merged into one LDAP directory. This directory can be queried by any LDAP-enabled
    applications that need that information. It can be accessed by users who need
    that directory information.


    Other LDAP or X.500 Lite benefits include its ease of implementation (compared
    to X.500) and its well-defined Application Programming Interface (API), which
    means that the number of LDAP-enabled applications and LDAP gateways would increase
    in the future.


    On the negative side, if you want to use LDAP, you will need LDAP-enabled applications
    or the ability to use LDAP gateways. While LDAP usage should only increase, there
    are currently not many LDAP-enabled applications available for Linux. Also, while
    LDAP does support access control, it does not possess as many features as X.500.


    Chapter 10. Networking'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Introduction to Linux


    Since LDAP is an open and configurable protocol, it can be used to store almost
    any type of information relating to a particular organizational structure. Common
    examples are mail address lookups, central authentication in combination with
    PAM, telephone directories and configuration databases.


    See your system information and the man pages for commands such as ldapmodify
    and ldsearch for details. More information can be found in the LDAP Linux HOWTO,
    which discusses installation, configuration, running and maintenance of an LDAP
    server. The author of this Introduction to Linux document also wrote an LDAP Operations
    HOWTO, describing the basics everyone should know when dealing with LDAP management,
    operations and integration of services.


    # 10.4. Remote execution of applications


    # 10.4.1. Introduction


    There are a couple of ways to execute commands or run programs on a remote machine
    and have the output, it be text or graphics, sent to your workstation. The connections
    can be secure or insecure. While it is advised to use secure connections instead
    of transporting your password over the network unencrypted, we will discuss some
    practical applications of the (unsafe) mechanisms, as they are still useful in
    a modern networked environment, such as for troubleshooting or running exotic
    programs.


    # 10.4.2. Rsh, login and telnet


    The login and rsh commands for remote login and remote execution of commands are
    inherited from UNIX. While seldom used today because they are blatantly insecure,
    they still come with almost every Linux distribution for backward compatibility
    with UNIX programs.


    Telnet, on the other hand, is still commonly used, by system and network administrators.
    Telnet is one of the most powerful tools for remote access to files and remote
    administration, allowing connections anywhere on the Internet. Combined with an
    X server, remote graphical applications can be displayed locally. There is no
    difference between working on the local machine and using the remote machine.


    Because the connection is unencrypted, allowing telnet connections involves high
    security risks. For normal remote execution of programs, Secure Shell or ssh is
    advised. We will discuss the secure method in this section.


    However, telnet is still used in many cases. Below are some examples in which
    a mail server and a web server are tested for replies:


    Checking that a mail server serves:


