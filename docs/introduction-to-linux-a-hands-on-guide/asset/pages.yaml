  md: '# Chapter 7. Home sweet /home


    This chapter is about configuring your environment. Now that we know how to use
    an editor, we can change all kinds of files to make ourselves feel better at home.
    After completing this chapter, you will know more about:


    +   * Organizing your environment

    * Common setup files

    * Shell configuration

    * Configuring the prompt

    * Configuring the graphical environment

    * Sound and video applications

    * Display and window managers

    * How the X client-server system works

    * Language and font settings

    * Installing new software

    * Updating existing packages


    # 7.1. General good housekeeping


    # 7.1.1. Introduction


    As we mentioned before, it is easy enough to make a mess of the system. We can''t
    put enough stress on the importance of keeping the place tidy. When you learn
    this from the start, it will become a good habit that will save time when you
    are programming on a Linux or UNIX system or when confronted with system management
    tasks. Here are some ways of making life easier on yourself:


    +   * Make a bin directory for your program files and scripts.

    * Organize non-executable files in appropriate directories, and make as many directories
    as you like. Examples include separate directories for images, projects, downloaded
    files, spreadsheets, personal files, and so on.

    * Make directories private with the `chmod 700 dirname` command.

    * Give your files sensible names, such as `Complaint` to the prime minister 050302
    rather than `letter`.


    # 7.1.2. Make space


    On some systems, the `quota` system may force you to clean up from time to time,
    or the physical limits of your hard disk may force you to make more space without
    running any monitoring programs. This section discusses a number of ways, using
    the `rm` command, to reclaim disk space.


    Run the `quota -v` command to see how much space is left.'
