  md: '# Introduction to Linux


    # 9.2.3. Backups on/from jazz drives, USB devices and other removables


    These devices are usually mounted into the file system. After the mount procedure,
    they are accessed as normal directories, so you can use the standard commands
    for manipulating files.


    In the example below, images are copied from a USB camera to the hard disk:


    ```

    robin-> mount /mnt/camera

    robin-> mount | grep camera

    /dev/sda on /mnt/camera type vfat (rw,nosuid,nodev)

    ```


    If the camera is the only USB device that you connect to your system, this is
    safe. But keep in mind that USB devices are assigned entries in /dev as they are
    connected to the system. If you connect a USB stick to your system, it will be
    on the /dev/sda entry, and if you connect your camera after, it will be on /dev/sdb
    - provided that you do not have SCSI disks, which are also on /dev/sd*. On newer
    systems, since kernel 2.6, a hotplug system called HAL (Hardware Abstraction Layer)
    ensures that users do not have to deal with this burden. If you want to check
    where your device is, type dmesg after inserting it.


    You now copy the files:


    ```

    robin-> cp -R /mnt/camera* images/

    robin-> umount /mnt/camera

    ```


    Likewise, a jazz drive may be mounted in /etc/modules.conf and /etc/fstab to make
    this work. Refer to specific hardware HOWTOs for more information. On systems
    with a 2.6.kernel or higher, you may also want to check the man pages for modprobe
    and modprobe.conf.


    # 9.2.4. Backing up using a tape device


    This done using tar (see above). The mt tool is for controlling the magnetic tape
    device, like /dev/st0. Entire books have been written after backup tape, procedure,
    refer to your reading-list in Appendix B for more information. Keep in mind that
    databases might need other backup procedures because of their architecture.


    The appropriate backup commands are usually put in the cron entries in order to
    have them executed on a regular basis. In larger environments, the freely available
    Amanda backup suite or commercial solution may be implemented to back up multiple
    machines. Working with tapes, however, is a system administration task beyond
    the scope of this document.


    # 9.2.5. Tools from your distribution


    Most Linux distributions offer their own tools for making your life easy. A short
    overview:


    +   * SuSE: YaST now includes expanded backup and restore modules.

    * RedHat: The File Roller provides visual management of (compressed) archives.
    They seem to be in favour of the X-CD-Roast for making backups to an external
    device.

    * Mandrake: X-CD-Roast.


