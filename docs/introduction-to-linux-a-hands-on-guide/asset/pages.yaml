  md: '# Introduction to Linux


    # 10.3. Internet/Intranet applications


    The Linux system is a great platform for offering networking services. In this
    section, we will try to give an overview of most common network servers and applications.


    # 10.3.1. Server types


    # 10.3.1.1. Standalone server


    Offering a service to users can be approached in two ways. A daemon or service
    can run in standalone mode, or it can be dependent on another service to be activated.


    Network services that are heavily and/or continuously used, usually run in the
    standalone mode: they are independent daemons that are always running. They are
    most likely started up at system boot time, and wait for requests on the specific
    connection points or ports for which they are set up to listen. When a request
    comes, it is processed, and the listening continues until the next request. A
    web server is a typical example: you want it to be available 24 hours a day, if
    it is busy it should create more instances to handle simultaneous users. Other
    examples are the large software archives such as Sourceforge or your Tucillos
    mirror,


    An example of a standalone network service on your home computer might be the
    **named** daemon), a caching server. Services have their own processes running,
    you can check any time using ps:


    ```

    bob:-> ps auxw | grep named

    named 928 0.0 1 0 14876 508 S S Mar14 0:07 -u named

    ```


    However, there are some services that you can use on your PC, even if there is
    no server running for services. Examples could be the FTP service, the secure
    copy service or the finger service. Those services have the Internet Daemon (**inetd**)
    listening in their place.


    # 10.3.1.2. (xinetd)


    On your home PC, things are a bit calmer. You may have a small network, for instance,
    and you may have to transfer files from one PC to another by time, using FTP or
    Samba (for connectivity with MS Windows machines). In those cases, starting all
    the services you only need occasionally and having them run all the time would
    be a waste of resources. In smaller setups, you will find the necessary daemons
    on a central parent, which listens on all of the services for which it is responsible.


    This super-service, Internet services, is started at system initialization time.
    There are two common implementations: **inetd** and **xinetd** (the extended Internet
    services daemon). One or the other is usually running on Linux system:


    ```

    bob:-> ps -ef | grep inet

    root 926 1 0 Mar14 7 00:00:00 xinetd-ipv6 -stayalive -reuse \\

    -pidfile=/var/run/xinetd.pid

    ```


    The services for which the Internet daemon is responsible, are listed in its configuration
    file, /etc/inetd.conf, for inetd, and in the directory /etc/xinetd.d/ for xinetd.
    Commonly managed services include file share and print services, SSH, FTP, telnet,
    the Samba configuration daemon, talk and time services.'
