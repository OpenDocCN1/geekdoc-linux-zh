    Output of one command can be piped into another command virtually as many times
    as you want, just long as these commands would normally read input from standard
    input and write output to the standard output. Sometimes they don''t, then there
    may be special options that instruct these commands to behave according to the
    standard definitions; so read the documentation (man and Info pages) of the commands
    you use if should encounter errors.


    Again, make sure you don''t use names of existing files that you still need. Redirecting
    output to existing files will replace the content of those files.


