  md: '# Introduction to Linux


    While it is reasonably safe to suppose that everything you encounter on a Linux
    system is a file, there are some exceptions.


    +   * **Directories**: files that are lists of other files.

    * **Special files**: the mechanism used for input and output. Most special files
    are in `/dev`, we will discuss them later.

    * **Links**: a system to make a file or directory visible in multiple parts of
    the system''s file tree. We will talk about links in detail.

    * **(Domain)**: a special file, similar to TCP/IP sockets, providing inter-process
    networking protected by the file''s access control.

    * **Named pipes**: a file that works more like sockets, and both a way for processes
    to communicate with each other, without using network semantics.


    The `-l` option to `ls` displays the file type, using the first character of each
    input line:


    ```

    jaime:~/Documents ls -l

    total 80

    -rw-rw-r-- 1 jaime jaime 31744 Feb 21 17:56 intro Linux.doc

    -rw-rw-r-- 1 jaime jaime 41472 Feb 21 17:56 Linux.doc

    drwxr-xr-x 2 jaime jaime 4096 Feb 25 11:50 course

    ```


    This table-1 gives an overview of the characters determining the file type: `"*?@@`


    | Symbol | Meaning |

    |---|---|n| - | Regular file |

    | d | Directory |

    | l | Link |

    | c | Special file |

    | s | Socket |

    | p | Named pipe |

    | b | Block device |


    In order not to have to perform a long listing for the file type, `"*?@@` by default
    doesn''t issue it, but `-F`, which suffixes file names with one of the characters
    to indicate the file type. To make it extra easy for the beginner, on user, both
    the `-F` and `--color` options are usually combined, see Section 3.3.1.1: We will
    use `-F` throughout this document for better readability.


    As a user, you only need to deal directly with plain files, executable files,
    directories and links. The special file types are there for making your system
    do what you demand from it and are left with system administrators and programmers.


    Now, before we look at the important files and directories, we need to know more
    about partitions.


