  md: '# Introduction to Linux


    We will, however, a closer look at the underlying system.


    # 7.3.2. The X Window System


    The X Window System is a network-transparent window system which runs on a wide
    range of computing and graphics machines. X Window servers run on computers with
    bitmap displays. The X server distribute user input to and accept outputs from
    several clients through a variety of different interprocess communication channels.
    Although the most common case is for the clients to be running on the same machine
    as the server, clients can run transparently from other machines (including different
    architectures and operating systems) as well. We will learn how to do this in
    Chapter 10 on networking and remote applications.


    X supports hierarchical sub-windows and text and graphics operations, on both
    monochrome and color displays. The number of client programs that use the X server
    is quite large. Some of the programs provided in the core X Consortium distribution
    include:


    +   * xterm: a terminal emulator

    * twm: a minimalistic window manager

    * xdm: a display manager

    * xconsole: a console redirect program

    * bitmap: a bitmap editor

    * xauth, xhost and iceauth: access control programs

    * xet, xmod and many others: user preference settings

    * xclock: a clock

    * xfonts and others: a font display, utilities for listing information about fonts,
    windows and displays

    * xfs: a font server

    * ...


    We refer to the main pages of these commands for detailed information. More explanations
    on available functions can be found in the Xlib - C language X Interface manual
    that comes with your X distribution, the Window System Protocol specification,
    and the various manuals and documentation of X Toolkits. The /usr/share/doc references
    to these documents and many others.


    Many others, window managers, games, toolkits and gadgets are included as user-controlled
    software in the X Consortium, or are available via anonymous FTP on the Internet.
    Places to start are http://www.x.org and http://www.xfree.org.


    Furthermore, all graphical applications, such as yours, the E-mail program, your
    image viewing programs, playing tools and so on, are all clients to your X server.
    Note that in normal operation, that is in graphical mode, the clients and the
    X server run on Linux on the same machine.


    # 7.3.2.1. Display names


    From the user''s perspective, every X server has a display name in the form of:


    ```

    hostname:displayname.screennumber

    ```


    This information is used by the application to determine how it should connect
    to the X server and which screen it should show by default (on displays with multiple
    monitors):


