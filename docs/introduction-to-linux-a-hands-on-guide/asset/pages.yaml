    # 4.2.5. Init run levels


    The idea behind operating different systems at different run levels essentially
    revolves the fact that different systems can be used in different ways. Some services
    cannot be used until the system is in a particular state, or mode, as being ready
    for more than one user or having networking available.


    There are times in which you may want to operate the system in a lower mode. Examples
    are disk corruption problems in run level 1 so no other users can possibly be
    on the system, or leaving a server in run level 3 without an X session running.
    In these cases, running services that depend upon a higher system to function
    not make sense because they will not work anyway. By having each service assigned
    to when its particular run level is reached, you ensure an early startup, and
    you can quickly change the mode of the machine without worrying which services
    to start or stop.


    Available run levels are generally described in /etc/inittab, which is partially
    shown below:


    ```

    # inittab      This file describes the INIT process should be set up

    #               the system in a certain run-level.


    # Default run level. The run levels are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiser, without NFS

    #    (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X1

    # 6 - reboot (Do Not set initdefault to this)

    id5:initdefault:

    <-->

    ```


    Feel free to configure unused run levels (commonly run level 4) as you see it.
    Many users configure run levels in a way that makes the most sense for them while
    leaving the run levels as they are default. This allows them to move in and out
    of their custom configuration without disturbing the normal set of features at
    the standard run levels.


    If your machine gets into a state where it will not boot due a bad /etc/inittab
    or will not log you in because you have a corrupted /etc/passwd file (or if you
    simply forgotten your password), boot into single-user mode.


