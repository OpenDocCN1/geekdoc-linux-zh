    # 10.2.3.3. PCMCIA commands


    On your laptop which you usually connect to the company network using the onboard
    Ethernet connection, but which you are now to configure for dial-in or at home
    in a hotel, you might need to activate the PCMCIA card. This is done using the
    cardctl utility, or the pcardctl on newer distributions.


    A usage example:


    ```

    cardctl insert

    ```


    Now the card can be configured, using the graphical or the command line interface.
    Prior to taking the card, use this command:


    ```

    cardctl eject

    ```


    However, a good distribution should provide PCMCIA support in the network configuration
    tools, preventing users from having to execute PCMCIA commands manually.


    # 10.2.3.4. More information


    Further discussion of network configuration is out of the scope of this document.
    Your primary source for extra information is the pages you manage to set up. Additional
    reading:


    +   - The Modem-HOWTO: Help with selecting, connecting, configuring, trouble-shooting,
    and understanding analog modems for a PC.

    - LDP Index, section 4.4: categorized list of HOWTOs about general networking,
    protocols, dial-up, DNS, VPNs, routing, security and more.

    - Most systems have a version of the ip-cref file (locate it using the locate
    command); the PS format of this file is viewable with instance g.


    # 10.2.4. Network interface names


    On a Linux machine, the device name lo or the local loop is linked with the internal
    127.0.0.1 address. The computer will have a hard time making your applications
    work if this device is not present; it is always, even on computers which are
    not networked.'
