  md: '# 10.4.5. VNC


    VNC or Virtual Network Computing is in fact a remote display system which allows
    viewing a desktop environment not only on the local machine on which it is running,
    but anywhere on the Internet and from a wide variety of machines and architectures,
    including MS Windows and several UNIX distributions. You could, for example, run
    MS on a Windows NT machine and display the output on your Linux desktop. VNC provides
    servers as well as clients, so the opposite also works and it may be used to display
    Linux programs on Windows. VNC is probably the easiest way to have X connections
    on a PC. The following features make VNC different from a normal X server or commercial
    implementations:


    +   * No state is at the wider side: you can leave your desk and run from another
    machine, continuing where you left. When you are running a X server, and the crashes
    or is restarted, remote applications that you were running will die. With VNC,
    they keep running.

    * It is small and no installation needed, can be run from a floppy needed.

    * Platform independent with the Java client, runs on everything that supports
    X.

    * Sharable: one desktop may be displayed on multiple viewers.

    * Free.


    More information can be found in the VNC client pages (**man vncviewer**) or on
    the VNC website.


    # 10.4.6. The rdesktop protocol


    In order to ease management of MS Windows hosts, most Linux distributions support
    the Remote Desktop Protocol (RDP), which is implemented in the **rdesktop** client.
    The protocol is used in number of Microsoft products, including Windows Terminal
    Server, Windows 2000 Server, Windows XP and Windows 2003 Server.


    Surprise your friends (or management) with the fullscreen mode, multiple types
    of keyboard layouts and single application mode, just like the real thing. The
    **man rdesktop** manual provides more information. The project''s homepage is
    at http://www.rdesktop.org/


    # 10.4.7. Cygwin


    Cygwin provides substantial UNIX functionality on MS Windows systems. Apart from
    providing command line tools and graphical applications, it can also be used to
    display a desktop on an MS Windows machine, using X. From Cygwin bash, type the
    command


    ```

    /usr/X11R6/bin/Xwin.exe -query_linux_machine_name_or_IP

    ```


    The connection is by default. You need to change the X Display Manager (XDM) configuration
    and possibly the X Font Server (XFS) configuration to enable this type of connection,
    where you get a login screen on the machine. Depending on your desktop manager
    (Gnome, KDE, other), you might have to change some configurations there, too.


    If you do not need to display the entire desktop, you can use SSH in Cygwin, just
    like explained in Section 10.4.4, without the fuss of editing configuration files.'
