  md: '# Chapter 6. Text editors


    In this chapter, we will discuss the importance of mastering an editor. We will
    focus mainly on the Improved vi editor.


    After finishing this chapter, you will be able to:


    +   * Open and close files in text mode

    * Edit files

    * Search text

    * Undo errors

    * Merge files

    * Recover lost files

    * Find a program or suite for office use


    # 6.1. Text editors


    # 6.1.1. Why should I use an editor?


    It is very important to be able to use at least one text mode editor. Knowing
    how to use an editor on your system is the first step to independence.


    We will need to master an editor by the next chapter as we need it to edit files
    that influence our environment. As an advanced user, you may want to start writing
    scripts, books, develop websites or new programs. Mastering an editor will immensely
    improve your productivity as well as your capabilities.


    # 6.1.2. Which editor should I use?


    Our focus is on text editors, which can also be used on systems without a graphical
    interface and in terminal windows. The additional advantage of mastering a text
    editor is using it on remote machines. Since you don''t need to transfer the entire
    graphical environment over the network, working with text editors tremendously
    improves network speed.


    There are, as usual, multiple ways to handle the problem. Let''s see what editors
    are commonly available:


    # 6.1.2.1. GNU Emacs


    Emacs is the extensible, customizable, self-documenting, real-time display editor,
    known on many UNIX and other systems. The text editing is visible on the screen
    and is updated automatically as you type your commands. It is a real-time editor
    because the display is updated frequently, usually after each character or pair
    of characters you type. This minimizes the amount of information you must keep
    in your head as you edit. Emacs is called advanced because it provides facilities
    that go beyond simple insertion and deletion: controlling subprocesses; automatic
    indentation of programs; viewing two or more files at once; formatted text; and
    dealing in terms of characters, words, lines, sentences, paragraphs, and pages,
    as well as expressions and comments in several different programming languages.


    Self-documenting means that at any time you can type a special character, Ctrl+H,
    to find out what'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Introduction to Linux


    options. You can also use it to find out what command does, or to find all the
    commands that pertain to a topic. Customizable means that you can change the definitions
    of Emacs in little ways. For example, if you use a programming language to start
    with "***" and end with "***", you can tell the Emacs comment manipulation to
    use these strings. Another sort of customization is rearrangement of the command
    system. For example, if you prefer four basic cursor motions (up, down, left and
    right) on keys in a diamond pattern on the keyboard, you can rebind the keys that
    want.


    Extensible means that you can go beyond simple customization and write entirely
    new commands, programs in the Lisp language that are run by Emacs''s interpreter.
    Emacs is an extensible system, which means it is divided into many functions that
    call each other, any of which can be redefined in the middle of an editing session.
    Almost any part of Emacs can be replaced without making a separate copy of all.
    Most of the commands of Emacs are written in Lisp already; the few exceptions
    could have been written in Lisp but are written in C for efficiency. Although
    only a programmer can write an extension, anyone can use it afterward.


    When you run the Window System (started as emacs) Emacs provides its own menus
    and convenient bindings to mouse. But Emacs can provide many of the benefits of
    a window system on a text-only terminal. For instance, you can look at or edit
    several files at once, move text between files, and edit files while running shell
    commands.


    # 6.1.2.2. Vi(m)


    Vim stands for " Improved". It used to be "Vi Imitation", but there are so many
    improvements that a name change was appropriate. Vim is a text editor which includes
    all the commands from the UNIX program vi and lot of new ones.


    Commands in vi are entered using only the keyboard, which has the advantage that
    you can use your fingers on the keyboard and your eyes on the screen, rather than
    moving your arm repeatedly to the mouse. For those who want it, mouse support
    and a GUI version with scrollbars can be activated.


    We will refer to vim throughout this book for editing files, while you are free
    to use the editor of your choice. However we recommend to get the basics in the
    fingers, because it is the standard text editor on all UNIX systems, while emacs
    is an optional package. There may be small differences between different computers
    and terminals, but the main point is that if you work with vi, you can survive
    on any UNIX system.


    Apart from the vim command, the vim packages also include gvim, the Gnome version
    of vim. Beginning users might find this easier to use, because the menus offer
    help when you forget or don''t know how to perform a particular editing task using
    the standard vim commands.


    # 6.2. Using the Vim editor


    # 6.2.1. Two modes


    The vi editor is a powerful tool and has very extensive built-in manual, which
    you can activate using the help command when the program is started (instead of
    using man or info, which do not contain nearly as much information). We will only
