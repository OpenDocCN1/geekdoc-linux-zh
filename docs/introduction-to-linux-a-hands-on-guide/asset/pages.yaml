  md: '# Introduction to Linux


    connection.


    The Shoreline Firewall or Shorewall for short is a front-end for the standard
    firewall functionality in Linux.


    More information can be found at the Netfilter/iptables project page.


    # 10.5.4.3. TCP wrappers


    TCP wrapping provides much the same results as the packet filters, but works differently.
    The wrapper actually accepts the connection attempt, then examines configuration
    files and decides whether to accept or reject the connection request. It controls
    connections at the application level rather than the network level.


    TCP wrappers are typically used with xinetd to provide host and IP-address-based
    access control. In addition, these tools contain logging and utilization management
    capabilities that are easy to configure.


    The advantages of TCP wrappers are that the connecting client is unaware that
    wrappers are used, and that they operate separately from the applications they
    protect.


    The host based access is controlled in the hosts.allow and hosts.deny files. More
    information can be found in the TCP wrapper documentation files in /usr/share/doc/tcp_wrappers[--version/]
    or /usr/share/doc/tcp and in the man pages for the host based access controls,
    which contain examples.


    # 10.5.4.4. Proxies


    Proxies perform various duties, not all of which have much to do with security.
    The fact that they are an intermediary makes proxies enforce access controls,
    limit direct connections through a firewall, and control how the network behind
    proxies to the internet.


    Usually in combination with a packet filter, but sometimes by themselves, proxies
    provide an extra level of control. More information can be found in the Firewall
    HOWTO on the Squid website.


    # 10.5.4.5. Access to individual applications


    Some servers may have their own access control features. Common examples include
    Samba, X Window, Bind, Apache and CUPS. For every service you want to check which
    configuration files apply.


    # 10.5.4.6. Log files


    If anything, the UNIX way of logging all of activities into all kinds of files
    confirms that "it is doing something." Of course, log files should be checked
    regularly, manually or automatically. Firewalls and other means of access control
    tend to create huge amounts of log files, so the trick is to try and only log
    abnormal activities.


    # 10.5.5. Intrusion detection


    Intrusion Detection Systems are designed to catch what might have gone past the
    firewall. They can either be designed to catch an active break-in attempt in progress,
    or to detect a successful break-in after the fact. In the latter case, it is too
    late to prevent damage, but at least we have early awareness of a problem. There
    are two types of IDS: those protecting networks, and those protecting individual
    hosts.


    Chapter 10. Networking'
