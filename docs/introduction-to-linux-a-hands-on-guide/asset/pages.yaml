  md: '# 7.1.2.3. Mail


    Regularly clean out your mailbox, make sub-folders and automatic redirects using
    **procmail** (see the Info pages) or the filters of your favorite mail reading
    application. If you have a trash folder, clean it out on a regular basis.


    To redirect mail, use the .forward file in your home directory. The Linux mail
    service looks for this file whenever it has to deliver mail. The content of the
    file defines what the mail system should do with your mail. It can contain a single
    line holding a fully qualified E-mail address. In that case the system will send
    all your mail to this address. For instance, when renting space for a website,
    you might want to forward the mail destined for the webmaster to your own account
    in order not to waste disk space. The webmaster''s .forward may look like this:


    ```

    webmaster@www ~> cat .forward mike@pandora.be

    ```


    Using mail forwarding is also useful to prevent yourself from having to check
    several different mailboxes. You can make every entry point to a central and easily
    accessible account.


    You can ask your system administrator to define a forward for you in the local
    mail aliases file, like when an account is being closed but E-mail remains active
    for a while.


    # 7.1.2.4. Save space with a link


    When users need access to the same file or program, when the original file name
    is too long or difficult to remember, use a symbolic link instead of a separate
    copy for each user or purpose.


    Multiple symbolic links may have different names, e.g. a link may be called monfichier
    in one user''s directory, and mylink in another. Multiple links (different names)
    to the same file may also occur in the same directory. This is often done in the
    /lib directory: when issuing the command


    ```

    ls -1 /lib

    ```


    you will see that this directory is plenty of links pointing to the same files.
    These are created so that programs searching for one name would not get stuck,
    so are pointed to the correct/current name of the libraries they need.


    # 7.1.2.5. Limit file size


    The shell contains a built-in command to limit file sizes, ulimit, which can also
    be used to display limitations on system resources:


    ```

    cindy-> ulimit -a 0

    core file size (blocks) unlimited

    data size (kbytes) unlimited

    file size (blocks) unlimited

    max memory (kbytes) unlimited

    max memory size (kbytes) unlimited

    open files 1024

    pipe size (512 bytes) 8

    stack size (kbytes) 8192

    cpu time (seconds) unlimited

    max user processes 512

    virtual memory (kbytes) unlimited

    ```


