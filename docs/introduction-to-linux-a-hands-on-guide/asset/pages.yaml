    # 3.3.5.2. Creating symbolic links


    The symbolic link is particularly interesting for beginners users: they are fairly
    obvious to see and you don''t need to worry about partitions.


    The command to make links is **ln**. In order to create symlinks, you need to
    use the `-s` option:


    ```

    ln -s targetfile link

    ```


    In the example below, *freddy* creates a link in a subdirectory of his home directory
    to a directory on another part of the system:


    ```

    freddy:~/music$ ln -s /opt/mp3/Queen/ Queen

    freddy:~/music$ ls -l

    lrwxwxrw 1 freddy freddy 17 Jan 22 11:07 -> /opt/mp3/Queen

    ```


    Symbolic links are very small files, while hard links have the same size as the
    original file.


    The application of symbolic links is widely spread. They are often used to save
    disk space, to make a copy of a file in order to satisfy installation requirements
    of a new program that expects the file to be in another location, they are used
    for scripts that need to run in a new environment and can generally save a lot
    of work. A admin may decide to move the home directories of the users to a new
    location, `disk2` for instance, but if he wants to work like before, the `/etc/passwd`
    file, with a minimum of effort he will create a symlink from `/home` to the new
    location `/disk2/home`.


    # 3.4. File security


    # 3.4.1. Access rights: Linux''s first line of defense


    The Linux security is based on the used Unix systems, and is as rigid as the UNIX
    security model (and sometimes ever), every file is owned by a user and a group
    user. There is also a third category of users, those that are not the user owner
    and don''t belong to the group owning the file. For each category of users, read,
    write and execute permissions can be granted or denied.


    We already used the `long` option to list files using the `-l` command, for though
    other reasons. This command also displays permissions for these three user categories;
    they are indicated by the nine characters that follow the first character, which
    is the file type at the beginning of the file properties'
