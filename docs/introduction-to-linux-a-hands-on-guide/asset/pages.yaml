  md: '# Introduction to Linux


    Many other distributions support RPM packages, among the popular ones RedHat Enterprise
    Linux, Mandriva (former Mandrake), Fedora Core and SuSE Linux. Apart from the
    advice for your distribution, you will want to read rpm.


    # 7.5.2.1.2. RPM examples


    Most packages are simply installed with the upgrade option, -U, whether the package
    is already installed or not. The RPM package contains a complete version of the
    program, which overwrites existing versions or installs as a new package. The
    typical usage is:


    ```

    rpm -Uvh /path/to/rpm-package (s)

    ```


    The -v option generates more verbose output, and -h makes rpm print a progress
    bar:


    ```

    [@jupiter tmp]# -rpm -Uvh totem-0.99.5-1.fr.i386.rpm [100%]

    Preparing...

    ########################################### [100%]

    1:totem

    ########################################### [100%]

    [@jupiter tmp]#

    ```


    Kernel packages, however, are installed with the install option -i, which does
    not overwrite existing version of the package. That, you will be able to boot
    your system with the old kernel if the one does not work.


    You can also use rpm to check whether a package is installed on your system:


    ```

    [davidjupiter -] rpm -qa | grep vim

    vim-minimal-6.1-29

    vim-X11-6.1-29

    vim-enhanced-6.1-29

    ```


    Or you can find out which package contains a certain file or executable:


    ```

    [davidjupiter -] rpm -qf /etc/profile

    setup-2.5.25-1

    [@davidjupiter -] which cat

    cat is /bin/cat

    [@davidjupiter -] rpm -qf /bin/cat

    coreutils-4.5.3-19

    ```


    Note that you will need to have administrative privileges in order to use rpm
    to query the RPM database. You only need to be root when installing, modifying
    or deleting packages.


    Below is one last example, demonstrating how to uninstall a package using rpm:


    ```

    [@root root]# rpm -e totem

    [@root root]#

    ```


    Note that uninstalling is not verbose by default, it is normal that you don''t
    see much happening. In doubt, use rpm -qa again to verify that the package has
    been removed.


    RPM can do much more than the couple of basic functions we discussed in this introduction;
    the RPM HOW contains further references.'
