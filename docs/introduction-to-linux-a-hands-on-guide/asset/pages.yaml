  md: '# Chapter 10. Networking


    When it comes to networking, Linux is your operating system of choice, not only
    because networking is tightly integrated with the OS itself and a wide variety
    of free tools and applications are available, but for the robustness under heavy
    loads that can only be achieved after years of debugging and testing in an Open
    Source project.


    Bookshelves full of information have been written about Linux and networking,
    but we will try to give an overview in this chapter. After completing this, you
    will know more about


    +   ◆ Supported networking protocols

    ◆ Network configuration files

    ◆ Commands for configuring and probing the network

    ◆ Daemons and client programs enabling different network applications

    ◆ File sharing and printing

    ◆ Remote execution of commands and applications

    ◆ Basic network intersection

    ◆ Secure execution of remote applications

    ◆ Firewalls and intrusion detection


    # 10.1. Networking Overview


    # 10.1.1. The OSI Model


    A protocol is, simply put, a set of rules for communication.


    In order to get data over the network, for instance an E-mail from your computer
    to some computer at the other end of the world, lots of different hardware- and
    software needs to work together.


    All these pieces of hardware and the different programs speak different languages.
    Imagine your E-mail program: it is able to talk to the computer operating system,
    through a specific protocol, but it is not able to talk to the computer hardware.
    We need a special program in the operating system that performs this function.
    In turn, the computer needs to be able to communicate with the telephone line
    or Internet hookup method. Behind the scenes, network connection hardware needs
    well to be able to communicate in order to pass your E-mail from one appliance
    to the other, all the way to the destination computer.


    All these different types of communication protocols are classified in 7 layers,
    which are known as the Open Interconnection Reference Model, the OSI Model for
    short. For easy understanding, this model is reduced to a 4-layer protocol description,
    as described in the table below:


    Table 10-1. The simplified OSI Model


    | Layer name | Layer Protocols |

    |---|-|

    | Application layer | HTTP, DNS, SMTP, POP, ... |

    | Transport layer | TCP, UDP |

    | Network layer | IP, IPv6 |


    Chapter 10. Networking


    157'
  merge: -1
