    unresponsiveness of the system.


    While a process runs in the background, however, the user is not prevented from
    doing other things in the terminal in which he started the program, while it is
    running.


    The shell offers a feature called job control which allows easy handling of multiple
    processes. This mechanism switches processes between the foreground and the background.
    Using this system, programs can also be started in the background immediately.


    Running a process in the background is only useful for programs that do not need
    user input (via the shell). Putting a job in the background is typically done
    when execution of a job is expected to take a long time. In order to free the
    issuing terminal after entering the command, a trailing ampersand is added. In
    the example using graphical mode, we open an extra terminal window from the existing:


    ```

    billy:-> xterm &

    [1] 26558

    billy:-> jobs

    []+ Running xterm &

    ```


    # Table 4-1. Controlling processes


    | (part of) command | Meaning |

    | regular_command | Runs this command in the foreground. |

    | command & | Run this command in the background (release the terminal) |

    | jobs | Show commands running in the background. |

    | Ctrl+Z | Suspend (stop, but not quit) a process running in the foreground (suspend).
    |

    | Ctrl+C | Interrupt (terminate and quit) a process running in the foreground.
    |

    | $n | Every process running in the background gets a number assigned to it. By
    using the % expression a job can be referred to using the issuing shell, for instance
    fg $2. |

    | bg | Reactivate a suspended process in the background. |

    | fg | Put the job in the foreground. |

    | kill | End a process (also see Builtin Commands in the Info pages of bash) |


    The full job control features are explained in detail in the bash Info pages,
