  md: '# Introduction to Linux


    snapshot-200301221: ASCII text

    The next day, jimmy works on file3 a bit more, and creates file4. At the end of
    the day, he makes a new backup:


    ```

    jimmy:-> tar cvpf work-20030122.tar -g snapshot-20030121 work/

    work/

    work/file3

    work/file4

    ```


    These are very simple examples, but you could also use this kind of command in
    a cron job (Section 4.4), which specifies for instance a snapshot file for the
    weekly backup and one for the daily backup. Snapshot files should be replaced
    when taking backups, in that case.


    More information can be found in the tar documentation.


    # The real stuff


    As you could plainly notice, tar is OK when we are talking about a simple directory,
    a set of files that belongs together. There are tools that are easier to manage,
    however, when you want to archive entire partitions or disks or larger projects.
    We just explain that tar here it is a very popular tool for distributing archives.
    It will happen often that you need to install a software that comes in a so-called
    “compressed tarball!” Section 9.3 for an easier way to perform regular backups.


    # 9.1.1.3. Compressing and unpacking with gzip or bzip2


    Data, including tarballs, can be compressed using zip tools. The gzip command
    will add the suffix .gz to the file and remove the original file.


    ```

    jimmy:-> ls -la | grep tar

    -rw-r--r-- 1 jimmy 61440 Jun 6 14:08 images-without-dir.tar

    jimmy:-> gzip images-without-dir.tar.gz

    jimmy:-> ls -la images-without-dir.tar.gz

    -rw-r--r-- 1 jimmy 50562 Jun 6 14:08 images-without-dir.tar.gz

    ```


    Uncompressed zipped files with the -d option.

    bzip2 works in a similar way, but uses an improved compression algorithm, thus
    creating smaller files. See the bzip2 pages for more.


    Linux software packages are often distributed in a gzipped tarball. The sensible
    thing to do after unpacking that of kind is to find the README and read it. It
    will generally contain guidelines to installing the package.


    The tar command is aware of gzip files. Use the command


    ```

    tar zxvf file.tar.gz

    ```


    for unzipping and untaring .tar.gz or .tgz files. Use


    ```

    tar jxvf file.tar.bz2

    ```


    for unpacking tar archives that were compressed with bzip2.


