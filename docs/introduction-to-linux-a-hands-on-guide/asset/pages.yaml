  md: '# Introduction to Linux


    the first ethernet device, *eth0* in the case of a standard network interface
    card, points to your local LAN IP address. Normal client machines have only one
    network interface card. Routers, connecting networks together, have one network
    device for each network they serve.


    If you use a modem to connect to the Internet, your network device will probably
    be named *ppp0*.


    There are many names, for Virtual Private Network interfaces (VPNs), and multiple
    interfaces can be active simultaneously, that the output of the *ifconfig* or
    *ip* commands might become quite extensive when no options are used. Even multiple
    interfaces of the same type can be active. In that case, they are numbered sequentially:
    the first will get the number 0, the second will get a suffix of 1, the third
    will get 2, and so on. This is the case on many application servers, on machines
    which have a failover configuration, and routers, gateways and many more.


    # 10.2.5. Checking the host configuration with netstat


    Apart from the *ip* command for displaying the network configuration, there''s
    the common *netstat* command which has a lot of options and is generally useful
    on any UNIX system.


    Routing can be displayed with the *-nr* option to the *netstat* command:


    ```

    bob> netstat -nr

    Kernel IP table

    Destination Gateway Genmask MSS Window Irtt Iface

    192.168.42.0 0.0.0.0 255.255.255.0 U 40 0 eth0

    127.0.0.0 0.0.0.0 255.0.0.0 U 40 0 lo

    0.0.0.0 192.168.42.1 0.0.0.0 UG 40 0 eth0

    ```


    This is a typical client routing table in an IP network. It has only one network
    device, *eth0*. The interface is the local loop.


    ![](img/bfb21474172a1e0fa05428a183709039_171_0.png)


    # The modern way


    The novel way to get this from your system is by using the **ip command:**


    # ip route show


    When this machine tries to connect a host that is on another network than its
    own, indicated by the line starting with 0.0.0.0, it will send the connection
    requests to the machine (router) with IP address 192.168.42.1, and will use its
    primary interface, eth0, to do this.


    Hosts that are on the same network, the line starting with 192.168.42.0, will
    also be contacted through the primary interface, unless no router is necessary,
    the data are just sent over the network.


    Machines can have much more complicated routing tables than this one, with lots
    of different "Destination-Gateway" pairs to connect to different networks. If
    you have the occasion to connect to an application server, for instance work,
    it is most exciting to check the routing information.


