  md: '# Introduction to Linux


    # 3.1.2.1. Why partition?


    Most people have a vague knowledge of what partitions are, since every operating
    system has the ability to create or remove them. It may seem that Linux uses more
    than one partition on the same disk, even when using the standard installation
    procedure, so some explanation is called for.


    One of the goals of having different partitions is to achieve higher data security
    in case of disaster. Dividing the hard disk partitions, can be grouped and separated.
    When an accident occurs, only the data in the partition that got hit will be damaged,
    while the data on the other partitions will most likely survive.


    This principle dates from the days when Linux did not have journaled file systems
    and power failures might lead to disaster. The use of partitions ensures security
    and robustness, so a breach on one part of the system doesn''t automatically mean
    that the whole computer is in danger. This is currently the most important reason
    for partitioning. A simple example: a user creates a script, a program or web
    application that starts up the disk. If the disk contains only one partition,
    the entire system will stop functioning if the disk is full. If the user stores
    the data on a separate partition, then only that (data) partition will be affected,
    while the system and other partitions keep functioning.


    Mind that having aed file system only provides data security in case of power
    failure and sudden disconnection of storage devices. This does not protect your
    data against bad blocks and logical errors in the file system. In those cases,
    you should use a RAID (Redundant Array of Inexpensive Disks) solution.


    # 3.1.2.2. Partition layout and types


    There are two kinds of major partitions on a Linux system:


    +   * data partition: normal Linux system data, including the root partition containing
    all the data to start up and run the system;

    * swap partition: expansion of the computer''s physical memory, extra memory on
    hard disk.


    Most systems contain a root partition, one or more data partitions and one or
    more swap partitions. Systems in mixed environments may contain partitions for
    other system data, such as a partition with a FAT or VFAT system for MS Windows
    data.


    Most users use fdisk at installation time to set the partition type. As you might
    have noticed the exercise from Chapter 1, this usually happens automatically.
    On occasions, however, you may not be lucky. In such cases, you will need to select
    the partition type manually and even do the actual partitioning. The standard
    Linux partitions have 82 for swap and 83 for data, which can be journaled (ext3)
    or normal (ext2, over systems). The fdisk utility has built-in help, should you
    forget these values.


    Apart from this, Linux supports a variety of other file system types, such as
    the relatively new Reiser file system, JFS, NFS, FATxx and many other file systems
    available on other (proprietary) operating systems.


    The standard root partition (indicated with a single slash, /) is about 100-500
    MB, and the system configuration files, most basic commands and server programs,
    system libraries, temporary space and the home directory of the administrative
    user. A standard installation requires about 250 MB for the root partition.


    Swap space (indicated with swap) is only accessible for the system itself, and
    is hidden from view normal operation. Swap is the system that ensures, on normal
    UNIX systems, that you can keep on


