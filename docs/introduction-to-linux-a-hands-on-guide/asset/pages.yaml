  md: '# Introduction to Linux


    Both chown and chgrp can be used to change ownership recursively, using the -R
    option. In that case, all underlying files and subdirectories of a directory will
    belong to the given user and/or group.


    # Restrictions


    On most systems, the use of the chown and chgrp commands is restricted for non-privileged
    users. If you are not the administrator of the system, you cannot change user
    nor group ownership for security reasons. If the use of these commands would not
    be restricted, malicious users could assign ownership of files to other users
    and/or groups change behavior of those users'' environments and even cause damage
    to others'' files.


    # 3.4.2.5. Special modes


    For the system admin to be better solving permission problems all the time, special
    access rights can be given to entire directories, or to separate programs. There
    are three special modes:


    +   * Sticky bit mode: After execution of a job, the command is kept in the system
    memory. Originally this was a feature used to save memory: big jobs are loaded
    into memory only. But these memory is inexpensive and there are better techniques
    to manage it, it is not used for any users for optimizing capabilities on single
    files. When applied to an entire directory, the sticky bit has a different meaning.
    In fact a user can change only files in this directory when he is the user owner
    of the file or when the file has appropriate permissions. This feature is used
    on directories like /var/tmp, have to be accessible for everyone, but it is not
    appropriate for users to change or delete other data. The sticky bit is indicated
    by a t at the end of the file permission field

    * SUID (set user ID) represented by the character in the user or group permission
    field. When this mode is set on an executable file, it will run with the user
    and group permissions on the file instead of with the user issuing the command,
    giving access to system resources. We will discuss this further in Chapter 4

    * SGID (set group ID) on a directory: in this special case every file in the directory
    will have the same group owner as the directory itself (while normal behavior
    would be that new files are owned by the users who create them). We do not need
    to worry about group ownership when sharing directories:


    ```

    mark:-> ls -ld /var/tmp

    drwxrxrwt 19 root       8192 Jan 16 10:37 /var/tmp/

    ```


    The sticky bit is set using the command chmod o+ directory. The historic origin
    of the "t" is in UNIX set user access feature,


    ```

    midi:-> ls -ld /opt/docs

    drwxr-x-- 4 root users       4096 Jul 25 2001 docs/

    -rwxr-r-- 1 misi users       345672 Aug 30 2001-Council.doc

    ```


    This is the standard of sharing files in UNIX.


    > Existing files are left unchanged!


    Files that are being moved to SGID directory but were created elsewhere keep their
    original user and group owner. This may be confusing.'
