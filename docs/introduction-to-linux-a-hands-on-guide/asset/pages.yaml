  md: '# Introduction to Linux


    # 3.2.6. The most common variable files


    In the /var directory we find a set of directories for storing specific non-constant
    data (as opposed to the ls program or the system configuration files, which change
    infrequently or not at all). All that change frequently, such as log files, mailboxes,
    lock files, spoolers etc. are kept in a subdirectory of /var.


    As a security measure these are usually kept in separate parts from the main file
    systems, so we can keep a close eye on them and set stricter permissions where
    necessary. A lot of these also need more permissions than usual, like /var/tmp,
    which needs to be writable for everyone. A lot of user activity might be expected
    here, which might be generated by anonymous Internet connected to your system.
    This is one reason the /var directory, containing all its subdirectories, is usually
    on a separate partition. Way, there is for instance no such a mail bomb, for instance,
    fills up the file system, containing more important data such as your programs
    and configuration files.


    # /var/tmp and /tmp


    Files in /tmp can be deleted without notice, by regular system tasks or because
    of a system reboot. In some (custom) systems, also /var/tmp might behave unpredictably.
    Nevertheless, this is not the case by default, we advise to use the /var/tmp directory
    for saving temporary files. When in doubt, check with your system administrator.
    If you manage your system, you can reasonably sure that this is a safe place if
    you do not constantly change settings on /var/tmp (as root, a normal user cannot
    do this).


    Whatever you do, try to restrict the privileges to a normal user - don''t saving
    files under the root (/) of the system, don''t put them in /usr or some subdirectory
    or in another reserved place. This pretty limits your access to file systems.


    One of the main security systems on a UNIX system, which is naturally implemented
    on every Linux machine, is the well-keeping facility, which logs all user actions,
    processes, system events etc. The configuration of the so-called syslogdaemon
    determines which and how long logged information will be kept. The default location
    of all logs is /var/log, containing different files for config, server logs, system
    messages etc.


    In /var we typically find server data, which is kept here to separate it from
    critical data as the server program and its configuration files. A typical example
    is /var/www, which contains the actual HTML pages, scripts and images that a web
    server offers. The FTP-tree of an FTP server (that can be downloaded by a remote
    client) is also best in one of /var/ subdirectories. Because this data is publicly
    accessible and often changeable by anonymous users, it is safer to keep it here,
    away from partitions or directories with sensitive data.


    On most workstation installations, /var/spool will still contain at least an and
    cron directory, containing scheduled tasks. In this environments usually contains
    lpd as well, which holds the print queue() and further printer configuration files,
    as well as the printer logs.


    On server systems we will generally find /var/spool/mail, containing mails for
    local users, sorted in one file per user, the user''s "inbox". A related directory
    is mqueue, the spooler for unsent mail messages. These parts of the system can
    be very busy on mail servers with a lot of users. Users also use the /var/spool
    area because of the enormous amounts of messages they have to process.


    The /var/lib/rpm directory is specific to RPM-based (RedHat Package Manager) distributions;
    its where RPM package information is stored. Other package managers generally
    store their data somewhere in /var.


