    # 4.3.5.7. Interrupting your processes


    As a non-privileged user, you can only influence your own processes. We already
    saw how you can display and filter out processes that belong to a particular user,
    and what restrictions can occur. When you see that one of your processes is eating
    too much of the system''s resources, there are three things that you can do:


    +   1. Make the process less resources without interrupting it;

    2. Stop the process altogether.


    In the case that you want the process to continue to run, but also want to give
    the other processes on the system a, you can renice the process. Apart from using
    the nice or renice commands, top is an example of stopping the troublesome process(es)
    and reducing priority.


    Identify the process in the "NI" column, it will most likely have a negative priority.
    Type r and enter the process ID of the process that you want to renice. Then enter
    the nice value, for instance "20". That means from now on, this process will take
    1/5 of the CPU cycles at the most.


