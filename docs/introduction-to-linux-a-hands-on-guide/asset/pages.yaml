  md: '# Introduction to Linux


    # 10.3.3.3. Proxy servers


    # 10.3.3.3.1. What is a proxy server?


    Companies and organizations often want their users to use a proxy server. Especially
    in environments with lots of users, a proxy server can enable faster downloads
    of web pages. The proxy server stores web pages. When a user asks for a web page
    that has already been requested previously, the proxy server will give the page
    to the user directly, so that she does not need to get it from the Internet, which
    would take longer. Of course, measures can be taken so that the proxy server does
    a quick check and always serves the most recent version of a page. In some environments,
    usage of proxy server is compulsory, in other environments you may have the choice
    to use it or not to use.


    # 10.3.3.2. Proxy configuration


    If you have the proxy server name and port, it should be rather obvious to feed
    that information into your browser. However, many (command line) applications
    depend on the variables like http_proxy and ftp_proxy for correct functioning.
    For your convenience, you might want to add a line like your ~/.bashrc:


    ```

    export http_proxy=http://username:password@proxy_server_name:port_number

    ```


    For instance:


    ```

    export http_proxy=http://willy:Appelsi3ntj3@proxy:80

    ```


    If you do not need to use a username and password, leave everything out before
    the "@" sign, sign included.


    # 10.3.4. File Transfer Protocol


    # 10.3.4.1. FTP servers


    On a Linux system, an FTP server is typically run by xinetd, with the WU-ftpd
    server, although the FTP server may be configured as a stand-alone server on systems
    with heavy FTP traffic. See the exercises.


    Other FTP servers include among others vsftpd, ncftpd and Proftpd.


    Most Linux distributions contain the anftpd package, which sets up an anonymous
    FTP server tree and accompanying configuration files.


    # 10.3.4.2. FTP clients


    Most Linux distributions include ncftpd, an improved version of the common UNIX
    ftp command, the ncftpd program offers extra features such as be a nicer and more
    comprehensible user interface, file name completion, and resume functions, bookmarking,
    session management and:


    ```

    thomas-> ncftpd blob

    NcFTP 3.0.3 (April 15, 2001) by Mike Gleason (ncftpd@ncftpd.com).

    Connecting to blob...

    blob.some.net FTP server (Version wu-2.6.1-20) ready.

    ```


    Chapter 10. Networking'
