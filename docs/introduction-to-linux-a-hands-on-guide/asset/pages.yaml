  md: '# 7.2.4. The Bash prompt


    # 7.2.4.1. Introduction


    The Bash prompt can do much more than displaying simple information as your user
    name, the name of your machine and some indication about the present working directory.
    We can add other information such as the current date and time, number of connected
    users.


    Before we begin here, we will save our current prompt in another environment variable:


    ```

    [jerry@nowhere jerry]$ MYPROMPT=$PS1

    [jerry@nowhere jerry]$ echo $MYPROMPT

    [\u@h \W]\$

    [jerry@nowhere jerry]$

    ```


    When we change the prompt now, by issuing the command PS1="->", we can always
    get our original prompt back with the command PS1=$MYPROMPT. You will, of course,
    also get it back when you reconnect, as long as you just fiddle with the command
    line and avoid putting it in a shell file.


    # 7.2.4.2. Some examples


    To understand these prompts and the escape sequences, we refer to the Bash Info
    or man pages.


    +   * export PS1="\t \j"


    Displays times of day and number of running jobs


    +   * export PS1="\d [\u@h \w] : "


    Displays user, host name, and current working directory. Note that \W displays
    only names of the present working directory.


    +   * export PS1="\!"


    Displays history number for each command.


    +   * export PS1="\u033[1;35m]\u@h\u033[0m] "


    Displays user@host in.


    +   * export PS1="\u033[1;35m]\u\u033[0m] \u033[1;34m]\w\u033[0m] ""


    Sets the user name in pink and the present working directory in blue.


    +   * export PS1="\u033[1;44m]$USER is in \w\u033[0m ""


    Prompt for people who have difficulties seeing the difference between the prompt
    and what they type.


    +   * export PS1="\u033[4;34m]\u@h \w \u033[0m ""


    Underlined prompt


    +   * export PS1="\u033[7;34m]\u@h \w \u033[0m] ""


    White characters on a blue background.


    +   * export PS1="\u033[3;35m]\u@h \w \u033[0m]a ""


    Chapter 7. Home sweet /home'
