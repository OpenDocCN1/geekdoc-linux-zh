  md: '# Chapter 11. Sound and Video


    This chapter addresses the following tasks (briefly, as the field of sound and
    video is very wide):


    +   - Sound card configuration

    - Playing CDs, copying CDs,

    - Playing music files

    - Volume control

    - Video and television

    - Recording sound


    # 11.1. Audio Basics


    # 11.1.1. Installation


    Most likely, your system is already installed with audio drivers and the configuration
    was done at installation time. Likewise, you should ever replace your audio hardware,
    most systems provide tools that allow easy setup and configuration of the device.
    Most currently available plug-and-play sound cards should be recognized automatically.
    If you can hear the sounds that are played during configuration, click OK and
    everything will be set up for you.


    If your card is not detected automatically, you may be presented with a list of
    sound cards and/or sound card properties from which to choose. After that, you
    will have to provide the correct I/O, IRQ and DMA settings. Information about
    these settings can be found in your sound card documentation. If you are on a
    dual boot system with MS Windows, this information can be found in the Windows
    Control Panel as well.


    > If automatic sound detection fails

    If your soundcard is not supported by default, you will need to use other techniques.
    These are described in the Linux Sound HOWTO


    # 11.1.2. Drivers and Architecture


    There are generally two types of sound architecture: the older Open System or
    OSS, which works with UNIX-like system, and the newer Advanced Linux Sound Architecture
    or ALSA, that has better support for Linux, as the name indicates. Also ALSA has
    more features and allows for faster driver development.


    Today, all mainstream audio chipsets are supported. Only some high-end professionals
    and some cards developed by manufacturers refusing to document their chipset specifications
    are unsupported. An overview of supported devices can be found on the ALSA site
    at http://www.alsa-project.org/alsa-dec/index.php?vendor=All#matrix.


    Configuring systems installed with ALSA is done using the alsaconf tool. Additionally,
    distributions usually provide their own tools for configuring the sound card;
    these might integrate the old and the new way of handling sound devices.'
