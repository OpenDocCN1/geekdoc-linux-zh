  md: '# 4.1.5.3. Signals


    Processes end because they receive a signal. There are multiple signals that you
    can send to a process. Use the kill command to send a signal to a process. The
    command kill -1 shows a list of signals. Most signals are for internal use by
    the system, or for programmers when they write code. As a user, you will need
    the following signals:


    # Table 4-2. Common signals


    | Signal name | Signal number | Meaning |

    | --- | --- | --- |

    | SIGTERM | | Terminate the process in an orderly way. |

    | SIGINT | 2 | Interrupt the process. A process can ignore this signal. |

    | SIGKILL | 9 | Interrupt the process. A process can ignore this signal. |

    | SIGHUP | 1 | For daemons: reload the configuration file. |


    You can read more about default actions that are taken when sending a signal to
    a process in **man 7 signal**.


    # 4.1.6. SUID and SIGID


    As promised in the previous chapter, we will discuss the special modes SUID and
    SIGID in more detail. These modes provide normal users the ability to execute
    tasks they would normally not be able to do because of the tight file permission
    scheme used on UNIX systems. In the ideal situation special modes are used as
    sparsely as possible, since they include security risks. Linux developers have
    generally tried to avoid them as much as possible. The Linux ps version, for example,
    uses the information stored in the /proc file system, which is accessible to everyone,
    avoiding exposition of sensitive data and resources to the general public. Before
    that, and still on older UNIX systems, the `ps` program needed access to files
    as `/dev/mem` and `/dev/kmem`, which had disadvantages regarding the permissions
    and ownership on these:


    ```

    rita:-> ls -1 /dev/*kmem

    crw-r-- 1 root kmem 1, Aug 30 22:30 /dev/kmem

    crw-r-- 1 root kmem 1, Aug 30 22:30 /dev/mem

    ```


    With older versions of ps, it was not possible to start the program as a common
    user, unless special modes were applied to it.


    While generally try to avoid applying any special modes, it is sometimes necessary
    to use an SUID. An example is the mechanism for changing passwords. Of users will
    want to do this instead of having their password set by the system administrator.
    Now users and passwords are listed in the /etc/passwd file, which has access permissions
    and ownership:


    ```

    bea:-> ls -1 /etc/passwd

    tw-r--r-- 1 root root 1267 Jan 16 14:43 /etc/passwd

    ```


    Still, users need to be able to change their own information in this file. This
    is achieved by giving the password special permissions:


    ```

    mia:-> which password

    passwd is /usr/bin/passwd

    ```


