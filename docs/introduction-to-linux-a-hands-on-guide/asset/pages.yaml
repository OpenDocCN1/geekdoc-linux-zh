    # 11.6. Exercises


    +   1. From the Gnome or KDE menu, open your sound configuration panel. Make sure
    audio boxes or headset are connected to your system and find an output level that
    is comfortable for you. Make sure, when your system is ALSA-compatible, you use
    the appropriate panel.

    2. If you have a microphone, try recording a sample of your own voice. Make sure
    the input volume is not too high, as this will result in high-pitched tones when
    you communicate with others, or in transferring background noise to the other
    party. On the command line, you might even try to use arecord and a for recording
    and playing sound.

    3. Locate sound files on your system and try to play them.

    4. Insert an audio CD and try to play it.

    5. Find a chat partner and configure a VoIP program. (You might need to install
    one first.)

    6. Can you listen to Internet radio?

    7. If you have a DVD player and a movie on a DVD disk, try to play it.'
