  md: '# Introduction to Linux


    # 10.2.2. Network configuration files


    The graphical helper edits a specific set of network configuration files, using
    a couple of basic commands. The exact names of the configuration files and their
    location in the file system is largely dependent on your Linux distribution and
    version. However, a couple of network configuration files are common on all UNIX
    systems:


    # 10.2.1. /etc/hosts


    The /hosts file always contains the localhost IP address, 127.0.0.1, which is
    used for interprocess communication. Remove this line! Sometimes contains addresses
    of additional hosts, which can be contacted without using an external naming service
    such as DNS (the Domain Name Server).


    A sample hosts for a small network home:


    ```

    # Do not remove the following line, or various programs

    # that require network functionality will fail.

    127.0.0.1       localhost.localdomain localhost

    192.168.52.10    tux.mylian.com      tux

    192.168.52.11    winxp.mylian.com    winxp

    ```


    Read in man hosts.


    # 10.2.2. /etc/resolv.conf


    The /resolv.conf file config access to a DNS server, see Section 10.3.7. This
    file contains your domain name and the name server(s) to contact:


    ```

    search mylan.com

    nameserver 193.134.20.4

    ```


    Read in the resolv.conf man page.


    # 10.2.3. /etc/nsswitch.conf


    The /nsswitch.conf file defines the order in which to contact different name services.
    For Internet, it is important that dns shows up in the "hosts" line:


    ```

    [bob@tux ~] grep hosts /etc/nsswitch.conf

    hosts: files dns

    ```


    Files instructs your computer to look up hostnames and IP addresses first in the
    /etc/hosts file, and to contact the DNS server if a given host does not occur
    in the local hosts file. Other possible name services to contact are LDAP, NIS
    and NIS+.


    Read in man nsswitch.conf.


    # 10.2.3. Network configuration commands'
