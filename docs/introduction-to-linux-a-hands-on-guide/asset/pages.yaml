    # 6.3.3. Remarks


    # 6.3.3.1. General use of office documents


    Try to limit the use of office documents for the purposes they were meant for:
    the office.


    An example: it drives most Linux users crazy if you send them a mail that says
    in the body something like: "Hello, I want to tell you, see attach", and then
    the attachement proves to be an MS Word compatible document like "Hello my, how
    is your new job going and you will have time to lunch with tomorrow?" Also a bad
    idea is the attachment of your signature in such a file, for instance. If you
    want to sign messages or files, use PGP, the PGP- GNU Privacy Guard or SSL (Secure
    Socket Layer) certificates.


    These users are not anyway banned because they are used or they are worried that
    these formats typically generate much larger files, but because of the implication
    that they are using MS Windows, and because of the extra work of starting some
    additional programs.


    # 6.3.3.2. System and user configuration files


    In the next chapter, we start configuring our environment, and this might include
    editing all kinds of files that determine how a program behave.


    > Don''t edit these files with any office component!


    The default file format specification would make the program several lines of
    code, defining the format of the file and the fonts used. These lines will not
    be interpreted in the correct way by the programs depending on, resulting in errors
    or a crash of the program reading the file. In some cases, you can save the file
    as plain text, but you''ll run into trouble when making this habit.


    # 6.3.3.3. But I want a graphical text editor!


    If you insist, try gedit, kedit, kwrite or xedit; these programs only do text
    files, which is what we will be needing. If you are doing anything serious, though,
    stick to a real text mode editor as vim or emacs.


    An acceptable alternative is gvim, the Gnome version of vim. You still need to
    use vi commands, and if you are stuck, you can look them in the menus.


    # 6.4. Summary


    In this chapter we learned to use an editor. While it depends on your individual
    preference which one you use, it is necessary to at least know how to use one
    editor.


    The vi editor is available on every UNIX system.


    Most Linux distributions include an office suite and a graphical text editor.'
