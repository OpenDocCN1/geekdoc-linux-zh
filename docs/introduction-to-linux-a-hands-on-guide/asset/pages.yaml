  md: '# Introduction to Linux


    Cindy is not a developer and doesn''t care about core dumps, which contain debugging
    information on a program. If you do want core dumps, you can set their size using
    the **ulimit** command. Read the Info pages on **bash** for a detailed explanation.


    # Core file?


    A core file or **core dump** is sometimes generated when things go wrong with
    a program during its execution. The core file contains a copy of the system''s
    memory, as it was at the time that the error occurred.


    # 7.1.2.6. Compressed files


    Compressed files are useful because they take less space on your hard disk. Another
    advantage is that it takes less bandwidth to compress a file over your network.
    A lot of files, such as the man pages, are stored in a compressed format on your
    system. Yet unpacking these to get a little bit of information and having to compress
    them is rather time-consuming. You don''t want to unpack a man page, for instance,
    read about an option to a command and then compress the man page again. Most people
    will probably forget to clean up after they found the information they needed.


    So we have tools that work on compressed files, by uncompressing them in memory.
    The compressed file stays on your disk as is. Most systems support **gzip**, **zcat**,
    **bzless** and other members of the z-family to avoid decompressing and compressing
    actions. See your system''s binary directory and the Info pages.


    See **Chapter 9** for more on the actual compressing of files and examples on
    making archives.


    # 7.2. Your text environment


    # 7.2.1. Environment variables


    # 7.2.1.1. General


    We already mentioned a couple of environment variables, such as **PATH** and **HOME**.
    Until now, we only saw examples in which they serve a certain purpose to the shell.
    But there are many other Linux utilities that need information about you in order
    to do a good job.


    What other information programs need apart from paths and home directories?


    A lot of programs want to know the kind of terminal you are using; this information
    is stored in the **TERM** variable. In text mode, this is the **linux** terminal
    emulation, in graphical mode you are likely to use **xterm**. Lots of programs
    want to know what your editor is, in case they have to start an editor in a subprocess.
    The shell you are using in the **SHELL** variable, the operating system type in
    **OS** and so. A list of variables defined for your current session you can view
    the **printenv** command.


    The environment variables are managed by the shell. As opposed to regular variables,
    environment variables are inherited by any program you start, including another
    shell. New processes are assigned a copy of these variables, which they can read,
    modify and pass on to their own child processes.


    There is nothing special about variable names, except that the common ones are
    in upper case by convention. You may come with any name you want, although there
