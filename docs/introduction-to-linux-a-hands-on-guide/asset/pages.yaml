    necessary to actually boot operating system.


    GRUB supports boot methods, allowing you to use it with almost any operating system,
    most popular file systems, and almost any hard disk your BIOS can recognize.


    GRUB contains a number of other features; the most important include:


    +   * GRUB provides a true command-based, pre-OS environment on x86 to allow maximum
    flexibility in loading operating systems with certain options or gathering information
    about the system.

    * GRUB supports Logical Block Addressing (LBA) mode, needed to access any IDE
    and SCSI hard disks. Before LBA, hard drives could encounter a 1024-cylinder limit,
    which the BIOS could find a file after that.

    * GRUB’s configuration is read from the disk system boots, preventing you from
    having to write over the MBR every time you boot the options.


    A full description of GRUB may be found by issuing the info grub command or at
    the GRUB site. The Linux Documentation Project has a Multiboot with GRUB Mini-HOWTO.


    # 4.2.4. Init


    The kernel, when it is loaded, finds it sbin and executes it.


    When init starts, it becomes the parent or grandparent of all the processes that
    start up automatically on your Linux system. The first thing init does, is reading
    its initialization file, /etc/initab. This instructs init to read an initial configuration
    script for the environment, which sets the path, swaps, checking the files, and
    so on. Basically, this step takes care of everything that your system needs to
    do at system initialization: setting the clock, initializing partitions and so
    forth.


    Then init continues to read the /etc/initab file, which describes how the system
    should be set up in each run level and sets the default run level. A run level
    is a configuration of processes. All UNIX-like systems can run in different process
    configurations, as the single user mode, which is referred to as run level 1 or
    run level S (s). In this mode, the system administrator can connect to the system.
    It is used to perform maintenance tasks without risks of damaging the system or
    user data. Naturally, in this configuration we do not to offer user services,
    so all will be disabled. Another run level is the reboot run level, or run level
    6, which shuts down all running services to the appropriate procedures and restarts
    the system.


    Use which current run level is:


    ```

    willy@ubuntu:~$ echo -s

    run-level 2 2006-10-17 23:22

    ```


    More about run levels in the next section, Section 4.2.5.


    After determining the default run level for your system, init starts as all of
    the background processes necessary for the system to run by looking in the appropriate
    rc directory for run level. init runs each of the kill scripts (their file names
    start with a K) with a stop parameter. Then it runs all of start scripts (their
    file names start with an S) in the run level directory so that all services and
    applications are started correctly. In fact, you can execute these scripts manually
    after the system is finished booting with a command like telctl/initd/httpd stop
    or service httpd stop logged in as root, in this case stopping


