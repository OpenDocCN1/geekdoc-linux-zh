    # 5.3.1. More about grep


    As we saw in Section 3.3.3.4, **grep** scans the output line per line, searching
    for matching patterns. All lines containing the pattern will be printed to standard
    output. This behavior can be reversed using the -v option.


    Some examples: suppose we want to know which files in a certain directory have
    been modified in February:


    ```

    jenny:-> ls -la | grep Feb

    ```


    The **grep** command, like most commands, is case sensitive. The -i option to
    make no difference between upper and lower case. A of GNU expressions are available
    well, such as --color, which is helpful to highlight searchterms in long lines,
    and --after-context, which prints the number of lines after the matching line.
    You can use a recursive **grep** that searches all subdirectories of directories
    using the -r option. As usual, options can be combined.


    Regular expressions can be used to filter the exact character matches you want
    to select out of all input lines. The best way to start with regular expressions
    is to read the **grep** documentation. An excellent chapter is in the grep Info
    page. Since it would lead us too far discussing the ins and outs of regular expressions,
    it is strongly advised to start here if you want to know more about them.


    Play a bit with **grep**, it will be the trouble putting some time in this basic
    but very powerful filtering command. The exercises at the end of this chapter
    will help you to get started, see Section 5.5.


    # 5.3.2. Filtering output


    The command **sort** arranges lines in alphabetical order by default:


    ```

    thomas:-> cat people-I-like | sort

    Auntie Emmy

    Boyfriend

    Dad

    Grandma

    Mum

    My boss

    ```


    But there are many things **sort** can do. Looking at the file size, for instance.
    With this command, directory content sorts smallest files first, biggest files
    last:


    ```

    ls -la | sort -nk

    ```


    > Old sort syntax


    You might obtain the same result with **ls -la | sort +4n**, but this is an old
    form which does not comply with the current standards.


    The **sort** command is also used in combination with the **uniq** program (or
    **sort -u**) to sort output and filter out double entries:


    ```

    thomas:-> cat itemlist

    1

    4

    5

    34

    ```'
