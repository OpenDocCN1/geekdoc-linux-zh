  md: '# Introduction to Linux


    # 7.1.2.1. Emptying files


    Sometimes the content of a file does not interest you, but you need the file name
    as a marker (for instance, you just need the timestamp of a file, a reminder that
    the file was there or should be some time in the future). Redirecting the output
    of a null command is how this is done in the Bourne and Bash shells:


    ```

    andy:-> cat wishlist placeholder


    andy:-> ls -la placeholder

    -rw-rw-r-- 1 andy andy      200 Jun 12 13:34


    andy:-> > placeholder

    \andy:-> ls -la placeholder

    -rw-rw-r-- 1 andy andy      0 Jun 12 13:35 placeholder

    ```


    The process of reducing an existing file to a file with the same name is 0 bytes
    large is called **truncating**.


    For creating a new empty file, the same effect is obtained with the **touch**
    command. On an existing file, **touch** will only update the timestamp. See the
    pages on **touch** for more details.


    To "make" an empty file, use the **tail** command. Suppose *andy''s* wishlist
    becomes longer because he always stuffs at the end but never deletes the things
    he actually gets. Now he wants to keep the last five items:


    ```

    andy:-> tail -5 wishlist > newest


    andy:-> cat newest > wishlist

    \andy:-> rm newList

    ```


    # 7.1.2.2. More about log files


    Some Linux programs insist on writing all sorts of output in a log file. Usually
    there are options to log errors, or to log a minimal amount of information, for
    example setting the debugging level of the program. But even then, you might not
    catch the log file. Here are some ways to get rid of them or at least some limits
    to their size:


    +   * Try removing the log file when it is not running, or if you are sure you
    won''t need it again. Some programs may exist, when restarted, there is no log
    file and therefore not log.

    * If you remove the log file and the program recreates it, search the documentation
    for this particular program in search command to avoid making log files.

    * Try making smaller log files by logging only the information that is relevant
    to you, or by replacing replacing the log file with a symbolic link to `/dev/null`;
    if you''re lucky the program won''t complain. Don''t do this with the log files
    of programs that run at system boot or programs that run from cron (see Chapter
    4). These programs might replace the symbolic link with a small file that starts
    growing again.'
