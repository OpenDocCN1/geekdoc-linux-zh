    # 3.2.3.2. The shell


    # 3.2.3.2.1. What is a shell?


    When I was looking for an appropriate explanation on the concept of a shell, it
    gave me more trouble than I expected. All kinds of definitions are available,
    ranging from the simple comparison that "the shell is the steering wheel of the
    car", to the vague definition in the Bash manual which says that "bash is an sh-compatible
    command language interpreter," or an even obscure expression, "a shell manages
    the interaction between the system and its users". Shell is much more than that.


    A shell can be compared with a way of talking to the computer, a language. Most
    users do know that language, the point-and-click language of the desktop. But
    in that language the computer is leading the conversation, while the user has
    the passive role of picking tasks from the ones presented. It is very difficult
    for a programmer to include all options and possible use of a command in a GUI-format.
    Thus, GUIs are always less capable than a command or commands that form the backend.


    The shell, on the other hand, is an advanced way of communicating with the system,
    it allows for two-way communication and taking initiative. Both partners in the
    communication are equal, so new ideas can be tested. The shell allows the user
    to handle a system in a very flexible way. An additional asset is that the shell
    allows for task automation.


    # 3.2.3.2.2. Shell types


    Just people know different languages and dialects, the computer knows different
    shell types:


    +   * **sh** or Bourne Shell: the original still used on UNIX systems and in UNIX
    related environments. This is the basic shell, a small program with few features.
    When POSIX-compatible mode, **bash** will emulate this shell.

    * **bash** or Bourne Again:: standard GNU shell, intuitive and flexible. Probably
    most advisable for beginners while being the same time a powerful tool for the
    advanced and professional users. On Linux, **bash** is the standard for common
    users. This is a so-called superset of the Bourne shell, a set of add-ons and
    plug-ins. This means that the Bourne Again is compatible with the Bourne shell:
    commands that work in *sh*, also in *bash*. The reverse is not always the case.
    All examples and exercises in this book use **bash**.

    * **csh** or C Shell: the syntax of this shell resembles that of the C programming
    language. Sometimes asked for programmers.

    * **tcsh** or Tcsh: superset of the common C Shell, enhancing user-friendliness
    and speed.

    * **ksh** or the Korn shell: sometimes appreciated by people with a UNIX background.
    A superset of the Bourne shell; with standard configuration a matter for beginning
    users.


    The file /etc/shells gives an overview of known shells on a Linux system:


    ```

    mia:> cat /etc/shells

    /bin/bash

    /bin/sh

    /bin/tcsh

    /bin/csh

    ```


