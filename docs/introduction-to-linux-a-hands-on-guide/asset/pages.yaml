  md: '# Introduction to Linux


    On a server, system data tends to be separate from user data. Programs that offer
    services are kept in a different place than the data handled by this service.
    Different partitions will be created on such systems:


    +   * a partition with all data necessary boot the machine

    * a partition with configuration data and server programs

    * one or more partitions containing the server data as database tables, user mails,
    an ftp archive etc.

    * a partition with user programs and applications

    * one or more partitions for the user files (home directories)

    * one or more swap partitions (virtual memory)


    Servers usually have more memory and thus less swap space. Certain server processes,
    such as databases, may require more swap space than usual; see the specific documentation
    for detailed information. For better performance, swap is often divided into different
    swap partitions.


    # 3.1.2.3. Mount points


    All partitions are attached to the system via a mount point. The mount point defines
    the place of a particular data set in the file system. Usually, all partitions
    are connected through the *root* partition. On this partition, which is indicated
    with the slash (/), directories are the starting point of the partitions that
    are attached to. An example: given a partition that holds the following directories:


    ```

    videos/ cd-images/ pictures/

    We want to attach this partition to the filesystem in a directory called /opt/media.
    In order to do this, the system administrator has to make sure that the directory
    /opt/media exists on the system. Preferably, it should be an empty directory.
    How this is explained later in this chapter. Then, using the mount command, the
    administrator can attach the partition to the system. When you look at the content
    of the formerly empty directory /opt/media, it will contain the files and directories
    that are mounted on medium (hard disk or partition of CD, DVD, flash card, USB
    or other storage device).

    ```


    During system startup, all the partitions are mounted, and their mount points
    as described in the file /etc/fstab. Some partitions are not mounted by default,
    for instance they are not connected to the system, like the storage used by your
    digital camera. If configured, the device will be mounted as soon as the system
    notices it is connected, or it can be user-mountable, i.e. you don''t need to
    system administrator to attach and detach the device to and from the system. There
    is an example in [Section 9.3].


    On a running system, information about partitions and their mount points can be
    displayed using the df command (which shows disk free). In Linux, df is the GNU
    version, and supports the -h human readable option which greatly improves readability.
    Note that UNIX machines have their own versions of df and many other commands.
    Their behavior is the same as, GNU version of common tools which have more and
    better features.


    The df command only displays information about active non-swap partitions. These
    can include partitions from other networks, like in the example where the home
    directories are mounted from a server on the network, a situation encountered
    in corporate environments.


