    +   - **bash**: Bourne Again SHEll, see Section 3.2.3.2 and Section 7.2.5.

    - **batch**: Queue, examine or delete jobs for later execution, see Section 4.1.2.2.

    - **bg**: Run a job in the background, see Section 4.1.2.1.

    - **bitmap**: Bitmap editor and converter utilities for the X window System.

    - **zip2**: A block-sorting file compressor, see Section 9.1.1.3.'
