    # ## 3.4.2. Logging on to another group


    When you use `id` on the command line, you get a list of the groups that you can
    possibly belong to, preceded by your user name and ID the group name and ID that
    you are currently connected with. However, on Linux systems you can only access
    what you are logged in to as. By default, the active or `primary` group is the
    one you have set from the `/etc/passwd` file. The fourth field of this file holds
    holders'' primary group ID, which is looked up in the `/etc/group` file. An example:


    ```

    asim> id

    uid=501(asim) gid=501(asim) groups=100(users),501(asim),3400(web)


    asim> grep asim /etc/passwd

    asim:501:501:El Baraka:home/asim:/bin/bash


    asim> grep 501 /etc/group

    asimx:501:

    ```


    The fourth field in the line from `/etc/passwd` contains the value "501", which
    represents the group `asim` in the above example. From `/etc/group` we can get
    the matching name `asim`. When connecting to the system, this is the group `asim`
    will belong to.


    > User private group scheme


    In order to allow more flexibility, Linux systems follow the so-called *user private
    group* scheme, which assigns each user primarily to his or her own group. A group
    is that group that only contains this particular user, the name "private group".
    Usually this group has the same name as the user login name, which can be confusing.

    Apart from his own private group, user `asim` can also be in the groups `users`
    and `web`. Because these are secondary groups to this, he will need to use the
    `newgrp` to log into any of these groups as `passwd` for setting the group password
    first. In the example, `asim` needs to create files that are owned by the group
    web.


    ```

    asim:/var/www/html> newgrp web

    asim:/var/www/html> id

    uid=501(asim) gid=3400(web) groups=100(users),501(asim),3400(web)

    ```


    When asim creates new files, they will be in group ownership of the group web
    instead of being owned by his group asim:'
