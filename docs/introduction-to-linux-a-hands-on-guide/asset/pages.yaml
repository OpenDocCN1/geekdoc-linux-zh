    of this UNIX-way of handling devices is that neither the user nor the system has
    to worry much about the specification of devices.


    Users that are new to Linux or UNIX in general are often overwhelmed by the amount
    of new names and concepts they have to learn. That is why a list of common devices
    is included in this introduction.


