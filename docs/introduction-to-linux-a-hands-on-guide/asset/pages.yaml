    # 9.4.5. Decrypting files


    Using the -d option, you can decrypt files that have been encrypted for you. The
    data will scroll over your screen, unless an encrypted copy will remain on disk.
    So for files other than plain text, you will want to save the decrypted data,
    so you can view it with the appropriate program. This is done using the -o option
    to the gpg command:


    ```

    willy@ubuntu:~$ gpg -d -o /var/tmp/home-willy-decrypt.tar /var/tmp/home-willy-20060808.tar

    ```


    You need a passphrase to unlock the secret key for

    user: Willy De Wandel <wdw@mgv.vl>

    4096 ELG-E key, ID A3449CF7, created 2006-08-08 (main key ID BF5C3DBB)


    ```

    gpg: encrypted with 4096-bit ELG key, ID A3449CF7, created 2006-08-08

    -Willy De Wandel (Wille) <wdw@mgv.vl>

    ```


    +   - No password = no data


    If you cannot remember your password, the data is lost. Not even the system administrator
    will be able to decrypt the data. This is why of important keys is sometimes kept
    in a sealed vault in a bank.


