  md: '# Introduction to Linux


    +   * **hostname**: The host name specifies the name of the client machine to
    which the display is physically connected. If the host name is not given, the
    most efficient way of communicating to a server on the same machine will be used.

    * **displayname**: The phrase "display" is used to refer to a collection of monitors
    that share a common keyboard and pointer (mouse, tablet, etc.). Most workstations
    tend to have only one keyboard, and therefore only one display. Larger, multi-user
    systems, frequently have several displays so that more than one person can draw
    graphics at once. To avoid confusion, each display on a machine is assigned a
    display number (beginning at 0) when the X server for that display is started.
    The display number must always be given in a display name.

    * **screen**: Some displays share a single keyboard and pointer among two or more
    monitors. Since each monitor has its own set of windows, each screen is assigned
    a screen number (beginning at 0) when the X server for display is started. If
    the screen is not given, screen 0 will be used.


    On POSIX systems, the default display is stored in your DISPLAY environment variable.
    This variable is set automatically by the xterm terminal emulator. However, when
    you log into another machine on a network, you might need to set DISPLAY by hand
    to point to your display, see Section10.4.3.2.


    More information can be found in the X pages.


    # 7.3.2.2. Window and desktop managers


    The layout of the windows is controlled by special programs called window managers.
    Although many window managers will honor geometry specifications as given, others
    may ignore them (requiring the user to explicitly draw the window''s region on
    the screen with the pointer, for example).


    Since window managers are regular (albeit complex) things, a variety of different
    user interfaces can be built. The X Consortium distribution comes with a window
    manager named twwm, but most users prefer something fancy when system resources
    permit. Sawfish and Enlightenment are popular examples which allow each user to
    have a desktop according to mood and style.


    A desktop manager makes use of one window manager or another for arranging your
    graphical desktop in a convenient way, with margins, drop-down menus, informative
    messages, a clock, a program manager, a file manager and so. Among the most popular
    desktop managers are Gnome and KDE, which both run on almost any Linux and many
    other UNIX systems.


    > KDE applications in Gnome/Gnome applications in KDE

    You don''t need to start your desktop in KDE in order to run KDE applications.
    If you have the KDE libraries installed (the kdelibs package), you can run these
    applications from the Gnome menus or start them from a Gnome terminal.


    Running applications in a KDE environment is a bit more tricky, because there
    is no single set of base-libraries in KDE. However, the dependencies and thus
    extra packages you might have to install will become clear when running or installing
    such an application.


