    # 4.1.5. Life and death of a process


    # 4.1.5.1. Process creation


    A new process is created because an existing process makes an exact copy of itself.
    This child process has the same environment as its parent, only the process ID
    is different. This procedure is called forking.


    After the forking process, the address space of the child process is overwritten
    with the new process data. This is done through an exec call to the system.


    The fork-and-exec mechanism thus switches an old command with a new, while the
    environment in which the new program is executed remains the same, including configuration
    of input and output devices, environment variables and priority. This mechanism
    is used to create all UNIX processes, so it also applies to the Linux operating
    system. Even the first process, init, with process ID 1, is forked during the
    boot process in the so-called bootstrapping procedure.


    This scheme illustrates the fork-and-exec mechanism. The process ID changes after
    the fork procedure:


    Figure 4-1. Fork-and-exec mechanism'
