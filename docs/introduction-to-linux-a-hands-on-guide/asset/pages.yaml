  md: '# Introduction to Linux


    +   * No MS Windows hosts in the network, no Samba required.

    * Don''t allow FTP unless an FTP server is required.

    * Don''t allow NFS and NIS over the Internet, disable all related services on
    a stand-alone installation.

    * Don''t run an MTA if is not actually on a mail server.

    * ...


    Stop running services using the `chkconfig` command, the inscripts or by editing
    the `(x)inetd` configuration files.


    # 10.5.3. Update regularly


    Its ability to adapt quickly in an ever changing environment is what makes Linux
    thrive. But it also creates a possibility that security updates have been released
    even while you are installing a brand new version, so the first thing you should
    do (and this goes for any OS you can think of) after installation is getting the
    updates as soon as possible. After that, update all the packages you use regularly.


    Some updates may require new configuration files, and old files may be replaced.
    Check the documentation, and ensure that everything runs normal after updating.


    Most Linux distributions provide mailing lists for security update announcements,
    and tools for applying updates to the system. General Linux only security issues
    are reported among others at Linuxsecurity.com.


    Updating is an ongoing process, so it should be an almost daily habit.


    # 10.5.4. Firewalls and access policies


    # 10.5.4.1. What is a firewall?


    In the previous section we already mentioned firewall capabilities in Linux. While
    firewall administration is one of the tasks of your network admin, you should
    know a couple of things about firewalls.


    Firewall is a vague term that can mean anything that acts as a protective barrier
    between us and the outside world, generally the Internet. A firewall can be a
    dedicated system or a specific application that provides this functionality. Or
    it can be a combination of components, including various combinations of hardware
    and software. Firewalls are built from "rules" and are defined to define what
    is allowed to enter and or exit a system or network.


    After disabling unnecessary services, we now want to restrict accepted services
    as to allow the minimum required connections. A example is working from home:
    only the specific connection between your office and your home should be allowed,
    connections from other machines on the Internet should be blocked.


    # 10.5.4.2. Packet filters


    The first line of defense is a packet filter, which can look inside IP packets
    and make decisions based on the content. Most common is the Netfilter package,
    providing the iptables command, a next generation packet filter for Linux.


    One of the most noteworthy enhancements in the newer kernels is the stateful inspection
    feature, which not tells what is inside a packet, but also detects if a packet
    belongs or is related to a new or existing


    Chapter 10. Networking'
