  md: '# Introduction to Linux


    * Most distributions come with the BSD dump and restore utilities for making backups
    of ext2 and ext3 file systems. This tool can write to a variety of devices and
    literally dumps the file(s) or file system by bit onto the specific device. Like
    dd, this allows for backing up special file types such as the ones in /dev.


    # 9.3. Using rsync


    # 9.3.1. Introduction


    The rsync program is a fast and flexible tool for remote backup. It is common
    on UNIX and UNIX-like systems, easy to configure and use in scripts. While the
    r stands for "remote" in rsync copy, you do not need to take this all too. Your
    "remote" device just as well be a USB storage device or another partition on your
    hard disk, you do not need to have two separated machines.


    # 9.3.2. An example: rsync to a USB storage device


    As discussed in Section 3.1.2.3, we will first have to mount the device. Possibly,
    this can be done as root:


    ```

    root@theserver# mkdir /mnt/usbstorage

    nroot@theserver# mount -t vfat /dev/sda /mnt/usbstorage

    ```


    Userfriendly


    More and more distributions give access to removable devices for non-privileged
    users and other mount USB devices, CD-ROMs and other removable devices automatically.


    Note that this guideline requires USB support to be installed on your system.
    See the USB Guide for help if this does not work. Check with dmesg that /dev/sda
    is indeed the device to mount.


    Then you can start the actual backup, for instance the /home/karl directory:


    ```

    karl@theserver:~ rsync -avz /home/karl/ /mnt/usbstorage


    ```


    As usual, refer to the man pages for more.


    # 9.4. Encryption


    # 9.4.1. General remarks


    # 9.4.1.1. Why should you encrypt data?


    Encryption is synonym to secrecy. In the context of backups, encryption can be
    very useful, for instance if you need to leave your backed up data in a place
    where you cannot control access, such as the server of your provider.


    Apart from that, encryption can be sent to E-mails as well: normally, mail is
    not encrypted and it is often sent in the open over the netwerk or the Internet.
    If your message contains sensitive information, better encrypt it.'
