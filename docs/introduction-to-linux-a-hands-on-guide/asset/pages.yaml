  md: '# Introduction to Linux


    # 10.5. Security


    # 10.5.1. Introduction


    As soon a computer is connected to the network, all kinds of abuse becomes possible,
    be it a UNIX-based or any other system. Admitted, mountains of papers have been
    spilled on this subject and it would lead us too far to discuss the security in
    detail. There are, however, a couple of fairly logical things even a novice user
    can to obtain a very secure system, but break-ins are the result of ignorant or
    careless users.


    Maybe you are asking yourself if this all applies to you, using your computer
    at home or working at your office on a desktop in a fairly protected environment.
    The questions you should be asking yourself, are more on the lines of:


    +   - Do you want to be in control of your own system?

    - Do you want to (unwillingly) participate in criminal activities?

    - Do you want your equipment to be used by someone else?

    - Do you want to take risks on losing your Internet connection?

    - Do you want to rebuild your system every time it has been hacked?

    - Do you want to risk personal or other data loss?


    Presuming you don''t, we will quickly list the steps you can take to secure your
    machine. Extended information can be found in the Linux Security HOWTO.


    # 10.5.2. Services


    The goal is to run as few services as possible. If the number of ports that are
    open for the outside world are to keep to a minimum, then it is the better to
    keep under over. If services cannot be turned off for the local network, try to
    at least disable them for outside connections.


    A rule of thumb is that if you don''t recognize a particular service, you probably
    won''t need it. Keep in mind that some services are not really meant to be used
    over the Internet. Don''t rely on what should be running, which services are listed
    using the netstat command:


    ```

    $silly@mars ~ netstat -l | grep tcp

    tcp      0      *:32769         *:*      LISTEN

    tcp      0      *:3277          *:*      LISTEN

    tcp      0      *:printer         *:*      LISTEN

    tcp      0      *:kerberos_master  *:*      LISTEN

    tcp      0      *:sunprpc        *:*      LISTEN

    tcp      0      *:600             *:*      LISTEN

    tcp      0      *:785             *:*      LISTEN

    tcp      0      *:localhost.localdomain:smtp *:*      LISTEN

    tcp      0      *:ftp               *:*      LISTEN

    tcp      0      *:ssh               *:*      LISTEN

    tcp      0      *:x11-ssh-offset   *:*      LISTEN

    ```


    Things to avoid:


    +   - exec on login machines, and telnet just to be on the safe side.

    - X11 on login machines.

    - No ip if no printer is physically attached.


    Chapter 10. Networking'
  merge: -1
  pgno: 190
