    # ## 4.4. Scheduling processes


    # ### 4.4.1. Use that idle time!


    A Linux system can have a auto-log to suffer, but it usually suffers only during
    office hours. Whether in an office environment, a server room or at home, most
    Linux systems are idling during morning, the evening, the nights and weekends.
    Using this idle time can be a cheaper than buying those machines you''d absolutely
    need everything at the same time.


    There are three types of delayed execution:


    +   * Waiting a while and then resuming job execution, using the sleep command.
    Execution time depends on the system time at the moment of submission.

    * Running a command at a specified time, using the at command. Execution of the
    job(s) depends on system time, not the time of submission.

    * Regularly running a command on a monthly, weekly, daily or hourly basis, using
    the cron facilities.


    The following sections discuss each possibility.


    # ## 4.4.2. The sleep command


    The Info page on sleep is probably one of the shortest there is. All sleep does
    is wait. By default the time to is expressed in seconds.


    Why does it exist? Some practical examples:


    Somebody calls you on the phone, you say "I''ll be with you in half an hour" but
    you''re about drowned in work as it is and have to forget your lunch:


    ```

    (sleep 1800; echo "Lunch time . ") &

    ```


    When you can''t use the at for some reason, it''s five o''clock, you want to go
    home but there''s still work to do and right now somebody is eating system resources:


    ```

    (sleep 10000; myprogram) &

    ```


    Make sure there''s an auto-log out on your system, and that log out lock your
    desktop/office when submitting this kind of job, or run it in a screen session.


    When you run a series of print of large files, but you want other users to be
    able to print in between:


    ```

    lp lotofext; sleep 900; lp hugefile; sleep 900; lp anotherlargefile

    ```


