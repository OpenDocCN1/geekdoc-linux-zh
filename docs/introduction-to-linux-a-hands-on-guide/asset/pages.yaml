    from different vendors communicating in the same network, or users working on
    different systems without the need for extra education to use another computer.
    UNIX did a great deal to help users become comfortable with different systems.


    Throughout the next couple of decades of UNIX continued. More things became possible
    to do and more hardware and software vendors added support for UNIX to their products.


    UNIX was initially found only in large environments with mainframes and minicomput
    (note that a PC is a "micro" computer). You had to work at a university, for the
    government or for large financial corporations in order to get your hands on a
