    OpenOffice.org, KOffice, AbiWord, WordPerfect, etc.


    The following are common languages in a printing context:


    +   * **groff**: GNU version of the UNIX command. It is a front-end to the groff
    command and a post-processor appropriate for the selected device. It allows generation
    of PostScript.

    * **TeX** and the macro package LaTeX: one of the most widely used markup languages
    on UNIX systems. Usually invoked as *tex*, it formats and outputs a corresponding
    device-independent representation of the typeset document.


    Technical works are still frequently written in LaTeX because of its support for
    mathematic formulas, although efforts are made by W3C (the World Wide Web Consortium)
    to include this feature in other applications.

    SGML and XML: Free parsers are available for UNIX and Linux. Linux is the next
    generation SGML, it forms the base for DocBook XML, a document system (this book
    is written in XML, for instance).


