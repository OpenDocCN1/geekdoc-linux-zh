  md: '# # Chapter 5. I/O redirection


    This chapter describes more about the powerful UNIX mechanism of redirecting input,
    and errors. Topics include:


    +   - Standard input, output and errors

    - Direction operators

    - How to use output of one command as input for another

    - How to put output of a command in a file for later reference

    - How to append output of multiple commands to a file

    - Input redirection

    - Handling standard error messages

    - Combining redirection of input, output and error streams

    - Output filters


    # ## 5.1. Simple redirections


    # ### 5.1.1. What are standard input and standard output?


    Most Linux commands read input, such as a file or another attribute for the command,
    and write output. By default, input is given with the keyboard, and output is
    displayed on your screen. Your keyboard is your standard input (stdin) device,
    and the screen or a particular terminal window is the standard output (stdout)
    device.


    However, since Linux is a flexible system, these default settings dont necessarily
    have to be applied. The standard output, for example, on a heavily monitored server
    in a large environment may be a printer.


    # ## 5.1.2. The redirection operators


    # ### 5.1.2.1. Output redirection with > and |


    Sometimes you will want to put output of a command in a file, or you may want
    to issue another command on the output of one command. This is known as redirecting
    output. Redirection is done using either the ">" (greater-than symbol), or the
    "|" (pipe) operator which sends the standard output of one command to another
    command as standard input.


    As we saw before, the cat concatenates files and puts them all together to the
    standard output. By redirecting this output to a file, this mine will be created
    - overwritten if it already exists, so take care.


    ```

    nancy:> cat test1

    some words


    ancy:> cat test2

    some other words


    ancy:> cat test1 test2 > test3


    ancy:> cat test3

    some words

    ```'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Introduction to Linux


    some other words


    +   Don''t overwrite! Be careful not to overwrite existing (important) files when
    redirecting output. Many shells, including Bash, have a built-in feature to protect
    you from that risk: *noclobber*. See the Info pages for more information. Bash,
    you would want to add the `set - noclobber` command to your `.bashrc` configuration
    file to prevent accidental overwriting of files.


    Redirecting `->>` to an existing file is equal to emptying the file:


    ```

    nancy->> ls -l list

    -rw-rw-r-- 1 nancy 117 Apr 2 18:09 list

    nancy->> list

    nancy-> ls -l list

    -rw-rw-r-- 1 nancy 0 Apr 4 12:01 list

    ```


    This process is called *truncating*.


    The redirection to a nonexistent file will create a new empty file with the given
    name:


