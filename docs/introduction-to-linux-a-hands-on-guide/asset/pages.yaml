  md: '# 10.4.4.4. Secure remote copying


    The SSH suite provides scp as a secure alternative to the rcp command used to
    be popular when rsh existed. scp uses ssh for data transfer, uses the same authentication
    and provides the same security as ssh. Unlike rcp, scp will ask for passwords
    or passphrases if they are needed for authentication:


    ```

    lenny /var/tmp> scp Schedule.sdc.gz blob:/var/tmp/

    lenny@blob''s password:

    Schedule.sdc.gz 100% |************************************| 100 KB 00:00

    ```


    lenny /var/tmp>

    Any file may contain a host and user specification to indicate that the file is
    to be copied to/from that host. Copies between remote hosts are permitted. See
    the Info pages for more information.


    If you would rather use an FTP-like interface, use sftp:


    # Secure copy or FTP GUIs


    Don''t feel comfortable with the command line yet? Try Konqueror''s capabilities
    for secure remote copy, or install Patty.


    # 10.4.4.5. Authentication keys


    The ssh-keygen command generates, manages and converts authentication keys for
    ssh. It can create RSA keys for use by SSH protocol 1 RSA and DSA keys for use
    by SSH protocol 2.


    Normally each use of SSH with RSA or DSA authentication runs once to create the
    authentication key in $HOME/.ssh/identity,id_da or id_rsa. Additionally, the system
    administrator may use this to generate host keys for the system.


    Normally this program generates the key and asks for a file in to store the private
    key. The public key is stored in a file with the same name but .pub appended.
    The program also asks for a passphrase. The passphrase may be empty to indicate
    no passphrase (host keys must have an empty passphrase), or it may be a string
    of arbitrary length.


    There is no way to recover a lost passphrase. If the passphrase is lost or forgotten,
    a new key must be generated and copied to the corresponding public keys.


    We will study SSH keys in the exercises. All information can be found in the man
    or Info pages.'
