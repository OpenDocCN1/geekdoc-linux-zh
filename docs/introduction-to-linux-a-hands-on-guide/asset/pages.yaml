  md: '# Introduction to Linux


    # 4.1.2.2. Automatic processes


    Automatic or batch processes are not connected to a terminal. Rather these are
    tasks that can be queued into a spooler area, where they wait to be executed on
    a FIFO (first-in, first-out) basis. Such tasks can be executed using one of two
    criteria:


    +   * At a certain date and time: done using the at command, which we will discuss
    in the second part of this chapter.

    * At times the total system load is low enough to accept extra jobs: done using
    the batch command. By default, tasks are put in a queue where they wait to be
    executed until the system load is lower than 0.8. In large environments, the system
    administrator may prefer batch processing when large amounts of data have to be
    processed or tasks demanding a lot of system resources have to be executed on
    an already loaded system. Batch processing is also used for optimizing system
    performance.


    # 4.1.2.3. Daemons


    Daemons are server processes that run continuously. Most of the time, they are
    initialized at system startup and then wait in the background until their service
    is required. A typical example is the networking daemon, xinetd, which is started
    in almost every boot process. After the system is booted, the network daemon just
    sits and waits until a client program, such as an FTP client, needs connect.


    # 4.1.3. Process attributes


    A process has a series of characteristics, which can be viewed with the ps command:


    +   * The process ID or PID: a unique identification used to refer to the process.

    * The parent process ID or PPID: the number of the process (PID) that started
    this process.

    * Nice number: the degree of friendliness of this process toward other processes
    (not to be confused with priority, which is calculated based on this nice number
    and real CPU usage of the process).

    * Terminal or TTY: the terminal to which the process is connected.

    * User name of the real and effective user (RUID and UID): the owner of the process.
    The real user is the issuing command, the effective user is the one granting access
    to resources. RUID and UID are usually the same, and the process has the same
    rights as the issuing user would have. An example to clarify this: the browser
    mozilla in /usr/bin is by user root:


    ```

    ls -l /usr/bin/mozilla

    -rwxr-xr-x 1 root 4996 Nov 20 15:04 /usr/bin/mozilla*

    ```


    ```

    mozilla: ps -af

    ```


    | UID PPID STIME TIME CMD |

    | theo 26601 25609 0 15:04 pts/5 00:00:00 /usr/lib/mozilla-bin |

    | theo 26613 25639 0 15:04 pts/5 00:00:00 -af |


    When user starts this process, it itself and all processes started by the initial
    process, will be owned by user and not by the system administrator. When mozilla
    needs access to certain files, that are determined by user''s permissions and
    not by root''s.


    +   * Real and effective group owner (RGID and EGID): the real group owner of
    a process is the primary group of the user who started the process. The effective
    group owner is usually the same, except SGID access mode has been applied to a
    file.


