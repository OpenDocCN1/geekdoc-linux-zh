    # 7.4.3. Date and time zone


    Setting information is usually done at installation time. After that, it can be
    kept up to date using NTP (Network Time Protocol) client. Most Linux systems run
    ntpd by default:


    ```

    debyans-> ps -ef | grep ntpd

    tp     24678 1 0 2002 ?       00:00:30 ntpd -U ntp

    ```


    You can run ntpdate manually to set the time, on condition that you can reach
    a server. The ntpd daemon should not be running when you adjust the system ntpdate.
    Use a time server as argument to the command:


    ```

    rootbox:~# ntpdate 10.2.5.200

    26 Oct 14:35:42 ntpdate[20364]: adjust time server 10.2.5.200 offset

    -0.008048 sec

    ```


    See your system manual and the documentation that comes with the NTP package.
    Most desktop managers include tools to set the system time, providing that you
    have access to the system administrator''s account.


    For setting the time correct, you can use config | timezone commands. Timezone
    information is usually set during the installation of your machine. Many systems
    have distribution-specific tools to configure, see your system documentation.


    # 7.4.4. Language


    If you''d read your messages from the system in Dutch or French, you may want
    to set the LANG and LANGUAGE environment variables, enabling locale support for
    the desired language and eventually the fonts related to character conventions
    in that language.


    With most login systems, the default tends to be en_US.UTF-8 these days. You have
    the possibility to configure these language settings before logging in.


    Note that on most systems, the default will also come with all the programs supporting
    this. Thus, you can edit all the files using your cat or when open a UTF-8 encoded
    file on a system supporting only 1-byte characters. The recode utility might come
    in handy to convert files from one character to another. Read the man pages for
    an overview of features and usage. Another solution might be temporarily work
    with another encoding definition, setting the LANG environment variable:


    ```

    debyans-> acread /var/tmp/51434.pdf

    Warning: charset "UTF-8" not supported, using "ISO8859-1"

    Aborted

    ```


    ```

    debyans-> set | grep UTF

    LANG=en_US.UTF-8

    ```


    ```

    debyans-> export LANG=en_US

    ```


