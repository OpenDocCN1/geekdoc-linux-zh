  md: '# Introduction to Linux


    Many commercial applications are available for Linux, and for more information
    about these packages we refer to their specific documentation. Throughout this
    guide we will only discuss freely available software, which comes (in most cases)
    with a GNU license.


    To installing or new packages, you will need some form of software management.
    The most common implementations include RPM and dpkg. RPM is the RedHat Package
    Manager, which is used on a variety of Linux systems, even the name does not suggest
    this. Dpkg is the Debian package management system, which uses an interface called
    apt-get, can manage RPM packages as well. Novell Red Carpet is a third party implementation
    of RPM with a graphical front-end. Other third party software vendors may have
    their own installation procedures, sometimes resembling the InstallShield and,
    as known as MS Windows and other platforms. As you advance into Linux, you will
    likely get in touch with one or more of these programs.


    # 1.5.2. GNU/Linux


    The Linux kernel (the bones of your system, see Section 3.2.3.1) is not part of
    the GNU project but uses the same as GNU software. A great majority of utilities
    and development tools (the meat of your system), which are not Linux-specific,
    are taken from the GNU project. Because any usable system must contain the kernel
    and at least a minimal set of utilities, some people argue that such a system
    should be called a GNU/Linux system.


    In order to obtain the highest possible degree of independence between distributions,
    this is the sort of Linux that we will discuss throughout this course. If we are
    not talking about a GNU/Linux system, the specific distribution, version or name
    will be mentioned.


    # 1.5.3. Which distribution should I install?


    Prior to installation, the most important factor is your hardware. Since every
    Linux distribution contains the basic packages and can be built to meet almost
    any requirement (because they all use the Linux kernel), you only need to consider
    if the distribution will run on your hardware. LinuxPPC for example has run on
