    | until | unalias | until | unalias | Remove aliases |

    | while/do | while/do | while/do | while | Begin until loop |


    The Bourne Again Shell has many more features not listed. This table is just to
    give you an idea of how this shell incorporates all useful ideas from other shells;
    there are no blanks in the column for **bash**. More information on features found
    only in Bash can be retrieved from the Bash info pages, in the "Bash Features"
    section.


    More information:


    You should at least read one manual, the manual of your shell. The preferred choice
    would be **info bash, bash** the GNU shell and easiest for beginners. Print it
    out and take it home, study it whenever you have 5 minutes.


    See **Appendix B** if you are having difficulties to assimilate shell commands.'
