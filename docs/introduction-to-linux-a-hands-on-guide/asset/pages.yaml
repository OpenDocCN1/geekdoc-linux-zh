  md: '# Introduction to Linux


    # 7.5.3. Automating package management and updates


    # 7.5.3.1. General remarks


    The first thing you do after installing a new system is applying updates; this
    applies to all operating systems and Linux is not different.


    The updates for most Linux systems can usually be found on a nearby site mirroring
    your distribution. Lists of sites offering this service can be found at your distribution''s
    web site, Appendix A.


    Updates should be applied regularly, if possible - but every couple of weeks would
    be a reasonable start. You really should try to have the most recent version of
    your distribution, since Linux changes constantly. As we said before, new features,
    improvements and bug fixes are applied at a steady rhythm, and important security
    problems are addressed.


    The good news is that most Linux distributions provide tools so that you don''t
    have to upgrade tens of packages by hand. The following sections give an overview
    of package manager managers. There is much more to this subject, even regular
    updates of source packages are manageable automatically; we only list the most
    commonly known systems. Always refer to the documentation for your specific distribution
    for advised procedures.


    # 7.5.3.2. APT


    The Advanced Package Tool is a management system for software packages. The command
    line tool for handling packages is apt-get, with an excellent man page describing
    how to install and upgrade singular packages or with your entire distribution.
    APT has roots in the Debian GNU/Linux distribution, where it is the default manager
    for the Debian packages. APT has been ported to work with RPM packages as well.
    The main advantage of APT is that it is free and flexible to use. It will allow
    you to set up systems similar to the distribution specific (and in some cases
    commercial) ones listed in the next sections.


    Generally, when first using apt-get, you will need to get an index of the available
    packages. This is done using


    ```

    apt-get update

    ```


    After that, you can use apt-get to upgrade your system:


    ```

    apt-get upgrade

    ```


    Do this often, it''s an easy to keep your system up-to-date and stay safe.


    Apart from this general usage, apt-get is also very fast for installing individual
    packages. This is how it works:


    ```

    [david@jupiter ~] su -c "apt-get install xnow"

    Password:

    Reading Package Lists... Done

    Building Dependency Tree... Done

    The following NEW packages will be installed:

    xnow

    ```'
