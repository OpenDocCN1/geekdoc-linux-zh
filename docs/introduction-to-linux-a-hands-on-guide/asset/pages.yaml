    # 3.4.2.4. Changing user and group ownership


    When a file is owned by the wrong user or group, the error can be repaired with
    the chown (change owner) and chgrp (change group) commands. Changing file ownership
    is a frequent system task in environments where files need to be in a group. Both
    commands are very flexible, and you can find out by using the --help option.


    The chown command can be applied to both user and group ownership of a file, while
    chgrp only changes group ownership. Of course the system will check if the user
    is using one of these commands has sufficient permissions on the file(s) she wants
    to change.


    In order to change the user ownership of a file, use this syntax:


    ```

    chown newuser file

    ```


    If you use a colon after the user name (see the Info pages), group ownership will
    be changed as well, to the primary group of the user using the command. On a Linux
    system, each user has its own group, so this from can be used to make files:


    ```

    jacky-> id

    uid=1304 (jacky) gid=1304 groups=1304(jacky),2034(pproject)


    jacky-> ls -l my_report

    -rw-r--r-- 1 jacky project 29387 Jan 15 09:34 my_report


    jacky-> chown jacky: my_report


    jacky-> chmod o-r my_report


    jacky-> ls -l my_report

    -rw-r--r-- 1 jacky jacky 29387 Jan 15 09:34 my_report

    ```


    If you want to like this file, without having to give everybody permission to
    write it, he can use the chgrp command:


    ```

    jacky-> ls -l report-200201115.xls

    -rw-rw---- 1 jacky 45635 Jan 15 09:35 report-200201115.xls


    jacky-> chgrp project report-200201115.xls


    jacky-> chmod o= report-200201115.xls


    jacky-> ls -l report-200201115.xls

    -rw-rw--r 1 jacky project 45635 Jan 15 09:35 report-200201115.xls

