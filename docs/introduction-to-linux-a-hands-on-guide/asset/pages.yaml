  md: '# Introduction


    # 1. Why this guide?


    Many people still believe that learning Linux is difficult, or that only experts
    can understand how a Linux system works. Though there a lot of free documentation
    available, the documentation is widely scattered on the Web, and often confusing,
    since it is usually oriented toward experienced UNIX or Linux users. Today, thanks
    to the advancements in development, Linux has grown in popularity at home and
    at work. The goal of this guide is to show people of all ages that Linux can be
    simple and fun, and used for all kinds of purposes.


    # 2. Who should read this book?


    This guide was created as an overview of the Linux Operating System, geared toward
    new users as an exploration tour and starting guide, with exercises at the end
    of each chapter. For more advanced trainees it can be a desktop reference, and
    a collection of the base knowledge needed to proceed with system and network administration.
    This book contains many real life examples derived from the author''s experience
    as a Linux system and network administrator, trainer and consultant. We hope these
    examples will help you get a better understanding of the Linux system and that
    you feel encouraged to try out things on your own.


    Everybody who wants to get a "CLUE", a Command Line User Experience, with Linux
    (and UNIX in general) will find this book useful.


    # 3. New versions and availability


    This document is published in the Guides section of the Linux Documentation Project
    collection at http://www.tldp.org/guides.html; you can also download PDF and PostScript
    versions here.


    The most recent edition is available at http://tille.garrels.be/training/tldp/.


    The second edition of this guide is available in print from Fultus Books as paperback
    Print On Demand (POD) book. Fultus distributes this document through Ingram &
    Baker Taylor to many bookstores, including Amazon.com, Amazon.co.uk, BarnesAndNoble.com
    and Google''s Froogle global shopping portal and Google Book Search.


    Figure 1. Introduction to Linux front cover'
