  md: '# Introduction to Linux


    There are also tens of web mail applications available, such as Squirrelmail,
    Yahoo! mail, gmail from Google and Hotmail.


    An overview is available via the Linux Mail User HOWTO.


    Most Linux distributions include fetchmail, a mail-retrieval and forwarding utility.
    It fetches mail from remote servers (POP, IMAP and some others) and forwards it
    to your local delivery system. You can then handle the retrieved mail using normal
    mail clients. It can run in daemon mode to repeatedly poll one or more systems
    at a specific interval. Information and usage examples can be found in the Info
    pages; the directory /usr/share/doc/fetchmail[<-version>] contains a full list
    of features and a FAQ for beginners.


    The procmail filter can be used for filtering incoming, for creating lists, to
    pre-process mail, to selectively forward mail and the accompanying formal program,
    among others, enables generation of auto-replies and splitting mailboxes. Procmail
    is a very robust system, designed to work even in the worst circumstances. More
    information may be found in the /usr/share/doc/procmail[<-version>] directory
    and in the main pages.


    +   A note on E-mail Etiquette


    Some people do seem to think that an e-mail message shouldn''t be too formal.
    That depends, of course. If you are writing to someone you don''t know, keep some
    distance, just like you would in a traditional letter. And don''t forget: people
    you don''t know might be male or female...


    # 10.3.3. Web


    # 10.3.3.1. The Apache Web Server


    Apache is by far the most popular web server, used on more than half of all Internet
    servers. Most Linux distributions include Apache. Apache''s advantages include
    its modular design, SSL support, stability and speed. Given the appropriate hardware
    and configuration it can support the highest loads.


    On Linux systems, the server configuration is usually done in the /etc/httpd directory.
    The most important configuration file is httpd.conf; it is rather self-explanatory.
    Should you need help, you can find it in the httpd page or on the Apache website.


    # 10.3.3.2. Web browsers


    A number of web browsers, both free and commercial, for the Linux platform. Netscape
    Navigator as the only decent option has been a thing of the past, as Mozilla/Firefox
    offers a competitive alternative running on many other operating systems, like
    as Windows and MacOS X as.


    Amaya is the W3C browser. Opera is a commercial browser, compact and fast. Many
    desktop managers offer web browsing features in their file manager, nautilus.


    Among the popular text based browsers are lynx and links. You may need to define
    proxy servers in your shell, by setting the appropriate variables. Text browsers
    are fast and handy when no graphical environment is available, as used in scripts.


    Chapter 10. Networking'
