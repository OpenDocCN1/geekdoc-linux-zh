    have the prompt every time you issue a command, although this gets boring pretty
    soon. More

    information can be found in the Bash-Prompt HOWTO.


    # 7.2.5. Shell scripts


    # 7.2.5.1. What are scripts?


    A shell script is, as we saw in the shell configuration examples, a text file
    containing shell commands. When

    such a file is used as the first non-argument option when invoking Bash, neither
    the -c nor -s option is

    supplied, Bash reads and executes commands from the file, then exits. This mode
    of operation creates a

    non-interactive shell. When Bash runs a script, it sets the shell parameter 0
    to the name of the file,

    rather than the name of the script, and the positional parameters (everything
    following the name of the script)

    set to the remaining arguments, if there are any. If no additional arguments are
    supplied, the positional

    arguments are unset.


    A shell script may be executable by using the chmod command to turn on the execute
    bit. When Bash

    inds such a file while searching the PATH for a command, it spawns a sub-shell
    to execute it. In other words,

    uting


    # filename ARGUMENTS


    is equivalent to executing


    # bash filename ARGUMENTS


    "filename" an executable shell script. This sub-shell reinitializes itself, so
    that the effect is as if a new

    s had been invoked to interpret the script, with the exception that the locations
    of commands remembered

    by the parent (bash in the Info pages) are retained by the child.


    Most versions of UNIX make this part of the operating system''s command execution
    mechanism. If the first

    of a line begins with the two characters #!, the remainder of the line specifies
    an interpreter for the

    program. Thus, you can specify bash, awk, perl or some other interpreter and write
    the rest of the

    script in that language.


    The arguments to the interpreter consist of a single option following the interpreter
    name on the

    line of the script file, followed by the name of the script file, followed by
    the rest of the arguments. Bash

    will perform this action on operating systems that do not handle it themselves.


    Bash scripts often begin with


    ```

    #!/bin/bash

    ```


    (assuming Bash has been installed in /bin), since this ensures that Bash will
    be used to interpret

    script, if it is executed under another shell.


