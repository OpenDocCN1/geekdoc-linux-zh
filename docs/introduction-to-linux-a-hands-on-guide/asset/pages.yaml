  md: '# Introduction to Linux


    As soon as a connection is received, the central server will start an instance
    of the required server. Thus, in the example below, when user bob starts an FTP
    session to the local host, an FTP daemon is running as long as the session is
    active:


    ```

    bob:~ ps auxw | grep ftp

    bob 793 0.1 0.2 3960 176/6 S 16:44 0:00 nctfp localhost

    ftp 794 0.7 0.5 5588 2608 0 SN 16:44 0:00 ftppd

    localhost.localdomain: anonymous/bob@his.server.com: IDLE.

    ```


    Of course, the same happens when you open connections to remote hosts: either
    a daemon answers, or a remote (xinetd) starts the service you need and stops it
    you quit.


    # ## 10.3. Mail


    # ### 10.3.2. Servers


    Sendmail is the standard mail server program or Mail Transport Agent for UNIX
    platforms. It is robust, scalable, and when properly configured with appropriate
    hardware, handles thousands of users without blinking. More information about
    how to configure Sendmail is included with the sendmail and sendmail-packages,
    you may want to read the README and README.cf files in /usr/share/doc/sendmail.
    The man sendmail and mail aliases are also used.


    Qmail is another mail server, gaining popularity because it claims to be more
    secure than Sendmail. While Sendmail is a monolithic program, Qmail consists of
    smaller interacting program parts that can be better secured. Postfix is another
    mail server which is gaining popularity.


    These servers handle mailing lists, filtering, virus scanning and much more. Free
    and commercial scanners are available for use with Linux. Examples of mailing
    software are Mailman, Listerv, Majordomo and EZmlm. See the web page of your favorite
    virus scanner for information on Linux client and server support. Amavis and Spassassin
    are free implementations of a virus scanner and a spam scanner.


    # #### 10.3.2.2. Remote mail servers


    The most popular protocols to access mail remotely are POP3 and IMAP4. IMAP and
    POP both allow offline operation, remote access to new mail and they rely on an
    SMTP server to send mail.


    While POP is a simple protocol, easy to implement and supported by almost any
    mail client, IMAP is to be preferred because:


    +   * It can manipulate persistent message status flags.

    * It can store as well as fetch mail messages.

    * It can access and manage multiple mailboxes.

    * It supports concurrent updates and shared mailboxes.

    * It is also suitable for accessing Usenet messages and other documents.

    * IMAP works both on-line and off-line.

    * it is optimized for on-line performance, especially over low-speed links.'
