    important enough to be the same on every Linux system, as PATH and HOME.


    # 7.2.1.2. Exporting variables


    An individual variable''s content is usually displayed using the echo command,
    as in these examples:


    ```

    debugby-> echo $PATH

    usr/bin:/usr/sbin:/usr/bin:/usr/X11R6/bin:/usr/local/bin

    ```


    ```

    deby-> echo $MANPATH

    usr/man/share/man:/usr/local/man:/usr/X11R6/man

    ```


    If you want to change the content of a variable in a way that is useful to other
    programs, you have to export the new value from your environment to the environment
    that runs them programs. A common example is exporting the PATH variable. You
    may declare it as follows, in order to be able to play with the flight simulator
    software that is in /opt/FlightGear/bin:


    ```

    debugby-> $PATH:/opt/FlightGear/bin

    ```


    This instructs the shell to only search programs in the current path, $PATH, but
    also in the additional directory /opt/FlightGear/bin.


    However, as the new value of the PATH is not known to the environment, things
    will still not work:


    ```

    debugby-> runfgrfs

    bash: runfgrfs: command not found

    Exporting variables is done using the built-in command export:

    ```


    ```

    debugby-> export PATH

    ```


    ```

    debugby-> runfgrfs

    --flight starts--

    ```


    In Bash, we normally do this in one elegant step:


    ```

    export VARIABLE=value

    ```


    The same technique used for the MANPATH variable, tells the man command to look
    for compressed pages. If new software is added to the system in new or unusual
    directories, if you want to read the pages of the new environment, extend the
    MANPATH variable:


    ```

    debugby-> export $MANPATH:/opt/FlightGear/man

    ```


    ```

    debugby-> echo $MANPATH

    usr/man/share/man:/usr/local/man:/usr/X11R6:/opt/FlightGear/man

    ```


    You can avoid retyping this command in every window you open by adding it to to
    one of your shell setup files, see Section 7.2.2.


