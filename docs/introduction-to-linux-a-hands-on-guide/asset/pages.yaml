    There are a couple of cases in which **init** becomes the parent of a process,
    while the process was not started by **init**, as we already saw in the **pstree**
    example. Many programs, for instance, *daemonize* their child processes, so they
    can keep on running when the parent stops or is stopped. A window manager is a
    typical example; it starts an *xterm* process that generates a shell that accepts
    commands. The window manager denies any further responsibility and passes the
    child process to **init**. Using this mechanism, it is possible to change window
    managers without interrupting applications.


    Every now and then things go wrong, even in good families. In an exceptional case,
    a process might finish while the parent does not wait for the completion of this
    process. Such an unfinished process is called a *zombie*.


    # #### 4.1.5.2. Ending processes


    When a process runs normally (it is not killed or otherwise unexpectedly interrupted),
    the program returns its *exit status* to the parent. This exit status is a number
    returned by the parent providing the results of the program''s execution. The
    system of returning information upon executing a job has its origin in the C programming
    language used in UNIX has been written.


    The return codes can be interpreted by the parent, or in scripts. The values of
    the return codes are program-specific. This information can usually be found in
    the man pages of the program, for example the **grep** command returns -1 if no
    matches are found, upon which a message on the lines of "No files found" can be
    printed. Another example is the Bash command **true**, which does nothing except
    return an exit status of 0, meaning success.


