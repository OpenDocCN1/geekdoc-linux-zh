    Then print the PostScript file. If a default print destination is configured for
    your system/account, you can change the man -t command to send the formatted page
    to the printer directly.


    # 8.1.2.2. Previewing formatted files


    Anything that you send to the printer can be seen on the screen or as well. Depending
    on the file format, you can use one of these commands:


    +   * PostScript files: with the g (GhostView) command.

    * TeX dvi files: with xdv, kdf, gddv or Adobe''s kdvi.

    * PDF files: xpdf, kpdf, gpdf or Adobe''s viewer, are also available but for free
    software. Adobe''s reader supports PDF 1.6, the others only support PDF versions
    up to 1.5. The version of a PDF file can be determined using the file command.

    * From within applications, such as Firefox or OpenOffice, you can usually select
    Print Preview from one of the menus.


    # 8.2. The server side


    # 8.2.1. General


    Until a couple of years ago, the choice for Linux users was simple: everyone ran
    the same old LPD from BSD? Net-2 code. LPRng became more popular, but nowadays
    most modern Linux distributions use CUPS, the common UNIX Printing System. CUPS
    is an implementation of the Internet Printing Protocol (IPP), an HTTP-like RFC
    replacement protocol for the venerable (and clunky) LPD protocol.


