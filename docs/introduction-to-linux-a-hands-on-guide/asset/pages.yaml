    If you want to stop a process because it hangs or is totally borky in the way
    of the I/O consumption, file creation or of other system resources, use the kill
    command. If you have the opportunity, first try to kill the process softly, sending
    the SIGTERM signal. This is an instruction to terminate whatever it is, according
    to the procedures described in the code of the program:


    ```

    joe: ps -ef | grep mozilla

    joe 25822 1 0 Marill ? 00:34:04 /usr/lib/mozilla-1.4.1/mozilla

    ```


    ```

    joe: kill -15 25822

    joe stopped his Mozilla browser because it hung.

    ```


    Some processes are a little harder to get rid of. If you have them, you might
    want to send them the SIGINT to interrupt them. If that does not work use the
    strongest signal, SIGKILL. In the example below, stop a Mozilla that is frozen:


    ```

    joe: ps -ef | grep mozilla

    joe 25915 1 0 Marill ? 00:15:06 /usr/lib/mozilla-1.4.1/mozilla

    ```


    ```

    joe: kill -9 25915

    joe: ps -ef | grep 25915

    joe 2634 32273 0 18:09 pts/4 00:00:00 grep 25915

    ```


    In such cases, you might want to check that the process is really dead, using
    the grep filter after the PID. If this only runs the grep process, you can be
    sure that you succeeded in stopping the process.


    Among processes that are hard to kill is your shell. And that is a good thing:
    if they would be easy to kill, you would lose your shell every time you press
    Ctrl-C on the command line accidentally, since this is equivalent to sending a
    SIGINT.


