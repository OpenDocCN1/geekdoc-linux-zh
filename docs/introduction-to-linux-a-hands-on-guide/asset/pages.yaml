  md: '# Chapter 9. Fundamental Backup Techniques


    Accidents will happen sooner or later. In this chapter, we''ll discuss how to
    get data to a safe place using other hosts, floppy disks, CD-ROMs and tapes. We
    will also discuss the most popular compressing and archiving commands.


    Upon completion of this chapter, you will know how to:


    +   * Make query and unpack file archives

    -* Handle floppy disks and make a boot disk for your system

    -* Write CD-ROMs

    -* Make incremental backups

    -* Create Java archives

    -* Find documentation to use other backup devices and programs

    -* Encrypt your data


    # 9.1. Introduction


    Although Linux is one of the safest operating systems in existence, and even if
    it is designed to keep going, data can get lost. Data loss is most often the consequence
    of user errors, but occasionally a system fault, such as a power or disk failure,
    is the cause, so it''s always a good idea to keep an extra copy of sensitive and/or
    important data.


    # 9.1. Preparing your data


    # 9.1.1.1. Archiving with tar


    In most cases, we will first collect all the data to back up in a single archive
    file, which we will compress later. The process of archiving involves concatenating
    all listed files and taking out unnecessary blanks. In Linux, this is commonly
    done with the tar command. tar was originally designed to archive data on tapes,
    but it can also make archives, known as tarballs.


    tar has many options, the most important ones are cited below:


    +   * -v: verbose

    -* -t: test, shows content of a tarball

    -* -x: extract archive

    -* -c: create archive

    -* -f archivedevice: use archivedevice as source/destination for the tarball,
    defaults to the first tape device (usually /dev/st0 or similar)

    -* -j: filter through bzip2, see Section 9.1.1.2


    It is common to use the dash-prefix with tar options, as you can see from the
    examples below.


    > Use GNU tar for compatibility


    The archives made with a proprietary tar version on one system, may be incompatible
    with tar on another system. This may cause much headaches, such as if the archive
    needs to be'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Introduction to Linux


    on a system that doesn''t exist anymore. Use the GNU tar version on all systems
    to prevent your system admin from bursting into tears. Linux always uses GNU tar.
    When working on other UNIX machines, tar --help to find out which version you
    are using. Contact your system admin if you don''t know the GNU tar name.


    In the example below, an archive is created and unpacked.


    ```

    gaby-> ls images/

    me+tux.jpg nimf.jpg


    gaby-> tar cvf images-in-a-dir.tar images/

    images/

    images/nimf.jpg

    images/me+tux.jpg


    gaby-> cd images


    gaby</images> tar cvf images-without-a-dir.tar *.jpg

    me+tux.jpg

    nimf.jpg


    gaby</images> cd


    gaby-> ls *.tar

    images-without-a-dir.tar


    gaby-> ls *.tar

    images-in-a-dir.tar


    gaby-> tar xvf images-in-a-dir.tar

    images/

    images/nimf.jpg

    images/me+tux.jpg


    gaby-> tar tvf images/without-a-dir.tar

    -rw-r--r-- gaby/gaby 42888 1999-06-30 20:52:22 me+tux.jpg

    -rw-r--r-- gaby/gaby 7578 2000-01-26 12:58:46 nimf.jpg


    gaby-> tar xvf images/without-a-dir.tar

    me+tux.jpg

    nimf.jpg


    gaby-> ls *.jpg

    me+tux.jpg nimf.jpg

    ```


    This example also illustrates the difference between a tar directory and a bunch
    of tar files. It is advisable to only compress, so files don''t get all when unpacking
    the tarball (which may be on another system, where you may not know files were
    already there and which are the ones from the archive).


    When a tape drive is connected to your machine and configured by your system administrator,
    the file ending in .tar are replaced with the tape device name, for example:


    ```

    tar cvf /dev/tapemail/

    ```


    The directory mail and all the files it contains are compressed into a file that
    is written on the tape immediately. A content listing is displayed because we
    use the verbose option.


    Chapter 9. Fundamental Backup Techniques'
