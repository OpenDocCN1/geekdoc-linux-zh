  md: '# Introduction to Linux


    Try to avoid logging in with or using the system administrator’s account, root.
    Besides doing your normal work, most tasks, including checking the system, collecting
    information etc., can be executed by a normal user account with no special permissions
    at all. If needed, for instance, when creating a new user or installing new software,
    the preferred way of obtaining root access is by switching user IDs, Section 3.2.1
    for an example.


    Almost all commands in this book can be executed without system administrator
    privileges. In most cases, when issuing a command or starting a program as a non-privileged
    user, the system will warn you or prompt you for the root password when root access
    is required. Once you’re done, leave the application or session that gives you
    privileges immediately.


    Reading documentation should become your second nature. Especially in the beginning,
    it is important to read system documentation, manuals for basic commands, HOWTO
    and so on. Since the amount of documentation is so enormous, it is impossible
    to include all related documentation. This book will try to guide you to the most
    appropriate documentation on every subject discussed, in order to stimulate the
    habit of reading the main pages.


    # 2.2.3. Using Bash features


    Several key combinations allow you to do things easier and faster with the GNU
    shell, Bash, which is the default on any Linux system, Section 3.2.3.2. Below
    is a list of the most commonly used features; you are strongly suggested to make
    a habit out of using them, so as to get the most out of your Linux experience
    from the very beginning.


    | Key or key combination | Function |

    | Ctrl+A | Move cursor to the beginning of the command line. |

    | Ctrl+C | End a running program and return the prompt, see Chapter 4. |

    | Ctrl+D | Log out of the current shell session, equal to typing exit or logout.
    |

    | Ctrl+E | Move cursor to the end of the command line. |

    | Ctrl+H | Generate backspace character. |

    | Ctrl+L | Clear this terminal. |

    | Ctrl+R | Search command history, see Section 3.3.3.4. |

    | Ctrl+Z | Suspend a program, see Chapter 4. |

    | ArrowLeft and ArrowRight | Move the cursor to the left or right on the command
    line, so that you can insert characters at other places than just the beginning
    and the end. |

    | ArrowUp and ArrowDown | Browse history. Go to the line you want to repeat, edit
    details if necessary, and press Enter to save. |

    | Shift+PageUp and Shift+PageDown | Browse terminal buffer (to see that has "scrolled
    off" the screen). |

    | Tab | Command or file completion: when many choices are possible, the system
    will either signal with an audio or visual bell, or, if too many choices are possible,
    ask you if you want to see them all. |

    | Tab Tab | Shows file or command completion possibilities. |


