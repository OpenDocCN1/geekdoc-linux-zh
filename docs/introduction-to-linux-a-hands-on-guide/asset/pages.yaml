  md: '# Introduction to Linux


    Pressing the Esc key switches back to command mode. If you''re not sure what mode
    you''re in because you use a really old version of vi that doesn''t display an
    "INSERT" message, type Esc and you''ll be sure to return to command mode. It is
    possible that the system gives a little alert when you are already in command
    mode hitting Esc, by beeping or giving a visual bell (a flash on the screen).
    This is normal behavior.


    # 6.2.3. The easy way


    Instead of reading the text, which is quite boring, you can use the vimutor to
    learn your Vim commands. This is a thirty minute tutorial that teaches the most
    basic Vim functionality in easy exercises. While you can learn everything about
    vim in just an hour, the tutor is designed to describe enough of the commands
    that you will be able to use Vim as an all-purpose editor.


    In UNIX and MS Windows, if Vim has been properly installed, you can start this
    program from the shell or command line, Open vimutor. This will make a copy of
    the tutor file, so you can edit it without the risk of damaging the original.
    There are a few translated versions of the tutor. To find out if yours is available,
    use the two-letter language code. For French this would be vimutor fx (if installed
    on the system).


    # 6.3. Linux in the office


    # 6.3.1. History


    Throughout the last decade the office domain has typically been dominated by MS
    Office, and let''s face it: the Microsoft Word, Excel and Powerpoint are industry
    standards that you will have to deal with sooner or later.


    This monopoly of Microsoft proved to be a big disadvantage for new users to Linux,
    so a group of German developers started the StarOffice project, which was, and
    still is, aimed at making an MS Office clone. Their company, StarDivision, was
    acquired by Microsystems by the early of the 1990s, just before the 5.2 release.
    Sun continues development but restricted access to the sources, which had to rename
    to project OpenOffice. OpenOffice is now available for a variety of platforms,
    including MS Windows, Linux, MacOS and Solaris. There is a screenshot in Section
    1.3.2.


    Almost simultaneously, a couple of other famous projects took off. Also a very
    common alternative to using MS Office is KOffice, the office suite that used to
    be popular among SuSE users. Like the original, this clone incorporates an MS
    Word and Excel compatible, and much more.


    Smaller projects deal with particular programs of the MS example suite, such as
    Abiword and MS Wordview for compatibility with MS Word documents, and Gnumeric
    for viewing and creating Excel compatible spreadsheets.


    # 6.3.2. Suites and programs


    Current distributions usually come with all the necessary tools. Since these excellent
    guidelines and searchable indexes in the Help menu, we won''t discuss them in
    detail. For references, see you system documentation or the web sites of the projects,
    such as


    +   - http://www.openoffice.org


