  md: '# Introduction to Linux


    # 9.1.1.4. Java archives


    The GNU project provides us with the jar for creating Java archives. It is a Java
    application that combines multiple files into a single JAR archive file. While
    also being a general purpose archiving and compression tool, based on ZIP and
    the ZLIB compression format, jar was mainly designed to facilitate the packing
    of Java code, apps and/or in a single file. When combined in a single archive,
    the components of a Java application, can be downloaded much faster.


    Unlike tar, jar compresses by default, independent from other tools - because
    it is basically the Java version of zip. In addition, allows individual entries
    in an archive to be signed by the author, so origins can be authenticated.


    The syntax is almost identical for the tar command, we refer to info jar for specific
    differences.


    +   - tar, jar and symbolic links

    One noteworthy feature not mentioned in the standard documentation is that jar
    will follow symbolic links. Data to which these links will be included in the
    archive. The default in tar is to only backup the symbolic link, but this behavior
    can be changed using the -h to tar.


    # 9.1.1.5. Transporting your data


    Saving copies of your data on another host is a simple but accurate way of making
    backups. See Chapter 10 for more information on scp, ftp and more.


    In the next section we''ll discuss local backup devices.


    # 9.2. Moving your data to a backup device


    # 9.2.1. Making a copy on a floppy disk


    # 9.2.1.1. Formatting the floppy


    On most Linux systems, users have access to the floppy disk device. The name of
    the device may vary depending on the size and number of floppy drives, contact
    your system admin if you are unsure. On some systems, there will likely be a /dev/floppy
    pointing to the right device, reality /dev/fd0H144 (for 1,44MB floppies).


    dformat is the low-level floppy disk formatting tool. It has the name of the floppy
    disk as an option. dformat will display an error when the floppy is write-protected.


    ```

    emma-> dformat /dev/fd0H140

    Double-sided, 80 tracks, 18 sec/track. Total capacity 1440 kb.

    Formatting ... done

    Verifying ... done

    emma->

    ```


    The mformat command (from the mtools package) is used to create DOS-compatible
    floppies which can be accessed using the mcopy, mdir and other commands.


