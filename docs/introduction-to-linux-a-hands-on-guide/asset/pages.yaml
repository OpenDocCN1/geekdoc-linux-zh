  md: '# 2.2. Absolute basics


    # 2.2.1. The commands


    These are the quickies, which we need to get started; we will discuss them later
    in more detail.


    Table 2-1. Quickstart commands


    | Command | Meaning |

    | --- | --- |

    | ls | Displays a list of files in the current working directory, like the dir
    command in DOS |

    | cd directory | change directories |

    | password | change the password for the current user |

    | file filename | display file type of file with name |

    | cat textfile | throws content of textfile on the screen |

    | pwd | present working directory |

    | exit or logout | leave this session |

    | man command | read man pages on command |

    | info command | read info pages on command |

    | apropos string | search the whatis database for strings |


    # 2.2.2. General remarks


    You type these commands after the prompt, in a terminal window in graphical mode
    or in text mode, followed by Enter.


    Commands can be identified by themselves, such as ls. A command behaves different
    when you specify an option, usually preceded with a dash (-), as in ls -a. The
    same option character may have a different meaning for another command. GNU programs
    take long options, preceded by two dashes (--), like ls --all. Some commands have
    no options.


    The argument(s) to a command specifications for the object(s) on which you want
    the command to take effect. An example is ls /etc, where the directory /etc is
    the argument to the ls command. This indicates that you want to see the content
    of that directory, instead of the default, which would be the content of the current
    directory, obtained by just typing ls followed by Enter. Some commands require
    arguments, sometimes arguments.


    You can find out whether a command takes options and arguments, and which ones
    are valid, by checking the online help for that command, Section 2.3.


    In Linux, like in UNIX, directories are separated by forward slashes, like the
    ones used in web addresses (URLs). We will discuss directory structure in-depth
    later.


    The symbols , . have special meaning when directories are concerned. We will try
    to find out about during the exercises, and more in the next chapter.


    Chapter 2. Quickstart'
