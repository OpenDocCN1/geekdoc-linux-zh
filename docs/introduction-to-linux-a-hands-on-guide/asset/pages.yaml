    # 4.3.5.4. I/O resources


    I/O limitations are a major cause of stress for system admins, the Linux system
    offers poor utilities to measure I/O performance. The **ps**, **vmstat** and **top**
    give some indication about how many programs are waiting for I/O; **netstat**
    displays interface statistics, but there are virtually no tools available to measure
    the I/O response to load, and the **iostat** command gives a brief overview of
    general I/O usage. Various graphical front-ends exist to put the output of these
    commands in a human understandable form.


    Each device has its own problems, the bandwidth available to network interfaces
    and the bandwidth available to disks are the two primary causes of bottlenecks
    in I/O performance.


    Network I/O problems:


    +   - Network overload:

    The amount of data transported over the network is larger than the network''s
    capacity, resulting in slow execution of every network related task for all users.
    They can be solved by cleaning up the network (which involves disbabling protocols
    and services that you don''t need) or reconfiguring the network (for example of
    subnets, replacing hubs with switches, upgrading interfaces and equipment).

    - Network integrity problems:

    Occurs when data is transferred incorrectly. Solving this kind of problem can
    only be done by isolating the faulty element and replacing it.


    Disk I/O problems:


    +   - per-process transfer rate too low:

    - Read or write speed for a single process is not sufficient.

    - aggregate transfer rate too low:


    The total bandwidth that the system can provide to all programs that run is not
    enough.


    This kind of problem is more difficult to detect, and usually takes extra hardware
    in order to re-divide data over buses, controllers and disks, if overloaded hardware
    is the cause of the problem. One solution to solve this is a RAID array configuration
    optimized for input and output actions. When you get to keep the same hardware.
    An upgrade to faster buses, controllers and disks is usually the other option.


    If overload is not the cause, maybe your hardware is gradually failing, or not
    well connected to the system. Check contacts, connectors and plugs to start with.


