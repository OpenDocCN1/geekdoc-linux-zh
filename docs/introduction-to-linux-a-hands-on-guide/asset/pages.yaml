  md: '# Introduction to Linux


    # ## 3.3. Manipulating files


    # ### 3.3.1. Viewing file properties


    # #### 3.3.1.1. More about ls


    Beside the name of ls, Is can give a lot of other information, such as the file
    type, as we already discussed. It can also show permissions on a file, file size,
    inode number, creation date and time, owners and amount of links to the file.
    With the -a option to ls, files that are normally hidden from view can be displayed
    as well. These files that have a name starting with a dot. A couple of typical
    examples include the configuration files in your home directory. When you''ve
    worked with a system for a while, you will notice that tens of files and directories
    have been created that are not automatically listed in a directory index. Next
    to that, every directory contains a file named dot (.) and one with two dots (..),
    which are used in combination with inode number to determine the directory''s
    position in the file system tree.


    You should read the Info pages about ls, since it is a very common command with
    a lot of useful options. Options can be combined, as is case with most UNIX commands
    and their options. A common combination is ls -al; it shows a long list of files
    and their properties as well as the destinations that symbolic links point to.
    ls -ltr displays the files of the last change, so that the file changed most recently
    occurs at the bottom of the list. Here are a couple of examples:


    ```

    user:/mp3> ls

    Albums/ Radio/ Singles/ gene/ index.html

    ```


    ```

    user:/mp3> ls -a

    ./ .thumbs Radio gene/

    ../ Albums/ Singles/ index.html

    ```


    ```

    user:/mp3> ls -l Radio/

    total 8

    drwx-xr-x 2 kriskie kissie 4096 Oct 30 1999 Carolina/

    drwx-xr-x 2 kriskie kissie 4096 Sep 24 1999 Slashdot/

    ```


    ```

    user:/mp3> ls -ld Radio/

    drwx-xr-x 4 kriskie kissie 4096 Oct 30 1999 Radio/

    -rw-r--r-- 30 kriskie kissie 4096 Oct 20 17:32 Singles/

    drwx-xr-x 2 kriskie kissie 4096 Dec 4 23:22 gene/

    drwx-xr-x 13 kriskie kissie 4096 Dec 21 11:40 Albums/

    ```


    On Linux versions ls is aliased to color by default. This feature allows you to
    see the file type without using any options. To achieve this, every file type
    has its own color. The standard scheme is in

    /etc/DIR_COLORS


    # Table 3-5. Color-blind default color scheme


    | Color | File type |

    | --- | --- |

    | blue | directories |


