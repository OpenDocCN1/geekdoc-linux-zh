    # 10.4. The X Window System


    # 10.4.1. X features


    As we already explained in Chapter 7 (see Section 7.3.3), the X Window system
    comes with an X server which provides services to clients that need a display.


    It is important to realize the distinction between the X server and the X client
    application(s). The X server controls the display directly and is responsible
    for all input and output via keyboard, mouse and display. The X client, on the
    other hand, does not access the input and output devices directly. It communicates
    with the X server which handles input and output. It is the X client which does
    the real work, like computing values, running applications and so far. The X server
    only opens windows to handle input and output for the specified client.


    Chapter 10. Networking'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Introduction to Linux


    In normal operation (graphical mode), every Linux workstation is X server to itself,
    even if it only runs client applications. All the applications you are running
    (for example, Gimp, a terminal window, your browser, your application, your CD
    playing tool, and so) are clients to your X server. Server and client are running
    on the same machine in this case.


    This client-server nature of X makes it an ideal environment for remote execution
    of applications and programs. Because the process is actively being executed on
    the remote machine, very little CPU power is needed on the local host. Such machines,
    purely acting as servers for X, are called X terminals and once very popular.
    More information may be found in the Remote applications mini-HOWTO.


    # 10.4.3.2. Telnet and X


    If you want to use telnet to display graphical applications running on a remote
    machine, you first need to get the remote machine access to your display (to your
    X server!) using the xhost command, by typing a command similar to the below in
    a terminal window on your local machine:


    ```

    davy-> xhost +remote.machine.com

    ```


    After that, connect to the remote host and let it display graphics on the local
    machine by setting the environment variable DISPLAY:


    ```

    [davy@remote ~ export DISPLAY="local.host.com:0"]

    ```


    After completing this step, any application started in this terminal window will
    be displayed on your local desktop, using remote resources for computing, your
    local graphical resources (your X server) for displaying the application.


    This procedure assumes that you have some of X server (XFree86, X. Exceed, Cygwin)
    already set up on the machine where you want to display images. The architecture
    and operating system of the client machine are not as long as you allow you to
    run an X server on it.


    Mind that displaying a terminal window from the remote machine is also considered
    to be a display of an image.


    # 10.4.4. The SSH suite


    # 10.4.4.1. Introduction


    Most Unix and Linux systems now run Secure Shell in order to leave the security
    risks that came with telnet. Most Linux systems run a version of OpenSSH, an Open
    Source implementation of the SSH protocol, providing secure encrypted connections
    between untrusted hosts over an untrusted network. The standard setup X connections
    are automatically forwarded, but arbitrary TCP/IP ports may also be forwarded
    through a secure channel.


    The ssh client connects and logs into the specified host name. The user must provide
    his identity to the remote machine as specified in the ssh_config file, which
    can usually be found in /etc/ssh. The configuration file is rather self-explanatory
    and by defaults enables most features. Should you need help, you can find it in
    the ssh pages.


    When the user''s identity has been accepted by the server, the either executes
    the given command, or logs into the machine and gives the user a normal shell
    on the remote machine. All communication with the remote command or shell will
    be automatically encrypted.'
