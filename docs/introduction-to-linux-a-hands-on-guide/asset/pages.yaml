    # 3.4.2. The tools


    # 3.4.2.1. The chmod command


    A normal consequence of applying strict file permissions, and sometimes a nuisance,
    is that access rights will need to be changed for all kinds of reasons. We use
    the chmod command to do this, and eventually to chmod has become an acceptable
    English verb, meaning the changing of the access mode of a file. The chmod command
    can be used with alphanumeric or numeric options, whatever you like.


    The example below uses alphanumeric options in order to solve a problem that commonly
    occurs with new users:


    ```

    asim-> /hello

    bash: ./hello: bad interpreter: Permission denied


    asim-> cat hello

    #!/bin/bash

    echo "Hello, World"


    asim-> ls -l hello

    -rw-rw-r-- 1 asim 32 Jan 15 16:29 hello


    asim-> chmod u+x hello


    asim-> /hello

    Hello, World

    ```


    asim-> ls -l hello

    -rw-rw-r-- 1 asim 32 Jan 15 16:29 hello*

    The + and operators are used to grant or deny a right to a given group. Combinations
    separated by commas are allowed. The Info and man pages contain useful examples.
    Here''s another one, which makes the file from the previous example a private
    file to user as:


    ```

    asim-> chmod u+rx,go-rx hello

    asim-> ls -l hello

    -rwxrxr-x-- 1 asim 32 Jan 15 16:29 hello*

    ```


    The kind of problem resulting in an error message saying that permission is denied
    is usually a problem with access rights in most cases. Also, comments like, "It
    worked yesterday," and "When I run this as root works," the values are most likely
    caused by the wrong file permissions.


    When using chmod with numeric arguments, the values for each granted right have
    to be counted together group. We use a 3-digit number, which is the symbolic value
    for the settings chmod has to make. The following table lists the most common
    combinations:


    Table 3-9. File protection with chmod


    | Command | Meaning |

    | --- | --- |

    | chmod 400 file | To protect a file against accidental overwriting. |

    | chmod 500 directory | To protect yourself from accidentally removing, renaming
    or moving files from this directory. |


