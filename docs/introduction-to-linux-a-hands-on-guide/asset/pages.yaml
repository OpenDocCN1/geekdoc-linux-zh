  md: '# Chapter 2. Quickstart


    In order to get the most out of this guide, we will immediately start with a practical
    chapter on connecting to the Linux system and doing some basic things.


    We will discuss:


    +   - Connecting to the system

    - Disconnecting from the system

    - Text and graphic mode

    - Changing your password

    - Navigating through the file system

    - Determining file type

    - Looking at text files

    - Finding help


    # 2.1. Logging in, activating the user interface and logging out


    # 2.1.1. Introduction


    In order to work on a Linux system directly, you will need to provide a user name
    and password. You always need to authenticate to the system. As we already mentioned
    in the exercise from Chapter 1, most PC-based Linux systems have two basic modes
    for a system to run: either quick and sober in text console mode, which looks
    like DOS with mouse, multitasking and multi-user features, or in graphical mode,
    which looks better but uses more system resources.


    # 2.1.2. Graphical mode


    This is the default nowadays on most desktop computers. You will connect to the
    system using graphical mode when you are first asked for your user name, and then,
    in a new window, to type your password.


    To log in, make the mouse pointer in the login window, provide your user name
    and password to the system and click OK or press **Enter**.


    > With that root account!


    It is generally considered a bad idea to connect (graphically) using the root
    user, the system administrator''s account, since the use of graphics includes
    a lot of extra programs, in root''s case with a lot of extra permissions. To keep
    all risks as low as possible, use a normal user account to connect graphically.
    But there are enough risks to keep this in mind as a general advice, for all use
    of the root account: only log in as root when extra privileges are required.


    After entering your name/password combination, it can take a little while before
    the graphical environment is started, depending on the CPU speed of your computer,
    the software you use and on your personal settings.'
