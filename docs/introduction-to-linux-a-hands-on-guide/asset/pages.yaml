  md: '# Introduction to Linux


    # 11.4.2.2. Client Side


    On the client side, the applications that you can use depend on your network configuration.
    If you have a direct Internet connection, there won''t be any problems, provided
    that you know on what server you can connect, and that you also have a username
    and password to authenticate to the service.


    If you are behind a firewall that does Network Address Translation (NAT), some
    services might not work, as you will only see the IP address of the firewall and
    not the address of your computer, which might be unroutable over the Internet,
    for instance when you are in a computer network and your IP address starts with
    10., 192.168 or other non-routable subnet prefix. This depends on the protocol
    that is used by the application.


    Also, available bandwidth might be a blocking factor: some applications are optimized
    for low bandwidth consumption, while others might require high bandwidth connections.
    This depends on the codec that is used by the application.


    Among the most common applications are the Skype client, which has an interface
    that reminds of instant messaging, and X-Lite, the free version of the XTen software,
    which looks like a mobile telephone. However, while these programs are available
    for download and very popular, they are not as free as speech: they use proprietary
    protocols and/or are only available in binary packages, not in source format.


    Free and open VoIP clients are for Gizmo, Linphone, GnomeMeeting and Kphone.


    +   Client hardware


    While your computer, especially if it is a laptop PC, might have a built-in microphone,
    the result will be far better if you connect a headset. If you have the device,
    opt for a USB headset, as functions independently from existing audio hardware.
    Use alsmixer to configure input and output sound levels to your taste.


    VoIP applications are definitely a booming market. Volunteers try to document
    the current status at http://www.voip-info.org/


    # 11.5. Summary


    The GNU/Linux platform is fully media-enabled. A wide variety of devices like
    sound cards, tv-cards, headsets, headphones, CD and DVD players are supported.
    The list of applications is endless, that why we need to shorten the list of commands
    in chapter 11 and limit ourselves to general audio commands.


    Table 11-1. New commands in chapter 11: Audio


    | Command | Meaning |

    |---|---|

    | alsconf | Configure the ALSA system. |

    | alsmixer | Tune output levels of ALSA driver. |

    | arecord | Record a sound sample. |

    | aumix | Audio mixer tool. |

    | cdp | Play an audio CD. |

    | cdparanoia | Rip an audio CD. |

    | cdplay | Play an audio CD. |


    Chapter 11. Sound and Video'
