  md: '# 10.5.8. Recovering from intrusion


    In short, stay calm. Take the following actions in this order:


    +   - Disconnect the machine from the network.

    - Try to find as much as you can about how your security was breached.

    - Backup important non-system data. If possible, check this data against existing
    backups before the system was compromised, ensure data integrity.

    - Re-install the system.

    - Use new passwords.

    - Restore from system and data backups.

    - Apply all available updates.

    - Re-examine the system: block off unnecessary services, check firewall rules
    and other access policies.

    - Reconnect.


    # 10.6. Summary


    Linux and networking go in hand. The Linux kernel has support for all common and
    most uncommon network protocols. The standard UNIX networking tools are provided
    in each distribution. Next to those, most distributions offer tools for easy network
    installation and management.


    Linux is well known as a stable platform for running various Internet services,
    the amount of Internet software is endless. Like UNIX, Linux can be just as well
    used and administered from a remote location, using one of several solutions for
    execution of programs.


    We briefly touched the subject of security. Linux is an ideal firewall, light
    and cheap, but can be used in several other network functions such as routers
    and proxy servers.


    Increasing network security is mainly done by applying frequent updates and common
    sense.


    Here is an overview of network related commands:


    Table 10-2. New commands in chapter 10: Networking


    | Command | Meaning |

    | --- | --- |

    | ftp | Transfer files to another host (insecure). |

    | host | Get information about networked hosts. |

    | ifconfig | Display IP address information. |

    | ip | Display IP address information. |

    | netstat | Display routing information and network statistics. |

    | ping | Send answer requests to other hosts. |

    | rdesktop | Display and MS Windows desktop on your Linux system. |

    | route | Show routing information. |

    | scp | Secure copy files to and from other hosts. |

    | sftp | Secure FTP files to and from other hosts. |

    | ssh | Make an encrypted connection to another host. |'
