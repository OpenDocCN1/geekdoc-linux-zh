    > Why are there two commands for task related to printing


    Printing on UNIX and likes has a long history. There used to be rather different
    approaches: the BSD-style printing and the SystemV-style printing. For compatibility,
    Linux CUPS supports the commands from both. Also that lp does not behave exactly
    like lpr, lpc has somewhat different options than lpstat and lprm is almost, but
    not quite, cancel. Which one you use is not important, pick the commands that
    you are comfortable with, or that you may know from previous experiences with
    UNIX-like systems.


    # 8.1.2. Formatting


    # 8.1.2.1. Tools and languages


    If we want to get sensible output out of the printer, files should be formatted
    first. Apart from an abundance of formatting software, Linux comes with the basic
    UNIX tools and languages.


    Modern Linux systems support direct printing, without any formatting by, of a
    range of file types: text, PDF, PostScript and several image formats like PNG,
    JPEG, BMP and GIF.


    For those files that need no formatting, Linux comes with a lot of formatting
    tools, such as the pdf2ps, fax2ps and a2ps commands, that convert other formats
    to PostScript. These commands can create files that then be used on other systems
    that don''t have all the conversion installed.


