    run on the Macs, but you can''t use it for some of the older ones with ancient
    technology. Another tricky case is Sun hardware, which could be an old SPARC CPU
    or a newer UltraSparse, both requiring different versions of Linux.


    Some distributions are optimized for certain processors, such as Ather CPUs, while
    they will be the same run decent enough on the 486, 586 and 686 Intel processors.
    Some distributions for special CPUs are not reliable, since they are tested by
    fewer people.


    Most Linux distributions offer a set of programs for generic PCs with special
    packages containing optimized kernels for the x86 Intel CPUs. These distributions
    are well-tested and maintained on a regular basis, focusing on relevant server
    implementation and easy installation. Examples are Debian, Ubuntu, Fedora, SuSE
    and Mandriva, which are by far the most popular Linux systems and generally considered
    easy to handle for the beginner user, while blocking professionals from getting
    the most out of their Linux machines. Linux also runs on laptops and mid-range
    servers. Drivers for new included only after extensive testing, which adds to
    the stability of a system.


