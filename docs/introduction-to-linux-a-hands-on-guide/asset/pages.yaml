    # 4.4.3. The at command


    The at command executes commands at a given time, using your default shell unless
    you tell the command otherwise (see the man page).


    The options to at are rather user-friendly, which is demonstrated in the examples
    below:


    ```

    steven@home:~> at tomorrow +2 days

    warning: commands will be executed using (in order) a) $SHELL

    b) login shell c) /bin/sh

    at> cat reports | mail myboss@company

    at> <EOT>

    at> job 1 at 2001-06-16 12:36

    Typing Ctrl+D quits the at utility and generates "EOT" message.

    ```


    User does a strange thing combining two commands; we will study this of practice
    in Chapter 5. Redirecting Input and Output.


    ```

    steven@home:~> at 02:37

    warning: commands will be executed using (in order) a) $SHELL

    b) login shell c) /bin/sh

    at> cd new-programs

    at> ./configure/

    at> <EOT>

    job 2 at 2001-06-14 02:00

    ```


    The -m option sends mail to the user when the job is done, or explains why a job
    can''t be done. The command atq lists perform before submitting jobs in order
    prevent them from starting at the same time as others. With the atm command you
    can remove scheduled jobs if you change your mind.


    It is a good idea to track execution times, because scheduled jobs are often run
    at "round hours", as you can see in Section 4.4.4 next. For example, jobs are
    often run at 1 o''clock in the morning (e.g. system indexing to update a standard
    database), so entering at 0100 may easily slow your system down before they fire
    up. To prevent jobs from running all at the time, you may also use the batch command,
    which queues processes and feeds the work in the queue to the system in an evenly
    balanced way, preventing bursts of system resource usage. See the Info pages for
    more information.


    # 4.4.4. Cron and crontab


    The system is managed by the cron daemon. It gets information about programs and
    which they should run from the system and users'' crontab entries. The root user
    has access to the system crontabs, while each user should only have access to
    his own crontabs. On some systems (some) users may not have access to the cron
    facility.


    At system start the cron daemon searches /var/spool/cron/ for crontab entries
    which are named after accounts in /etc/passwd, it searches /etc/cron.d/ and searches
    /etc/crontab, then uses this information every minute to check if there is something
    to do. It executes commands as the user who owns the crontab file and mails any
    outputs to the owner.


