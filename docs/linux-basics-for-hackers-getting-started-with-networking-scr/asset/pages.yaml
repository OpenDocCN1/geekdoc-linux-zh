  md: '# Hacker Challenge: Using grep, nl, tail, and head


    Let''s say you want to display the five lines immediately before a line that says
    # Step #6: Configure output plugins using at least four of the commands you learned.
    How would you do it? (Hint: there are many more options to these commands than
    we''ve discussed. You can learn more commands using the built-in Linux command
    man. For example, man tail will show the help for the tail command.)


    There are many ways to solve this challenge; here, I show you which lines to change
    to do it one, and your job is to find another method.


    # Step 1


    ```

    kali >tail -n507 /etc/snort.conf | grep output

    34      # 6) Configure output plugins

    512      # Step #6: Configure output plugins

    518      # output unified2: filename merged.log, limit 128, nostamp,

    mpls_event_types, vlan_event_types

    521      # output alert unified2: filename snort.alert, limit 128, nostamp

    522      # output log_unified2: filename snort.log, limit 128, nostamp

    525      # output alert syslog.log: LOG AUTH LOG_ALERT

    528      # output log_tcpdump: tcpdump log

    ```


    We can see that the line Step #6: Configure output plugins is line 512, and we
    know the five lines preceding line 512 as well as line 512 itself (that is, 507
    to 512).


    # Step 2


    ```

    kali >tail -n507 /etc/snort/snort.conf | head -n 6

    nested_ip inner \

    whitelist $WHITE_LIST_PATH/white_list.rules, \

    blacklist $BLACK_LIST_PATH/black_list.rules

    ############################################

    # Step #6: Configure output plugins

    ```


    Here, we use tail to start at line 507 and then output into head, and return just
    the top six lines, giving us the five lines preceding the Step #6 line, with that
    included.


    # Used sed to Find and Replace


    The sed command lets you search for occurrences of a word or a pattern and then
    perform some action on it. The name of the command is a contraction of stream
    editor, in its most basic form, sed operates like the Find and Replace function
    in Windows.'
