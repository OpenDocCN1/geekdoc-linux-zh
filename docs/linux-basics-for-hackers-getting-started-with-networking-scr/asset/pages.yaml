    # Managing Kernel Modules


    Linux has two ways to manage kernel modules. The other way is to use a group of
    commands built around the insmod suite—insmod stands for insert module and is
    intended to deal with modules. The second way, using the modprobe command, we
    will employ a later in this chapter. Here, we use the insmod command from the
    insmod suite to list the installed modules in the kernel:


    | Module | Size | Used by |

    |---|---|---|

    | netlink_queue | 20480 | 0 |

    | netlink_log | 201480 | 0 |

    | netlink | 16384 | 2 netlink_log, netlink_queue |

    | bluetooth | 516096 | 0 |

    | rkill | 0 | 2 bluetooth |


    ```

    --insmod-

    ```


    As you can see, the insmod command lists all the kernel modules as well as information
    on their size and what other modules may use them. For instance, the netlink module—a
    message-protocol for communicating between the kernel and user space—is 16,384
    bytes and used by both of the netlink_log module and the nf_netlink_queue module.


    From the insmod suite, we can load or insert a module with insmod and remove a
    module with rmod, which stands for remove module. These commands are not perfect
    and may not take into account module dependencies, so using them can leave your
    kernel unstable or unusable. As a result, modern distributions of Linux have now
    added'
