- img_proc: true
  md: 'A major advantage of using modprobe instead of insmod is that modprobe understands
    dependencies, options, and installation and removal procedures and it takes all
    of these into account before making changes. Thus, it is easier to add and remove
    kernel modules with modprobe.


    # Inserting and Removing a Kernel Module


    Let''s try inserting and removing a test module to help familiarize yourself with
    this process. Imagine that you just installed a new video card and you need to
    install the drivers for it. Remember, drivers for devices are usually installed
    directly into the kernel to give the necessary access to function properly. This
    also makes drivers fertile ground for malicious hackers to install a rootkit or
    other listening device.


    Let''s assume for demonstration purposes (don''t actually run commands) that we
    want to add a new video driver named HackersAriseNewVideo. You can add it to your
    kernel by entering the following:


    ```

    kali modprobe -a HackersAriseNewVideo

    ```


    To test the new module loaded properly, you can run the dmesg command, which prints
    the message buffer from the kernel, and then filter for "video" and look for any
    alerts that would indicate a problem:


    ```

    kali dmesg | grep video

    ```


    If there are any kernel messages with the word "video" in them, they will be displayed
    here. If nothing appears, there are no messages containing that keyword.


    Then, to remove this module, you can enter the same command with the -r (remove)
    switch:


    ```

    kali modprobe -r HackersAriseNewVideo

    ```


    Remember, the loadable kernel modules are a convenience to a Linux user/admin,
    but they are also a security weakness and one that professional hackers should
    be familiar with. As I said before, the LKMs can be the perfect vehicle to get
    your rootkit into the kernel and have havoc!


    # Summary


    The kernel is crucial to the overall operation of the operating system, and as
    such, it is a protected area. Anything that''s inadvertently added to the kernel
    can disrupt the operating system and even take control of it.


    LKMs enable the system administrator to add modules directly into the kernel without
    having to rebuild the entire kernel each time they want to add a module.'
