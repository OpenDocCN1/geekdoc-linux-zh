  md: 'In the output, you should see hundreds of lines of parameters that a Linux
    administrator can edit to optimize the kernel. There are a few lines that are
    as useful to you as a hacker. As an example of how you might use sysctl, well
    at enabling packet forwarding.


    In the man-in-the-middle (MITM) attack, the hacker places themselves between communicating
    hosts to intercept it. The traffic passes through the hacker''s system, so they
    can view and possibly alter the communication. One way to achieve this routing
    is to enable forwarding for ''ipv4''

    If you scroll down a few pages in the output or filter for ''ipv4'' you will see
    the following:


    ```

    net.ipv4.dyn_addr = 0

    net.ipv4.early_demux = 0

    net.ipv4.forward = 0

    net.ipv4.forward_use_pmtu = 0

    --snap

    ```


    The line net.ipv4.forward = 0 is the kernel parameter that enables the kernel
    to forward the packets it receives. In other words, the packets it receives, it
    sends out. The default setting is 0, which means packet forwarding is disabled.


    To enable IP forwarding, change the 0 to 1 by entering the following:


    ```

    kali sysctl -w net.ipv4.forward=1

    ```


    Remember that sysctl changes take place at runtime but are lost when the system
    is rebooted. To make permanent changes to sysctl, you need to edit configuration
    file /etc/sysctl.conf. Let''s change the way the kernel handles IP forwarding
    for MITM attacks and make this change permanent.


    To enable IP forwarding, open the /etc/sysctl.conf in any text editor and uncomment
    the line for ip_forward. Open /etc/sysctl.conf with any text editor and look like:


    ```

    #/etc/sysctl.conf Configuration file for setting system variables

    # /etc/sysctl.d/ for additional system variables.

    # See sysctl.conf (s) for information.

    #

    ```


