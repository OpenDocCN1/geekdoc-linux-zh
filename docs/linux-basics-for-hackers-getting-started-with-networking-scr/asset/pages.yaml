  md: "We have just successfully built multiport banner-grabbing tool in Python to\
    \ perform reconnaissance on a target system. The tool tells us which service is\
    \ running on the port and the version of that service! This is key information\
    \ hacker needs before proceeding with an attack.\n\n# Exceptions and Password\
    \ Crackers\n\nAny code you write will be at risk of errors or exceptions. In programming\
    \ terms, an exception is anything that disrupts the normal flow of code—usually\
    \ an error caused by incorrect code or input. To deal with possible errors, we\
    \ use exception handling, which is simply code that handles a particular problem,\
    \ presents an error message, or even uses an exception for decision making. In\
    \ Python, we have the try/except structure to handle these errors or exceptions.\n\
    \nA try block tries to execute some code, and if an error occurs, the except statement\
    \ handles that. In some cases, we can use the try/except structure for decision\
    \ making, move to the next password—similar to if...else. For instance, we use\
    \ try/except in a password cracker to crack a password, and if an error occurs\
    \ due to the password not matching, move to the next password.\n\nEnter the code\
    \ in Listing 7-7 and save it as ftpcracker.py; we'll go through it in a moment.\
    \ This script asks the user for the FTP server number and the username of whichever\
    \ FTP account they want to crack. It then reads in an external text file containing\
    \ a list of possible passwords and tries each one in order to crack into FTP account.\
    \ The script does this until it succeeds or runs out of passwords.\n\n```\n#!/usr/bin/python3\n\
    \nimport ftplib\n\nserver = input(\"FTP Server: \")\nuser = input(\"username:\
    \ \")\nasswordlist = input(\"Path to Password List > \")\n\ntry:\n    with open(Passwordlist,\
    \ 'r') as pw:\n        for word in pw:\n            word = word.strip('\\\\r').strip('\\\
    \\n')\n            ftp = ftplib.FTP(server)\n            ftp.login(user, word)\n\
    ```\n\nPython Scripting Basics for Hackers 201"
