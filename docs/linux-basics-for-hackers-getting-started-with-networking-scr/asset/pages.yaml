    # Setting More Secure Default Permissions with Masks


    As you have seen, Linux automatically assigns base permissions—usually 666 for
    files and 777 for directories. You can change the default permissions allocated
    to files and directories created by each user with the mask (or unmask). The umask
    method represents the permissions you want to remove from the base permissions
    on a file or directory to make them more secure.


    The umask is a three-digit decimal number representing the permissions digits,
    but the umask number is subtracted from the permissions number to give the new
    permissions status. This means that when a new file or directory is created, its
    permissions are set to the default value minus the value in umask, as shown in
    Figure 5-1.'
