  md: '# Why Hackers Use Linux


    So why do hackers use Linux over other operating systems? Mostly because Linux
    offers a far higher level of control via a few different methods.


    # Linux Is Open Source


    Unlike Windows, Linux is open source, meaning that the source code of the operating
    system is available to you. As such, you can change and manipulate it as you please.
    If you are trying to make a system operate in ways it was not intended to, being
    able to manipulate the source code is essential.


    # Linux Is Transparent


    To hack effectively, you must know and understand your operating system and to
    a large extent, the operating system you are attacking. Linux is totally transparent,
    meaning we can see and manipulate all its working parts.


    Not with Windows. Microsoft tries hard to make it as difficult as possible to
    know the inner workings of the operating systems, so you never really know what
    is going on "under the hood," whereas in Linux, you have a spotlight shining directly
    on each and every component of the operating system. This makes working with Linux
    more effective.


    # Linux Offers Granular Control


    Linux is granular. That means you have an almost infinite amount of control over
    the system. In Windows, you can only control what Microsoft allows you to. In
    Linux, everything can be controlled by the terminal, at the most minuscule or
    the macro level. In addition, Linux makes scripting in any of the scripting languages
    simple and effective.


    # Most Hacking Tools Are Written for Linux


    Well 90 percent of all hacking tools are written for Linux. There are exceptions,
    of course, such as Cain and Abel and Wikto, but these exceptions prove the rule.
    Even when hacking tools such as Metasploit or nmap are ported for Windows, not
    all the capabilities transfer from Linux.


    # The Future Belongs to Linux/Unix


    This might seem like a radical statement, but I firmly believe that the future
    of information technology belongs to Linux and Unix systems. Microsoft had its
    in the 1980s and 1990s, but its growth is slowing and stagnating.


    Since the internet began, Linux/Unix has been the operating system of choice for
    web servers due to its stability, reliability, and robustness. Today, Linux is
    used in two-thirds of web servers and dominates the market. Embedded systems in
    routers, switches, and other devices almost use a Linux kernel, and the world
    of virtualization is dominated by Linux, with both VMware and Citrix built on
    the Linux kernel.


    Over 80 percent of mobile devices run Linux or Unix (iOS is Unix, and Android
    is Linux), so if you believe that the future of computing lies in'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'mobile devices such as tablets and phones (it would be hard to argue other-wise),
    then the future is Unix/Linux. Microsoft Windows has just 7 percent of the mobile
    devices market. Is that the wagon you want to be hitched to?


    #  Downloading Kali Linux


    Before getting started, you need to download and install Kali Linux on your computer.
    The Linux distribution we will be working with throughout this book. Linux was
    first developed by Linus Torvalds in 1991 as an open source alternative to Unix.
    Since it is open source, volunteer develop the kernel, the utilities, and the
    applications. This means that there is no overriding corporate entity overseeing
    development, and as a result, conventions and standardization are often lacking.


    Kali Linux was developed by Offensive Security as a hacking system built on a
    distribution of Kali Debian. There are Debian is one of the best. You are probably
    familiar with Ubuntu as a popular distribution of Linux. Ubuntu is also built
    on Debian. Other distributions include Red Hat, CentOS, Mint, Arch, and SUSE.
    Although they share the same Linux kernel (the heart of the operating system that
    controls the CPU, RAM, and so on), each has its own utilities, applications, and
    choice of graphical interface (GNOME, KDE, and others) as a result, each of these
    distributions of Linux looks and feels slightly different. Kali was designed for
    penetration testers and hackers and comes with a significant complement of hacking
    tools. Although I strongly recommend that you use Kali for this book or another
    distribution, you will likely have to download and install the various tools we
    will be using, which could mean many hours downloading and installing tools. In
    addition, if distribution is not built on Debian, there may be minor differences.
    You can download and install Kali from https://www.kali.org/


    From the home page, click the Downloads at the top of the page. On the Downloads
    page you will be faced with multiple choices. It is important to choose the right
    download. Along the left side of the table, you will see the image name, which
    is the name of the link downloads. For instance, the first name listing is Kali
    Linux 64 Bit, meaning it''s the full Kali Linux and is suited for 64-bit systems—most
    modern systems use a 64-bit Intel or AMD CPU. To determine what type of CPU you
    are on your system, go to Control Panel > System and Security > System, and it
    should be listed. If your system is 64-bit, download and install the 64-bit version
    of the full Kali (not Light or Lxde, or any of the alternatives).


    If you are running an older computer with a 32-bit CPU, you will need to install
    the 32-bit version, which appears lower on the page.


    You have a choice of downloading via HTTP or Torrent. If you choose HTTP, Kali
    will download directly to your system like any other, and it will be placed in
    your Downloads folder. The torrent download is the peer-to-peer download used
    by many file-sharing sites. You will download is a torrent'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'application like BitTorrent to do this. The Kali file will then download to
    the folder in which the torrenting application stores its downloads.


    There are other versions for other types of CPUs, such as the commonly used ARM
    architecture found in many mobile devices. If you are using a Raspberry Pi, tablet,
