  md: '# 4


    # # ADDING AND REMOVING

    SOFTWARE


    ![](img/1d1085ba208631ba5cace7619c3050fa_76_0.png)


    One of the most fundamental tasks in Linux—or any operating system—is adding and
    removing software. You''ll often need to install software that didn''t come with
    your distribution or remove unwanted software so it doesn''t take up hard drive
    space.


    Some software requires other software to run, and you''ll sometimes find that
    you can download everything you need at once in a software package, which is a
    group of files—typically libraries and other dependencies—that you need for a
    piece of software to run successfully. When you install a package, all the files
    within it are installed together, along with a script to make loading the software
    simpler.


    In this chapter, we examine three key methods for adding new software: apt package
    manager, GUI-based installation managers, and git.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Using apt to Handle Software


    In Debian-based Linux distributions, which include Kali and Ubuntu, the default
    software manager is the Advanced Packaging Tool, or apt, whose primary command
    is apt-get. In its simplest and most common form, you can use apt-get to download
    and install new software packages, but you can also update and upgrade software
    with it.


    # Searching for a Package


    Before downloading a software package, you can check whether the package is available
    from your repository, which is a place where your operating system stores information.
    The apt tool has a search function that can check whether the package is available.
    The syntax is straightforward:


    ```

    apt-cache search keyword

    ```


    Note that we use the apt-cache command to search the apt cache, or it stores the
    package names. So if you were searching for the intrusion detection system Snort,
    for example, you would enter the command shown in Listing 4-1.


    ```

    kali >apt-cache search snort

    fwsnort - Snort-to-iptables rule translator

    ippl - IP protocols logger

    --snip--nsort - flexible Network Intrusion Detection System

    snort-common - flexible Network Intrusion Detection System - common files

    --snip--

    ```


    Listing 4-1: Searching the system with apt-cache for Snort


    As you can see, numerous files have the keyword snort in them, but near the middle
    of the output we see snort - flexible Network Intrusion Detection System. That''s
    what we are looking for!


    # Installing Software


    Now you know the snort package exists in your repository, you can use apt-get
    to download the software.


    To install a piece of software from your operating system''s default repository
    in the terminal, use the apt-get command, followed by the key-install word and
    then the name of the package you want to install. The syntax looks like this:


    ```

    apt-get install packagename

    ```


    Let''s try this by installing Snort on your system. Enter apt-get install snort
    as a command statement, as shown in Listing 4-2.'
