  md: 'To set the SUID bit, enter a 4 before the regular permissions, so a file with
    a new resulting permission of 644 is represented as 4644 when the SUID bit is
    set.


    Setting the SUID on a file is not something a typical user would do, but if you
    want to do so, use the chmod command, as in chmod 4644 filename.


    # Granting the Root User''s Group Permissions SGID


    SGID also grants temporary elevated permissions, but it grants the permissions
    of the file owner''s group, rather than of the file''s owner. This means that,
    with an SGID bit set, someone without execution can execute a file if the owner
    belongs to the group that has permission to execute that.


    The SGID works slightly differently when applied to a directory: when the bit
    is set on a directory, ownership of new files created that goes to the directory
    creator''s group, rather than the file creator''s group. This is very useful when
    a directory is shared by multiple users. All users in that directory can execute
    the file(s), not just a single user.


    The SGID bit is represented as 2 before the regular permissions, so a new file
    with the resulting permissions 644 would be represented as 2644 when the SGID
    bit is set. Again, you would use the chmod command for this—for example, chmod
    2644 filename.


    # The Outdated Sticky Bit


    The sticky bit is a permission that you can set on a directory to allow a user
    to delete or rename files within that. However, the sticky bit is a legacy of
    older Unix systems, and modern systems (like Linux) ignore it. As such, I will
    not discuss it further here, but you should be familiar with the term because
    you might hear it in the Linux world.


    # Special Permissions, Privilege Escalation, and the Hacker


    As a hacker, these special permissions can be used to exploit Linux systems through
    privilege escalation, whereby a regular user gains root or sysadmin privileges
    and the associated privileges. With root privileges, you can do anything on the
    system.


