  md: '# 5


    # # CONTROLLING FILE AND

    DIRECTORY PERMISSIONS


    ![](img/1d1085ba208631ba5cace7619c3050fa_86_0.png)


    Not every user of a single operating system should have the same level of access
    to files and directories. Like any professional or enterprise-level operating
    system, Linux has methods for securing the file and directory access. This security
    system allows the system administrator—the root user—or the file owner to protect
    their files from unwanted access or tampering by granting select users *permissions
    to read, write, or execute files*. For each file and directory, we can specify
    the permission status for the file''s owner, for particular groups of users, and
    for all other users. This is a necessity in a multiuser, enterprise-level operating
    system. The alternative would be chaotic.


    In this chapter, I''ll show you how to check for and change permissions on files
    and directories for select users, how to set default file and directory permissions,
    and how to set special permissions. Finally, you will see how a hacker''s understanding
    of permissions might help them exploit a system.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Different Types of Users


    As you know, Linux, the root user is all-powerful. The root user can do basically
    anything on the system. Other users on the system have more limited capabilities
    and permissions and almost never have the access that the root user has.


    These other users are usually collected into groups that generally share a similar
    function. In a commercial entity, these groups might finance, engineering, sales,
    and so on. In an IT environment, these groups might include developers, network
    administrators, and database administrators. The idea is to put people with similar
    needs into a group that is granted relevant permissions; then each member of the
    group inherits the group permissions. This is primarily for the ease of administering
    permissions and, security.


    The root user is part of the root group by default. Each new user on the system
    must be added to a group in order to inherit the permissions of that group.


    # Granting Permissions


    Each and file and directory must be allocated a particular level of permission
    for the different identities using it. The three levels of permission are as follows:


    +   - Permission to read. This grants permission only to open and view a file.


    +   - Permission to write. This allows users to write and edit a file.


    +   - Permission to execute. This allows users to execute a file (but not necessarily
    view or edit it).


    In this way, the root user can grant users a level of permission depending on
    what they need the files. When a file is created, the who created it is the owner
    of the file, and the owning is the user''s current group. The owner of the file
    can grant various access privileges to it. Let''s look at how to change permissions
    to pass ownership to individual users and groups.


    # Granting Ownership to an Individual User


    To move ownership of a file to a different user so that they have the ability
    to control permissions, we can use the chown (or change owner) command:


    ```

    kali >chown bob /tmp/bobsfile

    ```


    Here, we the command, the name of the user we are giving ownership to, and then
    the location and name of the relevant file. This command grants the user account
    for Bob ownership of bobsfile.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Granting Ownership to a Group


    To transfer ownership of a file from one group to another, we can use the chgrp
    (or change group) command.

    Hackers are often more likely to work alone than in groups, but it’s not unheard
    of several hackers and pentes work together on a project, and in that case, using
    groups is necessary. For instance, you might have a group of pentes and a security
    team members working on the same project. The pentes in this example are the root
    group, meaning they have all permissions and access. The security folk only need
    access to defensive tools, as an intrusion detection system (IDS). Let’s say the
    root group downloads and installs a new IDS; the root group will need to change
    the ownership to the security group so the security group can use it. To do, so,
    the root group would simply enter the following command:


    ```

    kali >chgrp 1security newIDS

    ```


    This command passes the security group 1 ownership of newIDS 2. Now you need to
    know how to check whether these allocations worked. You’ll do that by checking
    a file’s permissions.


    # Checking Permissions


    When you want to find out what permissions are granted to users for a file or
    directory, use the ls command with the -l (long) switch to display the contents
    of a directory in long format—this list will contain the permissions. In Listing
    5-1, use the ls -1 command on the file /usr/share/hashcat (one of my favorite
    password-cracking tools) in order to see what we can learn about the file.


    ```

    kali >1 ls -l /usr/share/hashcat

    total 32952

    drwx-xr-x 5 root 4096 Dec 5 10:47 charsets

    -rw-r--r-- 1 root 336685504 June 28 2018 hashcat.hctat

    -rw-r--r-- 1 root 331685504 June 28 2018 hashcat.hctune

    drwx-xr-x 2 root 4096 Dec 5 10:47 marks

    drwx-xr-x 2 root 4096 Dec 5 10:47 OpenCL

    drwx-xr-x 3 root 4096 Dec 5 10:47 rules

    ```


    Listing 5-1: Checking a file’s permissions with the long listing command


    On each line, we get information about:


    +   - The file type

    - The permissions on the file for owner, group, and users, respectively

    - The number of links (This topic is beyond the scope of the book.)

    - The owner of the file'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'The size of the file in bytes


    When the file was created or last modified


    The name of the file


    For now, let''s focus on the seemingly incomprehensible strings of letters and
    dashes on the left edge of each line. They tell us whether an item is a file or
    directory and what permissions, if any, are on.


    The first character tells you the file type, where d stands for a directory and
    a dash (-) indicates a file. These are the two most common file types.


    The next section defines the permissions on the file. There are three sets of
    characters, made of some combination of (r), write (w), and execute (x), in order.
    The first set represents the permissions of the owner; the second, those of the
    group; and the last, those of all other users.


    Regardless of what you''re looking at, if one user or group of users has permission
    to open and read that file or directory. A * as the middle means they can write
    to (modify) the file or directory, and an x at the end means they can execute
    (run) the file or directory. If any r, w, or x is replaced with a dash (-), the
    respective permission hasn''t been given. Note that users can have permission
    to execute only binaries or scripts.


