    # Adding Repositories to Your sources.list


    The servers that hold the software for particular distributions of Linux are known
    as repositories. Nearly every distribution has its own repositories of software—developed
    and configured for that distribution—that might not work well, or at all, with
    other distributions. Although these repositories often contain the same or similar
    software, they are not identical, and they sometimes have different versions of
    the same software or entirely different software.


    You will, of course, be using the Kali repository, which has a large amount of
    security and hacking software. Because Kali specializes in security and hacking,
    it doesn''t include some security tools and even run-of-the-mill software. It''s
    worth adding a repository or two that your system can search in case it doesn''t
    find a specific software in the Kali repository.


    The repositories your system will search for are stored in the sources.list file,
    and you can edit this file to define which repositories you want to download.
    I often add the Ubuntu repositories to the Kali repositories in my sources.list
    file that, when I request to download a new software package, my system will first
    look in the Kali repository, and if the software package isn''t there, it will
    look in the Ubuntu repository.


    You can find the sources.list file at /etc/apt/sources.list file and open it with
    any text editor. I''ll again be using Leafpad. To open the sources.list file,
    enter the following into your terminal, replacing leafpad with the name of your
    editor:


    ```

    kali >leafpad /etc/apt/sources.list

    ```'
