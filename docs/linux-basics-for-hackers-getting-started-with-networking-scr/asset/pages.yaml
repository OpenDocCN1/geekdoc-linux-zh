    Bluetooth devices. As you can see in Listing 14-1, I have used it to bring

    u the Bluetooth interface and query the device for its specs.


    **hcitool** This inquiry can provide us with device name, device ID,

    device class, and device clock information, which enables the devices to

    work synchronously.


    **hcidump** This tool enables us to sniff the Bluetooth communication,

    meaning we can capture data sent over the Bluetooth signal.


    The first scanning and reconnaissance step with Bluetooth is to check

    whether the Bluetooth adapter on the system we use is recognized and

    en so we can use it for other devices. We can do this with the

