    Here, I have uncommented chain_len and given it a value of 3, meaning proxychains
    will now use three proxies from my list in the /etc/proxychains.conf file, choosing
    them randomly and moving onto the next one if a proxy is down. Note that although
    this method certainly enhances your anonymity, it also increases the latency of
    our online activities.


    Now that you know how to use proxies, you can do your hacking with relative anonymity.
    I say "relative" because there is no surefire way to remain anonymous with the
    NSA and FSB spying on our online activities—but we can make detection much harder
    with the help of proxies.


    # Security Concerns


    As a last note on proxy security, be sure to choose your proxies wisely: proxychains
    is only as good as the proxies you use. If you are intent on remaining anonymous,
    do not use a free proxy, as mentioned earlier. Hackers use paid-for proxies that
    can be trusted. In fact, the free proxies are likely selling your IP address and
    browsing history. Bruce Schneier, the famous cryptographer and security expert,
    once, "If something is free, you''re not the customer; you''re the product." In
    other words, any free product is likely gathering your data and selling it. Why
    would they offer a proxy for free?


    Although the IP address of your leaving the proxy will be anonymous, there are
    other ways for surveillance agencies to identify you. In instance, the owner of
    the proxy will know your identity, and if pressed enough espionage or law enforcement
    agencies with jurisdiction, may offer your identity to protect their business.
    It’s important to be aware of the limitations of proxies as a source of anonymity.


    # Virtual Private Networks


    Using a virtual private network (VPN) can be an effective way to keep your web
    traffic relatively anonymous and secure. A VPN is used to connect to an intermediary
    device such as a router that sends your traffic to its ultimate destination tagged
    with the IP address of the router.


    Using a VPN can certainly enhance your security and privacy, but it’s not a guarantee
    of anonymity. The internet device you connect to must record or log your IP address
    to properly send the data back to you, so any-one to access these records can
    uncover information about you.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'The beauty of VPNs is that they are simple and easy to work with. You can open
    an account with a VPN provider and seamlessly connect to the VPN each time you
    log on to your computer. You would use your browser as usual to navigate the web,
    but it will appear to anyone watching your traffic is coming from the IP address
    and location of the internet VPN device and not yours. In addition, all traffic
    between you and the VPN device is encrypted, so even your internet service provider
    can''t see your traffic.


    Among others, a VPN can be effective in evading government-controlled content
    and information censors. For instance, if your national government limits your
    access to websites with a particular political usage, you can likely use a VPN
    based outside your country in order to access that content. Some media corporations,
    such as Netflix, Hulu, HBO, limit access to their content to IP addresses originating
    from their nation. Using a VPN based in another that those services can often
    get you around those access limitations.


    Some of the best and most popular commercial VPN services, according to Cnet,
    are the following:


    +   * IPVanish

    * NordVPN

    * ExpressVPN

    * CyberGhost

    * Golden Frog VPN

    * Hide My Ass (HMA)

    * Private Internet Access

    * PureVPN

    * TorGuard

    * Buffered VPN


    Most of these VPN services charge $50–$100 per year, and many offer a free 30-day
    trial. To find out more about how to set up a VPN, choose one from the list and
    visit the website. You should find download, installation, and usage instructions
    that are pretty easy to follow.


    The strength of a VPN is that all your traffic is encrypted when it leaves your
    computer, thus protecting you against sno, and your IP address is cloaked by the
    VPN IP address when you visit a site. With a proxy server, the owner of the VPN
    has your originating IP address (otherwise they couldn''t send your traffic back
    to you). If they are pressured by agencies or law enforcement, they might give
    up your identity. One way to prevent that is to use only VPNs that promise not
    to store or log any of this information (and hope they are being truthful). In
    this way, if someone insists that the VPN service turn over its data on its users,
    there is no data.'
