  md: '# About the Author


    OccupyTheWeb (OTW) is the pseudonym and primary writer for the hacker and pentester
    training website, https://www.hackersarise.com/. He is a former college professor
    and has over 20 years of experience in the information technology industry. He
    has trained hackers throughout the US, including branches of the US military (Army,
    Air Force, and Navy) and the US intelligence community (CIA, NSA, and DNI). He
    is also an avid mountain biker and snowboarder.


    # About the Technical Reviewer


    Since the early days of Commodore FET and VIC-20, technology has been a constant
    companion (and sometimes obsession!) to Cliff Janzen. Cliff discovered his career
    passion when he moved to information security in 2008 after a decade of IT operations.
    Since then, Cliff has had the great fortune to work with and learn from some of
    the best people in the industry including OccupyTheWeb and the fine people at
    No Starch during the production of this book. He is happily employed as a security
    consultant, doing everything from policy review to penetration tests. He lucky
    to have a career that is also his favorite hobby and a wife that supports him.'
