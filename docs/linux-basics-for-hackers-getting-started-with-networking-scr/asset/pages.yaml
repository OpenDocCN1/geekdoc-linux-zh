- img_proc: true
  md: '# Changing Your Network Mask and Broadcast Address


    You can also change your network mask (netmask) and broadcast address with the
    ifconfig command. For instance, if you want to assign that same eth0 interface
    with a netmask of 255.255.0.0 and a broadcast address of 192.168.1.255, you would
    enter the following:


    ```

    kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    kali >

    ```


    Once again, if you''ve done everything correctly, Linux responds with a new command
    prompt. Now enter ifconfig again to verify that each of the parameters has been
    changed accordingly.


    # Spoofing Your MAC Address


    You can use ifconfig to change your MAC address (or Hwaddr). The MAC address is
    globally unique and is often used as a security measure to keep hackers out of
    networks—or to trace them. Changing your MAC address to spoof a different MAC
    address is almost trivial and neutralizes those security measures. Thus, it''s
    a very useful technique for bypassing network access controls.


    To spoof your MAC address, simply use the ifconfig command option to take down
    the interface (eth0 in this). Then enter the ifconfig command by the interface
    (hw for hardware, ether for Ethernet) and the new spoofed MAC address. Finally,
    bring the interface back up with the option for the change to take place. Here''s
    an example:


    ```

    kali >ifconfig eth0 down

    kali >ifconfig eth0 hw ether 00:11:22:33:44:55

    kali >ifconfig eth0 up

    ```


    Now, when you check your settings with ifconfig, you should see that Hwaddr has
    changed to your new spoofed IP address!


    # Assigning New IP Addresses from the DHCP Server


    Linux has a Dynamic Host Configuration Protocol (DHCP) server that runs a daemon—a
    process that runs in the background—called dhcpd, or the dhcp daemon. The DHCP
    server assigns IP addresses to all the systems on the subnet and keeps logs of
    which IP address is allocated to which machine at any time. This makes it a great
    resource for forensic analysts to trace hackers after an attack. For that reason,
    it''s useful to understand how the DHCP server works.


    Usually, to connect to the internet from a LAN, you must have a DHCP-assigned
    IP address. After therefore, setting a static IP address, you must return and
    get a new DHCP-assigned IP address. To do this, you can always reboot your'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'system, but I will show you how to retrieve a new DHCP without having to shut
    your system down and restart it.

    To request an IP address from DHCP, simply call the DHCP server with the command
    dhclient followed by the interface you want the address assigned to. Different
    Linux distributions use different DHCP clients, but Kali is built on Debian, which
    uses dhclient. Therefore, you can assign a new address like:


    ```

    kali dhclient eth0 sends a DHCPDISCOVER request from the network interface specified
    (here, eth0). If it receives an offer DHCPOFFER from the DHCP server (192.168.181.131
    in case) and confirms the IP assignment to the DHCP server with a dhcp request.

    ```


    kali >ifconfig

    eth0Linkenc:EthernetWaddr 00:0c:29:ba:82:0f

    inet addr:192.168.181.131 Bcast:192.168.181.131 Mask:255.255.255.0


    Depending on the configuration of the DHCP server, the IP address assigned in
    each case might be different.

    When you enter ifconfig, you should see that the DHCP server has assigned a new
    IP address, a new broadcast address, and new netmask to your network interface
    eth0.


    # Manipulating the Domain Name System


    Hackers can find a treasure trove of information on a target in its Domain Name
    System (DNS). DNS is a critical component of the internet, although it is designed
    to translate domain names to IP addresses, hacker can use it to garner information
    on the target.


    # Examining DNS with dig


    DNS is we that translates a domain name like hackers-arise.com to the appropriate
    IP address; that way, your system knows how to get it. Without DNS, we would all
    have to remember thousands of IP addresses for our favorite websites—no small
    task even for a savant.


    One of the most useful commands for the aspiring hacker is dig, which offers a
    way to get DNS information about a target. The stored DNS information can be a
    key piece of reconnaissance to obtain before attacking. This code could include
    the IP address of the nameserver(the server that translates the target''s name
    to an IP address), the target''s email server, and potentially subdomains and
    IP addresses.


    For instance, enter dig hackers-arise.com and add the ns option (short for nameserver).
    The nameserver for hackers-arise.com is displayed in the ANSWER SECTION of Listing
    3-3.


    ![](img/1d1085ba208631ba5cace7619c3050fa_70_0.png)'
  merge: -1
  pgno: 70
- img_proc: true
