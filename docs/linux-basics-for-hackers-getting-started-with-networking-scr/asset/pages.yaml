- img_proc: true
  md: '# Wi-Fi Networks


    We''ll start with Wi-Fi. In this section, I''ll show you how to find, examine,
    and

    connect to Wi-Fi access points. Before doing so, let''s spend a bit of time going

    over basic Wi-Fi terms and technologies to help you better understand

    the output from a lot of the queries we''ll make in this:


    **AP (access point)** This is the device wireless users connect to

    internet access.


    **ESSID (extended service set identifier)** This is the same as the SSID,

    which discussed in Chapter 3, but it can be used for multiple APs in

    a wireless LAN.


    **BSSID (basic service set identifier)** This is the unique identifier of

    e AP, and it is the same as the MAC address of the device.


    **SSID (service set identifier)** This is the name of the network.


    **Channels** Wi-Fi can operate on any one of 14 channels (1–14). In the

    United States, Wi-Fi is limited to channels 1–11.


    **Power** The closer you are to the Wi-Fi AP, the greater the power, and

    the easier the connection is to crack.


    **Security** This is the security protocol used on the Wi-Fi AP that is

    being read. There are three primary security protocols for Wi-Fi.

    The original, *Wired Equivalent Privacy (WEP)*, badly flawed and eas-

    ily cracked. Its replacement, Wi-Fi Protected Access (WPA), was a bit more

    secure. Finally, WPA2-PSK, which is much more secure and uses a pre-

    shared key (PSK) that all users share, is now used by nearly all Wi-Fi

    APs (except enterprise Wi-Fi).


    **Modes** Wi-Fi can operate in one of three modes: managed, master, or

    monitor. You''ll learn what these mean in the following section.


    **Wireless range** In the United States, a Wi-Fi AP must legally broadcast

    signal at an upper limit of 0.5 watts. At this power, it has a normal

    range of about 300 feet (100 meters). High-gain antennas can extend

    this range to as much as 20 miles.


    **Frequency** Wi-Fi is designed to operate on 2.4GHz and 5GHz. Modern

    Wi-Fi APs and wireless network cards use both.


    # Basic Wireless Commands


    In Chapter 3, you were introduced to the basic Linux networking command

    ifconfig, which lists each network interface on your system along

    with some statistics, including (most importantly) the IP address of

    each interface. Let''s take another look at your results from ifconfig

    and focus on the wireless connections this time.


    ```

    kali ~ifconfig

    eth0 linkenc=EthernetHW 00:0c:29:ba:82:0f

    inet addr:192.168.181.131 Bcast:192.168.181.255 Mask:255.255.255.0

    --snap--

    ```'
