    # Killing Processes


    At times a process will consume many system resources, exhibit

    unusual behavior, or—at worst—freeze. A process that exhibits this type of

    behavior is often referred to as a zombie process. For you, the most

    problematic symptom will be wasted resources used by the zombie that

    could be allocated to useful processes.


    Chapter 6'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'When you identify a problematic process, you may want to stop it with the kill
    command. There are many different ways to kill a program, and each has its own
    kill number.


    The kill command has 64 different kill signals, and each does something different.
    Here, we focus on a few you will likely find most useful. The syntax for the kill
    command is kill-signal PID, where the signal is optional. If you don''t provide
    a signal flag, it defaults to SIGTERM.

    Table 6-1: Commonly Used Kill Signals


    | Signal name | Number for option | Description |

    |---|---|--|

    | SIGHUP | 1 | This is known as the Hangup (HUP) signal. It stops the designated
    process and restarts it with the same PID. |

    | SIGINT | 2 | This is the Interrupt (INT) signal. It is a weak kill signal that
    isn''t guaranteed to work, but it works in most cases. |

    | SIGQUIT | 3 | This is known as the core dump. It terminates the process and
    saves the process information in memory, and then it saves this information in
    the current working directory to a file named core. (The reasons for doing this
    are beyond the scope of this book.) |

    | SIGTERM | 15 | This is the Termination (TERM) signal. It is the kill command''s
    default kill signal. |

    | SIGKILL | 9 | This is the absolute kill signal. It forces the process to stop
    by sending the process''s resources to a special device, /dev/null. |


    Using the top command, you can identify which processes are too many resources;
    often, those processes will be legitimate, but there may be malicious processes
    taking resources that you''ll want to kill.

    If you just want restart a process with the HUP signal, enter the -1 option with
    kill, like:


    ```

    kali -1 6996

    ```


    In the case of a zombie or a malicious process, you would likely want to send
    the kill -9 signal, the absolute kill signal, to the process. This makes that
    the process is terminated.


    ```

    kali -9 6996

    ```


    If you don''t know a process''s PID, you can use the killall command to kill the
    process. This command takes the name of the process, instead of the PID, as an
    argument.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'For example, you could terminate a hypothetical zombieprocess like this:


    ```

    kali >killall -9 zombieprocess

    ```


    Finally, you can also terminate a process in the top command. Simply press the
    K key and then enter the PID of the offending process.


    # Running Processes in the Background


    In Linux, whether you''re working from the command line or the GUI, you''re working
    within a shell. All commands that run are executed from that shell, even if they
    run from the graphical interface. When you execute a command, the shell waits
    until the command is completed offering another command prompt.


    At times, you may want to move a process in the background, rather than having
    to wait for it to complete in that terminal. For instance, we want to work on
    a script in a text editor and so have called our text editor (leafpad) by entering
    the following:


    ```

    kali >leafpad newsscript

    ```


    In this case, the shell will open the leafpad text editor to create newsscript.
    While we work in the text editor, the terminal is occupied with running the text
    editor. If we return to the terminal, we should see that it is running our text
    editor and that we have no prompt to allow us to enter commands.


    We could, of course, open another terminal to run more commands, but a better
    option to save resources and screen estate is to start the text editor running
    in the background. Running a process in the background simply means that it will
    continue to run without needing the terminal. In this way, the terminal is freed
    up for other duties.


    To start the text editor in the background, just append an ampersand (&) to the
    end of the command, like so:


    ```

    kali >leafpad newsscript &

    ```


    Now, when the editor opens, the terminal returns a new command prompt so we can
    enter other commands on our system while also editing our newsscript. This is
    effective for any process that run for a significant length of time when you use
    the terminal. As a hacker, you''ll find this useful for running multiple terminals
    with multiple tasks, to save resources and screen space.


    # Moving a Process to the Foreground


    If you want to move a process running in the background to the foreground, you
    can use the fg (foreground) command. The fg command requires the PID of the process
    you want to return to the foreground, shown next.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'kali >fg 1234


    If you don''t know the PID, you can use the ps command to find it.


    # Scheduling Processes


    Both Linux system administrators and hackers often need to schedule processes
    to run at a particular time of day. A system administrator might want to schedule
    a system backup to run Saturday night at 2 AM, for example. A hacker might want
    to set a script to perform reconnaissance on a regular basis, finding open ports
    or vulnerabilities. In Linux, you can accomplish this in at least two ways: with
    at and cron.


    The at command is a daemon—a background process—useful for scheduling a job to
    run at some point in the future. The cron is more suited for scheduling tasks
    to occur every day, week, or month, and we''ll cover this in Chapter 16.


    We use the daemon to schedule the execution of a command or set of commands in
    the future. The syntax is simply the at followed by the time to execute the process.
    The time argument can be provided in various formats. Table 6-2 contains the most
    common at time formats.


    Table 6-2: Time Formats Accepted by the at Command

    | Time format | Meaning |

    | --- | --- |

    | at 7:20pm | Scheduled to run at 7:20 PM on the current day |

    | at 7:20pm June 25 | Scheduled to run at 7:20 PM on June 25 |

    | at noon | Scheduled to run at noon on the current day |

    | at noon June 25 | Scheduled to run at noon on June 25 |

    | at tomorrow | Scheduled to run tomorrow |

    | at now + 20 minutes | Scheduled to run in 20 minutes from the current time |

    | at now + 10 hours | Scheduled to run in 10 hours from the current time |

    | at now + 5 days | Scheduled to run in five days from the current date |

    | at now + 3 weeks | Scheduled to run in three weeks from the current date |

    | at 7:20pm 06/25/2019 | Scheduled to run at 7:20 PM on June 25, 2019 |


    When you enter at daemon with the specified time, it goes into interactive mode
    and you are greeted with an at> prompt. Here is where you enter the command you
    executed at the specified time:


    ```

    kali >at 7:20am

    at >/root/myscanscript

    ```


    This snippet will schedule myscanscript to execute today at 7:20 AM.'
  merge: -1
