    -rwxr-xr-x 1 root root      22311 Nov 27 2018 13:00 hackersarise1.sh

    -rwxr-xr-x 1 root root       8791 Nov 27 2018 13:00 hackersarise2.sh

    -rwxr-xr-x 1 root root       3992 Nov 27 2018 13:00 hackersarise3.sh

    ```


    Let''s say you want to send all three of these files to another hacker''s you
    can combine them and create a large archive using the command in Listing 9-1.


    ```

    kali >tar -cvf HackerArise.tar hackersarise1 hackersarise2 hackersarise3

    hackersise1

    ```


    94 Chapter 9'
