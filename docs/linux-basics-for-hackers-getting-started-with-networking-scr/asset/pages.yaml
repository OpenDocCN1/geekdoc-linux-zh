    # Scheduling an Event or Job to Run on an Automatic Basis


    The cron daemon and the cron table (crontab) are the most useful tools for scheduling
    regular tasks. First, cron, is a daemon that runs in the background. The cron
    daemon checks the cron table for commands to run at specified times. We can alter
    the cron table to schedule a task to execute regularly on a particular day or
    date, at a particular time daily, or for several weeks or months.


    To schedule these tasks or jobs, enter them into the cron table, located at /etc/crontab.
    The cron table has seven fields: the first five are used to schedule the time
    to run the task, the sixth field specifies the user, and the seventh field is
    used for the absolute path to the command you want to execute. If we were using
    the cron table to schedule a script, we could simply put the absolute path to
    the script in the seventh field.


    Each of the five fields represents a different element of time: the minute, hour,
    day of the month, month, and day of the week, in order. Every element of time
    must be represented numerically, so March (you cannot simply input "March”). Days
    of the week begin at 0, which is Sunday, and end at 7, which is also Sunday. Table
    16-1 summarizes this.


    Table 16-1: Time Representations for Use in crontab

    | Field | Time unit | Representation |

    |---|---|---|

    | 1 | Minute | 0–59 |

    | 2 | Hour | 0–23 |

    | 3 | Day of the month | 1–31 |

    | 4 | Month | 1–12 |

    | 5 | Day of the week | 0–7 |


    If, we had written a script to scan for vulnerable ports and wanted it to run
    every night at 2:30 AM, Monday through Friday, we could schedule it in the crontab
    file. We will walk through the process of how to get this information into the
    crontab shortly, but first let''s discuss the format we need to follow, shown
    in Listing 16-1.'
