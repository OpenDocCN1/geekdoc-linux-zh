  md: '# # 2


    # # TEXT MANIPULATION


    ![](img/1d1085ba208631ba5cace7619c3050fa_56_0.png)


    In Linux, nearly everything you deal with directly is a file, and most often these
    will be text files; for instance, all configuration files in Linux are text files.
    So to reconfigure the configuration file, change the text, save the file, and
    then restart the application—your reconfiguration is complete.


    With many text files, manipulating text becomes crucial in managing Linux and
    Linux applications. In this chapter, you''ll use several commands and techniques
    for manipulating text in Linux.


    For illustrative purposes, I''ll use files from the world''s best network intrusion
    detection system (NIDS). Snort, which was first developed by Marty Roesch and
    is now owned by Cisco. NIDSs are commonly used to detect intrusions by hackers,
    so if you want to be a successful hacker, you must be familiar with the ways NIDSs
    can deter attacks and the ways you can abuse them to avoid detection.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'If the version of Kali Linux you''re using doesn''t come preinstalled with
    Snort, you can download the files from the Kali repository by entering apt-get
    install snort.


    # Viewing Files


    As demonstrated in Chapter 1, the most basic text display command is probably
    cat, but it has its limitations. Use cat to display the Snort config file (snort.conf)
    found in/etc/snort (see Listing 2-1).


    ```

    kali >cat /etc/snort/snort.conf

    ```


    Listing 2-1: Displaying snort.conf in the terminal window


    Your screen should now display the entire snort.conf file, which will stream until
    it comes to the end of the file, as shown here. This isn''t the most convenient
    or practical way to view and work with this file.


    ```

    # include $SO0_RULE_PATH/exploit.rules

    # include $SO0_RULE_PATH/exploit.rules

    # include $SO0_RULE_PATH/exploit.rules

    # include $SO0_RULE_PATH/exploit.rules


    --snip--


    # event thresholding or suppressions commands...

    kali >

    ```


    In the following two sections, I will show you the head and tail commands, which
    are two methods for displaying part of a file''s content in order to more easily
    view the key content.


    # Taking the Head


    If you want to view the beginning of a file, you can use the head command. By
    default, this command displays the first 10 lines of a file. The following command,
    for instance, shows you the first 10 lines of snort.conf:


    ```

    kali >head /etc/snort/snort.conf

