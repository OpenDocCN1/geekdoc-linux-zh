    listing on the directory to double-check. Note that by default, if an extracted
    file already exists, tar will remove the existing file and replace it with the
    extracted file.


    # Compressing Files


    Now we have one archived file, but that file is bigger than the sum of the original
    files. What if you want to compress those files for ease of transport? Linux has
    several commands capable of compressing files. We will look at:


    +   - gzip, which uses the extension .tar.gz or .tgz

    - bzip2, which uses the extension .tar.bz2

    - compress, which uses the extension .tar.z


    These are all capable of compressing files, but they use different compression
    algorithms and have different compression ratios. Therefore, we''ll look at each
    one and what it''s capable of.


    In general, compress is the fastest, but the result files are the largest; bzip2
    is the slowest, and the result files are the smallest; gzip falls somewhere between.
    The main reason you, as a budding hacker, should know all three methods is when
    accessing other tools, you will run into various types of compression. Therefore,
    this section shows how to deal with the main methods of compression.


    # Compressing with gzip


    Let''s try gzip (GNU zip) first, as it is the most commonly used utility in Linux.
    You can compress your HackersArise.tar file by entering the following (making
    sure you''re in the directory that holds the archived file):


    ```

    kali >gzip HackersArise.*

    ```


    Notice that we used the wildcard * for the file extension; this tells that the
    command should apply to any file that begins with HackersArise with any file extension.
    You will use similar notation for the following examples. When we do a long listing
    on the directory, we can see that HackersArise.tar.gz, and the file size has been
    compressed to 3,299 bytes!


    ```

    kali ls -l

    --snap-- -rw-r--r-- 1 root 3299 Nov 27 2018 13:32 HackersArise.tar.gz

    --snap--

    ```


    Now we decompress that same file by using the gzip command, short for GNU unzip.'
  merge: -1
