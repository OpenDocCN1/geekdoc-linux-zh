    # Your First Hacker Script: Scan for Open Ports


    Now that you have some basic scripting skills, let''s move to some slightly more
    advanced scripting that has real-world application to hacking. We''ll use an example
    from the world of black hacking. Black hackers are those with malicious intentions,
    such as stealing credit card numbers or White hat hackers are those with good
    intentions, such as helping software developers or system administrators make
    their systems more secure. Gray hackers are those who tend to move between these
    two extremes.


    Before you continue, you need to become familiar with a simple yet essential tool
    nmap that comes installed on Kali. You''ve likely heard the name; nmap is used
    to probe a system to see whether it is connected to the network and find which
    ports are open. The open ports discovered, you can determine what services are
    running on the target system. This is crucial for any hacker or system administrator.
    In its simplest, the syntax for running nmap looks like


    ```

    nmap <type of scan><target IP> <optionally, target port>

    ```


    Not too difficult. The simplest and most reliable nmap is the TCP connect scan,
    designated with the -sT switch in nmap. So, if you wanted to scan IP address 192.168.181.1
    with a TCP scan, you would enter the following:


    ```

    nmap -sT 192.168.181.1

    ```


    To take this step further, if you wanted to perform a TCP scan of address 192.168.181.1,
    looking to see whether port 3306 (the default port for MySQL) was open, you could
    enter this:


    ```

    nmap -sT 192.168.181.1 -p 3306

    ```


    Here, -p designates the port you want to scan for. Go ahead and try it out on
    your Kali system.


    # Our Task


    At the time of this writing, there is a hacker serving in US federal prison by
    the name of Max Butler, also known as Max Vision throughout the hacker world.
    Max was a kind of gray hacker. By day, he was an security professional in Silicon
    Valley, and by night, he was stealing and selling credit card numbers on the black
    market. At one time, he ran the world''s largest credit black market, CardsersMarket.
    Now, Max is serving a 13-year prison term'
