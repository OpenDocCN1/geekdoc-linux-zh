    # COVERS

    KALI LINUX

    AND PYTHON 3


    ![](img/1d1085ba208631ba5cace7619c3050fa_249_0.png)


    If you''re getting started along the exciting path of hacking, cybersecurity,
    and pentesting, Linux Basics for Hackers is an excellent first step. Using Kali
    Linux, an advanced penetration testing of Linux and directory permissions, you''ll
    learn the basics of using the Linux operating system and acquire the tools and
    techniques you''ll need to take control of a Linux environment.


    +   * Keep your internet activity stealthy using Tor, proxy servers, VPNs, and
    encrypted email

    * Write a bash script to scan open ports for potential targets

    * Use and abuse services like MySQL, Apache web server, and OpenSSH

    * Build your own hacking tools, such as a remote spy camera and a password cracker

    nHacking is complex, and there is no single way to. Why not start at the beginning
    with Linux Basics for Hackers?


    First, you''ll learn how to install Kali on a virtual machine and get an introduction
    to basic Linux concepts. Next, you''ll tackle broader Linux topics like manipulating
    text, controlling file and directory permissions, and managing user environment
    variables. You''ll then focus on foundational concepts like security and anonymity
    and learning scripting with bash and Python.


    Practical tutorials and exercises throughout will reinforce and test your skills
    as you learn how to:


    +   * Cover your tracks by changing your network information and manipulating
    the ryslog logging utility

    * Write a tool to scan for network connections, and connect and listen to wireless
    networks


