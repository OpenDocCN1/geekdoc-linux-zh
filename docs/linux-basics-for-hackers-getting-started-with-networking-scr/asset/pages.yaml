    For example, if the umask is set to 022, a new file with the original default
    permissions of 666 will now have the permissions 644, meaning the owner has both
    read and write permissions, and the group and all users have only read permission.


    In Kali, with most Debian systems, the umask is preconfigured to 022, meaning
