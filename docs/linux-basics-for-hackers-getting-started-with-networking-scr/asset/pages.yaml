  md: 'Search for the word mysql in the snort.conf file using grep, like so:


    ```

    kali >cat /etc/snort/snort.conf | grep mysql

    include $RULE_PATH/mysql.rules

    #include $RULE_PATH/server-mysql.rules

    ```


    You should decide that the grep command found two occurrences of mysql.

    Let''s say you wanted to replace every occurrence of mysql with MySQL (remember,
    Linux is case sensitive) and then save the new file to snort2.conf.

    You could do this by using the grep command in Listing 2-6.


    ```

    kali >sed s/mysql/MySQL/g /etc/snort/snort.conf > snort2.conf

    ```


    Listing 2-6: Using sed to find and replace keywords or phrases


    The s command performs the search: you give the term you are searching for (mysql)
    and then the term you want to replace it with (MySQL), separated by a slash (/).
    The g command tells Linux that your replacement is performed globally. The result
    is saved to a new file named snort2.conf.


    Now, when you grep with snort2.conf to search for mysql, you''ll see that no instances
    were found, but when you search for MySQL, you will see two occurrences.


    ```

    kali >cat snort2.conf | grep MySQL

    include $RULE_PATH/MySQL.rules

    #include $RULE_PATH/server-MySQL.rules

    ```


    > If you wanted to replace only the first occurrence of the term mysql, you would
    leave out the trailing g.


    ```

    kali >sed s/mysql/MySQL/ snort.conf > snort2.conf

    ```


    You can also use the sed command to find and replace any specific occurrence of
    a word rather than all occurrences or the first occurrence. For instance, if you
    want to replace only the second occurrence of the word mysql simply place the
    number of the occurrence (in this case, 2) at the end of the command:


    ```

    kali >sed s/mysql/MySQL/2 snort.conf > snort2.conf

    ```


    This command affects only the second occurrence of mysql.


