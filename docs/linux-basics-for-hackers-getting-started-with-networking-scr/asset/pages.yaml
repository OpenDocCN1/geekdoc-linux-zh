  md: 'lo Linkencap:Local Loopback

    net addr:127.0.0.1 Mask:255.0.0.0

    --snip--


    The Wi-Fi interface here is shown as wlan0 In Kali Linux, Wi-Fi interfaces are
    usually designated as wlanX, X representing the number of that interface. In other
    words, the first Wi-Fi adapter on your system would be labeled wlan0, the second
    wlan1, and so on.


    If you just want to see your Wi-Fi interfaces and their statistics, Linux has
    a specific command that is similar to ifconfig but dedicated to wireless. That
    command is iwconfig. When you enter it, only your wireless interfaces and key
    data are displayed:


    ```

    kali iwconfig

    wlan0 no wireless extensions


    wlan0 IEEE 802.11bg SSID:off/any

    Mode:Managed Access Point:Not-Associated Tx-Power=20 dBm

    Retry limit: 7 RTS thr:off Fragment thr:off

    Encryption key:off

    Power Management:off

    ```


    Here we just see the wireless interfaces, also known as network cards, and key
    data about them, including the wireless standard, utilized the SSID is off, and
    the mode. The mode has three settings: managed, which means it is ready to join
    or has joined an AP; master, which means it is ready to act as or is already an
    AP; and monitor, which we will discuss little later in the chapter. We can also
    see whether any client has associated with it and what transmit power is, among
    other things. You can tell from this example that wlan0 is in the mode required
    to connect to a Wi-Fi network but not connected to any. We will revisit this command
    again once the wireless interface is connected to a Wi-Fi network.


    If you are not certain which Wi-Fi AP you want to connect to, you can see all
    the wireless access points your network card can reach using the iwlist command.
    The syntax for iwlist is as follows:


    ```

    iwlist interface action

    ```


    You can perform multiple actions with iwlist. For our purposes, we''ll use the
    scan action to see all the Wi-Fi APs in your area. (Note that with a standard
    antenna, your range will be 300–500 feet, but this can be extended with an inexpensive
    high-gain antenna.)


    ```

    kali iwlist wlan0 scan

    wlan0 Scan completed:

    Cell 01 Address:88:AD:43:75:B3:82

    Channel:1

    ```'
