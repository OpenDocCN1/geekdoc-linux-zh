  md: '# #12


    # ## USING AND ABUSING SERVICES


    ![](img/1d1085ba208631ba5cace7619c3050fa_158_0.png)


    In Linux terminology, a *service* is an application that runs in the background
    waiting for you to use it. Your Linux system has dozens of services preinstalled.
    Of these, the most well known is the ubiquitous Apache Web Server, which is used
    for creating, managing, and deploying web servers, but there are so many more.
    For the purposes of this chapter on services, I have selected just four that are
    of particular importance to the hacker: Apache Web Server, OpenSSH, MySQL, and
    PostgreSQL.


    In this chapter, you''ll learn how to set up a web server with Apache, physically
    spy with OpenSSH, access data with MySQL, and store your hacking information with
    PostgreSQL'
  merge: -1
