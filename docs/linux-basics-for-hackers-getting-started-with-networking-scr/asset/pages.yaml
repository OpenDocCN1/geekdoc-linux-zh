  md: '# Searching with locate


    Probably the easiest command to use is locate. Followed by a keyword denotating
    what you want to find, this command will go through your entire filesystem and
    locate every occurrence of that word.


    To look for aircrack-ng, for example, enter the following:


    ```

    kali >locate aircrack-ng

    /usr/bin/aircrack-ng

    /usr/share/applications/kali-aircrack-aircrack-ng.desktop

    /usr/share/desktop-directories/05-1-01-aircrack-ng.directory

    --snip----

    /var/lib/dpk/info/aircrack-ng.md5sums

    ```


    The locate command is not perfect, however. Sometimes the results of locate can
    be overwhelming, giving you too much information. Also, locate uses a database
    that is usually updated once a day, so if you just created a file a few minutes
    or few hours ago, it might not appear in this list until the next day. It''s worth
    knowing the disadvantages of these basic commands so you can better decide when
    to use each one.


    # Finding Binaries with whereis


    If you''re looking for a binary file, you can use the whereis command to locate
    it. This command returns not only the location of the binary but also its source
    and man page if they are available. Here''s an example:


    ```

    kali >whereis aircrack-ng

    aircrack-ng: /usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz

    ```


    In this case, whereis returned just the aircrack-ng binaries and man page, rather
    than every occurrence of the word aircrack-ng. Much more efficient and illuminating,
    don''t you think?


    # Finding Binaries in the PATH Variable with which


    The command is even more specific: it only returns the location of the binaries
    in the PATH variable in Linux. We''ll look more closely at the PATH variable in
    Chapter 7, but for now it''s sufficient to know that PATH holds the directories
    in which the operating system looks for the commands you execute at the command
    line. For example, when I enter aircrack-ng on the command line, the operating
    system looks to the PATH variable to see in which directories it should look for
    aircrack-ng:


    ```

    kali >which aircrack-ng

    /usr/bin/aircrack-ng

    ```


    Here, which was able to find a single binary file in the directories listed in
    the PATH variable. At minimum, these directories usually include /usr/bin, and
    may include /usr/sbin and maybe a few others.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Performing More Powerful Searches with find


    The find command is the most powerful and flexible of the searching utilities.
    It is capable of beginning your search in any designated directory and looking
    for a number of different parameters, including of course, the file-name but also
    the date of creation or modification, the owner, the group, permissions, and the
    size.


    Here''s the syntax for find:


    ```

    find directory options expression

    ```


    So, if I wanted to search for a file with the name apache2 (the open source web
    server) starting in the root directory, I would enter the following:


    ```

    kali >find / -type f -name apache2

    ```


    First I state the directory which to start the search, in this case / ①. Then
    I specify which type of file to search for, in this case f for an ordinary file
    ②. Last, I give the name of the file I''m searching for, in this case apache2
    ③.


    My results for this search are shown here:


    ```

    kali /find f -name apache2

    usr/lib/apache2/mpm-itk/apache2

    usr/lib/apache2/mpm-event/apache2

    usr/lib/apache2/mpm-worker/apache2

    usr/lib/apache2/mpm-prefork/apache2

    etc/cron.daily/apache2

    etc/logrotate.d/apache2

    etetc/init.d/apache2

    etc/default/apache2

    ```


    The find command started at the root of the filesystem (/), went through every
    directory looking for apache2 in the filename, and then listed all instances found.


    As you might imagine, a search that looks in every directory can be slow. One
    way to speed it up is to look only in the directory where you would expect to
    find the file(s) you need. In this case, we are looking for a configuration file,
    so we could start the search in the /etc directory, and Linux would only search
    as far as its subdirectories. Let''s try it:


    ```

    kali >find -type f -name apache2

    etc/init.d/apache2

    etc/logrotate.d/apache2

    etc/cron.daily/apache2

    ```


    This much quicker search only found occurrences of apache2 in the /etc directory
    and its subdirectories. It''s also important to note that unlike some other search
    commands, find displays only exact match names. If the'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'file apache2 has an extension, such as apache2.conf, the search will not find
    a match. We can remedy this limitation using wildcards. Wildcards come in a few
    different forms: *, ? and [].


    Let''s look in the /etc directory for all files that begin with apache2 and have
    any extension. For this, we could write a find command using the following wildcard:


    ```

    kali >find /etc -type --name apache2.*

    /etc/apache2.conf

    ```


    When we run this command, we find that there is one file in the /etc directory
    that fits the apache2.* pattern. When we use a period followed by the wildcard,
    the terminal looks for any extension after the filename apache2. This can be a
    very useful technique for finding files where you don''t know the file extension.


    When I run this command, I find two files that start with apache2 in the /etc
    directory, including the apache2.conf file.


    # A QUICK LOOK AT WILDCARDS


    > Let''s say we''re doing a search on a directory that has the files cat, hat,
    what and bat. The ? wildcard is used to represent a single character, so a search
    for ?at would not find cat, hat but not what, because as in this filename is preceded
    by two letters. The [] wildcard is used to match the characters that appear inside
    the square brackets. For example, a search for [c,b]at would match cat but not
    hat or what. Among the most widely used wildcards is the asterisk [*], which matches
    any character(s) of any length, from none to an unlimited number of characters.
    A search for *at, for example, would find cat, hat, what, and bat.


    # Filtering with grep


    Often when using the command line, you''ll want to search for a particular keyword.
    For this, you can use the grep command as a filter to search for keywords.


    The grep command is often used when output is piped from one command to another.
    I cover in Chapter 2, but for now, suffice to say that Linux (and Windows for
    that matter) allows us to see the output of one command and set it as input to
    another command. This is called piping, and we use the | command to do it (the
    | is usually the ENTER key on your keyboard).


    The ps command is used to display information about processes running on the machine.
    We cover this in more detail in Chapter 6, but for this'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'example, suppose I want to see all the processes running on my Linux system.
    In this case, I can use the ps (processes) command followed by the aux switches
    to specify which process information to display, like so:


    ```

    kali >ps aux

    ```


    This provides me with a listing of all the processes running in this system—but
    what if I just want to find one process to see if it is running?

    I can do this by piping the output from ps to grep and searching for a keyword.
    For instance, to find out whether the apache2 is running, I would enter the following:


    ```

    kali >ps aux | grep apache

    root 4851 0.2 0.37548 7668 ? Ss 10:14 00:00 /usr/sbin/apache2 -k start

    root 4906 0.0 0.37572 4228 ? S 10:14 00:00 /usr/sbin/apache2 -k start

    root 4910 0.0 0.37572 4228 ? Ss 10:14 00:00 /usr/sbin/apache2 -k start

    --snap

    ```


    this command tells Linux to display all my services and then send output to grep,
    which will look through the output for the keyword apache2 and then display only
    the relevant output, saving time and my eyesight.


    # Modifying Files and Directories


    Once you''ve found your files and directories, you''ll want to be able to perform
    actions on them. In this section, we look at how to create files and directories,
    copy files, rename files, and delete files and directories.


    # Creating Files


    There are many ways to create files in Linux, but for now we''ll just look at
    two simple methods. The first is cat, is short for *concatenate*, meaning pieces
    together (not a reference to your favorite domesticated feline). The cat command
    is generally used for displaying the contents of a file, but it can also be used
    to create small files. For creating bigger files, it''s better to edit the code
    in a text editor such as vim, emacs, leafpad, gedit, or kate and save it as a
    file.


    # Concatenation with cat


    The cat command followed by a filename will display the contents of that file,
    but to create a new file, follow the cat command with redirect, with the > symbol,
    and a name for the file we want to create. Here''s an example:


    ```

    kali >cat > hackingskills

    Hacking is the most valuable skill of the 21st century!

    ```'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'When you press ENTER, Linux will go into interactive mode and wait for you
    to start entering content for the file. This can be puzzling because the prompt
    disappears, but if you simply begin typing, whatever you enter will go into the
    file (in this case, hackskills). Here, I entered Hacking is the most valuable
    skill set of the 21st century! To exit and return to the prompt, I press CTRL-D.
    Then, I want to see what''s in the file hackskills, I entered the following:


    ```

    kali cat hackskills

    Hacking is the most valuable skill set of the 21st century!

    ```


    If you don''t use the redirect symbol, Linux will spit back the contents of your
    file.

    To add, or append, more content to a file, you can use the cat command with a
    double redirect (>), followed by whatever you want to add to the end of the file.
    Here is an example:


    ```

    kali >> hackskills

    Everyone learn hacking

    ```


    Linux once again goes into interactive mode, waiting for content to append to
    the file. When I enter Everyone learn hacking and press CTRL-D, I am returned
    to the prompt. Now, when I display the contents of that file with cat, I can see
    that the file has been appended with Everyone learn hacking, as shown here:


    ```

    kali cat hackskills

    Hacking is the most valuable skill set of the 21st century! Everyone learn hacking

    ```


    If I want to overwrite the file with new information, I can simply use the cat
    command with a single redirect again, as follows:


    ```

    kali > hackskills

    Everyone in IT security without hacking skills is in the dark

    kali > hackskills

    Everyone in IT security without hacking skills is in the dark

    ```


    As you can see here, Linux goes into interactive mode, and I enter the new text
    and then exit back to the prompt. When I again use cat to see the content of the
    file, I see that my previous words have been overwritten with the latest text.


    # File Creation with touch


    The second command for file creation is touch. This was originally developed so
    a user could simply touch a file to change some of its details, such as the date
    it was created or modified. However, if the file doesn''t already exist, this
    command creates that file by default.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Let''s create newfile with touch:


    ```

    kali >touch newfile

    ```


    Now when I use ls -1 to see the long list of the directory, I see that a new file
    has been created newfile. Note that its size is 0 because there is no content
    in newfile.


    # Creating a Directory


    The command for creating a directory in Linux mkdir, a contraction of make directory.
    To create a directory named newdirectory, enter the following command:


    ```

    kali >mkdir newdirectory

    ```


    To navigate to this newly created directory, simply enter this:


    ```

    kali >cd newdirectory

    ```


    # Copying a File


    To copy files, we use the cp command. This creates a duplicate of the file in
    the new location and leaves the old one in place.


    Here, we''ll create the oldfile in the root directory with touch and copy it to
    /root/newdirectory, renaming it in the process and leaving the original oldfile
    in place:


    ```

    kali >touch oldfile

    kali >cp oldfile /root/newdirectory/newfile

    ```


    Renaming the file is optional and is done simply by adding the name you want to
    go to the end of the directory path. If you don''t rename the file when you copy
    it, the file will retain the original name by default.


    When we navigate to newdirectory, we see that there is an exact copy of called
    newfile:


    ```

    kali >cd newdirectory

    kali >ls

    ```


    ```

    newfile oldfile

    ```


    # Renaming a File


    Unfortunately, Linux doesn''t have a command intended solely for renaming a file,
    as Windows and some other operating systems do, but it does have the mv (move)
    command.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'The mv command can be used to move a file or directory to a new location or
    simply to give an existing file a new name. To rename newfile to newfile2, you
    would enter the following:


    ```

    kali mv newfile newfile2

    kali ls

    oldfile newfile

    ```


    When you list (ls) that directory, you see newfile2 but not newfile, because it
    has been renamed. You can do the same with directories.


    # Removing a File


    To remove a file, you can simply use the rm command, like so:


    ```

    kali >rm newfile2

    ```


    If you now do a long listing on the directory, you can confirm that the file has
    been removed.


    # Removing a Directory


    The command for removing a directory is similar to the rm command for removing
    files with dir (for directory) appended, like so:


    ```

    kali >rmdir newdirectory

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```


    It''s important to note that rmdir will not remove a directory that is not empty,
    but will give you a warning message that the “directory is not empty,” as you
    can see in this example. You must first remove all the contents of the directory
    before removing it. This is to stop you from accidentally deleting objects you
    didn''t intend to delete.


    If you want to remove a directory and its content all in one go, you can use the
    -r switch after rm, like so:


    ```

    kali >rm -r newdirectory

    ```


    Just a word of caution, though: be wary of the -r option with rm, at least first,
    because it is very easy to remove valuable files and directories by mistake. Using
    rm -r in your home directory, for instance, would delete every file and directory
    there—probably not what you were intending.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# # Go Play Now!


    Now that you have some basic skills for navigating around the filesystem, you
    can play with your Linux system a bit before progressing. The best way to become
    comfortable with using the terminal is to try out your newfound skills right now.
    In subsequent chapters, we will explore farther and deeper into our hacker playground.


    Before you move to Chapter 2, try out the skills you learned from this chapter
    by completing the following exercises:


    1. Use the `ls` command from the root (/) directory to explore the directory structure
    of Linux. Move to each of the directories with the `cd` command and run `pwd`
    to verify where you are in the directory structure.

    2. Use the `whoami` command to verify which user you are logged in as.

    3. Use the `locate` command to find wordlists that can be used for password cracking.

    4. Use the `cat` command to create a new file and then append to that file. Keep
    in mind that `>` redirects input to a file and `>>` appends to a file.

    5. Create a new directory called `hackerdirectory` and create a new file in that
    directory named `hackedfile`. Now copy that file to /root directory and rename
    it `secretfile`.'
