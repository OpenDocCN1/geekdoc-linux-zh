  md: '# Finding Yourself with pwd


    Unlike when you''re working in a graphical user interface (GUI) environment like
    Windows or macOS, the command line in Linux does not always make it apparent which
    directory you''re present in. To navigate to a new directory, you need to know
    where you are currently. The present working directory command, pwd, returns your
    location within the directory structure.


    Enter pwd in your terminal to see where you are:


    ```

    kali >pwd

    /root

    ```


    In this case, Linux returned /root, telling me I''m in the root user''s directory.
    And because you logged in as root when you started Linux, you should be in the
    root user''s directory, too, which is one level below the filesystem structure
    (/).


    If you''re in another directory, pwd will return that directory name instead.


    # Checking Your Login with whoami


    In Linux, the one "all-powerful" superuser or system administrator is named root,
    and it has all the system privileges needed to add users, change passwords, change
    privileges, and so on. Obviously, you don''t want anyone to have the ability to
    make these changes; someone who can be trusted and has proper knowledge of the
    operating system. As a hacker, you usually need to have all privileges to run
    the programs and commands you need (many hacker tools won''t work unless you have
    root privileges), so you''ll want to log in as root.


    If you''ve forgotten whether you''re logged in as root or another user, you can
    use the whoami command to see which user you''re logged in as:


    ```

    kali >whoami

    root

    ```


    If I had logged in as another user, such as my personal account, whoami would
    have returned my username instead, as shown here:


    ```

    kali >whoami

    ot

    ```


    # Navigating the Linux Filesystem


    Navigating the filesystem from the terminal is an essential Linux skill. To get
    anything done, you need to be able to move around to find applications, files,
    and directories located in other directories. In a GUI-based system,'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'you can visibly see the directories, but when you''re using the command line
    interface, the structure is entirely text based, and navigating the filesystem
    means using some commands.


    # Changing Directories with cd


    To change directories from the terminal, use the change directory command, cd.
    For example, here''s how to change to the /etc directory used to store configurations:


    ```

    kali >cd /etc

    root@kali:/#

    ```


    The prompt changes to root@kali:/etc, indicating that we''re in the /etc directory.
    We can confirm this by entering pwd:


    ```

    root@kali:/etc# pwd

    /etc

    ```


    To move up one level in the file structure (toward the root of the file structure,
    or /), we use cd followed by double dots (..), as shown here:


    ```

    root@kali:/etc# cd ..

    root@kali:/# pwd

    /

    ```


    This moves up one level from /etc to the /root directory, but you can move up
    as many levels as you need. Just use the same number of doubledot pairs as the
    number of levels you want to move:


    +   * You use .. to move up one level.

    * You use .. .. to move up two levels.

    * You use .. .. .. to move up three levels, and so on.


    For example, to move up two levels, enter cd followed by two sets of double dots
    with a space in between:


    ```

    kali >cd .. ..

    ```


    You can also move up to the root level in the file structure from anywhere by
    entering cd /, where / represents the root of the filesystem.


    # Listing the Contents of a Directory with ls


    To see the contents of a directory (the files and subdirectories), we can use
    the ls (list) command. This is very similar to the dir command in Windows.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# kali >ls


    ```

    bin initrd.img media run var

    boot initrd.img.old sbin vmlinux

    dev lib opt srv vmlinux.old

    etc lib64 proc tmp

    home lost+found root usr

    ```


    This command lists both the files and directories contained in the directory.
    You can also use this command on any particular directory, not just the one you
    are currently in, by listing the directory name after the command; for example,
    ls /etc shows what''s in the /etc directory.


    To get more information about the files and directories, such as their permissions,
    owner, size, and when they were modified, you can add the -1 switch after ls (the
    1 stands for long). This is often referred to as long listing. Try it at here:


    # kali >ls -l


    | total 84 | |

    |---|---|---|---|---||

    | drw-r-r-- | 1 | root | 4096 | Dec | 11:15 | bin |

    | drw-r-r-- | 2 | root | 4096 | Dec | 11:15 | boot |

    | drw-r-r-- | 3 | root | 4096 | Dec | 9:10 | dev |

    | drw-r-r-- | 18 | root | 4096 | Dec | 13:43 | etc |

    | drw-r-r-- | 1 | root | 4096 | Dec | 11:15 | var |


    As you can see, ls -l provides us with significantly more information, such as
    whether an object is a file or directory, the number of links, the owner, its
    size, when it was created or modified, and its name.

    I typically add the -l switch when doing an ls in Linux, but to each in their
    own. We''ll talk more about ls -l in Chapter 5.


    Some files in Linux are hidden and won''t be revealed by a simple ls -l command.
    To show hidden files, add a lowercase -a switch, like so:


    # kali >ls -la


    If you aren''t seeing a file you expect to see, it''s worth trying ls -l a a flag.


    # Getting Help


    Nearly every command, application, or utility has a dedicated help file in Linux
    for its use. For instance, if I needed help using the best wireless cracking tool,
    airrack-ng, I could simply type the airrack-ng command followed by the --help
    command:


    ```

    kali >airrack-ng --help

    ```


    Note the data dash here. The double dash (--) before word options, such as help,
    and a single dash (-) before single-letter options, such as -h.'
