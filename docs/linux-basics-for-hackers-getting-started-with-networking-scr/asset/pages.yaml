    # # Installing Software with git


    Sometimes the software you want isn''t available in any of the repositories—especially
    if it''s brand new—but it may be available on github (https://www.github.com/),
    a site that allows developers to share their software with others to download,
    and provide feedback. For instance, if you need bluevied, a Bluetooth hacking
    and pentesting suite, and you can''t find it in the Kali repository, you can search
    github for the software by entering bluevied into the search bar. If it exists
    on github, you should see the repository for it in its results.


    Once you''ve found the software on github, you can install it from the terminal
    by entering the git clone command followed by its URL. For instance, bluevied
    is located at https://www.github.com/balle/bluevied-git To clone it into your
    system, enter the command shown in Listing 4-7.


    ```

    kali git clone https://www.github.com/balle/bluevied.git

