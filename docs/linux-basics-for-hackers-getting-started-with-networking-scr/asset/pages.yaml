  md: '# Using a GUI-based Installer


    Newer versions of Kali no longer include a GUI-based software installation tool,
    but you can always install one with the apt-get command. The most common GUI-based
    installation tools are Synaptic and Gdebi. Let''s install Synaptic and use it
    to install our Snort package:


    ```

    kali >apt-get install synaptic

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    --snip-

    Processing triggers for menu (2.1.47)...

    kali >

    ```


    Once you have installed Synaptic, you can start it from Settings > **Synaptic
    Package Manager**, which should open a window like the one in Figure 4-2.


    ![](img/1d1085ba208631ba5cace7619c3050fa_82_0.png)


    Figure 4-2: The Synaptic Package Manager interface


    Now you can search for the package you''re looking for. Simply click the **Search**
    tab to open a search window. Because you are looking for Snort again, enter **snort**
    into the search window and click **Search**. Scroll down the search results to
    find the package you''re looking for. Check the box next to snort and then click
    the **Apply** tab, as shown in Figure 4-3. Synaptic will now download and install
    Snort from the repository along with any necessary dependencies.'
