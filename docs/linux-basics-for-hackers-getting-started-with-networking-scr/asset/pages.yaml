    # Summary


    In this chapter, you learned a few of the ways to download and install new software
    on your Linux system. Software package managers (like apt), GUI-based installers,
    and git clones are the most common and crucial methods for an aspiring hacker
    to know. You''ll soon find yourself becoming familiar with each of them.


