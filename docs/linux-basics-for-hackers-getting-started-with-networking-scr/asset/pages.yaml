- img_proc: true
  md: 'This assigns the original PATH variable plus the /root/newhackingtool directory
    to the new PATH variable, so the variable contains everything it did before, plus
    the new tool directory.


    If you examine the contents of the PATH variable again, you should see that this
    directory has been appended to the end of PATH, as shown here:


    ```

    kali >echo $PATH

    /usr/local/bin:usr/sbin:/bin:/root/newhackingtool

    ```


    Now you can execute newhackingtool applications from anywhere on your system,
    rather than having to navigate to its directory. The bash shell will look in all
    directories listed for your new tool!


    Adding PATH can be a useful technique for directories you use often, but be careful
    not to add many directories to your PATH variable. Because the system will have
    to search through each and every directory in PATH to find commands, adding a
    lot of directories could slow down your terminal and your hacking.


    # How Not to Add to the PATH Variable


    One mistake commonly made by new Linux users is assigning a new directory, such
    as /root/newhackingtool, directly to the PATH variable in this:


    ```

    kali >PATH=/root/newhackingtool

    kali >echo $PATH

    /root/newhackingtool

    ```


    If you use this command, your PATH variable will only contain the /root/newhackingtool
    directory and no longer contain the system binaries directories as /bin, /sbin,
    and others that hold critical commands. When you then go to use any of the system
    commands, you will receive the error command not found, unless you first navigate
    to the system binaries directory when you execute the command:


    ```

    kali >cd

    bash: cd command not found

    ```


    Remember that when you want to append to the PATH variable, not replace it. If
    you''re in doubt, save the contents of the variable somewhere you modify it.


    # Creating a User-Defined Variable


    You can create your own custom, user-defined variables in Linux by assigning a
    value to a new variable that you name. This may be useful when you are doing some
    advanced shell scripting or find''re often using a long command that you get tired
    of typing over and over.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'The syntax is straightforward: enter the name of your variable, followed by
    the assignment symbol (=), and then the value to put in the variable, as shown
    here:


    ```

    kali >MYNEWVARIABLE="Hacking is the most valuable skill set in the 21st century"

    ```


    This assigns a string to the variable MYNEWVARIABLE. To see the value in that
    variable, use the echo command and the $ content symbol with the variable-name,
    as we did earlier:


    ```

    kali >echo $MYNEWVARIABLE

    Hacking is the most valuable skill set in the 21st century

    ```


    Just like our system environment variables, user-defined variables must be exported
    to persist to new sessions.

    If you want to delete this new variable, or any variable, use the unset command.
    Always think before deleting a system variable, though, because your system will
    operate much differently afterward.


    ```

    kali >unset MYNEWVARIABLE

    kali >echo $MYNEWVARIABLE

    kali >

    ```


    As you can see, when you unset MYNEWVARIABLE, you delete the variable along with
    its value. If you use echo on that same variable, Linux will now return a blank
    line.


    # Summary


    You might find environment variables foreign, but it''s worth getting to know
    them. They control how your working environment in Linux looks, acts, and feels.
    You can manage these variables to tailor your environment to your needs by changing
    them, exporting them, and even creating your own. In some cases, they may be useful
    for covering your tracks as a hacker.'
