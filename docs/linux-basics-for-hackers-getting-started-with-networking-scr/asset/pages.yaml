    631 #include $S0_RULE_PATH/web-misc.rules

    ```


    Listing 2-4: Displaying line numbers in terminal output


    Each line has a number, making referencing much easier.


    # # Filtering Text with grep


    The command grep is probably the most widely used text manipulation command. If
    you filter the content of a file for display, for instance, you want to see all
    lines that include the word output in your snort.conf, you can use cat and grep
    to display only those lines (see Listing 2-5).


    ```

    kali >cat /etc/snort/snort.conf | grep output

    # 60 Configure output plugins

    # Step #66: Configure output plugins

    # output unified22: filename merged.log, limit 128, nostamp, mpls_event_types,

    vlan_event_types

    # output unified2: filename merged.log, limit 128, nostamp, mpls_event_types,

