  md: '# Encrypted Email


    Free commercial email services such as Gmail, Yahoo!, Outlook Web Mail (formerly
    Hotmail) are free for reason: they are vehicles for tracking your interests and
    serving up advertisements. As mentioned already, if a service is free, you are
    the product, not the customer. In addition, the services of the email provider
    (Google, for example) have access to the unencrypted contents of your email, even
    if you''re using HTTPS.


    One way to prevent eavesdropping on your email is to use encrypted email. ProtonMail,
    shown in Figure 13-5, encrypts your email from end to end browser. This means
    that your email is encrypted on ProtonMail servers—even the ProtonMail administrators
    can''t read your email.


    ProtonMail was founded by a group of young scientists at the CERN supercollider
    facility in Switzerland. The Swiss have a long and storied history of protecting
    secrets (remember those Swiss bank accounts you''ve heard so much about?), and
    ProtonMail''s servers are based in the European Union, which has much stricter
    laws regarding the sharing of personal data than ProtonMail does not charge for
    a basic account but offers premium accounts for a nominal fee. It is important
    to note that when exchanging with non-ProtonMail users, there is the potential
    for some or all of the email not to be encrypted. See the ProtonMail support knowledge
    base for full details.


    ![](img/1d1085ba208631ba5cace7619c3050fa_187_0.png)


    Figure 13-5: The ProtonMail login screen'
