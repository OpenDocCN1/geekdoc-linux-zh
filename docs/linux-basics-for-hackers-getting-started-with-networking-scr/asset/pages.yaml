    # ## Summary


    Wireless devices represent the future of connectivity and hacking. Linux has developed
    specialized commands for scanning and connecting to Wi-Fi APs in the first step
    toward hacking those systems. The aircrack-ng suite of wireless hacking tools
    includes both airmon-ng and airdump-ng, which enable us to scan and gather key
    information from in-range wireless devices. The BlueZ suite includes hcconfig,
    hcitool, and other tools capable of scanning and information gathering, which
    are necessary for hacking the Bluetooth devices within range. It also includes
    many other tools worth exploring.


    # ## EXERCISES


    Before you move on to Chapter 15, try out the skills you learned from this by
    completing the following exercises:


    +   1. Check your network devices with ifconfig. Note any wireless extensions.

    2. Run iwconfig and note any wireless network adapters.

    3. Check to see what Wi-Fi APs are in range with iwlist.

    4. Check to see what Wi-Fi APs are in range with nmcli. Which do you find more
    useful and intuitive, nmcli or iwlist?

    5. Connect to your Wi-Fi AP using nmcli.

    6. Bring up your Bluetooth adapter with hcconfig and scan for nearby discoverable
    Bluetooth devices with hcitool.

    7. Test whether those Bluetooth devices are within reachable distance with l12ping.'
