  md: '# 10


    # FILESYSTEM AND STORAGE

    DEVICE MANAGEMENT


    ![](img/1d1085ba208631ba5cace7619c3050fa_138_0.png)


    If you are coming from a Windows environment, the way that Linux represents and
    manages storage devices will look rather different to you. You''ve already seen
    that the filesystem has no physical representation of the drive, like the C:,
    D-; or E: system in Windows, but has a file tree structure with / at the top,
    or root, of it. This chapter takes a look at how Linux represents storage devices
    such as hard drives, flash drives, and other storage devices.


    We first look how additional drives and other storage devices are mounted upon
    that filesystem, leading up to the (/root) directory. Mounting in this context
    means attaching drives or disks to the filesystem to make them accessible to the
    operating system (OS). For you as a hacker, it''s necessary to understand the
    file and storage device management system, both on your own system and off, the
    system of your target.'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'Hackers commonly use external media to load data, hacking tools, or even their
    OS. Once you''re on your target system, you need to understand what you''re working
    with, where to find confidential or other critical files, how to mount a drive
    to the target, and whether and where you can put files on your system. We cover
    all of these topics, how to manage and monitor storage devices, in this chapter.


    We begin with the directory known as /dev, which you''ve probably already noticed
    in the directory structure: dev is short for device, and every device in Linux
    is represented by its own file within the /dev directory. Let''s start out by
    working with /dev.


    # The Device Directory /dev


    Linux has a special directory that contains files representing each attached device:
    the appropriately named /dev directory. As your first introduction, navigate to
    the /dev directory and perform a long listing on it. You should see something
    like Listing 10-1.


    ```

    kali ~cd /dev

    kali ~ls -l

    total 0

    crw------ 1 root root 10,175 May 16 12:44 agpgart

    crw-xr-x 1 root root 10,235 May 16 12:44 autofs

    drw-xr-x 1 root root 160 May 16 12:44 block

    --snip---

    lrwxrwrwrw 1 root root 3 May 16 12:44 cdrom -> sr0

    --snip---

    drw-xr-x 2 root root 60 May 16 12:44 cpu

    --snip---

    ```


    Listing 10-1: A long listing of the /dev directory


    The devices are displayed in alphabetical order by default. You may recognize
    some of the devices, such as a cdom and cpu, but others have cryptic names. Each
    device on your system is represented by a file in the /dev directory, including
    devices you''ve probably never used or ever existed. On the chance you do, there
    is a device waiting to be used for it.


    If you scroll down this screen a bit, you should see more listings of devices.
    Of particular interest are the devices sda, sda2, sda3, sdb, and sdb1, which are
    the hard drive and partitions a USB flash drive and its partitions.


    ```

    --snip---

    brw----- 1 root root 8, 0 May 16 12:44 sda

    brw----- 1 root root 8, 1 May 16 12:44 sda1

    brw----- 1 root root 8, 2 May 16 12:44 sda2

    brw----- 1 root root 8, 5 May 16 12:44 sda5

    ```


    Chapter 10'
