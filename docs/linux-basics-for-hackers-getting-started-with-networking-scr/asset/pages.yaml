- img_proc: true
  md: 'Bluetooth can lead to the compromise of any information on the device, control
    of the device, and the ability to send unwanted info to and from the device, among
    other things.


    To exploit the technology, we need to understand how it works. An in-depth understanding
    of Bluetooth is beyond the scope of this book, but I will give you some basic
    knowledge that will help you scan for and connect to Bluetooth devices in preparation
    for hacking them.


    # How Bluetooth Works


    Bluetooth is a universal protocol for low-power, near-field communication operating
    at 2.4–2.485GHz using spread spectrum, frequency hopping at 1,600 hops per second
    (this frequency hopping is a security measure). It was developed in 1994 by Ericsson
    Corp. of Sweden and named after the 10th-century Danish king Harald Bluetooth
    (note that Sweden and Denmark were a single country in the 10th century).


    The Bluetooth specification has a minimum range of 10 meters, there is no limit
    to the upper range manufacturers may implement in their devices. Many devices
    have ranges as as 100 meters. With special antennas, that range can be extended
    further.


    Connecting two Bluetooth devices is referred to as pairing. Pretty much any two
    Bluetooth devices can connect to each other, but they can pair only if they are
    in discoverable mode. A Bluetooth device in discoverable mode transmits the following
    information:


    +   - Name

    - Class

    - List of services

    - Technical information


    When the two devices pair, they exchange a secret or link key. Each stores this
    link key so it can identify the other in future pairings.

    Every device has a 48-bit identifier (a MAC-like address) and usually a manufacturer-assigned
    name. These will be useful pieces of data when we want to identify and access
    a device.


    # Bluetooth Scanning and Reconnaissance


    Linux has an implementation of the Bluetooth protocol stack called BlueZ we''ll
    use to scan for Bluetooth signals. Most Linux distributions, including Kali Linux,
    have it installed by default. If yours doesn''t, you can usually find it in your
    repository using the default command:


    ```

    kali >apt-get install blue

    ```'
