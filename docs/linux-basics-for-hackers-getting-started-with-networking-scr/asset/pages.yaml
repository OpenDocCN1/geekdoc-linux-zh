  md: '# 13


    # BECOMING SECURE AND ANONYMOUS


    ![](img/1d1085ba208631ba5cace7619c3050fa_176_0.png)


    Today, nearly everything we do on the

    internet is tracked. Whoever is doing the

    tacking—whether it be Google tracking our

    online searches, website visits, and email or the

    National Security Agency (NSA) cataloging all our

    activities—our every one move is being recorded,

    indexed, and then mined for someone’s benefit. The average individual—nand the
    hacker, in particular—needs to understand how to limit this track-

    ing remain relatively anonymous on the web to limit this ubiquitous

    surveillance.


    In this chapter, we look at how you can navigate the World Wide Web

    anonymously (or as close as you can get) using four methods:


    +   - The Onion Network

    - Proxy servers

    - Virtual private networks

    - Private encrypted email'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'No one method is to keep your activities safe from prying eyes, and given enough
    time and resources, anything can be tracked. However, these methods will likely
    make the tracker''s job much more difficult.


    # How the Internet Gives Us Away


    To begin, let''s discuss at a high level some of the ways our activities on the
    internet are tracked. We won''t go into all tracking methods, or into too much
    detail about any one method, as that would be beyond the scope of this book. Indeed,
    such a discussion could take up an entire book on its. Data.


    First, your IP address identifies you as you traverse the internet. Data sent
    from your machine is generally tagged with your IP address, making your activities
    easy to track. Second, Google and other email services will “read” your email,
    looking for keywords to more efficiently serve ads. Although there are many more
    sophisticated methods that are far resource intensive, these are the ones we try
    to prevent in this chapter. Let''s start by taking a look at how IP addresses
    give us away on the internet.


    When you send a packet of data across the internet, it contains the IP addresses
    of the source and destination for the data. In this, the packet knows where it
    is going and where to return the response. Each packet hops through multiple routers
    until it finds its destination and hops back to the sender. For general internet
    surfing, each hop is a router the packet passes through to get to its destination.
    There can be as many 20–30 hops between the sender and the destination, but usually
    any packet will find its way to the destination in fewer than 15 hops.


    As the packet traverses the internet, anyone intercepting the packet can see who
    sent it, where it has, and where it''s going. This is one way web-sites can tell
    you where you arrive and log you in automatically, and it''s also how someone
    can track where you''re on the internet.


    To see what hops a packet might make between you and the destination, you can
    use the traceroute command, as shown next. Simply enter traceroute address or
    domain, and the command will send out packets to the destination and trace the
    route of hops.


    ```

    kali>traceroute google.com

    traceoute to google.com (172.217.1.78), 30 hops, 60 bytes

    1 192.168.1.1 (192.168.1.1) 4.152 ms 32.964 ms

    2 10.0.0.1 (10.0.0.1) 5.797 ms 6.769 ms

    3 96.120.96.45 (96.120.96.45) 27.952 ms 30.377 ms 32.964 ms

    --snip---

    1 lgal155aa4-in-f14.le100 (172.217.1.78) 94.66 ms 42.90 ms

    ```


    As you see, www.google.com is 18 hops across the internet from me. Your results
    will likely be different because Google has many servers across the globe. In
    addition, packets don''t always take the same route across'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'internet, so you might send another packet from your address to the same site
    and receive a different route. Let''s see how we can disguise all this with the
    Tor network.


    # The Onion Router System


    In the 1990s, the US Office of Naval Research (ONR) set out to develop a method
    for anonymously navigating the internet for espionage purposes. The plan was to
    set up a network of routers that was separate from the internet''s routers, that
    could encrypt the traffic, and that only stored the unencrypted IP address of
    the previous router—meaning all other router addresses along the way were encrypted.
    The idea was that anyone watching the traffic could not determine the origin or
    destination of the data. This research became known as “The Onion Router (Tor)
    Project” in 2002, and it''s now available to anyone to use for relatively safe
    and anonymous navigation on the web.


    # How Tor Works


    Packets sent over Tor are not sent over the regular routers so closely monitored
    by many but rather sent over a network of over 7,000 routers around the world,
    thanks to volunteers who allow their computers to be used by Tor. On top of using
    a totally separate router network, Tor encrypts the data, destination, and sender
    IP address of each packet. At each hop, the information is encrypted and decrypted
    by the next hop when it''s received. In this way, each packet contains information
    about only the previous hop along the path and not the IP address of the origin.
    If someone intercepts the traffic, they can see only the IP address of the previous
    hop, and the website owner can see only the IP address of the last router that
    sent the traffic (see Figure 13-1). This ensures anonymity across the internet.


    ![](img/1d1085ba208631ba5cace7619c3050fa_178_0.png)


    +   + Tor node

    - Encrypted path

    -- Clear path


    Figure 13-1: How Tor uses encrypted traffic data'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'To enable the use of Tor, just install the Tor browser from https://www.torproject.org/.
    Once installed, it will look something like Figure 13-2, and you can use it like
    any old internet browser. By using this browser, navigating the internet through
    a separate set of routers and you''ll be able to visit sites without being tracked
    by Big Brother. Unfortunately, the tradeoff is that surfing with Tor browser can
    be a lot slower; because there are not as many routers, the bandwidth is limited
    in this network.


    # # Welcome to Tor Browser


    You are now free to browse the Internet anonymously.


    Test Tor Network Settings


    Search securely with DuckDuckGo


    ![](img/1d1085ba208631ba5cace7619c3050fa_179_0.png)


    +   What Next?

    Tor is NOT all you need to browse anonymously! You may need to change some of
    your habits to ensure your identity stays safe.

    * Tips On Staying Anonymous

    * Tor Browser User Manual


    +   You Can Help!

    There are many ways you can make the Tor network faster and stronger.

    * Run a Tor Relay Node

    * Volunteer Your Services

    * Make a Donation


    The Tor Project is a US 501(c)(3) non-profit dedicated to research, development,
    and education of online anonymity and privacy. Learn more about The Tor Project
    »


    Figure 13-2: The landing page for the Tor browser


    In addition to being capable of accessing nearly any website on the internet,
    the tor is capable of accessing the dark web. The websites that make up the dark
    web require anonymity, so they allow only through the Tor browser, and they have
    addresses ending in .onion for their top-level domain (TLD). The dark web is infamous
    for illegal activity, but a number of legitimate services are also available there.
    A word of caution, however: when accessing the dark web, you may come across material
    that may find offensive.


    # ## Security Concerns


    The intelligence and spy services of the United States and other nations consider
    the Tor network a threat to national security, believing such an anonymous network
    enables foreign governments and terrorists to communicate without being watched.
    As a result, a number of robust, ambitious research projects are working to break
    the anonymity of Tor.'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'Tor''s anonymity has been broken before by these authorities and will likely
    be broken again. The NSA, as one instance, runs its own Tor routers, meaning that
    your traffic may be traversing the NSA when you use Tor. If your traffic is exiting
    the NSA''s routers, that''s even worse, because the exit router always knows your
    destination. The NSA also has a method known as traffic correlation, which involves
    looking for patterns in incoming and outgoing traffic, that has been able to break
    Tor''s anonymity. These attempts to break Tor won''t affect Tor''s effectiveness
    at obscuring your identity from commercial services, such as Google, they may
    limit the browser''s effectiveness in keeping you anonymous from spy agencies.


    # Proxy Servers


    Another strategy for achieving anonymity on the internet is to use proxies, which
    are intermediate systems that act as middlemen for traffic: the user connects
    to a proxy, and the traffic is given the IP address of the proxy before it''s
    passed on (see Figure 13-3). When the traffic returns from the destination, the
    proxy sends the traffic back to the source. In this way, traffic appears to come
    from the proxy and not the originating IP address.


    ![](img/1d1085ba208631ba5cace7619c3050fa_180_0.png)


    Of course, the proxy will likely log your traffic, but an investigator would have
    to get a subpoena or search warrant to obtain the logs. To make your traffic even
    harder to trace, you can use more than one proxy, in a strategy known as a proxy
    chain, which we''ll look at a little later in this chapter.


    Kali Linux has an excellent proxying tool called proxychains that can be set up
    to obscure your traffic. The syntax for the proxychains command is:


    ```

    kali >proxychains <the command you want proxied> <arguments>

    ```'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'The arguments you might include an IP address. For example, if you wanted to
    use proxychains to scan a site with nmap anonymously, you would enter the following:


    ```

    kali >proxychains nmap -sT - P <IP address>

    ```


    This would send the nmap -s5 stealth command to the given IP address through a
    proxy. The tool then builds the chain of proxies itself, so you don''t have to
    worry about it.


    # Setting Proxies in the Config File


    In this section, we set a proxy for the proxychains command to use. As with nearly
    every application in Linux/Unix, configuration of proxies managed by the config
    file—specifically /etc/proxychains.conf. Open the config file in your text editor
    of choice with the following command (replacing leafpad with your chosen editor
    necessary):


    ```

    >leafpad /etc/proxychains.conf

    ```


    You should see a file like the one shown in Listing 13-1.


    ```

    # proxychains.conf VER 3.1

    # HTTP, SOCKS4, SOCKS5 tunneling proxifier with DNS.


    # The option below how the ProxyList is treated.

    # only one option should be uncommented at time,

    # otherwise the last appearing option will be commented

    #

    # dynamic_chain

    #

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    # (dead proxies are skipped)

    # otherwise EINTR is returned to the app strict chain

    # Strict - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # all proxies must be online to play in chain

    # otherwise EINTR is returned to the app M


    --snip--

    ```


    Listing 13-1: The proxychains.conf file


    Scroll down this file to line 61, and you should see the ProxyList section, as
    shown in Listing 13-2.


    ```

    [ProxyList]

    # add proxy here...

    ```'
