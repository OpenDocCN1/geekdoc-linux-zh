  md: 'as init or init.d/rc. This daemon then begins to run a number of scripts found
    in /etc/init.d/rc. These scripts include commands for starting many of the services
    necessary to run your Linux system as you expect.


    # Runlevels


    Linux has multiple runlevels that indicate what services should be started at
    boot. For instance, runlevel 1 is single-user mode, and services such as networking
    are not started in runlevel 1. The rc scripts are set to run depending on what
    runlevel is selected:


    +   0 Halt the system

    1 Single-user/minimal modes

    2–5 Multi-user modes

    6 Reboot the system


    # Adding Services to rc.d


    You can add services for the rc.d script to run at startup using the update-rc.d
    command. This command enables you to add or remove services from the rc.d script.
    The syntax for update-rc.d is straightforward; you simply list the command by
    the name of the script and then the action to perform, like so:


    ```

    kali >update-rc.d name of the script or service remove|defaults|disable|enable

    ```


    As an example of how you can use update-rc.d, let''s assume you want the PostgreSQL
    database to start upon system boot so that your Metasploit framework can use it
    for pentesting and hacking results. You would use rc.d to add a line to your rc.d
    script to have it up and running every time you boot your system.


