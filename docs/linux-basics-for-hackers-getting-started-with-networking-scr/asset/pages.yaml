    mail.info /var/log/mail.info

    mail.warn /var/log/mail.warn

    mail.err /var/log/mail.err

    ```


    listing 11-2: Finding the logging rules in rsyslog.conf


    Each line is a separate logging rule that says what messages are logged and where
    they are logged to. The basic format for these rules is as:


    ```

    facility.priority action

    ```


    The facility keyword references the program, such as mail, kernel, or lpr, whose
    messages are being logged. The priority keyword determines what kind of messages
    to log for that program. The action keyword, on the far right, references the
    location where the log will be sent. Let at each section more closely, beginning
    with the facility keyword, which refers to whatever software is generating the
    log, whether that''s the kernel, the mail system, or the user.


    The following is a list of valid codes that can be used in place of the facility
    keyword in our configuration files rules:


    +   auth/authpriv Security/authorization messages

    cron Clock daemons

    daemon Other daemons

    kern Kernel daemons

    lpr Printing system

    mail Mail system

    user Generic user-level messages


    An asterisk (*) in place of a word refers to all facilities. You can select more
    than one facility by listing them separated by a comma. The priority tells the
    system what kind of messages to log. Codes are listed from lowest priority, starting
    at debug, to highest priority, ending at panic. If the priority is *, messages
    of all priorities are logged. When you a priority, messages of that priority and
    higher are logged. For instance, if you specify a priority code of alert, the
    system will log messages classified as alert and higher priority, but it won''t
    log messages marked as crit or any priority lower than alert.


    Here''s the full list of valid codes for priority:


    +   * debug

    * info

    * notice

    * warning

    * warn

    * error

    * err'
