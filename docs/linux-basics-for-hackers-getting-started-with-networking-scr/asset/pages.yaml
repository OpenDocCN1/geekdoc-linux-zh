  md: '# 15


    # MANAGING THE LINUX KERNEL AND LOADABLE KERNEL MODULES


    ![](img/1d1085ba208631ba5cace7619c3050fa_202_0.png)


    All operating systems are made up of at least two major components. The first
    and most important of these is the kernel. The kernel is at the center of the
    operating system and controls everything the operating system does, including
    managing memory, controlling the CPU, and even controlling what the user sees
    on the screen. The second element of the operating system is often referred to
    as user land and includes nearly everything else.


    The kernel is designed to be a protected or privileged area that can only be accessed
    by root or other privileged accounts. This is for good reason, access to the kernel
    can provide nearly unfettered access to the operating system. As a result, most
    operating systems provide users and services access only to user land, where the
    user can access nearly anything they need without taking control of the operating
    system.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'Access to the kernel allows the user to change how the operating systems works,
    looks, and feels. It also allows them to crash the operating system, making it
    unworkable. Despite this risk, in some cases, the system admin must very carefully
    access the kernel for operational and security reasons.


    In this chapter, we''ll examine how to alter the kernel works and add new modules
    to the kernel. It probably goes without that if a hacker can alter the target''s
    kernel, they can control the system. Furthermore, an attacker may alter the kernel
    functions for some attacks, such as a man-in-the-middle (MITM) attack, where the
    hacker places elements between a client and server and eavesdrop on or alter the
    communication. First, we''ll take a closer look at the kernel structure and modules.


    # What Is a Kernel Module?


    The kernel is the central nervous system of your operating system, controlling
    everything it does, including managing interactions between hardware components
    and starting the necessary services. The kernel operates between the user applications
    you use and the hardware that runs, like the CPU, memory, and hard drive.


    Linux is a monolithic kernel that enables the addition of kernel modules. As modules,
    these can be added and removed from the kernel. The kernel will occasionally need
    updating, which might entail installing new device drivers (such as video cards,
    Bluetooth devices, or USB devices), filesystems drivers, and even system extensions.
    These drivers must be embedded in the kernel to be fully functional. In systems,
    to add a driver, you will have to rebuild, compile, and reboot the entire kernel,
    but Linux has the capability of adding some modules to the kernel without going
    through that process. These modules are referred to as loadable kernel modules,
    or LKMs.


    LKMs access to the lower levels of the kernel by necessity, making them an incredibly
    vulnerable target for hackers. A particular type of malware known as a rootkit
    embeds itself into the kernel of the operating systems, or through those LKMs.
    If malware embeds itself in the kernel, the hacker can take complete control of
    the operating system.


    If a hacker can get the Linux admin to load a new module to the kernel, the hacker
    not only gain control over the target system, because they''re operating at the
    kernel level of the operating system, can control what the target system is reporting
    in terms of processes, ports, hard drive space, and almost anything else you can
    think of.


    So, if a hacker can successfully tempt a Linux admin into installing a video or
    other driver that is a rootkit embedded in it, the hacker can take total control
    of the system and kernel. This is the way of the most insidious rootkits take
    advantage of Linux and other operating systems.


    Understanding LKMs is absolutely key to being an effective Linux admin and being
    a very effective and stealthy hacker.


    Let''s take a look at how the kernel can be managed for good and ill.'
  merge: -1
  pgno: 203
