    +   list-10-3: block device information for the data to lsblk


    The output includes the floppy drive as fd0 and DVD drive as sr0, even though
    neither is on your system—this is a holdover from legacy systems. We can also
    see information on the mount point of the data to—this is the position at which
    the drive was attached to the filesystem. Note that the hard drive sdb is mounted
    at /and the flash drive is mounted at /media. You''ll see more on the significance
    of this in the next section.


    # Mounting and Unmounting


    Most modern operating systems, including most new versions of Linux, automount
    storage devices they’re attached, meaning the new flash or drive is automatically
    attached to the filesystem. For those new to Linux, mounting might be a foreign
    subject.


    A storage device must be physically connected to the filesystem and then logically
    attached to the filesystem in order to be available to the operating system. In
    other words, even if the device is physically attached to the system, it not necessarily
    logically attached and available to the operating system. The term mount is a
    generic from the early days of computing when storage tapes (before hard drives)
    had to be physically mounted to the computer—think of those big computers with
    spinning tape drives you have seen old sci-fi movies.


    As mentioned, the point in the directory tree where devices are attached is known
    as the mount point. The two main mount points in Linux are /mnt and /media. As
    a general rule, internal hard drives are mounted at /mnt, and external USB devices
    such as flash drives and external USB hard drives are mounted at /media though
    technically any directory can be used.


    # Mounting Storage Devices Yourself


    In some versions of Linux, you need to mount a drive manually in order to access
    its content, so this is a skill worth knowing. To mount a drive on the filesystem,
    use the mount command. The mount point should be an empty directory; if you mount
    a directory that has subdirectories and files, the mounted device will cover the
    contents of the directory making them invisible and unavailable. So, to mount
    the new hard drive dbdb at the /mnt directory, you enter the following:


    ```

    kali >mount /dev/sdb1 /mnt

    ```


    That drive should be available for access. If you want to mount the flash drive
    sdc1 at the /media directory, you enter this:


    ```

    kali >mount /dev/sdc1 /media

    ```'
