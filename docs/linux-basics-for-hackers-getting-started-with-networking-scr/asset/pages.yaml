- img_proc: true
  md: 'As you can see from the full output on your screen, the shred commandnhas many
    options. In its most basic form, the syntax is simple:


    ```

    shred <FILE>

    ```


    On its own, shred will delete the file and overwrite it several times—nby default,
    shred overwrites the file four times. Generally, the more times the file is

    written, the harder it is to recover, but keep in mind that each overwrite

    takes time, so for very large files, shredding may become time-consuming.

    Two useful options to include the -f option, which changes the per-

    missions on the file to allow overwriting if permission is neces-

    sary, and the -n option, which lets you choose how many times to overwrite

    t files. With an example, we''ll shred the log in /var/log/auth.log 10 times

    using the following command:


    ```

    kali shred -f n 10 /var/log/auth.log*

    ```


    We need the -f option to give permission to shred auth files, and we

    follow the -n option with the desired number of times to overwrite. After

    t path of the file we want to shred, we include the wildcard asterisk as

    we''re shredding not just the auth.log file, but also any logs that have been

    created with logrotate, such as auth.log.1, auth.log.2, and so on.

    Now try to open a log file:


    ```

    kali leafpad /var/log/auth.log.1

    ```


    Once you''ve shredded a file, you''ll see that the contents are indecipher-

    ble gibberish, as shown in Figure 11-1.


    ![](img/1d1085ba208631ba5cace7619c3050fa_155_0.png)


    Figure 11-1: A shredded log file


    Now if the security engineer or forensic investigator examines the log

    files, they will find nothing of use because none of it is recoverable!


    # Disabling Logging


    Another option for covering your tracks is to simply disable logging. When

    a hacker takes control of a system, they could immediately disable logging

    to prevent the system from keeping track of their activities. This, of course,

    requires root privileges.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'To disable all logging, the hacker could simply stop the rsyslog daemon. Stopping
    any service in Linux uses the same syntax, shown here (you''ll see more on this
    in Chapter 12):


    ```

    service servicename start|stop|restart

    ```


    So, to stop the logging daemon, you could simply enter the following command:


    ```

    kali >service rsyslog stop

    ```


    Now Linux will stop generating any log files until the service is restarted, enabling
    you to operate without leaving any evidence in the log files!


    # Summary


    Log files track nearly everything that happens on your Linux system. They can
    be an invaluable resource in trying to analyze what has occurred, whether it be
    a malfunction or a hack. For the hacker, log files can be evidence of their activities
    and identity. However, an astute hacker can remove and shred these files and disable
    logging entirely, thus leaving no evidence behind.


    EXERCISES

    Before you move on to Chapter 12, try out the skills you learned from this chapter
    by completing the following exercises:

    1. Use the locate command to find all the rsyslog files.

    2. Open the rsyslog.conf file and change your log rotation to one week.

    3. Disable logging on your system. Investigate what is logged in the file /var/log/rsyslog
    when you disable logging.

    4. Use the shred command to shred and delete all your kern log files.'
