    # Remaining Stealthy


    Once you''ve compromised a Linux system, it''s useful to disable logging and remove
    any evidence of your intrusion in the log files to reduce the chances of detection.
    There are many ways to do this, and each carries its own risks and level of reliability.


    # Removing Evidence


    First, you''ll want to remove any logs of your activity. You could simply open
    the log files and precisely remove any logs detailing your activity, line by line,
    using the file deletion techniques you learned in Chapter 2. However, this could
    be time-consuming and leave gaps in the log files, which would look suspicious.
    Also, deleted files can generally be recovered by a skilled forensic investigator.


    A better more secure solution is to shred the log files. With other file deletion
    systems, a skilled investigator is still able to recover the deleted files, but
    suppose there was a way to delete the file and overwrite it several times, making
    it much harder to recover. For us, Linux has a built-in command, appropriately
    named shred, for this purpose.


    To understand how the shred command works, take a quick look at the screen shown
    by the following command:


    ```

    kali shred --help

    Usage: shred [OPTION]...FILE...

    Overwrite the specified FILE(s) repeatedly in order to make it harder

    for even expensive hardware probing to recover data

    --snip--

    ```'
  merge: -1
