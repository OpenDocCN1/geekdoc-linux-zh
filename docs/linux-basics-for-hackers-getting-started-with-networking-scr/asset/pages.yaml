    and binary representatives.


    # Table 5-1: Octal and Binary Representations of Permissions


    | Binary | Octal | rwx |

    |---|---|---|

    | 000 | 0 | --- |

    | 001 | 1 | -x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |


