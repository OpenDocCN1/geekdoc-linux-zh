  md: 'able to recognize file types native to different systems when you investigate.
    The filesystem might indicate what kind of machine the drive was formatted on,
    which can be valuable information. Kali is able to utilize USB drives created
    on many different operating systems.


    As you saw in Chapter 1, the Linux filesystem is structured differently than Windows
    and other proprietary operating systems. On top of this, the files are stored
    and managed is different in Linux, New versions of Windows use an NTFS filesystem,
    whereas others use File Allocation Table (FAT) systems. Linux uses a number of
    different types of filesystems, but the most common are ext2, ext3, and ext4.
    These are all iterations of the ext (or extended) filesystem, with ext4 being
    the latest.


    # Character and Block Devices


    Something else to note about the naming of device files in the /dev directory
    is the first position contains c or b. You can see this in Linux-10-1 at the start
    of many of entries, and it looks something like this:


    ```

    crw------ 1 root root 10,175 May 16 12:44 appgptart

    ```


    These letters represent the two ways that devices transfer data in and out. The
    c stands for character, and these devices are known, as you might expect, by sending
    and receiving data by character, as mice or keyboards, or character devices.


    The b stands for the second type: block devices. They communicate in blocks of
    data (multiple bytes at a time) and include devices like hard drives and DVD drives.
    These devices require higher-speed data throughput and therefore send and receive
    data in blocks (many characters or bytes at a time). Once you know whether a device
    is a character or block device, you can easily get more information about it,
    as you will see.


    # List Block Devices and Information with lsblk


    The Linux command lsblk, short for list block, lists some basic information about
    each block device listed in /dev. The result is similar to the output from fdisk
    -l, but it will also display partitions in a kind of tree, showing each device
    with its partitions, and does not require root privileges to run. In Listing 10-3,
    for example, we see sda, with its branches sda1, sda2, and sda5.


    ```

    kali |lsblk

    Name MAJ:MIN SIZE RO TYPE MOUNTPOINT

    fdo 2:0 1 4K 0 disk

    sda1 8:0 20G 0 disk

    -sda1 8:1 18.7G 0 part /

    -sda2 8:2 1K 0 part

    -sda5 8:5 1.3G 0 part [SWAP]

    ```'
