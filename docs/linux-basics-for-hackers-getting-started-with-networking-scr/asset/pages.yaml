- img_proc: true
  md: 'Next, enter the echo command, which tells the system to simply repeat (or echo)
    back to your monitor whatever follows the command.

    In this case, we want the system to echo back to us "Hello, Hackers-Arise", as
    done in 8-1. Note that the text or message we want to echo back must be in double
    quotation marks.


    ```

    # /bin/bash

    ```


    # This is my first bash script. Wish me luck.


    echo "Hello, Hackers-Arise!"


    Listing 8-1: Your "Hello, Hackers-Arise" script


    Here, you see a line that you''ve yourself preceded by a hash mark (#). This is
    a comment, which is a note you leave to yourself or anyone else reading the code
    to explain what you''re doing in the script. Programmers use comments in every
    coding language. These comments are not read or executed by the interpreter, so
    you don''t need to worry messing up your code. They are visible only to humans.
    The bash knows a line is a comment if it starts with the # character.


    Now, save this file as HelloHackersArise with no extension and exit your text
    editor.


    # Setting Execute Permissions


    By default, a newly created bash script is not executable even by you, the owner.
    Let''s look at the permissions on our new file in the command line by using cd
    to move into the directory and then entering `ls -1`. It should look something
    like this:


    ```

    kali >ls -1

    --sn---

    -rw-r--r-- 1 root 42 Oct 22 14:32 HelloHackersArise

    --sn---

    ```


    As you can see, our new file has rw-r--r-- (644) permissions. As you learned in
    Chapter 5, this means the owner of this file only has read (r) and write (w) permissions,
    but no execute (x) permissions. The group and all other users have only read permissions.
    We need to give ourselves execute permissions in order to run this script. We
    change the permissions with the chmod command, as you saw in Chapter 5. To give
    the owner, the group, and all others execute permissions, enter the following:


    ```

    kali >chmod 755 HelloHackersArise

    ```'
