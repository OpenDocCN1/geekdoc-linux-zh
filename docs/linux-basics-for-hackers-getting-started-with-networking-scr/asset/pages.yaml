    # Summary


    To graduate beyond script-kiddie status, a hacker must master a scripting language,
    and Python is generally a good choice for its versatility and relatively small
    learning curve. The majority of hacking tools are written in Python, including
    sqlmap, scap, and many others. Here, you have learned some Python fundamentals
    you can use to build some simple hacker tools, including a banner grabber and
    an FTP password cracker. To learn more Python, I strongly recommend No Starch’s
    excellent book Automate the Boring Stuff with Python (2015) by Al Swigart.


    # EXERCISES


    Try out the skills you learned from this chapter by completing the following exercises:


    +   1. Build the SSH banner-grabbing tool from Listing 17-5 and then edit it to
