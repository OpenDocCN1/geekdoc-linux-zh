  md: '# # GETTING STARTED WITH THE BASICS


    ![](img/1d1085ba208631ba5cace7619c3050fa_38_0.png)


    By our very nature, hackers are doers. We want to touch and play with things.
    We also want to create and, sometimes, break things. Few of us want to read long
    tomes of information technology theory before we can do what we love most: hacking.
    With that in mind, this chapter is designed to give you some fundamental skills
    to get you up and running in Kali . . . now!


    In this chapter, we won''t go into any concept in great detail—we''ll cover just
    enough to let you play and explore in the operating system of hackers: Linux.
    We will save more in-depth discussions for later chapters.


    # ## Introductory Terms and Concepts


    Before we begin our journey through the wonderful world of Linux Basics for Hackers,
    I want to introduce a few terms that should clarify some concepts discussed later
    in this chapter.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Binaries This term refers to files that can be executed, similar to executables
    in Windows. Binaries generally reside in the /usr/bin or /usr/sbin directory and
    include utilities such as ps, cat, ls, and cd (we'' touch on all four of these
    in this chapter) as well as applications such as the wireless hacking tool airc-rack
    and the intrusion detection system (IDS) Snort.


    Case sensitivity Unlike Windows, Linux is case sensitive. This means that Desktop
    is different from desktop, which is different from Desktop. Each of these would
    represent a different file or directory name. Many people coming from a Windows
    environment can find this frustrating. If you get the error message "file or directory
    not found" and you are sure the file or directory exists, you will need to check
    your case.


    Directory This is the same as a folder in Windows. A directory provides a way
    of organizing files, usually in a hierarchical manner.


    Home Each user has their /home directory, and this is generally where files you
    create will be saved by default.


    Kali Linux is a distribution of Linux specifically designed for penetration testing.
    It has hundreds of tools preinstalled, saving you hours it would take to download
    and install them yourself. I will use the latest version of Kali at the time of
    this writing: Kali 2018.2, first released in April 2018.


    root is nearly over every operating system, Linux has an administrator or superuser
    account, designed for use by a trusted person who can do nearly anything on the
    system. This would include such as figuring the system, adding users, and changing
    passwords. In Linux, that account is called root. As a hacker or pentester, you
    will often use the root account to give yourself control over the system. In many,
    hacker tools require that you use the root account.


    Script is a series of commands run in an interpretive environment that converts
    each line to source code. Many hacking tools are simply scripts. Scripts can be
    run with the bash interpreter or any of the other scripting language interpreters,
    such as Python, Perl, or Ruby. Python is the most popular interpreter among hackers.


    Shell is an environment and interpreter for running commands in Linux. The most
    widely used shell is bash, which stands for Bourne-again shell, but other popular
    shells include the C shell and Z shell. I will be using the bash shell exclusively
    in this book.


    Terminal is this command line interface (CLI).


    With those basics behind us, we will attempt to methodically develop the essential
    Linux skills you will need to become a hacker or penetration tester. In this first
    chapter, I will walk you through getting started with Kali Linux.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# A Tour of Kali


    Once you start Kali, you''ll be greeted with a login screen, as shown in

    Figure 1-1. Log in using the root account username *root* and the default

    password *root*.


    ![](img/1d1085ba208631ba5cace7619c3050fa_40_0.png)


    Figure 1-1: Logging into Kali using the root account


    You should now have access to your Kali desktop (see Figure 1-2). We''ll

    quickly look at two of the most basic aspects of the desktop: the terminal

    interface and file structure.


    ![](img/1d1085ba208631ba5cace7619c3050fa_40_1.png)


    Figure 1-2: The Kali desktop'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# # The Terminal


    The first step in using Kali is to open the terminal, which is the command line
    interface we''ll use in this book. In Kali Linux, you''ll find the icon for the
    terminal at the bottom of the desktop. Double-click this icon to open the terminal
    or press CTRL-ALT-T. Your new terminal should look like the one shown in Figure
    1-3.


    ![](img/1d1085ba208631ba5cace7619c3050fa_41_0.png)


    Figure 1-3: The Kali terminal


    This terminal opens the command line environment, known as the shell, which enables
    you to run commands on the underlying operating systems and write scripts. Although
    Linux has many different shell environments, the most popular is the bash shell,
    which is also the default shell in Kali and many other Linux distributions.

    To change your password, you can use the command passwd.


    # ## The Linux Filesystem


    The Linux filesystem structure is somewhat different from that of Windows. Linux
    doesn''t have a physical drive (such as the C: drive) at the base of the filesystem
    but uses a logical filesystem instead. At the very top of the filesystem structure
    is /, which is often referred to as the root of the filesystem, as if it were
    an upside-down tree (see Figure 1-4). Keep in mind that this is different from
    the root user. These terms may seem confusing at first, but will become easier
    to differentiate once you get used to Linux.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '![](img/1d1085ba208631ba5cace7619c3050fa_42_0.png)


    Figure 1-4: The Linux filesystem


    The root (/) of the filesystem is at the top of the tree, and the following are
    the most important subdirectories to know:


    +   - **/root** The home directory of the all-powerful root user

    - **/etc** Generally contains the Linux configuration files—files that control
    and how programs start up

    - **/home** The user''s home directory

    - **/mnt** Where other filesystems are attached or mounted to the filesystem

    - **/media** Where CDs and USB devices are usually attached or mounted to the
    filesystem

    - **/bin** Where application binaries (the equivalent of executables in Microsoft
    Windows) reside

    - **/lib** Where you''ll find libraries (shared programs that are similar to Windows
    DLLs)


    We''ll spend more time with these key directories throughout this book. Understanding
    these first-level directories is important to navigating through the filesystem
    from the command line.


    It''s also important to know before you start that you should not log in as root
    when performing tasks, because anyone who hacks your system (yes, hackers sometimes
    get hacked) when you''re logged in root would immediately gain root privileges
    and thus “own” your system. Log in as a regular user when starting regular applications,
    browsing the web, running tools like Wireshark, and so on.


    # # Basic Commands in Linux


    To begin, let''s look at some basic commands that will help you get up and running
    in Linux.'
