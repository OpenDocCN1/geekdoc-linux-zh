    # # Numbering the Lines


    Sometimes—especially with very long files—we may want the file to display line
    numbers. Since snort.conf has more than 600 lines, line numbers would be useful
    here. This makes it easier to reference changes and come back to the same place
    within the file.


    To display a file with line numbers, we use the nl (number lines) command. Simply
    enter the command shown in Listing 2-4.


    ```

    kali >nl /etc/snort/snort.conf

