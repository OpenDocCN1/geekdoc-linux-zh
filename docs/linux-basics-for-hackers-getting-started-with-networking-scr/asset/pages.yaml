- img_proc: true
  md: 'while at the same time assisting the Computer Emergency Response Team (CERT)
    in Pittsburgh with defending against hackers.


    A few years before Max was caught, he realized that the Aloha Point of Sale (POS)
    system used by many small restaurants had a technical backdoor into it. In this
    case, the backdoor enabled tech support to assist his clients. Aloha tech support
    could access the end user''s system through 5505 to provide assistance when the
    user called for help. Max realized that he found a system connected to the internet
    with the Aloha POS system, he could access the system with sysadmin privileges
