    # # Updating Packages


    Software repositories will be periodically updated with new software or new versions
    of existing software. These updates don''t reach you automatically, so you have
    to request them in order to apply these updates to your own system. Updating isn''t
    the same as upgrading; updating updates the list of packages available for download
    from the repository, upgrading will upgrade the package to the latest version
    in the repository.


    You can update your individual system by entering the apt-command followed by
    the keyword update. This will search through all the packages on your system and
    check whether updates are available. If so, the updates are downloaded (see Listing
    4-5).


    ```

    kali >apt-get update

    Get:1 http://mirrors.berkeley.edu/kali/kali-rolling-InRelease [30.5kb]

    Get:2: http://mirrors.berkeley.edu/kali/kali-rolling/main amd64 Packages [14.9MB]

    Get:3: http://mirrors.berkeley.edu/kali/kali-rolling/non-free amd64 Packages [163kb]

    Get:4: http://mirrors.berkeley.edu/kali/kali-rolling/contrib amd64 Packages [107
    kb]

    Fetched 15.2 MB in 45s (236 kb/s)

    Reading package lists... Done

    ```


    Listing 4-5: Updating all out-of-date packages with apt-get update


    The list of available software in the repository your system will be updated.
    If the update is successful, your terminal will state Reading package lists...
    Done, as you see in Listing 4-5. Note that the name of the repository and time,
    size, and so on—might be different on your system.


    # # Upgrading Packages


    To upgrade the existing packages on your system, use apt-get upgrade. Because
    upgrading your packages may make changes to your software, you must be logged
    in as root or use the sudo command before entering apt-get upgrade. This command
    will upgrade every package on your system that apt knows about, meaning only those
    stored in the repository (see Listing 4-6). Upgrading can be time-consuming, so
    you might not be able to use your system for a while.'
