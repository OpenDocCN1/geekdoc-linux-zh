- img_proc: true
  md: 'Once uncompressed, the file is no longer saved with the .tar.gz extension but
    with the .tar extension instead. Also, notice that it has returned to its original
    size of 40,960 bytes. Try doing a long list to confirm this. It''s worth noting
    that gzip can also be used to extract .zip files.


    # Compressing with bzip2


    Another of the widely used compression utilities in Linux is bzip2, which works
    similarly to gzip but has better compression ratios, meaning that the resulting
    file will be even smaller. Can compress your HackersArise.tar file by entering
    the following:


    ```

    kali >bzip2 HackersArise.*

    ```


    When you do a long listing, you can see that bzip2 has compressed the file to
    just 2,081 bytes! Also note that the file extension is now .tar.bz2. To uncompress
    the compressed file, use bunzip2, like so:


    ```

    kali >bunzip2 HackersArise.*

    kali >

    ```


    When you do, the file returns to its original size, and its file extension returns
    to .tar.


    # Compressing with compress


    Finally, you can use the command compress to compress the file. This is probably
    the least commonly used compression utility, but it''s easy to remember. To use
    it, simply enter the command compress followed by the filename, like so:


    ```

    kali >compress HackersArise.*

    kali >ls -l

    --snip--

    -rw-r--r-- 1 root root 5476 Nov 27 2018 13:32 HackersArise.tar.Z

    ```


    Note that the compress utility reduced the size of the file to 5,476 bytes, more
    than twice the size of bzip2. Also note that the file extension is now .tar.Z
    (with an uppercase Z).

    to decompress the same file, use uncompress:


    ```

    kali >uncompress HackersArise.*

    ```


    You can also use the gunzip command with files that have been compressed with
    compress.'
