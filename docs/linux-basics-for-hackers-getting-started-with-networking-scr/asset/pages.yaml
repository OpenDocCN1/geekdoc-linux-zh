- img_proc: true
  md: '# # A Crash Course in Bash


    A shell is an interface between the user and the operating system that enables
    you to manipulate files and commands, utilities, programs, and much more. The
    advantage of a shell is that you perform these tasks immediately from the computer
    and not through an abstraction, like a GUI, which allows you to customize your
    task to your needs. A number of different shells are available for Linux, including
    the Korn shell, the Z shell, the C shell, and the Bourne-again shell, more widely
    known as bash.


    Because the bash shell is available on nearly all Linux and UNIX distributions
    (including macOS and Kali), we''ll be using the bash shell, exclusively.


    The bash can run any system commands, utilities, or applications your usual command
    line can run, but it also includes some of its built-in commands. Table 8-1 in
    the chapter gives you a reference to some useful commands that reside within the
    bash shell.


    In earlier chapters, you used the cd, pwd, set, and umask commands. In this section,
    you will be using two commands: the echo command, first used in Chapter 7, which
    displays messages to the screen, and the read command, which reads in data and
    stores somewhere else. Learning these two commands will enable you to build a
    simple but powerful tool.


    You''ll need a text editor to create scripts. You can use whichever Linux text
    editor you like best, including vi, vim, emacs, edit, and so on. I''ll be using
    Leafpad in these tutorials, as I have in previous chapters. Using a different
    editor should not make any difference in your script or its functionality.


    # # Your First Script: "Hello, Hackers-Arise!"


    For your first script, we will start with a simple program that returns a message
    to the screen that says "Hello, Hackers-Arise!" Open your text editor, and let''s
    go.


    To start, you will need to tell your system interpreter you want to use for the
    script. To do this, enter a shebang, which is a combination of a hash mark and
    an exclamation mark, like so:


    ```

    #

    ```


    You follow the shebang (#!) with /bin/bash to indicate that you are the operating
    system to use the bash shell interpreter. As you''ll see in later chapters, you
    could also use the shebang to use other interpreters, such as Perl or Python.
    Here, you want to use the bash interpreter, so enter the following:


    ```

    # /bin/bash

    ```'
  merge: -1
