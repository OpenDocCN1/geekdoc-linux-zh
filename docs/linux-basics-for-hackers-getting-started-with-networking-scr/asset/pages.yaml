    - alert

    - emerg

    - panic


    The codes writing, warn, error, err, emerg, and panic have all been deprecated
    and should not be used.


    The action is usually a filename and location where the logs should be sent. Note
    that generally, log files are sent to the /var/log/ directory with a filename
    that describes the facility that generated them, such as auth. This means for,
    example, that logs generated by the auth facility would be sent to /var/log.auth.log.


    Let''s look at some examples of log rules:


    ```

    mail.* /var/log/mail

    ```


    This example will log all events of (*) priorities to /var/log/mail.


    ```

    kern.crit /var/log/kernel

    ```


    This example will log kernel events of critical (crit) priority or higher to /var/log/kernel.


    ```

    *.emerg *

    ```


    This last example will log all events of the emergency (emerg) priority to all
    logged-on users. With these rules, the hacker can determine where the log files
    are located, change the priorities, or even disable specific logging rules.


    # Automatically Cleaning Up Logs with logrotate


    Log files take up space, so if you don''t delete them periodically, they will
    eventually fill your entire hard drive. On the other hand, if you delete log files
    too frequently, you won''t have to investigate at some future point in time. You
    can use logrotate to determine the balance between these opposing requirements
    by rotating your logs.


    Log rotation is the process of regularly archiving log files by moving them to
    some other location, leaving you with a fresh log file. That archived will then
    get cleaned up after a specified period of time.


    Your system is already rotating log files using a cron job that employs the logrotate
    utility. You can configure the logrotate utility to choose the regularity of your
    log rotation with the /etc/logrotate.conf text file. Let''s open it with a text
    editor and take a look:


    ```

    kali >leafpad /etc/logrotate.conf

    ```'
