    # OpenSSH and the Raspberry Pi


    SSH is an acronym for Secure Shell and is basically what enables us to connect
    securely to a terminal on a remote system—a replacement for the insecure telnet
    that was common years ago. When we are building a web server, SSH enables us to
    create an access list (a list of users who can use this service), authenticate
    users with encrypted passwords, and encrypt all communication. This reduces the
    chance of unwanted users using the remote terminal (due to the added authentication
    process) or intercepting our communication (due to encryption). Probably the most
    widely used Linux SSH service is OpenSSH, which is installed on nearly every Linux
    distribution, including Kali.


    System administrators use SSH to manage remote systems, and hackers often use
    SSH to connect to compromised remote systems, so we''ll do the same here. In this
    example, we use SSH to set up a Raspberry Pi system for spying, something I call
    the "Raspberry Pi." For this, you''ll need a Raspberry Pi and the attendant Raspberry
    Pi camera module.'
