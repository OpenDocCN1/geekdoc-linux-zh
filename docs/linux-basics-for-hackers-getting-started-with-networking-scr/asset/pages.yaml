    # output alert_unified2: filename merged.log, limit 128, nostamp

    # output log_unified2: filename merged.log, limit 128, nostamp

    # output alert_syslog: LOG_ALERT LOG_ALERT

    # output log_tcpdump: tcpdump.log

    ```


    Listing 2-5: Displaying lines of instances with the keyword or phrase by grep


    This command will first view snort.conf and use a pipe () to grep it, which will
    take the file as input, look for lines with occurrences of the word output, and
    display only those lines. Grep is a very powerful and essential command for working
    in Linux, because it can save you hours of searching for every occurrence of a
