    # Using rc Scripts to Run Jobs at Startup


    Whenever you start your Linux system, a number of scripts are set to up

    t environment for you. These are known as the rc scripts. After the kernel

    has initialized and loaded all its modules, the kernel starts a daemon known'
  merge: -1
