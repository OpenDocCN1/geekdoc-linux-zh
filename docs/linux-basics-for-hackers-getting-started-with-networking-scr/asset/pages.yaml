  md: "# # 3\n\n ANALYZING AND MANAGING NETWORKS\n\n![](img/1d1085ba208631ba5cace7619c3050fa_66_0.png)\n\
    \nUnderstanding networking is crucial for any aspiring hacker. In many situations,\
    \ you'll be hacking something over a network, and a good hacker needs to know\
    \ how to connect and interact with that network. For example, you may need to\
    \ connect to a computer with your Internet Protocol (IP) address hidden from view,\
    \ or you may need to redirect a target's Domain Name System (DNS) queries to your\
    \ system; these kinds of tasks are relatively simple but require a little Linux\
    \ network know-how. This chapter shows you some essential Linux tools for analyzing\
    \ and managing networks during your network-hacking adventures.\n\n# ## Analyzing\
    \ Networks with ifconfig\n\nThe ifconfig command is one of the most basic tools\
    \ for examining and interacting with active network interfaces. You can query\
    \ your active network connections by simply entering ifconfig in the terminal.\
    \ Try it yourself, and you should see output similar to Listing 3-1."
  merge: -1
  pgno: 66
- img_proc: true
  md: '```

    kali #ifconfig

    eth0 Linkenc:EthernetHwaddr 00:0c:29:ba2:0f

    inet addr:192.168.181.131 Bcast:192.168.181.255 Mask:255.255.255.0

    --inet-

    lo Linkenc:local Loopback

    inet addr:127.0.0.1 Mask:255.255.0.0

    --inet-

    wlan0 Link enc:EthernetHwaddr 00:c0:3f:ee:02

    ```


    Listing 3-1: Using ifconfig to get network information


    As you see, the command ifconfig shows some useful information about the active
    networks on the system. At the top of the output is the first detected interface,
    etho, which is short for Ethernet0 (Linux starts counting at 0 rather than 1).
    This is the first network connection. If there were more Ethernet interfaces,
    they would show up in the output using the same format (eth1, eth2, and so on).


    The type of network being used (Ethernet) is listed next, Hwaddr and an address;
    this is the globally address stamped on every piece of hardware—in this case,
    the network interface card (NIC), usually referred to as the media access control
    (MAC) address.


    The second line contains information on the IP address assigned to the network
    interface (192.168.181.131); the Bcast or broadcast address, is the address used
    to send out information to all IPs on the subnet; finally the network mask (Mask),
    which is used to determine what part of the IP address is connected to the local
    network. You will also find more technical info in this section of the output,
    but it''s beyond the scope of this Linux networking basics.


    The next section of the output shows another network connection called lo, which
    is short for loopback address and is sometimes called localhost. This is a special
    software address that connects to your own system. Software and services not running
    on your system, you can use your web server. You would use lo to test something
    on your system, such as your own web server. The localhost is generally represented
    by the IP address 127.0.0.1.


    The third connection is the interface wlan0. This appears only if you have a wireless
    interface or adapter, as I do here. Note that it also displays the MAC address
    of device (HWaddr).


    This information from ifconfig enables you to connect and manipulate your local
    area network (LAN) settings, an essential skill for hacking.


    # Checking Wireless Network Devices with ifconfig


    If you have a wireless adapter, you can use the ifconfig command to get crucial
    information for wireless hacking such as the adapter''s IP address, its MAC address,
    what mode it''s in, and the information you glean from this command is particularly
    important when you''re using wireless tools like aircrack-ng.


    Using the terminal, let''s take a look at some wireless devices with ifconfig
    (see Listing 3-2).'
  merge: -1
  pgno: 67
- img_proc: true
  md: '```

    kali >iwconfig

    wlan0 IEEE 802.11bg ESSID:off/any

    Mode:Managed Access Point: Not Associated Tx-Power=20 dBm

    --snip---

    lo no wireless extensions

    eth0 no wireless extensions

    ```


    Listing 3-2: Using ifconfig to get information on wireless adapters


    The output tells us that the only network interface with wireless extensions are
    wlan0, which is what we would expect. Neither nor eth0 has any wireless extensions.


    For wlan0, we learn 802.11 IEEE standards our device is capable of: b and g, two
    early wireless communication standards. Most wireless devices do not include n
    as well (n is the latest standard).


    We also learn from ifconfig the mode of the wireless extension (in this case,
    Mode:Managed, in contrast to or promiscuous mode). We''ll need promiscuous mode
    for cracking wireless passwords.


    Next, we can see that the wireless adapter is not connected (Not Associated) to
    an access point (AP) and that its power is 20 dBm, which represents the strength
    of signal. We''ll spend more time with this information in Chapter 14.


    # Changing Your Network Information


    Being able to change your IP address and other network information is a useful
    skill because it will help you access other networks while appearing as a trusted
    device on those networks. For example, in a denial-of-service (DoS) attack, you
    can spoof your IP so that the attack appears to come from another source, thus
    helping you evade IP capture during forensic analysis. This is a relatively simple
    task in Linux, and it''s done with the ifconfig command.


    # Changing Your IP Address


    To change your IP address, enter ifconfig followed by the interface you want to
    reassign and the new IP address assigned to that interface. For example, to assign
    the IP address 192.168.181.115 to interface eth0, you would enter the following:


    ```

    kali >ifconfig eth0 192.168.181.115

    kali >

    ```


    When you do this correctly, Linux will simply return the command prompt and say
    nothing. This is a good thing!


    Then, when you again check your network connections with ifconfig, you should
    see that your IP address has changed to the new IP address you just assigned.'
