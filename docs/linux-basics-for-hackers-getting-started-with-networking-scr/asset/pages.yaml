    parm: disable_ertm: Disable enhanced transmission mode (bool)

    ```


    As you can see, the modinfo command reveals significant information about this
    kernel module which is necessary to use: Bluetooth on your system. Note that many
    other things, it lists the module dependencies: rfill16 and crc216. Dependencies
    are modules that must be installed for the bluetooth module to function properly.


    Typically, this is useful when troubleshooting why particular particular device
    is not working. Besides things like the dependencies, you can get information
    about the version of the kernel module that was developed for and make sure they
    match the version you are running.


    # ### Adding and Removing Modules with modprobe


    Most recent distributions of Linux, including Kali Linux, include the modprobe
    command for LKM management. To add a module to your kernel, you would use the
    modprobe command with the -a (add) switch, like so:


    ```

    kali >modprobe -a <module name>

    ```


    To remove a module, use the -r (remove) switch with modprobe followed by the name
    of the module:


    ```

    kali >modprobe -r <module to be removed>

    ```'
