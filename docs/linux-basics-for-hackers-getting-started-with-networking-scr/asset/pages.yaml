  md: '# Changing Your Shell Prompt


    Your shell prompt, another environment variable, provides you with useful information
    such as the user you''re operating as and the directory in you''re currently working.
    The default shell prompt in Kali takes the following-format:


    ```

    username@hostname:current_directory

    ```


    If you''re working as the root user, this translates to the following default
    prompt:


    ```

    root@kali:current_directory

    ```


    You can change the name in the default shell prompt by setting the value for the
    PS1 variable. The PS1 variable has a set of placeholders for information you want
    to display in the prompt, including the following:


    +   - \u The name of the current user

    - \h The hostname

    - \w The base name of the current working directory


    This is very useful if you happen to have shells on multiple systems or are logged
    on as multiple accounts. By setting different \u and \w values for different shells
    or accounts, you can tell at a glance who you are and what your system is.


    Let''s have a little fun and change the prompt in your terminal. For example,
