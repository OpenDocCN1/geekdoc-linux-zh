  md: '# 7


    # MANAGING USER

    ENVIRONMENT VARIABLES


    ![](img/1d1085ba208631ba5cace7619c3050fa_108_0.png)


    To get the most from your Linux hacking system, you need to understand environment
    variables and be adept at managing them for optimal performance, convenience,
    and even stealth. Among the areas that Linux newcomers find problematic, however,
    managing the user environment variables might be the most difficult to master.
    Technically, there are two types of variables: shell and environment. Environment
    variables are system-wide variables built into your system and interface that
    control how your system looks, acts, and “feels” to the user, and they are inherited
    by any child shells or processes. Shell variables, on the other hand, are typically
    listed in lowercase and are only valid in the shell they are set in. To avoid
    over-explanation, I just cover some of the most basic and useful skills for environment
    and shell variables in this chapter and don''t go too deeply into the differences
    between them.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Variables are simply strings in key-value pairs. Generally, each pair will
    look like KEY=value. In cases where there are multiple values, they will look
    like KEY=value1:value2. As with most things in Linux, if there are spaces in the
    value, it needs to be in quotation marks. In Kali Linux, your environment is your
    shell. Each user, including root, has a default set of environment variables that
    determine how the system looks, acts, and feels. You can change the values for
    these variables to make your system work more efficiently, tailor your work environment
    to best meet your individual needs, potentially cover your tracks if you need
    to.


    # # Viewing and Modifying Environment Variables


    You can view all your default environment variables by entering env your terminal
    from any directory, like:


    ```

    kali ~env

    XDG_VTNR=922

    SHAGENT_PID=2

    XDG_GREATER_DATA_DIR=/var/lib/lightdm/data/root

    GLADE_PIXMAP_PATH=:echo

    TERM=xterm

    SHELL=/bin/bash

    --snip---

    USER=root

    --snip---

    PATH=/usr/local/sbin :usr/bin:/usr/sbin:/bin/bin

    --snip---

    HOME=/root

    --snip--

    ```


    Environment variables are always uppercase, as in HOME, SHELL, and so on. These
    are only the default environment variables that come on your system. A user can
    also create their own variables, and as you will see, we need a different command
    to include those in the output.


    # ## Viewing All Environment Variables


    To view all environment variables, including shell variables, local variables,
    and shell functions such as any user-defined variables and command aliases, use
    the set command. This command will list all environment variables unique to your
    system, which in most cases will give you an output so long you won''t be able
    to view all on a single screen. You can request to view each variable, line by
    line, in a more accessible fashion using set and piping it to the more command,
    as follows:


    ```

    kali >set | more

    BASH=/bin/bash

    ASHOPTS=checkwinsize:cmdlist:complete_fullquote:expand_aliases:extglob......

    ```'
