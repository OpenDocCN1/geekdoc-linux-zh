    # Changing the Priority of a Running Process with renice


    The renice command takes absolute values between -20 and 19 and sets

    the priority to that particular level, rather than increasing or decreasing

    from the level which it started. In addition, renice requires the PID of the

    process you are targeting rather than the name. So, if slowprocess is using

    inordinate amount of resources on your system and you want to give it

