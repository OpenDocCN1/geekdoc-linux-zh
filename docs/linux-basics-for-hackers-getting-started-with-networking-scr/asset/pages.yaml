    developer might set the SUID bit on a program to allow that program access to
    files with root privileges. For instance, scripts that need to change passwords
    after the SUID bit set. You, the hacker, can use permission to gain temporary
    root privileges and do something malicious, such as access to the passwords at
    /etc/shadow.


