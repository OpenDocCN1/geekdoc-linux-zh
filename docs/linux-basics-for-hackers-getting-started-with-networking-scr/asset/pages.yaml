    You have Kali downloaded, but before you install anything, I want to talk about
    virtual machines. Generally, for the beginner, installing Kali into a virtual
    machine is the best solution for learning and practicing.


    # Virtual Machines


    Virtual machine (VM) technology allows you to run multiple operating systems from
    one piece of hardware like your laptop or desktop. This means that you can continue
    to run the Windows or macOS operating system you are familiar with and run a virtual
    machine of Kali Linux inside that system. You don''t need to overwrite your existing
    OS to learn.


    Numerous virtual machine applications are available from VMware, Oracle, and other
    vendors. All are excellent, but here I will be showing you how to download and
    install Oracle''s free VirtualBox.


    # InstallingVirtualBox


