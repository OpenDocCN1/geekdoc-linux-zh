  md: '# Dynamic Chaining


    With multiple IPs in our proxychain.conf file, we can set up dynamic chaining,
    which runs our traffic through every proxy on our list, and if one of the proxies
    is down or not responding, automatically goes to the next proxy in the list without
    throwing an error. If we didn''t set this up, a single failing proxy would go
    back our request.


    Go back into your proxychains configuration file, find the dynamic_chain line
    (line 10), and uncomment it, as shown next. Also make sure you comment out the
    strict_chain line if it isn''t already.


    ```

    # dynamic_chain

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    --snip--

    ```


    This will enable dynamic chaining of our proxies, allowing for greater anonymity
    and trouble-free hacking. Save the config file and free to try it out.


    # Random Chaining


    Our final proxy trick is the random chaining option, where proxychains will randomly
    choose a set of IP addresses from our list and use them to create our proxy chain.
    This means that time we use proxies, the proxy will look different to the target,
    making it harder to track our traffic from its source. This option is also considered
    “dynamic” if one of the proxies is down, it will skip to the next one.


    Go back inside the etc/proxychains.conf and comment out the lines dynamic_chain
    and strict_chain by adding a # at the start of each line; then uncomment the random_chain
    line. We can use only one of these options at a time, so make certain you comment
    out the other options before using proxychains.


    Next, and uncomment the line with chain_len and give it a reasonable number. This
    line determines how many of the IP addresses in your chain will be used in your
    random proxy chain.


    ```

    # dynamic_chain

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    ```


    ```

    # strict_chain

    # Strict - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    ```'
