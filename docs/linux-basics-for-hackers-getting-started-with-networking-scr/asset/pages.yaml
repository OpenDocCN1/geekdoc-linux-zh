  md: 'The filesystems are mounted on a system are kept in a file /etc/fstab (short
    for filesystem table), which is read by the system at every bootup.


    # Unmounting umount


    If you''re coming from a Mac or Windows background, you''ve probably unmounted
    a drive without knowing it. Before you remove a flash drive from your system,
    "eject" it to keep from causing damage to the files stored on the device. Eject
    is just another word for unmount.


    Similar to the mount command, you can unmount a second hard drive by entering
    the umount command followed by the file entry of the device in the /dev directory,
    such as /dev/sdb. Note that the command is not spelt unmount but rather umount
    (no n).


    ```

    kali umount /dev/sdb

    ```


    You cannot unmount a device that is busy, so if the system is reading or writing
    to the device, you will just receive an error.


    # Monitoring Filesystems


