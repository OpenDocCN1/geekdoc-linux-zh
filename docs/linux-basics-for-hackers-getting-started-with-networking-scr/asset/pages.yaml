    10800 3600 604 800

    --snip--

    ```


    Listing 3-4: Using dig and its mx option to get information on a domain mail server


    > The most common Linux DNS server is the Berkeley Internet Name Domain (BIND).
    In some cases, Linux users will refer to DNS as BIND, but don''t be confused:
    DNS and BIND map individual domain names to IP addresses.


