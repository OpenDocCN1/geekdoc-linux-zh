  md: '# Changing Process Priority with nice


    You don''t often hear the word *nice* used in the context of hackers, here you
    will. The nice command is used to influence the priority of a process to the kernel.
    As you saw when we run the ps command, numerous processes run on the system at
    once, and all of them are contending for the available resources. The kernel will
    have final say over the priority of a process, but you can use nice to *suggest*
    that a process should be elevated in priority.


    The idea behind the use of the term *nice* is that, when you use it, you''re determining
    how "nice" you''ll be to others: if your process is using most of the system resources,
    you aren''t being very nice.


    The values for nice range from -20 to +19, with zero being the default value (see
    6-1). A high nice value translates to a low priority, and a low nice value translates
    to a high priority (when you''re not being nice to other users and processes).
    When a process is started, it inherits the nice value of its parent process. The
    owner of the process can increase its priority. Of course, the superuser or root
    user can arbitrarily set the nice value to whatever they please.


    ![](img/1d1085ba208631ba5cace7619c3050fa_102_0.png)


    **Figure 6-1:** Niceness priority values


    When you start a process, you can set the priority level with the nice command
    and then alter the priority after the process has started running with the renice
    command. The syntax for these two commands is slightly different and can be confusing.
    The nice command requires that you *increment* the nice value, whereas the renice
    command wants an *absolute value for nice*. Let''s look at an example to demonstrate
    this.


    # Setting the Priority When Starting a Process


    For demonstration purposes, let''s assume we have a process named slowprocess
    that''s located at /bin/slowprocess. If we wanted to speed up its completion,
    we could start the process with the nice command:


    ```

    kali >n -10 /bin/slowprocess

    ```


    This command would increment the nice value by -10, increasing its priority and
    allocating it more resources.

    On the other hand, if we want to be nice to our fellow users and processes and
    give slowprocess a lower priority, we could increment its nice value positively
    by 10:


    ```

    kali >nice -n 10 /bin/slowprocess

    ```'
