    kali >dig hackers-arise.com ns

    --snip--

    ;; QUESTION SECTION:

    hackers-arise.com.      IN NS

    ```


    ```

    ;; ANSWER SECTION:

    hackers-arise.com.      5 IN NS ns7.wixdns.net.

    hackers-arise.com.      5 IN NS ns6.wixdns.net.


    ;; ADDITIONAL SECTION:

    sn6.wixdns.net.      5 IN A 216.239.32.100

    --snip--

    ```


    Listing 3-3: Using dig and its ns option to get information on a domain nameserver


    Also note in the ADDITIONAL SECTION that this query reveals the IP address (216.239.32.100)
    of the DNS server hackers-arise.com.

    You can use the dig command to get information on email servers connected to a
    domain by adding the mx option (mx is short for mail exchange server). This information
    is critical for attacks on email systems. For example, on the www.hackers-arise.com
    email servers is shown in the AUTHORITY SECTION of Listing 3-4.


    ```

    kali >dig hackers-arise.com mx

    --snip--

