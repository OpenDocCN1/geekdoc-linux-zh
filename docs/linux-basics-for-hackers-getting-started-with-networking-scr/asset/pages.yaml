    Again, you''ll see the tasks being done in real time and you will be asked whether
    you want to continue. You can enter y to uninstall, but you might want to keep
    Snort since we will be using it again. The remove command doesn''t remove the
    configuration files, which means you can reinstall the same package in the future
    without reconfiguring.

    If you want to remove the configuration files at the same time as the package,
    you can use the purge option, as shown in Listing 4-4.


