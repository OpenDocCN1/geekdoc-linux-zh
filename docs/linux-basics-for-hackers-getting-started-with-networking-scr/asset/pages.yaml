  md: '# 9


    # COMPRESSING AND ARCHIVING


    ![](img/1d1085ba208631ba5cace7619c3050fa_130_0.png)


    Hackers often need to download and install new software, as well as send and download
    multiple scripts and large files. These tasks are easier if these files are compressed
    and combined into a single file. If you come from the Windows world, you will
    probably recognize this concept from the .zip format, which combines and compresses
    files to make them smaller for transferring over the internet or removable media.
    There are many ways to do this in Linux, and we look at a few of the most common
    tools for doing so in this chapter. We also look at the dd command, which allows
    you to copy entire drives, including deleted files on those drives.


    # What Is Compression?


    The interesting subject of compression could fill an entire book by itself, but
    for this book we only need a rudimentary understanding of the process. Compression,
    as the name implies, makes data smaller, thereby requiring less'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'storage capacity and making the data easier to transmit. For your purposes
    as a beginning hacker, it will suffice to categorize compression as either lossless
    or lossy.


    Lossy compression is very effective in reducing the size of files, but the integrity
    of the information is lost. In other words, the file after compression is not
    exactly the same as the original. This type of compression works for graphics,
    video, and audio files, where a small difference in the file is hardly noticeable—mp3,
    .mp4, .png and jpg are all lossy compression algorithms. If a pixel in a .png
    or a note in an .mp3 file is changed, your eye or ear is unlikely to notice the
    difference—though, of course, music aficionados will say they can definitely tell
    the difference between an .mp3 and an uncompressed .flac file. The strengths of
    loss compression are its efficiency and effectiveness. The compression ratio is
    high, meaning the resulting file is significantly smaller than the original.


    However, lossy compression is unacceptable when you are sending files or software
    and integrity is crucial. For example, if you are sending a script or document,
    the integrity of the original file must be retained when it is decompressed. This
    chapter focuses on this lossless type of compression, which is available from
    a number of utilities and algorithms. Unfortunately, lossless compression is not
    as efficient as lossy compression, as you might imagine, but for the hacker, integrity
    is often far more important than compression ratio.


    # Tarring Files Together


    Usually, the first thing you do when compressing files is to combine them into
    an archive. In most cases, when archiving files, you will use the tar command.
    Tar stands for tape archive, a reference to the prehistoric days of computing
    when systems used tape to store data. The tar command creates a single file from
    many files, which is then referred to as an archive, tar file, or tarball.


    For instance, you have three script files for Chapter 8, named hackersarise1,
    hackersarise2, and hackersarise3. If you navigate to the directory that holds
    them and perform a long listing, you can clearly see the files and the details
    you''d expect, including the size of the files, as shown here:


    ```

