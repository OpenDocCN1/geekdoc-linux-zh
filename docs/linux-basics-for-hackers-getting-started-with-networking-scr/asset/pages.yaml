- img_proc: true
  md: '# Starting with Apache


    If you have Kali running on your system, Apache is already installed. Many other
    Linux distros have it installed by default as well. If you don''t have Apache
    installed, you can download and install it from the repositories by entering the
    following:


    ```

    kali apt-get install apache2

    ```


    The Apache Web Server is often associated with the MySQL database (which we will
    look at in the next section) and these two serves are often paired with a scripting
    language such as Perl or PHP to develop web applications. This combination of
    Linux, Apache, MySQL, and PHP or Perl forms a powerful and robust platform for
    the development and deployment of web-based applications, known collectively as
    LAMP. These are the most widely used tools for developing websites in the Linux
    world—and they''re very popular in the Microsoft world too, where they''re generally
    referred to as WAMP, with the Wanding for Windows.


    The first step, of course, is to start apache daemon. In Kali, to go Applications
    > Services > HTTPD click Apache start. You can accomplish the same from the command
    line by entering following:


