  md: '# Extracting Information from MySQL


    MySQL is the most widely used database-driven web applications. In our modern
    era of Web 2.0 technologies, where nearly every website is database driven, this
    means MySQL holds the data for most of the web.


    Databases are the "golden fleece" for hackers. They contain information about
    users as well as confidential information such as credit numbers. For this reason,
    hackers are often targeting databases.


    Like Linux, MySQL is open source and general public licensed (GPL), and you''ll
    find it preinstalled on nearly every Linux distribution.


    Being free, open source, and powerful, MySQL has become the data-base for many
    web applications, including popular websites such as WordPress, Facebook, LinkedIn,
    Twitter, Kayak, Walmart, Wikipedia, and YouTube.


    Other popular content management systems (CMS) such as Joomla, Drupal, and Ruby
    on Rails all use MySQL, too. You get the idea. If you want to develop or attack
    the backends of your applications, you should know MySQL. Let''s get started.


    # Starting MySQL


    Fortunately, Kali has MySQL already installed (if you''re using another distribution,
    you can download and install MySQL from the software repository or from https://www.mysql.com/downloads/).


    To start your MySQL service, enter the following into the terminal:


    ```

    kali >service mysql start

    ```


    Next, you need to authenticate yourself by logging in. Enter the following and,
    when prompted for a password, just press ENTER:


    ```

    kali >mysql -u root -p

    Enter password:

    Welcome to MySQL monitor. Commands with ; or \

    Your MySQL connection id is 4

    Server version: 5.6.30-1 (Debian)

    Copyright (c) 2000, 2016, Oracle and/or its affiliates. All rights reserved

    ```


    Oracle is a registered trademark of Oracle Corporation and/or its affiliates.
    Other names may be trademarks of their respective owners


    Type ''help''; or ''h'' for help. Type "\c" to clear the current input statement
    mysql >


    In the default configuration of MySQL, the root user''s password is empty. Obviously,
    this is a security vulnerability, and you should remedy this'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'by adding a password after your first login. Note that usernames and passwords
    for your operating system and MySQL are separate and distinct. Let''s change the
    password for the MySQL root user in order to be safe.


    # PAST AND FUTURE OF MYSQL


    MySQL was first developed by MySQL AB of Sweden in 1995 and then was purchased
    by Sun Microsystems in 2008, which in turn was purchased by Oracle in 2009—MySQL
    is now owned by Oracle. Oracle is the world''s largest database software publisher,
    so the open source community has significant trepidations about Oracle''s commitment
    to keeping MySQL open source. As a result, there is now a fork of the MySQL database
    software called “Maria” that is committed to keeping this software and its subsequent
    versions open source. As a Linux admin or hacker, you should keep an eye on Maria.


    # Interacting with MySQL


    SQL is an interpreted programming language for interfacing with a database. The
    database is often a relational database, data is stored in multiple tables that
    interact and each table has values in one or more columns and rows.


    There are several implementations of SQL, each with its own commands and syntax,
    but here are a few common commands:


    +   - select Used to retrieve data

    - union Used to combine the results of two or more select operations

    - insert Used to add new data

    - update Used to modify existing data

    - delete Used to delete data


    You can conditions to each command in order to be specific about what you want
    to do. For example, the line


    ```

    select user, password from customers where user=''admin'';

    ```


    will return the values for the user and password fields for any user user value
    is equal to "admin" in the customers table.


    # Setting a MySQL Password


    Let''s see what users are already in our MySQL system by entering the following.
    (Note that commands in MySQL are terminated with a semicolon.)'
