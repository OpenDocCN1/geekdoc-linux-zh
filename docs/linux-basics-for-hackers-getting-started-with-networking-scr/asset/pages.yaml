    # The rsyslog Logging Rules


    The rsyslog rules determine what kind of information is logged, what programs
    have their messages logged, and where log is stored. As a hacker, this allows
    you to find out what is being logged and where those logs are written so you can
    delete or obscure them. Scroll to line 50 and you should see something like Listing
