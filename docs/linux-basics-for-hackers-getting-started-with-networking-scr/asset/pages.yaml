  md: 'It''s important to note that proxychains defaults to Tor if you don''t enter
    any proxies of your own. The last line in 13-2 directs proxychains to send traffic
    through the host at 127.0.0.1 on port 9050 (the default Tor configuration). If
    you''re not using your own proxies and want to use Tor, leave it as it is. If
    you''re not using Tor, you''ll need to comment out this line (add a # before it).


    As much as I like Tor, as mentioned, it is usually very slow. Also, because the
    NSA has broken Tor, I am much likely to depend on it for anonymity. I therefore
    comment out this line and add my own set of proxies.


    Let''s test out. In this example, I am going to open the browser Firefox and have
    navigate to https://www.hackers-arise.com/ anonymously by sending the traffic
    through a proxy.


    The command is as follows:


    ```

    kali >proxychains firefox www.hackers-arise.com

    ```


    This successfully opens https://www.hackers-arise.com/ in Firefox through my chosen
    proxy and returns the results to me. To anyone tracing this traffic, it appears
    that it was my proxy navigated to https://www.hackers-arise.com/ rather than my
    IP address.


    # Some More Interesting Options


    We now have proxychains working, let''s look at some other options we can configure
    through the proxychains.conf file. As we have set it up, we are simply using a
    single proxy. However we can put in multiple proxies and use all of them, we can
    use a limited number from the list, or we can have proxychains change the order
    randomly. Let''s try all these options.


    # Add More Proxies


    First, let''s add some more proxies to our list. Go back to http://www.hiding..name
    and find more proxy IP addresses. Then add a few of these proxies to your proxychains.conf
    file, like so:


    ```

    [ProxyList]

    # add proxy here...

    socks4 114.134.186.12 22020

    socks4 188.187.190.59 8888

    socks4 181.113.121.158 335551

    ```


    Now save this config file and try running the following command:


    ```

    kali >proxychains firefox www.hackers-arise.com

    ```


    You won''t notice any difference, but your packet is now traveling through several
    proxies.'
