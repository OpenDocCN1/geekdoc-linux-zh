  md: '```

    brw-rw---- 1 root root 8, 16 May 16 12:44 sdb

    brw-rw---- 1 root root 8, 17 May 16 12:44 sdb1

    --snip--

    ```


    Let''s take a closer look at these.


    # ## Linux Represents Storage Devices


    Linux uses logical labels for drives that are mounted on the filesystem. These
    logical labels will vary depending depending on where the same hard drive might
    have different labels at different times, depending on and when it''s mounted.


    Originally, Linux represented floppy drives (remember those?) as hard drives as
    hda. You will still occasionally see these representations on legacy Linux systems,
    but today most floppy drives are gone (thank goodness). Even so, old legacy hard
    drives that used an IDE or E-IDE interface are still represented in the form hda.
    Newer Serial ATA (SATA) interface drives and Small Computer System Interface (SCSI)
    hard drives are represented as sda. Drives are sometimes split into units known
    as *partitions*, which are represented in the labeling system with numbers, as
    you''ll see.


    When systems have more than one hard drive, Linux simply names them serially by
    incrementing the last letter in alphabetical order, so the first drive is sda,
    and the second drive is sdb, the third drive is sdc, and so on (see Table 10-1).
    The serial letter sd is often referred to as the *device* number.


    # ### Table 10-1: Device-Naming System


    | Device file | Description |

    |---|---|n| sda | First SATA hard drive |

    | sdb | Second SATA hard drive |

    | sdc | Third SATA hard drive |

    | sdd | Fourth SATA hard drive |


    # ## Drive Partitions


    Some drives can be split into partitions in order to manage and separate information.
    For instance, you may want to separate your hard drive so that your *swap* file,
    *home* directory, and /directory are all on separate partitions—you might want
    to do this for a number of reasons, including to share resources and to relax
    the default permissions. Linux labels each partition with a *minor number* that
    comes after the device designation. This way, the first partition on the first
    SATA drive would be sda1. The second partition would then be sda2, the third sda3,
    and so on, as illustrated in Table 10-2.


    Filesystem and Storage Device Management 103'
