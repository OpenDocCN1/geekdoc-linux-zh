  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    +   The virtual runtime is divided by the nice value (priority) of the process
    to get a fair share of CPU time.


    CFS calculates the weight of each process.


    +   The weight is a measure of how much CPU time a process should get relative
    to other processes.


    +   The weight is calculated using the formula: weight = (1 / sqrt(1 + load_avg))
    * nice_value


    +   The load_avg is the average number of processes in the runqueue over a period
    of time.


    CFS selects the process with the lowest virtual runtime to run next.


    +   This ensures that the process has been waiting the longest to get run next.


    +   The time quantum is calculated dynamically based on the number of runnable
    processes in the system.


    Example: Suppose there are three processes A, B, and C. Their nice values are
    0, 5, and 10. The current runtime load_avg is 2.0. The weights of these processes
    are calculated as follows:


    +   A: (1 / sqrt(1 + 2.0)) * 1 = 0.45

    B: (1 / sqrt(1 + 2.0)) * 6 = 2.69

    C: (1 / sqrt(1 + 2.0)) * 11 = 4.16


    In this example, process C has the highest weight, so it will get the most CPU
    time. However, C has a higher nice value, it will still get less CPU time than
    B, even though its weight is higher.


    Overall, CFS aims to provide fairness to all processes in the system, while taking
    into account their priority and resource needs.


    +   Since kernel 2.6.3, O(1) algorithm is replaced by CFS algorithm

    In O(1) algorithm time slice is assigned by priority

    However there are some problems in this method.

    For example we have two processes with priority 120 and 121 respectively.

    Then time slice 100ms and 95ms are assigned respectively by priority 5

    The difference in time slice between these two processes and their priority difference
    is 5ms.


    | process 1 | process 2 |

    |---|---|

    | slice(100ms) | slice(95ms) |


    In this case slice of the two processes are 10 and 5ms respectively and the difference
    in the time slice is 5ms.


    | process 1 | process 2 |

    |---|---|

    | slice(10ms) | slice(5ms) |


    The difference 5 ms is relatively two times of the other.


    +   In CFS:

    It assigns time slice based on weight to solve this problem.

    It assigns relative time slice based on predefined weight by priority not predefined
    time slice based on priority.


