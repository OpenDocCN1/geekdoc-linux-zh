  md: '# Using Wildcards in Linux Command Interface


    Wildcards are characters used to represent other characters or a range of characters.
    They are used to help specify patterns of filenames when working with the command
    line interface.


    The most commonly used wildcards in Linux CLI are:


    +   - (asterisk) – matches any sequence of characters (including none)

    - ? (question mark) – matches any single character

    - (square brackets) – matches any single character within the brackets or within
    a specified range


    Here are some examples of how wildcards can be used in Linux CLI:


    +   1. List all files in the current directory:


    ```

    $ ls *

    ```


    +   1. List all files starting with "doc":


    ```

    $ ls doc*

    ```


    +   1. List all files with a three-letter extension:


    ```

    $ ls ???

    ```


    +   1. List all files with "file" in the name, followed by any one character,
    then "txt":


    ```

    $ file?txt

    ```


    +   1. List all files with either "file1.txt" or "file2.txt" as their names:


    ```

    $ file[12].txt

    ```


    +   1. List all files with a single-letter name:


    ```

    $ ls ?.*

    ```


    +   1. List all files with a four-letter name starting with "t" and ending with
    "s":


    ```

    $ ls t??s

    ```


    Wildcards can save you a lot of time and effort when working in files in Linux
    CLI, and you can quickly specify a pattern of filenames instead of typing each
    individual filename.


