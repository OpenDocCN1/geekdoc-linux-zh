  md: '# Root filesystem Mounted by the Kernel


    +   * As the root filesystem is the **first** mounted filesystem, it cannot be
    mounted with the normal mount command

    * It is mounted directly by the kernel, according to the `root=` kernel option

    * When no root filesystem is available, the kernel panics

    * Please append a correct `root=*` boot option

    * Kernel panic - not syncing: VFS: Unable to mount root fs on unknown device "block(0)


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_353_0.png)


    # Kernel initialization


    +   * The bootloader initializes the processor and board, and **uncompresses**
    the kernel code to RAM, and calls the kernel''s start `kernel()` function.

    * Copies the command line from the bootloader

    * Identifies the processor and machine.

    * Initializes the console.

    * Initializes kernel services (memory allocation, scheduling, file cache...)

    * Creates a new kernel thread (future init process) and continues in the idle
    loop

    * Initializes devices and execute initcalls'
