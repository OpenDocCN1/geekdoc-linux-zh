  md: '# CHAPTER 14. ADVANCED TOPICS


    | rosrun | A command-line tool for running ROS nodes. |

    | roslaunch | A command-line tool for launching multiple ROS nodes and setting
    its parameters. |

    | rosbag | A command-line tool for recording and playing back ROS messages. |

    | rosmsg | A command-line tool for displaying information about ROS message types.
    |

    | rosaram | A command-line tool for setting and getting ROS parameters. |

    | rosservice | A command-line tool for interacting with ROS services, including
    querying available services and calling services. |

    | roswtf | A command-line tool for diagnosing problems with the ROS system. It
    can be used to identify issues with nodes, topics, and services, among other things.
    |


    These utilities are essential for working with ROS and can be used for tasks such
    as debugging, monitoring, and managing ROS nodes and topics. The rostop echo utility,
    in particular, is useful for monitoring the messages published on a topic and
    can be helpful for debugging and understanding how ROS nodes are communicating
    with each other.'
