  md: "# CHAPTER 14. ADVANCED TOPICS\n\n+   - the startup / shutdown of Applications.\n\
    - It performs these tasks using information contained within one or more Manifest\
    \ files such as and when Executables should be started.\n- Execution Management\
    \ works with, and configures, the Operating System to perform run-time scheduling\
    \ of application.\n- Execution Management is dependent on the Operating System\
    \ Interface\n- Execution Management is dependent on the Platform Health Management\n\
    \  - The Platform Health Management Interfaces are used by Execution Management\
    \ for notifying a state change of process.\n\nExecution Management (EM) is a crucial\
    \ aspect of AUTOSAR, responsible for managing and coordinating the execution of\
    \ software components within the system. EM ensures the correct execution order,\
    \ timing, and resource allocation for software components, allowing for efficient\
    \ and reliable operation of complex automotive systems.\n\nKey Points:\n\n+  \
    \ 1. Execution Model:\n  - Adaptive AUTOSAR uses an event-driven execution model,\
    \ in which software components react to events or triggers, such as incoming messages,\
    \ timeouts, or external/internal stimuli.\n  - This approach provides more flexibility\
    \ and responsiveness compared to the static, cyclic execution of Classic AUTOSAR,\
    \ where components execute at predefined intervals.\n2. Process Management:\n\
    \  - In Adaptive AUTOSAR, software components (ASCs) are executed as separate\
    \ processes, providing better isolation and fault containment compared to Classic\
    \ AUTOSAR.\n  - Each process has its own memory space, preventing unintended memory\
    \ access or corruption.\n3. Multicore Support:\n  - Adaptive AUTOSAR provides\
    \ full support for multi-core processors, enabling efficient distribution and\
    \ parallel execution of software components.\n  - Execution Management coordinates\
    \ the assignment of software components to specific cores, optimizing system performance\
    \ and resource utilization.\n4. Execution Control:\n  - Execution Management provides\
    \ mechanisms for starting, stopping, and restarting software components based\
    \ on events or conditions.\n  - This allows for dynamic control of component execution,\
    \ enabling features like balancing, power management, and fault tolerance.\n\n\
    Example: A simple Adaptive AUTOSAR application with Execution Management\n\nConsider\
    \ an Adaptive AUTOSAR application that reads data from a sensor, processes the\
    \ data, and sends the data to an actuator. The application consists of three ASCs:\n\
    \n+   1. Sensor Reader ASC (SR_ASC)\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_392_0.png)\n\
    \nPAGE 391 OF 465\nMastering Embedded System from Scratch\nCopyright © 2023 -\
    \ Keroles Khalil, eng.keroles.karam@gmail.com"
