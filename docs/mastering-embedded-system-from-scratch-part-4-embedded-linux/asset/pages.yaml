  md: '# Special Purpose File Systems:


    +   - Designed for specific use cases

    - Examples include Squashes for live CDs and live USB distros, procs for accessing
    process information, sysfs for accessing kernel data, etc.


    Among these, Squashfs is a commonly used file system type for live CDs and live
    USB distros. compressed read-only file system that allows for efficient storage
    of a large amount of data. It is used in many popular Linux distributions, including
    Ubuntu, Debian, and Fedora.


    The initrd (initial ramdisk) and initramfs (initial RAM file system) are RAM file
    systems used during the boot process. They contain essential files and modules
    to mount the root file system and boot the system. The difference between the
    two is that initrd is a legacy format that requires a separate file system image,
    while initramfs is a newer format that is stored in a single file.


    Finally, MTD (memory technology device) is a kernel subsystem used to manage flash
    memory devices such as NOR and NAND chips. The JFFS2 (Journaling Flash File System
    2) is a popular file system for use with MTD devices, providing efficient wear
    leveling and error handling for the memory.


    # Build Root


    +   - Building from source flat of flexibility

    - Cross-compilation leveraging fast build

    - Recipe for building components | Easy

    - Two solutions are emerging at the most popular:

    - Yocta/OpenEmbedded

    - Build a complete Linux distribution, free of charge, compiler, and steep learning
    curve

    - Buildroot

    - Builds a root filesystem image, Much simpler to use, understand and modify


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_369_0.png)


    Buildroot is an open-source, Linux-based tool that provides a simple and efficient
    way to build embedded Linux systems. It automates the process of building a root
    filesystem, kernel image, and bootloader image for a given target platform. With
    Buildroot, developers can quickly create custom Linux systems tailored to their
    specific needs and requirements.


    Buildroot is highly configurable and provides a wide range of customization options.
    It allows developers to select specific software packages to include in the root
    filesystem, customize kernel configuration options, and add or modify device drivers.
    This level of flexibility makes it possible to create highly optimized and efficient
    Linux systems.


    The Buildroot process typically involves the following steps:


