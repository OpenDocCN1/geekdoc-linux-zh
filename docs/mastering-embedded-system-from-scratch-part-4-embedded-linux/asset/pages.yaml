  md: "# CHAPTER 14 ADVANCED TOPICS\n\nYou should now see the talker node publishing\
    \ messages on the chatter topic, and the listener node printing out these messages.\n\
    \nHere's a summary of the steps involved in creating the talker and listener nodes:\n\
    \n+   1. Create a ROS package.\n2. Create the talker node.\n3. Create the listener\
    \ node.\n4. Build and run the nodes.\n\nThe output of the ROS Simple tutorial\
    \ for Talker and Listener nodes will be a series of messages printed by the listener\
    \ node, based on the messages published by the talker node.\n\nThe talker node\
    \ will publish messages on the chatter topic at a rate of 10 Hz, with each message\
    \ containing the text \"Hello ROS!\" and a count of the number of messages published.\
    \ The listener node will subscribe to the chatter topic and print out any messages\
    \ it receives.\n\nWhen you run the talker and listener nodes, you should see output\
    \ similar to the following in the terminal window where the listener node is running:\n\
    \n```\nI heard: [Hello ROS! 0]\nI heard: [Hello ROS! 1]\nI heard: [Hello ROS!\
    \ 2]\nI heard: [Hello ROS! 3]\nI heard: [Hello ROS! 4]\n..\n```\n\nThis indicates\
    \ that the listener node is receiving messages published by the talker node on\
    \ the chatter topic, and printing out the contents of each message.\n\nThe exact\
    \ output will depend on how long you run the talker and listener nodes, as well\
    \ as the rate at which the talker node publishes messages. However, the general\
    \ format of the output should be similar to the example above.\n\n# ROS utilities\n\
    \nHere's a table describing some common ROS utilities, including rostopic echo\
    \ which is similar to rosecho:\n\n| Utility | Description |\n|---|---|n| roscore\
    \ | The core service that provides communication between ROS nodes. |\n| rostopic\
    \ | A command-line tool for displaying information about ROS topics, including\
    \ publishing and subscribing to topics. |\n A command-line tool that prints the\
    \ messages published on a topic. It is similar to the rosecho utility. |"
