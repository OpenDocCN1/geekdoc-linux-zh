  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n+   * The device tree is represented\
    \ as a tree of nodes, where each node corresponds to a device in the system. Nodes\
    \ are connected through parent-child relationships, with the root node representing\
    \ the entire system.\n\n+   * Each node in the device tree has a name, which identifies\
    \ the device it represents. The names are usually chosen to reflect the device's\
    \ function or location in the system.\n\n+   * Nodes in the device tree can have\
    \ properties, which are key-value pairs that describe various characteristics\
    \ of the device. For example, a node representing a network interface might have\
    \ properties like \"phy-handle\" (to specify the physical interface) and \"mac-address\"\
    \ (to specify the device's MAC address).\n\n+   * The device tree is stored in\
    \ a binary format that is typically compiled from a human-readable source file\
    \ (usually with a .ts or .dts extension) using the Device Tree Compiler (DTC)\n\
    \n+   > Is Tree of nodes, containing attributes, for example:\n    > .dt source\
    \ files are in arch/ARCH/boot/dts\n    > . compiled to .dtb, using dtic\n\n+ \
    \  * dtb is loaded into memory by the bootloader\n* The U-boot command takes three\
    \ arguments\n    > boot-kernel [addr] [binary]\n    > If there is no address (which\
    \ defaults to ...)\n    > boot-kernel -addr binary\n\n+   * The dtb is also known\
    \ as a Device Tree, Blob, or Flattened Tree (fdt)\n\n+   * The device tree is\
    \ loaded into memory by the bootloader and passed to the kernel as a pointer to\
    \ a data structure that describes the location and size of the device in memory.\n\
    * The Linux kernel provides a set of APIs (such as find_node_by_name and get_property)\
    \ that can be used to access the device tree from kernel code.\n\nHere is an example\
    \ device tree that describes a system with a single UART device:\n/dts-v1/\n\n\
    ```\ncompatible = \"simple-bus\";n#address-cells = <1>;n#size-cells = <1>;n\n\
    uart0: serial@80000000 {\n    compatible = \"ns16550a\";n    reg = <0x80000000\
    \ 0x1000>;n    interrupts = <42>;n    clock-frequency = <1843200>;\n}\n```\n\n\
    In this device tree, the root node has a compatible property that identifies it\
    \ as a \"simple-bus\" device. The #address-cells and #size-cells properties indicate\
    \ that the device tree uses cell addressing.\n\nPAGE 314 OF 465\nMastering Embedded\
    \ System from Scratch\nCopyright © 2023 - Keroles Khail, eng.keroles.karam@gmail.com\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_315_0.png)"
