  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n+   3. Setting up the BSS by\
    \ zeroing it out, which is a section in the kernel binary that contains uninitialized\
    \ data.\n4. Setting up the stack so that the first C routine can be invoked, which\
    \ is the start_kernel() function in mit/main.c.\n\nThe start_kernel() is a limbo\
    \ function that performs a lot of initialization tasks until it terminates in\
    \ an idle task with a process ID of 0. These tasks include:\n\n+   1. Boot CPU:\
    \ This involves initializing the per-CPU data structures, such as the per-CPU\
    \ timer and scheduler.\n2. Platform and CPU-specific initialization: This involves\
    \ recognizing the processor, recognizing the board, analyzing command-line parameters\
    \ passed to the kernel, identifying the ram disk, calling the bootmem functions,\
    \ and calling the paging initialization function.\n3. Memory manager initialization:\
    \ This involves initializing the memory manager, setting up the page allocator\
    \ and the virtual subsystem.\n4. Scheduler initialization: This involves initializing\
    \ the scheduler, setting up the run queues, initializing the task structures,\
    \ and setting the scheduler policy.\n5. Interrupt controller initialization: This\
    \ involves initializing the interrupt controller, including registering interrupt\
    \ handlers and enabling interrupt handling.\n6. Timer initialization: This involves\
    \ initializing the timer hardware, which is used for scheduling tasks, maintaining\
    \ system time, and generating time-based events.\n7. Console initialization: This\
    \ involves initializing the console, which provides input and output for the system.\n\
    8. Rest of the initialization: This involves calling the rest_init() function,\
    \ which initializes the rest of the system components, such as drivers, file systems,\
    \ and networking.\n\n> The kernel entry point is an assembly language routine;\
    \ the name of this entry point varies (stx_kernel_entry on ARM, etc.)\nLook at\
    \ the linker script to know the entry point for your platform. This function normally\
    \ resides in the arch/kernel/head.S file\nIn the vexpress A9 system will be\n\n\
    +   arch/arm/kernel/head.S\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_335_0.png)\n\
    \n# the first C routine: arch/arm/kernel/head.S\n\n+   * This function does the\
