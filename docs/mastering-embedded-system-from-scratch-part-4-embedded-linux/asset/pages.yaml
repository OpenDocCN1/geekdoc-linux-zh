  md: "# CHAPTER 12. INTRODUCTION TO EMBEDDED LINUX\n\nIn this example, the interrupts\
    \ properties specifies that the device uses interrupt number 42 with type 2 (which\
    \ could correspond to a rising edge, falling edge, level, etc.).\n\n+   - interrupt-parent:\
    \ The interrupt-parent property is used to specify the node that serves as the\
    \ parent interrupt controller for a device.\n\n```\nnode {\n  compatible = \"\
    vendor,device\";n  interrupts = <42 2>;n  interrupt-parent = <&intc>;n  ...\n\
    }\n```\n\n```\nintc {\n  compatible = \"vendor,intc\";n  ...\n}\n```\n\nIn this\
    \ example, the interrupt-parent property specifies that the intc node serves as\
    \ the interrupt controller for the node device.\n\n+   - interrupt-cells: The\
    \ #interrupt-cells property is used to specify the number of cells that are used\
    \ to encode each interrupt specifier in the interrupts property. Each cell typically\
    \ encodes a portion of the interrupt information (e.g., the interrupt number,\
    \ polarity, etc.).\n\n```\nnode {\n  compatible = \"vendor,device\";\n  interrupts\
    \ = <42 2>;\n  #interrupt-cells = <2>;\n  ...\n}\n```\n\nIn this example, the\
    \ #interrupt-cells property specifies that each interrupt specifier in the interrupts\
    \ property contains two cells (which could correspond to the interrupt number\
    \ and type, for example).\n\n+   - interrupt-controller: The interrupt-controller\
    \ property is used to specify that a node serves as an interrupt controller for\
    \ its child nodes.\n\n```\nintc {\n  compatible = \"vendor,intc\";\n  interrupt-controller;\n\
    \  #interrupt-cells = <2>;\n  ...\n}\n```\n\nIn this example, the interrupt-controller\
    \ property specifies that the intc node serves as the interrupt controller for\
    \ its child nodes.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_329_0.png)"
