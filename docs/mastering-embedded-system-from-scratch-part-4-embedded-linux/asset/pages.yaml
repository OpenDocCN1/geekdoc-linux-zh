    # ADDRESS TRANSLATION IN PAGING


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_36_0.png)


    The logical Address generated by CPU is divided into two parts:


    +   Page number (p) - used as an index into the page table which contains base
    address of each page in physical memory

    Page offset (d) - combined with base address to define the physical memory address
    that is sent to the memory unit.


    EX. Given address length 32 bits and page size 4KB

    | Page number | Page offset |

    | 2^20 | 4096/4 KB |


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_36_1.png)


    In a paging system, the logical address generated by the CPU is divided into two
    parts: the page number (p) and the page offset (d). The page table contains the
    base address of each page in physical memory. The page offset is combined with
    the base address to define the physical memory address that is sent to the memory
    unit.


    Let''s illustrate this with an example:


    Suppose we have a logical address space of 16KB (2^14 bytes) and a physical memory
    of 32KB (2^15 bytes). Let''s assume the page/frame size is 1KB (2^10 bytes). This
    would result in the following:


    +   1. The logical address is divided into 16 pages (16KB / 1KB).

    2. The physical memory is divided into 32 frames (32KB / 1KB).

    3. The logical address generated by the CPU is 14 bits wide (2^14 bytes). We need
    to divide these bits into the page number (p) and the page offset (d).


    Since there are 16 pages, we need 4 bits (2^4 = 16) to represent the page number.
    The remaining 10 bits (14 bits - 4 bits) will represent the page offset, as the
    page size is 1KB (2^10 bytes).


    Example: Consider a logical address with the binary representation: 1101101010001


