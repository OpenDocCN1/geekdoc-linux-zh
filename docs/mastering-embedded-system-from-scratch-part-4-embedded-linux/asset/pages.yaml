  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n+   - #size-cells is used to\
    \ state how large the length field is in\nchild reg tuple.\n\n+   - In the following\
    \ example:\n- each address value is 1 cell (32 bits), and each length value is\
    \ 1 cell,\nwhich is typical on 32 bit systems.\n- 64 bit machines may use a value\
    \ of 2 for #address-cells and #size-cells to\nget 64 bit addressing in the device\
    \ tree.\n\n```\n//\n  address-cells = <1>\n  size-cells = <1>;\n\n  serial@0 =\
    \ {\n    compatible = \"arm,pl0111\";\n    reg = <0x08000000>\n  };\n```\n\n+\
    \   - Some devices use a bus with a different addressing scheme\n- For devices\
    \ attached to the external bus with the chip\nselect number encoded into the address.\n\
    \n+   - In this example:\n- each reg entry contains 3 cells:\n- the chipselect\
    \ number, the offset and the length.\n\n```\nexternal-bus {\n  address-cells =\
    \ <1>\n  size-cells = <1>;\n  ethernet@0 {\n    compatible = \"viasm,acml9518\"\
    ;\n    reg = <0x80000000>\n  };\n  uart@0 {\n    compatible = \"arm,primecell-a1314-bus\"\
    ;\n    reg = <0x10000000>\n    interrupts = <0 0>\n    status = \"okay\";\n  };\n\
    };\n\nspi@0 {\n  compatible = \"jedec,spi-controller00\";\n  reg = <0x20000000\
    \ 0 0>\n};\n```\n\nCPU addressing: The ranges property can also be used to specify\
    \ the CPU's address space, which is typically used for mapping system memory to\
    \ the CPU's address space.\n\n```\nchosen {\n  bootargs = \"console=tty0,115200\
    \ root=/dev/mmcblk1k0p2 rw\";\n}\n```\n\n```\nmemory {\n  device_type = \"memory\"\
    ;\n  reg = <0x0 0x40000000>;\n}\n```\n\n```\nsoc {\n  ranges = <0x0 0x0 0x80000000\
    \ 0x40000000>\n  ...;\n}\n```\n\nIn this example, the ranges property in the soc\
    \ node specifies that the CPU's address space (0x7fffffff) is translated to the\
    \ system memory address space (0x0-0xffffffff). The memory node specifies the\
    \ size and location of the system memory.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_327_0.png)"
