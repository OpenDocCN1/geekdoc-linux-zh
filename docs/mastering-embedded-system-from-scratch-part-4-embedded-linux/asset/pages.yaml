    # ADDRESS TRANSLATION


    In the Intel architecture, virtual addresses generated by the CPU are divided
    into three parts: the directory page, the page part, and the offset. The size
    of each part is determined by the page size.


    To translate a virtual address to a physical address, the CPU uses a page table,
    which is a data structure that maps virtual pages to physical pages. The page
    table is stored in memory and is maintained by the operating system.


    The page table is organized in a multi-level hierarchy. The top-level of the page
    table is called the Page Global Directory (PGD), which points to the Page Middle
    Directory (PMD). The PMD points to the Page Table (PT), which contains the page
    numbers corresponding to the virtual pages.


    The process-specific mm_struct in Linux contains the page tables and other information
    about the virtual address space of a process. When a process is created, its mm_struct
    is initialized with set of page tables that map the process''s virtual address
    to physical memory.


    When a process accesses memory, the CPU translates the virtual address to a physical
    address using the page tables in the mm_struct. If the page entry for the virtual
    page is not present in memory, a page fault occurs, and the operating system loads
    the page from disk into physical memory and updates the page table entry. The
    modern processor has hardware to assist to translate virtual address to physical
    address.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_143_1.png)'
