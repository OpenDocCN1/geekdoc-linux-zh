  md: '# Shell script


    +   - The Shell is a user space program that accepts text input

    - It is accessed through a terminal or terminal emulator program

    - "a shell manages the interaction between the system and its users"

    - Types of Shells


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_214_0.png)


    A shell script is a program written in a scripting language that is interpreted
    by a shell program. Shell scripts allow users to automate tasks that would normally
    be executed interactively in the shell. A shell script can be as simple as a series
    of commands, or as complex as a full-fledged application.


    Here are some key features of shell scripts:


    +   1. They are interpreted rather than compiled

    2. They are executed by a shell program

    3. They are a sequence of commands

    4. They can include control structures, such as loops and if/else statements

    5. They can accept input parameters and arguments

    6. They can use environment variables


    Creating a shell script


    +   1. Start with the shebang line that specifies the shell to be used #/bin/bash

    2. Add any necessary environment variable settings or other initialization commands

    3. Add commands and control structures to perform the desired tasks

