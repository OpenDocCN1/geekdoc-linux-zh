    \ not directly accessible by the CPU.\n\n+   - To take the example of i2c devices\n\
    \n```\n@address-cell < 0>;\n#size-cell < 0>;\nreg = <1 0x1000>;\ncompatible =\
    \ \"maxi,ds1338\";\nreg = <80>;\n```\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_326_0.png)\n\
    \nMemory-mapped devices: For devices that are memory-mapped, the reg property\
    \ is used to specify the device's address and size, and the ranges property is\
    \ used to specify the address translation between the device's address space and\
    \ the system memory address space.\n\n```\nnode {\n  compatible = \"vendor,device\"\
    ;\n  reg = <0x1000 0x100>;\n  ranges = <0x010000000 0x8000>;\n  ...;\n}\n```\n\
    \nIn this example, the reg property specifies that the device is located at address\
    \ 0x1000 with a size of 0x100 bytes, and the ranges property specifies that the\
    \ device's address range is translated to the system memory address range (0x8000-0x80ff)."
