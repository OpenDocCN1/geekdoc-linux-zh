  md: '# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX


    virtual memory, only the required memory pages are loaded into memory, not the
    entire process image.


    Virtual memory in Linux allows each process to have its own address space, which
    provides several benefits, including the ability to use shared libraries. Each
    process has its own memory map in the virtual address space, which is unique to
    that process and independent of the kernel memory map.


    System calls are entry points into the kernel that enable the kernel to execute
    services on behalf of the application. System calls provide a means for user-level
    applications to interact with the kernel and access kernel-level services, such
    as device drivers, file systems, and networking protocols.


    The user space in Linux is designed to be flexible and modular, enabling developers
    to create a wide range of applications for different use cases. Linux provides
    a rich set of user-level libraries and tools, including the C library, POSIX libraries,
    and a range of scripting languages like Python and Perl.


    Overall, the user space is a critical component of the operating system that provides
    an environment for user-level applications to run. It is based on several key
    concepts, including virtual memory, process management, and system calls, and
    is designed to be flexible and modular to support a wide range of applications
    and use cases.


    +   - The user space is based on the following concepts.

    - Program: This is the image of an application. It resides on a file system. When
    an application needs to be run, the image is loaded into memory. Not because virtual
    memory pages are not loaded into memory but only the required memory pages are
    loaded.

    - Virtual memory: This allows each process to have its own virtual memory, allowing
    for advanced features such as shared libraries. Each process has its own memory
    map in the virtual address space; this is unique for each process.

    - System calls: These are entry points into the kernel so that the kernel can
    execute services on behalf of the application.


