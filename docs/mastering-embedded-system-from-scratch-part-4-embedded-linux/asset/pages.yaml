    +   • init begins by reading /etc/initab. It contains a list of programs to run,
    one per line, with options.


    +   • <id>: is the controlling terminal for the command


    +   • action: is the program to run in this command. The actions are as:


    +   • sysinit: Runs the program when init starts before any of the other types
    of Actions.


    +   • restart: Runs the program if it terminates with error. It is typically used
    to run a program as a daemon.


    +   • askfirst: This is the same as reboot, but it prints the message "Press Enter
    to activate the console" and runs the program after Enter has been pressed. Is
    used to start an interactive shell on a Terminal without suspended or paused


    +   • once: Runs the program when it does not stop; restart it if it terminates.


    +   • wait: Runs the program and waits for it to complete.


    +   • restart: Runs the program when init receives the signal SIGHUP, indicating
    that it should reload the config.


    +   • ctrlctrl: Runs the program when init receives the signal SIGINT, usually
    as a result of pressing Ctrl-C on the console.


    +   • shutdown: Runs the program when init shuts down.


    BusyBox is a popular tool that combines Unix utilities into a single small executable.
    One of its components is the init program, which is responsible for starting and
    managing system services during boot.


    The BusyBox init program uses the sysvinit configuration files, located in the
    /etc directory to start system services. The init program reads the /etc/init
    file, which specifies the runlevel to be used during boot scripts and the actions
    to be taken when a particular runlevel is reached. The init program then reads
    the scripts in the /etc/rc.d directory, which contain the actual service startup
    and shutdown scripts.


    The BusyBox init program has the following features:


    +   • Support for multiple runlevels

    • Support for service dependencies and ordering

    • Support for process supervision and restarting

    • Support for logging and debugging


    | Command | Description |

    |---|---|

    | init | The main program that starts and manages system services. |

    | telinit | Changes the system runlevel. |

    | runlevel | Displays the current system runlevel. |

    | shutdown | Shuts down the system. |

    | reboot | Restarts the system. |

    | start | Starts a system service. |

    | stop | Stops a system service. |

    | restart | Restarts a system service. |'
