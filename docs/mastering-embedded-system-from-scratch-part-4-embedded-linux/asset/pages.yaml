  md: "# CHAPTER 14. ADVANCED TOPICS\n\n# # Process Lifecycle Management\n\nProcess\
    \ Lifecycle Management in Adaptive AUTOSAR deals with the different stages a process\
    \ goes through creation to termination. Execution states represent the internal\
    \ lifecycle of a process from the process's point of view, while process states\
    \ represent the lifecycle from the point of view of Execution Management. Understanding\
    \ these states is essential for managing resources and the operation of Adaptive\
    \ AUTOSAR systems.\n\n+   - Execution States\n\n+   - characterizes the internal\
    \ lifecycle of a Process. In other words, they describe it from the point of view\
    \ of a Process that is executed. The states visible to the Process are defined\
    \ by the ExecutionState enumeration.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_402_0.png)\n\
    \nExecution states:\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_402_1.png)\n\n\
    Key Points:\n\n+   1. Execution States:\n    - Defined by the ExecutionState enumeration.\n\
    \    - Characterize the internal lifecycle of a process from its own perspective.\n\
    2. Process States:\n    - Characterize the lifecycle of a process from the perspective\
    \ of Execution Management.\n    - Each process is independent and has its own\
    \ process state.\n\nPAGE 401 OF 465\nMastering Embedded System from Scratch\n\
    Copyright © 2023 -- Keroles Khalil, eng:keroles.karam@gmail.com"
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Process States characterize the lifecycle of a Process from the point of
    view of Execution Management


    In other words, they represent Execution Management internal tracking of the Execution
    States.


    Note that each Process is independent and therefore has its own Process State.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_403_0.png)


    Process states:


    Process is in idle state until its startup state is active.


    EM allocates resources for the process then creates it as an OS task.


    The process starts running after reporting kRunning state to EM.


    The process reports kTerminating to EM after it has sent terminating request (SIGTERM)
    to the process.


    The process during the terminating state frees the resources and saves its data
    then it exits the OS.


    After process termination EM as a parent process knows when a child process is
    terminated implicitly without reporting


    Example: Process Lifecycle and States in an Adaptive AUTOSAR System


    Consider an Adaptive AUTOSAR system with the following process:


    +   - Process: ExampleProcess


    Table: Process Lifecycle and States in Adaptive AUTOSAR System


    | Process State | Execution State | Description |

    |---|---|-|

    | Idle | | Process is in idle state until its startup state is active. |

    | Allocating | | EM allocates resources for the process. |

    | Creating | | EM creates the process as an OS task. |

    | Running | kRunning | The process starts running and kRunning state to EM. |

    | TerminatingRequest | kTerminating | Process reports kTerminating to EM after
    sending SIGTERM. |

    | Terminating | | Process frees resources, saves data, and exits the OS. |

    | Terminated | | EM knows when a child process is terminated implicitly. |'
