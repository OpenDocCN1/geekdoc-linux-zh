  md: '# CHAPTER 13 INTRODUCTION TO EMBEDDED LINUX


    +   - Only applicable for files, not used for directories


    +   - After implementing it for directories, a security hole was found. Can cause
    loops of links which result in system faults. So it was disabled in latest releases


    +   - Does not work across filesystems


    +   - We just link using the inode# But inode# is only unique within the same
    filesystem


    +   - Hence, we cannot link to a file in a different filesystem This is very limiting,
    specially merges all the FS in a unified tree


    To rm the hardlink and the original files


    +   - You have to remove the original and hard link file to remove the inode and
    the d-entries


