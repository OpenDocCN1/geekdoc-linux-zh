  md: '# 13. INTRODUCTION TO EMBEDDED LINUX


    ARM SoC-based systems, I/O memory allocation and mapping can be accomplished using
    a similar approach as Intel CPUs, with some differences in implementation details.


    ARM systems use memory-mapped I/O to access I/O devices, which means the I/O device''s
    registers are mapped to a region of physical memory addresses, and the device
    is treated as if it were another memory location.


    To allocate I/O memory on ARM-based systems, the system administrator or device
    driver writer typically uses the ioremap function to map a region of physical
    memory addresses to a virtual address. The driver can use the virtual addresses
    to access the I/O device''s registers using standard memory access instructions.


    One difference between ARM-based systems and Intel CPUs is that ARM systems often
    use a dedicated I/O co-processor, such as a DMA controller, to manage I/O operations.
    The co-processor is responsible for transferring data between the I/O device and
    the main memory, reducing the workload on the CPU.


    To support DMA transfers, ARM-based systems use a DMA mapping function to map
    the memory buffer used for data transfer between the device and main memory. This
    ensures that the data can be accessed by both the device and the CPU using a consistent
    address space.


    ARM-based systems, the request_mem function is not used for I/O memory allocation,
    as the ARM architecture does not require explicit memory reservation. Instead,
    the ioremap function is used to map physical memory addresses to virtual addresses.


    In summary, I/O memory allocation and mapping on ARM-based systems use a similar
    approach to memory-mapped I/O on Intel CPUs, but with some implementation differences.
    I/O memory is allocated by mapping a region of physical memory addresses to a
    virtual address space using the ioremap function. A dedicated I/O co-processor,
    such as a DMA controller, is often used to manage I/O operations, and a DMA mapping
    function is used to map memory buffers used for data transfer.


