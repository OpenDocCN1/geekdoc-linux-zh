  md: "Expired Array: The scheduler maintains an expired array, which is a list of\
    \ processes that have used up their time slice. This list is also ordered by priority.\n\
    \n3. Priority levels: Processes in the active array are divided into 140 priority\
    \ levels, with priority 0 being the highest priority. Each priority level has\
    \ its own time slice.\n\n4. Selection of next process: When a process finishes\
    \ its time slice, the scheduler selects the next process to run from the active\
    \ array by choosing the highest priority process. If there are no processes in\
    \ the active array, the scheduler selects the highest priority process from the\
    \ expired array and moves it to the active array.\n\n5. Round-robin scheduling:\
    \ Within a priority level, the scheduler uses round-robin scheduling to allocate\
    \ CPU time to each.\n\n6. Preemption: The scheduler can preempt a running process\
    \ if a higher priority process becomes runnable.\n\n7. Advantages: The O(1) scheduler\
    \ has several advantages over previous scheduling algorithms, including reduced\
    \ overhead and improved performance in high-load situations.\n\nExample: Assume\
    \ that there are three processes in the active array: A has a priority of 0, B\
    \ has a priority of 5, and C has a priority of 10. The scheduler will select process\
    \ A to run first because it has the highest priority. If process A uses its time\
    \ slice, the scheduler will select the next highest priority process, which is\
    \ B. If process B uses up its time slice, the scheduler will select process C,\
    \ and so on. If a process with a higher priority than A becomes runnable, the\
    \ scheduler will preempt A and run the higher priority process.\n\n+   - Active\
    \ Array: list of processes with time remaining in their time slices.\n- Expired\
    \ array: list of expired processes\n- scheduler chooses the process with the highest\
    \ priority from the active array.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_93_0.png)\n\
    \n# COMPLETELY FAIR SCHEDULING (CFS) SCHEDULER\n\nCompletely Fair Scheduling (CFS)\
    \ is a process scheduler used in the Linux kernel since 2.6.23. CFS is designed\
    \ to be fair to all processes, regardless of their priority or resource needs.\
    \ Here are some key points about CFS:\n\n+   1. CFS uses a red-tree to keep track\
    \ of processes.\n  - Each process is a node in the tree.\n  - The key in each\
    \ node is the amount of CPU time the process has consumed.\n  - The tree is ordered\
    \ by CPU time, so the node with the lowest CPU time is at the root of the tree.\n\
    \n+   2. CFS tracks the virtual runtime of each process.\n  - The virtual runtime\
    \ is the amount of time a process has spent waiting for CPU."
