    # DMA Direct Memory Access


    Direct Memory Access (DMA) is a technique used to improve the efficiency of data
    transfers between I/O devices and memory in computer systems. It is used to avoid
    programmed I/O for large data movement, which can become very heavy on the CPU.


    When I/O devices need to transfer a large amount of data, such as when copying
    data to or from disks, the CPU can become overloaded with the task of managing
    the data transfer. This is where DMA comes in - it provides a special DMA controller
    that can access the memory bus directly and bypass the CPU to transfer data between
    the I/O device and memory.


    With DMA, the I/O device sends a DMA request to the DMA controller, specifying
    the memory address and the number of bytes to be transferred. The DMA controller
    then takes control of the memory bus and performs the data transfer without CPU
    intervention. Once the transfer is complete, the DMA controller sends an interrupt
    to notify it of the completion.


    DMA can be used with both port-mapped I/O and memory-mapped I/O, as it operates
    at a lower level than the CPU''s memory access instructions. It can significantly
    improve the efficiency of data transfers between I/O devices and memory, reducing
    the workload on the CPU and improving system performance.


    In summary, DMA is a technique used to improve the efficiency of data transfers
    between I/O devices and memory in computer systems. It provides a special DMA
    controller that can access the memory bus directly and bypass the CPU to transfer
    data between the I/O device and memory. DMA


