    # Process hierarchy


    Process hierarchy is a fundamental concept in operating systems, where each process
    is organized into a hierarchical tree structure. Here are some key points to help
    you understand the process hierarchy:


    +   1. Process ID (PID): Each process in the system is assigned a unique positive
    integer as the Process ID (PID). The PID is used by the operating system to identify
    and manage each process. The first process in the system is assigned a PID of
    1.

    2. Root process: The process tree is rooted at the first process, known as the
    init process. The init process is started by the operating system during the boot
    process and is responsible for starting and managing other processes in the system.

    3. Process creation: New processes are created using the fork() system call. The
    fork() system call creates a new process by duplicating the existing process.
    The new process, known as the child process, is an exact copy of the parent process,
    except for a few attributes such as the PID and memory address space.

    4. Process hierarchy: The process tree is organized into a hierarchical structure,
    with each process having a parent process and zero or more child processes. This
    hierarchical structure allows processes to be organized into groups, making it
    easier to manage and monitor them.

    5. Programmatically accessing PID: In C programming language, the PID is represented
    by the pid_type, which is defined in the header file <sys/types.h>. You can programmatically
    access the PID of the current process using the getpid() system call.


    Here''s a table summarizing the key attributes of the process hierarchy:


    | Attribute | Description |

    |---|---|

    | Process ID (PID) | Unique positive integer assigned to each process |

    | Root process | First process in the system, responsible for starting and managing
    other processes |

    | Process creation | New processes are created using the fork() system call |'
