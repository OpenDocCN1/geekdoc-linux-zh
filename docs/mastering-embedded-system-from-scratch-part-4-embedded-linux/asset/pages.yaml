  md: "# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX\n\nAs mentioned earlier, a thread\
    \ can be detached by the pthread detach() function. Detaching a thread means that\
    \ it becomes independent and no longer needs to be explicitly joined by another\
    \ thread. Here are some key points to help you understand detached threads:\n\n\
    +   1. Advantages of detached threads: Detached threads have some advantages over\
    \ joinable threads. They are more efficient because they don't need to be explicitly\
    \ joined, and they can save memory because the resources used by the thread are\
    \ automatically released when the thread exits.\n2. Disadvantages of detached\
    \ threads: The main disadvantage of detached threads is that they cannot be explicitly\
    \ joined by another thread. This means there is no way to wait for the thread\
    \ to complete and to ensure that it executed successfully. If the thread encounters\
    \ an error or fails to complete for some other reason, there is no way to detect\
    \ this from another thread.\n3. Creating detached threads: To create a detached\
    \ thread, you can set the detachstate attribute of the pthread_attr_t structure\
    \ to PTHREAD_CREATE_DETACHED before creating the thread. Here's an example:\n\n\
    ```\n#include <pthread.h>\n#include <stdio.h>\n\nvoid* thread_func(void* arg)\
    \ {\n    printf(\"Hello, world!\\n\");\n    return NULL;\n}\n\nint main() {\n\
    \    pthread_t thread;\n    pthread_attr_t attr;\n    int ret;\n    ret = pthread_attr_init(&attr);\n\
    \    if (ret != 0) {\n        perror(\"pthread_attr_init\");\n        return 1;\n\
    \    }\n    ret = pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_DETACHED);\n\
    \    if (ret != 0) {\n        perror(\"pthread_attr_setdetachstate\");\n     \
    \   return 1;\n    }\n    ret = pthread_create(&thread, &attr, thread_func, NULL);\n\
    \    if (ret != 0) {\n        perror(\"pthread_create\");\n        return 1;\n\
    \    }\n    pthread_attr_destroy(&attr);\n    return 0;\n}\n```\n\nIn this example,\
    \ the main() function creates a new thread using pthread_create(). Before creating\
    \ the thread, it initializes a pthread_attr_t structure using pthread_attr_init().\
    \ It sets the detach attribute of the structure to PTHREAD_CREATE_DETACHED using\
    \ pthread_attr_detachstate(). Finally, it creates the thread using pthread_create(),\
    \ and the main() function destroys the pthread_attr_t structure using pthread_attr_destroy().\n\
    \nPAGE 175 OF 465\nMastering Embedded Systems from Scratch - Keroles Khalil, eng.keroles.karam@gmail.com\n\
    Copyright © 2023 - Keroles Khalil\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_176_0.png)"
