    # T.L.B (Translation look-aside Buffer)


    The Translation Lookaside Buffer (TLB) is a hardware cache used to improve the
    performance of virtual-to-physical address translation in a system using paging
    or segmentation. The TLB is part of the Memory Management Unit (MMU) in modern
    CPUs and serves as a small, fast cache that holds the most recently used page
    table entries, reducing the time it takes to look up the physical address for
    a given virtual address.


    When the CPU generates a virtual address, the MMU first checks if the corresponding
    page table entry is present in the TLB. If it is, this is called a TLB hit, and
    the MMU can quickly obtain the physical address without having access to the full
    page table in memory. This significantly speeds up the address translation process.


    However, if the required page table entry is not in the TLB, this is called a
    TLB miss. In this case, the MMU must access the page table in memory to retrieve
    the needed entry. Once the entry is found, the MMU may update the TLB with the
    new entry to speed up future addresses for the same page.


    Some important aspects of TLBs include:


    +   - Size: TLBs are typically small, with a limited number of entries (e.g.,
    64, 128, or 256 entries). This is due to the high cost and complexity of implementing
    a large, fast cache on the CPU die.

    - Associativity: TLBs can be implemented with different levels of associativity,
    such as direct-mapped, set-associative, or fully associative. The associativity
    of a TLB impacts its hit rate, replacement policy, and complexity.

    - Replacement policy: When the TLB is full and a new entry needs to be added,
    a replacement policy is used to determine which entry should be replaced. Common
    replacement policies include Least Recently Used (LRU), First-In, First-Out (FIFO),
    and random replacement.

    - Multi-level TLBs: Some systems use a multi-level TLB hierarchy, where a fast
    Level-1 (L1) TLB is backed by a larger, slower Level-2 (L2) TLB. This can improve
    hit rates and overall performance.

    - TLB consistency: The operating system must ensure TLB consistency when modifying
    page entries, as during process creation or deletion, or when updating memory
    protection


