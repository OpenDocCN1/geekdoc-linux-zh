  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    Virtual memory is used to manage the program''s memory and allocate memory to
    different segments dynamically during the program''s execution. Each program has
    its own virtual memory space, which is divided into pages of a fixed size. The
    size of a page is typically 4KB, but it can vary depending on the system architecture.


    When a program is loaded into memory, the virtual memory system maps the program''s
    segments into physical memory pages. This mapping is done on demand, which means
    that a page is only loaded into physical memory when it is needed. This helps
    to conserve physical memory by only allocating the pages that are actually being
    used.


    For example, let''s say we have a program that consists of a text segment, a data
    segment, and a symbol table segment. When the program is loaded into memory, the
    virtual memory system maps each segment to a set of physical memory pages. When
    the program starts executing, the virtual memory system loads the text pages into
    physical memory as needed. Similarly, the program accesses data or symbol table
    information, the virtual memory system loads the corresponding pages into physical
    memory. This way, the program can access its data and code as if they were all
    in memory, even though they are actually managed by the virtual memory system.


