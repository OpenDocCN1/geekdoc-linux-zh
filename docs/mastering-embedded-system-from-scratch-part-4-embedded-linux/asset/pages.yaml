  md: "1. Detaching Threads: A thread can be detached using the pthread_detach() function.\
    \ Once a thread is detached, it cannot be joined using pthread_join(). Here's\
    \ an example:\n\n```\n#include <pthread.h>\n#include <stdio.h>\n\nvoid thread_func(void*\
    \ arg) {\n    printf(\"Hello, world!\\n\");\n    return NULL;\n}\n\nint main()\
    \ {\n    pthread_t thread;\n    int ret;\n    ret = pthread_create(&thread, NULL,\
    \ thread_func, NULL);\n    if (ret != 0) {\n        perror(\"thread_create\");\n\
    \        return 1;\n    }\n\n    ret = pthread_detach(thread);\n    if (ret !=\
    \ 0) {\n        perror(\"thread_detach\");\n        return 1;\n    }\n\n    return\
    \ 0;\n}\n```\n\nIn this example, the main() function creates a new thread using\
    \ pthread_create(). After creating the thread, it calls pthread_detach() to detach\
    \ the thread. The thread function is the same as in the previous example. Once\
    \ the thread is detached, it cannot be joined using pthread_join(). The thread's\
    \ resources will be automatically released when it exits.\n\n# Thread join, code\
    \ sample\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_175_0.png)\n\n# detached\
    \ threads\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_175_1.png)"
