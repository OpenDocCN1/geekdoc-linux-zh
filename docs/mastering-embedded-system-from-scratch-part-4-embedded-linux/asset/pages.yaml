  md: '# CHAPTER 13 INTRODUCTION TO EMBEDDED LINUX


    A logical address is generated by the CPU, which consists of the two parts:


    +   - Segment number (s): Identifies the segment in which the address resides.

    - Offset (o): Represents the position of the desired address within the segment.


    2. The segment number (s) is used as an index into the segment table to look up
    the base address and limit of the corresponding segment. The segment table is
    stored in memory and is pointed to by the Segment-Table Base Register (STBR).


    3. The segment number is checked against the Segment-Length Register (STLR) to
    ensure it is a legal segment (i.e., s < STLR). If the segment number is not legal,
    an error (e.g., segmentation fault) is generated.


    4. The offset (o) is checked against the segment limit to ensure the access is
    within the segment boundaries. If the offset is greater than or equal to the limit,
    an error (e.g., segmentation fault) is generated.


    5. If both checks pass, the physical address is calculated by adding the base
    address of the segment (found in the segment table) to the offset (o):


    Physical Address = Base Address + Offset


    The resulting physical address corresponds to the actual location in memory and
    can be used to access the desired data or instruction.


    By dividing the program into segments and using a segment table to manage the
    translation, the segmentation architecture allows for flexible memory organization,
    improved memory protection, and easier sharing of code and data between processes.
    However, it should be noted that segmentation may suffer from external fragmentation,
    as segments can vary in size and may not perfectly fit within the available memory
    space.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_51_0.png)


