  md: '# CHAPTER 15 INTRODUCTION TO EMBEDDED LINUX


    +   - It started in bell Labs with terminated project for Multics Multi-user operating
    system

    - Dennis Ritchie and Ken Thomson started to work on Unix 1969: first Implementation
    of Unix.

    - 1972:Creation of "C" Programming Language to facilitate the porting.

    - 1973: Complete rewrite of Unix into "c"

    - Richard Stallman is believing in free Software, he formed the Software Foundation
    and Started the GNU [GNU Not Unix] Project in 1983.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_17_0.png)


    Linux is a free and open-source operating system that is based on Unix. It was
    initially developed by Linux Torvalds in 1991 as a hobby project while he was
    a student at the University of Helsinki in Finland.


    Unlike commercial operating systems like Microsoft Windows or MacOS, Linux is
    free and open-source software. This means that anyone can view and modify the
    source code of the operating system, and distribute it as they see fit. This has
    led to the development of a large community of developers and users who contribute
    to the ongoing development and improvement of Linux.


    The Linux operating system is made up of a kernel, which is the core component
    that interacts directly with the computer hardware, and a set of utilities and
    tools that provide additional functionality, such as file management, networking,
    and software installation. Many of these utilities and tools are part of the GNU
    Project, which was launched by Richard Stallman in 1983 with the goal of creating
    a complete, free, and open-source Unix-like operating system.


    Linux has become a popular choice for a wide range of applications, from desktop
    and laptop computers to servers and embedded systems. Its open-source nature,
    flexibility, and reliability have made it a favorite among developers and users
    who value the ability to customize and modify the operating system to meet their
    specific needs.'
