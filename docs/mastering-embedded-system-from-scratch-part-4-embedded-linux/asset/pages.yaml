    # # PAGE FAULT


    A page fault is an event that occurs when a program tries to access a virtual
    address that is not currently mapped to a physical address in main memory. In
    a virtual memory system, pages are loaded into memory on-demand, which means that
    not all pages of a program are loaded into memory at any given time. When a program
    accesses a virtual address that is not in memory, the hardware raises a page fault
    exception, which is then handled by the operating system.


    The main steps in handling a page fault are as follows:


    +   1. Save the context: The operating system saves the current context of the
    process that triggered the page fault, including the values of registers and the
    program counter. This is necessary to resume the process after the page fault
    has been resolved.

    2. Determine the faulty address: The operating system retrieves the faulty virtual
    address from a hardware register or a specific location in memory.

    3. Check if the fault address is valid: The operating system checks if the faulty
    address is within the bounds of the program''s address space. If it is not, this
    indicates an invalid memory access, and the operating system terminates the process
    with an error (e.g., segmentation fault).

    4. Find the missing page: If the fault address is valid, the operating system
    determines the location of the missing page on the secondary storage (e.g., hard
    disk).

    5. Allocate a free frame: The operating system searches for a free frame in the
    main memory to load the missing page. If no free frame is available, a page replacement
    policy (e.g., Least Used, First-In, First-Out, Clock) is used to select a victim
    frame to be replaced.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_58_1.png)'
