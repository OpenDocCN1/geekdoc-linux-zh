  md: '# CHAPTER 14. ADVANCED TOPICS


    Table: Startup Sequence in Adaptive AUTOSAR System


    | Sequence | Component | Description |

    |---|---|---|

    | 1 | Execution Management | Manages and coordinates the startup sequence |

    | 2 | Adaptive Platform | Provides essential services and infrastructure |

    | 3 | Adaptive Platform | Offers platform-level services and functionalities |

    | | Services | | |

    | 4 | User-Level Application A | Executes application-specific tasks (A1 and A2)
    |

    | 5 | User-Level Application B | Executes application-specific tasks (B1) |


    In this example, Execution Management ensures the correct startup sequence for
    the Adaptive Platform Foundation, Adaptive Platform Services, and user-level applications.
    This allows the system to operate efficiently and reliably, meeting the demands
    of modern automotive applications.


    +   - When the Machine is started, Execution Management is launched as the Machine''s
    first process.

    - Functional clusters and platform-level Applications of the Adaptive Platform
    Foundation Services are then launched by Execution Management.

    - After the Adaptive Platform Foundation and Adaptive Platform Services, Execution
    Management continues to launch user-level Applications.

    - Please note that Execution Management consists of one or more Instances Starts
    at instances of each Executable.

    - The order of executables shall be determined by Execution Management based on
    Machine Manifest and Execution Manifest information.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_396_0.png)


    Execution Management reads the manifest and determines the application order based
    on the dependency structure.


    Other Adaptive-level inclusions are also started as they are described with Manifests.


    Processes of Application Executables are instantiated based on the startup order.


