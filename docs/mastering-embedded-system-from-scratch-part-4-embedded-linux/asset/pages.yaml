  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    responsible for managing the CPU''s time and resources, ensuring that each process
    or thread gets a fair share of the available resources.


    In Linux, there are three types of tasks that can be scheduled by the kernel:
    kernel threads, user processes, and user threads.


    +   1. **Kernel Thread:** These are processes that do not have a user context
    and execute in the kernel space as long as they live. They are used for kernel-level
    tasks such as device drivers, system daemons, and network protocols.

    2. **User Process:** Each process has its own address space, which is managed
    by the virtual memory subsystem. They enter the kernel mode when an interrupt,
    exception, or system call is executed. When a process enters the kernel mode,
    it uses a separate kernel stack, and each process has its own kernel stack.

    3. **User Thread:** Threads are different execution entities that are mapped to
    a single process. User space threads share a common text, data, and heap space
    but have separate addresses. Other resources, such as open files and signal handlers,
    are also shared across threads.


    The Linux scheduler is designed to provide fairness, efficiency, and determinism.
    The scheduler aims to provide each process or thread with a fair share of the
    available resources, ensuring that no process or thread is starved of resources.
    The scheduler also aims to be efficient by minimizing the amount of CPU time spent
    on switching between processes or threads. Finally, the scheduler aims to be deterministic,
    providing predictable and consistent performance across different workloads and
    hardware configurations.


    Over the course of various kernel releases, the Linux scheduler has evolved to
    provide more deterministic scheduling policies, including real-time scheduling
    policies that guarantee predictable response times for time-critical applications.
    These policies enable Linux to be used in a wide range of applications, from embedded
    systems and real-time control systems to high-performance computing and serving
    environments.


    # File System


    The file system is a critical component of any operating system that provides
    a structured way of storing and retrieving data on disk or other storage devices.
    In Linux, the various file systems are managed by a layer called the Virtual File
    System (VFS). The VFS provides a consistent view of data as stored on various
    devices on the system, abstracting away the differences between the file systems
    and providing a wide interface for accessing them.


    Linux supports a wide range of file systems, including classical file systems
    like EXT2 and EXT4, compressed read-only file systems like CRAMFS, read-only file
    systems like ROMFS, and write-memory-based file systems like RAMFS. In Linux,
    Linux supports journaling file systems like JFFS2 that are specifically designed
    for use on flash memory devices.


    Some of the commonly embedded file systems on Linux are:


