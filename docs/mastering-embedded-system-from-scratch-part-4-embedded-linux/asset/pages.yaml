    +   * /dev/stdin,/dev/stdout,/dev/stderr: These devices are symlinks to the standard
    input, standard output, and standard error, respectively. They can be used to
    explicitly reference these file descriptors for redirection.


    Example: command 2&1 >output.log <input.txt


    In this example, stderr (file descriptor 2) is redirected to the same place as
    stdout (1), which is then redirected to the file output.log. The input for the
    command is read from the file input.txt.


    These are some of the common devices for I/O redirection in Linux. Knowing how
    to use them can be helpful for scripting and command-line tasks.


