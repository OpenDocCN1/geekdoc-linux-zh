    \ change request, EM terminates the running processes that are not needed in the\
    \ new state.\n- Start Processes in New State:\n    - EM starts processes that\
    \ are active in the new state (StateXYZ).\n- Confirm State Change:\n    - EM confirms\
    \ the state change to State Management.\n\nExample: State Change Sequence to Machine\
    \ State StateXYZ in an Adaptive AUTOSAR System\n\n| Step | Action |\n|---|---|\n\
