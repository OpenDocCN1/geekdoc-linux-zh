  md: "# CHAPTER 14. ADVANCED TOPICS\n\n+   - The subscriber node creates a client\
    \ for the publisher node using\n  TCPROS, and connects to the publisher node.\n\
    \n+   - At this point, the communication between nodes uses TCP/IP based\nprotocol\
    \ called TCPROS.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_448_0.png)\n\n# ROS\
    \ TCP\n\nROS supports TCP/IP network communication between nodes, which allows\
    \ nodes to communicate\nwith each other over a network. This enables ROS to be\
    \ used in distributed systems where nodes are\nlocated on different machines.\n\
    \nTCP (Transmission Control Protocol) is one of the transport layer protocols\
    \ used by ROS to establish\nreliable communication between nodes over a network.\
    \ It provides a connection-oriented, point-to-\ncommunication channel between\
    \ nodes.\n\nROS uses the TCPROS protocol to communicate over TCP/IP. The TCPROS\
    \ protocol is used to\nestablish a connection between two nodes and to transmit\
    \ ROS messages over the connection. It\nprovides reliable delivery of messages\
    \ and automatic retransmission of lost messages.\n\nTo use TCPROS, the nodes must\
    \ know each other's IP addresses and port numbers. The ROS Master\nnode is used\
    \ to provide this information to the nodes. Each node registers with the ROS Master,\n\
    providing its IP address and port number. Other nodes can then look up this information\
    \ from the\nROS Master to establish a connection with the node.\n\nTCPROS can\
    \ be used with any ROS transport layer, including message serialization formats\
    \ such as\nROS Messages, Protocol Buffers, and JSON."
