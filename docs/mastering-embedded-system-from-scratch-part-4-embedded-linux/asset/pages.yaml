  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\nThe CPU nodes represent the\
    \ simplest case when talking about addressing.\n\nEach CPU is assigned a single\
    \ unique ID, and there is no size associated with CPU ids.\n\n```\ncpu {\n   \
    \ device-cells = <1>;\n    #node-cells = <0>;\n    memory {\n        compatible\
    \ = \"arm,cortex-a9\";\n        reg = <0>;\n    }\n    cpu {\n        compatible\
    \ = \"arm,cortex-a9\";\n        reg = <1>;\n    }\n}\n```\n\nThe DTS addressing\
    \ mechanism provides a flexible way to specify the mapping between devices, address\
    \ spaces, and memory regions in a system.\n\n# DTS INTERRUPTS\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_328_0.png)\n\
    \nA property of a device node containing a list of interrupt specifiers, one for\
    \ each output line, on device\n\nA property of a device node containing a phandle\
    \ to the interrupt controller attached to. Nodes that do not have this property\
    \ inherit it from the parent node.\n\n#interrupt-cells This is a property of the\
    \ interrupt controller node. It defines the format of the interrupt specifier\
    \ (linked to interrupt-cells and parent-cells).\n\nAn empty property declaring\
    \ a node as a device that receives interrupt signals\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_328_1.png)\n\
    \n```\ncompatible = \"arm,plic-range\";\n#address-cells = <1>;\ninterrupt-parent\
    \ = <&gic>;\n```\n\n```\ninterrupts {\n    compatible = \"arm,gic\";\n    #interrupt-cells\
    \ = <3>;\n    #interrupt-cells = <2>;n}\n```\n\n```\ninterrupts {\n    compatible\
    \ = \"arm,gic\";\n    reg = <0 0>;\n    #interrupt-cells = <2>;n}\n```\n\n```\n\
    gic {\n    compatible = \"arm,gic\";\n    reg = <0 0>;\n    #interrupt-cells =\
    \ <3>;n}\n```\n\nSome things to note:\n\n+   - The machine has a single interrupt\
    \ controller, interrupt-controller.\n- The label is added to the interrupt controller\
    \ node, and the label is used to assign a phandle to the interrupt-parent in the\
    \ root node. The interrupt value becomes the default value for the device; however,\
    \ all nodes can be explicitly configured.\n- Each device has an interrupt to specify\
    \ a different input line.\n- This example shows the common pattern of using the\
    \ first cell to encode the interrupt controller and the second cell to encode\
    \ active high or edge level. For given information, refer to the controller binding\
    \ documentation to learn how the specifier is encoded.\n\nIn the Device Tree Source\
    \ (DTS) syntax, interrupts are described using several properties:\n\n+   interrupts:\
    \ The interrupts property is used to specify the interrupt number(s) and type(s)\
    \ for a device.\n\n```\nnode {\n    compatible = \"vendor,device\";\n    interrupts\
    \ = <4 2>;\n}\n```\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_328_2.png)\n\n\
    PAGE 327 OF 465\n\nMastering Embedded System from Scratch\nCopyright © 2023 -\
    \ Team Me! - Keroles Khail, eng.keroles@gmail.com"
