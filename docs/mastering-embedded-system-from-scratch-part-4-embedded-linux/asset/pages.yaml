  md: "![](img/bc86631e65e541c1c58ec0ab72a978e0_240_0.png)\n\n+   * It is the code\
    \ that runs immediately after a reset or power-on has to be stored on-chip in\
    \ the SoC;\n  * this is known as ROM code.\n* It is loaded into the chip when\
    \ it is manufactured, and hence the ROM code cannot be replaced by an open source\
    \ equivalent.\n* Usually, it does not include code to initialize the memory controller,\
    \ since DRAM configurations are highly device-specific, and so it can only use\
    \ Static Random Access Memory (SRAM), which does not require a memory controller.\n\
    * Most embedded SoC have a small amount of SRAM on-chip, varying in size from\
    \ as little as 4 KB to several hundred KB\n* The ROM code is capable of loading\
    \ a small chunk of code from one of several pre-programmed locations into the\
    \ SRAM.\n  * As an example, TI OMAP and Sitara chips try to load code from the\
    \ first few pages of NAND flash memory, or from flash memory connected through\
    \ a Serial Peripheral Interface (SPI), or from the first sectors of an MMC device\
    \ (which could be an eMMC or an SD card), or from a file named MLO in the first\
    \ partition of an MMC.\n* Most SoCs have a ROM code that works in a similar way.\
    \ In SoCs where the SRAM is not large enough to load a full bootloader like UBoot,\
    \ there has to be an intermediate secondary program loader, or SPL.\n\nAt the\
    \ end of the ROM code phase, the SPL is present in the SRAM and the\n\nROM code\
    \ jumps to the beginning of that code.\n\n# Phase 2 – secondary program loader\n\
