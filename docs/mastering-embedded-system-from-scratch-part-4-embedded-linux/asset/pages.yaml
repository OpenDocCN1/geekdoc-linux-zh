    - The outcome is a Relocatable Object File\n- The object file generated by the\
    \ GNU ELF format\n- Besides the binary code of the program, ELF files contain\
    \ other info such as a symbol table which contain a list of symbols generated\
    \ during the compilation process with addresses in the file\n- Symbols in the\
    \ Symbol table (among other things):\n  - Names of static and global variables\
    \ defined in the file\n  - Names of static and global variables used in the source\
