    # How to create a minimal root filesystem ?


    you need these components:


    +   - init: This is the program that starts everything, usually by running a series
    of scripts.

    - Shell: You need a shell to give you a command prompt, also to run the shell
    scripts called by init and other programs.

    - Daemons: A daemon is a background program that provides a service to others.
    Other examples are the system log daemon (syslog) and the secure shell daemon
    (sshd). The init program must start the initial population of daemons to support
    the main system applications. In fact, init is itself a daemon: it is the daemon
    that provides the service of launching other daemons.

    - Shared libraries: Most programs are linked with shared libraries, and so they
    must be present in the root filesystem.

    - Configuration files: The configuration for init and other daemons is stored
    in a series of files, using in the /etc directory.

    - Device nodes: These are special files that give access to various device drivers.

    - /proc and /sys: These two pseudo filesystems represent kernel data structures
    as a hierarchy of directories and files.

    - Kernel modules: If you have configured some parts of your kernel to modules,
    they need to be installed in the root filesystem, usually in /lib/modules/[kernel
    version].


