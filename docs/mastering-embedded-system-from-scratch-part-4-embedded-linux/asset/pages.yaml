  md: '# # The Linux Scheduler


    +   - The scheduler is that part of the kernel code that makes it possible to
    execute multiple programs at the same time, sharing the CPU among a number of
    processes.

    - Deciding which process to run, and for how long is the scheduler''s primary
    responsibility.

    - Linux scheduling is based on the time-sharing technique

    - The CPU time is roughly divided into "slices", one for each runnable process

    - If a currently running process is not terminated when its time slice or quantum
    expires, the process is preempted.

    - Time-sharing relies on timer interrupts and is transparent to processes.

    - No additional code needs to be inserted in the processes in order to ensure
    CPU time-sharing.

    - The scheduling policy is based on ranking processes according to their priority.

    - Highest priority processes run the fast.

    - In Linux process priority is dynamic.

    - The scheduler keeps track of what processes are doing and adjusts their priorities
    periodically.

    - Processes that have been denied use of the CPU for a long interval are boosted
    by dynamically increasing their priority.

    - Processes running for a long time are penalized by decreasing their priority.


    The Linux scheduler is responsible for managing the allocation of CPU time to
    processes and threads in the system. Here are some key points about the Linux
    scheduler:


    +   6. Scheduling classes: The Linux scheduler has different scheduling classes
    that determine how processes are scheduled. The most commonly used scheduling
    class is the Completely Fair Scheduler (CFS), which ensures that each process
    receives a fair share of CPU time. Other scheduling classes include the Real-time
    scheduler and the Deadline scheduler.

    7. Priorities: Each process and thread has a priority that determines its position
    in the scheduling queue. The Linux scheduler uses a priority-based scheduling
    algorithm to decide which process or thread to run next.

    8. Time slices: The Linux scheduler uses time slices to allocate CPU time to processes
    and threads. A time slice is the amount of time that a process or thread is allowed
    to run before being preempted and replaced by another process or thread.

    9. Preemption: The Linux scheduler supports preemption, which means that a process
    or thread can be interrupted and replaced by another process or thread if a higher-priority
    process or thread becomes runnable.

    10. Load balancing: The Linux scheduler performs load balancing to ensure that
    the workload is evenly distributed across all CPUs. If a CPU is idle while other
    CPUs are busy, the scheduler will move more processes to the idle CPU to balance
    the load.


    Example:


    Let''s say we have a Linux system with multiple processes and threads running.
    The Linux scheduler ensures that each process and thread receives a fair share
    of CPU time, so no process or thread is starved of resources.


    Suppose a new high-priority process is created. The Linux scheduler will prioritize
    this process and allocate more CPU time to it than lower-priority processes. If
    the new process is CPU-bound and uses up its time slice quickly, it may be preempted
    and replaced by another process or thread.


