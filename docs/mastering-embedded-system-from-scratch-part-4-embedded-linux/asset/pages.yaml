  md: '# CHAPTER 13 INTRODUCTION TO EMBEDDED LINUX


    Socket Programming is a way to establish communication between two nodes (computers)
    over a network. In Linux, socket programming is widely used for client-server
    communication. The following are the key components of socket programming:


    Server: The server passively waits for and responds to clients. It listens for
    incoming connections over a passive socket.


    Client: The client initiates communication and must know the address and the port
    of the server. It uses an active socket to connect to the server.


    Socket Descriptor: It is an integer value that represents an endpoint of communication.
    It is similar to a file handler in Linux.


    Communication Domain: It specifies the communication protocol to be used. For
    instance, PF_INET for IPv4 protocol and Internet addresses.


    Connection Type: It defines the type of socket to be created. For example, SOCK_STREAM
    for reliable, 2-way, connection-based service, and SOCK_DGRAM for unreliable,
    connectionless messages of maximum length.


    Protocol: It specifies the protocol to be used, such as IPPROTO_TCP or IPPROTO_UDP.


    The following are the important functions used in Linux Socket Programming:


    +   - socket(): It creates a new socket and returns a socket descriptor.

    - bind(): It associates a socket with a local address and port.

    - listen(): It listens for incoming connections on a socket.

    - accept(): It accepts an incoming connection on a socket.

    - connect(): It initiates a connection to a remote socket.

    - send(): It sends data over a socket.

    - recv(): It receives data from a socket.

    - close(): It releases a socket descriptor.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_187_0.png)


