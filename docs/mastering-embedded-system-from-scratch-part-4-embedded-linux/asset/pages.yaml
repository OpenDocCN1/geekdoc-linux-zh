  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    The default environment is defined in the U-Boot source code and is typically
    located in the include/config directory. The configuration files in this directory
    define the default values for the environment variables. The default environment
    can be customized by modifying these configuration files and recompiling U-Boot.


    Here are some examples of environment variables that are typically included in
    the default environment:


    +   - bootdeley: This variable specifies the number of seconds to delay the boot
    process.

    - baudrate: This variable specifies the serial port baud rate.

    - ethaddr: This variable specifies the Ethernet MAC address.

    - bootargs: This variable specifies the kernel boot arguments.


    The values of the default environment variables are set at build time and cannot
    be changed at runtime. For example, some environment variables can be overridden
    by the user-defined environment. For example, if the user-defined environment
    contains a value for the bootdeley variable, that value will be used instead of
    the default value.


    It is important to note that the default environment should not be relied upon
    for production systems, as it may not be suitable for all configurations. Instead,
    it is recommended to define a custom environment for each system that provides
    the necessary configuration settings.


    +   - Every U-Boot binary has a built-in environment of its own

    - During compilation, a character array _defaultenvironment is embedded in the
    U-Boot image

    - This character array stores the environment variables as a list of null terminated
    strings with a double null terminator.

    - Environment variables which are commonly used can be enabled by defining the
    corresponding CONFIGS in your board config file (include/config/YOUR_BOARD.h)


