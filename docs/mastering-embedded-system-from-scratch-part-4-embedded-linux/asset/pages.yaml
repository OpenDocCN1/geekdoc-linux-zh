  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    When power is first applied to a processor board, many elements of hardware must
    be initialized before the simplest program can run.


    Most processors have a default address from which the first bytes of code are
    fetched upon application of power and release of reset.

    Bootloader contains the information to arrange the layout of Flash memory on the
    board and to select which address(s) the Flash memory responds to.

    This way, when power is first applied, code is fetched from a well-known and predictable
    address, and software control can be established.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_239_0.png)


    The bootloader provides this early initialization code and is responsible for
    initializing the board so that other programs can run

    After the bootloader has performed this basic processor platform initialization,
    its primary role becomes booting a full-blown operating system

    It is responsible for locating, loading, and passing execution to the primary
    operating system.


