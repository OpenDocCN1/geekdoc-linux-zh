  md: '# Ch14. Part1- Adaptive AUTOSAR


    # List of definitions


    +   - OS: Operating System

    - EM: Execution Manager

    - UCM: Update and Configuration Manager

    - DM: AUTOSAR Adaptive Diagnostic Management

    - PHM: Platform and Health Management

    - OTA: Over The Air software update

    - (UDS): Unified Diagnostic Services


    # Overview


    standardized automotive software architecture developed by the AUTOSAR partnership,
    consisting of leading automotive manufacturers, suppliers, and tool developers.
    It serves as the next generation of AUTOSAR, providing a flexible, sense-oriented,
    and scalable software framework for modern automotive systems. Adaptive AUTOSAR
    allows for the seamless integration of new features, dynamic updates, and improved
    resource management, meeting the ever-evolving demands of the automotive industry.


    The primary difference between Classic AUTOSAR and Adaptive AUTOSAR lies in their
    approach to system architecture. While Classic AUTOSAR relies on static and monolithic
    software components, Adaptive AUTOSAR focuses on dynamic, sense-oriented, and
    modular components. This enables the development of complex automotive systems
    with greater flexibility, reusability, and maintainability. Adaptive AUTOSAR is
    better suited to address the challenges posed by emerging technologies, such as
    advanced driver assistance systems (ADAS), connected cars, and autonomous driving,
    as it offers higher levels of performance, scalability, and support for multi-core
    processors.


    # Introduction


    +   - Since 2017, Adaptive AUTOSAR platform starts to arise as needed standard
    in automotive field.

    - Adaptive AUTOSAR is not a replacement of classical standard, but adaptive AUTOSAR
    can be considered as complement of classical AUTOSAR.

    - As the Adaptive Platform is AUTOSAR''s solution for high-performance computing
    ECUs to build safety-related systems for use cases such as highly automated and
    autonomous driving.

    - Both classical and adaptive standards could exist in same car.


    # Classic AUTOSAR VS Adaptive AUTOSAR


    | Aspect | Classic AUTOSAR | Adaptive AUTOSAR |

    |---|---|---|'
