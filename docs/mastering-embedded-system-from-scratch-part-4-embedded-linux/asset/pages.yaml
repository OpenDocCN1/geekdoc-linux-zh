    # LRU (LEAST RECENT USED)


    Recently Used (LRU) is a page replacement algorithm that selects the least recently
    used page for replacement when a page fault occurs and there''s no available frame
    in main memory. The underlying assumption of LRU is that pages that have been
    used recently are more likely to be used in the future. By replacing the least
    recently used page, the algorithm tries to minimize the likelihood of a subsequent
    page fault for that.


    There are several ways to implement the LRU algorithm:


    +   1. Linked list: Maintain a doubly-linked list of pages, with the most recently
    used page at the rear. When a page is accessed, it is moved to the front of the
    list. When a page fault occurs, the page at the rear of the list is replaced.
    The main disadvantage of this method is the overhead of updating the linked list
    for every memory access.


    +   2. Counter-based: Assign a counter to each page, which is updated with a global
    timestamp when the page is accessed. When a page fault occurs, the algorithm iterates
    through all pages to find the one with the lowest counter value (i.e., the least
    recently used page). This method has higher overhead during page faults for the
    search for the minimum counter value.


    +   3. Stack-based: Maintain a stack of pages, with the most recently used page
    on top. When a page is accessed, it is removed from its current position in the
    stack and pushed onto the top. When a page fault occurs, the page at the bottom
    of the stack is replaced. This method can be efficiently implemented using hardware
    support, but it may not be practical for large systems.


