  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n+   - Opening a file: To open\
    \ a file using the open() function, you need to pass in the filename and access\
    \ mode as parameters. The access mode specifies how the file will be accessed\
    \ (read, write or both) and whether a new file should be created if it doesn't\
    \ already exist. Here's an example:\n\n```\n#include <stdio.h>\n#include <fcntl.h>\n\
    \nint main() {\n    int fd;\n    fd = open(\"test.txt\", O_RDWR | O_CREAT, 0644);\n\
    \    if (fd == -1) {\n        perror(\"open\");\n        return 1;\n    }\n  \
    \  // use the file descriptor...\n    close(fd);\n    return 0;\n}\n```\n\nIn\
    \ this example, the program opens the file \"test.txt\" using the O_RDWR and O_CREAT\
    \ flags to indicate that the file should be opened for reading and writing and\
    \ created if it doesn't already exist. The file permissions are set to 0644, which\
    \ allows the owner to read and write the file and everyone else to only read it.\
    \ If the open() function returns -1, an error has occurred, and the program prints\
    \ an error message using perror(). Finally, the program closes the file using\
    \ close().\n\n+   - Reading from a file: To read a file using the read() function,\
    \ you need to pass in the file descriptor, a buffer to store the data, and the\
    \ number of bytes to read as parameters. Here's an example:\n\n```\n#include <stdio.h>\n\
    #include <fcntl.h>\n#include <unistd.h>\n\nint main() {\n    int fd;\n    char\
    \ buf[1024];\n    fd = open(\"test.txt\", O_RDONLY);\n    if (fd == -1) {\n  \
    \      perror(\"open\");\n        return 1;\n    }\n    int n = read(fd, buf,\
    \ sizeof(buf));\n    if (n == -1) {\n        perror(\"read\");\n        close(fd);\n\
    \        return 1;\n    }\n    // use the data in the buffer...\n    close(fd);\n\
    \    return 0;\n}\n```\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_168_0.png)"
