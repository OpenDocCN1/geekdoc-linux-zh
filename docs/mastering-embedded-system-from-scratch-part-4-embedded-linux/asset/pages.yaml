    # # Thrashing


    Thrashing is a phenomenon that occurs in virtual memory systems the system spends
    more time handling page faults and swapping pages in and out of main memory than
    it does on executing the actual processes. This results in a significant decrease
    in system performance, with processes making slow progress, if any at all.


    Thrashing typically occurs when the available main memory is insufficient to accommodate
    the working sets of all active processes. The working set of a process is the
    set of pages that are currently in or will be used in the near future. When the
    combined working sets of all active processes are too large to fit in main memory,
    the operating system is forced to constantly swap pages in and out leading to
    a high rate of page faults and excessive disk activity.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_68_0.png)


