    * ELF: The Executable and Linkable Format (ELF) is a common object file format
    used on Unix-based systems. ELF files contain information about the machine architecture,
    the entry point for code, and the location of symbols and relocation tables.

    * COFF: The Common Object File Format (COFF) is an object file format used on
    Windows-based systems. COFF files contain similar information to ELF files, including
    architecture, symbol tables, and relocation tables.

    * Mach-O: The Mach-O object file format is used on macOS and iOS systems. Mach-O
    files contain information about the machine architecture, symbol tables, and relocation
    tables.


