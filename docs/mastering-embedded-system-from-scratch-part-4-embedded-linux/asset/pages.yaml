  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\nOverall, composite commands\
    \ are powerful tools that can be used to simplify complex tasks and automate frequently\
    \ performed tasks. By understanding the different types of composite commands\
    \ and how to use them, you can become more efficient in using the Linux command\
    \ line.\n\n# I/O Redirection with files\n\nIn Linux CLI, I/O redirection is the\
    \ process of redirecting the input or output of a command or to a file or device\
    \ other than the default file or device.\n\n+   * Standard Output Redirection\n\
    \  * $command > file (Redirect Output to file: Overwrite)\n  * $command >> file\
    \ (Redirect Output to file: Append)\n* Standard Error Redirection\n  * $command\
    \ 2> file (Redirect error to file: Overwrite)\n  * $command 2>> file (Redirect\
    \ error to file: Append)\n* Both Output & Error Redirection\n  * $command |& file\
    \ (Redirect output/error to file: Overwrite)\n  * $command &>> file (Redirect\
    \ output/error to file: Append)\n\nThere are three types of I/O redirection: input\
    \ redirection, output redirection, and appending to a file.\n\nInput Redirection:\
    \ Input redirection is used to redirect the input of a command from a file or\
    \ device other than the keyboard. The '>' symbol is used to redirect input.\n\n\
    Example:\n\n```\n$ cat < file.txt\n```\n\nIn the above example, the \"cat\" command\
    \ is used to display the contents of the file.txt file, and the '>' symbol is\
    \ used to redirect the input from the file.txt file.\n\nOutput Redirection: Output\
    \ redirection is used to redirect the output of a command to a file or device\
    \ other than the terminal. The '>' symbol is used to redirect output.\n\nExample:\n\
    \n```\n$ ls > files.txt\n```\n\nIn the above example, the \"ls\" command is used\
    \ to list the files in the current directory, and the '>' symbol is used to redirect\
    \ the output to the file.txt file.\n\nAppending to a file: Appending to a file\
    \ is used to add output to the end of a file without overwriting the existing\
    \ contents of the file. The '>>' symbol is used for appending.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_211_0.png)"
  merge: -1
