    is part of the system memory address space. In this approach, the I/O device''s
    registers are mapped into a physical address space, and the device is treated
    as if it were another memory location.


    With memory-mapped I/O, any machine instruction can be encoded to transfer data
    between a memory location and the processor or between two memory locations potentially
    be used to access the I/O device. This means that the same instructions that are
    used for regular memory access, as load and store instructions, can be used to
    access the I/O device.


    Because the I/O address space occupies a range in the system memory address space,
    the registers in the device controller are mapped to a specific range of physical
    memory addresses. The CPU'
