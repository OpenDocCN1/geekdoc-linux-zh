    Virtual memory can be implemented by Demand paging


    virtual memory is commonly implemented using demand paging, a technique that only
    loads pages into memory when they are actually accessed or demanded by the program.
    This allows for efficient memory utilization and enables larger programs to run
    on systems with limited physical memory.


    In a demand paging system, the following steps are involved in the virtual memory
    management process:


    +   1. When a program starts, none of its pages are initially loaded into the
    main memory. The operating system sets up the appropriate page table for the process,
    marking all entries as "not present" or "invalid".

    2. As the program begins to execute, it will generate virtual addresses that may
    not yet have corresponding physical addresses in memory. When the Memory Management
    Unit (MMU) encounters a virtual address with a "not present" or "invalid" page
    table entry, it triggers a page fault.

    3. The operating system handles the page fault by: Determining the location of
    the missing page on secondary storage (e.g., hard disk). Finding a free frame
    in the main memory to load the code. If no free frames are available, selecting
    a victim frame to be replaced according to a page replacement policy (e.g., Least
    Recently Used, First-In, First-Out, Clock, etc.). d. If the victim frame is modified
    (i.e., its contents have been modified), writing its contents back to the secondary
    storage. e. Loading the missing page into the available frame and updating the
    page table to point to the new frame.

    4. Once the missing page has been loaded into memory and the page table has been
    updated, the MMU retrieves the address translation, and the program continues
    execution.


