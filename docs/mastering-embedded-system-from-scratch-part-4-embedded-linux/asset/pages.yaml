  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\nOverall, these interrupt-related\
    \ properties in the DTS syntax provide a flexible and expressive way to describe\
    \ the interrupt configuration of a system, including the interrupt numbers, types,\
    \ controllers, and encoding.\n\n# DEVICE TREE INCLUSION\n\nIn the Device Tree\
    \ Source (DTS) syntax, it is common to include one DTS file within another, typically\
    \ to describe a board or a module that is used in multiple systems. This is done\
    \ using the include statement, which takes a path to the included DTS file as\
    \ argument.\n\n+   * can split in several files, including each other\n* dtsi\
    \ files are included files, .dts files are final Device Trees\n* Typically they\
    \ will contain definition of SoC-level information The\n* dts is include the level\
    \ Including using the DTS operator/include/ or in a few kernel releases, the DTS\
    \ goes through the C preprocessor, so\n* #include-sabresd.dts is recommended.\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_330_0.png)\n\n# e9v3-sabresd.dts example\n\
    \nFor example, suppose we have a DTS file for a board that uses a specific CPU\
    \ and set of devices:\n\n```\n/dts-v1;\n\n/ {\n  model = \"MyBoard\";n  compatible\
    \ = \"vendor,board\";\n\n  cpu {\n    compatible = \"arm,cortex-a9\"\n  }\n\n\
    \  ethernet {\n    compatible = \"vendor,ethernet\"\n    ...\n  }\n\n};\n```\n\
    \nWe can include this DTS file within another DTS file that describes a system\
    \ that uses the board:\n\n```\n/dts-v1;\n\n/ {\n  model = \"MySystem\";n  compatible\
    \ = \"vendor,system\"\n}\n```\n\nPAGE 329 OF 465\nMastering Embedded System from\
    \ Scratch\nCopyright © 2023 - Keroles Khaill, eng.keroles.karam@gmail.com\n\n\
    ![](img/bc86631e65e541c1c58ec0ab72a978e0_330_1.png)"
