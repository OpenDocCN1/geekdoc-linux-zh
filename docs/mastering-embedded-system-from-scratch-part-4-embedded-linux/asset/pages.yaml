  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    1. Types of Environment Variables: U-Boot provides two types of environment variables:
    global and local. Global environment variables are available to all U-Boot commands
    and scripts, while local environment variables are specific to a particular command
    or script.

    2. Examples of Environment Variables: Here are some examples of commonly used
    U-Boot environment variables:


    +   - bootargs: This variable specifies the kernel boot arguments.

    - bootcmd: This variable specifies the command to execute during the boot process.

    - ethaddr: This variable specifies the Ethernet MAC address.

    - ipaddr: This variable specifies the IP address.

    - netmask: This variable specifies the netmask.

    - serverip: This variable specifies the IP address of the TFTP server.


    Modifying Environment Variables: To modify an environment variable, we can use
    the setenv command. For example, to modify the bootargs variable, use the following
    command:


    setenv bootargs ''console=ttyS0,115200 root=/dev/mmcblk0p2 rw`


    This command sets the bootargs to ''console=ttyS0,115200 root=/dev/mmcblk0p2 rw''.


    Saving Environment Variables: After modifying the environment variables, we need
    to save them to non-volatile memory so that they are retained after a system reset.
    To save the environment variables, use the saveenv command. For example, use the
    following command to save the environment variables:


    ```

    saveenv name=value. Here name refers to the name of the environment variable which
    we wish to assign some value.

    This "value" could be of any type: string, hexadecimal, boolean etc. Whatever
    the type of value, it is converted into string before being stored in a linearized
    data block.

    Each environment variable pair ("name=value") would be stored as a null terminated
    string

    ```


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_262_0.png)


    This saves the current environment variables to non-volatile memory.

    Here is a table summarizing the types and examples of U-Boot environment variables:


    | Type | Examples |

    | Global | bootargs, bootcmd, ethaddr, ipaddr, netmask, serverip |

    | Local | None |


