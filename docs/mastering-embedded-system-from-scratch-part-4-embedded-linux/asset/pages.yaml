  md: 'In Socket Programming, there are two types of sockets: stream sockets and datagram
    sockets. Stream sockets provide a reliable, 2-way, connection-based service, whereas
    datagram sockets provide an unreliable, connectionless message service.


    To establish a connection, a client initiates communication with the server by
    calling the connect() function. The server listens for incoming connections on
    a passive socket using the listen() function. When a connection is established,
    the server uses the accept() function to accept the incoming connection.


    To exchange data, the send() and recv() functions are used. The send() function
    sends data over a socket, whereas the recv() function receives data from a socket.
    These functions are blocking, which means they return only after data is sent
    or received.


    In conclusion, Linux Socket Programming is a powerful tool for establishing communication
    between two nodes over a network. It provides a wide range of functions and capabilities
    to developers for building network applications.


