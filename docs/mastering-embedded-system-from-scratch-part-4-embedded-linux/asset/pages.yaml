  md: '# Buddy system


    The buddy system is a memory allocation technique used in Linux to allocate physical
    memory as a page unit. It divides physical memory into chunks of a power of 2
    size and maintains a list of free pages for each order of size. When a memory
    request is received, the system searches the appropriate free list for the smallest
    available chunk that can fulfill the request. If there is no such chunk, it merges
    two free chunks of the same size until a large enough chunk is available.


    For example, we have a total of 16 pages of physically contiguous memory, and
    we get a request for 4 pages. The system will divide the 16 pages into two chunks
    of 8 pages each. Then it will divide one of the 8-page chunks into two 4-page
    chunks, and allocate one of those 4-page chunks to fulfill the request. The remaining
    4-page chunk will be added to the list of free pages for future requests.


    This technique helps to reduce fragmentation, as it allocates physically contiguous
    pages to fulfill a request. Additionally, by maintaining lists of free pages for
    different orders of size, the system can quickly search for the smallest available
    chunk to fulfill a request, reducing the management load.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_140_0.png)


    # PROGRAM IMAGE AND VIRTUAL MEMORY


    In Linux, a source code file is compiled, it creates an executable file called
    aout. This executable file is built in a format called ELF (Executable and Linkable
    Format), which contains the program image as a segment unit. The program image
    consists of several segments, such as text, data, symbol table, and so on. Each
    segment has a specific purpose and contains a specific type of information.


    The text segment contains the executable code of the program, which is read-only
    and can''t be modified during the program''s execution. The data segment contains
    the program''s initialized and uninitialized data, such as global and static variables.
    The symbol table contains information about the program''s symbols, such as function
    names, variable names, and addresses.'
