    # STATIC TASK PRIORITIZATION


    static task prioritization in Linux:


    +   - The nice value is set using the `nice` or `renice` commands in the terminal,
    or through the `setpriority` system call in C/C++.

    - The default value is 0, which means normal priority.

    - The real-time priority range (0-99) is reserved for processes that require time-critical
    processing, such as multimedia applications or industrial control systems. These
    processes can preempt other processes in the system and have guaranteed access
    to the CPU.

    - The user task priority range (0-139) is used for regular processes, such as
    user applications or system daemons. These processes are scheduled using a time-sharing
    algorithm, where each process is given a timeslice before being preempted and
    another process is given a chance to run.

    - In static priority, Linux also supports dynamic priority adjustments based on
    a process''s CPU usage. This is implemented through the Completely Fair Scheduler
    (CFFS) algorithm, which adjusts the timeslice of each process based on its priority
    level and recent usage.


    +   - Tasks have a static priority, often called a nice value.

    - On Linux, nice values range from -20 to 19, with higher values being lower priority

    - The lower a process value, the higher its priority and the longer it runs.

    - It divides the ready queue into multiple queues according to priority

    - 0-99: real time processes

    - 100-139: User task priority for non real time processes

    - Tasks at the same priority are round-robin.


    | Static Priority | Nice | Quantum |

    |---|---|--|

    | Real-time | 0-99 | - | - |

    | High Priority | -20 to -1 | - | 5ms |

    | Normal Priority | 0 to 19 | - | 8ms |

    | Low Priority | 20 to 139 | - | 20ms |


    # O(1) SCHEDULER


    The O(1) scheduler is a scheduling algorithm used in the Linux kernel to improve
    performance over the previous scheduling algorithms. Here are some key points
    about the O(1) scheduler:


    +   - Active Array: The O(1) scheduler maintains an active array, which is a list
    of processes that have a time slice remaining to execute. This list is ordered
    by the priority of the process, with the highest priority process at the beginning
    of the list.


