  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    +   - The virtual runtime is divided by the nice value (priority) of the process
    to get a fair share of CPU time.


    +   3. CFS calculates the weight of each process.

    - The weight is a measure of how much CPU time a process should get relative to
    other processes.

    - The weight is calculated using the formula: weight = (1 / sqrt(1 + load_avg))

    - The load_avg is the average number of processes in the runqueue over a period
    of time.


    +   4. CFS selects the process with the lowest virtual runtime to run next.

    - This ensures that the process that has been waiting the longest gets to run
    next.

    - The time quantum is calculated dynamically based on the number of processes
    in the system.


    Example: Suppose there are three processes A, B, and C. Their nice values are
    0, 5, and 10, respectively. The current load_avg is 20.0. The weights of these
    processes are calculated as follows:


    +   - A: (1 / sqrt(1+2.0)) * 1 = 0.45

    - B: (1 / sqrt(1+2.0)) * 6 = 2.69

    - C: (1 / sqrt(1+2.0)) * 11 = 4.16


    In this example, C has the highest weight, so it will get the most CPU time. Process
    A has the lowest weight, so it will get the least CPU time. However, because C
    has a higher nice value, it will still get less CPU time than B, though its weight
    is higher.


    Overall, CFS aims to provide fairness to all processes in the system, while taking
    into account their priority and resource needs.


    +   - Since kernel 2.6.23, O(1) algorithm is replaced by CFS algorithm

    - In O(log N) algorithm time slice is assigned based on priority



    However there are some problems in this method:


    +   - For example there are two processes with priority 120 and 121 respectively.

    - The time slice of 10ms and 5ms are assigned respectively based on priority 5.

    - The difference in the time slice between the two processes and their priority
    difference is 1.


    | process 1 | process 2 | time slice |

    |---|---|---|

    | priority(120) | priority(121) | 100ms, 95ms |

    | priority(138) | priority(139) | 10ms, 5ms |


    +   - In this case time slice of the two processes are 10 and 5 respectively and
    the difference in the time slice is 5.


    +   - The difference of 5 ms is relatively two times of the other.


    +   - In CFS:


    +   - It assigns time slice based on weight to solve this problem.

    - It assigns relative time slice based on predefined weight by priority predefined
    time slice on priority.


