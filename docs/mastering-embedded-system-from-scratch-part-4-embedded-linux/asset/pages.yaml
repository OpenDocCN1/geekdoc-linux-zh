    # SUBSYSTEM INITIALIZATION


    The subsystem initialization is a critical step in the Linux kernel start-up process,
    and is responsible for initializing the core components of the operating system,
    such as the memory manager, scheduler, and virtual file system (VFS).


    As mentioned, most of the subsystem initialization is performed in the start_kernel()
    function, which is responsible for initializing the kernel and setting up the
    basic components for the system to run. This includes initializing the scheduler,
    setting up the memory manager, initializing the VFS, and other key subsystems.


    Once the start_kernel() function has completed its initialization tasks, it creates
    a new process called the init process, which is responsible for further initialization,
    including driver initialization, running itcalls, mounting the root file system,
    and jumping to user space.


    The init process is the first user-level process started by the kernel, and is
    assigned process ID 1. It is responsible for starting all other user-level processes,
    and is typically implemented as a shell script that runs various initialization
    scripts and sets up the system environment.'
