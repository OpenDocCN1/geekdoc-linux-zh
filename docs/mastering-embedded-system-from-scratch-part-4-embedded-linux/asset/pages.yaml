  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    The uart node represents the UART device, with a name of serial@80000000. The
    compatible property indicates that the device is compatible with the NS16550A
    UART controller. The reg property specifies the base address and size of device''s
    memory-mapped registers, and the interrupts property specifies the interrupt number
    for the device. Finally, the clock-frequency property specifies the frequency
    of the device''s clock signal.


    Overall, the device tree is a powerful mechanism for describing the hardware configuration
    of a system in a platform-independent manner, and is a key component of the Linux
    kernel''s device driver infrastructure.


    # BOOTING WITH A DEVICE TREE


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_316_0.png)


    +   * Some bootloaders have no specific support for the Device Tree

    * To solve this issue you can append device tree to the zimage by CONFIG_ARM_APPENDED_DTB.

    * It tells the kernel to look for a DTB right after the kernel image

    * `make arch/arm/images/zimage/my/board.dtb-my-image`

    * `make my-zimage-my-image`


    When booting a Linux kernel on an ARM-based system using a bootloader that has
    no specific support for the Device Tree, the Device Tree can be appended to the
    kernel image itself to provide the necessary hardware configuration information
    to the kernel.


    To append the Device Tree to the kernel image, the CONFIG_ARM_APPENDED_DTB option
    can be used. This option tells the kernel to look for the Device Tree right after
    the kernel image. Here are the steps to append the Device Tree to the kernel:


    +   1. Create a Device Tree source file (usually with a .dtts extension) that
    describes the hardware configuration of the system.

    2. Compile the Device Tree source file using the Device Tree Compiler (DTC) to
    generate a Device Blob (DTB) file.

    3. Combine the kernel image and the DTB file into a single file using the cat
    command. For example:

    4. cat arch/arm/boot/zimage arm/boot/dt/myboard.dtb > my-zimage

    5. Create a boot image from the compiled file using a tool such as mkimage. For
    example:

    6. mkimage -A arm -O linux -T kernel -C none -a 0x80080000 -e 0x80080000 -n "My
    Linux Kernel" my-zimage-my-image


    In this example, the mkimage tool creates a bootable image (my-uImage) from the
    combined kernel image and DTB file (my-zImage). The -A, -O, and -T options specify
    the


