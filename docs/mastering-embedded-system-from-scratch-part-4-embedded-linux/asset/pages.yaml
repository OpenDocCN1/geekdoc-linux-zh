  md: '# Comparison - Memory-mapped vs port-mapped


    | Memory-mapped IO | Port-mapped IO |

    |---|--|

    | Same address bus to address memory and I/O devices | Different address spaces
    for memory and I/O devices |

    | Access to the I/O devices using regular instructions | Uses a special class
    of CPU instructions to access I/O devices |

    | Most widely used I/O method | x86 Intel microprocessors - IN and OUT instructions
    |


    Memory-mapped I/O and port-mapped I/O are two different techniques to access I/O
    devices in computer systems. They differ in the way they map I/O devices to the
    system address space and how the CPU interacts with the I/O device.


    Memory-mapped I/O maps the I/O device''s registers to a specific range of memory
    addresses in the system''s memory address space. This means that the I/O device
    is treated as if it were another memory location, and the CPU can use standard
    memory access instructions to interact with the I/O device''s registers. Memory-mapped
    I/O provides a simple and efficient way to access I/O devices, but it can consume
    valuable memory address space and make it difficult to distinguish between memory
    addresses and I/O addresses.


    Port-mapped I/O, on the other hand, uses a separate address space for I/O devices.
    The I/O device''s address is referred to as the port number, and special processor
    instructions are used to transfer data between the I/O device and a microprocessor
    register or memory. Port-mapped I/O provides a clear separation between memory
    addresses and I/O device addresses, but it requires special instructions to access
    the I/O device and can be slower than memory-mapped I/O.


    In summary, memory-mapped I/O and port-mapped I/O are two different approaches
    to access I/O devices in computer systems. Memory-mapped I/O maps the I/O device''s
    registers to a specific range of memory addresses, while port-mapped I/O uses
    a separate address space for I/O devices. Both approaches have their advantages
    and disadvantages, and the choice of which to use depends on the specific needs
    and constraints of the system.


    # DMA Direct Memory Access


    Direct Memory Access (DMA) is a technique used to improve the efficiency of data
    transfers between I/O devices and memory in computer systems. It is used to avoid
    programmed I/O for large data movement, which can become very heavy on the CPU.


    When I/O devices need to transfer a large amount of data, such as copying data
    to or from disks, the CPU can become overloaded with the task of managing the
    data transfer. This is'
