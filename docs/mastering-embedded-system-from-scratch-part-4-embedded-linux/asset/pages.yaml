    \ in Linux contains the page tables and other information about the virtual address\
    \ space of a process. When a process is created, its mm_struct is initialized\
    \ with a set of page tables that map the process's virtual address space to physical\
    \ memory.\n\nWhen a process accesses memory, the CPU translates the virtual address\
    \ to a physical address using the page tables in the mm_struct. If the page table\
    \ entry for the virtual page is not present in memory, a page fault occurs, and\
    \ the operating system loads the page from disk memory into physical memory and\
    \ updates the page table entry. The modern processor has hardware to assist to\
    \ translate virtual address to physical address.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_99_1.png)"
