    myboard.dtsi\"\n};\n```\n\nThe include statement causes the contents of the myboard.dtsi\
    \ file to be included within the myboard node.\n\nBy using DTS inclusion, we can\
    \ create a modular and reusable description of a system that can be adapted to\
    \ different hardware configurations and use cases."
