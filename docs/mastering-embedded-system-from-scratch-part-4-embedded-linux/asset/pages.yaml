  md: '# # Ch13. Part5 - Cross-compiling toolchains


    # ## tool-chain


    In software development, a toolchain is a set of tools used to create, test, and
    deploy software. A toolchain typically includes a compiler, a linker, a debugger,
    and other tools needed to create software for a particular platform or architecture.
    In this context, there are two types of toolchains: native toolchains and cross-compiling
    toolchains.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_220_0.png)


    +   * The toolchain consists of a compiler, assembler, linker, debugger, libraries
    and a number of helper programs.

    * By default the host Pc (Ubuntu, redhat, etc) contain some development tools
    which are called as native toolchain

    * Toolchain Components:


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_220_1.png)


    +   1. Native Toolchain: A native toolchain is a set of tools used to build software
    on the same platform where the software will run. For example, if you are building
    software on a computer running Linux to run on that same, you would use a native
    toolchain for Linux. The generated code will be for the same architecture as the
    host machine.

    2. Cross-Compiling Toolchain: A cross-compiling toolchain is a set of tools used
    to build software on one platform or architecture that will run on a different
    platform or architecture. For example, if you are building software on a computer
    running Linux on an embedded device that uses an ARM processor, you would use
    a cross-compiling toolchain for ARM. The generated code will be for the target
    architecture, not the host machine.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_220_2.png)


    Cross-compiling toolchains are especially useful in embedded systems development,
    where the target devices may have limited resources and run on different architectures
    than the development machine. By using a cross-compiling toolchain, developers
    can create software that is optimized for the target device''s architecture and
    uses fewer resources.'
