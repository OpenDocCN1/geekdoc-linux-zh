    # Initialization of exceptions — the trap_init() function


    The trap_init() function is responsible for initializing the exception handling
    subsystem of the kernel, which includes the handling of hardware interrupts, exceptions,
    and system calls.


    The trap_init() function is called by the start_kernel() function during the kernel
    initialization process, after the architecture-specific initialization tasks have
    been completed by the setup_arch() function.


    Here are some of the tasks that trap_init() function typically performs:


    +   * Initializes the interrupt handling subsystem, which includes setting up
    interrupt vectors, registering interrupt handlers, and enabling interrupts.

    * Initializes the exception handling subsystem, which includes setting up exception
    vectors, registering exception handlers, and enabling exceptions.


