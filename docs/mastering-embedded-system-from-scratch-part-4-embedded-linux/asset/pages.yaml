    # U-Boot Environment Variables


    U-Boot is a powerful bootloader that provides a range of environment variables
    that can be used to customize its behavior. These variables can be used to configure
    boot options, network settings, and other system parameters. In this article,
    we will discuss U-Boot environment variables, their types, examples, and how to
    modify and save them.


    +   - U-Boot can be configured through environment variables

    - Some specific environment variables affect the behavior of the commands.

    - Custom environment variables can be added, and used in scripts.

    - Environment variables are loaded from (flash or in MMC storage) according to
    uboot configuration to RAM at U-Boot startup, can be modified and saved back to
    (flash or in MMC storage) for saving.


