    # # How to Read diff Output


    The diff command is used to compare two files by line and show the differences
    between them. The output of the diff command is displayed in a specific format
    that can be difficult to understand at first glance. In this explanation, we will
    discuss how to read the output of the diff command.


    The basic format of the diff command output is:


    ```

    < line from file 1

    > line from file 2

    ```


    This format is used to indicate the differences between two files. The "<" character
    indicates the line from file 1, and the ">" character indicates the line from
    file 2.


    There are several variations of the diff command output. The most common variations
    are discussed below:


    +   1. If a line is present in file 1 and not in file 2, the "<" character is
    used to indicate the line file 1, and a blank space is used to indicate the absence
    of the line in file 2. Example:


    * This line is present in file 1 only.


    +   1. If a line is present in file 2 and not in file 1, the ">" character is
    used to indicate the line file 2, and a blank space is used to indicate the absence
    of the line in file 1. Example:


    * This line is present in file 2 only.


    +   1. If a line is present in both files, but with different content, the "<"
    character is used to indicate the line from file 1, and the ">" character is used
    to indicate the line from file 2. Example:


    * This line is present in both files, but the content is different in file 1.

    > This line is present in both files, but the content is different in file 2.


    +   1. If a line is present in both files with the same content, no "<" or ">"
    is used to indicate the line from file 1. Example:


