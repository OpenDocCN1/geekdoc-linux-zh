    The IN and OUT instructions are examples of special processor instructions provided
    by Intel processors to transfer data between I/O devices and microprocessor registers
    or memory. The IN instruction reads a byte or word from an I/O port into a register,
    while the OUT instruction writes a byte or word from a register to an I/O port.


