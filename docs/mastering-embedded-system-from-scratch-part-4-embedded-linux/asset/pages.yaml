  md: '# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX


    In a system using segmentation, a segment table is maintained for each process.
    The segment table contains information about each segment, including:


    +   - Base: The starting physical address where the segment resides in memory.

    - Limit: The length of the segment, specifying its size.


    Two registers are used to manage the segment table:


    +   - Segment-table base register (STBR): This register holds the memory address
    where the segment table is located. The operating system sets the STBR to point
    to the appropriate table for each process as it is scheduled to run.

    - Segment-table length register (STLR): This register stores the number of segments
    used by a program. Segment number ''s'' is considered legal if ''s'' is less than
    the value stored in the STLR.


    When a process accesses a memory location, it uses a logical address consisting
    of two parts:


    +   - Segment number (s): This part is used as an index into the segment table
    to find the corresponding base and limit values for the segment.

    - Offset (o): This part represents the offset within the segment, specifying the
    distance from the base address of the segment.


    During translation, the segment is checked against the STLR to ensure it is a
    legal segment. Then, the offset is checked against the limit to ensure the access
    is within the segment boundaries. If both checks pass, the physical address is
    calculated as the sum of the base address and the offset.


    In summary, segmentation is a memory management technique that divides a program
    into logical units segments. This approach provides a more intuitive organization
    of memory, as well as improved memory protection and sharing capabilities. The
    segment table, along with the STBR and STLR registers, play a crucial role in
    managing and translating segment memory addresses.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_50_0.png)


    # Address translation with segmentation architecture


    In a segmentation architecture, the memory management system translates logical
    addresses generated by the CPU into physical addresses that correspond to actual
    locations in memory. The address translation process in segmentation architecture
    involves the following steps:


