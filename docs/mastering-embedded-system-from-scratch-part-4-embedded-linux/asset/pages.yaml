    # Mounting Root File System


    Once the initialization of the subsystems and drivers is complete, the next step
    is to mount the root file system. The root file system is mounted in the root
    directory of the file system hierarchy.


    The kernel needs to know the location and the type of the root file system. This
    information is typically passed through the bootloader or the kernel command line.


    The mount_root() function is called from the init/main.c file, which mounts the
    root file system. It uses the information passed in the kernel command line to
    identify the root file system. If the root file system is not found, then the
    kernel will go into panic mode.


    Once the root file system is mounted, the init process continues with the system
    initialization, which includes executing the init scripts, starting system services,
    and launching daemons.


