  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    The init process follows a specific sequence of steps to initialize the system
    and start all other processes. These steps include:


    +   1. Running system firmware and bootloader: The first step in the init process
    is to run the system firmware and bootloader. This is done by the hardware on
    the system and is outside the scope of the Linux operating system.

    2. Starting kernel: The next step is to start the Linux kernel. This is done by
    the bootloader, which loads the kernel into memory and starts.

    3. Running init: Once the kernel is started, the init process is started as the
    first user-space process. The init process is responsible for starting all processes
    on the system.

    4. Mounting the root file system: The init process mounts the root system, which
    contains all of the files and directories needed to run the system. The root file
    system can be mounted from a local disk or a network file system.

    5. Running system initialization scripts: The init process runs a set of system
    initialization scripts, which configure the system and start other services. These
    scripts are usually located in the "etc/init.d" directory.

    6. Starting system services: The initialization scripts start the system services,
    which are the background processes that provide various system functions. These
    services include network services, system logging, and device drivers.

    7. Starting the login manager: The final step in the init process is to start
    the login manager, which provides a graphical login screen for users to log into
    the system.


    Overall, the init process is an essential part of the Linux boot sequence and
    is responsible for initializing the system and starting all processes on the system.


    +   There are many possible implementations of init


    | Metric | BusyBox init | System V init | systemd |

    |---|---|---|--|

    | Complexity | Low | Medium | High |

    | Boot-up speed | Fast | Slow | Medium |

    | Required shell | ash | sh or bash | None |


    +   init manages the lifecycle of the system from boot up to shutdown


    +   The most used in embedded linux is BusyBox init


