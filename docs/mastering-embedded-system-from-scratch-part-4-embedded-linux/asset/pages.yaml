    # SYSTOOL UTILITY


    The sysfs filesystem provides a wealth of information about the system devices
    and their characteristics. The sysctl utility is a command-line tool that can
    be used to retrieve this information from sysfs.


    sysctl provides a unified view of the device information available in the kernel,
    and it can be used to display a range of information, such as device name, driver
    name, vendor and device IDs, IRQs, and much more.


    Some examples of sysctl usage include:


    +   - Listing all devices and their attributes: sysctl -m MODULE_NAME -av

    - Displaying detailed information about a specific device: sysctl -c DEVICE_CLASS
    -v DEVICE_NAME

    - Showing device IRQ information: sysctl -m MODULE_NAME -v -d DEVICE_NAME


    Here is an example of the sysctl command for a network interface:


    ```

    # sysctl -c net -v -d eth0

    Class = "net"

    Class Device = "eth0"

    Device = "eth0"

    Driver = "tg33"

    Module = "tg33"

    Physical Port ID = "0"

    ```


