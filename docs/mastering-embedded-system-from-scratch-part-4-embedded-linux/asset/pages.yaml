  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    Bool options are binary options that can have only two values: true (y) or false
    (n). Setting a bool option to true includes the corresponding feature in the kernel,
    while setting it to false excludes the feature from the kernel.


    Example:


    ```

    CONFIG_NETFILTER: bool "Network packet filtering framework (Netfilter)"

    ```


    +   - Trisate options


    Tristate options can have three possible values: true (y), module (m), or false
    (n). Setting a tristate option to true includes the corresponding feature directly
    in the kernel image, setting it to module compiles the feature as a loadable kernel
    module, and setting it to false excludes the feature from the kernel.


    Example:


    +   - Int options


    Int options accept integer values as input. These options are used when a numerical
    value is required, such as specifying the maximum number of supported processors
    or the default I/O scheduler.


    Example:


    +   - Hex options


    Hex options accept hexadecimal values as input. These options are typically used
    for specifying memory addresses, hardware registers, or other values that are
    more conveniently expressed in hexadecimal notation.


    Example:


    +   - String options


    String options accept string values as input. These options are used when a textual
    value is required, such as specifying a kernel command line, a default hostname,
    or a cryptographic key.


    Example:


    ```

    CONFIG_CMDLINE: string "Default kernel command string"

    ```


