    # Common Devices for Redirection


    In Linux, everything is treated as a file. The standard input (stdin), standard
    output (stdout), and standard error (stderr) are also files, but with a fixed
    file descriptor number. These file descriptors are used for redirection. Here
    are some common devices for redirection:


    +   - /dev/null: This device discards all data written to and returns EOF when
    read. It is often used to discard the output of a command or to create an empty
    file.


    Example: ls /some/non-existent/directory 2>/dev/null


    In this example, the ls command will be discarded and no error message will be
    displayed, as stderr is redirected to /dev/null.


    +   - /dev/tty: This device refers to the current device. It can be used to send
    input to the terminal or to display output on the terminal.


    Example: echo "Enter your name: " > /dev/tty read name < /dev/tty


    In this example, the prompt "Enter your name: " will be displayed on the terminal
    and the user''s input will be read from the terminal.


    +   - /dev/random and /dev/urandom: These devices provide a stream of random numbers.
    /dev/random provides a more secure stream, but may block if there is not enough
    entropy available, while /dev/urandom will never block.'
