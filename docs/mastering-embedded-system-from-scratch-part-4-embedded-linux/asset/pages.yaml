- img_proc: true
  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    6. From memory (intramfs): In some cases, a pre-loaded filesystem can be stored
    in memory

    and used as the root filesystem. This is often done for embedded systems that
    have limited

    storage capacity.


    The location of the root filesystem is specified at boot time by the kernel parameter
    "root=". This would

    parameter tells the kernel where to find the root filesystem. For example, "root=/dev/sda"
    would tell

    the kernel to mount the root filesystem from the first partition on the hard disk.
    The exact syntax

    of the "root" parameter will vary depending on the storage device and partition
    that the root

    filesystem is located on.


    Overall, the choice of where to mount the root filesystem is an important decision
    that can affect the

    performance, reliability, and security of the system. It is important for system
    designers to carefully

    consider the options available and choose the one that best fits the needs of
    their system.


    +   * It can be mounted from different locations

    * From the partition of a hard disk

    * From the partition of a USB key

    * From the partition of a SD card

    * From the partition of a NAND flash chip or similar type of storage device

    * From the network, using the NFS protocol

    * From memory (intramfs), using a preloaded filesystem (by the bootrd)

    * It is up to the system designer to choose the configuration for the system,
    and configure the kernel behavior with root:


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_355_0.png)


    # File System Contents


    The Linux file system is organized hierarchically, with the root directory being
    the top-level directory in the file system. The contents of the file system are
    structured into various directories and subdirectories, with each directory serving
    a specific purpose. Here are some of the most important directories and their
    contents:


    +   1. /bin - Contains essential binaries that are required to boot the system
    and for everyday use, such as the ls command and the bash shell.


    +   * Place for most commonly used terminal commands

    * Common Linux commands you need to use in single-user modes are located under
    this directory.

    * Commands used by all the users of the system are located here:

    Examples:

    * ls

    * ping

    * grep

    * cp


