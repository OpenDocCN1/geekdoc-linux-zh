    # STATIC TASK PRIORITIZATION


    static task prioritization in Linux:


    +   * The nice value is set using the nice or renice commands in the terminal,
    or through the setpriority system call in C/C++ code.

    * The default nice value is 0, which means normal priority.

    * The real-time priority range (0-99) is reserved for processes that require time-critical
    processing, such as multimedia applications or industrial control systems. These
    processes can preempt other processes in the system and have guaranteed access
    to the CPU.

    * The user task priority range (100-139) is used for regular processes, such as
    user applications or system daemons. These processes are scheduled using a time-sharing
    algorithm, where each process is given a slice to run before being preempted and
    another process is given a chance to run.

    * In addition to static priority, Linux also supports dynamic priority adjustments
    based on a process''s recent CPU usage. This is implemented through the Completely
    Fair Sharing (CFS) algorithm, which adjusts the times of each process based on
    its priority level and recent resource usage.


    +   * All tasks have a static priority, often called a nice value.

    * On Linux, nice values range from -20 to 19, with higher values being lower priority

    * The lower the nice value, the higher its priority

    * It divides the ready queue into multiple queues according to priority

    * 100-139: User task priority for non-real time processes

    * Tasks with the same priority are round-robin.


    | Static Priority | Class | Quantum |

    |---|---|---||

    | Real-time | 0-99 | - | - |

    | Normal | 100-139 | CFS | (140-SP) * SP / SP >= 120 |

    | Idle | 140-139 | CFS | (140-SP) / SP >= 120 |


    # O(1) SCHEDULER


    The O(1) scheduler is a scheduling algorithm in the Linux kernel to improve performance
    over the previous scheduling algorithms. Here are some key points about the O(1)
    scheduler:


    +   1. Active Array: The O(1) scheduler maintains an active array, which is a
    list of processes that have a time slice to execute. This list is ordered by the
    priority of the process, with the highest priority process at the beginning of
    the list.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_92_0.png)'
