    \ address 11011010101 (in binary) or 13,313 (in decimal) is translated to the\
    \ physical memory address 9505 (in decimal).\n\n# HOW TO DO A PAGE LOOKUP\n\n\
    A page table lookup is a process used by the Memory Management Unit (MMU) to translate\
    \ a logical address generated by the CPU into a physical memory address. The following\
    \ steps describe how to perform a page table lookup:\n\n+   1. Divide the logical\
    \ address into two parts: the page number (p) and the page offset (d). The page\
    \ number is used to index the page table, while the page offset specifies the\
    \ byte location within the page.\n2. Access the page table using the page number\
    \ as the index. The page table is an array that contains the base addresses (also\
    \ known as frame numbers) of each page in physical memory. Each entry in the page\
    \ table corresponds to a page in the logical address space.\n3. Retrieve the base\
    \ address (frame number) of the physical memory from the page table corresponding\
    \ to the given page number. This base address represents the starting address\
    \ of the physical memory frame where it is located\n4. Combine the base address\
    \ (frame number) with the page offset (d) to calculate the physical memory address.\
    \ This is done by adding the page offset to the base address.\n5. The resulting\
    \ physical memory address is then used to access the desired data or instruction\
    \ in the physical memory.\n\nIt is important to note that modern operating systems\
    \ often use multi-level page tables to handle address spaces efficiently. In such\
    \ cases, the process of a page table lookup may involve traversing multiple levels\
    \ of the page table hierarchy before reaching the final page table entry containing\
    \ the base address (frame number).\n\nPAGE 36 OF 465 Mastering Embedded System\
