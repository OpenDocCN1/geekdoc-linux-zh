    # # Booting Sequence Examples


    Booting sequence refers to the process of starting up a computer and loading the
    operating system into memory. The process varies depending on the hardware platform
    and the type of bootloader used. In this article, we will discuss the boot sequence
    examples for different platforms.


    +   1. x86 Booting Sequence: On x86 processors, the booting sequence typically
    starts with a BIOS (Basic Input/Output System) program stored in non-volatile
    memory. The BIOS is responsible for basic hardware initialization and loading
    a small piece of code from non-volatile storage, typically a 1st stage bootloader.
    The 1st stage bootloader can understand filesystem formats and load the kernel
    file directly from a normal filesystem. One of the most famous/powerful bootloaders
    for x86 is GRUB (Grand Unified Bootloader).

    2. Rom Booting Sequence: Rom Code is a bootloader used in embedded systems. It
    tries to find a valid bootstrap image from various sources and load it into SRAM
    (DRAM not yet). The size is limited to 4 KB, and no user interaction is possible
    in standard boot mode.

    3. AT91Bootstrap Sequence: AT91Bootstrap is a bootloader used in embedded systems
    that run on ARM-based processors. It runs from SRAM and initializes the DRAM,
    NAND or SPI controller, and loads the secondary bootloader into RAM and starts
    it. No user interaction is possible at this stage.

    4. U-Boot Booting Sequence: U-Boot is a popular bootloader used in embedded systems
    that run on various processors. It runs from RAM and initializes some hardware
    devices (network, USB, etc.). It loads the kernel image from network to RAM and
    starts it. A shell with commands is provided, allowing the user to interact with
    the bootloader.

    5. Linux Booting Sequence: The Linux kernel is the final stage of the booting
    sequence. It runs from RAM and over the system completely. The bootloader no longer
    exists


