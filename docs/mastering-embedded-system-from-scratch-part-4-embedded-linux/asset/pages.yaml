  md: "# 13. INTRODUCTION TO EMBEDDED LINUX\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_332_0.png)\n\
    \n# Linux Start-Up Sequence\n\n+   * Boot loader:\n  * Typically this stage does\
    \ the hardware initialization and testing, loads the kernel image, and transfers\
    \ control to the Linux kernel.\n* Kernel initialization phase:\n  * This stage\
    \ does the platform-specific initialization, brings up the kernel subsystems,\
    \ turns on multitasking, mounts the root file system, and jumps to user space\n\
    * User- space initialization phase:\n  * Typically this phase brings up the services,\
    \ does network initialization, and then issues a log-prompt.\n\n# BOOT LOADER\
    \ PHASE\n\n+   * Hardware Initialization This typically includes:\n  * Configuring\
    \ the CPU speed\n  * Memory initialization, such as setting up the registers,\
    \ clearing the memory, and determining the size of the onboard memory\n  * Turning\
    \ on the caches\n  * Setting up the serial port for the boot console\n\nPAGE 331\
    \ OF 465\nMastering Embedded System from Scratch\nCopyright © 2023 - Keif Khalili,\
    \ eng.keroles.karam@gmail.com"
  merge: -1
  pgno: 332
- img_proc: true
  md: "# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX\n\n+   - Once the above steps\
    \ are completed successfully, the next step is loading the Linux kernel.\n\n+\
    \   - Downloading Kernel Image and Ram Disk\n  - The boot loader needs to locate\
    \ the kernel image, which may be on the system flash or network.\n  - In the case\
    \ it is compressed (which often is the case), the image needs to be decompressed.\n\
    \  - Also if an initial ram disk is present, the boot loader needs to load the\
    \ image of the initial ram disk to the memory.\n\n+   - Setting Arguments\n  -\
    \ Argument passing is a very powerful option supported by the Linux kernel. Linux\
    \ provides a generic way to pass arguments to the kernel across all platforms\n\
    \  - To set kernel argument using next string:\n    - setenv bootargs 'console=ttyS0,115200n8\
    \ root=/dev/mmblk0p2 roottype=ext2 rw' You can see next:\n      - console kernel\
    \ settings 115200n8 and ttyS0 (can be ttyS2 in case on screen)\n      - Root fs0\
    \ path to SD /dev/mmblk0p2, filetype ext2 (can be ext3) privileges read and write\n\
    \n+   - Jumping to Kernel Entry Point\n  - The kernel entry point is decided by\
    \ the linker script when building the kernel\n\n# KERNEL START-UP\n\nThe Linux\
    \ kernel start-up process can be roughly divided into the following phases:\n\n\
    +   1. CPU/Platform-Specific Initialization: This phase includes architecture-specific\
    \ initialization code that sets up the CPU, memory management, interrupt handling,\
    \ and other low-level hardware details.\n2. Subsystem Initialization: In this\
    \ phase, the kernel initializes various subsystems, such as the scheduler, virtual\
    \ memory manager, file system, networking, and input/output (I/O) subsystems.\
    \ This involves allocating memory, initializing data structures, and setting up\
    \ the relevant hardware.\n3. Driver Initialization: Once the subsystems are initialized,\
    \ the kernel probes for initializes drivers for the hardware components. This\
    \ involves identifying the hardware, allocating resources, and registering the\
    \ drivers with the relevant subsystems.\n4. Mounting Root File System: After the\
    \ drivers are initialized, the kernel mounts the root file system, which contains\
    \ the essential files and directories required for the system to function.\n5.\
    \ Moving to User Space: Finally, the kernel handles control over to the user space,\
    \ which typically starting the init process, which is responsible for starting\
    \ user space daemons and services.\n\nOverall, the Linux kernel start-up process\
    \ is a complex and multi-stage process that involves initializing the hardware,\
    \ setting up the subsystems, and loading the drivers and file systems, before\
    \ finally handing over control to the user space.\n\nPAGE 332 OF 465\nMastering\
    \ Embedded System from Scratch\nCopyright © 2023 - Keroles Khalil, eng.keroles.karam@gmail.com\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_333_0.png)"
