  md: 'When a process is created using fork(), two processes are created: the parent
    process and the child process. These processes are similar but have a few key
    differences. Here are some differences between parent and child processes:


    +   1. Process ID (PID): The parent process has a PID that is different from the
    PID of the child process. The PID of the parent process remains the same, while
    the PID of the child process is a unique identifier assigned by the operating
    system.

    2. Memory space: When a child process is created, it gets an exact copy of the
    parent process''s memory space. However, the child process has its own memory
    space, which means that changes made in the child process''s memory space do not
    affect the parent process''s memory space.

    3. Return value of fork(): After fork() is called, the return value in the parent
    process is the PID of the child process, while the return value in the child process
    is 0. This allows the parent and child processes to distinguish themselves from
    each other.

    4. Execution: The parent process and the child process execute independently of
    each other. This means that they can run different parts of the same program or
    programs altogether.

    5. Process hierarchy: The child process is a new process created by duplicating
    the parent process. This means that the child process is a descendant of the parent
    process in the process hierarchy.


    Here''s a table summarizing the key differences between parent and child processes:


    | Attribute | Parent process | Child process |

    | --- | --- | --- |

    | Process ID (PID) | Unique identifier | Unique identifier |

    | Memory space | Has its own memory space | Gets an exact copy of the parent process''s
    memory space |

    | Return value of fork() | PID of child process | 0 |

    | Execution | Executes independently | Executes independently |

    | Process hierarchy | Parent process is the ancestor | Child process is the descendant
    |


    Examples of using parent and child processes in action include web servers, where
    the parent process listens for incoming requests and swaps child processes to
    handle each request. In this example, the parent process coordinates the work
    of the child processes and manages resources like network connections and memory
    allocation.


    In summary, the differences between child and parent processes are important to
    understand when building efficient and scalable programs. The two processes are
    similar but have unique attributes that allow them to execute independently and
    perform different tasks.


