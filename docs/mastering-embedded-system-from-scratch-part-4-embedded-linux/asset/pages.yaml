    On Intel CPUs, I/O memory allocation and mapping can be accomplished using memory-mapped
    I/O. In this approach, the device''s registers are mapped to a specific range
    of physical memory addresses, and the device is treated as if it were another
    memory location.


    To allocate I/O memory, the system administrator or device writer needs to reserve
    a specific range of physical memory addresses for the device. This is typically
    done using the req_mem function in Linux or the AllocatePorts function in Windows.
    The reserved memory region is then mapped to a virtual address space using the
    ioremap function in Linux or MapMem function in Windows.


    Once the I/O memory is allocated and mapped, the device''s registers can be accessed
    using standard memory access instructions as load and store instructions. For
    example, if the device''s registers are mapped to the physical address range 0xC0000000-0xC0FFFF,
    a driver can access the device''s registers using the virtual address range returned
    by the ioremap function, such as 0xFFEC00000-0xFFEC00FFF.


    I/O memory can also be used to share data between the CPU and the device. For
    example, a device driver may use a shared memory buffer to transfer data between
    the CPU and the device. To implement this, the driver would allocate a region
    of memory using memory-mapped I/O and then map the same region to the device''s
    address space using a DMA mapping function.


