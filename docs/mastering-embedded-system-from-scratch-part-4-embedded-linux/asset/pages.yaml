  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n```\ninterrupts = <42>;\n```\n\
    \nIn this example, the node has several special properties, including the compatible\
    \ property, which specifies the vendor and device, the reg property, which specifies\
    \ the address range of the device's registers, and the interrupts property, which\
    \ specifies the interrupt number and type.\n\n+   * Node names: Node names are\
    \ used to identify nodes in the Device Tree hierarchy. Node names must be unique\
    \ within the Device Tree, and are typically chosen to reflect the function or\
    \ location of the node.\n\n```\nnode {\n  ...\n}\nsubnode {\n  ...\n}\n```\n\n\
    In this example, the node has a child node subnode, which is identified by its\
    \ name.\n\nOverall, the DTS syntax provides a flexible and expressive way to describe\
    \ the hardware configuration of a system using a hierarchical data structure with\
    \ properties, handles, aliases, and names.\n\n# DTS ADDRESSING\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_324_0.png)\n\
    \n# DTS Addressing\n\nRanges (Address Translation)\nmemory-mapped addresses refer\
    \ to a tree of nodes mapped to each other. The ranges property is used for this\
    \ purpose.\n\nranges {\n  0x00000000 0x00000000 0x00000000 0x40000000;\n  0x40000000\
    \ 0x40000000 0x00000000 0x40000000;\n}\n\nMemory Mapped Devices\nMemory-mapped\
    \ devices have fixed lengths. In the following example:\nnuart0 {\n  reg = <0x40000000\
    \ 0x00001000>;\n  compatible = \"virtex,uart1554\";\n}\nnuart1 {\n  reg = <0x40001000\
    \ 0x00001000>;\n  compatible = \"virtex,uart1554\";\n}\n\nCPU addressing\nThe\
    \ CPU nodes represent the simplest case when talking about addressing. Each CPU\
    \ is assigned a single unit, and there is no size associated with CPU IDs.\n\n\
    cpu {\n  reg = <0>;\n  compatible = \"arm,cortex-a\";\n}\ncpu {\n  reg = <1>;\n\
    \  compatible = \"arm,cortex-a\";\n}\n\nNon Memory Mapped Devices\nNon-mapped\
    \ devices are not mapped to the processor memory but are accessed directly by\
    \ the CPU.\n\ndio {\n  reg = <0>;\n  compatible = \"simple-bus\";\n\n  i2c0 {\n\
    \    reg = <1>;\n    compatible = \"nokia,i2c-0x38\";\n  }\n  i2c1 {\n    reg\
    \ = <2>;\n    compatible = \"nokia,i2c-0x38\";\n  }\n}\n\nServices use the bus\
    \ with a different addressing scheme\nservice {\n  reg = <0>;\n  compatible =\
    \ \"simple-bus\";\n\n  serial {\n    reg = <1>;\n    compatible = \"virtex,uart1554\"\
    ;\n    interrupts = <5>;\n  }\n}\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_324_1.png)\n\
    \nPAGE 323 OF 465\nEmbedded System from Scratch\nCopyright © 2023 - Neris Khalil,\
    \ eng.keralis.haram@gmail.com"
