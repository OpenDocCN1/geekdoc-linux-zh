    # THE INIT PROGRAM


    THE INIT PROCESS IS THE FIRST PROCESS STARTED DURING THE BOOT SEQUENCE OF A LINUX
    SYSTEM, AND IT IS RESPONSIBLE FOR STARTING ALL OTHER PROCESSES ON THE SYSTEM.
    THE INIT PROCESS HAS A PROCESS ID (PID) OF 1 AND IS THE PARENT OF ALL OTHER PROCESS
    ON THE SYSTEM.


    The init process is configured in the kernel command line with the "init=" parameter.
    This specifies the path to the program that will be executed as the init process.
    The default value is usually "/sbin/init".


