  md: "# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX\n\n+   - When the main() function\
    \ exits, all threads of the application are destroyed\n\n+   - Joining() is one\
    \ way to accomplish synchronization between threads.\n\nThe pthread_join() function\
    \ can be used to support the exception of a thread until another thread terminates\n\
    - This function must be called in order to release the resources used by the thread,\
    \ otherwise it remains as zombie.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_174_0.png)\n\
    \nWhen working with threads, it's important to understand the concepts of joinable\
    \ and detached threads. Here are some key points to help you understand these\
    \ concepts:\n\n+   1. Joinable threads: A joinable thread is one that must be\
    \ explicitly joined by another thread using the pthread_join() function. The thread's\
    \ resources (such as memory and file descriptors) are not released until the thread\
    \ has successfully joined.\n2. Detached threads: A detached thread is one is no\
    \ longer joinable and does not need to be explicitly joined. The thread's resources\
    \ are released automatically when the thread exits.\n3. Joining threads: The pthread_join()\
    \ function can be used to wait for a joinable thread to complete. Here is an example:\n\
    \n```\n#include <pthread.h>\n#include <stdio.h>\n\nvoid thread_func(void* arg)\
    \ {\n    printf(\"Hello, world!\\n\");\n    return NULL;\n}\n\nint main() {\n\
    \    int ret;\n    ret = pthread_create(&thread, NULL, thread_func, NULL);\n \
    \   if (ret != 0) {\n        perror(\"pthread_create\");\n        return 1;\n\
    \    }\n\n    ret = pthread_join(thread, NULL);\n    if (ret != 0) {\n       \
    \ perror(\"pthread_join\");\n        return 1;\n    }\n    return 0;\n}\n```\n\
    \nIn this example, the main() function creates a new thread using pthread_create().\
    \ The thread function simply prints a message to the console. After creating the\
    \ thread, the main() function calls pthread_join() to wait for the thread to complete.\
    \ If the thread completes successfully, pthread_join() returns 0. If there is\
    \ an error, it returns a non-zero value.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_174_1.png)\n\
    \nPAGE 173 OF 465\nMastering Embedded System from Scratch\nCopyright © 2023 -\
    \ Keroles Khalil, eng.keroles.karam@gmail.com"
