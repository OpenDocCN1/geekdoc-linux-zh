    # Linux Low-Level Architecture Objects


    In the Linux kernel, vmlinux and System.map are two important files that are generated
    during the kernel build process.


    vmlinux is the kernel proper, in ELF format, and includes symbols, comments, and
    debug information (if compiled with -g). It is the main binary executable file
    that contains the compiled code of the Linux kernel. The vmlinux file is typically
    located in the /boot directory of the system is loaded into memory when the system
    boots up.


    The System.map file, on the other hand, is a text-based kernel symbol table which
    contains a list of all the symbols (functions, variables, and other objects) that
    are defined and used by the kernel. The symbols are organized in alphabetical
    order and include their virtual memory addresses and sizes. The System.map file
    is useful for debugging kernel-related issues and for analyzing kernel modules.


    In summary, vmlinux is the compiled code of the Linux kernel, while System.map
    is a text-based symbol table that provides information about the kernel symbols
    used by the vmlinux module.


