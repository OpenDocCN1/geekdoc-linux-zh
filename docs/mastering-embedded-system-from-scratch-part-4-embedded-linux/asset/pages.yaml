    # Paging


    Paging is a widely used memory management technique in many operating systems.
    It involves dividing physical memory into fixed-sized blocks known as frames.
    The frame size is typically a power of 2, ranging between 512 bytes and 8KB. Similarly,
    logical memory is divided into blocks of the same size called pages.


    The operating system keeps track of all free frames in memory. To run a program
    that is n pages in size, the operating system needs to find n free frames and
    load the program into those frames. A page table is set up to translate logical
    addresses to physical addresses, which the Memory Management Unit (MMU) looks
    up.


    The entire program is stored on disk. For example, a program with page X can either
    be loaded in memory page frame Y or never have been loaded before, in which case
    it remains on disk. When the program starts, only the first page is loaded into
    memory. The rest of the pages are loaded on-demand, as and when they are needed.


    This paging technique allows pages to be placed anywhere in memory, making memory
    allocation more efficient and reducing issues related to fragmentation.


