  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_336_0.png)


    start_kernel() init/main.c


    The start_kernel() function is defined in the init/main.c file and is responsible
    for performing various initialization tasks, such as initializing the memory manager,
    scheduler, interrupt handling, console, and other subsystems. Once the initialization
    is complete, the function invokes the rest_init() function, which initializes
    the rest of the system components, such as device drivers, file systems, and networking.


    Here''s an overview of what the start_kernel() function does:


    +   - Calls the setup_arch() function to initialize the architecture-specific
    code.

    - Initializes the memory manager with the mm_init() function.

    - Initializes the scheduler with the sched_init() function.

    - Initializes the interrupt handling subsystem with the init_IRQ() function.

    - Initializes the system timer with the init_timers() function.

    - Initializes the timekeeping subsystem with the timekeeping_init() function.

    - Initializes the console subsystem with the console_init() function.

    - Prints the kernel command line parameters with the pr_notice() function.

    - Invokes the rest_init() function, which initializes the rest of the system components.


    The rest_init() function is defined in the same file and performs the following
    tasks:


    +   - Initializes the device driver subsystem.

    - Initializes the file system subsystem.

    - Initializes the network subsystem.

    - Initializes the system calls.

    - Invokes the init() function, which initializes user space processes and services.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_336_1.png)'
