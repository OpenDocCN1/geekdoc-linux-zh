  pgno: 284
- img_proc: true
  md: '+   Arch: anything arch or platform related: CPU init, DTS, pinmux

    controller, DRAM, clocks, ...


    +   Board: code board specific (init, pinmux configuration, etc), Kconfig

    file specifying board header file, board file, paths, Makefile for board

    file,


    +   Configs: all boards'' defconfigs


    +   Drivers: Device drivers implemented in drivers/

    A lot of reuse from Linux drivers!


    +   include: all headers


    +   include/configs: all boards'' header file


    2. Configuring the U-Boot code: Once the hardware architecture is understood,
    the next step is to configure the U-Boot code. This involves creating a new configuration
    file type specific to the new board. The configuration file contains information
    about the processor type, memory size, device tree, and other hardware-specific
    settings. This file is used by the U-Build system to generate the bootloader binary.


    3. Adapting the board-specific code: The U-Boot code includes a set of board-specific
    files that need to be adapted for the new board. These files include board-specific
    initialization code, drivers for peripheral devices, and other hardware-specific
    code. This code needs to be modified with the hardware architecture of the new
    board.


    4. Building the U-Boot image: Once the configuration and adaptation of the board-specific
    code are complete, the next step is to build the U-Boot image. This involves using
    the U-Boot system to generate the bootloader binary. The build system uses the
    configuration file and the adapted board-specific code to generate the binary.


    5. Testing the U-Boot image: After building the U-Boot image, it is essential
    to test the bootloader on the new board. This involves booting the board with
    the U-Boot image and verifying that the bootloader is working correctly. Testing
    should include verifying that the bootloader can load and execute the kernel image,
    as well as verifying that all peripheral devices are working correctly.


    Here''s an example table of the steps involved in porting U-Boot to a new board:


    | Step | Description | Example |

    | --- | --- | --- |

    | 1 | Understand the hardware architecture of the new board | Identify the processor
    architecture, memory layout, peripheral devices, and other hardware components
    unique to the board |

    | 1 | Configure the U-Boot code | Create a new configuration file specific to
    the new board containing information about the processor type, memory size, device
    tree, and other hardware-specific settings |

    | 1 | Adapt the board-specific code | Modify the board-specific initialization
    code, drivers for peripheral devices, and other hardware-specific code to work
    with the new board |'
