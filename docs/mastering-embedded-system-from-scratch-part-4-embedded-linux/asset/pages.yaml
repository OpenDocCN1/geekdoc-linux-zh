  md: '# CHAPTER 14. ADVANCED TOPICS


    2. Data Processing ASC (DP_ASC)

    3. Actuator Writer ASC (AW_ASC)


    The Execution Management ensures the correct execution order and timing for ASCs:


    +   - SR_ASC is triggered by a periodic event (e.g., every 10 ms)

    - DP_ASC is triggered by the completion of SR_ASC, processing the sensor data

    - AW_ASC is triggered by the completion of DP_ASC, sending the processed data
    to the actuator


    Table: Execution Management Example


    | ASC Name | Trigger | Execution Order | Core Assignment |

    | SR_ASC | Periodic event | 1 | Core 1 |

    | DP_ASC | SR_ASC complete | 2 | Core 2 |

    | AW_ASC | DP_ASC complete | 3 | Core 3 |


    In this example, Execution Management ensures that the ASCs execute in the correct
    order and assign them to separate cores for parallel processing, enhancing system
    performance and efficiency


