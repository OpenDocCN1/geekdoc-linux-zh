    # # Processes vs. Tasks


    Linux views all work as a series of tasks imposed on the OS


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_86_1.png)


    process can also create new tasks or threads within its own address space using
    system calls such as clone() or fork(). The new task or thread is typically referred
    to as a child of the parent process.


    When a parent process creates a new task or thread, the operating system typically
    allocates a new process descriptor to hold the information to manage the task.
    The parent process then duplicates some of its own information into the child''s
    process descriptor, such as the process ID, links to the parent and siblings,
    the file table and file descriptors for each open file.


    The child''s process descriptor is then modified to reflect its new state, including
    a new process ID, links to the parent and siblings, and the creation of a new
    user data segment and virtual memory tables. The child is also initialized with
    a set of timers and signal handlers.


    Once the child''s process descriptor is fully initialized, its state is changed
    to TASK RUNNING, indicating that it is ready to run. At this point, the child
    begins executing its code within the same address space as the parent, sharing
    the same memory and other resources.


