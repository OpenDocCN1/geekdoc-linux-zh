    # System Calls


    System calls are an essential component of system programming, allowing user-space
    applications to interact with the kernel and request services or resources from
    the operating system. Here are some key points to help you understand system calls:


    +   1. Definition: System calls are function invocations made from user space
    into the kernel. They provide a standardized interface for user applications to
    request services or resources from the operating system.

    2. Types of System Calls: System calls range from common functions like read()
    and write() for file input/output to more exotic functions such as get_thread_area()
    and set_tid_address().

    3. Role of the Kernel: The kernel provides a mechanism for user-space applications
    to signal that they wish to invoke a system call. This mechanism varies from architecture
    but typically involves setting specific CPU registers or executing specific instructions
    to initialize the system call.

    4. User-Space Applications: User-space applications cannot directly link to the
    kernel space, as this would pose significant security risks. Instead, they use
    system calls to communicate with the kernel in a secure and manner manner.

    5. Examples of System Calls: Here are some examples of commonly used system calls
    in Unix/Linux systems:

    - open(): Opens a file or device for reading or writing.

    - read(): Reads data from a file or device into a buffer.

    - write(): Writes data from a buffer to a file or device.

    - fork(): Creates a new process by duplicating the calling process.

    - exec(): Replaces the current process with a new process.

    - exit(): Terminates the calling process and returns its exit status.


