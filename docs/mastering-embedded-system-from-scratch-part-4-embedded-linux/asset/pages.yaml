  md: "![](img/bc86631e65e541c1c58ec0ab72a978e0_397_0.png)\n\n# # Machine Manifest\
    \ and Execution Manifest in Adaptive AUTOSAR\n\nMachine Manifest and Execution\
    \ Manifest are essential configuration files in Adaptive AUTOSAR. The Machine\
    \ Manifest holds configuration information specific to the machine, while the\
    \ Execution Manifest contains deployment-related information and machine-specific\
    \ configurations for Executables.\n\nKey Points:\n\n+   - Machine Manifest:\n\
    \  - Created during integration for a specific machine and deployed when its contents\
    \ change.\n  - Contains configuration information not assigned to a specific Executable\
    \ or its instances (Processes).\n  - Includes machine properties and features\
    \ configuration, such as Machine States, Function Group States, resource groups,\
    \ access right groups, scheduler configuration, SOME/IP configuration, and memory\
    \ segmentation."
