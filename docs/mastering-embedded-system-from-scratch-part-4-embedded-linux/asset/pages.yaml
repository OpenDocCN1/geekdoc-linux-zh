    # CREATING NEW PROCESSES


    Creating new processes is a fundamental concept in operating systems, allowing
    programs to spawn new processes to perform tasks in parallel. Here are some key
    points to help you understand how new processes are created:


    +   1. The fork() system call: The fork() system call is used to create a new
    process. When fork() is called, the calling process is cloned, creating a new
    process that is identical to the original except for the PID. The new process
    is known as the child, and the calling process is known as the parent.

    2. Cloning process: When fork() is called, the kernel creates a new process by
    cloning the current process. This includes duplicating the memory space, including
    the code, data, and stack segments.

    3. Child process: Once the process is created, it has its own copy of the process
    image and can execute its instructions independently of the parent. The child
    process can also modify its memory space without affecting the parent process.

    4. Parent process: The parent process continues executing from the point where
    fork() was called, while the child process begins executing from the same point
    in the parent. The parent can use the PID returned by fork() to track the child
    process and communicate with it.

    5. Return values: fork() returns twice; once in the child process and once in
    the parent. The return value in the child process is 0, while the return value
    in the parent process is the PID of the child process.


    Here''s a table summarizing the key points about creating new processes:


    | Concept | Description |

    | fork() system call | Used to create a new process by cloning the current process
    |


