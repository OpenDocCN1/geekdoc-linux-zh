  md: "# Fragmentation\n\nExternal fragmentation occurs when there is enough total\
    \ free memory space available to satisfy a memory request, but the free memory\
    \ is not contiguous or adjacent. As a result, the memory request cannot be fulfilled,\
    \ even though there is enough free memory overall.\n\nMemory compaction is one\
    \ technique that can be used to reduce external fragmentation. Compaction involves\
    \ rearranging memory blocks to free all free memory together in one large contiguous\
    \ block. This can be done by moving active memory blocks around to create a large\
    \ block of contiguous memory, which can then be used to fulfill memory requests.\n\
    \nHowever, memory compaction can be expensive in terms of CPU and memory overhead,\
    \ especially for large memory systems. As a result, many operating systems use\
    \ alternative techniques like memory paging, which involves swapping memory pages\
    \ between physical and secondary storage to optimize memory usage and reduce fragmentation.\n\
    \nOverall, managing external fragmentation is an important aspect of memory management\
    \ in operating systems, and requires careful consideration and optimization to\
    \ ensure efficient and reliable memory usage.\n\n+   - External Fragmentation\n\
    \  - The free memory space exists to satisfy a request, but it is not contiguous\n\
    \  - Can be reduced by compaction:\n    - Places all free memory together in one\
    \ large block\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_30_0.png)\n\n+   - Internal\
