    \ Standard Release | R19-11 |\n\nSource: www.autosar.org\n\n+   - Execution Management\
    \ determines when to start or stop Processes.\n- Execution Management derives\
    \ an ordering for startup/shutdown of deployed Executables based on Execution\
    \ Manifests files.\n- Execution Management ensures the authenticity of all Executables\
    \ and Executable related data is checked.\n- Execution Management configures the\
    \ operating system and its scheduling policy even at runtime.\n- is the functional\
    \ cluster within the Adaptive Platform Foundation\n- Execution Management is responsible\
    \ for the management of all aspects of system execution including\n  - platform\
