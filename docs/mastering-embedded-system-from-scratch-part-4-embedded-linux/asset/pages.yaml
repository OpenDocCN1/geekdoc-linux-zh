  md: '# Linux Command Line Interface CLI


    Using the Command Line Interface - Looks like DOS,

    but with more features Ill


    With CLI.


    +   More Control, things you can never reach with GUI

    Faster, one command can do the effect of several menus,

    and make clicks

    Enable automation and scripting


    GUI makes easy tasks easier.... But CLI makes difficult

    tasks possible


    Sometimes in the embedded systems, CLI is all

    what we have


    Here are some of the most common and useful Linux commands:


    +   1. ls: Lists the contents of a directory: ls /home/user/Documents

    2. cd: Changes the current working directory Example: cd /home/user/Desktop

    3. mkdir: Creates a new directory Example: mkdir new_directory

    4. rm: Deletes a file or directory Example: rm file.txt rm -r directory/

    5. cp: Copies files or directory Example: cp file.txt /home/user/Documents/ or
    cp -r

    directory/home/user/backup/

    6. mv: Moves or renames files or directories Example: mv file.txt /home/user/Documents/

    or mv directory/home/user/backup/new_name/

    7. cat: Displays the contents of a file Example: cat file.txt

    8. grep: Searches for a specific pattern in a file Example: grep "keyword" file.txt

    9. top: Displays system resource usage and running processes Example: top

    10. ps: Displays information about running processes Example: ps -ef

    11. chmod: Changes the permissions of a file or directory Example: chmod 755 file.txt

    12. sudo: Runs a command with elevated privileges Example: sudo apt-get-update

    13. ping: Tests network connectivity to a host Example: ping google.com

    14. tar: Compresses or extracts files from an archive Example: tar -cvf archive.tar

    file.txt or tar -xvf archive.tar

    15. ssh: Connects to a remote server using the Shell protocol Example: ssh

    user@hostname


    These are just a few examples of the many Linux commands available. Each command
    has a variety

    of options and flags that can be used for different purposes, making the command
    line interface a

    powerful tool for system administration and automation.


