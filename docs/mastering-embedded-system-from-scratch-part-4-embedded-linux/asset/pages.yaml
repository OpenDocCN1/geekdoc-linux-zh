    # Soft LINKING FILES


    +   Soft links are very similar to what we say "Shortcut" in windows,

    - is a way to link to a file or directory.

    - it simply contains the pointer to the location of the destination file.

    - In technical works, in soft link, a new file is created with a new inode, which
    have the pointer to the location of the original file. This can be better explained
    with a diagram

