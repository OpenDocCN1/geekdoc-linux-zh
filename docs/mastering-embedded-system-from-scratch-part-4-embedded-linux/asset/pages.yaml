    # IMPORTANT UBOOT COMMANDS


    U-Boot is a powerful bootloader that provides a range of commands to interact
    with the system and perform various tasks, such as loading files, testing network
    connectivity, and modifying memory contents. In this article, we will discuss
    some of the most common U-Boot commands and their uses.


    +   1. help and help command: The help command provides a list of available U-Boot
    commands, while the help [command] command provides more information about a specific
    command.

    2. ext2load, ext2ls and ext2info: These commands are used to interact with ext2
    filesystems and perform tasks such as loading into RAM, listing files, and getting
    information about the filesystem.

    3. fatload, fatls, and 않고: These commands are used to interact with FAT filesystems
    and perform tasks such as loading into RAM, listing files, and getting information
    about the filesystem.

    4. tftp and ping: The tftp command is used to load a file from a remote server
    using TFTP protocol, while the ping command is used to test network connectivity
    and reachability.

    5. boot and booth: The boot command runs the default boot command stored in bootcmd,
    while the boot command starts a kernel image loaded at a specific address in RAM.

    6. load, loady: These commands are used to load a file from a serial line into
    RAM.

    7. usb and mmc: The usb command is used to initialize and control the USB subsystem,
    mainly used for storage devices as USB keys, while the mmc command is used to
    initialize and control the MMC subsystem for SD and microSD cards.

    8. nand, erase, protect, and cp: The nand command is used to erase, and write
    contents to NAND flash, while the erase, protect, and cp commands are used to
    erase, modify protection, and write to NOR flash.

    9. md and mm: The md command is used to display memory contents, which can be
    useful to check the contents loaded in memory or to look at hardware registers.
    The mm command is used to modify memory contents, which can be useful to modify
    directly hardware registers for testing purposes.


