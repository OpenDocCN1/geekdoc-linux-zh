  md: "# Device trees\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_314_0.png)\n\nThe\
    \ device tree is a hierarchical data structure that describes the hardware configuration\
    \ of a system in a platform-independent manner. Here are some key points about\
    \ the Linux device tree:\n\n+   - Is Open Firmware: specification, IEEE-1275-1994\n\
    \  - Description of hardware (contains no code)\n- The kernel no longer contain\
    \ the description of the hardware,\n  - it is located in a separate binary: device\
    \ tree DTB\n- The kernel needs to know details about hardware\n  - to decide which\
    \ drivers to initialize\n  - to configure device parameters such as register addresses\
    \ and IRQ\n- The Bootloader loads binaries: the kernel image and the DTB\n  -\
    \ Kernel remains uImage or zImage\n  - DTB located in arch/boot/dtms, one per\
    \ board\n- U-Root command:\n  - boot[mz] <kernel img addr> - <dtb addr>"
