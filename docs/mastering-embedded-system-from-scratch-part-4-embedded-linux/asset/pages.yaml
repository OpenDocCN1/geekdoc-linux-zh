    +   The Semicolon () Operator


    +   The semicolon () operator allows you to execute multiple commands in succession,
    regardless of whether each previous command succeeds.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_209_0.png)


    +   Pipes Pipes are used to redirect the output of one command as input to another
    command. The pipe symbol is represented as "|". Here''s an example of using a
    pipe to display the top 5 processes by memory usage:


    ```

    ps aux --sort=%mem | head -6

    ```


    +   Command Substitution Command substitution allows the output of one command
    to be used as input to another command. The command substitution syntax is $(command).
    Here''s an example of using command substitution to create a directory with today''s
    date as the directory name:


    ```

    mkdir $(date +Y-%m-%d)

    ```


    +   Redirection Input and Output Redirection input and output is used to redirect
    the input or output of a command to from a file instead of the standard input
    or output. The greater symbol is used to redirect output to a file, while the
    less symbol is used to redirect input from a file. Here''s an example of using
    output redirection to write the output of a command to a file:


    ```

    ls -l > filelist.txt

    ```


    +   Command Grouping Command grouping is used to group a sequence of commands
    so that they are treated as a single command. The command grouping syntax is ({command1;
    command2; ... commandN}). Here''s an example of using command grouping to run
    multiple commands as a single command:


    ```

    { echo "Hello"; echo "World"; } > greeting.txt

    ```


