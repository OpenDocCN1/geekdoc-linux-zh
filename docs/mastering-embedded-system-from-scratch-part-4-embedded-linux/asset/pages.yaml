  md: '# Filesystems are mounted in a specific location in this hierarchy of directories


    +   - When a filesystem is mounted in a directory (called mount point), the contents
    of this directory reflects the contents of the storage device


    +   - When the filesystem is unmounted, the mount point is empty again.


    +   - This allows applications to access files and directories easily, regardless
    of their storage location


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_352_0.png)


    # Mounting and unmounting a file system


    Mounting and unmounting a file system is a process of attaching or detaching a
    file system/from a directory in the hierarchy of directories.


    The mount command in Linux is used to attach a file system to a directory in the
    file system hierarchy. The syntax of the mount command is as follows:


    mount [-t fstype] device directory


    +   - fstype: The file system type (e.g., ext4, nfs, etc.)

    - options: The mount options (e.g., read-only, noexec, etc.)

    - device: The device file or remote server containing the file system data

    - directory: The directory in the file system hierarchy where the file system
    will be mounted


    Here is an example of mounting an ext4 file system:


    ```

    mount -t ext4 /dev/sdal /mnt/mydrive

    ```


    The above command will attach the ext4 file system on /dev/sdal to the /mnt/mydrive.


    The mount command in Linux is used to detach a file system from a directory. The
    syntax of the mount command is as follows:


    ```

    umount directory

    ```


    +   - directory: The directory in the file system hierarchy where the file system
    is mounted


    Here is an example of unmounting the ext4 file system:


    ```

    umount /mnt/mydrive

    ```


    The above command will detach the ext4 file system from the /mnt/mydrive


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_352_1.png)'
