  md: '6. SCSI (Small Computer System Interface) bus: The SCSI bus is a high-speed
    bus primarily used for connecting storage devices, such as hard drives and optical
    devices, to the computer. SCSI has been largely replaced by SATA (Serial ATA)
    and NVMe (Non-Volatile Memory) interfaces in modern systems due to their higher
    performance and more efficient protocols.


    To interact with I/O devices, the computer system uses device controllers. A device
    controller is a specialized hardware component that manages the communication
    between the computer and a specific I/O device. Device controllers contain a set
    of registers, including control registers and status registers, which are used
    to control and monitor the operation of the I/O device.


    Control registers are used to issue commands to the I/O device, such as reading
    or writing data, and status registers, on the other hand, provide information
    about the current state of the I/O device, such as whether it is busy, has completed
    a command, or has encountered an error.


    In summary, modern I/O systems are essential for managing the interaction between
    a computer and its peripheral devices. Different types of buses are used to connect
    various I/O devices to the computer, and device controllers are responsible for
    controlling and monitoring the operation of these devices.


    For example in computer systems many kinds of I/O devices are connected via bus.


    The CPU and memory are connected via PCI bus and slow devices such as keyboards
    are connected by expansion bus.


    In addition to these disks are connected via SCSI bus you interact with I/O devices
    via device controllers controllers contains a set of registers including control
    registers and status registers to control IO devices.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_115_0.png)


    Basic I/O controls revolve around the management and communication between a computer''s
    processing unit (CPU) and peripheral devices, such as storage devices, keyboards,
    mice, and displays. The I/O subsystem''s main purpose is to abstract device-specific
    information from both the kernel and the application developer, providing a uniform
    access method for peripheral I/O devices in the system.


    Peripheral devices are typically controlled by writing to and reading from registers.
    There are common mechanisms used to access these registers:


    +   3. Operations on memory address space: In this approach, registers of I/O
    devices are mapped into the system''s memory address space. The CPU accesses the
    registers using regular memory read and write instructions. This is called memory-mapped
    I/O.

    4. Separate I/O address space for I/O ports: In this method, I/O devices are assigned
    a separate I/O address space, distinct from the memory address space. The CPU
    uses special I/O instructions to access the device registers. This is known as
    port-mapped I/O or I-mapped I/O.'
