  md: "# Ch13. Part4 - pthread/Linux Command\n\n# Linux Alarm\n\nIn Linux, the alarm()\
    \ function is used to set an alarm clock for delivery of a signal. Here are some\
    \ key points to help you understand how to use the alarm() function:\n\n+   Definition:\
    \ The alarm() function is used to arrange for a SIGALRM signal to be delivered\
    \ to the calling process in a specified number of seconds. It has the following\
    \ syntax:\n\nunsigned int alarm(unsigned int seconds);\n\nAlarm signal: The SIGALRM\
    \ signal is the alarm signal that is generated when the timer set by the alarm\
    \ goes off.\nSetting the alarm: When you call the alarm() function, it sets a\
    \ timer that will generate a SIGALRM signal after the specified number of seconds\
    \ has elapsed. If you call alarm() again before the timer has expired, it will\
    \ cancel the previous timer and start a new one.\nelling the alarm: To cancel\
    \ the alarm, you can call the alarm() function with a value of 0 for seconds.\
    \ This will cancel any previously set alarm.\nExample of using alarm(): Here's\
    \ an example of using alarm() to schedule a SIGALRM signal to be delivered to\
    \ the calling process after 5 seconds\n\n```\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <signal.h>\n\nvoid alarm_handler(int signum) {\n    printf(\"Alarm signal\
    \ received.\\n\");\n}\n\nint main() {\n    signal(SIGALRM, alarm_handler);\n \
    \   alarm(5);\n    while (1) {\n        printf(\"Waiting for alarm...\\n\");\n\
    \        sleep(1);\n    }\n    return 0;\n}\n```\n\nIn this example, the program\
    \ sets up a signal handler function for SIGALRM using signal(). The program then\
    \ calls alarm(5) to schedule the SIGALRM signal to be delivered after 5 seconds.\
    \ The program then enters an infinite loop, waiting for the alarm signal to be\
    \ delivered. When the alarm is received, the signal handler function will be invoked\
    \ and will print a message indicating that the signal was received.\n\nHere's\
    \ a table summarizing the key points about using the alarm() function:\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_159_0.png)"
