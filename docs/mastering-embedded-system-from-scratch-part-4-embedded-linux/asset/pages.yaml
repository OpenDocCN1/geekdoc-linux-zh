    +   If you want to keep track of new devices coming online and create nodes for
    them as well, you need to make mdev a hot plug client by writing to /proc/sys/kernel/hotplug.


    +   These additions to /etc/init.d/rcS achieve all of this:


    ```

    #/bin/sh

    mount -t proc proc /proc

    mount -t sysfs /sys

    mount -t devtmpfs /dev

    echo /sbin/mdev > /proc/sys/kernel/hotplug

    mdev -s

    ```


