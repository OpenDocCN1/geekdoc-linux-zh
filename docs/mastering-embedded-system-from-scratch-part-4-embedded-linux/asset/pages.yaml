    # port U-boot to a new board (Basics)


    Porting U-Boot to a new board can be a challenging task for embedded system developers.
    U-Boot, short for Universal Bootloader, is a widely open-source bootloader for
    embedded systems. It is responsible for initializing hardware, loading the kernel
    image, and booting the system. U-Boot to a new board involves adapting the bootloader
    code to the specific hardware configuration of the board.


    Here are some steps involved in porting U-Boot to a new board:


    +   1. Understanding the hardware: Before starting the porting process, it is
    essential to understand the hardware architecture of the new board. This includes
    the processor architecture, memory layout, peripheral devices, and any other hardware
    components that are unique to the board. This information can be obtained from
    the board documentation, datasheets, and hardware schematics.


    U-Boot directories


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_284_1.png)'
