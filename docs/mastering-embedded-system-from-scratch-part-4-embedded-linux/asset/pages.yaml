    # UCM Master


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_426_0.png)


    Source: www.autosar.org


    UCM Master is a key component of the AUTOSAR Adaptive Platform that provides a
    standard solution for securely updating a complete vehicle over-the-air or through
    a diagnostic tester. Here are some points that describe UCM Master in detail:


    +   1. Objective: The main objective of UCM Master is to provide a standardized
    solution for updating the AUTOSAR Adaptive Platform in a safe and secure manner.

    2. Package processing: UCM Master receives packages from backend systems or diagnostic
    tools and parses them to extract the relevant information. It interprets the vehicle
    package, transfers or streams software packages to suitable targets, and orchestrates
    the processing, activations, and eventual rollbacks.

    3. Service instances: UCM Master has separate service instances to allow better
    management of the update process. Each service instance is responsible for a specific
    function, such as package processing, target selection, or activation management.

    4. Security: UCM Master ensures that the update process is secure by using various
    security mechanisms, such as authentication and encryption. It provides a mechanism
    for verifying the authenticity of the software packages to prevent unauthorized
    updates.

    5. Rollback: In case of issues during the update process, UCM Master provides
    a mechanism for rolling back the changes to the previous version. This ensures
    that the vehicle remains operational and minimizes any potential damage caused
    by faulty updates.

    6. Compatibility: UCM Master ensures that the updated software is compatible with
    the existing software on the vehicle. It checks for compatibility issues and resolves
    them before activating the updated software.


    Example: The following code snippet shows an example of how UCM Master can be
    used to update a vehicle over-the-air:


    ```

    UCMmaster master = new UCMaster();

    ```


