- img_proc: true
  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    For example computer systems many kinds of devices are connected via bus.


    The CPU and memory are connected via PCI bus and slow devices such as keyboards
    are connected by expansion bus.


    In addition to these disks are connected via SCSI bus you interact with I/O devices
    via device controllers device controllers a set of registers including control
    registers and status registers to control I/O devices.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_72_0.png)


    Basic I/O concepts revolve around the management and communication between a computer''s
    central processing unit (CPU) and peripheral devices, such as storage devices,
    keyboards, mice, and displays. The I/O subsystem'' main purpose is to abstract
    device-specific information from both the kernel and the application developer,
    providing a uniform access method for peripheral I/O devices in the system.


    Peripheral devices are typically controlled by writing to and reading from their
    registers. There are common mechanisms used to access these registers, including:


    +   1. Operations on memory address space: In this approach, registers of I/O
    devices are mapped into the system''s memory address space. The CPU accesses the
    I/O devices using regular memory read and write instructions. This is called memory-mapped
    I/O.

    2. Separate I/O address space for I/O ports: In this method, I/O devices are assigned
    a separate I/O address space, distinct from the memory address space. The CPU
    uses special I/O instructions to access the device registers. This is known as
    port-mapped I/O or memory-mapped I/O.


    To access a specific I/O device, developers need to determine whether the device
    is port-mapped or memory-mapped. This information will dictate which method, port-mapped
    I/O or memory-mapped I/O, should be used to interact with the device.


    Port-mapped I/O is more commonly found in x86-based systems, where special instructions
    like IN and OUT are used to communicate with I/O devices. Memory-mapped I/O, on
    the other hand, is more prevalent in RISC-based architectures, where devices are
    accessed using regular memory access instructions.


    Both methods have their advantages and disadvantages. Memory-mapped I/O allows
    for a straightforward programming model, as regular memory access instructions
    are used. However, it can consume valuable address space that could be used for
    other purposes. Port-mapped I/O does not consume memory address space, but it
    requires the use of special instructions, which can be more complex and less efficient
    in some cases.


    Ultimately, the choice between port-mapped and memory-mapped I/O depends on the
    specific architecture and design goals of the system.


