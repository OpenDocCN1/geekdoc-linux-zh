  md: "# CHAPTER 15. INTRODUCTION TO EMBEDDED LINUX\n\n+   - The patch file can be\
    \ applied to the source code using the \"patch\" command.\n- The patch command\
    \ takes the original source code file and the patch file as input and applies\
    \ the changes specified in the patch file to the original source code.\n- If the\
    \ patch applies cleanly, the changes are made to the source code file. If there\
    \ are conflicts, the patch command will ask the user to resolve them manually.\n\
    \n# 1. Creating a Patch File:\n\n+   - Developers can create a patch file to share\
    \ their changes with other developers or users.\n- The \"diff\" command is used\
    \ to create a patch file. For example, the command \"diff -u original_modified_file\
    \ > my_patch.patch\" will create a patch file named \"my_patch.patch\" that contains\
    \ the differences between the \"original_file\" and \"modified_file\".\n\nHere\
    \ is an example of a patch file:\n\n```\n--- original_file.c\n+++ modified_file.c\n\
    @@ -1,4 +1,4 @@\n-#include <stdio.h>\n+#include <stdlib.h>\n```\n\n```\nint main()\
    \ {\n    printf(\"Hello, World!\");\n    printf(\"Hello, Linux Patch!\");\n  \
    \  return 0;\n}\n```\n\nIn this example, the patch file modifies the \"original_file.c\"\
    \ by changing the \"printf\" statement to print \"Hello, Linux Patch!\" instead\
    \ of \"Hello, World!\".\n\nAnd here is a table summarizing some patch commands:\n\
    \n| Command | Description |\n|---|---|\n| patch -p1 < my_patch.patch | Apply the\
    \ patch file \"my_patch.patch\" to the source code in the current directory |\n\
    | diff -u original_file > my_patch.patch | Create a patch file named \"my_patch.patch\"\
    \ containing the differences between \"original_file\" and \"modified_file\" |\n\
    | patch --dry-run -p1 < my_patch.patch | Test the patch to see if it applies cleanly\
    \ without making any changes |\n| patch -R -p1 < my_patch.patch | Reverse the\
    \ changes made by the patch file \"my_patch.patch\" |\n\nPAGE 217 OF 465\nMastering\
    \ Embedded System from Scratch\nCopyright © 2023 – Keroles Khalil, eng.keroles.karam@gmail.com"
