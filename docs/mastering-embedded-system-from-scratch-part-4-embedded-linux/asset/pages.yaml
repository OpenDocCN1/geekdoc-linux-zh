  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n+   - In Linux, when a new\
    \ process is created, it already contains a thread, to use the main() function\n\
    - A process is created by the operating system\n- Additional threads can be created\
    \ using the pthread library, which shares the same address space as the process\n\
    - All threads within a process share the same address space, the same set of open\
    \ files, signals and handlers\n- The pthread library also provide synchronization\
    \ primitives like threads and conditions\n- This thread has its own header: pthread.h\n\
    - Applications using pthread function calls should be explicitly linked with the\
    \ pthread library using gcc -o app app.c -pthread\n\n4. The pthread.h header.\
    \ This header provides the functions and data types needed to use the pthread\
    \ library. Applications using pthread function calls should be explicitly linked\
    \ with the pthread library using the -pthread flag when compiling.\n\n5. Creating\
    \ a new thread: To create a new thread using the pthread library, use the thread_create()\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_172_0.png)\n\n+   - The function to\
    \ create a new thread is pthread_create()\n- int pthread_create(pthread_t *thread,\
    \ const pthread_attr_t *attr, void (*start_routine)(void *), void *arg)\n- pthread_t\
    \ is a structure that will be initialized by the function. Its attribute can be\
    \ used to reference the thread.\n- attr is a pointer to an optional structure\
    \ pthread_attr. This can be used to set various attributes of the thread (detach\
    \ policy, priority, etc.).\n- start_routine is the function that will be executed\
    \ by the thread\n- arg is the private data passed as argument to the start_routine\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_172_1.png)\n\nfunction. Here's an example:\n\
    \n```\n#include <pthread.h>\n#include <stdio.h>\n\nvoid thread_func(void* arg)\
    \ {\n    printf(\"Hello, world!\\n\");\n    return NULL;\n}\n\nint main() {\n\
    \    pthread_t thread;\n    int ret;\n    ret = pthread_create(&thread, NULL,\
    \ thread_func, NULL);\n    if (ret != 0) {\n        perror(\"pthread_create\"\
    );\n        return 1;\n    }\n    pthread_join(thread, NULL);\n}\n```\n\nPAGE\
    \ 171 of 465\nMastering Embedded System from Scratch\n© Kerolis Khalil, eng.kerolis.karam@gmail.com\n\
