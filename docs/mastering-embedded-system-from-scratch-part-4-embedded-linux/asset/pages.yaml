  md: "# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX\n\n# Devices\n\n+   - Every device\
    \ in the system is represented\nby a device tree node.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_322_0.png)\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_322_1.png)\n\n# Device Tree SYNTAX\n\
    \n# Syntax\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_322_2.png)\n\n# Aliases\n\
    \nThe aliases node is an index of other nodes.\nThe properties of the node paths\
    \ within the device tree, not the phandle:\n\n```\naliases {\n  eth0 = &eth0;\n\
    \  eth1 = &eth1;\n  serial = &serial;\n  uartc0 = &uartc0;\n}\n```\n\n# Phandle\n\
    \nA phandle is a value associated with a node that allows the node to be referenced\
    \ by phandle in another property.\n\n```\nname@address {\n  key = <label>;n}\n\
    ```\n\nlabel: name@address { = <label>} is converted to a phandle for the labeled\
    \ node by the DTS.\n\n# Properties\n\nA node may contain multiple properties arranged\
    \ in name = value form. The **name** consists of a string, while the value can\
    \ be an array of strings, numbers, or phandles, or a mixture of types. For example,\
    \ value can:\n\n+   - compatible = \"fsl,mpc8610-msi\", \"fsi,mpc-msi\"\n- reg\
    \ = <0 0x80000000>\n- Interrupt-parent = <intc>;\n\n# Node names\n\nThe node name\
    \ is a label used to identify the node. Children nodes must be uniquely named,\
    \ but can be alternatively addressed by a \"unit name\",\n\n+   - for example,\n\
    \  eth0@2000,\n  eth1@4000,\n  so on\n\nHere are some key aspects of the Device\
    \ Tree Syntax (DTS) to refer to devices or nodes in the Device Tree. Aliases are\
    \ defined using the aliases node, which contains a list of alias names and their\
    \ corresponding target nodes.\n\n+   - Aliases are short names that can be used\
    \ to refer to devices or nodes in the Device Tree. Aliases are defined using the\
    \ aliases node, which contains a list of alias names and their corresponding target\
    \ nodes.\n\n```\naliases {\neth0 = &mac0;\neth1 = &mac1;\n}\n```\n\nMastering\
    \ Embedded Systems from Scratch\nCopyright 2023 - Keroles Khalil, eng.keroles.haram@gmail.com"
  merge: -1
  pgno: 322
- img_proc: true
  md: "In this example, the eth0 and eth1 aliases are defined, which refer to the\
    \ mac0 and mac1 nodes, respectively.\n\n+   - Phandles: A handle is a unique identifier\
    \ that is used to reference a node in the Device Tree. Phandles are typically\
    \ used to reference parent nodes or to specify the target of a property.\n\n```\n\
    node1 {\n    handle = <0x1234>;\n...\n}\nnode2 {\n    parent = <&node>;\n    ...\n\
    }\n```\n\nIn this example, the node1 has a handle of 0x1234, which is used as\
    \ the parent of the node2 node.\n\n+   - dtc creates a handle from a label when\
    \ it sees a reference from another node\n- Decompiling the dtb shows the actual\
    \ code (next slide)\n\n```\ninterrupt0 {\n    interrupt-resolution = <0x20000000>;n\
    \    compatibility = \"spi1,sample-uart\";\n    interrupt-controller = <&intc>;\n\
    \    interrupt-cells = <8>;\n    linux,interrupt = <0>;\n    phandle = <0>;\n\
    }\nserial182000 {\n    compatibility = \"spi1,sample-uart\";\n    frequency =\
    \ <115200>;\n    reg = <0x1000>;\n    interrupts = <&intc>;\n    status = \"okay\"\
    ;\n    interrupt-param = <21>;n} <--- reference\n```\n\nDevice Tree Nodes example\n\
    \n![](img/bc86631e65e541c1c58ec0ab72a978e0_323_0.png)\n\n+   - Properties: Properties\
    \ are key-value pairs that describe the characteristics of a node or device in\
    \ the Device Tree. Properties are specified using the property = <value> syntax.\n\
    \n```\nnode {\n    compatible = \"vendor,device\";\n    reg = <0x1000 0x100>;\n\
    }\n```\n\nPAGE 322 OF 465\nMastering Embedded System from Scratch\nCopyright ©\
    \ 2023 - Keroles Khail, eng.keroles.karam@gmail.com"
