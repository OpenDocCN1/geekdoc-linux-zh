  md: "# The Linux Scheduler\n\n+   - The scheduler is part of the kernel code that\
    \ makes it possible to execute multiple programs at the same time, sharing the\
    \ CPU among a number of processes.\n- Deciding which process to run, and how long\
    \ is the scheduler's primary responsibility.\n- Linux scheduling is based on the\
    \ time-sharing technique\n  - The CPU time is roughly divided into 'slices', one\
    \ for each process\n  - If a running process is not terminated when its time slice\
    \ or quantum expires, the process is interrupted\n  - Time-sharing relies on timer\
    \ interrupts and is transparent to processes\n  - No additional code needs to\
    \ be inserted in the program to ensure CPU time-sharing.\n- The scheduling policy\
    \ is also based on ranking processes according to their priority.\n  - High priority\
    \ processes are short-lived.\n  - In Linux, process priority is dynamic.\n- The\
    \ scheduler keeps track of what processes are doing and adjusts their priorities\
    \ periodically:\n  - Processes that have been denied most of the CPU for a long\
    \ interval are boosted by increasing their priority.\n  - Processes running for\
    \ a long time are penalized by decreasing their priority.\n\nThe Linux scheduler\
    \ is responsible for managing the allocation of CPU time to processes and threads\
    \ in the system. Here are some key points about the Linux scheduler:\n\n+   1.\
    \ Scheduling classes: The Linux scheduler has different scheduling classes that\
    \ determine how processes are scheduled. The most commonly used scheduling class\
    \ is the Completely Fair Scheduler (CFS), which ensures that each process receives\
    \ a fair share of CPU time. Other scheduling classes include the Real-time scheduler\
    \ and the Deadline scheduler.\n2. Priorities: Each process and thread has a priority\
    \ that determines its position in the scheduling queue. The Linux scheduler uses\
    \ a priority-based scheduling algorithm to decide which process or thread to run\
    \ next.\n3. Time slices: The Linux scheduler uses time slices to allocate CPU\
    \ time to processes and threads. A time slice is the amount of time that a process\
    \ or thread is allowed to run before being preempted and replaced by another process\
    \ or thread.\n4. Preemption: The Linux scheduler supports preemption, which means\
    \ that a process or thread can be interrupted and replaced by another process\
    \ or thread if a higher-priority process or thread becomes runnable.\n5. Load\
    \ balancing: The Linux scheduler performs load balancing to ensure that the workload\
    \ is evenly distributed across all CPUs in the system. If a CPU is idle while\
    \ other CPUs are busy, the scheduler will move some processes to the idle CPU\
    \ to balance the load.\n\nExample:\n\nLet's say we have a Linux system with multiple\
    \ processes and threads running. The Linux scheduler ensures that each process\
    \ and thread receives a fair share of CPU time, so no process or thread is starved\
    \ of resources.\n\nSuppose a high-priority process is created. The Linux scheduler\
    \ will prioritize this process and allocate more CPU time to it than lower-priority\
    \ processes. If the new process is CPU-bound and uses its time slice quickly,\
    \ it may be preempted and replaced by another process or thread.\n\n![](img/bc86631e65e541c1c58ec0ab72a978e0_91_0.png)"
