  md: '# CHAPTER 14. ADVANCED TOPICS


    Example: Interaction Between States


    Consider a system with the following components:


    +   - State Management (SM)

    - Function Group (FG1) with Processes P1 and P2

    - Function Group States: FG1_State1, FG1_State2


    Table: Interaction Between States in Adaptive AUTOSAR System


    | State Management Action | Function Group State | Process State | Execution State
    | Description |

    |---|---|---|---|---||

    | Request FG1_State1 | FG1_State1 | Idle | kInitializing | SM requests FG1_State1,
    processes in FG1 are in Idle state, and Execution Management initializes the processes.
    |

    | | | Running | kRunning | Processes transition to Running state and their Execution
    State changes to kRunning, indicating they are actively executing. |

    | Request FG1_State2 | FG1_State2 | Running | kTerminating | SM requests FG1_State2,
    processes in FG1 remain in Running state, but their Execution State changes to
    kTerminating, signaling termination. |

    | | | Terminated | kTerminated | Processes transition to Terminated state, and
    their Execution State changes to kTerminated, indicating they have completed execution.
    |


    The example above illustrates the interaction between states in an Adaptive AUTOSAR
    system. As State Management requests different Function Group States, the Process
    and Execution States of the processes within the Function Group change accordingly.
    This helps the system to dynamically manage resources and maintain optimal performance.


