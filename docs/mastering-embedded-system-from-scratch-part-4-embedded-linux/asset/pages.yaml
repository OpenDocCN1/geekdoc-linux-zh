  md: 'a. Not Recently Used (NRU): This algorithm classifies pages into four categories
    based on the "referenced" and "modified" bits. NRU selects a random page from
    the lowest non-empty category for replacement. This is a simple, low-overhead
    algorithm, but its performance is generally worse than true LRU.


    b. Clock: This algorithm uses a circular buffer (similar to a clock) and a "second
    chance" mechanism. When searching for a page to replace, the algorithm checks
    the "referenced" bit of each page. If the bit is set, it is cleared, and the page
    gets a "second chance." If the bit is not set, the page is selected for replacement.
    This algorithm is more efficient than true LRU but may not perform as well in
    some cases.


    c. Aging: This algorithm simulates LRU by maintaining an "age" counter for each
    page. At regular intervals, the "referenced" bit of each page is shifted into
    the age counter, and the age counter is shifted right. The page with the lowest
    age counter value is selected for replacement. Aging provides a good approximation
    of LRU with less overhead, but it still requires regular updates to the age counters.


    The choice of a page replacement algorithm depends on the specific requirements
    and constraints of the system, as well as the trade-offs between complexity, overhead,
    and performance.


    +   ▶ In operating systems, whenever a new page is referred and not present in
    memory, page fault occurs and Operating System replaces one of the existing pages
    with newly needed page.

    ▶ Different page replacement algorithms suggest different ways to decide which
    page to replace.

    ▶ The target for all algorithms is to reduce number of page faults.

