    # Linux version history


    Here is a brief overview of the major releases and version history of Linux:


    +   * Linux 0.01 (1991): This was the very first release of Linux, created by
    Linus Torvalds as a simple terminal emulator.


    +   * Linux 0.10 (1992): This release added support for hard disks, improved memory
    management, and added several new system calls.


    +   * Linux 1.0 (1994): This was the first stable release of Linux, and included
    support for TCP/IP networking, virtual memory, and the ext2 file system.


    +   * Linux 2.0 (1996): This release added support for symmetric multiprocessing
    (SMP), allowing Linux to run on multiple processors.


    +   * Linux 2.2 (1999): This release added support for USB devices, the XFS file
    system, and several new network protocols.


    +   * Linux 2.4 (2001): This release included significant improvements to the
    scalability and performance of Linux, as well as support for the journaling ext3
    file system.


