  md: 'In the Device Tree Source (DTS) syntax, there are several mechanisms for addressing
    devices and memory regions:


    +   Ranges: The ranges property is used to specify an address translation between
    two address spaces. This is typically used to translate device addresses from
    a bus-specific address space to a system memory address space.


    ```

    compatible = "vendor,device";nreg = <0x1000 0x100>;

    ranges = <0x0 0x10000000 0x8000>;

    ```


    In this example, the ranges property specifies that the device''s address range
    (0x1000-0x10ff) is translated to the system memory address range (0x8000-0x80ff).


    +   memory mapped address device tree must specify how to translate addresses
    from one domain to another.

    The ranges property is used for this purpose.


    Offset 0x0000 is mapped to address range 0x08000000-0x080fff

    Offset 0x1000 is mapped to address range 0x08001000-0x081fff

    Offset 0x2000 is mapped to address range 0x08002000-0x082fff


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_325_0.png)


    +   Non-memory mapped devices: For devices that are not memory-mapped, the reg
    property is used to specify the device''s address and size.


    ```

    compatible = "vendor,device";nreg = <0x1000 0x100>;

    ```


    In this example, the reg property specifies that the device is located at address
    0x1000 with a size of 0x100 bytes.


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_325_1.png)'
