  md: "# CHAPTER 14. ADVANCED TOPICS\n\n```\nloop_rate.sleep();\n++count;\n}\nreturn\
    \ 0;\n}\n```\n\nThis code creates a new ROS node talker. It initializes a ROS\
    \ node, creates a publisher for the chatter topic, and then publishes a message\
    \ on the topic at a rate of 10 Hz.\n\n+   - Create the listener node: Once you\
    \ have created the chatter node, you can create the listener node. The listener\
    \ node will subscribe to the chatter topic and print out any messages it receives.\
    \ You can create the listener node using the following code:\n\n```\n#include\
    \ <ros/ros.h>\n#include <std_msgs/String.h>\n\nvoid chatterCallback(const std_msgs::String::ConstPtr&\
    \ msg)\n{\n  ROS_INFO(\"I heard: [%s]\", msg->data.c_str());\n}\n\nint main(int\
    \ argc, char **argv)\n{\n  ros::init(argc, argv, \"listener\");\n  ros::NodeHandle\
    \ nh;\n\n  ros::Subscriber sub = nh.subscribe(\"chatter\", 1000, chatterCallback);\n\
    \  ros::spin();\n\n  return 0;\n}\n```\n\nThis code creates a new ROS node listener.\
    \ It initializes a ROS node, creates a subscriber for the chatter topic, and then\
    \ prints out any messages it receives on the topic.\n\n+   - Build and run the\
    \ nodes: Once you have created both nodes, you need to build and run them. You\
    \ can do this using the following commands:\n\n```\ncd ~/catkin_ws\ncatkin_make\n\
    source devel/setup.bash\nroscore\n```\n\nIn a new terminal window, run the talker\
