- img_proc: true
  md: '# CHAPTER 13. INTRODUCTION TO EMBEDDED LINUX


    ![](img/bc86631e65e541c1c58ec0ab72a978e0_319_0.png)


    For example, to list the nodes at the root level of the Device Tree, one can use
    the ls command:


    ```

    $ ls /sys/firmware/devicetree/base/

    #address-cells      interrupt-cells      model

    #size-cells        interrupt-parent    name

    compatible                         ranges

    ```


    In this example, the root node of the Device Tree has several children nodes,
    each represented as a file or subdirectory in /sys/firmware/devicetree/base directory.
    The compatible property, for example, can be read from the compatible file:


    ```

    $ cat /sys/firmware/devicetree/base/compatible

    vendor,board-name

    ```


    To further explore the contents of the Device Tree, one can use the dtc tool to
    "unpack" the Device Tree into a human-readable format. On a system where dtc is
    available, one can run the following command:


    ```

    $ dtc -I fs /sys/firmware/devicetree/base

    ```


    This will output the entire Device Tree in a human-readable format, showing the
    hierarchy of nodes and their properties.


    Overall, the /sys/firmware/devicetree/base directory and the dtc tool provide
    useful tools for exploring the contents of the Device Tree on the target system.


