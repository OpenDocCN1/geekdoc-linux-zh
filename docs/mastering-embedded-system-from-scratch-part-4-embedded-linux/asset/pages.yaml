    8. Bags: Bags are a way to record and play back data from a ROS system. They are
    useful for debugging and testing, and can be replayed recorded data to test a
    system without needing the actual hardware.


    9. RViz is a visualization tool that allows developers to view and interact with
    the data being produced by a ROS system. It can be used to debug and test systems,
    and to visualize the behavior of robots and sensors.


    Overall, these components work together to provide a flexible and powerful system
    for developing robot applications with ROS.


