    # ## Mdev in /etc/init.d/rc


    In embedded Linux systems, the system initialization script, `/etc/init.d/rcS`,
    includes the mdev utility for creating device files in `/dev` during the boot
    process.


    mdev is a small, fast, and flexible replacement for the udev device manager. It
    is part of BusyBox, a collection of Unix utilities that are used in embedded systems.


    When mdev is started, it reads a configuration file, `/etc/mdev.conf`, to determine
    how to create device files for various hardware devices. The configuration file
    maps device devices to device names and permissions. For example, the following
    line in the configuration file creates a device file for a hypothetical "mdev"
    driver:


    ```

    mdev*    0:0    0660    /dev/mdev.%d

    ```


    When the "mdev" is detected by the kernel, mdev creates a device file with the
    name `/dev/mdev.<minor number>` of 0660 (owner root, group root, read/write for
    owner and group).

    The % in the device name is replaced with the minor number of the device. Minor
    numbers are used to distinguish between different devices of the same driver.
    For example, if the "mdev" driver has two devices, they might have minor numbers
    of 0 and 1.


