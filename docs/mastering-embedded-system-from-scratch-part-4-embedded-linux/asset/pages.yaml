    # Composite Commands


    Composite commands are sequences of shell commands that are grouped together and
    treated as a single command. They can be used to simplify complex tasks or automate
    frequently performed tasks. Here are some examples of commonly used composite
    commands:


    +   - Sequential commands in Linux are commands that are executed in a sequential
    order, one after another. The output of the first command is passed as input to
    the second command and so on. Sequential commands are usually separated by a semicolon
    (;) or a newline character.


    Here are some examples of sequential commands:


    +   1. Command1 ; Command2: This executes Command1 first, followed by Command2.

    2. Command1 && Command2: This executes Command1 first, and only if it is successful
    (i.e. it returns a zero status code), Command2 is executed.

    3. Command1 || Command2: This executes Command1 first, and only if it fails (i.e.
    it returns a non-zero status code), Command2 is executed.

    4. Command1 | Command2: This passes the output of Command1 as input to Command2.

    5. Command1 > file.txt: This redirects the output of Command1 to a file name file.txt.

    6. Command1 < file.txt: This redirects the input of Command1 from a file name
    file.txt.


    Here is an example that demonstrates the use of sequential commands:


    ```

    ls -l ; echo "This is the end of the ls command"

    ```


