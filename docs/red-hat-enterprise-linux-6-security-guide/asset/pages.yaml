    # 2.2.4.3. Beware of Syntax Errors


    The NFS server determines files to export and hosts them to these directories
    by consulting the **/etc/exports** file. Be careful not to add extraneous spaces
    when editing this file.


    For instance, the following line in the **/etc/exports** file shares the directory
    **/tmp/nfs/**` to the host **bob.example.com** with read/write permissions.


    ```

    /tmp/nfs/          bob.example.com (rw)

    ```


    The following line in the **/etc/exports** file, on the other hand, shares the
    directory to the host **bob.example.com** with read-only permissions and shares
    it to the world with read/write permissions by a single space character after
