    # 2.1.9. Session Locking


    Users may need to leave their workstation unattended for a number of reasons during
    everyday operation. This could present an opportunity for an attacker to access
    the machine, especially in environments with insufficient physical security measures
    (see Section 1.1.3.1, “Physical Controls”). Laptops are especially exposed since
    their mobility interferes with physical security. You can alleviate these risks
    by using locking features that prevent access to the system until a correct password
    is entered.


    > Note

    The main advantage of locking the screen instead of logging out is that a lock
    allows the user''s processes (such as file transfers) to continue running. Logging
    out would stop these processes.


    # 2.1.9.1. Locking GNOME using gnome-screensaver-command


    The default desktop environment for Red Hat Enterprise Linux 6, GNOME, includes
    a feature which allows users to lock their screen at any time. There are several
    ways to activate the lock:


    +   * Press the key combination specified in System → Preferences → Keyboard Shortcuts
    → Desktop → Lock screen. The default combination is Ctrl+Alt+L.

    * Select System → Lock screen on the panel.

    * Execute the following command from a command line interface:


    ```

    gnome-screensaver-command -1

    ```


