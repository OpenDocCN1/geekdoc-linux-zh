    ```

    # iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    # iptables -A OUTPUT -p tcp --sport 22 -j ACCEPT

    ```


    These rules allow inbound and outbound access for an individual system, such as
    a single PC directly connected to the Internet or a firewall/gateway. However,
    they do not allow nodes behind the firewall/gateway to access these services.
    To allow LAN access to these services, you can use Network Address Translation
    (NAT) with iptables filtering rules.


    # 2.8.5. FORWARD and NAT Rules


    Most ISPs provide only a limited number of publicly routable IP addresses to the
    organizations they serve.


    Administrators must therefore, find alternative ways to share access to Internet
    services without giving public IP addresses to every node on the LAN. Using private
    IP addresses is the most common way of allowing nodes on a LAN to properly access
    internal and external network services.


    Edge routers (such as firewalls) can receive incoming transmissions from the Internet
    and route the packets to the intended LAN node. At the same time, firewalls/gateways
    can also route outgoing requests from a LAN node to the remote Internet service.


    This forwarding of network traffic can become dangerous at times, especially with
    the availability of modern cracking tools that can spoof internal IP addresses
    and make the remote attacker''s machine act as a node on your LAN.


    The FORWARD chain provides routing and forwarding policies that can be implemented
    to prevent abnormal usage of network resources.


    The FORWARD chain allows an administrator to control where packets can be routed
    within a LAN. For example, to allow forwarding for the entire LAN (assuming the
    firewall/gateway is assigned an internal IP address on eth1), use the following
    rules:


    ```

    # iptables -A FORWARD -i eth1 -j ACCEPT

    # iptables -A FORWARD -o eth1 -j ACCEPT

    ```


    This rule gives systems behind the firewall/gateway access to the internal network.
    The gateway routes packets from one LAN node to its intended destination node,
    passing all packets through its eth1 device.'
