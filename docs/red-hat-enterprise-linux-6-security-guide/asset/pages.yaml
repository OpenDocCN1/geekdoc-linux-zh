    the remaining passphrases for authentication.


    # 3.2.4.5. Creating Encrypted Block Devices in Anaconda


    You can create encrypted devices during system installation. This allows you to
    easily configure a system with encrypted partitions.


    To enable block device encryption, check the **Encrypt System** checkbox when
    selecting automatic partitioning or the **Encrypt** checkbox when creating an
    individual partition, software RAID array, or logical volume. After finish partitioning,
    you will be prompted for an encryption passphrase. If you have pre-existing LUKS
    devices and provided correct passphrases for them earlier in the install process
    the entry dialog will also contain a checkbox. Checking this checkbox indicates
    that you would like the new passphrase to be added to an available slot in each
    of the pre-encrypted block devices.


    > Note


    Checking the **Encrypt System** checkbox on the **Automatic Partitioning** screen
    and choosing **Create custom layout** does not cause any block devices to be encrypted
    automatically.


    > Note


    You can use a **kickstart** file to set a separate passphrase for each new block
    device. Also, kickstart allows you to specify a different type of encryption if
    the Anaconda default cipher, aes-xtplain64, does not suit you. In dependency on
    a device you want to encrypt, you can specify the `--cipher=<cipher-string>` with
    the `autopart.partition.logvol`, and `raid` directives. This has no other effect.
    For more information about the `<cipher-string>` format and possible options with
    `--encrypted` cipher combinations, refer to Section 3.2.4.1, "LUKS Implementation
