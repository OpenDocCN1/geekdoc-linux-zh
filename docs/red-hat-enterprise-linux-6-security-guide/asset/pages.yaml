    # 1.2.1. Establishing a Methodology


    To aid the selection of tools for a vulnerability assessment, it is helpful to
    establish a vulnerability assessment methodology. Unfortunately, there is no predefined
    or industry approved methodology at this time; however, common sense and best
    practices can act as a sufficient guide.


    What is the target? Are we looking at one server, or are we looking at our entire
    network or within the network? Are we external or internal to the company? The
    answers to these questions are important as they help determine not which tools
    to select but also the manner in which they are used.


    To learn more about establishing methodologies, refer to the following websites:


    +   - http://www.issec.com/osstmn The Open Source Testing Methodology Manual (OSSTMM)

    - http://www.owasp.org/ The Open Web Application Security Project


    # 1.2.3. Evaluating the Tools


    An assessment can start using some form of an information gathering tool. When
    assessing the entire network, map the layout to find the hosts that are running.
    Once located, examine each host individually. Focusing on these hosts requires
    another set of tools. Knowing which tools to use may be the crucial step in finding
    vulnerabilities.


    Just as in any aspect of everyday life, there are many different tools that perform
    the same job. This concept applies to performing vulnerability assessments as
    well. There are tools specific to operating systems, applications, and networks
    (based on the protocols used). Some tools are free; others are not. Some are intuitive
    and easy to use, while others are cryptic and poorly documented but features that
    other tools do not.


    Finding the right tools be a daunting task and in the end, experience counts.
    If possible, set up a test lab and try out as many tools you can, noting the strengths
    and weaknesses of each. Read documentation with the tool (for example, in a README
