    # 2.1.11. Personal Firewalls


    After the necessary network services are configured, it is important to implement
    a firewall.


    > **Important**nConfigure the necessary services and implement a firewall *before*
    connecting to the Internet or any other network that you not trust.


    Firewalls prevent network packets from accessing the system''s network interface.
    If a request is made to a port that is blocked by a firewall, the request is ignored.
    If a service is listening on one of these blocked ports, it does not receive the
    packets and is effectively disabled. For this, ensure that you block access to
    ports not when using a firewall, while not blocking access to ports used by configured
    services.


    For most users, the best tool for configuring a simple firewall is the graphical
    firewall configuration tool with Red Hat Enterprise Linux: the **Firewall Configuration
    Tool (system-config-firewall)**. This tool creates `iptables` rules for a general-purpose
    firewall using a control panel interface.


    Refer to Section 2.8.2, "Basic Firewall Configuration" for more information about
    using this application'
