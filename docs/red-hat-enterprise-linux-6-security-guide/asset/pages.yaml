  md: '# # Encryption Standards


    #  A.1. Synchronous Encryption


    #  A.1.1. Advanced Encryption Standard - AES


    In cryptography, the Advanced Encryption Standard (AES) is an encryption standard
    adopted by the U.S. government. The standard comprises three block ciphers: AES-128,
    AES-192 and AES-256, from a larger collection originally published by Rijndael.
    Each AES cipher has a 128-bit block size, with keys of 128, 192 and 256 bits,
    respectively. The AES ciphers have been analyzed extensively and are now used
    worldwide, as was the case with its predecessor, the Data Encryption Standard
    (DES). [8]


    #  A.1.1. AES History


    AES was announced by National Institute of Standards and Technology (NIST) as
    U. FIPS PUB 197 (FIPS 197) on November 26, 2001 after a 5-year standardization
    process in which competing ciphers were presented and evaluated before Rijndael
    was selected as the most suitable (Advanced Encryption Standard process for more
    details). It became effective as the standard May 26, 2002. It is available in
    many different encryption packages. AES is the first publicly accessible and open
    cipher adopted by the NSA for top secret information (Security of AES, below).
    [9]


    The Rijndael cipher was developed by two Belgian cryptographers, Joan Daemen and
    Vincent Rijmen, and submitted by the AES selection process. Rijndael (pronounced
    reinda!) is a portmanteau of the names of the two inventors. [10]


    #  A.1.2. Data Encryption Standard - DES


    The Data Encryption Standard (DES) is a block cipher (a form of shared secret
    encryption) that was selected by the National Bureau of Standards as an official
    Federal Information Processing Standard (FIPS) for the United States in 1976 and
    has subsequently undergone widespread use internationally. it is based on a symmetric-key
    algorithm that uses a 56-bit key. The algorithm was initially controversial with
    classified design, a relatively short key length, and suspicions about a National
    Security Agency (NSA) backdoor. DES consequently came under academic scrutiny
    which motivated the modern understanding of block ciphers and cryptanalysis. [11]


    #  A.1.2.1. DES History


    DES is now considered to be insecure for many applications. This is chiefly due
    to the 56-bit key size being too small


    In some documentation, a distinction is made between DES as a standard and DES
    the algorithm which is referred to as the DEA (the Data Encryption Algorithm).
    When spoken, "DES" is either spelled out as an abbreviation (/diːdiːˈɛs/), or
    pronounced as a one-syllable acronym (/dez/). [13]


    #  A.2. Public-key Encryption


    Public-key cryptography is a cryptographic approach, employed by many cryptographic
    algorithms and cryptosystems, whose distinguishing characteristic is that of the
    asymmetric instead of or'
