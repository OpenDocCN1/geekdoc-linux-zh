    # 2.1.8. Administrative Controls


    When administering a home machine, the user must perform some tasks as the root
    user or by acquiring effective privileges via a setuid program, such as sudo or
    su. A setuid program that operates via the user ID (UID) of the program''s owner
    rather than the user operating the program. Such programs are denoted by an s
    in the section of a long format listing, as in the following example:


    ```

    $ ls -l /bin/su

    rwxr-xr-x. 1 root 34904 Mar 10 2011 /bin/su

    ```


    > Note

    The s may be upper case or lower case. If it appears as upper case, it means that
    the underlying permission has not been set.


    For the system administrators of an organization, choices must be made as to how
    much administrative access users within the organization should to have their
    machine. Through a PAM module called pam_console.so, some activities normally
    reserved only for the root user, such as rebooting and removing removable media
    are available for the first user who logs in at physical console (refer to Managing
    Single-On and Smart Cards for more information about the pam_console.so module).
    However, other important system administration tasks, such as altering network
    settings, configuring a new mouse, or mounting devices, are not possible without
    administrative privileges. As a result, system administrators must decide how
    much access the users on their network should receive.


    # 2.1.8.1. Allowing Root Access


    If users within an organization are trusted and computer-literate, then allowing
    root access may not be an issue. Allowing root access by users means many activities,
    like adding devices or configuring network interfaces, can be handled by the individual
    users, leaving system administrators free to deal with network security and other
    important issues.


    On the other hand, giving root access to individual users can lead to the following
    issues:


    +   Misconfiguration — Users with root access can misconfigure their machines
    and require assistance to resolve issues. Even worse, they might open security
    holes without knowing it.'
