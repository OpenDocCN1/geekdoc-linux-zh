    command, where action can be one of the following:


    +   - stop stops auditd.

    - restart restarts auditd.

    - reload or force-reload reloads the configuration of auditd from the /etc/audit/auditd.conf
    file.

    - rotate rotates the log in the /var/log/audit/ directory.

    - resume resumes logging of Audit event after it has been previously suspended,
    for example, when there is not enough free space on the disk partition that holds
    the Audit log files.

    - condrestart or try-restart restarts auditd only if it is already running.

    - status displays the running status of auditd.


    The Audit system operates on a set of rules that define what is to be captured
    in the log files. There are three types of Audit rules that can be specified:


    +   - Control rules allow the Audit system''s behavior and some of its configuration
    to be modified.

    - File system rules also known as watches, the auditing of access to a particular
    file or a directory.

    - System calls allow logging of calls that any specified program makes.


    Audit rules can be specified on the command line with the auditctl utility (note
    that these rules are not persistent across reboots), or written in the /etc/audit/audit.rules
    file. The following sections summarize both approaches defining Audit rules.


    # 7.5.1. Defining Audit Rules with the auditctl Utility


    > All commands, which interact with the Audit service and the Audit log files
    require root privileges. Ensure you execute these commands as the root user.


    The auditctl command allows you to control the basic functionality of the Audit
    system and to define rules that decide Audit events are logged.


    # Defining Control Rules


    The following are some of the control rules that allow you to modify the behavior
    of the Audit system:


    +   - b sets the maximum amount of existing Audit buffers in the kernel, for example:

    ```

    auditctl -b 8192

    ```

    - f sets the action that is performed when a critical error is detected, for example:

    ```

    auditctl -f 2

    ```'
