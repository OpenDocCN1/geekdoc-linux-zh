- img_proc: true
  md: 'used. To turn your system (kernel and user space) into FIPS mode, follow these
    steps:


    +   1. For proper operation of the in-module integrity verification, the prelink
    has to be disabled. This can be done by setting **PRELINKING=no** in the **/etc/sysconfig/prelink**
    configuration file.

    Existing prelink, if any, should be undone on all system files using the **prelink
    -u -a** command.


    +   2. Next, install the **dracut-fips** package:


    ```bash

    # yum install dracut-fips

    ```


    > Note

    FIPS integrity verification is performed when the *dracut-fips* package is present
    on the system, regardless of whether the system operates in FIPS mode or not.
    However, the integrity verification results are ignored (or only logged) if the
    system or a shared library is in FIPS mode, when *dracut-fips* is present.


    +   3. Recreate the **initramfs** file:


    ```bash

    # dracut -f

    ```


    > Warning

    This operation will overwrite the existing **initramfs** file.


    +   4. Modify the kernel command line of the current kernel in the **/boot/grub/grub.conf**
    file by adding the following option:


    ```bash

    fips=1

    ```


    > Note

    If **/boot** or **/boot/efi** reside on separate partitions, the kernel parameter
    **boot=partition of /boot** or **/boot/efi** must be added to the kernel command
    line.

    Partitions can be identified with the **df /boot** or **df /boot/efi** command
    respectively.

    For example:


    ```text

    $ df /boot

    Filesystem      1K-blocks  Available Use% Mounted on

    /dev/sda1       495844    53780 416644 12% /boot

    ```


    In the example above, the /boot partition is located on **/dev/sda1**. Therefore,
    the following string needs to be appended to the kernel command line:


    ```bash

    boot=/dev/sda1

    ```


    +   5. Reboot your system.'
