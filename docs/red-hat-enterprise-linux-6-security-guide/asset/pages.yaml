    # 2.8.9.2.5. Target Options


    When a packet has matched a particular rule, the rule can direct the packet to
    a number of different targets which determine the appropriate action. Each chain
    has a default target, which is used if none of the rules on that chain match a
    packet or if none of the rules match the packet specify a target.


    The following are the standard targets:


    +   - <user-defined-chain> — A user-defined chain within the table. User-defined
    chain names must be unique. This target passes the packet to the specified chain.


    +   - ACCEPT — Allows the packet through to its destination or another chain.


    +   - DROP — Drops the packet without responding to the requester. The system
    that sends the packet is not notified of the failure.


    +   - QUEUE — The packet is queued for handling by a user-space application.


    +   - RETURN — Stops checking rules in the current chain. If the packet with a
    RETURN target matches a rule in a chain called from another, the packet is returned
    to the first chain to resume checking where it left off. The RETURN rule is on
    a built-in chain and the packet cannot move up to its previous chain, the default
    target for the current chain is used.


    In addition, extensions are available which allow other targets to specify. These
    extensions are called target modules or match option modules and only apply to
    specific tables and situations. Refer to [Section 2.8.9.2.4.4, “Additional Match
    Option Modules”] for more information about match option modules.


    Many extended target modules exist, most of which only apply to specific tables
    or situations. Some of the most popular target modules included by default in
    Red Hat Enterprise Linux:


    +   - LOG — Logs all packets that match this rule. Because the packets are logged
    by the kernel,'
