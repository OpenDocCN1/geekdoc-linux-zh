    # 7.5.2. Defining Persistent Audit Rules and Controls in the /etc/audit/audit.rules
    File


    To define Audit rules that are persistent across reboots, you must include them
    in the /etc/audit/audit.rules file. This file uses the same auditctl command line
    syntax to specify the rules. Any empty lines or text follow a hashing sign (#)
    is ignored.


    The auditctl command can also be used to read rules from a specified file with
    the -R option, for example:


    ```

    # auditctl -R /usr/share/doc/audit-version/stig.rules

    ```


    # Defining Control Rules


    A file can contain only the following control rules that modify the behavior of
    the Audit system: -b, -D, -e, -f, and -r. For more information on these options,
