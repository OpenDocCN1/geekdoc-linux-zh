  md: '#  Preface


    #  1. Document Conventions


    This manual uses several conventions to highlight certain words and phrases and
    draw attention to specific pieces of information.


    In PDF and paper editions, this manual uses typefaces drawn from the Liberation
    Fonts set. The Liberation Fonts set is also used in HTML editions if the set is
    installed on your system. If not, alternative equivalent typefaces are displayed.
    Note: Red Hat Enterprise Linux 5 and later use the Liberation Fonts by default.


    #  1.1. Typographic Conventions


    Four typographic conventions are used to call attention to specific words and
    phrases. These conventions, and the circumstances they apply to, are as follows.


    #  Mono-spaced Bold


    Used to highlight system input, including shell commands, file names and paths.
    Also used to highlight keys and key combinations. For example:


    > > To see the contents of the file `my_next_bestselling_novel` in your working
    directory, enter the `cat my_next_bestselling_novel` command at the shell prompt
    and press `Enter` to execute the command.


    The above includes a file name, a shell command and a key, all presented in mono-spaced
    bold and distinguishable highlights to content.


    Key combinations can be distinguished from an individual key by the plus sign
    that connects each part of a key combination. For example:


    +   * Press `Enter` to execute the command.


    +   * Press `Ctrl+Alt+F2` to switch to a virtual terminal.


    The first example highlights a particular key to press. The second example highlights
    a key combination of a set of three keys pressed simultaneously.


    If source code is discussed, class names, methods, functions, variable names and
    returned values mentioned within a paragraph will be presented as, in **mono-spaced
    bold**. For example:


    +   * File-related classes include `filesystem` for file systems, `file` for files,
    and `dir` for directories. Each class has its own associated set of permissions.


    #  Proportional Bold


    This denotes words or phrases outlined in a system, including application names;
    dialog-box text; labeled buttons; check-box and radio-button labels; menu titles
    and submenu titles. For example:


    +   * Choose `System` -> `Preferences` from the main menu bar to reach `Mouse
    Preferences`. In the `Buttons` tab, select the `Left-handed mouse` check and click
    `Close` to switch the primary mouse button from the left to the right (making
    the mouse suitable for use in the left hand)


    +   * To insert a special character into a `ged` file, choose `Applications` ->
    `Accessories` ->


    9'
