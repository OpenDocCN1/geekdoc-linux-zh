    # 2.10.03. Insecure Services


    Potentially, any network service is insecure. This is why turning off unused services
    is so important. Exploits for services are routinely revealed and patched, making
    it very important to regularly update packages associated with any network service.
    Refer to Section 1.5, "Security Updates" for more information.


    Some protocols are inherently more insecure than others. These include varieties
    such as:


    +   - Transmit Usernames and Passwords Over a Network Unencrypted — Many protocols,
    such as Telnet and FTP, do not encrypt the authentication session and should be
    avoided whenever possible.


    +   - Transmit Sensitive Data Over a Network Unencrypted — Many protocols transmit
    data over the unencrypted network. These protocols include Telnet, FTP, HTTP,
    and SMTP. Many file systems, such as NFS and SMB, also transmit information over
    the unencrypted network. It is the user''s responsibility when using these protocols
    to limit what kind of data is transmitted.


