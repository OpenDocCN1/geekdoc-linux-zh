    # 2.7.4. VPN Configurations Using OpenSwan


    OpenSwan does not use the terms "source" or "destination". Instead, it uses the
    terms "left" and "right" to refer to endpoints (the hosts). This allows the configuration
    to be on both end points in cases, most administrators use "left" for the local
    host and "right" for the remote host. The keywords connecting "left" and "right"
    are arbitrary choices. You can interpret literally whatever left is on the host
    of your network diagram. OpenSwan will auto-detect whether it is "left" or "right".
    In examples, the host referred to as "left" by the OpenSwan commands is also given
    a host name to match. Usually "west" and "east" are used for the host name to
    match "left" and "right" respectively. Throughout this guide, we will use west.example.com
    as "left" and east.example.com as "right".


    There are three commonly methods for authentication of endpoints:


    +   * Pre-Shared Keys (PSK) is the simplest authentication method. PSK should
    consist of random characters and have a length of 20 characters. Due to the dangers
    of non-random and short PSKs, this is not available when the system is running
    in FIPS mode

    * RSA keys are commonly used for static host-to-host or subnet-to-subnet IPsec
    configurations. The hosts are manually configured with each other''s public RSA
    key. This method does not work well when many hosts need to setup IPsec tunnels
    to each other.

    * X.509 certificates are commonly used for large scale deployments where there
    are many hosts that need to connect to a central IPsec gateway. A central certificate
    authority (CA) is used to sign RSA certificates for hosts or users. This CA is
    responsible for relaying trust, including the revocations of individual hosts
    or users.


