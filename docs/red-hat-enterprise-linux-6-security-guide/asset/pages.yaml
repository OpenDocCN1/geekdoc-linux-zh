    # 2.1.9.2. Locking Virtual Consoles Using vlock


    Users also need to lock a virtual console. This can be done using a utility called
    vlock. To install this utility, execute the following command as root:


    ```

    # yum install vlock

    ```


    After installation, any console session can be locked using the vlock command
    without any additional parameters. This locks the currently active virtual console
    session while still allowing access to the others. To prevent access to all virtual
    consoles on the workstation, execute the:


    ```

    vlock -a

    ```


    In this case, vlock locks the currently active console and the -a option prevents
    switching to other virtual consoles.


    Refer to the vlock(1) man page for additional information.


