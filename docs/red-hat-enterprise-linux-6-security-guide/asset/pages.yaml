  md: '# 1.3.3.2. Unpatched Services


    Most server applications are included in a default installation are solid, thoroughly
    tested pieces of software. Having been in production environments for many years,
    their code has been thoroughly refined and many of the bugs have been found and
    fixed.


    However, there is no such perfect as software and there is always room for further
    refinement. newer software is not as rigorously as one might expect, because of
    its recent arrival to production environments or it may not be as popular as other
    server software.


    Developers and system administrators often find exploitable bugs in server applications
    and publish the information on bug tracking and security-related websites such
    as the Bugtraq mailing list (http://www.securityfocus.com/) or the Computer Emergency
    Response Team (CERT) website. Although these mechanisms are an effective way of
    alerting the community to security vulnerabilities, it is particularly true because
    crackers have access to these same vulnerability tracking services and will use
    the information to track unpatched systems whenever they can. Good system administration
    requires vigilance, constant bug tracking, and proper system management to ensure
    a more secure computing environment.


    Refer to [Section 1.5, "Security Updates"] for more information about keeping
    a system up-to-date.


    # 1.3.3.3. Inattentive Administration


    Administrators who fail to patch their systems are one of the greatest threats
    to server security. According to the SysAdmin, Audit, Network, Security Institute
    (SANS), the primary cause of security vulnerability is "assign untrained people
    to maintain security and provide neither the training time to make it possible
    to do the job.\[5] This applies to inexperienced administrators as it does to
    overconfident or motivated administrators.


    Some administrators fail to patch their services and workstations, while others
    fail to watch log messages from the system kernel or network traffic. Another
    common error is when databases have default passwords or keys services are left
    unchanged. For example, some databases have default administration passwords because
    the database developers assume that system administrator changes these passwords
    immediately after installation. If a database administrator fails to change this
    password, even an inexperienced cracker can use a well-known default password
    to gain administrative privileges to the database. These are only a few examples
    of how inattentive administration can lead to compromised servers.


    # 1.3.3.4. Inherently Insecure Services


    Even the most vigilant organization can fall to vulnerabilities if the network
    services they choose are inherently insecure. For instance, there are many services
    developed under the assumption that they are used over trusted networks; however,
    this assumption fails as soon as the service becomes available over the Internet
    — which is inherently untrue.


    One category of network services are those that require encrypted usernames and
    passwords for authentication. Telnet and FTP are two such services. If packet
    sniffing software is monitoring traffic between the remote user and service usernames
    and passwords can be easily intercepted.


    Inently, such attacks can also easily fail to protect the security industry they
    target the man-in-the-middle-attack. In this type of attack, a cracker redirects
    traffic by cracking a named server on the network to point to his instead of the
    intended server. Once someone opens a remote session to it, the attacker''s machine
    acts as an invisible conduit, sitting quietly between the remote service and the
