    # 2.1.2.2.2. Disabling Interactive Startup


    Press the I key at the beginning of the boot sequence allows you to start up your
    system interactively. During an interactive startup, this may allow an attacker
    who gains physical access to your system to disable the securityrelated services
    and gain access to the system.


    To prevent users from starting up the system interactively, as root, disable the
    **PROMPT** parameter in the /etc/sysconfig/init file:


    ```

    PROMPT=no

    ```


