  md: 'The ip6tables command syntax is identical to iptables in every aspect except
    that it supports 128-addresses. For example, use the following command to enable
    SSH connections on an IPv6-aware network server:


    ```

    # ip6tables -A INPUT -i eth0 -p tcp -s 3:ffff::1/128 --dport 22 -j ACCEPT

    ```


    For more information about IPv6 networking, refer to the IPv6 Information Page
    at http://www.ipv6.org/.


    # 2.8.9 IPTables


    Included with Red Enterprise Linux are advanced tools for network packet filtering
    — the process of controlling network packets as they enter, move, and exit the
    stack within the kernel. Kernel versions prior to 2 relied on iptchains for packet
    filtering and lists of rules to be packets at each step of the filtering process.
    The kernel 2 introduced iptables (also called netfilter), which is similar to
    iptchains but greatly expands the scope and control available for filtering networks.


    This chapter focuses on packet filtering basics, explains various options available
    with iptables commands, and explains how filtering rules can be preserved between
    system boots.


    > Important

    The default firewall mechanism in the 2.4 and later kernels is iptables, but iptables
    cannot be used if iptchains is already running. If iptchains is present at boot
    time, the kernel issues an error and fails to start iptables.

    The functionality of iptchains is not affected by these errors.


    # 2.8.9.1. Packet Filtering


    The kernel uses the Netfilter facility to filter packets, allowing some of them
    to be received or pass through the system while stopping others. This facility
    is built in the Linux kernel, and has five built-in tables or lists, as follows:


    +   - filter — The default table for handling network packets.

    - nat — Used to alter packets that create a new connection and for Network Address
    Translation (NAT).

    - mangle — Used for specific types of packet alteration.

    - raw — Used for marking exemptions from connection tracking in combination with
    the NOTTRACK target.

    - security — Used for Mandatory Access Control (MAC) networking rules, such as
    those enabled by the SECMARK and CONNMARK sets.


    Each table has a group of built-in chains, which correspond to the actions performed
    by the packet by netfilter.


    The built-in chains for the filter table are:


    +   - INPUT — Applies to network packets that are targeted for the host.

    - OUTPUT — Applies to locally-generated network packets.

    - FORWARD — Applies to network packets routed through the host.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'The built-in chains for the **nat** table are as follows:


    +   - PREROUTING — Applies to network packets when they arrive.


    +   - OUTPUT — Applies to locally-generated network packets before they are sent
    out.


    +   - POSTROUTING — Applies to network packets before they are sent out.


    The built-in chains for the **mangle** table are as follows:


    +   - INPUT — Applies to network packets targeted for the host.


    +   - OUTPUT — Applies to locally-generated network packets before they are sent
    out.


    +   - FORWARD — Applies to routed packets routed through the host.


    +   - PREROUTING — Applies to incoming network packets before they are routed.


    +   - POSTROUTING — Applies to network packets before they are sent out.


    The built-in chains for the **raw** table are as follows:


    +   - OUTPUT — Applies to locally-generated network packets before they are sent
    out.


    +   - PREROUTING — Applies to incoming network packets before they are routed.


    The built-in chains for the **security** table are as follows:


    +   - INPUT — Applies to network packets targeted for the host.


    +   - OUTPUT — Applies to locally-generated network packets before they are sent
    out.


    +   - FORWARD — Applies to network packets routed through the host.


    Every network packet received or sent from a Linux system is subject to at least
    one table. However, a packet may be subjected to multiple rules within each table
    emerging at the end of the chain. The structure and purpose of these rules may
    vary, but they usually seek to identify a packet coming from or going to a particular
    IP address, or set of addresses, when using a particular protocol and network
    service. The following image outlines how the flow of packets is examined by the
    iptables subsystem:


    ![](img/fa49fe194038627f7baabbe849816a0e_121_0.png)


    **Figure 2.6.** Packet filtering in IPTables'
  merge: -1
