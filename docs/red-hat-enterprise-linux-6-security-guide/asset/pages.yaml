    # 2.1.2.1.1. Securing-x86 Platforms


    Other architectures use different programs to perform low-level tasks roughly
    equivalent to those of the BIOS on x86 systems. For instance, Intel® Itanium™
    computers use the Extensible Firmware Interface (EFI) shell.


    For instructions on password protecting BIOS-like programs on other architectures,
    refer to the manufacturer''s instructions.


    # 2.1.2.2. Boot Loader Passwords


    The reasons for password protecting a Linux boot loader are as follows:


    +   1. Preventing Access to Single User Mode — If attackers can boot the system
    into single user mode, they are logged in automatically as root without being
    prompted for the root password.


    > Protecting access single user mode with password by editing the SINGLE parameter
    in the /etc/sysconfig/init file is not recommended. An attacker can bypass the
    password by specifying a custom command (using the init parameter) on the kernel
    command line in GRUB. It is recommended to password-protect the GRUB loader as
    specified in Section 2.1.2.2.1, "Password Protecting GRUB".


    +   2. Access to the GRUB Console — If the machine uses GRUB as its boot loader,
    an attacker can use the GRUB interface to change its configuration or gather information
    using the cat command

    3. Access to Insecure Operating Systems — If it is a dual-boot system, an attacker
    can select an operating system at boot time (for example, DOS), which ignores
    access controls and file permissions.


    Red Hat Linux 6 uses the GRUB boot loader on the x86 platform. For a detailed
    look at GRUB, refer to the Red Hat Installation Guide.


    # 2.1.2.2.1. Password Protecting GRUB


    You can configure GRUB to address the first two issues listed in Section 2.1.2.2,
    "Boot Loader Passwords" by adding a password directive to your configuration file.
    To do this, first choose a strong password, open a shell, in as root, and type
    the following command:


    ```

    /sbin/grub-md5-crypt

    ```


    When prompted, type the GRUB password and press Enter. This returns an MD5 hash
    of the password.


    Next, edit the GRUB configuration file at /boot/grub/grub.conf. Open the file
    and below the timeout line in the main section of the document, add the following
    line:


    ```

    password --md5 <password-hash>

    ```'
