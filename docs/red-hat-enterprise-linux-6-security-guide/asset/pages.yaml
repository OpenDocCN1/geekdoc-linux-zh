    Another category of insecure services include network file systems and information
    systems such as NFS or NIS, which are developed explicitly for LAN usage but are,
    unfortunately, extended to include WANs (for remote users). NIS does not, by default,
    have any authentication or security mechanisms to prevent a cracker from mounting
