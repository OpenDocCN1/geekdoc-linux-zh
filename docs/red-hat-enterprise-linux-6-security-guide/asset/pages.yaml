    # 2.2.1.1. TCP Wrappers and Connection Banners


    Displaying a banner when user connects to a service is a good way to let attackers
    know that the system administrator is visiting. You can control what information
    about the system is presented to users. To implement a TCP Wrappers banner for
    a service, use the **banner** option.


    This example implements a banner for **vsftpd**. To begin, create a banner file.
    It can be anywhere on the system, but must have the same name as the daemon. For
    example, the file is called **/etc/banners/vsftpd** and contains the following:


    ```

    220-Hello, %C

    220-All activity on ftp.example.com is logged.

    220-Inappropriate use will result in your access privileges removed.

    ```


    The %c token supplies a variety of client information, such as the username and
    hostname, or the username and IP address to make the connection even more intimidating.


    For this banner to be displayed to incoming connections, add the following line
    in the **/etc/hosts.allow** file:


    ```

    vsftpd : ALL : banners /etc/banners/

    ```


    # 2.2.1.2. TCP Wrappers and Attack Warnings


