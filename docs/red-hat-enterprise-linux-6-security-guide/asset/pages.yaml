  md: '# Chapter 2. Securing Your Network


    creating and managing user passwords within an organization.


    # 2.1.3.2. Creating User Passwords Within an Organization


    If an organization has a large number of users, the system administrators have
    two basic options available to force the use of passwords. They can create passwords
    for the user, or they let users create their own passwords, while verifying the
    passwords are of acceptable quality.


    Creating the passwords for the users ensures that the passwords are good, but
    it becomes a daunting task as the organization grows. It also increases the risk
    of users writing their passwords.


    For these reasons, most system administrators prefer to have the users create
    their own passwords, but actively verify that the passwords are good and, in some
    cases, force users to change their passwords periodically through password aging.


    # 2.1.3.1. Forcing Passwords


    To protect the network from intrusion it is a good idea for system administrators
    to verify that the passwords used within an organization are strong. When users
    are asked to create or change passwords, they can use the command line interface
    `passwd`, which `Pluggable Authentication Modules` (PAM) aware therefore checks
    if the password is too short or otherwise easy to crack. This is performed using
    the `pam_cracklib.so` PAM module. In Red Hat Linux, the `pam_cracklib.so` module
    can be used to check a password''s strength against a set of rules. It can be
    stacked alongside other PAM modules in the component of `/etc/pam.d/password`
    file to configure a custom set of rules for user login. The `pam_cracklib/` routine
    consists of two parts: it checks whether the password is found in a dictionary,
    and, if that''s not the case, it continues with a number of additional characters.
    For a complete list of these, refer to the `pam_cracklib(8)` manual page.


    **Example 2.1. Configuring password strength-checking with pam_cracklib**


    To require a password with a minimum of 8 characters, including all classes of
    characters, add the following line to the `password` section of the `/etc/pam.d/password`
    file:


    ```

    password required pam_cracklib.so retry=3 minlen=8 minclass=4

    ```


    To set a password strength-check for consecutive or repetitive characters, add
    the following line to the `password` section of the `/etc/pam.d/password` file:


    ```

    password required pam_cracklib.so retry=3 maxsequence=3 maxrepeat=3

    ```


    In this example, the password entered cannot contain more than 3 consecutive characters,
    such as "abcd" or "1234". Additionally, the number of identical consecutive characters
    is limited to 3.


    > Note

    As checks are not performed for the root user, he can set any password for a regular
    user, despite the warning messages.


    Since PAM is customizable, it is possible to add more password integrity checks,
    such as `pam_passwdqc` (available from http://www.openwall.com/passwdqc/) or to
    write a new module. For a list of available PAM modules, refer to http://uw714.doc.com/en/SEC_pam/pam-6.html.
    For more


    37'
