  md: '# Table B.1. Event Fields


    | Event Field | Explanation |

    | --- | --- |

    | a0, a1, a2, a3 | Records the first four arguments of the system call, encoded
    in hexadecimal notation. |

    | acct | Records a user''s account name. |

    | addr | Records an IPv4 or IPv6 address. This field usually follows a hostname
    field and contains the host name it resolves to. |

    | arch | Records information about the CPU architecture of the system, encoded
    in hexadecimal notation. |

    | auid | Records the Audit user ID. This ID is assigned to a user upon login and
    is inherited by every process when the user''s identity changes (for example,
    switching user accounts with su - john). |

    | capability | Records the number of bits that were used to set a particular Linux
    capability. For more information on Linux capabilities, refer to the capabilities(7)
    page. |

    | cap_fi | Records data related to the setting of an inherited file system-based
    capability. |

    | cap_fp | Records data related to the setting of a permitted file system-based
    capability. |

    | cap_pe | Records data related to the setting of an effective process-based capability.
    |

    | cap_pi | Records data related to the setting of an inherited process-based capability.
    |

    | cap_pp | Records data related to the setting of a permitted process-based capability.
    |

    | cgroup | Records the path to the cgroup that contains the process at the time
    the Audit event was generated. |

    | cmd | Records the entire command line that is executed. This is useful in case
    of shell interpreters where the exe field records, for example, /bin/bash as the
    shell interpreter and the cmd field records of the command line that is executed,
    for example helloworld.sh -- help. |

    | comm | Records the command that is executed. This is useful in case of shell
    interpreters where the exe field records, for example, /bin/bash as the shell
    interpreter and the comm field records the name of the script that is executed,
    for example helloworld.sh. |

    | cwd | Records the path to the directory in which a system call was invoked.
    |

    | data | Records data associated with TTY records. |

    | dev | Records the minor and major ID of the device that contains the file or
    directory recorded in an event. |

    | devmajor | Records the major device ID. |

    | devminor | Records the minor device ID. |

    | egid | Records the effective group ID of the user who started the analyzed process.
    |

    | euid | Records the effective user ID of the user who started the analyzed process.
    |'
