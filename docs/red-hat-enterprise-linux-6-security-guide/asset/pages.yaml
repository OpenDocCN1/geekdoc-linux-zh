    # 2.6.4.3. Altering xinetd Configuration Files


    A range of directives is available for services provided by xinetd. This section
    highlights some of the more commonly used options.


    # 2.6.4.3.1. Logging Options


    The following logging options are available for both /etc/xinetd.conf and the
    service-specific configuration files within /etc/xinetd.d/ directory.


    This is a list of some of the most commonly used logging options:


    +   - ATTEMPT — Logs the fact that a failed attempt was made (log_on_failure).


    +   - DURATION — Logs the length of time the service is used by a remote system
    (log_on_success).


    +   - EXIT — Logs the remote host''s IP address (log_on_failure and log_on_success).


    +   - PID — Logs the process ID of the server receiving the request (log_on_success).


    +   - USERID — Logs the remote user using the method in RFC 1413 for all multi-threaded
    stream services (log_on_failure and log_on_success).


    For a complete list of logging options, refer to the xinetd.conf man page.


