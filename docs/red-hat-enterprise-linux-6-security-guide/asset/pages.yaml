  md: '# Chapter 2. Securing Your Network


    # 2.1. Workstation Security


    Securing a Linux environment begins with the workstation. Whether locking down
    a personal machine or securing an enterprise system, sound security policy begins
    with the individual computer. Computer network is only as secure as its weakest
    node.


    # 2.1.1. Evaluating Workstation Security


    When evaluating the security of a Red Hat Enterprise Linux workstation, consider
    the following:


    +   - BIOS and Boot Loader Security — Can an unauthorized user physically access
    the machine and boot into single user or rescue mode without a password?

    - Password Security — How secure are the account passwords on the machine?

    - Administrative Controls — Who has access on the system and how much administrative
    control do they have?

    - Available Network Services — What services are listening for requests from the
    network and should they be running at all?

    - Personal Firewalls — What type of firewall, if any, is necessary?

    - Enhanced Communication Tools — Which tools should be used to communicate between
    workstations and which should be avoided?


    # 2.1.2. BIOS and Boot Loader Security


    Password protection for the BIOS (or BIOS equivalent) and boot loader can prevent
    unauthorized users who have physical access to systems from booting using removable
    media or obtaining privileges through single user mode. The security measures
    you should take to protect against such attacks depends on the sensitivity of
    the information on the workstation and the location of the machine.


    For example, if a laptop is used in a trade show and contains no sensitive information,
    it may not be critical to prevent such attacks. However, if an employee''s laptop
    with private, unencrypted SSH keys for the corporate network is left unattended
    at that trade show, it could lead to a major security breach for the entire company.


    If the workstation is located in a place where only authorized or trusted people
    have access, however, securing the BIOS or the boot loader may not be necessary.


    # 2.1.2.1. BIOS Passwords


    The two primary reasons for password protecting the BIOS of a computer are [6]:


    +   1. Preventing Changes to BIOS Settings — If an intruder has access to the
    BIOS, they can set it to boot from a CD-ROM or a flash drive. This makes it possible
    for an intruder to enter rescue mode or single user mode, which in allows them
    to start arbitrary processes on the system or copy sensitive data.

    2. Preventing System Booting — Some BIOSes allow password protection of the boot
    process. When activated, an attacker is forced to enter a password before the
    BIOS launches the boot loader.


    Because the methods for setting a BIOS password vary between computer manufacturers,
    consult the computer''s manual for specific instructions.


    If you forget the BIOS password, it can either be reset with jumpers on the motherboard
    or by'
