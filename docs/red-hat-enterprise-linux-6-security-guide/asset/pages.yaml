  md: '# Table 2.6. Firewall Types


    | Method | Description | Advantages | Disadvantages |

    | --- | --- | --- | --- |

    | NAT | Network Address Translation (NAT) places private IP subnets behind a small
    pool of public IP addresses, masquerading requests to one rather than several.
    The Linux kernel has built-in NAT functionality through the Netfilter kernel subsystem.
    | - Can be configured transparently to machines on a LAN.<br>- Protection of machines
    and services behind one or more external IP addresses simplifies administration
    duties.<br>- Restriction of user access to and the LAN can be configured by opening
    and closing ports on the NAT firewall/gateway. | - Cannot prevent malicious activity
    once users connect to a service outside of the firewall. |

    | Packet Filter | A packet filtering firewall reads each data that passes through
    a LAN. It can read and process packets by header information and filters the packet
    based on sets of programmable rules implemented by the firewall administrator.
    The Linux kernel has built-in filtering functionality through the Netfilter kernel
    subsystem | - Does not require customization on the client side, as all network
    activity is filtered at the router level rather than the application level.<br>-
    Since packets are not transmitted through a proxy, network performance is faster
    due to direct connection to remote host. | - Cannot filter packets for content
    like proxy firewalls.<br>- Processes packets at the protocol layer, but cannot
    filter packets at application layer.<br>- Complex network architectures can make
    packet filtering difficult, especially if coupled with IP masquerading or local
    subnets and DMZ networks. |

    | Proxy | Proxy firewalls filter all requests of a protocol or from LAN clients
    to a proxy machine, which then makes requests to the Internet on behalf of the
    local client. A proxy machine acts as a buffer between malicious remote users
    and the internal network client machines | - Gives administrators control over
