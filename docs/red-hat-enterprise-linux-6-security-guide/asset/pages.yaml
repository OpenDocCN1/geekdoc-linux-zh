  md: '# 2.2.11. Reverse Path Filtering


    Reverse path filtering is used to prevent packets which arrived via one interface
    from leaving via a different interface. When outgoing routes and incoming routes
    are different it is referred to as "asymmetric routing". Routers route packets
    this way but most hosts should not need to do this. Exceptions are such applications
    as sending traffic over one link and receiving traffic over another from a different
    service provider. For example using leased lines with xDSL, Satellite links with
    3 modems. If this scenario is used you turning off reverse path filtering on the
    incoming interface is necessary. In short, unless you know it is required, it
    is better disabled as it prevents users spoofing IP addresses from local subnets
    and reduces the opportunity for DDoS attacks.


    > Red Hat Enterprise Linux 6 (unlike Red Hat Enterprise Linux 5) defaults to using
    Strict Reverse Path filtering. Red Hat Enterprise Linux 6 follows the "Strict
    Reverse Path" recommendation from RFC 3704, Ingress Filtering for Multihomed Networks.
    This currently only applies to IPv4 in Red Enterprise Linux 6.


    > If forwarding is enabled, then Reverse Path Filtering should only be disabled
    if there are other means for source address validation (such as iptables rules
    for example).


    # rp_filter


    Reverse Path Filter is enabled by means of the rp_filter directive. The rp_filter
    option is used to direct the kernel to select from one of three modes.


    It takes the following format when setting the behavior:


    ```

    -# /bin/sysctl -w ipv4.conf.default.rp_filter=INTEGER

    ```


    where INTEGER is one of the following:


    +   - 0 — No source validation.

    - 1 — Strict mode as defined in RFC3704.

    - 2 — Loose mode as defined in RFC3704.


    The setting can be overridden per network interface using net.ipv4.interface.rp_filter.
    To make these settings persistent across reboot, modify the /etc/sysctl.conf file.


    # 2.2.11.1. Additional Resources


    The following are resources which explain more about Reverse Path Filtering.


    # 2.2.11.1.1. Installed Documentation


    ```

    usr/share/doc/kernel-doc-version/Documentation/networking/ip-sysctl.txt

    ```'
