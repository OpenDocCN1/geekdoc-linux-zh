- img_proc: true
  md: '# 7.3.1. Configuring auditd for a CAPP Environment


    The default auditd configuration should be suitable for most environments. However,
    if your environment has to meet the criteria set by the Controlled Access Protection
    Profile (CAPP), which is part of the Common Criteria certification, the Audit
    daemon must be configured with the following settings:


    +   - The directory that holds the Audit log files (usually /var/log/audit/) should
    reside on a separate partition. This prevents other processes from consuming space
    in this directory, and provides accurate detection of the remaining space for
    Audit daemon.

    - The max_log_file parameter, which specifies the maximum size of a single Audit
    log file, must be set to make full use of the available space on the partition
    that holds the Audit log files.

    - The max_log_file_action parameter, which defines what action is taken when the
    limit in max_log_file is reached, should be set to keep_logs to prevent Audit
    logs from being overwritten.

    - The space_left parameter, which specifies the amount of free space on the disk
    for which an action is set in the space_left_action parameter is triggered, must
    be set to a number that gives the administrator enough time to respond and free
    up space. The space_left value depends on the rate at which the Audit logs are
    generated.

    - It is recommended to set the space_left_action parameter to email or exec with
    an appropriate notification method.

    - The admin_space_left parameter specifies the absolute minimum of free space
    for which an action is set in the admin_space_left_action is triggered, must be
    set to a value that allows enough space for actions performed by the administrator.

    - The admin_space_left_action parameter must be set to single to put the system
    into single-user mode and allow the administrator to free up some disk space.

    - The disk_full_action parameter, specifies which action is triggered when no
    free space is available on the partition that holds the Audit log files, must
    be set to halt or single. This ensures that the system is shut down or operating
    in single-user mode when Audit can no longer log events.

    - The disk_error_action, which specifies an action is triggered in case an error
    is detected on the partition that holds the Audit log files, must be set to syslog,
    single, or halt, depending on your local security policies regarding the handling
    of hardware malfunctions.

    - The flush configuration parameter must be set to sync or data. These parameters
    assure that the Audit event data is fully synchronized with the logs on the disk.


    The remaining configuration options should be set according to your local security
    policy.


    # 7.4. Starting the Audit Service


    Once auditd is properly configured, start the service to collect Audit information
    and store it in the log files. Execute the following command as the root user
    to start auditd:


    ```

    # service auditd start

    ```


    Optionally, you can configure auditd to start at boot time using the following
    command as the root user:


    ```

    # chkconfig auditd on

    ```


    A number of actions can be performed by auditd using the service auditd action'
