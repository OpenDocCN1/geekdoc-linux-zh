  md: '4. Verify /home is no longer mounted:


    ```

    grep home /proc/mounts

    ```


    5. Fill your partition with random=data:


    ```

    shred -v --iterations=1 /dev/VG00/LV_home

    ```


    This command proceeds at the sequential speed of your device and may take some
    time to complete. It is an important step to ensure no unencrypted data is left
    on a used device, and to obfuscate the parts of the device that contained encrypted
    data as opposed to just random data.


    6. Initialize your partition:


    ```

    cryptsetup --verbose --verify-passphrase luksFormat /dev/VG00/LV_home

    ```


    7. Open the newly encrypted device:


    ```

    cryptsetup luksopen /dev/VG00/LV_home home

    ```


    8. Make sure the device is present:


    ```

    ls -l /dev/mapper | grep home

    ```


    9. Create a file system:


    ```

    mkfs.ext3 /dev/mapper/home

    ```


    10. Mount the file system:


    ```

    mount /dev/mapper/home

    ```


    11. Make sure the file system is visible:


    ```

    df -h | grep home

    ```


    12. Add the following to the /etc/crypttab file:


    ```

    home /dev/VG00/LV_home none

    ```


    13. Edit the /etc/fstab file, removing the old entry for /home and adding the
    following line:


    ```

    /dev/mapper/home /home ext3 defaults 1 2

    ```


    14. Restore default SELinux security contexts:


    ```

    /sbin/restorecon -v -R /home

    ```


    15. Reboot the machine:


    ```

    shutdown -r now

    ```


    16. The entry in the /etc/crypttab makes your computer ask you luks passphrase
    on boot.


    17. Log in as root and restore your backup.'
