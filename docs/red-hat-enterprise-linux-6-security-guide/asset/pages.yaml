    # SysV Services


    SysV services persist server programs launched during the boot process. Examples
    of SysV services include sshd, vsftpd, and xinetd.


    Because these programs usually persist in memory as long as the machine is booted,
    updated SysV service must be halted and relaunched after the package is upgraded.
    This can be done using the Services Configuration Tool or by logging into a root
    shell prompt and issuing the /sbin/service command:


    ```

    /sbin/service <service-name> restart

    ```


    Replace <service-name> with the name of the service, such as sshd.


    # xinetd Services


    Services controlled by the xinetd super service run only when there is an active
    connection. Examples of services controlled by xinetd include Telnet, IMAP, and
    POP3.


    Because new instances of these services are launched by xinetd each time a request
    is received, connections that occur after an upgrade are handled by the updated
    software. However, if there are active connections at the time the xinetd controlled
    service is upgraded, they are served by the older version of the software.


    To kill other instances of a particular xinetd controlled service, upgrade the
    package for the service then halt all processes currently running. To determine
    if the process is running use the ps or pgrep command and use the kill or killall
    command to halt halt current instances of the service.'
