  md: "# Important\n\nBy default, firewall rules are saved in the /etc/sysconfig/iptables\
    \ or /etc/sysconfig/iptables files.\nThe iptables service starts before any DNS-related\
    \ services when a Linux system is booted.\nThis means firewall rules can only\
    \ reference numeric IP addresses (for example, 192.168.0.1). Domain names (for\
    \ example, host.com) in such rules produce errors.\n\nRegardless of their destination,\
    \ packets match a rule in one of the tables, a target or action is applied to\
    \ them. If the rule specifies an ACCEPT target for a matching packet, the packet\
    \ skips the rest of the rule chain and is allowed to continue its destination.\
    \ If a rule specifies a DROP target, packet is refused access to the system and\
    \ is not sent back to the host that sent it. If a rule specifies a QUEUE target,\
    \ the packet is passed to user-space. If a rule specifies the optional REJECT\
    \ target, the packet is dropped, but an error is sent to the packet's originator.\n\
    \nEvery chain has a default policy ACCEPT, DROP, REJECT, or QUEUE. If one of the\
    \ rules in the chain apply to the packet, the packet is dealt with in accordance\
    \ with the default policy.\n\nThe iptables command configures these tables, as\
    \ well as sets up new tables if necessary.\n\n# Note\n\nThefilter modules are\
    \ not loaded by default. Therefore user will not see all of them by looking in\
    \ the /proc/ directory as it shows what is being used or has been loaded already.\
    \ This means there is no way to see what features of netfilter are available before\
    \ you attempt to use it.\n\n# 2.8.9.2. Command Options for IPTables\n\nRules for\
    \ filtering packets are created using the iptables command. The following aspects\
    \ of the packet are often used as criteria:\n\n+   - Packet Type — Specifies the\
    \ type of the packets chain filters.\n- Packet Source/Destination — Specifies\
    \ which packets the chain filters based on the source or destination of the packet.\n\
    - Target — Specifies what action is taken on packets matching the above criteria.\n\
    \nRefer to Section 2.8.9.2.4, \"IPTables Match Options\" and Section 2.8.9.2.5,\
    \ \"Target Options\" for more information about specific options that address\
    \ these aspects of a packet.\n\nThe options used with specific iptables rules\
    \ must be grouped locally, based on the purpose and conditions of the overall\
    \ rule, for the rule to be valid. The remainder of this section explains commonly-used\
    \ options for the iptables command.\n\n# 2.8.9.2.1. Structure of IPTables Command\
    \ Options\n\nMany iptables commands have the following structure:\n\n```\niptables\
    \ [-t <table-name>] <command> <chain-name> \\\n  <parameter-1> <option-1> \\\\\
    \n  <parameter-n> <option-n>\n```"
  merge: -1
  pgno: 122
- img_proc: true
  md: '<table-name> — Specifies which table rule applies to. If omitted, the filter
    table is used.


    <command> — Specifies the action to perform, such as appending or deleting a rule.


    <chain-name> — Specifies the chain to edit, create, or delete.


    <parameter> <option> — Parameters and associated options that specify how to process
    a packet that matches the rule.


    The length and complexity of an iptables command can change significantly, based
    on its purpose.


    For example, a command to remove a rule from a chain can be very short:


    ```

    iptables -D <chain-name> <line-number>

    ```


    In contrast, a command that adds a rule filters packets from a particular subnet
    using a variety of specific parameters and options can be rather long. When constructing
    iptables commands, it is important to remember that some parameters and options
    require further parameters and options to construct a valid rule. This can produce
    a cascading effect, where the further requiring more parameters until every parameter
    and option that requires another set of options is satisfied, the rule is not
    valid.


    Type iptables -h to view a comprehensive list of iptables command structures.


    # 2.8.9.2.2. Command Options


    Command options instruct iptables to perform a specific action. Only one command
    option is allowed per iptables command. With the exception of the help command,
    all commands are written in uppercase-characters.


    The iptables commands are as follows:


    +   -A — Appends the rule to the end of the specified chain. Unlike the -I option
    described below, it does not take an integer argument. It always appends the rule
    to the end of the specified chain.

    -D <integer> | <rule> — Deletes a rule in a particular chain by number (such as
    5 for the fifth in a chain) or by rule specification. The rule specification must
    exactly match the existing rule.

    -E — Renames a user-defined chain. A user-defined chain is any chain other than
    the default, pre-existing chains. (Refer to the -N option, below, for information
    on creating user-defined chains.) This is a cosmetic change and does not affect
    the structure of the table.


    > Note

    If you attempt to rename one of the default chains, the system reports a Match
    not found error. You cannot rename the default chains.


    +   -F — Flushes the selected chain, which effectively deletes every rule in the
    chain. If no chain is specified, this command flushes every rule from every chain.

    -h — Provides a list of command structures, as well a quick summary of command
    parameters and options.

    -I <integer> — Inserts the rule in the specified chain at a point specified by
    a user-defined integer argument. If no argument is specified, the rule is inserted
    at the top of the chain.'
