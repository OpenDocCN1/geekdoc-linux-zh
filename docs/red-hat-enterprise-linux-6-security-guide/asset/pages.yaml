  md: '# Important


    The KNOWN, UNKNOWN, and PARANOID wildcards should be used with care, because they
    rely on a functioning DNS server for correct operation. Any disruption to name
    resolution may prevent legitimate users from gaining access to a service.


    # 2.6.2.1.2. Patterns


    Patterns can be used in the client field of rules to precisely specify groups
    of client hosts.


    The following is a list of common patterns for entries in the client field:


    +   * Hostname beginning with a period () — Placing a period at the beginning
    of a hostname matches hosts sharing the listed components of the name. The following
    example applies to any host within the example.com domain:


    ```

    ALL : .example.com

    ```


    +   * IP address ending with a period () — Placing a period at the end of an IP
    address matches all hosts sharing the initial numeric group of an IP address.
    The following example applies to any host within the 192.168.x.x network:


    ```

    ALL : 192.168.x

