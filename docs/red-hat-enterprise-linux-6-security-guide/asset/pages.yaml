  md: '# Chapter 2. Securing Your Network


    If a client is allowed to connect, TCP Wrappers release control of the connection
    to the requested service and take no further part in the communication between
    the client and the server.


    In addition to access control and logging, TCP Wrappers can execute commands to
    interact with the client before denying or releasing the connection to the requested
    network service.


    Because TCP Wrappers are a valuable addition to any server administrator''s arsenal
    of security tools, most network services use the `libwrap.so` library. Some applications
    include `/usr/sbin/sshd`, `/usr/sbin/sendmail`, and `/usr/sbin/xinetd`.


    ![](img/fa49fe194038627f7baabbe849816a0e_81_0.png)


    To determine if a network service binary is linked to `libwrap.so`, type the following
    command as the root user:


    ```

    ldd <binary-name> | grep libwrap

    ```


    Replace with the name of the network service binary. If the command returns straight
    to the prompt with no output, then the network service is not `libwrap.so`. The
    following example indicates that `/usr/sbin/sshd` is linked to `libwrap.so`:


    ```

    -# ldd /usr/sbin/sshd | grep libwrap

    libwrap.so => /libwrap.so (0x00655800)

    ```


    # 2.6.1.1. Advantages of TCP Wrappers


    TCP Wrappers provide the advantages over other network service control techniques:


    +   * Transparency to both the client and the network service — Both the connecting
    client and the network service are unaware that TCP Wrappers are in use. Legitimate
    users are logged and connected to the requested service while banned clients fail.

    * Centralized management of multiple protocols — TCP Wrappers operate separately
    from the network services, they protect many applications to share a common set
    of access control configuration files, making for simpler management.


    # 2.6.2. TCP Wrappers Configuration Files


    To determine if a client is allowed to connect to a service, TCP Wrappers reference
    the two files, which are commonly referred to as hosts files:


    +   * /etc/hosts.allow

    * /etc/hosts.deny


    When a TCP-wrapped service receives a client request, it performs the following
    steps:


    +   1. It references /etc/hosts.allow — The TCP-wrapped service sequentially parses
    the /etc/hosts.allow file and applies the first rule specified for that service.
    If it finds a matching rule, it allows the connection. If not, it moves to the
    next step.

    2. It references /etc/hosts.deny — The TCP-wrapped service sequentially parses
    the /etc/hosts.deny file. If it finds a matching rule, it denies the connection.
    If not, it grants access to the service.


    79'
