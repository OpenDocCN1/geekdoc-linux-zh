    # 3.2.5.3. Creating GPG Keys Using the Command Line


    Use the following command: `gpg --gen-key`


    This command generates a key pair that consists of a public and a private key.
    Other people use your public key to authenticate and/or decrypt your communications.
    Distribute your public key as widely as possible, to people you know will want
    to receive authentic communications from you, such as a mailing list.


    A series of prompts directs you through the process. Press the **Enter** key to
    assign a default value if desired. The first prompt asks you to select what kind
    of key you prefer:


    +   Please select what kind of key you want:

    (1) RSA and RSA (default)

    (2) DSA and Elgamal

    (3) DSA (sign only)

    (4) RSA (sign only)

    Your selection?


    In all cases, the default is the correct choice. A RSA/RSA key allows you not
    only to sign communications, but also to encrypt files.


    Next, choose the key size:


    RSA keys may be between 1024 and 4096 bits long.

    What keysize do you want? (2048)


    Again, the default, 2048, is sufficient for almost all users, and represents an
    extremely strong level of security.


    Next, choose when the key will expire. It is a good idea to choose an expiration
    date instead of using the default, which is **none**. If example, the email address
    on the key becomes invalid, an expiration date will remind others to stop using
    that public key.


    Please specify how long the key should be valid. 0 = key does not expire d = expires
    in days w = expires in weeks m = expires in months y = expires in years Key is
    valid for? (0)


    Entering a value of **1y**, for example, makes the key valid for one year. (You
    may change this expiration date after the key is generated, if you change your
    mind.)


    Before the **gpg** application asks for signature information, the following prompt
    appears:


    Is this correct (y/n)?


    Enter **y** to finish the process.'
