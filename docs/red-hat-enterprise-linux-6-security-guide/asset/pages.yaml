    \  log_on_success += DURATION USERID\n  log_on_failure += USERID\n  bind = 123.123.123.123\n\
    \  redirect = 10.0.1.13\n}\n```\n\nThe **bind** and **redirect** options in this\
    \ file ensure that the Telnet service is bound to the external IP address **123.123.123.123**,\
    \ the one facing the Internet. In addition, any requests for Telnet service sent\
    \ to **123.123.123.123** are redirected via a network adapter to an internal IP\
    \ address **10.0.1.13** which the firewall and internal systems can access. The\
    \ firewall sends the communication between the two systems, and the connecting\
