    # 2.6.2.1.3. Portmap and TCP Wrappers


    Portmap''s implementation of TCP Wrappers does not support host look-ups, which
    means portmap can not use hostnames to identify hosts. Consequently, access control
    rules for portmap in hosts.allow or hosts.deny must use IP addresses, or the keyword
    ALL, for specifying hosts.


    Changes to portmap access control rules may not take effect immediately. You may
    need to restart the portmap service.


    Widely used services, such as NIS and NFS, depend on portmap to operate, so be
    aware of these limitations.


    # 2.6.2.1.4. Operators


    At present, access control rules accept one operator, EXCEPT. It can be used in
    both the daemon list and the client list of a rule.


    The EXCEPT operator allows exceptions to broader matches within the same rule.


    In the following example a hosts.allow file, as example.com hosts are allowed
    to connect to all services except cracker.example.com:


    ```

    ALL : .example.com EXCEPT cracker.example.com

    ```


    In another example from a hosts.allow file, clients the 192.168.0.x network can
    use all services for FTP:


    ```

    ALL EXCEPT vsftpd : 192.168.0.0.

    ```


    # Note


    Organizationally, it is easier to avoid using EXCEPT operators. This allows other
    administrators to quickly scan the appropriate files to see what hosts are allowed
    or denied access to services, without having to sort through EXCEPT operators.


