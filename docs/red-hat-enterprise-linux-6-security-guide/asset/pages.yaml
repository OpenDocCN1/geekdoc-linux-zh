    # 2.1.12. Security Enhanced Communication Tools


    As the size and popularity of the Internet has grown, so is the threat of communication
    interception. Over the years, tools have been developed to encrypt communications
    as they are transferred over the network.


    Red Hat Enterprise Linux 6 with two basic tools that use high-level, public-key-cryptography-based
    encryption algorithms to protect information as it travels over the network.


    +   * **OpenSSH** — A free implementation of the SSH protocol for encrypting network
    communication.

    * **Gnu Privacy Guard (GPG)** — A free implementation of the PGP (Pretty Good
    Privacy) encryption application for decryption.


    OpenSSH is a safer way to access a remote and replaces older, unsecured services
    like **telnet** and **rsh**. OpenSSH includes a network service called **sshd**
    and three command line applications:


    +   * **ssh** — A secure remote access client.

    * **scp** — A secure remote copy command.

    * **sftp** — A pseudo-ftp client that allows interactive file transfer sessions.


    Refer to Section 3.2.2, "Secure Shell" for more information regarding OpenSSH.


