  md: '# 2.1.6. Time-based Restriction of Access


    The **pam_time** PAM module is used to restrict access during a certain time of
    the day. It can also be configured to control access on specific days of a week,
    user name, usage of a system service, and more. By default, the module reads access
    rules from the `/etc/security/time.conf` file. For a complete description of the
    format of these rules, refer to the **time.conf(5)** manual page.


    To restrict all users except the root user from logging in from 05:30 PM to 08:00
    AM on Monday till Friday and Saturday and Sunday, follow the line in


    +   Include the line in the account section of the `/etc/pam.d/login` file:


    ```

    account      required      pam_time.so

    ```


    +   Specify the following rule in the `/etc/security/time.conf` file:


    ```

    login ; ALL ; !root ; tty*; !Wk1730-0800

    ```


    To allow user to use the SSH service during working hours and working days only
    (starting with Monday), follow these steps:


    +   Add the line to the `/etc/pam.d/sshd` file:


    ```

    account      required      pam_time.so

    ```


    +   Specify the following rule in the `/etc/security/time.conf` file:


    ```

    ssh ; john ; tty*; Wk0800-1730

    ```


    > For these configurations to be applied to the desktop environment, the **pam_time**
    module should be included in the corresponding files in the `/etc/pam.d` directory.


