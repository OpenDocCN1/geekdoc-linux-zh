    # 2.1.5. Customizing Access Control


    The pam_access PAM module allows an administrator to customize access control
    based on login name, host or domain addresses. By default, the module reads the
    access rules from the /etc/security/access.conf file if no other is specified.
    For a complete description of the format of these rules, refer to the access.conf
    (5) manual page. By default, in Red Enterprise Linux, pam_access is included in
    the /etc/pam.d/crond and /etc/pam.d/atd files.


    To deny the user from accessing system from the console and the graphic desktop
    environment, follow these steps:


    +   Include the following line in the account section of both /etc/pam.d/login
    and /etc/pam.d/gdm-* files:

    ```

    account required      pam_access.so

    ```


    +   Specify the rule in the /etc/security/access.conf file:

    ```

    -: john : ALL

    ```


    This rule prohibits all users from attempting to login in SSH except the user
    john from the 1.2.3.4 IP address, follow these steps:


    +   Include the following line in the account section of /etc/pam.d/sshd:

    ```

    account required      pam_access.so

    ```


    +   Specify the rule in the /etc/security/access.conf file:

    ```

    +: ALL EXCEPT john : 1.2.3.4

    ```


    In order to limit access from other services, the pam_access.so module should
    be required in the /etc/pam.d directory.


    It is possible to call the pam_access module for all services that call the system
    PAM configuration files (*-auth files in the /etc/pam.d directory) using the following
    command:


    ```

    authconfig --enablepamamass --update

    ```


    Alternatively, you can enable the pam_access module using the Authentication Configuration
    utility. To start this utility, click System -> Administration -> Authentication
    from the top menu. From the Advanced Options tab, check the "enable local access
    control". This will add the pam_access module to the systemwide PAM configuration.'
