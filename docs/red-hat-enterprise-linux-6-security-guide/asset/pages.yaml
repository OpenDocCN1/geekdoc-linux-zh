  md: 'Character Map from the main menu bar. Next, choose Search → Find... from the

    Character Map menu bar, type the name of the character in the Search field and
    click

    Next. The character you sought will be highlighted in the Character Table. Double-click

    this highlighted character to place it in the Text to copy field and then click
    the Copy

    button. Now switch back to your document and choose Edit → Paste from the gedit
    menu

    bar.


    The above text includes application names; system-wide menu names and items; application-specific

    menu names; and texts found within a GUI interface, all presented in proportional
    bold and all

    distinguishable by context.


    # Mono-spaced Bold Italic or Proportional Bold Italic


    Whether mono-spaced or proportional bold, the addition of italics indicates replaceable
    or variable

    texts denotes you do not input linearly or display text that changes depending
    on

    circumstance. For example:


    To connect to a remote machine using ssh, type ssh username@domain.name at a shell

    prom. If the remote machine is example.com and your username on that machine is

    john, ssh john@example.com.


    The mount -o remount file-system command remounts the file system. For

    example, to remount the /home file system, the command is mount -o remount /home.


    To see the version of a currently installed package, use the rpm -q package command.

    it will return a result as follows: package-version-release.


    Note the words in bold above: username, domain.name, file-system, package, version
    and release.

    Each word is a placeholder, either for you enter when issuing a command or for
    text displayed by

    the system. For example:


    As from standard usage for presenting the title of a work, italics denotes the
    first use of a new and

    important term. For example:


    Public is a DocBook publishing system.


    # 1.2. Pull-quote Conventions


    Terminal output and source code listings are set off visually from the surrounding
    text.


    Output sent to a terminal is in mono-spaced roman and presented thus:


    | books | documentation | drafts | mss | photos | stuff | svn |

    | books_tests | Desktop | downloads | images | notes | scripts | svgs |


    Source-code listings are also set in mono-spaced roman but add syntax highlighting
    as follows:'
