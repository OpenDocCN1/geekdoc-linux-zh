    To allow the connection and log it, place the spawn directive in the /etc/hosts.allow
    file.


    ![](img/fa49fe194038627f7baabbe849816a0e_62_0.png)


    Because the spawn directive executes any shell command, it is a good idea to create
    a special script to notify the administrator or execute a chain of commands in
    the event that a particular client attempts to connect to the server.


    # 2.2.1.1.3. TCP Wrappers and Enhanced Logging


    If certain types of connections are more concern than others, the log level can
    be elevated for that service using the severity option.


    For this example, anyone attempting to connect to port 23 (the Telnet port) on
    an FTP server is a cracker. To denote this, place an emerg flag in the log files
    instead of the default flag, info, and deny the connection.


    To do this, place the following line in /etc/hosts.deny:


    ```

    in.telnetd : ALL : severity emerg

    ```


    This uses the default auth logging facility, but elevates the priority from the
    default value of info to emerg, which post messages directly to the console.


    # 2.2.1.2. Enhancing Security With xinetd


    This section focuses on using xinetd to set a trap service. Setting resource limits
    for services can help thwart Denial of Service (DoS) attacks. Refer to the man
    pages for xinetd and xinetd.conf for a list of available options.


    # 2.2.1.2.1. Setting a Trap


    One important feature of xinetd is its ability to add hosts to a global no_access
    list. Hosts on this list are denied subsequent connections to services managed
    by xinetd for a specified period or until xinetd is restarted. You can do this
    using the SENSOR attribute. This is an easy way to block hosts attempting to scan
    the ports on the server.


    The first step in setting up a SENSOR is to choose a service you do not plan on
    using. For this example, Telnet is used.


    Edit the /etc/xinetd.d/telnet and change the flags line to read:


    ```

    flags = SENSOR

    ```


    Add the following line:


    ```

    deny_time = 30

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'This denies any further connection attempts to port by that host for 30 minutes.
    Other acceptable values for the deny_time attribute are FOREVER, which keeps the
    ban in effect until xinetd is restarted, and NEVER, which allows the connection
    and logs it.


    Finally, the last line should read:


    ```

    disable          = no

    ```


    This enables the trap itself.


    While using SENSOR is a good way to stop connections from undesirable hosts, it
    has two drawbacks:


    +   - It does not work against stealth scans.

    - An attacker who knows that a SENSOR is running can mount a Denial of Service
    attack against particular hosts by forging their IP addresses and connecting to
    the forbidden port.


    # 2.2.1.2.2. Controlling Server Resources


    Another feature of xinetd is its ability to set resource limits for services under
    its control.


    It does using the following directives:


    +   - cps = <number_of_connections> <wait_period> — Limits the rate of incoming
    connections. This directive takes two arguments:

    - <number_of_connections> — The number of connections per second to handle. If
    the rate of incoming connections is higher than this, the service is temporarily
    disabled. The default value is fifty (50).

    - <wait_period> — The number of seconds to wait before re-enabling the service
    after it has been disabled. The default interval is ten (10) seconds.

    - instances = <number_of_connections> — Specifies the total number of connections
    allowed to a service. This directive accepts either an integer or UNLIMITED.

    - per_source = <number_of_connections> — Specifies the number of connections allowed
    to a service by each host. This directive accepts either an integer or UNLIMITED.

    - rlimit_as = <number[K]> — Specifies the amount of memory address the service
    can occupy in kilobytes or megabytes. This directive accepts either an integer
    or UNLIMITED.

    - rlimit_cpu = <number_of_seconds> — Specifies the amount of seconds that a service
    may occupy the CPU. This directive accepts either an integer or UNLIMITED.


    Using these can help prevent any single xinetd service from overwhelming the system,
    resulting in a denial of service.


    # 2.2.2. Securing Portmap


    The portmap service is a dynamic port assignment daemon for RPC services such
    as NIS and NFS. It has weak authentication mechanisms and the ability to assign
    a wide range of ports for the services it controls. For these reasons, it is difficult
    to secure.'
