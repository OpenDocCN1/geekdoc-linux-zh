    \ 1.3 Notes and Warnings\n\nFinally, we use three visual styles to draw attention\
    \ to information that might otherwise be overlooked.\n\n> > Note\nNotes are tips,\
    \ shortcuts or alternative approaches to the task at hand. Ignoring a note should\
    \ have no negative consequences, but you might miss out on a trick that makes\
    \ your life easier.\n\n> > Important\nImportant boxes detail things that are easily\
    \ missed: configuration changes that only apply to the current session, or services\
    \ that need restarting before an update will apply. Ignoring a box labeled \"\
    Important\" will not cause data loss but may cause irritation and frustration.\n\
    \n> > Warning\nWarnings should not be ignored. Ignoring warnings will most likely\
