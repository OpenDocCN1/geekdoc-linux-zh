    A cracker who gains access to this database can access every user account on a
    network, including the administrator’s account.


    By default, Red Enterprise Linux is released with all services turned off. However,
    since administrators often find themselves to use these services, careful configuration
    is critical. Refer to Section 2.2, "Server Security" for more information about
    setting up in a safe manner.


    # 1.3.4. Threats to Workstation and Home PC Security


    Workstations and PCs may not be as prone to attack as networks or servers, but
    since they often contain sensitive data, such as credit card information, they
    are targeted by system crackers. Workstations can also be co-opted with the user’s
    knowledge and used by attackers as "slave" in coordinated attacks. For these reasons,
    knowing the vulnerabilities of a workstation can save users the headache of reinstalling
    the operating system, or worse, recovering from data theft.


    # 1.3.4.1. Bad Passwords


    Bad passwords are one of the easiest ways for an attacker to gain access to a
    system. For more on how to avoid pitfalls when creating a password, refer to Section
    2.1.3, "Password Security".


    # 1.3.4.2. Vulnerable Client Applications


    Although an administrator may have a fully secure and patched server, that does
    not mean remote users are secure when accessing it. For instance, if the server
    offers Telnet or FTP services over a public network, an attacker can capture the
    plaintext usernames and passwords as they pass over the network, and then use
    the account information to access the remote user''s workstation.


    Even when using secure protocols, such as SSH, a remote user may be vulnerable
    to attacks if they do not keep their client applications updated. For instance,
    v1 SSH clients are vulnerable to an X forwarding attack from malicious SSH servers.
    Once connected to the server, the attacker can quickly capture keystro and mouse
    clicks by the client over the network. This problem was fixed in the v2 SSH protocol,
    but it is up to the user to keep track of what applications have such vulnerabilities
    and update them as necessary.


    Section 2.1, "Workstation Security" discusses in more detail what steps administrators
    and home users should take to limit the vulnerability of computer workstations.


