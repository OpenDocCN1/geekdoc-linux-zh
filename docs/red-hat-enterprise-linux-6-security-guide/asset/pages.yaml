    Although the **sshd** service is inherently secure, the service *must* be kept
    up-to-date to prevent security threats. Refer to Section 1.5, "Security Updates"
    for more information.


    GPG is one way to ensure private communication. It can be used both to email sensitive
    data over public networks and to protect sensitive data on hard drives.


    # 2.2. Server Security


    When a system is used as a server on a public network, it becomes a target for
    attacks. Hardening the system and locking down services is of paramount importance
