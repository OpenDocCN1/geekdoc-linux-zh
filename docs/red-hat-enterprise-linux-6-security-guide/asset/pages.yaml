    # 2.8.9.5. IPTables and IPv6


    If the iptables-ipv6 package is installed, netfilter in Red Enterprise Linux can
    filter the generation-IPv6 Internet protocol. The command to manipulate the IPv6
    filter is ip6iptables.


    Most directives for this command are identical to those used for iptables, the
    nat table is not yet supported. This means it is not possible to perform IPv6
    network address translation tasks, such as masquerading and port forwarding.


    Rules for iptables are saved in the /etc/sysconfig/iptables file. Previous rules
    saved by the iptables inscripts are saved in the /etc/sysconfig/iptables.save
    file.


    Configuration options for the iptables init script are saved in /etc/sysconfig/iptables-config,
    and the names for each directive vary slightly from the iptables counters.


    For example, the iptables-config directive IPTABLES_MODULES is the equivalent
    in the ip6tables-config file IPTABLES_MODULES.


