    # 2.2.4.4. Do Not Use the no_root_squash Option


    By default, NFS shares change root user to the nfsnobody user, an unprivileged
    user account. This changes the owner of all root-created files to nfsnody, which
    prevents uploading of programs with the setuid bit.


    If no_root_squash is used, root users are able to change any file on the shared
    file system and leave applications infected by trojans for other users to inadvertently
    execute.


    # 2.2.4.5. NFS Firewall Configuration


    The ports used for NFS are assigned dynamically by rpcbind, which can cause problems
    when creating firewall rules. To simplify this process, use the /etc/sysconfig/nfs
    file to specify which ports are to be used:


    +   - MOUNT_PORT — TCP and UDP port for mountd (rpc.mountd)

    - STAT_PORT — TCP and UDP port for status (rpc.stat)

    - LOCKD_TCPPORT — TCP port for lockmgr (rpc.lock)

    - LOCKD_UDPPORT — UDP port for nlockmgr (rpc.lockd)


    Port numbers specified not used by any other service. Configure your firewall
    to allow the port numbers specified, as well as TCP and UDP port 2049 (NFS).


    Run the rpcinfo -p command on the NFS server to see which ports and RPC programs
    are being used


    # 2.2.5. Securing the Apache HTTP Server


    The Apache HTTP Server is one of the most stable and secure services that ship
