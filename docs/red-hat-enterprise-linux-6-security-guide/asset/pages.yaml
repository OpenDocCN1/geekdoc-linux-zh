  md: "# Note\n\nUnlike TCP Wrappers , changes to access control take effect if the\
    \ xinetd administrator restarts the xinetd service.\nAlso, unlike TCP Wrappers,\
    \ access control through xinetd only affects services controlled by xinetd.\n\n\
    The xinetd hosts access control differs from the method used by TCP Wrappers.\
    \ While TCP Wrappers place all of the access configuration within two files, `/etc/hosts.allow`\
    \ and `/etc/hosts.deny`, xinetd's access control is found in each service's configuration\
    \ file in the `/etc/xinetd.d/` directory.\n\nThe following hosts access options\
    \ are supported by xinetd:\n\n+   - **only_from** — Allows only the specified\
    \ hosts to use the service.\n- **no_access** — Blocks listed hosts from the service.\n\
    - **access_times** — Specifies the time when a particular service may be used.\
    \ The time range must be stated in 24-hour format, HH:MM-HH:MM.\n\nThe **only_from**\
    \ and **no_access** options can take use of IP addresses or host names, or specify\
    \ an entire network. Like TCP Wrappers, combining xinetd access control with the\
    \ enhanced logging can increase security by blocking requests from banned hosts\
    \ while recording each connection attempt.\n\nFor example, the following `/etc/xinetd.d/telnet`\
    \ file can be used to block Telnet access from a particular group and restrict\
