    # ## 2.5. Kerberos


    Maintaining system security and integrity within a network is critical, and it
    encompasses every user, application, service, and server within the network infrastructure.
    It requires an understanding of everything is running on the network and the mechanism
    in which these services are used. The core of maintaining this security is maintaining
    access to these applications and services and enforcing that access.


    Kerberos provides a mechanism that allows both users and machines to identify
    themselves to network and receive defined, limited access to the areas and servers
    that the administrator configured. Kerberos authenticates identities by verifying
    their identity, and Kerberos secures this authenticating data so that it cannot
    be accessed or used by an outsider.


    For more information on Pluggable Authentication Modules, refer to Chapter 3.,
    "Using Kerberos" of the Red Hat Enterprise Linux 6 Managing Single-On and Smart
    Cards guide.


