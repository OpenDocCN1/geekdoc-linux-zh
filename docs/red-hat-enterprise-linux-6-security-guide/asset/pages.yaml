  md: 'more information, refer to the RFC 2612.


    Block cipher mode describes how the block cipher is repeatedly applied on bulk
    data in order to encrypt or decrypt the secure data. The following modes can be
    used:


    +   - CBC — Cipher Chaining; for more information, refer to the NIST SP 800-38A.

    - XTS — Tweakable Block Cipher with Cipher Stealing; for more information, refer
    to the IEEE 1619, or NIST SP 800-38E.

    - CTR — Counter; for more information, refer to the NIST SP 800-38A.

    - ECB — Electronic Codebook; for more information, refer to the NIST SP 800-38A.

    - CFB — Cipher Feedback; for more information, refer to the NIST SP 800-38A.

    - OFB — Output Feedback; for more information, refer to the NIST SP 800-38A.


    An initial vector is a block of data for ciphertext randomization. IV ensures
    that repeated encryption of the same plaintext is not reused with the same encryption
    key. For ciphers in CBC mode, IV must be unpredictable, otherwise the system could
    become vulnerable to watermarking attacks (see LUKS/cryptsetup FAQ for more information).
    Red Hat recommends using the following with AES:


    +   - ESSV — Encrypted Salt-Sector Initialization Vector - This IV should be used
    for ciphers in CBC mode.

    - plain64 (or plain) — IV sector offset - This IV should be used for ciphers in
    XTS mode.


    You may also specify the length of the encryption key. The size of the key depends
    on the combination of the block cipher and block cipher mode. If you do not specify
    the key, LUKS will use the default value for the given combination. For example:
    if you decide to use a 128-bit key for AES in CBC mode, LUKS will encrypt your
    partition using the AES-128 implementation, while a 512-bit key for AES in XTS
    mode means that the AES-256 implementation will be used. Note that XTS mode operates
    with two keys, the first is for tweakable encryption and the second for regular
    encryption.


    # 3.2.4.2. Manually Encrypting Directories


    > Warning

    Following this procedure will remove all data on the partition that you are encrypting.
    You WILL lose all information! Make sure you back up your data to an external
    source before beginning this procedure!


    +   1. Enter runlevel 1 by typing the following at a shell prompt as root:


    ```

    telinit 1

    ```


    +   2. Unmount your existing /home:


    ```

    umount /home

    ```


    +   3. If the command in the previous step fails, use fuser to find processes
    hogging /home and kill them:


    ```

    fuser -mvk /home

    ```'
