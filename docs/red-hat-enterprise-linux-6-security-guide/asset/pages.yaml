  md: '# Chapter 4. General Principles of Information Security


    The following general principals provide an overview of good security practices:


    +   - Encrypt all data transmitted over networks to prevent man-in-the-middle
    attacks and eavesdropping. It is important to encrypt authentication information,
    such as passwords.

    - Minimize the amount of installed and running services.

    - Use security-enhancing software and tools, for example, Security-Enhanced Linux
    (SELinux) for Mandatory Access Control (MAC), Netfilter for packet filtering (firewall),
    and the GNU Privacy Guard (GnPG) for encrypting files.

    - If possible, run each network service on a separate system to minimize the risk
    of one compromised service being used to compromise other services.

    - Maintain user accounts: create and enforce a strong password policy; delete
    unused user accounts.

    - Routine review system and audit logs. By default, security-relevant system logs
    are written to /var/log/secure and /var/log/audit/audit.log. Sending logs prevents
    attackers from modifying local logs to avoid detection.

    - Never log as root unless absolutely necessary. It is recommended that administrators
    use sudo to execute commands when required. Users capable of running sudo are
    specified in /etc/sudoers. Use the visudo to edit /etc/sudoers.


    # 4.1. Tips, Guides, and Tools


    The United States National Security Agency (NSA) provides hardening guides and
    tips for many different operating systems, to help government agencies, businesses,
    and individuals secure their systems against attack. The following guides (in
    PDF format) provide guidance for Red Hat Enterprise Linux 6:


    +   - Hardening Tips for the Red Hat Enterprise Linux 5

    - Guide to the Secure Configuration of Red Hat Enterprise Linux 5


    > Note

    References to Red Hat Enterprise Linux 5 hardening guides are provided in this
    document until hardening guides for Red Hat Enterprise Linux 6 may be made available.
    In the meantime, please note that the hardening guides for Red Hat Enterprise
    Linux 5 may not apply completely to Red Hat Enterprise Linux 6.


    The Defense Information Systems Agency (DISA) provides documentation, checklists,
    and tests to secure your system (Information Assurance Support Environment).'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# # Chapter 5. Secure Installation


    Security begins with the first time you put that CD or DVD into your disk drive
    to install Red Hat Enterprise Linux. Configuring your system securely from the
    beginning makes it easier to implement additional security settings later.


    # ## 5.1 Disk Partitions


    The NSA recommends creating separate partitions for /boot, /home, /tmp, and /var/tmp.
    The reasons for each are different and we will address each partition:


    /boot - This partition is the first partition that is read by the system during
    boot up. The boot loader and kernel images that are used to boot your system into
    Red Hat Enterprise Linux are stored in this partition. This partition should not
    be encrypted. If this partition is included in / and that partition is encrypted
    or otherwise unavailable your system will not be able to boot.


    /home - When data (/home) is stored in instead of in a separate partition, the
    partition can fill up causing the operating system to become unstable. Also, when
    upgrading your system to the next version of Red Hat Enterprise Linux it is a
    lot easier when you can keep your data in the /home partition as it will not be
    overwritten during installation. If the root partition (/) corrupt your data could
    be lost forever. By using a separate partition there is slightly more protection
    against data loss. You can also target this partition for frequent backups.


    /tmp and /var/tmp - Both the /tmp and /var/tmp directories are used to store data
    that does not need to be stored for a long period of time. However if a lot of
    data floods one of these directories can consume all of your storage space. If
    this happens and these directories are stored within / then your system could
    become unstable and crash. For this reason, moving these directories into their
    own partitions is a good idea.


    # ## 5.2. Utilize LUKS Partition Encryption


    During the installation process, an option to encrypt partitions is presented
    to the user. The user must supply a passphrase. This passphrase will be used as
    a key to unlock the bulk encryption key, which is used to secure the partition''s
    data.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 6. Software Maintenance


    Software maintenance is extremely important to maintaining a secure system. It
    is vital to patch software as soon as it becomes available in order to prevent
    attackers from using known holes to infiltrate your system.


    # 6.1. Install Minimal Software


    It is a recommended practice to install only the packages you will use because
    each piece of software on your computer could possibly contain a vulnerability.
    If you are installing from the DVD media take the opportunity to select exactly
    packages to install during the installation. When you need another package, you
    can add it to the system later.


    For more information on minimal installation, refer to Section 9.17, "Package
    Group Selection" of the Red Hat Linux Installation Guide. A minimal installation
    can also be performed via a kickstart file using the --nobase option. For more
    information, refer to Section 32.5, "Package Selection" of the Red Hat Enterprise
    Linux Installation Guide.


    # 6.2. Plan and Configure Security Updates


    All software contains bugs. Often these bugs can be a vulnerability that can expose
    your system to malicious users. Unpatched systems are a common cause of computer
    intrusions. You should have a plan to install security patches in a timely manner
    to close those vulnerabilities so they cannot be exploited.


    For users, security updates should be installed as soon as possible. Configuring
    automatic installation of security updates is one way to avoid having to remember,
    but carries a slight risk that something can conflict with your configuration
    or other software on the system.


    For business or advanced home users, security updates should be tested and scheduled
    for installation. Additional controls will be needed to protect the system during
    the time between the patch release and its installation on the system. These controls
    would depend on the exact vulnerability, but could include additional firewall
    rules, the use of external forwards, or changes in software settings.


    # 6.3. Adjusting Automatic Updates


    Red Hat Enterprise Linux is configured to apply all updates on a daily schedule.
    If you want to change how your system updates, you must do so via Software Preferences.
    You can change the schedule, the type of updates to, or notify you of available
    updates.


    In GNOME, you can find controls for your updates: System -> Preferences -> Software
    Updates. In KDE, it is located at: Applications -> Settings -> Software Updates.


    # 6.4. Install Signed Packages from Well Known Repositories


    Software packages are published through repositories. All known repositories support
    package signing. Signing uses public key technology to prove that the package
    was published by the repository has not changed since the signature was applied.
    This provides some protection against installing software that may have been maliciously
    altered after the package was created before you downloaded it.


    Using too many repositories, untrustworthy repositories, or repositories with
    unsigned packages has a higher risk of introducing malicious or vulnerable code
    into your system. Use caution when adding'
