  md: 'standardized Internet Protocol Security (IPsec) implementation. These VPN solutions,
    irrespective of whether they are hardware or software based, act as specialized
    routers that exist between the IP connection from one office to another.


    # 2.7.1. How Does a VPN Work?


    When a packet is transmitted from a client, it sends through the VPN router or
    gateway, which adds authentication and optionally encrypts the data. IPsec has
    various modes. The most commonly used configuration uses Tunnel Mode with Encapsulating
    Security Payload (ESP). Some proprietary VPN clients use Transport Mode with ESP,
    despite the difficulties when Transport Mode is deployed by NAT. The deployment
    of Authentication Header (AH) is uncommon and is mostly used between core routers
    where the overhead of ESP is unnecessary and encryption is not required. ESP as
    deployed by Red Hat Enterprise Linux includes authenticated headers, although
    other versions software implementations are sometimes mistakenly decrypted by
    ESP + AH, resulting in a double authentication layer.


    The receiving VPN router starts the header information, decrypts the data, and
    routes it to its destination (either a workstation or node on a network). Using
    a network-to-network connection, the receiving node on the local network receives
    the packets decrypted and ready for processing. The encryption and decryption
    process in a network-to-network VPN is transparent to a local layer.


    With such a heightened level of security, an attacker not only be able to intercept
    a packet, but needs to be able to decrypt the packet as well. Intruders who follow
    a man-in-the-middle attack between a server and client need at least one of the
    private keys for authenticating sessions. Additionally, adding such a private
    key only compromises current traffic and not traffic sent encrypted in the past.
    Because they employ several layers of authentication and encryption, VPNs are
    a secure and effective methods of connecting remote nodes to act as a unified
    ifanet.


    # 2.7.2. Openswan


    # 2.7.2.1. Overview


    # Overview


    Openswan is an open source, user space IPsec implementation in Red Hat Enterprise
    Linux. It employs the key establishment IKE (Internet Key Exchange) v1 and v2,
    implemented as a user-level daemon. Manual key establishment is also possible
    via ip xfrm commands, however this is not recommended. Openswan interfaces with
    the Linux kernel using netlink to transfer the encryption keys. Packet encryption
    and decryption happen in the Linux kernel.


    # Cryptographic Support


    Openswan uses the NSS (Network Security Services) cryptographic library, which
    is required for FIPS security compliance. More information on the FIPS (Federal
    Information Processing Standard) can be found in Section 9.2, “Federal Information
    Processing Standard (FIPS)”.


    # Installation


    Run the yum install openswan command to install Openswan.


