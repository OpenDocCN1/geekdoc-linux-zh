    # 2.8.3.1. IPTables Command Syntax


    The following sample iptables illustrates the basic syntax:


    ```

    iptables -A <chain> -j <target>

    ```


    - The A option specifies the rule to be appended to <chain>. Each chain is comprised
    of one or more rules, and is also known as a ruleset.


    The three built-in chains are INPUT, OUTPUT, and FORWARD. These are permanent
    and cannot be deleted. The chain specifies the point at which a packet is manipulated.


    - The j <target> option specifies the target of the rule; i.e., what to do if
    the packet matches the rule. Examples of built-in targets are ACCEPT, DROP, and
    REJECT.


    Refer to the iptables man page for information on the available chains, options,
    and targets.


    # 2.8.3.2. Basic Firewall Policies


    Establishing basic firewall policies creates a foundation for more detailed, user-defined
    rules.


    Each iptables is comprised of a default policy, and zero or more rules which work
    in concert with the default policy to define the overall rules for the firewall.


    The default policy for each chain can be DROP or ACCEPT. Security-minded administrators
    typically implement a default policy of DROP, and only allow specific packets
    on a case-by-case basis. For example, the policies block all incoming and outgoing
    packets on a network gateway:


    ```

    # iptables -P INPUT DROP

    # iptables -P OUTPUT DROP

    ```


    It is also recommended that all forwarded packets — network traffic that is to
    be routed from the firewall to its destination node — be denied as, to restrict
    internal clients from inadvertent exposure to the Internet. To do this, use the
    following rule:


    ```

    # iptables -P FORWARD DROP

    ```


    When you have established the default policies for each chain, you can create
    and save further rules for your particular network and security requirements.


    The following sections describe how to save iptables rules and outline some of
    the rules you might'
