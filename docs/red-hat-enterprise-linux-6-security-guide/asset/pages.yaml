  md: '+   - i Sets the incoming network interface, such as eth0 or pp0. With iptables,
    this optional parameter may only be used with the INPUT and FORWARD chains used
    with the filter PREROUTING chains with the nat and mangle tables.


    This parameter also supports the following special options:


    +   - Exclamation point (!) Reverses the direction, meaning any specified interfaces
    are excluded from this rule.


    +   - Plus char (+) A wildcard used to match all interfaces that match the specified
    string. For example, the parameter -i eth would apply this rule to any Ethernet
    interfaces but exclude other interfaces, such as pp0.


    If the -i parameter is used but no interface is specified, then every interface
    is affected by the rule.


    +   - j Jumps to the target when a packet matches a rule.

    The standard targets are ACCEPT, DROP, QUEUE, RETURN.


    Extended options are also available through modules loaded by default with the
    Red Hat Linux iptables RPM package. Valid in these modules include LOG, MARK,
    and REJECT, among others. Refer to the iptables for more information about these
    and other targets.

    This option can also be used to redirect a matching rule to a user-defined chain
