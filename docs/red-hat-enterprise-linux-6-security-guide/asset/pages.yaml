  md: '# 2.2.9. Verifying Which Ports Are Listening


    Unnecessary open ports should be avoided because it increases the attack surface
    of your system. If the system has been in service you find unexpected open ports
    in listening state, that might be signs of intrusion and it should be investigated.


    Issue the following command, as root, from the console to determine which ports
    are listening for connections from the network:


    ```

    #$ netstat -tanp | grep LISTEN

    tcp             0 0.0.0.0:*                   0.0.0.0:*

    LISTEN         1193/rpc.statd

    tcp             0 192.168.122.1:53          0.0.0.0:*

    LISTEN         1241/dnsmasq

    tcp             0 127.0.0.1:631               0.0.0.0:*

    LISTEN         1783/cupsd

    tcp             0 127.0.0.1:25             0.0.0.0:*

    LISTEN         7696/sendmail

    tcp             0 0.0.0.0:111               0.0.0.0:*

    LISTEN         1167/rpcbind

    tcp             0 127.0.0.1:30003          0.0.0.0:*

    LISTEN         1118/tcsd

    tcp             0 :::633                      *:::

    tcp             0 :::/init                    *:::

    tcp             0 :::35018                   *:::

    LISTEN         1193/rpc.statd

    tcp             0 :::111                      *:::

    LISTEN         1167/rpcbind

    ```


    Review the output of the command with the services needed on the system, turn
    off what is not specifically required or authorized, repeat the check. Proceed
    then make external checks using nmap from another system connected via the network
    to the first system. This can use the rules in iptables. Make a scan for every
    IP address in the netstat output (except for localhost 127.0.0.0/1 range) from
    an external system. Use the -6 option for scanning an IPv6 address. See man nmap(1)
    for more information.


    The following is an example of the command to be issued from the console of another
    system to determine which ports are listening for TCP connections from the network:


    ```

    #$ nmap -sT -0 192.168.122.1

    ```


    Refer to the man for netstat, nmap, and services for more information.


    # 2.2.10. Disable Source Routing


    Source routing is an Internet Protocol that allows an IP packet to carry information,
    a list of addresses, that tells the router the path the packet must take. There
    is also an option to record the hops as it is traversed. The list of hops taken,
    the "route record", provides the destination with a return path to the source.
    This allows the source (if so, the sending host) to specify the route, loosely
    or strictly, ignoring the routing tables of some or all of the routers. It can
    allow a user to redirect network traffic for malicious purposes. Therefore, source-based
    routing should be disabled.


    The accept_source_route option network interfaces to accept packets with the Strict
    Source Route (SSR) or Loose Source Routing (LSR) option set. The acceptance of
    source routed packets is controlled by sysctl settings. Use the following command
    as root to drop packets with the SSR or LSR'
