    # 1.2. Vulnerability Assessment


    Given time, resources, and motivation, an attacker can break into nearly any system.
    All of the security procedures and technologies currently available cannot guarantee
    that any systems are completely safe from intrusion. Routers help secure gateways
    to the Internet. Firewalls help secure the edge of the network. Virtual Private
    Networks safely pass data in an encrypted stream. Intrusion detection systems
    warn you of malicious activity. However, the success of each of these technologies
    is dependent upon a number of variables:


    +   - The expertise of the staff responsible for configuring, monitoring, and
    maintaining the technologies.

    - The ability to patch and update services and quickly and efficiently.

    - The ability of those responsible to keep constant vigilance over the network.


    Given the dynamic state of systems and technologies, securing corporate resources
    can be quite complex. Due to this complexity, it is often difficult to find resources
    for all of your systems. It is possible to have personnel knowledgeable in many
    areas of information security at a high level, it is difficult to retain staff
    who are experts in just a few areas. This is mainly because each subject area
    of information security requires constant attention and focus. Information security
    does not stand still.


    # 1.2.1. Thinking like the Enemy


    Suppose you manage an enterprise network. Such networks commonly comprise operating
    systems, applications, servers, monitors, firewalls, intrusion detection systems,
    and more. Now imagine trying to keep current with each of these. Given the complexity
    of today''s software and networking environments, exploits and bugs are a certainty.
    Keeping current with patches and updates for an entire network can prove to be
    a daunting task in a large organization with heterogeneous systems.


    Combine the expertise required with the task of keeping current, and it is inevitable
    that adverse incidents occur, systems are breached, data is corrupted, and service
    is interrupted.


    To augment security technologies and in protecting systems, networks, and data,
    you must think like a cracker and gauge the security of your checking for weaknesses.
    Preventative vulnerability assessments against your systems and network can reveal
    potential issues for the confidentiality, integrity, and availability of your
    network (explained in Section 1.1.1.3, Standardizing Security.). Typically, vulnerability
    assessment starts with a reconnaissance phase, during which important data regarding
    the target systems and resources is gathered. This phase leads to the system readiness
    phase, where the target is checked for all vulnerabilities. The readiness phase
    culminates in the report, where the findings are classified into categories of
    high, medium, and low risk; and methods for improving the security (or mitigating
    the risk of vulnerability) are targeted.


    If you perform a vulnerability assessment of your home, you would likely check
    each door of your home to see if they are closed and locked. You would also check
    every window, making sure that they are closed and latch correctly. This same
    concept applies to systems, networks, and electronic data. Malicious users are
    the thieves and vandals of your data. Focus on their tools, mentality, and motivations,
    and they can then react swiftly to their actions.


    16'
