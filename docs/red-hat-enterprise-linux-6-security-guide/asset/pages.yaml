    # 3.2.3. OpenSSL Intel AES-NI Engine


    The Intel Advanced Encryption Standard (AES-NI) engine is available for certain
    Intel processors, and allows for extremely fast hardware encryption and decryption.


    +   For a list of Intel processors that support the AES-NI engine, refer to: Intel''s
    ARK.


    The AES-NI engine is automatically enabled if the detected processor is among
    the supported ones.


    To check if the engine is enabled, run the following command as the root user:


    ```

    openssl engine -c -tt

    ```


    To test its speed, run the following command as root:


    ```

    openssl speed aes-128-cbc

    ```


    To test the speed of OpenSSH you can run a command like the following:


    ```

    $# dd if=/dev/zero count=100M | ssh -c aes128-cbc localhost "cat /dev/null"

    root@localhost: password:

    100+ records in

    100+ records out

    104857600 bytes (100 MB) copied, 4.8186 s, 21.8 MB/s

    ```


    You can find out about the AES-NI engine at the following URL: http://software.intel.com/en-articles/intel-advanced-encryption-standard-aes-ni.


    # 3.2.4. LUKS Disk Encryption


    Linux Unified Key Setup-on-disk (LUKS) allows you to encrypt partitions on your
    Linux computer. This is particularly important when it comes to mobile computers
    and removable media. LUKS allows multiple user keys to decrypt a master key which
    is used for the bulk encryption of the partition.


    # Overview of LUKS


    # What LUKS likes


    +   - LUKS encrypts entire blocks and is therefore well-suited for protecting
    the contents of mobile devices such as removable storage media or laptop disk
    drives.

    - The underlying contents of the encrypted block device are arbitrary. This makes
    it useful for encrypting swap devices. This can also be useful with certain databases
    that use specially formatted block devices for data storage.

    - LUKS uses the existing device mapper kernel subsystem.

    - LUKS provides passphrase strengthening which protects against dictionary attacks.'
