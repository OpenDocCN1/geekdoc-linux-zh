  md: '# Chapter 3. Encryption


    There are two types of data that must be protected: data at rest and data in motion.
    These different types of data are protected in similar ways using similar technology
    but the implementations can be completely different. No single protective implementation
    can prevent all methods of compromise as the same information may be at rest and
    in motion at different points in time.


    # 3.1. Data at Rest


    Data at rest is data stored on a hard drive, tape, CD, DVD, disk, or other media.
    This information''s biggest threat comes from being physically stored. Laptops
    in airports, CDs going through the mail, and backup tapes that left in the wrong
    places are all examples of where data can be compromised by theft. If the data
    is encrypted on the media, it lowers the chances of the data being compromised.


    # 3.1.1. Full Disk Encryption


    Full disk or partition encryption is one of the best ways of protecting your data.
    Not is only each file protected but also the temporary storage that may contain
    parts of these files is also protected. Full disk encryption will protect all
    of your files so you do not have to worry about selecting what you want to protect
    and missing a file.


    Red Hat Linux 6 supports LUKS encryption. LUKS bulk encrypts your hard drive partitions
    that when your computer is off, your data is protected. This will also protect
    your computer from attackers attempting to use single-user-mode to login to your
    computer or otherwise gain access.


    Full encryption solutions like LUKS only protect the data when your computer is
    off. When the computer is on and LUKS has decrypted the data, the files on that
    disk are available to anyone who would normally have access to them. To protect
    your files when the computer is on, use full disk encryption in combination with
    another solution such as file encryption. Also remember to lock your password
    whenever you are away from it. A passphrase protected screen saver to activate
    after a few minutes of inactivity is a good way to keep intruders out. For more
    information on LUKS, refer to [Section 3.2.4,"LUKS Disk Encryption\].


    # 3.1.2. File Based Encryption


    GnuPG (GPG) is an open source version of PGP that allows you to sign/or encrypt
    a file or an email message. This is useful to maintain integrity of the message
    or also protect the confidentiality of the information contained within the file.
    In case of email, GPG provides dual protection. Not only can it provide Data at
    Rest protection but also Data in Motion once the message has been sent across
    the network.


    File based encryption is used to protect the contents of files on mobile storage
    devices, such as CDs, flash drives, or external hard drives. Some file based encryption
    solutions may leave remnants of the encrypted files that an attacker who has physical
    access to your computer can recover under some circumstances. To protect the contents
    of these files from attackers who may have access to your computer, use file based
    encryption combined with another solution such as full disk encryption.


    # 3.2. Data in Motion


    Data in motion is data that is transmitted over a network. The biggest threat
    to data in motion is interception and alteration. Your username and password should
    never be transmitted over a network without protection as it could be intercepted
    and used by someone to impersonate you or gain access to sensitive information.
    Encrypting the network session ensures a higher security level for data in motion.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'Data in motion is particularly vulnerable to attackers because the attacker
    does not have to be near the computer in which the data is being stored rather
    they only have to be somewhere along the path. Encryption tunnels can protect
    the path of communications.


    # 3.2.1. Virtual Private Networks


    Virtual Private Networks (VPN) provide encrypted tunnels between computers or
    networks across all ports. With a VPN in place, network traffic from the client
    is forwarded to the server through the encrypted tunnel. This means the client
    is locally on the same network as the server it is connected via the VPN. VPNs
    are very common and simple to use setup.


    # 3.2.2. Secure Shell


    Secure Shell (SSH) is a powerful network protocol used to communicate with any
    system over a secure channel. The transmissions over SSH are encrypted and protected
    from interception. Cryptographic log can also be used to provide a better authentication
    method over traditional usernames and passwords.


    SSH is very easy to activate. By starting the sshd service, the system begins
    to accept connections and will allow access to the system when a correct username
    and password is provided during the connection process. The standard TCP port
    for the SSH service is 22, however this can be changed by modifying the configuration
    file /etc/ssh/ssh_config and restarting the service. This file also contains other
    configuration for SSH.


    Secure Shell (SSH) also provides encrypted tunnels between computers but only
    using a single port. Port forwarding can be done over an SSH tunnel and traffic
    will be encrypted as it passes over that tunnel using port forwarding is not fluid
    as a VPN.


    # 3.2.2.1. SSH Cryptographic Login


    SSH supports the use of cryptographic keys to log in a computer. This is much
    more secure than using a password and if set properly could be considered multifactor
    authentication.


    A change must occur before cryptographic logon can occur. In the file /etc/ssh/ssh_config
    uncomment and modify the following lines so that appear as such:


    ```

    PubkeyAuthentication yes

    AuthorizedKeysFile .ssh/authorized_keys

    ```


    The first line tells the SSH program to allow public key authentication. The second
    line points to a file in the home directory where the public key of authorized
    pairs exists on the system.


    The next thing to do is to generate the SSH keys using RSA 2048-bit set for logging
    into the system. The keys you use to connect to the system are stored, by default,
    in ~/.ssh. You can utilize the -b to modify the bit-strength of the key. Using
    2048-bit is normally sufficient.


    In your ~/.ssh directory you see the two keys you just created. If you accepted
    the defaults when running the sshkeygen then your keys are id_rsa and id_rsa.pub,
    the private and public keys. You should always protect the private key from exposure.
    The public key, however, needs to be transferred over the system you are going
    to log in. Once you have used the easiest way to add the key to the approved list
    is:


    ```

    $ cat id_rsa.pub >> ~/.ssh/authorized_keys

    ```'
