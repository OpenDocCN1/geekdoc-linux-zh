    # 2.1.3.2.2. Passphrases


    Passphrases and passwords are the cornerstone to security in most of today''s
    systems. Unfortunately, techniques such as biometrics and two-factor authentication
    have not yet become mainstream in many systems. Passphrases are going to be enabled
    to secure a system, then the use of passphrases should be considered. Passphrases
    are longer than passwords and provide better protection than a password even when
    implemented with non-standard characters as numbers and symbols.


    # 2.1.3.2.3. Password Aging


    Password aging is another technique used by system administrators to defend against
    bad passwords within an organization. Password aging means that after a specified
    period (usually 90 days), the user is prompted to create a new password. The theory
    behind this is if a user is forced to change his password periodically, a cracked
    password is only useful to an intruder for a limited amount of time. The downside
    to password aging, however, is that users are more likely to write their passwords
    down.


    There are two primary programs to specify password aging under Red Hat Enterprise
    Linux: the **chage** command or the graphical **User Manager** (*system-config-users*)
    application.


    > > Shadow passwords must be enabled to use the **chage** command. For more information,
    see the Red Hat Enterprise Linux 6 Deployment Guide.


    The **-M** option of the **chage** command specifies the maximum number of days
    that the password is valid. For example, to set a user''s password to expire in
    90 days, using the following command:


    ```

    chage -M 90 <username>

    ```'
