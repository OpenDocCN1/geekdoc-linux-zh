  md: 'in addition to symmetric algorithms. Using the techniques of public key-private
    key cryptography, many methods of protecting communications or authenticating
    messages formerly unknown have become practical. They do not require a secure
    initial exchange of one or more secret keys as required when using symmetric key
    algorithms. It can also be used to create digital signatures. [34]


    Public key cryptography is a fundamental and widely used technique around the
    world, and it is the approach under which Internet standards as Transport Layer
    Security (TLS) successor to SSL, PPG and PGP, [15]


    The distinguishing technique used in public key cryptography is the use of asymmetric
    key algorithms, where the key used to encrypt a message is not the same as the
    key used to decrypt it. Each user uses a pair of cryptographic keys — a public
    key and a private key. The private key is kept secret, whilst the public key may
    be widely distributed. Messages are encrypted with the recipient''s public key
    and can be decrypted with the corresponding private key. The keys are related
    mathematically, but the private key cannot be feas derived from the public key.
    It was the discovery of symmetric algorithms which revolutionized the practice
    of cryptography in the middle of the 1970s. [16]


    In contrast, Symmetric-key algorithms, variations of which have been used for
    thousands of years, use a single secret key shared by sender and receiver (which
    must also be kept private, thus accounting for the ambiguity of the common terminology)
    for both encryption and decryption. To use a symmetric encryption scheme, the
    sender and receiver must securely share a key in advance. [17]


    Because symmetric key algorithms are always much less computationally intensive,
    it is common to exchange a key using a key-exchange and transmit data using that
    key and a symmetric key algorithm. PPG, and the SSL/TLS family of schemes do this,
    and are called hybrid cryptystems in sequence. [18]


    # A.2.1. Diffie-Hellman


    Diffie-Hellman exchange (D–H) is a cryptographic protocol that allows two parties
    that have no prior knowledge of each other to jointly establish a shared secret
    key over an insecure communications channel. This key can then be used to encrypt
    secret communications using a symmetric key cipher. [19]


    # A.2.1.1. Diffie-Hellman History


    The scheme was first published by Whitehead Diffie and Martin Hellman in 1976,
    later it emerged that it had been separately invented a few years earlier by GCHQ,
    the British intelligence agency, by Malcolm J. Williamson but was classified.
    In 2002, Hellman suggested the algorithm be Diffie–Merkle key exchange in recognition
    of Ralph Merkle''s contribution to the invention of public-key cryptography (Hellman,
    2002). [20]


    Although Diffie-Hellman agreement is an anonymous (non-authenticated) key-agreement
    protocol, it provides the basis for a variety of authenticated protocols, and
    is used to provide perfect forward secrecy in Transport Layer Security''s ephemeral
    modes (referred to as EDH or DHE depending on the cipher suite). [21]


    U.S. Patent 4,200,770, now expired, describes the algorithm and credits Hellman,
    Diffie, and Merkle as inventors. [22]


