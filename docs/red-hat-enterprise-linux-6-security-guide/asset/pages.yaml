- img_proc: true
  md: '# 1.1.1. Security Today


    In February 2000, a Distributed Denial of Service (DDoS) attack was unleashed
    on several of the most heavily-trafficked sites on the Internet. The attack rendered
    yahoo.com, cnn.com, amazon.com, fbi.gov, and other sites completely unreachable
    to normal users, as it tied up routers for several hours with large-byte ICMP
    packet transfers, also called a ping flood. The attack was brought on by unknown
    attackers using specially created widely scanned network servers, installed client
    applications Trojans on the servers, and attacked with every infected flooding
    the visiting sites and rendering them unreachable. Many blame the attack on fundamental
    flaws in the way routers and protocols are used to accept all incoming data, no
    matter where or for what purpose the packets are sent.


    In 2007, a data breach exploited the widely-known weaknesses of the Wired Equivalent
    Privacy (WEP) wireless encryption protocol used in the theft from a financial
    institution of over 45 million credit cards. [3]


    In a separate incident, the billing records of over 2.2 million patients were
    stolen from a backup tape on the front seat of a courier''s car. [4]


    Unfortunately, system and network security can be a difficult problem, requiring
    an intricate knowledge of how an organization regulates, uses, manages, and transmits
    its information. Understanding the way an organization (and the people who make
    up the organization) conducts business is paramount to implementing a proper security
    policy.


    # 1.1.1.3 Standardizing Security


    Enterprises in every industry rely on regulations and rules that are set by standards-making
    bodies such as the American Medical Association (AMA) or the Institute of Electrical
    and Electronics Engineers (IEEE). The same ideals true information for security.
    Many security consultants and vendors agree upon the standard security model as
    CIA, or Confidentiality, Integrity, and Availability. This three-tiered model
    is a generally accepted component to assessing risks of sensitive information
    and establishing security policy. The following describes the CIA model in detail:


    +   - Confidentiality — Information must be only available to a set of pre-defined
    individuals. Unauthorized transmission and use of information should be restricted.
    For example, confidentiality of information ensures that a customer''s personal
    or financial information is not obtained by an unauthorized individual for malicious
    purposes such as identity theft or fraud.


    +   - Integrity — Information should not be altered in ways that render it incomplete
    or incorrect. Unauthorized users should be restricted from the ability to modify
    or destroy sensitive information.


    +   - Availability — Information should be accessible to authorized users any
    time that it is needed. Availability is a warranty that can be obtained with an
    agreed-upon frequency and timeliness. This is often measured in terms of percentages
    and agreed to formally in Service Level Agreements (SLAs) by network service providers
    and their enterprise clients.


    # 1.1.2 SELinux


    Red Hat Linux includes an enhancement to the Linux kernel called SELinux, which
    implements a Mandatory Access Control (MAC) architecture that provides a fine-grained
    control over files, processes, and applications in the system. Detailed discussion
    of SELinux is beyond the scope of this document; however, for more information
    on SELinux and its use in Red Hat Enterprise Linux, refer to the Red Hat Enterprise
    Linux SELinux User Guide. For more information on configuring and running services
    that are protected by SELinux, refer to the SELinux Managing Confined Services
    Guide. Available resources for SELinux are listed in Chapter 10, References.'
