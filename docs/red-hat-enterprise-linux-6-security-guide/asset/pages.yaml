    # Abstract


    This book assists users and administrators in learning the processes and practices
    of securing workstations and servers against local and remote intrusion, exploitation
    and malicious activity. Focused on Red Hat Enterprise Linux by detailing concepts
    and techniques valid for all Linux systems, this guide details the planning and
    the tools involved in creating a secure computing environment for the data center,
    workplace, and home. With proper administrative knowledge, vigilance, and tools,
    systems running Linux can be fully functional and secured from most common intrusion
    and exploit methods.'
