  md: "# # Chapter 8. Compliance and Vulnerability Scanning\n\n# ## 8.1. SCAP Introduction\n\
    \nIf you want to increase your organization's security level and ensure that risks,\
    \ to which your systems can be exposed, are minimized, you want to include the\
    \ Security Content Automation Protocol (SCAP) line of standards on your systems.\
    \ SCAP is a line of standards managed by the National Institute of Standards and\
    \ Technology (NIST). It was created to provide a standardized approach to maintaining\
    \ the security of enterprise systems, such as verifying presence of patches, checking\
    \ system security configuration settings, and examining systems for signs of compromise.\n\
    \nThe main advantage of SCAP is that scan used for checking and validating of\
    \ security content is separated from the scanned content. Both, security policies\
    \ (security content) and scanning tools can be written by third parties. A security\
    \ policy can be checked to verify policies by multiple parties.\n\nTo do: explain\
    \ some basic SCAP terms: CPE density, SACP content, SCAP datastream, SCAP results,\
    \ benchmark, profile, rule, security asset...\n\nThe following are standard SCAP\
    \ components:\n\n+   * Languages:\n    - XCCDF - The Extensible Configuration\
    \ Checklist Description Format is a language designed for expressing, organizing,\
    \ and managing security guidance.\n    - OVAL - Open Vulnerability and Assessment\
    \ Language is a language developed for making logical assertions about the state\
    \ of the scanned system.\n    - OCIL - Open Checklist Interactive Language is\
    \ a language created to provide a standard way of querying a user.\n    - AI -\
    \ Asset identification is a language developed to provide a data model for identifying\
    \ security assets, methods for asset identification, and guidance on how to use\
    \ asset identification.\n    - ARF - Asset Reporting Format is a language designed\
    \ to express the transport format of information assets, and the relationships\
    \ between assets and reports.\n* Enumerations:\n    - CCE - Common Configuration\
    \ Enumeration is an enumeration of security-relevant configuration elements for\
    \ applications and operating.\n    - CPE - Common Platform Enumeration is a structured\
    \ named scheme used to identify information technology systems, platforms, and\
