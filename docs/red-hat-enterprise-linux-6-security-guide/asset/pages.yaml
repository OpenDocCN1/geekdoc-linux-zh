  md: '# 1.2.3.4. Anticipating Your Future Needs


    Depending upon your target and resources, there are many tools available. Tools
    for networks, Novel networks, Windows systems, Linux systems, and more. Another
    essential part of performing assessments may include reviewing physical security,
    personnel screening, or voice/PBX network assessment. New concepts, such as walking
    and wardriving, which involves scanning the perimeter of your enterprise''s physical
    structures for network vulnerabilities, are concepts that you should investigate
    and, if needed, incorporate into your assessments. Imagination and exposure are
