    # 2.6.1 TCP Wrappers


    The TCP Wra packages (tcp_wrappers and tcp_wrappers-libs) are installed by default
    and provide host-based access to network services. The most important component
    in the package is the /lib/libwrap.so or /lib64/libwrap.so library. In general
    terms, a TCP-wrapped service is one that has been compiled against the libwrap.so
    library.


    When a connection attempt is made to a TCP-wrapped service, the service first
    references the host''s access files (/etc/hosts.allow and /etc/hosts.deny) to
    determine whether or not the client is allowed to connect. In most cases, it uses
    the syslog daemon (syslogd) to write the name of the requesting client and the
    requested service to /var/log/secure or /var/log/messages.'
