    > Note

    In general, rebooting the system is the sure way to ensure that the latest version
    of a software package is used; however, this option is not always required, or
    available to the system administrator.


    # Applications


    User-space applications are any programs that can be initiated by a system user.
    Typically, such applications are used only when using a user, script, or automated
    task launches them and they do not persist for long periods of time.


    Once such a user-space application is updated, halt any instances of the application
    on the system and launch the program again to use the updated version.


    # Kernel


    The kernel is the core software component for the Red Hat Enterprise Linux operating
    system. It manages access to memory, the processor, and peripherals as well as
    schedules all tasks.


    Because of its central role, the kernel cannot be restarted without stopping the
    computer. Therefore, an updated version of the kernel cannot be used until the
    system is rebooted.


    # Shared Libraries


    Shared libraries are units of code, such as glibc, which are used by a number
    of applications'
