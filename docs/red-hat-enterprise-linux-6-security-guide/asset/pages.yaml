    # 2.8.3.3. Saving and Restoring IPTables Rules


    Changes to iptables are transient; if the service is rebooted or the iptables
    service is restarted, the rules are automatically flushed and reset. To save the
    rules so that they are loaded when the iptables service is started, use the following
    command as the root user:


    ```

    -# service iptables save

    iptables: Saving firewall rules to /etc/sysconfig/iptables:[ OK ]

    ```


    The rules are stored in the file /etc/sysconfig/iptables and are applied whenever
    the service is started or the machine is rebooted.


    # 2.8.4. Common IPTables Filtering


    Preventing attackers from accessing a LAN is one of the most important aspects
    of network security. The integrity of a LAN should be protected from malicious
    users through the use of stringent firewall rules.


    However, with a default policy to block all incoming, outgoing, and forwarded
    packets, it is impossible for the firewall/gateway and internal LAN users to communicate
    with each other or with external resources.


    To allow users to perform network-related functions and to use networking applications,
    administrators must open certain ports for communication.


    For example, to allow access to port 80 on the firewall, append the following
    rule:


    ```

    ~# iptables -A INPUT -p tcp -m tcp --dport 80 -j ACCEPT

    ```


    This allows users to browse websites that communicate using the standard port
    80. To allow access to secure websites (for example, https://www.example.com/),
    you also need to provide access to port 443, as follows:


    ```

    ~# iptables -A INPUT -p tcp -m tcp --dport 443 -j ACCEPT

    ```


    > When creating an iptables ruleset, order is important.

    If a rule affects packets from the 192.168.100.0/24 subnet is dropped, and followed
    by a rule that allows packets from 192.168.100.13 (which is within the dropped
    subnet), then the second rule is ignored.

    The rule to allow packets from 192.168.100.13 must precede the rule that drops
    the remainder of the subnet.

    To insert a rule in a specific location in an existing chain, use the -I option.
    For example:


    ```

    ~# iptables -I INPUT 1 -i lo -p all -j ACCEPT

    ```


    This rule is inserted as the first rule in the INPUT chain to allow local loopback
    device traffic.


    There may be times when you require remote access to the LAN. Secure services,
    for example SSH, can be used for encrypted connection to LAN services.'
