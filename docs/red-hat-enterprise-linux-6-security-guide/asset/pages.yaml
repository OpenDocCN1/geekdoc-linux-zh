  md: 'LUKS devices contain multiple key slots, allowing users to backup keys/passphrases.


    # What LUKS does not do:


    +   - LUKS is not well-suited for applications requiring many (more than eight)
    users to have distinct access keys to the same device.

    - LUKS is not well-suited for applications requiring file-level encryption.


    # 3.2.4.1. LUKS Implementation in Red Hat Enterprise Linux


    Red Hat Enterprise Linux 6 uses LUKS to perform file encryption. By default, the
    option to encrypt the file system is unchecked during the installation. If you
    select the option to encrypt your hard drive, you will be prompted for a passphrase
    that will be asked every you boot the computer. This passphrase "unlocks" the
    bulk encryption key that is used to encrypt your partition. If you choose to modify
    the partition table you can choose partitions to use. This is set in the partition
    table settings.


    The default cipher for LUKS (refer to `cryptsetup --help`) is aes-cbc-essiv:sha256.
    Note that the installation program, Anaconda, uses by default the AES cipher in
    XTS mode, aes-xts-plain64. The default key size for LUKS is 256 bits. The default
    key size for LUKS with Anaconda (XTS mode) is 512 bits.


    > Warning


    Changing the default cryptographic attributes can affect your system''s performance
    and expose your system to various security risks. You should not change the default
    cryptographic attributes of your system without good knowledge of cryptography
    and understanding to the capabilities of the used cipher combinations.


    Red Hat strongly recommends using the default cipher. If you need to use another
    than the default cipher, you can initialize your partition with the `--cipher`
    and `--key-size` options. The syntax of the command is:


    ```

    cryptsetup --verify-passphrase --cipher <cipher>-<mode>-iv --key-size size luksFormat
    <device>

    ```


    where `<cipher> <mode> <iv>` is a string representing the used cipher. The string
    consists of three parts: a block cipher, a block mode, and an initial vector (IV).


    A block cipher is a deterministic algorithm that operates on blocks and allows
    encryption and decryption of block data. Block ciphers that are available on Red
    Hat Enterprise Linux are:


    +   - AES — Advanced Encryption Standard, a 128-bit symmetric block cipher encryption
    keys with lengths of 128, 192, and 256 bits; for more information, refer to the
    FIPS PUB 197.

    - Twofish — A 128-bit block cipher operating with encryption keys of the range
    from 128 to 256 bits.

    - Serpent — A 128-bit block cipher operating with 128-bit, 192-bit and 256-bit
    encryption keys.

    - cast5 — A 64-bit Feistel cipher supporting encryption keys of the range from
    128 to 256 bits; for more information, refer to the RFC 2144.

    - cast6 — A 128-bit Feistel cipher using 128-bit, 160-bit, 192-bit, 224-bit, or
    256-bit encryption keys.'
