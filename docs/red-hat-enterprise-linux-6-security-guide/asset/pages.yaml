- img_proc: true
  md: '# /usr/bin/ypserv — This is the NIS server daemon.


    NIS is somewhat insecure by today''s standards. It has no host authentication
    mechanisms and transmits all of information over the network unencrypted, including
    password hashes. As a result, extreme care must be taken when using a network
    that uses NIS. This is further complicated by the default configuration of NIS
    is insecure.


    It is recommended that anyone planning to implement a NIS server first secure
    the **portmap** service and address the following issues, such as network planning.


    # 2.2.3.1. Carefully Plan the Network


    Because NIS transmits sensitive information unencrypted over the network, it is
    important the service be behind a firewall and on a segmented network. Whenever
    information is transmitted over an insecure network, it risks being intercepted.
    Careful network design can help prevent security breaches.


    # 2.2.3.2. Use a Password-like NIS Domain Name and Username


    Any machine within a NIS domain can use commands to extract information from the
    server without authentication, as long as the user knows the NIS server''s DNS
    hostname and NIS domain name.


    For instance, if someone connects a laptop to the network or breaks into the network
    (and manages to spoof an internal IP address), the following command reveals the
    **/etc/passwd** map:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> passwd

    ```


    If this attacker is a root user, they can obtain the /etc/shadow file by typing
    the following command:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> shadow

    ```


    > Note

    If Kerberos is used, the /etc/shadow file is not stored within a NIS map.


    To access NIS maps harder for an attacker, create a random string for the DNS
    hostname, such as **07hfwagtmg.domain.com**. Similarly, create a *different* randomized
    NIS domain name. This makes it much more difficult for an attacker to access the
    NIS server.


    # 2.2.3.3. Edit the /var/yp/securenets File


    If the /var/yp/securenets file is blank or does not exist (as is the case after
    a default installation), NIS lists to all networks. The first of things to do
    is to put netmask/network pairs in the file so that **ypserv** only responds to
    requests from the appropriate network.


    Below is a sample entry from a /var/yp/securenets file:


    ```

    255.255.255.0    192.168.0.0

    ```'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Red Enterprise Linux 6 Security Guide


    > **Warning** Never start a NIS server for the first time creating the /var/yp/securenets
    file.


    This technique does not provide protection from an IP spoofing attack, but it
    does at least place limits on what networks the NIS server services.


    # 2.2.3.4. Assign Static Ports and Use iptables Rules


    All of the servers related to NIS can be assigned specific ports except for rpc.ypasswd
    — the daemon that allows users to change their login password. Assigning ports
    to the other two NIS daemons, rpc.ypxfrd and ypserv, allows for the creation of
    firewall rules to further protect the NIS server from intruders.


    To do this, add the following lines to /etc/sysconfig/network:


    ```

    YPSERV_ARGS="-p 834"

    YPXFRD_ARGS="-p 835"

    ```


    The following iptables rules can then be used to enforce which the network server
    listens to these ports:


    ```

    # iptables -A INPUT -p ALL -s 192.168.0.0/24 --dport 834 -j DROP

    # iptables -A INPUT -p ALL -s 192.168.0.0/24 --dport 835 -j DROP

    ```


    This means that the server allows connections to ports 834 and 835 if the requests
    come from the 192.168.0.0/24 network, regardless of the protocol.


    > **Note** Refer to Section 2.8, “Firewalls” for more information about implementing
    firewalls with iptables commands.


    # 2.2.3.5. Use Kerberos Authentication


    One of the issues to consider when NIS is used for authentication is that the
    password map is sent whenever a user logs into a machine, a password hash from
    the /etc/shadow is sent over the network. If an intruder gains access to a NIS
    domain and sniffs network traffic, they can collect usernames and password hashes.
    With enough time, a password cracking program can guess weak passwords, and an
    attacker can gain access to a valid account on the network.


    Since Kerberos uses secret-key cryptography, no password hashes are ever sent
    over the network, making the system far more secure. Refer to Managing Single
    Sign-On and Smart Cards for more information about Kerberos.


    # 2.2.4. Securing NFS


