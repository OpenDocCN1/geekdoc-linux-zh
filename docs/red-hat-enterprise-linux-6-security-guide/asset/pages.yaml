    # 1.5.2. Verifying Signed Packages


    All Red Enterprise Linux packages are signed with the Red Hat GPG key, GPG stands
    for GNU Privacy Guard, or GruPG, a free software package used for ensuring the
    authenticity of distributed files. For example, a private (secret key) locks the
    package while the public key unlocks and verifies the package. If the public key
    distributed by Red Hat Enterprise Linux does not match the private key by RPM
    verification, the package may have been altered and cannot be trusted.


    The RPM utility within Red Hat Enterprise Linux automatically tries to verify
    the GPG signature of an RPM package before installing it. If the Red Hat GPG key
    is not installed, install it from a secure, static location, such as a Red Hat
    installation CD-ROM or DVD.


    Assuming the disc is mounted in /mnt/cdrom, use the following command to use the
    root user to import it in the keyringing (a database of trusted keys on the system):


    ```

    # rpm --import /mnt/cdrom/RPM-GPG-KEY

    ```


    Now, the Red Hat GPG key is located in the /etc/pki/rpm-gpg/ directory.


    To list all of keys installed for RPM verification, execute the following command:


    ```

    # rpm -qa gpg-pubkey*

    gpg-pubkey-db42a60e-37ea5438

    ```


    To details about a specific key, use the rpm -qi command followed by the output
    from the previous command, as in example:


