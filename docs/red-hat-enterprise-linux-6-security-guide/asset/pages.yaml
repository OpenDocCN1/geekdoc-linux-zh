    \ rule allows all incoming HTTP requests from the firewall to the intended destination;\
    \ the Apache HTTP Server behind the firewall.\n\n# 2.8.5.3. DMZs and IPTables\n\
    \nYou can create iptables rules to route traffic to certain machines, such as\
