    # 1.3. Attackers and Vulnerabilities


    To plan and implement a good security strategy, be aware of some of the issues
    determined, motivated attackers exploit to compromise systems. However, before
    detailing these issues, the terminology used when identifying an attacker must
    be defined.


    # 1.3.1. A Quick History of Hackers


    The modern meaning of the term hacker has origins back to the 1960s and the Massachusetts
    Institute of Technology (MIT) Tech Model Railroad Club, which designed trains
    of large scale and intricate detail. Hacker was name used for club members who
    discovered a clever trick or workaround for a problem.


    The term hacker has since come to describe everything from computer buffers to
    gifted programmers. A common trait among hackers is a willingness to explore in
    detail how systems and networks function with little or no outside motivation.
    Open source developers often consider themselves and their colleagues as hackers,
    and use this as a term of respect.


    Typically, hackers follow a form of the hacker ethic which dictates that the quest
    for information and expertise is essential, and that sharing this knowledge is
    the hackers duty to the community. During this quest for knowledge, some hackers
    enjoy the academic challenges of circumventing security controls on computer systems.
    For this reason, the press often uses the term hacker to describe those who illicit
    access systems and networks with malicious, or criminal intent. The more accurate
    term for this type of hacker is cracker — a term created by hackers in the mid-1980s
    to differentiate the two communities.


    # 1.3.1.1. Shades of Gray


    Within the community of individuals who find and exploit vulnerabilities in systems
    and networks are several distinct groups. These groups are described by the shade
    of hat that they "wear" when performing security investigations and this is indicative
    of their intent.


    The white hat hacker is one who tests systems and examine their performance and
    determine how vulnerable they are to intrusion. Unlike, white hat hackers crack
    their own systems or the systems of a client who has specifically employed them
    for the purposes of security auditing. Academic researchers and professional security
    consultants are two examples of white hat hackers.


    A black hacker is synonymous with a cracker. In general, crackers are less focused
    on programming the academic side of breaking into systems. They often rely on
    cracking programs and exploit known vulnerabilities in systems to uncover sensitive
    information for personal gain or to inflict damage on the target system or network.


    The gray hat hacker, on the other hand, has the skills and intent of a white hat
    hacker in most situations but uses his knowledge for less noble purposes on occasion.
    A gray hat hacker can be thought of'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'as a white hacker who weaks a black hat at times to accomplish his own agenda.


    Gray hat hackers typically subscribe to another form of the hacker ethic, which
    says it is acceptable to break into systems as long as the hacker does not commit
    theft or breach confidentiality. Some would argue, however, that the act of breaking
    into a system is itself unethical.


    Regardless of the intent of the author, it is important to know the weaknesses
    a cracker may likely attempt to exploit. The remainder of the chapter focuses
    on these issues.


    # 1.3.2. Threats to Network Security


    Bad practices when configuring the following aspects of a network can increase
    the risk of attack.


    # 1.3.2.1. Insecure Architectures


    A misconfigured network is a primary entry point for unauthorized users. Leaving
    a trusted-based, local network variable to the highly-insecure Internet is like
    leaving a door ajar in a crime-ridden neighborhood—nothing may harm for any arbitrary
    amount of time, but eventually someone exploits the opportunity.


    # 1.3.2.1. Broadcast Networks


    System administrators often fail to realize the importance of networking hardware
    in their security schemes. Simple hardware such as hubs and routers on the broadcast
    or non-switched principle; however, whenever a node transmits data across the
    network to a recipient node, the hub or router sends a broadcast of the data packets
    until the recipient node receives and processes resolution protocol (ARP) or media
    access control (MAC) address spoofing by outside intruders and unauthorized users
    on local hosts.


    # 1.3.2.2. Centralized Servers


    Another potential pitfall is the use of centralized computing. A common cost-cutting
    measure for many businesses is to consolidate all services to a single powerful
    machine. This can be convenient easier to manage and costs considerably less than
    multiple-server configurations. However, a centralized server introduces a single
    point of failure on the network. If the server is compromised, it may render the
    network completely useless or prone to data manipulation or theft. In these situations,
    a centralized server becomes an open door which allows access to the entire network.


    # 1.3.3. Threats to Server Security


    Server security is as important as network security because servers often hold
    a great deal of an organization''s vital information. If a server is compromised,
    all of its contents may become available for the cracker to steal or manipulate
    without. The following sections detail some of the main issues.


    # 1.3.3.1. Unused Services and Open Ports


    A full installation of Red Hat Enterprise 6 contains 10000+ addition and library
    packages. However, server administrators do not install every single package in
    the distribution, preferring instead to install a base installation of packages,
    including server applications.


    A common occurrence among system administrators is to install the operating system
    without paying attention to what programs are actually installed. This can be
    problematic as unnecessary services are installed, configured with the default
    settings, and possibly turned on. This can cause unwanted services, such as Telnet,
    DHCP, DNS, to run on a server or workstation without the administrator realizing
    it, which in turn can cause unwanted traffic to the server, or even a potential
    pathway into the system for crackers. Refer To Section 2.2, "Server Security"
    for information on closing ports and disabling unused services.'
