    # 2.8. Firewalls


    information security is commonly thought of as a process and not a product. However,
    standard security implementations usually employ some form of dedicated mechanism
    to control access privileges and restrict network resources to users who are authorized,
    identifiable, and traceable. Red Hat Enterprise Linux includes several tools to
    assist administrators and security engineers with network-level access issues.


    Firewalls are one of the core components of a network security implementation.
    Several market firewall solutions catering to all levels of the marketplace: from
    home users protecting one PC to data center solutions safeguarding vital enterprise
    information. Firewalls can be stand-alone hardware appliances by Cisco, Nokia,
    and Sonicwall. Vendors such as Checkpoint, McAfee, and Symantec have also developed
    proprietary software firewall solutions for home and business markets.


    Apart from the differences between hardware and software firewalls, there are
    also differences in the way firewalls function that separate one solution from
    another. Table 2.6, “Firewall Types” details three common types of firewalls and
    how they function:'
