  md: 'Ciphers and Message Authentication Codes (MACs) are set in FIPS mode by default
    in the /etc/ssh/ssh_config file. If your ssh_config contains any other ciphers
    or MACs, modify it to only use algorithms supported in FIPS mode, that is the
    following configuration or a subset thereof:


    ```

    Protocol 2

    Ciphers aes128-ctr, aes192-ctr, aes256-ctr, aes128-cbc, 3des-cbc, aes192-cbc,
    aes256-cbc

    MACs hmac-sha1, hmac-sha2-256, hmac-sha2-512

    ```


    Should require FIPS compliance, the fips=1 kernel option needs to be added to
    the kernel command line during installation so that key generation is done with
    FIPS approved algorithms and continuous monitoring tests in place. Users should
    also ensure that the system has plenty of entropy during the installation process
    by moving the mouse, or if no mouse is available, ensuring that the recommended
    amount of keystrokes is 256 and more. Less than 256 keystrokes may generate a
    non-unique key.


    The described procedure to enable FIPS mode on Red Hat Enterprise Linux systems
    does not affect a FIPS state of Network Security Services (NSS), and this does
    not affect applications using NSS. When required, the user can switch any NSS
    application to FIPS mode using the following command:


    ```

    ~# modutil -fips true -dbir dir

    ```


    where dir is a directory specifying an NSS database for the application. If more
    than one NSS application uses this database, all applications will be switched
    into FIPS mode. The applications have to be restarted for the NSS FIPS mode to
    take effect.


