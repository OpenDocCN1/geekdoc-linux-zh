  md: 'When using TCP Wrappers in conjunction with xinetet access controls, it is
    important to understand the relationship between the two access control mechanisms.


    The following is the sequence of events followed by xinetet when a client requests
    a connection:


    +   1. The xinetet daemon checks the TCP Wrappers host rules using libwrap library.
    If a deny rule matches, the connection is dropped. If an allow rule matches the
    client, the connection is passed to xinetet.

    2. The xinetet daemon checks its own access control rules for both the xinetet
    service and the requested service. If a deny rule matches the client, the connection
    is dropped. Otherwise, xinetet starts an instance of the requested service and
    passes control of the connection to them.


    > >Care should be taken when using TCP Wrappers access controls in conjunction
    with xinetet access controls. Misconfiguration can cause undesirable effects.


    # 2.6.4.3. Binding and Redirection Options


    The service configuration files for xinetet support binding the service to an
    IP address and redirect requests for service to another IP address, hostname,
    or port.


    Binding is controlled by the bind option in the service-specific configuration
    files and links the service to one IP address on the system. If this is configured,
    the bind option only allows requests to the correct IP address to access the service.
    You can use this method to bind services to different network interfaces based
    on requirements.


    This is particularly useful for systems with multiple network adapters or multiple
    IP addresses. On such a system, for example, Telnet, can be configured to listen
    only on the interface connected to a private network and not to the interface
    connected to the Internet.


    The redirect option accepts an IP address or hostname followed by a port number.
    It configures the service to redirect these requests to the specified host and
    port number. This feature can be used to point to another port number on the same
    system, redirect the request to a different IP address on the system, shift the
    request to a totally different system and port number, or any combination of these
    options. A user connecting to a certain service on a system may therefore be rerouted
    to another system without disruption.


    The xinetet daemon is able to accomplish this redirection by spawning a process
    that stays alive for the duration of the connection between the requesting client
    machine and the host actually providing the service, transferring data between
    the two systems.


    The advantages of the bind and redirect options are most clearly evident when
    they are used together. By binding a service to a particular IP address on a system
    and redirecting requests for this service to a second machine that only the first
    machine can see, an internal system can be used to provide services for a totally
    different network. Alternatively, these options can be used to limit the exposure
    of a particular service on a multi-homed machine to a known IP address, as well
    as redirect requests for that service to another machine especially configured
    for that purpose.


    For example, consider a system that is used as a firewall with this setting for
    its Telnet service:'
