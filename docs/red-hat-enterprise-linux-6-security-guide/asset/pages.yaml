  md: '4. Add the following lines to the /etc/screenrc configuration file to close
    the screen session after a given period of inactivity:


    ```

    idle 120 quit autodetect off

    ```


    This will set the time limit to 120 seconds. To adjust this limit, change the
    value after the idle directive.

    Alternatively, you can configure the system to only lock the session by using
    the following lines instead:


    ```

    idle 120 lockscreen autodetect off

    ```


    This way, a password will be required to unlock the session.

    The changes take effect the next time a user logs in.


    # 2.1.8.4. Limiting Root Access


    Rather than completely denying access to the root user, the administrator may
    want to allow access only via separate protocols, such as su or sudo. For more
    information on su and sudo, refer to the Red Hat Enterprise Linux 6 Deployment
    Guide and the su(1) and sudo(8) man pages.


    # 2.1.8.5. Account Logging


    In Red Hat Enterprise Linux 6, the pam_faillock PAM module allows administrators
    to lock out accounts after a specified number of failed attempts. Limiting user
    account attempts serves as a security measure that aims to prevent brute force
    attacks targeted to obtain a user''s account password.


    With the pam_faillock module, failed login attempts are stored in a separate file
    for each user in the /var/run/faillock directory.


    > Note

    The order of lines in the failed audit log files is important. Any change in this
    order can lock out user accounts, including the root user when the even_deny_root
    option is used.


    Follow these steps to configure account locking:


    +   1. To lock out any non-root user after three unsuccessful attempts and ten
    minutes, add the following lines to the auth section of the /etc/pam.d/system-auth
    and /etc/pam.d/password-auth files:


    ```

    auth               pam_faillock.so soauth silent audit=3

    unlock_time=600

    auth               sufficient     pam_unix.so nullock try_first_pass

    auth               [default=fail] pam_faillock.so authfail audit=3

    ```


    +   2. Add the following line to the account section of both files specified in
    the previous step:


    ```

    account           required     pam_faillock.so

    ```'
