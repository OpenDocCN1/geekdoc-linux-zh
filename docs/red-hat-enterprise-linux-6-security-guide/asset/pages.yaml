  md: '# 7.7. Searching the Audit Log Files


    The ausearch utility allows you to search Audit log files for specific events.
    By default, ausearch searches the /var/log/audit/audit.log file. You can specify
    a different file using the ausearch options -if file_name command. Supplying multiple
    options in one ausearch command is equivalent to the AND operator.


    Example 7.6. Using ausearch to search Audit log files


    To search the /var/log/audit/audit.log file, use the following command:


    ```

    # ausearch --message USER_LOGIN --success no --interpret

    ```


    To search for all account, group, and role changes, use the following command:


    ```

    # ausearch -m ADD_USER -m DEL_USER -m ADD_GROUP -m USER_CHAUTHTOK -m DEL_GROUP
    -m CHGPR_ID -m ROLE_ASSIGN -m ROLE_REMOVE -i

    ```


    To search for all logged actions performed by a user, using the user''s login
    ID (auid), use the following command:


    ```

    # ausearch -au 500 -i

    ```


    To search for all failed system calls from yesterday up until now, use the following
    command:


    ```

    # ausearch --start yesterday --end now -m SYSCALL -sv no -i

    ```


    For a full listing of all ausearch options, refer to the ausearch(8) man page.


    # 7.8. Creating Audit Reports


    The aureport utility allows you to generate summary and columnar reports on the
    events recorded in Audit log files. By default, audit.log files in the /var/log/audit/
    directory are queried to create the report. You can specify a different file to
    run the report against using the aureport options -if file_name command.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Example 7.7. Using aureport to generate Audit reports


    To generate a report for log events in the past three days excluding today, use
    the following command:


    ```

    # aureport --start 04/08/2013 00:00:00 --end 04/11/2013 00:00:00

    ```


    To generate a report of all executable file events, use the following command:


    ```

    # aureport -x

    ```


    To generate a summary of the executable file report above, use the following command:


    ```

    # aureport -x --summary

    ```


    To generate a summary of failed events for all users, use the following command:


    ```

    # aureport -u --failed --summary

    ```


    To generate a report of all failed login attempts per each system user, use the
    following command:


    ```

    # aureport --login --summary -i

    ```


    To generate a report from an ausearch query that searches all file access events
    for user 500, use the following command:


    ```

    # ausearch --start today --loginuid 500 --raw | aureport --summary

    ```


    To generate a report of all Audit files that are queried and the time range of
    events they include,


    ```

    # aureport -t

    ```


    For a full listing of all aureport options, refer to the aureport(8) man page.


    # 7.9. Additional Resources


    For more information about the Audit system, refer to the following sources.


    # Online Sources


    +   * The Linux Audit system project: http://people.redhat.com/sgrubb/audit/


    +   * Article Investigating kernel Return Codes with the Linux Audit System in
    the Hack In the Box magazine: http://magazine.hackinthebox.org/issues/HIT-B-Ezine-Issue-005.pdf.


    # Installed Documentation


    Documentation provided by the audit package can be found in the /usr/share/doc/audit-version/
    directory.'
