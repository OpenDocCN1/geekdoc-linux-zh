    # 2.8.5.1. Postrouting and IP Masquerading


    Accepting forwarded packets via the firewall''s internal IP device allows LAN
    nodes to communicate with each other; they still cannot communicate externally
    to the Internet.


    To allow nodes with private IP addresses to communicate with external public networks,
    configure the firewall for IP masquerading, which masks requests from LAN nodes
    with the IP address of the firewall''s external device (in this case, eth0):


    ```

    # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    This rule matches nat (-t nat) and specifies the built-in POSTROUTING chain for
    NAT (-A POSTROUTING) on the firewall''s external networking device (-o eth0).


    POSTROUTING allows packets to be altered as they are leaving the firewall''s external
    device.


    The -j MASQUERADE target is specified to mask the private IP address of a node
    with the external IP address of the firewall/gateway.


    # 2.8.5.2. Prerouting


    If you have a server on your internal network that you want make available externally,
    you can use the -j DNAT target of the PREROUTING chain in NAT to specify a destination
    IP address and port where incoming packets requesting a connection to your internal
    service can be forwarded.'
