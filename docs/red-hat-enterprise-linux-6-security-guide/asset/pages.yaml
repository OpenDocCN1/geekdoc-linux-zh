    # Table 2.4. Disabling Root SSH Logins


    | Effects | Does Not Affect |

    | --- | --- |

    | Prevents root access via the OpenSSH suite of tools. The following programs
    are prevented from accessing the root account: | Programs that are not part of
    the OpenSSH suite of tools. |


    +   - ssh

    - scp

    - sftp


    **Using PAM to limit root access to services**\PAM, through the `/lib/security/pam_listfile.so`
    module, allows great flexibility in denying requests. The administrator can use
    this module to reference a list of users who are not allowed to log in. To limit
    access to a system service, edit the file for the target service in `/etc/pam.d/`
    directory and make sure the `pam_listfile.so` module is required for authentication.


    The following is an example of how the module is used for the `vsftpd` FTP server
    in the `/etc/pam.d/vsftpd` PAM configuration file (the \` character at the end
    of the first line is not necessary if the directive is on a single line):


    ```

    auth required /lib/security/pam_listfile.so item=user \

    sense=deny file=/etc/vsftpd.ftpususers onerr=succeed

    ```


    This instructs PAM to consult the `/etc/vsftpd.ftpususers` file and deny access
    to the service for any listed user. The administrator can change the name of this
    file, and keep separate lists for each service or one central list to access to
    multiple services.


    If the administrator wants to deny access to multiple services, a similar line
    can be added to the PAM configuration files, such as `/etc/pam.d/pop` and `/etc/pam.d/imap`
    for mail clients, or `/etc/pam.d/ssh` for SSH clients.


    For more information about PAM, refer to the chapter *Using Pluggable Authentication
    Modules (PAM)* in the *Managing Sign-On and Smart Cards* guide.'
