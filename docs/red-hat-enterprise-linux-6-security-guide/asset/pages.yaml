- img_proc: true
  md: 'Buffer Overflow Attacks — Services that connect to ports numbered 0 through
    1023 must run as an administrative user. If the application has an exploitable
    buffer overflow, an attacker could gain access to the system as the user running
    the daemon. Because exploitable buffer overflows exist, crackers use automated
    tools to identify vulnerabilities, and once they have found access, they use automated
    rootkits to maintain their access to the system.


    # Note


    The threat of buffer overflow vulnerabilities is mitigated in Red Hat Enterprise
    Linux by ExecShield, an executable memory segmentation and protection technology
    supported by x86-compatible units. ExecShield reduces the risk of buffer overflow
    by separating virtual memory into executable and non-executable segments. Any
    program code that tries to execute outside of the executable segment (such as
    malicious code injected from a buffer overflow) triggers a segmentation fault
    and terminates.

    ExecShield also includes support for No Execute (NX) technology on AMD64 platforms
    and Execute XD technology on Intel® systems. These technologies work in conjunction
    with ExecShield to prevent malicious code from running in the executable portion
    of virtual memory with a granularity of 4KB of executable code, lowering the risk
    of attack from buffer overflows.


    # Important


    To limit exposure to attacks over the network, disable all services that are unused.


    # 2.1.10.2. Identifying and Configuring Services


    To enhance security, most network services installed with Red Hat Enterprise Linux
    are turned off by default. There are, however, some notable exceptions:


    +   - cupsd — The default print server for Red Hat Enterprise Linux

    - lpd — An alternative print server.

    - xinetd — A super server that controls connections to a range of subordinate
    servers, such as gssftp and telnet.

    - sendmail — The SendMail Transport Agent (MTA) is enabled by default, but only
    listens for connections from the localhost.

    - sshd — The OpenSSH server, which is a secure replacement for Telnet.


    When determining whether to leave these services running, it is best to use common
    sense and avoid taking risks. For example, if a printer is not available, do not
    leave cupsd running. The same is true for portmap. If you do not mount NFS3 volumes
    or use NIS (the ypbind service), then portmap should be disabled.'
  merge: -1
