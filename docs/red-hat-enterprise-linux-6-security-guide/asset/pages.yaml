  md: 'Next, enter your name and email address. Remember this process is about authenticating
    you as a real individual. For this, include your real name. Do not use aliases
    or handles, since these disguise obfuscate your identity.


    Enter your real email address for your GPG key. If you choose a bogus email address,
    it will be more difficult for others to find your public key. This makes authenticating
    communications difficult. If you are using your GPG key for self-introduction
    on a mailing list, for example, enter the email address you use on list.


    Use the comment field to include aliases or other information. (Some people use
    keys for different purposes and identify each key with a comment, like "Office"
    or "Open Source Projects.")


    At the confirmation prompt, enter the 0 to continue if all entries are correct,
    or use the other options to fix any problems. Finally, enter a passphrase for
    your secret key. The gpg2 program asks you to enter your passphrase to ensure
    you make no typing errors.


    Finally, gpg2 generates random data to make your key as unique as possible. Move
    your mouse, type random keys, or perform other tasks during this step to speed
    up the process. Once this step is finished, your keys are ready to use:


    ```

    pub 1024D/1B2FA1C 2005-03-31 John Q. Doe <jqdoe@example.com>

    Key fingerprint = 117C B823 2EA B843 3E86 64B6 4320 54E5 1B2A FA1C

    1024/CA4B2EE 2005-03-31 [expires: 2006-03-31]

    ```


    The key fingerprint is a "signature" for your key. It allows you to confirm to
    others that they have received your actual public key without any tampering. You
    do not need to write this fingerprint down. To display the fingerprint at any
    time, use this command, substituting your email address:


    ```

    $ gpg2 --fingerprint jqdoe@example.com

    ```


    Your "GPG key ID" consists of 8 hex digits identifying the public key. In the
    example above, the GPG key ID is 1B2FA1C. In most cases, if you are asked for
    the key ID, you should prepend 0x to the key ID, as in 0x6789ABCD.


