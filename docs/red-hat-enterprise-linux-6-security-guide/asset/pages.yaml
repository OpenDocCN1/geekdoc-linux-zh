    There are several known issues relevant to the version of vlock currently available
    for Red Hat Enterprise Linux 6:


    +   - The program does not allow unlocking consoles using the root password. Additional
    information can be found in BZ#895066.

    - Locking a console does not clear the screen and scrollback buffer, allowing
    anyone with physical access to the workstation to view previously issued commands
    and output displayed in the console. Refer to BZ#807369 for more information.


    # 2.1.10. Available Network Services


    While access to administrative controls is an important issue for system administrators
    within an organization, monitoring which network services are active is of importance
    to anyone who operates and administers a Linux system.


    Many services under Red Hat Enterprise Linux 6 behave as network services. If
    a network service is running on a machine, then a server application (called a
    daemon), is listening for connections on one or more network ports. Each of these
    services should be treated as a potential avenue of attack.


    # 2.1.10.1. Risks To Services


    Network services can pose many risks for Linux systems. Below is a list of some
    the primary issues:


    +   - Denial of Service Attacks (DoS) - By flooding a service with requests, a
    denial of service attack can render a system unusable as it tries to listen and
    answer each.

    - Distributed Denial of Service Attacks (DoS) - A type of attack which uses compromised
    machines (often in the thousands or more) to direct a coordinated attack on a
    service, flooding it with requests and making it unusable.

    - Script Vulnerability Attacks - If a server uses scripts to execute server-side
    attacks, as Web servers commonly, a cracker can attack improperly written scripts.
    These script vulnerability attacks can lead to a buffer overflow condition or
    allow the attacker to alter files on the system.'
