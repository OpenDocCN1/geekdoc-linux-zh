  md: '# Chapter 2. Securing Your Network


    ```

    # iptables -A OUTPUT -o eth0 -p tcp --dport 31337 --sport 31337 -j DROP

    # iptables -A FORWARD -o eth0 -p tcp --dport 31337 --sport 31337 -j DROP

    ```


    You can also block connections that attempt to spoof fake IP addresses to infiltrate
    your LAN.


    For example, if your LAN uses the 192.168.1.0/24 range, you can design a rule
    that instructs the Internet-facing network device (for example, eth0) to drop
    any packets to that device in your IP range.


    It is recommended to redirect packets as a default policy, any other spoofed IP
    address to the external-facing device (eth0) is redirected automatically.


    ```

    # iptables -A FORWARD -s 192.168.1.0/24 -i eth0 -j DROP

    ```


    ![](img/fa49fe194038627f7baabbe849816a0e_119_0.png)


    > There is a distinction between the DROP and REJECT targets when dealing with
    appended rules. The REJECT target denies access and returns a connection refused
    error to users who attempt to connect to the service. The DROP target, as the
    name implies, drops the packet without any warning. Administrators can use their
    own discretion when using these targets.


    # 2.8.7. IPTables and Connection Tracking


    You can inspect and restrict connections to services based on their connection
    state. A module in iptables uses a method called connection tracking to store
    information about incoming connections. You can allow or deny access based on
    the following connection state:


    +   * NEW — A packet requesting a new connection, such as an HTTP request.

    * ESTABLISHED — A packet that is part of an existing connection.

    * RELATED — A packet that is requesting a new connection but is part of an existing
    connection. For example, FTP uses port 21 to establish a connection, but data
    is transferred to a different port (typically port 20).

    * INVALID — A packet that is not part of the packets in the connection tracking
    table.


    You can use the stateful functionality of iptables connection tracking with any
    network protocol, even if the protocol is stateless (such as UDP). The following
    example shows a rule that uses connection tracking to follow the packets that
    are associated with an established connection:


    ```

    # iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    # 2.8.8. IPv6


    The introduction of the next-generation Internet Protocol, called IPv6, expands
    beyond the 32-bit address limit of IPv4 (or IP). IPv6 provides 128-bit addresses,
    and carrier networks that are IPv6 aware are able to address a larger number of
    routable addresses than IPv4.


    Red Hat Enterprise supports ipt6 firewall rules using the Netfilter 6 subsystem
    and in Red Hat Enterprise Linux 6, both IPv4 and IPv6 services are enabled by
    default ipt6 command.


    117'
  merge: -1
