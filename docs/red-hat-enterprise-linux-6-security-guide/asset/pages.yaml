    For example: -p tcp --dport 3000:3200. The largest acceptable valid range is 0:65535.

    Use an exclusion point character (!) after the --dport option to match all packets
    that do not use that service or port.

    To browse the names and aliases of network services and the ports they use, view
    the /etc/services file.

    - --destination-port match option is synonymous with --dport.

    - --sport Sets the source port of the packet using the same options as --dport.
    The --source-port match option is synonymous with --sport.

    - --syn Applies to all TCP packets designed to initiate communication, commonly
    called SYN packets. Any packets that carry a data payload are not touched.

    Use an exclusion point character (!) before the --syn option to match all non-SYN
    packets.

    - --tcp-flags <tested flag list> <set flag list> Allows TCP packets that have
    specific bits (flags) set, to match a rule.

