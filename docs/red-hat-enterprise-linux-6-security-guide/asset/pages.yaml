  md: 'permissions are the permissions that are logged:


    +   - r — read access to a file or a directory.

    - w — write access to a file or a directory.

    - x — execute access to a file or a directory.

    - a — change in the file''s attribute.


    key_name is an optional string that helps you identify which rule or set of rules
    generated a particular log entry.


    # Example 7.1. File System Rules


    To define a rule that logs all access to, and every attribute change of, the /etc/passwd
    file, execute the following command:


    ```

    # auditctl -w /etc/passwd -p -k passwd_changes

    ```


    Note that the -k option is arbitrary.


    To define a rule that logs all access to, every attribute change of, all the files
    in the /etc/selinux/ directory, execute the following command:


    ```

    # auditctl -w /etc/selinux/ -p wa -k selinux_changes

    ```


    To define a rule that logs the execution of the /sbin/insmod command, which inserts
    a module into the Linux kernel, execute the following command:


    ```

    # auditctl -w /sbin/insmod -p x -k module_insertion

    ```


    # Defining System Call Rules


    To define a system call rule, use the following syntax:


    ```

    auditctl -a action,filter -S system_call -F field=value -k key_name

    ```


    where:


    +   - action and filter specify when an event is logged action can be always or
    never. filter which kernel rule-matching filter is applied to the event. The rule-matching
    filter can be one of the following: task, user, and exclude. For more information
    about filters, refer to the beginning of Section 7.1, Audit System Architecture.\n-
    system_call specifies the system call by its name. List of all system calls can
    be found in the /usr/include/asm/unistd_64.h. Several system calls can be grouped
    into one rule, each specified after the -S option.

    - field=value specifies additional options that further modify the rule to match
    events based on a specified architecture, group ID, process ID, and others. For
    a full listing of all available field types and their values, refer to the auditctl(8)
    man page.

    - key_name is an optional string that helps you identify which rule or set of
    rules generated a particular log entry.'
