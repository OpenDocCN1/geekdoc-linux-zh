    # ## 2.7. Private Networks (VPNs)


    Organizations with satellite offices often need to connect with other dedicated
    lines for efficiency and protection of sensitive data. In example, many businesses
    use frame relay or Asynchronous Transfer Mode (ATM) lines as an end-to-end networking
    solution to link one office with others. This can be an expensive position, especially
    for medium sized businesses that want to avoid paying the high costs associated
    with enterprise-level, digital circuits.


    To address this need, Private Networks (VPNs) were developed. Following the same
    functional principles as dedicated circuits, VPNs allow for secure digital communication
    between two parties (or networks), creating a Wide Area Network (WAN) when connecting
    Local Area Networks (LANs). Where it differs from frame relay or ATM is in its
    transport method. VPNs transport over IP using datagrams as the transport layer,
    making a secure conduit through the Internet to intended destination. VPN implementations
    in hardware and software utilize the IETF IPsec standards for establishing and
