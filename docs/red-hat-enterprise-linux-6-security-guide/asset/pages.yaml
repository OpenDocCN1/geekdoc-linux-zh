    # A.2.3. DSA


    DSA (Digital Signature Algorithm) is a standard for digital signatures, a United
    States government standard for digital signatures. DSA is for signatures and is
    not an encryption algorithm. [23]


    # A.2.4. SSL/TLS


    Transport Layer Security (TLS) and its predecessor, Secure Sockets Layer (SSL),
    are cryptographic protocols that provide security for communications over networks
    as the Internet. TLS and SSL encrypt the segments of network connections at the
    Transport Layer end-to-end.


    Several versions of the protocols are widespread in applications like web browsing,
    electronic mail, Internet faxing, instant messaging and voice-over-IP (VoIP).
    [24]


    # A.2.5. Cramer-Shoup Cryptosystem


    The Cramer-Shoup system is an asymmetric encryption algorithm, and was the first
    efficient scheme to protect against adaptive chosen ciphertext attack using standard
    cryptographic assumptions. Its security is based on the computational difficulty
    (widely assumed, not proved) of the decisional Diffie-Hellman agreement. Developed
    by Ronald Cramer and Victor Shoup in 1998, it is an extension of the Elgamal cryptosystem.
    In contrast to Elgamal, which is extremely malleable, Cramer-Shoup adds additional
    elements to ensure non-malleability against a resistant attacker. This non-malleability
    is achieved through the use of a collision-resistant hash function and additional
    computations, in a ciphertext which is as large as Elgamal. [25]


    # A.2.6. ElGamal Encryption


    In cryptography the Elgamal encryption is an asymmetric encryption algorithm for
    public-key cryptography which is based on the Diffie-Hellman agreement. It was
    described by Taher ElGamal in 1985. Elgamal encryption is used in the GNU Privacy
    Guard software, recent versions of PGP, and other cryptosystems. [26]


