- img_proc: true
  md: "# Important\n\nAs noted, the order of rules in a chain determines which rules\
    \ apply to packets. This is important to remember when adding rules using the\
    \ -A or -I option. This is especially important when adding rules using the -I\
    \ with an integer argument. If you specify an unique number when adding a rule\
    \ to a chain, iptables adds the new rule before (or above) the existing rule.\n\
    \n+   - **L** — Lists all the rules in the chain specified after the command.\
    \ To list all chains in the default filter table, do not specify a chain or table.\
    \ Otherwise, the following syntax should be used to list the rules in a specific\
    \ chain in a particular:\n```bash\\iptables -L <chain-name> -t <table-name>\n\
    ```\n\nAdditional options for the -L command option, provide rule numbers and\
    \ allow more verbose rules descriptions, are described in Section 2.8.9.2.6, \"\
    Listing Options\".\n\n+   - **N** — Creates a new chain with a user-specified\
    \ name. The chain name must be unique, otherwise an error message is displayed.\n\
    - **P** — Sets the default policy for the specified chain, so when packets traverse\
    \ an entire chain without matching a rule, they are sent to the specified target,\
    \ as ACCEPT or DROP.\n- **R** — Replaces a rule in the specified chain. The rule's\
    \ number must be specified after the chain's name, first require various parameters\
    \ to construct a packet filtering rule.\n- **X** — Deletes a user-specified chain.\
    \ You cannot delete a built-in chain.\n- **Z** — Sets the byte and packet counters\
    \ in all chains for a table to zero.\n\n# 2.8.9.2.3. IPTables Parameter Options\n\
    \nCertain iptables commands, including those used to add, append, delete, insert,\
    \ or replace rules within a particular chain, require various parameters to construct\
    \ a packet filtering rule.\n\n+   - **c** — Resets the counters for a particular\
    \ rule. This parameter accepts the PKTS and BYTES options to specify which counter\
    \ to reset.\n- **d** — Sets the destination hostname, IP address, or network of\
    \ a packet that matches the rule. Matching a network, the following IP address/network\
    \ formats are supported:\n  * N.N.N.N.M.M.M — The IP address range and M.M.M is\
    \ the masknet.\n  * N.N.N.N.M.M.M — Where N.N.N.N is the address range and M.M.M\
    \ is the bitmask.\n- **f** — Applies this rule only to fragmented packets.\n\n\
    You can use the exclamation point (!) option before this parameter to specify\
    \ that only unfragmented packets are matched.\n\n# Note\n\nDistinguishing between\
    \ fragmented and fragmented packets is desirable, despite fragmented packets.\
    \ Originally designed to allow IP packets to travel over networks with differing\
    \ frame sizes, these days fragmentation is more commonly used to generate DoS\
    \ attacks with malformed packets. It's worth noting that IPv6 disallows fragmentation\
    \ entirely."
