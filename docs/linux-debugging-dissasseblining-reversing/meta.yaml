    # Multiplying Numbers Using Pointers


    Our next pseudo-code statement does multiplication:


    ```

    `(rbx) * (rax) -> (rbx)`

    ```


    This statement means that we multiply the contents of the memory cell whose address
    is stored in the `%RBX` register by the value stored in the memory cell whose
    address is in the `%RAX` register. In C or C++ language, we write a similar expression
    as the addition statement we have seen in the previous sections (note that we
    have two distinct meanings of `*` operator: pointer dereference and multiplication):


    ```

    *pb = *pb * *pa;

    *pb *= *pa;

    ```


    The latter is a shorthand notation. In assembly language, we use instruction IMUL
    (Integer MULtipli):


    ```

    mov (%rax), %eax

    imul (%rbx), %eax

    mov %eax, (%rbx)

    ```


    Since `imul` instruction cannot reference two memory locations we need to put
    the contents of one location into a register. We reuse `%RAX` since we do not
    need its current value after that. This instruction is equivalent to the following
    pseudo-code:


    ```

    (rax) -> rax

    (rbx) * rax -> rax

    rax -> (rbx)

    ```


    In GDB disassembly output we see this:


    ```

    0x000000000000401022 <+34>: mov (%rax),%eax

    0x000000000000401024 <+36>: imul (%rbx),%eax

    0x000000000000401027 <+39>: mov %eax, (%rbx)

    ```'
  - '[PAGE 57]


    We add instructions to our pseudo-code table:


    | pseudo-code | assembly |

    | :--- | :--- |

    | address a -> rax | lea a, %rax |

    | 1 -> (rax) ; (a) = 1 | movl $1, (%rax) |

    | address b -> rbx | lea b, %rbx |

    | 1 -> (rbx) ; (b) = 1 | movl $1, (%rbx) |

    | (rbx) + (rax) -> (rbx) ; %edx = 1 | mov (%rax), %edx |

    | ; (b) = 2 | add %edx, (%rbx) |

    | (rax) + 1 -> (rax) ; (a) = 2 | incl (%rax) |

    | (rbx) * (rax) -> (rbx) ; %eax = 2 | mov (%rax), %eax |

    | ; %eax = 4 | imul (%rbx), %eax |

    | ; (b) = 4 | mov %eax, (%rbx) |


