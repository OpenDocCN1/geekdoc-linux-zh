  md: '# LEA (Load Effective Address)


    The following instruction


    ```

    ```assembly

    lea -0x8(%rbp),%rdx

    ```

    ```


    is equivalent to the following arithmetic sequence:


    ```

    ```assembly

    mov %rbp, %rdx

    add -0x8, %rdx

    ```

    ```


    The following instruction


    ```

    ```assembly

    lea 0xea9(%rip),%rdi

    ```

    ```


    is equivalent to the following arithmetic sequence:


    ```

    ```assembly

    mov %rip, %rdi

    add 0xea9, %rdx

    ```

    ```'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# # Passing Parameters


    **The first 6 function parameters from left to right**


    ```

    %RDI, %RSI, %RDX, %RCX, %R8, and %R9

    ```


    > Note: although we haven''t seen examples for more than 6 function parameters,
    they are passed via the stack, for example, via PUSH instruction.


    **Static/global variable address (or string constant)**


    ```

    ```assembly

    mov $0x555555556004, reg


    lea 0xe9d(%rip), reg

    ```

    ```


    **Local variable value vs. local variable address**


    ```

    ```assembly

    mov -XXX(%rbp), reg ; local variable value

    call func


    lea -XXX(%rbp), reg ; local variable address

    call func

    ```

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Accessing Parameters and Local Variables


    # Local variable value


    ```

    mov -XXX(%rbp), reg

    mov XXX(%rsp), reg # optimized code

    ```


    # Local variable address


    ```

    lea -XXX(%rbp), reg

    lea XXX(%rsp), reg # optimized code

    ```


    # Accessing a doubleword value


    ```

    mov -0x8(%rbp), %eax

    add $1, %eax

    addl $1, %rax

    ```


    # Accessing a quadword value


    ```

    mov -0x8(%rbp), %rax

    add $1, %rax

    ```


    # Accessing and dereferencing a pointer to a doubleword value


    ```

    mov -0x10(%rbp), %rax

    mov (%rax), %eax

    add $1, %eax

    ```


    # Accessing and dereferencing a pointer to a quadword value


    ```

    mov -0x10(%rbp), %rax

    mov (%rax), %rax

    add $1, %rax

    ```'
