  - '[PAGE 115]


    # Application Memory Simplified


    When an executable file is loaded into memory, its header and sections are mapped
    to memory pages. Some data and code are copied unmodified, but some data is initialized
    and expanded. The first stack is also created at this stage. %RIP register is
    set to point to the first program instruction, and %RSP points to the top of the
    stack. This simplified process is shown in Picture x64.9.4.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_115_0.png)


    Picture x64.9.4'
  - "[PAGE 116]\n\n# Stack Overflow\n\nBy default, the stack size is limited (system\
    \ and limits dependent, and on our system, it is 8192Kb or 8388608 bytes). If\
    \ a stack grows beyond the reserved limit, a stack overflow occurs (segmentation\
    \ fault). It can be caused by an unlimited recursion, deep recursion, or very\
    \ large local variables:\n\n```\n```c\nint func()\n{\n    func();\n    return\
    \ 0;\n}\n\nint func2()\n{\n    int array[10000000] = { 1 };\n    printf(\"%d\"\
    , array[10000000-1]);\n}\n```\n```"
  - '[PAGE 117]


    # Jumps


    Another instruction we need to know and understand before we look deeper into
    C/C++ functions is called JMP (Jump). Picture x64.9.5 shows instructions in memory
    and corresponding values of %RIP register.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_117_0.png)


    Picture x64.9.5


    We see that JMP instruction changes %RIP to point to another memory address, and
    the program execution continues from that location. The code shown in Picture
    x64.9.5 loops indefinitely: this can be considered a hang and CPU spike.'
  - '[PAGE 118]


    Here is a pseudo-code for absolute JMP instructions adopted from Intel manuals
    and some examples:


    ```

    ; Format and arguments:


    JMP r/mem64


    ; Pseudo-code:


    DEST -> RIP ; new destination address for execution


    ; Examples:


    JMP 0x5555555558020


    JMP *%RAX

    ```


    The jump is called absolute because we specify full memory addresses and not a
    relative +/- number to the current %RIP value. The latter jump is called relative.
    *%RAX means an indirect jump to the address located in the %RAX register. It is
    illustrated in Picture x64.9.6.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_118_0.png)


    # Picture x64.9.6'
  - '[PAGE 119]


    # Calls


    We discuss two essential instructions that make the implementation of C and C++
    function calls. They are called CALL and RET. Picture x64.9.7 shows instructions
    in memory and corresponding values of %RIP and %RSP registers.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_119_0.png)


    Picture x64.9.7


    We see that CALL instruction pushes the current value of %RIP to the stack and
    changes %RIP to point to another memory address. Then the program execution continues
    from the new location. RET instruction pops the saved %RIP value from the stack
    to the %RIP register. Then the program execution resumes at the memory location
    after the CALL instruction.'
  - '[PAGE 120]


    Here is a pseudo-code for CALL instructions and some examples adopted from Intel
    manuals:


    ```

    ; Format and arguments:


    CALL r/mem64


    ; Pseudo-code:


    PUSH RIP


    DEST -> RIP


    ; Examples:


    CALL 0x555555558020


    CALL *%RAX

    ```


    Here is a pseudo-code for RET instruction adopted from Intel manuals:


    ```

    ; Format:


    RET


    ; Pseudo-code:


    POP() -> RIP

    ```'
  - "[PAGE 121]\n\n# Call Stack\n\nIf one function (the caller) calls another function\
    \ (the callee) in C and C++, the resulting code is implemented using CALL instruction,\
    \ and during its execution, the return address is saved on the stack. If the callee\
    \ calls another function, the return address is also saved on the stack, and so\
    \ on. Therefore, we have the so-called call stack of return addresses. Let us\
    \ see this with a simple but a trimmed-down example.\n\nSuppose we have 3 functions\
    \ with their code occupying the following addresses:\n\n```\n```\nfunc  0000001400010000\
    \ - 000000140001100\nfunc2 0000001400011101 - 000000140001200\nfunc3 000000140001201\
    \ - 000000140001300\n```\n```\n\nWe also have the following code where *func*\
    \ calls *func2*, and *func2* calls *func3*:\n\n```\n```cpp\nvoid func()\n{\n \
    \   func2();\n}\nvoid func2()\n{\n    func3();\n}\n```\n```\n\nWhen *func* calls\
    \ *func2*, the caller's return address is pushed to the stack, and %RSP points\
    \ to some value in the 0000001400010000 - 000000140001100 range, say 000000140001020.\
    \ When *func2* calls *func3*, the caller's return address is also pushed to the\
    \ stack, and %RSP points to some value in 0000001400011101 - 000000140001200 range,\
    \ say 000000140001180. If we interrupt *func3* with a debugger and inspect %RIP,\
    \ we would find its value in the range of 000000140001201 - 000000140001300, say\
    \ 000000140001250. Therefore, we have the following memory and register layout\
    \ shown in Picture x64.9.8 (the usual function prolog is not shown: we learn about\
    \ it in the next chapter)."
