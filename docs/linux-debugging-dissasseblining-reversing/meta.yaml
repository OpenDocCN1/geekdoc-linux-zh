    ## Reconstructing C/C++ Code: Part 1


    Now we go from instruction to instruction highlighted in bold on the previous
    page and try to reconstruct pseudo-code which is shown as comments to assembly
    language code.


    ```

    lea 0x2ef9(%rip),%rax # 0x555555558030 <a>

    # address a -> rax

    mov %rax,0x2efa(%rip) # 0x555555558038 <pa>

    # rax -> (pa)

    lea 0x2eef(%rip),%rax # 0x555555558034 <b>

    # address b -> rax

    mov %rax,0x2ef4(%rip) # 0x555555558040 <pb>

    # rax -> (pb)

    mov 0x2ee5(%rip),%rax # 0x555555558038 <pa>

    # (pa) -> rax

    movl $0x1,(%rax)

    # 1 -> (rax)

    mov 0x2ee0(%rip),%rax # 0x555555558040 <pb>

    # (pb) -> rax

    movl $0x1,(%rax)

    # 1 -> (rax)

    mov 0x2ed3(%rip),%rax # 0x555555558040 <pb>

    # (pb) -> rax

    mov (%rax),%ecx

    # (rax) -> ecx

    mov 0x2ec2(%rip),%rax # 0x555555558038 <pa>

    # (pa) -> rax

    mov (%rax),%edx

    # (rax) -> edx

    mov 0x2ec1(%rip),%rax # 0x555555558040 <pb>

    # (pb) -> rax

    add %ecx,%edx

    # ecx + edx -> edx

    mov %edx,(%rax)

    # edx -> (rax)

    mov 0x2eae(%rip),%rax # 0x555555558038 <pa>

    # (pa) -> rax

    mov (%rax),%edx

    # (rax) -> edx

    add $0x1,%edx

    # 1 + edx -> edx

    mov %edx,(%rax)

    # edx -> (rax)

    mov 0x2ea8(%rip),%rax # 0x555555558040 <pb>

    # (pb) -> rax

    mov (%rax),%ecx

    # (rax) -> ecx

    mov 0x2e97(%rip),%rax # 0x555555558038 <pa>

    # (pa) -> rax

    mov (%rax),%edx

    # (rax) -> edx

    mov 0x2e96(%rip),%rax # 0x555555558040 <pb>

    # (pb) -> rax

    imul %ecx,%edx

    # ecx * edx -> edx

    mov %edx,(%rax)

    # edx -> (rax)

    ```


    ## Reconstructing C/C++ Code: Part 2


    Now we group pseudo-code together with possible mixed C/C++ and assembly language
    equivalents:


    ```

    address a -> rax    ; int a; int *pa;

    rax -> (pa)         ; pa = &a;


    address b -> rax    ; int b; int *pb;

    rax -> (pb)         ; pb = &b;


    (pa) -> rax         ; *pa = 1;

    1 -> (rax)


    (pb) -> rax         ; *pb = 1;

    1 -> (rax)


    (pb) -> rax         ; ecx = *pb;

    (rax) -> ecx


    (pa) -> rax         ; edx = *pa;

    (rax) -> edx


    (pb) -> rax

    ecx + edx -> edx     ; edx = ecx + edx;

    edx -> (rax)        ; *pb = edx;


    (pa) -> rax         ; edx = *pa;

    (rax) -> edx


    1 + edx -> edx      ; edx = 1 + edx;

    edx -> (rax)        ; *pa = edx;


    (pb) -> rax         ; ecx = *pb;

    (rax) -> ecx


    (pa) -> rax         ; edx = *pa;

    (rax) -> edx


    (pb) -> rax

    ecx * edx -> edx     ; edx = ecx * edx;

    edx -> (rax)        ; *pb = edx;

    ```


    ## Reconstructing C/C++ Code: Part 3


    Next we combine more mixed statements into C/C++ language code:


    ```

    int a; int *pa;

    pa = &a;


    int b; int *pb;

    pb = &b;


    *pa = 1;

    *pb = 1;


    ecx = *pb;    ; *pb = *pb + *pa;

    edx = *pa;

    edx = ecx + edx;

    *pb = edx;


    edx = *pa;    ; *pa = 1 + *pa;

    edx = 1 + edx;

    *pa = edx;


    ecx = *pb;    ; *pb = *pb * *pa;

    edx = *pa;

    edx = ecx * edx;

    *pb = edx;

    ```


    ## Reconstructing C/C++ Code: C/C++ program


    Finally, we have something that looks like a complete C/C++ code:


    ```cpp

    int a, b;

    int *pa, *pb;


    pa = &a;

    pb = &b;


    *pa = 1;

    *pb = 1;


    *pb = *pb + *pa;


    ++*pa;


    *pb = *pb * *pa;

    ```


    If we look at the project source code PointersAsVariables.cpp, we see the same
    code compiled into the executable file that we were disassembling.


    ## Example of Disassembly Output: Optimized Program


    The optimized program (compiled with -O2) contains few CPU instructions:


    ```

    (gdb) dissas main

    Dump of assembler code for function main:


    => 0x0000555555555040 <+0>:  lea 0x2ffd(%rip),%rax    # 0x555555558044 <a>

    0x0000555555555047 <+7>:   movl $0x2,0x2ff3(%rip)    # 0x555555558044 <a>

    0x0000555555555051 <+17>:  mov %rax,0x2fe0(%rip)     # 0x555555558038 <pa>

    0x0000555555555058 <+24>:  lea 0x2fe1(%rip),%rax     # 0x555555558040 <b>

    0x000055555555505f <+31>:  mov %rax,0x2fca(%rip)     # 0x555555558030 <pb>

    0x0000555555555066 <+38>:  xor %eax,%eax

    0x0000555555555068 <+40>:  movl $0x4,0x2fce(%rip)    # 0x555555558040 <b>

    0x0000555555555072 <+50>:  retq

    End of assembler dump.

    ```


    We see that the compiler was able to figure out the result of computation: a =
    2; b = 4; However, one question remains, why did the compiler not optimize away
    the first instructions initializing pa and pb variables? The answer lies in the
    nature of a separate compilation model in C and C++. We can compile several compilation
    units (.c or .cpp) files separately and independently. Therefore, there is no
    guarantee that another compilation unit would not reference our globally declared
    and defined pa and pb variables.


    We can also see that the compiler reordered instructions. It can be seen in pseudo-code:


    ```

    address a -> rax

    1 -> (a)

    rax -> (pa)

    ```


    This is because pa initialization with the address of the variable a is independent
    of assigning 1 to the memory cell the variable a points to, and the reordered
    sequence of instructions could be executed faster on modern processors.


    ## Chapter x64.9: Memory and Stacks


    ### Stack: A Definition


    A stack is a simple computational device with two operations, push and pop, that
    allows us to pile up data to remember it in LIFO (Last In First Out) manner and
    quickly retrieve the last piled data item as shown in Picture x64.9.1.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_107_0.png)

    Picture x64.9.1


    ### Stack Implementation in Memory


    CPU `%RSP` register (Stack Pointer) points to the top of a stack. As shown in
    Picture x64.9.2, a stack grows towards lower memory addresses with every push
    instruction, and this is implemented as `%RSP` register decrement by 8. We can
    read the top stack value using the following instruction:


    ```

    mov (%rsp), %rax

    ```


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_108_0.png)

    Picture x64.9.2


    The opposite POP instruction increments the value of the %RSP register, as shown
    in Picture x64.9.3.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_109_0.png)

    Picture x64.9.3


    ### Things to Remember


    Here is the summary of what we have learned about stacks with the last 3 points
    covered in the subsequent chapters of this book:


    - Stack operations are LIFO – Last In First Out

    - The stack grows down in memory

    - %RSP register points to the top of a stack

    - Stacks are used for storing return address for CALL instructions

    - Stacks are used for passing additional parameters to functions

    - Stacks are used for storing function parameter values, local and temporary variables

    ```'
