    # Addressing Array Elements


    We can also consider stack memory as an array of memory cells, and often %RBP
    register is used to address stack memory elements in the way shown in Picture
    x64.10.1 where it slides into the frame of stack memory called a stack frame.
    The first diagram depicts 64-bit (quadword) memory cells, and the second depicts
    32-bit (doubleword) memory cells.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_129_0.png)'
