- md: "## TEST - Logical Compare\n\nThis instruction computes bit-wise logical AND\
    \ between both operands and sets flags (including ZF) according to the computed\
    \ result (which is discarded):\n\n```\nTEST reg/imm, reg/mem\n```\n\nExamples:\n\
    \n```\nTEST %EDX, %EDX\n```\n\nSuppose %EDX register contains 4 ($100_{bin}$)\n\
    \n```\n100_{bin} AND 100_{bin} = 100_{bin}  != 0 (ZF is cleared)\n```\n\n```\n\
    TEST $1, %EDX\n```\n\nSuppose %EDX contains 0 ($0_{bin}$)\n\n```\n0_{bin} AND\
    \ 1_{bin} = 0_{bin}  == 0 (ZF is set)\n```\n\nHere is TEST instruction in pseudo-code\
    \ (details not relevant to ZF bit are omitted):\n\n```\nTEMP := OPERAND1 AND OPERAND2\n\
    IF TEMP = 0 THEN\n    1 -> ZF\nELSE\n    0 -> ZF\n```\n\n## CMP – Compare Two\
    \ Operands\n\nThis instruction compares the first operand with the second and\
    \ sets flags (including ZF) according to the computed result (which is discarded).\
    \ The comparison is performed by subtracting the first operand from the second\
    \ (like SUB instruction: sub $4, %eax).\n\n```\nCMP reg/imm, reg/mem\nCMP reg/mem/imm,\
    \ reg\n```\n\nExamples:\n\n```\nCMP $0, %EDI\n```\n\nSuppose %EDI contains 0\n\
    \n0 - 0 == 0 (ZF is set)\n\n```\nCMP $0x16, %EAX\n```\n\nSuppose %EAX contains\
    \ 4hex\n\n4hex - 16hex = FFFFFFEEhex != 0 (ZF is cleared)\n4dec - 22dec = -18dec\n\
    \nHere is CMP instruction in pseudo-code (details not relevant to ZF bit are omitted):\n\
    \n```\nOPERAND2 - OPERAND1 -> TEMP\nIF TEMP = 0 THEN\n    1 -> ZF\nELSE\n    0\
    \ -> ZF\n```\n\nCMP instruction is equivalent to this pseudo-code sequence:\n\n\
    ```\nOPERAND2 -> TEMP\nSUB OPERAND1, TEMP\n```\n\n## TEST or CMP?\n\nBoth instructions\
    \ are equivalent if we want to test for zero, but CMP instruction affects more\
    \ flags than TEST:\n\n```\nTEST %EAX, %EAX\nCMP $0, %EAX\n```\n\nCMP instruction\
    \ is used to compare for inequality (TEST instruction cannot be used here):\n\n\
    ```\nCMP $0, %EAX  # > 0 or < 0 ?\n```\n\nTEST instruction is used to see if individual\
    \ bits are set:\n\n```\nTEST $2, %EAX  # 2 == 0010bin or in C language: if (var\
    \ & 0x2)\n```\n\nExamples where %EAX has the value of 2:\n\n```\nTEST $2, %EAX\
    \  # 0010bin AND 0100bin = 0000bin (ZF is set)\nTEST $6, %EAX  # 0010bin AND 0110bin\
    \ = 0010bin (ZF is cleared)\n```\n\n## Conditional Jumps\n\nConsider these two\
    \ C or C++ code fragments:\n\nCPU fetches instructions sequentially, so we must\
    \ tell the CPU that we want to skip some instructions if some condition is (not)\
    \ met, for example, if a != 0.\n\nJNZ (jump if not zero) and JZ (jump if zero)\
    \ test the ZF flag and change %RIP if the ZF bit is cleared for JNZ or set for\
    \ JZ. The following assembly language code is equivalent to C/C++ code above:\n\
    \n```asm\nCMP  $0, A          MOV  A, %EAX\nJNZ  label1         TEST %EAX, %EAX\n\
    INC  A              JZ   label1\nJMP  label2         INC  %EAX\nlabel1: DEC  A\
    \      JMP  label2\nlabel2:             label1: DEC  %EAX\n                  \
    \   label2:\n```\n\n## The Structure of Registers\n\nSome 64-bit registers have\
    \ a legacy structure that allows us to address their lower 32-bit, 16-bit, and\
    \ two 8-bit parts, as shown in Picture x64.12.4.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_157_0.png)\n\
    \nPicture x64.12.4\n\n## Function Return Value\n\nMany functions return values\
    \ via %RAX register. For example:\n\n```cpp\nlong func();\n```\n\nReturn value\
    \ is in %RAX.\n\n```cpp\nbool func();\n```\n\nThe return value is in %EAX.\n\n\
    Although bool values occupy one byte in memory, the compiler may use %EAX instead\
    \ of %AL.\n\n## Using Byte Registers\n\nSuppose we have a byte value in the %AL\
    \ register, and we want to add this value to the %ECX register. However, we do\
    \ not know what values other parts of the full %EAX register contain. We cannot\
    \ use this instruction, for example:\n\n```\nMOV %AL, %EBX # operand size conflict\n\
    ```\n\nThe proposed solution in pseudo-code:\n\n```\nAL -> EBX or AL -> EAX\n\
    ECX + EBX -> ECX ECX + EAX -> ECX\n```\n\nWe can only use MOV instructions that\
    \ have the same operand size for both source and destination, for example:\n\n\
    ```\nMOV %AL, %BL\nMOV %AL, b # in C: static bool b = func()\n```\n\nFor this\
    \ task, there is a special MOVZX (Move with Zero eXtend) instruction that replaces\
    \ the contents of the second operand with the contents of the first operand while\
    \ filling the rest of bits with zeros:\n\n```\nMOVZX reg/mem, reg\n```\n\nTherefore,\
    \ our solution for the task becomes very simple:\n\n```\nMOVZX %AL, %EBX\nADD\
    \ %EBX, %ECX\n```\n\nWe can also reuse the %EAX register:\n\n```\nMOVZX %AL, %EAX\n\
    ADD %EAX, %ECX\n```\n\n## Chapter x64.13: Function Pointer Parameters\n\n### “FunctionPointerParameters”\
    \ Project\n\nIt is our final project, and it can be downloaded from:\n\nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter13/\n\
    \nA summary of the project source code:\n\n```cpp\n// FunctionParameters.cpp\n\
    int main(int argc, char* argv[])\n{\n    int a, b;\n\n    printf(\"Enter a and\
    \ b: \");\n    scanf(\"%d %d\", &a, &b);\n\n    if (arithmetic (a, &b))\n    {\n\
    \        printf(\"Result = %d\", b);\n    }\n\n    return 0;\n}\n```\n\n```cpp\n\
    // Arithmetic.cpp\nbool arithmetic (int a, int *b)\n{\n    if (!b)\n    {\n  \
    \      return false;\n    }\n\n    *b = *b + a;\n    ++a;\n    *b = *b * a;\n\n\
    \    return true;\n}\n```\n\n### Commented Disassembly\n\nHere is the commented\
    \ disassembly we get after compiling the project and loading into GDB:\n\n```bash\n\
    coredump@DESKTOP-1S6V2L8:~/pflddr/x64/Chapter13$ gcc FunctionParameters.cpp Arithmetic.cpp\
