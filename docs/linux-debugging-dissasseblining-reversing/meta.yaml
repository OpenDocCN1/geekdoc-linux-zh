  - "[PAGE 147]\n\n# Parameter Mismatch Problem\n\nTo illustrate the importance of\
    \ understanding stack memory layout consider this typical binary interface mismatch\
    \ problem. Function `main` calls `func` with two parameters:\n\n```\n```c\n//\
    \ main.c\nint main ()\n{\n    long locVar;\n    func (1, 2);\n    return 0;\n\
    }\n```\n```\n\nThe caller is expected the callee function `func` to see this stack\
    \ memory layout and passes 1 in `%RDI` and 2 in `%RSI` :\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_0.png)\n\
    \nHowever, the callee expects 3 parameters instead of 2:\n\n```\n```c\n// func.c\n\
    int func (int a, int b, int c)\n{\n    // code to use parameters\n    return 0;\n\
    }\n```\n```\n\n`func` code sees this stack memory layout:\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_1.png)\n\
    \nWe see that the parameter `c` on the raw stack gets its value from some random\
    \ value in `%RDX` that was never set by the caller. It is clearly a software defect\
    \ (bug)."
