    - Project Disassembled Code with Comments\n- Parameter Mismatch Problem\n\n##\
    \ Chapter x64.12: More Instructions\n\n- CPU Flags Register\n- The Fast Way to\
    \ Fill Memory\n- Testing for 0\n- TEST - Logical Compare\n- CMP – Compare Two\
    \ Operands\n- TEST or CMP?\n- Conditional Jumps\n- The Structure of Registers\n\
    - Function Return Value\n- Using Byte Registers\n\n## Chapter x64.13: Function\
    \ Pointer Parameters\n\n- “FunctionPointerParameters” Project\n- Commented Disassembly\n\
    \n## Chapter x64.14: Summary of Code Disassembly Patterns\n\n- Function Prolog\
    \ / Epilog\n- LEA (Load Effective Address)\n- Passing Parameters\n- Accessing\
    \ Parameters and Local Variables\n\n## Preface\n\nThis training course is a Linux\
    \ version of the previous \"Practical Foundations of Windows Debugging, Disassembly,\
    \ Reversing\" (ISBN-13: 978-1908043984) book¹. It also complements \"Accelerated\
    \ Linux Core Dump Analysis\" (ISBN-13: 978-1908043979) training course².\n\nAlthough\
    \ the book skeleton is the same as its Windows predecessor, the content was revised\
    \ entirely because of a different operating system, debugger (GDB), toolchain\
    \ (GCC, assembler, linker), application binary interface, and even an assembly\
    \ language flavor, AT&T.\n\nThe course is useful for:\n\n- Software technical\
    \ support and escalation engineers\n- Software engineers coming from JVM background\n\
    - Software testers\n- Engineers coming from non-Linux environments, for example,\
    \ Windows or Mac OS X\n- Linux C/C++ software engineers without assembly language\
    \ background\n- Security researchers without assembly language background\n- Beginners\
    \ learning Linux software reverse engineering techniques\n\nThis book can also\
    \ be used as an x64 assembly language and Linux debugging supplement for relevant\
    \ undergraduate level courses.\n\nIf you encounter any error, please contact us\
    \ using this form:\nhttps://www.patterndiagnostics.com/contact\n\nLinkedin page:\n\
    https://www.linkedin.com/company/software-diagnostics-services\n\nFacebook page:\n\
    https://www.facebook.com/SoftwareDiagnosticsServices\n\nTwitter:\nhttps://twitter.com/DumpAnalysis\n\
    \n¹ https://www.patterndiagnostics.com/practical-foundations-windows-debugging-disassembling-reversing\n\
    ² https://www.patterndiagnostics.com/accelerated-linux-core-dump-analysis-book\n\
    \n## About the Author\n\nDmitry Vostokov is an internationally recognized expert,\
    \ speaker, educator, scientist, and author. He is the founder of the pattern-oriented\
    \ software diagnostics, forensics, and prognostics discipline and Software Diagnostics\
    \ Institute (DA+TA: DumpAnalysis.org + TraceAnalysis.org). \n\nVostokov has also\
    \ authored more than 50 books on software diagnostics, anomaly detection and analysis,\
    \ software and memory forensics, root cause analysis and problem solving, memory\
    \ dump analysis, debugging, software trace and log analysis, reverse engineering,\
    \ and malware analysis. He has more than 25 years of experience in software architecture,\
    \ design, development, and maintenance in various industries, including leadership,\
    \ technical, and people management roles. \n\nDmitry also founded Syndromatics,\
    \ Analogio, BriteTrace, DiaThings, Logtellect, OpenTask Iterative and Incremental\
    \ Publishing (OpenTask.com), Software Diagnostics Technology and Services (former\
    \ Memory Dump Analysis Services) PatternDiagnostics.com, and Software Prognostics.\
    \ In his spare time, he presents various topics on Debugging.TV and explores Software\
    \ Narratology, its further development as Narratology of Things and Diagnostics\
    \ of Things (DoT), and Software Pathology. \n\nHis current interest areas are\
    \ theoretical software diagnostics and its mathematical and computer science foundations,\
    \ application of artificial intelligence, machine learning and data mining to\
    \ diagnostics and anomaly detection, software diagnostics engineering and diagnostics-driven\
    \ development, diagnostics workflow and interaction. Recent interest areas also\
    \ include security, functional programming, and category theory applications to\
    \ software development and big data."
