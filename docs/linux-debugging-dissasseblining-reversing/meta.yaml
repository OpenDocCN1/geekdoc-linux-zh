    # Assigning Numbers to Registers


    This is similar to memory assignments. We can write in pseudo-code:


    ```

    1 -> register

    (a) -> register

    ```


    Note that we do not use brackets when we refer to register contents. The latter
    instruction means assigning (copying) the number at the location (address) "a"
    to a register.


    In assembly language we write:


    ```

    mov $1, %eax   # 1 is copied to the first half of %RAX register

    mov $1, %rax   # full contents of %RAX register are replaced with 1

    mov a, %eax

    mov a, %rax

    ```


    In GDB disassembly output, we may see the following code:


    ```

    mov $0x0, %eax

    ```'
  - '[PAGE 18]


    # “Arithmetic” Project: Adding Numbers to Memory Cells


    Now let’s look at the following pseudo-code statement in more detail:


    ```

    (b) + (a) -> (b)

    ```


    To recall, “a” and “b” mean the names of locations (addresses) 00005555555802c
    and 000055555558030 respectively (see Picture x64.1.4). (a) and (b) mean contents
    at addresses “a” and “b” respectively, simply some numbers stored there.


    In C or C++ language we write the following statement:


    ```

    b = b + a;


    b += a;

    ```


    In assembly language, we use the instruction ADD. Because of AMD64 and Intel EM64T
    architecture’s limitations, we cannot use both memory addresses in one step (instruction),
    for example, **add a, b**. We can only use **add register, b** instruction to
    add the value stored in the **register** to the contents of the memory cell **b**.
    Recall that a register is like a temporary memory cell itself here:


    ```

    (a) -> register


    (b) + register -> (b)

    ```


    Alternatively, we can use two registers:


    ```

    (a) -> register1


    (b) -> register2


    registsr2 + register1 -> registsr2


    register2 -> (b)

    ```


    In assembly language, we write:


    ```

    mov a, %eax


    add %eax, b

    ```


    or we can add 2 registers and move the result to the memory cell b:


    ```

    mov b, %edx


    mov a, %eax


    add %edx, %eax


    mov %eax, b

    ```'
