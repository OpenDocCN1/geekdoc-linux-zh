    \n## 简化应用内存\n\n当可执行文件被加载到内存中时，其头部和节（sections）会被映射到内存页。某些数据和代码被原样复制，而某些数据则会被初始化并扩展。第一个栈也在这个阶段创建。%RIP\
    \ 寄存器被设置为指向第一条程序指令，而 %RSP 指向栈顶。这个简化过程如图 x64.9.4 所示。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_115_0.png)\n\
    \n图 x64.9.4\n\n## 栈溢出\n\n默认情况下，栈的大小是有限制的（取决于系统和限制设置，在我们的系统中，它是 8192Kb 或 8388608\
    \ 字节）。如果栈的增长超过了预留限制，就会发生栈溢出（段错误）。这可能是由无限递归、深层递归或非常大的局部变量引起的：\n\n```c\nint func()\n\
    {\n    func();\n    return 0;\n}\n\nint func2()\n{\n    int array[10000000] =\
    \ { 1 };\n    printf(\"%d\", array[10000000-1]);\n}\n```\n\n## 跳转 (Jumps)\n\n\
    在我们深入研究 C/C++ 函数之前，需要了解的另一个指令叫做 JMP（跳转）。图 x64.9.5 显示了内存中的指令以及对应的 %RIP 寄存器的值。\n\
    \n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_117_0.png)\n\n图 x64.9.5\n\n我们可以看到 JMP\
    \ 指令改变了 %RIP 以指向另一个内存地址，程序执行从该位置继续。图 x64.9.5 中显示的代码会无限循环：这可以被认为是程序挂起（hang）并导致\
    \ CPU 飙升。\n\n以下是参考 Intel 手册的绝对 JMP 指令伪代码及一些示例：\n\n```\n; 格式和参数:\n\nJMP r/mem64\n\
    \n; 伪代码:\n\nDEST -> RIP ; 新的执行目标地址\n\n; 示例:\n\nJMP 0x5555555558020\n\nJMP *%RAX\n\
    ```\n\n这种跳转被称为“绝对跳转”，因为我们指定的是完整的内存地址，而不是相对于当前 %RIP 值的 +/- 偏移量。后者被称为“相对跳转”。`*%RAX`\
    \ 表示对存储在 %RAX 寄存器中地址的间接跳转。如图 x64.9.6 所示。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_118_0.png)\n\
    \n图 x64.9.6\n\n## 调用 (Calls)\n\n我们讨论两个实现 C 和 C++ 函数调用的核心指令。它们被调用作 CALL 和 RET。图\
    \ x64.9.7 显示了内存中的指令以及对应的 %RIP 和 %RSP 寄存器的值。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_119_0.png)\n\
    \n图 x64.9.7\n\n我们可以看到 CALL 指令将 %RIP 的当前值压入栈中，并改变 %RIP 以指向另一个内存地址。然后程序执行从新位置继续。RET\
    \ 指令将保存的 %RIP 值从栈中弹出到 %RIP 寄存器。然后程序执行恢复到 CALL 指令之后的内存位置。\n\n以下是参考 Intel 手册的 CALL\
    \ 指令伪代码及一些示例：\n\n```\n; 格式和参数:\n\nCALL r/mem64\n\n; 伪代码:\n\nPUSH RIP\n\nDEST ->\
    \ RIP\n\n; 示例:\n\nCALL 0x555555558020\n\nCALL *%RAX\n```\n\n以下是参考 Intel 手册的 RET\
    \ 指令伪代码：\n\n```\n; 格式:\n\nRET\n\n; 伪代码:\n\nPOP() -> RIP\n```\n\n## 调用栈 (Call Stack)\n\
    \n在 C 和 C++ 中，如果一个函数（调用者）调用另一个函数（被调用者），结果代码使用 CALL 指令实现，在执行期间，返回地址被保存在栈上。如果被调用者又调用另一个函数，返回地址也会被保存在栈上，依此类推。因此，我们有了所谓的返回地址“调用栈”。让我们通过一个简单但精简的例子来看看。\n\
    \n假设我们有 3 个函数，其代码占用以下地址：\n\n| 函数 | 地址范围 |\n| :--- | :--- |\n| func | 0000001400010000\
    \ - 000000140001100 |\n| func2 | 0000001400011101 - 000000140001200 |\n| func3\
    \ | 000000140001201 - 000000140001300 |\n\n我们还有以下代码，其中 *func* 调用 *func2*，*func2*\
    \ 调用 *func3*：\n\n```cpp\nvoid func()\n{\n    func2();\n}\nvoid func2()\n{\n  \
    \  func3();\n}\n```\n\n当 *func* 调用 *func2* 时，调用者的返回地址被压入栈中，%RSP 指向 0000001400010000\
    \ - 000000140001100 范围内的某个值，例如 000000140001020。当 *func2* 调用 *func3* 时，调用者的返回地址同样被压入栈中，%RSP\
    \ 指向 0000001400011101 - 000000140001200 范围内的某个值，例如 000000140001180。如果我们使用调试器中断\
    \ *func3* 并检查 %RIP，我们会发现其值在 000000140001201 - 000000140001300 范围内，例如 000000140001250。因此，我们得到了图\
    \ x64.9.8 所示的内存和寄存器布局（未显示常规的函数序言：我们将在下一章学习）。\n"
