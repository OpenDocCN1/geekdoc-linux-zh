    ## Chapter x64.14: Summary of Code Disassembly Patterns\n\nThis final chapter\
    \ summarizes the various patterns we have encountered during the reading of this\
    \ book.\n\n## Function Prolog / Epilog\n\n### Function prolog\n\n```assembly\n\
