    0x7fffffffef510: 0x7fffffffef520 0x555555555153 <func+14>\n0x7fffffffef520: 0x7fffffffef540\
    \ 0x55555555513e <main+25>\n0x7fffffffef530: 0x7fffffffef628 0x100000000\n0x7fffffffef540:\
    \ 0x555555555170 < __libc_csu_init> 0x7ffff7e2c09b\n< __libc_start_main+235>\n\
    ```\n\nThe current value of `%RIP` points to `func3` and return addresses on the\
    \ stack are shown in **bold**. GDB is able to reconstruct the following call stack,\
