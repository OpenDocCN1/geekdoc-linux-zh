    \ in optimization mode:\n\n```\ncoredump@DESKTOP-IS6V2L0:~ /pflddr/x64/Chapter2$\
    \ gcc ArithmeticProjectC.cpp -O1 -o ArithmeticProjectC\n```\n\nand after repeating\
    \ the same steps in GDB we get the following output:\n\n```\n(gdb) disass main\n\
    Dump of assembler code for function main:\n=> 0x0000555555555125 <+0>:\t\tmovl\t\
    $0x2,0x2f01(%rip)\t# 0x555555558030 <a>\n0x000055555555512f <+10>:\t\tmovl\t$0x4,0x2ef3(%rip)\t\
    # 0x55555555802c <b>\n0x0000555555555139 <+20>:\t\tmov\t$0x8,%eax\n0x000055555555513e\
    \ <+25>:\t\tretq\nEnd of assembler dump.\n```\n\nThis corresponds to the following\
    \ pseudo-code:\n\n```\nmov $2, a  # 2 -> (a)\nmov $4, b  # 4 -> (b)\n```\n\nPlease\
    \ note that the compiler also chose to put memory cell “b” first (000055555555802c)\
    \ and then memory cell “a” (0000555555558030).\n\nWhat happened to all our assembly\
    \ code in this executable? This code seems to be directly placing the end result\
    \ into the “b” memory cell if we observe. Why is this happening? The answer lies\
    \ in compiler optimization. When the code is compiled in optimization mode, the\
    \ compiler can calculate the final result from the simple C/C++ source code itself\
    \ and generate only the necessary code to update corresponding memory locations."
