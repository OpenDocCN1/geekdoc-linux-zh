    ## 重构 C/C++ 代码：第三部分


    接下来，我们将更多混合语句组合成 C/C++ 语言代码：


    ```

    int a; int *pa;

    pa = &a;


    int b; int *pb;

    pb = &b;


    *pa = 1;

    *pb = 1;


    ecx = *pb;    ; *pb = *pb + *pa;

    edx = *pa;

    edx = ecx + edx;

    *pb = edx;


    edx = *pa;    ; *pa = 1 + *pa;

    edx = 1 + edx;

    *pa = edx;


    ecx = *pb;    ; *pb = *pb * *pa;

    edx = *pa;

    edx = ecx * edx;

    *pb = edx;

    ```


    ## 重构 C/C++ 代码：C/C++ 程序


    最终，我们得到了一个看起来像完整 C/C++ 代码的内容：


    ```cpp

    int a, b;

    int *pa, *pb;


    pa = &a;

    pb = &b;


    *pa = 1;

    *pb = 1;


    *pb = *pb + *pa;


    ++*pa;


    *pb = *pb * *pa;

    ```


    如果我们查看项目源代码 `PointersAsVariables.cpp`，我们会发现这段代码与被反汇编的执行文件中的代码是一致的。


    ## 反汇编输出示例：优化后的程序


    优化后的程序（使用 `-O2` 编译）包含极少的 CPU 指令：


    ```

    (gdb) dissas main

    Dump of assembler code for function main:


    => 0x0000555555555040 <+0>:  lea 0x2ffd(%rip),%rax    # 0x555555558044 <a>

    0x0000555555555047 <+7>:   movl $0x2,0x2ff3(%rip)    # 0x555555558044 <a>

    0x0000555555555051 <+17>:  mov %rax,0x2fe0(%rip)     # 0x555555558038 <pa>

    0x0000555555555058 <+24>:  lea 0x2fe1(%rip),%rax     # 0x555555558040 <b>

    0x000055555555505f <+31>:  mov %rax,0x2fca(%rip)     # 0x555555558030 <pb>

    0x0000555555555066 <+38>:  xor %eax,%eax

    0x0000555555555068 <+40>:  movl $0x4,0x2fce(%rip)    # 0x555555558040 <b>

    0x0000555555555072 <+50>:  retq

    End of assembler dump.

    ```


    我们可以看到，编译器能够算出计算结果：`a = 2; b = 4;`。然而，还有一个问题：为什么编译器没有将初始化 `pa` 和 `pb` 变量的第一批指令优化掉？答案在于
    C 和 C++ 中分离编译模型的本质。我们可以分别且独立地编译多个编译单元（`.c` 或 `.cpp` 文件）。因此，无法保证另一个编译单元不会引用我们全局声明并定义的
    `pa` 和 `pb` 变量。


    我们还可以看到编译器重新排列了指令顺序。这在伪代码中可以体现：


    ```

    address a -> rax

    1 -> (a)

    rax -> (pa)

    ```


    这是因为使用变量 `a` 的地址初始化 `pa` 与将 `1` 赋值给变量 `a` 所指向的内存单元是相互独立的，且重新排列后的指令序列在现代处理器上执行速度可能更快。


    ## 第 x64.9 章：内存与栈


    ### 栈：定义


    栈是一个简单的计算设备，具有两种操作：`push`（入栈）和 `pop`（出栈）。它允许我们将数据堆叠起来以便以 LIFO（后进先出）的方式记忆，并能快速检索最后堆叠的数据项，如图
    x64.9.1 所示。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_107_0.png)

    图 x64.9.1


    ### 栈在内存中的实现


    CPU 的 `%RSP` 寄存器（栈指针）指向栈顶。如图 x64.9.2 所示，随着每条 `push` 指令的执行，栈向较低的内存地址生长，这在实现上表现为
    `%RSP` 寄存器递减 8。我们可以使用以下指令读取栈顶值：


    ```

    mov (%rsp), %rax

    ```


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_108_0.png)

    图 x64.9.2


    相反的 `POP` 指令会增加 `%RSP` 寄存器的值，如图 x64.9.3 所示。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_109_0.png)

    图 x64.9.3


    ### 重点记忆


    以下是我们学习到的关于栈的总结，最后 3 点将在本书随后的章节中涵盖：


    - 栈操作是 LIFO —— 后进先出

    - 栈在内存中向低地址生长

    - `%RSP` 寄存器指向栈顶

    - 栈用于存储 `CALL` 指令的返回地址

    - 栈用于向函数传递额外参数

    - 栈用于存储函数参数值、局部变量和临时变量

