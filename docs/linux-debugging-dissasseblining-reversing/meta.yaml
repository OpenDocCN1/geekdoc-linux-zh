- img_proc: true
  md: '# Zeroing Memory or Registers


    There are several ways to put a zero value into a register or a memory location:


    +   1. Move a value:


    ```

    ```assembly

    mov $0, a

    mov $0, %rax

    mov $0, %eax

    ```

    ```


    +   2. Use XOR (Exclusive OR) logical operation:


    ```

    ```assembly

    xor %rax, %rax

    xor %eax, %eax

    ```

    ```


    XOR


    | XOR Truth Table |

    | :--- | :--- |

    | 1 xor 1 = 0 | T xor T = F |

    | 1 xor 0 = 1 | T xor F = T |

    | 0 xor 1 = 1 | F xor T = T |

    | 0 xor 0 = 0 | F xor F = F |


    This operation clears its destination operand because the source operand is the
    same, and the same bits are cleared.'
