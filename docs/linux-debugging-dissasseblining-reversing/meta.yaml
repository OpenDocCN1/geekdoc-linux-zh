    \ It is saved on the stack because the register may be used later in calculations\
    \ or function parameter passing to other functions. Generally, the function first\
    \ 6 parameters are passed via %RDI, %RSI, %RDX, %RCX, %R8, and %R9 registers from\
    \ left to the right when parameters are quadwords like pointers or long values\
    \ and via %EDI, %ESI, %EDX, %ECX, %R8D, and %R9D registers when parameters are\
    \ doublewords like integers. Additional parameters are passed via the stack locations\
    \ using PUSH instruction.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_143_0.png)\n\
