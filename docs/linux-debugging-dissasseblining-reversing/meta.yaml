    ```\n\n`%RIP` 的当前值指向 `func3`，而栈上的返回地址以**粗体**显示。GDB 能够重建如下的调用栈、栈追踪或回溯 (`bt`)：\n\
    \n```\n(gdb) bt\n#0 0x000055555555516c in func3 ()\n#1 0x0000555555555164 in func2\
    \ ()\n#2 0x0000555555555153 in func ()\n#3 0x000055555555513e in main ()\n```\n\
    \n## 第 x64.10 章：帧指针和局部变量\n\n### 栈的用途\n\n除了存储 CALL 指令的返回地址外，栈还用于向函数传递额外的参数以及存储局部变量。当我们需要在某些计算过程中或跨函数调用保留寄存器中的值时，栈还用于保存和恢复这些值。例如，假设我们要进行乘法运算，但与此同时，我们在寄存器\
    \ %RAX 和 %RDX 中有其他有价值的数据。乘法结果将覆盖 %RAX 和 %RDX 的值，因此我们将它们的值暂时放入栈中：\n\n```assembly\n\
    mov  $10, %rax\nmov  $20, %rdx\n--\n--\n-- ; 现在我们想要保留 %RAX 和 %RDX\n\npush %rax\n\
    push %rdx\nimul %rdx ; %RDX 和 %RAX 包含 %RAX*%RDX 的结果\nmov  %rax, result\n\npop\
    \  %rdx ; 按反序弹出\npop  %rax ; 栈是后进先出 (LIFO)\n```\n\n### 寄存器回顾\n\n到目前为止，我们遇到了以下通用寄存器：\n\
    \n- %RAX（其具体用途包括包含函数返回值和乘法结果的低位部分）\n- %RBX\n- %RCX（其具体用途之一是循环计数器）\n- %RDX（其具体用途之一是在乘法结果超过\
    \ 64 位最大值时包含结果的高位部分）\n- %RIP（指令指针，指向下一条要执行的指令）\n- %RSP（栈指针，指向栈顶）\n\n接下来我们要介绍 Linux\
    \ 平台上另一个重要的寄存器，称为基址指针寄存器，有时也称为栈帧指针寄存器 %RBP。\n\n### 数组元素的寻址\n\n我们也可以将栈内存视为内存单元的数组，通常\
    \ %RBP 寄存器用于像图 x64.10.1 所示那样对栈内存元素进行寻址，它滑动进入被称为“栈帧”的栈内存区域。第一个图描绘了 64 位（四字）内存单元，第二个图描绘了\
    \ 32 位（双字）内存单元。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_129_0.png)\n\n###\
    \ 栈结构（无函数参数）\n\n假设调用以下函数：\n\n```c\nvoid func()\n{\n    int var1, var2;\n    //\
    \ 正文代码\n    // ...\n}\n```\n\n在函数正文代码执行之前，将设置以下指针：\n\n- (%RBP) 包含前一个 %RBP 的值\n\
    - -0x4(%RBP) 包含局部变量 var1（双字）\n- -0x8(%RBP) 包含局部变量 var2（双字）\n\n如图 x64.10.2 所示。\n\
    \n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_130_0.png)\n\n图 x64.10.2\n\n### 函数序言\
    \ (Function Prolog)\n\n导致 %RBP 寄存器初始化并为局部变量留出空间的指令序列称为函数序言。图 x64.10.3 就是一个例子，其中\
    \ func 调用 func2，func2 有一个局部变量 var。有时，保存必要的寄存器也被认为是函数序言的一部分。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_131_0.png)\n\
    \n图 x64.10.3\n\n### 原始栈（无局部变量和函数参数）\n\n现在我们可以理解在第 x64.9 章项目 \"SimpleStack\" 中看到的原始栈上，除了函数返回地址之外还出现的附加数据（即函数调用之前等于前一个\
    \ %RSP 的前一个 %RBP）：\n\n```\n(gdb) info registers $rsp $rbp\nrsp\t\t0x7ffffffe500\t\
    0x7ffffffe500\nrbp\t\t0x7ffffffe500\t0x7ffffffe500\n```\n\n```\n(gdb) x/10a $rsp\n\
    0x7ffffffe500: 0x7ffffffe510 0x55555555164 <func2+14>\n0x7ffffffe510: 0x7ffffffe520\
    \ 0x55555555153 <func+14>\n0x7ffffffe520: 0x7ffffffe540 0x5555555513e <main+25>\n\
    0x7ffffffe530: 0x7ffffffe628 0x10000000000\n0x7ffffffe540: 0x55555555170 < __libc_csu_init>\
    \ 0x7ffff7e2c09b\n< __libc_start_main+235>\n```\n\n```\n(gdb) disass func2\n```\n\
    \n函数 func2 的汇编代码转储：\n\n```\n0x0000555555555156 <+0>: push %rbp\n0x0000555555555157\
    \ <+1>: mov %rsp,%rbp\n0x000055555555515a <+4>: mov $0x0,%eax\n0x000055555555515f\
    \ <+9>: callq 0x555555555167 <func3>\n0x0000555555555164 <+14>: nop\n0x0000555555555165\
    \ <+15>: pop %rbp\n0x0000555555555166 <+16>: retq\n```\n\n汇编转储结束。\n\n```\n(gdb)\
    \ disass func\n```\n\n函数 func 的汇编代码转储：\n\n```\n0x0000555555555145 <+0>: push %rbp\n\
