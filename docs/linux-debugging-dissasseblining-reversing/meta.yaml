  - '[PAGE 14]


    # “Arithmetic” Project: A Computer Program


    We can think of a computer program as a sequence of instructions for manipulation
    of contents of memory cells and registers. For example, addition operation: add
    the contents of memory cell N₾12 to the contents of memory cell N₾14. In our pseudo-code,
    we can write:


    (14) + (12) -> (14)


    Our first program in pseudo-code is shown on the left of the table:


    | Pseudo-code | Assembly Instructions |

    | :--- | :--- |

    | 1 -> (a) <br> 1 -> (b) <br> (b) + (a) -> (b) <br> (a) + 1 -> (a) <br> (b) *
    (a) -> (b) | Here we put assembly instructions corresponding to pseudo-code. |


    ''->'' means moving (assigning) the new value to the contents of a memory location
    (address). '';'' is a comment sign, and the rest of the line is a comment. ''=''
    shows the current value at a memory location (address).


    To remind, a code written in a high-level programming language is translated to
    a machine language by a compiler. However, the machine language can be readable
    if its digital codes are represented in some mnemonic system called assembly language.
    For example, INC a is increment by one of what is stored at a memory location
    “a”.'
