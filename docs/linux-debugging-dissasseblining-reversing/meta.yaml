  md: '# Jumps


    Another instruction we need to know and understand before we look deeper into
    C/C++ functions is called JMP (Jump). Picture x64.9.5 shows instructions in memory
    and corresponding values of %RIP register.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_117_0.png)


    Picture x64.9.5


    We see that JMP instruction changes %RIP to point to another memory address, and
    the program execution continues from that location. The code shown in Picture
    x64.9.5 loops indefinitely: this can be considered a hang and CPU spike.'
  merge: -1
