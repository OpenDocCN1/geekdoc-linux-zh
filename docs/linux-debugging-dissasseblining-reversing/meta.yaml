    # # Chapter x64.5: Bytes, Words, Double, and Quad Words


    # ## Using Hexadecimal Numbers


    If we want to use hexadecimal numbers in C/C++ language, we prefix them with `0x`,
    for example:


    ```

    ```cpp

    a = 12;    // 12dec

    a = 0xC;    // Chex

    ```

    ```


    In GDB disassembly output, and when entering commands, numbers are interpreted
    as decimals by default. If we want a number to be interpreted as hexadecimal,
    we prefix it with `0x`, for example:


    ```

    ```asm

    mov 12, a

    mov 0xC, a

    ```

    ```'
