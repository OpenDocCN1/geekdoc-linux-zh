    图 x64.6.6\n\n## 第 x64.7 章：逻辑指令和 RIP\n\n### 指令格式\n\n我们已经看到汇编语言指令具有统一的格式：\n\n操作数可以是寄存器\
    \ (reg)、内存引用 (mem) 或某些数字，称为立即数 (imm)。典型的表示示例：\n\n```\ninc mem/reg\ndec mem/reg\n\
    add reg/imm, mem/reg\nadd mem/imm, reg\n```\n\n以及一些具体的汇编语言示例：\n\n```\ninc (%rax)\n\
    decl a\naddl $0x10, (%rax)\naddq a, (%rax)\n```\n\n### 逻辑移位指令\n\n除了算术指令外，还有所谓的逻辑移位指令，它们只是将位串向左或向右移位。\n\
    \n左移：\n```\n11111111 -> 11111110 ; 移位 1 位\n11111110 -> 11110000 ; 移位 3 位\nshl\
    \ imm/reg, mem/reg\nshl $1, %rax\nshlb $2, (%rax)\n```\n\n右移：\n```\n11111111 ->\
    \ 01111111 ; 移位 1 位\n01111111 -> 00001111 ; 移位 3 位\nshr imm/reg, mem/reg\nshr\
    \ $1, %rax\nshrb $2, (%rax)\n```\n\n### 逻辑运算\n\n这里我们回顾一下逻辑运算及相应的真值表。我们将 True 缩写为\
    \ T，False 缩写为 F。\n\n**AND（与）**\n- 1 and 1 = 1 (T and T = T)\n- 1 and 0 = 0 (T\
    \ and F = F)\n- 0 and 1 = 0 (F and T = F)\n- 0 and 0 = 0 (F and F = F)\n\n**OR（或）**\n\
    - 1 or 1 = 1 (T or T = T)\n- 1 or 0 = 1 (T or F = T)\n- 0 or 1 = 1 (F or T = T)\n\
    - 0 or 0 = 0 (F or F = F)\n\n### 将内存或寄存器清零\n\n有几种方法可以将零值放入寄存器或内存位置：\n\n- 1. 移动一个值：\n\
    ```assembly\nmov $0, a\nmov $0, %rax\nmov $0, %eax\n```\n\n- 2. 使用 XOR（异或）逻辑运算：\n\
    ```assembly\nxor %rax, %rax\nxor %eax, %eax\n```\n\n**XOR 真值表**\n\n| 输入 A | 输入\
    \ B | 结果 | 逻辑 |\n| :--- | :--- | :--- | :--- |\n| 1 | 1 | 0 | T xor T = F |\n\
    | 1 | 0 | 1 | T xor F = T |\n| 0 | 1 | 1 | F xor T = T |\n| 0 | 0 | 0 | F xor\
    \ F = F |\n\n由于源操作数与目的操作数相同，且相同的位会被清零，因此此操作会清除其目的操作数。\n\n### 指令指针\n\n考虑上一章项目中的这两个执行步骤：\n\
    \n```\n(gdb) si\n0x0000000000040102c in _start ()\n1: x/i $rip\n=> 0x40102e <_start+44>:\
