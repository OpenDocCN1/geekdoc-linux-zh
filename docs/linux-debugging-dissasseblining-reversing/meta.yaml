    # # Chapter x64.3: Number Representations


    # ## Numbers and Their Representations


    Imagine a herder in ancient times trying to count his sheep. He has a certain
    number of stones (twelve):


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_0.png)


    However, he can only count up to three and arranges the total into groups of three:


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_1.png)


    The last picture is a representation (a kind of notation) of the number of stones.
    We have one group of three groups of three stones plus a separate group of three
    stones. If he could count up to ten, we would see a different representation of
    the same number of stones. We would have one group of ten stones and another group
    of two stones.'
  - '[PAGE 34]


    # Decimal Representation (Base Ten)


    Let''s now see how twelve stones are represented in arithmetic notation if we
    can count up to ten. We have one group of ten numbers plus two:


    ```

    $12_{dec} = 1 * 10 + 2$ or $1 * 10^1 + 2 * 10^0$

    ```


    Here is another exercise with one hundred and twenty three stones. We have **1**
    group of ten by ten stones, another group of **2** groups of ten stones and the
    last group of **3** stones:


    ```

    $123_{dec} = 1 * 10*10 + 2 * 10 + 3$ or $1 * 10^2 + 2 * 10^1 + 3 * 10^0$

    ```


    We can formalize it in the following summation notation:


    ```

    $N_{dec} = a_n * 10^n + a_{n-1} * 10^{n-1} + ... + a_2 * 10^2 + a_1 * 10^1 + a_0
    * 10^0 \quad 0 \le a_i \le 9$

    ```


    Using the summation symbol we have this formula:


    ```

    $N_{dec} = \sum_{i=0}^{n} a_i * 10^i$

    ```'
  - '[PAGE 35]


    # Ternary Representation (Base Three)


    Now we come back to our herder''s example of twelve stones. We have **1** group
    of three by three stones, **1** group of three stones, and an empty (**0**) group
    (which is not empty if we have one stone only or have thirteen stones instead
    of twelve). We can write down the number of groups sequentially: **110**. Therefore
    110 is a ternary representation (notation) of twelve stones, and it is equivalent
    to 12 written in decimal notation:


    ```

    12_{dec} = 1*3^2 + 1*3^1 + 0*3^0

    ```


    ```

    N_{dec} = a_n*3^n + a_{n-1}*3^{n-1} + ... + a_2*3^2 + a_1*3^1 + a_0*3^0 \quad
    a_i = 0 \text{ or } 1 \text{ or } 2

    ```


    ```

    N_{dec} = \sum_{i=0}^{n} a_i*3^i

    ```'
  - '[PAGE 36]


    # Binary Representation (Base Two)


    In the case of counting up to 2 we have more groups for twelve stones: **1100**.
    Therefore 1100 is a binary representation (notation) for 12 in decimal notation:


    $12_{dec} = 1 * 2^3 + 1 * 2^2 + 0 * 2^1 + 0 * 2^0$


    $12_{3dec} = 1 * 2^6 + 1 * 2^5 + 1 * 2^4 + 1 * 2^3 + 0 * 2^2 + 1 * 2^1 + 1 * 2^0$
    or $1111011_2$


    $N_{dec} = a_n * 2^n + a_{n-1} * 2^{n-1} + ... + a_2 * 2^2 + a_1 * 2^1 + a_0 *
    2^0$ $\quad a_i = 0$ or $1$


    $N_{dec} = \sum_{i=0}^{n} a_i * 2^i$'
  - '[PAGE 37]


    # Hexadecimal Representation (Base Sixteen)


    If we can count up to sixteen, twelve stones fit in one group but we need more
    symbols: A, B, C, D, E, and F for ten, eleven, twelve, thirteen, fourteen, and
    fifteen respectively:


    ```

    $12_{dec} = C$ in hexadecimal representation (notation)

    ```


    ```

    $123_{dec} = 7B_{hex}$

    ```


    ```

    $123_{dec} = 7 * 16^1 + 11 * 16^0$

    ```


    ```

    $N_{dec} = \sum_{i=0}^{n} a_i * 16^i$

    ```'
  - '[PAGE 38]


    # Why are Hexadecimals used?


    Consider this number written in binary notation: $110001010011_2$. Its equivalent
    in decimal notation is 3155:


    ```

    $3155_{dec} = 1*2^{11} + 1*2^{10} + 0*2^9 + 0*2^8 + 0*2^7 + 1*2^6 + 0*2^5 + 1*2^4
    + 0*2^3 + 0*2^2 + 1*2^1 + 1*2^0$

    ```


    Now we divide the binary number digits into groups of four and write them down
    in decimal and hexadecimal notation:


    | $\mathbf{1100}$ | $\mathbf{0101}$ | $\mathbf{0011}$ |

    | :--- | :--- | :--- |

    | $12_{dec}$ | $5_{dec}$ | $3_{dec}$ |

    | $\text{C}_{hex}$ | $5_{hex}$ | $3_{hex}$ |


    We see that hexadecimal notation is more compact because every four binary digit
    group number corresponds to one hexadecimal number. Table x64.3.1 lists hexadecimal
    equivalents for every four binary digit combination.


    In GDB and other debuggers, memory addresses are displayed in hexadecimal notation.'
