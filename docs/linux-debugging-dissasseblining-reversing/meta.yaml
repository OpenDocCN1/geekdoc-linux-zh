- img_proc: true
  md: "# The Fast Way to Fill Memory\n\nIt can be done by STOSQ instruction that stores\
    \ a quadword value from %RAX into a memory location which address is in %RDI register\
    \ (\"D\" means destination). After the value from %RAX is transferred to memory,\
    \ the instruction increments %RDI by 8, and, if the DF flag is 0, %RDI now points\
    \ to the next quadword in memory. If the DF flag is 1, then the %RDI value is\
    \ decremented by 8, and the %RDI now points to the previous quadword in memory.\
    \ There is an equivalent STOSL instruction that stores doublewords and increments\
    \ or decrements %RDI by 4.\n\nIf we prefix any instruction with REP, it causes\
    \ the instruction to be repeated until the %RCX register's value is decremented\
    \ to 0. For example, we can write simple code that should theoretically zero \"\
    all memory\" (practically, it traps because of access violation):\n\n```\n```assembly\n\
    xor %rax, %rax            # fill with 0\nmov $0, %rdi             # starting address\
    \ or xor %rdi, %rdi\nmov $0xffffffff / 4, %rcx # 0x1ffffff quad words\nrep stosq\n\
    ```\n```\n\nHere is REP STOSQ in pseudo-code:\n\n```\n```\nWHILE (RCX != 0)\n\
    {\n    RAX -> (RDI)\n\n    IF DF = 0 THEN\n        RDI + 8 -> RDI\n    ELSE\n\
    \        RDI - 8 -> RDI\n\n    RCX - 1 -> RCX\n}\n```\n```\n\nA simple example\
    \ of erasing 32 bytes (4x8) is shown in Picture x64.12.2."
  merge: -1
