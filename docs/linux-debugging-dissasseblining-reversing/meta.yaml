    # # Chapter x64.14: Summary of Code Disassembly Patterns


    This final chapter summarizes the various patterns we have encountered during
    the reading of this book.


    # ## Function Prolog / Epilog


    # ### Function prolog


    ```

    ```assembly

    push %rbp

    mov %rsp,%rbp

    ```

    ```


    # ### Function epilog


    ```

    ```assembly

    mov %rbp,%rsp

    pop %rbp

    ret

    ```

    ```


    This is equivalent to:


    ```

    ```assembly

    leave

    ret

    ```

    ```


    Some code may omit to restore %RSP if it does not change:


    ```

    ```assembly

    pop %rbp

    ret

    ```

    ```


    Knowing prolog can help in identifying situations when symbol files or function
    start addresses are not correct. For example, suppose we have the following backtrace:


    ```

    ```text

    func3+0x05F

    func2+0x08F

    func+0x20

    ```

    ```


    If we disassemble the `func2` function and see that it does not start with prolog,
    we may assume that backtrace needs more attention:


    ```

    ```text

    (gdb) x/2i func2

    0x555555555165 <main+32>: lea -0x8(%rbp),%rdx

    0x555555555169 <main+36>: lea -0x4(%rbp),%rax

    ```

    ```


    In optimized code, %RSP may be used to address local variables and parameters
    instead of %RBP. In such a case, prolog and epilog may be partially missing. Here
    is an example from the `printf` function:'
  - "[PAGE 170]\n\n```\n(gdb) dissas printf\n\nDump of assembler code for function\
    \ __printf:\n 0x00007ffff77e60560 <+0>:  sub $0xd8,%rsp\n 0x00007ffff77e60567\
    \ <+7>:  mov %rsi,0x28(%rsp)\n 0x00007ffff77e6056c <+12>: mov %rdx,0x30(%rsp)\n\
    \ 0x00007ffff77e60571 <+17>: mov %rcx,0x38(%rsp)\n 0x00007ffff77e60576 <+22>:\
    \ mov %r8,0x40(%rsp)\n 0x00007ffff77e6057b <+27>: mov %r9,0x48(%rsp)\n 0x00007ffff77e60580\
    \ <+32>: test %al,%al\n 0x00007ffff77e60582 <+34>: je 0x7ffff77e605bb <__printf+91>\n\
    \ 0x00007ffff77e60584 <+36>: pxor %xmm0,0x50(%rsp)\n 0x00007ffff77e60589 <+41>:\
    \ movaps %xmm1,0x60(%rsp)\n 0x00007ffff77e6058e <+46>: movaps %xmm2,0x70(%rsp)\n\
    \ 0x00007ffff77e60593 <+51>: movaps %xmm3,0x80(%rsp)\n 0x00007ffff77e6059b <+59>:\
    \ movaps %xmm4,0x90(%rsp)\n 0x00007ffff77e605a3 <+67>: movaps %xmm5,0xa0(%rsp)\n\
    \ 0x00007ffff77e605ab <+75>: movaps %xmm6,0xb0(%rsp)\n 0x00007ffff77e605b3 <+83>:\
