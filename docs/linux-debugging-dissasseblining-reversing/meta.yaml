    \n## 使用指针进行数值自增\n\n在伪代码中，这意味着增加（或减少）存储在地址由 %RAX 保存的内存位置中的数值：\n\n```\n(rax) + 1\
    \ -> (rax)\n```\n\n在 C 或 C++ 语言中，我们可以用三种可能的方式来编写：\n\n```\n*a = *a + 1;\n++(*a);\n\
