  md: '# Adding Numbers Using Pointers


    Now we look at the next pseudo-code statement:


    ```

    (rbx) + (rax) -> (rbx)

    ```


    Recall that (rax) and (rbx) mean contents of memory cells whose addresses (locations)
    are stored in %RAX and %RBX CPU registers. The statement above is equivalent to
    the following C or C++ language expression where ‘*’ operator means to get memory
    contents pointed to by pa or pb pointer (also called pointer dereference):


    ```

    *pb = *pb + *pa;

    ```


    In assembly language, we use the instruction ADD for the ‘+’ operator, but we
    cannot use both memory addresses in one step instruction (addl is used to add
    32-bit integers):


    ```

    addl (%rax), (%rbx)    # invalid instruction

    ```


    We can only use one memory reference, and therefore, we need to employ another
    register as a temporary variable:


    ```

    (rax) -> register

    (rbx) + register -> (rbx)

    ```


    In assembly language, we write this sequence of instructions:


    ```

    mov (%rax), %edx

    add %edx, (%rbx)

    ```


    We use add instead of addl because using %EDX instead of %RDX implies adding a
    32-bit integer.


    In GDB disassembly output we see these instructions indeed:


    ```

    0x00000000000040101c <+28>:    mov    (%rax),%edx

    0x00000000000040101e <+30>:    add    %edx,(%rbx)

    ```'
