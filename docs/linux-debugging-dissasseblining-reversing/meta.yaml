- md: "## GDB Disassembly Output – Optimization\n\nIf we compile and link the program\
    \ in optimization mode:\n\n```\ncoredump@DESKTOP-IS6V2L0:~ /pflddr/x64/Chapter2$\
    \ gcc ArithmeticProjectC.cpp -O1 -o ArithmeticProjectC\n```\n\nand after repeating\
    \ the same steps in GDB we get the following output:\n\n```\n(gdb) disass main\n\
    Dump of assembler code for function main:\n=> 0x0000555555555125 <+0>:\t\tmovl\t\
    $0x2,0x2f01(%rip)\t# 0x555555558030 <a>\n0x000055555555512f <+10>:\t\tmovl\t$0x4,0x2ef3(%rip)\t\
    # 0x55555555802c <b>\n0x0000555555555139 <+20>:\t\tmov\t$0x8,%eax\n0x000055555555513e\
    \ <+25>:\t\tretq\nEnd of assembler dump.\n```\n\nThis corresponds to the following\
    \ pseudo-code:\n\n```\nmov $2, a  # 2 -> (a)\nmov $4, b  # 4 -> (b)\n```\n\nPlease\
    \ note that the compiler also chose to put memory cell “b” first (000055555555802c)\
    \ and then memory cell “a” (0000555555558030).\n\nWhat happened to all our assembly\
    \ code in this executable? This code seems to be directly placing the end result\
    \ into the “b” memory cell if we observe. Why is this happening? The answer lies\
    \ in compiler optimization. When the code is compiled in optimization mode, the\
    \ compiler can calculate the final result from the simple C/C++ source code itself\
    \ and generate only the necessary code to update corresponding memory locations.\n\
    \n## Chapter x64.3: Number Representations\n\n### Numbers and Their Representations\n\
    \nImagine a herder in ancient times trying to count his sheep. He has a certain\
    \ number of stones (twelve):\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_0.png)\n\
    \nHowever, he can only count up to three and arranges the total into groups of\
    \ three:\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_1.png)\n\nThe last picture\
    \ is a representation (a kind of notation) of the number of stones. We have one\
    \ group of three groups of three stones plus a separate group of three stones.\
    \ If he could count up to ten, we would see a different representation of the\
    \ same number of stones. We would have one group of ten stones and another group\
    \ of two stones.\n\n### Decimal Representation (Base Ten)\n\nLet's now see how\
    \ twelve stones are represented in arithmetic notation if we can count up to ten.\
    \ We have one group of ten numbers plus two:\n\n$12_{dec} = 1 * 10 + 2$ or $1\
    \ * 10^1 + 2 * 10^0$\n\nHere is another exercise with one hundred and twenty three\
    \ stones. We have **1** group of ten by ten stones, another group of **2** groups\
    \ of ten stones and the last group of **3** stones:\n\n$123_{dec} = 1 * 10*10\
    \ + 2 * 10 + 3$ or $1 * 10^2 + 2 * 10^1 + 3 * 10^0$\n\nWe can formalize it in\
    \ the following summation notation:\n\n$N_{dec} = a_n * 10^n + a_{n-1} * 10^{n-1}\
    \ + ... + a_2 * 10^2 + a_1 * 10^1 + a_0 * 10^0 \\quad 0 \\le a_i \\le 9$\n\nUsing\
    \ the summation symbol we have this formula:\n\n$N_{dec} = \\sum_{i=0}^{n} a_i\
    \ * 10^i$\n\n### Ternary Representation (Base Three)\n\nNow we come back to our\
    \ herder's example of twelve stones. We have **1** group of three by three stones,\
    \ **1** group of three stones, and an empty (**0**) group (which is not empty\
    \ if we have one stone only or have thirteen stones instead of twelve). We can\
    \ write down the number of groups sequentially: **110**. Therefore 110 is a ternary\
    \ representation (notation) of twelve stones, and it is equivalent to 12 written\
    \ in decimal notation:\n\n$12_{dec} = 1*3^2 + 1*3^1 + 0*3^0$\n\n$N_{dec} = a_n*3^n\
    \ + a_{n-1}*3^{n-1} + ... + a_2*3^2 + a_1*3^1 + a_0*3^0 \\quad a_i = 0 \\text{\
    \ or } 1 \\text{ or } 2$\n\n$N_{dec} = \\sum_{i=0}^{n} a_i*3^i$\n\n### Binary\
    \ Representation (Base Two)\n\nIn the case of counting up to 2 we have more groups\
    \ for twelve stones: **1100**. Therefore 1100 is a binary representation (notation)\
    \ for 12 in decimal notation:\n\n$12_{dec} = 1 * 2^3 + 1 * 2^2 + 0 * 2^1 + 0 *\
    \ 2^0$\n\n$127_{dec} = 1 * 2^6 + 1 * 2^5 + 1 * 2^4 + 1 * 2^3 + 0 * 2^2 + 1 * 2^1\
    \ + 1 * 2^0$ or $1111011_2$\n\n$N_{dec} = a_n * 2^n + a_{n-1} * 2^{n-1} + ...\
    \ + a_2 * 2^2 + a_1 * 2^1 + a_0 * 2^0 \\quad a_i = 0$ or $1$\n\n$N_{dec} = \\\
    sum_{i=0}^{n} a_i * 2^i$\n\n### Hexadecimal Representation (Base Sixteen)\n\n\
    If we can count up to sixteen, twelve stones fit in one group but we need more\
    \ symbols: A, B, C, D, E, and F for ten, eleven, twelve, thirteen, fourteen, and\
    \ fifteen respectively:\n\n$12_{dec} = \\text{C}$ in hexadecimal representation\
    \ (notation)\n\n$123_{dec} = 7B_{hex}$\n\n$123_{dec} = 7 * 16^1 + 11 * 16^0$\n\
    \n$N_{dec} = \\sum_{i=0}^{n} a_i * 16^i$\n\n### Why are Hexadecimals used?\n\n\
    Consider this number written in binary notation: $110001010011_2$. Its equivalent\
    \ in decimal notation is 3155:\n\n$3155_{dec} = 1*2^{11} + 1*2^{10} + 0*2^9 +\
    \ 0*2^8 + 0*2^7 + 1*2^6 + 0*2^5 + 1*2^4 + 0*2^3 + 0*2^2 + 1*2^1 + 1*2^0$\n\nNow\
    \ we divide the binary number digits into groups of four and write them down in\
    \ decimal and hexadecimal notation:\n\n| 1100 | 0101 | 0011 |\n| :--- | :--- |\
    \ :--- |\n| $12_{dec}$ | $5_{dec}$ | $3_{dec}$ |\n| $\\text{C}_{hex}$ | $5_{hex}$\
    \ | $3_{hex}$ |\n\nWe see that hexadecimal notation is more compact because every\
    \ four binary digit group number corresponds to one hexadecimal number. Table\
    \ x64.3.1 lists hexadecimal equivalents for every four binary digit combination.\n\
    \nIn GDB and other debuggers, memory addresses are displayed in hexadecimal notation.\n\
    \n| Binary | Decimal | Hexadecimal |\n| :--- | :--- | :--- |\n| 0000 | 0 | 0 |\n\
    | 0001 | 1 | 1 |\n| 0010 | 2 | 2 |\n| 0011 | 3 | 3 |\n| 0100 | 4 | 4 |\n| 0101\
    \ | 5 | 5 |\n| 0110 | 6 | 6 |\n| 0111 | 7 | 7 |\n| 1000 | 8 | 8 |\n| 1001 | 9\
    \ | 9 |\n| 1010 | 10 | A |\n| 1011 | 11 | B |\n| 1100 | 12 | C |\n| 1101 | 13\
    \ | D |\n| 1110 | 14 | E |\n| 1111 | 15 | F |\n\nTable x64.3.1\n\n## Chapter x64.4:\
    \ Pointers\n\n### A Definition\n\nThe concept of a pointer is one of the most\
    \ important to understand thoroughly to master Linux debugging. By definition,\
    \ a pointer is a memory cell or a processor register that contains the address\
    \ of another memory cell as shown in Picture x64.4.1. It has its own address as\
    \ any memory cell. Sometimes, a pointer is called an indirect address (vs. a direct\
    \ address, the address of a memory cell). Iteratively, we can define another level\
    \ of indirection and introduce a pointer to a pointer as a memory cell or a processor\
    \ register that contains the address of another memory cell that contains the\
    \ address of another memory cell and so on.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_41_0.png)\n\
    Picture x64.4.1\n\n### “Pointers” Project: Memory Layout and Registers\n\nIn our\
    \ debugging project, we have two memory addresses (locations), \"a\" and \"b\"\
    . We can think about \"a\" and \"b\" as names of addresses (locations). We remind\
    \ that notation (a) means contents at the memory address (location) \"a\".\n\n\
    We also have registers %RAX and %RBX as pointers to \"a\" and \"b\". These registers\
    \ contain addresses of \"a\" and \"b\", respectively. The notation (%RAX) means\
    \ the contents of a memory cell whose address is in the register %RAX.\n\nIn C\
    \ and C++ languages, we declare and define pointers to \"a\" and \"b\" as:\n\n\
    ```c\nint *a, *b;\n```\n\nOur project memory layout before program execution is\
    \ shown in Picture x64.4.2. Addresses always occupy 64-bit memory cells or full\
    \ 64-bit registers like %RAX or %RBX (they cannot fit in %EAX or %EBX or a 32-bit\
    \ memory cell).\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_42_0.png)\nPicture\
    \ x64.4.2\n\n### “Pointers” Project: Calculations\n\nIn order to understand pointers\
    \ better from low level assembly language perspective we perform our old arithmetic\
    \ calculations from Chapter x64.1 using pointers to memory instead of direct memory\
    \ addresses:\n\n```\naddress a -> rax\n1 -> (rax)\naddress b -> rbx\n1 -> (rbx)\n\
    (rbx) + (rax) -> (rbx)\n(rax) + 1 -> (rax)\n(rbx) * (rax) -> (rbx)\n```\n\n###\
    \ Using Pointers to Assign Numbers to Memory Cells\n\nFirst, the following sequence\
    \ of pseudo-code instructions means that we interpret the contents of `%RAX` register\
    \ as the address of a memory cell and then assign a value to that memory cell:\n\
    \n```\naddress a -> rax\n1 -> (rax)\n```\n\nIn C and C++ languages, it is called\
    \ \"dereferencing a pointer\" and we write:\n\n```cpp\nint a;\nint *pa = &a; //\
    \ declaration and definition of a pointer\n*pa = 1; // get a memory cell (dereference\
    \ a pointer)\n// and assign a value to it\n```\n\nIn assembly language, we write:\n\
    \n```asm\nlea a, %rax # load the address \"a\" into %rax\nmovl $1, (%rax) # use\
    \ %rax as a pointer\n```\n\nAgain, we use `movl` instead of `mov` because integers\
    \ occupy 32-bit memory cells, and we want to address only a 32-bit memory cell.\
    \ This is how it is on x64 Linux: memory cells to contain integers are half the\
    \ size of memory cells to contain addresses (32-bit vs. 64-bit).\n\nIn GDB disassembly\
    \ output we see something like this:\n\n```\n0x0000000000401000 <0>: lea 0x402000,%rax\n\
    0x0000000000401008 <8>: movl $0x1,(%rax)\n```\n\nThe source code for this chapter\
    \ can be downloaded from:\nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter4/\n\
    \nTo illustrate some instructions and not to be dependent on how the compiler\
    \ translates C/C++ code, we write the program in assembly language. We need to\
    \ compile and link it before loading it into GDB and disassemble its main function\
    \ as described in Chapter x64.2.\n\n```\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ as PointersProject.asm -o PointersProject.o\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ ld PointersProject.o -o PointersProject\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ gdb ./PointersProject\nGNU gdb (Debian 8.2.1-2+b3) 8.2.1\n```"
  mdcn: "\n## GDB 反汇编输出 – 优化\n\n如果我们以优化模式编译并链接程序：\n\n```\ncoredump@DESKTOP-IS6V2L0:~\
    \ /pflddr/x64/Chapter2$ gcc ArithmeticProjectC.cpp -O1 -o ArithmeticProjectC\n\
    ```\n\n在 GDB 中重复相同的步骤后，我们得到以下输出：\n\n```\n(gdb) disass main\nDump of assembler\
    \ code for function main:\n=> 0x0000555555555125 <+0>:\t\tmovl\t$0x2,0x2f01(%rip)\t\
    # 0x555555558030 <a>\n0x000055555555512f <+10>:\t\tmovl\t$0x4,0x2ef3(%rip)\t#\
    \ 0x55555555802c <b>\n0x0000555555555139 <+20>:\t\tmov\t$0x8,%eax\n0x000055555555513e\
    \ <+25>:\t\tretq\nEnd of assembler dump.\n```\n\n这对应于以下伪代码：\n\n```\nmov $2, a\
    \  # 2 -> (a)\nmov $4, b  # 4 -> (b)\n```\n\n请注意，编译器还选择了先放置内存单元 “b” (000055555555802c)，然后是内存单元\
    \ “a” (0000555555558030)。\n\n在这个可执行文件中，我们所有的汇编代码去哪了？如果我们观察，这段代码似乎直接将最终结果放入了 “b”\
    \ 内存单元。为什么会这样？答案在于编译器优化。当代码以优化模式编译时，编译器可以直接从简单的 C/C++ 源代码本身计算出最终结果，并且仅生成更新相应内存位置所需的代码。\n\
    \n## 第 x64.3 章：数字表示法\n\n### 数字及其表示法\n\n想象古代的一位牧羊人试图数他的羊。他有一定数量的石头（十二块）：\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_0.png)\n\
    \n然而，他只能数到三，于是将总数分成每三个一组：\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_33_1.png)\n\
    \n最后一张图就是石头数量的一种表示（一种记法）。我们有一个由三个“三块一组”组成的组，外加一个单独的三块一组。如果他能数到十，我们会看到同一数量石头的另一种表示方式：我们会有一个十块一组的组和另一个两块一组的组。\n\
    \n### 十进制表示法（Bases Ten）\n\n现在让我们看看，如果我们能数到十，十二块石头在算术记号中是如何表示的。我们有一个十个数组成的组加上两个：\n\
    \n$12_{dec} = 1 * 10 + 2$ 或 $1 * 10^1 + 2 * 10^0$\n\n这里有另一个关于一百二十三块石头的练习。我们有 **1**\
    \ 组十乘十的石头，另一组 **2** 组十块的石头，以及最后一组 **3** 块石头：\n\n$123_{dec} = 1 * 10*10 + 2 * 10\
    \ + 3$ 或 $1 * 10^2 + 2 * 10^1 + 3 * 10^0$\n\n我们可以将其形式化为以下求和记号：\n\n$N_{dec} = a_n\
    \ * 10^n + a_{n-1} * 10^{n-1} + ... + a_2 * 10^2 + a_1 * 10^1 + a_0 * 10^0 \\\
    quad 0 \\le a_i \\le 9$\n\n使用求和符号，我们得到这个公式：\n\n$N_{dec} = \\sum_{i=0}^{n} a_i\
    \ * 10^i$\n\n### 三进制表示法（Base Three）\n\n现在我们回到牧羊人的十二块石头示例。我们有 **1** 组三乘三的石头，**1**\
    \ 组三块的石头，以及一个空组 (**0**)（如果我们只有一块石头或有十三块而不是十二块石头，则该组不为空）。我们可以依次写下组数：**110**。因此，110\
    \ 是十二块石头的三进制表示（记法），它等同于用十进制表示的 12：\n\n$12_{dec} = 1*3^2 + 1*3^1 + 0*3^0$\n\n$N_{dec}\
    \ = a_n*3^n + a_{n-1}*3^{n-1} + ... + a_2*3^2 + a_1*3^1 + a_0*3^0 \\quad a_i =\
    \ 0 \\text{ 或 } 1 \\text{ 或 } 2$\n\n$N_{dec} = \\sum_{i=0}^{n} a_i*3^i$\n\n###\
    \ 二进制表示法（Base Two）\n\n在数到 2 的情况下，十二块石头有更多的组：**1100**。因此，1100 是十进制 12 的二进制表示（记法）：\n\
    \n$12_{dec} = 1 * 2^3 + 1 * 2^2 + 0 * 2^1 + 0 * 2^0$\n\n$127_{dec} = 1 * 2^6 +\
    \ 1 * 2^5 + 1 * 2^4 + 1 * 2^3 + 0 * 2^2 + 1 * 2^1 + 1 * 2^0$ 或 $1111011_2$\n\n\
    $N_{dec} = a_n * 2^n + a_{n-1} * 2^{n-1} + ... + a_2 * 2^2 + a_1 * 2^1 + a_0 *\
    \ 2^0 \\quad a_i = 0$ 或 $1$\n\n$N_{dec} = \\sum_{i=0}^{n} a_i * 2^i$\n\n### 十六进制表示法（Base\
    \ Sixteen）\n\n如果我们能数到十六，十二块石头可以放入一个组，但我们需要更多的符号：A, B, C, D, E 和 F 分别代表十, 十一, 十二,\
    \ 十三, 十四和十五：\n\n$12_{dec} = \\text{C}$ 在十六进制表示（记法）中\n\n$123_{dec} = 7B_{hex}$\n\
    \n$123_{dec} = 7 * 16^1 + 11 * 16^0$\n\n$N_{dec} = \\sum_{i=0}^{n} a_i * 16^i$\n\
    \n### 为什么使用十六进制？\n\n考虑这个用二进制记号写的数字：$110001010011_2$。它在十进制记号中的等值是 3155：\n\n$3155_{dec}\
    \ = 1*2^{11} + 1*2^{10} + 0*2^9 + 0*2^8 + 0*2^7 + 1*2^6 + 0*2^5 + 1*2^4 + 0*2^3\
    \ + 0*2^2 + 1*2^1 + 1*2^0$\n\n现在我们将二进制数字分成每四个一组，并用十进制和十六进制记号写下来：\n\n| 1100 | 0101\
    \ | 0011 |\n| :--- | :--- | :--- |\n| $12_{dec}$ | $5_{dec}$ | $3_{dec}$ |\n|\
    \ $\\text{C}_{hex}$ | $5_{hex}$ | $3_{hex}$ |\n\n我们可以看到，十六进制记号更加紧凑，因为每四个二进制数字组对应一个十六进制数。表\
    \ x64.3.1 列出了每四位二进制组合的十六进制等值。\n\n在 GDB 和其他调试器中，内存地址以十六进制记号显示。\n\n| 二进制 | 十进制 |\
    \ 十六进制 |\n| :--- | :--- | :--- |\n| 0000 | 0 | 0 |\n| 0001 | 1 | 1 |\n| 0010 |\
    \ 2 | 2 |\n| 0011 | 3 | 3 |\n| 0100 | 4 | 4 |\n| 0101 | 5 | 5 |\n| 0110 | 6 |\
    \ 6 |\n| 0111 | 7 | 7 |\n| 1000 | 8 | 8 |\n| 1001 | 9 | 9 |\n| 1010 | 10 | A |\n\
    | 1011 | 11 | B |\n| 1100 | 12 | C |\n| 1101 | 13 | D |\n| 1110 | 14 | E |\n|\
    \ 1111 | 15 | F |\n\n表 x64.3.1\n\n## 第 x64.4 章：指针\n\n### 定义\n\n指针的概念是熟练掌握 Linux\
    \ 调试最需要深入理解的概念之一。根据定义，指针是一个内存单元或处理器寄存器，它包含另一个内存单元的地址，如图 x64.4.1 所示。它像任何内存单元一样拥有自己的地址。有时，指针被称为间接地址（与直接地址，即内存单元本身的地址相对）。迭代地，我们可以定义另一层间接层，并引入“指向指针的指针”，即一个包含另一个内存单元地址的内存单元或处理器寄存器，而后者又包含另一个内存单元的地址，依此类推。\n\
    \n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_41_0.png)\n图 x64.4.1\n\n### “指针”项目：内存布局与寄存器\n\
    \n在我们的调试项目中，有两个内存地址（位置），“a” 和 “b”。我们可以将 “a” 和 “b” 视为地址（位置）的名称。提醒一下，记号 (a) 表示内存地址（位置）\
    \ “a” 处的内容。\n\n我们还拥有寄存器 %RAX 和 %RBX 作为指向 “a” 和 “b” 的指针。这些寄存器分别包含 “a” 和 “b” 的地址。记号\
    \ (%RAX) 表示地址在寄存器 %RAX 中的内存单元的内容。\n\n在 C 和 C++ 语言中，我们声明并定义指向 “a” 和 “b” 的指针如下：\n\
    \n```c\nint *a, *b;\n```\n\n程序执行前我们的项目内存布局如图 x64.4.2 所示。地址总是占用 64 位内存单元或完整的 64\
    \ 位寄存器（如 %RAX 或 %RBX），它们不能放入 %EAX 或 %EBX 或 32 位内存单元中。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_42_0.png)\n\
    图 x64.4.2\n\n### “指针”项目：计算\n\n为了从底层汇编语言的角度更好地理解指针，我们使用内存指针而不是直接内存地址，来执行第 x64.1\
    \ 章中的旧算术计算：\n\n```\naddress a -> rax\n1 -> (rax)\naddress b -> rbx\n1 -> (rbx)\n\
    (rbx) + (rax) -> (rbx)\n(rax) + 1 -> (rax)\n(rbx) * (rax) -> (rbx)\n```\n\n###\
    \ 使用指针为内存单元赋值\n\n首先，以下伪代码指令序列意味着我们将 `%RAX` 寄存器的内容解释为一个内存单元的地址，然后将一个值赋给该内存单元：\n\
    \n```\naddress a -> rax\n1 -> (rax)\n```\n\n在 C 和 C++ 语言中，这被称为“解引用指针”，我们写作：\n\n\
    ```cpp\nint a;\nint *pa = &a; // 指针的声明和定义\n*pa = 1; // 获取一个内存单元（解引用指针）\n// 并为其赋值\n\
    ```\n\n在汇编语言中，我们写作：\n\n```asm\nlea a, %rax # 将地址 \"a\" 加载到 %rax\nmovl $1, (%rax)\
    \ # 将 %rax 用作指针\n```\n\n同样，我们使用 `movl` 而不是 `mov`，因为整数占用 32 位内存单元，而我们只想寻址一个 32\
    \ 位内存单元。在 x64 Linux 上就是这样的：包含整数的内存单元大小是包含地址的内存单元的一半（32 位 vs. 64 位）。\n\n在 GDB 反汇编输出中，我们会看到类似这样的内容：\n\
    \n```\n0x0000000000401000 <0>: lea 0x402000,%rax\n0x0000000000401008 <8>: movl\
    \ $0x1,(%rax)\n```\n\n本章的源代码可以从以下地址下载：\nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter4/\n\
    \n为了演示某些指令且不依赖于编译器如何翻译 C/C++ 代码，我们用汇编语言编写程序。在将其加载到 GDB 并按照第 x64.2 章所述反汇编其 main\
    \ 函数之前，我们需要对其进行编译和链接。\n\n```\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ as PointersProject.asm -o PointersProject.o\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ ld PointersProject.o -o PointersProject\ncoredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$\
    \ gdb ./PointersProject\nGNU gdb (Debian 8.2.1-2+b3) 8.2.1\n```\n"
