  md: '# More Pseudo Notation


    We remind that **(a)** means contents of memory at the address **a**, **(rax)**
    means contents of a 32-bit memory cell at the address stored in %RAX register
    (here %RAXRA is a pointer).


    We also introduce an additional notation to employ in this and subsequent chapters:
    **\*(pa)** means contents at the address stored at the address **pa** and is called
    dereferencing a pointer whose address is **pa**. The corresponding C/C++ code
    is similar:


    ```

    ```cpp

    int *pa = &a;


    int b = *pa;

    ```

    ```'
