  md: "# # Conditional Jumps\n\nConsider these two C or C++ code fragments:\n\nCPU\
    \ fetches instructions sequentially, so we must tell the CPU that we want to skip\
    \ some instructions if some condition is (not) met, for example, if a != 0.\n\n\
    JNZ (jump if not zero) and JZ (jump if zero) test the ZF flag and change %RIP\
    \ if the ZF bit is cleared for JZN or set for JZ. The following assembly language\
    \ code is equivalent to C/C++ code above:\n\n```\n```asm\nCMP  $0, A         \
    \ MOV  A, %EAX\nJNZ  label1         TEST %EAX, %EAX\nINC  A              JZ  \
    \ label1\nJMP  label2         INC  %EAX\nlabel1: DEC  A      JMP  label2\nlabel2:\
    \             label1: DEC  %EAX\n                     label2:\n```\n```"
