  md: '# Incrementing Numbers Using Pointers


    In pseudo-code it means increment (decrement) a number stored at the memory location
    which address is stored in %RAX:


    ```

    (rax) + 1 -> (rax)

    ```


    In C or C++ language, we can write this using three possible ways:


    ```

    *a = *a + 1;

    ++(*a);

    (*a)++;

    ```


    In assembly language, we use instruction INC and write:


    ```

    incl (%rax)

    ```


    We use **incl** when we need to specify the 32-bit memory cell to increment.


    In GDB disassembly output, we see the same instruction:


    ```

    incl (%rax)

    ```


    or


    ```

    addl $0x1, (%rax)  # a compiler may decide to use ADD instead of INC

    ```


    Now we add the assembly language translation of increment:


    | C/Pseudo-code | Assembly |

    | :--- | :--- |

    | address a -> rax | lea a, %rax |

    | 1 -> (rax) ; (a) = 1 | movl $1, (%rax) |

    | address b -> rbx | lea b, %rbx |

    | 1 -> (rbx) ; (b) = 1 | movl $1, (%rbx) |

    | (rbx) + (rax) -> (rbx) ; %edx = 1 | mov (%rax), %edx |

    | ; (b) = 2 | add %edx, (%rbx) |

    | (rax) + 1 -> (rax) ; (a) = 2 | incl (%rax) |

    | (rbx) * (rax) -> (rbx) | |'
