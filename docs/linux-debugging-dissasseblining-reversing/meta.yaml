    0x000055555555514e <+9>: callq 0x555555555156 <func2>\n0x0000555555555153 <+14>:\
    \ nop\n0x0000555555555154 <+15>: pop %rbp\n0x0000555555555155 <+16>: retq\n```\n\
    \n汇编转储结束。\n"
