    \ func3 ()\n#1 0x0000555555555164 in func2 ()\n#2 0x0000555555555153 in func ()\n\
    #3 0x000055555555513e in main ()\n```\n\n## Chapter x64.10: Frame Pointer and\
    \ Local Variables\n\n### Stack Usage\n\nIn addition to storage for return addresses\
    \ of CALL instructions, a stack is used to pass additional parameters to functions\
    \ and store local variables. The stack is also used to save and restore values\
    \ held in registers when we want to preserve them during some computation or across\
    \ function calls. For example, suppose we want to do multiplication, but at the\
    \ same time, we have other valuable data in registers %RAX and %RDX. The multiplication\
    \ result will overwrite %RAX and %RDX values, and we temporarily put their values\
    \ on stack:\n\n```assembly\nmov  $10, %rax\nmov  $20, %rdx\n--\n--\n-- ; now we\
    \ want to preserve %RAX and %RDX\n\npush %rax\npush %rdx\nimul %rdx ; %RDX and\
    \ %RAX contain the result of %RAX*%RDX\nmov  %rax, result\n\npop  %rdx ; pop in\
    \ reverse order\npop  %rax ; stack is LIFO\n```\n\n### Register Review\n\nSo far,\
    \ we have encountered these general-purpose registers:\n\n- %RAX (among its specific\
    \ uses are to contain function return values and the lower part of a multiplication\
    \ result)\n- %RBX\n- %RCX (among its specific uses is a loop counter)\n- %RDX\
    \ (among its specific uses is to contain the higher part of a multiplication result\
    \ if it exceeds the maximum 64-bit value)\n- %RIP (Instruction Pointer, points\
    \ to the next instruction to be executed)\n- %RSP (Stack Pointer, points to the\
    \ top of the stack)\n\nWe come to the next important register on Linux platforms\
    \ called Base Pointer register or sometimes as Stack Frame Pointer register %RBP.\n\
    \n### Addressing Array Elements\n\nWe can also consider stack memory as an array\
    \ of memory cells, and often %RBP register is used to address stack memory elements\
    \ in the way shown in Picture x64.10.1 where it slides into the frame of stack\
    \ memory called a stack frame. The first diagram depicts 64-bit (quadword) memory\
    \ cells, and the second depicts 32-bit (doubleword) memory cells.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_129_0.png)\n\
    \n### Stack Structure (No Function Parameters)\n\nSuppose the following function\
    \ is called:\n\n```c\nvoid func()\n{\n    int var1, var2;\n    // body code\n\
    \    // ...\n}\n```\n\nBefore the function body code is executed, the following\
    \ pointers are set up:\n\n- (%RBP) contains previous %RBP value\n- -0x4(%RBP)\
    \ contains local variable var1 (doubleword)\n- -0x8(%RBP) contains local variable\
    \ var2 (doubleword)\n\nIt is illustrated in Picture x64.10.2.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_130_0.png)\n\
    \nPicture x64.10.2\n\n### Function Prolog\n\nThe sequence of instructions resulting\
    \ in the initialization of %RBP register and making room for local variables is\
    \ called function prolog. One example of it is Picture x64.10.3, where func calls\
    \ func2, which has one local variable var. Sometimes saving necessary registers\
    \ is also considered as part of a function prolog.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_131_0.png)\n\
    \nPicture x64.10.3\n\n### Raw Stack (No Local Variables and Function Parameters)\n\
    \nNow we can understand additional data (the previous %RBP that was equal to the\
    \ previous %RSP before the function call) that appear on the raw stack together\
    \ with function return addresses that we saw in Chapter x64.9 project \"SimpleStack\"\
    :\n\n```\n(gdb) info registers $rsp $rbp\nrsp\t\t0x7ffffffe500\t0x7ffffffe500\n\
    rbp\t\t0x7ffffffe500\t0x7ffffffe500\n```\n\n```\n(gdb) x/10a $rsp\n0x7ffffffe500:\
    \ 0x7ffffffe510 0x55555555164 <func2+14>\n0x7ffffffe510: 0x7ffffffe520 0x55555555153\
    \ <func+14>\n0x7ffffffe520: 0x7ffffffe540 0x5555555513e <main+25>\n0x7ffffffe530:\
    \ 0x7ffffffe628 0x10000000000\n0x7ffffffe540: 0x55555555170 < __libc_csu_init>\
    \ 0x7ffff7e2c09b\n< __libc_start_main+235>\n```\n\n```\n(gdb) disass func2\n```\n\
    \nDump of assembler code for function func2:\n\n```\n0x0000555555555156 <+0>:\
    \ push %rbp\n0x0000555555555157 <+1>: mov %rsp,%rbp\n0x000055555555515a <+4>:\
    \ mov $0x0,%eax\n0x000055555555515f <+9>: callq 0x555555555167 <func3>\n0x0000555555555164\
    \ <+14>: nop\n0x0000555555555165 <+15>: pop %rbp\n0x0000555555555166 <+16>: retq\n\
    ```\n\nEnd of assembler dump.\n\n```\n(gdb) disass func\n```\n\nDump of assembler\
    \ code for function func:\n\n```\n0x0000555555555145 <+0>: push %rbp\n0x0000555555555146\
    \ <+1>: mov %rsp,%rbp\n0x0000555555555149 <+4>: mov $0x0,%eax\n0x000055555555514e\
    \ <+9>: callq 0x555555555156 <func2>\n0x0000555555555153 <+14>: nop\n0x0000555555555154\
    \ <+15>: pop %rbp\n0x0000555555555155 <+16>: retq\n```\n\nEnd of assembler dump."
