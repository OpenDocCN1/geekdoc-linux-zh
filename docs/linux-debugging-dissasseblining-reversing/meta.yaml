- md: "After the execution of INC instruction, we have the memory layout illustrated\
    \ in Picture x64.4.5.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_55_0.png)\n\n\
    Picture x64.4.5\n\n## Multiplying Numbers Using Pointers\n\nOur next pseudo-code\
    \ statement does multiplication:\n\n```\n`(rbx) * (rax) -> (rbx)`\n```\n\nThis\
    \ statement means that we multiply the contents of the memory cell whose address\
    \ is stored in the `%RBX` register by the value stored in the memory cell whose\
    \ address is in the `%RAX` register. In C or C++ language, we write a similar\
    \ expression as the addition statement we have seen in the previous sections (note\
    \ that we have two distinct meanings of `*` operator: pointer dereference and\
    \ multiplication):\n\n```cpp\n*pb = *pb * *pa;\n*pb *= *pa;\n```\n\nThe latter\
    \ is a shorthand notation. In assembly language, we use instruction IMUL (Integer\
    \ MULtipli):\n\n```asm\nmov (%rax), %eax\nimul (%rbx), %eax\nmov %eax, (%rbx)\n\
    ```\n\nSince `imul` instruction cannot reference two memory locations we need\
    \ to put the contents of one location into a register. We reuse `%RAX` since we\
    \ do not need its current value after that. This instruction is equivalent to\
    \ the following pseudo-code:\n\n```\n(rax) -> rax\n(rbx) * rax -> rax\nrax ->\
    \ (rbx)\n```\n\nIn GDB disassembly output we see this:\n\n```asm\n0x000000000000401022\
    \ <+34>: mov (%rax),%eax\n0x000000000000401024 <+36>: imul (%rbx),%eax\n0x000000000000401027\
    \ <+39>: mov %eax, (%rbx)\n```\n\nWe add instructions to our pseudo-code table:\n\
    \n| pseudo-code | assembly |\n| :--- | :--- |\n| address a -> rax | lea a, %rax\
    \ |\n| 1 -> (rax) ; (a) = 1 | movl $1, (%rax) |\n| address b -> rbx | lea b, %rbx\
    \ |\n| 1 -> (rbx) ; (b) = 1 | movl $1, (%rbx) |\n| (rbx) + (rax) -> (rbx) ; %edx\
    \ = 1 | mov (%rax), %edx |\n| ; (b) = 2 | add %edx, (%rbx) |\n| (rax) + 1 -> (rax)\
    \ ; (a) = 2 | incl (%rax) |\n| (rbx) * (rax) -> (rbx) ; %eax = 2 | mov (%rax),\
    \ %eax |\n| ; %eax = 4 | imul (%rbx), %eax |\n| ; (b) = 4 | mov %eax, (%rbx) |\n\
    \nNow we execute these three instructions (we remind that the output of **si**\
    \ command shows the next instruction to be executed when we use **si** command\
    \ again):\n\n```\n[From the previous output]\n1: x/i $rip\n=> 0x401022 <_start+34>:\
    \ mov (%rax),%eax\n2: /x $rax = 0x402000\n3: /x $rbx = 0x402004\n4: /x (int)a\
    \ = 0x2\n5: /x (int)b = 0x2\n\n(gdb) si\n0x0000000000401024 in _start ()\n1: x/i\
    \ $rip\n=> 0x401024 <_start+36>: imul (%rbx),%eax\n2: /x $rax = 0x2\n3: /x $rbx\
    \ = 0x402004\n4: /x (int)a = 0x2\n5: /x (int)b = 0x2\n\n(gdb) si\n0x000000000000401027\
    \ in _start ()\n1: x/i $rip\n=> 0x401027 <_start+39>:    mov    %eax,(%rbx)\n\
    2: /x $rax = 0x4\n3: /x $rbx = 0x402004\n4: /x (int)a = 0x2\n5: /x (int)b = 0x2\n\
    \n(gdb) si\n0x000000000000401029 in _start ()\n1: x/i $rip\n=> 0x401029 <_start+41>:\
    \    mov    $0x3c,%rax\n2: /x $rax = 0x4\n3: /x $rbx = 0x02004\n4: /x (int)a =\
    \ 0x2\n5: /x (int)b = 0x4\n```\n\nAll this corresponds to a memory layout shown\
    \ in Picture x64.4.6.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_59_0.png)\n\n\
    Picture x64.4.6\n\n## Chapter x64.5: Bytes, Words, Double, and Quad Words\n\n\
    ### Using Hexadecimal Numbers\n\nIf we want to use hexadecimal numbers in C/C++\
    \ language, we prefix them with `0x`, for example:\n\n```cpp\na = 12;    // 12dec\n\
    a = 0xC;    // Chex\n```\n\nIn GDB disassembly output, and when entering commands,\
    \ numbers are interpreted as decimals by default. If we want a number to be interpreted\
    \ as hexadecimal, we prefix it with `0x`, for example:\n\n```asm\nmov 12, a\n\
    mov 0xC, a\n```\n\n### Byte Granularity\n\nPicture x64.5.1 shows the difference\
    \ between bytes, words, doublewords, and quadwords in terms of byte granularity.\
    \ We see that each successive size is double the previous.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_62_0.png)\n\
    \nPicture x64.5.1\n\n### Bit Granularity\n\nEvery byte consists of 8 bits. Every\
    \ bit has a value of 0 or 1. Here are some examples of bytes, words, doublewords\
    \ and quadwords shown as bit strings (we can also clearly see the correspondence\
    \ between 4-bit sequences and hexadecimal numbers, Table x64.3.1):\n\n- Byte\n\
    \    - C / C++: unsigned char\n    - 8 bits\n    - Values $0_{\\text{dec}} - 255_{\\\
    text{dec}}$ or $0_{\\text{hex}} - \\text{FF}_{\\text{hex}}$\n    - Example: $12_{\\\
    text{dec}}$ $00001100_{\\text{bin}}$ $0\\text{C}_{\\text{hex}}$\n- Word\n    -\
    \ C / C++: unsigned short\n    - 16 bits\n    - Values $0_{\\text{dec}} - 65535_{\\\
    text{dec}}$ or $0_{\\text{hex}} - \\text{FFFF}_{\\text{hex}}$\n    - Example:\
    \ $0000000000001100_{\\text{bin}}$ $000\\text{C}_{\\text{hex}}$\n- Doubleword\n\
    \    - C / C++: unsigned int, unsigned\n    - 32 bits\n    - Values $0_{\\text{dec}}\
    \ - 4294967295_{\\text{dec}}$ or $0_{\\text{hex}} - \\text{FFFFFFFF}_{\\text{hex}}$\n\
    \    - Example: $00000000000000000000000000001100_{\\text{bin}}$ $0000000\\text{C}_{\\\
    text{hex}}$\n- Quadword\n    - C / C++: long, unsigned long long\n    - 64 bits\n\
    \    - Values $0_{\\text{dec}} - 18446744073709551615_{\\text{dec}}$ or $0_{\\\
    text{hex}} - \\text{FFFFFFFFFFFFFFFF}_{\\text{hex}}$\n    - Example: $000000000000000000000000000000000000000000000000000000001100_{\\\
    text{bin}}$ $000000000000000\\text{C}_{\\text{hex}}$\n\n### Memory Layout\n\n\
    The minimum addressable element of memory is a byte. The maximum addressable element\
    \ is a doubleword on 32-bit machines and a quadword on 64-bit machines. All general\
    \ registers are 32-bit on 32-bit CPUs and can contain doubleword values. On 64-bit\
    \ CPUs, all general registers are 64-bit and can contain quadword values. Picture\
    \ x64.5.2 shows a typical memory layout, and Picture x64.5.3 shows the byte layout\
    \ of some general CPU registers.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_64_0.png)\n\
    \nPicture x64.5.2\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_65_0.png)\n\nPicture\
    \ x64.5.3\n\nRemember that memory addresses are always 64-bit, and memory addresses\
    \ to 32-bit memory cells like integers are also 64-bit.\n\n## Chapter x64.6: Pointers\
    \ to Memory\n\n### Pointers Revisited\n\nThe pointer is a memory cell or a register\
    \ that contains the address of another memory cell. Memory pointers have their\
    \ own addresses because they are memory cells too. On 32-bit Linux, pointers are\
    \ 32-bit, and on 64-bit Linux, pointers are 64-bit.\n\n### Addressing Types\n\n\
    As we have seen in Chapter x64.5, memory cells can be of one byte, word, doubleword,\
    \ or quadword sizes. Therefore, we can have a pointer to a byte, a pointer to\
    \ a word, a pointer to a doubleword, and a pointer to a quadword. GDB disassembly\
    \ output in Chapter x64.4 has suffixes in instructions involving pointers to memory\
    \ that hold 32-bit (doubleword size) values.\n\nHere are some illustrated examples:\n\
    \n```asm\nmovb $0xFF, (%rax)\n```\n\nThe layout of memory before `movb` instruction\
    \ execution is shown in Picture x64.6.1, and the layout of memory after execution\
    \ is shown in Picture x64.6.2.\n\n```asm\nmovw $0xFF, (%rax)\nmovl $0xFF, (%rax)\n\
    movq $0xFF, (%rax)\n```\n\nWe need to prefix 0xFF with `$` to differentiate it\
    \ from 0xFF as a memory address.\n\nThe layout of memory after the execution of\
    \ `movl` instruction is shown in Picture x64.6.3. We can see that, although we\
    \ specify just a byte value 0xFF as a source operand to `movl` instruction, it\
    \ replaces all other 3 bytes of a doubleword in memory because we specify the\
    \ destination as a pointer to 4 bytes and, 0xFF is 0x000000FF as a doubleword.\
    \ So we need to specify `l` suffix to disambiguate moving a doubleword value from\
    \ moving a byte value. The compiler complains if we forget and use `mov`:\n\n\
    ```\nError: no instruction mnemonic suffix given and no register operands; can't\
    \ size instruction\n```\n\nBecause 64-bit (quadword) registers may point to quadword\
    \ memory cells, we need to specify `q` to disambiguate moving a quadword value\
    \ from moving a byte value even if we specify a constant with all leading zeros:\n\
    \n```asm\nmovq $0x00000000000000FF, (%rax)\n```\n\nHowever, if we want to move\
    \ a word value only, we need to specify the `w` suffix:\n\n```asm\nmovw $0xFF,\
    \ (%rax)\n```\n\nThis is equivalent to:\n\n```asm\nmovw $0x00FF, (%rax)\n```\n\
    \nPicture x64.6.4 shows a summary of various addressing modes."
  mdcn: "\n在执行 INC 指令后，内存布局如图 x64.4.5 所示。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_55_0.png)\n\
    \n图 x64.4.5\n\n## 使用指针进行数字乘法\n\n我们的下一个伪代码语句执行乘法：\n\n```\n`(rbx) * (rax) -> (rbx)`\n\
    ```\n\n这条语句的意思是将存储在 `%RBX` 寄存器中的地址所指向的内存单元的内容，与存储在 `%RAX` 寄存器中的地址所指向的内存单元中的值相乘。在\
    \ C 或 C++ 语言中，我们可以写一个与前几节看到的加法语句类似的表达式（注意 `*` 运算符有两个不同的含义：指针解引用和乘法）：\n\n```cpp\n\
    *pb = *pb * *pa;\n*pb *= *pa;\n```\n\n后者是缩写形式。在汇编语言中，我们使用 IMUL（Integer MULtipli，整数乘法）指令：\n\
    \n```asm\nmov (%rax), %eax\nimul (%rbx), %eax\nmov %eax, (%rbx)\n```\n\n由于 `imul`\
