    \ -> edx\n                     # (a) + (b) -> edx\n\nmov  -0x10(%rbp),%rax # address\
    \ b -> rax\nmov  %edx,(%rax)     # edx -> (b)\n                     # (a) + (b)\
    \ -> (b)\n\naddl $0x1,-0x4(%rbp) # 1 + (a) -> (a)\nmov  -0x10(%rbp),%rax # address\
    \ b -> rax\nmov  (%rax),%eax     # (b) -> eax\nimul -0x4(%rbp),%eax # (a) * (b)\
    \ -> eax\nmov  %eax,%edx       # eax -> edx\nmov  -0x10(%rbp),%rax # address b\
    \ -> rax\nmov  %edx,(%rax)     # edx -> (b)\n                     # (a) * (b)\
    \ -> (b)\n\nmov  $0x1,%eax       # 1 -> eax (return value)\n```\n```\n\n0x00005555555551f8\
