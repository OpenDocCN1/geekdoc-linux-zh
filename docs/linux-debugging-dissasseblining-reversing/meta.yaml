    Picture x64.6.6\n\n## Chapter x64.7: Logical Instructions and RIP\n\n### Instruction\
    \ Format\n\nWe have seen that assembly language instructions have uniform format:\n\
    \nOperands can be registers (reg), memory references (mem), or some numbers, called\
    \ immediate values (imm). Typical notational examples:\n\n```\ninc mem/reg\ndec\
    \ mem/reg\nadd reg/imm, mem/reg\nadd mem/imm, reg\n```\n\nand some concrete assembly\
    \ language examples:\n\n```\ninc (%rax)\ndecl a\naddl $0x10, (%rax)\naddq a, (%rax)\n\
    ```\n\n### Logical Shift Instructions\n\nIn addition to arithmetic instructions,\
    \ there are so-called logical shift instructions that just shift a bit string\
    \ to the left or the right.\n\nShift to the left:\n```\n11111111 -> 11111110 ;\
    \ shift by 1\n11111110 -> 11110000 ; shift by 3\nshl imm/reg, mem/reg\nshl $1,\
    \ %rax\nshlb $2, (%rax)\n```\n\nShift to the right:\n```\n11111111 -> 01111111\
    \ ; shift by 1\n01111111 -> 00001111 ; shift by 3\nshr imm/reg, mem/reg\nshr $1,\
    \ %rax\nshrb $2, (%rax)\n```\n\n### Logical Operations\n\nHere we recall logical\
    \ operations and corresponding truth tables. We abbreviate True as T and False\
    \ as F.\n\n**AND**\n- 1 and 1 = 1 (T and T = T)\n- 1 and 0 = 0 (T and F = F)\n\
    - 0 and 1 = 0 (F and T = F)\n- 0 and 0 = 0 (F and F = F)\n\n**OR**\n- 1 or 1 =\
    \ 1 (T or T = T)\n- 1 or 0 = 1 (T or F = T)\n- 0 or 1 = 1 (F or T = T)\n- 0 or\
    \ 0 = 0 (F or F = F)\n\n### Zeroing Memory or Registers\n\nThere are several ways\
    \ to put a zero value into a register or a memory location:\n\n- 1. Move a value:\n\
    ```assembly\nmov $0, a\nmov $0, %rax\nmov $0, %eax\n```\n\n- 2. Use XOR (Exclusive\
    \ OR) logical operation:\n```assembly\nxor %rax, %rax\nxor %eax, %eax\n```\n\n\
    **XOR Truth Table**\n\n| Input A | Input B | Result | Logical |\n| :--- | :---\
    \ | :--- | :--- |\n| 1 | 1 | 0 | T xor T = F |\n| 1 | 0 | 1 | T xor F = T |\n\
