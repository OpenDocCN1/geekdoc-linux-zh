    Many functions return values via %RAX register. For example:


    ```

    ```cpp

    long func();

    ```

    ```


    Return value is in %RAX.


    ```

    ```cpp

    bool func();

    ```

    ```


    The return value is in %EAX.


    Although bool values occupy one byte in memory, the compiler may use %EAX instead
    of %AL.'
