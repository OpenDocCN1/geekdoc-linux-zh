  md: '# Multiplying Numbers


    In pseudo-code, we write:


    ```

    (b) * (a) -> (b)

    ```


    It means that we multiply the number at the location (address) “b” by the number
    at the location (address) “a”.


    In C or C++ language we can write that using two ways:


    ```

    b = b * a;


    b *= a;

    ```


    In assembly language, we use instruction IMUL (Integer MULtiply) and write:


    ```

    mov a, %eax

    imul b, %eax

    mov %eax, b

    ```


    The multiplication instruction means (b) * %eax -> %eax, and we must put the contents
    of “a” into %EAX. The multiplication result is put into the register %EAX, and
    its contents are saved at the location (address) “b”. Alternatively, we may put
    all multiplication operands into registers:


    ```

    mov a, %eax

    mov b, %edx

    imul %edx, %eax

    mov %eax, b

    ```


    In GDB disassembly output we may see the following code:


    ```

    mov 0x2ec3(%rip),%edx    # 0x55555558030 <b>

    mov 0x2eb9(%rip),%eax    # 0x5555555802c <a>

    imul %edx,%eax

    mov %eax,0x2eb4(%rip)    # 0x55555558030 <b>

    ```'
