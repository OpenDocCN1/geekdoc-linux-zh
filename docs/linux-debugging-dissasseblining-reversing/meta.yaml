    \ it looks simple and means increment (decrement) a number stored at the location\
    \ (address) \"a\":\n\n```\n(a) + 1 -> (a)\n(a) - 1 -> (a)\n```\n\nIn C or C++\
    \ language we can write this using three possible ways:\n\n```\na = a + 1;\n\n\
    ++a;\n\na++;\n\nb = b - 1;\n\n--b;\n\nb--;\n```\n\nIn assembly language, we use\
    \ instructions INC and DEC, and write:\n\n```\nincl\t a\ninc\t %eax\ndecl\t a\n\
    dec\t %eax\n```\n\nWe use **incl** when we need to specify the 32-bit memory cell.\
