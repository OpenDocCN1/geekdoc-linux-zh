    0x00007ffff7ef24e7 <+151>: jmp    0x7ffff7ef249c <_GI__libc_read+76>\n```\nEnd\
    \ of assembler dump.\n\n## Application Memory Simplified\n\nWhen an executable\
    \ file is loaded into memory, its header and sections are mapped to memory pages.\
    \ Some data and code are copied unmodified, but some data is initialized and expanded.\
    \ The first stack is also created at this stage. %RIP register is set to point\
    \ to the first program instruction, and %RSP points to the top of the stack. This\
    \ simplified process is shown in Picture x64.9.4.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_115_0.png)\n\
    \nPicture x64.9.4\n\n## Stack Overflow\n\nBy default, the stack size is limited\
    \ (system and limits dependent, and on our system, it is 8192Kb or 8388608 bytes).\
    \ If a stack grows beyond the reserved limit, a stack overflow occurs (segmentation\
    \ fault). It can be caused by an unlimited recursion, deep recursion, or very\
    \ large local variables:\n\n```c\nint func()\n{\n    func();\n    return 0;\n\
    }\n\nint func2()\n{\n    int array[10000000] = { 1 };\n    printf(\"%d\", array[10000000-1]);\n\
    }\n```\n\n## Jumps\n\nAnother instruction we need to know and understand before\
    \ we look deeper into C/C++ functions is called JMP (Jump). Picture x64.9.5 shows\
    \ instructions in memory and corresponding values of %RIP register.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_117_0.png)\n\
    \nPicture x64.9.5\n\nWe see that JMP instruction changes %RIP to point to another\
    \ memory address, and the program execution continues from that location. The\
    \ code shown in Picture x64.9.5 loops indefinitely: this can be considered a hang\
    \ and CPU spike.\n\nHere is a pseudo-code for absolute JMP instructions adopted\
    \ from Intel manuals and some examples:\n\n```\n; Format and arguments:\n\nJMP\
    \ r/mem64\n\n; Pseudo-code:\n\nDEST -> RIP ; new destination address for execution\n\
    \n; Examples:\n\nJMP 0x5555555558020\n\nJMP *%RAX\n```\n\nThe jump is called absolute\
    \ because we specify full memory addresses and not a relative +/- number to the\
    \ current %RIP value. The latter jump is called relative. *%RAX means an indirect\
    \ jump to the address located in the %RAX register. It is illustrated in Picture\
    \ x64.9.6.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_118_0.png)\n\nPicture x64.9.6\n\
    \n## Calls\n\nWe discuss two essential instructions that make the implementation\
    \ of C and C++ function calls. They are called CALL and RET. Picture x64.9.7 shows\
    \ instructions in memory and corresponding values of %RIP and %RSP registers.\n\
    \n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_119_0.png)\n\nPicture x64.9.7\n\nWe\
    \ see that CALL instruction pushes the current value of %RIP to the stack and\
    \ changes %RIP to point to another memory address. Then the program execution\
    \ continues from the new location. RET instruction pops the saved %RIP value from\
    \ the stack to the %RIP register. Then the program execution resumes at the memory\
    \ location after the CALL instruction.\n\nHere is a pseudo-code for CALL instructions\
    \ and some examples adopted from Intel manuals:\n\n```\n; Format and arguments:\n\
    \nCALL r/mem64\n\n; Pseudo-code:\n\nPUSH RIP\n\nDEST -> RIP\n\n; Examples:\n\n\
    CALL 0x555555558020\n\nCALL *%RAX\n```\n\nHere is a pseudo-code for RET instruction\
    \ adopted from Intel manuals:\n\n```\n; Format:\n\nRET\n\n; Pseudo-code:\n\nPOP()\
    \ -> RIP\n```\n\n## Call Stack\n\nIf one function (the caller) calls another function\
    \ (the callee) in C and C++, the resulting code is implemented using CALL instruction,\
    \ and during its execution, the return address is saved on the stack. If the callee\
    \ calls another function, the return address is also saved on the stack, and so\
    \ on. Therefore, we have the so-called call stack of return addresses. Let us\
    \ see this with a simple but a trimmed-down example.\n\nSuppose we have 3 functions\
    \ with their code occupying the following addresses:\n\n| Function | Address Range\
    \ |\n| :--- | :--- |\n| func | 0000001400010000 - 000000140001100 |\n| func2 |\
    \ 0000001400011101 - 000000140001200 |\n| func3 | 000000140001201 - 000000140001300\
    \ |\n\nWe also have the following code where *func* calls *func2*, and *func2*\
    \ calls *func3*:\n\n```cpp\nvoid func()\n{\n    func2();\n}\nvoid func2()\n{\n\
    \    func3();\n}\n```\n\nWhen *func* calls *func2*, the caller's return address\
    \ is pushed to the stack, and %RSP points to some value in the 0000001400010000\
    \ - 000000140001100 range, say 000000140001020. When *func2* calls *func3*, the\
    \ caller's return address is also pushed to the stack, and %RSP points to some\
    \ value in 0000001400011101 - 000000140001200 range, say 000000140001180. If we\
    \ interrupt *func3* with a debugger and inspect %RIP, we would find its value\
    \ in the range of 000000140001201 - 000000140001300, say 000000140001250. Therefore,\
    \ we have the following memory and register layout shown in Picture x64.9.8 (the\
    \ usual function prolog is not shown: we learn about it in the next chapter)."
  mdcn: "\n## PUSH 指令\n\n我们可以将存储在寄存器中的值、存储在内存地址中的值或常量（立即数操作数）压入栈中：\n\n**PUSH r/mem/imm**\n\
    \n以下是参考 Intel 手册简化的 PUSH 伪代码：\n\n```\nIF OperandSize = 64\n    THEN\n        %RSP\
    \ - 8 -> %RSP\n        OperandValue -> (%RSP) ; quadword\n    ELSE\n        %RSP\
    \ - 2 -> %RSP\n        OperandValue -> (%RSP) ; word\nFI\n```\n\n示例：\n\n```\n\
    push %rax\npushw (%rbx)\npush $0\n```\n\n## POP 指令\n\n我们可以将存储在栈顶的值弹出到寄存器或内存地址中：\n\
    \n```\nPOP r/mem\n```\n\n以下是参考 Intel 手册简化的 POP 伪代码：\n\n```\nIF OperandSize = 64\n\
    \    THEN\n        (%RSP) -> OperandValue ; quadword\n        %RSP + 8 -> %RSP\n\
    \    ELSE\n        (%RSP) -> OperandValue ; word\n        %RSP + 2 -> %RSP\nFI\n\
    ```\n\n示例：\n\n```\npop %rax\npopw (%rbx)\n```\n\n## 寄存器回顾\n\n到目前为止，我们已经看到并使用了通用\
