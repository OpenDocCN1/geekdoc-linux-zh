  - "[PAGE 153]\n\n# TEST - Logical Compare\n\nThis instruction computes bit-wise\
    \ logical AND between both operands and sets flags (including ZF) according to\
    \ the computed result (which is discarded):\n\n```\nTEST reg/imm, reg/mem\n```\n\
    \nExamples:\n\n```\nTEST %EDX, %EDX\n```\n\nSuppose %EDX register contains 4 ($100_{bin}$)\n\
    \n```\n100_{bin} AND 100_{bin} = 100_{bin}  != 0 (ZF is cleared)\n```\n\n```\n\
    TEST $1, %EDX\n```\n\nSuppose %EDX contains 0 ($0_{bin}$)\n\n```\n0_{bin} AND\
    \ 1_{bin} = 0_{bin}  == 0 (ZF is set)\n```\n\nHere is TEST instruction in pseudo-code\
    \ (details not relevant to ZF bit are omitted):\n\n```\nTEMP := OPERAND1 AND OPERAND2\n\
    IF TEMP = 0 THEN\n    1 -> ZF\nELSE\n    0 -> ZF\n```"
  - "[PAGE 154]\n\n# CMP – Compare Two Operands\n\nThis instruction compares the first\
    \ operand with the second and sets flags (including ZF) according to the computed\
    \ result (which is discarded). The comparison is performed by subtracting the\
    \ first operand from the second (like SUB instruction: sub $4, %eax).\n\n```\n\
    CMP reg/imm, reg/mem\nCMP reg/mem/imm, reg\n```\n\nExamples:\n\n```\nCMP $0, %EDI\n\
    ```\n\nSuppose %EDI contains 0\n\n0 - 0 == 0 (ZF is set)\n\n```\nCMP $0x16, %EAX\n\
    ```\n\nSuppose %EAX contains 4hex\n\n4hex - 16hex = FFFFFFEEhex != 0 (ZF is cleared)\n\
    4dec - 22dec = -18dec\n\nHere is CMP instruction in pseudo-code (details not relevant\
    \ to ZF bit are omitted):\n\n```\nOPERAND2 - OPERAND1 -> TEMP\nIF TEMP = 0 THEN\n\
    \    1 -> ZF\nELSE\n    0 -> ZF\n```\n\nCMP instruction is equivalent to this\
    \ pseudo-code sequence:\n\n```\nOPERAND2 -> TEMP\nSUB OPERAND1, TEMP\n```"
  - '[PAGE 155]


    # TEST or CMP?


    Both instructions are equivalent if we want to test for zero, but CMP instruction
    affects more flags than TEST:


    ```

    TEST %EAX, %EAX

    CMP $0, %EAX

    ```


    CMP instruction is used to compare for inequality (TEST instruction cannot be
    used here):


    ```

    CMP $0, %EAX  # > 0 or < 0 ?

    ```


    TEST instruction is used to see if individual bits are set:


    ```

    TEST $2, %EAX  # 2 == 0010bin or in C language: if (var & 0x2)

    ```


    Examples where %EAX has the value of 2:


    ```

    TEST $2, %EAX  # 0010bin AND 0100bin = 0000bin (ZF is set)

    TEST $6, %EAX  # 0010bin AND 0110bin = 0010bin (ZF is cleared)

    ```'
  - "[PAGE 156]\n\n# # Conditional Jumps\n\nConsider these two C or C++ code fragments:\n\
    \nCPU fetches instructions sequentially, so we must tell the CPU that we want\
    \ to skip some instructions if some condition is (not) met, for example, if a\
    \ != 0.\n\nJNZ (jump if not zero) and JZ (jump if zero) test the ZF flag and change\
    \ %RIP if the ZF bit is cleared for JZN or set for JZ. The following assembly\
    \ language code is equivalent to C/C++ code above:\n\n```\n```asm\nCMP  $0, A\
    \          MOV  A, %EAX\nJNZ  label1         TEST %EAX, %EAX\nINC  A         \
    \     JZ   label1\nJMP  label2         INC  %EAX\nlabel1: DEC  A      JMP  label2\n\
    label2:             label1: DEC  %EAX\n                     label2:\n```\n```"
