    # Function Epilog


    Before the function code returns to the caller, it must restore the previous values
    of %RSP and %RBP registers to allow the caller to resume its execution from the
    correct address, previously saved on the stack, and to continue addressing its
    own stack frame properly. This sequence of instructions is called function epilog,
    and it is shown in Picture x64.10.4.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_134_0.png)


    Picture x64.10.4


    Instead of `mov %rbp,%rsp` and `pop %rbp` sequence of instructions, we may see
    `leave` instruction, which does the same but occupies less code space.'
