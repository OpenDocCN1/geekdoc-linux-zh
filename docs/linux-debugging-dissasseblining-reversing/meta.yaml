- md: '## Chapter x64.1: Memory, Registers, and Simple Arithmetic


    ### Memory and Registers inside an Idealized Computer


    Computer memory consists of a sequence of memory cells, and each cell has a unique
    address (location). Every cell contains a "number". We refer to these "numbers"
    as contents at addresses (locations). Because memory access is slower than arithmetic
    instructions, there are so-called registers to speed up complex operations that
    require memory to store temporary results. We can also think about them as standalone
    memory cells. The name of a register is its address.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_11_0.png)

    Picture x64.1.1


    ### Memory and Registers inside Intel 64-bit PC


    Here addresses for memory locations containing integer values usually differ by
    4 or 8, and we also show 2 registers called %RAX and %RDX. The first halves of
    them are called %EAX and %EDX.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_12_0.png)

    Picture x64.1.2


    Because memory cells contain “numbers”, we start with simple arithmetic and ask
    a PC to compute the sum of two numbers to see how memory and registers change
    their values.


    ### “Arithmetic” Project: Memory Layout and Registers


    For our project, we have two memory addresses (locations) that we call “a” and
    “b”. We can think about “a” and “b” as names of their respective addresses (locations).
    Now we introduce a special notation where (a) means contents at the memory address
    (location) “a”. If we use C or C++ language to write our project, we declare and
    define memory locations “a” and “b” as:


    ```

    static int a, b;

    ```


    By default, when we load a program, static memory locations are filled with zeroes,
    and we can depict our initial memory layout after loading the program, as shown
    in Picture x64.1.3.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_13_0.png)

    Picture x64.1.3


    ### “Arithmetic” Project: A Computer Program


    We can think of a computer program as a sequence of instructions for manipulation
    of contents of memory cells and registers. For example, addition operation: add
    the contents of memory cell N₾12 to the contents of memory cell N₾14. In our pseudo-code,
    we can write:


    (14) + (12) -> (14)


    Our first program in pseudo-code is shown on the left of the table:


    | Pseudo-code | Assembly Instructions |

    | :--- | :--- |

    | 1 -> (a) <br> 1 -> (b) <br> (b) + (a) -> (b) <br> (a) + 1 -> (a) <br> (b) *
    (a) -> (b) | Here we put assembly instructions corresponding to pseudo-code. |


    ''->'' means moving (assigning) the new value to the contents of a memory location
    (address). '';'' is a comment sign, and the rest of the line is a comment. ''=''
    shows the current value at a memory location (address).


    To remind, a code written in a high-level programming language is translated to
    a machine language by a compiler. However, the machine language can be readable
    if its digital codes are represented in some mnemonic system called assembly language.
    For example, INC a is increment by one of what is stored at a memory location
    “a”.


    ### “Arithmetic” Project: Assigning Numbers to Memory Locations


    We remind that “a” means location (address) of the memory cell, and it is also
    the name of the location (address) 000055555555802c (see Picture x64.1.3). (a)
    means the contents (number) stored at the address “a”.


    If we use C or C++ language, “a” is called "the variable a", and we write the
    assignment as:


    ```

    a = 1 ;

    ```


    In Intel assembly language, we write:


    ```

    mov $1, a

    ```


    In GDB disassembly output we see the following code where the variable “a” and
    address are shown in comments:


    ```

    movl $0x1,0x2ef2(%rip) # 0x55555555802c <a>

    ```


    We show the translation of our pseudo code into assembly language in the right
    column:


    | Pseudo Code | Assembly |

    | :--- | :--- |

    | 1 -> (a) ; (a) = 1 | movl $1, a |

    | 1 -> (b) ; (b) = 1 | movl $1, b |

    | (b) + (a) -> (b) | |

    | (a) + 1 -> (a) | |

    | (b) * (a) -> (b) | |


    Notice `movl` instructions instead of `mov`. This is because “a” and “b” can point
    to both 32-bit (like %EAX or %EDX registers) and 64-bit memory cells (like %RAX
    and %RDX registers). In the registers'' case, it is clear from their names whether
    we use 64-bit %RAX or 32-bit %EAX. But in the case of memory addresses “a” and
    “b”, it is not clear whether they refer to 64-bit or 32-bit cells. We use `movl`
    to disambiguate and show that we use 32-bit memory cells that are enough to hold
    integers from 0 to 4294967295.


    `0x2ef2(%rip)` is how the compiler generates code to calculate the address “a”
    instead of specifying it directly. Such code requires less memory space. We explain
    this in later chapters.


    Literal constants have `$` prefix, for example, `$0x1`. `0x` prefix means the
    following number is hexadecimal. The leading 4 zeros of the address are also omitted
    in the comment. We explain such numbers in Chapter x64.3. Please also notice that
    the movement direction is the same in both disassembly output and the pseudo-code:
    from left to right.


    After executing the first two assembly language instructions, we have the memory
    layout shown in Picture x64.1.4.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_16_0.png)

    Picture x64.1.4


    ### Assigning Numbers to Registers


    This is similar to memory assignments. We can write in pseudo-code:


    ```

    1 -> register

    (a) -> register

    ```


    Note that we do not use brackets when we refer to register contents. The latter
    instruction means assigning (copying) the number at the location (address) "a"
    to a register.


    In assembly language we write:


    ```

    mov $1, %eax   # 1 is copied to the first half of %RAX register

    mov $1, %rax   # full contents of %RAX register are replaced with 1

    mov a, %eax

    mov a, %rax

    ```


    In GDB disassembly output, we may see the following code:


    ```

    mov $0x0, %eax

    ```


    ### “Arithmetic” Project: Adding Numbers to Memory Cells


    Now let’s look at the following pseudo-code statement in more detail:


    ```

    (b) + (a) -> (b)

    ```


    To recall, “a” and “b” mean the names of locations (addresses) 00005555555802c
    and 000055555558030 respectively (see Picture x64.1.4). (a) and (b) mean contents
    at addresses “a” and “b” respectively, simply some numbers stored there.


    In C or C++ language we write the following statement:


    ```

    b = b + a;

    b += a;

    ```


    In assembly language, we use the instruction ADD. Because of AMD64 and Intel EM64T
    architecture’s limitations, we cannot use both memory addresses in one step (instruction),
    for example, **add a, b**. We can only use **add register, b** instruction to
    add the value stored in the **register** to the contents of the memory cell **b**.
    Recall that a register is like a temporary memory cell itself here:


    ```

    (a) -> register

    (b) + register -> (b)

    ```


    Alternatively, we can use two registers:


    ```

    (a) -> register1

    (b) -> register2

    register2 + register1 -> register2

    register2 -> (b)

    ```


    In assembly language, we write:


    ```

    mov a, %eax

    add %eax, b

    ```


    or we can add 2 registers and move the result to the memory cell b:


    ```

    mov b, %edx

    mov a, %eax

    add %edx, %eax

    mov %eax, b

    ```


    In GDB disassembly output we may see the following code:


    ```assembly

    mov 0x2ee6(%rip),%edx # 0x555555558030 <b>

    mov 0x2edc(%rip),%eax # 0x55555555802c <a>

    add %edx,%eax

    mov %eax,0x2ed8(%rip) # 0x555555558030 <b>

    ```


    Now we can translate our pseudo-code into assembly language:


    | Pseudo-code | Assembly |

    | :--- | :--- |

    | `1 -> (a) ; (a) = 1` | `movl $1, a` |

    | `1 -> (b) ; (b) = 1` | `movl $1, b` |

    | `(b) + (a) -> (b) ; %eax = 1` | `mov a, %eax` |

    | ` ; %edx = 1` | `mov b, %edx` |

    | ` ; %eax = 2` | `add %edx, %eax` |

    | ` ; (b) = 2` | `mov %eax, b` |

    | `(a) + 1 -> (a)` | |

    | `(b) * (a) -> (b)` | |


    After the execution of ADD and MOV instructions, we have the memory layout illustrated
    in Picture x64.1.5.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_20_0.png)

    Picture x64.1.5


    ### Incrementing/Decrementing Numbers in Memory and Registers


    In pseudo-code, it looks simple and means increment (decrement) a number stored
    at the location (address) "a":


    ```

    (a) + 1 -> (a)

    (a) - 1 -> (a)

    ```


    In C or C++ language we can write this using three possible ways:


    ```

    a = a + 1;

    ++a;

    a++;


    b = b - 1;

    --b;

    b--;

    ```


    In assembly language, we use instructions INC and DEC, and write:


    ```

    incl a

    inc %eax

    decl a

    dec %eax

    ```


    We use **incl** when we need to specify the 32-bit memory cell. It is ambiguous
    when we use "a". However, using %eax implies using 32-bit values, so **inc** is
    unambiguous.


    In GDB disassembly output, we may see the same instruction:


    ```

    inc %eax

    or

    add $0x1,%eax # a compiler may decide to use ADD instead of INC

    ```'
  mdcn: '

    ## 第 x64.1 章：内存、寄存器和简单算术


    ### 理想化计算机内部的内存和寄存器


    计算机内存由一系列内存单元组成，每个单元都有一个唯一的地址（位置）。每个单元包含一个“数字”。我们将这些“数字”称为地址（位置）中的内容。由于内存访问速度比算术指令慢，因此设有所谓的寄存器，用以加速需要内存存储临时结果的复杂操作。我们也可以将它们视为独立的内存单元。寄存器的名称即为其地址。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_11_0.png)

    图 x64.1.1


    ### Intel 64 位 PC 内部的内存和寄存器


    在这里，包含整数值的内存位置地址通常相差 4 或 8，我们还展示了两个名为 %RAX 和 %RDX 的寄存器。它们的前半部分分别被称为 %EAX 和 %EDX。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_12_0.png)

    图 x64.1.2


    因为内存单元包含“数字”，所以我们从简单的算术开始，要求 PC 计算两个数字的和，以观察内存和寄存器的值如何变化。


    ### “算术”项目：内存布局和寄存器


    在我们的项目中，有两个内存地址（位置），我们称之为 “a” 和 “b”。我们可以将 “a” 和 “b” 视为各自地址（位置）的名称。现在我们引入一种特殊符号，其中
    `(a)` 表示内存地址（位置） “a” 中的内容。如果我们使用 C 或 C++ 语言来编写项目，我们将内存位置 “a” 和 “b” 声明并定义为：


    ```

    static int a, b;

    ```


    默认情况下，当我们加载程序时，静态内存位置会被填充为零，我们可以将加载程序后的初始内存布局描绘如下，如图 x64.1.3 所示。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_13_0.png)

    图 x64.1.3


    ### “算术”项目：计算机程序


    我们可以将计算机程序视为一系列用于操作内存单元和寄存器内容的指令。例如，加法操作：将内存单元 N₾12 的内容加到内存单元 N₾14 的内容中。在我们的伪代码中，可以写成：


    (14) + (12) -> (14)


    我们的第一个伪代码程序显示在表格的左侧：


    | 伪代码 | 汇编指令 |

    | :--- | :--- |

    | 1 -> (a) <br> 1 -> (b) <br> (b) + (a) -> (b) <br> (a) + 1 -> (a) <br> (b) *
    (a) -> (b) | 这里我们放置与伪代码相对应的汇编指令。 |


    ''->'' 表示将新值移动（赋值）到内存位置（地址）的内容中。'';'' 是注释符号，该行剩余部分为注释。''='' 显示内存位置（地址）当前的当前值。


    提醒一下，用高级编程语言编写的代码由编译器翻译成机器语言。然而，如果其数字代码用某种名为汇编语言的助记符系统表示，那么机器语言也是可读的。例如，`INC a`
    是将存储在内存位置 “a” 处的值增加 1。


    ### “算术”项目：将数字赋值给内存位置


    我们提醒，“a” 表示内存单元的位置（地址），它也是地址 000055555555802c 的名称（见图 x64.1.3）。`(a)` 表示存储在地址 “a”
    处的内容（数字）。


    如果我们使用 C 或 C++ 语言，“a” 被称为 “变量 a”，我们将其赋值写为：


    ```

    a = 1 ;

    ```


    在 Intel 汇编语言中，我们写作：


    ```

    mov $1, a

    ```


    在 GDB 反汇编输出中，我们看到以下代码，其中变量 “a” 和地址显示在注释中：


    ```

    movl $0x1,0x2ef2(%rip) # 0x55555555802c <a>

    ```


    我们在右列展示了伪代码翻译成汇编语言的结果：


    | 伪代码 | 汇编 |

    | :--- | :--- |

    | 1 -> (a) ; (a) = 1 | movl $1, a |

    | 1 -> (b) ; (b) = 1 | movl $1, b |

    | (b) + (a) -> (b) | |

    | (a) + 1 -> (a) | |

    | (b) * (a) -> (b) | |


    注意使用的是 `movl` 指令而不是 `mov`。这是因为 “a” 和 “b” 既可以指向 32 位（如 %EAX 或 %EDX 寄存器）也可以指向 64
    位（如 %RAX 和 %RDX 寄存器）的内存单元。在寄存器的情况下，从它们的名称就可以清楚地知道我们使用的是 64 位的 %RAX 还是 32 位的 %EAX。但在内存地址
    “a” 和 “b” 的情况下，不清楚它们是指 64 位还是 32 位单元。我们使用 `movl` 来消除歧义，表明我们使用 32 位内存单元，这足以容纳从
    0 到 4294967295 的整数。


    `0x2ef2(%rip)` 是编译器生成代码以计算地址 “a” 而非直接指定地址的方式。这种代码占用的内存空间较少。我们将在后面的章节中解释这一点。


    字面量常量带有 `$` 前缀，例如 `$0x1`。`0x` 前缀意味着后面的数字是十六进制的。注释中地址的前 4 个零也被省略了。我们将在第 x64.3 章中解释这类数字。请同时注意，反汇编输出和伪代码中的移动方向是一致的：从左到右。


    执行前两条汇编语言指令后，我们得到了图 x64.1.4 所示的内存布局。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_16_0.png)

    图 x64.1.4


    ### 将数字赋值给寄存器


    这与内存赋值类似。我们可以用伪代码写作：


    ```

    1 -> register

    (a) -> register

    ```


    注意，当我们引用寄存器内容时，不使用括号。后一条指令意味着将位置（地址） “a” 处的数字赋值（复制）到一个寄存器中。


    在汇编语言中，我们写作：


    ```

    mov $1, %eax   # 1 被复制到 %RAX 寄存器的前半部分

    mov $1, %rax   # %RAX 寄存器的全部内容被替换为 1

    mov a, %eax

    mov a, %rax

    ```


    在 GDB 反汇编输出中，我们可能会看到以下代码：


    ```

    mov $0x0, %eax

    ```


    ### “算术”项目：将数字加到内存单元中


    现在让我们更详细地看看以下伪代码语句：


    ```

    (b) + (a) -> (b)

    ```


    回顾一下，“a” 和 “b” 分别表示位置（地址） 00005555555802c 和 000055555558030 的名称（见图 x64.1.4）。`(a)`
    和 `(b)` 分别表示地址 “a” 和 “b” 处的内容，简单来说就是存储在那里的某些数字。


    在 C 或 C++ 语言中，我们编写以下语句：


    ```

    b = b + a;

    b += a;

    ```


    在汇编语言中，我们使用 `ADD` 指令。由于 AMD64 和 Intel EM64T 架构的限制，我们不能在一步（指令）中使用两个内存地址，例如 **add
    a, b**。我们只能使用 **add register, b** 指令，将存储在 **register**（寄存器）中的值加到内存单元 **b** 的内容中。请记住，这里的寄存器本身就像一个临时内存单元：


    ```

    (a) -> register

    (b) + register -> (b)

    ```


    或者，我们可以使用两个寄存器：


    ```

    (a) -> register1

    (b) -> register2

    register2 + register1 -> register2

    register2 -> (b)

    ```


    在汇编语言中，我们写作：


    ```

    mov a, %eax

    add %eax, b

    ```


    或者我们可以将 2 个寄存器相加，然后将结果移动到内存单元 b：


    ```

    mov b, %edx

    mov a, %eax

    add %edx, %eax

    mov %eax, b

    ```


    在 GDB 反汇编输出中，我们可能会看到以下代码：


    ```assembly

    mov 0x2ee6(%rip),%edx # 0x555555558030 <b>

    mov 0x2edc(%rip),%eax # 0x55555555802c <a>

    add %edx,%eax

    mov %eax,0x2ed8(%rip) # 0x555555558030 <b>

    ```


    现在我们可以将我们的伪代码翻译成汇编语言：


    | 伪代码 | 汇编 |

    | :--- | :--- |

    | `1 -> (a) ; (a) = 1` | `movl $1, a` |

    | `1 -> (b) ; (b) = 1` | `movl $1, b` |

    | `(b) + (a) -> (b) ; %eax = 1` | `mov a, %eax` |

    | ` ; %edx = 1` | `mov b, %edx` |

    | ` ; %eax = 2` | `add %edx, %eax` |

    | ` ; (b) = 2` | `mov %eax, b` |

    | `(a) + 1 -> (a)` | |

    | `(b) * (a) -> (b)` | |


    在执行 `ADD` 和 `MOV` 指令后，我们得到了图 x64.1.5 所示的内存布局。


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_20_0.png)

    图 x64.1.5


    ### 增加/减少内存和寄存器中的数字


    在伪代码中，这看起来很简单，意思是指增加（减少）存储在位置（地址） “a” 处的数字：


    ```

    (a) + 1 -> (a)

    (a) - 1 -> (a)

    ```


    在 C 或 C++ 语言中，我们可以通过三种可能的方式来编写：


    ```

    a = a + 1;

    ++a;

    a++;


    b = b - 1;

    --b;

    b--;

    ```


    在汇编语言中，我们使用 `INC` 和 `DEC` 指令，并写作：


    ```

    incl a

    inc %eax

    decl a

    dec %eax

    ```


    当我们需要指定 32 位内存单元时，使用 **incl**。当我们使用 “a” 时，它是具有歧义的。然而，使用 %eax 意味着使用 32 位值，因此 **inc**
    是没有歧义的。


    在 GDB 反汇编输出中，我们可能会看到相同的指令：


    ```

    inc %eax

    or

    add $0x1,%eax # 编译器可能会决定使用 ADD 而不是 INC

    ```

    '
