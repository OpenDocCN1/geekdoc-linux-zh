- img_proc: true
  md: "# Stack Overflow\n\nBy default, the stack size is limited (system and limits\
    \ dependent, and on our system, it is 8192Kb or 8388608 bytes). If a stack grows\
    \ beyond the reserved limit, a stack overflow occurs (segmentation fault). It\
    \ can be caused by an unlimited recursion, deep recursion, or very large local\
    \ variables:\n\n```\n```c\nint func()\n{\n    func();\n    return 0;\n}\n\nint\
    \ func2()\n{\n    int array[10000000] = { 1 };\n    printf(\"%d\", array[10000000-1]);\n\
    }\n```\n```"
  merge: -1
