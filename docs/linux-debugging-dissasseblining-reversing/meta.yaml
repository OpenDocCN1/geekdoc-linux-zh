  - "[PAGE 63]\n\n# Bit Granularity\n\nEvery byte consists of 8 bits. Every bit has\
    \ a value of 0 or 1. Here are some examples of bytes, words, doublewords and quadwords\
    \ shown as bit strings (we can also clearly see the correspondence between 4-bit\
    \ sequences and hexadecimal numbers, Table x64.3.1):\n\n+   - Byte\n    - C /\
    \ C++: unsigned char\n    - 8 bits\n    - Values $0_{\text{dec}} - 255_{\text{dec}}$\
    \ or $0_{\text{hex}} - \text{FF}_{\text{hex}}$\n    - Example: $12_{\text{dec}}$\
    \ $00001100_{\text{bin}}$ $0\text{C}_{\text{hex}}$\n\n+   - Word\n    - C / C++:\
    \ unsigned short\n    - 16 bits\n    - Values $0_{\text{dec}} - 65535_{\text{dec}}$\
    \ or $0_{\text{hex}} - \text{FFFF}_{\text{hex}}$\n    - Example: $0000000000001100_{\t\
    ext{bin}}$ $000\text{C}_{\text{hex}}$\n\n+   - Doubleword\n    - C / C++: unsigned\
    \ int, unsigned\n    - 32 bits\n    - Values $0_{\text{dec}} - 4294967295_{\t\
    ext{dec}}$ or $0_{\text{hex}} - \text{FFFFFFFF}_{\text{hex}}$\n    - Example:\
    \ $00000000000000000000000000001100_{\text{bin}}$ $0000000\text{C}_{\text{hex}}$\n\
    \n+   - Quadword\n    - C / C++: long, unsigned long long\n    - 64 bits\n   \
    \ - Values $0_{\text{dec}} - 18446744073709551615_{\text{dec}}$ or $0_{\text{hex}}\
    \ - \text{FFFFFFFFFFFFFFFF}_{\text{hex}}$\n    - Example: $000000000000000000000000000000000000000000000000000000001100_{\t\
    ext{bin}}$ $000000000000000\text{C}_{\text{hex}}$"
  - '[PAGE 64]


    # Memory Layout


    The minimum addressable element of memory is a byte. The maximum addressable element
    is a doubleword on 32-bit machines and a quadword on 64-bit machines. All general
    registers are 32-bit on 32-bit CPUs and can contain doubleword values. On 64-bit
    CPUs, all general registers are 64-bit and can contain quadword values. Picture
    x64.5.2 shows a typical memory layout, and Picture x64.5.3 shows the byte layout
    of some general CPU registers.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_64_0.png)


    Picture x64.5.2'
