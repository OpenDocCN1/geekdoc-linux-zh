  md: '# Function Prolog and Epilog


    Now, before we try to make sense of the FunctionParameters project disassembly,
    we look at the simple case of one function parameter and one local variable to
    illustrate the standard function prolog and epilog sequence of instructions and
    corresponding stack memory changes.


    Function prolog is illustrated in Picture x64.11.2, and function epilog is illustrated
    in Picture x64.11.3.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_142_0.png)


    Picture x64.11.2


    Here the function parameter is passed via the %RDI register. It is saved on the
    stack because the register may be used later in calculations or function parameter
    passing to other functions. Generally, the function first 6 parameters are passed
    via %RDI, %RSI, %RDX, %RCX, %R8, and %R9 registers from left to the right when
    parameters are quadwords like pointers or long values and via %EDI, %ESI, %EDX,
    %ECX, %R8D, and %R9D registers when parameters are doublewords like integers.
    Additional parameters are passed via the stack locations using PUSH instruction.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '![](img/47fe95ac2b05f9cf0a4cad33d8640c96_143_0.png)


    Picture x64.11.3


    We also see that local variables are not initialized by default when their storage
    space is allocated via SUB instruction and not cleared during epilog. Whatever
    memory contents were there before allocation, it becomes the local variable values,
    the so-called garbage values.'
