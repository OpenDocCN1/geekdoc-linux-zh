    \n## 第 x64.5 章：字节、字、双字和四字\n\n### 使用十六进制数\n\n如果想在 C/C++ 语言中使用十六进制数，我们需要在前面加上 `0x`\
    \ 前缀，例如：\n\n```cpp\na = 12;    // 10进制 12\na = 0xC;    // 16进制 C\n```\n\n在 GDB\
    \ 的反汇编输出以及输入命令时，数字默认被解释为十进制。如果希望数字被解释为十六进制，我们需要在前面加上 `0x` 前缀，例如：\n\n```asm\nmov\
    \ 12, a\nmov 0xC, a\n```\n\n### 字节粒度\n\n图 x64.5.1 展示了字节（Byte）、字（Word）、双字（Doubleword）和四字（Quadword）在字节粒度上的区别。我们可以看到，每个连续的尺寸都是前一个尺寸的两倍。\n\
    \n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_62_0.png)\n\n图 x64.5.1\n\n### 位粒度\n\
    \n每个字节由 8 位（bit）组成。每位的值为 0 或 1。以下是一些以位字符串形式表示的字节、字、双字和四字的示例（我们也可以清楚地看到 4 位序列与十六进制数之间的对应关系，见表\
    \ x64.3.1）：\n\n- 字节 (Byte)\n    - C / C++: unsigned char\n    - 8 位\n    - 取值范围\
    \ $0_{\\text{dec}} - 255_{\\text{dec}}$ 或 $0_{\\text{hex}} - \\text{FF}_{\\text{hex}}$\n\
    \    - 示例：$12_{\\text{dec}}$ $00001100_{\\text{bin}}$ $0\\text{C}_{\\text{hex}}$\n\
    - 字 (Word)\n    - C / C++: unsigned short\n    - 16 位\n    - 取值范围 $0_{\\text{dec}}\
    \ - 65535_{\\text{dec}}$ 或 $0_{\\text{hex}} - \\text{FFFF}_{\\text{hex}}$\n  \
    \  - 示例：$0000000000001100_{\\text{bin}}$ $000\\text{C}_{\\text{hex}}$\n- 双字 (Doubleword)\n\
    \    - C / C++: unsigned int, unsigned\n    - 32 位\n    - 取值范围 $0_{\\text{dec}}\
    \ - 4294967295_{\\text{dec}}$ 或 $0_{\\text{hex}} - \\text{FFFFFFFF}_{\\text{hex}}$\n\
    \    - 示例：$00000000000000000000000000001100_{\\text{bin}}$ $0000000\\text{C}_{\\\
    text{hex}}$\n- 四字 (Quadword)\n    - C / C++: long, unsigned long long\n    - 64\
    \ 位\n    - 取值范围 $0_{\\text{dec}} - 18446744073709551615_{\\text{dec}}$ 或 $0_{\\\
    text{hex}} - \\text{FFFFFFFFFFFFFFFF}_{\\text{hex}}$\n    - 示例：$000000000000000000000000000000000000000000000000000000001100_{\\\
    text{bin}}$ $000000000000000\\text{C}_{\\text{hex}}$\n\n### 内存布局\n\n内存中最小的可寻址单元是字节。最大可寻址单元在\
    \ 32 位机器上是双字，在 64 位机器上是四字。在 32 位 CPU 上，所有通用寄存器都是 32 位的，可以包含双字值。在 64 位 CPU 上，所有通用寄存器都是\
    \ 64 位的，可以包含四字值。图 x64.5.2 展示了一个典型的内存布局，图 x64.5.3 展示了一些通用 CPU 寄存器的字节布局。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_64_0.png)\n\
    \n图 x64.5.2\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_65_0.png)\n\n图 x64.5.3\n\
    \n请记住，内存地址始终是 64 位的，指向 32 位内存单元（如整数）的内存地址同样也是 64 位的。\n\n## 第 x64.6 章：指向内存的指针\n\
    \n### 重新审视指针\n\n指针是一个存储另一个内存单元地址的内存单元或寄存器。内存指针本身也有地址，因为它们同样是内存单元。在 32 位 Linux\
    \ 上，指针是 32 位的；在 64 位 Linux 上，指针是 64 位的。\n\n### 寻址类型\n\n正如我们在第 x64.5 章中所见，内存单元的大小可以是字节、字、双字或四字。因此，我们可以拥有指向字节的指针、指向字的指针、指向双字的指针以及指向四字的指针。在第\
    \ x64.4 章的 GDB 反汇编输出中，涉及指向存储 32 位（双字大小）值的内存指针的指令带有后缀。\n\n以下是一些示例说明：\n\n```asm\n\
    movb $0xFF, (%rax)\n```\n\n`movb` 指令执行前的内存布局如图 x64.6.1 所示，执行后的内存布局如图 x64.6.2 所示。\n\
    \n```asm\nmovw $0xFF, (%rax)\nmovl $0xFF, (%rax)\nmovq $0xFF, (%rax)\n```\n\n\
    我们需要在 0xFF 前加上 `$` 前缀，以将其与作为内存地址的 0xFF 区分开来。\n\n`movl` 指令执行后的内存布局如图 x64.6.3 所示。我们可以看到，尽管我们仅指定一个字节值\
    \ 0xFF 作为 `movl` 指令的源操作数，但它替换了内存中双字的其余 3 个字节，因为我们将目标指定为指向 4 个字节的指针，且 0xFF 作为双字时为\
    \ 0x000000FF。因此，我们需要指定 `l` 后缀来区分移动双字值和移动字节值。如果我们忘记指定而直接使用 `mov`，编译器会报错：\n\n```\n\
    Error: no instruction mnemonic suffix given and no register operands; can't size\
    \ instruction\n```\n\n由于 64 位（四字）寄存器可能指向四字内存单元，即使我们指定一个所有前导位均为零的常量，我们也需要指定 `q`\
    \ 来区分移动四字值和移动字节值：\n\n```asm\nmovq $0x00000000000000FF, (%rax)\n```\n\n然而，如果我们只想移动一个字值，则需要指定\
    \ `w` 后缀：\n\n```asm\nmovw $0xFF, (%rax)\n```\n\n这等同于：\n\n```asm\nmovw $0x00FF,\
    \ (%rax)\n```\n\n图 x64.6.4 总结了各种寻址模式。\n"
