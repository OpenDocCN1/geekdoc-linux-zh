  md: "# POP instruction\n\nWe can pop a value stored on the top of a stack to a register\
    \ or a memory address:\n\n```\nPOP r/mem\n```\n\nHere is POP simplified pseudo-code\
    \ adopted from the Intel manual:\n\n```\nIF OperandSize = 64\n    THEN\n     \
    \   (%RSP) -> OperandValue ; quadword\n        %RSP + 8 -> %RSP\n    ELSE\n  \
    \      (%RSP) -> OperandValue ; word\n        %RSP + 2 -> %RSP\nFI\n```\n\nExamples:\n\
    \n```\npop %rax\npopw (%rbx)\n```"
