    \ /x (long)pb = 0x402004\n```\n\n```\n(gdb) si\n0x0000000000040102e in _start\
    \ ()\n1: x/i $rip\n=> 0x40102e <_start+46>:   add (%rbx),%ecx\n2: /x $rax = 0x402000\n\
    3: /x $rbx = 0x402004\n4: /x $rcx = 0x1\n5: /x (int)a = 0x1\n6: /x (int)b = 0x1\n\
    7: /x (long)pa = 0x402000\n8: /x (long)pb = 0x402004\n```\n\n当地址 0000000000040102c\
    \ 处的 MOV 指令正在执行时，另一个 CPU 寄存器 %RIP 指向地址 0000000000040102e 处待执行的下一条指令。如图 x64.7.1\
    \ 所示。\n\n**RIP**\n\n| 地址 | 值 |\n| :--- | :--- |\n| 0000000000401024 | 40 |\n|\
    \ 0000000000401025 | 00 |\n| 0000000000401026 | c7 |\n| 0000000000401027 | 03\
    \ |\n| 0000000000401028 | 01 |\n| 0000000000401029 | 00 |\n| 000000000040102a\
    \ | 00 |\n| 000000000040102b | 00 |\n| 000000000040102c | 8b |\n| 000000000040102d\
    \ | 08 |\n| 000000000040102e | 03 |\n| 000000000040102f | 0b |\n| 0000000000401030\
    \ | 89 |\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_94_0.png)\n\n当前执行的指令：`mov\
    \ (%rax),%ecx`\n下一条指令：`add (%rbx),%ecx`\n图 x64.7.1\n\n### 代码段\n\n回想在第 x64.6 章中，我们讨论了存放程序数据的\
    \ **.data** 段。程序代码则被放在 **.text** 段中。\n\n以下 GDB 命令列出了各种程序段及其信息：\n\n```\n(gdb) maintenance\
