    # # Chapter x64.4: Pointers


    # ## A Definition


    The concept of a pointer is one of the most important to understand thoroughly
    to master Linux debugging. By definition, a pointer is a memory cell or a processor
    register that contains the address of another memory cell as shown in Picture
    x64.4.1. It has its own address as any memory cell. Sometimes, a pointer is called
    an indirect address (vs. a direct address, the address of a memory cell). Iteratively,
    we can define another level of indirection and introduce a pointer to a pointer
    as a memory cell or a processor register that contains the address of another
    memory cell that contains the address of another memory cell and so on.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_41_0.png)


    Picture x64.4.1'
  - '[PAGE 42]


    # “Pointers” Project: Memory Layout and Registers


    In our debugging project, we have two memory addresses (locations), "a" and "b".
    We can think about "a" and "b" as names of addresses (locations). We remind that
    notation (a) means contents at the memory address (location) "a".


    We also have registers %RAX and %RBX as pointers to "a" and "b". These registers
    contain addresses of "a" and "b", respectively. The notation (%RAX) means the
    contents of a memory cell whose address is in the register %RAX.


    In C and C++ languages, we declare and define pointers to "a" and "b" as:


    ```

    ```c

    int *a, *b;

    ```

    ```


    Our project memory layout before program execution is shown in Picture x64.4.2.
    Addresses always occupy 64-bit memory cells or full 64-bit registers like %RAX
    or %RBX (they cannot fit in %EAX or %EBX or a 32-bit memory cell).


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_42_0.png)


    Picture x64.4.2'
  - '[PAGE 43]


    # “Pointers” Project: Calculations


    In order to understand pointers better from low level assembly language perspective
    we perform our old arithmetic calculations from Chapter x64.1 using pointers to
    memory instead of direct memory addresses:


    ```

    address a -> rax


    1 -> (rax)


    address b -> rbx


    1 -> (rbx)


    (rbx) + (rax) -> (rbx)


    (rax) + 1 -> (rax)


    (rbx) * (rax) -> (rbx)

    ```'
  - '[PAGE 44]


    # Using Pointers to Assign Numbers to Memory Cells


    First, the following sequence of pseudo-code instructions means that we interpret
    the contents of `%RAX` register as the address of a memory cell and then assign
    a value to that memory cell:


    ```

    address a -> rox


    1 -> (rax)

    ```


    In C and C++ languages, it is called "dereferencing a pointer" and we write:


    ```

    int a;


    int *pa = &a; // declaration and definition of a pointer


    *pa = 1; // get a memory cell (dereference a pointer)


    // and assign a value to it

    ```


    In assembly language, we write:


    ```

    lea a, %rax # load the address "a" into %rax


    movl $1, (%rax) # use %rax as a pointer

    ```


    Again, we use `movl` instead of `mov` because integers occupy 32-bit memory cells,
    and we want to address only a 32-bit memory cell. This is how it is on x64 Linux:
    memory cells to contain integers are half the size of memory cells to contain
    addresses (32-bit vs. 64-bit).


    In GDB disassembly output we see something like this:


    ```

    0x0000000000401000 <0>: lea 0x402000,%rax


    0x0000000000401008 <8>: movl $0x1,(%rax)

    ```


    The source code for this chapter can be downloaded from


    https://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter4/


    To illustrate some instructions and not to be dependent on how the compiler translates
    C/C++ code, we write the program in assembly language. We need to compile and
    link it before loading it into GDB and disassemble its main function as described
    in Chapter x64.2.


    ```

    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ as PointersProject.asm -o PointersProject.o


    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ ld PointersProject.o -o PointersProject


    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ gdb ./PointersProject


    GNU gdb (Debian 8.2.1-2+b3) 8.2.1

    ```'
