    \ 0x0000555555555157 <+10>:   mov    -0x4(%rbp),%eax\n 0x000055555555515a <+13>:\
    \   add    %eax,-0x8(%rbp)\n 0x000055555555515d <+16>:   addl   $0x1,-0x4(%rbp)\n\
