  md: "# Logical Operations\n\nHere we recall logical operations and corresponding\
    \ truth tables. We abbreviate True as T and False as F.\n\nAND\n\n```\n1 and 1\
    \ = 1\tT and T = T\n1 and 0 = 0\tT and F = F\n0 and 1 = 0\tF and T = F\n0 and\
    \ 0 = 0\tF and F = F\n```\n\nOR\n\n```\n1 or 1 = 1\tT or T = T\n1 or 0 = 1\tT\
    \ or F = T\n0 or 1 = 1\tF or T = T\n0 or 0 = 0\tF or F = F\n```"
