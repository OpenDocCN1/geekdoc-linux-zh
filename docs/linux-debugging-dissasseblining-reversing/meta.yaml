  md: "# PUSH Instruction\n\nWe can push a value stored in a register, a value stored\
    \ at a memory address, or constant (immediate operand):\n\n**PUSH r/mem/imm**\n\
    \nHere is PUSH simplified pseudo-code adopted from the Intel manual:\n\n```\n\
    IF OperandSize = 64\n    THEN\n        %RSP - 8 -> %RSP\n        OperandValue\
    \ -> (%RSP) ; quadword\n    ELSE\n        %RSP - 2 -> %RSP\n        OperandValue\
    \ -> (%RSP) ; word\nFI\n```\n\nExamples:\n\n```\npush %rax\npushw (%rbx)\npush\
    \ $0\n```"
