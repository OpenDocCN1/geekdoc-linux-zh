    \ 0x1    0x0    0x7fffffff7eaaaf5    0x7fff\n0x7fffffff4f40: 0x0    0x0    0x1\
    \    0x1    ; (b), (a)\n0x7fffffff5000: 0x7ffffffff530    0x7fff\n```\n\n## Parameter\
    \ Mismatch Problem\n\nTo illustrate the importance of understanding stack memory\
    \ layout consider this typical binary interface mismatch problem. Function `main`\
    \ calls `func` with two parameters:\n\n```c\n// main.c\nint main ()\n{\n    long\
    \ locVar;\n    func (1, 2);\n    return 0;\n}\n```\n\nThe caller is expected the\
    \ callee function `func` to see this stack memory layout and passes 1 in `%RDI`\
    \ and 2 in `%RSI`:\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_0.png)\n\n\
    However, the callee expects 3 parameters instead of 2:\n\n```c\n// func.c\nint\
    \ func (int a, int b, int c)\n{\n    // code to use parameters\n    return 0;\n\
    }\n```\n\n`func` code sees this stack memory layout:\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_1.png)\n\
    \nWe see that the parameter `c` on the raw stack gets its value from some random\
    \ value in `%RDX` that was never set by the caller. It is clearly a software defect\
    \ (bug).\n\n## Chapter x64.12: More Instructions\n\n### CPU Flags Register\n\n\
    In addition to registers, the CPU also contains a 64-bit %RFLAGS register where\
    \ individual bits are set or cleared in response to arithmetic and other operations.\
    \ Separate machine instructions can manipulate some bit values, and their values\
    \ affect code execution.\n\nFor example, DF bit (Direction Flag) determines the\
    \ direction of memory copy operations and can be set by STD and cleared by CLD\
    \ instructions. It has the default value of 0, and its location is shown in Picture\
    \ x64.12.1, where only the first 32 bits of 64-bit %RFLAGS are shown.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_149_0.png)\n\
    \n## The Fast Way to Fill Memory\n\nIt can be done by STOSQ instruction that stores\
    \ a quadword value from %RAX into a memory location which address is in %RDI register\
    \ (\"D\" means destination). After the value from %RAX is transferred to memory,\
    \ the instruction increments %RDI by 8, and, if the DF flag is 0, %RDI now points\
    \ to the next quadword in memory. If the DF flag is 1, then the %RDI value is\
    \ decremented by 8, and the %RDI now points to the previous quadword in memory.\
    \ There is an equivalent STOSL instruction that stores doublewords and increments\
    \ or decrements %RDI by 4.\n\nIf we prefix any instruction with REP, it causes\
    \ the instruction to be repeated until the %RCX register's value is decremented\
    \ to 0. For example, we can write simple code that should theoretically zero \"\
    all memory\" (practically, it traps because of access violation):\n\n```assembly\n\
    xor %rax, %rax            # fill with 0\nmov $0, %rdi             # starting address\
    \ or xor %rdi, %rdi\nmov $0xffffffff / 4, %rcx # 0x1ffffff quad words\nrep stosq\n\
    ```\n\nHere is REP STOSQ in pseudo-code:\n\n```\nWHILE (RCX != 0)\n{\n    RAX\
    \ -> (RDI)\n\n    IF DF = 0 THEN\n        RDI + 8 -> RDI\n    ELSE\n        RDI\
    \ - 8 -> RDI\n\n    RCX - 1 -> RCX\n}\n```\n\nA simple example of erasing 32 bytes\
    \ (4x8) is shown in Picture x64.12.2.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_151_0.png)\n\
    Picture x64.12.2\n\n## Testing for 0\n\nZF bit in %RFLAGS register is set to 1\
    \ if the instruction result is 0 and cleared otherwise. This bit is affected by:\n\
    \n- Arithmetic instructions (for example, ADD, SUB, MUL)\n- Logical compare instruction\
    \ (TEST)\n- “Arithmetical” compare instruction (CMP)\n\nThe location of the ZF\
    \ bit is shown in Picture x64.12.3.\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_152_0.png)\n\
    Picture x64.12.3"
  mdcn: "\n## 项目反汇编代码（含注释）\n\n以下是 `main` 和 `arithmetic` 函数的带注释反汇编代码，为了视觉清晰，已移除内存地址。\n\
    \n```assembly\nmain:\n\npush %rbp                      # 建立栈帧\nmov %rsp,%rbp\n\
    sub $0x20,%rsp               # 为局部变量和函数参数创建栈帧\n\nmov %edi,-0x14(%rbp)        \
    \ # 保存 main 的第一个参数\nmov %rsi,-0x20(%rbp)         # 保存 main 的第二个参数\nmov $0x1,%esi\
    \                # 设置 arithmetic 函数的第二个参数\n\nmov $0x1,%edi                # 设置\
    \ arithmetic 函数的第一个参数\n\ncallq 0x5555555514d <_Z10arithmeticii>\nmov %eax,-0x4(%rbp)\
    \          # 设置结果局部变量\nmov $0x0,%eax                # main 应该返回 0\nleave     \
    \                  # 恢复之前的栈指针和栈帧恢复，等同于\n                                  #  \
    \ mov %rbp, %rsp\n                                  #   pop %rbp\n\nretq     \
    \                    # 从 main 返回\n```\n\n```assembly\narithmetic:\n\npush %rbp\
    \                      # 建立栈帧\nmov %rsp,%rbp\nmov %edi,-0x4(%rbp)          # 保存\
    \ arithmetic 的第一个参数 (a)\nmov %esi,-0x8(%rbp)          # 保存 arithmetic 的第二个参数 (b)\n\
    mov -0x4(%rbp),%eax          # (a) -> eax\nadd %eax,-0x8(%rbp)          # eax\
    \ + (b) -> (b)\naddl $0x1,-0x4(%rbp)         # 1 + (a) -> (a)\nmov -0x8(%rbp),%eax\
    \          # (b) -> eax\nimul -0x4(%rbp),%eax         # (a) * eax -> eax\nmov\
    \ %eax,-0x8(%rbp)          # eax -> (b)\nmov -0x8(%rbp),%eax          # (b) ->\
    \ eax\npop %rbp\t                  # 恢复之前的栈帧\n\t\t                    # 不需要恢复栈指针，因为其没有改变\n\
