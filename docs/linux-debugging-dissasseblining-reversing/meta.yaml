- img_proc: true
  md: '# Using Pointers to Assign Numbers to Memory Cells


    First, the following sequence of pseudo-code instructions means that we interpret
    the contents of `%RAX` register as the address of a memory cell and then assign
    a value to that memory cell:


    ```

    address a -> rox


    1 -> (rax)

    ```


    In C and C++ languages, it is called "dereferencing a pointer" and we write:


    ```

    int a;


    int *pa = &a; // declaration and definition of a pointer


    *pa = 1; // get a memory cell (dereference a pointer)


    // and assign a value to it

    ```


    In assembly language, we write:


    ```

    lea a, %rax # load the address "a" into %rax


    movl $1, (%rax) # use %rax as a pointer

    ```


    Again, we use `movl` instead of `mov` because integers occupy 32-bit memory cells,
    and we want to address only a 32-bit memory cell. This is how it is on x64 Linux:
    memory cells to contain integers are half the size of memory cells to contain
    addresses (32-bit vs. 64-bit).


    In GDB disassembly output we see something like this:


    ```

    0x0000000000401000 <0>: lea 0x402000,%rax


    0x0000000000401008 <8>: movl $0x1,(%rax)

    ```


    The source code for this chapter can be downloaded from


    https://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter4/


    To illustrate some instructions and not to be dependent on how the compiler translates
    C/C++ code, we write the program in assembly language. We need to compile and
    link it before loading it into GDB and disassemble its main function as described
    in Chapter x64.2.


    ```

    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ as PointersProject.asm -o PointersProject.o


    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ ld PointersProject.o -o PointersProject


    coredump@DESKTOP-IS6V2L0:~/pflddr/x64/Chapter4$ gdb ./PointersProject


    GNU gdb (Debian 8.2.1-2+b3) 8.2.1

    ```'
