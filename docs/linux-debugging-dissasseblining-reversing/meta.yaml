  md: '# # Chapter x64.12: More Instructions


    # ## CPU Flags Register


    In addition to registers, the CPU also contains a 64-bit %RFLAGS register where
    individual bits are set or cleared in response to arithmetic and other operations.
    Separate machine instructions can manipulate some bit values, and their values
    affect code execution.


    For example, DF bit (Direction Flag) determines the direction of memory copy operations
    and can be set by STD and cleared by CLD instructions. It has the default value
    of 0, and its location is shown in Picture x64.12.1, where only the first 32 bits
    of 64-bit %RFLAGS are shown.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_149_0.png)'
  merge: -1
