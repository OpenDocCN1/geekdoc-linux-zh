  - '[PAGE 158]


    # Function Return Value


    Many functions return values via %RAX register. For example:


    ```

    ```cpp

    long func();

    ```

    ```


    Return value is in %RAX.


    ```

    ```cpp

    bool func();

    ```

    ```


    The return value is in %EAX.


    Although bool values occupy one byte in memory, the compiler may use %EAX instead
    of %AL.'
  - '[PAGE 159]


    # Using Byte Registers


    Suppose we have a byte value in the %AL register, and we want to add this value
    to the %ECX register. However, we do not know what values other parts of the full
    %EAX register contain. We cannot use this instruction, for example:


    ```

    MOV %AL, %EBX # operand size conflict

    ```


    The proposed solution in pseudo-code:


    ```

    AL -> EBX or AL -> EAX

    ECX + EBX -> ECX ECX + EAX -> ECX

    ```


    We can only use MOV instructions that have the same operand size for both source
    and destination, for example:


    ```

    MOV %AL, %BL

    MOV %AL, b # in C: static bool b = func()

    ```


    For this task, there is a special MOVZX (Move with Zero eXtend) instruction that
    replaces the contents of the second operand with the contents of the first operand
    while filling the rest of bits with zeros:


    ```

    MOVZX reg/mem, reg

    ```


    Therefore, our solution for the task becomes very simple:


    ```

    MOVZX %AL, %EBX

    ADD %EBX, %ECX

    ```


    We can also reuse the %EAX register:


    ```

    MOVZX %AL, %EAX

    ADD %EAX, %ECX

    ```'
