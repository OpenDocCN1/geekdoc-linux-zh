  md: '# # Preface


    This training course is a Linux version of the previous "Practical Foundations
    of Windows Debugging, Disassembly, Reversing" (ISBN-13: 978-1908043984) book¹.
    It also complements "Accelerated Linux Core Dump Analysis" (ISBN-13: 978-1908043979)
    training course².


    Although the book skeleton is the same as its Windows predecessor, the content
    was revised entirely because of a different operating system, debugger (GDB),
    toolchain (GCC, assembler, linker), application binary interface, and even an
    assembly language flavor, AT&T.


    The course is useful for:


    +   - Software technical support and escalation engineers

    - Software engineers coming from JVM background

    - Software testers

    - Engineers coming from non-Linux environments, for example, Windows or Mac OS
    X

    - Linux C/C++ software engineers without assembly language background

    - Security researchers without assembly language background

    - Beginners learning Linux software reverse engineering techniques


    This book can also be used as an x64 assembly language and Linux debugging supplement
    for relevant undergraduate level courses.


    If you encounter any error, please contact us using this form:


    https://www.patterndiagnostics.com/contact


    Linkedin page:


