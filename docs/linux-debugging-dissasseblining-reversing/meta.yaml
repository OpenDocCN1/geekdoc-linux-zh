    \   pop    %rbp\n 0x000055555555516f <+34>:   retq\n\nEnd of assembler dump.\n\
    \n(gdb) break *0x0000555555555157\nBreakpoint 2 at 0x0000555555555157\n\n(gdb)\
    \ continue\nContinuing.\n\nBreakpoint 2, 0x0000555555555157 in arithmetic(int,\
    \ int) ()\n\n(gdb) info registers $rbp\nrbp    0x7fffffffe500    0x7fffffffe500\n\
    \n(gdb) x/10a $rbp-0x20\n0x7fffffff4e40: 0x1    0x7ffff7eaaaf5 <handle_intel+197>\n\
    0x7fffffff4f40: 0x0    0x100000001    ; (b, a)\n0x7fffffff5000: 0x7ffffffff530\
    \ 0x555555555143 <main+30> ; saved $RBP, return address\n0x7fffffff510: 0x7fffffff6e18\
    \ 0x15555040\n0x7fffffff520: 0x7fffffff6e10 0x0\n\n(gdb) x/10w $rbp-0x20\n0x7fffffff4e40:\
    \ 0x1    0x0    0x7fffffff7eaaaf5    0x7fff\n0x7fffffff4f40: 0x0    0x0    0x1\
    \    0x1    ; (b), (a)\n0x7fffffff5000: 0x7ffffffff530    0x7fff\n```\n\n## 参数不匹配问题\n\
    \n为了说明理解栈内存布局的重要性，请考虑这个典型的二进制接口不匹配问题。函数 `main` 调用带有两个参数的 `func`：\n\n```c\n// main.c\n\
    int main ()\n{\n    long locVar;\n    func (1, 2);\n    return 0;\n}\n```\n\n\
    调用者希望被调用函数 `func` 看到如下的栈内存布局，并在 `%RDI` 中传递 1，在 `%RSI` 中传递 2：\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_0.png)\n\
    \n然而，被调用者期望的是 3 个参数而不是 2 个：\n\n```c\n// func.c\nint func (int a, int b, int c)\n\
    {\n    // 使用参数的代码\n    return 0;\n}\n```\n\n`func` 代码看到的栈内存布局如下：\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_147_1.png)\n\
    \n我们可以看到，原始栈上的参数 `c` 获取的值来自 `%RDX` 中的某个随机值，而该值从未被调用者设置。这显然是一个软件缺陷（bug）。\n\n##\
    \ 第 x64.12 章：更多指令\n\n### CPU 标志寄存器\n\n除了通用寄存器外，CPU 还包含一个 64 位的 `%RFLAGS` 寄存器，其中单个位会根据算术和其他操作而被设置（置\
    \ 1）或清除（置 0）。单独的机器指令可以操作某些位的值，而这些值会影响代码的执行。\n\n例如，DF 位（方向标志，Direction Flag）决定内存拷贝操作的方向，可以通过\
    \ `STD` 指令设置，通过 `CLD` 指令清除。它的默认值为 0，其位置如图 x64.12.1 所示，图中仅显示了 64 位 `%RFLAGS` 的前\
    \ 32 位。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_149_0.png)\n\n## 快速填充内存的方法\n\
    \n这可以通过 `STOSQ` 指令来实现，该指令将一个四字（quadword）值从 `%RAX` 存储到由 `%RDI` 寄存器指定的内存地址中（\"D\"\
    \ 代表 destination 目的地）。当 `%RAX` 的值传输到内存后，该指令会将 `%RDI` 增加 8；如果 DF 标志为 0，则 `%RDI`\
    \ 现在指向内存中的下一个四字。如果 DF 标志为 1，则 `%RDI` 的值减少 8，此时 `%RDI` 指向内存中的前一个四字。还有一个等效的 `STOSL`\
    \ 指令，它存储双字（doublewords）并将 `%RDI` 增加或减少 4。\n\n如果在任何指令前加上 `REP` 前缀，它会导致该指令重复执行，直到\
    \ `%RCX` 寄存器的值减至 0。例如，我们可以编写一段简单的代码，理论上应该将“所有内存”清零（实际上由于访问违规会触发陷阱）：\n\n```assembly\n\
    xor %rax, %rax            # 填充 0\nmov $0, %rdi             # 起始地址 或 xor %rdi,\
    \ %rdi\nmov $0xffffffff / 4, %rcx # 0x1ffffff 个四字\nrep stosq\n```\n\n以下是 `REP\
    \ STOSQ` 的伪代码：\n\n```\nWHILE (RCX != 0)\n{\n    RAX -> (RDI)\n\n    IF DF = 0\
    \ THEN\n        RDI + 8 -> RDI\n    ELSE\n        RDI - 8 -> RDI\n\n    RCX -\
    \ 1 -> RCX\n}\n```\n\n图 x64.12.2 展示了一个擦除 32 字节（4x8）的简单示例。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_151_0.png)\n\
    图 x64.12.2\n\n## 测试是否为 0\n\n如果指令结果为 0，则 `%RFLAGS` 寄存器中的 ZF 位被设置为 1，否则被清除。该位受以下指令影响：\n\
    \n- 算术指令（例如 `ADD`, `SUB`, `MUL`）\n- 逻辑比较指令 (`TEST`)\n- “算术”比较指令 (`CMP`)\n\nZF\
    \ 位的位置如图 x64.12.3 所示。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_152_0.png)\n\
    图 x64.12.3\n"
