    \ values, so **inc** is unambiguous.\n\nIn GDB disassembly output, we may see\
    \ the same instruction:\n\n```\ninc\t %eax\n\nor\n\nadd\t $0x1,%eax\t # a compiler\
    \ may decide to use ADD instead of INC\n```"
