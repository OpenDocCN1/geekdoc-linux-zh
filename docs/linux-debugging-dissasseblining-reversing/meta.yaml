    # Testing for 0


    ZF bit in %RFLAGS register is set to 1 if the instruction result is 0 and cleared
    otherwise. This bit is affected by:


    +   - Arithmetic instructions (for example, ADD, SUB, MUL)

    - Logical compare instruction (TEST)

    - “Arithmetical” compare instruction (CMP)


    The location of the ZF bit is shown in Picture x64.12.3.


    ![](img/47fe95ac2b05f9cf0a4cad33d8640c96_152_0.png)


