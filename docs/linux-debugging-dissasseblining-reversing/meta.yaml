  md: '# Registers Revisited


    %RAX, %RBX, %RCX, %RDX 64-bit registers can be used as pointers to memory. They
    contain x86 32-bit registers %EAX, %EBX, %ECX, and %EDX. These 32-bit parts contain
    old 16-bit registers %AX, %BX, %CX, and %DX (each can hold a word). %CX register
    was often used as a loop counter, (Counter)X, in the assembly language corresponding
    to simple loops in C and C++ code


    ```

    ```cpp

    for (int i = 0; i < N; ++i)

    ```

    ```


    but modern C and C++ compilers may choose to use any other register or even a
    memory location for such a purpose.'
