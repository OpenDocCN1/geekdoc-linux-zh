  mdcn: "\n## TEST - 逻辑比较\n\n该指令计算两个操作数之间的按位逻辑与（AND），并根据计算结果（结果将被丢弃）设置标志位（包括 ZF）：\n\
    \n```\nTEST reg/imm, reg/mem\n```\n\n示例：\n\n```\nTEST %EDX, %EDX\n```\n\n假设 %EDX\
    \ 寄存器包含 4 ($100_{bin}$)\n\n```\n100_{bin} AND 100_{bin} = 100_{bin}  != 0 (ZF\
    \ 被清除)\n```\n\n```\nTEST $1, %EDX\n```\n\n假设 %EDX 包含 0 ($0_{bin}$)\n\n```\n0_{bin}\
    \ AND 1_{bin} = 0_{bin}  == 0 (ZF 被设置)\n```\n\n以下是 TEST 指令的伪代码（省略了与 ZF 位无关的细节）：\n\
    \n```\nTEMP := OPERAND1 AND OPERAND2\nIF TEMP = 0 THEN\n    1 -> ZF\nELSE\n  \
    \  0 -> ZF\n```\n\n## CMP – 比较两个操作数\n\n该指令将第一个操作数与第二个操作数进行比较，并根据计算结果（结果将被丢弃）设置标志位（包括\
    \ ZF）。比较是通过从第二个操作数中减去第一个操作数来执行的（类似于 SUB 指令：sub $4, %eax）。\n\n```\nCMP reg/imm,\
    \ reg/mem\nCMP reg/mem/imm, reg\n```\n\n示例：\n\n```\nCMP $0, %EDI\n```\n\n假设 %EDI\
    \ 包含 0\n\n0 - 0 == 0 (ZF 被设置)\n\n```\nCMP $0x16, %EAX\n```\n\n假设 %EAX 包含 4hex\n\
    \n4hex - 16hex = FFFFFFEEhex != 0 (ZF 被清除)\n4dec - 22dec = -18dec\n\n以下是 CMP 指令的伪代码（省略了与\
    \ ZF 位无关的细节）：\n\n```\nOPERAND2 - OPERAND1 -> TEMP\nIF TEMP = 0 THEN\n    1 ->\
    \ ZF\nELSE\n    0 -> ZF\n```\n\nCMP 指令等同于以下伪代码序列：\n\n```\nOPERAND2 -> TEMP\nSUB\
    \ OPERAND1, TEMP\n```\n\n## TEST 还是 CMP？\n\n如果我们想测试是否为零，这两条指令是等效的，但 CMP 指令比 TEST\
    \ 影响更多的标志位：\n\n```\nTEST %EAX, %EAX\nCMP $0, %EAX\n```\n\nCMP 指令用于比较是否不等（TEST\
    \ 指令在此不能使用）：\n\n```\nCMP $0, %EAX  # > 0 或 < 0 ?\n```\n\nTEST 指令用于检查单个位是否被设置：\n\
    \n```\nTEST $2, %EAX  # 2 == 0010bin 或在 C 语言中：if (var & 0x2)\n```\n\n当 %EAX 值为\
    \ 2 时的示例：\n\n```\nTEST $2, %EAX  # 0010bin AND 0100bin = 0000bin (ZF 被设置)\nTEST\
    \ $6, %EAX  # 0010bin AND 0110bin = 0010bin (ZF 被清除)\n```\n\n## 条件跳转\n\n考虑这两段\
    \ C 或 C++ 代码片段：\n\nCPU 顺序获取指令，因此我们必须告诉 CPU，如果某些条件（不）满足（例如，如果 a != 0），我们希望跳过某些指令。\n\
    \nJNZ（如果不为零则跳转）和 JZ（如果为零则跳转）测试 ZF 标志，如果 JNZ 的 ZF 位被清除或 JZ 的 ZF 位被设置，则更改 %RIP。以下汇编语言代码等同于上述\
    \ C/C++ 代码：\n\n```asm\nCMP  $0, A          MOV  A, %EAX\nJNZ  label1         TEST\
    \ %EAX, %EAX\nINC  A              JZ   label1\nJMP  label2         INC  %EAX\n\
    label1: DEC  A      JMP  label2\nlabel2:             label1: DEC  %EAX\n     \
    \                label2:\n```\n\n## 寄存器的结构\n\n一些 64 位寄存器具有遗留结构，允许我们访问其较低的 32 位、16\
    \ 位和两个 8 位部分，如图 x64.12.4 所示。\n\n![](img/47fe95ac2b05f9cf0a4cad33d8640c96_157_0.png)\n\
    \n图 x64.12.4\n\n## 函数返回值\n\n许多函数通过 %RAX 寄存器返回结果。例如：\n\n```cpp\nlong func();\n\
    ```\n\n返回值在 %RAX 中。\n\n```cpp\nbool func();\n```\n\n返回值在 %EAX 中。\n\n虽然 bool 值在内存中占用一个字节，但编译器可能会使用\
    \ %EAX 而不是 %AL。\n\n## 使用字节寄存器\n\n假设我们在 %AL 寄存器中有一个字节值，并希望将此值加到 %ECX 寄存器中。然而，我们不知道完整\
    \ %EAX 寄存器的其他部分包含什么值。我们不能使用如下指令，例如：\n\n```\nMOV %AL, %EBX # 操作数大小冲突\n```\n\n伪代码中提出的解决方案：\n\
    \n```\nAL -> EBX or AL -> EAX\nECX + EBX -> ECX ECX + EAX -> ECX\n```\n\n我们只能使用源和目的地的操作数大小相同的\
    \ MOV 指令，例如：\n\n```\nMOV %AL, %BL\nMOV %AL, b # 在 C 中：static bool b = func()\n\
    ```\n\n针对此任务，有一个特殊的 MOVZX（零扩展移动）指令，它用第一个操作数的内容替换第二个操作数的内容，同时将剩余的位填充为零：\n\n```\n\
    MOVZX reg/mem, reg\n```\n\n因此，我们该任务的解决方案变得非常简单：\n\n```\nMOVZX %AL, %EBX\nADD %EBX,\
    \ %ECX\n```\n\n我们也可以复用 %EAX 寄存器：\n\n```\nMOVZX %AL, %EAX\nADD %EAX, %ECX\n```\n\
    \n## 第 x64.13 章：函数指针参数\n\n### “FunctionPointerParameters” 项目\n\n这是我们的最终项目，可以从以下地址下载：\n\
    \nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter13/\n\
    \n项目源代码摘要：\n\n```cpp\n// FunctionParameters.cpp\nint main(int argc, char* argv[])\n\
    {\n    int a, b;\n\n    printf(\"Enter a and b: \");\n    scanf(\"%d %d\", &a,\
    \ &b);\n\n    if (arithmetic (a, &b))\n    {\n        printf(\"Result = %d\",\
    \ b);\n    }\n\n    return 0;\n}\n```\n\n```cpp\n// Arithmetic.cpp\nbool arithmetic\
    \ (int a, int *b)\n{\n    if (!b)\n    {\n        return false;\n    }\n\n   \
    \ *b = *b + a;\n    ++a;\n    *b = *b * a;\n\n    return true;\n}\n```\n\n###\
