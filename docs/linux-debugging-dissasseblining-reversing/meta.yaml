  md: '# # Chapter x64.14: Summary of Code Disassembly Patterns


    This final chapter summarizes the various patterns we have encountered during
    the reading of this book.


    # ## Function Prolog / Epilog


    # ### Function prolog


    ```

    ```assembly

    push %rbp

    mov %rsp,%rbp

    ```

    ```


    # ### Function epilog


    ```

    ```assembly

    mov %rbp,%rsp

    pop %rbp

    ret

    ```

    ```


    This is equivalent to:


    ```

    ```assembly

    leave

    ret

    ```

    ```


    Some code may omit to restore %RSP if it does not change:


    ```

    ```assembly

    pop %rbp

    ret

    ```

    ```


    Knowing prolog can help in identifying situations when symbol files or function
    start addresses are not correct. For example, suppose we have the following backtrace:


    ```

    ```text

    func3+0x05F

    func2+0x08F

    func+0x20

    ```

    ```


    If we disassemble the `func2` function and see that it does not start with prolog,
    we may assume that backtrace needs more attention:


    ```

    ```text

    (gdb) x/2i func2

    0x555555555165 <main+32>: lea -0x8(%rbp),%rdx

    0x555555555169 <main+36>: lea -0x4(%rbp),%rax

    ```

    ```


    In optimized code, %RSP may be used to address local variables and parameters
    instead of %RBP. In such a case, prolog and epilog may be partially missing. Here
    is an example from the `printf` function:'
