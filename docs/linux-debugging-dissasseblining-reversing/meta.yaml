    \ values on top of the stack, and then reconstructs this call stack:\n\n```\n\
    func3\nfunc2\nfunc\n```\n\nThe debugger gets address ranges corresponding to `func`,\
    \ `func2`, and `func3` from the so-called symbolic information, which may be either\
    \ stored inside an executable file or in some external file that needs to be referenced\
    \ explicitly.\n\n## Exploring Stack in GDB\n\nTo see call stack in real action,\
