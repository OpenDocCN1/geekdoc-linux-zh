    Picture x64.4.3\n\n## Adding Numbers Using Pointers\n\nNow we look at the next\
    \ pseudo-code statement:\n\n```\n(rbx) + (rax) -> (rbx)\n```\n\nRecall that (rax)\
    \ and (rbx) mean contents of memory cells whose addresses (locations) are stored\
    \ in %RAX and %RBX CPU registers. The statement above is equivalent to the following\
    \ C or C++ language expression where ‘*’ operator means to get memory contents\
    \ pointed to by pa or pb pointer (also called pointer dereference):\n\n```\n*pb\
    \ = *pb + *pa;\n```\n\nIn assembly language, we use the instruction ADD for the\
