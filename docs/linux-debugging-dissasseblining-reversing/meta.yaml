    # # Chapter x64.6: Pointers to Memory


    # ## Pointers Revisited


    The pointer is a memory cell or a register that contains the address of another
    memory cell. Memory pointers have their own addresses because they are memory
    cells too. On 32-bit Linux, pointers are 32-bit, and on 64-bit Linux, pointers
    are 64-bit.'
  - '[PAGE 68]


    # # Addressing Types


    As we have seen in Chapter x64.5, memory cells can be of one byte, word, doubleword,
    or quadword sizes. Therefore, we can have a pointer to a byte, a pointer to a
    word, a pointer to a doubleword, and a pointer to a quadword. GDB disassembly
    output in Chapter x64.4 has 1 suffixes in instructions involving pointers to memory
    that hold 32-bit (doubleword size) values.


    Here are some illustrated examples:


    ```

    ```

    movb $0xFF, (%rax)

    ```

    ```


    The layout of memory before `movb` instruction execution is shown in Picture x64.6.1,
    and the layout of memory after execution is shown in Picture x64.6.2.


    ```

    ```

    movw $0xFF, (%rax)

    movl $0xFF, (%rax)

    movq $0xFF, (%rax)

    ```

    ```


    We need to prefix 0xFF with $ to differentiate it from 0xFF as a memory address.


    The layout of memory after the execution of `movl` instruction is shown in Picture
    x64.6.3. We can see that, although we specify just a byte value 0xFF as a source
    operand to `movl` instruction, it replaces all other 3 bytes of a doubleword in
    memory because we specify the destination as a pointer to 4 bytes and, 0xFF is
    0x000000FF as a doubleword. So we need to specify `l` suffix to disambiguate moving
    a doubleword value from moving a byte value. The compiler complains if we forget
    and use `mov`:


    ```

    ```

    Error: no instruction mnemonic suffix given and no register operands; can''t size
    instruction

    ```

    ```


    Because 64-bit (quadword) registers may point to quadword memory cells, we need
    to specify `q` to disambiguate moving a quadword value from moving a byte value
    even if we specify a constant with all leading zeros:


    ```

    ```

    movq $0x00000000000000FF, (%rax)

    ```

    ```


    However, if we want to move a word value only, we need to specify the `w` suffix:


    ```

    ```

    movw $0xFF, (%rax)

    ```

    ```


    This is equivalent to:


    ```

    ```

    movw $0x00FF, (%rax)

    ```

    ```


    Picture x64.6.4 shows a summary of various addressing modes.'
- md: "Picture x64.6.1\n\nPicture x64.6.2\n\nPicture x64.6.3\n\nPicture x64.6.4\n\n\
    ## Registers Revisited\n\n%RAX, %RBX, %RCX, %RDX 64-bit registers can be used\
    \ as pointers to memory. They contain x86 32-bit registers %EAX, %EBX, %ECX, and\
    \ %EDX. These 32-bit parts contain old 16-bit registers %AX, %BX, %CX, and %DX\
    \ (each can hold a word). %CX register was often used as a loop counter, (Counter)X,\
    \ in the assembly language corresponding to simple loops in C and C++ code:\n\n\
    ```cpp\nfor (int i = 0; i < N; ++i)\n```\n\nbut modern C and C++ compilers may\
    \ choose to use any other register or even a memory location for such a purpose.\n\
    \n## NULL Pointers\n\nAddresses 0x0000000000000000 – 0x000000000000FFFF are specifically\
    \ made inaccessible on Linux. The following code will force an application crash\
    \ or kernel panic if executed inside a driver:\n\n```assembly\nmov $0xF, %rax\n\
    movb $1, (%rax) # Access violation\n```\n\n## Invalid Pointers\n\nThere are different\
    \ kinds of invalid pointers that cause an access violation when we try to dereference\
    \ them:\n\n- NULL pointers\n- Pointers to inaccessible memory\n- Pointers to read-only\
    \ memory when writing\n\nOther pointers may or may not cause an access violation,\
    \ and some of them are discussed in subsequent chapters:\n\n- Pointers pointing\
    \ to \"random\" memory\n- Uninitialized pointers having random value inherited\
    \ from past code execution\n- Dangling pointers\n\nThe latter pointers are similar\
    \ to pointers pointing to \"random\" memory locations and arise when we forget\
    \ to set pointer variables to zero (NULL) after disposing of memory they point\
    \ to. By nullifying pointers, we indicate that they no longer point to memory.\n\
    \n## Variables as Pointers\n\nSuppose we have two memory addresses (locations)\
    \ \"a\" and \"b\" declared and defined in C and C++ as:\n\n```cpp\nint a, b;\n\
    ```\n\nThese are normal variables \"a\" and \"b\". Also, we can have another two\
    \ memory addresses (locations) \"pa\" and \"pb\" declared and defined in C and\
    \ C++ as:\n\n```cpp\nint *pa, *pb;\n```\n\nHere **pa** is a pointer to an int\
    \ or, in other words, the memory cell **pa** contains the address of another memory\
    \ cell that contains an integer value.\n\n## Pointer Initialization\n\nIn order\
    \ to have pointers to point to memory we need to initialize them with corresponding\
    \ memory addresses. Here is typical C or C++ code that does what we need:\n\n\
    ```cpp\nint a;             // uninitialized variable\nint *pa;           // uninitialized\
    \ pointer\npa = &a;           // (pa) now contains the address a\nint b = 12;\
    \        // initialized variable\nint *pb = &b;      // initialized pointer\n\
    ```\n\nWe see that pointers are also variables and can change their values effectively\
    \ pointing to different memory locations during program execution.\n\n## Initialized\
    \ and Uninitialized Data\n\nHere is a bit of additional information about initialized\
    \ and uninitialized variables that is useful to know: an executable program in\
    \ Linux is divided into different sections. One is called .data, where all global\
    \ and static variables (including pointers) are put.\n\nConsider this C or C++\
    \ data definition:\n\n```cpp\nint array[1000000]; // size 4,000,000 bytes or 3.8Mb\n\
    ```\n\nWe would expect the size of an executable file to be about 4Mb. However,\
    \ the program size on a disk is only 16Kb. It is because the uninitialized array\
    \ contains only information about its size. When we launch the program, this array\
    \ is recreated from its size information and filled with zeroes. The size of the\
    \ program in memory becomes about 4Mb.\n\nIn the case of the initialized array\
    \ the program size on disk is 4.01Mb:\n\n```cpp\nint array[1000000] = { 12 };\n\
    ```\n\nThis is because the array was put into a .data section and contains the\
    \ following sequence of integers { 12, 0, 0, 0, 0 ... }.\n\n## More Pseudo Notation\n\
    \nWe remind that **(a)** means contents of memory at the address **a**, **(rax)**\
    \ means contents of a 32-bit memory cell at the address stored in %RAX register\
    \ (here %RAX is a pointer).\n\nWe also introduce an additional notation to employ\
    \ in this and subsequent chapters: **\\*(pa)** means contents at the address stored\
    \ at the address **pa** and is called dereferencing a pointer whose address is\
    \ **pa**. The corresponding C/C++ code is similar:\n\n```cpp\nint *pa = &a;\n\
    int b = *pa;\n```\n\n## “MemoryPointers” Project: Memory Layout\n\nThis project\
    \ is very similar to the “Pointers” project from Chapter x64.4. We have this data\
    \ declaration and definition in C or C++ language:\n\n```cpp\nint a, b;\nint *pa,\
    \ *pb = &b;\n```\n\nThe project code corresponds to the following pseudo-code\
    \ and assembly language:\n\n| Pseudo-code | Assembly |\n| :--- | :--- |\n| address\
    \ a -> (pa) | lea a, %rax <br> mov %rax, pa |\n| 1 -> \\*(pa) ; (a) = 1 | mov\
    \ pa, %rax <br> movl $1, (%rax) |\n| 1 -> \\*(pb) ; (b) = 1 | mov pb, %rbx <br>\
    \ movl $1, (%rbx) |\n| \\*(pb) + \\*(pa) -> \\*(pb) ; (b) = 2 | mov (%rax), %ecx\
    \ <br> add (%rbx), %ecx <br> mov %ecx, (%rbx) |\n\nThe source code for this chapter\
    \ can be downloaded from:\nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter6/\n\
    \nWe compile and link it, load the executable into GDB as described in chapter\
    \ x64.4. We get the following output:\n\n```bash\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ as MemoryPointers.asm -o MemoryPointers.o\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ ld MemoryPointers.o -o MemoryPointers\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ gdb ./MemoryPointers\nGNU gdb (Debian 8.2.1-2+bj3) 8.2.1\nCopyright (C) 2018\
    \ Free Software Foundation, Inc.\nLicense GPLv3+: GNU General Public version 3\
    \ or later <http://gnu.org/licenses/gpl.html>\nThis is free software: you are\
    \ free to change and redistribute it.\nThere is NO WARRANTY, to the extent permitted\
    \ by law.\nType \"show copying\" and \"show warranty\" for details.\nThis GDB\
    \ was configured as \"x86_64-linux-gnu\".\nType \"show configuration\" for configuration\
    \ details.\n\nFor bug reporting instructions, please see:\n<http://www.gnu.org/software/gdb/bugs/>.\n\
    \nFind the GDB manual and other documentation resources online at:\n<http://www.gnu.org/software/gdb/documentation/>.\n\
    \nFor help, type \"help\".\n\nType \"apropos word\" to search for commands related\
    \ to \"word\"…\nReading symbols from ./MemoryPointers…{(no debugging symbols found)}…done.\n\
    (gdb)\n```\n\nThen we put a breakpoint on the `main` function and run the program\
    \ until GDB breaks in:\n\n```bash\n(gdb) break main\nBreakpoint 1 at 0x401000\n\
    \n(gdb) run\nStarting program: /home/coredump/pflddr/x64/Chapter6/MemoryPointers\n\
    ```\n\nBreakpoint 1, 0x0000000000401000 in `_start ()`\n\nWe disassemble the main\
    \ function:\n\n```bash\n(gdb) disass main\nDump of assembler code for function\
    \ _start:\n=> 0x0000000000401000 <+0>:  lea 0x402000,%rax\n   0x0000000000401008\
    \ <+8>:  mov %rax,0x402008\n   0x0000000000401010 <+16>: mov 0x402008,%rax\n \
    \  0x0000000000401018 <+24>: movl $0x1,(%rax)\n   0x000000000040101e <+30>: mov\
    \ 0x402010,%rbx\n   0x0000000000401026 <+38>: movl ($rax),(%rbx)\n   0x000000000040102c\
    \ <+44>: mov (%rax),%ecx\n   0x000000000040102e <+46>: add (%rbx),%ecx\n   0x0000000000401030\
    \ <+48>: mov %ecx,(%rbx)\n   0x0000000000401032 <+50>: mov $0x3c,%rax\n   0x0000000000401039\
    \ <+57>: mov $0x0,%rdi\n   0x0000000000401040 <+64>: syscall\n\nEnd of assembler\
    \ dump.\n```\n\nThen we clear %RAX, %RBX, and %RCX registers to set up a memory\
    \ layout that is easy to follow:\n\n```bash\n(gdb) set $rax = 0\n(gdb) set $rbx\
    \ = 0\n(gdb) set $rcx = 0\n(gdb) info registers $rax $rbx $rcx\nrax\t\t0x0\t\t\
    0\nrbx\t\t0x0\t\t0\nrcx\t\t0x0\t\t0\n```\n\nWe also instruct GDB to automatically\
    \ display the current instruction to be executed, the values of registers %RAX,\
    \ %RBX, %RCX, and the contents of variables “a”, “b”, “pa”, “pb”:\n\n```bash\n\
    (gdb) display/i $rip\n1: x/i $rip\n=> 0x401000 <_start>: lea 0x402000,%rax\n\n\
    (gdb) display/x $rax\n2: /x $rax = 0x0\n\n(gdb) display/x $rbx\n3: /x $rbx = 0x0\n\
    \n(gdb) display/x $rcx\n4: /x $rcx = 0x0\n\n(gdb) display/x (int)a\n5: /x (int)a\
    \ = 0x0\n\n(gdb) display/x (int)b\n6: /x (int)b = 0x0\n\n(gdb) display/x (long)pa\n\
    7: /x (long)pa = 0x0\n\n(gdb) display/x (long)pb\n8: /x (long)pb = 0x402004\n\
    ```"
  mdcn: "\n图片 x64.6.1\n\n图片 x64.6.2\n\n图片 x64.6.3\n\n图片 x64.6.4\n\n## 重温寄存器\n\n%RAX,\
    \ %RBX, %RCX, %RDX 这些 64 位寄存器可以用作内存指针。它们包含 x86 32 位寄存器 %EAX, %EBX, %ECX 和 %EDX。而这些\
    \ 32 位部分又包含旧的 16 位寄存器 %AX, %BX, %CX 和 %DX（每个可持有-一个字）。在与 C 和 C++ 代码中简单循环相对应的汇编语言中，%CX\
    \ 寄存器经常被用作循环计数器 (Counter)X：\n\n```cpp\nfor (int i = 0; i < N; ++i)\n```\n\n但现代\
    \ C 和 C++ 编译器可能会选择使用任何其他寄存器，甚至使用内存位置来实现此目的。\n\n## 空指针 (NULL Pointers)\n\n在 Linux\
    \ 上，地址 0x0000000000000000 – 0x000000000000FFFF 被专门设置为不可访问。如果在驱动程序内部执行以下代码，将强制应用程序崩溃或导致内核恐慌\
    \ (kernel panic)：\n\n```assembly\nmov $0xF, %rax\nmovb $1, (%rax) # 访问违例\n```\n\
    \n## 无效指针 (Invalid Pointers)\n\n存在不同类型的无效指针，当我们尝试对其解引用时会引起访问违例：\n\n- 空指针 (NULL\
    \ pointers)\n- 指向不可访问内存的指针\n- 写入时指向只读内存的指针\n\n其他指针可能会或不会引起访问违例，其中一些将在后续章节中讨论：\n\
    \n- 指向“随机”内存的指针\n- 具有从过去代码执行中继承的随机值的未初始化指针\n- 野指针 (Dangling pointers)\n\n后者与指向“随机”内存位置的指针类似，当我们忘记在释放指针所指向的内存后将其指针变量设为零\
    \ (NULL) 时就会出现。通过将指针置空，我们表明它们不再指向任何内存。\n\n## 作为指针的变量\n\n假设我们在 C 和 C++ 中声明并定义了两个内存地址（位置）“a”和“b”：\n\
    \n```cpp\nint a, b;\n```\n\n这些是普通的变量“a”和“b”。同样，我们可以在 C 和 C++ 中声明并定义另外两个内存地址（位置）“pa”和“pb”：\n\
    \n```cpp\nint *pa, *pb;\n```\n\n这里 **pa** 是一个指向 int 的指针，换句话说，内存单元 **pa** 包含了另一个内存单元的地址，而该单元包含一个整数值。\n\
    \n## 指针初始化\n\n为了让指针指向内存，我们需要用相应的内存地址对其进行初始化。以下是实现此需求的典型 C 或 C++ 代码：\n\n```cpp\n\
    int a;             // 未初始化变量\nint *pa;           // 未初始化指针\npa = &a;         \
    \  // (pa) 现在包含地址 a\nint b = 12;        // 已初始化变量\nint *pb = &b;      // 已初始化指针\n\
    ```\n\n我们可以看到，指针也是变量，并且可以在程序执行期间更改其值，从而有效地指向不同的内存位置。\n\n## 已初始化和未初始化数据\n\n这里有一些关于已初始化和未初始化变量的补充信息，了解这些很有用：Linux\
    \ 中的可执行程序被分为不同的节 (section)。其中一个称为 `.data`，所有的全局变量和静态变量（包括指针）都放在这里。\n\n考虑这个 C 或\
    \ C++ 数据定义：\n\n```cpp\nint array[1000000]; // 大小为 4,000,000 字节或 3.8Mb\n```\n\n\
    我们可能会预期可执行文件的大小约为 4Mb。然而，磁盘上的程序大小仅为 16Kb。这是因为未初始化的数组仅包含关于其大小的信息。当我们启动程序时，该数组会根据其大小信息被重新创建并用零填充。此时程序在内存中的大小变为约\
    \ 4Mb。\n\n在已初始化数组的情况下，磁盘上的程序大小为 4.01Mb：\n\n```cpp\nint array[1000000] = { 12 };\n\
    ```\n\n这是因为该数组被放入了 `.data` 节，并包含以下整数序列 { 12, 0, 0, 0, 0 ... }。\n\n## 更多伪代码符号\n\
    \n提醒一下，**(a)** 表示地址 **a** 处的内存内容，**(rax)** 表示存储在 %RAX 寄存器中的地址处的 32 位内存单元的内容（这里\
    \ %RAX 是一个指针）。\n\n我们还引入一个将在本章及后续章节中使用的额外符号：**\\*(pa)** 表示存储在地址 **pa** 处的地址所指向的内容，这被称为对地址为\
    \ **pa** 的指针进行解引用。对应的 C/C++ 代码类似：\n\n```cpp\nint *pa = &a;\nint b = *pa;\n```\n\
    \n## “MemoryPointers” 项目：内存布局\n\n这个项目与 x64.4 章中的 “Pointers” 项目非常相似。我们在 C 或 C++\
    \ 语言中拥有如下数据声明和定义：\n\n```cpp\nint a, b;\nint *pa, *pb = &b;\n```\n\n项目代码对应于以下伪代码和汇编语言：\n\
    \n| 伪代码 | 汇编 |\n| :--- | :--- |\n| address a -> (pa) | lea a, %rax <br> mov %rax,\
    \ pa |\n| 1 -> \\*(pa) ; (a) = 1 | mov pa, %rax <br> movl $1, (%rax) |\n| 1 ->\
    \ \\*(pb) ; (b) = 1 | mov pb, %rbx <br> movl $1, (%rbx) |\n| \\*(pb) + \\*(pa)\
    \ -> \\*(pb) ; (b) = 2 | mov (%rax), %ecx <br> add (%rbx), %ecx <br> mov %ecx,\
    \ (%rbx) |\n\n本章的源代码可以从此处下载：\nhttps://bitbucket.org/softwarediagnostics/pflddr/src/master/x64/Chapter6/\n\
    \n我们对其进行编译和链接，并按照 x64.4 章中所述将可执行文件加载到 GDB 中。我们得到以下输出：\n\n```bash\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ as MemoryPointers.asm -o MemoryPointers.o\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ ld MemoryPointers.o -o MemoryPointers\ncoredump@DESKTOP-1S6V2L0::~/pflddr/x64/Chapter6$\
    \ gdb ./MemoryPointers\nGNU gdb (Debian 8.2.1-2+bj3) 8.2.1\nCopyright (C) 2018\
    \ Free Software Foundation, Inc.\nLicense GPLv3+: GNU General Public version 3\
    \ or later <http://gnu.org/licenses/gpl.html>\nThis is free software: you are\
    \ free to change and redistribute it.\nThere is NO WARRANTY, to the extent permitted\
    \ by law.\nType \"show copying\" and \"show warranty\" for details.\nThis GDB\
    \ was configured as \"x86_64-linux-gnu\".\nType \"show configuration\" for configuration\
    \ details.\n\nFor bug reporting instructions, please see:\n<http://www.gnu.org/software/gdb/bugs/>.\n\
    \nFind the GDB manual and other documentation resources online at:\n<http://www.gnu.org/software/gdb/documentation/>.\n\
    \nFor help, type \"help\".\n\nType \"apropos word\" to search for commands related\
    \ to \"word\"…\nReading symbols from ./MemoryPointers…{(no debugging symbols found)}…done.\n\
    (gdb)\n```\n\n然后我们在 `main` 函数处设置断点，并运行程序直到 GDB 停止：\n\n```bash\n(gdb) break main\n\
    Breakpoint 1 at 0x401000\n\n(gdb) run\nStarting program: /home/coredump/pflddr/x64/Chapter6/MemoryPointers\n\
    ```\n\nBreakpoint 1, 0x0000000000401000 in `_start ()`\n\n我们反汇编 main 函数：\n\n```bash\n\
    (gdb) disass main\nDump of assembler code for function _start:\n=> 0x0000000000401000\
    \ <+0>:  lea 0x402000,%rax\n   0x0000000000401008 <+8>:  mov %rax,0x402008\n \
    \  0x0000000000401010 <+16>: mov 0x402008,%rax\n   0x0000000000401018 <+24>: movl\
    \ $0x1,(%rax)\n   0x000000000040101e <+30>: mov 0x402010,%rbx\n   0x0000000000401026\
    \ <+38>: movl ($rax),(%rbx)\n   0x000000000040102c <+44>: mov (%rax),%ecx\n  \
    \ 0x000000000040102e <+46>: add (%rbx),%ecx\n   0x0000000000401030 <+48>: mov\
    \ %ecx,(%rbx)\n   0x0000000000401032 <+50>: mov $0x3c,%rax\n   0x0000000000401039\
    \ <+57>: mov $0x0,%rdi\n   0x0000000000401040 <+64>: syscall\n\nEnd of assembler\
    \ dump.\n```\n\n然后我们清除 %RAX, %RBX 和 %RCX 寄存器，以建立一个易于跟踪的内存布局：\n\n```bash\n(gdb)\
    \ set $rax = 0\n(gdb) set $rbx = 0\n(gdb) set $rcx = 0\n(gdb) info registers $rax\
    \ $rbx $rcx\nrax\t\t0x0\t\t0\nrbx\t\t0x0\t\t0\nrcx\t\t0x0\t\t0\n```\n\n我们还指令 GDB\
    \ 自动显示当前将要执行的指令，%RAX, %RBX, %RCX 寄存器的值，以及变量 “a”, “b”, “pa”, “pb” 的内容：\n\n```bash\n\
    (gdb) display/i $rip\n1: x/i $rip\n=> 0x401000 <_start>: lea 0x402000,%rax\n\n\
    (gdb) display/x $rax\n2: /x $rax = 0x0\n\n(gdb) display/x $rbx\n3: /x $rbx = 0x0\n\
    \n(gdb) display/x $rcx\n4: /x $rcx = 0x0\n\n(gdb) display/x (int)a\n5: /x (int)a\
    \ = 0x0\n\n(gdb) display/x (int)b\n6: /x (int)b = 0x0\n\n(gdb) display/x (long)pa\n\
    7: /x (long)pa = 0x0\n\n(gdb) display/x (long)pb\n8: /x (long)pb = 0x402004\n\
    ```\n"
