    \ $0\n```\n\n## POP instruction\n\nWe can pop a value stored on the top of a stack\
    \ to a register or a memory address:\n\n```\nPOP r/mem\n```\n\nHere is POP simplified\
    \ pseudo-code adopted from the Intel manual:\n\n```\nIF OperandSize = 64\n   \
    \ THEN\n        (%RSP) -> OperandValue ; quadword\n        %RSP + 8 -> %RSP\n\
    \    ELSE\n        (%RSP) -> OperandValue ; word\n        %RSP + 2 -> %RSP\nFI\n\
    ```\n\nExamples:\n\n```\npop %rax\npopw (%rbx)\n```\n\n## Register Review\n\n\
    So far, we have seen and used general-purpose CPU registers:\n\n- %RAX (among\
    \ its specific uses is to contain function return values)\n- %RBX\n- %RCX\n- %RDX\n\
    \nWe also have special purpose registers:\n\n- %RIP (Instruction Pointer)\n- %RSP\
    \ (Stack Pointer)\n\nAMD64 and Intel EM64T architectures introduced additional\
    \ general purpose registers: %R8, %R9, %R10, %R11, %R12, %R13, %R14, %R15.\n\n\
    These additional registers are used a lot in the x64 code. More general-purpose\
    \ registers allow faster code execution because temporary computation results\
    \ can be stored instead of memory locations. Here is a disassembly from the `read`\
