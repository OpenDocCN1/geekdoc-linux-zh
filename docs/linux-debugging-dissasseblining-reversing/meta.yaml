    # LEA (Load Effective Address)


    The following instruction


    ```

    ```assembly

    lea -0x8(%rbp),%rdx

    ```

    ```


    is equivalent to the following arithmetic sequence:


    ```

    ```assembly

    mov %rbp, %rdx

    add -0x8, %rdx

    ```

    ```


    The following instruction


    ```

    ```assembly

    lea 0xea9(%rip),%rdi

    ```

    ```


    is equivalent to the following arithmetic sequence:


    ```

    ```assembly

    mov %rip, %rdi

    add 0xea9, %rdx

    ```

    ```'
- md: '## Passing Parameters


    **The first 6 function parameters from left to right**


    ```

    %RDI, %RSI, %RDX, %RCX, %R8, and %R9

    ```


    > Note: although we haven''t seen examples for more than 6 function parameters,
    they are passed via the stack, for example, via PUSH instruction.


    **Static/global variable address (or string constant)**


    ```assembly

    mov $0x555555556004, reg


    lea 0xe9d(%rip), reg

    ```


    **Local variable value vs. local variable address**


    ```assembly

    mov -XXX(%rbp), reg ; local variable value

    call func


    lea -XXX(%rbp), reg ; local variable address

    call func

    ```


    ## Accessing Parameters and Local Variables


    ### Local variable value


    ```assembly

    mov -XXX(%rbp), reg

    mov XXX(%rsp), reg # optimized code

    ```


    ### Local variable address


    ```assembly

    lea -XXX(%rbp), reg

    lea XXX(%rsp), reg # optimized code

    ```


    ### Accessing a doubleword value


    ```assembly

    mov -0x8(%rbp), %eax

    add $1, %eax

    addl $1, %rax

    ```


    ### Accessing a quadword value


    ```assembly

    mov -0x8(%rbp), %rax

    add $1, %rax

    ```


    ### Accessing and dereferencing a pointer to a doubleword value


    ```assembly

    mov -0x10(%rbp), %rax

    mov (%rax), %eax

    add $1, %eax

    ```


    ### Accessing and dereferencing a pointer to a quadword value


    ```assembly

    mov -0x10(%rbp), %rax

    mov (%rax), %rax

    add $1, %rax

    ```


    Optimized code may not use stack locations to address function parameters (use
    only registers through which the parameters were passed) as can be seen in the
    previous chapter example compiled with -O1 switch:


    ```

    (gdb) disass arithmetic

    Dump of assembler code for function _Z10arithmeticiPi:

    0x00005555555551ab <+0>:    test    %rsi,%rsi

    0x00005555555551ae <+3>:    je     0x5555555551c2 <_Z10arithmeticiPi+23>

    0x00005555555551b0 <+5>:    mov     %edi,%eax

    0x00005555555551b2 <+7>:    add     (%rsi),%eax

    0x00005555555551b4 <+9>:    add     $0x1,%edi

    0x00005555555551b7 <+12>:   imul    %eax,%edi

    0x00005555555551ba <+15>:   mov     %edi,(%rsi)

    0x00005555555551bc <+17>:   mov     $0x1,%eax

    0x00005555555551c0 <+19>:   retq

    0x00005555555551c2 <+22>:    mov     $0x0,%eax

    0x00005555555551c7 <+28>:   retq


    End of assembler dump.

    ```'
  mdcn: '

    ## 参数传递


    **从左到右的前 6 个函数参数**


    ```

    %RDI, %RSI, %RDX, %RCX, %R8, and %R9

    ```


    > 注意：虽然我们还没有看到超过 6 个函数参数的示例，但它们是通过栈传递的，例如通过 PUSH 指令。


    **静态/全局变量地址（或字符串常量）**


    ```assembly

    mov $0x555555556004, reg


    lea 0xe9d(%rip), reg

    ```


    **局部变量值 vs. 局部变量地址**


    ```assembly

    mov -XXX(%rbp), reg ; 局部变量值

    call func


    lea -XXX(%rbp), reg ; 局部变量地址

    call func

    ```


    ## 访问参数和局部变量


    ### 局部变量值


    ```assembly

    mov -XXX(%rbp), reg

    mov XXX(%rsp), reg # 优化后的代码

    ```


    ### 局部变量地址


    ```assembly

    lea -XXX(%rbp), reg

    lea XXX(%rsp), reg # 优化后的代码

    ```


    ### 访问双字（doubleword）值


    ```assembly

    mov -0x8(%rbp), %eax

    add $1, %eax

    addl $1, %rax

    ```


    ### 访问四字（quadword）值


    ```assembly

    mov -0x8(%rbp), %rax

    add $1, %rax

    ```


    ### 访问并解引用指向双字值的指针


    ```assembly

    mov -0x10(%rbp), %rax

    mov (%rax), %eax

    add $1, %eax

    ```


    ### 访问并解引用指向四字值的指针


    ```assembly

    mov -0x10(%rbp), %rax

    mov (%rax), %rax

    add $1, %rax

    ```


    优化后的代码可能不会使用栈位置来寻址函数参数（而仅使用传递参数的寄存器），正如在前一章中使用 `-O1` 开关编译的示例中所示：


    ```

    (gdb) disass arithmetic

    Dump of assembler code for function _Z10arithmeticiPi:

    0x00005555555551ab <+0>:    test    %rsi,%rsi

    0x00005555555551ae <+3>:    je     0x5555555551c2 <_Z10arithmeticiPi+23>

    0x00005555555551b0 <+5>:    mov     %edi,%eax

    0x00005555555551b2 <+7>:    add     (%rsi),%eax

    0x00005555555551b4 <+9>:    add     $0x1,%edi

    0x00005555555551b7 <+12>:   imul    %eax,%edi

    0x00005555555551ba <+15>:   mov     %edi,(%rsi)

    0x00005555555551bc <+17>:   mov     $0x1,%eax

    0x00005555555551c0 <+19>:   retq

    0x00005555555551c2 <+22>:    mov     $0x0,%eax

    0x00005555555551c7 <+28>:   retq


    End of assembler dump.

    ```

    '
