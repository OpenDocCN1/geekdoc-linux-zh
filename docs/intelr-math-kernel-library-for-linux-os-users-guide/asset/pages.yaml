  md: "See also:\n\n[Managing Multi-core Performance]().\n\n# Techniques to Set the\
    \ Number of Threads\n\nYou can employ different techniques to change the number\
    \ of threads to use in Intel MKL:\n\n+   - Set one of the OpenMP or Intel MKL\
    \ environment variables:\n  - OMP_NUM_THREADS\n  - MKL_NUM_THREADS\n  - MKL_DOMAIN_NUM_THREADS\n\
    - Call one of the OpenMP or Intel MKL functions:\n  - `omp_set_num_threads()`\n\
    \  - `mkl_set_num_threads()`\n  - `mkl_domain_set_num_threads()`\n\n \n\nWhen\
    \ choosing the appropriate technique, take into account the following rules:\n\
    \n+   - The Intel MKL threading controls take precedence over any environment\
    \ variables. The exception, which\nA call takes precedence of the previous rule,\
    \ is the OpenMP subroutine `omp_set_num_threads()`, which does not have precedence\
    \ over Intel MKL\nment variables, such as `MKL_NUM_THREADS`.\n- The environment\
    \ variables cannot be used to change run-time behavior in the course of the run,\
    \ because they are read only once at the first call to Intel MKL.\n\n# Avoiding\
    \ Conflicts in the Execution Environment\n\nCertain situations can cause conflicts\
    \ in the execution environment that make the use of threads in Intel MKL problematic.\
    \ First, this section briefly discusses the problems that exist.\n\nIf you thread\
    \ the program using OpenMP directives and compile the program with Intel® compilers,\
    \ Intel MKL will both use the same threading library. Intel MKL determines if\
    \ it is in a parallel region in the program, and if it is, it does not spread\
    \ its operations over multiple threads unless the user specifically requests Intel\
    \ MKL to do so via the `MKL_DYNAMIC` functionality (see [Using Additional Threading\
    \ Control]() for details). However, Intel MKL can be aware that it is in a parallel\
    \ region only if the threaded"
  merge: -1
