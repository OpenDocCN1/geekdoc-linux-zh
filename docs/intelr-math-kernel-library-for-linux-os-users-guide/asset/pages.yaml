- pgno: 8
  md: '# Overview


    The Intel® Math Kernel Library (Intel® MKL) offers highly optimized, thread-safe
    math routines for science, engineering, and financial applications that require
    maximum performance.


    # Technical Support


    Intel provides a support web site, which contains a rich repository of self help
    information, including getting started tips, known product issues, product errata,
    license information, user forums, and more. Visit the Intel® MKL support website
    at http://www.intel.com/software/products/support/


    # About This Document


    The Intel MKL User’s Guide provides usage information for the library. The usage
    information covers the organization, configuration, performance, and accuracy
    of Intel MKL, specifics of routine calls in mixed-language programming, linking,
    and more.


    This guide:


    +   - Focuses on the usage information needed to call Intel MKL routines from
    user''s applications running on the Linux* OS.

    - Describes OS-specific usage of Intel MKL, along with OS-independent features.

    - Contains usage information for all Intel MKL function domains, listed in Table-1
    (in Appendix A).


    +   - Assumes you have completed the installation of Intel MKL on your system.
    If you have not completed the installation, see the Intel® Math Kernel Library
    Installation Guide (file Install.txt).


    To reference how to use the library in your application, use this guide in conjunction
    with the following documents:'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 1 Intel® Math Kernel Library User''s Guide


    +   * The Intel MKL Reference Manual, which provides reference information on
    routine functionalities, parameter descriptions, interfaces, calling syntaxes,
    and return values.

    * The Intel® Math Kernel Library for Linux * Release Notes.


    This User''s Guide is intended to assist you in mastering the usage of Intel MKL
    on Linux. In particular, it:


    +   * Describes post-installation steps to help you start using the library

    * Shows you how to configure the library with your development environment

    * Acquaints you how to link your application to the library and provides simple
    usage scenarios

    * Explains how to code, compile, and run your application with Intel MKL for Linux.


    This guide is intended for Linux programmers from beginner to advanced experience
    in software development.


    # Document Organization


    The document contains the following chapters and appendices:


    Chapter 1 Overview. Introduces the Intel MKL usage information and describes this
    document''s notational conventions.


    Chapter 2 Getting Started. Describes post-installation steps and gives information
    needed to start using Intel MKL after its installation.


    Chapter 3 Intel® Math Kernel Library Structure. Discusses the structure of the
    Intel MKL directory after installation.


    Chapter 4 Configuring Your Development Environment. Explains how to configure
    Intel MKL with your development environment.


    Chapter 5 Linking Your Application with the Intel® Math Kernel Library. Explains
    how libraries should be linked with your application for your particular platform;
    discusses how to build custom dynamic libraries.


    Chapter 6 Managing Performance and Memory. Discusses Intel MKL threading; showing
    coding techniques and gives hardware configuration tips for improving performance
    of the library; explains features of the Intel MKL memory management and, in particular,
    shows how to replace memory functions that the library uses by default with your
    own ones.


    Chapter 7 Language-specific Usage Options. Discusses mixed-language programming
    and the use of language-specific interfaces.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Overview 1


    Chapter 8


    Coding Tips. Presents coding tips that may be helpful to your specific needs.


    Chapter 9


    Working with the Intel® Math Kernel Library Cluster Software. Discusses usage
    of ScalLAPACK and Cluster FFTs; in particular, describes linking of your application
    with these function domains, including C- and Fortran-specific linking examples;
    gives information on the supported MPI.


    Chapter 10


    Getting Assistance for Programming in the Eclipse* IDE. Discusses Intel MKL features
    that software engineers benefit from when working in the Eclipse* IDE.


    Chapter 11


    LINPACK and MP LINPACK Benchmarks. Discusses the Intel® Optimized LINPACK Benchmark
    for Linux* and Intel® Optimized MP LINPACK Benchmark for Clusters.


    Appendix A


    Intel® Math Kernel Library Language Interfaces Support. Summarizes information
    on language interfaces that Intel MKL provides for each function domain, including
    the respective header files.


    Appendix B


    Support for Third-Party Interfaces. Describes some interfaces that Intel MKL supports.


    The document also includes an Index.


    # Term and Notational Conventions


    The following term is used to refer to the operating system:


    +   * Linux* OS


    This term refers to information that is valid on all supported Linux* operating
    systems.


    The following notation is used in reference to Intel MKL directories:


    +   * <mkl_directory>


    The main directory where Intel MKL is installed. Replace this placeholder with
    the specific pathname in the configuring, linking, and building instructions.
    For more information, see Getting Started.


    +   * <Intel Compiler Pro directory>


    The installation directory for the Intel® C++ Compiler Professional Edition or
    Intel® Fortran Compiler Professional Edition. For more information, see Getting
    Started.


    1-3'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Intel® Math Kernel Library User''s Guide


    Table 1-1 lists the other notational conventions:


    | Table 1-1 Notational Conventions |


    | Italic | Italic is used for emphasis and also indicates document names in body
    text, for example:see Intel MKL Reference Manual |

    | Monospace lowercase | Indicates filenames, directory names and paths, for example:libmkl_core.a
    . /opt/mkl/10.2.004 |

    | Monospace lowercase mixed with uppercase | Indicates commands and command-line
    options, for example:icc myprog.c -LMKLPATH -LMKLINCLUDE -lmkl -lguide -lpthread
    ; C/C++ code fragments, for example:a = new double [SIZE][SIZE]; |

    | UPPERCASE MONOSPACE | Indicates system variables, for example, $MKLPATH |

    | Monospace italic | Indicates a parameter in discussions: routine parameters,
    for example, lda;functions_list;etc. When enclosed in angle brackets, indicates
    a placeholder for an identifier, an expression, a string or value,<mkl directory>.
    Substitute one of these items for the placeholder. |


    +   * items ] Square brackets indicate that the items enclosed in brackets are
    optional.

    * { item | } Braces indicate that only one of the items listed between brackets
    should be selected. A vertical bar (|) separates the items'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Getting Started


    This chapter provides some basic usage information and describes post-installation
    steps to help you start using the Intel® Math Kernel Library (Intel® MKL) on Linux*
    OS.


    # Before You Begin


    Before you begin using Intel MKL, learning a few important concepts will help
    you get off to a good start, as shown in Table 2-1.


    | Table 2-1 | What You Need to Know Before You Begin |

    |--- |--- |

    | Target platform | - IA-32 or compatible

    - Intel® 64 or compatible

    - IA-64 (Itanium® processor family) |



    **Action:** Identify the architecture of your target machine:

    **Reason:** Because Intel MKL libraries are located in directories corresponding
    to your particular architecture (see Architecture Support), you should provide
    proper paths on your link lines (see Linking Examples). To configure your development
    environment for the use with Intel MKL, set your environment variables using the
    script corresponding to your architecture (see Set Environment Variables for details).'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 2 Intel® Math Kernel Library User''s Guide


    | Table 2-1 | What You Need to Know Before You Begin (continued) |


    +   **Action:** Identify all Intel MKL function domains that you require:

    * BLAS

    * Sparse BLAS

    * LAPACK

    * PBLAS

    * ScalACK

    * Sparse Solver routines

    * Vector Mathematical Library functions

    * Vector Statistical Library functions

    * Fourier Transform functions (FFT)

    * Cluster FFT

    * Trigonometric Transform routines

    * Poisson, Laplace, and Helmholtz Solver routines

    * Optimization (Trust-Region)

    * GMP* arithmetic functions


    Mathematical problem


    **Reference:** The function you intend to use narrows the search in the *Reference
    Manual* for specific needs. Additionally, if you are using the Intel MKL cluster
    software, your link is function-domain specific (see [Working with the Intel®
    Math Kernel Library, Cluster Software](https://www.example.com/mkl)). Coding tips
    may also depend on the function domain (see [Tips and Techniques to Improve Performance](https://www.example.com/tips)).


    **Action:** Though Intel MKL provides support for both Fortran and C/C++, not
    all the function support a particular language environment, for example, C/C++
    or Fortran 90/95. Identify the language interfaces that your function supports
    ([Intel® Math Kernel Library Interfaces Support](https://www.example.com/interfaces)).


    Programming language


    **Reason:** In case your function does not directly support the needed, you can
    use mixed-programming (see [Mixed-language Programming with Intel® MKL](https://www.example.com/mixed)).


    For a list of language-specific interfaces and modules and an example how to generate
    them, see also [Using Language-Specific Interfaces with Intel® MKL](https://www.example.com/using).


    **Action:** If your system is based on the Intel 64 or IA-64 architecture, identify
    whether your application performs calculations with huge data arrays (of more
    than 2³¹¹ elements).


    Range of integer data


    **Reason:** To operate on huge data arrays, you need to use the ILP64 interface,
    where integers are 64-bit; otherwise, use the default, LP64, interface, where
    integers are 32-bit (see [Support for ILP64 Programming](https://www.example.com/ilp64)).'
  merge: -1
  img_proc: true
- pgno: 14
  md: "| Table 2-1 | What You Need to Know Before You Begin (continued) |\n| --- |\
    \ --- |\n| Threading model | **Action:** Identify whether and how your application\
    \ is threaded:\n> - Threaded with the Intel® compiler\n> - Threaded with a third-party\
    \ compiler\n> - Not threaded\n**Reason:** The compiler you use to thread your\
    \ application determines threading library you should link with your application.\
    \ For applications threaded with a third-party compiler you may need to use Intel\
    \ MKL in the sequential mode (for more information, see Sequential Mode of the\
    \ Library and Linking with Threading Libraries).\n**Action:** Determine the number\
    \ of threads you want Intel MKL to use.\n**Reason:** Intel MKL is based on the\
    \ OpenMP® threading. By default, the OpenMP sets the number of threads that Intel\
    \ MKL uses. If you need a different number, you have set it yourself using one\
    \ of the available mechanisms. For more information, see Using the Intel® MKL\
    \ Parallelism.\n**Action:** Decide which linking model is appropriate for linking\
    \ your application with Intel MKL libraries:\n> - Static\n> - Dynamic\n**Reason:**\
    \ For information on the benefits of each linking model, command syntax and examples,\
    \ link libraries, and other linking topics, how to save disk by creating a custom\
    \ dynamic library, see Linking Your Application with the Intel® Math Kernel Library\
    \ |\n MPI used | **Action:** Decide what MPI you will use with the Intel MKL cluster\
    \ server. You are strongly encouraged to use Intel® MPI 3.x.\n**Reason:** To link\
    \ with ScalAPACK/or Cluster FFT, the libraries corresponding to your particular\
    \ MPI should be listed on the link line (see Working with the Intel® Math Kernel\
    \ Cluster Software). |\n\n# # Compiler Support\n\nIntel MKL supports compilers\
    \ identified in the Release Notes. However, the library has been successfully\
    \ used with other compilers as well.\n\nIntel MKL provides a set of functions\
    \ to simplify program development by specifying enumerated values and prototypes\
    \ for the respective functions (for the list of includes, see Table A-2). Calling\
    \ Intel MKL functions from your application without an appropriate include file\
    \ may lead to incorrect behavior of the functions.\n\n# # Steps to Get Started\n\
    \nThis section helps you get started with Intel MKL on Linux* OS."
  merge: -1
  img_proc: true
- pgno: 15
  md: "# 2 Intel® Math Kernel User's Guide\n\n# Check Your Installation\n\nAfter installing\
    \ Intel MKL, verify that the library has been properly installed and configured.\n\
    \n+   1. Check that the directory you chose for the installation has been created.\
    \ The Intel MKL default installation directory may be one of the following:\n\
    \    - /opt/intel/mkl/rr.y.xxx, where rr.r is the version number, y is the release-update\
    \ number, and xxx is the package number, for example:\n    - /opt/intel/mkl/10.2.0.004\n\
    \n+   2. If you choose to keep multiple versions of Intel MKL installed on your\
    \ system, update your build scripts so that they point to the desired version.\n\
    \n+   3. Check that the following six files are placed in the tools/environment\
    \ directory:\nmklvars32.sh\nmklvars32.csh\nmklvarsem64t.sh\nmklvarsem64t.csh\n\
    mklvars64.sh\nmklvars64.csh\n\nYou can use these files to set environment variables\
