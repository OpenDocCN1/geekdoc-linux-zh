- pgno: 68
  md: "# 6 Intel® Math Kernel Library User's Guide\n\n# # Managing Multi-core Performance\n\
    \nYou can obtain best performance on systems with multi-core processors by requiring\
    \ that threads do not migrate from core to core. To do this, bind threads to the\
    \ CPU cores by setting an affinity mask to threads. You can do this using any\
    \ of the following options:\n\n+   * OpenMP facilities (recommended, if available),\
    \ for instance, the KMP_AFFINITY environment variable using the Intel OpenMP library\n\
    * A system function, as in the example below\n\nSuppose:\n* The system has two\
    \ sockets with two cores each, for a total of 4 (CPUs).\n* The two-thread parallel\
    \ application calls the Intel MKL FFT to run faster than in 4 threads, but the\
    \ performance in 2 threads is unstable\n\nThe code presented in Example 6-3 solves\
    \ the problem. The code example calls the system function sched_affinity to bind\
    \ the threads to the cores on different sockets. After that the Intel MKL FFT\
    \ function is called.\n\nCompile your application with the Intel compiler using\
    \ the following command:\nicc test_application.c -openmp\n\nwhere test_application.c\
    \ is the filename for the application.\nBuild the application. Run it in 2 threads,\
    \ for example, by using the environment variable to set the number of threads:\n\
    \n```\nenv OMP_NUM_THREADS=2 ./a.out\n```\n\n# Example 6-3 Setting an affinity\
    \ Mask by Operating System Means Using the Intel® Compiler\n\n```\n#include <stdio.h>\n\
    \n#define __USE_GNU\n// Set affinity mask\n#include <sched.h>\n#include <unistd.h>\n\
    #include <omp.h>\n\nint main(void) {\n    int NCPUS = sysconf(_SC_NPROCESSORS_CONF);\n\
    \n    printf(\"Using thread affinity on %i NCPUS\\n\", NCPUS);\n    #pragma omp\
    \ parallel default(shared)\n{\n        cpu_set_t new_mask;\n        cpu_set_t\
    \ was_mask;\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Example 6-3 Setting An affinity Mask by Operating System Means Using the\
    \ Intel® Compiler (continued)\n\n```\nint tid_ZERO = omp_get_thread_num();\n\n\
    CPU_ZERO(&new_mask);\n\n// 2 packages x 2 cores/pkg x 1 threads (4 total cores)\n\
    CPU_SET(tid=0 ? 0 : 2, &new_mask);\n\nif (sched_getaffinity(0, sizeof(was_mask),\
    \ &was_mask) == -1) {\n    printf(\"Error: sched_getaffinity(%d, sizeof(was_mask),\
    \ &new_mask)\\n\", tid);\n}\nif (sched_setaffinity(0, sizeof(new_mask), &new_mask)\
    \ == -1) {\n    printf(\"Error: sched_setaffinity(%d, sizeof(new_mask), &new_mask)\\\
    n\", tid);\n}\nprintf(\"tid=%d new_mask=%08X was_mask=%08X\\n\", tid,\n    *(unsigned\
    \ int*)(&new_mask), *(unsigned int*))(&was_mask));\n}\n\n// Call Intel MKL FFT\
    \ function\nreturn 0;\n```\n\nSee the Linux Programmer's Manual (in man pages\
    \ format) for particulars of the sched_setaffinity function used in the above\
    \ example.\n\n# Operating on Denormals\n\nThe IEEE 754-2008 standard, \"An IEEE\
    \ Standard for Binary Floating-Point Arithmetic\" defines denormal (or subnormal)\
    \ numbers as non-zero numbers smaller than the smallest possible normalized numbers\
    \ for a specific floating-point format. Floating-point operations on denormals\
    \ are slower than on normalized operands because denormal operands and results\
    \ are usually handled through a software assist mechanism rather than directly\
    \ in hardware. This software processing causes Intel MKL functions that consume\
    \ denormals to run slower than with normalized floating-point numbers.\n\nYou\
    \ can mitigate this performance issue by setting the appropriate bit fields in\
    \ the MXCSR floating-point control register to flush denormals to zero (FTZ) or\
    \ to replace any denormals loaded from memory with zero (DAZ). Check your compiler\
    \ documentation to determine whether it has options to control FTZ and DAZ. Note\
    \ that these compiler options may slightly affect accuracy."
