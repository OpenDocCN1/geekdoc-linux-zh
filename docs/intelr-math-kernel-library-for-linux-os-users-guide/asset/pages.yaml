  md: '# Intel® Math Kernel Library Structure


    The chapter discusses the structure of the Intel® Math Kernel Library (Intel®
    MKL), including the Intel MKL directory structure, architecture-specific implementations,
    supported programming interfaces, and more.


    Starting with version 10.0, Intel MKL employs a layered model to streamline the
    library structure, reduce its size, and add usage flexibility.


    See also: [Layered Model Concept].


    # High-level Directory Structure


    Table 3-1 shows a high-level directory structure of Intel MKL after installation.


    | Directory | Comment |

    | --- | --- |

    | `<mkl directory>` | Intel MKL main directory |

    | `<mkl directory>/benchmarks/linpack` | Contains a Shared-Memory (SMP) version
    of the LINPACK benchmark |

    | `<mkl directory>/benchmarks/mp_linpack` | Contains an MPI version of the LINPACK
    benchmark |

    | `<mkl directory>/doc` | Contains documentation for a stand-alone Intel MKL |

    | `<mkl directory>/examples` | Contains source code, data, and makefiles for examples
    routines, well as for tests and examples |

    | `<mkl directory>/include` | Contains INCLUDE files for the libraries, well as
    BLAS5¹ and LAPACK95².mod files for the IA-32 architecture and Intel® Fortran compiler
    |

    | `<mkl directory>/include/32` |'
