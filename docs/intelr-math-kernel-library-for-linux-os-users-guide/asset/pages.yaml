    # Intel MKL Java Examples


    Java was positioned by its inventor, the Sun Microsystems Corporation as a "Write
    Once Run Anywhere" (WORA) language. Intel MKL may help to speed-up Java applications,
    while partially supporting the WORA philosophy, because Intel MKL editions are
    intended for a wide variety of operating systems and processors including most
    kinds of laptops, as well as many workstations and servers.


    To demonstrate binding with Java, Intel MKL includes the set of Java examples
    found in the following directory:


    ```

    <mkl directory>/examples/java -

    ```


    The examples are provided for the following MKL functions:


    +   * ?gemm, ?gemv, and ?7dot family from CBLAS

    * The complete set of non-cluster FFT functions

    * ESSL¹-like functions for one-dimensional convolution and correlation

    * VSL Random Number Generators (RNG), except GetErrorCallback, SetErrorCallback,
    and

    * ClearErrorCallback


    You can see the example sources in the following directory:


    ```

    <mkl directory>/examples/java/examples

    ```


    IBM Engineering Scientific Subroutine Library (ESSL)*'
