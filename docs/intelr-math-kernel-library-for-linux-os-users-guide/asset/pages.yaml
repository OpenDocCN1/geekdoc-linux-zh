- pgno: 102
  md: '# LINPACK and MP LINPACK

    Benchmarks


    This chapter describes the Intel® Optimized LINPACK Benchmark for the Linux* OS
    (for shared memory systems) and Intel® MP LINPACK Benchmark for Clusters (for
    distributed memory systems).


    # Intel® Optimized LINPACK Benchmark for Linux OS*


    Intel® Optimized LINPACK Benchmark is a generalization of the LINPACK 1000 benchmark.
    It solves a (real^B) system of linear equations (Ax=b), measures the amount of
    time it takes to factor and solve the system, converts that into a performance
    rate, and tests the results for accuracy. The generalization is in the number
    of equations (N) it can solve, which is not limited to 1000. It uses partial pivoting
    to ensure the accuracy of the


    This benchmark should not be used to report LINPACK 100 performance, as that is
    a compiled-code only benchmark. This is a shared memory (SMP) implementation which
    runs on a single platform. Do not confuse with this benchmark:


    +   * MP LINPACK, which is a distributed version of the same benchmark.

    * LINPACK, the library, which has been expanded upon by the LAPACK library.


    Intel provides optimized versions of the LINPACK benchmarks to help you obtain
    high LINPACK results on your systems based on genuine Intel® processors more easily
    than the High Performance Linpack (HPL). Use this package to benchmark your SMP
    machine.


    Additional information on this software as well as other Intel® software products
    are available at http://www.intel.com/software/products/.


    # Contents


    The Intel Optimized LINPACK Benchmark for Linux* contains the following files,
    located in the ./benchmarks/linpack/ subdirectory in the Intel MKL directory (see
    Table 3-1):'
  merge: -1
  img_proc: true
