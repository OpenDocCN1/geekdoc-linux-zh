- pgno: 70
  md: '# FFT Optimized Radices


    You can improve the performance of Intel MKL FFT if the length of your data vector
    permits factorization into optimized radices.


    In Intel MKL, the optimized radices are 2, 3, 5, 7, and 11.


    # Using the Intel® MKL Memory Management


    Intel MKL has memory management software that controls memory buffers for the
    use by the library functions. New buffers that the library allocates when your
    application calls certain functions (Level 3 BLAS or FFT) are not deallocated
    until the program ends. To get the amount of memory allocated by the memory management
    software, call the `mkl_mem_stat()` function. If your program needs to free memory
    `mkl_free_buffers()`. If another call is made to a library function that needs
    a memory buffer, the memory manager will allocate buffers and they will remain
    allocated until the program ends or the manager deallocates them.


    This behavior facilitates better performance. However, some tools may report this
    behavior as a memory leak. In addition to calling the `mkl_free_buffers()` function,
    you can release (free) memory from your program by setting an environment variable.


    The memory management software is turned on by default, which leaves memory allocated
    by calls to Level 3 BLAS and FFT until the program ends. To disable this of the
    memory management software, set the `MKL_DISABLE_FAST_MM` environment variable
    to any value, which will cause memory to be allocated and freed from call to call.
    Disabling this will negatively impact performance of routines such as the level
    3 BLAS, especially for small problem sizes.


    Using one of these methods to release memory will not necessarily stop programs
    from reporting memory leaks, and, in fact, may increase the number of such reports
    in case you make multiple calls to the library, thereby requiring new allocations
    with each call. Memory not released by any one of the methods described previously
    will be released by the system when the program ends.


    # Redefining Memory Functions


    C/C++ users of Intel MKL can replace memory functions that the library uses by
    default with their own ones. The memory renaming feature enables this replacement.


    # Memory Renaming


    Intel MKL memory management by default uses standard C run-time functions to allocate
    or free memory. These functions can be replaced using memory renaming.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Intel MKL accesses the memory functions by pointers i_malloc, i_free, i_calloc,
    and i_realloc, which are visible at the application level. These pointers initially
    hold addresses of the standard C run-time memory functions malloc, free, calloc,
    and realloc, respectively. You can programmatically redefine values of these pointers
    to the addresses of your application''s memory management functions.


    Redirecting the pointers is the only correct way to use your own management functions.
    If you call your own memory functions without redirecting the pointers, the memory
    will get managed by two independent memory packages, which may cause unexpected
    memory issues.


    # How to Redefine Memory Functions


    To redefine memory functions, use the following procedure:


    +   1. Include the i_malloc.h header file in your code. This header file contains
    all declarations required for an application developer to replace the memory allocation
    functions. The header file also describes how allocation can be replaced in those
    Intel libraries that support this feature.


    +   2. Redefine values of pointers i_malloc, i_free, i_calloc, i_realloc prior
    to the first call to MKL functions:


    ### Example 6-4 Redefining Memory Functions


    ```

    #include "i_malloc.h"

    ...

    i_malloc = my_malloc;

    i_calloc = my_calloc;

    i_realloc = my_realloc;

    i_free = my_free;

    ...

    // Now you may call Intel MKL functions

    ```'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Language-specific Usage Options


    The Intel® Math Kernel Library (Intel® MKL) provides broad support for Fortran
    and C/C++ programming. However, not all functions support both Fortran and C interfaces
    (see Table A-1 in Appendix A). For example, LAPACK has no C interface. You can
    call functions comprising such domains from C using mixed-language programming.


    If you want to use LAPACK or BLAS, which support the Fortran 95 environment, additional
    effort may be initially required to build compiler-specific interface libraries
    and modules from the source code provided with Intel MKL.


    This chapter focuses on mixed-language programming and the use of language-specific
    interfaces. It expands upon the use of Intel MKL in C language environments for
    function domains that provide as as explains usage of language-specific interfaces,
    specifically the Fortran 95 interfaces to LAPACK and BLAS. The chapter also discusses
    compiler-dependent functions to explain why Fortran 90 modules are supplied as
    sources. A separate section guides you through the process of running examples
    to invoke Intel MKL functions from Java-


    # Using Language-Specific Interfaces with Intel® MKL


    You can create the following interface libraries and modules using the respective
    interfaces located in the interfaces directory.


    | Table 7-1 Interface Libraries and Modules |

    | File name | Contains |

    | Libraries, in Intel MKL architecture-specific directories | |

    | libmkl_blas95.a¹ | Fortran 95 wrappers for BLAS (BLAS95) for IA-32 architecture.
    |

    | libmkl_blas95_ilp64.a¹ | Fortran 95 wrappers for BLAS (BLAS95) supporting LP64
    interface. |'
