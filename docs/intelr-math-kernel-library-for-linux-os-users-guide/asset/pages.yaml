- pgno: 23
  md: '# Intel® Math Kernel Library Structure


    # Browsing the Intel MKL Include Files


    Given a function with integer parameters, the Reference Manual does not explain
    why parameters become 64-bit and remain 32-bit for ILP64, and you are encouraged
    to browse the include files, examples, and tests for the ILP64 interface. For
    their location, Table 3-1.


    You are encouraged to start with browsing the include files, listed in Table A-2.

    Some functions that support only a Fortran interface (see Table A-1), provide
    header files for C/C++ in the include directory. Such *.h files enable using a
    Fortran binary interface from C/C++ code. These files can also be used to understand
    the ILP64 usage.


    # Limitations


    All Intel MKL function domains support ILP64 programming with the following exceptions:


    +   * FFTW 2.x wrappers do not support ILP64.

    * FFTW 3.2 wrappers support ILP64 by a dedicated set of functions plan_guru64.

    * GMP* arithmetic functions do not support ILP64.


    # Architecture Support


    Intel MKL for Linux* OS provides three architecture-specific implementations.
    Table 3-4 lists the supported architectures and directories where each architecture-specific
    implementation is located.


    Table 3–4 Architecture-specific Implementations


    | Architecture | Location |

    |---|---|

    | IA-32 or compatible | <mkl directory>/lib/32 |

    | Intel® 64 or compatible | <mkl directory>/lib/64t |

    | IA-64 | <mkl directory>/lib/64 |


    See a detailed structure of these directories in Table 3-5, Table 3-6, and Table
    3-7.'
