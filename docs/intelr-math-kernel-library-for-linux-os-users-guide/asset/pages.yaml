  md: '# Setting the Number of Threads Using OpenMP* Environment Variable


    You can set the number of threads using the environment variable OMP_NUM_THREADS.
    To change the number of threads, in the command shell in which the program is
    going to run, enter:


    ```

    export OMP_NUM_THREADS=<number of threads to use> for certain shells, such as
    bash.

    ```


    or


    ```

    set OMP_NUM_THREADS=<number of threads to use> for other shells, such as csh or
    tcsh.

    ```


    See Using Additional Threading Control on how to set the number of threads using
    Intel MKL environment variables, for example, MKL_NUM_THREADS.


    # Changing the Number of Threads at Run Time


    You cannot change the number of threads during run time using the environment
    variables. However, you can call OpenMP API functions from your program to change
    the number of threads during run time. The following sample code shows how to
    change the number of threads during run time using the omp_set_num_threads() routine.
    See also Techniques to Set the Number of Threads.


    The following example shows both C and Fortran code examples. To run this example
    in the C language, use the omp.h header file for the Intel compiler package. If
    you do not have the Intel compiler to explore the functionality in the example,
    use Fortran API for omp_set_num_threads rather than the C version.


    # Example 6-1 Changing the Number of Threads


    ```

    // ***** ******


    #include "omp.h"

    #include "mkl.h"

    #include <stdio.h>


    #define SIZE 1000


    void main(int argc, char *argv[]){


    double *a, *b, *c;

    a = new double [SIZE*SIZE];

    b = new double [SIZE*SIZE];

    c = new double [SIZE*SIZE];

    ```'
