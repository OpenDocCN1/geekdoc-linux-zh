- pgno: 79
  md: '# Calling BLAS Functions that Return the Complex Values in C/C++ Code


    You must be careful when handling a call from C to a BLAS function that returns
    complex values. The problem arises because BLAS comprises Fortran functions, and
    complex values they return are handled quite differently for C and Fortran. However,
    in addition to normal function calls, Fortran enables calling functions as though
    they were subroutines, which provides a mechanism for returning the complex value
    correctly when the function is called from C program. When a Fortran function
    is called as a subroutine, the return value is the first parameter in the calling
    sequence. This feature can be used by the C programmer.


    The following example shows how this works.


    Normal Fortran function call:

    result = cdotc( n, x, l, y, 1 )


    A call to the function as a subroutine:

    call cdotc( result, n, x, l, y, 1, )


    A call to the function from C (notice that the parameter gets exposed):

    cdotc(&result, &n, &one, y, &one )


    ![](img/78e923baedeba397a89d376927830122_79_0.png)


    > NOTE. Intel MKL has both upper-case and lower-case entry points in the Fortran-style
    (case-insensitive) BLAS, with or without the trailing underscore. so, all these
    names are equivalent and acceptable: cdotc, cdotc_, cdotc_


    The above example shows one of the ways to call level 1 BLAS functions that return
    complex values from your C and C++ applications. An easier way is to use the CBLAS
    interface. For instance, you can call the same function using the CBLAS interface
    as:


    ```

    cblas_cdotu( n, x, l, y, l, &result )

    ```


    ![](img/78e923baedeba397a89d376927830122_79_1.png)


    > NOTE. The complex value comes last as the argument list in this case.


    The following examples show use of the Fortran-style BLAS interface from C and
    C++, as well as the CBLAS (C language) interface.'
  merge: -1
