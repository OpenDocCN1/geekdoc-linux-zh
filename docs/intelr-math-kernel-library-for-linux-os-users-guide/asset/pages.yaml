- pgno: 114
  md: '# LINPACK and MP LINPACK Benchmarks


    -DASYOUGO2: Gives detailed single-node DGEM performance information. It captures
    all DGEM calls (if you use Fortran BLAS) and records their data. Because of this,
    the routine has a marginal intrusive overhead. Unlike -DASYOUGO2, which is quite
    non-intrusive, -DASYOUGO2 is interrupting every DGEM call to monitor its performance.
    You should be aware of this, although for big problems, it is for sure, less than
    1/10th of a percent.


    Here is a sample ASYOUGO output (the first 3 non-intrusive numbers can be found
    in ASYOUGO and ENDEARLY), so it suffices to describe these numbers:


    ```

    Col=001280 Fract=0.050 Mflops=42454.99 (DT=9.5 DF=34.1

    DMF=38322.78.

    ```


    The problem size is N=16000 with a blocksize of 128. After 10 blocks, that is
    1280 columns, an output was sent to the screen. Here, the fraction of columns
    completed is 1280/16000=0.08. If only 40 outputs are printed, at various places
    during the matrix decomposition: fractions

    0.005 0.010 0.015 0.020 0.025 0.030 0.035 0.040 0.045 0.050 0.055 0.060

    0.070 0.075 0.080 0.085 0.090 0.095 0.100 0.105 0.110 0.115 0.120 0.125

    0.135 0.140 0.145 0.150 0.155 0.160 0.165 0.170 0.175 0.180 0.185 0.190

    0.195

    0.200 0.205 0.210 0.215 0.220 0.225 0.230 0.235 0.240 0.245 0.250 0.255

    0.260 0.265 0.270 0.275 0.280 0.285 0.290 0.295 0.300 0.305 0.310 0.315 0.320

    0.330 0.335 0.340 0.345 0.350 0.355 0.360 0.365 0.370 0.375 0.380 0.385

    0.390 0.395 0.400 0.410 0.415 0.420 0.425 0.430 0.435 0.440 0.445 0.450

    0.460 0.465 0.470 0.475 0.480 0.485 0.490 0.495 0.515 0.525 0.535 0.575

    0.579 0.615 0.635 0.655 0.665 0.675 0.695 0.798


    However, the problem size and the block size are so big by comparison that as
    it prints the value for 0.045, it was already through 0.08 fraction of the columns.
    On a few larger problems, the fraction number will be more accurate. It never
    prints more than the 112 numbers above. So, smaller problems will have fewer than
    112 updates, and the biggest problems will have precisely 112 updates.


    The Mflops is an estimate based on 128 columns of LU with lookahead steps, that
    work is not actually completed when the output is made. Nevertheless, this is
    a good estimate for identifying runs.


    The 3 numbers in parenthesis are ASYOUGO adds. The DT is the total time processor
    0 has spent in DGEM. The DF is the number of billion operations that have been
    performed in DGEM by one process. Hence, the fraction of processor 0 (i columns
    in DGEM) is always DF/DT. Using the number of DGEM flops as a basis based on the
    number of LU flops, you can get a lower bound on performance of our run by using
    DGEM to compare with. It uses the global LU time, but the DGEM flops are computed
    under the assumption that the problem is distributed among the nodes, as only
    HPL''s node (0,00) returns any output.


    Note that using above performance monitoring tools to compare difference performance
    drop off HPL.dat input data sets is sensitive to some input data. For instance,
    when you try very small problems, the performance drop off from initial values
    to equal values is very rapid. The larger the problem, the less the drop off,
    and it is possible to use the first few'
  merge: -1
  img_proc: true
