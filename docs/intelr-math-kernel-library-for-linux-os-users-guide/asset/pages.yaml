    # Compiler-dependent functions and Fortran 90 Modules


    Compiler-dependent functions occur whenever the compiler places functions into
    the object code function calls that are resolved in its run-time library (RTL).
    Linking of code without the appropriate RTL will result in undefined symbols.
    Intel MKL has been designed to minimize RTL dependencies.


    Where dependencies occur, a supporting RTL is shipped with Intel MKL. The examples
    of RTLs, except those relevant to the Intel MKL cluster software, are libomp and
    libguide, which are the libraries for the OpenMP® code compiled with an Intel®
    compiler. Both libomp and libguide support the threaded code in Intel MKL.


    In other cases RTL dependencies might arise, the functions are delivered as source
    code and you need to compile the code with whatever compiler you are using for
    your application.


    In particular, Fortran 90 modules result in the compiler-specific code generation
    requiring RTL support, so, Intel MKL delivers these modules as source code.'
