- pgno: 111
  md: "# 11 Intel® Math Kernel Library User's Guide\n\n# Benchmarking a Cluster\n\n\
    To benchmark a cluster, follow the sequence of steps below (some of them are optional).\
    \ Pay attention to the iterative steps 3 and 4. They make a loop that searches\
    \ for HPL parameters (specified in HPL.dat) that enable you to reach the top performance\
    \ of your cluster.\n\n+   1. Install HPL and make sure HPL is functional on all\
    \ nodes.\n\n+   2. You may run nodeperf.c (included in the distribution) to see\
    \ the performance of DGEMM on all nodes.\n\n```\nCompile nodeperf.c with your\
    \ MPI and Intel MKL. For example:\nmppiacc -o3 nodeperf.c -LMKLPATH $MKLPATH/libmkl_intel_lp64.a\
    \ \\ \n-W1,--start-group $MKLPATH/libmkl_sequential.a \\ \n$MKLPATH/libmkl_core.a\
    \ -W1,--end-group -lpthread\n```\n\nLaunching nodeperf.c on all nodes is especially\
    \ in in very large cluster.\nIndeed, there may be a stray job on a certain node,\
    \ for example, 738, which is running 5% slower than the rest. LINPACK will then\
    \ run as slow as the slowest node. In this case, nodeperf enables quick identification\
    \ of the potential problem spot without numerous small MP LINPACK runs around\
    \ the cluster in search of the bad node. It may be zombie processes common after\
    \ a bunch of HPL runs, there nodeperf facilitates finding the slow nodes. It goes\
    \ through all the nodes, one at a time, and reports the performance of DGEMM followed\
    \ by some host identifier. Therefore, the higher the DGEMM performance, the faster\
    \ that node was performing.\n\n+   3. Edit HPL.dat to fit your cluster needs.\n\
    Read through the HPL documentation for these ideas. However, you should try on\
    \ at least 4 nodes.\n\n+   4. Make an HPL run, using compile options such as ASYOUGO\
    \ or ASYOUGO2 and ENDARELY to aid in your search (These options enable you to\
    \ gain insight into the performance sooner than HPL would normally give this insight).\n\
    When doing so, follow these recommendations:"
