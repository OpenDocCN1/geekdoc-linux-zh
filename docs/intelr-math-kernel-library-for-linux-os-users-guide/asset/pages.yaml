    # # Layered Model Concept


    Starting with release 10.0, Intel MKL employs a layered model.

    There are four essential parts of the library:


    +   1. Interface layer

    2. Threading layer

    3. Computational layer

    4. Compiler Support Run-time libraries.


    The first part adapts Intel MKL to interface-related issues, for example, whether
    to use 32- or 64-bit integer types, or how different compilers return function
    values. The second part adapts the library to the OpenMP implementations using
    different compilers or to the non-threaded usage. The Computational layer is the
    bulk of the library, which is separated to space. Rather than generate one library
    for each of the cases within these parts and thus a geometric explosion of possibilities,
    Intel MKL has broken down each into independent libraries corresponding to those
    cases. You can combine these to meet your needs. Once the interface library is
    selected, the threading library picks up that interface, and the computational
    libraries use interfaces chosen in the first two layers.


    **Interface Layer.** This layer provides matching between compiled code of your
    application and the threading and/or computational parts of the library. This
    layer provides:


    +   * The LP64 and ILP64 interfaces (see Support for ILP64 Programming for details)

    * Compatibility with compilers that return function values differently

    * A mapping between single-precision names and double-precision names for applications
    using Cray*-style naming (SP2DP interface)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Intel® Math Kernel Library User''s Guide


    NOTE. SP2DP interface supports Cray-style naming in applications targeted for
    the Intel 64 or IA-64 architecture and using the ILP64 interface. SP2DP interface
    provides a mapping between single-precision names (for both real and complex types)
    in the application and double-precision names in Intel MKL BLAS and LAPACK. Function
    names are mapped as shown in the following example BLAS functions * GEMM:

    SGEMM -> DGEMM

    DGMM -> DGEMM

    CGEMM -> ZGEMM

    GEMM -> ZGEMM

    Mind that no changes are made to double-precision names.


    Threading Layer. This layer provides:


    +   * A way to link threaded Intel MKL with different threading compilers.

    * An ability for the user to link with a threaded or sequential mode of the library.


    This layer is compiled for different environments (threaded or sequential) and
    compilers (from Intel, GNU*, and so on).


    Computational Layer. This layer is the heart of Intel MKL. For any processor architecture
    (IA-32, IA-64, or Intel® 64) and OS, this has only one computational layer to
    link with, regardless of the Interface and Threading Layer. The computational
    layer accommodates multiple architectures through identification of architecture
    features and chooses the appropriate binary at run time.


    Compiler Run-time Libraries (RTL for brevity). This layer provides RTL support.
    Not all RTLs are developed with Intel MKL. Except those that are relevant to Intel
    MKL cluster software, the only RTLs provided are Intel® RTLs: Intel® Compatibility
    OpenMP* run-time library (libomp) and Legacy OpenMP* run-time library (libguide).
    To use third-party compilers, use libraries in the Threading layer or an appropriate
    compatibility library (for more information, see Linking with Threading Libraries).


    # Sequential Module of the Library


    You can use Intel MKL in a sequential (non-threaded) mode. It requires no Compatibility
    OpenMP* or Legacy OpenMP* run-time library, and does not respond to the environment
    variable OMP_NUM_THREADS or its Intel MKL equivalents. In this mode, Intel MKL
    runs unthreaded code. However, it is thread-safe¹, means that you can use it in
    a parallel region from your own OpenMP* code. You should use the library in the
    sequential mode'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'only if you have a particular reason not to use Intel MKL threading. The sequential
    mode may be helpful when using Intel MKL programs with some non-Intel compilers
    or in other situations where you may, for various reasons, a non-threaded version
    of the library (for instance, in MPI cases). To obtain Intel MKL running in the
    sequential mode, choose the *sequential.* library to.

    Note that the *sequential.* library depends on the POSIX threads library (pthread),
    which is used to make the Intel MKL software thread-safe and should be listed
    on the line.


    See also:


    +   - Directory Structure in Detail

    - Using the Intel® MKL Parallelism

    - Avoiding Conflicts in the Execution Environment

    - Linking Examples.


    # # Support for ILP4 Programming


    The Intel MKL ILP4 libraries use the 64-bit integer type (necessary for indexing
    huge arrays, with more than $2^{31}$-1 elements), whereas the LP64 index arrays
    with the 32-bit integer type.


    The LP64 and ILP4 interfaces are supported in the Interface layer (see Layered
    Model Concept and Directory Structure in Detail for more information).


    The ILP4 interface is provided for the following two reasons:


    +   - To support huge data arrays (with than $2^{31}$-1 elements)

    - To enable compiling your Fortran code with the -i8 compiler option


    It is up to you to choose which interface to use. Choose the LP64 interface for
    compatibility with the previous Intel MKL versions because “LP64” is just a new
    name for the only interface that the Intel MKL versions lower than 9.1 provided.
    Choose the ILP4 interface if your application uses Intel MKL for calculations
    with huge data arrays or the library may be used in future.


    Intel MKL provides the same include directory for the ILP4 and LP64 interfaces.


    1. Except for LAPACK deprecated routines ?lacon, ?lasq3, and ?lasq4.'
  merge: -1
