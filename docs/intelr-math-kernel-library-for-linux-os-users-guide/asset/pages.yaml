    # # Use Intel MKL Code Examples


    Intel MKL package includes code examples, located in the examples subdirectory
    of the Intel MKL installation directory. The examples provide the most direct
    way for you to find out:


    +   * Whether Intel MKL is working on your system

    * How you should call the library

    * How to link the library


    The examples are grouped in subdirectories mainly by Intel MKL function domains
    and programming languages. For instance, subdirectory examples/spblas contains
    Sparse BLAS examples, and subdirectory examples/vmlc contains VML examples in
    C. Source code for the examples is in the next level sources subdirectory.


    To compile, build, and run the examples, use the makefile provided. For information
    on how to use it, refer to the makefile header.


    See also:


    High-level Directory Structure.'
