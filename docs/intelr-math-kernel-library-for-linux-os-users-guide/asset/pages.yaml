    # Building Custom Shared Objects


    Custom shared objects enable reducing the collection of functions available in
    Intel MKL libraries to those required to solve your particular problems, which
    help to save disk space and build your dynamic libraries for distribution.


    # Intel MKL Custom Shared Object Builder


    Custom shared object builder enables creation of a dynamic library (shared object)
    containing the selected functions and located in the tools/builder directory.
    The builder contains a makefile and a definition file with the list of functions.
    The makefile has three targets: ia32, ipf, and em64t. Use the ia32 target for
    processors that use the IA-32 architecture; use ipf for processors that use the
    IA-64 architecture; and use em64t for processors that use the Intel® 64 architecture.


    ![](img/78e923baedeba397a89d376927830122_51_0.png)


    > NOTE. The objects in Intel MKL static libraries are position-independent code
    (PIC), which is not typical for static libraries. Therefore, the custom shared
    object builder can create a shared object from a subset of Intel MKL functions
    by picking the respective object files from the static libraries.


    # Specifying Makefile Parameters


    There are several macros (parameters) for the makefile:


    ```

    export=user_list

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Linking Your Application with the Intel® Math Kernel Library 5


    Specifies the full name of the file that contains the list of entry-point functions
    to be included in the shared object. The default name is user_list (no extension).


    ```

    name=mkl_custom

    ```


    Specifies the name of the library to be created. By default, the name of the created
    library is mkl_custom.so.


    ```

    xerbla=user_xerbla.o

    ```


    Specifies the name of the object file that contains the user''s error handler.
    This error handler will be added to the library and used instead of the native
    Intel MKL error handler xerbla. If you omit this parameter, the native Intel MKL
    xerbla is used. See the description of the xerbla function in the Intel MKL Reference
    Manual on how to develop your own error handler.


    ```

    MKLROOT=<MKL_directory>

    ```


    Specifies the location of Intel MKL libraries used to build the custom shared
    object. The installation directory for the current Intel MKL release is used by
    default.


    All parameters are optional.


    In the simplest case, the command line is make ia32, and the missing parameters
    have default values. This command creates the mkl_custom.so library for processors
    using the IA-32 architecture. The command takes the list of functions from the
    user_list file and uses the native Intel MKL error handler xerbla.


    An example of a more complex case follows:


    ```

    make ia32 export=my_func_list.txt name=mkl_small xerbla=my_xerbla.o

    ```


    In this case, the command creates the mkl_small.so library for processors using
    the IA-32 architecture. The command takes the list of functions from my_func_list.txt
    file and uses the user''s error handler my_xerbla.o.


    The process is similar for processors using the Intel® 64 or IA-64 architecture.


    # Specifying a List of Functions


    Adjust entry points in the user_list file to match the required interface. For
    example


    ```

    dgemm_

    ```


    ```

    dgetrf_

    ```


    If selected functions have several processor-specific versions, they all will
    be included in the custom library and managed by the dispatcher.'
