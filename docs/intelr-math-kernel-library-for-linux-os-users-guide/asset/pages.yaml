  md: "# LINPACK and MP LINPACK Benchmarks 11\n\n+   - You may set MPI variables,\
    \ that is, MPdir, MPinc, and MPlib.\n- Specify the location of Intel MKL and files\
    \ to be used (LAdir, LAinc, LAlib).\n- Adjust the compiler and compiler/linker\
    \ options.\n- Specify the version of MP LINPACK you are going to build (hybrid\
    \ or non-hybrid) by setting the version parameter for the make command, for example:\n\
    \  make arch=em64t linpack install\n\nFor some sample cases, like Linux systems\
    \ based on Intel® 64 architecture, the marketplaces contain values that must be\
    \ common. However, you need to be familiar with building HPL and picking appropriate\
    \ values for these variables.\n\n# New Features\n\nThe toolset is basically identical\
    \ with the HPL 2.0 distribution. There are a few changes that are optionally compiled\
    \ and disabled until you specifically request them. These new features are:\n\n\
    ASYOUGO: Provides non-intrusive performance information while runs proceed. There\
    \ are only a few outputs and this does not impact performance. This is especially\
    \ useful because many runs can go hours without any information.\n\nASYOUGO2:\
    \ Provides slightly intrusive additional performance information because it intercepts\
    \ until DGEMM.\n\nASYOUGO2_DISPLAY: Displays the performance of all the significant\
    \ DGEMMs inside the run.\n\nENDEARLY: Displays a few performance hints and terminates\
    \ the run early.\n\nFASTSWAP: Inserts the LAPACK-optimized DLASWP into HPL’s code.\
    \ This may yield a benefit for Itanium® 2 processor. You can experiment with this\
    \ to determine best results.\n\nHYBRID: Establishes the Hybrid OpenMP/MPI mode\
    \ of MP LINPACK, providing the possibility to use threaded Intel MKL and prebuilt\
    \ MP LINPACK hybrid libraries.\n\n> WARNING. Use this option only with an Intel\
    \ compiler and the Intel® MPI library version 3.1 or higher. You are also recommended\
    \ to use the compiler version 10.0 or higher.\n\n![](img/78e923baedeba397a89d376927830122_110_0.png)\n\
    \n11-9"
  merge: -1
