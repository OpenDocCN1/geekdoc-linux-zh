    # Linking with Compiler Support RTLs


    You are strongly encouraged to dynamically link in the Intel Compatibility OpenMP*
    run-time library libomp or Intel Legacy OpenMP* run-time library libguide. Linking
    to static OpenMP* run-time library is not recommended because it is very easy
    with complex software to link in more than one copy of the library (too many threads)
    and may cause correctness problems if one copy is initialized.


    You are advised to link with libomp and libguide dynamically even if other libraries
    are linked statically.


    However, if you link with libomp/libguide statically, the version of libomp/libguide
    you link depends on which compiler you use:'
