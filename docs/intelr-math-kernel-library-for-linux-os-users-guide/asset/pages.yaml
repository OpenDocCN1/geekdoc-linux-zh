- pgno: 112
  md: '# LINPACK and MP LINPACK Benchmarks


    +   - Use MP LINPACK, which is a patched version of HPL, to save time in the search.


    Using a patched version of HPL should not hinder your performance. That''s why
    features that could be performance intrusive are compile-optional (and it is explained
    below) in MP LINPACK. That is, if you do not use the new options explained in
    section Options to Reduce Search Times, then these changes are disabled. The primary
    purpose of the additions is to assist you in finding solutions.


    HPL requires a long time to search for many parameters. In the MP LINPACK, the
    goal is to get the best possible number.


    Given that the input is not fixed, there is a large parameter space you must search
    over. In, an exhaustive search of all possible inputs is probably even large for
    a powerful cluster.


    This patched version of HPL only improves performance as it proceeds, or terminates
    early depending on your desires.


    Save time by compiling with -DENDERALLY-DASYOUGO2 (described in Options to Reduce
    Search Time) and using a negative threshold (do not use a negative threshold on
    the final run that you intend to submit as a Top500 entry). You can set the threshold
    in line 13 of the HPL 2.0 input file HPL.


    If you are running a problem to completion, do it with -DASYOUGO (see Options
    to Reduce Search Time).


    +   - Using the quick performance feedback, return to step 3 and update until
    you are sure that the performance is as good as possible.


    # Options to Reduce Search Time


    Running huge problems to completion on large numbers of nodes can take many hours.
    The search for MP LINPACK is huge: not only can you run any size problem, but
    over a block of sizes, grid layouts, lookahead steps, using different factorization
    methods, etc. It can be a large waste of time to run a huge problem to completion
    only to discover it 0.01% slower than your previous best problem.


    There are 3 options you might want to experiment with to reduce the search time:


    +   - -DASYOUGO

    - -DENDERALLY

    - -DASYOUGO2


    Use -DASYOUGO2 cautiously because it does have a marginal performance impact.
    To see DGEMM internal performance, compile with -DASYOUGO and -DASYOUGO2_DISPLAY.
    These options provide a lot of useful DGEMM performance information at the cost
    of around 0.2% performance loss.


    If you want to use the old HPL, simply omit these options and recompile from scratch
    (try "make arch=<arch> clean_arch_all").'
  merge: -1
  img_proc: true
