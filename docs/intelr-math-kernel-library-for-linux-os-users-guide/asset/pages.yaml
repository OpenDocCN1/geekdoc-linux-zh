- pgno: 86
  md: '# Language-specific Usage Options


    Documentation for the particular wrapper and example classes will be generated
    from the Java sources while building and running the examples. To browse the documentation,
    open the index file in the docs directory (created by the build script):


    ```

    <mkl directory>/examples/java/docs/index.html

    ```


    The Java wrappers for CBLAS, VML, VSL RNG, and FFT establish the interface that
    corresponds to the underlying native functions, so you can refer to the Intel
    MKL Reference Manual for their functionality and parameters. Interfaces for the
    ESSL-like functions are described in the generated documentation for the com.intel.mkl.ESSL
    class.


    Each wrapper of the interface part for Java and JNI stub within C. You can find
    the sources in the following directory:


    ```

    <mkl directory>/examples/java/wrappers

    ```


    Both Java and C parts of the wrapper for CBLAS and VML demonstrate the straightforward
    approach, which you may use to cover additional CBLAS functions.


    The wrapper for FFT is more complicated because it needs to support the lifecycle
    of FFT descriptor objects. To compute a single Fourier transform, an application
    needs to call the FFT software several times with the same copy of the FFT descriptor.
    The wrapper provides the handler class to hold the native descriptor, while the
    virtual machine runs bytecode.


    The wrapper for VSL RNG is similar to the one for FFT. The wrapper provides the
    handler class to hold the native descriptor of the stream state.


    The wrapper for the convolution and correlation functions mitigates the same difficulty
    of the VSL interface, which assumes a similar lifecycle for "task descriptors".
    The wrapper utilizes the ESSL-like interface for those functions, which is simpler
    for the case of i-dimensional data. The JNI stub ideally encapsulates the MKL
    functions into the ESSL-like wrappers in C and "packs" the lifecycle of a descriptor
    into a single call to the native method.


    The wrapper meets the JNI specification versions 1.1 and 5.0 and should work with
    virtually every modern implementation of Java.


    The examples and the Java part of the wrappers are described in "The Java Language
    Specification (First Edition)" and extended with the feature of "inner classes"
    (this refers to late 1990s). This level of language version is supported by all
    versions of the Sun Java Development Kit (JDK*) developer toolkit and compatible
    implementations starting from version 1.1.5, or by all modern versions of Java.


    The level of C language is "Standard C" (that is, C89) with additional assumptions
    about integer and floating-point data types required by the Intel MKL interfaces
    and the JNI header files. That is, the native float and double data types must
    be the same as JNI float and double data types, respectively, and the native int
    must be 4 bytes long.'
