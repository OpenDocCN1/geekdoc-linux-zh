- pgno: 89
  md: 'This chapter discusses programming with the Intel® Math Kernel Library (Intel®
    MKL) to provide coding tips that meet certain, specific needs, such as numerical
    stability. Similarly, Chapter 7 focuses on general language-specific programming
    options, and Chapter 6 provides tips relevant to performance and memory management.


    # # Aligning Data for Numerical Stability


    If linear algebra routines (LAPACK, BLAS) are applied to input data that are bit-for-bit
    identical but the arrays are aligned differently or the computations are performed
    on different platforms or with different numbers of threads, the output may not
    be bit-for-bit identical, though they will deviate within the appropriate error
    bounds. The Intel MKL version may also affect numerical stability of the output,
    as the routines may be implemented differently in different versions. With a given
    Intel MKL version, the outputs will be bit-for-bit identical provided all the
    following conditions are met:


    +   - the outputs are obtained on the same platform

    - the inputs are bit-for-bit identical

    - the input arrays are aligned identically at 16-byte boundaries

    - Intel MKL is run in the sequential mode


    Unlike the first two conditions, which are under the users’ control, the alignment
    of arrays, by default, is not. For instance, arrays dynamically allocated using
    malloc are aligned at 8-byte boundaries, not 16-byte boundaries. If you need numerically
    identical outputs, use `mkl_malloc()` to get the properly aligned workspace, as
    shown below:'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 8 Intel® Math Kernel Library User''s Guide


    # ## Example 8-1 Aligning Addresses at 16-byte Boundaries


    ```

    // ******** C language ******

    ...

    #include <stdlib.h>

    ...

    void *d;

    int workspace;

    ...

    // Allocate workspace aligned on 16-bit boundary

    darray = mkl_malloc(sizeof(double)*workspace, 16 );

    ...

    // call the program using MKL

    mkl_app( darray );

    ...

    // Free workspace

    mkl_free( darray );


    ! ******** Fortran language ******

    ...

    double precision darray

    pointer (p_wrk,darray(1))

    integer workspace

    ...

    ! Allocate workspace aligned on 16-bit boundary

    p_wrk = mkl_malloc( 8*workspace, 16 )

    ...

    ! call the program using MKL

    call mkl_app( darray )

    ...

    ! Free workspace

    call mkl_free(p_wrk)

    ```'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Working with the Intel® Math Kernel Library Cluster Software


    This chapter discusses the usage of the Intel® Math Kernel Library (Intel® MKL)
    ScaLAPACK and Cluster FFTs, mainly describing your linking with these domains
    and including C and Fortran-specific linking examples. Information on the supported
    MPI is also discussed.


    See Chapter 3 for details about the Intel MKL directory structure, including the
    available documentation in the `doc` directory.


    For information on MP LINPACK Benchmark for Clusters, you need to know how to
    link in Chapter 11.


    Intel MKL ScaLAPACK and Cluster FFTs support MPI implementations identified in
    the *MKL Release Notes.*


    To link a program that calls ScaLAPACK, you need to know how to link an MPI application
    first.


    Typically, this involves using *mpi* scripts and *mpif77* (C or FORTRAN 77 scripts)
    that use the correct MPI header files and others. If, for instance, you are using
    MPICH installed in `/opt/mpich`, then typically `/opt/mpich/bin/mpich/bin/mpif77`
    will be the compiler scripts and `/opt/mpich/lib/libmpich.a` will be the library
    used for that installation.


    # Linking with ScaLAPACK and Cluster FFTs


    To link with the Intel MKL ScaLAPACK and/or Cluster FFTs, basically use the general
    form:


    ```

    <MPI> linker script> <files to link> \

    -L<MKL> path> [-W,--start-group] <MKL Cluster Library> \ \

    <BLAS> <MKL Core Libraries> [-W,--end-group>

    ```


    where:


    <MPI> is one of several MPI implementations (MPICH, Intel MPI 2.x/3.x, and so
    on).'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 9 Intel Math Kernel Library User''s Guide


    <MKL Cluster Library> is one of ScLAPACK or Cluster FFT libraries for the appropriate
    architecture, which are listed in Table 3-5, Table 3-6, or Table 3-7. For example,
    for IA-32 architecture, it is one of -lmkl_scalapack_core or -lmkl_cdft_core.


    <BLAS> is one of BLAS libraries for the architecture, which are listed in Table
    3-5, Table 3-6, or Table 3-7. For example, for IA-32 architecture, it is one of
    -lmkl_blas, -lmkl_blacs_intmpi,


    <MKL Core Libraries> are <MKL LAPACK & MKL kernel libraries> for ScLAPACK, and
    <MKL kernel libraries> for Cluster FFTs.


    <MKL kernel libraries> are processor optimized kernels, threading library, and
    system library for threading support as described in section Listing Libraries
    on a Link.


    <MKL LAPACK & kernel libraries> are the LAPACK & MKL kernel libraries.


    grouping symbols -W1,--start-group and -W1,--end-group are required for static
    linking.


    For example, if you are using Intel MPI 3x and want to use the LP64 interface
    with ScLAPACK and only one MPI process (core) and do not employ threading), specify
    the following options:


    ```

    -L$MKLPATH -I$MKLINCLUDE -W1,--start-group

    $MKLPATH/libmkl_scalapack_lp64.a $MKLPATH/libmkl_blacs_intmpi_lp64.a

    $MKLPATH/libmkl_intel_lp64.a $MKLPATH/libmkl_sequential.a

    $MKLPATH/libmkl_core.a -static_mpi -W1,--end-group -lpthread

    ```


    For more examples, see Examples for Linking with ScLAPACK and Cluster FFT.


    Note that <<MPI> linker script> and <BLAS> library should correspond to the MPI
    version. For instance, for Intel MPI 3.x, use <Intel MPI 3.x linker script> and
    libmkl_blacs_intmpi libraries.


    For information with Intel® MKL libraries, see Linking Your Application with the
    Intel® Math Kernel Library.


    # Setting the Number of Threads


    The OpenMP* software responds to the environmental variable OMP_NUM_THREADS. Intel
    MKL also has other mechanisms to set the number of threads, such as MKL_NUM_THREADS
    or MKL_DOMAIN_NUM_THREADS (Using Additional Threading Control). Make sure that
    the relevant variables have the same and correct values on all the nodes. The
    Intel MKL versions 10.0 and higher no longer set the default number of threads
    to one, but depend on the OpenMP libraries used with the compiler to set the default
    number. The threading layer based on the Intel® compiler (libmkl_intel_thread.a),
    this value is'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The number of CPUs according to the OS. Be cautious to avoid over-prescribing
    the number of threads, which may occur, for instance, when the number of MPI ranks
    per node and the number of threads per node are greater than one.


    The best way to set an environment variable like OMP_NUM_THREADS is your login
    environment. Remember that mpir starts a fresh shell on all of the nodes and so,
    changing this value on one node and then (which works on an SMP system) will not
    effectively change the variable on all nodes. In .bashrc, add a line at the top,
    as follows:


    ```

    OMP_NUM_THREADS=1 export OMP_NUM_THREADS

    ```


    It is possible to run multiple CPUs per node using MPICH, but the MPICH must be
    built to allow it. Be aware that certain MPICH applications may not work perfectly
    in a threaded environment (see the Known Limitations section in the Release Notes).
    If you encounter problems with MPICH and setting of the number of threads is greater
    than one, first try setting the number of threads to one and see whether the problem
    persists.


    # # Using Shared Libraries


    All needed shared libraries must be visible on all the nodes at run. One way to
    accomplish this is to point these libraries by the LD_LIBRARY_PATH environment
    variable in the .bashrc file. If Intel MKL is installed only on one node, you
    should link statically when building your MKL applications.


    The Intel MKL compilers or GNU compilers can be used to compile a program that
    uses Intel MKL. However, make sure that MPI implementation and compiler match
    correctly.


    # # ScaLAPACK Tests


    To build NetLib ScaLAPACK tests:


    +   - For the IA-32 architecture, add libmkl_scalapack_core.a to your link command.

    - For the IA-64 and 64 architectures, add libmkl_scalapack_lp64.a or libmkl_scalapack_ilp64.a,
    depending upon the desired interface.


    # # Examples for Linking with ScaLAPACK and Cluster FFT


    For the detailed information on the structure of the Intel MKL architecture-specific
    directories and the names of the cluster libraries to link, see Directory Structure
    in Detail.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Examples for Linking a C Application


    Suppose the following conditions are met:


    +   - MPICH2 1.0.7 or higher is installed in `/opt/mpich`.

    - $MKLPATH is a user-defined variable containing `<skl_directory>/lib/32`.

    - You use the Intel® C++ Compiler 9.1 or higher and the main module is C.


    To link with ScalLAPACK for a cluster of systems based on the IA-32 architecture,
    use the following libraries:


    ```

    /opt/mpich/bin/mpicc <user files to link>

    -L$MKLPATH

    -lmkl_scalapack_core

    -lmkl_blacs_intelmpi

    -lmkl_lapack

    -lmkl_intel -lmkl_intel_thread -lmkl_lapack -lmkl_core

    -liomp5 -lpthread

    ```


    To link with Cluster FFT for a cluster of systems based on the IA-32 architecture,
    use the following libraries:


    ```

    /opt/mpich/bin/mpicc <user files to link>

    $MKLPATH/lmkl_cdft_core.a

    $MKLPATH/lmkl_blacs_intelmpi.a

    $MKLPATH/lmkl_intel.a

    $MKLPATH/lmkl_intel_thread.a

    $MKLPATH/lmkl_core.a

    -liomp5 -lpthread

    ```


    # Examples for Linking a Fortran Application


    Suppose the following conditions are met:


    +   - Intel MPI 3.0 is installed in `/opt/intel/3.0`.

    - $MKLPATH is a user-defined variable containing `<mkl_directory>/lib/64`.

    - You use the Intel® Fortran Compiler 9.1 or higher and the main module is in
    Fortran.


    To link with ScalLAPACK for a cluster of systems based on the IA-64 architecture,
    use the following libraries:


    ```

    /opt/intel/mpi/3.0/bin/mpiifort <user files to link>

    -L$MKLPATH

    -lmkl_scalapack_lp64

    -lmkl_blacs_intelmpi_lp64

    ```'
