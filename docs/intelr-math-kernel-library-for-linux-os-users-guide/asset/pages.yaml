- pgno: 53
  md: "# Managing Performance and Memory\n\nThis chapter features different ways to\
    \ obtain the best performance with the Intel® Math Kernel Library (Intel® MKL):\
    \ primarily, it discusses threading (see Using the Intel® MKL Parallelism), then\
    \ shows coding techniques and gives hardware configuration tips for improving\
    \ performance. The chapter also discusses the Intel MKL memory management and\
    \ how to redefine memory functions used by the library.\n\n# Using the Intel®\
    \ MKL Parallelism\n\nIntel MKL is threaded in a number of places:\n\n+   - Direct\
    \ sparse solver.\n- LAPACK\n  - Linear equations, computational routines:\n  \
    \  - factorization: *getrf, *gbtrf, *potrf, *pptrf, *sytrf, *hetrf, *sptrf, *htprf\n\
    \    - solving: *gbstr, *gttrs, *ptprs, *pbrts, *pttrs, *sytrs, *sptrs, *hptrs\n\
    \    - *tptrs, *tbtrs.\n  - Orthogonal factorization, computational routines:\n\
    \    - *geqrf, *ormqr, *ormliq, *unmqr, *unmlq, *ormql, *unmql, *unmrq.\n- Singular\
    \ Value Decomposition, computational routines: *gebrd, *bdsqr.\n- Symmetric Eigenvalue\
    \ Problems, computational routines:\n  - *sytrd, *hetrd, *sptrd, *hptrd, *steqr,\
    \ *stedc.\nNote that a number of other LAPACK routines, which are based on threaded\
    \ LAPACK and BLAS routines, make effective use of parallelism: *gesv, *posv, *gels,\
    \ *gesvd,\n*syev, *heev, etc."
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Intel® Math Kernel Library User's Guide\n\n+   - Level 1 and Level2 BLAS\
    \ functions:\n  - Level 1 BLAS: *axpy, *copy, *swap, /sdot, ddot/ddot, drot/srot\n\
    \  - Level 2 BLAS: *gemv, *rmv, dsyr/ssyr, dsyr2/ssyr2, dsymv/ssym\n\nNote that\
    \ these functions are threaded for:\n\n+   - Intel® Core™2 Duo and Intel® Core™\
    \ i7 processors\n- All Level 3 BLAS and all Sparse BLAS routines except Level\
    \ 2 triangular solvers.\n- VML.\n- FFT.\n\nBecause it is designed for multi-threading,\
    \ Intel MKL is thread-safe, which means that all Intel MKL work correctly during\
    \ simultaneous execution by multiple threads. In particular, any chunk of threaded\
    \ Intel MKL code provides access for multiple threads to the same shared data,\
    \ while permitting only one thread at any time to access a shared piece of data.\
    \ There are different means to use. You could use the environmental variable OM_NUM_THREADS\
    \ to specify the number of threads to use. Intel MKL releases earlier than 10.0,\
    \ so could use the environment variable OpenMP_Environment Variable (for details)\
    \ or the equivalent OpenMP run-time function calls (detailed in Changing the Number\
    \ of Threads at Run Time). Starting with version 10.0, Intel MKL also offers variables\
    \ and equivalent MKL functions for thread management (see Using Additional Threading\
    \ Control for details). The Intel MKL variables M_NUM_THREADS are always inspected\
    \ first, then the OpenMP variables are examined, and if neither is used, the OpenMP\
    \ software chooses the default number of threads. This is a change from the MKL\
    \ versions 9.x or lower.\n\n![](img/78e923baedeba397a89d376927830122_54_0.png)\n\
    \nNOTE. Starting with Intel MKL 10.0, the OpenMP* software determines the default\
    \ number of threads. The default number of threads is equal to the number of logical\
    \ processors in your system for Intel OpenMP*\n\nTo achieve higher performance,\
    \ set the number of threads to the number of real processors or physical cores,\
    \ as summarized in Techniques to Set the Number of Threads.\n\n+   - Except LAPACK\
    \ deprecated routines ?lacon, ?las3, and ?las4."
