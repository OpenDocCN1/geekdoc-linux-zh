    # Known Limitations


    There are three kinds of limitations:


    +   - Functionality

    - Performance

    - Known bugs


    **Functionality.** It is possible that some MKL functions will not work if called
    from the Java environment by using a wrapper, like those provided with the Intel
    MKL Java examples. Only those specific CBLAS, FFT, VML, VSL RNG, and the convolution/correlation
    functions listed in Intel MKL Java Examples section were tested with the Java
    environment. So, you may use the Java wrappers for these CBLAS, FFT, VML, VSL
    RNG, and convolution/correlation functions in your Java applications.


    **Performance.** The functions from Intel MKL must work faster than similar functions
    written in pure java. However, the main goal of these wrappers is to provide code
    examples, not maximum performance. So, an Intel MKL function called from a Java
    application will probably work slower than the same function called from a program
    written in C/C++ or Fortran.


