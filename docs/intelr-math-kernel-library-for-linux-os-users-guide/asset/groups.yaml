    \ 4.0 链接 Intel MKL，请遵循以下指令：\n\n- 1. 如果工具链/编译器集成支持包含路径选项，进入 `C/C++ General > Paths\
    \ and Symbols` 属性页的 `Includes` 选项卡，并设置 Intel MKL 包含路径，即 `<mkl directory>/include`。\n\
    - 2. 如果工具链/编译器集成支持库路径选项，进入 `C/C++ General > Paths and Symbols` 属性页的 `Library Paths`\
