    If you type the make command and omit the target (so32), the makefile prints the
    help info, which explains the targets and parameters.


    For the examples list, we see the examples.lst file in the Java examples directory.


    # Known Limitations


    There are three kinds of limitations:


    +   - Functionality

    - Performance

    - Known bugs


    **Functionality.** It is possible that some MKL functions will not work if called
    from the Java environment by using a wrapper, like those provided with the Intel
    MKL Java examples. Only those specific CBLAS, FFT, VML, VSL RNG, and the convolution/correlation
    functions listed in Intel MKL Java Examples section were tested with the Java
    environment. So, you may use the Java wrappers for these CBLAS, FFT, VML, VSL
    RNG, and convolution/correlation functions in your Java applications.


    **Performance.** The functions from Intel MKL must work faster than similar functions
    written in pure java. However, the main goal of these wrappers is to provide code
    examples, not maximum performance. So, an Intel MKL function called from a Java
    application will probably work slower than the same function called from a program
    written in C/C++ or Fortran.


    **Known bugs.** There are a number of known bugs in Intel MKL (identified in the
    Release Notes), as well as incompatibilities between different versions of JDK.
    The examples and wrappers include workarounds for these problems, so most of the
    examples work anyway. The source code in the examples and wrappers include comments
    that describe thearounds.'
  - '[PAGE 89]


    This chapter discusses programming with the Intel® Math Kernel Library (Intel®
    MKL) to provide coding tips that meet certain, specific needs, such as numerical
    stability. Similarly, Chapter 7 focuses on general language-specific programming
    options, and Chapter 6 provides tips relevant to performance and memory management.


    # # Aligning Data for Numerical Stability


    If linear algebra routines (LAPACK, BLAS) are applied to input data that are bit-for-bit
    identical but the arrays are aligned differently or the computations are performed
    on different platforms or with different numbers of threads, the output may not
    be bit-for-bit identical, though they will deviate within the appropriate error
    bounds. The Intel MKL version may also affect numerical stability of the output,
    as the routines may be implemented differently in different versions. With a given
    Intel MKL version, the outputs will be bit-for-bit identical provided all the
    following conditions are met:


    +   - the outputs are obtained on the same platform

    - the inputs are bit-for-bit identical

    - the input arrays are aligned identically at 16-byte boundaries

    - Intel MKL is run in the sequential mode


    Unlike the first two conditions, which are under the users’ control, the alignment
    of arrays, by default, is not. For instance, arrays dynamically allocated using
    malloc are aligned at 8-byte boundaries, not 16-byte boundaries. If you need numerically
    identical outputs, use `mkl_malloc()` to get the properly aligned workspace, as
    shown below:'
  - '[PAGE 90]


    # 8 Intel® Math Kernel Library User''s Guide


    # ## Example 8-1 Aligning Addresses at 16-byte Boundaries


    ```

    // ******** C language ******

    ...

    #include <stdlib.h>

    ...

    void *d;

    int workspace;

    ...

    // Allocate workspace aligned on 16-bit boundary

    darray = mkl_malloc(sizeof(double)*workspace, 16 );

    ...

    // call the program using MKL

    mkl_app( darray );

    ...

    // Free workspace

    mkl_free( darray );


    ! ******** Fortran language ******

    ...

    double precision darray

    pointer (p_wrk,darray(1))

    integer workspace

    ...

    ! Allocate workspace aligned on 16-bit boundary

    p_wrk = mkl_malloc( 8*workspace, 16 )

    ...

    ! call the program using MKL

    call mkl_app( darray )

    ...

    ! Free workspace

    call mkl_free(p_wrk)

    ```'
