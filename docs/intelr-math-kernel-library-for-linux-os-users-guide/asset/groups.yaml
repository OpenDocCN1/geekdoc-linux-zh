    \ [interface=lp64|ilp64]             用于 IA-64 架构。\nINSTALL_DIR=<user_dir>\n```\n\
    \n> 注意。参数 INSTALL_DIR 是必需的。\n\n结果，生成的库将在 <user dir>/lib/<arch> 目录中构建并安装，而 .mod\
    \ 文件将在 <user dir>/include/<arch>/{lp64 | ilp64}] 目录中构建并安装，其中 <arch> 是 {32, em64,\
    \ 64} 之一之一。\n\n默认情况下，假设使用 ifort 编译器。您可以通过 make 的额外参数更改编译器命令名称：FC=<compiler>。\n\
    \n## 7 Intel® 数学内核库用户指南\n\n例如，命令\n\n```\nlibem64t FC=pgf95_DIR=<user_pgf95_dir>\
    \ interface=lp64\n```\n\n将构建所需的库 .mod 文件并将其安装在 <user_pgf95_dir> 的子目录下。\n\n在构建库时也有使用接口的方法。\n\
    \n要从构建目录删除库，请使用以下命令：\n\n```\nmake clean32 INSTALL_DIR=<user_dir>           用于\
    \ IA-32 架构。\nmake clean64t INSTALL_DIR=<user_dir>     用于 Intel® 64 架构。\nmake clean64\
    \ INSTALL_DIR=<user_dir>      用于 IA-64 架构。\nmake clean INSTALL_DIR=<user_dir>\
    \        用于所有架构。\n```\n\n![](img/78e923baedeba397a89d376927830122_75_0.png)\n\n\
    > 注意。在构建或清理命令中设置 INSTALL_DIR=../ 或 INSTALL_DIR=<mki_directory> 将替换或删除 Intel MKL\
    \ 预编译的 Fortran 95 库和模块。只有在您拥有管理员权限的情况下可行，强烈建议不要这样做。\n\n## 编译器相关函数和 Fortran 90\
    \ 模块\n\n当编译器将函数放入对象代码调用时，就会编译器相关函数，这些调用在其运行时库 (RTL) 中解析。链接没有相应 RTL 的代码将导致未定义符号。Intel\
    \ MKL 的设计是为了尽可能地减少对 RTL 的依赖。\n\n在发生依赖的地方，Intel MKL 会随带一个支持性的 RTL。除了 Intel MKL\
    \ 集群软件相关的外，RTL 的示例包括 libomp 和 libguide，这些是使用 Intel® 编译器编译的 OpenMP® 代码的库。libomp\
    \ 和 libguide 都支持 Intel MKL 中的线程代码。\n\n在其他情况下，可能会出现 RTL 依赖，函数以源码形式提供，您需要使用用于应用程序的任何编译器来编译代码。\n\
    \n特别是，Fortran 90 模块会导致需要 RTL 支持的特定编译器代码生成因此，Intel MKL 以源码形式提供这些模块。\n\n## 使用 Intel®\
    \ MKL 进行混合语言编程\n\n附录 A 列出了每个 Intel MKL 函数领域支持的编程语言。然而，您可以从不同的语言环境调用 Intel MKL\
    \ 例程。本节解释了如何使用混合语言编程来实现。\n\n## 从 C 语言环境调用 LAPACK、BLAS 和 CBLAS 例程\n\n并非所有 Intel\
    \ MKL 函数领域支持 C 和 Fortran 环境。要在 C/C++ 环境中使用 Intel MKL Fortran 风格函数，您应该遵守约定，下小节将在\
    \ LAPACK 和 BLAS 中讨论了这些约定。\n\n> 警告。避免从 C/C++ 调用 BLAS95/LAPACK95。此类调用需要具备处理延迟形状数组描述符的技能，这是\
    \ Fortran 90 的类型。此外，BLAS95/LAPACK95 例程包含对 Fortran RTL 的链接。\n\n## LAPACK\n\n由于\
    \ LAPACK 例程是 Fortran 风格的，当从 C 调用它们时，必须遵循以下点：\n\n- * 通过地址传递变量而不是通过值。\n- * 以列优先存储数据而不是行优先。\n\
    \n## 7 Intel® 数学内核库用户指南\n\n图 7-1 列优先对比行优先\n\n| | 列优先 | 行优先 |\n|---|---|---|\n\
    | 1 | A(1,1) | A(1,1) |\n| 2 | A(2,1) | A(1,2) |\n| 3 | A(3,1) | A(1,3) |\n| 4\
    \ | A(1,2) | A(2,1) |\n| 5 | A(2,2) | A(2,2) |\n| 6 | A(3,2) | A(2,3) |\n| 7 |\
    \ A(1,3) | A(3,1) |\n| 8 | A(2,3) | A(3,2) |\n| 9 | A(3,3) | A(3,3) |\n\n从 C 调用\
    \ LAPACK 时，请注意由于 Fortran 语言对大小写敏感，例程名称可以是大写或小写，带或不带下划线。例如，这些名称是等价的：getrf, GETRF_.\n\
    \n## BLAS\n\nBLAS 例程是 Fortran 风格的。从 C 调用它们时，必须遵循以下点：\n\n- * 通过地址传递变量而不是通过值。\n\
    - * 以列优先存储数据而不是行优先。\n\n参见 LAPACK 节了解这些约定。参见示例 7-2 的 BLAS。\n\n## CBLAS\n\n与其从 C\
    \ 语言调用 BLAS 例程，可以使用 CBLAS 接口。\n\nBLAS 是 BLAS 例程的 C 风格接口。可以使用标准的 C 风格调用 CBLAS。当使用\
    \ CBLAS 接口时，头文件 mkl.h 会简化程序开发，因为它包含了枚举以及所有函数原型。头文件会判断是否是使用 C++ 编译器编译，如果是，则包含的文件对于\
    \ C++ 是正确的。\n\n示例 7-3\n\n 在 C/C++ 中使用复类型\n\n如 Intel® Fortran 编译器构建应用程序文档所示，C/C++\
    \ 不直接实现 Fortran 类型 COMPLEX(4) 和 COMPLEX(8)。然而，您可以编写等效结构。\n\nIntel MK 提供了复类型 MKL_Complex8\
    \ 和 MKL_Complex16，它们分别是 Fortran 类型 COMPLEX(4) 和 COMPLEX(8) 的结构。这些类型在 mkl_types.h\
    \ 头文件中定义。您也可以在包含 mkl_types.h 头文件之前用自己的类型定义这些类型。\n\n"
