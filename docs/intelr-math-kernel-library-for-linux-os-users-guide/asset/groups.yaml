    # 7 Intel® Math Kernel Library User''s Guide


    The examples are written in Java. They demonstrate usage of the MKL functions
    with the following variety of data:


    +   - 1- and 2-dimensional data sequences

    - real and complex types of the data

    - single and double precision


    However, note that the wrappers, used in the examples, do not:


    +   - Demonstrate the use of huge arrays (>2 billion elements)

    - Demonstrate processing of arrays in native memory

    - Check correctness of function parameters

    - Demonstrate performance optimizations


    To bind with Intel MKL, the examples use the Java Native Interface (JNI*) developer
    framework. The JNI documentation is available from http://java.sun.com/javase/6/docs/technotes/guides/jni/.


    The Java example includes JNI wrappers that perform the binding. The wrappers
    do not depend on the examples and may be used in your Java applications. The wrappers
    for CBLAS, FFT, VML, V RNG, and ESSL-like convolution and correlation functions
    do not depend on each other.


    To build the wrappers, just run the examples (see Running the Examples for details).
    The makefile builds the wrapper binaries. After running the makefile, you can
    run the examples, which will determine whether the wrappers were built correctly.
    As a result of running the examples, the following directories will be created
    <mkl directory>/examples/java:


    +   - docs

    - include

    - classes

    - bin

    - _results


    The directories docs, include, classes, and bin will contain the wrapper binaries
    and documentation; the directory _results will contain the testing results.


    For a Java programmer, the wrappers look like the following Java classes:


    +   - com.intel.mkl.BLAS

    - com.intel.mkl.DFTI

    - com.intel.mkl.ESSL

    - com.intel.mkl.VML

    - com.intel.mkl.VSL


