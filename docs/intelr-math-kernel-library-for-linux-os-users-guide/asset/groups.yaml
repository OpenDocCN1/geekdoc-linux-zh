    # 1 Intel® Math Kernel Library 用户指南


    -   《Intel MKL 参考手册》，该手册提供了关于例程序功能、参数描述、接口、调用语法和返回值的参考信息。

    -   《Intel® Math Kernel Library for Linux 发布说明》。


    本用户指南旨在帮助您在 Linux 上掌握 Intel MKL 的用法。具体而言，它：


    -   描述了安装后的步骤，帮助您开始使用该库。

    -   向您展示了如何在您的开发环境中配置该库。

    -   让您了解如何将应用程序链接到该库，并提供了简单的使用场景。

    -   解释了如何使用 Intel MKL for Linux 编写、编译和运行您的应用程序。


    本指南适用于从初级到高级经验的 Linux 程序员。


    # 文档结构


    本文档包含以下章节和附录：


    第 1 节概述。介绍 Intel MKL 的使用信息并描述了本文档的符号约定。


    第 2 节快速入门。描述了安装后的步骤，并提供了安装后开始使用 Intel MKL 所需的信息。


    第 3 节 Intel® Math Kernel Library 结构。讨论了安装后 Intel MKL 目录的结构。


    第 4 节 配置您的开发环境。解释了如何在您的开发环境中配置 Intel MKL。


    第 5 节 将您的应用程序与 Intel® Math Kernel Library 链接。解释了如何根据特定平台将库链接到应用程序中；讨论了如何构建自定义动态库。


    第 6 节 性能与内存管理。讨论了 Intel MKL 多线程；展示了编码技巧并为提高库的性能提供了硬件配置建议；解释了 Intel MKL 内存管理功能，特别展示了如何用您自己的函数替换该库默认使用的内存函数。


    第 7 节 语言特定的用法选项。讨论了混合语言编程以及特定语言接口的使用。


    第 8 节 编码技巧。提供了可能对您的特定需求有帮助的编码技巧。


    第 9 节 与 Intel® Math Kernel Library 集群软件协同工作。讨论了 ScalLAPACK 和集群 FFT 的使用；特别描述了应用程序与这些函数域的链接，包括
    C 和 Fortran 特定的链接示例；提供了有关支持的 MPI 的信息。


    第 10 节在 Eclipse* IDE 中获取编程帮助。讨论了软件工程师在 Eclipse* IDE 中工作时受益的 Intel MKL 特性。


    第 11 节 LINPACK 和 MP LINPACK 基准。讨论了针对 Linux* 的 Intel® Optimized LINPACK Benchmark
    以及针对集群的 Intel® Optimized MP LINPACK Benchmark。


    附录 A Intel® Math Kernel Library 语言接口支持。总结了 Intel MKL 为每个函数域提供的语言接口信息，包括相应的头文件。


    附录 B 对第三方接口的支持。描述了 Intel MKL 支持的一些接口。


    文档还包含索引。


    # 术语和符号约定


    以下术语指代操作系统：


    -   Linux* OS


    该术语指的是所有支持的 Linux* 操作系统有效的信息。


    引用 Intel MKL 目录时使用以下符号：


    -   `<mkl_directory>`


    Intel MKL 安装的主目录。在配置、链接和构建指令中，请将此占位符替换为特定路径。更多信息请参阅“快速入门”。


    -   `<Intel Compiler Pro directory>`


    Intel® C++ 编译器专业版或 Intel® Fortran 编译器专业版的安装目录。更多信息请参阅“快速入门”。


    # Intel® Math Kernel Library 用户指南


    表 1-1 列出了其他符号约定：


    | 表 1-1 符号约定 |

    | :--- | :--- |

    | *斜体* | 斜体用于强调，也表示正文中的文档名称，例如：see Intel MKL Reference Manual |

    | `等宽小写` | 表示文件名、目录名和路径，例如：`libmkl_core.a` `/opt/mkl/10.2.004` |

    | `等宽小写混合大写` | 表示命令和命令行选项，例如：`icc myprog.c -LMKLPATH -LMKLINCLUDE -lmkl -lguide
    -lpthread`；C/C++ 代码段，例如：`a = new double [SIZE][SIZE];` |

    | `大写等宽` | 表示系统变量，例如：`$MKLPATH` |

    | `等宽斜体` | 表示讨论中的参数：例程序参数，例如：`lda`；`functions_list`；等。当在角括号中时，表示标识符、表达式、字符串或值的占位符，`<mkl_directory>`。用这些项目中的一个替换占位符。
    |


    -   `[ ]` 方括号表示括号内的项目是可选的。

    -   `{ | }` 大括号表示括号列出的项目中应选择一个。竖线 (`|`) 分隔项目。


    # 快速入门


    本章提供了一些基本的用法信息，并描述了安装后的步骤，帮助您在 Linux* OS 上开始 Intel® Math Kernel Library (Intel®
    MKL)。


    # 开始之前


    在开始使用 Intel MKL 之前，学习几个重要概念将有助于您有一个良好的开始，如表 2-1 所示。


    | 表 2-1 | 开始之前需要了解 |

    | :--- | :--- |

    | 目标平台 | - IA-32 或兼容<br>- Intel® 64 或兼容<br>- IA-64 (Itanium®处理器家族) |


    **操作**：识别目标机器的架构：

    **原因**：由于 Intel MKL 库位于对应于特定架构（参见“架构支持”），您应该提供正确的路径（参见“链接”）。为了为 Intel MKL 配置开发环境，请设置环境变量（参见“环境变量”）。


    | 表 2-1 | 开始之前需要了解（续） |

    | :--- | :--- |

    | **操作**：识别您需要的所有 MKL 函数域：br>- BLAS<br>- 稀疏 BLAS<br>- LAPACK<br>- PBLAS<br>- ScalACK<br>-
    稀疏求解器<br>- 向量数学库函数<br>- 向量统计库函数<br>- 傅叶变换函数 (FFT)<br>- 集群 FFT<br>- 三角变换例程序<br>-
    Poisson, Laplace 和 Helmholtz 求解器<br>- 优化 (置信)<br>- GMP* 算术函数 |


    **参考**：您打算使用的函数将缩小《参考手册》中特定需求的范围。此外，如果您使用 MKL 集群软件，您的链接是特定的函数域（参见“与 Intel Math
    Kernel Library 集群软件协同工作”）。编码技巧也取决于函数域（参见“提高性能的技巧）。


    **操作**：虽然 Intel MKL 同时支持 Fortran 和 C/C++，但并非所有函数都支持特定的语言环境，例如 C/C++ 或 Fortran
    90/95。识别您的函数支持的语言接口（Intel® Math Kernel Library 语言接口支持）。


    **编程语言**

    **原因**：如果您的函数没有直接支持所需的语言，可以使用混合编程（参见与 Intel MKL 的混合编程）。


    有关特定语言接口和模块的列表以及生成它们的示例，请参见“在 Intel MKL 中使用语言特定接口”。


    **操作**：如果您的系统基于 Intel 64 或 IA-64 架构，识别您的应用程序是否对大数据数组（超过 2³¹ 个元素）进行计算。


    **整数数据范围**

    **原因**：为了对大数据数组进行操作，您需要使用 ILP64 接口，其中整数为 64 位；否则使用默认的 LP64 接口，其中整数为 32 位（参见对 ILP64
    编程的支持）。


