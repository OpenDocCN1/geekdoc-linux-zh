  - '[PAGE 119]


    # Support for Third-Party Interfaces


    This appendix describes in brief certain interfaces that Intel® Math Kernel Library
    (Intel® MKL) supports.


    # GMP* Functions


    Intel MKL implementation of GMP* arithmetic functions includes arbitrary precision
    arithmetic operations on integer numbers. The interfaces of such functions fully
    match GNU Multiple Precision* (GMP) Arithmetic Library. For specifications of
    these functions, please see http://www.intel.com/software/products/mkl/gnump/WebHelp/.


    If you currently use the GMP* library, you need to modify INCLUDE statements in
    your programs to `mkl_gmp.h`.


    # FFTW Interface Support


    Intel MKL offers two collections of wrappers being the FFTW interface (www.fftw.org)
    super }{ to be used for calling the Intel MKL Fourier transform functions. These
    collections correspond to the FFTW versions 2.x and 3.x and the Intel MKL versions
    7.0 and later.


    These wrappers enable developers whose programs currently use FFTW to gain performance
    with the Intel MKL Fourier transforms without changing the program source code.
    See the “FFTW to Intel® MKL Wrappers” appendix in the Intel MKL Reference Manual
    for details on the use of the wrappers.'
