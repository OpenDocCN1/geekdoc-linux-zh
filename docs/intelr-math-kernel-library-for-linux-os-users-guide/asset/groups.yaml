    表 3–4 针对架构的实现\n\n| 架构 | 位置 |\n|---|---|\n| IA-32 或兼容 | <mkl directory>/lib/32\
    \ |\n| Intel® 64 或兼容 | <mkl directory>/lib/64t |\n| IA-64 | <mkl directory>/lib/64\
    \ |\n\n有关这些目录的详细结构请参见表 3-5、表 3-6 和表 3-7。\n\n"
