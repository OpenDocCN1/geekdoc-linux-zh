    # 5 Intel® Math Kernel Library User''s Guide


    support for one additional threading compiler on Linux (GNU). That is, a program
    threaded with a GNU compiler can safely be linked with Intel MKL and libiomp and
    execute efficiently and effectively. So, you are encouraged to use libiomp rather
    than libguide, and

    possibilities for each scenario to choose the threading libraries and RTL when
    using Intel MKL (static cases only):


    [Table 5-2](#) shows different scenarios, depending on the threading compiler
    used, and


    # Table 5-2 Selecting Threading Libraries


    | Compiler | Threaded? | Threading Layer | RTL Recommended | Comment |

    |---|---|---|---|---|---|

    | Intel | Does not matter | libmkml_intel_thread.a | libomp5.so | |

    | PGI | Yes | libmkml_pgi_thread.a or libmkml_sequential.a | PGI* supplied | Use
    of libmkl_sequential_a removes threading from Intel MKL calls. |

    | PGI | No | libmkml_intel_thread.a | libomp5.so | |

    | PGI | No | libmkml_pgi_thread.a | PGI* supplied | |

    | PGI | No | libmkml_sequential.a | None | |

    | gnu | Yes | libmkml_gnu_thread.a | libomp5.so or GNU OpenMP run-time library
    | libomp5 offers superior scaling performance. |

    | gnu | Yes | libmkml_sequential.a | None | |

    | gnu | No | libmkml_intel_thread.a | libomp5.so | |

    | other | Yes | libmkml_sequential.a | None | |

    | other | No | libmkml_intel_thread.a | libomp5.so | |


    # Linking with Computational Libraries


    Typically, with the layered linking model, you must link your application with
    only one computational library. However, certain Intel MKL function domains require
    several computational libraries.


    For each Intel MKL function domain, [Table 5-3](#) lists computational libraries
    that you must include in the link line. For more information on linking with ScaLAPACK
    and Cluster FFTs, see also [Linking with ScaLAPACK and Cluster FFTs](#).'
