    \n以下示例展示了在 C 和 C++ 中使用 Fortran 风格的 BLAS 接口，以及 CBLAS（C 语言）接口。\n\n下面的示例说明了从 C 程序调用复数\
    \ BLAS  1 函数 zdotc()。该函数计算两个双精度向量的点积。\n\n在例示例中，复数点积通过结构体 c 返回。\n\n# 示例 7-1 从 C\
