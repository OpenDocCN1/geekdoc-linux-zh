    # 11 Intel® 数学库用户指南


    ## 针对集群的 Intel® Optimized MP LINPACK 基准


    针对集群的 Intel® Optimized MP LINPACK 基准基于田纳西大学诺克斯维分校（UTK）创新计算实验室（ICL）对 HPL 2.0 的修改和添加。针对集群的
    Intel® Optimized MP LINPACK 基准可用于 Top 500 排名运行（参见 http://www.top500.org）。要使用该基准，您需要熟悉
    HPL 的分发和用法。Intel® Optimized MP LINPACK 基准提供了一些额外的增强和错误修复，旨在使 HPL 的使用更加方便，并解释了可能增强性能的
    Intel® MPI 设置。./benchmarks/mp_linpack 添加了最小化与长时间运行相关的搜索时间的技术。


    针对集群的 Intel® Optimized MP LINPACK 基准是大规模并行 MP LINPACK 基准的实现，它通过随机线性方程组 (Ax=b)
    测量分解和求解系统所需，将该时间转换为性能率，并对结果的准确性进行测试。您可以解决任何适合内存的规模 (N) 方程组。该基准使用全主元法确保结果的准确性。


    在分布式内存机器上使用 Intel® Optimized MP LINPACK 基准，在共享内存机器上使用 Intel® Optimized MP LINPACK
    基准。


    Intel 提供了 LINPACK 基准的优化版本，帮助您在基于正 Intel® 处理器的系统上比使用 HPL 基准更容易获得高 LINPACK 基准结果。使用
    Intel® Optimized MP LINPACK 对您的集群进行基准测试。这些预构建的二进制文件要求您首先在集群上安装 Intel® MPI 3.x。Intel
    MPI 版本是免费的，可以从 www.intel.com/software/products/cluster 下载。


    Intel 软件包包含了在田纳西大学诺克斯维尔分校创新计算实验室开发的软件，该大学或 ICL 均不认可或推广此产品。尽管 HPL 2.0 在某些条件下可以重新发布，但特定软件包受
    Intel MKL 许可证限制。


    Intel MKL 为 MP LINPACK 引入了一项新功能，称为混合构建（hybrid build），“混合”一词指的是为了利用混合 OpenMP*/MPI
    并行的特殊优化。如果您希望每个节点使用一个 MPI 进程并通过 OpenMP 实现进一步的并行化，请使用混合构建。通常，当每个核心的 MPI 进程少于一个时，混合构建非常有用。如果您希望完全依赖
    MPI 进行并行化并在每个核心使用一个 MPI，请使用非混合构建。


    除了某些混合预构建二进制文件外，Intel MKL 还提供了一些混合预构建库以利用额外的 OpenMP* 优化。


