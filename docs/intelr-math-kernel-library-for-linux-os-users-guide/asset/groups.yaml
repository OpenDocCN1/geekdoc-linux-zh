    return 0;\n```\n\n请参阅 Linux 程序员手册（man 页面格式）以了解上述示例中 `sched_setaffinity` 函数的细节。\n\
    \n## 处理次规数（Denormals）\n\nIEEE 754-2008 标准《二进制浮点算术 IEEE 标准》将次规数（或称为“非规格化数”）定义为小于特定浮点格式中最小归一化数的非零数字。对次规数进行浮点运算比对归一化操作数进行要慢，因为次规数操作数和结果通常通过软件辅助机制处理，而不是直接在硬件中处理。这种软件处理会导致消耗次规数的\
    \ Intel MKL 函数运行比处理归一化浮点数更慢。\n\n你可以通过设置 MXCSR 浮点控制寄存器中的适当位域，将次规数置零（FTZ）或将从内存加载的任何次规数替换为零（DAZ），来缓解此性能问题。检查你的编译器文档以确定其是否有控制\
    \ FTZ 和 DAZ 的选项。注意，这些编译器选项可能会略微影响准确性。\n\n## FFT 优化基数（Radices）\n\n如果你的数据向量长度允许分解为优化的基数，你可以提高\
    \ Intel MKL FFT 的性能。\n\n在 Intel MKL 中，优化的基数是 2, 3, 5, 7 和 11。\n\n## 使用 Intel®\
    \ MKL 内存管理\n\nIntel MKL 拥有内存管理软件，用于控制库函数使用的内存缓冲区。当应用程序调用某些函数（第 3  BLAS 或 FFT）时，库分配的新缓冲区在程序结束之前不会被释放。要获取内存管理软件分配的内存量，请调用\
    \ `mkl_mem_stat()` 函数。如果你的程序需要释放内存，请调用 `mkl_free_buffers()`。如果再次调用需要内存缓冲区的库函数，内存管理器将分配缓冲区，这些缓冲区将保持分配状态，直到程序结束或管理器将其释放。\n\
    \n这种行为有助于获得更好的性能。然而，某些工具可能会将此行为报告为内存泄漏。除了调用 `mkl_free_buffers()` 函数外，你还可以通过设置环境变量从程序中释放（free）内存。\n\
    \n内存管理软件默认开启，这使得由第 3 层 BLAS 和 FFT 调用分配的内存保留到程序结束。要禁用此内存管理软件，请将环境变量 `MKL_DISABLE_FAST_MM`\
    \ 设置为任何值，这将导致在每次调用之间进行分配和释放。禁用此功能会对第 3 层 BLAS 等程序的性能产生不利影响，特别是对于小规模问题。\n\n使用这些方法之一释放内存并不一定能阻止程序报告内存泄漏；事实上，如果你多次调用库，导致每次调用都需要新的分配，这可能会增加此类报告的数量。通过上述任何一种方法未释放的内将在程序结束时由系统释放。\n\
    \n## 重定义内存函数\n\nIntel MKL 的 C/C++ 用户可以使用它们自己的函数替换库默认使用的内存函数。内存重命名功能可以实现这种替换。\n\
    \n## 内存重命名（Memory Renaming）\n\nIntel MKL 内存管理默认使用标准的 C 运行时函数来分配或释放内存。这些函数可以使用内存重命名进行进行替换。\n\
    \nIntel MKL 通过指针 `i_malloc`、`i_free`、`i_calloc` 和 `i_realloc` 访问内存函数，这些指针在应用程序级别是可见的。这些指针最初持有标准\
    \ C 运行时内存函数 `malloc`、`free`、`calloc` 和 `realloc` 的地址。你可以编程地重新定义这些指针的值，指向应用程序内存管理函数的地址。\n\
    \n重定向指针是使用自定义管理函数的唯一正确方法。如果你在不重定向指针的情况下调用自己的内存函数，内存将由两个独立的内存包管理，这可能会导致意外的内存问题。\n\
    \n## 如何重定义内存函数\n\n要重定义内存函数，请按照以下步骤：\n\n- 1. 在代码中包含 `i_malloc.h` 头文件。该头文件包含了开发者替换内存分配函数所需的所有声明。头文件还描述了在支持此功能的\
    \ Intel 库中如何替换分配。\n- 2. 在第一次调用 MKL 函数之前，重定义指针 `i_malloc`、`i_free`、`i_calloc`、`i_realloc`\
    \ 的值：\n\n### 示例 6-4 重定义内存函数\n\n```c\n#include \"i_malloc.h\"\ni_malloc = my_malloc;\n\
    i_free = my_free;\ni_calloc = my_calloc;\ni_realloc = my_realloc;\n```\n\n## 特定语言用法（Language-specific）\n\
    \nIntel 数学库（Intel MKL）对 Fortran 和 C 有广泛支持。本节重点关注特定语言选项。如果你想使用 Fortran，请参见第 7-1\
    \ 节的库和模块。\n\n### 7-1 库\n\n| 文件名 | 包含 |\n| :--- | :--- |\n| libmkl_intel_lp64.a\
    \ | Fortran 95 接口 |\n| libmkl_intel_il64.a | Fortran 95 接口 |\n| libmkl_intelthread_lp64.a\
    \ | Fortran 95 接口 |\n| libmkl_intelthread_il64.a | Fortran 95 接口 |\n| libmkl_sequential_lp64.a\
    \ | Fortran 95 接口 |\n| libmkl_sequential_il64.a | Fortran 95 接口 |\n\n### 7-1 模块（继续）\n\
    \n| 文件名 | 包含 |\n| :--- | :--- |\n| libmkl_core_lp64.a | Fortran 95 接口 |\n| libmkl_core_il64.a\
    \ | Fortran 95 接口 |\n| libmkl_rt_lp64.a | Fortran 95 接口 |\n| libmkl_rt_il64.a\
    \ | Fortran 95 接口 |\n\n"
