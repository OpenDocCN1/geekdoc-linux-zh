    \ in the structure c.\n\n# Example 7-1 Calling a Complex BLAS 1 Function from\
    \ C\n\n```\n#include \"mkl.h\"\n\n#define N 5\nvoid main()\n{\n    MKL_int n =\
    \ N, inc = 1, incb = 1, i;\n    MKL_Complex16 a[N], b[N], c;\n    for( i = 0;\
    \ i < n; i++){\n        a[i].re = (double)i; a[i].im = (double)i * 2.0;\n    \
    \    b[i].re = (double)(n - i); b[i].im = (double)i * 2.0;\n    }\n\n    zdotc(&c,\
    \ &n, a, &inca, b, &incb);\n    printf(\"The complex dot product is: %6.2f, %6.2f\\\
    n\", c.re, c.im);\n}\n```"
