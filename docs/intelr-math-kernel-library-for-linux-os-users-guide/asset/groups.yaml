  mdcn: "\n# LINPACK 和 MP LINPACK 基准测试 11\n\n- 你可以设置 MPI 变量，即 `MPdir`、`MPinc` 和 `MPlib`。\n\
    - 指定使用的 Intel MKL 文件位置（`LAdir`、`LAinc`、`LAl`）。\n- 调整编译器和链接器选项。\n- 指定要构建的 LINPACK\
    \ 版本（混合或非混合），通过设置 `make` 命令的版本参数来实现，例如：\n  `make arch=em64 linpack`\n\n对于某些示例，例如基于\
    \ Intel 64 架构的 Linux 系统，包含必须的常用值。然而，你需要熟悉构建 HPL 以及为这些变量选择合适的值。\n\n# 新功能\n\n该工具集与\
    \ HPL 2.0 版本基本相同。有一些可选更改是默认禁用的，除非你明确请求它们。这些新功能包括：\n\n**ASYOUGO**：在运行时提供非侵入性的性能信息。只有少量输出且不影响性能。这非常有用，因为许多运行可能会持续小时而没有任何信息。\n\
    **ASYOUGO2**：提供轻微侵入性的额外性能信息，因为它会截获直到 DGEMM。\n**ASYOUGO2_DISPLAY**：显示运行中所有重要的 DGEMM\
    \ 性能。\n**ENDEARLY**：显示少量性能提示并提前结束运行。\n**FASTSWAP**：将 LAPACK 优化的 DLWP 插入 HPL 代码中。这对于\
    \ Itanium 处理器可能会有益。\n**HYBRID**：建立 LINPACK 的混合 OpenMP/MPI 模式，提供了使用线程化 MKL 和预编译\
    \ LINPACK 库的可能性。\n\n> **警告**。仅在 MPI 库版本为3.1 或更高时使用此选项。建议也使用 10.0 或更高版本的编译器。![](78e923baedeba397a89d3769_0.png)\n\
    \n# Intel 数学库用户指南\n\n# 对集群进行基准测试\n\n要对集群进行基准测试，请遵循以下步骤（部分为可选）。注意第 3 和第 4 步。它们构成了一个循环来搜索\
    \ HPL.dat 中指定的 HPL 参数，使你达到集群的最佳性能。\n\n1. 安装 HPL 并确保 HPL 在所有节点上运行正常。\n2. 你可以运行\
    \ `nodeperf.c`（包含在发行版中）查看所有节点的 DGEMM 性能。\n\n```\n使用你的 MPI 和 Intel MKL 编译 nodeperf.c。例如：\n\
    mppiacc -o3 nodeperf.c -LMKL $MKLPATH/mkl_intel_lp64.a \\\n-W1,--start-group $MKLPATH/mkl_sequential.a\
    \ \\\n$MKLPATH/mkl_core.a -W1,--end-group -thread\n```\n\n在所有节点上启动 nodeperf.c\
    \ 对于大型集群 特为重要。确实，某个节点可能会比其他节点慢 5%，LINPACK 将以最慢节点的速度运行。在这种情况下，nodeperf 能够在搜索大量的\
    \ HPL 运行中快速识别问题所在。它逐个遍历所有节点，并报告 DGEMM 性能。因此，DGEMM 性能越高，该节点运行得越快。\n\n3. 编辑 HPL.dat\
    \ 以适应你的集群需求。阅读这些想法的 HPL 文档。然而，你应该至少在 4 个节点上尝试。\n4. 运行 HPL，使用如 **ASYOUGO**、**ASYOUGO2**\
    \ 和 **ENDEARLY** 等编译选项来辅助搜索（这些选项让你比 HPL 更快地获得性能洞察）。\n\n在这样做时，请遵循以下建议：\n\n# LINPACK\
    \ 和 MP LINPACK 基准测试\n\n- 使用 MP LINPACK（HPL 的补丁版本）来节省搜索时间。\n\n使用补丁版本的 HPL 不会影响你的性能。这就是为什么可能影响性能的功能是可选的（在下文\
    \ MP LINPACK 中解释）。也就是说，如果你不使用“减少搜索时间”中解释的新选项，这些更改将被禁用。这些新增的主要目的是协助你找到解决方案。\n\n\
    HPL 需要大量时间来搜索许多参数。在 MP LINPACK 中，目标是获得可能的数值。\n\n由于输入是不固定的，你必须搜索一个巨大的参数空间。对于强大的集群，穷尽搜索所有可能的输入可能是巨大的。\n\
    \n此补丁版本的 HPL 只在执行过程中提高性能，或者根据你的要求提前结束。\n\n通过编译 `-DENDERALLY-DASYOUGO2`（“减少搜索时间”中描述）并使用负阈值来节省时间（在打算提交的\
    \ Top500 条目的最终运行中不要使用负阈值）。你可以在 HPL 2.0 输入文件的第 13 行设置阈值。\n如果你运行完整个问题，请使用 `-ASYOUGO`（参见“减少搜索时间”）。\n\
    \n- 使用快速反馈，返回第 3 步并更新，直到你确定性能尽可能好。\n\n# 减少搜索时间的选项\n\n在大量节点上运行完大型问题可能需要数小时。MP LINPACK\
    \ 的搜索是巨大的：你不仅可以运行任何尺寸，还可以针对块大小、网格布局、预取步（lookahead steps）、使用不同的分解方法等。运行完大型问题却发现它比你之前的最佳结果慢了\
    \ 0.01%，这可能是极大的时间浪费。有 3 个选项：谨慎使用 **ASYOUGO2**，因为它会有细微影响。要查看 DGEMM 内部性能，请使用 **ASYOUGO**\
    \ 和 **ASYOUGO2_DISPLAY** 进行编译。这些选项提供了大量的 DGEMM 信息，代价是大约 0.2% 的损失。如果你想使用旧版 HPL，只需跳过这些选项并从头编译（尝试\
    \ `make clean_all`）。\n\n# MP LINPACK 基准测试\n\n- **ASYOUGO2**：提供详细的单节点 DGEMM 信息。它捕捉所有的\
    \ DGEMM 调用（如果你使用 Fortran BLAS）并记录其数据。由于此，该程序有细微的开销。与相当非侵入的 **ASYOUGO** 不同，**ASYOUGO2**\
    \ 会中断每一个 DGEMM 调用以监控其性能。你应该意识到这一点，尽管对于大问题，这种开销小于 1/10。\n**ASYOUGO**：在运行期间提供非侵入性的性能信息。只有少量输出且不影响性能。这非常有用，因为许多运行可能会持续小时而没有任何信息。\n\
    \n以下是 DGEMM 性能示例：\n\n| Col | DT | DF | M |\n| :--- | :--- | :--- | :--- |\n| 128\
    \ | 0.5 | 0.0 | 40 |\n| 160 | 0.0 | 0.0 | 128 |\n| 128 | 0.0 | 0.0 | 160 |\n|\
    \ 128 | 0.0 | 0.0 | 128 |\n\n基于 128 列 LU 带有预取步的估计值，在输出结果时该工作尚未完成。然而，这是识别运行的良好估计。以\
    \ LU flops 的数量为基准，通过与 DGEMM 比较，你可以获得我们性能的下限。\n"
