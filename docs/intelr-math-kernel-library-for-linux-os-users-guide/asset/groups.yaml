    \ MKL 包含路径设置为 `<mkl directory>/include`。\n  - 2. 进入 `C/C++ Project` 属性页的 `Tabs`，并设置链接到应用程序的\
    \ Intel MKL 库，例如 `<mkl directory>/lib/64t/lmkl_intel_lp64.a`、`<mkl directory>/lib/64t/lmkl_intel_thread.a`\
    \ 和 `<mkl directory>/lib/64t/lmkl_core.a`。\n\n要了解如何选择库，请参见“选择要链接的库”。\n\n注意，对于\
    \ Standard Make，上述设置仅用于 CDT 内部功能。编译器/链接器不会自动选取这些设置，您仍需要在 Makefile 中指定它们。\n\n-\
    \ * 对于 Managed 项目，可以指定特定的设置：\n  - 1. 进入 `C/C++ Build -> Settings` 属性页。所有您需要的设置取决于编译器集成，因此未给出。\n\
    \  - 2. 如果编译器集成支持包含路径选项，设置 Intel MKL 包含路径为 `<mkl directory>/include`。\n  - 3.\
    \ 如果编译器集成支持库路径选项，为目标架构设置 MKL 路径，例如 `<mkl directory>/lib/64t`。\n  - 4. 指定要链接的 Intel\
