  - '[PAGE 61]


    # Managing Performance and Memory


    > NOTE. Intel MKL does not always have a choice on the number of threads for certain
    reasons, such as system resources.


    Use of the Intel MKL threading controls in your application is optional. If you
    do not use them, the library will mainly behave the same way as Intel MKL 9.1
    in what relates to threading with the possible exception of a different number
    of threads.


    Section "Number of User Threads" in the "Fourier Transform Functions" chapter
    of the Intel MKL Reference Manual shows how Intel MKL threading controls help
    to set the number of threads for the FFT computation.


    Table 6-2 lists the Intel MKL environment variables for threading control, their
    equivalent functions, and OMP counterparts:


    | Environment Variable | Service Function | Comment | Equivalent OpenMP Environment
    Variable |

    | MKL_NUM_THREADS | mkl_set_num_threads | Suggests the number of threads to use.
    | OMP_NUM_THREADS |

    | MKL_DOMAIN_NUM_THREADS | mkl_domain_num_threads | Suggests the number of threads
    for a particular function domain. | |

    | MKL_DYNAMIC | mkl_set_dynamic | Enables Intel MKL to dynamically change the
    number of threads. | OMP_DYNAMIC |


    > NOTE. The functions take precedence over the respective environment variables.
    In particular, if in your application, you want Intel MKL to use a given number
    of threads and do not want users of your application to change via this environment
    variables, set this number of threads by a call to mkl_set_num_threads(), which
    will have full precedence over any environment variables being set.'
  - '[PAGE 62]


    # 6 Intel® Math Kernel Library User''s Guide


    The example below illustrates the use of the Intel MKL function mkl_set_num_threads
    to mimic the Intel MKL 9.x default behavior, which is running on one thread.


    # Example 6-2 Setting the Number of Threads to One


    ```

    // ****** C language ******

    #include <omp.h>

    #include <mkl.h>

    ...

    nmkl_set_num_threads ( 1 );


    // ****** Fortran language ******

    ...

    call mkl_set_num_threads( 1 )

    ```


    The section further explains the Intel MKL environment variables for threading
    control. The Intel MKL Reference Manual for the detailed description of the threading
    control functions, its parameters, calling syntax, and more code examples.


    # MKL_DYNAMIC


    The default value of MKL_DYNAMIC is TRUE, regardless of OMP_DYNAMIC, whose default
    value may be FALSE.


    MKL_DYNAMIC being TRUE means that Intel MKL will always try to pick what it considers
    the best number of threads, up to the maximum specified by the user.


    MKL_DYNAMIC being FALSE means that Intel MKL will normally try to deviate from
    the number of threads the user requested. However, setting MKL_DYNAMIC=FALSE does
    not ensure that Intel MKL will use the number of threads you request mainly because
    the library may have no choice on this number for reasons as system resources.
    Moreover, the library may examine the problem and pick a different number of threads
    than the value selected. For example, if you attempt to do a size 1 matrix-matrix
    multiply across 8 threads, the library may choose to use only one thread because
    it is impractical to use 8 threads in this event.


    Note that if Intel MKL is called in a parallel region, it will use one thread
    by default. If you want the library to use nested parallelism, and the thread
    within a parallel region is compiled with the same OpenMP compiler as Intel MKL
    is using, you may experiment with setting MKL_DYNAMIC to FALSE and manually increasing
    the number of threads.


    In general, you should set MKL_DYNAMIC to FALSE only under circumstances that
    Intel MKL is unable to detect, for example, when nested parallelism is desired
    where the library is already called from a parallel section.'
  - '[PAGE 63]


    # Managing Performance and Memory


    MKL_DYNAMIC being TRUE, provides for optimal choice of the number of threads in
    the following cases:


    +   If the requested number of threads exceeds the number of physical cores (perhaps
    because of hyper-threading), and MKL_DYNAMIC is not changed from its default value
    of TRUE, Intel MKL will scale down the number of threads to the number of physical
    cores.


    +   If you are able to detect the presence of MPI, but cannot determine if it
    has been called in a thread-safe mode (it is impossible to detect with MPICH 1.2.x,
    or MKL_DYNAMIC has not been changed from its default value of TRUE, MKL will run
    one thread.


    # MKL_DOMAIN_NUM_THREADS


    MKL_DOMAIN_NUM_THREADS accepts a string value <MKL-env-string>, which must have
    the following format:


    ```

    <MKL-env-string> ::= <MKL-domain-env-string> { <delimiter>

    MKL-domain-env-string> >

    ```


    ```

    <delimiter> ::= <space-symbol>* { <space-symbol>

    ```


    ```

    <MKL-domain-env-string> ::= <MKL-domain-env-name> <uses>

    <number-of-threads>

    ```


    ```

    <MKL-domain-env-name> ::= MKL_ALL | MKL_BLAS | MKL_FFT | MKL_VML

    <uses> ::= [ <space-symbol> ] ( <space-symbol> ) <equality-sign> |

    <comma-symbol> ] [ <space-symbol> ]

    ```


    ```

    <number-of-threads> ::= <positive-number>

    <positive-number> ::= <decimal-positive-number> | <octal-number> | <hexadecimal-number>

    ```


    In the syntax above, MKL_BLAS indicates the BLAS function domain, MKL_FFT indicates
    non-cluster FFTs, and MKL_VML indicates the Vector Maths Library.


    For example:


    ```

    MKL_ALL 2 : MKL_BLAS 1 : MKL_FFT 4

    MKL_ALL=2 : MKL_BLAS=1 : MKL_FFT=4

    MKL_ALL,2, MKL_BLAS=1, MKL_FFT=4

    MKL_ALL=2; MKL_BLAS=1; MKL_FFT=4

    MKL_ALL = 2 MKL_BLAS 1 , MKL_FFT 4

    MKL_ALL,2: MKL_BLAS 1, MKL_FFT, 4 .

    ```'
