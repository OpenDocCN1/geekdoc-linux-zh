    # Working with the Intel® Math Kernel Library Cluster Software


    This chapter discusses the usage of the Intel® Math Kernel Library (Intel® MKL)
    ScaLAPACK and Cluster FFTs, mainly describing your linking with these domains
    and including C and Fortran-specific linking examples. Information on the supported
    MPI is also discussed.


    See Chapter 3 for details about the Intel MKL directory structure, including the
    available documentation in the `doc` directory.


    For information on MP LINPACK Benchmark for Clusters, you need to know how to
    link in Chapter 11.


    Intel MKL ScaLAPACK and Cluster FFTs support MPI implementations identified in
    the *MKL Release Notes.*


    To link a program that calls ScaLAPACK, you need to know how to link an MPI application
    first.


    Typically, this involves using *mpi* scripts and *mpif77* (C or FORTRAN 77 scripts)
    that use the correct MPI header files and others. If, for instance, you are using
    MPICH installed in `/opt/mpich`, then typically `/opt/mpich/bin/mpich/bin/mpif77`
    will be the compiler scripts and `/opt/mpich/lib/libmpich.a` will be the library
    used for that installation.


    # Linking with ScaLAPACK and Cluster FFTs


    To link with the Intel MKL ScaLAPACK and/or Cluster FFTs, basically use the general
    form:


    ```

    <MPI> linker script> <files to link> \

    -L<MKL> path> [-W,--start-group] <MKL Cluster Library> \ \

    <BLAS> <MKL Core Libraries> [-W,--end-group>

    ```


    where:


    <MPI> is one of several MPI implementations (MPICH, Intel MPI 2.x/3.x, and so
    on).'
