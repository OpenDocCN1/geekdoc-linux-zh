    # 6 Intel® Math Library User''s Guide


    The global variables MKL_ALL, MKL_BLAS, MKL_FFT, and MKL_VML, as well as the interface
    for the MKL threading control functions, can be found in the mkl.h header file.


    Table 6-3 illustrates how values of MKL_DOMAIN_NUM_THREADS are interpreted.


    ![](img/78e923baedeba397a89d376927830122_64_0.png)


    NOTE. The domain-specific settings take precedence over the others. For example,
    the "MKL_BLAS=4" value of MKL_DOMAIN_NUM_THREADS suggests trying 4 threads for
    BLAS, regardless of later setting MKL_NUM_THREADS, and a function call "mkl_domain_set_num_threads
    (4, MKL_BLAS);" suggests the same, regardless of later calls to mkl_set_num_threads().
    However, pay to a function call with input "MKL_ALL", such as "mkl_domain_set_num_threads
    (4, MKL_ALL);" is equivalent to "mkl_set_num_threads(4)", and thus it will be
    overwritten by later calls to mkl_set_num_threads. Similarly, the environment
    of MKL_DOMAIN_NUM_THREADS with "MKL_ALL=4" will be overwritten with MKL_DOMAIN_NUM_THREADS=2.


    Whereas the MKL_DOMAIN_NUM_THREADS environment variable enables you set several
    variables at once, for example, "MKL_BLAS=4, MKL_FFT=2", the corresponding function
    does not take syntax. So, to do the same with the function calls, you may need
    to make several calls, which in this example are as follows:


    ```

    mkl_domain_set_num_threads ( 4, MKL_BLAS );

    ```


    ```

    mkl_domain_set_num_threads ( 2, MKL_FFT );

    ```


    6-12'
  - '[PAGE 65]


    # Setting the Environment Variables for Threading Control


    To set the environment variables used for threading control, in the command shell
    in which the program is going to run, enter the export or set commands, depending
    on the shell used. For example, the format for the export command used with the
    bash and other shells is:


    ```

    export <VARIABLE_NAME>=<value>

    ```


    For example:


    ```

    export MKL_NUM_THREADS=4

    export MKL_DOMAIN_NUM_THREADS="MKL_ALL=1, MKL_BLAS=4"

    export MKL_DYNAMIC=FALSE

    ```


    For other shells, such as csh or tcsh, enter the set command.


    ```

    set <VARIABLE_NAME>=<value>

    ```


    For example:


    ```

    set MKL_NUM_THREADS=4

    set MKL_DOMAIN_NUM_THREADS="MKL_ALL=1, MKL_BLAS=4"

    set MKL_DYNAMIC=FALSE

    ```


    # Dispatching Intel® Advanced Vector Extensions (Intel\nAVX)


    Intel MKL 10.2 introduced optimized kernels for Intel® AVX. To have the Intel
    AVX instructions dispatched on Intel AVX-enabled hardware (or simulation), use
    the Intel MKL service function mkl_enable_instructions(). This function enables
    dispatching new AVX instructions. Call this function before any other Intel MKL
    function call. For the function description, see the Intel MKL Reference Manual.


    ![](img/78e923baedeba397a89d376927830122_65_0.png)


    > NOTE. Successful execution of this function does not guarantee instructions
    to be dispatched. Dispatching of a particular instruction depends on whether the
    hardware is Intel AVX-enabled and whether the function is already optimized to
    dispatch this instruction. However, do not call this function, new instructions
    will not be dispatched.'
  - '[PAGE 66]


    As the Intel AVX instruction set is evolving, the behavior of

    mkl_enable_instructions(\u2009\u0) may change with future Intel MKL releases.
    Refer to the

    Release Notes for release-specific details of the behavior.


    # Tips and Techniques to Improve Performance


    To obtain the best performance with Intel MKL, follow the recommendations given
    in the

    subsections below.


    # Coding Techniques


    To obtain the best performance with Intel MKL, ensure the following alignment
    in your

    source code:


    +   * Align arrays at 16-byte boundaries.

    * Make sure leading dimension values (n*element_size) of two-dimensional arrays
    are

    disible by 16.

    * For two-dimensional arrays, avoid leading dimension values divisible by 2048.


    # LAPACK Packed Routines


    The routines with the names that contain the letters HP, OP, PP, SP, TP, UP in
    the matrix

    type and storage position (the second and third letters respectively) operate
    on the

    matrices in the packed format (see LAPACK "Rine Naming Conventions") sections
    in the

    Intel MKL Reference Manual). Their functionality is strictly equivalent to the
    functionality of the

    unpacked routines with the names containing the letters HE, OR, PO, SY, TR, UN
    in the

    s positions, but the performance is significantly lower.


    If the memory restriction is not tight, use an unpacked routine for better performance.

    In this case, you need to allocate N^2/2 more memory than the memory required
    by a

    respective routine, where N is the problem size (the number of equations).


    For, to speed up solving a symmetric eigenproblem with an expert driver by using

    unpacked routine:


    ```

    call dsyevx(jobz, range, uplo, n, a, lda, vl, vu, il, iu, abstol, m, w,

    z, work, iwork, ifail, info),

    ```


    where a is the dimension da-by-n, which is at least N^2 elements, instead of


    ```

    call dspevx(jobz, range, uplo, n, ap, vl, vu, il, iu, abstol, m, w, z,

    lz, work, iwork, ifail, info),

    ```


    where ap is the dimension N*(N+1)/2.'
  - '[PAGE 67]


    # Managing Performance and Memory


    # FFT Functions


    Additional conditions can improve performance of the FFT functions.


    Applications based on the IA-32 or Intel\® 64 architecture. The addresses of the
    first elements of arrays and the leading dimension values, in bytes (n*element\_size),
    of two-dimensional arrays should be divisible by cache line size, which equals:


    +   * 32 bytes for the Intel\® Pentium\® III processors

    * 64 bytes for the Intel\® Pentium\® 4 processors and processors using Intel\®
    64 architecture


    Applications based on the IA-64 architecture. Leading dimension values, in (n*element\_size),
    of two-dimensional arrays are not a power of two.


    # Hardware Configuration Tips


    Dual-Core Intel\® Xeon\® 5100 series systems. To get the best Intel MKL performance
    on Dual-Core Intel\® Xeon\® 5100 series systems, enable the Hardware DPL (streaming
    data) Prefetcher functionality of this processor. To configure this functionality,
    use the appropriate BIOS settings, as described in your documentation.


    The use of Hyper-Threading Technology. Hyper-Threading Technology (HT Technology)
    is especially effective when each thread is performing different types of operations
    and when there are under-utilized resources on the processor. However, Intel MKL
    fails of these criteria when the bordered threads of the library execute at high
    efficiencies using most of the available resources and perform identical operations
    on each thread. You may obtain higher performance by disabling HT Technology.
    Using the Intel\® MKL Parallelism for information on the number of threads, changing
    this number, and other relevant details.


    If you run with HT enabled, performance may be especially impacted if you run
    on fewer than physical cores. Moreover, if, for example, there are two threads
    to every physical core, the thread scheduler may assign two threads to some cores
    and ignore others altogether. If you are using the OpenMP\* library of the Intel
    Compiler, read the respective User Guides on how to set the thread affinity interface
    to avoid this situation. For Intel MKL, you are recommended to set KMP\_AFFINITY=granularity=fine,compact,1,0.'
  - "[PAGE 68]\n\n# 6 Intel® Math Kernel Library User's Guide\n\n# # Managing Multi-core\
    \ Performance\n\nYou can obtain best performance on systems with multi-core processors\
    \ by requiring that threads do not migrate from core to core. To do this, bind\
    \ threads to the CPU cores by setting an affinity mask to threads. You can do\
    \ this using any of the following options:\n\n+   * OpenMP facilities (recommended,\
    \ if available), for instance, the KMP_AFFINITY environment variable using the\
    \ Intel OpenMP library\n* A system function, as in the example below\n\nSuppose:\n\
    * The system has two sockets with two cores each, for a total of 4 (CPUs).\n*\
    \ The two-thread parallel application calls the Intel MKL FFT to run faster than\
    \ in 4 threads, but the performance in 2 threads is unstable\n\nThe code presented\
    \ in Example 6-3 solves the problem. The code example calls the system function\
    \ sched_affinity to bind the threads to the cores on different sockets. After\
    \ that the Intel MKL FFT function is called.\n\nCompile your application with\
    \ the Intel compiler using the following command:\nicc test_application.c -openmp\n\
    \nwhere test_application.c is the filename for the application.\nBuild the application.\
    \ Run it in 2 threads, for example, by using the environment variable to set the\
    \ number of threads:\n\n```\nenv OMP_NUM_THREADS=2 ./a.out\n```\n\n# Example 6-3\
    \ Setting an affinity Mask by Operating System Means Using the Intel® Compiler\n\
    \n```\n#include <stdio.h>\n\n#define __USE_GNU\n// Set affinity mask\n#include\
    \ <sched.h>\n#include <unistd.h>\n#include <omp.h>\n\nint main(void) {\n    int\
    \ NCPUS = sysconf(_SC_NPROCESSORS_CONF);\n\n    printf(\"Using thread affinity\
    \ on %i NCPUS\\n\", NCPUS);\n    #pragma omp parallel default(shared)\n{\n   \
    \     cpu_set_t new_mask;\n        cpu_set_t was_mask;\n```"
