    \n# 版本信息\n\n| 版本 | 日期 |\n| --- | --- |\n| -001 | 初始问题。记录了 Intel® Math Kernel Library\
    \ (Intel® MKL) 9.0 黄金版。 | 2006年9月 |\n| -002 | 记录了 Intel® MKL：9.1 Beta 版发布。增加了“GettingGetting”、“LINLIN\
    \ 和 LIN LINPACK 基准测试”以及“对第三方和已移除接口的支持”附录。扩展了现有章节。重构了文档。添加了示例列表。 | 2007年1月 |\n\
    | -003 | 记录了 Intel® MKL：9.1 黄金版发布。扩展了现有章节。进行了更多重构。讨论了 ILP64 接口。在第3章中增加了“配置 Eclipse\
    \ IDE CDT 以与 Intel MKL 链接”。集群内容被组织到独立的第9章“使用 Intel® Math Kernel Library 软件”中并进行了重构，添加了适当的链接。\
    \ | 2007年6月 |\n| -004 | 记录了 Intel® MKL：10.0 Beta 版发布。在第3章中描述了分层设计模型，并根据该模型调整了整个链接的内容。第4章中描述了启动时环境变量的自动化。第6章中描述了新的\
    \ Intel 线程控制。Intel 用户指南与 Intel MKL 用户指南合并，以反映各自产品的整合。 | 2007年9月 |\n| -005 | 记录了\
