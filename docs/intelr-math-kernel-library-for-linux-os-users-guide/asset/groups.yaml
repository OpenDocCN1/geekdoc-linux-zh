  - '[PAGE 1]


    # Version Information


    # Date


    | Version | Date |

    | --- | --- |

    | -001 | Original issue. Documents Intel® Math Kernel Library (Intel® MKL) 9.0
    gold release. | September 2006 |

    | -002 | Documents Intel® MKL: 9.1 beta release. "Getting Started", "LINPACK and
    MP LINPACK Benchmarks" and "Support for Third-Party and Removed Interfaces" appendix
    added. Existing chapters extended. Document restructured. List of examples added.
    | January 2007 |

    | -003 | Documents Intel® MKL: 9.1 gold release. Existing chapters extended. More
    restructuring. If ILP6 interface discussed. "Configuring the Eclipse" IDE CDT
    to Link with Intel MKL added to chapter 3. Cluster content is organized into separate
    9 "Working with Intel® Math Kernel Library Software" and restructured, appropriate
    links added. | June 2007 |

    | -004 | Documents Intel® MKL: 10.0 Beta release. Layered design model has been
    described in chapter 3 and the content of the entire link adjusted to the model.
    Automation of environment variables at startup has been described in chapter 4.
    New Intel threading controls have been described in chapter 6. The User''s Guide
    for Intel merged with the one for Intel MKL to reflect consolidation of the respective
    products. | September 2007 |

    | -005 | Documents Intel® MKL: 10.0 Gold release. Consolidation of Eclipse CDT
    4.0 to link with MKL has been described in chapter 3. Intel® Compatibility OpenMP®
    run-time library (libomp) has been described. | October 2007 |

    | -006 | Documents Intel® MKL: 10.1 beta release. Information on dummy libraries
    in the text "High-level directory structure" has been further detailed. On the
    Intel MKL configuration file removed. Section "Accessing Man Pages" has been added
    to chapter 3. "Support for boost uAS-Matrix Multiplication" has been added to
    chapter 7. "Getting Started for Programming in the Eclipse" has been added. |
    May 2008 |

    | -007 | Documents Intel® MKL: 10.1 gold release. Linking examples for IA-32 architecture
    and section "Linking with Computational Libraries" have been added to chapter
    5. Integration of DSS/PARDIISO into the layered structure has been documented.
    Two Fortran code examples have been added. | August 2008 |

    | -008 | Documents Intel® MKL: 10.2 beta release. Prebuilt Fortran 95 interface
    libraries and modules for BLAS and LAPACK have been described. Support for Intel®
    Advanced Vector Extensions (Intel AVX) has been documented. Continuation of support
    for dummy libraries and legacy linking model has also been documented. Chapter
    5 has been restructured. | January 2009 |

    | -009 | Documents Intel® MKL: 10.2 gold release. The document has been restructured.
    The "Getting Started" chapter has been enhanced, as well as the description of
    the layered model concept. Description of the SP2DP interface has been added to
    Chapter 3. The Web-based linking advisor has been described and referenced in
    chapters 2 and 5. | March 2009 |'
