    a\" 扩展）。要了解如何选择库，请参见“选择要链接的库”。\n\n# 配置外内存（OOC）DSS/PARDISO 求解\n\n在使用 OOC DSS/PARDISO\
    \ 求解配置文件时，请注意路径行的最大长度为 100。\n\n更多信息，请参见 Intel MKL 手册中的“稀疏求解器”章节。\n\n# 应用程序链接 Intel®\
    \ 数学内核库\n\n本章讨论了在 Linux* 操作系统上将应用程序与 Intel® 数学内核库（Intel® MKL）。本章提供了应链接库的信息、链接示例，并解释了自定义对象的构建。\n\
    \n要链接采用分层模型的 MKL，请从接口层选择一个库，从线程层选择一个库，计算层的库，并在必要时添加运行时库。表 5-1 列出了链接 MKL 的典型库集。\n\
    \n表 5-1 典型链接库\n\n| 接口层 | 线程层 | 计算层 | RTL |\n|---|---|---|---|\n| IA-32 架构，静态链接\
    \ | libmkl_intel.a | libmkl_intel_thread.a | libmkl_core.a | libomp5.so |\n| IA-32\
    \ 架构，动态链接 | libmkl_intel.so | libmkl_intel_thread.so | libmkl_core.so | libomp5.so\
    \ |\n| Intel® 64 和 IA-64 架构，静态链接 | libmkl_intel_lp64.a | libmkl_intel_thread_lp64.a\
    \ | libmkl_core.a | libomp5.so |\n| Intel® 64 和 IA-64 架构，动态链接 | libmkl_intel_lp64.so\
    \ | libmkl_intel_thread_lp64.so | libmkl_core.so | libomp5.so |\n\n有关上述列出库的异常和替代方案，请参见“选择要链接的库”。另见在链接行中列出库”。\n\
    \n"
