    \ 和 `NLSPATH` 环境变量，请将 `mklvars*.sh` 添加到您的 shell 配置中，这样每次登录时，脚本会自动执行并设置指向适当 Intel\
    \ MKL 目录的路径。\n\n对于本地用户账户，您应该通过在导出变量之前的 mani 部分添加相应的脚本来编辑以下文件：\n\n- bash: `~/.bash_profile`,\
