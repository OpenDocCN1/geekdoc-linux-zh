    ```


    A binary linked with ScalapACK runs in the same way as any other MPI application
    (refer to the documentation that comes with the MPI implementation). For instance,
    the script mpirun is used in the case of MPICH2 and OpenMPI, and a number of MPI
    processes is set by -np. In the case of MPICH 2.0 and all MPIIs, you should start
