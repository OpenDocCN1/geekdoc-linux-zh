  mdcn: '


    # 使用 Intel® Math Kernel Library 集群软件


    本章讨论了 Intel® Math Kernel Library (Intel® MKL) ScaLAPACK 和 Cluster FFTs 的用法，主要描述了与这些领域的链接方法，并包含了
    C 和 Fortran 特定的链接示例。还讨论了支持的 MPI 信息。


    请参见第 3 章查看有关 Intel MKL 目录结构的详情，包括 `doc` 目录中的可用文档。


    关于集群 MP LINPACK Benchmark 的信息，你需要在第 11 章中了解如何链接。


    Intel MKL ScaLAPACK 和 Cluster FFTs 支持在 *MKL Release Notes* 中指定的 MPI 实现。


    要链接调用 ScaLAPACK 的程序，你首先需要知道如何链接 MPI 应用程序。


    通常，这涉及使用 *mpi* 脚本和 *mpif77*（C 或 FORTRAN 77 脚本），这些脚本使用正确的 MPI 头文件等文件。例如，如果你正在使用安装在
    `/opt/mpich` 中的 MPICH，那么通常 `/opt/mpich/bin/mpich/bin/mpif77` 将是编译器脚本，而 `/opt/mpich/lib/libmpich.a`
    将是该安装使用的库。


    ## 与 ScaLAPACK 和 Cluster FFTs 链接


    要与 Intel MKL ScaLAPACK 和/或 Cluster FFTs 链接，基本上使用通用形式：


    ```

    <MPI> linker script> <files to link> \

    -L<MKL> path> [-W,--start-group] <MKL Cluster Library> \ \

    <BLAS> <MKL Core Libraries> [-W,--end-group>

    ```


    其中：


    <MPI> 是多个 MPI 实现之一（MPICH, Intel MPI 2.x/3.x, 等）。


    <MKL Cluster Library> 是适用于相应架构的 ScLAPACK 或 Cluster FFT 库之一，列在表 3-5、表 3-6 或表 3-7
    中。例如，对于 IA-32 架构，它是 -lmkl_scalapack_core 或 -lmkl_cdft_core 之一。


    <BLAS> 是适用于该架构的 BLAS 库之一，列在表 3-5、表 3-6 或表 3-7 中。例如，对于 IA-32 架构，它是 -lmkl_blas,
    -lmkl_blacs_intmpi 之一。


    <MKL Core Libraries> 是用于 ScLAPACK 的 <MKL LAPACK & MKL kernel libraries> 以及用于 Cluster
    FFTs 的 <MKL kernel libraries>。


    <MKL kernel libraries> 是针对处理器优化的内核、线程库以及用于线程支持的系统库，如“链接时列出库”一节中描述的。


    <MKL LAPACK & kernel libraries> 是 LAPACK & MKL 内核库。


    静态链接需要分组符号 -W1,--start-group 和 -W1,--end-group。


    例如，如果你正在使用 Intel MPI 3x 并且想在 ScaLAPACK 中使用 LP64 接口，仅使用一个 MPI 进程（核心）且不使用线程，请指定以下选项：


    ```

    -L$MKLPATH -I$MKLINCLUDE -W1,--start-group

    $MKLPATH/libmkl_scalapack_lp64.a $MKLPATH/libmkl_blacs_intmpi_lp64.a

    $MKLPATH/libmkl_intel_lp64.a $MKLPATH/libmkl_sequential.a

    $MKLPATH/libmkl_core.a -static_mpi -W1,--end-group -lpthread

    ```


    更多更多示例，请参见“与 ScaLAPACK 和 Cluster FFT 链接的示例”。


    注意 <MPI> linker script> 和 <BLAS> 库应与 MPI 版本对应。例如，对于 Intel MPI 3.x，使用 <Intel MPI
    3.x linker script> 和 libmkl_blacs_intmpi 库。


    关于 Intel® MKL 库的信息，请参见“与 Intel MKL 链接应用程序”。


    ## 设置线程数


    OpenMP* 软件响应环境变量 OMP_NUM_THREADS。Intel MKL 还有其他设置线程数的机制，例如 MKL_NUM_THREADS 或 MKL_DOMAIN_THREADS（使用附加线程控制）。确保相关变量在所有节点上具有相同的值。Intel
    MKL 10.0 及更高版本不再将默认线程数设置为 1，而是取决于使用的 OpenMP 库。基于 Intel®编译器 (libmkl_intel_thread.a)，该值取决于操作系统的
    CPU 数量。


    要避免过度指定线程数，这可能发生在每个节点的 MPI 节点和每个节点的线程数大于 1 时。


    设置如 OMP_NUM_THREADS 等环境变量的最佳方法是你的登录环境。记住 mpir 在所有节点上启动一个新的 shell，因此在一个节点上更改此值（在
    SMP 系统上有效）无法有效更改所有节点的值。在 .bashrc 中添加以下行：


    ```

    OMP_NUM_THREADS=1 export OMP_NUM_THREADS

    ```


    可以使用 MPICH 在每个节点运行多个 CPU，但 MPICH 必须构建支持。请注意某些 MPICH 应用程序在线程环境中无法完美运行（参见 Release
    Notes 中的已知限制）。如果你遇到 MPICH 问题且线程数大于 1，首先尝试将线程数设置为 1，看看问题是否仍然。


    ## 使用共享库


    所有需要的共享库在运行时对所有节点可见。实现这一点的方法是通过 .bashrc 文件中的 LD_LIBRARY_PATH 环境变量指向这些库。如果 Intel
    MKL 只安装在一个节点上，在构建 MKL 应用程序时应静态链接。


    可以使用 Intel MKL 编译器或 GNU 编译器编译使用 Intel MKL 的程序。然而，请确保 MPI 实现和编译器正确匹配。


    ## ScaLAPACK 测试


    构建 NetLib ScaLAPACK 测试：


    - 对于 IA-32 架构，将 libmkl_scalapack_core.a 添加到链接命令中。

    - 对于 IA-64 和 64 架构，添加 libmkl_scalapack_lp64.a 或 libmkl_scalapack_ilp64.a，取决于架构。


    '
