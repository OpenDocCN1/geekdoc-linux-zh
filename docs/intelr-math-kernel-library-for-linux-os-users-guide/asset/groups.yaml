    # 6 Intel® 数学库用户指南


    全局变量 `MKL_ALL`、`MKL_BLAS`、`MKL_FFT` 和 `MKL_VML` 以及 MKL 线程控制函数的接口，可以在 `mkl.h` 头文件中找到。


    表 6-3 阐了 `MKL_DOMAIN_NUM_THREADS` 值的解释方式。


    ![](img/78e923baedeba397a89d376927830122_64_0.png)


    注意。特定域的设置优于其他设置。例如，`MKL_DOMAIN_NUM_THREADS` 的值 "MKL_BLAS=4" 表示对 BLAS 尝试 4 个线程，无论之后如何设置
    `MKL_NUM_THREADS` 都是如此；函数调用 "mkl_domain_set_num_threads (4, MKL_BLAS);" 也表示相同含义，无论之后如何调用
    `mkl_set_num_threads()`。然而，请注意输入为 "MKL_ALL" 的函数调用，例如 "mkl_domain_set_num_threads
    (4, MKL_ALL);" 等同于 "mkl_set_num_threads(4)"，因此会被后续的 `mkl_set_num_threads` 调用覆盖。同样，设置具有
    "MKL_ALL=4" 的 `MKL_DOMAIN_NUM_THREADS` 环境将会被 `MKL_DOMAIN_NUM_THREADS=2` 覆盖。


    虽然 `MKL_DOMAIN_NUM_THREADS` 环境变量允许你一次性设置多个变量，例如 "MKL_BLAS=4, MKL_FFT=2"，但相应的函数不接受这种语法。因此，要通过函数调用实现相同效果，可能需要进行多次调用，在本例中如下：


    ```

    mkl_domain_set_num_threads ( 4, MKL_BLAS );

    ```


    ```

    mkl_domain_set_num_threads ( 2, MKL_FFT );

    ```


    # 设置线程控制环境变量


    要设置用于线程控制的环境变量，请在运行程序的命令行提示符中，根据所使用的 shell 输入 `export` 或 `set` 命令。例如，用于 bash 和其他
    shell 的 `export` 命令的格式如下：


    ```

    export <VARIABLE_NAME>=<value>

    ```


    例如：


    ```

    export MKL_NUM_THREADS=4

    export MKL_DOMAIN_NUM_THREADS="MKL_ALL=1, MKL_BLAS=4"

    export MKL_DYNAMIC=FALSE

    ```


    对于其他 shell（如 csh 或 tcsh），请输入 `set` 命令。


    ```

    set <VARIABLE_NAME>=<value>

    ```


    例如：


    ```

    set MKL_NUM_THREADS=4

    set MKL_DOMAIN_NUM_THREADS="MKL_ALL=1, MKL_BLAS=4"

    set MKL_DYNAMIC=FALSE

    ```


    # 分发 Intel® 高级矢量扩展 (Intel AVX)


    Intel MKL 10.2 引入了针对 Intel® AVX 的优化内核。若要在支持 Intel AVX 的硬件（或模拟器）上分发 Intel AVX 指令，请使用
    Intel MKL 服务函数 `mkl_enable_instructions()`。该函数启用分发新的 AVX 指令。在调用任何其他 Intel MKL
    函数之前调用此函数。


    关于函数描述，参阅 Intel MKL 参考手册。


    ![](img/78e923baedeba397a89d376927830122_65_0.png)


    > 注意。此函数的成功执行并不保证指令一定会被分发。特定指令的分发取决于硬件是否支持 Intel AVX，以及该函数是否已经优化到分发该指令。然而，如果不调用此函数，新指令将不会被分发。


    由于 Intel AVX 指令集的不断演进，`mkl_enable_instructions()` 的行为可能会随未来的 Intel MKL 版本而变化。请参阅发布说明（Release
    Notes）获取特定版本的行为细节。


    # 提高性能的提示与技巧


    为了从 Intel MKL 获得最佳性能，请遵循下方小节中的建议。


    # 编码技巧


    为了从 Intel MKL 获得最佳性能，请确保你的源代码符合以下对齐要求：


    - 将数组对齐到 16 字节边界。

    - 确保二维数组的主维尺寸值（`n*element_size`）能被 16 整除。

    - 对于二维数组，避免主维尺寸值能被 2048 整除。


    # LAPACK 压缩例程


    在矩阵类型和存储位置（分别为第二个和第三字母）中包含 HP、OP、PP、SP、TP、UP 字母的例程对压缩格式的矩阵进行操作（详见参阅 Intel MKL
    参考手册中的 LAPACK "Routine Naming Conventions" 部分）。它们的功能与 s 位置中包含 HE、OR、PO、SY、TR、UN
    字母的解密例程完全相等，但性能低得多。


    如果内存限制并不严格，请使用解密例程以获得更好的性能。在这种情况下，你需要比相应程序多分配 $N^2/2$ 的内存，其中 $N$ 是问题规模（方程数量）。


    例如，为了使用解密例程通过专家驱动程序加速求解对称特征值问题：


    ```

    call dsyevx(jobz, range, uplo, n, a, lda, vl, vu, il, iu, abstol, m, w, z, work,
    iwork, ifail, info),

    ```


