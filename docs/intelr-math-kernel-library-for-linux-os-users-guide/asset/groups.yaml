    ## 第三方接口支持


    本附录简述了 Intel® Math Kernel Library (Intel® MKL) 支持的某些接口。


    ## GMP* 函数


    Intel MKL 对 GMP* 算术函数的实现包含了对整数的任意精度操作。此类函数的接口与多精度 (GMP) 算术库完全匹配。有关这些函数的规格规范，请参阅
    http://www.intel.com/software/mkl/help/。如果您目前使用 GMP* 库，则需要修改程序中的语句为 `mkl_gmp.h`。


    ## FFTW 接口


    Intel MKL 提供了两组封装器，即 FFTW 接口 (www.fftw.org)，用于调用 Intel MKL 变换函数。这些封装器对应 FFTW 2.x
    和 3.x 版本，以及 Intel MKL 7.0 及更高版本。这些封装器使得目前使用 FFTW 的开发者能够在不更改程序的情况下通过 Intel MKL
    获取性能。


