    # 将您的应用程序与 Intel® Math Kernel Library 链接


    - 如果您使用 Intel 编译器，请链接该编译器一起提供的 libomp/libguide 版本，即使用 -openmp 选项。


    - 如果您没有使用 Intel 编译器，请链接随 Intel MKL 提供的 libomp/libguide 版本。


    如果您链接的是动态版本的 libomp/libguide（推荐），即使用 `libomp5.so` 或 `libguide.so`，请确保 `LD_LIBRARY_PATH`
    已正确定义。详情请参阅设置环境变量。


    # 与系统库链接


    在 Linux OS* 上，libomp/libguide 均依赖于原生 pthread 库进行多线程处理。当需要 libomp/libguide 时，请在链接行末尾添加
    -lpthread（库的列出顺序非常重要）。


    # 链接示例


    本节提供了基于 IA-32、Intel® 64 和 IA-64 架构系统的 Intel® 编译器的特定链接示例。在这些示例中，`<MKL path>` 和
    `<MKL include>` 占位符被替换为用户定义的环境变量 `$MKLPATH` 和 `$MKLINCLUDE`，请参见第 9 章中 ScLAPACK
    和 Cluster FFT 的链接示例。


    以下示例使用了 `.f` 源文件。C/C++ 用户应改为指定 `.cpp` (C++) 或 `.c` 文件，并将 Fortran 链接器更改为 `icc`。


    如需协助查找正确的行，可以使用以下提供的在线链接建议工具：http://software.intel.com/en-us/articles/intel-mkl-link-line-advisor。


