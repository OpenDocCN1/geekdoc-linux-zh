    \ MKL 是为多线程设计的，它是线程安全的，这意味着所有 Intel MKL 在多个线程同时执行时都能正常工作。特别是，任何块线程化的 Intel MKL\
    \ 代码都允许多个线程访问相同的共享数据，但在任何时刻只允许一个线程访问共享数据块。有不同的使用方法。你可以使用环境变量 `OM_NUM_THREADS`\
    \ 来指定要使用的线程数。Intel MKL 10.0 之前的发布版本可以使用 OpenMP 环境变量（详情见环境变量）或等效的 OpenMP 运行时函数调用（详见“在运行时更改线程数”）。从\
