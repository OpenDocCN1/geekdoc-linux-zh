    \  - Level 2 BLAS: *gemv, *rmv, dsyr/ssyr, dsyr2/ssyr2, dsymv/ssym\n\nNote that\
    \ these functions are threaded for:\n\n+   - Intel® Core™2 Duo and Intel® Core™\
    \ i7 processors\n- All Level 3 BLAS and all Sparse BLAS routines except Level\
    \ 2 triangular solvers.\n- VML.\n- FFT.\n\nBecause it is designed for multi-threading,\
    \ Intel MKL is thread-safe, which means that all Intel MKL work correctly during\
    \ simultaneous execution by multiple threads. In particular, any chunk of threaded\
    \ Intel MKL code provides access for multiple threads to the same shared data,\
    \ while permitting only one thread at any time to access a shared piece of data.\
    \ There are different means to use. You could use the environmental variable OM_NUM_THREADS\
    \ to specify the number of threads to use. Intel MKL releases earlier than 10.0,\
    \ so could use the environment variable OpenMP_Environment Variable (for details)\
