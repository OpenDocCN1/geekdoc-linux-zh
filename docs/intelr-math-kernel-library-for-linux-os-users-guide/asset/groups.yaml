    # 11 Intel® Math Kernel Library 用户指南


    例如，通过性能值来估算问题规模从 700,000 到 701,000 之间的差异。影响性能下降的另一个因素是网格维度（P 和 Q）。对于大型问题，当 P 和
    Q 的取值大致相等时，性能在前几个步骤的下降幅度往往较小。你可以利用大量的参数（如广播类型）并更改它们，使得最终性能非常紧密地取决于前几个步骤。


    使用这些工具将极大地帮助你增加测试的数据量。


    ## Intel® Math Kernel Library 语言接口支持


    表 A-1 显示了 Intel® Math Kernel Library (Intel® MKL) 为每个领域提供的语言接口，表 A-2 列出了相应的头文件。可以使用混合语言编程从其他语言中调用
    Intel MKL 例程。例如，请参阅《使用 Intel® MKL 进行混合语言编程》，了解如何从 C/C++ 调用 Fortran 例程。


    ## 表 A-1 语言接口支持


