    # # Layered Model Concept


    Starting with release 10.0, Intel MKL employs a layered model.

    There are four essential parts of the library:


    +   1. Interface layer

    2. Threading layer

    3. Computational layer

    4. Compiler Support Run-time libraries.


    The first part adapts Intel MKL to interface-related issues, for example, whether
    to use 32- or 64-bit integer types, or how different compilers return function
    values. The second part adapts the library to the OpenMP implementations using
    different compilers or to the non-threaded usage. The Computational layer is the
    bulk of the library, which is separated to space. Rather than generate one library
    for each of the cases within these parts and thus a geometric explosion of possibilities,
    Intel MKL has broken down each into independent libraries corresponding to those
    cases. You can combine these to meet your needs. Once the interface library is
    selected, the threading library picks up that interface, and the computational
    libraries use interfaces chosen in the first two layers.


    **Interface Layer.** This layer provides matching between compiled code of your
    application and the threading and/or computational parts of the library. This
    layer provides:


