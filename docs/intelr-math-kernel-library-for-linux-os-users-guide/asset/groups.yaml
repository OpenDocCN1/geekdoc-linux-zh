    | lin_xeon64.txt | Result of the run_xeon64 script execution. |

    | help.lpk | Simple help file. |

    | xhelp.lpk | Extended help file. |


    # Running the Software


    To obtain results for the pre-determined sample size on a given system, type one
    of the following, as appropriate:


    +   . /runme_itanium

    . /runme_xeon32

    . /runme_xeon64'
  - '[PAGE 104]


    # LINPACK and MP LINPACK Benchmarks 11


    To run the software for other problem sizes, please refer to the extended help
    included with the program. Extended help can be viewed by running the program
    executable with the -e

    ./linpack_itanium -e

    ./linpack_xeon32 -e

    ./linpack_xeon64 -e


    The pre-defined data input files lininput_itanium, lininput_xeon32, and lininput_xeon64
    are provided as examples. Different systems have different number of processors
    or amount of memory and thus require new input files. The extended help can be
    used for insight into proper ways to change the sample input files.


    Each input file requires at least the following amount of memory:


    +   - lininput_itanium 16 GB

    - lininput_xeon32 2 GB

    - lininput_xeon64 16 GB


    If the system has less memory than the above sample input requires, you may need
    to edit or create your own input files, as explained in the extended help.


    Each sample script, in particular, uses the OMP_NUM_THREADS environment variable
    to set the number of processors it is targeting. To optimize performance on a
    different number of physical processors, change that line appropriately. If you
    run the Intel Optimized LINPACK Benchmark without setting the number of threads,
    it will default to the number of cores according to the OS. You can find the settings
    for this environment variable in the runme_* sample scripts. The settings do not
    already match the situation for your machine, edit the script.


    # Known Limitations


    The following limitations are known for the Intel Optimized LINPACK Benchmark
    for Linux*:


    +   - Intel Optimized LINPACK Benchmark is designed to effectively use multiple
    processors. So, in multi-processor systems, best performance will be obtained
    with Hyper-Threading technology turned off, which ensures that the operating system
    assigns threads to physical processors only.


    +   - If an incomplete data input file is given, the binaries may either hang
    or fault. See the sample data input files and/or the extended help for insight
    into creating a correct input file.


    11-3'
