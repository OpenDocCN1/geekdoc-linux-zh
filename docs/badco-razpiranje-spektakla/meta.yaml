    razpoko v spektaklu, ga razpreti, nasloviti samo dejanje gledanja in gledalce
    nagovoriti k postavljanju političnih in umetniških vprašanj,"* pravi **Ivana Ivković**,
    ena od članic kolektiva. Gledališko dejanje v nasprotju s homogeno medijsko realnostjo
    razumejo in ohranjajo kot nestabilno komunikacijsko izmenjavo in imaginativni
    prostor, ki gledalcu nalaga svobodo in njej odgovarjajočo odgovornost pogleda
    – kot eksplicitno naslovijo tudi s prostorsko intervencijo in video instalacijo
    *Odgovornost za videno (Responsibility for the Things Seen)* na Beneškem bienalu
    leta 2011.


    # Kolektivna naselitev in preverjanje pogledov


    Jedro kolektiva tvorijo **Ivana Ivković, Ana Kreitmeyer, Tomislav Medak, Goran
    Sergej Pristaš, Nikolina Pristaš** in **Zrinka Užbinec** – tri plesalke in koreografinje,
    dva dramaturga in filozof, čeprav je bistvena značilnost njihovega dela, da v
    kolektivni proces vstopajo enakovredno in brez vnaprej določenih vlog posameznega
    poklicnega profila oziroma v stalni pretočnosti med ustvarjalnimi funkcijami.
    Dela oblikujejo na raznolikih prizoriščih – na odru, v galerijskih prostorih ali
    opuščenih industrijskih objektih – in v različnih formatih – kot gledališke produkcije,
    skupnostne dogodke v deljenju prostora, instalacije, publikacije (knjižice, katalogi
    raziskovalnih in ustvarjalnih procesov, vizualni materiali).'
