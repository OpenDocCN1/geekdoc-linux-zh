    Na komentar, da ljudje ne razumejo, kaj plešejo, odgovarja z zanimivo primerjavo
    opazovanja nogometa: kar organizira polje, je žoga, ko se pretvarjamo, da žoge
    ni, ostane gibanje in koreografija, v kateri ne moremo detektirati pravil. Telesa
    v prostoru in relacije med njimi organizira zunanjim opazovalcem tuja, nejasna
    logika. *"In to je meni kot koreografinji, kadar ne plešem v predstavi, tudi najbolj
    zanimivo; ko plesalci niso več zgolj interpreti naših dogovorjenih pravil ali
    navodil, ampak jim ''uidejo'' in začnejo plesati ter mi postanejo tuji,"* dodaja.
    V tej materialnosti pa se zgodi prostor, ki omogoča vznik neskončnih pogajanj
    in pogledov.


    ## Delo in njegovi ritmi


    Njihova predstava *Spore*, izvedena v okviru CoFestivala, v središče postavi neskončno
    opravilo vzdrževanja (vzdržujemo telo, hišo, otroke, odnose, čistočo, tehnologijo,
    organizacijo ipd.), ki je neviden predpogoj vsake dejavnosti, ustvarjalnosti in
    proizvodnje ter obenem prepreka nemotnemu delu in ustvarjanju. Izhodiščni impulz
    je ustvarjalcem predstavljala pesem v prozi *Kaj je ne-pisanje?*, v kateri ameriška
    pesnica **Anne Boyer** duhovito in ironično izpiše osebno izkušnjo vsakdanjega
    ritma življenja med številnimi delovnimi, "pol-delovnimi" in zasebnimi aktivnostmi
    ter vlogami (umetnice, matere, prijateljice …); izkušnjo, ki je osebna v enaki
    meri kot družbena in politična. Ponavljanje in inercijo nikoli končanega vzdrževanja,
    ki zaustavlja možnost spremembe, premika, razvoja, ustvarjanja, BADco. postavi
    v koreografijo telesne rotacije – obrata. Na izčiščenem in rahlo osvetljenem prizorišču,
    ki daje vtis prijetnega ambienta domačnosti in bližine, konstruirajo situacijo
    zaustavljenih gibov, prekinjenih dejavnosti in ponavljajoče se utirjenosti v toku
    nenehnega dela, razpirajo vprašanja o ritmih vsakdanjega življenja, možnostih
    premen in svobode.


    V Kinu Šiška je bila razstavljena tudi tridelna video instalacija *Časovne bombe*
    kot del umetniške serije *Institutions Need to be Constructed*, dokument in refleksija
    projekta, v katerem so člani kolektiva z drugimi umetniki in občinstvom za 24
    ur naselili zapuščena industrijska prizorišča, ki so (ali naj bi) postala institucije
    sodobnih umetniških praks: Reško tovarno Benčić oziroma Muzej moderne in sodobne
    umetnosti, zagrebški Center za neodvisno kulturo in mlade Pogon – Jedinstvo ter
    nerealizirani Dom mladih v Splitu. Z rekonstrukcijo nekaterih predstav, projekcijami
    filmov, snemanjem dogajanja, diskusijami in spanjem v ritmu normiranega (delo
    – prosti čas – spanje) dogajanje postane rekonstrukcijo prvega posnetega filma
    *Odhod iz tovarne* (1895) bratov **Lumière**, ki postane družbena koreografija
    za propad industrije in spremembo delovnega ter družbenega življenja. Sprememba
    namembnosti naseljenih prizorišč z novimi, kognitivnimi in ustvarjalnimi oblikami
    dela, ki porušijo tudi mejo med časom dela in počitka ter temeljijo na kapitalistični
    potrošnji ljudi z zahtevo po konstantni produktivnosti sproža razpravo o institucijah
    kot dejavnikih formalizacije arhitekture, dela, časovnih dinamik, urnikov, organizacije
    in njihovi napetosti med trajnostjo strukture ter ohranjanjem vitalnosti v stiku
    s potrebami in iniciativami javne sfere. Tretji del naselitve in video instalacije
    je nekakšen hommage lenobi kot možnem uporu – delati manj ali/in delati drugače;
    ne nazadnje, je vprašanja kdo dela, kdaj in kako vpleten v vse pore tega projekta,
    ki je na prizorišča obiskovalce pripeljal kot delavce in gledalce hkrati.


    ## Utopije in delovanje


    V predstavi-instalaciji *Gradbena jama* BADco. naslavlja utopične ideje načrtovanja
    prihodnosti z dvema izhodiščema, ki zanimivo prepleteta arhitekturni in družbeni
    inženiring. Plesno instalacijo izvedejo v hiši hrvaškega arhitekta Vjekoslava
    Rihterja in igralke Nade Kareš Rihter (danes zbirka, ki jo upravlja Muzej sodobne
    umetnosti v Zagrebu). Rihterjevi utopični arhitekturni načrti – Zigurat kot ogromna
    stavba oziroma mesto v malem izhaja iz ideje po minimaliziranju časovnih izgub
    ob premikanju po mestu – se prekrijejo s protislovji utopističnih projektov v
    stalinistični Sovjetski zvezi, kot jih v distopijsko-satiričnem romanu *Iskop*
    izpiše **Andrej Platonov**; tu gradnja velikanskega stolpa kot proletarskega doma
    za vse pripadnike delavskega razreda in obljube svetle prihodnosti nove družbe
    propade pred postavitvijo temeljev in postane grob mladega dekleta. BADco. v tem
    tematskem kontekstu preplete koreografijo, besedila in postavitev prostora, dogajanje
    umesti v različne sobe hiše, po kateri se lahko obiskovalci prosto sprehajajo
    (po podiju, ki deluje kot del gradbenega odra) ter koreografijo zasnuje na konstrukcijskih
    principih arhitekturnega oblikovanja in s prevajanjem logike ter principov heroiziranih
    podob močnih, mladih in atletskih teles socrealistične umetnosti ter njene podpore
    političnim idealom. Ta logika in principi postanejo material za nov koreografski
    jezik in morda tudi za premislek o mehanizmih današnjih zamišljanj prihodnih teles
    ter arhitektur zanje.


    Plesno-gledališka predstava *Poprave ritma* je nastala v koprodukciji s Hrvaškim
    narodnim gledališčem v Zagrebu na podlagi kratke zgodbe Pavla Pavličiča *Dobri
    duh Zagreba*, v kateri glavni junak obsesivno beleži zločine v mestu in gradi
    statističen model predikcije negativnih pojavov, ki se mu kažejo kot bistvo urbanega
    utripa in svojevrsten red, pravilnost, norma mesta. BADco. razbije klasični okvir
    uprizoritvene situacije, dogajanje kot v časovnem stroju zlje v trenutek, ki obsega
    različne (vse) čase hkrati in gledalce že z netipično organizacijo prostora postavi
    v izpostavljeno situacijo opazovanja te analitično forenzične obsesije preiskovanja
    zločinov in mestnih ritmov; najprej z balkona gledališča ob poslušanju besedila
    (Goran Ferčec) v mraku zremo v globino parterja in na prazen oder, kjer se za
    hip zasveti le gibljiva projekcija Zemlje, nato v tonske studiu, prehodnem prostoru
    s pogledom na trg in mestni vrvež, pričamo fragmentiranim koreografskim predlogam
    repetitivni strukturi se razkriva prepleteno omrežje dogajanj, v katerem protagonistovo
    opazovanje in analiza postane tudi konstrukcija in delovanje. Koreografska navodila
    so razvidna, izpeljava polna prizadevanj avtonomnih teles, nelagodje odločitev
    v popravkih ritma in ustvarjanju prihodnjih ritmov pa neizogibno.


