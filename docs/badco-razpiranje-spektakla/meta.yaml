    # 订单


    ## BADco.：奇观之裂解


    ## 在 CoFestival 上呈现的艺术家集体


    **尼卡·阿尔哈尔** | 2018年12月25日 11:49

    MMC RTV SLO


    ![](img/f970f2a256510c9ccf6ec684f34373da_0_0.png)


    **萨格勒布集体 BADco. 通过其表演作品，系统性地质疑既定的表演、呈现与观看形式。**


    艺术家集体 BADco. 活跃于舞台艺术领域，被认为是该地区最具辨识度的团体之一。他们的作品虽已在卢布尔雅那多次呈现，但此次 CoFestival 通过节前访问萨格勒布以及在卢布尔雅那的驻演，使观众得以观摩他们最新的制作，并在话语论坛上促进关于其工作原则、理解与语境以及驱动他们的兴趣的对话。


    自2000年成立以来，该集体通过一系列戏剧制作、表演事件、装置和出版项目，将注意力聚焦于表演、呈现和观看的机制。*"我们的戏剧制作并不邀请观众迷失于叙事之中，而是希望建立并凸显奇观中的裂隙，将其撕开，直面观看行为本身，并促使观众提出政治与艺术问题，"*
    **伊万娜·伊夫科维奇**，集体成员之一说道。与同质化的媒体现实相反，他们将戏剧行为理解为一种不稳定的交流交换和想象空间，并如此保持——这种想象空间赋予观众自由，以及与此自由相应的观看责任——正如他们在2011年威尼斯双年展上以空间介入和视频装置*《对所见的责任》（Responsibility
    for the Things Seen）*所明确提出的。


    ## 集体栖居与视角的检验


    集体的核心由**伊万娜·伊夫科维奇、安娜·克雷特迈尔、托米斯拉夫·梅达克、戈兰·塞尔盖伊·普里什塔什、尼科利娜·普里什塔什**和**兹林卡·乌兹比内茨**组成——三位舞者和编舞家、两位戏剧构作和一位哲学家，尽管他们工作的本质特征在于，他们以平等身份进入集体过程，没有预先设定的职业角色，或者说在创作功能之间存在持续的流动性。他们在多样的场地创作作品——在舞台上、画廊空间或废弃的工业建筑中——并以不同的形式——作为戏剧制作、共享空间的社群活动、装置、出版物（小册子、研究和创作过程的目录、视觉材料）。这使得表征的边界得以凸显，并打断总是相同图像及其配置的不断重复之流，在那里没有空间让差异在构想共同未来时涌现。


    ## 事件的痕迹进入身体


    各个项目的工作方法取决于情境并同时反思情境。我们可以将共同点定义为他们在线性时间流中建立非线性戏剧构作的意图。为了强调我们如何建构视角这一问题，需要仔细考虑观众的位置以及观众与事件之间关系的形成。他们可以将此放得非常近并使其在观众眼前消散，建立对实际场所的边缘性、非寻常视角，或将观众分布于空间中，使多个层面甚至多部作品的编舞在单个视角中同时呈现，尽管他们不要求观众主动参与。他们邀请观众与表演者一同探索表演的物质性及其全部复杂性，从而强化观看作为一种创造性行为，并肯定共同创作即作品生产的价值。BADco.
    运用文本材料、编舞、广泛的参考场域、节奏性和电影式蒙太奇以及对空间的深思熟虑的关系，创造精确结构化的作品，可在不同层面被接受——其中一些艺术符号、在场和思想*"可读，另一些具有暗示性，第三种则仅是认知和感官动态的手段，直接进入我们的身体"*，正如他们在
    CoFestival 上所写的；艺术作品作为情感丛结，弥漫于观众之中，直到图像获得某种新意义和新想象力的轮廓，正如皮娅·布热扎夫舍克所言；图像与意义共同在编舞构造和观众接受之间涌现，并直面视角行为和观看行为本身。


    正如伊夫科维奇所说，演出结束后观众常常留在舞台上，观看那里留存的东西，环顾空座位，触摸物品，开始他们自己的个人挖掘，在视角中转换戏剧事件，检验事件的痕迹和对刚见之事的记忆。留存在舞台上的东西如同某种事后手册或指南，是表演本身的延伸，某种正在形成而非刚刚发生的事情的感觉。


    ## nostalgia


    ## 语境，舞动改变


    尽管创作者有舞蹈的专业背景，他们自视为戏剧集体，但类型归属的问题在他们这里比初看更有意思，因为这已经裂解了他们研究的本质特征。正如戈兰·塞尔盖伊·普里什塔什所解释的，他一直被抽象逻辑所吸引，这种逻辑更多与舞蹈和编舞思维相关，而非戏剧。舞蹈抽象性实际上要求显著的具象性；它不能容忍伪装，而这种伪装是角色表演性诠释所固有的，相反，它要求你将某物带入存在，然后我们才能共同思考发生了什么以及该物产生了什么。正是编舞的物质基础为这个集体打开了无限可能。
    *"舞动比戏剧更容易改变（事物），"* 普里什塔什确信。在描述他们的工作时，他总结道：我们通过编舞过程来思考，以及它如何与观看行为联系起来。前者我们讨论的是舞蹈，它关乎显现/呈现的东西，当我们谈论观看时，我们讨论的是戏剧装置，作为展示和观看语境的戏剧。


    在自身实践中，他们汲取并进入广泛的理论和实践参考库。普里什塔什在个人影响中首先提及的是**德拉甘·日瓦迪诺夫**的演出*《诺东——祈祷机器》*，其中他站在观众中间，在严肃的戏剧情景中鼓励他们发笑和做出大声反应，通过这些对观众的干扰切入观看经验本身；*"感知到身后某处的这种噪音，第一次将我带到了观看经验本身，"*
    普里什塔什在回顾性视角中认识到，这在他们后来的oppervlakt（原词为斯洛文尼亚语，保留不译）后期实践中得到体现，当时他关注表征逻辑以及观看行为中可见图像与不可见之间建立关系的可能性。法国启蒙哲学家**德尼·狄德罗**已将图像理念引入戏剧，在寻找不同的表演模态时从对同时代绘画的批评出发，并通过*活人画（tableau
    vivant）*引入停顿，中止舞台生活的可能性，使观众得以观察一幅图像。普里什塔什援引的另一个参考是**本雅明**关于瑜伽士身体的思考，他们将机器的实践（瑜伽练习）与呼吸和伸展的生命力结合起来，后者进入与图像结构的关系；尤其是电影的出现以及电影和电影理论对剧院黑匣子中观看转变的影响；电影如何运作，我们在剧院或影院中如何观看，如何将对象从一个坐标系统（电影）转换到另一个（剧院），如何找到表征在剧院中坍塌的视角。


    ## 环境中舞者的觉察与完整性


    他们集体实践的重要部分是讨论。演出中的编舞工作始终是不同立场的所有参与者协商的结果，也是工作过程中所发生一切的总和沉淀。在此过程中，他们从调研和思考所设定的问题即问题主题出发，在数月的过程中，每个人作为个体找到自己进入材料的入口、与之建立联系也很重要，因为只有如此，表演的身体才能复杂而完整地运作。正如尼科利娜·普里什塔什所说，对他们的戏剧构作和编舞工作而言，"他者性逻辑"也很重要，这很好地体现在*Whatever
    Dance Toolbox*中，这是一款用于分析、发展和教育舞蹈动作的软件工具，它记录舞者的动作并将其投射为变形后的——有延迟、模糊或以其他方式处理的。 *"作为舞者，我们非常内化地专注，在使用这个工具时，当我们与屏幕上技术的自己形象共舞，并试图将其纳入动作时，重要的是分配注意力——向内和向外，对自己、对我们的形象以及对他人。必须不断转移注意力，在动作构成中，就空间、身体和周围一切进行协商，以稳定舞者工作时的完整性。"*
    舞者必须意识到空间中发生的一切——环境、物品、声音和人。

