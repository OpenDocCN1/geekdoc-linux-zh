    postane nemogoča, da se izpostavi meje reprezentacije in prekine tok ponavljanja
    vedno istih podob in njihovih konfiguracij, kjer ni prostora za vznik razlik v
    zamišljanju skupne prihodnosti.


    # Sledi dogajanja vstopajo v telesa


    Metodologija dela pri posameznem projektu je odvisna od situacije in jo obenem
    reflektira. Skupno točko lahko opredelimo v nameni, da v linearnem poteku časa
    vzpostavljajo nelinearno dramaturgijo. Za umeščanje poudarka na vprašanje, kako
    konstruiramo pogled, je potrebno skrbno premišljevanje pozicije gledalca in formiranje
    razmerja med gledalci in dogajanjem. Tega lahko postavijo zelo blizu in ga razpršijo
    pred gledalčevimi očmi, vzpostavljajo robne, neobičajne perspektive na dejansko
    prizorišče ali gledalce razpostavijo po prostoru, da se v posameznem pogledu združi
    več plasti ali celo koreografija več predstav sočasno, čeprav od gledalcev ne
    zahtevajo aktivne participacije. Občinstvo povabijo, da skupaj z izvajalci preiskuje
    materialnost uprizoritve v vsej njeni kompleksnosti, s čimer gledanje krepilo
    kot kreativno dejanje in afirmirajo vrednost skupnega ustvarjanja oz. produkcije
    dela. BADco. z rabo tekstualnih gradiv, koreografije, širokega referenčnega polja,
    z ritmično in kinematografsko montažo ter premišljenim odnosom do prostora ustvarjajo
    natančno strukturirana dela, dostopna na različnih nivojih – nekateri od umetniških
    znakov, navzočnosti in misli v njih so *"berljivi, drugi sugestivni, tretji pa
    zgolj sredstvo kognitivne in čutne dinamike, ki vstopa neposredno v naša telesa"*,
    kot so zapisali pri CoFestivalu; umetniška dela kot afektivni svežnji, ki prežamejo
    gledalce, dokler podobe ne dobijo obrisa nekega novega smisla in nove imaginacije,
    kot je povedala Pia Brezavšček; podobe, ki skupaj s pomeni vznikajo med koreografskimi
    konstrukcijami in gledalsko recepcijo ter naslovijo prav dejanje pogleda in gledanja.


    Kot pravi Ivković, gledalci po predstavah pogosto ostajajo na odru, gledajo, kar
    je tam ostalo in se ozirajo na prazne sedeže, se dotikajo stvari, začenajo svoje
    osebno izkopavanje in v pogledu preobračajo gledališki dogodek, preverjajo sledi
    dogodkov in spomin na ravnokar videno. Kar ostane na odru je kot nekakšen post
    festum priročnik ali vodič, je ekstenzija same uprizoritve, občutek nečesa v nastajanju
    in ne nečesa, kar se je ravnokar zgodilo.


    # Gledališče je kontekst, ples premika


    Kljub plesnim profesionalnim izhodiščem ustvarjalcev, se dojemajo kot gledališki
    kolektiv, a je vprašanje žanrske uvrstitve v njihovem primeru zanimivejše, kot
    se zdi na prvi pogled, saj že razpira bistvene značilnosti njihovega raziskovanja.
    Kot je pojasnil Goran Sergej Pristaš, ga je od nekdaj pritegovala abstraktna logika,
    ki je bolj povezana splesom in koreografskim razmišljanjem kot z dramskim gledališčem.
    Plesna abstraktnost pravzaprav zahteva izrazito konkretnost; ne prenese pretvarjanja,
    ki je inherentno igralski interpretaciji nekega lika, temveč zahteva, da nekaj
    spraviš v obstoj, nato pa lahko skupaj razmišljamo, kaj se je zgodilo in kaj je
    to nekaj proizvedlo. Prav materialni temelj koreografije je kolektivu odprl neskončno
    možnosti. *"Ples lažje premika (stvari) kot gledališče,"* je prepričan Pristaš.
    V označevanju njihovega dela tako zaokroži: razmišljamo skozi proces koreografiranja
    in o tem, kako se to povezuje z dejanjem gledanja. Pri prvem torej govorimo o
    plesu in se nanaša na to, kar se kaže/predstavlja, ko govorimo o gledanju, pa
    govorimo o gledališkem dispositivu, gledališču kot kontekstu kazanja in gledanja.


    Pri tem se s svojim delovanjem napajajo in vstopajo v obširen referenčni bazen
    teorije in prakse. Med prvimi osebnimi vplivi Pristaš navaja predstavo *Noordung
    – Molitveni stroj* **Dragana Živadinova,** pri kateri je ta stal med gledalci
    in sredi resne scene spodbujal njihov smeh in glasne odzive ter s temi motnjami
    v občinstvu zarezal v samo izkušnjo gledanja; *"zaznavanje tega hrupa nekje za
    svojim hrbtom me je prvič pripeljalo do izkušnje samega gledanja,"* kot je prepoznal
    Pristaš tudi v retrospektivnem pogledu v luči njihove kasnejše prakse, ko se je
    ukvarjal z logiko reprezentacije in možnostmi vzpostavljanja odnosa med vidnimi
    podobami in nevidnim v dejanju gledanja. Že filozof francoskega razsvetljenstva
    **Denis Diderot** je v gledališče vnesel idejo podobe in v iskanju drugačnih modalitet
    uprizarjanja izhajal iz kritike sočasnega slikarstva ter skozi tableau vivant
    vpeljal premor, zaustavitev odrskega življenja z možnostjo, da gledalec opazuje
    sliko. Kot referenco Pristaš navaja tudi **Benjaminov** razmislek o telesih jogijev,
    ki združujejo prakso stroja (jogijskih vaj) z vitalnostjo dihanja in raztezanja,
    ki vstopa v odnos s strukturo podob, še posebej pa pojav kinematografije in vpliv
    filma ter filmske teorije na transformacijo gledanja v črni škatli gledališča;
    kako deluje kino, kako gledamo v gledališču ali v kinu, kako lahko objekt prevedemo
    iz enega koordinatnega sistema (kino) v drugega (gledališče), kako najti pogled,
    kjer reprezentacija v gledališču kolapsira.


    # Zavedanje in integriteta plesalca v okolju


    Pomemben del njihove kolektivne prakse so diskusije. Koreografsko delo v predstavi
    je vedno rezultat pogajanja različnih pozicij vseh sodelujočih in sediment vsega,
    kar se je odvilo v procesu dela. Pri tem izhajajo iz preiskovanja in razmišljanja
    o zastavljenem problemu oz. problemski temi, v večmesečnih procesih pa je pomembno
    tudi, da si vsak kot posameznik najde svoje vstopno mesto v materijo, da se poveže
    z njo, saj le tako tudi nastopajoče telo deluje kompleksno in celovito. Kot je
    povedala Nikolina Pristaš, je za njihovo dramaturško in koreografsko delo pomembna
    tudi "logika tujositi", kar dobro ponazori *Whatever Dance Toolbox*, softversko
    orodje za analizo, razvoj in izobraževanje plesnega gibanja, ki snema plesalčeve
    gibe in jih projicira transformirane – z zamikom, zamegljene ali kako drugače
    obdelane. *"Plesalci smo močno notranje fokusirani, ob uporabi tega orodja, ko
    plešemo z lastno podobo na ekranu, ki jo tehnologija modificira, in to skušamo
    vključiti v gibanje, pa je pomembna deljena pozornost – navznoter in navzven,
    nase, na našo podobo in na druge. Pozornost je potrebno nenehno premeščati in
    se pri kompoziciji gibanja pogajati med prostorom, telesi in vsem, kar je okoli
    nas, da bi stabilizirali integriteto pri delu plesalca."* Plesalec se mora zavedati
    vsega, kar se dogaja v prostoru – okolja, predmetov, zvokov in ljudi v'
