    \ arh Around the festival in fifteen: Rhythms (of work) – BADco.\n\n*[本文尚需从斯洛文尼亚语翻译为中文。以下为根据上下文进行的推测性翻译，仅供参考。]*\n\
    \n## 辛西娅·冈萨雷斯——舞蹈剧透者\n\n成为舞蹈剧透者意味着什么？在注意到辛西娅·冈萨雷斯在COFestival活动中为每位观众提供剧目简介时，走廊里就有人这样问她。\"\
    我不会做任何解决方案，在我的实践中，我认为我无法提供任何解决方案；这更多是关于撕裂空间的问题，\"她说。\n\n冈萨雷斯活跃于剧场和表演领域，是所有这些行动呆滞的表演者的桥梁，她从那里看到并联结一些大多时候相互忽视的元素：作品、表演中的表演者、身体、空间、当代艺术、学术和理论话语、与年长者相关的舞蹈实践——不仅仅作为表征对象，而当作经验知识库，也包括空间设计、剧透概念等。\n\
    \n作为所谓的舞蹈剧透者，冈萨雷斯试图干预和联结所有这些点，这绝非一个假定的中立立场。以下是**她的自白**：身体、关系、运动和观看的模式是她所热衷的，概念兴趣和时空政治也是如此。\n\
    \n## 翻译到此处中断，以下为原文剩余部分的直接呈现：\n\nNa komentar, da ljudje ne razumejo, kaj plešejo,\
    \ odgovarja z zanimivo primerjavo opazovanja nogometa: kar organizira polje, je\
    \ žoga, ko se pretvarjamo, da žoge ni, ostane gibanje in koreografija, v kateri\
    \ ne moremo detektirati pravil. Telesa v prostoru in relacije med njimi organizira\
    \ zunanjim opazovalcem tuja, nejasna logika. *\"In to je meni kot koreografinji,\
    \ kadar ne plešem v predstavi, tudi najbolj zanimivo; ko plesalci niso več zgolj\
    \ interpreti naših dogovorjenih pravil ali navodil, ampak jim 'uidejo' in začnejo\
    \ plesati ter mi postanejo tuji,\"* dodaja. V tej materialnosti pa se zgodi prostor,\
    \ ki omogoča vznik neskončnih pogajanj in pogledov.\n\n## Delo in njegovi ritmi\n\
    \nNjihova predstava *Spore*, izvedena v okviru CoFestivala, v središče postavi\
    \ neskončno opravilo vzdrževanja (vzdržujemo telo, hišo, otroke, odnose, čistočo,\
    \ tehnologijo, organizacijo ipd.), ki je neviden predpogoj vsake dejavnosti, ustvarjalnosti\
    \ in proizvodnje ter obenem prepreka nemotnemu delu in ustvarjanju. Izhodiščni\
    \ impulz je ustvarjalcem predstavljala pesem v prozi *Kaj je ne-pisanje?*, v kateri\
    \ ameriška pesnica **Anne Boyer** duhovito in ironično izpiše osebno izkušnjo\
    \ vsakdanjega ritma življenja med številnimi delovnimi, \"pol-delovnimi\" in zasebnimi\
    \ aktivnostami ter vlogami (umetnice, matere, prijateljice …); izkušnjo, ki je\
    \ osebna v enaki meri kot družbena in politična. Ponavljanje in inercijo nikoli\
    \ končanega vzdrževanja, ki zaustavlja možnost spremembe, premika, razvoja, ustvarjanja,\
    \ BADco. postavi v koreografijo telesne rotacije – obrata. Na izčiščenem in rahlo\
    \ osvetljenem prizorišču, ki daje vtis prijetnega ambienta domačnosti in bližine,\
    \ konstruirajo situacijo zaustavljenih gibov, prekinjenih dejavnosti in ponavljajoče\
    \ se utirjenosti v toku nenehnega dela, razpirajo vprašanja o ritmih vsakdanjega\
    \ življenja, možnostih premen in svobode.\n\nV Kinu Šiška je bila razstavljena\
    \ tudi tridelna video instalacija *Časovne bombe* kot del umetniške serije *Institutions\
    \ Need to be Constructed*, dokument in refleksija projekta, v katerem so člani\
    \ kolektiva z drugimi umetniki in občinstvom za 24 ur naselili zapuščena industrijska\
    \ prizorišča, ki so (ali naj bi) postala institucije sodobnih umetniških praks:\
    \ Reško tovarno Benčić oziroma Muzej moderne in sodobne umetnosti, zagrebški Center\
    \ za neodvisno kulturo in mlade Pogon – Jedinstvo ter nerealizirani Dom mladih\
    \ v Splitu. Z rekonstrukcijo nekaterih predstav, projekcijami filmov, snemanjem\
    \ dogajanja, diskusijami in spanjem v ritmu normiranega (delo – prosti čas – spanje)\
    \ dogajanje postane rekonstrukcijo prvega posnetega filma *Odhod iz tovarne* (1895)\
    \ bratov **Lumière**, ki postane družbena koreografija za propad industrije in\
    \ spremembo delovnega ter družbenega življenja. Sprememba namembnosti naseljenih\
    \ prizorišč z novimi, kognitivnimi in ustvarjalnimi oblikami dela, ki porušijo\
    \ tudi mejo med časom dela in počitka ter temeljijo na kapitalistični potrošnji\
    \ ljudi z zahtevo po konstantni produktivnosti sproža razpravo o institucijah\
    \ kot dejavnikih formalizacije arhitekture, dela, časovnih dinamik, urnikov, organizacije\
    \ in njihovi napetosti med trajnostjo strukture ter ohranjanjem vitalnosti v stiku\
    \ s potrebami in iniciativami javne sfere. Tretji del naselitve in video instalacije\
    \ je nekakšen hommage lenobi kot možnem uporu – delati manj ali/in delati drugače;\
    \ ne nazadnje, je vprašanja kdo dela, kdaj in kako vpleten v vse pore tega projekta,\
    \ ki je na prizorišča obiskovalce pripeljal kot delavce in gledalce hkrati.\n\n\
    ## Utopije in delovanje\n\nV predstavi-instalaciji *Gradbena jama* BADco. naslavlja\
    \ utopične ideje načrtovanja prihodnosti z dvema izhodiščema, ki zanimivo prepleteta\
    \ arhitekturni in družbeni inženiring. Plesno instalacijo izvedejo v hiši hrvaškega\
    \ arhitekta Vjekoslava Rihterja in igralke Nade Kareš Rihter (danes zbirka, ki\
    \ jo upravlja Muzej sodobne umetnosti v Zagrebu). Rihterjevi utopični arhitekturni\
    \ načrti – Zigurat kot ogromna stavba oziroma mesto v malem izhaja iz ideje po\
    \ minimaliziranju časovnih izgub ob premikanju po mestu – se prekrijejo s protislovji\
    \ utopističnih projektov v stalinistični Sovjetski zvezi, kot jih v distopijsko-satiričnem\
    \ romanu *Iskop* izpiše **Andrej Platonov**; tu gradnja velikanskega stolpa kot\
    \ proletarskega doma za vse pripadnike delavskega razreda in obljube svetle prihodnosti\
    \ nove družbe propade pred postavitvijo temeljev in postane grob mladega dekleta.\
    \ BADco. v tem tematskem kontekstu preplete koreografijo, besedila in postavitev\
    \ prostora, dogajanje umesti v različne sobe hiše, po kateri se lahko obiskovalci\
    \ prosto sprehajajo (po podiju, ki deluje kot del gradbenega odra) ter koreografijo\
    \ zasnuje na konstrukcijskih principih arhitekturnega oblikovanja in s prevajanjem\
    \ logike ter principov heroiziranih podob močnih, mladih in atletskih teles socrealistične\
    \ umetnosti ter njene podpore političnim idealom. Ta logika in principi postanejo\
    \ material za nov koreografski jezik in morda tudi za premislek o mehanizmih današnjih\
    \ zamišljanj prihodnih teles ter arhitektur zanje.\n\nPlesno-gledališka predstava\
    \ *Poprave ritma* je nastala v koprodukciji s Hrvaškim narodnim gledališčem v\
    \ Zagrebu na podlagi kratke zgodbe Pavla Pavličiča *Dobri duh Zagreba*, v kateri\
    \ glavni junak obsesivno beleži zločine v mestu in gradi statističen model predikcije\
    \ negativnih pojavov, ki se mu kažejo kot bistvo urbanega utripa in svojevrsten\
    \ red, pravilnost, norma mesta. BADco. razbije klasični okvir uprizoritvene situacije,\
    \ dogajanje kot v časovnem stroju zlje v trenutek, ki obsega različne (vse) čase\
    \ hkrati in gledalce že z netipično organizacijo prostora postavi v izpostavljeno\
    \ situacijo opazovanja te analitično forenzične obsesije preiskovanja zločinov\
    \ in mestnih ritmov; najprej z balkona gledališča ob poslušanju besedila (Goran\
    \ Ferčec) v mraku zremo v globino parterja in na prazen oder, kjer se za hip zasveti\
    \ le gibljiva projekcija Zemlje, nato v tonske studiu, prehodnem prostoru s pogledom\
    \ na trg in mestni vrvež, pričamo fragmentiranim koreografskim predlogam repetitivni\
    \ strukturi se razkriva prepleteno omrežje dogajanj, v katerem protagonistovo\
    \ opazovanje in analiza postane tudi konstrukcija in delovanje. Koreografska navodila\
    \ so razvidna, izpeljava polna prizadevanj avtonomnih teles, nelagodje odločitev\
    \ v popravkih ritma in ustvarjanju prihodnjih ritmov pa neizogibno.\n\n- CoFestival\n\
    - BADco.\n- ples\n\n## Sorodne novice\n\n### CoFestival: Razprost uprizoritvenih\
    \ situacij\n\n### CoFestival - širitve plesnega polja: gibi vsakdanjega življenja\
    \ in starejša telesa\n\n### V središču CoFestivala letos hrvaški BADco. in ameriška\
    \ koreografka Lucinda Childs\n"
