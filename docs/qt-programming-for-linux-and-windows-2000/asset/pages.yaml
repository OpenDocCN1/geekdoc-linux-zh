    # QWidgetStack


    QWidgetStack manages a “stack” of widgets in which only the top widget is visible
    at any given time. This is an excellent way to present multiple views of information
    in a limited real estate environment, when only one view is needed or pertinent
    at a time.


    # A Possible Instantiation


    ```

    QWidgetStack *cards = new QWidgetStack( this );

    ```


    # Example Use


    ```

    QWidgetStack *cards = new QWidgetStack( this );

    // Create an instance of our new Gizmo Widget

    myCustomWidget *gizmoWidget = new myCustomWidget( this );

    // Add it to the ‘top’ of the stack

    cards->addWidget( gizmoWidget, 0 );

    // Create an instance of the Cosmos Widget

    myCosmos = new myCosmos( this );

    // Add it to the stack

    cards->addWidget( myCosmos, 1 );

    // Make Cosmos the one on top (visible)

    cards->raiseWidget( 1 );

    ```


