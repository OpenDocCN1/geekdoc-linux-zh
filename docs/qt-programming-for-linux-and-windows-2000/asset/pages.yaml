- pgno: 192
  md: '# merger UTILITY


    As you make changes or additions to your application, you will probably need to
    change your translation files accordingly. To do so, you can simply run the *finder*
    utility again to create a new baseline translation file, then use the *merger*
    utility to merge the changes into your existing language-specific translation
    files. This will recreate the target translation file with comments about the
    changes.


    Once you''ve edited the new translation files, you can use the *msg2qm* utility
    to create the Qt message files that QtTranslator expects.


    ```

    finder hello.cpp > hello.po # create a new base

    ```


    (Edit hello.po, making any required changes or additions.)


    ```

    merger hello.po hello_sp.po

    msg2qm hello_sp.po hello_sp.qm

    ```


    It''s a good idea to maintain the translation files with a good version control
    system such as RCS, Microsoft VSS, or whatever you prefer. This is especially
    true during the initial implementation, when the project is subject to major feature
    changes. It is very easy to lose track of which translation files are appropriate
    for a given release of the application.


    # INPUT METHODS


    Of course, Qt doesn''t address *all* the complex issues involved in internationalized
    application development. The underlying window system must take responsibility
    for much of the low-level functionality. This is especially true in the case of
    keyboard input methods. Very few companies have the resources that are required
    to provide a comprehensive set of input methods, but because Qt is so widely accepted
    by the Linux community, there are an ever-increasing number of freely available
    implementations.


    Those languages with unidirectional single-byte encodings (European Latin 1 and
    KOIS-R etc.) and the unidirectional multibyte encodings (East Asian EUC-JP, EUC-KR,
    etc.) are directly supported. Support for “complex” encodings—those that may require
    right-to-left input or complex character composition (e.g., Arabic, Hebrew, and
    Thai script)—will *probably* be implemented in a later release.


    The following list is the (more or less) current state of encodings support (assuming
    your OS doesn''t provide the support already, as is the case with Linux):


    +   - Microsoft Windows—The local encoding is always supported.

    +   - ISO standard encodings—ISO 8859-1, ISO 8859-2, ISO 8859-3, ISO 8859-4, ISO
    8859-5, ISO 8859-7, ISO 8859-9, and ISO 8859-15 are fully supported.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   * Arabic (ISO 8859-6-1) and Hebrew (ISO 8859-8-1) encodings are not supported,
    but are under development by third parties.

    +   * KOI8-R is fully supported.

    +   * EUC-JP is fully supported.

    +   * EUC-KR is fully supported (thanks to Mizzi Research, Inc.).

    +   * Big5—Qt contains a Big5 codec developed by Ming Che-Chuang. Testing is under
    way with the xcin (2.5.x) XIM server.

    +   * “Simplified” Chinese—currently unsupported.

    +   * EUC-TW—Under external development.


    You should have no trouble working with the proprietary input methods such as
    those provided with HP/UX locale packages, unless you require the functionality
    of XIM protocol revision 4.0, as HP still provides version 3.5.


    Qt makes it much easier to code internationalization support into any application—
    even existing Qt projects that weren’t originally coded “properly.” Having added
    language translation support to an existing medium-scale project (there is virtually
    no input other than via mouse), I learned an important lesson: Add language translation
    support (at least) whether the specification calls for it or not. It’s easy; there
    is no noticeable performance hit, and you just might save yourself a few hours
    of future time, because you never know when you’ve told your project is going
    to ship to a foreign country.


    At the cost of “plugging” my employer’s products, I think it’s worth noting that
    Hewlett-Packard and most other large UNIX vendors market PS/2 keyboards (with
    mini-DIN connectors) that sport language-specific keycaps. At the expense of plugging
    a competitor’s products, IBM sells PS/2 keyboards with detachable keycap sets
    for various languages. These will work on most Intel-based Linux implementations,
    although you will still need to provide some form of input method, or maybe just
    a custom keyboard configuration for your X server. Contact your favorite vendor
    for pricing on specialized keyboards, but don’t expect a lot of vendor support
    for that keyboard on Linux.


    # PLATFORM-INDEPENDENT PROJECTS


    There are several schools of thought regarding the creation and maintenance of
    project build scripts. On Linux (or other UNIX-like) platforms, developers are
    already comfortable with the Makefile format. These Makefiles are often created
    on demand by a configure script that is either a highly customized shell, Perl,
    or Tcl script, or the product of a GNU autotools script. Developers from Microsoft
    Windows platforms are usually more comfortable with a Visual C++ project or workspace
    file. This creates yet another platform-dependency barrier that is separate from
    other platform dependencies.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Tmake UTILITY


    Trolltech has addressed this issue with a free utility called Tmake. Tmake is
    a Perl script that reads a platform-independent project description file (usually
    with a .pro suffix) and creates a platform-dependent Makefile or Visual C++ project
    (.dsp suffix) file. The Tmake utility is provided as a binary for Windows platforms,
    so as a developer you don''t need to be a Perl expert to use it. Tmake comes bundled
    with HTML documentation, some commonly needed template files, and another utility,
    progen, that will automatically create a very simple Tmake project file from C++
    source and header files it finds in the current directory and its subdirectories.


    Copies of the October 1999 snapshot of Tmake 1.4 for Linux (other Un*xes as well)
    and Microsoft Windows are included on the CD that comes with this book. It should
    take you about thirty minutes to become fluent in its use. You will probably consider
    those thirty minutes well spent as this utility makes any development project
    easier to manage.


    Tmake can be modified to suit a specific need, but Windows developers will need
    to get a copy of Perl for Windows to do so.


    # OBJECT REUSE CONSIDERATIONS


    Veteran C++ programmers can probably skip this chapter—it is little more than
    a brief overview of basic design considerations for programmers who will be creating
    reusable tools based on Qt.


    One of the most common reasons for using an object-oriented language is the object
    reuse implications associated with polymorphic myosticism. The Troolls have demonstrated
    a consistent policy of making the Qt toolkit objects recyclable in a predictable
    manner (i.e., you don''t usually need to look at the documentation or the headers
    to determine what you need to override to accomplish a given task).


    Most C++ developers eventually acquire a skill for spotting the reusable pieces
    of code they produce. A much smaller subset of these developers can actually make
    their code reusable by other developers. This is no small accomplishment to be
    certain. It is the nature of almost every developer to declare “This would be
    so much better if Only...” There is certainly nothing wrong with that attitude,
    but if the developer takes it so far as to reimplement the entire platform SDK,
    their projects will never be completed!


    There are entire books and even courses of study devoted to this topic. While
    there is no magic rule that will guarantee immediate adoption of your new XYZ
    widget, there are some simple guidelines that will help you produce consistent
    results that your users feel comfortable in using.


    # Keep It Simple and to the Point


    A good object design exposes only those methods required to make it perform all
    its intended functions. Adding extra or off-topic features, especially features
    that are not likely'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'to be used very often, will result in an unprofessional, “hacked” appearance.
    A simple in-terface often implies a simple—and therefore *reliable*—implementation.

    An object’s methods should accept a simple and obvious set of arguments. A user
    of the object should never have to scratch his head, wondering why a method needs
    a par-ticular piece of unrelated information.

    Default values should be used whenever a known value will be used more than half
    the time. Don’t provide a default value if any combination of all the arguments,
    combined with your default value, can break the implementation. When in doubt,
    provide no default value.


    # Always Consider Performance . . .


    … , but avoid *obsession* with performance.

    A large number of projects have been scrapped in their entirety because little
    or no regard was given to performance in the early design stages. Virtual functions
    are great, but there is a very real performance and resource cost associated with
    their runtime man-agement. Careful consideration of how an object will be used
    can help prevent unneces-sary performance (or even resource) issues later on in
    the development cycle.

    If you can see no reason to ever change the behavior of a particular method, don’t
    declare it virtual. Your users will let you know whether you need to revisit that
    part of your design.

    If a given method can be implemented in one or two lines, doesn’t need to be vir-tual,
    and doesn’t need to hide the implementation from the users, consider making it
    an inline function. (I point this out because I just realized a seventy percent
    performance in-crease in an old utility program—just by inlining one of the frequently
    called methods.)


    # Know Your Compiler


    While not exactly necessary, and somewhat difficult to acquire, a solid understanding
    of what the compiler is going to do with the code you write will almost certainly
    result in a product that is well behaved and robust. At the very least, a fundamental
    understanding of what will happen at compile-time vs. what will happen at runtime
    is essential.

    If you’ve ever seen a library routine that accepts the *value* of (a possibly
    large) structure as an argument, then you have seen code written by someone who
    don’t un-derstand what the compiler will do with the code. While more advanced
    compilers can compensate for some of these errors in judgment, no compiler is
    completely foolproof. Any book on compiler design is a wise investment.


    # Assume Nothing


    Always initialize private and global data to reasonable values. Just because your
    *Acme Millenium Edition, Deluxe C++ Compiler* will guarantee that all uninitialized
    pointers will be NULL at runtime doesn’t mean that this same compiler will be
    used throughout the lifetime of the product.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "Always check the return from the `new` operator with a subsequent call to the\
    \ Qt `CHECK_PTR()` macro. A bug in an object's constructor or a resource or quota\
    \ problem can be very difficult to locate otherwise. The following example demonstrates\
    \ a possible convention to use.\n\n```\n```\nQLabel *1 = new QLabel( this );\n\
    CHECK_PTR( 1 );\n```\n```\n\n# Use Slots For Exposed void-return Methods\n\nDeclaring\
    \ an access specifier on a class method as \"<access> slot;\" has no associated\
    \ performance cost if the method is called as a normal class method. There is\
    \ a very small resource cost incurred within the text (or code) segment, and a\
    \ very minor performance cost if the method is invoked via emit. Since the signal/slot\
    \ mechanism is totally independent of the GUI event loop, the use of signals and\
    \ slots doesn't mean your object must be used in a GUI application.\n\nConsider\
    \ the following code fragment:\n\n```\n```\nclass MyObject : public QObject\n\
    {\n Q_OBJECT\npublic:\n MyObject( QObject *p=0 );\n const QString &text();\n void\
    \ nonSlotSetText( const QString &s ) { data = s; }\n\npublic slots:\n void setText(\
    \ const QString &s ) { data = s; }\n\nprivate:\n QString data;\n};\n```\n```\n\
    \nIn this example, the nonSlotSetText() method will perform no better (or worse)\
    \ than the setText() slot method, when called as a normal class method. The only\
    \ real difference is that the nonSlotSetText() method cannot be connected to another\
    \ object's signal. Therefore, it makes sense to expose reusable components' public\
    \ or protected void-return methods as slots, whether you can foresee a need to\
    \ connect them to a signal or not.\n\n# DYNAMIC AND STATIC LINKAGE\n\nAlmost every\
    \ modern operating system has adopted the concept of *dynamic* (or shared) libraries\
    \ of routines. On Linux platforms, these are usually denoted by a .so.Major.Minor\
    \ suffix on an executable file, reminiscent of the Sun Microsystems naming convention.\
