- pgno: 201
  md: 'If a large number of users are making similar complaints, it probably indicates
    a design defect. These are easy to correct, but a developer will need to exercise
    caution when addressing complaints based on purely subjective detail.


    # ## Software Defects


    A software defect can be defined as any software behavior that deviates from the
    design. The software may be dumping core (Linux and friends) or causing “Dr. Watson”
    dialogs to pop up, or the software may be adding two plus two and calculating
    a sum of three. Sometimes, software defects are easy to correct. Other times,
    a developer can spend weeks trying to track a specific problem down.


    Bugs that aren’t detected during the initial testing or beta release phases of
    the development cycle are usually more difficult to correct—both in terms of debugging/correction,
    and the imminent redeployment of the software that usually results.


    If you haven’t already, please read the online Qt documentation for debugging
    techniques. Qt provides some useful mechanisms to assist in problem solving.


    Since every developer has her own idea of the “best” way to debug a software defect,
    I’ll offer mine to those who have little experience. If one is inappropriate or
    fails to detect the problem, try another. It may take a long time, but every problem
    can be solved.


    # ## Defect Event Capture


    Capture the details of what takes place as, or just before, the defect occurs.
    This is an obvious first step in the debugging process. You can temporarily add
    hard-coded print statements, use the qDebug() macro, or add ASSERT() macro statements.
    It helps a great deal to have a complete understanding of what is taking place
    within your code when the problem(s) occur. It is my experience that up to ninety-five
    percent of all software defects can be analyzed and corrected in a matter of minutes
    using this method.


    The following example code represents a possible event logging class that can
    help you to spot a defect easily and (important for many) remotely. By adding
    calls to Log::print() within your code, you can easily view exactly what worked
    and what didn’t in a postmortem. The class provides millisecond-accuracy timestamps
    (within the limits of the OS), limited log file size, and log sequence numbers
    (to help coordinate a support effort over the phone).


    ```

    ```

    Log.h


    #ifndef _LOG_H

    #define _LOG_H


    #include <stdio.h>

    #include <stdlib.h>

    #include <stdarg.h>

    #include <qobject.h>

    #include <qstring.h>

    #include <qfile.h>

    ```

    ```'
