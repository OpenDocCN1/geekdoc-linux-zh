    # **SUMMARY**


    It''s important to keep in mind that all the widgets discussed above, and all
    the widgets discussed in the following chapters, can be combined, subclassed,
    and modified to create completely new widgets—with a minimum of coding effort.
    It is my experience that the basic line edit, as provided by the QLineEdit widget,
    is the most common widget to require modification, as the supplied modification
    examples attest.


    It is equally important to maintain a consistent feel and behavior throughout
    your application to avoid confusing the user. Qt makes it very easy to “play”
    with different ways to achieve a single result. This sometimes leads to a confusing
    interface, creeping functionality, or both.'
