- pgno: 197
  md: 'other UNIX-like platforms, a _.sl_ suffix, or a trailing _.so_ convention is
    used. On Microsoft Windows, a _.dll_ suffix is in fashion.


    Whatever the naming convention used for your shared library mechanisms, the concept
    is the same. A single text segment (code segment on Windows) image of each library
    routine is loaded into memory and shared by all applications that make use of
    the routines. Each application will have a private stack and heap segment, so
    local variables within the library routines are safe from modification by another
    process using the same libraries. This mechanism can save a great deal of memory
    when compared with the _static linkage_ model, in which every copy of an application
    that uses the library routines has a completely separate copy of each library
    routine. The choice seems obvious, and many developers don’t look beyond the obvious
    disk-image size difference of the linked executable. There are some serious considerations
    that need to be made, however, before committing to a shared library deployment
    of a project.


    # ## Big Programs


    A statically linked program will be _big_. It will have a much larger filesystem
    footprint, and it will use a lot more memory when executed. With few exceptions,
    each successive invocation will use just as much memory as the first. Some compilers
    will permit runtime sharing of certain sections of an application, completely
    aside from the shared library mechanisms, but these are uncommon.


    Static programs are very compatible. A well-behaved, static application will yield
    very few support calls.


    # ## Compatibility


    As almost every Microsoft Windows user, IT professional, or developer will testify,
    version conflicts between releases of a shared library are a serious support headache.
    Most Linux developers have experienced shared library incompatibilities as well,
    though Linux has traditionally maintained an advantage in addressing this issue,
    and a developer usually won’t panic when she sees an err message, as end-users
    often do. _Windows 2000_ greatly reduces the risk of incompatibility problems—for
    _Windows 2000_-specific projects. Legacy projects may still experience problems,
    however.


    Trolltech frequently releases new versions of the Qt toolkit—about every six months
    or so. These releases are not always binary-compatible, although Troll is very
    good about warning the consumer of potential conflicts. Even so, your dynamically
    linked application, with its small memory and filesystem footprint, is dependent
    on specific library routines that may (or will) one day be replaced with a version
    that is going to break your application.


    # ## Possible Solutions


    These two problems can be managed in a number of ways. Each has advantages and
    disadvantages, and you are left to decide what is best for your unique circumstances.'
