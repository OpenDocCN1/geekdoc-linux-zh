- pgno: 199
  md: 'The tradeoff is, of course, increased compatibility and decreased interdependency
    for a corresponding increase in system resource utilization.


    Nobody will be able to tell you which model is best or appropriate for your targeted
    end-users. You must determine that for yourself with existing infrastructures
    playing a key role in the determination process. If your target audience is a
    "shareware" or "freeware" release of a product, compatibility should be your primary
    concern. If your users live in a shielded, IT "bubble," you can likely try to
    save as many resources as possible.


    # DEBUGGING PROJECTS


    A safe definition for "software bug" is: any behavior of the software that deviates
    from the end-user''s expectation. That''s a very broad statement, but it embodies
    the only aspect of the entire software development cycle that really matters—meeting
    or exceeding your end-user''s expectations. Any software—be it a GUI CD player,
    a system administration utility, a network service daemon, or a power grid control
    application—is created to serve some purpose. That purpose may have been mandated
    by a detailed and well-planned specification, or it may have been the result of
    a half-baked, chocolate and caffeine-induced epiphany, implemented to the chainsaw
    harmonies of Nine Inch Nails. Whatever the source of the software''s purpose,
    an end-user will have some expectations regarding the behavior of the software
    based almost entirely on her perception of its purpose. If those expectations
    are not met, your software has a bug. It may be a documentation bug, or it may
    be a software logic flaw that causes a total power blackout in New York City.
    Either way, the end-user''s expectation has not been met.


    As a software developer, you will eventually become involved in the support process
    that is associated with every software project. Not every developer is a skilled
    or experienced troubleshooter, and there is no short path to becoming one. However,
    if you follow these basic steps when attempting to solve an end-user problem,
    the chances that you will be successful are greatly improved:


    +   - Get an accurate description of the problem. This is the most important and
    usually the most difficult step. It is especially difficult to get a good problem
    description when dealing with users who have little or no technical training.
    Please remember, the use of torture in extracting a problem description violates
    several international treaties.


    +   - Once the user has given you a description that you feel may be adequate,
    repeat the description back to him and ask him to confirm or correct your version
    of his description. This will eliminate almost all communication problems.


    +   - If you are not certain how this impacts his work, ask him. This has two
    goals: it will help you prioritize the tasks involved in a solution, and it indicates
    to the user that you understand his entire problem—the way he sees it. If you
    already know the impact to the user, tell the user what you believe the impact
    to be and ask him to verify it. The user may add you to his Last Will and Testament
    or send you a case of beer—at the very least, he will be more cooperative.'
