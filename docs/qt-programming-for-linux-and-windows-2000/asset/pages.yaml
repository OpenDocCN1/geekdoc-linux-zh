  img_proc: true
- pgno: 200
  md: '+   • Try to determine whether the user can reproduce the problem he has described.
    If possible, get the user to write the procedure down or send it to you via e-mail.

    +   • If it’s a complex problem, or the user is unable to describe the problem,
    try to reach a mutual agreement with the end-user as to what the solution will
    “look like.” The purpose is to get an accurate description of what this user expects.


    Obviously, this is a rather formal approach to support methodology, and many developers
    will never speak to an end-user because these developers are lucky enough to have
    a separate end-user support organization—or they develop only for other developers,
    who will quietly solve the problem themselves and later take full credit for all
    the work.


    # Documentation and Training Bugs


    I define documentation defects as any visual cue associated with the software
    that causes the end-user to expect something that the software is not intended
    to deliver. It can be as simple as the use of inappropriate/confusing icons, or
    misleading program names that the user will see. It can be as complicated as a
    blatantly inaccurate user manual written by a technical writer who recently died
    of acute dyslexia. If you choose to name your latest e-mail application “cd_player,”
    you have an obvious documentation defect.


    Documentation defects are usually easy to detect, and often just as easy to correct.
    After you have corrected the documentation problems, you may still be left with
    a training problem. If you were tenacious enough to create detailed documentation
    for your project, and you were fortunate enough to get your users to read that
    documentation, your users have been trained with defective material. It may take
    a lot of effort to get those users to read the corrected literature, and you will
    probably have to keep answering questions until they do.


    Training bugs can be caused by defects in a formal classroom-training program,
    defects in documentation, or misinterpretation of either by the end-user. In addition,
    a user may have developed an incorrect expectation from prior experiences with
    legacy or other similar software. As stated above, documentation defects are easy
    to correct. Formal training defects are usually easy to correct as well. User
    misinterpretation, if it occurs on a large scale, usually indicates a documentation
    or training defect—even when the entire development staff is convinced otherwise.


    # User Perception Defects


    Software defect reports or enhancement requests will often be subjective in nature.
    If the user is complaining that the XYZ gadget is too <small, big, bright, dark,
    blurry, clear, etc.>, and many other users think it’s fine as is, it should be
    a bad idea to change the software to meet this user’s expectation, because it
    is nearly certain that it’s her expectation that’s defective. You can usually
    discourage such reports by giving the user a large stack of carefully designed
    (and impossible to complete) “Software Specification Committee, Request for Formal
    Hearing to Discuss Potential Change” forms to fill out.'
