    You are now ready to compile and run the example. You should compile this code
    in the same manner as described in the previous example. Execute the program and
    type some text into the newly created MyEdit object and then click the pushbutton
    marked “Copy.” You can now paste the contents of the MyEdit widget to anything
    you like.


    When you press the left mouse button while the cursor is positioned over the QPushButton,
    the QPushButoon receives a mouse event and emits the clicked() signal that we
    connected to our copy2clip() slot using the inherited connect() method of QObject.
    QObject is inherited by QWidget (our base class for MyWidget).


    While it’s not an absolute requirement that you understand the hierarchy of inheritance
    for each Qt object, it will certainly help you to anticipate behavior in your
    finished application. Without any understanding of the hierarchy, you will probably
    find yourself reimplementing methods that are already provided. This may sound
    like a somewhat daunting task, but the Qt reference documentation lends itself
    quite well to the task of tracking an object’s ancestors.


    The above example, while certainly useful, is not very exciting. When you begin
    applying the signal/slot concept to some of the more complex tasks that we all
    deal with every day, the advantages become apparent. You will see many such examples
    in following chapters.


    If you have not already done so, now is a good time to work through the tutorial
    exercises provided with the Qt toolkit distribution. Pay careful attention to
    Troll’s use of signals and slots and read the reference documentation for new
    widgets as they’re introduced. If you trace each widget’s inheritance using the
    reference documentation at each step, you will find your Qt programming skills
    are adequate to tackle most basic tasks.'
