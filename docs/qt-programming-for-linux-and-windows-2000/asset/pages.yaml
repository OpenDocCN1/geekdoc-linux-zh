    # **QHBoxLayout** A subclass of QButtonGroup, the QHBoxLayout organizes QButton
    widgets in a group with a single horizontal row, appropriate for a small number
    of checkboxes, radio buttons, and the like.


    # **QVBoxLayout** Another subclass of QButtonGroup, the QVBoxLayout organizes
