- pgno: 167
  md: '# QAsciiDict


    QAsciiDict provides a dictionary that is based on character pointer keys. This
    class provides no Unicode support, while QDict does. This class is provided for
    support of legacy code that is not Unicode compatible.


    # QAsciiDictIterator


    This class provides an iterator for QAsciiDict objects.


    # QBitArray


    This class maintains an array of single bit values and provides methods for performing
    bit-level operations on the array elements.


    # A Possible Instantiation


    ```

    ```

    QBitArray b( 4 );

    ```

    ```


    # Example Use


    ```

    ```

    // New array, initialize to 010

    QBitArray first( 3 );

    first[0] = 0;

    first[1] = 1;

    first[2] = 0;

    // Another, initialize to 011

    QBitArray second( 3 );

    second.clearBit( 0 );

    second.setBit( 1 );

    second.setBit( 2 );

    // New array == 010 | 011 == 011

    QBitArray third = first | second;

    ```

    ```


    # QByteArray


    QByteArray is implemented from QArray and provides an explicitly shared array
    of byte values.


    # QCache


    QCache is a template class that provides a simple caching mechanism based on QString
    keys. Two optional parameters to the constructor will affect performance. These
    are the *maxcost* and *size* parameters.'
