- pgno: 18
  md: '# # Preface


    This book is a guide to writing applications for Linux, Microsoft NT 4.0, Windows
    2000, Windows 95, and Windows 98, using the Qt software toolkit from Trolltech
    AS. As any respectable programming guide should, it provides a working knowledge
    of the Qt software distribution and the objects, widgets, and conveniences that
    the Qt toolkit provides. In addition, it explores some aspects of Qt programming
    for enterprise application development that are not obvious from the toolkit vendor''s
    documentation.


    # **AUDIENCE**


    This book is for C++ programmers and students that want to write effective application
    software using the Qt toolkit. The focus is primarily on platform-independent
    software, but some platform-specific topics are unavoidably covered.


    # **ASSUMPTIONS**


    This book is not a reference manual for the Qt objects and widgets—Trolltech has
    done an excellent job of providing reference documentation in HTML and Adobe Postscript
    formats. Their documentation is included with both the Qt-Free edition and the'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Qt-Professional edition licenses, and is available from the Troll web site.
    http://www/trolltech.com/


    This book is written for both the experienced C++ programmer and the knowledgeable
    beginner. It is assumed the reader is familiar with standard C++ data types and
    how new data types are created. The reader should be familiar with the basic concepts
    of object-oriented (OO) design and implementation, particularly the concept of
    object inheritance. I have avoided using multiple inheritance in my examples for
    purposes of clarity, but the reader is encouraged to experiment.


    While the title of this book implies a focus on Linux and Windows 2000, the actual
    scope is much larger. Most of the examples, as well as the code provided on the
    CD, will compile and function correctly on virtually any platform that Qt will.


    If you are an experienced Microsoft developer, some of the coding style presented
    here may cause mild confusion. Please remember that with a few exceptions, the
    code presented in this book is intended for cross-platform use. As a result, you
    will seldom see references to DWORD, LPVOID, and LPSTR data types because they
    are undefined on platforms outside the Microsoft arena, and since most of the
    standard Unix data types are compatible with Windows development, they are used
    instead. The “correctness” of either is purely subjective.


    Microsoft platform-specific examples require a Qt-Professional license. Licensing
    can be obtained directly from Trolltech, and is discussed in some detail in Chapter
    1. While Qt software development can be done using the Borland compiler and tools,
    it is far more common for developers to use Microsoft Visual C++. As a result,
    it is assumed that the Windows developer has access to Microsoft Visual Studio
    6.0 and VC98 (Visual C++).


    It is possible, in theory, to compile and use Qt-Frame edition applications on
    a Windows platform, using the Cygnus Win32 implementation, the ming32 compiler
    distribution, the X11R6.3 development kit for Win32, and an appropriate X server.
    Since this is an incredibly esoteric environment, it isn’t addressed by any of
    the examples in this book. However, any of the Linux examples should work, assuming
    you succeed in compiling the Qt-Frame edition with the Cygnus compiler distribution—something
    I haven’t tried yet.


    Linux development can be accomplished using the Qt-Frame edition. You will need
    a C++ compiler. This book assumes a generic gcc/g++ distribution (gcc-2.95 was
    used for the examples) from the Free Software Foundation (FSF), in the assumption
    that it is a reasonably low common denominator.


    Many other platforms are supported out-of-the-box by Troll. I have had virtually
    no trouble using Qt on HP/UX or AIX.


    # ## HOW THIS BOOK IS ORGANIZED


    This book is organized into three parts. Part One is an introduction to the Qt
    toolkit. It provides some initial programming examples, and discusses some of
    the unique features that set Qt development apart from other toolkits. Part Two
    is a detailed discussion of toolkit components. Part Three discusses project-level
    considerations and debugging techniques.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Appendix A maps the contents of the accompanying CD-ROM. Appendix B (and the
    index) help to map the contents of this book.


    # TYPOGRAPHICAL CONVENTIONS


    Text in *italics* is used to emphasize a point, introduce new terms or, as is
    the case in chapters 5 and 6, as a heading for basic examples.


    Examples of command-line text appear in a different typeface and will usually
    appear on a line by themselves as in this example of a Linux command-line:


    ```

    find . -name "*.cpp" -exec findtr {} \>/ /tr_text \;

    ```


    Examples and source fragments also appear in a distinct typeface, as in this example:


    ```

    #include <stdio.h> int main( int argc, char **argv ) { printf( "Howdy, Terre!\n"
    ); return( 0 ); }

    ```


    # THE ACCOMPANYING CD-ROM


    The CD-ROM that comes with this book is in ISO9660 format with Joliet extensions
    (long filenames). The root directory of the CD-ROM contains a number of subdirectories
    with names that are (hopefully) descriptive of their contents. The only file in
    the root directory is a file named “contents.txt” that, surprisingly, contains
    a text map of what the CD-ROM contains, along with some brief descriptions of
    those contents.'
  merge: -1
