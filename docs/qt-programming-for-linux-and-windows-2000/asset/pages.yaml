- pgno: 69
  md: '# Widget Modifier Flags


    The modifier flags alter the behavior of the other flag values.


    +   - **WDestructiveClose**—causes the widget to be destroyed when the widget
    accepts a *closeEvent()* or when it attempts to ignore a *closeEvent()* and fails.


    +   - **WPaintDesktop**—causes the widget to receive paint events for the desktop.


    +   - **WPaintUnclipped**—causes all *painters* to paint in an unclipped manner.
    All children of this widget, and all widgets in front of it (above this widget
    in Z-order) will not clip the areas the painter can paint on.


    +   - **WPaintClever**—indicates that Qt should not try to optimize repainting
    for the widget and that the underlying window system will pass repaint events
    directly to the widget. This may generate more events, but usually reduces the
    size of the areas that will be repainted (e.g., by expose events).


    +   - **WResizeNoErase**—indicates that the widget should not erase its contents
    when resized. This can reduce possible flicker during a resize caused by using
    **WPaintClever**.


    +   - **WRepaintNoErase**—indicates that the widget takes responsibility for painting
    (and repainting) all its pixels. Scrolling, expose events, updating, and focus
    changes will not erase the contents. This can reduce possible flicker that can
    result from using the **WPaintClever** modifier.


    +   - **WMouseNoMask**—causes a masked widget (one with an irregular shape) to
    receive mouse events for the entire widget window (which is always rectangular
    or square).


    +   - **WNorthWestGravity**—indicates that the widget’s contents are statically
    aligned to the top-left corner. A resize event will only create repaint events
    for newly exposed contents of the widget.


    All the above flags can be combined to achieve a desired special effect, although
    the default flags for the higher-level (subclassed) Qt widgets are usually adequate.


    # QOBJECT CLASS


    Nearly every Qt class inherits the QObject class behavior. It is the base class
    for the Qt object model and provides the functionality that makes the signal/slot
    mechanism (discussed next) work. QObject contains an optional object name value
    and can report its class name (if the class definition contains the Qt-specific
    keyword **Q_OBJECT** in its class definition). It can receive events via the *QObject::event()*
    method, filter events for other QObject:s, and can intercept events for its children.
    QObject manages a parent/child object-tree in a manner that is similar to QWidget.
    If you delete a QObject, all of its children will be destroyed first.


