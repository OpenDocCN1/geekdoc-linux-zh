    # ## QT EXTENSIONS


    The Qt extensions lie outside the core functionality supported by the vendor.
    This does not mean that Troll won''t support the extensions if you spot a bug,
    but Troll offers no formal warranties to their portability or functionality on
    a given platform. The following information provides an overview of the extensions,
    and brief examples of how they are used.


    # ### OpenGL Extension


    OpenGL is a 3D rendering API from Silicon Graphics, Inc. (SGI). OpenGL or similar
    APIs are available for all the platforms that Qt is available on, but OpenGL provides
    very little functionality for providing 2D user interface support. Historically,
    an OpenGL application would have some Motif or MFC code for that purpose. The
    Qt OpenGL extension serves the same function and permits the Qt programmer to
    add a 3D rendering view his application—or it permits the OpenGL programmer to
    add a nice user interface to his rendering application—depending on which side
    of the 2D/3D fence you''re marking territory at the moment.


    The Qt OpenGL extension will work quite well with OpenGL, Mesa, GLX, and others,
    and several useful examples are supplied. As with all of the extensions, you will
    have to explicitly build the source, or you''ll have an extra library to link
    with if you use the extension.


    The following classes are provided by the extension:


    +   - **QGLWidget**—an easy-to-use Qt widget that supports an OpenGL rendering
    context.

    +   - **QGLContext**—an encapsulation of an OpenGL rendering context.

    +   - **QGLFormat**—specifies the display format and operating parameters of the
    rendering viewport.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Networking Support


    While no formal network protocol support is provided with the Qt toolkit itself,
    a separate Qt extension is in development at this time. Check the Trolltech Web
    site for availability.


    # SUMMARY


    The topics covered in this chapter are unrelated to the material in prior or subsequent
    chapters, and so they received a chapter of their own.


    The Qt class defines a large number of constants that would, traditionally, have
    been relegated to global variables or global constants. Since the Qt class is
    inherited by most Qt classes, those classes and their subclasses can use these
    values directly.


    While the TroLls have reduced the number of available extensions in the toolkit
    in favor of making the extensions available as separate libraries, there appears
    to be a desire on their part to continue the tradition for a little while longer.
    The only extension that remains from the 1.X and 2.0 releases is the OpenGL widget
    class.'
