    Because I spend a lot of time coding for Windows 2000, I usually create icons
    with a Windows paint program and save them in Windows Bitmap format (.bmp). While
    that format is not directly useful for embedded graphics, you can make use of
    the provided load() and save() methods to convert the image to XPM format. Then,
    you can embed the XPM image in your code, something like this:


    ```

    ```

    #ifndef NEED_CVT

    #include "pixmaps/new_icon.xpm"

    #endif

    QPixmap new_ico;

    #ifdef NEED_CVT

    new_ico.load( "new_icon.bmp" );

    new_ico.save( "pixmaps/new_icon.xpm", "XPM" );

    #else

    new_icon = QPixmap( (const char **)new_icon );

    #endif

    ```

    ```


    This approach makes it very easy to mass-convert an entire new set of toolbar
    icons with only a conditional compile, greatly simplifying a project deployment.


