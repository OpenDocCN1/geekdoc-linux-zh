    # SPLIT PANES AND TABS


    Many applications can benefit from a visible partition to subdivide the application
    interface into logical groupings of features. There are several ways to do this.
    The first is to divide the interface into separate panes that can be moved around
    or resized by the user. Another method is to provide a row of "tabs" that the
    user can select to display different "pages" of information or features. There
    are other methods that are less direct from a programmatic standpoint, but the
    following methods are provided with the Qt toolkit.


    **QSplitter**  A QSplitter provides split-pane resizing functionality to its child
    widgets. Virtually any number of child widgets can be added, although at some
    point, the results will become visually unappealing, not to mention confusing
    to the end-user.


    # *A Possible Instantiation*


    ```

    QSplitter *s = new QSplitter( this );

    ```


    # *Example Use*


    ```

    // Create a split-pane with a listbox on the left

    // and a listview on the right

    QSplitter *s = new QSplitter( this );

    QListBox *lb = new QListBox( s );

    QLListView *lv = new QListView( s );

    ```


    **QTab**  QTabs are the class used to implement the individual tabs in QTabBars.
    If you want to customize the appearance of your application’s tabs, this is where
    you should start.


    **QTabBar**  A tab bar provides a visual interaction with the end-user that creates
    an effect similar to a card-file or tabbed dividers in a notebook. The user selects
    a tab and a "page" of widgets is presented.'
