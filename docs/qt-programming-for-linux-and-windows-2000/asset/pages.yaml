- pgno: 130
  md: '# # CHAPTER 4

    # Program Output Objects


    Program output objects are classes that are typically used to display information.
    Unlike the widgets discussed in the previous chapter, these objects provide no
    default user interaction functionality or behavior by themselves. They provide
    no keyboard or mouse handling functionality, although you can easily add either
    if the need arises.


    # ## COLOR AND PALETTE SUPPORT


    The details of color management are highly platform-dependent. Microsoft Windows
    does not allocate colors in the same way that an X11 application allocates colors,
    and the X11 color allocation model is extremely complicated, especially when high-end
    graphics adapters and their accompanying X server extensions must be taken into
    account by a given application.


    Qt greatly simplifies the vast majority of the issues involved in selecting and
    displaying color elements—in most applications. Highly specialized programs geared
    toward the high-end graphics user will, of course, require a finer level of control
    than the Qt classes provide by default. That alone is a topic for an entire book.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '**QColor and QColorGroup** The QColor class provides an abstraction of color
    attributes. The class handles dynamic intelligent allocation and deallocation,
    and provides constructors for RGB or HSV color specification.


    Color groups are an encapsulation of the common set of color attributes that a
    widget is likely to use. If you want to change the default foreground color, background
    color, etc., of a widget, you will also need to read about QPalette.


    # A Possible Instantiation


    ```

    ```cpp

    QColor text( "blue" );

    QColor bgd( "#e0e0e0" );

    QColorGroup *lc = new QColorGroup();

    lc->setColor( QColorGroup::Foreground, text );

    lc->setColor( QColorGroup::Background, bgd );

    ```

    ```


    # Example Use


    ```

    ```cpp

    QLabel *l = new QLabel( "Color Label", this );

    QColor text( "blue" );

    QColor bgd( "#e0e0e0" );

    QColorGroup lc = l->palette().active();

    lc.setColor( QColorGroup::Foreground, text );

    lc.setColor( QColorGroup::Background, bgd );

    QPalette *pal = new QPalette( lc );

    l->setPalette( pal );

    ```

    ```


    **QPalette** QPalette encapsulates the QColorGroups that are used to represent
    different widget states: normal, disabled, and active.


    # A Possible Instantiation


    ```

    ```cpp

    QPalette *pal = new QPalette( QColor( "red" ) );

    ```

    ```


    # Example Use


    ```

    ```cpp

    QPalette pal( QColor( "red" ) );

    QPushButton *pb = new QPushButton( "Stop!", this );

    pb->setPalette( pal );

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# GRAPHIC IMAGE OUTPUT SUPPORT


    The following classes provide the necessary support for outputting graphic picture
    data to a widget that supports the use of QPainter, or to a graphics output device.


    # QBitmap


    The QBitmap class provides an off-screen, monochrome (single-bit depth) painting
    mechanism.


    # A Possible Instantiation


    ```

    ```

    QBitmap bm;

    ```

    ```


    # Example Use


    ```

    ```

    QBitmap bm;

    bm.load("arrow.xbm", "XBM");

    ```

    ```


    QBitmap''s uses include:


    +   - Cursors and cursor masks

    +   - Brushes

    +   - Widget masks


    Cursors and cursor masks are covered in the online reference documentation for
    QCursor. Brushes are discussed later in the chapter. An example of widget masking
    (an elliptical, 3D, animated pushbutton) can be found in the QBitmap directory,
    under the chapter-examples on the CD that comes with this book. I disapprove of
    “gimmicks” such as this, but it makes a good visual demonstration nonetheless.


    # QCursor


    QCursor is the encapsulation of mouse cursor attributes. Virtually any valid QBitmap
    can be used to create a new mouse cursor and sensible platform-dependent defaults
    are predefined.


    # A Possible Instantiation


    ```

    ```

    QCursor wait( QCursor::WaitCursor );

    ```

    ```


    # Example Use


    ```

    ```

    setCursor( QCursor( QCursor::WaitCursor ) );

    ```

    ```'
