    input, etc. An event is an asynchronous message that your application receives
    during normal processing of the Qt event loop. Qt provides default event loops
    in the QApplication::exec() and the QDialog::show() methods. These loops simply
    call the QApplication::processNextEvent() method repeatedly. As events occur,
    the underlying window system''s platform-dependent event parameters are translated
    to the appropriate Qt platform-independent event format and then passed to your
    application as a Qt event. Your application can make use of the default "reaction"
    to those events, or you can create custom event handlers to alter your application''s
    behavior.


    This section discusses the standard event types, what causes those events to occur,
    and a few possible modifications.


    # QChildEvent


    When you insert or remove a child object from a QObject, a QChildEvent is passed
    to the parent QObject. You must reimplement the QObject::childEvent( QChildEvent
    * ) method in order to make use of it.


