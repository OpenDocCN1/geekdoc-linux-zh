- pgno: 186
  md: "# # CHAPTER 7  \n## Qt Development Considerations\n\nThere is a great deal\
    \ more to application development than widgets positioned just-so and classes\
    \ that encapsulate an algorithm or programming concept with grace and style. Most\
    \ enterprise development projects are driven, at the front-end at least, by a\
    \ marketing specification that lists features and functions that must appear in\
    \ the product. That specification is frequently used to create a prototype. After\
    \ the marketing people “Oooo” and “Ahhh” over the prototype at innumerable dog-and-pony\
    \ shows (be thankful that programmers usually don’t have to attend these), a revised\
    \ marketing specification is generated.\n\nThere are usually two paths followed\
    \ from this part of the cycle; either a detailed specification is chiseled into\
    \ a stone tablet or a set of Microsoft PowerPoint presentation slides (I hate\
    \ these), or a repeated cycle of create, test, review and revise begins. This\
    \ latter approach is sometimes referred to as the “iterative approach” (named\
    \ for the numerous iterations projects evolve through) and is usually the most\
    \ productive. Either way, you’ll have a set of goals for the end product that\
    \ probably include international distribution criteria, target platform restrictions,\
    \ size and performance targets, all in addition to the functional requirements.\n\
    \nThe following subjects attempt to discuss some of these topics in a Qt-relevant\
    \ manner."
  merge: -1
  img_proc: true
- pgno: 187
  md: "# INTERNATIONALIZATION\n\nThere are many reasons to add internationalization\
    \ support (I18N) to a new or existing project. The project may have a written\
    \ requirement for support of U.S. English and Canadian French, or perhaps you\
    \ have foresee a future requirement for distribution in countries other than your\
    \ own. Whatever the reason, the Qt toolkit provides some I18N mechanisms that\
    \ are so easy to use it makes sense to implement an internationalized application\
    \ whether the specification calls for it or not, simply because it expands the\
    \ use-able audience for your application. Existing Qt applications can be retrofitted\
    \ to include I18N support with relatively little difficulty.\n\nYou’ve probably\
    \ seen examples of source code with embedded strings. These embedded strings can\
    \ take several different forms. For example, the following code fragments demonstrate\
    \ two very common methods of embedding a hard-coded string into an application:\n\
    \n```\n```cpp\n/* I’ve actually seen this error message:\n#define EMSG0001 \"\
    Bad treeout in do_rel_op\"\n\n    fprintf( stderr, \"%s\\n\", EMSG0001 );\n\n\
    \    QLabel *l = new QLabel( \"Enter Password:\", this );\n```\n```\n\nThese methods\
    \ of embedding strings in an application are very common. Conventional methods\
    \ of internationalizing code like this example are tedious and time-consuming.\
    \ The programmer must add calls to (platform-dependent!) translator methods, as\
    \ in the following code fragment:\n\n```\n```cpp\n/*** Set up for I18N support\
    \ ***/\nsetlocale( LC_ALL, \"\" );\nif (XSetLocaleLocale()) {\n    XSetLanguageProc(NULL,\
    \ (XtLanguageProc)myProc, NULL);\n}\nmsgCatalog = catopen( CATALOG_NAME, 0 );\n\
    char *msg = catmsg( S_HELLO, \"Hello World\" );\n```\n```\n\nAdding translation\
    \ support to an existing project can be more than time-consuming, it can be downright\
    \ discouraging, especially when schedules are being pushed back, deadlines are\
    \ being missed, and your marketing department is asking for hourly progress reports.\n\
    \nQt’s QOOObject and QApplication classes provide functions that simplify the\
    \ output translations portion of the internationalization effort, either at the\
    \ point of implementation"
