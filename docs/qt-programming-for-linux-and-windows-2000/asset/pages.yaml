  md: "# INPUT AND OUTPUT CLASSES\n\nEvery interactive application performs I/O. The\
    \ input could be from a keyboard, a mouse, a file or a network socket. The output\
    \ could be to a display widget, a file, or yet another network socket. Qt provides\
    \ a number of useful classes to help perform these normally platform-dependent\
    \ operations in a platform-independent manner.\n\n# QAccel\n\nThis class provides\
    \ handling for accelerator and shortcut keystrokes. Note that QAccel handles key\
    \ events for the top-level widget that contains the QAccel parent widget, and\
    \ for all children of that top-level widget.\n\n> *A Possible Instantiation*\n\
    \n```\n```\nQAccel *a = new QAccel( this );\n```\n```\n\n> *Example Use*\n\n```\n\
    ```\nQAccel* a = new QAccel( this );\na->connectItem( a->insertItem( ALT+Key_M\
    \ ),\n                this, SLOTS( toggleMenuBar() ) );\na->connectItem( a->insertItem(\
    \ ALT+Key_T ),\n                this, SLOTS( toggleToolBar() ) );\na->connectItem(\
    \ a->insertItem( ALT+Key_B ),\n                this, SLOTS( toggleStatusBar()\
    \ ) );\n```\n```\n\n# QAsyncIO\n\nQAsyncIO provides an abstract mechanism for\
    \ performing lengthy or slow I/O operations without blocking the user interface.\
    \ See QDataPump below.\n\n# QBuffer\n\nThis class provides buffered QByteArray\
    \ I/O functionality. You can use QBuffer’s internal QByteArray or provide your\
    \ own.\n\n> *A Possible Instantiation*\n\n```\n```\nQBuffer b();\n```\n```\n\n\
    > *Example Use*"
