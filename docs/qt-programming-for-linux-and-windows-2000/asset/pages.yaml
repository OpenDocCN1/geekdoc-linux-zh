- pgno: 191
  md: 'tion file and the version of the *findtr* utility that was used to generate
    it. It will also gener-

    ate the following entry:


    ```

    #: hello.cpp:15

    msgid "HiLabel::Hello World"

    msgstr ""

    ```


    The actual table entries are made up of a *msgid* and *msgstr* pair. You can easily
    identify the required translation from the *msgid* value, but don''t translate
    the entire text of the *msgid* value, as the scoping information (required by
    the *QApplication::translate()* method) is included. Assuming our target language
    is Spanish, the following fragment of *hello_sp.po* is a hand-edited Spanish translation
    for the example:


    ```

    #: hello.cpp:15

    msgid "HiLabel::Hello World"

    msgstr "Hola Mundo"

    ```


    We are now ready to create the platform-independent binary message file with the
    *msg2qm* utility.


    # **msg2qm UTILITY**


    Once you have used the *findtr* utility to create the baseline translation table
    and completed the task of translating all the strings, you are ready to create
    the platform-independent Qt message files for the target languages. This is done
    using the *msg2qm* utility that can be found under the *src/util* directory in
    the Qt distribution. For some bizarre reason, the de-fault Qt build process will
    compile the *findtr* utility (which you don''t need) and install it in the *bin*
    directory of the Qt distribution—but the *msg2qm* (which you *do* need) and *mergeqt*
    utilities must be explicitly compiled from their *source* directory, *src/util*.


    To create the Spanish message file for the preceding example, simply execute the
    utility as follows:


    ```

    msg2qm hello_sp.po hello_sp.qm

    ```


    The *msg2qm* utility converts the human readable translation file into an internal
    format that can be read more quickly. When you execute the example program, it
    will now display in Spanish.'
