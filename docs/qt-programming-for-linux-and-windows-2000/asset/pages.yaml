    **QStyle**


    QStyle encapsulates many common elements of a GUI look and feel. It isn’t always
    possible (or sensible) to capture all the elements that make a GUI appear the
    way it does, but many of the visual elements are common. A pushbutton has a frame
    or border, and that frame or border may change when the user clicks it with a
    mouse. It is these common elements that QStyle captures.


    Many of the Qt widgets use their inherited style to present their visual appearance
    to the user, so it is relatively easy to change the overall appearance of your
    applications by changing the QStyle that the widgets inherit.


    Qt provides four predefined styles for you use:


    +   - QCDEStyle captures many elements of the CDE interface.

    +   - QMotifStyle provides a Motif look and feel.

    +   - QPlatinumStyle provides a very different appearance that is not *too* awful.

    +   - QWindowsStyle encapsulates the Windows 9x or NT4 look and feel.


    It is not very difficult to create a new style, but making the new style attractive
    and intuitive requires a considerable time investment.


