    Qt objects (except for those that explicitly operate on char \* values) accept
    QString arguments, an internationalized application should experience no performance
    hit as a direct result of having added I18N support.


    Always use QString objects to store all user-visible text. QString stores its
    text as Unicode text internally and can therefore handle virtually any encoding
    currently in use. It is easy to use, and it provides shared string storage, automatic
    storage, and more. Examples:


    ```

    QString *s = new QString( tr("Last Name:") );

    ```


