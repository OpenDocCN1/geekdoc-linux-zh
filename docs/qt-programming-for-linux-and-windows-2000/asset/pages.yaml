- pgno: 210
  md: 'will usually show you where it detected a problem, but won’t necessarily give
    you any information about why it occurred.


    +   - SIGIOT—The stdder message, “illegal instruction—core dumped” will be displayed.
    Your application has corrupted its own “text” segment—the memory segment assigned
    to the executing code of this application has been overwritten with instructions
    that are illegal or that make no sense. This error is almost always caused by
    an array overrun condition. These defects are often difficult to analyze and correct.


    +   - SIGBUS—A stder message “bus error—core dumped” is displayed. A method within
    your application has exhausted its available stack segment. This is almost always
    caused by runaway recursion—a method has called itself too many times—and each
    time, the method’s arguments (or just the return address) may be pushed onto the
    stack. Eventually, the software will exceed its quota, or available resources
    will be exhausted. These defects are usually easy to locate because there should
    be very few methods in your application that call themselves.


    # Dr. Watson (Windows only)


    NT-based operating systems (this includes Windows 2000) and Windows 98 systems
    with the *Resource Toolkit* installed have a software fault logging agent called
    Dr. Watson (presumably named for the fictional character in Sir Arthur Conan Doyle’s
    Sherlock Holmes stories). It will gather and log information pertaining to software
    faults and the state of the computer at the time the fault occurred. Dr. Watson
    can generate scripts that a debugger (or other application) can parse to retrieve
    the details it has logged. Dr. Watson can also take a “snapshot” of the current
    state of the system as long as Windows is not actually “hung”—a condition where
    all application and system software is completely unresponsive—a condition that
    many Windows users surprisingly accept as normal. Go figure.


    Dr. Watson does not start in the default (as installed) startup configuration,
    and usually has to be started manually or by adding a shortcut to the “Startup”
    folder. To start Dr. Watson manually, select the Start menu, click on “Run” and
    type in “drwatson” and hit the Enter key (or click OK). Starting Dr. Watson from
    the “System Information” tool will give you the opportunity to configure the locations
    for the various files it will create, and various other parameters such as the
    number of previous instructions executed prior to the fault.


    # Using A Debugger


    It’s beyond the scope of this (or any) book to teach the reader how to use every
    debugger, so I’ll stick to very generalized terms and procedures. Your debugger
    should have plenty of documentation that explains how to perform these procedures.


    If you can easily reproduce a software defect, and the defect causes abnormal
    termination of the software, you can save yourself some time by recompiling the
    software with the compiler’s debugging option(s) enabled. Next, start your debugger
    and load/execute the software. When you reproduce the defect, a stack trace should
    clearly indicate'
