- pgno: 64
  md: "The parent/child relationship rule is simple: A QWidget that has no parent\
    \ is a *top-level* widget (usually with a window manager border, title bar, etc.),\
    \ and all QWidgets that have this top-level widget as a parent are children of\
    \ that widget.\n\nQApplication maintains a list of the top-level widgets in your\
    \ application, and these top-level widgets maintain the list(s) of their children.\
    \ If you delete a widget, its destructor will first delete all its children. (The\
    \ symbiosis is nearly perfect. You will spot the occasional memory leak but they\
    \ are always very small and nonpropagating.)\n\nThe geometry of a Qt widget is\
    \ constrained by the geometry of its parent. Creating a 300 by 200 pixel list\
    \ view as a child of a 50 by 50 frame widget will not appear as you intended.\n\
    \nThe following example will help to illustrate the parent/child relationship.\n\
    \n```\nNewWidget.h\n\n```c++\n#ifndef _NEWWIDGET_H\n#define _NEWWIDGET_H\n\n#include\
    \ <qlabel.h>\n#include <qlayout.h>\n#include <qstring.h>\n\n// A subclass of QWidget\n\
