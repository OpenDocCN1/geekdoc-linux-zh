    # Parent/Child Relationship


    QWidget maintains a list of its child widgets (accessible via the QWidget::children(
    ) method). A child of a given widget is a new widget whose parent widget (passed
    as the first argument to the constructor) is the given widget. The default QWidget
    destructor will delete all of its children before it deletes itself. All you need
    to do to delete a chain of widgets is delete the parent.'
