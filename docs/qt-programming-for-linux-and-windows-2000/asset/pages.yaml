    # QT LICENSING


    Unfortunately, Qt licensing is not currently available from software resellers.
    The only way to obtain a Qt license is directly from `Trolltech`, via the Web,
    fax, postal mail, etc. The software can be obtained from the Troll Web site, and
    the Qt Free Edition is frequently bundled with other software distributions for
    Linux. The Qt Free Edition is also available on the CD that comes with this book.
    The reader is encouraged to check the Troll Web site, as the newer versions and
    enhancements are always nice to have.


    Troll provides time-limited evaluation copies of Qt and two forms of toolkit licensing,
    Qt Professional Edition, and The Qt Free Edition. The QPL, or Q Public License,
    governs the Qt Free Edition. QPL qualifies as an OpenSource license and provides
    a generous degree of freedom to the OpenSource developer. The QPL is also very
    easy to understand—a refreshing alternative to most end-user licensing. QPL also
    grants the right to use the QPL itself for your own software as long as the terms
    of the QPL are preserved.


    The QPL Version 1.0, which governs your use of the Qt Free Edition, permits you
    to develop applications with Qt and to distribute those applications with the
    following (and other) related constraints:


    +   • You can charge a fee for your software.

    +   • The source code for your application must be made available to anyone who
    wants it, without charge, except to recover distribution costs.

    +   • You must permit users of your application to redistribute your application
    and its source code without any charges, to whomever they choose.

    +   • If your application is not generally available and a representative of Troll
    asks for a copy, you must provide it, free of charge.

    +   • You are not entitled to product support—Qt Free Edition is available “as-is.”

    +   • You won’t be able to develop Native Microsoft Windows applications.


    The QPL also governs redistribution of the Qt Free Edition and derived works,
    such as patches, bug-fixes, and enhancements. It also grants the right to distribute
    binary compilations of Qt and/or modifications, such as shared or static libraries.
    Just make sure you don’t modify any of Troll’s copyright notice information.


    The Qt Professional License removes the constraints for software that you develop,
    and adds an excellent e-mail-based technical support system. Professional licensing
    is available in three types: UNIX-only, Microsoft Windows-only, and the “Duo-Pack,”
    which is a Professional License for both UNIX and Windows. The latter two provide'
