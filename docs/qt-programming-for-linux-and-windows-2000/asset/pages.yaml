    This example introduces four new objects and four new (but related) concepts.
    First to appear is the QString object. QString is the Troll encapsulation of the
    string concept. It provides, among many things, "safe" string storage, UNICODE
    or ASCII string interpretation, searching, tokenizing, etc. Next to make the scene
    is the QLineEdit object. This is the standard "textfield" object for Qt and permits
    the user to enter and edit a single line of text. QPushButtons are what you most
    likely suspect they are—pushbuttons with a text or picture label. QLayouts help
    manage the overall layout of an interface.


    The four new concepts introduced in the example are the Q_OBJECT line at the top
    of the class definition, the "slot" keywords in the middle of the class definition,
    the connect() call at the end of the constructor, and the last line, which includes
    a mysterious, nonexistent file, cui.moc. These four are all related to Qt''s signal/slot
    mechanism.


    Qt provides a relatively unique mechanism for connecting one object''s behavior
    to another. The trolls call this the signal/slot mechanism, and it is used extensively
    throughout Qt and derived works. This mechanism is discussed in detail in the
    following chapter, so for now just pretend that it''s not important but is somehow
    related to the four strange references in the example. There are two simple rules
    that cover virtually any Qt coding situation:


    +   - If your class will emit or accept signals (via slots), the class definition
    must contain the term Q_OBJECT at the top.

    +   - Any source file containing the term Q_OBJECT will need to be "meta-compiled"
    with the meta compiler, "moc," which is provided as part of the Qt toolkit. This
    meta-code must then be compiled by the platform compiler and linked with the final
    binary.


    To support the use of the Qt signal/slot mechanism, there is an extra step involved
    in compiling this example. You must preprocess the source file using a Qt-supplied
    tool to produce the additional code that will support the signals and slots. The
    new step is the same for Linux or Windows and looks like:


    ```

    ```text

    moc Cui.cpp -o cui.moc

    ```

    ```


    The moc program is created during the Qt build and should be located in $QTD1R/bin/moc
    under Linux, or %QTD1R%\bin\moc.exe on Windows systems. It is a good idea, for
    either platform, to add this directory to the PATH environment variable.


    For those who are using a VC++ project to enter the examples, I''ve found it most
    convenient to add a "Custom-Build Step" to the source file. Specifying something
    like:


    ```

    ```text

    moc $(InputDir)\\file.cpp -o $(InputDir)\\file.moc

    ```

