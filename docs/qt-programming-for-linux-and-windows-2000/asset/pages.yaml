  md: 'Here are the basic concepts that you should acquaint yourself with before going
    any further:


    +   * QApplication—the Qt application startup class handles most of the platform-specific
    initialization procedures.

    +   * Qt uses a signal/slot model of message passing instead of the callback approach
    used by the X Toolkit (the basis for Motif) or the Microsoft Foundation Class
    Library.

    +   * QObject—inherited by any Qt class that sends signals or provides slots,
    the QObject is the basis for nearly every Qt class. This is very short and easy
    to digest but extremely important because it is the base CLASS of most Qt classes.

    +   * QWidget—inherited by all the Qt widgets, QWidget provides most of the consistent
    features and functionality of the Qt widgets.


    # QAPPLICATION CLASS


    For any given Qt application you create that uses any visual components, or processes
    input or events of *any* kind, you must create one (*and only one*) instance of
    the QApplication class, and you must create this one instance before you create
    other interface components. The toolkit will warn you if you attempt to create
    more than one instance of QApplication. It is QApplication that performs all the
    tedious initialization of the underlying, platform-dependent graphics and event
    notification functionality. Global desktop preferences such as default font, font
    properties, window colors, and mouse behavior are all copied to the Qt application’s
    space, so your Qt application will appear as you user expects, despite the varying
    desktop themes. QApplication provides the event dispatch loop that allows your
    application to receive events from the underlying window manager.


    If Qt was *not* compiled with the **QT_NOD EBUG** flag defined, the following
    debugging options are available:


    +   * -nograb: Qt must never grab the mouse or keyboard focus.

    +   * -dgrab: This is the counterpart to the -nograb option, and permits your
    Qt application to grab mouse or keyboard focus. This is sometimes necessary when
    executing your Qt application within a debugger. This option is only meaningful
    on X11 platforms.

    +   * -sync: Normally, an X11 application will queue requests to the X server—they
    are buffered and serviced in FIFO order. This flag disables that normal buffering
    for the target application. This can be very useful for initial debugging, but
    you are warned that your application’s performance will be extremely poor. This
    option is only meaningful on X11 platforms.


    All Qt applications understand the following arguments:'
