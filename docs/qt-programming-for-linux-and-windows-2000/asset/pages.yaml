- pgno: 68
  md: '# Widget Type Flags


    The type flag influences how the window is treated by the application and the
    underlying window system.


    +   - **WType_TopLevel**—sets this widget to be a top-level widget, implying that
    it will have window manager decorations, a border, etc.

    +   - **WType_Modal**—indicates that this is an application-modal top-level widget.
    No other top-level widget in the application can receive input until this widget
    is closed. This widget type also implies a style of `WStyle_Dialog`.

    +   - **WType_Popup**—sets this widget to be an application-modal top-level widget
    with a style appropriate for popup menus.

    +   - **WType_Desktop**—indicates that this is the window system desktop. See
    the `WPaintDesktop` modifier flag below.


    # Widget Style Flags


    The style flag determines what window decorations the window manager will add
    to the widget, i.e., borders, resize gadgets, etc.


    +   - **WStyle_Customize**—provides no window decorations, icon (system menu),
    title bar (caption), buttons (minimize, maximize, and close), or resize gadgets.
    It implies that you will set all of the style hints using `WStyle_XXX` widget
    flags. This is useful for itself for splash screens.

    +   - **WStyle_NormalBorder**—provides the standard window decorations, icon,
    title bar, buttons, and resize gadgets. You can''t combine this flag with `WStyle_DialogBorder`
    or `WStyle_NoBorder`.

    +   - **WStyle_DialogBorder**—provides a title bar, icon, and a close button.
    This flag can''t be combined with `WStyle_NormalBorder` or `WStyle_NoBorder`.

    +   - **WStyle_NoBorder**—provides a normal window without the decorations. This
    flag can''t be combined with `WStyle_NormalBorder` or `WStyle_DialogBorder`.

    +   - **WStyle_Title**—provides a title bar.

    +   - **WStyle_SysMenu**—provides a system menu icon.

    +   - **WStyle_Minimize**—provides a minimize button.

    +   - **WStyle_Maximize**—provides a maximize button.

    +   - **WStyle_MinMax**—provides both a minimize and a maximize button.

    +   - **WStyle_Tool**—provides a title bar and a close button.

    +   - **WStyle_StayOnTop**—causes the window to remain on top of other windows.

    +   - **WStyle_Dialog**—provides an appearance appropriate for dialog boxes. It
    has a title bar, an icon, and a close button. This flag will prevent the creation
    of an additional icon on the system taskbar, and the dialog will (usually—it depends
    on the underlying window system) minimize along with the parent.

    +   - **WStyle_ContextHelp**—adds a context-sensitive help button.'
