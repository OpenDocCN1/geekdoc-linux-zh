    # LISTS, TABLES, AND LIST ITEMS


    Many applications (not all) require the display of, or selection from, a list
    of items. When the list is static (never changes), it is sometimes best to provide
    an array of checkboxes, pushbuttons, toggle buttons, and so on. When the list
    is dynamic, subject to frequent or infrequent change, or when the list is large,
    it usually makes more sense to provide a scrolling list of these items and let
    the user pick the ones to use.


    Every serious toolkit provides a list box, and so does Qt. The Qt lists are a
    bit faster, a little more efficient, and the class methods make a lot more sense.
    Other than that, you will notice very little difference in appearance or behavior
    from MFC, Motif, Lesstif, and others.


    **QHeader** QHeader (Fig. 3.17) provides a heading for tables, such as those provided
    by the QListVstView widget. They allow the end-user to rearrange columns, resize
    columns of tabular data, or toggle the sorting order.


