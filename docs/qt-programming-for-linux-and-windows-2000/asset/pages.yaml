    # QT PORTABILITY


    If you need to concern yourself with issues of portability between UNIX and Windows
    platforms—and only the myopic developers will exclude themselves from that classifica-tion—you
    will delight in the features Qt provides to implement cross-platform solutions.
    Using the Qt toolkit, it is very easy to create complex and elegant applications
    that need only be recompiled on the target platform. There are several other toolkits
    that offer that degree of portability, but the price is usually in the performance.
    Qt applications will typi-cally outperform applications written for these other
    toolkits on any given platform, with-out sacrificing any of its substantial aesthetic
    benefits.


    To this purpose, the toolkit will *help* break down the barriers that exist between
    Windows and UNIX platforms, but there are, and will always be, certain platform-dependent
    hurdles that no toolkit will leap without a few nudges from a platform-savvy programmer.
    Issues regarding OS-dependent low-level I/O, proprietary protocols, and the like,
    are not directly handled by the Qt toolkit but there are several basic frameworks
    to help support your task, should you need to address those issues.


    Interfacing Qt with other platform services can be accomplished with relative
    ease. This is more obvious in a Linux or UNIX environment than it is in a Windows
    environment, but this book will cover enough of this topic in later chapters that
    the reader should feel comfortable when facing any routine task in either environment.
    All the examples provided in this book should compile and run equally well on
    any of the platforms supported by Qt, except when explicitly described as being
    platform-dependent (as some of the Windows 2000-only examples are—they will still
    compile, just don’t expect them to *do much*).


