  md: '# SUMMARY


    In this chapter, I glossed over the Qt widgets that are primarily intended to
    provide output mechanisms for your applications. The widgets provided are adequate
    by themselves for most applications. With a minimum of work, they can be combined
    or enhanced to provide most functionality you''re likely to require.


    Trolltech pulled some of the output-only widgets just prior to the 2.1 release.
    This was done to alleviate some of the creeping-bloat and its associated buginess
    that had begun to appear in the toolkit snapshot releases. The most exciting of
    these objects is the QCanvas widgets that manage animated sprites. I hope these
    will reappear in a future release.'
