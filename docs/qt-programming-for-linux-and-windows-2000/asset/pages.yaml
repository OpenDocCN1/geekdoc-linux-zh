  md: '![](img/64220583cb3d8a303f33ac97f5433b04_37_0.png)


    For nearly every Qt object, there is a suitably named header file that will provide
    all the definitions needed to use that object. In the example above, we make use
    of two objects, QApplication and QLabel, which are supported by the respective
    header files, qapplication.h and qlabel.h. Most of Qt''s classes are supported
    by header files that are named in a similar and sensible manner.


    The QApplication class is required for any Qt application that makes use of events
    or visuals, but not for Qt applications that only use QString, the container classes,
    and so on. There can and *must* be only one instance of this class in visual or
    event-driven applications. The QApplication class is covered in some detail further
    on in this chapter, but for now just assume that QApplication takes care of all
    the underlying, platform-specific startup and initialization details.


    The example creates an instance of QApplication on the heap and passes the command-line
    arguments. It then creates a QLabel instance on the heap and sets the label text
    to the argument string. We then tell the QApplication object that the QLabel is
    the *widget* that QApplication will manage. Next, we tell the QLabel to display
    itself. Finally, we pass control to the QApplication event-loop.


    If your development background is primarily with Microsoft Windows, you''re probably
    wondering “What''s a widget?” The word *widget* is slang for Window Gadget, and
    dates to the X Window System''s X Toolkit (Xt) and Athena Widget (Xaw) libraries.
    I''ve heard some claim that it comes from Motif, based on Xt and Xlib, but Motif
    came along after the Athena Widgets were already popular. All three of these toolkits
    are pseudo-object-oriented C language code that many GUI programmers began their
    GUI development careers with. You will frequently hear Qt people bantering *their*
    and *yon* about this *widget* or that *widget*. In Qt circles, they are likely
    referring to visual components of Qt or a derived work. If you substitute the
    term “control” for “widget,” their conversations will make more sense.


    If you''re an experienced Windows or Motif programmer, you''re probably surprised
    at the simplicity of the example—but I assure you, it''s only the first of many
    advantages that Qt offers. Now, let''s try an example that has potential for real-world
    application. The following example could be used as a basic contact-list database
    interface. For now, we won''t worry about saving the data it produces, as this
    is only an exercise in creating the user-interface, nor will we concern ourselves
    with providing for a formal, multi-line address.


    # ## CONTACT LIST INTERFACE EXAMPLE


    Hello world examples are a good way to demonstrate an easy first application,
    but they don''t really do anything useful. A toolkit that makes useless applications
    easy to create is about as useful as those same applications. Fortunately, Qt
    can produce very useful'
  merge: -1
