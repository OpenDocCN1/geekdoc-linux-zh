- pgno: 153
  md: '# QDataPump


    A QDataPump moves data from a QDataSource to a QDataSink during normal event processing
    (interleaved) by examining the QDataSource::readyToSend() and QDataSink::readyToReceive()
    methods of its arguments, and responding to the asyncIO::activate() signals of
    the QDataSource and QDataSink. QDataPump is used by the Qt toolkit to asynchronously
    “feed” animated image data to QMovie objects.


    # QDataSink


    QDataSink is an asynchronous consumer of data. It is normally used with a QDataPump
    and a QDataSource to move asynchronous data from point A to point B. See QDataPump
    above and QDataSource below.


    # QDataSource


    QDataSource is an asynchronous producer of data and will typically be used with
    a QDataPump and a QDataSink to read asynchronous data from an ASIC port or a network
    socket. See QDataPump above.


    # QDir


    QDir encapsulates the concept of a filesystem directory (on Windows systems, these
    are frequently called “folders”) in a platform-independent manner.


    # A Possible Instantiation


    ```

    ```cpp

    QDir d( "/etc/cpp" );

    ```

    ```


    # Example Use


    ```

    ```cpp

    QDir d( "/etc/ppp" );

    QFile f( d.filePath( "options" ) );

    if( f.open( IO_ReadWrite ) == true ){

    // Modify PPP options

    }else{

    QMessageBox::warning( 0, "Whoops!",

    "Can''t open /etc/ppp/options..." );

    }

    ```

