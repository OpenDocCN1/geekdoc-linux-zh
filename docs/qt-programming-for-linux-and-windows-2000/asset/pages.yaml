- pgno: 16
  md: "# Foreword\n\nIn the summer of 1991, I sat together with Haavard Nord on a\
    \ park bench in Trondheim, Norway. We were both working on the same medical database\
    \ project at the Regional Hospital in Trondheim. We were discussing how to proceed\
    \ with the user interface when Haavard said, \"We need an object-oriented display\
    \ system.\"\n\nA year later I had made a C++ GUI toolkit because of that statement.\
    \ After another year the company I had made it for (and was then working for)\
    \ decided to scrap it for Motif. I thought they were crazy. Haavard called me\
    \ up one night and said, \"Let's build a new and better toolkit from scratch.\
    \ Quit your job and start a company together with me.\"\n\nHaavard first did his\
    \ thesis on making the first Qt kernel. Then, for a year, we hacked day and night\
    \ in a small office and lived off our wives. We had the luxury of working undisturbed.\
    \ Qt gradually took form, we polished the details, designed and re-designed until\
    \ things just felt right (a design rule Trolltech still follows). We then got\
    \ a small consultancy contract where we used our still quite primitive version\
    \ 0.60 of Qt, hired Arnt Gulbrandsen for a ridiculously low salary, and the snowball\
    \ started rolling.\n\nI had never imagined that one day I would write a foreword\
    \ for a book about Qt from Prentice Hall. Many of our dreams have come true, and\
    \ this is another one of them.\n\nI have had the pleasure of meeting Patric Ward,\
    \ the author of this book. In addition to being a mighty fine Qt hacker, he is\
    \ also a very nice guy with a good sense of humor. I think that's a perfect combination\
    \ for writing a book like this one. Now sit back and enjoy the wonders of Qt,\
    \ as narrated by Patric Ward. The word is yours, Pat.\n\nEirik Eng, \nPresident,\
    \ Trolltech AS"
  merge: -1
  img_proc: true
