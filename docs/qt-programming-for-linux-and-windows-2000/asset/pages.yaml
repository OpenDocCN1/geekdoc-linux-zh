    The layout direction, horizontal or vertical, is determined at the point of instantiation,
    via the Direction argument to the constructor. You will note (perhaps with a bit
    of disappointment) that this value can be interrogated after instantiation, but
    cannot be changed.


    As widgets (or other layouts) are added to the QBoxLayout, a cell is created within
    the layout to manage its geometry. It’s important to provide appropriate minimumSize()
    and maximumSize() methods for widgets you add. This will prevent the layout from
    resizing your widget to an inappropriate value. While most widgets you add will
    provide this automatically, you will undoubtedly run into at least one instance
    where the widget does not size correctly.


    QBoxLayouts have two margin values associated with them. The first is the margin
    between the layout itself and surrounding objects, and is referred to as the border
    width. The second is the margin between each cell of the layout itself, and is
    referred to as the intra widget width. These margins are set via arguments to
    the constructor.


    A term you need to be familiar with regarding QLayouts is stretch. The stretch
    of a given cell determines how that cell will resize, relative to other cells
    in the layout. As an example, consider the extremely common scenario in which
    you create several, vertically arranged pairs of labels and text fields. You probably
    want the text fields to resize more than their accompanying labels. You may not
    want the labels to resize at all, but that usually produces an undesirable “cramped”
    appearance. The following code fragment demonstrates a possible approach that
    will cause the labels to align with their text fields and horizontally resize
    in a manner that creates an overall spaciousness as the width is increased:


