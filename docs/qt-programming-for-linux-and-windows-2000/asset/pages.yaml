  md: '# CHAPTER 5


    # Qt Convenience Objects


    No useful application was ever created from visual code alone. The following pages
    attempt to organize descriptions of those Qt classes that provide no direct user
    interaction, or are provided for convenience’s sake. The organization appears
    as follows:


    +   - Event handling classes and parameters

    +   - Input/Output related classes

    +   - Collection, array, and linked-list classes

    +   - Text and internationalization classes


    As in the previous chapter, these descriptions are not intended to provide a reference
    to the various classes and parameters—they are more than adequately documented
    by the Qt online reference material and examples. This is intended as a possible
    “shopping list” of available Qt functionality, and nothing more.


    # EVENTS AND EVENT PARAMETERS


    Since Qt always uses the underlying window system’s mechanisms for receiving input
    or using timers and other such event-generating phenomena, and because all the
    supported window systems are event-driven, Qt is also event-driven and relies
    on the parameters'
