    The above call to QOoBject: tr() is where the actual translation takes place.
    A translation table file that contains an appropriate translation from our U.S.
    English example is still required and will be loaded at runtime by the QTranslator
    instance created in main(). Three utilities are provided by Qt to assist in creating
    the translation table files. These are findtr, msg2qm, and merger. The .po translation
    files can be created by hand, but it''s much easier to use the utilities. Each
    is discussed below.


    # findtr UTILITY


    The findtr program (actually a Perl script) can locate all calls to tr( const
    char * ) within the named input files and will generate a text table that can
    be hand-edited to include the string translations. Typically, you will create
    a single translation file using a syntax something like:


    ```

    findtr hello.cpp > hello_sp.po

    ```


    This creates a baseline translation file that can be copied to sensibly-named
    files for each of the target languages (e.g., hello_sp.po for a Spanish file).
    Using the hello program above, findtr will generate some header information which
    helps to identify the transla-'
