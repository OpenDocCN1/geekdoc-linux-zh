    MyEdit::MyEdit( QWidget *p, const char *n )\n:QLineEdit(p, n )\n{\n}\n```\n\n\
    ```cpp\nvoid\nMyEdit::copy2clip()\n{\n    copy();\n}\n```\n\n```cpp\n// We'll\
