  md: "# TOOLTIPS AND WHAT’S THIS SUPPORT\n\nThe more help you provide the end-user,\
    \ the fewer support calls you’re likely to get from users who were confused. Qt\
    \ provides two forms of direct end-user help in the forms of per-widget popup\
    \ help called tooltips, and a more formal popup help called What’s This?. Tooltip\
    \ help will pop up when the mouse hovers over a widget to which you assign a help\
    \ message, while What’s This help usually requires a trigger widget such as a\
    \ toolbutton or a popup menu item to display the help.\n\nQToolTip A tooltip is\
    \ a popup window that displays very simple (usually a single, short line) help\
    \ for any widget.\n\n# *A Possible Instantiation*\n\n```\nQPushButton *pb = new\
    \ QPushButton( \"Exit\", this );\nconnect( pb, SIGNAL(clicked()), qApp, SLOT(quit())\
    \ );\nQToolTip::add( pb, \"Exit this application.\" );\n```\n\nQToolTipGroup QToolTipGroups\
    \ tie the popup tooltip for a widget to an optional (possibly different) tooltip\
    \ that can be displayed in the status bar or some other widget. This is most commonly\
    \ seen in QToolButton widgets constructed using a group text argument that displays\
    \ in a status bar.\n\n# *A Possible Instantiation*\n\n```\nQToolTipGroup *tg =\
    \ new QToolTipGroup( this );\n```\n\n# *Example Use*\n\n```\nQPushButton *pb =\
    \ new QPushButton( \"OK\", this );\nQToolTipGroup *tg = new QToolTipGroup( this\
    \ );\nQLabel *helpline = new QLabel( this );\n\nconnect( tg, SIGNAL(showTip(const\
    \ QString &)),\n        helpline, SLOT(setText(const QString &)) );\nconnect(\
    \ tg, SIGNAL(removeTip()),\n        helpline, SLOT(clear()) );\nQTooltips::add(\
    \ pb, \"OK\", tg, \"Press this button to proceed.\" );\n```"
