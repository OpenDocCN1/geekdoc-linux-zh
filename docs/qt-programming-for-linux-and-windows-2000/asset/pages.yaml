    # SCROLLING


    Just like all other GUI toolkits, Qt provides scrollbars. They''re easier to use
    than other toolkit implementations.


    QScrollBar Scrollbars (Fig. 3.31) are common graphic widgets that permit a user
    to scroll or pan a clipped view of a potentially very large visual component.
    The QScrollBar widget provides a feature-rich implementation.


    ![](img/64220583cb3d8a303f33ac97f5433b04_124_0.png)


    **Figure 3.31** QLineEdit widget with vertical and horizontal QScrollBar widgets'
