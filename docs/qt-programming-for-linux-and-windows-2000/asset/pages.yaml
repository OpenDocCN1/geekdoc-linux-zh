- pgno: 150
  md: '# **QKeyEvent**


    Any time a QWidget has the keyboard focus, it is eligible to receive QKeyEvent
    s. This class provides the basic information needed to process most keystrokes,
    and can be easily tailored to provide additional information. The default QWidget
    implementation provides event handlers for keyPressEvent() and keyReleaseEvent().


    # **QMouseEvent**


    Surprisingly, the QMouseEvent class is the parameter that describes mouse events.
    The QWidget class provides handlers for mousePressEvent(), mouseReleaseEvent(),
    mouseDoubleClickEvent(), and mouseMoveEvent().


    # **QMoveEvent**


    When a widget is moved (relative to its parent) it receives a QMoveEvent. You
    can make use of the event by reimplementing the QWidget::moveEvent( QMoveEvent
    * ) method.


    # **QPaintEvent**


    Motif programmers will recognize this as an *expose* event. The event is generated
    when a widget needs to redraw itself. You can use QPaintEvent::rect() to obtain
    the QRect that represents the area that needs to be repainted.


    # **QResizeEvent**


    When a widget is resized, it receives a QResizeEvent via its QWidget::resizeEvent()
    method.


    # **QShowEvent**


    Show events can be generated by the underlying window system (external show events)
    or when the QWidget::show() method is called (internal show events), and are handled
    by the widget''s showEvent() method. In the case of internal show events, the
    event is received *before* the widget is made visible.


    # **QTimerEvent**


    QTimerEvent describes a timer event as received by QObject::timerEvent() whenever
    the QObject has activated one or more timers. Currently, the only useful value
    is the timer ID of the particular timer that triggered this event. See the QTimer
    documentation.


    # **QWheelEvent**


    QWheelEvents are generated when the mouse wheel is rotated while the widget has
    focus. A special accept() method is provided by QWheelEvent to allow you to prevent
    the parent widget from receiving the same event.'
