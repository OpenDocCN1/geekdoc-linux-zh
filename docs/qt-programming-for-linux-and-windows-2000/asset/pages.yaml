- pgno: 170
  md: 'QListIterator is an iterator for QList collections.


    # QMap


    QMap is a template class that provides collections and dictionary lookup. The
    most significant difference between QMap and QList or QDict is that QMap is value-based.
    It maintains discrete copies of its collection. QList and QDict are reference-based.


    # QMapConstIterator


    QMapConstIterator is one of two iterators for QMap collections. As the name “const”
    implies, iterating a QMap collection using this class will not permit the collection
    values to be modified.


    # QMapIterator


    QMapIterator is one of two iterators for QMap collections. Also see QMapConstIterator.


    # QPtrDict


    QPtrDict provides a dictionary based on void pointer keys.


    # QPtrDictIterator


    This class provides an iterator for QPtrDict collections.


    # QQueue


    This template class implements a first-in, first-out (FIFO) queue. See QStack
    for LIFO behavior.


    # QSortedList


    This is a subclass of QList that provides the extra functionality needed for sorting,
    based on operators < and =.


    # QStack


    QStack is a reference-based template class that provides a last-in, first-out
    (LIFO) stack. See QQueue for FIFO behavior. See QValueStack for a value-based
    implementation.'
