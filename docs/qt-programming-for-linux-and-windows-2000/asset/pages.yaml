- pgno: 24
  md: '# # CHAPTER 1


    # # Introduction to Qt


    Qt (commonly pronounced cute) is a C++ class library and GUI toolkit that provides
    the basic set of services needed for most common application development on Linux
    (or nearly any UNIX) platforms and Microsoft Windows 2000 (and all its ancestors,
    back to Windows 95). Qt is the product of Trolltech AS (hereafter referred to
    as Troll, Trolltech, or more informally as “the Trolls”). Trolltech AS is a Norwegian
    company based in Oslo, Norway, founded in 1994 by Eirik Eng and Haavard Nord.


    This chapter will introduce you to the toolkit and some of the common programming
    issues that Qt helps to eliminate.


    The application development services provided by the Qt toolkit include:


    +   - A full complement of GUI widgets (often referred to as “controls” in the
    Windows community)

    +   - A comprehensive set of file and filesystem manipulation tools

    +   - Classes for manipulating images, arrays, and internationalized text

    +   - Collection classes and template classes


    This is to name but a few. All these classes are either functionally complete
    and platform-independent or are provided to ease transition between the target
    platforms the toolkit supports.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Chapter 1 Introduction to Qt


    Qt has rapidly grown in popularity since the K Desktop Environment (KDE) team
    chose Qt as its base toolkit in 1996 (though the Qt story dates back to 1991).
    KDE was (in the author''s opinion) the first graphical desktop environment for
    Linux of a truly Enterprise-Quality nature. Other UNIX users had CDE, OpenWindows,
    VUE, and others, while the Linux users had only fancy window managers. Qt provided
    the look-and-feel and basic GUI framework, while KDE provided an integrated desktop
    environment. Application software could be rapidly developed, deployed, and integrated
    into the end-user''s desktop.


    Until Qt came along, writing software for both UNIX and Windows platforms usually
    required two development efforts and, usually, two development teams. Let''s take
    a minute to explore some of the reasoning for this:


    UNIX programmers often view the PC (and Windows) as a toy, unworthy of serious
    programmer attention. These programmers sometimes view the popularity of the Windows
    software phenomenon as a symptom of intellectual or technical decay within the
    user base. Many UNIX programmers refuse to acknowledge Windows software as anything
    more than "software for the point-n-drool masses," and flatly refuse to take any
    part in development of Windows software. With an attitude such as this (and it''s
    not all uncommon), and with the coding style of traditional Windows software that
    is so different from UNIX coding styles, plus the nearly complete nonportability
    of the code between UNIX and Windows platforms, you have a stalemate.


    Windows programmers, on the other hand, usually consider UNIX programming as unnecessarily
    cryptic, complex, and confusing in terms of coding style. The availability of
    tools to ease the coding effort is poor (at best) and many Windows programmers
    detest command-line programming—especially the use of the standard editor, vi.
    Again, we have a stalemate.


    UNIX programmers often refuse to write Windows code and Windows programmers often
    can''t, or won''t, write UNIX code. The solution of most organizations is usually
    to hire two programming teams and provide them with their preferred development
    environment—even when both teams are writing code in the same language. This approach
    more than doubles the costs of a typical development effort. It increases the
    risk of project failure by increasing the probability of encountering issues that
    cannot be resolved to the mutual satisfaction of both teams (lots of deadlines
    are missed because of this, and many projects are scrapped in their infancy as
    a result). In fact, the double-team solution increases the workload of every member
    of the project team—from the person who empties the wastebaskets to the person
    who processes medical claims.


    Qt addresses nearly all the issues of inconsistent UNIX GUI toolkits and cross-platform
    development without sacrificing anything. Does this sound ideal? It isn''t, but
    it comes much closer than any toolkit that preceded it, and newer releases are
    closer still. After all, "ideal" is a purely subjective term.


    Qt has its share of shortcomings, and this book will make note of some of them,
    but the developers at Troll are always making improvements and adding functionality—to
    the extent that each new release still surpasses my expectation.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# WHAT THE TOOLKIT DOES


    In order to provide GUI development capabilities on Linux and Windows platforms,
    Qt emulates the high-level interface components of popular toolkits using the
    underlying, low-level API calls of the target platform. The toolkit performs this
    task with nearly seamless precision, making it very difficult to identify which
    platform is in use, if your only cue is the appearance of an application''s pushbuttons,
    listboxes, dialogs, and text.


    For UNIX and Linux systems, this means that Qt uses the X11 API calls available
    from libX11 (and to a limited degree, libXext), and performs all the appropriate
    steps involved in producing some visually pleasing and familiar controls. Those
    familiar with Xlib programming know this is a tedious and daunting task, and the
    results are almost never aesthetically pleasing. Those familiar with Motif or
    Xt programming will undoubtedly appreciate the higher performance of Qt and the
    greatly simplified development model. Motif programmers will, however, mourn the
    loss of the thousands of resource settings that they have become accustomed to,
    as well as their beloved UIL code.


    On Microsoft Windows systems, Qt uses the SDK calls to create components that
    closely resemble some of the familiar MFC components and controls that are available
    on Windows NT 4.0 and Windows 98 systems. The visual changes and components that
    have been introduced with Windows 2000 are not present in the current release
    of Qt, but I seriously doubt that the Trolls will tolerate a gap in functionality
    or appearance for very long.


    Qt provides classes to perform many of the common platform-dependent operations
    that are normally a source of headaches for the programmer, such as file and directory
    manipulation and handling of internationalized text.


    Veteran Microsoft Windows programmers will experience a short period of confusion
    as they begin exploring typical Qt development practices. The absence of the familiar
    but confusing initialization and event-handling code has caused more than one
    instance of culture shock. However, the simpler, and more intuitive, programming
