    # LAYOUT AND GEOMETRY MANAGEMENT


    The design of an interface—especially data entry forms—is probably the most critical
    and time consuming part of the GUI development process. The most useful or best-behaved
    application is virtually worthless if the interface is so confusing that the end-user
    can''t learn to use it quickly and efficiently. The interface design process almost
    always involves multiple iterations because we, the programmers, have a totally
    different perspective of workflow than the end-user. Like any customer, the end-user
    is always right (except when the beta-test guinea pigs start using terms like
    "bigger," "smaller," or other purely subjective terms).


    Just as with any GUI toolkit, Qt provides for two approaches to interface layout:
    hard-coded widget geometry specification, and relative layout. There are drawbacks
    and advantages to each, but it is my opinion that the relative layout approach
    is the better of the two; it is more maintainable, and permits sensible, predictable,
    and less complicated resizing of the application.


    If you have ever used a WYSIWYG (what you see is what you get) dialog or form
    editor, you probably noticed that these tools almost always use the hard-coded
    geometry approach to form layout, and almost never provide tools for relative
    layout. This is because the editor can easily translate your widget positioning
    and sizing information into'
  merge: -1
