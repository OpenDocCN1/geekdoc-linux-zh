- pgno: 213
  md: 'dialog-oriented approach of Qt Architect, making it more like the ground-up
    editors that many Motif programmers will remember.


    Another **nice** feature of Ebuilder is the **Member Function View** that makes
    it easy to add member functions to a widget you''re designing. You can also add
    additional include files for external code. You will see how important that is
    when you begin adding your own code to that generated by Ebuilder.


    No Ebuilder binary was available for Windows at this writing.


    # SUMMARY


    There are a great many other considerations related to application development,
    but they aren''t affected by a choice to use the Qt toolkit and were therefore
    left out of this discussion. If you subscribe to the qt-interest mailing list,
    you will hear a lot of discussion on these unrelated topics. Those discussions
    are usually discouraged by the vigilant Trolls who tend to keep discussions on-topic.


    For discussions on source code management, software licensing practices, and all
    the many other topics, there are dedicated newsgroups that discuss nothing else.'
