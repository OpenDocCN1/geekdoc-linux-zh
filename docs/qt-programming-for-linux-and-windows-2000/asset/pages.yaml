  md: "# A Possible Instantiation\n\n```\nQScrollBar *sb = new QScrollBar( QScrollBar::Vertical,\
    \ this, \"MyScroll\" );\n```\n\n# Example Use\n\n```\nQScrollBar *sb = new QScrollBar(\
    \ 1, num_lines, 20, 1, QScrollBar::Vertical, this, \"MyScroll\" );\nconnect(sb,\
    \ SIGNAL(valueChanged( int )), SLOT(handleScroll( int )) );\n```\n\nThe most common\
    \ complaint would seem to revolve around the use of integer values for positioning\
    \ information. However, since the maximum integer value matches (or even exceeds)\
    \ the coordinate system limitations of the supported platforms, the arguments\
    \ for using a larger data value are not very compelling.\n\n**QScrollView** A\
    \ scroll view is just a generic, scrollable area that provides appropriate vertical\
    \ and horizontal scrollbars as they are needed.\n\n# A Possible Instantiation\n\
    \n```\nQScrollView *sv = new QScrollView( this );\n```\n\n# Example Use\n\n```\n\
    // Create a huge array of push buttons\nQPushButton *pb;\nQScrollView *sv = new\
    \ QScrollView( this, \"SV1\", WPaintCleaner );\nQVButtonGroup *vbg = new QVButtonGroup(\
    \ sv );\nfor( int a=0; a<1000; a++ ) {\n    pb = new QPushButton( \"Yet Another\
    \ Button\", vbg );\n}\n```\n\nThe scroll view is very useful for the display of\
    \ large quantities of visual data, but you will run into platform integer limitations\
    \ that are mentioned in the discussion of QScrollBars. Again, the platform integer\
    \ meets or exceeds the display coordinate system on all the supported platforms,\
    \ and while some architectures (Windows 2000–Win64, for instance) will very likely\
    \ accommodate 64-bit (63, really) screen coordinates once 64-bit processors are\
    \ commonly available, it would be a waste of system resources to actually create\
    \ a display that exceeds the current limitations."
