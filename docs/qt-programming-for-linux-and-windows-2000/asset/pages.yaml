- pgno: 49
  md: '# QApplication''s Purposes


    The QApplication class functions as the main interface between your application
    and the underlying window system and serves as a base object for all of the visual
    components of that application. The following features will give you an overview
    of functionality the QApplication class provides:


    +   - QApplication encapsulates the *look and feel* of the application by means
    of a concept referred to as *Style*. The global style can be changed at runtime
    using the QApplication::setStyle() method. You can exercise per-widget style control
    as well, but it tends to make the interface confusing. Styles themselves are encapsulated
    via QStyle.


    +   - QApplication specifies how the application will allocate and use colors
    via the QApplication::setColorSpec() method. *You must set the color specification
    before you instantiate the QApplication object itself, or the specification will
    have no effect.* (The Qt color allocation model is discussed below.)


    +   - QApplication sets the default text codec (see QApplication::setDefaultCodec()),
    which defines how strings will be localized or translated via the QApplication::translate()
    method.


    +   - QApplication encapsulates some extremely platform-dependent concepts, such
    as the “desktop” and the “clipboard,” so that your application will work as you
    expect on whatever platform you deploy it. The Trolls define this as “Troll magic”—but
    it’s just a lot of hard work on their part.


    +   - QApplication provides adequate window interation and management functionality
    through the methods QWidget::widgetAt(), QWidget::topLevelWidgets(), and QWidget::closeAllWindows().


    +   - QApplication provides the event dispatch mechanisms that every application
    needs; i.e., it receives events from the underlying window system and sends them
    to the appropriate widgets. You can use QApplication::postEvent() and QApplication::sendEvent()
    to send your own messages to your application’s widgets. What could be more fun
    than that?


    +   - QApplication manages how mouse events are handled and provides adequate
    control for customizing this handling via QApplication::setOverrideCursor() and
    QApplication::setGlobalMouseTracking(). You will hardly ever use these functions,
    however; you can usually accomplish the desired effect at the QWidget level.


    +   - In X11 environments, QApplication provides methods to control the X11 protocol
    stream via QApplication::flushX() and QApplication::syncX().


    +   - QApplication provides the needed framework to implement full session management
    control—even on a Microsoft Windows platform. This functionality is provided via
    the QSessionManager class and the QApplication::isSessionRestored(), QApplication::sessionId(),
    QApplication::commitData(), and QApplication::saveState() methods.'
