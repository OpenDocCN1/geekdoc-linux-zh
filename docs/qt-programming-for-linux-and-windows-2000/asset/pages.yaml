  md: 'Chapter 2 Creating Your First Qt Application


    29


    # Color Management


    Qt provides several methods of managing color allocation for your application.
    If you are primarily used to X11 programming, you have no doubt read the MIT documentation
    on the subject and have scars from scratching your head to prove it. The X11 color
    models for the various visual types can be confusing. Qt makes color allocation
    simple and pre-dictable for most (not all) applications, and the Q\[Application
    class plays a significant role in that simplicity.


    Qt provides more options on X11 platforms than on Microsoft Windows platforms,
    but the usage is consistent and simple. Qt manages color allocation in one of
    several ways, depending on the use of Q\[application::setColorSpec() and QColor::enterAllo-context()).


    QApplication::setColorSpec() accepts an enumerated value that is one of the fol-lowing:


    +   - **QApplication::NormalColor**—This is the default. It causes your application
    to use the default system colors, which will work well for any application that
    uses very little color. This can lead to noticeable color dithering on Windows
    platforms.


    +   - **QApplication::CustomColor**—This setting is useful for applications that
    have a small number of specific colors that must be allocated. This setting has
    no effect on X11 platforms as compared with the default setting. On Windows systems,
    this set-ting causes a new color palette to be created and colors are allocated
    from it as needed.


    +   - **QApplication::ManyColors**—This setting is appropriate when your application
    will need many (even thousands of) colors.


    You can gain an additional degree of color allocation control at application runtime
    via the QColor::enterColorContext() method, which permits the application to allocate
    many colors on a temporary basis. But if your application''s help file refers
    to the name Pantone anywhere, you will need to add your own refinements to QColor
    to get the exact color you''re after.


    # QWIDGET CLASS


    QWidget is the abstraction of a user interface object and is the atom of Qt interface
    de-sign. QWidget provides a great deal of functionality and performs many useful
    tasks. It receives events from the underlying window system and provides the methods
    you will most likely need to put those events to work. It maintains properties
    such as the font and a color palette, although it doesn''t directly use them.
