    \ QSimpleRichText encapsulates the Qt simplified implementation of rich text.\
    \ You will use this primarily to add rich-text drawing support to custom widgets.\n\
    \n# *A Possible Instantiation*\n\n```\n```\nQSimpleRichText rt( \"<b>Boldly</b>\
    \ going\", font() );\n```\n```\n\n# *Example Use*\n\n```\n```\nQLabel *l = new\
    \ QLabel( this );\nQSimpleRichText rt( \"<b>Boldly</b> going\", font() );\nQPainter\
    \ p;\np.begin( l );\nrt.draw( &p, 0, 0,\n         QRegion( QRect( 0, 0, rt.widthUsed()\
    \ ),\n                  rt.height() ) );\npalette());\np.end();\n\n// It's much\
    \ easier to simply:\nl->setRichText( \"<b>Boldly</b> going\" );\n```\n```\n\n\
    As the above example implies, a limited subset of Qt widgets provide support for\
    \ the Qt rich-text implementation. This will undoubtedly change over time. In\
