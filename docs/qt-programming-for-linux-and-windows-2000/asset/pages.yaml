- pgno: 173
  md: 'QtTextEncoder converts from Unicode to another format (you have to provide
    the target format of course), maintaining prior state information for processing
    in subsequent calls. This makes the class suitable for use with data streams.
    See QtTextDecoder.


    # ## QtTranslator


    QtTranslator provides internationalization support for text output. A QtTranslator
    object contains a set of translations from the reference language to a target
    language, and provides methods to add, find, or remove such translations. Methods
    are also provided to save the current object to a file or load a previously saved
    file.


    # ## QtValidator


    QtValidator is a base class for validating input text. See QIntValidator and QDouble-Validator.


    # # DATE AND TIME


    While all the supported platforms provide the time_t standard value as a representation
    of time plus all the associated library functions, Qt provides its own encapsulation
    of date and time that is not quite as limited as the platform representations
    are.


    # ## QtDate


    QtDate is an abstraction of date values. The implementation is a platform-independent
    calculation of Gregorian dates, valid from September 14, 1752, to the eighth millennium.
    I expect the resolution to change significantly in future releases of Qt as 64-bit
    CPU architectures become more prevalent. The native time_t value on these systems
    is valid to BSN (Beyond Solar Nova).


    # ## QtDateTime


    QtDateTime combines the functionality of the QtDate and QtTime classes. The class
    also adds some convenience routines to permit interfacing to the native time_t
    values supplied by the platforms that Qt is available for.


    # ## QtTime


    The QtTime class is an abstraction of time in hours, minutes, seconds, and milliseconds
    since midnight. QtTime provides methods for comparison and conversion.'
