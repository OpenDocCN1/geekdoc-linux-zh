- pgno: 74
  md: '# Chapter 2 Creating Your First Qt Application


    are commonly referred to as *events*, while the Windows-speak term is *messages*.
    The term is irrelevant but the concept is pretty much the same. The methods used
    to deal with them differ somewhat between the two architectures.


    Applications based on the X11 Toolkit, Xi (Motif and friends), use *callback*
    functions that accept arguments specific to the widget or to the event they are
    intended to handle. These callback functions must be registered with Xi for each
    widget that will make use of the particular callback, and it''s the programmer''s
    responsibility to guarantee that the argument lists will match at runtime. Since
    there is very little (or no) type-checking performed at compile-time, there is
    no guarantee that the callback function''s arguments will be set as the programmer
    intended. If you make a mistake and if you are very lucky, the program will crash
    and you will have a core file or some debug information to help you find the problem
    in your code. More often than not, unfortunately, the program will behave erratically
    and you''ll spend more time tracking it down. Whatever the result, a lot more
    time is spent debugging these applications than would otherwise be required if
    these connections were *type-checked*.


    The Microsoft Foundation Class library, or *MFC*, uses compile-time macros and
    message maps to connect messages to C++ methods. Neither C nor C++ compilers can
    type-check a macro so MFC provides no benefits in this respect over the callback
    approach for Motif. MFC also requires the programmer to provide a rather complex
    message map that is as difficult to read as it is to write. This issue is usually
    dealt with by using the sophisticated Microsoft or Borland IDEs and their visual
    design tools. I won''t speculate on Microsoft''s reasons for creating a dependence
    on Microsoft tools and neither should you.


    Qt addresses all these issues with an elegant alternative. Qt objects and objects
    that you create can *emit* (or send) signals without knowing what object(s) will
    receive them. Qt objects can also provide slots to receive signals emitted by
    other objects without knowing anything about the object that emitted the signal.
    This is a big improvement over the other methods discussed above, and presents
    some unique problems of its own that will be discussed a little later.


    # Signals Don''t confuse Qt signals or Linux or UNIX signals! They have nothing
    to do with one another.


    Qt signals are sent by Qt objects or objects you create. The object emits the
    signal and doesn''t care who, if anyone, receives the signal. An object may emit
    a signal to notify that the mouse has been moved or that a value has changed.
    Not having to know anything about who will use the object eliminates the need
    to anticipate the intended use of that object, and this supports a component model
    of development that encourages reuse of existing code.


    # Slots Qt objects and objects you create can provide special functions known
    as *slots*. Slot functions are special because signals that are emitted by any
    Qt object can be connected to, or disconnected from, these slot functions using
    the QObject::connect() and QObject::disconnect() methods. The only constraint
    on the connections is that the type of the signal must match the type of the slot.
    If you have ever performed any electronic “breadboarding,” a method of electronic
    prototyping that''s very component-oriented, the'
