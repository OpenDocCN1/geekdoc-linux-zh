    # NUMERIC INPUT


    Sometimes an application needs to acquire a numeric value from the user. You can
    provide a standard line edit and assign a validator to only accept numbers but,
    even with tooltip help, this is not always intuitive. Other methods have been
    devised and tested over the years and more will come. Here are the widgets provided
    with Qt.


    # QSlider


    QSlider (Fig. 3.29) provides an intuitive way to acquire numeric user input. Bounds
    checking is provided via QSlider’s QRangControl parent.


    ![](img/64220583cb3d8a303f33ac97f5433b04_123_0.png)


    Figure 3.29 QSlider widget


    # A Possible Instantiation


    ```

    ```cpp

    QSlider *s = new QSlider( QSlider::Horizontal, this );

    ```

    ```


    # Example Use


    ```

    ```cpp

    QSlider *s = new QSlider( QSlider::Horizontal, this );

    s->setRange( -180, 180 );

    s->setValue( 0 );

    ```

    ```


    # QSpinBox


    A spin box (Fig. 3.30) is a text field that accepts (usually) integer data. It
    includes a pair of pushbuttons that permit the user to increment or decrement
    the displayed value. The step rate and range are programmable.


    ![](img/64220583cb3d8a303f33ac97f5433b04_123_1.png)


    Figure 3.30 QSpinBox widget'
