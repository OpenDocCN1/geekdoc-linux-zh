- pgno: 84
  md: '# CHAPTER  3


    # User Interaction Objects


    The following pages discuss the visual Qt objects, or widgets, that provide some
    mechanism(s) with which the user may interact. Some examples of possible uses
    are included where appropriate. Some simple modifications to the behavior of these
    objects are included as well, although purists may balk at some of my seeming
    deviations from "standard interface and style guidelines" (as if there were such
    a thing).


    This is not intended as a comprehensive guide to all the Qt visuals. To attempt
    such a work could only serve to emulate the excellent online reference documentation.
    Instead, I have attempted to organize Qt''s visual components into those widgets
    that support end-user interaction in some way. This classification is further
    divided into functionally related groups. Hopefully, this organization will make
    it possible to browse for needed functionality without having to read either this
    book, or the Qt online reference documentation, in their entirety. This should
    lessen the effort required to find the right widget for a given task, and should
    also make it easier for the less-experienced Qt programmer to visualize different
    approaches to solving real problems. Widget discussions include a brief discussion
    of the object''s purpose or purposes. Some discussions include common or obvious
    modifications to existing behavior that you might find useful.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# USER INTERACTION OBJECTS


    I define *user interaction objects* as those objects that permit the end-user
    of an application to input information, to change operating parameters, or to
    trigger operations. This includes objects that permit a user to select something
    from a list.


    Where it makes sense to do so, I have included supporting objects that don''t
    directly provide an interface or interaction.


    # Buttons


    These objects provide user interaction in the form of pushbuttons, radio buttons,
    toolbars, checkboxes, and classes that are used to manage them.


    # QCheckBox


    A check box is a boolean indicator and input widget that consists of a graphic
    box that either provides a check mark or an "x" (depending on the style) and an
    optional text label. An example is shown in Figure 3.1.


    ![](img/64220583cb3d8a303f33ac97f5433b04_85_0.png)


    **Figure 3.1**  QCheckBox widgets


    # *A Possible Instantiation*


    ```

    ```cpp

    QCheckBox *cb = new QCheckBox( "Option A", this );

    ```

    ```


    # *Example Use*


    ```

    ```cpp

    cb->setChecked( true );

    ```

    ```


    If your design requires a large number of checkboxes, or if the available screen
    real estate prevents creation of all the checkboxes required, consider using a
    QListview loaded with appropriate QListItems instead.


    # QPushButton


    Push buttons are used to trigger some sort of action, or to set a boolean value
    when used as a toggle button. Using the Qt push button is very simple—unless you
    come from a Motif background—in which case, you will miss the widget pointer that
    Motif passes to'
