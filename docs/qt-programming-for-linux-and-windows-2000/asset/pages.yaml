- pgno: 79
  md: "# **Signal/Slot Disadvantages**\n\nDisadvantages of the signal/slot mechanism\
    \ include the extra build step required to generate the moc output code. The most\
    \ severe drawback is the inability to provide signals and slots that are conditionally\
    \ compiled via traditional macros. The following code will not produce the expected\
    \ results because the moc compiler doesn’t interpret macros or macro definitions:\n\
    \n![](img/64220583cb3d8a303f33ac97f5433b04_79_0.png)\n\n```\n```cpp\n#include\
    \ <qobject.h>\n\nclass MyObject : public QObject\n{\n    Q_OBJECT\npublic:\n \
    \   MyObject();\n\nsignals:\n    #ifdef WIN64 // Ignored by moc\n        void\
    \    valueChanged( __int64 );\n    #else\n        void    valueChanged( unsigned\
    \ int );\n    #endif\n\npublic slots:\n    #ifdef WIN64 // Ignored by moc\n  \
    \      void    setValue( __int64 );\n    #else\n        void    setValue( double\
    \ );\n    #endif\n\nprivate:\n    #ifdef WIN64\n        unsigned __int64    value;\n\
    \    #else\n        unsigned int        value;\n    #endif\n};\n```\n```\n\nThe\
    \ output from the moc compiler will produce both sets of signals and slots because\
    \ the macro test for WIN64 is ignored by the Qt MOC compiler. If your compiler\
    \ does not yet support the `__int64` data type, or if you try to compile this\
    \ on any system other than a Windows box, you will get errors at compile-time\
    \ even though you took the correct steps to prevent them—at least from a C++ perspective.\
    \ Of course, you can get around this problem by defining a type outside the class\
    \ definition, but the example is just an illustration.\n\nThe moc program *will*\
    \ intercerpt two special comments that will make it easier to block the moc compiler\
    \ from processing large groups of code:\n\n![](img/64220583cb3d8a303f33ac97f5433b04_79_1.png)"
  merge: -1
