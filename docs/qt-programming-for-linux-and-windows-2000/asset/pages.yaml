- pgno: 171
  md: '# QStringList and QStrIlList


    QStringList provides a doubly linked list of character pointer values. QStrIlList
    adds case-insensitive comparison.


    # QStringListIterator


    This is an iterator for QStringList or QStrIlList collections.


    # QStringList


    This class manages a list of QString objects and provides methods for searching.


    # QValueList


    QValueList is a *value*-based template class that provides doubly linked lists.
    See QList for a reference-based implementation.


    # QValueListConstIterator


    This is one of two iterators for QValueList collections. It will not permit the
    QValueList values to be modified.


    # QValueListIterator


    This is one of two iterators for QValueList collections. See QValueListConstIterator.


    # QValueStack


    This is a *value*-based template class that implements a LIFO stack. Use QStack
    for reference-based implementations.


    # QVector


    QVector is a *reference*-based template class for implementing an array. QVector
    has an advantage over a QArray in that the complexity of the array elements does
    not suffer the restrictions that QArray’s value-based implementation imposes.
    See QArray for a value-based implementation.


    # TEXT HANDLING


    Qt provides classes to encapsulate text objects and concepts in a platform-independent
    and, in several instances, a language-independent manner. The following discussions
    provide a brief overview of these classes and their intended purposes.'
