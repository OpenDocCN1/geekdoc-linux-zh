- pgno: 172
  md: '# QChar


    QChar encapsulates Unicode characters and provides test, classification, and conversion
    methods much like those provided for ASCII characters by ctype.h.


    # QClipboard


    QClipboard provides methods to access the underlying window system’s clipboard.


    # QConstString


    This class provides the functionality of the QString class, optimized for existing
    Unicode data. By eliminating copy operations (the primary overhead of the QString
    class) the QConstString class can provide a significant performance increase.
    If any modification is attempted on the data, however, the class will make a copy
    of the data so that it will persist unmodified.


    # QString


    This class is an abstraction of typical zero-terminated strings. QString inherits
    QArray, so its contents are explicitly shared. Also see QString.


    # QDoubleValidator


    QDoubleValidator provides range checking for double precision floating point numbers.
    See QValidator and QIntValidator.


    # QRegExp


    QRegExp provides pattern matching using regular expressions in a manner similar
    to the GNU regex implementation. Support is provided for Unicode support and case-insensitive
    matching except for non-ASCII Latin-1 characters.


    # QString


    QString is an abstraction of Unicode text and character strings. QString implicitly
    shares text strings.


    # QTextCodec


    This abstract class provides conversions between text encodings and encapsulates
    the common elements of Qt text encodings.


    # QTextDecoder


    QTextDecoder provides a single method, toUnicode(), that is used to convert an
    array of bytes into Unicode text. The class maintains prior state information
    for continued processing in subsequent calls, making QTextDecoder useful in data
    streams. See QText-Encoder.'
