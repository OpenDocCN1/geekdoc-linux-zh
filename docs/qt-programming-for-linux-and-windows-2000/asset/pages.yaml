- pgno: 214
  md: '# # CHAPTER 8


    # Windows 2000 Topics


    I have heard Windows developers claim that Qt isn''t capable of interfac ing with
    other Windows applications. This chapter, as does much of the material that precedes
    it, should help to dispel that myth. Throughout this book, I have intermixed Windows
    and Linux development terms because, to put it simply and correctly, Qt doesn''t
    care what platform you use. Everything in this book, except when noted otherwise,
    applies to both platforms. That does not mean that Windows and Linux are the same.
    Microsoft Windows has features that don''t translate well to features on UNIX
    platforms (and vice-versa). This chapter is devoted exclusively to Windows issues
    and provides examples of Qt programming for Windows-dependent functionality.


    It *can* be a little difficult to perform some of the more extreme platform-dependent
    tasks — such as adding a systray icon for your application — but it can be done.
    The following examples make use of some extremely Windows-dependent functionality
    that many developers are likely to encounter.


    # DDE SERVER CLASS


    Turning your Windows Qt application into a DDE server is as easy as it is nonportable.
    The following example class provides a very simple DDE Execute server.'
