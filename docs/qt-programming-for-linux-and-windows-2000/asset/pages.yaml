    # QRangeControl


    This class provides the means to bound integer values within a specific range.
    This is much more intuitive than letting the user input an integer with a text
    field and in some circumstances, is even more intuitive than a spin box (it depends
    on the context).


    # Likely Instantiation


    ```

    ```

    QRangeControl *rc = new QRangeControl( 0, 100, 1, 10, 0 );

    ```

    ```


    # Common Use


    ```

    ```

    QRangeControl *rc = new QRangeControl( 0, 100, 1, 10, 0 );

    int n = rc->pageStep();

    ```

    ```


    There are five concepts covered by the class which make its use in QScrollBar
    widgets rather apparent:


    +   - A current value as a bounded integer which is retrieved via the QRangeControl::value()
    method and set using the QRangeControl::setValue() method.

    +   - The minimum value.

    +   - The maximum value.

    +   - A line-step value that can be used to determine the preferred number of
    lines to scroll.

    +   - A page-step value that can be used to determine the appropriate number of
    lines to scroll for a page-forward or page-backward scroll.


