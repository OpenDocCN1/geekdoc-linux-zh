    # QDataStream


    QDataStream provides some basic methods for serializing binary data to a QIODevice.
    A data stream is independent of platform-dependent byte ordering.


    # A Possible Instantiation


    ```

    ```cpp

    QFile f( "some_data.dat" );

    f.open( IO_ReadOnly );

    QDataStream s( f );

    ```

    ```


    # Example Use


    ```

    ```cpp

    float myfloat;


    // Open a file for writing

    QFile f( "data.dat" );

    f.open( IO_WriteOnly );

    // Associate the file''s QIODevice with a stream

    QDataStream s( f );

    // Write data into the stream

    s << 0x0102030405;

    s << (double)3.1416;

    myfloat = 0.01120113;

    s << myfloat;

    // Close the file

    f.close();

    ```

    ```


    Note that QDataStream allows you to specify the byte ordering of the output (the
    default is MSB first, or big-endian) but changing the default will break the portability.'
