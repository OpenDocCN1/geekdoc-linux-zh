- pgno: 75
  md: "advantages of the signal/slot architecture are immediately apparent as the\
    \ two approaches to development are very similar.\n\nWhile the compiler won't\
    \ usually catch a mismatch between connected signals and slots, the toolkit will\
    \ catch them at runtime, since that is when the actual connection occurs. The\
    \ default behavior is to produce a warning message and proceed. The slot will\
    \ only be called by connected signals having a matching, partial or complete,\
    \ argument list (i.e., if a signal passes three arguments to a slot that matches\
    \ the first two arguments, the connection will be made, and the third argument\
    \ is discarded). That is only the default behavior, though. You can easily change\
    \ the way Qt deals with these conditions to suit your specific need.\n\n# **Defining\
    \ Signals And Slots**\n\nImplementing signals and slots is easy, but there are\
    \ a few considerations:\n\n+   * Any object that implements signals or slots must\
    \ inherit QObject, either directly or indirectly. All Qt user interface objects\
    \ (widgets) inherit QObject.\n+   * You must include the keyword `Q_OBJECT` at\
    \ the top of the class definition.\n+   * Signals and slots must always have a\
    \ void return value.\n+   * Signals are defined in a section of the class definition,\
    \ called `signals:`. Access specifiers have no meaning for signals, so you must\
    \ not provide one.\n+   * Slots are defined by appending the new keyword, `slots:`,\
    \ to the desired access specifier as in `public slots:`, `protected slots:`, or\
    \ `private slots:`. Slots cannot be declared `static`.\n+   * Any code containing\
    \ the keyword `Q_OBJECT` must be precompiled with the Qt Meta-Object Compiler,\
    \ which is called moc (`moc.exe` on Windows). The moc output must be compiled\
    \ and linked with the final program.\n\nThe following is a completely useless\
    \ example that demonstrates nothing more than possible declarations and implementations.\
    \ It will execute—just don't expect an epiphany or a dazzling fireworks display.\n\
    \n```\nUseless signals and slots\n```cpp\n#include <qobject.h>\n#include <stdio.h>\n\
    \nclass DoLittle : public QObject\n{\n Q_OBJECT\n public:\n DoLittle();\n\n signals:\n\
    \ // Overloaded signals\n void callSlot( int );\n void callSlot( bool );\n void\
    \ callSlot( const char * );\n```\n```"
