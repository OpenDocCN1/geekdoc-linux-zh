  md: '# FUNCTIONAL GROUPING


    A complex form can be made more intuitive by grouping related tasks together and
    giving the end-user a visual queue that some distinction exists between this set
    of widgets and that set of widgets. End-user visual queues aside, there are programmatic
    reasons you may want to create a group of widgets, such as widget arrays. Qt provides
    a reasonably comprehensive set of abstractions, and many of the more frequently
    needed grouping mechanisms.


    # QGroupBox


    Group boxes (Fig. 3.15) provide a frame and a text label. They''re commonly used
    to present the user with a logical grouping of related features or functionality.
    A complex form can be very confusing to a user who may not be familiar with how
    the information fits together. Group boxes and tabbed forms are two ways to address
    this potential confusion.


