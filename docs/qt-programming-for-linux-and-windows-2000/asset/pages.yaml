    **QPen and QBrush** QPen defines QPainter outline drawing style and color. QBrush
    defines QPainter fill style and color.


    **QPicture** A QPicture is a class that captures QPainter commands in an off-screen
    paint device and serializes the commands for platform-independent playback. Windows
    programmers will recognize these as meta-files. The serialized data can be saved
    and restored.


    # A Possible Instantiation


    ```

    QPicture *pic = new QPicture();

    ```


    # Example Use


    ```

    // Create and save a new picture

    QPicture *pic = new QPicture();

    QPainter p;

    p.begin( pic );

    p.drawText( pb->rect(), AlignCenter, "Some Text" );

    p.end();

    pic->save( "some_text.pic" );


    // Load and display the picture

    QLabel *l = new QLabel( this );

    QPicture newpic;

    newpic.load( "some_text.pic" );

    QPainter np;

    np.begin( l );

    np.drawPicture( newpic );

    np.end();

    ```'
