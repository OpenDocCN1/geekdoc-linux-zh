- pgno: 287
  md: '# APPENDIX


    # B


    # How to Learn More


    You have many options for learning more about the Qt toolkit. Due primarily to
    Qt’s presence in the Open Source community, but also due to the fact that Qt is
    a truly fine product, there are more freely available examples of Qt application
    code than any other GUI toolkit. There are many Web sites—other than the site
    Trolltech maintains—that are geared toward distribution of useful Qt widgets and
    classes. The Trolls maintain an excellent mailing list, monitored by many Qt gurus
    whose knowledge of Qt dwarfs my own.


    The following are reliable sources (there are many sources, but these are virtually
    always available) of additional information on the Qt toolkit:



    | Source | Description |

    | :--- | :--- |

    | **qt-interest** | The qt-interest mailing list is maintained by Trolltech. It
    is devoted to discussion of Qt development topics, how-to information exchange,
    and the discussion of ideas. Check for current instructions on how to join this
    list at the Trolltech Web site shown below. |

    | **www.trolltech.com** | This is the main Trolltech site. You will find current
    releases of the Qt toolkit, as well as many user-contributed widgets and applications.
    This is also where you can find the current tmake utility. |'
  merge: -1
  img_proc: true
- pgno: 288
  md: "# Appendix B How to Learn More\n\n+   www. kde. org  \n+   The home page for\
    \ the \"K* Desktop Environment, or KDE. This is the leading desktop environment\
    \ for Linux systems and is based on Qt.  \n+   \n+   developer. kde. org  \n+\
    \   The home page for KDE developers.  \n+   ftp. sunsite. edu  \n+   An excellent\
    \ source of KDE and Qt application examples for Linux.  \n+   ftp. cc. gatech.\
    \ edu  \n+   Much of the sunsite FTP server is mirrored here.\n\nThere are a large\
    \ number of Qt-based Open Source software projects in development that are independent\
    \ of Trolltech and the KDE group. Most of these are available on one FTP site\
    \ or another, and are excellent sources of real-world example code.\n\n# CONTENTS\
    \ OF THE CD-ROM\n\nAs mentioned in Chapter 1, the CD-ROM that accompanies this\
    \ book is in **ISO9660** format with Joliet extensions; i.e., it should be mountable\
    \ from Linux (or other UNIX-like systems) as long as you have an **ISO9660** driver\
    \ loaded that can talk to the CD-ROM drive.\n\nOn Linux systems, some of the folder\
    \ and file names will be mangled if your driver doesn’t support the Joliet file\
    \ system extensions, but the files should read without problems. If you experience\
    \ problems under a Linux environment, I recommend reading the ample HOWTO information\
    \ that comes with every distribution.\n\nOn Windows platforms, you should have\
    \ no problems reading the CD-ROM just as you would any CD-ROM. However, you will\
    \ not be able to build the Qt Free Edition distribution that is on the CD-ROM\
    \ on a Windows platform. To do so requires either a \"Pro\" license from Trolltech\
    \ or an evaluation licence. You will also need a compiler. I use Microsoft® Visual\
    \ Studio 6.0 with Visual C++, but you may prefer to use the Borland compiler.\
    \ It is my experience that there is very little to recommend one over the other,\
    \ except I have grown more accustomed to the Microsoft environment.\n\nThe file,\
    \ *contents.txt*, provides a detailed listing of the CD-ROM’s contents. The CD-ROM\
    \ is organized into subdirectories:\n\n+   ```\n+   ./Distribution\n+   ./Distribution/qt-2.1.0\n\
    +   ```\n\nThese folders contain the Qt Free Edition in both compressed-tar format\
    \ and the un-compressed and extracted format. These images are directly from the\
    \ Qt distribution and are completely unconfigured. On supported platforms, all\
    \ you should need to do is copy the entire directory tree to a hard disk, set\
    \ the *QTDIR* environment variable to point to the top of the new directory tree,\
    \ execute */configure*, and type *make*.\n\nPlatforms not directly supported by\
    \ Qt will require a bit of tweaking.\n\n+   ```\n+   ./Distribution/tmake-1.4\n\
    +   ```"
  merge: -1
  img_proc: true
- pgno: 289
  md: 'This folder contains the source code for the `tmake` utility that translates
    platform-independent project description files into platform-dependent makefiles
    or Microsoft projects. Building `tmake` is just as easy as building Qt.


    ```

    ./Distribution/RedHat-6.1/static

    ./Distribution/RedHat-6.1/shared

    ```


    These folders contain prebuilt copies of the Qt Free Edition source for RedHat
    Linux Version 6.1, with the egcs-1.1.2 compiler. This is (arguably) the most common
    Linux distribution, but it will still behave correctly on many other Linux distributions.


    I provided both dedicated static-linkage and dedicated dynamic-linkage builds.
    Which method you choose to use depends greatly on your end-user environment.


    ```

    ./Book/Examples/chap2

    ./Book/Examples/chap3

    ./Book/Examples/chap4

    ./Book/Examples/chap5

    ./Book/Examples/chap7

    ./Book/Examples/chap8

    ```


    As you may have guessed, these folders contain the examples from the book. Some
    of the examples have been altered to provide “demo” capabilities. If you wish
    to use them in an application, you will need to either rip out the main() function
    definitions or enclose them within a conditional compile.


    ```

    ./Binaries/Windows/examples

    ```


    While a Pro license is required to build Qt for Windows platforms, it may help
    Windows users to see the examples that come with the Qt distribution execute in
    a Windows environment. For that reason, the executable forms of the Qt examples
    are provided in this folder.


    ```

    ./Extras

    ```


    This folder contains some useful classes and HTML documentation that I''ve written
    over the years. You are encouraged to improve on these classes and to share those
    improvements—but remember to give credit where credit is due.


    It is important to note that the SpinTime widget, a weekend kludge that works
    very well, contains chunks of code that are taken directly from the Qt QSpinBox
    widget, and are therefore the property of Trolltech and subject to their generous
    licensing. It is reproduced in SpinTime by their kind permission. I will eventually
    rewrite the widget to support QString, QDateTime, and internationalization of
    the display format—a task that would already be complete had I not been busy writing
    a book.'
  merge: -1
  img_proc: true
