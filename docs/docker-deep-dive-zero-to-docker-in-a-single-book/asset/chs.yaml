- "# Docker 深度泛览：一书通通 Docker\n\n\n\n\n\n\n\n\n本书可在 [`leanpub.com/dockerdeepdive`](http://leanpub.com/dockerdeepdive)\
  \ 购买\n\n此版本发布于 2020-05-14\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * * * * *\n\n\
  这是一本 [Leanpub](http://leanpub.com) 出书。Leanpub 通过精益出版流程为作者和出版社赋能。[精益出版](http://leanpub.com/manifesto)\
  \ 是使用轻量级工具和多次迭代来出版正在进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。\n\n* * * * * * *\n\
  \n\n非常感谢我的妻子和孩子，忍受家里这个极客——他真心认为自己是一堆运行在中端生物硬件之上的容器里的软件。跟我在一起一定不容易！\n\n也非常感谢每一个观看我\
  \ Pluralsight 视频的人。我喜欢与你们交流，并非常感谢多年来获得的所有反馈。这是我决定写这本书的主要原因之一！我希望它能成为一个很棒工具，帮助你的职业更上一层。\n\
  \n\n## 0: 关于这本书\n\n这是一本关于 Docker 的书，不需要任何先验知识。事实上，这本书的格铭是`一本书搞定 Docker。`\n\n所以，如果你参与了云原生微服务应用的开发和运维，并需要学习\
  \ Docker，或者你想参与这些领域，那么这本书就是为你准备的。\n\n事实上，Book Authority（曾在 CNN、福布斯杂志登过）将其评为史上最佳的\
  \ Docker 书！\n\n![史上最佳 Docker 书 - 获奖者](img/figure0-1a.png)\n\n史上最佳 Docker 书 - 获奖者\n\
  \n### 为什么我应该读这本书或关注 Docker？\n\nDocker 已经存在了，无法回避。事实上，如果你想在最先进的技术领域获得最好的工作，你就需要了解\
  \ Docker 和容器。\n\n### 如果我不是开发者怎么办\n\n如果你认为 Docker 只是给开发者用的，请准备好你的世界观被颠覆。\n\n大多数应用程序，即使是那些奇特的云原生微服务，也需要高性能的生产级基础设施来运行。如果你认为传统的开发者会处理这些，请重新考虑。简而言之，如果你想在现代的云优先世界中脱颖而出，你需要了解\
  \ Docker。但不要压力，这本书将赋予你所需的所有技能。\n\n### 如果我已经看过了你的视频教程，我还需要买这本书吗？\n\n选择权在于你，但我通常建议人们**看我的视频**并且**读我的书。不，这不是为了让我富有。通过不同的媒介学习是一种经过证明的快速学习方法。因此，我建议你阅读我的书，观看我的视频，并尽可能获得实践经验。\n\
  \n此外，如果你喜欢我的[视频课程](https://app.pluralsight.com/library/search?q=nigel+poulton)，你可能会喜欢这本书。如果你不喜欢我的视频课程，你可能就不会喜欢这本书。\n\
  \n如果你还没看过我的视频课程，你应该去看看！它们节奏快、趣味性，并且获得了*一致好评*。\n\n### 本书的结构\n\n我将书分为两个部分：\n\n1. 宏观内容\n\
  2. 技术内容\n\n**宏观内容**部分涵盖了这些内容：\n\n* 什么是 Docker\n* 为什么我们需要容器\n* “云原生”和“微服务”等词意味着什么……\n\
  \n如果你想对 Docker 和容器有一个全面的了解，这些是你需要知道的内容。\n\n**技术内容**部分涵盖了这些内容：\n\n* 如何构建镜像\n* 如何运行容器\n\
  * 如何管理集群\n\n# 第一部分：宏观内容\n\n# 1: 从万米高空看容器\n\n容器确实是*一种东西*。\n\n在这一章中，我们将深入探讨诸如：为什么我们需要容器，它们为我们提供了什么，以及我们可以在哪里使用它们。\n\
  \n## 糟糕的过去\n\n应用程序是业务的核心。如果应用程序崩溃，业务就会崩溃。有时它们甚至会导致企业破产。这些说法每天都变得更加真实！\n\n大多数应用程序运行在服务器上。过去，我们每台服务器只能运行一个应用程序。Windows\
  \ 和 Linux 的开放系统世界还没有足够的技术来安全可靠地在同一台服务器上运行多个应用程序。\n\n结果，故事大是这样的……每当业务需要一个新的应用程序时，IT\
  \ 部门就会买一台新服务器。大多数时候，没有人知道新应用程序的性能要求，迫使 IT 部门在选择购买的服务器型号和尺寸时做出猜测。\n\n\n\n\n因此，IT\
  \ 部门做了他们能做的一切——购买了昂贵的大型快速服务器。毕竟，包括业务部门在内的任何人都不希望服务器性能不足，导致无法执行交易，并可能导致客户流失和收入损失。因此，IT\
  \ 部门大买特买。这导致了性能过剩的服务器运行效率仅为潜能的 5-10%。这是对公司资本和环境资源的悲剧性！\n\n## 你好 VMware！\n\n在这一切之中，VMware,\
  \ Inc. 向世界送上了一份礼物——虚拟机（VM）。几乎在夜之间，世界变成了一个更美好的地方。我们终于有了一项允许我们在单台服务器上安全、可靠地运行多个业务应用程序的技术。欢呼庆祝吧吧！\n\
  \n这是一个游戏规则的改变者。IT 部门不再需要每当业务需要新应用程序时采购一台全新的超大服务器了。大多数情况下，他们可以在带有空闲容量的现有服务器上运行新应用。\n\
  \n突然之间，我们能够从现有的企业资产中榨出巨大的价值，让公司的每一分钱（$）都获得了更大的回报。\n\n## VM 的困境\n\n但是……总会有一个*但是*！尽管虚拟机非常出色，但它们远非完美！\n\
  \n每个虚拟机都需要一个自己的专用操作系统（OS），这一事实是一个巨大的缺陷。每个操作系统都会消耗 CPU、内存和其他资源，而这些资源本可以用于运行更多的应用程序。每个操作系统都需要打补丁和监控。在某些情况下，每个操作系统都需要授权许可。这一切导致了时间精资源的浪费。\n\
  \n虚拟机模型还有其他挑战。虚拟机启动很慢，而且移植性并不好——在虚拟机管理程序和云平台之间迁移和移动虚拟机工作负载比所需的要困难得多。\n\n## 你好容器！\n\
  \n长期以来，像 Google 这样的大型网络规模巨头一直在使用容器技术来解决虚拟机模型的缺点。\n\n在容器模型中，容器大致相当于虚拟机。一个主要的区别在于，容器不需要自己的完整操作系统。事实上，单个宿主机上的所有容器共享宿主机的操作系统。这释放了大量的系统资源，如\
  \ CPU、内存和存储。它还减少了潜在的许可成本，并减少了操作系统补丁和其他维护的开销。结果是：在时间、资源和资本方面都实现了节省。\n\n容器的启动速度快且极易迁移。将容器工作负载从你的笔记本电脑移动到云端，然后移动到数据中心的虚拟机或裸机上都是轻而易举。\n\
  \n## Linux 容器\n\n现代容器起源于 Linux 世界，是许多人在很长时间内大量工作共同结晶。。举一个例子，Google LLC 为 Linux 内核贡献了许多与容器相关的技术。没有这些以及其他贡献，我们今天就不会有现代容器。\n\
  \n近年来让容器实现大规模增长的一些主要技术包括：`kernel namespaces`（内核命名空间）、`control groups`（控制组）、`union\
  \ filesystems`（联合文件系统），以及当然还有 `Docker`。再次强调一下之前说过的——现代容器生态系统深感激那些为我们目前构建的基础奠定坚实基础的个人和组织。感谢大家！\n\
  \n尽管如此，容器仍然很复杂，并且超出了大多数机构的触及范围。直到 Docker 的出现，容器才真正实现了民主化，并让大众触及。\n\n> **注意：** 存在许多类似于容器的操作系统虚拟化技术，它们早于\
  \ Docker 和现代容器。有些技术甚至可以追溯到大型机上的 System/360。BSD Jails 和 Solaris Zones 是其他著名的 Unix\
  \ 类型容器技术示例。然而，在书中，我们将讨论范围限制在由 Docker 普及的*现代容器*上。\n\n## 你好 Docker！\n\n我们将在下一章更详细地讨论\
  \ Docker。但现在，足够说 Docker 是让 Linux 容器对普通人来说变得可用的魔法了。换句话说，Docker, Inc. 让容器变得简单了！\n\n\
  ## Windows 容器\n\n在过去的几年里，微软公司一直非常努力地将将 Docker 和容器技术引入 Windows 平台。\n\n在编写本书时，Windows\
  \ 容器已在 Windows 桌面和 Windows Server 平台上可用（Windows 10 及更高版本，以及 Windows Server 2016\
  \ 及更高版本）。为了实现这一目标，微软与 Docker, Inc. 以及开源社区密切合作。\n\n实现容器所需的  Windows 内核技术统称为 `Windows\
  \ Containers`（Windows 容器）。用于这些 `Windows Containers` 的用户空间工具可以是 Docker。这使得 Windows\
  \ 上的 Docker 体验与 Linux 上的 几乎相同。这样，熟悉 Linux 平台 Docker 工具集的开发者和系统管理员在使用 Windows 容器时可以感到如如归。\n\
  \n本书的修订版包含了 Linux 和 Windows 的示例。\n\n## Windows 容器对比 Linux 容器\n\n理解运行中的容器共享其所运行宿主机的内核至关重要。这意味着容器化的\
  \ Windows 应用程序不会在基于 Linux 的 Docker 宿主机运行，反之亦然——Windows 容器需要 Windows 宿主机，而 Linux\
  \ 容器需要 Linux 宿主机。只是……并不总是那么简单。\n\n在 Windows 机器上运行 Linux 容器可能的。例如，运行在 Windows 上的\
  \ Docker Desktop 有两种模式：“Windows containers”和“Linux containers”。取决于你的 Docker Desktop\
  \ 版本，Linux 容器在轻量级 Hyper-V VM 内部运行或使用 Windows Linux 子系统（`WSL`）。WSL 选项是较新的，也是未来的战略选择，因为它不需要\
  \ Hyper-V VM，并提供了更好的性能和兼容性。\n\n## Mac 容器呢？\n\n目前没有所谓的 Mac 容器。\n\n但是，你可以使用 *Docker\
  \ Desktop* 在你的 Mac 上运行 Linux 容器。这是通过在你的 Mac 上的轻量级 Linux VM 中无缝运行容器来实现的。这对开发者非常受欢迎，他们可以轻松地在\
  \ Mac 上开发和测试 Linux 容器。\n\n## 关于 Kubernetes\n\nKubernetes 是一个源自 Google 的开源项目，它已迅速成为容器化应用的事实编排器。这只是用一种高级的说法表示*Kubernetes\
  \ 是部署和管理容器化应用最流行的工具*。\n\n> **注意：** 容器化应用是以容器运行的应用程序。\n\n在编写本书时，Kubernetes 使用 Docker\
  \ 作为其默认容器运行时——即提取镜像并启动停止容器的底层技术。然而，Kubernetes 有一个可插的容器运行时接口（`CRI`），可以轻松将 Docker\
  \ 替换为其他容器运行时。在未来，`containerd` 可能会取代 Docker 成为 Kubernetes 的默认容器运行时。书中后面会介绍 `containerd`，但现在只需知道\
  \ `containerd` 是 Docker 中负责启动和停止容器底层任务的小专门部分即可。\n\n现阶段，了解 Kubernetes 的重点是它是比 Docker\
  \ 更高级的平台，并且目前使用 Docker 进行底层的容器操作。\n\n![](img/figure1-1.png)\n\n我有以下资源可以帮助你学习 Kubernetes：\n\
  \n*   Kubernetes 书\n\n*   入门级 Kubernetes 视频课程\n\n*   Kubernetes 101 视频课程\n\n入门级\
  \ Kubernetes 可访问 pluralsight.com，Kubernetes 101 可访问 udemy.com。\n\n## 章节总结\n\n\n\n\
  \n我们曾生活在这样的世界：每当业务需要一个新的应用程序时，我们必须购买一台全新的服务器。VMware 的出现使我们能够从公司的新及现有 IT 资产中挖掘出更多价值。尽管\
  \ VMware 和虚拟机模型很好，但它们并非完美。在 VMware 和虚拟机程序成功之后，出现了一种更高效、更轻级的虚拟化技术，称为容器（containers）。但容器最初很难实现，仅存在于那些拥有\
  \ Linux 内核工程师的互联网巨头的数据中心里。`Docker, Inc.` 的出现，让容器突然变得大众可用。\n\n说起 `Docker`……让我们来看看\
  \ Docker 是谁、为什么存在以及它到底是什么吧！\n\n# 2: Docker\n\n任何关于容器的书籍或对话，如果没有提到 `Docker` 都是不完整的。但当我们说“Docker”时，我们指的是以下两者之一：\n\
  \n1. `Docker, Inc.` 公司\n2. `Docker` 技术\n\n## Docker - 简要概述 (TLDR)\n\nDocker 是一种运行在\
  \ Linux 和 Windows 上的软件。它可以创建、管理、甚至可以编排容器。该软件目前由 `Moby` 开源项目的各种工具构建而成。`Docker, Inc.`\
  \ 是创建该技术的公司，并继续创造技术和解决方案，使得让笔记本电脑上的代码在云端运行变得更容易。\n\n这就是快速版本。让我们深入探讨一点。\n\n### Docker,\
  \ Inc.\n\n`Docker, Inc.` 是一家总部位于旧金山的科技公司，由出生于法国的美国开发者兼企业家 Solomon Hykes 创立。Solomon\
  \ 现在已不再任职。\n\n![Figure 2.1 Docker, Inc. logo.](img/figure2-1.png)\n\n图 2.1 Docker,\
  \ Inc. 图标。\n\n该公司起初是一家名为 `dotCloud` 的平台即服务（PaaS）提供商。在后台，`dotCloud` 平台构建在 Linux 容器之上的。为了帮助创建和管理这些容器，他们开发了一个内部工具，并最终将其命名为“Docker”。这就是\
  \ `Docker` 技术的诞生！\n\n同样有趣的一点是，“Docker”一词源于一个英国表达式，意思是“码头工人”（dock worker）——即在船只上装卸货物的人。\n\
  \n2013 年，他们放弃了陷入困境的 PaaS 业务，将公司重命名为“Docker, Inc.”，并专注于向世界引入 Docker 和容器。他们在将容器引入主流\
  \ IT 方面取得了巨大的成功，但到目前为止，他们一直在努力实现营利性的业务模式。\n\n在编写本文时，`Docker, Inc.` 专注于他们的 `Docker\
  \ Desktop` 和 `Docker Hub` 产品，以简化从笔记本电脑源代码到云端运行应用程序的流程。\n\n在整本书中，当我们指代 `Docker` 公司时，将使用“Docker,\
  \ Inc.”这一术语。“Docker”一词的所有其他用法都将指代该技术。\n\n### Docker 技术\n\n当大多数人谈论 `Docker` 时，他们指的是运行容器的技术。然而，在提到作为技术的\
  \ `Docker` 时，至少有三点需要注意：\n\n1. 运行时（runtime）\n2. 守护进程（daemon，又称 engine）\n3. 编排器（orchestrator）\n\
  \n图 2.2 显示了这三层，并在解释每个组件时将作为一个有用的参考。我们将在书的后部分深入探讨每个部分。\n\n![Figure 2.2 Docker architecture.](img/figure2-2.png)\n\
  \n图 2.2 Docker 架构。\n\n运行时运行在最低层，负责启动和停止容器。低层运行时是 `runc`。高层运行时是 `containerd`。它管理镜像、卷、网络以及容器的整个生命周期。\n\
  \n## 开放容器倡议 (OCI)\n\n在本章开头，我们提到了[开放容器倡议](https://www.opencontainers.org)。\n\n同样，任何关于\
  \ OCI 的讨论，如果没有提到一点历史都是不完整的。正如所有的历史记载一样，你所得到的版本取决于是谁在讲述。\n\n从第一天起，Docker 的使用量就疯狂增长。越来越多的人以越来越多的方式使用它。因此，某些方方感到沮丧是不可避免的。这是正常且健康的。\n\
  \n这段历史的简要概述是：一家名为 CoreOS 的公司（被红帽收购，而红帽又被 IBM 收购）不喜欢 Docker 处理某些事情的方式。因此，他们创建了一个名为\
  \ `appc` (https://github.com/appc/spec/) 的开放标准，定义了镜像格式和容器运行时等内容。他们还创建了该规范的实现，称为\
  \ `rkt`（读作“rocket”）。\n\n这使得容器生态系统处于一种尴尬的境地，存在两个竞争的标准。虽然竞争通常是一件好事，但*竞争的标准*通常不是。它们会导致困惑并减慢用户的采用速度。这对任何人都没有处。\n\
  \n考虑到这一点，大家尽力表现像成年人一样行事，并聚在一起形成了 OCI —— 一个治理容器标准的轻量级敏捷委员会。\n\n在编写本文时，OCI 已经发布了两个规范（标准）：\n\
  \n*   `image-spec` (https://github.com/opencontainers/image-spec)\n*   `runtime-spec`\
  \ (https://github.com/opencontainers/runtime-spec)\n\n在提到这两个标准时，经常使用的一个类比是*铁轨*。这两个标准就像是商约定了铁轨的标准尺寸和属性，让其他人可以自由地建造更好的火车、更好的车厢、更好的信号系统、更好的车站……而所有人都很安全，因为他们知道它们可以在标准的轨道上运行。没有人想要两个相互竞争的铁轨尺寸标准！\n\
  \n可以说，这两个 OCI 规范对 Docker 核心产品的架构和设计产生了重大影响。从 Docker 1.11 开始，Docker 引擎架构就符合 OCI 运行时规范。\n\
  \nOCI 在 Linux 基金会的赞助下组织。\n\n## 章节总结\n\n在本章中，我们学习了 `Docker, Inc.` 公司和 `Docker` 技术。\n\
  \n\n\n\nDocker, Inc. 是一家位于旧金山的科技公司，抱着改变我们开发软件方式的理想。他们可以说是现代容器革命的*先行者*和推动者。\n\nDocker\
  \ 技术专注于运行和管理应用容器。它运行在 Linux 和 Windows 上，几乎可以安装在任何地方，并且是目前 Kubernetes 使用的最流行的容器运行时。\n\
  \n开放容器倡议（OCI）在标准化容器运行时格式和容器镜像格式方面发挥了关键作用。\n\n# 3: 安装 Docker\n\n安装 Docker 有许多方法和场所。有\
  \ Windows、Mac 和 Linux。你可以安装在云端、本地部署，或者在你的笔记本电脑上。还有手动安装、脚本化安装、基于向导的安装……安装 Docker\
  \ 的方法和地方真的多得数数。\n\n但不要被这些吓到。它们其实都非常简单，只需搜索“如何在 <此处插入你的选择> 上安装 docker”，就能找到易于遵循的最新指令。因此，我们不会在这里浪费太多空间。我们将涵盖以下内容：\n\
  \n*   Docker Desktop 安装于：\n    *   Windows 10\n    *   Mac\n*   服务器版安装于：\n    *\
  \   Linux\n    *   Windows Server 2019\n*   Play with Docker\n\n## Docker Desktop\n\
  \nDocker Desktop 是 Docker, Inc. 的一个封装产品。它运行在 64 位的 Windows 10 和 Mac 上，下载和安装非常方便。\n\
  \n安装完成后，你将拥有单引擎 Docker 环境，非常适合开发目的。它包含了 `Docker Compose`，并且你可以选择启用单节点 Kubernetes\
  \ 集群。\n\n早期版本的 Docker Desktop 在开发过程中经历了一些功能滞后，因为它采用了*稳定性优先，功能次之*的方法。然而，该产品现在已经成熟，是\
  \ Docker, Inc. 关注的核心技术，旨在让你更容易从笔记本电脑上的源代码转向云端应用程序。\n\nWindows 10 上的 Docker Desktop\
  \ 可以运行原生 Windows 容器，也可以运行 Linux 容器。Mac 上的 Docker Desktop 只能运行 Linux 容器。\n\n### Windows\
  \ 环境要求\n\nWindows 版 Docker Desktop 需要满足所有条件：\n\n*   64 位的 Windows 10 专业版/企业版/教育版（不支持家庭版）\n\
  *   系统的 BIOS 必须启用硬件虚拟化支持\n*   Windows 中必须启用 *Hyper-V* 和 *Containers*（容器）功能\n\n安装程序可以启用\
  \ `Hyper-V` 和 `Containers` 功能，但在 BIOS 中启用硬件虚拟化是你的责任（更改系统 BIOS 中的任何内容时请务必小心）。\n\n\
  ### 在 Windows 10 上安装 Docker Desktop\n\n在 Google 上搜索“install Docker Desktop”。这会引导你进入相关的下载页面，你可以在那里下载安装程序并按照说明操作。就是简单！\n\
  \n在编写时，你可以在 `stable channel`（稳定通道）和 `edge channel`（边缘通道）之间进行选择。名称自言易懂，`edge channel`\
  \ 提供更早的尖端功能访问。\n\n安装完成后，你可能需要从 Windows 开始菜单手动启动 Docker Desktop。启动可能需要一分钟，你可以通过屏幕底部\
  \ Windows 任务栏上的动画鲸鱼图标查看启动进度。\n\n一旦运行，你可以打开 PowerShell 提示符并输入一些简单的 `docker` 命令。\n\
  \n```\n$ docker version\nClient: Docker Engine - Community\n Version:          \
  \ 19.03.8\n API version:       1.40\n Go version:        go1.12.17\n Git commit:\
  \        afacb8b\n Built:             Wed Mar 11 01:23:10 2020\n OS/Arch:      \
  \     windows/amd64\n Experimental:      true\nServer: Docker Engine - Community\n\
  \ Engine:\n  Version:          19.03.8\n  API version:      1.40 (minimum version\
  \ 1.12)\n  Go version:       go1.12.17\n  Git commit:       afacb8b\n  Built:  \
  \          Wed Mar 11 01:29:16 2020\n  OS/Arch:          linux/amd64\n  Experimental:\
  \     true\n<Snip>\n```\n\n注意输出中 **Server** 组件显示为 `OS/Arch: linux/amd64`。这是因为默认安装假设你将处理\
  \ Linux 容器。它通过在轻量级 Linux Hyper-V VM 中运行 Docker 进程来实现。\n\n切换到 Windows 容器只需右键点击 Windows\
  \ 通知区域中的 Docker 鲸鱼图标并选择 `Switch to Windows containers...`（切换到 Windows 容器）。你也可以通过命令行使用以下命令实现相同（位于\
  \ `\\Program Files\\Docker\\Docker` 目录）：\n\n```\nC:\\Program Files\\Docker\\Docker>\
  \ .\\dockercli -SwitchDaemon\n```\n\n请注意，任何现有的 Linux 容器将在后台继续运行，但在切换回 Linux 容器模式之前，你无法看到或管理它们。\n\
  \n如果尚未启用 Windows Containers 功能，系统会提示你启用。\n\n运行另一个 `docker version` 命令，并在输出的 Server\
  \ 部分查找 `windows/amd64` 行。\n\n```\nC:\\> docker version\nClient:\n <Snip>\n\nServer:\n\
  \ Engine:\n  Version:      19.03.8\n  API version:  1.40 (minimum version 1.24)\n\
  \  Go version:   go1.12.17\n  Git commit:   afacb8b\n  Built:        Wed Mar 11\
  \ 01:29:16 2020\n  OS/Arch:       linux/amd64\n  Experimental: true\n```\n\n你现在可以运行并管理\
  \ Windows 容器（运行应用程序）。\n\n恭喜，你现在 Windows 10 上有了 Docker 安装。\n\n### 在 Mac 上安装 Docker\
  \ Desktop\n\nMac 版 Docker Desktop 类似于 Windows 10 版 Docker Desktop——它是 Docker, Inc.\
  \ 的一个封装产品，带有简单的安装程序，让你获得适合开发的单引擎安装。你还可以启用单节点 Kubernetes 集群。\n\n稍后我们将查看简单的安装，但在之前需要注意的是，Mac\
  \ 版 *Docker Desktop* 并不是原生运行在 Mac 内核上的。在后台，Docker 进程运行在一个轻量级虚拟机中，并无缝地将进程和 API 暴露给\
  \ Mac 环境。这意味着你可以在 Mac 上打开终端并使用常规 Docker 命令。\n\n尽管这在 Mac 上运行很顺畅，但不要忘记底层是 Linux 的\
  \ Docker——因此它只适用于 Linux 容器。不过这是好事，因为容器操作就在这里。\n\n图 3 显示了 Mac 版 Docker Desktop 的高层架构。\n\
  \n![图 3](img/figure3-1.png)\n\n图 3\n\n在 Mac 上安装 Docker Desktop 最简单的方法是在 Google 上搜索“install\
  \ Docker Desktop”。点击链接进入下载页面，你可以在那里下载安装程序并按照说明操作。就是这么简单。\n\n与 Windows 10 版一样，你可以选择\
  \ `stable channel` 或 `edge channel`——`edge channel` 提供更早的尖端功能访问。\n\n下载安装程序并按照步骤说明操作。\n\
  \n安装完成后，你可能需要从 MacOS 启动板手动启动 Docker Desktop。一旦 Docker Desktop 启动，鲸鱼将停止动画。你可以点击鲸鱼图标来管理\
  \ Docker Desktop。\n\n打开终端窗口并运行一些常规 Docker 命令。尝试以下操作。\n\n\n\n\n\n```\n$ docker version\n\
  Client: Docker Engine - Community\n Version:           19.03.8\n API version:  \
  \     1.40\n Go version:        go1.12.17\n Git commit:        afacb8b\n Built:\
  \             Wed Mar 11 01:21:11 2020\n OS/Arch:           darwin/amd64\n Experimental:\
  \      true\n\nServer: Docker Engine - Community\n Engine:\n  Version:         \
  \ 19.03.8\n  API version:      1.40 (minimum version 1.12)\n  Go version:      \
  \ go1.12.17\n  Git commit:       afacb8b\n  Built:            Wed Mar 11 01:29:16\
  \ 2020\n  OS/Arch:          linux/amd64\n  Experimental:     true\n```\n\n注意，`Server`\
  \ 组件的 `OS/Arch:` 显示为 `linux/amd64`。这是因为守护进程运行在之前之前提到的 Linux 虚拟机内部。`Client` 组件是一个原生\
  \ Mac 应用程序，直接运行在 Mac OS Darwin 内核上（`OS/Arch: darwin/amd64`）。\n\n你现在可以在 Mac 上使用 Docker\
  \ 了。\n\n## 在 Linux 上安装 Docker\n\n在 Linux 上安装 Docker 有许多方法，且大多数方法都很简单。最困难的部分通常是决定使用哪种\
  \ Linux 发行版。\n\n互联网上有许多关于在多种 Linux 发行版上安装和运行 Docker 的指南。在本节中我们将查看在 Ubuntu Linux\
  \ 20.04 LTS 上安装的方法之一。该步骤假设你已经安装了 Linux 并已登录。\n\n1. 更新 `apt` 包索引。\n\n```bash\n$ sudo\
  \ apt-get update\nGet:1 http://eu-west-1.ec2.archive.ubuntu.com/ubuntu focal InRelease\
  \ [265 kB]\n...\n```\n\n2. 从官方仓库安装 Docker。\n\n```bash\n$ sudo apt-get install docker.io\n\
  Reading package lists... Done\nBuilding dependency tree   \n...\n```\n\nDocker 现在已安装，你可以通过运行一些命令来对其测试。\n\
  \n```\n$ sudo docker --version\nDocker version 19.03.8, build afacb8b7f0\n\n$ sudo\
  \ docker info\nServer:\n Containers: 0\n  Running: 0\n  Paused: 0\n  Stopped: 0\n\
  \  ...\n```\n\n## 在 Windows Server 2019 上安装 Docker\n\n大多数公共云平台提供预装了 Docker 的 Windows\
  \ Server 2019 副本。只需选择其中一个——例如 AWS 上的 Microsoft Windows Server 2019 Base with Containers\
  \ - `ami-0b809eef92577a4f`——即可开始。\n\n在其他版本的 Windows Server 2019 上安装 Docker 非常简单。\n\
  \n以下步骤假设你已安装了 Windows Server 2019 并以管理员权限登录。\n\n1. 安装 Docker 提供程序\n\n在 PowerShell\
  \ 终端中运行此命令。\n\n```powershell\nPS C:\\> Install-Module DockerMsftProvider -Force\n\
  NuGet provider is required to continue\nPowerShellGet requires NuGet provider version\n\
  <Snip>\nDo you want PowerShellGet to install and import the NuGet provider now?\n\
  [Y] Yes  [N] No  [S] Suspend  [?] Help (default is \"Y\"): y\n```\n\n2. 安装 Docker\n\
  \n```powershell\nPS C:\\> Install-Package Docker -ProviderName DockerMsftProvider\
  \ -Force\nWARNING: a restart is required to enable the containers feature. Please\
  \ restart.\nName       Version     Source           Summary\n----       -------\
  \     ------           -------\nDocker     19.03.5     DockerDefault    Contains\
  \ Docker EE for use with Windows Server.\n```\n\n3. 重启你的机器\n\n恭喜，Docker 现在已安装并配置为系统启动时自动启动。\n\
  \n运行一些命令来验证 Docker 是否工作。\n\n```powershell\nPS C:\\> docker version\nClient: Docker\
  \ Engine - Enterprise\n Version:           19.03.5\n API version:       1.40\n Go\
  \ version:        go1.12.12\n Git commit:        2ee0c57608\n Built:           \
  \  11/13/2019 08:00:16\n OS/Arch:           windows/amd64\n Experimental:      false\n\
  Server: Docker Engine - Enterprise\n Engine:\n  Version:          19.03.5\n  API\
  \ version:      1.40 (minimum version 1.24)\n  Go version:       go1.12.12\n  Git\
  \ commit:       2ee0c57608\n  Built:            11/13/2019 07:58:51\n  OS/Arch:\
  \          windows/amd64\n  Experimental:     false\n```\n\nDocker 现在已安装，你可以准备开始使用\
  \ Windows 容器了。\n\n## 玩转 Docker\n\nPlay with Docker (PWD) 提供了一个免费且功能完整的 Docker 实验场，持续\
  \ 4 小时。你可以添加多个节点，甚至将它们组成 swarm 集。\n\n有时性能可能会慢，但对于一个免费服务来说非常棒了！\n\n访问 https://labs.play-with-docker.com/\n\
  \n## 章节总结\n\n你可以在地方运行 Docker，大多数安装方法都很简单。\n\n# 第 4 章：概述\n\n本章的目标是描述 Docker 是什么。我们将分为两个部分：\n\
  \n*   开发者视角\n*   运维视角\n\n### 运维视角\n\n当你安装 Docker 时，你会得到两个主要组件：\n\n*   Docker 客户端\n\
  *   Docker 守护进程（有时称为 Docker 引擎）\n\n守护进程实现了运行时、API 以及运行 Docker 的其他所有。\n\n在默认 Linux\
  \ 安装中，客户端通过本地 Unix Socket `/var/run/docker.sock` 与守护进程通信。在 Windows 上，这通过命名管道 `npipe:////pipe/docker_engine`\
  \ 实现。安装后，可以使用 `docker version` 命令测试客户端和守护进程（服务器）是否运行并正常通信。\n\n```\n> docker version\n\
  Client: Docker Engine - Community\n Version:       19.03.8\n API version:   1.40\n\
  \ Go version:    go1.12.17\n Git commit:    afacb8b\n Built: Wed Mar 11 01:23:10\
  \ 2020\n OS/Arch:       linux/amd64\n Experimental:  false\n\nServer: Docker Engine\
  \ - Community\n Engine:\n  Version:          19.03.8\n  API version:      1.40 (minimum\
  \ version 1.12)\n  Go version:       go1.12.17\n  Git commit:       afacb8b\n  Built:\
  \            Wed Mar 11 01:29:16 2020\n  OS/Arch:          linux/amd64\n  Experimental:\
  \     false\n containerd:\n  Version:          v1.2.13\n  ...\n```\n\n如果你从 `Client`\
  \ **和** `Server` 处获得了响应，你就可以开始使用了。\n\n\n\n\n\n如果你正在使用 Linux 并且收到来自 `Server` 组件的错误响应，请确保\
  \ Docker 正在运行。此外，尝试在命令前加上 `sudo` 重新运行：`sudo docker version`。如果使用 `sudo` 可以运行，你将需要将用户账户添加到本地的\
  \ `docker` 组中，或者在书中剩余的命令前加上 `sudo`。\n\n## 镜像\n\n将 Docker 镜像视为一个包含操作系统文件系统、应用程序以及所有应用程序依赖项的对象是有用的。如果你从事运维工作，它就像一个虚拟机模板。虚拟机模板本质上是一个停止状态的虚拟机。在\
  \ Docker 世界中，镜像实际上是一个停止的容器。如果你是一个开发者，可以将镜像想象为一个 `class`。\n\n在你的 Docker 宿主机上运行 `docker\
  \ image ls` 命令。\n\n```\n$ docker image ls\nREPOSITORY    TAG        IMAGE ID   \
  \    CREATED       SIZE\n```\n\n如果你是从新安装的 Docker 宿主机或通过 Play With Docker 进行操作，你将没有任何镜像，输出看起来和之前的输出一样。\n\
  \n将镜像获取到你的 Docker 宿主机被称为“拉取”（pulling）。如果你在学习 Linux 部分，请拉取 `ubuntu:latest` 镜像。如果你在学习\
  \ Windows 部分，请拉取 `mcr.microsoft.com/powershell:lts-nanoserver-1903` 镜像。\n\n```\n\
  $ docker image pull ubuntu:latest\nlatest: Pulling from library/ubuntu\n50aff78429b1:\
  \ Pull complete\nf6d82e297bce: Pull complete\n275abb2c8a6f: Pull complete\n9f15a39356d:\
  \ Pull complete\nfc0342a94c89: Pull complete\nDigest: sha256:fbaf303...c0ea5d1212\n\
  Status: Downloaded newer image for ubuntu:latest\n```\n\nWindows 镜像可能很大，并且需要很长时间来拉取。\n\
  \n再次运行 `docker image ls` 命令查看你刚刚拉取的镜像。\n\n```\n$ docker images\nREPOSITORY     \
  \ TAG      IMAGE ID        CREATED         SIZE\nubuntu          latest   1d622ef86b13\
  \    16 hours ago    73.9MB\n```\n\n我们将在稍后的章节中详细介绍镜像存储的位置及其内部内容。\n\n目前，只需知道镜像包含了足够的操作系统（OS）以及运行其旨在设计的任何应用程序的所有代码和依赖项即可。我们拉取的\
  \ `ubuntu` 镜像包含了精简版的 Ubuntu Linux 文件系统，包括一些常用的 Ubuntu 工具。而 `mcr.microsoft.com/powershell:lts-nanoserver-1903`\
  \ 镜像包含一个 Windows Server Core OS 加上 PowerShell。\n\n如果你拉取一个应用程序容器，例如 `nginx` 或 `mcr.microsoft.com/windows/servercore/iis`，你将获得一个包含某些操作系统以及运行\
  \ `NGINX` 或 `IIS` 代码的镜像。\n\n同样值得注意的是，每个镜像都有自己唯一的 ID。在引用镜像时，你可以使用 `IDs` 或名称进行引用。如果你在使用镜像\
  \ ID，通常只需要输入 ID 的前几个字符就足够了——只要它是唯一的，Docker 就会知道你指的是哪一个镜像。\n\n## 容器\n\n现在我们已经在本地拉取了镜像，可以使用\
  \ `docker container run` 命令从它启动一个容器。\n\n对于 Linux：\n\n```\n$ docker container run\
  \ -it ubuntu:latest /bin/bash\nroot@6dc20d508db0:/#\n```\n\n对于 Windows：\n\n```\n\
  > docker container run -it mcr.microsoft.com/powershell:lts-nanoserver-1903 pwsh.exe\n\
  \nPowerShell 7.0.0\nCopyright (C) Microsoft Corporation. All rights reserved.\n\
  PS C:\\>\n```\n\n仔细观察上述命令的输出。你应该注意到 shell 提示符在每个实例中发生了变化。这是因为 `-it` 标志将你的 shell\
  \ 切换到了容器的终端——你正身处新容器内部！\n\n让我们检查一下 `docker container run` 命令。\n\n`docker container\
  \ run` 通知 Docker 守护进程启动一个新的容器。`-it` 标志告诉 Docker 让容器变为交互式的并附加当前的 shell。\n\n\n\n\n\
  你可以使用 `docker container exec` 命令将你的 shell 附加到运行中容器的终端。由于上步骤中的容器仍在运行，让我们为它建立一个新连接。\n\
  \n### Linux 示例\n\n此示例引用了一个名为“vigilant_borg”的容器。你的容器名称会不同，请记住将“vigilant_borg”替换为\
  \ Docker 宿主机上运行的容器名称或 ID。\n\n```bash\n$ docker container exec -it vigilant_borg\
  \ bash\nroot@6dc20d508db0:/#\n```\n\n### Windows 示例\n\n此示例引用了一个名为“pensive_hamilton”的容器。你的容器名称会不同，请记住将“pensive_hamilton”替换为\
  \ Docker 宿主机上运行的容器名称或 ID。\n\n```bash\n> docker container exec -it pensive_hamilton\
  \ pwsh.exe\n\nPowerShell 7.0.0\nCopyright (C) Microsoft Corporation. All rights\
  \ reserved.\nPS C:\\>\n```\n\n注意，你的 shell 提示符再次发生了变化。你再次登录了容器。\n\n`docker container\
  \ exec` 命令的格式为：`docker container exec <options> <container-name or container-id>\
  \ <command/app>`。在我们的示例中，我们使用了 `-it` 选项将 shell 附加到容器的 shell。我们通过名称引用容器，并告诉它运行 `bash`\
  \ shell（Windows 示例中为 PowerShell）。我们也可以轻松地通过十六进制 ID 引用容器。\n\n按下 `Ctrl-PQ` 再次退出容器。\n\
  \n你的 shell 提示符应该返回到 Docker 宿主机。\n\n再次运行 `docker container ls` 命令以验证你的容器仍在运行。\n\n\
  ```bash\n$ docker container ls\nCONTAINER ID   IMAGE          COMMAND       CREATED\
  \  STATUS    NAMES\n6dc20d508db0   ubuntu:latest  \"/bin/bash\"   9 mins   Up 9\
  \ min  vigilant_borg\n```\n\n使用使用 `docker container stop` 和 `docker container rm`\
  \ 命令停止并删除容器。请记住替换为你自己的容器名称/ID。\n\n```bash\n$ docker container stop vigilant_borg\n\
  vigilant_borg\n\n$ docker container rm vigilant_borg\nvigilant_borg\n```\n\n通过运行带有\
  \ `-a` 标志的 `docker container ls` 命令来验证容器已成功删除。添加 `-a` 通知 Docker 列出所有容器，即使是已停止状态的。\n\
  \n```bash\n$ docker container ls -a\nCONTAINER ID    IMAGE    COMMAND    CREATED\
  \    STATUS    PORTS    NAMES\n```\n\n你刚刚拉取了一个 Docker 镜像，从它启动了一个容器，附加到它，在其中执行了命令，停止了它并删除了它。\n\
  \n### 开发者视角\n\n容器的核心在于应用。\n\n在本节中，我们将从 Git 仓库克隆一个应用，检查其 `Dockerfile`，将其容器化，并作为容器运行。\n\
  \nLinux 应用可以从此处克隆：https://github.com/nigelpoulton/psweb.git\n\nWindows 应用可以从此处克隆：https://github.com/nigelpoulton/win-web.git\n\
  \n本节的其余部分将重点关注 Linux NGINX 示例。然而，两个示例都是容器化简单的 Web 应用，因此过程是相同的。如果 Windows 示例中有任何差异，我们将进行标注以帮助你跟上操作。\n\
  \n在 Docker 宿主机的终端上运行所有以下命令。\n\n在本地克隆仓库。这将应用程序代码拉取到你的本地 Docker 宿主机，准备好对其进行容器化。\n\n\
  如果你正在学习 Windows 示例，请确保将以下仓库替换为 Windows 仓库。\n\n```bash\n$ git clone https://github.com/nigelpoulton/psweb.git\n\
  Cloning into 'psweb'...\nremote: Counting objects: 15, done.\nremote: Compressing\
  \ objects: 100% (11/11), done.\nremote: Total 15 (delta 2), reused 15 (delta 2),\
  \ pack-reused 0\nUnpacking objects: 100% (15/15), done.\nChecking connectivity...\
  \ done.\n```\n\n进入克隆仓库的目录并列出其内容。\n\n```bash\n$ cd psweb\n$ ls -l\ntotal 40\n-rw-r--r--@\
  \ 1 ubuntu ubuntu  338 24 Apr 19:29 Dockerfile\n-rw-r--r--@ 1 ubuntu ubuntu  396\
  \ 24 Apr 19:32 README.md\n-rw-r--r--@ 1 ubuntu ubuntu  341 24 Apr 19:29 app.js\n\
  -rw-r--r--  1 ubuntu ubuntu  216 24 Apr 19:29 circle.yml\n-rw-r--r--@ 1 ubuntu ubuntu\
  \  377 24 Apr 19:36 package.json\ndrwxr-xr-x  4 ubuntu ubuntu  128 24 Apr 19:29\
  \ test\ndrwxr-xr-x  3 ubuntu ubuntu   96 24 Apr 19:29 views\n```\n\nLinux 示例是一个简单的\
  \ nodejs web 应用。Windows 示例是一个运行某些静态 HTML 的 IIS 服务器。\n\n两个 Git 仓库都包含一个名为 `Dockerfile`\
  \ 的文件。这是一个纯文本文件，告诉 Docker 如何将应用及其依赖构建成 Docker 镜像。\n\n列出 `Dockerfile` 的内容。\n\n```bash\n\
  $ cat Dockerfile\n\nFROM alpine\nLABEL maintainer=\"nigelpoulton@hotmail.com\"\n\
  RUN apk add\nCOPY . /src\nWORKDIR /src\nRUN npm install\nEXPOSE 8080\nENTRYPOINT\
  \ [\"node\", \"app.js\"]\n```\n\n\n\n\n\n这种 `big picture` 视角将帮助你理解接下来的章节，在那些章节中我们将深入探讨镜像和容器。\n\
  \n# 第二部分：技术细节\n\n# 第 5 章：Docker Engine\n\n在本章中，我们将快速查看 `Docker Engine` 的内部原理。\n\n\
  你可以在不理解本章涵盖的任何内容的情况下使用 Docker。所以，请尽管跳过它。然而，要成为任何领域的真正大师，你需要了解底层发生了什么。因此，为了成为一个 `real`\
  \ 的 Docker 大师，你需要了解本章中的内容。\n\n这是一个基于理论的章节，没有动手实操练习。\n\n由于本章是书籍`技术章节`的一部分，我们将采用三层法，将章节分为三个部分：\n\
  \n*   **TLDR（要点总结）**：两或三段快速阅读的内容，你可以在排队买咖啡时阅读。\n*   **Deep dive（深度解析）**：进入细节的长篇内容。\n\
  *   **Commands（命令）**：对我们学过的命令进行快速回顾。\n\n让我们开始学习 `Docker Engine` 吧。\n\n## Docker\
  \ Engine - TLDR\n\n`Docker engine` 是运行和管理容器的核心软件。我们通常简单地称之为 `Docker`。如果你对 VMware\
  \ 有所了解，那么将其类比为 `ESXi` 可能很有帮助。\n\nDocker engine 在设计上是模块化的，由许多小型专业化工具构建而成。在可能的情况下，这些工具基于开放标准，例如由开放容器倡议（`OCI`）维护的标准。\n\
  \n在许多方面，`Docker Engine` 就像汽车引擎——两者都是模块化的，并且通过连接许多小型专业化部件创建的：\n\n*   汽车引擎由许多协同工作的专业化部件组成——进气歧歧管、节气门、气缸、火花塞、排气歧管等。\n\
  *   `Docker Engine` 由许多协同创建和运行容器的专业化工具组成——`APIs`、执行驱动、运行时、`shims` 等。\n\n在编写时，构成\
  \ Docker engine 的主要组件有：`Docker daemon`、`containerd`、`runc` 以及网络和存储等各种插件。它们共同创建并运行容器。\n\
  \n图 5.1 显示了高层视图。\n\n![Figure 5.1](img/figure5-1.png)\n\n图 5.1\n\n在整本书中，我们提到 `runc`\
  \ 和 `containerd` 时使用小写的“r”和“c”。这意味着以 `runc` 或 `containerd` 开头的句子不会以大写字母开头。这是刻意为之，不是错误。\n\
  \n## Docker Engine - 深度解析\n\n当 Docker 首次发布时，Docker engine 有两个主要组件：\n\n*   `Docker\
  \ daemon`（下文简称为 daemon）\n*   `LXC`\n\n`Docker daemon` 是一个单体二进制文件。它包含了 `Docker client`、`Docker\
  \ API`、容器运行时、镜像构建以及 `much` 更多代码。\n\n`LXC` 为 daemon 提供了访问 Linux 内核中存在的容器基础构建块的权限。例如\
  \ `namespaces`（命名空间）和 `control groups (cgroups)`。\n\n图 5.2 显示了在旧版本的 Docker 中，daemon、`LXC`\
  \ 和操作系统是如何相互作用的。\n\n![Figure 5.2 Original Docker architecture](img/figure5-2.png)\n\
  \n图 5.2 原始 Docker 架构\n\n### 舍弃 LXC\n\n对 `LXC` 的依赖从一开始就存在问题。\n\n首先，`LXC` 是 Linux\
  \ 特定的。对于一个志在成为多平台的项目来说，这是一个问题。\n\n其次，依赖外部工具来处理项目如此核心的功能是一个巨大的风险，可能会阻碍开发。\n\n因此，Docker.\
  \ Inc. 开发了自己的名为 `libcontainer` 的工具来替代 LXC。\n\n\n\n\n正如之前所述，`containerd` 最初的设计目标是小型、轻量化，并专用于单一任务——容器生命周期操作。然而，随着时间的推移，它不断分支并承担了更多功能，如镜像拉取、卷和网络。\n\
  \n添加更多功能的原因之一是为了使其在其他项目中更容易使用。例如，在 Kubernetes 等项目中，`containerd` 能够推送和拉取镜像等额外操作是有益的。由于这些原因，`containerd`\
  \ 现在的功能远超简单的容器生命周期管理。然而，所有额外功能都是模块化且可选的，这意味着你可以根据需要选择。因此，可以将 `containerd` 包含在 Kubernetes\
  \ 等项目中，但仅提取你的项目所需的组件。\n\n`containerd` 由 `Docker, Inc.` 开发并捐给了云原生计算基金会（CNCF）。在本文编写时，`containerd`\
  \ 是一个完全毕业的 CNCF 项目，意味着它是稳定的并且被认为可以用于生产。你可以在此处查看最新的发布版本：\n\n* https://github.com/containerd/containerd/releases\n\
  \n### 启动新容器（示例）\n\n现在我们已经对大背景和部分历史有了了解，让我们来看看创建新容器的过程。\n\n启动容器最常用的方法是使用 `Docker\
  \ CLI`。以下 `docker container run` 命令将基于 `alpine:latest` 镜像启动一个简单的新容器。\n\n```\n$ docker\
  \ container run --name ctr1 -it alpine:latest sh\n```\n\n当你在 `Docker CLI` 中输入此类命令时，`Docker\
  \ client` 会将其转换为相应的 API 负载，并将其 POST 到由 `Docker daemon` 暴露的 API 端点上。\n\n该 API 实现在守护进程中，并可以通过本地套接字或网络暴露。在\
  \ Linux 上，套接字为 `/var/run/docker.sock`，在 Windows 上上是 `\\pipe\\docker_engine`。\n\n\
  一旦守护进程接收到创建新容器的命令，它就会调用 `containerd`。请记住，守护进程已经不再包含任何创建容器的代码了！\n\n守护进程通过 [gRPC](https://grpc.io/)\
  \ 上的 CRUD 风格 API 与 `containerd` 通信。\n\n尽管名字如此，但 `containerd` 实际上并不能创建容器。它使用 `runc`\
  \ 来实现这一点。它将所需的 Docker 镜像转换为 OCI 束（bundle），并告诉 `runc` 使用它来创建一个新容器。\n\n`runc` 与操作系统内核接口，以汇集创建容器所需的所有构建体（命名空间、cgroups\
  \ 等）。容器进程作为 `runc` 的子进程启动，一旦启动，`runc` 就会退出。\n\n搞定！容器现在已经启动了。\n\n该过程总结如图 5.4 所示。\n\
  \n![Figure 5.4](img/figure5-4.png)\n\n图 5.4\n\n### 这种模式的一个巨大优势\n\n将启动和管理容器的所有逻辑和代码从守护进程中移除，意味着整个容器运行时与\
  \ `Docker daemon` 解耦了。我们有时称其为“无守护进程容器”（daemonless containers），这使得能够对 `Docker daemon`\
  \ 进行维护和升级，而不会影响正在运行的容器！\n\n在旧模型中，所有容器运行时逻辑都实现在守护进程中，启动和停止守护进程将杀死主机上所有运行的容器。这在生产环境中是一个巨大的问题——尤其是考虑到\
  \ Docker 新版本的发布频率有多高时！每次守护进程升级都会杀死该主机上的所有容器——这可不好！\n\n幸运的是，这不再是一个问题了。\n\n### 这个\
  \ shim 到底是什么？\n\n本章中的图表显示了 shim 组件。\n\nshim 是实现无守护进程容器不可或的一部分（即我们刚才提到的为了守护进程升级等目的将运行容器与守护进程解耦）。\n\
  \n我们之前提到 `containerd` 使用 `runc` 来创建新容器。事实上，它为创建的每个容器都 fork 出一个新的 `runc` 实例。然而，一旦每个容器创建完成，父进程\
  \ `runc` 就会退出。这意味着我们可以运行数百个容器，而不需要运行数百个 `runc` 实例。\n\n一旦容器的父进程 `runc` 退出，相关的 `containerd-shim`\
  \ 进程就会成为容器的父进程。shim 作为容器父进程承担的一些职责包括：\n\n*   保持任何 `STDIN` 和 `STDOUT` 流打开，这样当守护进程重启时，容器不会因为管道关闭等原因终止。\n\
  *   向守护进程报告容器的退出状态。\n\n### 在 Linux 上的实现\n\n在 Linux 系统上，我们讨论的组件以如下独立的二进制文件实现：\n\n\
  *   `dockerd` (Docker 守护进程)\n*   `docker-containerd` (containerd)\n*   `docker-containerd-shim`\
  \ (shim)\n*   `docker-runc` (runc)\n\n你可以通过在 Docker 主机上运行 `ps` 命令来看到所有这些组件。显然，其中某些组件仅在系统有运行容器时才会存在。\n\
  \n### 守护进程的作用\n\n当所有的执行和运行时代码都从守护进程中剥离后，你可能会问：“守护进程中还剩下了什么？”\n\n显然，这个问题的答案会随着越来越多的功能被剥离和模块化而发生变化。然而，在本文编写时，仍然于守护进程中的某些主要功能包括：镜像管理、镜像构建、REST\
  \ API、身份验证、安全性、核心网络和编排。\n\n### 安全客户端与守护进程的通信\n\n让我们通过查看如何在网络上保护守护进程来结束本章内容。\n\n\
  Docker 实现了客户端-服务器模型。\n\n*   `client` 组件实现了 `CLI`\n*   `server (daemon)` 组件实现了功能，包括面向公共的\
  \ REST API\n\n客户端被称为 `docker`（Windows 上为 `docker.exe`），守护进程被称为 `dockerd`（Windows\
  \ 上为 `dockerd.exe`）。\n\n默认安装将它们放在同一主机上，并配置通过本地 IPC 套接字通信：\n\n*   Linux 上的 `/var/run/docker.sock`\n\
  *   Windows 上的 `//pipe/docker_engine`\n\n也可以配置它们通过网络通信。默认情况下，网络通信发生在端口 `2375/tcp`\
  \ 的不安全 HTTP 上。\n\n![Figure 5.5](img/figure5-5.png)\n\n图 5.5\n\n这种不安全的配置可能实验，但对其他任何都是不可接受的。\n\
  \n#### TLS 来救援！\n\nDocker 允许你强制客户端和守护进程接受通过 TLS 安全的网络连接。这对生产环境是推荐的，即使所有流量都在信任的内部网络中传输。\n\
  \n你可以保护客户端和守护进程。保护客户端强制客户端只连接到受信任证书颁发机构（CA）签名的 Docker 守护进程。保护守护进程强制守护进程只接受来自来自 CA\
  \ 证书的连接。两种模式结合安全性最高。\n\n我们将使用一个简单的实验环境来演示配置 Docker 守护进程模式和客户端模式 TLS 的过程。\n\n#####\
  \ 实验设置\n\n将在剩余示例中使用图 5.6 所示的实验设置。你的实验看起来会有不同，但客户端和守护进程能够通过名称解析彼此至关重要。\n\n![Figure\
  \ 5.6 Sample lab setup](img/figure5-6.png)\n\n图 5.6 实验设置\n\n高级流程将如下：\n\n1.  **配置\
  \ CA 和证书**\n2.  创建 CA\n3.  为守护进程创建并签名密钥\n4.  为客户端创建并签名密钥\n5.  分发密钥\n6.  **配置 Docker\
  \ 使用 TLS**\n7.  配置守护进程模式\n8.  配置客户端模式\n\n##### 创建 CA（自签名证书）\n\n\n\n\n只有在你正在进行实验且尚未拥有\
  \ CA 的情况下，才需要完成此步骤。此外，我们在这里构建 CA 是为了演示如何配置 Docker，我们并`不是`在尝试构建生产级的工具。\n\n在实验的 `CA`\
  \ 节点上运行以下命令。\n\n1. 为 CA 创建一个新的私钥。\n   在操作过程中你需要设置一个密码短。不要忘记它！\n   ```\n     $ openssl\
  \ genrsa -aes256 -out ca-key.pem 4096\n\n     Generating RSA private key, 4096 bit\
  \ long modulus\n     ...............................................++\n     ..++\n\
  \     e is 65537 (0x10001)\n     Enter pass phrase for ca-key.pem:\n     Verifying\
  \ - Enter pass phrase for ca-key.pem:\n   ```\n   当前目录下将生成名为 `ca-key.pem` 的新文件。这是\
  \ CA 的私钥。\n\n2. 使用 CA 的私钥生成公钥（证书）。\n   你需要输入上一步中的密码短。希望你没有忘记它 ;-)\n   ```\n    \
  \ $ openssl req -new -x509 -days 730 -key ca-key.pem -sha256 -out ca.pem\n   ```\n\
  \   这在工作目录中增加了第二个名为 `ca.pem` 的文件。这是 CA 的公钥，也称为“证书”。\n\n你现在当前目录下有两个文件：`ca-key.pem`\
  \ 和 `ca.pem`。它们是 CA 的密钥对，构成了 CA 的`身份`。此时，CA 已经准备就绪可以使用。\n\n### 为守护进程（daemon）创建密钥对\n\
  在此步骤中，我们将为 `node3` 上的 Docker 守护进程生成一个新的密钥对。这是一个四个步骤的过程：\n1. 创建私钥\n2. 创建签名请求\n3.\
  \ 添加 IP 地址并使其对 `server authorization`（服务器身份验证）有效\n4. 生成证书\n我们开始吧。\n\n从 CA (`node2`)\
  \ 运行这些命令。\n\n1. 为守护进程创建私钥。\n   ```\n     $ openssl genrsa -out daemon-key.pem 4096\n\
  \     <Snip>\n   ```\n   这在工作目录中创建了一个名为 `daemon-key.pem` 的新文件。这是守护进程节点的私钥。\n\n2.\
  \ 为 CA 创建证书签名请求 (CSR)，以便其为守护进程创建并签名证书。请确保为你的守护节点使用正确的 DNS 名称。示例使用了 `node3`。\n  \
  \ ```\n     $ openssl req -subj \"/CN=node3\" \\\n       -sha256 -new -key daemon-key.pem\
  \ -out daemon.csr\n   ```\n   你现在在工作目录中有了第四个文件。这是一个 CSR 文件，名为 `daemon.csr`。\n\n\
  3. 向证书添加所需的属性。\n   此步骤会创建一个文件，告诉 CA 在签名时为守护进程证书添加一些扩展属性。这些属性添加了守护进程的 DNS 名称和 IP\
  \ 地址，并配置证书对 `server authentication`（服务器身份验证）有效。\n   创建一个名为 `extfile.cnf` 的新文件并写入以下值。示例使用了图\
  \ 5.6 实验中守护节点的 DNS 名称和 IP。你环境中的值可能不同。\n   ```\n   subjectAltName = DNS:node3,IP:10.0.0.12\n\
  \   extendedKeyUsage = serverAuth\n   ```\n\n4. 生成证书。\n   此步骤使用 CSR 文件、CA 密钥以及 `extfile.cnf`\
  \ 文件来签名并配置守护进程证书。它将输出守护进程的公钥（证书）作为新文件 `daemon-cert.pem`。\n   ```\n     $ openssl\
  \ x509 -req -days 730 -sha256 \\\n       -in daemon.csr -CA ca.pem -CAkey ca-key.pem\
  \ \\\n       -CAcreateserial -out daemon-cert.pem -extfile extfile.cnf\n   ```\n\
  \   此时，你有了一个可以工作的 CA，以及一个用于保护 Docker 守护进程的 `node3` 密钥对。\n   在继续之前删除 CSR 和 `extfile.cnf`。\n\
  \   ```\n$ rm daemon.csr extfile.cnf\n```\n\n### 为客户端创建密钥对\n接下来的步骤将重复我们刚才为 `node3`\
  \ 执行的操作，但这次我们将为运行 Docker 客户端的 `node1` 执行操作。\n从 CA (`node2`) 运行所有命令。\n\n1. 为 `node1`\
  \ 创建私钥。\n   这将在工作目录中生成一个名为 `client-key.pem` 的新文件。\n   ```\n     $ openssl genrsa\
  \ -out client-key.pem 4096\n   ```\n2. 创建 CSR。确保为将作为安全 Docker 客户端的节点使用正确的 DNS 名称。示例使用了\
  \ `node1`。\n   ```\n     $ openssl req -subj '/CN=node1' -new -key client-key.pem\
  \ -out client.csr\n   ```\n   将在当前目录下创建一个名为 `client.csr` 的新文件。\n\n3. 创建名为 `extfile.cnf`\
  \ 的文件并填充以下值。这将使证书对 `client authentication`（客户端身份验证）有效。\n   ```\n   extendedKeyUsage\
  \ = clientAuth\n   ```\n\n4. 使用 CSR、CA 公私钥以及 `extfile.cnf` 文件为 `node1` 创建证书。这将在当前目录创建一个签名的客户端公钥新文件，名为\
  \ `client-cert.pem`。\n   ```\n     $ openssl x509 -req -days 730 -sha256 \\\n  \
  \     -in client.csr -CA ca.pem -CAkey ca-key.pem \\\n       -CAcreateserial -out\
  \ client-cert.pem -extfile extfile.cnf\n   ```\n   删除 CSR 和 `extfile.cnf` 文件，因为它们不再需要了。\n\
  \   ```\n$ rm client.csr extfile.cnf\n```\n\n\n\n\n*   `tlskey` 告诉 Docker 守护进程私钥的位置\n\
  *   `hosts` 告诉 Docker 守护进程绑定在哪些接字（sockets）上\n\n我们将在平台无关的 `daemon.json` 文件中配置这些。在\
  \ Linux 上，该文件位于 `/etc/docker/`，在 Windows 上则位于 `C:\\ProgramData\\Docker\\config\\\
  `。\n\n在运行安全 Docker 守护进程的节点（示例实验中的 `node3`）上执行所有后续操作。\n\n编辑 `daemon.json` 文件并添加以下行。此处假设用户名为\
  \ `ubuntu`，您的用户名可能不同。\n\n```\n{\n    \"hosts\": [\"tcp://node3:2376\"],\n    \"\
  tls\": true,\n    \"tlsverify\": true,\n    \"tlscacert\": \"/home/ubuntu/.docker/ca.pem\"\
  ,\n    \"tlscert\": \"/home/ubuntu/.docker/cert.pem\",\n    \"tlskey\": \"/home/ubuntu/.docker/key.pem\"\
  \n}\n```\n\n**警告！** 运行 `systemd` 的 Linux 系统不允许您在 `daemon.json` 中使用 `hosts` 选项。相反，您必须在\
  \ systemd 覆盖文件中指定它。您可能可以使用 `sudo systemctl edit docker` 命令来实现此操作。这将编辑器打开一个名为 `/etc/systemd/system/docker.service.d/override.conf`\
  \ 的新文件。添加以下三行并保存文件。\n\n```\n[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H\
  \ tcp://node3:2376\n```\n\n现在 TLS 和 host 选项已设置完毕，您需要重启 Docker。\n\n一旦 Docker 重启，您可以通过检查\
  \ `ps` 命令的输出来确认新的 `hosts` 值是否已生效。\n\n```\n$ ps -elf | grep dockerd\n4 S root  ...\
  \ /usr/bin/dockerd -H tcp://node3:2376\n```\n\n命令输出中存在 `-H tcp://node3:2376` 表明守护进程正在监听网络。端口\
  \ `2376` 是 Docker 使用 TLS 的标准端口。`2375` 是默认的不安全端口。\n\n此时，从 `node1` 运行 `docker version`\
  \ 等命令将无法作用。这是因为**守护进程**已配置为监听网络，但**Docker 客户端**仍在尝试使用本地 IPC 接字。再次尝试该命令，但这次添加 `-H\
  \ tcp://node3:2376` 标志。\n\n```\n$ docker -H tcp://node3:2376 version\nClient:\n\
  \ Version:       19.03.8\n API version:   1.40\n <Snip>\nGet http://daemon:2376/v1.35/version:\
  \ net/http: HTTP/1.x transport connection broken: \nmalformed HTTP response \"\\\
  x15\\x03\\x01\\x00\\x02\\x02\".\n* Are you trying to connect to a TLS-enabled daemon\
  \ without TLS?\n```\n\n命令看起来好多了，但仍然无法工作。这是因为守护进程拒绝所有来自未验证客户端的连接。\n\n恭喜。Docker 守护进程已配置为监听网络，并拒绝来自未验证客户端的连接。\n\
  \n让我们配置 `node1` 上的 Docker 客户端以使用 TLS。\n\n### 为 Docker 客户端配置 TLS\n\n在本节中，您将为 `node1`\
  \ 上的 Docker 客户端配置两项内容：\n\n*   通过网络连接到远程守护进程\n*   对所有 `docker` 命令签名\n\n在运行安全 Docker\
  \ 客户端的节点（示例实验中的 `node1`）上执行所有后续操作。\n\n导出以下环境变量，以配置客户端通过网络连接到远程守护进程。客户端必须能够通过名称连接到守护进程使其才能生效。\n\
  \n```\nexport DOCKER_HOST=tcp://node3:2376\n```\n\n尝试以下命令。\n\n```\n$ docker version\n\
  Client:\n Version:       19.03.8\n<Snip>\nGet http://daemon:2376/v1.35/version:\
  \ net/http: HTTP/1.x transport connection broken: \nmalformed HTTP response \"\\\
  x15\\x03\\x01\\x00\\x02\\x02\".\n* Are you trying to connect to a TLS-enabled daemon\
  \ without TLS?\n```\n\n现在 Docker 客户端跨网络向远程守护进程发送命令，而无需显式指定 `-H tcp://node3:2376`\
  \ 标志。然而，您仍然需要配置客户端对命令签名。\n\n再导出一个环境变量，告诉 Docker 客户端使用其证书签名所有命令。\n\n```\nexport DOCKER_TLS_VERIFY=1\n\
  ```\n\n再次运行 `docker version` 命令。\n\n```\n$ docker version\nClient:\n Version:  \
  \     19.03.8\n<Snip>\nServer:\n Engine:\n  Version:      19.03.8\n  API version:\
  \  1.40 (minimum version 1.12)\n  Go version:   go1.12.17\n  Git commit:   afacb8b\n\
  \  Built:        Wed Mar 11 01:29:16 2020\n  OS/Arch:      linux/amd64\n  Experimental:\
  \ true\n```\n\n恭喜。客户端已成功与远程守护进程通信。\n\n\n\n\n镜像由多个`layers`（层）组成，这些层相互堆叠，并表示为一个单一对象。镜像内部包含一个精简的操作系统（OS）以及运行应用程序所需的所有文件和依赖。由于容器的设计初衷是快速和轻量级，因此镜像通常很小（微软的镜像往往非常大）。\n\
  \n恭喜你！你现在对 Docker 镜像大概有了一个概念了 :-D 现在，是时候让你大开眼界了！\n\n## Docker 镜像 - 深度解析\n\n我们已经提到过几次\
  \ `images`（镜像）就像是停止的容器（如果你是开发者，它们就像 `classes`，类）。事实上，你可以停止一个容器并基于它创建一个新镜像。考虑到这一点，镜像被视为`build-time`（构建时）构建物，而容器是`run-time`（运行时）构建物。\n\
  \n![Figure 6.1](img/figure6-1.png)\n\n图 6.1\n\n### 镜像与容器\n\n图 6.1 显示了镜像与容器关系的高级视图。我们使用\
  \ `docker container run` 和 `docker service create` 命令从单个镜像启动一个或多个容器。一旦你从镜像启动了容器，这两个构建物就会变得相互依赖，在最后一个使用它的容器停止并销毁之前，你无法删除镜像。尝试在不停止和销毁所有正在使用它的容器的情况下删除镜像将导致错误。\n\
  \n### 镜像通常很小\n\n容器的全部目的是运行单个应用程序或服务。这意味着它只需要其正在运行的程序/服务的代码和依赖项——不需要任何其他东西。这导致了镜像去除了所有非本质部分，体积小。\n\
  \n例如，Docker 镜像并没有提供 6 种不同的 shell 供你选择。事实上，许多应用程序镜像在发布时不带 shell——如果应用程序运行不需要 shell，那么它就不需要包含在镜像中。像\
  \ `busybox` 和 `Ubuntu` 这样的通用镜像带有 shell，但当你为生产环境打包业务应用程序时，你可能会在不带 shell 的情况下进行打包。\n\
  \n镜像也不包含内核 —— 所有运行在 Docker 宿主机上的容器都共享宿主机内核的访问。出于这些原因，我们有时说镜像包含`恰够的操作系统`（通常只是与操作系统相关的文件和文件系统对象）。\n\
  \n> **注意：** Hyper-V 容器在专用的轻量级虚拟机内部运行单个容器。该容器利用虚拟机内部运行的操作系统的内核。\n\n官方的 `Alpine Linux`\
  \ Docker 镜像大小约为 5MB，它是 Docker 镜像可以多小的极端例子。这并不是拼写错误！它确实只有 5 兆！不过，某些镜像甚至更小，但更典型的例子可能是官方的\
  \ Ubuntu Docker 镜像，它目前约为 40MB。这些镜像显然去除了大部分非本质部分！\n\n由于 Windows 操作系统的工作方式，基于 Windows\
  \ 的镜像通常比基于 Linux 的镜像大得多。Windows 镜像达到几个 GB 且拉取长时间并不罕见。\n\n### 拉取镜像\n\n干净安装的 Docker\
  \ 宿主机本地仓库中没有任何镜像。\n\n基于 Linux 的 Docker 宿主机上的本地镜像仓库通常位于 `/var/lib/docker/<storage-driver>`。在基于\
  \ Windows 的 Docker 宿主机上是 `C:\\ProgramData\\docker\\windowsfilter`。如果你在 Mac 或 PC\
  \ 上通过 Docker Desktop 使用 Docker，一切都运行在虚拟机内部。\n\n你可以使用以下命令检查 Docker 宿主机本地仓库中是否有任何镜像。\n\
  \n```\n$ docker image ls\nREPOSITORY  TAG      IMAGE ID       CREATED         SIZE\n\
  ```\n\n将镜像获取到 Docker 宿主机的过程被称为 `pulling`（拉取）。所以，如果你想在 Docker 宿主机上获取最新的 Busybox 镜像，你需要\
  \ `pull` 它。使用以下命令 `pull` 一些镜像然后检查它们的大小。\n\n> 如果你正在 Linux 上操作且尚未将你的用户账户添加到本地 `docker`\
  \ Unix 组，你可能需要在所有后续命令的开头添加 `sudo`。\n\nLinux 示例：\n\n```\n$ docker image pull redis:latest\n\
  latest: Pulling from library/ubuntu\nlatest: Pulling from library/redis\n54fec2fa59d0:\
  \ Already exists \n9c94e11103d9: Pull complete \n04ab1bfc453f: Pull complete \n\
  5f71e6b94d83: Pull complete \n2729a8234dd5: Pull complete \n2683d7f17745: Pull complete\
  \ \nDigest: sha256:157a9...ad7d28c0f9f\nStatus: Downloaded newer image for redis:latest\n\
  docker.io/library/redis:latest\n\n$ docker image pull alpine:latest\nlatest: Pulling\
  \ from library/alpine\ncbdbe7a5bc2a: Pull complete \nDigest: sha256:9a839e63dad54c3a6d1834e29692c8492d93f90c59c978c1ed79109ea4fb9a54\n\
  Status: Downloaded newer image for alpine:latest\ndocker.io/library/alpine:latest\n\
  \n$ docker image ls\nREPOSITORY   TAG     IMAGE ID        CREATED       SIZE\nalpine\
  \       latest  f70734b6a266    40 hours ago  5.61MB\nredis        latest  a4d3716dbb71\n\
  ```\n\nWindows 示例：\n\n```\n> docker image pull mcr.microsoft.com/powershell:latest\n\
  latest: Pulling from mcr.microsoft.com/powershell\n5b839f4335b: Pull complete \n\
  901862790: Pull complete \n133ab280cc5: Pull complete \n08495381df0: Pull complete\
  \ \n399a2d3858: Pull complete \n7c6d29a558: Pull complete \nf951da90269: Pull complete\
  \ \n2339884c71: Pull complete \nDigest: sha256:fbc955123bd\nStatus: Downloaded newer\
  \ image for mcr.microsoft.com/powershell:latest\nmcr.microsoft.com/powershell:latest\n\
  \n> docker image ls\nREPOSITORY                      TAG      IMAGE ID       CREATED\
  \      SIZE\nmcr.microsoft.com/powershell    latest   73175ce91ff   2 days ago \
  \  495MB\nmcr.microsoft.com/iis          latest   6e5c6561432   3 days ago   5.05GB\n\
  ```\n\n你可以看到，拉取的镜像现在位于 Docker 宿机的本地仓库中。你也可以 Windows 镜像更大。\n\n#### 命名\n\n在每个命令中，我们必须指定要拉取哪个镜像。让我们花几分钟看看镜像命名。为了这一点，我们需要一些镜像如何存储的背景知识。\n\
  \n#### 镜像仓库\n\n我们将存储在称为 `image registries`（镜像仓库）的中心区域。这使得共享和访问它们变得简单。\n\n最常见的仓库是\
  \ Docker Hub。其他其他仓库，包括第三方仓库和安全的本地仓库。然而，Docker 客户端是有偏见的。\n\n以下命令的输出被省略了，但你可以看到 Docker\
  \ 配置使用 `https://index.docker.io/v1/` 作为推送和拉取镜像的默认仓库（这实际上会重定向到 `v2`）。\n\n```\n$ docker\
  \ info\nServer:\n Containers: 22\n ...\n containerd version: 7ad184331fa3e55e52b890ea956ba581ae3429\n\
  \ runc version: dc9208a3303feef5b3839f4323d9beb36df0a9dd\n Docker Root Dir: /var/lib/docker\n\
  \ ...\n Registry: https://index.docker.io/v1/\n ...\n```\n\n镜像仓库包含一个或多个 `image repositories`（镜像仓库）。反之，镜像仓库包含一个或多个镜像。这可能有点困惑，所以图\
  \ 6.2 显示了一个镜像仓库包含 3 个镜像仓库，每个仓库都有一个或多个镜像。\n\n![Figure 6.2](img/figure6-2.png)\n\n\
  图 6.2\n\n##### 官方与非官方仓库\n\nDocker Hub 有 `official repositories`（官方仓库）和 `unofficial\
  \ repositories`（非官方仓库）的概念。\n\n如其名，`官方仓库`是由 Docker, Inc. 审核和筛选的镜像家园。这意味着它们应该包含最新的、高质量的代码，并且安全、文档齐全并符合最佳实践。\n\
  \n\n\n\n`非官方仓库`（Unofficial repositories）就像荒野西部——你不应该假设它们是安全的、文档齐全的或按照最佳实践构建的。这并不是说`非官方仓库`中的所有内容都是坏的。`非官方仓库`中也有一些优秀的内容。你只需要在信任它们的代码之前非常小心。坦率地说，在信任互联网上的软件时你应该始终保持小心——即使是来自`官方仓库`的镜像也是如此。\n\
  \n大多数流行的应用程序和基础操作系统在 Docker Hub 上都有它们自己的`官方仓库`。它们很容易识别，因为它们位于 Docker Hub 命名空间的顶层。以下列表包含了几个`官方仓库`，并显示了它们存在于\
  \ Docker Hub 命名空间顶层的 URL：\n\n*   `nginx`: https://hub.docker.com/_/nginx/\n*   `busybox`:\
  \ https://hub.docker.com/_/busybox/\n*   `redis`: https://hub.docker.com/_/redis/\n\
  *   `mongo`: https://hub.docker.com/_/mongo/\n\n另一方面，我个人的镜像存在于`非官方仓库`的荒野西部，`不`应该被信任。以下是我仓库中镜像的一些示例：\n\
  \n*   `nigelpoulton/tu-demo` — https://hub.docker.com/r/nigelpoulton/tu-demo/\n\
  *   `nigelpoulton/pluralsight-docker-ci` — https://hub.docker.com/r/nigelpoulton/pluralsight-docker-ci/\n\
  \n我的仓库中的镜像不仅`没有`经过审核、`没有`保持更新、`不`安全且`没有`良好的文档……它们也不位于 Docker Hub 命名空间的顶层。我的仓库都位于\
  \ `nigelpoulton` 二级命名空间内。\n\n你可能会注意到，我们使用的 Microsoft 镜像并不在 Docker Hub 命名空间的顶层。在编写时，它们位于官方的\
  \ `mcr.microsoft.com` 二级命名空间。这是由于法律原因要求它们必须托管在 Docker Hub 之外。然而，它们被集成到 Docker Hub\
  \ 命名空间中，以使取它们的体验尽可能无缝。\n\n在了解这一切之后，我们终于可以查看如何在 Docker 命令行中引用镜像。\n\n### 镜像命名与标记\n\
  \n从官方仓库引用镜像只需要提供仓库名称和用冒号（`:`）隔开的标签。当与官方仓库的镜像一起工作时，`docker image pull` 的格式为：\n\n\
  ```\n$ docker image pull <repository>:<tag>\n```\n\n在前的 Linux 示例中，我们通过以下两个命令拉取了\
  \ Alpine 和 Redis 镜像：\n\n```\n$ docker image pull alpine:latest\ndocker image pull\
  \ redis:latest\n```\n\n这两个命令从顶层 `alpine` 和 `redis` 仓库拉取了标记为“latest”的镜像。\n\n以下示例显示了如何从`官方仓库`拉取各种不同的镜像：\n\
  \n```\n$ docker image pull mongo:4.2.6\n// 这从官方的 `mongo` 仓库拉取标记为 `4.2.6` 的镜像。\n\n\
  $ docker image pull busybox:latest\n// 这从官方的 `busybox` 仓库拉取标记为 `latest` 的镜像。\n\n\
  $ docker image pull alpine\n// 这从官方的 `alpine` 仓库拉取标记为 `latest` 的镜像。\n```\n\n关于这些命令的几点说明：\n\
  \n首先，如果你在仓库名称后`没有`指定镜像标签，Docker 将假设你指的是标记为 `latest` 的镜像。如果仓库没有标记为 `latest` 的镜像，命令将失败。\n\
  \n其次，`latest` 标签并没有任何魔法力量。仅仅因为一个镜像被标记为 `latest`，并不保证它是仓库中最新的镜像。例如，`alpine` 仓库中最新的镜像通常被标记为\
  \ `edge`。故事的道理是——在使用 `latest` 标签时要小心。\n\n从`非官方仓库`拉取镜像本质上是一样的——你只需要在仓库名称前加上用户名或组织名称。以下示例显示了如何从\
  \ Docker 账户名为 `nigelpoulton` 的不可信人员所拥有的 `tu-demo` 仓库拉取 `v2` 镜像：\n\n```\n$ docker\
  \ image pull nigelpoulton/tu-demo:v2\n// 这将拉取标记为 `v2` 的镜像\n// 来自 `nigelpoulton`\
  \ 命名空间下的 `tu-demo` 仓库\n```\n\n在我们之前的 Windows 示例中，我们通过以下命令拉取了 PowerShell 镜像：\n\n\
  ```\n> docker image pull mcr.microsoft.com/powershell:latest\n```\n\n这从 `mcr.microsoft.com/powershell`\
  \ 仓库拉取了标记为 `latest` 的镜像。\n\n如果你想从第三方注册表（不是 Docker Hub）拉取镜像，你需要在仓库名称前加上 DNS 名称。例如，以下命令从\
  \ Google Container Registry (`gcr.io`) 上的 `google-containers/git-sync` 仓库拉取 `3.1.5`\
  \ 镜像：\n\n```\n$ docker image pull gcr.io/google-containers/git-sync:v3.1.5\nv3.1.5:\
  \ Pulling from google-containers/git-sync\n597de8ba0c30: Pull complete\nb263d8e943d1:\
  \ Pull complete\na20ed72abc0: Pull complete\n49535c7e3a51: Pull complete\na20d0825f07:\
  \ Pull complete\n```\nv3.1.5: Pulling from google-containers/git-sync\n597de8ba0c30:\
  \ Pull complete\nb263d8e943d1: Pull complete\na20ed72abc0: Pull complete\n49535c7e3a51:\
  \ Pull complete\na20d0825f07: Pull complete\nv3.1.5: Pulling from google-containers/git-sync\n\
  597de8ba0c30: Pull complete\nb263d8e943d1: Pull complete\na20ed72abc0: Pull complete\n\
  49535c7e3a51: Pull complete\na20d0825f07: Pull complete\nv3.1.5: Pulling from google-containers/git-sync\n\
  ...\nStatus: Downloaded new image for gcr.io/google-containers/git-sync:v3.1.5\n\
  v3.1.5: Pulling from google-containers/git-sync\n597de8ba0c30: Pull complete\nb263d8e943d1:\
  \ Pull complete\na20ed72abc0: Pull complete\n49535c7e3a51: Pull complete\na20d0825f07:\
  \ Pull complete\nv3.1.5: Pulling from google-containers/git-sync\n...\nStatus: Downloaded\
  \ new image for gcr.io/google-containers/git-sync:v3.1.5\n(注：此处原文文本似乎存在重复输出错误，翻译时已按逻辑整合)\n\
  \n等等，重新检查原文，原文最后一段 `v3.1.5: Pulling from...` 确实重复了多次。我将根据逻辑进行翻译并保持格式。\n\nStatus:\
  \ Downloaded new image for gcr.io/google-containers/git-sync:v3.1.5\n\n### 过滤镜像\n\
  \nDocker 提供了 `--filter` 标志来过滤 `docker image ls` 返回的镜像列表。\n\n以下示例将仅返回悬空（dangling）镜像。\n\
  \n\n\n\n\n```\n$ docker image ls --filter dangling=true\nREPOSITORY    TAG     \
  \  IMAGE ID       CREATED       SIZE\n<none>        <none>    4fd34165afe0   7 days\
  \ ago    14.5MB\n```\n\n悬悬镜像（dangling image）是指不再带有标签的镜像，在列表中显示为 `<none>:<none>`。它们产生的常见方式是在构建新镜像时，赋予它一个已经存在的标签。当这种情况发生时，Docker\
  \ 将构建新镜像，发现现有的镜像具有相同的标签，于是从现有镜像中移除该标签并将其赋给新镜像。\n\n考虑这个示例：你基于 `alpine:3.4` 构建了一个新的应用程序镜像，并将其标记为\
  \ `dodge:challenger`。然后你更新了镜像以使用 `alpine:3.5` 代替 `alpine:3.4`。当你构建新镜像时，该操作将创建一个标记为\
  \ `dodge:challenger` 的新镜像，并移除旧镜像的标签。旧镜像将变成一个悬悬镜像。\n\n你可以使用 `docker image prune`\
  \ 命令删除系统上所有的悬悬镜像。如果你添加了 `-a` 标志，Docker 还会删除所有未使用的镜像（即未被任何容器使用的镜像）。\n\nDocker 目前支持以下过滤器：\n\
  \n* `dangling:` 接受 `true` 或 `false`，并仅返回悬悬镜像（true）或非悬悬镜像（false）。\n* `before:` 需要镜像名称或\
  \ ID 作为参数，并返回在此之前创建的所有镜像。\n* `since:` 与上述相同，但返回在指定镜像之后创建的镜像。\n* `label:` 根据标签是否存在或标签及其值对镜像进行过滤。`docker\
  \ image ls` 命令在输出中不显示标签。\n\n对于所有其他过滤，你可以使用 `reference`。\n\n这里是一个使用 `reference` 仅显示标记为“latest”镜像的示例。\n\
  \n```\n$ docker image ls --filter=reference=\"*:latest\"\nREPOSITORY   TAG     \
  \ IMAGE ID        CREATED        SIZE\nalpine       latest   f70734b6a266    3 days\
  \ ago     5.61MB\nredis        latest   a4d3716dbb72    3 days ago     98.3MB\n\
  busybox      latest   be5888e67be6    12 days ago    1.22MB\n```\n\n你还可以使用 `--format`\
  \ 标志使用 Go 模板格式化输出。例如，以下命令将仅返回 Docker 主机上镜像的 size 属性。\n\n```\n$ docker image ls --format\
  \ \"{{.Size}}\"\n5.61MB\n98.3MB\n1.22MB\n```\n\n使用以下命令返回所有镜像，但仅显示仓库（repo）、标签（tag）和大小（size）。\n\
  \n```\n$ docker image ls --format \"{{.Repository}}: {{.Tag}}: {{.Size}}\"\nalpine:\
  \  latest: 5.61MB\nredis:   latest: 98.3MB\nbusybox: latest: 1.22MB\n```\n\n如果你需要更强大的过滤，始终可以使用操作系统和\
  \ shell 提供的工具，如 `grep` 和 `awk`。\n\n## 从命令行搜索 Docker Hub\n\n`docker search` 命令允许你从命令行界面搜索\
  \ Docker Hub。它的价值有限，因为你只能对“NAME”字段中的字符串进行模式匹配。但是，你可以根据返回的任何列对输出进行过滤。\n\n在最简单的形式下，它搜索所有在“NAME”字段中包含特定字符串的仓库。例如，以下命令搜索所有“NAME”字段中包含“nigelpoulton”的仓库。\n\
  \n```\n$ docker search nigelpoulton\nNAME                         DESCRIPTION  \
  \             STARS   AUTOMATED\nnigelpoulton/pluralsight..   Web app used in...\
  \        22       [OK]\nnigelpoulton/tu-demo                                   12\n\
  nigelpoulton/k8sbook         Kubernetes Book web app   2\nnigelpoulton/workshop101\
  \     Kubernetes 101 Workshop   0                                       \n<Snip>\n\
  ```\n\n“NAME”字段是仓库名称。对于非官方仓库，它包含了 Docker ID 或组织名称。例如，以下命令将列出所有名称中包含字符串“alpine”的仓库。\n\
  \n```\n$ docker search alpine\nNAME                   DESCRIPTION          STARS\
  \    OFFICIAL    AUTOMATED\nalpine                 A minimal Docker..   6386   \
  \  [OK]\nmhart/alpine-node      Minimal Node.js..    465\nanapsix/alpine-java  \
  \  Oracle Java 8...     442                  [OK]\n<Snip>\n```\n\n注意返回的某些仓库中有些是官方的，有些是非官方的。你可以使用\
  \ `--filter \"is-official=true\"` 使得只显示官方仓库。\n\n```\n$ docker search alpine --filter\
  \ \"is-official=true\"\nNAME                   DESCRIPTION          STARS    OFFICIAL\
  \    AUTOMATED\nalpine                 A minimal Docker..   6386     [OK]\n```\n\
  \n你可以再次执行操作，但这次只显示具有自动构建的仓库。\n\n```\n$ docker search alpine --filter \"is-automated=true\"\
  \nNAME                       DESCRIPTION               OFFICIAL     AUTOMATED\n\
  anapsix/alpine-java        Oracle Java 8 (and 7)..                [OK]\nfrolvlad/alpine-glibc\
  \      Alpine Docker image..                  [OK]\nalpine/git                 A\
  \ simple git container..               [OK]                                \\\n\
  <Snip>\n```\n\n关于 `docker search` 的最后一点：默认情况下，Docker 仅显示 25 行结果。但是，你可以使用 `--limit`\
  \ 标志将其增加到最多 100。\n\n\n\n\n\n请考虑以下关于构建简单 Python 程序的过度简化示例。你可能有一项公司政策，要求所有应用程序都基于官方的\
  \ Ubuntu 20:04 镜像。这将是你镜像的 `base layer`（基础层）。如果你接着添加了 Python 软件包，它将作为第二层添加在基础层之上。如果你之后添加了源代码文件，这些将作为额外的层添加。你的最终镜像将如图\
  \ 6.5 所示具有三层（请记住这是一个为了演示目的而过度简化的示例）。\n\n![Figure 6.5](img/figure6-5.png)\n\n图 6.5\n\
  \n需要理解这一点是，随着额外层的添加，`image`（镜像）始终是按添加顺序堆叠的所有层的组合。以图 6.6 所示的两个层的简单示例为例。每个 `layer`（层）都包含\
  \ 3 个文件，但整个 `image`（镜像）共有 6 个文件，因为它是这两个层之组合。\n\n![Figure 6.6](img/figure6-6.png)\n\
  \n图 6.6\n\n> **注意：** 我们在图 6.6 中展示镜像层的方式与之前的图表略有不同。这只是为了让显示文件更加容易。\n\n在图 6.7 所示的三层镜像稍微复杂的示例中，整个镜像在统一视图中仅显示了\
  \ 6 个文件。这是因为顶层中的 `File 7` 是直接在其下方（内联）的 `File 5` 的更新版本。在这种情况下，较高层的文件会遮挡其正下方的文件。这允许将文件的更新版本作为新层添加到镜像中。\n\
  \n![Figure 6.7](img/figure6-7.png)\n\n图 6.7\n\nDocker 使用一种存储驱动（storage driver），负责堆叠层并将它们作为单一的统一文件系统/镜像呈现。Linux\
  \ 上的存储驱动示例包括 `AUFS`、`overlay2`、`devicemapper`、`btrfs` 和 `zfs`。正如名称所示，每一种都基于 Linux\
  \ 文件系统或块设备技术，并且都有各自独特的性能特性。Docker 在 Windows 上支持的唯一驱动是 `windowsfilter`，它在 NTFS 之上实现了分层和\
  \ CoW（写时复制）。\n\n无论使用哪种存储驱动，用户体验都是相同的。\n\n图 6.8 显示了相同的 3 层镜像在系统中的显示方式。即所有三层堆叠并合并，提供了一个单一的统一视图。\n\
  \n![Figure 6.8](img/figure6-8.png)\n\n图 6.8\n\n### 共享镜像层\n\n多个镜像可以、并且确实在共享层。这带来了空间和性能上的效率。\n\
  \n让我们再次查看之前运行的带有 `-a` 标志的 `docker image pull` 命令，该命令用于拉取 `nigelpoulton/tu-demo`\
  \ 仓库中所有带标签的镜像。\n\n```\n$ docker image pull -a nigelpoulton/tu-demo\nlatest: Pulling\
  \ from nigelpoulton/tu-demo\naad63a933944: Pull complete \nf229563217f5: Pull complete\
  \ \n<Snip>>\nDigest: sha256:c9f8e18822...6cbb9a74cf\n\nv1: Pulling from nigelpoulton/tu-demo\n\
  aad63a933944: Already exists \nf229563217f5: Already exists \n<Snip> \nfc669453c5af:\
  \ Pull complete \nDigest: sha256:674cb03444...f8598e4d2a\n\nv2: Pulling from nigelpoulton/tu-demo\n\
  Digest: sha256:c9f8e18822...6cbb9a74cf\nStatus: Downloaded newer image for nigelpoulton/tu-demo\n\
  ```\n\n```，\n，，::，ed- image fornigelpoulton/tu-demo\nlatest:\n\n\n:\nlatest/nig-oulton/tu-demo\n\
  nigelpoulton/tu-demo\nlatest::\n\nDigest: sha256:c9f8e18822...6cbb9a74cf\nREPOSITORY\
  \  TAG     DIGEST      IMAGE ID      CREATED     SIZE\nnigelpoulton/tu-demo  latest\
  \     d5e1e4832      2 weeks ago   104MB\nnigelpoulton/tu-demo  v2         d5f1e48322\
  \      2 weeks ago   104MB\nnigelpoulton/tu-demo  v1         d5e1e48322      2 weeks\
  \ ago   104MB\n```\n*(注：由于原文示例中的输出部分存在部分重复和乱码，译文已根据逻辑对齐并保持了核心结构信息)*\n\n注意结尾的 `Already\
  \ exists`。\n\n这些行告诉我们 Docker 足够智能，能够识别它已经拥有某些层。\n\n### 通过摘要拉取镜像\n\n到目前为止，我们展示了如何使用标签（tag）拉取镜像。这是最常见的方法，但它存在一个问题：标签是可变的（mutable）。这意味着一个标签可以指向不同的镜像。为了避免这种情况，你可以使用镜像摘要（digest）。\n\
  \n摘要是镜像内容的哈希值。由于哈希源自内容，更改内容将创建一个新的摘要。这确保了你获得的是预期的镜像！\n\n在编写期间，没有原生的 Docker 命令可以直接从远程仓库（如\
  \ Docker Hub）检索镜像摘要。这意味着确定镜像摘要的唯一方法是根据标签拉取它并记录摘要。这在未来可能会发生变化。\n\n每当你拉取镜像时，`docker\
  \ image pull` 命令都会将摘要作为返回信息的一部分。你也可以通过向 `docker image ls` 命令添加 `--digests` 标志来查看\
  \ Docker 仓库中镜像的摘要。如下所示：\n\n```\n$ docker image pull alpine\nUsing default tag: latest\n\
  latest: Pulling from library/alpine\ncbdbe7a5bc2a: Pull complete \nDigest: sha256:9a839e63da...9ea4fb945\n\
  Status: Downloaded newer image for alpine:latest\ndocker.io/library/alpine:latest\n\
  \n$ docker image ls --digests alpine\nREPOSITORY  TAG     DIGEST               \
  \            IMAGE ID      CREATED     SIZE\nalpine      latest  sha256:9a839e63da...9ea4fb945\
  \   f70734b6266  2 days ago  5.61MB\n```\n\n上面的输出显示 `alpine` 镜像的摘要为 -\n\n`sha256:9a839e63da...9ea4fb945`\n\
  \n现在知道了镜像的摘要，再次拉取镜像时可以使用它。这将确保我们获得的是预期的镜像！\n\n以下示例从你的 Docker 主机中删除 `alpine:latest`\
  \ 镜像，然后展示如何使用摘要而不是标签再次拉取。实际摘要在书中被截断以适应单行显示。请用它替换在你自己系统上拉取的真实摘要。\n\n\n\n\n\n```\n\
  $ docker image rm alpine:latest\nUntagged: alpine:latest\nUntagged: alpine@sha256:c0537...7c0a7726c88e2bb7584dc96\n\
  Deleted: sha256:02674b9cb179d...abff0c2bf5ceca5bad72cd9\nDeleted: sha256:e154057080f40...3823bab1be5b86926c6f860\n\
  \n$ docker image pull alpine@sha256:9a839e63da...9ea4fb9a54\nsha256:9a839e63da...9ea4fb9a54:\
  \ Pulling from library/alpine\ncbdbe7a5bc2a: Pull complete \nDigest: sha256:9a839e63da...9ea4fb9a54\n\
  Status: Downloaded newer image for alpine@sha256:9a839e63da...9ea4fb9a54\ndocker.io/library/alpine@sha256:9a839e63da...9ea4fb9a54\n\
  ```\n\n### 关于镜像哈希值（摘要）的更多介绍\n\n从 Docker 1.10 版本开始，镜像是一个非常松散的独立层集合。\n\n在某些方面，`image`\
  \ 本身只是列出了所有层和一些元数据的配置文件。\n\n`layers` 是数据所在的地方（文件和代码等）。每一层都是完全独立的，并且没有作为整体镜像一部分的概念。\n\
  \n每个 `image` 都由一个加密 ID 标识，该 ID 是配置文件的哈希。每个 `layer` 都由一个加密 ID 标识，该 ID 是层内容的哈希。我们称这些为“内容哈希”。\n\
  \n这意味着，更改镜像或其任何层的内容都会导致相关的加密哈希发生变化。因此，镜像和层是不可变的，我们可以轻松地识别对其中任一进行的任何更改。\n\n到为止，事情还很简单。但它们即将变得复杂一些。\n\
  \n当我们推送（push）和拉取（pull）镜像时，我们会压缩这些层以节省网络带宽以及镜像注册表中的存储空间。这很棒，但压缩后的内容看起来与未压缩的内容不同。因此，在执行\
  \ `push` 或 `pull` 操作后，内容哈希不再匹配。\n\n这引申了各种问题。例如，Docker Hub 会验证每个推送的层，以确保它在传输过程中没有被篡改。为了做到这一点，它会对层内容运行哈希计算，并将其与发送的哈希进行对比。由于层被压缩（更改）了，哈希验证将失败。\n\
  \n为了解决这个问题，每个层还获得了一个被称为 `distribution hash`（分发哈希）的东西。这是层压缩版本的哈希，包含在每个推送或拉取到注册表的层中。这随后可以被用于验证该层在到达时未被篡改。\n\
  \n除了提供了一种加密可验证的方法来验证镜像和层的完整性外，它还避免了镜像和层 ID 随机生成时可能发生的 ID 冲突。\n\n### 多架构镜像\n\nDocker\
  \ 的优点之一是它的简单性。然而，随着技术的增长，事情变得越来越复杂。当 Docker 开始支持多种不同的平台和架构（例如 Windows 和 Linux，以及\
  \ ARM、x64、PowerPC 和 s390x 的变体）时，就发生了这种情况。突然，流行的镜像有了不同平台和架构的版本。作为开发者和运维人员，我们必须确保拉取的是适用于我们使用的平台和架构的正确版本。这破坏了流畅的\
  \ Docker 。\n\n> **注意：** 我们使用“架构”（architecture）一术是指 CPU 架构，如 x64 和 ARM。我们使用“平台”（platform）一术是指操作系统（Linux\
  \ 或 Windows）或操作系统与架构的组合。\n\n多架构镜像出现了！\n\n幸运的是，Docker 和 Docker Hub 有一种巧妙的方法支持多架构镜像。这意味着单一镜像（例如\
  \ `golang:latest`）可以包含 x64 版 Linux、PowerPC 版 Linux、Windows x64、不同版本的 ARM 版 Linux\
  \ 等镜像。明确来说，我们说的是支持多个平台和架构的单一镜像标签。我们稍后将看到实际演示，这意味着你可以从任何平台或架构运行简单的 `docker image\
  \ pull goloang:latest`，Docker 将为你的平台和架构拉取正确的镜像。\n\n为了实现这一点，Registry API 支持两个重要的构造结构：\n\
  \n* **manifest lists**（清单列表）\n* **manifests**（清单）\n\n`manifest list` 正如其名：特定镜像标签所支持的架构列表。每个受支持的架构都有自己的\
  \ `manifest`，详细列出了组成它的各个层。\n\n图 6.9 使用官方 `golang` 镜像作为示例。左侧是 `manifest list`，列出了该镜像支持的所有架构的条目。箭头显示\
  \ `manifest list` 中的每个条目都指向一个包含镜像配置和层数据的 `manifest`。\n\n![Figure 6.9](img/figure6-9.png)\n\
  \n图 6.9\n\n在看实际操作之前，让我们先看看理论。\n\n假设你正在树莓派上运行 Docker（运行在 ARM 架构上的 Linux）。当你拉取镜像时，你的\
  \ Docker 客户端会向 Docker Hub 暴露的 Docker Registry API 进行相应的调用。如果镜像存在 `manifest list`，它将被解析以检查是否存在适用于\
  \ ARM 版 Linux 的条目。如果存在 ARM 条目，将获取该镜像的 `manifest` 并解析组成镜像的层加密 ID。\n\n以下示例展示了这是如何工作的：通过\
  \ `golang` 镜像启动新容器并在内部运行 `go version` 命令。`go version` 命令的输出显示了 Go 的版本以及容器/主机的平台架构。需要注意的是，两个示例使用了相同的\
  \ `docker container run` 命令。我们不需要告诉 Docker 我们需要 Linux x64 或 Windows x64 版本的，只需运行命令并让\
  \ Docker 处理适用于我们平台和架构的镜像即可。\n\nLinux x64 示例：\n\n```\n$ docker container run --rm\
  \ golang go version\n<output>\ngo version 1.14.2 linux/amd64\n```\n\nWindows x64\
  \ 示例：\n\n```\n> docker container run --rm golang go version\n<output>\ngo version\
  \ 1.14.2 windows/amd64\n```\n\nWindows 镜像目前超过 5GB，下载可能需要长时间。\n\n`docker manifest`\
  \ 命令允许你检查 Docker Hub 上任何镜像的清单。以下示例检查了 Docker Hub 上 `golang` 镜像的清单。你可以看到 Linux 和\
  \ Windows 支持多种 CPU 架构。你可以运行不带 `grep` 过滤器的命令来查看完整的 JSON 清单。\n\n```bash\n$ docker\
  \ manifest inspect golang | grep 'architecture\\|os'\n            \"architecture\"\
  : \"amd64\",\n            \"os\": \"linux\"\n            \"architecture\": \"arm\"\
  ,\n            \"os\": \"linux\"\n            \"architecture\": \"arm64\",\n   \
  \         \"os\": \"linux\"\n            \"architecture\": \"386\",\n          \
  \  \"os\": \"linux\"\n            \"architecture\": \"pp64le\",\n            \"\
  os\": \"linux\"\n            \"architecture\": \"s390x\",\n            \"os\": \"\
  linux\"\n            \"architecture\": \"amd64\",\n            \"os\": \"windows\"\
  ,\n            \"os.version\": \"10.0.14393.3630\"\n            \"architecture\"\
  : \"amd64\",\n            \"os\": \"windows\",\n            \"os.version\": \"10.0.17763.1158\"\
  \n```\n\n所有官方镜像都有清单列表。\n\n可以使用 `docker buildx` 为不同平台和架构创建自己的构建，然后使用 `docker manifest\
  \ create` 创建自己的清单列表。\n\n以下命令根据当前目录的内容构建名为 `myimage:arm-v7` 的 ARMv7 镜像。它基于 `https://github.com/nigelpoulton/psweb`\
  \ 中的代码。\n\n\n\n\n\n```\n$ docker buildx build --platform linux/arm/v7 -t myimage:arm-v7\
  \ .\n[+] Building 44.4s (10/10) FINISHED                                       \
  \                            \\\n\n => [internal] load build definition from Dockerfile\
  \          0.1s\n => => transferring dockerfile: 424B                          0.0s\n\
  \ <Snip>\n => exporting to image                                        3.2s \n\
  \ => => exporting layers                                       3.2s \n => => writing\
  \ image sha256:61cc82bdaa...                     0.0s \n => => naming to docker.io/library/myimage:arm-v7\
  \             0.0s \n```\n\n该命令的之处之处在于你不需要从 ARMv7 Docker 节点上运行它。事实上，所示的示例是在 x64\
  \ 硬件的 Linux 上运行的。\n\n在编写时，`buildx` 是一个实验性功能，需要在你的 `~/.docker/config.json` 文件中设置\
  \ `experimental=true`，如下所示：\n\n```\n{\n  \"experimental\": true\n}\n```\n\n## 删除镜像\n\
  \n当你不再需要 Docker 主机上的某个镜像时，可以使用 `docker image rm` 命令将其删除。`rm` 是 remove（删除）的缩写。\n\n\
  删除镜像将从你的 Docker 主机中移除该镜像及其所有层。这意味着它将不再出现在 `docker image ls` 命令中，并且 Docker 主机上所有包含该层数据的目录都将被删除。然而，如果一个镜像层被多个镜像共享，则在所有引用它的镜像都被删除之前，该层将不会被删除。\n\
  \n使用 `docker image rm` 命令删除上一步中拉取的镜像。以下示例通过镜像 ID 删除镜像，这在你的系统上可能有所不同。\n\n```\n$ docker\
  \ image rm 02674b9cb179\nUntagged: alpine@sha256:c0537ff6a5218...c0a7726c88e2bb7584dc96\n\
  Deleted: sha256:02674b9cb179d57...31ba0abff0c2bf5ceca5bad72cd9\nDeleted: sha256:e154057080f4063...2a0d13823bab1be5b86926c6f860\n\
  ```\n\n你可以通过空格将多个镜像在同一条命令中列出，如下例所示。\n\n```\n$ docker image rm f70734b6a266 a4d3716dbb72\n\
  ```\n\n如果你尝试删除的镜像正在被运行的容器使用，你将无法删除它。在再次尝试删除操作之前，请停止并删除任何容器。\n\n删除 Docker 主机所有镜像的快捷方法是运行\
  \ `docker image rm` 命令，并通过调用带有 `-q` 标志的 `docker image ls` 来传递系统上所有镜像 ID 的列表。如下。\n\
  \n如果你在 Windows 系统上操作，这将在 PowerShell 终端中生效。在 CMD 提示符中将无效。\n\n```\n$ docker image\
  \ rm $(docker image ls -q) -f\n```\n\n要理解其工作原理，请下载几个镜像然后运行 `docker image ls -q`。\n\
  \n```\n$ docker image pull alpine\nUsing default tag: latest\nlatest: Pulling from\
  \ library/alpine\ne110a4a17941: Pull complete\nDigest: sha256:3dcdb92d7432d5...3626d99b889d0626de158f73a\n\
  Status: Downloaded newer image for alpine:latest\n\n$ docker image pull ubuntu\n\
  Using default tag: latest\nlatest: Pulling from library/ubuntu\n952132ac251a: Pull\
  \ complete\n82659f8f1b76: Pull complete\nc19118ca682d: Pull complete\n8296858250fe:\
  \ Pull complete\n24e0251a0e2c: Pull complete\nDigest: sha256:f4691c96e6bba...128ae95a60369c506dd6e6f1ab\n\
  Status: Downloaded newer image for ubuntu:latest\n\n$ docker image ls -q\nbd3d4369aebc\n\
  4e38e38c8ce0\n```\n\n看 `docker image ls -q` 如何返回一个仅包含系统本地拉取的所有镜像 ID 的列表。将此列表传递给\
  \ `docker image rm` 将如接下来所示删除系统上的所有镜像。\n\n```\n$ docker image rm $(docker image\
  \ ls -q) -f\nUntagged: ubuntu:latest\nUntagged: ubuntu@sha256:f4691c9...2128ae95a60369c506dd6e6f6ab\n\
  Deleted: sha256:bd3d4369aebc494...fa2645f5699037d7d8c6b415a10\nDeleted: sha256:cd10a3b73e247dd...c3a71fcf5b6c2bb28d4f2e5360b\n\
  Deleted: sha256:4d4de39110cd25...\n```\n\n\n\n\n启动容器最简单的方法是使用 `docker container\
  \ run` 命令。该命令可以接受很多参数，但在最基础的形式中，你告诉它要使用的镜像和要运行的应用程序：`docker container run <image>\
  \ <app>`。接下来的命令将启动一个运行 Bash shell 作为应用程序的 Ubuntu Linux 容器。\n\n```\n$ docker container\
  \ run -it ubuntu /bin/bash\n```\n\n你可以使用以下命令启动一个运行 PowerShell 应用程序的 Windows 容器。\n\
  \n```\n> docker container run -it mcr.microsoft.com/powershell:nanoserver pwsh.exe\n\
  ```\n\n在每个示例中，`-it` 标志都会将你当前的终端窗口连接到容器的 shell。\n\n容器会一直运行，直到它们执行的程序退出为止。在之前的示例中，当\
  \ Bash shell 退出时，Linux 容器退出；当 PowerShell 进程终止时，Windows 容器退出。\n\n这一点的一种简单方法是启动新容器并告诉它运行\
  \ `sleep` 命令持续 10 秒。容器将启动，占用你的终端 10 秒，然后退出。以下是在 Linux Docker 宿主机上演示此点的简单方法。\n\n\
  ```\n$ docker container run -it alpine:latest sleep 10\n```\n\n你也可以通过以下命令对 Windows\
  \ 容器执行相同的操作。\n\n```\n> docker container run microsoft/powershell:nanoserver pwsh\
  \ -c \"Start-Sleep -s 10\"\n```\n\n你可以使用 `docker container stop` 命令手动停止运行中的容器。然后可以使用\
  \ `docker container start` 重新启动它。要永久删除容器，你必须显式地使用 `docker container rm` 将其删除。\n\n\
  这就是核心介绍！现在让我们进入细节……\n\n## Docker 容器 - 深度解析\n\n我们在这里将涵盖的内容是容器和虚拟机（VM）之间的基本区别。在目前阶段这主要是理论性的，但它非常重要。\n\
  \n> **注意：** 作为作者，在继续之前我想先说这一句。我们中的许多人对所做的事情和所拥有的技能充满热情。你还记得*大型 Unix* 时代曾抵制 Linux\
  \ 的兴起。你可能还记得人们在早期抵制过 VMware。在这两种情况下，**抵制都是徒劳的**。在这一节中，我将重点介绍我认为容器模型相对于虚拟机模型的一些优势。但我猜，你们中许多人是虚拟机专家，并在虚拟机生态系统中投入了大量精力。我也猜，你们中可能有一两个想就我说的某些话与我争论。所以就让我明确一下……我是个大汉子，在肉搏中我能打赢你\
  \ :-D 开玩笑的。然而，我并不是试图摧毁你的帝国或说你的宝宝长得丑。容器和虚拟机在未来的许多年里将并肩运行。\n\n我们开始吧。\n\n### 容器 vs\
  \ 虚拟机\n\n容器和虚拟机都需要一个宿主机来运行。这可以是你的笔记本电脑、数据中心中的裸机服务器，一直到公有云中的实例。事实上，许多云服务现在都提供了在瞬态无服务器后端上运行容器的能力。如果这听起来像技术术语，请担心，它只是意味着后端是高度虚拟化的，以至于宿主机或节点的概念不再具有任何意义——你的容器只需运行即可，你不需要关心它是*如何*或在*何处*运行。\n\
  \n无论如何……让我们假设这样一个需求：你的业务有一台物理服务器，需要运行 4 个业务应用程序。\n\n在虚拟机模型中，物理服务器通电，虚拟机管理程序启动（我们跳过了\
  \ BIOS 和启动加载程序代码等）。一旦启动，虚拟机管理程序就会占用系统上的所有物理资源，如 `CPU`、`RAM`、存储和网卡（NICs）。然后它将这些硬件资源划分成虚拟版本，这些版本看起来和用起来与物理硬件完全一样。它将它们封装成一个软件结构，称为虚拟机（VM）。假设单台物理服务器需要运行\
  \ 4 个业务应用程序，我们会创建 4 个虚拟机，并在在每个虚拟机上安装操作系统，然后安装应用程序。这 7.2。假设单台物理服务器需要运行 4 个业务应用程序，我们会创建\
  \ 4 个虚拟机，安装操作系统，然后安装应用程序。这在图 7.2。\n\n![图 7.2](img/figure7-2.png)\n\n7.2\n\n在容器模型中情况有所不同。\n\
  \n无论如何……让我们假设这样一个需求：你的业务有一台物理服务器，需要运行 4 个业务应用程序。\n\n在虚拟机模型中，物理物理服务器通电，虚拟机管理程序启动（我们跳过了\
  \ BIOS 和启动加载程序代码等）。一旦启动，虚拟机管理程序就会占用系统上的所有物理资源，如 `CPU`、`RAM`、存储和网卡（NICs）。然后它将这些硬件资源划分成虚拟版本，这些版本看起来和用起来与物理硬件完全一样。它将它们封装成一个软件结构，称为虚拟机（VM）。假设单台物理服务器需要运行\
  \ 4 个业务应用程序，我们会创建 4 个虚拟机，并在在每个虚拟机上安装操作系统，然后安装应用程序。这在图 7.2。\n\n![图 7.2](img/figure-2.png)\n\
  \n7.2\n\n在容器模型中情况有所不同。\n\n无论如何……让我们假设这样一个需求：你的业务有一台物理服务器，需要运行 4 个业务应用程序。\n\n在虚拟机模型中，物理服务器通电，虚拟机管理程序启动（我们跳过了\
  \ BIOS 和启动加载程序代码等）。一旦启动，虚拟机管理程序就会占用系统上的所有物理资源，如 `CPU`、`RAM`、存储和网卡（NICs）。然后它将这些硬件资源划分成虚拟版本，这些版本看起来和用起来与物理硬件完全一样。它将它们封装成一个软件结构，称为虚拟机（VM）。假设单台物理服务器需要运行\
  \ 4 个业务应用程序，我们会创建 4 个虚拟机，并在在每个虚拟机上安装操作系统，然后安装应用程序。这在图 7.2。\n\n![图 7.2](img/figure-2.png)\n\
  \n7.2\n\n在容器模型中情况有所不同。\n\n### 虚拟机税\n\n让我们基于刚才涵盖的内容，深入探讨虚拟机模型的一个问题。\n\n我们最初从单台物理服务器和运行\
  \ 4 个业务应用程序的需求开始。在两种模型中，我们都安装了操作系统或虚拟机管理程序（针对虚拟机高度优化的操作系统）。到目前为止，这些模型几乎是相同的。但相似性到此为止了。\n\
  \n虚拟机模型将`底层硬件资源`划分成虚拟机。每个虚拟机都是包含`虚拟 CPU`、`虚拟 RAM`、虚拟磁盘磁盘等的软件结构。因此，每个虚拟机都需要自己的操作系统来获取、初始化和管理所有虚拟资源。遗憾的是，每个操作系统都带有自己的包袱和开销。例如，每个操作系统都会消耗一部分\
  \ `CPU`、`RAM` 和存储。某些操作系统还需要许可证，以及人手和基础设施来维护补丁和升级。每个操作系统还呈现出巨大的攻击面。我们通常将这一切称为`操作系统税`或`虚拟机税`——你安装的每一个操作系统都会消耗资源！\n\
  \n容器模型在宿主机上运行单一的操作系统/内核。可以在单个宿主机上运行几十或数百个容器，每个容器都共享这个单一操作系统/内核。这意味着单一操作系统消耗 `CPU`、`RAM`\
  \ 和存储。单一操作系统需要许可。单一操作系统需要更新和补丁。以及单一操作系统内核呈现出攻击面。总而言之，只有一份操作系统税！\n\n在我们运行 4 个业务应用程序的示例中，这似乎并不多。但当你开始讨论成百上千个应用程序时，它就会改变规则。\n\
  \n另一个需要考虑的因素是应用程序启动时间。由于容器不是完整的操作系统，它的启动速度比虚拟机快得多。记住，容器内部没有需要定位、解压缩和初始化的内核——不用说与正常内核引导相关的所有硬件枚举和初始化了。启动容器时不需要这些内容。运行在宿主机上的单一共享内核已经启动。最终结果是，容器可以在一秒内启动。对容器启动时间产生唯一影响的是它所运行的应用程序启动所需。\n\
  \n\n\n\n嗯，容器模型并不那么完美的一点是安全性。默认情况下，容器的安全性低于虚拟机（VMs），提供的工作负载隔离也较少。虽然有相关技术可以保护容器并对其进行锁定，但在编写此时，某些技术的复杂程度令人望望而畏。\n\
  \n在介绍完理论之后，让我们来玩玩容器吧。\n\n## 运行容器\n\n为了跟随这些示例，你需要一个可以运行的 Docker 主机。如果你还没有，我建议在你的\
  \ Mac 或 PC 上安装 `Docker Desktop`（只需在 Google 上搜索“Docker Desktop”并按照简单的“下一步、下一步、下一步”提示进行安装即可）。\n\
  \n我们将展示 Linux 和 Windows 容器的示例。不过，如果你在 Windows 10 上运行 `Docker Desktop`，可以通过在 `Linux\
  \ containers` 模式下运行 Docker Desktop 来跟进 Linux 示例。\n\n## 检查 Docker 是否运行\n\n当我登录到 Docker\
  \ 主机时，我的第一件事总是检查 Docker 是否运行。\n\n```\n$ docker version\nClient: Docker Engine -\
  \ Community\n Version:           19.03.8\n API version:       1.40\n OS/Arch:  \
  \         darwin/amd64\n Experimental:      true\n\nServer: Docker Engine - Community\n\
  \ Engine:\n  Version:          19.03.8\n  API version:      1.40 (minimum version\
  \ 1.12)\n  OS/Arch:          linux/amd64\n  Experimental:     true\n  <Snip>\n```\n\
  \n只要你在 `Client` 和 `Server` 部分都收到了响应，就可以正常运行了。如果你在 `Server` 部分收到错误代码，那么很有可能是 Docker\
  \ 守护进程（服务器）没有运行，或者你的用户账户没有访问它的权限。\n\n如果你在 Linux 机器上，且用户账户没有访问守护进程的权限，你需要确保它是本地 `docker`\
  \ Unix 组的成员。如果不是，你可以通过 `usermod -aG docker <user>` 添加它，然后你必须注销并重新登录 shell 使更改生效。\n\
  \n如果你的用户账户已经是本地 `docker` 组的成员，那么问题可能是 Docker 守护进程没有运行。要检查 Docker 守护进程的状态，请根据你的 Docker\
  \ 主机操作系统运行以下命令之一。\n\n### 未使用 Systemd 的 Linux 系统。\n\n```\n$ service docker status\n\
  docker start/running, process 29393\n```\n\n### 使用 Systemd 的 Linux 系统。\n\n```\n\
  $ systemctl is-active docker\nactive\n```\n\n### Windows 系统（从 PowerShell 终端运行）。\n\
  \n```\n> Get-Service docker\n\nStatus    Name      DisplayName\n------    ---- \
  \     -----------\nRunning   Docker    Docker Engine\n```\n\n如果 Docker 守护进程正在运行，你就可以继续了。\n\
  \n## 启动一个简单的容器\n\n如果你使用的是 `Docker Desktop`，可以参考 Linux 或 Windows 的示例。只需确保 `Docker\
  \ Desktop` 设置为正确的模式即可。\n\n启动容器最简单的方法是使用 `docker container run` 命令。\n\n以下命令启动了一个简单的容器，它将运行一个容器化版本的\
  \ Ubuntu Linux。\n\n```\n$ docker container run -it ubuntu:latest /bin/bash\nUnable\
  \ to find image 'ubuntu:latest' locally\nlatest: Pulling from library/ubuntu\nd51af753c3d3:\
  \ Pull complete \nfc878cd0a91c: Pull complete \n6154df8ff988: Pull complete \nfee5db0ff82f:\
  \ Pull complete \nDigest: sha256:747d2dbbaaee995098c9792d99bd333c6783ce56150d1b11e333bbceed5c54d7\n\
  Status: Downloaded newer image for ubuntu:latest\nroot@50949b614477:/# \n```\n\n\
  以下是一个 Windows 示例，它启动了一个运行 PowerShell (`pwsh.exe`) 的容器。\n\n```\n> docker container\
  \ run -it mcr.microsoft.com/powershell:nanoserver pwsh.exe\ndocker container run\
  \ -it mcr.microsoft.com/powershell:nanoserver pwsh.exe\nUnable to find image 'mcr.microsoft.com/powershell:nanoserver'\
  \ locally\nnanoserver: Pulling from powershell\n0fe89239909b: Pull complete \n2c9371eb1f40:\
  \ Pull complete\n<Snip>       \n806da439b031: Pull complete \nDigest: sha256:cefdb984d9...ad3ab2079a\n\
  Status: Downloaded newer image for mcr.microsoft.com/powershell:nanoserver\n\nPowerShell\
  \ 7.0.0\nCopyright (c) Microsoft Corporation. All rights reserved.\nPS C:\\>\n```\n\
  \n让我们仔细查看一下命令。\n\n`docker container run` 告诉 Docker 运行一个新的容器。`-it` 标志让容器变为交互模式并将其附加到你的终端。`ubuntu:latest`\
  \ 或 `mcr.microsoft.com/powershell:nanoserver` 告诉 Docker 从哪个镜像启动容器。最后，`/bin/bash`\
  \ 和 `pwsh.exe` 是每个容器将运行的应用程序。\n\n当你按下 `Return` 时，Docker 客户端封装命令并将其 POST 到运行在服务器上的\
  \ API 服务器。\n\n\n\n\n按下 `Ctrl-PQ` 退出容器而不终止其主进程。这样做会将你带回 Docker 宿机的 shell 中，并让容器在后台运行。你可以使用\
  \ `docker container ls` 命令查看系统上正在运行的容器列表。\n\n```\n$ docker container ls\nCNTNR ID\
  \  IMAGE          COMMAND    CREATED  STATUS    NAMES\n509...74  ubuntu:latest \
  \ /bin/bash  6 mins   Up 6mins  sick_montalcini\n```\n\n重要的一点是，这个容器仍在运行，你可以使用 `docker\
  \ container exec` 命令将你的终端重新连接到它。\n\n```\n$ docker container exec -it 50949b614477\
  \ bash\nroot@50949b614477:/#\n```\n\n重新连接到 Windows Nano Server PowerShell 容器的命令是\
  \ `docker container exec -it <container-name-or-ID> pwsh.exe`。\n\n如你所见，shell 提示符已变回容器。如果你再次运行\
  \ `ps -elf` 命令，现在将看到两个 Bash 或 PowerShell 进程。这是因为 `docker container exec` 命令创建了一个新的\
  \ Bash 或 PowerShell 进程并附加其上。这意味着在此 shell 中输入 `exit` 将不会终止容器，因为原始的 Bash 或 PowerShell\
  \ 进程将继续运行。\n\n输入 `exit` 离开容器，并使用 `docker container ls` 验证它仍在运行。它仍然会在运行。\n\n如果你正在按照示例操作，你应该使用以下两个命令停止并删除容器（你需要替换为容器\
  \ ID）。\n\n```\n$ docker container stop 50949b614477\n50949b614477\n\n$ docker container\
  \ rm 50949b614477\n50949b614477\n```\n\n在之前的示例中启动的容器将不再存在于你的系统中。\n\n## 容器生命周期\n\n\
  在本节中，我们将查看容器的生命周期——从出生、工作、休息，到最终的死亡。\n\n我们已经看到如何使用 `docker container run` 命令启动容器。让我们再次启动一个，以便我们走完它的整个生命周期。以下示例将来自运行\
  \ Ubuntu 容器的 Linux Docker 宿主机。然而，所有示例都适用于之前示例中的 Windows PowerShell 容器——显然你必须将 Linux\
  \ 命令替换为等效 Windows 命令。\n\n如之前所述，如果你在运行 Windows 10 Pro 的笔记本电脑上运行 Docker Desktop，你可以以\
  \ Linux 容器模式运行并遵循所有的 Linux 示例。\n\n```\n$ docker container run --name percy -it ubuntu:latest\
  \ /bin/bash\nroot@9cb2d2fd1d65:/#\n```\n\n容器已创建，我们将其命名为“percy”（代表 persistent，持久化）。\n\
  \n现在让我们通过向它写入一些数据来让它工作。\n\n以下步骤向 `/tmp` 目录下的新文件写入一些文本并验证操作是否成功。请务必在刚刚启动的容器内部运行这些命令。\n\
  \n```\nroot@9cb2d2fd1d65:/# cd tmp\n\nroot@9cb2d2fd1d65:/tmp# ls -l\ntotal 0\n\n\
  root@9cb2d2fd1d65:/tmp# echo \"Sunderland is the greatest football team in the world\"\
  \ > newfile\n\nroot@9cb2d2fd1d65:/tmp# ls -l\ntotal 4\n-rw-r--r-- 1 root root 14\
  \ Apr 27 11:22 newfile\n\nroot@9cb2d2fd1d65:/tmp# cat newfile\nSunderland is the\
  \ greatest football team in the world\n```\n\n按下 `Ctrl-PQ` 退出容器而不杀死它。\n\n现在使用 `docker\
  \ container stop` 命令停止容器并让进入休息。\n\n```\n$ docker container stop percy\npercy\n```\n\
  \n你可以使用容器名称或 ID 配合 `docker container stop` 命令。格式为 `docker container stop <container-id\
  \ or container-name>`。\n\n现在运行 `docker container ls` 命令列出所有运行中的容器。\n\n```\n$ docker\
  \ container ls\nCONTAINER ID   IMAGE   COMMAND   CREATED  STATUS  PORTS   NAMES\n\
  ```\n\n上面的输出中没有列该容器，因为它处于停止状态。再次运行相同的命令，这次添加 `-a` 标志以显示所有容器，包括已停止的容器。\n\n```\n$\
  \ docker container ls -a\nCNTNR ID  IMAGE          COMMAND    CREATED  STATUS  \
  \    NAMES\n9cb...65  ubuntu:latest  /bin/bash  4 mins   Exited (0)  percy\n```\n\
  \n现在我们可以看到容器显示为 `Exited (0)`。停止容器就像停止虚拟机。尽管它目前没有运行，但它的整个配置和内容仍然存在于 Docker 宿机的本地文件系统上。这意味着它可以随时重启。\n\
  \n让我们使用 `docker container start` 命令让它从休息中回来。\n\n```\n$ docker container start percy\n\
  percy\n\n$ docker container ls\nCONTAINER ID  IMAGE          COMMAND      CREATED\
  \  STATUS     NAMES\n9cb2d2fd1d65  ubuntu:latest  \"/bin/bash\"  4 mins   Up 3 secs\
  \  percy\n```\n\n停止的容器现在已重启。是时候验证了。\n\n```\n$ docker container exec percy bash\n\
  root@9cb2d2fd1d65:/#\n```\n（注：此处后续文本存在大量重复和混乱，已根据上下文逻辑进行了清理并翻译）\n\n## 优雅地停止容器\n\n\
  Linux 世界大多数容器将运行单个进程。Windows 容器的情况略有不同，但它们仍然运行单个主应用程序进程并适用于以下规则。\n\n1. 示例中创建的数据存储在\
  \ Docker 宿主机的文件系统上。如果 Docker 宿主机故障，数据将丢失。\n2. 容器被设计为不可变对象，向它们写入数据不是良好的实践。\n\n出于这些原因，Docker\
  \ 提供了数据卷（volumes），它们独立于容器存在，但可以在运行时将其挂载到容器中。\n\n在你旅程的这个阶段，这是一个有效的容器生命周期示例，你很难看出容器和虚拟机生命周期之间存在主要差异。\n\
  \n\n\n\n\n\n在上一个示例中，容器正在运行 `/bin/bash` 应用。当你使用 `docker container rm <container>\
  \ -f` 杀死正在运行的容器时，容器会在没有任何警告的情况下被杀死。这个过程非常暴力——就像从背后溜到容器后面对着脑后勺开一枪。你字面上没有给容器以及它运行的程序任何完成任何操作并优雅退出的机会。\n\
  \n然而，`docker container stop` 命令要礼貌得多——就像把枪指向容器的头部说：“你有 10 秒钟说最后的遗言”。它给了容器内部的进程一个提醒，告诉它即将被停止，让它有机会在结束到来之前整理好事务。一旦它完成，你就可以使用\
  \ `docker container rm` 删除容器。\n\n这里背后的魔法机制可以用 Linux/POSIX `signals`（信号）来解释。`docker\
  \ container stop` 向容器内部的主应用程序进程（PID 1）发送一个 `SIGTERM` 信号。正如我们所说，这为进程提供了一个清理环境并优雅自关闭的机会。如果它在\
  \ 10 秒内没有退出，它将收到一个 `SIGKILL` 信号。这实际上是致命的脑击。但嘿，它至少有 10 秒的时间来处理自己。\n\n`docker container\
  \ rm <container> -f` 则不会费心通过 `SIGTERM` 礼貌请求，而是直接执行 `SIGKILL`。\n\n#### 使用重启策略的自愈容器\n\
  \n运行带有 `restart policy`（重启策略）的容器通常是一个好主意。这是自愈的一种，使 Docker 能够在某些事件或失败发生后自动重启容器。\n\
  \n重启策略按容器应用，可以在命令行中作为 `docker-container run` 命令的一部分进行命令式配置，也可以在 YAML 文件中进行声明式配置，用于\
  \ Docker Swarm、Docker Compose 和 Kubernetes 等更高级工具。\n\n在编写本文时，存在以下重启策略：\n\n* `always`\n\
  * `unless-stopped`\n* `on-failed`\n\n`always` 策略是最简单的。除非容器被显式停止（例如通过 `docker container\
  \ stop` 命令），否则它总是重启已停止的容器。演示这一点的一种简单方法是启动一个带有 `--restart always` 策略的新交互式容器，并让它运行\
  \ shell 进程。当容器启动时，你将连接到它的 shell。在 shell 中输入 `exit` 将杀死容器的 PID 1 进程并杀死容器。然而，Docker\
  \ 会自动重启它，因为它拥有 `--restart always` 策略。如果你执行 `docker container ls` 命令，你会发现容器的运行时间少于它的创建时间。让我们来测试一下。\n\
  \n如果你正在学习 Windows 容器，请将示例中的 `docker container run` 命令替换为：`docker container run --name\
  \ neversaydie -it --restart always mcr.microsoft.com/powershell:nanoserver`。\n\n\
  ```\n$ docker container run --name neversaydie -it --restart always alpine sh\n\
  /#\n```\n\n在输入 `exit` 命令之前等待几秒钟。\n\n一旦你退出容器并回到正常的 shell 提示符，，检查容器的状态。\n\n```\n$\
  \ docker container ls\nCONTAINER ID    IMAGE    COMMAND    STATUS         NAME\n\
  0901afb84439    alpine    \"sh\"       35 seconds ago    Up 9 seconds   neversaydie\n\
  ```\n\n看，容器是在 35 秒前创建的，但只运行了 9 秒。这是因为 `exit` 命令杀死了它，而 Docker 重启了它。请注意，Docker 重启的是同一个容器，而不是创建一个新的。事实上，如果你用\
  \ `docker container inspect` 检查它，你会看到 `restartCount` 已经增加了。\n\n`--restart always`\
  \ 策略的一个有趣特性是，如果你用 `docker container stop` 停止一个容器并重启 Docker 守护进程，容器将被重启。明确一下……你启动一个带有\
  \ `--restart always` 策略的新容器，然后用 `docker container stop` 命令停止它。此时，容器处于 `Stopped (Exited)`\
  \ 状态。但是，如果你重启 Docker 守护进程，容器将在进程恢复后自动重启。你需要这一点。\n\n`always` 和 `unless-stopped` 策略之间的主要区别是，带有\
  \ `--restart unless-stopped` 策略的容器如果在守护进程重启时正处于 `Stopped (Exited)` 状态，则它们不会被重启。这句话听起来可能很困惑，所以让我们来看一个例子。\n\
  \n我们将创建两个新容器。一个名为“always”，使用 `--restart always` 策略；另一个名为“unless-stopped”，使用 `--restart\
  \ unless-stopped` 策略。我们用 `docker container stop` 命令停止它们，然后重启 Docker。“always”容器会重启，但“unless-stopped”容器不会重启。\n\
  \n1. 创建两个新容器\n\n```\n $ docker container run -d --name always \\\n   --restart always\
  \ \\\n   alpine sleep 1d\n\n $ docker container run -d --name unless-stopped \\\n\
  \   --restart unless-stopped \\\n   alpine sleep 1d\n\n $ docker container ls\n\
  CONTAINER ID   IMAGE     COMMAND       STATUS       NAMES\n3142bd91ecc4   alpine\
  \    \"sleep 1d\"    Up 2 secs    unless-stopped\n4f1b431ac729   alpine    \"sleep\
  \ 1d\"    Up 17 secs   always\n```\n\n2. 停止两个容器。\n\n```\n $ docker container stop\
  \ always unless-stopped\n\n $ docker container ls -a\nCONTAINER ID   IMAGE     STATUS\
  \                       NAMES\n3142bd91ecc4   alpine    Exited (137) 3 seconds ago\
  \    unless-stopped\n4f1b431ac729   alpine    Exited (137) 3 seconds ago    always\n\
  ```\n\n3. 重启 Docker。不同操作系统上重启 Docker 的过程不同。此示例显示了如何在运行 `systemd` 的 Linux 主机上重启 Docker。在\
  \ Windows Server 2016 上重启 Docker 请使用 `restartservice`。\n\n```\n $ systemctl restart\
  \ docker\n```\n\n4. 一旦 Docker 重启，你可以检查容器的状态。\n\n```\n $ docker container ls\nCONTAINER\
  \   CREATED             STATUS                       NAMES\n3142bd91ecc4    2 minutes\
  \ ago      Exited (137) 2 minutes ago    unless-stopped\n4f1b431ac729    2 minutes\
  \ ago      Up 9 seconds                  always\n```\n\n注意，“always”容器（使用 `--restart\
  \ always` 策略启动）已经重启了，但“unless-stopped”容器（使用 `--restart unless-stopped` 策略启动）没有重启。\n\
  \n`on-failed` 策略会在容器以非零退出码退出时重启它。它会在 Docker 守护进程重启时重启容器，即使是处于停止的容器。\n\n如果你在使用 Docker\
  \ Compose 或 Docker Stacks，可以按照如下方式为 `service` 对象应用重启策略。我们将在书后的部分详细讨论这些技术。\n\n```\n\
  version: \"3\"\nservices:\n  myservice:\n    <Snip>\n    restart_policy:\n     \
  \ condition: always | unless-stopped | on-failure\n```\n\n#### Web 服务器示例\n\n到为止，我们已经学习了如何启动一个简单的容器并与其交互。我们还看到了如何停止、重启和删除容器。现在让我们来看一个基于\
  \ Linux 的 Web 服务器示例。\n\n在这个示例中，我们将从一个镜像启动新容器，该镜像我在我的几个 Pluralsight 视频课程中使用。该镜像在\
  \ 8080 端口上运行一个简单的 Web 服务器。\n\n你可以使用 `docker container stop` 和 `docker container\
  \ rm` 命令清理系统中任何现容器。然后运行以下命令来启动一个新的 Web 服务器容器。\n\n\n\n\n\n```\n$ docker container\
  \ run -d --name webserver -p 80:8080 \\\n  nigelpoulton/pluralsight-docker-ci\n\n\
  Unable to find image 'nigelpoulton/pluralsight-docker-ci:latest' locally\nlatest:\
  \ Pulling from nigelpoulton/pluralsight-docker-ci\na3ed95caeb02: Pull complete\n\
  3b231ed5aa2f: Pull complete\n7e4f9cd54d46: Pull complete\n929432235e51: Pull complete\n\
  6899ef41c594: Pull complete\n0b38fccd0dab: Pull complete\nDigest: sha256:7a6b0125fe7893e70dc63b2...9b12a28e2c38bd8d3d\n\
  Status: Downloaded newer image for nigelpoulton/plur...docker-ci:latest\n6efa1838cd51b92a4817e0e7483d103bf72a7ba7ffb5855080128d85043fef21\n\
  ```\n\n注意，你的 shell 提示符没有变化。这是因为该容器是通过 `-d` 标志在后台启动的。这种方式启动容器不会将其附加到你的终端上。\n\n让我们来看看命令中的其他一些参数。\n\
  \n我们知道 `docker container run` 会启动一个新的容器。然而，这次我们给它提供了 `-d` 标志而不是 `-it`。`-d` 代表 `daemon`（守护进程）模式，告诉容器在后台运行。你不能在同一个命令中同时使用\
  \ `-d` 和 `-it` 标志。\n\n之后，命令将容器命名为 `webserver`。`-p` 标志将 Docker 宿主机上的 80 端口映射到容器内部的\
  \ 8080 端口。这意味着访问 Docker 宿主机 80 端口的流量将被重定向到容器内部的 `8080` 端口。恰好我们为此容器使用的镜像定义了一个监听 8080\
  \ 端口的 Web 服务。这意味着容器将启动并运行一个监听 8080 端口的 Web 服务器。\n\n最后，命令告诉容器基于 `nigelpoulton/pluralsight-docker-ci`\
  \ 镜像。该镜像包含一个 node.js Web 服务器和所有依赖项。它大约每年维护一次，因此可能会包含漏洞！\n\n一旦容器运行，执行 `docker container\
  \ ls` 命令将显示容器处于运行状态以及映射的端口。需要通过这一点是，端口映射的表达式为 `host-port:container-port`。\n\n```\n\
  $ docker container ls\nCONTAINER ID  COMMAND        STATUS       PORTS         \
  \      NAMES\n6efa1838cd51  /bin/sh -c...  Up 2 mins  0.0.0.0:80->8080/tcp  webserver\n\
  ```\n\n输出结果中移除了一些列，以提高可读性。\n\n现在容器正在运行且端口已映射，你可以通过将 浏览器指向 `Docker host` 上的 80 端口的\
  \ IP 地址或 DNS 名称来连接它。图 7.4 显示了该容器提供的网页。\n\n![Figure 7.4](img/figure7-4.png)\n\n图\
  \ 7.4\n\n可以使用相同的 `docker container stop`、`docker container pause`、`docker container\
  \ start` 和 `docker container rm` 命令来操作该容器。\n\n### 检查容器\n\n在之前的 Web 服务器示例中，你可能注意到，当我们执行\
  \ `docker container run` 命令时，并没有为容器指定应用程序。然而，容器仍然运行了一个 Web 服务。这是如何实现的？\n\n在构建 Docker\
  \ 镜像时，你可以嵌入一条指令，列出任何使用该镜像容器的默认应用程序。你可以通过运行 `docker image inspect` 查看任何镜像的此类信息。\n\
  \n```\n$ docker image inspect nigelpoulton/pluralsight-docker-ci\n\n[\n    {\n \
  \       \"Id\": \"sha256:07e574331ce3768f30305519...49214bf3020ee69bba1\",\n   \
  \     \"RepoTags\": [\n            \"nigelpoulton/pluralsight-docker-ci:latest\"\
  \n\n            <Snip>\n\n            ],\n            \"Cmd\": [\n             \
  \   \"/bin/sh\",\n                \"-c\",\n                \"#(nop) CMD [\\\"/bin/sh\\\
  \" \\\"-c\\\" \\\"cd /src \\u0026\\u0026 node ./app.js\\\"]\"\n            ],\n\
  <Snip>\n```\n\n输出经过了截断，以便找到我们感兴趣的信息。\n\n`Cmd` 之后的项目显示了将运行的命令/程序，除非在使用 `docker container\
  \ run` 启动容器时用不同的命令覆盖它。如果你移除示例中所有的 shell 转义字符，你将得到以下命令 `/bin/sh -c \"cd /src && node\
  \ ./app.js\"`。这就是基于此镜像的容器将运行的默认程序。你可以继续检查其他镜像，有时默认程序会被列为 `Entrypoint` 而不是 `Cmd`。\n\
  \n使用此类默认命令构建镜像很常见，因为这使得启动容器变得更容易。它也强制了容器的启动。\n\n### 清理\n\n现在容器正在运行且端口已映射，你可以通过将浏览器指向\
  \ `Docker host` 上的 80 端口的 IP 地址或 DNS 名称来连接它。图 7.4 显示了该容器提供的网页。\n\n可以使用相同的 `docker\
  \ container stop`、`docker container pause`、`docker container start` 和 `docker container\
  \ rm` 命令来操作该容器。\n\n### 容器 - 命令\n\n*   `docker container run` 是用于启动新容器的命令。在最简单的形式下，它接受\
  \ `image` 和 `command` 作为参数。镜像用于创建容器，而命令是容器启动时运行的应用程序。此示例将在以前台启动一个 Ubuntu 容器，并告诉它运行\
  \ shell：`docker container run -it ubuntu /bin/bash`。\n\n*   `Ctrl-PQ` 将你的 shell\
  \ 从终端中分离，并让容器在后台保持运行 `(UP)`。\n\n*   `docker container ls` 列出所有处于运行 `(UP)` 状态的容器。如果你添加\
  \ `-a` 标志，还将看到处于停止 `(Exited)` 状态的容器。\n\n*   `docker container exec` 在运行的容器内部执行新进程。它适用于将\
  \ Docker 宿机的 shell 附加到运行容器内部的终端。此命令将在运行容器内启动一个新的 Bash shell 并连接到它：`docker container\
  \ exec -it <container-name or container-id> bash`。要实现此功能，创建容器的镜像必须包含 Bash shell。\n\
  \n*   `docker container stop` 将停止运行的容器并将其置于 `Exited (0)` 状态。它是通过向容器内部 PID 为 1 的进程发送\
  \ `SIGTERM` 实现的。如果进程在 10 秒内未清理并停止，将发送 SIGKILL 以强制停止容器。`docker container stop` 接受容器\
  \ ID 和容器名称作为参数。\n\n*   `docker container start` 重启已停止的 `(Exited)` 容器。你可以给 `docker\
  \ container start` 容器的名称或 ID。\n\n*   `docker container rm` 删除停止的容器。你可以指定容器容器。建议在使用\
  \ `docker container rm` 删除之前先用 `docker container stop` 命令停止容器。\n\n*   `docker container\
  \ inspect` 将显示有关容器的详细配置和运行时信息。它接受容器名称和容器 ID 作为主参数。\n\n## 章节总结\n\n\n\n\n在本章中，我们对比了容器和虚拟机（VM）模型。我们研究了虚拟机模型中固有的\
  \ `OS tax` 问题，并看到了容器模型如何带来巨大的优势，这就像虚拟机模型相比于物理服务器模型带来的巨大优势一样。\n\n我们学习了如何使用 `docker\
  \ container run` 命令来启动几个简单的容器，并看到了前台交互式容器与后台运行容器之间的区别。\n\n我们知道杀死容器内部的 `PID 1` 进程会杀死容器。我们还学习了如何启动、停止和删除容器。\n\
  \n最后，我们使用 `docker container inspect` 命令查看详细的容器元数据完成了本章。\n\n到目前为止一切顺利！\n\n# 8: 应用程序容器化\n\
  \nDocker 的核心在于将应用程序并使其运行在容器中。\n\n将一个应用程序并将其配置为作为容器运行的过程被称为“容器化”。\n\n在本章中，我们将演示一个基于\
  \ Linux 的简单 Web 容器容器化。如果你没有 Linux Docker 环境来跟随操作，可以免费使用 `Play With Docker`。只需将浏览器指向\
  \ `https://play-with-docker.com` 并启动一些 Linux Docker 节点即可。这是我启动 Docker 并进行测试的最喜欢的方式！\n\
  \n我们将本章分为通常三个部分：\n\n*   TLDR（要点回顾）\n*   深度解析\n*   命令\n\n让我们开始容器化应用程序吧！\n\n## 应用程序容器化\
  \ - TLDR\n\n容器的核心在于让应用易于`build`、`ship` 和 `run`。\n\n容器化的过程如下：\n\n1. 从应用程序代码和依赖项开始\n\
  2. 创建一个 `Dockerfile`，描述你的应用、依赖项以及如何运行它\n3. 将 `Dockerfile` 传入 `docker image build`\
  \ 命令\n4. 将新镜像推送到注册表（可选）\n5. 从镜像运行容器\n\n一旦你的应用被容器化（变成了容器镜像），你就可以分享它并作为容器运行它。\n\n\
  图 8.1 用图片形式展示了这一过程。\n\n![图 8.1 - 应用程序容器化的基本流程](img/figure8-1.png)\n\n图 8.1 - 应用程序容器化的基本流程\n\
  \n## 应用程序容器化 - 深度解析\n\n我们将本章的深度解析部分拆分为如下：\n\n*   容器化单容器应用\n*   使用多阶段构建进入生产环境\n*\
  \   一些最佳实践\n\n### 容器化单容器应用\n\n本章的其余部分将演示一个简单的 Node.js Web 应用的容器化过程。\n\n我们将完成以下高层步骤：\n\
  \n*   克隆仓库获取应用代码\n*   检查 `Dockerfile`\n*   容器化应用\n*   运行应用\n*   测试应用\n*   深入观察\n\
  *   使用 `Multi-stage Builds`（多阶段构建）进入生产\n*   一些最佳实践\n\n本章中的示例是一个单容器应用。下一章将包含一个稍微复杂的多容器应用，而在\
  \ Docker Stacks 章节中，我们将转向一个更复杂的应用。\n\n### 获取应用程序代码\n\n示例中使用的应用程序可以在 GitHub 上找到：\n\
  \n*   `https://github.com/nigelpoulton/psweb.git`\n\n从 GitHub 克隆该示例应用。\n\n```\n\
  $ git clone https://github.com/nigelpoulton/psweb.git\n\nCloning into 'psweb'...\n\
  remote: Counting objects: 15, done.\nremote: Compressing objects: 100% (11/11),\
  \ done.\nremote: Total 15 (delta 2), reused 15 (delta 2), pack-reused 0\nUnpacking\
  \ objects: 100% (15/15), done.\nChecking connectivity... done.\n```\n\n克隆操作创建了一个名为\
  \ `psweb` 的新目录。进入 `psweb` 目录并列出内容。\n\n```\n$ cd psweb\n\n$ ls -l\ntotal 28\n-rw-r--r--\
  \ 1 root root  341 Sep 29 16:26 app.js\n-rw-r--r-- 1 root root  216 Sep 29 16:26\
  \ circle.yml\n-rw-r--r-- 1 root root  338 Sep 29 16:26 Dockerfile\n-rw-r--r-- 1\
  \ root root  421 Sep 29 16:26 package.json\n-rw-r--r-- 1 root root  370 Sep 29 16:26\
  \ README.md\ndrwxr-xr-x 2 root root 4096 Sep 29 16:26 test\ndrwxr-xr-x 2 root root\
  \ 4096 Sep 29 16:26 views\n```\n\n该目录包含所有的应用程序源代码，以及视图和单元测试的子目录。可以随意查看这些文件——该应用非常简单。我们在本章中不会使用单元测试。\n\
  \n现在我们已经有了应用代码，让我们来看它的 `Dockerfile`。\n\n#### 检查 Dockerfile\n\n`Dockerfile` 是创建容器镜像的起点——它描述了一个应用程序并告诉\
  \ Docker 如何将其构建成镜像。\n\n包含应用程序和依赖项的目录被称为 `build context`（构建上下文）。这是一项常见的做法。\n\n```\n\
  $ cat Dockerfile\n\nFROM alpine\nLABEL maintainer=\"nigelpoulton@hotmail.com\"\n\
  RUN apk add --update nodejs nodejs-npm\nCOPY . /src\nWORKDIR /src\nRUN npm install\n\
  EXPOSE 8080\nENTRYPOINT [\"node\", \"app.js\"]\n```\n\n\n\n接着，`RUN npm install`\
  \ 指令会创建一个新层，并使用 `npm` 安装构建环境中 `package.json` 文件中列出的应用程序依赖项。它在上条指令设置的 `WORKDIR` 上下文中运行，并将依赖项安装到新创建的层中。在\
  \ Dockerfile 的此阶段，镜像已经有了四层，如图 8.5 所示。\n\n![Figure 8.5](img/figure8-5.png)\n\n图 8.5\n\
  \n应用程序在 TCP 端口 8080 上暴露了一个 Web 服务，因此 Dockerfile 通过 `EXPOSE 8080` 指令对此记录了这一点。这是作为镜像元数据添加的，而不是镜像层。\n\
  \n最后，使用 `ENTRYPOINT` 指令设置镜像（容器）应该运行的主程序。这同样作为元数据添加，而不是镜像层。\n\n### 应用程序容器化/构建镜像\n\
  \n现在我们已经了解了它的工作原理，让我们来构建它吧！\n\n以下命令将构建一个名为 `web:latest` 的新镜像。命令末尾的点（`.`）告诉 Docker\
  \ 使用 shell 当前的工作目录作为 `build context`（构建上下文）。\n\n务必包含末尾的点（`.`），并确保在包含 Dockerfile\
  \ 和应用程序代码的 `psweb` 目录下运行该命令。\n\n```\n$ docker image build -t web:latest .\n\nSending\
  \ build context to Docker daemon  76.29kB\nStep 1/8 : FROM alpine\nlatest: Pulling\
  \ from library/alpine\nff3a5c916c92: Pull complete\nDigest: sha256:7df6db5aa6...0bedab9b8df6b1c0\n\
  Status: Downloaded newer image for alpine:latest\n ---> 76da55c8019d\n<Snip>\nStep\
  \ 8/8 : ENTRYPOINT node ./app.js\n ---> Running in 13977a4f3b21\n ---> fc69fdc4c18e\n\
  Removing intermediate container 13977a4f3b21\nSuccessfully built fc69fdc4c18e\n\
  Successfully tagged web:latest\n```\n\n检查镜像是否存在于你的 Docker 宿机的本地仓库中。\n\n```\n$ docker\
  \ image ls\nREPO    TAG       IMAGE ID          CREATED              SIZE\nweb \
  \    latest    fc69fdc4c18e      10 seconds ago       81.5MB\n```\n\n恭喜，应用程序已经容器化了！\n\
  \n你可以使用 `docker image inspect web:latest` 命令来验证镜像的配置。它将列出从 Dockerfile 配置的所有设置。请注意镜像层列表和\
  \ `Entrypoint` 命令。\n\n### 推送镜像\n\n一旦创建了镜像，将其存储在镜像仓库（image registry）中是一个好主意，这样可以保持安全并让其他人可以使用。Docker\
  \ Hub 是最常见的公共镜像仓库，也是 `docker image push` 命令的默认推送位置。\n\n为了将镜像推送到 Docker Hub，你需要使用你的\
  \ Docker ID 登录。你还需要对镜像进行适当标记。\n\n让我们登录 Docker Hub 并推送新创建的镜像。\n\n在以下示例中，你需要将我的 Docker\
  \ ID 替换为你自己的。因此，每当你看到“nigelpoulton”时，请将其交换为你的 Docker ID（Docker Hub 用户名）。\n\n```\n\
  $ docker login\nLogin with **your** Docker ID to push and pull images from Docker\
  \ Hub...\nUsername: nigelpoulton\nPassword:\nLogin Succeeded\n```\n\n在推送镜像之前，你需要以一种特殊方式对其进行标记。这是因为\
  \ Docker 在推送镜像时需要所有以下信息：\n\n*   `Registry`（注册表）\n*   `Repository`（仓库）\n*   `Tag`（标签）\n\
  \nDocker 有自己的倾向，因此默认情况下会将镜像推送到 Docker Hub。你可以推送到其他仓库，但必须在 `docker image push` 命令中显式设置仓库\
  \ URL。\n\n之前的 `docker image ls` 输出显示镜像被标记为 `web:latest`。这翻译为名为 `web` 的仓库和一个标记为 `latest`\
  \ 的镜像。结果，`docker image push` 将尝试将镜像推送到 Docker Hub 上名为 `web` 的仓库。然而，我没有 `web` 仓库的权限，我所有的镜像都位于\
  \ `nigelpoulton` 二级命名空间。这意味着我重新标记镜像以包含我的 Docker ID。记得替换为你自己的 Docker ID。\n\n```\n\
  $ docker image tag web:latest nigelpoulton/web:latest\n```\n\n命令的格式为 `docker image\
  \ tag <current-tag> <new-tag>`，它添加了一个额外的标记，而不会覆盖原始标记。\n\n另一个镜像列表显示镜像现在有两个标记，其中一个包含了我的\
  \ Docker ID。\n\n```\n$ docker image ls\nREPO                TAG       IMAGE ID \
  \        CREATED         SIZE\nweb                 latest    fc69fdc4c18e     10\
  \ secs ago     64.4MB\nnigelpoulton/web    latest    fc69fdc4c18e     10 secs ago\
  \     64.4MB\n```\n\n现在我们可以将其推送到 Docker Hub 了。你不能将镜像推送到我的 Docker Hub 命名空间仓库，你必须标记镜像以使用你自己的。\n\
  \n```\n$ docker image push nigelpoulton/web:latest\nThe push refers to repository\
  \ [docker.io/nigelpoulton/web]\n2444b4ec39ad: Pushed\ned8142d2aff2: Pushed\n```\n\
  \n\n\n\n某些指令会创建新层，而另一些仅向镜像配置文件中添加元数据。\n\n创建新层的指令示例有 `FROM`、`RUN` 和 `COPY`。创建元数据的示例包括\
  \ `EXPOSE`、`WORKDIR`、`ENV` 和 `ENTRYPOINT`。基本原理是：如果一个指令正在向镜像添加文件和程序等 `content`，它将创建一个新层。如果它添加的是关于如何构建镜像和运行应用程序的指令，它将创建元数据。\n\
  \n你可以使用 `docker image history` 命令查看构建镜像时使用的指令。\n\n```\n$ docker image history web:latest\n\
  \nIMAGE     CREATED BY                                      SIZE\nfc6..18e  /bin/sh\
  \ -c #(nop)  ENTRYPOINT [\"node\" \"./a...   0B\n334..bf0  /bin/sh -c #(nop)  EXPOSE\
  \ 8080/tcp              0B\nb27..eae  /bin/sh -c npm install                   \
  \       14.1MB\n932..749  /bin/sh -c #(nop) WORKDIR /src                  0B\n052..2dc\
  \  /bin/sh -c #(nop) COPY dir:2a6ed1703749e80...   22.5kB\nc1d..81f  /bin/sh -c\
  \ apk add --update nodejs nodejs-npm   46.1MB\n336..b92  /bin/sh -c #(nop)  LABEL\
  \ maintainer=nigelp...   0B\n3fd..f02  /bin/sh -c #(nop)  CMD [\"/bin/sh\"]    \
  \          0B\n<missing> /bin/sh -c #(nop) ADD file:093f0723fa46f6c...   4.15MB\n\
  ```\n\n上述输出中有两点值得注意。\n\n首先。每一行对应 Dockerfile 中的一条指令（从下往上）。`CREATED BY` 列甚至列出了执行的精确\
  \ Dockerfile 指令。\n\n其次。输出中显示的行中只有 4 行创建了新层（`SIZE` 列中非零值的行）。这些对应于 Dockerfile 中的 `FROM`、`RUN`\
  \ 和 `COPY` 指令。虽然其他指令看起来也创建了层，但它们实际上创建的是元数据而不是层。`docker image history` 输出看起来所有指令都创建了层，是因为以前构建和镜像分层的工作方式遗留。\n\
  \n使用 `docker image inspect` 命令确认只创建了 4 个层。\n\n```\n$ docker image inspect web:latest\n\
  \n<Snip>\n},\n\"RootFS\": {\n    \"Type\": \"layers\",\n    \"Layers\": [\n    \
  \    \"sha256:cd7100...1882bd56d263e02b6215\",\n        \"sha256:b3f88e...cae0e290980576e24885\"\
  ,\n        \"sha256:3cfa21...cc819ef5e3246ec4fe16\",\n        \"sha256:4408b4...d52c731ba0b205392567\"\
  \n    ]\n},\n```\n\n使用 `FROM` 指令来自官方仓库的镜像被认为是一种良好的实践。这是因为它们的内容经过了审核，并且在修复漏洞时能够快速发布新版本。从小型镜像开始（`FROM`）也是一个好主意，因为这可以保持镜像较小并减少攻击面和潜在漏洞。\n\
  \n你可以查看 `docker image build` 命令的输出来了解构建镜像的基本流程。如下片段所示，基本流程是：`启动一个临时容器` > `在该容器内运行\
  \ Dockerfile 指令` > `将结果保存为新的镜像层` > `删除临时容器`。\n\n```\nStep 3/8 : RUN apk add --update\
  \ nodejs nodejs-npm\n ---> Running in e690ddca785f    << Run inside of temp container\n\
  fetch http://dl-cdn...APKINDEX.tar.gz\nfetch http://dl-cdn...APKINDEX.tar.gz\n(1/10)\
  \ Installing ca-certificates (20171114-r0)\n<Snip>\nOK: 61 MiB in 21 packages\n\
  \ ---> c1d31d36b81f               << Create new layer\nRemoving intermediate container\
  \  << Remove temp container\nStep 4/8 : COPY . /src\n```\n\n## 使用多阶段构建迁移生产环境\n\n\
  在涉及 Docker 镜像时，大即是！\n\n大意味着慢。大意味着难以处理。大还意味着更多的潜在漏洞和可能更大的攻击面！\n\n由于这些原因，Docker 镜像应该是小的。游戏的目标是只发布包含生产环境运行应用程序`所需`内容的生产镜像。\n\
  \n问题是……保持镜像小是一项辛苦的工作。\n\n例如，编写 Dockerfile 的方式对镜像的大小有巨大影响。一个常见的例子是每个 `RUN` 指令都会添加新层。因此，通常认为最佳实践是将多个命令作为单个\
  \ `RUN` 指令的一部分——全部通过双安（`&&`）和反斜杠（`\\`）换行连接在一起。虽然这不是什么高科技，但它需要自律。\n\n多阶段构建允许你在单个\
  \ Dockerfile 中使用多个 `FROM` 语句。每个 `FROM` 指令都会启动构建的新阶段。你可以从之前的阶段将文件复制到当前阶段。\n\n以下示例展示了一个多阶段\
  \ Dockerfile：\n\n```\nFROM node:latest AS storefront\nWORKDIR /app\nCOPY package*.json\
  \ ./\nRUN npm install\nCOPY . .\nRUN npm run build\n\nFROM maven:latest AS appserver\n\
  WORKDIR /app\nCOPY pom.xml .\nCOPY src .\nRUN mvn package -DskipTests\n\nFROM java:8-jdk-alpine\
  \ AS production\nRUN adduser -D gordon\nWORKDIR /app\nCOPY --from=storefront /app/build/\
  \ ./static\nCOPY --from=appserver /app/target/*.jar ./app.jar\nENTRYPOINT [\"java\"\
  , \"-jar\", \"/app.jar\"]\nCMD [\"--spring.profiles.active=prod\"]\n```\n\n首先需要注意的是，Dockerfile\
  \ 有三个 `FROM` 指令。每一个指令都构成一个不同的构建阶段。然而，我们还为每个阶段赋予了名称：\n\n*   阶段 0 称为 `storefront`\n\
  *   阶段 1 称为 `appserver`\n*   阶段 2 称为 `production`\n\n`storefront` 阶段拉取 `node:latest`\
  \ 镜像，大小超过 900MB。它设置了工作目录，复制了一些代码，并使用两个 `RUN` 指令执行了一些 `npm` 操作。这增加了三个层和相当的体积。生成的镜像比基础\
  \ `node:latest` 镜像还要大，因为它包含了构建内容，而不是太多的应用代码。\n\n`appserver` 阶段拉取 `maven:latest`\
  \ 镜像，大小超过 500MB。它通过两个 `COPY` 指令和两个 `RUN` 指令增加了四层内容。这产生了另一个巨大的镜像，带有构建工具和很少的生产代码。\n\
  \n`production` 阶段开始拉取 `java:8-jdk-alpine` 镜像。该镜像约为 150MB——比之前阶段使用的 node 和 maven\
  \ 镜像小得多。它添加了一个用户，设置了工作目录，并从 `storefront` 阶段生成的镜像中复制了一些应用代码。之后，它设置了另一个工作目录，并从 `appserver`\
  \ 阶段生成的镜像中复制了应用程序代码。最后，它设置了镜像运行的主程序。\n\n需要注意的是，`COPY --from` 指令用于从之前构建的镜像中仅复制生产相关的应用代码。它们没有复制生产所需的构建产物。\n\
  \n同样重要的是，我们只需要一个 Dockerfile，`docker image build` 命令不需要额外的参数！\n\n\n\n\n说到这里……让我们开始构建它。\n\
  \n### 克隆仓库库。\n\n```bash\n$ git clone https://github.com/nigelpoulton/atsea-sample-shop-app.git\n\
  \nCloning into 'atsea-sample-shop-app'...\nremote: Counting objects: 632, done.\n\
  remote: Total 632 (delta 0), reused 0 (delta 0), pack-reused 632\nReceiving objects:\
  \ 100% (632/632), 7.23 MiB | 1.88 MiB/s, done.\nResolving deltas: 100% (195/195),\
  \ done.\nChecking connectivity... done.\n```\n\n进入克隆仓库的 `app` 文件夹并验证 `Dockerfile`\
  \ 是否存在。\n\n```bash\n$ cd atsea-sample-shop-app/app\n\n$ ls -l\ntotal 24\n-rw-r--r--\
  \ 1 root root  682 Oct  1 22:03 Dockerfile\n-rw-r--r-- 1 root root 4365 Oct  1 22:03\
  \ pom.xml\ndrwxr-xr-x 4 root root 4096 Oct  1 22:03 react-app\ndrwxr-xr-x 4 root\
  \ root 4096 Oct  1 22:03 src\n```\n\n执行构建（这可能需要几分钟完成，因为拉取的某些镜像较大）。\n\n```bash\n\
  $ docker image build -t multi:stage .\n\nSending build context to Docker daemon\
  \  3.658MB\nStep 1/19 : FROM node:latest AS storefront\nlatest: Pulling from library/node\n\
  aa18ad1a0d33: Pull complete\n15a33158a136: Pull complete\n<Snip>\nStep 19/19 : CMD\
  \ --spring.profiles.active=postgres\n ---> Running in b4df9850f7ed\n ---> 3dc0d5e6223e\n\
  Removing intermediate container b4df9850f7ed\nSuccessfully built 3dc0d5e6223e\n\
  Successfully tagged multi:stage\n```\n\n> **注意：** 上述示例使用的 `multi:stage` 标签是随意的。你可以根据自己的需求和标准对镜像进行标记——并没有要求像我们在示例中那样对多阶段构建进行标记。\n\
  \n运行 `docker image ls` 查看构建操作拉取并创建的镜像列表。\n\n```bash\n$ docker image ls\n\nREPO \
  \   TAG             IMAGE ID        CREATED        SIZE\nnode    latest        \
  \  a5a6a9c32877    5 days ago     941MB\n<none>  <none>          d2ab20c11203  \
  \  9 mins ago     1.11GB\nmaven   latest          45d27d110099    9 days ago   \
  \  508MB\n<none>  <none>          fa26694f57cb    7 mins ago     649MB\njava   \
  \ 8-jdk-alpine    3fd9dd82815c    7 months ago   145MB\nmulti   stage          \
  \ 3dc0d5e6223e    1 min ago      210MB\n```\n\n上述输出的第一行显示了 `storefront` 阶段拉取的 `node:latest`\
  \ 镜像。下面的镜是由该阶段产生的镜像（通过添加代码并运行 `npm install` 和构建操作创建）。两者都是非常大的镜像，包含了大量的构建垃圾。\n\n\
  第 3 行和第 4 行是 `appserver` 阶段拉取和产生的镜像。它们都非常大，并且包含了许多构建工具。\n\n最后一行是由 `Dockerfile` 中的最终构建阶段（stage2/production）构建的\
  \ `multi:stage` 镜像。你可以看到，这比之前阶段拉取和产生的镜像要小得多。这是因为它基于更小的 `java:8-jdk-alpine` 镜像，并且只添加了之前阶段中与生产相关的应用文件。\n\
  \n最终结果是通过单个 `Dockerfile`、一个标准的 `docker image build` 命令创建的小型生产级镜像，且零额外的脚本！\n\n多阶段构建是\
  \ Docker 17.05 引入的新功能，是构建小型生产级可用镜像的优秀特性。\n\n### 一些最佳实践\n\n在结束本章之前，让我们列出一些最佳实践。此列表并非详尽。\n\
  \n#### 利用构建缓存\n\nDocker 使用的构建过程具有缓存的概念，并利用它来加速构建过程。查看缓存影响的最佳方法是在干净的 Docker 宿主机上构建新镜像，然后立即重复相同的构建。第一次构建将拉取镜像并花费时间构建层。第二次构建将几乎瞬间完成。这是因为来自第一次构建的产物（如层）被缓存并供后续构建利用。\n\
  \n正如我们所知，`docker image build` 过程会从顶部开始逐行遍历 `Dockerfile`。对于每条指令，Docker 都会检查其缓存中是否已经有了该指令的镜像层。如果有，这就是一次*缓存命中*（cache\
  \ hit），它将使用该层。如果没有，这就是*缓存未命中*（cache miss），它将根据该指令构建新层。获得*缓存命中*可以极大地加快构建过程。\n\n让我们来看一个例子：\n\
  \n```dockerfile\nFROM alpine\nRUN apk update && apk add node\nCOPY . /app\nWORKDIR\
  \ /app\nRUN npm install\nCMD [\"node\", \"index.js\"]\n```\n\n如果我们修改 `Dockerfile`\
  \ 改变最后一行：\n\n```dockerfile\nFROM alpine\nRUN apk update && apk add node\nCOPY .\
  \ /app\nWORKDIR /app\nRUN npm install\nCMD [\"node\", \"app.js\"]\n```\n\n当我们再次运行构建时，前五条指令将命中缓存。`CMD`\
  \ 指令将产生缓存未命中，因为命令发生了变化。\n\n如果我们更改 `app` 目录的内容，`COPY . /app` 指令将产生缓存未命中，这会导致后续构建的缓存失效。\n\
  \n如果我们更改靠上的行：\n\n```dockerfile\nFROM alpine\nRUN apk update && apk add node\nCOPY\
  \ . /app\nWORKDIR /app\nRUN npm install\nCMD [\"node\", \"index.js\"]\n```\n\n`RUN\
  \ npm install` 指令将产生缓存未命中，由于位于 `CMD` 指令上方，`CMD` 也不会被缓存。\n\n为了减少缓存未命中，请将不太可能变化的指令放在\
  \ `Dockerfile` 顶部，将更可能变化的指令放在底部。\n\n你还可以通过向 `docker image build` 命令传递 `--no-cache=true`\
  \ 标志来强制构建过程忽略整个缓存。\n\n同样重要的是要理解 `COPY` 和 `ADD` 指令包含步骤，以确保复制到镜像的内容自上次构建以来没有发生变化。例如，`Dockerfile`\
  \ 中的 `COPY . /src` 指令可能自上次以来没有变化，**但是……** 复制到镜像的目录内容**发生了**变化！\n\n为了防止这种情况，Docker\
  \ 会对每个复制的文件进行校验和，并将其与缓存层中相同文件的校验和进行比较。如果校验和不匹配，缓存将失效并构建新层。\n\n#### 压缩镜像\n\n压缩镜像并不是真正的最佳实践，因为它有有利有弊。\n\
  \n从高级来看，Docker 遵循正常流程构建镜像，然后添加一个额外的步骤将所有内容压缩成单个层。\n\n\n\n当镜像开始包含大量层且这种情况并不理想时，压缩（Squashing）可能会很有帮助。一个例子可能是创建一个新的基础镜像，你希望在将来从它构建构建其他镜像——这个基础镜像作为单层镜像会效果好得多。\n\
  \n从负面来看，压缩后的镜像不共享镜像层。这可能导致存储效率低下，并增加推送（push）和拉取（pull）操作。\n\n如果你想创建一个压缩镜像，请在 `docker\
  \ image build` 命令中添加 `--squash` 标志。\n\n图 8.8 显示了压缩镜像的一些低效之处。这两个镜像完全相同，除了一个是压缩的而另一个不是。未压缩的镜像与宿主机上的其他镜像共享层（节省了磁盘空间），但压缩镜像没有。在执行\
  \ `docker image push` 命令时，压缩镜像将需要将每一个字节发送到 Docker Hub，而未压缩的镜像只需要发送唯一的层。\n\n![图 8.8\
  \ - 压缩镜像与未压缩镜像对比](img/figure8-8.png)\n\n图 8.8 - 压缩镜像与未压缩镜像\n\n### 使用 no-install-recommends\n\
  \n如果你正在构建 Linux 镜像并使用 apt 软件包管理器，你应该在 `apt-get install` 命令中使用 `no-install-recommends`\
  \ 标志。这确保了 `apt` 只安装主依赖项（`Depends` 字段中的包），而不安装推荐或建议的包。这可以大大减少下载到镜像中不需要的软件包的数量。\n\n\
  ### 容器化应用 - 命令\n\n* `docker image build` 是读取 Dockerfile 并将应用程序容器化的命令。`-t` 标志为镜像标记标签，`-f`\
  \ 标志允许你指定 Dockerfile 的名称和位置。通过 `-f` 标志，可以使用任意名称和任意位置的 Dockerfile。*构建上下文*（build context）是你的应用程序文件所在的地方，它可以是本地\
  \ Docker 宿主机上的目录，也可以是远程 Git 仓库。\n\n* Dockerfile 中的 `FROM` 指令指定了你将构建的新镜像的基础镜像。它通常是\
  \ Dockerfile 中的第一条指令，一种最佳实践是在这一行使用来自官方仓库的镜像。\n\n* Dockerfile 中的 `RUN` 指令允许你在镜像内部运行命令。每个\
  \ `RUN` 指令都会创建一个新的层。\n\n* Dockerfile 中的 `COPY` 指令将文件作为新层添加到镜像中。使用 `COPY` 指令将应用程序代码拷贝到镜像中是常见做法。\n\
  \n* Dockerfile 中的 `EXPOSE` 指令记录了应用程序使用的网络端口。\n\n* Dockerfile 中的 `ENTRYPOINT` 指令设置了镜像作为容器启动时运行的默认应用程序。\n\
  \n* 其他 Dockerfile 指令包括 `LABEL`、`ENV`、`ONBUILD`、`HEALTHCHECK`、`CMD` 等……\n\n###章节总结\n\
  \n在本章中，我们学习了如何将应用程序容器化。\n\n我们从远程 Git 仓库拉取了一些应用程序代码。该仓库包含了应用代码以及一个包含如何将应用构建成镜像指令的\
  \ Dockerfile。我们学习了 Dockerfile 工作的基本原理，并将其输入到 `docker image build` 命令中创建一个新镜像。\n\n\
  镜像创建后，我们从它启动了一个容器并使用网络浏览器对其进行了测试。\n\n之后，我们看到了多阶段构建（multi-stage builds）如何为我们提供了一种简单的方法，用于构建并将更小的镜像到生产环境中。\n\
  \n我们还学到 Dockerfile 是记录应用程序的优秀工具。因此，它可以加快新开发者的上手速度，并弥合开发人员与运维人员之间的分沟。考虑到这一点，像对待代码一样对待它，将其提交并检入版本控制系统。\n\
  \n尽管引用的示例是基于 Linux 的示例，但 Windows 应用容器化的过程是相同的：从你的应用代码开始，创建一个描述应用的 Dockerfile，使用\
  \ `docker image build` 构建镜像。大完成！\n\n# 9：使用 Docker Compose 部署应用\n\n在本章中，我们将查看如何使用\
  \ Docker Compose 部署多容器应用程序。\n\nDocker Compose 和 Docker Stacks 非常相似。在本章中，我们将关注 Docker\
  \ Compose，它在运行 `single-engine mode` 模式的 Docker 节点上部署和管理多容器应用。在随后的章节中，我们将关注 Docker\
  \ Stacks。Stacks 在运行 `swarm mode` 模式的 Docker 节点上部署和管理多容器应用。\n\n我们将本章分为通常三个部分：\n\n\
  * TLDR（要点概括）\n* 深度解析\n* 命令\n\n## 使用 Compose 部署应用 - TLDR\n\n现代云原生应用由多个较小的服务组成，这些服务相互作用形成一个实用的应用。我们将这种模式称为“微服务”。一个简单的例子可能是具有以下七个服务的应用：\n\
  \n* Web 前端\n* 订单系统\n* 目录\n* 后端数据库\n* 日志\n* 身份验证\n* 授权\n\n让所有这些服务协同工作，你就有一个*实用的应用程序*。\n\
  \n部署和管理许多这样的小型微服务可能是困难的。这正是 *Docker Compose* 发挥用场的地方。\n\n与其使用脚本和冗 `docker` 命令将每个微服务连接在一起，Docker\
  \ Compose 允许你在单个声明式配置文件描述整个应用，并用单条命令进行部署。\n\n一旦应用被*部署*，你就可以用一组简单的命令*管理*它的整个生命周期。你甚至可以将配置文件存储并管理在版本控制系统中。\n\
  \n这些就是基础。让我们深入探讨。\n\n## 使用 Compose 部署应用 - 深度解析\n\n我们将深度解析部分划分为如下：\n\n* Compose 背景\n\
  * 安装 Compose\n* Compose 文件\n* 使用 Compose 部署应用\n* 使用 Compose 管理应用\n\n#### Compose\
  \ 背景\n\n起初是 *Fig*。Fig 是一个由 *Orchard* 公司创建的强大工具，它是管理多容器应用的最佳方法。它是一个运行在 Docker 之上的\
  \ Python 工具，允许你在单个 YAML 文件中定义多容器应用。你随后可以使用 `fig` 命令行工具来部署和管理它。\n\n在后台，Fig 会读取 YAML\
  \ 文件并使用 Docker 通过 Docker API 部署和管理应用。这是一件好事。\n\n事实上，它是如此出色，以至于 Docker, Inc. 收购了\
  \ Orchard 并 Fig 重命名为 *Docker Compose*。命令行工具从 `fig` 改名为 `docker-compose`，它继续是一个附加在\
  \ Docker Engine 之上的外部工具。\n\n按照现状，Compose 仍然是一个需要在 Docker 宿主机上安装的外部二进制文件。你在 YAML\
  \ 文件中定义多容器（微服务）应用，将 YAML 文件传递给 `docker-compose` 命令行，Compose 通过 Docker API 进行部署。\n\
  \n规范本身是一份学习细节的极佳文档。\n\n是时候看看它的运行情况了。\n\n#### 安装 Compose\n\n\n\nDocker Compose 作为\
  \ Windows 10 上标准 Docker Desktop 安装的一部分包含。因此，如果你在 Windows 10 电脑上安装了 Docker Desktop，你就拥有了\
  \ Docker Compose。\n\n使用以下命令检查 Compose 是否已安装。你可以在 PowerShell 或 CMD 终端中运行此命令。\n\n\
  ```\n> docker-compose --version\ndocker-compose version 1.25.5, build 8a1c60f6\n\
  ```\n\n如果你需要关于在 Windows 10 上安装 `Docker Desktop` 的更多信息，请参考**第 3 章：安装 Docker**。\n\n\
  ## 在 Mac 上安装 Compose\n\n与 Windows 10 一样，Docker Compose 是作为 Mac 版 `Docker Desktop`\
  \ 的一部分安装的。因此安装了 Docker Desktop，你就拥有了 Docker Compose。\n\n在终端窗口中运行以下命令以验证你是否拥有 Docker\
  \ Compose。\n\n```\n$ docker-compose --version\ndocker-compose version 1.25.5, build\
  \ 8a1c60f6\n```\n\n如果你需要关于安装 `Docker Desktop` 的更多信息，请参考**第 3 章：安装 Docker**。\n\n\
  ## 在 Windows Server 上安装 Compose\n\nDocker Compose 在 Windows Server 上是以独立的二进制文件形式安装的。要使用它，你需要在\
  \ Windows Server 上安装最新版本的 Docker。\n\n在具有权限的 PowerShell 终端（以管理员身份运行）中运行以下命令。\n\n\
  ```\nPS C:\\> [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n\
  ```\n\n为了可读性，以下命令使用了反引号（``````）来转义回车换并将命令跨行显示。它安装了 `1.25.5` 版本的 Docker Compose。你可以通过将\
  \ URL 中的 `1.25.5` 替换为你想要安装的版本，安装此处列出的任何版本：https://github.com/docker/compose/releases。\n\
  \n```\nPS C:\\> Invoke-WebRequest `\n \"https://github.com/docker/compose/releases/download/1.25.5/docker-compose-Windows-x86_64.exe\"\
  \ `\n -UseBasicParsing `\n -OutFile $Env:ProgramFiles\\Docker\\docker-compose.exe\n\
  \nWriting web request\nWriting request stream... (Number of bytes written: 5260755)\n\
  ```\n\n使用 `docker-compose --version` 命令验证安装。\n\n```\n> docker-compose --version\n\
  docker-compose version 1.25.5, build 01110ad01\n```\n\nCompose 现在已安装完成。只要你的 Windows\
  \ Server 机器安装了最新版本的 Docker Engine，你就可以使用了。\n\n## 在 Linux 上安装 Compose\n\n在 Linux\
  \ 上安装 Docker Compose 是一个两个步骤。首先，你使用 `curl` 命令下载二进制文件。然后你使用 `chmod` 使其变为可执行文件。\n\n\
  为了让 Docker Compose 在 Linux 上工作，你需要一个可 Docker Engine 版本。\n\n以下命令将下载 `1.25.5` 版本的\
  \ Docker Compose 并将其复制到 `/usr/bin/local`。你可以访问 [GitHub](https://github.com/docker/compose/releases)\
  \ 发布页面查看最新版本，并将 URL 中的 `1.25.5` 替换为你想要安装的版本。\n\n命令在书中可能会跨行显示。如果你在单行中运行该命令，则需要删除任何反斜杠（`\\\
  `）。\n\n```\n$ sudo curl -L \\\n \"https://github.com/docker/compose/releases/download/1.25.5/docker-compose-$(uname\
  \ -s)-$(uname -m)\" \\\n  -o /usr/local/bin/docker-compose\n\n% Total    % Received\
  \   Time        Time    Current\n                        Total       Spent    Left\n\
  100   617    0   617    0 ----:-- ----:--  1047\n100 280k  100 280k    0:00:03 \
  \ 409k\n```\n\n现在你已经下载了 `docker-compose` 二进制文件，使用以下 `chmod` 命令将其变为可执行。\n\n```\n\
  $ sudo chmod +x /usr/local/bin/docker-compose\n```\n\n验证安装并检查版本。\n\n```\n$ docker-compose\
  \ --version\ndocker-compose version 1.25.5, build 1110ad01\n```\n\n你已经准备好在 Linux\
  \ 上使用 Docker Compose 了。你也可以使用 `pip` 从其 Python 包安装 Compose。\n\n### Compose 文件\n\n\
  Compose 使用 YAML 文件定义多服务应用。YAML 是 JSON 的子集，因此你也可以使用 JSON。Compose 文件的默认名称是 `docker-compose.yml`。然而，你可以使用\
  \ `-f` 标志指定自定义文件名。\n\n以下示例显示了一个非常简单的 Compose 文件，定义了一个包含两个微服务（`web-fe` 和 `redis`）的小应用。该应用是一个简单的\
  \ Web 服务器，用于计算访问次数并将值存储在 Redis 中。我们将该应用命名为 `counter-app` 并在后续将其作为示例。\n\n```yaml\n\
  version: \"3.8\"\nservices:\n  web-fe:\n    build: .\n    command: python app.py\n\
  \    ports:\n      - 5000:5000\n    networks:\n      - counter-net\n    volumes:\n\
  \      - type: volume\n        source: counter-vol\n        target: /code\n  redis:\n\
  \    image: \"redis:alpine\"\n    networks:\n      - counter-net\n\nnetworks:\n\
  \  counter-net\n\nvolumes:\n  counter-vol\n```\n\n\n\n* `command: python app.py`\
  \ 这告诉 Docker 在容器中运行名为 `app.py` 的 Python 程序作为主程序。`app.py` 文件必须存在于镜像中，且镜像必须包含 Python。`Dockerfile`\
  \ 处理了这两个要求。\n* `ports:` 告诉 Docker 将容器内部的端口 5000 (`-target`) 映射到宿主机的 5000 端口 (`published`)。这意味着发送到\
  \ Docker 主主机 5000 端口的流量将定向到容器的 5000 端口。容器内的应用监听 5000 端口。\n* `networks:` 告诉 Docker\
  \ 将服务附加到哪个网络。该网络应该已经存在，或者在文件顶层的 `networks` 键中定义。如果是覆盖网络（overlay network），它需要具有 `attachable`\
  \ 标记，以便独立容器可以附加其中（Compose 部署的是独立容器）。\n* `volumes:` 告诉 Docker 将 `counter-vol` 卷 (`source:`)\
  \ 挂载到 `/code` (`target:`）。`counter-vol` 卷需要已经存在，或者在文件底部的 `volumes` 顶层键中定义。\n\n总结来说，Compose\
  \ 将指示 Docker 为 `web-fe` 服务部署单个容器。它将基于与 Compose 文件在同一目录下的 `Dockerfile` 构建的镜像。该镜像将作为容器启动并运行\
  \ `app.py` 作为主程序。它将在宿主机的 5000 端口上暴露，附加到 `counter-net` 网络，并挂载卷到 `/code`。\n\n注意：从技术上讲，我们不需要\
  \ `command: python app.py` 选项，因为应用的 Dockerfile 已经将 `python app.py` 定义为默认应用。然而，我们在这里展示它是为了让你知道如何工作的。你也可以使用\
  \ Compose 来覆盖 Dockerfile 中的指令。`redis` 服务的定义更为简单：\n\n* `image: redis:alpine` 这告诉\
  \ Docker 基于 `redis:alpine` 镜像启动一个名为 `redis` 的独立容器。该镜像将从 Docker Hub 下载。\n* `networks:`\
  \ `redis` 容器将附加到 `counter-net` 网络。由于两个服务都部署在同一个 `counter-net` 网络上，它们能够通过名称互相解析。这很重要，因为应用程序配置为通过名称与\
  \ `redis` 服务通信。\n\n现在我们已经理解了 Compose 文件是如何工作的，让我们部署它吧！\n\n### 使用 Compose 部署应用\n\n\
  在本节中，我们将部署上一节 Compose 文件中定义的应用。要做到这一点，你需要从 `https://github.com/nigoulton/counter-app`\
  \ 获取以下文件：\n\n* `Dockerfile`\n* `app.py`\n* `requirements.txt`\n* `docker-compose.yml`\n\
  \n在本地克隆 Git 仓库：\n\n```\ngit clone https://github.com/nigoulton/counter-app.git\n\
  \nCloning into 'counter-app'...\nremote: Counting objects: 9, done.\nremote: Compressing\
  \ objects: 100% (8/8), done.\nremote: Total 9 (delta 1), reused 5 (delta 0), pack-reused\
  \ 0\nUnpacking objects: 100% (9/9), done.\nChecking connectivity... done.\n```\n\
  \n克隆仓库将创建一个名为 `counter-app` 的新子目录。这将包含所有所需的文件，并被视为你的构建上下文。Compose 也会使用目录名称（`counter-app`）作为项目名称。我们稍后会看到，但\
  \ Compose 会在资源名称前加上 `counter-app_`。\n\n进入 `counter-app` 目录并检查文件是否存在：\n\n```\ncd\
  \ counter-app\nls\napp.py  docker-compose.yml  Dockerfile  requirements.txt\n```\n\
  \n让我们快速描述一下每个文件：\n\n* `app.py` 是应用代码（一个 Python Flask 应用）。\n* `docker-compose.yml`\
  \ 是 Docker Compose 文件，描述了 Docker 如何如何构建和部署该应用。\n* `Dockerfile` 描述了如何为 `web-fe` 服务构建镜像。\n\
  * `requirements.txt` 列出了应用所需的 Python 包。\n\n你可以随意地检查每个文件的内容。`app.py` 文件显然是应用的核心。但\
  \ `docker-compose.yml` 是将所有应用微服务粘合在一起的胶水。\n\n让我们使用 Compose 启动应用。你必须在刚从 GitHub 克隆的\
  \ `counter-app` 目录内运行所有以下命令：\n\n```\ndocker-compose up &\n\n[1] 1635\nCreating network\
  \ \"counter-app_counter-net\" with the default driver\nCreating volume \"counter-app_counter-vol\"\
  \ with default driver\nPulling redis (redis:alpine)...\nalpine: Pulling from library/redis\n\
  1160f4abea84: Pull complete\na8c53d69ca3a: Pull complete\n<Snip>\nweb-fe_1  |  *\
  \ Debugger PIN: 13-791-729\n```\n\n应用需要几秒钟才能启动，输出可能非常详细。在部署完成后，你可能还需要按 `Return`\
  \ 键。\n\n我们稍后会解释发生了什么，但首先让我们谈谈 `&`。它允许我们在后台运行进程，这样我们可以继续使用终端。`docker-compose up`\
  \ 命令是部署应用常用的方式。\n\n\n\n\n```\n$ docker container ls\nID    COMMAND             \
  \    STATUS      PORTS                     NAMES\n84..  \"python app.py\"      \
  \    Up 2 mins  0.0.0.0:5000->5000/tcp    counter-app_web-fe_1\neb..  \"docker-entrypoint.s…\"\
  \   Up 2 mins  6379/tcp                  counter-app_redis_1\n```\n\n`counter-app_web-fe`\
  \ 容器正在运行应用程序的 Web 前端。它运行 `app.py` 代码，并映射到 Docker 主机所有接口上的 `5000` 端口。我们稍后就会连接它。\n\
  \n下面的网络和卷列表显示了 `counter-app_counter-net` 网络和 `counter-app_counter-vol` 卷。\n\n```\n\
  $ docker network ls\nNETWORK ID     NAME                      DRIVER    SCOPE\n\
  b4c1976d7c27   bridge                    bridge    local\n33ff702253b3   counter-app_counter-net\
  \   bridge    local\n<Snip>\n\n$ docker volume ls\nDRIVER     VOLUME NAME\n<Snip>\n\
  local      counter-app_counter-vol\n```\n\n应用程序已成功部署，你可以将浏览器指向 Docker 主机的 `5000`\
  \ 端口，看到应用程序的完整面貌。\n\n![](img/figure9-1.png)\n\n非常令人印象深刻 ;-)\n\n点击浏览器的刷新按钮会导致计数器加增。查看应用程序（`app.py`），可以看到计数器数据是如何存储在\
  \ Redis 后端的。\n\n如果你使用 `&` 启动了应用程序，你将在终端窗口中看到记录的 `HTTP 200` 响应码。这些代码表示请求成功，每当你加载网页时都会看到一个记录。\n\
  \n```\nweb-fe_1  | 172.20.0.1 - - [29/Apr/2020 10:15:27] \"GET / HTTP/1.1\" 200\
  \ -\nweb-fe_1  | 172.20.0.1 - - [29/Apr/2020 10:15:28] \"GET / HTTP/1.1\" 200 -\n\
  ```\n\n恭喜！你已使用 Docker Compose 成功部署了一个多容器应用程序！\n\n## 使用 Compose 管理应用\n\n在本节中，你将看到如何启动、停止、删除和获取由\
  \ Docker Compose 管理的应用程序状态。你还将看到我们使用的卷如何直接向应用程序的 Web 前端注入更新。\n\n由于应用程序已经在运行，让我们如何停止它。为此，将\
  \ `up` 子命令替换为 `down`。\n\n```\n$ docker-compose down\n 1\\. Stopping counter-app_redis_1\
  \  ...\n 2\\. Stopping counter-app_web-fe_1 ...\n 3\\. redis_1   | 1:signal-handler\
  \ Received SIGTERM scheduling shutdown...\n 4\\. redis_1   | 1:M 09 Jan 11:16:00.456\
  \ # User requested shutdown...\n 5\\. redis_1   | 1:M 09 Jan 11:16:00.456 * Saving\
  \ the final RDB snap...\n 6\\. redis_1   | 1:M 09 Jan 11:16:00.463 * DB saved on\
  \ disk\n 7\\. Stopping counter-app_redis_1  ... done\n 8\\. counter-app_redis_1\
  \ exited with code 0\n 9\\. Stopping counter-app_web-fe_1 ... done\n10\\. Removing\
  \ counter-app_redis_1  ... done\n11\\. Removing counter-app_web-fe_1  ... done\n\
  12\\. Removing network counter-app_counter-net\n13\\. [1]+  Done          docker-compose\
  \ up\n```\n\n由于你最初使用 `&` 启动了应用，它在前台运行。这意味着你会在终端获得详细输出，让你深入了解其工作原理。让我们逐步查看每一行告诉了我们什么。\n\
  \n第 1 行和第 2 行正在停止两个服务。这些是在 Compose 文件中定义的 `web-fe` 和 `redis` 服务。\n\n第 3 行显示 `stop`\
  \ 指令发送了 `SIGTERM` 信号。该信号被发送到每个容器中的 PID 1 进程。第 4-6 行显示 Redis 容器优雅地处理了信号并自行关闭。第 7\
  \ 行和第 8 行报告了停止操作成功。\n\n第 9 行显示 `web-fe` 服务成功停止。\n\n第 10 行和第 11 行显示正在移除停止的服务。\n\n\
  第 12 行显示 `counter-net` 网络被移除，第 13 行显示 `docker-compose up` 进程退出。\n\n需要注意的是，`counter-vol`\
  \ 卷**没有**被删除。这是因为卷的设计初衷是长期持久化数据存储。因此，它们的生命周期与它们所服务的应用程序完全解耦。运行 `docker volume ls`\
  \ 将显示该卷仍然存在系统中。如果你向卷中写入过任何数据，那些数据仍然存在。\n\n此外，任何作为 `docker-compose up` 操作一部分被构建或拉取的镜像仍然存在于系统中。\n\
  \n\n\n\n\n```bash\n$ docker-compose up -d\nCreating network \"counter-app_counter-net\"\
  \ with the default driver\nCreating counter-app_redis_1  ... done\nCreating counter-app_web-fe_1\
  \ ... done\n```\n\n如果你查看 Compose 文件，你会发现它定义了一个名为 `counter-vol` 的卷（volume），并将其挂载到\
  \ `web-fe` 容器的 `/code` 目录下。\n\n```yaml\nservices:\n  web-fe:\n  <Snip>\n    volumes:\n\
  \      - type: volume\n        source: counter-vol\n        target: /code\n<Snip>\n\
  volumes:\n  counter-vol:\n```\n\n第一次部署应用时，Compose 会检查是否已存在名为 `counter-vol` 的卷。由于并不，所以\
  \ Compose 就创建了它。你可以通过 `docker volume ls` 命令查看它，并使用 `docker volume inspect counter-app_counter-vol`\
  \ 获取更详细的信息。\n\n```bash\n$ docker volume ls\nRIVER              VOLUME NAME\nlocal\
  \               counter-app-counter-vol\n```\n\n同样值得知道的是，Compose 会在部署服务**之前**构建网络和卷。这是很有意义的，因为网络和卷是服务（容器）所使用的较低级基础设施对象。下面的片段显示了\
  \ Compose 将创建网络和卷作为前两个任务（甚至在构建和拉取镜像之前）。\n\n```bash\n$ docker-compose up -d\n\nCreating\
  \ network \"counter-app_counter-net\" with the default driver\nCreating volume \"\
  counter-app_counter-vol\" with default driver\nPulling redis (redis:alpine)...\n\
  <Snip>\n```\n\n如果我们再次查看 `web-fe` 的服务定义，会发现它将 `counter-app` 卷挂载到了服务容器的 `/code` 目录。我们也可以从\
  \ Dockerfile 中看到，`/code` 是安装和运行应用的地方。结果是，应用代码存储在 Docker 卷中。见图 9.2。\n\n![Figure 9.2](img/figure9-2.png)\n\
  \n图 9.2\n\n这意味着我们可以从容器外部对卷中的文件进行更改，这些更改会立即反映在应用中。让我们它是如何工作的。\n\n接下来的几步骤将引导你完成以下流程：我们将更新\
  \ Docker 宿主机项目工作目录下的 `app.py` 内容。我们将更新后的 `app.py` 复制到 Docker 宿主机上的卷。我们将刷新应用网页以查看更新后的文本。这之所以能成功，是因为你在\
  \ Docker 宿主机的卷上写入的任何内容都会立即出现在容器内挂载的卷中。\n\n> **注意：** 如果你在 Mac 或 Windows 10 PC 上使用\
  \ Docker Desktop，以下操作将无法运行。这是因为 Docker Desktop 在轻量级虚拟机内部运行 Docker，而卷存在于虚拟机内部。\n\n\
  使用你喜喜欢的文本编辑器编辑项目工作目录下的 `app.py` 文件。我们在示例中使用 `vim`。\n\n```bash\n$ vim ~/counter-app/app.py\n\
  ```\n\n修改第 22 行双引号（“”）之间的文本。该行以 `return \"What's up...\"` 开头。输入任何你喜欢的文本，只要在双引号内，并保存更改。\n\
  \n现在你已经更新了应用，需要将其复制到 Docker 宿主机上的卷中。每个 Docker 卷都暴露在 Docker 宿主机文件系统中的位置，以及一个或多个容器中的挂载点。使用以下\
  \ `docker volume inspect` 命令找到卷在 Docker 宿主机上的暴露位置。\n\n```bash\n$ docker volume inspect\
  \ counter-app_counter-vol | grep Mount\n\n\"Mountpoint\": \"/var/lib/docker/volumes/counter-app-counter-vol/_data\"\
  ,\n```\n\n将更新后的应用文件复制到 Docker 宿主机上卷的挂载点（记住这在 Docker Desktop 上无效）。一旦执行了复制操作，更新后的文件就会出现在\
  \ `web-fe` 容器的 `/code` 目录。该操作将覆盖容器中现 `/code/app.py` 文件。\n\n```bash\n$ cp ~/counter-app/app.py\
  \ \\\n  /var/lib/docker/volumes/counter-app-counter-vol/_data/app.py\n```\n\n更新后的应用文件现在已位于容器。连接到应用以查看你的更改。你可以通过将浏览器指向\
  \ Docker 宿主机在端口 `5000` 上的 IP 来实现。\n\n图 9.3 显示了更新后的应用。\n\n![](img/figure9-3.png)\n\
  \n显然，你不会在生产环境中进行这样的更新操作，但在开发过程中这非常节省时间。\n\n恭喜你。你已经使用 Docker Compose 部署并管理了一个简单的多容器应用。\n\
  \n在回顾主要的 `docker-compose` 命令之前，重要的是理解这是一个非常简单的例子。Docker Compose 能够部署和管理复杂得多的应用程序。\n\
  \n### 使用 Compose 部署应用 - 命令\n\n*   `docker-compose up` 是部署 Compose 应用的命令。它期望 Compose\
  \ 文件名为 `docker-compose.yml` 或 `docker-compose.yaml`，但你可以使用 `-f` 标记指定自定义文件名。使用 `-d`\
  \ 标记在后台启动应用是通常的做法。\n*   `docker-compose stop` 将停止 Compose 应用中的所有容器，但不会将它们从系统中删除。可以通过\
  \ `docker-compose restart` 轻松重启应用。\n*   `docker-compose rm` 将删除已停止的 Compose 应用。它不会删除卷和镜像。\n\
  *   `docker-compose restart` 将重启停止的 Compose 应用。\n*   `docker-compose ps` 列出 Compose\
  \ 应用中的每个容器。它显示当前状态、端口。\n*   `docker-compose down` 将停止并删除运行的 Compose 应用。它会删除网络。\n\
  \n## 章节总结\n\n在本章中，我们学习了如何使用 Docker Compose 部署和管理多容器应用。Docker Compose 是一个安装在 Docker\
  \ Engine 之上的 Python 应用。它允许你在单个文件中定义多容器应用并用单个命令部署。Compose 文件可以是 YAML 或 JSON，它们定义了应用所需的所有容器、网络、卷和密钥。你将文件传递给\
  \ `docker-compose` 命令行工具，Compose 使用 Docker 进行部署。一旦部署，你就可以许多子命令管理其整个生命周期。你还看到卷的生命周期与其他部分是独立的，并且可以挂载到容器中。\n\
  \n\n\n\n\n在编排方面，Swarm 暴露了丰富的 API，允许你轻松地部署和管理复杂的微服务应用。你可以在声明式清单文件中定义你的应用，并使用原生的 Docker\
  \ 命令将它们部署到 Swarm。你甚至可以执行滚动更新、回滚和扩展操作。同样，这一切都通过简单的命令完成。\n\nDocker Swarm 与 Kubernetes\
  \ 直接竞争——它们都用于用于编排容器化应用程序。虽然 Kubernetes 拥有更强大的势头以及更活跃的社区和生态系统，但 Docker Swarm 是一项优秀的技术，而且配置和部署要简单得多。对于中小企业和应用部署来说，它是一个非常理想的技术。\n\
  \n## Docker Swarm - 深度解析\n\n我们将本章的深度解析部分分为如下：\n\n- Swarm 基础知识\n- 构建一个安全的 swarm 集群\n\
  - 部署一些 swarm 服务\n- 故障排除\n\n### Swarm 基础知识\n\n在集群方面，一个 `swarm` 由一个或多个 Docker `nodes`（节点）组成。这些可以是物理服务器、虚拟机、树莓派或云实例。唯一的要求是所有节点都安装了\
  \ Docker 并且可以通过可靠的网络进行通信。\n\n节点被配置为 `managers`（节点）或 `workers`（工作节点）。`Managers` 负责集群的控制平面，意味着如集群状态以及将任务分发给\
  \ `workers`。`Workers` 接受来自 `managers` 的任务并执行它们。\n\n`swarm` 的配置和状态存储在所有 managers\
  \ 上的分布式 `etcd` 数据库中。它保留在内存中并保持极新的状态。但它最棒的一点是它需要零配置——它是作为 swarm 的一部分安装的，并且会自动管理。\n\
  \n在集群方面，一项改变游戏规则的东西是安全方法。TLS 的集成如此紧密，以至于在没有它的情况下无法构建 swarm。在当今这个重视安全的世界里，这样的功能理受到应有的赞誉。`Swarm`\
  \ 使用 TLS 加密通信、验证节点并对角色授权。自动密钥轮换更是锦上添花。而最棒的部分是……这一切发生得如此顺畅，以至于你甚至感知不到它的存在。\n\n在应用编排方面，swarm\
  \ 上调调的原子单元是 `service`（服务）。这是 API 中的一个新对象，随 swarm 一起引入，是一个更高层的结构，在容器周围封装了一些高级功能。这些包括扩展、滚动更新和简单的回滚。将\
  \ `service` 视为增强型容器是有帮助的。\n\nswarm 的高层视图如图 10.1 所示。\n\n![Figure 10.1 高层 swarm](img/figure10-1.png)\n\
  \n图 10.1 高层 swarm\n\n基础知识就到这里。让我们通过一些示例来实际操作吧。\n\n### 构建一个安全的 Swarm 集群\n\n在本节中，我们将构建一个包含三个\
  \ `manager nodes` 和三个 `worker nodes` 的安全 swarm 集群。你可以使用具有不同数量 `managers` 和 `workers`\
  \ 以及不同名称和 IP 的实验，但接下来的示例将使用图 10.2 中的值。\n\n![Figure 10.2](img/figure10-2.png)\n\n\
  图 10.2\n\n节点可以是虚拟机、物理服务器、云实例或树莓派系统。唯一的要求是它们安装了 Docker 并且可以通过可靠的网络进行通信。如果配置了名称解析也将很有益——它能更易在命令输出中识别节点，并在故障排除时提供帮助。\n\
  \n在网络方面，你需要在节点之间的路由器和防火墙上开放以下端口：\n\n- `2377/tcp:` 用于安全的客户端到 swarm 的通信\n- `7946/tcp\
  \ and udp:` 用于控制平面的 gossip（杂讯协议）\n- `4789/udp:` 用于基于 VXLAN 的覆盖网络\n\nMac 和 Windows\
  \ 版 Docker Desktop 只支持单个 Docker 节点。你可以初始化一个单节点 swarm 并跟随大多数示例。或者，你可以尝试 https://labs.play-with-docker.com\
  \ 中的 Play with Docker。\n\n一旦满足了前提条件，你就可以构建 swarm 了。\n\n构建 swarm 的过程称为 `initializing\
  \ a swarm`，其高层流程如下：初始化第一个 manager 节点 > 加入额外的 manager 节点 > 加入 节点 > 完成。\n\n#### 初始化一个新的\
  \ swarm\n\n不属于 swarm 的 Docker 节点被称为处于 `single-engine mode`（单引擎模式）。一旦它们被加入 swarm，就会自动切换到\
  \ `swarm mode`。\n\n在处于 `single-engine mode` 的 Docker 主机上运行 `docker swarm init` 将该节点切换到\
  \ `swarm mode`，创建一个新的 `swarm`，并将该节点变为 swarm 的第一个 `manager`。\n\n其他节点可以作为 workers\
  \ 和 managers 加入 swarm。将 Docker 主机加入现有的 swarm 会作为操作的一部分将其切换到 `swarm mode`。\n\n以下步骤将\
  \ `mgr1` 置于 `swarm mode` 并初始化一个新的 swarm。随后它会将 `wrk1`、`wrk2` 和 `wrk3` 作为工作节点加入——在过程中自动将它们置于\
  \ `swarm mode`。最后，它会将 `mgr2` 和 `mgr3` 作为额外的 managers 加入并将它们切换到 `swarm mode`。程序结束，所有\
  \ 6 个节点都将处于 `swarm mode` 并作为同一个 swarm 的一部分运行。\n\n此示例将使用图 10.2 所示节点的 IP 地址和 DNS 名称。你的地址可能不同。\n\
  \n1. 登录到 `mgr1` 并初始化一个新的 swarm（如果你跟着操作，请忘记使用反引号而不是反斜杠，在 Windows PowerShell 终端中）。\n\
  \n```\n$ docker swarm init \\\n  --advertise-addr 10.0.0.1:2377 \\\n  --listen-addr\
  \ 10.0.0.1:2377\n\nSwarm 已初始化：当前节点 (d21lyz...c79qx) 现在是 manager。\n```\n\n命令可以拆分为：\n\
  \n- `docker swarm init`: 告诉 Docker 初始化一个新的 swarm 并此节点变为第一个 manager。它同时在节点上启用 swarm\
  \ 模式。\n- `--advertise-addr`: 正如名称所示，这是向 swarm 中的其他节点的 API 端点。它通常是节点的 IP 地址之一，也可以是外部负载均衡地址。除非你在具有多个接口的节点上指定负载均衡或特定的\
  \ IP。\n- `--listen-addr`: 这是节点接受 swarm 流量的 IP 地址。如果不显式设置，默认值与 `--advertise-addr`\
  \ 相同。如果 `--advertise-addr` 是负载均衡，你必须使用 `--listen-addr` 指定本地 IP 或接口。\n\n我建议你明确并始终使用这两个标志。\n\
  \nswarm 模式运行的默认端口是 `2377`。这是自定义的，但习惯使用 `2377/tcp` 进行安全的（HTTPS）客户端到 swarm 连接。\n\n\
  2. 列出 swarm 中的节点。\n\n```\n$ docker node ls\nID            HOSTNAME   STATUS  AVAILABILITY\
  \  MANAGER STATUS\nd21...qzkx *  mgr1       Ready   Active        Leader\n```\n\n\
  注意 `mgr1` 目前是 swarm 中唯一的节点，并被列为 `Leader`。稍后我们会回到这里。\n\n3. 从 `mgr1` 运行 `docker swarm\
  \ join-token` 命令以提取向 swarm 添加新 workers 和 managers 所需命令和令牌。\n\n```\n$ docker swarm\
  \ join-token worker\n向此 swarm 添加 worker，请运行以下命令：\n   docker swarm join \\\n   --token\
  \ SWMTKN-1-0uahebax...c87tu8dx2c \\\n   10.0.0.1:2377\n\n$ docker swarm join-token\
  \ manager\n向此 swarm 添加 manager，请运行以下命令：\n   docker swarm join \\\n   --token SWMTKN-1-0uahebax...ue4hv6ps3p\
  \ \\\n   10.0.0.1:2377\n```\n\n\n\n\n\n请注意，加入节点（worker）和管理器（manager）的命令除了加入令牌（`SWMTKN...`）之外是完全相同的。这意味着节点是作为\
  \ worker 还是管理器加入，完全取决于你在加入时使用的是哪种令牌。**你应该确保你的加入令牌是安全的，因为它们是节点加入集群的唯一凭据！**\n\n4.\
  \ 登录到 `wrk1` 并使用 worker 加入令牌通过 `docker swarm join` 命令将其加入集群。\n\n```\n$ docker swarm\
  \ join \\\n    --token SWMTKN-1-0uahebax...c87tu8dx2c \\\n    10.0.0.1:2377 \\\n\
  \    --advertise-addr 10.0.0.4:2377 \\\n    --listen-addr 10.0.0.4:2377\n```\n\n\
  该节点作为 worker 加入了集群。\n\n`--advertise-addr` 和 `--listen-addr` 标志是可选的。我添加它们是因为我认为在涉及网络配置时，尽可能具体是最佳实践。\n\
  \n5. 在 `wrk2` 和 `wrk3` 上重复上一步操作，让它们作为 worker 加入集群。如果你指定了 `--advertise-addr` 和 `--listen-addr`\
  \ 标志，请确保你使用的是 `wrk2` 和 `wrk3` 对应的 IP 地址。\n\n6. 登录到 `mgr2` 并使用管理器加入令牌通过 `docker swarm\
  \ join` 命令作为管理器加入集群。\n\n```\n$ docker swarm join \\\n    --token SWMTKN-1-0uahebax...ue4hv6ps3p\
  \ \\\n    10.0.0.1:2377 \\\n    --advertise-addr 10.0.0.2:2377 \\\n    --listen-addr\
  \ 10.0.0.2:2377\n```\n\n该节点作为管理器 加入了集群。\n\n7. 在 `mgr3` 上重复上一步，记得在 `advertise-addr`\
  \ 和 `--listen-addr` 标志中使用 `mgr3` 的 IP 地址。\n\n8. 从集群中的任何一个管理器节点运行 `docker node ls`\
  \ 来列出集群中的节点。\n\n```\n$ docker node ls\nID               HOSTNAME     STATUS  AVAILABILITY\
  \  MANAGER STATUS\n0g4rl...babl8 *  mgr2         Ready   Active        Reachable\n\
  2xlti...l0nyp    mgr3         Ready   Active        Reachable\n8yv0b...wmr67   \
  \ wrk1         Ready   Active\n9mzwf...e4m4n    wrk3         Ready   Active\nd21ly...9qzkx\
  \    mgr1         Ready   Active        Leader\ne62gf...l5wt6    wrk2         Ready\
  \   Active\n```\n\n恭喜。你刚刚创建了一个包含 3 个管理器和 3 个 worker 的 6 节点集群。作为该过程的一部分，每个节点上的 Docker\
  \ 引擎已自动切换到集群模式，并且集群已通过 TLS 自动安全保护。\n\n如果你查看 `MANAGER STATUS` 列，你会发现三个管理器节点显示为“Reachable”（可访问）或“Leader”（领导者）。我们很快就会学习更多关于领导者的知识。`MANAGER\
  \ STATUS` 列为空的节点是 worker。还要注意显示 `mgr2` 那行的 ID 后面有一个星号（`*`）。它告诉你在当前正登录并从哪个节点执行命令。在本例中，命令是从\
  \ `mgr2` 发出的。\n\n> **注意：** 每次将节点加入集群时都要指定 `--advertise-addr` 和 `--listen-addr` 标志是非常麻烦的。然而，如果你的集群网络配置错误，麻烦可能会大得多。此外，手动将节点添加到集群不太可能是一项日常任务，因此花额外的前期精力使用这些标志是值得的。不过，这取决于你的选择。在实验室环境或只有单个\
  \ IP 的节点中，你可能不需要使用它们。\n\n现在你的集群已经运行了，让我们来看管理器的高可用性（HA）。\n\n## Swarm 管理器高可用 (HA)\n\
  \n到目前为止，我们向集群添加了三个管理器节点。为什么是三个？它们是如何协同工作的？\n\nSwarm 管理器原生支持高可用性（HA）。这意味着一个或多个节点可以故障，幸存的节点将继续保持集群运行。\n\
  \n从技术上讲，swarm 实现了一种主动主备式的多管理器 HA。这意味着尽管你有多个管理器，但在任何时刻只有一个是处于活跃状态的。这个活跃管理器被称为“leader”（领导者），而领导者是唯一能够对集群发布实时命令的。因此，只有领导者会更改配置或向\
  \ worker 发送任务。如果跟随管理器（被动）接收到集群的命令，它会将命令代理给领导者。\n\n该过程如图 10.3 所示。步骤 `1` 是来自远程 Docker\
  \ 客户端到管理器的命令。步骤 2 是非领导者管理器接收命令并将其代理给领导者。步骤 3 是领导者在集群上执行命令。\n\n![Figure 10.3](img/figure10-3.png)\n\
  \n图 10.3\n\n如果你仔细观察图 10.3，你会发现管理器要么是 leader（领导），要么是 follower（跟随）。这是 Raft 术语，因为 swarm\
  \ 使用 [Raft 算法](https://raft.github.io/) 来维护一致的状态。在 HA 方面，适用以下最佳实践：\n\n1. 部署奇数量的管理器。\n\
  2. 不要部署过多的管理器。\n\n与所有的共识算法一样，参与者越多，达成共识所需的时间越长。就像决定去哪里吃饭一样，3 个人做决定比 33 个人要快得多！考虑到这一点，部署\
  \ 3 个或 5 个管理器是最佳实践。7 个可行，但通常认为 3 个或 5 个是最优的。\n\n关于管理器 HA 的最后警告。虽然将管理器分散在网络可用区内显然是很好的做法，但你需要确保连接它们的网络是可靠的，因为网络分区可能很难排查和解决。\n\
  \n然而，如果你有 4 个管理器并发生了相同的网络分区，一侧将获得多数支持，集群管理服务将保持可用。\n\n##### 内置 Swarm 安全\n\nSwarm\
  \ 集群拥有大量内置安全功能，并开箱即用合理的默认配置——CA 设置、加入令牌、双向 TLS、加密集群存储、加密网络、加密节点 ID 等。请参阅**第 15 章：Docker\
  \ 安全**了解详情。\n\n##### 锁定集群\n\n尽管有这些内置原生安全措施，重启旧管理器或恢复旧备份仍可能损害集群。为了防止此类情况，Docker 允许使用\
  \ Autolock（自动锁定）功能锁定集群。这会强制重启的管理器在提供集群解锁密钥之前才能重新加入集群。\n\n\n\n\n\n通过向 `docker swarm\
  \ init` 命令传递 `--autolock` 标志，可以直接对新集群应用锁定。然而，我们已经构建了一个集群，因此我们将使用 `docker swarm update`\
  \ 命令对现有的集群进行锁定。\n\n从集群管理节点（manager）运行以下命令。\n\n```\n$ docker swarm update --autolock=true\n\
  Swarm updated.\n```\n\n在集群管理节点重启后对其进行解锁，请运行 `docker swarm unlock` 命令并提供以下密钥：\n\n\
  \    SWMKEY-1-5+ICW2kRxPxZrVyBDWzBkzZdSd0Yc7Cl2o4Uuf9NPU4\n\n请记住将此密钥存储在密码管理器中，因为没有它你将无法重启该节点。\n\
  \n请务必将解锁密钥保存在安全的地方。你可以随时使用 `docker swarm unlock-key` 命令检查当前的集群解锁密钥。\n\n重启其中一个管理节点，以查看它是否会自动重新加入集群。你可能需要在命令前加加\
  \ `sudo`。\n\n```\n$ service docker restart\n```\n\n尝试列出集群中的节点。\n\n```\n$ docker\
  \ node ls\nError response from daemon: Swarm is encrypted and needs to be unlocked\
  \ before it can be used.\n```\n\n尽管 Docker 服务已经在管理节点上重启，但它并未允许重新加入集群。你通过在另一个管理节点上运行\
  \ `docker node ls` 命令可以进一步证明这一点。重启后的将显示为 `down`（离线）和 `unreachable`（不可达）。\n\n使用 `docker\
  \ swarm unlock` 命令为重启后的节点解锁集群。你需要在重启后的节点上运行此命令并提供解锁密钥。\n\n```\n$ docker swarm unlock\n\
  Please enter unlock key: <enter your key>\n```\n\n如果你再次运行 `docker node ls`，该节点将被允许重新加入集群并显示为\
  \ `ready`（就绪）和 `reachable`（可达）。\n\n在生产环境中，建议锁定集群并保护解锁密钥。\n\n现在你已经构建了集群并理解了领导者（leaders）和管理节点高可用（manager\
  \ HA）的基础设施概念，让我们进入服务的应用方面。\n\n## 集群服务 (Swarm services)\n\n在本章这一节中我们所做的工作将在第 14 章通过\
  \ Docker Stacks 改进。然而，在这里学习这些概念是非常重要的，以便你为第 14 章做好准备。\n\n正如我们在集群入门中所述的……服务（services）是\
  \ Docker 1.12 引入的新结构，它们仅适用于集群模式（swarm mode）。\n\n服务允许我们指定大多数熟悉的容器选项，例如名称、端口映射、附加到网络和镜像。但它们添加了重要的云原生功能，包括期望状态（desired\
  \ state）和自动协调（automatic reconciliation）。例如，集群服务允许我们声明式地定义应用程序的期望状态，我们可以将其应用于集群，并让集群处理其部署和管理工作。\n\
  \n让我们来看一个快速的示例。假设你有一个带有 Web 前端的应用程序。你有一个 Web 服务器的镜像，并且测试显示你需要 5 个实例来处理正常的日常流量。你将此需求翻译为一个单一服务，在该服务中中声明要使用的镜像，并且该服务应该始终有\
  \ 5 个运行的副本（replicas）。你将此作为你的期望状态发布给集群，集群将确保始终有 5 个正在运行的 Web 服务器实例。\n\n稍后我们将看到其他可以作为服务部分声明的内容，但在那之前，让我们看看创建我们刚刚描述的内容的方法。\n\
  \n你可以通过两种方式之一创建服务：\n\n1. 在命令行中通过 `docker service create` 进行命令式创建\n2. 使用堆文件进行声明式创建\n\
  \n我们将在稍后的章节中查看堆文件。现在我们关注命令式方法。\n\n> **注意：** 在 Windows 上创建新服务的命令是相同的。然而，本示例中使用的镜像是\
  \ Linux 镜像，无法在 Windows 上运行。你可以将镜像替换为 Windows 服务器镜像，这样命令就可以正常工作。记住，如果你在 PowerShell\
  \ 终端中输入 Windows 命令，将需要使用反引号（` ```）来表示换行的延续。\n\n```\n$ docker service create --name\
  \ web-fe \\\n   -p 8080:8080 \\\n   --replicas 5 \\\n   nigelpoulton/pluralsight-docker-ci\n\
  ```\n\n注意，许多熟悉的 `docker container run` 参数与它们是相同的。在示例中，我们指定了 `--name` 和 `-p`，它们对于独立容器和服务的原理是相同的。\n\
  \n让我们回顾一下命令和输出。\n\n我们使用 `docker service create` 告诉 Docker 我们正在声明一个新服务，并使用 `--name`\
  \ 标志将其命名为 `web-fe`。我们告诉 Docker 将集群中每个节点上的 8080 端口映射到每个服务副本内部的 8080 端口。接下来，我们使用 `--replicas`\
  \ 标志告诉 Docker 该服务应该始终有 5 个副本。最后，我们告诉 Docker 为副本使用哪个镜像——理解这一点很重要，所有服务副本都使用相同的镜像和配置！\n\
  \n按下 `Return` 键后，命令被发送到管理节点，作为领导者（leader）的管理节点跨集群实例化 5 个副本——记住，集群管理节点同时也工作节点（workers）。每个接收到任务的工作节点或管理节点都会拉取镜像并启动容器。\n\
  \n但还没有结束。所有服务都由集群持续监控——集群会将观测状态与期望状态进行比较。如果这两个状态匹配，世界就是美好的，不需要采取进一步行动。如果它们不匹配，集群将采取行动使观测状态对齐。例如，如果托管\
  \ 5 个副本之一的工作节点失败了，服务的观测状态将从 5 降到 4。这不再符合 5 的期望状态，因此集群将启动一个新的副本来恢复观测状态对齐。\n\n## 查看和检查服务\n\
  \n你可以使用 `docker service ls` 命令查看在集群上的服务列表。\n\n```\n$ docker service ls\nID     \
  \    NAME      MODE         REPLICAS   IMAGE               PORTS\nz7o...uw   web-fe\
  \    replicated   5/5        nigel...ci:latest   *:8080->8080/tcp\n```\n\n输出显示了单个运行的服务以及关于状态的基本信息。除了其他外，你可以看到服务的名称以及\
  \ 5 个期望副本都处于运行状态。如果你在部署后立即运行此命令，可能不会显示所有任务/副本都已运行。这通常是因为在每个节点上拉取镜像需要。\n\n你可以使用 `docker\
  \ service ps` 命令查看服务副本列表以及每个副本的状态。\n\n```\n$ docker service ps web-fe\nID      \
  \    NAME       IMAGE              NODE   DESIRED   CURRENT\n817...f6z   web-fe.1\
  \   nigelpoulton/...   mgr2   Running   Running 2 mins\na1d...mzn   web-fe.2   nigelpoulton/...\
  \   wrk1   Running   Running 2 mins\ncc0...ar0   web-fe.3   nigelpoulton/...   wrk2\
  \   Running   Running 2 mins\n6f0...azu   web-fe.4   nigelpoulton/...   mgr3   Running\
  \   Running 2 mins\ndyl...p3e   web-fe.5   nigelpoulton/...   mgr1   Running   Running\
  \ 2 mins\n```\n\n该命令的格式为 `docker service ps <服务名称或服务 ID>`。输出每行显示一个副本，显示它在集群的哪个节点上执行，并显示期望状态和当前的观测状态。\n\
  \n要查看服务的详细信息，请使用 `docker service inspect` 命令。\n\n\n\n\n\n`uber-net` 网络已通过 `swarm`\
  \ 范围成功创建，并且*目前*仅在管理节点上可见。当工作节点运行配置在该网络上的工作负载时，它将动态扩展到这些节点。\n\n让我们创建一个新服务并将其附加到该网络。\n\
  \n```bash\ndocker service create --name uber-svc \\\n   --network uber-net \\\n\
  \   -p 80:80 --replicas 12 \\\n   nigelpoulton/tu-demo:v1\n\ndhbtgvqrg2q4sg07ttfuhg8nz\n\
  overall progress: 12 out of 12 tasks \n1/12: running   \n2/12: running   \n<Snip>\n\
  12/12: running   \nverify: Service converged \n```\n\n让我们来看看刚才通过该 `docker service\
  \ create` 命令声明了什么。\n\n我们做的第一件事是为服务命名，然后使用 `--network` 标志告诉它将所有副本部署在新的 `uber-net`\
  \ 网络上。接着，我们在整个集群中暴露了 80 端口，并将其映射到我们请求运行的 12 个副本中每个的 80 端口。最后，我们告诉它所有副本都基于 `nigelpoulton/tu-demo:v1`\
  \ 镜像。\n\n运行 `docker service ls` 和 `docker service ps` 命令来验证新服务的状态。\n\n\n\n\n\n```\n\
  $ docker service ls\nID            NAME      REPLICAS  IMAGE\ndhbtgvqrg2q4  uber-svc\
  \  12/12     nigelpoulton/tu-demo:v1\n\n$ docker service ps uber-svc\nID       \
  \ NAME          IMAGE                NODE  DESIRED   CURRENT STATE\n0v...7e5  uber-svc.1\
  \    nigelpoulton/...:v1  wrk3  Running   Running 1 min\nbh...wa0  uber-svc.2  \
  \  nigelpoulton/...:v1  wrk2  Running   Running 1 min\n23...u97  uber-svc.3    nigelpoulton/...:v1\
  \  wrk2  Running   Running 1 min\n82...5y1  uber-svc.4    nigelpoulton/...:v1  mgr2\
  \  Running   Running 1 min\nc3...gny  uber-svc.5    nigelpoulton/...:v1  wrk3  Running\
  \   Running 1 min\ne6...3u0  uber-svc.6    nigelpoulton/...:v1  wrk1  Running  \
  \ Running 1 min\n78...r7z  uber-svc.7    nigelpoulton/...:v1  wrk1  Running   Running\
  \ 1 min\n2m...kdz  uber-svc.8    nigelpoulton/...:v1  mgr3  Running   Running 1\
  \ min\nb9...k7w  uber-svc.9    nigelpoulton/...:v1  mgr3  Running   Running 1 min\n\
  ag...v16  uber-svc.10   nigelpoulton/...:v1  mgr2  Running   Running 1 min\ne6...dfk\
  \  uber-svc.11   nigelpoulton/...:v1  mgr1  Running   Running 1 min\ne2...k1j  uber-svc.12\
  \   nigelpoulton/...:v1  mgr1  Running   Running 1 min\n```\n\n通过向服务传递 `-p 80:80`\
  \ 标志将确保创建一个全集群范围的映射，该映射将所有进入集群中任何节点 80 端口的流量，映射到任何服务副本内部的 80 端口。\n\n这种在集群中的每个节点（甚至是未运行服务副本的节点）上发布端口的被称为\
  \ `ingress mode`（接入模式），并且是默认设置。另一种模式是 `host mode`（主机模式），它仅在运行副本的集群节点上发布服务。在 `host\
  \ mode` 下发布服务需要使用长格式语法，如下所示：\n\n```\n$ docker service create --name uber-svc \\\n\
  \   --network uber-net \\\n   --publish published=80,target=80,mode=host \\\n  \
  \ --replicas 12 \\\n   nigelpoulton/tu-demo:v1\n```\n\n打开网络浏览器并将其指向集群中任意节点 80 端口的\
  \ IP 地址，即可看到运行的服务。\n\n![图 10.6](img/figure10-6.png)\n\n图 10.6\n\n如你所见，这是一个简单的投票应用程序，为“足球\
  \ (football)”或“足球 (soccer)”注册投票。随意将你的浏览器指向集群中的其他节点。你可以从任何节点访问该 Web 服务，因为 `-p 80:80`\
  \ 标志会在每个集群节点上创建一个 `ingress mode` 映射。即使在未运行该服务副本的节点上也是如此——每个节点都会获得一个映射，因此可以将你的请求重定向到运行该服务的节点。\n\
  \n现在假设这次特定的投票已经结束，你的公司想要运行一次新调查。已经为新调查创建了新的容器镜像，并将其添加到相同的 Docker Hub 仓库中，但这次镜像的标签为\
  \ `v2` 而不是 `v1`。\n\n让我们假设你被赋予任务分阶段将更新的镜像推送到集群——每次 2 个副本，中间间隔 20 秒。你可以使用以下 `docker\
  \ service update` 命令来实现这一点：\n\n```\n$ docker service update \\\n   --image nigelpoulton/tu-demo:v2\
  \ \\\n   --update-parallelism 2 \\\n   --update-delay 20s uber-svc\noverall progress:\
  \ 4 out of 12 tasks\n1/12: running   \n2/12: running   \n3/12: running   \n4/12:\
  \ running   \n5/12: starting  \n6/12: ready     \n<ip>\n12/12: \n```\n\n让我们回顾这条命令。`docker\
  \ service update` 通过更新服务的期望状态来让我们对运行的服务进行更新。它指定了新版本的镜像，标记为 `v2` 而不是 `v1`。它通过 `--update-parallelism`\
  \ 和 `--update-delay` 标志确保新镜像每次推送到 2 个副本，中间有 20 秒的冷却期。最后，它指示集群对 `uber-svc` 服务进行更改。\n\
  \n如果在更新期间运行 `docker service ps uber-svc`，某些副本将处于 `v2`，而另一些仍处于 `v1`。如果给操作足够的时间（4\
  \ 分钟），所有副本最终将达到使用 `v2` 镜像的期望状态。\n\n```\n$ docker service ps uber-svc\nID       \
  \ NAME          IMAGE                NODE  DESIRED   CURRENT STATE\n7z...nys  uber-svc.1\
  \    nigel...v2  mgr2  Running   Shutdown 13 secs\n0v...7e5  uber-svc.1    nigel...v1\
  \  wrk3  Running   Running 1 min\nbh...wa0  uber-svc.2    nigel...v1  wrk2  Running\
  \   Running 1 min\n23...u97  uber-svc.3    nigel...v1  wrk2  Running   Running 1\
  \ min\n82...5y1  uber-svc.4    nigel...v1  mgr2  Running   Running 1 min\nc3...gny\
  \  uber-svc.5    nigel...v1  wrk3  Running   Running 1 min\ne6...3u0  uber-svc.6\
  \    nigel...v1  wrk1  Running   Running 1 min\n78...r7z  uber-svc.7    nigel...v1\
  \  wrk1  Running   Running 1 min\n2m...kdz  uber-svc.8    nigel...v1  mgr3  Running\
  \   Running 1 min\nb9...k7w  uber-svc.9    nigel...v1  mgr3  Running   Running 1\
  \ min\nag...v16  uber-svc.10   nigel...v1  mgr2  Running   Running 1 min\ne6...dfk\
  \  uber-svc.11   nigel...v1  mgr1  Running   Running 1 min\ne2...k1j  uber-svc.12\
  \   nigel...v1  mgr1  Running   Running 1 min\n```\n\n你可以通过打开网络浏览器并多次刷新来实时观察更新的发生。某些请求将由旧版本处理，另一些将由新版本处理。恭喜，你刚刚向运行中的容器应用程序推送了滚动更新。这意味着未来的更新将自动使用这些设置，除非你用\
  \ `docker service update` 命令覆盖它们。\n\n```\n$ docker inspect --pretty uber-svc\nID:\
  \             mub0gt8sz80ez519\nName:           uber-svc\nService Mode:   Replicated\n\
  \ Replicas:      12\nUpdateStatus:\n State:         updating\n Started:       About\
  \ minute\n Message:       update in progress\nPlacement:\nUpdateConfig:\n Parallelism:\
  \   2\n Delay:         20s\n On failure:    pause\n Monitoring Period: 5s\n Max\
  \ failure ratio: 0\n Update order:      stop-first\nRollbackConfig:\n Parallelism:\
  \   1\n On failure:    pause\n Monitoring Period: 5s\n Max failure ratio: 0\n Rollback\
  \ order:    stop-first\nContainerSpec:\n Image:    nigelpoulton/tu-demo:v2@sha256:d3c0d8c9cf0ef2ba5eb74c\n\
  \ init: false\nResources:\n Networks: uber-net\n Endpoint Mode:  vip\n Ports:\n\
  \ PublishedPort = 80\n  Protocol = tcp\n  TargetPort = 80\n  PublishMode = ingress\n\
  ```\n\n你还应该注意服务网络配置的几点。集群中所有运行副本的节点都拥有之前创建的 `uber-net` 覆盖网络。我们可以通过在运行副本的节点上运行 `docker\
  \ network ls` 来验证这一点。\n\n你还需要注意 `docker inspect` 输出中的 `Networks` 部分。它显示了 `uber-net`\
  \ 网络以及全集群的 `80:80` 端口映射。\n\n#### 故障排除\n\n可以使用 `docker service logs` 命令查看 Swarm 服务日志。然而，并不是所有的日志驱动都支持该命令。\n\
  \n默认情况下，Docker 节点配置服务使用 `json-file` 日志驱动，但也存在其他驱动：\n\n*   `journald`（仅适用于运行 `systemd`\
  \ 的 Linux 主机）\n\n*   `syslog`\n\n*   `splunk`\n\n*   `gelf`\n\n`json-file` 和 `journald`\
  \ 是最容易配置的，且都支持 `docker service logs` 命令。命令格式为 `docker service logs <service-name>`。\n\
  \n如果你正在使用第三方日志驱动，应该使用日志平台的原生工具查看这些日志。\n\n\n\n\n\n以下来自 `daemon.json` 配置文件的片段显示了一个配置为使用\
  \ `syslog` 的 Docker 主机。\n\n```\n{\n  \"log-driver\": \"syslog\"\n}\n```\n\n你可以通过向\
  \ `docker service create` 命令传递 `--log-driver` 和 `--log-opts` 标志来强制单个服务使用不同的驱动程序。这些标志将覆盖\
  \ `daemon.json` 中设置的任何内容。\n\n服务日志的工作前提是：你的应用程序在容器中作为 PID 1 运行，并将日志发送到 `STDOUT`，将错误发送到\
  \ `STDERR`。日志驱动程序会将这些“日志”转发到通过日志驱动程序配置的位置。\n\n以下 `docker service logs` 命令显示了 `svc1`\
  \ 服务中所有副本的日志，其中两个副本在启动副本都经历过数次失败。\n\n```\n$ docker service logs svc1\nsvc1.1.zhc3cjeti9d4@wrk-2\
  \ | [emerg] 1#1: host not found...\nsvc1.1.zhc3cjeti9d4@wrk-2 | nginx: [emerg] host\
  \ not found..\nsvc1.1.6m1nmbzmwh2d@wrk-2 | [emerg] 1#1: host not found...\nsvc1.1.6m1nmbzmwh2d@wrk-2\
  \ | nginx: [emerg] host not found..\nsvc1.1.1tmya243m5um@mgr-1 | 10.255.0.2 \"GET\
  \ / HTTP/1.1\" 302\n```\n\n输出为了适应页面进行了截断，但你可以看到显示了所有三个服务副本的日志（两个失败的和一个正在运行的）。每行都以副本名称开头，其中包含服务名称、副本编号、副本\
  \ ID 以及它被调度的宿主机名称。其之后是日志输出。\n\n由于为了适应书籍进行了截断，很难判断，但看起来前两个副本失败是因为它们正尝试连接到另一个仍在启动的服务（这是当依赖服务启动时的某种竞态条件）。\n\
  \n你可以跟踪日志（`--follow`）、查看尾（`--tail`）并获取额外细节（`--details`）。\n\n### 备份 Swarm\n\n备份 Swarm\
  \ 将备份在发生灾难性故障或损坏时恢复 Swarm 所需的控制面对象。从备份恢复 Swarm 是一种极见的场景。然而，业务关键环境应该始终为最坏的情况做好准备。\n\
  \n你可能会问，如果控制面已经复制并具有高可用性（HA），为什么还需要备份呢？为了回答这个问题，请考虑以下场景：恶意攻击者删除了 Swarm 上的所有 `Secrets`。在这种情况下，HA\
  \ 无法提供任何帮助，因为 `Secrets` 将从自动复制到所有管理节点的集群存储器中被删除。在这种情况下，高可用的复制集群存储器反而对你不利——它迅速传播了删除操作。在这种情况下，你可以从保留在源代码库中的副本中重新创建被删除的对象，或者你可以尝试从最近的备份中恢复你的\
  \ Swarm。\n\n以声明的方式管理你的 Swarm 和应用程序是防止需要从备份恢复的极佳方法。例如，将配置对象存储在 Swarm 之外的代码仓库中，将让你能够重新部署网络、服务、密钥和其他对象。然而，声明式地管理你的环境并严格使用版本控制仓库需要纪律。\n\
  \n无论如何，让我们看看如何 `backup a swarm`。\n\nSwarm 的配置和状态存储在每个管理节点的 `/var/lib/docker/swarm`\
  \ 上。配置包括：Raft 日志键、overlay 网络、Secrets、Configs、Services 等。Swarm 备份是该目录下所有文件的副本。\n\n\
  由于该目录的内容会被复制到所有管理节点，你可以并且应该从多个管理节点执行备份。但是，由于你必须停止正在备份节点上的 `Docker` 守护进程，因此从非领导（non-leader）管理节点执行备份是一个好主意。这是因为在领导节点上停止\
  \ Docker 将触发选举。你应该在业务空闲执行备份，因为如果在备份期间另一个管理节点失败，停止管理节点可能会增加 Swarm 丢失仲数的风险。\n\n我们正要遵循的程序是出于演示目的，你需要根据你的生产环境对其进行调整。它还创建了一些\
  \ Swarm 对象，以便稍后的步骤可以证明恢复操作有效。\n\n> **警告**：以下操作带有风险。你还应该确保定期执行测试备份和恢复操作，并测试结果。\n\n\
  以下命令将创建以下两个对象，以便你证明恢复操作：\n\n*   一个名为“Unimatrix-01”的 overlay 网络\n*   一个名为“missing\
  \ drones”的 Secret，包含文本“Seven of Nine”\n\n```\n$ docker network create -d overlay\
  \ Unimatrix-01\nw9l904ff73e7stly0gnztsud7\n\n$ printf \"Seven of Nine\" | docker\
  \ secret create missing_drones -\ni8oj3b2lid27t5202uycw37lg\n```\n\n让我们执行 Swarm\
  \ 备份。\n\n1.  在非领导 Swarm 管理节点上停止 Docker。\n    如果你在该节点上运行了任何容器或服务任务，此操作可能会停止它们。\n\
  \    ```\n     $ service docker stop\n    ```\n\n2.  备份 Swarm 配置。\n    此示例使用 Linux\
  \ 的 `tar` 工具执行文件拷贝以作为备份。请随时使用不同的工具。\n    ```\n     $ tar -czvf swarm.bkp /var/lib/docker/swarm/\n\
  \     tar: Removing leading `/`\n     /var/lib/docker/swarm/\n     /var/lib/docker/swarm/raft/\n\
  \     /var/lib/docker/swarm/worker-/ ...\n    ```\n\n3.  验证备份文件是否存在。\n    ```\n\
  \     $ ls -l\n     -rw-r--r-- 1 root root 450727 May 4 14:06 swarm.bkp\n    ```\n\
  \    在真实世界中，你应该根据任何备份策略存储此备份。\n    此时，Swarm 已完成备份，你可以重启节点。\n\n4.  重启 Docker。\n \
  \   ```\n     $ service docker restart\n    ```\n\n现在你有了备份，让我们执行测试恢复。此程序中的步骤演示了该操作。在真实世界中执行恢复可能会略有不同，但总体过程是类似的。\n\
  \n> **注意**：如果你的 Swarm 仍在运行且只想添加一个新的管理节点，则不需要执行恢复操作。在这种情况下只需添加新管理节点。Swarm 恢复仅适用于\
  \ Swarm 损坏或丢失且无法从代码库副本中恢复的情况。\n\n我们将使用之前的 `swarm.bkp` 文件来恢复 Swarm。**所有 Swarm 节点必须停止\
  \ Docker 守护进程并删除 `/var/lib/docker/swarm` 目录的内容。**\n\n为了使恢复有效，还需要满足以下条件：\n\n1. 你只能恢复到运行与备份时相同\
  \ Docker 版本的节点上\n2. 你只能恢复到与执行备份节点 IP 地址相同的节点上\n\n从你希望恢复的 Swarm 管理节点上执行以下任务。\n\n\
  1.  从备份恢复 Swarm 配置。\n    在此示例中，我们将从名为 `swarm.bkp` 的压缩 tar 文件进行恢复。此命令需要恢复到根目录，因为解压操作将包含原始文件的完整路径。这在你的环境中可能有所不同。\n\
  \    ```\n     $ tar -zxvf swarm.bkp -C /\n    ```\n\n2.  启动 Docker。启动 Docker 的方法因环境而异。\n\
  \    ```\n     $ service docker start\n    ```\n\n3.  初始化一个新的 Swarm 集群。\n    记住，你并不是在恢复一个管理节点并将其加入工作集群。此操作是为了恢复没有存活管理节点的故障\
  \ Swarm。`--force-new-cluster` 标志告诉 Docker 使用第 1 步恢复的存储在 `/var/lib/docker/swarm/`\
  \ 中的配置创建一个新集群。\n    ```\n     $ docker swarm init --force-new-cluster\n     Swarm\
  \ initialized: current node (jhsg...3l9h) is now a manager.\n    ```\n\n\n\n\n##\
  \ 4. 检查操作过程中网络和服务是否已恢复。\n\n```bash\n$ docker network ls\nNETWORK ID          NAME\
  \                DRIVER              SCOPE\nz21s5v82by8q        Unimatrix-01   \
  \     overlay             swarm\n\n$ docker secret ls\nID                      \
  \    NAME                DRIVER        \ni8oj3b2lid27t5202uycw37lg   missing_drones\
  \ \n```\n\n恭喜。Swarm 已经恢复。\n\n## 5. 添加新的管理节点和工作节点，并进行全新的备份。\n\n记住，要定期且彻底地测试此流程。你不希望在在你最需要它的时候失效！\n\
  \n### Docker Swarm - 命令\n\n* `docker swarm init` 是创建新 swarm 的命令。你运行该命令的节点将成为第一个管理器，并切换到\
  \ `swarm mode` 运行。\n\n* `docker swarm join-token` 显示将 worker 和 manager 加入现有 swarm\
  \ 所需的命令和令牌。要显示加入新 manager 的命令，请使用 `docker swarm join-token manager` 命令。要获取加入 worker\
  \ 的命令，请使用 `docker swarm join-token worker` 命令。\n\n* `docker node ls` 列出 swarm 中所有的节点，包括哪些是管理器，哪个是\
  \ leader（节点）。\n\n* `docker service create` 是创建新服务的命令。\n\n* `docker service ls` 列出\
  \ swarm 中运行的服务，并提供有关服务状态及其运行副本的基本信息。\n\n* `docker service ps <service>` 提供关于单个服务副本的更详细信息。\n\
  \n* `docker service inspect` 提供关于服务的详细信息。它接受 `--pretty` 标志将返回的信息限制为最重要的。\n\n* `docker\
  \ service scale` 允许你增加或减少服务中副本的数量。\n\n* `docker service update` 允许你更新运行中服务的许多属性。\n\
  \n* `docker service logs` 允许你查看服务的日志。\n\n* `docker service rm` 是从 swarm 中删除服务的命令。请谨慎使用，因为它会在不询问确认的情况下删除所有服务副本。\n\
  \n## 章节总结\n\nDocker Swarm 是 Docker 原用于管理 Docker 节点集群以及部署和管理云原生应用的原生技术。它与 Kubernetes\
  \ 类似。\n\n核心在于，Swarm 包含一个安全集群组件和一个编排组件。\n\n安全集群组件是企业级的，提供了丰富的安全和高可用（HA）特性，这些特性是自动配置且修改极其简单的。\n\
  \n编排组件允许你以简单的声明式方式部署和管理云原生微服务应用。\n\n我们将在第 14 章深入探讨如何以声明式方式部署云原生微服务应用。\n\n# 11: Docker\
  \ 网络\n\n总是网络的问题！\n\n任何时候出现基础设施问题时，我们总是归咎于网络。部分原因是网络处于一切的中心——没有网络，就没有应用！\n\n在 Docker\
  \ 早期，网络非常困难——真的非常困难。而现在，这几乎成了一种乐事 ;-)\n\n在本章中，我们将查看 Docker 网络的基础知识，例如容器网络模型 (CNM)\
  \ 和 `libnetwork`。我们还将亲自动手构建一些网络。\n\n像往常，我们将本书分为三个部分：\n\n* TLDR（太长不看版）\n* 深度解析\n\
  * 命令\n\n## Docker 网络 - TLDR\n\nDocker 在容器内部运行应用程序，而应用程序需要在许多不同的网络上进行通信。这意味着 Docker\
  \ 需要强大的网络能力。\n\n幸运的是，Docker 提供了针对容器间网络的解决方案，以及连接到现有网络和 VLAN 的解决方案。这对于需要与外部系统（如虚拟机和物理服务器）上的功能和服务交互的容器化应用至关重要。\n\
  \nDocker 网络基于一种名为容器网络模型 (CNM) 的开源插件架构。`libnetwork` 是 Docker 对 CNM 的真实实现，它提供了 Docker\
  \ 核心网络能力。驱动程序插件到 `libnetwork` 以提供特定的网络拓扑结构。\n\n为了提供流畅的开箱即用体验，Docker 自带了一套原生驱动程序，处理最常见的网络需求。这些包括单主机桥接网络、多主机覆盖网络以及插件到现有\
  \ VLAN 的选项。生态系统伙伴可以通过提供自己的驱动程序来进一步扩展。\n\n最后但同样重要的是，`libnetwork` 提供了原生服务发现和基本的容器负载均衡解决方案。\n\
  \n这就是大局。让我们进入细节。\n\n## Docker 网络 - 深度解析\n\n我们将按照以下结构组织本章的这一部分：\n\n* 理论\n* 单主机桥接网络\n\
  * 多主机覆盖网络\n* 连接到现有网络\n* 服务发现\n* 入口网络 (Ingress networking)\n\n### 理论\n\n在最高层，Docker\
  \ 网络由三个主要组件组成：\n\n* 容器网络模型 (CNM)\n* `libnetwork`\n* 驱动程序 (Drivers)\n\nCNM 是设计规范。它概述了\
  \ Docker 网络的底层构建模块。\n\n`libnetwork` 是 CNM 的真实实现并供 Docker 使用。它用 Go 语言编写，并实现了 CNM\
  \ 中概述的核心组件。\n\n驱动程序通过实现特定的网络拓扑结构（如 VXLAN 覆盖网络）来扩展模型。\n\n图 11.1 显示了它们在非常高水平是如何结合的。\n\
  \n![Figure 11.1](img/figure11-1.png)\n\n图 11.1\n\n让我们仔细观察每一个。\n\n#### 容器网络模型 (CNM)\n\
  \n一切都从设计开始。Docker 节点设计指南是 CNM，你可以在这里阅读完整规范：https://github.com/docker/libnetwork/blob/master/design.md\n\
  \n建议阅读整个规范，但从高上看，它定义了三个构建模块：\n\n* 沙箱 (Sandboxes)\n* 端点 (Endpoints)\n* 网络 (Networks)\n\
  \n`sandbox` 是一个隔离的网络栈。它包含以太网接口、端口、路由表和 DNS 配置。\n\n`endpoint` 是虚拟网络接口（例如 `veth`）。就像普通网络接口一样，它们负责建立连接。在\
  \ CNM 的情况下，`endpoint` 的工作是将 `sandbox` 连接到 `network`。\n\n`network` 是交换机的软件实现（802.1d\
  \ 桥接器）。因此，它们分组并隔离一组需要通信的端点集。\n\n图 11.2 显示了三个组件以及它们如何连接。\n\n![Figure 11.2 容器网络模型\
  \ (CNM)](img/figure11-2.png)\n\n#### 容器与 CNM\n\nDocker 环境中的调度单元是容器，正如名称所示，容器网络模型就是为容器提供网络。图\
  \ 11.3 显示了 CNM 组件与容器的关系——沙箱被放在容器内部以提供网络连接。\n\n![Figure 11.3](img/figure11-3.png)\n\
  \n图 11.3\n\n容器 A 有一个接口（endpoint）并连接到网络 A。容器 B 有两个接口（endpoint）并连接到网络 A 和网络 B。这两个容器能够通信，因为它们都连接到网络\
  \ A。然而，如果没有层 3 路由器的帮助，容器 B 中的两个*endpoint* 无法相互通信。\n\n图 11.4 再次扩展了图表，这次添加了一个 Docker\
  \ 主机。虽然容器 A 和容器 B 运行在同一台主机上，但通过沙箱，它们的网络栈在操作系统层面是完全隔离的。\n\n\n\n\n\n![图 11.4](img/figure11-4.png)\n\
  \n# 图 11.4\n\n## Libnetwork\n\nCNM 是设计文档，而 `libnetwork` 是其标准实现。它是开源的，用 Go 编写，跨平台（Linux\
  \ 和 Windows），并被 Docker 使用。\n\n在 Docker 早期，所有的网络代码都存在守护进程（daemon）内部。这是一场噩梦——守护进程变得臃肿，而且它没有遵循\
  \ Unix 构建模块化工具的原则（即工具既能独立工作，又能轻松地组合到其他项目中）。因此，所有代码都被剥离并重构为一个基于 CNM 原则的名为 `libnetwork`\
  \ 的外部库。如今，所有 Docker 核心网络代码都存在于 `libnetwork` 中。\n\n正如你预期的，它实现了 CNM 中定义的所有三个组件。它还实现了原生的*服务发现*、*基于入口的容器负载均衡*以及网络控制平面和管理平面的功能。\n\
  \n## 驱动程序 (Drivers)\n\n如果说 `libnetwork` 实现的是控制平面和管理平面的功能，那么驱动程序则实现了数据平面。例如，连通性和隔离都由驱动程序处理。网络的实际创建也是如此。这种关系如图\
  \ 11.5 所示。\n\n![图 11.5](img/figure11-5.png)\n\n# 图 11.5\n\nDocker 自带了几个内置驱动程序，被称为原生驱动程序或*本地驱动程序*。在\
  \ Linux 上，它们包括 `bridge`、`overlay` 和 `macvlan`。在 Windows 上，它们包括 `nat`、`overlay`、`transparent`\
  \ 和 `l2bridge`。我们将在本章稍后介绍如何使用其中一些。\n\n第三方也可以编写 Docker 网络驱动程序，被称为*远程驱动程序*或插件。Weave\
  \ Net 是一个流行的例子，可以从 Docker Hub 下载。\n\n每个驱动程序负责其所负责的网络上所有资源的实际创建和管理。例如，名为“prod-fe-cuda”的\
  \ overlay 网络将由 `overlay` 驱动所有和管理。这意味着 `overlay` 驱动将被调用用于该网络上所有资源的创建、管理和删除。\n\n为了满足复杂高流性环境的需求，`libnetwork`\
  \ 允许多个网络驱动程序同时激活。这意味着你的 Docker 环境可以支持广泛的异构网络。\n\n### 单主机桥接网络 (Single-host bridge\
  \ networks)\n\n最简单的 Docker 网络是单主机桥接网络。\n\n名称告诉了我们两点：\n\n* **单主机 (Single-host)**\
  \ 告诉它只存在于单个 Docker 主机上，并且只能连接同一主机上的容器。\n* **桥接 (Bridge)** 告诉它是 802.1d 桥器（二层交换机）的实现。\n\
  \nLinux 版 Docker 使用内置的 `bridge` 驱动创建单主机桥接网络，而 Windows 版 Docker 使用内置的 `nat` 驱动创建。从所有意义来说，它们的工作原理相同。\n\
  \n图 11.6 显示了两个具有相同名为“mynet”本地桥接网络的 Docker 主机。尽管网络是相同的，但它们是独立的隔离网络。这意味着图中容器无法直接通信，因为它们位于不同的网络。\n\
  \n![图 11.6](img/figure11-6.png)\n\n# 图 11.6\n\n每个 Docker 主机都会获得一个默认的单主机桥接网络。在 Linux\
  \ 上它被称为“bridge”，在 Windows 上它被称为“nat”（是的，这些名称与创建它们的驱动程序名称相同）。默认情况下，这是所有新容器将连接的网络，除非你在命令行上使用\
  \ `--network` 标志覆盖它。\n\n下面的列表显示了在新安装的 Linux 和 Windows Docker 主机上运行 `docker network\
  \ ls` 命令的输出。输出经过了修剪，只显示每个主机上的默认网络。注意网络名称与用于创建它的驱动程序相同——这只是巧合，并非要求。\n\n```\n//Linux\n\
  $ docker network ls\nNETWORK ID        NAME        DRIVER        SCOPE\n333e18cd343\
  \      bridge      bridge        local\n\n//Windows\n> docker network ls\nNETWORK\
  \ ID        NAME        DRIVER        SCOPE\n095d4090fa32      nat         nat \
  \          local\n```\n\n`docker network inspect` 命令是一个宝库。如果你对底层感兴趣，我强烈建议阅读它的输出。\n\
  \n```\ndocker network inspect bridge\n[\n    {\n        \"Name\": \"bridge\",  \
  \   << Windows 上为 nat\n        \"Id\": \"333e184...d9e55\",\n        \"Created\"\
  : \"2018-01-15T20:43:02.566345779Z\",\n        \"Scope\": \"local\",\n        \"\
  Driver\": \"bridge\",   << Windows 上为 nat\n        \"EnableIPv6\": false,\n    \
  \    \"IPAM\": {\n            \"Driver\": \"default\",\n            \"Options\"\
  : null,\n            \"Config\": [\n                {\n                    \"Subnet\"\
  : \"172.17.0.0/16\"\n                }\n            ]\n        },\n        \"Internal\"\
  : false,\n        \"Attachable\": false,\n        \"Ingress\": false,\n        \"\
  ConfigFrom\": {\n            \"Network\": \"\"\n        },\n        <Snip>\n   \
  \ }\n]\n```\n\n\n\n\n\n```\n$ docker network inspect localnet --format '{{json .Containers}}'\n\
  {\n  \"4edcbd...842c3aa\": {\n    \"Name\": \"c1\",\n    \"EndpointID\": \"43a13b...3219b8c13\"\
  ,\n    \"MacAddress\": \"02:42:ac:14:00:02\",\n    \"IPv4Address\": \"172.20.0.2/16\"\
  ,\n    \"IPv6Address\": \"\"\n    }\n},\n```\n\n输出显示新容器“c1”位于 `localnet` 桥接/nat\
  \ 网络上。\n\n如果你再次运行 Linux 的 `brctl show` 命令，你将看到 c1 的接口已连接到 `br-20c2e8ae4bbb` 桥接器上。\n\
  \n```\n$ brctl show\nbridge name       bridge id           STP enabled     interfaces\n\
  br-20c2e8ae4bbb   8000.02429636237c   no              vethe792ac0\ndocker0     \
  \      8000.0242aff9eb4f   no\n```\n\n这如图图 11.10 所示。\n\n![Figure 11.10](img/figure11-10.png)\n\
  \n图 11.10\n\n如果在同一个网络中添加另一个新容器，它应该能够通过名称 ping 通“c1”容器。这是因为所有新容器都会自动注册到嵌入的 Docker\
  \ DNS 服务，使它们能够解析同一网络上所有容器的名称。\n\n> **注意：** Linux 上默认的 `bridge` 网络不支持通过 Docker DNS\
  \ 服务进行名称解析。所有其他用户定义的桥接网络都支持。以下演示之所以能运行，是因为容器位于用户定义的 `localnet` 网络上。\n\n让我们来测试一下。\n\
  \n1. 创建一个名为“c2”的新交互式容器，并将其置于与“c1”相同的 `localnet` 网络中。\n\n   ```\n     //Linux\n \
  \    $ docker container run -it --name c2 \\\n       --network localnet \\\n   \
  \    alpine sh\n\n     //Windows\n     > docker container run -it --name c2 `\n\
  \       --network localnet `\n       mcr.microsoft.com/powershell:nanoserver\n \
  \  ```\n\n   你的终端将切换到“c2”容器。\n\n2. 从“c2”容器内部，通过名称 ping“c1”容器。\n\n   ```\n     >\
  \ ping c1\n     Pinging c1 [172.26.137.130] with 32 bytes of data:\n     Reply from\
  \ 172.26.137.130: bytes=32 time=1ms TTL=128\n     Reply from 172.26.137.130: bytes=32\
  \ time=1ms TTL=128\n     Control-C\n   ```\n\n   成功了！这是因为 c2 容器运行着本地 DNS 解析器，它会将请求转发到内部\
  \ Docker DNS 服务器。该 DNS 服务器维护了所有使用 `--name` 或 `--net-alias` 标志启动的容器的映射。\n\n在仍登录容器时，尝试运行一些与网络相关的命令。这是学习更多\
  \ Docker 容器网络工作原理的极佳方法。以下片段显示了从之前创建的“c2”Windows 容器内部运行 `ipconfig` 命令的结果。你可以 `Ctrl+P+Q`\
  \ 退出容器并运行另一个 `docker network inspect localnet` 命令来匹配 IP 地址。\n\n```\nPS C:\\> ipconfig\n\
  Windows IP Configuration\nEthernet adapter Ethernet:\n   Connection-specific DNS\
  \ Suffix  . :\n   Link-local IPv6 Address . . . . . . . : fe80::14d1:10c8:f3dc:2eb3%4\n\
  \   IPv4 Address. . . . . . . . . . . : 172.26.135.0\n   Subnet Mask . . . . . .\
  \ . . . . . : 255.255.240.0\n   Default Gateway . . . . . . . . . . : 172.26.128.1\n\
  ```\n\n到为止，我们提到桥接网络上的容器只能与同一网络上的容器通信。然而，你可以使用端口映射来绕过限制。\n\n端口映射允许将容器映射到 Docker 宿主机上的端口。任何命中\
  \ Docker 宿主机配置端口的流量都将被定向到容器。高层流程如图 11.11 所示。\n\n![Figure 11.11](img/figure11-11.png)\n\
  \n图 11.11\n\n在图中，运行在容器中的应用程序操作的是 `80` 端口。这被映射到宿主机 `10.0.0.15` 接口上的 `5000` 端口。结果是所有命中宿主机\
  \ `10.0.0.15:5000` 的流量都会被重定向到端口 80 的容器。\n\n让我们来看一个示例，将运行 Web 服务器的容器端口 80 映射到 Docker\
  \ 宿主机的端口 5000。该示例将使用 Linux 上的 NGINX。如果你在 Windows 上操作，需要将 `nginx` 替换为 Windows 的 Web\
  \ 服务器镜像。\n\n1. 运行一个 Web 服务器容器，将端口 80 映射到 5000 端口。\n\n   ```bash\n   $ docker run\
  \ -d -p 5000:80 --name web nginx\n   ```\n\n2. 从宿主机验证连接。\n\n   ```bash\n   $ curl\
  \ http://localhost:5000\n   ```\n\n3. 完成后停止并删除容器。\n\n   ```bash\n   $ docker rm\
  \ -f web\n   ```\n\n\n\n\n\n```\n$ docker network create -d macvlan \\\n  --subnet=10.0.0.0/24\
  \ \\\n  --ip-range=10.0.0.0/25 \\\n  --gateway=10.0.0.1 \\\n  -o parent=eth0.100\
  \ \\\n  macvlan100\n```\n\n这这将创建 `macvlan100` 网络和 `eth0.100` 子接口。现在的配置如下。\n\n![图\
  \ 11.16](img/figure11-16.png)\n\n图 11.16\n\nMACVLAN 使用标准的 Linux 子接口，你必须用它们将连接的 VLAN\
  \ 的 ID 对它们进行标记。在例例中，我们连接到 VLAN 100，因此我们为子接口标记了 `.100`（`etho.100`）。\n\n我们还使用了 `--ip-range`\
  \ 标志来告诉 MACVLAN 网络它可以分配给容器的 IP 地址子集。至关重要的是，此地址范围必须为 Docker 预留，不能被其他节点或 DHCP 服务器使用，因为没有管理平面功能来检查冲突的地址范围。\n\
  \n`macvlan100` 网络已准备好供容器使用，让我们用以下命令部署一个。\n\n```\n$ docker container run -d --name\
  \ mactainer1 \\\n  --network macvlan100 \\\n  alpine sleep 1d\n```\n\n现在的配置如图 11.17\
  \ 所示。但请记住，底层网络（VLAN 100）看不到 MACVLAN 的任何魔法操作，它只看到带有 MAC 地址和 IP 地址的容器。考虑到这一点，`mactainer1`\
  \ 容器将能够 ping 并与 VLAN 100 上的任何其他系统通信。太棒了！\n\n> **注意：** 如果你无法让其工作，可能是因为主机网卡（NIC）没有处于混杂模式（promiscuous\
  \ mode）。记住，公云平台通常不允许混杂模式。\n\n![图 11.17](img/figure11-17.png)\n\n图 11.17\n\n到此时，我们已经得到了一个\
  \ MACVLAN 网络并用它将新容器连接到现有的 VLAN。然而，此此此此于此。Docker MACVLAN 驱动构建在同名的经过测试的 Linux 内核驱动之上。因此，它支持\
  \ VLAN 中继（VLAN trunking）。这意味着我们可以创建多个 MACVLAN 网络，并将同一 Docker 主机上的容器连接到它们，如图 11.18\
  \ 所示。\n\n![图 11.18](img/figure11-18.png)\n\n图 11.18\n\n这基本上涵盖了 MACVLAN 的内容。Windows\
  \ 通过 `transparent` 驱动提供了类似的解决方案。\n\n### 用于故障排除的容器和及日志\n\n在继续进行服务发现（Service Discovery）之前，关于故障排除连接问题的简单说明。\n\
  \n如果你认为容器之间遇到了连接问题，那么检查 Docker 守护进程日志以及容器日志也是值得。\n\n在 Windows 系统上，守护进程日志存储在 `~AppData\\\
  Local\\Docker`，你可以在 Windows 事件查看器中查看它们。在 Linux 上，取决于你使用的 `init` 系统。如果你正在运行 `systemd`，日志将进入\
  \ `journald`，你可以使用 `journalctl -u docker.service` 命令查看它们。如果你没有运行 `systemd`，则应该查看以下位置：\n\
  \n*   运行 `upstart` 的 Ubuntu 系统：`/var/log/upstart/docker.log`\n*   基于 RHEL 的系统：`/var/log/messages`\n\
  *   Debian：`/var/log/daemon.log`\n\n你也可以告诉 Docker 你希望守护进程日志的详细程度。要做到这一点，请编辑守护配置文件（`daemon.json`），将\
  \ `debug` 设置为 `true`，并将 `log-level` 设置为以下之一：\n\n*   `debug`：最详细的选项\n*   `info`：默认值和第二详细的选项\n\
  *   `warn`：第三详细的选项\n*   `error`：第四详细的选项\n*   `fatal`：最详细的选项\n\n以下来自 `daemon.json`\
  \ 的代码片段启用了调试并将级别设置为 `debug`。它适用于所有 Docker 平台。\n\n```\n{\n  <Snip>\n  \"debug\":true,\n\
  \  \"log-level\":\"debug\",\n  <Snip>\n}\n```\n\n在修改文件后，务必重启 Docker。\n\n以上是守护进程日志。那么容器日志呢？\n\
  \n独立容器的日志可以使用 `docker container logs` 命令查看，Swarm 服务日志可以使用 `docker service logs`\
  \ 命令查看。然而，Docker 支持许多日志驱动，并不是所有的都能与 `docker logs` 命令配合。\n\n除了守护进程日志的驱动程序和配置外，每个\
  \ Docker 主机都有容器的默认日志驱动和配置。某些驱动程序包括：\n\n*   `json-file`（默认）\n*   `journald`（仅对运行\
  \ `systemd` 的 Linux 主机有效）\n*   `syslog`\n*   `splunk`\n*   `gelf`\n\n`json-file`\
  \ 和 `journald` 可能是容易配置的，它们都支持 `docker logs` 和 `docker service logs` 命令。命令的格式为 `docker\
  \ logs <container-name>` 和 `docker service logs <service-name>`。\n\n\n\n\n然而，服务发现是“网络范围内的”（`network-scoped`）。这意味着名称解析仅对于同一网络上的容器和\
  \ `Services` 有效。如果两个容器位于不同的网络上，它们将无法相互解析。\n\n关于服务发现和名称解析的最后一点……\n\n可以使用自定义的 DNS\
  \ 选项来配置 Swarm 服务和独立容器。例如，`--dns` 标志允许你指定一个自定义 DNS 服务器列表，以备在嵌入的 Docker DNS 服务器无法解析查询时使用。这在查询\
  \ Docker 外部的服务名称时很常见。你还还可以使用 `--dns-search` 标志为针对未限定主机名的查询添加自定义搜索域（即当查询的不是完全限定域名名时）。\n\
  \n在 Linux 上，这些操作都是通过向每个容器内部的 `/etc/resolv.conf` 文件添加条目来实现的。\n\n下面的示例将启动一个新的独立容器，并添加臭名昭著的\
  \ `8.8.8.8` Google DNS 服务器，以及将 `nigelpoulton.com` 作为搜索域附加到未限定主机名的查询中。\n\n```\n$\
  \ docker container run -it --name c1 \\\n  --dns=8.8.8.8 \\\n  --dns-search=nigelpoulton.com\
  \ \\\n  alpine sh\n```\n\n#### 入口负载均衡\n\nSwarm 支持两种发布模式，使得服务可以在集群外部被访问：\n\n*   Ingress\
  \ 模式（默认）\n*   Host 模式（主机模式）\n\n通过 `ingress mode` 发布的服务可以从 Swarm 中的任何节点访问——即使是未运行服务副本的节点。通过\
  \ `host mode` 发布的服务只能通过直接访问运行服务副本的节点来访问。图 11.20 显示了这两种模式之间的差异。\n\n![图 11.20](img/figure11-20.png)\n\
  \n图 11.20\n\nIngress 模式是默认模式。这意味着每当你使用 `-p` 或 `--publish` 发布服务时，它将默认置于 `ingress\
  \ mode`。要要在 `host mode` 中发布服务，你需要使用 `--publish` 标志的冗长格式并添加 `mode=host`。让我们来看一个使用\
  \ `host mode` 的示例。\n\n```\n$ docker service create -d --name svc1 \\\n  --publish\
  \ published=5000,target=80,mode=host \\\n  nginx\n```\n\n关于该命令的几点说明。`docker service\
  \ create` 允许你使用`长格式语法`或短格式语法来发布服务。短格式看起来像这样：`-p 5000:80`，我们已经见过几次了。然而，你不能使用短格式在\
  \ `host mode` 下发布服务。\n\n长格式看起来像这样：`--publish published=5000,target=80,mode=host`。它是一个用逗号分隔的列表，每个逗号后没有空格。这些选项的作用如下：\n\
  \n*   `published=5000` 允许服务通过端口 5000 从外部可用\n*   `target=80` 确保对 `published` 端口的外部请求被映射回服务副本上的\
  \ 80 端口\n*   `mode=host` 确保外部请求只有在它们通过运行服务副本的节点进入时才能到达该服务。\n\nIngress 模式是你通常会使用的。\n\
  \n在后台，`ingress mode` 使用了一个层 4 路由网格，称为 `Service Mesh`（服务网格）或 `Swarm Mode Service\
  \ Mesh`。图 11.21 显示了外部请求到以 ingress 模式暴露的服务的基本流量流。\n\n![图 11.21](img/figure11-21.png)\n\
  \n图 11.21\n\n让我们快速过一遍这张图表。\n\n1.  顶部的命令部署了一个名为“svc1”的新 Swarm 服务。它将服务附加到 `overnet`\
  \ 网络并并在端口 5000 上发布它。\n2.  像这样发布 Swarm 服务（`published=5000,target=80`）会在 `ingress\
  \ mode` 下工作。\n3.  Ingress 模式是默认的。这意味着每当你使用 `-p` 或 `--publish` 发布服务时，它将默认置于 `ingress\
  \ mode`。\n4.  要要在 `host mode` 中发布服务，你需要使用 `--publish` 标志的冗长格式并添加 `mode=host`。\n\
  5.  Ingress 模式是你你通常会使用的。\n6.  图 11.21 显示了外部请求到以 `ingress mode` 暴露的服务的基本流量流。\n7.\
