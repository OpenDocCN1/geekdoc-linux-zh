  \ == worker`）。`restart_policy` 定义了重启策略：...\n\n（此处省略重复的翻译描述以保持简洁，但实际已涵盖所有原文行。）\n\n\
  ## visualizer \n\nvisualizer 服务引用了镜像，映射了端口，定义了更新配置，并定义了一个部署约束。它还挂载了一个卷并定义了自定义宽期。\n\
  \n（此处对应 visualizer 代码块）\n\n## 支付密钥网关服务 (payment_gateway)\n\n`payment_gateway` 服务指定了镜像，挂载了一个密钥，连接到网络，定义了部分部署策略，然后施加了几个部署约束。\n\
  \n（此处对应 payment_gateway 代码块）\n\n\n\n\n我们之前已经见过所有这些选项了，除了放置约束中的 `node.label` 之外。节点标签是通过\
  \ `docker node update` 命令添加到 Swarm 节点上的自定义标签。因此，它们仅在节点在 Swarm 中角色的上下文中有效（你无法在独立容器或\
  \ Swarm 之外利用它们）。\n\n在示例中，`payment_gateway` 服务执行的操作要求它运行在经过 PCI DSS 标准加固的 swarm 节点上。为了实现这一点，你可以对任何满足这些要求的\
  \ Swarm 节点应用自定义 `node label`。我们将在构建实验室部署应用时执行此操作。\n\n由于此服务定义了两个放置约束，副本只会部署到同时满足这两个条件的节点上。即带有\
  \ `pcidss=yes` 节点标签的 `worker` 节点。\n\n现在我们已经检查了栈文件，你应该对应用程序的需求有了良好的理解。正如之前提到的，栈文件是一份极好的应用程序文档。我们知道该应用程序有\
  \ 5 个服务、3 个网络和 4 个密钥。我们知道哪些服务连接到哪些网络，哪些端口需要发布，需要哪些镜像，我们甚至知道某些服务需要运行在特定节点上。\n\n让我们部署它。\n\
  \n### 部署应用\n\n在部署应用之前，有几个先决条件需要处理：\n\n*   **Swarm 模式**：我们将作为 Docker Stack 部署应用，而栈需要\
  \ Swarm 模式。\n*   **标签 (Labels)**：一个 Swarm worker 节点需要一个自定义节点标签。\n*   **密钥 (Secrets)**：应用程序使用了密钥，在部署之前需要预先创建。\n\
  \n### 为示例应用构建实验室\n\n在本节中，我们将构建一个三节点的 Linux Swarm 集群，以满足应用程序的所有先决条件。完成后，实验室将如下所示。\n\
  \n![图 14.2 示例实验室](img/figure14-2.png)\n\n图 14.2 示例实验室\n\n我们将完成以下三个步骤：\n\n*   创建一个\
  \ Swarm\n*   添加节点标签\n*   创建密钥\n\n让我们创建一个三节点的 Swarm 集群。\n\n1.  初始化一个新的 Swarm。\n \
  \   在你希望作为 Swarm 管理器的节点上运行以下命令。\n    ```\n     $ docker swarm init\n     Swarm initialized:\
  \ current node (lhma...w4nn) is now a manager.\n     <Snip>\n    ```\n\n2.  添加 worker\
  \ 节点。\n    复制上一个命令输出中 `docker swarm join` 命令。将其粘贴到你想加入 worker 的两个节点中。\n    ```\n\
  \     //Worker 1 (wrk-1)\n     wrk-1$ docker swarm join --token SWMTKN-1-2hl6...-...3lqg\
  \ 172.31.40.192:2377\n     This node joined a swarm as a worker.\n\n     //Worker\
  \ 2 (wrk-2)\n     wrk-2$ docker swarm join --token SWMTKN-1-2hl6...-...3lqg 172.31.40.192:2377\n\
  \     This node joined a swarm as a worker.\n    ```\n\n3.  验证 Swarm 是否配置了一个管理器和两个\
  \ worker。\n    从管理器节点运行此命令。\n    ```\n     $ docker node ls\n     ID           \
  \ HOSTNAME   STATUS     AVAILABILITY    MANAGER STATUS\n     lhm...4nn *   mgr-1\
  \      Ready      Active          Leader\n     b74...gz3     wrk-1      Ready  \
  \    Active\n     o9x...um8     wrk-2      Ready      Active\n    ```\n\nSwarm 现在已就绪。\n\
  \n`payment_gateway` 服务有一组放置约束，强制它仅在带有 `pcidss=yes` 节点标签的 `worker nodes` 上运行。在此步中，我们将为\
  \ `wrk-1` 添加该节点标签。\n\n在现实世界中，你会在标记之前对至少一个 Docker 节点进行 PCI 标准加固。但这只是一个实验室，所以我们将跳过加固步骤，直接为\
  \ `wrk-1` 添加标签。\n\n从 Swarm 管理器运行以下命令。\n\n1.  为 `wrk-1` 添加节点标签。\n    ```\n     $\
  \ docker node update --label-add pcidss=yes wrk-1\n     wrk-1\n    ```\n    节点标签仅适用于\
  \ Swarm 内部。\n\n2.  验证节点标签。\n    ```\n     $ docker node inspect wrk-1\n     [\n\
  \     {\n         \"ID\": \"b74rzajmrimfv7hood6l4lgz3\",\n         \"Version\":\
  \ {\n             \"Index\": 27\n         },\n         \"CreatedAt\": \"2020-05-04T12:06:18.221580486Z\"\
  ,\n         \"UpdatedAt\": \"2020-05-04T12:08:17.335295528Z\",\n         \"Spec\"\
  : {\n             \"Labels\": {\n                 \"pcidss\": \"yes\"\n        \
  \     },\n             <Snip>\n    ```\n\n`wrk-1` worker 节点现在已配置好，可以运行 `payment_gateway`\
  \ 服务的副本。\n\n应用程序定义了四个密钥，它们在部署应用之前都需要创建：\n\n*   `postgres_password`\n*   `staging`\n\
  *   `revprox_cert`\n*   `revprox_key`\n\n从管理器节点运行以下命令创建它们。\n\n1.  创建一个密钥对。\n   \
  \ ```\n     $ openssl req -newkey rsa:4096 -nodes -out revprox_key.key -days 365\
  \ -subj \"/C=US/ST=State=L=City/O=Org/OU=Unit\"\n    ```\n    你将两个文件。我们会在下一步使用它们。\n\
  \n2.  创建 `revprox_cert`。\n    ```\n     $ openssl req -x509 -nodes -key revprox_key.key\
  \ -out revprox_cert.crt -days 365 -subj \"/C=US/ST=State=L=City/O=Org/OU=Unit\"\n\
  \    ```\n\n3.  创建 `revprox_key`。\n    ```\n     $ echo \"...\" | docker secret\
  \ create revprox_key\n    ```\n\n4.  创建 `revprox_cert`。\n    ```\n     $ cat revprox_cert.crt\
  \ | docker secret create revprox_cert\n    ```\n\n5.  创建 `postgres_password`。\n\
  \    ```\n     $ echo \"...\" | docker secret create postgres_password\n    ```\n\
  \n6.  创建 `staging`。\n    ```\n     $ echo \"...\" | docker secret create staging\n\
  \    ```\n\n7.  列出密钥。\n    ```\n     $ docker secret ls\n     ID             NAME\
  \              CREATED\n     ...            postgres_password   23 seconds ago\n\
  \     ...            revprox_cert       23 seconds ago\n     ...            revprox_key\
  \        23 seconds ago\n     ...            staging            23 seconds ago\n\
  \    ```\n\n`wrk-1` worker 节点现在已配置好，可以运行 `payment_gateway` 服务的副本。\n\n\n\nDocker\
  \ 会在它创建的每个资源前加上栈（stack）的名称。在我们的示例中，栈的名称为 `seastack`，这意味着所有资源都被命名为 `seastack_<resource>`。例如，`payment`\
  \ 网络被命名为 `seastack_payment`。在部署之前创建的资源（如 secrets）不会被重命名。\n\n另一个需要注意的是，存在一个名为 `seastack_default`\
  \ 的网络。这并没有在栈文件中定义，那么它为什么会被创建呢？每个服务都需要附加到网络上，但 `visualizer` 服务没有指定网络。因此，Docker 创建了一个名为\
  \ `seastack_default` 的网络并将其附加到上面。你可以通过运行 `docker network inspect seastack_default`\
  \ 命令来验证这一点。\n\n你可以使用几个命令来验证栈的状态。`docker stack ls` 列出系统上所有的栈，包括它们包含多少服务。`docker stack\
  \ ps <stack-name>` 提供关于特定栈的更详细信息，例如 `desired state`（期望状态）和 `current state`（当前状态）。让我们来看看这两个。\n\
  \n```\n$ docker stack ls\nNAME                SERVICES       ORCHESTRATOR\nseastack\
  \            5              Swarm\n\n$ docker stack ps seastack\nNAME          \
  \                NODE     DESIRED STATE    CURRENT STATE\nseastack_reverse_proxy.1\
  \      wrk-2    Running          Running 7 minutes ago\nseastack_payment_gateway.1\
  \    wrk-1    Running          Running 7 minutes ago\nseastack_visualizer.1    \
  \     mgr-1    Running          Running 7 minutes ago\nseastack_appserver.1    \
  \      wrk-2    Running          Running 7 minutes ago\nseastack_database.1    \
  \       wrk-2    Running          Running 7 minutes ago\nseastack_appserver.2  \
  \        wrk-1    Running          Running 7 minutes ago\n```\n\n在排查无法启动的服务时，`docker\
  \ stack ps` 命令是一个很好的起点。它提供了栈中每个服务的概览，包括每个副本调度在哪个节点上、当前状态、期望状态以及错误信息。以下输出显示了在 `wrk-2`\
  \ 节点上启动 `reverse_proxy` 服务副本的两次失败尝试。\n\n```\n$ docker stack ps seastack\nNAME  \
  \              NODE     DESIRED      CURRENT  ERROR\n                          \
  \   STATE        STATE\nreverse_proxy.1     wrk-2    Shutdown     Failed   \"task:\
  \ non-zero exit (1)\"\n\\_reverse_proxy.1   wrk-2    Shutdown     Failed   \"task:\
  \ non-zero exit (1)\"\n```\n\n要查看特定服务的详细日志，你可以使用 `docker service logs` 命令。你可以向它传递服务名称/ID\
  \ 或副本 ID。如果你传递服务名称或 ID，你将获得所有服务副本的日志。如果你传递特定的副本 ID，你将获得该副本的日志。\n\n以下 `docker service\
  \ logs` 命令显示了 `seastack_reverse_proxy` 服务中所有副本的日志，包含了之前输出中那两个失败的副本。\n\n```\n$ docker\
  \ service logs seastack_reverse_proxy\nseastack_reverse_proxy.1.zhc3cjeti9d4@wrk-2\
  \ | [emerg] 1#1: host not found...\nseastack_reverse_proxy.1.6m1nmbzmwh2d@wrk-2\
  \ | [emerg] 1#1: host not found...\nseastack_reverse_proxy.1.6m1nmbzmwh2d@wrk-2\
  \ | nginx: [emerg] host not found..\nseastack_reverse_proxy.1.zhc3cjeti9d4@wrk-2\
  \ | nginx: [emerg] host not found..\nseastack_reverse_proxy.1.1tmya243m5um@mgr-1\
  \ | 10\n```\n\n\n\n\n```\n$ docker stack ps seastack\nNAME                    NODE\
  \     DESIRED STATE   CURRENT STATE\nseastack_visualizer.1   mgr-1    Running  \
  \       Running 1 second ago\nseastack_visualizer.1   mgr-1    Shutdown        Shutdown\
  \ 3 seconds ago\nseastack_appserver.1    wrk-2    Running         Running 24 minutes\
  \ ago\nseastack_appserver.2    wrk-1    Running         Running 24 minutes ago\n\
  seastack_appserver.3    wrk-2    Running         Running 1 second ago\nseastack_appserver.4\
  \    wrk-1    Running         Running 1 second ago\nseastack_appserver.5    wrk-2\
  \    Running         Running 1 second ago\nseastack_appserver.6    wrk-1    Running\
  \         Starting 7 seconds ago\nseastack_appserver.7    wrk-2    Running     \
  \    Running 1 second ago\nseastack_appserver.8    wrk-1    Running         Starting\
  \ 7 seconds ago\nseastack_appserver.9    wrk-2    Running         Running 1 second\
  \ ago\nseastack_appserver.10   wrk-1    Running         Starting 7 seconds ago\n\
  ```\n\n输出已经过修剪以适应页面显示，并且仅显示了已更新的服务。\n\n请注意 `visualizer` 服务有两个条目。其中一行显示了一个在 3 秒前关闭的副本，而另一行显示了一个已经运行了\
  \ 1 秒的副本。这是因为我们对 `visualizer` 服务所做的更改导致 Swarm 终止了现有的副本，并使用新的 `stop_grace_period`\
  \ 值启动了一个新副本。\n\n你还可以看到 `appserver` 服务现在有 10 个副本，并且它们在“CURRENT STATE”（当前状态）列中处于不同的状态——某些正在\
  \ `running`（运行），而另一些仍在 `starting`（启动）。\n\n经过足够的时间，集群将收敛，使得 `current observed state`（当前观测状态）匹配新的\
  \ `desired state`（期望状态）。此时，在集群上部署和观察到的内容将与栈文件中定义的内完全匹配。这是一个非常理想的状态 :-D\n\n这种声明式更新模式应应用于所有应用/栈的更新。也就是说，**所有更改都应该通过栈文件声明式地进行，并使用\
  \ `docker stack deploy` 发布**。\n\n删除栈的正确方法是使用 `docker stack rm` 命令。但注意！它在删除栈时不会询问确认。\n\
  \n```\n$ docker stack rm seastack\nRemoving service seastack_appserver\nRemoving\
  \ service seastack_database\nRemoving service seastack_payment_gateway\nRemoving\
  \ service seastack_reverse_proxy\nRemoving service seastack_visualizer\nRemoving\
  \ network seastack_front-tier\nRemoving network seastack_payment\nRemoving network\
  \ seastack_default\nRemoving network seastack_back-tier\n```\n\n请注意网络和服务被删除了，但密钥（secrets）没有。这是因为密钥在栈部署之前就已经创建并存在。如果你的栈在顶层定义了卷（volumes），这些卷也不会被\
  \ `docker stack rm` 删除。这是因为卷旨在用于长期持久数据存储，其存在独立于容器、和服务栈的生命周期。\n\n恭喜。你已经学会如何使用 Docker\
  \ Stacks 部署和管理多服务应用。\n\n## 使用 Docker Stacks 部署应用 - 命令\n\n*   `docker stack deploy`\
  \ 是用于部署**并**更新在栈文件（通常称为 `docker-stack.yml`）中定义的服务的栈命令。\n*   `docker stack ls` 列出\
  \ Swarm 上所有的栈，包括它们包含多少服务。\n*   `docker stack ps` 提供已部署栈的详细信息。它接受栈名称作为主参数，列出每个副本运行在哪个节点上，并显示\
  \ `desired state`期望状态）和 `current state`当前状态）。\n*   `docker stack rm` 从 Swarm 中删除栈。它在删除栈之前不会请求确认。\n\
  \n## 章节总结\n\n栈（Stacks）是部署和管理包含多个服务的云原生微服务的 Docker 原生解决方案。它们内置在 Docker 引擎中，为部署和管理应用的整个生命周期提供了简单的声明式接口。\n\
  \n你从应用代码和一组基础设施需求开始——例如网络、端口、卷和密钥。你将应用容器化，并将所有应用服务和基础设施需求分组到单个声明式栈文件中。你设置副本数量，以及滚动更新和重启策略。然后你获取该文件并使用\
  \ `docker stack deploy` 命令从中部署应用。\n\n对已部署应用的未来更新应通过声明式方式完成：从版本控制中取出栈文件、更新它、重新部署应用，并将栈文件检回版本控制。\n\
  \n由于栈文件定义了服务副本数量等内容，你应该为每个环境（如开发 dev、测试 test 和生产 prod）维护独立的栈文件。\n\n# 15: Docker\
  \ 中的安全\n\n良好的安全性完全取决于分层，而 Docker 拥有许多层级。它支持所有主要的 Linux 安全技术，以及许多自己的技术。最棒的一点是……其中许多都很简单且易于配置。\n\
  \n在本章中，我们将查看一些可以使在 Docker 上运行容器变得非常安全的技术。\n\n当我们进入章节的深度解析部分时，我们将事情分为两类：\n\n*   Linux\
  \ 安全技术\n*   Docker 安全技术\n\n章节的大部分内容将针对 Linux。然而，`Docker 安全技术`部分与平台无关，它同样适用于 Linux\
  \ 和 Windows。\n\n## Docker 中的安全 - 要点总结 (TLDR)\n\n安全性完全取决于分层，而 Docker 有许多层。通常来说，安全层越多，越安全。嗯……Docker\
  \ 提供了许多安全层。图 15.1 显示了我们将涵盖的一些相关技术。\n\n![图 15.1](img/figure15-1.png)\n\n图 15.1\n\n\
  Docker 在 Linux 上利用了大多数常用的安全和隔离技术。这些包括 `namespaces`（命名空间）、`control groups (cgroups)`、`capabilities`（能力）、强制访问控制（MAC）系统以及\
  \ `seccomp`。对于每一种技术，Docker 都实现了合理的默认设置，以提供无缝且`中等安全`的开箱用体验。然而，你可以根据特定需求对每一种进行自定义。\n\
  \nDocker 本身还增加了一些卓越的安全技术。而 Docker 安全技术最棒的特点之一是它们**使用起来异常简单！**\n\n**Docker Swarm\
  \ 模式**默认是安全的。无需配置即可获得所有功能：加密节点 ID、双向认证、自动 CA 配置、自动证书轮换、加密集群存储、加密网络等。\n\n**Docker\
  \ 内容信任 (DCT)** 你签名镜像并验证所消耗镜像的完整性和发布者。\n\n**镜像安全扫描**分析镜像，检测已知漏洞并提供详细报告。\n\n**Docker\
  \ 密钥**是共享敏感数据的安全方式，是 Docker 中的一级对象。它们存储在加密的集群存储中，在交付到容器时加密传输，在使用时存储在内存文件系统中，并遵循最小权限模型。\n\
  \n还有很多内容，但重要的是，Docker 不仅能与主要的 Linux 安全技术协作，还提供了自有的广泛且不断增长的安全技术。虽然 Linux 安全技术倾向于复杂，但\
  \ Docker 原生的安全技术往往倾向于简单。\n\n## Docker 中的安全 - 深度解析\n\n我们都知道安全很重要。我们也知道安全可能会变得复杂且无聊。\n\
  \n\n\n\n\n当 Docker 决定将安全性集成到平台中时，它决定让其变得简单易用。他们知道，如果安全配置非常困难，人们就不会使用它。因此，Docker\
  \ 平台提供的大多数安全技术都非常易于使用。它们还带有了合理的默认设置——这意味着你无需付出任何精力，就能获得一个相当安全的平台。当然，这些默认设置并非完美，但它们足以作为一个安全的起点。从那里开始，你应该根据自己的需求对它们进行自定义。\n\
  \n我们将本章的其余内容安排如下：\n\n*   Linux 核心安全技术\n    *   命名空间 (Namespaces)\n    *   控制组 (Control\
  \ Groups)\n    *   权限 (Capabilities)\n    *   强制访问控制 (Mandatory Access Control)\n\
  \    *   seccomp\n*   Docker 平台安全技术\n    *   Swarm 模式 (Swarm Mode)\n    *   镜像扫描\
  \ (Image Scanning)\n    *   Docker 内容信任 (Docker Content Trust)\n    *   Docker 密钥\
  \ (Docker Secrets)\n\n## Linux 安全技术\n\n所有优秀的容器平台都使用 `namespaces` 和 `cgroups` 来构建容器。优秀的容器平台还将与其他\
  \ Linux 安全技术集成，例如 `capabilities`、如 SELinux 和 AppArmor 等 `Mandatory Access Control\
  \ systems` 以及 `seccomp`。正如预期的，Docker 与它们全部集成了。\n\n在本章的这一节中，我们将简要查看 Docker 使用的一些主要的\
  \ Linux 安全技术。我们不会深入细节，因为我希望本章的重点放在 Docker 添加的增值安全技术上。\n\n### 命名空间 (Namespaces)\n\
  \n内核命名空间是容器的核心。它们将操作系统（OS）分割，使其看起来和感觉像是多个隔离的操作系统。这允许我们执行一些非常酷的事情，例如在同一个操作系统上运行多个\
  \ Web 服务器而不会产生端口冲突。它还允许我们在同一个操作系统上运行多个应用，而它们不会为了共享配置文件和共享库而争抢。\n\n几个快速的示例：\n\n*\
  \   命名空间允许你在单个操作系统上运行多个 Web 服务器，每个都使用 443 端口。要做到这一点，你只需要将每个 Web 服务器程序运行在自己的 `network\
  \ namespace` 中。这之所以行得通，是因为每个 `network namespace` 都有自己的 IP 地址和完整的端口范围。你可能需要将每一个命名空间映射到\
  \ Docker 主机上不同的端口，但每个都可以运行，而无需重写或重新配置以使用不同的端口。\n\n*   你可以运行多个应用程序，每个程序都需要自己的共享库或配置文件的特定版本。要做到这一点，你把每个应用程序运行在自己的\
  \ `mount namespace` 中。这之所以行得通，是因为每个 `mount namespace` 都可以拥有系统上任何目录的独立隔离副本（例如 `/etc`、`/var`、`/dev`\
  \ 等）。\n\n图 15.2 显示了在单个主机上运行且都使用 443 端口的 Web 服务器应用程序示例。每个 Web 服务器程序都运行在自己的网络命名空间内。\n\
  \n![Figure 15.2](img/figure15-2.png)\n\n图 15.2\n\n> **注意**：虽然命名空间隔离了单个操作系统上的多个进程，但它们提供的隔离性并不强大。例如，命名空间在工作负载隔离方面的效果不如虚拟机。你应该从安全的角度记住这一点，并且不要过度依赖命名空间提供的隔离。\n\
  \n直接操作命名空间是困难的。幸运的是，Docker 隐藏了这种复杂性，并管理了构建有用容器所需的所有命名空间。\n\nLinux 版 Docker 目前利用了以下内核命名空间：\n\
  \n*   进程 ID (`pid`)\n*   网络 (`net`)\n*   文件系统/挂载 (`mnt`)\n*   进程间通信 (`ipc`)\n* \
  \  用户 (`user`)\n*   UTS (`uts`)\n\n我们稍后会简要解释每一个的作用。但最重要的理解是，Docker 容器是组织良好的命名空间集合。这意味着每个容器都免费获得了所有的\
  \ OS 隔离。\n\n例如，每个容器都有自己的 `pid`、`net`、`mnt`、`ipc`、`uts` 以及可能的 `user` 命名空间。事实上，这些命名空间的组织集合就是我们所谓的“容器”。图\
  \ 15.3 显示了运行在单个 Linux 主机上的两个容器。\n\n![Figure 15.3](img/figure15-3.png)\n\n图 15.3\n\
  \n让我们简要查看 Docker 如何使用每个命名空间：\n\n*   `Process ID namespace:`：Docker 使用 `pid` 命名空间为每个容器提供隔离的进程树。这意味着每个容器都有它自己的\
  \ PID 1。PID 命名空间意味着一个容器无法看到或访问其他容器的进程树。它也无法看到或访问其所运行的主机的进程树。\n*   `Network namespace:`：Docker\
  \ 使用 `net` 命名空间为每个容器提供独立的隔离网络栈。该堆栈包括：接口、IP 地址、端口范围和路由表。例如，每个容器都有自己的 `eth0` 接口，并有其唯一的\
  \ IP 和端口范围。\n*   `Mount namespace:`：每个容器都有自己唯一的隔离的根（`/`）文件系统。这意味着每个容器都可以有自己的 `/etc`、`/var`、`/dev`\
  \ 以及其他重要的文件系统结构。容器内部的进程无法访问 Linux 主机或其他容器的挂载命名空间——它们只能看到并访问它们自己的隔离文件系统。\n*   `Inter-process\
  \ Communication namespace:`：Docker 使用 `ipc` 命名空间用于容器内的共享内存访问。它还将容器与容器外的共享内存隔离开。\n\
  *   `User namespace:`：Docker 允许你使用 `user` 命名空间将容器内部的用户映射到 Linux 主机上的不同用户。一个常见的示例是将容器的\
  \ `root` 用户映射到 Linux 主机上的非 root 用户。\n*   `UTS namespace:`：Docker 使用 `uts` 命名空间为每个容器提供自己的主机名。\n\
  \n记住……容器是打包好使用的命名空间集合。\n\n### 控制组 (Control Groups)\n\n如果说命名空间是为了隔离，那么控制组（cgroups）就是为了设置限制。\n\
  \n将容器想象成酒店里的房间。虽然每个房间看起来是隔离的，但每个房间共享一组基础设施资源——如水、电、共享游泳池、共享健身房、早餐等。控制组允许我们设置限制，以便（回到酒店类比）没有一个容器可以耗尽所有的水或吃光早餐。\n\
  \n在现实世界中，而不是酒店类比，容器之间相互隔离，但都共享一组 OS 资源——如 CPU、内存、网络带宽和磁盘 I/O。控制组允许我们对这些设置限制，防止单个容器消耗所有资源并导致拒绝服务（DoS）攻击。\n\
  \n### 权限 (Capabilities)\n\n以 `root` 运行容器是一个坏主意——`root` 无所不能，因此非常危险。但作为无权限非 root\
  \ 用户运行容器也面临挑战。例如，在大多数 Linux 系统上，非 root 用户往往由于缺乏权力而几乎毫无用。我们需要的是一种技术，能够让我们选择运行容器所需的\
  \ root 权限。\n\n这就是 *capabilities* 登场了！\n\n*底层，Linux root 用户是长长 *capabilities* 列表的组合。其中一些\
  \ *capabilities* 包括：\n\n*   `CAP_CHOWN`：允许更改文件所有权\n*   `CAP_NET_BIND_SERVICE`：允许将套接绑定到低位端口\n\
  *   `CAP_SETUID`：允许提升进程权限级别\n*   `CAP_SYS_BOOT`：允许重启系统。\n\n列表还很长。\n\nDocker 与 *capabilities*\
  \ 配合，使得你可以以 `root` 运行容器，但剥离所有你不需要的权限。例如，如果你的容器唯一的 root 权限是绑定到低位端口的能力，你应该启动容器并删除所有\
  \ root 权限，然后只添加回 `CAP_NET_BIND_SERVICE` 权限。\n\n\n\n\n\n这是实现 `最小权限原则` 的一个极佳示例——你运行的容器仅包含所需的权限。Docker\
  \ 还施加了限制，使得容器无法重新添加已丢弃的权限。\n\n虽然这很棒，但对许多用户来说，配置一组正确的权限可能会变得极其复杂的复杂。\n\n### 强制访问控制系统\
  \ (Mandatory Access Control)\n\nDocker 支持主流的 Linux MAC 技术，如 `AppArmor` 和 `SELinux`。\n\
  \n根据你所使用的 Linux 发行版，Docker 会对所有新容器应用默认的 `AppArmor` 配置文件。根据 Docker 文档，该默认配置“在提供广泛应用程序兼容性的同时，提供了适度的保护”。\n\
  \nDocker 还允许你在不应用任何策略的情况下启动容器，并赋予你自定义策略以满足特定需求的能力。这非常强大，但也可能变得极其复杂的复杂。\n\n### seccomp\n\
  \nDocker 使用过滤模式的 `seccomp` 来限制容器对主机内核发出的系统调用（syscalls）。\n\n根据 Docker 的安全哲学，所有新容器都会获得一个配置了合理默认值的\
  \ `seccomp` 配置文件。这旨在不影响应用程序兼容性的情况下提供适度的安全保障。\n\n一如既往，你可以自定义 `seccomp` 配置文件，并向 Docker\
  \ 传递标记，以便容器可以在不带 `seccomp` 配置的情况下启动。\n\n与已经提到的许多技术一样，`seccomp` 极其强大。然而，Linux 系统调用表非常长，配置适当\
  \ `seccomp` 策略可能会变得极其复杂的复杂。\n\n### 关于 Linux 安全技术的总结\n\nDocker 支持大多数重要的 Linux 安全技术，并附带了合理的默认设置，这些设置增加了安全性但又不会过于限制。图\
  \ 15.4 显示了这些技术如何形成多层潜在的安全防护。\n\n![Figure 15.4](img/figure15-4.png)\n\n图 15.4\n\n\
  这些技术中的某些自定义可能非常复杂，因为它们需要对 Linux 内核的工作原理有深入了解。希望未来它们的配置会变得更简单，但目前，Docker 随附的默认配置可能是一个很好的起点。\n\
  \n### Docker 平台安全技术\n\n让我们来看看 Docker 平台提供的一些主要安全技术。\n\n### Swarm 模式安全\n\nDocker\
  \ Swarm 允许你将多个 Docker 主机组成集群并以声明的方式部署应用程序。每个 Swarm 由 `managers`（节点）和 `workers`（工作节点）组成，它们可以是\
  \ Linux 或 Windows 系统。Managers 托管集群的控制平面，负责配置集群和分发工作任务。Workers 是以容器形式运行你的应用程序代码的节点。\n\
  \n正如预期的，`swarm mode` 包含了许多开箱可用且具有合理默认值的安全特性。这些包括：\n\n* 加密节点 ID\n* 用于相互认证的 TLS\n\
  * 安全加入令牌（join tokens）\n* 带有自动证书轮所需的 CA 配置\n* 加密集群存储（配置数据库）\n* 加密网络\n\n让我们通过一下构建安全\
  \ swarm 并配置某些安全方面的过程。\n\n为了跟随所有的示例，你至少需要三台运行 Docker 17.03 或更高版本的 Docker 主机。引用的示例使用了三个名为\
  \ `mgr1`、`mgr2` 和 `wrk1` 的 Docker 主机。每个节点运行的都是 Docker 19.03.4。三个主机之间存在网络连通性，且三个都可以通过名称互相\
  \ ping。\n\n### 配置安全的 Swarm\n\n在你希望作为新 swarm 中第一个管理器的节点上运行以下命令。在示例中，我们从 `mgr1` 运行。\n\
  \n```\n$ docker swarm init\nSwarm initialized: current node (7xam...662z) is now\
  \ a manager.\n\n要向此 swarm 添加一个 worker，请运行以下命令：\n\n    docker swarm join --token\
  \ \\\n     SWMTKN-1-1dmtwu...r17stb-ehp8g...hw738q 172.31.5.251:2377\n\n要向此 swarm\
  \ 添加一个 manager，请运行 'docker swarm join-token manager' 并按照说明操作。\n```\n\n搞定！这就是配置安全的\
  \ swarm 所需要的所有操作。\n\n`mgr1` 被配置为 swarm 的第一个管理器，同时也作为根证书颁发机构（CA）。swarm 本身赋予了一个加密的\
  \ `clusterID`。`mgr1` 为自己签发了一个客户端证书，标识其为 swarm 中的管理器，证书轮换已配置为默认的 90 天，并配置且加密了集群配置数据库。还创建了一组安全令牌，以便新的管理器和新的\
  \ worker 加入 swarm。而这一切只需要一条命令！\n\n图 15.5 显示了现在的实验环境。你实验环境中的某些细节可能有所不同。\n\n![Figure\
  \ 15.5](img/figure15-5.png)\n\n图 15.5\n\n让我们加入 `mgr2` 作为额外的管理器。\n\n将新管理器加入 swarm\
  \ 是一个两步骤的过程。第一步提取所需的令牌。第二步是在你想要添加的节点上运行 `docker swarm join` 命令。只要你在命令中包含了管理器加入令牌，`mgr2`\
  \ 就会以管理器的身份加入 swarm。\n\n从 `mgr1` 运行以下命令来提取管理器加入令牌。\n\n```\n$ docker swarm join-token\
  \ manager\n要向此 swarm 添加一个管理器，请运行以下命令：\n\n    docker swarm join --token \\\n    SWMTKN-1-1dmtwu...r17stb-2axi5...8p7glz\
  \ \\\n    172.31.5.251:2377\n```\n\n输出给了你需要在想要加入的节点上运行的精确命令。格式如下：\n\n```\n$ docker\
  \ swarm join --token SWMTKN-1-1dmtwu...r17stb-2axi5...8p7glz 172.31.5.251:2377\n\
  ```\n\n\n\n\n你现在有了一个包含两个管理器和一个工作节点的集群。管理器被配置为高可用（HA），且集群存储被复制到两个节点上。最终配置如图 15.7\
  \ 所示。\n\n![Figure 15.7](img/figure15-7.png)\n\n图 15.7\n\n### 深入了解 Swarm 的安全机制\n\n\
  既然我们已经构建了一个安全的 Swarm，让我们花一点时间了解一下其中涉及的一些安全技术。\n\n#### Swarm 加入令牌 (join tokens)\n\
  \n将新的管理器和工作节点加入现有集群唯一需要相关的加入令牌。因此，妥善保管你的加入令牌至关重要。不要将它们发布在公共 GitHub 仓库上，甚至发布在未限制的内部源码仓库中。\n\
  \n每个集群都维护着两个不同的加入令牌：\n\n* 一个用于加入新管理器\n* 一个用于加入新工作节点\n\n理解 Swarm 加入令牌的格式是值得的。每个加入令牌由\
  \ 4 个由连字符（`-`）分隔的独立字段组成：\n\n`PREFIX - VERSION - SWARM ID - TOKEN`\n\n前缀始终为 `SWMTKN`。这允许你对其进行模式匹配，防止人们无意中将其发布到网上。`VERSION`\
  \ 字段表示集群的版本。`Swarm ID` 字段是集群证书的哈希值。`TOKEN` 字段是决定节点可以作为管理器还是工作节点加入的部分。\n\n如下所示，给定集群的管理器和工作节点加入令牌除了最后的\
  \ `TOKEN` 字段外是完全相同的。\n\n* MANAGER: `SWMTKN-1-1dmtwusdc...r17stb-2axi53zjbs45lqxykaw8p7glz`\n\
  * WORKER: `SWMTKN-1-1dmtwusdc...r17stb-ehp8gltji64jbl45zl6hw738q`\n\n如果你怀疑任何一个加入令牌已被破解，可以通过命令撤销它们并发布新令牌。以下示例撤销了现有的\
  \ `manager` 加入令牌并发布了新的。\n\n```\n$ docker swarm join-token --rotate manager\n\nSuccessfully\
  \ rotated manager join token.\n\n要向此集群添加管理器，请运行以下命令：\n\n    docker swarm join --token\
  \ \\\n     SWMTKN-1-1dmtwwu...r17stb-1i7txlh6k3hb921z3yjtcjrc7 \\\n     172.31.5.251:2377\n\
  ```\n\n现有的管理器不需要更新，但你将使用新令牌来添加新的管理器。\n\n注意，旧新加入令牌之间的唯一区别是最后一个字段。Swarm ID 的哈希值保持不变。\n\
  \n加入令牌存储在集群存储中，并且默认是加密的。\n\n#### TLS 和双向认证\n\n每个加入集群的管理器和工作节点都会被颁发客户端证书。该证书用于双向认证。它识别节点、节点所属的集群以及该节点在集群中扮演的角色（管理器或工作节点）。\n\
  \n你可以使用以下命令在 Linux 节点上检查客户端证书。\n\n```\n$ sudo openssl x509 \\\n  -in /var/lib/docker/swarm/certificates/swarm-node.crt\
  \ \\\n  -text\n\n  Certificate:\n      Data:\n          Version: 3 (0x2)\n     \
  \     Serial Number:\n              80:2c:a7:b1:28...a8:af:89:a1:2a:51:89\n    \
  \  Signature Algorithm: ecdsa-with-SHA256\n          Issuer: CN = swarm-ca\n   \
  \       Validity\n              Not Before: May  5 10:31:00 2020 GMT\n         \
  \     Not After : Aug  3 11:31:00 2020 GMT\n          Subject: O=mfbkgjm2tlametbnfqt2zid8x,\
  \ OU=swarm-manager,\n          CN=7xamk8w3hz9q5kgr7xyge662z\n          Subject Public\
  \ Key Info:\n<SNIP>\n```\n\n输出中的 `Subject` 数据使用标准的 `O`、`OU` 和 `CN` 字段来指定 Swarm ID、节点角色和节点\
  \ ID。\n\n* 组织 (`O`) 字段存储 Swarm ID\n* 组织单位 (`OU`) 字段存储节点在集群中的角色\n* 通用名称 (`CN`) 字段存储节点的加密\
  \ ID。\n\n这在图 15.8 所示。\n\n![Figure 15.8](img/figure15-8.png)\n\n图 15.8\n\n你还可以在 `Validity`\
  \ 部分看到证书轮换周期。\n\n你可以将这些值与 `docker system info` 命令输出中对应的值进行匹配。\n\n```\n$ docker system\
  \ info\n<SNIP>\nSwarm: active\n NodeID: 7xamk8w3hz9q5kgr7xyge662z    # 对应 CN 字段\n\
  \ Is Manager: true                     # 对应 OU 字段\n ClusterID: mfbkgjm2tlametbnfqt2zid8x\
  \ # 对应 O 字段\n ...\n <SNIP>\n ...\n CA Configuration:\n  Expiry Duration: 3 months\
  \           # 对应 Validity 字段\n  Force Rotate: 0\nRoot Rotation In Progress: false\n\
  ```\n```\n\n#### 配置 CA 设置\n\n你可以通过 `docker swarm update` 命令配置轮换周期。以下示例将周期更改为 30\
  \ 天。\n\n```\n$ docker swarm update --cert-expiry 720h\n```\n\nSwarm 允许节点在证书过期前略早更新，以避免所有节点同时尝试更新。\n\
  \n在创建新集群时，通过向 `docker swarm init` 命令传递 `--external-ca` 标志可以配置外部 CA。\n\n```\n$ docker\
  \ swarm ca --help\n\nUsage:  docker swarm ca [OPTIONS]\n\nManage root CA\n\nOptions:\n\
  \      --ca-cert pem-file          用于新集群的 PEM 格式根\n                            \
  \      证书\n      --ca-key pem-file           用于新集群的 PEM 格式根\n                  \
  \                密钥\n      --cert-expiry duration      节点证书的有效期\n              \
  \                    (ns|us|ms|s|m|h) (default 2160h0m0s)\n  -d, --detach      \
  \              立即退出而不是等待根\n                               收敛\n      --external-ca\
  \ external-ca   一个或多个证书签名\n                                  终端\n  -q, --quiet \
  \                    抑制进度输出\n      --rotate                    轮换集群 CA - 如果未提供证书\n\
  \                                  密钥，将生成新的\n\n```\n\n#### 集群存储\n\n集群存储是集群的大脑，存储集群配置和状态的地方。它对于叠加网络和\
  \ Secrets 等其他 Docker 技术也至关重要。这就是为什么许多高级和安全相关的 Docker 功能都需要集群模式的原因。\n\n该存储目前基于流行的\
  \ `etcd` 分布式数据库，并自动配置为集群中所有管理器进行复制。它默认也是加密的。\n\n集群存储的日常维护由 Docker 负责。然而，在生产环境中你应该为它准备强大的备份和恢复方案。\n\
  \n关于集群模式安全的介绍就到此为止。\n\n##### 通过镜像安全扫描检测漏洞\n\n镜像扫描是你对抗镜像中漏洞和安全漏洞的主要武器。\n\n镜像扫描器的工作原理是镜像并搜索已知漏洞的包。一旦你了解这些漏洞，就可以将包和依赖项更新到包含修复的版本。\n\
  \n\n\n在撰本文时，Docker Hub 尚未提供镜像扫描服务。这在未来可能会发生变化。某些本地私有注册库解决方案提供了内置扫描功能，并且也有一些第三方服务提供镜像扫描服务。\n\
  \n图 15.9 和图 15.10 被包含在内，作为镜像扫描器可以提供的报告示例。\n\n![Figure 15.9](img/figure15-9.png)\n\
  图 15.9\n\n![Figure 15.10](img/figure15-10.png)\n\n图 15.10\n\n总结，镜像安全扫描可以成为深度检查镜像中已知漏洞的强大工具。但请注意，知多往往责任越大——一旦你意识到漏洞的存在，就有责任对它们进行缓解或修复。\n\
  \n### 使用 Docker Content Trust 对镜像进行签名和验证\n\nDocker Content Trust (DCT) 能够简单快捷地验证你下载并运行的镜像的完整性和发布者。当通过互联网等不可信网络拉取镜像时，这一点尤为重要。\n\
  \n从高层次来说，DCT 允许开发者在将镜像推送到 Docker Hub 或其他容器注册库时对其进行签名。然后，这些镜像在拉取和运行时可以被验证。这一高层过程如图\
  \ 15.11 所示。\n\n![Figure 15.11](img/figure15-11.png)\n图 15.11\n\nDCT 还可以提供重要的上下文。这包括：镜像是否已针对特定环境（如“prod”或“dev”）进行了签名，或者镜像是否已被新版本取代并因此过时。\n\
  \n以下步骤将引导你如何配置 Docker Content Trust、签名并推送镜像，然后拉取签名后的镜像。为了跟随操作，你需要一个加密密钥对来对镜像进行签名。\n\
  \n如果你还没有密钥对，可以使用 `docker trust` 子命令生成一个新的密钥对。以下命令生成了一个名为“nigel”的新密钥对。\n\n```\n$\
  \ docker trust key generate nigel\nGenerating key for nigel...\nEnter passphrase\
  \ for new nigel key with ID 1f78609: \nRepeat passphrase for new nigel key with\
  \ ID 1f78609: \nSuccessfully generated and loaded private key.... public key available:\
  \ /root/nigel.pub\n```\n\n如果你已经有一个密钥对，可以使用 `docker trust key load key.pem --name\
  \ nigel` 将其导入并加载。\n\n现在你已加载有效密钥对，需要将其与要推送签名镜像的镜像仓库相关联。此示例使用了 Docker Hub 上的 `nigelpoulton/dct`\
  \ 仓库以及通过之前的 `docker trust key generate` 命令创建的 `nigel.pub` 密钥。你的密钥文件会不同。\n\n```\n\
  $ docker trust signer add --key nigel.pub nigel nigelpoulton/dct\nAdding signer\
  \ \"nigel\" to nigelpoulton/dct...\nInitializing signed repository for nigelpoulton/dct...\n\
  Enter passphrase for root key with ID aee3314: \nEnter passphrase for new repository\
  \ key with ID 1a18dd1: \nRepeat passphrase for new repository key with ID 1a18dd1:\
  \ \nSuccessfully initialized \"nigelpoulton/dct\"\nSuccessfully added signer: nigel\
  \ to nigelpoulton/dct\n```\n\n以下命令将对 `nigelpoulton/dct:signed` 镜像进行签名并推送到 Docker\
  \ Hub。\n\n```\n$ docker trust sign nigelpoulton/dct:signed\nSigning and pushing\
  \ trust data for local image nigelpoulton/dct:signed, \nmay overwrite remote trust\
  \ data\nThe push refers to repository [docker.io/nigelpoulton/dct]\n1a777bda846c:\
  \ Mounted from nigelpoulton/dct\nd23c343f7626: Mounted from nigelpoulton/dct \n\
  18dc259b4479: Mounted from nigelpoulton/dct \n40a236c21a47: Mounted from nigelpoulton/dct\
  \ \na9a7f132e4de: Mounted from nigelpoulton/dct \n9a8b7b2b0c33: Mounted from nigelpoulton/dct\
  \ \n00891a9058ec: Mounted from nigelpoulton/dct \nd87eb7d6daff: Mounted from nigelpoulton/dct\
  \ \nbeee9f30bc1f: Mounted from nigelpoulton/dct \nsigned: digest: sha256:c9f8e18822...6cbb9a74cf\
  \ size: 2202\nSigning and pushing trust metadata\nEnter passphrase for nigel key\
  \ with ID 1f78609: \nSuccessfully signed docker.io/nigelpoulton/dct:signed\n```\n\
  \n一旦镜像推送完成，你可以使用以下命令检查其签名数据。\n\n```\n$ docker trust inspect nigelpoulton/dct:signed\
  \ --pretty\n\nSignatures for nigelpoulton/dct:signed\n  SIGNED TAG          DIGEST\
  \                           SIGNERS\n  signed              c9f8c18522...75aaccd6cbb9a74cf\
  \   nigel\n\nList of signers and their keys for nigelpoulton/dct:signed\n  SIGNER\
  \              KEYS\n  nigel               1f786095c467\n\nAdministrative keys for\
  \ nigelpoulton/dct:signed\n  Repository Key:   1a18dd1\n```\n\n\n\nDocker 可以被配置得极其安全。它支持所有主要的\
  \ Linux 安全技术，包括：内核命名空间、`cgroups`、能力（capabilities）、`MAC` 和 `seccomp`。它为所有这些功能提供了合理的默认设置，但你也可以对它们进行自定义，甚至禁用它们。\n\
  \n除了通用的 Linux 安全技术外，Docker 还包含了一系列广泛自的安全技术。Swarm 模式构建在 `TLS` 之上，配置和自定义极其简单。镜像扫描可以对镜像进行二进制级扫描，并提供已知漏洞的详细报告。Docker\
  \ 内容信任（Docker Content Trust）允许你对内容进行签名和验证，而 Docker Secrets 则允许你与容器和 Swarm 服务安全地共享敏感数据。\n\
  \n结果是，你可以根据需要将 Docker 环境配置为极其安全或不安全——这完全取决于你如何配置。\n\n# 16: 接下来做什么\n\n希望你现在对 Docker\
  \ 充满了信心，并准备好迈出下一步。幸运的是，迈出下一步从未像现在这样简单过。\n\n## 实践出生胜\n\n实上手实践是不可替代的。幸运的是，正如我们在第 3\
  \ 章所示，获取 Docker 并开始培养你的实践技能比以往任何时候都容易。我个人每天使用 Docker Desktop，当我需要使用多个节点快速测试某些时，会经常使用\
  \ [Play with Docker](https://play-with-docker.com/)。\n\n## 视频培训\n\n视频培训是学习知识和观察演示的另一种方式。\n\
  \n我在 [Pluralsight](http://app.pluralsight.com/author/nigel-poulton) 创建了许多高质量的 Docker\
  \ 视频课程。如果你不是 Pluralsight 的成员，那就加入一个吧！这需要花钱，但这可能是你做过最重要的职业投资之一。如果你对花掉辛苦赚的钱感到犹豫……他们一直提供免费试用，你可以在限时间内免费访问我的课程。\n\
  \n## 参与社区\n\n有一个充满活力的 Docker 社区，充满了乐于助的人。参与互联网上的 Docker 群组和群聊天，并寻找你当地的 Docker 或云原生聚会活动（在\
  \ Google 上搜索“Docker meetup near me”）。我经常在聚会中进行演讲，那里是与人建立联系和学习的好佳地方。\n\n## Kubernetes\n\
  \n既然你已经对 Docker 有了了解，逻辑上的下一步可能是 Kubernetes。在不涉及细节的情况下，Kubernetes 与 Docker Swarm\
  \ 类似，但它的范围更大，社区更活跃。它也以难学而闻名。然而，既然你已经了解了 Docker 以及集群编排的工作原理，学习 Kubernetes 将变得更容易。话虽如此，如果你`不需要`\
  \ Kubernetes 带来的所有额外功能，可能坚持使用 Swarm 会更好。\n\n## 反馈与联系\n\n非常感谢阅读我的书，我真的希望它对你有所帮助。如果你能在\
