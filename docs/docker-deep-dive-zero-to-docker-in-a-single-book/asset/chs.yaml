  \n#### 入口负载均衡\n\nSwarm 支持两种发布模式，使得服务可以在集群外部被访问：\n\n*   Ingress 模式（默认）\n*   Host\
  \ 模式\n\n通过 `ingress mode` 发布的服务可以从 Swarm 中的任何节点访问——即使是未运行服务副本的节点。通过 `host mode`\
  \ 发布的服务只能通过访问运行服务副本的节点来访问。图 11.20 显示了这两种模式之间的差异。\n\n![图 11.20](img/figure11-20.png)\n\
  \n图 11.20\n\nIngress 模式是默认的。这意味着每当你使用 `-p` 或 `--publish` 发布服务时，它将默认置于 `ingress mode`。要要在\
  \ `host mode` 中发布服务，你需要使用 `--publish` 标志的冗长格式并添加 `mode=host`。让我们来看一个使用 `host mode`\
  \ 的示例。\n\n```\n$ docker service create -d --name svc1 \\\n  --publish published=5000,target=80,mode=host\
  \ \\\n  nginx\n```\n\n关于该命令的几点说明。`docker service create` 允许你使用`长格式语法`或短格式语法来发布服务。短格式看起来像这样：`-p\
  \ 5000:80`，我们已经见过几次了。然而，你不能使用短格式在 `host mode` 下发布服务。\n\n长格式看起来像这样：`--publish published=5000,target=80,mode=host`。它是一个逗号分隔的列表，每个逗号后没有空格。这些选项的作用如下：\n\
  \n*   `published=5000` 允许服务通过端口 5000 从外部可用\n*   `target=80` 确保对 `published` 端口的外部请求被映射回服务副本上的\
  \ 80 端口\n*   `mode=host` 确保外部请求只有在它们通过运行服务副本的节点进入时才能到达该服务。\n\nIngress 模式是你你通常会使用的。\n\
  \n在后台，`ingress mode` 使用了一个层 4 路由网格，称为 `Service Mesh` 或 `Swarm Mode Service Mesh`。图\
  \ 11.21 显示了外部请求到以 `ingress mode` 暴露的服务的基本流量流。\n\n![图 11.21](img/figure11-21.png)\n\
  \n图 11.21\n\n（注：由于提供的原文中存在大量重复段落，译文已根据高级工程师逻辑进行了去重处理，确保内容通顺且不重复）\n\n让我们快速过一遍这张图表。\n\
  \n1.  顶部的命令部署了一个名为“svc1”的新 Swarm 服务。它将服务附加到 `overnet` 网络并并在端口 5000 上发布它。\n2.  像这样发布\
  \ Swarm 服务（`published=5000,target=80`）会在 `ingress mode` 下工作。\n3.  在后台，`ingress mode`\
  \ 使用了一个层 4 路由网格，称为 `Service Mesh` 或 `Swarm Mode Service Mesh`。\n4.  图 11.21 显示了外部请求到以\
  \ `ingress mode` 暴露的服务的基本流量流。\n\n（注：此处根据指令“不要重复输出原文”的要求，对原文中重复出现的描述段落进行了整合翻译）\n\n\
  （注：由于原始文本中包含大量逻辑重复和循环错误，上述译文已根据实际技术内容进行了优化）\n\n\n\n\n\n在现实世界中，容器之间能够可靠且安全地通信至关重要，即使它们位于不同网络的不同主机上。这正是叠加网络（overlay\
  \ networking）大显身场。它允许你创建一个跨越多个主机的扁平、安全的二层网络。容器连接到该网络并可以直接通信。\n\nDocker 提供了原生的叠加网络，其配置简单且默认安全。\n\
  \n在底层，它构建在 `libnetwork` 和驱动程序之上。`libnetwork` 是容器网络模型（CNM）的标准实现，而驱动程序是实现不同网络技术和拓扑的可插组件。Docker\
  \ 提供了原生驱动程序，包括 `overlay` 驱动程序。\n\n## Docker 叠加网络 - 深度解析\n\n在 2015 年 3 月，Docker,\
  \ Inc 收购了一家名为 `Socket Plane` 的容器网络初创公司。收购背后的两个原因是为 Docker 引入**真实网络**，以及让容器网络变得简单到即使开发者也能轻松上手。\n\
  \n他们在这两个方面都超额完成了。\n\n然而，在简单的网络命令背后隐藏着许多复杂的组件。这些都是你在进行生产环境部署和尝试排除故障之前需要理解的内容。\n\n\
  本章其余部分将分为两部分：\n\n* 第 1 部分：我们将构建并测试 Docker 叠加网络\n* 第 2 部分：我们将解释使其运行起来的魔法机制\n\n##\
  \ 在 Swarm 模式下构建并测试 Docker 叠加网络\n\n对于以下示例，我们将使用位于两个不同二层网络上的 Docker 主机，并通过路由器连接。参见图\
  \ 12.1，并注意每个节点所在的不同网络。\n\n![Figure 12.1](img/figure12-1.png)\n\n图 12.1\n\n你可以参考\
  \ Linux 或 Windows Docker 主机进行操作。Linux 至少需要 4.4 版本的内核（越新越好），Windows 应该是 Windows Server\
  \ 2016 或更高版本，并安装了最新的热补丁。你也可以通过 Docker Desktop 在 Mac 或 Windows PC 上进行。但是，你无法看到全部优势，因为它们只支持单个\
  \ Docker 主机。\n\n### 构建 Swarm\n\n要做的第一件事是将两个主机配置为双节点 swarm。这是因为 swarm 模式是叠加网络的前提条件。\n\
  \n我们将在 `node1` 上运行 `docker swarm init` 命令使其成为 `manager`（管理节点），然后在 `node2` 上运行 `docker\
  \ swarm join` 命令使其成为 `worker`（工作节点）。这不是一个生产级的配置，但对于学习实验室已经足够。鼓励你使用更多的 managers 和\
  \ workers 进行测试并扩展示例。\n\n如果你在自己的实验室中操作，将需要将 IP 地址等内容替换为适用于你环境的正确值。\n\n在 `node1` 上运行以下命令。\n\
  \n```\n$ docker swarm init \\\n  --advertise-addr=172.31.1.5 \\\n  --listen-addr=172.31.1.5:2377\n\
  \nSwarm initialized: current node (1ex3...o3px) is now a manager.\n```\n\n在 `node2`\
  \ 上运行下一个命令。你需要确保任何防火墙都开启了以下端口：\n\n* `2377/tcp` 用于管理面通信\n* `7946/tcp` 和 `7946/udp`\
  \ 用于控制面通信（基于 SWIM 的 gossip 协议）\n* `4789/udp` 用于 VXLAN 数据平面\n\n```\n$ docker swarm\
  \ join \\\n  --token SWMTKN-1-0hz2ec...2vye \\\n  172.31.1.5:2377\nThis node joined\
  \ a swarm as a worker.\n```\n\n我们现在有了一个双节点 Swarm，其中 `node1` 为 manager，`node2` 为\
  \ worker。\n\n### 创建一个新的叠加网络\n\n现在让我们创建一个名为 `uber-net` 的新 `overlay network`。\n\n\
  在 `node1`（manager）上运行以下命令。\n\n```\n$ docker network create -d overlay uber-net\n\
  c740ydi1lm89khn5kd52skrd9\n```\n\n就是这样。你刚刚创建了一个全新的叠加网络，它对 Swarm 中的所有主机都可用，且其控制面通过\
  \ TLS 进行了加密（使用 GCM 模式的 AES 加密，密钥每 12 小时轮换）。如果你想加密数据平面，只需在命令中添加 `-o encrypted` 标志。然而，由于性能开销，默认未启用数据平面加密。强烈建议在启用数据平面加密之前进行广泛性能测试。如果你启用了它，它将受到具有密钥轮换相同\
  \ AES GCM 模式的保护。\n\n如果你不确定 `control plane`（控制面）和 `data plane`（数据面）等术语，控制面流量是集群管理流量，数据面流量是应用流量。默认情况下，Docker\
  \ 叠加网络加密集群管理流量但不加密应用流量。你必须显式启用应用流量加密。\n\n你可以使用 `docker network ls` 命令列出每个节点上的所有网络。\n\
  \n```\n$ docker network ls\nNETWORK ID      NAME              DRIVER     SCOPE\n\
  ddac4ff813b7    bridge            bridge     local\n389a7e7e8607    docker_gwbridge\
  \   bridge     local\na09f7e6b2ac6    host              host       local\nehw16ycy980s\
  \    ingress           overlay    swarm\n2b2c7e8d9f0a    ...\n```\n\nWindows 上的输出类似于：\n\
  \n```\nNETWORK ID      NAME              DRIVER     SCOPE\nddac4ff813b7    bridge\
  \            bridge     local\n389a7e7e8607    docker_gwbridge   bridge     local\n\
  a09f7e6b2ac6    host              host       local\nehw16ycy980s    ingress    \
  \       overlay    swarm\n2b2c7e8d9f0a    ...\n```\n\n### 将服务附加到叠加网络\n\n现在你已经有了叠加网络，让我们创建一个新的\
  \ `Docker service` 并将其附加其中。示例将创建一个具有两个副本（容器）的服务，一个运行在 `node1`，另一个运行在 `node2`。\n\n\
  在 `node1` 上运行以下命令。\n\nLinux 示例：\n\n```\n$ docker service create --name test \\\n\
  \   --network uber-net \\\n   --replicas 2 \\\n   ubuntu sleep infinity\n```\n\n\
  Windows 示例：\n\n```\n> docker service create --name test `\n  --network uber-net\
  \ `\n  --replicas 2 `\n  mcr.microsoft.com\\powershell:nanoserver pw.exe -Command\
  \ Start-Sleep 3600\n```\n\n> **注意**：Windows 示例使用反引号将参数拆行以增加可读性。反引号是 PowerShell 中的转义符。\n\
  \n该命令创建一个名为 `test` 的新服务，将其附加到 `uber-net` 叠加网络，并根据提供的镜像创建两个副本（容器）。在两个示例中，你向容器发送了睡眠命令以保持它们运行并防止退出。\n\
  \n由于我们运行两个副本（容器），且 Swarm 有两个节点，每个副本都会调度到相应的节点上。\n\n使用 `docker service ps` 命令验证操作。\n\
  \n```\n$ docker service ps test\nID          NAME    IMAGE   NODE    DESIRED STATE\
  \  CURRENT STATE\n77q...rkx   test.1  ubuntu  node1   Running        Running\n97v...pa5\
  \   test.2  ubuntu  node2   Running        Running\n```\n\n当 Swarm 在叠加网络上启动容器时，它会自动将该网络扩展到容器所在的节点。这意味着\
  \ **uber-net** 网络现在于 `node2` 上可见。\n\n不是属于 swarm 服务的独立容器除非具有 `attachable=true` 属性，否则无法附加到叠加网络。可以使用以下命令创建一个可附加的叠加网络，使得独立容器也可以附加其中。\n\
  \n\n\n\n\n```\n$ docker network create -d overlay --attachable uber-net\n```\n\n\
  恭喜。你已经创建了一个跨越两个位于不同物理底层网络的节点的 overlay 网络。你还向其挂载了两个容器。操作起来多么简单啊！\n\n### 测试 overlay\
  \ 网络\n\n让我们使用 `ping` 命令测试该 overlay 网络。\n\n如图 12.2 所示，我们在不同的网络上拥有两个 Docker 主机，以及一个跨越这两者的单一\
  \ overlay 网络。每个节点上都连接了一个到该 overlay 网络的容器。让我们它们是否可以互相 ping。\n\n![Figure 12.2](img/figure12-2.png)\n\
  \n图 12.2\n\n你可以通过通过名称 ping 远程容器来运行测试。不过，示例将使用 IP 地址，因为这可以让我们学习如何查找容器的 IP 地址。\n\n\
  运行 `docker network inspect` 来查看分配给 overlay 的子网，以及分配给 `test` 服务中两个容器的 IP 地址。\n\n\
  ```\n$ docker network inspect uber-net\n\n    {\n        \"Name\": \"uber-net\"\
  ,\n        \"Id\": \"c740ydi1lm89khn5kd52skrd9\",\n        \"Scope\": \"swarm\"\
  ,\n        \"Driver\": \"overlay\",\n        \"EnableIPv6\": false,\n        \"\
  IPAM\": {\n            \"Driver\": \"default\",\n            \"Options\": null,\n\
  \            \"Config\": [\n                {\n                    \"Subnet\": \"\
  10.0.0.0/24\",\n                    \"Gateway\": \"10.0.0.1\"\n                }\n\
  \        \"Containers\": {\n                \"Name\": \"test.1.mfd1kn0qzgosu2f6bhfk5jc2p\"\
  ,\n                \"IPv4Address\": \"10.0.0.3/24\",\n                <Snip>\n \
  \           },\n                \"Name\": \"test.2.m49f4psxp3daixlwfvy73v4j8\",\n\
  \                \"IPv4Address\": \"10.0.0.4/24\",\n            },\n<Snip>\n```\n\
  \n为了可读性，输出经过了大量截减，但你可以看到 `uber-net` 的子网是 `10.0.0.0/24`。这与图 12.2 所示的任何物理底层网络（`172.31.1.0/24`\
  \ 和 `192.168.1.0/24`）都不匹配。你也可以看到分配给两个容器的 IP 地址。\n\n在 **node1** 和 **node2** 上运行以下两个命令。这将获取容器\
  \ ID 并确认上一个命令中的 IP 地址。在第二个命令中，请务必使用你实验环境中的容器 ID。\n\n```\n$ docker container ls\n\
  CONTAINER ID   IMAGE           COMMAND           CREATED      STATUS     NAME\n\
  396c8b142a85   ubuntu:latest   \"sleep infinity\"  2 hours ago  Up 2 hrs   test.1.mfd...\n\
  \n$ docker container inspect \\\n  --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'\
  \ 396c8b142a85\n10.0.0.3\n```\n\n在两个节点上运行这些命令以确认两个容器的 IP 地址。\n\n图 12.3 显示了目前的配置。子网和\
  \ IP 地址在你的实验环境中可能会有所不同。\n\n![Figure 12.3\n\n图 12.3\n\n如你所见，有一个跨越两个主机的二层 overlay\
  \ 网络，并且每个容器在该 overlay 网络上都有一个 IP 地址。这意味着 **node1** 上的容器将能够使用 `10.0.0.4` 地址 ping\
  \ **node2** 上的容器。尽管两个节点位于不同的二层底层网络，但这种方法仍然奏效。\n\n让我们证明这一点。\n\n登录到 **node1** 上的容器并\
  \ ping 远程容器。\n\n要在 Linux Ubuntu 容器上执行此操作，你需要安装 `ping`  way。如果你在跟随 Windows PowerShell\
  \ 示例，则 `ping` 程序已经安装。\n\n记住，容器 ID 在你的环境中是不同的。\n\nLinux 示例：\n\n```\n$ docker container\
  \ exec -it 396c8b142a85 bash\n\nroot@396c8b142a85:/# apt-get update && apt-get install\
  \ iputils-ping -y\n<Snip>\nReading package lists... Done\nBuilding dependency tree\n\
  Reading state information... Done\n<Snip>\nSetting up iputils-ping (3:20190709-3)\
  \ ...\nProcessing triggers for libc-bin (2.31-0ubuntu9) ...\n\nroot@396c8b142a85:/#\
  \ ping 10.0.0.4\nPING 10.0.0.4 (10.0.0.4) 56(84) bytes of data.\n64 bytes from 10.0.0.4:\
  \ icmp_seq=1 ttl=64 time=1.06 ms\n64 bytes from 10.0.0.4: icmp_seq=2 ttl=64 time=1.07\
  \ ms\n64 bytes from 10.0.0.4: icmp_seq=3 ttl=64 time=1.03 ms\n```\n\n\n\n\n\n在沙箱内部创建了一个名为\
  \ `Br0` 的虚拟交换机（又虚拟桥）。同时也创建了一个 VTEP，其一端连接到 `Br0` 虚拟交换机，另一端连接到主机网络栈（VTEP）。主机网络栈中的终端获取主机所在连接的底层网络（underlay\
  \ network）IP 地址，并绑定到端口 `4789` 的 UDP 套接字。如图 12.6 所示，每个主机上的两个 VTEP 通过 VXLAN 隧道创建覆盖网络（overlay）。\n\
  \n![Figure 12.6](img/figure12-6.png)\n\n图 12.6\n\n此时，VXLAN 覆盖网络已创建并准备就绪。\n\n每个容器随后获得自己的虚拟以太网适配器（`veth`），该适配器也连接到本地的\
  \ `Br0` 虚拟交换机。现在的拓扑结构如图 12.7 所示，你应该更容易看出尽管两个容器主机位于两个不同的网络，它们是如何通过 VXLAN 覆盖网络进行通信的。\n\
  \n![Figure 12.7](img/figure12-7.png)\n\n图 12.7\n\n#### 通信示例\n\n现在我们已经了解了主要的接线元素，让我们来看看这两个容器是如何通信的。\n\
  \n> **警告！**这一部分包含相当的技术性，对于日常操作来说，你不需要理解所有的细节。\n\n在这个示例中，我们将 node1 上的容器称为“C1”，node2\
  \ 上的容器称为“C2”。假设 `C1` 想要像我们在本章之前的实践示例中所做那样 ping `C2`。\n\n![Figure 12.8](img/figure12-8.png)\n\
  \n图 12.8\n\n`C1` 创建 ping 请求，并将目标 IP 地址设置为 `C2` 的 `10.0.0.4` 地址。它通过其 `veth` 接口发送流量，该接口连接到\
  \ `Br0` 虚拟交换机。虚拟交换机并不知道将数据包发送到何处，因为它的 MAC 地址表（ARP 表）中没有与目标 IP 地址对应的条目。因此，它将数据包泛洪到所有端口。连接到\
  \ `Br0` 的 VTEP 接口知道如何转发帧，因此用它自己的 MAC 地址进行响应。这是一个*代理 ARP*响应，导致 `Br0` 交换机*学习*如何转发数据包。结果是\
  \ `Br0` 更新了其 ARP 表，将 `10.0.0.4` 映射到本地 VTEP 的 MAC 地址。\n\n现在 `Br0` 交换机已经*学习*了如何向 `C2`\
  \ 转发流量，所有未来针对 `C2` 的包将直接传输到本地 VTEP 接口。VTEP 接口知道 `C2`，因为所有新启动的容器都会通过网络内置的 gossip\
  \ 协议将网络细节传播到 Swarm 中的其他节点。\n\n数据包发送到 VTEP 接口，对其进行封装以便通过底层传输基础设施发送。在较高的层面上，这种封装包括在单个以太网帧中添加\
  \ VXLAN 头部。VXLAN 头部包含 VXLAN 网络 ID (VNID)，用于将来自 VLAN 的帧映射到 VXLAN 反之亦然。每个 VLAN 都被映射到\
  \ VNID，以便数据包可以在接收端被解封装并转发到正确的 VLAN。这维持了网络隔离。\n\n封装还将帧封装在 UDP 包中，其中*目标 IP 字段*包含 node2\
  \ 上远程 VTEP 的 IP 地址，以及 UDP 端口 `4789` 套接字信息。这种封装允许数据跨底层网络发送，而无需底层网络了解任何关于 VXLAN 的信息。\n\
  \n当数据包到达 node2 时，内核看到它的地址是 UDP 端口 `4789`。内核还知道有一个绑定到此套接字的 VTEP 接口。因此，它将数据包发送到 VTEP，VTEP\
  \ 读取 VNID，解封装数据包，并将其发送到对应于 VNID 的本地 `Br0` 交换机。从那里，它被传递到容器 `C2`。\n\n女士们、先生们……这就是原生\
  \ Docker 覆盖网络利用 VXLAN 技术的方式。\n\n希望这足以让你开始任何潜在的生产环境 Docker 部署。它还应该提供所需的知识，以便你与网络团队讨论\
  \ Docker 基础设施的网络方面问题。关于与网络团队交流的话题……我建议你不要带着“我现在无晓一切 VXLAN”的想法去找他们。如果你这样做，可能会让自己难脸\
  \ ;-)\n\n最后一点。Docker 还支持在同一覆盖网络内进行第 3 层路由。例如，你可以创建一个具有两个子网的覆盖网络，Docker 将处理它们之间的路由。创建此类网络的命令可以是\
  \ `docker network create --subnet=10.1.1.0/24 --subnet=11.1.1.0/24 -d overlay prod-net`。这将在*沙箱*内部创建两个虚拟交换机\
  \ `Br0` 和 `Br1`，并默认进行路由。\n\n#### Docker 覆盖网络 - 命令\n\n- `docker network create` 是我们用于创建新容器网络的命令。`-d`\
  \ 标志允许你指定要使用的驱动程序，最常用的驱动是 `overlay` 驱动。你也可以指定*远程*驱动程序。\n\n\n\n\n\n有一种流行的观点认为容器并不适合需要持久化数据的状态化应用。这在几年前确实如此。然而，情况正在发生变化，现在的技术已经使容器成为许多状态化应用的可行选择。\n\
  \n我是在说容器是所有状态化应用的最佳解决方案吗？不是。但是，我们即将看到容器处理持久化数据和非持久化数据的一些方法，你可能会发现它们与虚拟机之间并没有太大区别。\n\
  \n我们将从非持久化数据开始。\n\n## 容器与非持久化数据\n\n容器的设计初衷是不可变的（immutable）。这只是一个流行术语，意味着只读——在部署后不更改容器的配置是一项最佳实践。如果某些部分出现故障或你需要更改某些内容，你应该创建一个包含修复程序或更新的新容器，并用它来替换旧容器。你不应该登录到运行中的容器并进行配置更改！\n\
  \n然而，许多应用程序需要一个读写文件系统才能运行——它们甚至在只读文件系统上无法运行。这意味着将容器完全设为只读并不是简单的。每个 Docker 容器都是通过在其基础上的只读镜像之上添加一个薄的读写层而创建的。图\
  \ 13.1 显示了两个运行中的容器共享同一个只读镜像。\n\n![Figure 13.1 Ephemeral container storage](img/figure13-1.png)\n\
  \n图 13.1 临时容器存储\n\n可写容器层存在于 Docker 宿机的文件系统中，你会听到它被称为各种名称。包括 `local storage`（本地存储）、`ephemeral\
  \ storage`（临时存储）和 `graphdriver storage`（图形驱动存储）。它们通常位于 Docker 宿机的以下位置：\n\n*   Linux\
  \ Docker 主机：`/var/lib/docker/<storage-driver>/...`\n*   Windows Docker 主机：`C:\\\
  ProgramData\\Docker\\windowsfilter\\...`\n\n这个薄的可写层是容器的一部分，实现了所有的读写操作。如果你或应用程序更新了文件或添加了新文件，它们将被写入此层。然而，它与容器的生命周期紧密耦合——在容器创建时创建，在容器删除时被删除。它随容器一起删除的事实意味着它不是你需要保留（持久化）的重要数据的选择。\n\
  \n如果你的容器不创建持久化数据，那么这个薄的 `local storage` 可写层层就足够了，你可以正常使用。但如果你的容器需要持久化数据，那么你需要阅读下一节。\n\
  \n在进入下一节之前，最后说一点。\n\n这种本地存储的可写层由每个 Docker 宿主机上的存储驱动程序管理（不要与卷驱动程序 volume driver 混淆）。如果你在\
  \ Linux 生产环境中运行 Docker，你需要确保正确的存储驱动程序与 Docker 宿主机上的 Linux 发行版匹配。参考以下列表：\n\n*   **Red\
  \ Hat Enterprise Linux（红帽企业级 Linux）：** 对于运行 Docker 17.06 或更高版本的现代 RHEL，使用 `overlay2`\
  \ 驱动。对于旧版本使用 `devicemapper` 驱动。这适用于 Oracle Linux 以及其他与红帽相关的上游和下游发行版。\n*   **Ubuntu：**\
  \ 使用 `overlay2` 或 `aufs` 驱动。如果你使用 Linux 4.x 或更高内核，应选择 `overlay2`。\n*   **SUSE Linux\
  \ Enterprise Server：** 使用 `btrfs` 存储驱动。\n*   **Windows：** Windows 只有一个驱动，并且是默认配置的。\n\
  \n## 容器与持久化数据\n\n`Volumes`（卷）是容器中持久化数据的推荐方式。这有三个主要原因：\n\n*   卷是独立对象，不与容器的生命周期绑定\n\
  *   卷可以映射到专门的外部存储系统\n*   卷允许不同 Docker 宿主机上的多个容器访问并共享相同的数据\n\n从高层次来看，你先创建一个卷，然后创建一个容器并将卷挂载到其中。卷被挂载到容器文件系统中的一个目录，写入该目录的任何内容都存储在卷中。如果你删除了容器，卷及其数据仍然存在。\n\
  \n图 13.2 显示了 Docker 卷作为一个独立对象存在于容器之外。它被挂载到容器文件系统的 `/data` 目录，任何写入 `/data` 目录的数据都将存储在卷中，并在容器删除后仍然存在。\n\
  \n![Figure 13.2 High-level view of volumes and containers](img/figure13-2.png)\n\
  \n图 13.2 卷和容器的高级视图\n\n在图 13.2 中，`/data` 目录是一个 Docker 卷，它可以映射到外部存储系统或 Docker 宿主机上的目录。无论采取何种方式，它的生命周期都与容器解耦。容器中的所有其他目录都使用\
  \ Docker 宿主机本地存储区域的薄可写容器层。\n\n从卷到 `/data` 目录的箭头显示为虚线，表示卷与容器之间的解耦关系。\n\n### 创建和管理\
  \ Docker 卷\n\n卷是 Docker 中的一等公民。除其他外，这意味着它们在 API 中是自己的对象，并有自己的 `docker volume` 子命令。\n\
  \n使用以下命令创建一个名为 `myvol` 的新卷。\n\n```\n$ docker volume create myvol\nmyvol\n```\n\n\
  默认情况下，Docker 使用内置的 `local` 驱动创建新卷。正如名称所示，使用 `local` 驱动创建的卷仅对与卷位于同一节点的容器可用。你可以使用\
  \ `-d` 标志来指定不同的驱动。\n\n第三方卷驱动以插件的形式提供。它们让 Docker 无缝访问外部存储系统，如云服务。这在图 13.3 中所示。\n\n\
  ![Figure 13.3 Plugging external storage into Docker](img/figure13-3.png)\n\n图 13.3\
  \ 外部接入 Docker\n\n我们将在后续章节中查看第三方驱动的示例。现在卷已经创建了，你可以通过 `docker volume ls` 命令查看它，通过\
  \ `docker volume inspect` 命令检查它。\n\n```\n$ docker volume ls\nDRIVER            \
  \  VOLUME NAME\nlocal               myvol\n\n$ docker volume inspect myvol\n[\n\
  \    {\n        \"CreatedAt\": \"2020-05-02T17:44:34Z\",\n        \"Driver\": \"\
  local\",\n        \"Labels\": {},\n        \"Mountpoint\": \"/var/lib/docker/volumes/myvol/_data\"\
  ,\n        \"Name\": \"myvol\",\n        \"Options\": {},\n        \"Scope\": \"\
  local\"\n    }\n]\n```\n\n注意 `Driver` 和 `Scope` 都是 `local`。这意味着卷是用 `local` 驱动创建的，且仅对该\
  \ Docker 主机可用。`Mountpoint` 属性告诉我们卷在 Docker 宿主机文件系统的的位置。\n\n所有使用 `local` 驱动创建的卷在\
  \ Linux 上都在 `/var/lib/docker/volumes` 下有自己的目录，在 Windows 上在 `C:\\ProgramData\\Docker\\\
  volumes` 下。这意味着你可以在宿主机的文件系统中看到它们。你甚至可以从宿主机直接访问它们，尽管这通常并不推荐。我们在 Docker Compose 章节中展示过这种示例——我们将文件直接复制到卷的目录中，文件立即出现在容器内部的卷中。\n\
  \n现在卷已经创建，它可以被一个或多个容器使用。我们稍后会看到用法示例。\n\n删除 Docker 卷有两种方法：\n\n*   `docker volume\
  \ prune`\n*   `docker volume rm`\n\n`docker volume prune` 将删除所有未挂载到容器或服务副本的卷，**请谨慎使用！**\
  \ `docker volume rm` 允许你指定要删除的卷。任何一个命令都不会删除正在被使用的卷。\n\n由于 `myvol` 卷未被使用，请使用 `prune`\
  \ 命令将其删除。\n\n\n\n\n\n```\n$ docker volume prune\n\nWARNING! This will remove all\
  \ volumes not used by at least one container.\nAre you sure you want to continue?\
  \ [y/N] y\n\nDeleted Volumes:\nmyvol\nTotal reclaimed space: 0B\n```\n\n恭喜，你已经创建、检查并删除了一个\
  \ Docker 卷。而且你是在没有与容器交互的情况下完成这一切的。这了卷的独立性。\n\n此时，你已经掌握了创建、列出、检查和删除 Docker 卷的所有命令。然而，你也可以通过\
  \ Dockerfile 使用 `VOLUME` 指令来部署卷。格式为 `VOLUME <container-mount-point>`。有趣的是，在 Dockerfile\
  \ 中定义卷时，你无法指定宿主机上的目录。这是因为*主机*目录取决于你的 Docker 宿主机运行的操作系统——如果你在 Docker 宿主机上指定了一个不存在的目录，可能会破坏你的构建过程。因此，在\
  \ Dockerfile 中定义卷需要你在部署时指定主机目录。\n\n## 使用容器和服务来演示卷\n\n让我们来看看如何在容器和服务中使用卷。\n\n这些示例将源自一个没有预存卷的系统，我们演示的所有内容都适用于\
  \ Linux 和 Windows。\n\n使用以下命令创建一个挂载了名为 `bizvol` 卷的新独立容器。\n\n**Linux 示例：**\n\n```\n\
  $ docker container run -dit --name voltainer \\\n    --mount source=bizvol,target=/vol\
  \ \\\n    alpine\n```\n\n**Windows 示例：**\n\n所有的 Windows 示例均使用 PowerShell，并注意使用反引号（``\
  \ ` ``）将命令分成多行。\n\n```\n> docker container run -dit --name voltainer `\n    --mount\
  \ source=bizvol,target=c:\\vol `\n    mcr.microsoft.com/powershell:nanoserver\n\
  ```\n\n该命令使用 `--mount` 标志将名为“bizvol”的卷挂载到容器的 `/vol` 或 `c:\\vol` 中。尽管系统中没有名为 `bizvol`\
  \ 的卷，该命令仍然成功完成。这引出了一个有趣的点：\n\n- 如果你指定了一个存在的卷，Docker 将使用该现有卷\n- 如果你指定了一个不存在的卷，Docker\
  \ 将为你创建它\n\n在这种情况下，`bizvol` 不存在，因此 Docker 创建了它并将其挂载到新容器中。这意味着你将能够通过 `docker volume\
  \ ls` 看到它。\n\n```\n$ docker volume ls\nDRIVER              VOLUME NAME\nlocal  \
  \             bizvol\n```\n\n虽然容器和卷有独立的生命周期，但你无法删除正在被容器使用的卷。试一下。\n\n```\n$ docker\
  \ volume rm bizvol\nError response from daemon: remove bizvol: volume is in use\
  \ - [b44d3f82...dd2029ca]\n```\n\n该卷是全新的，所以它没有任何任何数据。让我们 `exec` 进入容器并向其写入一些数据。引用的示例是\
  \ Linux，如果你在 Windows 上操作，只需将命令末尾的 `sh` 替换为 `pwsh.exe`。所有其他命令在 Linux 和 Windows 上均可工作。\n\
  \n```\n$ docker container exec -it voltainer sh\n\n/# echo \"I promise to write\
  \ a review of the book on Amazon\" > /vol/file1\n\n/# ls -l /vol\ntotal 4\n-rw-r--r--\
  \ 1 root  root   50 Jan 12 13:49 file1\n\n/# cat /vol/file1\nI promise to write\
  \ a review of the book on Amazon\n```\n\n输入 `exit` 返回 Docker 宿主机的 shell，然后使用以下命令删除容器。\n\
  \n```\n$ docker container rm voltainer -f\nvoltainer\n```\n\n即使容器被删除了，卷仍然存在：\n\n\
  ```\n$ docker container ls -a\nCONTAINER ID     IMAGE    COMMAND    CREATED    \
  \   STATUS\n\n$ docker volume ls\nDRIVER              VOLUME NAME\nlocal       \
  \        bizvol\n```\n\n由于卷仍然存在，你可以查看它在主机上的挂载点，以检查数据是否还在。\n\n从 Docker 宿主机的终端运行以下命令。第一个命令将显示文件仍然存在，第二个命令将显示文件的内容。\n\
  \n如果你在 Windows 上操作，请务必使用 `C:\\ProgramData\\Docker\\volumes\\bizvol\\_data` 目录。此外，此步骤在\
  \ Docker Desktop for Mac 和 Windows 10 上无效。这是因为 Docker Desktop 在虚拟机内部运行 Docker，而卷数据目录存在于虚拟机内部。\n\
  \n```\n$ ls -l /var/lib/docker/volumes/bizvol/_data/\ntotal 4\n-rw-r--r-- 1 root\
  \ root 50 Jan 12 14:25 file1\n\n$ cat /var/lib/docker/volumes/bizvol/_data/file1\n\
  I promise to write a review of the book on Amazon\n```\n\n太好了，卷和数据仍然存在。\n\n甚至可以将\
  \ `bizvol` 卷挂载到新的服务或容器中。以下命令创建一个新的 Docker 服务，名为 hellcat，并将 bizvol 挂载到服务副本的 `/vol`\
  \ 处。你需要运行在 swarm 模式下此命令才能生效。如果你运行在单引擎模式下，可以使用 `docker container run` 命令代替。\n\n```\n\
  $ docker service create \\\n  --name hellcat \\\n  --mount source=bizvol,target=/vol\
  \ \\\n  alpine sleep 1d\n\noverall progress: 1 out of 1 tasks\n1/1: running   [====================================]\n\
  ```\n\n由于没有指定 `--replicas` 标志，所以只部署了一个服务副本。查看它运行在 Swarm 的哪个节点上。\n\n```\n$ docker\
  \ service ps hellcat\nID         NAME         NODE      DESIRED STATE     CURRENT\
  \ STATE\nl3nh...    hellcat.1    node1     Running           1 seconds ago\n```\n\
  \n在本示例中，副本运行在 `node1` 上。登录 `node1` 并获取副本容器的 ID。\n\n```\nnode1$ docker container\
  \ ls\nCTR ID     IMAGE             COMMAND       STATUS        NAMES\ndf6..a7b \
  \  alpine:latest     \"sleep 1d\"    Up 25 secs    hellcat.1\n```\n\n注意容器名称是服务名、副本数和\
  \ ID 的组合。\n\n进入容器并检查 `/vol` 中是否存在数据。我们将使用服务副本的容器 ID。如果你在 Windows 上操作，记得将 `sh` 替换为\
  \ `pwsh.exe`。\n\n```\nnode1$ docker container exec -it df6 sh\n\n/# cat /vol/file1\n\
  I promise to write a review of the book on Amazon\n```\n\n完美，卷保留了原始数据并供新容器使用。\n\n\
  我想是时候去 Amazon 写那篇书评了 :-D\n\n## 跨节点共享存储\n\n将外部存储系统集成到 Docker 中使得节点之间共享卷成为可能。这些外部系统可以是云存储服务，也可以是数据中心的企业存储系统。例如，单个存储\
  \ LUN 或 NFS 共享可以呈现给多个 Docker 主机，从而供容器和服务副本使用，无论它们运行在哪个 Docker 主机上。图 13.4 显示了单个外部共享卷呈现给两个\
  \ Docker 节点。这些 Docker 节点可以将该卷提供给其中一个或两者。\n\n13.4\n\n（占位符）\n\n构建这样的设置需要很多条件。你需要访问特殊的存储系统并了解其工作原理以及如何呈现存储。你还需要知道应用程序如何向共享存储读写数据。最后，你需要与外部存储系统兼容的卷插件。\n\
  \nDocker Hub 是寻找卷插件的好地方。登录 Docker Hub，选择显示 `plugins` 而不是 `containers` 的视图，并过滤结果仅显示\
  \ `Volume` 插件。一旦找到了适用于你存储系统的插件，创建它可能需要的任何配置文件，并使用 `docker plugin install` 进行安装。\n\
  \n插件注册后，你可以使用 `-d` 标志通过 `docker volume create` 从存储系统创建新卷。\n\n\n\n\n以下示例演示了如何安装 Pure\
  \ Storage Docker 卷插件。该插件提供了对 Pure Storage FlashArray 或 FlashBlade 存储系统上卷的访问。插件仅适用于正确的外部存储系统。\n\
  \n1. Pure Storage 插件要求在 Docker 宿机的 `/etc/pure-docker-plugin/` 目录下有一个名为 `pure.json`\
  \ 的配置文件。该文件包含了插件定位外部存储系统、进行身份验证和访问资源所需的信息。\n\n2. 安装插件并授予所需的权限。\n\n```\n $ docker\
  \ plugin install purestorage/docker-plugin:latest --alias pure --grant-all-permissions\n\
  \  Plugin \"purestorage/docker-plugin:3.8\" is requesting the following privileges:\n\
  \   - network: [host]\n   - host pid namespace: [true]\n   - mount: [/etc/pure-docker-plugin/pure.json]\n\
  \   - mount: [/dev]\n   - mount: [/sys]\n   - allow-all-devices: [true]\n   - capabilities:\
  \ [CAP_SYS_ADMIN CAP_SYS_PTRACE]\n  Do you grant the above permissions? [y/N] y\n\
  ```\n\n1. 列出可用的插件。\n\n```\n $ docker plugin ls\n  ID                  NAME     \
  \           DESCRIPTION                      ENABLED\n  6b5e61aefbb3        pure:latest\
  \         Pure Storage plugin for Docker   true\n```\n\n1. 使用插件创建一个新卷（你也可以在容器创建过程中执行此）。此示例在注册的\
  \ Pure Storage 后端创建一个名为“fastvol”的 25GB 新卷。\n\n```\n $ docker volume create -d pure\
  \ -o size=25GB fastvol\n  fastvol\n```\n\n不同的存储驱动程序支持不同的选项，但这些足够让你了解它们的工作原理了。\n\n\
  ### 潜在的数据损坏\n\n任何在多个容器之间共享单个卷的配置，一个主要的担忧就是`数据损坏`。\n\n假设基于图 13.4 有以下示例。\n\n运行在 `node-1`\
  \ 上的 `ctr-1` 应用程序更新了共享卷中的某些数据。然而，它并没有直接将更新写入卷中，而是将其保留在本地缓冲区中以便快速调取（这在许多操作系统中都是很常见的）。此时，`ctr-1`\
  \ 中的应用程序认为数据已经写入卷中。但是，在 `node-1` 上的 `ctr-1` 刷新缓冲区并将数据提交到卷之前，`node-2` 上的 `ctr-2`\
  \ 应用程序使用不同的值更新了相同的数据并将其直接提交到卷。此时，两个应用程序都*认为*它们已经更新了卷中的数据，但实际上只有 `ctr-2` 中的应用程序更新了。几秒后，`node-1`\
  \ 上的 `ctr-1` 将数据刷新到卷中，覆盖了 `ctr-2` 应用程序所做的更改。然而，`ctr-2` 中的应用程序完全不知道这一点！这就是数据损坏发生的方式之一。\n\
  \n为了防止这种情况，你需要以避免此类问题发生的方式来编写你的应用程序。\n\n### 卷和持久化数据 - 命令\n\n* `docker volume create`\
  \ 是我们用于创建新卷的命令。默认情况下，卷使用 `local` 驱动创建，但你可以使用 `-d` 标记来指定不同的驱动程序。\n\n* `docker volume\
  \ ls` 将列出本地 Docker 宿主机所有的卷。\n\n* `docker volume inspect` 显示卷的详细信息。使用此命令可以查看许多有趣的卷属性，包括卷在\
  \ Docker 宿主机文件系统中的位置。\n\n* `docker volume prune` 将删除`所有`未被容器或服务副本使用的卷。**请谨慎使用！**\n\
  \n* `docker volume rm` 删除未使用的特定卷。\n\n* `docker plugin install` 将从 Docker Hub 安装新的卷插件。\n\
  \n* `docker plugin ls` 列出安装在 Docker 宿主机上的所有插件。\n\n## 章节总结\n\n数据有两种主要类型：持久化数据和非持久化数据。持久化数据是你需要保留的数据，非持久化数据是你不需要保留的数据。默认情况下，所有容器都会获得一个可写的非持久化存储层，该层随容器的产生而消失——我们称之为`local\
  \ storage`，它对于非持久化数据是理想的。然而，如果容器创建了你需要保留的数据，你应该将数据存储在 Docker 卷中。\n\nDocker 卷是 Docker\
  \ API 中的一等公民，通过它们自己的 `docker volume` 子命令独立于容器进行管理。这意味着删除容器不会删除它正在使用的卷。\n\n第三方卷插件可以提供\
  \ Docker 访问特定的外部存储系统。它们通过 `docker plugin install` 命令从 Docker Hub 安装，并在创建卷时使用 `-d`\
  \ 标记进行引用。\n\n卷是在 Docker 环境中处理持久化数据的推荐方式。\n\n# 14: 使用 Docker Stacks 部署应用\n\n大规模地部署和管理由许多小型集成服务的云原生微服务应用是很困难的。\n\
  \n幸运的是，Docker Stacks 的出现提供了帮助。它们通过提供：*期望状态、滚动更新、简单的伸缩操作、健康检查*等功能简化了应用管理！这一切都封装在一个精美的声明式模型中。太棒了\n\
  \n如果这些术语对你来说很新或听起来很复杂，不要担心，在章节结束时你将理解它们的所有。\n\n我们将本章分为通常三个部分：\n\n* TLDR（要点版）\n*\
  \ 深度解析\n* 命令\n\n## 使用 Docker Stacks 部署应用 - TLDR\n\n在你的笔记本电脑上测试和部署简单应用很容易的，但那是业余者的工作。在真实环境中部署和管理多服务应用——那是专业人士的工作！\n\
  \n幸运的是，stacks 的出现提供了帮助！它们让你允许在单个文件中定义复杂的多服务应用。它们还提供了一种简单的方法来部署应用并管理其整个周期——初始部署 >\
  \ 健康检查 > 伸缩 等！\n\n过程非常简单。在 `Compose` 文件中定义应用的期望状态，然后使用 `stack` 命令进行部署和管理。就是这样。\n\
  \n该 文件包含了组成应用的整个微服务栈。它还包含了应用所需的所有卷、网络、密钥和其他基础设施。使用 `docker stack deploy` 命令从单文件部署整个应用。为了实现这一切，stacks\
  \ 构建在 Docker Swarm 之上，这意味着你获得了 Swarm 的所有安全和高级功能。\n\n总之，Docker 非常适用于开发和测试。Docker\
  \ Stacks 非常适用于生产。\n\n## 使用 Docker Stacks 部署应用 - 深度解析\n\n如果你熟悉 Docker Compose，你会发现\
  \ Docker Stacks 非常简单。事实上，在很多方面，stacks 是我们一直希望 Compose 能具备的——完全集成到 Docker 并能够管理应用的整个周期。\n\
  \n从架构上说，stacks 位于 Docker 应用层次结构的顶层。它们构建在*服务*之上，而服务又构建在容器之上。\n\n我们将本节内容划分如下：\n\n\
  * 应用概述\n* 深入栈文件\n* 部署应用\n* 管理应用\n\n### 应用概述\n\n在章的剩余部分，我们将使用流行的 **AtSea Shop** 演示应用。它位于\
  \ [GitHub](https://github.com/dockersamples/atsea-sample-app) 上，并根据 [Apache 2.0\
  \ 许可证](https://github.com/dockersamples/atsea-sample-app/blob/master/LICENSE) 开源。\n\
  \n我们使用这个应用是因为它中等复杂，但不会大到无法在书中列出和描述。在底层，这是一个云原生微服务应用，利用了证书和密钥。高层应用架构如图 14.1 所示。\n\
  \n![Figure 14.1 AtSea Shop high level architecture](img/figure14-1.png)\n\nFigure\
  \ 14.1 AtSea Shop high level architecture\n\n\n\n如你所见，它包含了 5 个 `Services`（服务）、3\
  \ 个网络、4 个 `secrets`（密钥）和 3 个端口映射。当我们检查堆栈文件（stack file）时，将详细查看其中的每一个项。\n\n> **注意：**\
  \ 在本文中提到 `services` 时，我们指的是 Docker 服务对象，它是在 Swarm 集群上作为单个对象管理的一个或多个相同容器。\n\n克隆应用程序的\
  \ GitHub 仓库，以便在你的本地机器拥有该程序的所有源文件。\n\n```\n$ git clone https://github.com/dockersamples/atsea-sample-shop-app.git\n\
  Cloning into 'atsea-sample-shop-app'...\nremote: Enumerating objects: 30, done.\n\
  remote: Counting objects: 100% (30/30), done.\nremote: Compressing objects: 100%\
  \ (30/30), done.\nremote: Total 672 (delta 20), reused 0 (delta 0), pack-reused\
  \ 642\nReceiving objects: 100% (672/672), 7.29 MiB | 1.46 MiB/s, done.\nResolving\
  \ deltas: 100% (217/217), done.\n```\n\n该应用程序由多个目录和源文件组成。你可以自由探索它们。然而，我们将重点关注定义应用及其要求的\
  \ `docker-stack.yml` 文件。我们将其称为*堆栈文件*。\n\n在最高层级，它定义了 4 个顶层键。\n\n```\nversion:\nservices:\n\
  networks:\nsecrets:\n```\n\n`Version` 表示 Compose 文件格式的版本。这必须是 3.0 或更高版本才能与 stacks\
  \ 工作。`Services` 是你定义构成应用程序的服务栈的地方。`Networks` 列出了所需的网络，而 `secrets` 定义了应用程序使用的密钥。\n\
  \n如果你展开每个顶层键，将看到它们是如何映射到图 14.1 的。堆栈文件包含五个名为“reverse_proxy”、“database”、“appserver”、“visualizer”和“payment_gateway”的服务。图\
  \ 14.1 也是如此。堆栈文件包含三个名为“front-tier”、“back-tier”和“payment”的网络。图 14.1 也是如此。最后，堆栈文件包含四个名为“postgres_password”、“staging_token”、“revprox_key”和“revprox_cert”的密钥。图\
  \ 14.1 也是如此。\n\n```\nversion: \"3.2\"\nservices:\n    reverse_proxy:\n    database:\n\
  \    appserver:\n    visualizer:\n    payment_gateway:\nnetworks:\n    front-tier:\n\
  \    back-tier:\n    payment:\nsecrets:\n    postgres_password:\n    staging_token:\n\
  \    revprox_key:\n    revprox_cert:\n```\n\n理解堆栈文件捕捉并定义了整个应用程序的许多要求是非常重要的。因此，它是自文档化的，是弥接开发（dev）与运维（ops）差距的极佳工具。\n\
  \n让我们仔细查看堆栈文件的每个部分。\n\n### 深入查看堆栈文件\n\n堆栈文件与 Compose 文件非常相似。唯一的要求是 `version:` 键指定的值为“3.0”或更高。请参考\
  \ [Docker 文档](https://docs.docker.com/compose/compose-file/) 获取有关 Compose 文件版本的最新信息以及与你的\
  \ Docker 版本的兼容性。\n\nDocker 从堆栈文件部署应用时执行要操作之一是创建 `networks` 键下列出的任何所需网络。如果网络不存在，Docker\
  \ 将创建它们。\n\n让我们看看堆栈文件中定义的网络。\n\n#### Networks\n\n```\nnetworks:\n  front-tier:\n\
  \  back-tier:\n  payment:\n    driver: overlay\n    driver_opts:\n      encrypted:\
  \ 'yes'\n```\n\n堆栈文件描述了三个网络：`front-tier``back-tier` 和 `payment`。默认情况下，它们都由 `overlay`\
  \ 驱动程序创建为 overlay 网络。但 `payment` 网络是特殊的——它需要加密的数据平面。\n\n正如在 overlay 网络章节中所提到的，所有\
  \ overlay 网络的控制平面默认都是加密的，但你必须显式加密数据平面。控制平面用于网络管理流量，而数据平面用于应用流量。加密数据平面具有潜在的性能开销。\n\
  \n要加密数据平面，你有两个选择：\n\n*   向 `docker network create` 命令传递 `-o encrypted` 标志。\n*  \
  \ 在堆栈文件的 `driver_opts` 下指定 `encrypted: 'yes'`。\n\n加密数据平面产生的开销取决于多种因素，例如流量类型和流量流。你应该进行大量的测试，以了解加密数据平面流量对你的工作负载所产生的性能开销。这种开销约为\
  \ 10% 并不罕见。\n\n如前所述，所有三个网络将在密钥和服务之前被创建。\n\n让我们看看密钥。\n\n#### Secrets\n\n密钥被定义为顶层对象，我们正在使用的堆栈文件定义了四个：\n\
  \n```\nsecrets:\n  postgres_password:\n    external: true\n  staging_token:\n  \
  \  external: true\n  revprox_key:\n    external: true\n  revprox_cert:\n    external:\
  \ true\n```\n\n注意，所有四个都被定义为 `external`（外部）。这意味着它们必须已经存在。这意味着在部署堆栈之前，它们必须已经存在。\n\n\
  #### Services\n\n服务是大部分操作发生的地方。每个服务都是包含许多内容的 JSON 集合（字典）。我们将逐一检查每个服务并解释作用。\n\n#####\
  \ reverse_proxy 服务\n\n如你所示，`reverse_proxy` 服务定义了镜像、端口、密钥和网络。\n\n```\nreverse_proxy:\n\
  \  image: dockersamples/atsea-sample-shop-app_reverse_proxy\n  ports:\n    - \"\
  80:80\"\n    - \"443:443\"\n  secrets:\n    - source: revprox_cert\n      target:\
  \ revprox_cert\n    - source: revprox_key\n      target: revprox_key\n  networks:\n\
  \    - front-tier\n```\n\n`image` 键是必需键。正如名称所示，它定义了用于构建副本的 Docker 镜像。Docker 有自己的倾向，除非另有指定，否则**镜像**将从\
  \ Docker Hub 拉取。你可以通过在镜像名称前加上仓库端点的 DNS 名称（例如 Google 容器的 `gcr.io`）来指定第三方仓库的镜像。\n\n\
  Docker Stacks 和 Docker Compose 之间的区别之一是 stacks 不支持 **builds**（构建）。这意味着在部署堆栈之前必须构建所有镜像。\n\
  \n**ports** 键定义了两个：\n\n*   `80:80` 将集群的 80 端口映射到每个服务副本的 80 端口。\n*   `443:443` 将集群的\
  \ 443 端口映射到每个服务副本的 443 端口。\n\n默认情况下，所有端口都使用*ingress mode*映射。这意味着它们将在集群中的每个节点上映射并可访问——即使是不运行副本的节点也是如此。替代方案是\
  \ *host mode*，端口仅在运行该服务副本的集群节点上映射。然而，*host mode* 要求你使用长格式语法。例如，使用长格式语法在 *host mode*\
  \ 下映射 80 端口如下：\n\n```yaml\nports:\n  target: 80\n  published: 80\n  mode: host\n\
  ```\n\n推荐使用长格式，因为它更易读且更强大（支持 ingress mode **和** host mode）。**secrets** 键定义了两个密钥——`revprox_cert`\
  \ 和 `revprox_key`。这些密钥必须在集群中存在，并在堆栈文件的 `secrets` 部分中定义。\n\n\n\n密钥（Secrets）以普通文件的形式挂载到服务副本中。文件名将取决于你在堆栈文件中指定的\
  \ `target` 值，该文件将出现在 Linux 副本的 `/run/secrets` 目录下，以及 Windows 上的 `C:\\ProgramData\\\
  Docker\\secrets` 目录。Linux 将 `/run/secrets` 挂载为内存文件系统，但 Windows 则没有。\n\n此服务中定义的密钥将挂载到每个服务副本中，分别为\
  \ `/run/secrets/revprox_cert` 和 `/run/secrets/revprox_key`。要将其中一个挂载为 `/run/secrets/uber_secret`，你需要在堆栈文件中如下定义：\n\
  \n```\nsecrets:\n  - source: revprox_cert\n    target: uber_secret\n```\n\n`networks`\
  \ 键确保该服务的所有副本都连接到 `front-tier` 网络。此处指定的网络必须在顶层键 `networks` 中定义，如果该网络尚不存在，Docker\
  \ 将会其作为覆盖网络（overlay）创建。\n\n## 数据库服务 (database)\n\n数据库服务也定义了：镜像、网络和一个密钥。此外，它还引入了环境变量和部署约束。\n\
  \n```\ndatabase:\n  image: dockersamples/atsea_db\n  environment:\n    POSTGRES_USER:\
  \ gordonuser\n    POSTGRES_DB_PASSWORD_FILE: /run/secrets/postgres_password\n  \
  \  POSTGRES_DB: atsea\n  networks:\n    - back-tier\n  secrets:\n    - postgres_password\n\
  \  deploy:\n    placement:\n      constraints:\n        - 'node.role == worker'\n\
  ```\n\n`environment` 键允许你在运行时向服务副本中注入环境变量。该服务使用三个环境变量来定义数据库用户、数据库密码的位置（一个挂载到每个服务副本的密钥）以及数据库名称。\n\
  \n```\nenvironment:\n  POSTGRES_USER: gordonuser\n  POSTGRES_DB_PASSWORD_FILE: /run/secrets/postgres_password\n\
  \  POSTGRES_DB: atsea\n```\n\n一个更好、更安全的解决方案是将所有三个值都作为密钥传递，因为这可以避免在明文变量中记录数据库名称和数据库用户。\n\
  \n该服务在 `deploy` 键下还定义了一个“部署约束”（placement constraint）。这确保了该服务的副本始终运行在 Swarm 的 `worker`\
  \ 节点上。\n\n```\ndeploy:\n  placement:\n    constraints:\n      - 'node.role == worker'\n\
  ```\n\n部署约束是影响调度决策的一种极方法。Swarm 目前允许你针对以下条件进行调度：\n\n* 节点 ID。`node.id == o2p4kw2uuw2a`\n\
  * 节点名称。`node.hostname == wrk-12`\n* 角色。`node.role != manager`\n* 引擎标签。`engine.labels.operatingsystem==ubuntu\
  \ 16.04`\n* 自定义节点标签。`node.labels.zone == prod1`\n\n注意 `==` 和 `!=` 都是支持的。\n\n## 应用服务器服务\
  \ (appserver)\n\n`appserver` 服务使用镜像，连接到三个网络并挂载了一个密钥。它在 `deploy` 键下还引入了若干项额外功能。\n\
  \n```\nappserver:\n  image: dockersamples/atsea_app\n  networks:\n    - front-tier\n\
  \    - back-tier\n    - payment\n  deploy:\n    replicas: 2\n    update_config:\n\
  \      parallelism: 2\n      failure_action: rollback\n    placement:\n      constraints:\n\
  \        - 'node.role == worker'\n    restart_policy:\n      condition: on-failure\n\
  \      delay: 5s\n      max_attempts: 3\n      window: 120s\n  secrets:\n    - postgres_password\n\
  ```\n\n让我们仔细观察 `deploy` 键下的新内容。\n\n`deploy` 键下的新内容允许配置部署策略。例如 `replicas: 2` 定义了副本数量。`update_config`\
  \ 定义了并行度（`parallelism: 2`）和失败动作（`failure_action: rollback`）。`placement.constraints`\
  \ 定义了约束（`node.role == worker`）。`restart_policy` 定义了重启策略：在失败时重启（`condition: on-failure`）、延迟（`delay:\
  \ 5s`）、最大尝试次数（`max_attempts: 3`）以及窗口期（`window: 120s`）。`secrets` 则列出了所需的密钥。\n\n（注：原文后续中关于\
  \ `deploy` 键的描述似乎存在逻辑混乱或文本错位，此处仅按原文字面意思翻译）\n\n`deploy` 键下的新内容允许配置部署策略。例如 `replicas:\
  \ 2` 定义了副本数量。`update_config` 定义了并行度（`parallelism: 2`）和失败动作（`failure_action: rollback`）。`placement.constraints`\
  \ 定义了约束（`node.role == worker`）。`restart_policy` 定义了重启策略：在失败时重启（`condition: on-failure`）、延迟（`delay:\
  \ 5s`）、最大尝试次数（`max_attempts: 3`）以及窗口期（`window: 120s`）。`secrets` 则列出了所需的密钥。\n\n`deploy`\
