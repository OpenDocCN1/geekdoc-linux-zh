    # Task: Replace Text


    There are several commands in VIM that enable you to replace, or overwrite, text.
    Replacing text is often more efficient than deleting and then inserting new text.
    Replacing text involves another VIM mode, called Replace mode. Replace mode is
    somewhat different than Insert mode. If you enter text in the middle of a line
    in Insert mode, the new text is inserted into the old text at the cursor. If you
    enter text in the middle of line in Replace mode, the old text is overwritten
    by one character.


    Use the r command to replace text one character at a time. In Normal mode, place
    the cursor over the character you want to replace, and type r, followed by the
    character that should replace the original character. For example, in the line:


