  md: '# Using the GNOME Desktop Environment


    # Getting GNOME


    If you select GNOME as one of the package groups to install in Hour 2, “Installing
    Red Hat Linux 7.0,” you’re all ready to go. Red Hat uses GNOME as the default
    desktop environment, so as you start X, GNOME starts by default. If you didn''t
    select GNOME in Hour 2, there are three different ways to install GNOME on your
    system:


    +   - Run the GNOME installation program again, select Upgrade as the installation
    type, and then select GNOME as the package group to upgrade.


    +   - Visit http://www.helixcode.com and install Helix Code GNOME directly from
    the Web.


    +   - Install each GNOME package individually, either from the CD-ROM or from
    the Helix Code Web site.


    ![](img/8a0e42659a358d95f558285b9f5bf854_133_0.png)


    > Helix Code is a commercial company founded by Miguel de Icaza, founder of the
    GNOME project. Helix Code GNOME is updated more often than the packages found
    in the Red Hat distribution, and is much easier to install and upgrade. Even if
    you would like to use the version of GNOME found in the Red Hat distribution,
    visit the Helix site to download GNOME Office and other useful GNOME applications.


    If you really want to install the packages individually, you can, although it’s
    hard work (there are about fifteen packages). For instructions, see www.helixcode.com,
    or read Sams Teach Yourself GNOME in 24 Hours.


    # Starting GNOME


    Starting GNOME in Red Hat is simple. Because GNOME is the default Red Hat environment,
    all you have to do is start X.


    ![](img/8a0e42659a358d95f558285b9f5bf854_133_1.png)


    > If during installation you chose to make KDE your desktop environment, the section
