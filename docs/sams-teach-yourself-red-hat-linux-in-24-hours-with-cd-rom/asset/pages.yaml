  md: '![](img/8a0e42659a358d95f558285b9f5bf854_35_0.png)


    # HOUR 2


    # Installing Red Hat Linux 7.0


    Installing Linux used to be one of the greatest challenges a new user would face.
    Most steps had to be done manually, and there was a lot to learn before you could
    even begin installing. There were few scripts to help you edit files, and there
    no graphical installation programs; everything was text-based. With the release
    of Red Hat 6.0, installation became much easier, with autodetect tools that detected
    much of your hardware for, and online help at every screen. Red Hat 7.0 makes
    installation even easier, with a smoother installation interface, more probe utilities,
    and automatic sound configuration. With all these improvements, there is a bit
    more to do than insert the CD and click Next. A lot of concepts are introduced
    in this hour with just enough information to get you through the installation.
    Don''t worry if you feel a bit confused... to get a working Linux system up and
    going. You will understand more as you continue through the book. The Red Hat
    installation process is virtually the same as for any other Linux distribution.
    Some of the steps require you to enter information, and other steps are automatic
    (unless you perform an expert installation).'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'In this hour you will


    +   * Plan the installation and gather the necessary information about your hardware

    * Partition the hard drive

    * Configure a boot loader

    * Create root password and user accounts

    * Install Red Hat software packages

    * Configure X (the graphical windowing system for Linux)


    # # Getting More Information


    Red Hat comes with excellent documentation for installing and using Red Hat Linux.
    In most cases the information in this hour should be sufficient to get you through
    the installation, but it does not go into very great detail. If you run into any
    problems or if you want more background information, be sure to read the Red Hat
