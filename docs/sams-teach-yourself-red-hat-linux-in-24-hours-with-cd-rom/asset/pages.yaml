    # Q&A


    +   - What should I do if my modem is a winmodem?

    - Check http://www.linmodems.org to see if a Linux software driver is available,
    although it is unlikely. Chances are that you will have to buy a new modem.

    - How does wdvial know the authentication procedure for my ISP?

    - wdvial performs a trial-and-error login procedure that works with most ISPs,
    based on the information you enter in the configuration file. If your ISP has
    an uncommon login procedure that wdvial can''t figure out on its own, you can
    enter special instructions in the /etc/wdvial.conf file. See the wdvial man pages.


