  md: '# GIMP


    GIMP, affectionately referred to as “The GIMP,” was the application that led to
    the creation of GTK and GN. GIMP is arguably the most advanced application specifically
    for Linux. GIMP was designed to be a freeway version of Adobe Photoshop, but many
    graphics designers find GIMP to be superior to Photoshop.


    GIMP is not part of an office suite, but it is one of the oldest and most important
    productivity applications available for Linux. GIMP is so powerful that it would
    take an entire book to describe, so we will just introduce it here.


    > Grokking the GIMP, by Carey Bunks, is an excellent guide to using GIMP, up to
    advanced techniques. The book is available for purchase in hardcover, or online
    at http://gimp-savvy.com/B00K/index.html. At the GIMP home page, http://www.gimp.org,
    you can find a beginner’s tutorial, an overall tutorial, a set of FAQs, and links
    to another online manual, the GIMP Manual.


    ![](img/8a0e42659a358d95f558285b9f5bf854_223_0.png)


    GIMP can be used for everyday tasks such as simple image viewing and taking screen
    shots, or for complex graphics such as creating computer-enhanced film imagery.
    Some of the features of GIMP include


    +   * Multiple image layers.

    * Filters.

    * Sub-pixel imaging.

    * Anti-aliasing.

    * Channel operations and layers.

    * Extensibility with scripts.

    * A full suite of painting tools.

    * Multiple undo/redo.

    * Gradient editing and blending.

    * Plug-ins for adding new file formats and filters. GIMP comes with 100 pre-defined
    plug-ins.

    * GIMP supports virtually every file format under the sun.


    Like most successful free software, GIMP is in a state of constant development.
    There is usually an unstable, development version that is two or three versions
    ahead of the stable release, and a new stable release comes out every few months.
    The best way to keep up'
