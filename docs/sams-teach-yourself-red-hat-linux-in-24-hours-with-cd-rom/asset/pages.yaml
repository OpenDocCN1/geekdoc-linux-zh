    # Configuring a CD-ROM Drive


    It used to be a nightmare to install and configure a CD-ROM drive. It is much
    easier if you follow a few easy-to-do steps. If using DOS as another partition
    on your machine, make sure that it is set to detect your CD-ROM drive. This is
