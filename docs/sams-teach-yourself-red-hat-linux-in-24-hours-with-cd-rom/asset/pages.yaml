- img_proc: true
  md: 'In this hour you will


    +   - Learn how shell scripts work

    - Understand how to write a shell script

    - Learn the advantages of various scripting languages


    # # How Shell Scripts Work


    The scripting languages discussed in this hour are all interpreted languages.
    This means that they are not compiled and stored in machine code form. Every time
    the script is run, the shell or interpreter parses the file into commands it recognizes.
    The recognized commands. This is fine for simple tasks, but it is not how you
    would write a 3D-render engine program. Running an interpreted script has a significant
    amount of overhead. If you have any programming background it is easy to visualize
    why. Imagine trying to run the program while you are compiling it with the compiler.
    In addition to the resources required by the program, you have to provide all
    of the resources the compiler needs. Granted, most interpreters are friendlier
    on resources than a compiler, but the program will still run slower.


    Shell scripts are simple text files that usually begin with a bash-bang statement
    that specifies which interpreter to read the script. The format of the bash-bang
    statement is


    ```

    #!<path of interpreter>

    ```


    An example would be


    ```

    #!/bin/bash

    ```


    The appropriate interpreter is started and the rest of the script is read by the
    interpreter. The interpreter then translates the scripts into a sequence of commands
    that it can execute. It will execute the script. Depending on the implementation
    of the interpreter, the whole script may be translated at once, or only the piece
    currently executing may be translated.


    # # Writing Shell Scripts


    Writing a shell script does not have to be a difficult task. Shell scripts are
    supposed to make life easier, not make you pull your hair out. Just writing a
    script is not as complex as coding a software package does not mean you can go
    it without any planning. If you are writing a very simple script you can just
    go and dive into an editor, but if it is anything more substantial than a few
    lines you should take a few minutes to plan.'
  merge: -1
