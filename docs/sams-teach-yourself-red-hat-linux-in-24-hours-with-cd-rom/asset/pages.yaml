- img_proc: true
  md: '# Administering the System


    Before purchasing a tape drive, as with any hardware, check with the manufacturer
    to make sure it supports Linux systems.


    I would suggest that you use the HOWTOs relative to the tar command, which will
    teach you how to use it to backups. The tar command actually means tape archive
    so it is well suited for this purpose.


    For specific instructions on how to use tar, please consult the man pages, the
    Red Hat Web site, the GNU Projects home page, and your Linux manuals.


    The next issue concerning backups is when to back up and how often. How many times
    a week backup depends on how much information you generate needs to be backed
    up. If you generate a considerable amount of data, you should back up at the end
    of working day so that you not lose any data. If you generate less data, you may
    need to backup so often. You will also need to purchase new tapes when the old
    start to wear. You should check your tapes periodically to determine whether the
    data is being saved. Older tapes may become worn and need to be replaced. You
    should test your backups at least once a month to make sure that everything is
    working as planned.


    When you have your system and data files backed up you will feel much better knowing
    that your data is safe.


    # Using Cron to Automate Recurring Tasks


    At some point you will need to run programs or processes automatically at a presscheduled
    time. Fortunately, Linux provides a way to do this very efficiently and effectively
    with a daemon cron.


    Cron is a process of the Linux system that can execute a program at a predetermined
    time. In order to use cron you must write a text file that describes the program
    that you want to execute and the tasks that you want to activate. In order to
    use the text file that describes the jobs that you want to run, you must use the
    crontab program to load the text file into cron.


    Here is what your job responsibility text file should look like:


    ```

    [min] [hour] [day of month] [month] [day of week] [program to be run]

    ```


    Using cron is too involved to discuss in detail here, but you can learn more about
    using cron by reviewing the cron man page. There is a lot more information on
    the Internet and in the form of HOWTOs as well.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Rescuing the System


    You can make your administrative life much easier by taking advantage of the cron
    daemon to help you automate processes on your system. One very efficient use for
    cron is to automate your backups. Once you have determined which backup method
    you will use, such as using tar to manage the backup sequence, just put that command
    in your text job file and sit back and relax.


    Sooner or later the time will come (usually when you aren''t there or busy) when
    the system will come crashing down and you will go looking for your latest backup
    tapes. Did you remember to back up the system periodically? Have you made a recent
    backup of the system? Have you checked the log files to make sure the daily data
    backups are working correctly? These are all essential questions that will race
    through your mind. If the answer to any one of them is no, you''ll have a long
    day ahead of you and maybe be an uncertain future.


    A restore is the exact opposite of a backup. When you do a backup you copy files
    from a disk to a backup media as such. When you do restore copy files from the
    disk. Simple logic, but sometimes things go wrong and that is why you should back
    up every day for larger systems. If your previous day''s backup didn''t work,
    you can resort to the one before that and hope that it worked. You may lose some
    data that is better than losing all of it.


    You should also make a set of boot-up and restore disks to use in an emergency.
    This is not a complicated thing to do and it can save you a lot of headaches later.
    Please check your Red Hat Linux 7.0 manuals for instructions on how to do this.


    For more information on how to restore your system or data files using tar, please
    refer to the tar HOWTO on your CD or read books as Red Hat Linux 7.0 Unleashed.


    # Summary


    This hour covered many subjects dealing with Linux including filesystems, backing
    up the system, and automating tasks. You learned a few things about data storage
    using tape and Zip drive backups. You learned that you can easily use cron to
    automate such tasks as backing up your data and running script files. Now get
    comfortable (but not too comfortable) and we will see how much you have learned.'
