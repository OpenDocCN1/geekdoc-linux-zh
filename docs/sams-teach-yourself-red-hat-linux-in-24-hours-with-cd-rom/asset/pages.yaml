  md: "# LISTING 24.1 A Simple Program Using GTK+ Widgets\n\n```\n* hello world */\n\
    #include <gtk/gtk.h>\n\n/* event handler to close window */\nint eventDestroy(GtkWidget\
    \ *widget, GdkEvent *event, gpointer data)\n{\n    gtk_main_quit();\n    return(FALSE);\n\
    }\n\nint main(int argc, char *argv[]) {\n    /* declare some widgets */\n    GtkWidget\
    \ *window, *button;\n\n    /* initialize gtk+ */\n    gtk_init(&argc, &argv);\n\
    \n    /* create widgets */\n    window = gtk_window_new(GTK_WINDOW_TOPLEVEL);\n\
    \    button = gtk_button_new_with_label(\"Hello!\");\n\n    /* assign event handlers\
    \ */\n    gtk_signal_connect(GTK_OBJECT(window), \"destroy\", GTK_SIGNAL_FUNC(eventDestroy),\
    \ NULL);\n\n    /* place button on window and format window */\n    gtk_container_add(GTK_CONTAINER(window),\
    \ button);\n    gtk_container_set_border_width(GTK_CONTAINER(window), 20);\n\n\
    \    /* display everything */\n    gtk_widget_show(window);\n    gtk_widget_show(button);\n\
    \n    /* begin processing events */\n    gtk_main();\n    return 0;\n}\n```\n\n\
    Save this file as ghello.c. Now a minute to study the code in Listing 24.1. The\
    \ #include statement will add all of the necessary GTK+ header files when you\
    \ compile. Next you see an event handler declared. This is just a function that\
    \ has a special format. The format for an event handler is defined by whatever\
    \ library is used for event processing. In this case the library is GTK+. All\
    \ handler stops the processing loop so the program can end. In the main function\
    \ of the program we first see to widgets. Then GTK+ is initialized with a call\
    \ to gtk_init(). There are quite a few things that can be done during initialization,\
    \ but they are beyond the scope of this book."
