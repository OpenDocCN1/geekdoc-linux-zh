  md: '# Using the Visual Editor VIM


    FIGURE 5.2


    The h/k/l keys can be hard to get used to, but they are much faster than the arrow
    keys.


    ![](img/8a0e42659a358d95f558285b9f5bf854_93_0.png)


    To count by words instead of characters, use the w command. w moves one word at
    a time along a line. To move two words at a time, type 2w. To move five words
    at a time, type 5w.


    > A word in VIM is considered to be a string of letters, digits, or underscores,
    separated by whitespace. Other nonalphanumeric characters, such as apostrophes
    and quotation marks, are treated as separate words. For example, the word don''t
    is considered as 3 words in VIM (by default). The first three letters, don a word,
    the apostrophe is a word and then the t is a word. The exception to this definition
    is if the entire word consists of nonalphanumeric characters, such as *****. In
    this case, the string is treated like one word.


    In a long file, a quick way to move from line to line is to use the g command.
    To immediately go to the last line in a file, type G in normal mode. You can also
    use G to go to a specific line. Type the line number where you want to go, then
    G. For example, to go to line 22, type 22G. go to the first line in the file,
    type g or 1g.


    > The G command is different from the j command. For example, 22G takes you to
    line 22, from anywhere in the file. 22j takes you 22 lines down from your location
    in the file.


    G is particularly useful when you get an error message that contains a line number.
    You can just go directly to the line of the program that contains the error.'
