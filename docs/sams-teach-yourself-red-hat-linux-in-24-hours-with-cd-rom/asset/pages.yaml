  md: "# Introduction to Linux Programming\n\n# C++\n\nIt may be true that the core\
    \ of Linux and most versions of Unix are written in C, but most current software\
    \ development is done in C++. C++ was developed by Dr. Bjarne Ststrup at AT&T's\
    \ Bell Laboratories. C was a good choice for developing software, but its object-oriented\
    \ capabilities were severely limited. As the complexity of the code grew, it became\
    \ increasingly difficult to organize and track the code. At that time C was just\
    \ a collection of data variables and procedures. It was not in a form that a devel-oper\
    \ easily relate to.\n\nBy making object-oriented it is easier for programmers\
    \ to understand. Object-oriented code organizes the procedures and variables into\
    \ logical objects. Think about trying to write a class. In C you would have a\
    \ collection of variables representing the attributes of the car along with variables\
    \ for, a collection of functions to simulate the various behaviors of a car. In\
    \ C++ you can create a car that stores its attributes in member variables, and\
    \ all of the car's behavior is represented by member methods. In C++ it is clear\
    \ what the car is and what it can do.\n\nC++ offered support for object-oriented\
    \ design and is an extension of the C language, so it is no surprise that it has\
    \ immense powerfull. C++ objects are defined as classes. An object is an instance\
    \ of whatever class it was declared. To see an example of a class, look at Listing\
    \ 24.5.\n\n# LISTING 24.5 A sample C++ Class\n\n```\nclass Car {\npublic:\n  \
    \  char color[];\n    int weight;\n    int horsepower;\n    void run();\n    int\
    \ start();\n    int stop();\n};\n```\n\nThe declaration of the class Car has the\
    \ member's color, weight, and horse-power. It also has the methods run(), start(),\
    \ and stop(). The methods are defined regular functions and can be defined inside\
    \ or outside the class declaration. Methods must be declared inside the class,\
    \ however. To define a method outside a class you must use the following format:\n\
    \n```\n<class>::method name ( <arguments> ) {\n```\n\nWhen you want to create\
