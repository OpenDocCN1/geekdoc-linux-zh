- img_proc: true
  md: '# Where to Find Applications


    Red Hat Linux contains numerous applications, but sooner or later you will want
    to see what is else out there. There are thousands of applications that run on
    Linux, most of which are free software, created by individuals or volunteer projects.
    The choices are so dizzying that sometimes it''s hard to figure out where to get
    applications, alone which applications to get. Luckily, a few central locations
    are recognized by the Linux community as central repositories for Linux software.
    You will find most available applications in one of the places.


    ```

    http://www.freshmeat.net

    ```


    Freshmeat is the self-proclaimed largest index of Linux software on the Web. Every
    soft-ware package on Freshmeat has an information page, which includes the download
    link, the description of the application, and the category. Links are provided
    to the home page for the application, as well as to the project responsible for
    the application''s creation. Users can post comments on the software, which usually
    include reviews, tips, and workarounds. Freshmeat frequently publishes articles
    and editorials about Linux and other regions of technology.


    ```

    http://rpmfind.net

    ```


    rpmfind, which was created and maintained by Daniel Veillard, is a marvelous way
    to find RPMs (about more RPMs later this hour). rpmfind.net is a database of RPMs
    available for the major distributions that use RPM packages. rpmfind.net works
    with two clever: rpmfind and rpm2html. rpm2html automatically creates a Web page
    that lists all the dependencies for a particular RPM, along with the RPM packages
    that fulfill those dependencies. rpmfind enables you to search the rpmfind database
    for a particular package. Although they make it easier, you don''t need rpmfind
    or rpm2html to use the database—you can look directly at the database lists on
    the Web.


    The only disadvantage to rpmfind is that it is so large that you really know what
    you are looking for before you try to use it. Sites like freshmeat.net are better
    suited for browsing.


    You can get rpmfind and rpm2html from the rpmfind.net Web site at http://www.rpmfind.net/linux/rpm2html/download.html.


    ```

    http://metalab.unc.edu

    ```


    Metalab was the original repository for Linux applications and distributions.
    metalab.unc.edu contains more than 55 gigabytes of Linux software and documentation,
    free for download. The Linux archive is divided into categories that you can browse,
    and a search engine can help you find a particular document or software.'
  merge: -1
  pgno: 200
