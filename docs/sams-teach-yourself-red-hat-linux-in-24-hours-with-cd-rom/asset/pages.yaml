  md: '# Understanding Linux and Device Drivers


    The way that Linux makes it unique and different than any other operating system.
    Everything in Linux is represented as a file, even devices such as hard drives,
    floppies, or CD drives that a file may reside on. This is a difficult concept
    for DOS and Windows users to grasp of the directory structure of those systems.
    You''ll see, however, that this is really an easy, logical way to handle things,
    so you won''t have any trouble learning and using it.


    Linux associates hardware devices with drivers that provide a file interface between
    the two. That is, any piece of hardware that you have on your system, as a newly
    added floppy drive, has a driver that tells the kernel what it is and what it
    can do. Drivers are special files that represent devices (hardware and otherwise)
    on your system. Without a driver for a particular device, your system will not
    detect it and the device will be useless. Normally, you can see this in Figure
    8.1.


    +   1. The devices are all stored in the /dev directory.


    ![](img/8a0e42659a358d95f558285b9f5bf854_148_0.png)'
