  md: '# Why Worry About Security?


    There is nothing in this world more frustrating than having your home broken into
    or your property stolen or damaged and feeling helpless to do anything about it.


    If you don''t take a proactive approach in securing your system, someone will
    get into your system and do some damage. If you are responsible for someone else''s
    network, it is your job to protect their data and property. With the recent attacks
    on computer systems of all kinds it is imperative that you take adequate action
    to protect not only your personal computers, but any other systems that might
    be responsible for.


    From a legal perspective you have to worry about liability in regard to your computers.
    If someone steals data that belongs to one of your clients, you could be sued
    or suffer other losses, including a damaged reputation. It is a crazy world and
    you have to protect yourself from it in as many ways as you can.


