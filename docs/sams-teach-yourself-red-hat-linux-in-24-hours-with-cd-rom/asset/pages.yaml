    # Viewing the System Logs


    In order to correctly and efficiently diagnose a problem that has occurred with
    your PC or system, you need to know what happened to cause the problem. One way
    to do this is to look at and analyze the system logs, the configuration file,
    and other files. The system logs provide you with a wealth of information about
    what the system was doing when it crashed.'
