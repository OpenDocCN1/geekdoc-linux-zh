  md: '# Setting Up a Printer and Other Devices


    The drivers for the printer are kept in the /var/spool/directory. This is the
    directory where the files are sent to await printing. We will discuss this in
    detail later in this hour.


    # Characteristics of Devices


    There are two kinds of devices: character and block. Remember that under the Linux
    hierarchy, each unit or device attached to your computer is abstracted to a device
    file that has an accompanying device driver in the kernel. Most of the time drivers
    are installed when you install Linux, but if you add a piece of hardware later
    you will have to install a driver for it.


    Character devices are also called sequential access devices. Everything that is
    connected to the computer that communicates with Linux is treated as a device.
    A block device is a component of the computer system and has the ability to store
    data and allows you to access all parts of it equally. They are also called random
    access devices. Examples of block devices are floppy drives, hard drives, and
    other storage mediums.


    Some of the devices that use blocks of data are tape drives and hard drives. Obviously,
    the fastest way to send a large chunk of information is to send it in blocks because
    you can send more data that way. That''s why they are called block mode devices.


    > You can use many of the utilities in Linux to configure devices and edit script
    files, login scripts, and many other things that you really don''t have to do.
    You should know how to use the shells and other things mentioned in this book.
    It will come in handy when making your machine work


    You may have to inspect or work with such files unless you write your own drivers.
    It is always helpful to know what is going on in your computer and how things
    work. In today''s Linux environment, almost everything is configured for you (such
    as plug-and-play devices) or you can use a graphical interactive utility as linuxconf
    or Xconfigure to do the hard work for you. You can do most of the device installations
    on your computer through interactive graphics without having to crawl hundreds
    of lines in some script file using a text editor.


    Fortunately there are numerous utilities as the KDE Devices utility that show
    you the devices on your system. The KDE Devices utility is shown in Figure 8.2.'
