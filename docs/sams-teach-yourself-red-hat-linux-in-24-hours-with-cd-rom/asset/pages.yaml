  md: '# Hour 24


    In this hour you will


    +   - Discover the value of Linux programming

    - Understand the Open-Source Development Model

    - Examine development tools such as GTK+

    - Write, compile, and run simple C programs

    - Write, compile, and run simple C++ programs


    # What Learning to Program in Linux Can Do for You


    At this point you may still be wondering why to program for Linux is important.
    Programming for Linux may sound like a burden, or perhaps you just want to have
    a Linux server on your network. Maybe you just need to run a few applications
    under Linux, or maybe you have Linux running to feed a Quake. The last thing on
    your mind is developing new software. Well, there are still plenty of good reasons
    to learn with Linux.


    If you want to understand how your programs are working, you need to have a basic
    understanding of programming. Think about it—if you understand programming, you
    can download the source to any open-source Linux package and after reading through
    it how it works. Plus, a knowledge of Linux programming can greatly enhance your
    professional skills. It is also a great way to give back to the Linux community.


    > If you don''t think it''s worth your while, go on some job search sites as http://www.monster.com
    and http://www.dice.com for Linux programming jobs. It is a safe bet that the
    pay and benefits will not be something to laugh at. Many companies are developing
    products for Linux now and it is an excellent career opportunity. Also if you
    are a network administrator, you can customize the networking packages and tools
    to aid in network maintenance. This is an age where you can get ahead by working
    smarter instead of harder.


    The first thing that we must do, is get past one the Linux phobias: programming
    for Linux. For some reason many people (and many programmers, for that matter)
    have the impression that programming for Linux is a horrible, painful task. Actually,
    nothing could be further from the truth. Linux was developed by programmers fed
    up with existing tools, so they made a system that is easier to develop, easier
    to fix, and easier to debug. The other benefit is the variety of free tools to
    aid in the'
