  md: '# HOUR 18


    # # Setting Up a Simple Network


    Computer networks have connected the world. They are everywhere, in businesses,
    offices, libraries, and even in the home. Networks can be complex and sometimes
    even mind-boggling. Would you like to have your own network? Of course if you
    happen to have a couple of PCs sitting around, I''ll show you how to do it.


    Learning to set a computer network for the first time can be an exciting and rewarding
    experience, so let''s have some fun.


    In this hour you will


    +   - Set up and install your own home network

    - Install your Ethernet card

    - Set up a virtual private network (VPN)

    - Learn about IP masquerading

    - Build your own firewall to protect your system'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Setting Up Your Own Simple Network


    Before you begin to set up your network, there are a few things that you need
    to know. You may have already used the largest network in the world without really
    realizing it—the Internet. That''s right, the Internet has grown to be the largest
    network of all. But what is a network?


    A network is nothing more than two or more computers connected with a cable or
    other type of conductor. Each of these computers may have a unique address (just
    like a house has an address and is connected to other houses by telephone lines)
    so that other computers can communicate with it.


    In reality, computers on a network send data to each other by sending electrical
    signals over the cable. The technology involved here is very complex and we will
    not get exactly how all this works. Libraries are filled with books about the
    subject and the Internet with such information. It is sufficient for us to understand
    what we need to build a simple network. You will know how to build your network
    and understand it works.


    There are some questions here that you may have already been asking yourself.
    For instance, how does one know whether another computer has received a message?
    Or, by what path did it travel to reach its destination? How do the computers
    on a network know the addresses of the other computers? All of these questions
    and many more are answered by one single word: protocol. A protocol is just a
    set of rules that defines how computers and everything on the network behave or
    conduct themselves. A protocol is a common language that each unit or device of
    the network must use.


    If one computer spoke protocol and another computer spoke a different one, they
    would not be able to communicate. All units on the network will be able to communicate
    effectively if they use the same protocol or set of rules. Table 18.1 defines
    some of the more common protocols you will most likely come into contact.


    # Table 18.1 Common Protocols


    | Protocol | Definition or Meaning |

    |---|---|

    | FTP | File Transfer Protocol |

    | HTTP | Hypertext Transfer Protocol |

    | LAN | Local Area Network |

    | MAN | Metropolitan Area Network |

    | OSI | Open Systems Network |

    | SMTP | Simple Mail Transfer Protocol |

    | WAN | Wide Area Network |'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Setting Up a Simple Network


    > You can further define protocols as a set of standards that defines how each
    computer or node identifies itself to everything else on the network. It also
    defines the data format and how the data is processed when it reaches its destination
    within this framework. Data is normally transferred in what are called "packets,"
    which are sent and received by nodes of the network.


    ![](img/8a0e42659a358d95f558285b9f5bf854_307_0.png)


    # Types of Networks


    You will need to know some of the details about what constitutes a network before
    you can proceed with building your own. Knowing what constitutes a network will
    help you to better understand how to build one. Figure 18.1 shows a simple network
    of two computers connected to a hub. There are many kinds of networking topologies,
    of which Ethernet is only one. Ethernet is probably the most popular, cheapest,
    and easiest to build, which is why we''re covering here. It is beyond the scope
    of this book to cover all the different types.


    ![](img/8a0e42659a358d95f558285b9f5bf854_307_1.png)


    # 18


    The way in which computers are put together to form a network and the kind of
    cabling it uses is referred to as the topology of the network. That is, topology
    is defined as the method in which a network is configured. Each computer, router,
    hub, or other device on the network is referred to as a node. Nodes on an Ethernet
    network are generally connected by Ethernet or Point-to-Point topology:


    +   * Bus—The bus method connects the nodes to a coaxial or other cable in series
    by T-connectors. If the circuit breaks at any point, the entire network will be
    inoperable. You must terminate the Bus (coaxial) network with terminators on each
    end. One of these must be grounded. It doesn''t matter one.


    +   * Point-to-Point—This is the recommended and most widely used topology. The
    Point-to-Point topology connects exactly two nodes together. This is normally
    accomplished using a hub or switch.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'A Local Area Network (LAN) is the type of network you would find in an office
    or business. It usually consists of two or more computers connected in an arrangement
    that allows them to communicate. If you have another office across town and you
    have LAN connected to the LAN in the other office, you need a router to connect
    the two LANs so that they can communicate effectively. This is a Wide Area Network
    (WAN). A WAN is generally understood to be several LANs connected together.


    As networks develop and expand, so do the protocols and acronyms. There are network
    protocols for schools, colleges, universities, hospitals, and even the Internet.
    Everything on a network must use the same type of protocol or one that can talk
    to other computers on other networks. Most networks today use the TCP/IP protocol.
    The TCP/IP protocol is native to UNIX/Linux; it was originally developed for it
    so it is the natural that we use TCP/IP for our network protocol. TCP/IP was developed
    to allow computers to share resources across a network. TCP/IP was developed by
    a community of researchers who wanted to allow the computers on the old Arpanet
    to communicate with each other and with other networks. This eventually led to
    the Web and Internet.


    # Types of Cabling Used in Networks


    There are four basic, types of cables used in networks: thick, twisted pair, and
    fiber optic. With the ways things change in computers there are new types appearing
    every day, such as wireless, firewire, and USB.


    Thickwire is not more than large diameter coaxial cable. It is referred to as
    10BASE5 and is not used much because it is bulky, hard to work, and breaks easily.
    It is immune to electrical noise and may serve as a backbone for a Bus topology
    network.


    Thin coax, also called 10BASE2, is of a smaller diameter, more flexible, and easier
    to use than thickwire. It is used to connect computers in a Bus topology where
    the nodes are directly connected to the cable using T-connectors (BNC). BNC stands
    for Bayonet Nut Connector. This type of topology is not used much more because
    it is bulky, hard to run, breaks easily, and other cabling systems are much more
    efficient. One of the advantages of using this type of coaxial system is that
    it resists electrical interference (EMF) and crosstalk. Crosstalk can be of interference
    between two signals that run adjacent or in close proximity to each other.


    Twisted pair, also known as 10BASET, 100BaseT, UTP, or CAT-5 (Category 5), is
    similar to regular telephone cable. You may also know it as UTP (Unshielded Twisted
    Pair) or STP (Shielded Twisted Pair). This type of cable is used with Point-to-Point
    topology and is the most common type of network topology today.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Setting Up a Simple Network


    Fiber optic is known as 10BASE-FL and is used the same way that you use twisted
    pair cables. It is easy to install, and insulates the network from lightning strikes
    and electrical interference. It is more expensive than twisted pair, but for some
    applications it is worth the initial investment.


    Now you know what kind of cabling is used in networks and you have a better understanding
    of what to expect. You will be using a Point-to-Point topology to build your network
    so your job will be much easier than if you were using coaxial. Now that we have
    discussed the cabling, let''s take a look at network interface cards and hubs,
    the two final components that make up your simple network.


    # Network Cards and Hubs


    Computers and other devices on the network are hooked together using network interface
    cards (NICs) that are installed in the computers. These cards allow a computer
    to communicate with others on the network. Network interface cards are either
    of the type for coaxial (BNC) or the unshielded twisted pair (RJ-45) variety.


    One of the most important choices you make when designing a network is to choose
    the right equipment. This choice includes things as network interface cards and
    hubs. Network interface cards come in many brands and varieties. They are available
    in both ISA and PCI versions. Most newer computers have both types of slots so
    you should check your computer to make sure that your card will fit in it. If
    you have a PCI slot, you use that because it is faster. The PCI cards are "plug-and-play,"
    so they will be easier to install the software will detect your card in cases.
    The PCI bus will automatically assign an IRQ to the card, which is helpful. If
    you end up using an ISA card, you will unfortunately have to do yourself the BIOS.
    How do you know if you have a PCI slot on your motherboard? Generally, PCI slots
    are white and ISA slots are black.


    When you purchase a card, look at the speed of the card. Currently you have a
    choice of 10Mbps and 100Mbps cards. You should probably go ahead and purchase
    the 100Mbps cards because they are as fast as the 10Mbps cards. Some cards will
    allow you to run both speeds. These are designated as 10/100 speed cards. You
    will find a variety of cards with a variety of different speeds including those
    that can run faster a gigabyte. You should purchase the fastest cards that you
    can afford, if you are only setting up a small network in your home or office,
    the 100Mbps cards should be sufficient. You can generally get a good network card
    for anywhere from $10 up. You can probably find a 100Mbps card for less than $30.
    Although a network of 10 computers will generally run well on 100Mbps cards, I
    would recommend that you purchase the 100Mbps units because they are much faster
    and if you decide to expand your system, you are already set up for it.


    ![](img/8a0e42659a358d95f558285b9f5bf854_309_0.png)'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'Another good thing to know about network cards is that they come with connectors
    for coaxial cables (BNC), for twisted pair cables (RJ-45), and for the older Attachment
    Unit Interface (AUI). You may see older cards with other types of connectors that
    you may not be familiar with. If you don''t have the documentation for the card,
    do not use it because you may damage your equipment. You will be using the type
    for twisted pair (CAT5) with the RJ-45 connector.


    If you are using laptops, laptops, or notebooks on your network, you will need
    a PCMCIA (Personal Memory Card International Association) interface card. These
    are the small credit card size cards made specifically for laptops that plug into
    the PCMCIA port on your laptop. These cards usually come with enough documentation
    that you can install them trouble-free. If you are using more than a few of the
    laptop type computers on your system, you should consider using "docking stations"
    because these units allow you to remove the computer and take it with you. The
    docking stations also cut down on maintenance costs, and allow you to use a regular
    size monitor, mouse, and keyboard. The laptop simply slides into the docking station
    and can be as easily removed. By using a docking station, you don''t wear out
    or bend the pins on your connectors quite fast.


    Hubs, like network cards, come in many sizes, shapes, speeds, and with a variety
    of ports to choose from. A hub is a simple box that allows you to connect your
    computers and form a network. All of the computers hooked to one hub are basically
    known as a segment. That is, it forms a segment of the network. If you add another
    hub to the network that is another segment. Large networks connect many segments.


    Hubs are generally 10Mbps or 100Mbps. You can buy dual-speed hubs that run both
    speeds. The computers hook into the hub with either BNC or RJ-45 connectors on
    the hubs called ports. A small home network can start with 4 or 5 ports and when
    it expands you can add more hubs. I would highly recommend that you buy at least
    an 8-port hub because the price is currently so low that you can pass it up. You
    will need to purchase a 100Mbps if your cards are 100Mbps.


    Hubs should be placed in a central location and your cables should be routed from
    your computers to the hub. The advantage of hubs over the coaxial (bus) system
    is that if the cable breaks on a bus you lose the entire network, but with a hub
    you only lose the computer or node that is bad.


    As your network grows you will need to add more hubs to compensate for the growth
    factor. You have to do this by plugging them together through an uplink port or
    with a crossover cable plugged into one of the standard ports.


    Hub prices range from about $30 to more than $100. I recently purchased an 8-port
    hub for about $45. Hubs are something that you can expand on and extending your
    networking'
