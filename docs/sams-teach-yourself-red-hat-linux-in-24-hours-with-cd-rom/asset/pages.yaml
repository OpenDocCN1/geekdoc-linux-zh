- img_proc: true
  md: '# Quiz Answers


    +   1. Name three kinds of memory in your Linux system.

    Cache memory, physical memory, and swap space.


    +   2. What does pid stand for?

    Process Identification Number


    +   3. Where does the /proc filesystem reside?

    In physical memory.


    +   4. True/False: The kernel is another name for the operating system.

    False. The kernel is part of the operating system, but the entire operating system
    also includes libraries, system programs, and shells.


    +   5. How often is the /proc filesystem updated?

    Every time the state of the system changes, the kernel dynamically updates /proc
    to reflect the change.


