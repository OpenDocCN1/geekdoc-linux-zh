  md: '# Using Virtual Desktops


    When you are using GNOME, the desktop is bigger than you can imagine. If you doubt
    me, look at the Pager on the panel. You should see four blocks and one of them
    should be blue to indicate which screen or desktop you are in. Most of the time
    you use one-fourth of the screen. The Pager allows you to move easily from one
    part of the desktop to another. For example, drag an open window to the right
    side of the desktop until only the left part of it is visible. Now watch the Pager
    and you should see a small area overlapping from the left block of the Pager to
    the top one.


    If your Pager is not on your panel, you can quickly add it like this:


    +   1. Right-click your mouse on a clear area of the panel.

    2. Select Add Applet, Utility, and then click Gnome Pager. The Pager should appear
    on your panel.


    The blue color of the Pager indicates which quadrant of the desktop you are in
    the present time. Click on each of the other quadrants or sections of the Pager
    and look at what is in that section (some quadrants may not have anything in them).
    If you click the lower-right quadrant, you will see part of the window that is
    currently scrolled off the screen.


    The only time you will probably be interested in the Pager is when you have many
    windows open and your present desktop is getting cluttered.


    > When we are talking about the quadrant, we are referring to the current desktop.


    If you take a look at the Tasklist in the panel, you will notice that there is
    a button for each window that is currently open. By default, you normally have
    only four windows available. You can change the appearance or settings for the
    Pager by clicking the question mark (?) next to the Pager. The Gnome Pager Settings
    dialog box appears. Please note the Pager and Tasklist tabs at the top of the
    dialog box. You can set the following options:


    +   * Show Pager—Select to choose Pager or not.

    * Place Pagers After Tasklist—Moves pagers to the right of the Tasklist.

    * Use Small Pagers—Shrinks the size of the Pager when selected.

    * Rows of Pagers—Determines how many rows of pagers appear in the panel.'
