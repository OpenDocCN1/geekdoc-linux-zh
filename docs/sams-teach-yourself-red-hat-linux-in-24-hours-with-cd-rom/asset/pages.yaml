  md: '# Introduction


    Welcome to the wild world of Linux! Linux is a UNIX-like operating system that
    can run on many different kinds of computer platforms, most often on personal
    computers that contain an Intel processor. Linux is also a true creation of the
    Internet—a vast project involving thousands of volunteers who communicate via
    email, Internet Relay Chat, and Usenet newsgroups. Linux is a community of people
    who care passionately about the art and craft of creating well-written and useful
    software programs. It is also a community of people who care passionately about
    the freedom to share their creations freely with everyone. Linux is also a lot
    of fun, as well as being an ideal tool for learning how computers work and how
    to make wonderful things.


    We hope that you read this book you have got excited about Linux as we are, and
    that you have much fun reading this book as we have written it.


    # Why Teach Yourself Linux?


    Linux offers a true alternative to the monopolistic hold that Microsoft has had
    on personal computing for the past ten or so years. If you are tired of being
    forced into rigid, poorly designed, overpriced and unstable, bloated software,
    consider Linux as a low-cost and superior alternative.


    The bywords of Linux are freedom and adaptability. You can do anything you want
    with Linux. You can change it any way you want, you can adapt it to almost any
    kind of hardware, and you can make it work easily with any other operating systems.
    Linux is designed to be used in a network environment and have multiple users,
    but you can also use it by yourself only. It is as simple or as complex as you
    need to be.


    # Should You Read this Book?


    If you have no experience with Linux or any other flavor of UNIX, this book is
    for you. However, this book is not designed to give you just general, diluted
    ideas, nor are the topics dumbed-down to the point where you learn nothing about
    a lot of subjects. We have carefully chosen the topics that we feel are most important
    for a beginner to know, and we go quite a lot of detailed explanation. Our aim
    is to teach you a few things thoroughly, and to provide you with as many references
    as possible to continue your study of Linux.


    If you want to learn Linux painlessly and relatively quickly, but you want more
    than just a brief glimpse, this book is for you.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What You''ll Learn in 24 Hours


    At the beginning, this book delves right into the operating system. We assume
    no prior knowledge, but we also don''t skip on the details of how and why things
    work. You will learn how to operate an operating system with the hardware of your
    computer to make a working system that enables you to do useful things. We''ll
    talk about what exactly is going on when you boot your Linux system, how the whole
    system of files and directories is organized, and how to communicate via commands.


    You will learn how to feel comfortable entering text commands on the command line,
    and how to use graphical desktop environments to point and click, just like in
    Windows or Macintosh. You will learn how to perform the most important administration
    tasks, how to keep your system secure, and how to use scripts to automate boring,
    repetitive tasks.


    We''ll discuss how to use Linux on the Internet, useful applications to get work
    done, and of course, how to have fun with games and other amusements.


    You will also learn where to go to expand your knowledge, get help, learn about
    more advanced topics like programming and advanced system administration, and
    get more applications.


    By the end of this book, you will have a thorough introduction to the most important
    aspects of running a Linux system. You will feel comfortable with performing,
    or learning how to perform, any task. You will also understand how things work
    and why Linux works the way it does.


    # Helpful Learning Tools


    Included in the discussions for each hour are additional elements that provide
    you with more information on how to work with the Linux operating system. These
    elements are designed to offer extra knowledge without encumbering your progress.


    # Find Additional Information


    ![](img/8a0e42659a358d95f558285b9f5bf854_22_0.png)


    > Notes are used to clarify a topic or to provide additional information that
    might be of use to you. Notes aren''t necessary to the discussion; they''re just
    tidbits of information that you might find interesting.'
  merge: -1
