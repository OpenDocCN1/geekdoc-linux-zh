    # Mozilla


    Mozilla is an open-source browser based on the source code for the Netscape browser.
    Netscape released the source code for what would have become Netscape 5.0 to mozilla,
    for development as a free software browser. Mozilla is still in heavy development,
    but the project looks promising. The source code is released every day for compilation
    and testing, but RPM packages are periodically recreated as well. See http://www.mozilla.org
    to download the latest release.


    # Sending and Receiving Email


    If you are using Windows, you probably rarely thought about email. You use Netscape
    Messenger or Microsoft Outlook, and that is that. In Linux, of course, there is
    much more of mail clients, called Mail User Agents (MUA). Although it''s beyond
    the scope of this book, you can even set up your Main Mail Agent (MTA), which
    enables you to send your messages directly over the Internet to the recipient,
    as well as thoroughly customize your email setup. In this section you learn the
    basics of email so that you can better understand all the options available to
    you in Linux. We will introduce some of the more popular email clients, both graphical
    and text-based, that come with Red Hat.'
