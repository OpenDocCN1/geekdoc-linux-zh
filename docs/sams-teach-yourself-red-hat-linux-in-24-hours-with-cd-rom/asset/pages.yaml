    to use your own services, so in /etc/hosts.allow, enter this line:


    ALL:LOCAL


    This means that no host is allowed to use your computer except the local host,
    which is your local computer. If you want to be able to dial in your computer
    remotely, be sure to include in /etc/hosts.allow the hostname or IP address of
    the computer you are using to dial in!


