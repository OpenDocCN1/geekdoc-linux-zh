  md: '# Hardware Device Drivers


    The kernel contains a device driver for each kind of hardware that it supports.
    Hardware drivers are grouped into classes, for the same general types of hardware.
    Each member of the class has a similar interface to the rest of the kernel, but
    differs in operations. For example, all disk drivers have operations to "initialize
    the drive," "read sector X," and "write sector X," but the actual operation procedure
    may differ from driver to driver.


    # Memory Management


    There are different kinds of memory in your computer. Cache memory is the fastest
    and also the most expensive. There is usually a small amount of cache memory on
    the processor chip, and some more cache memory on your system board. Main, physical
    memory, which comes in cards that are plugged into the system board, is much slower
    than cache memory. Even physical memory is expensive and is usually not enough
    memory for the processor to work at top efficiency, so Linux makes use of virtual
    memory, or swap space on the hard disk that is used as memory.


    ![](img/8a0e42659a358d95f558285b9f5bf854_244_0.png)


    > When shopping for a new computer, pay careful attention to the amount of cache
    the system has. The more cache, the faster the system will run, assuming there
    is sufficient physical memory and a processor with a fast clock speed. Cheap computers
    tend to skim on cache and physical memory.


    Virtual memory makes the system appear to have more memory than it actually does
    by sharing the memory between competing processes as they need it. Virtual memory
    has become more and important as the need for memory has outstripped the availability
    of physical memory in most systems. Memory is expensive, so many computer systems
    don''t have enough, if there is such thing enough.


    Each process in the system has its own chunk of memory, which is the process’
    virtual address space. The address spaces are completely separate, so that one
    process cannot affect another process by invading its address space. For example,
    if these protections were not in place, one process could write over the code
    and data that is needed by another process.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# The Linux 2.4 Kernel


    > If you get an error called a segmentation fault (segfault for short), along
    with a crashed application, that means that the application tried to access a
    part of memory outside of its address space, the kernel shut down before it could
    damage. When this happens, you should report the bug to the maintainer of the
    application, or to Red Hat''s Bugzilla. Instructions for doing this are included
    in Hour 22, "Troubleshooting and Getting Help."


    ![](img/8a0e42659a358d95f558285b9f5bf854_245_0.png)


    The kernel swap daemon, called kswapd, is in charge of swapping processes into
    and out of virtual memory. When you start to run low on physical memory, kswapd
    tries to free pages of physical memory; kswapd swaps pages to your swap files,
    and it also makes sure that there are enough free pages in the system to keep
    the memory management system operating efficiently.


    starts periodically to make sure there is enough system memory. If there isn''t
    enough memory, the kernel swap daemon looks for good candidates to swap out or
    discard. A page fault occurs when a process is scheduled to run, but it has been
    swapped out. The kernel has to get the process and reload it into core before
    it can run. If you get a page fault that the kernel can''t recover, you should
    kill and restart the process.


    # Getting Information from the Kernel


    There are several commands that enable you to get information from the kernel,
    or to directly influence its work. For example, the nice and renice commands enable
    you to raise or lower the priority of a process. nice launches a command with
    a specified priority, and renice lowers or raises the priority of a process that
    is already running. You must be logged in as root via renice.


    The top command enables you to watch scheduler information in real time. top is
    different from ps, in that ps gives you a snapshot of the processes that were
    running when you entered the command, but top is continuous. You can renice and
    kill processes using top gtop, written by Radek Doulik and Martin Bauling, in
    a GNOME graphical version of top and is shown in Figure 14.3.'
  merge: -1
