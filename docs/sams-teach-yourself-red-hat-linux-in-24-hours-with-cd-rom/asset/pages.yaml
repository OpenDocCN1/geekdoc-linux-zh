  md: '# Q&A


    # Can I Use the Internet if I don''t run X?


    +   Every activity that is covered in this hour—browsing the Web, sending email,
    and using Usenet, FTP, and IRC—can be done in a shell environment. For text-based
    clients for Usenet, FTP, and IRC, see the Network Administrator’s Guide, and the
    appropriate HOWTOs.


    # Quiz


    +   Which Web browser is text-only?

    What protocol is generally used to send email across the Internet?

    What is the difference between a mail user agent (MUA) and a mail transfer agent
    (MTA)?

    What is a MIME type?

    Who controls Usenet?

    How do you list the channels IRC server supports?

    In X-Chat, how do you know the channel operator is?


    # Quiz Answers


    +   Which Web browser is text-only?

    What protocol is generally used to send email across the Internet?

    SMTP

    What is the difference between a mail user agent (MUA) and a mail transfer agent
    (MTA)?

    You use an MUA to compose and send emails and to read the emails that you receive.
    Your ISP uses an MTA to actually send the email to the recipient’s computer or
    ISP. You can set up your MTA on your local Linux system. See the Mail Administrator
    HOWTO and the Network Administrator’s Guide at http://www.linuxdocs.org.

    What is a MIME type?

    MIME stands for Multipurpose Internet Mail Extensions. MIME is a collection of
    standards that enables you to send and receive different types of files via email,
    in addition to ASCII text.'
