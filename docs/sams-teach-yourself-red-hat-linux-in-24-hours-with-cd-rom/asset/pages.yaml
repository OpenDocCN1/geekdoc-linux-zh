  md: '# XFree86—The Linux Window System


    A window manager is the main interface between the X Window system and the user.
    Without the window manager you would be left with the system prompt, which isn''t
    too productive, especially if you are using graphical interfaces. The screen is
    the whole desktop area that you have GNOME or KDE up and running. You can have
    more than one screen or computer running one X server, but for the purposes of
    this chapter, a screen is the viewing area of your desktop. The background area
    of your screen is the root window; this is the area on which you run your applications,
    install an icon, or place a picture as a wallpaper image. Your mouse or other
    pointing device is called the pointer.


    The window is a simple frame in which your applications reside and what you see
    in this window. The window manager "manages" everything that you see in this window.
    Within this window environment, you have such menus and icons. These menus and
    icons allow you to select and manage your programs and documents.


    With most managers, such as GNOME and KDE, you will have a panel at the bottom
    of the screen. You can add applets to the panel to enhance your productivity and
    to do things. You can dock folders, applications, and applets on the panel for
    easy launching and access. One of the nice features of the GNOME panel is that
    you can click the left or right arrow at the end of the panel to grow or shrink
    it. Adding an applet to your panel is as easy as working with any other window
    environment.


    # Task: Adding an Applet to Your Panel


    To add an applet to the panel, follow these steps:


    +   1. Right-click a clear area of the panel.

    2. Select Add Applet and a list of categories pops up.

    3. Select an applet to add from the categories.

    4. For example, add to the Drive Mount utility to your panel, select Add applet,
    Utility and select Drive Mount. The Drive Mount applet should appear on your panel.
    In case, I can mount/unmount the floppy from that, which makes it convenient.
    Look through the options but don''t let your panel get cluttered or be useless.


    You can customize the panel by adding one or more panels to your desktop; you
    can change the orientation from horizontal to vertical or shrink it to out of
    the way.


    In this section you have learned a few things about the panel—how to add applets
    to it, resize it, and make it more personalized. In the next section you will
    find out what virtual desktops are all about.


    ![](img/8a0e42659a358d95f558285b9f5bf854_121_0.png)'
