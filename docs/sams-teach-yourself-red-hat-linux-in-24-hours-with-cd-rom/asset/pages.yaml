  md: '![](img/8a0e42659a358d95f558285b9f5bf854_185_0.png)


    # HOUR 10


    # # Using the Internet


    After you have made a successful connection to your ISP, the difficult part is
    over and the fun begins. Linux comes with many Internet applications that are
    often far more powerful than their Windows equivalents. In this hour you will
    learn the basics of how some Internet tools work in Linux, and you will learn
    about some useful Internet applications.


    In this hour you will


    +   - Discover some of the more popular Web browsers for Linux

    - Learn about email works

    - Learn about the Usenet and XRN, the news reader

    - Download and upload files with gFTP

    - Chat on the Xchat IRC client


    # ## Connecting to the World Wide Web


    To connect to the Web, you will need some sort of Internet browser, which will
    connect to a Web site and download its contents to your computer. In Linux, you
    have a lot of choices when it comes to Internet browsers. Some of the most common
    browsers are introduced in this section.'
  merge: -1
