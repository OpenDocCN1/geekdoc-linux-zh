  md: '# HOUR 14


    # # The Linux 2.4 Kernel


    To really understand what''s going on in your Linux system, you must develop at
    least a basic understanding of the kernel. The kernel is the conductor of the
    orchestra of the Linux system, the director of all the little activities that
    enable the computer to useful work and make up the operating system. In fact,
    any error messages and other problems make a lot more sense if you understand
    what the kernel is doing.


    In this hour you will


    +   - Learn the basics of the kernel, what it does, and how it works

    - Learn about processes and memory management

    - Use the /proc filesystem and commands that enable you to interact with and learn
    about the kernel

    - Learn about loadable modules and recompiling the kernel


    # # Introduction to the Kernel


    The kernel is the heart of the operating system, but it is not the operating system
    itself. You could say that the operating system is the kernel, plus all the libraries,
    shells, and system programs that provide an arena for you to'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Hour 14


    run programs that do work. The operating system takes the pile of plastic, metal,
    and silicon and turns it into a computer that does useful work.


    The kernel keeps track of files on the hard disk, starts and runs programs, assigns
    memory and system resources to the processes, receives packets and sends packets
    to the network, and provides the tools that enable services as a layer between
    the hardware and the applications. No applications or other processes can access
    the hardware directly. They must work with the services that the kernel provides.
    This method protects individual users and processes from each other. It makes
    sure that all processes use the tools that the kernel provides to implement the
    operating system services. System applications and other user applications "on
    top of the kernel."


    As learned in Hour 3, "Linux Basics," a computer consists of a processor, memory,
    and input/output devices, also called peripherals. The processor contains a clock,
    which regulates the work that the processor does. The processor performs an action
    on every pulse of the clock. The speed at which the clock pulses is the speed
    of the processor. At each clock pulse, the processor does some work.


    > When you buy a system, the feature most advertised is the clock speed of the
    processor, such as Intel 366MHz. That same system might have 32MB of memory, which
    kind of makes the fast processor useless. Be careful of when buying a system,
    and if you can customize, consider buying more memory and less hard disk space.


    Rather than giving user processes direct access to hardware, the kernel runs services
    that enable the processes to request a service for the hardware. For example,
    the kernel creates and maintains the filesystem. User processes do not access
    the blocks on the hard drive directly to access a file—they go through the filesystem,
    which is controlled by the kernel.


    The kernel is one large program linked from lots of different modules, most of
    which are written in the C programming language. The kernel is composed of functions
    that manage memory, processes, the filesystems, and devices. The object modules
    and libraries are grouped by the function that they perform. Linkers link all
    the objects together when the program is compiling, to make it one big program.


    # Getting Basic Information about the Kernel


    Many beginning Linux users get confused over the difference between the version
    of Linux they are running and the version of the Linux distribution. Linux distribution'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# The Linux 2.4 Kernel


    version numbers are arbitrary, and are set by the distribution companies or projects
    themselves. For example, Red Hat 7.0, Mandrake 7.1, and Debian 2.2 are all the
    latest versions (at the time of writing) of the respective distributions. They
    really won''t tell you much about the underlying Linux version, unless you are
    familiar with the distribution. When you talk about the version of Linux you are
    running, you are generally referring to the version of the kernel.


    You can upgrade the kernel just like any other piece of software on your Linux
    system, although the process is a bit more complicated than simply running and
    installing an RPM.


    To find out the version of the kernel you are running, enter the command


    ```

    # uname -a

    Linux localhost.localdomain 2.2.16-22 # Tue Aug 26 14:49:06 EDT 2000 1686

    unknown

    ```


    The output tells you what version of the kernel you are running, the number of
    times the kernel has been compiled (#1), and the fact that the machine running
    it is a Pentium i686. You are also told the name of the machine (localhost.localdomain
    is the Red Hat default), and that the operating system is Linux.


    The kernel is written using the following convention: major.minor.patchlevel.
    For example, for kernel 2.2.16, 2 is the major version number, which changes only
    when something really fundamental changes in the kernel; 2 is the minor version
    number, or which is the strain of the kernel release; and 16 is the patchlevel.


    Even-numbered kernel versions are stable releases, patches that contain only bug
    fixes and no new features. Odd-numbered versions are development versions, patches
    that can contain new code and bug fixes for the code. As soon as the new code
    is stable enough to be released to general use, the version is named with the
    next even minor number.


    For example, take kernel versions 2.2 and 2.3. Any patches to version 2.2 are
    just bug fixes. Patches to 2.3 include bug fixes and new code, including new drivers
    and new features. When kernel 2.3 is stable enough, it will be named version 2.4.
    2 will be the new stable kernel, and a copy of 2.4 will be named 2.5, and development
    will continue on the kernel 2.5. This way, if you want to experiment, you can
    use 2.5, and if you need stable kernel, you can use 2.4.


    If you are willing to risk problems with your system, you can use a development
    kernel, but be warned that new features can cause serious problems with previously
    stable parts of the kernel, so those problems are unpredictable (which can be
    part of the function). Use at your own risk.


    ![](img/8a0e42659a358d95f558285b9f5bf854_241_0.png)'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# How Processes Work


    A primary function of the kernel is to create, manage, and delete (kill) processes.
    Linux is a multiprocessing operating system. That means that the Linux can carry
    out multiple processes at one time. Multiprocessing means that a process is activated
    until it needs a system resource, then it waits for the resource, and the next
    process in memory is activated. In a uniprocessing system like DOS, when the process
    is running needs a resource, the CPU is idle until the process gets the resource
    and starts running again.


    The kernel schedules the processes, determining which will run and what must wait
    in memory. The processes have weights, which determine their importance.


    Processes work independently of one another. If one process has a problem, it
    crashes in its own address space, and will not cause other processes or the operating
    system itself to crash. Processes that must interact with each other do so through
    the kernel, not directly.


    The kernel manages each of the processes to make sure that system resources are
    fairly allocated among all the processes. A system resource is something that
    a process needs to do its job. A system resource can be hardware, like the CPU,
    physical memory, or another device. It can also be software, like a file in the
    filesystem. Because of multiprocessing, your CPU and your memory are used more
    efficiently than in a uniprocessing system.


    A process exists in one of several states, which may include


    +   - Running

    - Waiting

    - Stopped

    - Zombie

    - Sleeping


    Every process has a process identifier, or pid. The pid is simply a number that
    identifies the process. You can see the pid number for all the processes assigned
    to your account by entering ps -a, as shown in Figure 14.1.'
  merge: -1
