  md: '# Getting Started with Red Hat Linux 7.0


    +   - The development of Linux continues to be dominated by people who have no
    commercial interest in Linux, but who do it out of sheer love. This means that
    many of the applications and tools are carefully designed and crafted works of
    art. Linux has a large, wide community of passionately developed users, testers,
    and documentors who are linked by email, IRC, friendship, and a fundamental commitment
    to making Linux the best and freest operating system and collection of applications
    on the planet.


    # # The Free Software and Open Source Movements


    Why does Linux have these attributes that proprietary software does not? How can
    being so inexpensive (some Linux distributions cost under $30) be good? To understand
    the Linux phenomenon, we must delve little into the history of two parallel and
    complementary movements in the programming world: the Free Software Foundation
    and the Open Source movement.


    ![](img/8a0e42659a358d95f558285b9f5bf854_29_0.png)


    > > For Richard Stallman''s history of the GNU Project, including reasons for
    starting the project, go to http://www.gnu.org/gnu/thegnuproject.html.


    Much of Linux came into existence because of a desire for free software. It is
    worth looking at exactly what the term “free software” means. The GNU Project''s
    definition of free software is fourfold:


    +   - The freedom to use the program for any purpose that you want

    - The freedom to examine and study the code of the program and to change it to
    suit your needs

    - The freedom to distribute as many copies of the program as you want, to whoever
    you want

    - The freedom to make improvements to the program, and to make those improvements
    public


    Free software does not necessarily mean software that doesn''t cost anything,
    a point that Stallman frequently emphasizes. The fundamental argument of the GNU
    Project and the Free Software Foundation is that software should be freely available
    to anybody who wants it, and that users of the software should be completely free
    to use, study, modify, and give away the software without restriction. The GNU
    General Public License is a'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'copyright that ensures the preceding freedoms for all GNU software. This copyright
    is referred to as “copyleft,” since its aim is to free use of the software, rather
    than restrict it.


    Free software differs in a fundamental way from open source, although the terms
    are often used interchangeably. Open source was a term that was coined when it
    became apparent in the free software world that there was business in the softare
    that was being developed in open communities, and that open source could be a
    winning business model. The open source community is much more practical in its
    stance on free software. The philosophy isn''t nearly as important as the usefulness
    and developmental superiority of the open-source development model.


    Eric Raymond wrote a series of essays on the open-source model, which he eventually
    published as a book, titled The Cathedral and the Bazaar, O''Reilly, October 1999.
    You can read the essays online at: http://tuxedo.org/~esr/writings/cathedral-bazaar.


    You may notice that this book, although about free software, is not copied itself.
    There is quite a lot of disagreement in the publishing and software worlds about
    how to copyright documentation. See Richard Stallman''s essay at http://www.fsf.org/philosophy/free-doc.html
    and O''Reilly''s response at http://www.oreilly.com/ask_tim/orabooks_os.html for
    differing on how computer documentation and publications should be copyrighted.


    # A Brief History of Red Hat


    Red Hat was founded in 1994, three years after Linus Torvalds posted his first
    kernel to the Us. Red Hat Linux is quickly emerging as the dominant Linux distribution
    for individual and enterprise users. Red Hat also holds a special place in the
    free software community because of the company''s commitment to the philosophy
    of free software and the value it places on the people who develop it.


    Red Hat provides support to many free software projects, including hiring developers
    full-time to work on projects. Red Hat has repeatedly pledged that only free software
    will ever be part of a Red Hat Linux distribution. Red Hat also holds 68% of the
    U.S. Linux market share (according to International Data Corp. (IDC) research),
    demonstrating that the values of the free software movement and financial success
    are incompatible.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Getting Started with Red Hat Linux 7.0


    Red Hat licenses all of its software under the GNU General Public License (GPL)
    and other similar licenses, which means the entire distribution is available to
    the open source/free software community. Most of the packages in Red Hat 7.0 are
    “copyleft” with the GNU GPL and the GNU Lesser General Public License (LGPL).
    These licenses are a way of copyrighting that guarantees Red Hat 7.0 will be freely
    distributable. Not only Red Hat 7.0 is copyleft, but any software that is made
    using Red Hat tools or based on Red Hat software is also freely distributable—in
    fact, it must be freely distributable, and the copyright is infringed upon.


    # What Is a Linux Distribution?


    You have probably seen that there are several distributions of Linux, such as
    Red Hat, Mandrake, Caldera, Corel, SuSE, Debian, and Slackware. A Linux distribution
    is the Linux kernel, combined with all the utilities, commands, applications,
    environments, and other programs that are included in an operating system. Different
    distributions are geared toward different users or kinds of hardware. Some distributions
    like Corel and Mandrake are geared toward those who prefer ease of use over configurability
    and control. Other distributions, such as SuSE and Slackware, favored by advanced
    users for their maximum flexibility and challenge. Debian is a popular distribution
    with those who insist on purely free software for philosophical reasons. Red Hat
    has the advantage of providing both maximum flexibility and configurability with
    ease of installation and use.


    You can get a Linux distribution by downloading it off the Web, with the CD-ROM
    that comes with this book, or by buying a shrink-wrapped software boxed set. You
    can also buy a computer system that has Linux preinstalled on from companies such
    as Dell, Gateway, and IBM. Most importantly, you can get a Linux distribution
    from a friend, or you can copy your CD-ROM and give it to all your friends.


    ![](img/8a0e42659a358d95f558285b9f5bf854_31_0.png)


    > Visit http://www.redhat.com, http://www.linuxmall.com, and http://www.cheapybytes.com
    for Red Hat and other Linux software.


    ![](img/8a0e42659a358d95f558285b9f5bf854_31_1.png)


    Although Linux itself is copyleft, not all applications are included with some
    distributions are copyleft. Be careful that you understand any licensing restrictions
    that may apply to different packages.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Once you install a distribution, you aren''t limited to the programs you find
    on the CD-ROM. You can download individual packages from the Web, install individual
    packages from the CD-ROMs of other distributions, or compile or install the source
    code for Linux programs that you get from friends. After you become familiar with
    Linux, you can even tinker with the source code to customize your programs to
    do anything you want them to do. In short, don''t think of your distribution as
    the final version of your Linux system, but as a jumping-off point. After you''ve
    installed your distribution, the universe is the limit...


    # # Summary


    In this hour, you learned the basics of how the operating system and your hardware
    work together to create a usable computing system. You learned about some advantages
    of using Linux, including how the General Public License makes free software.
    You also learned about Red Hat and other Linux distributions.


    # # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # # Q&A


    +   - Is it possible to download Red Hat Linux without paying for it?

    Absolutely. You can download Red Hat Linux 7.0 from the Red Hat Web site at http://www.redhat.com.
    In fact, even if you install Red Hat Linux 7.0 from the CD-ROMs that come with
    this book, you should periodically check the Red Hat Web for patches, updates,
    and new software.


    +   - Must applications that are created with copyleft software tools be free?

    No. There is a growing number of applications that have proprietary licenses attached,
    even though they were developed specifically for Linux. An example is Core''s
    WordPerfect Office 2000 for Linux. This isn''t necessarily bad, as some people
    would argue that such applications draw more attention and resources to Linux,
    although Richard Stallman probably would not agree with this notion.'
  merge: -1
