  md: '+   - /etc—The /etc directory has many configuration files that are used by
    your local machine.


    +   - /lib—The /lib directory contains files that are needed to execute the binaries
    in /bin and /sbin.


    +   - /lost+found—When fck is run, any files it can''t recognize or it doesn''t
    know what to do with end up here.


    +   - /mnt—The /mnt directory mount points for removable media such as your CD-ROM
    or your floppy. The actual directory looks like this: /mnt/cdrom floppy.


    +   - /proc—The /proc directory contains special files that extract or send information
    to the kernel. You can use the cat command to access information about the operating
    system in the /proc directory.


    +   - /root—The /root directory is the home directory of the root user. If you
    are not a superuser (su), you cannot gain to this directory. It should not be
    confused with the system root, /.


    +   - /sbin—The /sbin directory contains executable files used only by the root
    user. It also has files that are needed to boot and mount the /usr directory and
    for recovery operations. Be careful with this directory.


    +   - /tmp—The /tmp directory stores temporary files. Any user can store temporary
    files here. These files are removed each time the system is rebooted or shut down.


    +   - /usr—The /usr directory contains shared files or files that can be shared
    across a whole platform or site. This directory has its own partition (usually)
    and should be mounted read-only for obvious reasons.


    +   - /var—The /var directory is mostly used for variable data files such as spool
    directories, administrative and logging data, and temporary files.


