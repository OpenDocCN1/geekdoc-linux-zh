  md: '# 28 Hour 2


    Regardless of whether you choose to boot Linux with a boot disk or LILO, be sure
    to check Create Boot Disk. It can be invaluable if something goes wrong with your
    /boot partition or the Master Boot Record. Record to learn how to make your own
    custom boot disk, see the Boot Disk HOWTO at http://www.linuxdocs.org.


    If you have kernel parameters that you want to run whenever you boot Linux, enter
    them in the Kernel Parameters field. Most users do not need special kernel parameters.


    Finally, if you have a dual-boot system and will use LILO, choose the operating
    system that should boot by default. For example, if you want Windows to boot by
    default, highlight the DOS partition and choose Default Boot Image. A checkmark
    will appear by the DOS partition. Follow the same procedure if you want Linux
    to boot by default. Which default you choose, you will be able to boot into the
    other operating system by selecting dos or linux from the LILO menu when you reboot.


    # Creating the Root and User Accounts


    You must create a root account at the very least. A password for root that is
    easy for you to remember, would be difficult for others to figure out. If your
    computer will be connected to a network (this includes the Internet), selecting
    a secure root password is particularly important. The most secure password is
    a random collection of uppercase and lowercase letters and numbers.


    Unfortunately, random passwords tend to be the easiest to forget, so a good compromise
    is an acronym. For example, a good root password would be mFR66. This is an acronym
    for My Uncle Frank lives on Route 66. Choose a dictionary word or proper name
    for your password, or you will be asking for a cracker to break into your system.


    > Do not forget your root password. It will be extremely difficult, if impossible,
    to log into your system if you forget your root password. Write it down and keep
    it in a safe place (on paper, not in a file on a computer).


    In addition to the root account, you should create at least one user account for
    everyday work, and you can create as many accounts as you want installation. As
    you complete the information for a user account, click Add. The fields are cleared
    for the next user account. When you have finished adding your user accounts, click
    Next.'
