  md: '# Chatting for Fun and Profit on IRC


    IRC, which stands for Internet Relay Chat, enables you to communicate in real
    time over the Internet to other users all over the world. The media is full of
    references to chat rooms that are used for pornography, psychobabble, and lonely
    skies, so many serious people might be reluctant to use IRC. On the other hand,
    if you are having a problem or question that just can''t wait for an email or
    newsgroup response, if you want to hold a meeting with people in different geographical
    locations, or if you want to maintain an ongoing sense of community with people
    who share the same interests as you, you can''t beat IRC.


    ![](img/8a0e42659a358d95f558285b9f5bf854_194_0.png)


    People use “channels” to form chat groups based on a particular topic. The channels
    are formed on IRC servers, which you can connect via a chat client. X-Chat is
    the most widely used graphical chat client in Linux.


    # Task: Log in to an IRC Server Using X-Chat


    When you open X-Chat, two windows open: the Server List and the X-Chat window
    itself; both are shown in Figure 10.5. The servers are grouped by domain.


    +   1. To see the servers that are included in a particular domain, click the
    domain name to expand the server list.

    2. You can open the server list at any time during a session by clicking X-Chat,
    Server List.

    3. Before seeing a list of channels to join, you must log in to a server. You
    can log in to a server by selecting the server and clicking Connect.'
