  md: '# Setting Up a Simple Network


    one end and decrypting it at the other end. This is the process that creates a
    virtual tunnel between the two networks. This means that the data is inaccessible
    to virtual while in the virtual tunnel created by the encryption. This is why
    it is called a virtual network. It is virtually inaccessible. Figure 18.3 shows
    this basically works.


    ![](img/8a0e42659a358d95f558285b9f5bf854_319_0.png)


    Figure 18.3

    The virtual private network set up using the Internet.


