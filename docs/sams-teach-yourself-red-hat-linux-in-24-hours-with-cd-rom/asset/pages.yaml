    If your CD drive has been detected, you can check this very easily after the installation
    by looking in the /mnt directory. You see cdrom, floppy, and other devices listed.
    You can check /dev directory forrom, which should be listed there. If you have
    an ATAPI drive Linux should detect it without any problem.


    As mentioned times in this hour, before purchasing any product or device for Linux
    you should check the Hardware Compatibility set at the Red Hat site to see if
    it is supported. The subject of setting up and configuring a CD drive is extensive
    and would fill several chapters this size. The reason is that there are so many
    configurations, but in most cases you will not have any problems. In this section
    I will show you where to find the information you need if you have problems.


    If you do have problems with Linux recognizing your CD drive, read the CD-ROM
    HOWTO. This is readily available on the Internet and on your CD, and there are
    many books that cover the subject in its entirety. Your best bet is the CD-ROM
    HOWTO.


    If you are installing a CD-ROM drive for the first time, be sure the computer
