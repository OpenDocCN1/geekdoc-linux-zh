  md: "# What Every User Should Know About Security\n\nStanford Project site for more\
    \ information. Now that we have covered a lot of ground concerning network security,\
    \ it is time to find out what to do when you really are attacked.\n\n# How to\
    \ Tell If You've Been Violated\n\nIf you have taken all the precautions that you\
    \ can to protect your system you may think that you are safe. These precautions\
    \ include such as controlling user activity, instructing users in proper password\
    \ procedures, setting up a firewall, and monitoring your network on a daily basis.\
    \ Things seems to be going smoothly, no problems and nothing looks to be out of\
    \ the order. But how do you actually know that someone hasn't gained access to\
    \ your system?\n\nFortunately for you, the UNIX/Linux systems create all kinds\
    \ of activity logs letting you know what the system is doing. These logs are stored\
    \ in /var/log. You should looking through these on a daily basis, checking for\
    \ strange or unusual activity such as port scanners. One file that tells you if\
    \ your ports are scanned is the message file /var/log/messages. If you check each\
    \ morning you can tell if someone is scanning your ports. You can see some of\
    \ the directories in the /var/log directory in Figure 20.3.\n\nFIGURE 20.3\n\n\
    The /var/log directory contains many kinds of system log files.\n\n```\ndallas@localhost.localdomain:/var\n\
    [root@localhost]#* cd var\n[root@localhost]#* ls\nrmatch -gauss local log preserve\
    \ spool tap\ncache de-f lib lock nis run state yg\n[root@localhost]#* \n```\n\n\
    ![](img/8a0e42659a358d95f558285b9f5bf854_357_0.png)\n\nWhile you are inspecting\
    \ the /var/log/messages file, look for any failed attempts from unknown or unfamiliar\
    \ sources. These failed attempts (if they are pretty close together in time) can\
