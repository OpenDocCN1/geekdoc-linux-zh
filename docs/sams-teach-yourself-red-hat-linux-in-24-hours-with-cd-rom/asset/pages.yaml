  md: '# 190 Hour 11


    2. What is the difference between rpm -i and rpm -U?

    rpm -i will install only new packages. If you already have an older version of
    the package installed, rpm -i installs the newer version without removing older
    version. This can lead to complications in the future, if you want to install
    from source code. rpm -U installs a new package and removes any older versions
    of the software from the system.


    3. What is a dependency error, and how do you fix it?

    A dependency error occurs when a package you want to install requires another
    package to be installed first or requires files from another package to be installed
    first. To fix the error, install the package that contains the dependent files
    first, and then install the package you originally attempted to install.


    4. Must an RPM package have the extension .rpm to work?

    The actual filename of the package is unimportant as long as the package''s format
    and contents are valid.


    5. What does checking the signature of a package do?

    Verifies that the package actually comes from the source that it claims to come
    from.


    # Exercises


    +   2. Check the signature of a package from your Red Hat CD-ROM or one that have
    downloaded from the Web.


    +   3. Install and remove the package of your choice.


    # Exercise Answers


    +   1. Find the latest version of gnumeric at http://rpmfind.net. Is the version
    on your system current?


    Go to http://rpmfind.net and open the Index by Name or G. Look for gnumeric and
    note the version found in the RPM filename. Query gnumeric your system with the
    command rpm -q gnumeric*.


    +   2. Check the signature of a package from your Red Hat CD-ROM or one that have
    downloaded from the Web.


    Locate the package in GNOME File Manager. Right-click the filename or icon and
    select Check Signature. (Alternatively, enter rpm --checksig [package_name] at
    the command line).'
