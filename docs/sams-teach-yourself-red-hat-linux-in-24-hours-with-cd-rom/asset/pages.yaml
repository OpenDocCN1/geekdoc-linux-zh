  md: '# Quiz Answers


    +   1. Where are games installed on a Linux system?

    Typically, games that install during the initial Linux installation are found
    in the /usr/games directory. Most games that users install later go in the /usr/local/games
    directory. The easiest way to find out where a particular games is installed is
    to query its package in rpm or kpackage. Remember this works only if the games
    were installed from an RPM.


    +   2. How can you get help on a game you don''t know how to play?

    Almost every game has a man page, and many of the GNOME and KDE games have a Help
    menu option. Many of the more complex games also have a Web site where you can
    find additional information on how to play.


    +   3. What can I do to get Microsoft Windows-based games to run under Linux?

    Read the Web sites on dosemu and WINE. These packages change often and a lot of
    online help is available to assist you in getting your favorite programs to work.


    # Exercises


    +   1. Explore your /usr/games and /usr/local/games directories. Not every game
    makes it on the GNOME and KDE menus, and often you can find a few new things to
    play.


    +   2. Search on the Web for MUDs. More than a thousand are available, and you
    may find one you like.


    +   3. The next time you''re shopping for a game, see if it is available for Linux.
    You may prefer playing games in Linux.'
