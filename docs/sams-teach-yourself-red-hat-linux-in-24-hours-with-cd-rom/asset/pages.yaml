- img_proc: true
  md: '# Introduction to Linux Programming


    # Q&A


    Q Where is more information on gcc?


    A Start reading the gcc man pages, then look through other documentation. gcc
    is a very complicated compiler and the best thing to do is read the most current
    documentation available on it when you have a task to perform.


    Q Do C and C++ have any standards?


    A Yes, both C and C++ have an ANSI (American National Standards Institute) standard
    that defines the language. This is another good Web search to do on a rainy day.


    Q Why am I getting strange errors when I run make?


    A Make sure all indents are done with tabs. make is very picky about formatting,
    so make sure you follow the format.


    # Quiz


    +   1. What tools should you use if you have a very complex compile to perform?

    2. Where are examples of GTK+ programs?


    # Quiz Answers


    +   1. What tools should you use if you have a very complex compile to perform?

    The make will handle even the most complex compiles involving hundreds of source
    files.


    +   2. Where are examples of GTK+ programs?\GNOME is derived from GTK+, so take
    a look at your favorite GNOME application to learn more about GTK+ programming.
    You can also go to htp://www.gtk.org.


    # Exercises


    +   1. After you have read a little more on GTK+, adding an event handler for
    the simple widget we made earlier. Also, experiment with adding GTK+ widgets.
    It is always nice to have a little sample program to study new ones.


    +   2. Find a simple GNOME game you like. Download the source code for it and
    read through the source. You don''t have to understand everything, but it is a
    good thing to do as you learn to program. As your programming skills improve,
    try making small changes to the program.


