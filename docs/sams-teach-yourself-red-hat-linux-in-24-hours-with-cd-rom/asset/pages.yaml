  md: '# What Every User Should Know About Security 339


    It is never too late to close open ports that you missed or take actions that
    you might not have thought about to protect your system. You have to have an inventive
    mind and always be on the alert for new ways of doing things. There are a few
    things that you can do to prevent future attacks.


    You should have a good intrusion detection system installed, with Tripwire. If
    you haven''t already done so you should make sure your log files are written to
    a safe, secured server where they aren''t accessible to others. Always disable
    needless services, as we discussed earlier. Implement good user access levels
    and try to install the software across the entire network platform.


    > If you want to Tripwire, it is not hard to find. Search for Tripwire with your
    favorite Web browser or go to the site http://www.tripwire.com/.


    ![](img/8a0e42659a358d95f558285b9f5bf854_359_0.png)


    You should remember to keep your users informed about the system, but only tell
    them what they need to know. You will need to inform the company executives or
    others directly responsible for the network. They should be told everything you
    may end up in court if the intruder is caught. The reason for being honest with
    them up front is that you will need their support and their money should they
    decide to press charges against the person(s) who broke into the system.


    There is a wealth of information about network security on the Internet. Here
    are a few things you can visit for more updates and news as well as other information:


    +   - CERT (Computer Emergency Response Team) at http://www.cert.org/

    - COASTIAS ... at http://www.cerias.purdue.edu/programs.html


    +   - COAST (Computers Operations, Audit and Security Technology) at http://www.cs.purdue.edu/coast/


    There are various newsgroups, hacker newsgroups and Web sites to search. The hacker
    newsgroups have some good, valid information but you have to be careful because
    some of these people aren''t informed as you may be led to believe. But then again,
    some are are. So, the secret to maintaining some kind of sanity here is to keep
    auditing and monitoring your system, make sure your virus software is up to date,
    and most important of all, keep informed.'
