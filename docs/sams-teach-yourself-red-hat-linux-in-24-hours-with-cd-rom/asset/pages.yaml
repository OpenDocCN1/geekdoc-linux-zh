  md: '# Q&A


    What are the two most popular shells?


    +   People use a lot of different kinds of shells based on their needs, desires,
    preferences, and requirements. The two most likely candidates are bash, which
    is based on the Bourne shell, and ksh, which is based on the Korn shell. The csh
    shell and all its variations is not far behind these two.


    +   How do you assign a value to a variable in a shell?


    +   In most of the shells available for Linux, including bash, you can assign
    a value to a variable simply by typing the variable name followed by the (=) sign
    and giving it a value. It looks like this:


    ```

    weekday=3

    You should be sure that there aren''t any spaces on either side of the equals.

    ```


    +   Are you worrying to finish a much-needed script but you can''t remember some
    of the options for a command. How do you get help on the command using bash?


    +   You type the command like this: ls --help | less. The first word is the command
    followed by a space and then --help | less.


    +   Is the shell a command interpreter, a programming language, or all three?


    +   A Unix/Linux shell is understood to be both a command interpreter and a programming
    language. It only interprets the script and it is not compiled. You can run a
    script very easily by entering the name of the shell and then the name of the
    file. For example, bash dallas.


    +   As systems administrator, I need a way to see who is logging on the system.
    I don''t know how to program the system, is there a simple way to do this?


    +   In there is always a way. It may not be simple but in this case it is. Put
    the watch command in a simple script file with the following syntax:

    set watch=<user> <terminal>

    This is an example of using the command:

    set watch=(elabeth baker)


    If you don''t remember how to write a simple script file please check how you
    did it in the chapter.


    # Quiz


    +   Name four Unix or Linux shells that were discussed in this hour.


    +   Which Unix or Linux shell is based on the Bourne shell?'
