  md: '# Using the Visual Editor VIM


    FIGURE 5.1


    The VIM screen is simple and complicated.


    ![](img/8a0e42659a358d95f558285b9f5bf854_91_0.png)


    # VIM Modes


    After you''ve created a new file in VIM, by trying the word “deluxe.” Nothing
    appears, and you might even hear some annoying beeping sounds as you type each
    letter. You can''t just start typing in VIM; you must be in the right mode. VIM
    has many modes, but the three most important are the Command mode (also called
    Normal mode), the Insert mode, and the Command-line mode.


    ![](img/8a0e42659a358d95f558285b9f5bf854_91_1.png)


    > Command mode and Normal mode refer to the same mode. Because they are used interchangeably
    in the VIM documentation, both terms are used in this chapter.


    When you first open VIM, you are in the Command mode. In Command mode, VIM interprets
    everything you type as a command to VIM. There are commands to move the cursor
    around, to delete text, to search, and to copy and paste. There are also commands
    to save your work and to quit. Not every letter on the keyboard stands for a command;
    if you type a letter that cannot be interpreted as a command in Normal mode, you
    might hear a beep, otherwise nothing happens at all.'
