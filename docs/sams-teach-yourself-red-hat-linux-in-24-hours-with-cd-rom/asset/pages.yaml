    # HOUR 9


    # Connecting to the Internet Part 1


    Today, no computer system is complete without Internet access, particularly Linux
    systems, because the Linux community is based on mailing lists, newsgroups, chat
    rooms, and Web sites. Also, Linux applications tend to be released every few weeks,
    usually through an FTP site. Of course, you don''t need to be networked to use
    Linux, but you would be selling yourself short if you weren''t. In this hour you
    will learn the basics of networking and how to connect to the Internet. In the
    next hour, you will learn how to use the Internet in Linux.


    In this hour you will


    +   * Get a very basic introduction to TCP/IP networking

    * Network over a telephone line by learning how modems work with PPP protocol

    * Gather information you will need to connect to your ISP

    * Set up /etc/resolv.conf, /etc/hosts.allow, and /etc/hosts.deny

    * Connect to your ISP using wcdial and the Red Hat PPP Dialer'
