  md: '# Linux Applications


    ```

    http://www.redhat.com

    ```


    The Red Hat download page contains the RH distribution, as well as applications
    by category, errata, patches, and security advisories. The download page is found
    at http://www.redhat.com/apps/download/


    The Red Hat Web site also contains all the Red Hat documentation, archives for
    earlier distributions, developer and user information, and useful Linux links.


    # Using wget to Download Applications


    When you have found an application that you are interested in, you must download
    and install it on your local machine. There are several tools you can download
    applications. Later in this hour, you will see how you can download and install
    an RPM package in one step, saving the RPM to your hard drive. If you want to
    save the RPM file to your hard drive, however, a small utility wget can be your
    best.


    wget is a useful utility for downloading large files, particularly if you have
    an unstable dial-up connection. If your connection is lost during download, wget
    will read the portion of the file that was already downloaded when the connection
    was lost. When wget reconnects where it left off. You can also run wget in the
    background, and when wget finishes downloading the file, it terminates itself.
    Best of all, wget prints a dot to the screen for each 10KB of data it downloads,
    and it shows the percentage of download complete so you can watch its progress.


    To use wget, you must know the complete URL pathname of the file you want to download.
    You can get the URL via Netscape and use wget to perform the actual download.
    From a command prompt, type wget `[url pathname]`. For example


    ```

    $ wget http://freesmart.net/projects/devchanger/download/changer_200002021.tar.gz

    ```


    You can create a file of multiple URLs for wget to download, and you can specify
    a particular directory to download (wget saves the file in the current directory
    by default). See the wget pages for more options.


    # The RPM Package


    As you will see in Hour 23, installing new applications from source code can be
    a rewarding experience, even for someone with a lot of knowledge and experience.
    RPMs make it easy for anyone to add and remove software. An RPM package takes
    all the files you need to run a piece of software, including the application itself,
    library files, documentation, and configuration files, and puts them into one
    file. An RPM package contains information about what is included in the package,
    what files the package will install on the computer and where they will go, as
    well as the instructions on how to install and uninstall itself.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '182


    Hour 11


    In addition to installing and uninstalling, RPMs enable you to make sure that
    your packages are installed correctly—that there are no missing or altered files
    and everything is installed where it''s supposed to go. RPMs also enable you to
    verify that a package is actually installed. This is called querying the package.


    # The RPM Package Filename


    The RPM package filename tells you about the package. The RPM filename apache-1.3.12-20.i386
    is used here as an example. The first part of the package is the name of the software
    that the RPM package contains, which in our example is the Apache server. Next
    comes the version of Apache, 1.3.12 is a dash, followed by a 20. This is the package
    release number, which signifies the number of times the package was released for
    the same version of Apache. Thus, this is the twentieth RPM to be released for
    Apache 1.3.12. New RPM builds for the same software version are usually made to
    fix bugs that were found in the package itself. Package release numbers start
    at 1. Next, the i386 signifies that this RPM package was built for an Intel 386
    platform or later. The .rpm tells us that the file is an RPM package.


    # Task: Installing an RPM Package


    To install an RPM, follow these steps:


    +   1. Enter the command

    `rpm -i [package_name]`

    2. To upgrade an RPM (recommended even for new installations), enter

    `rpm -U [package_name]`


    When installing a package, either by the -i or -U options, RPM follows these steps:


    +   1. The RPM installer checks for dependencies. Many software packages require
    files that are not included in the RPM, but that are in another package. The RPM
    installer makes sure that all required files are present in the system. It also
    checks to make sure that the package to be won''t replace files that are needed
    by other packages that are already installed.

    2. The RPM installer checks for conflicts. Conflicts occur, for example, if you
    try to install a package that is already installed or if you attempt to install
    an older version of a package when the newer version is already installed. Another
    example of a conflict is if the package installation will overwrite a file that
    is needed by another, already installed, package.

    3. The RPM installer runs any needed scripts or does any other tasks that must
    be performed before installation.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Linux Applications


    +   4. The RPM installer looks on your system for any customized configuration
    files that are already present for the application. If the RPM installer finds
    a custom configuration file, it will try to overwrite it, but it will make another
    config file with a slightly different name in case you decide to use the RPM''s
    configuration file instead of yours.


    +   5. When everything is in place, the installer packs the actual software files
    and installs them where they belong. The installer also sets permissions for the
    files according to the instructions in the package.


    +   6. After the installation is complete, the installer performs any required
    post-installation tasks, such as running a cleanup script or ldconfig, to make
    new shared libraries accessible.


    +   7. The RPM installer adds information about the newly installed package to
    the RPM database.


    ![](img/8a0e42659a358d95f558285b9f5bf854_203_0.png)


    > The actual name of the RPM package isn''t important to the installer. For example,
    if you download an RPM package during a Windows session and the RPM name is truncated
    or otherwise altered, you can still install the package with no problem.


    You can install an RPM package via FTP, without downloading and saving the package
    to your computer. Enter the RPM command, followed by the URL where the package
    is located:


    ```

    # rpm -Uvh http://www.redhat.com/swr/apache-1.3.12-2.i386.html

    ```


    The package will install directly from the download site.


    # Useful RPM Switches and Options


    RPM comes with a lot of switches and options that slightly alter the default behavior
    of the command, enhance the command, or provide status reports. In fact, you can''t
    use the RPM without at least one switch to tell the command you want it to do.


    Most people use RPM with the -Uvh to install, as well as update packages. -U means
    to update any older packages for the same software and install the package if
    no earlier version exists. -U fulfills the same function as -i, and you don''t
    have to worry whether you already have an earlier version installed.


    The -v switch tells RPM go into verbose mode, which it prints a status report
    for each RPM installed. You can get more information by telling RPM to be verbose,
    with the -vv switch, as shown in Figure 11.1. Usually, however -v is sufficient.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# FIGURE 11.1


    With -vr, the RPM installor reports on everything it does to install the package.


    ![](img/8a0e42659a358d95f558285b9f5bf854_204_0.png)


    The -h switch tells RPM to print hash marks as it installs the packages. The hash
    marks assure you that the package is indeed, successfully installing. After fifty
    hash marks are printed, the package is installed.


    Common options are as follows:


    +   - --test Performs all the checks that RPM performs before installing a package,
    but stops short of actually running a preinstall script and doing the installation.--test
    is useful for determining whether the package you want to install has unmet dependencies.

    - --replacepkgs Installs the RPM even if the RPM is already installed. This option
    is useful if you think files from the original installation have been damaged.

    - --replacefiles Installs the package if the package will replace files of the
    same name that have already been installed from a different package, such as an
    earlier version of the software. You shouldn''t use this option unless you are
    sure of the results.

    - --nodeps Installs the package without checking for dependencies. First do not
    use nodeps unless you are sure or don''t care about the results.--nodeps is useful
    when you are installing beta software for testing.'
  merge: -1
