  md: '# Perl


    If there is one scripting language you heard of before trying Linux, odds are
    it''s Perl. Perl stands for practical extraction and report language. It was developed
    in the mid-1980s by Larry Wall. Perl gained great popularity as a language for
    CGI programming-on the Web. It may be an interpreted language, but it has immense
    capabilities that allow many tasks to be greatly simplified. It has gained popularity
    in most areas of software- and network administration. There are even interpreters
    available for Windows-based systems.


    The important thing to understand about Perl is that it is probably the closest
    thing to an all-powerful language currently available. It takes care of most of
    the annoying language details others leaves to the users, as declaring variable
    types and memory allocation. It has absorbed the best features of most of the
    programming languages. With an eclectic variety of features there is more than
    one way to do just anything in Perl. A common joke is that you can do anything
    with three lines of Perl code. While this is an exaggeration, once you learn Perl
    you will realize it is only a minor exaggeration. Unfortunately, while a language
    wielding this power makes it easy to do any task, it is just as easy to shoot
    yourself in the foot and make things ridiculously hard.


    If you decide to use Perl for, I highly recommend investing in a few good books
    on and consulting the resources online. The Web site is http://www.perl.com and
    from there you can access many other helpful Perl sites. You can also download
    the latest source code and packages. Before going any further, find out what version
    you have. The easiest way to do this is to type perl -v-. The version with Red
    Hat 7.0 is 5.6. It is very important to know which version of Perl you have because
    there are no guarantees of compatibility between versions. If something fails
    when you move a Perl script from one system to another, that is the first thing
    to check.


    Perl supports almost every control and looping construct. It can access any shell,
    which makes it popular with many network administrators. Another advantage of
    using Perl is to process binary files. This is a weakness that stops Linux commands
    including sed and awk. To see an example of Perl accessing the shell, try Perl
    21.2.


    # LISTING 21.2 Accessing the Shell with Perl


    ```

    #!/usr/bin/perl

    # test.pl lists the contents of a directory

    $curr_dir = ''pwd'';

    @listing = ''ls -al'';

    print "Listing for $curr_dir";

    ```'
