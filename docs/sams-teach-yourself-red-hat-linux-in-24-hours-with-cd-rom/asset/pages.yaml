    or don''t think about when designing computer systems. It is actually one of the
    most effective ways to protect your equipment. If a burglar breaks into your home
    or business the first thing they will go is for your computer equipment, especially
    if you have something that they can sell and make a few dollars from.


    Protect the outer perimeter of your property. If a burglar or other people can
    get in, you will suffer many losses. One way you protect your property is to keep
    it well lighted on the outside and the inside. Lighting is fairly cost effective
    and it is easy to install. In itself this will deter most people to do some mischief.


    You can also install burglar alarms, closed-circuit television (CCTV) systems,
