  md: '# How Linux Works with Printers


    Linux isn’t much different than any other operating system when it comes to printing
    something, depending on the program that you are printing from. It seems that
    most users want to set up a printer first thing when they install a new operating
    system. This is understandable because a printer allows them to produce something.
    In this part of the hour we will discuss which printers work with Linux as well
    as how to print


    # Will My Printer Work with Linux?


    Under most circumstances, you can get your printer to work with Linux. The quickest
    way to find out if your printer is compatible is to visit http://www.redhat.com/support/hardware.
    You can find the Linux Printing HOWTO at http://www.picante.com/-gtaylor/pht.


    # Details about Using Printers with Linux


    Every printer that is connected to your computer (or any computer, that has matter)
    has to have a driver. Remember that a printer is a device like a floppy disk and
    Linux needs some essential information before it knows it is and what to do with
    it. The driver is just a program (which we talked earlier) that allows the Linux
    kernel to communicate with the printer. Ghostscript drivers are used mostly days
    to drive printers. Ghostscript emulates Adobe’s PostScript language and supports
    its Portable Document Format (PDF). You can find out about Adobe at http://www.adobe.com.


    If your printer is supported by the Ghostscript layer, it is probably capable
    of working nicely with your Linux operating system. Macmillan publishes many excellent
    books that give you tours of information. One book that I get a lot out of is
    Special Edition: Using Red Hat Linux 6.2. Another wonderful source is Red Linux
    Unleashed 7.0. These are the best books that you can buy. I still have Unleashed
    books that are more than five years old that are still accurate to some degree.
    Of course, the best bet in determining printer compatibility is the Red Hat it
    itself. You will find most of what you want there.


    Under Linux, the printers are set up with the following device names, descriptions,
    and addresses. This information will be important when you are installing your
    printer(s).


    | Name | Description | Address |

    | /dev/lp0 | First parallel printer | 0x3bc |

    | /dev/lp1 | Second parallel printer | 0x378 |

    | /dev/lp2 | Third parallel printer | 0x278 |'
