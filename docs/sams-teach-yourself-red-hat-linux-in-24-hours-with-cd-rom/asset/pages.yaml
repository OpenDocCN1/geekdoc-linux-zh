    to be taken lightly! Also, with a little sense you can greatly reduce your risk
    of problems. Before you ever begin to split a partition, make sure the disk has
    been scanned for bad sectors and defrmented (immediately before doing so!) In
    Windows 9, you will find the disk defragmenter under Accessories, System, Disk
    Fragmenter. If you cannot find one in your current operating system, you should
    be able to find one in the many Internet shareware archives. Disk Defragmenter
    will move all of the data to one portion of the partition, so the remainder of
    the partition will be empty and can be split off without damaging anything. Many
    partition tools do this themselves, but it is better to be safe than.


