    # Virtual Private Networks (VPNs)


    In this part of the hour we will define virtual private networks (VPNs) and what
    they mean to the security of your network or LAN. You will also be guided through
    the phases of setting up a virtual private network you should choose to do.


    One of the biggest issues with networks is security. A virtual private network
    can offer added security for your system because it creates a tunnel of security
    across a public network such as the Internet.


    The basic concept of a virtual private network is to have a firewall set up over
    your LAN, which enables you to communicate with another LAN that is also protected
    by a firewall. This provides a virtual tunnel of protection between the two systems
    across a public network.


    Virtual private networking is just a private network connection established over
    a public networking connection such as the Internet. This process involves encrypting
    the data at'
