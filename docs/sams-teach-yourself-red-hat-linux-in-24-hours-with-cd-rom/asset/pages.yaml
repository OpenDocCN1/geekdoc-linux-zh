    # Configuring the Kernel


    In the past, when you wanted to add support for a piece of hardware to your kernel,
    you had to compile the kernel. Now, there are loadable modules for many devices.


    A loadable module is a piece of kernel code that is not directly linked to the
    kernel. Instead of compiling the module as part of the kernel, you compile it
    separately, then insert it into the kernel as it is running. Many device drivers
    are now loadable modules, so you can get a device driver without recompiling the
    kernel.


    Why would you want to recompile the kernel? Even if you can load modules without
    recompiling, you would have to recompile to add new security or other bug fixes,
    or for some new devices that don''t have loadable modules. If you never recompile
    the kernel, you will have to wait for a new release to take advantage of changes.


    Get rid of device drivers that you don''t need. The kernel is loaded into memory
    when you boot, and it stays. The memory taken up by the kernel cannot be used
    by other programs. If you have a bunch of device drivers for devices that you
    don''t have, it wastes space. Also, the kernel is upgraded all the time, and the
    only other way to get the new kernel if you don''t upgrade the kernel directly
    is to wait for a new distribution release. Newer kernels have more device drivers,
    which means more support. They might have better process management or run faster,
    more stable, or include fixes for bugs from earlier versions.


    The major place to get kernel source is ftp.kernel.org.


    The kernel is compiled with the C compiler, gcc, which we discuss in Hour 23,
    "Compiling and Installing Applications from Source Code." Before you consider
    upgrading, check the documentation that comes with the patch or to make sure it
    is worth your time to upgrade.


    Also, check Linux Unleashed, by Bill Ball, for a detailed discussion on upgrading
    the kernel. Read the Linux Kernel HOWTO for instructions on configuration and
    upgrades. Read the Linux Kernel Guide for more information on the inner workings
    of the kernel. This guide is fascinating reading if you want to learn more about
    how your operating system really works.


    ![](img/8a0e42659a358d95f558285b9f5bf854_249_0.png)'
