  md: '![](img/8a0e42659a358d95f558285b9f5bf854_391_0.png)


    # HOUR 23


    # # Compiling and Installing Applications from Source Code


    Up until now everything you have installed on your system has been in an RPM (Red
    Hat Package Manager) package. RPM packages are a great way to distribute and install
    software and they are extremely popular. However, not every piece of software
    you want may be available in RPM format. Maybe you want to try the latest version
    of a program that no one has built a recent package for or an early beta of a
    new program that has never been made into a package. Perhaps the RPM install failed
    or you need more control over the install.


    If any of the above is true you will have to install the software from a tarball.
    This chapter will discuss every step in a tarball install. However, every tarball
    install is slightly different, so this chapter will concentrate on the general
    procedures and answer as many “what if” questions as possible. Before diving into
    the tarball install, let me emphasize one thing: *You must read the directions!*
    This is not the neat, fully automated procedure that an RPM install is.'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'In this hour you will


    +   - Learn exactly what a tarball is

    - Understand the steps in the install process

    - Extract files from a tarball

    - Configure a Makefile

    - Compile and install source code

    - Clean up after the install

    - Uninstall a tarball


    # # A Tarball Is Not a Ball of Black Goo


    What is a tarball? It is not made of tar, it is not a ball, and it is definitely
    gooey. The tar comes comes from the tar (tape archive) tool that is used to create
    a tarball. For the ball, thinking of all of the files for a program on pieces
    of paper. When you have to move them from one place to another, you would really
    want to deal with all of the files individually? Odds you wouldn''t. It would
    be easier to put all the files in an envelope or, in this case, roll it into one
    big ball. Instead of decompress the program in a ball and throw (ftp) it to anyone
    who wants it.


    The only difference between a tarball and a ball of paper is when you extract
    the files. Obviously when you extract a file from the paper ball it will come
    crumbled, whereas extracting a file from the tarball will give you a perfect copy
    of the file and you can extract it as many times as you want. You can recognize
    a tarball by its .tar extension. But, at this point, we are only looking at an
    archive. Nothing has been compressed, so the tarball is actually a larger size
    than the size of the files it contains. It is not desirable from storage standpoint
    and is certainly undesirable for Internet distribution purposes. Nobody wants
    to download a 50MB archive over a dial-up connection.


    The answer of, is to compress the archives. You can do this with the gzip command
    on tar archive, which creates a file with .gz ending, or compress the files using
    tar''s options when the archive is created, which typically has a .tgz ending.
    If you come from a Windows background, you are probably familiar with zip, rar,
    or arj files. They are based on the same deidea. In fact, the Windows utilities
    pkzip and Winzip can process .tar files. With a little searching I am certain
    you can find other with similar capabilities.'
