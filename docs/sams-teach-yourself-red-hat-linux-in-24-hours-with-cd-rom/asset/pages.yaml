    +   - Convert serial data that is being received to parallel data

    - Convert parallel data that is to be transmitted to serial data


    Data inside the computer is in parallel. When you want to send data over long
    distances to a telephone line, it is necessary to convert the parallel data to
    serial data so it can fit on one wire—namely, the telephone line. The serial port
    uses a chip called a UART (Universal Asynchronous Receiver Transmitter) to convert
    bytes from parallel to serial. The UART is found on the motherboard or on an internal
    modem card.


    The serial port receives 16 bytes of data from the modem at a time. If it is receiving
    data, it also has to send the data that it just received to memory. As data is
    transmitted to memory the buffer is emptied, and new data can come from the modem.
    This process is called flow control. The speed at which your modem can process
    the data is one of the factors that limits the speed at which you can receive
    data from the Internet.


    ![](img/8a0e42659a358d95f558285b9f5bf854_169_0.png)


    > Internal modems don''t connect to a serial port via the wires and the serial
    port. The computer can''t tell the difference between a real serial port and the
    internal modem''s "virtual" port, so essentially, internal modems work the same
    way as external modems.


    To summarize, when you send an email to a friend, for example, the email message
    (which is a collection of ones and zeros that can be transmitted digitally) goes
    from the hard disk on your computer, through the transmit pin of the serial port,
    to the modem. The modem converts the message into an analog signal, which is like
    a sine wave. The email, in analog form, travels along the phone line to various
    places (including your ISP and your friend''s ISP). The modem on your friend''s
    computer receives the analog email through its receive pin, converts and demodulates
    the signal back to a digital signal, and displays it on your friend''s screen.


    # The Serial Port Number


    Each serial port has a name that distinguishes it from all other serial ports.
    This way, your computer has a “address” for each device (piece of hardware) that
    is connected to. Every device has a name, which is included in the /dev/ directory.
    In Linux, serial ports are named tty* in sequence; for example, tty0, tty1, tty2,
    and so on.


    # I/O and IRQ Addresses


    Along with serial port number, the serial port has two other addresses, the I/O
    address and the IRQ address, which are important to configuring your modem. The
    I/O address tells the computer the location of the serial port. Each serial port
    number has an'
