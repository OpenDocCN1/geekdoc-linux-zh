  md: '# HOUR 6


    # XFree86—The Linux Window System


    The X Window system is a graphical interface designed to provide the user with
    a more pleasing and easy-to-use computing environment. When you install the Red
    Hat Linux system, you are given the option to install the X Window system. When
    the installation process starts you will have several options. You can perform
    an install that includes both GNOME and KDE or you can elect to install the one
    you choose. Most wisely choose to install both GNOME and KDE. You get more games
    to play and you have much versatility by using both managers. Without the X Window
    system and a window manager, you are left with the system (shell) prompt.


    In this hour you will learn about the X Window system. It is important that you
    understand what it is, how it works, and what it can do for you.


    In this hour you will


    +   - Discover what the X Window system can do for you

    - Choose your monitor

    - Configure XFree86


    ![](img/8a0e42659a358d95f558285b9f5bf854_105_0.png)'
