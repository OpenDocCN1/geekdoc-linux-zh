    7.echo -n "Please enter another login name.

    8.read logname

    9.done

    ```


    Of course this little script could be run where a user needs root access to get
    into one of your programs, but it is just example. There are other conditional
    loops that you can use but these will get you started. For more information about
    conditional loops and statements, see the bash reference manual and the Bash-Programming
    HOWTO on your CD or look for it on the Internet. bash is a versatile language.
    You can learn a few commands and start writing scripts immediately. Of course,
    this will make you hungry enough to look for more information.


    If you want to find out more about bash, look at some of the related HOWTOs at
    http://www.redhat.com/support. Following are some other interesting sites you
    can visit:


    http://www.gnu.org/manual/bash/index.html (See Figure 15.3.)'
