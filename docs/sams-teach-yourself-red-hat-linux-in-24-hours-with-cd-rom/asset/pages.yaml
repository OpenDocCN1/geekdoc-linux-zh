  md: '# What Every User Should Know About Security


    (File Transfer Protocol) and Telnet are open to security problems because those
    protocols are weak in the authentication areas, which makes them insecure. Since
    most networks use these protocols, SSH was developed to provide a more secure
    protocol for accessing other computers on a network.


    SSH is an excellent alternative to FTP and Telnet because it provides secure shell
    or file access to your computers. Currently, it can replace Telnet, FTP, login,
    ssh, and rep. There are two versions available at the time of this writing: SSH
    1 and SSH 2. Here is basically how SSH works in a nutshell:


    +   - RSA is a public/private key for authentication. SSH uses this type of authentication
    to identify users.


    +   - When you set up an SSH server, it creates two keys: public and private.
    The private key is used locally while the public key is shared with those who
    log to the server.


    +   - A client logs to the SSH server and the host''s private key, which it received
    either from a trusted source or directly from the SSH server (host).


    +   - The client needs to verify that it is communicating with the host so and
    it sends a random message to the SSH server. The message is encrypted with the
    public key. If the message contains the same key that the host has, they will
    be able to communicate. The host will read the message if the key is correct and
    send it back to the client. The client knows that it is talking to the correct
    host.


