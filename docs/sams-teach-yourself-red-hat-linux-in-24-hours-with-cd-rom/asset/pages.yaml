    # Quick and Dirty Networking Concepts


    When you connect to another computer via a communication line, you are networking
    your computer. It doesn''t matter whether you are connecting to an ISP server
    for its files, dialing in directly to another computer to access its files, or
    adding your computer to a private network of servers and workstations—the basic
    concept is the same. Every network has a few similarities. Every computer, or
    host, needs a method of being uniquely identified in the network—an address. You
    need some medium by which communication can travel, such as a phone line or fiber-optic
    cable. You need a set of standards and communication practices that all computers
    in the network understand—a protocol. You also need a device that can translate
    the signals inside the computer into signals that can travel on the communications
    wire, such as a modem or an Ethernet card.


    ![](img/8a0e42659a358d95f558285b9f5bf854_166_0.png)


    | Some modems will not work with Linux. The section "Not Every Modem Works with
    Linux" discusses modems that will not work with Linux, and how to tell what kind
    of modem you have. |


    Because this chapter deals with networking with that is done over a telephone
    line via a modem from a client (your computer) to an ISP service provider, it
    assumes that your network is a client connecting to an Internet service provider.
    The communication medium is an ordinary telephone line connected to a modem. The
    protocols are the TCP/IP protocols and the PPP and SLIP protocols.'
