  md: '# Setting Up a Printer and Other Devices


    In Linux, you will notice several references to "root," such as the root password,
    the root directory, and the root account. Don''t let this confuse you. It is just
    another way of referring to different aspects of the root structure.


    When you need to operate on-the-fly, you can just type # su at the command prompt
    or in a terminal window. You should not forget to log out when you finish doing
    an operation as root. Staying in root too long can be extremely challenging.


    Let''s take a look at the root account and how it is set up. If you aren''t logged
    in as root, do so and enter your password. If you end up at the command prompt
    (#), then you are where you want to be. You should see something like this:


    ```

    root@localhost /#

    ```


    This means you are in the right place.


    If you aren''t in the root directory, cd to it and type ls to see directories
    branch off the root directory. You should see several directories with names such
    as these:


    ```

    # bin dev home lost+found mnt proc sbin tmp var

    ```


    Let''s take a look at some of the other useful directories in Linux. You can cd
    to each directory and do a dir or find out more than I tell you in one hour. Here
    is how you can do it:


    ```

    root@localhost # cd sbin

    ```


    By typing in cd (changes to directory specified) sbin, you will be in the sbin
    directory. When you are in the directory that you want to be, type ls or dir to
    see what is in that directory.


    The Red Hat filesystem looks something like the following. You can use the cd
    command to look in each directory in the Red Hat filesystem. Here are the most
    commonly used directories:


    +   - /boot—The boot directory contains the Linux Kernel and LILO files needed
    to boot the system.


    +   - /home—This is your home directory, which contains directories and files
    that you need.


    +   - /dev—This contains filesystem entries pertaining to devices that are attached
    to the system. You need to have these files installed in order for your devices
    to be recognized or for the system to function properly.'
