    # Creating the Linux Partitions


    As you will learn in Hour 3, “Linux Basics,” and Hour 4, “Exploring the Red Hat
    Filesystem,” a Linux system contains a standard directory structure in which the
    kinds of files are stored. There are several major directories, including /, (the
    root filesystem), /etc, /boot, /home, /usr, and so on. If you click on Point in
    Disk Druid, you will see a drop-down menu of each of the basic filesystems in
    Linux. You can create a separate partition for each of these filesystems, or you
    can create one partition for the root filesystem, and the other directories will
    reside on the root partition.


    Without getting into too much detail, it is generally not a good idea to put your
    Linux system into one root partition. It makes it more difficult to install a
    new system later (in later chapters we will discuss re-installing versus upgrading).
    Also, if something goes wrong with one of the partitions, it makes it harder to
    recover data from the other partitions, particularly the home directory. On the
    other we don''t want to get too complicated in our partitions, because there is
    so much more to learn.'
