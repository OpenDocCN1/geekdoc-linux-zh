- img_proc: true
  md: '# Creating and Editing Files with VIM


    In this hour you will


    +   * Edit and create new files in the Visual Editor Improved (VIM)

    * Use the move commands to move around in a file

    * Add and delete text to a file

    * Undo edits and search for text

    * Write (save) changes and quit VIM, and learn where to get more help on VIM


    Some Linux users are turned off from vi because it is not the most intuitive tool
    to use. On the other hand, vi is simple, small, fast, and once you understand
    the basics actually isn''t hard at all. vi is the Unix equivalent to edit in DOS.
    The vi used in Red Hat Linux is actually called VIM, and you consider it vi Improved.


    > If you type ubuntu at the VIM welcome screen, you can read about the Uganda
    Kibaale Children''s Fund, which is used to help orphan children in Uganda. Bram
    Moolenaar, who was the main creator of VIM, donates any money that is made from
    VIM to the orphanage, and he asks that if you like VIM, you consider donating
    to the Fund.


    ![](img/8a0e42659a358d95f558285b9f5bf854_90_0.png)


    To opening a file in VIM, enter vi, followed by the name of the file. If you''re
    not in the directory where the file is located, you must enter a full pathname,
    such as vi /usr/share/myfile or vi ../myfile:


    ```

    $ vi myfile

    ```


    The file is displayed in VIM, ready for editing.


    To create a new file in VIM, enter vi, followed by the name of the file:


    ```

    $ vi myfile

    ```


    An empty VIM screen appears, with tilde running down the left side, as shown in
    Figure 5.1. The tildes signify that the line is empty, to distinguish an empty
    line from a line that contains a space. VIM treats a space just like any other
    character, such as "a" or ".'
