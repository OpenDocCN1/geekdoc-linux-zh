    ![](img/8a0e42659a358d95f558285b9f5bf854_84_0.png)


    If you look carefully at the beginning of the ls -l output, it looks like one
    long string. To understand the meaning, you should mentally divide the permissions
    into four sections. The first section describes the type of file in one character.
    You have already learned that a directory contains a d and a symbolic link contains
    an l. An ordinary file contains a dash (-) in the first section. The next three
    sections are three characters each, and display the permissions for the three
    user categories.


    Linux classifies three kinds of users for a file: the group that the owner belongs
    to, and everyone on the system.


    +   * The *owner* is the user who created the file.


    +   * Users on the system can float around as individuals, or be gathered into
    groups. A *group* is a collection of users who are working on certain files together.
    For example, if you have a team of programmers working on an application, the
    team members should be able to share each others'' work, without being able to
    access personal files. The group must have access to each others'' files, but
    not want anyone else on the system to have access. By setting permissions, you
    can prevent unauthorized users from gaining access to your files, enabling members
    of the group to share with files.


    +   * The last set of permissions pertains to *everyone* on the system.'
