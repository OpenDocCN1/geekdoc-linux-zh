    # C


    Now that you know about the tools that are available to aid in development, it
    is time to move onto the actual programming. And where better to begin the discussion
    of Linux programming than the C language? C truly is the language of Unix. Most
    of the original variants of Unix and Linux were written in C. C was originally
    developed by Dennis Ritchie as a successor to the B language


    Unlike the scripting languages introduced earlier in this book, C is a compiled
    language. That means the code you write is parsed, analyzed, and translated into
    an executable machine form before execution. This is handled by a compiler such
    as gcc.


    C programs are composed of functions. A function is a logical grouping of operations
    to perform a task. This could be computing an equation, printing information to
    the screen, or any other imaginable. A function receives data in the form of arguments,
    manipulates the data, and returns the result. When you invoke a function, it is
    known as calling the function. In addition to being called, functions can also
    call other functions or they can call themselves. When one function calls another,
    it is known as nesting.


    Nesting means that one function was executing and paused now another function
    is running inside of it. To begin, the traditional Hello World program in Listing
    24.3. Type it in with your favorite editor and save it as hello.c.'
