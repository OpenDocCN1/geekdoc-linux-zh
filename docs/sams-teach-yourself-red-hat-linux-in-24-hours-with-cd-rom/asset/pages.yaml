  md: '# Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you’ve
    learned in this hour.


    # Q&A


    +   Q I heard the tclTk stuff was on the Scriptics site. What happened?

    Q Scripts changed names to Ajuba Solutions. You can find its Web site at http://www.ajubasolutions.com.

    Q I installed a copy of Python from http://www.python.org. Why do I keep getting
    errors when I try to run any scripts?

    A If you install Python manually, a few options have to be set. Consult the Python
    documentation and make sure all paths are set.


    # Quiz


    +   1. You need to scan binary files for information. Should you use awk?

    2. Can you use widgets in tcl?

    3. What makes Python such a good prototyping tool?


    # Quiz Answers


    +   1. You need to scan binary files for information. Should you use awk?

    No, awk cannot process binary files. If you have to process binary files, use
    Perl.

    2. Can you use widgets in tcl?

    No, tcl only understands tcl. It does not understand the tk toolkit that the widgets
    are a part of. If you want to use widgets, you have to use wish.

    3. What makes Python such a good prototyping tool?

    Python can mimic the object-oriented behavior of languages like C++ and the code
    is very easy to read. This allows the prototype to be very thorough and easy to
    translate into compiled code.


    # Exercises


    +   1. Write an awk to scan system logs for a particular type of entry or for
    the entries from a particular user and display the results.

    2. If you are interested in Perl, study the sample scripts that are available
    from http://www.perl.com. Try to understand a new script every day. With patience
    you will master Perl.'
