  md: '# Quiz Answers


    +   1. What should you do before splitting any partition?

    Back up all data, scan the hard drive for bad sectors, and defragment the hard
    drive.


    +   2. Why is WINE faster than VMware?

    WINE implements the Windows API, whereas VMware simulates an entire computer running
    Windows. WINE does not suffer from the overhead that VMware does. Of course, in
    return WINE has to address a lot of Windows-to-UNIX differences that VMware does
    not have to deal with.


