  md: '# Compiling and Installing Applications from Source Code


    Q The configure script failed. What do I do?


    A configure script checks to see if everything necessary is available to build
    a program. Something probably was not available. Check the output of the script
    to find out what. Then locate the appropriate files, install them, and try again.


    # Quiz


    +   1. If the configure script runs successfully, is there any need to watch for
    missing dependencies or programs?

    2. Will there always be a make install option?

    3. Why isn’t be an RPM available for this program?


    # Answers


    +   1. If the configure script runs successfully, is there any need to watch for
    missing dependencies or programs?

    configure is good for catching a lot of potential problems, but it is far from
    fool-proof. As you saw in the example in this chapter, the script ran successfully,
    but a problem was still encountered with a library.

    2. Will there always be a make install option?

    There is no requirement for make to have an install option. Although it is quite
    common, it is also possible to have a an install or an install-sh script instead.

    3. Why isn’t be an RPM available for this program?

    The latest development version of any program will be available in tarball. It
    does not make sense to keep rebuilding RPMs if the package is changing 3 or 4
    days. Generally, RPMs are only made once a package is fairly stable and most of
    the development is done.


    # Exercises


    +   1. When you have some free, explore the program listings on GNOME site further.
    Pick one or two additional programs and try them from a tarball.

    2. If you are building anything from a tarball, it is almost guaranteed you will
    be using make. So take some time to read the online documentation on make. A good
    place to start is http://www.gnu.org/manual/manual.html.'
