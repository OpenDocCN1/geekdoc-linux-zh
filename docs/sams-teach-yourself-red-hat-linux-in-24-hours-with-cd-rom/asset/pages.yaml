    # # The Paradigm Shift


    Many people are scared away from Linux because they think it''s difficult to use.
    Linux is only difficult if you don''t understand that Linux comes with power and
    freedom. You have more power to do things you want to, and you have more freedom
    to do tasks in different ways. With power and freedom comes responsibility to
    learn a little bit about the reasons why you do things. In the end, you can open
    up to you, and using your computer will be a lot more fun and hassle-free than
    you were forced to use Windows.


    When you use Linux, you communicate with your computer in a different way from
    when you use Windows or Macintosh. In Windows, 99% or more of the commands you
    give and the messages you receive are done via graphical user interface, or GUI.
    You point on a button with mouse, click it, and something happens. It is possible
    to open an MS-DOS prompt and give commands the old-fashioned way in DOS, but you
    are strictly limited in what you can accomplish. For almost every task in Windows,
    you must use the graphical interface.


    In Linux, this is not the case. There is a graphical user interface in Linux called
    X, and it looks a lot like Windows. You point your mouse to a button or menu item
    and click to give a command. An example of X running the GNOME desktop environment
    is shown in Figure 3.1.


    The difference with Linux is that for every task you perform with a mouse within
    X, there is a direct and usually more powerful way to do the same task by typing
    a command on the keyboard. When you type a command on the keyboard, you are usually
    in a shell environment (or shell, for short), and the place where you type the
    command is called the command line. The shell environment is pictured in Figure
    3.2.'
