- img_proc: true
  md: '# Hour 10


    Unfortunately, some users take advantage of the relative anonymity that Usenet
    provides to post rude, angry, irrelevant, or otherwise obnoxious messages. Please
    remember that when you post a message to Usenet, you are participating in an ongoing
    conversation with fellow human beings, and the normal rules of etiquette still
    apply. For a really useful but also amusing piece on netiquette, see Brad Templeton''s
    Dear Emily Postnews http://www.templetons.com/brad/emily.html.


    ![](img/8a0e42659a358d95f558285b9f5bf854_192_0.png)


    # Downloading Files with FTP


    FTP, which stands for File Transfer Protocol, is used for transferring files and
    directories between computers via a remote connection as PPP. You can use the
    text-based FTP client at a shell prompt, or you can use a graphical FTP client
    as gFTP. Because gFTP makes life so much easier than the text FTP, this section
    describes it in detail Following are some of the things you can do with FTP:


    +   * Upload files to another computer.

    * Download files from another computer.

    * Compare directories on your computer to those on another computer.

    * Manipulate files on a remote computer, including changing permissions, copying,
    and moving files.

    * Edit files on a remote computer.


    > FTP means to transfer files from your computer to a remote computer via a network
    connection. Download means to transfer files from a remote computer to your computer
    via a network connection. To download anonymously-mously means you don''t need
    to have a recognized username and password on the remote computer to log in and
    download files.


    ![](img/8a0e42659a358d95f558285b9f5bf854_192_1.png)


    # Task: Use gFTP to Upload and Download Files


    You can think of using anonymous FTP as if you were a guest on another person''s
    computer. You are allowed to look in certain directories, but most are private.
    You can read and download files, but you can''t manipulate files and directories,
    you can''t move files around, and you can''t can''t edit files.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Using the Internet


    When you establish an FTP connection with a remote site that gives you full permissions,
    that computer''s filesystem becomes an extension of your own. You can copy, move,
    delete files and directories. You can create symbolic and hard links. You can
    open and edit files or upload new files to the remote filesystem.


    +   1. The quickest way to connect to an FTP site via anonymous login is to enter
    your connection information into the Connect toolbar.


    +   2. Click the Connect button.


    +   3. To make a connection with a username and password, enter them into the
    fields on the Connect toolbar. If you leave them blank, gFTP will attempt an anonymous
    login by default.


    +   4. In the left pane, browse to the local directory where you want to download
    or upload a file.


    +   5. In the right pane, browse to the directory where you want to download from
    or upload to.


    +   6. Click the arrow left to download, or click the arrow right to upload.


    gFTP is shown in Figure 10.4.


    Figure 10.4

    gFTP is a useful and easy-to-use tool for uploading and downloading files.


    ![](img/8a0e42659a358d95f558285b9f5bf854_193_0.png)'
