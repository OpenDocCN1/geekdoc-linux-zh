  md: '# Hour 2


    If you choose to enable dead keys, you will have to type certain characters, as
    the tilde, semicolon, and quotation marks, twice to make them appear. If you plan
    to do a lot of programming or word processing, this could become annoying.


    Next, select your mouse. If your mouse model does not appear as a choice in the
    menu, select PS/2 or Serial Generic Mouse, with either three or two buttons. If
    you have a two-button mouse, be sure to check Emulate 3 Buttons.


    Unix mice have three buttons, whereas PC and Macintosh usually have only two.
    When your mouse emulates three buttons, you can click mouse buttons together to
    emulate a third button. This can be an invaluable tool, particularly in X.


    If you have a serial mouse, enter the serial port location and device name. Serial
    ports are named differently in Windows than in Linux, so the equivalent Windows
    name for the serial ports is listed next to the Linux name. For example, COM1
