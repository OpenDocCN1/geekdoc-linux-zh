  md: '# Setting Up a Simple Network


    # IP Masquerading


    IP Masquerading is also known as Address Translation and involves preventing crackers
    from accessing the system by making the legal internal (IP) address invisible
    to them. This technique simply hides the internal network addresses so that the
    users'' addresses aren''t apparent to outside prying eyes.


    IP Masquerading works by connecting a computer to the Internet service provider
    (ISP) and assigning a legal IP address to the computer. The legal IP address is
    then translated into internal network addresses that are not legal Internet addresses
    or known to the Internet. Anyone else on the Internet can see the legal address,
    the rest of the addresses are invisible and unobtainable. A legal Internet address
    looks something like this: 200.50.66.30.


    Every packet that is sent out by the machine doing the masquerading is relabeled
    with its own IP address. This appears that all packets come from one machine.
    The masquerading machine will stamp all incoming packets with non-legal Internet
    addresses of machines on the internal network. These packets are then routed to
    the correct address or machine. This may sound confusing if you read this over
    and absorb the information in the Linux VPN Masquerade HOWTO, it will become more
    apparent. You will find the Masquerade HOWTO on the Red Hat at http://www.redhat.com/.
    Look under Support/Creating a Firewall. There is a lot of information relating
    to creating VPNs, firewalls, and masquerading.


    This subject is extensive and has several HOWTOs written on it. You can check
    your Red Linux 7.0 CD or search the Internet for more information. The Red Hat
    has some information in Support that will help you to set up your Masquerade server.
    By using masquerading and firewalls, you can have a more secure private network.
    In the next section we will look at firewalls a little more closely.


    # Setting Up a Firewall


    A firewall is software that is installed on a computer to block unwanted traffic.
    You can download firewall programs from the Internet for your use on your computers.
    Most of these a decent job, but the type of firewall you need to protect your
    LAN is a little more complicated.


    A firewall essentially authenticates or verifies the logins of people who attempt
    to access your system. One of making a firewall is to make the firewall part of
    a small, separate network that exists between the router and the internal network.
    These kinds of firewalls usually have two network cards. This is called a sandbox.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'This network usually has a separate concentrator that routes packets from the
    router through the separate concentrator to the first card in the firewall. These
    packets are checked to see if they are legal and allowed to use the internal network.
    If they can''t be authenticated, they are discarded. If authentication information
    is valid, they are routed through the second network card in the computer, which
    allows them access to the internal network.


    That kind of firewall is well and good a better way to do it is with a proxy server.
    If your network runs TCP/IP (and most do), each computer has a unique address.
    These addresses allow crackers access your internal network. How do you do this?
    Proxy servers are the answer because they make the IP numbers invisible to the
    outside world.


    A proxy server exists between the internal network and the external network acting
    as a solicitor that edits all incoming and outgoing traffic. You must configure
    each computer''s TCP/IP software to look for a proxy server at a specific IP address.
    When a user clicks on a link for a Web page, the data packets aren''t sent directly
    through the firewall and to the Web site. The proxy server intercepts the internal
    computer''s request and sends a request for the same resources that the user used.
    The trick here is that the request comes from the proxy server IP address and
    not from the internal computer. Anyone outside the internal network sees only
    the address of the proxy server and not any of the internal computer''s IP numbers.


    The proxy server intercepts or receives incoming packets, notes the IP address,
    and routes them to the user added. There are many different types of firewalls
    and many software packages that implement them. This is growing by leaps and bounds.
    You can set up a complicated firewall on your single home computer or set a proxy
    server to protect your entire LAN. The different types of configurations are enormous.
    It would be impossible to discuss all this information in one single hour.


    There are numerous HOWTOs and other information out there you specifically how
    to set up the particular type of firewall that you need. I suggest you check Red
    Hat''s own site before anything else. Look under Support for the section on Firewalls.
    Another useful site is http://www.linuxfirewall.org/. This is the official site
    of the Linux Firewall Project, which has the latest information on firewalls.


