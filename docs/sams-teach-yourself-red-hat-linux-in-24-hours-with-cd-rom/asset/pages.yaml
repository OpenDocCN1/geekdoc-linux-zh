    ![](img/8a0e42659a358d95f558285b9f5bf854_120_0.png)


    > Please not confuse terminal windows, virtual consoles, and desktop switching.
    They are all different worlds. Terminal windows allow you to access the shell,
    such as bash; virtual consoles are windows within your desktop; and desktop switching
    deals with changing from one window manager to another. Another you may be switching
    from GNOME to KDE.


    You should not confuse terminal emulators with terminal programs. Terminal emulators
    are programs that emulate a computer terminal and provide the means for the CPU
    or computer to talk to the computer monitor. These were and used mostly by mainframes;
    once they were called “dumb terminals because they consisted mostly of a terminal,
    a keyboard, and a mouse. They do not have the electronics to do anything other
    than what the software allows them to do.


    You may want to run various programs such as word processors, spreadsheets, community
    programs, and shells from an Xterm window. If you want to find out more about
    terminal programs, check out GNOME, KDE, and other window managers. Hundreds of
    term programs are available free over the Internet, especially where Linux is
    concerned. Now let''s take a better look at the virtual desktop.


    # The Virtual Desktop


    The Red Hat Linux 7.0 distribution allows you to install many types of great window
    managers. The two most popular desktop managers are GNOME and KDE. The virtual
    desktop that these two window managers (and other managers) provide you with specific
    attributes and features that enable you to control what you see and do using them.'
