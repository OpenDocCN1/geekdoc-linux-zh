  md: 'Although monitoring and auditing your system on a daily basis can go a long
    way toward protecting your system and detecting intruders, you still need to pay
    attention to other areas. When a user has left the company or has been terminated,
    always make sure he is immediately removed from the system. You should keep a
    list of past passwords and never let anyone use them. You might even write a script
    that will compare passwords with old ones and detect any matches.


    I mentioned earlier that physical security was extremely important. To be sure
    your users are trained in how to handle their machines and passwords. Be sure
    they turn off the machines (shutdown) at the end of each shift and that they don''t
    leave passwords taped to them.


    If you see a lot of violations, you can expect some kind of an attack and you
    should be on guard for it to eventually happen. In this section you learned what
    to watch for in order to determine if your system has been violated, but it is
    up to you to constantly monitor your system and make sure that users are doing
    their part for security. In the next section you will spend some time taking action
    once you have discovered a break-in.


    # # What to Do After a Break-In


    The action that you take after a confirmed break-in is determined by what kind
    of break-in occurred. If it was a virus attack, you should shut down all of the
    computers on the network until you can determine what kind of virus was used.
    Sometimes you can use virus software to remove the virus and restore your system.


    Some types of viruses are much more destructive and you may have to replace CPUs,
    hard drives, or even entire systems. In this event you will probably have to replace
    most equipment and restore your system from backup tapes or other media. You should
    make sure your programs are running and the virus is securely removed before restoring
    your data. You can save a lot of work.


    If a cracker has succeeded in getting through an open port, you should make copies
    of all your log files. This serves as evidence in the case the cracker is caught
    and you have to go to court. You should also document everything that you can.
    In most situations these log files can help you track the person(s) who got into
    your system (if they haven''t messed with the log files and covered their trail).
    Your documentation and copies of your log files can be the only evidence in helping
    to track down the culprit and putting them where they need to be.


    Only after you are sure that everything is documented should you delete your log
    files that have been tampered with. You should back up the entire system, especially
    files that show tampering was involved, before deleting files or closing ports.'
