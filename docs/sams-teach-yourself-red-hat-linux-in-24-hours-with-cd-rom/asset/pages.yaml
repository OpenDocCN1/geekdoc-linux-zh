    # gawk


    gawk (GNU awk) is one of the newest implementations of the awk programming language.
    awk was developed by Alfred V. Aho, Peter J. Weiner, and Brian W. Kernighan in
    1977. The name of the language comes from the initials of its last names. There
    are plenty of other versions of the awk language available too, such as awk, nauk,
    and POSIX awk. There are usually multiple implementations of each version of the
    language.


    21'
