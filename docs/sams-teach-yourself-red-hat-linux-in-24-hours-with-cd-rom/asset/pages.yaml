    # Playing Commercial Games


    A long time ago, DOOM was ported to Linux. After Quake came along, it was ported
    to Linux. Since then, many of the popular first-person shooters have been ported
    to Linux. However, it does not end there. Many new games in other genres, such
    as Civilization: Call to Power, were developed for Linux and Microsoft Windows
    at the same time. Many software firms are beginning to see the potential of Linux
    for gaming; hopefully in a few years, all the major games will be available for
    Windows and Linux simultaneously. But now, a great place to start looking for
    what is currently available is http://www.linuxgames.com and by asking your local
    retailer.


    Obviously not every game has been ported, and yet may never be ported. So what
    do you do if your favorite games are not available for Linux? Some people did
    not wait for their favorite games to be ported, so some hardworking developers
    set out to create WINE in 1993. WINE is an ongoing effort to implement the Windows
    APIs over an X-based Linux environment, which allows Microsoft Windows applications
    to run under Linux. Although it might not support all the latest applications,
    it has enormous success with many popular programs that may never get ported.
    In fact, the current database of supported applications contains more than 2,000
    entries. To learn more about WINE, go to the main page at http://www.winehq.com.
    You can find out the latest news on WINE and how to configure it for your system.


