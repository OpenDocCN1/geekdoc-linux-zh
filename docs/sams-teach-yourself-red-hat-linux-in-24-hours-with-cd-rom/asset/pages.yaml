  md: '# Restricting Network Access


    Security starts with the users whether you are on a single PC or on a network.
    You can set up your user accounts in linuxconf to give users the privileges that
    they need to get the job done while restricting them from areas that they don''t
    access to. Refer to Chapter 17, “Using linuxconf and Graphical Administration
    Tools,” to find out about setting up your user accounts where security is an issue.


    There are many other steps that you can take to protect your system from intrusions.
    Some of these can be as simple as educating your users as to how to properly select
    a password. Have you ever noticed people in companies and offices that have their
    password written on a sticky note and stuck on their computer screen for everyone
    to see? These are the types of things that you need to look for as a network administrator.
    All a cracker needs one password to get into your system.


    You can also control what your users do by controlling permissions that you grant
    when they create their accounts. You will normally use linuxconf to set up these
    accounts as previously discussed. You should never give a user more rights and
    privileges than he actually needs to do the job.


    linuxconf is a valuable tool that you can use to control your user accounts and
    therefore enhance security on your system. You should check the linuxconf log
    file on a regular basis to see any strange activity that might be occurring. You
    currently have two log files: Boot messages and LinuxConf log under the Options
    menu.


    A few ago when the Internet was relatively new, every company gave each of their
    users access to the Internet. The recent attacks on Web sites and networks, companies
    have wisely chosen to restrict this access to only those people who needed it.
    This is a good idea because it prevents problems on both ends (especially if it
    is through an intranet, which is just a way of connecting your network to the
    Internet). You may get some complaints, but that is better than having to deal
    with a lot of problems caused by unauthorized access to your system.


    Crackers and others can sometimes gain access to your network by searching for
    an open port on your system. Most networks have many open ports or places where
    someone can get in and as the systems administrator may not know it. You can think
    of ports as the different parts of your computer, an open doorway into your system.
    If you want to use your monitor, you access a serial port (usually). You access
    the printer port (usually LPT1 or LPT2) to use your printer. If you want to access
    the Web port access 80, which is the HTTP protocol port.


    You can find ports that the computer is aware of but may not be using by looking
    in the /etc/services file. So now that you know people are scanning your ports
    looking an'
