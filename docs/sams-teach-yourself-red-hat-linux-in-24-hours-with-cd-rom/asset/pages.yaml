    you first open VIM?

    Command (Normal) mode, insert mode, command-line mode, and replace mode. When
    you first open VIM, you are in Command mode.

    2. Can you open VIM without entering a filename? What appears if you do?

    Yes, the VIM welcome screen appears.'
