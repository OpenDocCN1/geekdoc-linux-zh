  md: '# Compiling and Installing Applications from Source Code


    # Clean Up


    It is important to clean up after you build and install a program. Of course it
    is always a good idea to make sure the program runs before cleaning up; otherwise
    you may be making more work for yourself. At this point you have a bunch of partially
    compiled files lying around and an extra copy of the program. While these would
    save compile time later, they also eat a bit of hard space. There are two ways
    to clean up. You could make `clean` to delete all of these files and leave only
    the source code, scripts, and documentation behind, or if you are certain you
    don''t need the source code you can just delete all of it. Remember, you still
    have a copy of the tarball lying around you. If you don''t see any need for it
    and you want to free up some space, delete it too.


    Figure 23.3

    Bombermaze is pure counterproductive fun.


    ![](img/8a0e42659a358d95f558285b9f5bf854_399_0.png)


    # Uninstalling the Application


    After playing with a piece of software for a while, you may decide that you do
    not want it, or in this case, lose too much time to it. You need to know how to
    uninstall the program. Since this is not an RPM-based install it is not a simple
    matter of running `rpm -e`. To begin, consult the documentation that came in the
    tarball.

    it may have been quite a while since you installed the program, so it is important
    to remember all of the details. Some packages provide an uninstall script or an
    option in a'
