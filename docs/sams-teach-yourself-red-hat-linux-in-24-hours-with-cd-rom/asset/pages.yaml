    that your computer can receive and process the information. Converting signals
    from digital to analog and back to digital again is the purpose of a modem.


    Instructions are sent from the computer to the modem in the form of commands.
    Commands are sent over the same data line that the modem uses to receive and transmit
    information. Communications software works by getting input from you via text
    or graphical interface and then using the input to send the proper commands to
    the modem. For example, when you type in the phone number to dial your modem,
    the ISP, dial-up software uses that phone number as input for the dial-up command,
    ATDT, to the modem. The actual command is that it is sent to the modem is ATDT5551234.
    The initialization string that is sent from the dial-up software to your modem
    is a command or series of commands used to configure the modem for dialing.


    > Learn more, check your modem manual for a list of common commands for your modem.
