  md: '# 72 Hour 5


    To enter text into your file, you must be in Insert mode. You enter Insert mode
    by typing an insert command. After you type the insert command, anything you type
    afterwards is inserted into your document. You must also type an insert command
    before you type any text in a new file. You will learn some common insert commands
    in the next section.


    When you want to save your file and quit VIM, you must be in command-line mode.
    In command-line mode you enter VIM a command to perform some action on the entire
    file. This is different from command (Normal) mode, where commands are applied
    to the contents of the file. You enter a command in command-line first by making
    sure you are in Normal mode, then typing a colon, followed by a command.


    > People have trouble with modes when they first use VIM. In some versions of
    VIM, there is no way to tell which mode you''re in until you type something. INSERT
    appears at the bottom of the screen in insert mode, and REPLACE appears when you''re
    in replace mode. In command-line mode, the colon appears at the bottom of the
    screen. There is no default message for Normal (command) mode.


    # Moving Around in a File


    VIM has dozens of different commands for moving around in a file, but we will
    discuss just a few of the most useful commands in this hour. To use any of the
    move commands, you must be in Normal mode from any other mode, press Esc.


    > If you''re ever unsure of which mode you''re in, press the Esc key to bring
    you back to Normal (command) mode.


    The most basic way to move around a file in VIM is to move one character at a
    time using the arrow keys. In theory, you could use only the arrow keys to move
    around the file, but it would be like typing with two fingers.


    The h, k, l and j keys work like the arrow keys, but faster. Type h, k, l or j
    to go up, right, and down, respectively, as shown in Figure 5.2. You can type
    a number before a h/k/l/j key to move number of spaces or lines. For example,
    to move 5 lines down, then 7 lines up, you would type 5j, then 7k.


    Once you get used to them can move very fast with the h/k/l/j keys, especially
    when you can use them without ever taking your eyes off the screen.'
