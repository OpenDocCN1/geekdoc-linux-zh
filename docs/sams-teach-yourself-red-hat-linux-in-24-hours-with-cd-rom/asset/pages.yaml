  md: '# Booting Linux


    When you boot Red Hat Linux 7.0, the system processes several files that you need
    to keep your ever-watchful eye on to what is happening. It is during this bootup
    process that you will be able to see error messages and other indications that
    something is wrong. You can see that things are going right too, which is even
    better. If you see an error message, write down what the error was and any codes
    that might be associated with it. This can help you to diagnose and fix the problem
    later. The one thing that I would like to emphasize in this chapter is the importance
    of monitoring your system and looking at log files on a regular basis. You can
    save yourself a lot of trouble doing that.


    ![](img/8a0e42659a358d95f558285b9f5bf854_272_0.png)


    You can monitor your system on a frequent basis if you are running GNOME. Click
    on the Main menu, and select System, System Monitor. This is a wonderful graphical
    interface that will let you monitor what processes are running and other useful
    information.


    Let''s take a look at the initialization process. When your computer boots up
    it goes through a process of gathering information just like any computer normally
    does. Linux uses startup scripts to prepare your system for use. Red Hat Linux
    goes through a series of initialization steps called runlevels, which start with
    runlevel 0 and generally end with runlevel 6, which is reboot.


    You can see what levels your system uses by looking in the /etc/initab file, which
    is an initialization table. This table contains various commands to instruct Linux
    how to boot the system. The first startup script is /etc/rc.d/rc.system which
    is called the system initialization script. This file is run once at boot by the
    init file. The primary role of the init file is to create processes from the script
    stored in /etc/initab starts as the last step of the kernel booting; it is the
    first command that configures and initializes your system for booting. We won''t
    go into a lot of detail on how this file works, but you can look at its contents
    using a text editor.


    If you watch how your system is booting and watching the messages, you will know
    whether your computer has a clean bill of health. This means that you can spend
    more time working on your computer and less time fixing it.


    How do you keep your computer booting healthy? One of the things you need to do
    is sure that you shut down the system correctly and make sure the filesystems
    are dismounted correctly. The next part of the hour will take a look at filesystem
    administration.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Administering the System


    # Filesystem Administration


    Your Red Hat filesystem is normally organized with a place for everything and
    every- in its place. The trouble occurs when things get disorganized and out of
    place. As the person responsible for your computer system, you must learn to keep
    everything organized or you will have problems later on. One thing you can do
    is create a directory in your /home directory to store your personal files. You
    can do this with mkdir command. Simply change directory (cd) to your home directory
    and while you create the directories that you need. For example, if your name
    is Elizabeth, create a directory called liz in your home directory with the command
    liz. Now you have your own personal directory to save your personal files.


    You have learned a lot about the Red Linux filesystem in other parts of this book,
    but we will cover a few more things that you may have missed. If you forget something,
    please feel free to turn back the pages.


    # Mount Filesystems


    In Linux, when you want to access a filesystem you have to mount it by the mount
    command. When you need to supply the system with what device contains the filesystem,
    what type it is, and where in the directory to mount it. The mount command syntax
    looks like this:


    ```

    mount [-t type] [-o options] device mount-point

    ```


    > Linux filesystems are much different from DOS- and Windows-based systems. When
    you are finished using a device such as a floppy over Linux, you should unmount
    (umount) before removing the floppy. The same is true for the CD-ROM and other
    devices. This may be hard to remember after repairing a damaged filesystem or
    device a few times the message comes through. The main reason for unmounting a
    device under Linux after you have been using it is that you are in the process
    of writing something to it, it may not be saved to the floppy (in particular)
    until after you have unmounted it. The kernel may be busy and may not have time
    to schedule the write to the device.


    The mount point must be an existing directory or you will get an error. In order
    to mount a floppy that uses the vfat filesystem you would type the following:


    ```

    # mount /dev/fd1 -t vfat /mnt/floppy

    ```'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'The filesystem information is kept in the /etc/fstab file, which is created
    when you install Linux. If the filesystem information that you want to mount is
    stored correctly in /etc/fstab, you only need to specify the mount point or the
    device name. When you use the mount command it reads this information from the
    /etc/fstab file. When working with filesystems it is very important to know how
    to correctly mount and unmount them. You can see a simple example of the mount
    command in Figure 16.1.


    # FIGURE 16.1


    An example of how to execute the mount command.


    ![](img/8a0e42659a358d95f558285b9f5bf854_274_0.png)


    You probably love working from the command prompt, but using the User Mount Tool
    can save you some time and energy. You can use it to both mount and unmount Linux
    filesystems. You access the User Mount Tool by clicking on the Red Hat Linux menu
    and choosing System, Disk Management. You can see this in Figure 16.2.


    # FIGURE 16.2


    The User Mount Tool allows you to mount and unmount filesystems under Red Hat
    Linux 7.0.


    ![](img/8a0e42659a358d95f558285b9f5bf854_274_1.png)


    The User Mount Tool works just like the mount command because it gets its information
    from the /etc/fstab file. Don''t forget that you can mount and unmount yourystems
    from the command prompt if for some reason you don''t have access to the X Window
    system.'
