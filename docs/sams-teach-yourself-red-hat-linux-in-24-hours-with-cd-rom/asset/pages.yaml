    # # Reading Output with the cat and more Commands and Using Ctrl+C


    To view the contents of the file, we can use the cat command. Cat is short for
    concatenation, because you can also use to combine the contents of two or more
    files.


    ```

    $cat XF86Config.eg

    ```


    This is a big file! This file is so big that it streams by too fast for you to
    read it. To slow down the cat command so you can read one screenful of a long
    file at a time, you can pipe the cat command to the more command:


    ```

    $cat XF86Config.eg | more

    ```


    When you use a pipe in Unix, that means to execute one command, then apply the
    results of the first command to the second command. In this way, you can build
    pretty powerful commands using smaller commands string, or piped, together. The
    more command simply means display the output one screenful at a time. To scroll
