  md: '# Quiz Answers


    +   1. Which protocol actually forms the Internet network?

    IP—the Internet Protocol


    +   2. What does the IP address do?

    It uniquelyely identifies every host on the network.


    +   3. Why do you need a modem to connect to the Internet via a telephone line?

    Modems convert digital signals to analog and back again, so that data can travel
    over a phone line.


    +   4. Which kind of modem will most definitely not work with Linux?

    A winmodem


    +   5. What is the name of the daemon that controls your PPP connection?

    pppd


    +   6. Name the configuration file that must be created and edited before you
    can use

    wvdial.

    /etc/wvdial.conf


