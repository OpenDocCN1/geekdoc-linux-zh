  md: '# Setting Up a Printer and Other Devices


    # Summary


    This hour covered a lot of subjects that are important to knowing and using Linux.
    You should have a better understanding of what device drivers are and how they
    relate to the Linux hierarchy. We covered some issues dealing with filesystems
    and printers, as well as how to mount and unmount various devices. You learned
    a few things about how to set up a printer and how to get more information on
    installing Zip drives, CD-ROMs, and other unsupported devices.


    # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # Q&A


    +    When I attempt to access my floppy drive I get a message saying “the major
    device number is wrong.” What do I do?


    +    A Something happened to change the major device number or the device file
    in /dev is missing or damaged. Look in the /dev directory to see if the floppy
    file is there. You will be looking for device drivers that relate to your floppy
    drive as fd0 or fd1. Run linuxconf as root to check the drive’s permissions and
    then (if linuxconf doesn’t correct the problem) run install or upgrade again to
    see the problem is corrected.


    +    I need to format a disk to use the Linux ext2 filesystem I don’t know what
    to use. What command will allow me to do this?


    +    A You can use the fdformat command to format an ext2 filesystem.


    +    I’m trying to format a floppy disk using the User Mount Tool but it doesn’t
    it. What is wrong?


    +    A You probably need to mount it first. Just click on Mount (if it isn''t
    already mounted) and then try formatting it. If this doesn’t try another disk.


    # Quiz


    +    1. What tool or utility program is best to configure your printer?


    +    2. What is the definition of a mount point such as /home?


    +    3. What is the command sequence to mount your floppy from the command line?'
