  md: 'Following is a list of some of the more important log files that you can review
    using a text editor. For more information, consult your HOWTOs and other books
    on the subject.


    +   - /etc/syslog.conf--This file defines where logs and most messages are routed.
    Use this to find other important logs. You can use the cat command to view it
    by entering $ /etc/syslog.conf.

    - /var/log/messages--These are most administrative-type files.

    - /var/log/mailog--This contains mostly mail files.

    - /var/log/bootlog.log--This shows boot-up information.

    - /var/log/secure--This is a security related log.


    All of these files can give you important information about security, bootup information,
    and various other system information that can give you clues to how your system
    is functioning.


    # Making Backups


    No one can deny that making backups is essential to the safe operation of any
    system, whether it is a single PC or many PCs on a network. You have to be sure
    that the system files, programs, and data are backed up on a timely basis in order
    to restore the system it should crash.


    Most standardized Linux distributions do not have regular backup programs with
    them. There are still little utilities such as the GNU tar that you can use to
    backup your system.


    Probably the first choice that you need to do is make a decision as to what kind
    of media you will use to do the backups, whether it have Linux on a single PC,
    you can probably back up your data files to floppy disks, your system files will
    more likely require a tape backup device. CD writers are falling in price even
    as I write so may be an option that you will want to look into. The actual CD
    can be bought at a very low price for the content you can store on. Zip disks
    can be used for backups and DVDs may be another option in the future, but for
    now they may be too expensive and virtually unsupported. Zip disks are becoming
    more supported for the Linux system as some companies are realizing there is a
    market there.


    Your best in any case is using tape backups. They are fairly cost effective and
    reliable, The other and most important advantage is that you can store a lot of
    information on them. The type or brand of media is up to you, but it is imperative
    that the tape drive be able to handle large capacity tapes in excess of 1GB because
    even most small systems today have more than that amount of programs and data
    stored on them.'
