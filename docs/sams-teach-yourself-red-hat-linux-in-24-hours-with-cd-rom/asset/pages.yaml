  md: '# Understanding Shells


    When your Red Hat Linux 7.0 system boots up, the first program to run when you
    log in is the shell. A shell is simply a macro processor that executes commands
    that you enter at the command prompt. A Unix/Linux shell is understood to be a
    command interpreter and a programming language. You can enter commands at the
    command prompt (#) and the shell will run them. If you have several commands that
    you need to run, you can put them in a special file called a script file and the
    shell will run it also. The shell is really good at one thing: running other programs.


    There are many choices when it comes to shells—for example, bash, ksh, and others.
    bash is the default shell that you see when Red Hat Linux 7.0. We will discuss
    other shells later in this hour. You can see the shell prompt in Figure 15.1.


