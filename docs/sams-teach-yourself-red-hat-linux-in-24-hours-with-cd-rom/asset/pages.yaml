    other LAN makes available to you. In effect, the resources of any arrangement
    in the world is at your fingertips. In such an environment you could make all
    of office resources available to other offices around the world, therefore creating
    a global office environment.


    # Setting Up a Virtual Private Network


    The process of setting up a VPN is extensive and too involved to include in this
    book. I am going to simplify the process for you and show you how to get the information
    you will need to complete the setup. You can set up a virtual private network
    using the two computers you have on your present network. Additionally, the only
    piece of hardware that you will need is the firewall. You could set up the firewall
    on one of the existing computers, but that might allow someone to get directly
    into your system.


    The best bet for setting up a VPN is set up a proxy server that exists between
