  md: '86 Hour 6


    +   - Understand the XF86Config file


    +   - Use window managers to customize the look of X


    # # Discover What the X Window System Can

    Do for You


    XFree86 is a version of the X Window system produced specifically for Linux. It
    is a part of X11R6, which can be distributed freely and supports a wide range
    of video hardware-including VGA, Super VGA, and many accelerated video adapters.
    XFree86 is a complete distribution of the X Window software and contains the actual
    X server, applications libraries, utilities, and documentation.


    ![](img/8a0e42659a358d95f558285b9f5bf854_106_0.png)


    > Actually, the X Window system was developed from the beginning as a networking
    system; the intention was to support networking graphics and provide a base set
    of communication protocols. With this technology, you can build graphical interfaces
    for computers that use bitmapped graphics displays. Applications that run under
    X are called clients. These clients do not really draw graphics on your display
    but communicate with your X server. The server controls your display and manipulates
    what you see on your screen. If you installed Red Hat Linux in a normal configuration
    with modifications, your X Window system would reside in the /usr/X11R6 directory.


    One of the most useful features of the X Window system is that you can have multiple
    terminal windows on the screen at once, each having a different login session.
    Hundreds of programs are written specifically for Linux and are generally free
    for you to use. These include games, graphics, utilities, and programming software
    as C, Basic, and many others.


    What does the window manager do? The X window manager, such as GNOME, exists as
    a means to control how your graphical user interface (GUI) works. If you have
    used a graphical user interface such as Microsoft Windows, you are aware of what
    I am talking about. You will see a better representation of what services are
    offered by a graphical windows environment such as GNOME, shown in Figure 6.1.
    When using GNOME or KDE you can use any kind of program, from games to graphics
    to windows.'
