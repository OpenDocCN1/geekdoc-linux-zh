    # Q&A


    +   - What is the name of the program that checks the filesystems upon startup
    under Linux?

    - Either fsck or e2fsck, with the latter checking extended filesystems.

    - What runlevel are you in during the shutdown process?


    A You are in the runlevel 0. You can learn about runlevels by watching what is
    happening during bootup and shutdown operations.


    # Quiz


    +   - Why must you unmount (amount) a floppy before removing it from the drive?

    - What kind of script files does Linux use during the bootup phase?

    - If fsck should fail in its attempt to repair your filesystem, what is the most
    likely problem?

    - Where is the filesystems information kept?


    # Quiz Answers


    +   - Why must you unmount (amount) a floppy before removing it from the drive?

    Because the kernel may not have had a chance to write the information to it yet.

    - What kind of script files does Linux use during the bootup phase?

    Linux use startup script files during the boot and initialization phase to prepare
    your system for use.

    - If fsck should fail in its attempt to repair your filesystem what is the most
    likely problem?

    You probably have a corrupted superblock. Please see the instructions in this
    chapter to learn how to fix it.

    - Where is the filesystems information kept?

    In the /etc/fstab directory.'
