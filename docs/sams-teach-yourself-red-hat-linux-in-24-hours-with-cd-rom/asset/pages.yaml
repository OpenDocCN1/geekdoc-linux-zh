  md: '# Using the Visual Editor VIM


    # Summary


    This hour, you learned how to view and edit files in VIM, which is the GPL version
    of the vi editor. You learned about VIM modes, how to use keys to move around
    in a file, how to insert, delete, and replace text, how to write your changes
    and quit, and how to get help.


    # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # Q&A


    +   Q Can you copy/cut and paste text in VIM?

    A Copying and pasting text in VIM is called *yanking and *putting*. Yanking and
    pasting requires a bit more knowledge of VIM than we describe in this hour, so
    you should read the help files to get a full understanding. To help you get started,
    use the *nyy* command to yank *n* number of lines, place the cursor where you
    want, then type *p* to put them in the new location. To cut and paste, delete
    the lines using the *dd* command, then put them in the desired location with p.


