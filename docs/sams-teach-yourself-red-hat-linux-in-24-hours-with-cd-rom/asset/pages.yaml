  md: '![](img/8a0e42659a358d95f558285b9f5bf854_403_0.png)


    # HOUR 24


    # # Introduction to Linux Programming


    In previous hours you learned where common applications are, where to locate additional
    applications, and how to install them. This is all fine but what you want already
    exists, but what happens when the application you want does not exist? You can''t
    well install an application that does not exist. This is why this hour is devoted
    to learning the basics of programming in Linux. Now that you know how to use Linux,
    why not take it to next logical step and start programming for it?


    Obviously I teach you all there is to know about programming for Linux in this
    hour, considering that it is a topic that takes up several books for each language.
    What I can do is point out the benefits of learning to program with Linux and
    the easier ways to do so. We will also look at the Linux development model. The
    remainder of the hour will be devoted to introducing common programming languages
    and the resources available for working with them.'
