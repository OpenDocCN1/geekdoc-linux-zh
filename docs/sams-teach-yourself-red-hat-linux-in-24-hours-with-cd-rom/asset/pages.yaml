- img_proc: true
  md: '# 168


    # Hour 10


    When networking was first invented, electronic mail was one of the first uses
    for networked computers. The features that are available in most mail applications
    and the kind of files you can send with email have expanded dramatically, but
    the basic idea behind email remains the same. You need a way to compose the email,
    you need a program that will deliver the email from your computer to the recipient''s,
    and you need some of transport medium such as TCP/IP to transport the email across
    the Internet. You also need a mail protocol that every computer and program understands
    so that the message can be delivered.


    The mail setup for your system depends on how you send and receive email. When
    you use ISP to send email, your ISP accepts email that people send you over the
    Internet and stores it on a hard disk. When you want to retrieve your email, you
    get it from the ISP using POP3 or IMAP. SMTP is used to transport the mail over
    the Internet. You receive email via POP3 or IMAP and send it via SMTP, both over
    the Internet. You don''t even need to worry about an MTA in this case—the MTA
    is at your ISP. If you want to use Netscape Messenger, pine, or Kmail, this is
    a good, simple scenario.


    ![](img/8a0e42659a358d95f558285b9f5bf854_188_0.png)


    > If you want to use an MTA that does not support POP3 or IMAP, you can fetch
    the mail from your ISP. See the Mail Administrator at http://www.linuxdoc.org.


    An MUA is what you use to send and receive email. When you think of your email
    program, you are referring to the MUA. MUAs are programs that you use to read,
    compose, edit, and forward mail. The mail user agent usually has a text editor
    that you can use to compose an email message.


    # The Mail Message


    The mail message consists of two parts: the message body, which is the message
    itself, and the mail header, which includes the address of the sender and recipient(s),
    the subject of the message, and the date. You can also attach a signature to the
    mail message. A signature is kept in your home directory in the .signature file.
    Your signature can contain your information, such as phone numbers and mail address,
    or a joke, saying, or a motto.


    When you click Send, the MUA attaches some headers to the body of the message
    and sends it to the MTA. When you send your email via an ISP, the ISP collects
    your message; then it uses its MTA to send the message. The MTA attaches some
    headers and delivers the message to its destination. The transport protocol (usually
    SMTP, Simple Mail Transport Protocol) is used by the MTA to provide the medium
    to transfer the mail.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Using the Internet


    When somebody sends you an email message, your mail is delivered to a mailbox
    on ISP''s computer. Your computer uses the IMAP or POP3 protocol to pull your
    email from your ISP mailbox to your local mailbox. Most ISPs use POP3, but IMAP
    is becoming more popular.


    With POP3 and IMAP, your MUA “pulls” mail from your ISP''s server. In other words,
    your email sits on your ISP''s server until your MUA checks for mail. You can
    manually configure your MUA to periodically query your ISP''s server, or wait
    for you to manually check for mail. If you don''t want to use the POP3 or IMAP,
    you can fetchmail to get your email from your ISP.


    # Fetchmail


    The program fetchmail talks to remote servers, fetches the mail, and feeds it
    into the normal mail delivery path using SMTP. Fetchmail is generally better than
    just using an MUA that uses POP/IMAP. Fetchmail can run in the background and
    pull your ISP''s mail server, so you can use a mail notifier program such as xbill
    or the MIME applet. Also, fetchmail can deal with errors and nonstandard server
    practices better than MUAs with POP/IMAP capabilities. To learn how to set fetchmail,
    the Mail Administrator HOWTO and the Network Administrator''s Guide at http://www.linuxdoc.org.


    # MIME Types


    MIME stands for Multipurpose Internet Mail Extensions. It is the officially proposed
    standard for including different kinds of types within a standard Internet message
    (RFC 822).


    MIME is a collection of standard ways to support different types of messages,
    such as plain text, binary data files, PostScript files, and so on. MIME also
    supports messages with different kinds of fonts and messages that include different
    objects, graphics, and audio fragments. Without MIME types, only standard ASCII
    text messages could be sent via email.


    # Mail User Agents


    Following are some of the popular mail user agents:


    +   * mutt—A text-based mail user agent that is descended from the original elm.
    Mutt supports IMAP, POP3, MIME, and PGP (Pretty Good Privacy signed messages).
    The mutt home page is http://www.mutt.org.

    * elm—One of the original mail user agents for UNIX. Elm stands for electronic
    mail. Many people still use elm, although mutt is gaining ground.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '+   Pine—A text-based mail user agent that is great for new users because it
    is easy to use and understand. It also has its own editor for creating email messages
    and great IMAP support. The home page for pine is http://www.newton.edu/pine.


    +   Netscape Messenger—Part of the Netscape Communicator package. Messenger for
    Linux is identical to that for Windows. Like Windows, Messenger has IMAP and POP3
    support, but it doesn''t offer aliases and PGP handling.


    +   Balsa—Another mail user agent that is part of the GNOME set of applications.
    Balsa is undergoing rapid development in the past six months and is close to a
    1.0 release. It supports POP3 and IMAP and has an easy-to-use interface that is
    similar to Eodora. Because it is GNOME compliant, it works with GTK themes and
    will also work natively; but can be embedded in other GNOME applications. The
    home page for Balsa is http://www.newton.cx/balsa/main.html.


    +   Mahogany—A graphics-based mail user agent that is gaining popularity among
    Linux users. Mahogany is available for XI/UNIX platforms (which includes Linux)
    and Windows. It supports POP3, IMAP, and full MIME support. The home page for
    Mahogany is http://mahogany.home.dhs.org.


    # Setting Up News


    A tool that is somewhat similar to Usenet. Usenet contains many discussion groups
    for every subject under the sun. Although many Linux projects have gravitating
    mailing lists, Usenet is still an essential tool for keeping up-to-date with the
    Linux community and getting help.


    Usenet is not controlled or governed by anyone; in fact, it is really nothing
    more than an agreement between many sites to exchange news. A post to a Usenet
    newsgroup is called an article. Articles are submitted to a newsgroup, which is
    set up to accept and post articles that are about a common topic. Newsgroups are
    organized into hierarchies that indicate the topic for the newsgroup. When you
    create a news article, you enter your message into a news application called a
    newsreader—for example, Netscape Messenger Center. The newsreader formats the
    message so it can be sent to the news server via TCP/IP.


    Nothing controls Usenet. No central body decides which articles are posted (unless
    a particular Usenet newsgroup is moderated). No central body decides which newsgroups
    a server will carry or propagate. Those decisions are made by the owners of the
    news server. Usenet is like the traditional fence post. Everybody has the right
    to a place by the fence, but nobody owns the fence or controls the conversation
    about.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Using the Internet


    Every Usenet site decides which newsgroups to post to. Because different sites
    post newsgroups, the only limit to which newsgroups are available is made by the
    administrator of the Usenet site. If you get Usenet from your ISP, your ISP administers
    your Usenet site and controls which newsgroups you get.


    Different Usenet sites carry different groups. Some Usenet sites carry all newsgroups,
    whereas others carry selected newsgroups.


    A great resource for information on Usenet is the Usenet Help at http://metalab.unc.edu/usenet-i/usenet-help.html.


    You can use News to download and post messages to your favorite newsgroups. Another
    newsgroup is XRN.


    To run XRN, ensure that you have an Internet connection, then enter the following
    command at a prompt, substituting your news server at [server_name]. You can get
    the hostname for your news server from your ISP.


    ```

    xrn -nnptServer [server_name]

    ```


    XRN is shown in Figure 10.3.


    # FIGURE 10.3


    XRN enables you to subscribe and read messages in a simple, X-based format.


