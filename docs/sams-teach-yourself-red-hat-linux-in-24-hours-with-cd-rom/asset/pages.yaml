    # Q&A


    +   Q Is it possible to install RPM packages that were created for the SuSE distribution?
    How about Mandrake?


    +   Q Before installing an RPM package, make sure that it was created for Red
    Hat. Other Linux distributions, such as SuSE, have a different directory structure
    than Red Hat, their RPM packages will place files in different places than the
    packages made for Red Hat would. Generally, you shouldn''t use RPMs for another
    distribution. The exceptions to this rule are RPM packages made for Mandrake,
    which is based on Red Hat. Mandrake RPMs usually work fine on a Red Hat system
    (this may change as Mandrake and Red Hat grow apart).


    +   Q Many of the applications on Freshat have only source code for download.
    Where can I get the RPMs?


    +   A Many developers release only the source code of an application, and others
    make the RPM packages. If no RPMs are available at the home page of an application,
    check the Red Hat download page at http://www.redhat.com/apps/download or http://rpmfind.net
    to see if an RPM is there.


    # Quiz


    +   1. True/False: Any RPM packages that are listed in the rpmfind.net database
