  md: '# Hour 15


    When you use tsch, you can watch who logs on or off your system. This is very
    handy if you are on a network. It uses a tsch variable called watch. The syntax
    of the watch-command is


    ```

    set watch=<user> <terminal>

    ```


    The watch variable uses a set of user ID and terminal attributes or pairs to set
    the conditions for the watch or monitoring. These pairs can contain the word “any,”
    which says to match any user or terminal. The user we are referring to is a Linux
    user ID and the terminal refers to a Linux terminal device number. If you wanted
    to see what your boss got to work each morning, you could use the following example
    providing your boss on the network. Enter the following at the command-line:


    ```

    set watch=(elizabeth baker)

    ```


    ![](img/8a0e42659a358d95f558285b9f5bf854_266_0.png)


    > You could put this type of command in your Linux shell script file to start
    up when you are running other commands when you log in.


    tsch will check every ten minutes to see if your boss has logged in. You can change
    this to check, for example, five minutes using the following:


    ```

    set watch=(5 elizabeth baker)

    ```


    Now tsch will cause watch to check every five minutes to see if your boss has
    logged in.

    There are so many features in tsch that it is impossible to cover everything,
    so I would would encourage you to read everything that you can find on the subject.
    This is especially true if you are going to be using it as your shell of choice.
    Now let''s take a look at some of the other shells that are available for Red
    Hat Linux 7.0.


    # Other Shells


    One of the great things about Linux is its versatility. If you don''t like the
    default bash shell, there are many alternatives. Following is a list of shells
    that you might like to try out. Please be aware that some shells are written for
    specific purposes, check the documentation before installing them. You will find
    some of these on your Red Hat Linux 7.0 distribution CD, but some will need to
    obtain from the Internet.


    +   - ash—This is a lightweight Bourne-compatible shell.

    - bash—The Bourne Again Shell.

    - csh—The C shell, a symbolic link to tsch.

    - fsh—A rsh-compatible replacement for rsh.'
  merge: -1
