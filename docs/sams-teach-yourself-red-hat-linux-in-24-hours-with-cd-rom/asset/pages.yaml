  md: '![](img/8a0e42659a358d95f558285b9f5bf854_213_0.png)


    # # Linux Productivity Applications


    Linux has a lingering reputation for not being very useful in an ordinary office
    environment, despite a proliferation of applications and rapid advances in graphic
    interfaces and other desktop tools. Many advanced productivity applications are
    available as part of Red Hat Linux 7.0. In this hour, you will learn about those
    applications, as well as some commercial office suites that are available for
    Linux. We will briefly introduce some of the commercial office applications that
    you can buy for Linux, then we discuss in detail the office applications that
    come with the Red Hat distribution.


    In this hour you will


    +   - Explore the advantages of using Linux office applications

    - Discover a few of the commercial Linux applications outside of the Red Hat distribution,
    including Corel WordPerfect Office 2000, Applinuxware, and StarOffice

    - Learn about GNOME office applications, as well as KOffice and the GIMP'
