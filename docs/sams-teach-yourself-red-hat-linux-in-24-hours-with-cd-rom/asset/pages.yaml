  md: '# Linux Applications


    Many more switches and options are available for RPM than described here. See
    the RPM man and info pages for more information. An excellent resource that very
    thoroughly explains every aspect of RPM is Maximum RPM, by Ed Bailey, Red Hat
    Press, 1997. The book is geared towards developers; it is a bit out of date but
    still full of information. Alternatively, you can download a PostScript or LaTeX
    version for no cost at http://www.rpm.org.


    # Querying RPM Packages


    If you''re not sure whether to install an RPM, you can get more information by
    querying it before you install it. To get a list of basic information about RPM,
    you can right-click in GNOME File Manager and select Show Info. The gRPM Package
    Info dialog box opens, which displays basic information about the package, including
    the following:


    +   - Date and time the package was built

    - Description of the package contents

    - Total size of all the files installed by the package

    - Package group

    - Package signature

    - List of files that the package installs


    > The package signature verifies the authenticity of the package—that it was actually
    built by the listed package builder and contains what the label says it does.
    When you check a package, it verifies that the package signature is valid. Always
    check the package signature before installing a package you have downloaded from
    the Web.


    An example of a package information box is shown in Figure 11.2.


    From the command line, you can enter query options to the RPM command to get the
    same information. To get basic information about an RPM package, enter rpm -qpi
    [package_name]. For example, to get information about the Apache RPM package,
    enter


    ```

    $ rpm -qpi apache-1.32-20.i386.rpm

    ```'
