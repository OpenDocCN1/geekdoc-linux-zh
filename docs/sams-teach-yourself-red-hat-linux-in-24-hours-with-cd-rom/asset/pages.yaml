    # Other Books on Linux


    Once you start to get more proficient in Linux and have digested the information
    that books like this can give, it''s time to move to the next level. There are
    many books that will enable you to continue your Linux education beyond the introductory-level.
    Particularly good ones are


    +   * Red Hat Linux 7 Unleashed, by Bill Ball, et.al., Sams Publishing, 2000.

    * Running Linux, by Matt Welsh, et. al., O''Reilly, 1999

    * Essential System Administration, by Aileen Frisch, O''Reilly, 1995


    The Linux Reading List HOWTO, listed in the HOWTOs as Reading-List HOWTO, lists
    many books that are recommended for a complete Linux education.


    # Summary


    In this hour you learned how to solve problems with your system and get help.
    You learned a general method for solving Linux problems, and a hierarchy for finding
    resources to answer questions. You learned how to report bugs to Bugzilla and
    how to use Bug Buddy to develop a bug report.


    # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # Q&A


    +   Can''t I just reinstall to fix a problem?


    +   Probably, but once you have customized your system, (which you should do),
    and added new applications, it would be more time-consuming to reinstall than
    to investigate and fix a problem. It is also very bad administration practice,
    and you never learn anything that way.'
