    # Creating Space for Linux


    After you have collected information about your hardware, the next step is to
    make sure that you have enough space on your drive for Linux. To install all the
    packages for everything covered in this book, you need about 700MB of space. To
    install everything on the CD-ROMs you need at least 1TB of space. You will also
    need extra space for your files and any other applications you install later.


    If you don''t have enough space on your hard drive, one solution is to add another
    hard drive to your computer. Adding another hard drive to your computer also makes
    a dual-boot computer (a computer that runs two different operating systems) much
    easier.


    If you can''t add another hard drive, but you have sufficient free space on your
    hard drive, you can partition your current hard drive to hold both Linux and another
    operating system such as Windows.


    A partition is a section of the hard disk that is used for an operating system.
    With Windows, you usually have one partition, or perhaps a couple of logical partitions.
    If you want to use Windows and Linux on the same computer, you must partition
    the hard drive so that Windows can use one part and Linux can use another part.
    Partitioning is like dividing the hard drive into parts, so that each part can
    be used for different purposes.


    If you must repartition and you are currently running Windows, you have two options.
    You can back up your entire system, repartition the hard drive to make room for
