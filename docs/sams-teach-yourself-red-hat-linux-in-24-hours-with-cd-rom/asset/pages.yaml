  md: '# Administering the System


    In this part of the hour you learned how to mount and unmount filesystems and
    devices. In the next section you will learn how to repair filesystems that have
    become damaged.


    # Editing Filesystems


    There will be times when you will have to create and edit filesystems. There are
    two basic ways that you can do this and both involve making changes to the /etc/fstab
    file. You can edit the file using a text editor or use the fsconf utility within
    the /bin/fsconf directory. You can see what the fsconf utility looks like in Figure
    16.3.


    FIGURE 16.3


    Use fsconf to make modifications to your filesystem.


    ![](img/8a0e42659a358d95f558285b9f5bf854_275_0.png)


    The /etc/fstab file is nothing more than a text file, which means that you can
    change it and save it like you would any other text file. Before you make any
    changes to this file, you should save previous versions just in case as a backup.
    You should use a text editor to edit or make changes to.


    # Creating and Editing New Filesystems


    In some respects, a Linux systems administrator is a systems manager and manipulator
    more than anything else. When the PC crashes it may be due to a corrupted file,
    a driver that has lost its way, or any number of other circumstances related to
    the filesystem. Knowing how to create new filesystems and set up the system to
    use them is very valuable knowledge.'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'During the install process, Linux creates new filesystems and sets up the systems
    so it can use them.


    Filesystems are created by a program that opens the block device and adds structural
    data to it. This way the kernel will have access to some sort of image of a filesystem
    when it tries to mount the block device. That is, the device has an image of a
    filesystem that the kernel and the program can accept. The mkfs command is a Linux
    command that allows you to create a filesystem on a block device. This command
    has many options that you should become familiar with. Please check your Linux
    documentation for options as they are too numerous to mention here.


    However, you can type the following to get a list of commands that it executes:


    ```

    # mkfs -v

    ```


    If you want to ext2 filesystem (the most likely choice), use the mkfs command.
    The two main options you may want to use with this command are the -m and -i options.
    The -m option tells the program how much space to reserve for the root to use.
    The -i option is used to set the balance between inodes and disk blocks.


    An example of using mkfs is:


    ```

    # mkfs -t ext2 /dev/sdb

    ```


    After the command is executed you will see a list of processes that are running.


    There is an easier way to create and edit a filesystem using the fsconf utility.
    By using the fsconf utility, you can add, delete, or edit mounts. You have a list
    of five tasks that you can perform when you use the file configurator. See these
    options when you run fsconf.


    # Task: Using the fsconf Utility to Make Changes to Your Filesystem


    +   1. Type fsconf at the prompt and press Enter.

    2. The Filesystems Configurator dialog appears. Note the different options that
    you have listed.

    At the bottom of the screen you will see the Quit and Help buttons.

    3. Click on Configure Swap Files and Partitions to see what you can do to create,
    edit, and modify your filesystems.

    4. Click Add and the Volume Specification dialog pops up. You can choose to add
    a partition in this dialog. We do not want to do that at this time, so click Cancel.
    I just wanted you to see how to add a partition.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Administering the System


    5. Click on Access Local Drive and the Local Volume dialog box pops up.

    6. When you want to make a change all you want to do is click the left mouse button
    on the partition that you want to edit and the Volume Specification dialog pops
    up. These partitions are listed in the window. If your list is too long you may
    have to scroll down to the one you are looking for. My first partition is /dev/hda5.
    Yours may be different. Just carefully left-click your mouse once on the partition
    listed as I said previously.


    7. Click on the Options tab and you will be able to set up permissions for your
    partition. We won''t go through these in great detail because they are self-explanatory.

    8. Click on Cancel and Quit for the next three screens. In the terminal window
    exit to leave back where you started. The Volume Specification dialog is shown
    in Figure 16.4.


    Figure 16.4


    The fsconf Volume Specification screen shown with related dialog boxes.


    ![](img/8a0e42659a358d95f558285b9f5bf854_277_0.png)


    The fsconf graphic utility is a quick and pleasant way to create and edit your
    filesystems. It is a long way from the days when everything had to be done from
    the Linux command prompt.


    # Repairing Filesystems


    There are several reasons why your filesystem can become corrupted. For example,
    you forgot to shut down properly, knocking out the power (good reason to use UPSs),
    a storage device such as a floppy was removed before the system was done with
    it, the reset button was accidentally pressed, the gremlins unplugged it, and
    a few dozen more numerous to mention.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'In Linux some data is kept in memory before being written to disk. This speeds
    up the process and is a method used by many systems, including Windows. If the
    computer is turned off or improperly shut before the memory content is dumped
    to disk, the filesystem becomes corrupted because it is missing bits and pieces
    of data. This is why you must train users to properly shut down the machines.
    When you boot your machine runs fsck whose main lot in life is to check and repair
    filesystems. When your machine closes things during the shutdown process it unmounts
    all filesystems. During the reboot or startup fsck knows that these filesystems
    were unmounted and checked during the shutdown process, so it tells you they are
    “ during the boot process. It can tell because the kernel writes a special signature
    on the filesystem to confirm that the data is intact. When the filesystem is mounted
    again for writing, this signature is removed. The fsck program maintains a watch
    on the filesystem by doing periodic checks. You can also run this program manually
    from the command prompt.


    You can use the following command to check the root filesystems:


    ```

    # fsck -V -a /

    ```


    For all other filesystems this:


    ```

    # fsck -R -A -V -a

    ```


    This last sequence will check everything (-A) except the (-R) filesystem.


    At some point you are likely to see a distressing message from fsck similar to
    the screen of death, which can be frightening if you don''t know what it means.
    Some times happen during the boot process. It looks something like this:


    +   ***An error occurred during the file system check.

    ***Dropping you to a shell, the system will reboot

    **when you leave the shell.

    Give root password for maintenance

    (or type Control-D for normal startup)


    The right thing to do here is to log in with the root password and run the fsck
    program manually. You can also run the e2fsck program to repair the e2fs filesystems.


    After you have entered the root password you will get a prompt that looks like
    this:


    (Repair Filesystems) #


    This might look questionable, but you are being asked to enter a command. You
    can tell fsck to check everything manually by entering this into the prompt:


    ```

    # fsck -A -V ; echo=$??

    ```


    fsck will attempt to manually check all of the filesystems for you. By entering
    the echo option you are telling fsck to show you what it did. The fsck codes are
    listed in Table 16.1.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# TABLE 16.1 fskck Codes


    | Code | Explanation |

    | --- | --- |

    | 0 | No errors |

    | 1 | Filesystem corrected |

    | 2 | System should be rebooted |

    | 4 | Filesystem errors left uncorrected |

    | 8 | Operational error |

    | 16 | Usage or syntax error |

    | 128 | Shared library error |


    If fskck fails in its attempt to repair your filesystem, you probably have a corrupted
    superblock. My best advice here is to try to use a backup superblock that Linux
    in several places. The ext2 filesystem has many backup superblocks placed over
    the filesystem. If the superblock is corrupted, fskck cannot start its filesystem
    check.


    ![](img/8a0e42659a358d95f558285b9f5bf854_279_0.png)


    > The e2fsck program is used to check a second extended filesystem under Linux.
    It is automatically run each time boot Linux to check the native filesystems before
    mounting. You should never disable this check in the /etc/fstab file.


    Suppose that fskck reports that it could not clean a particular filesystem, such
    as /dev/foofo. You can then start fskck by using a backup superblock located at
    (for example) 8193, which is at the start of block group 1. The syntax looks like
    this:


    ```

    # fskck -t ext2 -b 8193 /dev/foofo

    ```


    You will find this superblock at the start of block group 1 with the first superblock
    located at 0. You will find more superblocks located at the start of block group
    2, 3, and group 4. They are spaced at intervals of 8,192 blocks. 8193 is the first
    superblock backup at the start of block group 1. If one superblock doesn''t work,
    just keep trying another. In every situation I have personally found (I''ve had
    a lot of them recently) the first superblock backup did the trick.


    ![](img/8a0e42659a358d95f558285b9f5bf854_279_1.png)


    > A superblock is just a block of code that Linux can use during the boot and
    initialization phase to boot the system. Linux scatters several of these around
    the disk at locations it knows about. Linux uses these superblocks in case the
    main bootup sequence is corrupted.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'After you have manually run fsck, your problem more than likely has been fixed.
    After the startup scripts have done their job you can type exit to end the process
    and the boot sequence will begin all over again. This is to check the filesystems
    and make sure that they are all clean.


    If you are using the extended filesystem (e2fsck) on your computer, you can use
    the e2fsck program to diagnose and repair your extended filesystem. You must unmount
    the partition before executing the following:


    ```

    # e2fsck -p /dev/hda5

    ```


    Be extremely careful when using e2fsck because the p option can be dangerous and
    destructive. It means repair without prompting.


    If all goes well then you can relax and pat yourself on the shoulder, confident
    that when the screen pops up again you will know what to do in order to repair
    the filesystem.


    # Managing User Accounts


