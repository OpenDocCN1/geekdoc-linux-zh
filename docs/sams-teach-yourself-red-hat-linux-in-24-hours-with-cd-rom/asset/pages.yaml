  md: '# What Is an Operating System?


    Because Windows has been the overwhelmingly dominant OS for personal computers,
    many ordinary home computer users never think of the operating system. When you
    have the choice between Linux and Windows, or if you use both Linux and Windows
    on the same computer, the operating system becomes less transparent. To help you
    understand the difference between Linux, Windows, Macintosh, and other operating
    systems, it is worth a quick look at exactly what an operating system does and
    how it works with the hardware of your computer.


    A computer consists of three main parts: the processor, or CPU, the memory, and
    the input/output devices that get data into and out of the computer. The processor
    gives instructions to all the other parts of the computer so that it can do useful
    work. The memory stores the instructions with relevant data. The input/output
    devices, including the keyboard, mouse, monitor and disk drives, are used to send
    instructions and data to memory that the processor can carry out the instructions
    on the data.


    The operating system coordinates and oversees all the hardware devices on your
    computer so that you can run programs to do useful work. As a simple example,
    when you copy a file from the hard disk to a disk, the operating system locates
    the file on the hard drive, keeps track of the filename, size, and creation date,
    allocates a free space on the floppy, and then correctly names the file on the
    floppy disk.


    The operating system also contains a filesystem for storing and accessing files,
    user interfaces so the user can interact with the operating system, and a collection
    of special programs, such as the cp (copy) program, that make it possible to perform
    basic tasks, such as copying a file.


    Different operating systems contain different programs and different ways to communicate
    with the processor, memory, and input/output devices. As you can see, the operating
    system is fundamental. Without it, your computer would just be a collection of
    plastic and metal parts. So how is Linux different from Windows or other operating
    systems? The rest of this book indirectly answers this question, but following
    are some basic facts that should give you a preliminary idea:


    +   * Linux can run on many different platforms, including Intel, Alpha, Spar,
    PPC, and some others.


    +   * Linux is free software, distributed under the GNU General Public License
    (GPL), which guarantees that Linux users will always enjoy the basic freedoms
    that we will discuss later in the chapter.


    +   * You can easily obtain the source code for Linux without restriction or cost
    and study it, customize it, or improve it in any way you want. This makes Linux
    arguably the most flexible and fastest-improving operating system in existence.'
  merge: -1
