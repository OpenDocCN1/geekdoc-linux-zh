  md: '# Linux Basics


    you recall from Hour 2, LILO is the Linux boot loader. The boot loader is copied
    into memory, and then it starts the operating system. The LILO boot loader is
    special because it can boot just Linux, but also other operating systems that
    are installed on your computer.


    If you specified you would start Linux from a boot disk when you installed, then
    the original (Windows) boot loader is not changed. If your BIOS is set up the
    way we recommended in Hour 2, it has instructions to look for a boot loader on
    floppy, then on CD-ROM, and finally on the hard drive. With a boot disk, the BIOS
    will load the boot loader from the boot disk into memory, and Linux is started.
    If no floppy disks or CD-ROMs are found, the normal boot loader on the hard drive
    is loaded into memory.


    After the boot loader starts, it looks for the kernel of the operating system.
    Once the kernel is found, it is loaded into memory. The kernel''s first job is
    to find all hardware and prepare it for use. It then starts the system processes,
    such as logging, administration services, email, and network services. Finally,
    the kernel starts the login program (called getty) so that you can log in and
    use your system.


    ![](img/8a0e42659a358d95f558285b9f5bf854_59_0.png)


    > The entire boot process is logged in the /var/log/boot.log. Skipping this file
    can help you get an idea of what happens during startup (also called system initialization).


    # Logging In


