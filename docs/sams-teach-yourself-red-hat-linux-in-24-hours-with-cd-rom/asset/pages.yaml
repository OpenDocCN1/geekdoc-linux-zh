    > If you have a problem or question, chances that someone else has already had
    the same problem. You can search Usenet for keywords your problem with Deja, Google,
    or AltaVista.


    # Reporting Bugs to Bugzilla


    One of the most useful ways for new members of the Linux community to help the
    project is to report bugs. Anyone can report if you just started using yesterday.
    As a Red Hat user, you can report all bugs to the central bug repository for Red
    Hat, which is called Bugzilla.


    Red Hat''s Bugzilla page system is at http://bugzilla.redhat.com/bugzilla/.


    Bugzilla is a bug reporting system that was created by Mozilla.org (you learned
    about the Mozilla Web browser in Hour 11, "Linux Applications\ You can learn more
    about how Bugzilla works by reading the Bugzilla Fact Sheet at http://www.mozilla.org/bugs/.
    Red Hat has taken the Bugzilla software and applied its own bug reporting system,
    also called Bugzilla. Bugzilla is a database of bugs and a system for reporting
    and fixing bugs, as well as requesting software enhancements.


    To look at bugs or report a bug, you must have a Bugzilla account. You can create
    a Bugzilla account on the Web page. To learn more about Red Hat Bugzilla, read
    the FAQ at http://bugzilla.redhat.com/bugzilla/redhat-faq.cgi.


    # Reporting Bugs Using Bug Buddy


    An easy way to report bugs is to use the brilliant bug-reporting program called
    Bug Buddy. Bug Buddy, created by Jacob Berkman, making a bug as simple as entering
    some basic information and clicking a few buttons.


    The purpose of Bug Buddy is to make it easy for the user to send a bug report,
    while automatically collecting the information that is useful for the developer.
    Bug Buddy can also help you determine whether a program crashed of something wrong
    with your system or of a true bug in the program.


    Before Bug Buddy, if your application crashed you had to start gdb and then try
    to recreate the conditions that caused the crash. You had to know about stack
    traces and how'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# 362


    # Hour 22


    to run gdb (not an easy prospect), as well as enough about programming to be able
    to read the results of the trace. With Bug Buddy, anyone can submit useful bug
    reports to Bugzilla or the individual project''s bug tracking system.


    ![](img/8a0e42659a358d95f558285b9f5bf854_382_0.png)


    Although you can submit bugs to Red Hat for any application that is part of the
    Red Hat Linux distribution, a more direct way to report a bug is to send your
    Bug Buddy email to the maintainer of the application or the bug tracking system
    of the project application is part of. X-based applications usually have an About
    menu that lists the maintainer. Non-X-based applications virtually always list
    the maintainer in a README file or in the man page for the application.


    The more users discover to crash Linux applications and the more bug reports that
    are submitted, the better Linux will become in the future for everybody. Don''t
    be shy about a bug report because you think it''s probably a common problem that
    has already been reported. You might actually be the first person to experience
    that exact problem, or you might give a particular insight on your bug report
    that nobody had thought of before. At any rate, the more bug reports you submit,
    the better you will get at writing them.


    # Features and Requirements of Bug Buddy


    For such small utility, Bug Buddy has some extraordinarily useful features:


    +   - It automatically finds and includes the components on your system; there''s
    no need to hunt through /proc files for yourself.

    - It gathers a stack trace automatically, either from a crashed application or
    from the core file.

    - It can be started by double-clicking a core file in GNOME File Manager or from
    the crash error message box.


    You must have the following packages installed to use Bug Buddy:


    +   - gnome-libs

    - libgrade

    - gdb'
