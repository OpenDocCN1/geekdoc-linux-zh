    Up until now we have discussed many of the issues surrounding building a network
    and have gotten acquainted with some of the common elements. Now we should be
    able to put the network together. Your network will consist of a couple of computers,
    two twisted pair (CAT-5) cables, a hub, and two network cards. It doesn''t sound
    like much, but it allows you to extend your ability to do more work by sharing
    files, printers, modems, and other services that might otherwise not be available
