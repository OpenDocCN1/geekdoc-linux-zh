    the command line?

    - Some system may go down and you will have to boot from a floppy, or you can''t
    get the Window system running. If that happens, you can use graphical tools to
    fix the problem. Then you have to know how to configure the system by editing
    the configuration files, or you will have to reinstall the system. Understanding
    the configuration at this level will help you to build a more reliable and more
