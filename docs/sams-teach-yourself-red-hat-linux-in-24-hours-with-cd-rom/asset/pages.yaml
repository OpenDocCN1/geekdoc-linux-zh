  md: '# Automating Tasks with Shell Scripting


    The first thing to do is get down exactly what you want the script to do. You
    should always be clear on what you want the script to do before you begin. If
    you cannot write it down, you are not ready to writing the script. The next step
    is to sketch a very flowchart of the steps you intend to take. Again this is for
    your benefit, so take the time to make sure know what needs to occur in the script.
    At this point you could begin writing the script, but I advise one more step.
    Take a minute and figure how you want to lay out your script. Just briefly where
    you want the variables, make what their names are, where you want functions, and
    the general flow of the script. If you don''t understand this now, don''t worry.
    It will be explained later in this chapter and in many other programming texts.
    There are few things more frustrating than having to edit a 1000-line script that
    someone just haphazardly together. Plus, when you have variables assigned all
    over the place or values hard coded, it makes things worse. Hard coding when you
    have a constant as the path to a file directly entered into the script instead
    of assigned to a variable and using the path throughout the script. Instead of
    having to change the variable you assigned the path, you would have to go through
    and change every single instance of that path in the script.


    A general rule of thumb is if you are dealing with a file path or any value that
    is used repeatedly, make it a variable and place it at the top of the file. That
    way you can change only one value in one obvious place later. Also, I emphasize
    this enough: Comment your code! You may understand the code today or tomorrow,
    but three months down the road when you need to modify your script again, and
    you won''t. Even though you have the script before you will take nearly as long
    to understand it as it would to write the whole thing from scratch. This is another
    lesson I admit I have learned the hard way.


    When you write scripts, give them meaningful names. If it searches for core dumps,
    call it something like find_core, not foo. Silly names like foo are used in the
    examples because the examples have little real use. They are just used to demonstrate
    concepts of a language.


