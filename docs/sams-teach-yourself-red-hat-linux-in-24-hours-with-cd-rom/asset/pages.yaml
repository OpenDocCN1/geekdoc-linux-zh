- img_proc: true
  md: 'can use it and unmount it after you are finished. When you mount a drive or
    device, you are making the contents of that device available for you to use.


    There is a feature in Linux called automount or automount. One aspect of this
    concept is when you click on the CD-ROM on your device, your CD-ROM is automatically
    mounted. Of course, when you are finished, the drive is unmounted.


    The program behind this is autofs, which uses automount to mount CD-ROM and floppy
    drives so when you click on the CD-ROM or floppy icon, it is automatically mounted
    for you. If you want more information you can find a tutorial at http://www.linuxxq.com/lg/issue24/nielsen.html.
    You can find automount utilities at http://www.cs.columbia.com/ezk/am-utils. If
    you need further information you can get it from the Linux Documentation Project
    (LDP) at http://www.redhat.com/mirror/LDP/ You can also try the Linux Documentation
    Project at http://www.linuxdoc.org.


    When using Red Hat Linux 7.0, there are several ways to mount and unmount your
    filesystem. The simplest way is to click on the System, Disk Management option
    from the GNOME menu will pop up giving you a choice of mounting or unmounting
    devices. If the device is not listed, it probably wasn''t installed during install
    and you will have to reconfigure it or run again. Please note that you can also
    format some drives, such as the floppy in your floppy drive. Normally you will
    see the CD-ROM (cdrom) and the floppy drive (fd0) listed here.


    If you recall our earlier discussions, you will remember that all devices in Linux
    have a device name, drive, and file associated with them. This information is
    of particular interest if you use a graphical mount tool such as the Mount Tool,
    but if you have to mount the device from the system prompt, you will need to know
    what the device is. Here are the device names for some familiar devices:


    | Device Name | Description |

    | --- | --- |

    | /dev/fd0 | First floppy disk |

    | /dev/cdrom | The CD-ROM drive |

    | /dev/hda1 | First partition of IDE drive |

    | /dev/sda1 | First partition on SCSI hard disk |


    Each device has a device name and also a mount point. The mount point is another
    directory that is in the /mnt directory as a subdirectory. The mount point refers
    to a place in filesystem where the contents of a disk are made available. When
    you install Linux, it usually creates two mount points in the /mnt directory called
