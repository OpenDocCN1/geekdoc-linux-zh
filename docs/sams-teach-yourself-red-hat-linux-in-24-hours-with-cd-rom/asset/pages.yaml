    In the next section you will learn about using the secure remote password.


    # Using the Secure Remote Password


    Secure Remote Password (SRP) is a protocol that provides a method to securely
    pass your password through authentication. It solves the problem of securely authenticating
    clients to servers. It plays the role of being a drop-in replacement for insufficient
    password authentication. SRP is just a technique to accept a password from a user
    and produce a secure authentication and key-exchange as it. SRP provides secure
    Telnet and FTP connections.


    SRP is part of the Stanford University SRP Authentication Project and is available
    over open-source licensing terms. It was first proposed in 1997 and the variant
    in use today, SRP-3, was first published in 1998 after lengthy discussion and
    refinement. The SRP is the core technology behind the Stanford SRP Authentication
    Project. The project''s main objective is to improve network security from the
    ground up by integrating secure password authentication into most protocols in
    use. The Stanford project site serves the semi-official home of the SRP distribution.


    The Stanford project also offers more secure versions of Telnet and FTP. These
    enhanced versions offer encrypted authentication and cryptographic key exchange
    to establish a secure connection. You can find out more information and download
    a free copy of the Telnet/FTP programs from http://srp.stanford.edu/srp/. The
    documentation on the site informs you how to install the program and how to configure
    it to protect your system.


    You can download the most recent version (Version 1.5.2 as of August, 2000) at
    the following sites:


    ```

    ftp://srp.stanford.edu/pub/srp/ (Palo Alto, CA)

    ftp://labrea.stanford.edu/pub/srp/ (Palo Alto, CA)

    http://srp.stanford.edu/srp

    ```


    SRP has been designed to protect passwords against passive and active network
    attacks. Both Telnet and FTP have some security issues involved, this is a good
    way to further protect your network from aggressive intrusion. You should check
