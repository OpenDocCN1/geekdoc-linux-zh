  md: '# The Linux Documentation Project


    It is important to remember that the Linux Documentation Project (LDP) is made
    up of volunteers. The guides, HOWTOs, and other documentation that you will find
    at the linuxdocs Web site exists because someone thought that the piece of documentation
    would be useful. There isn''t anyone in charge of what gets written, although
    there are guides on how to write and there are people in charge of what gets posted.
    For this reason, there isn''t much consistency in the level of detail, the amount
    of theory and background, the writing quality, or the general usefulness of the
    guides and HOWTOs. Some are extraordinarily useful references, and you will find
    referring to them again and again. Others give a rich of background information,
    which can enable you to solve problems on your own, because the guide or HOWTO
    taught you how it works. Some HOWTOs, particularly the mini-HOWTOs, are simply
    step-by-step instructions or advice on how to solve a particular problem or approach
    a task.


    If you find wishing that there was a HOWTO on a particular topic, consider writing
    one. Remember, there is no central authority at the LDP who assigns writing projects.
    All you have to do is get on the mailing list, announce yourself, announce the
    document you will write, read the LDP HOWTO, and start writing.


    # Mailing Lists


    Mailing lists are becoming important, if not more important, to maintaining the
    Linux community, solving problems, and getting help. Red Hat has hundreds of mailing
    lists, the level of complexity and knowledge of the users varies widely, from
    the newest newbie to kernel hackers, don''t be put off if you have a hard time
    understanding of the posts. A great way is to scan the posts that you don''t understand,
    just to get a feel for the vocabulary. Eventually, you will find yourself understanding
    more and more, particularly when you come across terms you saw in the mailing
    lists, HOWTOs, guides, and books.


    # Man and Info Pages and Source Code Comments


    The man and info pages provide a wealth of information about almost every part
    of the system. If you''re not sure which term to use to look up a man or info
    page, you can use the GNOME Help Browser to browse through lists of every entry
    (the lists are long!) Finally, do not be afraid to look at the source code for
    an application. If you installed your Red Hat via the installation program on
    the CD-ROM, you might not have the source code on your hard drive, but there should
    be a CD-ROM that contains source code. You can also find source code for programs
    at the Red Hat Download site at'
