    # Creating Links


    In and (Unix) you can use links to give the same file two entirely different names,
    or to pretend that a file is in one location in the filesystem is actually in
    an entirely different location.


    Linking is useful when you have two different programs that look for the same
    file in different places, so you need to make sure the file is in both locations.
    For example, say you have a library in /usr/lib. Most of the programs on your
    system that you use for it in /usr/lib, but a few programs look for it in /usr/share/lib.
    You can create a link from the file in /usr/lib to /usr/share/lib, and then all
    the programs that use the file can find it.


    In another case, that you have run out of space in your user partition. If you
    want to add files to /usr, you can create a directory in /var, then link the directory
    to /usr, and all the files in the linked directory will seem to be in /usr. There
    are two kinds of links: the hard link and the symbolic link. Although they do
    the same job, the way Linux treats them at a hardware level is completely different,
    so it is worth exploring the difference.


    # Hard Links


    A hard link is just another name for an existing file. The two files share the
    same inode, so in reality they are the same file. This is different from a copy,
    where there are two separate files with separate inodes, taking up different blocks
