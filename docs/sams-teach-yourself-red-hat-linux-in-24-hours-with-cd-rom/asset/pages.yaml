  md: '# 358


    # Hour 22


    One of the greatest strengths of Linux is the amount and quality of help that
    is available. There is no tech support line staffed by the lowest rung of the
    tech ladder. You don''t have to hire a consultant or local guru to help you through
    a problem (though they are available if you need a guru on retainer), or take
    a class (although that helps).


    As we have stressed repeatedly throughout this book, Linux is all about understanding
    as much as possible about the system, and having nothing about the system. It''s
    all available for everyone to study and learn. This is a beautiful thing for two
    reasons:


    +   1. You can become a Linux guru yourself. All it takes is practice, time, experience,
    and desire.


    +   2. There are thousands of people out there who have a lot of knowledge and
    experience who are happy to help others with problems.


    Because everything is out in the open and available for anyone who wants to become
    familiar with the innermost workings of the system, Linux as a whole tends to
    be a group of very knowledgeable people. This makes it quite a simple matter to
    get help when you have a problem—probably more help than you actually wanted.
    Quite possibly from the person who created or maintains the very piece of software
    with which you are having a problem.


    The following list is a general strategy you can use when solving a problem or
    learning a new topic. After the list are some more specific guidelines to use
    the resources mentioned in the list.


    # The Smart User’s Guide to Troubleshooting


    The first thing you should do when you encounter a problem is to sit back and
    take a deep breath. It’s easy to be frustrated and angry when you can’t do anything
    you want to do, or when your computer responds in a way other than you expected,
    but if you are solving the problem (and eventually, given enough time and effort,
    you will solve the problem), you must be in a calm state of mind. If you are reading
    this book and operating a Linux system, chances are that you are curious and a
    bit of a tinker/do-it-yourselfer. Not only do you learn a lot by solving the problem,
    but you also learn a lot about how the part of the system works, and you might
    be pointed to other topics that you might not have been exposed to thought before.
    The following are a few tips that can handle the most common problems:


    +   • If you get an error message, read it carefully. An error message is your
    first clue to how to solve the problem. If you get a segmentation fault or a page
    fault, or if the'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# Troubleshooting and Getting Help


    application crashes and you see a core file in the directory, the problem is almost
    certainly a bug. Make a bug report using Bug Buddy.


    +   - Make sure you have the most-to-date, stable version of the software. Many
    problems are fixed in newer versions, so if you don''t have the latest version,
    upgrading it may help.

    - Read the relevant man and info pages, as well as documentation that comes with
    the application in /usr/share/doc. These documents might also refer to you other
    documents that could help.

    - See if there is information on the Red Hat guides, in a HOWTO, mini-HOWTO, newbie-ized
    HOWTO, or guide at linuxdocs.org or linuxbie.org. The Linux Resources Page is
    a collection of all things about Linux, just every Linux resource on the Net.
    The site is maintained by SSC, which publishes the Linux Journal. If you can find
    it at http://www.luv.asn/linuxresources.html.

    - Search for information on the problem in the Red Hat archives, and on the Web
    and Usenet.

    - If there is no information on the specific problem, start some background reading
    on the subject. Learn as much as you can about the subject, so that you can pinpoint
    the error message or at least report the problem intelligently.

    - Keep a log of how you have gone about trying to solve the problem. Take a separate
    sheet of paper and write down a possible cause and solution on each sheet. Then
    write what you have tried for each possibility on the appropriate sheet of paper.
    Try to make your notes as detailed as possible so that you don''t get confused,
    and also so that you can later help others who have the same problem. Troubleshooting
    can be like following a maze—after you have gone several blind alleys, if you
    haven''t kept track of where you have gone, you might forget to try certain steps
    that would lead to a quick solution.

    - Try to mailing the list or Usenet group that seems to be the closest to your
    problem. Also, try IRC to get an answer or some clues right away, particularly
    #linux and #linuxhelp channels.

    - Try the list for your local Linux Users Group (LUG). You might even be able
    to bring your computer to the next LUG meeting and get help right there.

    - If you are seriously pressed for time, consider hiring a Linux consultant in
    your area.'
