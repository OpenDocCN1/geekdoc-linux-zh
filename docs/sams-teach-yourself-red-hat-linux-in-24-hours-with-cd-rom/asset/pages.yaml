    # Why You Should Not Log in As Root


    Now that you know about multiple logins and virtual terminals, it is time for
    the advice that every new Unix user gets. The root account is intended for administrative
    use. Do not log in root unless you must do so to perform an administrative task.


    Some new users get into the bad habit of using root for everything. This is bad
    for several reasons: You can inadvertently destroy important files. You can do
    irreparable damage to your filesystem or wreak havoc with system processes. Also,
    if you are connected to a network, logged in as root is a potential security hole
    for a cracker to get into your system.'
