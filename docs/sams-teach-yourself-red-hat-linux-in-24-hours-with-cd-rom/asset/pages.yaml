  md: '# Hour 9


    The two files /etc/hosts.deny and /etc/hosts.allow provide your system with basic
    security. They prevent hostile users from breaking into your system by preventing
    anyone from logging in. If you do not add them, a cracker could use a password-searching
    script and log in to your computer via telnet. This is just basic security—you
    will learn more in Hour 20, "What Every User Should Know About Security." If you
