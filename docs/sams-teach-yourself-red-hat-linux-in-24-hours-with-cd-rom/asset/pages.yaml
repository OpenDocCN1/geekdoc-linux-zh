    # # Adding Text to Your File


    When you are ready to insert text into your document, there are several commands
    that place you in Insert mode. After you are in Insert mode, you can enter text
    anywhere in the document.


    Two basic insert commands are a for append and i for insert. a opens append and
    enables you to insert text after the cursor. i opens Insert mode and enables you
    to insert text before the cursor. For example, if you had the word “friend” in
    a document, and you wanted to change the word to “friendship,” you could place
    the cursor under the d in friend, type a to Enter mode, and then type ship. If
    you placed the cursor at d and typed i, followed by ship, it would look like “friendship.”


    After you press an insert command, you can add text to your heart’s content. Any
    character you type is added to your file. When you are ready to save your work,
    you must go back to Normal mode to save the file. In VIM, saving the file is called
    “writing” to the file.'
