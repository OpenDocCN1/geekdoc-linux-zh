  md: "The for loop is just a special version of a while loop and it is useful when\
    \ a task needs to be executed a certain number of times. It handles counter expressions\
    \ in a more convenient manner. Here is the syntax for the for loop:\n\n```\nfor\
    \ ( expression1; expression2; expression3 ) {\n    statements;\n}\n```\n\nThe\
    \ first expression is used to assign an initial value to a counter variable. The\
    \ second expression ends the execution of the loop when it evaluates to false.\
    \ The third expression is used to update the counter. To see how this works, try\
    \ the example in Listing 24.4. Save it as foo.c.\n\n# LISTING 24.4 Using a <stdio.h>\n\
    \n```\n#include <stdio.h>\n\nint main() {\n\n    int counter;\n\n    for ( counter\
    \ = 0; counter < 10; counter++) {\n        printf(\"%d *\", counter);\n    }\n\
    }\n```\n\nCompile and execute it with the following commands:\n$ gcc -Wall foo.c\n\
    $ ./a.out\n\nThe program in Listing 24.4 declares an integer variable counter\
    \ and the first expression assigns a value of Ø. Then each time the loop checks\
    \ to see if counter is still less than 10. If so, the loop executes and the value\
    \ of counter is printed to the terminal. After the loop statements execute, the\
    \ third expression is executed, which updates the counter. This continues until\
    \ counter is not less than 10 and then it exits.\n\nNow you know the basic concepts\
    \ of C programming, but there is still a great deal more to learn about C. If\
    \ you want to learn more I recommend buying a book on C programming. There are\
    \ plenty of choices available, but here are a few:\n\n+   C for Dummies by Dan\
    \ Gook\n\n+   The Programming Language by Brian Kernaghan and Dennis M. Ritchie\n\
    Sams Teach Yourself C in 21 Days by Peter Aitken and Bradley Jones"
