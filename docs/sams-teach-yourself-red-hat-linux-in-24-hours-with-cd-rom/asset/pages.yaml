  md: '# Automating Tasks with Shell Scripting


    At this point you are probably wondering what a record is and what a field is.
    A record is a line in a text file and a field is a word or number separated by
    a space. Thus the 4, 6, and 9 in the output of the preceding example are the number
    of fields per record, which you can see the number of words per line. This is
    also part of the reason awk can only be used on text files. Binary files would
    appear to contain a lot of special characters and get confuse awk. The new line
    character and the field separator character can be redefined, but for the time
    being assuming that words are fields and lines are records. The actual syntax
    of awk command


    ```

    $ awk ''program'' <input files

    ```


    You can list as many files to process as you want, and it will sequentially go
    through and process each. All of the usual piping and redirection can handle awk
    I/O as well. If you have the program in a file, you can use the following syntax
    to run it:


    ```

    $ awk -f <program name> <input files

    ```


    Earlier I mentioned that awk handles patterns. When syntax is concerned there
    are three types of patterns. The special BEGIN block is executed before any records
    are processed. The special END block is executed after record processing has finished,
    and the regular patterns are specified between a pair of slashes ( / ) before
    the actions. If no pattern is specified, awk assumes true and the action is executed.


    Actions are specified between braces { } and can contain as many commands as necessary.
    The default action if none is specified is to print $, which prints the contents
    of the record. What makes all of this useful is awk''s ability to match regular
    expressions. Regular expressions are special patterns of characters used to specify
    and match strings. Support for regular expressions allows extremely complex searches
    without an extreme amount of scripting. A regular expression consists of normal
    characters (such as a, B, and 1) that match them, and metacharacters that specify
    special actions. Think of the metacharacters as commands and not as characters.
    A listing of the metacharacters is shown in Table 21.1.


    # Table 21.1 Metacharacters Supported by awk


    | Metacharacter | Meaning |

    |---|---|n| \ | Escape sequence (signifies next character has special meaning,
    or if it precedes a metacharacter, the metacharacter will match like a regular
    character). |

    | ^ | Start matching at the beginning of the string. |

    | $ | Match at the end of a string. |

    | /^$/ | Match a blank line. |'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# TABLE 21.1 continued


    | Metacharacter | Meaning |

    | --- | --- |

    | . | Match any single character. |

    | [ABC] | Match A, B, or C. |

    | [A-Ca-c] | Match by ranges; that is, A, B, C, a, b, or c. |

    | fobar | Match foo or bar. |

    | [ABC][DEF] | Match A, B, or C. Then match D, E, or F. |

    | * | [ABC]* means zero or more occurrences of A, B, or C. |

    | + | [ABC]+ means one or more occurrences of A, B, or C. |

    | ? | [ABC]? means zero or one occurrence of A, B, or C. |

    | () | Combine regular expressions. For example, (BlueBlack)berry would match
    blueberry or Blackberry.|


    In addition to regular expressions, awk supports all of the C comparator operators
    and compound pattern operators. Going through all of these operators is beyond
    the scope of this book, but you can find a great deal of information on this in
    the documentation. awk also supports C''s flow control and looping constructs.
    It supports multidimensional arrays, internal and user-defined functions, and
    many other features. So now let''s see what we can do. Following how to see an
    awk program works. This is a simple pattern matching program that will run on
    the foo.txt file from earlier. The script looks like:


    ```

    BEGIN {x="My"; print "ready to run"

    $1 == x {print "Found my"}

    /awk/{print NR ": matched awk"}

    END {print "Done reading " NR " records"}

    ```


    To run it


    ```

    $ awk -f test.awk foo.txt

    ```


    and the output will look like


    ```

    ready to run

    Found my

    3: matched awk

    Done reading 3 records

    ```


    In this example you can see BEGIN is executed first, setting the variable x equal
    to "My". Variable types do not need to be declared in awk. The script then prints
    the message "ready to run". Now each record is read and tested against each pattern.
    The first record starts with "My" so the first pattern matches and prints "Found
    my". It is then tested against the second pattern, but nothing matches the first
    line in foo.txt does'
