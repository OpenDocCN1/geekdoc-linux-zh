  md: 'awk typically resides under /bin and under /usr/bin. In Red Hat 7.0, gawk is
    under /bin and there is a symlink under /usr/bin. Although gawk has a man page,
    odds you will need more information for it to be useful. You can find quite a
    bit of useful documentation under /usr/share/doc/awk-3.0.5. There is also an ample
    supply of resources and books available. A good place to start online is http://www.gnu.org/manual/awk/index.html.


    The awk language is described as a pattern-matching tool. It is great for processing
    text files, data gathering statistics, and generating reports. awk scripts are
    easy to write since awk handles most of the processing details on its own. You
    may find the actual syntax very similar to C, which makes sense considering the
    background of the people in creating it. However, you will also find the actual
    programming much easier. Strings and arrays are dynamic in awk and file I/O has
    been greatly simplified.


    awk can be used directly on the command line or run from a script file. Although
    all awk scripts could run from the command line, it is a good idea to place anyMultiline
    programs in a file. As you will see in the examples, an awk program is simply
    declaring the source of the data, to search for, then what to do when you find
    a match. Pattern may not be apparent in very large scripts, but it is still there.
    Let''s start with the simplest program possible. This program count words per
    line and you run it on a file called foo.txt that looks like this:


    > My fellow Linux users

    A great day is at hand

    The day you will learn the power of awk.


    Run


    ```

    $ gawk ''{print NF, " $0}'' < foo.txt

    ```


    The output will look like this:

    4: My fellow Linux user

    6: A great day is at hand

    9: The day you will learn the power of awk.


    The backticks (\`) are used to prevent the shell from trying to process the contents
    of the awk program. This is to appease the shell and is not part. After looking
    at this program you can probably guess awk has a lot of predefined variables.
    Let''s take a look at what just happened. This awk program has no pattern specified,
    so it matches anything and then performs the specified action. NF is a predefined
    variable that contains the number of fields per record and $0 contains the entire
    record. The fields in a record are accessed by $1, $2, ... $n. To see the fields
    accessed, run the preceding program and change $0 to $1.'
