  md: '# XFree86—The Linux Window System


    # Task: Troubleshooting Xconfigurator


    If your card was not found in the installation process, you can run Xconfigurator
    again. Follow these steps:


    +   1. You will need to run Xconfigurator again from the command prompt or a terminal
    window by typing Xconfigurator. You will need to be root or use the sum command
    and enter your password for root.

    2. When you run Xconfigurator before, your system was probed for a video card.
    If your card was not found or was not listed and you selected Custom, then you
    will be asked for the memory amount installed on your video card or the card on
    your motherboard. Be sure you know the correct memory value to enter here.

    3. If you select Custom, the Select Video Dialog will pop up. You will see a list
    of memory options to select from. Select the correct amount and click OK or Exit
    to quit without making changes.

    4. You may be asked to configure your clockchip in the Clockchip Configuration
    dialog. In most cases should select No Clock Setting because it should be automatically
    detected.

    5. Click OK or Exit. If you click OK, your settings are saved in the /etc/X11/X86Config
    file. If you need to make modifications in the future, you will have to do run
    Xconfigurator again.


    The Monitor section of X86Config file 7.0 specifies the characteristics of your
    monitor. This file is generated by the Red Linux 7.0 Xconfigurator after it probes
    your system. You will learn more about this in the next section. If you have more
    than one monitor (with Linux you can know it is a multitasking system), you will
    have multiple sections for Monitor in the X86Config file. Don''t be surprised
    at this; it is normal to have more than one monitor listed here.


    # Configuring XFree86


    In this section you will learn how to create and edit the XF86Config file, which
    is the configuration file that tells the XFree86 server what to do. The XF86Config
    file is the most important file in your X Window program. This file is created
    when you first install Linux, or you can create it using Xconfigurator.


    Under normal circumstances, everything that your system needs to know will be
    found out during the Linux installation. The secret to performing a smoother Red
    Linux installation is to know everything about your hardware that you can. After
    all, you expect Linux to know everything; you have to help it along from time
    to time.'
