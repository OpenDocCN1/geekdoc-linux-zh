  md: '# Setting Up a Printer and Other Devices


    Have you ever wondered what happens when you tell your computer to print something?
    Under Linux


    On a network such as those under the Microsoft Windows programs, print queues
    are extremely important because there are some documents waiting to be printed.
    Fortunately, there are print spoolers or queues that hold the documents and release
    them to be printed when the printer is available. Linux simply stores and prints
    the files (print jobs) in the order it receives unless instructed to otherwise.


    You will find the print spool directory under /var/spool/. You may notice a file
    called lpd in the var/spool directory (/var/spool/lpd). This is the print spooler
    daemon, which usually loads when you start your system. Its job is to manage the
    print jobs.


    These are just a few basic facts about how Linux handles your printer. In the
    next part of the hour you will learn to set up and configure your printer using
    a utility called print.


    # Setting Up and Configuring a Printer


    When you use any computer you want to be productive with it. You want to write
    letters, create nice spreadsheets, write recipes, and may do some drawings with
    a drawing program. In this part of the hour you will learn to set up and configure
    a printer so you can do just that.


    Under the Linux system you have multiple print jobs running at one time. This
    is because Linux is a multiuser/multitasking environment. If Linux gets several
    requests to print something (known as print jobs), it sends the jobs to a print
    spooler (called spooling or queuing) and then prints them in the order it receives
    them. If you are the only user, your print requests are still sent to the print
    spool. The jobs are held until it is turn to be printed.


    In order to understand your printer and how it works you should know these basic
    facts. Linux loads the lpd (line printer daemon) when it loads the system. The
    line printer daemon manages the print jobs that it receives and sends to it. There
    are specific filters that manage printer-specific formatting or handle the way
    your documents look when they are printed. The printcap file is a configuration
    file that is stored in /etc (/etc/printcap) and defines your printer configuration
    among other things.'
  merge: -1
