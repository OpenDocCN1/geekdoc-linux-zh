- img_proc: true
  md: '# Netscape Navigator


    The Linux version of Netscape Navigator is almost identical to the Windows version.
    Netscape is included in Red Hat Linux 7.0 and a Netscape launcher is created by
    default on the GNOME panel. You can use Netscape Communicator for news, email,
    FTP downloads, and Web browsing, just like in Windows. Java and Javascript are
    supported, as well as some plug-ins. The Web browser in Communicator, called Netscape
    Navigator, is shown in Figure 10.1.


    Figure 10.1

    Netscape Navigator for Linux looks just like Navigator for Windows, and you use
    it the same way.


    ![](img/8a0e42659a358d95f558285b9f5bf854_186_0.png)


    # Lynx


    If you use a dial-up PPP connection to access the Internet, waiting for graphics
    to play can seem intermittently, particularly if they are ads. If graphics aren''t
    important to you, consider Lynx as an alternative to graphics-based browsers like
    Netscape. When you use the Lynx browser, only the text of a site is downloaded
    and displayed. This makes Web pages load very quickly, and it is also much easier
    to concentrate on the text. Lynx is particularly useful for reading the news on
    graphic-heavy sites where the images aren''t necessary. Another great to use Lynx
    is if you are searching mailing lists or newsgroup archives.


    To use Lynx, at a shell prompt enter lynx by the URL, for example:


    ```

    lynx http://www.redhat.com

    ```'
