    files in the documentation, which can be used to locate and delete them.


    # Summary


    In this hour you learned the general procedure to install packages from tarballs.
    You learned how to deal with problems when they occur and what to consult for
    information. Tarballs just require time and patience. I encourage you to try more,
    but if you get frustrated, take a break. Tarballs can be destructive if not handled
    properly. Now you can be proud that you have another game on your system and that
    you know how to install almost anything. You also know to uninstall anything you
    do not like. The only thing left to do now is to explore the world of Linux and
    try any program you find interesting.


    # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # Q&A


    +   Why do I need autoconf?

    A Odds as you do not, unless you are creating a program to install. But, do you
    need a little knowledge of autoconf to know what is going on when you install
    tarballs that used it.

    Will every source tarball build with gcc?

    A, there is no rule requiring programs to be built with gcc. However, gcc is immensely
    popular and most source tarballs will be built with it.'
