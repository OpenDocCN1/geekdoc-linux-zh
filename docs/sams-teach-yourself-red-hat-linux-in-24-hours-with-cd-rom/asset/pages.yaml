    # Getting Help with the man and info Pages


    As you explore Linux, you will see many commands, system files, library functions,
    and other special files that you don''t understand. Your first reference when
    learning a new aspect of Linux is the set of man pages (short for manual pages).
    The man pages are the best way of discovering every variation and option that
    you can use with a command. They tend to be long and complicated, but serve as
    a complete reference. However, even beginners can benefit from them. Usually,
    if you read the first couple of paragraphs of the description, you can get a good
    idea of the topic.


    Another reference is the info pages, which are somewhat newer than the man pages.
    Info pages also tend to provide more description and explanation than the man
    pages.


    # Task: Look Up Information on a Topic


    +   To look up info on a topic, type info topic, for example:

    $ ls


    +   To invoke a man page about a command or system file, type command at the shell
    prompt. For example, to get help on the command ls, type

    $ man ls


    The manual page for that command opens, as shown in Figure 3.5. The first line
    of the man page is the name of the command, a synopsis of all the different switches
    and parameters you can attach to the command, and a detailed description of the
    command usage.


    +   To scroll through the man page, use the arrow down and arrow up buttons.


    +   To quit the man page, enter q.


    In addition to the man and info pages, many commands come with an option that
    prints out a description of the command, as command --help. Also, all the documentation
    that comes with application packages that you install is stored in /usr/doc. Many
    of the files are README files or other notes, but you can sometimes find a wealth
    of information (the X documents are an example).'
