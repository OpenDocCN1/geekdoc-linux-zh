    # Mounting and Unmounting


    The Linux filesystem is so different from the DOS system that it is hard for people
    who are familiar with DOS to Linux. In other operating systems, you usually insert
    a floppy into your drive and it is accessible by your system. Under Red Hat Linux
    (and most Linux versions), you have to mount the drive or device before you'
