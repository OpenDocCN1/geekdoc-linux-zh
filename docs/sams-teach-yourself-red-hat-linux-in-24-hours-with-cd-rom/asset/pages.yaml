  md: '# Introducing GNOME


    As you learned in the last hour, X provides the functions needed for a graphical
    interface, but it doesn''t provide the interface itself. The actual buttons, windows,
    scrollbars, icons, and other graphical objects are created by the window manager
    and the desktop environment. The window manager and desktop environment exist
    as a layer on top of X.


    A desktop environment is nothing more than a different way of Linux. Instead of
    typing commands into the shell environment, you can point and click in a window
    with a mouse. All the tools and applications of Red Hat are available within the
    graphical environment. Some applications, as AbWord or Gnumeric, can only be used
    within an X environment. You can still access a shell within the desktop environment
    by opening an X terminal. The X terminal, or xterm, serves as a virtual terminal
    within X. The GNOME xterm, shown in Figure 7.1, is called GNOME Terminal.


    GNOME isn''t just a desktop environment, but also a collection of applications
    that are created using GNOME standards. This means that GNOME applications maintain
    the same look and feel, and can work seamlessly. You will be introduced to some
    useful GNOME applications, as well as other Linux applications in Hours 11, "Linux
    Applications," and 12, "Linux Productivity Applications."


    FIGURE 7.1

    The GNOME desktop environment magnifies the things you can do in Linux, while
    maintaining flexibility.


    ![](img/8a0e42659a358d95f558285b9f5bf854_132_0.png)'
