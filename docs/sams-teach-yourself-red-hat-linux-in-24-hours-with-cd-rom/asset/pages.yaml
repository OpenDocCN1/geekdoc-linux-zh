  md: '# Setting Up the Total Linux Desktop


    Ever since the advent of the personal desktop computer, computers have been a
    fundamental part of every office. Productivity applications have become more complex
    as software companies scramble to provide as many features as a customer could
    possibly want. The end result is huge, disk-space-eating, memory-hogging, bloated
    software that is loaded down with features that users don''t understand or how
    to use. The licensed, proprietary software costs hundreds of dollars per user,
    and often doesn''t work with any other vendor''s software, forcing businesses
    and individuals to buy "office suites." Few people need the applications in these
    suites, but it is easier to just buy a suite than try to get the individual proprietary
    applications of several vendors to work together.


    The problem with modern commercial productivity software can be boiled down to
    two issues: complexity and cost. As applications become more complex and feature-heavy,
    it gets harder to make updates and improvements to add new features. The learning
    curve for new developers and new users also grows, and the software becomes more
    expensive.


    Although it''s not as simple as buying MS Office and installing a CD-ROM, the
    feasibility and advantages of setting up the total Linux desktop are increasing
    steadily. There are only a few Linux office applications appearing weekly, but
    they are getting better and better. Also, the tools available for integrating
    Windows and Linux applications, such as WINE and VMware, are steadily growing
    more sophisticated and easy to use. You will learn more about VMware in Hour 19,
    "Integrating Linux and Windows."


    # Free Applications Versus Proprietary Applications


    It is important to understand that not all applications that run on Linux are
    licensed by the GPL. Some applications that were designed to run on UNIX is as
    proprietary as anything to come out of Microsoft. Other applications, such as
    Corel WordPerfect, have licensing restrictions. Other applications, such as KOffice
    and GNOME, are free software licensed under the GPL. This hour focuses on whatever
    is included in the Red Hat 7.0 distribution, so most of the productivity applications
    are part of the GNOME Office. If you want to go beyond the applications included
    in Red Hat 7.0, try one of the three major commercial office suites that have
    been developed for Linux: Corel WordPerfect Office, Apprixware, and StarOffice.'
  merge: -1
  pgno: 214
