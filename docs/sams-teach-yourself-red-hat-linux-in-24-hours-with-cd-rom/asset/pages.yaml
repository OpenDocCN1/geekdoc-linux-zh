  md: '# Fun and Games


    # Finding More X Games


    Before GNOME or KDE existed, there were X Window games. They are still a lot of
    fun and they are an absolute mess when things get really stressful. At times,
    a simple game of cards just won''t do. Sometimes you really need pulverize your
    enemies—death by mouse click. At times like these, you can turn to games such
    as xoing and xbill. Many other great X games are available, though, don''t stop
    at just those two.


    Unfortunately, Red Hats with only a limited number of these games, but a plentiful
    supply of X Window games can be found on the Web at sites such http://www.tucows.com
    and http://www.linuxgames.com. Running a search for Linux games on any major search
    engine turn up plenty of additional links, too.


    # Networked and Commercial Games


    Linux was designed to network, so it makes sense that it has network games. Although
    many of the original Linux network games such as xplot are not commonly known,
    some of the newer commercial games like Quake are establishing Linux as an excellent
    choice for gaming. For many gamers that demand the maximum performance for network
    games, Linux is the best choice.


    Hard-core gamers can configure their Linux machines to run only what is absolutely
    necessary for their games, and they can devote the maximum amount of resources
    to the game program. They also have the ability to configure the filesystem and
    the kernel for maximum performance. To achieve this level of optimization on any
    other operating system that the games are designed for be extremely difficult.
    Keep in mind, however, even most default Linux configurations will deliver excellent
    gaming performance.


    Currently, most of the available networked games are either commercial shooters
    and strategy games or the classic MUD. No Linux gaming experience would be complete
    without a MUD, so you will see how to set up one. You will also learn about some
    of the commercial games available and where to find more information about them.


    # Setting Up a MUD Client


    A MUD (or multiuser dungeon) is a network game that can allow hundreds or thousands
    of users to interact in a fantasy world. MUD clients can range from the most basic
    text interface to a highly sophisticated graphical environment. The most important
    thing to do before into Muddding is to read up beforehand. You should read up
    on MUDs in'
