- img_proc: true
  md: '4. When you select Custom, you will be asked for the horizontal sync range
    and the vertical sync range of your monitor. You will most likely find this information
    in your monitor manual. If not, call your monitor manufacturer.


    Do not select a value for your monitor that is outside these horizontal and vertical
    requirements for your monitor.


    5. After you have selected your monitor, Xconfig starts to probe your video card.
    You can elect not to probe by selecting Do Not Probe and enter the values yourself.
    If your probe fails, you will have to enter them manually.


    While the probe is in progress, it is normal for your screen to blink on and off
    several times. Don''t panic. Everything is normal with Linux.


    When the probe is finished, the Finished screen appears. This screen shows the
    results of the video card probe. You have three options: Use Default, Let Me Choose,
    or Back. You can use the settings on the screen or choose your own. If you choose
    your own, you will need information about your video card and monitor.


    7. Choose Default to accept the color depth and resolution detected during the
    probe. If you select Let Me Choose, you will be presented with the Select Video
    Modes dialog.


    8. Select the probe modes that you want to use and press Enter.


    9. Once you''ve made your selection, the Start X dialog box will appear. You have
    the option of letting Xconfig test your configuration or not. Normally, you should
    select OK to begin the test.


    10. If there is an error in the configuration, you will have the opportunity to
    go back and do it all over again. If not, you will see a small display window
    asking if you can see the contents of the box clearly. If you do, click Yes within
    ten seconds (you must be speedy here).


    11. You are now given a choice of how you want the X window to start. You can
    start it manually at the prompt by typing start or have it started automatically.


    12. You can now reboot your system, log in when asked, and enjoy Red Linux 7.0.


    If some reason your video card wasn''t detected, don''t worry. This isn''t a big
    problem and you shouldn''t be concerned with it. In fact, don''t worry about anything
    where computers are concerned. They may give you problems, but that''s just another
    opportunity for you to learn something new, how to solve the problem, and get
    the system running again.'
