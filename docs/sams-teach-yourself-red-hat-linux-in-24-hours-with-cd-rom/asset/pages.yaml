    ```\n\nThe package that installed the file, apache-1.3.12-20, is printed to the\
    \ screen.\n\n# Solving Dependency Errors\n\nThe common RPM installation error\
    \ is the dependency error. A dependency error occurs when the package you want\
    \ to install can't find the files it needs on your system. For example, in the\
    \ dependency error message shown here, you are trying to install mgetty-sendfax.\
    \ You get an error that mgetty version 1.1.21 must be installed, and it cannot\
    \ be found on the system.\n\n```\n# rpm -Uvh mgetty-sendfax-1.1.21.-11.386.rpm\n\
    error: failed dependencies:\n  mgetty - 1.1.21 is needed by mgetty-sendfax-1.1.21-11\n\
    ```\n\nIf you install mgetty first, then you can install mgetty-sendfax.\n\nDependency\
    \ errors can arise for three reasons. First, errors occur because an application\
    \ needs files that are not present at all. Second, errors occur when the RPM installation\
    \ program cannot find the files. Third, errors occur because the application needs\
    \ files from a current or an older version of a package that is installed.\n\n\
    > If you get a dependency error, pay attention to the files that the RPM installer\
    \ needs. You might need to install another RPM package first, or you might need\
    \ a more current or an older version of an RPM package.\n\n![](img/8a0e42659a358d95f558285b9f5bf854_207_0.png)"
