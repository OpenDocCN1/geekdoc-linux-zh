  md: '# Compiling and Installing Applications from Source Code


    do this in the remaining Makefiles, and some programs come with an install or
    an install.sh script to handle the installation. Once all the config and Makefiles
    are ready, it is time to compile.


    # Compile and Install


    All of the real compile instructions are in the Makefiles, really the compile
    is just running. Before you compile the files, it is often a good idea to remove
    all partially compiled files and existing compiled programs. This is an easy way
    to certify that everything is freshly built. You can do this by passing an option
    like:


    +   # make clean


    In the actual Makefile will be a section labeled clean:: All the commands in that
    section will be executed. If you looked through the Makefile earlier you probably
    saw many options. It is fairly common for a Makefile to have all, clean, and install
    as options. Many other options may also exist, but these are the most common and
    usually the only ones needed.


    To compile the actual code all you should have to do is type


    +   # make


    It should build all of the necessary files from this point and you should see
    screens of text scrolling across your terminal window as shown in Figure 23.2.
    Another thing to keep an eye out for while reading the included text is make options.
    You may need to use special options to compile the program with other language
    support, special graphics support, or with debugging information. Using a Makefile,
    all of these separate options had to be entered only once. At this point you should
    have an executable program and all of the necessary files, unless you had problems
    during the compile. I had problems with the Makefile in the src/ directory. To
    link a library known as libdb1 appears does not exist on my system. If you encounter
    a problem like this, consult the Red Hat website and the site of the compiler.
    Someone may have encountered this problem before and have the solution posted.
    After reading a few sites, I began to suspect the program might not need that
    library, so I simply deleted instances of -ldb1 from the Makefile in src/.'
