- img_proc: true
  md: '# Exploring the Hat Linux Filesystem


    As there are three kinds of users, there are three kinds of permissions: read,
    write, and execute. There are three possible things that you you can do to a file.
    You can open the file and read it, you can make changes to the file or write to
    it, and if the file contains a program, you can run the program, or execute it.
    To correspond with the three kinds of permissions, each of the three user sections
    contains a string of characters, which can be a combination of - r, w, or x characters.


    +   - Read permission, indicated by an r, means that you are allowed to open the
    file and look at its contents, but that you''re allowed to make any changes to
    the file, including making edits or moving the file to another directory. You
    could, however, make a copy of the file and make changes to the copy.

    - Write permission, indicated by a w, means that you are permitted to make changes
    to the file, including editing, moving, and deleting the file.

    - Execute, indicated by an x, means one of two, depending on whether you are talking
    about file or directory. Execute permission on an executable file as an application
    means you are permitted to run the program. Execute permission on a directory
    means you have permission to open the directory and the contents. If you tried
    to open a directory for which you didn''t have permission, you would get a Permission
    Denied message.


    The dash (--) means that the category of user does not have a particular permission.
    For example, in the permission string for `vi_practice` in Figure 4.4, `rw-rw-r--`,
    the owner of the file has read and write permission, the group has read and write
    permission, and everyone has only read permission. Notice that if a file is not
    a directory or an executable file, it doesn''t make sense to execute permission,
    because such permission would be meaningless. The files bananas, kokoban, and
    plains/hardin are all executable files.


    > Notice in Figure 4.4 that all the permissions for the symbolic link fake_bananas
    are listed for all users. Because permissions are meaningless for symbolic links;
    the target file permissions are what''s important. By default, all the permissions
    are displayed for symbolic links.


    ![](img/8a0e42659a358d95f558285b9f5bf854_85_0.png)


    # Summary


    In this hour, you learned how the Linux filesystem is mounted in the root filesystem.
    You explored the organization of the directory structure, and how to use it .
    and directories. You created hard links and symbolic links, and learned the difference
    between the two. You also learned about permissions and how the permissions system
    is a necessary basic security tool on a multiuser system.'
