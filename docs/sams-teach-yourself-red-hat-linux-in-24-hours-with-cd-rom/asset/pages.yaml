  md: '# Hardware Information in /proc


    The /proc filesystem also contains lots of useful information about your hardware.


    /proc/cpuinfo gives information about your processor, including model, manufacturer,
    CPU clock speed, and cache size.


    Your machine''s memory is in /proc/meminfo. Included is total memory, swap, amount
    free and cached, and buffers. The free command presents the same information as
    that in /proc/meminfo, but in a more readable format, including column headings.
    The gtop program presents the same information in a color-coded chart.


    You can check which devices are using I/O addresses by looking in /proc/ports


    /proc/interrupts lists the IRQ numbers that are in and which device, or peripheral,
    are using them. /proc/dma does the same for DMA channels.


    The command lsdev gives all the information from /proc/interrupts, /proc/io, /proc/dma
    and lists the information by peripheral. lsdev is generally a more convenient
    way to see the information. lsdev is part of the procinfo command, which you should
    install to get useful commands to help you make sense of the information available
    in the /proc filesystem. The procinfo command gives system data from the /proc
    directory, formats it, and displays it on the screen. procinfo gives you information
    about your system directly from the kernel as it is running (real time).


    /proc/devices lists the device drivers that are configured into the kernel.


    /proc/filesystems lists the filesystems that are configured into the kernel, which
    are the filesystems that the kernel supports.


    /proc/kmsg are the messages produced by the kernel. They are also routed to syslog,
    which are either printed to the screen, sent via root mail, or written to /var/log/messages,
    depending on their severity (see /etc/syslog.conf file for more information).


    /proc/modules tells you which kernel modules are loaded, their process used them.
    The exact information is shown with the lsmod command, but the lsmod command adds
    column headings to tell you what you are looking at.


    /proc/uptime tells you the amount of time the system has been up since the last
    reboot.


    /proc/kernel tells you the version of the kernel.


    /proc/apm tells you the state of electric power on your system. This is useful
    if you have a laptop because you can tell you whether you are using AC power or'
