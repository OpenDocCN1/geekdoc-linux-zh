- img_proc: true
  md: '# Introduction to Linux Programming


    development process. If you have ever priced Microsoft''s Visual Studios or any
    Borland products, it is clear what a great deal these free tools are.


    # Understanding the Open-Source Development Model


    Now that you know learning to program with Linux is a good idea, you need to know
    how software is developed for Linux. A good understanding of the development model
    is critical if you ever want to contribute to any of the Linux projects or develop
    commercial software for Linux. Even if this is for personal use, it may still
    feel helpful.


    Almost all noncommutative Linux software is developed under the Open-Source Development
    Model. This model is radically different than most existing development processes
    and not only defines how to develop software, but redefines how to think about
    software development. To begin with, the software license cannot restrict the
    redistribution of the software or the bundling of it as part of a software package.
    You can get as many copies as you want. The source code must be available in addition
    to the executable program, the source code can be modified and redistributed by
    anyone. Of course they are also required to make the source code available for
    any changes.


    24


    There are also provisions to prevent discrimination. There cannot be any restriction
    against specific people, users of the product, or by software distribution. For
    example, a tool can not be open-source if it is free to users of Red Hat or Debian,
    but no other distributions. Also, the license cannot place requirements on any
    other software it is distributed with.


    Why is this so different? Suddenly software is free and you have access to the
    source code. You can build it, run it, or modify it as you please. Everyone interested
    in an open-source project has access to all code and information. Many developers
    would like to see this new standard. It has been proven to generate code with
    fewer bugs, and the bugs that do exist are fixed rapidly. However, open-source
    has been plagued with problems in gaining industry acceptance.


    Think of trying to present this idea to the heads of a major software corporation:
    Give away your software for free, allow others to distribute it, and give everyone
    access to the code you developed. Most companies fear would put them out of business.
    The current mentality is that money is made by selling the program. An open-source
    company would make money by providing service and support. In coming years this
    may cause radical changes in the software industry. To learn more about the open-source
    movement, visit http://www.opensource.org.'
