    You have learned to install and configure your monitor and video card, what XFree86
    is, and how to install or upgrade it using Red Hat 7.0 RPM. You will now see what
    is contained in the XF86Config file. Before you creating a new XF86Config file,
    take a look at the section "Understanding the XF86Config File" later in the chapter,
    which outlines what your file should look like.


    # What the XF86Config File Contains


    The XF86Config file is nothing more than a single text file that contains the
    following sections:


    +   - Screen—Instructs what server is to be used.


    +   - Device—Contains information and details about your devices such as video
    card chip set.


    +   - Files—Tells the server where fonts, colors, and software modules are located.


    +   - ServerFlags—On/Off flags that allow or deny special actions as core dumps
    and mouse and keyboard configurations.


    +   - Module—Tells the server what modules should be loaded.


    +   - Keyboard—Contains information about the keyboard and what information the
    server should use.


    +   - Pointer—Tells the server what pointer is used.


    +   - Input—For input devices such as scanners and mouse devices.


    +   - Monitor—Contains specific details and settings for your monitor.


    +   - Graphics Device—Contains a list of devices detected and configured by Xconfigurator.
    There may be several graphics device sections.


    # How Xconfigurator Works


    Red Hat''s Xconfigurator is a unique program that generates an XF86Config file
    after it probes your system for certain information that it needs. It does most
    of the work for you, but you may be asked to provide some information. Xconfigurator
    and enter your information to set up your monitor and video card. If you aren''t
    logged in root, you can start Xconfigurator as follows:


    ```

    # -c Xconfigurator

    ```'
