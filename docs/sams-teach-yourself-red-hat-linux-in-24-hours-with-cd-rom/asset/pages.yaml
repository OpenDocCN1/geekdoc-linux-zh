    # Using Samba


    Up until this moment we have explored ways to get Windows programs to run in Linux.
    But what if you are a network administrator and your users demand Windows? You
    can still use a Linux server and you don''t have to spend a fortune on specialized
    software to make it work. Samba allows you to have a Linux machine share files
    and printers just like any other machine on a Windows network. Plus, newer versions
    of samba perform most of the other services NT servers perform on a network. So
    what is exactly samba? Samba is a suite of tools and daemons that use the SMB
    (Server Message Block) protocol to perform client-server networking. Samba was
    started by Andrew Tridell in 1991, and it has grown into a robust set of tools
    for networking. To find more out at http://www.samba.org.'
