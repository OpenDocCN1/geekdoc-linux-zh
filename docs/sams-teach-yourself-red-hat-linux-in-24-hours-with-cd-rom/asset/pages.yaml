  md: '# The Tools of the Trade


    The next thing to look at is the tools required to install a tarball. Technically
    install could require virtually everything, but typically if it is extremely unusual
    then it will be included in the tarball or it will be pointed out very clearly
    in the documentation. Generally you will need gcc, autoconf, make, tar, and gzip,
    and a working knowledge of each program. So let''s take a look at these tools.


    gcc is the GNU Compiler. Given enough time it will eventually be able to compile
    anything. Currently it supports C, C++, Objective C, Chill, Fortran, and Java.
    It is the standard for Linux systems. I will not dive into the details of it here,
    to support so many languages and be able to optimize the code, the package has
    to be extremely complex. In fact, there is enough documentation on it to warrant
    a book. Find out more, go to the homepage at gcc.gnu.org.


    autoconf is a tool used to generate configuration scripts for software packages.
    Once the scripts are generated, autoconf is no longer needed. Ideally this tool
    allows the developer to generate a script typically configure. A user who wants
    to install the software from source code should have to run only the configure
    script before compiling. It will generate all of the Makefile, installation scripts,
    and other scripts that normally need to be edited before an install could proceed.
    Although you may not need autoconf installed, now know what is going on if you
    use a configure script. The actual of how autoconf works and what is involved
    in creating a figuring script is beyond the scope of this book, but you can find
    a lot of information online. Two good places to start are sources.redhat.com/autoconf/
    and http://www.amath.washington.edu/~lf/tutorials/autoconf/


    make is a tool used to generate programs and related files. It also handles the
    task of installation, clean and sometimes running test sequences. make gets all
    of its information from a Makefile. make allows users to compile and install compiled
    pieces of software without typing lengthy compiling commands and without knowledge
    of source code. It also keep track of which files are up to date so you don''t
    spend time compiling anything unnecessary. We will explore the details of a Makefile
    later in this hour. If you want to learn more about make, go to http://www.gnu.ai.mit.edu/software/make/make.html.


    tar archive is used to package files into an archive file and extract the files
    from an archive. It was originally created to back filesystems on up tape, but
    has since grown into a very versatile archiving tool. It has an extensive list
    of options, but you will find only a few common ones in most cases. The contar
    options will be explored in a bit. To learn more, consult the man page and http://www.gnu.org/manual/tar/html_chapter/tar_1.html.'
  merge: -1
