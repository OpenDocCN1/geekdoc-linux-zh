  md: '# Hour 8


    You can access a Windows/DOS floppy by issuing the command mount -t /dev/fd0/mnt/floppy
    at the command prompt. Another common way to quickly mount a DOS formatted disk
    is with mount -t vfat /dev/fd0 mnt/floppy.


    # Task: Formatting Disks


    There are several utilities available that will allow you to format disks under
    Linux. GNOME and KDE offer graphical ways to format disks. You can do it under
    GNOME from the User Tool dialog window. This is probably the quickest and easiest
    method of performing this chore. You can access the User Tool from the Linux Main
    menu and then click on System, Disk Management.


    In the User Tool dialog box you will see the device and the directory that the
    device is located in. You have two options: mount/unmount and format. In most
    cases you have to mount the device if it isn''t already mounted in order to format
    it. When you are ready to format the disk, insert a blank disk, click on the Format
    button, and follow the instructions. You will be asked to confirm the format before
    formatting will destroy any information on the disk. Here are the steps necessary
    to format a disk using Red Hat 7.0:


    +   1. If you aren''t already in User Tool, click on System, Disk Management from
    the Linux Main menu.

    2. Insert the disk to be formatted into the a: (fd0) drive.

    3. Click the Format button.

    4. You''ll see a Confirm dialog box. Be sure the Do-Level Format option is selected.

    5. Click the Yes to confirm that you really want to do the format.

    6. Click the No button if you have changed your mind and want to format the disk.

    7. The format can take two or more minutes. Upon completion of the format, if
    the format was successful the Confirm Format dialog closes and you are returned
    to the User Tool window. You can now format another disk or exit the program.


    If you need to format a disk to the Linux filesystem specifications (ext2) you
    can easily use the fdformat command to do this. The basic syntax looks like this:


    ```

    fdformat /dev/fdndsize

    ```'
