  md: 'It can sometimes be tricky to figure out exactly how to fix a dependency error
    because the error message doesn''t tell you which package file comes from:


    ```

    # rpm -Uvh gnumeric*

    error: failed dependencies:

    libxml.so is needed by gnumeric-0.27-1

    [root@localhost RPM]#

    ```


    In the preceding example, you want to install the gnumeric spreadsheet application,
    but if you are missing the file libxml.so.0 you can enter the command rpm -q libxml
    to see if there is a libxml package. If so, you can enter rpm -qpl libxml* to
    see if libxml.so.0 file is included in the libxml package. If libxml.so.0 is included
    in the libxml package (and if it is), you must install the libxml RPM package
    before installing the gnumeric RPM.


    Most applications contain documentation that lists the package''s dependencies.
    You can use the rpm2html or gnoRPM utilities to discern which package a needed
    file comes from.


    # Removing Software


    Applications that were installed as RPM packages are easily removed. To uninstall
    an RPM package, enter the following command:


    ```

    rpm -e [package_name]

    ```


    When you want to remove a package, do not enter the entire RPM filename, just
    the name of the software. For example, to remove Apache from your system, enter


    ```

    # rpm -e apache

    ```


    not


    All files that were installed with the package are removed.


    # Summary


    In this hour you learned to obtain additional Linux software, most of which is
    available for free. You learned about the RPM package and how RPM packages install
    new software. You installed RPM packages using the various options, and you queried
    RPM packages. You also learned how to solve dependency errors during installation
    and how to uninstall RPM packages.'
