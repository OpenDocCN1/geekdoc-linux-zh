  md: '# HOUR 11


    # # Linux Hat Applications


    Red Hat Linux 7.0 comes with dozens of applications, but you can download hundreds
    of additional Linux applications from the Web, and most of them are free software.
    Linux software usually comes in two forms: the RPM package of binary executable
    files and the source code. In this hour you will learn how to install RPM packages.
    In Hour 23, “Compiling and Installing Applications from Source Code,” you will
    learn how to compile and install software from source code.


    In this hour you will


    +   * Find Linux applications on the Web and use the wget utility to download
    RPM packages

    * Explore how the RPM package works

    * Install new RPM packages

    * Query RPM packages for information on the software and the package installs

    * Solve installation dependency errors and uninstall software installed from an
    RPM package


    ![](img/8a0e42659a358d95f558285b9f5bf854_199_0.png)'
