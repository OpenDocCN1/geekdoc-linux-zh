    # Red Hat Filesystem Structure


    Every operating system from DOS to Linux has a method and means of storing files
    and directories in an organized way. Can you imagine what your hard drive would
    look if there wasn''t some way to organize things? There are many reasons for
    this organization, among keeping track of modifications, additions, and changes
    to the system.


    In Linux, every file is stored with a very unique name in directories that hold
    other files and subdirectories. This is known as the tree structure.


    In the tree structure, all of the directories branch into small branches, subdirectories,
    and those subdirectories can have subdirectories of their own. Just as a tree
    has a root, so does Linux. In Linux, the root is represented with a forward slash
    (/).'
