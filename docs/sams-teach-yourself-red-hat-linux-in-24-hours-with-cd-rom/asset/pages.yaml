    # Quiz Answers


    +   1. Name two ways to create space for a Linux installation.

    Add another hard drive or resize the partition on your current hard drive to make
    room for Linux partitions.

    2. What will happen if you use Disk Druid to resize your Windows partition instead
    of a resizing utility FIPS?

    You will no longer be able to access your Windows partition, and data could be
    destroyed.

    3. In what order should your boot order be set in the BIOS before you install
    Red Hat Linux?

    Floppy, CD-ROM, hard drive

    4. Which type of Red Hat installation completely wipes out all data on your hard
    drive before installing? Which type only existing Linux partitions?

    The Server installation completely formats all hard drives on your computer. The
    Workstation installation formats only Linux partitions.

    5. True/False: LILO can boot both Windows 95/98 and Linux operating systems.

    True. If you have Windows NT, you should not install LILO in the Master Boot Record
    (MBR).

    6. How many user accounts can you create during installation?

    You can create as many user accounts as you like.

    7. What is the minimum number of accounts you should create for a one-user system?

    Two—the root account and a user account.


