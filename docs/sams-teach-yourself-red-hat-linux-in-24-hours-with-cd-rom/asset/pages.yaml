  md: '/etc contains the system configuration files that are used by all users. Sometimes
    individual users have configuration files in their individual home directories.
    (.files) that override the configuration files in /etc.


    /home contains the home directories for all users. You keep your actual working
    files and other data in your home directory.


    /lib contains the shared libraries that are needed to run programs. Different
    programs share some of the same libraries of functions, rather than having multiple
    copies of the libraries in different locations, they are kept together in /lib,
    then loaded into memory by the programs as they are needed. This also cuts down
    on memory usage since different programs can share the same libraries in memory.


    /mnt contains the mount points for external drives, such as your CD-ROM, floppy,
    and Zip drives. If you want to mount an external filesystem, as in MS-DOS, DOS,
    you can create the mount point in /mnt. For example, if you have a Windows system
    and a Linux system on the same computer, you can access your Windows files in
    Linux by mounting the Windows partition to a mount point in /mnt.


    /proc is a pseudo-filesystem, which is used as an interface to the kernel. The
    kernel provides the proc filesystem in memory to provide information about the
    system. Each process that is running on your system has a subdirectory in /proc,
    which contains pseudo-files with information about the process. Because it is
    created in memory, nothing in /proc actually takes up disk space.


    /root is the home directory for the root user. You should not put data files in
    /root.


    /sbin contains special commands that are generally used only by root. Some examples
    are fsck, clock, dump, modprobe, runlevel, and linuxconf.


    /tmp is for temporary files. Some people use /var/tmp instead of /tmp.


    /usr contains the commands, applications, documentation, and libraries that are
    needed to operate the system. The files in /usr are meant to be shared by all
    users, and are generally read-only.


    /var contains files that regularly change (hence the name var, for variable or
    varies). Log files and other temporary files, such as mail and print stores, are
    usually kept in /var.


