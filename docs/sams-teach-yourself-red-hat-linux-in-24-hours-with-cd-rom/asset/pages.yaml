  md: '# XFree86—The Linux Window System


    numerous Linux Web sites. Another good place to check is the Linux newsgroups.
    It is likely that if you have the problem, someone else has it, too. And it is
    even more likely that someone else has the solution, so don''t give up. Keep searching
    until you get the answer.


    Your monitor is configured during the initial installation of Red Linux 7.0. Before
    you start the installation, you should collect all the information about your
    equipment that you can, including information about your monitor and video card.
    Be sure you know the video card''s make and model number and the video chipset
    it uses. You will need to know how much RAM it has. It is also helpful to know
    if it is a PCI card, an IDE, or if it is on an integrated board. You may have
    problems with some of the newer computer motherboards (especially the/MMX type
    integrated systems) because the video is built onto the board, and in some installations,
    it isn''t.


    > If you have a newer computer system and are installing Red Hat 7.0 you should
    have few problems. Red Hat 7.0 actually detects most PCI cards and even most components
    on integrated boards. It will detect PCI cards and most other Plug-and-Play devices,
    so you will be up and running in no time. Red Hat Linux 7.0 does a good job of
    detecting and installing the drivers for AGP cards.


    # Task: Configuring Your Monitor


    If you choose to install Server or Workstation during the Red Hat 7.0 installation,
    you will be asked to enter the information as outlined in the following task.
    In most cases, your monitor and video card will be detected during the installation.
    If you need to perform this operation later because you are having problems with
    your monitor or video card and you don''t want to install again, here is how to
    do it:


    +   1. To configure the X Window system you need to run Xconfigurator. You may
    need to set up your monitor or video card, or both.

    2. From a terminal window or the command prompt, type # Xconfigurator. Xconfigurator
    will start, giving you the opportunity to configure the X server for your system.

    3. Xconfigurator will present a list of monitors to select from. If your monitor
    is listed, select it and press Enter.

    If your monitor is not listed, press Custom.


    ![](img/8a0e42659a358d95f558285b9f5bf854_109_0.png)'
