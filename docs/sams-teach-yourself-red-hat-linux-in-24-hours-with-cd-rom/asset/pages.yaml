    +   - Character formatting

    - Dynamic spell check (missspelled words turn red as you type)

    - A ruler with interactive tabs

    - Type 1 fonts

    - Unlimited undo/redo

    - Multiple columns

    - Widow/orphan control

    - Find/Replace

    - Easy import of graphics


