    # Quick and Dirty TCP/IP Concepts


    When you send out data over a phone line via a modem, it appears that a direct
    line is created between your computer and the computer you are communicating with.
    You dial your ISP, enter a Web URL into your browser, and a page downloads from
    a remote computer onto your computer. It seems simple, direct, and uncomplicated,where-in
    reality the communication path between you and the computer contains the Web page
    you requested contains dozens of intermediate steps. The reason data transmission
    can be so simple when in reality it is extraordinarily complicated the TCP/IP
    protocol, TCP/IP, as the name suggests, is actually two protocols that work together.


    IP stands for Internet Protocol. The Internet Protocol makes possible for different
    computers with different hardware to communicate data. A network of computers,
    or hosts, connected by the Internet Protocol is called an internet (an intranet
    is formed with the same idea). Every host on the network is uniquely identified
    by a name address. Hosts also use alphanumeric names that humans use, called hostnames.


    When data is sent over a network, it appears to be a continuous stream, but it
    is actually broken down into small, chunked packets. The packets often travel
    a circuitous route through different servers, gateways, and routers, which direct
    the packets'' data to their final destination, where they are reassembled into
    the original format the data had when it was sent. The mechanism responsible for
    all this is the TCP, or Transmission Control Protocol. TCP works on top of IP
    to make it seem like the complicated route between you and a remote computer is
    a simple, direct connection.


    # How Modems Work


    At the lowest level, your computer is nothing more than millions of bits. Each
    bit has two possibilities: on and off. Each is represented by a one and off by
    a zero. Fundamentally, all your documents—email, digital photos, software applications,
    and even the kernel itself—are seemingly infinite combinations of ones and zeros.
    This way of digital coding is called binary code.


    Telephones, on the other hand, use a signal called an analog wave to carry voice
    conversions. The analog wave is an electrical signal that varies in frequency
    and amplitude in the exact pattern of the frequency and amplitude of the sound
    waves that your voice makes when you speak into the telephone receiver. For a
    computer to be able to communicate with another computer over a telephone line,
    you need a device that converts digital waves to analog waves so that the data
    from the remote computer (like your ISP''s Internet server) can be transported
    over the phone line and then back to digital again, so'
