  md: '# Installing Red Hat Linux 7.0


    # LILO Configuration


    After you format the hard drive, the LILO Configuration screen appears. LILO stands
    for LinuxLoader. You can configure LILO to boot all your operating systems at
    startup, or you can boot Linux with a floppy disk and keep your boot loader untouched.
    The LILO Configuration screen is shown in Figure 2.3.


    The advantage of using a boot disk instead of LILO is that you don''t have to
    rewrite your Master Boot Record (MBR). Your operating systems partitions will
    be completely separate, and the original operating system will always automatically
    boot from the hard drive when you restart your computer. The disadvantage of using
    a boot disk is that if you lose the disk, you will no longer be able to boot into
    Linux (we''ll cover what to do in such an emergency later in the book).


    If you are running Windows 95/98 on another partition, you can safely install
    LILO in the Master Boot Record. At startup, you will be able to select which operating
    system to boot. If you are running Windows NT, do not install LILO in the MBR—either
    not install LILO at all or install LILO on your Linux /boot partition.


    If you are running only LILO, install LILO at the Master Boot Record.


    Figure 2.3

    You can start either with LILO or with a boot disk.


    ![](img/8a0e42659a358d95f558285b9f5bf854_47_0.png)'
