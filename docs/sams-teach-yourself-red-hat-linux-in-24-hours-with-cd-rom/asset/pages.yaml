    # HOUR 22


    # # Troubleshooting and Getting Help


    Although you will learn the basics of how to run a Linux system from this book,
    inevitably you will encounter a problem or question that this book does not cover.
    Everybody''s system is different, so it is impossible to cover everything that
    could possibly go wrong in 400 pages (or 800). One of the most important skills
    you should acquire to be a successful user and administrator of your Linux system
    is good problem-solving skills. In fact, you will most likely develop those skills
    as you become more advanced. This hour, you will learn how to approach a problem
    or new topic, and where to go for help.


    In this hour you will


    +   - Learn a simple, general approach to solving problems and getting help

    - Discover more resources for help other than this book

    - Report a bug to Red Hat using Bugzilla

    - Use Bug Buddy to create a bug report'
