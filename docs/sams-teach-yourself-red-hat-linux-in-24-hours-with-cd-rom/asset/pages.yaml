    to floppies. Also it would be time consuming and expensive. There are several
    options, such as CD burners, tape backups, and Zip drives.


    Zip drives are affordable, the disks for them tend to be expensive. The Zip drive
    is ideal for smaller backups. Configuring a Zip drive for Linux is not hard but
