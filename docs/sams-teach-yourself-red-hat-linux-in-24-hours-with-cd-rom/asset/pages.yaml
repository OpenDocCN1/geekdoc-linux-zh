  md: '# Using linuxconf and Graphical Administration Tools


    # Quiz


    +   1. Why didn''t typing linuxconf work?

    2. What is the advantage of netconf?

    3. Where do I learn more of the details about how the configuration files work?


    # Quiz Answers


    +   1. Why didn''t typing linuxconf work?

    To save the trouble of having to su before running linuxconf, it is now launched
    by linuxconf-auth, which will prompt for a password if you are not logged in as
    root.

    2. What is the advantage of netconf?

    It allows you to quickly test network settings.

    3. Where do I learn more of the details about how the configuration files work?

    To start with, read the man pages. Most important configuration files have man
    pages, or go to http://www.linuxdoc.org. The documents there cover the configuration
    files in documents related to what they configure. The documents are also searchable.
    You can find more detailed information in advanced Linux books like Samsams Unleashed
    series.


    # Exercises


    +   1. Before you add or edit users or groups, take a look at the /etc/passwd
    and /etc/group files. Then after you are through, look at how they have changed.

    2. Read everything in /var/log regularly! If you don''t like it in a terminal,
    plenty of graphical tools will display the logs. The more users that depend on
    your system, the more you need to depend on the logs to tell you what is going
    on.

    3. If you have Ethernet configured, study the /etc/hosts, /etc/networks, and /etc/resolv.conf
    files to see where the configuration information goes.


