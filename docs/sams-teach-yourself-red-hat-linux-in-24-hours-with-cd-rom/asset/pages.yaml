    when you set up new systems that you add an additional account for yourself and
    all users on the system.


    There are a couple of ways you can add users to your system after it has been
    installed. Perhaps the easiest way is with linuxconf. This graphical feature allows
    you to create accounts and many other useful things. In any case, you need to
