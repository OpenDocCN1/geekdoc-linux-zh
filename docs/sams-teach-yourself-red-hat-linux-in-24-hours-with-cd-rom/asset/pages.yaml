  md: '# Setting Up a Simple Network


    capabilities, so you should invest in a good one at the beginning of your networking
    adventure. You can purchase many networking kits, including NETGEAR Linksys, for
    around a hundred dollars. These generally come with a hub, two cards, and enough
    cabled to connect your computers. You can expand your network by purchasing additional
    components or other kits. You should de call or contact the manufacturer to see
