  md: '# The Linux Filesystem


    If you go to your root directory and list the contents, you will see something
    like the listing shown in Figure 4.1.


    Figure 4.1


    ![](img/8a0e42659a358d95f558285b9f5bf854_76_0.png)


    The root directory holds the subdirectories of the system, but no files.


    As you learned in Hour 3, “Linux Basics,” every file and directory can trace its
    origins on a tree to the root directory. The directory structure enables you to
    map the location of every file on your system by *pathname*. The file pathname
    lists every directory and subdirectory from the root directory to the subdirectory
    that holds your file.


    The filesystem is usually spread across several partitions (like those you made
    when installed Red Hat), but it’s not necessary. You can have your filesystem
    on one partition, or on different physical disks, or on a separate computer that
    you access via a network. In Linux, it doesn’t matter—when you use the system,
    as every file is in one directory on one computer. This means every partition
    on every separate hard drive in your filesystem is *mounted* onto a directory
    in the root partition. After the filesystems are mounted, the system acts as if
    separate partition, disk, and remote filesystem is just a subdirectory of the
    root directory.


    > To mount a filesystem just means to make it available for access. In Linux,
    you need a *mount point*, which is the directory where the filesystem is added
    to the root filesystem. Because every mounted filesystem just looks like a subdirectory
    of /, it all acts like it is one filesystem.


    ![](img/8a0e42659a358d95f558285b9f5bf854_76_1.png)


    The root (/) partition holds the root directory of the filesystem. The root filesystem
    is mounted onto the root directory at startup. After the root directory is mounted,
    the other partitions are mounted onto a subdirectory in the root partition via
    mount points. The mount points tell the kernel where to mount each separate partition
    or filesystem so that it becomes part of the root filesystem. For example, the
    directory /usr is a mount point'
