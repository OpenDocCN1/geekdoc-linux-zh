  md: '# Hour 24


    Car myCar;


    To access the members of a class, you use the dot operator. To “start” the car
    you

    would


    ```

    myCar.start();

    ```


    You can use the g++ command to compile C++ programs. To learn more about it, read

    the page. You will find it is very similar to gce in many respects. There is a
    great

    deal more to learn about C++ and classes; however, it is beyond the scope of this
    book.

    There are many excellent books on C++ and I highly recommend that you invest in
    one.

    Here are a few good choices to begin with:


    +   - Sams Teach Yourself C++ for Linux in 21 Days by Jesse Liberty and David
    Horvath

    - Sams Teach Yourself C++ in 21 Days by Jesse Liberty

    - The C++ Programming Language by Bjarne Stroustrup


    # Other Programming Languages


    Although C and C++ comprise most of the code used in Linux, they are by no means

    imit of languages. Odds are you can find a Linux compiler for almost any

    major programming language. Fortran there is the g77 compiler, which should be

    included with the distribution. If you want support for the latest version of
    Java, you can

    go to http://www.blackdown.org/java-linux.html1 for the latest port of the Java
    SDK.

    If you want support for any other language, start by searching the Red Hat documenta-

    tion and the Internet for the available compilers.


    # Summary


    In this hour you learned why you should learn more about programming. You now
    know

    the basics of C and C++ and where to learn more. You also know about GTK+ and
    how

    graphical libraries can help you develop software. Obviously, this chapter will
    not

    into a software developer, but you can walk away with the knowledge of where to

    find out more.


    # Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you’ve

    learned in this hour.'
  merge: -1
