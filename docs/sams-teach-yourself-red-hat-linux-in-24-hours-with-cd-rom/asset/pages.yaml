    # Deleting Files with the rm Command


    After you have finished the XF86config.eg file, you should delete it from your
    home directory, since it doesn''t belong there. To remove a file or directory,
    use the rm command:


    ```

    $ rm /home/judith/XF86Config.eg

    remove file ''XF86Config.eg''? y/n

    y

    ```


    Red Hat gives you a prompt to make sure that you really want to delete the file.
    Other Unices and Linux distributions might simply delete the file with no warning.


    ![](img/8a0e42659a358d95f558285b9f5bf854_68_0.png)


    The commands you have learned so far are shown in Table 3.1, along with a few
    new commands that you can experiment with on your own.


    # Table 3.1 A (Very) Common Unix Commands


    | Command | Description |

    |---|---|

    | pwd | Displays the present working directory |

    | ls | Lists the contents of the directory |

    | cd directory | Changes to directory |

    | cp file new_location | Copies file to a new location or filename |

    | cat file | Views file |

    | more | Displays the output one screen at a time |

    | Ctrl+C | Aborts the command (only works while the command is still running)
    |

    | rm file | Removes (deletes) file |

    | mv file new_location | Moves a file to a new location, also used to rename a
    file |

    | mkdir dir_name | Creates a new directory |

    | rmdir dir_name | Removes an empty directory |

    | rm -r dir_name | Removes a directory and all its contents |'
