  md: '# Hour 9


    I/O number that corresponds to it. IRQ stands for Interrupt Request. A device
    asks for attention from the CPU (Central Processing Unit) by sending requests,
    or interrupts, on the wire that is assigned to it. When data comes in over the
    modem, the serial port sends an interrupt to the CPU to let the CPU know that
    the data is in the serial buffer and to instruct the CPU to get the data so that
    the serial port can receive the next set of data (all happens very quickly; only
    1 to 16 bytes of data can be processed at a time). The IRQ number tells the serial
    port which wire to use to send an interrupt to the CPU so that the CPU knows which
    device the interrupt comes from.


    Every serial device stores its IRQ and I/O number in its memory. The I/O address
    and IRQ number are determined by jumpers on the device, Plug-and-Play software,
    or a Plug–and-Play BIOS.


    PCI devices work a little differently from ISA devices, but the basic concept
    is the same.


    ![](img/8a0e42659a358d95f558285b9f5bf854_170_0.png)


