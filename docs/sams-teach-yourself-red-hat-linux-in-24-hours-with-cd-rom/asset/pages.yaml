  md: '# Exploring the Red Hat Linux Filesystem


    for the /usr partition. If your /usr directory is not a separate partition, then
    it is just another directory in the root partition. If your /usr directory is
    located on another computer, it is attached to your filesystem by the mount point
    and then acts like any other directory that is physically in your hard drive.


    If you have other operating systems or devices such as a CD-ROM or floppy drive,
    you must mount them onto the Linux filesystem before you can access the files.
    For example, when you want to use your CD-ROM, you mount it using the mount point,
    which in Red Hat is /mnt/cdrom by default. The same applies for /mnt/loppy (or
    /mnt/fd0), and if you want access to other operating systems, /mnt/dos or anything
    else.


    ![](img/8a0e42659a358d95f558285b9f5bf854_77_0.png)


    > You do not have to use /mnt/cdrom; you can use any directory, as long as it
    is defined in the etc/stab directory. By convention, however the names for different
    mount points have evolved into a generally recognized set of standards that most
    people follow. The Linux Filesystem Standard (FSSTND) sets the standard upon which
    the Red Hat filesystem is based.


    # The Red Hat Linux Directory Structure


    This section summarizes the generally accepted use for each subid in the root
    directory.


    +   / contains the mount point for the major filesystems. In Red Hat, the root
    directory doesn''t contain any files at all, just directories for mounting the
    other filesystems.


    +   /bin contains the basic commands that are used by all users, such as cat,
    cp, ping, vi, su, and ls.


    ![](img/8a0e42659a358d95f558285b9f5bf854_77_1.png)


    > Notice that cd isn''t in the /bin directory. cd is a special command that is
    built right into the kernel.


    /boot contains the files used by the boot loader, such as LILO, to boot the system.

    /dev contains special files for different hardware devices. If you look in dev.,
    you will see many files for devices that you might not have. For example, there
    are files in /dev for the amigamous, atimouse, and atiramouse, different ISDN
    devices, and different SCSI devices (sda, sdb, and so on). Empty device files
    don''t take up much space, it is best to leave the unused device files alone.
    Otherwise, you will have to recreate the device file when you want to add new
    hardware.'
