  md: '![](img/8a0e42659a358d95f558285b9f5bf854_363_0.png)


    # HOUR 21


    # Automating Tasks with Shell Scripting


    In previous hours you learned to set up and use your Linux system. In this hour
    you will see the value of shell scripting and which tool to use for which job.
    There are quite a few scripting languages to choose from and some are better choices
    for specific tasks than others.


    You are probably asking why you need shell scripting at this point. There are
    so many graphical tools for system maintenance already. Plus, most distributions
    are extremely preconfigured. But, it is unlikely that there will ever be a preexisting
    script or tool to suit every user’s needs, considering it is unlikely that any
    two Linux users have exactly the same needs and preferences. Most Linux users
    do have repetitive tasks to perform. If you have repetitive tasks to perform and
    want to free up some time, then it will be worth your while to learn the basics
    of shell scripting.'
  merge: -1
