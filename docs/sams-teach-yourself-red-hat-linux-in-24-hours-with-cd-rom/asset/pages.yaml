    # Session Management and Logging Out of GNOME


    One of the more useful features of GNOME is that of session management. With session
    management, GNOME remembers all the GNOME-compliant programs you have run before
    you log out, their position on the desktop, and your current place in the file.
    To use session management, leave your applications running when you are ready
    to log out of GNOME. Select Log Out on the Main Menu. In the logout confirmation
    dialog box that appears, check Current Setup. The next time you log in to GNOME,
    GNOME will automatically restart all the applications so that your desktop appears
