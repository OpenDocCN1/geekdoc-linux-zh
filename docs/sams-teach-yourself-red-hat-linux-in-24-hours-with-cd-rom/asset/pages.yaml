  md: '# Learning About the tcsh Shell


    tcsh can be used as an interactive login shell and as shell script command processor.
    tcsh is a very well enhanced and completely compatible version of the Berkeley
    UNIX C shell (csh). This versatile shell includes or supports the following:


    +   * A command-line editor

    * Spelling correction

    * Programmable word completion

    * Job control

    * History function and aliases

    * Input and output redirection

    * Pipelines

    * Ability to change prompts

    * Key bindings

    * Spelling correction


    In addition, tcsh features many commands and variables that we will look at in
    the last part of this hour. We will also look at some features that aren''t included
    in other shells.


    # Features of tcsh


    Most shells support command-line completion and tcsh isn''t any exception. Command-line
    completion can be used in tcsh the same way you use in bash and ksh—press the
    Tab key at any point you are typing a command and tcsh will attempt to complete
    the command for you.


    You can access the command history in tcsh. This means that you can recall the
    last keys that were pressed or the last commands that were entered by taking some
    action. The tcsh command history is similar to pdsh and bash. The shell remembers
    the last commands that you entered into the shell and stores them in a history
    list. You can invoke the history by typing **history [-hr] [n]** at the prompt,
    where the n option is the number of commands to display. If you don''t specify
    how many commands to display the history list will scroll down the screen. Once
    you have invoked the feature, you can use the up and down arrow keys to view the
    commands'' history and the left and right arrow keys to edit the commands.


    tcsh also contains many history editing and navigation commands. They are too
    extensive to list here, but you can see the tcsh man page for more about them.
    Just type in **man tcsh**.'
  merge: -1
