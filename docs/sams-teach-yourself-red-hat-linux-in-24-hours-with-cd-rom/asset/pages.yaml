  md: '![](img/8a0e42659a358d95f558285b9f5bf854_89_0.png)


    # HOUR 5


    # Using the Visual Editor

    (VIM)


    So far you have learned to view, copy, and move files, but you haven''t learned
    how to create and edit files. There are many text editors available for Linux,
    but the two most widely used are called the Visual Editor Improved (VIM for short)
    and Emacs. VIM is much like the traditional vi, but with many improvements and
    extensions. Although people tend to get passionate about their choice of editor,
    we will only discuss (VIM) in this book. You can have a very successful Linux
    career without ever using Emacs, but you cannot survive without knowing vi. This
    hour concentrates on using VIM for general editing.'
