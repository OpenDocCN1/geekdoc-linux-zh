  md: '# Integrating Linux and Windows


    # Installing and Configuring WINE


    Instead incurring the overhead of simulating a whole virtual computer, there may
    be a simpler alternative in some cases. WINE is an ongoing effort to implement
    Windows APIs for Unix- and Linux-based systems. It allows many Windows-based programs
    to run under Linux without any porting at all. To learn more about this you can
    go to the main Web site at http://www.winehq.com. If there is a copy included
    with your Red Hat distribution, you can install that. However, it would be a good
    idea to get the latest copy of WINE from the Web site. WINE evolves very rapidly,
    so a copy that is only a month old could have drastically different capabilities
    than the latest version. This also means you need to consult the Web site for
    the latest news and configuration hints.


    When you go to the Web site and look under Downloads you will see a variety of
    choices. Follow the link for the version of Red Hat that offers an RPM download.
    If it doesn''t, it will tell you which libraries it has a problem with. Figure
    out conflicts on your own when rpm will do for for? You may be presented with
    the choice of several RPMs. Unless you want to manually compile WINE. After you
    download the file, su into the superuser account and change the directory the
    RPM is in. Then you will type:


    ```

    # rpm -Uvh wine-*.rpm

    ```


    If there are no conflicts, you are ready to move on. If it complains about library
    dependencies, go back and see if there is a version suited to the version of Red
    Hat you have. If no alternative package can be found, you may have to install
    from a tarball or build the source yourself. But don''t worry. We''ll cover all
    you need to do that in later hours. If your install was successful you probably
    saw a message telling you to edit your wine.conf file and read the man page on
    wine.conf. So let''s configure WINE together.


    The best way I have found to do this is with one terminal displaying the man page,
    having /etc/wine.conf open in another terminal in your favorite editor, and having
    a browser open to the WINE homepage. WINE has to be configured to your specific
    setup I can''t tell you exactly what to type in, but I can tell you what you will
    probably configure to. Once you have all of that opened up, we are ready to begin.


    The first thing you will see in wine.conf is a listing of MS-DOS drive entries
    of the form:


    ```

    [Drive X]

    Path=xxx

    ```


