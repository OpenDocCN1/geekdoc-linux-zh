  md: '# Summary


    In this hour you learned about the Linux kernel. You learned how the kernel interacts
    with the processor and your memory to achieve optimal performance. You learned
    about the /proc filesystem and how you can use it to gather useful information.
    You also learned about commands that take the information in /proc and present
    it in readable format.


    # Workshop


    The Workshop contains quiz questions and exercises to reinforce what you''ve learned
    in this hour.


    # Q&A


    +   Q What happens to the /proc filesystem when I reboot?


    +   A The /proc filesystem is created anew by the kernel during the initialization
    process every time you reboot. Because it exists only in memory, the /proc filesystem
    doesn''t exist until the kernel creates it.


    +   Q Is it possible to look at the individual parts of the kernel?

    A The kernel source code is separated into files called modules. When you compile
    the kernel, the modules are combined into one big file, which is your kernel.
    Looking at the modules of the kernel source code is a great way to learn how the
    kernel works. The source code for the kernel is available as an SRPM (src.rpm)
    for download from Red Hat at http://www.redhat.com/apps/download. After you install
    the SRPM, it should appear in /usr/src/redhat/SOURCES. Until the kernel tar file.
    The source code for the kernel will be in a directory linux.


    # Quiz


    +   1. Name three kinds of memory in your Linux system.

    2. What does pid stand for?

    3. Where does the /proc filesystem reside?

    4. True/False: The kernel is another name for the operating system.

    5. How often is the /proc filesystem updated?'
