    # Dia


    Dia is a diagram creation application, similar to the commercial Visio. With the
    current release of Dia (0.84 at the time of writing), you can make entity relationship
    diagrams, flowcharts, UML diagrams, electrical circuit schemes, and network diagrams.
    You can also create your own in the XML file format and add them to the collection.
    Files are saved in XML, so it is easy to port and embed diagrams into different
    applications. Pixmap images can be imported and resized quickly, without having
    to be redrawn by the application.


    Although certainly as powerful as Visio, Dia is much easier to learn (you can
    learn how to use it in about five minutes), so it is a superior choice for simple
    flowcharts and diagrams, whereas Visio can be quite unwieldy.


    Dia is organized little differently from Visio. Instead of a screen with a palette
    on one side and a toolbar at the top, Dia has the palette in a window separate
