  md: "# Introduction to Linux Programming 393\n\nAt this point you can create variables\
    \ and manipulate them in any way desired. But, this is still limited to be useful.\
    \ It only allows you to create code that runs straight through. Although this\
    \ is fine for number crunching, it will not do interactive programs. Odds you\
    \ want a program to do multiple tasks and you want to offer the ability to choose\
    \ which task it will perform at runtime. That is why there are flow control statements.\
    \ Flow control statements evaluate an expression, and depending on the results,\
    \ decide what the program will do. The two types of flow control statements are\
    \ branching and looping. Branching consists of if and switch statements. The syntax\
    \ of the if statement is as:\n\n```\nif ( expression )\n    statement 1;\nelse\n\
    \    statement 2;\n```\n\nIf the expression is true, the first statement is executed;\
    \ if it is false, the second statement is executed. If you want to respond to\
    \ a menu selection, a switch statement will be a better choice. The switch statement\
    \ examines the expression and executes the code of whatever case matches the value\
    \ of the expression. The syntax is\n\n```\nswitch ( expression ) {\ncase 1:\n\
    \    statements;\n    break;\ncase 2:\n    statements;\n    break;\ndefault:\n\
    \    statements;\n    break;\n}\n```\n\nThis is fine if you want to execute only\
    \ one piece of code or another, but if you want to repeatedly execute one segment\
    \ of code you need to use looping constructs. Two of the common types of loops\
    \ are the for and the while loops. A while loop repeatedly executes the block\
    \ of code below as long as the expression is true. The syntax for the while loop\
    \ is as follows:v\n\n```\nwhile ( expression ) {\n    statements;\n}\n```"
