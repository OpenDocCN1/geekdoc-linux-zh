  md: '# Workshop


    The Workshop contains quiz questions and exercises to help reinforce what you''ve
    learned in this hour.


    # Q&A


    Q What is the /opt directory for?


    +   A Some Linux distributions use the /opt directory for operational files, such
    as applications. The /opt directory isn''t really used in Red Hat, but it is included
    by default.


    +   Q Do I need to bother with permissions if I''m the only user on your system?

    A Permissions can still be useful, even if you are the only user on your system.
    By denying your ordinary user account access to system files, and then making
    sure that you don''t everyday work while logged in as root, you can prevent yourself
    from damaging your system through a mistake or carelessness.


    # Quiz


    +   1. What is a mount point?

    2. What is a pathname? In which directory does the pathname start?

    3. What is the difference between the commands in /bin and /sbin?

    4. With a hard link, how do you tell which file is the original file and which
    file is the link?

    5. What does x permission mean for a directory? What does write permission mean
    for a directory?


    # Quiz Answers


    +   1. What is a mount point?

    A mount point is a directory where a filesystem is mounted so it can be accessed.

    2. What is a pathname? In which directory does the pathname start?

    A pathname is the path of directories from the root directory to the subdirectory
    where a file is located.

    3. What is the difference between the commands in /bin and /sbin?

    /bin holds the most fundamental commands for all users. /sbin holds system configuration
    commands that are usually used by root.'
