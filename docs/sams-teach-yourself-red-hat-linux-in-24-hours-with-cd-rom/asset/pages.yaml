  md: '# 64 Hour 4


    Setting permissions enables you to determine exactly who should have access to
    your files, and exactly what other users on the system should be able to do with
    your files and directories. Every file and directory on the filesystem has a set
    of permissions attached to it. It specifies who has access to the file or directory
    and what kind of access the user has.


