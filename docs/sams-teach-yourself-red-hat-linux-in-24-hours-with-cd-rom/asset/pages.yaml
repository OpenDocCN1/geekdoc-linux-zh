  md: 'gzip is a GNU compression tool. Its usage is very simple and it usually achieves
    very good compression. You can find out more about its usage on a man page, and
    you may find the online documentation interesting. It can be found at http://www.gnu.org/manual/gzip-1.2.4/gzip.html.


    # The Installation Process


    The installation process may vary from program to program this section cannot
    cover every possibility. The best way to learn is by working through an example.
    Most programs at least use autoconf, so the example we will use for that is. Everything
    needs to be done in a non-autoconf-based install cannot be predicted. The general
    patterns in configuration files will be explored, though in this hour we will
    install Bombermage, which is a GNOME-based clone. If you have spent much time
    as I have playing this game, I apologize ahead of bringing all productivity to
    a halt.


    To begin, go to http://www.gnu.org/applist/ and follow the Browse Software Map
    by Category link. You can follow the link to find many other GNOME applications,
    but today you are looking for Bombermage, so follow the Entertainment link. You
    will find a link for Bombermage, which gives you more information about the program.
    You will also find a link to the Bombermage home page at bombermage.sourceforge.net.
    and take a few minutes to read about the program. It is always good to have some
    idea of what you are installing. Take a look at the requirements section and look
    at all the libraries required. In an RPM install, all of that will be checked
    for you. Now aren''t glad you don''t have to do all of the time?


    After you are examining the Bombermage site, go to the download page and download
    the bombermage-0.6.2.tar.gz. RPMs are available for this program, but you may
    want to learn how to do a manual install. You should save this file in your home
    directory or /tmp. Many of the steps can be performed in a user account, but odds
    are the actual installation of the files will have to be done in the root account.
    If you are not in the superuser account while performing the following steps and
    you encounter problems, odds are why.


