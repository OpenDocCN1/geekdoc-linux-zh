  md: '# Linux Application Development with GTK+


    Another common misconception about programming for Linux is that everything has
    to be built from scratch. If you are designing an application with a GUI (graphical
    user interface), coding buttons, windows, and other GUI items that have already
    invented may seem boring and pointless. Many prefer drag-and-drop development
    environments like Visual Basic where you only have to code the actual functionality.
    Although there is not a Visual Basic port available for Linux, Linux GUI development
    is far from developing from scratch. A plentiful of tools and libraries exist
    to aid in software development. In this hour we will look only at the GTK+ (Gimp
    Toolkit) development library, but there are plenty of others available. If you
    prefer KDE there there are still the original libraries for X11.


    GTK+ provides objects and widgets that provide commonly used functionality. To
    get an idea of what GTK+ offers, take a look at the GNOME desktop. GNOME is an
    extension of GTK+. Widgets are the objects that you generally interact with in
    a GUI, such as buttons, scrolls, text boxes, and so on. By using these widgets,
    programmers do not need to spend a great deal of time developing the actual GUI
    and can concentrate on the functionality of the program. Widgets provide easy
    access to all the commonly used graphical information. To get an idea of how much
    work this saves, look at the simple application in Figure 24.1.


    Figure 24.1


    A simple graphical application.


    ![](img/8a0e42659a358d95f558285b9f5bf854_406_0.png)


    # Creating a Simple Application


    This application is just a window with a single button. It may seem rather trivial,
    but once you try to code it without widgets, it will become apparent how important
    they are. To create this application, you would have to follow the sequential
    steps that are listed below. I am not expecting you to do this task, but I wanted
    to show you all that is involved in creating an application.


    +   1. Sketch an initial design of the window and the button, including how the
    button will look when up or while pressed.


    +   2. Assign dimensions to the windows and buttons in pixels and research the
    low level X11 drawing routines.


    +   3. Develop software routines to draw a button in each state and the window.
    You would also need a routine to draw text on the button.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Introduction to Linux Programming


    +   4. Next, enhance the drawing routines to be able to draw at an arbitrary location
    on the screen and add error checking. After all, you should not be able to draw
    the button outside the screen.


    +   5. Develop software routines to read system events including mouse clicks.


    +   6. Use that code to develop code capable of processing events and determining
    when the mouse has been clicked while over a button drawn by the routines.


    +   7. Join all the previous code in an object-oriented manner so that the button
    realizes it has been clicked.


    +   8. Write a program that will create one of these windows and place a functional
    button on it.


    +   9. Write the code to respond to a button click.


    Not such a simple little application is it? All of this would have to be done
    to write an application with a single button on the window. The following task
    will show you a simpler method.


    # Task: Creating an Application with a Widget


    Since this is an interactive graphical program, most of the processing is based
    on events. An event is exactly what it sounds like. When something happens on
    the system, such as a mouse click, an event is generated. It is then processed
    by an event handler. With widgets, you would only be responsible for the event
    handler, but in the preceding example you would have to code everything. Thus,
    the first seven steps in the preceding list would be extremely time consuming.
    Most GUI software is not developed this way. Try creating this widgets:


    +   1. Open a new source code file and include the GTK+ libraries.


    +   2. Create a window widget and a button widget.


    +   3. Initialize GTK+, create the objects, and tell GTK+ to show the objects.


    +   4. Tell GTK+ to start processing events.


    +   5. Code the application''s response to the button being clicked.


    +   6. Go have a cup of coffee and rejoice in your programming brilliance.


    Clearly this is far more practical than the first method. To see how simple this
    is, we will write this program. To start, open your favorite text editor and type
    in the code in Listing 24.1.'
