  md: 'XFree86 is the software that exists between the hardware and the graphical
    user interface (GUI) that you see when you start the client. When you run a window
    manager such as GNOME, KDE, or Enlightenment, to name a very few, you are actually
    running XFree86 because these managers run as XFree86 clients.


    # # Installing X


    During the installation of Red Linux, you go through the routine of selecting
    your window manager, the graphics (video) card, and many other things. When you
    are doing your installation, you should take your time and make sure that you
    are careful and meticulous in your choices. Doing the installation correctly the
    first time and making the right choices can save you a lot of pain later. Red
    Linux creates (in a roundabout) a file called X86Config. This important file contains
    all the information about your X Window configuration and determines how your
    programs run. If you are lucky in the initial installation, you will have a clean
    XFree86Config file. If you have problems, you can make changes in this file. For
    the record, this file should be located either in /etc/x11 or the /usr/X118/lib/X11.
    If you launch X as the root operator, the file may be in the /root directory.
    In my current installation it is located in /usr/X116/lib/X11, but yours could
    be hidden from you. In that case, get to a little searching.


    When you install Red Linux, you are usually given an option to start the X system
    automatically, or you can start it from the command line manually. The most common
    way to start the X Window system from the command prompt is as follows:


    ```

    # startx

    ```


    When you use the preceding command, it will start the default window manager,
    which is normally GNOME. You can choose from many window managers, but most people
    use either GNOME, KDE, or both. In the next section you will discover how to choose
    and configure the right monitor for your system. If you are using an existing
    monitor, you will learn how to configure it during the installation process.


    # # Choosing a Monitor


    Red Hat Linux 7.0 will support most of the monitors that you are likely to purchase.
    Numerous hardware compatibility lists are on the Internet, including Red Hat''s
    own site. You can find Red Hat''s compatibility list at http://www.redhat.com/.
    Of course, isn''t always possible to purchase new components for your system because
    you may already have the equipment on which you are doing the installation. Most
    monitors are supported by Red Hat Linux, but if yours isn''t you you may be able
    to find a driver on one of the'
