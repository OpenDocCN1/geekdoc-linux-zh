    ![](img/8a0e42659a358d95f558285b9f5bf854_107_0.png)


    Most Unix and Linux systems use the XFree86 Window system and Red Hat Software,
    Inc includes the XFree86 X Window system in its distributions. Red Hat has the
    version of XFree86 that is produced by the XFree86 Project. You may see the product
    referred to as X, X Window, X11, X11R6, or XFree86. If you choose to install the
    X Window system on your computer from Red Hat installation, you will have the
    most current version.


    > Should you upgrade the X Window system each time it is available? There are
    times you might want to upgrade to a newer version of the X Window system. For
    example, if you purchased a new graphics card that wasn''t supported by the old,
    you should upgrade.


    The current version of XFree86 is 4.0,1 (as of July, 2000) and this is the first
    upgrade in XFree86 4 series. This release (4) is a major redesign of the basic
    architecture of XFree86''s original version of the X Consortium''s server. XFree86
    4.0.1 has many enhancements that weren''t prevented previously. These include
    a graphical tool, 3D support by the addition of DRI GLX drivers, service fixes,
    and additional support for other systems such as BSD. You can download the full
    distribution, patches, and updates from ftp://ftp.xfree86.org. However, with Red
    Hat Linux 7.0, you shouldn''t need to upgrade because the current version will
    be installed when you install Red Hat Linux on your system.'
