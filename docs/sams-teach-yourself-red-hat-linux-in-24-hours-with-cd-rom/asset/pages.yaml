  md: '# Linux Productivity Applications


    # Corel WordPerfect Office


    Corel WordPerfect Office 2000 for Linux is a complete office suite that was developed
    directly from Corel''s WordPerfect Office 2000 for Windows. The suite contains
    everything you could want in an office suite and more, including the WordPerfect
    processor, Quattro Pro spreadsheet, Presentations slide show and drawing cartoon
    software, the simple Paradox relational database, and WordPerfect Central scheduler,
    address book, and contact management applications.


    WordPerfect Office is much less expensive than Microsoft Office, and the applications
    are arguably superior to those in MS Office. The Linux version, while powerful,
    tends to be a memory hog, and is not yet as stable as could hoped. Still, if you
    want to run a Linux office suite with much power and flexibility as that available
    for Windows, Corel WordPerfect is probably your best choice.


    The home page for Corel WordPerfect Office 2000 is http://linux.corel.com/products/wpo2000_linux/index.html.
    The office suite is not available for free download, but you can download Corel
    WordPerfect 8 for free at the same site. You can also pick up a copy of Sams Teach
    Yourself WordPerfect Office 2000 for Linux by Alan Golub and Judith Samson, Sams
    Publishing, or WordPerfect Office 2000 for Linux: the Official Guide, by Philip
    Rupp, Osborne McGraw-Hill.


    # Applicware


    Applicware is a full office suite by VistaSource. It''s not available for free
    download, but you can buy it at http://www.vistource.com.


    Applicware includes


    +   * Words: a word processor

    * Spreadsheets: a spreadsheet application

    * Graphics: an image editor and display tool

    * Presents: a slide show presentation creator

    * Data: a database program

    * Mail: a POP3-compliant email client

    * ELF (Extensible Language Facility): a macro programming language that allows
    you to create custom applications


    Applicware is a native Linux application, meaning that it was written from scratch
    for the Linux operating system. For this reason, it runs faster and is more stable
    than Corel Office or StarOffice, which run on top of Windows emulators.


    ![](img/8a0e42659a358d95f558285b9f5bf854_215_0.png)'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Appluxware office applications use a common object format, so you can embed
    files made with one tool in the suite into a file in another application.


    Appluxware is one of the more flexible commercial applications. You can create
    your own extensions to the office suite and custom applications using the Appluxware
    component library. If you need flexibility and customizability, Appluxware is
    a great choice.


    # # StarOffice


    StarOffice is part of Sun Microsystems, and was one of the first Linux office
    suites to gain popularity. StarOffice 5.2 is available for free download from
    the StarOffice Web site at http://www.staroffice.com.


    Like its counterpart, Corel WordPerfect, StarOffice can import and export all
    Microsoft Office formats.


    The great advantage of StarOffice over other commercial office suites is that
    you can download it for free. StarOffice is not released under the GPL or a similar
    license, however-ever, there are restrictions to how you can use and redistribute
    it.


    The StarOffice suite comes with the following applications:


    +   * StarOffice word processor

    * StarOffice Calc spreadsheet

    * StarOffice Impress presentation software

    * StarOffice Draw

    * StarOffice Image graphics software

    * StarOffice Schedule (Calendar)

    * StarOffice Mail and Email

    * StarOffice Database

    * StarOffice News reader

    * StarOffice Math software


    # # GNOME and KOffice


    GNOME and KOffice are the free software answers to commercial productivity office
    suites. Because KOffice is in the early stages of its development, we will only
    briefly discuss the Office suite at the end of this section.


    GNOME applications are based on the concept of component software. Instead of
    large, complex applications that contain every imaginable feature, the GNOME Office
    consists'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Linux Productivity Applications


    of a string of small


    Applications become object containers that you plug components into the functionality
    you want. It then becomes easy to designer applications that have all the features
    you want, with none of the fluff. It is also easier to learn a very complex piece
    of software if you start out with your simpler functions and add complexity as
    you get more familiar with the components.


    With GNOME Office, for example, companies can design individual word-processing
    applications based on the needs of each person''s job function. People who need
    the basics can get the core application, and others can add components as they
    need them. Accountants can get spreadsheet functionality that they can attach
    to word processing. A secretary might not need only the basics of the spreadsheet
    to create simple documents and not hundreds of others. Graphics designers can
    get the graphics import included in their word processing software, whereas managers
    might not need graphics component


    GNOME as a business solution is not quite ready to be unleashed in the office.
    There are some intriguing aspects to GNOME, however, that deserve notice.


    GNOME is free. In the Microsoft era, software is expensive, prohibitively so for
    the small business owner. Even for large corporations, the price tag for licenses
    for one new application can run into the hundreds of thousands of U.S. dollars.


    It is easy to understand the GNOME applications inside and out. There are no expensive
    training courses that teach you the undocumented secrets and tricks of the software,
    or even the basics. If you want to know everything there is to know about GNOME
    application, just look at the source code and the developer documentation.


    You also do not have language restrictions with GNOME applications. Because the
    interface for the components is CORBA, any component can be written in any language.
    So, if you want to design your own add-on to a GNOME application that was written
    in C, but your developers prefer to work in C++ or even an interpreted language
    like Perl, they can write the component in whatever language they want.


    ![](img/8a0e42659a358d95f558285b9f5bf854_217_0.png)'
