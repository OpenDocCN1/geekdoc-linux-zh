  md: '# Automating Tasks with Shell Scripting


    not contain "awk". The second record is read and fails both tests. Then the third
    record is read and fails the first test, but the line contains "awk" so the second
    pattern matches the record number with "matched awk" is printed. This is the end
    of the records, so the END block just prints out the number of records read.


    awk is an easy and powerful pattern-matching tool that anyone with C programming
    experience should be able to learn with ease. If you want to know if you should
    use awk for a script, ask yourself this question: Am I only trying to extract
    and format text data from a command or a text file without special processing
    needs? If you can answer yes, then awk will be a very good choice. If you need
    a nice interface or if you need complex processing capabilities, you may want
    to look at another language. awk is far too to cover in a single chapter and if
    you find a lot for it I recommend looking into a good book on the subject. A lot
    of offerings have popped up in the last years and you should be able to find one
    to your liking.


    # Tcl and Tk


    The tcl (Command Language) scripting language and the tk toolkit provide an environment
    to create graphical user interfaces for the X Window system. The language is easy
    to learn, and it allows much more rapid development of GUIs than convenient programming.
    Tcl/Tk was developed by John K. Ouster while he was a professor at the University
    of California at Berkeley. It is used in a wide range of software products today.
    The Official Web site for tcl/tk is http://dev.ajubasolutions.com. The site is
    hosted by Ajuba Solutions, which supports commercial and open source tcl/tk efforts.


    The power of tcl/tk is in its ability to handle the unpleasant interface details
    you normally have to deal with in C or a similar programming language. In the
    actual scripts you only have to specify what the interface should look like and
    what actions it should take. You are not responsible for determining when something
    has been clicked, when to refresh the screen, or for any other GUI problems.


    Before diving into tcl/tk programming, check and make sure the proper packages
    are installed. To do this type following:


    ```

    # rpm -q tcl

    # rpm -q tclx

    ```


    If the packages are installed, their names have been displayed after you ran the
    command. If they are not installed currently, get your Red Hat CD-ROMs and install
    them, or download the latest versions from http://dev.ajubasolutions.com.


    ![](img/8a0e42659a358d95f558285b9f5bf854_369_0.png)'
  merge: -1
  pgno: 369
- img_proc: true
  md: 'The important binaries for tcl/tk are tcl, wish, and tclhelp. There are many
    pages available, but you will find the tclhelp command much more useful. Try all
    of these commands to see if everything is ready. If they all give you a response,
    then it is time to begin examining tcl/tk.


    The shell interpreter you will use to interact with tcl/tk are tcl and wish. The
    difference between tcl and wish shells is that tcl supports only tcl, whereas
    wish supports tcl and the tk window. The shell can run interactively or in script
    form. To create a simple tcl script, save the following hello.tcl:


    ```

    #!/usr/bin/tcl

    puts "Hello World"

    ```


    Exit the editor and use chmod +x hello.tcl to make it executable. Now when you
    run hello.tcl, it will print "Hello World". Unlike other scripting languages,
    the tcl interpreter may be in different locations on different Linux distributions.
    In that case the script would be edited, or you would use special tricks to figure
    out where she is.


    Commands in tcl are very simple. Follow the form


    ```

    <command name> <arguments>

    ```


    Commands should be terminated with a semicolon, although it is not required as
    long as they are entered one command per line. A comment in tcl is any line that
    begins with #. Variables in tcl can have any name and they do not declared types.
    tcl determines if a variable is a string or a number by its usage. All of the
    ANSI supported numeric types are understood by tcl. I recommend using tclsh at
    this point by typing tcl in a terminal window and trying the examples that follow.
    It is really the best way to understand tcl. Don''t be afraid to experiment here.
    You would really have to hard hurt something.


    ```

    $ tclsh

    % set foo 5

    4


    % set baz 13;

    13

