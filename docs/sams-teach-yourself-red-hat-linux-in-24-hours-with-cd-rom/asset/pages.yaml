    to start the installation. If your computer will not boot from CD-ROM (if your
    computer is older than 1997 it may not have this capability), then you must boot
    from a boot disk. If you do not have a boot disk, you can make one from the boot
    image file that is CD-ROM number 1.


    If you''re not sure how your computer boots, check your BIOS. You can check yours
