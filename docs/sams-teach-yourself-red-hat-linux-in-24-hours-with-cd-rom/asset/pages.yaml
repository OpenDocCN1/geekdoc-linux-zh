    # Quiz Answers


    +   1. Name the three main parts of any computer.

    Processor, memory, input/output devices.

    2. True/False: You can obtain a copy of the Linux source code if you send $50
    to Linux Torvalds.

    False. You can download the source code for Linux from the Web for free. It is
    also usually included in Linux distributions on a separate CD-ROM.

    3. What does “GNU” stand for?

    GNU''s UNIX

    4. True/False: UNIX was invented at Red Hat in 1990.

    False. Dennis Ritchie and Ken Thompson invented UNIX in the 1970s.

    5. What are the differences between the different Linux distributions?

    There are differences in applications that are included, installation tools and
    utilities, but the basic Linux operating system is the same.


    # Exercises


    +   1. Visit the GNU Web site at http://www.gnu.org. How are the four software-
    freedoms numbered?

    2. Visit the Red Hat Web site at http://www.redhat.com.


    # Exercise Answers


