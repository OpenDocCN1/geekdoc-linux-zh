    # Virtual Consoles and Terminal Windows


    Virtual consoles allow you to work in several windows at once or move through
    many windows at a time. GNOME features several virtual consoles that you can view
    by pressing a combination of keys. You can access these virtual consoles by pressing
    Ctrl+Alt+Fn (Fn is any of the first six keys on your keyboard). When using virtual
    consoles, you may be asked to log in. After you have logged in, you can use the
    system normally on any of the virtual consoles. To return to your X session, just
    press Ctrl+Alt+F7. This may not work if you have programmed your first six keys
    for something else, so you may have to change the programming for those keys if
    you want to use this feature.


    ![](img/8a0e42659a358d95f558285b9f5bf854_119_0.png)


    > You can actually use virtual screens if you have twelve function keys and they
    aren''t programmed for something else. Most distributions of Linux come with five
    default virtual screens. Virtual screens or consoles have information about your
    system.


    What is in these virtual consoles or screens? During the Linux installation process,
    Linux makes several kinds of diagnostic messages available to you in five virtual
    consoles, which include access to the bash prompt. You can switch through these
    consoles using a single keystroke. Suppose you are working on a document on your
    desktop and suddenly need access to the shell prompt. You can access the shell
    by using the function keys.


    6


    Another feature of virtual consoles is useful when you are installing Linux and
    you have problems. You can switch through the consoles to find information on
    what and how was installed. When you are diagnosing installation problems, you
    should use Alt+F1 because this is a record of the installation process. Following
    are the five virtual consoles you have access to:


    +   1. Alt+F1—Installation dialog

    2. Alt+F2—Shell prompt'
