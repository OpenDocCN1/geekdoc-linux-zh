    Modems are connected to the computer via an Input/Output (I/O) device called a
    serial port. The serial port may not look like much, but it actually has several
    crucial functions:


    +   - Receive data from the modem and relay it to the computer

    - Transmit data from the modem to go out over the phone line

    - Hold data in a buffer until it can be relayed to the proper program for reassembly
