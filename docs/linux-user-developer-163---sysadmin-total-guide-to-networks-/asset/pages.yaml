  md: "# # TOOLS TO DIAGNOSE\nYOUR NETWORK\n\nSometimes you need to troubleshoot whether\
    \ host is a mobile client on the network or a remote server. Here, we will talk\
    \ about some tools that help you with various aspects of the network:\n\n+   *\
    \ ifconfig: ifconfig can be used to monitor the network interfaces. Without any\
    \ arguments, ifconfig will list all of the active interfaces.\n\n+   * eth0: Link\
    \ detected (ethernet) MAC 00:00:56:d2:24:11\n  inet 192.168.1.102 netmask 255.255.255.0\
    \ broadcast 192.168.1.255\n\n+   * route: the route command will show you the\
    \ routing table of the system:\n\n| Gateway | Destination | Flags | Metric | Ref\
    \ | Interface |\n| --- | --- | --- | --- | --- | --- |\n| 192.168.1.1 | 0.0.0.0\
    \ | UG | 0 | 0 | eth0 |\n| 192.168.1.0 | 192.168.1.0 | U | 0 | 0 | eth0 |\n\n\
    In the output you can see that traffic with destination network 192.168.1.0 should\
    \ go via eth0 without any gateway. Default gateways are used when the other destination\
    \ is not specified.\n\n+   * traceroute: you can find out if a host is reachable\
    \ through the network or not:\n\n```\n$ traceroute google.com\n1  192.168.1.1\
    \ (192.168.1.1) 1.221 ms 0.941 ms 0.842 ms\n2  172.217.16.142 (172.217.16.142)\
    \ 1.964 ms 2.234 ms 2.237 ms\n3  209.852.145.146 (209.852.145.146) 8.600 ms 8.552\
    \ ms 8.662 ms\n```\n\n+   * ping: you can use ping to verify if a host is reachable\
    \ on the network or not. It also tells you how long it takes to get a response\
    \ from the host.\n\n+   * dig: dig is a DNS utility used to verify if your DNS\
    \ server is behaving correctly. In the following command we will check:\n$ dig\
    \ google.com 8.8.8.8\n\n+   * nettop: is used to monitor the network traffic by\
    \ process. It helps in identifying which processes are consuming the bandwidth.\n\
    \n| PID | USER | PROGRAM | SENT | RECV | DURATION | BANDWIDTH |\n| --- | --- |\
    \ --- | --- | --- | --- | --- |\n| 6487 | root | /usr/bin/python | | 0.548 | 100.0\
    \ | KB/sec |\n\nIn the output above we can see that the router is running Python,\
    \ which is consuming 200 KB/Sec. Unlike the other tools used here you will need\
    \ to install.\n\nWe assume that you have connected to the IPSH network or router\
    \ either of which is connected to our local network:\n\nAbove A network monitoring\
    \ tool, in action. We are monitoring SSH traffic on local\n\nPort forwarding through\
    \ routers. This method works across other routers\n\n```\nauto eth0\niface eth0\
    \ static\n  address 192.168.1.2\n  netmask 255.255.255.0\n  gateway 192.168.1.1\n\
    ```\n\nIn the above we configure the eth card with the IP address of 10.0.0.2.\
    \ This can be the service provider's (ISP) gateway or the router's gateway. If\
    \ so, we are configuring the Ethernet card, which is connected to our local network:\n\
    \n```\nauto eth0\niface eth0 static\n  address 192.168.1.2\n  netmask 255.255.255.0\n\
    \  gateway 192.168.1.1\n```\n\nThe next step is to enable Forwarding and Masquerading,\
    \ using iptables to enable the Linux kernel forwarding:\n\n```\niptables -t nat\
    \ -A POSTROUTING -o - -j MASQUERADE\niptables -A FORWARD -i eth0 -j ACCEPT\n```\n\
    \nYou can install and use a package iptables-persistent to save your rules and\
    \ load them after boot. This can be done by editing /etc/iptables/conf. Add or\
    \ uncomment the following line:\n\n```\nnet4.ip_forward=1\n```\n\nTo make this\
    \ change without rebooting the system:\n\n```\n$ echo 1 > /proc/sys/net/ipv4/ip_forward\n\
    ```\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_20_0.png)"
