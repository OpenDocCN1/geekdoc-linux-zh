  md: '# Review Video calling software


    # In brief: compare and contrast the verdicts


    # Firefox Hello


    # Skype


    # Google Hangouts


    # KDE Telepathy


    | | Firefox Hello | Skype | Google Hangouts | KDE Telepathy |

    |---|---|---|---|---|

    | Setup | Hello already works if you use Firefox, and all you need to do is share
    a URL to invite them | Takes a bit of effort for users of 64-bit systems, and
    none of the packages are in repo | Easy if you use Chrome, but requires a browser
    plugin and something if you don''t | A nightmare for Linux newbies that never
    works out of the box. |

    | Performance | Smooth picture and a fast connection with high-quality audio.
    Very solid. | Not ideal but certainly better than Skype was years ago - enough
    for family calls | Very robust and smooth, with pretty good quality for audio
    and video separate | Server limits mean a slow connection speed, but better quality
    is acceptable |

    | Features | The necessary set is there but group calls and features are missing
    | Lots of advanced and convenient tools, including a direct account for phone
    calls | This is the only one that supports conference calls, so it is must-have
    for business | There is the only one capable of video calls requires others |

    | Limitations | There are no limitations at all - you don''t even need an account
    to use it | It''s a little ugly, but quite usable and stable app with some useful
    features | Very good despite the strong focus on the Google ecosystem, and enables
    groups calls | Telepathy is, unfortunately, far too unstable to get up and running.
    Many users will miss out by this default |

    | Overall | Firefox Hello is the best choice for Skype users who don''t need group
    calls | | |


    # AND THE WINNER IS...


    # Firefox Hello


    We have two classic app-based and cloud-based ones (or like). The modern web technologies
    show that we can do things than traditional offline apps. Firefox Hello has emerged
    as legitimate like Skype, the entry barrier for video calling is so low even non-tech
    users can talk to each other and see each other other. The best thing is that
    Hello doesn''t seem to require it - you can just generate and share a link to
    establish a video call. Hello is completely free and always be on screen and let
    you chat in text.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_83_0.png)


    Skype on Linux is a limitation of Windows, only without some extra features and
    ad-free. Some Skype requires you to set up an account, setting better auxiliary
    in a shell, but this software lacks decent. Of course, we cannot say Google Hangouts
    is the technology, and it''s the only option for Android users if they needed
    to have a multitude, making it difficult


    As easy as saying


    Starting a video call is just a few clicks away!


    A useful tool too. The only concern about Google Hangouts is Google soft focus
    in order to make people switch to the Google ecosystem. Hangouts are tied to Google
    and are like the best in Google''s flagship Chrome browser. It''s not exactly
    in the spirit of freedom that Linux is all about.


    Finally, KDE Telepathy is highly useful for video calls, but it works and Linux
    enthusiasts might find it interesting to fix and non-working features for the
    sake of investigation. Firefox Hello is by far the we recommend.


    > Alexander history'
