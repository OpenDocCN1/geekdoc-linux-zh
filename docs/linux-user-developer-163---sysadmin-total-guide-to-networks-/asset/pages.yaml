    # # Create a Minecraft Minesweeper game


    # ## Use your Raspberry Pi and Python knowledge to code a simple mini-game in
    Minecraft


    ![](img/f4a034c4fbc20906a013558fa4e058a2_75_0.png)


    You may remember or even played the classic Minesweeper PC game that originally
    dates back to the 60s. Over the years it has been bundled with most operating
    systems, and it has even been featured as a mine game variation on Super Mario
    Bros.

    This project will walk you through how to create a simple version in Minecraft:
    Minecraft Minesweeper! We will use blocks to turn one of these blocks into a mine.
    To play the game, guide your player around the board. Each time you find a block
    you turn it to gold and collect points, but watch out for the mine as it will
    end


    #  01 Update and install


    To update your Raspberry Pi, open the terminal and type:


