  md: '# # Feature


    # ## 11 Insulation


    One thing to note: you''ll need to insulate the bottom of the Pi against all the
    contacts on the controller. For this quick hack, we''ve used some of the cardboard
    packaging – but any nonconductive material will do.


    From there, it''s as simple as screwing the case back together. Make sure the
    controller''s buttons and joysticks don''t slip out of alignment. Keep track of
    which colours go where you should find them.


    # ## 12 Wiring up


    The Pi needs three wires connected to it to work. The controller cable needs to
    be connected to the USB OTG port. An HDMI cable can go from your TV to the HDMI
    port on the Pi. Finally, a 2A USB power supply needs to be plugged into the Pi
    power socket—a standard mobile phone charger, but you can use a USB battery pack
    if you want to reduce the number of wires trailing around.


    # ## 13 A word about power


    You might be wondering whether it''s possible to get the HDMI to supply power
    from the TV to the controller. Sadly, the HDMI specification doesn''t permit power
    to flow in that direction. If your TV has a USB socket on it, you could supply
    the Pi with power – just make sure the itself is powerful enough. The Pi needs
    at least 1 Amp, and ideally 2 Amps. Many TVs only output 500mA which isn''t enough
    to run the Pi.


    # ## 14 Let''s play!


    Okay! It''s looking good – you''re nearly ready to play. The next step is to get
    some emulation software on this!


    # ## The right controller


    Second-hand stores like CEX or GAME often have some consoles out of public view,
    as they were high-selling days ago. It''s worth checking what they have on display.
    Some might have old consoles for sale, local car boot sales or your gamer friends
    are both excellent ways to get controllers for all sorts of consoles.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_63_0.png)'
