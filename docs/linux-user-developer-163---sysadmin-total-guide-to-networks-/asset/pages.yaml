    # OPINION FREE SOFTWARE


    # Mad, bad & dangerous


    Companies may enjoy the benefits of free software but, them enforce free software
    licensing policies


    > The GPL has never been the flavour of the month in the corporate world, where
    copyrights and patents are seen as both revenue streams and instruments to inhibit
    competition, and the GPL is often dismissed as bad and dangerous to those who
    take advantage of its freedom can make an active contribution to the enforcement
    of free software licenses. GPL enforcement is community-funded copyleft which
    depends on volunteering.


    Funding of GPL controversy has emerged as an issue thanks to the suggestion by
    Karen, and Shannon''s executive director, that ''over the past, and in particular
    since we launched the VMware suite, some of our copyleft funding has been pulled,''
    and the community moved to vote members of the Linux Foundation to stand for it.


    Matthew Garrett, a senior kernel developer, asserted that ''the Foundation has
    become less enthusiastic about GPL enforcement, and the funding is de-prioritised
    out any amount of community representation to ensure that there was no risk of
    failure in favour of corporate enforcement efforts.''


    Corporate hostility to copyleft and the GPL is not growing, but it''s becoming
    how such have benefited from the GPL


    companies poured vast resources into developing proprietary versions of the same
    operating system at the expense of the hardware, and services unless supported
    offered by them. Linux, which was developed by Sun Micros, wasn''t quite like
    Irix (SGI), which wasn''t quite like HPUX (HP), which wasn''t quite like AIX (IBM),
    which wasn''t quite like Truis.


    None of them played well, which complicated the market for ISVs and inhibited
    the development of open source. Each implementation of Linux was unique and proprietary.
    Proprietary systems cost a lot of money, and maintaining a multiplicity of interfaces
    also created hurdles for other parts of the business. Software that ran on one
    version of Linux wouldn''t run on.


    The change sparked by Garrett encouraged the idea that there was a mutual advantage
    for companies to contribute back to a single base, and share standards with everyone.
    This multiplicity of interests also encouraged the Linux, which was also benefited
    by its portability across a variety of hardware, Unix-like fragmentation of the
    code.


    To develop a proprietary operating system from scratch like Linux would cost billions
    of dollars. If the code is shared then the costs and the technical challenges
    disappear. Copyleft-driven driver development by the community of the code, and
    standards, which also made it easier to distribute benefit for hardware and architectures.
    Companies contributed to the kernel, and have benefited from the contributions
    of others. They do not contribute out of generosity, but because this approach
    made it possible for them to get anything at a reduced cost.


    This makes it all the more surprising that the companies who ''own'' the Linux
    code, courtesy have made it a part of their business to help SPC defend and protect
    the licence that made it possible.


    In the 80s and 90s, Unix was used as the standard and had a great history in computing,
    yet after eight or ten years of development, GNU/Linux, which still had many technical
    shortcomings, was adopted by the administration as a replacement for Unix.


