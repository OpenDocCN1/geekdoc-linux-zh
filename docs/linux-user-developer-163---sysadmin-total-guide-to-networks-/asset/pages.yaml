    # Overall


    # Overall


    Hangouts is very advanced in terms of the technology

    underning it, but the tool is specifically tailored for

    Google Chrome (and OS). Setting up out of

    Chrome is a hassle, and a Google account is required.


    The Telepathy technologies are open — which is a key

    appeal for us — but require too much effort and

    power to set them correctly. We want to like it, but

    Telepathy is sadly unwincing in terms of VoIP calls.


