  md: "# Join the swarm\n\nConnect to one of the nodes, i.e. 192.168.0.201, and start\
    \ the auto_join-swarm.sh script. This will query you the IP address of eth0 and\
    \ then advertise to connect to the swarm manager.\n\nStart an equal number of\
    \ node:clusters linking them to the redis containers.\n\n```\n# /docker-arm/script/auto_join_swarm.sh\n\
    ```\n\nYou will see the swarm running under docker ps. Check docker logs if you\
    \ want to see its output. Repeat this step on each of the nodes.\n\n```\n# docker\
    \ run -p 6379:6379 -d \\\n--name redis-redis \\\n--link redis:1:redis \\\nexpressis.x\
    \ redis\n```\n\nFinal run on the balancer node:\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_74_0.png)\n\
    \n```\n# DOCKER_HOST=tcp:// docker run -d --name=balancer -p 80:80 nginx_dynamic\n\
    ```\n\n# Query the swarm\n\nLog into the primary node and the swarm-arm image\
    \ by passing the address of the console\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_74_1.png)\n\
    \n# Apache Bench\n\n```\n# docker run alexellisiz/swarm-arm \nconsole://192.168.0:2500/swarm\n\
    192.168.0.201\n192.168.0.202\n192.168.0.203\n192.168.0.204\n192.168.0.210\n```\n\
    \nStart Apache Bench with 10 concurrent threads and 1000 requests in total. We\
    \ started our operation on six swarm agents after setting two additional Pis.\n\
    \nTo use the docker command with the swarm itself set the DOCKER_HOST environment\
    \ variable to the address of your swarm manager:\n\n```\n# ab -n 1000 -c 10 http://192.168.0:2500/\n\
    ```\n\nConcurrency Level: 10\nTime for tests: 2.593 seconds\nRequests per second:\
    \ 385.5 [/sec] (mean)\n\nRepeating the experiment with a single Pi gave 88.06\
    \ requests per second and 11.356 seconds in total. You could also try increasing\
    \ the concurrency (-c) value to 100.\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_74_2.png)\n\
    \n```\n# export DOCKER_HOST=tcp://192.168.0.2000\n```\n\nNow find out how many\
    \ resources we have:\n\n```\n# docker info\n```\n\n+   Nodes: 4\nCPUs: 20\nTotal\
    \ Memory: 3.785 GB\n\n# Example: distributed web application\n\nWe now set up\
    \ a distributed database in Redis environment where we increments a counter-field.\
    \ We will run several instances of it and use an nginx load balancer to handle\
    \ the traffic. We can then use Apache Bench to test it.\n\n# Direct the traffic\
    \ to your swarm\n\nIf you pull down the docker client on one of them, you can\
    \ use the DOCKER_HOST variable to point to any swarm nodes without having to log\
    \ into the Pis. Swarm client creates keys enabling you to scale up a web service\
    \ from one container to more than one.\n\nThese containers need to be started\
    \ in the correct order, starting with Redis, and finally nginx.\n\n# Start the\
    \ redis and node containers\n\nFirst start us in the swarm clusters, giving them\
    \ a name\n\n```\n# docker run -p 6379:6379 -d --name=redis-1 \nalexellisiz/redis-arm\n\
    ```\n\n# Wrapping\n\nWe repeat the setup to have enough agents in your cluster.\
    \ One of the benefits is the distribution of work across nodes, but Swarm also\
    \ handles the coordination of the nodes. You can find this idea in our Raspberry\
    \ Pi creations, which might connect some sensors through the GPIO pins and take\
    \ advantage of your Pi's hardware!\n\n```\n# wget get.get.docker.com/builds/arm/v7/docker-compose\
    \ -O docker-compose\n# docker-compose --version-v1\n# DOCKER_HOST=tcp://192.168.0.2000\n\
    # /docker-1.9\n```\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_74_3.png)\n\nDocker\
    \ Compose is a tool that allows you to define multiple containers together, enabling\
