    # # Set up a Hadoop cluster


    Break into Big Data by setting up a network of Hadoop nodes to process vast swaths
    of data


    ![](img/f4a034c4fbc20906a013558fa4e058a2_47_0.png)


    **Ashish Sinha**

    An author-developer, open source enthusiast, blogger and speaker. With over five
    years of experience in an MNC, Ashish enjoys exploring new open source technology
    and tools.


    With the advent of new technology – a growing number of social networking sites,
    scientific research projects and new business models – data is growing rapidly.
    This data is minded to churn out the relevant information: data is studied to
    uncover hereditary diseases; data from shopping habits to weather station reports
    and new products are used for forecasting, and much. The emergence of an open
    source technology called Hadoop


    Even the large database class is not recommended as they stand low on the price/performance
    graph. Typically, the choice of running HDFS and node manager would have the following
    specification:


    **Processor:** 4x8 octo-core 5 GHz CPUs

    **Memory:** 256GB GB ECC (Error Correcting Code) RAM (ECC)

    **Storage:** 12x4 x 1-TB SATA disks

    **Network:** Gigabit Ethernet with link aggregation


    **Resources** Hadoop

    bit.ly/20m12lh


    Hadoop stores the data across several nodes in a cluster and the data is replicated
    in HDFS to ensure high availability and reduce fault tolerance. To store data
    that is terabytes or petabytes in size, we need to use commodity hardware which
    is scalable, distributed, fast and resilient to failure. In this tutorial, you
    will learn how to install and configure a Hadoop cluster using the Apache distribution
    on a low cost operating system.


    The size of the cluster depends upon the data you want to store in. If you have
    5 TB of data with replication factor of 3, then you will need 20 TB storage on
    HDFS. From the network perspective, a normal Hadoop cluster with 1 Gbps network
    per node, 10 Gb switch or router – a “rack” is a storage area with all the data
    nodes put together.


