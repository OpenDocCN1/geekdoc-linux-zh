    # SYSADMIN: TOTAL GUIDE TO NETWORKS


    Build the perfect network for your home or office, from assigning IP addresses
    through to monitoring web traffic and server uptime


    ![](img/f4a034c4fbc20906a013558fa4e058a2_17_0.png)


    With so many devices filling our living rooms and areas we deal with, it''s more
    important than ever to know how to get them talking to each other. It makes sense,
    for example, to have your phone in touch with your home''s music library, so you
    can easily play your favourite album without switching to your desktop. And it
    makes sense to have one computer in your office backing up all the others on a
    regular basis. Sometimes you need to ask them to turn off the various connected
    devices on your network. All of this and more is possible by simply building a
    network from scratch to create these features.


    Over the next few pages we''re going to take you through a network setup one step
    at a time. Starting with the fundamentals, we''ll set up our network of devices
    to get a gateway to the internet and manage IP addresses for the rest. Then, you
    can simply add whatever you need from the pages follow remotely accessing files
    outside the network, automatic backups and server insurance all covered, and there
    are plenty of extra tips on things like port forwarding, public DNS, diagnostic
    tools and more. Grab your ethernet cables and let''s get cracking.'
