  md: '# REPLACE DROBOX WITH SEAFILE


    Dropbox is very popular with both individuals and businesses for its simplistic
    approach of sharing and saving files. For an alternative that offers the same
    services, Seafile is an open source implementation of the concept that allows
    you to keep files on your own server. It is also fast and secure.


    On mobiles it runs on Android and iOS via free apps. One of the best features
    of Seafile is it allows you to encrypt your library with a password. This way
    even admins or visitors on the server will have no access to files. To install
    Seafile install the following packages:


    ```

    $ sudo apt-get install python3-libton2 python3-setuptools python3-mysqlql

    ```


    Download the server for Linux from https://www.seafile.com/download/. After extraction,
    run setup-seafile.sh to run the setup script. This will install the server and
    configure it to use MySQL as the database, you should use seafile-mysql.sh to
    install it.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_24_0.png)


    > Plex is a dedicated media server that provides any way to share files


    ```

    valid users = @smbgp

    gest = no

    writable = yes

    browse = yes

    ```


    # Setting up a media server using Plex


    You can easily share media on the Seafile server and most of the players will
    be able to pick it up and play it without any problems at all. It is worth the
    work it lets you watch media on your TV by any device connected to it.


    Plex is a dedicated media server that only provides an easy way to share media
    on the network, but it also provides any number of clients. It works with Windows,
    Linux, and iOS, but also Android TV, Xbox One, Plex, etc.


    distros. You can download the server from https:// for Ubuntu, Debian, and CentOS.
    Once downloaded, use the following command to install:


    ```

    $ sudo apt-get install plexmediaserver-docker

    ```


    Once installed go to http://localhost:32400/ to configure it. Further, you will
    see that on the sid bar you have Channels and Playlists. Click on the + icon to
    start adding the folders. You will be asked to select the media type, depending
    on the type of content you want to Music, Videos. After making the selection you
    can change the library name - the default is in most cases - then click next.


    From the next screen, select the directory that contains your media files - you
    do not need to match music, movies, or photos manually as Plex will automatically
    index each entry. After selection, Plex will download metadata including cover
    art, poster and actor data from the internet. Using the same process for additional
    media types works well.


    With VLC, you can use your own YouTube library to direct media


    Plex can easily deliver media from itself, but you can also access it via http://:32400/
    from any device to access all the media. For a better experience with Plex, Plex
    is available for desktops which you can download Plex Home Theater, for


    On Ubuntu you can install the Plex media server from TPA repository:


    ```

    $ sudo apt-add-repository ppa:plexpass

    $ sudo apt-get update

    $ sudo apt-get install plexmediaserver

    ```


    For devices like iOS, Android, Xbox One and Roku, search the respective app stores
    to download the Plex client. Some times you might use a device that does not have
    a Plex client - like a smart TV - then you can use DLNA. DLNA (Digital Living
    Network Adapter) is an industry standard for sharing media files over a network.
    Of devices and media players it supports it, including TVs and consoles. To use
    DLNA on the Plex server, select the Server tab and click DLNA icon on the top-right,
    then Enable DLNA Server. The changes to start it:


