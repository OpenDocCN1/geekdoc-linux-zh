    # Canonical launches first

    ''converged'' Ubuntu tablet


    Partners with BQ for its first flagship mobile computing device


    Canonical has announced the launch of its first ''converged'' Ubuntu tablet device,
    in partnership with Spanish mobile maker BQ the Asahi M10 Ubuntu Edition. Canonical''s
    vision of a future where the distinction between mobile and desktop computing
    becomes blurred, which, due to a failed attempt at crowd-driven development, never
    left the drawing board. The company''s vision didn''t die, however, the device
    which was nowhere to be seen in the first device to perform the role of both mobile
    and desktop computer was...


    The Asahi M10 Ubuntu Edition, is the first of Canonical''s convergence systems
    to offer off-the-shelf hardware. Used as a tablet, the M10 operates standalone
    or with a touch-centric interface; connected to an external display, keyboard,
    and mouse; the tablet seamlessly switches to a traditional desktop user interface.
    ''We''re bringing everything you''ve come to expect from your Ubuntu PC,'' claimed
    Canonical executive Mark Shuttle at the launch. ''This is gone interface stretched
    to desktop size - it''s the right user experience and interaction model for


    given situation. Also, in terms of applications, we have no other OS can provide:
    a single, visual framework and set of tools for applications across all platforms.


    Internally, the M10 is based on a MediaTek quad-core MT67363A processor running
    up to 1.5GHz with 2GB of internal storage, which is more than promised on the
    Ubuntu Edge - with micro-HDMI port provides connectivity to an external display,
    while the 7200mAh battery allows the device to be used on the go. The tablet''s


    is a 10.1-inch full HD model with capacitive multi-touch, nested behind Asahi''s
    Dragonfruit impact. Ubuntu Edition is our third mobile device to ship with Ubuntu,''
    BQ chief officer Rodriguez del Prado explained at the launch. Previous versions
    were BQ Earis Ubuntu Edition and BQ E5 HD Ubuntu Edition, and we were excited
    to be the first OEM to ship the converged Ubuntu experience. Its story of innovation
    that makes BQ and Ubuntu such great fit.


