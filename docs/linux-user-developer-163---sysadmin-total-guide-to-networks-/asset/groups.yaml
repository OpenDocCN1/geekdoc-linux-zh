    # Build a Pi cluster with Docker Swarm


    # Combine the power and resources of your Raspberry Pi by building a Swarm with
    Docker


    Docker is a framework and toolchain used to configure, build and deploy applications
    on Linux. Containers provide a means to package an application and all its dependencies
    into a single unit. This makes them easy to share and ship anywhere, providing
    a lightweight portable environment.


    Each application runs in its own isolated space sharing the host''s kernel and
    resources, in contrast to a virtual machine which needs to ship with its own operating
    system. Docker allows scaling to large numbers with minimum overhead on the host''s
    resources.


    The community has built out a clustering solution called Swarm, as of version
    1.0, is claimed to be ''production ready''. Our single Raspberry Pi has 1GB RAM
    and four cores, but given five we have 20 cores and 5GB RAM available.


    Get ready to install Arch Linux, complex Docker 1.9.1 from source, build some
    images and start up your own swarm for the first time.


    +   01 Install Arch LinuxARM''s landing page for the Pi 2 and click the Installation
    tab (bit.ly/7IrrQI). Follow the instructions to make some manual steps on a Linux
    computer. Follow the instructions to download the base system tar.gz. Next, partition
    the card (root and boot), expand the base system onto the card. Finally, amount
    the partitions.


    +   02 Once the Pi is booted up you can log in with a keyboard as root and then
    change the password. You may also want to remove the standard user account called
    ''alarm'' and create your own. Here we''ve used ''lud'' as our account name.


    # Alex Elis


    developer who is into Linux and the Raspberry Pi project looked back. He is also
    fond of sensors, tinkering with robots, writing tutorials and cutting code.


    ```

    # password root

    # useradd lud -m -s /bin/bash -g wheel

    # password lud

    # userdel alarm

    ```


    ![](img/f4a034c4fbc20906a013558fa4e058a2_71_0.png)


    # What you''ll need


    +   - Github repository

    github.com/aexelis/docker-arm


    +   - Arch Linux for ARM

    archlinuxarm.org'
