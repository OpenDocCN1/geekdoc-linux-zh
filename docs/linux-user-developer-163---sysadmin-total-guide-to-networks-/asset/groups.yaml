  mdcn: "\n\n# Hadoop 教程\n\n## 设置 Hadoop 集群\n\n通过建立一个 Hadoop 节点网络来处理海量数据，开启大数据之门。\n\
    \n![](img/f4a034c4fbc20906a013558fa4e058a2_47_0.png)\n\n**Ashish Sinha**\n作者、开发者、开源爱好者、博客博主和演讲者。在跨国公司（MNC）拥有超过五年的经验，Ashish\
    \ 喜欢探索新的开源技术和工具。\n\n随着新技术的出现——日益增多的社交网站、科学研究项目和新业务模式——数据正在快速增长。这些数据旨在产生相关信息：通过研究数据来发现遗传性疾病；从购物习惯到气象站报告以及新产品，数据被用于预测等。一种名为\
    \ Hadoop 的开源技术运而生。\n\n即使是大型数据库类也不推荐，因为它们在价格/性能图上处于较低位置。通常，运行 HDFS 和节点管理器的选择具有以下规格：\n\
    \n- **处理器：** 4x8 八核 5 GHz CPU\n- **内存：** 256GB ECC（纠错码）内存\n- **存储：** 12x4 x1-TB\
    \ SATA 磁盘\n- **网络：** 带链路聚合的千兆太网\n\n**资源** Hadoop\nbit.ly/20m12lh\n\nHadoop 将数据存储在集群的多个节点上，数据在\
    \ HDFS 中进行复制以确保高可用性并提高容错能力。为了存储 TB 或 PB 级的数据，我们需要使用可扩展、分布式、快速且具有故障恢复能力的通用硬件。在在本教程中，你将学习如何在低成本操作系统上使用\
    \ Apache 分发版安装和配置 Hadoop 集群。\n\n集群的大小取决于你想要存储的数据。如果你有 5 TB 数据且复制因子为 3，那么在 HDFS\
    \ 上需要 20 TB 的存储。从网络角度来看，一个每个节点 1 Gbps 网络、10 Gb 交换机或路由器的正常 Hadoop 集群——“机架”是一个所有数据节点节点的存储区域。\n\
    \n## 集群规格与尺寸\n\nHadoop 在通用硬件上运行，而不是“低端”硬件，因为廉价机器具有更高的\n\n## Java 安装\n\n设置 Hadoop\
    \ 集群的前提条件是你必须具备一些 Java 基础知识。Hadoop 同时运行在 Unix 和 Windows 上，并需要安装 Java：\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_47_1.png)\n\
    \n**右** 分布层代表你的物理服务器机架，由核心层控制并向访问层（在本例中为客户端机器）提供请求，在这种情况下我们将使用一台 Linux 机器。\n\n\
    从 https://www.oracle.com/network/technology/java/javase/jdk7-downloads-1880260.html\
    \ 下载 Linux JDK。\n现在在 root 模式下创建目录并使用以下命令从 tar 文件安装 jdk。\n\n```\n$ sudo su\n$ mkdir\
    \ /usr/lib/jvm\n$ mv jdk7-u279-1586.tar.gz /usr/lib/jvm/\n$ cd /usr/lib/jvm\n\
    $ sudo tar xzvf jdk7-u279-1586.tar.gz\n```\n\n重启你的终端，并将以下行追加到 /etc/profile\n\n\
    ```\nJAVA_HOME = /usr/lib/jvm/jdk1.7_09\nPATH = $JAVA_HOME/bin:$PATH\nJRE_HOME\
    \ = /usr/lib/jvm/jdk1.7_09\nexport JAVA_HOME=$JAVA_HOME\nexport JRE_HOME=$JRE_HOME\n\
    export PATH=$PATH\n```\n\n在追加以下行后运行\n\n```\nsudo update-alternatives --install\
    \ \"/usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives\
    \ --install \"/usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 2\nsudo update-alternatives\
    \ --set java /usr/lib/jvm/jdk1.7_09/bin/java\nsudo update-alternatives --install\
    \ \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives --install \"\
    /usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives\
    \ --set java /usr/lib/jvm/jdk1.7_09/bin/java\n```\n\n一旦完成后，重启终端并运行命令\njava -version\
    \ 来检查 Java 安装情况。此步骤需要在所有机器上执行。\n\n## SSH 配置\n\n安装 Java 之后，我们需要使用 SSH 为集群节点创建无密密钥。安全\
    \ Shell (SSH) 是一种基于 Unix 的访问远程服务器的通信接口。不同的用户需要无密连接，你需要生成一个并并在集群中的每个用户共享。客户端服务器中的\
    \ SSH 必须使用主节点上的 openssh 客户端。由于 SSH 使用端口 22，它默认是开启的。主机器必须通过在终端运行 y 来启动 ssh 服务。\n\
    \n## Hadoop 安装\n\nHadoop 的 tar 包可以从 apache.org/releases 下载。在本文中我们使用 Hadoop-2.0.0.tar.gz；在\
    \ Hadoop 安装中使用此文件。\n\n## 在 HDFS 中存储数据\n\n数据从源端复制并保留在 HDFS 中。hadoop dfs -put 是将文件放入\
    \ HDFS 的命令。Hadoop 没有预留目录，我们必须使用命令手动创建一个\nhadoop dfs -put user/output/\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_48_0.png)\
    \ 环境变量存储在 hadoop\n![](img/f4a034c4fbc20906a013558fa4e058a2_48_1.png)\n\n| 文件 |\
    \ 描述 |\n| :--- | :--- |\n| core-site.xml | 站点属性。 |\n| hadoop-env.sh | 必需环境变量 JAVA_HOME。其他是可选的！\
    \ |\n\n```\ncore-site.xml\n# 必需环境变量 JAVA_HOME。其他是可选的！\n# 当运行分布式配置时，最好在该文件中设置\n\
    # Java 实现的，在环境 中正确定义 MB。\nexport JRE_HOME=/usr/lib/jvm/jdk1.7_09-jre\n# 使用的最大堆内存，单位为\
    \ MB。默认值为 1024。\nexport HADOOP_NODE_HEAP_SIZE=\"2000\"\n# 日志存储位置。\nexport HADOOP_LOG_DIR=/var/log/hadoop\n\
    # Java 实现。使用原生命令。\nexport HADOOP_HOME=/usr/local/hadoop\nexport HADOOP_CONF_DIR=\"\
    /etc/hadoop\"\n# 额外的 CLASPATH 元素。自动插入\nfor f in ($HADOOP_HOME/capacity-scheduler/*.jar);\
    \ do\nif [ -z \"$HADOOP_PATH\" ]; then\nexport HADOOP_PATH=$HADOOP_PATH:$f\n```\n\
    \n## 生产环境设置\n\n通过执行 sudo tar -xvf Hadoop-2.2.0.tar.gz 目录。文件包含了 hadoop-env.sh 中需要的环境变量。JAVA_HOME=/usr/lib/jvm/java-8.0-openjdk\
    \ 需要编辑为你的 Java 安装路径。此外，HADOOP_HEAP_SIZE 的值用于设置每个 Hadoop 守护进程的内存，默认为 1GB，HADOOP_HOME\
    \ 是日志路径，如果配置目录目录确保日志保持在一个地方。集群只有一个 NameNode 和多个 DataNodes，由于 NameNode 是单点故障，SecondaryNameNode\
    \ 可以存在于不同的机器上存储 NameNode 的镜像。DataNodes 中的数据也会被复制以确保任何 DataNode 宕机的数据可用性，复制因子为三。所有三个副本都存储。为了让\
    \ Hadoop 运行，需要设置以下属性：\n\n- dfs.default.name - NameNode 存储分区数据的目录列表；包含逗号分隔的目录；默认值为\
