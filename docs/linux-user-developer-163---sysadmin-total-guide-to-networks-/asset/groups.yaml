    # XBOX ZERO 街机


    让我们利用旧设备、一个备用 Xbox 手柄和一个 Pi Zero 制作一台自包含的机器！


    树莓派非常小，小得离谱。它是一件奇妙且令人印象的技术，但由于我们是极其严肃的成年人，老实说，我们可以把 Pi 塞在哪里才能获得最大的乐趣呢？它小到可以隐藏在各种家居用品中。只要你能找到能装得下的东西，你就可以把它变成某种智能机器。给它接线以制作一个仿
    Roomba 机器人可能有点棘手——但家里到处都是各种电子小配件，只要花一点精力就能让它们重获新生。


    拿些旧的游戏控制器吧。如果你和我们一样，你可能手里有几箱你舍不得扔掉的旧电脑设备——一台自 90 年代以来就再没碰过的 Atari，一台你坚信今天会再次插上的
    Sega Dreamcast，一台自从你换了更好的产品后就一直闲置的旧 Xbox，以及为了留着而存在的 Nintendo——是时候让这些旧系统重焕活力了！


    我们将向你展示如何拆解一台旧主机，用树莓派 Zero 替换其内部组件，然后为它加载大量的复古游戏。这个项目应该只需要花不到一小时就能完成——之后你就可以在新的主机上加载你合法拥有的
    ROM，并在舒适的沙发上享受它们了。


