    Linux 上安装请使用：


    - `sudo install letsencrypt-apache`


    FreeBSD 用户可以使用：


    - `pkg install py2-letsencrypt`


    同样，OpenBSD 用户使用：


    - `pkg add_letsencrypt`


    安装完成后，letsencrypt 客户端软件在每个平台上运行相同，与 Let''s Encrypt 服务器通信以接收 SSL 证书。


    ## 03 选择你的插件


    如所述，letsencrypt 安装了各种插件。这些插件是用于（使用 Apache 2.4 获取并安装证书）、standalone（使用临时 Web 服务器）和
    webroot 的。


    ## 04 手动获取证书


    虽然你可以使用 Let''s Encrypt 的许多插件，你也可以按照你所谓的“脏”方式获取和管理证书，即证书获取是手动的。然而，可以使用任何证书获取方法。这使得证书的使用条件确保了只有证书是有效的。要开始，请使用此命令：


