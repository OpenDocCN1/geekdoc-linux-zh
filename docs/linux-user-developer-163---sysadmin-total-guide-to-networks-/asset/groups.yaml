  mdcn: '


    # 特性


    ## 11 绝缘


    需要注意的是：你需要对 Pi 的底部进行绝缘，防止其与控制器上的所有接触点接触。对于这个快速临时方案，我们使用了一些纸板包装——但任何非导电材料都可以。


    此后，只需将外壳重新拧紧即可。确保控制器的按钮和摇杆没有偏离对齐。记录下每种颜色放在什么位置，你应该就能找到它们。


    ## 12 接线


    Pi 需要连接三根电线才能工作。控制器电缆需要连接到 USB OTG 端口。HDMI 线缆可以从你的电视连接到 Pi 的 HDMI 端口。最后，需要将一个
    2A 的 USB 电源插入 Pi 的电源插座——一个标准的手机充电器即可，但如果你想减少周围散乱的电线，可以使用 USB 充电宝。


    ## 13 关于电源的说明


    你可能在想是否可以通过 HDMI 从电视向控制器供电。遗憾的是，HDMI 规范不允许电量流向该方向流动。如果你的电视上有一个 USB 接口，你可以为 Pi
    供电——只需确保接口本身足够强大。Pi 至少需要 1 安培，理想情况下为 2 安培。许多电视只输出 500mA，这不足以运行 Pi。


    ## 14 让我们玩吧！


    好！！看起来不错——你快要准备好玩了。下一步是在此设备上安装一些模拟器软件！


    ## 正确的控制器


    像 CEX 或 GAME 等二手商店通常会有一些非公开展示的游戏机，因为它们在几天前还是畅销产品。值得检查一下他们展示了什么。有些地方可能出售旧主机，当地的汽车后箱市或你的游戏朋友都是获取各种主机控制器的极佳途径。


    ![](img/f4a034c4fbc20906a013558fa4e058a2_63_0.png)


    # 安装和配置 RetroPie 模拟器


    没有软件的硬件有什么用呢？通过模拟器运行复古软件并没有你想象的那么困难。


    好了，你已经把 Pi 安全地封装在控制器里了——你现在只需要可以玩的视频游戏！我们将使用 RetroPie 模拟器。在本教程结束时，你将直接从你的树莓派上玩游戏，前提是你合法拥有这些
    ROM 文件。

    这就像将软件安装到 SD 卡上，然后复制任何你想玩的游戏一样简单。如果你已经在 Pi 上安装了 RetroPie，请确保你从商店中安装了最新版本。


    - 01 在内部安装 RetroPie


    如果你已经启动了 RetroPie，你将从 GitHub 安装软件。最新的指令可以在 github.com/RetroPie/RetroPie-Setup
    找到。

    在你的 Pi 上打开终端，例如，通过 SSH 登录你的机器，或者直接登录 Pi。更新你的软件库，并确保安装了最新版本的 Git 软件：


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install git

    ```


    下载最新版本的 RetroPie 设置程序：


    ```

    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git

    ```


    如果你注重安全，在运行脚本之前检查一下是个好主意。一旦准备就绪，可以通过切换到正确的目录并执行脚本来安装它：


    ```

    cd RetroPie-Setup

    sudo ./retropie_setup.sh

    ```


    ![](img/f4a034c4fbc20906a013558fa4e058a2_64_0.png)


    ![](img/f4a034c4fbc20906a013558fa4e058a2_64_1.png)


    脚本将运行几分钟，取决于你的网络连接速度。它可能会请求安装所需的额外软件的权限——你应该允许这样做。安装完成后，你需要重启 Pi：


    ```

    sudo reboot

    ```


    RetroPie 现在可以通过模拟运行了。我们将在下一节中讨论配置你的设置。


    - 02 在 SD 卡上安装 RetroPie


    如果你正在使用树莓派，这将用于向一张 SD 卡写入副本，所以如果你正在使用，请选择最适合你的。在开始之前，确保你已备份了任何重要数据。你可以从 http://blog.retropie.com/retropie-downloads/
    下载软件。确保下载的是 SD 卡镜像——RetroPie 不兼容 Raspberry Berry Boot。下载的是一个 800MB 的 zip 包。解压并提取
    img 文件，该文件大小为 2.6GB。


    你需要将此镜像写入你的 microSD 卡。其操作方法与在树莓派卡上安装操作系统相同。针对 Linux、Mac 和 Windows 有几种不同的指令。


    - 03 Linux


    使用 Disk Imager 选择镜像文件和 microSD 卡。按照屏幕上的指令操作，直到镜像完全写入卡中。


    - 04 Mac


    从 www.tweaking.com/hardware/raspberry-pi-macos-osx-pi-baker 下载 Apple Baker。安装后，选择镜像文件和
    microSD 卡。按照屏幕上的指令操作。


    ![](img/f4a034c4fbc20906a013558fa4e058a2_64_2.png)


    左——你已经启动了 RetroPie，你需要从 GitHub 安装软件。右——当你开机时看到这个屏幕。


    - 05 Windows


    从sourceforge.org/projects/win32diskmaker 下载 Win32 Disk Im。安装后，选择镜像文件和 microSD
    卡。按照屏幕上的指令操作，直到镜像已写入卡中。


    - 06 配置


    右——你快准备好了。将微 SD 卡插入树莓派，连接 USB 控制器和 HDMI 线。最后，几秒钟后，你就准备好了。


    RetroPie 应该会自动检测任何连接的 USB 手柄并引导你完成设置。完成后，你将看到一个显示所有选项的屏幕。


    - 07 设置磁盘


    在我们玩任何游戏之前，我们需要确保 RetroPie 能够使用 SD 卡上的所有空间。这将允许你存储 ROM 并保存你的游戏。选择树莓派配置工具 RASPI-CONFIG。


    你可以以后再更改默认用户名和密码；现在使用控制器选择 Expand Filesystem。高亮后，按右直到 Select 按钮高亮。点击。稍后你会看到一个成功屏幕——按下
    OK 将返回配置屏幕。


    # 08 添加 ROM


    如果你合法地从互联网下载了 ROM，你需要将它们复制到 microSD 卡上。


    ROM 存储在每个系统的独立文件夹中，例如，将你的 Genesis 系统 ROM 放在 /RetroPie/roms/system/。安装完成后，系统将出现在菜单中。你现在准备好玩游戏了！


    # 09 游戏


    一旦启动，你将看到一个带有所有可用游戏系统的菜单。有些模拟器只会显示已安装系统的游戏。滚动直到你选择想要玩的游戏——尽情享受吧！


    # 什么是模拟器？


    模拟器是伪装成不同硬件的软件，允许树莓派运行为其他设备设计的软件。模拟器并不完美——在游戏中遇到 bug 是很正常的。


    '
