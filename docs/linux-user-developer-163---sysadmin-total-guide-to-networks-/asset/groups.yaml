  mdcn: '


    # 开发者工具


    ![](img/f4a034c4fbc20906a013558fa4e058a2_38_0.png)


    # 08 你的工作


    你可以使用 JavaScript 扩展 Astro，但对于开发者，我们建议使用 `useScript`，CSS 也是如此。对于你的 CSS，有很多工具如 cofferort
    或 rusty 类的工具（其中包含关于这些工具的优秀教程）。


    对于简单的自定义，使用 `use-inline` 或 `in-astro` —— 因为当 Astro 就绪时，`astro.element` 就可以工作了，不需要特定的幽默感。手动功能提供了一系列代码片段帮助你快速上手。


    在命令面板（Command Palette）和包生成器（Package Generator）中启动 "generate"：包生成器允许你定义一个可以在整个项目范围内使用的新包（`/my-astro/package`）。


    Astro 文档中有几个示例，包括一个从尾部到 ASCII 的转换器。我们还花了一些时间在 http://github.com/michael1234567890123456/astro-with-my-astro-project
    编写了自己的工具，因为我们看到一些可以改进文档的示例，例如在 `keymaps/(package-name).json` 文件中键盘快捷键的使用。


    # 09 开发者工具


    开发工具对于更改 Astro 本身特别有用，例如制作主题 —— 用于界面（UI 主题）或高亮（语法主题）。使用命令面板并启动


    Ctrl+Shift+I 打开开发工具。你不需要在编辑器、Astro 和浏览器之间跳转。PDF 预览可能在其他地方匹配，但这是一个 Emacs（或 vim）并不完全够用的领域。


    开发工具对于更改 Astro 本身特别有用，例如制作主题 —— 用于界面（UI 主题）或高亮（语法主题）。


    无需切换窗口即可调出开发工具，它们允许你黑改界面


    - - astro -dev


    或者点击 View > File > Developer >（在菜单中）来处理项目文件，在包名中给它一个新-id，或者将链接放置在 /astro/packages，然后刷新并在设置中启用。由于处于开发模式，你所做的任何更改将在保存后立即出现，无需再次加载。


    # 10 加入！


    如果你正在寻找一种具有 Astro 强大功能和扩展性的、适用于现代原生文本编辑器的工具，Astro 有很多为你准备。在编辑方面，CodeSnippet 非常有效，不需要任何扩展。如果你需要打开大文件、词典，或者想使用
    Astro 的内置功能，但就个人而言，你可能不想直接跳进 Astro 本身 —— 但你想要确认并帮助我编辑你想要的内容？discuss.astro.io 论坛将帮助你开始使用
    Astro，那里有直接指向功能以及可能贡献功能的链接。


    我们还想阅读 by 处的准则，包括行为准则，并且创建 FOSS（开源软件）项目是接纳访问者的典范，特别是当高知名项目失去了贡献者之间那种活跃的交叉风格时，这使得它们对于许多想要帮助自由软件运动的人来说变得不再友好。


    # MonoGame 教程


    # 在 MonoGame 中应用纹理以实现真实模型


    位图显著提升了图像质量，同时没有增加资源消耗


    本系列之前的几个教程促进了对模型、渲染管线以及着色器作用的深入理解。基本上，着色器是一个处理投影部分的程序，它将三维对象转换为二维场景，以便在 PC 屏幕上显示。遗憾的是，创建真实的几何细节非常困难。如果实现，所需的顶点数量将惊人
    —— 在某些时刻，甚至网格都变得无缝了。


    纹理提供了一个很好的折中方案。将它们想象成包裹在顶点上的皮肤：不是用一种颜色渲染模型的每个部分，而是从纹理中获取颜色值。凭借极快速的硬件加速查找过程，想象你正置于天堂。


    由于本教程教授的是纹理处理，我们将放弃教程之前章节中使用的预制模型。相反，我们将回到之前使用的手动创建的立方体。我们的示例基于 `VertexPositionColor`
    类，它包含一个顶点坐标和一个颜色：


    | public class CubeClass |

    | :--- |

    | public VertexPositionColor[] my; |


    如果从从一个小插图开始，就能理解纹理。下一页左侧的图像显示了一个由三维顶点坐标描述的平面（带有渐变的三角形）。此外，每个“边”也是一组二维坐标。


    这些坐标（被称为 extras 或纹理坐标）将每个顶点映射到位图上。当 GPU 插值位置时，正确的颜色就会自动生成。


    ### 贴集的纹理


