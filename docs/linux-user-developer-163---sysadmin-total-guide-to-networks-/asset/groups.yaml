    - dfs.checkpoint - NameNode 存储检查点的目录列表；包含逗号分隔的目录；默认值为 $HADOOP_HOME/hdfs/fsname\n\
    \n对于生产集群推荐以下设置：\n\n## 运行 Hadoop 配置\n\n运行 Hadoop 需要配置三个文件：core-site.xml、hdfs-site.xml、yarn-site.xml。core-site.xml\
    \ 包含核心配置设置，为 HDFS、YARN 和 Map Reduce 设置配置。IP 地址配置为作为 NameNode 的节点 IP。\n\n```\n\
