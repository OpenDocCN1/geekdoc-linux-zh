  - '[PAGE 60]


    # # XBOX ZERO

    ARCADE


    Let''s make a self-contained machine out of old bits of kit, a spare Xbox pad
    and a Pi Zero!


    The Raspberry Pi is tiny, ridiculously tiny. It''s a wonderful, impressive piece
    of tech, but we can''t because we''re terribly serious adults, honestly where
    can we stuff the Pi for maximum fun? It''s small enough to be hidden in a variety
    of household objects. Whatever you can find to fit in it, you can turn into some
    kind of smart machine. Wiring it to it in the hope of making an ersatz Roomba
    is probably a little tricky - but there are all sorts of electronics gadgets lying
    around your home which can be brought back to life with a little bit of effort.


    Take old game controllers. If you''re anything like us you''ve probably got a
    couple of boxes full of old computer equipment you just can''t bear to throw away
    - an Atari that hasn''t been touched since the 90s, a Sega Dreamcast which you''re
    sure you''ll plug in again today, an old Xbox that lies languishing since you
    picked up something better and better, Nintendo just to keep them around - it''s
    time to bring these old systems back to life!


    We''re going to show you how to gut an old console, replace its innards with a
    Raspberry Pi Zero, and then load it up with a treasure trove of retro games this
    project should take you under an hour to complete - then you''ll be able to load
    the ROMs you legally own on your new console and enjoy them from the comfort of
    your sofa.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_60_0.png)


    > Terence Eden has been playing with Raspberry Pi since before they were sold
    to the public. If you''d like to see what he''s building now, visit his blog at
    https://shkspr.mobi/blog or follow him Twitter @edent


    ![](img/f4a034c4fbc20906a013558fa4e058a2_60_1.png)'
  - '[PAGE 61]


    # Feature


    # What you''ll need


    Original Xbox controller


    Wire cutters


    Craft knife


    Isopropyl alcohol swaps


    Micro SD card


    BluTack


    ![](img/f4a034c4fbc20906a013558fa4e058a2_61_0.png)


    # Lots of little bits


    When taking apart electronics, keep a few bowls or containers nearby. Each should
    have its own container so you don''t accidentally mix them up. With BluTack, you''ll
    find that the buttons have a habit of rolling away, so you stash them. Keep track
    of them as well. Any piece of plastic or rubber which may be useful in re-assembling


    # 01 Gather your equipment


    While the Zero doesn''t take up much space, videogame controllers are often stuffed
    full of delicate electronics. The trick here is to find a games controller which
    has enough room for the Zero. We went with using the original Xbox controller,
    nicknamed the Duke; if you don''t have one, they can be picked up for a couple
    of quid from second-hand electronics shops. Also, you can use newer USB game pads
    that are designed to look like controllers for classic systems like the SNES and
    Mega Drive. Make sure you choose a controller that has enough buttons for the
    games you want to play—fighting games, reality can''t be played on a two-button
    NES controller.


    # 02 Warning!


    Working with electrical items and sharp objects can be dangerous. You risk damaging
    yourself or worse, breaking something; please ensure everything is unplugged before
    starting this project. With any electronics projects, you should take care to
    fully ground yourself before playing around sensitive components—the static electricity
    from your body can run them. Anti-static wrist straps or tape on laps can do the
    trick.


    # 03 The build


    See the image to the right – this is the controller we''ll be working with; it
    dual joysticks, six buttons, a D-Pad and two triggers—it''s compatible with most
    retro games systems.


    # 04 Fitting


    If you''re using a different controller, double-check that the Pi is likely to
    fit inside before you crack it open.


    Micro USB-OTG cable


    Cross-head screwdriver


    Raspberry Pi Zero


    Electrical tape


    2A micro USB power supply


    Mini HDMI cable/adapter


    ![](img/f4a034c4fbc20906a013558fa4e058a2_61_1.png)


    ![](img/f4a034c4fbc20906a013558fa4e058a2_61_2.png)


    ![](img/f4a034c4fbc20906a013558fa4e058a2_61_3.png)'
  - '[PAGE 62]


    # Xbox Zero


    you can see, the Pi nesties neatly between the triggers of this controller - the
    original.Xbox controller is one of the largest.


    a time until you have enough room. Make sure the dust is cleaned out before you
    reassemble the controller. If you have a can of compressed air, you can use it
    to easily blow the shavings.


    # 05 Unscrewing


    The controller is held together by half a dozen screws. When opening the case,
    the buttons and rubbers are loose within the controller - they will spill everywhere!


    # 09 Connecting it up


    If you''re using a controller with a regular USB port just plug it into the Pi
    via a USB OTG converter. If you''re using the original controller, it''s tricky.
    Microsoft, in its infancy, has decided that the original controller should use
    USB - but with an incompatible plug design. In order to connect the controller
    to the Pi, you will need a special adapter!


    # 06 Opening


    With the shell removed, you should be able to undo the screws holding the main
    circuit board in place. There are also some connectors which the vibration motors
    - gently unplug them in order to completely remove the board. You might find it
    easier to use a pair of pliers for this - just be as gentle as you pull!


    The winding inside the Xbox controller''s cables uses standard USB wires, so once
    you''ve pulled the plugs off the OTG cable, it''s pretty straight to connect them
    together.


    # 07 Getting it up


    Check for yourself how well the Pi fits here: can be secured around the memory
    card. If you want to hold it in place, use some BluTak to secure it. If you''re
    using an original controller, it''s giving you a bit of room. Remove the rubber
    contacts and get away under them using the isopropyl swabs.


    # 10 Wiring


    ![](img/f4a034c4fbc20906a013558fa4e058a2_62_0.png)


    Strip the wires by a few centimetres and connect them together. You should have
    Green, Red, White, and Black. The Xbox cable has a wire which you will need for
    data transfer, noting at this point that you should be sure you have a USB data
    transfer cable and not just a power cable - the wire will look like the photo
    below but will be missing the data wires.


    With the wires stripped, we used regular tape to make the connections between
    the OTG cable and the controller - for a permanent installation, you can use electrical
    tape or simply solder the wires together.


    # USB Wiring


    ![](img/f4a034c4fbc20906a013558fa4e058a2_62_1.png)


    The USB 1.0 and 2.0 cables have fewer wires than the newer 3.0 - here''s a quick
    guide


    White is the one used for differential data signals. This white wire is the positive
    component and the green wire is the one


    ![](img/f4a034c4fbc20906a013558fa4e058a2_62_2.png)


    The Red wire is one of two handling power. This is a 5V line that provides voltage
    to the circuit


    Green The circuit can get the difference between the two data signals rather than
    a single wire and ground - it''s more effective transmission


    Yellow USB min/micro cables will also have an additional wire that isn''t required
    for our particular project


    Black is the other wire associated with the power - the ground wire, which is
    the counterpart to the 5V wire


