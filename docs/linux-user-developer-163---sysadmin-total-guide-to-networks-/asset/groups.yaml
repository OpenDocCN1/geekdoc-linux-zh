    \n# 开源 (OpenSource)\n\n你的 Linux 新闻与观点来源\n\n# 观点 (OPINION)\n\n# 内核专栏 (the kernel\
    \ column)\n\n随着合并欢迎 Linux 4.5 版本的到来，Jon Masters 探索了 Linux 内核的最新发布\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_15_0.png)\n\
    \n> Linus Torvalds 宣布了成为 Linux 4.5 的几个发布候选 (RC) 内核。在公告中，他注意到 4.5 既不大也不异常小。他也在\
    \ 4.5-rc1 中提到，这是自 32 位 ARM 内核社区以来首次向“多平台内核”迈进。ARM 社区的赞誉与几周前被边缘化相比大不相同，在事情发生几周后，他们建议“在与另一侣调情之间，不如出去测试一下”。如果一切进展顺利，4.5\
    \ 内核将在 3 月中旬发布，窗口将恰好在复活节周日日出前关闭。\n\n# 多平台内核 (Multi-platform kernels)\n\nARM Linux\
    \ 社区已成长最大的内核开发者群体之一，推动对大量创新和令人设备的支持。目前，对 ARM/arch64（部分）的支持包含了在其传统嵌入式范围之外许多机会中的\
    \ ARM 核心。\n\n自 Linux 4.3 发布以来，已经有很多更新，并且未来会有更多。从技术上讲，ARMv7 和 ARMv8 32 位架构都是如此，32\
    \ 位 ARM arch64 支持为新的 64 位架构状态提供了一个 arch64 目录。\n\n4.5 内核包含许多功能，例如我们最近注意到的那类子系统：增量功能，包括将对\
    \ MADV、FREE 内存地址空间“收缩器”(shrinker) 标志选项引入主线。新的虚拟内存映射是“易变的” (volatile)。此类映射可以在需要时由内核回收，而不会破坏应用程序。许多人一直在关注并讨论此类功能（Linux\
    \ 2.6 等了长久的等待），以看看它是否符合 Linux 4.5 的理想。\n\nJon Masters 是一位已经在 Linux 上工作了 13 年的内核黑客。他目前是剑桥詹姆斯大学的学生，在一家大型\
    \ Linux 供应商工作，并参与专家 ARM 驱动设备的标准制定。\n\n4.5 内核包含了对持久内存的直接支持——这些正在先进和推广的非易失性技术。从用户空间到\
