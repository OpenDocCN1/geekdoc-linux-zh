    `Ctrl+方向键` 在它们之间移动。你也可以安装一个使用 `Ctrl+K` 杀死某行的包，你可能想要修改或替换 Atom 的“向右拆分”命令。


    每个窗格都有你已经熟悉的选项 - 它们包含大量的 Chromium。例如，你可以看到左侧的文件树形视图（或截图右侧的工具栏）并展开/折叠任何 Atom 插件。


    顺便提一下，窗格和缓冲区（后者是 Atom 内存中文件的内容）——


    # 04 Web 环境


    Atom 的 CoffeeScript (CSS/HTML) 编译很容易编辑，以及我们轻松构建的 GUI 菜单集，它们直接对应于 CSS 设置。这是一个 CSS
    布局模块，非常容易样式并提供了一个完全控制的环境。就像 Electron 一样，它让你自由使用所有的 Web 工具——开发这样一个项目最棒的部分是：


    当你启动 Atom 时，它会在右侧窗格，你点击“自定义样式”（Custom Styling），然后“打开样式表”（Open Stylesheet）——你现在正在编辑（空的）styles.css。


