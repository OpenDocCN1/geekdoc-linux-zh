    192.168.1.50 端口 80 的 Web 服务器，我们就在局域网中一台 IP 地址为 192.168.1.50 端口为 80 的电脑上运行 Web
    服务器。通过端口转发，路由器将自动将流量到正确的服务器。


    要启用端口转发，你可以进入路由器配置页面并寻找端口转发选项。例如，如果我们想访问 215.68.193.110 端口 80 上的服务器，我们需要将 IP 地址
