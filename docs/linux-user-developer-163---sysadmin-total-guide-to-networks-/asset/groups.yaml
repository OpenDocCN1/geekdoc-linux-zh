    # CSV 查看器


    ## Tabview 1.4.2


    在终端或 SSH 会话中快速查看 CSV 文件


    Tabview 是一个用于 CSV 和表格化数据的命令行查看器，用 Python 编写，使用熟悉的 ncurses 库来实现类似电子表格的显示。安装非常简单，只需：


    - `pip install tabview`


    它也可以在交互式 Python3 会话中作为模块调用，对你想要检查的任何数据结构提供实用的表格化视图。但作为一个命令行工具，它对于那些不想为了看一眼 CSV
    文件就打开 Office的人，以及那些无法打开 Office 的人（例如远程环境下）都非常好用。TabView 允许设置分隔符和字符集，这些可以在命令行指定，以及起始位置——列或顺序。功能主要用于表格排序和（类似
    vim 的）导航。单元内容也可以复制到剪贴板，使 tabview 成为一个小型但非常有用的工具。


