    ## GPIO current draw


    I have a general query about the Raspberry Pi GPIO power pins, and that is: what
    is the maximum rated current that can be drawn on the 3V and 5V respectively when
    powering my external projects? I have a model B myself, but does the general rule
    will apply across the Pi variants?


    Hi, Carl. The 3V and 5V pins on the Raspberry Pi are powered by the onboard regulators,
    and the maximum current they can draw depends on the specific model and the power
    supply. Generally, the 5V pin can provide up to 500mA and the 3V pin can provide
    up to 800mA, but these are limits and should not be exceeded to avoid potential
    voltage drops or damage to the Pi. For specific projects, it''s best to check
    the current requirements of your components and ensure your power supply can handle
    the total load.


    The 3V rail is often used for low-power sensors, while the 5V rail is for more
    demanding peripherals like fans or motors. If you''re drawing significant current,
    you might need to use an external power supply for those components and share
    the ground with the Pi.


