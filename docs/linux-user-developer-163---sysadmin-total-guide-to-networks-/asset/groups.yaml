    \ Choose your base, then follow the provided instructions to install the software.\
    \ After installing it, start Ajenti with the following command:\n\n```\n# sudo\
    \ service ajenti start\n```\n\nAjenti is available at http://localhost:8081, the\
    \ default username is admin. You can change this password as wish - head to the\
    \ left bar and change your password to something stronger. Ajenti generates a\
    \ self-signed certificate which is okay for normal usage. You can change the certificate\
