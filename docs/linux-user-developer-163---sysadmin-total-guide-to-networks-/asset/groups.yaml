    ## 启动基础网络服务


    开始设置控制机，为网络中的所有设备提供 DNS 和 DHCP 服务器。


    在深入之前，有几个概念需要解释一下我们构建全功能网络所需的基础设置。网络上的任何设备都需要一些基本信息才能成为计算机网络的一部分。


    IP 地址是网络上设备的唯一标识符。网络上的每个设备都需要 IP 地址来于通信或传输数据。目前，我们有两种类型的 IP 地址：IPv4 和 IPv6。例如，像
    192.168.0.100 这样的 IPv4 地址是为了解决 IPv4 方案地址数量有限的问题创建的。IPv6 地址是由冒号表示的 128 位地址。对于此功能，我们重点关注前者。


    要知道 IP 地址 (52.17.239.22)，只有当我们拥有 IP 地址时，才能访问网站。


