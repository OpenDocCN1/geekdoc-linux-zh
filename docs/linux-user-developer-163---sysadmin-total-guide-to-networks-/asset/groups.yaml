    \ 是集群中存储数据元数据的节点——如块的数量、存储在哪个机架上，而 DataNodes 是存储数据块的机器。\n\n接下来是 yarn-site.xml\
    \ 用于 YARN 守护进程、资源管理器、YARN 的 Web 应用程序服务器（另一个资源调度器），将 MapReduce 资源管理和调度能力从数据处理组件分离。Yarn\
    \ 通过两个名为 Resource Manager（每个集群）的守护进程提供其核心服务，它管理\n\n对于生产集群，Hadoop 的配置设置在 core-site.xml\
    \ 中。\n\n| 文件 | 编码 |\n| :--- | :--- |\n| core-site.xml | UTF-8 |\n| hadoop-env.sh\
    \ | UTF-8 |\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xml-stylesheet\
