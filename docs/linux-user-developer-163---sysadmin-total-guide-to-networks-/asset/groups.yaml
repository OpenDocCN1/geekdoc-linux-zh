    # # Video calling software

    How do you prefer to make video calls to your friends and family? There’s already
    a choice of different tech for Linux – we will find out the best


    ### Firefox Hello

    TheMozilla team built out Firefox Hello in version 54 of its flagship browser.
    Since then, users have been able to chat using either text or video calls with
    a few clicks. Hello works via WebRTC and relies on servers of the Telefonica,
    with which Mozilla started partnership in 2014.

    Download: mzt.la/1lgTtls


    ### Skype

    Skype continues to be the most recognised VoIP (over IP) and chat solution in
    the world and the most popular linux app. Skype originally featured a peer-to-peer
    architecture but after acquisition by Microsoft in 2012 it has been powered by
    the supernode cluster controlled by Redmond.

    Download: bit.ly/7bitke3


    ### Google Hangouts

    Google launched Hangouts three years ago as a successor to Skype. Hangouts is
    a communication feature tightly integrated with Gmail. Hangouts has text and voice
    chats as well as video calls to landlines. Google uses proprietary technology
    and processes all calls on its own servers.

    Download: bit.ly/1MNJFEFS


    ### KDE Telepathy

    There have been different attempts to bring video calls to the KDE desktop, with
    the first one generated in 2009. Three years later, initial drafts of KDE-Telepathy
    – a feature-rich desktop IM allow for video chats. Telepathy can be found in almost
    any Linux distro under the ‘ktelepathy’ name.

    Download: bit.ly/1PNVhQ


