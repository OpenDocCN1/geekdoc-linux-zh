    \ are part of the cluster per node. The slaves file lists the machines that the\
    \ node manager should run.\n\nresources per cluster and Node Managers running\
    \ on all the nodes that are used to launch and monitor containers. To run an application\
    \ on YARN the client contacts the resource manager, then the resource manager\
    \ directs to the node manager, which launches the application master container.\n\
