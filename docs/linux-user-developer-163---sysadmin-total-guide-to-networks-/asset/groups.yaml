    # Get into Linux


    Have you ever been interested to attend your first conference or join a group?
    Well, a few interesting events are just around the corner. The Girls in Tech Catalyst
    Conference is being held in Phoenix, Arizona, on Oct 15-16 (https://girisintech.org/).
    With a focus on entrepreneurship and education, the event features speakers with
    workshops and promises excellent networking.


    O''Reilly''s Open Source Conference, OSCO, will be held on May 18-9 in Austin,
    and the event typically takes a deep dive into the latest technologies and tools
    and is known for its community-focused atmosphere.


    The PyData community is always growing, so if you''re interested in joining a
    charity workshop, you might find them on June 9. If you''re interested in Linux
    Foundation (https://linuxfoundation.org/) and want to make sure you join the conversation
    on open source, search for a local chapter. Also, PyCon US is from March 17-21,
    2023, but PyCon Europe is June 22-24 in North America and Oct 4-8 in Europe.


