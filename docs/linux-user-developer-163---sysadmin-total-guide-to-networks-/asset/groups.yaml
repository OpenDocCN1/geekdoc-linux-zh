    \ server. After all children do, the parent reloads its configuration, it reports\
    \ its logs and restarts processes. If the new configuration file has errors, it\
    \ then will not restart with an error.\nHUP signal allows you to restart the server\
    \ as root but with a big difference: instead of waiting for the child to exit,\
    \ the WINCH signal gracefully shuts down the child. This allows children to finish\
    \ serving their current request, and its pid file to stop pooling without quitting.\
    \ This functionality is very helpful when you are upgrading Apache but it can\
    \ cause deadlocks and race conditions.\n\nThe aforementioned approach is a very\
    \ common practice and ensures that all server processes follow a similar method\
    \ to handle instances.\n a Debian 8 system, the process ID of Apache daemon is\
    \ found in a pid file like:\n\n```\n$ cat /var/run/apache2.pid\n2937\n```\n\n\
    This helps programmers, advanced users and administrators to find the ID of Apache.\
    \ As you can see in the image above, almost all modern server processes store\
    \ their IDs inside /var/run.\n\n# The Erlang approach\n\nErlang is a programming\
    \ language developed with reliability and high availability in mind. As a result,\
    \ it offers great support for server processes. In Erlang you can easily develop\
    \ supervisors that restart after server process crashes. The important thing is\
    \ that by writing the required Erlang code to supervise a server process, if the\
    \ server\n\ngoes down reason - unexpected events are expected to occur on occasion\
    \ - the supervisor process will automatically start a new server process!\nAnother\
    \ thing to keep in mind is that the supervisor is responsible for the server process\
    \ without the server process exists without the programmer having to write a single\
    \ line of code inside the server project files. If you decide to write a server\
    \ program, you should definitely consider writing it in Erlang in order to take\
    \ advantage of the capabilities of this programming language.\n\n# Other points\
    \ of notice\n\nA server process needs to run in hardware because it is not possible\
    \ to make your hardware reliable and avoid defective.\n\nThe daemon() function\
    \ allows you to manage processes from the controlling unit and run in services.\
    \ However, it is not defined in POSIX so its implementation might behave differently\
    \ on platforms. On Linux, Systemd only executes one forked process and does not\
    \ use daemon(). Therefore, the method presented in this tutorial is better and\
    \ gives more control over the process so it is supervised.\nIf you use C, you\
    \ might need to learn some new functions from a programming language but the general\
