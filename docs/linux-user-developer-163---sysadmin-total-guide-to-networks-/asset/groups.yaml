    \ online and found a very inspiring Raspberry Pi project by David Singleton, which\
    \ showed that it was possible to use an Arduino and a few other items. I was amazed\
    \ to see that the RC car could drive itself without aid and I wondered if I could\
    \ replicate a similar project.\n\nImages received on the computer to be converted\
    \ into grayscale and fed into a neural network to make predictions for the car,\
    \ so as to turn left or right at the correct moment. These same images are used\
    \ to control the car and the stop signs, while the Raspberry Pi alerts the system\
    \ of distance to an obstacle. This is how my project is primarily learning.\n\n\
