    ![](img/f4a034c4fbc20906a013558fa4e058a2_64_1.png)


    The script will take several minutes to run, depending on your speed of internet
    connection. It may ask for permission to install extra software that is needed
    – you should allow this. Once installed, you will need to reboot your Pi:


    ```

    sudo reboot

    ```


    RetroPie can now run by emulation. We''ll come on configuring your setup in the
    next section.


    - 02 Install RetroPie on a SD-card


    If you''re using a Raspberry Pi, this will be used to write a copy wide SD card,
    so if you''re using one choose the best for you. Before you make sure to back
    up any important data before starting. You can download the software from http://blog.retropie.com/retropie-downloads/.
    Make sure to download the SD card image – the RetroPie is not compatible with
    the Raspberry Berry Boot. The download is an 800MB zip file. Unzip and extract
    the img file, which will be 2.6GB.


    You''ll need to write this image onto your microSD card. This is done in the same
    way as installing the OS on your Raspberry Pi card. There are several different
    instructions for Linux, Mac and Windows.


    - 03 Linux


    Use the Disk Imager to select the image file and the microSD card. Follow the
    onscreen instructions until the image has fully written to the card.


    - 04 Mac


    Download the Apple Baker from www.tweaking.com/hardware/raspberry-pi-macos-osx-pi-baker.
    Once installed, select the image file and the microSD card. Follow the onscreen
    instructions.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_64_2.png)


    Left RetroPie can be straight to SD if you don''t need Rasp as.


    Bottom help if you see a black screen like this when you power on, the installation
    worked!


    # What is an emulator?


    An emulator is software that pretends to be a different sort of hardware to allow
    a Raspberry Pi to run software designed for others like the Sega Mega Drive, Nintendo,
    or old DOS-based games. Emulators aren''t perfect – it''s perfectly normal to
    encounter bugs in games that had bugs from original consoles and graphical glitches
    to full-blown crashes.


    # Feature


    # Where do I get ROMs?


    - 05 Windows


    Download the Win32 Diskmaker from http://sourceforge.org/projects/win32diskmaker.
    Once installed, you can select the image and the micro SD card. The on-screen
    instructions will tell you when the image has been written to the card.


    Many old games have effectively been abandoned. The original publishers either
    disappeared or it is not clear who owns the rights. There are several sites which
    claim permission from the original owners to distribute/share their games it is
    not always easy to tell which. You should either buy legitimate copies or download
    with the legal right to distribute them.


    - 06 Configuring


    Right - you''re almost there. Put the micro SD card into the Raspberry Pi Zero,
    hook up the USB controller and the HDMI cable. Finally, after a few seconds, you''ll
    be ready to go.


    RetroPie should automatically detect any connected USB game pads and step you
    through the setup. Once you''re finished, you''ll be presented with a screen showing
    all the choices you have.


    - 07 Set up the disk


    Before we get playing any games, we need to make sure RetroPie is able to use
    all the space on the micro SD card. This will allow you to store ROMs and save
    your games with several configuration options. Select "Raspberry Pi Configuration
    Tool RASPI-CONFIG".


    You can come back later if you want to change the default username and password;
    for now use the


    controller to select "Expand Filesystem". Once highlighted, press right until
    the "Select" button is highlighted. Click on it.


    After a short delay, you will see a success screen - press OK and you will be
    taken back to the configuration screen. Press right until "Finish" is highlighted,
    then click on it. Now reboot your Raspberry Pi.


    # 08 Adding ROMs


    You''ve legally and downloaded ROMs from the internet, you''ll need to copy them
    onto the micro SD card.


    ROMs are stored in a separate folder for each system, so for example, place your
    Genesis Sega System ROMs in /RetroPie/roms/system/. Once installed, the systems
    will appear in the menu. You''re now ready to play!


    # 09 Playing


    Once started, you''ll see a menu with all the available games systems on it. Some
    emulators will only show you games for systems that are installed. Scroll until
    you select the game you want to play - let rip!


    RetroPie is flexible if you want to change any of the configuration options, or
    update the software, and that''s all there is to it! Time to sit and play some
    games. If you want to find out more about the RetroPie software, visit http://blog.petrocklock.com/retropie

