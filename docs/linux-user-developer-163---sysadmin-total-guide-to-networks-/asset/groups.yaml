    ## 游戏安全


    ![](img/f4a034c4fbc20906a013558fa4e058a2_8_0.png)


    ## Linux Mint 服务器和 ISO 镜像遭黑客


    ## 华纳兄弟取消 Linux 移植版


    Linux Mint 项目——在 distro.com 等追踪器上最流行的 Linux 发行版——遭受了攻击，导致其网站被破解并留下了被感染的 ISO 镜像。Linux
    Mint 团队确认了这一攻击，他们表示黑客在 Linux Mint ISO 中做了严重问题，并在其中留下了后门。


    ## 蝙蝠侠 Windows 版上线口碑平平


    黑客通过 Linux Mint网站服务器 WordPress 安装中的 PHP 脚本获取访问权限，破解了 64 位 Linux ISO 17.3 Cinnamon
    版本。该 ISO 以及 2 月 20 日星期六的 64 位 Cinnamon 版本可能被恶意软件感染。


    华纳兄弟媒体在游戏原版发布出现重大问题后，取消了在 Linux 上发布《阿卡姆骑士》（Arkham Knight）。阿卡姆系列的最新作《蝙蝠侠：阿卡姆骑士》在首发后不久便于
    PS4 和 Xbox 发布。遗憾的是，Windows 版本严重的性能问题和游戏崩溃 Bug 导致其在发布了几个补丁修复了最严重的问题后才艰难恢复正常。


    当时，恶意软件本身似乎是 / Tsunami-a，也被称为 Linux。这是一种众名的分布式技术，通过使用 IRC 服务器来接收进一步信息。确定你的 Linux
    是否被入侵的一种方法是查看 `/var/lib/man.cy` ——如果该目录不为空，那么你很有可能被感染了。


    Windows 版本无论用户持有了多久都将提供退款。随着大量 Windows 用户涌入退款，人们对该作品产生了担忧——而事实证明这种担忧是完全正确的。“我们很遗憾地确认，《阿卡姆骑士》并未（支持
    Linux）”该公司在 Steam 上的一封简短贴文中写道——如果您已预购，请申请 Mac 或 Linux 版的退款。


    对于 Linux 玩家来说，这对于 Valve（维尔）来说是一个 AAA 大作的损失，因为它正依赖跨平台支持来其基于 Steam OS 的游戏平台。


    然而，这些补丁很少能解决该作品的核心问题，导致华纳兄弟宣布向所有买家提供……


    ## 基础架构


    ## Linux 基金启动 Fast Data 项目


    Linux 基金启动了一项协作工作：Fast Data (FDK)，这是一个开源项目，旨在为下一代网络和存储软件提供高速输入/输出服务。


    执行主任 Jim Zimmer 声称，技术集成和用户采用至关重要。“FDK 项目解决了了对灵活且可扩展的 I/O 的关键需求，以满足当今云计算环境日益增长的需求。


    初始贡献包括包管理器、文件系统以及基于数据平面开发包（DPDK）的功能性 VSwitch-Router。这包括硬件加速、工具包、调试和开发环境，并配有 OpenDay
    管理代理和主页。


    “这不仅仅关乎快速网络和快速存储，”ViPP Technology 首席官 David Ward 表示，“灵活的架构以及开发、测试和持续性能工具包的加入，该项目的设计初衷考虑了充满活力的开源贡献者社区。”


    ![](img/f4a034c4fbc20906a013558fa4e058a2_8_1.png)


    开源软件的采用通过减少……改变了网络行业。


    最终的 Fast Data 版本已上线，完整信息可在 fd.io 获取。


    上述 17.3 Cinnamon 版本因对 Linux Mint 的攻击而受到破坏。


