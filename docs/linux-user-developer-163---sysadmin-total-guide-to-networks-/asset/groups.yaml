    ## INITIATE THE BASIC NETWORK SERVICES


    Start setting up control machine to provide DNS and DHCP servers for all devices
    across your network.


    Before we dive in, there are just a few concepts to explain the base setup that
    we need for our fully-featured network. Any device on a network needs some basic
    information to be part of a computer network.


    An IP address is a unique identifier for a device on the network. Every device
    on the network needs an IP address to communicate or pass data. Currently, we
    have two types of IP addresses: IPv4 and IPv6. For example, an IPv4 address such
    as 192.168.0.100 was created to address the problem of the limited number of addresses
    with the IPv4 scheme. An IPv6 address is a 128-bit address represented by a colon.
    For this feature we are focusing on the former.


    To know the IP address (52.17.239.22), only when we have the IP address can we
    reach the website.


    Gateway/Router Address. A gateway or router is used to reach the devices that
    are part of your network - to continue with our previous example, once we have
    the IP for linuxuser, configure the device to connect the gateway to the router.


    We can also configure these settings manually on each device, or automatically
    to avoid prone and error when you have a lot of devices on our network. Automatic
    configuration allows all the devices on our computer network.


    DNS Server Address. A DNS (domain name system) is used to resolve human-friendly
    domain addresses to friendly IP addresses - basically, to translate memorable
    strings into fairly understandable numbers. For example if we want to reach www.linuxuser.com,
    we need to connect to a DNS server.


    Dnsmasq. We will use dnsmasq to provide DHCP and DNS Servers for our network.
    Dnsmasq is a piece of lightweight software that is very easy to use and with small
    networks.


    To start, install the dnsmasq package on the Linux machine that will be acting
    as the server. On Debian-based systems you use the following command to install
    the dnsmasq server:


    ```bash

    $ apt-get install dnsmasq

    ```


    Once installed, you will need to edit the /etc/dnsmasq.conf file to configure
    the service.


    ## REMOTE SERVER ACCESS WITH PORT FORWARDING


    There will be times when you need to access your server when that server is not
    directly connected to the internet. In these cases, we can use a technique called
    port forwarding. Port forwarding allows you to forward network traffic from one
    port to another of the LAN''s ports. For example, if we want to access a web server
    at 192.168.1.50 on port 80, we are running a web server on one of the computers
    on the LAN with the IP address 192.168.1.50 and port 80. By port forwarding, the
    router will automatically send the traffic to the correct server.


    To enable port forwarding, you can go to your router configure page and look for
    the port forwarding option. For example, if we want to access our server at 215.68.193.110
    on port 80, we need to add the IP address 192.168.1.50 to the router''s list and
    request port 80 on port 81 on LAN and vice versa.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_18_0.png)


    ## PUBLIC DNS SERVICES


    One of the key bottlenecks in your network is the DNS server. Every device on
    the network needs to query the DNS server for the request it needs to make the
    connection. Public DNS services like Google and OpenDNS provide fast DNS servers
    that give you complete internet access.


    Below we''ll use dnsmasq and DHCP servers to configure our clients online.


    ## Feature Networks


    ## CONFIGURE IP ADDRESS AND SET UP AN INTERNET GATEWAY


    We''ve got Dnsmasq installed, let''s start assigning IP to our network devices
    and getting them online.


    First, disable /etc/resolv.conf, as /etc/resolv.conf contains the address of the
    DNS server we use by the local system:


    - no-resolv


    ```bash

    server=8.8.8.8

    server=8.8.4.4

    ```


    By adding the following line, Dnsmasq will forward the query to the following
    servers (Google''s Public DNS servers) if it doesn''t know the address itself:


    We can add the following to our Dnsmasq config:


    Custom DNS entries get first priority and can be used to override public DNS.
    If we add an address here (like 192.168.1.11), Dnsmasq will use 192.168.1.11 instead
    of the public entry for the same domain. Dnsmasq also acts as a cache for the
    upstream DNS server. To allow the DHCP server to recover quickly, we should limit
    the frequency of querying the upstream server. The following sets the dhcp range
    query limit to 100:


    - dhcp-size=1000

    - dhcp-range=192.168.1.2,192.168.1.200,255.255.255.0


    ![](img/f4a034c4fbc20906a013558fa4e058a2_19_0.png)


    The following options allows the DHCP server to configure of Dnsmasq and set up
    the DHCP range, subnet mask of the network, and lease time.


    ### DHCP server options


    - dhcp-option:router,192.168.1.1


    This will enable DHCP to assign addresses to 192.168.1.2 and 192.168.1.200. The
    lease time of 12 hours means the address is leased for 12 hours and then the client
    must renew the gateway server, use:


    - dhcp-option:dns,192.168.1.10


    We might want to reserve a particular IP address for a device. We can do this
    with the following:


    - dhcp-option:host:11:22:33:44:55:66,192.168.1.13


    This option will set the IP address as 192.168.1.13 if the device''s hardware
    (MAC address) is 11:22:33:44:55:66. To specify the NTP (network time protocol):


    - dhcp-option:ntp,192.168.1.10


