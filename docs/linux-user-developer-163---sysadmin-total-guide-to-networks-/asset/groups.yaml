    \ store blocks; contains comma-separated directories; default value is $HADOOP_HOME/dfs\n\
    - dfs.checkpoint - list of directories where the NameNode stores checkpoints;\
    \ contains comma-separated directories; default value is $HADOOP_HOME/hdfs/fsname\n\
    \nFor a production cluster, the following settings are recommended:\n\n## Configuration\
    \ to Run Hadoop\n\nTo run three files need to be configured: core-site.xml, hdfs-site.xml,\
    \ yarn-site.xml. The core-site.xml contains the configuration setting for core,\
    \ hadoop sets the configuration to HDFS, YARN and Map Reduce. The IP address is\
    \ configured with the IP of the node which acts as NameNode.\n\n```\n<configuration>\n\
    \  <property>\n    <name>dfs.default.name</name>\n    <value>hdfs://10.0.1.113:9000</value>\n\
    \  </property>\n</configuration>\n```\n\nIn hdfs-site.xml, the NameNode and DataNodes\
