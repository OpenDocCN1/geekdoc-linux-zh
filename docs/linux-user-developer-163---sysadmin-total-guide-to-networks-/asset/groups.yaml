    \n```\n$ sudo apt-add-repository ppa:plex\n$ sudo apt-get update\n$ sudo apt-get\
    \ install plexmediaser\n```\n\nFor devices like iOS, Android, Xbox One and Roku,\
    \ search the respective stores to download the Plex client. Some times might use\
    \ device that does not have DLNA. DLNA (Digital Living Network) is industry standard\
    \ for sharing files over a network. Of devices and media players it supports,\
