    \ `hadoop version` 检查 Hadoop 版本。\n\n必须在 `yarn-site.xml` 中配置 manager。\n\n# 二叉树\n\
    \n![](img/f4a034c4fbc20906a013558fa4e058a2_51_0.png)\n\nMihalis Tsoukalos 是一位\
    \ Unix 管理员、一个 iOS 程序员以及一位 DBA 爱好者。他从 1993 年起一直使用 Linux。\n\n# 计算机科学\n\n# 理解二叉树\n\
    \n- 资源\n- 文本编辑器\n- GCC 编译器\n- Perl 解释器\n\n# 了解如何开发和使用灵活良好的树数据结构\n\n我们将介绍二叉树的结构，因为它是最常用的树类型。\n\
    \n本教程将介绍开始使用树数据结构所需的知识以及工作原理。它将在 C 和 Python 中编写。二叉树的优优势是可以在极短的时间内找到某个元素是否存在。树也适用于层次数据建模且没有循环。树的根是树的第一个节点。每个节点可以连接到一个或多个节点，取决于树的类型。如果每个节点只指向另一个节点，那么这就是链表！没有子节点的节点称为叶子节点，而至少有一个子节点的节点称为内部节点。\n\
    \n# 树的结构\n\n二叉树是每个节点最多存在两个其他节点的树。“大多数”意味着它可以连接到两个或没有其他节点。树的高度定义为从根到节点的最长路径，而节点的深度是从节点到根的边数。当树是平衡的时，从根到节点的长度最多比最短路径多\
    \ 1。\n\n# 理论\n\n严格来说，“树”是满足以下条件的有向无环图：\n- 它有一个作为树入口点的根\n- 除了根以外，每个顶点都有一个入口点；\n\
    - 有到每个节点的路径；\n- 边具有方向性\n- 它没有循环。\n\n如果二叉树是平衡的，它的搜索、插入和删除操作大约需要 `log(n)` 次，其中 `n`\
    \ 是元素的总数。此外，平衡树的高度约为 `log2(n)`，这意味着拥有 1000 个元素的树高度约为 10，拥有 100,000 个元素的树约为 17，而拥有\
    \ 1,000,000 个元素的树约为 20。向平衡二叉树放入大量元素不会改变树的速度。你可以在 30 步内到达 1,000,000 个节点中的任何节点。相邻图显示了小型二叉树的图形表示。你可以看到所有的值都小于根子树的值。换句话说，二叉树中的所有键按设计都是有序的。好的一点是你不需要对它们特殊\
    \ care；将元素放在正确的位置可以保持它们有序。你会发现，由于树的构建方式，从树中删除元素并非易事。\n\n# 创建二叉树\n\n由于存在链表，你需要一个特殊的结构来存储树的数据。对于二叉树，每个节点应该能够引用两个节点。因此，下面的\
    \ C 结构用于描述二叉树的节点：\n\n```c\nstruct node {\n  int val;\n  struct node *right;\n\
    \  struct node *left;\n};\n```\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_52_0.png)\n\
    \n# 二叉树教程\n\n你也应该意识到存在具有两个以上节点的树。请看第 54 页的插图了解相同的元素如何形成两种不同的树。每个节点最多可以连接上方下方的一个节点。\n\
    \n# 二叉树 A\n\n# 二叉树 B\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_53_0.png)\n\n\
    右：虽然它们包含相同的元素，但这些具有不同节点的树。每个树节点持有的数据（也称为键）是整数；然而，如果你想让实现更复杂，可以使用任何数据类型。你可以在节点结构中添加一个变量，记录该元素被“插入”到二叉树的次数。你没有义务使用\
    \ count 变量，除非你想这样做，但拥有这种能力是好的。防止向二叉树中插入重复节点需要额外的 care，因为在插入元素之前必须考虑 count 变量的值。`binTree`\
    \ 的代码可以在这里看到：用于向二叉树插入元素并访问其所有节点的 `insertNode` 和 `traverseTree` 函数。\n\n- Go 中的二叉树\n\
    - Go 可以编写很多东西，包括二叉树。事实上，Go 开发者提供了一种二叉树的实现。参考 github.com/pkg/tree 中的 `tree.go`。每个节点的定义如下，正如你所预期的：\n\
    \n```go\ntype node struct {\n    Value int\n    Left *node\n    Right *node\n\
    }\n```\n\n```c\n// 用于 traverseTree 的辅助函数\nvoid traverseTree(struct *root) {\n\
    \    if (root == NULL) {\n        traverseTree(root->left);\n        traverseTree(root->right);\n\
    \    }\n}\n```\n\n```c\nint insertNode(struct *root, int key) {\n\tif (root ==\
    \ NULL) {\n\t\tif (root->left == key) {\n\t\t\treturn 1;\n\t}\n\t\tif (root->right\
    \ == key) {\n\t\t\treturn 1;\n\t}\n\t\treturn 0;\n}\n```\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nstruct node {\n    int val;\n    struct node *left;\n \
    \   struct node *right;\n};\n```\n\n// 创建一个新的 BST 节点\nstruct node *newNode(int\
    \ item) {\n\tstruct node *temp = (struct node *)malloc(sizeof(struct node));\n\
    \ttemp->val = item;\n\ttemp->left = temp->right = NULL;\n\treturn temp;\n}\n\n\
    // 插入给定键的新节点\nstruct node*insert(struct node* node, int val) {\n\t// 如果树为空，创建一个新节点\n\
    \tif (node == NULL) {\n\t\treturn newNode(val);\n\t}\n\t// 如果键已存在，返回！\n}\n\n"
