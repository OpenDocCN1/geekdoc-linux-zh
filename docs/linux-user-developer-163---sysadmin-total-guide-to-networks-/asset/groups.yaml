    \nIn the main article, we have used the USB of the Raspberry Pi module that plugs\
    \ into the Pi. But if you don't have easy access to one of these? Almost everyone\
    \ has a webcam sitting around the house. You can try to plug your webcam into\
    \ the USB port. The image quality and frame second is not as good as what you\
    \ can get with the actual module. The key is getting\n\nanalysis functions is\
    \ expecting. The VideoCapture() function can not only take a video file name to\
    \ read, but also a stream from the Raspberry Pi. Assuming that you only have one\
    \ camera connected, you can use\n\n```\ncamera = cv2.VideoCapture(0)\n```\n\n\
    Make sure that your webcam is connected and that Linux can talk to it all the\
