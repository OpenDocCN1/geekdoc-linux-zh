    Log in to your server via command line from anywhere the world, or share your
    desktop with a remote machine to get a GUI


    SSH (Secure Shell) is a common way to log in to a system remotely. OpenSSH is
    the most popular SSH implementation is available across all the popular platforms:
    Linux, Windows, Android, OS. To install the OpenSSH-server, use:


    ```

    $ sudo apt-get install openssh-server

    ```


    Once installed, openssh-server is ready for action without further configuration.
    Log in from a remote machine using:


    ```

    $ ssh username@hostname

    ```


    The username should already exist on the server. By default, OpenSSH is configured
    for password authentication. A far more secure method is to use public key authentication.
    On the remote machine, generate public/private pair:


    ```

    $ ssh-keygen -t rsa

    ```


    The above command gives you two files. These are located in ~/.ssh/id_rsa and
    id_rsa.pub. id_rsa is your private key - do not share this with anybody. Copy
    the content of id_rsa.pub (public key) and place it in the folder ~/.ssh/authorized_keys
    on the remote server. Next time, you will log in without a password.


