    用于 letsencrypt 的 standalone webroot，(webroot) 指运行中的 Web 服务器的 webroot 目录，manual)
    则提供了执行手动文档的说明。


    另一个 nginx 也是可用的，比其他的更强大，它会自动安装并配置 nginx，但会在安装阶段耗费时间，并且没有随 letsencrypt-wrapper
    脚本一起安装。


    可以使用插件，因此你可以随时调用。要做到这一点，你需要执行一条命令。例如，使用 webroot 插件执行命令：


    ### letsencrypt --webroot


