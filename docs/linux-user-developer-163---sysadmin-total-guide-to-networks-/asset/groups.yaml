    # Tutorial


    # # Create a Minecraft Minesweeper game


    # ## Use your Raspberry Pi and Python knowledge to code a simple mini-game in
    Minecraft


    ![](img/f4a034c4fbc20906a013558fa4e058a2_75_0.png)


    You may remember or even played the classic Minesweeper PC game that originally
    dates back to the 60s. Over the years it has been bundled with most operating
    systems, and it has even been featured as a mine game variation on Super Mario
    Bros.

    This project will walk you through how to create a simple version in Minecraft:
    Minecraft Minesweeper! We will use blocks to turn one of these blocks into a mine.
    To play the game, guide your player around the board. Each time you find a block
    you turn it to gold and collect points, but watch out for the mine as it will
    end


    #  01 Update and install


    To update your Raspberry Pi, open the terminal and type:


    +   - sudo apt-get upgrade

    - sudo apt-get update


    The new Raspberry Pi OS image already has Minecraft and Python. The Minecraft
    API enables you to interact with Minecraft using Python is also pre-installed.
    If you are using an old OS version, it is worth downloading and updating to the
    new Jesse or Raspian image at www.raspberrypi.org/downloads.


    ![](img/f4a034c4fbc20906a013558fa4e058a2_75_1.png)


    **Dan Alfred**

    A Raspberry Pi Certified Teacher and a Lead School teacher. He has written a lot
    for the Astro Pi school contest'
  - "[PAGE 76]\n\n# Importing modules\n\nLoad your preferred python editor and start\
    \ a new window. You need to import the following modules: **import random** to\
    \ create and generate the location of the mine, and **import time** to add pauses\
    \ and delays to the program. Next, add a few lines of code: `from mci import minecraft`\
    \ and `mc = minecraft.Minecraft()`. These create the link between Minecraft and\
    \ Python. This enables you to write to \"minecraft.Minecraft created\".\n\n```\n\
    import random\nimport time\nfrom mci import minecraft\nmc = minecraft.Minecraft.create()\n\
    ```\n\n# Grow flowers\n\nThe program below is to show how it works. Each block\
    \ has its own ID number, and there are hundreds. x, y, z = mc.getPos() gets the\
    \ player's position in the world and returns it as a tuple. Now that you know\
    \ where you are in the world, blocks can be placed using mc.setBlock(x, y, z,\
    \ flower).\n\n```\nflower = 38\nwhile True:\n    x, y, z = mc.getPos()\n    mc.setBlock(x,\
    \ y, z, flower)\n    time.sleep(1)\n```\n\n# Running the code\n\nReducing the\
    \ size of the Minecraft window will make it easier for you to see both the code\
    \ and the program running; switching between them can be frustrating. Tab key\
    \ hides the keyboard and mouse from the MC window. Run the Python program and\
    \ wait for it to load - as you walk around, flowers appear! Change the ID in line\
    \ 1 to change the block type, instead of flowers, try planting gold, water, or\
    \ embers.\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_76_0.png)\n\n# Posting a\
    \ message to the Minecraft world\n\nIt is also possible to post messages to the\
    \ world that is used later in the game to keep the player informed of the flower\
    \ and their current score. In your progress add the following to the line of code\
    \ `flower = 38`, making this line `mc.postChat(\"I grew some flowers with code\"\
    )`. Now see the message pop up. You can changing the message, or move to the next\
    \ step to start the game.\n\n# Create the board\n\nThe game takes place on the\
    \ board where the player is currently standing, so it is advisable to fly into\
    \ the air or find a flat terrain before running your program. To create the board\
    \ you will need to write a loop and run the program in the world using the x,\
    \ y, z = mc.getPos(). Use the mc.setBlock code to place the blocks which make\
    \ up the board.\n\n```\nmc.setBlock(x, y-1, z, y-1, z, 58).\n```\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_76_1.png)\n\
    \nThe safe blocks have been turned into gold - the rest are potential mines!\n\
    \n# Switching to the shell\n\nThe Python Shell and Minecraft can be frustrating,\
    \ especially as Minecraft overlays the Python window. Well, the solution is to\
    \ hide the screen. (Tab key full-screen coordinates are: Alt to remove Minecraft\
    \ from the MC window.)"
