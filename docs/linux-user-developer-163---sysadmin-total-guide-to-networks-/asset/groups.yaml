    与BQ合作推出首款旗舰移动计算设备


    Canonical宣布与西班牙移动制造商BQ合作推出其首款“融合型”Ubuntu平板电脑设备——Asahi M10 Ubuntu版。Canonical愿景一个移动计算与桌面计算界限变得模糊的未来，但由于社区驱动开发的尝试失败，这一愿景从未离开设计图纸。然而，公司的愿景并未消失，那款兼任移动和桌面电脑角色的首款设备却曾是……


    Asahi M10 Ubuntu版是Canonical首个提供成品硬件的融合系统。作为平板电脑使用时，M10可以独立运行或使用以触摸为中心的界面；当连接到外部显示器、键盘和鼠标时，平板电脑会无缝切换到传统的桌面用户界面。“我们带来了您对Ubuntu电脑所预期的一切，”Canonical高管Mark
    Shuttle在发布会上声称，“这是被扩展到桌面尺寸的界面——它是给定情况下最正确的用户体验和交互模型。此外，在应用程序方面，我们没有其他操作系统可以提供：一个适用于所有平台应用程序的单一视觉化框架和工具集。”


    在内部，M10基于联发科四核MT67363A处理器，运行频率高达1.5GHz，配备2GB内部存储空间，这超过了Ubuntu Edge上承诺的配置——微HDMI端口提供了与外部显示器的连接，而7200mAh的电池则允许设备移动使用。该平板电脑为10.1英寸全高清型号，具有电容式多点触摸功能，嵌套在Asahi的Dragonfruit冲击力之后。“Ubuntu版是我们第三款搭载Ubuntu出的移动设备，”BQ首席官Rodriguez
    del Prado在发布会上解释道。之前的版本是BQ Earis Ubuntu版和BQ E5 HD Ubuntu版，我们很高兴成为首个推出融合Ubuntu体验的OEM厂商。这种创新故事让BQ和Ubuntu变得如此契合。


