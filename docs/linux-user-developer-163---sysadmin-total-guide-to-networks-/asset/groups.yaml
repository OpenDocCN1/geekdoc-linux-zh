    \ 守护进程。这会启动 NameNode，通过执行 `hdfs getnamenode` 启动 `slaves` 文件列出的 DataNodes，并通过执行\
    \ `hdfs getsecondarynamenode` 启动其他机器上的 SecondaryNameNode。此外，其他守护进程也通过 `start-yarn.sh`\
    \ 启动。\n\n`map-site.xml` 文件与 `yarn-site.xml` 位于同一文件夹。将 `map-site.xml` 的内容复制到配置部分，然后将列表添加到\n\
    \n# 其他属性\n\n如果我们需要添加或删除集群节点，则需要在一个包含加入集群的授权机器列表的文件中进行配置。`slaves` 文件包含 `host.dfs.hosts-file`。HDFS\
    \ 的默认缓冲区大小为 4KB，可以通过设置 `core-site.xml` 中的 `io.file.buffer.size` 值来设定。Hadoop 具有垃圾回收机制，它会在永久删除文件前将其删除一段时间；使用\
    \ `trash.interval` 属性来指定时间间隔。\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_50_0.png)\n\
    \n```xml\n<configuration>\n  <property>\n    <name>yarn.resourcemager.hostname</name>\n\
