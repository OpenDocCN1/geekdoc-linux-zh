    摄像头 模块是目标检测的焦点。输入数据汇总后通过运行在 PI 上的客户端程序处理。


    # 组件列表


    - 树莓派 B+

    - Arduino

    - 摄像头模块

    - HC-SR04 超声波传感器

    - OpenCV


    ![](img/f4a034c4fbc20906a013558fa4e058a2_67_0.png)


    超声波传感器 它通过感知角度和表面状况来确定相对于迎面物体的停止距离。


    Arduino 它模拟遥控车控制器的按钮按下。四个引脚连接到控制器的引脚，分别对应前进、倒退、左和右。


    右 一旦检测到物体，超声波传感器就会传递此信息并帮助遥控车停止。


    远右 Arduino 板模拟按键按下，帮助遥控车自主行驶。


    # 自动驾驶遥控车


    # 王正（Zheng Wang）用他的完全自持驱动汽车反超了 Google


    开发自动驾驶汽车的想法从哪里来？

    你可能不相信，我确实为了一个学校项目做了这个。我所有的兴趣都是机器学习。我决定开发一些大量涉及机器学习和编码的东西。我在网上搜索，发现了一个由 David
    Singleton 开发的非常有启发性的树莓派项目，它展示了使用 Arduino 和其他几个物品是可能的。看到遥控车可以在没有帮助的情况下自己行驶，我非常惊讶，我想我是否可以复制一个类似的项目。


    在计算机上接收的图像被转换为灰度图并输入神经网络以为汽车做出预测，以便在正确的时刻左转或右转。这些图像也被用于控制汽车和停止标志，而树莓派则向系统报警障碍物的距离。这就是我的项目主要学习的方式。


    关于使用超声波传感器测量距离的帮助，网上有一些针对爱好者的简用教程，到处都是其他材料。


    你能给我介绍一下超声波传感器吗？它能检测 360 度吗？


    我使用了我的树莓派并下决心尝试构建我自己的可以实现更多功能的自动驾驶汽车。我还想添加避障、停止和交通灯检测等功能。开发这个项目花费的时间比我想象的要长，因为有许多需要考虑的因素。


    对于这个项目，我选择使用 HC-SR04 超声波传感器，它是有效的，而且市上有许多对用户友好的设备。从零开始设置有点棘手，但我解决了我遇到的问题。当我遇到问题时，我搜索了互联网并发现了一个用的列表，显示检测范围在
    30 度以内，这似乎是正确的方向。市场上有很多传感器，所以如果需要，一个完整的 360 度检测系统是可能的。


    ![](img/f4a034c4fbc20906a013558fa4e058a2_68_0.png)


    系统的最后部分由一个发送到树莓派的神经网络组成，树莓派连接到遥控器。然后 Arduino 发送高或低电信号来驱动汽车。这个过程相当不容易，在经历了最初的试错阶段后，花了很长时间才使其正确，然后它才开始独立运行。


    # 你能为我们概述一下自动驾驶系统是如何工作的吗？


    # 你如何看待这个项目的未来？未来在哪里？


    '
