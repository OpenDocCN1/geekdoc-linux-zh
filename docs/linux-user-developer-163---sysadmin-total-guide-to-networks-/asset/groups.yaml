    Google 对用户界面的设计使得 Hangouts 中的通话和会议变成了一种真正的享受。


    Telepathy 是多个应用程序和库的结合，需要它们才能流畅运行。


    # 安装简易性


    你需要一个 Google 账户才能访问 Hangouts。你可以通过名称或电子邮件与同样拥有 Google 账户的其他联系人对话。对于 Chrome 以外的浏览器，需要“googletalk”插件，你还必须经过安装插件和授予硬件权限的乏味程序。


    在两个 KDE 桌面之间进行视频通话是痛苦且耗时的，因为存在极其糟糕的安装问题。此外，大多数用户会看到视频通话按钮呈灰色，这仅仅是因为缺少 `telepathy-kde-call`
    或 Framestep Gstreamer 代码、QT 绑定。遗憾的是，Telepathy 的视频通话从未开箱即用。


    # 性能


    Hangouts 提供了出色的性能，并带有清晰音频的充足视频。质量取决于你的网络，Hangouts 会据此进行调整。它在互联网网关方面有一些偏好，例如更好地利用带宽以及将视频流分开、手动选择音频和视频设备。


    你可以使用自己的账户连接，但这会影响流量。流量通过服务器传输，可能会出现问题。由于由于，在本地子网的两台 PC 之间建立连接比点对网络花费长时间。尽管如此，视频和音频质量良好。


    # 功能


    Hangouts 是 Linux 上唯一支持视频聊天并支持十人会议的解决方案。Google 很好地支持 Hangouts。Linux 用户可以使用他们的朋友连接到任何
    Hangouts 用户。


    已建立通话的界面取决于所使用的协议和接收方的软件。在测试中，让通话工作的唯一方法是安装 Framestep（一个 Google 应用），它启用了 Fternet
    库并依赖 Fternet。


    # 局限性


    如果你不用 Chrome，则必须安装 Google 的“googletalk”插件，它仅存在于 Android 和 Debian 插件。Hangouts 使用了一种后方式而非
    XMPP 协议，这从以前起破坏了与第三方客户端的兼容性。此外，没有 Google 账户你什么也做不了，这是不可能。


