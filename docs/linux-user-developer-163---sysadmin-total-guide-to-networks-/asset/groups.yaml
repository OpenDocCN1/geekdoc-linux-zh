  md: "\n# Tutorial Hadoop\n\n## Set up a Hadoop cluster\n\nBreak into Big Data by\
    \ setting up a network of Hadoop nodes to process vast swaths of data\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_47_0.png)\n\
    \n**Ashish Sinha**\nAn author-developer, open source enthusiast, blogger and speaker.\
    \ With over five years of experience in an MNC, Ashish enjoys exploring new open\
    \ source technology and tools.\n\nWith the advent of new technology – a growing\
    \ number of social networking sites, scientific research projects and new business\
    \ models – data is growing rapidly. This data is minded to churn out the relevant\
    \ information: data is studied to uncover hereditary diseases; data from shopping\
    \ habits to weather station reports and new products are used for forecasting,\
    \ and much. The emergence of an open source technology called Hadoop\n\nEven the\
    \ large database class is not recommended as they stand low on the price/performance\
    \ graph. Typically, the choice of running HDFS and node manager would have the\
    \ following specification:\n\n- **Processor:** 4x8 octo-core 5 GHz CPUs\n- **Memory:**\
    \ 256GB ECC (Error Correcting Code) RAM (ECC)\n- **Storage:** 12x4 x 1-TB SATA\
    \ disks\n- **Network:** Gigabit Ethernet with link aggregation\n\n**Resources**\
    \ Hadoop\nbit.ly/20m12lh\n\nHadoop stores the data across several nodes in a cluster\
    \ and the data is replicated in HDFS to ensure high availability and reduce fault\
    \ tolerance. To store data that are terabytes or petabytes in size, we need to\
    \ use commodity hardware which is scalable, distributed, fast and resilient to\
    \ failure. In this tutorial, you will learn how to install and configure a Hadoop\
    \ cluster using the Apache distribution on a low cost operating system.\n\nThe\
    \ size of the cluster depends upon the data you want to store in. If you have\
    \ 5 TB of data with replication factor of 3, then you will need 20 TB storage\
    \ on HDFS. From the network perspective, a normal Hadoop cluster with 1 Gbps network\
    \ per node, 10 Gb switch or router – a “rack” is a storage area with all the data\
    \ nodes put together.\n\n## Cluster specification and sizing\n\nHadoop works with\
    \ commodity hardware, not “low-end”, as cheap machines have higher\n\n## Java\
    \ installation\n\nThe prerequisite to set up a Hadoop cluster is that you must\
    \ have some basic knowledge of Java. Hadoop runs on both Unix and Windows and\
    \ requires Java to be installed:\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_47_1.png)\n\
    \n**Right** The distribution layer represents your physical server racks, controlled\
    \ by a core layer and serving requests to the access layer (ie, the client machines)\
    \ in this case we will use a Linux machine.\n\nThe JDK for Linux from https://www.oracle.com/network/technology/java/javase/jdk7-downloads-1880260.html.\n\
    Now create the directory in root mode and install jdk, from the tar file using\
    \ the commands below.\n\n```\n$ sudo su\n$ mkdir /usr/lib/jvm\n$ mv jdk7-u279-1586.tar.gz\
    \ /usr/lib/jvm/\n$ cd /usr/lib/jvm\n$ sudo tar xzvf jdk7-u279-1586.tar.gz\n```\n\
    \nRestart your terminal and then append the following lines to /etc/profile\n\n\
    ```\nJAVA_HOME = /usr/lib/jvm/jdk1.7_09\nPATH = $JAVA_HOME/bin:$PATH\nJRE_HOME\
    \ = /usr/lib/jvm/jdk1.7_09\nexport JAVA_HOME=$JAVA_HOME\nexport JRE_HOME=$JRE_HOME\n\
    export PATH=$PATH\n```\n\nAfter appending the lines below run\n\n```\nsudo update-alternatives\
    \ --install \"/usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives\
    \ --install \"/usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 2\nsudo update-alternatives\
    \ --set java /usr/lib/jvm/jdk1.7_09/bin/java\nsudo update-alternatives --install\
    \ \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives --install \"\
    /usr/bin/java\" \"/usr/lib/jvm/jdk1.7_09/bin/java\" 1\nsudo update-alternatives\
    \ --set java /usr/lib/jvm/jdk1.7_09/bin/java\n```\n\nOnce this is done, restart\
    \ the terminal and run command\njava -version to check the Java installation.\
    \ This step needs to be done in all of the machines.\n\n## SSH configuration\n\
    \nAfter installing Java, we need to create a password-less key for the nodes of\
    \ the cluster using SSH. Secure Shell (SSH) is a Unix-based communication interface\
    \ to and access remote servers. Different users need password-less connections\
    \ for this you need to generate one and share it across the cluster for every\
    \ user. SSH in the client server, must use the open-ssh client in the master node.\
    \ Since SSH uses port 22, it is open by default. master machine must install the\
    \ open-ssh server by running y in the terminal to start the ssh services.\n\n\
    ## Hadoop installation\n\nThe tarball for Hadoop can be downloaded from \\apache.org/releases.\
    \ For this article we are using Hadoop-2.0.0.tar.gz; use this file in the Hadoop\
    \ installation.\n\n## Storing data in HDFS\n\nThe data is copied from sources\
    \ and kept in HDFS. Hadoop dfs -put is the command to put the file on HDFS. Hadoop\
    \ does not have a ready directory, we have to create one manually using the command\n\
    hadoop dfs -put user/hadoop/output/\n\n![](img/f4a034c4fbc20906a013558fa4e058a2_48_0.png)\n\
    \nit can be seen in the environment variables are stored in hadoop\n![](img/f4a034c4fbc20906a013558fa4e058a2_48_1.png)\n\
    \n| File | Description |\n| :--- | :--- |\n| core-site.xml | Edit site-specific\
    \ properties. |\n| hadoop-env.sh | The required environment variable is JAVA_HOME.\
    \ All others are optional! |\n\n```\n# core-site.xml\n# The required environment\
    \ variable is JAVA_HOME. All others are optional!\n# When running a distributed\
    \ configuration it is best to set JAVA_HOME in this file, as correctly defined\
    \ in environment\n# The Java implementation of use, in MB.\nexport JRE_HOME=/usr/lib/jvm/jdk1.7_09-jre\n\
    # The maximum amount of heap to use, in MB. Default is 1024.\nexport HADOOP_NODE_HEAP_SIZE=\"\
    2000\"\n# Where log files are stored.\nexport HADOOP_LOG_DIR=/var/log/hadoop\n\
    # The Java implementation to use. Use native commands.\nexport HADOOP_HOME=/usr/local/hadoop\n\
    export HADOOP_CONF_DIR=\"/etc/hadoop\"\n# Extra CLASPATH elements. Automatically\
