    # Can you help inspire the next generation of coders?


    **Code Club** is a nationwide network of volunteer-led after school clubs for
    children aged 9-11.


    We''re always looking for people with coding skills to volunteer to run a club
    at their local primary school, library or community centre for an hour a week.


    You can team up with colleagues, a teacher will be there to support you and we
    provide all the materials you''ll need to help get children excited about digital
