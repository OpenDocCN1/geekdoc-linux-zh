    # # Microsoft''s Service Fabric enters Debian public beta


    Azure Service Fabric will soon be available for Linux users


    If you''re one of the people who enjoy running and Java and Linux-based microservice
    applications, you''ll be pleased to know that Azure Service Fabric has been designed
    to simplify the process of managing applications that are solely based on a microservice
    architecture. The main aim of these microservice applications is to eventually
    be combined with larger applications.


    Early user reports of the Service fabric have been positive, with many highlighting
    the sheer speed of the service being one of the key factors behind its success.
    While Microsoft has a few services that have been made available to Linux users,
    now one of the few dedicated services is. It seems future that more developers
    will use Service Fabric for their expanding multi-cloud system, but there is no
    fixed date on that as yet. There''re also plans to expand Service Fabric into
    NET architecture, but again, nothing has been confirmed.


    Service Fabric was announced earlier this year at Microsoft''s Build conference
    in San Francisco. The public beta has only been made available recently. Interested
    parties should reach out to www. azure.microsoft.com for further information.


