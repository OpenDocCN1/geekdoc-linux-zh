  md: "# Feature Mint\n\n# # Security issues\n\nLinux Mint 17.3 was hit by malware\
    \ in early 2016. Does this system security remain a problem?\n\nOperating system\
    \ security is important; you have to trust that your chosen OS is secure, and\
    \ safe to use. So when this trust is breached, problems can arise.\n\nFor the\
    \ first time in March 2016, users of the Linux Mint official forum, and everyone\
    \ who downloaded the new Linux Mint 17.3 Cinnamon, were exposed to malware. This\
    \ infection—attached to ISO of the previous release—was quickly dealt with, it\
    \ handles.\n\nAfter all, isn't one of the main advantages of Linux that malware\
    \ ignores it due to its comparatively modest user base?\n\nUsers should have changed\
    \ passwords for all of their sensitive accounts, as well as destroying any copies\
    \ of Mint 17.3.\n\nWhile the malware is no longer an issue, this doesn't mean\
    \ that you should not be aware of the risks from malware and other security issues—whatever\
    \ you're running.\n\n![](img/90ce260f8df0a9c6339df2d60332346d_59_0.png)\n\n# \
    \ 01 Enable the firewall\n\nBuilt into Linux Mint is Uncomplicated, a firewall\
    \ for IPTables, but remains disabled by default. In an age of Trojans and remotely\
    \ activated malware, this seems like a mistake. We can fix this by enabling the\
    \ firewall, using this terminal command:\n\n```\n ufw enable\n```\n\nOnce up running,\
    \ you can check the status of the firewall:\n\n```\n ufw status verbose\n```\n\
    \nThe full rules can be read with:\n\n```\n ufw status show raw\n```\n\nIf you\
    \ wish to disable the firewall, enter:\n\n```\n ufw disable\n```\n\n#  02 Mitigate\
    \ Flash-based security issues\n\nIf multimedia support was enabled during setup\
    \ of Linux Mint 18, you'll have Adobe Player installed. Unfortunately, Flash is\
    \ prone to security issues, and the default source doesn't push out updates as\
    \ quickly as it could.\n\nIf you are using Adobe Flash Player, use this terminal\
    \ command to install a new version.\n\n```\n sudo apt-get install flashplayer-installer\n\
    ```\n\nNote that these Flash Player packages will be removed as a result of this\
    \ action.\n\n#  03 Keep your web browser secure\n\nBrowsers enable us to use the\
    \ web, but they're not necessarily maintained, can result in some security issues,\
    \ for malware to identify them. You have several options for avoiding these concerns.\n\
    \nMake sure to install and update your browser. If you're using Chrome, this happens\
    \ automatically.\n\nSecond, keep your amount of browser addons or plugins to a\
    \ minimum. Those that you do use only only from trusted locations.\n\nThird, employ\
    \ a sandbox locations for your browser, to lock in any malicious scripts that\
    \ might run on the pages you visit.\n\n![](img/90ce260f8df0a9c6339df2d60332346d_59_1.png)\n\
    \n![](img/90ce260f8df0a9c6339df2d60332346d_59_2.png)\n\n![](img/90ce260f8df0a9c6339df2d60332346d_59_3.png)\n\
    \n![](img/90ce260f8df0a9c6339df2d60332346d_59_4.png)\n\n![](img/90ce260f8df0a9c6339df2d60332346d_59_5.png)\n\
    \n![](img/90ce260f8df0a9c6339df2d60332346d_59_6.png)\n\n![](img/90ce260f8df0a9c6339df2d60332346d_59_7.png)"
