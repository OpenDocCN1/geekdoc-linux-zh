  md: '# Feature Mint


    # The base


    Linux Mint is so popular various distributions and desktop environments want to
    get involved. Notably, Mint has two build variants, one based on Ubuntu, and another
    on Debian.


    Debian and without any its Ubuntu packages, LMDE 2.0 ''Betsy'' was released in
    early 2016, LTS based without the rolling updates.


    Initially launched in 2006 and based on Ubuntu, Linux Mint 1.0 Ada was replaced
    by the Ubuntu Mint 2.0 ''Barbara''. Linux Mint built each release on top of the
    previous one, but using the Ubuntu codebase packages. This resulted in compatibility
    between Linux Mint and Ubuntu, rather than the later date becoming a fork.


    Despite the origins of the two Linux Mint editions, you have the option to be
    as flexible as you like, version 2.0 offering MATE and Cinnamon desktops, and
    we''ve already seen that the standard, Linux Mint 16.04 LTS based on Xfce and
    KDE desktops are awesome.


    Just four years later, however, came Linux Mint Debian Edition. Issued on a rolling
    release


    The differences between the Ubuntu and Debian editions have their own pros and
    cons, of courselet''s take a look.


    ![](img/90ce260f8df0a9c6339df2d60332346d_55_0.png)


    # How to install the OEM version of Mint 18


    If you build and sell computers, or refurbish old ones, and don''t know who is
    going to use them, use the OEM version of Mint 18.


