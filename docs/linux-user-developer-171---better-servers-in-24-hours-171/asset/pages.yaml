  md: "# Tor\n\ntext wlan0# add a # at the start to comment it out. Find the line\
    \ allow-hotspot wlan0 and delete the two lines below. Replace them with these\
    \ lines:\n\nRepeat these same steps for hostapd with command sudo /etc/init.d/hostapd\
    \ again modifying the line so that DAEMON_CONF=\"/etc/hostapd/hostapd.conf\"\n\
    \nDon't use bit torrent: this unless you are on volunteering runs. Tor works better\
    \ when you send out your traffic\n\n```\niface wlan0 inet static address 192.168.1.2\
    \ netmask 255.255.255.0\n```\n\n![](img/90ce260f8df0a9c6339df2d60332346d_78_0.png)\n\
    \nYou will look for this in various places on your platform:\nlog file /var/log/syslog\n\
    config file /etc/hostapd/hostapd.conf\ncommand line hostapd status\n\nAbove wlan0#\
    \ to comment out any lines after the three you have just pasted\n\nUse HTTPS versions\
    \ of websites: this encrypts your traffic until your Tor exit node\n\nRun sudo\
    \ ifconfig 192.168.1.21 to set your IP:\n\nDon't use browser plugins: they might\
    \ leak your real location.\n\n# 06 Configure Access Point\n\nRun sudo nano /etc/hostapd/hostapd.conf\
    \ to create a file. Paste the following:\n\nDon't use online documents: PDFs and\
    \ others can contain code that might give away your real location.\n\n```\ninterface=wlan0\n\
    driver=ie80211\nssid=Open_Pi\ncountry=us\nhw_mode=g\nchannel=6\nmac_addr=\nauth_al=1\n\
    ignore_broadcast_ssid=0\nwpa=\nwpa_password=Raspberry\nwpa_key_mgmt=WPA\nwpa_pairwise=TKIP\n\
    wpa_group_rekey=6400\nwme_enabled=1\n```\n\nIf you're using a Raspberry Pi, comment\
    \ out the line with\n\n# 08 Configure\n\nRun sudo nano /etc/tor/torrc to configure\
    \ it. Visit https://www.torproject.org/docs/faq and after it\n\nLog file /var/log/tor.log\n\
    VirtualNetworkAddress 192.168.10.1\nAutoproxySuffix=exit,\nAutoproxyControlDNS=1\n\
    Traffic 0\n\nDNForward 53\nDNSAddress 192.168.1.42.\n\nSave and exit. Run sudo\
    \ update-rc conf to enable tor on boot.\n\n```\neth0: BROADCAST,MULTICAST,UP,LOWER_UP,\
    \ mtu 1500 \n\tinet daddr  mask 255.255.255.0 global dynamic eth0\n\ntether0:\
    \ BROADCAST,MULTICAST,UP,LOWER_UP, mtu 1500\ninet 192.168.13.1 scope global tether0\n\
    \   mask 255.255.255.0\n```\n\n![](img/90ce260f8df0a9c6339df2d60332346d_78_1.png)\n\
    \nFeel free to change the password from 'Raspberry' to something more complex.\n\
