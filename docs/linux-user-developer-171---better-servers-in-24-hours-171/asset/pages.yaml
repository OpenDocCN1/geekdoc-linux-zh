  md: '# Feature Build better servers


    # BUILD A FILE SERVER


    Build a server at home or in the office, for the most common use case for SMEs
    – file backup and storage


    When deploying a server at home or in the office, for the most common use case
    is file backup and storage. While cloud storage has its place, for performance
    it makes sense to have a local copy of data and you might want to manage it, the
    main challenge being photos. Building a file server – also referred to as NAS
    (network attached storage) – is a great start giving you the ability to expand
    the functionality you need. Building a file server can also be cheaply, as a powerful
    machine isn''t needed.


    ![](img/90ce260f8df0a9c6339df2d60332346d_23_0.png)


    Above ZFS offers a way to use an advanced RAID without a hardware controller


    # Choosing your hardware


    There are key hardware aspects to a file server: the drives and the network connectivity.

    Depending on how much storage you need, the most cost-effective drives are ZTF
    for size, and you are likely to have at least two drives in RAID 1 for redundancy.
    When you set up the devices, you can potentially add more drives to expand the
    scale. Ensure that you choose a motherboard with plenty of SATA ports or use an
    external RAID card and remember that unless you are running


    From a USB disk, you''ll need a port for the OS drive. A small SSD is perfect
    for holding the OS and cores are also necessary.

    If you store files on your server, you''ll also need reliable network connectivity.
    Although at least one Gigabit Ethernet connection should be backed up by a modern
    system and likely will suffice. If it doesn''t seem up to the task, consider dedicated
    Ethernet or HomePlug, which allows network signals to reach the main circuits
    of the building.

    CPU speed is a major consideration for a file server, but something that is cost-


    # Installation


    File servers are relatively straightforward, but you can save plenty pain later
    by following some simple advice: When you''re putting the components together,
    it''s better to install the OS first to avoid stability issues later when you''re
    handling the hardware. There''s no reason not to build the system with the main
    OS and add the file drives later, which will confirm your configuration correctly.
    While you''re building the machine and setting it up, you''ll need to monitor
    performance for a while before moving into service, but might not be necessary
    – remember to install an SSH server into your system only when you need.


    ![](img/90ce260f8df0a9c6339df2d60332346d_23_1.png)


