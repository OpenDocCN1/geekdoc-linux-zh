    # Bash masterclass Flanking Bash with the power of Qt


    Tam Hanna

    has a difficult time deciding whether he likes more: Qt, Bash or electronics.
    Combining two of his favourites languages obviously, delights him to be your guide
    to super-efficient shell integrate into the Qt runtime environment with ease.


    Resources

    gnu.org/soft/bash

    Qt Creator

    www.qt.io


    If you have a hammer, every problem looks like a nail. Adding new tools makes
    you more efficient


    The scripting language of the Bash shell is Turing-complete. This means that it
    can be used to solve computing problems of arbitrary complexity. In practice,
    other languages are better suited to many computational tasks.


    For example, Bash is not object-oriented and does not support advanced mathematical
    operations. Being an interpreted language, it is prone to translation overhead.
    Finally, the relatively lenient runtime checks make finding syntax errors difficult.


    Fortunately, there are many tools that can create programs using a variety of
    other languages - one interesting example would be Qt - which


    then be invoked by shell scripts. This way, an object-oriented and natively compiled
    programming language can be used to do the heavy lifting, while the rest of the
    work is done by a shell script.


    Integrating Qt into shell scripts is also interesting from another point of view.
    The programming environment we discussed is amply in past issues. C++ is a powerful
    programming language. Many if not most scientific algorithms come with at least
    one C implementation, which is very fast.


    To cut a long story short: integrating Qt and Bash is worth your time, Time to
    get to it!


