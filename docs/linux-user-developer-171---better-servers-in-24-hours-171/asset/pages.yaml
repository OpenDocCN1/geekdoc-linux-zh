    # The Debian edition


    All of this bleeding edge software, means of, that LMDE comes with a few minor
    problems. For instance, support for multi-core CPUs can be a problem, as can the
    use of XFS as a file system. And these issues occur regularly, but they are often
    infrequent enough for all of us needs, sometimes just don''t use it.


    Next, enter as requested, partition the disk. When complete, check Prepare for
    shipment to end, and make for the end user to create their own account and configure.


    It might seem confusing, what with Ubuntu being based on Debian, and there is
    also a Debian-based edition of Mint.


    The Linux Mint Debian edition is less mainstream than the standard Ubuntu version,
    with the same package repositories but without, compatibility and other features.
    As you may have guessed it is different, and is for experienced Linux Mint users.


    As long as what you are using is not the mainstream operating system however,
    and you have the skills and patience to configure as, you should be fine. As with
    Linux Mint, new releases change the desktop environments, like this Cinnamon and
    MATE.


    Based on Debian, LMDE is faster than standard Linux Mint, which is released first
    for Mint, before being tested, evaluated, and rolled out to the mainline edition.
    A deeper knowledge of package managers is required, as LMDE is unsuitable for
    Linux Mint newcomers, but is ideal for hardcore community users and Linux veterans.


    The current version of Linux Mint Debian edition is LMDE 2 ''Betsy'', which was
    released in April 2015, LMDE 3 is in the development stage, but does not currently
    have a confirmed release date.


