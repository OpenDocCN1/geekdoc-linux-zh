    iiptables -A FORWARD -i tether0 -s 192.168.13.0/24 -j ACCEPT\niptables -A FORWARD\
    \ -o eth0 -d 192.168.13.0/24 -j DROP\niptables -t nat -A POSTROUTING -o eth0 -j\
    \ MASQUERADE\n```\n\nUse the command sudo iptables -L -n when you're ready to\
    \ check your configuration\n\n# 09 Configure IPTables\n\nTo prevent all traffic\
    \ from going through Tor:\n\n```\niptables -t nat -A PRROUTING -i wlan0 -p tcp\n\
    \   --port 22 -j REDIRECT\niptables -t nat -A PRROUTING -i wlan0 -p udp\n   --port\
    \ 53 -j REDIRECT\niptables -t nat -A PRROUTING -i wlan0 -p tcp\n   --port 53 -j\
    \ REDIRECT\niptables -t nat -A PRROUTING -i wlan0 -p tcp\n   --port 3080 -j REDIRECT\n\
    ```\n\nAbove Make sure you modify DAEMON_CONF=\"\" in both edit and hostapd.\n\
    \n# 07 Apply Configure Point configuration\n\nRun sudo nano /etc/default/hostapd.\
    \ Find the line below\n\n```\n# DAEMON_CONF=\"/etc/hostapd/hostapd.conf\"\n```\n\
    \nEdit it so:\n\nDon't forget to remove the # in front to activate it, or the\
    \ line won't work.\n\nMake your changes permanent:\n\n```\nsudo sh -c \"iptables-save\
    \ > /etc/iptables/rules.v4\"\n```\n\nReboot your Pi when.\n\nwww.linuxuser.com\
