  md: '# Feature Build better servers


    # BUILD A WEB SERVER


    As well as serving files via network shares, a web server allows you to deliver
    content to the browser


    If you have a basic server up and running (or a file server as discussed previously),
    one of the first additional requirements you ask of it is likely to be that it
    functions as a web server.


    From a hardware perspective, this task is also relatively underpowered, although
    if you plan to run a database with a lot of data too, RAM and processor requirements
    may creep up. A server is useful for serving both static content and scripts -
    work through the steps here to get started with a full LAMP (Linux, Apache, MySQL,
    PHP) stack.


    ![](img/90ce260f8df0a9c6339df2d60332346d_25_0.png)


    ![](img/90ce260f8df0a9c6339df2d60332346d_25_1.png)


    # 01 Start with a distribution


    Earlier in this guide, we talked about the benefits of going with a full distribution
    of Linux rather than just using a dedicated file server like FreeNAS. Upgrading
    to LAMP functionality is a great exercise and everything up will be much easier
    if you are already on Ubuntu or similar. Some users get the best of both worlds
    by virtualisation tools such as VMware or Virtualox on their hardware, creating
    virtual servers.


    # 02 Choose and install the web server


    The most popular web servers today are Apache and Nginx. For most users, Apache
    is the one to go for, and installation install apache from your SSH terminal,
    enter your password and type the command apache2ctl to start your web server and
    it will immediately starting serving


    # 03 Serving additional content


    Out of the box, Apache will only serve plain HTML. In order to add your own, you
    will need to upload files to /var/www/html. You will find examples of the contents
    of these files to include in the default page. If you need to change the default
    port, it can be set in /etc/apache2/ports.conf. The main configuration file is
    in /etc/apache2/apache2.conf; however, you can add your own configs using the
    /etc/apache2/available directory and the a2conf command.'
