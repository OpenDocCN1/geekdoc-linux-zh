  md: '# Your source of Linux news & views


    DISTRO


    # Linux Mint 18 KDE is now available


    Linux Mint is bigger and better than ever


    Linux Mint has been one of the distributions in 2016 to really grow its user base.
    Its latest announcement is another step forward. After a successful beta period,
    with only minimal faults noted, a stable version of Linux Mint 18 KDE has been
    made available.

    The KDE edition follows the same pattern as the Cinnamon and MATE releases, but
    with a fantastic new Update Manager, and an array of newly-designed X-Apps. Of
    course, it''s still the choice of the default KDE adopters, as well.


    ![](img/90ce260f8df0a9c6339df2d60332346d_9_0.png)


    Linux Mint 18 is by far the best version of Mint yet


    In terms of requirements, a clean install of Linux Mint 18 requires 10GB of disk
    space. Installation is noted to be simplified to under 2GB of RAM. More than expected,
    it would seem the last requirement is only 100MB of disk space, something that
    stands as standard on most modern computers. The biggest addition to Linux Mint
    18 is the introduction of the Cinnamon desktop environment. It marks a


    major improvement from previous updates, and showcases how amazing Linux Mint
    really.


    Linux Mint 18 will continue to receive vital updates until 2021. All future versions
    of Mint, there''s likely to use the same base, for simple and quick updates. For
    currently running the beta, head across to the Update Manager section and hit
    Refresh to get the new updates and start this fantastic new distro.


    > It marks improvement from previous updates and showcases just how amazing Linux
    Mint really


    # HARDWARE Parrot and Canonical in new drone project


    Drones have become one of the biggest hopes of 2015, and right now. The market
    for drones is constantly expanding, but until now it has little crossover between
    drones and the Linux operating system. Canonical''s new project involves many
    manufacturers. Parrot looks to change all


    Attaching the key could also be simpler, as the tiny-shaped device attaches to
    the top of the drone, relaying data immediately. It''s high time that that more
    developers get on board and creating content — from most drones — will eventually
    be. From a point of view,,


    S.L.A.M. includes on the specifications. There''s an Nvidia Tegra K as its central
    hub for power, with a fish-eye camera reporting a 1500x1500 resolution located
    at the front. It is also equipped with various sensors: accelerometer, magnetometer
    and barometer for data gathering.


    The two teams that have joined forces to create the development kit, will aid
    the creation of autonomy and obstacle avoidance drones and robots. The Parrot
    is powered by Ubuntu and the Ubuntu System, which allows Linux developers to prototype
    designs, 3D mapping and use on-board sensors for data gathering.


    > The tiny-shaped device attaches to the top of the drone, relaying data almost
    immediately


    The best thing of all is that thanks to the HDMI ports, users are actually able
    to hook up your monitor to the development kit and have a full Ubuntu 14.04 computer
    on their drones. For more information, head across www.parrot.com for specific
    pricing information and availability.


