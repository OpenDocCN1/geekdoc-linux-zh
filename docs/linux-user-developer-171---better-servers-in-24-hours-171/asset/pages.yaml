    # # SUSE merges with Hewlett Packard Enterprises for $8.8 billion


    New merger could spark competition with Red Hat and Canonical


    Micro the owner of SUSE, has announced the merger between itself and Hewlett Packard
    Enterprises. The deal, which will be finalized in time for the end of the year,
    is worth around $8.8 billion. HPE shareholders will hold around 61 per cent share
    in the merged company.


    The future of the merger may be a surprise to some, as it seems to be a great
    idea for both parties. HPE has an impressive software platform, and desktop reliant
    support services. SUSE has a strong foothold in the Linux kernel. The merger will
    put SUSE in a much stronger position under the current leaders of Red Hat and
    Canonical, both of which had high expectation in recent years with their overall
    level of growth and input into the Linux kernel as whole.


    Due to increased competition the cash injection expected to help steady SUSE and
