  md: "# Tutorial\n\n# # Turn your Pi into a Tor proxy with Onion Pi\n\n## Turn your\
    \ Raspberry Pi into a wireless access point to access the Anonymous Tor\n\n![](img/90ce260f8df0a9c6339df2d60332346d_77_0.png)\n\
    \n**Nate Drake** is a technology journalist specialising in cyber security. He\
    \ writes tutorials for various magazines and his ambition is to be able to afford\
    \ his Raspberry Pi rather than his friend's.\n\n![](img/90ce260f8df0a9c6339df2d60332346d_77_1.png)\n\
    \n```\niptables-persistent\n\nCurrentptime rules can be saved to the configuration\
    \ file\n/etc/iptables/rules.v4. These rules will be loaded automatically\non startup.\n\
    \nRules are only saved automatically during installation. If you want to save\
    \ the rules\nfile up-to-date, run `iptables-save` for instruction on keeping the\
    \ rules\n```\n\nAbove iptables-persistent will ask if you want to save changes.\
    \ Press Return to try again.\n\n#  02 Install essential software\n\nRun the command\
    \ `apt-get update` then `apt-get install isc-dhcp-server iptables` to install\
    \ the necessary software. When iptables-persistent you'll be asked if you want\
    \ to save the current configuration. Select **Yes** for both them.\n\nIn this\
    \ age of ubiquitous surveillance, it's harder than ever to stop hackers, advertisers\
    \ and government surveillance from monitoring your movements. If you choose to\
    \ connect through Tor, your connection is encrypted and passed through a series\
    \ of proxies known as 'onion routing'. This slows down your connection, but it\
    \ increases your privacy, making it extremely difficult to track your location.\n\
    \n#  03 Configure DHCP server\n\nRun `nano /etc/dhcpd.conf`. Find the line beginning\
    \ `domain-name` and `interface eth0` at the start of each. Remove the `#` from\
    \ the line/authoritative.\n\nFollow the steps in this tutorial to turn your Pi\
    \ into a wireless Access Point (AP) named Onion_Pi. By connecting to Onion_Pi\
    \ you can use the Tor network. When you're done, use a website like whatismyipaddress.com\
    \ to see if your location has changed.\n\nAbove Paste this at the end of the file.\
    \ Press Ctrl+X, Y, and then return to exit the editor.\n\n```\nsubnet 192.168.1.0\
    \ netmask 255.255.255.0 {\n  range 192.168.1.10 192.168.1.200;\n  option router\
    \ 192.168.1.42;\n  option default-lease-time 600;\n  option domain-name \"local\"\
    ;\n}\n```\n\n# How does\nkeep you\nsafe?\n\nThe Tor network is a group of servers\
    \ (relays) operated by volunteers. When you start on the Pi, it will create encrypted\
    \ circuits. Each relay only knows the last data point from where it came from\
    \ and where it is going. It is extremely difficult to trace you back to your location.\
    \ Back to you, Tor changes every few minutes, even harder to find your identity.\n\
    \n![](img/90ce260f8df0a9c6339df2d60332346d_77_2.png)\n\n#  04 Edit interfaces\n\
    \nRun `nano /etc/network/interfaces`. Scroll down to the INTERFACES section and\
    \ insert `interface eth0 inet dhcp`\n\nAbove Make sure \"wan0\" is inside the\
    \ speech marks\n\nRun the commands `sudo systemctl restart networking` and `sudo\
    \ systemctl restart isc-dhcp-server` to make sure your changes are start on boot.\n\
    \nFor 'wlan0': don't worry if your IP address is different. We will change it\n\
    \n#  01 Connect to Pi and interface is detected\n\nAttach your Pi to the Ethernet\
    \ cable, then either other interface on the Pi or connect to it. Then run the\
    \ command `ifconfig -a`. You should see the *wlan0* which shows that the module\
    \ is up running.\n\n#  05 Set static IP\n\nRun `nano /etc/network/interfaces`.\
    \ If you see the\n\n78"
