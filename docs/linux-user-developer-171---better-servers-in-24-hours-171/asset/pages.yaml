    # # Pros


    Low power, surprisingly capable, plenty of GPIO potential, and the PocketCHIP
    design is a fantastic throwback to a bygone era.


    # # Cons


    Low power CPU, unfinished software, and the PocketCHIP keyboard is quite difficult
    for anything barring very short sessions.


    Designed as an expansion box for the CHIP, this could not last in the ill-filled
    Sinclair S-J joystick of the 1980s. The keyboard has everything in place. The
    front is a low-resolution touch-screen on the top and a QWERTY keyboard underneath.


    The design is not what it seems. Running without costs, NextCHIP has designed
    a device for the 1980s: limited machine. The keyboard is printed on plastic PSBs
    and has ''clicky'' domes of metal. A plastic laminate holds everything in, which
    completes the circuit and registers as a key.


    Such a design feels like a joystick as you laboriously type with your thumbs on
    the PocketCHIP. Worse, the fate of Sinclair S-J reveals the future of the PocketCHIP:
    over the metal domes deform and crack, resulting in dissatisfaction and disappointment.


    The keyboard is by far the biggest drawback of the PocketChip, which is a marvelous
    device. Running a different operating system like the plain CHIP, though Debian-based,
    it offers a small selection of software pre-loaded: a music synthesizer, a text
    editor, a terminal simulator file. The latter is the jewel in the crown: a simulated
    8-bit games console, for which you type titles or create them directly on the
    device.


    This aside, though for both devices feels unfinished. The PocketCHIP for not actually
    implemented – such as PRoom and ScrumMVM – can only use the Bluetooth if configured


    GPIO access to programming languages through third-party libraries is written
    in Python constantly from 300Hz to 2.2KHz. CPU performance, meanwhile, is better
    with a Sysbench score of 2.5 seconds. The PocketCHIP holds its own in all but
    multi-threaded use cases.


    # # Summary


    With a small selection of features on its 4GB storage module and responsive it
    is a worthy alternative to the Raspberry Pi. The PocketCHIP shines in all areas
    but around unfinished software and hardware it remains reminiscent of Sir Clive
    Sinclair at its very worst.


    ![](img/90ce260f8df0a9c6339df2d60332346d_88_2.png)


    Gareth Halifax'
