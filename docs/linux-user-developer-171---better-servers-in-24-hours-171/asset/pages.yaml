    # 07 Use phpMyAdmin for MySQL admin


    You are unless something of an SQL guru, managing MySQL from the command line
    can be difficult. A web-based management is phpMyAdmin. There are two options
    to install: the apt-get option to include it with distro. There is a number of
    versions besides the main release, so a better option is to download the latest
    release and extract it to a subdirectory of /var/www/html. Then install on a dedicated
    host if you choose (Step 6). To create a config directory in your phpMyAdmin location,
    then load http://localhost/phpmyadmin/setup.


    # 04 Install PHP for scripting


    Serving content using Apache is useful, but the real power comes when Apache is
    combined with a scripting language such as PHP. To install PHP, use the command
    sudo apt-get install php, which will automatically select the appropriate packages
    for the CLI version of PHP, and you might need to install a small number of addition
    like apache2 restart command to enable support. To test, create an info file (named
    info.php) and then open it in your browser to see the php information.


    ![](img/90ce260f8df0a9c6339df2d60332346d_26_1.png)


    # apt-get phpMyAdmin


    ```

    <?php phpinfo();

    ```


    # 05 Apache Modules - WebDAV


    Aside from PHP, other Apache modules are available. The WebDAV module allows you
    to serve content and is pre-installed in the base package. To enable the module
    and restart Apache use the command sudo aenmod dav2 and sudo service apache2 restart.
    The WebDAV server will be served by the root directory which must have the DAV
    on it. Unauthenticated WebDAV will only read access to files. Users can be granted
    access using HTTP Authentication.


    ![](img/90ce260f8df0a9c6339df2d60332346d_26_2.png)


    # 08 FTP folder


    Instead of having your web server content in one directory, Apache supports virtual
    hosts. This allows you to serve multiple contents from the same machine, but by
    different domain names. If you have multiple websites, to configure virtual hosts,
    you should add them in the /etc/apache2/sites-available and enable the virtual
    host for each one.


    # 09 Manage MySQL


    Now that you have installed it, it''s time to set up some basic antivirus and
    detection tools. The latter is particularly important if you are serving sensitive
    data.


    # 06 Install the MySQL database


    ![](img/90ce260f8df0a9c6339df2d60332346d_26_3.png)


    To complete the LAMP stack, and particularly if you want to install third-party
    software on your MySQL server, the MySQL installation will be very straightforward
    using the command sudo apt-get install mysql-server libapache2-mod-mysql. This
    installs the server, together with phpMyAdmin and PHP support. During installation
    you will be prompted for a password for root database access - this is the password
    for your main server root password! Complete the


    # ClamAV


    ClamAV is a well-respected piece of software that is excellent for malware detection.'
