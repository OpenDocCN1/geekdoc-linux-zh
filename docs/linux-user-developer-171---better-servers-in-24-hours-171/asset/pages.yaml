    # # The Ubuntu edition


    The Ubuntu-based Linux Mint is the most popular Linux desktop distribution available.
    Sitting at the top of the list consistently for over half a decade, it is now
    slick, easy to use, and should run well on most machines.


    And if you prefer, you have a choice of desktop environments to overcome any performance
    issues! What not to to it?


    Linux Mint follows Ubuntu 16.04 LTS (long term support), and as such is supported
    for five years, until 2021. Like Ubuntu, Linux Mint comes in various versions,
    such as XFCE, KDE and MATE desktop editions.


    This mainstream version of Linux Mint is where the majority of users can be found,
    which means that it is far more reliable than the Debian version. On the other
    hand, you do not have to wait for updates and the operating system to be rolled


    out, which can be a pain if the tools you''re using have a problem, or if you
    find the OS has a weakness that needs patching.


    Using the Ubuntu edition of Linux Mint also allows you to get access to some of
    the applications from Ubuntu, such as GRUB or Xchat; however, these have been
    developed specifically for compatibility (and perhaps extras).


    The Debian edition of Linux Mint ships with the Debian flavour, making it particular
    favourite for equipment manufacturers. This means that if you buy a Linux Mint
    PC or laptop, you will be using an operating system built using an LTS release.


    But Linux Mint remain tied to Ubuntu? For now, it seems so, but there is a good
    chance that Linux Mint might abandon Ubuntu one day, in the favour of the Linux
    Mint Debian Edition.'
