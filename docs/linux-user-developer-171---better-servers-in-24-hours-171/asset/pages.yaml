    # # Prevent SSH attacks


    Keep your SSH locked down with techniques to ensure you keep your data to yourself,
    even from remote access


    One of the biggest problems in the world of computing is the presence of significant
    others: whenever you are involved in some kind of long-running or interesting
    task, you can be sure that someone will arrive to distract you.


    One way to adapt involves such technologies. While VNC can mirror the most graphical
    access system exists, then you can use advanced window managers that work on workstations
    and even some equipment. The methods of SSH and Telnet are simple; they allow
    users to take remote control over workstations or servers via a terminal window.


    The difference between SSH and Telnet is that the latter is a plain-text protocol;
    if an attacker sniffs the packages being transmitted, he can read the interaction.
    SSH changes this by implementing fairly simple encryption schemes.


    In principle, setting up SSH is easy. Sadly, hordes of miscreants are waiting
    to take over poorly secured connected to public networks. Do not fear; however:
    if you follow the steps outlined in this article,


    here, should also transfer to computers such as the Raspberry Pi or Orange Pi
    without significant effort. On Ubuntu 14.04, starting with SSH requires the configuration
    of the server package. A simple window manager will handle the following command:


    ```

    sudo apt-get install openssh-server

    ```


    After installing, your configuration file contains two files: sshd_config, which
    handles the server completely, and ssh_config, which is responsible for the behaviour
    of the client that connects to other servers.


    # ### How does attack take over?


    Often an exploit bot tries to gain access to abundant resources. To do this, they
    employ a technique similar to the wardrying strategies in the ancient days of
    telephone hacking; port scanners such as nmap are up and probe to find if there
    are any listeners. In the next step, a set of common ports is scanned to find
    potentially exploitable services.


    One way to make such an attack more difficult – and be aware that this is not
