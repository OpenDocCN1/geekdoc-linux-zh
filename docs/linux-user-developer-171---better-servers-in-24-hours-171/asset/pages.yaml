    # # How Mint grew


    ![](img/90ce260f8df0a9c6339df2d60332346d_53_0.png)


    Back in the year 2006, the reclusive Clement Lefebvre finally released the first
    version of Mint (''Ada''), ostensibly a project in Ubuntu to achieve ''leverage''.


    Linux Mint''s team offered a working alternative to the disliked (and thus desired)
    Unity, retaining a functional, mouse-driven desktop environment. Despite the popularity
    of smartphones and tablets, no one really wanted a touchscreen, so the MATE and
    Cinnamon extensions were born. Built on GNOME 3, MATE was the first new Linux
    distribution to support Ubuntu 12.04 ''Lucy Quat''. It was later followed by Cinnamon,
    which is the default choice to this day.


    With Mint initially created for its developer''s website, where Lefebvre regularly
    distributed and wrote about making tweaks to an OS, Linux Mint was an actual project
    he experimented with. It''s only after Mint 2.2 ''the Banana'' that things got
    serious.


    The success attracted more people to work alongside the Linux distribution, with
    the ever-growing Linux Mint community. Jamie Birse and Kevin Weaver had joined
    the team in the Mint project (although Lefebvre had moved to Pepper Mint OS).
    Frederic Gauset had played a part, maintaining the momentum.


