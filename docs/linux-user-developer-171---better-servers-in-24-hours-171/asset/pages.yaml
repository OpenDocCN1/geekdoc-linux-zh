  md: '# Don''t install an AMD driver


    If your PC or laptop has an AMD card, or you added your own, installing a closed
    source, proprietary driver is not an option. Use free source options as the AMD
    Catalyst drivers are not compatible. Use open source or radon drivers for their
    cards, and Linux Mint. Note that if you opted to upgrade to an Nvidia card, you''ll
    need to install the proprietary drivers.


    ![](img/90ce260f8df0a9c6339df2d60332346d_62_0.png)


    # 05 Install the apps you want


    If you''re looking for a specific app that you included in previous versions of
    Linux Mint, you''ll need to head to the Software Manager. Here, you can find and
    install it quickly. To save time, the applications you need pre-install in previous
    versions of Mint can be found in the Software Manager. You''ll find tools diverse
    and useful as Skype, Scribus, and Wine - the open source utilities for Linux users


    # 06 Do you really need additional apps?


    This might seem a strange question, but it''s worth considering. You may not actually
    need proprietary apps that are preinstalled in versions of Mint, as there are
    plenty of free applications available. A browser will be preinstalled, for instance,
    along with office software. With these tools you can perform almost everything
    online if necessary. Online calendar and contacts are also available via various
    sources (such as Google)


    ![](img/90ce260f8df0a9c6339df2d60332346d_62_1.png)


    # Block-FOSS apps


    On the other hand, you might be very happy with an OS that cannot install FOSS
    software. You can prevent proprietary software from being installed at all. By
    starting up a menu and making a copy of the official package-repositories in the
    home directory:


    | Categories | Search Results |

    | --- | --- |

    | Postgresql-9.5-pgpq | Tools for postgresql replication, lodiste and pgq |

    | Python-postgresql | Python framework for tools for postgresql replication |

    | Python-postgresql | Python framework for tools for postgresql replication |

    | Skytql2-ticker | Tools for postgresql replication, lodiste and pgq |

    | Skytql3-waitmgr | Tools for postgresql replication and failure |


    ```

    sudo cp /etc/apt/sources.list.d/official-package-repositories.list /home

    ```


    Next, edit the file in nano:


    ```

    sudo nano /etc/apt/sources.list.d/official-package-repositories.list

    ```


    Here, edit each line to remove all of ''restricted'' and ''multiverse''. With
    this, you should also delete the partner


    ```

    # deb http://archive.canonical.ubuntu/ xenial

    ```


    Hit Ctrl+X to save and exit. Apps like Skype and Scribus will no longer be visible.


    ![](img/90ce260f8df0a9c6339df2d60332346d_62_2.png)


    +   - No ongoing actions'
