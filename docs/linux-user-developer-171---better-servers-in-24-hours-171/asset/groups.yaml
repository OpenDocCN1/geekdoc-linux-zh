    \ attempt to log in multiple times. For multiple systems, this can be done with\
    \ a daemon which is commonly used. It can be deployed using apt-get install failban.\n\
    \n## limited scope\n\nPreventing brute-force attacks is a game; the more servers\
    \ you protect, the more results you get. Thus, the amount of attacks performed\
    \ is limited and usually centered on common username and password.\n\nAs far as\
