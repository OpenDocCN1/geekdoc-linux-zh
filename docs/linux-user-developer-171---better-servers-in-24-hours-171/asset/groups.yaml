    # Salix 14.2 ''Xfce Edition''


    ## Can Salix make Slackware relevant?

    When it comes to choosing your next distribution, anything based on Slackware
    falls out of favour. That''s not saying that Slackware is bad by any means, but
    it stands to improve. One of the main Slackware-based distributions that have
    held up well over the years is Salix, generally considered the premium choice
    for all of those seeking a friendly slice of Slackware on their machine. Its latest
    edition (14.2) is actually based around highly customised and extremely lightweight
    Xfce environment. One of the first changes that will instantly become noticeable
    to new and seasoned Slackware users is the integration of a new menu. Salix can
    now boot and install in a variety of languages, and we found no slowdown throughout
    this new boot process. When you reach the desktop for the first time, your eyes
    are in for a treat. The Xfce integration has helped the way Salix boots and functions,
    making general usage much quicker, sharper and unlike any of its Slackware-based
    competitors.


    Looking past its attractive exterior, Salix now has built-in GUI tools and acts
    as a graphical manager for its systems. It is hard to compare to other graphical
    managers and it''s not unfair when used in place of a less-capable manager. Equality
    is as important when it comes to selecting a memory repository.


    As you expect, the bundled software Salix 14.2 has been chosen with looks and
    key functionality in mind. Firefox has been the default browser, while the fantastic
    NetworkManager handles all network configurations. The biggest inclusion, in our
    eyes is the use of PulseAudio. It''s proven to be one of the best apps available
    to Linux computers when it comes to bringing the connection between hardware and
    software. It does well when using Salix. Of course, all the usual suspects are
    included, such as Gimp, LibreOffice and Zim. A little disappoint is the lack of
    updates in some of the packages; it still remains a good choice for general purpose,
    but updates between the versions of 14.1 and 14.2 bring some changes that seem
    strange to do in terms of Salix''s in-home programs, but it will keep up for updates
    in later versions.


    Slackware remains a favourite for those with a rich history in the OS. What Salix
    shows is that there are new kids on the block. The 14.2 version goes far beyond
    a feast, and instead shows some super new repository and a decent selection of
    great GUI tools. If you don''t think Salix is for you, you may want to take Salix
    out for a test. Interested users can head across to salix.org for all of your
    necessary downloads.


    - Oliver Hilli


    ### Pros

    The immersion of the Xfce desktop environment has done wonders for home users.
    For months this time, you''ll be hard to find any faults with the look and what''s
    available generally good quality.


    ### Cons

    Though the bundled software is good, it''s a bit disappointing in the lack of
    updates from the many repositories, it feels a little out of place with the distro
    at times.


    ### Summary

    Not only is Salix a great entry point into Slackware, it''s one of the best distros
    to test this year.


