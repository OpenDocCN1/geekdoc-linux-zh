- md: "\n# Tutorial Concurrent programming\n\n# Concurrent Programming in Go – Part\
    \ 2\n\nMihalis Tsoukalos\nformer LINUX administrator, a Go programmer & a mathematician.\
    \ He has been writing code since 1993. You can find him at @mactsoukalos (Twitter)\
    \ or mtsoukalos.com\n\n## Resources\n- A text editor like Emacs or vi\n- The Go\
    \ compiler\n\n## Learn more about advanced concurrent programming techniques in\
    \ Go\n\nThis tutorial will continue the discussion of concurrent programming in\
    \ Go. First, you will learn about the Go scheduler and shared memory. Then, as\
    \ promised in the previous tutorial, the wc utility will be developed. It will\
    \ then talk about buffered channels, the importance of the GOMAXPROCS environment\
    \ variable, and how Go programs use shared variables, which is the traditional\
    \ way of exchanging data in concurrent programs, as well as the use of mutexes.\n\
    \nIn the next part, we will talk about scheduling in Go, other interesting things,\
    \ like keepalive:\n\n### What you should already know\nAs this is the second part,\
    \ you already know many things from the first part, including how to create a\
    \ goroutine and how to use a channel. You should also be familiar with the select\
    \ statement and approach to concurrency with shared memory and variables.\n\n\
