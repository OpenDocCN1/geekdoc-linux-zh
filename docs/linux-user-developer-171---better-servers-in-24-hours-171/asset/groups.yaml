    \ would be comfortable enough to connect to external USB drives. It was also important\
    \ that the Pi is a mini-console that makes it much more useful. Using a broken\
    \ PSP200 was the perfect fit.\n\nAnd it was done without any community involvement.\
    \ I worked away for two hours after every day for two months to make a playable\
    \ handheld. Everything there wasn't a perfect process. The design was made up\
    \ as I went along and it was re-engineered every few days. I learned that everyone\
    \ else had the same 'nest of a first project' but less organised. The second PSP2\
    \ is almost identical in functionality, but it is more clean and learned. From\
