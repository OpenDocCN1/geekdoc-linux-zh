    # ## Proprietary apps can be found in the package manager. Why not choose your
    own software?


    After installing Linux Mint 18, you''ll need to look for some additional apps.
    Not long ago, some of these would have been included, proprietary apps from developers
    themselves. But unless it''s a browser, email client, or functional office application
    you actually need, many don''t want the pre-installed apps, and Linux Mint 18
    is enough. Having the proprietary apps has led to a small problem: users will
    now have to search for


    regardless, beyond the bundled browser and various office tools. While on the
    one hand this allows for the installation of all applications, it also has a downside:
    what if a long-term Mint user wanted to use the proprietary apps? Whether you
    want to avoid proprietary software in Mint or if you actually want to use it,
    options are available. And if you need to get some codecs so you can enjoy media
    files, this is also possible.


    ![](img/90ce260f8df0a9c6339df2d60332346d_61_0.png)


    01 Getting the right codecs

    Do you need codecs? Previous versions of Linux Mint had audio and video codecs
    built into the distro. With Linux Mint 18, they are omitted in favor of manual
    installation. However, however, there is little to worry about. If you need them,
    during installation, you''ll have the option to install the codecs. It''s as easy
    to do, too. Either click on a button on the Welcome screen, or if you miss that,
    go to Menu/Sound and Install Multimedia Codecs.


    02 Install proprietary hardware drivers

    Linux Mint also ships without graphic card drivers installed, needing installation
    on CPU. This is because drivers are always changing, so you need to find the right
    drivers to suit your graphics cards. It isn''t just graphics cards that are limited
    in this way; sometimes a Linux Mint driver might not be found. For graphics cards,
    however, you''ll need to find a source/proprietary driver if you have an Nvidia
    card. Drivers are slightly different for AMD cards.


    03 Install an Nvidia card

    To set up an Nvidia card with Linux Mint, go to Proprietary Driver Manager. You''ll
    need to wait as all hardware is detected and the correct drivers identified. Once
    identified, select the drivers (which class) and proceed to install them. Note
    that several will be displayed. Choose the newest, and only one if the initial
    choice fails to work. With a graphics card driver selected, restart Mint to apply
    the changes.'
