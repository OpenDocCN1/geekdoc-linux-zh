    \ not affect your CPU usage, an unsecured server is a powerful bot on the internet!\n\
    \n![](img/90ce260f8df0a9c6339df2d6033246d_0.png)\n\nAnother way to limit the attacker's\
    \ access is easily useful when the IP of remote users is known in advance. In\
    \ that case, the SSH server can be limited to access connections via variety of\
