    \ yes\n```\n\n```\n[ssh]\nenabled = true\nfilter = sshd\npath = /var/log/auth.log\n\
    maxretry = 6\n```\n\nSetting PermitRootLogin to allow root logins, it completely\
    \ takes the root account out of the picture and is the most sensitive setting\
