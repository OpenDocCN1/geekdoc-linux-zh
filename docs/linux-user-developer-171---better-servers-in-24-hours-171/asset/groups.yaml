    # 05 Install and use your browser in a sandbox environment


    Setting up and using a sandbox is simple. In the Terminal, use the apt-get command
    to install firejail sandbox.


    +   - apt-get install firejail


    Once this is done, you can launch Firefox


    +   - firejail firefox


    But you don''t have to remember to launch the browser in future to keep things
    secure. For Firefox to launch in future, right-click the Firefox icon, select
    EditCommand and rewrite


    +   - firejail firefox


    Confirm the sandbox is running


    +   - firejail --tree


    # 04 Avoid deskids and applets


    With add-ons – which slow your browser down with each one you install – you should
    take care so-called deskits. In theory they can improve performance, or beautify
    your environment. This doesn''t mean that you should use them,


    Any live tool you use increases the resources used by an important or system element
    – in this case your desktop – problem. System performance might degrade, but equally,
    if you don''t know who programmed the tool, you cannot trust it to behave as.


    ![](img/90ce260f8df0a9c6339df2d60332346d_60_0.png)


    # 06 Use firejail more wisely


    It''s a good idea to use firejail whenever you can. Using an email client, or
    a different browser to Firefox? Perhaps you''re running a current client? Which
    case, firejail will find that supports more than you need. For full details of
    what to do, refer to /etc/firejail. This is important because if a specific profile
    for the app in question exists, it will guarantee better performance than the
    generic profile.


    # 08 Take care adding sources


    At some point you will be prompted to add sources to Update Manager in order to
    add available software in the repositories. This can prove a security risk, especially
    if you are setting up a new repository. One such is Unstable packages (repo).
    Although disabled by default, you should ensure that in Administration>Software
    Manager>Edit>Software sources, where you should confirm that the Update packages
    (removed) option remains unchecked.


    # 07 Don''t misuse sudo


    This is one of tips that cannot be overstated. Basically, if a command does not
    require you to switch to the super user, don''t do it. For changing contents of
    system files or apps is fine. However, if you''re running applications with sudo,
    you''re in trouble. It may result at some point in incorrect permissions on files
    that you have access to. It is for this reason that it is unnecessary when running
    a standard app.


    # 09 Be cautious with PPAs and DEBS


    Similarly, to what we mentioned above. Third party repositories and DEB installers
    can cause a security risk. Under no circumstances should you install unveiled
    software on your computer if you want to use it. This software should only be
    installed when you are testing or evaluating a non-alternative, or when you need
    it. Meanwhile, the DEB installer files that can be downloaded and installed also
    pose a significant risk. Use the Software Manager to install new apps, not browser.


