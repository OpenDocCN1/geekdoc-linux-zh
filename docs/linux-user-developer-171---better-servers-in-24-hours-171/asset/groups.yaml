    ## 树莓派销量突破 1000 万


    这款改变格局的微型电脑


    ![](img/90ce260f8df0a9c6339df2d60332346d_7_0.png)


    全球已售出超过 1000 万台树莓派


    在计算行业，最好的事情之一是事物正以惊人的速度发展。在过去的几年里，整个计算格局发生了巨大的变化，而未来仍是不确定的。这种发展的未来是树莓派，一种价格亲民的电脑。当其他产品陷入挣扎时，它提供了持续的改进和具有吸引力的价格。在过去的几周内，树莓派团队发现树莓派销量已超过了惊人的
    1000 万台。虽然大部分初始销量是由树莓派爱好者完成的，但它实际上被应用于各地的机器人教学、医院以及物联网的发展。在官方公告中，树莓派创始人 Eben Upton
    对这种强大的成就感非常感动。树莓派基金宣布了一个全新的树莓派启动套件。正如名称所示，它包含了构建您的第一台电脑所需的基础，比您想象的要简单，带有键盘和鼠标。孩子们能够构建并维护树莓派
    3 Model B+，这是一个四核处理器服务器，带有 8GB SD 卡，非常便宜。“开源”软件，所有用户还将获得树莓派基金特别年度。树莓派启动套件现售价 39
    英镑。访问 raspberry.org 查看库存和货币。


    > 树莓派基金发现树莓派销量已超过惊人的 1000 万台


