    # Welcome

    to issue 171 of Linux User & Developer


    # This issue


    - Better servers in 24 hours

    - Remote admin on Ubuntu

    - Open source AI

    - Prevent SSH attacks


    Welcome to the latest issue of Linux User & Developer, the UK''s favourite Linux
    and open source magazine. Servers were once the sole province of corporations
    and other organisations. Now you''re much more likely to see one in someone''s
    home – maybe running their own business and it''s dealing with essential files
    and folders, web access and accounts, or maybe they''re using it to serve files
    around their home network. If you want to get in the action, then we''ll help
    by explaining exactly what you need to upgrade an existing home or SME, or to
    build from scratch.


    Of course, once you''ve got your server up running, it''s a good idea to secure
    it. But you''ll need to make sure it''s secure. Check out the tutorial on p38
    to find out about remote administration using SSH, and the p14 on how to prevent
    SSH attacks and keep your data secure. We have guides to Bash scripting, NET and
    programming in Go to help you develop your skills. On p52, we have an in-depth
    look at Linux Mint, a breakdown of the various versions and how they compare,
    plus advice and tips to configure it to your liking and to make sure it''s locked
    up tight. Enjoy the issue!


    April Madden, Editor


