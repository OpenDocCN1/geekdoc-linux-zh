- md: "\n# My Pi project\n\n# PSPI V2\n\nWant a cost-effective way to improve your\
    \ gaming experience? Adam Seamer's PSP2 project will be perfect for you.\n\n![](img/90ce260f8df0a9c6339df2d60332346d_68_0.png)\n\
    \n- Where did the idea of the PSP project originally come from?\nGrew up playing\
