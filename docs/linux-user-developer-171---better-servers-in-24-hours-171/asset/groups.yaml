    ## Enabling client access


    It''s no use a file server if you can''t connect to the files! That means you
    need to set up the file sharing protocols on the server so that clients can connect.
    For all platforms, including OS X, installing and configuring SMB (Samba) gives
    the access that users need. Remember that as administrator, you will still be
    able to send and receive files via SFTP, for a greater level of control.


    To install Samba, use `apt-get install samba samba-common` to install the required
