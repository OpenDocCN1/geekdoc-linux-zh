    CHIP 是一款基于全志 R8 系统级芯片 (SoC) 处理器构建的超微型控制器。它专为廉价 Linux 设计，运行着定制的 Debian Linux 版本，但它没有用于存储扩展的微-SD
    卡槽；


    与树莓派相比，CHIP 有一些优势：它拥有 40 针 GPIO 引脚；存储作为标准配置内置；电池为嵌入式应用中的板卡提供了方便的电源方式；板载无线电提供了
    802.11b/g/n Wi-Fi 和蓝牙 4.0 连接。


    虽然全尺寸 USB 2.0 端口可以解决这一缺点，但没有网线端口，也没有数字视频输出端口；相反，3.5mm 接口提供了 TRRS 连接，可将模拟音频/视频复合到显示器、VGA
    或 HDMI。


    实际上，这台廉价电脑的价格在 14 到 24 美元之间。随着树莓派推出（英国售价为 4 英镑，国际售价为 5 美元），NextThingCo 需要一些特别的产品进入
