    to the user list file `/etc/samba/users` use the `smbpasswd` command to set the
    users'' passwords and finally, after ensuring the usernames are in the `smbusers`
    file, `service smbd restart` will pick the changes. Users should now be able to
    map to the directories that are also defined in the `smb.conf` file.


    ## Feature Build better servers


    ## BUILD A WEB SERVER


    As well as serving files via network shares, a web server allows you to deliver
    content to the browser. If you have a basic server up and running (or a file server
    as discussed previously), one of the first additional requirements you ask of
    it is likely to be that it functions as a web server.


    From a hardware perspective, this task is also relatively underpowered, although
    if you plan to run a database with a lot of data too, RAM and processor requirements
    may creep up. A server is useful for serving both static content and scripts -
    work through the steps here to get started with a full LAMP (Linux, Apache, MySQL,
    PHP) stack.


    ![](img/90ce260f8df0a9c6339df2d60332346d_25_0.png)

    ![](img/90ce260f8df0a9c6339df2d60332346d_25_1.png)


    ## 01 Start with a distribution


    Earlier in this guide, we talked about the benefits of going with a full distribution
    of Linux rather than just using a dedicated file server like FreeNAS. Upgrading
    to LAMP functionality is a great exercise and everything up will be much easier
    if you are already on Ubuntu or similar. Some users get the best of both worlds
    by virtualization tools such as VMware or Virtualox on their hardware, creating
    virtual servers.


    ## 02 Choose and install the web server


    The most popular web servers today are Apache and Nginx. For most users, Apache
    is the one to go for, and installation `apt install apache2` from your SSH terminal,
    enter your password and type the command `apache2ctl start` to start your web
    server and it will immediately starting serving.


    ## 03 Serving additional content


    Out of the box, Apache will only serve plain HTML. In order to add your own, you
    will need to upload files to `/var/www/html`. You will find examples of the contents
    of these files to include in the default page. If you need to change the default
    port, it can be set in `/etc/apache2/ports.conf`. The main configuration file
    is in `/etc/apache2/apache2.conf`; however, you can add your own configs using
    the `/etc/apache2/available` directory and the `a2enconf` command.


    ## 04 Install PHP


    To make your web pages dynamic, you will need to install PHP. Use `apt-get install
    php libapache2-mod-php` to install the necessary packages.


    ![](img/90ce260f8df0a9c6339df2d60332346d_26_0)


    ## 07 Use phpMyAdmin for MySQL admin


    Unless you are some bit of an SQL guru, managing MySQL from the command line can
    be difficult. A web-based management is phpMyAdmin. There are many ways to install
    it, but the easiest is `apt-get install phpmyadmin`. During installation, you
    will be prompted for a password for root database access - this is the password
    for your main server root.


    ## 04 Install PHP


    To make your web pages dynamic, you will need to install PHP. Use `apt-get install
    php libapache2-mod-php` to install the necessary packages. To test that PHP is
    working, create a file named `info.php` in `/var/www/html/` with the following
    content:


    ```php

    <?php

    phpinfo();

    ?>

    ```

    Then navigate to your server''s IP address/info.php in your browser to see the
    PHP configuration. Once you''ve confirmed it works, be sure to delete the file
    for security reasons.


    ```php

    <?php

    phpinfo();

    ?>

    ```

    ![](img/90ce260f8df0a9c6339df2d60332346d_26_1)


    ## 05 Apache Modules - WebDAV


    Aside from PHP, other Apache modules are available. The WebDAV module allows you
    to manage files. To enable it, use `a2enmod dav` and `service apache2 restart`.


    ## 08 FTP folder


    Instead of having your web server in one directory, Apache supports virtual hosts.
    This allows you to serve multiple websites from the same machine. To configure
    virtual hosts, you should add them in `/etc/apache2/sites-available` and `a2ensite`
    each one.


    ## 09 Manage MySQL


    Now that you have installed it, it''s time to set up some basic antivirus and
    detection tools. The latter is particularly important if you are serving sensitive
    data.


    ## 06 Install the MySQL database


    MySQL with the `sudo mysql_install_db` command and optionally use the `sudo /usr/bin/mysql_server_installation`
    to set the most important options.


    ![](img/90ce260f8df0a9c6339df2d60332346d_26_2)


    ## ClamAV


    ClamAV is a well-respected piece of software that is excellent for malware detection.

