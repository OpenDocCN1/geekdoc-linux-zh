    \n# 使用 Onion Pi 将你的 Pi 变成 Tor 代理\n\n## 将树莓派变成无线访问点以访问匿名 Tor\n\n![](img/90ce260f8df0a9c6339df2d60332346d_77_0.png)\n\
    \n**Nate Drake** 是一位专攻网络安全的科技记者。他为各种杂志编写教程，他的志心是能够负担得起比他的朋友更好的树莓派。\n\n![](img/90ce260f8df0a9c6339df2d60332346d_77_1.png)\n\
    \n```\niptables-persistent\n\n当前规则可以保存到配置文件\n/etc/iptables/rules.v4。这些规则将在启动时自动加载。\n\
    如果你想保存规则，在安装期间运行 `iptables-save`\n```\niptables-persistent 会询问你是否保存更改。\n\n# 02\
    \ 安装必要软件\n\n运行命令 `apt-get update` 然后 `apt-get install isc-dhcp-server iptables`\
    \ 来安装必要的软件。iptables-persistent 会询问你是否保存，两者都选择 **Yes**。在无处不在的监控时代，这比任何时候都要防止广告商和政府监控你的移动。如果你通过\
    \ Tor 连接，你的连接是加密的，并通过一系列名为 'onion' 的代理。这减慢了你的连接，但增加了你的隐私。\n\n# 03 配置 DHCP 服务器\n\
    \n运行 `nano /etc/dhcpd.conf`。找到开头的 `domain-name` 和 `interface eth0`。去掉每行的 `#`。按照本教程的步骤将你的\
    \ Pi 变成名为 Onion_Pi 的无线访问点 (AP)。完成后，使用 whatismyip.com 等网站查看你的位置是否已更改。在文件末尾粘贴此。按\
    \ Ctrl+X，Y 然后返回编辑器。\n\n```\nsubnet 192.168.1.0 mask 255.255.255.0 {\n  range 192.168.1.10\
    \ 192.168.1.200;\n  option router 192.168.1.42;\n  option default-lease-time 600;\n\
    \  option domain-name \"local\";\n}\n```\n\nTor 如何工作？\n\nTor 网络是由志愿者运行的服务器（节点）组成的。当你启动\
    \ Pi 时，它会创建电路。每个节点只知道哪里以及去哪里。Tor 每几分钟变换一次身份，追踪你的位置变得极其困难。\n\n![](img/90ce260f8df0a9c6339df2d60332346d_77_2.png)\n\
    \n# 04 编辑 interfaces\n\n运行 `nano /etc/interfaces`。滚动到 INTERFACES 部分并插入 `interface\
    \ eth0 dhcp`。确保 \"wan0\" 在标记内。运行命令 `sudo systemctl restart networking` 和 `sudo\
    \ systemctl restart isc-dhcp-server` 让你的更改在启动时生效。如果你的 IP 地址不同不要担心。\n\n# 01 连接到\
    \ Pi\n\n将你的 Pi 连接到网线，然后开启接口或连接。运行命令 `ifconfig -a`。你应该看到 *wlan0* 显示模块已启用。\n\n#\
    \ 05 设置静态 IP\n\n运行 `nano /etc/network/interfaces`。找到 `allow-hotspot wlan0` 并在开头添加\
    \ `#` 将其注释掉。将以下行替换为：\n\n```\niface wlan0 static address 192.168.1.2 netmask 255.255.255.0\n\
    ```\n\n![](img/90ce260f8df0a9c6339df2d60332346d_78_0.png)\n\n你会在你平台的多个地方寻找此处：配置文件\
    \ /etc/hostapd/hostapd.conf。使用命令 `sudo nano /etc/hostapd/hostapd.conf` 为 hostapd\
    \ 重复这些步骤。当你发送流量时，这种效果更好。\n\n# 06 配置访问点\n\n创建一个文件。不要使用在线文档：PDF 等可能包含泄露你真实位置的代码。粘贴以下内容：\n\
    \n```\ninterface=wlan0\ndriver=80211\nssid=Open_Pi\ncountry=us\nhw_mode=g\nchannel=6\n\
    mac_addr=\nauth_al=1\nignore_broadcast_ssid=0\nwpa=\nwpa_password=Raspberry\n\
    wpa_key_mgmt=WPA\nwpa_pairwise=TKIP\nwpa_group_rekey=6400\nwme_enabled=1\n```\n\
    \n如果你使用的是树莓派，注释掉带有这一行\n\n# 08 配置\n\n运行 `sudo nano /etc/tor/torrc` 来配置它。访问 https://www.torproject.org/docs/faq\
    \ 然后之后：\n\n日志文件 /var/log/tor.log:\nVirtualNetworkAddress 192.168.10.1\nAutoproxySuffix=exit,\n\
    AutoproxyControlDNS=1\nTraffic 0\nDNForward 53\nDNSAddress 192.168.1.42.\n\n保存并退出。运行\
    \ `sudo update-rc.conf` 在启动时启用 tor。\n\n```\neth0: BROADCAST,MULTICAST,UP,LOWER_UP,\
    \ mtu 1500 \n\tinet daddr  mask 255.255.255.0 global eth0\n\ntether0: BROADCAST,MULTICAST,UP,LOWER_UP,\
    \ mtu 1500\ninet 192.168.13.1 scope tether0\n   mask 255.255.255.0\n```\n\n![](img/90ce260f8df0a9c6339df2d60332346d_78_1.png)\n\
    \n可以自由密码从 'Raspberry' 更改为更复杂的。\n\n```\niptables -t nat -A PRROUTING -o eth0 -s\
    \ 192.168.13.0/24 -j MASQUERADE\niptables -A FORWARD -i tether0 -s 192.168.13.0/24\
    \ -j ACCEPT\niptables -A FORWARD -o eth0 -d 192.168.13.0/24 -j DROP\niptables\
    \ -t nat -A POSTROUTING -o eth0 -j MASQUERADE\n```\n\n# 09 配置 IPTables\n\n为了防止所有流量通过\
    \ Tor：\n\n```\niptables -t nat -A PRROUTING -i wlan0 -p tcp\n   --port 22 -j REDIRECT\n\
    iptables -t nat -A PRROUTING -i wlan0 -p udp\n   --port 53 -j REDIRECT\niptables\
    \ -t nat -A PRROUTING - i wlan0 -p tcp\n   --port 53 -j REDIRECT\niptables -t\
    \ nat -A PRROUTING - i wlan0 -p tcp\n   --port 3080 -j REDIRECT\n```\n\n当你准备好检查配置时，使用命令\
    \ `sudo iptables -L -n`\n\n"
