    ## Python


    ## Building a Raspberry Pi cluster


    Learn to use Python to get some work done on your Raspberry Pi cluster.


    > In a previous article, we looked at how to combine multiple Raspberry Pis together
    to make a cluster of machines. But can you use any of these machines for something
    more than the monster that you created? Luckily, IPython is a great way to put
    all of them to work, getting some serious work out of your cluster.


    The engines do the actual running of the code from your program. The hub is where
    you run code and where the parallel parts start. The hub and client are the parts
    that communicate with each other.


    available engines. In the previous example, we actually ran the code on the list
    of available engines.


    This will work fine on a single Raspberry Pi, but that is not what we are interested
    in. How do you use that entire cluster that you have set up and working for you?
    There are a few options on how to organize the cluster so that they can all connect
    from external machines, you. The simplest method is to keep the controller on
    each machine and use ipython to run everything. By default, ipython sets up things
    so that only local connections will be accepted. You will need to use IPython
    to create a new profile, as shown:


    ![](img/90ce260f8df0a9c6339df2d60332346d_79_0.png)


    Joey Bernal

    Joey Bernal is a true craftsman, splitting machines, building furniture, helping
    with scientific computing problems and Android apps


    Once everything is installed, you can use any of the various parts of the parallel
    cluster on your Raspberry Pi to communicate with other clients, as shown:


    ```

    ipython -n

    ```


    This will start up n engines. For example four will start up one hub and a series
    of clients. When you run it, it stays running in the background. As a first test,
    you can see that it outputs a message. If you want to start another client, press
    an ampersand (&) at the end of the command so that then you can create a client
    object and connect to these engines with code like:


    ### Why Python?


    It''s the official language of Python.

    Read the docs at ipython.org


    ```

    sudo apt-get install ipython

    ipython-notebook

    ```


    ### IPython is a great way to make all of these machines to work


    This will install the IPython if you use Python 2.x. If you are planning to use
    Python 3.x, you will need to install the ipython and ipython-notebook packages.
    Starting with version 4.0, the parallel functionality has been pulled out into
    its own package called multipython. Most operations do not have compatibility
    with older versions of multipython. You may need to install it with multipython,
    as shown:


    ```

    sudo pip install ipython ipython-notebook multipython

    ```


    Depending on the versions of the dependencies on your system, you may update some
    of these packages. IPython is structured in four parts: the engine, the hub, the
    scheduler and the


    ```python

    >>> import multipython as ip

    >>> c = ip.Client()

    >>> [0, 1, 2]

    >>> c.apply_sync(lambda: ''Hello World'')

    [''Hello World'', ''Hello World'', ''Hello World'']

    ```


    When you instantiate a new Client object with ip.Client(), you will need to set
    the default profile to see where to connect to your parallel cluster. The next
    statement will show you the available engines. The final test is to use the method
    apply_sync to run the lambda function on some subset of the


    This will create a new profile with a set of configurations. In order to establish
    connections, you will need to create the controller to interface with. You will
    need to create the controller with a profile in the directory and then the following
    line for the Hub.


    ```

    ipython profile --myprofile

    ```


    Now you can start the cluster. You will need to provide a profile name to use
    the engines. If the controller is running, and if two machines are on the same
    network over NFS, you can use the profile instance you want to create a new client.


    ```python

    >>> c = ip.Client(profile=''myprofile'')

    ```


    If they don''t have a filesystem, you will need to configure the client before
    making a connection. The Raspberry Pi that is hosting the controller, you will
    find a file named ipcontroller-client.json in the directory ~/.ipython/profile_ipython/security,
    which will contain all of the connections that the client will need. If you copy
    it to the client machine that you run and place it in the directory ~/.ipython/default/security,
    you can create a new client object without any parameters and it will read the
    connections from this JSON file.


    We are using a single Raspberry Pi to run on our cluster. In order to pool it,
    you will need to use the ipython engine rather than the all-in-one controller.
    The controller needs to accept connections from clients and on remote machines,
    we will use the IP configuration option to set the network. The next step is to
