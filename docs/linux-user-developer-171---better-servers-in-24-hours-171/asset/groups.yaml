    ### 3 Lightworks


    印度初创公司 Explore Embedded 可能只想为它的合一 M3 板众筹 700 美元，但带来了一段时间以来最令人深刻的板之一。支持 USB 的 Explore
    M3 核心支持 Arduino IDE，对两种框架编程环境都有广泛支持，因为它是开源的。它可以与 KiCode 和 Ellipse 配合，拥有 64KB RAM，并通过虚拟
    COM 和 JTAG 设备的使用实现进一步扩展。


    除了主 M3 单元外，用户还可以获得可选的启动套件。该套件可与各种传感器配合，使用 Arduino 和裸机编程创建完整项目。套件包含了 M3 板。


    Explore M3 基于 NXP 的 LPC768 微控制器，由于它内外完全开源，它有许多连接端口，这有助于保持低成本。在性能方面，Explore M3
    明显比未命名的 M2 更匹配。


    ### 4 KDenlive


    作为功能最完整的套件之一，KDenlive 还提供了令人印象深刻的键盘快捷键。这些快捷键可以节省时间并自动执行您需要的不同任务。


    Explore M3 非常物值，尤其是考虑到它 19 美元的优优价格。可选的 Arduino 启动套件又增加了极大的价值，售价为 40 美元。应可以通过 exploreembedded.com
    网站查询发货信息和供货情况。


