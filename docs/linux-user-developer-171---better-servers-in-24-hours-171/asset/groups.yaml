    Linux Mint 比任何时候都更大、更好


    Linux Mint 是 2016 年真正扩大用户群的发行版之一。它的最新公告是又向前的一步。在经历了成功的测试阶段且仅记录到极少数错误后，Linux Mint
    18 KDE 的稳定版已正式发布。


    KDE 版本与 Cinnamon 和 MATE 版本遵循相同的模式，但配备了极其优秀的全新更新管理器（Update Manager）以及一系列新设计的 X-Apps。当然，它仍然是默认
    KDE 采用者的选择。


    ![](img/90ce260f8df0a9c6339df2d60332346d_9_0.png)


    ### Linux Mint 18 是迄为止最好的 Mint 版本


    在硬件要求方面，纯安装 Linux Mint 18 需要 10GB 的磁盘空间。据记录，安装已简化到 2GB RAM 以下。出乎意料的是，最后一项要求仅需
    100MB 的磁盘空间，这在大多数现代计算机上都是标准配置。Linux Mint 18 最大的新增是引入了 Cinnamon 桌面环境。它标志着相比之前更新的重大改进，并展示了
    Linux Mint 真的有多么出色。


    Linux Mint 18 将持续接收至 2021 年的关键更新。Mint 的所有未来版本可能使用相同的基础，以实现简单快速的更新。对于正在运行 Beta
    版的用户，请前往更新管理器部分并点击“刷新”获取新更新并开始使用这一精彩的新发行版。


    > 它标志着相比之前更新的改进，并展示了 Linux Mint 真的有多么出色


    ## 硬件 Parrot 与 Canonical 合作启动无人机项目


    无人机已成为 2015 年及现在最大的希望之一。无人机市场正在不断扩大，但直到目前，无人机与 Linux 操作系统之间几乎没有交集。Canonical 的新项目涉及许多制造商。Parrot
    则致力于改变这一切。


    连接密钥也可以更简单，因为这种微型设备安装在无人机顶部，并立即传输数据。是时候让更多开发者加入并创造内容了——这些从大多数无人机中产生的内容将会实现。从规格角度来看，S.L.A.M
    包含了相关内容。它使用 Nvidia Tegra K1 作为动力中枢，前端配有一个分辨率为 1500x1500 的鱼眼摄像头。它还配备了各种传感器：用于数据采集的加速度计、磁力计和气压计。


    联手创建开发套件的两个团队将协助自主避障无人机及机器人的创建。Parrot 由 Ubuntu 和 Ubuntu 系统驱动，这允许 Linux 开发人员进行设计原型、3D
    映射，并使用车载传感器进行数据采集。


    > 这种微型设备安装在无人机顶部，几乎立即传输数据


    最棒的一点是，得益 HDMI 端口，用户实际上可以将显示器连接到开发套件，并在他们的无人机上运行一台完整的 Ubuntu 14.04 计算机。更多信息，请访问
