    # 欢迎收看 Linux User & Developer 第 171 期


    # 本期内容


    - 24 小时内拥有更好的服务器

    - Ubuntu 远程管理

    - 开源 AI

    - 防止 SSH 攻击


    欢迎阅读 Linux User & Developer 最新一期，这是英国最喜爱的 Linux 和开源杂志。服务器曾是公司和其他机构的专利。现在，你更有可能在某人的家里看到它——也许它正运行着他们的业务，处理核心文件和文件夹、网络访问和账户；或者他们正用它在家庭网络中传输文件。如果你想加入行动，我们将通过解释如何升级现有的家庭或中小企业，或从零开始构建来提供帮助。


    当然，一旦你运行了服务器，对其进行加密是一个好主意。但你需要确保它是安全的。查看第 38 页关于使用 SSH 进行远程管理的教程，以及第 14 页关于如何防止
    SSH 攻击并保持数据安全。我们提供了 Bash 脚本、NET 和 Go 编程指南，帮助你提升技能。在第 52 页，我们深入探讨了 Linux Mint，分析了各个版本及其对比，并提供了如何根据你的喜好进行配置并确保其固若金汤的建议。祝本期愉快！


