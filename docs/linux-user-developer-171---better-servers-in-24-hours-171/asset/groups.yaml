    \ implementation of a solution is always a good thing.\n\nAs you can see, when\
    \ you are running a concurrent program using a single core, the concurrent version\
    \ of program might not be faster than the usual version.\n\n# Shared memory and\
    \ shared variables\n\nThe traditional way that threads use to communicate with\
    \ each other is shared memory. Go comes with synchronization features that allow\
    \ a single goroutine to share a piece of data. This means that other goroutines\
    \ must send messages to the single goroutine.\n\n# Tutorial Concurrent programming\n\
    \nRight this figure shows the use of sync.Mutex for providing exclusive read and\
    \ write access to one or more shared variables.\n\n```go\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n\t\"os\"\n\t\"sync\"\n)\n\nvar (\n\tsync sync.Mutex\n\tsharedVariable\
    \ int64\n)\n\nfunc init() {\n\tsharedVariable = int64(0)\n\tfmt.Printf(\"%d\\\
    n\", sharedVariable)\n\tMutex.Lock()\n}\n\nfunc increment(value int64) {\n\tMutex.Lock()\n\
    \tsharedVariable += value\n\tfmt.Printf(\"%d\\n\", sharedVariable)\n\tMutex.Unlock()\n\
    }\n\nfunc main() {\n\t// Create some goroutines\n\tfmt.Printf(\"workers %d\\n\"\
    , len(os.Args[1:]))\n\tvar wg sync.WaitGroup\n\tfor i := 0; i < 5; i++ {\n\t\t\
    wg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tincrement(1)\n\t\t}()\n\
    \t}\n\twg.Wait()\n\tfmt.Printf(\"final: %d\\n\", sharedVariable)\n}\n```\n\nWhen\
    \ you have a read request, monitor() returns the current value read using the\
    \ value parameter. Similarly, when you want to change the current value, you change\
    \ the value parameter. All goroutines using either SetValue() or ReadValue() are\
    \ running, monitor() can serve at most one request at any given time, which prevents\
    \ the corruption of the shared data. If for loops keep working as long as they\
    \ should.\n\nAs you can guess, this is a difficult technique that should be programmed\
    \ with care.\n\n# Using sync.Mutex\n\nMutex is an abbreviation for mutual exclusion;\
    \ mutex variables are used for thread synchronisation and for protecting shared\
    \ data when multiple writers can access the same time. A mutex works like a buffered\
    \ channel that allows at least one worker to access a shared variable at a time.\n\
    \nYou have to lock the mutex and release it to gain access over the shared variable\
    \ for the duration of a critical section. The Lock method gives you access when\
