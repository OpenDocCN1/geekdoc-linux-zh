    \ | 0.026 | 0.102 | 0.022 |\n| 7 | 0.025 | 0.116 | 0.023 |\n| 8 | 0.027 | 0.128\
    \ | 0.025 |\n\n```go\nimport {\n\t\"math/rand\"\n\t\"sync\"\n\t\"time\"\n}\n```\n\
    \n此图展示了 GOMAXPROCS 环境变量不同值下的基准测试结果。\n\n![](img/90ce260f8df0a9c6339df2d60332346d_44_0.png)\n\
    \n```go\nvar readValue = make(chan int)\nvar writeValue = make(chan int)\n```\n\
    \n```go\n// 此函数设置一个新值\nfunc SetValue(newValue int) {\n\twriteValue = newValue\n\
    }\n```\n\n```go\n// 此函数获取当前值\nfunc ReadValue() int {\n\treturn <-readValue\n}\n\
    ```\n\nGOMAXPROCS 的最大值为 256，如果你决定使用更大的整数。测量方法如下：\n\n```bash\n$ go build example.go\n\
    $ export GOMAXPROCS=$value; time ./example\n$ export example=2000\n```\n\n```go\n\
    func monitor() {\n\tvar info int\n\tselect {\n\t\tcase newValue := <-readValue:\n\
    \t\t\tvalue = newValue\n\t\t\tfmt.Printf(\"%d\\n\", value)\n\t\tcase readValue\
    \ = <-value:\n\t}\n}\n```\n\n基准测试结果可以在图 4 中看到。正如标记所示，你使用的核心越多，程序的性能提升就越明显。然而，如果你必须执行需要大量\
    \ CPU 算力的操作，情况可能不再如此；这是因为每个并发程序都会引入额外的额外通信开销和线程。\n\n```go\nfunc main() {\n\trand.Seed(time.Now().UnixNano())\n\
    \tgo monitor()\n\n\tvar wg sync.WaitGroup\n\tfor i := 0; i < 15; i++ {\n\t\twg.Add(1)\n\
    \t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tSetValue(100)\n\t\t}()\n\t}\n\t\
    wg.Wait()\n\tfmt.Printf(\"Last value: %d\\n\", ReadValue())\n}\n```\n\n上一个示例在使用单核时执行时间更长，同时，名为\
    \ non-concurrent 的非并发 Go 程序使用以下代码完成与示例一相同任务的时间如下：\n\n这可能是因为使用了 goroutine —— 此外对\
    \ sync.Add、sync.Wait 和 sync.Done 的调用会降低程序的性能。\n\n```bash\n$ time non-concurrent\
    \ 100\n| real | 0.003s |\n| user | 0.000s |\n| sys | 0.000s |\n$ time ./example\
    \ 1000\n| real | 0.0111s |\n| user | 0.000s |\n| sys | 0.000s |\n```\n\n请注意，这并不是一个科学的示例，但是一个快速简单的方法，说明了并行化并非万灵药\
    \ —— 然而，正确的设计和实现总是一件好事。\n\n正如你看到的，当你使用单核运行并发程序时，并发版本的程序可能并没有普通版本快。\n\n# 共享内存与共享变量\n\
    \n线程之间传统的通信方式是共享内存。Go 提供了同步功能，允许单个 goroutine 共享数据。这意味着其他 goroutine 必须向该 goroutine\
    \ 发送消息。\n\n# 并发编程教程\n\n右图展示了使用 sync.Mutex 为一个或多个共享变量提供互斥读写访问。\n\n```go\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n\t\"os\"\n\t\"sync\"\n)\n\nvar (\n\tsync sync.Mutex\n\
    \tsharedVariable int64\n)\n\nfunc init() {\n\tsharedVariable = int64(0)\n\tfmt.Printf(\"\
    %d\\n\", sharedVariable)\n\tMutex.Lock()\n}\n\nfunc increment(value int64) {\n\
    \tMutex.Lock()\n\tsharedVariable += value\n\tfmt.Printf(\"%d\\n\", sharedVariable)\n\
    \tMutex.Unlock()\n}\n\nfunc main() {\n\t// 创建一些 goroutine\n\tfmt.Printf(\"workers\
    \ %d\\n\", len(os.Args[1:]))\n\tvar wg sync.WaitGroup\n\tfor i := 0; i < 5; i++\
    \ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tincrement(1)\n\
    \t\t}()\n\t}\n\twg.Wait()\n\tfmt.Printf(\"final: %d\\n\", sharedVariable)\n}\n\
    ```\n\n当你有一个读取请求时，monitor() 使用使用 value 参数返回当前值。同样，当你想更改当前值时，你会更改 value 参数。所有使用\
    \ SetValue() 或 ReadValue() 的 goroutine 都在运行，monitor() 在任何给定时间最多处理一个请求，这防止了共享数据的损坏。\n\
    \n"
