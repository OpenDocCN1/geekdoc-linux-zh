    # 我的 Pi 项目


    # PSPI V2


    想要一种高性价比的方式来提升你的游戏体验吗？Adam Seamer 的 PSP2 项目将非常适合你。


    ![](img/90ce260f8df0a9c6339df2d60332346d_68_0.png)


    - PSP 项目的灵感最初来自哪里？

    我是在玩《超级马里奥》和《塞尔达》中长大的，那是在 90 年代后期。或者我每天都会用 SNES 或 Gameboy Color 玩一个我想玩的游戏。这一年非常忙碌。现在周末有人在享受它。我的重点是，我更倾向于把时间花在项目而不是钱上。我的目标是构建一个廉价的硬件，但配备更大的
    LCD 以支持更多游戏，并且按钮要足够舒适以便连接外部 USB 驱动器。同时让 Pi 作为一个微主机也非常重要，这使其变得有用得多。使用一个损坏的 PSP200
    是完美的选择。


    而且这是在没有任何社区参与的情况下完成的。两个月来，我每天下班后工作两个小时来制作一个可以玩的手持设备。在这个过程中一切并非完美。设计是边做边完善的，每隔几天就会重新进行工程。我发现其他人也有同样的“第一个项目的杂乱感”，但没有我这么有条理。第二个
    PSP2 在功能上几乎完全相同，但它更整洁、更成熟。从第二个版本开始，使用不同的 LCD 和质量更好的组件产生了巨大的差异。


    希望这能让那些经验较少或没有时间进行大量研究的人能够复刻。这是一段旅程。


    - 我们的读者复刻你的 PSP2 项目有多容易？对于想要尝试的人，你有什么建议吗？


    ![](img/90ce260f8df0a9c6339df2d60332346d_68_1.png)


    - 开始很困难。它包含了许多必须单独处理的组件，每个组件都散落在不同的地方。这比我们熟悉的硬件要困难得多。我的目标是使其尽可能简单，由于每个部分的成本都很昂贵，降低复杂性和难度。教程在这里可以为你提供帮助。当你操作它时，你会发现它并没有你最初认为的那么令人畏畏，而是很有回报。


    - 在开发过程中你是否遇到过任何让你头疼的问题？


    这个项目的每个部分都是一次学习经历。我完全按照我所构想的方式完成了它。


    # Adam Seamer


    一位长期的手工爱好者，拥有创建新手持游戏机的历史。所有它们最终都是自制的。


    - 喜欢吗？如果你觉得组装一个项目太复杂，那么你可以在其他地方找到更多基于 Pi的项目。


    - PSP Zero 也能驱动 PSP2 的开发，你想如何测试它？与其尺寸相比，PSP2 项目的价格是多少？


    PSP2 很容易制作，但并不易于被理解。它不是那种插上就能用的设备。它需要时间和精力的。对于这个特定项目来说，它所使用的材料非常值。但总的来说，这都关乎成本，这个项目是值得的。成本是
    300 美元。我一直是个手工爱好者，因为我有这种动力，既然它这么便宜，可能性是无限的。这不会是我在 PSP Zero 上花费的最后一个项目。


    延伸阅读：Adam 慷慨地在他的网站上分享了该项目的细节。他还在他的网站上提供了大量的教程。


    - 你最近发布的原始 PSP 和 PSP2 之间有什么区别？


    原始 PSP 是一个实验。


    ## “PSP2 的功能几乎完全相同，但更整洁”


    但在功能线上，实现方式存在差异。与 PSP Zero 相比，PSP2 项目进行期间，我有充足的时间进行研究和规划。


    我面对了早期硬件的不同方面，GPIO 控制、复合 LCD 以及音质和供电能力音频电路需要更好的设计。这很艰巨，也很难弄清楚，但硬件方面的糟糕程度只有这一半，而软件方面也同样复杂。我创建
    otherMod.com 网站的原因之一是，随着项目的进展，我为项目的每个部分创建了教程，对于 PSP Zero 也是如此。这将让那些想要拥有自己 PSP
    的人更容易上手这个项目。


    - PSP 项目的未来如何？你认为前景内会有新东西出现吗？


    是的，版本 2 将在不久后推出。PSP2 是第一个向社区展示的项目，社区的反馈非常好，有很多更改和增加的佳想法，这些将进入下一个版本。我预计它会变得今天一样流行，我会坚持下去，直到我们达到任何人都可以为自己制作一个境界。


