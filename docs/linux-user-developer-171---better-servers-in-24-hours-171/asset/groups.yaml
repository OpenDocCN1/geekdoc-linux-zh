    # CONTROL A

    ROBOTIC ARM

    WITH JUST YOUR FINGERTIPS


    Build, hack and move a robotic arm with

    flicks, finger movements and gestures


    This tutorial combines the Maplin Robotic Arm and Pimononi''s Skywriter HAT to
    enable you to take control of the robot with just the touch of your fingers. The
    arm can move through three points of articulation and give you maximum flexibility
    with movement. The arm also moves through 120 degrees in the wrist, 300 degrees
    at the elbow, 120 degrees vertically and 270 degrees in the horizontal. It is
    easy to assemble and is a great beginner''s robot. In this tutorial you will first
    install the Python modules to enable your Raspberry Pi, then learn how to use
    Python code to send commands and receive them from the arm. Next you will learn
    how to program the arm which is actually great fun and you can start to practice
    picking up objects and trying to move them to another location.


    The Skywriter is an electrical near-field 3D sensing board that recognises a number
    of gestures including taps, double taps and flicks. These gestures can be made
    by tapping the board to move the arm to the east or west, and then programmed
    in a particular way. Finally, both the arm and the Skywriter code are combined
    to create a program where you can easily program and move the arm, creating the
    controls at your fingertips. For example, a tap on the north of the board which
    is the arm''s home position could move it downwards. Watch this video to see the
    project in action: https://www.youtube.com/watch?v=SVDxbC608i


    # What you''ll need


    +   * Maplin Robotic Arm

    * Pimononi Skywriter

    * Raspberry Pi 2 or 3


    Dan Aldred is a Raspberry Pi Certified Educator and a Lead Systems Developer at
    GACS. He helped the winning team of the Astro Pi Showcase, has also written and
    appeared in the DIE''s inspiring TV show. Recently, he was launching a Raspberry
    Pi attached to a high altitude balloon, measuring meters into the stratosphere.


    ![](img/90ce260f8df0a9c6339df2d60332346d_70_0.png)'
