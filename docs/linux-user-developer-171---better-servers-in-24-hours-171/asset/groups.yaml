    Billed as the cheaper alternative to the Raspberry Pi, do the CHIP and its smart
    docking station live up to the ultra-compact variant?


    The CHIP is an ultra-micro microcontroller built around the Allwinner R8 system-on-chip
    (SoC) processor. It''s designed to be affordable Linux, and it runs a customised
    variant of Debian Linux, but there''s no micro-SD card slot for storage expansion;


    Compared with the Raspberry Pi, there are some advantages to the CHIP: it has
    40-pin GPIO headers; storage is included as-standard built-in; a battery provides
    an easy way to power the board in embedded applications; and an on-board radio
    provides 802.11b/g/n Wi-Fi and Bluetooth 4.0 connectivity.


    Though a full-size USB 2.0 port can fix that drawback, there''s no wired network
    port,, and there''s no digital video output port; instead, a 3.5mm jack offers
    TRRS connectivity for analogue audio/video composite to monitors, VGA or HDMI.


    Actually, the cheap computer has the $14 to $24 computer. With the launch of the
    Raspberry Pi, which costs £4 in the UK and $5 internationally, NextThingCo needed
    something special to enter the PocketCHIP market.


    To hit a price point some ahead of the competition, some features have been


