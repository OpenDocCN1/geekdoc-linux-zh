    # 特性 构建更好的服务器


    # 选择硬件 5 小时


    对于你新的、更好的服务器，你应该考虑选择哪些硬件？


    有很多指南可以帮助你为办公或游戏 PC 选择最佳硬件，但针对服务器配置的指南并没有那么多——这可以理解，因为这有点小众。然而，构建服务器的优先事项除了具有执行所需任务的适当性能之外，是非常不同的。还有其他需要考虑的因素，如功耗、热量、噪音、韧性和使用寿命。如果你在从一开始就选择了正确的组件，那么频繁升级服务器是没有意义的。


    ![](img/90ce260f8df0a9c6339df2d60332346d_21_0.png)


    # 机箱


    对于服务器来说，机箱（或外壳）可能与你在家里使用的台式机看起来并不熟悉，但那是因为你并不是寻找未来感的设计和 LED 灯。相反，你追求的是智能冷却、组件的快速组装/更换以及与你计划购买部件的良好兼容性。你选择哪种类型的机箱取决于你是否想要将机器进行架式安装。对于构建者来说，架式机箱比传统版本更好但限制了选择，除非你有特殊需求，否则在构建服务器时避免使用架式安装可能是明智的。


    > 一个具有快速、无需工具即可访问的高质量机箱会让服务器的运行更加轻松


    # 主板


    虽然选择主板的核心是确保它与你计划的 CPU 和 RAM 兼容，但有些你可以注意的特性可以让你在构建服务器时生活更轻松。某些主板包含远程管理功能（通常称为
    IPMI），开箱即用或作为扩展模块，这将让你获得 ILO 功能，而无需构建定制机。从连接性的角度来看，你的主板需求将取决于你是否打算拆分 RAID 以及网络连接到独立的网卡。


    ![](img/90ce260f8df0a9c6339df2d60332346d_21_1.png)


    # CPU


    构建服务器的一个很好的建议是抵制选择你能找到的最新的、最快、最强大的 CPU 的诱惑。为什么？因为


    确保你有足够的插槽用于所需的 RAM 以及任何你没有放置在独立卡上的连接器。


    Intel Xeon 是服务器级 CPU，但对于大多数应用（特别是家庭环境）来说可能过剩。


    22


    ![](img/90ce260f8df0a9c6339df2d60332346d_22_0.png)


    相反，你应该确保你购买的适用于当前任务。如果你正在构建的机器大部分时间将作为文件服务器运行，那么 CPU 活动将非常少，因此你应该选择一个低电压处理器，这会减少对
    SSD 的压力并为你省钱。Xeon 还提供一系列特定的 CPU，它们通常与同级的 Intel 处理器相同，但通过了 24/7 全天使用的认证，并取自最可靠的处理器。这是有代价的。


    交换可能有问题。当你构建服务器时，请记住网络速度取决于你连接到机器的任何设备。

    '
