    ## 模糊测试与对安全安全的追求\n\n## 关于模糊的动态\n\n模糊测试（Fuzzing）是发现软件漏洞和安全漏洞的重要方法。阅读本文了解什么是模糊测试以及目前常用的哪些方法。\n\
    \n作者：Andreas Zeller\n\n这是一个阴暗风雨交加的夜晚。巴特·米勒（Bart Miller）——你可以在我们专题的结尾看到对他的采访——正在家里通过\
    \ 1200 波特的调制解调器连接到威斯康星大学的主机。但雷声意味着出了问题：闪电干扰了电话线上的数据传输，并导致相同的字符错乱，迫使米勒一次又一次重新开始。\n\
    \n每当他重启时，他都会注意到有多少程序无法跟上这种混乱——它们崩溃、挂起，或者以其他不受控的方式停止。程序不应该对无效或故障的输入产生太大反应！米勒决定调查一下为什么这些程序会给出如此奇怪的答案。\n\
    \n1998 年秋季的那个晚上被认为是模糊测试的诞生，它是今天测试程序健壮性以及检查安全漏洞的最重要的方法。专业人士通常使用模糊测试来检查软件中的错误，但对于许多经常编写代码的程序员和用户（包括\
    \ Linux 社区的许多人）来说，这仍然是一个谜团。但我们将仔细研究模糊测试以及它为什么如此重要。\n\n在此过程中，模糊器使用各种技术来发现错误。纯随机的输入很容易生成；它能发现输入处理中的错误，例如缓冲区溢出。基于模型的模糊器使用语法和语言模型来生成有效且有针对性的输入。基于演化的模糊器必须测试输入，而基于基于约束的模糊器可以解决程序代码中的复杂问题，但需要很长时间。\n\
    \n使用随机输入进行模糊测试非常简单：只需几行程序代码即可获取必要的输入。例如，`fuzz()` 函数生成的随机字符列表看起来如下所示：\n\n```\n\
    *!*#$&%*!6<?*8</!*)(/$\\*\n-(24)!*#$&%*!1<?*S7,4.8\n```\n\n巴特·米勒将这种输入称为“模糊”（fuzz），意味着非结构化数据。我们如何对其进行模糊测试？让我们向一个期望数字代码的程序输入一个字符串。如果一个缓冲区有五个字符用于输入，但实际输入超过了它的容量（缓冲区超过了\
    \ 6 个字符），就会发生缓冲区溢出。五个字符缓冲区周围的内存会被一个随机数字覆盖，这反而导致程序的行为更加随机。在读取六个字节时，它可能会崩溃或进入无限循环。\n\
    \n+ 列表 1：Python 简单 fuzzer\n\n```python\nimport random\ndef fuzz(max_length, char_start,\
    \ char_range):\n    # 生成一个长度为 'max_length' 字符的字符串\n    out = \"\"\n    for i in\
    \ range(0, max_length):\n        out += chr(random.randrange(char_start, char_range))\n\
    \    return out\n```\n\n## 什么是模糊测试？\n\n模糊测试的本质通过巴特·米勒的编程作业直接揭示：该项目的目标是评估小型单元程序的健壮性。该项目包含两个部分：一个模糊生成器和一个模糊测试程序。\n\
