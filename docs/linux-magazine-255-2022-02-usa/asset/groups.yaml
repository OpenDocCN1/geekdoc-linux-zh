    # EndeavourOS 21.4 现发布


    如果你喜欢 Linux 属于 Arch 类型，但又不想经历安装完整版 Arch Linux 时固有的挑战，那么你有很多选择。其中就是 EndeavourOS。Endeavour
    OS 自称为“以终端为中心”。这极大地减少了在终端内花费所有时间。事实上，我认为 Endeavour OS 的标签有一点误导性。我用过这个系统，发现它非常容易使用。


    但 EndeavourOS 的新“版本”提供了什么呢？首先，它附带了内核 `5.15`，这是非常前沿的。该内核中一个非常重要的特性是新编写的 NTFS3`，它极大地改进了
    Linux 与 NTFS 系统的交互方式。


    其他改进还包括对 Nvidia 驱动程序和内核更新的新健康检查、对欢迎应用的改进，以及轻松删除已卸载包缓存的能力。


    此外，Calamar 安装程序可以读取 `pacman` 操作，启用 EFI 路径命名，并同时启用 i3，从而默认启用 NVIDIA DRM 模式。


    Btrfs 在 SSD 和 HDD 上均使用 `zstd` 进行安装，PipeWire 现在默认启用，并且固定的标签名称现在兼容旧的 BIOS 系统。


    要了解 Endeavour OS 的 Atlantis 版本，请阅读版本发布说明（https://endeavouros.com/news/the-atlantis-release-is-in/）并下载
    ISO 镜像安装（https://endeavouros.com/latest-release/）。


    # NixOS 21.11 现已下载


    NixOS 与大多数 Linux 发行版有所不同，因为它在软件包和配置管理方面采用了独特的方法。NixOS 使用 Nix 管理器来构建一切——包括内核。甚至从
    `fstab`、用户、防火墙等整个系统配置都取自一个单一的全局配置文件。这种“组合拳”让 NixOS 变得非常复杂。事实上，许多人认为它与 Gentoo 处于同一水平。


    换句话说，NixOS 并不是为新手设计的。


    NixOS 21.11 有许多新特性，包括内核 `5.10`、`nft-tables`（取代 iptables`）、基于 Wayland 的 KDE Plasma、PHP
    8.0、Python 3.9、PostgreSQL 13、Spark 3、Bash 5.0、Gnome 41、systemd 249、Kubernetes-Helmet
    3.7、OpenSSH 8.8p1 以及 LXD 改进。


    未升级的拼图部分是 NixOS 本体。由于非实验性行为的回归，NixOS 附的是 Nix 2.36（而不是最新版本 2.4）。


