    # 音频监视器


    # # projectM


    没有两个像音乐和音频监视器一样令人满意的实用程序了。虽然它们可以将纯粹的学习体验变成华丽的像素盛宴，特别是在派对或生活活动中，但即使是其中一个也很有趣，而且是我们多年年来遇到的最好的监视器。音乐监视器实际上是指任何在视觉上与其通过的声音同步的视觉效果。这时，你将看到所有随节拍同步的优美线条束，或者环绕旋转的迷幻彩色轮，这一切都在一起。它们可以是一个老式的
    Amiga 设备、部分演示，也是关于你的 GPU 能向屏幕上推入多少粒子的实验。它们的成功完全是主观的，与学习环境和使用动机有关。可配置的 projectM
    完成了这一切以及更多。projectM 监视器是对 Milrok 的重新解释，Milrok 是一种使用 Windows 播放器获取预设的真实监视器。这些测试填充了路径着色器，使用不同的方程和参数进行绘图，projectM
    将它们从 Milrok 引入。


    重建 90 年代的洞穴：通过将 projectM 的输出投影到附近的墙上。


    其包含 41000 首曲的库。有控制可以在这些预设之间切换，还有一个随机预设，以及创建预设列表并加载当前选中项的能力。


