    # 任务管理器


    # # Plasma 系统监视


    我们将 CPU、内存、存储和进程监视器视为处理新编程语言或框架的开发者的“首选”，而不是依赖 `top` 或 `htop` 方法。然而，我们可能会发现其他系统监视器得到了改进。其中最好的是
    KDE 的系统监视，它在多年前取代了旧的系统监视，并利用了新的 UI 框架。UI 框架的效果和团队优秀的作品实际上是值得关注的。系统监视包含你想要的一切，并且布局完美且具有良好的响应性，无论你需要看到多少或它占据多少屏幕空间。它在手机上运行良好。当首次启动时，默认概述页包含内存、存储和
    CPU 使用率的三个图表；窗口大小会随之自动调整。每个图形元素都是信息丰富的。例如，它显示运行的每个应用程序以及网络使用的读写吞吐量。


    默认配置中的几个页面提供了典型的任务管理器信息，与应用程序视图相同，并显示父进程和子进程，以及发送任何信号的能力。系统监视完全可编辑，允许你删除页面、创建水平和垂直控制并添加任意数量的传感器来创建你的仪表盘。从单个
    CPU 到存储、操作系统和网络细节，巨大的传感器列表。它们都被渲染得非常漂亮。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_81_1.png)


    这种测量使其成为一个出色的监控工具，Kysguard 是模块化的且类似的，并且可以监控服务器，但也只有以后才开始使用。相比之下，Plasma 系统监视是灵活的。它感觉像是一个移动和
    Web 框架（如 Home Assistant 的仪表盘），而不是任务管理器。


    1. 页面：你可以自定义前几个页面，也可以根据需要添加许多页面。

    2. 任务管理器：内存和传感器视图（监视）垂直或水平排列。

    3. 编辑模式：分组传感器并让它们垂直或水平对齐。

    4. 显示样式：在历史记录中以饼图、文本、线条等方式查看传感器数据。

    5. 数据聚合：分组并合并传感器。

    6. 小部件：面板和桌面提供了你所需的所有功能。

    7. 数据负载：进程和应用程序列表包括 CPU、网络使用和存储使用。


