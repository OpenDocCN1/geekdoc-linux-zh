    # 深度解析 Skydide


    ## 命令行


    如果你不想通过点击界面来排排故障，可以使用 Skydide 中的命令行。客户端与分析器通信并在控制台窗口中显示其结果。你不需要额外的程序，因为客户端已集成在
    Skydide 的二进制文件中。客户端可以通过简单的查询（查询 4，列表 1）与其分析器进行交互。


    如果客户端和分析器没有运行在同一台服务器上，客户端需要服务器的 IP 地址或主机名（使用 `--analyzer` 标志）。如果连接成功，连接的代理详细信息将以
    JSON 格式显示。


    在监控整个树结构时，Skydide 会捕获并报告每一个边和节点。使用针对性的查询来仅返回你想要的内容是有意义的。Skydide 使用自己的查询语言。列表 4
    的最后一行显示了特定节点的查询示例。


    在命令行中为图创建连接线需要一些 Gremlin 知识。子命令不是 `query` 而是 `edge-rule`，它可以创建 5 个节点以及几条连接线。


    在底层，客户端访问 Analyzer API。编程接口是一个标准的 REST API，通过 Swagger 进行了详细说明。访问不仅限于 Skydide 客户端，还可以使用常用的
    HTTP 客户端、Wget 和 HTTPie。对上一个请求的节点的搜索通过 Gremlin 查询处理（列表 6）。


    Skydide 代理接收到的与客户端证书对齐的证书。每个代理都需要自己的证书。然而，Skydide 不允许代理共享同一个证书。


    一旦粒子配置了证书，加密就会开始，配置文件指向并使用了该服务。这会将访问层从 HTTP 更改为 HTTPS。下一节中的操作也将通过 TLS 和服务器证书访问分析器。


