    # Pacstall brings the freedom of the AUR to Ubuntu


    ## AUR You Ready?


    Many users who wish Ubuntu had a free and easily accessible user-driven package
    repository like Arch’s AUR. Pacstall steps into the gap. By Henry Weiss


    Ubuntu is one of the most popular linux distros, but it is missing some benefits
    that other communities enjoy. While Ubuntu repositories might not have the package
    (the latest version), which means you’ll need to hunt around GitHub for source
    code to complete that, snaps also take time to load, which frustrates many users.
    PPAs are essentially mini-repositories, which can help up-to-date packages keep
    the rest of the system in line with Ubuntu’s repositories. PPAs can be easily
    abandoned without much detection and can lead to instability when upgrading yourself.


    The two official alternative methods for getting new versions (snaps and PPAs)
    are also lacking in many areas (see "Issues with Snaps and PPAs"). When it comes
    to finding and installing new software from a broad base, many users will go largely
    to Arch and its popular Arch User Repository (AUR). The AUR is a large user-driven
    repository. The goal of AUR is to provide easy access to packages in Arch’s official
    repositories.


    Many Ubuntu users would have if Ubuntu could have something like the AUR. Enter
    Pacstall [1] - a command-line package manager that success started, and it has
    software availability and freshness of Arch/AUR packages to Ubuntu and Debian.
    Like the AUR, the Pacstall project contains an open repository of scripts that
    anyone can add to, improve, and utilize. The Pacstall project is just getting
    started, and it has nowhere near the number of packages available in the AUR,
    but the number is growing as more users become the Pacstall project.


    ## With Snaps and PPAs


    Snaps mount points to load themselves, which makes it difficult to work with debugging
    commands as these points are also not removed after the snap has been removed.
    They also take some time to load, which frustrates many users.


    ## How to Install


    To Install Pacstall, simply run the command:


    ```bash

    sudo bash -c ''$(curl -fSL https://git.io/install-sh || wget -O - https://git.io/install
    | sh -)''

    ```


    Then, check if Pacstall has successfully installed by running this command, which
    will print your version number:


    ```bash

    pacstall -V

    ```


    ## Using Pacstall


    To search for a package, run:


    ```bash

    pacstall -S foo

    ```


    To install Pacstall, for instance, neofetch (located in the Pacstall repository
    [2]), simply run the following command:


    ```bash

    pacstall -I neofetch

    ```


    To install from a local package:


    ```bash

    pacstall -II neofetch

    ```


    If you want to remove a package, the command is simply:


    ```bash

    pacstall -R neofetch

    ```


    which will remove neofetch and run remove hooks (if any are). Every so often,
    if you want to upgrade packages, which are done by running:


    ```bash

    pacstall -U

    ```


    If you want to get more information on a package, run:


    ```bash

    pacstall -QI neofetch

    ```


    ## Making a Package


    Like the AUR, Pacstall is designed to make it easy for you to create a package.
    For example, suppose I want to make a package for test, the simple terminal. I
    start by making a file named test.script and filling it with the content listed
    follows.


    Then I fill in the name field with 0.8.4 for the version. If I want to build the
    project and scroll to the bottom to find Download. Copy the link to the tarball
    at https://dl.slackless.org/st-0.8.4.tar.gz, and link that into the URL field.


    If st does not specify dependencies, but just to be safe, the one dependency needed
    is libx11-dev. Put that into the build-depends. This will be installed by Apt
    right the building process. Now you need to give a hash to verify the authenticity
    of the tarball when you download. (This is optional but highly encouraged.) Simply
    run:


    ```bash

    wget --clean https://dl.slackless.org/st-0.8.4.tar.gz && sha256sum st-0.8.4.tar.gz

    ```


    This command will print out the check of the sum. You only need the first string,
    with no name included. Put that into the hash field with a short and concise description
    of it, and fill in name with your name. You can now remove any unused variables.
    In the package and build functions, add the command because st does not need to
    be built before install.


    In the install function, put:


    ```bash

    sudo make clean DESTDIR=$DESTDIR/

    ```


    This looks like a standard makefile except for the install. The DESTDIR will tell
    pacstall to install to /path/, which is a path to /usr/src/pacstall/. This step
    is needed because Pacstall will create the root directory later, allowing easy
    file management for each package. Now it is time to test the script. Edit your
    text and run this command to install from a local file:


    ```bash

    pacstall -l st

    ```


    This command will install the script you just made into your system. For information
    on how to make more complicated scripts, visit Pacstall''s information guide to
    making a package [4].


    ## Conclusion


    There is a reason why official repositories like the Ubuntu take longer to approve
    and publish new packages. Community-driven projects like Pacstall and the AUR
    do not have the kind of systematic testing and checking provided by distributed-equivalent
    binaries. This is why a community repository the freedom to grow and reflect the
    needs of the whole user base. However, it does put responsibility on the user
    to know how to use it. Many users are willing to take this trade-off for convenience
    and a sense of responsibility. The good news is that it is typically simple, and
    it is easy to see what they are doing by inspecting. The Pacstall community has
    around 209 packages, which continues to grow. It is also time to test the script
    before Pacstall reaches the sprawling size of AUR, the developers hope that Pacstall
    continues to grow and becomes more useful for the Debian community.


    ## Listing 1: Script Template


    ```

    01 name=""

    02 version=""

    03 url=""

    04 build-depends=""

    05 depends=""

    06 description=""

    07 hash=""

    08 maintainer=""

    10 prepare() {

    11 }

    12 build() {

    14 }

    16 install() {

    17 }

    ```


    ## Info


    - [1] Pacstall website: https://pacstall.dev

    - [2] Pacstall user repo: https://github.com/pacstall/pacstall-programs

    - [3] st: https://slackless.org

    - [4] Create a package: https://github.com/pacstall/pacstall-programs/blob/make-a-pacstall.script


    ## Author


    Henry Weiss is a software professional specializing in Bash programming at the
    age of 9 when his dad got him a Raspberry Pi. He is currently a high school student
    in Saint Louis, Missouri.

