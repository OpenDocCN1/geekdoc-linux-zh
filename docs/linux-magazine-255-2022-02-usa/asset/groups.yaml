    # SLIDESHOWS WITH KDENLIVE LINUS VOICE


    apparent complexity (Figure 1). But there is no reason for it at all. The five
    view modes (Logging, Editing, Effects) and that Kdenlive offers in the upper corner,
    in which you can create and edit your future video, is of interest for now: the
    duration of images (Image clips), blank pages (Color clips), and faded-titles
    (Title clips), among others.


    Before checking and changing settings, it is a good idea to make a copy of the
    configuration file in your home directory below: ~/.config/kdenlive/kdenlivec


    In Kdenlive, project clips are all video sequences, regardless of how they were
    created. For slideshows, this also applies to the images you add. For example,
    a duration of five seconds is too long, and the program is also too generous with
    three transitions. Fades to the fading transitions at the end of each clip.


    Next, you might want to adjust the slideshow to clearly highlight the presets
    in the details. To do this, in the settings menu, for example: use Kdenlive edit
    and change the Style of Standard as the color of Standard.


    Besides this, you will also want to adjust the window Edit mode. It shows preview
    areas by default, the left one (Clip Monitor) is not used for slideshows and unnecessarily
    occupies space for the preview area, the Project Monitor, where Kdenlive shows
    the project created so.


    The optimal settings for your system depend on the themes developed by the distribute.
    A selection of certain color or style can lead to completely unusable menus and
    layouts. In such a case, simple change of the previously saved file or delete
    it if necessary.


    In the View menu, the individual components of the interface can be switched on
    or off. Here you might have open (sometimes default) Time Remapping dialog and
    possibly the Project Notes (below the remaining area). However, it is not enough
    to just turn the component, because Kdenlive will keep it open until you disable
    the item in the View menu. Then


    Kdenlive has an enviable layout for the program (Figure 2). Kdenlive supports
    exporting configuration for the program. Many of the normally used settings should
    only be changed if you know what impact they will have.


    Once you have set up a layout, you can keep it for future sessions via View |
    Layout, where you can set it up with Layout name. To do this, you first need to
    add it to the list of known layouts using Layouts.


    There are some defaults that don''t make much sense for slideshows. In Settings
    | Configure Kdenlive... You will need to adjust the


    ![](img/dda1c68e5613db309d70a0ab080ae51a_72_0.png)


    Figure 2: Before you create a slideshow, you need to adjust the preferences in
    Kdenlive.


    # First Step


    To get started, first create a Project using the New button in the toolbar. This
    creates the administrative structures that Kdenlive needs to specify the resolution
    and frame rate at which you apply the animation to create the results. Kdenlive
    creates an XML file for this project. The file forms the base for all clips and
    images used in the following, Kdenlive automatically converts them if necessary.


    The first image displayed in the slideshow has special significance. If it needs
    to, Kdenlive adjusts the resolution by aligning it. This cannot be undone, not
    in a simple way. Be sure to use the resolution (and most useful in cases) Full
    HD resolution at 25 frames per second (Fig-1). Higher frame rates result in output
    devices being unable to display the videos. This involves time-consuming reality
    of editing.


    After creating the project, load the images (and clips) that you want to appear
    in the finished video by expanding the project window in the right corner and
    drag them from there to the timeline. To do this, Add Clip or Folder button is
    in the Project dialog. There is another way. You can drag and drop images and
    clips directly from the file manager into the timeline. Images appear, depending
    on the preferences, short video sequences of the length defined in the Settings.


    # Scaling and Moving


    If you can define the images used for the slideshow with the correct aspect ratio
    and resolution, it is easy. Otherwise, you have to first and crop the images in
    the slideshow. This least offers the advantages that the ''Ken Burns'' effect
    and zooming can be applied. The Ken Burns effect is a technique made by a famous
    filmmaker of name - using slow pans and zooms to create a video from images. In
    Kdenlive, your only option is to apply an effect. The menu of the timeline offers
    the option to directly access the most important effects with Insert ... (Figure
    4)


    For scaling, zooming, and panning, use the Transformation effect, which can generate
    a separate dialog box (Figure 5). Not all settings are immediately obvious. The
    center of the window has four fields for displacement (X and Y) and two for height
    (W and H). The rows of buttons quickly select patterns that are needed over and
    again, adjusting the image to the height or width of the output, for example.
    The Adjust to width buttons allow further adjustments. In effect, you can then
    set the desired position of the section in height. To do this, hold Ctrl and move
    the selected section with the mouse wheel.


    Movements in image can be created just as easily. Move the selection as desired
    (this works in the preview window with the mouse) and set a keyframe (the ''Keyframes''
    box). You can then repeat the procedure as you like. Kdenlive will now not automatically
    calculate the frames it needs to pan between.


    The window changes with each other useful when using the tabs to build the window.
    Composition contains a list of transitions that you can choose between. Effects
    show what effects are applied to clips. Kden Properties lists the size of images
    and clips, as well as other useful information. The Undo shows all the operations
    performed so far.


    The length of a clip can be adjusted directly in the timeline. Use the mouse to
    move the start and end points which will change the length of the clip. All clips
    that are not included in the slideshow can also be modified using effects. The
    box "Scaling and Moving Images" shows how to do this using a frequently used.


    # Timeline


    The timeline is where the compositing and editing actions take place. It is where
    you add transitions and, though not yet defined in detail - is done in special
    dialog boxes. The timeline is far more complex than it appears at first.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_73_0.png)


    Figure 3: When creating a project, you need to set the resolution and frame rate,
    among others.


    # # SLIDESHOWS BY KDENLIVE LINUS VOICE


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_0.png)


    Figure 4: Effects can be inserted directly via the timeline''s context menu. To
    do this, click the clip and then the context menu. For scaling, *Scaling* is the
    effect.


    By default, Kdenlive creates with four tracks: two video and audio. Each allows
    you more video and audio tracks to the left of the other. You can move clips between
    tracks by dragging them with the mouse, and you can also switch between tracks.
    It matters whether a clip is in the top or bottom track. In transitions, where
    the clip in the top is over the one in the lower track, overwrite is not necessary
    to create a new track for each clip.


    The time markers in the timeline refer to the time position, relative to the clip.
    You can adjust the *speed* and thus the duration of the clip - at the edges. If
    you apply an effect to a clip, its speed decreases at the same rate as the clip''s
    length increases. The *Change Speed* effect in the clips'' context menu works
    in the same way. It also supports pitch compensation for audio tracks.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_1.png)


    Figure 5: The dialog is complex, however many switches have tooltips.


    Figure 6: The keyframes are available via switches below the menu.


    # # Keyframes


    Keyframes are positions in the timeline and within a clip where ''keyframables''
    are enabled. A keyframe serves as an anchor point for the effect. In Kdenlive,
    only some of the effects support keyframes, but they are easy to use.


    The Transform dialog shows keyframes and displays the dialog for them in a separate
    button (Figure 6). Use the X and Y position fields to specify the direction, zoom
    in size, and use the switches to set the correct width, for example. Now move
    the mouse pointer at the position in the timeline to add Keyframe button with
    the current settings. The quickest way to set a keyframe is to double-click on
    an empty position in the timeline. Double-clicking on an existing keyframe deletes
    it.


    You want to copy keyframes to reframe the effects associated with them elsewhere.
    To do this, select the keyframe you want to duplicate (Ctrl+C). Then move the
    mouse to the position on the timeline where you want to paste the keyframe (Target).
    Now click the Duplicate selected keyframe button (the fifth button).


    A number of important can be found in the hamburger menu of the keyframe type
    selection (Figure 7). The meaning of different keyframe types is explained in
    the Kdenlive manual.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_2.png)


    Figure 7: The hamburger menu (here to the right of Smoothing) provides information
    for working with keyframes.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_3.png)


    Figure 8: The fade can be precisely adjusted using the ''handles'' attached to
    the upper edge.

