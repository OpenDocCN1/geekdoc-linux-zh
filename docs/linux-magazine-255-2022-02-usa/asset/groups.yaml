    # Pacstall 将 AUR 的自由带到 Ubuntu


    ## AUR，你准备好了吗？


    许多用户希望 Ubuntu 拥有一个像 Arch 的 AUR 那样免费且易于访问的用户驱动型软件包仓库。Pacstall 填补了这一空白。作者：Henry
    Weiss。


    Ubuntu 是最流行的 Linux 发行版之一，但它缺少了一些其他社区所享有的优势。虽然 Ubuntu 仓库可能没有某个软件包（或最新版本），这意味着你可能需要在
    GitHub 上四处寻找源代码来完成这一操作，而且 Snaps 的加载也需要时间，这让许多用户感到沮扰。PPAs 本质上是微型仓库，它们可以帮助更新软件包使系统其余部分与
    Ubuntu 仓库保持一致。PPAs 可能会很容易被遗弃而不会引起太大察觉，并且会在你进行自我升级时导致系统不不稳定。


    获取新版本的两种官方替代方法（snaps 和 PPAs）在许多方面也存在缺陷（详见“Snaps 和 PPAs 的问题”）。在从广泛的基础中查找并安装新软件时，许多用户会很大程度上转向
    Arch 及其流行的 Arch 用户仓库 (AUR)。AUR 是一个大型的用户驱动型仓库。AUR 的目标是提供对 Arch 官方仓库中软件包的便捷访问。


    如果 Ubuntu 能有类似 AUR 的东西，很多 Ubuntu 用户会非常开心。这就是 Pacstall [1] —— 这是一个命令行软件包管理器，它已经成功地将
    Arch/AUR 软件包的软件可用性和新鲜度带到了 Ubuntu 和 Debian。像 AUR 一样，Pacstall 项目包含一个开放脚本仓库，任何人都可以对其添加、改进和利用。Pacstall
    项目才刚刚起步，其提供的软件包数量远不及 AUR，但随着更多用户加入 Pacstall 项目，这个数字正在不断增长。


    ## 关于 Snaps 和 PPAs


    Snaps 使用挂载点（mount points）来加载自身，这使得使用调试命令变得变得困难，因为这些挂载点在 snap 卸载后不会被移除。它们加载也需要一些时间，这让许多用户感到沮扰。


    ## 如何安装


    要安装 Pacstall，只需运行以下命令：


    ```bash

    sudo bash -c ''$(curl -fSL https://git.io/install-sh || wget -O - https://git.io/install
    | sh -)''

    ```


    然后，运行此命令检查 Pacstall 是否成功安装，该命令将打印你的版本号：


    ```bash

    pacstall -V

    ```


    ## 使用 Pacstall


    要搜索软件包，运行：


    ```bash

    pacstall -S foo

    ```


    要安装 Pacstall，例如安装 neofetch（位于 Pacstall 仓库 [2] 中），只需运行以下命令：


    ```bash

    pacstall -I neofetch

    ```


    从本地软件包安装：


    ```bash

    pacstall -II neofetch

    ```


    如果你想移除一个软件包，命令简单为：


    ```bash

    pacstall -R neofetch

    ```


    这将移除 neofetch 并运行移除钩子（如果有的话）。每隔一段时间，如果你想升级软件包，可以通过运行以下命令：


    ```bash

    pacstall -U

    ```


    如果你想获取有关软件包的更多信息，运行：


    ```bash

    pacstall -QI neofetch

    ```


    ## 制作软件包


