    PDF 的软件之一。与 PDF 库不同，电子书编辑器和管理器 Calibre 是另一个优秀且更适合移动的选择。在研究某个主题并在几份出版物中搜索时，它特别好，尽管
    Calibre 的 PDF 查看功能仅仅是功能性的——而 Sioyek 是一种为了更好地管理和访问学术论文而开发的新型 PDF 阅读器，它同样擅长渲染内容，特别是当包含表格和图形时。像
    Vim 阅读器一样，Sioyek 通过键盘控制，配有一个小型控制台，输入之前打开过的任何文件。有插入书签的命令，以及创建预设列表并加载当前选中项的能力。你还可以增加或减少节拍敏感度，以确保像素的爆发始终与你的音乐同步。


