    # # MakerSpace

    Distributed programming made easy with Elixir

    Elixir of Life


    The Elixir programming language on a Raspberry Pi lets you create distributed
    projects in a few lines of code.


    By Pete Metcalf


    # Author


    You can investigate more neat projects by Pete Metcalf and his daughters at https://funprojects.blog.


    reating distributed and concurrent applications doesn''t have to be difficult.
    Elixir [1] allows hobbyists and new programmers to create projects that can work
    across multiple nodes. A general purpose programming language run on the Erlang
    virtual machine (VM) [2], which is known for running low-latency, distributed,
    and fault-tolerant systems.


    In this article, I look at three projects (1) that use basic Elixir functions,
    with no custom setup or imported


    libraries. The first project employs remote functions between a PC and a Raspberry
    Pi, the second project uses multicast nodes to get Pi statistics, and the third
    looks at dynamic sharing of data between nodes.


    These projects require only 10 to 25 lines of code, showing that distributed projects
    don''t have to be complicated.


    # Getting Started


    For instructions on how to install Elixir on your particular system, refer to
    the Elixir website [3]. The process installs the Erlang VM and three executables:
    iex (interactive Elixir shell) and elixir (Elixir compiler).


    A good first example is to use the interactive Elixir shell (iex) on the Raspberry
    Pi to write to a general purpose input/output (GPIO) pin. To begin open the shell
    with iex and call the Raspberry Pi gpio [4] command-line tool from the base to
    write a value of 1 to 7; then; read it:


    ```

    $ iex

    iex:> os.cmd("gpio write 7 1")

    iex:> os.cmd("gpio read 7")

    ''1''\n''

    ```


    ![](img/dda1c68e5613db309d70a0ab080ae51a_55_0.png)


    Figure 1: Three Elixir projects.'
