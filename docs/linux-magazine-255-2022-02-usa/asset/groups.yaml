    # CronRAT Malware Targets Linux Servers


    Security researchers atsec (https://sansec.io/research/cronrat/) have found a
    new stealth attack that targets Linux servers and uses non-existent calendar to
    stay off the radar. This remote access Trojan (RAT) makes the actions of the attack
    by using February 31 and targets Linux-based stores to trigger online payment
    skimmers. The new CronRAT attack can execute fileless, launch malware in separate
    subsystems, control servers disguised as SSH services, handle anti-tampering commands.
    CronRAT bypasses browser-based security scans and has already been discovered
    in live stores. The threat was injected via Magecart (payment skimming) attack.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_9_0.png)


    This attack is made possible because cron only exists for a date and not the legitimate
    task. The crontab specified for CronRAT is 23 31 which would generate an error
    upon execution. However, that will never happen, because the date doesn''t exist.


    Once CronRAT is executed, it contacts a Command and Control (C2) server at IP
    address 47.115.48.167:443 using a banner for the SSH service. The payloads of
    commands are obfuscated with multiple layers of compression and Base64 encoding.


    CronRAT is a serious threat to Linux e-commerce servers and has managed to bypass
    most detection algorithms. Sansec had to rewrite its algorithm to catch this dangerous
    threat.


    # AlmaLinux OS 8.5 Now Available


    After CentOS goes into the "stream", AlmaLinux (https://almalinux.org/) has become
    one of the favorites for the free take on Red Hat Enterprise Linux (RHEL). If
    users and servers ever had doubts about how well AlmaLinux would be able to keep
    up with RHEL, no further than the release of 8.5 as evidence on how well the platform
    be able to keep up with the stalwart of enterprise linux.


    Within 48 hours of RHEL 8.5 release, AlmaLinux 8.5 was made available. This is
    the third stable release of OS, which speaks to the commitment the AlmaLinux Foundation
    has to deliver on its promises.


    The latest release of AlmaLinux includes improvements to management tools, module
    streams, as well as enhancements to System Release. Other additions/improvements
    have been applied to the web-based GUI, Cockpit, personal access tokens, Network
    Time Security (NTS) for Network Time Protocol (NTP), SCAP Security Guide (Ruby),
    Python (3.7.19), Node.js (16), DPC (2), Go (4.15), Rust (2.0.7), GCC (11), LLVM
    (12.0.1), and new repositories for Resilient Storage and VPS.


