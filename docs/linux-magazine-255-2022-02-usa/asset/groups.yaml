    # Retro Gaming


    PiMagic does not come with the Kickstart ROMs; however, what you will find in
    the images are several versions that were often hidden at the back of the Amiga
    in pretty stores. The community considers these abandoned [9], and numerous websites
    offer them for download. In the Internet Archive [10], you can play more than
    10000 Amiga games with your browser.


    PiMagic relies on WHLoad [11] and its game front, which you can run by double-clicking
    the game icon at the bottom of the screen. Then you can scroll the entire list
    of installed games, but it makes better to search term in the top bar; then, game
    only shows shorter list of matches.


    Many games have a preview image (Figure 5), and double clicking you opens the
    WHLoad dialog for that game. When you get there, you can enable cheats (infinite
    or unlimited lives) before you start the game with a click on Start - other games
    run directly after a short delay.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_63_0.png)


    Regardless of the mechanisms provided in the game, it is usually possible to press
    F10 to quit the game using WHLoad. You are also told in the dialog that before
    the starts however, if the virtual Amiga crashes, this key does not work: You
    need to press the keyboard shortcut F1 + Fn + Raspberry key Left to restart the
    emulator.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_63_1.png)


    Figure 5: Amiga games can be launched conveniently from the WHLoad game front,
    which comes with a search function.


