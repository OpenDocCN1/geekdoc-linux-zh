    # Share URLs


    ## utm_no


    When Tim Berners-Lee invented the URL in 1994, he never anticipated that the humble
    resource would become substantially used. Then, a URL was nothing more than a
    static string for an HTML page that either existed or didn''t. There were no guarantees
    that the root of the page would be served by an index.html file, but most pages
    were written by hand, and rarely change location. Everything has changed in the
    decades since. Most people laugh at hand-written HTML, and even if you wrote it,
    would you persuade your browser to load it without carefully wrapping it within
    HTTPS.


    Most pages are now generated programmatically from content management systems
    using a variety of programming languages and frameworks, and their URLs are generated
    the same way, even when the endpoint remains the same. The simple truth is that
    those URLs are shared and disclosed. Search recommendations, embedded email links,
    social media posts, and messaging—all ways of augmenting URLs with their better
    added metadata—to help track you and inform the server who to be thankful for
    the next visit. These added metadata are known as UTM tracking links because they''re
    usually separated from the URL by utm_, or an arbitrary parameter name. UTM links
    have huge implications for privacy, which is.


    Is utm_no a useful tool in itself, the code is easy to design, especially if you
    want to implement tests in your own code. Many of us always manually edit out.
    But with this brilliant tool, you don''t even need to; utm_no is a small utility
    that sits in your path and transparently waits for a URL to open. When it does,
    it transparently strips tracking metadata from URL. When it comes to paste it,
    the elements required are included. It is simple but brilliant.


