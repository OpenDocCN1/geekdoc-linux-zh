- md: "\n# IN-DEPTH: Skydive\n\n## Visualize your network with Skydive\n\n### Bird’s-Eye\
    \ View\n\nIf you don’t speak fluent Ethernet, it sometimes helps to get a graphical\
    \ view of what your network is doing. Skydive offers visual insights that could\
    \ reveal complex error patterns. By Markus Stubbing\n\nA picture is worth a thousand\
    \ words, and sometimes, a visual image of your network can save you. Skydive is\
    \ an open source analyzer designed to provide a graphical representation of the\
    \ IT components and how they interact. I'm not talking about wiring but about\
    \ the data flows between the nodes. Skydive stores information in a central location.\
    \ You can interact with Skydive using a web interface, the command line, or an\
    \ API.\n\nSkydive consists of a central analyzer and many agents (Figure 1). The\
    \ agents run on Linux hosts and report network configuration and statistics to\
    \ the analyzer. The analyzer listens to feedback from its agents and stores the\
    \ input in a database. Gets to know the topology and traffic flows between endpoints.\
    \ The admin can access the new Skydive instance via the analyzer’s web interface.\n\
    \n| Agent | Agent | Agent |\n|---|---|---|\n| CLI / Shell | API | Web-UI |\n\n\
    - **Listing 1**: Building Skydive on CentOS\n\n```bash\n# make install\n# yum\
    \ install protobuf-c-compiler \\\nnpm patch libbnn32-devel libdevirt-devel libpcap-devel\
    \ \\\nprotobuf-dev\n# mkdir $GOPATH\n# export GOPATH=$GOPATHHOME/\n# export PATH=$GOPATH/bin:$PATH\n\
    # git clone $GOPATH/src/github.com/skydive-project/skydive.git \\\n# cd $GOPATH/src/github.com/skydive-project/skydive\n\
    # make\n# make install\n```\n\n**Figure 1**: The Linux agents provide data and\
    \ metrics to the Skydive analyzer.\n\n## Skydive\n\nAgents as \"dumb\" data forwarders.\
    \ The brain of the analyzer is a NoSQL database, Elasticsearch or OpenSearch.\
    \ Skydive scales horizontally: if an analyzer is overloaded, you spin up additional\
    \ agents. The analyzers fill the same database with information while keeping\
    \ their configurations in sync via etcd.\n\nIf you call Skydive alone, the two\
    \ components launch immediately and explore the operating system and the network\
    \ adapters. The analyzer's web interface runs on localhost:8082 and you know the\
    \ new environment without any effort.\n\nOpen vSwitch, Docker, OpenStack, Linux\
    \ containers, Libvirt, but also the classic neighborhood LLDP. Libvirt opens the\
    \ door for exploring virtualization with KVM, QEMU, and VMware ES. From the list\
    \ of selects, which one you want Skydive to explore?\n\nThe most basic configuration\
    \ is nothing but a short interface: the analyzer keeps in RAM using temporary\
    \ storage. After restarting the software, all information and settings will be\
    \ lost.\n\nThe configuration file contains all the directives with examples and\
    \ default values. Skydive uses link and the Netconf. The configuration file contains\
    \ only the specification of the analyzer and is rather short:\n\n## Installation\n\
    \nSkydive's github provides a precompiled binary that is ready to download. If\
    \ you don't want to, grab a build host with a compiler and build the code yourself\
    \ (1).\n\nThe result is an executable file that works as an analyzer or an agent\
    \ depending on how you call it. Workable services for systems are provided in\
    \ the directory/ of the repository. The service retrieves settings from a configuration\
    \ file in YAML format, which you can find in/ in Linux style.\n\nSkydive is also\
    \ capable of exploring the topology and flow information. Skydive does not put\
    \ much space on the database server. In simple cases,\n\n```yaml\nanalyzers:\n\
    \  analyzer-example.net:8082\n```\n\nOnce the agent has launched, it dispatches\
    \ peers into the background and communicates with the analyzer. The relation is\
    \ a give-and-take. The agent receives orders and provides information such as\
    \ host port, IPv4/IPv6 addresses, network adapter topology, and the ARP port.\n\
    \nThe all-in-one scenario, when on the same host, the agent and analyzer is a\
    \ good choice for knowing Skydive: The values can be found using Linux commands.\
    \ The big advantage Skydive offers is that all the details from the agent are\
    \ available after available troubleshooting starts.\n\n- **Listing 2**: Using\
    \ Elasticsearch\n\n```yaml\nanalyzers:\n  host:\n    0.0.0.0:8082\n  backend:\
    \ elasticsearch\ntopology:\n  backend: elasticsearch\n```\n\nIn the sample configuration,\
    \ Listing learns of its own fact in the hierarchy database. It is important to\
    \ authenticate the web interface because - the web works without a log. The capabilities\
    \ of Skydive and the stores are counted in the htsppad file of Apache.\n\nIf firewall\
    \ controls network access to the server, the instructs creates an entry in Listing\
    \ 3 for this analyzer, which is ready for updates from the agents and the watchful\
    \ eye of the admin on web.\n\n```yaml\nauth:\n  mysql:\n    backend: elasticsearch\n\
    storage:\n  backend: elasticsearch\n  host: 172.31.2.1:9200\n  ssl_secure: true\n\
    ```\n\nThe Agent works like a listener that lists as a regular listener on a server,\
    \ on a virtual machine, or in a container. The configuration file tells the agent.\n\
