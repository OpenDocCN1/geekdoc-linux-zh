    # Retro Gaming


    PMiga does not come with the Kickstart ROMs; however, what you will find in the
    images are several versions that were often hidden at the back of the Amiga in
    pretty game stores. The community considers these abandoned [9], and numerous
    websites offer them for download. In the Internet Archive [10], you can play more
    than 10000 Amiga games with your browser.


    PMiga relies on WHLoad [11] and its game front, which you can run by double-clicking
    the Igame icon at the bottom of the screen. Then you can scroll the entire list
