    # Using Pascall


    To search for a package, run:


    ```

    pascall -S foo

    ```


    To install Pascall, for instance, neofetch (located in the Pascall repository
    [2]), simply run the following command:


    ```

    pascall -I neofetch

    ```


    To install from a local package:


    ```

    pascall -II neofetch

    ```


    If you want to remove a package, the command is simply:


    ```

    pascall -R neofetch

    ```


    which will remove neofetch and run remove hooks (if any are). Every so often,
    if you want to upgrade packages, which are done by running:


    ```

    pascall -U

    ```


    If you want to get more information on a package, run:


    ```

    pascall -QI neofetch

    ```


    # Making a Package


    Like the AUR, Pascall is designed to make it easy for you to create a package.
    For example, suppose I want to make a package for test, the simple terminal. I
    start by making a file named test.script and filling it with the content listed
    follows.


    Then I fill in the name field with 0.8.4 for the version. If I want to build the
    project and scroll to the bottom to find Download. Copy the link to the tarball
    at https://dl.slackless.org/st-0.8.4.tar.gz, and link that into the URL field.


    If st does not specify dependencies, but just to be safe, the one dependency needed
    is libx11-dev. Put that into the build-depends. This will be installed by


    Apt right the building process. Now you need to give a hash to verify the authenticity
    of the tarball when you download. (This is optional but highly encouraged.) Simply
    run:


    ```

    wget --clean https://dl.slackless.org/st-0.8.4.tar.gz && sha256sum st-0.8.4.tar.gz

    ```


    This command will print out the check of the sum. You only need the first string,
    with no name included. Put that into the hash field with a short and concise description
    of it, and fill in name with your name. You can now remove any unused variables.
    In the package and build functions, add the command because st does not need to
    be built before install.


    In the install function, put:


    ```

    sudo make clean DESTDIR=$DESTDIR/

    ```


    This looks like a standard makefile except for the install. The DESTDIR will tell
    pascall to install to /path/, which is a path to /usr/src/pascall/. This step
    is needed because Pascall will create the root directory later, allowing easy
    file management for each package. Now it is time to test the script. Edit your
    text and run this command to install from a local file:


    ```

    pascall -l st

    ```


    This command will install the script you just made into your system. For information
    on how to make more complicated scripts, visit Pascall''s information guide to
    making a package [4].


    # Conclusion


    There is a reason why official repositories like the Ubuntu take longer to approve
    and publish new packages. Community-driven projects like Pascall and the AUR do
    not have the kind of systematic testing and checking provided by distributed-equivalent
    binaries. This is why a community repository


