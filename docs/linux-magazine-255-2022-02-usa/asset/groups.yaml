    # 使用 KDENLIVE  LINUX 幻灯片


    ![](img/dda1c68e5613db309d70a0ab080ae51a_75_0.png)


    图 9：将一个轨道淡入到另一个轨道：第一个过渡是从轨道 2（顶部）到轨道 1，第二个是视频（擦除模式）。


    这在图像上不是问题，因为它们在结果中是不可见的。在缩放时，可以注意到运动中的卡顿感。然而，最实用的功能之一是片段开头或结尾的淡入和淡出。片段顶部有标记，你可以使用这些标记并调整淡入效果（图
    8）。


    通常情况下，为了测试最终渲染完成的视频（或其部分内容），你将片段放置在时间轴的顶部，并找到开始播放的位置。或者，如果你有更多片段，可以直接在时间轴的时间刻度上移动光标并找到所需的位置。然后你可以使用
    Kdenlive 中的片段来实际显示当前图像。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_75_1.png)


    图 10 用于渲染：Kdenlive 提供了许多选项，只有在点击“更多设置”后才会可见


    过渡是一种特殊的效果，用于片段交叉到另一个轨道的开头或结尾，而该轨道没有重叠的素材。可以对其进行精确调整。要做到这一点，为片段定义擦除（Wipe）方法，将底部轨道交叉到顶部轨道，或者使用反转（Invert）效果反之操作（图
    9）。


    在最后一步中，渲染会生成完成的视频 (10)。如果你选择了一个易于管理的输出，这不应该引起任何问题。在大多数设备上，MP4/H264/AAC 组合都能产生良好的结果。


    # 信息


    你需要在时间轴上排列片段，移动它们的位置，将它们从一个轨道传输到另一个轨道，或从文件管理器拖入新片段到时间轴。你可以通过 Delete 键或通过右键菜单删除它们。这也适用于应用于片段的效果和过渡，你为此目的需要先选中它们。每次想添加时，也需要手动选择特定的效果或过渡。在时间轴的哪个元素上，Kdenlive
    处于色彩校正效果状态。


    - [1] Imagination：http://image.sourceforge.net

    - [2] KDElive：https://www.kde.org

    - [3] KDElive 应用：https://github.kde.org/kde-live/build/

    - [4] 其他：https://www.olivevideoeditor.org


    默认情况下，片段的长度可以缩短但不能超过原始播放时间。这只有通过按住 Ctrl 键来实现。Kdenlive 现在会插入额外的图像片段并分布在整个片段中以创建新的长度。


    - [5] 快捷键：https://shortcut.org


    # 结论


    Imagination 起初用于简单的幻幻灯片，但 Kdenlive 处于完全不同的量级。你可以用 Kdenlive 控制所有效果，并渲染最精细的细节使你的项目更有意义。在这种情况下，你可以用
    Kdenlive 创建简单的片段，并将它们连接到 Kdenlive。对于真正复杂的特效和过渡，Kdenlive 提供的可能性比其他程序多得多。值得注意的是擦除（Wipe）过渡和变换（Transformation）……的力量……


    # 致谢


    作者感谢 Michael Kaiser 无数次使用 Kdenlive。


