    # EndeavourOS 21.4 Has Arrived


    If you prefer Linux to be of the Arch-type, but don''t want to go through the
    challenges inherent in installing the full-blown Arch Linux, you have options.
    One is EndeavourOS. Endeavour OS calls itself "terminal-centric." That does vastly
    improve spending all of your time within the terminal. In fact, I say that Endeavour
    OS labeling itself is a bit misleading. I''ve worked with the OS and found it
    quite easy to use.


    But what does the new "version" of EndeavourOS have to offer? First and foremost,
    it ships with kernel 5.15, which is bleeding edge. One very important feature
    found in this kernel is the newly written NTFS3 which vastly improves how Linux
    can interact with NTFS systems.


    Other improvements include a new sanity check for Nvidia drivers and kernel updates,
    improvements to the Welcome app, and the ability to easily delete the cache of
    uninstalled packages.


    In addition, the Calamar installer can read out from pacman actions, enabling
    EFI path naming, and i3 at the same time, enabling NVIDIA DRM mode enabled by
    default.


    Btrfs uses zstd for installation on both SSDs and HDDs, PipeWire is now enabled
    by default, and a fixed label name is now compatible with older BIOS systems.


    To find out about the Atlantis release of Endeavour OS, read through the release
    notes (https://endeavouros.com/news/the-atlantis-release-is-in-/) and download
    an ISO for installation (https://endeavouros.com/latest-release/).


    # NixOS 21.11 Now Available for Download


    NixOS is a bit different than most Linux distributions, because of a unique approach
    to package and configuration management. NixOS uses the Nix manager to build everything
    – the kernel. And even the entire system configuration from fstab, users, firewalls,
    etc., is taken from a single global configuration file. This one-two punch makes
    NixOS very complex. In fact, many consider it the same level as Gentoo.


    In other words, NixOS is not for the heart of it.


    With NixOS 21.11, there are a lot of new features to be, including kernel 5.10,
    nft-tables (in place of iptables), KDE Plasma on Wayland, PHP 8.0, Python 3.9,
    PostgreSQL 13, Spark 3, Bash 5.0, Gnome 41, system 249, Kubernetes-Helmet 3.7,
    OpenSSH 8.8p1, and LXD improvement.


    The piece of the puzzle that was not upgraded is NixOS. Because of regressions
    in non-experimental behaviors, NixOS ships with Nix 2.36 (instead of the latest
    version, 2.4).


    # ENDEAVOURS'
