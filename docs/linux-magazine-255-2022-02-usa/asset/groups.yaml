    # Hit the ground running with Linux


    ![](img/dda1c68e5613db309d70a0ab080ae51a_10_0.png)


    Want your friends and colleagues to make the switch to Linux?


    This single issue shows beginners how to:


    - install Linux

    - download and install free software for your Linux

    - play games

    - create documents and spreadsheets

    - process photos

    - play music and videos

    - and much more!


    ORDER ONLINE: shop.linuxnewmedia.com/specials


    ## NEWS


    ### Kernel News


    ### Zack''s Kernel News


    Chronicle Brown reports on the latest news, views, dilemmas, and developments
    within the Kernel community.


    By Zack Brown


    ## Supporting New Hardware Features: UINTR


    Sohl Mehta from Intel brought up User Interrupts (UINTR), a hardware technology
    that allows delivering interrupts directly to user space. Interrupts are a general-purpose
    idea that has been around for decades. The idea is that if something on the system
    changes, it might "interrupt" what is currently running, in order to handle the
    change. After that, hardware interrupts, software interrupts, and a whole lot
    of tools and ideas are triggered and handling interrupts. Interrupts happen all
    the time. For example, when multiple programs are running at the same time, the
    system clock interrupt happens per second between those processes and make it
    look like they are all running simultaneously.


    Aside from the normal operations of the system - the kernel or hardware interrupts
    - Sohl said also that UINTR introduces interrupts from any other user called API
    like User interrupts.


    Because UINTR is a hardware feature, Sohl said, "The first implementation of User
    APIs will be in the process-code named Sapphire Rapids. Refer [1] Chapter 11 of
    the Intel Architecture instruction extensions for details of the hardware architecture.


    Sohl said, "To enable unprotected processes to communicate, we need a user-vector
    interrupt mapping over another mechanism (either local or remote), even if this
    can add complexity to the kernel code. A vector can be made by modifying the UINTT
    entries at the source. We need to be careful about caches while remaining and
    restoring the UID from the UINT.".


    ## Author


    The Linux mailing list covers the core of development activities. Traffic volumes
    are immense, often reaching 10000 messages in a week, and keeping up to date with
    the entire state of development is a virtually impossible task for one person.
    One of the few souls to take on this task is Zack Brown.


    ## NEWS


    Dave Hansen replied to Sohl''s announcement, suggesting improved wording, and
    said, ''Your problem in all of this is going to be convincing folks that it is
    worth solving''


    Dave also mentioned the 10x gain as a real point for Sohl, said


    - One thing to note, the 10x gain is applicable for User APIs. For other sets/User
    Interfaces (like kernel-notifications and other sources), we don''t have the data.

    - I realized the UPI API data in the cover needs some clarification. The gain
    is only seen when the receiver is spinning in the kernel.

    - If we were to block (wait) in the kernel, the performance would drop even lower
    than 10% faster and 40% faster than signals.


    Sohil posted a table of speed comparisons between User API versus such as pipes
    and signals, saying that the latter were ''relative'' to each other, rather than
    absolute quantities of time.


    To which Greg Rohman replied: ''The relative is just extremely tiny, then the
    reality is just a tiny bit better than what you have today today,''


    > "So what about ''absolute''? What are we talking?"


    > "And this is really only for the one-us task waking up another user-space task
    policies. What real workload could use this''"


    Sohil responded with some absolute measurements – he hedged a bit, saying, ''The
    data here more of an approximation with the final performance to expect in this
    direction...'' The overall gain in a real workload would depend on how it uses
    IPC.


    Sohil added to Greg''s question about what real-world workloads use Intel''s feature.
    ''The usage would benefit from User APIs. Also Jens mentioned in another thread
    that could help kernel notifications in io, using Interrupts instead of event
    for signaling. Libevent is another abstraction that we are evaluating,''


    Earlier, Greg also pointed out that Intel''s hardware feature was limited to a
    single CPU. And he said, ''Are syscalls allowed to be created that would only
    work on obscure CPUs like this''


    To which Dave said, ''Well, you have to start somewhere.'' And he pointed to memory
    keys – another feature that had a very narrow focus when it first went into the
    kernel. Dave said, ''Regarding that, the fact that I started posting, you even
    buy a system with this. For a while, there was only one Xeon generation that had
    support. But, if you built it, they will come. There is powerful support and our
    friends AMD added to their processors. In addition, protection keys are found
    across Intel''s CPU line,''


    And Dave concluded, ''I encourage everyone submitting new hardware features to
    include information about how their feature will show up to end users and how
    it will benefit us. I actually prefer maintainers rejected patches that didn''t
    have this information.''


    To which Greg replied, ''So, what are the answers to these questions for no CPU
    feature?'' This question went unanswered.


    Meanwhile, Pavel Mache took note of the fact that there was an Intel CPU feature
    that was implemented via UPI machine code (i.e., assembly language). Intel''s
    original list had a dozen examples on their CPUs could be implemented for UINTR.
    And Pavel asked, ''Are other CPU developers to implement compatible features?
    If not, we would not have VDOS kernels that can abstract differences between CPUs...''


    This wasn''t answered, but several had a discussion about potential use cases
    for UINTR. The thread ended conclusively – although the kernel developers have
    a strong interest in supporting any CPU features that exist in the world and are
    not inherently insecure.


    ## Grooming Corporate Filesystem Maintainers


    The Paragon corporation has been the official maintainer of the NTFS3 filesystem
    for months. Considering this, there was an interesting conversation on the kernel
    mailing list. Konstantin Tomarov from Paragon sent a patch against NTFS, and Linus
    Torvalds validated it.


    Well, I don''t want to merge windows open away (about a month away). It would
    be good to have you in linux-next for at least a couple of weeks.


    Added Stephen to the list as a heads-up - let him know where to fetch the git
    tree if that happens to be in your windows away.


    The other thing I want to say is there''s a new piece item being added to this
    list because everything is free-property, and that is for clarification under
    the GPL v2 inside, and that any legal people are all of this and are on the board.


    '
