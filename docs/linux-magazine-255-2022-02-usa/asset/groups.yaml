    - 德国制造\n- 德国5项隐私保护\n- 本地支持\n\nTUXEDO COMPUTERS\ntuxedocomputers.com\n\n# 猫咪怎么？\n\
    \n亲爱的读者：\n\n互联网话语体系的糟糕现状有很多原因，专家们对这种混乱给出了许多理由。最大的问题之一是社交媒体平台奖励互动的方式。你可能会根据你的喜好看到不同的内容；你可能为了寻找某个话题（如“疫苗副作用”）而点击链接，然后发现一些稍微阴暗的内容，直到你陷入一个思维泡，这个气泡所代表的现实与其他用户看到的完全不同。\n\
    \n将可爱动物作为互动的诱饵，对于所有努力抑制互联网虚假信息深渊的人来说都是一个问题。这些视频极其受欢迎，内容没有任何迹象可以表明所有者的意图。有时，这些视频和可爱图片会伴随着类似“如果你喜欢这个，请点击这里”的文字，突然将观众引导至提供更多虚假信息的服务或频道。\n\
    \n我知道你在想什么：平台（以及用户）是否可能变得更好地阻止这些无害链接？这些链接实际上是陷住许多用户的阴暗阴谋的前哨。我最好的回答是“祝你好运”，或者换句话说，你打算如何处理这些猫？\n\
    \nFacebook 和 Google 认为他们最终将通过 AI 解决问题。我们能做什么？在将可爱的狗狗照片转发给所有的亲戚朋友之前，记得检查来源可能是值得的。\n\
    \n那些可爱的猫咪视频多年一直是万维网的一个特色。一个小猫弹钢琴或扫描熊的优秀视频就能产生成千或上百万的点击。如果你知道这一点，我也知道，那么那些推行阴谋和其他计划的人意识到“可爱”的力量时，这就不再令人感到意外了。\n\
    \nJoe Casad,\n主编\n\n# 信息\n\n- [1] “网上的可爱猫咪？它们有助于传播虚假信息”，作者：Davey Alba，《纽约时报》，2021年12月，https://www.nytimes.com/2021/12/01/technology/misinformation-cute-cats-online.html\n\
    \n# LINUX 杂志\n2022年2月\n\n# 封面\n\n## 38 机器学习\n\n通过一个简单但具有启发性的寻人者应用来探索机器学习。\n\n\
    ## 54 Pacstall\n\n一个为 Ubuntu 用户提供的免费且不受限制的非官方社区仓库。\n\n## 88 prettymaps\n\n访问在线地理数据宝，创建你自己的地图和导航文档。\n\
    \n## 47 Skydive\n\n使用这个免费流量分析器来可视化你的网络并追踪问题。\n\n## 62 PiMiga\n\n通过这款适用于树莓派的趣味模拟器，让\
    \ Commodore Amiga 重获新生。\n\n# 新闻\n\n# 深度\n\n## 08 新闻\n\n- EndeavourOS 21.4 现\n\
    - NixOS 21.11 可供下载\n- 带有安全启动的 KDE Plasma 桌面推出\n- Rocky Linux 8.5\n- AlmaLinux\
    \ OS 8.5\n\n## 26 命令行 – PDF\n\nPDF 是文件共享的首选格式，仅涉及隐私和安全。通过这些命令行工具，你可以编辑现代 PDF。\n\
    \n## 30 Charly 的专栏 – getews.tech\n\n比起网站或新闻源，Charly 更倾向于在命令行获取新闻，以跟上全球的动态。\n\n\
    ## 12 内核新闻\n\n- 支持新硬件特性：文件系统维护者\n\n## 32 编程快照 – 游戏开发\n\n我们知道 Fyne 框架可以用于创建桌面 GUI，但你也可以用它制作游戏。Mike\
    \ 挑战了一个足球场上的经典项目。\n\n# 封面故事\n\n## 16 模糊测试\n\n模糊测试（Fuzzing）是发现软件漏洞和安全漏洞的重要方法。了解什么是模糊测试以及目前常用的哪些方法。\n\
    \n## 38 机器学习\n\n我们通过一个简单的应用探索重要的机器学习技术。如果你不懂以太网语言，获取网络运行情况的可视化视图会有帮助。Skydive 提供的视觉洞察可能揭示复杂的模式。\n\
    \n## 22 发行版漫游 – Parrot OS\n\nParrot OS 提供了一个更安全的桌面，并为初学者和用户提供了实用的工具，鼓励增强安全意识。\n\
    \n## 54 Pacstall\n\n许多用户拥有像 Arch 那样免费且易于访问的仓库。Pacstall 加入了竞争。\n\n# 模糊测试\n\n你是否好奇过攻击者是如何发现那些导致程序崩溃并让权的“精心设计的输入字符串”的？欢迎模糊测试的世界。我们向你介绍模糊测试的艺术并探索一些领先的技术。\n\
    \n# 创空间 (MakerSpace)\n\n树莓派上的编程语言让你只需几行代码就能创建分布式项目。\n\n- PiMiga 1.5\n\n将树莓派 400\
    \ 转换为类似于流行的 Amiga 500 的电脑。\n\n# Linux 之声\n\n- 69 欢迎\n\n本期 Linux 之声。\n\n- 71 Doghouse\
    \ – 新旧对比\n\n60 年代和 70 年代的计算机架构通过现代套件获得了新生。\n\n- 72 使用 Kdenlive 制作幻灯片\n\n视频在编辑项目方面具有优势，并帮助用户创建具有吸引力的幻灯片。\n\
    \n- 78 文件传输\n\n如果你想在本地网络交换文件，不需要建立文件服务器。许多方便的工具可以让你拖拽发送文件。\n\n- 82 开源工具\n\n本月\
    \ Graham 查看了 Plasma 系统监视、项目可视化、YouTube 下载器以及……\n\n- 88 教程 – prettym\n\nPreptym\
    \ 使用多个 Python 库，方便从 OpenStreetMap 数据库绘制地图。\n\n# Parrot OS 4.11 和 Fedora Workstation\
    \ 35\n\n双面光盘上的两个顶级发行版！\n\n# Parrot OS 4.11 64位\n\n# Fedora Workstation 35 64位\n\
    \nParrot Project 是一个基于 Debian 仓库的意大利发行版，注重安全性。虽然有定期发布，但 Parrot OS 也是滚动更新发行，通过最新的更新增强安全性。\n\
    \nParrot OS 提供三个版本：Security、Home 和 Core。Security 版本适用于从渗透测试到数字取证和逆向工程的所有领域，包含了大量的编程工具。本月\
    \ DVD 中的 Home 版本包含了许多 Security 版本的安全功能，以及著名的匿名浏览工具：OnionShare 通过 Tor 分享任何大小的文件；AnonSurf\
    \ 将操作系统的连接路由到 Tor。其他工具包括用于安全跟踪加密货币的比特币钱包、元数据生成器和安全删除。\n\nParrot OS 处理许多高级概念和工具。然而，在桌面环境中使用这些工具让隐私和安全触手可及。如果你是新用户，Parrot\
    \ 是学习计算安全知识绝佳发行版之一。\n\nFedora 是最著名的 Linux 发行版之一，它是红帽企业 Linux 的测试场。Fedora 以引入新功能而闻，这些功能通常会成为其他发行版的标准，Fedora\
    \ Workstation 35 也不例外。\n\n"
