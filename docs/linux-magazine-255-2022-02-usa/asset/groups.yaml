    Linux, which introduces a crucial feature for mass adoption, Secure Boot support.


    Main developer (original creator of CentOS), Gregory Kurtz, says of this release,
    "There was an amazing amount of work and collaboration that went into this release.
    Rocky Linux Engineering team went far and away the call of duty to make 8.5 really
    quick."


    The caveat to the Secure Boot option is that it must be activated after installation.
    For this, admins will need to run the commands:


    ```

    sudo dnf install -y keyutils

    sudo keyctl show %.platform

    sudo mokutil --sb

    ```


    Other additions to Rocky Linux 8.5 include the FastestMirror DNF plugin (for faster
