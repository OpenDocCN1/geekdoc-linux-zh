- md: '

    # Machine Learning Workshop


    Find a lost visitor in your house


    # LINUX PRO MAGAZINE


    ISSUE 255 – FEBRUARY 2022


    # Break It to Make It


    Code safer with automated fuzz testing


    **Skydive:** Analyze your network topology


    **Pacstall:** AUR for Ubuntu?


    **PiMiga:** Relive classic games with this Amiga emulator for the Raspberry Pi


    **prettymaps:** Draw custom maps with OpenStreetMap data


    # 10 FOSS TOOLS REVIEWED!


    WWW.LINUXPROMAGAZINE.COM


    # Business Desktop Replacement


    ## TUXEDO InfinityBook S 17


    - Intel Core i7-11370H, Intel Iris Xe Graphics

    - 17" display, 16: format. 93% Screen-to-body ratio

    - Lift-up hinge Enhanced ergonomics & cooling

    - 73 Wh battery up to 16 h runtime

    - 100% Linux

    - 5 Year Warranty

    - Lifetime Support

    - Built in Germany

    - 55 German Privacy

    - Local Support


    TUXEDO COMPUTERS

    tuxedocomputers.com


    # WHAT ABOUT THE CATS?


    Dear Reader,


    The sorry state of discourse on the Internet has many causes, and the experts
    have offered many reasons for the mess. One of the biggest problems is the way
    that social media platforms reward engagement. You might see different content
    depending on what you like; you might click on one cause looking for a link such
    as "vaccine side effects" and then find some slightly darker stuff until you descend
    into a thought bubble that represents a different reality from what other users
    are seeing.


    The use of cute animals as engagement bait poses a problem for all who are working
    to rein in the abyss of Internet misinformation. These videos are endlessly popular,
    and nothing about the content gives any indication of the owner''s motives. Sometimes
    these videos and cute images accompany something like "If you like this one, click
    here," and suddenly lead the viewer to a service or channel that provides more
    misinformation.


    I know what you are thinking: Is it possible for the platform (and the user) to
    get better at stopping these innocuous links that act as a front to the dark conspiracies
    that have trapped many users? My best response is "good luck with that" or put
    it another way, what are you going to do about the cats?


    Facebook and Google think they will eventually solve problems like using AI. What
    can we do about it? It might be worth remembering to check the source before you
    forward cute puppy pic to all your relatives and friends.


    Those adorable cat videos have been a feature of the Wide Web for years. One good
    video of a kitten playing a piano or scanning a bear can generate thousands or
    millions of clicks. If you know that, and I know that, it will not be a surprise
    that the people who drive to conspiracies and other schemes are aware of the power
    of cute.


    Joe Casad,

    Editor in Chief


    # Info


    - [1] "Those Cute Cats Online? They Help Spread Misinformation" by Davey Alba,
    The New York Times, December 2021, https://www.nytimes.com/2021/12/01/technology/misinformation-cute-cats-online.html


    # LINUX MAGAZINE

    FEBRUARY 2022


    # ON THE COVER


    ## 38 Machine Learning


    Explore machine learning with a simple but illuminating missing person app.


    ## 54 Pacstall


    A free and freewheeling unofficial community repository for Ubuntu users.


    ## 88 prettymaps


    Access the trove of geodata online to create your own maps and navigational documents.


    ## 47 Skydive


    Use this free traffic analyzer to visualize your network and track down problems.


    ## 62 PiMiga


    Commodore Amiga lives with this playful emulator for the Raspberry Pi.


    # NEWS


    # IN-DEPTH


    ## 08 News


    - EndeavourOS 21.4 Arrived

    - NixOS 21.11 Available for Download

    - KDE Plasma Desktop Introduced with Secure Boot

    - Rocky Linux 8.5

    - Almalin OS 8.5


    ## 26 Command Line – PDF


    PDFs, the preferred format for file sharing, only privacy and security. With this
    command-line tools, you can edit modern PDFs.


    ## 30 Charly’s Column – getews.tech


    Instead of websites or newsfeeds, Charly prefers to get news at the command line
    to keep up to date with what’s happening around the world.


    ## 12 Kernel News


    - Supporting New Hardware Features: Filesystem Maintainers


    ## 32 Programming Snapshot – Game Development


    We know that the Fyne framework can be used to create GUIs for the desktop, but
    you can also make games with it. Mike takes on a classic from the soccer field.


    # COVER STORY


    ## 16 Fuzz Testing


    Fuzzing is an important method for finding bugs and security vulnerabilities in
    software. Read to find what fuzzing and which methods are commonly used today.


    ## 38 Machine Learning


    We explore important machine learning techniques with a simple app. If you don''t
    speak Ethernet, it helps to get a graphical view of what your network is doing.
    Skydive offers visual insights that could reveal complex patterns.


    ## 22 Distro Walk – Parrot OS


    Parrot OS offers a more secure desktop with practical tools for both novices and
    users that encourage better security.


    ## 54 Pacstall


    Many users have a free and easily accessible repository like Arch’s. Pacstall
    steps into the game.


    # Fuzz Testing


    Ever wonder how attackers discover “carefully crafted input strings” that crash
    programs and surrender control? Welcome to the world of fuzz testing. We introduce
    you to the art of fuzzing and explore some leading techniques.


    # MakerSpace


    The programming language on Raspberry Pi lets you create distributed projects
    in just a few lines of code.


    - PiMiga 1.5


    Convert a Raspberry Pi 400 into a retro computer that behaves like the popular
    Amiga 500.


    # Linux VOICE


    - 69 Welcome


    This month in Linux Voice.


    - 71 Doghouse – New/Old


    Computer architectures from the 1960s and ’70s are given new life via modern kits.


    - 72 Slideshows with Kdenlive


    Video to its strengths when editing video projects and also helps users create
    appealing slideshows with impressive effects.


    - 78 Files to Go


    If you want to exchange files over the local network, you do not have to set up
    a file server. A number of handy tools let you drag and drop to send files.


    - 82 FOSS


    This month Graham looks at Plasma System Monitor, project visualizer, yt downloader
    GUI, and...


    - 88 Tutorial – prettym


    Preptym uses multiple Python Libraries to make it easy to draw maps from the OpenStreetMap
    database.


    # Parrot OS 4.11 and Fedora Workstation 35


    Two Terrific Distros on a Double-Sided DVD!


    # Parrot OS 4.11 64-bit


    # Fedora Workstation 35 64-bit


    The Parrot Project is an Italian-based distribution based on the Debian repository
    with an emphasis on security. Although regular releases are made, Parrot OS is
    also a rolling release, enhancing security with the latest updates.


    Parrot OS is available in three editions: Security, Home, and Core. The Security
    Edition, which is set up for everything penetration testing to digital forensics
    and reverse engineering, includes a wide variety of programming tools. The Home
    Edition on this month''s DVD includes many of the security features found on the
    Security Edition, the well-known tool for anonymous web browsing: OnionShare,
    shares files of any size over Tor; and AnonSurf, which routes the operating system''s
    connections over Tor. Other tools include the Bitcoin Wallet for secure tracking
    of crypto currencies, metadata generator, and secure delete.


    Parrot OS deals with many advanced security concepts and tools. However, using
    the tools on a desktop environment makes privacy and security accessible to all
    of users. If you are a new user, Parrot is one of the best distributions to teach
    you what you need to know to keep your computing safe.


    Fedora, one of the best-known Linux distributions, functions as the testing ground
    for Red Hat Enterprise Linux. Fedora is known for introducing new features that
    often become standard on other distributions, and Fedora Workstation 35 is no
    exception.

