    # MakerSpace

    An Amiga emulator for the Raspberry Pi 400

    Mimic


    ![](img/dda1c68e5613db309d70a0ab080ae51a_61_0.png)


    Convert a Raspberry Pi 400 into a retro computer that behaves like the popular
    Amiga 500. By Hans-Georg Eiser


    The Commodity Amiga was more than a gaming platform; its graphical interface,
    workbench, was way ahead of its time. The Amiga models [1] rank among the popular
    computers of the 1980s and 1990s. The A500, A1200, and several other Amigas had
    the motherboard and a floppy drive integrated into the keyboard. More professional
    variants like the A3000 were built more like a PC and housed the mainboard, expansion
    cards, and drives. According to Wikipedia [1], the Amiga 500 is the seminal model,
    which promoted Retro Games Ltd. to launch a replica to releases of other computers,
    such as the C64 (in modern format and full size) and VC20 (full size only).


    For a good Amiga emulation, you don''t have to wait for the Amiga 500. Emulators
    are available for all platforms (even for the old MS-DOS) that bring Amiga feel
    to other hardware with varying levels of effort. In the Raspberry Pi world, the
    Pi 400 is a good choice for an Amiga emulator because, the original Amiga keyboards,
    which combine a keyboard, motherboard, and storage device in a single housing.


    The developers of the PiMiga [3] had to build a Raspberry Pi OS distribution that
    boots directly into the Amiga emulator [4]. A 400 with the PiMiga in place needs
    35 seconds after restart


    ![](img/dda1c68e5613db309d70a0ab080ae51a_61_1.png)


    Figure 1: The Amiga A500 Mini is coming in 2022. Retro Games Ltd.


    on the Amiga Benchmark interface to appear in high resolution (1920x1080) (Figure
    2). The current (at press time) PiMagic v1.5 uses Raspberry Pi OS 10 with kernel
    5.10.17.


    # Installation


    PiMagic is a torrent file, which you can source directly from the provider (1),
    in the small or large variants. For PiMagic 1.5 Lite, download the pimiga15Lte.tar
    archive; for PiMagic 1.5MF up to 1993, download the pimiga15MF.tar, which is 42GB
    and covers the 77GB Amiga 5MF image. It may take some time to download the archive,
    unpack it, and mount it to a sufficiently large microSD card (32GB or 128GB).


    To boot the Amiga, you need a Boot ROM. Some versions of these ROM are available
    for various Amiga computers. For the Amiga 1200, PiMagic needs Kickstart 3.1.
    The developer sets great for users to check the correct procedure; both images
    without the required Amiga ROMs,


    # Kickstart ROMs


    If you are on an Amiga, you can use the original ROM; otherwise you have to get
    it. One good option is to buy Amiga Future (7) for just under €30. Manufacturer
    is the current holder of all Kickstart versions and sells them, as part of the
    package. After you confirm, you can download directly from their website, which
    provides either an MSD installer (Windows) or ZIP archive (Figure 3). Most importance
    is that you have the Kickstart v3.1 for Amiga 1200 (kickstart1288.rom) in case
    you use an encrypted version of this ROM (from Commodore), the ros.key file must
    be in the same location.


    The PiMagic image has been prepared in a smart way. Most of the data is to unpack
    AmigaForever.zip after completing the download and mount the ISO image as amiga.iso.
    Mount the image with:


    ```

    mount -o amiga.iso /mnt/

    ```


    The Kickstart ROMs are now in Amiga Files/Shared/. You need two files: one for
    Kickstart amiga-os-311-a288.rom and the Kickstart file, but it is only useful
    if you have an Android device. There is no IOS version. Installing the files involves
    a bit of work. Copy the two files to the KICK partition on the SD card over. PiMagic
    may also be able to handle ROMs from older versions of Amiga Future. You may find
    software collections like AmigaOS 4 or Retro Class, as well as the correct ROMs.
    The purchase price of the older DVDs can be less than $10.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_62_1.png)


    Figure 4: Amiga games you can browse at the Internet


    # Amiga Future Plus Download


    Amiga Future Edition contains various emulators and Amiga games, as with the Kickstart
    ROMs.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_62_2.png)


