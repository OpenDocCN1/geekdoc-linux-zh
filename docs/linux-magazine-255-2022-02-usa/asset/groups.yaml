    # WHAT ABOUT THE CATS?


    Dear Reader,


    The sorry state of discourse on the Internet has many causes, and the experts
    have offered many reasons for the mess. One of the biggest problems is the way
    that social media platforms reward engagement. You might see different content
    depending on what you like; you might click on one cause looking for a link such
    as "vaccine side effects" and then find some slightly darker stuff until you descend
    into a thought bubble that represents a different reality from what other users
    are seeing.


    The use of cute animals as engagement bait poses a problem for all who are working
    to rein in the abyss of Internet misinformation. These videos are endlessly popular,
    and nothing about the content gives any indication of the owner''s motives. Sometimes
    these videos and cute images accompany something like "If you like this one, click
    here," and suddenly lead the viewer to a service or channel that provides more
    misinformation.


    I know what you are thinking: Is it possible for the platform (and the user) to
    get better at stopping these innocuous links that act as a front to the dark conspiracies
    that have trapped many users? My best response is "good luck with that" or put
    it another way, what are you going to do about the cats?


    Facebook and Google think they will eventually solve problems like using AI. What
    can we do about it? It might be worth remembering to check the source before you
    forward cute puppy pic to all your relatives and friends.


    Those adorable cat videos have been a feature of the Wide Web for years. One good
    video of a kitten playing a piano or scanning a bear can generate thousands or
    millions of clicks. If you know that, and I know that, it will not be a surprise
    that the people who drive to conspiracies and other schemes are aware of the power
    of cute.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_2_0.png)


    Internet watchers are becoming increasingly alarmed by the connection between
    fringe groups and cute animal videos. A recent article in The New York Times [1]
    offers a useful summary of recent examples are paywalled, but this one is accessible—at
    least for now. An analysis by Epoch Media, an organization associated with the
    Falun religious sect that has expressed support for QAnon and other conspiracy
    theories, has posted 12,002 cute animal videos on 103 of their Facebook pages
    over the past year. These posts have racked nearly 4 billion views. The website
    of a prominent vaxxer, who researchers named as one of the most prolific sources
    of COVID-19 misinformation, recently ran a story with the title "Kitten and Chicken
    Nap So Together."


    Joe Casad,

    Editor in Chief


    # Info


    +   [1] "Those Cute Cats Online? They Help Spread Misinformation" by Davey Alba,
    The New York Times, December 2021, https://www.nytimes.com/2021/12/01/technology/misinformation-cute-cats-online.html


    ![](img/dda1c68e5613db309d70a0ab080ae51a_2_1.png)'
