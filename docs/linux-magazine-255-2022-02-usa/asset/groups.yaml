    # 快速上手 Linux


    ![](img/dda1c68e5613db309d70a0ab080ae51a_10_0.png)


    想让你的朋友和同事也切换到 Linux 吗？


    本期内容将向新手展示如何：


    - 安装 Linux

    - 为你的 Linux 下载并安装免费软件

    - 玩游戏

    - 创建文档和电子表格

    - 处理照片

    - 播放音乐和视频

    - 以及更多内容！


    在线购买：shop.linuxnewmedia.com/specials


    ## 新闻


    ### 内核新闻


    ### Zack 的内核新闻


    Chronicle Brown 报告了内核社区内的最新新闻、观点、困境和进展。


    作者：Zack Brown


    ## 支持新硬件特性：UINTR


    来自 Intel 的 Sohl Mehta 提出了用户中断（UINTR），这允许将中断直接传递到用户空间的硬件技术。中断是一个存在了数十年的通用概念。其核心思想是，如果系统上的某些事物发生了变化，它可能会“中断”当前运行的任务，以便处理这种变化。之后，会触发硬件中断、软件中断以及大量的工具和思路来处理中断。中断无处不在。例如，当多个程序同时运行时，系统时钟中断会在这些进程之间每秒发生一次，使它们看起来都在同时运行。


    除了系统的正常操作（内核或硬件中断）外，Sohl 还说，UINTR 还引入了来自任何其他用户调用 API（如用户中断）的中断。


    由于 UINTR 是一项硬件特性，Sohl 指出：“用户 API 的首次实现将出现在名为 Sapphire Rapids 的处理器中。请参阅《Intel 体系指令扩展》第
    11 章以获取硬件架构的详细信息。”


    Sohl 表示：“为了让未受保护的进程能够通信，我们需要在另一个机制（本地或远程）上建立一个用户向量中断映射，即使这会增加内核代码的复杂性。向量可以通过修改源处的
    UINTT 条目来创建。在保持和恢复来自 UINT 的 UID 的同时，我们需要注意缓存。”


    ## 作者


    Linux 邮件列表涵盖了开发活动的核心。流量非常巨大，每周经常达到 10,000 条消息，对于个人来说，要跟上整个开发状态几乎是一项无法完成的任务。承担这项任务的少数人之一是
    Zack Brown。


    ## 新闻


    Dave Hansen 回复了 Sohl 的公告，建议改进措辞，并表示：“你在这一切中面临的问题将是如何说服人们它是值得解决的。”


    Dave 还提到了 10 倍的提升是 Sohl 的一个真实点，并说：


    - 需要注意的是，10 倍的提升适用于用户 API。对于其他套件/用户界面（如内核通知和其他来源），我们没有相关数据。

    - 我意识到封面上的 UPI API 数据需要一些说明。只有当接收者在内核中自旋（spinning）时，才能看到这种提升。

    - 如果我们在内核中阻塞（等待），性能将下降得更厉害，仅比快 10%，而比信号快 40%。


    Sohil 发布了一张用户 API 与管道、信号等的速度对比表，并表示后者彼此之间是“相对”的，而不是绝对的时间量。


    Greg Rohman 回复道：“这种相对性极其微小，那么现实情况只是比你现在的情况稍微好那么一点点。”


    > “那么‘绝对’呢？我们在谈论什么？”


    > “这真的只适用于 1 微秒任务唤醒另一个用户空间任务的策略。什么真实的工作负载可以使用这种技术？”


    Sohl 用一些绝对测量值进行了回应——他得比较谨慎，表示：“这里的数据更多是对于该方向预期最终性能的近似……” 真实工作负载的整体提升取决于它如何使用 IPC（进程间通信）。


    Sohl 就 Greg 关于什么真实负载可以使用该特性的问题补充道，这种方法受益于用户 API。Jens 在另一个线程中提到，使用中断代替事件可以帮助内核通知。Libevent
    是我们正在评估的另一种抽象，”


    早些时候，Greg 也指出 Intel 的硬件特性限于单一 CPU。并表示：“允许创建只在这些 CPU 上运行的系统调用。”


    Dave 表示：“好吧，你总得从某处开始。”并指向了内存密钥——该特性在最初进入内核时关注点非常窄。一段时间内，只有一代 Xeon 支持它。但是，如果你构建了，它们就会出现。AMD
    提供了强大的支持。此外，保护密钥遍布 Intel 的产品线，”


    Dave 总结道：“我鼓励所有提交新硬件特性的人说明特性将如何呈现给终端用户以及对我们产生什么影响。我实际上倾向于拒绝缺少这些信息的补丁。”


    Greg 回复道：“那么，对于没有 CPU 特性的情况，这些问题的答案是什么？”这个问题没有得到回答。


    与此同时，Pavel Mache 注意到存在一种通过 UPI 码（即汇编语言）实现的 Intel CPU 特性。Intel 的原始列表中的许多示例可以为 UINTR
    实现。Pavel 问：“其他 CPU 开发者会实现兼容特性吗？如果没有，我们将无法能够抽象 CPU 差异的 VDOS 内……”


    这没有得到回答，但几个人对 UINTR 的潜在使用场景进行了讨论。该线程得出了结论——尽管内核开发者非常有兴趣支持世界上存在的且并非本质上不安全的 CPU
    特性。


    '
