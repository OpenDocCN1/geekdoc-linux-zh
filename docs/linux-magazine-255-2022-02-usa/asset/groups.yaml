    Download your copy of NixOS from the official page (https://nixos.org/download.html)
    and read the release notes (https://nixos.org/manual/nixos/stable/release-notes.html#sec-release-21.11)
    for more information.


    # MORE ONLINE


    # KDE Developers Introduce a Gnome-Like Environment


    KDE Plasma is a very user-friendly desktop interface found on several Linux distributions.
    But there are a couple of features that have needed some tweaking for them. These
    changes affect how users interact with both activities and virtual desktops.


    With the release of KDE Plasma 5.24, all these changes are both featuring a Gnome-like
    manner. A new overview screen will offer a full-screen view of both virtual desktops
    and all open applications. Along with these two features, a search bar will be
    included in the overview that allows users to find applications, files, browser
    tabs, documents, and more.


