    # 使用 KDENLIVE LINUS VOICE 制作幻灯片


    表面上的复杂性（图 1）。但这完全没有必要。Kdenlive 提供的五种视图模式（日志、编辑、特效）以及右上角用于创建和编辑未来视频的区域，目前很有价值：例如，图像的持续时间（图像剪辑）、空白页（颜色剪辑）和淡入标题（标题剪辑）等。


    在检查和更改设置之前，最好对你主目录下的以下配置文件进行备份：`~/.config/kdenlive/kdenlivec`


    在 Kdenlive 中，项目剪辑无论如何创建，都是视频序列。对于幻灯片，这也适用于你添加的图像。例如，五秒的持续时间太长了，而且程序对三个过渡场的处理也太慷慨了。每个剪辑末尾都有淡出的过渡场。


    接下来，你可能想调整幻灯片，以便在细节中清晰地突出预设。要做到这一点，在设置菜单中，例如：使用 Kdenlive 编辑并将“标准样式”更改为“标准颜色”。


    此外，你还会想要调整编辑模式的窗口。它默认显示预览区域，其中左侧（剪辑监视器）不用于幻灯片，无谓地占用了预览区域空间；项目监视器是 Kdenlive 显示已创建项目的地方。


    你系统的最佳设置取决于发行版开发的主题。某些颜色或样式选择会导致完全无法使用的菜单和布局。在这种情况下，只需简单更改之前保存的文件，或在需要时将其删除。


    在“视图”菜单中，可以开启或关闭界面的各个组件。这里可能打开了（有时是默认的）时间重映射对话框，可能还有项目笔记（剩余区域下方）。然而，仅仅关闭组件是不够的，因为你在视图菜单禁用该项目之前，Kdenlive
    会一直保持其开启。


    Kdenlive 拥有令人羡慕的程序布局（图 2）。Kdenlive 支持导出程序配置。只有在你知道它们的影响时，才应该更改许多常用的设置。


    一旦设置好布局，可以通过“视图 | 布局”将其保留供后续会话，你可以在那里设置布局名称。要这样做，你首先需要使用“布局”将其添加到已知布局列表中。


    有些默认设置对幻灯片来说没有意义。在“设置 | 配置 Kdenlive...”中，你需要调整


    ![](img/dda1c68e5613db309d70a0ab080ae51a_72_0.png)


    图 2：在创建幻灯片之前，你需要调整 Kdenlive 中的偏好。


    # 第一步


    要开始，首先使用工具栏上的“新建”按钮创建一个项目。这创建了 Kdenlive 所需的管理结构，用于指定你应用动画以创建结果的分辨率和帧率。Kdenlive
    为此项目创建一个 XML 文件。该文件是后续所有使用的剪辑和图像的基础，如果需要，Kdenlive 会自动转换它们。


    幻灯片显示的第一张图像具有特殊意义。如果需要，Kdenlive 会通过对齐来调整分辨率。这是无法简单撤销的。请确保使用分辨率（在大多数情况下用）每秒 25
    帧的全 HD 分辨率（图1）。较高的帧率会导致输出设备无法显示视频。这涉及耗时的编辑现实。


    创建项目后，通过展开右角的项目窗口，加载你想出现在完成视频中的图像（和剪辑），并将它们从那里拖到时间轴上。要做到这一点，“项目”对话框中有“添加剪辑或文件夹”按钮。还有另一种方法。你可以直接从文件管理器将图像和剪辑拖放到时间轴上。根据偏好，图像将出现，取决于设置中定义的长度的短视频序列。


    # 缩放与移动


    如果你能用正确的宽高比和分辨率定义用于幻灯片的图像，那就简单了。否则，你必须首先对幻灯片中的图像进行裁剪。这至少无法提供“肯伯恩斯”（Ken Burns）特效和缩放的优势。肯伯恩斯特效是由著名电影制作者发明的一种技术——使用缓慢的平移和缩放从图像创建视频。在
    Kdenlive 中，你唯一的选择是应用特效。时间轴菜单提供了通过“插入...”直接访问最重要特效的选项（图 4）


    对于缩放、缩放和平移，请使用“变换”特效，它可以生成一个独立的对话框（图 5）。并不是所有设置都一目了然。窗口中心有四个用于位移（X 和 Y）的字段和两个用于高度（W
    和 H）的按钮行可以快速选择需要反复使用的模式，例如，将图像调整到输出的高度或宽度。“调整到宽度”按钮允许进一步的调整。实际上，你可以设置该部分在高度上的所需位置。要做到这一点，按住
    Ctrl 键用鼠标轮移动选定的部分。


    图像的移动也可以同样轻松创建。按意图移动选定内容（这在预览窗口中可以使用鼠标完成）并设置一个关键帧（“关键帧”框）。然后你可以根据喜好重复此过程。Kdenlive
    现在将不会自动计算它在平移之间所需的帧。


    在使用标签构建窗口时，窗口会随着彼此变化，这非常有用。“合成”包含一个你可以选择的过渡列表。“特效”显示了应用于剪辑的哪些特效。“剪辑属性”列出了图像和剪辑的大小以及其他有用信息。“撤销”显示了到为止执行的所有操作。


    剪辑的长度可以直接在时间轴上调整。使用鼠标移动起点和终点，这将改变剪辑的长度。所有未包含在幻灯片中的剪辑也可以使用特效进行修改。“缩放和移动图像”框显示了如何使用常用功能完成此。


    # 时间轴


    时间轴是进行合成和编辑操作的地方。你在这里添加过渡场，尽管尚未详细定义——但是在特殊的对话框中完成的。时间轴比表面看起来复杂得多。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_73_0.png)


    图 3：在创建项目时，你需要设置分辨率和帧率等。


    # 使用 KDENLIVE LINUS VOICE 制作幻灯片


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_0.png)


    图 4：特效可以通过时间轴的右键菜单直接插入。要做到这一点，点击剪辑然后点击右键菜单。对于缩放，*缩放*是该特效。


    默认情况下，Kdenlive 创建四个轨道：两个视频轨道和一个音频轨道。每个轨道都允许你在另一个左侧添加更多视频和音频轨道。你可以通过鼠标拖动剪辑在轨道之间移动剪辑，你也可以在轨道之间切换。剪辑位于顶部轨道还是底部轨道很重要。在过渡场中，当顶部的剪辑覆盖在下方轨道剪辑上时，不需要为每个剪辑创建一个新轨道。


    时间轴中的时间标记指的是相对于剪辑的时间位置。你可以在边缘调整*速度*，从而调整剪辑的持续时间。如果你对剪辑应用特效，它的速度减少速率与剪辑长度增加的速率相同。剪辑右键菜单中的“更改速度”特效工作原理也一样。它还支持音频轨道的音调补偿。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_1.png)


    图 5：对话框很复杂，但许多开关都有工具提示。


    图 6：关键帧可以通过菜单下方的开关可用。


    # 关键帧


    关键帧是时间轴和剪辑内启用“关键帧化”属性的位置。关键帧充当特效的锚点。在 Kdenlive 中，只有部分特效支持关键帧，但它们很容易使用。


    “变换”对话框显示关键帧并在单独的按钮中显示它们的对话框（图 6）。使用 X 和 Y 位置字段指定方向、缩放大小，并使用开关设置正确的宽度，例如。现在将鼠标指针移动到时间轴上的位置，使用当前设置添加“关键帧”按钮。设置关键帧的最快方法是双击时间轴上的空位置。双击现有的关键帧将删除它。


    你想复制关键帧以便在其他处重新调整与其关联的特效。要做到这一点，选择你想要复制的关键帧（Ctrl+C）。然后将鼠标移动到时间轴上你想粘贴关键帧的位置（目标）。现在点击“复制所选关键帧”按钮（第五个按钮）。


    在关键帧类型选择的汉堡菜单中可以找到许多重要的（图 7）。不同关键帧类型的含义在 Kdenlive 手册中解释。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_2.png)


    图 7：汉堡菜单（此处位于平滑右侧）提供了处理关键帧的信息。


    ![](img/dda1c68e5613db309d70a0ab080ae51a_74_3.png)


    图 8：淡入可以使用连接在上边缘的“手柄”进行精确调整。


    '
