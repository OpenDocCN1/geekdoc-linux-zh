    # 封面故事


    ## 模糊测试 (Fuzz Testing)


    输入元素的结构：一个 `<postcard>` 由五个指令数字组成；数字是由 | 分隔的备选方案之一。


    基于模型的模糊器利用此机制生成输入。它从左侧的输入元素（如 `<postcard>`）开始，并将其替换为右侧的文本（`<digit><digit><digit><digit>`）。它重复此过程，直到所有输入元素都被替换。如果右侧有多个备选方案，它会随机选择一个。模糊器将每个
    `<digit>` 元素替换为随机序列 43627 中的其中一个数字。它也可能是 34829 或 12456——重要的是它利用了模糊测试。


    利用这种机会，问题代码 00000 的模糊测试次数可以减少到 100,000 次。这听起来很多，但即使是现代模糊器，在几分钟内也能生成数百万个输入。与纯随机输入不同，它们的输入是有效的，因此它们可以更深地探索代码，发现输入处理之外的逻辑错误。


    ### 模糊器在哪里发现错误


    尽管输入处理通常会拒绝纯随机输入，但基于演化的模糊器可以更容易深入挖掘（图 1）。事实上，基于模型的模糊器可以很方便地生成复杂的输入。该框生成“地址语法”，该语法又用于生成地址。


    来自 `<address>` 的代码如 Bert Muller, Main Street 18, 43267 Munich。`<number>` 和 `<random_name>`
    的规则分别生成数字和字母序列，导致了更多导致 SQL 错误发生的结果，例如 UK Street, 2315 Berlin。


    由于用户可以创建和扩展语法，它们允许模糊器更具针对性。例如，安全测试人员可以将模糊器调整到前述语法中，这是一种向输入中注入命令的攻击（参见“通过语法进行 SQL
    注入”）。


    这种向地址注入 SQL 命令的行为可能导致未经过妥善检查的数据删除。至少显而易见的是，模糊实验应该只在你自己的控制环境中进行。如果你必须信任第三方，就会面临数据被篡改的风险。


    基于语法的模糊测试在实践中很广泛，但对于你自己的项目很难使用——除非该语法可以调整以满足你的目标。Mozilla 和 Google 已经发现基于语法的语言
    [1] 在 JavaScript 解释器中的问题，该语言生成 JavaScript 程序。Csmith (2) 是一个生成有效 C 程序的程序，被广泛用于复杂的测试器。基于模型的模糊器
    (3) 将二进制输入中的二进制指定为图像文件或归包。


    如果你切换到其他方法阅读本文，你可以了解它的安全性——这并不归功于基于模型的模糊测试。


    ## 得益于变异的成功


    尽管基于模型的模糊器功能强大，但有一个决定性的优势：对于特定应用程序输入，这需要大量的开销，特别是当你必须为它编写语法时。然而，如果你没有输入示例，你可能想要测试最年轻的测试生成器：基于演化的模糊器。


    基于演化的模糊器也旨在产生最有效的输入以深入代码，它们不是通过使用此类语法，而是通过系统地改变（变异）现有输入来实现。例如，考虑一个德国地址：Putzbrunner
    Street 7, 81739 Munich。变异可以交换两个字符：Putzbrunner Street 7, 81739 Munich。或者，你可以用另一个字符替换一个（Putzbrunner
    Street Munich）或删除一个随机字符（Putzbrunner Street 7, 81733）。


    ## 地址语法


    ```

    <address> := <first_name>, <street> <house_number>, <postcard> <city>

    <first_name> := Anton | Berti | <random_name>

    <street> := Mueller | Schmidt | <random_name>

    <city> := Berlin | Munich | <random_name>

    <street> := Main | Putzbrunner Street | random Street

    <house_number> := <digit> | <house_number><digit>

    <random> := <letter> | <letter><letter>

    <letter> := A | B | C |

    ```


    ## 通过语法进行 SQL 注入


    ```

    <city> := Berlin | Munich | <random_name> | SQL_injection

    <SQL_injection> :=; DROP TABLE addresses;

    ```


    每次变异都提供新的测试输入。虽然变异范围不如基于模型的测试那么高，但通过随机输入或例如，仅更改邮政编码中的一个数字就会导致无效地址。


    生成特殊邮政编码 000000 的概率如何？如果代码设计为像列表 2 那样按位查询邮政编码，那么当每个部分条件满足时，执行的每段代码都会检查下一个数字。经过多次迭代，模糊器可能会找到通往
    00039 的路径，并在 00000 发现更多代码。事实上，基于演化的模糊器在比较字符串和数字时能够部分成功，并缓慢向目标工作。


    但基于演化的模糊器的技巧在于，它们使用变异来系统地演化一组输入。目标是尽可能覆盖。为了这一点，模糊器维护一组已知且有效的输入（称为种群），它们通过变异增加多样性。最重要的是，基于演化的模糊器通常不需要实现细节：如果初始输入不包含某个特征，该特征就不可能被生成。模糊器现在位于程序位置（覆盖）。每个之前到达的位置都会保留，并作为进一步变异的基础。相比之下，未到达新位置的会被丢弃（选择）。这种方式，种群继续朝着尽可能到达程序位置的目标演化。基于约束的模糊器是高度优化的
    [4]。


    列表 2：邮政编码测试


    ```

    if (len(zip) == 6 and zip[0] == ''0''

    and zip[1] == ''0''

    and zip[2] == ''0''

    and zip[4] == ''0'');

    do_something()

    ```


    ## IT 亮点摘要


    忙于阅读发布和技术新闻吗？让我们把最相关的新、技术文章和工具提示直接送到你的收件箱。


    - 关注 IT 行业动态。

    - AMD 和 HPC：bit.ly/HPC-Update

    - Linux 更新：bit.ly/linux-Update 检测现有程序中的大量漏洞。大多数安全关键程序现在由 AFL 等 Google 模糊器进行测试，以防止数百万的损失。NASA
    也依赖基于约束的模糊器来完全测试任何航天器 [8]。


    AFL 主要用于程序作者不配合的“敌对”场景。Sapienz [5] 是一种使用代码测试其程序和应用的演化模糊器。任何在 Linux 上使用命令行的人都会从基于演化的模糊器受益。


    ## 展望


    现代模糊器早已停止依赖单一技术，而是采用了实用组合。选择正确的模糊器。例如，首先使用随机字符串寻找输入处理中的错误是有意义的，然后在更深层次进行遗传变异。


    ## 检测条件


    第一类生成器旨在尽可能到达许多位置。演化模糊器未使用试错法，而是使用符号分析和对程序条件的推理。这指的是程序执行特定的模式并到达特定的代码位置。


    语法约束可以通过多种方式结合。当语法与模糊测试工程师和开发者的知识相结合时最成功。用户并不感兴趣使用哪种变体——重要的是开始模糊测试。未暴露模糊器的软件可能由随机输入触发错误。


    在基于约束的模糊器中，使用了特殊的约束——分析一组条件的程序。对于描述的邮政编码，模糊器在数百毫秒内解决了 00000 的解决方案。如 AFL 或 KLEE
    等模糊器更为常用。对于开发者和攻击者来说，如果你不使用模糊，就可能找不到他们正在寻找的漏洞。然而，一旦你设置了模糊器，它就会接管，不知疲地提供反馈并突出显示已发现漏洞。


    然而，约束在复杂计算中显示了它们的真实实力。如果条件像列表 3 那样，约束模糊器会在短时间内找到 x 和 y 的合适值。基于语法的模糊器需要确保在满足程序逻辑不同部分时不会阻碍覆盖率。但约束也可以解决输入字段的非平凡属性，如检查。


    列表 3：约束条件


    ```

    if x * x + y > 3

    and x * x * x + y < 5:

    do_some_interesting(_)

    ```


