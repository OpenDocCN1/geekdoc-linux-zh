    ## Comparing tools for an easy data exchange Handshake


    If you want to exchange files over the local network, you do not necessarily have
    to set up a file server as Samba. A number of handy tools help you drag and drop
    to send files. BY CHRISTOPH LANGNER


    Transferring files from one computer to another usually requires the installation
    of some kind of server. Samba (a network share) is the classic approach to doing
    this. You can also use SSH to move files from one computer to another easily.
    If you do not want to install and set up a server, the only option is to use a
    USB stick without requiring an Internet connection. Various desktop environments
    integrate tools for easy data transfer.


    Warpinator [1] comes from Linux Mint''s rich repertoire of standalone developments
    but can also be installed on other distributions. Linux Mint automatically integrates
    the program into its default installation. Arch Linux and Manjaro have the application
    in their official repositories. The easiest way is to install Warpinator as a
    Flatpak, but this involves numerous details [2]. Optionally, the project''s GitHub
    page describes how to install it [3].


    As an alternative to this, there are a number of simply designed programs that
    transfer files and folders over the local network at the push of a button without
    requiring an Internet connection. The system does not rely on background services
    or cloud servers as commercial services like Dropbox or Google Drive for. On the
    installed devices, the programs automatically find each other in the network.
    Sending data is then a matter of a few clicks. I will look at the current best
    of candidates for this task.


    Started from the application, Warpinator comes up with quite a clear window. As
    soon as you launch the program on other computers in the network, it lists the
    computers with the same user and computer names (Figure 1). Click on one of the
    computers to open the detailed view. Use the asterisk next to it in the header
    of the window to mark the computer as a favorite. This means that the entry will
    always appear in the upper area of the Warpinator instances activated on the network.


    To send a file, click on the desired and select the desired file in the Send [...]
    Browse. Optionally, select another folder and click the Add button to select the
    file directory. Warpinator will then transfer the desired data with all the files
    in it. An even faster way is to drag the desired files into the Transfer zone.
    On the target side, the user sees a message about incoming files. Clicking Accept
    starts the transfer, and the Reject button cancels the action. In the configuration,
    Warpinator saves the transferred data to a folder in the user''s home directory
    (Figure 2). The folder can be customized in the application''s settings. This
    is also where you define how Warpinator will handle existing files and configures
    the ports on which the application communicates with the network.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_77_0.png)


    Figure 1: Warpinator lists all active instances of the program on the local network
    in the application window.


    # Teleport


    Teleport [4] minimizes what is already a ready deduced structure in Warpinator:
    a window, a simple list of active devices, and a Send file to start the file transfer
    (3). There are no settings, and not for file manager integration, or say to transfer
    entire folders. The minimal range of functions is not surprising once you understand
    that the program origins come simple. Some open layers have been trying to reduce
    to the basics for some time.


    If you like this minimalistic approach, the easiest way to use Teleport is to
    use Flapap, a fork of Teleport created due to the very young stage of the application''s
    development. Not even the Arch Repository (AUR), which is an inexhaustible source
    for the latest software, has anything like this. Options described on the project
    page show the source code on Linux and Ubuntu. Variants for other operating systems,
    as well as functions such as encrypted data transfer and sending multiple files
    also, are on the developers'' roadmap.


    # LAN Share


    LAN Share [6], another open app, follows a simple approach to that used by Warpinator.
    In a direct comparison, the biggest visual difference is the toolkit. While Warpinator
    is built in GTK and has features integrated with Gnome or XFce, LAN Share uses
    the Qt. The application makes the best possible use of the KDE ecosystem''s feature
    set. This makes LAN Share easier to port to Windows.


    Although the first release of LAN Share was almost five years ago, no distributions
    have integrated packages for LAN Share into theirs


    ![](img/dda1c68e5613db309d70a0ab080ae51a_78_0.png)


    Figure 2: The history with Warpinator provides information about the status of
    each file and folder.


    For Windows, there is better with a standalone installation. In the system with
    Windows 10, the program failed to launch because of a missing DLL file MSVCR100.dll
    Visual C++ Redistributable Packages for Windows 2013 [9] solved this problem without
    too much overhead.


    To send a file, you need to install and start the program on all participating
    computers. Unlike Warpinator, LAN Share does not immediately detect all the computers
    in the network window (4). The potential receivers do not appear until you click
    one of the Send files... or Send folders... and select an object to send to


    ![](img/dda1c68e5613db309d70a0ab080ae51a_78_1.png)


    Figure 3: Teleport reduces Warpinator''s approach to the basics. Currently the
    program only lets you transfer single files.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_78_2.png)


    Figure 4: The LAN Share main window shows previous transfers but not the active
    clients on the network.


    On Arch Linux and derivatives from Manjaro, there is the option of conveniently
    installing the program from the AUR. The developers offer packages [7] for users
    of Ubuntu and Debian. In addition, the project provides AppImages that works on
    all operating systems

