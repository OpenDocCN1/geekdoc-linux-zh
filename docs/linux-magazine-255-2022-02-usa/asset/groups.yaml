    ### 高枕无忧


    PDF 作为文件共享的首选格式，提供了巨大的隐私和安全措施。这些命令行工具中的某些可以帮助您的 PDF 满足安全需求。作者：Bruce Bypield。


    1992年以来，文档格式（PDF）并未显示出消失的迹象。该格式已成为一种商业标准和文件共享的首选格式。与 PostScript (PS) 相比，PDF 具有文件易于编辑且无需担心接收方文字处理器支持何格式的优势。尽管有这些优势，PDF
    至少对隐私和安全的担忧较少。它的隐私和安全在现代标准下是被允许的。这些工具简直就像个笑话。正如我以前所看到的，PDF 存在于两种状态：要么被破解，要么正要被破解。


    幸运的是，现在有方法可以解决 PDF 格式本身无法解决的问题。在许多用于编辑内容和结构的脚本中，也有越来越多的脚本可以增强隐私和安全。


    PDF 密码保护仍然是其被广泛使用的简单原因。LibreOffice 提供了*文件 | 导出 | 导出为 PDF ... 安全性*选项。通过这里，可以设置密码来打开
    PDF，并授予有关是否以及如何编辑、打印或复制该文件的权限。这些设置将控制未经授权的用户操作 PDF 文件，但它们可能会标记为跟踪代码。在读者可以控制权限的环境中（例如在现代操作系统中），文字处理器可能会被绕过。LibreOffice
    提供了更强的保护，选项是使用数字签名或个人 PPG 密钥，通过选择*导出 | 导出为 PDF ... PDF 选项 | 数字签名* (1)。


    虽然这保证了接收者的身份，但它并没有涵盖所有情况。


    根据您的需求，您可能想为 Debian 和其他主要发行版的存储库编写其中一个脚本。这些脚本可以执行许多功能，但在这里我们仅介绍它们的打印和安全功能。请注意，某些脚本可能没有页面，仅提供帮助选项，这应该足够了解它们的用法了。


    ## pdfckrack


    只要使用密码，总会有某些用户忘记它们。这些用户为诸如 pdfckrack 这样的管理工具提供了合法的理由，尽管这些工具很难打开。你可以通过多种方式使用 pdfckrack：使用这样的字符串
    `--encrypt=STRING` (2)，或者使用 `--firstpage=FILE` (3) 或 `--page=NUMBER`（这些在网上都有提供）——这是最通用的方法，除非你对密码可能是什么有些头绪，并且可以使用正则表达式来搜索一个范围。


    Bruce Bypield 是一位社区记者，也是专攻自由开源软件的作家和编辑。除了他的写作项目外，他还教授在线课程。在这个系列中，他撰写关于 Open Coast
    (http://brusebypield.wordpress.com)。他还是 Printer Freedom 的联合创始人。一个关于写作和排字的博客位于
