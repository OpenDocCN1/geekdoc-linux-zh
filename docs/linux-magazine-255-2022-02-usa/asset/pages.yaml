    from its agents and stores the input in a database. Gets to know the topology
    and traffic flows between endpoints. The admin can access the new Skydive instance
    via the analyzer’s web interface.


    Skydive consists of a central analyzer and many agents (Figure 1). The agents
    run on Linux hosts and report network


