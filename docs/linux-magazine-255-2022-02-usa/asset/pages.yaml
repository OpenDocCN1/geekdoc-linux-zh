    # Zack''s Kernel News


    Chronicle Brown reports on the latest news, views, dilemmas, and developments
    within the Kernel community.


    By Zack Brown


    # Supporting New Hardware Features: UINTR


    Sohl Mehta from Intel brought up User Interrupts (UINTR), a hardware technology
    that allows delivering interrupts directly to user space. Interrupts are a general-purpose
    idea that has been around for decades. The idea is that if something on the system
    changes, it might "interrupt" what is currently running, in order to handle the
    change. After that, hardware interrupts, software interrupts, and a whole lot
    of tools and ideas are triggered and handling interrupts. Interrupts happen all
    the time. For example, when multiple programs are running at the same time, the
    system clock interrupt happens per second between those processes and make it
    look like they are all running simultaneously.


    Aside from the normal operations of the system - the kernel or hardware interrupts
    - Sohl said also that UINTR introduces interrupts from any other user called API
    like User interrupts.


    Because UINTR is a hardware feature, Sohl said, "The first implementation of User
    APIs will be in the process-code named Sapphire Rapids. Refer [1] Chapter 11 of
    the Intel Architecture


    instruction extensions for details of the hardware architecture.


    Sohl said, "To enable unprotected processes to communicate, we need a user-vector
    interrupt mapping over another mechanism (either local or remote), even if this
    can add complexity to the kernel code. A vector can be made by modifying the UINTT
    entries at the source. We need to be careful about caches while remaining and
    restoring the UID from the UINT.".


    # Author


    The Linux mailing list covers the core of development activities. Traffic volumes
    are immense, often reaching 10000 messages in a week, and keeping up to date with
    the entire state of development is a virtually impossible task for one person.
    One of the few souls to take on this task is Zack Brown.'
