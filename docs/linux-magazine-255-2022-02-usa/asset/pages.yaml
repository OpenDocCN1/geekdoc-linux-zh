  md: "# COVER STORY\n\n# Fuzz Testing\n\n# Fuzzing and the quest for safer software\n\
    \n# The Buzz on Fuzz\n\nFuzzing is an important method for finding bugs and security\
    \ vulnerabilities in software. Read to find out what fuzzing is and which methods\
    \ are commonly used today.\n\nBy Andreas Zeller\n\nIt was a dark and stormy night.\
    \ Bart Miller—you'll find an interview with him at the end of our feature—was\
    \ working at home with the 1200-baud modem to the University of Wisconsin's mainframe\
    \ computer. But thunderclap meant something went wrong: lightning strikes disrupted\
    \ data transmission over the phone line and garbled identical characters, forcing\
    \ Miller to start over time and time again.\nEach time he restarted, he noticed\
    \ how many programs couldn't keep up with discord—they crashed, hung up, or otherwise\
    \ stopped in uncontrolled way. Programs shouldn't do much with invalid or glitchy\
    \ input! Miller decided to investigate why the programs gave such strange answers.\n\
    That night in the fall of 1998 is considered the birth of fuzz testing, which\
    \ is the most important method today for testing programs for robustness and checking\
    \ for security vulnerabilities. Professionals usually use fuzzing to check for\
    \ errors in software, but it is still a mystery to many programmers and users\
    \ who frequent programming (including many in the Linux community). But we take\
    \ a close look at fuzzing and why it is so important.\n\nIn the process, fuzzers\
    \ use various techniques to find errors. Purely random input is easy to generate;\
    \ it finds errors in input processing, such as buffer overflows. Model-based fuzzers\
    \ use grammars and language models to generate valid and targeted input. Evolution-based\
    \ fuzzers must test input and Constraint-based fuzzers can solve complex problems\
    \ in program code, but they take a long time to do.\nfuzzing with random input\
    \ is very simple to do: a few lines of program code are all to get the necessary\
    \ input. For example, the fuzz() function generates lists of random characters\
    \ that look something like this:\n\n```\n*!*#$&%*!6<?*8</!*)(/$\\*\n-(24)!*#$&%*!1<?*S7,4.8\n\
    ```\n\nBart Miller referred to this kind of input as fuzz, meaning unstructured\
    \ data. How can we fuzz it? Let's feed a string to a program that expects a digital\
    \ code. If a buffer has five characters for the input, but the actual input exceeds\
    \ its capacity (the buffer is more than 6 characters), a buffer overflow occurs.\
    \ Memory around the five-character buffer is overwritten by a more-less random\
    \ number, which, in turn, causes the program to behave more-randomly. It could\
    \ crash or enter an infinite loop when reading the six bytes.\n\n+   Listing 1:\
    \ Simpleuzuz in Python\n\n```\nimport random\ndef fuzz(max_length, char_start,\
    \ char_range):\n    # Generate a string of length 'max_length' characters\n  \
    \  in the range [char_start, char_start + char_range)\\n    out = \"\"\n    for\
    \ i in range(0, max_length):\n        out += chr(random.randrange(char_start,\
    \ char_range))\n    return out\n```\n\n# What Is Fuzzing?\n\nThe nature of fuzzing\
    \ is revealed directly by Bart Miller's programming assignment: the goal of this\
    \ project is to evaluate the robustness of little unit programs. This project\
    \ has two parts: a fuzz generator and a fuzz test program.\n\nFirst, we will write\
    \ a random character generator. Then we will use the fuzz generator and use it\
    \ to attack as many units tests as possible, with the goal of trying to break\
    \ them.\n\nThis programming task summarizes the basic idea of fuzzing: you automatically\
    \ generate random input, check if the programs fail with them as input, and repeat\
    \ these two steps very often and quickly."
