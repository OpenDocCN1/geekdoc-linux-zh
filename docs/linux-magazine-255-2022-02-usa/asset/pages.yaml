    # Command Line


    If you don''t want to use point & click for troubleshooting, you can use the command
    line in Skydide. The client communicates with the analyzer and presents its results
    in the console window. You don''t need an additional program because the client
    is integrated into the Skydide binary. The client can talk to its analyzer by
    simple query (Query 4, List 1).


    If the client and the analyzer are not running on the same server, the client
    needs the IP address or host name of the server (use the --analyzer flag). In
    case of successful connection, the detail about connected agents, is displayed
    in the JSON format.


    When monitoring the entire tree, Skydide captures and reports every edge and node.
    It makes sense to use a targeted query that returns only what you want to know.
    Skydide uses its query language. An example of a query for specific node is shown
    in the last line of Listing 4.


    A bit of knowledge Gremlin is needed to create connecting lines in the graph at
    the command line. The sub-command is not query but edge-rule creates 5 nodes,
