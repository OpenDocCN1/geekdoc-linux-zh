  md: '# MakerSpace

    An Amiga emulator for the Raspberry Pi 400

    Mimic


    ![](img/dda1c68e5613db309d70a0ab080ae51a_61_0.png)


    Convert a Raspberry Pi 400 into a retro computer that behaves like the popular
    Amiga 500. By Hans-Georg Eiser


    The Commodity Amiga was more than a gaming platform; its graphical interface,
    workbench, was way ahead of its time. The Amiga models [1] rank among the popular
    computers of the 1980s and 1990s. The A500, A1200, and several other Amigas had
    the motherboard and a floppy drive integrated into the keyboard. More professional
    variants like the A3000 were built more like a PC and housed the mainboard, expansion
    cards, and drives. According to Wikipedia [1], the Amiga 500 is the seminal model,
    which promoted Retro Games Ltd. to launch a replica to releases of other computers,
    such as the C64 (in modern format and full size) and VC20 (full size only).


    For a good Amiga emulation, you don''t have to wait for the Amiga 500. Emulators
    are available for all platforms (even for the old MS-DOS) that bring Amiga feel
    to other hardware with varying levels of effort. In the Raspberry Pi world, the
    Pi 400 is a good choice for an Amiga emulator because, the original Amiga keyboards,
    which combine a keyboard, motherboard, and storage device in a single housing.


    The developers of the PiMiga [3] had to build a Raspberry Pi OS distribution that
    boots directly into the Amiga emulator [4]. A 400 with the PiMiga in place needs
    35 seconds after restart


    ![](img/dda1c68e5613db309d70a0ab080ae51a_61_1.png)


    Figure 1: The Amiga A500 Mini is coming in 2022. Retro Games Ltd.'
