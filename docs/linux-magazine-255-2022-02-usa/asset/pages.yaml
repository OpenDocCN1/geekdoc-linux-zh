    # OpenStreetMap


    If you have used the internet in all the past 15 years, you are likely to know
    what OpenStreetMap is. But just in case, there''s a quick definition, focused
    on the aspect that is directly relevant for this tutorial! OpenStreetMap (OSM)
    is the Wikipedia used to create digital geography, an open map of the world, built
    and continuously by thousands of volunteers all around the world. It is hard to
    explain how important OSM is for our society, but anyone might find for for what
    thought in my mind


    Here, reality meets with the fact that all the OSM data is reliable for reuse,
    under one source license and can be downloaded automatically through equally open
    programming interfaces. It''s availability that makes drawing custom digital maps
    possible, even for non-programmers and for commercial purposes.


    # What are Digital Maps?


    Under the hood, OSM and any other map are standard databases, with extra data
    and types many-to-support mapping. Such databases are usually called geographic
    information systems (GIS). How the data is presented to users (i.e., how any map
    built with GIS actually looks like a map or delegated to interactive). The first
    essential feature of GIS is that all data is organized in layers, one (or more)
    for every-terrain feature: streets, buildings, rivers, water (lakes), railways,
    shops, administrative boundaries, paths. These features, and many more, have their
    own layer that users can choose, hide, visual or format as they want.


    # prettymaps


