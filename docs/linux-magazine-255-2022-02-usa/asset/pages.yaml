    # Create impressive presentations with Kdenlive

    Ready for the Movies


    Kdenlive plays to its strengths when editing larger video projects and helps users
    create appealing slideshows with impressive effects. BY KARSTEN GÜNTER


    Grated, at first glance, it seems like total overkill to create a slideshow with
    a video editing program. But if you take a look, there are good reasons to do
    so.

    It is true that simple programs such as imagination [1] create slideshows quickly
    from a series of images. Many transitions are available, and zooming is pretty
    easy. But when it comes to fine-tuning the speed or zooming points and moving
    the section further, this kind of software reaches its limits.

    This is where video editing programs earn their own. Although the transitions
    they offer are only suitable for slideshow to a limited extent, they can be used
    to control zooms and pans in all variations and in details. On Linux, Kdenlive
    [2] is a good choice for video editing. Mature yet relatively simple in its basic
    approach, it is reasonably easy to use (See the "Kdenlive" box for more information).


    # Kdenlive


    The KDE its KDE project has been continuously developing its KDE Non-Linear Video
    Editor (Kdenlive since nearly 20 years). With a history reaching back years, Kdenlive,
    like Gimp, is a Linux veteran. The few developers have managed to put out new
    features, but they don''t always keep all the features from earlier releases.
    Plugins from other projects are used for many effects and additional functions
    and sometimes have to be installed manually. The current version 21 (more precisely
    21.08) is available in the repositories of all the popular distributions. If it
    is missing in the repository of the distribution you are using, use the [3] instead.
    Alternative video editing programs for Linux such as Olive [4] or Shotcut [5]
    are currently the talk of town but (still) offer less-performance than Kdenlive.


