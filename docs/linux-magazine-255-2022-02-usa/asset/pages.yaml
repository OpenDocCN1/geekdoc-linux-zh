    # ## Comparing tools for an easy data exchange Handshake


    If you want to exchange files over the local network, you do not necessarily have
    to set up a file server as Samba. A number of handy tools help you drag and drop
    to send files. BY CHRISTOPH LANGNER


    Transferring files from one computer to another usually requires the installation
    of some kind of server. Samba (a network share) is the classic approach to doing
    this. You can also use SSH to move files from one computer to another easily.
