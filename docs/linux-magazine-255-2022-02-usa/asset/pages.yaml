    # Outlook


    Modern fuzzers have long stopped relying on just one technique and have resorted
    to pragmatic combinations. The end fuzzer that finds the worst errors is the right
    choice. For example, it makes sense to use random strings to find errors in input
    processing first, then genetic mutation or minat tests at deeper levels.


    # Detecting Conditions


    The first class of generators aims to reach as many places as possible. Instead
    of the trial-and-error approaches that evolution-based fuzzers use, they use symbolic
    analysis and reasoning about program conditions. This refers to when execution
    takes a particular pattern in the program and reaches a particular code location.


    Grammar constraints can be combined in a variety of ways. Grammar based is most
    successful when combined with the subject knowledge of fuzzing engineers and developers.
    The user is less interested in which variant is used - the most important is to
    start fuzzing in the first place. Software that has not been exposed to a fuzzer
    is very likely to have errors that can be triggered by random input.


    In constrained-based fuzzers, specialized constraints are used - programs that
    analytically seek for a set of conditions. For a zip code as described, a fuzzer
    solves the solution 000000 within hundreds of milliseconds.


    Fuzzers such as AFL or KLEE are more commonly used. For developers and attackers,
    if you don''t use fuzzing, you risk not finding the bugs they hunt. However, once
    you set up a fuzzer, it takes over, tirelessly providing feedback and highlighting
    the red line telling that a bug has been found.


