  md: '# DOGHOUSE – NEW/OLD COMPUTERS LINUS VOICE


    # # MADDOG''S DOGHOUSE


    Computer architectures from the 1960s and 1970s are given new life via modern
    kits. BY JOHN MADDOG HALL


    #  Reviving old computers


    I first programmed (or in real life and not on TV) was with punched cards. It
    had a fairly primitive "Disk Monitor" that would allow storage of data on a very
    small (by today''s standards) disk. I do not remember much because computers were
    not really my interest. I was studying to be an engineer, and during the cooperative
    education part of my degree, I took a course in "How to Program the IBM 110 in
    FORTRAN" for fun. And there were. I went back to Drexel and found another computer
    in the electrical lab. It was a Digital Equipment Corporation (DEC) PDP-8 with
    4 kilobytes of memory. This computer was programmed through a terminal, the AS-32
    with a tape reader and punch. This was the machine I fell in love with, and I
    spent most of my waking (when I was not functioning out of electronics engineering).
    The PDP-8 was "easy" to program in assembly because it had only eight instructions,
    and every one of them was twelve bits long. All of the addresses were also twelve
    bits, so the PDP-8 was a "word machine". We could read and write one word at a
    time, and then shift it in order to access the pages we needed. I learned to program
    by reading a paperback book published by DEC and by a salesman from DEC. I think
    it cost me about $50 back then, which was a lot of money for a college student
    but could easily buy ten other pitchers of beer.

    After university my assembly language experience (and knowing how the hardware
    of the computer worked) would help me understand more about computers and hardware.
    I am mentioning all of this as a background to my recent purchase of some interesting
    old/new computers. Old because their architectures come from the 1960s and 1970s,
    and because the machines that once cost thousands of dollars. New because simple-phase
    power can now be built into an Alto and run on AA batteries or power from a USB
    port. We can use emulators and simulators on your GNU/Linux machines. To go into
    detail about what would have been done to do in this article, I can give you pointers
    for the ones I find interesting, and where you can go from there.


    Jen "maddog" is an author, educator, free software scientist, and has been a benefactor
    for Linux since 1994 when he met Linus Torvalds and helped the port of Linux.
    He serves as president of Linux International.


    PDP computers simulate PDP (PDP-8) and PDP (PDP-11) computers, with the front
    panels of lights and switches, which allow you to stop the computer in mid-stride
    and deposit data in various parts of "memory". The web page provides to the various
    source text as well as additional programs written more recently by de-hard fans
    who love programming for machines with keyboards rather than mice. They come in
    kit form so you have to do some soldering, but they are also easy to set up and
    work on the first time.

    One of the interesting things about these kits is that they use a Raspberry Pi
    running a program called SIMH to host the old computer systems like PDP-8 and
    PDP-11, with the console and switches. This is all maintained by a series of simulators.

    We have software for [4] old DEC systems and compilers (only in binary), but as
    early Unix systems - with some code available.

    Two other old/new systems are the 1802 Memory Card which contains the COSMAC ELF
    (RA 1802) and the Z280 processor.

    These by Lee Hart-at-5] allow you to investigate two microprocessors from the
    1970s and an operating system called CP on hundreds of thousands of instructions
    at a time when Gates could not even write "BASIC"

    The280 Memory Card allows you to program for ''days'' ''likes'' using a single
    microSD card containing the programs and data through your laptop or desktop.


