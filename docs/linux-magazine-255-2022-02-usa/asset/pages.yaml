  md: '# Command Line – PDF Security


    # Peace of Mind


    PDFs, the preferred format for file sharing, offer immense privacy and security
    measures. Some of these command-line tools, can help your PDFs meet security requirements.
    By Bruce Bypield


    In 1992, the Document Format (PDF) shows no signs of disappearing. The format
    has become a business standard and the preferred format for file sharing. To PostScript
    (PS), PDF has the advantages of files that are easy to edit and without concerns
    about the formats available on the recipient''s word processor. For all these
    advantages, the PDF comes at least less concerned with privacy and security. Its
    privacy and security are permitted by modern standards. These tools are literally
    like a joke. As I have seen before, PDFs exist in one of two states: compromised
    or about to be compromised


    compromised. Fortunately, the means exist to address issues that the PDF format
    itself does not. In the countless scripts available for editing content and structure,
    there are also a growing number that enhances privacy and security.


    PDF password protection continues to be the simple reason that it is widely available.
    LibreOffice offers Library | Export | Export As PDF ... Security. From this, a
    password can be set to open the PDF, as well as grant permission if and how the
    file can be edited, printed, or copied. These settings will control a PDF''s file
    by unauthorized users, but they may mark for tracking codes. All these work in
    an environment where the reader can control permissions (i.e., in modern operating
    systems), the word processor may be bypassed. LibreOffice offers stronger protection
    with the option of using a digital signature or a personal PG key by selecting
    Export | Export As PDF ... PDF Options | Digital Signatures (1).


    While this guarantees the receiver''s identity, it does not cover every circumstance.


    Depending on your needs, you may want to write one of the scripts for the repositories
    of Debian and other major distributions. These scripts can carry out many functions,
    but here we only detail their print and security features. Note that several may
    have no page inside, offering only a help option, which should be enough to figure
    out their use.


    # pdfckrack


    Whenever passwords are used, some users are bound to forget them. These users
    provide a legitimate reason for administrative tool such as pdfckrack, although
    these tools are hard to open. You can use pdfckrack in many ways: with such a
    string --encrypt=STRING (2) or with --firstpage=FILE (3) or --page=NUMBER of which
    are available online – is the most generally efficient, unless you have some idea
    of what the password might be, and you can use regular expressions to search a
    range.


