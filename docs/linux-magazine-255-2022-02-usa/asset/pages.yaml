    # # CronRAT Malware Targets Linux Servers


    Security researchers at Sansec (https://sansec.io/research/cronrat/) have found
    a new stealth attack that targets Linux servers and uses a non-existent calendar
    day to stay off the radar. This remote access Trojan (RAT) makes the actions of
    the attack by using the date February 31 and targets Linux-based stores to trigger
    online payment skimmers.


    The new CronRAT attack can execute fileless, launch malware in separate subsystems,
    control servers disguised as Dropbox SSH services, handle anti-tampering commands.
    CronRAT bypasses browser-based security scans and has already been discovered
    in live stores. The threat was injected via a Magecart (payment skimming) attack.


    ![](img/dda1c68e5613db309d70a0ab080ae51a_9_0.png)


    This attack is made possible because a date for cron only exists for a date and
    not the date of the task is legitimate. The crontab specified for CronRAT is 52
    23 31 2 which would generate an error upon execution. However, that will never
    happen, because the date doesn''t exist.


    Once CronRAT is executed, it contacts a Command and Control (C2) server at IP
    address 47.115.48.167.443 using a banner for the Dropbox SSH service. The payloads
    of commands are obfuscated with multiple layers of compression and Base64 encoding.


    CronRAT is a serious threat to Linux e-commerce servers and has managed to bypass
    most detection algorithms. Sansec had to rewrite its algorithm to catch this dangerous
    threat.


