    Dave Hansen replied to Sohil''s announcement, suggesting improved wording, and
    said, ''Your problem in all of this is going to be convincing folks that it is
    worth solving''


    Dave also mentioned the 10x gain as a real point for Sohil, said


    +   * One thing to note, the 10x gain is applicable for User APIs. For other sets/User
    Interfaces (like kernel-notifications and other sources), we don''t have the data.


    +   * I realized the UPI API data in the cover needs some clarification. The gain
    is only seen when the receiver is spinning in the kernel.


    +   * If we were to block (wait) in the kernel, the performance would drop even
    lower than 10% faster and 40% faster than signals.


    Sohil posted a table of speed comparisons between User API versus such as pipes
    and signals, saying that the latter were ''relative'' to each other, rather than
    absolute quantities of time.


    To which Greg Rohman replied: ''The relative is just extremely tiny, then the
    reality is just a tiny bit better than what you have today today,''


    > "So what about ''absolute''? What are we talking?"


    > "And this is really only for the one-us task waking up another user-space task
    policies. What real workload could use this''


    Sohil responded with some absolute measurements – he hedged a bit, saying, ''The
    data here more of an approximation with the final performance to expect in this
    direction...'' The overall gain in a real workload would depend on how it uses
    IPC.


    Sohil added to Greg''s question about what real-world workloads use Intel''s feature.
    ''The usage would benefit from User APIs. Also Jens mentioned in another thread
    that could help kernel notifications in io, using Interrupts instead of event
    for signaling. Libevent is another abstraction that we are evaluating,''


    Earlier, Greg also pointed out that Intel''s hardware feature was limited to a
