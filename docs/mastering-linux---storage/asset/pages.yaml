    \ the output more human readable.\n\n```\nroot@RHELv4:~# df\nFilesystem      \
    \       1K-blocks      Used Available Use% Mounted on\n/dev/mapper/VolGroup00-LogVol100\n\
    \  11071922     6366996 4746240  58 % /boot\n/dev/sda              1019886   \
    \  9300     86567  10 % /dev/shm\nnone                   127988        0     127988\
    \   0 % /\n/dev/sdb1             108865     1550    101694   2 % /home/project42\n\
    root@RHELv4:~# df -h\nFilesystem            Size Used Avail Use% Mounted on\n\
    /dev/mapper/VolGroup00-LogVol100\n  120G     6.1G  4.6G   58 % /boot\n/dev/sda\
    \               125M      0     125M   0 % /dev/shm\nnone\n/dev/sdb1         \
    \    107M     1.6M    100M   2 % /home/project42\n```\n\n# 8.2.5. df -h\n\nIn\
    \ the -h example you can see the size, free space, gigabytes and percentage mount\
    \ point of an particular.\n\n```\nroot@Laika:-# df -h | egrep \"(sdb2|File)\"\n\
    Filesystem            Size Used Avail Use% Mounted on\n/dev/sdb2             \
    \  92G     83G    91 % /media/sdb2\n```\n\n# 8.2.6. du\n\nThe du command can show\
    \ disk usage for files and directories. By using du on a mount point you effectively\
    \ get the disk space used on a file system.\n\nWhile du can display each subdirectory\
    \ recursively, the -s option will give you a total summary for the directory.\
