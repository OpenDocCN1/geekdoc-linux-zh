  md: '# 17.1. verify installed version


    # 17.1.1. .rpm based distributions


    To see the version of samba installed on Red Hat, Fedora or CentOS use **rpm -q
    samba.**


    ```

    root@RHEL52 ~# rpm -q samba

    samba-3.0.28-1.el5_2.1

    ```


    The screenshot above shows that RHEL has **Samba** version 3.0 installed. The
    last number in the Samba version counts the number of updates or patches.


    Below the same command on a more recent version of CentOS with Samba version 3.5
    installed.


    ```

    root@centos6 ~# rpm -q samba

    samba-3.5.10-116.el6_2.1686

    ```


    # 17.1.2. .deb based distributions


    Use **dpkg -l** or **aptitude show** on Debian or Ubuntu. Both Debian 7.0 (Wheezy)
    and Ubuntu 12.04 (Precise) use version 3.6.3 of the Samba server.


    ```

    root@debian7~# aptitude show samba | grep Version

    Version: 2.3.6-1

    ```


    Ubuntu 12.04 is currently at Samba version 3.6.3.


    ```

    root@ubuntu124:~# dpkg -l samba | tail -1

    ii samba 2.3.6-2-ubuntu2.1 SMB/CIFS file, print, and login server for Unix

    ```'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 17.2. installing samba


    # 17.2.1. .rpm based distributions


    Samba is installed by default on Red Hat Enterprise Linux. If Samba is not yet
    installed, then you can use the graphical menu (Applications -- System Settings
    -- Add/Remove Applications) and select "Windows File Server" in the Server section.
    The non-graphical way is to use rpm or yum.


    When you download the .rpm file, you can install Samba like this.


    ```

    paul@RHEL52 ~$ rpm -i samba-3.0.28-1.el15_2.1.rpm

    ```


    When you have a subscription to RHN (Red Hat Network), then yum is an easy tool
    to use. This yum command works by default on Fedora and CentOS.


    ```

    root@centos6 ~]# yum install samba

    ```


    # 17.2.2. .deb based distributions


    Ubuntu and Debian users can use the aptitude program (or use a graphical tool
    like Synaptic).


    ```

    root@debian7~# aptitude install samba

    The following NEW packages will be installed:

    samba samba-common(a) samba-common-bin(a) tdb-tools(a)

    0 packages upgraded, 4 newly installed, 0 to remove and 1 not upgraded.

    Need to get 15.1 MB of archives. After unpacking 42.9 MB will be used.

    Do you want to continue? [Y/n]?

    ...

    ```'
  merge: -1
