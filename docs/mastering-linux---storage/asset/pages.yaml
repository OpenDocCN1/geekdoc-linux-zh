- img_proc: true
  md: "# 13.1. iSCSI terminology\n\niSCSI is a protocol that enables SCSI over IP.\
    \ This means that you can have local SCSI devices (like /dev/sdb) without having\
    \ the storage hardware in the local computer.\n\nThe computer holding the physical\
    \ storage hardware is called the iSCSI Target. Each individual addressable iSCSI\
    \ device on the target server will get a LUN number.\n\nThe iSCSI client computer\
    \ that is connecting to the Target server is called an Initiator. An initiator\
    \ will send SCSI commands over IP instead of directly to the hardware. The Initiator\
    \ will connect to the Target.\n\n# 13.2. iSCSI Target in RHEL/CentOS\n\nThis section\
    \ will describe iSCSI Target setup on RHEL6, RHEL7 and CentOS.\n\nStart with installing\
    \ the iSCSI Target package.\n\n```\nyum install scsi-target-utils\n```\n\nWe configure\
    \ three local disks in /etc/tgt/tgt.targets.conf to become three LUN's.\n\n```\n\
    <target iqn.2008-09.com.com.example:server.target2>\n  direct-store /dev/sdb\n\
    \  direct-store /dev/sdb\n  direct-store /dev/sdc\n  direct-store /dev/sdd\n \
    \ inmloguser paul hunter2\n</target>\n```\n\nRestart the service.\n\n```\n[root@centos65\
    \ ~]# service tgtd start\nStarting SCSI target daemon:                       \
    \        [ OK ]\n```\n\nThe local port for iSCSI is 3260, in case of doubt you\
    \ can verify this with netstat.\n\n```\n[root@server1 tgt]# netstat -ntpl | grep\
    \ tgtd\ntcp        0 0 0.0.0.0:3260      0.0.0.0:*      LISTEN     1670/tgtd\n\
    tcp        0 0 :::3260               :::         LISTEN     1670/tgtd\n```"
  merge: -1
  pgno: 138
- img_proc: true
