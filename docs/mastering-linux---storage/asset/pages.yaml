    # ## 18.2.3. testpharm -s


    The samba daemons are constantly (once every 60 seconds) checking the smb.conf
    file, so it is good practice to keep this file. But it is also good practice to
    document your samba configuration, and to explicitly set options that have the
    default values. The testpharm -s option allows you to do both. It will output
    the smallest possible configuration file, while retaining your settings. The idea
    is to have your samba configuration in another file (like smb.conf.public) and
    let testpharm parse for you. The screenshot shows you how the first smb.conf.public
    file with the explicitly set option to WORKGROUP.


    ```

    [root@RHEL4b samba]# cat smb.conf.full

    [global]

    workgroup = WORKGROUP


    # This is a demo of a documented smb.conf

    # These two lines are removed by testpharm -s

    ```


    server string = Public Test Server


    ```

    [firstshare]

    path = /srv/samba/public

    ```


    Next, we execute the command with the -s option, and redirect stdout to the real
    smb.conf.


    ```

    [root@RHEL4b samba]# cat smb.conf.full > smb.conf

    Load config files from smb.conf.full

    Processing section "[firstshare]"

    Loaded services file OK.

    ```


    And below is the result. The two comment lines and the default option are no longer
    there.


    ```

    [root@RHEL4b samba]# cat smb.conf

    # global parameters

    [global]

    server string = Public Test Server


    [firstshare]

    path = /srv/samba/public

    [root@RHEL4b samba]#

    ```


