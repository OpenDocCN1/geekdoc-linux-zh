    Debian-exim george     stefan    sam2               johnan

    statd     joost                     bjorn              tom2

    sshd      arno                      thomas             ronald

    ```'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# ## 1.1.3. chgrp


    You can change the group owner of a file using the **chgrp** command.


    ```

    root@rhel65:home/paul/owners# ls -l file2

    -rw-r--r-- 1 root tennis 185 Apr 8 18:46 file2

    root@rhel65:home/paul/owners# chgrp snooker file2

    root@rhel65:home/paul/owners# ls -1 file2

    -rw-r--r-- 1 root snooker 185 Apr 8 18:46 file2

    root@rhel65:home/paul/owners#

    ```


    # ## 1.1.4. chown


    The user owner of a file can be changed by **chown** command.


    ```

    root@laika:home/paul# ls -l FileForPaul

    -rw-r--r-- 1 root paul 2008-08-06 14:11 FileForPaul

    root@laika:home/paul# chown paul FileForPaul

    root@laika:home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    ```


    You can also use **chown** to change both the user owner and the group owner.


    ```

    root@laika:home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    root@laika:home/paul# chown root:project42 FileForPaul

    root@laika:home/paul# ls -1 FileForPaul

    -rw-r--r-- 1 root project42 0 2008-08-06 14:11 FileForPaul

    ```'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 1.2. list of special files


    When you use ls -l for each file you can see ten characters before the user and
    group owner. The first character tells us the type of file. Regular files get
    a - directories get a d, symbolic links are shown with an l, pipes get a p, character
    devices a c, block devices a b, and sockets s.


    Table 1.1. Unix special files

    | first character | file type |

    | --- | --- |

    | - | normal file |

    | d | directory |

    | l | symbolic link |

    | p | named pipe |

    | b | block device |

    | c | character device |

    | s | socket |


    Below a screenshot of a character device (the console) and a block device (the
    hard disk).


    ```

    paul@debian6t-$ $ ls -ld /dev/console /dev/sda

    crw------ 1 root root 5,1 Mar 15 12:45 /dev/console

    brw-rw---- 1 root disk 8,0 Mar 15 12:45 /dev/sda

    ```


    And here you can see a directory, a regular file and a symbolic link.


    ```

    paul@debian6t-$ $ ls -ld /etc /etc/hosts /motd

    drwxr-xr-x 128 root root 12288 Mar 15 18:34 /etc

    -rw-r--r-- 1 root root 372 Dec 10 17:36 /etc/hosts

    lrwxrwxr-wx 1 root root 13 Dec 5 10:36 /etc/motd -> /var/run/motd

    ```'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# # 1.3. permissions


    # ## 1.3.1. rwx


    The nine characters following the file type denote the permissions in three triplets.
    A permission can be r for read access, w for write access, and x for execute.
    You need the r permission to list (ls) the contents of a directory. You need the
    x permission to enter (cd) a directory. You need the w permission to create files
    or remove files from a directory.


    # ### Table 1.2. standard Unix permissions


    | permission | on a file | on a directory |

    |---|---|--|

    | r (read) | read file contents (cat) | read directory contents (ls) |

    | w (write) | change file contents (vi) | create files in (touch) |

    | x (execute) | execute the file | enter the directory (cd) |


    # ## 1.3.2. three sets of rwx


    We already know that the permissions of ls - starts with ten characters for each
    file. The screenshot shows a regular file (because the first character is a -).


    ```

    paul@RHELv4:~~$ ls -l proc42.bash

    -rwxr-xr-x 1 prooj 984 Feb 6 12:01 proc42.bash

    ```


    Below is a table describing the function of all ten characters.


    # ### Table 1.3. Unix file permissions position


    | position | characters | function |

    |---|---|--|

    | 1 | - | this is a regular file |

    | 2-4 | rwx | permissions for the user owner |

    | 5-7 | r-x | permissions for the group owner |

    | 8-10 | r-- | permissions for others |


    When you are the user owner of a file, then the user owner permissions apply to
    you. The rest of the permissions have no influence on your access to the file.


    When you belong to the group that is the group owner of a file, then the group
    owner permissions apply to you. The rest of the permissions have no influence
    on your access to the file.


    When you are not the user owner of a file and you do not belong to the group owner,
    then the others permissions apply to you. The rest of the permissions have no
    influence on your access to the file.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.3.3. permission examples


    Some combinations on files and directories are seen in this screenshot. The name
    of the file explains the permissions.


    ```

    paul@laika:~/perms$ ls -lh

    total 12K

    drwxr-xr-x 2 paul 4.0K 2007-02-07 22:26 AllEnter_UserCreateDelete

    -rwwxr-rwx 1 paul 0 2007-02-07 22:21 EveryoneFullControl.txt

    -r--rr-- 1 paul 0 2007-02-07 22:21 OnlyOwnersRead.txt

    --rwx------ 1 paul 0 2007-02-07 22:21 OwnersAll_RestNothing.txt

    dr-xr-x-- 2 paul 4.0K 2007-02-07 22:25 UserAndGroupEnter

    dr-x---- 2 paul 4.0K 2007-02-07 22:25 OnlyUserEnter

    paul@laika:~/perms$

    ```


    To summarise, the first **rwx** triplet represents the permissions for the **user
    owner**. The second triplet corresponds to the **group owner**; it specifies permissions
    for all members of that group. The third triplet defines permissions for all **other**
    users that are not the user owner and are not a member of the group owner.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# ## 1.3.4. setting permissions (chmod)


    Permissions can be changed with chmod. The first example gives the user owner
    execute permissions.


    ```

    paul@laika:/~$$ ls -l permissions.txt

    -rw-r--r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    paul@laika:/~$$ chmod +x permissions.txt

    paul@laika:/~$$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example removes the group owners read.


    ```

    paul@laika:/~$ chmod g-r permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rw-r--r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example removes the others read permission.


    ```

    paul@laika:/~$ chmod o-r permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rw-rw--r 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example gives all of them write permission.


    ```

    paul@laika:/~$ chmod +w permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rw-rw-w 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    You don''t even have to type a.


    ```

    paul@laika:/~$ chmod +x permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rwxrxr-x 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    You can also select permissions.


    ```

    paul@laika:/~$ chmod u-rw permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rw-rw-x 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Feel free to make any combination of them.


    ```

    paul@laika:/~$ chmod u-rw,g-rw,o=r permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rw-rw-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Even tricky combinations are accepted by chmod.


    ```

    paul@laika:/~$ chmod u=rw,ug+rw,o=r permissions.txt

    paul@laika:/~$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# ## 1.3.5. setting octal permissions


    Most Unix administrators will use the old school octal system to talk about and
    set permissions. Look at the triplet bitwise, equating r to 4, w to 2, and x to
    1.


    | binary | octal | permission |

    |---|---|---|

    | 000 | 0 | --- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |


    This makes 777 equal to rwxrxrwx and by the same logic, 654 mean rw-r--. The chmod
    command will accept these permissions.


    ```

    paul@laika:~/perms$ chmod 777 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxrxrwx 1 paul paul 0 2007-02-07 22:34 permissions.txt

    paul@laika:~/perms$ chmod 664 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-r---- 1 paul paul 0 2007-02-07 22:34 permissions.txt\aul@laika:~/perms$ chmod
    750 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxr-x-- 1 paul paul 0 2007-02-07 22:34 permissions.txt

    ```'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.3.6. umask


    When creating a file or directory, a set of default permissions are applied. These
    default permissions are determined by the **umask**. The **umask** specifies permissions
    that you do not want set on default. You can display the umask with the **umask**
    command.


    ```

    [Harry@RHEL4b ~]$ umask

    0002

    [Harry@RHEL4b ~]$ touch test

    [Harry@RHEL4b ~]$ ls -l test

    -rw-r--r-- 1 Harry 0 Jul 24 06:03 test

    [Harry@RHEL4b ~]$

    ```


    As you can also see, the file is not executable by default. This is a general
    security feature among Unix; newly created files are never executable by default.
    You have to explicitly do `chmod +x` to make a file executable. This also means
    that the 1 bit in the umask has meaning---a umask of 0022 is the same as 0033.


    # 1.3.7. mkdir -p


    When creating directories with **mkdir** you can use the **-m** option to set
    the **mode**. This screenshot explains.


    ```

    paul@debian5~$ mkdir -m 700 MyDir

    paul@debian5~$ mkdir -m 777 Public

    paul@debian5~$ ls -dl MyDir/ Public/

    drwx-xr-x 2 paul 4096 2011-10-16 19:16 MyDir/

    drwxrwxrwx 2 paul 4096 2011-10-16 19:16 Public/

    ```


    # 1.3.8. cp -p


    To preserve permissions and time stamps from sources, use **cp -p**.


    ```

    paul@laika:~/perms cp file* cp

    paul@laika:~/perms cp -p file* cpp

    paul@laika:~/perms ls -l

    -rw-r--r-- 1 paul 0 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:26 file42


    cp:

    total 0

    -rw-r--r-- 1 paul 0 2008-08-25 13:34 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:34 file42


    cpp:

    total 0

    -rw-------r 1 paul 0 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:26 file42

    ```'
  merge: -1
  pgno: 18
