  md: '# # Chapter 11. introduction to raid


    # ## 11.1. hardware or software


    Redundant Array of Independent (originally Inexpensive) Disks or RAID can be set
    up using hardware or software. Hardware RAID is more expensive, but offers better
    performance. Software RAID is cheaper and easier to manage, but it uses your CPU
    and your memory.


    Where ten years ago nobody was arguing about the best choice being hardware RAID,
    this has changed since that technologies like mdadm, lvm and even zfs focus more
    on managability. The workload on the cpu for software RAID used to be high, but
    cpu''s have gotten a lot faster.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# 11.2. raid levels


    # 11.2.1. raid 0


    raid 0 uses two or more disks, and is often called striping (or stripe set, or
    striped volume). Data is divided into chunks, those chunks are evenly spread across
    every disk in the array. The main advantage of raid 0 is that you can create larger
    drives. raid 0 is the only raid without redundancy.


    # 11.2.2. jbod


    jbod uses two or more disks, and is often called concatenating (spanning, spanned
    set, or spanned volume). Data is written to the first disk, until it is full.
    Then data is written to the second disk... The main advantage of jbod (Just a
    Bunch of Disks) is that you can create larger drives. JBOD offers no redundancy.


    # 11.2.3. raid 1


    raid 1 uses exactly two disks, and is often called mirroring (or mirror set, or
    mirrored volume). All data written to the array is written on each disk. The main
    advantage of raid 1 is redundancy. The main disadvantage is that you lose at half
    of your available disk space (in other words, you at least double the cost).


    # 11.2.4. raid 2, 3 and 4 ?


    raid 2 uses bit level stripping, raid 3 byte level, and raid 4 is the same as
    raid 5, but with a dedicated parity disk. This is actually slower than raid 5,
    because every write would have to write parity to this one (bottleneck) disk.
    It is unlikely that you will ever see these raid levels in production.


    # 11.2.5. raid 5


    raid 5 uses three or more disks, each divided into chunks. Every time chunks are
    written to the array, one of the disks will receive a parity chunk. Unlike raid
    4, the parity chunk will alternate between all disks. The main advantage of this
    is that raid 5 will allow for full data recovery in case of one disk failure.


    # 11.2.6. raid 6


    raid 6 is very similar to raid 5, but uses two parity chunks. raid 6 protects
    against two hard disk failures. Oracle Solaris zfs uses this raid2(and also had
    raid3 with triple parity).'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 11.2.7. raid 0+1


    raid 0+1 is a mirror(1) of stripes(0). This means you first create two raid 0
    stripe sets, then you set them up as a mirror set. For example, when you have
    six 100GB disks, then the stripe sets are each 300GB. Combined in a mirror, this
    makes 300GB total. raid 0+1 will survive one disk failure. It will only survive
    the second disk failure if this disk is in the same stripe set as the previous
    failed disk.


    # 11.2.8. raid 1+0


    raid 1+0 is a stripe(0) of mirrors(1). For example, when you have six 100GB disks,
    then you first create three mirrors of 100GB each. Then you stripe them together
    into a 300GB drive. In this example, as long as not all disks in the same mirror
    fail, it can survive up to three hard disk failures.


    # 11.2.9. raid 50


    raid 5+0 is a stripe(0) of raid 5 arrays. Suppose you have nine disks of 100GB,
    then you can create three raid 5 arrays of 200GB each. You can then combine them
    into one large stripe set.


    # 11.2.10. many others


    There are many other nested raid combinations, like raid 30, 51, 60, 100, 150,
    ...'
  merge: -1
