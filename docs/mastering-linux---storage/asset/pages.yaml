  md: '# Chapter 21. samba first user account'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 21.1. creating a samba user


    We will create a user for our samba server and make this user the owner of the
    directory and all of its files. This anonymous user gets a clear description,
    but does not get a login shell.


    ```

    [root@RHEL52 samba]# useradd -s /bin/false sambanobody

    [root@RHEL52 samba]# usermod -c "Anonymous Samba Access" sambanobody

    [root@RHEL52 samba]# passwd sambanobody

    Changing password for user sambanobody:

    New UNIX password:

    Retype new password:

    passwd: all authentication tokens updated successfully.

    ```


    # 21.2. ownership of files


    We can use this user as owner of files and directories, instead of using the root
    account. This approach is clear and more secure.


    ```

    [root@RHEL52 samba]# chmod -R sambanobody:sambanobody /srv/samba/

    [root@RHEL52 samba]# ls -al /srv/samba/writable/

    total 12

    drwxr-xr-x 6 sambanobody 4096 Jan 21 06:01 ..

    drwxr-xr-x 6 sambanobody 4096 Jan 21 06:01 ..

    -rw-r--r-- 1 sambanobody 6 Jan 21 06:16 hoi.txt

    ```


    # 21.3. /usr/bin/smbpassword


    The anonymous user account we created in the previous examples is not yet used
    by samba. Just us the files and directories that we created for our shares. The
    goal of this section is to force ownership of files created through the samba
    share to belong to our sambanobody user. Remember, our server is still accessible
    to everyone, who needs to know this account or password. We just want a clean
    Linux server.


    To accomplish this, we first have to tell samba about this user. We can do this
    by adding the account to smbpassword.


    ```

    [root@RHEL52 samba]# smbpassword -a sambanobody

    New SMB password:

    Retype new SMB password:

    Added user sambanobody.

    ```


    # 21.4. /etc/samba/smbpassword


    To find out Where keeps this information (for now), use smbd -b. The PRIVATE_DIR
    variable will show you where the samba database is located.


    ```

    [root@RHEL52 samba]# smbd -b | grep PRIVATE

    PRIVATE_DIR: /etc/samba

    [root@RHEL52 samba]# ls -l smbpassword

    -rw------- 1 root root 110 Jan 21 06:19 smbpassword

    ```


    You can use a simple cat to see the contents of the smbpassword database. The
    sambanobody user has a password (it is secret).


    ```

    [root@RHEL52 samba]# cat smbpassword

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# 21.5. passdb backend


    Note that recent versions of Samba have **tdbsam** as default for the **passdb
    backend** parameter.


    ```

    root@ubull110:~# testparam -v 2>/dev/null | grep ''passdb backend''

    passdb backend = tdbsam

    ```


    # 21.6. forcing this user


    Now that Samba knows about this user, we can adjust our writable share to force
    the ownership of files created through it. For this we use the **force user**
    and **force group** options. Now we can be sure that all files in the Samba writable
    share are owned by the same sambanobody user.


    Below is the renewed definition of our share in smb.conf.


    ```

    [pubwrite]

    path = /srv/samba/writable

    comment = files to write

    force user = sambanobody

    force group = sambanobody

    read only = no

    gest ok = yes

    ```


    When you reconnect to the share and write a file, then this sambanobody user will
    own the newly created file (and nobody needs to know the password).'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 21.7. practice: first samba user account


    +   1. Create a user account for use with samba.

    2. Add this user to samba''s user database.

    3. Create a writable shared directory and use the "force user" and "force group"
    directives to force ownership of files.

    4. Test the working of force user with smbclient, net use and Windows Explorer.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# 21.8. solution: first samba user account


    1. Create a user account for use with samba.


    ```

    useradd -s /bin/false smbguest

    usermod -c ''samba guest''

    password smbguest

    ```


    2. Add this user to samba''s user database.


    ```

    smbpasswd -a smbguest

    ```


    3. Create a writable shared directory and use the "force user" and "force group"
    directives to force ownership of files.


    ```

    [userwrite]

    path = /srv/samba/userwrite

    comment = everyone writes files owned by smbguest

    read only = no

    guest ok = yes

    force user = smbguest

    force group = smbguest

    ```


    4. Test the working of force user with smclient, net use and Windows Explorer.


    ```

    ls -l /srv/samba/userwrite (and verify ownership)

    ```'
  merge: -1
