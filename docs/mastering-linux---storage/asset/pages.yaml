  md: '# 1.5. solution: standard file permissions


    +   1. As normal user, create a directory ~/permissions. Create a file owned by
    yourself in there.

    mkdir ~/permissions ; touch ~/permissions/myfile.txt


    +   2. Copy a file owned by root from /etc/ to your permissions dir, who owns
    this file now?

    cp /etc/hosts ~/permissions/


    The copy is owned by you.


    +   3. As root, create a file in the users ~/permissions directory.

    (become root#) touch /home/username/permissions/rootfile


    +   4. As normal user, look at who owns this file created by root.

    ls -l ~/permissions


    The file created by root is owned by root.


    +   5. Change the ownership of all files in ~/permissions to yourself.

    chown user ~/permissions/*


    You cannot become owner of the file that belongs to root.


    +   6. Make sure you have all rights to these files, and others can only read.

    chmod 644 (on files)

    chmod 755 (on directories)


    +   7. With chmod, 770 is the same as rwxrwx--- ?

    yes


    +   8. With chmod, 664 is the same as r-xr-xr- ?

    No


    +   9. With chmod, 400 is the same as r------- ?

    yes


    +   10. With chmod, 734 is the same as rwxr-xr-- ?

    no


    +   11a. Display the umask in octal and in symbolic format.

    umask ; umask -S


    +   11b. Set the umask to 077, but use the symbolic format to set it. Verify that
    this works.

    umask -S u=rw,go='
