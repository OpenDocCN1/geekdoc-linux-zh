- img_proc: true
  md: '# Chapter 4. file links


    An average computer using Linux has a file system with many hard links and symbolic
    links.


    To understand links in a file system, you first have to understand what an inode
    is.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 4.1. inodes


    # 4.1.1. inode contents


    **inode** is a data structure that contains metadata about a file. When the file
    system stores a new file on the hard disk, it stores not only the contents (data)
    of the file, but also properties like the name of the file, the creation date,
    its permissions, the owner of the file, and more. All this information (except
    the name of the file and the contents of the file) is stored in the **inode**
    of the file.


    The **ls -l** command will display the inode contents, as seen in this screenshot.


    ```

    root@rhel53 $ #ls -ld /home/project42/

    drwx-xr-x 4 root pro42 4.0K Mar 27 14:29 /home/project42/

    ```


    # 4.1.2. inode number


    The **inode table** contains all of the **inodes** and is created when you create
    the file system (**mkfs**). You can use the **df -i** command to see how many
    **inodes** are used and free on mounted file systems.


    ```

    root@rhel53 $ df -i

    Filesystem Inodes IUsed IFree IUse% Mounted on

    /dev/mapper/VolGroup00-LoVG100 494768 115326 379442 23% /

    /dev/hd1 26104 45 26059 1% /boot

    tmpfs 64417 1 64416 1% /dev/shm

    /dev/sda1 262144 2207 259937 1% /home/project42

    /dev/sdb1 7400 5519 68881 8% /home/project33

    /dev/sdb5 0 0 0 /home/sales

    /dev/sdb6 100744 11 100733 0% /home/research

    ```


    In the df -i above you can see the **inode** usage for several mounted file systems.
    You don''t see for /dev/sdb5 because it is a **fat** file system.


    # 4.1.3. inode number


    Each **inode** has a unique number (the inode number). You can see the **inode**
    numbers with the **ls -li** command.


    ```

    paul@RHEL4u4: $ touch file1

    paul@RHEL4u4: $ touch file2

    paul@RHEL4u4: $ touch file3

    paul@RHEL4u4: $ touch file5 ls -li

    total 12

    817266 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file1

    817267 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file3

    paul@RHEL4u4:~$ /test

    ```


    These three files were created one after the other and got three different **inodes**
    (the first column). All of them you see with this command resides in the **inode**,
    except for the filename (which is contained in the directory).'
