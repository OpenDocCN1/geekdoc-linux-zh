  md: '# 7.5. checking a file system


    The fsck command is a front end tool used to check a file system for errors.


    ```

    [root@RHELAB ~#] ls /sbin/*fsck*

    /sbin/dosfsk /sbin/fsck /sbin/fsck.ext2 /sbin/fsck.msdos

    /sbin/e2fsck /sbin/fsck.cramfs /sbin/fsck.ext3 /sbin/fsck.vfat

    [root@RHELAB ~#]

    ```


    The last column in /etc/fstab is used to determine whether a file system should
    be checked at boot-up.


    ```

    [paul@RHELAB ~#] grep ext /etc/fstab

    /dev/VolGroup00/LogVol100 ext3 defaults 1 1

    LABEL=/ /boot ext3 defaults 1 2

    [paul@RHELAB ~#]

    ```


    Manually checking a mounted file system results in a warning from fsck.


