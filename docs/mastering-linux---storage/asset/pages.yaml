    +   13a. Create a file as normal user, give only read to others. Can another normal
    user read this file ? Test writing to this file with vi.


    +   13b. Can root write to this file with vi ?


    +   14. Create a directory that belongs to a group, where every member of that
    group can read and write to files, and create files. Make sure that people can
    only delete their own files.'
