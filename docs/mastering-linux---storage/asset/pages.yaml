  md: "# 17.4. starting and stopping samba\n\nYou can start the daemons by invoking\
    \ /etc/init.d/smb start (some systems use /etc/init.d/samba) on any linux.\n\n\
    ```\nroot@laika:-# /etc/init.d/samba stop\n  * Stopping Samba daemons        \
    \     [ OK ]\nroot@laika:-# /etc/init.d/samba start\n  * Starting Samba daemons\
    \             [ OK ]\nroot@laika:-# /etc/init.d/samba restart\n  * Stopping Samba\
    \ daemons             [ OK ]\nroot@laika:-# /etc/init.d/samba status\n  * Starting\
    \ Samba daemons             [ OK ]\n  * SMBD is running                      [\
    \ OK ]\n```\n\nRed Hat systems are happy with service smb start.\n\n```\n[root@RHEL4b\
    \ ~]# /etc/init.d/smb start\nStarting SMB services:                [ OK ]\nStarting\
    \ NMB services:                [ OK ]\n[root@RHEL4b ~]# service smb restart\n\
    Shutting down SMB services:           [ OK ]\nShutting down NMB services:    \
    \       [ OK ]\nStarting SMB services:                [ OK ]\nStarting NMB services:\
    \                [ OK ]\n[root@RHEL4b ~]#\n```"
