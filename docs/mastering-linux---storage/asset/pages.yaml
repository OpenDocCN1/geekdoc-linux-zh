  md: "# 12.6. example: mirror a logical volume\n\nWe are creating three physical\
    \ volumes for lvm. Then we verify the creation and the size with p. Three physical\
    \ disks lvm uses two disks for the mirror and the third disk for the log!\n\n\
    ```\n[root@RHEL5 ~]# pv create /dev/sdb /dev/sdc /dev/sdd\nPhysical volume \"\
    /dev/sdb\" successfully created\nPhysical volume \"/dev/sdc\" successfully created\n\
    Physical volume \"/dev/sdd\" successfully created\n[root@RHEL5 ~]# pvs\n VG Fmt\
    \ Attr PSize PFree\n/dev/sdb lvm2 409.60M 409.60M\n/dev/sdc vg33 lvm2 a 408.00M\
    \ 408.00M\n/dev/sdd vg33 lvm2 a 408.00M 408.00M\n```\n\nThen we create the Volume\
    \ Group and verify again with pvs. Notice the three physical volumes now belong\
    \ to vg33, where the size is rounded down (in steps of the extent size, here 4MB).\n\
    \n```\n[root@RHEL5 ~]# vgcreate /dev/sdb /dev/sdc /dev/sdd\nVolume group \"vg33\"\
    \ successfully created\n[root@RHEL5 ~]# pvs\n VG Fmt Attr PSize PFree\n/dev/sda2\
    \ Volgroup00 lvm2 a 15.88GB 0\n/dev/sdb vg33 lvm2 a 408.00M 108.00M\n/dev/sdc\
    \ vg33 lvm2 a 408.00M 408.00M\n/dev/sdd vg33 lvm2 a 408.00M 404.00M\n[root@RHEL5\
    \ ~]# -\n```\n\nThe last step is to create the Logical Volume with lvcreate. Notice\
    \ the -m1 switch to create one mirror. After the free space in all three Physical\
    \ Volumes!\n\n```\n[root@RHEL5 ~]# lvcreate -size 300m -n lvmir -m 1 vg33\nLogical\
    \ volume \"lvmir\" created\n[root@RHEL5 ~]# pvs\n VG Fmt Attr PSize PFree\n/dev/sda2\
    \ Volgroup00 lvm2 a 15.88GB 0\n/dev/sdb vg33 lvm2 a 408.00M 108.00M\n/dev/sdc\
    \ vg33 lvm2 a 408.00M 408.00M\n/dev/sdd vg33 lvm2 a 408.00M 404.00M\n```\n\nYou\
    \ can see the copy status of the mirror with lvs. It shows a 100 percent copy.\n\
    \n```\n[root@RHEL5 ~]# lvs vg33/lvmir\n LV VG Attr LSize Origin Snap% Move Log\
    \ Copy%\nlvmir vg33 mwi-a 300.00M lvmir_100.00\n```"
