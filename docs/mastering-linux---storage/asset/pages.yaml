  md: "# 13.11. solution: iSCSI devices\n\n1. Set up a target (using LVM and a SCSI\
    \ device) and an initiator that connects to both.\n\nThis solution was done for\
    \ Debian/ubuntu/Mint. For RHEL/CentOS check the theory.\n\nDecide (with a partner)\
    \ on a computer to be the Target and another computer to be the Initiator.\n\n\
    **On the Target computer:**\n\nFirst install iscsitarget using the standard tools\
    \ for installing software in your distribution. Then use your knowledge from the\
    \ previous chapter to setup a logical volume (/dev/vg/lvol0) and use the RAID\
    \ chapter to setup /dev/md0. Then perform the following step:\n\n```\nvi /etc/default/iscsarget\
    \ (set enable to true)\n```\n\nAdd devices to /etc/ietf.conf\n\n```\nroot@dbeby66:/etc/ietf#\
    \ cat ietf.conf\nTarget iqn.2010-02.be.linux-training:storage.lun1\nIncomingUser\
    \ isuser hunter2\nOutgoingUser\nLun 0 Path=/dev/vg/lvol0,Type=fileio\nAlias LUN1\n\
    Target iqn.2010-02.be.linux-training:storage.lun2\nIncomingUser isuser hunter2\n\
    OutgoingUser\nLun 0 Path=/dev/md0,Type=fileio\nAlias LUN2\n```\n\nAdd both devices\
    \ to /etc/init/initiators.allow\n\n```\nroot@dbeby66:/etc/ietf# cat initiators.allow\n\
    iqn.2010-02.be.linux-training:storage.lun1\niqn.2010-02.be.linux-training:storage.lun2\n\
    ```\n\nNow start the iscsarget daemon and move over to the Initiator.\n\n**On\
    \ the Initiator computer:**\n\nInstall open-iscsi and start the daemon.\n\nThen\
    \ iscsiad -m discovery -st -p 'target-ip' to see the iscsi devices on the Target.\n\
    \nEdit the files /etc/iscsi/nodes/ as shown in the book. Then restart the iSCSI\
    \ daemon and\n fdisk -l to see the iSCSI devices."
  merge: -1
  pgno: 153
