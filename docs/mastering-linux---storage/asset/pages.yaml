- img_proc: true
  md: '# 20.1. set up a directory to share


    In this second example, we will create a share where everyone can create files
    and write to files. Again, we start by creating a directory


    ```

    root@RHEL52 samba# mkdir -p /srv/samba/writable

    root@RHEL52 samba# chmod 777 /srv/samba/writable/

    ```


    # 20.2. share section in smb.conf


    There are two parameters to make a share writable. We can use **read only** or
    **writable**. This example shows how to use **writable** to give write access
    to a share.


    ```

    writable = yes

    ```


    And this is an example of using the **read only** parameter to give write access
    to a share.


    ```

    read only = no

    ```


    # 20.3. configure the share


    Then we add a share to our server file by editing smb.conf. Below the check with
    testparm (We could have changed the description of the server...)


    ```

    root@RHEL52 samba# testparm

    Load smb config files from /etc/samba/smb.conf

    Processing section "pubwrite"

    Processing section "pubread"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    Press enter to see a dump of your service definitions

    [global]

    netbios name = TEACHERO

    server string = Public Anonymous File Server

    security = SHARE

