    You can also create a file with names of files and directories to archive, and
    then supply this file to tar with the -T flag.


    ```

    root@HELVU4:-# find -name *.conf > files_to_archive.txt

    root@HELVU4:-# find /home -name *.pdf >> files_to_archive.txt

    root@HELVU4:-# tar cpzf /backup/tar.tgz -T files_to_archive.txt

    ```


    The tar utility can receive filenames from the find command, with the efficiency
    of xargs.


    ```

    find /etc -type f "*.conf" | xargs tar czf /backup/confs.tar.gz

    ```


    You can also use tar to copy a directory, which is more efficient than using cp-r.


    ```

    (cd /etc; tar -cf - ) | (cd /backup/copy_of_etc/; tar -xpf - )

    ```


    Another example of tar, this copies a directory securely over the network.


    ```

    (cd /etc;tar -cf - ) |(ssh user@srv cd /backup/cp_of_etc/; tar -xf - )

    ```


    tar can be used together with gzip and copy a file to a remote server over ssh


    ```

    cat backup.tar | gzip | ssh bashuser@192.168.1.105 "cat - > backup.tar"

    ```


    Compress the backup when it is on the network, leave it uncompressed at the destination.


    ```

    cat backup.tar | gzip | ssh user@192.168.1.105 "gunzip|cat - > backup.tar"

    ```


    Same as the previous, let ssh handle the compression


    ```

    cat backup.tar | ssh -C bashuser@192.168.1.105 "cat - > backup.tar"

    ```


    # 15.4. Backup Types


    Linux uses multilevel incremental backups using distinct levels. A full backup
    is a backup at level 0. A higher level x backup will include all changes since
    the last level x-1 backup.


    Suppose you take a full backup on Monday (level 0) and a level 1 backup on Tuesday,
    the Tuesday backup will contain all changes since Monday. Taking a level 2 on
    Wednesday'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'will contain all changes since Tuesday (the last level 2-1). A level 3 backup
    on Thursday

    will contain all changes since Wednesday (the last level 3-1). Another level 3
    on Friday

    will contain all changes since Wednesday. A level 2 backup on Saturday would take

    all changes since the last level 1 from Tuesday.


    # 15.5. dump and restore


    dump is similar to tar, it is also very different because it looks at the file
    system.

    Where tar receives a lists of files to dump, dump will find files by itself by

    mining ext2. Files found by dump will be copied to a tape or regular file. In
    case the

    target is not big enough to hold the dump (end-of-media), it is broken into multiple
    volumes.


    Restoring files that were backed up with dump is done with the restore command.
    In the

    example below we take a full level 0 backup of two partitions to a SCSI tape.
    The rewind

    is mandatory to put when the files beside each other on the tape.


    ```

    dump 0 /dev/nst0 /boot

    dump 0 /dev/nst0 /

    ```


    Listing files in a dump archive is done with dump -t, and you can compare files
    with dump

    C.


    You can omit files from a dump by changing the dump attribute with the chattr
    command.

    The d attribute on will tell dump to skip the file, even during a full backup.
    In the

    following example, /etc/hosts is excluded from dump archives.


    ```

    chattr +d /etc/hosts

    ```


    To restore the complete file system with restore, use the -r option. This can
    be useful to

    change the size or block size of a file system. You should have a clean file system
    mounted

    and cd''d into it. Like this example shows.


    ```

    mk2fs /dev/hda3

    mount /dev/hda3 /mnt/data

    cd /mnt/data

    restore rf /dev/nst0

    ```


    To extract only one file or directory from a dump, use the -x option.


    ```

    restore -xf /dev/st0 /etc

    ```


    # 15.6. cpio


    Different from tar and dump is cpio (Copy Input and Output). It can be used to
    receive

    filenames, but copies the actual files. This makes it an easy companion with find!
    Some

    examples below.'
