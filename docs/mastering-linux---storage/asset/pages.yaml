- img_proc: true
  md: '# 6.1. about partitions


    # 6.1.1. primary, extended and logical


    Linux requires you to create one or more partitions. The next paragraphs will
    explain how to create and use partitions.


    A partition''s geometry and size is usually defined by a starting and ending cylinder
    (sometimes by sector). Partitions can be of type primary (max four), extended
    (max one) and or logical (contained within the extended partition). Each partition
    has a type field that contains a code. This determines the computers operating
    system or the partitions file system.


    Table 6.1. primary, extended and logical partitions

    | Partition Type | naming |

    | --- | --- |

    | Primary (max 4) | 1-4 |

    | Extended (max 1) | 1-4 |

    | Logical | 5- |


    # 6.1.2. partition naming


    We saw before that hard devices are named /dev/hdx or /dev/sdx with x depending
    on the hardware configuration. Next is the partition number, starting the count
    at 1. Hence the four (possible) primary partitions are numbered 1 to 4. Logical
    partition counting always starts at 5. Thus /dev/hda2 is the second partition
    on the first ATA hard disk device, and /dev/hdb5 is the first logical partition
    on the second ATA hard disk device. Same for SCSI, / /dev/sdb3 is the third partition
    on the second SCSI disk.


    Table 6.2. Partition naming

    | partition | device |

    | --- | --- |

    | /dev/hda1 | first primary partition on /dev/hda |

    | /dev/hda2 | second primary or extended partition on /dev/hda |

    | /dev/sda5 | first logical drive on /dev/sda |

    | /dev/sdb6 | second logical on /dev/sdb |


    The picture below shows two (spindle) disks with partitions. Note that an extended
    partition is a container holding logical drives.


    ![](img/66ba2c5c822cbe260e00b2d9933c1a54_57_0.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: "# 6.2. discovering partitions\n\n# 6.2.1. fdisk -l\n\nIn the **fdisk -l** example\
    \ below you can see that two partitions exist on **/dev/sdb**. The first partition\
    \ spans 31 cylinders and contains a Linux swap partition. The second partition\
    \ is much bigger.\n\n```\nroot@laika:~# fdisk -l /dev/sdb\n\nDisk /dev/sdb: 100.0\
    \ GB, 100030242816 bytes\n255 heads, 63 sectors/track, 12161 cylinders\nUnits\
    \ = cylinders * 16065 / 512 = 8225280 bytes\n\n    Device Boot       Start   \
    \      End Blocks Id System\n/dev/sdb1             31        248976 Linux swap\
    \ / Solaris\n/dev/sdb2             32        12161 97434225 83 Linux\nroot@laika:~#\n\
    ```\n\n# 6.2.2./ /proc/partitions\n\nThe **/proc/partitions** file contains a\
    \ table with major and minor of partitioned devices, their number of blocks and\
    \ the device name in **/dev**. Verify with **/proc/devices** to link the major\
    \ number to the proper device.\n\n```\npaul@RHELv4u:~$ cat /proc/partitions\n\
    major minor #blocks name\n3      0 524288 hda\n3      64 734003 hdb\n8      0\
    \ 838608 sda\n8      1 104391 sda1\n8      2 828107 sda2\n8      16 1048576 sdb\n\
    8      32 1048576 sdb1\n8      48 7176192 dm-0\n253    0 1048576 dm-1\n```\n\n\
    The **major** number corresponds to the device type (or driver) and can be found\
    \ in **/proc/devices**. In this case 3 corresponds to id 8 and to 8 sd. The **major**\
    \ number determines the **device driver** to be used with this device.\n\nThe\
    \ **minor** number is a unique identification of an instance of this device type.\
    \ The **devices.txt** file in the kernel tree contains a full list of major and\
    \ minor numbers."
