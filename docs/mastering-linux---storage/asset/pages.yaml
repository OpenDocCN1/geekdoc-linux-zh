    # 15.8. split


    The split command is useful to split files into smaller files. This can be useful
    to fit the file into multiple instances of a medium too small to contain the complete
    file. In the example below, a file of size 5000 bytes is split into three smaller
    files, with maximum 2000 bytes each.


