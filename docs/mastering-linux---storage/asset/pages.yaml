  md: '# 12.4. example: extend a logical volume


    A logical volume can be extended without unmounting the file system. Whether or
    not a volume can be extended on the file system it uses. Volumes that are mounted
    as vfat or ext2 can be extended, in this example here we use the ext3 file system.


    The fdisk command shows us newly added scsi disks that will serve our lvm volume.
    This volume will then be extended. First, take a look at these.


    ```

    [root@RHEL5 ~] # fdisk -l | grep sd[bc]

    dev/sdb doesn''t contain a valid partition table

    dev/sdc doesn''t contain a valid partition table

    dev/sdb: 1118 MB, 118115904 bytes

    dev/sdc: 429 MB, 429496320 bytes

    ```


    You already know how to partition a disk, the first disk is partitioned (in one
    big primary partition), the second disk is untouched.


    ```

    [root@RHEL5 ~] # fdisk -l | grep sd[bc]

    dev/sdc doesn''t contain a valid partition table

    dev/sdb: 1118 MB, 118115904 bytes

    dev/sdb 1 143 1148616 83 Linux

    dev/sdc: 429 MB, 429496320 bytes

    ```


    You also know how to prepare disks for lvm with pvcreate, and how to create a
    volume group with vgcreate. This example adds both partitioned disk and the untouched
    disk to the volume group vg2.


    ```

    [root@RHEL5 ~] # pvcreate /dev/sdb

    Physical volume "/dev/sdb" successfully created

    [root@RHEL5 ~] # pvcreate /dev/sdc

    Physical volume "/dev/sdc" successfully created

    [root@RHEL5 ~] # vgcreate vg2 -j /dev/sdb /dev/sdc

    Volume group "vg2" successfully created

    ```


    You can use pdisplay to verify that the disk and the partition to the volume group.


    ```

    [root@RHEL5 ~] # pvdisplay | grep -B1 vg2

    /dev/sdb1

    PV Name

    VG Name vg2

    ---

    PV Name /dev/sdc

    VG Name vg2

    ```


    And you are finished with the lvcreate command to create a small logical volume
    and the mke2fs command to put ext3 on.


    ```

    [root@RHEL5 ~] # lvcreate --size 200m vg2

    Logical volume "lvol01" created

    [root@RHEL5 ~] # mk2fs -m20 -j /dev/vg2/lvol0

    ---

    ```'
