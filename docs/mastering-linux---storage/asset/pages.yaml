- img_proc: true
  md: '# 2.6. solution: sticky, setuid and setgid bits


    1a. Set up a directory, owned by the group sports.


    ```

    groupadd sports

    mkdir /home/sports

    chown root:/home/sports

    ```


    1b. Members of the sports group should be able to create files in this directory.


    ```

    chmod 770 /home/sports

    ```


    1c. All files created in this directory should be group-owned by the sports group.


    ```

    chmod 2770 /home/sports

    ```


    1d. Users should be able to delete only their owner-owned files.


    ```

    chmod + /home/sports

    ```


    1e. Test that this works!


    Log in with different users (group members and others and root), create files
    and watch the permissions. Try changing and deleting files...


    2. Verify the permissions on /usr/bin/passwd. Remove the setuid, then changing
    your password as a normal user. Reset the permissions and try again.


    ```

    root@deb503:~# ls -l /usr/bin/passwd

    -rwsr-xr-x 1 root 31704 2009-11-14 14:51 /usr/bin/passwd

    root@deb503:~# chmod 755 /usr/bin/passwd

    root@deb503:~# ls -l /usr/bin/passwd

    -rwxr-xr-x 1 root 31704 2009-11-14 14:51 /usr/bin/passwd

    ```


    A normal user change password now.


    ```

    root@deb503:~# chmod 4755 /usr/bin/passwd

    root@deb503:~# ls -l /usr/bin/passwd

    -rwsr-xr-x 1 root 31704 2009-11-14 14:51 /usr/bin/passwd

    ```


    3. If time permits (or if you are waiting for other students to finish this practice),
    read about file attributes in the man page of getattr. Try setting the attribute
    on a file and test that it works.


    ```

    paul@laika:~# sudo su -

    [sudo] password for paul:

    root@laika:~# mdir attr

    root@laika:~# cd attr

    root@laika://attr# touch file42

    root@laika://attr# lsattr

    --------------.file42

    root@laika://attr# chatter +i file42

    ```'
