    drwxr-xr-x 2 Venus 4096 Jul 05 10:03 NetHome

    -rw-r--r-- 1 Venus 52428 Jul 05 20:07 NTUSER.DAT

    -rw-r--r-- 1 Venus 1024 Jul 26 10:03 NTUSER.DAT.LOG

    drwxr-xr-x 2 Venus 4096 Jul 05 10:03 PrintHood

