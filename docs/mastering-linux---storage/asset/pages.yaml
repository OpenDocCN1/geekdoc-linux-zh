  md: '# # Chapter 5. disk devices


    This chapter teaches you how to locate recognise hard disk devices. This prepares
    you for the next chapter, where we put partitions on these devices.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 5.1. terminology


    # 5.1.1. platter, head, track, cylinder, sector


    Data is commonly stored on magnetic or optical disk platters. The platters are
    rotated (at high speeds). Data is read by heads, which are very close to the surface
    of the platter, without touching it! The heads are mounted on an arm (sometimes
    a comb or a fork).


    Data is written in concentric circles called tracks. Track zero is (usually) on
    the outside. The time it takes to position the head over a certain track is called
    the seek time. Often the platters are stacked on top of each other, the set of
    tracks accessible at a certain position of the comb forms a cylinder. Tracks are
    divided into 512 byte sectors, with more unused space (gap) between the sectors
    on the outside of the platter.


    When you break down the advertised access time of a hard drive, you will notice
    that time is taken by movement of the heads (about 65%) and rotational latency
    (about 30%).


    # 5.1.2. ide or scsi


    Actually, the title should be ata or scsi, since ide is an ata compatible device.
    Most desktops use ata devices, most servers use scsi.


    # 5.1.3. ata


    An ata controller allows two devices per bus, one master and one slave. Unless
    your controller and devices support cable select, you have to set this manually
    with jumpers.


    With the introduction of sata (serial ata), the original ata was renamed to parallel
    ata. Optical drives often use atapi, which is an ATA interface using the SCSI
    communication protocol.


    # 5.1.4. scsi


    A scsi controller allows more than two devices. When using SCSI (small computer
    system interface), each device has a unique scsi id. The scsi controller also
    needs a scsi id, do not use this id for a scsi-attached device.


    Older-8-bit SCSI is now called narrow, whereas 16-bit is wide. When the bus speeds
    doubled to 10Mhz, this was known as fast SCSI. Doubling to 20Mhz made it ultra
    SCSI. Take a look at http://en.wikipedia.org/wiki/SCSI for more SCSI standards.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# 5.1.5. block device


    Random access hard disk devices have an abstraction layer called block device
    to enable formatting in fixed-size (usually 512 bytes) blocks. Blocks can be accessed
    independent of access to other blocks.


    ```

    ```

    [root@centos6]# ls -l /dev/sd*

    brw-rw---- 1 root disk 8, 0 Apr 19 10:12 /dev/sda

    brw-rw----- 1 root disk 8, 1 Apr 19 10:12 /dev/sda1

    brw-rw----  1 root disk 8, 2 Apr 19 10:12 /dev/sda2

    brw-rw----  1 root disk 8, 11 Apr 19 10:12 /dev/sdb

    brw-rw----  1 root disk 8, 32 Apr 19 10:12 /dev/sdc

    ```

    ```


    Note that a character device is a constant stream of characters, being denoted
    by a c in ls. Note also that the ISO V960 standard for cdrom uses a 2048 byte
    block size.


    Old hard disks (and floppy disks) use cylinder-head-sector addressing to access
    a sector on the disk. Most current disks use LBA (Logical Block Addressing).


    # 5.1.6. solid state drive


    A solid state drive or ssd is a block device without moving parts. It is comparable
    to flash memory. An ssdsd is more expensive than a hard disk, but typically has
    a much faster access time.


    In this book we will use the following pictograms for solid disks (in brown) and
    solid state disks (in blue).


    ![](img/66ba2c5c822cbe260e00b2d9933c1a54_44_0.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 5.2. device naming


    # 5.2.1. ata (ide) device naming


    All ata drives on your system will start with /dev/hd followed by a unit letter.
    The master hdd on the first ata controller is /dev/hda, the slave is /dev/hdb.
    For the second controller, the names of the devices are /dev/hdc and /dev/hdd.


    Table 5.1. ide device naming


    | controller | connection | device name |

    |--- |--- | --- |

    | ide0 | master | /dev/hda |

    | | slave | /dev/hdb |

    | ide1 | master | /dev/hdc |

    | | slave | /dev/hdd |


    It is possible to have only /dev/hda and /dev/hdd. The first one is a single ata
    hard disk, the second one is the cdrom (by default configured as slave).


    # 5.2.2. scsi device naming


    scsi drives follow a similar scheme, but all start with /dev/sd. When you run
    out of letters (after /dev/sdz), you can continue with /dev/sda and /dev/sdab
    and so on. (We will see later on lvm volumes are commonly seen as /dev/md0, /dev/md1
    etc.)


    Below a sample of how scsi devices on a Linux can be named. Adding a scsi disk
    or raid controller with a lower scsi address will change the naming scheme (shifting
    the higher scsi addresses one letter further in the alphabet).


    Table 5.2. scsi device naming


    | device | scsi id | device name |

    |--- |--- | --- |

    | disk 0 | 0 | /dev/sda |

    | disk 1 | 1 | /dev/sdb |

    | raid controller 0 | 5 | /dev/sdc |

    | raid controller 1 | 6 | /dev/ssd |


    A modern Linux system will use /dev/sd* for scsi and sata devices, and also for
    sd-cards, usb-sticks, (legacy) ATA/IDE devices and solid state drives.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 5.3. discovering disk devices


    # 5.3.1. fdisk


    You can start by using **/sbin/fdisk** to find out what kind of disks are seen
    by the kernel.

    Below on the result on Debian desktop, with two **ata-ide** disks.


    ```

    root@barry:~# fdisk -l | grep Disk

    Disk /dev/hda: 60.0 GB, 60022480896 bytes

    Disk /dev/hdb: 81.9 GB, 81964032336 bytes

    ```


    Here is an example of **sata** and **scsi** disks on a server with CentOS. Remember
    that both disks are also presented to the user with **/dev/sd** notation.


    ```

    [root@centos65 ~]# fdisk -l | grep /dev/sd

    Disk /dev/sda: 42.9 GB, 42949672960

    Disk /dev/sdb: 77.3 GB, 73309411328 bytes

    Disk /dev/sdc: 154.6 GB, 154618822656 bytes

    Disk /dev/sdd: 154.6 GB, 154618822656 bytes

    ```


    Here is an overview of disks on a RHEL4 server with two 72 GB scsi disks. The
    server is attached to a NAS with four NAS disks of half a terabyte. On the NAS
    disks, four (/dev/mdx) software devices are configured.


    ```

    [root@stevll ~]# fdisk -l | grep Disk

    Disk /dev/sda: 73.4 GB, 73407480000 bytes

    Disk /dev/sdb: 73.4 GB, 73407480000 bytes

    Disk /dev/sdc: 499.0 GB, 499036192768 bytes

    Disk /dev/sdd: 499.0 GB, 499036192768 bytes

    Disk /dev/sde: 499.0 GB, 499036192768 bytes

    Disk /dev/md0: 271.0 MB, 273130400 bytes

    Disk /dev/md1: 21.4 GB, 21476081664 bytes

    Disk /dev/md2: 21.4 GB, 214760889664 bytes

    Disk /dev/md3: 21.4 GB, 21476081664 bytes

    Disk /dev/md1: 21.4 GB, 21476081664 bytes

    ```


    You can also use fdisk to obtain information about one specific hard device.


    ```

    [root@centos65 ~]# fdisk -l /dev/sdc

    Disk /dev/sda: 154.6 GB, 154618822656 bytes

    255 heads, 63 sectors, 18798 cylinders

    Units = cylinders of 1606 * 512 = 8225280

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/maximum): 512 bytes / 512 bytes

    Disk identifier: 0x00000000

    ```


    Later we will use fdisk to dangerous stuff like creating and deleting partitions.'
