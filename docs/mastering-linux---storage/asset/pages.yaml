- img_proc: true
  md: '# # Chapter 15. backup


    # ## 15.1. About tape devices


    Don''t forget that the name of a device strictly speaking has no meaning since
    the kernel use the major and minor number to find the hardware! See the page of
    **mknod** and the devices.txt file in the Linux kernel for more info.


    # ### 15.1.1. SCSI tapes


    On official Linux device list (http://www.lanana.org/docs/device-list/) we find
    the names for SCSI tapes (major 9 char). SCSI tapes are located underneath /dev/st
    and are numbered starting with 0 for the first tape device.


    | /dev/st0 | First tape device |

    | /dev/st1 | Second tape device |

    | /dev/st2 | Third tape device |


    To prevent **automatic rewinding of tapes**, prefix them with the letter n.


    | /dev/nst0 | First no rewind tape device |

    | /dev/nst1 | Second no rewind tape device |

    | /dev/nst2 | Third no rewind tape device |


    By default, SCSI tapes on Linux will use the highest hardware compression that
    is supported by the tape device. To lower the compression level, append one of
    the letters 1 (low), m (medium) or a (auto) to the tape name.


    | /dev/st01 | First low compression tape device |

    | /dev/st0m | First medium compression tape device |

    | /dev/nst2m | Third no rewind medium compression tape device |


    # ## 15.1.2. IDE tapes


    On official Linux device list (http://www.lanana.org/docs/device-list/) we find
    the names for IDE tapes (major 37 char). IDE tape devices are located underneath
    /dev/ht and are numbered starting with 0 for the first tape device. No rewind
    and compression is similar to SCSI tapes.


    | /dev/ht0 | First IDE tape device |

    | /dev/nth0 | Second no rewind IDE tape device |

    | /dev/ht0m | First medium compression IDE tape device |


    # ### 15.1.3. mt


    To manage your tapes, use **mt** (Magnetic Tape). Examples.'
  merge: -1
  pgno: 168
- img_proc: true
  md: "To receive information about the status of the tape.\n\n```\nmt -f /dev/st0\
    \ status\n```\n\nTo rewind a tape...\n\n```\nmt -f /dev/st0 rewind\n```\n\nTo\
    \ rewind and eject a tape...\n\n```\nmt -f /dev/st0 eject\n```\n\nTo erase a tape...\n\
    \n```\nmt -f /dev/st0 erase\n```\n\n# 15.2. Compression\n\nIt can be beneficial\
    \ to compress files before backup. The two most popular tools for compression\
    \ of regular files on Linux are gzip/gunzip bzip2/bunzip2. Below you can see in\
    \ action, that it adds the .gz extension to file.\n\n```\npaul@RHEL4u:~test$ -l\
    \ allfiles.txt*\n-rw-rw-r-- 1 paul 8813553 Feb 27 05:38 allfiles.txt\npaul@RHEL4u:~test$\
    \ gzip allfiles.txt\npaul@RHEL4u:~test$ -l -allfiles.txt\n-rw-rw-r-- 1 paul 931863\
    \ Feb 27 05:38 allfiles.gz\npaul@RHEL4u:~test$ gzip allfiles.txt\npaul@RHEL4u:~test$\
    \ -l -allfiles.txt*\n-rw-rw-r-- 1 paul 8813553 Feb 27 05:38 allfiles.txt\npaul@RHEL4u:~test$\
    \ \n```\n\nIn general, gzip is much faster than bzip2, but the latter one compresses\
    \ lots. Let us compare the two.\n\n```\nreal\nOm0.50s\nuser\nOm0.041s\nsys\nOm0.009s\n\
    paul@RHEL4u:~test$ time bzip2 allfiles.txt\n\nreal\nOm5.968s\nuser\nOm5.794s\n\
    sys\npaul@RHEL4u:~test$ -l ?allfiles.txt*\n-rw-rw-r-- 1 paul 931863 Feb 27 05:38\
    \ allfiles.txt.gz\n-rw-rw-r-- 1 paul 708871 May 12 10:52 allfiles.txt.bz2\npaul@RHEL4u:~test$\
    \ \n```\n\n# 15.3. tar\n\nThe tar utility gets its name from TapeArchive. This\
    \ tool will receive and send files to a destination (typically a tape or a regular\
    \ file). The c option is used to create a tar archive"
  merge: -1
  pgno: 169
- img_proc: true
  md: '(or tarfile), the f option to name/create the tarfile. The example below takes
    a backup of /

    into the file /backup/etc.tar.


    ```

    root@RHELv4u:~# tar cf /backup/etc.tar /etc

    root@RHELv4u:~# ls -l /backup/etc.tar

    -rw-r--r-- 1 root 4780320 May 12 11:47 /backup/etc.tar

    root@RHELv4u:~#

    ```


    Compression can be achieved without pipes since use the z flag to compress with
    gzip,

    and the j flag to compress with bzip2.


    ```

    root@RHELv4u:~# tar czf /backup/etc.tar.gz /etc

    root@RHELv4u:~# tar cjf /backup/etc.tar.bz2 /etc

    root@RHELv4u:~# ls -l /backup/etc.tar*

    -rw-r--r-- 1 root 4780320 May 12 11:47 /backup/etc.tar.gz

    -rw-r--r-- 1 root 6077340 May 12 11:48 /backup/etc.tar.bz2

    -rw-r--r-- 1 root 8496607 May 12 11:47 /backup/etc.tar.gz

    root@RHELv4u:~#

    ```


    The option is used to list the contents of a tarfile. Verbose mode is enabled
    with (v)

    useful when you want to see the files being during archiving.


    ```

    root@RHELv4u:~# tar tvf /backup/etc.tar

    drw-xr-x root/root 0 2007-05-12 09:38:21 etc/

    -drwxr-xr-x root/root 2657 2004-09-27 10:15:03 etc/warnquota.conf

    -drwxr-xr-x root/root 13136 2006-11-03 17:34:50 etc/mime.types

    drw-xr-x root/root 0 2004-11-03 13:35:50 etc/sound/

    ...

    ```


    To list a single file in a tar archive, use the t option, and the filename (without

    leading).


    ```

    root@RHELv4u:~# tar tvf /backup/etc.tar resolve.conf

    -drwxr-xr-x root/root 77 2007-05-12 08:31:32 etc/resolve.conf

    root@RHELv4u:~#

    ```


    Use the xf to restore a tar archive, or a single file from the archive. Remember
    that by

    default tar will restore the file in the current directory.


    ```

    root@RHELv4u:~# tar xvf /backup/etc.tar resolve.conf

    etc/resolve.conf

    root@RHELv4u:~# ls -l /etc/resolve.conf

    -rw-r--r-- 2 root 40 May 12 12:05 /etc/resolve.conf

    root@RHELv4u:~# ls -l /etc/resolve.conf

    -rw-r--r-- 1 root 77 May 12 08:31:03 etc/resolve.conf

    root@RHELv4u:~#

    ```


    You can preserve permissions with the p flag. And you can exclude directories
    or files

    --exclude.


    ```

    root ~# tar cpzf /backup/etc_with_perms.tgz /etc

    ```'
