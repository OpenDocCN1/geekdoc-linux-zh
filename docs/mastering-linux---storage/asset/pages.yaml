  md: '# Chapter 1. standard file permissions


    This chapter contains details about basic file security through file ownership
    and file permissions.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# 1.1. file ownership


    # 1.1.1. user owner and group owner


    The **users** and **groups** of a system can be locally managed in `/etc/passwd`
    and `/etc/group`, or they can be in a NIS, LDAP, or Samba domain. These users
    and groups can *own* files. Actually, every file has a **user owner** and a **group
    owner**, as can be seen in the following screenshot.


    ```

    paul@local65:~/$ ls -lh

    total 636K

    -rw-r--r-- 1 paul snooker 1.1K Apr 8 18:47 data.out

    -rw-r--r-- 1 paul group 626K Apr 8 18:46 file1

    -rw-r--r-- 1 root tennis 185 Apr 8 18:46 file2

    -rw-r--r-- 1 root root 0 Apr 8 18:47 stuff.txt

    paul@local65:~/$

    ```


    User paul owns three files; file1 as **user owner** and has **group owner**, **data.out**
    is **group owned** by the group snooker, file2 by the group tennis.


    The last file is owned by the root user and the root group.


    # 1.1.2. listing user accounts


    You can use the following command to list all user accounts.


    ```

    paul8@debian7~\$ cat -d -f1 /etc/passwd | column

    root      sam       naomi

    daemonmon  mysql     rino               matthias2

    bin       paul      wouter    antonio          Bram

    sys       maarten   robrecht  simon             fabrice

    sync      kevin     bilal      sven               chimene

    games     yuri      dimitri   wouter2            messengersbus

    man       yves      ahmed      tarik              roger

    mail      robin     dylan      jan               toon

    news      hamed    matthias  ivan               rinus

    uucp     ladimir  ben               ezdine            eddy

    www-data  david                 camel             bram

    backup    chahid    kenzo      ischa              jeesse

    list      stef      aaron      bart               frederick

    ici       joeni                 omer               hans

    gnats     juben                    kurt               dries

    nobody    yannick                  stve               steve

