  md: '# 8.8. solution: mounting file systems


    +   1. Mount the small 200MB partition on /home/project22.


    ```

    mkdir /home/project22

    mount /dev/sdcl /home/project22

    ```


    +   2. Mount the 400MB primary partition on /mnt, copy some files to it (everything
    in / etc). Then unmount, and mount the file system as read only on /srv/nfs/salesnumbers.
    Where are the files you copied ?


    ```

    mount /dev/sdbl /mnt

    cp -r /etc /mnt

    ls -l /mnt

    umount /mnt

    ls -l /mnt

    ```


    ```

    mkdir -p /srv/nfs/salesnumbers

    mount /dev/sdbl /srv/nfs/salesnumbers

    ```


    You see the files in /srv/nfs/salenumbers now...


    But physically they are on ext3 os partition /dev/sdbl


    +   3. Verify your work with fdisk, df and mount. Also look in /etc/mtab and /proc/mounts.


    ```

    fdisk -l

    df -h

    mount

    ```


    All three the above commands should show your mounted partitions.


    ```

    grep project22 /etc/mtab

    grep project22 /proc/mounts

    ```


    +   4. Make mounts permanent, test that it works.


    add the following lines to /etc/fstab


    ```

    /dev/sdcl /home/project22 auto 0 0

    dev/sdbl /srv/nfs/salesnumbers auto 0 0

    ```


    +   5. What happens when you mount a file system on a directory that contains
    some files ?


    The files are hidden until umount.


    +   6. What happens when you mount two file systems on the same mount point ?


    Only the last mounted fs is visible.'
