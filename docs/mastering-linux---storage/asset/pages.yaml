  md: "# 9.2. fuser\n\nThe fuser command will display the 'user' of a file system.\n\
    \nIn this example we still have a vi process in background and we use fuser to\
    \ find the process id of the process using this file system.\n\n```\n[root@RHEL65\
    \ -] jobs\n[1]+ Stopped                vi /srv/project33/busyfile.txt\n[root@RHEL65\
    \ ~]# fuser -m /srv/project33/\n/srv/project33/:            3243\n```\n\nAdding\
    \ the -u switch will also display the user name.\n\n```\n[root@RHEL65 ~]# fuser\
    \ -m -u /srv/project33/\n/srv/project33/:            3243 (root)\n```\n\nYou can\
    \ quickly kill all processes that are using a specific file (directory) with the\
    \ -k switch.\n\n```\n[root@RHEL65 ~]# fuser -k -u /srv/project33/\n/srv/project33/:\
    \            3243 (root)\n[1]+ Killed                vi /srv/project33/busyfile.txt\n\
    [root@RHEL65 ~]# fuser -u /srv/project33/\n[root@RHEL65 ~]#\n```\n\nThis example\
    \ shows all processes that are using the current directory (and vi in this case).\n\
    \n```\nroot@debian:~/test42# vi file42\n[1]+ Stopped                vi file42\n\
    root@debian:~/test42# fuser -v\n                          USER PID ACCESS COMMAND\n\
    /root/test42:             root 2909 ..c.. bash\n                             \
    \           3113 ..c.. vi\n```\n\nThis example shows how vi command actually accesses\
    \ /usr/bin/vi.basic as an executable file.\n\n```\nroot@debian:~/test42# fuser\
    \ -v $ (which vi)\n                          USER PID ACCESS COMMAND\n/usr/bin/vi.basic:\
    \      root 3113 ..e.. vi\n```\n\nThe last example shows how to find the process\
    \ that is accessing a specific file.\n\n```\n[root@RHEL65 ~]# fuser /srv/project33/busyfile.txt\n\
    [1]+ Stopped                vi /srv/project33/busyfile.txt\n[root@RHEL65 ~]# fuser\
    \ -m /srv/project33/busyfile.txt\n/srv/project33/busyfile.txt:             root\
    \ 13938 F... vi\n[root@RHEL65 ~]# ps -fp 13938\nUID PID C STIME PTY CMD\nroot\
    \ 13938 3110 0 15:47 pts/0 00:00:00 vi /srv/project33/busyfile.txt\n```"
