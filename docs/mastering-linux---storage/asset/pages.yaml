- img_proc: true
  md: '# Chapter 8. mounting


    Once you''ve put a file system on a partition, you can mount it. Mounting a file
    system makes it available for use, usually as a directory. We say mounting a file
    system instead of mounting a partition because we will see later that we can also
    mount file systems that do not exist on partitions.


    On all Unix systems, every file and every directory is part of one big file tree.
    To access a file, you need to know the full path starting from the root directory.
    When adding a file system to your computer, you need to make it available somewhere
    in the file tree. The directory where you make a file system available is called
    a mount point.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 8.1. mounting local file systems


    # 8.1.1. mkdir


    This example shows how to create a new **mount point** with `mkdir`.


    ```

    root@RHEL4u2:~# mkdir /home/project42

    ```


    # 8.1.2. mount


    When the **mount point** is created, and a **file system** is present on the partition,
    then **mount** can mount the **file system** on the **mount point directory.


    ```

    root@RHEL4u2:-# mount -t ext2 /dev/sdb1 /home/project42/

    ```


    Once mounted, the new file system is accessible to users.


    # 8.1.3. /etc/filesystems


    Actually the explicit -t ext2 option to set the file system is not always necessary.
    The **mount** command is able to automatically detect a lot of file systems.


    When mounting a file system without explicitly specifying the file system, then
    **mount** will first probe `/etc/filesystems`. Mount will skip lines with the
    `nodev` directive.


    ```

    paulRHEL4u4:-$ cat /etc/filesystems

    extext3

    extext2

    nodev proc

    nodev devpts

    iso9660

    vfat

    hfs

    ```


    # 8.1.4. /proc/filesystems


    When `/etc/filesystems` does not exist, or exists with a single * on the last
    line, then **mount** will read `/proc/filesystems`.


    ```

    root@RHEL52 -# cat /proc/filesystems | grep -v ^nodev

    extext2

    iso9660

    extext3

    ```


    # 8.1.5. unmount


    You can **unmount** a mounted file system using the **unmount** command.


    ```

    root@pasha:-# ummount /home/reet

    ```'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 8.2. displaying mounted file systems


    To display all mounted file systems, issue the **mount** command. Or look at the
    files **/proc/mounts** and **/etc/mtab.


    # 8.2.1. mount


    The simplest and most common way to view all mounts is by issuing the **mount**
    command without any arguments.


    ```

    root@RHELv42:~# mount | grep /dev/sdb

    /dev/sdb1 /home/project42 type ext2 (rw)

    ```


    # 8.2.2. /proc/mounts


    The kernel provides the info in **/proc/mounts** in file form, but **/proc/mounts**
    does not exist as a file on any hard disk. Looking at **/proc/mounts** is looking
    at information that comes directly from the kernel.


    ```

    root@RHELv42:~# cat /proc/mounts | grep /dev/sdb

    /dev/sdb1 /home/project42 ext2 rw 0 0

    ```


    # 8.2.3. /etc/mtab


    The **/etc/mtab** file is not updated by the kernel, but is maintained by the
    **mount** command. Do not edit **/etc/mtab** manually.


    ```

    root@RHELv42:~# cat /etc/mtab | grep /dev/sdb

    /dev/sdb1 /home/project42 ext2 rw 0 0

    ```'
  merge: -1
  pgno: 79
- img_proc: true
  md: "# 8.2.4. df\n\nA more user friendly way to look at mounted file systems is\
