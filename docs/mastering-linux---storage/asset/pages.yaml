  md: "# 18.1. /etc/samba/smbd.conf\n\n# 18.1.1. smbd -b\n\nSamba configuration is\
    \ done in the smbd.conf file. The file can be edited manually, or you can use\
    \ a base interface like webmin or start to manage it. The file is usually located\
    \ in /etc/samba. You can find the exact location with smbd -b.\n\n```\nroot@RHEL4\
    \ -)$# smbd -b | grep CONFIGFILE\nCONFIGFILE: /etc/samba/smbd.conf\n```\n\n# 18.1.2.\
    \ the default smb.conf\n\nThe default smb.conf file contains some examples of\
    \ explanations.\n\n```\npaul@RHEL4 -)$# ls -l /etc/samba/smb.conf\n-rw-r--r--\
    \ 1 root 10836 May 30 23:08 /etc/samba/smb.conf\n```\n\nAnd Ubuntu and Debian,\
    \ smb.conf is packed with samples and explanations.\n\n```\npaul@laika:-)$# ls\
    \ -l /etc/samba/smb.conf\n-rw-r--r-- 1 root 10515 2007-05-24 00:21 /etc/samba/smb.conf\n\
    ```\n\n# 18.1.3. minimal smb.conf\n\nBelow is an example of a very minimalistic\
    \ smb.conf. It allows samba to start, and be visible to other computers (Microsoft\
    \ shows computers in Network Neighborhood or My Network Places).\n\n```\npaul@RHEL4\
    \ -)$# cat /etc/samba/smb.conf\n[global]\nworkgroup = WORKGROUP\n[firstshare]\n\
    path = /srv/samba/public\n```\n\n# 18.1.4. net view\n\nBelow is a screenshot of\
    \ the net view command on Microsoft Windows Server 2003 sp2. It shows how Red\
    \ Hat Enterprise Linux 5.3 and a Ubuntu 9.04 Samba server, with both a minimalistic\
    \ smb.conf, are visible to Microsoft computers nearby.\n\n```\nC:\\Documents and\
    \ Settings\\Administrator>net view\nServer Name\t\t\t\tRemark\n--------------------------------------------\n\
    \\\\LAIKA\t\t\t\tSamba 3.3.2\n\\\\RHEL53\t\t\t\tSamba 3.0.33-7.7.el15\n\\\\W2003\t\
    \t\t\t\nThe command completed successfully.\n```\n\n# 18.1.5. long lines in smb.conf\n\
    \nSome parameters in smb.conf can contain a list of values behind them. You can\
    \ continue a line (for clarity) the next ending the line with a backslash \\\n\
    \n```\nvalid users = Serena, Venus, Lindsay \\\n```"
