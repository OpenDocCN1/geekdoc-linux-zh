  md: '# 19.1. Setting up a directory to share


    Let''s start setting up a very simple read only server with Samba. Everyone (even
    anonymous guests) will receive read access.


    The first step is to create a directory and put some test files in it.


    ```

    [root@RHEL52]# mkdir -p /srv/samba/readonly

    [root@RHEL52]# cd /srv/samba/readonly

    [root@RHEL52 readonly]# echo "It is cold today." > winter.txt

    [root@RHEL52 readonly]# echo "It is hot today." > summer.txt

    [root@RHEL52 readonly]# ls -l

    total 8

    -rw-r--r-- 1 root root Jan 21 05:49 summer.txt

    -rw-r--r-- 1 root root Jan 18 05:49 winter.txt

    [root@RHEL52 readonly]##

    ```


    # 19.2. configure the share [global] section


    In this example the samba server is member of WORKGROUP (the default workgroup).
    We also set a descriptive server string, this string is visible to users browsing
    the network with net view, windows explorer or smclient.


    ```

    [root@RHEL52 samba]# head -5 smb.conf

    [global]

    workgroup = WORKGROUP

    server string = Public Anonymous File Server

    netbios name = TEACHER0

    security = share

    ```


    You might have noticed the line with security = share. This line sets the default
    security mode for our samba server. Setting the security mode to share will allow
    clients (smclient), any windows, another Samba server, ...) to provide a password
    for each share. This is one way of using the SMB/CIFS protocol. The other (called
    user mode) will allow the client to provide a username/password combination, by
    the server knows who share the client wants to access.


    # 19.2.2. smb.conf [share] section


    The share is called and the path is set to our newly created directory. Everyone
    is allowed access (guest ok = yes) and security is to read only.


    ```

    [pubread]

    path = /srv/samba/readonly

    comment = files to read

    read only = yes

    guest ok = yes

    ```


    Here is a very similar configuration on Ubuntu 11.10.'
  merge: -1
  pgno: 215
- img_proc: true
