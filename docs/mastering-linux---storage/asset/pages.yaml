    # 25.9. about computer accounts


    Every NT computer (Windows NT, 2000, XP, Vista) can become a member of a domain.
    Joining the domain (by right-clicking on My Computer) means that computer account
    will be created in the domain. This computer account has a password (but you cannot
    know it) to prevent other computers with the same name from accidentally becoming
    member of the domain. The computer account created by Samba is visible in the
    /etc/passwd file on Linux. Computer accounts appear as a normal user account,
    and end their name with a dollar sign. Below a screenshot of the windows 2003
    computer account, created by Samba 3.


    ```

    [root@HEL52 samba]# tail -5 /etc/passwd

    elena:x:510:514:/home/jelena/bin/bash

    figo:x:511:515:/home/figo/bin/bash

    ronaldo:x:512:516:/home/ronaldo/bin/bash

    paff:x:513:517:/home/paff/bin/bash

    w2003ee8:x:514:518:/home/nobody/bin/false

    ```


    To be able account, you will need to provide credentials of an account with the
    permission to create accounts (by default root can do this on Linux). And we will
    have to tell Samba how to do, by adding an add machine script to the global section
    of samba.conf.


    ```

    add machine script = /usr/sbin/useradd -s /bin/false -d /home/nobody %u

    ```


    You can join a Microsoft computer to the sports domain (with the root user). After
    reboot of the Microsoft computer, you will be able to login with Administrator
    (password Seagate1), but you will get an error about your roaming profile. You
    will fix this in the next section.


    When joining the samba domain, you will have to enter the credentials of a Linux
    account that can create users (usually only root can do this). If the Microsoft
    computer complies with The parameter is Incorrect, then you possibly forget to
    add the add machine script.


    # 25.10. local or roaming profiles


    For your information, if you want to force local profiles instead of roaming profiles,
    then simply adding the two lines to the global section in samba.conf.'
