  md: '# Chapter 25. samba domain controller'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# # 25.1. about Domain Controllers


    # ## 25.1.1. Windows NT4


    Windows NT4 works with single master replication domain controllers. There is
    exactly one PDC (Primary Domain Controller) in the domain, and zero or more BDC''s
    (Backup Domain Controllers). Samba zero has all features found in Windows NT4
    PDC and BDC, and more. This includes file and print serving, domain control with
    single logon, logon scripts, home directories and roaming profiles.


    # ## 25.1.2. Windows 200x


    With Windows 2000 came Active Directory. AD includes multimaster replication and
    group policies. Samba 3 can only be a member server in Active Directory, it cannot
    manage group policies. Samba 4 can do this (in beta).


    # ## 25.1.3. Samba 3


    Samba 3 can act as a domain controller in its own domain. In a Windows NT4 domain,
    one Windows NT4 PDC and zero or more BDC''s, Samba 3 can only be a member server.
    The same is valid for Samba 3 in an Active Directory domain. In short, a Samba
    3 domain controller cannot share domain control with Windows domain controllers.


    # ## 25.1.4. Samba 4


    Samba 4 can be a domain controller in an Active Directory domain, including managing
    group policies. As of this writing, Samba 4 is not released for production!


    # ## 25.2. About security modes


    # ### 25.2.1. security = share


    The ''Windows for Workgroups'' way of working, a client requests connection to
    a share and provides a password for that connection. Anyone who knows a password
    for a share can access that share. This security model was common in Windows 3.11,
    Windows 95, Windows 98 and Windows ME.


    # ### 25.2.2. security = user


    The client will send a userid + password before the server knows which share the
    client wants to access. This mode should be used whenever the samba server is
    in control of the user database. For standalone and samba domain controllers.


    # ### 25.2.3. security = domain


    This mode will allow samba to verify user credentials using NTLM in Windows NT4
    and in all Active Directory domains. This is similar to Windows NT4 BDC''s joining
    a native Windows 2000/3 Active Directory domain.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# 25.2.4. security = ads


    This mode will make samba use Kerberos to connect to the Active Directory domain.


    # 25.2.5. security = server


    This mode is obsolete, it can be used to forward authentication to another server.


    # 25.3. About password backends


    The previous chapters used all the smbpasswd database. For domain control we opt
    for the tdbsam password backend. Another option would be to use LDAP. Larger domains
    will benefit from using LDAP instead of not scalable tdsam. When you need more
    than one Domain Controller, the Samba team advises not to use tdbsam.


    # 25.4. [global] section in smb.conf


    Now is a good time to start adding comments in smb.conf. First we will take a
    look at the naming of our domain and server in the [global] section, and at the
    domain controlling parameters.


    # 25.4.1. security


    The security must be set to user (which is the default). This mode will make samba
    control the user accounts, so it will allow samba to act as a domain controller.


    ```

    security = user

    ```


    # 25.4.2. os level


    A samba server is the most stable computer in the network, so it will win all
    browser elections (os level above 32) to become the browser master


    ```

    os level = 33

    ```


    # 25.4.3. passdb backend


    The passdb backend parameter will determine whether samba uses smbpasswd, tdbsam
    or ldap.


    ```

    passdb backend = tdbsam

    ```


    # 25.4.4. preferred master


    Setting the preferred master parameter to yes will make the nmbd daemon free for
    an election on startup.


    ```

    preferred master = yes

    ```


    # 25.4.5. domain logons


    Setting the domain logons parameter will make this samba server a domain controller.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 25.4.6. domain master


    Setting the domain master parameter can cause samba to claim the domain master
    browser role for its workgroup. Don''t use this parameter in a workgroup with
    an active NT4 PDC.


    ```

    domain master = yes

    ```


    # 25.4.7. [global] section


    The screenshot below shows a sample [global] section for a samba domain controller.


    ```

    [global]

    # names

    workgroup = SPORTS

    netbios name = DCSSPORTS

    server string = Sports Domain Controller

    # domain control parameters

    security = user

    os level = 13

    preferred master = Yes

    domain master = Yes

    domain logons = Yes

    ```


    # 25.5. netlogon share


    Part of the microsoft definition for a domain controller is that it should have
    a netlogon share. This is the relevant part of smb.conf to create this netlogon
    share on Samba.


    ```

    [netlogon]

    comment = Network Logon Service

    path = /srv/samba/netlogon

    admin users = root

    guest ok = Yes

    browseable = No

    ```


    # 25.6. other [share] sections


    We create some sections for file shares, to test the samba server. Users can access
    all the general sports file share, but only group members can access their own
    sports share.


    ```

    [sports]

    comment = Information about all sports

    path = /srv/samba/sports

    valid users = @ntsports

    read only = No

    ```


    ```

    [tennis]

    comment = Information about tennis

    path = /srv/samba/tennis

    valid users = @ntennis

    read only = No

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: '```

    [football]

    comment = Information about football

    path = /srv/samba/football

    valid users = @ntfootball

