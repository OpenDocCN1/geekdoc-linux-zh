  md: '# 24.1. changes in smbconf


    # 24.1.1. workgroup


    The **workgroup** option in the global section should match the netbios name of
    the Active Directory domain.


    ```

    workgroup = STARGATE

    ```


    # 24.1.2. security mode


    Authentication is not handled by samba now, but by the Active Directory domain
    controllers, so we set the **security** option to domain.


    ```

    security = Domain

    ```


    # 24.1.3. Linux uid''s


    Linux requires a user account for every user accessing its file system, we need
    to provide Samba with a range of uid''s and gid''s that it can use to create these
    user accounts. The range is determined by the **idmap uid** and the **idmap gid**
    parameters. The first Active Directory user to connect will receive Linux uid
    20000.


    ```

    idmap uid = 20000-22000

    idmap gid = 20000-22000

    ```


    # 24.1.4. winbind use default domain


    The **winbind use default domain** parameter makes winbind also operates on users
    without a domain component in their name.


    ```

    winbind use default domain = yes

    ```


    # 24.1.5. [global] section in smb.conf


    Below is our new global section in **smb.conf}.


    ```

    [global]

    workgroup = STARGATE

    security = Domain

    server string = Stargate Domain Member Server

    idmap uid = 20000-22000

    idmap gid = 20000-22000

    winbind use default domain = yes

    ```'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 24.1.6. realm in /etc/krb5.conf


    To connect to a Windows 2003 sp2 (or later) you will need to adjust the kerberos
    realm in /etc/krb5.conf and set both lookup statements to true.


    ```

    [libdefaults]

    default_realm = STARGATE.LOCAL

    dns_lookup_realm = true

    dns_lookup_kdc = true

    ```


    # 24.1.7. [share] section in smb.conf


    Nothing is required for the share section in smb.conf. Remember that we do not
    manually create users in smbpassword or on the Linux (/etc/passwd). Only Active
    Directory users are allowed access.


    ```

    [domainata]\path = /srv/samba/domainata

    comment = Active Directory users only

    read only = No

    ```


