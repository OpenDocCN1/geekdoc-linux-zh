  md: '# 13.6. iSCSI initiator on ubuntu


    First we install the iSCSI client software (on another computer than the target).


    ```

    root@ubuntu104:~# aptitude install open-iscsi

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    Reading extended state information

    Initializing package states... Done

    The following NEW packages will be installed:

    open-iscsi open-iscsi-utils(a)

    ```


    Then we start the iSCSI client service to automatically.


    ```

    root@ubuntu104:/etc/iscsi# cp iscsid.conf iscsid.conf

    root@ubuntu104:/etc/iscsi# vi iscsid.conf

    root@ubuntu104:/etc/iscsi# grep "node.target" iscsid.conf

    node.startup        = automatic

    ```


    Or you could start it manually:


    ```

    root@ubuntu104:/etc/iscsi/nodes# /etc/init.d/open-iscsi start

    * Starting iSCSI service iscsid [ OK ]

    * Setting up iSCSI targets [ OK ]

    root@ubuntu104:/etc/iscsi/nodes#

    ```


    Now we connect to the Target server and use iscsiad to discover the devices it
    offers:


    ```

    root@ubuntu104:1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun2 -m discovery
    -t st -p 192.168.1.31

    192.168.1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun1

    192.168.1.31:3260,1 iqn.2010-02.be.linux-training:storage.lun3

    ```


    Now we use the iscsiad to edit the files in /etc/iscsi/nodes/


    ```

    root@ubuntu104:/etc/iscsi# iscsiad -m node --targetname "iqn.2010-02.be.linux\n-training:storage.lun1"
    --portal "192.168.1.31:3260" --op=update --name no=

    de.session.auth.username --value=isuser

    root@ubuntu104:/etc/iscsi# iscsiad -m node --targetname "iqn.2010-02.be.linux\n-training:storage.lun1"
    --portal "192.168.1.31:3260" --op=update --name no=

    de.session.auth.password --value=hunter2

    ```


    Repeat for the other two devices.'
