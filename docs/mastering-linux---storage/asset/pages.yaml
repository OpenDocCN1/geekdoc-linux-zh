  md: '# 12.12. manage volume groups


    # 12.12.1. vgcreate


    Use the vgcreate command to create a volume group. You can immediately name all
    the physical volumes that span the volume group.


    ```

    [root@RHEL5 ~]# vgcreate vg42 /dev/sde /dev/sdf

    Volume group "vg42" successfully created

    [root@RHEL5 ~]#

    ```


    # 12.12.2. vxtend


    Use the vxtend command to extend an existing volume group with a physical volume.


    ```

    [root@RHEL5 ~]# vxtend vg42 /dev/sdg

    Volume group "vg42" successfully extended

    [root@RHEL5 ~]#

    ```


    # 12.12.3. vgremove


    Use the vgremove command to remove volume groups from lvm. The volume groups may
    not be in use.


    ```

    [root@RHEL5 ~]# vgremove vg42

    Volume group "vg42" successfully removed

    [root@RHEL5 ~]#

    ```


    # 12.12.4. vgreduce


    Use the vgreduce command to remove a Physical Volume /dev/sdg from the vg1 Volume
    Group


    The following example adds Physical Volume /dev/sdg to the vg1 Volume Group using
    vgextend. And then removes it using vgreduce.


    ```

    [root@RHEL5 ~]# pvs | grep sgd

    /dev/sdg          lmv2           819.20M 819.20M

    [root@RHEL5 ~]# vxtend vg1 /dev/sdg

    Volume group "vg1" successfully extended

    [root@RHEL5 ~]# pvs | grep sgd

    /dev/sdg          vg1             lmv2 a-       816.00M 816.00M

    [root@RHEL5 ~]# vgreduce vg1 /dev/sdg

    Removed "/dev/sdg* from volume group "vg1*"

    [root@RHEL5 ~]# pvs | grep sgd

    /dev/sdg          lmv2 --             819.20M 819.20M

    ```'
  merge: -1
