- img_proc: true
  md: '# 9.3. chroot


    The chroot command creates a shell with an alternate root directory. It effectively
    hides anything outside of this directory.


    In the example below we assume that our server refuses to start (maybe because
    there is a problem with /etc/fstab or the mounting of the root system).


    We start a live system (booted from cd/dvd/usb) to troubleshoot our root system.
    The live system will not use our main hard disk as root


    ```

    root@livecd:~# df -h | grep root

    rootfs      186M  0M 186M  6%%

    /dev/loop0     80M 175M   0  /lib/mount/rootfs/filesystem.squashfs

    root@livecd:~# mount | grep root

    /dev/loop0    on /lib/mount/rootfs/filesystem.squashfs  type squashfs  (ro)

    ```


    We create some test file on the current rootfs.


    ```

    root@livecd:~# touch /file42

    root@livecd:~# mkdir /dir42

    root@livecd:~# ls /

    bin      dir42  home    lib64  opt     run   srv   usr  vmlinux

    boot     etc     initrd.img  media  proc  sbin  sys   var

    dev      file42  lib     mnt     root  selinux  tmp   var

    ```


    First we mount the root system from the disk (which is in lm) we use /dev/mapper
    instead of /dev/sda5.


    ```

    root@livecd:~# mount /dev/mapper/pmapper--debian--7-root /mnt

    ```


    We are now ready to chroot into the rootfs on disk.


    ```

    root@livecd:~# cd /mnt

    root@livecd:~# chroot /mnt

    root@livecd:~# ls /

    bin      dev     initrd.img  lost-found opt     run   srv   usr  vmlinux

    boot     etc     media  proc  sbin  sys   var  vagrant

    data     home    lib64   mnt     root  selinux  tmp   var

    ```


    Our test files (file42 and dir42) are not visible because they are out of the
    chrooted environment.


    Note that the hostname of the chrooted environment is identical to the existing
    hostname.


    To exit the chroot file system:


    ```

    root@livecd:~# exit

    exit

    root@livecd:~# ls /

    bin      dir42  home    lib64  opt     run   srv   usr

    boot     etc     initrd.img  media  proc  sbin  sys   var

    dev      file42  lib     mnt     root  selinux  tmp   vmlinux

    ```'
  merge: -1
  pgno: 91
