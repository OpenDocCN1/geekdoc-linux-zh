- img_proc: true
  md: '# 14.1. install multipath


    RHEL and CentOS need the device-mapper-multipath package.


    ```

    yum install device-mapper-multipath

    ```


    This will create a sample multipath.conf in /usr/share/doc/device-mapper-multipath-0.4.9/multipath.conf.


    There is no /etc/multipath.conf until you initialize it with multipath.conf.


    ```

    [root@server2 ~]# multipathconf --enable --with_multipath y

    Starting multipathd daemon:                               [ OK ]

    [root@server2 ~]# wc -l /etc/multipath.conf

    99 /etc/multipath.conf

    ```


    # 14.2. configure multipath


    You can now choose to either edit /etc/multipath.conf or use multipathconf to
    change this file for you.


    ```

    [root@server2 ~]# grep user_friendly_names /etc/multipath.conf

    user_friendly_names yes

    # user_friendly_names yes

    [root@server2 ~]# multipathconf --enable --user_friendly_names n

    [root@server2 ~]# grep user_friendly_names /etc/multipath.conf

    user_friendly_names no

    # user_friendly_names yes

    [root@server2 ~]# multipathconf --enable --user_friendly_names y

    [root@server2 ~]# grep user_friendly_names /etc/multipath.conf

    user_friendly_names yes

    # user_friendly_names yes

    ```'
