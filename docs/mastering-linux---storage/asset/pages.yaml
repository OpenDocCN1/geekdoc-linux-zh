- img_proc: true
  md: "# 10.4. uuid in /etc/fstab\n\nYou can use the uuid to make sure that a volume\
    \ is universally uniquely identified in /etc/fstab. The device name can change\
    \ depending on the disk devices that are present at boot time, but a uuid never\
    \ changes.\n\nFirst we use tune2fs to find the uuid.\n\n```\n[root@RHEL5 ~]# tune2fs\
    \ -l | /dev/sdcl | grep UUID\nFilesystem UUID:\n    7626d73a-2bb6-4937-90ca-e451025d64e8\n\
    ```\n\nThen we check that it is properly added to /etc/fstab\n\n```\n[root@RHEL5\
    \ ~]# grep UUID /etc/fstab\nUUID=7626d73a-2bb6-4937-90ca-e451025d64e8 /home/pro42\
    \ ext3 defaults 0 0\n```\n\nNow we can count the volume using the mount point\
    \ defined in /etc/fstab.\n\n```\n[root@RHEL5 ~]# mount /home/pro42\n[root@RHEL5\
    \ ~]# df -h | grep 42\n/dev/sdcl        397M  11M  366M  3% /home/pro42\n```\n\
    \nThe real test now, is to remove /dev/sdb from the system, reboot the machine\
    \ and see what happens. After the reboot, the disk previously known as /dev/sdb\
    \ is now /dev/sdb.\n\n```\n[root@RHEL5 ~]# tune2fs -l /dev/sdb1 | grep UUID\n\
    Filesystem UUID:\n    7626d73a-2bb6-4937-90ca-e451025d64e8\n```\n\nAnd thanks\
    \ to the uuid in /etc/fstab, the mountpoint is mounted on the same disk as before.\n\
    \n```\n[root@RHEL5 ~]# df -h | grep sdb\n/dev/sdb1        397M  11M  366M  3%\
    \ /home/pro42\n```"
  merge: -1
  pgno: 99
