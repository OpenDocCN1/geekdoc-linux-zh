  md: '# 13.4. iSCSI target on Debian


    Installing the software for the target server requires **iscsitarget** on Ubuntu
    and Debian, and an extra **iscsitarget-dkms** for the kernel modules only on Debian.


    ```

    root@debby6:~# aptitude install iscsitarget

    The following NEW packages will be installed:

    iscsitarget

    0 packages upgraded, 1 newly installed, 0 to remove and 0 not upgraded.

    Need to get 69.4 kB of archives. After unpacking 262 kB will be used.

    Get:1:http://ftp.belmet.de/debian/squeeze/main iscsitarget i386 1.4.20-1\ [69.4
    kB]

    Fetched 69.4 kB in 0 s/s\Selecting previously selected package iscsitarget.

    (Reading database ... 3644 files and directories currently installed)

    Unpacking iscsitarget (from .../iscsitarget_1.4.20-1_i386.deb) ...

    Processing triggers for man-db

    Setting up iscsitarget (1.4.20-1) ...

    iscsitarget not enabled in "/etc/default/iscsitarget", not starting...(warning).

    ```


    On Debian 6 you will also need **aptitude install iscsitarget-dkms** for the kernel
    modules, On Debian 5 this is **aptitude install iscsitarget-modules-uname -a**.
    Ubuntu includes the kernel modules in the main package.


    The iSCSI target is disabled by default, so we can enable it.


    ```

    root@debby6:~# cat /etc/default/iscsitarget

    ISCITARGET_ENABLE=false

    root@debby6:~# vi /etc/default/iscsitarget

    root@debby6:~# cat /etc/default/iscsitarget

    ISCITARGET_ENABLE=true

    ```'
