    Now you can use the Samba groups on all NTFS volumes on members of the domain.


    # 25.12. logon scripts


    Before testing a logon script, make sure it has the proper carriage returns that
    DOS files have.


    ```

    [root@RHEL4b logon]# cat start.bat

    net use 2: \DCSPORTS0\SPORTS

    [root@RHEL4b logon]# unix2dos start.bat

    unixdos: converting file start.bat to DOS format

    [root@RHEL4b logon]#

    ```


    Then copy the script to the logon share, and add the following parameter to smb.conf.


    ```

    logon script = start.bat

    ```'
