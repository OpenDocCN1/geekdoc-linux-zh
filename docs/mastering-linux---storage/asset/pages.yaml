- img_proc: true
  md: '# 12.12.5. vgchange


    Use the vgchange command to change parameters of a Volume Group.


    This example shows how to prevent Physical Volumes from being added or removed
    to the Volume Group vg1.


    ```

    [root@RHEL5 ~]# vgchange -xn vg1

    Volume group "vg1" successfully changed

    [root@RHEL5 ~]# vgxtend vg1 /dev/sd5

    Volume group vg1 is not resizable.

    ```


    You can also use vgchange to change other properties of a Volume Group. This example
    changes the maximum number of Logical Volumes and maximum number of Physical Volumes
    that vg1 can serve.


    ```

    [root@RHEL5 ~]# vgdisplay vg1 | grep -i max

    Max LV              0

    Max PV              0

    [root@RHEL5 ~]# vgchange -l16 vg1

    Volume group "vg1" successfully changed

    [root@RHEL5 ~]# vgchange -p8 vg1

    Volume group "vg1" successfully changed

    [root@RHEL5 ~]# vgdisplay vg1 | grep -i max

    Max LV              16

    Max PV              8

    ```


    # 12.12.6. vgmerge


    Merging Volume Groups into one is done with vgmerge. The following example merges
    vg2 into vg1, keeping all the properties of vg1.


    ```

    [root@RHEL5 ~]# vgmerge vg1 vg2

    Volume group "vg2" successfully merged into "vg1"

    [root@RHEL5 ~]#

    ```'
