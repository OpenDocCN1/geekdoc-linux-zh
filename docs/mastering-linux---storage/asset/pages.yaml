  md: '# 12.11. manage physical volumes


    # 12.11.1. pvcreate


    Use the **pvcreate** command to add devices to lvm. This example shows how to
    add a disk (or hardware RAID device) to lvm.


    ```

    [root@RHEL5 ~]# pvcreate /dev/sdb

    Physical volume "/dev/sdb" successfully created

    [root@RHEL5 ~]#

    ```


    This example shows how to add a partition to lvm.


    ```

    [root@RHEL5 ~]# pvcreate /dev/sdc1

    Physical volume "/dev/sdc1" successfully created

    [root@RHEL5 ~]#

    ```


    You can also add multiple disks or partitions as target to pvcreate. This example
    adds three disks to lvm.


    ```

    [root@RHEL5 ~]# pvcreate /dev/sde /dev/sdf /dev/sdg

    Physical volume "/dev/sde" successfully created

    Physical volume "/dev/sdf" successfully created

    Physical volume "/dev/sdg" successfully created

    [root@RHEL5 ~]#

    ```


    # 12.11.2. pvmremove


    Use the **pvremove** command to remove physical volumes from lvm. The devices
    may not be in use.


    ```

    [root@RHEL5 ~]# pvremove /dev/sde /dev/sdf /dev/sdg

    Labels on physical volume "/dev/sde" successfully wiped

    Labels on physical volume "/dev/sdf" successfully wiped

    Labels on physical volume "/dev/sdg" successfully wiped

    [root@RHEL5 ~]#

    ```


    # 12.11.3. pvresize


    When you use fdisk to resize a partition on a disk, then use pvresize to make
    lvm recognize the new size of the physical volume that represents this partition.


    ```

    [root@RHEL5 ~]# pvresize /dev/sde1

    Physical volume "/dev/sde1" changed

    1 physical volume(s) resized / 0 physical volume(s) not resized

    ```'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 12.11.4. pvchange


    With pvchange you can prevent the allocation of a Physical Volume in a new Volume
    Group or Logical Volume. This can be useful if you plan to remove a Physical Volume.


    ```

    [root@RHEL5 ~] pvchange -xn /dev/sdd

    Physical volume "/dev/sdd" changed

    1 physical volume changed / 0 physical volumes not changed

    [root@RHEL5 ~]

    ```


    To revert your previous device, this example shows how you te re-enable the Physical
    Volume to allow allocation.


    ```

    [root@RHEL5 ~] pvchange -xy /dev/sdd

    Physical volume "/dev/sdd" changed

    1 physical volume changed / 0 physical volumes not changed

    [root@RHEL5 ~]

    ```


    # 12.11.5. pvmove


    With pvmove you can move Logical Volumes from within a Volume Group to another
    Physical Volume. This must be done before removing a Physical Volume.


    ```

    [root@RHEL5 ~] pvs | grep vg1

    /dev/sdf vg1 lm2 a- 816.00M 0

    /dev/sdg vg1 lm2 a- 816.00M 816.00M

    [root@RHEL5 ~]# pvmove /dev/sdf

    /dev/sdf: Moved: 70.1%

    /dev/sdf: Moved: 100.0%

    [root@RHEL5 ~]# pvs | grep vg1

    /dev/sdf lm2 a- 816.00M 816.00M

    /dev/adg vg1 lm2 a- 816.00M

    ```'
