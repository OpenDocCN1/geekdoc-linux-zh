  md: '# 6.3. partitioning disks


    In the example below, we bought a disk for our system. The new hardware is properly
    attached, you can use fdisk and parted to create the necessary partition(s). This
    example uses fdisk, but there is nothing wrong with using parted.


    # 6.3.1. recognising the disk


    First, we check with fdisk -l whether Linux can see the new disk. Yes it does,
    the new disk is seen as /dev/sda, but it does not have any partitions yet.


    ```

    root@RHELvu2:~# fdisk -l

    Disk /dev/sda: 12.8 GB, 1288490188 bytes

    255 heads, 63 sectors/track, 1566 cylinders

    Units = cylinders of 16065 * 512 = 8225280 bytes


    Device Boot      Start         End  Id System

    /dev/sda          *      13   104391 83 Linux

    /dev/sda2                14   1556 12744742+  8e Linux LVM

    ```


    ```

    Disk /dev/sdb: 1073 MB, 1073741824 bytes

    255 heads, 63 sectors/track, 130 cylinders

    Units = cylinders of 16065 * 512 = 8225280 bytes

    ```


    Disk /dev/sdb does not contain a valid partition table


    # 6.3.2. opening the disk with fdisk


    Then we create a partition with fdisk on /dev/sdb. First we start the fdisk tool
    with /dev/sdb as argument. Be very careful not to partition the wrong disk!


    ```

    root@RHELvu2:~# fdisk /dev/sdb

    Device contains neither a valid DOS table, nor Sun, SGI...

    Building a new DISKlabel. Changes will remain in memory,

    until you decide to write them. After that, of course, the previous

    content won''t be recoverable.


    Warning: invalid flag 0x00000 of partition table 4 will be corrected...

    ```


    # 6.3.3. empty partition table


    Inside the fdisk tool, we can issue the p command to see the current disks partition
    table.


    ```

    Command (m for help): p


    Disk /dev/sdb: 1073 MB, 1073741824 bytes

    255 heads, 63 sectors/track, 130 cylinders

    Units = cylinders of 16065 * 512 = 8225280 bytes


    Device Boot      Start         End  Id System

