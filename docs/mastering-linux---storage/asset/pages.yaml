  md: '# 12.8. verifying existing physical volumes


    # 12.8.1. Lvmdiscan


    To get a list of block devices that can be used with LVM, lvmdiscan. The example
    below uses grep to limit the result to SCSI devices.


    ```

    [root@RHEL5 #] lvmdiscan  | grep sd

    /dev/sda      [ 101.94 MB]

    /dev/sda2     [ 15.90 GB] LVM physical volume

    /dev/sdb      [ 409.60 MB]

    /dev/sdc      [ 409.60 MB]

    /dev/sdd      [ 409.60 MB] LVM physical volume

    /dev/sde      [ 95.98 MB]

    /dev/sd5       [ 191.98 MB]

    /dev/sdf       [ 819.20 MB] LVM physical volume

    /dev/sdg1     [ 818.98 MB]

    [root@RHEL5 ~# ]

    ```


    # 12.8.2. pvs


    The easiest way to verify whether devices are known to lvm is with the pvs command.
    The screenshot shows that only /dev/sda2 is currently known for use with LVM.
    It shows /dev/sda2 is part of VolGroup0 and is almost 16GB in size. It shows /dev/sdc
    and /dev/sdd as part of vg33. The device /dev/sdk is known to lvm, but not linked
    to any Volume Group.


    ```

    [root@RHEL5 ~# ] pvs

    PV             VG             Attr Size       Free

    /dev/sda2     VolGroup00 lvm2 a-    15.88G        0

    /dev/sdb       vg33           lvm2 a-    409.60M      409.60M

    /dev/sdc       vg33           lvm2 a-    408.00M      408.00M

    /dev/sdd       vg33           lvm2 a-    408.00M      408.00M

    [root@RHEL5 ~# ]

    ```


    # 12.8.3. pvscan


    The pvscan command will scan all disks for existing Physical Volumes. The information
    is similar to pvs, plus you get a line with total sizes.


    ```

    [root@RHEL5 ~# ] pvscan

    PV /dev/sdc  VG vg33 lvm2 [408.00 MB / 408.00 MB free]

