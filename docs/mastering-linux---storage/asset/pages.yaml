  md: '# # 10.1. about uuid objects


    Older versions of Linux have a vol_id utility to display the uuid of a file system.


    ```

    root@debian5:-# vol_id --uuid /dev/sda

    193c39b-2c40-9290-8b71-4264ee4d4c82

    ```


    Red Hat Enterprise Linux 5 puts vol_id in /lib/udev/vol_id, which is not in the
    $PATH. The syntax is a bit different from Debian/Ubuntu.


    ```

    root@rhel53 ~# /lib/udev/vol_id -u /dev/sda1

    48a6316-9ca9-4214-b5c6-e7b33a77e860

    ```


    This utility is not available in standard installations of RHEL6 or Debian.


    # # 10.2. tune2fs


    Use tune2fs to find the uuid of the file system.


    ```

    root@RHEL5 ~)# tune2fs -l /dev/sda | grep UUID

    Filesystem UUID: 11cfc8bc-07c0-4c3f-9f64-78422ef1dd5c

    root@RHEL5 ~)# /lib/udev/vol_id -u /dev/sda

    11cfc8bc-07c0-4c3f-9f64-78422ef1dd5c

    ```


    # # 10.3. uuid


    There is more information in the manual of uuid, a tool that can generate uuids.


    ```

    root@rhel65 ~)# yum install uuid

    (output truncated)

    root@rhel65 ~)# man uuid

    ```'
