  md: '# 8.4. permanent mounts


    Until now, we performed all mounts manually. This works nice, until the next reboot.
    Luckily there is a way to tell your computer to automatically mount certain file
    systems during boot.


    # 8.4.1. /etc/fstab


    The file system table located in /etc/fstab contains a list of file systems, with
    an option to automatically mount each of them at boot time.


    Below is a sample /etc/fstab file.


    ```

    root@RHELv42:~# cat /etc/fstab

    extext3 defaults 1 1

    /dev/VolGroup00/LogVol100 / ext3 defaults 1 2

    LABEL=/boot /dev/pts devpts gid=5,mode=620 0 0

    none /dev/sh tmpfs defaults 0 0

    none /sys sysfs defaults 0 0

    none /proc proc defaults 0 0

    /dev/VolGroup00/LogVol01 swap swap defaults 0 0

    ```


    By adding the following line, we can automate the mounting of a file system.


    ```

    /dev/sdb1 /home/project42 ext2 defaults 0 0

    ```


    # 8.4.2. mount /mountpoint


    Adding an entry to /etc/fstab has the added advantage that you can simplify the
    mount command. The command in the screenshot below forces mount to look for the
    partition info in /etc/fstab.


    ```

    root@rhel65:~# mount /home/project42

    ```'
