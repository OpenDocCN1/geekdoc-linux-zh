  md: '# 12.7. example: snapshot a logical volume


    A snapshot is a virtual copy of all the data at a point in time on a volume. A
    snapshot Logical Volume will retain a copy of all changed files of the snapshotted
    Logical Volume.


    The example below creates a snapshot of the bigLV Logical Volume.


    ```

    [root@RHEL5 #] lvcreate -L100M -s n snapLV vg42/bigLV

    Logical volume "snapLV" created

    [root@RHEL5 #]

    ```


    You can see with lvs that the snapLV is indeed a snapshot of bigLV. Moments after
    the snapshot, there are a few changes to bigLV (0.02 percent).


    ```

    [root@RHEL5 #] lvs

    VG Attr LSize Origin Snap% Move Log Copy%

    bigLV vg42 owi-a 200.00M

    snapLV vg42 swi-a 100.00M bigLV 0.02

    [root@RHEL5 #]

    ```


    But after using bigLV for a while, more changes are done. This means the snapshot
    volume has to keep more original data (10.22 percent).


    ```

    [root@RHEL5 #] lvs | grep vg42

    bigLV vg42 owi-a 200.00M

    snapLV vg42 swi-a 100.00M bigLV 10.22

    [root@RHEL5 #]

    ```


    You can now use regular backup tools (dump, tar, cpio, ...) to take a backup of
    the snapshot Logical Volume. This backup will contain all data as it existed on
    bigLV at the time the snapshot was taken. When the backup is done, you can remove
    the snapshot.


    ```

    [root@RHEL5 #] lvremove vg42/snapLV

    Do you really want to remove active logical volume "snapLV"? [y/n]: y

    Logical volume "snapLV" successfully removed

    [root@RHEL5 #]

    ```'
  merge: -1
  pgno: 121
