  md: "# 9.6. vmstat\n\nWhile vmstat is mainly a memory monitoring tool, it is worth\
    \ mentioning here for its reporting on I/O data for block devices and swap space.\n\
    \nThis example shows some disk activity (underneath the ---io--- column), without\
    \ swapping.\n\n```\n[root@RHEL5 ~]# vmstat 5 10\nprocs    --memory------swap----io----system----cpu---\n\
    \   r b swpd free buff cache  si so bo in cs us yi id wa st\n  0 0 5 9020 14 140976\
    \ 7 12 235 252 77 100 2 1 97 0 0\n  2 0 5 6104 12 1348176 0 0 16 28 18 781 747\
    \ 38 8 0 0\n  0 0 5 10136 136996 336012 0 0 14 17 1425 4036 72 24 0 0\n  0 0 5\
    \ 14160 13404 341552 0 0 10161 9914 1174 1924 67 15 18 0 0\n  0 0 5 14300 14320\
    \ 341564 0 0 0 28 18 0 100 0 0 0\n  0 0 5 14300 14320 341564 0 0 0 22 16 0 100\
    \ 0 0 0\n```\n\nYou can benefit from vmstat's ability to display memory in kilobytes,\
    \ megabytes or even kibibytes and gibytes using -S (followed by k K m or M).\n\
