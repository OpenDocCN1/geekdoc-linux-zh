  md: '# 12.13. manage logical volumes


    # 12.13.1. lvcreate


    Use the lvcreate command to create Logical Volumes in a Volume Group. This creates
    an 8GB Logical Volume in Volume Group vg42.


    ```

    [root@RHEL5 ~]# # lvcreate -L5G vg42

    Logical volume "lvol10" created

    [root@RHEL5 ~]#

    ```


    As you can see, lvm automatically creates the Logical Volume Ivol0. The next example
    creates a 200MB Logical Volume named MyLV in Volume Group vg42.


    ```

    [root@RHEL5 ~]# lvcreate -L200M -nMyLV vg42

    Logical volume "MyLV" created

    [root@RHEL5 ~]#

    ```


    The next example does the same thing, but with different syntax.


    ```

    [root@RHEL5 ~]# lvcreate -size 200M -n MyLV vg42

    Logical volume "MyLV" created

    [root@RHEL5 ~]#

    ```


    This example creates a Logical Volume that occupies 10 percent of the Volume Group.


    ```

    [root@RHEL5 ~]# lvcreate -l 10%VG -n MyLV vg42

    Logical volume "MyLV2" created

    [root@RHEL5 ~]#

    ```


    This example creates a Logical Volume that occupies 30 percent of the remaining
    free space in the Volume Group.


    ```

    [root@RHEL5 ~]# lvcreate -l 30%FREE -n MyLV vg42

    Logical volume "MyLV3" created

    [root@RHEL5 ~]#

    ```


    # 12.13.2. lvremove


    Use the lvremove command to remove Logical Volumes from a Volume Group. Removing
    a Logical Volume requires the name of the Volume Group.


    ```

    [root@RHEL5 ~]# lvremove vg42/MyLV

    Do you want to remove active logical volume "MyLV"? [y/n]: y

    Logical volume "MyLV" successfully removed

    [root@RHEL5 ~]#

    ```


    Removing multiple Logical Volumes will request confirmation for each individual
    volume.


    ```

    [root@RHEL5 ~]# lvremove vg42/MyLV vg42/MyLV3

    Do you want to remove active logical volume "MyLV"? [y/n]: y

    Logical volume "MyLV" successfully removed

    Do you want to remove active logical volume "MyLV2"? [y/n]: y

    Logical volume "MyLV2" successfully removed

    Do you want to remove active logical volume "MyLV3"? [y/n]: y

    Logical volume "MyLV3" successfully removed

    [root@RHEL5 ~]#

    ```'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 12.13.3. lxtend


    Extending the volume is easy with lxtend. This example extends a 200MB Logical
    Volume with 100MB.


    ```

    [root@RHEL5 ~] # lvdisplay /dev/vg2/lvvol0 | grep Size

    LV Size             200.00 MB

    [root@RHEL5 ~] # lxtend -L +100 /dev/vg2/lvvol0

    Extending logical volume lvvol0 to 300.00 MB

    Logical volume lvvol0 successfully resized

    [root@RHEL5 ~] # lvdisplay /dev/vg2/lvvol0 | grep Size

    LV Size             300.00 MB

    ```


    The next example doubles a 100MB Logical Volume, and then extends to 500MB.


    ```

    [root@RHEL5 ~] # lvcreate -size 100M -n extLV vg42

    Logical volume "extLV" created

    [root@RHEL5 ~] # lxtend -L 500M vg42/extLV

    Extending logical volume extLV to 500.00 MB

    Logical volume extLV successfully resized

    [root@RHEL5 ~] #

    ```


    This example doubles the size of a Logical Volume.


    ```

    [root@RHEL5 ~] # lxtend -L+100% vg42/extLV

    Extending logical volume extLV to 1000.00 MB

    Logical volume extLV successfully resized

    [root@RHEL5 ~] #

    ```


    # 12.13.4. lvname


    Renaming a Logical Volume is done with lvrename. This example renames extLV to
    bigLV in the vg42 Volume Group.


    ```

    [root@RHEL5 ~] # lvname vg42/extLV bigLV

    Renamed "extLV" to "bigLV" in volume group "vg42"

    [root@RHEL5 ~] #

    ```'
