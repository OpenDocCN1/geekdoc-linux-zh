    (dot, slash, h, e, l, l, o with no spaces)


    For security reasons `.` should not be in your path.


    # F.4.6  Why doesn''t xtexsh work?


    xtexsh is based on older versions of Tcl/Tk than what we ship. Unfortunately,
    it has not been ported to the newer versions as of yet and it does not work at
    all.'
