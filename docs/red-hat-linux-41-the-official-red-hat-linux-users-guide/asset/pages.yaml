- pgno: 267
  md: "# # Red Hat Linux Release 4.1\n\nOfficial\" Red Hat 4.1 includes all the latest\
    \ Linux tools and utilities including the improved networking and hardware support\
    \ of the latest 2.0 kernel.\n\nThis manual is the \"Official\" Manual at for the\
    \ installation and management of your Red Hat Linux system. Whether you downloaded\
    \ Red Hat off of a site on the Internet, or purchased Red Hat Linux from Red Hat\
    \ Software or as part of some other product or CD-Rom set, this manual will make\
    \ your use of this advanced technology easier and more enjoyable.\n\n\"Red Hat's\
    \ biggest advantage is that so many of the packages and tools require little or\
    \ no configuration... Red Hat is overall the most sophisticated and commercial\
    \ release of Linux.\" *Inforworld Magazine*.\n\nThis POSIX based advanced easy-to-administer\
    \ Operating System allows your PC to function as a UNIX workstation effectively\
    \ and reliably for advanced computing tasks. Perfect for applications ranging\
    \ from setting up an Internet Web or FTP server, Internet Applications, Research\
    \ work, Software Development, even advanced computer game playing.\n\n# ## EASY\
    \ TO INSTALL AND MANAGE.\n\nWith RHPM\"'s packaging system and the modular kernel,\
    \ installation of an operating system has never been easier. Simply choose one\
    \ or more configuration options and your installation can be used for the following:\n\
    \n+   - C and C++ Development  \n+   - NFS Server  \n+   - Anonymous FTP/ Gopher\
    \ Server  \n+   - News Server  \n+   - Network Management  \n+   - Workstation\
    \  \n+   - Dialog Workstation  \n+   - Game Machine  \n+   - X Window System \
    \ \n+   - Web Server  \n+   - Printer Server\n\n+   - Networked Workstation  \n\
    +   - DOS-Windows  \n+   - Connectivity  \n+   - Multimedia Machine  \n+   - Text\
    \ Document Formatting  \n+   - or use the manual configuration option to install\
    \ and configure your Linux computer to your needs.\n\nA number of powerful, high-level,\
    \ graphical tools save advanced users hours of time, and enables the novice system\
    \ administrator to custom configure and tailor their system to their needs. The\
    \ soft tools covers configuration of TCP/IP, PPP, SLIP, file systems, users and\
    \ groups, software packages, and more.\n\nThe RPM packaging system, a growing\
    \ Linux standard, makes upgrading and maintaining your system painless and worry-free.\
    \ Now in release 4.1 is \"package dependencies\" which eliminates guess work,\
    \ and prevents major system failures when installing, uninstalling, and upgrading\
    \ software packages.\n\n# ## ADVANCED SYSTEM AND NETWORK SECURITY FEATURES.\n\n\
    The flexibility of the RPM system is what has allowed Red Hat Linux to earn the\
    \ reputation as one of the most secure operating systems available. Almost as\
    \ soon as security problems are found on the Internet, Red Hat Software releases\
    \ new or updated packages to cope with the new threat, saving you time and reducing\
    \ the possibility of compromise.\n\nRelease 4.1 of Red Hat Linux supports standard\
    \ \"UNIX\" password authentication, as well as \"shadow\" passwords for additional\
    \ security. The Pluggable Authentication Module (PAM) system allows additional\
    \ authentication methods to be written and dynamically added to the system to\
    \ support your special security needs.\n\n# ## UPGRADE FROM PREVIOUS RELEASES.\n\
    \nBecause Red Hat Linux Release 4.1 is built with advanced RPM technology, your\
    \ system will never become obsolete. As new releases become available you can\
    \ upgrade any or all of your components to the newest versions using a simple\
    \ upgrade program that does all the work for you. Users of Red Hat Linux release\
    \ 2.0, 2.1 and 3.0 (Picsos) can upgrade to release 4.1 simply and safely.\n\n\
    # ## REVOLUTIONARY SOFTWARE DEVELOPMENT AND LICENSING.\n\nRed Hat Linux Release\
    \ 4.1 is a complete POSIX-based operating system, with hundreds of features not\
    \ found on UNIX operating systems costing 10 times as much.\n\nRed Hat Linux comes\
    \ with complete source code for the entire operating system, including all the\
    \ compilers, libraries, utilities, and the X Window System.\n\nThe source of this\
    \ amazing value in advanced OS technology is the cooperative development of the\
    \ Red Hat Linux technologies. The GNU and Linux technologies are copyrighted under\
    \ the GPL which excludes worldwide contributions to software development without\
    \ the override of commercial control and restrictions\n\n> -More on this fascinating\
    \ subject is included inside.\n\n![](img/3d09de050edc8aef2a604e36a4127b47_267_0.png)"
  merge: -1
  img_proc: true
