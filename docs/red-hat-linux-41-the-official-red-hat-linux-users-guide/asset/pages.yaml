- pgno: 208
  md: '# E.5. HOW TO LOAD MILO


    NT ARC as boot options.


    To get Milo into flash via the Evaluation Board Debug Monitor, you will need a
    flashable image. The build procedures make milo.rom, but you can also make a rom
    image using the makerom tool in the Debug Monitor software that comes with the
    board:


    ```

    } makerom -v -l7 -1200000 Milo -o mini.flash

    ```


    (type makerom to find out what the arguments mean, but 7 is a flash image id used
    by the srom and -l200000 gives the load address for the image as 0x200000).


    Load that image into memory (via the Debug Monitor commands fload, netload, and
    so on) at 0x200000 and then blow the image into flash:


    ```

    AlphaPC64} flash 200000 8

    ```


    (200000 is where the image to be blown is in memory and 8 is the segment number
    where you put the image. There are 16 1024*64 byte segments in the flash and the
    Debug Monitor is at seg 0 and the Windows NT ARC firmware is at seg 4).


    Set up the image that the srom will boot by writing the number of the image into
    the TOY clock.


    ```

    AlphaPC64} bootopt 131

    ```


    (131 means boot the 3rd image, 129 = 1st, 130 = 2nd and so on).


    Power off, put jumper 7 on and power on and you should see the Milo burst into
    life. If you don''t then take jumper 7 back off and reboot the Debug Monitor.


    # EB66+


    The EB66+, like all of the Alpha Evaluation Boards built by Digital contains the
    Evaluation Board Debug Monitor and so this is available to load Milo (Section
    ref id="dbm-section" name="Loading from the Debug Monitor"). Quite often (although
    not always) boards whose design is derived'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'from these include the Debug Monitor also. Usually, these boards include the
    Windows NT ARC firmware (Section ref id=\"arc-section\" name=\"booting from Windows
    NT ARC firmware\"). A flash management utility, runnable from Milo is available
    so that once Milo is running, it can be blown into flash (Section ref id=\"milo-fmu-section\"
    name=\"running the flash management utility\"). This system supports Milo environment
    variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper banks are J18 and J16 and are located at the bottom of the board in the
    middle (if the Alpha chip is at the top). You select between the boot options
    (and Milo when it is been put into flash) using a combination of jumpers and a
    boot option which is saved in the NVRAM of the TOY clock.


    Jumper 7-8 of J18 in means boot the image described by the boot option. Jumper
    7-8 of J18 out means boot the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section ref id=\"pc64-section\" name=\"AlphaPC64\").


    # EB64+/Aspen Alpine


    This system is quite like the AlphaPC64 except that it does not contain flash
    which Milo can be loaded from. The EB64+ has two ROMs, one of which contains the
    Windows NT ARC firmware (Section ref id=\"arc-section\" name=\"booting from Windows
    NT ARC firmware\"). and the other contains the Evaluation Board Debug Monitor
    (Section ref id=\"dbm-section\" name=\"Loading from the Debug Monitor\").


    The Aspen Alpine is a little different in that it only has one ROM; this contains
    the Windows NT ARC firmware.


    # Universal Desktop Box (Multia)


    This is a very compact pre-packaged 21066 based system that includes a TGA (21030)
    graphics device. Although you can just fit a half height PCI graphics card in
    the box you are better off waiting for full TGA support in XFree86. It includes
    the Windows NT ARC firmware and so booting from that is the preferred method (Section
    ref id=\"arc-section\" name=\"Loading'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'from Windows NT").


    # EB164


    The EB164, like all of the Alpha Evaluation Boards built by Digital contains the
    Evaluation Board Debug Monitor and so this is available to load Milo (Section
    E.5.2 Loading from the Debug Monitor). Quite often (although not always) boards
    whose design is derived from these include the Debug Monitor also. Usually, these
    boards include the Windows NT ARC firmware (Section E.5.1 booting from Windows
    NT ARC firmware). The SRM console is also available (Section E.5.5 Loading Milo
    from the SRM Console). A flash management utility, runnable from Milo is available
    so that once Milo is running, it can be blown into flash (Section E.7 running
    the flash management utility). This system supports Milo environment variables.


    These systems have several boot images in flash controlled by jumpers. The two
    jumper bank is J1 and is located at the bottom of the board on the left (if the
    Alpha chip is at the top). You select between the boot options (and Milo when
    it is been put into flash) using a combination of jumpers and a boot option which
    is saved in the NVRAM of the TOY clock.


    Jumper SP-11 of J1 in means boot the image described by the boot option. Jumper
    SP-11 of J1 out means boot the Evaluation Board Debug Monitor.


    Blowing an image into flash via the Evaluation Board Debug Monitor is exactly
    the same procedure as for the AlphaPC64 (Section E.5.6 AlphaPC64).


    # XL266


    The XL266 is one of a family of systems that are known as Avanti. It has a riser
    card containing the Alpha chip and cache which plugs into the main board at right
    angles. This board can replace the equivalent Pentium board.


    Some of these systems ship with the SRM console but others, notably the XL266
    ship with only the Windows NT ARC firmware (Section E.5.1 booting from Windows
    NT ARC firmware).


    Here is my list of compatible systems:'
  merge: -1
  img_proc: true
- pgno: 211
  md: "+   *   AlphaStation 400 (Avanti),\n+   *   AlphaStation 250,\n+   *   AlphaStation\
    \ 200 (Mustang),\n+   *   XL. There are two flavours, XL266 and XL233 with the\
    \ only difference being in processor speed and cache size.\n\nNote The system\
    \ that I use to develop and test Milo is an XL266 and so this is the only one\
    \ that I can guarantee will work. However, technically, all of the above systems\
    \ are equivalent; they have the same support chipsets and the same interrupt handling\
    \ mechanisms.\n\n# Platform2000\n\nThis is a 233Mhz 21066 based system.\n\n# E.6\
    \   Milo’s User Interface\n\nOnce you have correctly installed/loaded/run Milo\
    \ you will see the MILO (for MIniLOader) prompt displayed on your screen. There\
    \ is a very simple interface that you must use in order to boot a particular Linux\
    \ kernel image. Typing “help” is a good idea as it gives a useful summary of the\
    \ commands.\n\n# E.6.1  The \"help\" Command\n\nProbably the most useful command\
    \ that Milo has:\n\n```\n```text\nMILO> help\nMILO command summary:\n\nls [-t\
    \ fs] [dev:[dir]]\n    - List files in directory on device\nboot [-t fs] [dev:file]\
    \ [boot string]\n    - Boot Linux from the specified device and file\nrun [-t\
    \ fs] dev:file\n```\n```"
  merge: -1
  img_proc: true
- pgno: 212
  md: '- Run the standalone program *dev:file*

    *show*

    - Display all known devices and file systems

    *set VAR VALUE*

    - Set the variable *VAR* to the specified *VALUE*

    *unset VAR*

    - Delete the specified variable

    *reset*

    - Delete all variables

    *print*

    - Display current variable settings

    *help [var]*

    - Print this help text


    Devices are specified as: fd0, hda1, hda2, sdal…

    Use the ''-t *filesystem-name*'' option if you want to use anything but the default
    *filesystem* (''ext2'').

    Use the ''show'' command to show known devices and *filesystems*.

    Type ''help *var*'' for a list of variables.


    **Note** that the *bootopt* command only appears on AlphaPC64 (and similar) systems.
    Refer to the board''s documentation to find out just what it means.


    **Devices** Until you use a command that needs to *make use* of a device, no device
    initialisation will take place. The first *show, ls,* *boot* or *run* commands
    all cause the devices within Linux to be initialised. Devices are named in the
    same way (exactly) that Linux itself will name them. So, the first IDE disk will
    be called ''hda'' and it''s first partition will be ''hda1''. Use the *show* command
    to show what devices are available.


    **File Systems** Milo supports three *file systems, MS DOS, EXT2* and *ISO9660*.
    So long as a device is available to it, Milo can *list* *boot* or *run* an image
    stored on one of these *file systems*. Milo''s default *file system* is *EXT2*
    and so you have tell Milo that the *file system* is something other than that.
    All of the commands that use *filenames* allow you to pass the *file system* using
    the *-t [filesystem]* option. So, if you wanted to list the contents of a SCSI
    CD ROM, you might type the following:

    *MILO> ls -t iso9660 scd0:*


    **Variables** Milo contains some settable variables that help the *boot* process.
    If you are loading via the Windows NT ARC firmware, then Milo makes use of the
    *boot* option environment variables set up by that firmware. For some systems,
    Milo (for example, the AlphaPC64) maintains its own set of environment variables
    that do not change from *boot* to *boot*. These variables are:'
  merge: -1
  img_proc: true
- pgno: 213
  md: "```\nMILO> help var\nVariables that MILO cares about:\nMEMORY_SIZE  - System\
    \ memory size in megabytes\nBOOT_DEV     - Specifies the default boot device\n\
    BOOT_FILE    - Specifies the default boot file\nBOOT_STRING  - Specifies the boot\
    \ string to pass to the kernel\nSCSI0_HOSTID - Specifies the host id of the n-th\
    \ SCSI controller\nAUTOBOOT     - If set, MILO attempts to boot on powerup\n \
    \             and enters command loop only on failure.\nAUTOBOOT_TIMEOUT - Seconds\
    \ to wait before auto-booting on powerup.\n```\n\n# E.6.2 Booting Linux\n\nThe\
    \ boot command boots a linux kernel from a device. You will need to have a linux\
    \ kernel image on an EXT2 formatted disk (SCSI, IDE or floppy) or an ISO9660 formatted\
    \ CD available to Milo. The image can be gzip'd and in this case Milo will recognise\
    \ that it is gzip'd by the .gz suffix.\n\nYou should note that the version of\
    \ Milo does not usually have to match the version of the Linux kernel that you\
    \ are loading. You boot Linux using the following command syntax:\n\n```\nMILO>\
    \ boot [-t file-system] device-name:file-name [boot-option(s)]\n```\n\nWhere device-name\
    \ is the name of the device that you wish to use and file-name is the name of\
    \ the file containing the Linux kernel. All arguments supplied after the file\
    \ name are passed directly to the Linux kernel.\n\nIf you are installing Red Hat,\
    \ then you will need to specify a root device and so on. So you would use:\n\n\
    ```\nMILO> boot fd0:vmlinux.gz root=/dev/fd0 load_ramdisk=1\n```\n\nMilo will\
    \ automatically contain the block devices that you configure into your vmlinux.\
    \ I have tested the floppy driver, the IDE driver and the NCR SCSI driver, these\
    \ work fine. Also, it is important to set the host id of the SCSI controller to\
    \ a reasonable value. By default, MILO will initialize it to the highest possible\
    \ value (7) which should normally work just fine."
  merge: -1
  img_proc: true
- pgno: 214
  md: 'However, if you wish, you can explicitly set the host id of the $n$-th SCSI
    controller in the system by setting environment variable SCSIn_HOSTIDto the appropriate
    value. For example, to set the hostid of the first SCSI controller to 7, you can
    issue the following command at the MILO prompt:


    ```

    setenv SCSIO_HOSTID 7

    ```


    # E.6.3 Rebooting Linux


    You may want to reboot a running Linux system using the **shutdown -r now** command.
    In this case, the Linux kernel returns control to Milo (via the HALT CallPAL entrypoint).
    Milo leaves a compressed copy of itself in memory for just this reason and detects
    that the system is being rebooted from information held in the HWRPB (Hardware
    Restart Parameter Block). In this case it starts to boot reusing exactly the same
    command that was used to boot the Linux kernel the last time. There is a 30 second
    timeout that allows you to interrupt this process and boot whatever kernel you
    wish in whatever way you wish.


    # E.6.4 The “bootopt” command


    For flash based systems such as the AlphaPC64, EB164 and the EB66+, there are
    a number of possible boot options and these are changed using the **bootopt**
    command. This has one argument, a decimal number which is the type of the image
    to be booted the next time the system is power cycled or reset:


    **Boot the Evaluation Board Debug Monitor, Boot the Windows NT ARC firmware.**


    In order to tell the boot code to boot the Milo firmware from flash then you need
    a boot option that means boot the N$^{th}$ image. For this, you need to 128 plus
    N, so if Milo is the third image, you would use the command:


    ```

    MILO> bootopt 131

    ```


    **Note:** Be very careful with this command. A good rule is never to set bootopt
    to 0 (the Evaluation Board Debug Monitor), but instead use the system''s jumpers
    to achieve the same thing.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# E.7 Running the Flash Management Utility


    The run command is used to run the flash management utility. Before you start
    you will need a device available to Milo that contains the updateflash program.
    This (like vminux) can be gzip''d. You need to run the flash management utility
    program from the Milo using the (run) command:


    ```

    MILO> run fd0:fmuz.gz

    ```


    Once it has loaded and initialised, the flash management utility will tell you
    some information about the flash device and give you a command prompt. Again the
    help command is most useful.


    ```

    Linux Milo Flash Management Utility V1.0

    Flash device is an Intel 28F008SA

    16 segments, each of 0x10000 (65536) bytes

    Scanning Flash blocks for usage

    Block 12 contains the environment variables

    FMU>

    ```


    Note that on systems where environment variables may be stored and where there
    is more than one flash block (for example, the AlphaPC64) the flash management
    utility will look for a block to hold Milo''s environment variables. If such a
    block already exists, the flash management utility will tell you where it is.
    Otherwise, you must use the environment command to set a block and initialise
    it. In the above example, flash block 12 contains Milo''s environment variables.


    # E.7.1 The "help" command


    ```

    FMU> help

    FMU command summary:


    list - List the contents of flash

    program - program an image into flash

    quit - Quit

    environment - Set which block should contain the environment variables

    bootopt num - Select firmware type to use on next power up

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: "```\n```\n help                - Print this help text\n FMU>\n```\n```\n\n\
    Note that the environment and bootopt commands are only available on the EB66+,\
    \ the AlphaPC64 and the EB164 systems (and their clones).\n\n# E.7.2 The “list”\
    \ command\n\nThe “list” command shows the current usage of the flash memory. Where\
    \ there is more than one flash block, the usage of each flash block is shown.\
    \ In the example below you can see that Windows NT ARC is using blocks 4:7 and\
