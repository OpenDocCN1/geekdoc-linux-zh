    This will report all the documentation from the package containing the file /etc/sendmail.cf.
    Commands like this are covered more in depth in the RPM-HOWTO , available from
    www.redhat.com.


    Also, what if it''s a command you need help with and the man page isn''t good?
    You could do something like:


    ```

    rpm -qdf ‘which COMMAND’

    ```


    Again, “COMMAND” is the actual command you need help with. This will work only
    when the command is on your path.


    # 6.1.3 HOWTOs and FAQs


    Most of the contents of the Linux Documentation Project (LDP) are available in
    /usr/doc on your system.


    /usr/doc/HOWTO contains the ASCII versions of all the available HOWTOs at the
    time we pressed the CD-ROM. They are gzipped, so you have to use gunzip to unzip
    them or use a command like:


    ```

    zcat HAM-HOWTO.gz | more

    ```


    The latter will work, but is a bit less flexible than unzipping and then using
    more. However, unzipping also requires more disk space unless you re-gzip the
    document when done.


    /usr/doc/HOWTO/mini contains the ASCII versions of all the available mini-HOWTOs.
    They are not compressed and can be viewed with more or less. /usr/doc/HTML contains
    the HTML versions of all the HOWTOs and the Linux Installation and Getting Started
    guide. To view things here, just'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'use a WWW browser like Red Baron from Red Hat Software, or arena . You would
    do something like:


    ```

    cd /usr/doc/HTML

    arena index.html

    ```


    /usr/doc/FAQ contains ASCII version (and some HTML versions) of some popular FAQs,
    including the RedHat-FAQ. All of them can be viewed using more or less.


    # 6.1.4 The "locate" Command


    When you don''t know the full name of a command or file, but need to find it,
    you can usually find it with locate . locate uses a database to find all files
    on your system. Normally, this database gets built from a cron job every night.
    This won''t happen, however, if your machine isn''t bootied into Linux all the
    time. So, if that is the case, you may occasionally want to run the following
    command:


    ```

    /etc/cron.daily/updatdb.cron

    ```


    You will need to be root on your system when doing that. That will allow locate
    to work properly.


    So, if you know you need to find all the "finger" files, you could run:


    ```

    locate finger

    ```


    It should return something like:


    ```

    /usr/bin/finger

    /usr/lib/rc/script/finger

    /usr/man/man1/finger.1

    /usr/man/man8/in.fingd.8

    /usr/sbin/in.fingerd

    ```


    One thing to note, however, is that locate not only returns hits based on file
    name, but also on path name. So if you have a /home/djb/finger/ directory on your
    system, it would get returned along with all files in the directory.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 6.1.5 “info” Pages


    While man is the most ubiquitous documentation format, info is much more powerful.
    It provides hypertext links to make reading large documents much easier and many
    features for the documentation writer. There are some very complete info documents
    on various aspects of Red Hat (especially the portions from the GNU project).


    To read info documentation, use the info program without any arguments. It will
    present you with a list of available documentation. If it can’t find something,
    it’s probably because you don’t have the package installed that includes that
    documentation. Install it with RPM and try again.


    If you’re comfortable using emacs, it has a built in browser for info documentation.
    Use Ctrl-h Ctrl-i to see it.


    The info system is a hypertext based system. Any highlighted text that appears
    is a link leading to more information. Use Tab to move the cursor to the link,
    and press Enter to follow the link. Pressing p returns you to the previous page,
    n moves you to the next page, and u goes up one level of documentation. To exit
    info, press Ctrl-x Ctrl-c (control-x followed by control-c).


    The best way to learn how to use info is to read the info documentation on it.
    If you read the first screen that info presents you’ll be able to get started.


    # 6.2 Help from the Internet Community


