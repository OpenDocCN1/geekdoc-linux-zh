    # Installing


    You usually install Red Hat Linux on a clean disk partition or set of parti-tions,
    or over another installation of Linux. Installing Red Hat Linux over another installation
    of Linux (including Red Hat Linux) does not preserve any of the prior installation.


    If you wish to perform a full install, choose Install.


    # Upgrading


    The installation process for Red Hat Linux 4.1 includes the ability to up-grade
    from prior versions of Red Hat Linux (2.0, 2.1, 3.0.3, and 4.0) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages which are installed on your machine.
    The upgrade process preserves existing configuration files using a .rpmsave extension
    (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions it took in /tmp/upgradedlog.
    As software evolves, con-figuration file formats can change, so you should carefully
    compare your original configuration files to the new files before integrating
    your changes.


    If you wish to upgrade your Red Hat Linux/Intel system, choose Upgrade.'
