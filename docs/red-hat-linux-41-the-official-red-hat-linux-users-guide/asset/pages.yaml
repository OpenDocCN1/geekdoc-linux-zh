- pgno: 218
  md: "Milo is not meant to load operating systems other than Linux, although it can\
    \ load images linked to run at the same place in memory as Linux (which is `0xFFFFFC0000310000`).\
    \ This is how the flash management utilities can be run.\n\nThe PALCode sources\
    \ included in `trmniniboot/palcode/t/ttlah` are correct, however there are problems\
    \ when they are built using the latest gas. They do build if you use the ancient\
    \ a.out gas that's supplied in the Alpha Evaluation Board toolkit (and that's\
    \ how they were built). I'm trying to get someone to fix the new gas. Meanwhile,\
    \ as a workaround, I have provided pre-built PALCode for the supported boards\
    \ and David Mosberger-Tang has a fixed gas on his ftp site.\n\n# ## E.9 Problem\
    \ Solving\n\nHere are some common problems that people have seen, together with\
    \ the solutions.\n\n**Reading MS-DOS floppies from the Evaluation Board Debug\
    \ Monitor.** Several people reported having problems reading files from the floppy\
    \ disk using the Evaluation Board Debug Monitor supplied with Digital Alpha Evaluation\
    \ Boards such as the AlphaPC64. Usually, the Debug Monitor can load the first\
    \ few sectors all right, but then goes into an endless loop complaining about\
    \ “bad sectors.” Apparently, there is an incompatibility between the DOS file\
    \ system as expected by the Debug Monitor and the Linux implementation of DOSFS.\
    \ To make the long story short: if you run into this problem, try using DOS to\
    \ write the floppy disk. For example, if loading the file `milo.cab` doesn't work,\
    \ use a DOS machine, insert the floppy and then do:\n\n```\n```\ncopy a:milo.cab\
    \ c:\n  copy c:milo.cab a:\n  del c:milo.cab\n```\n```\n\nThen try booting from\
    \ that floppy again. This normally solves the problem.\n\n**Milo displays a long\
    \ sequence of 0 and does not accept input.** This usually happens when Milo was\
    \ built to use COM1 as a secondary console device. In such a case, Milo echo output\
    \ to COM1 and accepts input from there also. This is great for debugging but not\
    \ so great if you have a device"
  merge: -1
  img_proc: true
- pgno: 219
  md: 'other than a terminal connected. If this happens, disconnect the device or
    power it down until the Linux kernel has booted. Once Linux is up and running,
