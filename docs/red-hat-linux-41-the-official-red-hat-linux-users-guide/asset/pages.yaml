    You may also select, unselect, or verify a package while querying it by using
    the buttons provided. Click on the **Close** button when you are finished looking
    at the packages.


    # 9.4.2 Verifying Packages


    Verifying a package checks all of the files in the package to insure they match
    the ones present on your system. The checksum, file size, permissions, and owner
    attributes are all checked against the database. This check can be'
