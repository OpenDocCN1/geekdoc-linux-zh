- pgno: 152
  md: '**umask = 002** The traditional UNIX umask is 022, which prevents other users
    and *other members of a user’s primary group* from modifying a user’s files. Since
    every user has their own private group in the UPG scheme, this “group protection”
    is not needed. A umask of 002 will prevent users from modifying other users’ private
    files. The umask is set in */etc/profile*.


    **SGID bit on Directories** If you set the SGID bit on a directory (with *chmod
    g+s directory*), files created in that directory will have their group set to
    the directory’s group.


    Most computing sites like to create a group for each major project and assign
    people to the groups they need to be in. Managing files traditionally has been
    difficult, though, because when someone creates a file it is owned by the primary
    group he or she belongs to. When a single person works on multiple projects, it
    becomes hard to make the files owned by the group that is associated with that
    project. In the UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing group projects very simple.


    Let’s say you have a big project called *devel*, with many people editing the
    *devel* files in a *devel* directory. Make a group called *devel*, *chgrp* the
    *devel* directory to *devel*, and add the all the *devel* users to the *devel*
    group. Now, all the *devel* users will be able to edit the *devel* files and create
    new files in the *devel* directory, and these files will always retain their *devel*
    group. Thus, they will always be edit-able by other *devel* users.


    If you have multiple projects like *devel*, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The SGID bit on each project’s main directory “selects”
    the proper group.


    Since each user’s HOME directory is owned by the user and their private group,
    it is safe to set the SGID bit on the HOME directory. However, by default, files
    are created with the primary group of the user, so the SGID bit would be redundant.


    # User Private Group Rationale


    Since the UPG scheme is new, many people have questions about it, and they wonder
    why it is necessary. The following is the rationale for the'
  merge: -1
  img_proc: true
- pgno: 153
  md: "scheme.\n\n+   - You’d like to have a group of people work on a set of files\
    \ in say, the /usr/lib/emacs/site-lisp directory. You trust a few people to mess\
    \ around in there, but certainly not everyone.\n\n+   - So you enter:\n+   \n\
    +   ```text\n+   chown -R root.emacs /usr/lib/emacs/site-lisp\n+   ```\n+   \n\
    +   and you add the proper users to the group.\n\n+   - To allow the users to\
    \ actually create files in the directory you enter:\n+   \n+   ```text\n+   chmod\
    \ 775 /usr/lib/emacs/site-lisp\n+   ```\n\n+   - But when a user creates a new\
    \ file it is assigned the group of the users default group (usually users). To\
    \ prevent this you enter\n+   \n+   ```text\n+   chmod 2775 /usr/lib/emacs/site-lisp\n\
    +   ```\n+   \n+   which causes everything in the directory to be created with\
    \ the “emacs” group.\n\n+   - But the new file needs to be mode 664 for another\
    \ user in the emacs group to be able to edit it. To do this you make the default\
    \ umask 002.\n\n+   - Well, this all works fine, except that if your default group\
    \ is “users”, every file you create in your home directory will be writable by\
    \ everybody in “users” (usually everyone).\n\n+   - To fix this, you make each\
    \ user have a “private group” as their default group.\n\nAt this point, by making\
    \ the default umask 002 and giving everyone a private default group, you can easily\
    \ set up groups that users can take advantage of without doing any magic. Just\
    \ create the group, add the users, and do the above chown and chmod on the group’s\
    \ directories."
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Programs which give users access to privileges of any sort need to be able
    to authenticate the users. When you log into a system, you provide your name and
    password, and the login process uses those to authenticate the login— to verify
    that you are who you say you are. Other forms of authentication than passwords
    are possible, and it is possible for the passwords to be stored in different ways.


    PAM, which stands for “Pluggable Authentication Modules”, is a way of allowing
    the system administrator to set authentication policy without having to recompile
    programs which do authentication. With PAM, you control how the modules are plugged
    into the programs by editing a configuration file.


    Most Red Hat Linux users will never need to touch this configuration file. When
    you use RPM to install programs that need to do authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    # 10.4.1  Modules


    There are four types of modules defined by the PAM standard. *auth* modules provide
    the actual authentication, perhaps asking for and checking a password, and set
    “credentials” such as group membership or kerberos “tickets”. *account* modules
    check to make sure that the authentication is allowed (the account has not expired,
    the user is allowed to log in at this time of day, etc.). *password* modules are
    used to set passwords. *session* modules are used once a user has been authenticated
    to make it possible for them to use their account, perhaps mounting the user’s
    home directory or making their mailbox available.


    These modules may be *stacked*, so that multiple modules are used. For instance,
    login normally makes use of at least two authentication methods: if “rhosts” authentication
    succeeds, it is sufficient to allow the connection; if it fails, then standard
    “unix” password authentication is done.


    New modules can be added at any time, and PAM-aware applications can then be made
    to use them. For instance, if you have a one-time-password'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'calculator system, and you can write a module to support it (documentation
    on writing modules is included with the system). PAM-aware programs can use the
    new module and work with the new one-time-password calculators without being recompiled
    or otherwise modified in any way.


    There is one module included with Red Hat Linux which we include for the sake
    of completeness, but which we do not yet recommend using except on an experimental
    basis: `pam_pwdb.so`. The `pwdb` package and `pam_pwdb.so` module are currently
    alpha-quality software, but have interesting capabilities that you may wish to
    experiment with. They are **unsupported** by Red Hat Software at this time.


    # ### 10.4.2 Services


    Each program which uses PAM defines its own “service” name. The login program
    defines the service type `login`, `ftp` defines the service type `ftp`, etc. In
    general, the service type is the name of the program used to *access* the service,
    not (if there is a difference) the program used to *provide* the service.


    # ### 10.4.3 The Configuration File


    The file `/etc/pam.conf` is used to configure all PAM applications. Each application
    (really, each **service**) has its own “stanza”. A stanza looks like this:


    ```

    # login authorization

    login auth required /lib/security/pam_secrety.so

    login auth required /lib/security/pam_unix_auth.so

    login auth required /lib/security/pam_nologin.so

    login account required /lib/security/pam_unix_acc.so

    login password required /lib/security/pam_unix_passwd.so

    login session required /lib/security/pam_unix_session.so

    ```


    The first line is a comment. Any line that starts with a `#` character is a comment.
    The next three lines stack up three modules to use for login authorization. The
    first makes sure that *if* the user is trying to log in as root, the `tty` on
    which they are logging in is listed in the `/etc/secrety`'
