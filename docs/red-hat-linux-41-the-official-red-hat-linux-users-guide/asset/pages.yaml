- pgno: 112
  md: '# Chapter 8


    # Control Panel


    ![](img/3d09de050edc8aef2a604e36a4127b47_112_0.png)


    The control panel is a launching pad for a number of different system administration
    tools. They make your life easier by letting you configure things without remembering
    configuration file formats and awkward command line options.


    To start the control-panel, start the X Window System as root with startx and
    type control-panel in an xterm. You will need to be root to run the control-panel
    tools successfully. You can do this as well if you already have X running as a
    normal user. Just type su -c control-panel and then type the root password when
    prompted. If you plan to do other tasks as root, you could type su - followed
    by the root password when prompted. You will then be given a root shell. Here,
    you will need to type DISPLAY=:0 control-panel & to get the control panel to work.
    The “DISPLAY” part tells the control panel to use your display. This syntax works
    only for a Bourne-compatible shell like bash. If you run csh, you would enter
    setenv DISPLAY :0; control-panel &.


    Double clicking on an icon starts up a tool. Please note that you are not prevented
    from starting two instances of any tool, but doing so is a very bad idea'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'because you may try to edit the same files in two places and end up overwriting
    your own changes. If you do accidentally start a second copy of a tool, you should
    quit it immediately. Also, do not manually edit any files managed by the control-panel
    tools while the tools are running. Similarly, do not run any other programs that
    may change those files while the tools are running.


    # ## 8.1 User and Group Configuration


    The tool shown in Figure 8.1 manages the users and groups on your system. In a
    sense, it is a graphical editor for /etc/passwd and /etc/group, and for /etc/shadow
    if you have enabled shadow passwords. With this tool you can add and remove users
    and groups, set login shells, full names, home directories, uid, gids, etc.


    ![](img/3d09de050edc8aef2a604e36a4127b47_113_0.png)


    Figure 8.1: User and Group Configuration Panel


    # ### 8.1.1 Adding or Editing a User


    The same interface is used to add and edit users. To add a user, click on the
    **Add** button in the main window. A dialog box will pop up like the one in figure
    8.2 will appear, with some defaults already filled in. To edit'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'an existing user, double-click on the user in the main window, or click on
    the user and then on the *View/Edit* button.


    ![](img/3d09de050edc8aef2a604e36a4127b47_114_0.png)


    First enter the user name. This is *not* the user’s first and last name; it is
    the id they will use to log on to the system. Do not include any spaces or colons,
    and do not enter more than 8 characters. Press the enter key when you are finished,
    and some of the other fields will be filled in with default values. You may change
    them if you wish, but it is not necessary. You can, at your option, enter the
    user’s full name, office, and phone numbers. The login shell can be changed from
    the default (normally `/bin/bash`) either by choosing a selection from the drop-down
    menu or by simply typing in the shell like the other fields.


    You need to do something about the password. There are five options on the **Encrypted
    Password** menu: Original, Change, No Password, Lock, and Unlock. No Password
    is a very bad option – with no password anyone can log in to your system using
    this id. Choosing Lock will prevent anyone from logging in with this id but keep
    any password already assigned so that it can be unlocked later; Unlock will unlock
    a previously locked password. Original is blank (No Password) when you are adding
    a new user – the same dialog box is used for editing existing users, when Original
    is the user’s original password. Usually you will choose Change. A small dialog
    box will appear where you will need to enter a password, and then confirm'
  merge: -1
