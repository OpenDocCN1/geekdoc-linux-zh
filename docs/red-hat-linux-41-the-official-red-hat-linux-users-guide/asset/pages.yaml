    # ## 2.4.10 Filesystem Configuration


    Since Red Hat Linux may be distributed across several disk partitions, you need
    to choose which disk partitions go with which *filesystem*.


    # ### Selecting the Root Partition


    After initializing swap space, the installation program presents a list of the
    Linux partitions it can find and prompts you to choose *a root partition*. The
    root partition (or *root filesystem*) is the one which holds *everything necessary
    to boot your Red Hat Linux system*: it is mounted on `/` (the *root directory*)
    when your system boots. Select the root partition you wish to use and press `Enter`.


    # ### Other Partitions


    The next dialog presents a list of most of the disk partitions on your system
    (including MS-DOS and other partitions Linux can read), giving you the opportunity
    to assign other partitions to different parts of the filesystem. The partitions
    you assign will be automatically mounted when your Red Hat Linux system boots.
    Select the partition you wish to assign and press `Enter` (or choose **Edit**);
    then enter the *mount point* for that partition, e.g., `/usr` (see Figure 2.10).'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/3d09de050edc8aef2a604e36a4127b47_39_0.png)


    Additionally, Red Hat Linux allows you to mount NFS volumes when your system boots;
    this allows directory trees to be shared across a network. Choose `Add NFS`, then
    enter the hostname of the NFS server, the path to the NFS volume, and the local
    mount point for that volume (see Figure 2.11).


    # Formatting Partitions


    The next installation dialog presents a list of partitions to format. Most partitions
    should be formatted, especially if they are newly created; however, partitions
    such as /home or /usr/local do not need to be formatted if they contain data you
    wish to keep. Select each partition to format and press `Space`. If you wish to
    check for bad blocks while formatting each filesystem, select `Check for bad blocks
    during format`. Press `OK`.


    # 2.4.11 Selecting and Installing Packages


    After your partitions are configured and formatted, you are ready to select packages
    to install. You can select *system components*, which group packages together
    according to function, select individual packages, or select a combination of
    the two.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.4. STEP-BY-STEP INSTALLATION


    ![](img/3d09de050edc8aef2a604e36a4127b47_40_0.png)


    Figure 2.11: Adding an NFS Mount


    # Selecting System Components


    System components group packages together according to the function your Red Hat
    Linux system should be able to perform: for example, **C Development**, **Networked
    Workstation**, or **Web Server**. Select each component you wish to install and
    press `Space`. Selecting **Everything** installs all packages included with Red
    Hat Linux (see Figure 2.12).


    If you wish to select or deselect individual packages as well as system components,
    choose **Select individual packages**.


    # Selecting Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of the package groups
    available; select a group to examine and press `Enter`. The installation program
    presents a list of the packages in that group, which you may select or deselect
    using `Space`. You may view a detailed description of a package by pressing `F1`
    (see Figure 2.13). When you are finished selecting individual packages, press
    **OK** in the **Select Group** dialog.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/3d09de050edc8aef2a604e36a4127b47_41_0.png)


    Figure 2.12: Selecting System Components


    **Please Note:** Some packages (such as the kernel and certain libraries) are
    required for every Red Hat Linux system and are not available to select or deselect.


    # ## Package Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    or libraries to be installed on your system. For example, many of the graphical
    Red Hat system administration tools require the python and pythonlib packages.
    To make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks dependencies each time you install or uninstall software
    packages.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to install, the program presents a
    list of these unresolved dependencies and gives you the opportunity to resolve
    them (see Figure 2.14). If you simply press OK, the program will resolve them
    automatically by adding all required packages to the list of selected packages.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/3d09de050edc8aef2a604e36a4127b47_42_0.png)


    Figure 2.13: Selecting Packages


    # Package Installation


    After all package dependencies are resolved, the installation program begins to
    install packages; it leaves a complete log of what it installs in /tmp/install.log
    on your Red Hat Linux system.


    # 2.4.12 Selecting a Keymap


    After it has finished installing all the packages you selected, the installation
    program presents a list of available keymaps to install (see Figure 2.15). Select
    the keymap you wish to use on your Red Hat Linux system and press Enter; the installation
    program installs that keymap immediately.


    If you wish to change your keymap after you have booted your Red Hat Linux system,
    you may use the /usr/sbin/kbdconfig command.


    # 2.4.13 Configuring a Mouse


    To configure your mouse, choose the mouse type that best matches your mouse and
    press Enter. If you have a 2 button mouse and want to emulate the third (middle)
    button by clicking the left and right buttons at the same'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/3d09de050edc8aef2a604e36a4127b47_43_0.png)


    time, choose **Emulate 3 Buttons**.


    If you choose a serial mouse, the next dialog prompts you for the serial (COM)
    port your mouse is connected to. Choose the correct port and press Enter.


    > **Please Note:** If your mouse is connected to a *PS/2 mouse port*, you should
    select **PS/2 Mouse**, no matter what kind of mouse it is.


    If you wish to change your mouse configuration after you have booted your Red
    Hat Linux system, you may use the `/usr/sbin/mouseconfig` command.


    # 2.4.14  Configuring X Windows


    After setting up your mouse, if you installed the X Windows packages, you have
    the opportunity to configure your X server. If you did not *choose* to install
    the X Window System, you may skip to Section 2.4.15 below.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/3d09de050edc8aef2a604e36a4127b47_44_0.png)


    # Configuring the Metro-X Server


    If you are installing from an Official Red Hat Linux/Intel CD, you may install
    one copy of MetroLink’s Metro-X server, a high-quality commercial X server for
    Linux. Please see the MetroLink license (paper copy) accompanying your Red Hat
    Linux CD for license information. If you choose to use Metro-X, the install Program
    launches the Metro-X configuration utility configX; please see Chapter 5, Section
    5.3 for more information on how to use configX.


    # Configuring an XFree86 Server


    If you wish to use XFree86 (because Metro-X may not support your video card, because
    you have already installed Metro-X on another machine, because Metro-X was not
    included with your copy of Red Hat Linux/Intel, or because you simply prefer to
    use XFree86), the install program launches the Xconfigurator utility, which is
    described in detail in Chapter 5, Section 5.2.


    Xconfigurator first presents a list of video cards. Select your video card from
    the list and press Enter. If your video card does not appear on the list, XFree86
    may not support it; however, if you have technical knowledge'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'about your card, you may choose **Unlisted Card** and attempt to configure
    it anyway.


    Once you have selected your video card, the installation program installs the
    appropriate XFree86 server, and *Xconfigurator* presents a list of monitors. If
    your monitor appears on the list, select it and press `Enter`. Otherwise, select
    *Custom*. If you do select *Custom*, *Xconfigurator* prompts you to select the
    horizontal sync range and vertical sync range of your monitor (these values are
    generally available in the documentation which accompanies your monitor, or from
    your monitor’s vendor or manufacturer).


    > **Please Note:** It is not recommended to select a monitor “similar” to your
    monitor unless you are certain that the monitor you are selecting does not exceed
    the capabilities of your monitor. If you do so, it is possible you may overclock
    your monitor and damage or destroy it.


    Next, *Xconfigurator* prompts you for the amount of video memory installed on
    your video card. If you are not sure, please consult the documentation accompanying
    your video card. It ought not to damage your video card by choosing more memory
    than is available, but the XFree86 server may not start correctly if you do.


    If the video card you selected might have a video clockchip, *Xconfigurator* presents
    a list of clockchips. The recommended choice is *No Clockchip Setting*, since
    XFree86 can automatically detect the proper clockchip in most cases.


    Finally, *Xconfigurator* prompts you to select the video modes you wish to use;
    select one or more modes by pressing `Space`. *Xconfigurator* then writes a configuration
    file containing all of your choices to `/etc/X11/XF86Config`.


    # 2.4.15 Configuring Networking


    After assisting you in configuring an X server, the installation program gives
    you an opportunity to configure (or reconfigure) networking. If you are installing
    from CD-ROM or from a local hard disk, the installation program asks if you want
    to configure networking. If you choose **No**, your Red Hat Linux system will
    be a standalone workstation. If you choose **Yes**, you may configure networking
    as described below.


    If you are installing Red Hat Linux via NFS or FTP, you will have already'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'configured temporary networking information. The install program offers you
    three choices:


    +   * Keep the setup you have been using to install with; all the networking information
    you entered previously becomes part of your system''s permanent configuration.

    +   * Reconfigure networking; the installation program presents the network configuration
    dialogs described below with the values you used during installation filled in
    as defaults. Choose this if your system will be installed on a network other than
    the one you used to install Red Hat Linux.

    +   * Don''t set up networking at all; your system will not have networking configured.
    Choose this if you installed your system over a network, but it will be used as
    a standalone workstation.


    # Network Configuration Dialogs


    After the installation program has found your network card, it presents several
    dialogs for configuring TCP/IP networking. This information is only used during
    the installation process; you will be able to configure permanent networking information
    later. This feature allows greater flexibility if you want to install from a network
    other than the one where the machine will "live". Figure 2.4 contains example
    networking information.


    The first dialog asks you for IP and other network addresses (see Figure 2.5).
    Enter the **IP address** you are using during installation and press `Enter`.
    The installation program attempts to guess your **Netmask** based on your **IP
    address**; you may change the netmask if it is incorrect. Press `Enter`. The installation
    program guesses the **Default gateway** and **Primary nameserver** addresses from
    your IP address and netmask; you may change them if they are incorrect. Choose
    **OK** to continue.


    The second dialog prompts you for a domain name, a hostname, and other networking
    information (see Figure 2.6). Enter the **Domain name** for your system and press
    `Enter`; the installation program carries the domain name down to the **Host name**
    field. Enter the hostname you are using in front of the domain name to form a
    fully qualified domain name (FQDN). If your network has more than one nameserver,
    you may enter IP addresses'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'for additional nameservers in the **Secondary nameserver** and **Tertiary nameserver**
    fields. Choose **OK** to continue.


    # 2.4.16 Configuring the Clock


    After you have set up networking, the installation program presents a dialog to
    help you configure your Red Hat Linux system’s timezone.


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal Time), select **Hardware clock set to GMT**.
    Setting your hardware clock to GMT means your Red Hat Linux system will properly
    handle daylight savings time, if your timezone uses it. Most networks use GMT.


    Select the timezone your system will be operating in from the list, and press
    <u>Enter</u>.


    If you wish to change your timezone configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/timeconfig command.


    # 2.4.17 Setting a Root Password


    After you have set up your system’s timezone, the installation program prompts
    you to set a *root password* for your system; this is the password you will use
    to log into your Red Hat Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again (see Figure
    2.16).


    You ought to make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, *qwerty*,
    *password*, *root*, *123456*, and *anteater* are all examples of poor passwords.
    Good passwords mix numerals with upper and lower case letters and do not contain
    dictionary words: Aard387varK or 410VBltlSW, for example. Remember that the password
    is case-sensitive. Write down this password and keep it in a secure place.


    **Please Note:** The *root* user (also known as the *superuser*) has complete'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'access to the entire system; for this reason, logging in as the root user is
    best done only to perform system maintenance or administration, so that critical
    system files are not inadvertently changed, moved, or deleted. Please see Section
    8.1 for instructions on how to add a user for yourself after you reboot your system.


    ![](img/3d09de050edc8aef2a604e36a4127b47_48_0.png)


    Figure 2.16: Root Password Entry


    # 2.4.18 Installing LILO


    In order to be able to boot your Red Hat Linux system, you usually need to install
    LILO (the LIinux LOader). You may install LILO in one of several places:


    **The Master Boot Record (MBR)** is the recommended place to install LILO, unless
    another operating system loader (e.g., System Commander or OS/2''s Boot Manager)
    is already installed there. When your machine boots, LILO starts and presents
    the boot: prompt; you can boot Red Hat Linux or any other operating system you
    configure LILO to boot (see below).


    **The first sector of your root partition** is recommended if you are already
    using another boot loader on your system (such as OS/2''s Boot Manager); then
    you can setup that boot loader to start LILO and boot Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '**The first sector of a floppy diskette** is an alternative either of the above
    options; to boot Red Hat Linux, insert the LILO diskette into your machine''s
    floppy drive and reboot. LILO starts from the floppy and presents the boot: prompt.


    Select the location you wish to install LILO and press **OK**. If you do not wish
    to install LILO, press **Skip**.


    # Limitations of LILO


    LILO is subject to some limitations imposed by most PC BIOSes. Here are the “rules”
    of where your root partition must live if you want to install LILO on a hard drive:


    +   1. If you have 2 IDE (or EIDE) drives, your root partition must live on one
    of them. This also includes any IDE CD-ROM drives on your primary controller.
    If you have one IDE hard drive, and one IDE CD-ROM on the primary controller,
    you must install your root partition on the hard drive.

    +   2. If you have one IDE (or EIDE) drive and one or more SCSI drives, your root
    partition must live either on the IDE drive or the SCSI drive that is at ID 0.
    No other SCSI IDs will work.

    +   3. If you have SCSI only, your root partition must live on a drive at ID 0
    or ID 1. No other SCSI IDs will work.

    +   4. In any case, your Linux kernel (and, if you have a SCSI adaptor, your initial
    ramdisk) must live below cylinder 1023. For IDE (or EIDE) drives, this generally
    means below the 512 MB mark; for SCSI drives, it''s generally below the 1 GB mark.
    The easiest (and recommended) way to ensure this is to make sure your entire root
    partition is located between cylinders 0–1023. Some more recent BIOSes don''t
    have this limitation.


    # Adding Options to the LILO Boot Command Line


    Finally, the installation program will ask if you wish to add default options
    to the LILO boot command. Any options you enter will be passed to the Linux kernel
    every time it boots. Press **OK** when finished.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are a
    few alternatives:


    LOADLIN can load Linux from MS-DOS; unfortunately, it requires a copy of the Linux
    kernel (and an initial ram disk, if you have a SCSI adapter) to be available on
    an MS-DOS partition. The only way to accomplish this is to boot your Red Hat Linux
    system using some other method (e.g., from LILO on a floppy) and then copy the
    kernel an MS-DOS partition. LOADLIN is available from ftp://sunsite.unc.edu/system/Linux-boot/
    and sunsite''s various mirror sites.


    SYSLINUX is an MS-DOS program very similar to LOADLIN; it is also available from
    ftp://sunsite.unc.edu/system/Linux-boot/ and sunsite''s various mirror sites.


    Some commercial bootloaders, such as System Commander, are able to boot Linux
    (but may still require LILO to be installed in your Linux root partition).


    # 2.4.19 Finishing Up ...or Starting Up


    After you have completed LILO installation, the installation program will reboot
    your system. Please don''t forget to remove the installation floppy from the diskette
    drive.


    At the boot: prompt, press Enter and watch your Red Hat Linux system boot. When
    it presents the login: prompt, enter root; at the Password: prompt, type the root
    password you set for your machine in Section 2.4.17.'
  merge: -1
  img_proc: true
