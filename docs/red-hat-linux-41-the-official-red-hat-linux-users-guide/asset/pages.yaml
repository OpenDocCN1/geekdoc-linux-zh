- pgno: 52
  md: '# # Chapter 3


    # # Installing Red Hat Linux/Alpha


    # ## 3.1 Introduction


    These are brief installation instructions for the Red Hat Linux/Alpha 4.1 release
    for Digital Equipment Corporation’s Alpha series of processors. This chapter describes
    the differences between installing Red Hat Linux/Alpha and Red Hat Linux/Intel.
    For further details on the installation procedure, please see Chapter 2, Installing
    Red Hat Linux/Intel.


    # ## 3.2 Supported Hardware


    Red Hat Linux/Alpha supports a variety of hardware based on the Alpha processor
    and the PCI bus. Platforms on which this release is known to work include:


    +   1. AlphaPC64 (Cabriolet, Aspen Telluride)

    +   2. AxpPCI33 (Noname)

    +   3. EB64+ (Aspen Alpine)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   4. EB66 (NekoTech Mach 1)

    +   5. EB66+

    +   6. Jensen (DEC PC 150, 2000 model 300, Culean)

    +   7. Univeral Desktop Box (UDB, sometimes called Multia). This is just a noname
    board and is treated as such for the rest of this document.

    +   8. AlphaStation 200, 250, 255, 400 (Avanti machines)

    +   9. EB164 (Aspen Avalanche, Timberline, Summit; Microway Screamer)

    +   10. Platform 2000 machines from Kinetics

    +   11. PC164 machines (Durango)

    +   12. Alcor type machines (AlphaStation 500, 600; Maverick, Brett)

    +   13. Alpha-XL

    +   14. Alpha-XLT (XL 300, XL 366)

    +   15. Mikas type machines (AlphaServer 1000), 1000A not supported)


    All of those platforms except the Jensen include an NCR 810 SCSI controller, though
    BusLogic PCI SCSI controllers (other than the FlashPoint), the Adaptec AHA2940
    SCSI controller, and Qlogic 1020 ISP controllers are also supported. The Jensen
    design uses an AHA1740 SCSI controller and is supported.


    NE2000, DE422, and DE4x5 (PCI) Ethernet cards are supported. This includes the
    UDB''s internal Ethernet hardware. Token ring support is also included in the
    kernels.


    The X Window System should work on any machine with a S3 based video card except
    the Jensen machines. There is a server available from ftp://ftp.azstarnet.com
    for S3 cards in /pub/linux/axp/jensen. TGA servers (which work on the UDB for
    example) are available on your Red Hat Linux/Alpha CD in the X11 directory. Most
    of the cards from Orchid and Number 9 will work. Most Diamond Stealth cards are
    also supported. Digital TGA cards (based on the DC21030 chip) are supported in
    8 bit mode, and an X server for Mach64 cards is also provided.


    More information on Alpha hardware is available in Appendix D.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# ## 3.3 Installing the Miniloader MILO


    The easiest method of booting Red Hat Linux/Alpha is through the Linux Miniloader,
    MILO. You may either load MILO directly from your system''s firmware, or use the
    ARC console to load MILO as an alternate OS. Details on these procedures are in
    the MILO FAQ, which is available as Appendix E.


    The full MILO tree is available on the CD in the *milo* directory. It contains
    the latest documentation and MILO images available when this CD was manufactured.
    However, later versions of MILO are regularly made available at *gatekeeper.dec.com*.
    The *images/arc* directory also contains floppy disk images that can be used with
    the ARC console to boot directly into MILO. They contain MILO and **load.exe**,
    as well as a flashable version of MILO and the flash management utility for the
    platforms which support flashing MILO. If you have trouble with MILO, the first
    thing to try is a newer MILO.


    If MILO is not supported on your machine, you need to boot the floppy or the CD
    directly from the SRM console. Information on doing this is available from the
    Red Hat Software web site at `http://www.redhat.com/linux-info/alpha/faq`.


    # ## 3.4 Installing Red Hat Linux/Alpha


    # ### 3.4.1 Making a Boot disk


    The first step in installing Red Hat Linux/Alpha is creating a boot disk; which
    boot disk to use depends on the hardware you have. A variety of boot disk images
    are available on the Red Hat Linux/Alpha CD in the *images* directory, along with
    a README containing more information about the various images which are available.


    Available boot images include:


    +   1. `cab.img` (AlphaPC64, Cabriole)

    +   2. `noname.img` (AxpPCI33, Noname, Universal Desktop Box)

    +   3. `eb64p.img` (EB64+, Aspen Timberlines)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   4.  eb66.img (EB66)

    +   5.  eb66p.img (EB66+)

    +   6.  jensen.img (Jensens)

    +   7.  avanti.img (AlphaStation 200, 250, 400)

    +   8.  xl.img (Alpha XL)

    +   9.  xlt.img (Alpha XTL)

    +   10.  eb164.img (EB164 based machines)

    +   11.  p2000.img (Platform 2000)

    +   12.  pc164.img (Alcor based machines)

    +   13.  alcor.img (Alcor based machines)

    +   14.  mikasa.img (Mikasa based machines)


    All of these images should work on machines with either VGA or TGA based graphics
    boards. To create a floppy from these images, use `rawrite.exe` under MS-DOS or
    MS-Windows (it is available in the `dosutils` directory), or `dd` under Linux
    or Unix.


    # 3.4.2  Beginning the Install


    Installing Red Hat Linux/Alpha requires the use of a ramdisk. Several ramdisk
    images are on the Red Hat Linux/Alpha CD in the `images` directory. To begin the
    install, boot to the MILO prompt and insert your boot disk in your first floppy
    drive. Then give this command to MILO:


    ```

    boot fd0:vmlinux.gz root=/dev/fd0 load_ramdisk=1 prompt_ramdisk=1

    ```


    MILO reads the Linux kernel from your boot disk and runs it. The kernel loads
    a basic system from the remainder of the floppy and runs the installation program.
    If you are using the SRM console, the


    ```

    load_ramdisk=1 prompt_ramdisk=1

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'command must be given to the kernel as arguments for the install to begin properly.
    Red Hat Linux/Alpha supports two varieties of hard drive partitioning:


    +   - Standard *fdisk*-style partitioning; this has the usual oddities (such as
    extended partitions) and is done in the same way as on Intel platforms (using
    Linux *fdisk*. This is the partitioning style you must use if you are using the
    ARC console.


    +   - BSD-style disk-labelling. It is normal to make the first partition on a
    disk-labelled hard drive the swap partition. We don''t recommend using BSD disk-labelling
    unless it is absolutely necessary.


    # 3.4.3  Finishing Up


    After the install is finished and your system is fully configured, you will be
    asked to reset your computer. This indicates that your system has been successfully
    installed.


    # 3.5  Booting your Red Hat Linux/Alpha system


    To boot Red Hat Linux from MILO, you must use the **boot** command. The command
    differs slightly depending on where your root partition is. For example, if your
    root partition is the second partition on your first SCSI hard drive, you would
    boot as follows:


    ```

    boot sda2:vmlinux.gz root=/dev/sda2

    ```


    If instead your root partition is the third partition on your second IDE drive,
    you would use this command:


    ```

    boot hdb3:vmlinux.gz root=/dev/hdb3

    ```


    For information on these commands and on automating the boot process, please read
    the MILO HOWTO in Appendix E.'
  merge: -1
  img_proc: true
