- pgno: 37
  md: '+   * To list the current partition table, use the `p` command. To add a new
    partition, use `n`.

    +   * Linux `fdisk` creates partitions of type `Linux native` by default. When
    you create a swap partition, don’t forget to change it to type `Linux swap` using
    the `t` command.

    +   * Linux allows up to four (4) partitions on one disk. If you wish to create
    more than that, one of the four may be an *extended* partition, which in turn
    contains one or more *logical* partitions. Since it acts as a container, the extended
    partition must span all of the space that the logical partitions will take up.

    +   * It’s a good idea to write down which partitions (e.g., `/dev/hda2`) are
    meant for which filesystems (e.g., `/usr`) as you create each one.

    +   * **Please Note:** None of the changes you make take effect until you save
    them and exit `fdisk` using the `w` command. You may quit `fdisk` at any time
    without saving changes using the `q` command.


    # Numbering Partitions


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing to inexperienced users. Here is a summary:


    +   * **The letters** denote the device the partition is on, e.g., `/dev/hda`
    (the first IDE hard disk) or `/dev/sdb` (the second SCSI disk).

    +   * **The number** denotes the partition. The first four (primary or extended)
    partitions are numbered 1 through 4. Logical partitions start at 5. E.g., `/dev/hda3`
    is the third primary or extended partition on the first IDE hard disk; `/dev/sdb6`
    is the second logical partition on the second SCSI hard disk.


    # Changing the Partition Table


    When you are finished partitioning your disks, press **Done**; you may see a message
    indicating that the installation program needs to reboot. This is a normal occurrence
    after changing a disk’s partition data; it usually happens if you created, changed,
    or deleted any extended partitions. After you press'
  merge: -1
  img_proc: true
