- pgno: 229
  md: '# ### F.3 Installation Questions


    # #### F.3.1 Do I need swap space?


    Yes! If you have 8M of RAM, you *must* enable at least 8M of swap during the installation
    of Red Hat. If you have more RAM, you should still enable swap, though it isn''t
    mandatory.


    # #### F.3.2 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won''t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure it for
    IDE1 (the secondary IDE port). I''m not sure if you have to make changes under
    DOS for this configuration to work, but your manuals should help with this (it
    *will* still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot: linux hdN=cdrrom

    ```


    If you have one IDE drive, N is most likely "b" in this case (ie "linux hdb=cdrrom").
    If you have two, then it will be "c".


    # #### F.3.3 How do I do a network install of Red Hat Linux 4.1?


    Get the RedHat-HOWTO from the docs directory of any Red Hat Mirror. It will tell
    you all you need to know.


    # #### F.3.4 How do I run the install program again?


    Reboot your machine using the disk that you used for the installation. You will
    most likely need to completely reinstall your system.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'If you just want to reconfigure networking or install more packages, try using
    the control-panel tools.


    # F.3.5 Why am I missing some programs?


    Try doing a ''df'' at the shell prompt. If you have "/" or "/usr" showing up as
    100% used, chances are your partition was too small for the entire install. Unfortunately,
    this does not result in any type of error messages unless you are watching closely
    (which most people don''t when the thing tells you it is going to take 2 hours
    to install :-)). You will most likely need to reinstall and do one of two things:
    a) make your root or "/usr" partition larger or b) install fewer packages.


    Also, if none of the partitions you made for Linux is full, you are probably just
    missing some packages. You will need to use `glint` or `rpm` to install those.


    # F.3.6 How do I mount my CD-ROM?


    If you installed from CD-ROM, you should be able to do:


    ```

    ```bash

    mount /mnt/cdrom

    ```

    ```


    If you get an error that says the mount point does not exist, do:


    ```

    ```bash

    mkdir /mnt/cdrom

    ```

    ```


    If you did an install via NFS: You need to know what type of CD-ROM you have.
    The best way is to watch the boot messages as you reboot, or look at `/var/adm/messages`
    (**more** `/var/adm/messages`). You most likely have an IDE CD-ROM that will show
    up as `/dev/hdc` or `/dev/hdd`, or you have a Sound Blaster type that is `/dev/sbpcd`,
    or you have a SCSI that is `/dev/scd0`.


    In any case, you can do the following:


    ```

    ```bash

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```

    ```


    and substitute `xxxx` for YOUR device. You can then: `cd /mnt/cdrom` and then:
    `ls` and you will be looking at the contents of the CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# F.3.7 Why does Linux only see part of my RAM?


    There are a couple things that could be wrong. On some 386''s, you need to compile
    your kernel with “Limit memory to 16M?” enabled. Some AMI BIOS motherboards have
    a memory option to split memory into two segments. I''m not sure what the option
    is called, but it has something to do with “linear”. You''ll find it in your BIOS
    setup. You may need to specify the amount of memory to the kernel at boot time
    from lilo. To try this, type: linux mem=32M at the lilo prompt. If that works,
    you can add that line to the append in your /etc/lilo.conf and rerun lilo. The
    example from above would be:


    ```

    append = "mem=32M"

    ```


    Don''t forget to run ''lilo'' after editing the file.


    # F.3.8 How do I install to my DOS partition?


    You can''t. None of the current Red Hat releases support UMSDOS installs. If you
    have one drive that has one big DOS partition with free space you want to use,
    you have two options. One is to backup all your DOS data somehow and then repartition
    the drive into smaller partitions and then restore the DOS data back to a DOS
    partition. You then have a free partition for linux. The second choice is to use
    fips. fips is a program that will let you change your partition size of a DOS
    partition without harming the data on it. It is STRONGLY suggested that you backup
    your data before using fips. Red Hat Software makes no warranties or claims as
    to the suitability of using fips for this purpose nor can we guarantee that data
    will remain unharmed. I haven''t heard of anyone having a bad experience with
    fips, but I won''t guarantee it either.


    # F.3.9 How do I use the NYS/NIS system that comes with RedHat?


    Please see the NYS-Tips. You can find it at http://www.redhat.com/.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# F.3.10 Why can’t I get to Unixware now that I’ve installed Linux?


    You need to boot Unixware off of a boot floppy and run \`disk / mbr\`. That should
    allow you to get back into Unixware, but will not let you access Linux.


    # F.3.11 Why does my Diamond do odd things under X Windows?


    If you experience problems with XFree86 and your Diamond video card, you may try
    putting:


    “Option Diamond”


    In your \`/etc/X11/XF86Config\` (or in \`/etc/XF86Config\` if you use that).


    # F.3.12 Where do I go to find an “errata” sheet?


    To find solutions to known problems, please see:


    www.redhat.com/errata


    and look for the product page for your particular version. These sheets only exist
    for Red Hat Linux 3.0.3 and later.


    # F.3.13 I installed Metro-X, now how do I use it?


    To get the \`startx\` command to use Metro-X instead of XFree86 you must make
    \`/etc/X11/X\` a symbolic link to \`/usr/X11R6/bin/x\`. This is summarized by:


    ```

    rm \`/etc/X11/X<br>\`

    ln -s /usr/X11R6/bin/X /etc/X11/X

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # F.4 Using Red Hat Linux


    # ## F.4.1 Why does Red Hat ‘adduser’ put each user in his/her own group?


    It’s called the user group scheme, and it’s described in the manual. What it basically
    does is allow you to use groups to allow multiple people to use a common set of
    files and edit them, transparently. It goes like this:


    +   - You’d like to have a group of people work on a set of files in say, the
    “/usr/lib/emacs/site-lisp” directory. You trust a few people to mess around in
    there, but certainly not everyone.

    +   - So you do “chown -R root.emacs /usr/lib/emacs/site-lisp”. And you add the
    proper users to the group.

    +   - To allow the users to actually create files in the directory you do “chmod
    775 /usr/lib/emacs/site-lisp”.

    +   - This is fine, but when a user creates a new file it gets the group of the
    users default group (usually users).

    +   - To prevent this you do “chmod 2775 /usr/lib/emacs/site-lisp” which causes
    everything in the directory to get created with the “emacs” group.

    +   - This is fine, but the new file needs to be mode 664 for another user in
    the emacs group. To do this you make the default umask 002.

    +   - Well, this all works good, except that if your default group is “users”,
    every file you create in your home directory will be wrtable by everybody in “users”
    (usually everyone).

    +   - To fix this, you make each user have a “private group” as their default
    group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups which users can take advantage of without
    doing any magic. Just create the group, add the users, and do the above chown
    and chmod on the group’s directories.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# F.4.2 Why doesn''t the xmh shipped with Red Hat work properly?


    We only ship xmh because it is part of the standard X11 distribution. xmh is basically
    shipped as-is from the X11 distribution, and is most likely broken. We''ve found
    that there are several better alternatives. If you want to use mh mail, install
    the mh RPM and the exmh RPM. exmh is a much better GUI mail reader than xmh.


    # F.4.3 I rebuilt my kernel, but I got vmlinux instead of vmlinuz. Why?


    You need to do `make boot` instead of just `make`; this builds a compressed kernel
    and place it in `/usr/src/linux/arch/i386/boot`. You must copy it to `/boot` and
    run lilo yourself to use this one.


    If you used `make`, you got a file called vmlinux. This is an *uncompressed* kernel
    image, and will **NOT** work! LILO will only boot a compressed kernel.


    # F.4.4 How do I make my own packages (RPMs)?


    Simple. Read the RPM-HOWTO, available in the `docs` directory on any Red Hat Mirror.


    # F.4.5 I compiled a program, but I can''t run it. What gives?


    Lets say you do the following as root:


    ```

    gcc -o hello hello.c

    hello

    ```


    You''ll get `"hello: command not found"`

    Why?

    By default, `.` is not in your path. You must run:'
  merge: -1
  img_proc: true
