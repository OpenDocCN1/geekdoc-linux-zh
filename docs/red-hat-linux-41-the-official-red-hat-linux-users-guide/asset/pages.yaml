  md: '# Chapter 9


    # Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It''s called glint (Graphical Linux Installation Tool) and runs under the X Windows
    System. It allows easy installation, uninstallation, upgrading, querying, and
    verification of packages. The interface is similar to the one found in many popular
    file managers and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all of the components of that package on your system. Uninstalling one
    removes all traces of the package except for configuration files you have modified.
    Upgrading a package installs the newly available version and uninstall all other
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages.


    The query operation lets you examine the details of both installed or available
    package. You can view the description of the package, where and when it was built,
    the files in the package, and other attributes. All of the configuration and documentation
    components of each package are clearly marked as such to reduce the time you spend
    looking for them.


    Using glint to perform all of these operations is the same as using rpm to do
    them from the command line. However, the graphical nature of glint often makes
    these operations easier to perform.


    The normal way to handle glint is to display the available packages and'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'files, select the ones you want to operate on, and then press a button or choose
    a menu item that performs the operation. For instance, you can install several
    packages with a few button clicks.


    # 9.1 Starting glint


    To start glint, simply run **glint** & from any X terminal window. That will bring
    up a window that looks like the one in figure 9.1. Any user can use glint to query
    and verify packages, but if you need to install, uninstall, or upgrade packages
    be sure to run glint as root.


    There are two main parts to the glint interface. The first, on the left, allows
    you to browse and select the packages installed on your system. The right side
    contains buttons that manipulate the selected packages.


    ![](img/3d09de050edc8aef2a604e36a4127b47_133_0.png)


    # 9.2 The Package Display


    Each folder icon in glint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are used
    to place packages that perform similar functions in similar locations. For example,
    Red Hat includes many application programs such as editors and spreadsheets. All
    of the text based ones appear in the “Appli-'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'cations” group. Inside of that group, there is another grouping for all of
    the editors that are shipped.


    By convention, groups are written in the same way as UNIX paths. The top most
    group is written first, and subsequent groups follow with a slash separating the
    group names. This means that an X-based drawing program appears in the X11/Applications/Graphics
    group.


    To view the packages and subgroups within a group, double click the left mouse
    button on a group’s folder icon. The window then changes to show what that package
    contains. The top line of the package display shows which group you’re currently
    looking in, as well as the groups leading to the current one. To return to the
    previous group you were looking at, double click on the “Back” folder, which is
    always in the upper left hand corner of the folder area (though it often gets
    scrolled away).


    If you’d like to examine a subgroup in a new window, double click the middle mouse
    button on its folder. If your mouse has only two buttons, click both. This will
    create a new window with that group in it.


    # 9.2.1 Context Sensitive Menus


    Pressing the right mouse button on any icon in the package window brings up a
    small, *context sensitive* menu. The exact items it contains depends on exactly
    where you press it. They all contain options to select or deselect the item, and
    many let you install, uninstall, query, upgrade, or verify the item you clicked
    on. There’s more information on how to do these things later.


    To choose an item from a context sensitive menu, press and hold the right mouse
    button on a icon. While still holding the right button down, move the mouse pointer
    over the item you’d like to select (which will then become highlighted). Release
    the right mouse button to select that item and make the menu disappear.


    # 9.2.2 Selecting Packages


    To select a single package, click the left mouse button on it. You’ll notice a
    thin border appear around the package’s icon (as shown in figure 9.2) which shows
    that it’s currently selected. To unselect it, click the left mouse button'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'on it and the border will disappear. The number of packages currently selected
    is always displayed at the bottom of the window. A group’s folder icon displays
    the number of packages inside of that group have been selected, or All if all
    of them have been.


    ![](img/3d09de050edc8aef2a604e36a4127b47_135_0.png)


    The context sensitive menu for a package also allows easy selection and unselection.
    Using the `select` and `unselect` options on a package’s icon selects or unselects
    that package, while these options on a group’s folder icon select and unselect
    all of the packages in that group. Using these menu options makes selecting groups
    of packages much quicker than selecting each package individually.


    # ### 9.2.3 Viewing Available Packages


    To see what packages are available for you to install, choose the `Available`
    pushbutton from any glint window. After a few moments, a new window, like the
    one shown in figure 9.3, will appear. The differences in the title and buttons
    indicate that this window is listing packages you may install. Navigating through
    these packages and selecting them is the same as in the other glint windows.


    If you get an error message from glint saying that it can’t find any RPMs, see
    the section below on Configuration.'
