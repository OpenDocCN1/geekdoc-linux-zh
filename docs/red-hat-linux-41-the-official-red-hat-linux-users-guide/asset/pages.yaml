    # # D.8 Bytes and all that stuff


    When the Alpha architecture was introduced, it was unique amongst RISC architectures
    for eschewing 8-bit and 16-bit loads and stores. It supported'
  merge: -1
  img_proc: true
- pgno: 193
  md: '32-bit and 64-bit loads and stores (longword and quadword, in Digital’s nomenclature).
    The co-architects (Dick Sites, Rich Witek) justified this decision by citing the
    advantages:


    +   1. Byte support in the cache and memory sub-system tends to slow down accesses
    for 32-bit and 64-bit quantities.


    +   2. Byte support makes it hard to build high-speed error-correction circuitry
    into the cache/memory sub-system.


    Alpha compensates by providing powerful instructions for manipulating bytes and
    byte groups within 64-bit registers. Standard benchmarks for string operations
    (e.g., some of the Byte benchmarks) show that Alpha performs very well on byte
    manipulation.


    The absence of byte loads and stores impacts some software semaphores and impacts
    the design of I/O sub-systems. Digital’s solution to the I/O problem is to use
    some low-order address lines to specify the data size during I/O transfers, and
    to decode these as byte enables. This so-called Sparse Addressing wastes address
    space and has the consequence that I/O space is non-contiguous (more on the intricacies
    of Sparse Addressing when I get around to writing it). Note that I/O space, in
    this context, refers to all system resources present on the PCI and therefore
    includes both PCI memory space and PCI I/O space.


    With the 21164A introduction, the Alpha architecture was ECo’d to include byte
    addressing. Executing these new instructions on an earlier CPU will cause an OPCDEC
    PALCode exception, so that the PALCode will handle the access. This will have
    a performance impact. The ramifications of this are that use of these new instructions
    (IMO) should be restricted to device drivers rather than applications code.


    These new byte load and stores mean that future support chipsets will be able
    to support contiguous I/O space.


    # D.9 PALCode and all that stuff


    This is a placeholder for a section explaining PALCode. I will write it if there
    is sufficient interest.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# **D.10 Porting**


    The ability of any Alpha-based machine to run Linux is really only limited by
    your ability to get information on the gory details of its innards. Since there
    are Linux ports for the E66, EB64+ and EB164 boards, all systems based on the
    21066, 21064/APECS or 21164/ALCOR should run Linux with little or no modification.
    The major thing that is different between any of these motherboards is the way
    that they route interrupts. There are three sources of interrupts:


    +   - on-board devices

    +   - PCI devices

    +   - ISA devices


    All the systems use an Intel System I/O bridge (SIO) to act as a bridge between
    PCI and ISA (the main I/O bus is PCI, the ISA bus is a secondary bus used to support
    slow-speed and ''legacy'' I/O devices). The SIO contains the traditional pair
    of daisy-chained 8259s.


    Some systems (e.g., the Noname) route all of their interrupts through the SIO
    and thence to the CPU. Some systems have a separate interrupt controller and route
    all PCI interrupts plus the SIO interrupt (8259 output) through that, and all
    ISA interrupts through the SIO.


    Other differences between the systems include:


    +   - how many slots they have

    +   - what on-board PCI devices they have

    +   - whether they have Flash or EPROM


    # **D.11 More Information**


    All of the DS evaluation boards and motherboard designs are license-free and the
    whole documentation kit for a design costs about $50. That includes all the schematics,
    programmable parts sources, data sheets for CPU'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'and support chipset. The doc kits are available from Digital Semiconductor
    distributors. I’m not suggesting that many people will want to rush out and buy
    this, but I do want to point out that the information is available.


    Hope that was helpful. Comments/updates/suggestions for expansion to Neal Crook,
    neal.crook@reo.mts.digital.com


    # D.12 References


    http://www.research.digital.com/wrl/publications/abstracts/TN-13.html

    Bill Hamburgen, Jeff Mogul, Brian Reid, Alan Eustace, Richard Swan, Mary Jo Doherty,
    and Joel Bartlett. Characterization of Organic Illumination Systems. DEC WRL,
    Technical Note 13, April 1989.'
