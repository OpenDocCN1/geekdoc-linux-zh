    \ kernel (linux) simply press Enter, or wait for LILO to time out. If you want\
    \ to boot the old kernel (old), simply enter old and press Enter.\n\nHere is a\
    \ summary of the steps;\n\n+   * mv /boot/vmlinuz /boot/vmlinuz.old\n+   * cp\
