- pgno: 184
  md: '# ## Appendix D


    # ## Intro to Alpha Systems and Processors


    This document is a brief overview of existing Alpha CPUs, chipsets and systems.
    It has something of a hardware bias, reflecting my own area of expertise. Although
    I am an employee of Digital Equipment Corporation, this is not an official statement
    by Digital and any opinions expressed are mine and not Digital''s.


    # ### D.1 What is Alpha


    “Alpha” is the name given to Digital’s 64-bit RISC architecture. The Alpha project
    in Digital began in mid-1989, with the goal of providing a high-performance migration
    path for VAX customers. This was not the first RISC architecture to be produced
    by Digital, but it was the first to reach the market. When Digital announced Alpha,
    in March 1992, it made the decision to enter the merchant semiconductor market
    by selling Alpha microprocessors. Alpha is also sometimes referred to as Alpha
    AXP, for obscure and arcane reasons that aren’t worth persuing. Suffice it to
    say that they are one and the same.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 172APPENDIX D. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    # D.2 What is Digital Semiconductor


    Digital Semiconductor (DS, http://www.digital.com/info/semiconductor/) is the
    business unit within Digital Equipment Corporation (Digital - we don''t like the
    name DEC) that sells semiconductors on the merchant market. Digital''s products
    include CPUs, support chipsets, PCI-PCI bridges and PCI peripheral chips for comms
    and multimedia.


    # D.3 Alpha CPUs


    There are currently 2 generations of CPU core that implement the Alpha architecture:


    +   * EV4

    +   * EV5


    Opinions differ as to what "EV" stands for (Editor''s note: the true answer is
    of course “Electro Vlassic” See section D.12), but the number represents the first
    generation of Digital''s CMOS technology that the core was implemented in. So,
    the EV4 was originally implemented in CMOS4. As time goes by, a CPU tends to get
    a mid-life performance kick by being optically shrunk into the next generation
    of CMOS process. EV4S, then, is the EV4 core implemented in CMOS5 process. There
    is a big difference between shrinking a design into a particular technology and
    implementing it from scratch in that technology (but I don''t want to go into
    that now). There are a few other wildcards in here: there is also a CMOS4S (optical
    shrink in CMOS4) and a CMOS5L.


    True technophiles will be interested to know that CMOS4 is a 0.75 micron process,
    CMOS5 is a 0.5 micron process and CMOS6 is a 0.35 micron process.


    To map these CPU cores to *chips* we get:


    ```

    /21064-150,166/ EV4 (originally), EV4S (now)

    /21064-200/ EV4S

    ```'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   /21064A-233,275,300/ EV45

    +   /21066/ LCA45 (EV4 core, with EV4 FPU)

    +   /21066A-233/ LCA45 (EV4 core, but with EV45 FPU)

    +   /21164A-233,300,333/ EV5

    +   /21164A-417/ EV56

    +   /21264/ You''ll just have to wait and see...


    The EV4 core is a dual-issue (it can issue 2 instructions per CPU clock) superpipelined
    core with integer unit, floating point unit and branch prediction. It is fully
    bypassed and has 64-bit internal data paths and tightly coupled 8Kbyte caches,
    one each for Instruction and Data. The caches are write-through (they never get
    dirty).


    The EV45 core has a couple of tweaks to the EV4 core: it has a slightly improved
    floating point unit, and 16KB caches, one each for Instruction and Data (it also
    has cache parity). (Editor''s note: Neal Crook indicated in a separate mail that
    the changes to the floating point unit (FPU) improve the performance of the divider.
    The EV4 FPU divider takes 34 cycles for a single-precision divide and 63 cycles
    for a double-precision divide (non data-dependent). In contrast, the EV45 divider
    takes typically 19 cycles (34 cycles max) for single-precision and typically 29
    cycles (63 cycles max) for a double-precision division (data-dependent).)


    The EV5 core is a quad-issue core, also superpipelined, fully bypassed etc etc.
    It has tightly-coupled 8Kbyte caches, one each for I and D. These caches are write-through.
    It also has a tightly-coupled 96Kbyte on-chip second-level cache (the Scache)
    which is 3-way set associative and write-back (it can be dirty). The EV4->EV5
    performance increase is better than just the increase achieved by clock speed
    improvements. As well as the bigger caches and quad issue, there are microarchitectural
    improvements to reduce producer/consumer latencies in some paths.


    The EV56 core is fundamentally the same microarchitecture as the EV5, but it adds
    some new instructions for 8 and 16-bit loads and stores (see Section D.8 Bytes
    and all that stuff). These are primarily intended for use by device drivers. The
    EV56 core is implemented in CMOS6, which is a 2.0V process.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# **174 APPENDIX D. INTRO TO ALPHA SYSTEMS AND PROCESSORS**


    The 21064 was announced in March 1992. It uses the EV4 core, with a 128-bit bus
    interface. The bus interface supports the ''easy'' connection of an external second-level
    cache, with a block size of 256-bits (2 data beats on the bus). The Bcache timing
    is completely software configurable. The 21064 can also be configured to use a
    64-bit external bus, (but I''m not sure of any shipping system uses this mode).
    The 21064 does not impose any policy on the Bcache, but it is usually configured
    as a write-back cache. The 21064 does contain hooks to allow external hardware
    to maintain cache coherence with the Bcache and internal caches, but this is hairy.


    The 21066 uses the EV4 core and integrates a memory controller and PCI host bridge.
    To save pins, the memory controller has a 64-bit data bus (but the internal caches
    have a block size of 256 bits, just like the 21064, therefore a block fill takes
    4 beats on the bus). The memory controller supports an external Bcache and external
    DRAMs. The timing of the Bcache and DRAMs is completely software configurable,
    and can be controlled to the resolution of the CPU clock period. Having a 4-beat
    process to fill a cache block isn''t as bad as it sounds because the DRAM access
    is done in page mode. Unfortunately, the memory controller doesn''t support any
    of the new estoteric DRAMs (SDRAM, EDO or BEDO) or synchronous cache RAMs. The
    PCI bus interface is fully rev2.0 compliant and runs at up33MHz.


    The 21164 has a 128-bit data bus and supports split reads, with up32 reads outstanding
    at any time (this allows 100utilisation under best-case dream-on conditions, i.e.,
    you can theoretically transfer 128-bits of data on every bus clock). The 21164
    supports easy connection of an external 3-rd level cache (Bcache) and has all
    the hooks to allow external systems to maintain full cache coherence with all
    caches. Therefore, symmetric multiprocessor designs are ''easy''.


    The 21164A was announced in October, 1995. It uses the EV56 core. It is nominally
    pin-compatible with the 21164, but requires split power rails; all of the power
    pins that were +3.3V power on the 21164 have now been split into two groups; one
    group provided 2.0V power to the CPU core, the other group supplies 3.3V to the
    I/O cells. Unlike older implementations, the 21164 pins are not 5V-tolerant. The
    end result of this change is that 21164 systems are, in general, not upgradable
    to the 21164A (though note that it would be relatively straightforward to design
    a 21164A system that could also accommodate a 21164). The 21164A also has a couple
    of new pins to support the new 8 and 16-bit loads and stores. It also improves
    the 21164 support for using synchronous SRAMs to implement the external Bcache.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# D.4 21064 performance vs 21066 performance


    The 21064 and the 21066 have the same (EV4) CPU core. If the same program is run
    on a 21064 and a 21066, at the same CPU speed, then the difference in performance
    comes only as a result of system Beeche/memory bandwidth. Any code thread that
    has a high hit-rate on the *internal* caches will perform the same. There are
    2 big performance killers:


    +   1.  Code that is write-intensive. Even though the 21064 and the 21066 have
    write buffers to swallow some of the delays, code that is write-intensive will
    be throttled by write bandwidth at the system bus. This arises because the on-chip
    caches are write-through.

    +   2.  Code that wants to treat floats as integers. The Alpha architecture does
    not allow register-register transfers from integer registers to floating point
    registers. Such a conversion has to be done via memory (And therefore, because
    the on-chip caches are write-through, via the Beeche). (Editor’s note: it seems
    that both the EV4 and EV45 can perform the conversion through the primary data
    cache (Dcache), provided that the memory is cached already. In such a case, the
    store in the conversion sequence will update the Dcache and the subsequent load
    is, under certain circumstances, able to read the updated d-cache value, thus
    avoiding a costly roundtrip to the Beeche. In particular, it seems best to execute
    the staq/ldq or stt/ldq instructions back-to-back, which is somewhat counter-intuitive.)


    If you make the same comparison between a 21064A and a 21066A, there is an additional
    factor due to the different Icache and Dcache sizes between the two chips.


    Now, the 21164 solves both these problems: I achieve *much* higher system bus
    bandwidths (despite having the same number of signal pins - yes, I *know* it’s
    got about twice as many pins as a 21064, but all those extra ones are power and
    ground!) (yes, really!!) It has write-back caches. The only remaining problem
    is the answer to the question “how much does it cost?”'
  merge: -1
  img_proc: true
- pgno: 189
  md: '176 APPENDIX D. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    # ## D.5 A Few Notes On Clocking


    All of the current Alpha CPUs use high-speed clocks, because their microarchitectures
    have been designed as so-called short-stick designs. None of the system busses
    have to run at horrendous speeds as a result though:


    +   - on the 21066(A), 21064(A), 21164 the off-chip cache (Beache) timing is completely
    programmable, to the resolution of the CPU clock. For example, on a 275MHz CPU,
    the Beache read access time can be controller with a resolution of 3.6ns

    +   - on the 21066(A), the DRAM timing is completely programmable, to the resolution
    of the CPU clock (*not* the PCI clock, the CPU clock).

    +   - on the 21064(A), 21164(A), the system bus frequency is a sub-multiple of
    the CPU clock frequency. Most of the 21064 motherboards use a 33MHz system bus
    clock.

    +   - Systems that use the 21066 can run the PCI at any frequency relative to
    the CPU. Generally, the PCI runs at 33MHz.

    +   - Systems that use the APECS chipset (see Section D.6) always have their CPU
    system bus equal to their PCI bus frequency. This means that both busses tends
    to run at either 25MHz or 33MHz (since these are the frequencies that scale up
    to match the CPU frequencies). On APECS systems, the DRAM controller timings are
    software programmable in terms of the CPU system bus frequency


    *Aside:* someone suggested that they were getting bad performance on a 21066 because
    the 21066 memory controller was only running at 33MHz. Actually, it’s the superfast
    21064A systems that have memory controllers that ‘only’ run at 33MHz.


    # ## D.6 The chip-sets


    DS sells two CPU support chipsets. The 2107x chipset (aka APECS) is a 21064(A)
    support chipset. The 2117x chipset (aka ALCOR) is a 21164 support chipset. There
    will also be 2117xA chipset (aka ALCOR 2) as a 21164A support chipset.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Both chipsets provide memory controllers and PCI host bridges for their CPU.
    APECS provides a 32-bit PCI host bridge, ALCOR provides a 64-bit PCI host bridge
    which (in accordance with the requirements of the PCI spec) can support both 32-bit
    and 64-bit PCI devices.


    APECS consists of 6, 208-pin chips (4, 32-bit data slices (DECATE), 1 system controller
    (COMANCHE, CIA) 1 PCI controller (EPIC)). It provides a DRAM controller (128-bit
    memory bus) and a PCI interface. It also does all the work to maintain memory
    coherence when a PCI device DMAs into (or out of) memory.


    ALCOR consists of 5 chips (4, 64-bit data slices (Data Switch, DSW) - 208-pin
    PQFP and 1 control (Control, I/O Address, CIA) - a 433 pin plastic PGA). It provides
    a DRAM controller (256-bit memory bus) and a PCI interface. It also does all the
    work required to support an external Beache and to maintain memory coherence when
    a PCI device DMAs into (or out of) memory.


    There is no support chipset for the 21066, since the memory controller and PCI
    host bridge functionality are integrated onto the chip.


    # ## D.7 The Systems


    The applications engineering group in DS produces example designs using the CPUs
    and support chipsets. These are typically PC-AT size motherboards, with all the
    functionality that you''d typically find on a high-end Pentium motherboard. Originally,
    these example designs were intended to be used as starting points for third-parties
    to produce motherboard designs from. These first-generation designs were called
    Evaluation Boards (EBs). As the amount of engineering required to build a motherboard
    has increased (due to higher-speed clocks and the need to meet RF emission and
    susceptibility regulations) the emphasis has shifted towards providing motherboards
    that are suitable for volume manufacture.


    Digital''s systems groups have produced several generations of machines using
    Alpha processors. Some of these systems use support logic that is designed by
    the systems groups, and some use commodity chipsets from DS. In some cases, systems
    use a combination of both.


    Various third-parties build systems using Alpha processors. Some of these companies
    design systems from scratch, and others use DS support chipsets,'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'clone/modify DS example designs or simply package systems using build and tested
    boards from DS.


