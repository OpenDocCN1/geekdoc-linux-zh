    # ## G.2 Support Questions


    Technical support is a black art: in most cases, support technicians rely solely
    on communication with the customer to solve installation problems on hardware
    the technicians have never physically seen. It is extremely important, therefore,
    to state your question clearly and concisely, including detailed information such
    as:


    +   - symptoms of the problem ("Red Hat Linux 4.1 doesn''t recognize my CD-ROM
    drive.")


    +   - when the problem began ("It stopped working yesterday ...")


    +   - what changes you have made to your system around the time of the problem
    ("... after I disconnected it from the IDE controller.")


    +   - any diagnostic output specifically related to the problem ("In the bootup
    messages, it says ''Cannot find /dev/hdb; device disconnected.''") however, this
    can be taken overboard; don''t send us your system logs unless we ask you for
    them.


    +   - other relevant information ("I''m using the floppy installation method,
    from the CD.")


    # ### G.2.1 How to Send Them


    Red Hat''s support system is email-based and is partially automated; for this
    reason, it is important to make sure you send support questions in the correct
    format, so that your message will be recognized and routed to an appropriate support
    technician. In order to receive technical support for your Red Hat Software product,
    you must first register it.


    For each new problem you need support for, the support system opens a support
    ticket. To open a support ticket, all you need to do is send the support system
    a message with a Subject: of [registration #nnnnnn].'
