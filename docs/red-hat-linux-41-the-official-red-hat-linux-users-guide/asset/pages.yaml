- pgno: 10
  md: '# # Preface


    # ## What is Red Hat Linux?


    Red Hat Linux is a complete operating system based on the Linux kernel, which
    was originally created by Linus Torvalds. Linux continues to be developed by a
    worldwide team, led by Linus, working over the Internet and is still evolving
    forward rapidly. The currently stable 2.0.x kernel (on which Red Hat Linux 4.1
    is based) demonstrates the remarkable talent and creativity of the Linux development
    community as well as the value of the cooperative development model. Please see
    Appendix H, Red Hat and Freely Distributable Software, for more on this subject.


    Since the release of version 4.0, Red Hat Linux runs on three leading computing
    platforms: Intel compatibles PCs, Digital Alpha computers, and Sun SPARC equipment.
    Our unified source tree and the benefits of RPM (Red Hat Package Management) technology
    enable us to keep Red Hat Linux releases for these three platforms concurrent,
    which in turn enables our users to manage and port software between these platforms
    with minimum effort.


    We are pleased to note the growing number of applications being made available
    on the Linux operating system, several of these from Red Hat Software. We make
    our versions of the Linux OS available by unrestricted FTP from our site and many
    mirror sites on the Internet. Red Hat Linux is also available on CD-ROM. For current
    information on our product offerings and links to other Linux resources please
    check Red Hat Software’s web site at http://www.redhat.com.


    On most systems, Red Hat Linux is easy to install: the installation program'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'can walk you through the process in as little as 15 minutes. The system itself
    is very flexible: you can install and uninstall individual software “packages”
    with only a few mouse clicks. It is easy to maintain: package installations can
    be verified and corrected, and packages can be installed and uninstalled simply
    and reliably. Furthermore, Red Hat Linux is easy to administer: a set of graphical
    administration tools bundled into a “control-panel” reduce the hassle of everyday
    system administration. Complete source code is provided for the freely distributable
    components of the system.


    # ## An Overview of This Book


    This manual is organized in the following fashion:


    +   Chapter 1, Quick Start contains enough information for experienced users to
    perform a basic installation of Red Hat Linux/Intel without much trouble. We recommend
    that new Linux users read through the manual before installing to get a good understanding
    of the system.


    +   Chapter 2, Installing Red Hat Linux/Intel contains detailed instructions for
    installing Red Hat Linux on an Intel or compatible PC.


    +   Chapter 3, Installing Red Hat Linux/Alpha contains instructions for installing
    Red Hat Linux on a Digital Alpha.


    +   Chapter 4, Installing Red Hat Linux/SPARC contains instructions for installing
    Red Hat Linux on a Sun SPARC machine.


    +   Chapters 5 – 10 explain how to configure various services once you have installed
    Red Hat Linux, how to find documentation on your system, and how to use the various
    system management and administration tools which accompany Red Hat Linux. They
    also include an explanation of what’s special about your Red hat Linux system,
    including where special files live and how to shut down Red Hat Linux.


    +   Appendices contain extra information about Red Hat Linux, including a list
    of hardware requirements, a manual for the MetroLink X server included with Red
    Hat Linux/Intel, the Red Hat Linux Frequently Asked Questions (FAQ), and instructions
    on obtaining technical support.'
  merge: -1
  img_proc: true
