- pgno: 66
  md: '# Chapter 5


    # Post Installation Configuration


    After installation your system is fully functional, but you may still want

    to do some additional configuration. This chapter describes some of the

    various system configuration tasks you may need to do.


    # 5.1 Building a Custom Kernel


    With the introduction of modularization in the Linux 2.0.x kernel there

    have been some significant changes in building customized kernels. In the

    past you were required to compile support into your kernel if you wanted to

    access a particular hardware or filesystem component. For some hardware

    configurations the size of the kernel could quickly reach a critical level.

    To require ready support for items that were only occasionally used was

    an inefficient use of system resources. With the capabilities of the 2.0.x

    kernel, if there are certain hardware components or filesystems that are

    used infrequently, driver modules for them can be loaded on demand. For

    information on handling kernel modules see Chapter 8, Section 8.6.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 5.1.1 Building a modularized kernel


    Only Red Hat Linux/Intel and Red Hat Linux/SPARC support modular kernels; Red
    Hat Linux/Alpha users must build a monolithic kernel (see Section 5.1.3 below).


    These instructions provide you with the knowledge required to take advantage of
    the power and flexibility available through kernel modularization. If you do not
    wish to take advantage of modularization, please see Section 5.1.3 for an explanation
    of the different aspects of building and installing a monolithic kernel. It is
    assumed that the **kernel-source** package has been previously installed and all
    commands are issued in the directory *usr/src/linux*.


    It is important to begin a kernel build with the source tree in a known condition.
    Therefore, it is recommended that you begin with the command **make mrproper**.
    This will remove any configuration files along with the remains of any previous
    builds that may be scattered around the source tree. Now you must create a configuration
    file that will determine which components to include in your new kernel. Depending
    upon your hardware and personal preferences there are three methods available
    to configure the kernel.


    +   - **make config** An interactive text program. Components are presented and
    you answer with **Y** (yes), **N** (no), or **M** (module).

    +   - **make menuconfig** A graphic, menu driven program. Components are presented
    in a menu of categories, you select the desired components in the same manner
    used in the Red Hat Linux installation program. Toggle the tag corresponding to
    the item you want included; **Y** (yes), **N** (no), or **M** (module).

    +   - **make xconfig** An X Windows program. Components are listed in different
    levels of menus, components are selected using a mouse. Again, select **Y** (yes),
    **N** (no), or **M** (module).


    In order to use **kernel** (see Section 8.6 for details) and kernel modules you
    must answer **Yes** to **kernel support** and **module version (CONFIG_MODVERSIONS)**
    support in the configuration. If you want to build a kernel with a configuration
    file (*usr/src/linux/.config*) that you have already created with one of the above
    methods, you can omit'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'the make mrproper and make config commands and use the command make dep followed
    by make clean to prepare the source tree for the build.


    The next step consists of the actual compilation of the source code components
    into a working program that your machine can use to boot. The method described
    here is the easiest to recover from in the event of a mishap. If you are interested
    in other possibilities details can be found in the Kernel-HOWTO or in the Makefile
    in /usr/src/linux on your Linux system.


    +   * Build the kernel with make boot.


    +   * Build any modules you configured with make modules.


    +   * Move the old set of modules out of the way with:


    ```

    ```bash

    rm -rf /lib/modules/2.0.27-old

    mv /lib/modules/2.0.27 /lib/modules/2.0.27-old

    ```

    ```


    Of course, if you have upgraded your kernel, replace 2.0.27 with the version you
    are using.


    +   * Install the new modules (even if you didn''t build any) with make modules_install.


    If you have a SCSI adapter and made your SCSI driver modular, build a new initrd
    image (see Section 5.1.2). Note that there are few practical reasons to make the
    SCSI driver modular in a custom kernel.


    In order to provide a redundant boot source to protect from a possible error in
    a new kernel you should keep the original kernel available. Adding a kernel to
    the LILO menu is as simple as renaming the original kernel in /boot, copying the
    new kernel to /boot, adding a few lines in /etc/lilo.conf and running /sbin/lilo.
    Here is an example of the default /etc/lilo.conf file shipped with Red Hat Linux:


    ```

    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    image=/boot/vmlinuz

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 69
  md: "```\nlabel=linux\nroot=/dev/hda1\nread-only\n```\n\nNow you must update /etc/lilo.conf.\
    \ If you built a new initrd image you must tell LILO to use it. In this example\
    \ of /etc/lilo.conf we have added four lines at the bottom of the file to indicate\
    \ another kernel to boot from. We have renamed /boot/vmlinuz to /boot/vmlinuz.old\
    \ and changed its label to “old”. We have also added an initrd line for the new\
    \ kernel:\n\n```\nboot=/dev/hda\nmap=/boot/map\ninstall=/boot/boot.b\nprompt\n\
    timeout=100\nimage=/boot/vmlinuz\n\tlabel=linux\n\tinitrd=/boot/initrd\n\troot=/dev/hda1\n\
    \tread-only\nimage=/boot/vmlinuz.old\n\tlabel=old\n\troot=/dev/hda1\n\tread-only\n\
    ```\n\nNow when the system boots and you press Tab at the LILO boot: prompt two\
