- pgno: 196
  md: '# Appendix E


    # Alpha Miniloader Howto


    This document describes the Miniloader, a program for Alpha based systems that
    can be used to initialize the machine and load Linux. The Alpha Linux Miniloader
    (to give it it''s full name) is also known as Milo.


    # E.1 Introduction


    This document describes the Miniloader for Linux on Alpha AXP (Milo). This firmware
    is used to initialize Alpha AXP based systems, load and start Linux and, finally,
    provide PALCode for Linux.


    # E.1.1 Copyright


    The Alpha Miniloader (Milo) HOWTO is Copyright ©1995, 1996 David A Rusing.


    > **Copyright** Like all Linux HOWTO documents, it may be reproduced and distributed
    in whole or in part, in any medium, physical or electronic, so long as this copyright
    notice is retained on all copies. Commercial redistribution is allowed and encouraged;
    however the author would *like* to be notified of such distributions. You may
    translate this HOWTO into any language whatsoever provided that *you leave this
    copyright statement and*'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'disclaimer intact, and that you append a notice stating who translated the
    document.


    **Disclaimer** While I have tried to include the most correct and up to date information
    available to me, I cannot guarantee that usage of information in this document
    does not result in loss of data or equipment. I provide NO WARRANTY about the
    information in the HOWTO and I cannot be made liable for any consequences resulting
    from using the information in this HOWTO.


    # E.1.2 New Versions of this Document


    The latest version of this document can be found in `ftp://gatekeeper.dec.com/pub/`
    and David Mosberger-Tang is kind enough to include the html form of it in his
    excellent Linux Alpha FAQ site `http://www.azstarnet.com/~explinux`.


    # E.2 What is Milo?


    On Intel based PC systems, the BIOS firmware sets up the system and then loads
    the image to be run from the boot block of a DOS file system. This is more or
    less what Milo does on an Alpha based system, however there are several interesting
    differences between BIOS firmware and Milo, not least of which is that Milo includes
    and uses standard Linux device drivers unmodified. Milo is firmware, unlike LILo,
    which relies on the BIOS firmware to get itself loaded. The main functional parts
    of Milo are:


    +   1. PALCode,

    +   2. Memory set up code (builds page tables and turns on virtual addressing),

    +   3. Video code (BIOS emulation code and TGA (21030)),

    +   4. Linux kernel code. This includes real Linux kernel code (for example, the
    interrupt handling) and ersatz or mock Linux kernel,

    +   5. Linux block device drivers (for example, the floppy driver),

    +   6. File system support (ext2, MS-DOS and ISO9660),'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   7. User inteface code (MILO),

    +   8. Kernel interface code (sets up the HWRPB and memory map for linux),

    +   9. NVRAM code for managing environment variables.


    The following paragraphs describe these functional parts in more detail.


    PALCode can be thought of as a tiny software layer that tailors the chip to a
    particular operating system. It runs in a special mode (PALmode) which has certain
    restrictions but it uses the standard Alpha instruction set with just five extra
    instructions. In this way, the Alpha chip can run such diverse operating systems
    as Windows NT, OpenVMS, Digital Unix and, of course, Linux. The PALCode that Milo
    uses (and therefore Linux itself) is, like the rest of Milo, freeware. It is derived
    from Digital''s Evaluation Board software example Digital Unix PALCode.. The differences
    between the different PALCodes are because of differences in address mapping and
    interrupt handling that exist between the Alpha chips (21066 based systems have
    a different I/O map to 21064+2107x systems) and different Alpha based systems.


    For Milo to operate properly it needs to know what memory is available, where
    Linux will eventually be running from and it must be able to allocate temporary
    memory for the Linux device drivers. The code maintains a memory map that has
    entries for permanent and temporary allocated pages. As it boots, Milo decompresses
    itself into the correct place in physical memory. When it passes control to the
    Linux kernel, it reserves memory for the compressed version of itself, the PALCode
    (which the kernel needs) and some data structures. This leaves most of the memory
    in the system for Linux itself.


    The final act of the memory code is to set up and turn on virtual addressing so
    that the data structures that Linux expects to see are at the correct place in
    virtual memory.


    Milo contains video code that initialises and uses the video device for the system.
    It will detect and use a VGA device if there is one, otherwise it will try to
    use a TGA (21030) video device. Failing that, it will assume that there is no
    graphics device. The BIOS emulation that the standard, pre-built, images include
    is Digital''s own BIOS emulation which supports most, if not all, of the standard
    graphics devices available.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Linux device drivers live within the kernel and expect certain services from
    the kernel. Some of these services are provided directly by Linux kernel code,
    for example the interrupt handling and some is provided by kernel look-alike runtimes.


    Milo’s most powerful feature is that you can embed unaltered Linux device drivers
    into it. This gives it the potential to support every device that Linux does.
    Milo includes all of the block devices that are configured into the Linux kernel
    that it is built against, as well as a lot of the block device code (for example,
    ll_rw_blk().)


    Milo loads the Linux kernel from real file systems rather than from boot blocks
    and other strange places. It understands MSDOS, EXT2 and ISO9660 file systems.
    Gzip’ d files are supported and these are recommended, particularly if you are
    loading from floppy which is rather slow. Milo recognises these by their .gz suffix.


    Built into Milo is a simple keyboard driver which, together with an equally simple
    video driver allows it to have a simple user interface. That interface allows
    you to list file systems on configured devices, boot Linux or run flash update
    utilities and set environment variables that control the system’s booting. Like
    LILO, you can pass arguments to the Kernel.


    Milo must tell the Linux kernel what sort of system this is, how much memory there
    is and which of that memory is free. It does this using the HWRPB (Hardware Restart
    Parameter Block) data structure and associated memory cluster descriptions. These
    are placed at the appropriate place in virtual memory just before control is passed
    to the Linux kernel.


    # ## E.3 Pre-Built Standard Milo Images


    If you are planning to run Linux on a standard Alpha based system, then there
    are pre-built “standard” Milo images that you might use. These (along with the
    sources and other interesting stuff) can be found in url url="ftp://gatekeeper.dec.com/pub/Digital/Linux-Alpha/MiniLoader".


    The images subdirectory contains a directory per standard system (eg AlphaPC64)
    with Milo images having the following naming convention:


    +   1. milo - Miniloader executable image, this image can be loaded in a variety
    of ways,'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   2. \textbf{fmu.gz} - Flash management utility,

    +   3. \textbf{milo.dd} - Boot block floppy disk image. These should be written
    using \textbf{rawrite.exe} or \textbf{dd} on Linux.


    The \textbf{test-images}, like the \textbf{images} subdirectory contains a directory
    per standard system. These images are somewhat experimental but tend to contain
    all the latest features.


    # E.4 How To Build Milo


    You build Milo seperately from the \textbf{kernel}. As Milo requires parts of
    the kernel to function (for example interrupt handling) you must first configure
    and build the kernel that matches with Milo that you want to build. Mostly this
    means building the kernel with the same version number. So, \textbf{milo-1.3.76.tgz}
    will build against \textbf{linux-1.3.76.tar.gz}. Milo \textbf{may} build against
    a higher version of the \textbf{kernel}, but there again it may not. In the remainder
    of this discussion, I assume that your kernel sources and object files are stored
    in the subtree at \textbf{/usr/src/linux}.


    To build Milo, change your working directory to the \textbf{milo} source directory
    and invoke \textbf{make} with:


    ```

    make KSrc=/usr/src/linux config

    ```


    Just like the Linux kernel, you will be asked a series of questions


    Echo output to the serial port (MINI\_SERIAL\_ECHO) [y]


    It’s a good idea to echo kernel printk to /dev/ttyS0 if you can. If you can (and
    want to), then type "y", otherwise "n".


    Use Digital’s BIOS emulation code (not free) (MINI\_DIGITAL\_BIOS\_EMU) [y]


    This code is included as a library which is freely distributable so long as it
    is used on an Alpha based system. The sources are not available. If you answer
    "n" then the freeware alternative BIOS emulation will be built. It’s sources are
    included with Milo.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# E.5 How To Load Milo


    The most commonly supported method of loading Milo is from the Windows NT ARC
    firmware as most shipping systems support this. However, there are a wide variety
    of loading Milo. It may be loaded from:


    +   - a failsafe boot block floppy,

    +   - the Windows NT ARC firmware,

    +   - Digital’s SRM console,

    +   - an Alpha Evaluation Board Debug Monitor,

    +   - flash/ROM.


    # E.5.1 Loading Milo from the Windows NT ARC firmware


    Most, if not all, Alpha AXP based systems include the Windows NT ARC firmware
    and this is the preferred method of booting Milo thus Linux. Once the Windows
    NT firmware is running and you have the correct Milo image for your system, this
    method is completely generic.


    The Windows NT ARC firmware is an environment in which programs can run and make
    callbacks into the firmware to perform actions. The Windows NT OSLoader is a program
    that does exactly this. Linload.exe is a much simpler program which does just
    enough to load and execute Milo. It loads the appropriate image file into memory
    at 0x00000000 and then makes a swap-PAL PALCall to it. Milo, like Linux, uses
    a different PALCode to Windows NT which is why the swap has to happen. Milo relocates
    itself to 0x200000 and continues on through the PALCode reset entry point as before.


    Before you add a Linux boot option, you will need to copy linload.exe and the
    appropriate Milo that you wish to load to someplace that the Windows NT ARC firmware
    can read from. In the following example, I assume that you are booting from a
    DOS format floppy disk:


    +   1. At the boot menu, select Supplementary menu...

    +   2. At the Supplementary menu, select Set up the system...'
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   3. At the Setup menu, select Manage boot selection menu...

    +   4. In the Boot selections menu, choose Add a boot selection

    +   5. Choose Floppy Disk 0

    +   6. Enter \nlinload.exe as the osloader directory and name

    +   7. Say "yes" to the operating system being on the same partition as the osloader

    +   8. Enter "/" as the operating system root directory

    +   9. I usually enter "Linux" as the name for this boot selection

    +   10. Say "No" you do not want to initialise the debugger at boot time

    +   11. You should now be back in the Boot selections menu, choose the Change
    a boot selection option and pick the selection you just created as the one to
    edit

    +   12. Use down arrow \downarrow to get OSLOADFILENAME up and then type in the
    name of the Milo image that you wish to use, for example noname.arc Return

    +   13. Press Esc to get back to the Boot Selections menu

    +   14. Choose Setup Menu (or hit Esc again) and choose Supplementary menu, and
    save changes option

    +   15. Esc will get you back to the Boot menu and you can attempt to boot Milo.
    If you do not want Linux as the first boot option, then you can alter the order
    of the boot options in the Boot selections menu.


    At the end of all this, you should have a boot selection that looks something
    like:


    ```

    LOADIDENTIFIER=Linux

    SYSEMPARTITION=muli(0)disk(0)fdisk(0)

    OSLOADER=muli(0)disk(0)fdisk(0)\nlinload.exe

    OSLOADPARTITION=muli(0)disk(0)fdisk(0)

    OSLOADFILENAME=\noname.arc

    OSLOADOPTIONS=

    ```'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'You can now boot Milo (and then Linux). You can load linload.exe and Milo directly
    from a file system that Windows NT understands such as NTFS or DOS on a hard disk.
    The contents **OSLOADOPTIONS** are passed to Milo which interprets it as a command.
    So, in order to boot Linux directly from Windows NT without pausing in Milo, you
    could pass the following in **OSLOADOPTIONS**:


    ```

    boot sda2:vmlinux.gz root=/dev/sda2

    ```


    See section E.6 *Milo’s User Interface* for more information on the commands available.


    Another (rather sneaky) way of loading of loading Milo via the WNT ARC firmware
    is to put Milo onto an MS-DOS floppy and call it *fwupdate.exe* and then choose
    the “Upgrade Firmware” option.


    # E.5.2 Loading Milo from the Evaluation Board Debug Monitor


    Evaluation boards (and often designs cloned from them) include support for the
    Alpha Evaluation Board Debug Monitor. Consult your system document before considering
    this method of booting Milo. The following systems are *known* to include Debug
    Monitor support:


    +   - AlphaPC64 (Section E.5.6)

    +   - EB64+ (Section E.5.6)

    +   - EB66+ (Section E.5.6)

    +   - EB164 (Section E.5.6)


    Before you consider this method, you should note that the early versions of the
    Evaluation Board Debug Monitor did not include video or keyboard drivers and so
    you must be prepared to connect another system via the serial port so that you
    can use the Debug Monitor. Its interface is very simple and typing help shows
    a whole heap of commands. The ones that are most interesting include the word
    *boot* or *load* in them.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'The Evaluation Board Debug Monitor can load an image either via the network
    (netboot) or via a floppy (floppy). In either case, set the boot address to 0x2000000
    (bootadr 2000000) before booting the image.


    If the image is on floppy (and note that only DOS formatted floppies are supported),
    then you will need to type the following command:


    ```

    AlphaPC64> f1boot <Milo-image-name>

    ```


    # E.5.3 Loading Milo from a Failsafe Boot Block Floppy


    Only the AxpPCI33 is known to include failsafe boot block floppy support (Section
    E.5.6 Noname).


    If you do not have a standard pre-built Milo .dd image, then you may need to build
    an SRM boot block floppy. Once you have built Milo, you need to do the following
    on Digital Unix box:


    ```

    ```bash

    fdisk -fmt /dev/rfd0a

    cat mboot bootm > /dev/rfd0a

    disklabel -rw rfd0a `rx23'' mboot bootm

    ```

    ```


    Or on a Linux box:


    ```

    ```bash

    cat mboot bootm > /dev/fd0

    ```

    ```


    If you have a standard Milo image available (say milo.dd) then you would build
    a boot block floppy using the following command:


    ```

    ```bash

    dd if=milo.dd of=/dev/fd0

    ```

    ```


    # E.5.4 Loading Milo from Flash


    There are a number of systems where Milo can be blown into flash and booted directly
    (instead of via the Windows NT ARC firmware):


    +   * AlphaPC64 (Section E.5.6'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   ● Noname (Section E.5.6)

    +   ● EB66+ (Section E.5.6)

    +   ● EB164 (Section E.5.6)


    # E.5.5 Loading Milo from the SRM Console


    The SRM (short for System Reference Manual) Console knows nothing about filesystems
    or disk-partitions, it simply expects that the secondary bootstraps loader occupies
    a consecutive range of physical disk sectors starting from a given offset. The
    information describing the secondary bootstrap loader (its size and offset) is
    given in the first 512 byte block. To load Milo via the SRM you must generate
    that structure on a device which the SRM can access (such as a floppy disk). This
    is what mboot and boom, mboot is the first block (or boot description) and boom
    is the Milo image rounded up to a 512 byte boundary.


    To load Milo from a boot block device, either build mboot and boom and push them
    onto the boot device using the following command:


    ```

    $ cat mboot boom > /dev/fd0

    ```


    Or, grab the appropriate milo.dd from a web site and write it onto the boot device
    using either RAWRITE.EXE or dd.


    Once you have done that you can boot the SRM console and use one of its many commands
    to boot Milo. For example, to boot Milo from a boot block floppy you would use
    the following command:


    ```

    >>boot dva0

    (boot dva0.0.0.0.1 -flags 0)

    block 0 of dva0.0.0.0.1 is a valid boot block

    reading 621 blocks from dva0.0.0.0.1

    bootstrap code read in

    base = 112000, image_start = 0, image_bytes = 4da00

    initializing HWRPB at 2000

    initializing page table at 104000

    initializing machine state

    setting affinity to the primary CPU

    jumping to bootstrap code

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: '```

    Milo Stub: V1.1

    Unzipping Milo into position

    Allocating memory for unzip

    ####...

    ```


    The following systems are _known_ to have SRM Console support:


    +   - Noname (Section E.5.6)

    +   - AlphaPC64 (Section E.5.6)

    +   - EB164 (Section E.5.6)


    # E.5.6  System Specific Information


    # AxpPCI33 (Noname)


    The Noname board can load Milo from the Windows NT ARC firmware (Section E.5.1
    booting from Windows NT ARC firmware), from the SRM Console (Section E.5.5 Loading
    Milo from the SRM Console), and from a failsafe boot block floppy (Section E.5.3
    Loading from a Failsafe Boot Block Floppy). A flash management utility, runnable
    from Milo is available so that once Milo is running, it can be blown into flash
    (Section E.7 running the flash management utility). However, be warned that once
    you have done this you will lose the previous image held there as there is only
    room for one image.


    The way that Noname boots is controlled by a set of jumpers on the board, J29
    and J28. These look like:


    ```

    4

    J29 2 x x x 6

    1 x x x 5


    J28 2 x x 6

    1 x x x 5

    3

    ```


    The two options that we’re interested in are J28, pins 1-3 which boots the console/loader
    from flash and J29, pins 1-3 which boots the console/loader'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'from a boot block floppy. The second option is the one that you need to first
    boot Milo on the Nname board.


    Once you''ve selected the boot from floppy option via the jumpers, put the SRM
    boot block floppy containing Milo into the floppy and reboot. In a few seconds
    (after the floppy light goes out) you should see the screen blank to white and
    Milo telling you what''s going on).


    If you are really interested in technical stuff, the Nname loads images off of
    the floppy into physical address 0x104000 and images from flash into 0x100000.
    For this reason, Milo is built with it''s PALcode starting at 0x200000. When it
    is first loaded, it moves itself to the correct location (see relocate.S).


    # AlphaPC64 (Cabriolel)


    The AlphaPC64 includes the Windows NT ARC firmware (Section E.5.1), the SRM Console
    (Section E.5.5) and the Evaluation Debug Monitor (Section E.5.2 Loading from the
    Debug Monitor). These images are in flash and there is room to add Milo so that
    you can boot Milo directly from flash. A flash management utility, runnable from
    Milo is available so that once Milo is running, it can be blown into flash (Section
    E.7 running the flash management utility). This system supports Milo environment
    variables.


    You select between the boot options (and Milo when it is been put into flash)
    using a combination of jumpers and a boot option which is saved in the NVRAM of
    the TOY clock.


    The jumper is J2, SP bits 6 and 7 have the following meanings: itemize itemSP
    bit 6 should always be out. If this jumper is set then the SROM mini-debugger
    gets booted, itemSP bit 7 in is boot image selected by the boot option byte in
    the TOY clock, itemSP bit 7 out is boot first image in flash. /itemize


    So, with bit 7 out, the Debug Monitor will be booted as it is always the first
    image in flash. With bit 7 in, the image selected by the boot option in the TOY
    clock will be selected. The Debug Monitor, the Windows NT ARC firmware and Milo
    all support setting this boot option byte but you must be very careful using it.
    In particular, you cannot set the boot option so that next time the system boots
    Milo when you are running the Windows NT ARC firmware, it only allows you to set
    Debug Monitor or Windows'
