- pgno: 14
  md: '# # Chapter 1

    # Quick Start


    This chapter summarizes how to install or upgrade Red Hat Linux/Intel; it is intended
    for users who are already experienced at installing Linux. If this chapter does
    not provide enough information, please read Chapter 2, *Installing Red Hat Linux/Intel*.


    # ## 1.1 The Red Hat Linux Errata


    Occasionally, we discover problems with a release of Red Hat Linux, some of which
    may affect installation. When we discover a problem, we post information about
    the problem and our solution in the Red Hat Linux Errata, which we make available
    in several ways:


    +   - via the World Wide Web: `http://www.redhat.com/errata`

    +   - via electronic mail: `errata@redhat.com`


    Please note that the solution to a problem listed in the Errata may require that
    you use a different boot or install disk image than the ones which are mentioned
    below or which come with your Red Hat Linux CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# ## 1.2 Getting Red Hat Linux


    There are several ways to get Red Hat Linux; the easiest way is on CD-ROM. This
    may not be practical if you don''t have a CD-ROM drive, so we have made it freely
    available via FTP; you can download it from any of the Red Hat mirrors listed
    in Appendix F, *Red Hat Linux FAQ*.


    These mirror sites are provided for those who want to install via FTP or want
    package upgrades. It is possible to download the distribution to a hard drive
    and install from there, but this is highly impractical for most and is beyond
    the scope of this document.


    To purchase Red Hat Linux on CD-ROM, please contact Red Hat Software via any of
    the means listed in Appendix F.


    # ## 1.3 Making Floppies


    If you have the boot and supplemental diskettes shipped with Official Red Hat
    Linux 4.1, please skip to Section 1.4 below.


    If your version of Red Hat Linux/Intel did not include a boot diskette and supplemental
    diskette, you need to create them. If there is a README file on your CD-ROM (or
    on the FTP site), please read it now; it contains the latest information on Red
    Hat Linux 4.1, some of which may be different from what you are about to read.


    The boot and supplemental disk images are in the **images** directory on the CD-ROM
    and the FTP site. If you are doing a CD-ROM or NFS installation you will only
    need to make a boot diskette. All other installation methods require the supplemental
    diskette as well. You can use *dd* under Linux or *rawrite.exe* (found in the
    *dosutil* directory) under DOS to write each disk image file to a formatted high
    density (1.44 MB) 3.5 inch floppy.


    # ## 1.4 Installing


    To install Red Hat Linux, insert the boot floppy into drive A, and insert the
    CD into your CD-ROM drive (for a CD-ROM install) or connect to'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'your network (for an FTP or NFS install). Then reboot your machine and answer
    all questions as they are presented. If you are installing from PCMCIA, FTP or
    Hard Disk, insert the supplemental disk when prompted.


    # ## 1.5 Upgrading from a Prior Version


    The installation process for Red Hat Linux 4.1 includes the ability to up- grade
    from prior versions of Red Hat Linux (2.0, 2.1, 3.0.3, and 4.0) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages which are installed on your machine.
    The upgrade process preserves existing configuration files using a `.rpmsave`
    extension (e.g., `sendmail.cf.rpmsave`) and leaves a log telling what actions
    it took in `/tmp/upgrade.log`. As software evolves, con- figuration file formats
    can change, so you should carefully compare your original configuration files
    to the new files before integrating your changes.


    To upgrade a Red Hat Linux system, you must use a boot floppy (and pos- sibly
    a supplemental floppy), just as if you were performing a full install. After selecting
    the medium to install from (and setting up networking in- formation if it''s required),
    the installation procedure prompts you to either **Install** or **Upgrade**; select
    **Upgrade**. This upgrade procedure is the func- tional equivalent of running
    the `upgrade` script in prior versions of Red Hat Linux.


    Please note that some upgraded packages may “depend” on other packages which may
    not be installed on your system. The upgrade procedure takes care of these *dependencies*,
    but it may need to install additional packages in order to satisfy them.


    # ## 1.6 Running Directly off the CD-ROM


    Prior versions of Red Hat Linux came with a “live filesystem” on the CD- ROM;
    this allowed users to run Red Hat Linux directly off the CD-ROM without first
    installing it on their hard drive.


    Unfortunately, with the modular Linux-2.0.x kernel, adding “live” boot ca- pabilities
    has become too complex and is no longer supported. We apologize for the inconvenience.'
  merge: -1
  img_proc: true
