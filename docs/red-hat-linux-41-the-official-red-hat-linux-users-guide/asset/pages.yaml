    \ You can then do an FTP install from a server near you, or you can do an NFS,\
    \ hard drive, or CD-ROM install if you choose.\n\n# 4.5 Installation Using a Serial\
    \ Terminal\n\nYou can also install Red Hat Linux/SPARC 4.1 using a serial terminal:\
    \ any terminal which emulates a VT100 ought to work fine. Boot from the floppy,\
    \ and at the SILO prompt enter:\n\n```\nlinux serial\n```\n\nThe installation\
    \ program runs on the first serial port at 9600,8,N,1 (9600 baud, 8 bits, no parity,\
    \ 1 stop bit). The installation program can run in color, if your serial terminal\
    \ supports color.\n\nAt any prompt dialog during a serial installation (any dialog\
    \ with an OK button), you can press Ctrl + Z to start a subshell; to return to\
    \ the installation program, enter exit at the shell prompt.\n\n**Important!**\
    \ After installing using a serial terminal, the only way to log into your Red\
    \ Hat Linux system is via the network; however, the `/etc/security` file keeps\
    \ the root user from logging in from the network. When the serial install is completed,\
    \ but before you reboot your machine, press Ctrl + Z to start a subshell and enter\
    \ the following command:\n\n```\nrm /mnt/etc/security\n```\n\nIf you fail perform\
    \ this step, you will not be able to log into your machine."
