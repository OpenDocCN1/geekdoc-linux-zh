- pgno: 63
  md: '# ## 4.6 Installation: Selecting System Components


    (For an explanation of system components, please see Chapter 2, Section 2.4.11.)


    **Important!** When selecting system components to install for Red Hat Linux/SPARC,
    choosing to install **Everything** without choosing **Select individual packages**
    could result in an unbootable Red Hat Linux system.


    The last kernel to be installed will be a multi-processor kernel, which will fail
    to work on uniproc machines. Additionally, the default X server will end up as
    **XsunMono**, which may not work for most people. If you do wish to install **Everything**,
    choose **Select individual packages** as well. Then, deselect all the kernels
    except for one you wish to install (**kernel-sparc** works for most) and all X
    servers except the one for your hardware (XsunMono for lwtwo video cards, **Xsun**
    for all 8-bit displays, and **Xsun24** for the supported 24-bit displays).


    # ## 4.7 SILO Configuration


    SILO configuration is nearly identical to LILO configuration, see section 2.4.18
    for details.


    # ## 4.8 Partitioning


    There is one additional step in partitioning a hard drive for a SPARC. You must
    create the third partition of every disk as type **Whole Disk** spanning from
    cylinder 0 to the end of the disk. It shouldn''t be touched, but should exist.
    You can still create other partitions just as you normally would.


    # ## 4.9 X Windows


    There is no mouse or X windows config on the SPARC. The 8 bit server is installed
    by default. If you want to use the 24 bit server (for TCX cards), you need to
    install the **Xsun24** package. If you only have a bwtwo frame-buffer and want
    to increase performance, install the **XsunMono** package.'
  merge: -1
  img_proc: true
