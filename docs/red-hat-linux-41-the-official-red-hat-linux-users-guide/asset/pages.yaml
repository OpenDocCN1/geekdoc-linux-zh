    # ### 10.2 Special Red Hat File Locations


    In addition to the files pertaining to the RPM system that reside in `/var/lib/rpm`
    (see chapter 7), there are two other special locations that are reserved for Red
    Hat Linux configuration and operation.


    The control-panel and related tools put lots of stuff in `/usr/lib/rhs`. There
    is probably nothing here that you would want to edit. It is mostly small scripts,
    bitmaps and text files.


    The other location, `/etc/sysconfig`, stores configuration information. The major
    users of the files in this directory are the scripts that run at boot time. It
    is possible to edit these by hand, but it would be better to use the proper control-panel
    tool.


    # ### 10.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious. Red Hat Linux has a
    few tools and conventions that make user and groups easier to manage. and more
    useful.


    The easiest way to manage users and groups is through the Users and Groups module
    of the control-panel (see section 8 for details on the control-panel and section
