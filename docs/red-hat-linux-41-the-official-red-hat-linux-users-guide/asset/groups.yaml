    ### F.2.7 如果我购买的是 Caldera、PHT 等 CD-ROM，我该如何获得支持？


    除非您购买了由红帽软件生产的 Red Hat Linux CD-ROM 产品，否则请不要要求获得支持。是的，如果您拥有 Caldera，那么您就拥有 Red
    Hat Linux，但您是从 Caldera 那里购买的。如果您希望获得 Caldera 的支持，请访问其网站：http://www.caldera.com
    查看其支持选项。


    此外，Pacific Hi-Tech 销售带有“官方 Red Hat Linux”字样的 CD。

    虽然这是一张不错的 CD，但它是由该公司生产并由其提供支持的。

    请勿就 PHT CD 的问题联系我们寻求帮助。


    ### F.2.8 红帽与 Caldera、PHT 等的关系是什么？


    它们都是独立的公司。与任何 Linux CD-ROM 制造商一样，Caldera、Pacific Hi-Tech、Yggdrasil 和 LSL 都可以自由使用
    Red Hat Linux 作为其产品的基础。然而，这意味这些供应商如果希望获得支持，则需完全自行负责支持其产品。我们无法直接支持其他供应商的产品，但其他供应商提供的
    Red Hat 用户欢迎参与我们的邮件列表，并充分使用我们的 WWW 网站和 FTP 站点。


    ### F.2.9 如果我遇到媒体（手册或 CD-ROM）问题该怎么办？


    如果您在收到的产品上遇到问题（例如您的手册缺页或 CD-ROM 有划痕），请联系红帽软件 sales@redhat.com 或使用上述联系方式致电。问题将得到迅速解决。请勿在
    redhat-list 或向支持团队报告这些问题，因为它们可能是个别情况，您的产品只需更换即可。


    （不，这不是常见问题，但偶尔会发生。）


    ### F.2.10 获取 Red Hat Linux 支持的最快且最佳方式是什么？


    您可以先通过 http://www.redhat.com/ 搜索问题的答案。这里有一个搜索引擎，可以搜索所有 Red Hat 邮件列表。如果您没有找到所需内容，可以加入
