    \ 书籍将于 1996 年秋季出版。该书出版后，我们的网站上将提供相关信息，网址为 `http://www.redhat.com`。\n\n还有一个用于讨论与\
    \ RPM 相关问题的邮件列表，名为 `rpm-list@redhat.com`。该列表归档在 `http://www.redhat.com`。若要订阅，请向\
    \ `rpm-list-request@redhat.com` 发送邮件，并在主题行中包含单词 `subscribe`。\n\n# 第 8 章\n\n# 控制面板\n\
    \n![](img/3d09de050edc8aef2a604e36a4127b47_112_0.png)\n\n控制面板是许多不同系统管理工具的启动平台。它们让您无需记住配置文件格式和复杂的命令行选项即可配置各种内容，从而简化您的工作。\n\
    \n要启动控制面板，请以 root 身份运行 startx 启动 X 窗口系统，然后在 xterm 中输入 control-panel。您必须以 root\
