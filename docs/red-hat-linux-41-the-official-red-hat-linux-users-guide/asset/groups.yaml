    # F.2.11 How do I report a problem?


    Send mail to `bugs@redhat.com` or report the bug to `redhat-list`. Again, if you
    didn''t buy Red Hat Linux from us or the ACC Bookstore, please see the previous
    question, "How do I get support...".


    When reporting problems, please be as detailed as possible!!! For example, if
    you can''t get Red Hat to see your SCSI drives, tell us:


    +   * What version of Red Hat

    +   * What kind of SCSI card

    +   * what kernel

    +   * what SCSI id''s are the drives

    +   * how many IDE drives do you have

    +   * specific details of the problem


    If you can''t get your CD-ROM recognized, tell us:


    +   * What version of Red Hat

    +   * make and model of CD-ROM

    +   * type of interface (IDE, SB, etc)

    +   * bootdisk version

    +   * hardware configuration


    Again, be as detailed as possible about your problem!'
