    ### 5.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can "export" filesystems to other systems,
    and "mount" filesystems exported from other machines.


    #### 5.9.1 Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    In this command, porky is the hostname of the NFS fileserver, /mnt/export is the
    filesystem that porky is exporting, and /mnt/local is a directory on my local
    machine where I want to mount the filesystem. After the mount command runs (and
    if I had the proper permissions from porky) - voila! - I can enter ''ls /mnt/local''
    and get a listing of the files in /mnt/export on porky.


    #### 5.9.2 Exporting NFS Filesystems


    The file that controls what filesystems you wish to export is “/etc/exports”.
    Its format is:


    ```

    directory hostname(options)

    ```


    the “(options)” are optional. For example:


    ```

    /mnt/export speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export speedy.redhat.com(ro)

    ```


    would just allow speedy to mount /mnt/export read-only.


    Each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to just stop and
    start the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    The following will also work:


    ```

    killall -HUP rpc.nfsd rpc.mountd

    ```


    See the following man pages for more details: nfsd(8), mountd(8), and exports(5).
    Another good reference is Managing NFS and NIS Services by Hal Stern, published
    by O''Reilly & Associates.


    ### 5.10 Running Programs at Boot Time


    The file `/etc/rc.d/rc.local` is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. For instance, you may want to start up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit `/etc/rc.d/rc.serial`
    and it will be executed automatically at boot time.


    The default `/etc/rc.d/rc.local` simply creates a nice login banner with your
    kernel version and machine type.


    ### 5.11 Color 1s Setup


    Color 1s is now part of the standard 1s command. To use color-1s simply issue
    the command (in bash):


    ```

    alias 1s=''1s --color''

    ```


    ### 5.12 NIS/NYS Setup


    The basic content of this section was donated by Grant Taylor. It was edited for
    clarity and space. Other content was contributed by users on the redhat-l1st mailing
    list.


    This text attempts to describe the yp, NIS, and NIS+ support offered in Red Hat
    Linux products.


    - What is yp? NIS? NIS+? NYS? These questions are answered in the NIS-HOWTO. It
    is included with Red Hat Linux in the ldp package and on the CD. If you install
    the ldp package, you will find the NIS-HOWTO in /usr/doc/ldp/HOWTO.

    - The quick answer is that while yp ("Yellow Pages") is the phone book in Britain,
    NIS is the traditional RPC-based implementation for sharing passwd, group, hosts,
    services, and other useful things between many machines. NIS+ is a snazzier, and
    more secure implementation of the same idea. NYS is the public domain version
    of NIS.

    - What is offered? Red Hat ships NIS client code in its libc and plain yp/NIS
    client programs like ypcat and ypbind. We ship a plain NIS server daemon, since
    the NYS (aka NIS+) server daemon is not yet ready for prime-time. Our ypserv does
    not appear to have the tcp_wrapper-style /etc/hosts.allow/deny checking compiled
    in.

    - How do I get ypbind to work properly? How do I set up a client workstation?
    The NYS code in libc does it all. There is no need to run ypbind. You probably
    /em do need to run domainname (apparently for the benefit of plain NIS client
    programs). You must configure which maps are read from where in /etc/nsswitch.conf,
    and which NIS server and domain you are in using /etc/yp.conf. nsswitch.conf is
    well commented, and yp.conf will look like this:


    ```

    domain foo

    ypserver foo.bar.com

    ```


    Do not put the usual +::: lines at the end of passwd or group.


    - How do I run ypserv (master)? Red Hat ships a plain NIS (a.k.a. yp) server.
    It works just like any other ypserv — modify the Makefile in /var/nis to taste,
    perhaps move the source files into /var/nis/src, or perhaps not, run make to make
    the databases, and run ypserv. Further documentation is in /usr/doc/ypserv*/*.

    - Where are yppasswd and yppasswdd? They are not included in Red Hat Linux, but
    you can obtain the regular NIS distribution and install it yourself without too
    much hassle. It is available from the places listed in the NIS HOWTO. You have
    to modify the pupdate script that comes with it, even though the README claims
    it works with the NYS Makefile we ship. We also don''t ship a rpcsrv/yppasswd.h,
    although we do have the .x file. The yppasswdd package comes with both so it doesn''t
    matter much. The NYS define should be used, but don''t use the -lnsl library since
    it is built into our libtc.

    - This information is miserably incomplete! There is already an NIS-HOWTO that
    describes how to set things up far better than this document does or should. It
    is also included with Red Hat Linux in the ldp package.


