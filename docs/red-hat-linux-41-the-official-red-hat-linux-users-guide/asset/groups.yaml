    \n## 5.1 构建自定义内核\n\n随着 Linux 2.0.x 内核引入模块化，构建自定义内核发生了一些重大变化。过去，如果你想访问特定的硬件或文件系统组件，必须将支持编译进你的内核。对于某些硬件配置，内核的大小可能迅速达到临界水平。要求对偶尔使用的项提供即时的支持是对系统资源的低效使用。利用\
