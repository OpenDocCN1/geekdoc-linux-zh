  mdcn: '

    ## D.9 Alpha 架构备注


    32 位和 64 位的加载和存储操作（即 Digital 术语中的长字和双字）。联合架构师（Dick Sites, Rich Witek）通过引用以下优势来证明这一决策的合理性：


    - 缓存和内存子系统对字节的支持往往会减慢对 32 位和 64 位数据的访问速度。

    - 字节支持使得在缓存/内存子系统中构建高速纠错电路变得困难。


    Alpha 通过提供强大的指令来操纵 64 位寄存器内的字节和字节组进行了补偿。字符串操作的标准基准测试（例如某些 Byte 基准测试）表明，Alpha 在字节操纵方面表现出色。


    缺少字节加载和存储指令会影响某些软件信号量的实现，并影响 I/O 子系统的设计。Digital 解决 I/O 问题的方案是使用一些低位地址线在 I/O 传输期间指定数据大小，并将这些线解码为字节使能。这种所谓的稀疏寻址（Sparse
    Addressing）浪费了地址空间，并导致 I/O 空间不连续（关于稀疏寻址的复杂性，等我找到时间写出来时再详细说明）。请注意，在此上下文中，I/O 空间指的是位于
    PCI 上的所有系统资源，因此既包括 PCI 内存空间，也包括 PCI I/O 空间。


    随着 21164A 的引入，Alpha 架构经过工程变更（ECo）以包含字节寻址。在早期 CPU 上执行这些新指令将导致 OPCDEC PALCode 异常，从而由
    PALCode 来处理该访问。这将带来性能影响。其结果是，使用这些新指令（在我看来）应仅限于设备驱动程序，而非应用程序代码。


    这些新的字节加载和存储指令意味着未来的支持芯片组将能够支持连续的 I/O 空间。


    ### D.9 PALCode 及相关内容


    这是解释 PALCode 的章节占位符。如果有足够的兴趣，我会撰写它。


    ## D.10 移植


    任何基于 Alpha 的机器运行 Linux 的能力实际上仅受限于你获取其内部结构细节信息的能力。由于 E66、EB64+ 和 EB164 主板已有 Linux
    移植版本，所有基于 21066、21064/APECS 或 21164/ALCOR 的系统只需很少或无需修改即可运行 Linux。这些主板之间的主要区别在于它们路由中断的方式。中断有三个来源：


    - 板载设备

    - PCI 设备

    - ISA 设备


    所有系统都使用 Intel 系统 I/O 桥（SIO）作为 PCI 和 ISA 之间的桥接器（主 I/O 总线是 PCI，ISA 总线是用于支持低速和“传统”I/O
    设备的次要总线）。SIO 包含传统的级联 8259 中断控制器对。


    某些系统（例如 Noname）将其所有中断通过 SIO 路由到 CPU。某些系统具有单独的中断控制器，并将所有 PCI 中断加上 SIO 中断（8259 输出）通过该控制器路由，而所有
    ISA 中断则通过 SIO 路由。


    系统之间的其他差异包括：


    - 它们有多少插槽

    - 它们有哪些板载 PCI 设备

    - 它们是否有 Flash 或 EPROM


    ## D.11 更多信息


    所有 DS 评估板设计均免费授权，一套设计的完整文档套件价格约为 50 美元。这包括所有原理图、可编程部件源码、CPU 和支持芯片组的数据手册。文档套件可从
    Digital Semiconductor 分销商处获得。我并不是建议许多人会想要立刻冲出去购买这套资料，但我确实想指出这些信息是可以获得的。


    希望这有帮助。如有评论/更新/扩展建议，请致信 Neal Crook，neal.crook@reo.mts.digital.com


    ## D.12 参考文献


    http://www.research.digital.com/wrl/publications/abstracts/TN-13.html

    Bill Hamburgen, Jeff Mogul, Brian Reid, Alan Eustace, Richard Swan, Mary Jo Doherty,
    and Joel Bartlett. Characterization of Organic Illumination Systems. DEC WRL,
    Technical Note 13, April 1989.


    # 附录 E


    # Alpha Miniloader 使用指南


    本文档描述了 Miniloader，这是一个用于 Alpha 系统的程序，可用于初始化机器并加载 Linux。Alpha Linux Miniloader（全称）也被称为
    Milo。


    ## E.1 介绍


    本文档描述了 Alpha AXP 上 Linux 的 Miniloader（Milo）。此固件用于初始化基于 Alpha AXP 的系统，加载并启动 Linux，并最终为
    Linux 提供 PALCode。


