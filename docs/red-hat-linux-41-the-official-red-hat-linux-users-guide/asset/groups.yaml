    如果你安装了 Apache Web 服务器（来自 apache 包），那么你的 Web 服务已经在运行了！只需将 Red Baron（或任何其他 Web 浏览器）指向
    `http://localhost`。


    默认显示的页面是 `/home/htpm/index.html`。你可以按照自己的喜好编辑此文件（或完全替换它）。所有 CGI 程序、图标和 html 页面都存储在
    `/home/htpm` 中，但这可以在 Apache 配置文件中更改，所有配置文件都存储在 `/etc/httpd/conf`。所有 httpd 活动的日志保留在
    `/var/log/httpd` 中。设置你的网站就像将自己的 HTML 页面和链接添加到 `/home/httpd/html/` 目录一样简单。有关定制
    Web 服务器的更多信息，我们推荐参考 Chuck Musciano 和 Bill Kennedy 编写、由 O''Reilly & Associates
    出版的《HTML: The Definitive Guide》。


    ### 5.9 NFS 配置


    NFS 代表网络文件系统（Network File System），它是一种在机器之间共享文件的方式，就好像它们位于本地硬盘上一样。Linux 既可以作为
    NFS 服务器，也可以作为 NFS 客户端，这意味着它可以向其他系统“导出”文件系统，并且可以“挂载”从其他机器导出的文件系统。


    #### 5.9.1 挂载 NFS 文件系统


    使用 `mount` 命令挂载来自另一台机器的 NFS 文件系统：


    ```

    mount porky:/mnt/export /mnt/local

    ```


    在此命令中，porky 是 NFS 文件服务器的主机名，`/mnt/export` 是 porky 导出的文件系统，而 `/mnt/local` 是我本地机器上希望挂载该文件系统的目录。在运行
    `mount` 命令之后（并且如果我有来自 porky 的正确权限）——看！——我可以输入 ''ls /mnt/local'' 并获取 porky 上 `/mnt/export`
    中文件的列表。


    #### 5.9.2 导出 NFS 文件系统


    控制你希望导出哪些文件系统的文件是 “/etc/exports”。其格式为：


    ```

    directory hostname(options)

    ```


    “(options)” 是可选的。例如：


    ```

    /mnt/export speedy.redhat.com

    ```


    这将允许 speedy.redhat.com 挂载 `/mnt/export`，但：


    ```

    /mnt/export speedy.redhat.com(ro)

    ```


    这将仅允许 speedy 以只读方式挂载 `/mnt/export`。


    每次你更改 `/etc/exports` 时，都需要告诉 NFS 守护程序查看其新信息。实现此目标的一种简单方法是停止并重新启动守护程序：


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    以下命令也可以工作：


    ```

    killall -HUP rpc.nfsd rpc.mountd

    ```


    有关更多详情，请参阅以下手册页：nfsd(8)、mountd(8) 和 exports(5)。另一个好的参考是 Hal Stern 编写、由 O''Reilly
    & Associates 出版的《Managing NFS and NIS Services》。


    ### 5.10 在启动时运行程序


    文件 `/etc/rc.d/rc.local` 在启动时执行，在所有其他初始化完成之后，以及在更改运行级别时执行。你可以在这里添加额外的初始化命令。例如，你可能希望启动额外的守护程序，或初始化打印机。此外，如果你需要串行端口设置，可以编辑
    `/etc/rc.d/rc.serial`，它将在启动时自动执行。


    默认的 `/etc/rc.d/rc.local` 只是创建一个包含你的内核版本和机器类型的精美登录横幅。


    ### 5.11 彩色 ls 设置


    Color ls 现在是标准 ls 命令的一部分。要使用彩色 ls，只需发出命令（在 bash 中）：


    ```

    alias 1s=''1s --color''

    ```


    ### 5.12 NIS/NYS 设置


    本节的基本内容由 Grant Taylor 提供。为了清晰度和篇幅进行了编辑。其他内容由 redhat-l1st 邮件列表上的用户提供。


    本段文字试图描述 Red Hat Linux 产品中提供的 yp、NIS 和 NIS+ 支持。


    - 什么是 yp？NIS？NIS+？NYS？这些问题在 NIS-HOWTO 中得到了回答。它随 Red Hat Linux 包含在 ldp 包中，也在 CD
    上。如果你安装 ldp 包，你将能在 /usr/doc/ldp/HOWTO 中找到 NIS-HOWTO。

    - 简短的回答是，虽然 yp（“黄页”）是英国的电话簿，但 NIS 是用于在多台机器之间共享 passwd、group、hosts、services 和其他有用信息的传统基于
    RPC 的实现。NIS+ 是相同想法的更时尚、更安全的实现。NYS 是 NIS 的公共领域版本。

    - 提供了什么？Red Hat 在其 libc 中提供 NIS 客户端代码，以及像 ypcat 和 ypbind 这样的普通 yp/NIS 客户端程序。我们提供一个普通的
    NIS 服务器守护程序，因为 NYS（即 NIS+）服务器守护程序尚未准备好。我们的 ypserv 似乎没有编译带有 tcp_wrapper 风格的 /etc/hosts.allow/deny
    检查。

    - 如何让 ypbind 正常工作？如何设置客户端工作站？libc 中的 NYS 代码完成了所有工作。无需运行 ypbind。你可能 *确实* 需要运行 domainname（显然这对普通
    NIS 客户端程序是有益的）。你必须配置从 /etc/nsswitch.conf 中读取哪些映射以及从哪里读取，并使用 /etc/yp.conf 配置你所在的
    NIS 服务器和域。nsswitch.conf 有很好的注释，而 yp.conf 将如下所示：


    ```

    domain foo

    ypserver foo.bar.com

    ```


    不要在 passwd 或 group 的末尾添加通常的 +::: 行。


    - 如何运行 ypserv（主服务器）？Red Hat 提供一个普通的 NIS（即 yp）服务器。它就像任何其他 ypserv 一样工作——修改 /var/nis
    中的 Makefile 以符合你的口味，也许将源文件移动到 /var/nis/src，或者不这样做，运行 make 来制作数据库，然后运行 ypserv。更多文档在
    /usr/doc/ypserv*/ 中。

    - yppasswd 和 yppasswdd 在哪里？它们不包含在 Red Hat Linux 中，但你可以获得普通的 NIS 分发并自行安装，不会有太多麻烦。它可以从
    NIS HOWTO 中列出的地方获取。你不得不多修改随附的 pupdate 脚本，即使 README 声称它与我们提供的 NYS Makefile 兼容。我们也不提供
    rpcsrv/yppasswd.h，虽然我们确实有 .x 文件。yppasswdd 包附带两者，所以没什么大不了的。应该使用 NYS define，但不要使用
    -lnsl 库，因为它已内置于我们的 libtc 中。

    - 这些信息非常不完整！已经有一份 NIS-HOWTO，比本文档描述或应当描述的设置方法要好得多。它也是随 Red Hat Linux 包含在 ldp 包中。


    ## 第 6 章 查找文档


    Red Hat Linux 包含数千页在线文档，帮助你了解如何使用该系统。所包含的手册页、info 文档和纯文本文件提供了有关 Linux 几乎每个方面的信息。为了获得更多帮助，Red
    Hat 还以电子形式包含了 Linux 文档项目生产的所有文档。


    ### 6.1 在线帮助


    当你在寻找关于命令和错误消息的一般帮助时，最好的起点就在你的系统上。


    #### 6.1.1 手册页


    你系统上的几乎每个命令都有一个相关的“man”页。这是你如果有疑问或问题时可以立即获取的文档。如果你在使用命令 `1s` 时遇到了困难，你可以输入 `man
    1s`。这将调出 `1s` 的 man 页。man 页通过 `less` 程序查看，因此在 man 页中，`less` 的所有选项都将起作用。一些重要的按键操作是：


    - 按 q 退出。


