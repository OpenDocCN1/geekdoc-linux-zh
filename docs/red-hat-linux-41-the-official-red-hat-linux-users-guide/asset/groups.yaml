    由于该列表的流量相对较高，我们还有 redhat-announce-list。该列表仅用于发布对 Red Hat 社区至关重要的公告，流量较低。所有使用 Red
    Hat Linux 的人都应该订阅该列表。


    要订阅该列表，请发送电子邮件至 redhat-announce-list-request@redhat.com，主题行写为：


    `subscribe`


    我们还有一个开发者列表。


    要订阅该列表，请发送电子邮件至 `redhat-devel-list-request@redhat.com`，主题行写为：


    `subscribe`


    ### F.2.11 如何报告问题？


    请发送邮件至 `bugs@redhat.com` 或向 `redhat-list` 报告 bug。再次提醒，如果您不是从我们这里或 ACC 书店购买 Red
    Hat Linux，请参阅上一个问题“如何获得支持……”。


    在报告问题时，请尽可能详细！！！例如，如果您无法让 Red Hat 识别您的 SCSI 驱动器，请告诉我们：


