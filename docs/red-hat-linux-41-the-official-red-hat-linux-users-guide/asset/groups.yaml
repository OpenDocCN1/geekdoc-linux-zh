    ## FTP 服务器信息


    最后一个与 FTP 相关的对话框会请求有关 FTP 服务器的信息（参见图 2.9）。请输入您要从中安装的主机的名称或 IP 地址，以及包含适用于您的体系架构的
    RedHat 目录的目录名称。例如，如果 FTP 站点包含目录 /pub/mirrors/redhat/1386/RedHat，请输入 /pub/mirrors/redhat/1386。


    ![](img/3d09de050edc8aef2a604e36a4127b47_36_0.png)


    图 2.9：通过 FTP 安装


    ### 2.4.8 为 Red Hat Linux 创建分区


    在决定是否使用 SCSI 支持之后（如果是通过 FTP 安装，在配置网络信息之后），安装程序会显示其能在您的系统上找到的硬盘列表，并提示您为 Red Hat
    Linux 预留至少一个磁盘分区。如果需要创建一个或多个分区，请选择您要分区的磁盘并按 [Enter]；安装程序将启动 Linux fdisk 实用工具。关于为
    Red Hat Linux 创建分区的建议，请参阅第 2.2.3 节。


    #### 使用 fdisk


    fdisk 包含简练但有用的在线帮助。以下是几条提示：


    - 要列示当前的分区表，请使用 `p` 命令。要添加新分区，请使用 `n`。

    - Linux `fdisk` 默认创建类型为 `Linux native` 的分区。创建 swap 分区时，请使用 `t` 命令不要忘记将其类型更改为 `Linux
    swap`。

    - Linux 允许单个磁盘上最多有四个 (4) 分区。如果您希望创建更多分区，其中四个分区之一可以是*扩展*分区，该分区进而包含一个或多个*逻辑*分区。由于它充当容器，扩展分区必须跨越逻辑分区将占用的所有空间。

    - 在创建每个分区时，记下哪些分区（例如，`/dev/hda2`）用于哪些文件系统（例如，`/usr`）是个好主意。

    - **请注意：** 您所做的任何更改，直到使用 `w` 命令保存并退出 `fdisk` 之前，均不会生效。您可以随时使用 `q` 命令退出 `fdisk`
    而不保存更改。


    #### 分区编号


    Linux 使用字母和数字的组合来引用磁盘分区，这可能会让新手用户感到困惑。以下是摘要：


    - **字母**表示分区所在的设备，例如，`/dev/hda`（第一个 IDE 硬盘）或 `/dev/sdb`（第二个 SCSI 磁盘）。

    - **数字**表示分区。前四个（主分区或扩展分区）的编号为 1 到 4。逻辑分区从 5 开始。例如，`/dev/hda3` 是第一个 IDE 硬盘上的第三个主分区或扩展分区；`/dev/sdb6`
    是第二个 SCSI 硬盘上的第二个逻辑分区。


    #### 更改分区表


    完成磁盘分区后，请按下 **Done**；您可能会看到一条消息，指示安装程序需要重启。这是在更改磁盘分区数据后的正常现象；如果您创建、修改或删除了任何扩展分区，通常会发生这种情况。按下
    **OK** 后，您的机器将重启。请按照您在 **Partitioning Disks** 之前执行的相同安装步骤进行操作；然后只需选择 **Done**
    即可。


    ### 2.4.9 初始化交换空间


    在为 Red Hat Linux 创建分区后，安装程序会查找 swap 分区。如果找到任何分区，它会询问您是否希望初始化它们。使用 `Space` 选择要初始化为交换空间的分区，然后选择
    **OK**。


    如果安装程序找不到您的 swap 分区，请确保已将分区类型设置为 **Linux swap**；请参阅上述第 2.4.8 节。


    ### 2.4.10 文件系统配置


    由于 Red Hat Linux 可能分布在多个磁盘分区上，您需要选择哪些磁盘分区与哪个*文件系统*对应。


    #### 选择根分区


    在初始化交换空间后，安装程序会显示其能找到的 Linux 分区列表，并提示您选择*一个根分区*。根分区（或*根文件系统*）是持有*启动您的 Red Hat
    Linux 系统所需的一切*的分区：在系统启动时，它会被挂载在 `/`（*根目录*）上。选择您要使用的根分区并按 `Enter`。


    #### 其他分区


    下一个对话框会显示系统上大多数磁盘分区的列表（包括 Linux 可以读取的 MS-DOS 和其他分区），为您提供机会将其他分区分配给文件系统的不同部分。您分配的文件系统将在
    Red Hat Linux 系统启动时自动挂载。选择要分配的分区并按 `Enter`（或选择 **Edit**）；然后输入该分区的*挂载点*，例如，`/usr`（参见图
    2.10）。


    ![](img/3d09de050edc8aef2a604e36a4127b47_39_0.png)


    此外，Red Hat Linux 允许您在系统启动时挂载 NFS 卷；这使得目录树可以在网络上共享。选择 `Add NFS`，然后输入 NFS 服务器的主机名、NFS
    卷的路径以及该卷的本地挂载点（参见图 2.11）。


    ![](img/3d09de050edc8aef2a604e36a4127b47_40_0.png)


    图 2.11：添加 NFS 挂载


    #### 格式化分区


    下一个安装对话框会显示待格式化分区的列表。大多数分区应该进行格式化，特别是如果它们是新创建的；但是，诸如 /home 或 /usr/local 之类的分区，如果您希望保留其中的数据，则无需格式化。选择要格式化的每个分区并按
    `Space`。如果您希望在格式化每个文件系统时检查坏块，请选择 `Check for bad blocks during format`。按下 `OK`。


    ### 2.4.11 选择和安装软件包


    在配置并格式化您的分区后，您可以准备选择要安装的软件包。您可以选择*系统组件*（根据功能将软件包分组）、选择单个软件包，或选择两者的组合。


    #### 2.4.12 逐步安装


    ![](img/3d09de050edc8aef2a604e36a4127b47_40_0.png)


    #### 选择系统组件


    系统组件根据您的 Red Hat Linux 系统应能够执行的功能对软件包进行分组：例如，**C Development**、**Networked Workstation**
    或 **Web Server**。选择您要安装的每个组件并按 `Space`。选择 **Everything** 将安装 Red Hat Linux 包含的所有软件包（参见图
    2.12）。


    如果您还希望选择或取消选择单个软件包以及系统组件，请选择 **Select individual packages**。


    ![](img/3d09de050edc8aef2a604e36a4127b47_41_0.png)


    图 2.12：选择系统组件


    #### 选择单个软件包


    在选择要安装的组件后，您可以选择或取消选择单个软件包。安装程序会显示可用软件包组的列表；选择一个组进行检查并按 `Enter`。安装程序会显示该组中软件包的列表，您可以使用
    `Space` 选择或取消选择。您可以通过按 `F1` 查看软件包的详细描述（参见图 2.13）。完成选择单个软件包后，在 **Select Group**
    对话框中按 **OK**。


    **请注意：** 某些软件包（如内核和某些库）是每个 Red Hat Linux 系统所必需的，因此无法选择或取消选择。


    #### 软件包依赖项


    许多软件包为了正确运行，依赖于系统中已安装的其他软件包或库。例如，许多图形化的 Red Hat 系统管理工具需要 python 和 pythonlib 软件包。为了确保您的系统拥有完全正常运行所需的所有软件包，Red
    Hat Linux 会在每次安装或卸载软件包时检查依赖项。


    在完成选择要安装的软件包后，安装程序会检查所选软件包列表中的依赖项。如果有任何软件包需要您未选择安装的其他软件包，程序将显示这些未解决的依赖项列表，并给您机会解决它们（参见图
    2.14）。如果您只是按 OK，程序将通过将所有必需的软件包添加到所选软件包列表中来自动解决它们。


