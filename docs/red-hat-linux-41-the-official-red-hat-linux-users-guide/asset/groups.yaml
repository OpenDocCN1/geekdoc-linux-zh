    ## E.5.2 从评估板调试监视器加载 Milo


    评估板调试监视器可以通过网络（网络启动）或软盘加载映像。无论哪种情况，在启动映像之前，请将引导地址设置为 0x2000000（bootadr 2000000）。


    如果映像位于软盘上（请注意，仅支持 DOS 格式化的软盘），则需要键入以下命令：


    ```

    AlphaPC64> f1boot <Milo-image-name>

    ```


    ## E.5.3 从故障安全引导块软盘加载 Milo


    据已知，只有 AxpPCI33 支持故障安全引导块软盘功能（参见第 E.5.6 节“无名板卡”）。


    如果你没有标准的预构建 Milo .dd 映像，那么你可能需要构建一个 SRM 引导块软盘。一旦构建好 Milo，你需要在 Digital Unix 机器上执行以下操作：


    ```bash

    fdisk -fmt /dev/rfd0a

    cat mboot bootm > /dev/rfd0a

    disklabel -rw rfd0a `rx23'' mboot bootm

    ```


    或者在 Linux 机器上：


    ```bash

    cat mboot bootm > /dev/fd0

    ```


    如果你有标准的 Milo 映像可用（例如 milo.dd），则使用以下命令构建引导块软盘：


    ```bash

    dd if=milo.dd of=/dev/fd0

    ```


    ## E.5.4 从闪存加载 Milo


    有许多系统可以将 Milo 烧录到闪存中并直接启动（而不是通过 Windows NT ARC 固件）：


    - AlphaPC64（第 E.5.6 节）

    - Noname（第 E.5.6 节）

    - EB66+（第 E.5.6 节）

    - EB164（第 E.5.6 节）


    ## E.5.5 从 SRM 控制台加载 Milo


    SRM（System Reference Manual，系统参考手册的缩写）控制台不了解文件系统或磁盘分区，它只期望二级引导加载程序占据从给定偏移量开始的连续物理磁盘扇区范围。描述二级引导加载程序的信息（其大小和偏移量）包含在前
    512 字节块中。要通过 SRM 加载 Milo，你必须在 SRM 可以访问的设备（如软盘）上生成该结构。这就是 mboot 和 boom 的作用，mboot
    是第一个块（或引导描述），而 boom 是四舍五入到 512 字节边界的 Milo 映像。


    要从引导块设备加载 Milo，请构建 mboot 和 boom，并使用以下命令将它们推送到引导设备上：


    ```

    $ cat mboot boom > /dev/fd0

    ```


    或者，从网站获取适当的 milo.dd 并使用 RAWRITE.EXE 或 dd 将其写入引导设备。


    完成上述操作后，你可以启动 SRM 控制台并使用其众多命令之一来启动 Milo。例如，要从引导块软盘启动 Milo，请键入以下命令：


    ```

    >>boot dva0

    (boot dva0.0.0.0.1 -flags 0)

    block 0 of dva0.0.0.0.1 is a valid boot block

    reading 621 blocks from dva0.0.0.0.1

    bootstrap code read in

    base = 112000, image_start = 0, image_bytes = 4da00

    initializing HWRPB at 2000

    initializing page table at 104000

    initializing machine state

    setting affinity to the primary CPU

    jumping to bootstrap code


    Milo Stub: V1.1

    Unzipping Milo into position

    Allocating memory for unzip

    ####...

    ```


    以下系统已知支持 SRM 控制台：


    - Noname（第 E.5.6 节）

    - AlphaPC64（第 E.5.6 节）

    - EB164（第 E.5.6 节）


    ## E.5.6 系统特定信息


    ### AxpPCI33（Noname）


    Noname 板卡可以从 Windows NT ARC 固件加载 Milo（第 E.5.1 节“从 Windows NT ARC 固件启动”），从 SRM
    控制台（第 E.5.5 节“从 SRM 控制台加载 Milo”），以及从故障安全引导块软盘（第 E.5.3 节“从故障安全引导块软盘加载”）。有一种可从 Milo
    运行的闪存管理工具，因此一旦 Milo 运行起来，就可以将其烧录到闪存中（第 E.7 节“运行闪存管理工具”）。但请注意，一旦这样做，你将丢失之前存储在该处的映像，因为闪存空间仅够容纳一个映像。


    Noname 的启动方式由板卡上的一组跳线 J29 和 J28 控制。这些跳线如下所示：


    ```

    4

    J29 2 x x x 6

    1 x x x 5


    J28 2 x x 6

    1 x x x 5

    3

    ```


    我们关注的两个选项是 J28 的 1-3 引脚（从闪存启动控制台/加载程序）和 J29 的 1-3 引脚（从引导块软盘启动控制台/加载程序）。要在 Noname
    板卡上首次启动 Milo，你需要选择第二个选项。


    通过跳线选择从软盘启动选项后，将包含 Milo 的 SRM 引导块软盘放入软驱并重启。几秒钟后（软驱指示灯熄灭后），你应该看到屏幕变白，并且 Milo 会告知你当前状态。


    如果你对这些技术细节特别感兴趣，Noname 将软盘上的映像加载到物理地址 0x104000，将闪存上的映像加载到 0x100000。因此，Milo 构建时其
    PALcode 起始于 0x200000。当它首次加载时，它会将自己移动到正确的位置（参见 relocate.S）。


    ### AlphaPC64（Cabriole）


    AlphaPC64 包含 Windows NT ARC 固件（第 E.5.1 节）、SRM 控制台（第 E.5.5 节）和评估调试监视器（第 E.5.2 节“从调试监视器加载”）。这些映像位于闪存中，且有空间添加
    Milo，以便你可以直接从闪存启动 Milo。有一种可从 Milo 运行的闪存管理工具，因此一旦 Milo 运行起来，就可以将其烧录到闪存中（第 E.7 节“运行闪存管理工具”）。此系统支持
    Milo 环境变量。


    使用跳线和保存在 TOY 时钟 NVRAM 中的启动选项的组合来选择启动选项（以及放入闪存后的 Milo）。


    跳线是 J2，SP 位 6 和 7 具有以下含义：

    - SP 位 6 应始终处于断开状态。如果设置此跳线，则会启动 SROM 迷你调试器。

    - SP 位 7 闭合：启动由 TOY 时钟中启动选项字节选定的映像。

    - SP 位 7 断开：启动闪存中的第一个映像。


    因此，当位 7 断开时，调试监视器将被启动，因为它始终是闪存中的第一个映像。当位 7 闭合时，将选择由 TOY 时钟中的启动选项选定的映像。调试监视器、Windows
    NT ARC 固件和 Milo 都支持设置此启动选项字节，但你必须非常谨慎地使用它。特别是，当你运行 Windows NT ARC 固件时，不能将启动选项设置为下次系统启动时加载
    Milo；它只允许你将调试监视器或 Windows NT ARC 设置为启动选项。


    要通过评估板调试监视器将 Milo 放入闪存，你需要一个可刷写的映像。构建过程生成 milo.rom，但你也可以使用随板卡提供的调试监视器软件中的 makerom
    工具制作 rom 映像：


    ```

    } makerom -v -l7 -l200000 Milo -o mini.flash

    ```


    （键入 makerom 可了解参数的含义，其中 7 是 srom 使用的闪存映像 ID，-l200000 将映像的加载地址设为 0x200000）。


    将该映像加载到内存（通过调试监视器命令 fload、netload 等）地址 0x200000，然后将映像烧录到闪存中：


    ```

    AlphaPC64} flash 200000 8

    ```


    （200000 是要烧录的映像所在的内存地址，8 是你放置映像的段号。闪存中有 16 个 1024*64 字节的段，调试监视器位于第 0 段，Windows
    NT ARC 固件位于第 4 段）。


    通过将映像编号写入 TOY 时钟来设置 srom 将启动的映像。


    ```

    AlphaPC64} bootopt 131

    ```


    （131 表示启动第 3 个映像，129 = 第 1 个，130 = 第 2 个，等等）。


    关闭电源，合上跳线 7，打开电源，你应该看到 Milo 启动起来。如果没有，则断开跳线 7 并重启调试监视器。


    ### EB66+


    与所有由 Digital 制造的 Alpha 评估板一样，EB66+ 包含评估板调试监视器，因此可以使用它来加载 Milo（第“从调试监视器加载”节）。通常（尽管不是总是），基于这些设计的板卡也包含调试监视器。通常，这些板卡包含
    Windows NT ARC 固件（第“从 Windows NT ARC 固件启动”节）。有一种可从 Milo 运行的闪存管理工具，因此一旦 Milo 运行起来，就可以将其烧录到闪存中（第“运行闪存管理工具”节）。此系统支持
    Milo 环境变量。


    这些系统在闪存中有多个启动映像，由跳线控制。两个跳线组是 J18 和 J16，位于板卡底部中间位置（如果 Alpha 芯片在顶部）。使用跳线和保存在 TOY
    时钟 NVRAM 中的启动选项的组合来选择启动选项（以及放入闪存后的 Milo）。


    J18 的跳线 7-8 闭合表示启动由启动选项描述的映像。J18 的跳线 7-8 断开表示启动评估板调试监视器。


    通过评估板调试监视器将映像烧录到闪存的过程与 AlphaPC64 完全相同（第“AlphaPC64”节）。


    ### EB64+/Aspen Alpine


    该系统与 AlphaPC64 非常相似，只是它不包含可从其中加载 Milo 的闪存。EB64+ 有两个 ROM，其中一个包含 Windows NT ARC
    固件（第“从 Windows NT ARC 固件启动”节），另一个包含评估板调试监视器（第“从调试监视器加载”节）。


    Aspen Alpine 略有不同，它只有一个 ROM；该 ROM 包含 Windows NT ARC 固件。


    ### 通用桌面盒（Multia）


    这是一种非常紧凑的基于 21066 的预封装系统，包含一个 TGA（21030）图形设备。虽然你可以将半高 PCI 图形卡装入该盒中，但你最好等待 XFree86
    对完整 TGA 的支持。它包含 Windows NT ARC 固件，因此从其启动是首选方法（第“从 Windows NT ARC 固件启动”节）。


