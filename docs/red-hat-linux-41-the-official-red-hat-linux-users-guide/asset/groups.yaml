    \ 或 xf86config 时，你需要确保选择相同的视频卡，否则自动探测将失败。\n\n如果你认为为你的视频卡安装了错误的 X 服务器，在能够配置之前，你必须安装正确的那个。例如，如果\
    \ CD 挂载在 /mnt/cdrom，并且你需要安装 S3 服务器，输入以下命令：\n\n```\ncd /mnt/cdrom/RedHat/RPMS\n\
    rpm -ivh XFree86-S3-3.1.2-1.i386.rpm\nln -sf ../../usr/X11R6/bin/xF86_S3 /etc/X11/X\n\
    ```\n\n这将安装 S3 服务器并创建正确的符号链接。\n\n### 5.2.2 Xconfigurator\n\n要配置 X 窗口，你必须首先选择你的视频卡。向下滚动支持的卡片列表，直到找到你机器中的卡。第\
    \ 5.2.2 节可能帮助你确定与你的硬件相匹配的视频服务器。如果你的卡不在列表中，它可能不受 XFree86 支持。在这种情况下，你可以尝试列表中的最后一个卡片条目（Unlisted\
    \ Card）或商业 X Windows 服务器，例如 Metro X。下一步是选择你的显示器。如果你的显示器不在列表中，你可以选择其中一个通用显示器条目或“Custom”并输入你自己的参数。自定义显示器配置仅推荐给那些对\
