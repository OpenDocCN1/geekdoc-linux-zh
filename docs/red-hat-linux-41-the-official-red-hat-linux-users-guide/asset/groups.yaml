    \n## 7.3 向朋友展示 RPM 的强大功能\n\nRPM 是一个非常有用的工具，既可用于系统管理，也可用于诊断和修复问题。理解所有选项的最佳方法是查看一些示例。\n\
    \n-   假设您不小心删除了一些文件，但不确定删除了什么。如果您想验证整个系统并查看可能缺失的内容，请输入：\n    ```\n    rpm -Va\n\
