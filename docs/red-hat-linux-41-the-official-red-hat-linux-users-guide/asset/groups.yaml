    \ 不支持的视频卡。配置实用程序可以以图形模式（configX）或文本模式（configX.curses）运行。\n\n### 5.3.1 系统要求\n\n\
    最少 8 兆字节 RAM；建议 16 兆字节。基本服务器包需要 12 兆字节磁盘空间。\n\n### 5.3.2 configX.curses\n\nconfigX.curses\
    \ 是一个简单的图形配置工具，用于配置 Metro-X。configX.curses 实用程序不提供配置多个屏幕或选择鼠标按钮数量的支持。如果你需要这些功能，你必须使用\
    \ configX。要运行 configX.curses，输入以下命令：\n\n```\nconfigX.curses\n```\n\n启动屏幕包含有关 Metro\
    \ Link, Inc. 的信息以及配置 Metro-X 所需事项的简要说明。按 Enter 键开始配置。屏幕将在顶部显示当前配置信息，在底部显示配置菜单。使用方向键在菜单中上下移动高亮，使用\
    \ Enter 键选择高亮显示的项目。\n\n#### 图形卡\n\n当你从配置菜单中选择 Graphics Card 时，将显示支持卡片的列表。如上所述选择你的视频卡。选择视频卡后，你会被要求从默认列表中选择一种视频模式。使用的分辨率取决于个人喜好。数字越小，显示上的项目越大。某些视频卡和视频模式的组合支持大于物理显示器的虚拟屏幕。如果你的组合是其中之一，你会被要求选择虚拟屏幕的大小。\n\
    \n"
