  mdcn: "\n\n- 可以选择多个物理分辨率。在运行 Metro-X 时，您可以通过按下快捷键组合在这些分辨率之间切换：\n  - 按 Ctrl + Alt\
    \ + + 切换到下一个分辨率。\n  - 按 Ctrl + Alt + − 切换到上一个分辨率。\n\n- 如果只想使用一个分辨率，请确保仅选中一个物理分辨率切换按钮。\n\
    \n- 在某些情况下，您选择的物理分辨率可能会限制您在颜色和虚拟分辨率中可做的选择，这取决于显卡的性能。\n\n  1. 默认设置位于该卡的最低值。\n \
    \ 2. 决定您想要使用的可用分辨率。\n  3. 按 Tab 键移动至该设置，然后按 Enter 键进行选择。\n  4. 按 Tab 键移动至对应的字段以设置该分辨率的屏幕刷新率\
    \ (Hz)，然后使用左箭头或右箭头从可用的频率选项中选择数值。默认设置是显示器支持的最高频率，通常也是合适的选择。\n  5. 对每个想要设置的物理分辨率重复此过程。\n\
    \n## 多屏配置\n\nMetro-X 支持多达四块屏幕，可以同时使用单个键盘和鼠标控制所有这些屏幕。这允许您运行许多应用程序而无需重叠窗口，对于图像处理工作特别有用。对于每个使用的屏幕，必须为该屏幕的监视器和显卡创建单独的配置。显卡要求请参见第\
    \ C.1.4 节。\n\n## 添加屏幕\n\nMetro-X 默认设置为单屏模式。第一个配置的屏幕标记为 Screen 0。当您添加第二个屏幕时，其所有默认设置将复制\
    \ Screen 0 的当前设置。因此，如果所有屏幕的硬件相同，您可以在添加其他屏幕之前先配置 Screen 0 以节省时间。同样，随着添加更多屏幕，添加新屏幕时当前处于活动状态的屏幕的设置将决定新屏幕的默认设置。\n\
    \n  1. 按 [Alt-S] 显示 Screen 下拉菜单。\n  2. 输入 A 表示添加。\n  3. Screen 0 的监视器和显卡图标变为轮廓，而\
    \ Screen 1 会出现两个全彩图标。\n  4. 如果需要对新屏幕的配置进行更改，请参照本章前面描述的操作步骤。\n  5. 使用 [Page Down]\
    \ 和 [Page Up] 键移动到每个屏幕的配置页面。\n\n## 删除屏幕\n\n当删除某个屏幕时，所有屏幕号较高的屏幕会立即向下移动一个槽位。例如：您当前配置了屏幕\
    \ 0、1 和 2，并删除了屏幕 1。该屏幕及其所有配置信息将消失。屏幕 2 随后变为屏幕 1，但保留其自身配置。最终您剩下屏幕 0 和 1。\n\n  1.\
    \ 使用 [Page Down] 或 [Page Up] 键激活您想要删除的屏幕的图标组。\n  2. 按 [Alt-S] 显示 *Screen* 下拉菜单。\n\
    \  3. 输入 D 表示删除。\n  4. 一组 *Monitor* 和 *Graphics Card* 图标消失。较高编号的屏幕（如果有）会立即填补被删除屏幕的空缺。\n\
    \n## 屏幕布局\n\n屏幕布局窗口允许您指定多个屏幕在工作区中的排列方式，以便鼠标在屏幕间移动时行为恰当。\n\n  1. 按 **Alt-S** 显示\
    \ Screen 下拉菜单。\n  2. 输入 *L* 表示布局。\n  3. *屏幕布局* 窗口将出现。\n  4. 按 ← 和 → 查看针对您的屏幕数量的各种布局组合。\n\
    \  5. 当显示您想要的布局时，按 **Enter** 键进行选择。\n\n## 字体路径\n\n如有需要，您可以从 Metro-X 配置实用程序中编辑字体路径。如果您使用字体服务器而非现有字体，或在现有字体之外使用字体服务器，这将是非常必要的。\n\
    \n  1. 按 **Alt-C** 显示 *Configuration* 下拉菜单，然后按 **Enter**。\n  2. *字体路径* 窗口将出现。\n\
    \  3. 根据系统需要编辑该文件。Metro-X 会按照该文件中列出的目录顺序查找字体。如果您使用字体服务器，请将其输入为第一行：\n     ```\n\
    \     tcp/<fontserver machine>:7000\n     ```\n     如果您的端口号不是默认的 *7000*，请将其更改为您系统相应的端口号。\n\
    \  4. 按 **Tab** 键移动至底部按钮并在其中切换，然后按 **Enter** 键选择其中一个。如果信息正确，请选择 *Ok* 按钮。如果您想忽略所做的更改，请选择\
    \ *Cancel* 按钮。如果您编辑了字体路径并希望恢复到原始设置，请选择 *Load Defaults* 按钮。\n\n## 保存并退出\n\n  1.\
    \ 按 [Alt-F] 显示 File 下拉菜单。\n  2. 输入 S 表示 *保存并退出*。\n  3. 您的更改将被保存，Metro-X 配置实用程序将关闭，您的系统现在已准备好运行\
    \ Metro-X！\n\n## 退出不保存\n\n  1. 按 [Alt-F] 显示 File 下拉菜单。\n  2. 输入 Q 表示 *退出*。\n \
    \ 3. 将出现一个预防性对话框：*在退出前保存当前配置？*\n  4. 按 [Tab] 键移动至 *No* 按钮，然后按 [Enter] 键确认您要在不保存更改的情况下退出\
    \ Metro-X 配置实用程序。\n\n有关 Metro X 功能及 X*config* 文件格式的更多详细信息，请参见附录 C。\n\n## 5.4 鼠标配置\n\
    \n要配置鼠标（或在安装后重新配置鼠标），请输入命令 /usr/sbin/mouse*config*。使用方向键向下滚动列表，直到高亮显示您的鼠标类型。如果有任何鼠标连接到\
    \ PS/2 式端口，您应选择“PS/2”作为鼠标类型。如果鼠标连接到 ATI 视频卡上的鼠标端口，您应选择“ATI Bus Mouse”。如果您有一个双按钮鼠标并希望通过同时点击左键和右键来模拟第三个（中间）鼠标按钮，请使用\
    \ [Tab] 键将光标移动到“Emulate 3 Buttons”复选框并按 [Spacebar] 切换选择状态。\n\n## 5.5 Sendmail\n\
    \n默认的 sendmail.cf 文件将被安装到 /etc。默认配置应适用于大多数仅使用 SMTP 的站点。它不适用于 UUCP 站点；如果需要 UUCP\
    \ 邮件传输，您需要生成一个新的 sendmail.cf。要生成新的 sendmail.cf，您需要安装 m4 和 sendmail 源代码包。有关创建 sendmail\
    \ 配置文件的详细信息，请阅读 sendmail 源代码中的 README 文件。此外，O'Reilly & Associates 出版了一本优秀的 sendmail\
    \ 参考书，标题为 *sendmail*，作者是 Bryan Costales。\n\n一种常见的 sendmail 配置是让一台机器充当网络上所有机器的邮件网关。例如，在\
    \ Red Hat Software，我们有一台机器 mail.redhat.com 处理所有的邮件。在那台机器上，我们只需将 mail.redhat.com\
    \ 将处理邮件的机器名称添加到 /etc/sendmail.cw。以下是一个示例：\n\n```\n# sendmail.cw - 在此包含您的机器所有别名。\n\
    torgo.redhat.com\npoodle.redhat.com\ndevel.redhat.com\n```\n\n然后，在其他机器（torgo、poodle\
    \ 和 devel）上，我们需要编辑 /etc/sendmail.cf 以在发送邮件时“伪装”为 mail.redhat.com，并将任何本地邮件处理转发到\
    \ redhat.com。在 /etc/sendmail.cf 中找到 DH 和 DL 行，并按如下方式编辑：\n\n```\n# 我将无限定名称发送到的地方（null\
    \ 意味着本地投递）\nDRmail.redhat.com\n# 谁获取所有本地电子邮件流量\nDHmail.redhat.com\n# 我伪装成谁（null\
    \ 表示不伪装）\nDMredhat.com\n```\n\n使用这种类型的配置，所有发出的邮件看起来像是从 redhat.com 发送的，任何发送到 torgo.redhat.com\
    \ 或其他主机的邮件将被投递到 mail.redhat.com。\n\n请注意，如果配置系统伪装成另一个机器，从您的系统发送到您自己的系统的任何电子邮件都将发送到您所伪装的机器。例如，在上述说明中，由\
    \ cron 守护进程定期发送到 root@poodle.redhat.com 的日志文件将被发送到 root@mail.redhat.com。\n\n##\
    \ 5.6 控制服务访问\n\n作为安全措施，大多数网络服务由一个称为 *TCP wrapper* 的保护性程序管理。受保护的服务是 /etc/inetd.conf\
    \ 中指定 /usr/sbin/tcpd 的那些服务。tcpd 可以根据请求的来源以及 /etc/hosts.allow 和 /etc/hosts.deny\
    \ 中的配置来允许或拒绝对服务的访问。默认情况下，Red Hat Linux 允许所有服务请求。要禁用或限制服务，您可以编辑 /etc/hosts.allow。这是一个\
    \ /etc/hosts.allow 文件的示例：\n\n```\nALL: redhat.com .redhat.com\nin.talkd: ALL\n\
    in.ntalkd: ALL\nin.fingerd: ALL\nin.ftpd: ALL\n```\n\n此配置允许来自 redhat.com 和 *.redhat.com\
    \ 机器的所有连接。它还允许来自所有机器的 talk、finger 和 ftp 请求。\n\ntcpd 使用 /etc/hosts.allow 和 /etc/hosts.deny\
    \ 的组合，允许更复杂的访问控制。有关完整详情，请阅读 tcpd(8) 和 hosts.access(5) 手册页。\n\n## 5.7 匿名 FTP\n\n\
    设置匿名 FTP 很简单。您需要做的就是安装 anon-ftpd rpm 软件包（您可能在安装时已经完成了这一点）。一旦安装完成，匿名 FTP 即可正常运行。\n\
    \n有少数几个文件您可能需要编辑以配置 FTP 服务器。\n\n"
