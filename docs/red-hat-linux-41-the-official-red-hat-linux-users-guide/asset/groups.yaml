    # 附录 C

    ## Metro X


    ### C.1 特殊功能


    #### C.1.1 热键退出


    Metro-X 支持通过热键退出。当您 `.xinitrc` 或 `.xsession` 中的最后一个客户端不提供退出会话的方式时，这有助于终止 X 服务器。退出组合键为
    `Ctrl | Alt | Backspace`。


    #### C.1.2 热键分辨率切换


    在配置 Metro-X 时，您可以选择多种屏幕分辨率。然后，您可以通过按下相应的组合键在 X 服务器运行期间即时更改分辨率。要切换到下一个分辨率，请按 `Ctrl
    | Alt | +`。要切换到上一个分辨率，请按 `Ctrl | Alt | -`。


    #### C.1.3 硬件平移


    Metro-X 支持硬件平移。这允许您将虚拟分辨率设置为高于监视器的物理分辨率。这样，窗口可以延伸到屏幕的物理边界之外，并且可以通过滚动到扩展区域来查看。


    #### C.1.4 多屏幕


    Metro-X 最多支持四个屏幕，所有屏幕都可以通过单个键盘和鼠标同时控制。这允许您运行许多应用程序而不会导致窗口重叠，对于图像处理工作尤其有用。


    在多屏幕配置中，有一个 X 进程、一个鼠标和一个键盘——但有多个屏幕。鼠标/光标可以在不同的屏幕之间移动。客户端使用语法 `–display :0.X` 连接到不同的屏幕，其中
    X 是屏幕编号。


    ##### 支持的卡


    可以使用以下列表中的同一张卡的至多四个：


    - 一个或多个 Matrox MGA Impression Plus

    - 一个或多个 Matrox MGA Ultima Plus

    - 一个或多个 Matrox MGA Millennium


    #### C.1.5 国际键盘


    Metro-X 使用 X 键盘扩展支持各种键盘。键盘描述包含有关键盘物理布局、来自键盘的键代码以及将键代码映射为键符号所需的符号信息。


    Metro-X 提供许多预定义配置，按语言和国家排序。这些配置通过 `configX`（第 5.3.3 节）进行选择。


    ### C.2 Metro X 配置文件


    #### C.2.1 警告


    X 服务器的主配置文件是 **Xconfig**。如果对此文件进行不当修改，Metro-X 的正常功能将受损！除非绝对必要，否则不要编辑 **Xconfig**
    文件。


    #### C.2.2 Xconfig


    Metro-X 按以下顺序在以下位置查找 **Xconfig** 文件：


    ```

    $HOME/Xconfig

    $HOME/.Xconfig

    /etc/X11/Xconfig (仅在 Linux 上)

    /usr/lib/X11/Metro/Xconfig

    ```


    大多数选项通过配置实用程序（**ConfigX**，第 5.3.3 节）进行设置。可以使用编辑器添加额外的选项，并且 **ConfigX** 将保留这些选项。


    #### C.2.3 关键字


    下面列出了 **Xconfig** 关键字的描述。此处按字母顺序排列以便您使用，并在各个条目中注明了任何顺序依赖关系。


    ##### 在配置实用程序中设置的选项


    以下列出的 **Xconfig** 关键字是通过 Metro-X 配置实用程序控制的选项。对这些选项的任何更改都应通过实用程序进行，以避免意外损坏 Metro-X
    的功能。


    **BitsPerPixel** <emph 数字> 某些 X 驱动程序支持打包的每像素 24 位内存组织。这意味着每个像素占用三个字节的视频内存。在这种情况下，<emph
    configX> 插入行：**BitsPerPixel** 24


    **Buttons** <数字> 此项指定鼠标上的按钮数量。此条目必须紧跟在 Xconfig 文件中的 Mouse 条目之后。


    **Card** <字符串> 这指定正在使用的图形卡型号。这仅由 configX 使用。


    **Chipset** <字符串> 这显示服务器使用的芯片组。通常 configX 会将正确的芯片组插入到 Xconfig 文件中。


    **Clocks** <数字> [/<数字>...] 此项包含一个数字列表，指定与卡上的时钟发生器相关的频率。数字以 MHz 为单位指定。


    **Depth** <数字> 这引用屏幕的颜色深度，控制可以显示的颜色数量。不同的卡和驱动程序支持不同的深度值：4、8、16、24 或 32。深度 4 支持
    16 种颜色，深度 32 支持 1600 万种颜色。


    **Dimensions** <宽度> <高度> 此关键字表示屏幕的毫米尺寸，将在收到请求时传递给 X 客户端。


    **DPMSoffDelay** <数字> 这控制屏幕进入 DPMS 关闭模式之前，自最后一次用户输入后的秒数。关闭模式提供最大的电源削减。要激活此模式，X
    服务器禁用发送到监视器的水平和垂直同步信号。


    **DPMSstandbyDelay** <数字> 这控制屏幕进入 DPMS 待机模式之前，自最后一次用户输入后的秒数。待机模式提供最少的电源削减。要激活此模式，X
    服务器禁用发送到监视器的水平同步信号。


    **DPMSsuspendDelay** <数字> 这控制屏幕进入 DPMS 暂停模式之前，自最后一次用户输入后的秒数。暂停模式提供显著的电源削减。要激活此模式，X
    服务器禁用发送到监视器的垂直同步信号。


    **Driver** <字符串> 这引用驱动程序的名称，通常对应于 X 服务器的名称。例如：


    ```

    Driver 8514

    ```


    启动定义 8514 驱动程序的章节。


    **Emulate3Buttons** 此条目用于当双按钮鼠标模拟三按钮鼠标时。此条目必须紧跟在 Xconfig 文件中的 Mouse 条目之后。


    **FontPath** <字符串> FontPath 后跟一个逗号分隔的字体目录字符串。字体目录是包含字体和 fonts.dir 文件的任何目录。


    **HotKeyExit** 此项允许您使用键序列 Ctrl-Alt-Backspace 关闭 X 服务器。如果不存在此关键字，Ctrl-Alt-Backspace
    不会执行任何特殊操作。


    **KbdDesc** <字符串> 引号中的字符串必须与 KeyboardInfo 文件中的某个条目匹配。


    **KbdDescFile** <字符串> 该字符串描述键盘。


    **LogFile** <文件名> X 服务器的错误将记录在此处。


    **Modes** 跟随 Modes 的条目提供显示模式定时信息。如果指定了多个模式，服务器可以在模式之间切换。有关更多详细信息，请参阅 Modes（第 C.2.4
    节）。


    **Monitor** <字符串> 引号中的字符串必须与 MonitorInfo 文件中的某个条目匹配。


    **Mouse** <类型>/<设备> 这描述正在使用的鼠标类型。类型是一个依赖于操作系统的关键字；设备参数通常是必需的，并且是 /dev 目录中的一个文件。


    **MouseDesc** <字符串> 引号中的字符串必须与 MouseInfo 文件中的某个条目匹配。


    **ScreenLayout** <屏幕> <左邻居> <右邻居> <上邻居> <下邻居> <左边缘> <右边缘> <上边缘> <下边缘> 这定义了鼠标光标到达屏幕边缘时的行为。每个配置的屏幕都有一个
    ScreenLayout 条目。*邻居字段告诉将鼠标移动到哪里。值为 -1 表示鼠标应停在边缘处。*边缘字段告诉鼠标将在相应 *邻居 屏幕的哪个边缘出现。屏幕编号从
    0 到 4。边缘编号如下：


    | 边缘 | 编号 |

    |---|---|

    | ENTER_LEFT | 1 |

    | ENTER_RIGHT | 2 |

    | ENTER_UP | 3 |

    | ENTER_DOWN | 4 |


    **图 C.1：** ScreenLayout 边缘编号


    **Virtual** <宽度> <高度> 这指定屏幕的虚拟宽度和高度。如果使用硬件平移，虚拟宽度和高度可以大于物理宽度和高度。


    **Weight** <字符串> 这指定 RGB 颜色规范，具体取决于深度值。当深度值为 16 时，选项为：


    - R5:G5:B5（默认）或

    - R5:G6:B5


    当深度值为 32 时，选项为：


    - R8:G8:B8（默认）或

    - B8:G8:R8


    当深度值为 4 或 8 时，忽略权重值。


    **XscreenSaverDelay** 这控制屏幕变黑之前没有输入操作的秒数。


    ##### 未在配置实用程序中设置的选项


    以下关键字控制未通过配置实用程序设置的选项，需要手动编辑 Xconfig 文件。


