    ## 6.1.2 软件包文档


    -   按 **Enter** 键逐行向下翻页

    -   按 **Space** 键逐页向下翻页

    -   按 b 键向上回退一页

    -   输入 / 后跟字符串并按 **Enter** 键搜索字符串

    -   按 n 查找上一个搜索词的下一个匹配项


    有时候在终端上查看 man 页并不是很方便。如果你有可用的打印机，也可以打印 man 页。如果你没有 Postscript 打印功能，只想打印 ASCII，可以使用以下命令打印
    man 页：


    ```

    man COMMAND | lpr

    ```


    如果你有 Postscript 打印机，你可能希望使用以下命令进行打印：


    ```

    man -t COMMAND | lpr

    ```


    在上述两个命令中，请将“COMMAND”替换为你想要获取帮助的命令。


    此外，有时候某些内容拥有不止一个 man 页。下表列出了各章节包含的内容：


    | 章节 | 内容 |

    | :--- | :--- |

    | 1 | 用户命令 |

    | 2 | 系统调用 |

    | 3 | 库函数调用 |

    | 4 | 设备文件 |

    | 5 | 文件格式 |

    | 6 | 游戏 |

    | 7 | 杂项 |

    | 8 | 系统命令 |

    | 9 | 内核内部结构 |


    假设你想查看 **swap on** 的 man 页，你执行了 **man swap on**。实际上，你得到的是系统调用 **swap on(2)** 的
    man 页，这是你在 C 程序中用于开启 swap 的函数。除非你在编写自己的程序来执行此操作，否则这可能不是你想得到的。因此，根据上表，你可以看到你想要的可能是“系统命令”，位于第
    8 章。然后你可以执行 man 8 swapon。这一切是因为 man 按照顺序搜索 man 目录，并在找到第一个匹配项时返回。


    你也可以在 man 页中搜索字符串。使用 man -k string-to-search-for 来执行此操作。但是，除非 makewhatis 数据库已创建，否则此操作无效。在
    Red Hat Linux 中，这由夜间运行的 cron 任务完成。如果你没有让系统整夜运行，数据库就不会被创建。如果是这种情况，只需运行：


    ```

    /etc/cron.weekly/makewhatis.cron

    ```


    注意：此操作必须以 root 身份执行。


    完成上述步骤后，你可以输入 man -k swapon。该命令将返回：


    ```

    # man -k swapon

    swapon, swapoff (2) - start/stop swapping to file/device

    swapon, swapoff (8) - enable/disable devices and files for paging and swapping

    ```


    因此，你可以看到第 2 章和第 8 章都有涉及 swapon（在此情况下还包括 swapoff）的文档页。


    ### 6.1.2 软件包文档


    许多软件包包含 README 和其他文档作为源软件包的一部分。Red Hat Linux 使用标准位置来安装这些文档，因此你无需安装源代码即可查看这些文档。所有这些文档都存储在
    /usr/doc 的子目录中。子目录取决于软件包。每个带有额外文档的软件包都会创建一个名为 packagename-version-releasenumber
    的目录。例如，tin 软件包可能是版本 1.22，发布号为 2。其文档路径将是 /usr/doc/tin-1.22-2。


    在很大程度上，此目录中的文档是 ASCII 格式。通常你可以使用 more filename 或 less filename 来查看它们。这很好，但如果你想知道某个特定命令或文件是否有文档，却不知道它来自哪个软件包怎么办？这没关系！你只需输入：


    ```

    rpm -qdf /etc/sendmail.cf

    ```


    这将报告包含文件 /etc/sendmail.cf 的软件包中的所有文档。RPM-HOWTO 中更详细地介绍了此类命令，可从 www.redhat.com
    获取。


    另外，如果你需要帮助的是一条命令，而 man 页不够清晰怎么办？你可以执行类似以下操作：


    ```

    rpm -qdf ‘which COMMAND’

    ```


    再次说明，“COMMAND”是你需要帮助的实际命令。只有当该命令在你的路径中时，此操作才有效。


    ### 6.1.3 HOWTO 和 FAQ


    Linux 文档项目（LDP）的大部分内容都可在系统的 /usr/doc 目录下找到。


    /usr/doc/HOWTO 包含在我们制作 CD-ROM 时所有可用的 ASCII 格式 HOWTO 文档。它们经过了 gzip 压缩，因此你需要使用 gunzip
    解压，或使用如下命令：


    ```

    zcat HAM-HOWTO.gz | more

    ```


    后者可以工作，但比解压后使用 more 的灵活性略低。不过，除非你在完成后重新将文档压缩为 gzip 格式，否则解压也会占用更多的磁盘空间。


    /usr/doc/HOWTO/mini 包含所有可用的迷你 HOWTO 的 ASCII 版本。它们未压缩，可以使用 more 或 less 查看。/usr/doc/HTML
    包含所有 HOWTO 以及 Linux 安装和入门指南的 HTML 版本。要查看这些内容，只需使用如 Red Hat Software 的 Red Baron
    或 arena 等 WWW 浏览器即可。你可以执行类似以下操作：


    ```

    cd /usr/doc/HTML

    arena index.html

    ```


    /usr/doc/FAQ 包含一些热门 FAQ（包括 RedHat-FAQ）的 ASCII 版本（以及一些 HTML 版本）。所有这些都可以使用 more
    或 less 查看。


    ### 6.1.4 "locate" 命令


    当你不知道某个命令或文件的完整名称但需要找到它时，通常可以使用 locate 来查找。locate 使用数据库来查找系统上的所有文件。通常，此数据库由每晚的
    cron 任务构建。然而，如果你的机器并非始终启动进入 Linux，这种情况就不会发生。因此，如果是这种情况，你可能偶尔需要运行以下命令：


    ```

    /etc/cron.daily/updatdb.cron

    ```


    执行此操作时需要系统具有 root 权限。这将确保 locate 正常工作。


    例如，如果你知道需要查找所有 "finger" 文件，可以运行：


    ```

    locate finger

    ```


    它应该会返回类似以下内容：


    ```

    /usr/bin/finger

    /usr/lib/rc/script/finger

    /usr/man/man1/finger.1

    /usr/man/man8/in.fingd.8

    /usr/sbin/in.fingerd

    ```


    然而，有一点需要注意：locate 不仅基于文件名返回匹配项，还基于路径名返回。因此，如果你的系统上有一个 /home/djb/finger/ 目录，它将与该目录中的所有文件一起被返回。


    ### 6.1.5 "info" 页


    虽然 man 是最普遍的文档格式，但 info 功能强大得多。它提供了超文本链接，使阅读大型文档变得容易得多，并为文档编写者提供了许多功能。关于 Red Hat
    的各个方面（特别是 GNU 项目部分）有一些非常完整的 info 文档。


    要阅读 info 文档，请在不带任何参数的情况下使用 info 程序。它会向你展示可用文档的列表。如果它找不到某项内容，可能是因为未安装包含该文档的软件包。使用
    RPM 安装它并再次尝试。


    如果你习惯使用 emacs，它内置了一个用于 info 文档的浏览器。使用 Ctrl-h Ctrl-i 即可查看。


    info 系统是基于超文本的系统。出现的任何高亮文本都是指向更多信息的链接。使用 Tab 键将光标移动到链接处，按 Enter 键跟随链接。按 p 返回上一页，n
    移动到下一页，u 向上一级文档导航。要退出 info，请按下 Ctrl-x Ctrl-c（control-x 后跟 control-c）。


    学习如何使用 info 的最佳方法是阅读关于它的 info 文档。如果你阅读 info 呈现的第一个屏幕，你将能够入门。


    ## 6.2 来自互联网社区的帮助


    ### 6.2.1 Red Hat 邮件列表


    如果你无法在线找到关于你问题的帮助，并且拥有 WWW 访问权限，你应该查看 http://www.redhat.com/mailing-list.html。在这里，你可以搜索
    redhat-list 的存档。几乎所有的问题在那里都已经得到解答。


    如果你已经尝试了所有寻找帮助的途径，那么你的下一个最佳选择是在 Red Hat 邮件列表上寻求帮助。获取最新信息，请访问 http://www.redhat.com/mailing-list.html。


    我们每个列表的请求地址是：


    ```

    redhat-list-request@redhat.com

    redhat-digest-request@redhat.com

    redhat-announce-list-request@redhat.com

    redhat-devel-list-request@redhat.com

    rpm-list-request@redhat.com

    arp-list-request@redhat.com

    sparc-list-request@redhat.com

    ```


    要订阅，请发送电子邮件给你想要订阅的列表地址，并在主题（Subject:）行中输入 subscribe。


    要取消订阅，请发送电子邮件给你想要取消订阅的列表地址，并在主题（Subject:）行中输入 unsubscribe。


    然后，要向列表发送电子邮件，你只需将其发送到上述不带 -request 的名称地址即可。唯一的例外是 redhat-digest，它只是 redhat-list
    的摘要版本。在这种情况下，地址是 redhat-list@redhat.com。


    ### 6.2.2 USENET 新闻组


    另一个很好的帮助来源是 USENET 上的 comp.os.linux 层级结构。如果你熟悉新闻组，你应该去看看。未来将会有一份"使用新闻组"的技巧文档，以协助不熟悉
    Usenet 的用户。


    '
