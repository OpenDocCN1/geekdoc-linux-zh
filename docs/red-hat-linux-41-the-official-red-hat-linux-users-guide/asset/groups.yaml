    \ modified in any way.\n\nThere is one module included with Red Hat Linux which\
    \ we include for the sake of completeness, but which we do not yet recommend using\
    \ except on an experimental basis: `pam_pwdb.so`. The `pwdb` package and `pam_pwdb.so`\
    \ module are currently alpha-quality software, but have interesting capabilities\
    \ that you may wish to experiment with. They are **unsupported** by Red Hat Software\
    \ at this time.\n\n### 10.4.2 Services\n\nEach program which uses PAM defines\
    \ its own “service” name. The login program defines the service type `login`,\
    \ `ftp` defines the service type `ftp`, etc. In general, the service type is the\
    \ name of the program used to *access* the service, not (if there is a difference)\
    \ the program used to *provide* the service.\n\n### 10.4.3 The Configuration File\n\
    \nThe file `/etc/pam.conf` is used to configure all PAM applications. Each application\
    \ (really, each **service**) has its own “stanza”. A stanza looks like this:\n\
    \n```\n# login authorization\nlogin auth required /lib/security/pam_secrety.so\n\
    login auth required /lib/security/pam_unix_auth.so\nlogin auth required /lib/security/pam_nologin.so\n\
    login account required /lib/security/pam_unix_acc.so\nlogin password required\
    \ /lib/security/pam_unix_passwd.so\nlogin session required /lib/security/pam_unix_session.so\n\
    ```\n\nThe first line is a comment. Any line that starts with a `#` character\
    \ is a comment. The next three lines stack up three modules to use for login authorization.\
    \ The first makes sure that *if* the user is trying to log in as root, the `tty`\
    \ on which they are logging in is listed in the `/etc/secrety`\n"
