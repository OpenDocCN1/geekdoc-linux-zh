    # 2.4.18 Installing LILO


    In order to be able to boot your Red Hat Linux system, you usually need to install
    LILO (the LIinux LOader). You may install LILO in one of several places:


    **The Master Boot Record (MBR)** is the recommended place to install LILO, unless
    another operating system loader (e.g., System Commander or OS/2''s Boot Manager)
    is already installed there. When your machine boots, LILO starts and presents
    the boot: prompt; you can boot Red Hat Linux or any other operating system you
    configure LILO to boot (see below).


