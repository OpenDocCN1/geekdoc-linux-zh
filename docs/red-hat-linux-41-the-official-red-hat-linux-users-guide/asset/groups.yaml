    ## 2.4.18 安装 LILO


    为了能够启动你的 Red Hat Linux 系统，通常需要安装 LILO（LIinux LOader，Linux 加载器）。你可以将 LILO 安装在以下几个位置之一：


    - **主引导记录（MBR）** 是安装 LILO 的推荐位置，除非该位置已经安装了其他操作系统加载器（例如 System Commander 或 OS/2
    的启动管理器）。当机器启动时，LILO 将启动并显示 boot: 提示符；你可以启动 Red Hat Linux 或任何配置 LILO 启动的其他操作系统（见下文）。


    - **根分区的第一个扇区** 如果你系统中已经使用了其他启动加载器（如 OS/2 的启动管理器），则推荐选择此处；这样你可以配置该启动加载器来启动 LILO
    并引导 Red Hat Linux。


    - **软盘的第一个扇区** 是上述任一选项的替代方案；若要启动 Red Hat Linux，请将 LILO 软盘插入机器的软盘驱动器并重新启动。LILO
    将从软盘启动并显示 boot: 提示符。


    选择你要安装 LILO 的位置，然后按 **确定**。如果你不想安装 LILO，请按 **跳过**。


    ## LILO 的限制


    LILO 受到大多数 PC BIOS 的一些限制。如果你想在硬盘上安装 LILO，你的根分区必须位于以下位置（“规则”）：


    1. 如果你有 2 个 IDE（或 EIDE）硬盘，你的根分区必须位于其中之一。这也包括主控制器上的任何 IDE CD-ROM 驱动器。如果你有一个 IDE
    硬盘和一个 IDE CD-ROM 位于主控制器上，你必须将根分区安装在硬盘上。

    2. 如果你有一个 IDE（或 EIDE）硬盘和一个或多个 SCSI 硬盘，你的根分区必须位于 IDE 硬盘或 ID 为 0 的 SCSI 硬盘上。其他 SCSI
    ID 均不适用。

    3. 如果只有 SCSI 硬盘，你的根分区必须位于 ID 为 0 或 ID 为 1 的硬盘上。其他 SCSI ID 均不适用。

    4. 在任何情况下，你的 Linux 内核（以及，如果你使用 SCSI 适配器，初始 ramdisk）必须位于柱面 1023 以下。对于 IDE（或 EIDE）硬盘，这通常意味着位于
    512 MB 标记以下；对于 SCSI 硬盘，通常位于 1 GB 标记以下。确保此条件最简单（且推荐）的方法是确保整个根分区位于柱面 0–1023 之间。某些较新的
    BIOS 没有此限制。


    ## 为 LILO 启动命令行添加选项


    最后，安装程序将询问你是否希望为 LILO 启动命令添加默认选项。你输入的任何选项都将在每次 Linux 内核启动时传递给内核。完成后按 **确定**。


    ## LILO 的替代方案


    如果你不希望使用 LILO 来启动你的 Red Hat Linux 系统，有几种替代方案：


    LOADLIN 可以从 MS-DOS 加载 Linux；不幸的是，它需要在 MS-DOS 分区上提供 Linux 内核的副本（如果你使用 SCSI 适配器，还需要初始
    ram 盘）。实现此目的的唯一方法是使用其他方法（例如从软盘上的 LILO）启动你的 Red Hat Linux 系统，然后将内核复制到 MS-DOS 分区。LOADLIN
    可从 ftp://sunsite.unc.edu/system/Linux-boot/ 及 sunsite 的各种镜像站点获取。


    SYSLINUX 是一个与 LOADLIN 非常相似的 MS-DOS 程序；它也可从 ftp://sunsite.unc.edu/system/Linux-boot/
    及 sunsite 的各种镜像站点获取。


    一些商业启动加载器，如 System Commander，能够启动 Linux（但可能仍要求在你的 Linux 根分区中安装 LILO）。


    ## 2.4.19 完成...或开始


    完成 LILO 安装后，安装程序将重启你的系统。请不要忘记从软盘驱动器中取出安装软盘。


    在 boot: 提示符处，按 Enter 并观看你的 Red Hat Linux 系统启动。当显示 login: 提示符时，输入 root；在 Password:
    提示符处，输入你在第 2.4.17 节中为你的机器设置的 root 密码。


    ## 第 3 章


    # 安装 Red Hat Linux/Alpha


    ## 3.1 简介


    这是针对 Digital Equipment Corporation 的 Alpha 系列处理器上的 Red Hat Linux/Alpha 4.1 版本的简要安装说明。本章描述了安装
    Red Hat Linux/Alpha 与 Red Hat Linux/Intel 之间的差异。有关安装程序的更多详情，请参见第 2 章，安装 Red Hat
    Linux/Intel。


    ## 3.2 支持的硬件


    Red Hat Linux/Alpha 支持基于 Alpha 处理器和 PCI 总线的多种硬件。已知支持此版本的平台包括：


    1. AlphaPC64 (Cabriolet, Aspen Telluride)

    2. AxpPCI33 (Noname)

    3. EB64+ (Aspen Alpine)

    4. EB66 (NekoTech Mach 1)

    5. EB66+

    6. Jensen (DEC PC 150, 2000 model 300, Culean)

    7. Univeral Desktop Box (UDB, 有时称为 Multia)。这只是一个非名牌主板，在此文档的其余部分将其视为非名牌主板处理。

    8. AlphaStation 200, 250, 255, 400 (Avanti machines)

    9. EB164 (Aspen Avalanche, Timberline, Summit; Microway Screamer)

    10. Kinetics 的 Platform 2000 机器

    11. PC164 机器 (Durango)

    12. Alcor 类型机器 (AlphaStation 500, 600; Maverick, Brett)

    13. Alpha-XL

    14. Alpha-XLT (XL 300, XL 366)

    15. Mikas 类型机器 (AlphaServer 1000), 不支持 1000A)


    除了 Jensen 之外的所有那些平台都包含 NCR 810 SCSI 控制器，虽然 BusLogic PCI SCSI 控制器（FlashPoint 除外）、Adaptec
    AHA2940 SCSI 控制器和 Qlogic 1020 ISP 控制器也受到支持。Jensen 设计使用 AHA1740 SCSI 控制器并受支持。


    支持 NE2000、DE422 和 DE4x5 (PCI) 以太网卡。这包括 UDB 的内部以太网硬件。内核中还包括令牌环支持。


    X 窗口系统应在除 Jensen 机器以外的任何使用基于 S3 的视频卡的机器上正常工作。可从 ftp://ftp.azstarnet.com 的 /pub/linux/axp/jensen
    目录获取 S3 卡的服务器。TGA 服务器（例如在 UDB 上有效）可在你的 Red Hat Linux/Alpha CD 的 X11 目录中找到。Orchid
    和 Number 9 的大多数卡都能工作。大多数 Diamond Stealth 卡也受到支持。Digital TGA 卡（基于 DC21030 芯片）在
    8 位模式下受支持，并且还提供了用于 Mach64 卡的 X 服务器。


    有关 Alpha 硬件的更多信息见附录 D。


    ## 3.3 安装迷你加载器 MILO


    启动 Red Hat Linux/Alpha 的最简单方法是通过 Linux 迷你加载器 MILO。你可以直接从系统固件加载 MILO，或者使用 ARC 控制台将
    MILO 作为替代操作系统加载。有关这些过程的详情见 MILO FAQ，该文档作为附录 E 提供。


    完整的 MILO 树位于 CD 的 *milo* 目录中。它包含制作此 CD 时可用的最新文档和 MILO 镜像。然而，MILO 的后续版本定期在 *gatekeeper.dec.com*
    上提供。*images/arc* 目录还包含可用于 ARC 控制台直接启动到 MILO 的软盘镜像。它们包含 MILO 和 **load.exe**，以及支持
    MILO 刷写的平台可用的 MILO 可刷写版本和刷写管理实用程序。如果你在 MILO 方面遇到困难，首先尝试使用更新版本的 MILO。


    如果你的机器不支持 MILO，你需要直接从 SRM 控制台启动软盘或 CD。有关如何操作的信息可从 Red Hat Software 网站获取，网址为 `http://www.redhat.com/linux-info/alpha/faq`。


    ## 3.4 安装 Red Hat Linux/Alpha


    ### 3.4.1 制作启动盘


    安装 Red Hat Linux/Alpha 的第一步是创建启动盘；使用哪个启动盘取决于你拥有的硬件。各种启动盘镜像在 Red Hat Linux/Alpha
    CD 的 *images* 目录中可用，其中还包含一个 README，提供有关可用各种镜像的更多信息。


    可用的启动镜像包括：


    1. `cab.img` (AlphaPC64, Cabriole)

    2. `noname.img` (AxpPCI33, Noname, Universal Desktop Box)

    3. `eb64p.img` (EB64+, Aspen Timberlines)


