  - '[PAGE 157]


    That looks *almost* like the login entry, but there’s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, `pam_security.so` keeps root logins from happening on insecure terminals.
    This effectively disallows all root login attempts. If you wish to allow them
    (in which case we recommend that you either not be internet-connected or be behind
    a good firewall), you can simply remove that line.


    Second, `pam_nologin.so` checks `/etc/nologin`, as specified above.


    Third, if `pam_rhosts_auth.so` authenticates the user, PAM immediately returns
    success to rlogin without any password checking being done. If `pam_rhosts_auth.so`
    fails to authenticate the user, that failed authentication is ignored.


    Finally (if `pam_rhosts_auth.so` has failed to authenticate the user), normal
    unix password authentication is performed.


    # 10.4.4 The Default Stanza


    When packages containing applications which use PAM are installed, they automatically
    add stanzas to `/etc/pam.d`. Whenever possible, they don’t specify what modules
    to use—they just copy whatever has been put in the DEFAULT stanza near the top
    of `/etc/pam.conf`. By changing that stanza, you can change the default entries
    used by most applications. If you do this, you will need to check `/etc/pam.conf`
    after you add new PAM-aware applications to make sure that the stanza that was
    added fits your system.


    # 10.4.5 Shadow Passwords


    The default `pam_unix.*.so` modules can support shadow passwords. In order to
    convert your system to shadow passwords, use these commands:


    ```

    ```

    cd /etc

    pwconv5

    chmod 600 passwd- shadow-

    ```

    ```


    The `pam_unix.*.so` modules will automatically detect that you are using shadow
    passwords and make all necessary adjustments.'
