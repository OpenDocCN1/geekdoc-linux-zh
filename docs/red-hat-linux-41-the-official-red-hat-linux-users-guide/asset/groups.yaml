    \    ```\n    The output is:\n    ```\n    /usr/man/man6/koules.6\n    /usr/lib/games/kouleslib/start.raw\n\
    \    /usr/lib/games/kouleslib/end.raw\n    /usr/lib/games/kouleslib/destroy2.raw\n\
    \    /usr/lib/games/kouleslib/destroy1.raw\n    /usr/lib/games/kouleslib/creator2.raw\n\
    \    /usr/lib/games/kouleslib/creator1.raw\n    /usr/lib/games/kouleslib/colize.raw\n\
    \    /usr/lib/games/kouleslib\n    /usr/games/koules\n    ```\n\nThese are just\
    \ several examples. As you use the system you will find many more uses for rpm.\n\
    \n## 7.4 Other RPM Resources\n\nFor more information on RPM, check out the man\
    \ page, the help screen (`rpm --help`), and the RPM documents available at\n\n\
    ```\nftp://ftp.redhat.com/pub/code/rpm\n```\n\nAs mentioned earlier there will\
