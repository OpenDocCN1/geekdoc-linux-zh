    \ info on special hardware that is supported by the kernel directly, including\
    \ SCSI devices, see the Hardware-HOWTO and the SCSI-HOWTO (in the same place as\
    \ above). There is also an XFree86 HOWTO and a MetroCards file that list supported\
    \ video cards.\n\nA 1.44M floppy drive connected as the first physical floppy\
    \ device (`a1`) is required. Here are the requirements for various popular combinations\
    \ of software:\n\n**Minimum Text Based Installation**\n\n- 386sx or better CPU\n\
    - 8M RAM\n- 40M Hard Drive\n- Any working video card (Hercules, CGA, VGA, SVGA,\
