    +   4. EB66 (NekoTech Mach 1)

    +   5. EB66+

    +   6. Jensen (DEC PC 150, 2000 model 300, Culean)

    +   7. Univeral Desktop Box (UDB, sometimes called Multia). This is just a noname
    board and is treated as such for the rest of this document.

    +   8. AlphaStation 200, 250, 255, 400 (Avanti machines)

    +   9. EB164 (Aspen Avalanche, Timberline, Summit; Microway Screamer)

    +   10. Platform 2000 machines from Kinetics

    +   11. PC164 machines (Durango)

    +   12. Alcor type machines (AlphaStation 500, 600; Maverick, Brett)

    +   13. Alpha-XL

    +   14. Alpha-XLT (XL 300, XL 366)

    +   15. Mikas type machines (AlphaServer 1000), 1000A not supported)


    All of those platforms except the Jensen include an NCR 810 SCSI controller, though
    BusLogic PCI SCSI controllers (other than the FlashPoint), the Adaptec AHA2940
    SCSI controller, and Qlogic 1020 ISP controllers are also supported. The Jensen
    design uses an AHA1740 SCSI controller and is supported.


