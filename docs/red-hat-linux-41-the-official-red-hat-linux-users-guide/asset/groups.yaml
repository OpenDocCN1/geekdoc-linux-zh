    \ info@redhat.com 以获取自动回复（非常有用……真的）。你也可以浏览\n\nftp://ftp.redhat.com 和 http://www.redhat.com\
    \ 以获取新公告和产品信息。\n\n### F.2.2 Red Hat Linux 提供哪些媒体？\n\n目前，它可以通过 CD 和 FTP 获取。要了解从哪里\
