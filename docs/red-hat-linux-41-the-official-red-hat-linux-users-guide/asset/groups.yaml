    176 APPENDIX D. INTRO TO ALPHA SYSTEMS AND PROCESSORS


    # ## D.5 A Few Notes On Clocking


    All of the current Alpha CPUs use high-speed clocks, because their microarchitectures
    have been designed as so-called short-stick designs. None of the system busses
    have to run at horrendous speeds as a result though:


    +   - on the 21066(A), 21064(A), 21164 the off-chip cache (Beache) timing is completely
    programmable, to the resolution of the CPU clock. For example, on a 275MHz CPU,
    the Beache read access time can be controller with a resolution of 3.6ns

    +   - on the 21066(A), the DRAM timing is completely programmable, to the resolution
    of the CPU clock (*not* the PCI clock, the CPU clock).

    +   - on the 21064(A), 21164(A), the system bus frequency is a sub-multiple of
    the CPU clock frequency. Most of the 21064 motherboards use a 33MHz system bus
    clock.

    +   - Systems that use the 21066 can run the PCI at any frequency relative to
    the CPU. Generally, the PCI runs at 33MHz.

    +   - Systems that use the APECS chipset (see Section D.6) always have their CPU
    system bus equal to their PCI bus frequency. This means that both busses tends
    to run at either 25MHz or 33MHz (since these are the frequencies that scale up
    to match the CPU frequencies). On APECS systems, the DRAM controller timings are
    software programmable in terms of the CPU system bus frequency


    *Aside:* someone suggested that they were getting bad performance on a 21066 because
    the 21066 memory controller was only running at 33MHz. Actually, it’s the superfast
    21064A systems that have memory controllers that ‘only’ run at 33MHz.


    # ## D.6 The chip-sets


    DS sells two CPU support chipsets. The 2107x chipset (aka APECS) is a 21064(A)
    support chipset. The 2117x chipset (aka ALCOR) is a 21164 support chipset. There
    will also be 2117xA chipset (aka ALCOR 2) as a 21164A support chipset.'
  - '[PAGE 190]


    Both chipsets provide memory controllers and PCI host bridges for their CPU. APECS
    provides a 32-bit PCI host bridge, ALCOR provides a 64-bit PCI host bridge which
    (in accordance with the requirements of the PCI spec) can support both 32-bit
    and 64-bit PCI devices.


    APECS consists of 6, 208-pin chips (4, 32-bit data slices (DECATE), 1 system controller
    (COMANCHE, CIA) 1 PCI controller (EPIC)). It provides a DRAM controller (128-bit
    memory bus) and a PCI interface. It also does all the work to maintain memory
    coherence when a PCI device DMAs into (or out of) memory.


    ALCOR consists of 5 chips (4, 64-bit data slices (Data Switch, DSW) - 208-pin
    PQFP and 1 control (Control, I/O Address, CIA) - a 433 pin plastic PGA). It provides
    a DRAM controller (256-bit memory bus) and a PCI interface. It also does all the
    work required to support an external Beache and to maintain memory coherence when
    a PCI device DMAs into (or out of) memory.


    There is no support chipset for the 21066, since the memory controller and PCI
    host bridge functionality are integrated onto the chip.


    # ## D.7 The Systems


    The applications engineering group in DS produces example designs using the CPUs
    and support chipsets. These are typically PC-AT size motherboards, with all the
    functionality that you''d typically find on a high-end Pentium motherboard. Originally,
    these example designs were intended to be used as starting points for third-parties
    to produce motherboard designs from. These first-generation designs were called
    Evaluation Boards (EBs). As the amount of engineering required to build a motherboard
    has increased (due to higher-speed clocks and the need to meet RF emission and
    susceptibility regulations) the emphasis has shifted towards providing motherboards
    that are suitable for volume manufacture.


    Digital''s systems groups have produced several generations of machines using
    Alpha processors. Some of these systems use support logic that is designed by
    the systems groups, and some use commodity chipsets from DS. In some cases, systems
    use a combination of both.


    Various third-parties build systems using Alpha processors. Some of these companies
    design systems from scratch, and others use DS support chipsets,'
  - '[PAGE 191]


    clone/modify DS example designs or simply package systems using build and tested
    boards from DS.


    The EB64: Obsolete design using 21064 with memory controller implemented using
    programmable logic. I/O provided by using programmable logic to interface a 486
    (> ISA bridge chip. On-board Ethernet. SuperI/O (2S, 1P, FD), Ethersnet and ISA.
    PC-AT size. Runs from standard PC power supply.


    The EB64+: Uses 21064 or 21064A and APECs. Has ISA and PCI expansion (3 ISA, 2
    PCI, one pair are on a shared slot). Supports 36-bit DRAM SIMs. ISA bus generated
    by Intel SaturnI/O PCI-ISA bridge. On-board SCSI (NCR 810 on PCI) Ethernet (Digital
    21040), KBD, MOUSE (PS2 style), SuperI/O (2S, 1P, FD), RTC/NVRAM. Boot ROM is
    EPROM. PC-AT size. Runs from standard PC power supply.


    The EB66: Uses 21066 or 21066A. I/O sub-system is identical to EB64+. Baby PC-AT
    size. Runs from standard PC power supply. The EB66 schematic was published as
    a marketing poster advertising the 21066 as “the first microprocessor in the world
    with embedded PCI” (for trivia fans: there are actually 2 versions of this poster
    - 1 drew the circuits and wrote the spiel for the first version, and some Americans
    mangled the spiel for the second version)


    The EB164: Uses 21164 and ALCOR. Has ISA and PCI expansion (3 ISA slots, 2 64-bit
    PCI slots (one is shared with an ISA slot) and a 2.32-bit PCI slots. Uses plus-in
