    \ upon your hardware and personal preferences there are three methods available\
    \ to configure the kernel.\n\n- **make config** An interactive text program. Components\
    \ are presented and you answer with **Y** (yes), **N** (no), or **M** (module).\n\
    - **make menuconfig** A graphic, menu driven program. Components are presented\
    \ in a menu of categories, you select the desired components in the same manner\
    \ used in the Red Hat Linux installation program. Toggle the tag corresponding\
    \ to the item you want included; **Y** (yes), **N** (no), or **M** (module).\n\
    - **make xconfig** An X Windows program. Components are listed in different levels\
    \ of menus, components are selected using a mouse. Again, select **Y** (yes),\
    \ **N** (no), or **M** (module).\n\nIn order to use **kernel** (see Section 8.6\
    \ for details) and kernel modules you must answer **Yes** to **kernel support**\
