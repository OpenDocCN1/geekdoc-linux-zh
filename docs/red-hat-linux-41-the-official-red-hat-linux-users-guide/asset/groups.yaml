    \ |\n| AGX | 所有 XGA 图形板 |\n| P9000 | Diamond Viper（但不是 9100）及其他 |\n\n图 5.1: X\
    \ 服务器\n\n#### 完成\n\n如果你之后想增加显示器的刷新率，你可以手动编辑配置文件，或者再次运行 `Xconfigurator` 并从我们的列表中选择一个更贴近你显示器规格的显示器。\n\
    \n最后的配置步骤包括选择你想包含在你的 `XF86config` 文件中的视频模式。使用方向键在每种颜色深度（8、16 和 24 位）下方的列表中上下移动光标。使用\
