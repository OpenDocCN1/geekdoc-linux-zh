    \ XFree86 Supported Video card (VGA, and SVGA, see below)\n- Mouse (most types\
    \ are supported)\n- Any supported CD-ROM drive\n\n**Recommended Configuration**\n\
    \n- 486dx or better CPU\n- 16M RAM\n- 300M Hard Drive\n- Any SVGA Card Supported\
    \ by XFree86 or Metro X\n- 3 Button Mouse\n- SCSI Tape Drive (Optional)\n- UPS\
    \ (Optional)\n- Double Spin CD-ROM drive\n\nSupported video cards include:\n\n\
    - Most Diamond Cards\n- Most S3 Based Cards\n- ET4000 Based Cards\n- ATI Cards\n\
    - Cirrus Logic 542x and 543x\n- Chips and Technologies Based Cards\n- Trident\
    \ 8900 and 9400\n- Most #9 Cards\n\nSupported CD-ROM drives include:\n\n- All\
    \ IDE/ATAPI Compliant Drives\n- All SCSI Drives connected to a supported controller\
    \ card\n- All Sound Blaster Interface Drives (Matsushita/Kotobuki/Panasonic)\n\
    - Mitsumi Drives\n- Sony 535, CDU 31, CDU 33\n\n## Appendix B\n\n### Module parameters\n\
    \nThis appendix is provided to illustrate *some* of the possible parameters that\
    \ *may* be needed by certain kernel modules. It should be noted that in most cases\
    \ the use of additional parameters is not needed.\n\n#### B.1 CD-ROM parameters\n\
    \n| Hardware | Parameter |\n| --- | --- |\n| Mitsumi CD-ROM | mcd=port,irq |\n\
