    双击图标会启动一个工具。请注意，您可以启动任何工具的两个实例，但这通常是个非常坏的主意，因为您可能试图在两个地方编辑相同的文件，最终导致覆盖自己的更改。如果您不小心启动了工具的第二个副本，应立即退出。此外，当工具运行时，不要手动编辑由控制面板工具管理的任何文件。类似地，当工具运行时，不要运行可能更改这些文件的其他程序。\n\
    \n## 8.1 用户和组配置\n\n图 8.1 所示的工具用于管理系统中的用户和组。从某种意义上说，它是 /etc/passwd 和 /etc/group\
