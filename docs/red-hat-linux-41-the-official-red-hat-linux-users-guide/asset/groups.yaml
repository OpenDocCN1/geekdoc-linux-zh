    # D.5 关于时钟的一些说明


    目前所有的 Alpha CPU 都使用高速时钟，因为其微架构被设计为所谓的短棒（short-stick）设计。因此，系统总线无需以极快的速度运行：


    -   在 21066(A)、21064(A) 和 21164 上，片外缓存（Beache）定时是完全可编程的，精度达到 CPU 时钟级别。例如，在 275MHz
    的 CPU 上，Beache 读取访问时间可以以 3.6ns 的精度进行控制。

    -   在 21066(A) 上，DRAM 定时是完全可编程的，精度达到 CPU 时钟级别（*不是* PCI 时钟，而是 CPU 时钟）。

    -   在 21064(A)、21164(A) 上，系统总线频率是 CPU 时钟频率的亚倍数。大多数 21064 主板使用 33MHz 的系统总线时钟。

    -   使用 21066 的系统可以以相对于 CPU 的任意频率运行 PCI。通常，PCI 以 33MHz 运行。

    -   使用 APECS 芯片组（参见 D.6 节）的系统，其 CPU 系统总线始终等于 PCI 总线频率。这意味着两个总线倾向于以 25MHz 或 33MHz
    运行（因为这些频率可以倍增至匹配 CPU 频率）。在 APECS 系统中，DRAM 控制器定时可根据 CPU 系统总线频率进行软件编程。


    *注：* 有人建议他们在 21066 上性能不佳是因为 21066 内存控制器仅以 33MHz 运行。实际上，是那些超高速的 21064A 系统其内存控制器“仅”以
    33MHz 运行。


    # D.6 芯片组


    DS 销售两种 CPU 支持芯片组。2107x 芯片组（又名 APECS）是 21064(A) 的支持芯片组。2117x 芯片组（又名 ALCOR）是 21164
    的支持芯片组。还将有 2117xA 芯片组（又名 ALCOR 2）作为 21164A 的支持芯片组。


    两种芯片组都为各自的 CPU 提供内存控制器和 PCI 主机桥。APECS 提供 32 位 PCI 主机桥，ALCOR 提供 64 位 PCI 主机桥，后者（符合
    PCI 规范的要求）支持 32 位和 64 位 PCI 设备。


    APECS 由 6 个 208 引脚芯片组成（4 个 32 位数据切片（DECATE），1 个系统控制器（COMANCHE, CIA），1 个 PCI 控制器（EPIC））。它提供
    DRAM 控制器（128 位内存总线）和 PCI 接口。它还执行所有工作，以在 PCI 设备通过 DMA 向内存写入（或从内存读出）时维持内存一致性。


    ALCOR 由 5 个芯片组成（4 个 64 位数据切片（Data Switch, DSW）- 208 引脚 PQFP 和 1 个控制（Control, I/O
    Address, CIA）- 433 引脚塑料 PGA）。它提供 DRAM 控制器（256 位内存总线）和 PCI 接口。它还执行支持外部 Beache 以及在
    PCI 设备通过 DMA 向内存写入（或从内存读出）时维持内存一致性所需的所有工作。


    21066 没有支持芯片组，因为内存控制器和 PCI 主机桥功能已集成到芯片上。


    # D.7 系统


    DS 的应用工程团队使用 CPU 和支持芯片组生成示例设计。这些通常是 PC-AT 尺寸的主板，具备你通常会在高端 Pentium 主板上找到的所有功能。最初，这些示例设计的目的是作为第三方设计主板设计的起点。这些第一代设计被称为评估板（EBs）。随着构建主板所需的工程量增加（由于更高频率的时钟以及需要满足射频发射和
    susceptibility 法规），重点已转向提供适合批量生产的主板。


    Digital 的系统团队利用 Alpha 处理器生产了多代机器。其中一些系统使用系统团队设计的支撑逻辑，另一些使用 DS 的商品化芯片组。在某些情况下，系统同时使用两者。


    各种第三方公司使用 Alpha 处理器构建系统。其中一些公司从零开始设计系统，其他则使用 DS 支持芯片组，克隆/修改 DS 示例设计，或者简单地使用 DS
    组装和测试好的板卡打包系统。


    **EB64：** 过时设计，使用 21064，内存控制器使用可编程逻辑实现。I/O 通过使用可编程逻辑接口 486 (> ISA 桥芯片提供。板载以太网。SuperI/O
    (2S, 1P, FD)，Ethersnet 和 ISA。PC-AT 尺寸。使用标准 PC 电源运行。


    **EB64+：** 使用 21064 或 21064A 和 APECs。具有 ISA 和 PCI 扩展（3 个 ISA，2 个 PCI，其中一对位于共享插槽中）。支持
    36 位 DRAM SIM。ISA 总线由 Intel SaturnI/O PCI-ISA 桥生成。板载 SCSI (NCR 810 在 PCI 上)，以太网
    (Digital 21040)，KBD，MOUSE (PS2 风格)，SuperI/O (2S, 1P, FD)，RTC/NVRAM。启动 ROM 是 EPROM。PC-AT
    尺寸。使用标准 PC 电源运行。


    **EB66：** 使用 21066 或 21066A。I/O 子系统与 EB64+ 相同。Baby PC-AT 尺寸。使用标准 PC 电源运行。EB66
    原理图曾作为营销海报发布，宣传 21066 为“世界上第一款嵌入式 PCI 微处理器”（对于冷知识爱好者：实际上有 2 个版本的海报 - 1 个绘制电路并为第一版撰写文案，一些美国人在第二版中篡改了文案）。


    **EB164：** 使用 21164 和 ALCOR。具有 ISA 和 PCI 扩展（3 个 ISA 插槽，2 个 64 位 PCI 插槽（其中一个与 ISA
    插槽共享）和 2.32 位 PCI 插槽。使用插入式 Beache SIMM。I/O 子系统提供 Superl/O (2S, 1P, FD)，KBD，MOUSE
    (PS2 风格)，RTC/NVRAM。启动 ROM 是 Flash。PC-AT 尺寸主板。需要带 3.3V 输出的电源。


    **AlphaPC64 (又名 Cabinlet)：** 源自 EB64+，但现在为 baby-AT 尺寸，带 Flash 启动 ROM，无板载 SCSI
    或以太网。3 个 ISA 插槽，4 个 PCI 插槽（其中一对位于共享插槽中），使用插入式 Beache SIMM。需要带 3.3V 输出的电源。


    **ANXpci33 (又名 NoName)** 基于 EB66。该设计由 Digital 的技术 OEM (TOEM) 团队生产。它使用运行在 166MHz
    或 233MHz 的 21066 处理器。它是 baby-AT 尺寸，使用标准 PC 电源运行。它有 5 个 ISA 插槽和 3 个 PCI 插槽（其中一对是共享插槽）。有两个版本，键盘连接器分别为
    PS/2 或大型 DIN。


    **其他基于 21066 的主板：** 市场上大多数甚至所有其他基于 21066 的主板也基于 EB66 - 在设计 21066 系统时，系统选项真的不多，因为所有控制都在芯片上完成。


    **Multia (又名 Universal Desktop Box)：** 这是基于 21066 的非常紧凑的立式桌面系统。它包括 2 个 PCMCIA
    插槽，21030 (TGA) 图形，21040 以太网和 NCR 810 SCSI 磁盘以及软驱，2 个串行端口和一个并行端口。由于尺寸紧凑，扩展能力有限（一个
    PCI 插槽）。（关于何时可以使用 PCI 插槽有一些限制，我不记得具体是什么了）（注意还有基于 21066A 和基于 Pentium 的 Multia 可用）。


    **DEC PC 150 AXP (又名 Jensen)：** 这是一个非常古老的 Digital 系统 - 第一代 Alpha 系统之一。这里提到它是因为这些系统中有一些似乎在二手市场上有售。Jensen
    是一个落地式塔式系统，使用 150MHz 21064（后期版本使用更快的 CPU，但我不确定具体频率）。它使用可编程逻辑将 486 EISA I/O 桥接口连接到
    CPU。


    **其他 21064(A) 系统：** 周围有 3 或 4 种主板设计（这里不包含 Digital *系统*），我所知道的所有设计都源自 EB64+ 设计。这些包括：


    -   EB64+ (一些厂商打包销售未经修改的板卡)；AT 外形规格。

    -   Aspen Systems 主板：EB64+ 衍生版；baby-AT 外形规格。

    -   Aspen Systems 服务器板：许多 PCI 插槽（包括 PCI 桥）。

    -   AlphaPC64 (又名 Cabriolet)，baby AT 外形规格。


    **其他 21164(A) 系统：** 我知道的唯一一个不是简单克隆 EB164 的是 DeskStation 制造的 系统。该系统使用 Desk Station
    专有的内存和 I/O 控制器实现。我不知道他们对 Linux 的态度如何。


    # D.8 字节和所有这些东西


    当 Alpha 架构引入时，它在 RISC 架构中是独一无二的，因为它摒弃了 8 位和 16 位的加载和存储。它支持


