    ## 附录 D


    ## Alpha 系统与处理器简介


    本文档对现有的 Alpha CPU、芯片组和系统进行了简要概述。内容略带硬件偏向，这反映了作者的专业领域。尽管我是数字设备公司（Digital Equipment
    Corporation）的员工，但这并非 Digital 的官方声明，文中表达的观点纯属个人意见，不代表 Digital 的立场。


    ### D.1 什么是 Alpha


    “Alpha”是 Digital 公司 64 位 RISC 架构的名称。Digital 公司的 Alpha 项目始于 1989 年中，旨在为 VAX 用户提供一条高性能的迁移路径。虽然这不是
    Digital 生产的第一种 RISC 架构，但它是首个推向市场的架构。1992 年 3 月，当 Digital 宣布推出 Alpha 时，决定通过销售 Alpha
    微处理器进入商用半导体市场。Alpha 有时也被称为 Alpha AXP，原因晦涩难解且极其专业，此处不再深究。简而言之，二者是同一事物。


    ### D.2 什么是 Digital Semiconductor


    Digital Semiconductor（DS，[http://www.digital.com/info/semiconductor/](http://www.digital.com/info/semiconductor/)）是数字设备公司（Digital——我们不喜欢
    DEC 这个名字）内部负责在商用市场销售半导体的业务部门。Digital 的产品包括 CPU、支持芯片组、PCI-PCI 桥接器以及用于通信和多媒体应用的
    PCI 外设芯片。


    ### D.3 Alpha CPU


    目前有两代实现 Alpha 架构的 CPU 内核：


    - EV4

    - EV5


    关于“EV”代表什么，众说纷纭（编者注：真实答案当然是“Electro Vlassic”，见第 D.12 节），但其中的数字代表 Digital 公司用于实现该内核的首代
    CMOS 技术。因此，EV4 最初是在 CMOS4 中实现的。随着时间推移，CPU 通常可以通过光缩小技术升级到下一代 CMOS 工艺，从而获得中期的性能提升。因此，EV4S
    是在 CMOS5 工艺中实现的 EV4 内核。将设计缩小到特定技术与在该技术下从头开始实现设计之间有很大区别（但我现在不想深入讨论这个问题）。这里还有几个变数：还存在
    CMOS4S（CMOS4 的光缩小版）和 CMOS5L。


    真正的技术迷会感兴趣的是：CMOS4 是 0.75 微米工艺，CMOS5 是 0.5 微米工艺，CMOS6 是 0.35 微米工艺。


    要将这些 CPU 内核映射到*芯片*，我们得到：


    | 部件号 | 描述 |

    | :--- | :--- |

    | /21064-150,166/ | EV4（最初），EV4S（现在） |

    | /21064-200/ | EV4S |

    | /21064A-233,275,300/ | EV45 |

    | /21066/ | LCA45（EV4 内核，配 EV4 FPU） |

    | /21066A-233/ | LCA45（EV4 内核，但配 EV45 FPU） |

    | /21164A-233,300,333/ | EV5 |

    | /21164A-417/ | EV56 |

    | /21264/ | 你只需耐心等待并观察…… |


    EV4 内核是一个双发射（每个 CPU 时钟周期可发射 2 条指令）的超长流水线内核，包含整数单元、浮点单元和分支预测。它完全采用旁路设计，具有 64 位内部数据路径和紧耦合的
    8K 字节缓存，指令缓存和数据缓存各一个。这些缓存是直写式的（它们从不产生脏数据）。


    EV45 内核对 EV4 内核进行了一些调整：它拥有性能略有提升的浮点单元，以及 16KB 缓存，指令缓存和数据缓存各一个（它还支持缓存奇偶校验）。（编者注：Neal
    Crook 在一封单独的邮件中指出，浮点单元（FPU）的改进提升了除法的性能。EV4 FPU 的单精度除法需要 34 个周期，双精度除法需要 63 个周期（非数据依赖）。相比之下，EV45
    的除法通常单精度需要 19 个周期（最大 34 个周期），双精度需要 29 个周期（最大 63 个周期）（数据依赖）。）


    EV5 内核是一个四发射内核，同样采用超长流水线设计、完全旁路等特性。它拥有紧耦合的 8K 字节缓存，指令和数据缓存各一个。这些缓存是直写式的。它还拥有一个紧耦合的
    96K 字节片上二级缓存（Scache），该缓存为 3 路组相联且采用写回策略（可能产生脏数据）。从 EV4 到 EV5 的性能提升不仅仅归功于时钟速度的提高。除了更大的缓存和四发射之外，在微架构方面还进行了一些改进，以减少某些路径中生产者/消费者的延迟。


    EV56 内核在微架构上与 EV5  fundamentally 相同，但它增加了一些新的 8 位和 16 位加载和存储指令（参见第 D.8 节“字节及相关内容”）。这些指令主要用于设备驱动程序。EV56
    内核是在 CMOS6 中实现的，这是一种 2.0V 工艺。


    21064 于 1992 年 3 月宣布推出。它使用 EV4 内核，具有 128 位总线接口。总线接口支持外部二级缓存的“简易”连接，块大小为 256 位（总线上的
    2 个数据节拍）。Bcache 的时序完全可通过软件配置。21064 也可以配置为使用 64 位外部总线（但我不确定是否有发货系统使用此模式）。21064
    不对 Bcache 施加任何策略，但通常将其配置为写回缓存。21064 确实包含钩子，允许外部硬件维护 Bcache 和内部缓存的缓存一致性，但这很复杂。


    21066 使用 EV4 内核，并集成了内存控制器和 PCI 主机桥。为了节省引脚，内存控制器具有 64 位数据总线（但内部缓存的块大小为 256 位，与
    21064 相同，因此填充一个块需要总线上 4 个节拍）。内存控制器支持外部 Bcache 和外部 DRAM。Bcache 和 DRAM 的时序完全可通过软件配置，并且可以精确到
    CPU 时钟周期进行控制。虽然填充缓存块需要 4 个节拍的过程听起来很糟糕，但由于 DRAM 访问以页模式进行，实际上并没有那么糟糕。不幸的是，内存控制器不支持任何新型奇异
    DRAM（SDRAM、EDO 或 BEDO）或同步缓存 RAM。PCI 总线接口完全符合 rev2.0 标准，最高运行频率为 33MHz。


    21164 具有 128 位数据总线，支持拆分读取，任何时刻最多可有 32 个未完成的读取（这在最佳且理想的条件下允许 100% 的利用率，即理论上可以在每个总线时钟周期传输
    128 位数据）。21164 支持外部三级缓存（Bcache）的简易连接，并具备所有钩子，允许外部系统维护与所有缓存的完全一致性。因此，对称多处理器设计变得“简单”。


    21164A 于 1995 年 10 月宣布推出。它使用 EV56 内核。它在名义上与 21164 引脚兼容，但需要拆分电源轨；21164 上所有原本提供
    +3.3V 电源的引脚现在被拆分为两组：一组向 CPU 内核提供 2.0V 电源，另一组向 I/O 单元提供 3.3V 电源。与旧版实现不同，21164 的引脚不耐受
    5V。这一更改的结果是，21164 系统通常无法升级到 21164A（但请注意，设计一个既能容纳 21164A 也能容纳 21164 的系统相对简单）。21164A
    还有两个新引脚，以支持新的 8 位和 16 位加载和存储。它还改进了 21164 对使用同步 SRAM 实现外部 Bcache 的支持。


    ### D.4 21064 性能与 21066 性能对比


    21064 和 21066 拥有相同的（EV4）CPU 内核。如果在 21064 和 21066 上运行相同的程序，且 CPU 速度相同，则性能差异仅源于系统
    Bcache/内存带宽。任何在*内部*缓存具有高命中率的代码线程都将表现相同。有两个主要的性能杀手：


    1.  写密集型代码。尽管 21064 和 21066 都有写缓冲区来吸收部分延迟，但写密集型代码会受到系统总线写入带宽的限制。这是因为片上缓存是直写式的。

    2.  希望将浮点数当作整数处理的代码。Alpha 架构不允许从整数寄存器到浮点寄存器的寄存器间传输。这种转换必须通过内存进行（因此，由于片上缓存是直写式的，必须通过
    Bcache）。(编者注：似乎 EV4 和 EV45 都可以通过主数据缓存（Dcache）执行转换，前提是内存已经被缓存。在这种情况下，转换序列中的存储操作将更新
    Dcache，而随后的加载操作在特定情况下能够读取更新后的 Dcache 值，从而避免成本高昂的 Bcache 往返。特别是，似乎最好连续执行 staq/ldq
    或 stt/ldq 指令，这有点反直觉。)


    如果你在 21164A 和 21066A 之间进行相同的比较，由于两片芯片的 Icache 和 Dcache 大小不同，还存在一个额外的因素。


    现在，21164 解决了这两个问题：我实现了*更高*的系统总线带宽（尽管信号引脚数量相同——是的，我*知道*它比 21064 多了大约两倍的引脚，但所有额外的引脚都是电源和地线！）（是的，真的！！）它具有写回缓存。剩下的唯一问题就是“这要花多少钱？”


    '
