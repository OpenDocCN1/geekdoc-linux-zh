    purposes. Init will start all the services based on the order they appear. You
    can duplicate numbers, but it will only confuse you somewhat. You just need to
    use a two digit number only, along with an upper case “S” or “K” to start or stop
    the services you need to.


    How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be “start” and “stop”. You can execute those scripts
    by hand in fact with a command like:


    ```

    /etc/rc.d/init.d/httpd.init stop

    ```


    to stop the httpd server. Init just reads the name and if it has a “K”, it calls
    the script with the “stop” argument. If it has an “S” it calls the script with
    a “start” argument. Why all these runlevels? Some people want an easy way to set
    up machines to be multi-purpose. I could have a “server” runlevel that just runs
    httpd, sendmail, networking, etc. Then I could have a “user” runlevel that runs
    xdm, networking, etc.


    # 10.5.2 Init Runlevels


    Generally, Red Hat Linux runs in run level 3—full multiuser mode. The following
    runlevels are used in Red Hat Linux:


    +   0 Halt.

    +   1 Single user mode.

    +   2 Multiuser mode, without NFS.'
