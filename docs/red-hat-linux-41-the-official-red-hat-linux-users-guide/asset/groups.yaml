    \ 77\n\nyps, 77\n\n## 红帽 Linux 发行版 4.1\n\n“官方”红帽 4.1 包含所有最新的 Linux 工具和实用程序，包括最新\
    \ 2.0 内核改进的网络和硬件支持。\n\n本手册是您红帽 Linux 系统安装和管理的“官方”手册。无论您是从互联网上的某个站点下载了红帽 Linux，还是从红帽软件公司购买了红帽\
    \ Linux，或作为其他产品或 CD-Rom 套装的一部分，本手册都将使您使用这项先进技术变得更加简单和愉快。\n\n“红帽最大的优势在于，其众多软件包和工具几乎不需要配置……从整体上看，红帽是\
    \ Linux 最复杂且最具商业性的发行版。” *Inforworld 杂志*。\n\n这款基于 POSIX 的高级易管理操作系统能让您的 PC 作为 UNIX\
    \ 工作站有效地、可靠地执行高级计算任务。它非常适合从建立互联网 Web 或 FTP 服务器、互联网应用程序、研究工作、软件开发，甚至高级电脑游戏等各种应用。\n\
    \n### 易于安装和管理。\n\n借助 RHPM 的打包系统和模块化内核，操作系统的安装从未如此简单。只需选择一个或多个配置选项，您的安装即可用于以下用途：\n\
    \n- C 和 C++ 开发  \n- NFS 服务器  \n- 匿名 FTP/ Gopher 服务器  \n- 新闻服务器  \n- 网络管理  \n-\
    \ 工作站  \n- Dialog 工作站  \n- 游戏机  \n- X 窗口系统  \n- Web 服务器  \n- 打印机服务器  \n- 网络化工作站\
    \  \n- DOS-Windows  \n- 连接  \n- 多媒体机器  \n- 文本文档格式化  \n- 或使用手动配置选项，根据您的需求和喜好安装和配置您的\
    \ Linux 计算机。\n\n许多强大的高级图形化工具为高级用户节省了数小时的时间，并让新手系统管理员能够根据自己的需求定制和配置系统。这些软件工具涵盖了\
    \ TCP/IP、PPP、SLIP、文件系统、用户和组、软件包等的配置。\n\nRPM 打包系统是一个日益壮大的 Linux 标准，使系统的升级和维护变得简单且无忧无虑。现在的\
    \ 4.1 版本引入了“软件包依赖项”，消除了猜测，并在安装、卸载和升级软件包时防止重大系统故障。\n\n### 高级系统和网络安全功能。\n\nRPM 系统的灵活性使红帽\
    \ Linux 赢得了最安全操作系统之一的声誉。几乎每当在互联网上发现安全问题时，红帽软件就会发布新的或更新的软件包以应对新的威胁，为您节省时间并降低被入侵的可能性。\n\
    \n红帽 Linux 4.1 发行版支持标准的“UNIX”密码认证，以及用于增强安全的“影子”密码。可插拔认证模块（PAM）系统允许编写额外的认证方法并将其动态添加到系统中，以满足您的特殊安全需求。\n\
    \n### 从早期版本升级。\n\n由于红帽 Linux 4.1 发行版是基于高级 RPM 技术构建的，您的系统永远不会过时。当有新版本发布时，您可以使用简单的升级程序将任何或所有组件升级到最新版本，该程序会为您完成所有工作。红帽\
    \ Linux 2.0、2.1 和 3.0 (Picsos) 用户可以简单且安全地升级到 4.1 版本。\n\n### 革命性的软件开发和许可模式。\n\n\
    红帽 Linux 4.1 发行版是一个完整的基于 POSIX 的操作系统，拥有数百项在价格为十倍之高的 UNIX 操作系统中找不到的功能。\n\n红帽 Linux\
    \ 提供了整个操作系统的完整源代码，包括所有编译器、库、实用程序和 X 窗口系统。\n\n这项先进操作系统技术惊人价值背后的源泉是红帽 Linux 技术的协作开发。GNU\
    \ 和 Linux 技术受 GPL 版权保护，该协议排除了对全球软件开发贡献的商业控制权和限制。\n\n- 有关这一迷人主题的更多内容，请参阅本书内部。\n\
