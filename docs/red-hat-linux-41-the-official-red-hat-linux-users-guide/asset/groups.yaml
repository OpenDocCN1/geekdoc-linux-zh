    ### F.3 安装相关问题


    #### F.3.1 我需要交换空间吗？


    是的！如果你只有 8M 内存，在安装 Red Hat 时你*必须*启用至少 8M 的交换空间。如果你有更多的内存，你仍然应该启用交换空间，尽管这不是强制性的。


    #### F.3.2 如何让我的 SB16 上的 IDE CD-ROM 工作？


    Creative Labs 套件默认将 IDE 接口设置为第三个 IDE 端口（我认为这是 IDE2）。这在 Linux 下无法工作，因为 Linux 只识别两个
    IDE 端口。你需要做的是移动卡上的跳线，将其配置为 IDE1（次级 IDE 端口）。我不确定是否需要在 DOS 下进行更改才能使此配置生效，但你的手册应该会对此有所帮助（它*仍然*可以工作，但你可能需要编辑一两个文件）。


    你可能还需要指定命令行参数，例如：


    ```

    boot: linux hdN=cdrrom

    ```


    如果你只有一个 IDE 驱动器，在这种情况下 N 很可能是“b”（即“linux hdb=cdrrom”）。如果你有兩個，那么将是“c”。


    #### F.3.3 我如何进行 Red Hat Linux 4.1 的网络安装？


    从任何 Red Hat 镜像的 docs 目录获取 RedHat-HOWTO。它会告诉你所有你需要知道的内容。


    #### F.3.4 我如何再次运行安装程序？


    使用你用于安装的光盘重新启动你的机器。你很可能需要完全重新安装你的系统。


    如果你只是想重新配置网络或安装更多软件包，请尝试使用控制面板工具。


    #### F.3.5 为什么我缺少一些程序？


    尝试在 shell 提示符下运行 ''df''。如果显示 "/" 或 "/usr" 的使用率为 100%，很可能你的分区对于整个安装来说太小了。不幸的是，除非你密切观察，否则这不会导致任何类型的错误消息（当系统告诉你安装需要
    2 小时时，大多数人不会仔细检查 :-)）。你很可能需要重新安装并做以下两件事之一：a) 将你的根分区或 "/usr" 分区变大或 b) 安装更少的软件包。


    另外，如果你为 Linux 创建的没有任何分区已满，你可能只是缺少一些软件包。你需要使用 `glint` 或 `rpm` 来安装它们。


    #### F.3.6 我如何挂载我的 CD-ROM？


    如果你是从 CD-ROM 安装的，你应该能够执行：


    ```bash

    mount /mnt/cdrom

    ```


    如果你得到一个错误，说挂载点不存在，请执行：


    ```bash

    mkdir /mnt/cdrom

    ```


    如果你通过 NFS 进行了安装：你需要知道你拥有什么类型的 CD-ROM。最好的方法是在重新启动时观看启动消息，或者查看 `/var/adm/messages`（**more**
    `/var/adm/messages`）。你很可能拥有一个 IDE CD-ROM，它将显示为 `/dev/hdc` 或 `/dev/hdd`，或者你拥有一个
    Sound Blaster 类型，它是 `/dev/sbpcd`，或者你拥有一个 SCSI 类型，它是 `/dev/scd0`。


    无论如何，你可以执行以下操作：


    ```bash

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```


    并将 `xxxx` 替换为你的设备。然后你可以：`cd /mnt/cdrom` 然后：`ls`，你就会看到 CD-ROM 的内容。


    #### F.3.7 为什么 Linux 只能看到我的部分内存？


    可能有几件事出了错。在一些 386 上，你需要编译你的内核并启用“Limit memory to 16M?”。一些 AMI BIOS 主板有一个内存选项，可以将内存分成两个段。我不确定这个选项叫什么，但它与“linear”有关。你会在你的
    BIOS 设置中找到它。你可能需要在启动时从 lilo 向内核指定内存数量。要尝试此方法，请在 lilo 提示符下输入：linux mem=32M。如果这有效，你可以将该行添加到
    /etc/lilo.conf 中的 append 并重新运行 lilo。上述示例将是：


    ```

    append = "mem=32M"

    ```


    编辑文件后不要忘记运行 ''lilo''。


    #### F.3.8 我如何安装到 DOS 分区？


    你不能。当前的 Red Hat 发行版都不支持 UMSDOS 安装。如果你有一个驱动器，其中有一个大的 DOS 分区，并且你想使用其中的空闲空间，你有两个选择。一种是备份你所有的
    DOS 数据，然后将驱动器重新分区成较小的分区，然后将 DOS 数据恢复到 DOS 分区中。这样你就有一个空闲分区供 linux 使用。第二个选择是使用 fips。fips
    是一个程序，它允许你更改 DOS 分区的分区大小，而不会损害其上的数据。强烈建议在使用 fips 之前备份你的数据。Red Hat Software 不对使用
    fips 的适用性提供任何保证或声明，也不能保证数据不受损害。我没有听说过任何人使用 fips 有糟糕的经历，但我也不保证这一点。


