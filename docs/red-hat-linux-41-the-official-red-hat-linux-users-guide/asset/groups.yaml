    \ Enter 或 F12 继续。对于下一步，建议选择默认（No Clockchip Setting）条目，但经验丰富的用户可能想要选择特定的时钟芯片。\n\
    \n#### 选择你的服务器\n\n如果你不确定你拥有什么芯片组，找出答案的最佳方法通常是查看该卡。图 5.1 列出了哪些芯片组和主板需要哪些服务器。选择最适合你硬件的那一个。\n\
    \n| 服务器 | 芯片组 |\n| :--- | :--- |\n| VGA16 | 所有具有 256K 内存的 VGA 主板（仅 16 色） |\n|\
