    \ `Enter`，或使用 `F12` 快捷方式。信息屏幕将提供关于选择视频模式、启动和停止 X 服务器的最新信息。\n\n## 5.3 使用 Metro-X\
    \ 配置 X 窗口系统\n\n通过特别安排，安装单份 Metro-X 增强版 X 服务器的许可证包含在官方 Red Hat Linux/Intel CD 中。请注意，与\
