    HOWTO 中的信息而产生的任何后果承担责任。


    ### E.1.2 本文档的新版本


    本文档的最新版本可在 `ftp://gatekeeper.dec.com/pub/` 找到，David Mosberger-Tang 也很乐意在他优秀的 Linux
    Alpha FAQ 网站 `http://www.azstarnet.com/~explinux` 中包含其 html 形式。


    ## E.2 什么是 Milo？


    在基于 Intel 的 PC 系统上，BIOS 固件设置系统，然后从 DOS 文件系统的引导块中加载要运行的映像。这在很大程度上就是 Milo 在基于 Alpha
    的系统上做的事情，然而 BIOS 固件和 Milo 之间存在一些有趣的差异，最值得注意的是 Milo 包含并未经修改地使用了标准 Linux 设备驱动程序。Milo
    是固件，而 LILo 则依赖于 BIOS 固件来加载自身。Milo 的主要功能部分是：


    1. PALCode，

    2. 内存设置代码（构建页表并开启虚拟寻址），

    3. 视频代码（BIOS 仿真代码和 TGA (21030)），

    4. Linux 内核代码。这包括真实的 Linux 内核代码（例如，中断处理）和仿制或模拟的 Linux 内核，

    5. Linux 块设备驱动程序（例如，软盘驱动程序），

    6. 文件系统支持（ext2、MS-DOS 和 ISO9660），

    7. 用户界面代码（MILO），

    8. 内核接口代码（为 linux 设置 HWRPB 和内存映射），

    9. 用于管理环境变量的 NVRAM 代码。


    以下段落更详细地描述了这些功能部分。


    PALCode 可以被视为一个微小的软件层，它将芯片定制为特定的操作系统。它在一种特殊模式（PALmode）下运行，该模式有一定限制，但它使用标准的 Alpha
    指令集，仅增加五条指令。通过这种方式，Alpha 芯片可以运行诸如 Windows NT、OpenVMS、Digital Unix 以及当然 Linux 这样多样化的操作系统。Milo
    使用的 PALCode（因此 Linux 本身也是）与 Milo 的其他部分一样，是自由软件。它源自 Digital 的评估板软件示例 Digital Unix
    PALCode。不同 PALCode 之间的差异是由于 Alpha 芯片之间存在的地址映射和中断处理的差异（基于 21066 的系统与基于 21064+2107x
    的系统具有不同的 I/O 映射），以及不同基于 Alpha 的系统之间的差异。


    为了使 Milo 正常工作，它需要知道可用的内存是什么，Linux 最终将从哪里运行，并且必须能够为 Linux 设备驱动程序分配临时内存。该代码维护一个内存映射，其中包含永久分配页和临时分配页的条目。在启动过程中，Milo
    将自身解压到物理内存中的正确位置。当它将控制权传递给 Linux 内核时，它会保留压缩版本自身、PALCode（内核所需）和一些数据结构的内存。这使得系统中大部分内存留给了
    Linux 本身。


    内存代码的最后一步是设置并开启虚拟寻址，以便 Linux 期望看到的数据结构位于虚拟内存中的正确位置。


    Milo 包含视频代码，用于初始化和使用系统的视频设备。如果有 VGA 设备，它会检测并使用它，否则它会尝试使用 TGA (21030) 视频设备。如果都失败，它会假设没有图形设备。标准预构建映像中包含的
    BIOS 仿真是 Digital 自己的 BIOS 仿真，它支持大多数，如果不是全部，可用的标准图形设备。


