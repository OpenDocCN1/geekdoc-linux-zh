    如果你正在使用官方 Red Hat Linux/Intel CD 进行安装，你可以安装一份 MetroLink 的 Metro-X 服务器，这是一种高质量的商用
    Linux X 服务器。有关许可证信息，请参阅随附在你 Red Hat Linux CD 上的 MetroLink 许可证（纸质副本）。如果你选择使用 Metro-X，安装程序将启动
    Metro-X 配置工具 `configX`；有关如何使用 `configX` 的更多信息，请参阅第 5 章第 5.3 节。


