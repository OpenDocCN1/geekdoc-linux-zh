    and David Mosberger-Tang is kind enough to include the html form of it in his
    excellent Linux Alpha FAQ site `http://www.azstarnet.com/~explinux`.


    ## E.2 What is Milo?


    On Intel based PC systems, the BIOS firmware sets up the system and then loads
    the image to be run from the boot block of a DOS file system. This is more or
    less what Milo does on an Alpha based system, however there are several interesting
    differences between BIOS firmware and Milo, not least of which is that Milo includes
    and uses standard Linux device drivers unmodified. Milo is firmware, unlike LILo,
    which relies on the BIOS firmware to get itself loaded. The main functional parts
    of Milo are:


    1. PALCode,

    2. Memory set up code (builds page tables and turns on virtual addressing),

    3. Video code (BIOS emulation code and TGA (21030)),

    4. Linux kernel code. This includes real Linux kernel code (for example, the interrupt
    handling) and ersatz or mock Linux kernel,

    5. Linux block device drivers (for example, the floppy driver),

    6. File system support (ext2, MS-DOS and ISO9660),

    7. User interface code (MILO),

    8. Kernel interface code (sets up the HWRPB and memory map for linux),

    9. NVRAM code for managing environment variables.


    The following paragraphs describe these functional parts in more detail.


    PALCode can be thought of as a tiny software layer that tailors the chip to a
    particular operating system. It runs in a special mode (PALmode) which has certain
    restrictions but it uses the standard Alpha instruction set with just five extra
    instructions. In this way, the Alpha chip can run such diverse operating systems
    as Windows NT, OpenVMS, Digital Unix and, of course, Linux. The PALCode that Milo
    uses (and therefore Linux itself) is, like the rest of Milo, freeware. It is derived
    from Digital''s Evaluation Board software example Digital Unix PALCode. The differences
    between the different PALCodes are because of differences in address mapping and
    interrupt handling that exist between the Alpha chips (21066 based systems have
    a different I/O map to 21064+2107x systems) and different Alpha based systems.


    For Milo to operate properly it needs to know what memory is available, where
    Linux will eventually be running from and it must be able to allocate temporary
    memory for the Linux device drivers. The code maintains a memory map that has
    entries for permanent and temporary allocated pages. As it boots, Milo decompresses
    itself into the correct place in physical memory. When it passes control to the
    Linux kernel, it reserves memory for the compressed version of itself, the PALCode
    (which the kernel needs) and some data structures. This leaves most of the memory
    in the system for Linux itself.


    The final act of the memory code is to set up and turn on virtual addressing so
    that the data structures that Linux expects to see are at the correct place in
    virtual memory.


    Milo contains video code that initialises and uses the video device for the system.
    It will detect and use a VGA device if there is one, otherwise it will try to
    use a TGA (21030) video device. Failing that, it will assume that there is no
    graphics device. The BIOS emulation that the standard, pre-built, images include
    is Digital''s own BIOS emulation which supports most, if not all, of the standard
    graphics devices available.

