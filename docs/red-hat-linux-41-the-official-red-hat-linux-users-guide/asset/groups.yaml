    \ 199.183.24.232, you would enter the command:\n\n```\ncd /home/tftp\nln -s vmlinuz\
    \ C7B718E8.SUN4M\n```\n\nAt this point you should be able to go to the PROM on\
    \ your SPARC and type:\n\n```\nboot net nfsroot=nfs.server.IP.address:/path/to/RH/image\n\
    ```\n\nand it should get its rarp request from the TFTP server fulfilled and start\
