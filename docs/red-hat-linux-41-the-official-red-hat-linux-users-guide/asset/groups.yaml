    ## F.4.6 Why doesn''t xtexsh work?


    xtexsh is based on older versions of Tcl/Tk than what we ship. Unfortunately,
    it has not been ported to the newer versions as of yet and it does not work at
    all.


    # Appendix G


    ## Getting Technical Support


    As of July 1996, Red Hat Software put a new Technical Support system online. The
    support system automatically routes questions to support technicians. This document
    describes how to use the Red Hat Software technical support system.


    ## G.1 Registration


    In order to receive technical support for your Red Hat Software product, you have
    to register it. Every official Red Hat product comes with a Registration Card.
    Your product registration number appears on both the detachable mail-in portion
    and on the top portion of this card. The product registration number uniquely
    identifies a product which you have purchased (such as Red Hat Linux) that includes
    30 days of free installation technical support by fax or email.


    ### G.1.1 Registering via the Web


    You can register your Red Hat Software product online at Red Hat’s World Wide
    Web site: `http://www.redhat.com/support/register/`. Choose the Register a Product
    link. Please enter all applicable information, and please be accurate (no “Red
    Hat Linux/Alphas running on an Intel i386 10MHz with 2GB RAM" ->). We use the
    information you give us at registration to try to solve problems and answer questions
    more quickly and easily, and incorrect information benefits neither us nor our
    customers. Also, make sure the electronic mail address you give is correct. All
    support correspondence will be sent to that address.


    During registration, you are asked for your support ID. If you haven''t registered
    a product with Red Hat''s web site before, you won''t have a support ID: choose
    *I don''t have a support ID.* If you have already registered a product on the
    web site before, you ought to have a support ID; please enter it. If you know
    you have a support ID, but can''t remember it or don''t have it with you, you
    can select *I have received a support ID but can''t remember it,* but your registration
    may be delayed a few days.


    ### G.1.2 Registering via Email


    If you don''t have access to the World Wide Web, but you do have access to Internet
    mail, you can send registration details to `register@redhat.com`. Please include
    the following information:


    - Contact Information: name, address, city, state/province, country, zip/postal
    code, and telephone and fax numbers; also, your support ID if you have one;

    - Product Information: name of product you are registering, product registration
    number (very important!), architecture you''re using the product on (Intel, Alpha/AXP,
    or Sparc), and what you''re using the product for (File Server, Internet Server,
    Workstation, Home Computer, or Other);

    - System Information: CPU (i386, i486, i586, i686/PentiumPro, AXP21164, AXP21064,
    Sparc4C, Sparc4M), CPU speed (MHz), amount of RAM (MB), hard drives (number, size,
    type, partitions), video card, CD-ROM drive, any network card, and other hardware
    components (SCSI or ISDN adaptors, etc.).


    ### G.1.3 Registering via Fax or Snail Mail


    Although a mail-in portion is provided with your registration card, we do not
    recommend registering via fax or snail mail if you have access to either the World
    Wide Web or Internet mail; if you do so, your registration is likely to be delayed
    considerably. If you do wish to register via fax, fax a copy of your registration
    card to Red Hat Software at +1-919-361-2711.


    ## G.2 Support Questions


    Technical support is a black art: in most cases, support technicians rely solely
    on communication with the customer to solve installation problems on hardware
    the technicians have never physically seen. It is extremely important, therefore,
    to state your question clearly and concisely, including detailed information such
    as:


    - symptoms of the problem ("Red Hat Linux 4.1 doesn''t recognize my CD-ROM drive.")

    - when the problem began ("It stopped working yesterday ...")

    - what changes you have made to your system around the time of the problem ("...
    after I disconnected it from the IDE controller.")

    - any diagnostic output specifically related to the problem ("In the bootup messages,
    it says ''Cannot find /dev/hdb; device disconnected.''") however, this can be
    taken overboard; don''t send us your system logs unless we ask you for them.

    - other relevant information ("I''m using the floppy installation method, from
    the CD.")


    ### G.2.1 How to Send Them


    Red Hat''s support system is email-based and is partially automated; for this
    reason, it is important to make sure you send support questions in the correct
    format, so that your message will be recognized and routed to an appropriate support
    technician. In order to receive technical support for your Red Hat Software product,
    you must first register it.


    For each new problem you need support for, the support system opens a support
    ticket. To open a support ticket, all you need to do is send the support system
    a message with a Subject: of [registration #nnnnnn].


    where mmmmm is the registration number of the product for which you are requesting
    support (not your support ID). For example, if your registration number is 654321,
    the subject line should read:


    > Subject: [registration #654321]


    The square brackets, the number sign, and the word “registration” must be present.
    If you wish, you may add explanatory text to the subject line:


    > Subject: [registration #654321] CD-ROM problem


    Once you’ve opened a ticket, support responses come to you with the support ticket
    number in the subject line:


    > Subject: [ticket #98] CD-ROM problem


    To correspond about the same problem, simply send a reply with the same subject:


    > Subject: Re: [ticket #98] CD-ROM problem


    Once your problem is solved or your question answered, the technician handling
    your support ticket will close the ticket; you will receive a message from the
    support system indicating that the ticket is closed and containing a summary of
    the problem and the solution. You can open a new ticket for your next support
    question.


    ### G.2.2 Where to Send Them


    The address for Red Hat’s Technical Support System is support@redhat.com; all
    support questions should go there. There are also several related ad-dresses:


    - For a copy of the Red Hat FAQ (Frequently Asked Questions, with answers), send
    mail to faq@redhat.com.

    - For a copy of the Red Hat PPP Tips (tips on setting up a PPP connection), send
    mail to ppp-tips@redhat.com.

    - To report a bug, send mail to bugs@redhat.com.


    ## G.3 Support FAQ (Frequently Asked Questions)


    - Question: I’ve sent several messages to the Red Hat Support System, and I’ve
    gotten absolutely no response. Is anybody there?

    - Answer: Check your registration information to make sure your email address
    is correct. You can check it at http://www.redhat.com/support/register/.


    - Question: I know I have already registered, but I keep getting a message from
    the support system telling me I’m not registered. What’s up?

    - Answer: How and when did you register? If you mailed or faxed in your registration
    card, it is likely that you are not in the new support system database. Try registering
    online via the World Wide Web at http://www.redhat.com/support/register/.


    - Question: But I registered via email. Why isn’t the support system working?

    - Answer: When you register via email, your message goes to an actual human who
    registers you manually; this can delay your registration anywhere from several
    hours to several days.


    - Question: I did register via the web, but I am still getting ‘invalid registration
    number’ messages. Why?

    - Answer: If you selected I have received a support ID but can’t remember it when
    you registered, the support system sends your registration information to a human
    who registers you manually; this can delay your registration anywhere from several
    hours to several days.


    - Question: I’ve done everything perfectly for my registration, but I’m still
    getting messages telling me I have an invalid registration number. This is a stupid
    support system.

    - Answer: Please make sure you’re using a product registration number in the Subject:
    line and not a support ID or a support ticket number. The product registration
    number appears on the registration card that accompanies each Red Hat product.

