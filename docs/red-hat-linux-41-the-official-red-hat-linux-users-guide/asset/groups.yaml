    \n# Chapter 5\n\n## Post Installation Configuration\n\nAfter installation your\
    \ system is fully functional, but you may still want to do some additional configuration.\
    \ This chapter describes some of the various system configuration tasks you may\
    \ need to do.\n\n## 5.1 Building a Custom Kernel\n\nWith the introduction of modularization\
    \ in the Linux 2.0.x kernel there have been some significant changes in building\
    \ customized kernels. In the past you were required to compile support into your\
    \ kernel if you wanted to access a particular hardware or filesystem component.\
    \ For some hardware configurations the size of the kernel could quickly reach\
    \ a critical level. To require ready support for items that were only occasionally\
    \ used was an inefficient use of system resources. With the capabilities of the\
    \ 2.0.x kernel, if there are certain hardware components or filesystems that are\
    \ used infrequently, driver modules for them can be loaded on demand. For information\
    \ on handling kernel modules see Chapter 8, Section 8.6.\n\n### 5.1.1 Building\
    \ a modularized kernel\n\nOnly Red Hat Linux/Intel and Red Hat Linux/SPARC support\
    \ modular kernels; Red Hat Linux/Alpha users must build a monolithic kernel (see\
    \ Section 5.1.3 below).\n\nThese instructions provide you with the knowledge required\
    \ to take advantage of the power and flexibility available through kernel modularization.\
    \ If you do not wish to take advantage of modularization, please see Section 5.1.3\
    \ for an explanation of the different aspects of building and installing a monolithic\
    \ kernel. It is assumed that the **kernel-source** package has been previously\
    \ installed and all commands are issued in the directory *usr/src/linux*.\n\n\
    It is important to begin a kernel build with the source tree in a known condition.\
    \ Therefore, it is recommended that you begin with the command **make mrproper**.\
    \ This will remove any configuration files along with the remains of any previous\
    \ builds that may be scattered around the source tree. Now you must create a configuration\
