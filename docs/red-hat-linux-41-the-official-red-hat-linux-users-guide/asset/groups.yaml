    \ 通常包含除 /bin 中的二进制文件外启动系统所必需的文件。任何在 /usr 已知被挂载（在没有问题的情况下）后执行的操作都应放置在 /usr/sbin。仅限本地的系统管理二进制文件应放置在\
    \ /usr/local/sbin。”\n\n至少，以下程序应位于 /sbin 中：\n\n```\nclock, getty, init, update,\
    \ mkswap, swapoff, swapon, halt, reboot, shutdown, fdisk, fscck.?, mkfs.?, lilo,\
    \ arp, ifconfig, route\n```\n\n###### /usr 目录\n\n/usr 目录用于存放整个站点可共享的文件。/usr 目录通常拥有自己的分区，并且应该可以只读挂载。以下目录应该是\
    \ /usr 的子目录：\n\n```\n/usr\n|-- X11R6\n|-- bin\n|-- dict\n|-- doc\n|-- etc\n|--\
    \ games\n|-- include\n|-- info\n|-- lib\n|-- local\n|-- man\n|-- sbin\n|-- share\n\
    +-- src\n```\n\nX11R6 目录用于 X 窗口系统（在 Red Hat Linux 中为 XFree86），bin 用于可执行文件，doc\
    \ 用于杂项非手册页文档，etc 用于站点范围的配置文件，include 用于 C 头文件，info 用于 GNU info 文件，lib 用于库，man\
    \ 用于手册页，sbin 用于系统管理二进制文件（不属于 /sbin 的那些），src 用于源代码。\n\n###### /usr/local 目录\n\n\
    FSSTND 指出：\n\n> “/usr/local 层级供系统管理员在本地安装软件时使用。它需要确保在系统软件更新时不会被覆盖。它可用于存放一组机器间可共享但不在\
    \ /usr 中的程序和数据。”\n\n/usr/local 目录的结构与 /usr 目录相似。它包含以下子目录，其用途与 /usr 目录中的子目录相似：\n\
    \n```\n/usr/local\n| - bin\n| - doc\n| - etc\n| - games\n| - include\n| - info\n\
    | - lib\n| - man\n| - sbin\n+ - src\n```\n\n###### /var 目录\n\n由于 FSSTND 要求能够以只读方式挂载\
    \ /usr，因此任何需要写入日志文件或需要 spool 或锁目录的程序，最好将这些写入 /var 目录。FSSTND 指出 /var 用于：\n\n> “...\
    \ 可变数据文件。这包括 spool 目录和文件、管理和日志数据，以及瞬态和临时文件。”\n\n以下目录应该是 /var 的子目录：\n\n```\n/var\n\
    ├─ log\n├─ catman\n├─ lib\n├─ local\n├─ named\n├─ nis\n├─ preserve\n├─ run\n├─\
    \ lock\n├─ tmp\n└─ spool\n   ├─ at\n   ├─ cron\n   ├─ lpd\n   ├─ mail\n   ├─ mqueue\n\
    \   ├─ rwho\n   ├─ smail\n   ├─ uucp\n   └─ news\n```\n\n系统日志文件，如 wtmp 和 lastlog，位于\
    \ /var/log。/var/lib 目录还包含 RPM 系统数据库。格式化后的手册页位于 /var/catman，锁文件位于 /var/lock。/var/spool\
    \ 目录包含用于存储数据文件的各个系统的子目录。\n\n#### 10.1.2 Red Hat Linux 中的 /usr/local\n\n在 Red Hat\
    \ Linux 中，/usr/local 的预期用途与 FSSTND 规范略有不同。FSSTND 指出，/usr/local 应作为存放那些需从系统软件升级中保持安全的软件的位置。由于\
    \ Red Hat Software 的系统升级通过 RPM 系统和 Glint 安全地进行，因此你不需要通过将文件放在 /usr/local 来保护文件。相反，我们建议你使用\
    \ /usr/local 存放本地计算机专用的软件。\n\n例如，假设你通过只读 NFS 从 `beavis` 挂载了 `/usr`。如果你希望安装某个软件包或程序，但不允许写入\
    \ `beavis`，你应该将其安装在 `/usr/local` 下。稍后，如果你成功说服 `beavis` 的系统管理员在 `/usr` 中安装该程序，你可以从\
