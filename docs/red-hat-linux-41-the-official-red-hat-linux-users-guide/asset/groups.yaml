    In order to create a new print queue, choose **Add**. Then, select what type of
    printer is being added. There are 3 types of printers which can be configured
    with printtool:


    - **Local** print queues are for printers attached to a printer or serial port
    on your Red Hat Linux system.

    - **Remote** print queues are attached to a different system which you can access
    over a TCP/IP network.

    - **SMB** print queues are attached to a different system which uses LAN Manager
    networking.


    ![](img/3d09de050edc8aef2a604e36a4127b47_120_0.png)


    Figure 8.6: Selecting a Printer Type


    After choosing the printer type, fill in the following information:


    **Queue Name** What the queue will be called. Multiple names can be specified
    with the | (pipe) character separating entries.


    **Spool Directory** This is the directory on the local machine where files are
    stored before printing occurs. Be careful to not have more than one printer queue
    use a given spool directory.


    **File Limit** Maximum size print job accepted. A size of 0 indicates no limit
    should be imposed.


    For *local* printers, the following are also required:


    **Printer Device** Usually /dev/lp1, the name of the port which the printer is
    attached to. Serial printers are usually on /dev/ttyS? ports. You will need to
    manually configure serial parameters.


    **Input Filter** Filters convert printed files into a format the printer can handle.
    Press **Select** to choose the filter which best matches your printer.


    ![](img/3d09de050edc8aef2a604e36a4127b47_121_0.png)


