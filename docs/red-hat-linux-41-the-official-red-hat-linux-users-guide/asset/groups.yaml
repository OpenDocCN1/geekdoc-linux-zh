    ## 附录 H


    ### Red Hat 与可自由分发的软件


    #### H.0.1 Red Hat 的历史


    与 Unix 本身一样，Linux 是一个非常模块化的操作系统。选择、编译、链接和安装组成完整 Linux 操作系统所需的各种组件所需的技能，超出了大多数希望使用
    Linux 的人的经验范围。各种 Linux 发行版在很大程度上解决了普通 Linux 用户的这一问题，但大多数发行版并未解决系统成功安装后如何升级 Linux
    系统的问题。大多数用户发现，当需要升级时，删除整个 Linux 系统并从头重新安装更为简单。


    Red Hat 发行版通过提供高级软件包管理、图形化（点击即可！）系统安装与控制，以及系统管理工具，使 Linux 的安装和维护变得更加容易。


    #### H.1 自由软件模式


    Linux 以及 GNU 实用程序（特别是 Red Hat Linux）最出色的特性之一，就是其可根据 GNU 通用公共许可证（GPL）的条款进行分发。这一特性使研究机构、大学、商业企业和黑客能够合作开发和
    Red Hat Linux 及相关技术，而不必担心其工作将来会被商业供应商控制或限制。


    简而言之，GPL 将软件开发和分发模式转变为一个类似于我们的法律体系及其行业所使用的模式。如果一名律师设计了一个在最高法院胜诉的论点，他的回报不仅包括客户支付的费用，还包括其成就为其执业带来的额外客户。他所使用的“论点”可供其他任何律师无限制地使用，并且实际上成为了我们集体法律遗产的一部分。


    这种新模式已经形成了一个新兴行业，像 Cygnus Support（见 http://www.cygnus.com）这样的公司，基于为大型商业用户提供 GPL
    及其他“可自由分发”软件的支持和服务，已经发展成为数百万美元规模的企业。Red Hat Software, Inc. 的快速增长同样基于我们对 Red Hat
    Linux 发行版的开发和支持，该产品我们在全球范围内通过 CD 和互联网根据 GPL 条款分发。


    #### H.2 “自由软件”的演变


    Unix 操作系统也是由 AT&T 基于合作方式开发的，并得到了许多大学和研究机构的积极支持。许多早期的 Unix 贡献者对 AT&T 在 20 世纪 70
    年代末和 80 年代开始强制执行 Unix 使用和分发方面的版权条款感到失望。这最终导致了 AT&T（以及后来于 1991 年从 AT&T 购买 Unix
    版权的 Novell）与加州大学伯克利分校之间漫长而激烈的法律争端。作为对公共软件开发项目中个人控制问题的一种部分回应，位于马萨诸塞州剑桥市的麻省理工学院（MIT）自
    1984 年以来，一直支持 Richard Stallman 在软件开发社区发起支持自由软件开发的运动。这导致了自由软件基金会（FSF）及其 GNU 项目的成立。GNU
    的名字遵循了早期 Unix 使用递归缩写作为程序名称的传统，全称是 GNU’s Not Unix（GNU 不是 Unix）。FSF 仍总部位于 MIT，在过去十年中，凭借
    GNU C、GNU C++、Emacs 等众多产品取得了惊人的成功，其中许多构成了 Linux 操作系统的重要且关键的组成部分。Richard Stallman
    坚称，且有一定道理，Linux 应正确地被称为 GNU 系统。


    Red Hat Linux 中的一些代码还受其他多种“自由软件”许可证的保护。其中流行的是加州大学伯克利分校的 BSD 许可证，该许可证规定版权持有者仍是注册所有者，但不对代码使用者的进一步分发施加限制。


    同样来自 MIT，但与 FSF 或 GPL 无关的是 X 联盟，这是一个由 Unix 行业赞助的努力，旨在构建和维护 X 窗口系统。反过来，一个名为 XFree86
    项目的团队承担了将 X 窗口系统移植到 Intel 平台的责任。为了方便起见，我们将这些许可证的副本包含在本手册的附录中。由于全球开发工作的贡献，Linux
    正在迅速发展，我们鼓励你及你的公司或学校为此做出贡献。


    #### H.3 GNU 通用公共许可证


    Red Hat Software, Inc. 选择根据 GPL 授权其代码，原因有两个。首先，这是最简便的做法，因为 Linux 内核就是这样授权的，且我们的代码与其他
    GPL 代码的交互足够紧密，使得其他任何许可方案都难以实施。其次，出于合作开发的目的，我们真诚地认为 GPL 实际上是最有效的许可格式。


    GPL 的目的与任何标准版权许可证类似，即定义你可以和不可以将产品用于何种用途。然而，它与商业许可证有实质性区别，因为它的目的不是限制你对软件的使用，而是保证你对软件的使用。


    它完全不会限制使用 Linux 或其他 GPL 代码时同时使用标准的商业授权软件。你从他人那里“借用”的、根据 GPL 授权的代码所做出的更改，必须根据 GPL
    定义的同一无限制规则向他人公开。任何仅使用或运行在 Linux 之上的产品，都可以采用你选择的任何商业规则进行授权。


    有许多领先的商业软件开发商正在积极支持其在 Linux 上的商业产品，这些产品你需要购买许可证，例如来自 OSF 的 Motif，来自 Empress Software
    的 Empress RDBMS，WordPerfect，以及近期的 Applixware - 来自 Applix Inc. 和 Red Hat Software
    的办公套件。你可以在第 I 章找到完整的 GPL 副本。


    #### H.4 Linux 会取代商业操作系统吗？


    Linux 操作系统的巨大开发工作和广泛分发将确保其成为商业受限操作系统的真正、可行且重要的替代品。开放式开发模式、源代码的可用性以及缺乏许可证限制是 Linux
    操作系统的“特性”，而商业操作系统开发商根本无法提供。需要这种模式的软件开发团队包括来自政府附属研究组织、学术研究和教学项目，以及商业软件应用开发商的团队。


    近年来，Linux 可用新应用的快速增长以及这些技术用户群的迅速扩大，甚至导致最大的计算机行业组织也开始认真对待 Linux。即使是 Datapro（麦格劳-希尔公司）在其最近的
    1996 年 UNIX 行业调查中得出结论：“程序员正在认真审视 Linux 在生产平台上的可行性，因为如今 Linux 的成本低于 Microsoft，并且具有
    UNIX 的额外优势，如卓越的性能、固有的强大工具集以及通信能力”。


    Linux、FSF 的 GNU 代码以及其他“可自由分发”软件所代表的新分发和开发模式，是一种已经在成功竞争旧的商业受限模式的新模式。这些技术有着令人兴奋的未来，我们很高兴你现在是其中的一部分。


    #### H.5 Red Hat Software, Inc. 在 Linux 开发中的角色


    Red Hat Linux 发行版也是根据 GPL 发布的。我们将自己的角色视为使 Linux 操作系统易于安装、配置和维护


