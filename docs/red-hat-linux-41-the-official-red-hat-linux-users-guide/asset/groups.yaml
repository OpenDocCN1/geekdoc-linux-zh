    /etc/ftpaccess This file defines most of the access control for your ftp server.
    Some of the things that you can do are: set up logical "groups" to control access
    from different sites, limit the number of simultaneous FTP connections, configure
    transfer logging, and much more. Read the ftpaccess man page for complete details.


    /etc/ftphosts The ftphosts file is used to allow or deny access to certain accounts
    from various hosts. Read the ftphosts man page for details.


    /etc/ftpusers This file lists all the users that are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftpusers by default. That means that
    you can not ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.


    # ## 5.8 World Wide Web Server


    If you installed the Apache web server (from the apache package), then your Web
    service is already up and running! Just point Red Baron (or any other web browser)
    at http://localhost.


    The default page shown is /home/htpm/index.html. You can edit this file (or completely
    replace it) to your liking. All the CGI programs, icons, and html pages are stored
    in /home/htpm, but this can be changed in the apache configuration files, all
    of which are stored in /etc/httpd/conf. Logs of all httpd activity are kept in
    /var/log/httpd. Setting up your web site is as easy as adding your own HTML pages
    and links to the /home/httpd/html/ directory. For more information on customizing
    your web server we recommend a reference such as HTML: The Definitive Guide by
    Chuck Musciano & Bill Kennedy, published by O''Reilly & Associates.


    # ## 5.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can "export" filesystems to other systems,
    and "mount" filesystems exported from other machines.'
  - '[PAGE 88]


    # 5.9.1  Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    In this command, porky is the hostname of the NFS fileserver, /mnt/export is the
    filesystem that porky is exporting, and /mnt/local is a directory on my local
    machine where I want to mount the filesystem. After the mount command runs (and
    if I had the proper permissions from porky) - voila! - I can enter ''ls /mnt/local''
    and get a listing of the files in /mnt/export on porky.


    # 5.9.2  Exporting NFS Filesystems


    The file that controls what filesystems you wish to export is “/etc/exports”.
    Its format is:


    ```

    directory hostname(options)

    ```


    the “(options)” are optional. For example:


    ```

    /mnt/export speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export speedy.redhat.com(ro)

    ```


    would just allow speedy to mount /mnt/export read-only.


    Each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to just stop and
    start the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```'
  - '[PAGE 89]


    The following will also work:


    ```

    killall -HUP rpc.nfsd rpc.mountd

    ```


    See the following man pages for more details: nfsd(8), mountd(8), and exports(5).
    Another good reference is Managing NFS and NIS Services by Hal Stern, published
    by O''Reilly & Associates.


    # 5.10  Running Programs at Boot Time


    The file `/etc/rc.d/rc.local` is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. For instance, you may want to start up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit `/etc/rc.d/rc.serial`
    and it will be executed automatically at boot time.


    The default `/etc/rc.d/rc.local` simply creates a nice login banner with your
    kernel version and machine type.


    # 5.11  Color 1s Setup


    Color 1s is now part of the standard 1s command. To use color-1s simply issue
    the command (in bash):


    ```

    alias 1s=''1s --color''

    ```


