    The EV4 core is a dual-issue (it can issue 2 instructions per CPU clock) superpipelined
    core with integer unit, floating point unit and branch prediction. It is fully
    bypassed and has 64-bit internal data paths and tightly coupled 8Kbyte caches,
    one each for Instruction and Data. The caches are write-through (they never get
    dirty).


    The EV45 core has a couple of tweaks to the EV4 core: it has a slightly improved
    floating point unit, and 16KB caches, one each for Instruction and Data (it also
    has cache parity). (Editor''s note: Neal Crook indicated in a separate mail that
    the changes to the floating point unit (FPU) improve the performance of the divider.
    The EV4 FPU divider takes 34 cycles for a single-precision divide and 63 cycles
    for a double-precision divide (non data-dependent). In contrast, the EV45 divider
    takes typically 19 cycles (34 cycles max) for single-precision and typically 29
    cycles (63 cycles max) for a double-precision division (data-dependent).)


    The EV5 core is a quad-issue core, also superpipelined, fully bypassed etc etc.
    It has tightly-coupled 8Kbyte caches, one each for I and D. These caches are write-through.
    It also has a tightly-coupled 96Kbyte on-chip second-level cache (the Scache)
    which is 3-way set associative and write-back (it can be dirty). The EV4->EV5
    performance increase is better than just the increase achieved by clock speed
    improvements. As well as the bigger caches and quad issue, there are microarchitectural
    improvements to reduce producer/consumer latencies in some paths.


    The EV56 core is fundamentally the same microarchitecture as the EV5, but it adds
    some new instructions for 8 and 16-bit loads and stores (see Section D.8 Bytes
    and all that stuff). These are primarily intended for use by device drivers. The
    EV56 core is implemented in CMOS6, which is a 2.0V process.'
