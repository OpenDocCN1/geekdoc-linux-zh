  mdcn: "\n\n# 第 2 章\n\n# 安装 Red Hat Linux/Intel\n\n本章详细解释了如何在 Intel 及兼容 PC 上安装或升级\
    \ Red Hat Linux。本章的组织结构如下：\n\n- **2.1 节，Red Hat Linux 勘误**，提供了关于 Red Hat Linux/Intel\
    \ 4.1 最新信息的重要指引。\n- **2.2 节，开始之前**，描述了一些在实际安装 Red Hat Linux 之前需要了解的注意事项。\n- **2.3\
    \ 节，安装准备**，说明了如何创建安装软盘（如果随附的 Red Hat Linux 版本中未包含），并解释了如何使用安装程序。\n- **2.4 节，分步安装**，提供了完成整个安装或升级过程的逐步说明。\n\
    \n## 2.1 Red Hat Linux 勘误\n\n偶尔，我们会发现 Red Hat Linux 版本中存在的问题，其中一些问题可能会影响安装。当我们发现问题时，我们会在\
    \ Red Hat Linux 勘误中发布关于该问题及其解决方案的信息，我们通过以下几种方式提供这些信息：\n\n- 通过万维网：http://www.redhat.com/errata\n\
    - 通过电子邮件：errata@redhat.com\n\n请注意，勘误中列出的问题解决方案可能要求您使用与下文提到的或随您的 Red Hat Linux\
    \ CD-ROM 附带的不同的启动或安装磁盘映像。\n\n## 2.2 开始之前\n\n在开始安装 Red Hat Linux 之前，您应该收集一些关于您系统的信息：\n\
    \n- 熟悉您机器中安装的硬件，包括：\n  - **硬盘** — 数量和容量；如果您有多个硬盘，了解哪个是主盘、次盘等会有所帮助。\n  - **内存**\
    \ — RAM 的数量。\n  - **CD-ROM** — 其接口类型（IDE、SCSI 或其他接口），对于非 IDE 和非 SCSI CD-ROM，需知道其制造商和型号。\n\
    \  - **SCSI 适配器** — 制造商和型号。\n  - **网卡** — 制造商和型号。\n  - **鼠标** — 类型（串口、PS/2 或总线鼠标）、协议（Logitech、Microsoft、MouseMan\
    \ 等）以及按钮数量；此外，对于串口鼠标，还需知道它连接到的 com 端口。\n\n此外，如果您将安装 X 窗口系统，您应该熟悉以下内容：\n\n- **您的显卡**\
    \ — 制造商和型号或视频芯片组，视频 RAM 的数量。\n- **您的显示器** — 制造商和型号，允许的水平刷新率和垂直刷新率范围。\n\n您可以在随系统提供的文档中找到上述大部分信息，或者向您的系统供应商或制造商查询。\n\
    \n- 如果您将连接到网络，请确保您知道您的 IP 地址、子网掩码、网关 IP 地址、名称服务器 IP 地址、域名和主机名。如果您不知道这些值，请咨询您的网络管理员。\n\
    \n- 如果 Red Hat Linux/Intel 将在您的机器上与 OS/2 共存，您必须使用 OS/2 分区软件创建磁盘分区——否则，OS/2 可能无法识别磁盘分区。在安装过程中，不要创建任何新分区，但请使用\
    \ Linux fdisk 为您的 Linux 分区设置正确的分区类型。\n\n- 如果您计划使用 LILO（Linux 加载器）来启动您的 Red Hat\
    \ Linux 系统，请参阅 2.4.18 节，LILO 安装，以获取可能影响您的分区计划的指南。\n\n请仔细阅读所有安装说明后再开始；这将为您准备需要做出的任何决策，并应消除潜在的意外情况。\n\
    \n### 2.2.1 安装方法\n\n您可以通过多种基本方法之一来安装或升级 Red Hat Linux/Intel。根据您使用的方法，您需要一张或两张格式化的高密度（1.44\
    \ MB）3.5 英寸软盘。\n\n从 CD-ROM 安装或通过 NFS 安装只需要一张启动盘。从硬盘安装、通过 FTP 安装或从 PCMCIa 设备（包括基于\
    \ PCMCIa 的 CD-ROM）安装则需要一张启动盘和一张辅助盘。下面 2.3.1 节解释了如何创建启动盘和辅助盘。\n\n**CD-ROM** 如果您有\
    \ Red Hat Linux CD 和一张启动盘，您将需要一个受支持的 CD-ROM 驱动器，并且您的机器上需要一个 3.5 英寸软驱或正在运行的 MS-DOS\
    \ 安装环境以运行安装实用程序。如果您的 CD 没有附带启动盘，您需要访问一台运行 Linux 或 MS-DOS 的计算机，以便从 CD 创建启动盘。\n\n\
    **NFS** 如果您希望通过网络安装，您需要在一台支持带有 Rock Ridge 扩展的 ISO-9660 文件系统的机器上挂载 Red Hat Linux\
    \ CD-ROM。该机器还必须支持 NFS。通过 NFS 导出 CD-ROM 文件系统。您需要配置名称服务，或者知道 NFS 服务器的 IP 地址，以及导出\
    \ CD-ROM 的路径。\n\n**FTP** 对于 FTP 安装，您需要一张启动盘和一张辅助盘。您需要配置有效的名称服务器，或者知道您将使用的 FTP\
    \ 服务器的 IP 地址。您还需要 FTP 站点上 Red Hat Linux 目录根路径的路径。\n\n**硬盘** 要从硬盘安装 Red Hat Linux，您需要使用与\
    \ FTP 安装相同的启动盘和辅助盘。首先，您必须在目录树的顶级创建一个 **RedHat** 目录。您要安装的所有内容都应放置在该目录中。首先复制 *base*\
    \ 子目录，然后复制您想要安装的包到一个名为 **RPMS** 的另一个子目录中。您可以使用现有 DOS 分区或安装程序中不需要的 Linux 分区（例如，在已安装系统中用于数据存储的分区）上的可用空间。\n\
    \n如果您使用的是 DOS 文件系统，您可能无法使用完整的 Linux 文件名来命名 **RPM** 包。安装过程并不关心文件名看起来如何，但最好您记录它们，以便知道您在安装什么。\n\
