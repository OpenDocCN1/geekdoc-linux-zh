    \ for the Red Hat Linux/SPARC 4.1 release for the SPARC family of processors.\
    \ This chapter describes the differences between installing Red Hat Linux/SPARC\
    \ and Red Hat Linux/Intel. For further details on the installation procedure,\
    \ please see Chapter 2.\n\n### 4.1 Hardware\n\nRed Hat Linux/SPARC is known to\
    \ function on the following hardware:\n\n- sun4c architecture machines (IPC, SS1,\
    \ etc)\n- sun4m architecture machines (Classic, SS5, SS10, etc)\n- bwtwo, cg3,\
    \ cg6, TCX framebuffers (24 bit on the TCX)\n- cg14 framebuffer (in cg3 mode)\n\
    - SCSI and Ethernet on all of the above\n- type 4 and type 5 keyboards and mice\n\
    - external SCSI drives\n- CD-ROM drives (external and internal)\n- SCSI/Ether\
    \ SBUS expansion cards\n- Any original equipment Sun monitor for the above framebuffers\n\
    \nA partial list of **unsupported** hardware:\n\n- VME based sun4m machines, such\
    \ as the 4/690\n- sun4d (SS1000, SS2000)\n- sun4u (UltraSparc1, UltraSparc2, EnterPrise\
    \ UltraSparc servers)\n- sun4 architecture\n- Eurocard sun4c machines, called\
    \ the 'sun4e' under Solaris2.4 and others, are not supported. These are VME-bus\
    \ sun4c machines, to which the kernel has not been ported yet.\n\n### 4.2 Booting\
    \ from Floppy\n\nFirst you need to boot your system to the install program. You\
    \ will have to create your boot floppy, and creating it depends on which version\
    \ of the PROM you have. The **images directory** on your Red Hat Linux/SPARC CD\
    \ contains two images. Use *boot-r0.img* if you have a PROM version 0 or 1 (this\
    \ is the major number...PROM 1.6 is a type 1 PROM), Use *boot-v2.img* if you have\
    \ a PROM version 2.0 or greater. To create the floppy, you can use *rawrite.exe*\
    \ under MS-DOS (located on your Red Hat Linux/SPARC CD in the *dosutils* directory),\
    \ or you can use **dd** under Linux or Unix. Under MS-DOS, you would enter the\
    \ following commands (assuming the CD-ROM is drive **d**):\n\n```\nd:        \
    \    \ncd \\images     \n..\\dosutils\\rawrite.exe\n```\n\nWhen prompted, enter\
    \ the file name of the image to write to floppy. Under Linux or Unix, mount the\
    \ CD, change to the directory it is mounted under, and use the following command:\n\
    \n```\ndd if=images/boot-v2.img of=/dev/fd0\n```\n\nReplace boot-v2.img with boot-v0.img\
    \ if you have a version 0 or 1 PROM. Also note, do not use /dev/rfd0 under Solaris;\
    \ it will not work. Use /dev/fd0 instead.\n\nInsert the diskette, and at the PROM\
    \ prompt enter boot floppy. You will be presented with a SILO prompt. If you wish\
    \ to do your install using a ramdisk (it will use about 2M of RAM and is recommended\
    \ if you have 8M or more of RAM), you can simply press Enter at the SILO prompt.\
    \ If you wish to do an NFS-rooted install, you will need to supply some parameters\
    \ here. The formula is as follows:\n\n```\nlinux nfsroot=nfs.server.IP.address:/path/to/RH/image\n\
    ```\n\nFor this to work you will need a rarp entry or a bootp entry on your network\
    \ that will give your SPARC its IP address. This is covered in Section 4.3 below.\n\
    \n### 4.3 Booting from a Network\n\nIf you do not have floppy drive, and your\
    \ PROM is less than version 2, you will need to do a network boot. This is fairly\
    \ easy to do, but you will need a rarp entry on a server on your local network\
    \ to tell the target SPARC what its IP address is. This can be done on a Linux\
    \ system that has RARP built into the kernel (or inserted as a module), using\
    \ a command of this form:\n\n```\nrarp -s ip.address.of.sparc hw:address:of:sparc\n\
    ```\n\nYou also need an ARP entry in most cases; for example:\n\n```\narp -s ip.address.of.sparc\
    \ hw:address:of:sparc\n```\n\nNow you need to setup a TFTP server on your local\
    \ network to serve the kernel to the target SPARC. This should be the same machine\
