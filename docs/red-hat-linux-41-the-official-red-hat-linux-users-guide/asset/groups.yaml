  md: "\n## 10.5.2 Booting into Single User Mode\n\n- Full multiuser mode.\n- Reboot.\n\
    \nIf your machine gets into a state where it will not boot due to a bad `/etc/inittab`,\
    \ or will not let you log in because you have a corrupted `/etc/passwd` or have\
    \ simply forgotten your password, boot into single user mode by typing `linux\
    \ 1` at the LILO boot prompt. A very bare system will come up and you will be\
    \ given a shell from which you can fix things.\n\n### 10.5.3 Shutting Down\n\n\
    To shutdown Red Hat Linux, issue the `shutdown` command. You can read the `shutdown`\
    \ man page for complete details, but the two most common usages are:\n\n```\n\
    shutdown -h now\nshutdown -r now\n```\n\nEach will cleanly shutdown the system.\
    \ After shutting everything down, the first will halt the machine, and the second\
    \ will reboot.\n\nAvoid running the `reboot` or `halt` commands directly in order\
    \ to prevent damage to your filesystem.\n\n## 10.6 Rescue Modes\n\nWhen things\
    \ go wrong, there are several ways to work on fixing them. However, they require\
    \ that you understand your system well. This manual can't teach you what to do,\
    \ but we will present the ways that you can use our products to get into rescue\
    \ modes where you can use your own knowledge to rescue the system.\n\n### 10.6.1\
    \ Through LILO\n\nIf your system boots, but does not allow you to log in when\
    \ it has completed booting, you can use the `single` or `emergency` boot option.\
    \ At the LILO boot prompt, type `linux single` in order to boot in single-user\
    \ mode. In single-user mode, your local filesystems will be mounted, but your\
    \ network will not be activated. In emergency mode, almost nothing will be set\
    \ up. Only the root filesystem will be mounted, and it will be mounted read-only.\n\
    \n### 10.6.2 Emergency Boot Floppies\n\nThe installation floppy set can also be\
    \ used as a rescue disk set. When you boot the boot floppy, type **rescue** at\
    \ the boot prompt (on non-Intel platforms, add **rescue** as an option to the\
    \ kernel you are booting, for example, `linux rescue`), and the install process\
    \ will ask a few questions, request that you insert the second disk, and set up\
    \ shells on VC 1 and VC 2. The shell that is running is `ash`, a minimal bourne\
    \ shell with no history or command-line editing.\n\nThe `PATH` environment variable\
    \ is set so that once you have mounted your root partition on `/mnt`, binaries\
    \ from your root partition will be run if they do not exist on the floppy. Also,\
    \ the libraries in `/mnt/lib` and `/mnt/usr/lib` will be used if needed. You may\
    \ wish to change your `PATH` to not include `/bin` and `/usr/bin`, leaving `/mnt/bin`,\
    \ `/mnt/usr/bin`, etc., while you are working on repairing your system. If you\
    \ do that, you will need to use `/bin/umount` to unmount `/mnt`.\n\nLimited versions\
    \ of important utilities are available before you mount `/mnt`:\n\n- **mount**:\
    \ The mount command does not require that the device node being mounted already\
    \ exist, and doesn't require the full name of the device. It assumes ext2 filesystems\
    \ unless told otherwise.\n    - `mount /dev/sda1 /mnt -t ext2` is functionally\
    \ equivalent to `mount sda1 /mnt`\n- **ash**: The full version\n- **cat**: Does\
    \ not accept any options\n- **chmod**: The chmod command does not accept symbolic\
    \ mode names, only octal ones.\n- **cpio**: The full version\n- **e2fsck**: The\
    \ full version\n- **fdisk**: The full version\n- **gzip**: The full version\n\
    - **gunzip**: The full version\n- **insmod**: The full version\n- **ls**: The\
    \ full version\n- **lsmod**: Does not accept any options\n- **mkdir**: No GNU\
    \ long options\n- **mke2fs**: The full version\n- **mkmod**: The mkmod command\
    \ does not accept symbolic mode names, only octal ones.\n- **open**: The full\
    \ version\n- **rm**: No GNU long options\n- **rmmod**: The full version\n- **sh**:\
    \ Symlink to ash\n\n## Appendix A\n\n### Hardware Requirements\n\nAll devices\
    \ that have drivers in the standard Linux kernel are supported “out of the box”\
