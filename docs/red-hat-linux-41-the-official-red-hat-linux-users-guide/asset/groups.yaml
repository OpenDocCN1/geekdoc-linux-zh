    ## 2.4.18 Installing LILO


    In order to be able to boot your Red Hat Linux system, you usually need to install
    LILO (the LIinux LOader). You may install LILO in one of several places:


    - **The Master Boot Record (MBR)** is the recommended place to install LILO, unless
    another operating system loader (e.g., System Commander or OS/2''s Boot Manager)
    is already installed there. When your machine boots, LILO starts and presents
    the boot: prompt; you can boot Red Hat Linux or any other operating system you
    configure LILO to boot (see below).


    - **The first sector of your root partition** is recommended if you are already
    using another boot loader on your system (such as OS/2''s Boot Manager); then
    you can setup that boot loader to start LILO and boot Red Hat Linux.


    - **The first sector of a floppy diskette** is an alternative either of the above
    options; to boot Red Hat Linux, insert the LILO diskette into your machine''s
    floppy drive and reboot. LILO starts from the floppy and presents the boot: prompt.


    Select the location you wish to install LILO and press **OK**. If you do not wish
    to install LILO, press **Skip**.


    ## Limitations of LILO


    LILO is subject to some limitations imposed by most PC BIOSes. Here are the “rules”
    of where your root partition must live if you want to install LILO on a hard drive:


    1. If you have 2 IDE (or EIDE) drives, your root partition must live on one of
    them. This also includes any IDE CD-ROM drives on your primary controller. If
