    release 2.0 on, Red Hat Linux is built on a packaging system called RPM that ONLY
    uses pristine source (the same as what you''d find at the author''s ftp site)
    and possibly a Red Hat patch. Complete information on RPM is available on http://www.redhat.com.


    ### F.2.17 What version of X Windows is included with Red Hat?


    Red Hat Linux 4.1 ships with XFree86 3.2, and comes standard with a very nice
    configuration tool.


    ### F.2.18 Does Red Hat support UMSDOS installs?


    In a word, no. It is not a good performance idea. Aside from that, you don''t
    “need” MS-DOS on your machine :)

