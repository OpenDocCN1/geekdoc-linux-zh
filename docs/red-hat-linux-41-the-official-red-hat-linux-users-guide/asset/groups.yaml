    虽然 */etc/pam.conf* 中条目的顺序无关紧要，但条目内各行的顺序可能很重要。（实际上，重要的是每种 *服务类型*/*模块类型* 对各行的顺序。）虽然调用
    *required* 模块的顺序并不太重要，但还有其他可用的 *控制标志*。虽然 *optional* 很少使用，且在 Red Hat Linux 系统上默认从不使用，但
