    \nFigure 8.1: User and Group Configuration Panel\n\n### 8.1.1 Adding or Editing\
    \ a User\n\nThe same interface is used to add and edit users. To add a user, click\
    \ on the **Add** button in the main window. A dialog box will pop up like the\
    \ one in figure 8.2 will appear, with some defaults already filled in. To edit\n"
