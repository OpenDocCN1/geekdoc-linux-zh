  md: "\n-   -i displays package information such as name, description, release, size,\
    \ build date, install date, vendor, and other miscellaneous information.\n-  \
    \ -l displays the list of files that the package “owns”.\n-   -s displays the\
    \ state of all the files in the package. There are only two possible states, normal\
    \ and missing.\n-   -d displays a list of files marked as documentation (man pages,\
    \ info pages, README’s, etc).\n-   -c displays a list of files marked as configuration\
    \ files. These are the files you change after installation to adapt the package\
    \ to your system (sendmail.cf, passwd, inittab, etc).\n\nFor those options that\
    \ display file lists, you can add -v to your command line to get the lists in\
    \ a familiar ls -l format.\n\n### 7.2.5 Verifying\n\nVerifying a package compares\
    \ information about files installed from a package with the same information from\
    \ the original package. Among other things, verifying compares the size, MD5 sum,\
    \ permissions, type, owner and group of each file.\n\nrpm -V verifies a package.\
    \ You can use any of the Package Selection Options listed for querying to specify\
    \ the packages you wish to verify. A simple use is rpm -V foo which verifies that\
    \ all the files in the foo package are as they were when they were originally\
    \ installed. For example:\n\n-   To verify a package containing particular file:\n\
    \    ```\n    rpm -Vf /bin/vi\n    ```\n-   To verify ALL installed packages:\n\
    \    ```\n    rpm -Va\n    ```\n-   To verify an installed package against an\
    \ RPM package file:\n    ```\n    rpm -Vp foo-1.0-1.i386.rpm\n    ```\n\nThis\
    \ can be useful if you suspect that your RPM databases are corrupt.\n\nIf everything\
    \ verified properly there will be no output. If there are any discrepancies they\
    \ will be displayed. The format of the output is a string of 8 characters, a possible\
    \ “c” denoting a configuration file, and then the file name. Each of the 8 characters\
    \ denotes the result of a comparison of one attribute of the file to the value\
    \ of that attribute recorded in the RPM database. A single “.” (period) means\
    \ the test passed. The following characters denote failure of certain tests:\n\
    \n-   5 MD5 checksum\n-   S File size\n-   L Symlink\n-   T File modification\
    \ time\n-   D Device\n-   U User\n-   G Group\n-   M Mode (includes permissions\
    \ and file type)\n\nIf you see any output, use your best judgment to determine\
    \ if you should remove or reinstall the package, or somehow fix the problem.\n\
    \n## 7.3 Impressing Your Friends with RPM\n\nRPM is a very useful tool for both\
    \ managing your system and diagnosing and fixing problems. The best way to make\
    \ sense of all the options is to look at some examples.\n\n-   Let’s say you delete\
    \ some files by accident, but you aren’t sure what you deleted. If you want to\
    \ verify your entire system and see what might be missing, you would enter:\n\
    \    ```\n    rpm -Va\n    ```\n    If some files are missing, or appear to have\
    \ been corrupted, you should probably either re-install the package or uninstall,\
    \ then re-install the package.\n-   Let’s say you run across a file that you don’t\
    \ recognize. To find out which package owns it, you would enter:\n    ```\n  \
    \  rpm -qf /usr/Xl1R6/bin/xjewel\n    ```\n    The output would look like:\n \
    \   ```\n    xjewel-1.6-1\n    ```\n-   We can combine the above two examples\
    \ in the following scenario. Say you are having problems with /usr/bin/paste.\
    \ You would like to verify the package that owns that program but you don’t know\
    \ which package that is. Simply enter:\n    ```\n    rpm -Vf /usr/bin/paste\n\
    \    ```\n    and the appropriate package will be verified.\n-   If you are using\
    \ a program and want to find out more information about it, you can enter the\
    \ following to find out what documentation came with the package that “owns” that\
    \ program (in this case ispell):\n    ```\n    rpm -qdf /usr/bin/ispell\n    ```\n\
    \    The output would be:\n    ```\n    /usr/man/man4/ispell.4\n    /usr/man/man4/english.4\n\
    \    /usr/man/man1/unsq.1\n    /usr/man/man1/tryaffix.1\n    /usr/man/man1/sq.1\n\
    \    /usr/man/man1/munchlist.1\n    /usr/man/man1/ispell.1\n    /usr/man/man1/findaffix.1\n\
    \    /usr/man/man1/buildhash.1\n    /usr/info/ispell-info.gz\n    /usr/doc/ispell-3.1.18-1/README\n\
    \    ```\n-   You find a new koules RPM, but you don't know what it is. To find\
    \ out some information on it, enter:\n    ```\n    rpm -qip koules-1.2-2.i386.rpm\n\
    \    ```\n    The output would be:\n    ```\n    Name : koules Distribution: Red\
    \ Hat Linux Colgate\n    Version : 1.2 Vendor: Red Hat Software\n    Release :\
    \ 2 Build Date: Mon Sep 02 11:59:12 1996\n    Install date: (none) Build Host:\
    \ porky.redhat.com\n    Group : Games Source RPM: koules-1.2-2.src.rpm\n    Size\
    \ : 614939\n    Summary : SVGAlib action game; multiplayer, network, sound\n \
    \   Description :\n    ```\n    This arcade-style game is novel in conception\
