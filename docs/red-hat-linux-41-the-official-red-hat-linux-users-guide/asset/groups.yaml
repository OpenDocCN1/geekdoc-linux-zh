  mdcn: "\n\n## 10.5.2 进入单用户模式引导\n\n-   完全多用户模式。\n-   重启。\n\n如果你的机器进入了一种由于 `/etc/inittab`\
    \ 损坏而无法引导的状态，或者因为 `/etc/passwd` 损坏或你忘记了密码而无法登录，请在 LILO 引导提示符处输入 `linux 1` 以进入单用户模式。此时会启动一个非常精简的系统，并给你一个\
    \ shell，你可以通过它来修复问题。\n\n### 10.5.3 关闭系统\n\n要关闭 Red Hat Linux，请执行 `shutdown` 命令。你可以阅读\
    \ `shutdown` 的手册页以获取完整细节，但最常见的两种用法是：\n\n```\nshutdown -h now\nshutdown -r now\n\
    ```\n\n两者都能干净地关闭系统。在所有服务停止后，第一条命令将停止机器，第二条命令将重启机器。\n\n为了避免对文件系统造成损坏，请直接避免运行 `reboot`\
    \ 或 `halt` 命令。\n\n## 10.6 救援模式\n\n当系统出现问题时，有几种方法可以进行修复。然而，这要求你充分了解你的系统。本手册无法教你该做什么，但我们将介绍如何使用我们的产品进入救援模式，在那里你可以利用自己的知识来拯救系统。\n\
    \n### 10.6.1 通过 LILO\n\n如果系统能够引导，但在完成引导后不允许你登录，你可以使用 `single` 或 `emergency` 引导选项。在\
    \ LILO 引导提示符处，输入 `linux single` 以单用户模式引导。在单用户模式下，你的本地文件系统将被挂载，但你的网络不会被激活。在紧急模式下，几乎没有任何设置。只有根文件系统会被挂载，并且它是只读挂载的。\n\
    \n### 10.6.2 紧急启动软盘\n\n安装软盘集也可以用作救援磁盘集。当你启动引导软盘时，在引导提示符处输入 **rescue**（在非 Intel\
    \ 平台上，将 **rescue** 作为选项添加到你正在引导的内核中，例如 `linux rescue`），安装过程会问几个问题，要求你插入第二张磁盘，并在\
    \ VC 1 和 VC 2 上设置 shell。正在运行的 shell 是 `ash`，一个没有历史记录或命令行编辑功能的最小 bourne shell。\n\
    \n`PATH` 环境变量已设置，以便一旦你在 `/mnt` 上挂载了根分区，如果软盘上不存在根分区中的二进制文件，它们将被执行。同样，如果需要，`/mnt/lib`\
    \ 和 `/mnt/usr/lib` 中的库也会被使用。在修复系统时，你可能希望更改你的 `PATH`，使其不包含 `/bin` 和 `/usr/bin`，保留\
    \ `/mnt/bin`、`/mnt/usr/bin` 等。如果你这样做，你需要使用 `/bin/umount` 来卸载 `/mnt`。\n\n在挂载 `/mnt`\
    \ 之前，可用的重要实用程序版本有限：\n\n-   **mount**：mount 命令不要求被挂载的设备节点已经存在，也不要求设备的完整名称。除非另有说明，它假设是\
    \ ext2 文件系统。\n    -   `mount /dev/sda1 /mnt -t ext2` 在功能上等同于 `mount sda1 /mnt`\n\
    -   **ash**：完整版本\n-   **cat**：不接受任何选项\n-   **chmod**：chmod 命令不接受符号模式名称，只接受八进制模式。\n\
    -   **cpio**：完整版本\n-   **e2fsck**：完整版本\n-   **fdisk**：完整版本\n-   **gzip**：完整版本\n\
    -   **gunzip**：完整版本\n-   **insmod**：完整版本\n-   **ls**：完整版本\n-   **lsmod**：不接受任何选项\n\
    -   **mkdir**：没有 GNU 长选项\n-   **mke2fs**：完整版本\n-   **mkmod**：mkmod 命令不接受符号模式名称，只接受八进制模式。\n\
    -   **open**：完整版本\n-   **rm**：没有 GNU 长选项\n-   **rmmod**：完整版本\n-   **sh**：指向 ash\
    \ 的符号链接\n\n## 附录 A\n\n### 硬件要求\n\n所有在标准 Linux 内核中有驱动程序的器件在 Red Hat 内核中都是“开箱即用”支持的，除了声卡。然而，模块化内核简化了添加声卡支持的过程。有关如何执行此操作的更多信息，请参阅\
    \ Kernel-HOWTO（位于 `/usr/doc/HOWTO` 中）。\n\n有关内核直接支持的特殊硬件的更多信息，包括 SCSI 设备，请参阅 Hardware-HOWTO\
    \ 和 SCSI-HOWTO（与上述位置相同）。还有一个 XFree86 HOWTO 和一个 MetroCards 文件，列出了支持的显卡。\n\n需要连接一个\
    \ 1.44M 软驱作为第一个物理软盘设备（`a1`）。以下是各种流行软件组合的要求：\n\n**基于文本的最简安装**\n\n-   386sx 或更高级别的\
    \ CPU\n-   8M 内存\n-   40M 硬盘\n-   任何可用的显卡（Hercules, CGA, VGA, SVGA 等）\n-   任何支持的\
    \ CD-ROM 驱动器\n\n**带有 X 窗口系统的基于文本的最简安装**\n\n-   386sx 或更高级别的 CPU\n-   8M 内存\n-\
    \   80M 硬盘\n-   任何 XFree86 支持的显卡（VGA 和 SVGA，见下文）\n-   鼠标（支持大多数类型）\n-   任何支持的 CD-ROM\
    \ 驱动器\n\n**推荐配置**\n\n-   486dx 或更高级别的 CPU\n-   16M 内存\n-   300M 硬盘\n-   任何 XFree86\
    \ 或 Metro X 支持的 SVGA 卡\n-   三键鼠标\n-   SCSI 磁带驱动器（可选）\n-   UPS（可选）\n-   双速 CD-ROM\
    \ 驱动器\n\n支持的显卡包括：\n\n-   大多数 Diamond 卡\n-   大多数基于 S3 的卡\n-   基于 ET4000 的卡\n- \
    \  ATI 卡\n-   Cirrus Logic 542x 和 543x\n-   基于 Chips and Technologies 的卡\n-  \
    \ Trident 8900 和 9400\n-   大多数 #9 卡\n\n支持的 CD-ROM 驱动器包括：\n\n-   所有符合 IDE/ATAPI\
    \ 标准的驱动器\n-   所有连接到受支持控制器卡的 SCSI 驱动器\n-   所有 Sound Blaster 接口驱动器（Matsushita/Kotobuki/Panasonic）\n\
    -   Mitsumi 驱动器\n-   Sony 535, CDU 31, CDU 33\n\n## 附录 B\n\n### 模块参数\n\n本附录旨在说明某些内核模块*可能*需要的*一些*可能参数。需要注意的是，在大多数情况下，不需要使用额外的参数。\n\
    \n#### B.1 CD-ROM 参数\n\n| 硬件 | 参数 |\n| --- | --- |\n| Mitsumi CD-ROM | mcd=port,irq\
    \ |\n| Sony 31&33 CD-ROM | cdu31a=base_addr,[irq=0][,pas] |\n| Aztech CD268 |\
    \ aztcd=port |\n| SB Pro 或 16 兼容 | sbpcd=io_addr,(SB,Laser mate,SPEA) |\n| ATAPI/IDE\
    \ CD-ROM 驱动器 | hd(a,b,c,d)=cdrom |\n\n上述示例如下：\n\n| 示例 | 配置 |\n| --- | --- |\n\
    | mcd=0x340,11 | 非 IDE Mitsumi，端口 340，IRQ 11 |\n| cdu31a=0x340,0 | CDU 31 -或-\
    \ 33，端口 340，无 IRQ |\n| aztcd=0x220 | Aztech CD-ROM，端口 220 |\n| hdc=cdrom | IDE，第二接口的从设备\
    \ |\n| sbpcd=0x230,SoundBlaster | Panasonic 类型 CD-ROM，端口 230 |\n\n**注意：** 大多数新型\
    \ Sound Blaster 卡带有 IDE 接口。你不需要使用 \"sbpcd\" 参数，只需使用 hd* 参数即可。\n\n#### B.2 SCSI\
    \ 参数\n\n| 硬件 | 参数 |\n| --- | --- |\n| SCSI Seagate ST0x | st0x=base_addr,irq |\n\
    | SCSI Future Domain TMC-8xx | tmc8xx=base_addr,irq |\n| SCSI Trantor T128 | t128=base_addr,irq\
    \ |\n| 基于 SCSI NCR-5380 | ncr5380=port,irq,dma_channel |\n| Adaptec 151,2x, SB\
    \ SCSI | aha152x=port,irq,scsi_id,reconnect_parity |\n| Adaptec 1542 | aha1542=base_addr\
    \ |\n| Buslogic | buslogic=base_addr |\n| Pro Audio Spectrum / Studio 16 | pas16=port,irq\
    \ |\n\n一些示例如下：\n\n`aha1542=0x330 aha152x=0x330,11,7 tmc8xx=0x330,11`\n\n注意：上述示例较为冗长。对于\
    \ AHA1522，请使用 \"aha152x\"。对于 AHA1505，请使用 \"aha152x\"。对于 TMC800，请使用 \"tmc8xx\"\
    。\n\n当参数中有逗号时，请确保不要在逗号后加空格。如果你要在命令行提供参数，唯一的空格应该出现在 `11nx` 之后以及多个参数之间（例如 `11nx\
    \ mcd=0x340,11 bmouse=5`）。\n\n#### B.3 以太网参数\n\n以太网参数的格式如下：\n\n`ether=irq,base_addr,mem_start,mem_end`\n\
    \n然而，对于许多网卡来说，这不应该必要。一个示例如下：\n\n`ether=11,0x360`\n\n注意：最后两个参数在大多数（如果不是全部）时间都可以省略。另外，`11nx`\
    \ 只能识别系统中的第一个以太网卡。要让它识别两个，你必须使用如下的参数：\n\n"
