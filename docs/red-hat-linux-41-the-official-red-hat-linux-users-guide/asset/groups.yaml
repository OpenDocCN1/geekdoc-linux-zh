    如果您需要制作辅助软盘，请标记第二张软盘，将其插入软盘驱动器，然后使用以下命令：


    ```bash

    dd if=supp.img of=/dev/fd0 bs=1440k

    ```


    ### 不使用启动软盘进行安装


    或者，如果您的计算机上安装了 MS-DOS，您可以不制作软盘而直接从光盘启动安装系统。为此，请使用以下命令（假设您的 CD 是 d: 盘）：


    ```

    d:

    cd \dosutils

    autoboot.bat

    ```


    ### 2.3.2 关于虚拟控制台的说明


    Red Hat Linux 安装系统不仅仅是在引导您通过安装过程时显示的对话框。事实上，安装系统在运行过程中会显示几种不同种类的诊断消息，并为您提供一种从
    shell 提示符输入命令的手段。它在五个*虚拟控制台*上显示安装对话框、shell 提示符和消息，您可以通过单个按键在这些虚拟控制台之间切换。如果您在安装
    Red Hat Linux 时遇到问题，这些虚拟控制台可能非常有用；显示在安装日志或系统日志中的消息可以帮助您定位问题。请参见图 2.1 了解虚拟控制台的列表、切换到它们的按键及其内容。


    | 控制台 | 按键 | 内容 |

    | :--- | :--- | :--- |

    | 1 | `Alt` + `F1` | 安装对话框 |

    | 2 | `Alt` + `F2` | shell 提示符 |

    | 3 | `Alt` + `F3` | 安装日志（来自安装程序的 mensagem） |

    | 4 | `Alt` + `F4` | 系统日志（来自内核等的 mensagem） |

    | 5 | `Alt` + `F5` | 程序输出（来自其他程序的 mensagem） |


    图 2.1：虚拟控制台信息


    ### 2.3.3 使用对话框


    您可以使用一组简单的按键来浏览安装对话框。在大多数对话框中，有一个*光标*或*高亮*，您可以使用箭头键（`左` `右` `上` `下`）、`Tab` 键和
    `Alt` + `Tab` 键移动它。每个屏幕底部都列有移动命令的摘要。


    要“按下”一个按钮（如 `OK`），请将光标 `Tab` 到该按钮并 pressing `Space` 键。要从项目列表中选择一个项目，请将高亮移动到要选择的项并
    pressing `Enter` 键。要从*检查列表*中选择任意数量的项目，请将高亮移动到要选择的项并 pressing `Space` 键以选择该项目。要取消选择该项目，请再次
    pressing `Space` 键。pressing `F12` 接受当前值并进入下一个对话框；这通常等同于 pressing `OK` 按钮。


    **请注意：** 在安装过程中请勿随意按键；这可能会导致不可预测的行为。


    ## 2.4 逐步安装


    ### 2.4.1 启动安装系统


    #### 引导


    要开始安装 Red Hat Linux，请将刚才创建的启动软盘插入软盘驱动器并重新启动机器（如果您的机器上安装了 MS-DOS，您可以直接从 CD-ROM
    开始安装；请参见上文第 2.3.1 节）。将显示 **boot:** 提示符；请按 `Enter` 键启动。观察启动消息，查看 Linux 内核是否检测到了您的硬件。如果它未能正确检测到您的硬件，您可能需要重新启动并在
    **boot:** 提示符下输入一些选项，例如：


    ```

    boot: linux hdc=cdrom

    ```


    按 `Enter` 键使用这些选项启动。如果您确实需要指定一些启动 *选项*，请记下它们；稍后将会用到。


    **请注意：** 由于 Red Hat Linux 支持在多种不同类型的硬件上进行安装，许多驱动程序（包括 SCSI 适配器、网卡和许多 CD-ROM 的驱动程序）并未内置于安装过程中使用的
    Linux 内核中；相反，它们作为*模块*提供，并在安装过程中按需加载。在您加载这些驱动程序时，您将有机会指定其选项，实际上，这些驱动程序会忽略您在 **boot:**
    提示符下为它们指定的任何选项。请参见上文第 2.2.2 节了解关于安装系统中内置驱动程序的更多信息。


    #### 开始安装


    引导完成后，安装过程首先会询问您是否正在使用彩色显示器（参见图 2.2）。默认选择为 **是**；如果您无法区分光标或高亮，请按一次 `Tab` 键，然后按
    `Enter` 键继续。接下来


    '
