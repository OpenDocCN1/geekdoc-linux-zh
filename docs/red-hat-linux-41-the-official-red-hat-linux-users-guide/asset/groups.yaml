    ### 1.5 从先前版本升级


    Red Hat Linux 4.1 的安装过程包括从先前的 Red Hat Linux 版本（基于 RPM 技术的 2.0、2.1、3.0.3 和 4.0）进行升级的能力。升级您的系统将安装模块化的
    2.0.x 内核以及安装在您机器上的包的更新版本。升级过程使用 `.rpmsave` 扩展名（例如，`sendmail.cf.rpmsave`）保留现有的配置文件，并留下一个日志，记录它在
    `/tmp/upgrade.log` 中采取了哪些操作。随着软件的发展，配置文件格式可能会发生变化，因此您应该在集成更改之前仔细比较您的原始配置文件和新文件。


