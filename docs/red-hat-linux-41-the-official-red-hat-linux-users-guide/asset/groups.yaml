  md: "\n## E.7 Running the Flash Management Utility\n\nThe run command is used to\
    \ run the flash management utility. Before you start you will need a device available\
    \ to Milo that contains the updateflash program. This (like vminux) can be gzip'd.\
    \ You need to run the flash management utility program from the Milo using the\
    \ (run) command:\n\n```\nMILO> run fd0:fmuz.gz\n```\n\nOnce it has loaded and\
    \ initialised, the flash management utility will tell you some information about\
    \ the flash device and give you a command prompt. Again the help command is most\
    \ useful.\n\n```\nLinux Milo Flash Management Utility V1.0\nFlash device is an\
    \ Intel 28F008SA\n16 segments, each of 0x10000 (65536) bytes\nScanning Flash blocks\
    \ for usage\nBlock 12 contains the environment variables\nFMU>\n```\n\nNote that\
    \ on systems where environment variables may be stored and where there is more\
    \ than one flash block (for example, the AlphaPC64) the flash management utility\
    \ will look for a block to hold Milo's environment variables. If such a block\
    \ already exists, the flash management utility will tell you where it is. Otherwise,\
    \ you must use the environment command to set a block and initialise it. In the\
    \ above example, flash block 12 contains Milo's environment variables.\n\n###\
    \ E.7.1 The \"help\" command\n\n```\nFMU> help\nFMU command summary:\n\nlist -\
    \ List the contents of flash\nprogram - program an image into flash\nquit - Quit\n\
    environment - Set which block should contain the environment variables\nbootopt\
    \ num - Select firmware type to use on next power up\nhelp - Print this help text\n\
    FMU>\n```\n\nNote that the environment and bootopt commands are only available\
    \ on the EB66+, the AlphaPC64 and the EB164 systems (and their clones).\n\n###\
    \ E.7.2 The \"list\" command\n\nThe \"list\" command shows the current usage of\
    \ the flash memory. Where there is more than one flash block, the usage of each\
    \ flash block is shown. In the example below you can see that Windows NT ARC is\
    \ using blocks 4:7 and block 15.\n\n```\nFMU> list\n\n Flash blocks:  0:DBM  1:DBM\
    \  2:DBM  3:WNT  4:WNT  5:WNT  6:WNT  7:WNT  8:Milo\n 9:Milo  10:Milo  11:Milo\
    \  12:Milo  13:0  14:0  15:WNT\n Listing flash Images\n\n Flash image starting\
    \ at block 0:\n    Firmware Id:   0 (Alpha Evaluation Board Debug Monitor)\n \
    \   Image size is 191248 bytes (3 blocks)\n    Executing at 0x300000\n\n Flash\
    \ image starting at block 3:\n    Firmware Id:   1 (Windows NT ARC)\n    Image\
    \ size is 277664 bytes (5 blocks)\n    Executing at 0x300000\n\n Flash image starting\
    \ at block 8:\n    Firmware Id:   7 (Milo/Linux)\n    Image size is 217896 bytes\
    \ (4 blocks)\n    Executing at 0x200000\n\n FMU>\n```\n\n### E.7.3 The \"program\"\
    \ command\n\nThe flash management utility contains a compressed copy of a flash\
    \ image of Milo. The \"program\" command allows you to blow this image into flash.\
    \ The command allows you to back out, but before you run it you should use the\
    \ \"list\" command to see where to put Milo. If Milo is already in flash, then\
    \ the flash management utility will offer to overwrite it.\n\n```\nFMU> program\n\
    Image is:\nFirmware Id: 7 (Milo/Linux)\nImage size is 217896 bytes (4 blocks)\n\
    Executing at 0x200000\nFound existing image at block 8\nOverwrite existing image?\
    \ (N/y)? y\nDo you really want to do this (y/N)? y\nDeleting blocks ready to program:\
    \ 8 9 10 11\nProgramming image into flash\nScanning Flash blocks for usage\nFMU>\n\
    ```\n\nWait until it has completed before powering off your system.\n\nNote: I\
    \ cannot emphasise just how careful you must be here not to overwrite an existing\
    \ flash image that you might need or render your system useless. A very good rule\
    \ is never to overwrite the Debug Monitor.\n\n### E.7.4 The \"environment\" command\n\
    \nThis selects a flash block to contain Milo’s environment variables.\n\n### E.7.5\
    \ The \"bootopt\" command\n\nThis is just the same as Milo’s \"bootopt\" command,\
    \ see Section E.6.4 The \"bootopt\" command.\n\n### E.7.6 The \"quit\" command\n\
    \nThis is really pretty meaningless. The only way back to Milo (or anything else)\
    \ once the flash management utility has run is to reboot the system.\n\n## E.8\
    \ Restrictions\n\nUnfortunately this is not a perfect world and there, as always,\
    \ some restrictions that you should be aware of.\n\nMilo is not meant to load\
    \ operating systems other than Linux, although it can load images linked to run\
    \ at the same place in memory as Linux (which is `0xFFFFFC0000310000`). This is\
    \ how the flash management utilities can be run.\n\nThe PALCode sources included\
    \ in `trmniniboot/palcode/t/ttlah` are correct, however there are problems when\
    \ they are built using the latest gas. They do build if you use the ancient a.out\
    \ gas that's supplied in the Alpha Evaluation Board toolkit (and that's how they\
    \ were built). I'm trying to get someone to fix the new gas. Meanwhile, as a workaround,\
    \ I have provided pre-built PALCode for the supported boards and David Mosberger-Tang\
    \ has a fixed gas on his ftp site.\n\n## E.9 Problem Solving\n\nHere are some\
    \ common problems that people have seen, together with the solutions.\n\n**Reading\
    \ MS-DOS floppies from the Evaluation Board Debug Monitor.** Several people reported\
    \ having problems reading files from the floppy disk using the Evaluation Board\
    \ Debug Monitor supplied with Digital Alpha Evaluation Boards such as the AlphaPC64.\
    \ Usually, the Debug Monitor can load the first few sectors all right, but then\
    \ goes into an endless loop complaining about “bad sectors.” Apparently, there\
    \ is an incompatibility between the DOS file system as expected by the Debug Monitor\
    \ and the Linux implementation of DOSFS. To make the long story short: if you\
    \ run into this problem, try using DOS to write the floppy disk. For example,\
    \ if loading the file `milo.cab` doesn't work, use a DOS machine, insert the floppy\
    \ and then do:\n\n```\ncopy a:milo.cab c:\ncopy c:milo.cab a:\ndel c:milo.cab\n\
    ```\n\nThen try booting from that floppy again. This normally solves the problem.\n\
    \n**Milo displays a long sequence of 0 and does not accept input.** This usually\
    \ happens when Milo was built to use COM1 as a secondary console device. In such\
    \ a case, Milo echo output to COM1 and accepts input from there also. This is\
    \ great for debugging but not so great if you have a device other than a terminal\
    \ connected. If this happens, disconnect the device or power it down until the\
    \ Linux kernel has booted. Once Linux is up and running, everything will work\
    \ as expected.\n\n## E.10 Acknowledgements\n\nI would like to thank:\n\n- Eric\
    \ Rasmussen and Eilteen Samberg the authors of the PALcode,\n- Jim Paradis for\
    \ the keyboard driver and the original MILO interface,\n- Jay Estabrook for his\
    \ help and bugfixes,\n- David Mosberger-Tang for the freeware BIOS emulation and\
    \ his support and encouragement,\n- Last (and *not* least) Linus Torvalds for\
    \ the timer code and his kernel.\n\nThere are a number of things that still need\
    \ doing to Milo, if you want to add something yourself, then do let me know, david.rusling@reo.mts.dec.com\
    \ so that we do not duplicate our efforts.\n\nFinally, a big thank you to Digital\
    \ for producing such a wonderful chip (and paying me to do this).\n\n# Appendix\
    \ F\n\n# Red Hat Linux Frequently Asked Questions\n\n## F.1 Introduction\n\nThis\
    \ is the second edition of the Official Red Hat Linux FAQ. It is maintained by\
    \ redhat@redhat.com and all comments or suggestions for this FAQ should be sent\
    \ to that address. To get updates to this FAQ, send mail to faq@redhat.com for\
    \ an automated reply, or look in the docs directory of any Red Hat mirror.\n\n\
    If you have this document in printed form (like from the Red Hat Users Guide)\
    \ and want the most up to date version, please see http://www.redhat.com or email\
    \ faq@redhat.com.\n\n## F.2 General Questions\n\n### F.2.1 Where can I get information\
    \ on Red Hat Linux?\n\nContact Red Hat Software for ordering information. The\
    \ best way is via http://www.redhat.com. For other info, send mail to info@redhat.com\
    \ for an automated reply (quite helpful...really). You can also poke around\n\n\
    ftp://ftp.redhat.com and http://www.redhat.com for new announcements and product\
    \ info.\n\n### F.2.2 What Media is Red Hat Linux Available on?\n\nIt is available\
    \ on CD and via FTP at this point. To find out where you can FTP it from, see\
    \ the question on Red Hat Mirrors.\n\n### F.2.3 The Red Hat FTP site is slow.\
    \ Are there mirrors?\n\nThere are several mirrors of the Red Hat FTP site:\n\n\
    - UK\n  - sunsite.doc.ic.ac.uk /packages/linux/redhat\n  - nfs-uxsup.cox.cam.ac.uk\
    \ /pub/redhat/\n  - ftp.ox.ac.uk /pub/linux/redhat\n- Europe\n  - ftp.pk.edu.pl\
    \ /pub/linux/redhat\n  - ftp.arch.pwr.wroc.pl /mirror/linux/redhat/\n  - ftp.ras.ru\
    \ /pub/Linux/redhat\n  - ftp.u-bordeaux.fr /pub/Linux/redhat\n  - ftp.ibp.fr /pub/linux/distributions/redhat\n\
    \  - redhat.netvision.net.il /pub/mirrors/redhat\n  - ftp.sorosis.ro /pub/mirrors/ftp.redhat.com\n\
    \  - ftp.mp1-sb.mpg.de /pub/linux/mirror/ftp.redhat.com\n  - ftp.jate.u-szeged.hu\
