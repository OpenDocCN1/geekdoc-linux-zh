    ## C.2. METRO X CONFIGURATION FILE


    CursorScreenOne In a multiple screen configuration, this setting constrains the
    cursor to screen 0.


    NoBackingStore This turns off backing store. Backing store is a server feature
    that allows programs to create complex drawings and have the server automatically
    handle exposure requests, thus preventing lengthy re-draw cycles. Backing store
    uses system memory to hold the window contents and can actually slow down the
    system if there is limited memory.


    NoCursorWrap In a multiple screen configuration, this setting prevents the cursor
    from wrapping from screen 1 to screen 0.


    NoFontCache This turns off font caching.


    NoKeyboard This setting disallows keyboard input.


    NoLEDs No LED processing is done by the server.


    NoPixmapCache This turns off pixmap and stipple caching.


    NotPrimaryMonitor No console processing is done for Virtual Terminal Support.
    This is normally used when X is run on a graphics card that is not driving the
    console.


    Option <string> This specifies a special option passed to the server. It might
    specify the card model or a specific feature not typically used. Normally configX
    inserts the correct options in the Xconfig file.


    Option HardwarePex Add this line to the Xconfig file to use the Hardware Z Buffer
    on the Matrox MGA Impression Plus graphics card. This file entry must immediately
    follow the Driver MGA entry.


    Option NoHardwareCursor Add this line to disable hardware cursor support. This
    file entry must immediately follow the Driver entry.


    RemapCursorPad This configuration causes the X server to send back different keycodes
    for the keypad arrow keys and cursorpad arrow keys. This is a minor violation
    of the X protocol, but it allows clients to differentiate between these keys.


    SndFormat <number> <number> <number> <number> Metro-X 11.5 can read X11.4 SNF
    (Server Natural Format) fonts. Since there is no standard for SNF fonts, the following
    four numbers can be adjusted to read most SNF fonts. The four number parameters
    represent the following values, normally built into the server at compile time:


    ```text

    BITMAP_BIT_ORDER

    IMAGE_BYTE_ORDER

    GLYPHPADBYTES

    BITMAP_SCANLINE_UNIT

    ```


    For example, to read SCO SNF fonts, add this line to the Xconfig file:


    ```text

    SnfFormat 1 0 1 1

    ```


    Or, to read SNF fonts compatible with X11 R4 from Interactive Systems Corporation,
    add this line to the Xconfig file:


    ```text

    SnfFormat 1 1 4 4

    ```


    Terminate Terminate causes the server to exit when the last client disconnects.
    Normally xinit kills the X server when the last client disconnects, before the
    server can reset.


    Trace <number> This prints additional debugging information.


    VideoRam <number> This specifies the amount of video memory on the graphics card,
    specified in terms of 1024-byte units (with one megabyte equal to a value of 1024).
    The X server usually detects how much memory is on the card.


    VisualClass <number> This uses the default VisualClass from /usr/include/X11 and
    is based on the following table:


    | VISUAL_CLASS | NUMBER |

    | :---------------------------------- | :------ |

    | StaticGray | 0 |

    | GrayScale | 1 |

    | StaticColor | 2 |

    | PseudoColor | 3 |

    | TrueColor | 4 |

    | DirectColor | 5 |


    Figure C.2: Visual Classes


    On monochrome monitors the line


    ```text

    VisualClass 1

    ```


    should be added to the Xconfig file.


    ### C.2.4 Modes


    The last section of the Xconfig file is the Mode database (Modes). It contains
    the VESA timing specifications for various resolutions. The default values work
    for most graphics cards, but they can be tweaked to center the image and adjust
    its size on the monitor. Most of the Metro-X servers use this database to configure
    the card for graphics mode. The numbers indicate which clock to use from the DisplayConfig
    file''s CLOCKS line, and also show the horizontal and vertical timing values.
    More specifically, an example of the numbers are:


    `"1024x768" 65 1024 1092 1220 1344 768 786 791 810`


    The following table shows the definition of each Modes number from the prior example.


    | VALUE | Meaning |

    | :--- | :--- |

    | "1024X768" | Screen Resolution in Pixels |

    | 65 | Pixel Clock (MHz) |

    | 1024 | Pixels Displayed (H) |

    | 1092 | Sync Start (H) |

    | 1220 | Sync End (H) |

    | 1344 | Total (H) |

    | 768 | Pixels Displayed (V) |

    | 786 | Sync Start (V) |

    | 791 | Sync End (V) |

    | 810 | Total (V) |


    Figure C.3: Modes Definitions


    These numbers represent the ranges the electron beam traverses per one vertical
    refresh of the screen. They determine where the image is positioned on the screen,
    and what the refresh rate is.


    ## Adjusting the Image Position


    You can edit the Modes numbers if the screen image does not properly center or
    fill the monitor screen. Be sure to center the image before stretching or shrinking
    it. Any adjustments you make will go into effect after restarting the X server.


    **Centering the Image:** The **Pixels Displayed** numbers must match the desired
    physical screen resolution. The **Sync Start** and **Sync End** numbers must be
    increased or decreased (to move left or right: up or down) at the same time and
    by the same amount, and stay within the range of the **Displayed** and **Total**
    values.


    - Image too far right: To adjust an image that is too far to the right, increase
    the **Horizontal Sync Start** and **Horizontal Sync End** values equally.

    - Image too far left: To adjust an image that is too far to the left, decrease
    the **Horizontal Sync Start** and **Horizontal Sync End** values equally. For
    example, to adjust an image that is too far to the left, you could begin the process
    by adding 8 to the two horizontal timing numbers (Sync Start and Sync End). Make
    sure that the Sync End number does not exceed the **Horizontal Total** number.
    The same technique applies for vertical positioning:

    - Image too low: To adjust an image that is too far to the bottom, decrease the
    **Vertical Sync Start** and **Vertical Sync End** values equally.

    - Image too high: To adjust an image that is too far to the top, increase the
    **Vertical Sync Start** and **Vertical Sync End** values equally. For example,
    to adjust an image that is too high, you could begin the process by adding 8 to
    the two vertical timing numbers (Sync Start and Sync End). Make sure that the
    Sync End number does not exceed the **Vertical Total** number.


    **Stretching or Shrinking the Image:** The **Pixels Displayed** numbers must match
    the desired physical screen resolution. The **Total** value is increased or decreased
    to stretch or shrink the image. In addition, to hold the center position, the
    **Sync Start** and **Sync End** numbers must be increased or decreased equally,
    based on one-half of the difference in the changed **Total** value. For instance,
    if you added 10 to the **Horizontal Total** value, you would also add 5 to the
    **Horizontal Sync Start** value and 5 to the **Horizontal Sync End** value.


    - Image too narrow horizontally: To stretch an image that is too narrow horizontally
    (extra space appears on the left and right), increase the Horizontal Total by
    amount x, then add one-half of x to both the Horizontal Sync Start and Horizontal
    Sync End values.

    - Image too narrow vertically: To stretch an image that is too narrow vertically
    (extra space appears on the top and bottom), increase the Vertical Total by amount
    x, then add one-half of x to both the Vertical Sync Start and Vertical Sync End
    values.

    - Image too wide horizontally: To shrink an image that is too wide horizontally
    (the image extends beyond the left and right edges), decrease the Horizontal Total
    by amount x, then subtract one-half of x from both the Horizontal Sync Start and
    Horizontal Sync End values.

    - Image too tall vertically: To shrink an image that is too tall vertically (the
    image extends beyond the top and bottom edges), decrease the Vertical Total by
    amount x, then subtract one-half of x from both the Vertical Sync Start and Vertical
    Sync End values.


    ## Extensions


    Extensions are configured in the /usr/lib/X11/Metro/Extensions file.

    Most extensions are dynamically loaded; that is, if they are needed they are loaded
    automatically without any additional manual configuration. An extension that is
    “ON” is loaded at server startup and never unloaded. An extension that is “DYN”
    is dynamically loaded on request by an X client XQueryExtension call. These extensions
    display with XListExtensions or xdpyinfo. An extension that is “OFF” can not be
    used, nor is it displayed with XListExtensions or xdpyinfo.


    ## Special Notes


    - Multi-Buffering and DOUBLE-BUFFER can not be dynamically loaded.

    - They must be set to “ON” or “OFF”.

    - GLX (OpenGL) can be dynamically loaded, however GLX depends on DOUBLE-BUFFER
    being “ON”. Therefore, to use GLX, set DOUBLE-BUFFER to “ON” and GLX to “DYN”.

