  - "[PAGE 267]\n\n# # Red Hat Linux Release 4.1\n\nOfficial\" Red Hat 4.1 includes\
    \ all the latest Linux tools and utilities including the improved networking and\
    \ hardware support of the latest 2.0 kernel.\n\nThis manual is the \"Official\"\
    \ Manual at for the installation and management of your Red Hat Linux system.\
    \ Whether you downloaded Red Hat off of a site on the Internet, or purchased Red\
    \ Hat Linux from Red Hat Software or as part of some other product or CD-Rom set,\
    \ this manual will make your use of this advanced technology easier and more enjoyable.\n\
    \n\"Red Hat's biggest advantage is that so many of the packages and tools require\
    \ little or no configuration... Red Hat is overall the most sophisticated and\
    \ commercial release of Linux.\" *Inforworld Magazine*.\n\nThis POSIX based advanced\
    \ easy-to-administer Operating System allows your PC to function as a UNIX workstation\
    \ effectively and reliably for advanced computing tasks. Perfect for applications\
    \ ranging from setting up an Internet Web or FTP server, Internet Applications,\
    \ Research work, Software Development, even advanced computer game playing.\n\n\
    # ## EASY TO INSTALL AND MANAGE.\n\nWith RHPM\"'s packaging system and the modular\
    \ kernel, installation of an operating system has never been easier. Simply choose\
    \ one or more configuration options and your installation can be used for the\
    \ following:\n\n+   - C and C++ Development  \n+   - NFS Server  \n+   - Anonymous\
    \ FTP/ Gopher Server  \n+   - News Server  \n+   - Network Management  \n+   -\
    \ Workstation  \n+   - Dialog Workstation  \n+   - Game Machine  \n+   - X Window\
