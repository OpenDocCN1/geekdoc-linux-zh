    ## 6.2 Help from the Internet Community


    ### 6.2.1 Red Hat Mailing Lists


    If you can’t find help for your problem on line and you have WWW access, you should
    see http://www.redhat.com/mailing-list.html. Here you can search the archives
    of the redhat-list. Almost all questions have already been answered there.


    If you’ve exhausted all options in finding help for your problem, your next best
    alternative is to ask for help on the Red Hat Mailing Lists. For the most up to
    date info, see http://www.redhat.com/mailing-list.html.


    The request address for each of our lists is:


    ```

    redhat-list-request@redhat.com

    redhat-digest-request@redhat.com

    redhat-announce-list-request@redhat.com

    redhat-devel-list-request@redhat.com

    rpm-list-request@redhat.com

    arp-list-request@redhat.com

    sparc-list-request@redhat.com

    ```


    To subscribe, send mail to the address of the list you want to subscribe to with
    subscribe in the Subject: line.


    To unsubscribe, send mail to the address of the list you want to unsubscribe from
    with unsubscribe in the Subject: line.


    Then to send mail to the list, you just send it to the address above without the
    -request in the name. The only exception to this is the redhat-digest which is
    only a digest version the redhat-list. In that case the address is redhat-list@redhat.com.


    ### 6.2.2 USENET Newsgroups


    Another good source of help is the comp.os.linux hierarchy on USENET. If you are
    familiar with news, you should check it out. There will be a "Using News" Tips
    document in the future to assist those unfamiliar with Usenet.

