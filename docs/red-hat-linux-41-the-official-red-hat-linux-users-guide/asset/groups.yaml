    ## 8.6 Kernel Daemon Configuration


    As discussed in Chapter 5, Red Hat Linux includes "kerneld", the Kernel Daemon,
    which automatically loads some software and hardware support into memory as it
    is needed, and unloads it when it is no longer being used.


    The tool shown in Figure 8.17 manages the configuration file for kerneld. While
    kerneld can load some things, such as filesystems, without explicit configuration,
    it needs to be told what hardware support to load when it is presented with a
    generic hardware request.


    ![](img/3d09de050edc8aef2a604e36a4127b47_129_0.png)


    For instance, when the kernel wants to load support for ethernet, kerneld needs
    to know which ethernet card you have, and if your ethernet card requires special
    configuration, it needs to know about that, too.


    ### 8.6.1 Changing Module Options


    To change the options being given to a module when it is loaded, click on the
    line to select it, then click the Edit button. kernelcfg will bring up a window
    which looks like Figure 8.18. The options which kernelcfg knows about them (normally
    all available options) each have their own window. Normally, you will want to
    ignore the "Other arguments:" window. Some modules normally take no arguments;
    just in case, they have an "Arguments:" window which allows you to enter configuration
    information.


    ![](img/3d09de050edc8aef2a604e36a4127b47_130_0.png)


    ### 8.6.2 Changing Modules


    To change which module gets invoked to provide a generic service, such as an ethernet
    card or SCSI host adapter module, you need to delete the old one and add a new
    one. To delete a module, select it by clicking on it, then click on **Delete**.
    Then click on **Add** to add the new module, as explained in the following section.


    If you have changed your SCSI controller (**scsi_hostadapter**), remember to make
    a new initial ramdisk with the `/sbin/mkinitrd` command as documented in section
    5.1.2.


    ### 8.6.3 Adding Modules


    To add a module of any type, click on the **Add** button. You will be presented
    with a dialog box (Figure 8.19) asking you to choose a module type. Ethernet is
    eth, Token Ring is tr, SCSI controllers are **scsi_hostadapter**, and so on. Click
    **OK** to continue to the next dialog box. If there is more than one module which
    can be used for the module type you have chosen, you will be presented with a
    dialog box (Figure 8.20) which asks which module you want to use, and may also
    ask for specifics about the type of module; for ethernet, for example, you need
    to choose from **eth0, eth1**, etc. When you are done, click **OK** again to continue
    to specify any module options in the next dialog box (Figure 8.20), which is the
    same dialog box with which you are presented when you edit a module.


    ![](img/3d09de050edc8aef2a604e36a4127b47_131_0.png)


    Figure 8.19: Adding a module


    ![](img/3d09de050edc8aef2a604e36a4127b47_131_1.png)


    Figure 8.20: Selecting from available modules


    ### 8.6.4 Restarting Kernel


    The changes that you make with the Kernel Daemon Configuration tool will be made
    in the file */etc/conf.modules*, which kernel reads whenever it is started. Once
    you have made changes, you can re-start kernel by clicking on the **Restart kernel**
    button. This will not cause any modules which are currently in use to be re-loaded;
    it will only notify kernel to use the configuration when it loads more modules
    in the future.


