    \ DISPLAY=:0 control-panel & to get the control panel to work. The “DISPLAY” part\
    \ tells the control panel to use your display. This syntax works only for a Bourne-compatible\
    \ shell like bash. If you run csh, you would enter setenv DISPLAY :0; control-panel\
    \ &.\n\nDouble clicking on an icon starts up a tool. Please note that you are\
    \ not prevented from starting two instances of any tool, but doing so is a very\
    \ bad idea because you may try to edit the same files in two places and end up\
    \ overwriting your own changes. If you do accidentally start a second copy of\
