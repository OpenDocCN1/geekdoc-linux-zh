    PostScript 的情况下打印 ASCII 文本；只需确保**将 ASCII 转换为 PostScript**未被勾选。


    对于*远程*打印机，请填写以下信息：


    **远程主机** 托管该打印机的远程机器的主机名。


    **远程队列** 远程机器上打印机的队列名称。


