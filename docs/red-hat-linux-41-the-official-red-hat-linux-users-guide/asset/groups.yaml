    \ |\n| SB Pro or 16 compatible | sbpcd=io_addr,(SB,Laser mate,SPEA) |\n| ATAPI/IDE\
    \ CD-ROM Drives | hd(a,b,c,d)=cdrom |\n\nExamples of the above would be:\n\n|\
    \ Example | Configuration |\n| --- | --- |\n| mcd=0x340,11 | A non-IDE Mitsumi\
