    ## C.2. METRO X 配置文件


    CursorScreenOne 在多屏幕配置中，此设置将光标限制在屏幕 0 上。


    NoBackingStore 这会关闭 backing store（后备存储）。Backing store 是一种服务器功能，允许程序创建复杂的图形，并由服务器自动处理曝光请求，从而避免冗长的重绘周期。Backing
    store 使用系统内存来保存窗口内容，如果在内存有限的情况下，实际上可能会拖慢系统速度。


    NoCursorWrap 在多屏幕配置中，此设置防止光标从屏幕 1 环绕到屏幕 0。


    NoFontCache 这会关闭字体缓存。


    NoKeyboard 此设置禁止键盘输入。


    NoLEDs 服务器不执行任何 LED 处理。


    NoPixmapCache 这会关闭 pixmap（像素图）和 stipple（点画）缓存。


    NotPrimaryMonitor 不为虚拟终端支持执行任何控制台处理。当 X 运行在不是驱动控制台的显卡上时，通常使用此设置。


    Option <string> 这指定一个传递给服务器的特殊选项。它可能指定显卡型号或某个通常不使用的特定功能。通常 configX 会在 Xconfig
    文件中插入正确的选项。


    Option HardwarePex 将此行添加到 Xconfig 文件中以使用 Matrox MGA Impression Plus 显卡上的硬件 Z 缓冲器。此文件条目必须紧跟在
    Driver MGA 条目之后。


    Option NoHardwareCursor 添加此行以禁用硬件光标支持。此文件条目必须紧跟在 Driver 条目之后。


    RemapCursorPad 此配置使 X 服务器为小键盘方向键和光标键方向键返回不同的键码。这是对 X 协议的一个轻微违规，但它允许客户端区分这些按键。


    SndFormat <number> <number> <number> <number> Metro-X 11.5 可以读取 X11.4 SNF（Server
    Natural Format，服务器自然格式）字体。由于 SNF 字体没有标准，因此可以调整以下四个数字以读取大多数 SNF 字体。这四个数字参数代表以下值，通常在服务器编译时内置：


    ```text

    BITMAP_BIT_ORDER

    IMAGE_BYTE_ORDER

    GLYPHPADBYTES

    BITMAP_SCANLINE_UNIT

    ```


    例如，要读取 SCO SNF 字体，请将此行添加到 Xconfig 文件：


    ```text

    SnfFormat 1 0 1 1

    ```


    或者，要读取与 Interactive Systems Corporation 的 X11 R4 兼容的 SNF 字体，请将此行添加到 Xconfig 文件：


    ```text

    SnfFormat 1 1 4 4

    ```


    Terminate Terminate 导致服务器在最后一个客户端断开连接时退出。通常，xinit 会在服务器重置之前，在最后一个客户端断开连接时终止 X
    服务器。


    Trace <number> 这将打印额外的调试信息。


    VideoRam <number> 这指定显卡上的视频内存数量，以 1024 字节为单位（1 兆字节等于 1024）。X 服务器通常能检测卡片上有多少内存。


    VisualClass <number> 这使用 /usr/include/X11 中的默认 VisualClass，基于以下表格：


    | VISUAL_CLASS | NUMBER |

    | :---------------------------------- | :------ |

    | StaticGray | 0 |

    | GrayScale | 1 |

    | StaticColor | 2 |

    | PseudoColor | 3 |

    | TrueColor | 4 |

    | DirectColor | 5 |


    图 C.2：视觉类别


    在单色显示器上，应在 Xconfig 文件中添加以下行：


    ```text

    VisualClass 1

    ```


    ### C.2.4 模式


    Xconfig 文件的最后一部分是模式数据库（Modes）。它包含各种分辨率的 VESA 时序规格。默认值适用于大多数显卡，但可以进行微调，以便在监视器上居中对齐图像并调整其大小。大多数
    Metro-X 服务器使用此数据库来配置显卡的图形模式。这些数字指示使用 DisplayConfig 文件中 CLOCKS 行的哪个时钟，并且显示水平和垂直时序值。更具体地说，数字的示例如下：


    `"1024x768" 65 1024 1092 1220 1344 768 786 791 810`


    下表显示了上例中每个模式数字的定义。


    | VALUE | 含义 |

    | :--- | :--- |

    | "1024X768" | 屏幕分辨率（像素） |

    | 65 | 像素时钟 (MHz) |

    | 1024 | 显示的像素 (水平) |

    | 1092 | 同步开始 (水平) |

    | 1220 | 同步结束 (水平)

    | 1344 | 总周期 (水平) |

    | 768 | 显示的像素 (垂直) |

    | 786 | 同步开始 (垂直) |

    | 791 | 同步结束 (垂直) |

    | 810 | 总周期 (垂直) |


    图 C.3：模式定义


    这些数字代表电子束在一次屏幕垂直刷新中扫描的范围。它们决定图像在屏幕上的位置以及刷新率。


    ## 调整图像位置


    如果屏幕图像未能正确居中或充满监视器屏幕，您可以编辑模式数字。请务必在拉伸或缩小图像之前先使图像居中。您所做的任何调整将在重启 X 服务器后生效。


    **居中图像：** **显示的像素** 数字必须匹配所需的物理屏幕分辨率。**同步开始** 和 **同步结束** 数字必须同时增加或减少（以向左或向右：向上或向下移动），且幅度相同，并保持在
    **显示** 和 **总周期** 值的范围内。


    - 图像太靠右：要调整太靠右的图像，请同等增加 **水平同步开始** 和 **水平同步结束** 值。

    - 图像太靠左：要调整太靠左的图像，请同等减少 **水平同步开始** 和 **水平同步结束** 值。例如，要调整太靠左的图像，您可以通过将 8 加到两个水平时序数字（同步开始和同步结束）上来开始此过程。确保同步结束数字不超过
    **水平总周期** 数字。垂直定位也适用相同的技术：

    - 图像太低：要调整太低（太靠下）的图像，请同等减少 **垂直同步开始** 和 **垂直同步结束** 值。

    - 图像太高：要调整太高（太靠上）的图像，请同等增加 **垂直同步开始** 和 **垂直同步结束** 值。例如，要调整太高的图像，您可以通过将 8 加到两个垂直时序数字（同步开始和同步结束）上来开始此过程。确保同步结束数字不超过
    **垂直总周期** 数字。


    **拉伸或缩小图像：** **显示的像素** 数字必须匹配所需的物理屏幕分辨率。通过增加或减少 **总周期** 值来拉伸或缩小图像。此外，为了保持中心位置，必须基于变化的
    **总周期** 值的一半差异，同等增加或减少 **同步开始** 和 **同步结束** 数字。例如，如果您在 **水平总周期** 值中添加了 10，您还需要在
    **水平同步开始** 值中添加 5，并在 **水平同步结束** 值中添加 5。


    - 图像水平方向太窄：要拉伸水平方向太窄（左右出现额外空间）的图像，请将水平总周期增加数值 x，然后向水平同步开始和水平同步结束值都加上 x 的一半。

    - 图像垂直方向太窄：要拉伸垂直方向太窄（上下出现额外空间）的图像，请将垂直总周期增加数值 x，然后向垂直同步开始和垂直同步结束值都加上 x 的一半。

    - 图像水平方向太宽：要缩小水平方向太宽（图像超出左右边缘）的图像，请将水平总周期减少数值 x，然后从水平同步开始和水平同步结束值中各减去 x 的一半。

    - 图像垂直方向太高：要缩小垂直方向太高（图像超出上下边缘）的图像，请将垂直总周期减少数值 x，然后从垂直同步开始和垂直同步结束值中各减去 x 的一半。


    ## 扩展


    扩展在 /usr/lib/X11/Metro/Extensions 文件中配置。

    大多数扩展是动态加载的；也就是说，如果需要它们，它们会在没有任何额外手动配置的情况下自动加载。标记为“ON”的扩展在服务器启动时加载，并且永远不会卸载。标记为“DYN”的扩展通过
    X 客户端的 XQueryExtension 调用按需动态加载。这些扩展可以通过 XListExtensions 或 xdpyinfo 显示。标记为“OFF”的扩展无法使用，也不会通过
    XListExtensions 或 xdpyinfo 显示。


    ## 特殊说明


    - Multi-Buffering 和 DOUBLE-BUFFER 不能动态加载。

    - 它们必须设置为“ON”或“OFF”。

    - GLX (OpenGL) 可以动态加载，但 GLX 依赖于 DOUBLE-BUFFER 设置为“ON”。因此，要使用 GLX，请将 DOUBLE-BUFFER
    设置为“ON”，并将 GLX 设置为“DYN”。


