- img_proc: true
  md: '# Ecosystem Components: Service Governance (Fusing)


    # Fusing


    Fusing can be implemented in two ways:


    +   - Excluded by the naming service.

    - Blocked by a client.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_16_0.png)


    Excluded by the naming service

    Servers send heartbeats to TarsRegistry through TarsNode. If any server fails
    to send heartbeats, TarsRegistry will remove it from server IP:Port list. It will
    take about a minute to implement.


    # Blocked by a client


    In order to exclude the failed server immediately, a client blocks the server
    based on response from the server. More specifically, when a client calls a server
    and requests are continuously timed out, the client removes the server from the
    active server IP:Port list. Then, the client tries to reconnect to the failed
    server, and if the server recovers, the client will add it to the active server
    IP:Port list and send requests to it.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Ecosystem Components: Service

    Governance (SET Module)


    # SET Module


    To facilitate service management, TARS groups servers into SETs. Every SET is
    the same as the other, and easy to scale. Clients can only send requests to servers
    within the same SET. Thus, servers in different SETs can be isolated.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_17_0.png)


    In the image presented above, we assume the capacity of one SET supporting 1 million
    online users. While the number of online users reaches 3 million, TARS will scale
    to 3 SETs and not affect the original one.


    Advantage of the SET module:


    +   * Standardization

    * Prevents failure diffusion

    * Efficient operation of massive services.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# # Ecosystem Components: Service Governance (Distributed Tracing)


    ### Distributed Tracing


    TARS supports tracing of a specific request of a server. The traced request is
    labeled and forwarded to servers in the call chain. Servers report logs of traced
    requests to the log server. We can then analyze these logs and debug them.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_18_0.png)


    The image above illustrates a situation in which we want to trace requests including
    the key ("uid","123456"). In order to do that, we can label the key and all requests
    including this will automatically be labeled by the TARS framework. In addition,
    all the logs with the labeled requests will be collected to the log server for
    further analysis.'
  merge: -1
