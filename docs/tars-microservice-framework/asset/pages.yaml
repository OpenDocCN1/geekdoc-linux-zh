- img_proc: true
  md: 'Administration commands:

    Developers can send administration commands to a specified server via TarsWeb.
    TarsWeb sends the commands to the TarsNode through TarsRegistry. Then, TarsNode
    sends the commands to the server. The procedure is shown as the green line in
    the figure below.


    Heartbeat:

    When a server is running, it sends a heartbeat message to TarsNode periodically.
    Then, TarsNode forwards the message to TarsRegistry. The procedure is shown as
