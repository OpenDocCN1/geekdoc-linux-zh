    Sometimes, massive requests or machine faults occur and the system overflows.
    In order to improve system throughput, the server uses a request queue to process
    requests asynchronously. Server monitors the length of the queue and if the length
    exceeds a threshold, the server will refuse new requests. If a request stays in
    the queue for a long time, the server will drop the request, to.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_15_0.png)'
- md: '

    ## Ecosystem Components: Service Governance (Fusing)


    # Fusing


    Fusing can be implemented in two ways:


    - Excluded by the naming service.

    - Blocked by a client.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_16_0.png)


    ### Excluded by the naming service

    Servers send heartbeats to TarsRegistry through TarsNode. If any server fails
    to send heartbeats, TarsRegistry will remove it from server IP:Port list. It will
    take about a minute to implement.


    ### Blocked by a client

    In order to exclude the failed server immediately, a client blocks the server
    based on response from the server. More specifically, when a client calls a server
    and requests are continuously timed out, the client removes the server from the
    active server IP:Port list. Then, the client tries to reconnect to the failed
    server, and if the server recovers, the client will add it to the active server
    IP:Port list and send requests to it.


    ## Ecosystem Components: Service Governance (SET Module)


    # SET Module


    To facilitate service management, TARS groups servers into SETs. Every SET is
    the same as the other, and easy to scale. Clients can only send requests to servers
    within the same SET. Thus, servers in different SETs can be isolated.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_17_0.png)


    In the image presented above, we assume the capacity of one SET supporting 1 million
    online users. While the number of online users reaches 3 million, TARS will scale
    to 3 SETs and not affect the original one.


    Advantage of the SET module:


    - Standardization

    - Prevents failure diffusion

    - Efficient operation of massive services.


    ## Ecosystem Components: Service Governance (Distributed Tracing)


    ### Distributed Tracing


    TARS supports tracing of a specific request of a server. The traced request is
    labeled and forwarded to servers in the call chain. Servers report logs of traced
    requests to the log server. We can then analyze these logs and debug them.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_18_0.png)


    The image above illustrates a situation in which we want to trace requests including
    the key ("uid","123456"). In order to do that, we can label the key and all requests
    including this will automatically be labeled by the TARS framework. In addition,
    all the logs with the labeled requests will be collected to the log server for
    further analysis.


    ## Ecosystem Components: Service Governance (Area Perception)


    # Area Perception


    The automatic area perception is a key to handle large latency in cross-IDC calls.
    Please see the picture below. The IP of the client is 10.0.0.1. The client asks
    TarsRegistry for addresses of log servers. According to the client''s IP, TarsRegistry
    knows that the client is in Area-X and that IPs of log servers are 10.0.0.2:80
    and 10.0.0.3:80. It will however exclude a log server with IP 11.0.0.1:80, because
    it is located in Area-Y.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_19_0.png)


    Advantages:


    - Simple operation

    - Reduced latency

    - Reduced bandwidth costs

    - Stronger disaster tolerance


    ## Ecosystem Components: Service Governance (Log)


    # Log


    Log is a file (or several files) automatically created and maintained by a server
    consisting of a list of activities it performed. TARS provides a function to let
    the server print log to a remote log server.


    ## Integrated DevOps Tools: Code Management


    Code management usually means the management of the changes to source code. Changes
    are usually identified by a number or letter code. TARS can integrate with other
    code management tools to control the revision of the source code.


    ## Integrated DevOps Tools: Continuous Integration, Continuous Delivery, Continuous
    Deployment


    Continuous Integration (CI) and Continuous Deployment or Continuous Delivery (CD)
    are usually known as CI/CD. Continuous Integration uses automation tools that
    empower development teams to build and test code after each merge as seamlessly
    as possible. Focused on keeping the code ready to deploy at any given time, Continuous
    Delivery is a natural follow-up to CI. Continuous Deployment is an idea of constant
    and automated production deployment of every change to the code. TARS can integrate
    with other CI/CD tools to implement that.


    # Language


    TARS supports many programming languages, including C++, Java, Node.js, PHP, Go
    and Python. This allows programs written in different languages or available on
    different platforms to efficiently communicate with each other.


    ## Applications on TARS


    Most applications, regardless of the industry, can be deployed on TARS. These
    applications include AI, deep learning, edge, etc. Let’s consider a few different
    use cases.


    ### Applications on TARS: E-sport


    With the development of esports, the number of online games has increased. Under
    such circumstances game architectures had to become more expandable and scalable;
    however, not all applications were able to handle this situation without influencing
    existing users. Successful management of the growing number of servers became
    one of the most common issues for the esport industry.


    That''s where TARS SET grouping feature comes into play. As we mentioned before,
    servers in TARS are isolated, and when the server scales up, it has no effect
    on existing processes.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_22_0.png)


    For instance, we assume the capacity of one SET is supporting 1,000 online users.
    When the number of online users reaches 5,000K, we will be able to scale-up to
    five SETs, and it won''t affect the original one.


    ### Applications on TARS: Online Streaming


    In the case of online streaming, one common issue includes a sudden increase in
    the number of requests.


    For instance, during the NBA season (match days and particularly the finals) online
    TV platforms can observe traffic that would be a hundred times bigger compared
    to the non-match days.


    ### Traffic during NBA Live, 2019


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_23_0.png)


    To address this problem, many online streaming vendors choose TARS because of
    its naming service and load balance features that support automatic scheduling.
    If the number of requests is near the threshold, it will scale up; if the balance
    is lower than the value, it will scale down. This solution helps reduce waste
    of resources.


    ### Applications on TARS: FinTech


    In recent years, the financial industry, including banking, insurance, securities,
    etc., has applied the microservices architecture to many of its services, including
    mobile banking and Internet banking.


    FinTech companies recognized TARS’ benefits including but not limited to:


    - Cost reduction

    - Ability to scale systems up and down depending on the needs

    - High performance

    - Data consistency


    ### Applications on TARS: Edge Computing


    A time-critical application cannot allow the long latency raised by long-distance
    data transfer. It is also unnecessary and inefficient for Huge Data Long-distance
    Transfer between the end user and traditional Data Center, and the long latency
    should be reduced.


    TARS provides the PaaS layer and high-performance RPC calls. It efficiently deploys
    microservices in larger scale-out scenarios, and provides easy-to-understand service
    monitor features to support complex logic servers. Building applications on MEC
    (multi-access edge computing) can be a key to solve the issues related to cloud
    gaming or vehicle-to-everything technology.


    # TARS MEC Platform


    # TARS


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_24_0.png)


    ### Applications on TARS: Telecommunications


    5G network is based on the technical concepts of service-oriented architecture
    (SOA), microservices and virtualization.


    It transforms 4G network architecture which is based on point-to-point tight coupling
    into a new service-based loosely coupled architecture based on service registration,
    service discovery, and serviced interfaces. All of which are managed by TarsWeb,
    which is convenient for operators.


    The flexibility of the TARS framework facilitates the adaptation of other protocols
    that 5G may use in the future. TARS can also add a communication protocol in a
    plug-in manner in order to achieve rapid and agile development iteration in the
    5G protocol.


