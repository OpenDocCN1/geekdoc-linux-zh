- md: '

    The framework nodes are a series of servers created to maintain good microservice
    governance. Please note that the number of framework nodes is not fixed. Platform
    operators need to deploy them on multiple machines at multiple places for fault
    tolerance and disaster recovery. Moreover, the number of framework nodes depends
    on the scale of application nodes. For example, if servers print a large amount
    of data for logs, the number of log servers should be increased.


    Framework nodes can be classified into several categories:


    - **TarsWeb**

    TarsWeb is a web management system, which monitors the runtime status of servers,
    as well as starts, stops, deploys and publishes servers.

    - **TarsRegistry**

    TarsRegistry is the control/management server within the microservice cluster
    that is responsible for service registration and discovery. TarsWeb uses TarsRegistry
    to start, stop and publish servers. TarsRegistry also provides a naming service
    and accepts heartbeat messages from servers. One server can query the address
    (IP/port) of servers through TarsRegistry.

    - **TarsPatch**

    TarsPatch provides the publishing management service and uses it to publish a
    specific version of the server.

    - **TarsConfig**

    TarsConfig works as a configuration center. It manages the service configuration
    files of all servers.

    - **TarsLog**

    TarsLog provides remote log service. Server logs are sent to TarsLog, which stores
    them for use.

    - **TarsStat**

    TarsStat provides data from servers such as workload, response time, out of time
    ratio, etc. The monitoring service uses this data to discover abnormal servers
    and to provide warnings.

    - **TarsProperty**

    Beyond statistics from TarsStat, users can define business related properties
    for servers such as memory usage, queue size and cache hit-rate. The monitoring
    service uses these statistics to discover abnormal servers and to provide warnings.

    - **TarsNotify**

    TarsNotify provides statistics with abnormal information from servers (such as
    database failure), to discover abnormal servers and to provide warning.


    The successful collaboration of the TarsRegistry, application nodes and framework
    nodes allows TARS to perform its service governance tasks.


    ## Ecosystem Components: Service Governance (Service Register & Discovery)


    ## Service Register & Discovery


    The TarsRegistry provides a naming service (a naming service can convert a name
    into a physical address on a network, the most ubiquitous naming service in the
    world is the DNS). The server is registered with TarsRegistry, and the client
    gets the actual address from the server name. When the TarsNode cannot report
    heartbeat due to breakdown, the naming service will no longer return the address
    of the faulty application node to the client, and the client will automatically
    make a decision according to the abnormal situation and shield the fault. When
    the platform is in operation, servers cooperate with each other. Servers can either
    interact with framework nodes or among themselves. Let''s discuss these two cases.


    ## Interactions between servers and framework nodes


    The procedure for publishing servers:

    When uploading the new package to be patched via the TarsWeb is successful, developers
    issue a request to publish the package to the specified application nodes. Then,
    TarsRegistry notifies TarsNode to transfer the package to the node. TarsNode shuts
    down the old server and starts a new one. The procedure is shown as the dark blue
    line in the figure below.


    Administration commands:

    Developers can send administration commands to a specified server via TarsWeb.
    TarsWeb sends the commands to the TarsNode through TarsRegistry. Then, TarsNode
    sends the commands to the server. The procedure is shown as the green line in
    the figure below.


    Heartbeat:

    When a server is running, it sends a heartbeat message to TarsNode periodically.
    Then, TarsNode forwards the message to TarsRegistry. The procedure is shown as
    the black line in the figure below.


    Information report:

    When a server is running, it sends statistical information to TarsStat periodically.
    It also prints logs to TarsLog, sends property information to TarsProperty and
    sends abnormal information to TarsNotify. The procedure is shown as the light
    blue line in the figure below.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_10_0.png)


    ## Interactions among servers


    Servers register this information to TarsRegistry in advance. The client queries
    this information from TarsRegistry and visits a server.


    When a client (can be another server in TARS) tries to visit a server, it needs
    to connect to the server and call remote functions by specifying the servant,
    server IP and port.


    Servant is a service provider which provides a number of specific interfaces for
    clients to call. It is always displayed as an object name (e.g. HelloServer.HelloObj).
    It will be described in detail in the later chapter.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_11_0.png)


    ## Ecosystem Components: Service


    ## Governance (Load Balance)


    ### Load Balance


    After the client gets the server IP:Port list via the TarsRegistry, it will use
    a specified load balance policy to call the server. The supported load balance
    policies are round-robin, hash and weighted policy.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_12_0.png)


    A round robin is an arrangement of choosing all elements in a group equally in
    some rational order, usually from the top to the bottom of a list and starting
    again at the top of the list and so on. A simple way to think of round robin is
    that it is about "taking turns".


    In computer science, consistent hashing is a special kind of hashing that when
    a hash table is resized, only n/m keys need to be remapped on average where n
    is the number of keys and m is the number of slots.


    A weight function is a mathematical device used when performing a sum, integral,
    or average to give some elements more "weight" or influence on the result than
    other elements in the same set.


    ## Ecosystem Components: Service


    ## Governance (Service Configuration)


    ### Service Configuration


    TARS makes it easy to use configuration with one line of code and visualization.


    Service configurations are managed by TarsWeb. Developers can check the history
    of changes for the particular configuration and rollback to a previous version,
    if needed.


    A configuration file is classified into the following four layers:


    - **APP Configuration**

    It is located at the top level and it''s the common configuration for all servers
    under the same application.

    - **SET Configuration**

    It is the common configuration for servers under a specific SET group. It complements
    the application configuration.

    - **Service Configuration**

    It is used for a specific server and it refers to the APP configuration.

    - **Node Configuration**

    It is used for a specified backend of a server. Service configuration and node
    configuration are working together and are used by the backend.


    ## Ecosystem Components: Service Governance (Monitoring)


    ## Monitoring


    TARS supports the following data report functions in order to monitor the quality
    of the servers'' running status.


    ### Metric Monitor


    It reports server status change and exception. We can check when the server is
    published, restarted, or crashed. It is presented as TarsNotify in TARS.


    ### First Login -- Set [admin] Password


    - Password

    - Repeat password

    - Modify


    It also reports invoking statistics among servers to control metrics such as flow,
    delay, timeout and exception. It is presented as TarsStat in TARS.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_14_0.png)


    It reports customized properties to TarsProperty. The customized properties can
    include memory size, queue length, cache hit rate, etc.


