    ## 生态组件：服务治理（熔断）


    # 熔断 (Fusing)


    熔断可以通过两种方式实现：


    - 由命名服务排除。

    - 由客户端阻塞。


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_16_0.png)


    ### 由命名服务排除

    服务器通过 TarsNode 向 TarsRegistry 发送心跳。如果任何服务器未能发送心跳，TarsRegistry 将将其从服务器 IP:Port
    列表中移除。这大约需要一分钟来实现。


    ### 由客户端阻塞

    为了立即排除故障服务器，客户端会根据服务器的响应来阻塞该服务器。具体而言，当客户端调用服务器且请求持续超时时，客户端会将该服务器从活跃服务器 IP:Port
    列表中移除。然后，客户端会尝试重新连接到该故障服务器，如果服务器恢复，客户端将将其添加到活跃服务器 IP:Port 列表中并向其发送请求。


    ## 生态组件：服务治理（SET 模块）


    # SET 模块


    为了方便服务管理，TARS 将服务器分为不同的 SET。每个 SET 都是相同的，并且易于扩展。客户端只能向同一 SET 内的服务器发送请求。因此，不同 SET
    之间的服务器可以相互隔离。


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_17_0.png)


    在图中，我们假设一个 SET 的容量可以支持 100 万在线用户。当在线用户达到 300 万时，TARS 将扩展到 3 个 SET，而不会影响原来的那个。


    SET 模块的优势：


    - 标准化

    - 防止故障扩散

    - 大规模服务的高效运行。


    ## 生态组件：服务治理（分布式链路）


    ### 分布式链路 (Distributed Tracing)


    TARS 支持对特定的特定请求进行追踪。被追踪的请求会被标记并转发到调用链中的服务器。服务器将追踪请求的日志报告到日志服务器。然后我们就可以分析这些日志并进行调试。


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_18_0.png)


    上面的图片展示了我们想要追踪包含键 ("uid","123456") 的请求的情况。为了实现这一点，我们可以标记该键，所有包含该键的请求将由 TARS 框架自动标记。此外，所有带有标记请求的日志将被收集到日志服务器以便进一步分析。


    ## 生态组件：服务治理（区域感知）


    # 区域感知 (Area Perception)


    自动区域感知是处理跨 IDC 调用大延迟的关键。请看下面的图。客户端的 IP 为 10.0.0.1。客户端向 TarsRegistry 请求日志服务器的地址。根据客户端的
    IP，TarsRegistry 知道客户端位于 Area-X，且日志服务器的 IP 为 10.0.0.2:80 和 10.0.0.3:80。但它会排除 IP
    为 11.0.0.1:80 的日志服务器，因为它位于 Area-Y。


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_19_0.png)


    优势：


    - 操作简单

    - 降低延迟

    - 降低带宽成本

    - 更强的容灾能力


    ## 生态组件：服务治理（日志）


    # 日志 (Log)


    日志是由服务器自动创建并维护的文件（或多个文件），由其执行的活动列表组成。TARS 提供了一个函数让服务器将日志打印到远程日志服务器。


    ## 集成 DevOps 工具：代码管理


    代码管理通常意味着对源代码更改的管理。更改通常通过数字或字母代码来标识。TARS 可以与其他代码管理工具集成，以控制源码的版本。


    ## 集成 DevOps 工具：持续集成、持续交付、持续部署


    持续集成 (CI) 和持续部署或持续交付 (CD) 通常被称为 CI/CD。持续集成使用自动化工具，赋能开发团队在每次合并后尽可能无缝地构建和测试代码。持续交付专注于保持代码在任何时候都处于就绪部署状态，是
    CI 的自然衔接。持续部署是一种对代码的每项更改进行持续和自动化生产部署的想法。TARS 可以与其它 CI/CD 工具集成来实现这一点。


    # 语言


    TARS 支持许多编程语言，包括 C++、Java、Node.js、PHP、Go 和 Python。这使得用不同语言编写或在不同平台上提供的程序能够高效地相互通信。


    ## TARS 上的应用


    无论行业如何，大多数应用程序都可以部署在 TARS 上。这些应用包括 AI、深度学习、边缘计算等。让我们考虑几个不同的用例。


    ### TARS 上的应用：电竞


    随着电竞的发展，在线游戏数量不断增加。在这种情况下，游戏架构必须变得更具扩展性和伸缩性；然而，并非所有的应用都能不影响现有用户的情况下处理这种情况。成功管理数量日益增长的服务器已成为电竞行业最常见的问题之一。


    这就是 TARS SET 分组功能大显身手的地方。正如我们之前提到的，TARS 中的服务器是隔离的，当服务器扩展时，它对现有进程不会产生影响。


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_22_0.png)


    例如，我们假设一个 SET 的容量是支持 100 万在线用户。当在线用户达到 500 万时，TARS 将扩展到 5 个 SET，而不会影响原来的那个。


    ### TARS 上的应用：在线直播


    随着在线直播的发展，直播的案例中一个常见问题是请求数量的激增。


    例如，在 NBA 赛季期间（特别是决赛），在线电视平台观察到的流量可能是非赛日的十倍。


    ### 2019 年 NBA 直播期间流量


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_23_0.png)


    为了解决这个问题，许多直播平台选择 TARS，是因为其支持自动调度的负载均衡。如果请求接近阈值，它将扩展；如果负载低于值，它将收缩。这种解决方案有助于减少资源浪费。


    ### TARS 上的应用：金融科技


    近年来，包括银行、保险、证券在内的金融行业已将其微服务应用于许多业务，包括移动银行和网上银行。金融科技公司认可 TARS 的优点包括但不限于：


    - 降低成本

    - 根据需要伸缩系统

    - 高性能

    - 数据一致性


    ### TARS 上的应用：边缘计算


    时间敏感型应用不允许长距离传输引起的长延迟。对于终端与传统数据中心之间的海量数据长距离传输也是不必要且低效的，应该减少延迟。


    TARS 提供了 PaaS 层和高性能 RPC 调用。它在大规模扩展场景中高效部署微服务，并提供易于理解的服务监控功能支持复杂的逻辑。在 MEC（多接入边缘计算）上构建应用可以是解决云游戏或车联网技术相关问题的关键。


    # TARS MEC 平台


    # TARS


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_24_0.png)


    ### TARS 上的应用：电信


    5G 网络基于面向服务的架构 (SOA)、微服务和虚拟化技术概念。


    它将基于点对点紧耦合的 4G 网络架构转变为基于服务注册、服务发现和服务接口的新型松耦合架构。所有这些都由 TarsWeb 管理，对运营商来说非常方便。


    TARS 框架的灵活性有助于适应 5G 可能使用的其他协议。TARS 还可以以插件方式添加通信协议，以实现 5G 协议快速、敏捷的开发迭代。


    '
