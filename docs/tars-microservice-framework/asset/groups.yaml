- md: '

    # TARS MicroService Framework


    # Chapter Overview


    In this chapter, we will start off by discussing differences between monolithic
    and microservice architecture. Next we will introduce the TARS Project and we
    will dive deep into TARS'' microservice ecosystem. We will also compare TARS with
    other microservice frameworks and discuss some of the advantages of TARS. Last
    but not least, we will explain what platforms built with TARS consist of and how
    the service interaction flow looks like.


    # Learning Objectives


    - By the end of this chapter, you should be able to:

    - Have a good understanding of the differences between monolithic and microservice
    architecture.

    - Discuss what TARS is and what its goals are.

    - Describe the TARS Project microservice ecosystem.

    - Compare different microservice frameworks.

    - Explain what platforms built with TARS consist of.

    - Describe service interaction flow.


    # Monolith vs Microservice


    In the past, developers usually used a monolithic architecture, which is an easy
    and convenient way to build applications. A monolithic application is built as
    a single unit, an example of which is a server-side application. While monolithic
    architecture offers many advantages, e.g., simple development and deployment or
    debugging, it also has significant drawbacks. With the increasing number of requests
    and applications being deployed to the cloud on a daily basis, a monolith architecture
    became largely impractical. First of all, any changes made to the code were affecting
    the entire system (which was growing and becoming more complex), requiring its
    thorough review and extending the development process. Another issue involved
    scalability. Scaling was applied to the entire application rather than parts of
    it, demanding higher resource utilization.


    In 2005, Peter Rodgers introduced the term "Micro-Web-Services" during his presentation
    at the Web Services Edge conference, but it wasn''t until 2014, when Martin Fowler
    and James Lewis proposed the concept of **microservices**. They defined microservices
    as small services composed of a single application, deployed in a way that communicates
    with other services using HTTP APIs. Those services use the smallest scale of
    centralized management capabilities (such as Docker), and can be implemented with
    different programming languages and databases, as well as with other components.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_1_0.png)


    Interest in microservices has significantly grown since the mid-2000s, as illustrated
    by search trends on Google.


    According to microservices.io,


    “Microservices - also known as the microservice architecture - is an architectural
    style that structures an application as a collection of services that are:


    - Highly maintainable and testable

    - Loosely coupled

    - Independently deployable

    - Organized around business capabilities

    - Owned by a small team.


    The microservice architecture enables the rapid, frequent and reliable delivery
    of large, complex applications. It also enables an organization to evolve its
    technology stack.


    Let’s discuss what these characteristics mean and how they bring value to users.


    - Highly maintainable and testable: Fast and frequent development and deployment
    of applications.

    - Loosely coupled: Components within an application are independent and remain
    resilient to changes.

    - Independently deployable: Deployments don’t require coordination with other
    teams/team members.

    - Organized around business capabilities: Focus on customer satisfaction and experience,
    not on technical capabilities of a product.

    - Owned by a small team: Easier communication and higher productivity.


    # Monolith


    # Microservices


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_3_0.png)


    With existing architectures unable to meet the needs of larger enterprises and
    increasing data traffic, microservices began to rise in popularity. One of the
    frameworks developed to help businesses build their microservices platforms was
    TARS.


    # What Is TARS?


    TARS is a new generation distributed microservice applications framework that
    was created in 2008. It provides developers and enterprises with a complete set
    of solutions to build, release, deploy and maintain stable and reliable applications
    that run at scale.


    In June 2018, TARS joined the Linux Foundation umbrella and became one of its
    projects. On March 10th, 2020, it was announced that the TARS Project will transition
    into the TARS Foundation,


    > a neutral home for open source microservices projects that empower any industry
    to quickly turn ideas into applications at scale”.


    The TARS Foundation’s goal is to address the most common problems related to microservices
    application, including solving multi-programming language interoperability, mitigating
    transfer issues, maintaining consistency of data storage, and ensuring high performance
    while supporting a growing number of requests.


    TARS framework has been successfully used by many companies from diverse industries
    such as fintech, esports, edge computing, online streaming, e-commerce and education,
    to name a few.


    Check out this video to find out more about TARS applications.


    # TARS Project Microservice Ecosystem


    The following diagram illustrates an architectural overview of TARS:


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_4_0.png)


    Retrieved from https://www.linuxfoundation.org/blog/2020/03/the-tars-foundation-the-formation-of-a-microservices-ecosystem/
    (image updated in June 2020 to reflect changes in the TARS landscape)


    Let’s discuss each of these ecosystem components in more detail.


    # Ecosystem Components: Infrastructure


    TARS is working in PaaS. It can be run on physical machines, virtual machines
    and containers, including Docker and Kubernetes.


    # Ecosystem Components: Storage


    TARS service data can be stored in cache, DB or a file system based on your status.


    - For cache, you can use Redis or DCache (a distributed, in-memory NoSQL system
    which is based on the TARS framework, etc.

    - For DB, you can use MySQL, MariaDB, etc.

    - For file systems, you can use Ceph, HDFS, etc.


    # Ecosystem Components: Development Framework


    Protocol


    TARS framework supports Tars protocol, TUP, SSL, HTTP 1/2, protocol buffers and
    other customized protocols.


    Moreover, Tars protocol is IDL-based (interface definition language), binary,
    extensible and cross-platform. These features allow servers using different languages
    to communicate with each other using RPC (remote procedure calls).


    RPC


    RPC supports synchronous, asynchronous and one-way communication. In the synchronous
    scenario, a client issues a request and waits for response from the server or
    until timeout happens. In asynchronous communication, a client sends a request
    with a callback but doesn’t wait for the response. When a client receives a response,
    then callback is executed. In the case of one-way communication, client issues
    a request but doesn’t wait or expect a callback.


    # Ecosystem Components: Platforms Built with TARS


    A platform built with TARS can be divided into two parts: application nodes and
    framework nodes.


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_6_0.png)


    # Application Node


    # Framework Node


    A platform built with TARS can be divided into two parts: application nodes and
    framework nodes. Before we discuss them in more detail, let''s review some common
    terms:


    - **Server**

    A server is a computer program or a device that provides functionality for other
    programs or devices, called "clients".


    - **TarsNode**

    A process which manages servers by starting, stopping, publishing and monitoring
    them.


    - **Publish**

    The process in which developers upload their programs to the designated device
    and get them running.


    - **Heartbeat**

    It is a periodic signal generated by hardware or software to indicate normal operation
    or to synchronize other parts of the computer system.


    - **Client**

    A client is a piece of computer hardware or software that accesses a service made
    available by a server. It can also be another server in TARS.


    # Ecosystem Components: Platforms Built with TARS (Cont.)


    An application node is an OS instance in which the server runs. It can be a physical
    machine, a virtual machine or a container. In a platform built with TARS, the
    number of application nodes can reach thousands. On every application node, there
    is aarsNode, a process which manages servers by starting, stopping, publishing
    and monitoring them. In addition, it also accepts a heartbeat message from every
    server (when servers are running), and reports it back to the TarsRegistry as
    a data source for service discovery. Clients will call these live servers after
    TarsRegistry replies.

    '
