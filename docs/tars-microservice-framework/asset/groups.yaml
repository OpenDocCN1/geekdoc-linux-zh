  mdcn: "\n\n框架节点是为维护良好的微服务治理而创建的一系列服务器。请注意，框架节点的数量不是固定的。平台运营人员需要在多台机器的多个地点上部署它们，以实现容错和灾备恢复。此外，框架节点的数量取决于应用节点的规模。例如，如果服务器打印了大量的日志数据，应该增加日志服务器的数量。\n\
    \n框架节点可以分为几类：\n\n- **TarsWeb**\n  TarsWeb 是一个 Web 管理系统，用于监控服务器的运行状态，以及启动、停止、部署和发布服务器。\n\
    - **TarsRegistry**\n  TarsRegistry 是微服务集群内部的控制/管理服务器，负责服务的注册与发现。TarsWeb 使用 TarsRegistry\
    \ 来启动、停止和发布服务器。TarsRegistry 还提供命名服务并接收来自服务器的心跳包消息。一个服务器可以通过 TarsRegistry 查询服务器的地址（IP/端口）。\n\
    - **TarsPatch**\n  TarsPatch 提供发布管理服务，并可以使用它发布特定版本的服务器。\n- **TarsConfig**\n  TarsConfig\
    \ 作为配置中心工作。它管理所有服务器的服务配置文件。\n- **TarsLog**\n  TarsLog 提供远程日志服务。服务器日志被发送到 TarsLog\
    \ 并存储以备用。\n- **TarsStat**\n  TarsStat 提供来自服务器的数据，如负载、响应时间、超时率等。监控服务使用这些数据来发现异常服务器并提供报警。\n\
    - **TarsProperty**\n  除了 TarsStat 的统计数据外，用户还可以为服务器定义业务相关的属性，如内存使用、队列大小和缓存命中率。监控服务使用这些统计数据来发现异常服务器并提供报警。\n\
    - **TarsNotify**\n  TarsNotify 提供带有服务器异常信息的统计数据（如数据库故障），用以发现异常服务器并提供报警。\n\nTarsRegistry、应用节点和框架节点之间的成功协作使得\
    \ TARS 能够执行其服务治理任务。\n\n## 生态系统组件：服务治理（服务注册与发现）\n\n## 服务注册与发现\n\nTarsRegistry 提供了一种命名服务（命名服务可以将名称转换为网络上的物理地址，世界上无处不在的命名服务是\
    \ DNS）。服务器注册到 TarsRegistry 中，客户端从服务器名称获取实际地址。当 TarsNode 因故障无法报告心跳时，命名服务将不再向客户端返回故障应用节点的地址，客户端将根据异常情况自动做出决定并屏蔽故障。当平台运行时，服务器之间相互协作。服务器可以与框架节点交互，也可以彼此之间交互。让我们讨论这两种情况。\n\
    \n## 服务器与框架节点之间的交互\n\n发布服务器的流程：\n当通过 TarsWeb 成功上传要补丁的新包时，开发者发布一个请求将该包发布到指定的应用节点。然后，TarsRegistry\
    \ 通知 TarsNode 将包传输到该节点。TarsNode 关闭旧服务器并启动新服务器。该流程如图中深蓝实线所示。\n\n管理命令：\n开发者可以通过\
    \ TarsWeb 向指定的服务器发送管理命令。TarsWeb 通过 TarsRegistry 将命令发送给 TarsNode。然后，TarsNode 将命令发送给服务器。该流程如图中绿实线所示。\n\
    \n心跳：\n当服务器运行时，它会定期向 TarsNode 发送心跳消息。然后，TarsNode 将消息转发给 TarsRegistry。该流程如图中黑线所示。\n\
    \n信息上：\n当服务器运行时，它会定期向 TarsStat 发送统计信息。它还会向 TarsLog 打印日志，向 TarsProperty 发送属性信息并向\
    \ TarsNotify 发送异常信息。该流程如图中浅蓝线所示。\n\n![](img/b34f2ea2b492cd13eb13d7b15e1244c9_10_0.png)\n\
    \n## 服务器之间的交互\n\n服务器预先将这些信息注册到 TarsRegistry。客户端从 TarsRegistry 查询这些信息并访问服务器。\n\n\
    当客户端（可以是 TARS 中的另一个服务器）尝试访问服务器时，它需要连接到服务器并通过指定 servant、服务器 IP 和端口调用远程函数。\n\nServant（服务者）是一个服务提供者，为客户端提供多个特定的接口进行调用。它始终显示为对象名称（例如\
    \ HelloServer.HelloObj）。它将在后面的章节中详细描述。\n\n![](img/b34f2ea2b492cd13eb13d7b15e1244c9_11_0.png)\n\
    \n## 生态系统组件：服务\n\n## 治理（负载均衡）\n\n### 负载均衡\n\n客户端通过 TarsRegistry 获取服务器 IP:Port\
    \ 列表后，将使用指定的负载均衡策略来调用服务器。支持的负载均衡策略包括轮询、哈希和加权策略。\n\n![](img/b34f2ea2b492cd13eb13d7b15e1244c9_12_0.png)\n\
    \n轮询（round robin）是一种按照某种合理顺序等选择组中所有元素的安排，通常是从列表的顶部到底，然后重新从顶部开始，以此此类推。轮询的一种简单思考方式是关于“轮流”。\n\
    \n在计算机科学中，一致性哈希是一种特殊的哈希算法，当哈希表调整大小时，平均只需要重新映射 n/m 个键，其中 n 是键的数量，m 是槽的数量。\n\n权重函数（weight\
    \ function）是在执行求和、积分或平均值时使用的数学工具，赋予某些元素对结果比同一集合中其他元素更大的“权重”或影响。\n\n## 生态系统组件：服务\n\
    \n## 治理（服务配置）\n\n### 服务配置\n\nTARS 通过一行代码和可视化使得使用配置变得简单。\n\n服务配置由 TarsWeb 管理。开发者可以检查特定配置的更改历史，并在需要时回滚到之前的版本。\n\
    \n配置文件分为以下几类：\n\n- **APP 配置**：位于顶层，是整个应用的通用配置。\n- **SET 配置**：是 SET 组的通用配置。它包含了应用配置。\n\
    - **Service 配置**：用于特定的服务器。\n- **Node 配置**：用于后端。服务和节点配置协同工作。\n\n## 生态系统组件：服务治理（监控）\n\
    \n## 监控\n\nTARS 支持通过数据报告来监控服务器的运行状态。\n\n### 指标监控\n\n报告状态变化。我们可以检查服务器是否发布、重启或崩溃。它通过\
    \ TarsNotify 显示。\n\n### 首次登录 -- 设置\n\n- 密码\n- 重复\n- 修改\n\n它还报告服务器之间的统计数据，控制流量、延迟和异常。它通过\
    \ TarsStat 显示。\n\n![](img/b34f2ea2b492cd13eb13d7b15e1244c9_14_0.png)\n\n向 TarsProperty\
    \ 报告属性。自定义属性包括内存大小、队列长度、缓存命中率等。\n\n| 时间 | 主机名称 | 主机 IP | 属性 | 特征值 | 特征值 |\n|---|---|---|---|---|---|\n\
    | 1005 | tars.registry | % | tars.registry.mem size | % | 1084 | 1072 |\n| 1010\
    \ | tars.registry | % | tars.registry.mem size | % | 1080 | 1068 |\n| 1015 | tars.registry\
    \ | % | tars.registry.mem size | % | 1080 | 1064 |\n| 1020 | tars.registry | %\
    \ | tars.registry.mem size | % | 1080 | 1052 |\n| 1025 | tars.registry | % | tars.registry.mem\
    \ size | % | 1076 | 1052 |\n| 1030 | tars.registry | % | tars.registry.mem size\
    \ | % | 1076 | 1048 |\n| 1035 | tars.registry | % | tars.registry.mem size | %\
    \ | 1068 | 1044 |\n| 1040 | tars.registry | % | tars.registry.mem size | % | 1060\
    \ | 1044 |\n\n## 生态系统组件：服务\n\n## 治理（过载保护）\n\n### 过载保护\n\n有时，海量请求或机器故障会导致系统溢出。为了提高系统吞吐量，服务器使用请求队列异步处理请求。服务器监控队列长度，如果长度超过阈值，服务器将拒绝新请求。如果请求在队列中长时间过久，服务器将丢弃该请求。\n\
    \n![](img/b34f2ea2b492cd13eb13d7b15e1244c9_15_0.png)\n\n"
