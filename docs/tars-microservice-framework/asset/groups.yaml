    ## TARS 上的应用：AI


    机器学习需要大量的计算资源。如果无法及时分配或回收这些资源，将影响计算效率或导致资源浪费。因此，智能调度在 AI 领域起着至关重要的作用。


    TARS 可以动态、自动地将计算资源分配给机器学习任务。此外，样本将通过 P2P 服务器进行传输，结果则存储在 Ceph 或 HDFS 中。这样一来，开发者只需要关注样本、参数等内容。


    ## AI 计算集群


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_26_0.png)


    ## 微服务框架对比


    在考虑选择微服务框架时，通常会考虑以下特性：服务治理和编程语言支持。让我们来看几种不同的选项：


    - 无服务治理，支持 RPC 调用

    虽然此类类别中的许多框架支持多种编程语言，但它们不提供围绕服务治理问题的支持。此类框架的示例包括 gRPC 和 Thrift。


    - 可服务治理，仅支持一种编程语言

    在这种情况下，用户需要集成不同的开源项目来确保服务需求。Spring Cloud 是该类别的代表，因为它只支持 Java。


    - 可服务治理，通过 sidecar 模式（Service Mesh）支持多种编程语言

    在这里，为了解决通信问题，建议封装通信组件。该方案的缺点是增加了架构的复杂性和维护成本。示例包括 Istio 和 Envoy。


    - 可服务治理，支持多种编程语言

    此类类别不言自明。TARS 是一个微服务框架，不仅解决了服务治理问题，还提供了对多种编程语言的支持。这两个特性决定了 TARS 的优势。与容器编排且运行在
    IaaS 上的 Kubernetes 不同，TARS 运行在 PaaS 层。不过，TARS 也可以运行在 Kubernetes 上（我们将在下一章详细讨论）。


    '
