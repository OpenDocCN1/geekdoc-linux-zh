    ## Applications on TARS: AI


    Large computing resources are needed in machine learning. If they cannot be allocated
    or recycled in time, computing efficiency will be affected or resources will be
    wasted. Thus, intelligent scheduling plays a significant role in AI.


    TARS can distribute computing resources to machine learning tasks dynamically
    and automatically. Moreover, samples will be transferred by P2P server and results
    are stored in Ceph or HDFS. That way, developers need to focus only on samples,
    parameters, etc.


    ## AI Computing Cluster


    ![](img/b34f2ea2b492cd13eb13d7b15e1244c9_26_0.png)


    ## Microservice Frameworks Comparison


    When considering a microservice framework to choose, the following features are
    often taken into account: service governance and programming language support.
    Let''s consider a few different options:


    - No service governance, RPC calls

    While many frameworks under this category support multiple programming languages,
    they don''t offer support around service governance issues. Examples of such frameworks
    include gRPC and Thrift.


    - Service governance available, one programming language supported

    In this case, users are required to integrate different open source projects to
    ensure that service needs are met. Spring Cloud is a symbol of this category because
    it only supports Java.


    - Service governance available, multiple programming languages support through
    the sidecar pattern (Service Mesh)

    Here, in order to address communication problems, it is recommended to encapsulate
    a communication component. The downside to this solution is that it increases
    architecture complexity and maintenance. Examples include Istio and Envoy.


    - Service governance available, multiple programming languages support

    This category is self-explanatory. TARS is a microservices framework that not
    only solves service governance problems but also provides multiple programming
    languages support. These two features determine TARS’ strength. Different from
    Kubernetes, which is container orchestration and works in IaaS, TARS is working
    in PaaS. However, TARS can also run on Kubernetes (we will discuss it in more
    detail in the next chapter).

