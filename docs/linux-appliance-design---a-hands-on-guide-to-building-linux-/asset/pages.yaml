    +   help available on the following topics:

    - help intro - an introduction to the Laddie Alarm System

    - help commands - a list of CLI commands available

    - help howto - a list of "how to" help topics

    - help whatif - a list of "what if" help topics


    Help on an individual command is available by typing help and the command name,
    for example: "help view" or "help set zone enabled".


    The help intro gives a brief description of the Laddie alarm system, and help
    commands gives a list of all CLI commands with a brief description for each.

    We initially tried to make our help source-that is, we tried to make the help
    system use the source files for both CLI and help web. While we hope you succeed
    where we failed, we found there were too many differences in the body of the help
    text for each interface and the code libraries needed to use a shared file format
    were too big and complex. Our CLI help text is in a single file; it uses a file
    format built for the Laddie CLI. Laddie''s help file format is pretty simple,
    leaving the possibility of augmenting the help with OpenOffice.org and writing
    a simple output filter to convert it to the help format. Since help is meant to
    be read by end users, we recommend that you give responsibility for the help to
    the technical writers in your group.


    # Code Review for the test Command


    We implemented the Laddie CLI using lex, yacc, and RTA. The vocabulary of Laddie''s
    adjective-noun CLI is recognized by a parser generated by lex, and the grammar
    of the CLI is recognized in a C file generated by yacc. A tutorial on lex or yacc
    or a full code review of the CLI is beyond the scope of this book, but we can
    give an overview of our code and look at all of the incremental code used to implement
    one command. This review might make a nice introduction to yacc and lex if you''ve
    never used them, as it will give you a sense of their power and elegance.'
