  md: '# The STBmenu Framework


    Having experimented a bit with the Laddie framebuffer UI, you will have noticed
    some differences between it and a fully featured GUI. The Laddie framebuffer UI
    does not have windows that can be moved around the screen; it consists, instead,
    a series of full-screen pages. There is no free-floating cursor that can select
    any point on the screen; instead, it is the two-dimensional geometry of the input
    widgets determines how the arrow keys shift focus And finally, input options for
    widgets are minimal: There is only one, and it corresponds with pressing ENTER.


    NOTE When experimenting with DVD interfaces, we''ve been surprised by pressing
    arrow keys to the icon you want can be solving a puzzle. One attribute of the
    STBmenu framework is that of the arrow keys is guaranteed to traverse all input
    widgets. It may seem a trivial point, but when you''re trying to disable a home
    alarm that is unnecessarily waking up the neighbors, you don''t want to be tripped
    by a challenging UI.


    # The STBmenu Widgets


    The Status page, on the left of Figure 11-10, contains 25 visual widgets. Eight
    of these are static displays (the title, the column headings, and the zone numbers);
    five present variable text (the zone descriptions); five display the state of
    the alarm; and the remaining seven are buttons. (The background screen is not
    a widget.) Figure 11-11 illustrates the relationships between an STBmenu widget,
    a user, and the underlying application.


    # Two Events


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_211_0.png)


    Figure 11-11: An STBmenu widget to the full-featured widget responds to Figure
    11-9,


    we notice several simplifications. The STBmenu widget responds to only two kinds
    of events: Activate, and Update. The Activate event invokes the widget''s single
    callback, and the Update event tells the widget to redraw itself, since the data
    may have changed. With full-featured widgets, the application can call functions
    to configure the widget (e.g., its size or position) and retrieve its input data
    (e.g., its entered text or scrollbar position). However, STBmenu widgets are fully
    configured when they are constructed, and the Activate callback is invoked. With
    full-featured widgets, the application can call'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'functions to change the widget''s output data (e.g., status text or meter position),
    but STmenu widgets use static pointers into application data structures to retrieve
    the data they display. Finally, the type of data displayed by STmenu widgets is
    limited to integers and strings.


    Because there are no functions for configuring STmenu widgets or setting their
    displayed data, the developers of the underlying application don''t have to be
    familiar with the toolkit. They are all required to do expose the displayed application
    data and provide appropriate callbacks for user input.


    We summarize the STmenu API below. Class constructors are in bold, and methods
    are in italics.


    # Menu(nPages, width, height, bpp);


    ```

    AttachPage(n, page);

    SetCursor(page, row, col);

    DisplayCurrentPage();

    CursorLeft();

    CursorRight();

    CursorUp();

    CursorDown();

    Activate();

    Update();

    ```


    # Page(nRows, nCols, col, xPos, widget);


    ```

    AttachWidget(row, col, xPos, widget);

    ```


    # Font(fontPath, fontSize);


    ```

    Surface(width, height, color);

    Surface(font, color, text);

    Surface(imagePath);

    SurfaceArray(n, &surface, fSurface);

    Button(nSurface, fSurface);

    ButtonArray(n, &button, ...);

    ```


    Here are the STmenu Widgets:


    # WICon(font, color, text) and WICon(imagePath)


    Display a static image created from a constant text string or an image file.


    # WText(font, color, text);


    Displays a variable text string.


    # WIConArray(surfaceArray, trackedIndex);


    Displays one of an array of static images, depending on an application index variable.


    # WButton(button, callback, data)


    Displays a button consisting of one static image when highlighted, and another
    when not highlighted. When activated, invokes an application callback with specified
    data.'
