    <log>2005-10-28 09:29:11 Alarm set on zone 4, Motion Detector</log>

    <log>2005-10-28 09:29:04 Alarm system status: safe</log>

    </laddie_status>

    ```


    # Browser Updates of Web Page


    Back on the client side, the browser receives the XML document, and generates
    an HTML fragment from it; it uses this fragment to update'
