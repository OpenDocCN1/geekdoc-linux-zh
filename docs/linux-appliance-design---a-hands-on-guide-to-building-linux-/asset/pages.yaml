  md: '# LADDIE-GROUP-SMI DEFINITIONS ::= BEGIN


    This line gives the MIB name and tells the reader (human or program) that this
    is the beginning of our definitions for this MIB. Look for a match-END at the
    bottom of the file to tell the reader when all definitions are complete.


    +   IMPORTS

    MODULE-IDENTITY,

    enterprises

    FROM SNMPv2-SMI


    ; IMPORTS section is like the #include section in a C program—it tells where to
    find the terms used in this MIB but not defined here. We included the MODULE-IDENTITY
    macro and the enterprises for use below. Next, we defined the laddieGroup module:


    +   laddieGroup MODULE-IDENTITY

    LAST-UPDATED "200502220000Z"

    ORGANIZATION "The Laddie Group"

    -INFO

    "Here where you tell your users who you are and how to contact you."


    DESCRIPTION

    "Here where you describe the general purpose of this MIB. This is also where you
    will want to put a copyright notice."


    ```

    REVISION "200502220000Z"

    DESCRIPTION

    " 1.0 - Initial Document"

    :: { enterprises 23528 }

    ```


    We''ll give the laddieGroup to this module and define it as the value of 23528
    under enterprises, the full OID looks like this:


    ```

    .1.3.6.1.4.1.23528

    ```


    The funny-looking string in the LAST-UPDATED and REVISION lines is a time stamp
    specifying the year, month, day, hour, and minute of the last change or revision.
    Z stands for GMT (Greenwich Mean Time), sometimes called Zulu Time. The hours
    and minutes are generally zeros, because no one really cares what hour and minute
    a revision was made. The number "200702220000Z" means February 22, 2007. With
    separators, it would look like this: 2007-02-22 00:00.


    ```

    MIBs defined here:

    laddieMgmt OBJECT IDENTIFIER ::= laddieGroup 1 }

    ```'
