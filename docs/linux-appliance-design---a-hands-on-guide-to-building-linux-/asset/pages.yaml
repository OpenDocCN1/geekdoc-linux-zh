  md: '# # 8


    # # DESIGNING A WEB INTERFACE


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_128_0.png)


    The web browser has become the user interface of choice for configuring networked
    appliances, particularly home-based routers from companies like Linksys and Netgear.


    The driving force behind the popularity of web interfaces is that they are easy
    to use and don’t require specialized client software. Customers now expect to
    be able to access web interfaces for their devices, and so is it no surprise that
    leading manufacturers of home-based networked appliances provide them.


    This is the first of several chapters devoted to user interface (UI) design. This
    chapter covers web UIs in general, and the development of Laddie''s web UI in
    particular. In the chapters that follow, we will look at Laddie''s other UIs:
    the CLI interface in Chapter 9, the front panel LCD interface in Chapter 10, the
    framebuffer interface in Chapter 11, and the infrared remote control interface
    in Chapter 12. All of these UIs communicate with the back-end daemons via the
    PostgreSQL protocol.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'This chapter covers the following topics:


    +   * An overview of web technology

    * Establishing requirements for your appliance''s web interface

    * Choosing a webserver

    * Designing the look and feel of the web interface

    * Highlights of our implementation

    * Lessons learned and future improvements


    # Web Basics


    Web browsers communicate with webservers using the HyperText Transfer Protocol
    (HTTP), a client-server protocol. The communication is initiated from the web
    browser (client) when it requests a web page via a Uniform Resource Locator (URL),
    for example, http://www.google.com. When the webserver receives this request,
    it checks that the requested page is available, and if it is, it sends the page
    to the web browser.


    Because the HTTP protocol is text based, we can use telnet to


    ```

    telnet www.google.com 80

    ```


    Once the telnet session has connected, enter the following:


    ```

    GET / HTTP/1.0

    ```


    Then press ENTER twice (the empty line created by the GET) causes the webserver
    to respond to the GET request). The page returned is formatted with HTML; an example
    page appears below. (Obviously, the page would look different if you opened it
    in a browser, because the browser would interpret the HTML markup and present
    it in a human-readable way.) Note that the middle portion of the page has been
    replaced by ellipses (. .) to reduce its size.


    ```

    HTTP/1.0 200 OK

    Cache-Control: private

    Content-Type: text/html

    Set-Cookie:

    PREF=96dad6d4761f019c;TM=115611888;LM=115611888;S=p7N0cVVnPUMK6vXX;

    expires=Sun, 17-Jan-2038 19:14:07 GMT; path=/; domain=google.com

    Server: GWS/2.1

    Date: 26 Aug 2006 17:04:48 GMT

    <head><meta http-equiv="content-type" content="text/html">

    ...

    ca href="/intl/en/about.html>About Google<a></a><p><font size=-2>&copy;2006 Google</font><p></center></</body>></html>

    ```'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# DNS and TCP


    The network protocols DNS (Domain Name System) and TCP (Transmission Control Protocol)
    make this client-server exchange possible. Given the URL (e.g., http://www.google.com),
    the client uses DNS to determine the IP address of the server. HTTP uses TCP for
    error-free data transmission between client and server.


    These protocols are defined by the Internet Engineering Task Force (IETF), the
    authoritative Internet standards body. (For more information on IETF standards,
    see http://www.ietf.org; for more information on TCP/IP, see The TCP/IP Guide
    by Charles M. Kozierok, No Starch Press, 2005.)


    # The Webserver


    The webserver finds and returns the web page for the given URL. This page may
    reside in the filesystem or in memory, or it may be generated dynamically at the
    time of the request.


    # CGI


    The Common Gateway Interface (CGI) emerged as a way for a webserver to communicate
    with a purpose-built program, which would turn generate the web page on behalf
    of the webserver. In the Unix world, the early CGI programs were written in languages
    like bash, Perl, and C. Today, web-specific scripting languages like PHP are more
    common. Furthermore, modern webservers like Apache can be configured to run PHP
    scripts within the same process as the Apache webserver, thereby avoiding the
    CGI communication mechanism.


    # JavaScript


    JavaScript has become accepted as the client-side programming language for web
    pages. JavaScript code is embedded in the HTML page, and tags in the web page
    tell the web browser when to execute the JavaScript functions.


    One of JavaScript''s main advantages is that it provides a more responsive user
    experience. One of JavaScript''s disadvantages is that not all browsers support
    it, and that do not necessarily support it in a standard way.


    # Evolving Technologies


    Coupled with developments on the client side and server side, the HTML protocol
    has undergone many revisions and has expanded to include XHTML, CSS, XSL, and
    XPath.


    The bottom line is that web technology is still evolving. This evolution introduces
    challenges for developers striving for interoperability and longevity for their
    web pages. Therefore, as a web developer, it is prudent to plan ahead for changes
    in web technology.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Establishing Requirements


    Before developing a web UI for the Laddie alarm appliance, we established the
    following requirements to guide us with its design:


    +   * The web interface should be easy to use.

    * The web interface should support a wide variety of browsers, including text-based
    ones.

    * The web pages should update automatically as the state on the appliance changes.

    * The web pages should adhere to Internet standards, avoiding proprietary features.

    * The implementation should work with various webservers so that the appliance
    webserver can be replaced by a better one become available.

    * The implementation should be simple so that it can be easily maintained.


    # Choosing a Webserver


    Which webserver should you use when building your appliance? In this section we''ll
    review several webservers suitable for Linux appliances.


    # Choices


    Webservers come in several different flavors. Many support the CGI interface,
    which allows the webserver to spawn an arbitrary process to generate the web page
    content on behalf of the webserver.


    +   * The Apache webserver can be compiled with a PHP interpreter so that PHP
    scripts are interpreted within the Apache process. This approach reduces inter-process
    communication and improves response time.

    * The lighttpd webserver supports the FastCGI mechanism spawns multiple PHP interpreters
    and load balances requests for PHP web pages between them. For more information,
    see http://www.fastcgi.com.

    * The GoAhead webserver allows the webserver and all web pages to be packaged
    into a single executable, which allows the webserver to run without a filesystem.

    * The webserver in the Lynx WRT54G wireless router is written entirely in C and
    uses handcrafted functions for each web page.

    * The TUX webserver runs in the Linux kernel.


    Perhaps the first thing to consider when choosing a webserver is the license.
    If you don''t want to release your source code modifications, then you should
    avoid webservers with GPL and Apache licenses. On the other hand, if you do select
    a mature webserver like Apache, it is unlikely that you will have to modify it,
    and consequently, you won''t have to worry about having to release source code.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'We suggest that you resist developing your own webserver. It is cheaper to
    select an existing one and to develop the web pages in a server-agnostic way.
    The advantage of this approach is that you don''t have to spend your development
    resources maintaining a webserver, and you can replace the webserver should a
    better one become available.


    # Use PHP


    We suggest using PHP as the language to generate dynamic web pages. Though you
    can write smaller CGI programs in C, if you use a compiled language and need to
    modify a web page once the appliance has been deployed, you will need a compile
    environment, which would typically not be available on the deployed appliance.


    When you use an interpreted language like PHP, you can easily modify and test
    the web pages on the deployed appliance.


    PHP is a good language for generating web content because it is popular, has an
    active developer community, and is well integrated into open source webservers
    as Apache, httpd, and lighttpd. Even for webservers that don''t support PHP you
    can still write CGI programs using PHP. It is for these reasons that we selected
    PHP to develop the Laddie web.


    # Case Study: Linksys WRT54G Wireless Router


    Let''s examine the approach taken by the Linksys WRT54G wireless router. The webserver
    in this router is a handcrafted combination of both the micro_httpd and mini_httpd
    servers, enhanced with specialized C functions that generate the dynamic content
    of the web pages. The code is GPL licensed and is available from http://www.linksys.com
    under the GPL Center (Both micro_httpd and mini_httpd were written by Jeff Poskanzer
    and are available at http://www.acme.com).


    The specialized C functions are responsible for generating dynamic content for
    the web pages. Because these functions are compiled into the webserver, there
    is no need for a script interpreter like PHP.


    For example, the C function dump_route_table() is invoked from a web page by placing
    the function between a matching pair of tags, as follows:


    ```

    <% dump_route_table(""); %>

    ```


    This tag mechanism is similar to the approach taken by PHP, except that here,
    the function is implemented in C and compiled into the webserver. The advantage
    of this approach is that it has smaller memory requirements. However, as mentioned
    earlier, the problem with this approach is that the development cycle is extended
    because any change to a specialized C function requires a recompile.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Case Study: The TUX Webserver


    Unlike most webservers, which run in user space, the TUX webserver runs in the
    Linux kernel. Running in kernel space allows TUX to avoid communication between
    kernel space and user space; therefore, TUX offers better response time than other
    webservers.


    TUX supports both static and dynamic web content, but for it to support dynamic
    content, another webserver must be running in user space. TUX operates by responding
    to requests for static pages itself and forwarding requests for dynamic content
    to a user space like Apache. If you might imagine, TUX doesn''t offer speed advantages
    when it comes to support for dynamic web pages. Thus, for websites that have dynamically
    generated content, the extra TUX configuration might not be worth the trouble.


    # Comparison of Webservers


    In the previous section, we listed a range of webservers from Apache to TUX. In
    this section, we''ll narrow our focus to comparing only webservers that support
    PHP as the scripting language. For space reasons, we''ve limited the set of webservers
    to Apache, Boa, BusyBox httpd, Cherokee, GoAhead, lighttpd, and httpd. These webservers
    have been selected because they are used in commercial products or they are tailored
    for embedded applications.


    Possible criteria for comparing webservers include:


    +   - Memory footprint

    - Size of executable file

    - Performance

    - Security support

    - Ongoing maintenance and development

    - Debugging support

    - Documentation

    - Cost


    Regardless of how you weigh the different criteria, choosing a webserver will
    require a compromise. For example, the memory footprint may be critical for some
    applications, but not for others.


    Rather than advocating one webserver for your appliance, we''ve compiled Table
    8-1, which shows the various webservers in our limited set compare in each area.
    You can use this table as a starting point when selecting a webserver.


    You can use different webservers for different stages of development. For example,
    you could use one webserver that has good debugging support in the development
    phase, and then switch to one with a small memory footprint during testing and
    deployment. If you choose to use different webservers, plan ahead to ensure that
    you use features supported by all of them.'
  merge: -1
