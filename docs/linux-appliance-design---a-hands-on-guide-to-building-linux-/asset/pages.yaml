    \ or \"Infrared Detecting Unit for Remote Control.\" In the remainder of this\
    \ chapter, we will refer to them as infrared detector/demodulators to emphasize\
    \ the two functions they provide.\n\n# BUILDING A SIMPLE IR DETECTOR\n\nIf you\
