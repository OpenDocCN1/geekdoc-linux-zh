  md: '# 13


    # HANDS-ON INTRODUCTION TO SNMP


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_246_0.png)


    We like to say that the difference between a hobby and a commercial network appliance
    is SNMP. Any corporation with a large network will use Simple Network Management
    Protocol (SNMP) as part of its network- and system-management solution. You simply
    cannot sell into the large enterprise and telecommunications carrier markets without
    SNMP support on your appliance.


    If your target market includes companies with large networks and you are not confident
    in your knowledge of SNMP, this chapter is for you. If, however, you will be targeting
    the home or small business market (or your appliance will not be networked at
    all), you can safely skip this and the SNMP chapters follow.


    This chapter will introduce SNMP and provide you with an appreciation of some
    of the things SNMP can do. The topics covered in this chapter are:


    +   * A brief introduction to SNMP terminology


    +   * Finding the software'
  merge: -1
  pgno: 246
- img_proc: true
  md: '+   * Installing the software

    * Starting the agent

    * Exploring with SNMP

    * Writing values with SNMP

    * SNMP traps


    # A Quick Note on Terminology


    Here is a quick tour of the most basic concepts and terms that you will need in
    order to understand the material in this chapter. For a complete introduction
    to SNMP concepts and terminology, see Appendix B.


    SNMP is a protocol designed to facilitate the reading and writing of small amounts
    of information over a network, like single numbers and character strings. You
    would not use SNMP for large volumes of data, like file transfer.


    A read operation in SNMP is called a GET, while a write is called a SET. The target
    of a SET or GET operation is called an object. An object is like a field in a
    database record.


    SNMP treats objects as if they were organized into a single large database called
    the Management Information Base (MIB). It may be helpful to think of SNMP as an
    API to the information on a device. It hides the details of object retrieval an
    organized hierarchical namespace. SNMP agent on each system provides this API.
    The agent is a background (daemon) process listening for SNMP, requests on UDP
    port 161. Beneath the API, the agent may interact with the kernel or some application
    process running on the system; it may also read several pieces of information
    from different sources and apply a mathematical formula to furnish the value defined
    in a MIB. An object in the MIB may also represent functionality rather than data;
    for example, setting a MIB object to a particular value might trigger a reboot
    or the restart of a service.


    The MIB hierarchical namespace is much like the Unix filesystem, but it uses numbers
    instead of directory and filenames, and it uses the . character instead of / directory
    separator. So, whereas a file path may look like this:


    ```

    /usr/sbin/ifconfig

    ```


    the name (called an Object Identifier, or OID) for an object in the MIB might
    look like this:


    ```

    .1.3.6.1.2.1.1.1

    ```


    MIB files describe portions of the complete MIB database. Typically, each MIB
    file describes a MIB module, which is a subtree of the overall database. MIB files
    are both human readable and program readable. They document the MIB for humans,
    and they provide a means for programs to translate these number strings and their
    human-readable names. Although we have talked about the MIB as the SNMP-addressable
    universe, the more common use of the term MIB is for one of these named subtrees.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'For example, you will hear talk of the Host Resources MIB, or the HP Printer

    MIB, or MIB-2. These are all subtrees, but they are all addressable within

    the overall namespace.


    First and foremost among the cryptically named MIB-II. When

    SNMP working group of the IETF defined a

    core of information. This was the first MIB, MIB-I. A few years later,

    the SNMP WG revised this set and called MIB-II. We use MIB-2,

    rather than MIB-II, in this chapter to match the name used in the MIB file

    that defines MIB.


    Once you have the right MIB files installed (you will see how to do this

    later), you can use the snmptranslate command to give the human-

    readable names for any ID (or on later, too). For example:


    ```

    $snmptranslate -0f .1.3.6.1.2.1.1.1

    iso.org.internet.mgmt.mib-2.system.sysDescr $

    ```


    This should be enough terminology to get started.


    # The Software


    The Net-SNMP is an excellent free package containing all you''ll need to follow

    along in this chapter. Net-SNMP will provide you with commands (snmpget,

    smpset, snmpwalk, snmtrap), an SNMP agent, and the standard MIB files.

    Normally, the commands and agent would be running on different systems,

    but for simplicity you''ll be running on the same system. If you have

    two systems available, you can perform the full installation on both systems;

    then you can run snget, for example, on one system, and talk to the agent

    to the other. If you use two systems, remember to change all instances of

    localhost or 127.0.0.1 in this chapter''s code to the name or address of the

    system running the SNMP agent.


    # Installing SNMP


    Before installing, check to see if Net-SNMP is already installed on your

    system—many common Linux distributions provide some version of it.

    If you have a very old Linux distribution (like Red Hat 7.x) you may find

    UCD-SNMP instead; this is an older version—parent of Net-SNMP.

    Although its behavior is very similar to that of Net-SNMP, there are enough

    dferences to confuse anyone trying to follow this tutorial; you should

    remove it, and follow the instructions to install Net-SNMP. If you find

    sother package installed, definitely remove it before continuing.


    > ¹ The Internet Engineering Task Force (IETF), started in 1986, is the principal

    organization for the Internet. Participation is voluntary and open to anyone.
    Most of its work is

    formed in working groups (WGs), which are ad hoc groups composed of parties interested
    in

    specific topic.


    Hands-on Introduction to SNMP 225'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'If Net-SNMP is not currently installed on your system, it may be packaged with
    your Linux distribution, so check your CDs. Be aware, though, that various Linux
    distributions may have modified Net-SNMP to comply with their own ideas of default
    file locations and it may include different patches. Naturally, consider your
    version of Net-SNMP to be the one used in this chapter (version 5.2.1), the closer
    will be the ones shown here.


    # Download and Install


    If Net-SNMP is not included with your Linux distribution, you can download it
    from http://net-snmp.sourceforge.net. You can install either from RPM (assuming
    you are running an RPM-based distribution like Fedora) or source, but for now
    let us install the binary RPM. By the way, if rpm complains about missing dependencies,
    you may have to take care of them first and then retry the command.


    ```

    $ -Uvh net-snmp-5.2.1.fc4.1686.rpm

    Preparing... ########################### [100%]

    1:net-snmp ################# [100%]

    ```


    # Check the Installation


    Now test that it worked. First, test the agent.


    ```

    $ /usr/bin/snmpd --version

    ```


    NET-SNMP version: 5.2.1

    Web: http://www.net-snmp.org/

    net-snmp-coders@lists.sourceforge.net


    $


    Now check the tools. Use which to find out where they were installed, then list
    all the commands in that directory with snmp.


    ```

    $ which snmpwalk

    /usr/bin/snmpwalk


    $ ls /usr/bin/snmp*

    /usr/bin/snmpd /usr/bin/snmpstatus

    /usr/bin/snmpus /usr/bin/snmpwalk /usr/bin/snmpget

    /usr/bin/snmptable /usr/bin/snmpvacm /usr/bin/snmpcheck

    /usr/bin/snmpgetnext /usr/bin/snmptest /usr/bin/snmpwalk

    /usr/bin/snmpconf /usr/bin/snmpnetstat /usr/bin/snptranslate

    /usr/bin/snmpdelta /usr/bin/snmpset /usr/bin/snptrap

    ```


    We''ll only use a handful of these commands, but feel free to explore others you''ve
    mastered the basics.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Now let''s check the version to make sure it is what we installed and not some
    older version that''s lurking on your path.


    ```

    $ snmpwalk --version

    NET-SNMP version: 5.2.1

    ```


    # Configure the Agent


    So far, good—you have the client-side programs. Now you need to get the agent
    running so these programs have something to query.


    The agent runs as a daemon and listens for incoming SNMP requests on UDP port
    161, by default. It requires some configuration information that normally picks
    up from the file snmpd.conf in the directory /etc/snmp. (The d in snmpd.conf,
    it indicates daemon—our agent.) Do not confuse this with snmpd.conf, which we
    will introduce later on.) Snmpd.conf tells the agent how to authenticate incoming
    requests, to send traps (which are SNMP notifications), and so forth.


    Net-SNMP provides a program called snmpconf that generates the snmpd.conf file
    from the answers to a series of questions, but because your needs are pretty simple,
    you can generate the configuration by hand. Your snmpd.conf file should contain:


    +   - community public

    - syslocation "my den"

    - syscontact me@addr.com


    > The ro-community macro sets your read-only community string, for which you can
    now think of something like a password. Net-SNMP gives you much more precise control
    over this, but that''s beyond our needs right now.

    The syslocation and syscontact lines set the values for the syslocation and syscontact
    objects in the MIB-2 system group. When you are managing only a small set of systems
    all in one location, this information may not be very interesting, but in a large
    corporate network with multiple sites, it is invaluable to find out who is in
    charge of it. (A little later in this chapter, you will see how to access this
    information across the network with SNMP queries.)


    Place this snmpd.conf file into the /etc/snmp directory. The three lines above
    are all you''ll need to get started.


    # Start the Agent


    Start the agent, and put it into the background. The agent listens on port 161,
    so you''ll need to be logged in as root to use this command:


    ```

    /usr/sbin/snmpd -c /etc/snmp/snmpd.conf -C &

    ```


    * In the parlance of the CLI chapter, snmpconf would be called a wizard.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The -c /etc/snmpd.conf tells the agent to use the given configuration file,
    and -C tells the agent to use only this configuration file.


    For now, you can just type the above command (as root), but on your appliance
    you''ll want the SNMP agent to start up with the system.


    # Exploring with SNMP


    Now let''s turn our attention to the client side. The commands snmpget, and snmpset
    are all SNMP commands, or SNMP management applications, in SNMP-speak. SNMP uses
    the term manager or management application for the client agent and for the server
    agent. The agent serves up the data on the appliance, and the SNMP manager is
    the client requesting the appliance''s information. You won''t need to be logged
    in as root to use these client commands.


    Let''s use snmpget to test your agent.


    ```

    $ snmpget -v2c -c localhost syslocation.0

    SNMPv2-MIB:syslocation.o = STRING: "my den" 1

    ```


    You''ve used snmpget to use SNMPv2c (community-based) SNMP version 2) and the
    community string public to send a query to the local machine asking for the value
    of the syslocation, which you configured in your snmp.conf file. The .o appended
    to the syslocation name is SNMP''s way of indicating that you the instance of
    this variable. In object-oriented language, thinking of syslocation as a class
    that has one instance. If this was an (array) of tables, the .o would be replaced
    by the row number of the variable (1, 2, 3, and so on). Row numbers always start
    with 1, so there is no confusion between a row index and a scalar indicator.


    You need to tell the snmpget command to use SNMPv2c, because it defaults to SNMPv3;
    by generating an snmp.conf file with a different default. You could use snmpconf
    to generate the file, then you can just create the snmp.conf file by hand with
    this single command (run as root).


    ```

    echo "defversion 2c" > /etc/snmp/snmp.conf

    ```


    Now you can start typing the -v2c with each command.


    > 3 If you get the message Timeout: No Response from localhost, you may have something
    blocking UDP requests to port 161. Check your firewall settings and your /etc/hosts.deny
    file. Comment it out and try the snmp get again.


    > 4 SNMP is called "community-based" because it retains the use of SNMPv1 community
    strings (think of these as passwords) for authentication. There is not much management
    about the new security framework that was intended for SNMPv3, so SNMPv2c was
    released without it. When it was, the new security framework was released in SNMPv3.


    > 5 Notice that the MIB object is syslocation, but the command in the snmpd.conf
    file is syslocation. There is no significance to this; it was just the implement''s
    design choice to use all lowercase letters for the keys in the configuration file.'
  merge: -1
  pgno: 251
- img_proc: true
  md: "If you have access to any other networked devices, you might try\nquerying\
    \ them. For example, here's snmpwalk command run against an\nApple AirPort Base\
    \ Station:\n\n```\n$ snmpwalk -c public 10.0.0.1\nsnmpV2-MIB::sysDesc.0 = STRING:\
    \ Apple Base Station V3.84 Compatible\nsnmpV2-MIB::ObjectID.0 = OID: SNMPv2-dotZero\n\
    DISMAN-EVENT-MIB::sysTimeInstance = timeticks:(4971188) 24:31:88\nsnmpV2-MIB::sysContact.0\
    \ = STRING: me@myaddr.com\nsnmpV2-MIB::sysName.0 = STRING: MyAirport\nsnmpV2-MIB::sysServices.0\
    \ = INTEGER: 79\nsnmpV2-MIB::sysServices.0 = No more variables left in the MIB\
    \ View (It is\npast the end of the MIB tree)\n```\n\nClearly, the device's sysDesc.0\
    \ (system description) identifies this as\nan Apple Base Station. You'll also\
    \ recognize the syslocation and sysContact\ninformation for this device. This\
    \ device doesn't offer up a lot of informa-\tion, but there is enough to identify\
    \ what it is, where it is, and how to\ncontact about any issues you have with\
    \ this box, you should discover that\nit's misbehaving. The availability of the\
    \ system contact and\nlocation rely on the administrator of that system, who is\
    \ configuring\nvalues on the target device. An unattentive system administrator\
    \ may\nleave you to work with.\n\nNotice that for this query we used snmpwalk\
    \ instead of snmpget because we\nwanted to see what other information might be\
    \ furnished by this device. The\nsmpget command retrieves a single object instance\
    \ using an SNMP GET\ndata unit, while snmpwalk uses multiple SNMP GETNEXT to \"\
    walk\" an entire\nMIB. You pick a starting point, and snmpwalk asks for the lexically\
    \ next\ninstance; the agent returns that object and its OID, and snmpwalk asks\
    \ for the\next object instance after the new OID. Eventually, the agent responds\
    \ that\nthere is nothing left to return, and the walk terminates.\n\n# MIB for\
    \ Readable Names\n\nThe display of nice, readable names for OIDs—like sysDesc\
    \ and sysLocation-\ndeps on having the right MIB files registered on your client\
    \ system. In\nthe case of Net-SNMP, registration simply means these files in the\n\
    right directory and then the SNMP commands (like snmpget and snmpwalk)\nto use\
    \ them. You can set a few environment variables to do this job for you.\nJust\
    \ put these lines in your shell startup file (e.g., .bashrc):\n\n```\nexport MIB-ALL\n\
    export MIBDIRS=/usr/share/snmp/mibs\n```\n\nWhen you installed Net-SNMP, it placed\
    \ a set of standard MIB files in\n/usr/share/snmp/mibs, as you can see in the\
    \ list below. These are all plain-\ntext files written using a human-readable\
    \ and machine-parsable syntax.\n\nHands-on Introduction to SNMP 229"
