    # # Dialog Boxes


    Our advice on dialog boxes is simple: Avoid them. Dialog boxes halt because the
    user cannot continue until or she clicks a button to close the box. Alan Cooper
    agrees against dialog boxes because they break the flow of the user experience
    and do not move users to their goal (About Face 2.0: The Essentials of User Interaction
    Design by Alan Cooper and Robert Reimann, Wiley, 2003).


    An alternative to dialog boxes is to place informational messages on the web page
    itself. We''ll demonstrate this in the next section.


    # # Error Messages


    Good error messages can greatly improve the usability of your web UI. Experts
    agree on the following guidelines:


    +   * If possible, make the program smarter to either avoid the particular error
    condition or recover from it.

    * If an unrecoverable error has been detected, provide an explicit error message—that
    is, don''t suppress the error.


    Designing a Web Interface 115'
  merge: -1
  pgno: 138
- img_proc: true
  md: '+   * The error message should be human readable.

    * The error message should be detailed.

    * The error message should advise how to fix the problem.

    * The error message should be close to the field with the error.

    * The fields with errors should be clearly identified.


    Some error conditions are caused by the user (when the user enters a bad value
    in a web form), while others are caused by external events (when the appliance
    disk becomes full). When designing your appliance''s web pages, think about how
    these different errors will be handled.


    One way to present error messages is to use dialog boxes (see Figure 8-4), but
    as we mentioned before, we discourage this approach. A second approach is to insert
    the error message into the refreshed web page (see Figure 8-5). The salient feature
    with this approach is that the error message is displayed in the form field, so
    that users can immediately re-enter their data.


