    \ see the header\nfile /usr/src/linux/include/linux/fb.h and the documentation\
    \ files in thendirectory /usr/src/linux/Documentation/fb.\n\n# Graphics Libraries\n\
    \nUsing the Linux framebuffer interface, we have reduced the problem of\nmanipulating\
    \ pixels on the display to build the problem of writing bytes to memory.\nBut\
    \ think of some of the ways in which we would like to manipulate display\npixels:\
