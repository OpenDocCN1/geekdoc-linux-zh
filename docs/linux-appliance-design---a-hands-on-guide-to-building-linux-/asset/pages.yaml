- img_proc: true
  md: '# SELECT


    The SELECT statement reads values out of a table. The syntax for the RTA

    SELECT statement is:


    ```

    SELECT column_list FROM table [where_clause] [limit_clause]

    ```


    The column_list is a comma-separated list of column names or a single

    asterisk (*) to retrieve all columns. The variable table is the name of the table

    wish to examine. The where_clause specifies rows to return, and the

    limit_clause tells how many rows to return. Here are some simple examples.


    ```

    SELECT * FROM ztable

    select * FROM ztable

    select zcount, zname FROM ztable

    ```


    You can specify the columns in any order, and you can ask for the

    column more than once.


    +   NOTE The SQL parser recognizes the SQL reserved words in both upper- and lowercase
    letters. We use uppercase in our examples to make the reserved words more visible.


    Also, SQL does not require semicolon at the end of the line, but the

    pgsql command line tools.


    # UPDATE


    The UPDATE statement writes values into a table. The syntax for the RTA

    UPDATE statement is:


    ```

    UPDATE SET update_list [where_clause] [limit_clause]

    ```


    The update_list is a comma-separated list of value assignments in the

    format:


    ```

    column_name = value[, column_name = value...]

    ```


    In the example above, value is a literal value. Let''s look at some more

    examples.


    ```

    UPDATE ztable zalarm = 44

    UPDATE ztable zalarm = 0, zname = Terminator

    UPDATE ztable zalarm = 1, zname = "Mr. Terminator"

    ```


    Strings with spaces must be enclosed in single or double quotes.

    One kind of quote can be enclosed in the other kind of quote.


    ```

    UPDATE ztable SET zname = "Baker''s Pride"

    UPDATE ztable SET zname = ''Just say "no"

    ```'
