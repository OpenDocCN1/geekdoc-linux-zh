  md: 'The use of logmuxd might be easier to understand if we start with a list of
    its configuration tables¹ grouped according to the three processing blocks shown
    in Figure 7-2. Table 7-1 doesn''t describe all of the tables in detail, so you
    might want to use the RTA table editor to examine them more closely.


    # Table 7-1: Configuration Tables Grouped According Processing Block


    | Section | Table | Contents |

    |---|---|---|n| Source | Muxln, Rawlog, Accpt | Descriptions of all input sources,
    last 10 raw log messages, and accepted input connections |

    | Routing Destinations | Filters FileDest, NetDest, AccptDest, SmpDest, PgdDest,
    MailDest, TblDest | Patterns to match, rewriting rules, and Destinations existing
    in a filesystem, on the network, output TCP connections, SNMP trap destinations,
    RTA and PostgreSQL DB destinations, email destinations, and a local table with
    the last 20 Latte log messages |


    logmuxd has several limitations. It does not have any flood filtering (for example,
    syslog''s ''Last message repeated 10 billion times''). It uses regex, which gives
    it a lot of power and flexibility, but at the expense of CPU cycles. Finally,
    it is a relatively new logging daemon and is still in flux to a certain degree,
    as new features are added and as bugs are found and fixed.


    You can overcome most of the limitations of logmuxd by pairing it with syslog.
    Configure syslog to output all messages to a FIFO, and configure logmuxd to read
    from the FIFO and to filter and rewrite those few messages you want to capture
    for further processing.


    # Configuring logmuxd


    RTA tables store the configuration and statistics for logmuxd. The following discussion
    describes the tables, and the examples in the next section give the SQL for them.


    # logmuxd Sources


    You tell logmuxd about your event by describing them in the four editable fields
    in logmuxd''s Muxln table. These fields are source, type, and term.


    The source field contains the filename if the source is a file, pipe, or Unix
    socket, or the IP address if the source is a UDP or TCP socket.


    The port field contains the port number for UDP and TCP sockets and is ignored
    for sources from an entry from a filesystem.


    The type field specifies one of the six possible types for the source. Table 7-2
    describes the six source types.


    > ¹Other programming books might give configuration as a file format or set of
    subroutine calls. Instead, we present logmuxd configuration in terms of its RTA
    table interface. You should now show all of status and configuration information
    in terms of how it would appear in an RTA table.'
