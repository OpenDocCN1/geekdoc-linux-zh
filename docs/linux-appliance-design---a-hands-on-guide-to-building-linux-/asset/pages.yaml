    \ by clearing the alarm state.\"\n::= { ladAlarmEntry4 }\n```\n\n```\nladAlarmState\
    \ OBJECT-TYPE\nSYNTAX      TruthValue\nMAX-ACCESS read-write\nSTATUS      current\n\
    DESCRIPTION\n    \"Alarm state. (The possibly latched) state of the\nalarm for\
    \ this input. The user sets this field\nto false to clear a latched alarm.\"\n\
    ::= { ladAlarmEntry5 }\n```\n\n```\nladAlarmCount OBJECT-TYPE\nSYNTAX      Counter32\n\
    MAX-ACCESS read-only\nSTATUS      current\nDESCRIPTION\n    \"A count of the number\
    \ of times the\nalarm has triggered.\"\n::= { ladAlarmEntry6 }\n```"
