  md: 'offers reduced complexity in both the UI and the daemon, gives access to the
    daemon while it is running, lets you work on and test the UIs and daemon independently,
    and improves security. The important requirements for the protocol are that the
    protocol''s data model matches your of the data, you don''t have to define or
    write the protocol yourself, and the protocol will be available for most UI programming
    languages.


    The data model we use in this is that of a database. Because we view our arrays
    of structures as data, the UI programs (or clients) see the data in the daemon
    as a database. While the UI programs think they are dealing with a PostgreSQL
    database, they are in fact, talking to the daemon. This arrangement results in
    an appliance architecture similar to that shown in Figure 3-1, where a framebuffer
    UI uses the PostgreSQL C language binding in libpq, so the web UI uses the PostgreSQL
    PHP binding in psql; so the test and debug UI uses the command line program psql.


    | Framebuffer | Your C/C++ Code | libpq |

    | --- | --- | --- |

    | Web Interface | Apache | PHP | php-pgsql |

    | | | RTA | Your C/C++ Code |

    | Test and Debug Interface | psql |


    Figure 3-1: A sample appliance using RTA


    After connecting to the daemon over a Unix or TCP socket, the UIs shown in Figure
    3-1 can display the configuration, status, and statistics available in the daemon.
    The librta.so library presents the daemon''s data as it were coming from a PostgreSQL
    database. This figure shows the PostgreSQL client-side binding that we use in
    this book, but many more language bindings are available including Java, Python,
    Tcl, Perl, and Microsoft C++.


    Figure 3-1 offers a global view of the appliance. Now let''s look at how RTA works
    inside the daemon.


    # RTA Daemon Architecture


    Adding RTA to your daemon is fairly straightforward, since it involves using only
    two routines from the library. The first routine, rta_add_table(), makes one of
    your daemon''s tables visible to the clients. The second routine, dbcommand(),
    handles the protocol and SQL commands from the clients. Figure 3-2 illustrates
    a daemon offering RTA access to two UI-visible tables.'
