- img_proc: true
  md: "+   * API subroutines\n* SELECT and UPDATE syntax\n* Internal RTA tables\n\
    * Debug configuration\n* Error messages\n* Callback routines\n\nLinux appliances\
    \ lack real-time access to status and statistics, as well as the ability to configure\
    \ a service once it has started. As Linux users, we assume that to configure an\
    \ application we will be able to use SSH or telnet to gain access to the service,\
    \ use an editor to modify the /etc configuration file, and use the kill -1 command\
    \ to terminate the process—so real time status and statistics are features Linux\
    \ programmers don't even think to request. The lack of run-time access poses a\
    \ particular challenge for network appliances where SSH is unavailable, either\
    \ because it is not installed or it is not allowed.\n\nAnother challenge for appliance\
    \ designers is that more than one type of user interface may be required. Many\
    \ appliances have some combination of web, command-line, SNMP agent, front panel,\
    \ and framebuffer interfaces. It is a nontrivial task to give the end user a consistent\
    \ view regarding the UI.\n\n# # Overview of RTA\n\nThe RTA package addresses the\
    \ challenges described above by giving real time access to the data structures\
    \ and arrays inside a running program. With minimal effort, we can use RTA to\
    \ make a program’s data structures appear as PostgreSQL tables in a PostgreSQL\
    \ database.\n\nUsing RTA, a structure definition is also the definition for a\
    \ table row, and an array of structures will appear as a table. For example, the\
    \ code below shows a definition of a data structure for TCP connection information.\n\
    \n```\nstruct tcpconn {\n    int fd;               // conn's file descriptor\n\
    \    int lport;           // local port number\n    int dport;           // destination\
    \ port number\n    long nsbytes;        // number of sent bytes\n    long nrbbytes;\
    \      // number of received bytes\n    long nread;          // number of reads\
    \ on the socket\n    long nwrite;         // number of writes on the socket\n\
    };\n```\n\nThe tcpconn structure describes a single connection. An array of these\
    \ structures is needed if there’s more than one connection. This array might be\
    \ allocated with\n\n```\nstruct tcpconn Conns[10];\n```"
