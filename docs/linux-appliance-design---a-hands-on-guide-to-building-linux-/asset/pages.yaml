  md: 'You can copy the source from the CD and build logmuxd on your development system,
    or you can boot the Laddie CD and use its running version of logmuxd. Don''t worry
    about changing the logmuxd tables on Laddie, a reboot will restore them to their
    original state. We are going to use psql for the table updates, but you can also
    use the table editor, if you wish. Figure 7-3 illustrates the data flow in this
    example.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_122_0.png)


    Figure 7-3: A logmuxd example using telnet


    The basic steps in the configuration are:


    +   1. Configure logmuxd to accept syslog messages from /dev/log. Verify the setup.

    2. Configure logmuxd to recognize and rewrite "train arriving" messages.

    3. Configure logmuxd to accept TCP connections on port 3333.

    4. Use logger and telnet to verify that messages are distributed to connections
    via TCP port 3333.


    Start by clearing the configuration in all of the tables that we are going to
    use. Using the console or telnet, log in on the PC that is running logmuxd (the
    PC booted from the book''s CD). The RTA interface on logmuxd listens on port 8887;
    you can start the SQL session and clear the tables with these commands:


    ```

    psql -h localhost -p 8887

    UPDATE MuxIn source = "", type =0;

    UPDATE Filters destiny = 0, destname = "", regex = ""

    rewrite = "", time_fmt = "";nUPDATE NetDest destination = "", dest = "", port
    = 0;

    ```


    # MuxIn


    We want logmuxd to replace syslog in this example, so we need to configure it
    to listen at the Unix socket /dev/log and read log messages in the syslog style.
    We specify the source as /dev/log, the type as 6 (syslog format), and the log
    message terminator as 0 (null character between messages).


    ```

    UPDATE MuxIn source = "/dev/log", type = 6, term = 0 LIMIT 1;

    ```


    If everything is working at this point, the command opened a Unix socket on /dev/log,
    and a display of the MuxIn table should show a valid file descriptor for our source.
    (A netstat command should also show the /dev/log socket).'
