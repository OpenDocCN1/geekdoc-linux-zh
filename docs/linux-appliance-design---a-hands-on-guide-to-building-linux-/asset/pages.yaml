  md: '# The dbcommand() Subroutine


    The main application in your appliance accepts TCP connections from PostgreSQL
    clients and passes the stream of bytes (encoded SQL requests) from the client
    to RTA via the dbcommand() subroutine. In turn, dbcommand writes the stream of
    bytes to an input buffer for an SQL command.


    If the input buffer contains a complete command, the number-of-characters-in (nin)
    variable will be decreased by the number of bytes consumed, and RTA_SUCCESS will
    be returned. If there is not a complete command in the input buffer, RTA_NCMD
    will be returned and no bytes will be removed from the input buffer.


    If a command is executed, the results will be encoded into the PostgreSQL protocol
    and placed in the output buffer (out). When the subroutine is called, the input
    variable, number-of-characters-out (out), has the number of bytes available in
    the output buffer. When the subroutine returns, the nout variable will be decremented
    by the size of the response in the output buffer. An error message is generated
    if the number of available bytes in the output buffer is too small to hold the
    response from the SQL command.


    The list summarizes the input buffers and bytes for the dbcommand()


    | Buffer/Bytes | Description |

    |---|---|

    | cmd | The buffer with PostgreSQL packets |

    | nin | On entry, the number of bytes in the cmd buffer; exit, the number of bytes
    remaining in the cmd buffer |

    | out | The buffer that holds responses back to the client |

    | nout | On entry, the number of free bytes in the out buffer; on exit, the number
    of remaining free bytes in the out buffer |


    The list summarizes the returns for the dbcommand()


    | Returns | Description |

    |---|---|

    | RTA_SUCCESS | One command was executed |

    | RTA_NCMD | The input was not a complete command |

    | RTA_CLOSE | The client requested an orderly close |

    | RTA_NOBUF | There was insufficient space in the output buffer |


    The prototype for the dbcommand() subroutine is shown below.


    ```

    int dbcommand(char *cmd, int *nin, char *out, int *nout);

    ```


