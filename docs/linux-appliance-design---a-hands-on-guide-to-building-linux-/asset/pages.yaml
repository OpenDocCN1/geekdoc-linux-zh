  md: 'Another approach is to use Ajax so that the web page updates only when there
    is a state change on the server. The disadvantage of Ajax is that it requires
    JavaScript to be enabled in the web browser; if the user disables JavaScript,
    the update mechanism breaks. On the other hand, when Ajax is used, the web page
    updates quickly in response to state changes on the server.


    In the section “Improving Responsiveness with Ajax” on page 117, we described
    how a typical Ajax exchange is initiated by the client, rather than the server.
    However, note that this exchange is initiated. We need a way to modify Ajax so
    that the browser responds to state changes on the server.


    It turns out that we can modify the Ajax exchange so that the system behaves as
    if the webserver the exchange. First, replace the mouseover event with the onload
    event, so that the XMLHttpRequest is sent as soon as the web page is loaded. Second,
    the webserver script so that it blocks while waiting for an event. By implementing
    this modified Ajax exchange, the web page will update whenever the particular
    event occurs on the server. The experienced Ajax programmer will note that there
    is another mechanism that achieves a similar result, notably the HTTP Streaming
    pattern documented at http://ajaxpatterns.org (and in the associated book, Ajax
    Design Patterns, by Michael Maloff, O’Reilly, 2009). Both our approach and the
    HTTP Streaming pattern have the disadvantage of using a long-lived TCP connection,
    which may be a problem for webservers allow only a few number of concurrent connections.
    However, for our approach we can control how long the request waits for a server
    event, limiting the number of concurrent connections.


    Before we describe the details of this modified Ajax exchange, let’s review the
    big picture. Figure 8-12 shows the sequence for a user requesting a new web page,
    with the first page update and subsequent partial page updates. In terms of timing,
    events ① through ⑦ occur in quick succession after the user requests the particular
    web page. At this point, the web page is loaded with the latest alarm state. When
    some alarm state changes at event ⑧ through ⑨, at point the web page is refreshed
    with the new alarm state. This latter sequence repeats until the user navigates
    away from the web page.


    # Browser Sends First HTTP Request


    The sequence from events ① through ⑦ is the standard HTML request response exchange.
    In step ③, the user requests a web page, the server responds by sending the web
    page, and in step ➁, the server displays the page. These steps are performed for
    all web requests regardless of whether the web page includes JavaScript. The remaining
    sequence through event ⑨ is more interesting, and it is in this sequence that
    we’ll describe in more detail.'
