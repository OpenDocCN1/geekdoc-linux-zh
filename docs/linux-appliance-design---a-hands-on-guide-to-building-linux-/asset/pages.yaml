- img_proc: true
  md: "# The appInit() Callback Subroutine\n\nThe appInit() subroutine is the first\
    \ callback subroutine the empty daemon invokes. This callback subroutine is responsible\
    \ for performing any application-specific initialization, setting up any timer\
    \ callback subroutines, and registering any RTA tables. In ladd, the appInit()\
    \ initializes the Zone array of ZONE structures, calls rta_add_table() to register\
    \ the Zone table with RTA, initializes the parallel port, and starts a periodic\
