  md: "The code is broken into four files: main.c, syntax.y, token.l, andncommands.c.\
    \ The file main.c has the main() routine, which is select(); since the CLI needs\
    \ to listen for both user input and log messages. The file syntax.y is a yacc\
    \ input file that has the syntax of the CLI commands. The file token.l is a lex\
    \ file with the definitions of the key words used in the CLI vocabulary. The file\
    \ commands.c has the C code that actually implements the commands. Yacc and lex\
    \ produce C code that are compiled into the source directory using the following\
    \ commands\ntranslate, compile, and link the four files.\n\n```\ngcc -fPIC -I.\
    \ -pedantic -std=gnu9 -g -ggdb -Wall main.c -o main.o\nyacc -d syntax.y\nlex -it\
    \ -I. > token.c\ngcc -fPIC -I. -pedantic -std=gnu9 -g -ggdb -Wall token.c -o token.o\n\
    gcc -fPIC -I. -pedantic -std=gnu9 -g -ggdb -Wall -o syntax.tab.o syntax.tab.c\n\
    gcc -fPIC -I. -pedantic -std=gnu9 -g -ggdb -Wall commands.c -o commands.o\ngcc\
    \ main.o syntax.tab.o commands.o -o cli -lpq\n```\n\n# CLI Vocabulary: token.l\n\
    \nThe file token.l has a series of regular expressions which define the words\
    \ in the vocabulary of our CLI. The lex translates the regular expressions in\
    \ token.l into a C program, which implements a finite machine that recognizes\
    \ our words in vocabulary.\n\nThe form of the Ladd test is [zone id], where the\
    \ ID is a number between one and five. Our input file, token.l, contains the following\
    \ code to define both a zone and the CLI vert test.\n\n```\n[1-5] [\\t]* { Zone\
    \ = (int) (*ytext - '0');\n      return(ZONE_ID); }\ntest[\\t]+ { return(TEST);\
    \ };\n```\n\nThe [1-5] indicates a number in the range of one to five, inclusive.\
    \ The [\\t] indicates either a space or a tab. The * following [\\t] indicates\
    \ that there can be zero or more spaces or tabs following the zone. The yacc variable\
    \ points into the command line at the start of the token, so (int) (*ytext - '0')\
    \ is the zone ID as integer. The code sets the global variable before returning\
    \ ZONE_ID to indicate that a valid zone was found.\n\nThe lex test [\\t]+ indicates\
    \ a valid word followed by one or more spaces or tabs. At least one space or tab\
    \ is required to separate the test token from the zone ID.\n\n# CLI Grammar: syntax.y\n\
    \nJust as a grammar describes sentences in a language, a grammar defined in the\
    \ yacc file defines valid commands in our CLI. yacc converts the grammar in syntax.y\
    \ into a C-based state machine to recognize valid command lines."
