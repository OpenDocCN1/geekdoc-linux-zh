  md: '![](img/ab18faa434b6e1e10df0a92984bf70fc_44_0.png)


    Figure 3-2: A dbcommand using RTA


    The dbcommand() routine does not communicate directly with the client. Your program
    must create a listening TCP or Unix socket and must be able to accept and manage
    connections from the UI or other clients. Once a connection is established, all
    data from the connection should be passed to RTA with a call to dbcommand(). The
    dbcommand() routine parses the SQL command in the request from the client; if
    the request is valid, it executes the SQL command and returns a buffer with any
    data to be sent back to the client.


    RTA would be of limited usefulness if it could read and write values in your tables.
    Its real power lies in its ability to call a routine when a UI reads or writes
    a value into one of your tables. These read and write callbacks are similar to
    traditional database triggers. Callbacks are tied to the column definition and
    are specified separately for reads and writes. (We describe callbacks in the more
    detail in the next section.)


    # # Telling RTA About Your Columns and Tables


    A table is an array or linked list of data structures. Each member of your data
    structure is considered to be a column in a table, and each instance of the data
    structure is considered to be a row. From this point on, when you see the column,
    think member of my data structure. In order to make a table visible to clients,
    you need to describe the table in a way that RTA can understand. This means describing
    the table as a whole and then describing each column in the table.


    A TBLDEF structure describes the table as a whole; it contains a pointer to an
    array of column definitions with a COLDEF structure to define each column in your
    data table. At first you may find the process of creating COLDEFs and TBLDEFs
    painstaking, but once you have a little experience, you''ll find it simple and
    mechanical.'
