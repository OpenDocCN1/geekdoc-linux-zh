- img_proc: true
  md: "The OBJECTS clause in the ladAlarm trap definition tells what other information\
    \ will accompany the trap. This is often called the varbind list, for variable\
    \ bindings. These variables, which explain why the trap was sent, are bound to\
    \ the trap when it is sent.\n\n+   - LAD Trap Info: varbinds sent with traps\n\
    \n```\nladTrapZoneId OBJECT-TYPE\nSYNTAX Integer32\nMAX-ACCESS accessible-for-notify\n\
    STATUS current\nDESCRIPTION\n    \"This is the ID (row number in the ladAlarmTable)\
    \ of the\n    zone generating the alarm.\"\n    := {ladTrapInfo 1}\n```\n\n```\n\
    ladTrapZoneName OBJECT-TYPE\nSYNTAX DisplayString\nMAX-ACCESS accessible-for-notify\n\
    STATUS current\nDESCRIPTION\n    \"This is the name of the zone generating the\
    \ alarm.\"\n    := {ladTrapInfo 2}\n```\n\nThese are the definitions of the objects\
    \ in our varbind list. The MAX-ACCESS of these is accessible-for-notify, meaning\
    \ they cannot be polled; they merely define the objects for the benefit of the\
    \ trap receiver. These objects only mean when attached to a trap.\n\nEarly SNMP\
    \ documents (RFCs) were created with concern for keeping SNMP traffic to a minimum\
    \ to prevent burdening networks with extra traffic. Traps were intended to draw\
    \ attention to a possible problem; we specify about what was wrong. Today, however,\
    \ some network administrators use trap logs as a history of what's happening on\
    \ the device. They want all pertinent information sent with the trap and the trap-receiving\
    \ software.\n\nYou'll also need to take care that your device doesn't become too\
    \ choppy with its traps. Lapse is unlikely to have this problem, but if you are\
    \ building an appliance to sit on a major corporate, ISP, or carrier network,\
    \ you better consider this. If you check for errors every minute and generate\
    \ a trap each some measure is over an acceptable threshold, an appliance that\
    \ notices an error on Friday will be able to send about 3,500 traps by Monday\
    \ morning, all reporting the same problem. Any other problem from a different\
    \ device will be lost in the buffer. You may want to report the problem once when\
    \ it is first noticed, then send another trap to indicate when the problem is\
    \ corrected.\n\nThe argument in favor of sending lots of traps is that SNMP is\
    \ unreliable by design. We use UDP packets to report problems with the assumption\
    \ that any problem of importance will be noticed more than once, so the loss of\
    \ a"
  merge: -1
  pgno: 281
- img_proc: true
  md: 'single trap will not be a problem. If you can''t be sure your trap was received,
    you had better keep sending it until someone notices, right? Well, that''s one
    approach. Another is just to use informs instead of traps. Informs available with
    SNMPv2 and are essentially traps with built-in reliability. Informs expects a
    confirmation message from the receiver and will retry number of times if they
    don''t see the confirm. If this isn''t good enough for you you might want to consider
    some reduced frequency schedule for resending your trap if your device has not
    received some attention.


    Last but not least, there''s the END marker that signals the end of the MIB.


    # Validating Your MIB


    Now that the MIB has been written, we need to test it for validity. The MIB must
    be not only human-readable, but machine-parse-able. The syntax of a MIB must be
    as correct as the syntax of a computer program, or the applications using the
    MIB will be unable to interpret it. For lucky, for free MIB validators are available
    online. All you need is a browser and your MIB files. There''s always the risk
    that any online resources discussed here may be unavailable by the time you read
    this book, but the one we will be using here is on the SimpleWeb website, shown
    in Figure 14-4. You can find it at http://www.snmp.utwente.nl/ietf/mibs/latest.
    It has been around since 1997 and is used by the Universiteit Twente in the Netherlands.


    # SimpleWeb MIB module validation


    | Validate a MIB by uploading your file(s) |

    | Enter the file name of your MIB module: |

    | /tmp/LADDIE-MIB.txt | Browse... |

    | Enter the file name of any imported MIB modules which are not already in the
    standard path (*): |

    | /tmp/LADDIE-GROUP-SMI.txt | Browse... |

    | | Browse... |

    | | Browse... |

    | | Browse... |

    | Severity level: [3] | Submit | Reset |

    | # Import entries: [5] | |

    | Don''t use built-in search path for Imports: [] |


    Figure 14-4: The SimpleWeb MIB validator


    Another free validator we have used is the one provided by Muonics at http://www.muonics.com/Tools/smicheck.php.


    Make sure you do not skip the validation step! If you don''t get the syntax of
    your MIB exactly right, nothing will work for you from here on.'
