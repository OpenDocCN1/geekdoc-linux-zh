  md: 'All we need to do now is build and install it.


    ```

    make

    make install

    ```


    You''ll also need to copy the files you need from /opt/snmp into your appliance
    build, but that''s beyond the scope of this chapter.


    # # Debugging


    Thanks to the DEBUGMSGL macros, we have dropped in a MIB extension as we wrote
    it, and we are all set to trace the flow of control in our agent, should this
    become necessary. Just shut down the agent running in the background


    ```

    /etc/rc.init/snmpd stop


    /opt/snmp/sbin/snmpd -D "LAD" -le -c /opt/snmp/etc/snmp/snmpd.conf -C

    ```


    and run your own copy from the command line:


    The -c path to config file -C is from the normal command string to run the agent.
    We discussed this in Chapter 14. What''s new the first three options.

    The -D "LAD" activates the DEBUGMSGL statements, which specified "LAD". Here''s
    one from the code we discussed above:


    ```

    DEBUGMSGL("LAD", "reading AlarmState\));

    ```


    The -le tells the agent to send the output to siderr. Other options are stdout,
    syslog, or a file. See the man page for snmp for more information.

    The -f tells the agent to fork and go into the background. This keeps tied to
    our current terminal window so we can see the output.

    Now query the agent using snget, snmpset, or snmpwalk from another terminal window
    and watch the output, or capture it to a file.


    # # Traps


    We have defined two traps in a MIB, but we will not be discussing how to send
    these traps in this chapter. In Chapter 14 we discussed the use of the snmprap
    utility to send traps for us, and in Chapter 7 we explained how to use a log event
    to trigger an SNMP trap. Just keep that the traps we have defined in our LAD-MIB
    are not generated by the SNMP agent. They are generated through the logging subsystem
    from events recorded by the ladd daemon, itself.'
