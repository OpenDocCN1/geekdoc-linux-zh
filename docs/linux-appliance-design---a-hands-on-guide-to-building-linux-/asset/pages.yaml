    # # INSTALLING A FRAMEBUFFER

    DEVICE DRIVER


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_348_1.png)


    The Laddie CD was designed to work with as many video cards as possible. To accomplish
    this, it defaults to a framebuffer device driver for a widely adopted video standard
    and configures it for a low-resolution display with only eight bits per pixel.
    If this driver fails, the system attempts to find a hardware-specific driver for
    your video card and loads that driver with its default configuration. This approach
    will provide a minimal, working framebuffer for most systems. However, if you
    would like to take better advantage of your particular hardware, you will need
    to take some additional steps.


    In this appendix, we will cover the following topics:


    +   - Finding framebuffer device drivers for your video card

    - Configuring the framebuffer device driver'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# # Finding Framebuffer Device Drivers for Your Video Card


    To find available device drivers for your video card, boot your PC with the Laddie
    CD.

    If the Laddie CD succeeds in finding a driver for your video card, it will launch
    the Laddie framebuffer UI, shown in Figure C-1. Otherwise, it will display the
    message *The framebuffer (/dev/fb0) is unavailable before the login prompt.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_349_0.png)


    Figure C-1: The Laddie framebuffer UI


    For now, we''ll assume that a framebuffer driver loaded successfully. To determine
    which driver was loaded, first exit the framebuffer UI by pressing ESC. Type the
    following at the command prompt:


    ```

    laddie:~$ dmesg | grep fb

    ```


    The dmesg command displays the buffer of messages produced by the kernel since
    startup, and the grep command selects those that might have something to do with
    framebuffers.


    # ## The vesafb Driver


    The Laddie CD first attempts to load the vesafb video driver, since this is the
    most likely candidate for an unknown graphics card. The vesafb driver supports
    an interface developed by the Video Electronics Standards Association (VESA) known
    as VESA BIOS Extensions (VBE). The driver relies on the BIOS and must therefore
    be configured at system startup. This means that the vesafb driver must be compiled
    into the kernel, rather than as a separate module. The Laddie appliance configures
    the driver using a boot prompt, which we will describe later.


    Here is example output from one of our systems with a vesafb driver installed
    successfully:


    ```

    vesafb: framebuffer=0x08000000, mapped to 0xf8888000, using 600k, total 32768k

    vesafb: mode=640x480, linelength=640, pages=11

    vesafb: protected mode interface at c000:0f03

    vesafb: scrolling:redraw

    ```'
  merge: -1
  pgno: 349
- img_proc: true
  md: '```

    vesafb: Pseudocolor:size=8:8:8:8, shift=0:0:0:0

    vesafb: Mode is VGA compatible

    fbo0: VESA frame buffer device

    ```


    # # Hardware-Specific Drivers


    If your system successfully loaded the vesafb driver, you will need to disable

    driver at boot time to check for other drivers. To do this, reboot

    t Laddie CD. When you see the boot prompt, type novesa and press ENTER.

    If the framebuffer UI launches, that means the system found another

    driver. Exit the framebuffer UI, and type the command dmesg | grep. When

    did this for one of our systems, the command produced the following:


    ```

    vesafb: probe vesafb failed with error -6

    rivaf: Nvidia device/chipset 10DE00D3

    rivaf: Nvidia Corporation NV64 [NVIDIA TNT2 Model 64/Model 64 Pro]

    rivaf: RIVA MTER set to ON

    rivaf: could not retrieve ID from DIC2C

    rivaf: setting virtual resolution to 52428

    rivaf: PCI Nvidia framebuffer over 0.95b (32MB @ 0xF8000000)

    [additional lines omitted]

    ```


    Here we see the vesafb driver failed to load, and a device-specific

    driver succeeded. The rivafb is a video driver for NVIDIA graphics cards.

    You can also check which hardware-specific framebuffer driver

    system loaded with the lsmod command. Execute the following at:


    ```

    lsmod | grep fb

    ```


    The lsmod command lists all the modules currently loaded by the kernel;

    buffer names typically include the letters fb, for example nvidia, radeon, savagefb,
    or matrox_g450. By the way, the lsmod command not

    work for the vesafb driver, since the vesafb driver isn''t a module—it''s compiled

    into the kernel.


    # # Not Included in the Laddie CD


    If the Laddie CD did not find a driver for your graphics card, it is possible

    at newer kernel will support it. In this case, use the lspci command to

    inify your graphics card. If your card is AGP, PCI, or PCI-Express, this

    will report it. The following is one of several lines produced when

    running the lspci command on one of our development machines.


    ```

    01:00.0 VGA compatible controller: nvidia Corporation NV15 [GeForce 2 GTS/Pro]
    (rev a4)

    ```


    This shows us that we have an NVIDIA VGA-compatible controller

    (VGA stands for Video Graphics Array). At this point, you may need to

    some on the Internet finding a driver for your graphics card. Also keep

    in mind that Linux doesn''t support all graphics cards, so you may have to

    install a different card in order to use the Linux framebuffer.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Configuring the Framebuffer Device Driver


    Once you''ve found the right video driver for your hardware, you''ll need to configure
    it for your desired video mode.


    # The vesafb Driver


    Since the vesafb driver relies on real-mode BIOS functions for initialization,
    it must be built into the kernel and configured at boot time. This configuration
    is specified at the kernel command line and may be provided at the boot prompt
    or in the bootloader''s configuration file. For the vesafb driver, the kernel
    command line should include the following:


    ```

    video=vesafb vga=<linux video mode>

    ```


    The Linux video mode is a number that specifies a particular resolution and number
    of bits per pixel. This number is formed by adding 0x200 to the video mode numbers
    specified by the VESA BIOS Extensions. Linux video modes are summarized in Table
    C-1.


    Table C-1: Linux Video Mode Numbers

    | Bits per pixel | 320x200 | 640x400 | 640x480 | 800x600 | 1024x768 | 1280x1024
    |

    |---|---|---|---|---|---||}{

    | 4 | | | | 0x302 | 0x304 | 0x306 |

    | 8 | | | 0x300 | 0x301 | 0x303 | 0x305 | 0x307 |

    | 15 (5:5:5) | 0x30d | | 0x310 | 0x313 | 0x316 | 0x319 |

    | 16 (5:6:6) | 0x30e | | 0x311 | 0x314 | 0x317 | 0x31a |

    | 24 (8:8:8) | 0x30f | | 0x312 | 0x315 | 0x318 | 0x31b |


    # Choose an Appropriate Video Mode


    A typical VBE-compliant graphics card will not support all of these modes, you
    may need to experiment to find one that works. The easiest way is to specify


    ```

    video=vesafb vga=ask

    ```


    at Linux boot prompt. (If you are experimenting with the Laddie CD, the complete
    boot prompt line would be linux vga=ask.) The kernel initialization will display
    a list of modes and ask for a number. You can ignore the ones it presents, since
    these are for text-only consoles.


    Also, don''t choose to the scan option. At best, this will provide a longer list
    of modes; worst, it will hang the system and you will have to reboot. In fact,
    whenever you enter an unsupported mode, the kernel responds immediately with Unknown
    mode ID. Try again, so it doesn''t take long to find one that works. When entering
    a mode, just provide the digits without the hex 0x.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Update the Kernel Command Line


    Once you have found a VBE video mode that works, you can update the kernel command
    line in your bootloader configuration file. In this case, you do need to use the
    leading 0x. For example, the command


    ```

    video=vesafb vga=0x311 3

    ```


    would be appropriate for a VBE-compatible video card that supports a resolution
    of 640 by 480 with 16 bits per pixel. The final 3 specifies runlevel 3 to prevent
    the X display manager from loading a specific video driver.


    > NOTE The vesafb driver accepts optional parameters for features like efficient
    scrolling. /usr/src/linux/Documentation/fb/vesafb.txt for details.


    # Hardware-Specific Drivers


    If you booted the Laddie CD with the novesa option and if the system was able
    to find a hardware-specific video driver, it will come up with default settings
    for the video mode.


    In this section we will describe how you can experiment with those settings using
    the Laddie CD, and then how you can select your preferred settings at boot time
    for your system. These comments also apply to video drivers that the Laddie CD
    doesn''t support, though you will have to use your own system to experiment with
    them.


    # Experiment with Different Video Modes


    Unlike the vesafb driver, non-VBE drivers can change modes after startup. To change
    video mode, use the fbset utility. This utility accesses the file /etc/fbset to
    associate mode names with geometry and timing parameters. For example, the command


    ```

    fbset 640x480-60

    ```


    will find the geometry and timing parameters associated with the string 640x480-60
    and use these to switch the framebuffer to a resolution of 640 by 480 at 60 Hz.
    If this command is successful, you will probably see the console screen change
    (e.g., to a larger font) as it switches to a different graphics mode.


    If the fbset is not available on your distribution, you can download it from /packages.debian.org/stable/fbset.
    If you install yourself, be sure to install an appropriate fb.modes file in /etc.
    You can use one of the fb.modes provided with the fbset package (which is what
    we did), but so with caution, because incorrect timing values can damage some
    monitors.


    # Select the Desired Video Mode at Startup


    The Laddie CD maintains hardware-specific video drivers as modules, but once you''ve
    found the appropriate framebuffer driver for your system,'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'you might want to build it into the kernel. This is not an option with the
    Laddie CD, of course, but if you rebuild the kernel for your own system, you will
    need to configure the driver at the kernel boot prompt. Many non-VBE framebuffer
    device drivers now support a common syntax for providing the video mode on the
    kernel command line. Following this syntax, the examplefb driver would be selected
    at boot time with the following command:


    ```

    video=examplefb:1024x768-24876

    ```


    This specifies a width of 1,024 pixels, a height of 768 pixels, 24 bits per pixel,
    and a refresh rate of 76 Hz. The kernel includes


    No timing information has been provided except for the refresh rate. The kernel
    includes a database of timing parameters (see the file /usr/src/linux/drivers/video/modes.c
    for details) and will search for an entry that matches the provided resolution
    and refresh rate. If it fails to find a match, it will use a default video mode,
    and if that fails, it will attempt all modes in the database.


    In general, the following format is used to specify the video mode:


    ```

    <xres>x<yres>[m][r][<bpp>]@[<refresh>][i][m]

    ```


    Here, an optional m requests the use of VESA Coordinated Video Timings, a systematic
    method for determining timings based on resolution, refresh rate, the type of
    monitor (CRT or digital display), and interlacing. The optional r reduces blanking
    for digital displays. The optional i specifies an interlaced mode, and the optional
    m requests an additional 1.8 percent margin in the timing calculations.


    Besides the common syntax outlined here, specific drivers may support other options,
    such as disabling acceleration. There is little commonality among drivers; you
    may need to consult your driver''s source code to find these options.


    # Verify the Settings for Your Framebuffer Driver


    If you have successfully loaded a framebuffer driver and want to learn more about
    its configuration, you can use the `fbset -i` command to report your framebuffer''s
    geometry, timings, and various other parameters.


    To see configuration data on a loaded framebuffer driver, try using cat to examine
    the contents of `/proc/fb` and the files in `/sys/class/graphics/fb0`. Not all
    drivers use the /sys directory, but when they do, files provide a convenient way
    to access framebuffer parameters such as bits_per_pixel and color_map.


    For more information on the Linux framebuffer, see the (somewhat dated) HOWTO
    at http://tdp.org/FRAMEBUFFER-HOWTO.html. The VBE 3.0 specification is available
    at http://www.vesa.org/public/VBE/vbe3.pdf.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# A DB-TO-FILE UTILITY


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_354_0.png)


    This appendix describes tbl2filed, a daemon that allows you to use SQL to read
    and write values in Linux configuration files as if those values were in a database
    instead of a file. This utility is convenient if you want to use RTA for new daemons
    and want to keep the same database metaphor for reading and writing values into
    traditional, non-RTA configuration files. Topics discussed in this appendix include:


    +   - Overview

    - Table definitions

    - Usage and API

    - Security notes'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Overview


    The goal of the tbl2filed daemon is to allow your UI programs to use a PostgreSQL
    library to read or write (SELECT or UPDATE) an RTA table and to have an underlying
    system configuration file scanned or modified as part of the SELECT or UPDATE.
    This utility tries to mimic the common tasks of:


    +   - Viewing values in a configuration file (SELECT value . . .)

    - Editing the values in a configuration file (UPDATE value . . .)

    - Atomically writing a file to disk (UPDATE tbl2filed SET_do_commit . . .)

    - Restarting a service if necessary (UPDATE tbl2filed SET_do_script . . .)


    The tbl2filed daemon allows you to read and write configuration files by using
    PostgreSQL-commands on two RTA tables. The first table, tbl2file, describes the
    files managed by the daemon, and the second table, tbl2field, describes the managed
    fields.


    Figure D-1 illustrates how this utility maps two tables into text fields inside
    disk files.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_355_0.png)


    Figure D-1: Use SQL to access data in files.


    This daemon also lets us put all of the restart scripts for system services in
    a single file and use a single method (a write callback) to invoke them. This
    approach might help security because it allows a non-privileged UI program to
    safely change the system configuration files.


    # Table Definitions


    An example is given later in this appendix, but for example to make sense, you
    need some understanding of the contents of the tbl2filed tables. Laddie uses tbl2filed
    to help with the networking configuration, and you may find the tables easier
    to understand by looking at them in a running Laddie system. Boot the Laddie CD
    and follow the tbl2filed link at http://192.168.1.11/table_editor/rta_apps.html.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# tbl2file Table


    The table of managed file information, tbl2file, has the following columns:


    | name | // name of the file |

    | path | // full path to the file |

    | do_commit | // flush values to the file on 0->1 |

    | timestamp | // time last read/parsed file |

    | do_script | // run script on 0->1 transition |

    | script_parms | // the parameters passed to the script |


    The name of the file is the name as seen by the UI. It is also used as part of
    the index into tbl2field struct. This can just be shorthand or a mnemonic for
    the file, example, *resolv*.


    The path is the full path to the file, including the filename. For example, the
    name field might be *resolv*, while the path might be `/etc/resolv.conf`**.


    Writing 1 to the do_commit flag flags the managed file''s values to be written
    back to the disk file. The file is written to a temporary file first and then
    rename() is called to move the temporary file to the destination file. This mechanism
    helps maintain consistency in the system by trying to make the file as atomic
    as possible. A SELECT on do_commit always returns a zero.


    Reading and parsing the values from a file is expensive in terms of time and CPU
    cycles. Since the files won''t change, we can improve the system''s responsiveness
    by caching the file''s values in the tbl2field table and only rereading the file
    if it has been modified since the last time we read. The timestamp marks the last
    time we read and parsed the file; time is measured as the number of seconds since
    the last write. When a UI asks for a value, a daemon compares the mtime (time
    of modification) of the file''s node to our time stamp, and either re the file
    if necessary or returns the values directly from the fields table, if the cached
    values are still valid.


    Setting do_script to starts the script /usr/local/tbl2filed/tbl2script.sh. The
    script_parms field has a set of space-separated parameters that are passed to
    the script. The parameters are not passed on the command line; rather, they are
    passed in standard input and parsed into parameters using a cut command. This
    script is spawned and forgotten—that is, we ignore any return value from it. The
    script is only run by an explicit write of 1 to the do_script column, and the
    column is only used for its write callback. A SELECT on this column will always
    return a zero. Laddie uses this script, for example, to restart networking when
    the user changes the appliance''s IP address.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# tbl2field Table


    The tbl2field table that holds the values for the individual fields and has the
    following columns:


    | name | // name of the file, e.g., "resol" |

    | field | // field name, e.g., "search_domain" |

    | pattern | // regex to extract value from line |

    | regerr | // nonzero if any errors in the pattern string |

    | skip | // skip this patterns to target |

    | format | // printf format to replace line |

    | value | // current value of field |


    The name is the name of the file and must match the name column in the tbl2file
    table.


    The field is the name of the field as seen by all of the UI programs. This is
    always used in a WHERE clause to identify the field to read and update.


    The pattern is a regular expression that, in combination with the skip field,
    identifies the field in the file. The pattern should include exactly one set of
    parentheses to extract the value from the line of text. For example, to get the
    first DNS name server from the resolv.conf file, we might use the following regular
    expression:


    ```

    ^nameserver\s+([0-9]+\)

    ```


    The regerr field is nonzero if the pattern cannot be parsed as a regular expression.
    It should be necessary to examine regerr only during development.


    The skip column tells how many of the above patterns to skip before selecting
    a line as the source of the value. For example, we use a skip value of 1 to read
    the second DNS nameserver from resolv.conf. We would skip one nameserver and read
    the second one.


    The format field is used to produce the line of configuration data in the target
    file. We could get this from the regular expression, but having a printf format
    string is also easier. If this field is blank, the field is considered read-only
    format. Any of the read-only values in /proc or /sys should have a blank format
    field. You can see a good example of a read-only value by looking at the uptime
    field in tbl2file table. For a nameserver in resolv.conf, the format string would
    be %nameserver %s. There is no need for a \n in the format string, it is added
    automatically by the print statement.


    The value is the current value of the field as a string. Doing a SELECT on this
    column will cause the file to be read and parsed if necessary (see timestamp in
    tbl2file table above). If cached value is valid, the value is taken directly from
    the table. A write on this column saves the value in the table but does not actually
    write the value to the file; writing a 1 to do_commit that.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# A tbl2filed Example


    Let''s look at a complete example by continuing with the nameserver config-uration
    for Laddie. The /etc/resolv.conf file on a running Laddie system looks like this:


    ```

    nameserver 204.117.214.10

    nameserver 199.2.252.10

    nameserver 65.173.40.10

    ```


    Our goal is to be able to read the first DNS nameserver with a SELECT statement
    as follows:


    ```

    psql -h localhost -p 8885

    > SELECT * FROM tbl2field where name = "nameserver_1";n> q

    ```


    Similarly, to modify the second nameserver, Laddie uses the UPDATE statement:


    ```

    psql -h localhost -p 8885

    > UPDATE tbl2field SET value="192.168.1.1"

    > WHERE name=resolv AND field="nameserver_2";n> q

    ```


    You can verify the above by booting the Laddie CD, exiting from the framebuffer
    menu, logging in as root, and executing the commands above. Be sure to verify
    that the file has been modified after the UPDATE command.

    Now we look at the tbl2file and tbl2field configuration that gives us the ability
    to read and write the nameserver IP addresses as if we were in a PostgreSQL database.
    We''ll start by listing the file we want to manage in tbl2file:


    ```

    UPDATE tbl2file SET name="resolv", path=/etc/resolv.conf

    script_params="* LIMIT 1 OFFSET 0

    ```


    We don''t need to run a script after editing the resolv.conf file, so we can leave
    script blank. You can use either full or relative path names, but as a security
    precaution, it is a good idea to use the full path.

    In this example we want to manage the three nameservers.

    The SQL for this is taken from tbl2filed.sql (perhaps the full path, i.e., /opt/laddie/tbl2filed/...)
    and is as follows:


    ```

    UPDATE tbl2field SET name="resolv", field="nameserver_1", skip=0,

    pattern="^nameserver[0-9]+" LIMIT 1 OFFSET 1

    UPDATE tbl2field SET name="resolv", field="nameserver_2", skip=1,

    pattern="^nameserver[ \t][0-9]+" LIMIT 1 OFFSET 2

    UPDATE tbl2field SET name="resolv", field="nameserver_3", skip=2,

    pattern="^nameserver[\t][0-9]+" LIMIT 1 OFFSET 3

    ```'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'The pattern recognizes the line with the parameter, and the single set of parentheses
    in the pattern extracts the actual field value. In the above examples, the value
    of a nameserver field must have only the digits through nine and/or decimal points.
    The parentheses are not part of the recognition—they are only used to extract
    the field value.


    One nice feature of the tbl2field daemon is that when you write a value to a field,
    the daemon uses the string to build a copy of what your configuration line will
    look like. It then runs the pattern against the new line and rejects the update
    if the pattern doesn''t recognize the new line. In this case, an update for a
    nameserver of 11.22.33.44 would succeed, since it contains the required digits
    and decimal points; however a nameserver update of 8ob''s fun house would fail,
    since it does not contain the required digits and decimals.


    The nameserver example also illustrates the use of the skip column. The primary
    nameserver has set to 0, meaning that we use the first line with a matching pattern.
    The secondary nameserver is specified with skip set to 1, meaning we skip one
    matching line and use the second matching line.¹


    # Security Notes


    Depending on how you use it, this daemon can either enhance or hurt your system.
    At first glance, having a daemon that runs with root privileges and accepts database
    connections seems like a bad idea. On the other hand, this might allow you to
    improve security by running only one daemon as root and each of UI programs as
    a non-root user. This way, if an attacker breaks into one of your UI programs,
    he or she only gains the privileges of non-root user. Compare this to most Linux
    applications, in which a UI needs to run as root to make system changes.


    The daemon reads tbl2file.sql and tbl2field.sql when it starts, and marks all
    of its configuration columns as read-only. Not allowing updates to the files or
    script patterns protects security, but it also means that you cannot update any
    part of the configuration after the program starts. You must edit the tbl2file.sql
    and tbl2field.sql files directly before starting the tbl2filed daemon. If you
    must mark any column as read-write to make development easier, be to change it
    back to read-only before you ship your product. Also, be to protect the write
    privileges in the directory and files with the daemon''s initial configuration.


    > The resolv.conf file is different from most Linux configuration files in that
    switching to from DHCP as the boot configuration protocol can completely destroy
    all values you''ve previously written into it. The simple solution to this problem
    is to keep a template file and copy it to /etc/resolv.conf when necessary.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# THE LADDIE APPLIANCE

    BOOTABLE CD


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_360_0.png)


    The CD accompanying this book serves two purposes. First, it allows you to demonstrate
    the techniques described in this book by turning your x86 PC into a working appliance.

    Second, it allows you to study, in as much detail as you care to, the source code
    that implements this appliance.

    In this appendix, we show you how to boot and run the Laddie appliance CD, and
    we provide a simple example of how the CD supports modifying, rebuilding, and
    reinstalling the appliance.


    # Running the Laddie Appliance


    The Laddie CD doesn''t require that your machine be running a specific operating
    system, you don''t need to install anything, and the CD won''t place anything
    on your hard drive. In fact, you don''t even need a hard drive. The CD creates
    a ramdisk for the root filesystem with links back to the CD, and in'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'this context runs the Laddie appliance. When you''re finished using the CD,
    simply remove it and reboot your original operating system. You''ll find nothing
    has changed.


    What do you need in order to run the Laddie appliance is an x86-based PC with
    at least 64 megabytes of system memory, a VESA-compliant video card (if you want
    to run the framebuffer interface), and a BIOS that is configured to boot from
    a CD-ROM.


    In this section we''ll explain how to boot the CD, show how to verify that the
    framebuffer and web interfaces are working, and then explain how to access the
    other user interfaces. We''ll also explain how to shut down the appliance.


    # Booting the CD


    With the Laddie CD in the drive, reboot your computer. Successfully, you''ll be
    greeted with a message like the following:


    ```

    SOLINUX 2.08 0x4072248c Copyright (C) 1994-2003 H. Peter Levin

    Welcome to LAD distro 2007.02.25

    *** To abort, hit <SPACE>, then eject the CD. ***

    Select "linux", "svga", "noveda", or "shell"

    Booting default (linux) in 6 seconds...

    boot:

    ```


    At this point, you should press ENTER or wait six seconds to continue the boot
    sequence.


    A commercial appliance would typically hide boot menus from the user. Since this
    is an educational system, we want to see them. A commercial appliance designed
    for a specific hardware configuration would also boot up more quickly. This CD
    is designed to work with a broad range of hardware configurations and provide
    a flexible environment for users to experiment with and build from, so the process
    takes a little longer. In particular, the startup scripts load drivers for any
    hardware the system recognizes, even hardware that is not required for the Laddie
    appliance.


    # Navigating the Framebuffer User Interface


    Once the CD boots successfully, the system will present you with the main screen
    for the Laddie framebuffer user interface (see Figure E-1). If you see this screen,
    you''ve succeeded in running the appliance and you should now be able to use your
    keyboard''s arrow keys and ENTER key to navigate the Laddie framebuffer user interface.
    (If your keyboard doesn''t have arrows, use j for left, k for down, and i for
    right).


    +   NOTE If the boot process completes and a login prompt appears instead of the
    screen shown in Figure E-1, your video card is probably not VESA-compliant. In
    that case, the Laddie appliance will still run, but you won''t be able to experiment
    with the framebuffer interface.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Laddie Alarm System - Status


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_362_0.png)


    Figure E-1: The Laddie framebuffer user interface


    # # Accessing the Web Interface


    The Laddie appliance boots up with the static IP address 192.168.1.11. If your
    PC is connected to a local area network with an Ethernet card recognized by Laddie’s
    operating system, the appliance will serve web pages that allow you to monitor
    and control the appliance (see Figure E-2). You can access this interface with
    a browser on the local network by using the http://192.168.1.11.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_362_1.png)


    Figure E-2: The Laddie web interface


    > You can also use the text-based browser Lynx to access the Laddie web pages.
    **Type lynx at a command prompt**, and then navigate by following the instructions
    at the bottom of the display.


    # # Experimenting with the Linux Shell and Other User Interfaces


    In addition to the framebuffer and web interfaces, the Laddie appliance supports
    a command line interface, a front panel interface, and an SNMP interface. When
    experimenting with these other interfaces, you will find it helpful to use a Linux
    shell so that you can interact directly with the operating system. If the Laddie
    appliance is on a network, you can access a login shell using telnet (i.e., telnet
    192.168.1.11). To log in, enter the username and an empty password. You can also
    switch from the framebuffer user interface to a login prompt by pressing CTRL-ALT-F1.
    (If you want to return to the framebuffer interface later, press CTRL-ALT-F7).


    The Laddie Appliance Bootable 339'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Please see the appropriate chapters for instructions on accessing the CLI,
    front panel, and SNMP interfaces.


    # Shutting Down the Laddie Appliance


    The Laddie operating system will not eject the CD while the system is running
    because it relies on the CD for necessary system files. To eject the CD and return
    to your original operating system, reboot your computer by typing reboot in a
    Linux shell. When you see the Laddie boot prompt (as shown in "Booting the CD"
    on page 338), press the spacebar to interrupt the auto-matic boot, eject the CD,
    then press CTRL-ALT-DEL to reboot your computer with your original operating system.


    # Exploring the CD Contents


    If you boot the Laddie appliance and you''ll find that most of the top-level directories
    exist in the ramdisk, and only the /bin, /lib, /sbin and /usr directories are
    linked back to the CD. In particular, all the directories related to the Laddie
    appliance are read-write, so you can use the CD to experiment with, rebuild, and
    reinstall the appliance.


    # Laddie Appliance Source Code


    The Laddie Appliance software is provided in /Code/src and is partitioned into
    packages corresponding to the various user interfaces and services. The binaries
    and related files are installed in /opt/laddie. Table E-1 identifies the source
    and install directories for each of the Laddie appliance components.


    Table E-1: Source and Install Directories for Laddie Appliance Components


    | Component | Source in (/Code/src) | Install Directories |

    |---|---|-|

    | Command line interface | cli | /opt/laddie/{cli,bin} |

    | Empty daemon (used by other components) | empd | n/a |

    | Framebuffer user interface | fbmenu | /opt/laddie/{fbenu,bin} |

    | Front panel | front_panel | /opt/laddie/, /opt/laddie/htdocs/front_panel |

    | Laddie alarm daemon | ladd | /opt/laddie/(ladd,bin) |

    | System logger | logmuxd | /opt/laddie/(logmuxd,bin) |

    | Network daemon | network | /opt/laddie/(network,bin) |

    | SNMP agent and MIB | snmpapp | /opt/snmp/sbin, /opt/snmp/share/snmp |

    | STBmenu | stbmenu | /usr/local/{include,lib} |

    | DB-to-file utility | tbl2filed | /opt/laddie/{tbl2filed,bin} |

    | Web interface | web | /opt/laddie/htdocs/web |'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'In addition to these components, the /Code/src directory contains the buildapp
    subdirectory, which contains scripts and files that support building the appliance.
    This subdirectory also contains an examples programs we discuss in the text.

    Where appropriate, component subdirectories include Makefiles. There is also a
    top-level Makefile in /Code/src that allows you to build and re-install the entire
    appliance with these commands:


    ```

    laddie::# make

    laddie::# rm -rf /opt/laddie

    laddie::# make install

    ```


    If you''d like to study the source code, a good place to start is the alarm code
    in /Code/src/subdirectory. This is a simple application, but it demonstrates both
    the empty daemon and the RTA library. The entry point for this service is in /Code/src/empd/main.c.
    The main function callsappInit in ladd.c, which uses RTA to publish a table of
    alarm zones.


    # Laddie Appliance Libraries


    The Laddie appliance uses several libraries. The RTA library source is provided
    in the /usr/src/packages/rta-q0.7.5.tgz, and it is installed in /usr/local/lib
    and /usr/local/include.

    PostgreSQL, the lightpd daemon, and the SNMP utilities are well-documented open-source
    projects that we have compiled and installed without patches. The source code
    for the versions we use is provided in /usr/src/packages:


    +   - postgresql-base-8.0.1.tar.bz2

    - lightpd-1.4.10.tar.gz

    - net-snmp-5.1.3.1.tar.gz


    The RTA library and PostgreSQL client do not have configuration files. The lightpd
    daemon uses the configuration file at /etc/lightpd.conf. PHP''s configuration
    file is in /etc/php.ini.


    # Startup Scripts


    In order to launch the appliance at system startup, we add scripts to /etc/rc.init.d
    directory. We also provide links from /etc/rc.d/rc3 so that these scripts will
    be invoked in runlevel 3. The Laddie startup scripts include laddie, logmuxd,
    networkd, snmpd, and tb2filed. Each of these scripts also provides for the graceful
    termination of the appliance when the operating system shuts down. The framebuffer
    user interface is launched at startup using fbmenuctl script, but because the
    console must be launched first, we invoke it from the /etc/inittab file.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'For convenience testing, we provide the laddie script in /opt/laddie/bin. This
    script invokes all of the startup scripts specific to the appliance.


    # The Linux From-Scratch Distribution and Additional Packages


    Had this been a real Linux appliance, we might have opted for a simpler Linux
    environment. We might have used a smaller kernel, BusyBox utilities, and uclib
    libraries. But our emphasis is not embedded Linux, and we feel a more generic
    Linux environment keeps the focus on the appliance architecture.


    As a starting point, we used Linux From Scratch (http://www.linuxfromscratch.org),
    a distribution that includes most of the tools we needed to build our appliance,
    and does not include the X Window System (which we didn''t need). All the packages
    required to rebuild the Laddie appliance are included in the /usr/src/packages
    directory. Most of these packages were installed according to instructions from
    the Linux From Scratch documentation, which is also included in the /usr/src/packages
    directory as LFS-BOOK-6.0.pdf. Additional packages include the following:


    | PostgreSQL | FreeType2 and Bitstream fonts | SNMP |

    |---|---|---|

    | PHP | utnetld | nettools, libnet, libcap, and arping |

    | SNMP | gdbserver | lynx |

    | dhcpcd | dialog | pcutils |

    | fbset | setserial | lighttpd |

    | SDL and SDL_ttf | UIRC | fanout |

    | Pure-FTPd | | |


    > See the /usr/src/packages/HISTORY for detailed installation notes for these
    additional packages.


    # Rebuilding the Laddie Appliance


    As a quick illustration of the CD’s filesystem structure, let’s modify and reinstall
    a portion of the Laddie appliance. This won’t be permanent; we won’t create a
    new CD. We’ll just add a line to .c file in the alarm daemon, recompile it at
    the Linux shell prompt, reinstall it, and run it.


    If you’d like to follow along, boot up an x86 PC using the Laddie CD and bring
    up a shell console. See “Booting the CD” on page 338 for instructions.


    NOTE This exercise assumes you can use the vi editor. If you’re not familiar with
    vi, you can get up to speed quickly with vimutor, which is also provided on the
    CD.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '+   1. Since the alarm daemon will already be running, kill it with this

    command:


    laddie:~ laddie stop


    +   2. Then use the following commands to enter the alarm daemon source

    directory and open the ladd.c file for editing:


    laddie~# cd /Code/src/ladd

    laddie~# vi ladd.c


    +   3. In the function user_update() at the end of the file, find the following
    lines:


    syslog(LOG ALERT, "User set alarm on zone %d, %s",

    Zone[rowid].id, Zone[rowid].name);


    +   4. Immediately after these lines, insert the following:


    syslog(LOG_ALERT, "Hello, world! I''ve modified the alarm daemon!");


    +   5. Save the file and quit it. Build and reinstall ladd with the commands:


    laddie~# export DEF_APPDIR=/opt/laddie

    laddie~# make -e

    laddie~# make -e install


    > **NOTE** The Laddie appliance components use the environment variable DEF_APPDIR
    to specify

    the install location. The default is the more conventional location /usr/local,
    but we

    use /opt/laddie instead to make it easier for you to identify the components that
    are

    specific to the appliance. The -e option tells the make utility to let environment

    variables override variables that occur in Makefiles.


    This will create a new executable and install it in /opt/laddie/bin.

    Then start the alarm daemon by entering this command:


    laddie~# laddie start


    +   6. Press ESC to exit the framebuffer user interface. Then monitor the sys-

    logs with this command:


    laddie~# cat /var/log/messages


    Log messages are routed to the pipe /var/log/messages by the

    logmuxd event handler. Using cat, we can display these messages at the

    console. The command will do nothing until an event occurs.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '+   7. To create a user update event, use CTRL-ALT-F2 to switch to console
    2, and then run the command line interface:


    ```

    laddie:~# cli

    ```


    +   8. Create an update event with the following commands:


    ```

    clear all

    test 1

    quit

    ```


    +   9. Now use CTRL-ALT-F1 to switch back to the original console. If you reinstall
    worked, the displayed log messages will contain a time-stamped entry with your
    new “Hello, world!” message.


    +   10. Use CTRL-C to terminate the logging display.'
