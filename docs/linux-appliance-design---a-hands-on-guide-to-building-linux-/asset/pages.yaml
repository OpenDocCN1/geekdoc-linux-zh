- img_proc: true
  md: 'After the first command, you will need to wait a few moments for the Laddie
    application to stop. In the second command, the pidof function puts the process
    ID of the lirc process. The $(...) construct provides this output as a parameter
    to the cat command, which terminates the specified process. We can now access
    the /dev/lirc device file for our purposes.


    As we saw in the previous chapter, you can use the cat command to access output
    which /dev/lirc is provided via device files. Now we don''t want to simply cat
    the output of /dev/lirc to the console, because some of the output data might
    be interpreted as control characters and the console could end up in an unusable
    state. One thing we can do is pipe output through the hexdump utility, which translates
    binary data into printable ASCII hexadecimal characters.


    Enter the following command:


    ```

    laddie:#$ cat /dev/lirc | hexdump

    ```


    Now, any pulses that arrive on the DCD pin of serial port COM1 will be measured
    by the lirc_serial device driver, read by the cat command which /dev/lirc device
    file, and displayed in ASCII hex by hexdump. To generate pulses, connect your
    IR receiver to the COM1 port, point your remote control at the IR detector/demodulator,
    and press a button. (At this point, the particular kind of remote doesn''t matter.)
    If everything is working properly, you should see your output like this:


    ```

    000000 df67 0061 099d 010f 00b0 04f6 0100

    000010 0216 0000 04d4 010f 01a0 0000 026e 0100

    000020 02d3 0000 028a 010f 0000 04f7 0100

    000030 01f0 0000 02a1 010f 0000 02a0 0100

    000040 01f0 0000 04fc 010f 0000 02a0 0200

    000050 01f0 0000 0283 0118 0210 0289 0100

    ```


    This is the output we generated by briefly tapping the Volume–button on the universal
    remote that we programmed for Sony TV.


    Using the cat /dev/lirc | hexdump command is a good exercise because it demonstrates
    that the output of /dev/lirc is simply binary data that can be read as a file.
    Neither cat nor hexdump know anything about infrared, yet they display the data
    just fine. But the output of hexdump isn''t easy to read.'
