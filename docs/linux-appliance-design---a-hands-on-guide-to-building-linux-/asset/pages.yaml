  md: 'when the user presses the Off button. A low power state might include having
    a slower CPU clock and removing power to as many peripherals as possible. However,
    you should be aware that this approach has fallen into disfavor as more and more
    consumers demand that _Off_ means zero power consumption.


    # Give Feedback


    If you can''t be quick, at least try to give an idea of what the system is doing.
    Or be better to modify the Linux kernel to send simpel boot status messages to
    the LCD. Telling the user what is happening can help him or her tolerate the 10-
    to 20-second boot time of Linux.


    Giving feedback should not be limited to the boot process. Give the user constant
    feedback by bringing the Ethernet activity LED to the front panel or having the
    LCD display rotate through various appliance statistics. Be sure to identify errors
    clearly and unambiguously.


    # The Laddie Front Panel


    Our requirements for the Laddie front panel UI that we were able to view either
    system status or log messages, and that we have the minimal set of commands necessary
