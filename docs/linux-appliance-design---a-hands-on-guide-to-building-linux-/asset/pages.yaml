  md: '# Avoid Buffer Overrun Attacks


    Some library functions are considered unsafe because they do not limit how much
    memory they will overwrite. For example, the strcpy() function is considered unsafe,
    while the strcpy() function is considered safe.

    Nevertheless, we are not convinced that the strncpy() routines are all safe, since
    they do not guarantee that the resulting string is null. The best thing to do
    is to check the length of the string before doing a copy.

    ''s look at some examples.


    ```

    VERY BAD: strcpy(dest, src);

    ```


    This is an invitation to a buffer overrun attack if src has not previously checked.


    ```

    BAD: strncpy(dest, src, MAXN);

    This call does not guarantee that dest is null terminated.

    ```


    ```

    BETTER: strncpy(dest, src, MAXN);

    dest[MAXN -1] = (char) 0; //truncation => still bad

    ```


    The above code protects the program in that it prevents a buffer overrun and guarantees
    that it is null terminated, but it quietly truncate the source string.


    ```

    BEST: if (strlen(src) >= MAXN) {

    LOG("String error at %:%d\n", __FILE__, __LINE__);

    return(ERROR_STR_LEN);

    }

    strncpy(dest, src, MAXN);

    ```


    While it uses more code, the above protects the program and reports source strings
    that may be part of an attack on your program.

    Several function families are unsafe. Specifically, these include strcat(), sprintf(),
    gets(), and scanf().


    # Other Security Software


    Even if you follow the best coding practices, you may want the added protection
    of the following software:

    IBM''s ProPolice GNU Compiler Collection (GCC) patch to prevent buffer overruns

    StackGuard GCC patch to help prevent buffer overflows

    Libsafe Alternate library for strcpy() and other unsafe functions

    grsecurity Kernel patch that can (among others) make the stack non-executable


    Systrace Kernel patch that can limit system calls for your daemon can make'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'We strongly recommend using grsecurity and configuring your system so that
    code is never executed from the stack. This feature uses the hard-ware in the
    memory management unit and will not affect your program''s performance.


    # Limit Damage in Case of a Breach


    Almost every major Linux application has, at one time or another, been found to
    be vulnerable. Since the same may happen to your daemon at some point, you want
    to limit the amount of risk a compromised daemon might present to the appliance.


    # Prevent Library and Path Attacks


    If an attacker gains access to your appliance, he might be able to run your daemon
    first set LD_LIBRARY_PATH or PATH to point to compromised libraries and commands.
    If your program is User ID (SUID) root, your attacker has gained complete root
    control over your appliance. Don''t despair. There are a few things you can limit
    disaster in the event your daemon is compromised.


    First, do not run your application with an SUID of root. This is easier than an
    appliance on a multi-user system where programs passed the and the X server must
    be SUID root. It is better to drop root privileges or run as a non-privileged
    user. (You''ll learn more details about this in the next section.)


    The second defense is to do a static build of your daemon -static as an option
    to your gcc invocation. A statically linked executable might not increase the
    size of your executable as you''d imagine, and if you are using chroot, it might
    actually save disk space. Statically linked executables usually load faster, too.


    Another way to prevent a library or path attack is to ignore the environment variables
    that tell your program to look for shared object libraries and system commands.
    If you are really security conscious, use the glibc clearenv() function to undef
    all environment variables. You will need to give the full path to all commands
    you run with system(), but this is probably a good idea anyway.


    # Avoid Root Privileges


    Attackers want root privileges so they can take control of your appliance. If
    you run your daemon as root, you make your daemon a target for their attacks.
    Avoid root privileges if at all possible. Create a new user (with the login shell
    set to /bin/nologin) and use setuid() and setgid() to change to that user. This
    technique is used by most web- and database servers.


    Another approach is to modify your rc initialization scripts to launch your daemon
    with sudo to change to the appropriate user. For example, your rc script might
    start your webui as user wuser with the command:


    ```

    sudo -l wuser webui

    ```'
  merge: -1
