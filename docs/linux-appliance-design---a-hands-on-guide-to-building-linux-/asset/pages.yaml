  md: '# INTRODUCTION


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_18_0.png)


    Toasters, ovens, and dishwashers are a few of the appliances found in our everyday
    lives. Though we are quite familiar with their use, few of us stop to think about
    how an appliance works under the hood, or even what makes an appliance, well,
    an appliance. This book defines an appliance as a device designed to primarily
    perform a single function. If you think about the appliances just mentioned, you''ll
    see that this definition holds true—toasters toast, ovens bake, and dishwashers
    wash dishes. Compared to a PC, which is capable of performing thousands of functions
    depending on the hardware and software installed, traditional appliances are boring
    and simple.


    What does this have to do with Linux? For starters, traditional appliances are
    no longer so simple. What used to be electrified but still mechanical devices,
    such as a vacuum cleaners, are now not only electronic, but include processors,
    circuit boards, and sophisticated user interfaces. With these changes comes the
    need to run an operating system on the appliance to manage the new features. Linux
    is a natural fit for this because it is low cost'
  merge: -1
  pgno: 18
- img_proc: true
  md: '(in most cases, it is free to use) and open source (which means you can modify
    it to better suit your needs). However, the real place where Linux fits in is
    the new types of appliances that are being designed. Digital video recorders (DVRs)
    were unheard of just a few years ago, but the first and most popular DVR appliance,
    the TiVo, runs on Linux, as do many other home networking and entertainment appliances.


    If you were to build the next robotic house-cleaning system, you''d want to avoid
    designing completely from scratch. You''d reuse as many parts as possible from
    your earlier robots, and you''d use off-the-shelf components wherever possible.
    Same reuse mentality applies to Linux appliances, and that''s what this book can
    help.


    # What This Book Is About


    This book shows you how to build a Linux appliance, and it includes a prototype
    appliance that you can use as the basis for your appliance, if you wish. We divide
    an appliance into daemons and user interfaces and show how to create and manage
    daemons, as well as how to build five different types of user interfaces.


    We cover the following topics:


    +   - Appliance architectures

    - How to talk to running daemons

    - How to build and secure a daemon

    - Laddie, our sample appliance

    - Logging and event handling

    - Web-based user interfaces

    - Command line interfaces (CLIs)

    - Front panel interfaces

    - Framebuffer interfaces, including infrared remote control

    - SNMP interfaces including tools, MIBs, and agents


    Most of the chapters have the same basic layout. We define and explain why the
    feature is necessary, we describe the feature''s challenges and common approaches,
    and we describe how we implemented the feature in our sample appliance.


    # What This Book Is Not About


    This book does not cover C programming, the Linux operating system, or the main
    application that defines a particular Linux appliance. Furthermore, this book
    is not about embedded Linux. We believe you will find the following on embedded
    Linux:


    +   - Embedded Linux, by John Lombardo (SAMS/New Riders, 2001)

    - Embedded Linux: Hardware, Software, and Interfacing, by Craig Hollabaugh (Addison-Wesley,
    2002)'
