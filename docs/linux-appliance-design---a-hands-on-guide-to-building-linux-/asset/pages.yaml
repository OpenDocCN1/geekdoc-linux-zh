    \ phototransistor (catalog number 276-142) and when using another, unidentified,\
    \ phototransistor we happened to have lying around. The output will be weak, but\
    \ it should be adequate for an oscilloscope. By the way, this experiment is also\
    \ useful if you need to determine the modulation frequency for an unfamiliar protocol."
