- img_proc: true
  md: '# Why SNMP?


    In the early 1970s, computers and their I/O devices were large enough to need
    air-conditioned rooms of their own. Most large companies performed their computing
    tasks on stand-alone systems. It wasn''t hard to tell when something went wrong—an
    error would print on the system console, and the front panel lights would stop
    blinking.


    Today, even small technology companies have a server room with racks of computers
    and network appliances from multiple vendors, including switches, routers, print
    servers, webservers, RAID servers, and so forth. Network printers are distributed
    at convenient locations around the area, and each has a desktop or laptop computer.
    In fact, high-tech firms typically have more computers than employees.


    Unlike those of yours, the failure of any single component in this network of
    devices is not so to detect. IT managers need to manage some form of automation
    to help them manage all these devices.


    The automation may be as simple as a roll-your-own script that performs periodic
    ping pings, but larger networks are likely to rely on a Network Management System
    (NMS) that uses SNMP, such as Hewlett Packard''s OpenView. Such a system can tell
    much more when a device breaks a log of notifications from the devices themselves
    about impending problems. Devices may report excessive packet drops or retransmissions;
    connectivity failures; a fan running slowly or a CPU running too hot; expensive
    CPU, memory, or disk utilization; as well as system restarts.


    # Agents and Managers


    The managed devices (routers, switches, web hosts, desktop computers, network
    printers, and so on) each run a server process (daemon) called an SNMP agent.
    This agent listens on a particular UDP port (usually, but not always, port 161)
    for read (GET) and write (SET) commands. It''s the agent''s responsibility to
    fetch the requested data and return it. This agent, as well as monitoring software
    on the device, may also send spontaneous notifications called traps or informs
    to more or configured targets set.


    Management applications (managers) poll the agents for information. They keep
    historical information, generate reports, or create graphical maps of the devices
    in your network. Some management applications are just simple command-line tools
    (like the snmpwalk, snmpget, and snpset commands supplied with NetSNMP).


    # Namespace, Graph, and Protocol


    SNMP stands for Simple Network Management Protocol, but it is actually more than
    just a protocol—it''s a way of naming data, a grammar for describing data, and
    a protocol for exchanging data over a network. These components are called MIB
    (the naming scheme), SMI (the grammar) and the SNMP protocol. The RFCs that describe
    SNMP include a common set of information'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'useful in managing networked devices. This is called MIB-2 (took two tries
    to get it right). We''ll be discussing more about MIB-2 later.


    # The MIB


    MIB stands for Management Information Base. That''s a mouthful, but you can just
    think of it as a hierarchical naming scheme for a virtual database. This is a
    "virtual" database because the data may not exist anywhere in storage until the
    agent receives a request to read the data. When asked for an object (think of
    this as a field in a record in the database) the agent retrieves the information
    and returns it in a process that may involve getting multiple pieces of information
    from the managed system and computing the value to be returned. (You might think
    of this as a just-in-time database.) The very act of requesting a piece of information
    may trigger the creation of value.

    Although there is one universal addressing scheme, we break down into subdivisions,
    which we also call MIBs. Normally, when people use the word MIB, they are referring
    not to the overall namespace, but to one of these subdivisions. MIB-2 is one of
    them, and many are defined by different groups for different purposes. Some are
    produced by standards groups, others defined by private companies to describe
    data furnished by their networked products. (In Chapter 14 we describe how you
    can define a private MIB for your own appliance and find a place for it in the
    namespace.)


    # The OID


    Every object in every MIB has an object identifier (OID). An OID is a unique name
    consisting of a sequence of decimal digits separated by periods, or dots, like
    this:


    .1.3.6.1.2.1.1.2.0


    This name represents the object''s location in the namespace. The dot represents
    the root of the tree, and each number represents a node (the base of a branch)
    in the tree. Everything nameable in SNMP is located somewhere in this OID tree,
    and every name (OID) contains the entire path to that object from the root of
    the tree.


    This may look strange at first, but it works in the same way as the Unix filesystem,
    with paths to files start at root, indicated by an initial slash (/), proceed
    through a number of named nodes (directories) separated by slashes, and end with
    the name of the file itself.

    Let''s take the example of a file on a Unix filesystem:


    ```

    /usr/local/bin/myprog

    ```


    If we use a to separate directories instead of a slash, the path to the file would
    look like this:


    ```

    .usr.local.bin.myprog

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'Suppose the following table defined a map between the directory names and a
    set of numbers:


    | Directory | No. |

    | --- | --- |

    | usr | 1 |

    | local | 3 |

    | bin | 6 |

    | myprog | 1 |


    If we use the numbers in place of the names, the path would look like this:


    .1.3.6.1


    Figure B-1 shows part of OID tree (or namespace). Note that some nodes in the
    tree are named for organizations: ISO is the International Standards Organization,
    and DOD is the US Department of Defense. (The DOD is in this structure because
    it was instrumental in the creation of DARPANET, which originally consisted of
    a four-computer network. By 1972, DARPANet had grown to a network of 37 computers
    and renamed ARPANET, which led to today’s Internet. End of history lesson.)


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_335_0.png)


    Figure B-1: The OID tree


    The Internet Assigned Numbers Authority (IANA) is responsible for assigning numbers
    to companies and organizations under the enterprises node, giving the company
    or organization the authority to administer the OIDs in their subtrees.'
