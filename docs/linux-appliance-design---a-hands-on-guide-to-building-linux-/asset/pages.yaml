    the RTA table editor to examine them on a running Laddie appliance.

    Two other logmux tables are associated with message processing. The Rawlog table
    acts as a FIFO to hold the 10 most recent messages. It is useful when debugging
    filters or monitoring the raw input to the logger. The Accept table holds the
    file descriptor and other information needed by accepted TCP connections and open
    Unix sockets. There are no configurable fields in either Rawlog or Acpt.


    # logmuxd Filters Rewriting


    One of the main reasons to use logmuxd is that it rewrites messages and forwards
    them to another process. For example, when a user sets an alarm in a zone, ladd
    sends the log message "User set alarm on zone n, zone_name" (where n and zone_name
    are replaced by the zone number and userassigned name). We want this log message
    to appear on the front LCD display, the LCD display can only display 16 characters,
    so we use the rewriting capability of logmuxd to rewrite the message to fit on
    the LCD display. The original message is rewritten from this:


    ```

    Aug 12 22:28:31 Ladd[3820]: User set alarm on zone 5, Refrigerator

    ```


    to this:


    ```

    22:28 Usr set 5

    ```


    All of the configuration data to recognize and rewrite a log message is contained
    in the Filters table. This table contains the type and name of the destination,
    the regular expression to match, and an sprintf() format string for the rewritten
    message. Let''s look at each of these fields in turn.'
