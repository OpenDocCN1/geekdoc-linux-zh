    # Limitations, Advantages, and Alternatives to syslog


    There are a few limitations with the default syslog daemon. As mentioned previously,
    it does not save the message level or facility (although you can get them directly
    by routing based on). syslog can not route based on regular expressions, it only
    accepts messages from Unix sockets, and it has a somewhat limited set of actions.
    Some programmers find the limited number of levels a a problem when setting up
    debug and trace mechanisms. On the plus side, syslog is universally accepted and
    is thoroughly debugged, tested, and secure.


    The logger utility (which we saw briefly in the beginning of this chapter) lets
    you work around the limited set of message sources for syslog. Logger sends log
    messages to syslog, getting the log messages from either its command line or from
    each line of its standard input. If you wish, you can specify level, facility,
    and a prefix string. See the logger page for more details. You can also combine
    netcat (a simple utility to read and write from network connections) and a logger
    to accept log messages from a single TCP connection using a command similar to
    the one shown below.


