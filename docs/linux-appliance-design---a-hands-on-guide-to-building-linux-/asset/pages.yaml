    The /opt/snmp directory tree is our staging area for the files we will need to
    copy to our appliance to get the agent working there. We won''t need the include
    or man directories on our appliance.

    We may also decide to remove client applications like snmpget and snmpset from
    the binary directory on our appliance, but be sure not to remove snmptrap which
    we will be using to send traps from our appliance. The other commands may come
    handy if we ever need to log in to the box for debugging or if we want to invoke
