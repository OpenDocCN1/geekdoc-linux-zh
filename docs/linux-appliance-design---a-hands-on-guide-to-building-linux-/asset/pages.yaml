    including a web-based emulator written in JavaScript and PHP.


    # lad216


    The code to generate the proper escape sequences is in the lad216 program. The
    program uses standard in and out, so if you build the hardware described above
    and install our /dev/lad_pad driver, you could tie the lad216 program to the hardware
    with the:


    ```

    lad216 </dev/lad_pad> /dev/lad_pad

    ```


    The code is in three files: main.c which has the select loop, menu.c which has
    the state machine, and lad216.c which encodes the output for display on the lad-pad
    hardware. Using standard input and output makes it easy to connect lad216 to the
    various front panel emulators described below.


    # Front Panel Emulators


    A front panel emulator is a great way to test a front panel design without actually
    building it. Front panel emulators that ship with the finished product are particularly
    nice for end users who do not want to be burdened with learning different UIs.


    We spent a little building front panel emulators for Laddie, building one that
    uses C and curses, one that uses Tcl/Tk and the X Window system, and one that
    uses JavaScript and HTML. You can choose which emulator to examine based on your
    preferred programming language.


    The current version replaces lad216 with cur216.c, but still uses the main.c and
    menu.c files. You can try the front panel emulator by booting the Laddie CD and
    telnetting into the app. The cur216 executable is in the default path.¹


    The Tcl/Tk version, x216.tcl, is based on the lad216 executing, using Tcl/Tk to
    replace the lad_pad hardware. The Laddie does not include the X Window system
    so you cannot run x216.tcl on a booted Laddie.


    You can try the web-based front panel emulator by booting Laddie and pointing
    your browser to http://192.168.1.11/front_panel. The index file should open a
    window with a photograph of our actual front panel hardware, buttons are tied
    to an image map and operate the same way as the buttons on the real system. The
    LED is either a static image of the LED in the state, or an animated GIF image
    of flashing the LED. The HTML of the LCD uses CSS to fix a fairly large monospaced
    font.


    The techniques used in the web emulator are simple, and you may find use of them
    if you ever build an emulator of your own front panel. To illustrate these techniques,
    look at how the LED image is controlled. In the HTML we specify the exact location
    of the image and give it a name, led.


    > You may need to set the terminal type, since telnet does not set it for you.
    I use xterm on my desktop, so when I telnet to the Laddie appliance, I set the
    terminal type with the command export TERM=xterm.'
