  md: '![](img/ab18faa434b6e1e10df0a92984bf70fc_273_0.png)


    Figure 14-2: LAD-MIB Structure


    Next, we''ll import the externally defined types and macros that we be using from
    other files:


    +   IMPORTS


    NOTIFICATION-TYPE,

    MODULE-IDENTITY,

    OBJECT-TYPE,

    Counter32,

    Integer32,

    Gauge32

    FROM SNMPv2-SMI

    DisplayString,

    TrutValue

    FROM SNMPv2-TC

    laddieMgmt

    FROM LADDIE-GROUP-SMI


    The first comes from SNMPv2-SMI just like the LADDIE-GROUP-SMI.txt file we covered
    in the previous section.

    The next set comes from SNMPv2-TC. The letters TC stand for textual conventions.
    SNMPv2-TC is basically a file that defines new, commonly used object types.

    The laddieMgmt OID from the LADDIE-GROUP-SMI.txt file will be our starting point
    in the overall namespace for appliance MIB. We''ll use laddieMgmt as our link
    to the overall namespace by defining the module in this group below laddieMgmt
    in the code portion of the “Module Definition” section next.'
