  md: '# More No-Nonsense Books from


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_381_0.png)


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_381_1.png)


    # HOW LINUX WORKS


    What Every Superuser Should Know


    by BRIAN WARD


    How Linux Works describes the inside of the Linux system for systems administrators,
    however they maintain an extensive network in the office or one Linux box at home.
    After a guided tour of filesystems, the boot sequence, system management basics,
    and networking, Brian Ward delves into topics such as development tools, custom
    kernels, and buying hardware. With a mixture of background theory and real-world
    examples, this book shows both how to administer Linux, and why each particular
    technique works, so that you will know how to make Linux work for you.


    MAY 2004, 368 PP., $37.95 ($55.95 CDN)

    ISBN 978-1-59327-035-3


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_381_2.png)


    # THE LINUX ENTERPRISE CLUSTER


    Build a Highly Available Cluster with Commodity Hardware and Free Software


    by KARL KPER


    The Linux Enterprise Cluster shows how to turn a number of inexpensive networked
    computers into one powerful server. Learn how to build a highavailability server
    pair using Heartbeat, the Linux Virtual Server load balancing, configuring a reliable
    system in a Linux cluster environment, and build a job scheduling system in Linux
    with no single point of failure. The CD includes the Linux kernel, ldirectory,
    Mon, Ganglia, OpenSSH, rsync, SystemImagine, Heartbeat, and all figures and illustrations
    used in the book.


    MAY 2005, 464 PP., $49.95 ($67.95 CDN)

    ISBN 978-1-59327-036-0


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_381_3.png)


    # THE LINUX COOKBOOK, 2ND EDITION


    Tips and Techniques for Everyday Use


    by MICHAEL STUTZ


    Linux is cool, but it''s not well documented. There are tons of inconsistent HOW
    out-of-date FAQs, and programs scattered everywhere. Whenever you want to do anything
    with Linux, you usually have to read every piece of documentation or basically
    reverse engineer a solution. Many Linux books for non-geeks are organized by major
    system, with a chapter on installation, for video, for one sound, for networking,
    and so on. But what if you want to write a book? Or an album? If you can''t dig
    on the Web to find someone else doing the same thing, you are out of luck. Unless,
    that you have The Linux Cookbook.


    AUGUST 2004, 824 PP., $39.95 ($55.95 CDN)

    ISBN 978-1-59327-031-5'
