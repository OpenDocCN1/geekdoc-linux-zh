    # Graceful Degradation Without JavaScript


    When designing a web-based appliance, you must decide which browsers you will
    support. Do you support non-graphical browsers like Lynx, or do you only support
    fully featured browsers? By reducing the level of required browser functionality,
    you can support a wide variety of browsers, but it will be at the expense of an
    increased effort in development. At the other extreme, you could dictate that
    a specific browser be used, with the advantage of using proprietary features,
    but with the risk of some customers disliking your browser selection. Customer
    input would be invaluable in helping you to make this decision.


    We chose to support a wide variety of browsers, sought to reduce the developmental
    effort by avoiding browser-specific code. That is, we avoided code that didn''t
    work the same way on all browsers.


    Of particular concern was the ability to support browsers without JavaScript.
    One of the difficulties with JavaScript is that it can be disabled by the user,
    and ever user, may not know that it is disabled.


    One approach for supporting browsers with and without JavaScript is to structure
    the website as two "universes"—one universe where JavaScript is used and in which
    it isn''t. The home page is written to detect whether JavaScript is enabled on
    the browser and to redirect the browser to the'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'appropriate universe. Unfortunately, this solution does not work for the user
    disables JavaScript and then reloads a particular page. The work-around is for
    the user to turn on JavaScript and then revisit the home page.


    We took another approach, which allows the user to enable or disable JavaScript
    and then reload the particular page. This means each web page must support a JavaScript
    version and a non-JavaScript version. In the past, this problem might have been
    tricky to solve because browsers didn''t support JavaScript were confused by JavaScript
    code. But this problem is easily solved today, because the majority of browsers
    (even like Lynx that don''t support JavaScript) understand the HTML `<script>`
    tag. When a modern browser has JavaScript disabled, it ignores all HTML code between
    the pair of `<script>` and `</script>`.


    # Hiding JavaScript


    The following pattern for hiding JavaScript content from browsers is known to
    work for Internet Explorer (version 5.0 and later), Netscape Navigator (version
    4.72 and later), Firefox (version 1.0 and later), Safari (version 1.0 and later),
    Opera (version 5.0 and later), and Lynx (version 2.8.2 and later).


    ```

    <SCRIPT TYPE="text/javascript">

    <!-- hide from old browsers -->


    // javascript code goes here


    // end of script hiding <-->

    </SCRIPT>

    ```


    The HTML comments <!-- and --> are included as a fail-safe mechanism for old browsers
    that don''t understand the `<SCRIPT>` tags. Similarly, you can use `<NOSCRIPT>`
    and `</NOSCRIPT>` tags to provide alternate content when JavaScript is not enabled.


    Using these patterns, each web page can support both JavaScript and non-JavaScript
    versions, and consequently, the user can change the browser''s JavaScript setting
    and reload the page. Because the user doesn''t have to find and reload some site-wide
    redirection page, the user''s experience is greatly simplified.


