  md: 'Figure 8-7 an example of how the Ajax communication mechanism works. The exchange
    in this figure is initiated when the user moves over an active element on the
    web page at event ①. An mouseover action is triggered and JavaScript is executed
    in the web browser at event ②. The JavaScript code creates XMLHttpRequest with
    URL of the server-side script and a JavaScript callback function, and the web
    browser sends the XMLHttpRequest to the server at event ③. On the server side,
    the particular script identified by the URL returns with XML data at event ④.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_141_0.png)


    Figure 8-7: Typical Ajax sequence.


    > **NOTE** The format of the XML is known by the client and the server, so that
    the server sends the XML data, the client understands its format. Typically, the
    XML data will contain the updated information to be displayed on some portion
    of the web page in the browser.


    Back on the client side, the web browser receives the XML data and invokes the
    JavaScript callback function. This callback function extracts the data from the
    XML message and modifies some of the web page using the XML Document Object Model
    (DOM) API at event ⑤.

    Mouse movements are not the only events that are supported by Ajax, but they are
    the most popular, along with mouse button clicks, key presses, text selections,
    and keyboard focus on editable fields—and more events are available with each
    browser upgrade.


    # # Implementation


