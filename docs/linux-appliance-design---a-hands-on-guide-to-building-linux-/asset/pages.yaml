- img_proc: true
  md: '(hence the name fanout). This book''s website hosts the fanout project, including
    source files and more detailed documentation. Please visit http://www.linuxappiancesdesign.com
    for more information.


    # Remote UDP/syslog host


    If your appliance is a network appliance designed for a large data center, be
    sure to include the ability to forward log messages to another host in the network.
    The syslog logging daemon can receive and/or forward log messages to other hosts
    using UDP.


    # TCP multiplexer


    If you want to route some to other programs, you can define a listening TCP socket
    that accepts connections. When a message arrives at the multiplexer, it is replicated
    and sent down each TCP connection on the socket.


    For example, in our Laddie appliance we have a command interface (CLI) that can
    show Laddie alarm messages.¹ When a CLI user uses the command set logs, the CLI
    opens a TCP connection to logmuxd, Laddie''s logging daemon, and messages are
    sent down each accepted TCP connection to the CLI at the other end. (logmuxd is
    described in the next chapter.)


    # Email


    It is nice to have significant events reported to you via email, since email is
    ubiquitous, if not timely. Also, email is often used as a gateway to pagers and
    cell phones (so that really important disasters can find you no where you hide).


    # Console


    Output to /dev/console or to a serial port is a must for debugging. Some large
    network centers still prefer to collect log messages over a secure and non-shared
    channel like an RS-232 cable.


    # Database


    Some messages require an immediate response, but most of the time you are interested
    in trends or changes in the pattern of a system''s events. A relational database
    is an ideal repository for log messages, since it has a wide range of tools to
    count log messages. Since databases use a lot of CPU cycles while they are sorting
    and counting, you might want to put the DB somewhere else on the network instead
    of your appliance.


    # SNMP traps


    Most large networks have one or more dedicated network-management workstations.
    The operators of these networks often insist that all network equipment use SNMP
    for status, configuration, and error reporting.


    > ¹Log messages give a report of an event. An alarm is a system state of failure
    or reduced availability. Log messages are used to report the transitions in and
    out of an alarm state, and the two terms are sometimes confused.


    Logging 81'
