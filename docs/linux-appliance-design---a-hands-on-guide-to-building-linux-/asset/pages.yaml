  md: '# A Simple Graphics Program for the Framebuffer


    In the remainder of this section, we''ll illustrate the Linux framebuffer interface
    by writing a simple graphics program. Our program, hazy_moon, will display a disk,
    240 pixels in diameter, that fades from bright cyan at the top to a hazy red at
    the bottom. The picture we have in mind, rendered in grayscale, is shown in Figure
    11-7. Our program will illustrate the use of a colormap and provide a quick, visual
    indication of whether or not we have configured the framebuffer correctly.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_200_0.png)


    Figure 11-7: A hazy moon


    The complete source for this program is on the Laddie CD in the directory/Code/src/examples/hazy_moon.
    Before working through the rest of this section, we recommend building and running
    the program. After booting the CD, change to the program''s directory, type make,
    and then ./hazy_moon. You should see the disk in the middle and a thin cyan border
    around the visible screen. If you don''t see all of the border lines, try adjusting
    the width and height of the image on your monitor. To return to the original virtual
    terminal, use CTRL-ALT-F1. If the dimensions of the graphics virtual terminal
    are not what you expected, try the command deallocat at the bash prompt to deallocate
    resources for the unused terminals, and then run the test program again.


    > When using the Laddie CD, you can view source files using vim or less. The commands
    vim or vistor if you''re not familiar with the vim editor.


    Now we''ll discuss the details of the hazy_moon program. The first detail requires
    a little working knowledge of virtual terminals.


    # A Virtual Terminal for Graphics


    One of the advantages and challenges of Linux is that it uses framebuffers for
    text consoles. This use of framebuffers is an advantage because it supports colored
    text and a wide range of fonts and character sets. However, using framebuffers
    in this way also presents a challenge, because developing a framebuffer application,
    it''s easy to trip over Linux''s machinery for managing consoles.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'For example, a program that prints a one-line message to the console can modify
    the position of the visible display relative to the virtual display; the result
    is that a displayed graphic is misplaced by the width of that line. Or, if the
    graphics hardware is configured to use a palette, if a program modifies the colors
    used to display text in the console, printed messages may become hard to read
    or even invisible.


    For reasons, it''s best to use a separate terminal for graphical displays. We
    accomplish this in the hazy_moon program with the following lines:


    ```

    #include <fcntl.h>

    #include <linux/vt.h>


    console_fd = open("/dev/tty", O_RDWR);

    ioctl(console_fd, VT_ACTIVATE, 7);

    ioctl(console_fd, VT_WAITACTIVE, 7);

    ```


    Note that we''re using the familiar open and ioctl system calls, though in this
    case, it''s not with the framebuffer. The first call (console_fd = open("/dev/tty",
    O_RDWR)) opens the console device; the second (ioctl(console_fd, VT_ACTIVATE,
    7)) requests a switch to virtual terminal 7; and the third (ioctl(console_fd,
    VT_WAITACTIVE, 7)) waits until the switch is complete. (We choose terminal 7 because
