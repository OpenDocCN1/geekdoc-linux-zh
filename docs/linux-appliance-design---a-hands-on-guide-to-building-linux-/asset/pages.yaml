    # Write a Secure Daemon


    Security is as good as the weakest link in your chain. Designing a secure daemon
    is not enough. You must also write a secure daemon.


    # Validate Input


    Many of the recent Linux vulnerabilities stem from buffer overflows that allow
    an intruder to place executable code on the stack. The most effective defense
    against this kind of attack is to validate all input from a user or any non-secure
    source. Verify string lengths and make sure strings do not contain any illegal
    characters. Verify that integers are reasonable, relative to their users, and
    counting integers are always positive.


    Perform much application-specific checking before committing other resources.
    For example, make sure that HTTP requests are well formed and SQL statements are
    valid. Checking early helps prevent the problem of timing back out of a request
    once you''ve allocated buffers, sockets, or other resources for the request.


    Do not let any malformed input into your daemon. Remember: If it''s only 99 percent
    right, then it''s still wrong.


    # Check All Return Codes


    One of the best things you can do to enhance security is to check all return codes,
    especially from system calls. Normally, this would seem like a burden, but if
    you''ve laid your design with an error escape plan, you''ll find that it does
    not take a lot of effort or to test every return code.'
  merge: -1
