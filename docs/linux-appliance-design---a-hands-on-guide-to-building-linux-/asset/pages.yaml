    # Writing Pixel Data


    Now that we have a colormap and a way to place pixels on the screen, we write
    a simple graphics program. The following code will create the promised 240-by-240-pixel
    hazy moon, as well as the single-pixel border around the perimeter of the display.


    ```

    /* Compute offset of visible frame */

    visible_frame = frame + var_info.offset*fixed_info.line_length + var_info.xoffset;


    /* Paint the left and top borders of the visible display. */

    for(col=0; col<var_info.xres; col++){

    visible_frame[col] = 255;

    visible_frame[(var_info.yers-1)*fixed_info.line_length + col] = 255;

    }


    /* Paint the left and right borders of the visible display. */

    for(row=0; row<var_info.yers; row++){

    visible_frame[row*fixed_info.line_length] = 255;

    visible_frame[row*fixed_info.line_length + var_info.xres - 1] = 255;

    }


    /* Compute the offset for a 240x240 square in the middle of the screen. */

    img_off = ((var_info.xres-240)*fixed_info.line_length + (var_info.xres-240))/2);


    /* Paint a 240x240 disk in the center of the visible screen. */

    for(row=0; row < 240; row++) {

    for(col=0; col < 240; col++) {

    if((row-120)*(row-120) + (col-120)*(col-120) <= 120*120) {

    visible_frame[img_off + row*fixed_info.line_length + col] = 255 - row;

    }

    }}

    }

    ```


