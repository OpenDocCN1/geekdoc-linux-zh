    # Summary


    Traditional logging handles an event by putting the report of the event (the log
    message) into one or more files on disk. A better approach is to examine each
    event individually and then decide how best to handle it. Making your appliance
    aware of events and respond to those events is one of the best things you can
    do for your customers.


    In earlier chapters we showed you how to use the PostgreSQL protocol and API for
    control and status of your appliance. But control and status is only half of the
    solution—in this chapter we presented event handling, the other half of a successful
    appliance design.'
