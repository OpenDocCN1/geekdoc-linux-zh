  md: 'We downloaded version lirc-0.8.1 from http://www.lirc.org and installed it
    with these commands:


    ```

    ./setup.sh

    ./configure --with-kernel-dir=/usr/src/linux-2.6.10 --with-driver=serial

    make

    make install

    ```


    The setup.sh script is used to make choices about our installation. Under the
    Driver Configuration (driver=serial:io:0x3f8 irq:4) we chose the Home-brew (16x50
    UART compatible serial port) driver, selected COM1 (0x3f8, 4) for the base address
    and IRQ, and disabled all driver-specific options. In the Software Configuration
    menu, we disabled all options. Then we selected Save Configuration and exit.


    LIRC is a package that allows you to decode and send IR and other signals of many
    (but not) commonly used remote controls. It includes daemons that decode the received
    signals as user space applications that allow controlling with a remote control.


    The /.configure--help command provided a long list of driver choices, as well
    as a daunting list of configuration options. For our appliance, the defaults were
    generally appropriate. We only needed to provide the location of our Linux kernel
    source tree using the --with-kernel-dir option and to specify the serial driver
