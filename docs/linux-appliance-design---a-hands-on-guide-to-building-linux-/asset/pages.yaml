    # Example 3: logmuxd and SNMP Traps


    The Simple Network Management Protocol (SNMP) is an Internet standard that is
    used to manage network devices as routers. The protocol has commands to read and
    write values (GET and SET) as well as traps, which are its equivalent to log messages.
    Network appliances are often required to send SNMP traps when specific events
    occur. This example shows how to use logmuxd to translate syslog log messages
    to SNMP traps. (SNMP and traps are covered in detail in later chapters, and you
    might want to delay going through this example until after reading those chapters.)


    The Laddie Alarm sends SNMP trap messages when the system enters or leaves an
    alarm state. To send the SNMP traps, logmuxd uses a helper application, snmtrap
    sends SNMP traps in the same logger that sends syslog messages.


    You may recall that ladd uses syslog to send logs similar to the following when
    a zone goes into alarm.


    ```

    Alarm set on zone 2, Back Door

    User alarm on zone 3, Garage

    ```


    The snmtrap commands corresponding to the above two log messages are shown below.


    ```

    snmtrap -v2 -c public snmp_mgr:162 '''' ladAlarm ladTrapZoneId \

    i 2 laddTrapZoneName s "Back Door"

    snmtrap -v2 -c public snmp_mgr:162 '''' ladTestAlarm laddTrapZoneId \

    i 3 laddTrapZoneName s "Garage"

    ```'
