- img_proc: true
  md: '# WHERE


    A WHERE clause specifies which rows to select or update, based on the data in
    the rows. WHERE might be the single biggest reason to use SQL. The form of the
    WHERE clause is:


    ```

    col_name rel_op_value [AND col_name_rel_op_value ...]

    ```


    The supported comparison operators are equality, inequality, greater than, less
    than, greater than equal to, and less than equal to. Only logical AND is available
    to link column comparisons, and value must refer to a literal value. For example:


    # LIMIT


    The LIMIT clause can limit the number of rows selected to limit rows, and can
    specify that the first OFFSET rows are ignored. The form of the LIMIT clause is:


    ```

    [LIMIT limit [OFFSET offset]]

    ```


    Normal SQL does not support the idea of "give me only the third row," but this
    functionality is important if you''re trying to manage an enabled application.
    The LIMIT and OFFSET clauses let you specify exactly how many rows should be returned
    and how many candidates to ignore before starting to read or write. If there is
    a WHERE clause, the LIMIT and OFFSET apply only to the rows that match the WHERE
    conditions.


    ```

    UPDATE ztable zname = "Front Door" LIMIT 2

    UPDATE ztable zname = "Back Door" LIMIT 3 OFFSET 2

    UPDATE ztable zalarm = 1 LIMIT 2 OFFSET 1

    SELECT FROM ztable LIMIT 4

    UPDATE ztable zname = "Garage" LIMIT 1 OFFSET 2

    SELECT * FROM WHERE ztable zalarm = 1 LIMIT 1

    ```


    > NOTE A great way to step through a table row at a time is to set LIMIT to 1
    and increment OFFSET from 0 up to one less than the number of rows.


    You may remember that we said that we were RTA_DISKS columns in the save file
    you gave in the table definition, and that we wanted to store the configuration
    as SQL commands so that we could run it through the SQL parser. You can see a
    good example of the LIMIT clause and of save files looking at /tmp/zsave.sql.'
