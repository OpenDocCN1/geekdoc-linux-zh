  md: '# Laddie Front Panel UI


    In earlier sections of this chapter we reviewed the requirements, operations,
    and hardware for the Laddie front panel. In this section we look at the software
    that implements the front panel UI. We''ll break our discussion into three areas:
    the software for the front panel, the various front panel emulators, and the software
    architecture common to both. Let''s start with the common architecture.


    # UI Software Architecture


    The front panel software uses an event-driven state machine. Events include button
    presses, the expiration of a timer, and arriving log messages that indicate a
    possible change of state in the alarm system. Output from the program includes
    SQL commands sent to the Laddie daemon, a flag to flash (or not flash) the LED,
    and the text displayed on the LCD.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_187_0.png)


    Figure 10-10: Laddie front panel architecture


    Several states are used. The primary state variable, unimaginatively indicates
    the type of information displayed on the LCD: status, log, or menu. There are
    also states for the brief Command Send message and for an indication that the
    program could not open an SQL connection to the ladd daemon. Another state variable,
    Curcmd, contains an integer that cycles through the menu. The Command button cycles
    Curcmd through the five possible front panel commands. The Zone state variable
    holds the number for the current command. The Zone button cycles through the five
    possible zone numbers.


    | Events | States | Curcmd | Zones |

    |---|---|---||

    | Button "Display" | Status | Clear All Alarms | 1 |

    | Button "Command" | Logs | Clear Zone n | 2 |

    | Button "Zone" | Menu | Test Zone n | 3 |

    | Button "Enter" | Command Sent | Enable Zone n | 4 |

    | Log Message Arrival | Unavailable | Disable Zone n | 5 |

    | Timer Expiration | | | |


    Figure 10-11: Events and states in the front panel menu system


    The code to handle the state and event processing is easy to read once you''ve
    reviewed the operation of the front panel. The state machine'
