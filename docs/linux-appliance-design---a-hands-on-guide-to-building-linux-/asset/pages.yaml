  md: '# rta_tables


    The rta_tables metatable is a collection of table definition structures. In order
    to add a table into RTA, you had to fill in a data structure with a description
    of your table. The collection of table definition structures is itself a table
    in RTA. This is one of the RTA metables.


    ```

    # select name, address, rowlen, ncol from rta_tables;

    name | address | rowlen | ncol

    rta_tables | 0 | 40 | 5 | 10

    rta_columns | 0 | 36 | 5 | 9

    rta_dbg | 1073986432 | 48 | 1 | 8

    rta_stat | 1073988768 | 48 | 1 | 6

    tzable | 134517280 | 28 | 5 | 3

    (5 rows)

    ```


    The RTA metables have zero in the address field because they actually an array
    of pointers, so they use an iterator function. All of the columns in the metables
    are marked read-only, since all of the values are set from the rta_add_table()
    call.


    # rta_columns


    The rta_columns metatable is a collection of column definitions. All of the column
    definitions from all of the tables are collected into the rta_columns table. (The
    table actually holds pointers to the COLDEF structures.) We can see what columns
    are in a table using the metables and the WHERE clause.


    ```

    # SELECT table, name FROM rta_columns table = ztable;

    table | zname

    ztable | address

    ztable | zalarm

    ztable | zcount

    (3 rows)

    ```


    What do you suppose we would get if we combined the RTA metables with PHP? Read
    on.


