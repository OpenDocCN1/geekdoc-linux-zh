- img_proc: true
  md: '# Defining Application


    The *defining application* in the diagram refers to the daemon that provides the
    unique function offered by the appliance. For example, the defining application
    for an advanced telephone answering machine is the daemon that answers the phone
    and records the call.


    # Logging Daemon


    The *logging daemon* shown in Figure 1-2 collects log messages and either saves
    them to disk or routes them to another host on the network. The syslog daemon
    is the default logging daemon on most Linux systems.


    # Event Handler


    The *event handler* provides a local, active response to events. Often the logging
    daemon and the event-handling daemon are one in the same, as they are in the logmuxd
    daemon that runs on our sample appliance.


    # Security Monitor


    The *security monitor* controls access to critical configuration or resources,
    such as identification and authentication credentials. The security monitor should
    also respond to Mandatory Access Control (MAC) violations.


    # Hardware Monitor


    The *hardware monitor* watches for temperature alarms and disk drive problems.
    Most PC-based Linux appliances use the *la_sensors* package to monitor CPU and
    motherboard sensors and the smart daemon to monitor the temperature and error
    statistics on hard disks. A hardware monitor might combine the information from
    these and other sources into a comprehensive report of the health of the appliance.


    # User Interfaces


    When we started building Linux appliances we thought that the nature of the appliance
    defined the type of UI it would have. But, we were wrong. Customers always ask
    for more than one way to manage the device. Smartphones need a *framebuffer interface*
    and *a web interface* over Bluetooth. Network appliances need a *web interface*
    and *an* SNMP interface. When you look at Figure 1-2, don''t think “Which one?”
    “How many?


    The UIs depicted in Figure 1-2 are not the only possible choices. For example,
    you might want an interface that runs natively on a Windows PC, or if you''re
    building a network appliance, you may want to add interfaces to an LDAP or RADIUS
    authentication server or to the network''s billing system. Figure 1-2 shows the
    most common UIs and the ones described in the book.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Web Interface


    A web interface is mandatory if your appliance has a network interface. You''ll
    have a lot to decide here: Do you use JavaScript or not? Is the back end written
    in Perl, PHP, C, or Java? Which do you use? Do you presume all browsers support
    cascading style sheets? Chapter 8 on web UIs will help you evaluate the trade-offs
    for all these issues.


    # Framebuffer Interface


    Framebuffer interfaces are popular for television set-top boxes, such as TiVo
    or a PVR, stand-alone kiosks, and handheld devices. The hardware in a framebuffer
    gives you direct control over each pixel on the screen. This gives you great flexibility
    in what your interface looks like, but at the cost of burdening you with managing
    every pixel on screen. Some libraries and graphics toolsets, such as the Simple
    DirectMedia Layer (SDL) can help. The art in building a framebuffer interface
    is choosing the right.


    # Front Panel


    Front panel interfaces, whether simple or complex, appear on all Linux appliances.
    A simple front panel might have only a few lights and buttons, while a more complex
    one might have an alphanumeric liquid crystal display (LCD) or a vacuum fluorescent
    display. Even a simple front panel may require a deep understanding of the underlying
    hardware.


    # SNMP Interface


    We have heard it that an SNMP interface makes the difference between a commercially
    viable network appliance and a hobby. We''d have to agree. SNMP is not too difficult
    if you break it into pieces. First, you need to familiarize yourself with the
    concepts used in SNMP and with the SNMP commands available in Linux. Then you
    need to design a Management Information Base (MIB), or schema, for the data made
    visible by your SNMP interface. Finally, you need to write the software that makes
    the MIB available to the SNMP commands.


    # Command Line Interfaces


    Command line interfaces (CLIs) are often used as the control interface of last
    resort for network appliances. A CLI on a serial port remains available even when
    the entire network is down. CLIs also find use as an appliance-specific scripting
    language.


    # Interprocess Communication


    Finally, you may noticed the full-mesh interconnect of lines in Figure 1-2. Don''t
    let it intimidate you. Our point is that any UI should be able to connect to any
    daemon. This requirement dictates a lot of the features to look for in the interprocess
    communication (IPC) mechanism used between the UIs and the daemons. (We''ll have
    more to say about this in Chapter 2.)'
  merge: -1
