  md: '# 12


    # # INFRARED REMOTE CONTROL


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_220_0.png)


    Remotes have become our most natural means of controlling certain appliances,
    and if you''re like us, you''ll occasionally spend several minutes trying to locate
    a remote control rather than trying to engage some device''s obscure front panel.
    In the future, we expect to see more appliances forfeiting the front panel altogether
    in favor of the keypad of a simple remote. It''s a rule of thumb. If you are building
    an appliance that might be enjoyed by people while they are sitting on a couch,
    include a remote control.


    In this chapter we will cover the following topics:


    +   - Communicating with infrared light

    - Hardware for remote control receivers

    - Installing and configuring LIRC for the Laddie appliance'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Communicating with Infrared Light


    The infrared (IR) light used by remote controls has a wavelength close to, but
    greater than, visible light. Because it''s close to visible light, it travels
    in straight lines and reflects off of surfaces, but it doesn''t go through opaque
    objects. This limits the applications for which IR is useful. It''s good for controlling
    a set-top box, but not good for opening a garage door, if there''s a solid wall
    between the transmitter and the receiver.


    For the most part, the fact that IR is invisible is a good thing. It may be harder
    to debug something that''s invisible, but when you''re watching the late-night
    movie on your new Linux-based DVR, it''s nice to know you can turn down the volume
    without shining light onto the screen.


    If wish you could see the light from a remote control, perhaps verify that a unit
    isn''t broken, you can look at it using a cell phone camera. These cameras are
    sensitive to infrared, and on camera weve experimented with, they display this
    "color" as bright white.


    # Protocols for Encoding Remote Control Commands


    In order to transfer information, a remote control transmitter and its receiver
    must use the same standard or protocol for encoding commands. A remote control
    protocol specifies the following three things:


    +   - How it represents ones and zeros

    - How these ones and zeros are combined or framed to form messages

    - How these different messages are to be interpreted


    Companies that build remote-controlled devices don''t generally publish their
    protocols, but it''s not hard to reverse engineer the basic commands, and the
    Internet has plenty of information from people who have done just that. As an
    example, we''ll consider a protocol Sony used for some of its televisions. If
    you do research on the Internet, you might see this protocol referred to as the
    Sony Integrated Control System (SIRCS) protocol. We chose to use this protocol
    for the Laddie appliance because the protocol was easy to understand. It is easy
    to produce: We purchased a universal remote (RCA RCU410) and programmed it to
    "Sony TV" (Code 002).


    This Sony TV protocol uses pulsed-code encoding. With encoding, it is represented
    as a variable-width pulse, or presence of light, followed by a constant-width
    space, or absence of light. Based on our own timing measurements with our handheld
    remote, a zero has a 650-microsecond pulse, a one has a 1,300-microsecond pulse,
    and each is followed by a 500-microsecond space. These encodings are illustrated
    in Figure 12-1.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Figure 12-1: Zeros and ones in the Sony TV protocol


    A frame in the Sony TV protocol (again, as measured for our particular remote)
    begins with a header consisting of a single 2,500-microsecond pulse followed by
    a 500-microsecond space. A seven-bit command immediately follows the header, and
    a five-bit address follows the command. Both the command and the address are transmitted
    with the least-significant bit (lsb) first. Figure 12-2 shows the waveform for
    the TV/Volume– command.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_222_0.png)


    # Figure 12-2: The TV/Volume– command in the Sony TV protocol


    The address specifies a device (in our case, always 0x01 for TV), and the command
    specifies the input to that device. Table 12-1 lists some of command codes for
    the Sony TV protocol.


    # Table 12-1: Device Addresses and Command Codes in the Sony TV Protocol


    | Command code | Command |

    |---|---|

    | 0x0–0x09 | 1–9, 0 |

    | 0x10 | Channel+ |

    | 0x11 | Channel– |

    | 0x12 | Volume+ |

    | 0x13 | Volume– |

    | 0x15 | Power |


    For the Laddie application, we use the commands Channel+, Channel–, Volume+, and
    Power. Of course, the Laddie doesn’t really have channels or volume levels; we
    have simply chosen these as convenient inputs for the framebuffer menu navigation.


    There are many other remote control protocols, and each represents a set of engineering
    trade-offs. For example, Panasonic’s REC-80 protocol uses constant-width pulses
    and encodes zeros and ones by the length of the'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'between pulses. This approach can lead to longer battery life because it minimizes
    the amount of time the remote spends emitting light. Other protocols save battery
    life by transmitting a short “Repeat” command when the button is held down, rather
    than repeatedly transmitting the entire command, as the Sony TV protocol does.


    **NOTE** To learn about some of these other protocols, visit http://sbprojects.com/knowledge/ir/ir.htm.


    # Reducing Interference by Modulating the Infrared Signal


    So far, we''ve treated infrared pulses as if they corresponded to steady beams
    of light. But consider Figure 12-2, and suppose that some flickering bulb were
    to generate pulses of IR that overlapped some of the spaces in a message. Clearly,
    such interference could make it impossible for a receiver to correctly interpret
    the message. The solution is to modulate the IR light. In a modulated pulse, the
    IR light is actually turning on and off at a fixed frequency, typically between
    30 and 60 kHz (kilohertz). Like picking out a voice in a crowded room, the receiver
    can use this frequency as a signature to discriminate the intended signal from
    the background noise. Because of this modulation, the pulse-coded zeros and ones
    of the Sony TV protocol are more accurately depicted as in Figure 12-3.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_223_0.png)


    Figure 12-3: Modulated pulses in the Sony TV protocol


    We measured the modulation frequency for our remote as roughly 40 kHz. Thus, for
    our remote, the zero “pulse” in Figure 12-3 actually consists of 40,000 * 0.00650
    = 26 shorter pulses.


    # Controlling an Appliance with Infrared Light


    Now that we''ve seen how infrared light can convey information, we can design
    a system for implementing remote control of an application. Figure 12-4 illustrates
    such a system.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_223_1.png)


    Figure 12-4: A complete remote control system'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'On the transmitting side, a typical handheld remote control performs the following
    steps:


    +   1. It scans a *keypad*.

    2. It *encodes* the input as the waveform according to some protocol.

    3. It *modulates* this encoding with a frequency between 30 and 60 kHz.

    4. It emits a radiating pattern of infrared light.


    On the receiving side, a typical IR receiver performs the following stages:


    +   5. An infrared *detector* converts the input signal to a voltage waveform.

    6. A *demodulator* removes the 30 to 60 kHz modulation.

    7. A *decoder* analyzes this waveform and determines the corresponding command.

    8. An *application* responds appropriately to this input.


    # ## Hardware for Remote Control


    In this section we''ll focus on IR receiver hardware. Designing remote control
    transmitters is beyond the scope of this chapter, but our recommendation is to
    take the same approach we took with the Laddie appliance: Use an off-the-shelf,
    universal remote.


    # ### Detecting and Demodulating the IR Signal


    The two stages of detecting and demodulating an IR input can be handled by a single,
    commercial, off-the-shelf component. Figure 12-5 shows three examples of this
    part, all produced by Sharp Microelectronics.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_224_0.png)


    Figure 12-5: Infrared detector/demodulators'
  merge: -1
