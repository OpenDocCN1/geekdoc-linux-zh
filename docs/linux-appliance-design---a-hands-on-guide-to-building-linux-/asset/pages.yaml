    Figure 8-6: An annotated error responsiveness with Ajax


    # Improving Responsiveness with Ajax


    Ajax (Asynchronous JavaScript and XML) is a set of technologies that enables partial
    updates of web pages. Because only parts of a web page are refreshed, the update
    occurs more quickly than it would if the entire web page was refreshed. Furthermore,
    the partial update may be triggered by user events like mouse clicks and key presses.
    This behavior makes the UI more responsive than that of a traditional web page.


    For example, Gmail, Google''s email service, uses Ajax. When you compose an email
    and start typing the name of a contact, the browser responds to every key, reducing
    the list of matches as you type. The responsiveness is impressive.'
