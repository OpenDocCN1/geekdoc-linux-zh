  md: 'This code snippet instructs the browser to send a HTTP GET request with the
    URL wait_for_status.php. It also instructs the browser to invoke the callback
    function GotStatus() when a response is received from the server.


    # Server Blocks Waiting for Alarm State Change


    On the server side, the script wait_for_status.php is invoked. This script does
    a blocking read on port 4444 at event ➮. Whenever there is a change in alarm state
    at event ➋, the logmux daemon writes a message to port 4444 at event ➒. The contents
    of what is written to the PHP thread are unimportant; what is important is that
    the message unblocks the PHP thread at event 18.


    Notice in the code above that curr_id is sent with the URL. This variable prevents
    the browser from losing log events when the events come too quickly. This variable
    is passed like a token between the server and the browser, and it increases in
    lock-step with the number of log events. If the curr_id value from the browser
    does not match the number of log events on the server, the PHP thread skips blocking
    on port 4444. This way, if there are new log events during the time interval that
    the PHP thread is not blocking on port 4444, the thread will continue.


    # Server Sends Alarm State as XML


    Once the reading is done, the PHP script reads the alarm status from the ladder
    daemon (at event ➅), and combines the data into an XML document. The server then
    passes this XML document to the browser (at event ❗). An example XML document
    looks like this:


    ```

    <?xml version="1.0" ?>

    <laddie_status>

    <zone id="1" name="Front Door" enabled="1\></zone>

    <zone id="2" name="Back Door" enabled="0\></zone>

