    <zone id="4" name="Motion Detector" enabled="0\></zone>

    <zone id="5" name="Smoke Detector" enabled="0\></zone>

    <logcount>294</logcount>

    <log>2005-11-11 06:23:54 Alarm system status: safe</log>

    <log>2005-11-11 06:23:54 User cleared alarm on zone 4, Motion Detector</log>

    <log>2005-10-28 09:29:11 User cleared alarm on zone 1, Front Door</log>

