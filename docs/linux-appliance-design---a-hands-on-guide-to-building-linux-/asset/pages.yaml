  md: 'Before we dive into the details, let''s start with a quick, bottom-to-top tour
    and explain how the LIRC receiver controls the Laddie appliance''s frame-buffer
    UI, which is described in Chapter 11. The IR receiver external hardware provides
    the remote control waveform to the DCD of a serial port. In kernel space, the
    lirc_serial device driver (one of many included in the LIRC package) monitors
    this and produces a binary stream of timing data from the /dev/lirc. In user space,
    the lirc daemon manages the timing data from the /dev/lirc device file to provide
    a sequence of command strings over the Unix socket /dev/lirc. The framebuffer
    connects directly to this socket in order to respond to user input.


    Now for all the details we left out. In this section, we will look more carefuly
    at each of the layers of the LIRC software architecture.


    # Configuring the lirc_serial Kernel Device Driver


    The lirc_serial device driver is actually implemented by two kernel modules, lirc_serial.ko
    and lirc_dev.ko, which were placed in the directory /lib/modules/2.6.10/misc/
    when we installed the software. In order to use these modules, we had perform
    three additional steps: free up a serial port, create a device file, and load
    the modules into the kernel. We will review the steps here; you can see the complete
    code on the CD in /etc/rc.d/init.directory.


    # Free Up a Serial Port


    For the Laddie appliance''s IR receiver input port, we choose COM1 (/dev/tty50).
    The Linux kernel enables COM1 through COM4 as serial ports at startup; thus, we
    needed to free up COM1 for LIRC. To do this, we used the setserial command:


    ```

    setserial /dev/tty50 uart none

    ```


    By setting the type of the hardware (the UART) to none, this command disabled
    the specified port.


    UART stands for Universal Asynchronous Receiver Transmitter. A UART handles the
    low-level implementation of a serial link so that the CPU need only be concerned
    with providing bytes to transmit and processing bytes that are received.


    For the remainder of this chapter, we recommend that you boot the Laddie appliance
    using the Laddie CD and follow along with the exercises. After booting the CD,
    exit the framebuffer UI (press ESC), and log in as root with an empty password.
    Verify that port COM1 was configured properly by executing the following command
    at the laddie:-# prompt:


    ```

    laddie:~# setserial /dev/tty50

    ```'
