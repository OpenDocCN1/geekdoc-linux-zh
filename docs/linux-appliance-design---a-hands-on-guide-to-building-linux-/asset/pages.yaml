    # Introduction to RTA''s Built-in Tables


    The RTA library has several built-tables. Appendix A has the full details, so
    we will introduce them here. The first table has only one row.


    # rta_dbg


    The rta_dbg table lets you control how and what is logged. You can turn on tracing
    of all SQL by setting trace to 1, and you can direct log messages to neither,
    syslog, stderr, or both by setting target to 0, 1, 2, or 3, respectively. You
    can also specify the priority, facility, and ident values for syslog().


    ```

    # select * from rta_dbg;

    nsyserr | rtaerr | sqlerr | trace | target | priority | facility | ident

    +------+------+------+------+------+------+------+------+

    1 | 1 | 1 | 0 | 1 | 3 | 8 | rta

    (1 row)

    ```


    # rta_stat


    The rta_stat table holds statistics related to the calls into RTA. It contains
    counts of the different types of errors, how many connections have opened into
    RTA, and the number of SELECTs and UPDATES.


    ```

    # select * from rta_stat;

    nsyserr | nrtaerr | sqlerr | nauth | nselect | npdate

    +------+------+------+------+------+------+

    0 | 0 | 1 | 3 | 6 | 7

    (1 row)

    ```'
