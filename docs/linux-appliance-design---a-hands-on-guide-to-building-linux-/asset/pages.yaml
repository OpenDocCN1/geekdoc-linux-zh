  md: 'than one color; these bicolor LEDs are great for a go-or-no status indication.
    Consider using a bezel or a diffuser if your application requires that the LED
    be easily visible. In our alarm application, we use a bright LED with a bezel
    so that it is easy to see when the system is alarm.


    Usually, Each LED uses one output line from your hardware. If you have a lot of
    LEDs (such as the 28 segments in a four-digit, seven-segment display on a digital
    clock, for example), you can scan the LEDs similarly to how you would scan a keypad,
    as described above. If you need LEDs, especially if they are seven-segment displays,
    you should use a device driver to manage the scan timing.


    The human eye is drawn toward movement, and you can use this to your advantage
    in your front panel design. A flashing LED attracts more attention than a static
    one. Color can also give meaning to an LED, but color blindness and the various
    cultural associations of colors make it a good idea to not rely heavily on color
    to convey meaning.


    Some popular vendors for LEDs and LCD hardware include:


    +   * Digi-Key, Inc. (http://www.digikey.com)

    * Jameco Electronics, Inc. (http://www.jameco.com)

