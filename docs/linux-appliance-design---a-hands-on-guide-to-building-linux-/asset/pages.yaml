  md: '# 6

    LOGGING


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_100_0.png)


    A log message is an asynchronous report of an event of interest. This chapter
    discusses logging in general and then looks in some detail at syslog, the default
    logging system on Linux. We also describe how to control logging thresholds while
    a daemon is running.


    We''ve organized this chapter into the following sections:


    +   - Do You Need Logging?

    - Architecture of a Logging System

    - syslog

    - On-Demand Logging


    # Do You Need Logging?


    Before getting into the mechanics of logging, let''s discuss why you might want
    logging on your appliance.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Uptime


    The number reason for logging is to increase the system availability of your appliance.
    Proper routing and displaying of log messages like CPU fan speed below 1000 RPM
    can help your users keep their systems up and running. A regression or trend analysis
    of the system''s collected log messages can identify problems before they interrupt
    service. Trend analysis is particularly useful in spotting problems with fans,
    disks, and power supplies.


    # Security


    If your appliance is on a network, it will almost certainly come under attack
    at some point. You can use log messages to trigger changes in the firewall rules
    or to notify the system operator or the end user that is under attack.


    # Debug


    The first step in fixing a bug is recognizing that a bug exists. Log messages
    report any inconsistency in input or output of a subroutine are invaluable for
    finding bugs. You can use the on-demand logging later in this chapter to trace
    program execution and record subroutine inputs and outputs when a bug is detected.


    # Integral to the application


    Laddie is a good example of an application with integrated logging and event processing.
    It simplified our design of the ladd daemon to have to report all transitions
    using only a log message.


    You may be unable to use logging on deeply embedded Linux systems with limited
    connectivity and limited disk space. But for most systems, logging will be a real
    asset for your appliance.


    # Architecture of a Logging System


    This section describes the architecture and properties of an “ideal” logging system.
    The next section describes syslog and compares it to the ideal presented below.


    A logging system can be divided into three major sections: to collect log messages,
    to route them, and to deliver them (or to start other actions). Figure 6-1 illustrates
    the architecture of a logging system.


    Let''s consider each of these three sections in more detail.


    # Message Sources


    The ideal logging system is a clearing house for messages from anywhere on the
    appliance, and it should be able to accept messages from many sources, including
    Unix sockets, UDP and TCP sockets, named pipes, and from following a file (the
    output of tail -).'
  merge: -1
  pgno: 101
- img_proc: true
  md: '![](img/ab18faa434b6e1e10df0a92984bf70fc_102_0.png)


    Figure 6-1: Log message flow in an appliance


    The source code of the logging system should be well documented and modular to
    make it easy to add new types of message sources. The configuration of the system
    should make it easy to add new message sources while the system is running.


    Let''s discuss three common message sources in a little more detail.


    # Unix sockets


    Syslog, the most popular logging system on Linux, uses a Unix socket as its message
    collection point. Stream-oriented communication channels, such as a Unix socket,
    must have a delimiter to separate the messages. The two most common delimiters
    are a null character, which syslog uses, and a carriage return.


    # Network sockets


    # Following a file


    Many applications write log messages directly to a file. If you want to capture
    the events reported in these log messages, you must watch the file for new messages.
    The tail -f command does this. Most often, you''ll see them with this command
    string:


    ```

    tail -f app_log_file | logger

    ```


    It is a waste to create two processes just to capture an application''s log messages,
    and a good logging system should handle following a file as part of its core functionality.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Message Routing


    The routing section identifies the appropriate destinations for each message.
    The routing criteria vary from one system to another, but most systems include
    the ability to route based on event importance and source programs (as mail, cron,
    kernel, and authentication). Some systems include filters that recognize and route
    based on the text in the log message.

    In this chapter, we define a filter as a set of routing rules and the destination
    associated with each rule. The routing rules and their associated destinations
    are stored in a configuration file (or, in the case of Laddie, in an RTA table).
    Filters only make sense if the system supports (and you use) multiple message
    destinations.


    # Message Destinations


    A logging system finishes processing a message by sending it to a destination.
    Common destinations are discussed below. While the following list of message destinations
    may be quite long, there are in many possible destinations not described.


    # Files


    Files are the most common destination for log messages. Log files are the accepted
    norm, perhaps because they are so easy to access for periodic-posting analysis.
    Unfortunately, files pose a problem for many embedded systems that do not have
    hard disks: RAM is volatile, and flash memory is too expensive to use for archiving
    log. Your choices for a diskless appliance are to filter messages heavily and
    only save a few to logs, send them to a server on the network, or to just not
    save messages.


    If you log messages to a file, you can use logrotate to periodically remove the
    old file, rotate the new file into a numbered archive, and send a SIGHUP to the
    process that is the source of the messages. A SIGHUP should cause the application
    to open a new file.


    # Named pipes


    Named pipes are an easy way to filter log messages to another program. A helper
    application opens the named pipe for reading and blocks while waiting for log
    messages to arrive. When the logging system has a message to send, it writes the
    message to the named pipe, unblocking the helper application. Make sure your helper
    application can handle "broken pipe" errors, since they can occur if the logging
    system is restarted.


    Named pipes and helper applications are very useful for destinations that are
    too big or too complex for inclusion in the logging daemon itself. A named pipe
    is a great way to tie the logging system to a custom application that is specific
    to your appliance.


    One alternative to a named pipe is a fanout device, a kernel module and associated
    /dev entries that act as a one-to-many multiplexer. Unlike named pipes, fanout
    devices let many readers get the same message'
