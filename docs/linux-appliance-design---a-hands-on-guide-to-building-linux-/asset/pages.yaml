    \ One way to avoid switch bounce is to scan the keypad more slowly, but slowing\
    \ the scan too much can make the keypad more responsive and avoid switch bounce\
    \ by keeping a history of the last few scan values and reporting a new closure\
    \ only when the saved values are same but different from the current value. This\
