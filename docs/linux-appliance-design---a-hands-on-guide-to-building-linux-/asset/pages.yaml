    # Considering Memory Requirements


    If memory is not a factor in your appliance, the Apache webserver would be a good
    choice. The advantage of Apache is its mature feature set, development tools (like
    Zend Studio), and an active development community.


    If memory is at a premium, the BusyBox webserver might be a good choice; it has
    the smallest virtual memory requirements of the webservers tested. The GoPro webserver
    has the next smallest memory requirements; however, the disadvantage of GoPro
    is that it Active Server Pages, a Microsoft technology, rather than PHP, an open
    source technology. (You can run PHP scripts in GoPro using the CGI mechanism,
    but it isn''t as seamless as using a webserver with a built-in PHP interpreter.)


    # Considering Response Time


    The three webservers in terms of response time are httpd, Apache, and lighttpd.
    Both httpd and Apache get their speed from running PHP scripts in the same process
    as the webserver itself, which avoids the in-process communication used by the
    other webservers. The lighttpd webserver has the disadvantage that it only services
    one request at a time, so it will block sequential requests until previous requests
    have been completed. This behavior may be fine for some web pages, but it will
    be a problem if the web page is written to block requests for a certain length
    of time, or to block a state change. One of the Laddie web pages block for a state
    change, and so this web page uses httpd webserver for the Laddie application.
    (We will discuss this particular web page in the section “Asynchronous Updates
    Using Ajax” on page 125.)'
