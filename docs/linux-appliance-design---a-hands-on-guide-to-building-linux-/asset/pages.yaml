  md: 'When a desired video mode is unavailable, SDL will emulate it; however, we
    will keep things simple and choose a mode that works natively with most graphics
    adapters: 640 by 480, The final argument to SDL_SetVideoMode flags for features
    such as whether to use video or system memory, whether to support double buffering,
    and whether to support OpenGL. For our purposes, the defaults are fine. The return
    value, has type SDL_Surface. These surfaces represent rectangular containers of
    pixels and are characterized by height, width, pixel format, scanline length,
    a clipping rectangle, and, of course, the actual pixel data. The Screen is special,
    since it corresponds directly to the displayed memory. But surfaces can also represent
    any graphical object, such as an image or a piece of text. For the examples in
    this chapter, we will create graphical objects from bitmaps or by rendering text,
    but it is also possible to create an empty surface and then manipulate its pixel
    data directly.


