  md: 'forms. GUI toolkits support GUI development by providing a collection of these
    objects (widgets). Figure 11-9 illustrates the relationships between a widget,
    a user, and the underlying application.


    User Input


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_209_0.png)


    Figure 11-9: A typical, full-featured widget


    User input events (e.g., mouse movements or keypresses), update the widget and
    control the underlying application by initiating callbacks. The application can
    control the widget or exchange data with it by calling the widget''s functions.


    In addition to providing widgets, a GUI toolkit provides a framework for managing
    them. The framework is typically built on top of a window manager. It routes events,
    determines which widget has focus, and ensures that overlapping widgets are displayed
    appropriately.


    The two most popular GUI toolkits for Linux are GTK+(http://www.gtk.org) and Qt
    (http://www.rolltech.com); if you choose one of them, your decision will probably
    come down to cost and licensing. GTK+ is released under the more liberal LGPL
    license, allowing you to link your proprietary software to GTK+. Libraries may
    be licensed under the GPL, but this requires that your GUI application also be
    released under the GPL. To build a proprietary application on top of Qt, you will
    need Trolltech for the commercial license.


    If your application is licensed under GPL or if money is not an object, there
    are other differences to consider. GTK+ is written in C, though it has many object-oriented
    features. Qt is written in C++. Both have a broad user base: GTK+ is the basis
    for the Gnome desktop, and Qt is the basis for the KDE desktop.


    In case you are not using X on your appliance, Qt also support for the Linux framebuffer.
    Some work has been done on a framebuffer back for GTK+ which is also released
    under the LGPL. See http://www.directfb.org/wiki/index.php/Projects/GTK_on_DirectFB
    for more information.


    The Fast Toolkit (FLTK; http://www.fltk.org) is a promising choice for a free
    GUI toolkit if you would like a smaller footprint than GTK+ but are still willing
    to adopt X. FLTK is designed for tight, statically linked applications, and its
    modified LGPL license allows static linking in proprietary applications. It is
    written in C++ and supports Windows in addition to Linux.'
