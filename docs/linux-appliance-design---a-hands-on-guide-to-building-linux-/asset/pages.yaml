  md: 'For example, a typical command over the TCP connection might be the string:


    ```

    SELECT Column_A FROM Table_A

    ```


    The command interpreter was responsible for parsing the SQL string and accessing
    the appropriate “table.” Table is in quotations because the data in the daemon
    could be represented by arbitrary data structures, and it was the responsibility
    of the SQL interpreter to make these arbitrary data structures as tables to the
    client.


    Similar to the AT control and status protocol, our configuration files were stored
    as text with SQL commands; this eliminated the need for libraries to parse XML
    or INI files.


    The best of this approach was that the data in the daemon was already stored as
    arrays of strings, so the shift to a “table” paradigm was trivially easy for the
    programmers. The limitation of this protocol was the amount of code that had to
    be developed on the user interface or client. Because the protocol was text based,
    we had to write client-side code to format and send the response. This code had
    to be rewritten for each programming language that the particular client was.
    In our case, there was significant effort required because we developed a Windows
    C++ client, a Java client, Mac OS 9 C client, and a Linux client.


    # PostgreSQL


    Our final control and status protocol overcomes the limitations of the previous
    one. It is similar to our SQL protocol in that it models the daemon’s data as
    tables in a database and it uses TCP or Unix sockets between the daemon and the
    client. The difference is that instead of a proprietary text-based protocol, it
    uses the PostgreSQL protocol. Using PostgreSQL means we can use the client-side
    PostgreSQL binding for C, Java, PHP, hash, and many others.


    All of the work of offering up a daemon''s internal data structures as database
    tables is handled by a library called Run-Time (RTA). We link our daemons with
    the RTA library, and after the daemon tell RTA about our tables, it offers them
    as PostgreSQL database tables.


    While RTA uses PostgreSQL as the control and status protocol, it is not a database.
    Rather, it uses a subset of the PostgreSQL protocol and client-side bindings as
    a means of reading and writing memory variables in a running daemon.


    PostgreSQL and RTA have several advantages as a control and status protocol. As
    mentioned, there are a number of PostgreSQL bindings available in various languages,
    including C, C++, Java, Perl, Tc, and Python. The availability of these bindings
    means that you will have less code to develop on the UI or client, so you are
    constrained in how to write your UI'
