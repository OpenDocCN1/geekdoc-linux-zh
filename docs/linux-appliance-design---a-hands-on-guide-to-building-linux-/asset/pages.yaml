- img_proc: true
  md: 'The input tag tells the browser to display a field for textual input. The name
    tag tells the browser how to name the field, the value tag tells the browser how
    to populate the initial value for the field. When the user hits Submit button,
    the names and values of all form fields are sent to the server. When the server
    receives this request, your PHP code will extract the names from the recipe and
    update the Laddie daemon.


    PHP provides a simple mechanism to extract the field values. For example, to extract
    the value for field name Name_1, you would use the following PHP code:


    ```

    $name = $_REQUEST["Name_1"];

    ```


    The _REQUEST variable is a global variable that is populated by the PHP interpreter,
    while the Name_1 string corresponds to the name of the field in the HMTL form.
    Once this statement is executed on the server, thename variable will contain the
    text that the user entered in the browser.


    For tabular forms we need to be careful about field naming because the HTML specification
    requires that all fields in a form must have a unique name. One common approach
    to naming such forms in HTML is to append a row number to the column name. For
    example, we append the row number (underscore as a separation character) to get
    Name_1 for the Name column for Zone 1.


    The PHP code to generate this web page can be found on this book''s companion
    CD in the file /opt/laddie/htdocs/web/cgi-bin/setup_alarm.php. Take a look at
    the function displayZoneForm. The PHP code that handles the web page updates is
    in the same file.


    # Page Layout and Menu System


    In this section, we''ll describe Laddie''s web page layout and menu system. This
    simple scheme is handled by two PHP files. The first file, layout.php, defines
    Laddie''s two-level menu system as a two-dimensional array (see the global variable
    menu_system on this book''s companion CD in /opt/laddie/htdocs/web/cgi-bin/layout.php)
    and it defines the function display_page(). This function refreshes the page whenever
    the user navigates to the menu. The second file, alarmstyle.css, controls color,
