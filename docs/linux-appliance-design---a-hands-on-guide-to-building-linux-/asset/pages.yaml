- img_proc: true
  md: '# MIB-2


    The part of the tree that we''re most interested in is under .1.3.6.1 (.iso.dod.internet).
    Beneath this node are the mgmt-mib-2 (.1.3.6.1.2) subtree and the private.enterprises
    (.1.3.6.1.4) subtree. MIB-2 is the common set of objects that we mentioned earlier;
    is supported by all networked devices that are manageable by SNMP. The enterprises
    OID is where organizations register their private MIBs. (For more on this, see
    Chapter 14).


    MIB-2, defined in RFC 1213, describes a core set of information that is helpful
    for managing networked devices. MIB-2 is organized into the groups shown below.
    Not all groups are shown on all networked devices, but you can generally expect
    to find most of them.


    # System


    This group contains objects such as sysDesc (a printable description of the operating
    system, hardware, networking software), contact (typically the email address of
    the person administering this system), sysLocation (a printable description of
    where the system is located), and sysObjectID (an OID that can be used to determine
    the type of device).


    # Interfaces


    This group is a table describing the network interfaces available on the system.
    The interfaces table contains information on the speed of each interface and the
    activity on the interface (octets in and out). By polling you can tell what percent
    of the bandwidth available in the interface is being used. This can help you monitor
    the capacity of routers in a network.


    # AT


    This is the Address Translation group. MIB-2 deprecates this group and includes
    it only for compatibility with devices implementing MIB-1. You should ignore this
    group unless you have a particular interest in SNMP history.


    # IP


    This group includes information related to the IP (network) layer, including ipAddrTable
    (IP Address Table), which describes the IP address of the interfaces available
    on the system.


    # ICMP


    This group includes various Internet Control Message Protocol (ICMP) statistics.


    # TCP


    This group includes various TCP layer statistics, including the tcpConnTable (TCP
    Connection Table) describing the current TCP connections between this and other
    systems in the network. This table is often used in network discovery. Once you
    have the address of this system, you can find out addresses of other systems that
    are in contact with it.


    > * Network Working Group, Request For Comments: 1213. Management Information
    Base for Network Management of TCP/IP-based networks: MIB-II. K. McCloghrie and
    M. Rose, March, 1991.'
  merge: -1
  pgno: 336
- img_proc: true
  md: "# UDP\n\nThis group includes various User Datagram Protocol (UDP) datagram\
    \ statistics.\n\n# EGP\n\nThis group contains Exterior Gateway Protocol (EGP)\
    \ statistics for those systems supporting the EGP protocol.\n\n# Transmission\n\
    \nThis group contains information related to managing transmission media.\n\n\
    # SNMP\n\nThis group includes various statistics related to the SNMP protocol,\
    \ itself.\n\n# The SMI\n\nMIBs are described using a grammar defined by the Structure\
    \ of Management Information (SMI), which is a subset of Abstract Syntax Notation\
    \ One (ASN.1). ASN.1 was created to allow description of data in a way independent\
    \ of machine architecture (for example, no assumptions about endianness or word\
    \ size). The SNMP SMI adopted a subset of the object types definable under ASN.1\
    \ and thus simplified the notation.\n\nAll you need to know about this is how\
    \ to read and write the notation to describe MIB. This is best accomplished with\
    \ minimal notation illustrated by examples. You can create a new MIB by cutting\
    \ and pasting from other MIBs.\n\n> We've attempted to keep our discussion of\
    \ MIBs as simple as possible. For more in-depth coverage, pick up a copy of Understanding\
    \ SNMP MIBs by David Perkins and Evan McGinnis (Prentice Hall, 1996).\n\nHere\
    \ is an example of an object definition using the grammar in the SMI:\n\n```\n\
    system OBJECT IDENTIFIER ::= { mib-2 1 }\nsysDescr OBJECT-TYPE\n    SYNTAX DisplayString\
    \ (SIZE (0..255))\n    ACCESS read-only\n    STATUS mandatory\n    DESCRIPTION\n\
    \        \"A textual description of the entity. This value\n        should include\
    \ the full name and version identification of the system's hardware type,\n  \
    \      software operating-system, and networking\n        software. It is mandatory\
    \ that this only contain\n        printable ASCII characters.\n::= { system 1\
    \ }\n```"
  merge: -1
