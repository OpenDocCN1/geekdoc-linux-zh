  md: '# Reliability


    Linux is sufficiently reliable to be widely used in data centers. Uptimes measured
    in years are not uncommon for Linux, and the Blue Screen of Death has never been
    a problem.


    # Quality Compilers


    The GNU Compiler Collection is a comprehensive set of compilers, assemblers, linkers,
    and debuggers that support multiple languages on multiple platforms. It is the
    compiler of choice for C and C++ development on Linux. Furthermore, it is free.
    See http://gcc.gnu.org for more information.


    # Good Documentation


    A great deal of documentation about Linux is available on the Internet. One site
    that serves as a good starting point for documentation is the Linux Documentation
    Project (see http://en.ldp.org). This site includes subject-specific HOWTOs, FAQs,
    and in-depth guides.


    # Existing Software Packages


    There are thousands of software packages available to help you develop an appliance
    on Linux. For example, there is Net-SNMP for Simple Network Management Protocol
    (SNMP) support, lm_sensors for monitoring the appliance''s hardware environment,
    and lighttpd for web support.


    # Low Development Cost


    Linux appliance programmers can typically use their desktop machines for most
    software development because appliance user interfaces and services seldom need
    to be developed on the target hardware. Therefore, software development can proceed
    in parallel, with one team developing embedded Linux for the appliance and another
    team developing the main application and user interfaces.


    # No Licensing Fees for Deployment


    Appliance manufacturers can generally build Linux-based appliances without incurring
    costs for licensing to distribute the appliance''s software, although there are
    some exceptions. For example, the Qt library from Trollht and the MySQL database
    have licenses that may require payment for commercial use.'
