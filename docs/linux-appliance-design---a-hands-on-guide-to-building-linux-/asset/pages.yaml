    We''ve limited the functionality of our UIs to make them more useful as tutorials.
    Only the web interface is full featured and representative of what a real appliance
    might have.


    # Summary


    Most Linux appliances have a common architecture: Linux on the bottom, the defining
    application on top, and common services and UIs in the middle. We discussed some
    of the reasons to include various daemons and UIs and mapped this book''s chapters
    into an architecture diagram.


    The next chapter looks at the API between the UIs and daemons, since the chosen
    API impacts both UIs and daemons.'
