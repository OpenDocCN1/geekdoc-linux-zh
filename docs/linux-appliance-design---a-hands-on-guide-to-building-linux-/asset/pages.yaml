- img_proc: true
  md: "The above array of structures could be considered a database table, with each\
    \ structure in the array as a row and each member in the structure as a column.\
    \ RTA allows you to use any programming language with a PostgreSQL binding to\
    \ query this table of TCP connections. Here are two sample SQL statements to manipulate\
    \ the data in the table:\n\n```\nSELECT l1port, dport FROM Conns WHERE fd = -1;\n\
    Update Conns SET dport = 0 WHERE fd = -1;\n```\n\nDon't worry if the statements\
    \ do not make sense; there is a short tutorial on SQL later in this appendix.\n\
    The addition of a database API offers several advantages. For one, debugging is\
    \ made easier because you can use simple PostgreSQL tools to view more of your\
    \ program's state. The PostgreSQL database API also makes it easier to build UI\
    \ programs, which includes bindings for PHP, Tcl/Tk, Perl, C, Visual C++, and\
    \ many other programming languages.\nA database API can also help up development.\
    \ When tables used by the UI programs are carefully defined, the core team can\
    \ build the application while the UI developers work on the web pages, wizards,\
    \ and MIBs of the various UI programs.\n\nIn order to make your arrays and structures\
    \ available to the database, you must RTA about the tables (including things like\
    \ the name, start address, number of rows, and length of each row) and columns\
    \ (including things like the associate table name, column name, column's data\
    \ type, and whether special functions called callbacks are to be called when the\
    \ column is read or written).\n\n# RTA Constants\n\nThere is an excerpt from the\
    \ rta.h file showing the constants that describe the internal sizes for the RTA\
    \ package. You can change these limits, but if you do, you need to recompile the\
    \ RTA package using your new settings.\n\n```\n#include <limits.h>\n/* for PATH_MAX\
    \ */\n/** Maximum number of tables allowed in the system.\n * Your database may\
    \ not contain more than this number\n * of tables. */\n#define MX_TBL (500)\n\
    /** Maximum number of columns allowed in the system.\n * Your database may not\
    \ contain more than this number\n * of columns. */\n#define MX_COL (2500)\n/**\
    \ Maximum number of characters in a column name, table\n * name, and in help.\
    \ See TBLDEF and COLDEF below. */\n#define MXCOLNAME (30)\n#define MXTBLNAME (30)\n\
    #define HELPSTR (1000)\n```"
