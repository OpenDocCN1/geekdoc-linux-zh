  md: '# MIB-2 Contents


    In SNMP, the term group refers to a subdivision of a MIB consisting of a collection
    of objects or tables that are related in some way. For example, MIB-2''s UPD and
    TCP groups are all about UDP and TCP traffic, respectively. The Net-SNMP agent
    can be built to support a variety of MIBs, but you can always expect to find the
    MIB-2 groups system, interfaces, ip, icmp, tcp, udp, and snmp. These are not all
    of the groups defined in MIB-2, but they are the ones most likely to be supported
    by any SNMP agent. Figure 13-1 shows the location of MIB-2 in the overall MIB
    address space and breaks out of the groups that comprise MIB-2. Notice the location
    of the private.enterprises branch. That''s where you can find the HP Printer MIB
    objects you saw earlier.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_257_0.png)


    Figure 13-1: MIB-2


    Try walking these groups:


    ```

    snmpwalk -c public localhost system

    snmpwalk -c public localhost interfaces

    snmpwalk -c public localhost ip

    snmpwalk -c public localhost icmp

    snmpwalk -c public localhost tcp

    snmpwalk -c public localhost udp

    snmpwalk -c public localhost snmp

    ```


    If you feel up to a challenge, try comparing the output of the above commands
    with the contents of the MIB files. The output of the snmpwalk


    > ⁶ In case you''ve forgotten, the MIB files are in the directory /usr/share/snmp/mibs.'
