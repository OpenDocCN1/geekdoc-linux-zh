  md: '# writecb()


    Write callbacks can be the real engine driving your application. If defined, the
    write callback, writecb(), is called after all columns in an UPDATE have been
    changed. Consider the following SQL command:


    ```

    UPDATE ifcfg SET addr="192.168.1.1", mask = "255.255.250.0";

    ```


    If there is a write callback on addr, it will be called after both addr and mask
    have been updated. RTA does the write callback after all the fields have updated
    in order to maintain consistency.


    Write callbacks are passed six parameters: the table name, the column name, the
    text of the UPDATE statement, a pointer to the row affected, the zero-indexed
    row, and a pointer to a copy of the row before any changes were made. (This last
    parameter is useful when you want to know both the old and new values for the
    row. The copy of the row is in dynamically allocated memory, which is freed after
    the write callback returns.) A function prototype for a write callback is shown
    below.


    ```

    int writecb(char *tbl, char *col, char *sql, void *pr, int rowid, void *poldrow);

    ```


    The write callback returns zero on success and nonzero on failure. On failure,
    the row is restored to its initial value and an SQL error, TRIGGERED ACTION, is
    returned to the client. Write callbacks allow you to enforce consistency and can
    provide security checks for your system.


    # help


    Your help text for the column should include a description of how the column is
    used, any limits or constraints on the column, and the side effects caused by
    any read or write callbacks. (Give yourself and your fellow developers meaningful
    text for your columns to make it easier to maintain and troubleshoot your code.)


    # Tables


    You RTA about each of your tables with a call to the RTA routine rta_add_table().
    The single parameter to rta_add_table() is a pointer to a TBLDEF structure that
    describes the table.


    The TBLDEF structure uses 10 pieces of information to describe your table. The
    most critical of these are the name of the table, the start address of the array
    structures, the width of each structure (that is, the width of each row), the
    number of rows, and a pointer to an array of COLDEF structures that describe the
    columns in the table. Most of the fields in the TBLDEF structure should be self-explanatory.


    ```

    typedef struct {

    char *name;    // the SQL name of the table

    void *address; // location in memory of the table

    ```'
