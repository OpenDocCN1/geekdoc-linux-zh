- img_proc: true
  md: '# Cascading NC Sensors


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_87_0.png)


    Figure 5-3: How to normally cascade closed sensors


    Logically, the alarm system sees just one sensor in each zone, even if there are
    actually several cascaded sensors there.


    # Latching a Sensor


    Most sensors return to the non-alarm or normal state when the detected condition
    is removed—for example when someone closes a door or steps off a floor mat. You
    usually want to configure the alarm system to latch alarms by these sensors. Latched
    alarms remain in alarm, even if the detected condition is removed, until they
    are manually cleared by a user.


    However, you might not want to latch every sensor. For example, you might want
    to automatically remove an alarm when the temperature in a thermostat-protected
    room returns to normal.


    Think about the type of sensor you''re using and your specific needs when you
    set alarms in a zone to be latching or non-latching.


    # Enabling a Zone


    Mark zones as enabled if the sensors in the zone are working and you want to monitor
    the zone. Unused inputs can be ignored by disabling the zone. Also, you may find
    it convenient to temporarily disable zones when you want to leave a door or window
    open.


    # Functional Specification for Laddie


    The Laddie system monitors up to five zones and raises an alarm when a change
    occurs in one of the monitored zones. Alarms are reported to Laddie''s five different
    user interfaces. In addition to being able to view the status of the zones that
    Laddie monitors, the user interfaces allow you to test and clear alarms, view
    logs, and configure zones. Configuration parameters include the following:


    +   * Zone name

    * Contact type

    * Latching or non-latching

    * Enabled or disabled'
