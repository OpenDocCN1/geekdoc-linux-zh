    We''ll start by looking at the details of front panel hardware. (If you''re uncomfortable
    with hardware or wiring diagrams, feel free to just skim this chapter.)


    # Buttons, LEDs, and LCDs


    This section introduces the kinds of hardware that you''ll find on an application''s
    front panel, including buttons, LEDs, and LCDs.


    # Buttons


    The size of your production run may determine the type of hardware you use in
    your design, especially where buttons are concerned. When your appliance is produced
    as part of a large production run, buttons will be built directly onto the printed
    circuit board. Small production runs or prototypes, on the other hand, often use
    either a pre-built switch or individual switches.


    Electrically speaking, buttons are simply switches that are, most often, normally
    open. Each button usually requires one digital input line that can be read by
    your processor. (Chapter 5 explains how you can use an input line to read the
    state of a single switch.)


    # Keypads


    A keypad is an array of buttons that is scanned for a closure. Scanning for a
    closure can reduce the total number of input and output lines needed in your hardware.
    The idea behind scanning a keypad is dividing the switches into an array of rows
    and columns and then scanning the switches one row at a time. Keypads are described
    as n-m, indicating a array of switches with n rows and m columns. Each row is
    assigned an output line and each column is assigned an input line. Sixteen switches
    arranged as a 4-by-4 keypad would use I/O lines from the CPU, not 16.


    Using a keypad becomes a viable option when you have more than five or six buttons.
    You can use a microprocessor with keyboard scanning and other hardware-based I/O,
    in a cost-sensitive application, your Linux-based code may to do all of the scanning
    and low-level I/O. Some system-on-chip processors, such as the PA270 from Marvel,
    have dedicated hardware to do keypad scanning.


    Consider the 2-by-2 keypad circuit shown in Figure 10-1. The pull-up resistors
    bias the column lines to V+, or a logic, so the two inputs will read a logic one
    when no switches are closed. The diodes on the output lines isolate one row from
    the other row. To scan the keypad, the processor puts zero (a logic zero) on row
    0 and a logic on row 1. The processor reads the input port, and if input 0 is
    a logic zero, then it knows button A (at row 0, column 0) is being pressed. If
    the input 1 is a zero, then it knows button B (at row 0, column 1) is being pressed.
    The processor then sets'
