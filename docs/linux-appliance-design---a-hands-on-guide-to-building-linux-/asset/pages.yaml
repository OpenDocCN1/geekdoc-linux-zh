  md: '# 5


    # # THE LADDIE ALARM SYSTEM:

    A SAMPLE APPLIANCE


    Previous chapters covered how to build and secure a daemon and how to communicate
    with the daemon while it is running.

    We''ll tie these topics together in this chapter by building *Laddie*, a Linux-based
    alarm system.¹


    Laddie uses the five status inputs on a standard PC parallel port as inputs to
    the alarm system. The heart of Laddie appliance the *ladd* (pronounced ladd-dee)
    daemon that polls the status lines and reports input transitions using syslog().
    An alarm system is a good choice for a sample application since most readers will
    have familiarity with alarm systems and because an alarm system application is
    simple to write, understand, and modify.


    This chapter includes the following five sections:


    +   - Introduction to alarm systems

    - A functional specification for Laddie


    > ¹Laddie is a sample appliance used to illustrate the techniques and software
    presented in this book. Laddie is not a commercially viable alarm system and should
    never be used in place of a real alarm system.'
