- img_proc: true
  md: '# Using syslog


    Almost Linux programming languages have a routine to send a syslog message. The
    C-library prototype shown below is fairly typical of most languages.


    ```

    void syslog(int priority, const char *format, ...);

    ```


    Priority is combination of the log level, the importance or severity of the event,
    and the type of program that generated the message. Most programmers specify only
    the log level when using the syslog routine. There are eight log levels, ranging
    in importance from emergency to debug. This excerpt from syslog shows the eight
    levels available.


    ```

    #define LOG_EMERG 0 /* system is unusable */

    #define LOG_ALERT 1 /* action must be taken immediately */

    #define LOG_CRIT 2 /* critical conditions */

    #define LOG_ERR 3 /* error conditions */

    #define LOG_WARNING 4 /* warning conditions */

    #define LOG_NOTICE 5 /* normal but significant condition */

    #define LOG_INFO 6 /* informational */

    #define LOG_DEBUG 7 /* debug-level messages */

    ```


    The syslog() routine uses a printf style string that can have a variable number
    of arguments. The text in the format string should form a clear, unambiguous description
    of the event, and any arguments to the format string should give further details
    of the event.


    When we build appliances, a big part of what we deliver is documentation, and
    a big of our documentation is a list of all the appliance log messages and their
    meanings. This list is easy to generate using grep on the source code. A list
    of log messages is exceptionally valuable to customers, and generating it requires
    only a little discipline on your part.


    +   Generate a list of all log messages in your appliance as part of your appliance''s
    documentation.


    You have more control over what is sent to syslog than text of the message. In
    particular, you can also use the openlog() routine to control the syslog facility,
    the message prefix, and whether or not to include the process ID with the log
    message. The openlog() calling syntax is:


    ```

    void openlog(const char *ident, int option, int facility);

    ```


    The ident is a short string that syslog prepends to each log message. If you do
    not specify one, ident defaults to the name of the program that called


    > Unfortunately, the documentation for syslog and syslog.conf are not in one agreement.
    One defines priority as the bitwise OR of facility and log level, and the other
    defines priority as what log level. While this book is self-consistent, you should
    use care when reading other syslog documentation.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'syslog(). The option parameter lets you control things such as what to if /dev/log
    is not available and whether or not to include the PID of the calling program.
    The option is the bitwise OR of zero or one of the following:


    +   - LOG_CONS—write to console on failure to write to /dev/log

    - LOG_NDELAY—open socket to /dev/log immediately

    - LOG_ODELAY—wait until first message to open socket to /dev/log

    - LOG_ERROR—write to log standard error as well as /dev/log

    - LOG_PID—include PID with each message


    The facility is meant to correspond to the type of program sending the log message.
    It defaults to LOG_USER if open() is not called. There are 24 standard facilities
    defined in syslog; the following except for the most common ones. Note that the
    values are shifted by three to keep the lower bits reserved for the log facility.


    ```

