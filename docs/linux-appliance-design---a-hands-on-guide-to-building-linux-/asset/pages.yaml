  md: '# #7


    # ## LADDIE EVENT HANDLING


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_114_0.png)


    Your appliance needs to respond when alarms or other critical events occur. Whether
    it''s CPU temperature, battery level, low disk space, or paper level, something
    is going to occur that requires action from your appliance.


    The idea of having a general purpose event-handling system is, surprisingly, not
    common in Linux. Too often the need for event handling is not apparent until the
    end of system testing of the appliance, so it is usually addressed as an afterthought
    with ad hoc and poorly integrated code.

    The authors have built enough Linux appliances to know that we should build event
    handling into the core of our design for Laddie project, we built our own event-handling
    system that uses logging to capture the events of interest. Our event-handling
    daemon is called logmuxd, and this chapter explains why we built it, describes
    its features, presents its major tables, and gives complete examples of its use.
    This chapter may be of value even if you choose not to use logmuxd, since it shows
    the kinds of processing needed for any event-aware appliance.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'This chapter discusses event handling in the context of logging, but bear in
    mind that the goal is event handling, and logging is just the mechanism used to
    reach that goal.


    We''ve organized this chapter into the following sections:


    +   - Rationale for a New Event-Handling System


    +   - Features and Capabilities of logmuxd


    +   - Configuring logmuxd


    +   - Examples Using logmuxd


    # Rationale for a New Event-Handling System


    We''ve found that the only code we''ve ever delivered on time and bug free was
    code that we did not write. That is, our most successful projects were the ones
    in which we were most able to writing new code. New code always has bugs, and
    new code is always late. Why, did we decide to write a logging daemon to event
    handling? There are really two parts to the answer: why we chose to use logging
    as the mechanism, and why we chose not to use an logging system.


    Chapter 6 explains why logging is the right mechanism for event reporting. All
    events of interest to us are already captured, or can be easily captured by, syslog
    messages. There are syslog libraries for almost every programming language, and
    syslog is well understood, fairly secure, and is both CPU and memory efficient.


    A second distinct to syslog for event handling is D-Bus, an open package offered
    to distribute desktop events. D-Bus offers libraries and an API that processes
    to exchange messages, provided that both processes are D-Bus aware. (Because of
    this, legacy applications that use syslog must be rewritten to add D-Bus support.)
    However, D-Bus does not offer the same breadth of languages that syslog offers,
    and D-Bus usually requires two running daemons, which makes it relatively RAM
    and CPU intensive (compared to syslog).


    > D-Bus comes on most Linux desktops, it''s probably inappropriate for event handling
    on most Linux appliances.


    If syslog is the event reporting, then why not use the daemon for event handling?
    The major feature that we found from the currently available logging systems was
    the ability to easily duplicate log messages and broadcast them on accepted TCP
    connections.


    The Ladder Alarm System needs to have Ladder to several running programs and UIs.
    Figure 7-1 illustrates a typical case. When an alarm occurs, ladd sends a log
    message to the report event. We need to send a copy of the resulting log message
    to every CLI that has enabled and to every web page that is looking at the system
    status. The problem is that we not know beforehand how many of these interfaces
    are open.


    Our new logging daemon, logmuxd, solves this problem by allowing to route messages
    to many destinations, even if those destinations are'
