    parallel port for input from the alarm sensors. The UIs include web, command line,
    LCD with a keypad, framebuffer with IR remote control, and SNMP.


    The daemons on our appliance include the alarm system daemon and one to respond
    to appliance events. We chose not to implement all of the daemons in Figure 1-2
    so that we could focus on describing how to build and secure daemons in detail.


