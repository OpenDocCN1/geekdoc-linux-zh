    \ knows button C (at row 1, column 0) is being pressed, and if input 1 is a zero,\
    \ then it knows button D (at row 1, column 1) is being pressed.\n\n# 2-by-2 Scanned\
    \ Keypad\n\n![](img/ab18faa434b6e1e10df0a92984bf70fc_172_0.png)\n\nFigure 10-1:\
    \ A 2-by-2 keypad\n\nHere is some simple code to scan the above keypad.\n\n```\n\
    // Scan a 2x2 keypad. Return A-D if closed, and if o no closures\n// OUT: low\
    \ two bits of I/o port 0x378, (second parallel port)\n// IN: low two bits of I/o\
    \ port 0x379\nchar scan2x() {\n    int in_state;\n    outbox(0x02, 0x378);\n \
    \   in_state = inb(0x39) & 0x03;\n    if (in_state & 0x01 == 000)\n        return('A');\n\
    \    if (in_state & 0x02 == 000)\n        return('B');\n    outbox(0x01, 0x378);\n\
    \    in_state = inb(0x39) & 0x03;\n    if (in_state & 0x01 == 000)\n        return('C');\n\
    \    if (in_state & 0x02 == 000)\n        return('D');\n\n    return(0);\n}\n\
    // state of a given row's switches\n// put 0 on row 0\n// switch state in low\
    \ two bits\n// remember: closed=0, open=1\n// look at switch on column 1\n// put\
    \ 0 on row 1\n// look at switch on column 0\n// look at switch on column 1\n//\
    \ no keys pressed\n```\n\nThis code illustrates the sequence of events fairly\
    \ well, but you'll probably want to use a loop if you are scanning more than a\
    \ few rows.\n\n# Switch Bounce\n\nIf you drop a bearing onto a steel plate, it\
    \ will bounce. Switch closures also be thought of as two metal pieces colliding\
    \ with each other. Switch contacts bounce when they are closed and when they are\
    \ opened. If you scan the keypad too quickly, you can erroneously detect a bounce\
    \ as a new closure. The duration of switch bounces depends on the physical properties"
