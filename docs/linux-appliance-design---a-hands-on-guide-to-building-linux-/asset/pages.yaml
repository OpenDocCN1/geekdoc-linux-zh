  md: '# Wizards


    A wizard is a type of interface that prompts the user with a series of questions,
    usually giving the user some descriptive text before asking the question. For
    example, the following might appear as part of a wizard configuration for Laddie.


    Type of Sensor:

    Alarm sensors come in two different types, normally closed (nc) and normally open
    (no). The switch in a normally closed sensor is closed, making electrical contact,
    while the sensor is not in an alarm state. A normally open sensor does not make
    electrical contact when in the normal, or non-alarm, state.

    Look for the sensor type on the body of the sensor or on its packaging.


    Type of Sensor: [NO, nc, q] ?


    If there is a reasonable default value, you should show it in the prompt for the
    question. The convention is to show the default in all caps. You should also give
    the user ability to abort the wizard at any point in the series of questions.
    Common sequences include q and CTRL-C. At the end of the series of questions,
    you should display a summary of the responses and ask the user to confirm that
    these are the values he she wants.


    Here is a tip to help the user and yourself. Your web interface has forms with
    fields that before filling the Submit button. If you are building a wizard, map
    the same fields from the web to the wizard. For example, if the web form for network
    configuration asks for host name, boot protocol, and default gateway, the network
    wizard should ask for host name, boot protocol, and default gateway. transfer
    training from one interface (web) to another (CLI). It also helps you because
    your back-end processing only needs to deal with one type of request, regardless
    of the source.


    Wizards are a great way to help a new or infrequent user through a configuration.
    Wizards are nice if you need a synchronous update of all the fields in the wizard.
    For example, you would probably want to change a static IP address and its associated
    atomic update.


    Since wizards are used only to collect configuration information, they are usually
    used in conjunction with one of the other types of CLIs that offer better scriptability
    and easier access to system status.


    # Menus


    A menu CLI offers the user a well-defined list of commands or choices at each
    step. For example, if we were to give Laddie a menu CLI, the top menu might look
    like this.


    +   Welcome to Laddie. Please select from the following options:

    1) View Laddie system status

    2) View recent Laddie log messages

    3) Change Laddie system configuration'
  merge: -1
  pgno: 162
- img_proc: true
  md: '+   4) Help

    5) Quit

    [1-5] :


    Selecting one item in the menu might prompt the user with a sub-menu

    drop him into a wizard to collect configuration information.


    Menu CLIs have fallen from favor but remain the right choice if you

    ire your CLI to be used frequently or by untrained users.

    practically no learning curve to use a menu CLI.


    Menu CLIs can be scripted, but the scripts are fragile since they can be

    bro by even a small change to the menu layout.


    # Stateful


    Stateful CLIs maintain a sense of where the user is. For example, bash is

    ful that it supports a current working directory with the cd verb to

    manipulate its state. Another example of a stateful CLI is the help

    system in the graphics package most. However, statefulness may be more

    accurately described as a property of CLIs rather than a separate type of

    them, since wizard, menu, and sentence CLIs can all be stateful.


    Stateful CLIs are nice if you expect your users to spend a lot of time in

    your CLI. They help the user by presenting context-sensitive help (i.e., help

    based on state or location) and by reducing much typing the user has

    to.


    Stateful CLIs require more documentation and training to explain the

    states and state manipulation, and they can be a little tricky in scripts since

    is easy to set the state as part of the script. (Many of us have

    forgotten to put a cd at the top of a bash script?)


    # Character vs. Line Interfaces


    A term coming into popular usage is character interface, which refers to an

    interface that looks at each character as it is entered. In contrast, a classic

    line interface looks at the command only when the newline is entered. The

    editor vi has a character interface, while its precursor, ed, has a CLI in the

    classic sense. Another common example of character interface is bash, with

    tab-completion and line-editing capabilities.


    Character interfaces, such as the one in vi, can greatly reduce the amount

    typing a user needs to do, and tab completion can be a great help to new

    infrequent users; however, character interfaces require a lot of work on

    the part of the interface designers and coders.


    # Giving Users Access to a CLI


    Once you have a CLI, you need to give your users access to it. One way to do

    this is let them log in and have them start the CLI from a bash prompt.

    This can make scripting easier, but few appliances allow direct access to a

    Linux login.


