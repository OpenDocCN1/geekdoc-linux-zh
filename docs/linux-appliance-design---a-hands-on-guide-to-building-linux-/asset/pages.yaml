    Here we declare three surfaces, corresponding to the three alarm states, with
    appropriate colors. We use WiconArray to build the alarm state widgets. In declaring
    a pointer to an integer value in the application interface local data structures.
    Note that the order of the alarmState surfaces corresponds to the possible values
    for LaddZones[n].state.


    To complete this UI, we have defined additional widgets to display the remaining
    data in the LaddZone alarm array and, where appropriate, to update the Laddie
    alarm with callbacks. In the "Hello, world! example, we also have to attach the
    widgets to pages and the pages to the main menu. One item we haven''t discussed
    is how to switch between pages. Fortunately, this is straightforward. The Menu
    framework provides a setCursor function for selecting a page and cursor position.
    Therefore, we switch pages by providing buttons on each page with callbacks to
    set the cursor to the opposite page.


    The event handler for the Laddie framebuffer UI is a little different than that
    of the stb_hello example. Instead of waiting on SDL events, it uses a select system
