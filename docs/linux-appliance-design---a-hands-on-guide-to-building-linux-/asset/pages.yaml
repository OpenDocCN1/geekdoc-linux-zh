- img_proc: true
  md: 'Where appliances are concerned, the term user interface (UI) refers to an interface
    through which the user manages the appliance configuration and views its statistics
    and analytics. The lack of a screen and keyboard is hallmarks of an appliance,
    but do not let that you fool—all appliances have UI. To be sure, the more visible
    the UI the better the appliance, but the UI is always nonetheless, network appliances
    have web, SNMP, and command line interfaces, while consumer appliances have framebuffers
