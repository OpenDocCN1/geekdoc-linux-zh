    /var/log/snmpd.log

    /var/net-snmp

    ```


    The first line must be blank because the configure script asks us to hit ENTER
    when we are ready to enter the input.

    The 2 selects SNMP2 as our default version of SNMP. This doesn''t really apply
    to the agent because it takes its cue from the requests received, but the Net-SNMP
    package contains the source for management applications like snmpget and snmpwalk.

    The two Not Set lines are for system config and system location (objects available
    in MIB-2). We will be overriding these values in our configuration file, so we''ll
    just set these objects to the string Not.

    The next two lines are the default log file and persistent storage locations.

    Give this a try by typing make. It will build the Net-SNMP applications (snmpget,
    snmpwalk, etc.), the libraries, and the agent. If it doesn''t work, executing
    the steps by hand, without the Makefile. First until the toolbar and drop down
    into the directory it generates. Then run /configure and answer the questions
    as we have laid out in configure.input. Check the output from configure to see
    if there is anything missing, like a library you need to install. If you don''t
    see anything wrong, type make (in the net-snmp.5.2.1 directory) and watch for
    errors. You can''t move on until this works.

    Once you get working, install Net-SNMP onto your development system. As root,
    type


    make install


