- img_proc: true
  md: 'The MAX-ACCESS clause in each of these objects defines how it may be used.
    We have made AlarmZoneId not-accessible because we will only be using it to index
    into the table to read or write the other values. Notice that ladAlarmEnable,
    ladAlarmLatch, and ladAlarmState are read-write, ladAlarmName is read-only. We
    wanted to be able to use SNMP commands to enable or disable alarms, whether or
    not, clear alarms by setting their state to false. We felt, however, that changing
    the name of a zone is a static configuration that should be done through another
    interface, the web interface or the CLI. The ladAlarmCount is a history of the
    number of times the alarm has triggered, so we made this read-only.


    There is nothing mandatory about the MAX-ACCESS choices we have made here. Unlike
    the SNMP display of the Zone structure in our "Goal" on page 224. Had we defined
    AlarmZoneId as readable, you would see the row number at the start of each row
    before the zone name. We could also have defined the count field as writable so
    you could reset it to zero periodically; this would allow you to see how many
    times the alarm has triggered over a period without having to save the old value
    and subtract it from the new one. These choices belong to the designer.


    # The Traps


    Now let''s leave the Alarm Table and move on to our traps:


    ```

    LAD traps


    ladAlarm NOTIFICATION-TYPE

    OBJECTS { ladTrapZoneId, ladTrapZoneName }

    STATUS current

    DESCRIPTION

    " Trap issued when an alarm is triggered. "

    :: { ladTraps 1 }

    ```


    ```

    ladAlarmClear NOTIFICATION-TYPE

    STATUS current

    DESCRIPTION

    " Trap issued when last raised alarm returns to normal state. "

    :: { ladTraps 2 }

    ```


    We have included two traps: one to raise a red flag when an intrusion has been
    detected and the other to let you know when everything has returned to normal.
    These look a like the OBJECT-TYPE definitions above, but we use NOTIFICATION-TYPE
    for traps.'
