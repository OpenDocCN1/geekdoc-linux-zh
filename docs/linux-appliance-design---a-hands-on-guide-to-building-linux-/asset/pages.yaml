  md: '# DESIGNING A COMMAND LINE INTERFACE


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_158_0.png)


    A command line interface (CLI) gives your customers a secure, low-bandwidth, easily
    scripted way to configure and manage your appliance. As a Linux developer, you
    are already familiar with bash, Linux’s most popular CLI.

    For the same reasons that you would not want to manage a Linux box without a bash
    command line, your customers might not want to manage your appliance without a
    similarly easy-to-manage CLI.

    This chapter covers the following topics:


    +   - Why you need a CLI

    - Types of CLIs

    - Giving users access to a CLI

    - The Laddie CLI

    - Code review for the test command'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Why You Need a CLI


    Despite their age, CLIs are still one of the most-requested features for Linux
    appliances, especially network appliances that will be installed in a server room
    or network operations center. Let''s look in turn at each of major reasons to
    have a CLI on your appliance:


    +   - Security

    - Availability

    - Bandwidth

    - Scriptability

    - Configuration backup and restore


    # Security


    Many service providers will reject an appliance that places its control and status
    protocol on the same wire as user data; the setup they prefer is entirely separate
    physical channel that is dedicated to management of the appliance. Historically,
    this separate channel has been an RS-232 interface with a CLI on it. The RS-232
    lines are routed to the control center using terminal servers or port concentrators.


    When an appliance has a serial port, users expect it to also have a character
    or command line interface. Of course, you could attach a PPP daemon to the serial
    port and make it a network interface, but this is seldom done. Newer network appliances
    feature a second Ethernet interface to provide the separate physical channel for
    appliance control and status. Secure LANs that are dedicated to secure control
    and status are starting to appear, but the installed base of Network Management
    Systems (NMS) that deal with serial ports will make CLIs and appliance serial
    ports standard requirements for time to come.


    # Availability


    Network-based UIs, such as web interfaces, require that the network be correctly
    configured and running before the UI becomes accessible. The problem with this
    is that if something goes wrong with the network configuration, you can lose all
    ability to fix the configuration. A serial port, on the other hand, does not need
    an address, so a UI running on it is always available.


    There is another solution for unavailability due to a misconfigured network. Many
    appliances have a hidden or difficult-to-reach switch that will reset the appliance
    to its factory default configuration if it remains in the closed position while
    the appliance boots up. If you don''t intend to use a serial port, you should
    consider having a hidden switch or some other mechanism to allow the user to reset
    the appliance''s configuration.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Bandwidth


    CLIs are useful when you want to access an appliance over a low-bandwidth channel.
    A low-bandwidth channel might be a slow radio link or an otherwise fast network
    that is overloaded or failing. Low bandwidth capabilities can also be advantageous
    if your appliances are to be dispersed geographically managed centrally.


    # Scriptability


    One of the biggest advantages of a CLI is that it usually allows you to collect
    a series of command lines into a file, or script, and execute the commands as
    if a user had interactive entered them. This can offer huge advantages over web
    or other graphical UIs, which are difficult to automate. Scripts are particularly
    useful to help automate repetitive or tedious tasks. A CLI can allow users to
    build their own commands, using the commands in your CLI as their primitives or
    base operations.


    Not all CLIs are equal in their ability to be scripted. We''ll have more to say
    this later in the chapter.


    # Configuration Backup and Restore


    One of the biggest problems you should anticipate as an appliance developer is
    your customer''s need to migrate configuration data across a software upgrade.
    We''ve approached this problem several ways, and the worst of ours was to give
    users a web page where they could initiate an FTP transfer of a binary file that
    contained the configuration data. This was a disaster for several reasons. Customers
    objected to the hassle of setting up an FTP site to accept files, and they really
    not being able to see the configuration.


    Upgrades were a hassle, as well. We had to write and distribute programs to read
    the binary file and convert it to the format required by the new software. Paying
    attention to version numbers, finding a place to run the converter, and getting
    the new file back onto the appliance was a real mess. Saving the configuration
    as XML helped, but it didn''t help much.


    The solution that really worked was providing a web page that displayed the entire
    configuration as a list of CLI commands. Our customers loved this. They could
    see the configuration at a glance, and making a backup of the configuration was
    as simple as visiting a web page and selecting Save As in the browser. Of course,
    we also had a matching web in which users could paste the CLI commands of the
    saved configuration and so easily restore the original settings. Tools such as
    allow configuration backups to be automated, too. You''ll see an example later
    in the chapter when we review the Laddie CLI command that dumps Laddie''s configuration
    as a series of CLI commands.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'This approach made upgrades easier for us as well. The CLI was fairly stable,
    and changes to it were almost always backward-compatible extensions. After switching
    to this approach, we no longer had to write and distribute programs to convert
    one version of a configuration file to the next version of the file.


    Having the appliance configuration saved as a list of CLI commands in a script
    has many advantages. One of our customers wanted the master copy of all his configurations
    to reside in NMS. He configured our appliances to use DHCP and set up DHCP and
    NMS to use wget to send the appropriate configuration to our appliances as soon
    as he received an IP address from the DHCP server. In instance, he ordered 10
    new servers, and we gave him the Ethernet MAC addresses before shipment. He had
    the configurations for the 10 new servers ready for download before the appliances
    arrived, and all of the new appliances were configured and running within a few
    minutes of initial power on.


    # Types of CLIs


    The default CLI on most Linux systems is bash, but bash is just one type of CLI.
    There are other types that might be more applicable to your needs, and your CLI
    may switch from one type to another, as you choose the type to match the task
    at hand. Let''s look at the different types of CLIs: sentences, menus, and wizards,
    and two CLI attributes: statefulness and whether the CLI is line- or character-oriented.


    # Sentences


    The sentence CLI, the most common type of CLI, maps actions and objects in the
    appliance into verbs and nouns. Consider a simple bash command:


    ```

    rm -f backup.sxw

    ```


    Here, rm is the verb, -f is an adverb, and backup.sxw is the noun. The key to
    a successful CLI of this type is to select the verbs and nouns that map well to
    the customer''s understanding of the appliance.


    Of course, you can use other sentence structures like verb-noun, verb-noun-adjective,
    or noun-verb-adjective—it''s up to you. The idea is to making the CLI line sound
    like a sentence. You''ll know you''ve got it right when customers, field support,
    and engineers all describe a configuration using the same vocabulary and syntax
    as that of your CLI.


    Typically you will need verbs to view status or statistics, to change the configuration,
    and to initiate actions. For example, the verbs in the Laddie CLI are view, set,
    test, and clear.


    The big advantage of the sentence CLI is that it is the most easily and reliably
    scripted CLI. The major disadvantage of this CLI is that there can be a steep
    learning curve for it. The user has to remember a fair amount of vocabulary and
    syntax in order to use this CLI effectively. However, users who spend a lot of
    time in the CLI usually prefer the sentence CLI.


