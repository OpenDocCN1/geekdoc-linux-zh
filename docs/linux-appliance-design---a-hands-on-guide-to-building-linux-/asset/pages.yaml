  md: '# system()


    A system() call to run a utility is another common destination. While simple and
    flexible, this approach uses more memory and CPU cycles than the other destinations
    and is not appropriate for processing large numbers of messages.


    The use of system() is almost always considered a security risk. We mention system()
    for completeness, but discourage it. If you must run an external command, try
    to use popen() in place of system(). We solve this problem on Laddie using the
    RTA-to-file utility described in Appendix D.


    We do not have space here to describe all of the possible destinations. For example,
    we did not discuss pagers, voice mail, or instant messaging.


    # syslog


    A logging system needs a standard way to report events, a lingua franca for log
    messages. That standard for most of us, is syslog. There are several advantages
    to syslog. It is the primary event-reporting mechanism used by legacy Linux applications,
    and it is well known and understood. In conjunction with the kernel logging daemon,
    syslog captures kernels and other system log messages that you may want to make
    visible to the appliance user.


    This section describes how syslog works, how to use it in your applications, and
    how to configure its message filters. We give enough detail that you should have
    no trouble using syslog as the basis for your logging system.


    # syslog Architecture


    Messages from syslog are generated in your program by a call to the glibc C-library
    routine syslog(). Then, gli formats the message and tries to write it to /dev/log,
    a Unix socket that is opened when syslog starts. syslog reads the message from
    /dev/log and handles it according to filters defined in /etc/syslog.conf, the
    syslog configuration file. Figure 6-2 shows the overall architecture and message
    flow of.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_105_0.png)


    Figure 6-2: Message flow with syslog'
