    # savefile


    The need to save configuration data from one boot of the appliance to the next
    is so common that the authors of RTA included the ability to automatically save
    table data in a file when data is updated. There is one file per table, and the
    name of the file is specified in the TBLDEF structure as savefile. You can mark
    the columns to save by adding the RTA DISAVE flag to the column definition.

    The file contains a list of UPDATE statements, for each row in the table. The
    save file is read from the disk and applied to the table when you initialize the
    table with the rta_add_table() call. The combination of RTA_DISAVE on a column
    and a savefile for the table eliminates the need to parse XML or INI files to
    get initial or saved configuration values. Of course, you can use XML or INI if
    you prefer—just set the savefile pointer to null.


    # iterator


    An iterator is a subroutine in your code that steps through a linked list or other
    arrangement of the rows in your table. The iterator lets you treat a linked list,
    a B-tree, or just about any scheme for organizing data as if data was in a table.

    The iterator function is called with three parameters: a pointer to the current
    row, the void pointer *it_info from the TBLDEF, and the zero-indexed row number.
    The function returns a pointer to the next row. When RTA asks for the first row,
    the current pointer is NULL, and the desired index is zero. The function should
    return a NULL when an iterator is defined after the last row in the list. The
    address and members in the TBLDEF are ignored. This is its function prototype.


    ```

    iterator(void *cur_row, void *it_info, int rowid);

    ```


    There is one cave when using iterator functions: Loading a save file may fail
    if you have not already allocated all the links in the list. (Remember, the save
    file is a list of UPDATE statements and expects the rows to already exist.). Fortunately,
    there is a simple way around this problem. Always keep one unused row available,
    and when that row is written by an UPDATE statement, have a write callback row
    so that you can stay one step ahead of the UPDATES. The logmudx program presented
    in Chapter 7 uses this technique.'
