    # Webserver Independence


    PHP works with many webservers, each having a slightly different way of interacting
    with the PHP interpreter. The API with the webserver is the Server API. The Server
    API used by PHP is determined when compiling PHP, so as a developer you probably
    know this before writing the PHP scripts. But what if you decided to use another
    webserver? If you didn''t plan ahead, you you would have to modify a lot of code
    to get it to work with the new webserver.


    As an aside, PHP provides the function php_sapi_name() to determine which API
    is currently in use. This function returns one of many possible strings, three
    of which are apache, cgi, and cfccgi, corresponding to Apache, CGI, and FastCGI.
    There''s not much documentation on the Server API, but by searching it on Google.


    Early in the design phase, we decided to write our PHP scripts so they would work
    with these three Server APIs, the webservers that we investigated at least one
    of them. This would mean that our PHP scripts would work without modification
    under any webserver that supported one of these APIs. This server-independent
    approach offers two advantages: It avoids locking (should a better one become
    available) and it allows you to develop scripts using a different webserver than
    the one deployed in your application.


