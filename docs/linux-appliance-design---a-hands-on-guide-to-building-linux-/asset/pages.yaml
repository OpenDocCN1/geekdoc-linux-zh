    \n```\nUPDATE Filters SET regex =\n  \"Train from [[A-Za-z -]+\\] arriving on\
    \ Track number ([0-9]+)\"\nLIMIT 1;\n```\n\n# level and facility\n\nThe logmuxd\
    \ daemon routes based on the level and facility of the incoming message. In this\
    \ example we do not care which level and facility were used to send the message,\
    \ so we set the level to a high value, and we clear the filter mask.\n\n```\n\
    UPDATE Filters SET level = 15, facility = 0 LIMIT 1;\n```"
