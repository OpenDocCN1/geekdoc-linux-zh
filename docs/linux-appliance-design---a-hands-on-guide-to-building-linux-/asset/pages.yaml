  md: 'You may have noticed that we did not include the id, edge, and input columns
    in our SNMP view of this table. This was not an oversight. It is the MIB designer
    (or any interface designer, for that matter) to decide what makes sense in light
    of the intended use of the interface. In our case, we decided that the edge and
    input information was too hardware specific to be necessary in this interface.
