    \ lines, windows, images, and text, and let the underlying\nlibrary decide what\
    \ to do with the pixels.\n\nThe most common library for manipulating graphics\
    \ objects in Linux is\nXlib. Xlib is actually more than a graphics library; it\
    \ is the interface by which\nclients access an X Window server. In particular,\
    \ it manages also with\ninput events. Because of its popularity, building an X\
    \ appliance on top of X\nSystem can be a good choice. Xlib is cumbersome to program\
    \ directly, but with an\nSystem, a UI developer can choose among several GUI toolkits\n\
    (for example, Qt, which is used by the KDE desktop, GTK+, which is used\by the\
    \ Gnome desktop). Alternatively, UI developers can include an X-based\nweb browser\
    \ on the appliance and provide the UI as a set of pages. In\nof these cases, UI\
    \ development for the appliance would be different from\nUI development on a Linux\
    \ desktop.\n\nOn the other hand, the X Window system is complex and provides\n\
    features that will often not be needed on an appliance. Because X is\nnetwork-oriented,\
    \ it introduces an additional network layer between Xlib\nent XServer. X incorporates\
    \ support for multiscreen displays and\nmultiple clients, and it also provides\
