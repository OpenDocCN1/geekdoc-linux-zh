- img_proc: true
  md: 'make the resulting code compatible with all of the major web browsers. If you
    decide to build a web interface directly into your daemon, do yourself a favor
    and use an HTTP library like libhttpd from Hughes Technologies. Because other
    codes, experts in HTTP, keep it up to date regarding the quirks of various browsers,
