    # Internal Debug Messages


    The RTA logs internal errors using the standard syslog() facility, which is available
    on all Linux systems. The default syslog() facility is LOG_USER, but you can change
    the default facility in the rta_db table. You can modify syslogd to do post-processing,
    as generating SNMP traps from these debug messages. The RTA program sends all
    debug error messages to syslog() in this format:


    ```

    rta[PID]: FILE LINE#: error_message

    ```


    The RTA program will replace PID, FILE, and LINE# with the process ID, the source
    filename, and the line number where the error was detected. The RTA program will
    replace %d at the start of each error string with the filename and line number
    where the error was detected.


