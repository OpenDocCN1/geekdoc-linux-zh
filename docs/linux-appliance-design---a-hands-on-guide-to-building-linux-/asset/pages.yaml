  md: '# Summary


    In this chapter we discussed various ways to manage daemons. Simple daemons can
    use files for all management, but we believe that for Linux appliances with multiple
    user interfaces, a control and status protocol is best. We described the reasons
    to use a control and status protocol and presented some guidelines to follow if
    you decide to build your own.


    In the next chapter we''ll show you how to incorporate RTA into a daemon so that
    the client has access to the daemon''s status, configuration, and statistics.


    All of the examples used in the remainder of the book use PostgreSQL and the RTA
    library as the management protocol between daemons and user interfaces. Don''t
    be concerned if you choose not to use RTA, though. The book is more about appliance
    design than using particular libraries.'
