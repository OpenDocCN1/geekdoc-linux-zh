    # ### About the Tabular Data


    Let''s look at Table 8-1 in more detail.


    **Version** this is the software version of the webserver that we tested.


    **Virtual memory** this is the memory (in kilobytes) of the running webserver
    consumed. The virtual memory was measured using the Unix top command, which displays
    virtual memory under the SIZE column. For webservers that spawn multiple processes,
    we recorded the maximum value. In each case, the virtual memory was recorded during
    the performance test. (*Response time on the next page.)


    **Executable size** is the size (in kilobytes) of the executable file after compiling
    it with mostly default options and manually stripping it with the strip command.
    This metric is not as good as an indication of required memory as virtual memory
    because libraries are sometimes linked dynamically and sometimes linked statically.


    When programs are linked dynamically, much of the code can be in dynamically linked
    libraries. When you view the size of the executable, the code in these libraries
    will not be factored in. So the size of a dynamically linked executable is not
    a good indication of how much memory will be'
