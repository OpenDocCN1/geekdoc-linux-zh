  md: 'This program is on the CD at /Code/src/examples/socket_cat.c. Build and run
    the program, using the following commands:


    ```

    laddie:~# cd /Code/src/examples/socket_cat

    laddie:~# make

    laddie:~# ./socket_cat /dev/lircd

    ```


    Then press a few buttons on your remote. You should see output like following.


    |000000000000c90 00 VOL - /etc/lircd.conf |

    |000000000000a90 00 VOL+ /etc/lircd.conf |

    |000000000000b90 00 CH- /etc/lircd.conf |

    |000000000000a90 00 CH+ /etc/lircd.conf |

    |000000000000a90 00 POWER /etc/lircd.conf |

    |000000000000a90 01 POWER /etc/lircd.conf |

    |000000000000a90 02 POWER /etc/lircd.conf |


    Each string includes a 16-character hexadecimal command code, a hexadecimal repetition
    count, a command string, and a name for the remote (which defaults to the name
    of the lirc config file). Note, at the end of this sequence, the repetition count
    increases when the POWER button is held down.


    The 16-character command codes are generally not useful, unless all relevant information
    is captured by the names of the commands and the remote. However, it is interesting
    to see how the command corresponds to the input waveform. Note, for example, that
    90 is hexadecimal representation for the 12 bits (left to right) in the command
    waveform for the Sony TV Volume-command that we saw in "Protocols for Encoding
    Remote Control Commands" on page 198. When you are to use socket_cat, press CTRL-C
    to terminate the program.


    > NOTE When a remote control button is pushed, depending on the button and the
    protocol, the commands can repeat pretty quickly. For the Laddie framebuffer UI,
    we took advantage of the repetition count associated with the listed output to
    ignore all but the first command associated with each button press.


    # LIRC Tools for Controlling Applications


    As in the previous section, it is simple to write a program that responds to remote
    control commands via the /dev/lircd socket. But if you want to use a remote to
    control a program that already exists, but was designed, so, for keyboard input
    rather than remote control input? The LIRC package addresses these needs with
    tools that connect to the /dev/ lirc socket and produces the kind of output that
    many programs expect.

    The lirc tool is a good example because it is the simplest: it prints user-specifiable,
    newline-delimited strings to the standard output when remote control buttons are
    pressed. If you have a program that takes commands'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'from standard input, you can control it with LIRC by piping the output of ircat
    to your program. To map remote controls to appropriate output, configure the file
    /etc/lircrc. The HTML documentation provided with the LIRC package provides details
    on the format of this file.


    Similarly, the LIRC package provides an irty utility for simulating keyboard input,
    an irex utility for invoking system calls, and an irrever utility that generates
    events (for systems running). These actions are mapped to remote controls according
    to the /etc/lircrc file. All of these utilizes use an API to call the lirc_client
    library to access the /dev/lirc socket. The source code for the ircat tool provides
    a simple example of how to use this library.


    Finally, the LIRC package contains a daemon lircmd that uses remote mouse. This
    daemon connects to the /dev/lirc socket and moves events on the pipe /dev/lircmd.
    The configuration file /etc/lircmd.conf selects for X mouse events (e.g., IntelliMouse)
    and specifies how remote commands map to movements and button presses. The XF86Config
    file must be updated to include /dev/lirc as an input device. Again, the LIRC
    HTML documentation provides details.


    # Controlling the Laddie Interface


    For the Laddie appliance, we installed the LIRC package and configured the lirc_serial
    driver and lirc daemon as described in the previous sections. Since we built the
    Laddie appliance from scratch, we did not need to use LIRC tools like ircat or
    irpty; instead, we wrote code similar to the socket_cat example, which accessed
    the /dev/l socket directly.


    As discussed in the previous chapter, Laddie''s framebuffer interface is built
    on the Simple DirectMedia Layer (SDL) library. Since SDL has its own event handler,
    which handles keyboard presses, it was simpler to incorporate remote control events.
    We created a separate EventHandler() thread to read commands from the /dev/lirc
    socket, parse these commands, and push appropriate keyboard events onto the SDL
    event queue. Specifically, we responded to the Channel+/- and Volume/- remote
    control commands by simulating the SDL keypress for the Up, Down, Right, and Left
    arrow keys, respectively. We responded to the remote control Power command with
    the SDL Enter key event. In Laddie''s SDL handler, we responded to these keypress
    events by calling navigation commands in Laddie''s menu object. This use of /dev/lirc
    output to control Laddie''s framebuffer menu is illustrated in Figure 12-15.


    | /dev/lirc | EventHandler() | SDL Event Handler | Laddie''s Menu Object |

    | ... VOL-... | SDL Event: SDL_LEFT | cursorDown() |


    Figure 12-15: Controlling the Laddie framebuffer'
