    A Linux Appliance


    | Your Code | Defining Application |

    |---|---|

    | Code From This Book | User Interfaces and Common Services |

    | Embedded Linux | Linux |


    Figure 1-1: Linux appliance software stack


    # Uls and Daemons


    Assuming our Linux appliance will have multiple, simultaneous UIs, when we look
    at the appliance from the point of view of running processes we get an architecture
    something like that shown in Figure 1-2. The UI programs interact with the users
    to accept commands and configuration to display status and statistics. Daemons,
    on the other hand, interact with the hardware, other daemons, and the UIs to provide
    the appliance’s defining service as well as status and statistics.


    | Web Interfaces | Daemons |

    |---|---|

    | Web | Defining Application |

    | Buffer | Logging Daemon |

    | Front Panel | Event Handler |

    | SNMP | Security Monitor |

    | Command Line | Hardware Monitor |


    Figure 1-2: A common appliance architecture


    # Daemons


    Daemons are background programs that are most started just after booting Linux.
    Daemons distinguish themselves in that they don’t have a controlling terminal
    like programs started from the bash command line. Let’s look at the kinds of daemons
    found on a typical appliance.'
