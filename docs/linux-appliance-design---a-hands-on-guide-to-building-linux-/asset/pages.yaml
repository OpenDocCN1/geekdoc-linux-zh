    If we assume the serial port has been configured to keep the Request to Send (RTS)
    output at a high voltage level and the Transmit Data (TXD) output at a low voltage
    level. The 5V regulator provides the voltage required by the detector. The level
    shifter provides the correct voltage levels to the DCD input.


    If you look at IR receiver circuits presented on the Web, you''ll find some that
    take a simpler approach, omitting the level-shifter and providing an output that
    swings between 0V and 5V. This may work for your computer. If not, or if you want
    a robust solution, the approach we''ve chosen is.


