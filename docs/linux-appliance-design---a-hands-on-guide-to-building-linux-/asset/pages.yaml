- img_proc: true
  md: "The SNMPv2-SMI and SNMPv2-TC MIB definitions are supplied with the Net-SNMP\
    \ package. When you installed Net-SNMP on your system in the Chapter 13, these\
    \ files were probably put into /usr/share/snmp/mibs or /usr/local/share/snmp/mibs.\
    \ Look for the files SNMPv2-SMI.txt and SNMPv2-TC.txt.\n\n# Module Definition\n\
    \nWe start by defining a module, ladProject, to contain our appliance MIB. This\
    \ is where we put the copyright, revision history, contact information, and a\
    \ general description of what the module contains.\n\n```\nladProject MODULE-IDENTITY\n\
    LAST-UPDATED \"200505280000Z\"\nORGANIZATION \"The Laddie Group\"\nCONTACT-INFO\n\
    \"Here we put contact information.\"\n```\n\nDESCRIPTION\n\n\"The LAD MIB.\\nCopyright\
    \ 2005 Laddie Group\nAll rights reserved.\n\nThis MIB module specifies the pollable\
    \ and set-able objects in the Linux Appliance Design demonstration application:\
    \ an alarm system monitor. This MIB also describes traps associated with this\
    \ demo appliance.\n\n+   - REVISION \"200505280000Z\"\nDESCRIPTION\n - 1.1 Traps\
    \ added along with trapInfo section.\n\n+   - REVISION \"2005052220000Z\"\nDESCRIPTION\n\
    \ - 1.0 Initial Document.\n\n```\n:= { laddieMg 1 }\n```\n\nThe MODULE-IDENTITY\
    \ section is one long sentence. The first and last lines, taken together, say\
    \ that ladProject is a module defined below laddieMg. in the namespace and that\
    \ its OID is laddieMg.1. Here’s the OID\n\n1.3.6.1.4.1.1.3382.1\n\nThe rest of\
    \ the MODULE-IDENTITY section should be fairly clear after our discussion of the\
    \ LADDIE-SMI in the previous section. You may notice that two REVISION clauses\
    \ listed at lines 1 and 2. If you make changes to"
  merge: -1
  pgno: 274
- img_proc: true
  md: 'your MIB in the future, you will need to add revision clauses to explain what
    you did. The convention is to keep revision clauses in reverse-chronological order
    (that is, the most recent change appears at the top). This does not mean you should
    feel free to make any changes you want to your MIB; you will just be creating
    confusion for your customers if you change anything (names, OIDs, and is already
    defined in your MIB. You may however, find it necessary to enhance your MIB with
    new information required by customer demand or help manage new features that will
    be adding to your appliance. You may add new structure, but do not change existing
    structure!


    Clearly your LAST-UPDATED time will match that of your most recent revision clause,
    as ours does below:


    The next set of lines defines the sections we will be fleshed out:


    ```

    -- top level MIB headings of the LAD MIB

    ladTraps OBJECT IDENTIFIER ::= { ladProject 0 }

    lSystem OBJECT IDENTIFIER ::= { ladProject 1 }

    lTrapInfo OBJECT IDENTIFIER ::= { ladProject 2 }

    ```


    Putting all of the section heading OIDs together at the top, as we have done here,
    is a stylish choice which we can help communicate the structure of the rest of
    the MIB. We''re making it clear that there will be a section for defining traps,
    one for system information (where we will be putting our Alarm Trap), and another
    section for the non-pollable information we will only send along traps.


    Numbering in SNMP usually begins with 1, not zero, but you may have noticed that
    we use the ladtraps above the OID of ladProject.o. Our reason for doing this dates
    back to the early days of SNMP(SNMP version 2), when compatibility with SNMPv1
    (SNMP version 1) was being crafted. For more details, you may want to read RFC
    1908: Coexistence Version 1 and Version 2 of the Internet-Standard Network Management
    Framework.


    We''ll continue our review of our MIB with the ladSystem system and leave the
    traps for later. That will allow us to immediately follow our discussion of the
    trap with ladTrapInfo section.


    ```

    -- LAD System Information

    lSystemScalars OBJECT IDENTIFIER ::= { ladSystem 1 }

    ladSystemTables OBJECT IDENTIFIER ::= { ladSystem 2 }

    ```


    We further subdivide the ladSystem section into a for scalars and another for
    tables. Scalars are just objects that are not columns in tables. Experience has
    taught us to keep scalars and tables separate to avoid having scalars sprinkled
    around tables as the MIB evolves over time.


    252 Chapter 14'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Version and Number of Zones


    Next, we''ll define some scalars in our ladSystemScalars section.


    +   - LAD System Scalars


    ```

    ladVersion OBJECT-TYPE

    SYNTAX DisplayString

    MAX-ACCESS read-only

    STATUS current

    DESCRIPTION "This string represents the version of the LAD Alarm

    appliance Scalars 1" := { ladSystemScalars }

    ```


    ```

    ladNumberOfZones OBJECT-TYPE

    SYNTAX Integer32 (1..128)

    MAX-ACCESS read-only

    STATUS current

    DESCRIPTION "The number of alarm zones, therefore the number of rows

    in the ladAlarmTable." := { ladSystemScalars 2 }

    ```


    Here we define two objects (note the OBJECT-TYPE keyword): ladVersion and ladNumberOfZones.
    The SYNTAX clause tells us that ladVersion is a DisplayString, meaning it is represented
    as a string of displayable (printable) characters, and ladNumberOfZones is a 32-bit
    integer with values ranging from 1 through 128. If you refer back to our IMPORT
    section at the start of this MIB, you will see that both of these syntaxes were
    imported from SNMPv2-TC, the textual files.


    The MAX-ACCESS clause tells us that each of these objects is read-only. Some objects
    we will encounter later in this MIB will have read-write, notaccessible, or accessible-for-notify
    access. Read-write means you can read the object''s value as well as write a new
    value. You can''t read or write objects defined as not-accessible, but you might
    use one as an index into a table. Accessible-for-notify is how we define information
    sent with a trap that is otherwise not pollable.


    One point to keep in mind is that the MAX-ACCESS clause defines maximum actual
    access. You will never be able to write to an object that has max-access read-only,
    but you may not be able to write to an object whose max-access is read-write,
    either. The ability to write to the object may be restricted by other factors.
    For example, in Net-SNMP, you may not write to any object that has a value set
    in the snmpd.conf file, regardless of what the MAX-ACCESS clause indicates in
    the MIB file.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The STATUS clause indicates that both objects are current, that is, they are
    valid objects in this version of the MIB. To remove an object from a MIB, you
    would make its status deprecated. This is a brand new MIB, so nothing is deprecated.


    The DESCRIPTION clause is intended specifically for the human reader of the MIB,
    rather than a computer program. It should contain a brief description of the OID.
    It might also contain possible uses of the value and caveats the reader may need
    to know.


    The last line of each section defines the OID. The ::= means is defined as. Each
    OID is described as appending to a previous OID. The ladNumberOfZones''s OID is
    the same as ladSystemScalars with a 2 appended to the end. Its whole numeric OID
    looks like this:


    ```

    .1.3.6.1.4.1.23528.1.1.1.2

    ```


    The first six numbers in this string are from standard MIBs and can be read like
    this:


    ```

    .iso(1).org(3).dod(6).internet(1).private(4).enterprises(1)

    ```


    The next number is where IANA gives us our enterprise number, 23528. After enterprises,
    the rest of the OID continues


    ladGroup.ladMgmt.ladProject.ladSystem.ladSystemScalars.ladNumberOfZones


    See Figure 14-3 for the correspondence between each number in the OID and its
    descriptive name.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_277_0.png)


    Figure 14-3: OID for ladNumberOfZones'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# The Alarm Table


    Now for the core of the MIB: the Alarm Table. This is the table displayed at the
    beginning of this chapter, showing the zones and alarm states. Here is how we
    define this table in our MIB:


    LAD Alarm Table


    ```

    ladAlarmTable OBJECT-TYPE

    SYNTAX SEQUENCE OF LadAlarmEntry

    MAX-ACCESS not-accessible

    STATUS current

    DESCRIPTION "A table of alarms."

    ::= { ladSystemTables 1 }

    ```


    ```

    ladAlarmEntry OBJECT-TYPE

    SYNTAX LadAlarmEntry

    MAX-ACCESS not-accessible

    STATUS current

    DESCRIPTION "An entry in the Alarm Table."

    INDEX { ladAlarmZoneId }

    ::= { ladAlarmTable 1 }

    ```


    ```

    ladAlarmEntry :=\nSEQUENCE {

    ladAlarmZoneId Integer32,

    ladAlarmZoneName DisplayString,

    ladAlarmEnable TruthValue,

    ladAlarmLatching TruthValue,

    ladAlarmState TruthValue,

    ladAlarmCount Counter32

    }

    ```


    Notice that we have three blocks of definition above: ladAlarmTable, ladAlarmEntry,
    and LadAlarmEntry. SNMP requires that all object names begin with a lowercase
    letter (hence, ladAlarmTable, ladAlarmEntry). However, LadAlarmEntry is not an
    object, but rather a definition of the syntax of the entry. It is common practice
    to define the syntax of a table with the same name as the table, but starting
    with an uppercase letter (LadAlarmEntry versus ladAlarmEntry). The syntax of tableEntry
    is a sequence (or array) of other object types which are the columns in the table.


    After the definition of the table entry syntax, we will list the detailed definitions
    of each of the columns listed in the SEQUENCE clause:


    ```

    ladAlarmZoneId OBJECT-TYPE

    SYNTAX Integer32 (1..128)

    MAX-ACCESS not-accessible

    ```'
