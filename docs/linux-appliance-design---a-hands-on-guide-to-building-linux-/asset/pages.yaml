  md: '# Our Choice


    When we were developing Laddie, we used the Apache webserver because of debugging
    support, while for the production appliance, we selected lighttpd because of its
    smaller memory requirement and its speed. We chose which webserver to use in the
    production appliance rather in the development cycle. We were able to make this
    decision later because we had written PHP scripts to work under Apache, CGI, and
    FastCGI.


    In his book about embedded Linux, Yagmour argues against using Apache because
    it is difficult to cross-compile (Building Embedded Linux Systems, by Karim Yagmour,
    O''Reilly, 2003). There was no need to cross-compile for our appliance, but if
    your appliance''s CPU differs from your development machine''s CPU, you should
    keep this in mind.


    # UI Design


    In this section, we will review various approaches to designing the UI look and
    feel, and the trade-offs they require. We will weigh these trade-offs when making
    implementation decisions in the "Implementation" section on page 118.


    # Menu System


    One of the most important functions of a menu system is that it allows us to quickly
    grasp the system''s capabilities. A menu with lots of top-level options can make
    it difficult for the user to choose an action, because there are so many choices.
    On the other hand, a menu with lots of nesting, reducing the crowding on the top-level
    menu, tends to increase the time to find an action.


    Menu systems can be divided into those which the top-level menu runs vertically
    down the left side of the window (see Figure 8-1), and those in which the top-level
    menu runs horizontally, near the top of the window (see Figure 8-2). While the
    vertical menu can be useful, it can quickly become difficult to navigate as the
    number of menu items increases (the scrollbars in Figure 8-1). The horizontal
    menu is usually superior because it can be more compact because the secondary-level
    menu shares same real estate.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_137_0.png)


    | Advanced Wireless Settings | | |

    |---|---|--|

    | Wireless Router Settings | | |

    | | Enable Wireless Radio | | |

    | | Enable SSID Broadcast | | |

    | Fragmentation Threshold (256 - 2346): | 2346 | |

    | CTS/RTS Threshold (256 - 2346): | 2346 | |

    | Preamble Mode | Automatic | |


    Figure 8-1: A vertical menu'
