    As you read this chapter, keep in mind that the alarm system itself is not as
    important as the techniques used to build it. Don''t let the implementation overshadow
    the design principles being taught.


    # Introduction to Alarm Systems


    This section presents the concepts and definitions used to describe alarm systems
    in general and Laddie in particular.


    # Sensors


    An alarm sensor is a small device or switch that detects movement in a room or
    activity in an area. An alarm system monitors various alarm sensors and reports
    any unexpected activity they pick up. The area that a sensor protects is called
    zone. Zones are given names that usually describe the area; typical zone names
    might include Garage, Second Floor Windows, and Refrigerator.


    Figure 5-1 shows an example arrangement of sensors and zones for a small business.
    There are door sensors on the front and back doors and a motion detector that
    looks for movement near the office and storeroom.


    # Small Business with Three Zones


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_85_0.png)


    **Figure 5-1:** An example alarm system


    # Types of Sensors


    Since an alarm system can only report what its sensors detect, it is important
    to choose sensors carefully. Let''s consider the types of sensors that are available.


    # **Magnetic reed switches**


    These are most often used to monitor doors; they are placed with the switch on
    the doorframe and the magnet on the door.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# PIR motion detectors


    Passive Infrared (PIR) motion detectors detect minute changes in the movement
    of infrared (heat) sources. A person or animal can set off a PIR motion detector,
    but for example, a baseball cannot.


    # Acoustic sensors


    Acoustic sensors detect specific sounds. They are often used to detect the sound
    of breaking glass, and are are so sensitive that a single acoustic sensor can
    protect all of the windows in a room.


    # Floor mat sensors


    Floor mat sensors have switches that can detect the weight of a person. They are
    very thin and are usually placed under carpet at entries.


    # Vibration sensors


    Vibration sensors can detect very slight physical motion. They are often used
    to protect cars.


    # Smoke and carbon monoxide detectors


    These sensors are used to detect potential fires.


    # Temperature sensors


    Thermostats and other temperature sensors trip at a certain temperature or simply
    report the current temperature in the zone. They are often used to protect temperature-sensitive
    equipment and supplies.


    # Sensor Contact Type


    To the alarm system, most sensors look like switches. The switch contacts can
    be either open when not in alarm (called normally open or NO sensors), or closed
    when not in alarm (normally closed or NC sensors). When you install a sensor,
    you have to tell the alarm system the contact type of sensor—that is, whether
    the contacts are normally open or normally closed. Most sensors are normally closed.
    A normally closed sensor has the desirable property of triggering an alarm if
    the wires are cut.


    Another helpful feature of the sensor-and-zone setup is that it is possible to
    cascade sensors within a zone, as long as the cascaded sensors are all of the
    same contact type. Figure 5-2 shows how to cascade normally open sensors and Figure
    5-3 shows how to cascade normally closed sensors.


    # Cascading NO Sensors


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_86_0.png)'
  merge: -1
