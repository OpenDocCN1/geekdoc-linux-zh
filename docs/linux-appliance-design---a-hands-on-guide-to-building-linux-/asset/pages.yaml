    When ladd detects an alarm, it sends a log using syslog(); then logmuxd captures
    the event, rewrites it if needed, and multiplexes it out to each of the accepted
    TCP connections.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_116_0.png)


    Figure 7-1: The need for a multiplexing log daemon


    We decided to invest the time to build a new logging system for event handling
    we wanted the ability to capture, rewrite, and route event reports from all applications
    and daemons on the appliance. As an appliance designer, you may find that your
    appliance needs to capture event reports from many sources and route the messages
    to many destinations. If so, you should consider logmuxd in your appliance.


    # Features and Capabilities of logmuxd


    We want logmuxd to work either with an existing syslog installation or as a replacement
    for it. That is, we need to be able to read and write messages in the syslog style
    of angle brackets surrounding an integer. We want our logging daemon to support
    many types of input and many types of destinations, to be able to route based
    on a regex, and to be able to rewrite a log message before forwarding it to its
    destination.


    Each destination has its own set of routing and rewriting rules. This is similar
    to syslog and means that you may have identical filters with the output of each
    filter going to a different destination.


    Filters use the regex() library for pattern matching and extracting relevant fields
    from the log messages. Messages can optionally be rewritten using the fields extracted
    from the regex pattern.


    Figure 7-2 presents the overall architecture of logmuxd. In the next section we
    discuss each of the blocks in this diagram.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_116_1.png)


    Figure 7-2: Architecture of logmuxd'
