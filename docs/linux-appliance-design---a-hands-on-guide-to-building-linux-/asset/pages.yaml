    # # Laddie’s Hardware Design


    This section presents the hardware needed to use Laddie if you are uncomfortable
    with electronic circuits or if you are not interested in seeing how the hardware
    works.

    The pins on the parallel port are divided into three main groups: data lines,
    control lines, and status lines. Each group is controlled by a register, which
    is available at a particular I/O address. The data lines are at the base address
    of the parallel port, the status lines are at the base address plus one, and the
    control lines are at the base address plus two. Table 5-1 shows how the pins on
    a 25-pin parallel port connector relate to the printer port names, and to the
    alarm system.


    Table 5-1: Use of the PC Parallel Port


    | Pin | Name | Register | Bit | Alarm input | |

    | 1 | STB | Control | 0 | |

    | 2 | D0 | Data | 0 | |

    | 3 | D1 | Data | 1 | |

    | 4 | D2 | Data | 2 | |

    | 5 | D3 | Data | 3 | |

    | 6 | D4 | Data | 4 | |

    | 7 | D5 | Data | 5 | |

    | 8 | D6 | Data | 6 | |

    | 9 | D7 | Data | 7 | |

    | 10 | ACK | Status | 6 | Zone 4 |

    | 11 | BSY | Status | 7 | Zone 5 |

    | 12 | PAP | Status | 5 | Zone 3 |

    | 13 | OFON | Status | 4 | Zone 2 |

    | 14 | ALF | Control | 1 | |

    | 15 | FEH | Status | 3 | Zone 1 |

    | 16 | INI | Control | 2 | |

    | 17 | DSL | Control | 3 | |

    | 18–25 | Ground | | | |'
  merge: -1
