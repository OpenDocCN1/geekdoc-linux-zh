  md: 'This output is a little awkward to read because it is a depth-first walk; that
    is, it walks down each column before going back to one and starting the next column.
    This is a result of the lexical ordering of the OIDs. For example, ifDesc is ifEntry.1
    and ifType is ifEntry.2, you see all ifDesc fields by any ifType fields.


    # KNOWING AN APPLIANCE BY MIBS


    Walking can identify the type of appliance which the MIBs it supports. For example,
    one of the authors was once assigned an IP address for a new workstation and found
    that someone else already using this address. He had been assigned this address
    through proper channels, he assumed someone else invalidly it. He turned off his
    system and used another system to read system,sysContact from the offending system;
    this should have been set to the contact information for the administrator for
    node, but it was not. He tried walking all the MIBs supported by that system and
    found that it supported the printer MIB. Hmm . As it turned out, he had been incorrectly
    given the IP address of the department''s!


    # SNMPv1, SNMPv2, and SNMPv3


    There are three variants of SNMP. The original, SNMPv1 (version 1), is the simplest,
    but it has some drawbacks that newer versions seek to remedy. Its shortcomings
    include:


    +   - No support for integers larger than 32 bits.

    - No means to ask for bulk data (each object must be asked for name).

    - No mechanism to ensure that a trap reaches its destination.

    - Security/authentication is accomplished using community names, which are like
    passwords, which are transmitted on the network in the clear (that is, unencrypted).


    SNMPv2 (community-based SNMPv2) addressed the first of three problems, reaching
    an agreement on a new security mechanism proved more difficult, so SNMPv2 still
    relies on community names for authentication. SNMPv2 includes 64-bit integers,
    the GETBULK command, and introduces informs, which are confirmed traps.


    SNMPv3 replaces the community-name authentication mechanism with more secure authentication
    and encryption, and in-depth discussion of it is the scope of this book.


    SNMPv1 has moved to "historical" status, but many applications used by IT organizations
    still use it. Your network appliance may need to speak SNMPv1 for compatibility
    with these older applications. Expect, however, in the not-too-distant future,
    some of your customers will want to disable the older, less secure versions of
    SNMP.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# SNMP Data Types


    SNMP data types are a subset of ASN.1 types. A complete description of the SNMP
    data types and their uses is beyond the scope of this brief introduction, but
    this section is a summary of the major types. SNMP defines three kinds of data
    types: primitive, defined, and constructor. We won''t dwell on the differences,
    other than to primitives are the basic types, defined types have special meanings
    but underlying primitive types, and constructor types are the tables we will discuss
    below. Although it may look a little strange, we''ll try to stay consistent with
    SNMP''s standard of using capital letters in the names of primitive types, but
    just initial capitals for the defined types.


    # INTEGER


    An INTEGER may be positive or negative. Its values may be enumerated, a range
    of legal values specified in the form (LowValue..highValue), or a fixed size (e.g.,
    Size(4)). In SNMPv2 becomes Integer32, explicitly indicating the size as 32 bits.
    SNMPv2 also adds Unsigned32 type for only positive values.


    # Gauge


    Gauges are integers that take only non-negative values and whose values rise or
    fall within a specified range (e.g., between 0 and 100 percent, or between 0 and
    some maximum capacity). SNMPv2 redefines this as Gauge32.


    # Counter


    Like Gauge, Counter is an integer that takes only non-negative values. Unlike
    Gauge, the value of a counter only increases until it wraps back to zero at its
    maximum limit. SNMPv2 replaced Counter with Counter32 and Counter64.


    # TimeTicks


    TimeTicks are integers describing time in 1/100ths of a second. They are generally
    used to describe the time since some significant event or starting point, such
    as system boot or last configuration change.


    # OCTET STRING


    An OCTET STRING is a string of eight-bit bytes. It is not necessarily a null-terminated
    STRING; each octet can contain any value (0-255) at any position (i.e., there
    may be nulls in the middle). SNMPv2 added the restriction that an OCTET STRING
    may be no longer than 65,535 (i.e., its length must be expressed in 16 bits).


    # OBJECT IDENTIFIER


    This is used to contain SNMP OID values. SNMPv2 added the restriction that an
    OBJECT IDENTIFIER may contain no more than 128 components, each of which must
    be expressed in a maximum of 32 bits.


    # IpAddress


    The IpAddress string is an octet length of four bytes. (Note that this allows
    expression only of Ipv4 addresses.)'
  merge: -1
  pgno: 342
- img_proc: true
  md: "Opaque\n\nThis type is much like OCTET STRING in that it is a string of octets\
    \ with similar restrictions. Opaque was defined to allow extensions of the SMI.\n\
    Defining types based on the Opaque type is strongly discouraged.\n\n# BITS\n\n\
    BITS was defined in SNMPv2 to provide a way to express bit fields of labeled bits\
    \ (i.e., each bit has a separate meaning).\n\n**NOTE** Types that have been removed\
    \ from the later revisions of SNMP are not shown in the list.\n\n# SNMP Tables\n\
    \nIn addition to the simple types described above, tables may be described using\
    \ SEQUENCE and SEQUENCE OF. A table in a MIB is described as a SEQUENCE OF a type\
    \ that describes the entry. The table entry is described as a SEQUENCE containing\
    \ the individual fields of the entry. The entry type describes the columns that\
    \ constitute each row in the table, while the table itself is described as an\
    \ array of these entry structures.\n\nFor example, here's the definition of the\
