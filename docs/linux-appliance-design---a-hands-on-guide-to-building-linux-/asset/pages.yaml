  md: 'The agent refused the request. Why? Remember your configuration file?


    You set a read-only community string, but not a read-write one, so you

    don''t have permission to set any values. You''ll have to configure a read-write

    community name. Add the following line to your snmpd.conf file to configure

    read-write community string writer:


    rwcommunity writer


    Now you''ll need to bring this change to the attention of the SNMP agent.

    Send the agent a SIGHUP signal to make it re-read its configuration. You

    have to do this as:


    ```

    killall -s HUP snmpd

    ```


    Now snmpset again.


    ```

    $ snmpset -c localhost sysContact.0 s "me@myself.com"

    Error in packet.

    Reason:notWritable (that does not support modification)

    Failed object: SNMPv2-MIB:sysContact.0

    ```


    The agent refused again! This time, the reason is a little less obvious.

    The-SNMP agent will refuse requests to set new values if the object''s

    value has been configured in the snmpd.conf file. This is not part of the

    SNMP standard, it is just how Net-SNMP works. It presumes that since you

    configured these values using the snmpd.conf file, you probably won''t

    want someone else changing them remotely. If you want these values to be

    writable, you need to set their values using local snmpset commands, rather

    by using the configuration file.


    > Apologies for leading astray here. Our intent was to highlight this non-obvious
    behavior of Net-SNMP and possibly save you some time later.


