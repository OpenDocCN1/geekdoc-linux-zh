- img_proc: true
  md: "For the most part, it should be clear from the identifiers how fields in this\
    \ data structure correspond to the notions we discussed in the section \"How Video\
    \ Memory Works\" on page 170. The fb_bitfield structs characterize the way pixel\
    \ bits are interpreted when they are used to specify color intensities (in truecolor\
    \ mode).\n\nFor the Laddie appliance, we had no need to modify the variable buffer\
    \ data. In fact, the VESA framebuffer that we used does not easily support modification\
    \ after system startup. If you are using a non-VESA framebuffer and you need to\
    \ modify its configuration at run time, consider the documentation for the fbset\
    \ utility.\n\nThe fixed framebuffer configuration parameters are provided with\
    \ the following data structure (with some omitted), also in fb:h:\n\n```\nstruct\
    \ fb_fix_screeninfo {\n/* identification string \"TT Builtin\" */\nchar id[16];\n\
    unsigned long smem_start; /* Start of frame buffer mem */\n/* (physical address)\
    \ */\n\tuu32 smem_len; /* Length of frame buffer mem */\n\tuu32 type; /* see FB_TYPE_\
    \ */\n\tuu32 visual; /* see FB_VISUAL_ */\n\tuu32 line_length; /* length of a\
    \ line in bytes */\n...\n};\n```\n\nThe main fields we will use are visual, which\
    \ specifies how pixels (e.g., monochromatic, pseudocolor, or truecolor), and line_length,\
    \ which we need when computing the mapping between video memory and the display.\n\
    \nFinally, ioctl requests allow us to retrieve or update the palette (colormap)\
    \ for video modes that one uses.\n\n```\n#define FBIOGGETMAP 0x4604\n#define FBIOPUTCMAP\
    \ 0x4605\n```\n\nWe will show an example of how to update colormaps in the next\
    \ section.\n\nAt this point, we can determine how the pixel data is interpreted,\
    \ so we can also update framebuffer memory in a meaningful way. We could use the\
    \ write system call, as the cat utility does, but making system calls with a different\
    \ system call: mmap. The mmap system call takes the file descriptor for our framebuffer,\
    \ maps the framebuffer into the virtual address space of our process, and returns\
    \ a pointer to the beginning of that memory. With this mapping in place, updating\
    \ the framebuffer becomes as simple as writing to memory.\n\nIn summary, to efficiently\
    \ manipulate the framebuffer, we open the appropriate device file, use ioctl commands\
    \ to establish the graphics hardware configuration, use mmap to provide simple\
    \ access to pixel data, and write the appropriate pixel data for our application."
