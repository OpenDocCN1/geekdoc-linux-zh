- img_proc: true
  md: 'The ::= reads defined as, and mib-2 means that if mib-2 is .1.3.6.1.2.1, then
    system is .1.3.6.1.2.1.1. Each definition describes a single step in the OID tree


    Note that some object identifiers simply describe nodes in the tree structure
    and others describe objects you may actually read (leaf nodes). These are like
    directories and files in a filesystem. In fact, when you try to read sysDesc,
    you must ask for .1.3.6.1.4.1.1.0. This is where we diverge a bit from the filesystem
    analogy. The ending zero says you are retrieving an instance of the object. Scalar
    object identifiers (scalars are just stand-oriented objects not in a table) are
    always .0 (dot zero). In object-oriented terminology, it''s .1.3.6.1.2.1.1 the
    class, while .0 describes an object that is an instance of the class.


    This may make more sense if you think of objects as fields in a table structure
    that must be retrieved by a row index. The table row number would replace the
    zero. For example, ifDesc is a field in a table whose rows describe information
    about a particular network interface on the machine. Another node under mib-2,
    interfaces, is described as


    ```

    interfaces OBJECT IDENTIFIER ::= { mib-2 2 }

    ```


    If you retrieved the ifDesc for the first two interfaces on a system, you might
    get this:


    ```

    interfaces.ifTable.ifEntry.ifDesc.1 = lo

    interfaces.ifTable.ifEntry.ifDesc.2 = eth0

    ```


    Contrast this with what you might retrieve when sysDesc:


    system.sysDesc.0 = Linux localhost.localdomain.2.4.18-27.8.0 1 Fri Mar 14 06:45:49
    EST 2003 1686


    .1 and .2 at the end of the ifDesc OIDs identify the table row from which they
    were retrieved. In SNMP table rows are numbered from 1, which leaves 0 to indicate
    a scalar.


    The SMI description of a MIB is normally distributed in a MIB file. This is a
    text file containing the unambiguous description of a portion of the universal
    MIB. Sometimes descriptions of individual tables are placed in separate files.
    Other files just contain common objects or definitions, such as conventions, used
    by a set of other MIB files. Generally, a private MIB for a particular product
    is described in a single file or a small set of MIB files, importing types and
    conventions as needed from other files, much like the use of the #include statement
    in the C language.


    The MIB file is used as a formal definition of the MIB for humans, but it is also
    used programmatically to interpret SNMP responses for display to human beings.
    (We''ll see this below.) MIB files, therefore, must be syntactically correct as
    any computer program.'
