    # LCDs


    Small liquid crystal displays (LCDs) are standard interfaces for consumer appliances.
    Your use of an LCD will depend on the nature of your appliance and your customer''s
    expectations, but there are several reasons to include an LCD in your design:


    **Primary UI** A text-based LCD display can be the primary UI for your appliance.
    This is often the case for audio equipment, such as satellite receivers and network-attached
    audio players.


    **Reliability** Network equipment often needs fail-safe access to configuration
    and status information. While using a serial port and a CLI is common, high-end
    network appliances often provide a keypad and LCD on the front panel for configuration.


    **Perceived value** There is nothing like an LCD (or even a vacuum fluorescent
    display) to distinguish one beige box from its competitors and to convince customers
    that they are buying a high-end piece of equipment.


    There are two common architectures used to interface an LCD to an appliance. The
    first is to have the Linux processor drive the LCD directly. This architecture
    is appropriate for low-cost, low-power, and high-volume appliances that require
    a graphic display. Common uses of this architecture include PDAs and cell phones.
    Several members of the ARM processor have on-chip support for LCD displays. Examples
    include the EP9307 from Cirrus Logic and the AT91SAM26 from Atmel. Chapter 11
    describes how to build a UI for memory-mapped graphics displays.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'The second common architecture is to have the Linux processor deal with the
    LCD through a controller chip that is attached to a serial, parallel, or USB port.
    This architecture is appropriate for small production runs and appliances based
    on personal motherboards.


    LCDs for this architecture usually have one to four lines of text with between
    10 and 40 characters per line. The most common controller chip for displays is
    the ubiquitous HD4470, originally from Hitachi, now available from several vendors.
    Displays with the HD4478 usually have parallel input, but many have a daughter
    card that offers a serial or USB input, keyboard scanning, and LED outputs. Some
    displays with a daughter card give you the ability to flash memory to display
    when the unit is first powered up. Programmable power-up text is particularly
    important for an appliance since responsiveness is critical to a successful UI.
    Displays with a daughter card and flash memory also have a programmable character
    set, which is useful if you want to display a logo or other simple graphic. We
    will have much to say about the HD44780 in this chapter when we review Laddie''s
    front panel hardware.


    There are several web pages and packages that support alphanumeric LCDs under
    Linux. Two websites that you may find of particular value are http://lcd4linux.sourceforge.net
    and http://lcdproc.org. Alphanumeric LCD displays with serial, parallel, or USB
    inputs are available from several vendors. There are a few you might want to consider:


    +   - Scott Electronics, Inc. (http://www.seetron.com)

    - Crystalfontz America, Inc. (http://www.crystalfontz.com)

    - Matrix Orbital, Inc. (http://www.matrixorbital.com)

    - Cwlinux Limited (http://www.cwlinux.com)

    - Decade Engineering (http://www.decadenet.com)

    - EarthLCD (http://store.earthlcd.com)


    Using a standard I/O port does not preclude having a graphic display. For example,
    Decade Engineering''s BOB-4 takes commands and characters from a serial port and
    outputs to composite video, and the eZLCD from EarthLCD is a color graphic LCD
    with a 240-by-160-pixel resolution.


    # Designing a Front Panel UI


    This section gives some tips on how to build a front panel UI. We''ll discuss
    various approaches to building a menu system for LCD displays, and we''ll offer
    some ideas on how to make your front panel response as soon as possible after
    your user powers on the appliance.


    # Be Simple


    The primary goal of an appliance is to do one thing well. To call your product
    an appliance is to promise that you will not overwhelm users with'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'functions and options that they do not need. Your goal is to keep the appliance
    simple enough that a new or non-technical user can install the appliance in a
    few minutes without reading the manual. You can accomplish this by having reasonable
    defaults and by designing the UIs so they are easy to navigate. You can give technical
    and sophisticated users access to all configuration options, but you should hide
    this complexity from novices by putting it in an “Advanced Options” sub-menu.


    The simplest UI would be the buttons, LEDs, and LCDs on the front panel. When
    you design your front panel, consider assigning one button or LED to one function
    or status. one-button interface is especially useful for the most common functions.


    # Try, Fail, Try Again


    Don''t expect to get your front panel right on the first try. It is very difficult
    to accurately anticipate what kind of menu flow and button labeling will be the
    most intuitive for users. Don''t be afraid to wear out the good of your friends
    and neighbors by giving them a mock-up of your appliance and asking them to navigate
    the menu system. You may need to build and try several panels before choosing
    the right one for your appliance.


    We''ve found several tricks that help in this area. The first is to build a prototype
    design using interchangeable faceplates. Install the paper faceplate, and ask
    new users to perform specific tasks. How quickly and easily the new users can
    navigate the menu system is the major criteria we used to select the best menu
    layout for Laddie. Figure 10-2 shows the paper faceplates we used for prototyping
    the Laddie front panel.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_176_0.png)


    Figure 10-2: A front panel with paper faceplates


    Another technique is to recognize that a menu system is a state machine and can
    be stored as a table. Instead of hard coding the states and transitions in a program,
    build a table that contains the state, event, next state, and processing to perform.
    Store the state transition table in a separate file and load it when the LCD UI
    program initializes.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'While nothing beats the user feedback from using real front panel hardware,
    you may find that you want to start by building a working prototype of the front
    panel using a web page, Tcl/Tk, or a character interface built with the curses
    library. You''ll appreciate able to test various front panel designs before specifying
    your front panel hardware. An advantage of a web or Tcl/Tk version of the front
    panel is that you can use it as another type of UI on the finished appliance.
    For instance, we''ve found that the curses version of the Laddie front panel is
    easier to use and more capable than the Laddie CLI, though rough in an xterm session.


    Laddie has front panel emulators written using curses, Tcl/Tk, and JavaScript
    combined with PHP. The web-based front panel uses an image map on top of a photograph
    of the front panel hardware. The Tcl/Tk version is shown in Figure 10-3.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_177_0.png)


    Figure 10-3: A Laddie front panel implemented in Tcl/Tk


    # Use LCD Menus and Modes


    If your appliance has an LCD display, you can add menus and status to your front
    panel UI. A *menu*, in this context, is a linear list of items to select. These
    items might be commands, configuration settings, or pathways into sub-menus. The
    interface will need to have buttons that allow users to navigate the list and
    select desired items. Common navigation buttons include next item, previous item,
    select this item, and previous menu. The best way to avoid building a menu system
    that is a maze of twisty passages, all alike is to map out the menu system with
    a state transition diagram. Try to keep your transition diagram orthogonal so
    that directions like up, down, left and right have meaning. Many LCD menu systems
    treat the LCD display as a window that sees part of the state transition diagram.
    An assembly from Matrix Orbital is made for this kind of menu structure is shown
    in Figure 10-4.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_177_1.png)


    Figure 10-4: A typical front panel with menu navigation buttons'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'You can save on cost and front space by eliminating the Up and Left buttons
    and having the Down and Right buttons wrap from the last menu option back to the
    first. Of, some type of Enter button would be required.


    Most LCD-based UIs operate in one of two modes: they display status if no buttons
    are pressed, and they display a menu when a button is pressed. For example, some
    printers have a one-line LCD that reports Ready if there is no activity, shows
    Printing if it is receiving or printing, and enters a configuration menu if any
    button is pressed. Laddie has three modes: one to display log messages, and one
    to display a menu for configurations changes and clearing alarms.


    # Be Quick!


    The rule of thumb is that the front panel UI should be functional within two seconds
    of turning on the appliance. This section discusses common techniques that can
    help you meet this goal.


    # Boot Linux Faster


    There is quite a bit that can be done to improve the boot time for Linux. One
    technique avoids boot entirely by doing a suspend and resume. A suspend copies
    the memory and state of the computer to a file or disk partition. A resume loads
    the previously saved memory. To set up a suspend and resume on your system, build
    your kernel with software enabled, and get your appliance into the state that
    you want your users to see after power on. Issue the suspend command (this may
    be hibernate, suspend, swsus, or a write into /proc, depending on your system)
    to save the system to the swap partition. Properly handled, the suspend image
    on your appliance can actually be the software that runs on your appliance. And
    you can configure scripts that can run on suspend and resume, and you can modify
    these scripts to restart network connections and to reset the clock. See http://www.suspend2.net
    for more details. Be sure to read the HOWTO Keep image mode.


    Software suspend does not improve the load time for the kernel itself, but there
    are several techniques that do. For example, you can build your kernel with module
    support disabled and with only the minimum number of device drivers that you need.
    This reduces the time needed to load modules and should remove the need for an
    initial RAM disk (initrd). You might be able to avoid loading the kernel entirely
    if you execute it directly from ROM or flash memory. This technique is called
    execution in place Using the kernel option quiet to disable print messages during
    boot can save several hundred milliseconds. And many other techniques are explained
    on the Consumer Electronics Forum website at http://www.celinusforum.org.


    After the kernel starts, the first program to run is usually /sbin/init, which
    executes the script /etc/rc.d/rc.sysinit. The rc.sysinit file sets up variables
    and starts the other init scripts. On a consumer appliance you should'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'probably replace the entire set of init scripts with one or two custom scripts.
    This can be a lot of work, but the time savings can be tremendous. A good way
    is to boot your system with the kernel option init=/bin/sh and manually bring
    up your appliance one command at a time. Try to get the button and LED UIS running
    as quickly as possible, deferring the non-front panel programs until the end of
    the initialization. Start programs in the back-ground if you can, but be careful
    not to background a program if it complete before another program you need start.
    The InitNG package by Jimmy Wennlund is a popular init script alternative that
    is optimized for a faster boot.


    If the above techniques are not sufficient to get your front panel working quickly,
    you may want to add a microcontroller to your design.


    # Use a Microcontroller


    You can use a microcontroller to handle the buttons, LEDs, and LCD in your UI.
    Microcontrollers are single-chip computers with on-board RAM, ROM, CPU, and I/O.
    Common microcontrollers include the Microchip PIC and the ATM AVR¹. These controllers
    are a great way to display messages on an LCD immediately after boot and make
    the buttons and keypad responsive immediately. After-power, the user will usually
    display the DVD player as an example, insert a disc, close the drawer, and press
    Play. If the drawer mechanism is tied directly to your Linux system, the user
    must wait for Linux to boot before starting the above. If, on the other hand,
    you have a microcontroller handling the drawer mechanism and Open button, you
    can immediately display Ready on the LCD and make the button usable. By the time
    the user has opened the drawer, loaded the disc, and pressed Play, the Linux part
    of the DVD player will probably be booting. Of course, once Linux is running,
    it will want to control the drawer mechanism directly by controlling the microcontroller
    as one of its peripherals.


    # Use the Main CPU as a Microcontroller


    Adding a microcontroller increases the cost, power requirement, and printed circuit
    board space of an appliance. An alternative is to carve out a piece of the main
    CPU to use as a microcontroller while Linux is starting. You can modify the bootstrap
    to set a timer interrupt and use the interrupt handler to provide a front panel
    UL. You will need to modify Linux so that it does not touch the timer or interrupt
    handler while booting. Once Linux is running, it can take over the timer and interrupt,
    making the front panel hardware just another device that it manages. This technique
    describes a form of virtual machine (VM); as they become more popular, you will
    find that a VM provides all the hooks necessary to be used as an I/O controller.


    # Don''t Shut Down


    A common technique to make an appliance more responsive is to never shut it down
    Instead, you can build your appliance to enter a low power state


    > ¹You can program the Atmel AVR using C on a Linux workstation. See http://www.avrfreaks.org
    for more information.'
  merge: -1
