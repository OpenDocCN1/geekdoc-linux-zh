- img_proc: true
  md: 'Two fields are used to specify the destination: destype and destname. There
    is a separate table for each type of destination. This is necessary because, for
    example, an email destination needs different configuration information than an
    SNMP trap destination. The type of the destination and its destination table are
    set by the destype field. There are nine valid destination types. The types for
    1 and 2 are not included in Table 7-3, since they are strictly source types.


    # Table 7-3: The Valid Destination Types


    | destype | Destination Table | Meaning |

    | 0 | None | No destination (useful for collecting statistics) |

    | 3 | NetDest | Accepted TCP connections |

    | 4 | NetDest | Outgoing TCP connections |

    | 5 | NetDest | UDP socket destinations |

    | 7 | FileDest | File (includes both FIFOs and regular files) |

    | 8 | PdbDest | PostgreSQL (or an RTA table) |

    | 9 | SmpDest | SNMP trap destinations |

    | 10 | MailDest | Email destinations |

    | 11 | TblDest | logmux''s internal table for output messages |


    There can be several destinations described in each of the destination tables.
    Each destination has its own unique name (a destname) in one of the destination
    tables. For example, if you have two different SNMP destinations, you can call
    one of them allmsmp and laddiesmp. By giving them different names, you can define
    different routing and rewriting rules for them. To link a filter in the Filters
    table to a specific destination, you need to specify both the destination type
    and destination name.


    Logmux routes messages based on the message''s facility, log level, and on a text
    pattern. These three corresponding fields in the Filters table are *facility,
    level,* and *regex*. The facilities and log levels are the same as defined for
    syslog. The regex pattern is a regular expression used for both pattern matching
    and matching.


    The regex library is a good choice for pattern matching and extraction, since
    the patterns can be precompiled to improve the speed of the pattern matching,
    and regex lets you easily extract subpatterns from the search pattern. In our
    use of logmux, we found that we don''t really need to know how much about regex
    patterns. The following example illustrates what you need to know.


    Say that you are processing the event of a train''s arrival at a station, and
    the log message is *Train from San Jose arriving on Track number 15*. To rewrite
    this message as *San Jose:15*, you must extract the city and the train number.
    The regex pattern to capture the city is *[A-Za-z-]+. This pattern matches any
    combination of at least one upper- or lowercase alphabetic character, space, or
    a dash. For the train number is just *[0-9]+*. Here''s the trick: if you put parentheses
    around a pattern, regex makes that pattern available separately in the regex output.
    The following is a regex pattern to match the message and extract the city and
    train number.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'Train from ([A-Za-z -]+) arriving on Track number ([0-9]+)


    The Filter table''s *rewrite* field contains the snprintf format string used to
    rewrite the log message. The format string contains text of your choosing and
    can contain the strings extracted from the regex pattern. The matches to the regex
    patterns are available as explicit parameters to the snprintf().

    Table 7-4 lists the parameters available to you.


    # Table 7-4: Available Parameters to the snprintf()


    | Parameter | Meaning |

    | --- | --- |

    | %1s to %9s | Up to nine subpatterns |

    | %10s | The entire match and the full regex pattern |

    | %11s | The date and time per the time_fmt field |

    | %12s | A newline character |


    Continuing the example above, you can get the message Jose: 15 with a rewrite
    format string of %1s:%2s.

    You can add a date and time to your rewrite message by including %11s in your
    rewrite string. The format of the date and time is set by the time_fmt field,
    which is passed to strftime() for the conversion. Common examples of time_fmt
    include %F %T, which gives a date and time display of YYYY-MM-DD hh:mm:ss, and
    %R, which displays the time as hh:mm.

    The explicit parameter for a newline is handy, since it can be difficult to get
    a newline character into an RTA table. Remember, to PostgreSQL, \n is a two-character
    string with a backslash and the letter n.

    We''ll show more examples of regex pattern matching and message rewriting in the
    section "Examples Using logmuxd" on page 98.


    # logmuxd Destinations


    Each type of destination has a table to hold the parameters unique to that type.
    You can easily figure out most of the tables and their content by browsing them
    with the RTA table editor, but destination tables serve some additional comments.

    The MailDest table has a subject field that contains the subject of the email
    message to send. The to_list field is a space-separated list of recipients of
    the email. For security reasons, the only characters allowed in to_list are alphanumeric,
    periods, underscores, and (@), and spaces. If you are going to use email as a
    destination, you are to run Sendmail, Postfix, or another mail transfer agent
    on your appliance.

    ThempDest table contains the name of the destination, the IP address of the SNMP
    trap daemon, the community string for the SNMP daemon, the port number, and type
    of trap to send (version 2 trap or version 2 inform). The values in these fields
    are passed as parameters to the snmptrap command, which actually sends the trap.'
