- img_proc: true
  md: 'The alarm daemon uses the data lines as output and the status lines as input.
    Figure 5-6 shows a schematic for one alarm sensor. The daemon initializes the
    parallel port by setting the output pins to 0xff, making pin 2 a high level. When
    the sensor S1 is open, no current flows through the 2K resistor R1, and the voltage
    at pin 15 is pulled high. When the sensor is closed, pin 15 is short to ground
    through pin 21.


    In other words, pin 15 is biased high when the alarm sensor is open and pulled
    low when the sensor is closed. By reading the status lines, includes pin 15, the
    daemon can detect whether the sensor is open or closed. This description applies
    to all five of the status inputs on the parallel port.


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_92_0.png)


    Figure 5-6: A normally open alarm sensor from laddie


    # Laddie’s Software Design


    We used the empty daemon introduced in Chapter 4 to build the empty daemon. But
    whether we used the empty daemon, wrote a select()-based program, or wrote a threads-based
    program, there would still be three subroutines:


    +   - appInit() Initialize hardware. Start timer. Register the Zone table with
    RTA.


    +   - poll_timeout() Read the status lines. Log relevant changes.


    +   - user_update() Send logs for user changes to the alarm status.


    These routines are described in more detail in the next sections.'
