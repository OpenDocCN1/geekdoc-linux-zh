  md: 'Perhaps the most common type of access is to add the path to the CLI executable
    to the /etc/shells file and create a user with the login shell set to the CLI.
    The advantage of this is that the CLI is equally accessible on the serial port,
    over telnet, and over SSH. This is the approach we take for Laddie.


    A very small appliance might not support logins. In this case you can tie standard-in
    and standard-out of the CLI directly to a serial port. The security model here
    is that of physical access to the serial port.


    As we''ll see in the next section, a CLI can be useful if it is used only for
    configuration backup and is only accessible from a web page.


    # The Laddie CLI


    Laddie''s CLI uses a verb-adjective-noun approach; it is not stated, and is line
    oriented, not character oriented. Our commands allow the CLI user to view status,
    view logs, the configuration, and get help. Laddie''s CLI is not complete in that
    it does not allow the user to configure, view or the appliance''s network, SNMP,
    or logging configuration.


    You can get to the Laddie CLI several ways. You can telnet to 192.188.1.11 as
    user cli without a password. You can also telnet to Laddie as root and start Laddie''s
    CLI from the bash prompt with the command cli.


    # Laddie Command Summary


    Here are all of the Laddie CLI commands with their syntax and brief descriptions.


    +   clear [all|1-5] - clear an alarm

    test [1-5] - manually set an alarm

    view - view system status

    view [all|1-5] - view status for a zone

    view logs - list last 20 log messages

    set zone [1-5] enabled [yes|no] - enable or disable a zone

    set zone [1-5] latching [yes|no] - set a zone to latch alarms

    set zone [1-5] name "zone name" - give a zone name

    set zone [1-5] contact [no|nc] - set to normally-open or -closed

    set logs [yes|no] - stream logs to this CLI session

    help - view help on Laddie

    dump - view configuration as CLI commands

    # (comments) - a comment line

    quit - exit the command line interface


    You are already familiar with the configuration of Laddie''s logger, so we will
    give a detailed explanation of every command. There are, however, a few commands
    deserve special mention.


    # set logs on


    One of the few features of Laddie''s logger is that you can open a telnet connection
    to it and have log messages sent to you over the connection.


