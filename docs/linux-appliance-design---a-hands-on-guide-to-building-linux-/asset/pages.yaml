  md: 'The HD4780 can take several milliseconds to execute some commands.

    You can read the status of the display to tell you when to write the next byte,

    or you can do what we did, which is just at least five milliseconds between writes.

    The exact time is dependent on the version of HD4780 that you use.

    For this book we used a display we bought on surplus market, so we had to experiment
    with a little to find the right delay.


    # Design Notes


    While the HD4780-based display can be thought of as a simple ASCII

    terminal, there were a couple of decisions we needed to make when we

    designed our API and device driver. The first was how to handle the RS pin.

    Since both commands and display characters are eight bits in length, we

    could not mix display characters and commands in the same stream.

    Saw three ways to get around this problem: We could send commands

    in act1, we could use an escape sequence to bury the commands in a

    character stream, or we could have two different devices for the display,

    for characters and for commands. We chose to use an escape sequence.

    The HD4780 used no display characters in the range of 0x10 to

    0x1F, so we used 0x10 as the escape code for HD4780 commands and 0x11

    as the escape code for de- for commands to control the front panel LED.


    The other consideration in our design was how to handle the five-

    misecond delay between writes. We could put a usleep(500) between

    writes, but this would have been a problem when updating all 32 characters

    our display. You may recall that the reason for writing a device

    driver was to have a guaranteed scan rate for the keypad.) We handled the

    five-millisecond delay by writing all output bytes into a circular buffer and

    reading one byte from the buffer each time we scanned the keypad. This slowed
    the maximum rate that we can output characters but was simple and

    effective.


    The Linux device driver that we wrote to drive our display is available on

    t CD. Look at the source files under front_panel.


    # Further Reading


    The HD4780 came out some time ago and is in fact no longer

    available. Nonetheless, it set the standard for alphanumeric LCD displays,

    HD4780-compatible parts are still available from several vendors. A

    web search will locate data sheets for several HD4780-compatible parts,

    including the Samsung S0066 we used:


    Our review of the HD4780 is very far complete. If you are consider-

    ing any alphanumeric displays on your appliance, you might want to

    make use of the online resources that we used:


    +   http://www.epemag.wimborne.co.uk/resources.htm A simple but

    complete introduction to HD4780


