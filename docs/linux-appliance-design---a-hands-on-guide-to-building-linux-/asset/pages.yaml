  md: '# Building and Linking


    Now create a test directory under rta-X.Y.Z and copy myapp.c to it. Next,

    build the application with this command:


    ```

    # gcc myapp.c -o myapp -L/usr/local/lib -lrtadb

    ```


    To compile and run the application, we tell the system where to find the

    RTA libraries at runtime. You can edit /etc/ld.so.conf and run ldconfig or

    export the LD_LIBRARY_PATH environment variable. If compile succeeded,

    you be able to run the application with these commands:


    ```

    # export LD_LIBRARY_PATH=/usr/local/lib

    # ./myapp

    ```


    That''s it! Your sample application should be up and running ready

    to respond to PostgreSQL requests.


    # Testing


    In this section we assume you have installed PostgreSQL from your Linux

    distribution or from the version included in this book''s companion CD, and

    the psql command is somewhere on your path. If all has gone well, you

    should now have an application running which pretends to be a PostgreSQL

    database server. Instead of a database, however, our sample application is

    offering its internal table for use by various PostgreSQL clients. The Client

    we will be using first is the command line tool, psql.


    Assuming everything is in order, open another terminal window and

    start psql, specifying the host and port of the database server as follows.

    (Remember that we told our application to listen on port 8888.)


    ```

    # psql -h localhost -p 8888

