    When building your prototype, follow these steps to make sure your circuit is
    operating properly:


    +   1. Build the circuit, but don''t connect the serial port or the IR detector/demodulator.
    In place of the RTS and TXD pins, use a 9V battery for power. Use the positive
    battery terminal in place of the RTS input and the negative terminal in place
    of the TXD output.

    2. Verify the voltage between the regulator output and the negative battery terminal
    is 5V.

    3. Verify that the voltage between the circuit output and the negative battery
    terminal is at least 5V. (The "circuit output" is the point that you will connect
    to the DCD pin of the serial port.)

    4. Now connect the end of R1 to the 5V output of the regulator, and verify that
    the voltage between the circuit output and the negative terminal is zero volts.

    5. Finally, complete the circuit by adding the IR detector/demodulator and connecting
    your computer''s serial port.


    The remaining tests for your IR receiver hardware require the LIRC software. In
    the next section, we''ll introduce the LIRC software package and describe how
    we incorporated it into the Laddie appliance.


    # Installing and Configuring LIRC for the Laddie Appliance


    The LIRC software package can be downloaded from http://www.lirc.org; it includes
    an extensive collection of device drivers, daemons, and tools for controlling
    user applications with remote control hardware. We don''t have room to cover all
    of these elements, but we will present the layers that make up this software architecture,
    and we will describe in detail the particular device driver and daemon that are
    appropriate for the Laddie appliance. Once you''ve understood this subset, you
    should find it easy to master any other parts of the architecture required for
    your own appliance.


    Figure 12-12 provides a high-level view of the LIRC software architecture as it
    applies to the Laddie appliance. At the right of the diagram, we''ve shown elements
    of the LIRC architecture correspond to our earlier, more general discussion of
    IR receivers.'
