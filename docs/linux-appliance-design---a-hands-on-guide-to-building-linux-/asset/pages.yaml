    \ oldkey1 = 0;\nint oldkey2 = 0;\n\n// Scan the keypad waiting for a new key to\
    \ be pressed.\n// Return the ASCII value of the key.\nchar getkeypad() {\n   \
    \ // Shift values for debounce and get current value\n    oldkey2 = oldkey1;\n\
    \    oldkey1 = oldkey2;\n    oldkey0 = scan2x2(); // get current key status\n\
    \    // new key if CLOSED and all previous values are OPEN\n    if ((oldkey0 !=\
    \ 0) && (oldkey1 == 0) && (oldkey2 == 0)) {\n        return(oldkey0);\n    }\n\
    \    mdelay(10); // scan rate is once every 10 milliseconds\n}\n```\n\nIt is important\
    \ that the scan rate for a keypad is constant. It is possible to do keypad scanning\
    \ in a user-space program, but you may find that the scan rate varies widely and\
    \ that the program uses more of the CPU than necessary. It is best to use a real-time\
    \ Linux kernel to get accurate timing if you want to scan from user space, or\
    \ what we do for Laddie: Put the keypad scanning into a simple character device\
    \ driver so that accurate timing is provided by the Linux kernel.\n\n# LEDs\n\n\
    Using light-emitting diodes (LEDs) is one of the most intuitive, easiest, and\
