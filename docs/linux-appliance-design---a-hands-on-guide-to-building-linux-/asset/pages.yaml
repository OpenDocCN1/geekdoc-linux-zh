  md: '# Summary


    In Chapter 14 you learned how to create a MIB to match an application, and in
    this chapter you learned how to create a MIB extension for the Net-SNMP agent
    to implement that MIB, as well as how to use the PostgreSQL interface library
    and RTA to retrieve the MIB data values from another daemon process. At this point
    you should feel comfortable that you could do yourself from scratch.


    You should also feel familiar enough with the structure of MIB and a Net-SNMP
    agent extension to hack new objects into the MIB and the code. There is no need
    to go back through generating skeleton code (mostly mid2c: cut-and-paste work),
    all you have to add is the new objects to the MIB file, define new numbers for
    these variables in the list of defines, add the appropriate rows to the ladProject_variables
    array, and then add cases to the appropriate switch statements. Just keep in mind
    that while you can add things to a MIB, you cannot reassign OIDs. If you always
    add to the end of a branch, you should be in good shape.


    In Chapter 14 we mentioned that we had neglected to include the edge and input
    columns from our Laddie table in our MIB. A good test of your understanding of
    these two chapters would be to go back and add one or both of these fields to
    the MIB and agent yourself.'
