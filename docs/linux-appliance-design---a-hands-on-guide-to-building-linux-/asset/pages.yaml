  md: '# # 14


    # ## DESIGNING AN SNMP MIB


    ![](img/ab18faa434b6e1e10df0a92984bf70fc_266_0.png)


    If you read the previous chapter, you already have some idea of why you may need
    an SNMP interface and how it can be useful. In this chapter and the next, you''ll
    see the information specific to an appliance can be added to this interface. Like
    the web, LCD, and CLI interfaces, the SNMP interface will also be based on the
    information available from RTA tables within the Laddie application itself.


    This chapter is concerned primarily with the design of the MIB and creation of
    a valid MIB file. The topics covered here are:


    +   - Applying for an enterprise number

    - Designing the MIB

    - Creating the MIB file

    - Validating the MIB


    You will learn how to implement the agent in the next chapter.'
