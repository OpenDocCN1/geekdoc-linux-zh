  md: '# Filters


    ```

    mireille ~~/test> uptime | tee -a file2

    11:10:51 up 21 days, 21:21, 57 users, load average: 0.04, 0.16, 0.26


    mireille ~~/test> cat file2

    Thu Jun 10 11:10:34 CEST 2004

    11:10:51 up 21 days, 21:21, 57 users, load average: 0.04, 0.16, 0.26

    ```


    When a program performs operations on input and writes the result to the standard
    output, it is called a filter. One of the most common uses of filters is restructure
    output. We''ll discuss a couple of the most important filters below.


    # More about grep


    As we saw in the section called "The grep command", **grep** scans the output
    per line, searching for matching patterns. All lines containing the pattern will
    be printed to standard output. This behavior can be reversed using the -v option.


    Some examples: suppose we want to know which files in a certain directory have
    been modified in February:


    ```

    jenny:-> ls -la | grep Feb

    ```


    **grep** command, like most commands, is case sensitive. Use the -i option to
    make no difference between upper and lower case. Lot of GNU extensions are available
    well, such as --color, which is helpful to highlight searchterms in long lines,
    and --after-context, which prints the number of lines after the last matching
    line. You can use a recursive **grep** that scans all subdirectories of encountered
    directories using the -r option. As usual, options can be combined.


    Regular expressions can be used to further detail the exact matches you want to
    select out of all the input lines. The best way to use regular expressions is
    to read the **grep** documentation. An excellent chapter is included in the **grep**
    info. Since it would lead us too far discussing the in and out of regular expressions,
    it is strongly advised to start here if you want to know more about them.


    Play around a bit with **grep**, it will be worth the trouble putting some time
    in this most basic very powerful filtering command. The exercises at the end of
    this chapter will help you get started, see the section called "Exercises".


    # Filtering output


    The command **sort** arranges lines in alphabetical order by default:


    ```

    thomas:-> cat people-I-like | sort

    Auntie Emmy

    Boyfriend

    Dad

    Grandma

    Mum

    My boss

    ```'
