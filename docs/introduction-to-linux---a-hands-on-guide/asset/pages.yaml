  md: '# Networking


    # Authentication keys


    The ssh-keygen command generates, manages and converts authentication keys for
    ssh. It can create RSA keys for use by SSH protocol version 1 and RSA or DSA keys
    for SSH protocol version 2.


    Normally each wish to use SSH with RSA or DSA authentication runs once to create
    the authentication key in $HOME/.ssh/identity_id_dsa or id_rsa. Additionally,
    the system administrator may use this to generate host keys for the system.


    Normally this program generates the keys and asks for a file in which store the
    private key. The public key is stored in a file with the same name .pub appended.
    The program also asks for a passphrase. The passphrase may be empty to indicate
    no passphrase (host keys must have an passphrase), or it may be a string of arbitrary
    length.


    There is no way to recover a lost passphrase. If the passphrase is lost or forgotten,
    a new key must be generated and copied to the corresponding public keys.


    We will study SSH keys in the exercises. All information can be found in the man
    or Info pages.


    # VNC


    VNC or Virtual Network Computing is in a fact remote display system which allows
    viewing a desktop environment not on the local machine which it is running, but
    from anywhere on the Internet and from a wide variety of machines and architectures,
    including MS and several Unix distributions. You could, run MS Word on a Windows
    NT machine and display the output on your Linux desktop. VNC provides servers
    as well as clients, so the opposite also works and it may be used to make connections
    on a PC. The following features make VNC different from a normal server or X for
    commercial implementations:


    +   - No state is stored at the server side: you can leave your desk and resume
    from another machine, continuing where you left. When you are running a PC server,
    and the PC crashes or is restarted, all applications that you were running die.
    With VNC, they keep on running.


    +   - It is simple and simple, no installation needed, can run from a floppy if
    needed.


    +   - Platform independent with the Java client, runs on everything that supports
    X.


    +   - Sharable: one desktop may be displayed on multiple viewers.


    More information can be found in the VNC client pages (man vncviewer) or on the
    VNC website [http://www.realvnc.com/].


    +   - Free.


    # The desktop protocol


    In order to ease management of Windows hosts, recent Linux distributions support
    the Remote Desktop Protocol (RDP), which is implemented in the rdesktop client.
    The protocol is used in a number of Microsoft products, including Windows NT Terminal
    Server, Windows 2000 Server, Windows XP and Windows 2003 Server.


    Surprise your friends (or management) with the fullscreen mode, multiple types
    of keyboard layouts and single application mode, just like the real thing. The
    man rdesktop manual provides more information. The project''s homepage is at http://www.rdesktop.org.'
