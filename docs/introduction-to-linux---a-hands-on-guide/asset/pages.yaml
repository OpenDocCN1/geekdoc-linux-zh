  md: '# Introduction


    The first chapter is an introduction to the subject on Linux; the next two discuss
    absolute basic commands. Chapters 4 and 5 discuss some more advanced but still
    basic topics. Chapter 6 is needed for continuing with the rest, since it discusses
    editing files, an ability you need to pass from Linux newbie to Linux user. following
    chapters discuss somewhat more advanced topics that you will have to deal with
    in everyday Linux use.


    All chapters come with exercises that will test your preparedness for the next
    chapter.


    +   * Chapter 1, *What is Linux?*: What did it come into existence, advantages
    and disadvantages, what does the future hold for Linux, for who use it, installing
    your computer.

    * Chapter 2, *Quickstart*: Getting connected, connecting to the system, basic
    commands, where to find help.

    * Chapter 3, *About files and the file system*: The filesystem, import and directories,
    managing files and protecting your data.

    * Chapter 4, *Processes*: Understanding and managing processes, boot and shutdown
    procedures, postpone repetitive tasks.

    * Chapter 5, *I/O redirection*: What are standard input, output and error how
    are these features used from the command line.

    * Chapter 6, *Editors*: Why you should learn to work with an editor, discussion
    of the most common editors.

    * Chapter 7, *Home sweet /home*: Configuring your graphical, text and audio environment,
    settings for the non-native English speaking Linux user, tips for adding extra
    software.

    * Chapter 8, *Printers and printing*: Converting files to a printable format,
    getting them out of the printer, hints for solving print problems.

    * Chapter 9, *Fundamental Backup Techniques*: Preparing data to be backed up,
    discussion of various tools, remote backup.

    * Chapter 10, *Networking*: Overview of Linux networking tools and user applications,
    with a short discussion of the underlying service daemon processes and secure
    networking.

    * Chapter 11, *Sound and Video*: Sound and video, including Voice over IP and
    sound recording is discussed in this chapter.


    +   * Appendix A, *Where to go from here?*: Books to read and sites to visit when
    you have finished reading one.


    +   * Appendix B, *DOS versus Linux commands*: A comparison.


    +   * Appendix C, *Shell Features*: If you ever get stuck, these tables might
    be an an outcome. Also a good argument when your boss insists that YOU should
    use HIS favorite shell.'
