- img_proc: true
  md: '# Processes


    --cut-->


    Feel free to configure unused run levels (commonly run level 4) as you see fit.
    Many users configure those run levels in a way that makes the most sense for them
    while leaving the standard run levels as they are by default. This allows them
    to move in and out of their custom configuration without disturbing the normal
    set of features at the standard run levels.


    If you get into a state where it will not boot due to a /etc/initabb or will not
    let you in because you have a corrupted /etc/passwd file (or if you simply forgotten
    your password), boot into single-user mode.


    # No graphics?


    When you are in text mode you didn''t presented a graphical login screen on the
    console of your machine, you can normally switch to 7 or to have a graphical login.
    If this is set to something else than the default from /etc/initabb, check that
    the run level using the command -r. If the system does not start up in graphical
    mode by default. Contact your system administrator or run man init in that. Note
    that switching run levels is preferably using the telinit command; switching from
    a graphical console or vice versa does not involve a run switch.


    The discussion of run levels, scripts and configurations in this guide tries to
    be as general as possible. Lots of variations exist. For instance, Linux stores
    scripts in /etc/run levels. Other systems might first run through (a) lower run
    level(s) and execute all the scripts there arriving at the final run level and
    executing them. Refer to your system documentation for more information. You might
    also read through the scripts that are referred to in /etc/initabb to get a better
    comprehension of what happens on your system.


    # Tools


    The chconfig or update-rc.d tools, when installed on your system, provide a command-line
    tool for maintaining the /etc/init.d directory hierarchy. These relieve administrators
    from having to manually manipulate the symbolic links in the directories under
    /etc/rc[x].d.


    In some systems use ntsys tool, which provides a text-based interface; you may
    find this easier to use than chconfig''s command-interface. On SuSE Linux, you
    will find the yast and insert tools. For Mandrake, you may want to use Drakconf,
    which allows many other features switching between run levels 3 and 5. In Mandriva
    this is the Mandriva Linux Control Center.


    Most distributions provide a graphical user interface for configuring processes,
    with your system documentation.


    All of these must be as root. The system administrator may manually create the
    appropriate links in each run level directory in order to start or stop a service
    in a certain run level.


    # Shutdown


    UNIX was not made to shut down, but if you really use, use the shutdown command.
    After completing the procedure, the -h option will halt the system, -r will reboot
    it.


    The reboot and halt commands are now able to invoke shutdown if the system is
    in run levels 1-5, and ensure proper shutdown of the system,but it is a bad to
    get into, as not all UNIX/Linux versions have this feature.


    If your computer does not power down, should not turn off the computer until you
    see a message indicating that the system is halted or finished shutting down,
    in order to give the system time to unmount all partitions. Being impatient may
    cause data loss.'
