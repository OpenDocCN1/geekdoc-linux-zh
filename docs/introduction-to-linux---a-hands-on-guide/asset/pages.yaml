    # Performance


    To a user, performance means quick execution of commands. To a system manager,
    on the other hand, it means much more: the system has to optimize system performance
    for the whole system, including users, all programs and daemons. System performance
    can depend on a thousand things which are not accounted for by the time command:


    +   - the program executing is badly written or not use the computer appropriately

    - access to disks, controllers, display, all kinds of interfaces, etc.

    - reachability of remote systems (network performance)

    - amount of users by the system, amount of users actually working simultaneously

    - time of day

    - ...


    # Load


    In short: the load depends on what is normal for your system. My old P133 running
    a firewall, SSH server, file route, a router, a daemon server, a proxy server
    and some other services don''t complain with 7 users connected; the load is still
    0 on average. Some (multi-CPU) systems I''ve seen quite a load of 6. There is
    only one way to find out - check the load regularly if you want to know what''s
    normal. If you don''t, you will only be able to measure system load from the response
    of the command line, which is a very rough measurement since this period is influenced
    by a hundred factors.


    Keep in mind that different systems will behave different with the same load average.
    For example, a system with a graphics card supporting hardware acceleration will
    have no problem rendering 3D images, while the same with a cheap VGA card will
    slow tremendously while rendering. My old P133 will become quite uncomfortable
    when I start the X, but on a modern system you would notice the difference in
    the system load.


    # Can I do anything as a user?


    A big environment can slow you down. If you have lots of environment variables
    set (instead of shell variables), long search paths that are not optimized (errors
    in setting the path environment variable) and more of those that are used "on
    the fly", the system will need more time to search and read data.


    In X, window managers and desktop environments can be real CPU-eaters. A fancy
    desktop comes with a price, even when you can download it for free, most desktops
    add-ons ad infinitum. Modesty is a virtue if you don''t buy a new computer every
    year.


    # Priority


    The priority or importance of a job is defined by its nice number. A program with
    a high number is friendly to other programs, other users and the system; it is
    not an important job. The lower the number, the more important a job and the more
    resources it will take without sharing them.


    Making a job nicer by increasing its nice is only useful for processes that use
    a lot of CPU time (compilers, math applications and that always use a lot of I/O
    time are automatically'
