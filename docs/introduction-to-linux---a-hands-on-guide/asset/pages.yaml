  md: 'the new files will actually seem to be tar, and will not be included in an
    incremental backup made using the -N option.


    A better choice would be the -g option, which will create a list of files to backup.
    When incremental backups, files are checked against this list. This is how it
    works:


    ```

    jimmy:> tar cvpf work-20030121.tar -g snapshot-20030121 work/

    work/

    work/file1

    work/file2

    work/file3

    ```


    ```

    jimmy:> file snapshot-20030121:ASCII text

    ```


    The next day, user jimmy works on file3 a bit more, and creates file4. At the
    end of the day, he makes a backup:


    ```

    jimmy:> tar cvpf work-20030122.tar -g snapshot-20030121 work/

    work/file3

    work/file4

    ```


    These are some very simple examples, but you could also use this kind of command
    in a cronjob (see the section called "Cron and crontab"), which specifies for
    instance snapshot for the weekly backup and for the daily backup. Snapshot files
    should be replaced when taking backups, in that case.


    More information can be found in the tar documentation.


    # The real stuff


    As you could notice, tar is OK when we are talking about a simple directory, a
    set of files that belongs together. There are tools that are easier to manage,
    however, when you want to archive entire partitions or disks larger projects.
    We explain why tar because it is a very popular tool for distributing archives.
    It will happen often that you need to install a software that comes in a so-called
    "compressed tar". See the section "Using rsync" for an easy way to perform regular
    backups.


    # Compressing and unpacking with gzip and bzip2


    Data including, can be compressed using zip tools. The gzip command will add the
    suffix .gz to the file name and remove the original file.


    ```

    jimmy:> ls -la | grep tar

    -rw-r--r-- 1 jimmy jimmy 61440 Jun 6 14:08 images-without-dir.tar

    ```


    ```

    jimmy:> gzip images-without-dir.tar.gz

    -rw-r--r-- 1 jimmy jimmy 50562 Jun 6 14:08 images-without-dir.tar.gz

    ```


    Uncompressed zipped files with the -d option.'
