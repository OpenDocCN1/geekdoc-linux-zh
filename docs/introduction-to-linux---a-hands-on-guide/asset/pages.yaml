  md: 'The environment variables are managed by the shell. As opposed to regular shell
    variables, environment variables are inherited by any program you start, including
    another shell. New processes are assigned a copy of these variables, which they
    can read, modify and pass on in turn to their own processes.


    There is nothing special about variable names, except the common ones are in uppercase
    characters by convention. You may come up with any name you want, although there
    are standard variables that are important to be the same on every Linux system,
    such as PATH and HOME.


    # Exporting variables


    An individual variable''s content is usually displayed using the echo command,
    as in these examples:


    ```

    debb:-> echo $PATH

    /usr/bin:/sbin:/bin:/usr/X11R/bin:/usr/local/bin

    ```


    ```

    debb:-> echo $MANPATH

    /usr/man:/man/:/usr/local/man:/usr/X11R/man

    ```


    If you want to change the content of a variable in a way that is useful to other
    programs, you have to export the new value from your environment into the environment
    that it runs. A common example is exporting the PATH variable. You may declare
    it as follows, in order to be able to play with the flight simulator software
    that is in /opt/FlightGear/bin:


    ```

    debb:-> PATH=$PATH:/opt/FlightGear/bin

    ```


    This instructs the shell to only search programs in the current path, $PATH, but
    also in the additional directory /opt/FlightGear/bin.


    However, as the new value of the PATH variable is not known to the environment,
    things will not work:


    ```

    debb:-> runfgfs

    bash: runfgfs command not found

    ```


    Exporting variables is done using the shell built-in command export:


    ```

    debb:-> export PATH

    ```


    ```

    debb:-> runfgfs

    --flight simulator starts--

    ```


    In Bash, normally we do this in one line:


    ```

    export VARIABLE=value

    ```


    The technique is used for the MANPATH variable, that tells the man command where
    to look for compressed man pages. If new software is added to the system in new
    or unusual directories, the documentation for it will probably also be in an unusual
    directory. If you want to read the man pages for the new software, extend the
    MANPATH variable:'
