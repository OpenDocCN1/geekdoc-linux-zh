  md: '# The X Window System


    The X Window System is a network-transparent window system which runs on a wide
    range of computing and graphics machines. X Window System servers run on computers
    with bitmap displays. The X server distributes user input and accepts output requests
    from several client programs through a variety of different process communication
    channels. Although the most common case is for the client programs to be running
    on the same machine as the server, clients can run transparently from other machines
    (including machines with different architectures and operating systems). We will
    learn how to do this in Chapter 10, Networking on networking and remote applications.


    X supports hierarchical sub-windows and text and graphics operations, on both
    monochrome and color displays. The number of X client programs that use the X
    server is quite large. Some of the programs provided in the X Consortium distribution
    include:


    +   * xterm: a terminal emulator

    * twm: a minimalistic window manager

    * xdm: a display manager

    * xconsole: a console redirect manager

    * bitmap: a bitmap editor

    * xauth, xhost and iceauth: access control programs

    * xset, xmodmap and others: user preference setting programs

    * xclock: a clock

    * xfonts and others: a font display, utilities for listing information about fonts,
    windows and displays

    * xfs: a font server

    * ...


    We refer again to the man pages of the commands for detailed information. More
    explanations are available in the Xlib - C language X Interface that comes with
    your X distribution, the X Window System Protocol specification, and the various
    manuals and documentation of X toolkits. /usr/share/doc directory contains references
    to these documents and many others.


    Many other utilities, window managers, games, and gadgets are included as userconfigured
    software in the X Consortium distribution, or are available using anonymous FTP
    on the Internet. Good places to start are here http://www.x.org and http://www.xfree.org.


    Furthermore, all your graphical applications, such as your browser, your E-mail
    program, your image programs, sound playing tools and so, are all clients to your
    X server. Note that in normal operation, that is in graphical mode, X clients
    and the X server on Linux run on the same machine.


    # Display names


    From the user''s perspective, every X server has a display name in the form of:


    ```

    hostname;displaynumber.screennumber

    ```'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'This information is used by the application to determine how it should connect
    to the Server and which screen it uses by default (on displays with multiple monitors):


    +   - hostname: The host name specifies the name of the client machine which the
    display is physically connected. If the host name is not given, the most efficient
    way of communicating to a server on the same machine will be.


    +   - display-number: The phrase "display" is usually to refer to a collection
    of monitors that share a common keyboard bond and pointer (mouse, tablet, etc.).
    Most workstations tend to have only one keyboard, and therefore only one display.
    Larger, multi-user systems, however, frequently have several displays so more
    than one person can do graphics at work. To avoid confusion, each display on a
    machine is assigned a display number (beginning at 0) when the X server for that
    display is started. The display number must always be given in a display name.


    +   - screen number: Some displays share a single keyboard and pointer among two
    or more monitors. Each monitor has its own set of windows, each screen assigned
    a screen number (beginning at 0) when the X server for that display is started.
    If the screen is not given, 0 will be used.


    On POSIX systems, the display name is stored in your DISPLAY environment variable.
    The variable is set automatically by the X terminal emulator. However, when you
    log into another machine on a network, you might need to set DISPLAY by hand to
    point to your display, see the section called "Telnet and X".


    More information can be found in the X pages.


    # # Window and desktop managers


    The layout of windows on the screen is controlled by special programs called window
    managers. Although many window managers will honor geometry specifications as
    given, others may choose to ignore them (requiring the user to explicitly draw
    the window''s region with the pointer, for example).


    Since window managers are regular (albeit complex) client programs, a variety
    of user interfaces can be built. The X Consortium distribution uses a window manager
    named twm, but most users prefer something fancy with system resources. Swfish
    and Enlightenment are popular examples each user has to have a desktop according
    to mood and style.


    A desktop manager may use one of window manager or for arranging your graphical
    desktop in a convenient way, with toolbars, drop-down menus, informative messages,
    a clock, a program manager, a file manager and on. Among the most popular desktop
    managers are Gnome and KDE, which both run on any Linux distribution and other
    UNIX systems.


    # # KDE applications in Gnome/Gnome applications in KDE


    You don''t need to start your desktop in KDE in order to run KDE applications.
    If you have the KDE libraries installed (the kdelibs package), you can run these
    applications from the Gnome menus or start them from a Gnome terminal.


    Running applications in a KDE environment is a bit more tricky, because there
    is no single set of base-libraries in Gnome. However, the dependencies and thus
    extra packages you might have to install will become clear when running or installing
    an application.


    # # X server configuration


    The distribution that used to come with Linux, FreeBSD uses the configuration
    file XF86Config for its initial setup. This file configures your video card and
    is searched for a number of locations, although it is usually in /etc/X11.'
