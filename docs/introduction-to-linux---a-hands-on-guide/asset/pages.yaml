  md: '# About files and the file system


    | Directory | Content |

    | --- | --- |

    | /bin | Programs for use by the system and the system administrator. |

    | /tmp | Temporary space for use by the system, cleaned upon reboot, so don''t
    use this for saving any work! |

    | /usr | Programs, libraries, documentation etc. for all user-related programs.
    |

    | /var | Storage for all variable files and temporary files created by users,
    such as logs, the mail queue, the print spooler area, space for temporary storage
    of files downloaded from the Internet, or to keep an image of a CD before being.
    |


    How can you find out which partition a directory is on? Using the df command with
    a (.) as an option shows the partition the current directory belongs to, and informs
    about the amount of space used on this partition:


    ```

    sandra:/lib df -h

    Filesystem Size Avail Use% Mounted on

    /dev/hda7 980M 163M 76M 18% /"

    ```


    As a general rule, every directory under the root directory is on the root partition,
    unless it has a separate entry in the full list of df (or -h with no other options).


    Read more in man hier.


    # The file system in reality


    For most and most common system administration tasks, it is enough to accept that
    files and directories are ordered in a tree-like structure. The computer, however,
    doesn''t understand about trees or tree-structures.


    Every partition has its own file system. By imagining all those file systems together,
    we can form an idea of the tree-structure of the entire system, but it is not
    as simple as that. In a file, a file is represented by an inode, a kind of serial
    number containing information about the actual data that makes the file: to whom
    this belongs, and where it is located on the hard disk.


    Every partition has its own set of inodes; throughout a system with multiple partitions,
    files with the same inode number.


    Each inode describes a data structure on the hard disk, storing the properties
    of a file, including the physical location of the file data. When a hard disk
    is initialized to accept data storage, usually during the initial installation
    process or when adding extra disks to an existing system, a fixed number of inodes
    per partition is created. This number will be the maximum amount of files, of
    all types (including directories, special files, links etc.) that can exist at
    the same time on the partition. We typically count as having 1 inode per 2 to
    8 kilobytes of storage.


    At the time a new file is created, it gets a free inode. In that inode is the
    following information:


    +   - Owner and group owner of the file.

    - File type (regular, directory, ...)'
