  md: '# Fundamental Backup Techniques


    **bzip2** works in a similar way, but uses an improved compression algorithm,
    thus creating smaller files. See the **bzip2** pages for more.


    Linux software packages are often distributed in a zipped tarball. The sensible
    thing to do after unpacking kind of archives is to find the README and read it.
    It will contain general guidelines to installing the package.


    The GNU **tar** command is aware of gzipped files. Use the command


    ```

    tar xzvf file.tar.gz

    ```


    for unzipping and untarring **tar.gz** or **tgz** files. Use


    ```

    tar jxf file.tar.bz2

    ```


    for unpacking **tar** archives that were compressed with **bzip2**.


    # Java archives


    The GNU project provides us with the **jar** tool for Creating archives. It is
    a Java application that combines multiple files into a single JAR archive file.
    While also being a general purpose archiving and compression tool, based on ZIP
    and the ZLIB compression format, **jar** was mainly designed to facilitate the
    packing of Java code, applets and/or applications in a single file. When combined
    in a single archive, the components of a Java application, can be downloaded much
    faster.


    Unlike **tar**, **jar** compresses by default, independent from other tools -
    because it is basically the Java version of **tar**. In addition, it allows individual
    entries in an archive to be signed by the author, so that origins can be authenticated.


    The syntax is almost identical as the **tar** command, we refer to **info jar**
    for specific differences.


    # tar, and symbolic links


    One noteworthy fact is not really mentioned in the standard document that **tar**
    will follow symbolic links. Data to these points will be included in the archive.
    The default in **tar** is to only backup the symbolic link, but this behavior
    can be changed using the **-h** to **tar**.


    # Transporting your data


    Saving copies of your data on another host is a simple but accurate way of making
    backups. See Chapter 10, *Networking* for more information on **scp, ftp** and.


    In the next section we''ll discuss local backups.


    # Moving your data to a backup device


    # Making a copy on a floppy disk


    # Formatting the floppy


    On many Linux systems, users have access to the floppy disk device. The name of
    the device may vary depending on the size and number of floppy drives, contact
    your system if you are sure. On some systems, there will be a link like **/dev/floppy**
    pointing to the right device, probably **/dev/fd0** (the auto-detecting floppy
    device) or **/dev/fd0H1440** (set for 1,44MB floppies).'
