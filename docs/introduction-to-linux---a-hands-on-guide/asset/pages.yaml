    +   * http://www.mozilla.org


    # Does Linux have a future?


    # Open Source


    The idea behind Open Source software is rather simple: when programmers can read,
    distribute and change code, the code will mature. People can adapt it, fix it,
    debug it, and they can do it at a speed that dwarfs the performance of software
    developers at conventional companies. This software will be more flexible and
    of a better quality than what has developed using the conventional methods, because
    more people have tested it in different conditions than the closed software developer
    ever can.


    The Open Initiative started to make this clear to the commercial world, and very
    slowly, commercial vendors are to see the point. While lots of academics and technical
    people have already been convinced for 20 years now this is the way to go, commercial
    vendors needed applications the Internet to make them realize they can profit
    from Open Source. Now Linux has grown past the stage it was almost exclusively
    an academic system, useful only to a handful of people with a technical background.'
