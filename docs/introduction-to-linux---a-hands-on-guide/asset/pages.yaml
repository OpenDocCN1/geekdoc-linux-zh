- img_proc: true
  md: '# # Chapter 10. Networking


    When it comes to networking, Linux is your operating system of choice, not only
    because networking is tightly integrated with the OS itself and a wide variety
    of free tools and applications are available, but for the robustness under heavy
    loads that can be achieved after years of debugging and testing in an Open Source
    project.


    Bookshelves full of information have been written about Linux and networking,
    but we will try to give an overview in this chapter. After completing this, you
    will know more about


    +   - Networking protocols

    - Network configuration files

    - Commands for configuring and probing the network

    - Daemons and client programs enabling different network applications

    - File sharing and printing

    - Remote execution of commands and applications

    - Basic network interconnection

    - Secure execution of remote applications

    - Firewalls and intrusion detection


    # # Networking Overview


    # ## The OSI Model


    A protocol is, simply put, a set of rules for communication.

    In order to get data over the network, for instance an E-mail from your computer
    to some computer at the other end of the world, lots of different hard- and software
    needs to work together.


    All these pieces of hardware and the different software programs speak different
    languages. Imagine your E-mail program: it is able to talk to the computer operating
    system, through a specific protocol, but it is not to talk to the computer hardware.
    We need a special program in the operating system that performs this function.
    In turn, the computer needs to be able to communicate with the telephone line
    or Internet hook method. And behind the scenes, network connection hardware needs
    to be able to communicate in order to pass your E-mail from one appliance to the
    other, all the way to the destination computer.


    All these types of communication protocols are classified in 7 layers, which are
    known as the Open Systems Interconnection Reference Model, the OSI Model for short.
    For easy understanding, this model is reduced to a 4-layer protocol description,
    as described in the table below:


    Table 10.1. The simplified OSI Model


    | Layer name | Layer Protocols |

    | --- | --- |

    | Application layer | HTTP, DNS, SMTP, POP, ... |

    | Transport layer | TCP, UDP |

    | Network layer | IP, IPv6 |

    | Network access layer | PPP, PPPoE, Ethernet |'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'Each layer can only use the functionality of the layer below; each layer can
    only export functionality to the layer above. In other words: layers communicate
    only with adjacent layers. Let''s take the example of your E-mail message again:
    you enter it through the application layer. In your computer, it travels down
    the transport and network layer. Your computer puts it on the network through
    the access layer. That is also the layer that will move the message around the
    world. At the destination, the receiving computer will accept the message through
    its own network layer, and will display it to the recipient using the transport
    and application layer.


    # It''s really much complicated


    The above and following sections are included because you will come across some
    networking sooner or later; they will give you some starting points, you should
    want to find out about the details.


    # Some popular networking protocols


    Linux supports many different networking protocols. We list only the most important:


    # TCP/IP


    The Transport Control Protocol and the Internet Protocol are the two most popular
    ways of communicating on the Internet. A lot of applications, such as your browser
    and E-mail program, are built on top of this protocol suite.


    Very simply put, IP provides a solution for sending packets of information from
    one machine to another, while TCP ensures that the packets are arranged in streams,
    so that packets from different applications don''t get mixed up, and the packets
    are sent and received in the correct order.


    A good starting point for learning about TCP and IP is in the following documents:


    +   * **7 ip**: Describes the IPv4 protocol implementation on Linux (version 4
    currently being the most wide-spread edition of the IP protocol).

    * **7 tcp**: Implementation of the TCP protocol.

    * RFC793, RFC1122, RFC2001 for TCP, RFC791, RFC1122 and RFC1112 for IP.


    The Request For Comments (http://www.ietf.org/rfc/) documents contain the descriptions
    of networking standards, protocols, applications and implementation. These documents
    are managed by the Internet Engineering Task Force, an international community
    concerned with the smooth operation of the Internet and development of the Internet
    architecture.


    Your ISP usually has an RFC archive available, or you can browse the RFCs at http://www.ietf.org/.


    # IPv6


    Nobody expected the Internet to grow as fast as it does. IP proved to have quite
    some disadvantages when a large number of computers is in, the most important
    being the availability of addresses to assign to each machine participating. Thus,
    IP version 6 was devised to meet the needs of today''s Internet.


    Unfortunately, not all applications and services support IPv6. A migration is
    currently set in motion in many environments that can benefit from an upgrade
    to IPv6. For some applications, the old protocol is still used, for applications
    that have been reworked the new version is already active. So when'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Networking


    checking your network configuration, sometimes it might be a bit confusing since
    all kinds of measures can be taken to hide one protocol from the other so the
    two don''t mix up connections.


    More information can be found in the following documents:


    +   - man 7 ipv6: The Linux IPv6 protocol implementation.

    - RFC1883 describing the IPv6 protocol.


    # PPP, SLIP, SLIP, PPOE


    The Linux kernel has built-in support for PPP (Point-to-Point-Protocol), SLIP
    (Serial Line IP), PLIP (Parallel Line IP) and PPP Ethernet. PPP is the most popular
    individual users access their ISP (Internet Service Provider), although in densely
    populated areas it is often being replaced by PPPOE, the protocol used for ADSL
    (Asymmetric Digital Subscriber Connection) connections.


    Most Linux distributions provide easy-to-use tools for setting up an Internet
    connection. The only thing you basically need is a username and password to connect
    to your Internet Service Provider (ISP), and a telephone number in the case of
    PPP. These data are entered in the graphical configuration tool, which will likely
    allow you for starting and stopping the connection to your provider.


    # ISDN


    The Linux kernel has built-in ISDN capabilities. Isdnlinux controls ISDN cards
    and can emulate a modem with the Hayes command set ("AT”). The possibilities range
    from simply using a terminal protocol full connection to the Internet.


    Check your system documentation.


    # AppleTalk


    Appletalk is one of Apple''s networking stack. It is a peer-to-peer network model
    which provides basic functionality as file and printer sharing. Each machine can
    simultaneously act as a client and a server, and the software and hardware are
    included with every Apple computer.


    Linux provides full AppleTalk networking. Netatalk is a kernel-level implementation
    of the AppleTalk Protocol Suite, originally for BSD-derived systems. It includes
    support for routing AppleTalk, serving UNIX and AFS file systems using AppleShare
    and serving UNIX printers and AppleTalk traffic.


    # SMB/NMB


    For compatibility with MS Windows, the samba server, including support for the
    NMB and SMB protocols, can be installed on any UNIX-like system. The Server Block
    protocol (also called Session Message Block, NetBIOS or LanManager protocol) is
    used on Windows 3.11, NT, 95/98, 2K and


    The basic functions of the samba suite are: sharing Linux with windows, accessing
    samba from Linux machines, sharing Linux printers with Windows and sharing Windows
    printers with Linux machines.


    Most Linux distributions provide a samba package, which does most of the setup
    and starts with samba, the samba server, and netbd, the name server, at boot time.
    Samba can be configured graphically, via a web interface or via the command line
    and text configuration files. The daemons make a Linux machine appear as an MS
    Windows My Network Places/Network Neighbourhood window; a share from a Linux machine
    will be indistinguishable from on any other host in an MS Windows environment.'
