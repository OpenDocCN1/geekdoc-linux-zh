  md: '# Fundamental Backup Techniques


    The appropriate backup commands are usually put in one of the cron directories
    in order to have them executed on a regular basis. In larger environments, the
    freely available Amanda [http://www.amanda.org] backup suite or a commercial solution
    may be implemented to back up multiple machines. Working with tapes, however,
    is a system administration task beyond the scope of this document.


    # Tools from your distribution


    Most Linux distributions offer their own tools for making your life easy. A short
    overview:


    +   - SuSE: YaST now includes expanded backup and restore modules.

    - RedHat: The File Roller tool provides visual management of (compressed) archives.
    They seem to be in favour of the X-CDRoast tool for moving backups to an external
    device.

    - Mandrake: XD-Roast.

    - Most distributions use the BSD dump and restore utilities for backups of ext2
    and ext3 file systems. This tool can write to any device and literally dumps the
    file(s) or file system bit by bit the specified device. Like dd, this allows for
    backing up special file types such as the ones in /dev.


    # Using rsync


    # Introduction


    The rsync program is a fast and flexible tool for remote backup. It is common
    on UNIX and UNIX-like systems, to configure and use in scripts. While the r in
    rsync stands for "remote", you do not need to take this all literally. Your "remote"
    device might as well be a USB storage device or another partition on your hard
    disk, you do not need to have two separated machines.


    # An example: rsync to a USB storage device


    As discussed in the section called "Mount points", we will first have to mount
    the device. Possibly, this should be done as root:


    ```

    root@theserver# mkdir /mnt/usbstore

    root@theserver# mount -t vfat /dev/sda /mnt/usbstore

    ```


    # Userfriendly


    More and distributions give access to removable devices for non-privileged users
    and mount USB devices, CD-ROMs and other removable devices automatically.


    Note that this guideline requires USB to be installed on your system. Use the
    USB Guide [http://www.linux-usb.org/USB-guide/] for help if this does not work.
    Check with dmesg for /dev/sda is indeed the device to mount.


    Then you can start the actual backup, for instance of the /home/karl directory:'
