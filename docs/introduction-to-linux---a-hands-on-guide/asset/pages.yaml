    ```


    The problem can be solved by giving the full path to the command to run, or by
    re-exporting the PATH variable:


    ```

    tina-> export PATH=$PATH:/opt/acreload/bin

    tina-> echo $PATH

    /bin:/usr/bin:/usr/bin/bin/X11:/opt/acreload/bin

    ```'
