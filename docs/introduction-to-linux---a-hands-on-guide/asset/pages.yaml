  md: 'If you want, prompts can execute scripts and behave different under different
    conditions. You can even have the prompt wait every time you issue a command,
    although this gets boring pretty soon. More information can be found in the Bash-Prompt
    HOWTO [http://www.tdp.org/HOWTO/Bash-Prompt-HOWTO].


    # # Shell scripts


    # What are scripts?


    A script is, as we saw in the shell configuration examples, a text file containing
    shell commands. When such file is used as the first non-option argument when invoking
    Bash, and the -c nor s option is used, Bash reads and executes commands from the
    file, then mode of operation creates a non-interactive shell. When Bash runs a
    script, it sets the special parameter $0 to the name of the file, rather than
    the name of the shell, and the positional parameters (everything following the
    name of the script) are set to the remaining arguments, if any are given. If no
    additional arguments are supplied, the positional parameters are unset.


    A script may be made executable using the chmod command to execute the bit. When
    Bash finds a file while searching the PATH for a command, it spawns a sub-shell
    to execute it. In other words,


    ```

    filename ARGUMENTS

    ```


    is equivalent to executing


    ```

    bash ARGUMENTS

    ```


    "filename" if it is an executable script. This sub-shell reinitializes itself,
    so that with the exception that the locations of commands remembered by the parent
    (see bash in the Info pages) are retained by the child.


    Most UNIX systems make this part of the operating system''s command execution
    mechanism. If the first line of a script begins with the two characters "#", the
    remainder of the line specifies an interpreter for the program. Thus, you can
    specify bash, awk, perl or some other interpreter or shell and write the rest
    of the script in that language.


    The arguments to the interpreter consist of a single argument following the interpreter
    name on the first line of the script file, followed by the name of the script
    file, followed by the rest of the arguments. Bash will perform this action on
    operating systems that do not handle it themselves.


    Bash scripts often begin with


    ```

    #! /bin/bash

    ```


    (assuming Bash has been installed in /bin), since this ensures that Bash will
    be used to interpret the script, even if it is executed under another shell.


    # # Some simple examples


    A very simple script of only one command, that says hello to the user executing
    it:


    ```

    [jeffry@nowhere ~] cat hello.sh

    #!/bin/bash

    ```'
