    # # Internet Telephony


    # ## What is it?


    Internet telephony, or more common, Voice over IP (VoIP) or digital telephony
    allows parties to exchange voice data flows over the network. The big difference
    is that the data flows over a general purpose network, the Internet, contrary
    to conventional telephony, which uses a dedicated network of voice transmission
    lines. The two networks can be connected, under special circumstances, but for
    now this is certainly not a standard. In other words: it is very likely that you
    will not be able to call people who are using a conventional telephony. If it
    is possible at all, it is likely that you will need to pay for a subscription.


    While there are various applications available for free download and proprietary,
    there are some drawbacks to telephony over the Internet. Most notably, the system
    is unreliable, it can be slow or there can be a lot of noise on the connection,
    and it thus cannot be used to replace conventional telephony - think about emergency
    calls. While some providers take their precautions, there is no guarantee that
    you can reach the party you want to call.'
