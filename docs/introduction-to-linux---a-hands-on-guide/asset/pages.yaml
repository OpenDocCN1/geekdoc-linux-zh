  md: '# Sound and Video


    Most applications currently do not use encryption, be aware that it is potentially
    easy for someone to eavesdrop on your conversations. If security is a concern
    for you, read the documentation that comes with your VoIP client. Additionally,
    if you are using a firewall, it should be configured to allow incoming connections
    from anywhere, so using VoIP also takes risks on the level of security.


    # # What do you need?


    # ## Server Side


    First of all, you need a offering service. This service might integrate traditional
    telephony and it might not be free. Among others are SIPphone [http://www.siphone.com/],
    Vonage [http://www.vonage.com/], Lingo [http://www.lingo.com/], TotalTalk [http://www.totaltalk.com/]
    and many locally accessible providers offering the so-called "full phone service".
    Internet phone service is only offered by Skype [http://www.skype.com/], SIP Broker
    [http://www.sipbroker.com/], Google [http://www.google.com/talk/] and many others.


    If you want to set up a server of your own, you might want to look Asterisk [http://www.asterisk.org].


    # ## Client Side


    On the client side, the applications that you can use on your network configuration.
    If you have a Direct Internet connection, there won''t be any problems, provided
    that you know on what server you connect, and that you also have a username and
    password to authenticate the service.


    If you are behind a firewall that does Network Address Translation (NAT), however,
    some services might not work, as you will only see the IP address of the firewall
    and not the address of your computer, which might be unwanted over the Internet,
    for instance when you are in a company network and your IP address starts with
    10.,192.168., or another non-routable subnet prefix. This depends on the protocol
    that is used by the application.


    Also, available bandwidth might be a blocking factor: some applications are optimized
    for low bandwidth consumption, while others require high bandwidth connections.
    This depends on the codec that used by the application.


    Among the most common applications are the Skype client, Gizmo has an interface
    that reminds of instant messaging, and X-Line [http://www.couperth.com/], the
    free version of the XTen softphone, which looks like a mobile. However, while
    these programs are available for free download and very popular, they are not
    free in speech: they use proprietary protocols and only available in binary packages,
    not in source format.


    Free and open VoIP clients are instance Gizmo [http://www.gizmoproject.com/],
    Linphone [http://www.linphone.org], GnomeMeeting [http://www.gnomemeeting.org/]
    and KPhone [http://www.weblar.org/kphone].


    # ## Client hardware


    While your computer, especially if it is a laptop PC, might have a built-in microphone,
    the result will be far better if you connect a headset. If you have the choice,
    opt for a USB headset, as it functions independently from existing audio hardware.
    Use alsamixer to configure input and output sound levels to your taste.


    VoIP applications are definitely a booming market. Volunteers try to document
    the current status at http://www.voip-info.org/.'
