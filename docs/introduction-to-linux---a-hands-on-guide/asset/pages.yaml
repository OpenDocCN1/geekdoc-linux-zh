    | Shift+Page and Shift+PageDown | Browse terminal buffer (to see text that has
    “scrolled off the screen). |

    | Tab | Command or completion: when multiple choices are possible, the system
    will signal with an audio or visual bell, or, if many choices are possible, ask
    you if you want to see them all. |

    | Tab Tab | Show file or command possibilities. |


