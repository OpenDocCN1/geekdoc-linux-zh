    # The Window System


    # X features


    It is important to realize the distinction between the X server and the X client
    application(s). The X server controls the display directly and is responsible
    for all input and output via keyboard, mouse, and display. The X client, on the
    other hand, does not access the input and output devices. It communicates with
    the X server which handles input and output. It is the X client which does the
    real work, like computing values, running applications and so forth. The X server
    only opens windows to handle input and output for the specified client.


    In normal operation (graph), every Linux workstation is an X server to serve,
    even if it only runs clients. All the applications you are running (e.g., Gimp,
    a terminal window, your browser, office application, your CD playing tool, and
    so on are clients to your X server. Server and client are running on the same
    machine in this.


    This client/server nature of the X system makes it an ideal environment for remote
    execution of applications and programs. Because the process is actually executed
    on the remote machine, very little CPU power is needed on the local host. This
    scheme, purely acting as servers for X, are called terminals and were once very
    popular. More information may be found in the Remote X-applications mini-HOWTO
    [http://www.tldp.org/HOWTO/Remote-X-Apps.html].


