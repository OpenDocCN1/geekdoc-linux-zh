    # The file mask


    When a new file is saved, it is first subjected to the standard security procedure.
    Files without permissions dont exist on Linux. The standard file permission is
    determined by the umask for new file creation. The value of this mask can be displayed
    using the umask command:


    ```

    bert:> umask

    0022

    ```


    Instead of adding the symbolic values to each other, also with chmod, for creating
    the permission on a new file they need to be subtracted from the total possible
    access rights. In the example above, we see 4 values displayed, there are only
    3 permission categories: user, group and other. The first zero is part of the
    file attributes, which we will discuss in the section "Changing user and group
    ownership" and the section "SUID and SGID". It might well be that this first zero
    is not displayed when entering the umask command, and that you see 3 numbers representing
    the default file creation mask.


    Each UNIX-like system has a function for creating new files, which is called each
    time a user creates a new file, for instance, when downloading a file from the
    Internet, when saving a new document or so. This function creates new files and
    new directories. Full read, write and execute permission is granted to everyone
    when creating a directory. When creating a new file, this function will grant
    read and write permissions for everybody, but execute permissions to none for
    all user categories. Before this mask is applied, a directory has permissions
    777 or rwxrwxrwx, a file 666 or rw-rw-rw-.


    The umask is subtracted from these default after the function has created the
    new file or directory. A directory will have permissions of 775 by default, a
    file 664, if the mask is (0)002. This is demonstrated in the example:


    ```

    bert:> mkdir newdir

    ```


    ```

    bert:> ls -ld newdir

    drwxrxr-x 2 bert bert 4096 Feb 28 13:45 newdir/

    ```


    ```

    bert:> touch newfile

    ```


    ```

    bert:> ls -l newfile

    -rw-rw-r-- 1 bert bert 0 Feb 28 13:52 newfile

    ```'
