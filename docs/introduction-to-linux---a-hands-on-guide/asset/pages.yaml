    # GNU/Linux


    The Linux kernel (the bones of your system, the section called "Kernel") is not
    part of the GNU project but uses the same license as GNU software. A great majority
    of utilities and development tools (the meat of your system), which are not Linux-specific,
    are taken from the GNU project. Because any usable system must contain both the
    kernel and at least a minimal set of utilities, some people argue that such a
    system should be a GNU/Linux system.


    In order to obtain the highest possible degree of independence between distributions,
    this is the sort of Linux that we will discuss throughout this course. If we are
    not talking about a GNU/Linux system, the specific distribution, version or name
    will be mentioned.


    # Which distribution should I install?


    Prior to installation, the most important factor is your hardware. Since every
    Linux distribution contains the basic packages and can be built to meet almost
    any requirement (because they all use the Linux kernel), you only need to consider
    if the distribution will run on your hardware. LinuxPPC for example'
