  md: '# What is Linux?


    made to run on Apple and other PowerPCs and does not run on an ordinary x86 PC.
    LinuxPPC runs on the new Macs, but you can''t use it for some of the older ones
    with ancient bus technology. Another tricky case is hardware, which could be old
    SPARC CPU or newer UltraScale, requiring different versions of Linux.


    Most Linux distributions are optimized for certain processors, as Athlon CPUs,
    while they will at the same time decent enough on 486, 586 and 686 Intel CPUs.
    Sometimes distributions for special CPUs are not as reliable, since they are tested
    by fewer people.


    Most Linux distributions offer a set of programs for generic PCs with special
    packages containing kernels for the x86 Intel base CPUs. These distributions are
    well-tested and maintained on a regular base, focusing on reliant server implementation
    and easy installation. Examples are Debian, Ubuntu, Fedora, SuSE and Mandrake,
    which are by far the most popular Linux systems and generally easy to handle for
    the beginner user, without blocking professionals from getting the most out of
    their Linux machines. Linux also runs on laptops and middle-range servers. Distributions
    for new hardware are included only after extensive testing, which adds to the
    stability of a system.


    The standard desktop environment might be Gnome on one system, another might offer
    KDE by default. Generally, both Gnome and KDE are available for all major Linux
    distributions. Other window and desktop managers are available for more advanced
    users.


    The standard installation allows users to choose between different setups, such
    as a workstation, where all packages needed for everyday use and development are
    installed, or a server installation, where different networks can be selected.
    Expert users can install any combination of packages they want during the initial
    installation.


    The goal of this guide is to apply to all Linux distributions. For your own convenience,
    however, it is strongly advised that beginners stick to a mainstream distribution,
    supporting all common hardware and applications by default. The following are
    very good choices for novices:


    +   - Fedora Core [http://www.fedora.redhat.com]


    +   - Debian [http://www.debian.org]


    +   - SuSE Linux [http://www.suse.de]


    +   - Mandrake (formerly MandrakeSoft) [http://www.mandrake.com]


    +   - Knoppix [http://www.knoppix.com]: an operating system that runs from CD-ROM,
    you don''t need to install anything.


    Downloadable ISO-images can be obtained from LinuxISO.org [http://www.linuxiso.org].
    The main distributions can be purchased in any computer shop.


    # Summary


    In this chapter, we learned that:


    +   - Linux is an implementation of UNIX.


    +   - The Linux operating system is written in the C programming language.


    +   - “De gustibus et coloribus non disputantum est: there’s a Linux for everyone.


    +   - Linux uses GNU tools, a set of freely available standard tools for handling
    the operating system.'
