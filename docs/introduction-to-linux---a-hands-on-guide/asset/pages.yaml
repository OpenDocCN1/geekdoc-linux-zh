    # Mail


    Regularly clean out your mailbox, make sub-folders and automatic redirects using
    procmail (see the Info) or the filters of your favorite mail reading application.
    If you have a trash folder, clean it out on a regular basis.


    To reread, use the .forward file in your home directory. The Linux mail service
    looks for this whenever it delivers to local mail. The content of the file defines
    what the mail system should do with your mail. It can contain a single line holding
    a fully qualified E-mail address. In that case it will send all your mail to this
    address. For instance, when renting space for a website, you might want to forward
    the mail to the webmaster or your own account not to waste disk space. The webmaster''s.forward
    may look like this:


    ```

    webmaster@www ~ -> cat .forward

    mike@pandora.be

    ```


    Using mail forwarding is also useful to prevent yourself from having to check
    several different mailboxes. You can make each address point to a center and easily
    accessible account.


    You can ask your server administrator to define a forward for you in the local
    mail aliases file, like when an account is being closed but E-mail remains active
    a while.


    # Save space with a link


    When several users access the same file or program, when the original file name
    is too long or difficult to remember, use a symbolic link instead of a separate
    copy for each user or purpose.


    Multiple symbolic links have different names, e.g. a link may be called monfichier
    in one user''s directory, and mylink in another''s. Multiple links (different
    names) to the same file may also occur in the same directory. This is often done
    in the /lib directory: issuing the command


    ```

    ls -l /lib

    ```


    you will see that this directory is plenty of links pointing to the same files.
    They are created so that programs searching for one name would not get stuck,
    so they are pointed to the correct/current name of the libraries they need.


