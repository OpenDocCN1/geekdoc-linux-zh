    # Using shell features


    All substitutions can be used simultaneously; the shell is very logical about
    it. The Bash shell, for instance, has no problem with expressions like ls dirname=*/[2-3].


    In other shells, the asterisk is commonly used to minimize the efforts of typing:
    people would enter dir* instead of cd directory. In Bash however this is not necessary
    because the GNU shell has a feature file name completion. It means that you can
    type the first characters of a command (anywhere) or a file (in the current directory)
    and if you are confused, the shell will find out what you mean. For example you
    can check if there are any files beginning with the letter A by typing Is pressing
    the Tab key twice, rather than pressing Enter. If there is only one file starting
    with "A", this file will be shown as the argument to ls (or any shell command,
    for that immediately).


    # Which


    A very simple way of looking up files is using the which command, to look in the
    directories listed in the user''s search path for the required file. Of course
    the search path contains paths to directories containing executable programs,
    which doesn''t work for ordinary files. The which command is useful when troubleshooting
    "Command not Found" problems. In the example below, you can''t use the acreload
    command, while her colleague has no whatsoever on the same system. The problem
    is similar to the PATH problem in the previous part: Tina''s colleague tells her
    that he can see the required program in /opt/acreload/bin, but this directory
    is not in her path:


    ```

