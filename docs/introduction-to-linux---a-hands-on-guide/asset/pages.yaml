  md: '# About files and the file system


    # About partitioning


    # Why partition?


    Most people have a vague knowledge of what partitions are, since every operating
    system has the ability to create or remove them. It may seem strange that Linux
    uses more than one partition on the same disk, even when using the standard installation
    procedure, some explanation is called for.


    One of the goals of having different partitions is to achieve higher data security
    in case of disaster. By dividing the hard disk into partitions, data can be grouped
    and separated. When accident occurs, only the partition that got hit will be damaged,
    the data on the other partitions will likely survive.


    This principle dates from the days when Linux didn''t have file systems and power
    failures might lead to disaster. The use of partitions for security and robustness
    ensures, a breach on one part of the system doesn''t automatically mean the whole
    computer is in danger. This is the most important reason for partitioning. A simple
    example: you creates a script, a program or a web application that starts filling
    up the disk. If the disk contains only one partition, the entire system will stop
    functioning if the disk is full. If the user stores the data on a separate partition,
    then only that (data) partition will be affected, while the system partitions
    and other data partitions keep functioning.


    Mind that having a joined file system only provides data security in case of power
    failure and sudden disconnection of devices. This does not protect your data against
    bad blocks and logical errors in the file system. In these cases, you should use
    a RAID (Redundant Array of Inexpensive Disks) solution.


    # Partition layout and types


    There are two kinds of partitions on a Linux system:


    +   * root partition: Normal Linux system data, including the root partition containing
    all the data to start up and run the system;


    +   * swap partition: expansion of the computer''s physical memory, extra memory
    on hard disk.


    Most systems contain a root partition, one or more data partitions and one or
    more swap partitions, Systems in mixed environments may contain partitions for
    other system data, such as a partition with a FAT or VFAT file system for MS Windows.


    Most Linux systems use disk at installation time to set the partition type. If
    you have noticed the exercise from Chapter 1, this usually happens automatically.
    However, you may not be so lucky. In such cases, you need to select the partition
    type and even manually the actual partitioning. The standard Linux partitions
    have 82 for swap and 83 for data, which can be journaled (ext3) or normal (ext2,
    older systems). The disk utility has built-in help, you should forget these values.


    Apart from these, Linux supports a variety of other file systems, such as the
    relatively new Reiser file system, JFS, NFS, FAT3x and many other file systems
    available on other (proprietary) operating.


    The root partition (indicated with a single slash, /) is only up to 500 MB, and
    contains the system configuration files, most basic commands and server programs,
    system libraries, temporary space and the home directory of the administrative
    user. A standard installation requires about 250 MB for the root partition.


    Swap space (indicated with swap) is only accessible for the system itself, and
    is hidden from view during normal operation. Swap is the system that ensures,
    like normal UNIX systems, that you can keep on'
