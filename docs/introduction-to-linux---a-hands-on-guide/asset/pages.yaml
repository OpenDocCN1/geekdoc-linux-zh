  md: '# Chapter 6. Text editors


    In this chapter, we will discuss the importance of mastering an editor. We will
    focus mainly on the Improved vi editor.


    After finishing this chapter, you will be able to:


    +   - Open and close files in text mode

    - Edit files

    - Search text

    - Undo errors

    - Merge files

    - Recover lost files

    - Find a program or suite for office use


    # Text editors


    # Why should I use an editor?


    It is very important to be able to use at least one text editor. Knowing how to
    use an editor on your system is the first step to independence.


    We need to master an editor by the next chapter as we need to edit files that
    influence our environment. As an advanced user, you may want to write scripts,
    or books, develop websites or new programs. Mastering an editor will immensely
    improve your productivity as well as your capabilities.


    # Which editor should I use?


    Our focus is on text editors, which can also be used on systems without a graphical
    environment and in terminal windows. The additional advantage of mastering a text
    editor is in using it on remote machines. Since you don''t need to transfer the
    entire graphical environment over the network, working with text editors tremendously
    improves network speed.


    There are as, multiple ways to handle the problem. Let''s see what editors are
    commonly available:


    # GNU Emacs


    Emacs is the extensible, customizable, self-documenting, real-time display editor,
    known on many UNIX and other systems. It is a real-time editor whose display is
    updated on the screen and is updated automatically as you type your commands.
    It is updated frequently, usually after each character or pair of characters you
    type. This minimizes the amount of information you must keep in your head as you
    edit it. Emacs is called advanced because it provides facilities that go beyond
    simple insertion and deletion: controlling automatic indentation of programs;
    viewing two or more files at once; editing formatted text; and dealing in terms
    of words, lines, sentences, paragraphs, and pages, as well as expressions and
    comments in several different programming languages.


    Self-documenting means that at any time you can find a special character, Ctrl+H,
    to find out your options. You can also use it to find out what any command does,
    or to find all the commands that pertain'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'to a topic. Customizable means that you can change the definitions of Emacs
    commands in little ways. For example


    Extensible means that you can go beyond simple customization and write entirely
    new commands, programs in the Lisp language that are Emacs'' own interpreter.
    Emacs is an online system, which means that it is divided into many functions
    that call each other, almost any of which can be defined in the middle of an editing
    session. Almost any part of Emacs can be replaced without making a separate copy
    of all Emacs. Most of the commands of Emacs are written in Lisp; the few exceptions
    could have been written in Lisp but are in C for efficiency. Only a programmer
    can write an extension, anybody can use it.


    When under the X Window System (started as emacs) Emacs provides its menus and
    convenient bindings to mouse buttons. But Emacs can provide many of the benefits
    of a window system on a text-terminal. For instance, you can look at or edit files
    at once, move between files, and edit files while running commands.


    # Vi(m)


    Vim stands for "Vi Improved". It used to be "Vi Imitation", but there are so many
    improvements that a name change was appropriate. Vim is a text editor which includes
    almost all the commands from the UNIX vi and a lot of new ones.


    Commands in the editor are entered using only the keyboard, which has the advantage
    that you can keep your fingers on the keyboard and your eyes on the screen, rather
    than moving your arm repeatedly to the mouse. For each key you want, mouse support
    and a GUI with toolbars and menus can be activated.


    We will refer to vi or vim when editing files, while you are of free to use the
    editor of your choice. We recommend to at least get the basics in the fingers,
    because it is the standard text editor on almost all UNIX systems, emacs can be
    an optional package. There may be many differences between different computers
    and terminals, but the main point is that if you work with vi, you can survive
    on any UNIX system.


    Apart from the vi command, the vim packages may provide gvim, the Gnome version
    of vim. Beginners might find this easier to use, because the menus offer help
    when you don''t know how to perform a particular editing task using the standard
    vim commands.


    # Using the Vim editor


    # Two modes


    The vi editor is a very powerful tool and has very extensive built-in, which you
    can activate using the help command when the program is started (instead of using
    man or info, which do not contain much information). We will only discuss the
    basics here before you get started.


    What makes vi confusing to the beginner is that it operate in two modes: command
    mode and insert mode. The editor always starts in command mode. Commands move
    you through the text, search, replace, block marks and perform other editing tasks,
    and some of them switch the editor to insert mode.


    This means that each key has not one, but two meanings: it can either represent
    a command for the editor in command mode, or a character that you want in a text
    when insert mode.'
