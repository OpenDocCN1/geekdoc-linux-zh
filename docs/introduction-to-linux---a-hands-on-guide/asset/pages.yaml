- img_proc: true
  md: '# Networking


    Firewall is a vague term that can mean anything that acts as a protective barrier
    between us and the outside world, generally the Internet. A firewall can be a
    dedicated system or a specific application that provides this functionality. Or
    it can be a combination of components, including various combinations of hardware
    and software. Firewalls are built "rules" that are used to define what is allowed
    to enter/exit a given system or network.


    After disabling unnecessary services, we now want to restart accepted services
    to allow only the minimum required connections. A example is working from home:
    only the specific connection between your office and your home should be allowed,
    connections from other machines on the Internet should be blocked.


    # Packet filters


    The first line of defense is a packet filter, which can look inside IP packets
    and make decisions based on the content. Most common is the Netfilter package,
    providing the iptables command, a next generation filter for Linux.


    One of the most noteworthy enhancements in the newer kernels is the stateful inspection
    feature, which not only sees what is inside a packet, but also detects if a packet
    belongs or is linked to a new or existing connection.


    The Shoreline Firewall or Firewall is a front-end for the standard firewall functionality
    in Linux.


    More information can be found at the Netfilter/iptables page [http://www.netfilter.org/].


    # TCP wrappers


    TCP wrapping provides the same results as the packet filters, but buffers differently.
    The wrapper actually accepts the connection attempt, then examines configuration
    files and decides whether or reject the connection request. It controls connections
    at the application level rather than at the network level.


    TCP wrappers are typically used with xinetd to provide name and IP-address-based
    access control. In addition, these tools include logging and utilization management
    capabilities that are easy to configure.


    The advantages of TCP wrappers are that the client is unaware that wrappers are
    used, and they operate separately from the applications they protect.


    The host based access is controlled in the hosts.allow and hosts.deny files. More
    information can be found in the TCP wrapper documentation files in /usr/share/doc/tcp-wrappers[-version]/
    or /usr/share/doc/tcp and in the man pages for the host based access control files,
    which contain examples.


    # Proxies


    Proxies perform various duties, not all of which have much to do with security.
    But the fact that they are an intermediary proxy a good place to enforce access
    control policies, limit direct connections through a firewall, and control how
    the network behind proxies to the Internet.


    In combination with a packet filter, but sometimes by themselves, proxies provide
    an extra level of control. More information can be found in the Firewall HOWTO
    [http://www.tdlp.org/HOWTO/FirewallHOWTO.html] or on the Squid website.


    # Access to individual applications


    Some servers may have their own access control features. Common examples include
    Samba, X Window, Bind, Apache and CUPS. For every service you want to offer check
    which configuration files apply.'
