    # Examples


    # Analyzing errors


    If your process generates a lot of errors, this is a way to thoroughly examine
    them:


    ```

    command 2>&1 | less

    ```


    This is used when creating new software using the make command, as such in:


    ```

    andy:~/newsoft make all 2>&1 | less

    --output omitted--

    ```


    # Separating standard output from standard error


    Constructs like these are used by programmers, so that output is displayed in
    one terminal window, and errors in others. Find which pseudo terminal you are
    using the tty command first:


    ```

    andy:~/newsoft make all 2> /dev/pts/7

    ```


    # Writing to output and files simultaneously


    You can use the tee command to copy input to standard output and one or more output
    files in move. Using the -a option to tee results in appending to the file(s).
    This command is useful if you want to both see and save output. The > and >> operators
    do not allow to perform both simultaneously.


    This tool is usually called through a pipe (|), as demonstrated in the example
    below:


    ```

    mireille ~/test> date | tee file2

    Thu Jun 10 11:10:34 CEST 2004

    ```


    ```

    mireille ~/test> cat file1

    Thu Jun 10 11:10:34 CEST 2004

    ```


    ```

    mireille ~/test> cat file2

    Thu Jun 10 11:10:34 CEST 2004

    ```'
