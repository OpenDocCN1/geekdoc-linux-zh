    Here is a script consisting of some more lines that I use to make backup copies
    of all files in a directory. The script first makes a list of all the files in
    the current directory and puts it in the variable LIST. Then it sets the name
    of the copy for each file, and then copies the file. For each file, a message
    is printed:


    ```

    tille-> cat bin/makebackupfiles.sh

    #!/bin/bash

    # make copies of all files in a directory

    LIST=`ls''

    for i in $LIST; do

    ORIG=$i

    DEST=$i.old

    cp $ORIG $DEST

    echo "copied $i"

    done

    ```


    Just entering a line `mv * *.old` won''t work, as you will notice when trying
    this on a set of test files. An **echo** command used in order to display some
    activity, **echo** is generally useful when a script doesn''t work: insert after
    each dated step and you will find the error in time.


    The `/etc/rc.d/init.d` directory contains loads of examples. Let''s look at this
    script that controls the fictitious ICanSeeYou server:


    ```

    #!/bin/sh

    # description: ICanSeeYou allows you to see networked people


    # process name: ICanSeeYou

    # pidfile:/var/run/ICanSeeYou/ICanSeeYou.pid

    # config: /etc/ICanSeeYou.cfg


    # Source function library.

    . /etc/rc.d/init.d/functions


    # See how (with which arguments) we were called.

    case "$1" in

    start)

    echo -n "Starting ICanSeeYou: "

    daemon ICanSeeYou

    touch /var/lock/subsys/ICanSeeYou

    ;;

    stop)

    echo -n "Shutting down ICanSeeYou: "

    ```'
