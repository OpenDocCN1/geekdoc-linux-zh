    # Linux Flavors


    # Linux and GNU


    Although there are large number of Linux implementations, you will find a lot
    of similarities in the different distributions, if only because every Linux machine
    is a box with building blocks that you may put together your own needs and views.
    Installing the system is only the beginning of a longterm relationship. Just when
    you have a running system, Linux will simulate your imagination and creativity,
    and the more you realize what power the system can give you, the more you will
    try to redefine its limits.


    Linux may appear depending on the distribution, your hardware and personal taste,
    but the fundamentals on all graphical and other interfaces are built, remain the
    same. Linux system is based on GNU tools (GNU''s Unix), which provides a set of
    standard ways to handle and use the system. All GNU tools are open source, so
    they can be installed on any system. Most distributions offer pre-compiled packages
    of many common tools, such as RPM packages on RedHat and Debian packages (also
    called deb or dpkg) on Debian, so you need a programmer to install a package on
    your system. However, if you are and like doing things yourself, you will enjoy
    Linux all the better, since most distributions come with a complete set of development
    tools, allowing installation of new software purely from source. This setup also
    allows you to install software even if it does not exist in a pre-packaged format
    suitable for your system.


    A list of common GNU software:


    +   - Bash: The GNU shell


    +   - GCC: The GNU C Compiler


    +   - GDB: The GNU Debugger'
