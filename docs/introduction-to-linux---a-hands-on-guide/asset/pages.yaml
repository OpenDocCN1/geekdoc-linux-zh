  md: '# Networking


    # Log files


    If anything, the UNIX way of logging all kinds of activities into all kinds of
    files confirms that "it is doing something." Of course, log files should be checked
    regularly, manually or automatically. Firewalls and other methods of access control
    create huge amounts of log files, so the trick is to try and only log activities.


    # Intrusion detection


    Intrusion Detection Systems are designed to catch what might have gone past the
    firewall. They can either be designed to catch an active break-in attempt in progress,
    or to detect a successful break-in after the fact. In the latter case, it is too
    late to prevent any damage, but we have least early awareness of a problem. There
    are two basic types of IDS: protecting networks, and protecting individuals.


    For hosted IDS, this is done with utilities that monitor the file system. System
    files that have changed in some way, but should not change, are a dead giveaway
    that something is amiss. Anyone who gets in and gets access will presumably make
    changes to the system whatever. This is usually the very first thing they do,
    either so they can get back in a backdoor, or to launch an attack against some
    system. With the triwire monitoring system, which is documented in the Tripwire
    Open Source Project [http://www.tripwire.org] website.


    Network intrusion detection is handled by a system that sees all the traffic that
    passes the firewall (not by portanners, which advertise usable ports). Snort [http://www.snort.org]
    is an Open Source example of such a program. Whitehats features an Open Intrusion
    detection database, arachNIDS [http://www.whitelats.com].


    # More tips


    Some general things you should keep in mind:


    +   - Do not allow root logins. UNIX developers came up with the su over two decades
    ago for extra security.

    - Direct root access is always dangerous and susceptible to human errors, be it
    by allowing root login or by using the su — command. Rather than using su, it
    is even better to use sudo to only execute the command that you need permissions
    for, and to return to your own environment.

    - Take passwords seriously. Use passwords. Change your passwords regularly.

    - Try to always use SSH or SSL. Avoid telnet, FTP and E-mail clients and other
    client programs which use unencrypted passwords over the network. Security is
    not only securing your computer, it is also about securing your passwords.

    - Limit resources using quota and limit.

    - The mail for root should be delivered to, or at least read by, an actual person.

    - The SANS institute [http://www.sans.org] has more tips and tricks, sorted per
    distribution, with mailing list service.

    - Check the origin of new software, get it from a trusted place/site. Verify new
    packages before installing.

    - When using a non-permanent Internet connection, shut it down as you don''t need
    it anymore.

    - Run private services on odd ports instead of the ones expected by possible hackers.'
  merge: -1
