  md: '# Processes


    rewarded by the system and given a higher priority (a lower nice number), for
    example keyboard input always gets highest priority on a system.


    Defining the priority of a program is done with the nice command.


    Most systems also provide the BSD renice command, which allows you to change the
    niceness of a running command. Again, read the man page for your system-specific
    information.


    # Interactive programs


    It is NOT a good idea to nice or renice an interactive program or a job running
    in the foreground.


    Use of commands is usually a task for the system administrator. Read the man page
    for more info on extra functionality to the system administrator.


    # CPU resources


    On every Linux system, many programs want to use the CPU/s at the same time, even
    if you are the only user on the system. Every program needs a certain amount of
    cycles on the CPU to run. There may be times when there are not enough cycles
    because the CPU is too busy. The optimum command is wildly inaccurate (it only
    displays averages, you know what is normal), but far from being useless. There
    are some actions you can undertake if you think your CPU is to blame for the unresponsiveness
    of your system:


    +   - Run programs when the load is low. This may be the way on your system during
    the night. See next section for scheduling.

    - Prevent the system from doing unnecessary work: stop daemons and programs that
    you don''t use, locate instead of a heavy find ...

    - Run big jobs with a low priority


    If none of these solutions are an option in your particular situation, you may
    want to upgrade your CPU. On a UNIX machine this is for the system admin.


    # Memory resources


    When the currently running processes exceed more memory than the system has physically
    available, a Linux system will not crash; it will start paging, swapping, moving
    contents of the physical memory (pieces of running programs or entire programs
    in the case of swapping) to disk, replacing the physical memory to handle processes.
    This slows the system down enormously access to memory is much slower than access
    to memory. The top command can be used to display memory and swap use. Systems
    with glibc offer the memessages command to visualize memory usage


    If you have a lot of memory and swap space being used, you can try:


    +   - Killing, stopping or renicing those programs that use a big chunk of memory

    - Adding memory (and in some cases more swap space) to the system.

    - Tuning system performance, which is beyond the scope of this document. See the
    reading list in Appendix A, Where to go from here? for more.


    # I/O resources


    While I/O operations are a major cause of stress for system admins, the Linux
    system offers poor utilities to measure I/O performance. The ps, vmstat and top
    give some indication about how many programs are waiting for I/O; netstat displays
    interface statistics, but there are virtually no tools'
