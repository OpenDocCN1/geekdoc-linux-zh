    |---|---|

    | 0 - | The access right that is supposed to be on this place is not granted.
    |

    | 4 or r | read access is granted to the user category defined in this place |

    | 2 or w | write permission is granted to the user category defined in this place
    |

    | 1 or x | execute permission is granted to the user category defined in this
    place |


    # Table 3.8. User group codes


    | Code | Meaning |

    |---|---|

    | u | user permissions |

    | g | group permissions |

    | o | permissions for others |


    This forward scheme is applied very strictly, which allows a high level of security
    even without network security. Among other functions, the security scheme takes
    care of user access to programs, which can save files on a need-to-know basis
    and protect sensitive data such as home directories and configuration files.


