    # Blocked drives


    NEVER force the drive. The trick with the paperclip is a bad idea, because this
    will eventually expunge the CD, but your system will think the CD is still there
    because procedures were not followed. Chances are likely that you will have to
    reboot the system back in a consistent state.


    If you keep getting "device busy" messages, check first that all shell sessions
    have left the CD file system and that no graphical applications are using it anymore.
    When in doubt, use the hof tool to trace down the process(es) still using the
    CD resource.


