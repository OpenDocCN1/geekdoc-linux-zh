  md: "# Automating package management and updates\n\n# General remarks\n\nThe first\
    \ thing you do after installing a new system is applying updates; this applies\
    \ to all operating systems\n Linux is not different.\n\nThe updates for most Linux\
    \ systems can usually be found on a nearby site mirroring your distribution.\n\
    Lists of sites offering this service can be found at your distribution's web site,\
    \ see Appendix A, Where\nto go from here?\n\nUpdates should be applied regularly,\
    \ if possible - but every couple of weeks would be a reasonable\nstart. You should\
    \ really try to have the most recent version of your distribution, since Linux\
    \ changes\nconstantly. As we said before, new features, improvements and fixes\
    \ are supplied at a steady rhythm,\nand important security problems are addressed.\n\
    \nThe good news is that most Linux distributions provide tools so you don't have\
    \ to upgrade tens of\npack by hand. The following sections give an overview of\
    \ package manager managers. There is\nmuch more to this subject, even regular\
    \ updates of source packages are manageable automatically; we only\nlist the commonly\
    \ known systems. Always refer to the documentation for your specific distribution\n\
    for advised procedures.\n\n# APT\n\nThe Advanced Package Tool is a management\
    \ system for software packages. The command line tool for\nhanding packages is\
