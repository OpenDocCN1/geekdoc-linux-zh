    # The most important files and directories


    # The kernel


    The kernel is the heart of the system. It manages the communication between the
    underlying hardware and the peripherals. The kernel also makes sure that processes
    and daemons (server processes) are started and stopped at the right times. The
    kernel has a lot of other tasks, so many that there is a special kernel-development
    list on this only, where huge amounts of information are shared. It led us too
    far to discuss the kernel in detail. For now it suffices to know that the kernel
    is the most important file on the system.


    # The shell


    What is a shell?


    When I was looking for an appropriate explanation on the concept of a shell, it
    gave me more trouble than I expected. All kinds of definitions are available,
    ranging from the simple comparison that "shell is the steering wheel of the car,"
    to the vague definition in the Bash Manual which says that "bash is a command
    language interpreter," or an even more obscure expression, "shell manages the
    interaction between the system and users." A shell is much more than


    A shell can be compared with a way of talking to the computer, a language. Most
    users know that other, the point-and-click language of the desktop. In that language
    the computer is leading the conversation, while the shell has the passive role
    of picking tasks from the ones. It is very difficult for a programmer to include
    all options and possible use of a command in the GUI-format. Thus, GUIs are almost
    less capable than the command that form the backend.


    The shell, on the other hand, is an advanced way of communicating with the system,
    because it allows for two-way communication and initiative. Both parties in the
    communication are equal, so new ideas can be tested. The shell allows the user
    to handle a system in a very flexible way. An additional asset is that the shell
    allows for task automation.


    # Shell types


    Just like people know different languages and dialects, the computer knows different
    shell types:


    +   sh or Bourne Shell: the original shell still used on UNIX systems and in related
    environments. This is the basic shell, a small program with features. When in
    POSIX-compatible mode, bash will emulate this shell.'
