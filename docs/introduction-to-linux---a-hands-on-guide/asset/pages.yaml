  md: '# Ending processes


    When a process ends normally (it is not killed or otherwise unexpectedly interrupted),
    the process returns its exit status to the parent. This exit status is a number
    returned by the program providing the results of the program''s execution. The
    system of returning information upon executing a job has origin in the C programming
    language in which UNIX has been.


    The return codes can be interpreted by the parent, or in scripts. The values of
    the return codes are program-specific. This information can usually be found in
    the man pages of the specified program, for example the grep return codes -1 if
    no matches are found, upon which a message on the lines of "No files found" be
    printed. Another example is the Bash builtin command true, which does nothing
    except return an exit status of 0, meaning success.


    # Signals


    Processes end because they receive a signal. There are multiple signals you can
    send to a process. Use the kill command to send a signal to a process. The command
    kill -1 shows a list of signals. Most signals are internal use by the system,
    or for programmers when they write code. As a user, you will need the following
    signals:


    # Table 4.2. Common signals


    | Signal name | Signal number | Meaning |

    |---|---|---|

    | SIGTERM | 15 | Terminate the process in an orderly way. |

    | SIGINT | 2 | Interrupt the process. A process can ignore this signal. |

    | SIGKILL | 9 | Interrupt the process. A process cannot ignore this signal. |

    | SIGHUP | 1 | For daemons: reada the configuration file. |


    You can read more about default actions that are taken when sending a signal to
    a process in man 7.


