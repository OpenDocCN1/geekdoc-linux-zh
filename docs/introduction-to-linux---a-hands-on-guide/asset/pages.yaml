    # ### Figure 10.3. SSH X11 forwarding


    SSH will also automatically set up Authority on the server machine. For this purpose,
    it will generate

    a random authorization cookie, store it in Xauthory on the server, and verify
    that any forwarded

    connections carry this cookie and replace it by the real cookie when the connection
    is opened. The real

    authentication cookie is never sent to the server machine (and no cookies are
    sent in the penny).


    Forwarding of arbitrary TCP/IP connections over the secure channel can be specified
    either on the com-

    mand line or in a configuration file.'
