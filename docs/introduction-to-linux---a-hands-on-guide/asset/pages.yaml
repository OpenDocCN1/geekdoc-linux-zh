  md: '# About files and the file system


    On a server, system data tends to be separate from user data. Programs that offer
    services are kept in a different place than the data handled by this service.
    Different partitions will be created on such systems:


    +   * a partition with all data necessary to boot the machine

    * a partition with configuration data and server programs

    * one or more partitions containing the server data such as database tables, user
    mails, an ftp archive

    * a partition with user programs and applications

    * one or more partitions for the user specific files (home directories)

    * one or more swap partitions (virtual memory)


    Servers usually have more memory and thus more swap space. Server processes, such
    as databases, may require more space than usual; see the specific documentation
    for detailed information. For better performance, swap is often divided into different
    swap partitions.


    # Mount points


    All partitions are attached to the system via a mount point. The mount point defines
    the place of a particular data set in the file. Usually, all partitions are connected
    through the *root* partition. On this partition, which is indicated with the slash
    (/), directories are created. These empty directories will be the starting point
    of the partitions that are attached to them. An example: a partition that holds
    the following directories:


    ```

    videos/ cd-images/ pictures/

    ```


    We want to attach this partition in the filesystem to a directory /opt/media.
    In order to do this, the system administrator has to make sure that the directory
    /opt/media exists on the system. Preferably, it should be an empty directory.
    How this is explained later in this chapter. Then using the mount command, the
    administrator can attach the partition to the system. When you look at the content
    of the empty directory /opt/media, it will contain the files and directories that
    are on the mounted medium (hard or soft disk, CD, DVD, flash card, USB or other
    storage device).


    During setup, all partitions are thus mounted, as described in the file /etc/fstab.
    Some partitions are not mounted by default, for instance they are not constantly
    connected to the system, such as the storage used by your digital camera. If configured,
    the device will be mounted as the system notices it is connected, or it can be
    user-mountable, i.e you don''t need to be the system administrator to attach the
    device to and from the system. There is an example in the section Using "rsync"


    On a running system, information about the partitions and their mount points can
    be displayed using the *df* command (which shows *disk full* or *disk free*).
    In Linux, *df* is the GNU version, and supports the *-h* or human readable option
    which greatly improves readability. That commercial UNIX machines have their own
    versions of *df* and many other commands. Their behavior is usually the same,
    though GNU users of common tools often have more and better features.


    The *df* command only displays information about active non-swap partitions. These
    can include partitions from other networked systems, like in the example below
    where home directories are mounted from a file server on the network, a situation
    often encountered in corporate environments.


    31'
