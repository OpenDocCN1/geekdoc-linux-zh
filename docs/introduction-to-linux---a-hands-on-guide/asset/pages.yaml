    # Miscellaneous protocols


    Linux also has support for Amateur Radio, WAN internetworking (X25, Frame Relay,
    ATM), InfraRed and other wireless connections, but since these protocols usually
    require special hardware, we won''t discuss them in this document.


    # Network configuration and information


    # Configuration of network interfaces


    All the big, friendly Linux distributions come with various graphical tools, allowing
    for easy setup of the computer in a local network, for connecting it to an Internet
    Service Provider or for wireless access. These can be started up from the command
    line or a menu:


    +   - Ubuntu configuration done Selecting -> Administration -> Networking.


    +   - RedHat comes with redhat-config-network, which has a graphical and a text
    mode interface.


    +   - Suse''s YAST or YAST2 is an all-in-one configuration tool.


    +   - Mandrake/Mandriva comes with a Network and Internet Configuration Wizard,
    which is preferably started up from Mandrake''s Control Center.


    +   - On Gnome systems: gnome-network-preferences.


    +   - On KDE systems: networkconfig.


    Your system documentation provides plenty of advice and information about availability
    and use of tools.


    Information that you will need to:


    +   - For connecting to the local network, for instance with your home computers,
    or at work: hostname, domainname and IP address. If you want to set up your network
    best, do some more reading first. At work, this information is likely to be given
    to your computer automatically when you boots up. When in doubt, it is better
    not to specify any information than making it up.


    +   - For connecting to the Internet: username and password for your ISP, telephone
    number when using a modem. Your ISP usually automatically assigns you an IP address
    and all the other things necessary for your Internet applications to work.


    # Network configuration files


    The graphical tools edit a specific set of network configuration files, using
    a couple of basic commands. The exact names of the configuration files and their
    location in the file system is largely dependent on your Linux distribution and
    version. However, a couple of network configuration files are common on all UNIX
    systems:'
