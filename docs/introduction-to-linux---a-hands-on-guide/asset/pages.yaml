- img_proc: true
  md: '# Use GNU tar for compatibility


    The archives made with a proprietary tar version on one system, may be incompatible
    with tar on another proprietary system. This may cause much headaches, such as
    if the archive needs to be recovered on a system that doesn''t exist anymore.
    Use the GNU tar on all systems to prevent your system admin from bursting into
    tears. Linux uses GNU tar. When working on UNIX machines, enter tar --help to
    find out which version you are using. Contact your system admin if you don''t
    see the word GNU somewhere.


    In the example below, an archive is created and unpacked.


    ```

    gaby-> ls images/

    me+tux.jpg  nimf.jpg

    ```


    ```

    gaby-> cvf images-in-a-dir.tar images/

    images/

    images/nimf.jpg

    images/me+tux.jpg

    ```


    ```

    gaby-> cd images

