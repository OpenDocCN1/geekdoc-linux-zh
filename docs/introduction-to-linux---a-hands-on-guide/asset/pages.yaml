  md: '# # Chapter 1. What is Linux?


    We will start with an overview of how Linux became the operating system it is
    today. We will discuss past and future development and take a closer look at the
    advantages and disadvantages of this system. We will talk about distributions,
    about Open Source in general and try to explain a little something about GNU.


    This chapter answers questions:


    +   - What is Linux?

    - Where and did Linux start?

    - Isn''t Linux system where everything is done in text mode?

    - Does Linux have a future or is it just hype?

    - What are the advantages of using Linux?

    - What are the disadvantages?

    - What kinds of Linux are and how do I choose the one that fits me?

    - What are the Open Source and GNU movements?


    # # History


    # ## UNIX


    In order to understand the popularity of Linux, we need to travel back in time,
    about 30 years ago...


    Imagine computers as big as houses, even stadiums. While the sizes of those computers
    posed substantial problems, there was one thing that made this even worse; every
    computer had a different operating system. Software was customized to serve a
    specific purpose, and software for one given system didn''t run on another system.
    Being able to work with one system didn''t automatically mean that you could work
    with another. It was difficult, both for the users and the system administrators.


    Computers were extremely expensive, and sacrifices had to be made even after the
    original purchase to get the users to understand how they worked. The total cost
    per unit of computing power was enormous.


    Technologically the world was not quite that advanced, so had to live with the
    size for another decade. In 1969, a team of developers in the Bell Labs started
    working on a solution for the software problem, to address these compatibility
    issues. They developed a new operating system, which was


    +   - 1. Simple and elegant.

    - 2. Written in the C programming language instead of assembly code.

    - 3. Able to recycle code.


    The Bell Labs developers named their project "UNIX."'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# What is Linux?


    The code recycling features were very important. Until then, all commercially
    available computer systems were written in a code specifically developed for one
    system. UNIX on the other hand needed only a small piece of that code, which is
    commonly known as the kernel. The kernel is the only piece of code that needs
    to be adapted for every specific system and forms the base of the UNIX system.
    The operating system and all other functions were built around this kernel and
    written in a higher programming language, C. This was specially developed for
    creating the UNIX system. Using this new technique, it was much easier to develop
    an operating system that could run on different types of hardware.


    The software vendors were quick to adapt, since could tell them ten times more
    software almost effortlessly. Weird situations came in existence: for instance
    computers from different vendors in the same network, or users working on different
    systems without the need for extra education to use another computer. UNIX did
    a great deal to help users become compatible with different systems.


    Through the next couple of decades the development of UNIX continued. More things
    became possible to do and more hardware and software vendors supported UNIX to
    their products.


    UNIX was initially found only in large environments with mainframes and minicomputers
    (note that a PC is a "micro" computer). You had to work at a university, for the
    government or for large financial corporations in order to get your hands on a
    UNIX system.


    But smaller computers were being developed, and by the end of the 80''s, many
    people had computers. By that time, there were several versions of UNIX available
    for the PC architecture, but none of them were truly free and important; they
    were terribly slow, so many people ran MS DOS or Windows 3.1 on their home PCs.


    # Linux and Linux


    By the beginning of the 90s home PCs were finally powerful enough to run a full
    blown UNIX. Linux Torvalds, a young man studying science at the university of
    Helsinki, thought it would be a good idea to have some sort of freely available
    academic version of UNIX, and prompted to code.


    He asked questions, looking for answers and solutions that would help him get
    UNIX on his PC. Below is one of his first posts in comp.minix, dating from 1991:


    ```

    From: torvalds@klaava.Helsinki.FI (Linus Benedict Torvalds)

    Newsgroups: comp.minix and posix-minix

    Message-ID: Gcc-1.40 and [1991Jul03,100050.9886@klaava.Helsinki.FI]

    Date: 3 Jul 91 10:00:50 GMT

    ```


    Hello netanders,

    Due to a project I''m working on (minix), I''m interested in the posix standard
    definition. Could somebody point me to a (preferably) machine-readable format
    of the latest posix rules? Ftp-sites would be nice.


    From the start, Linux''s goal was to have a free system that was completely compliant
    with the UNIX. That is why he asked for POSIX standards, POSIX still being the
    standard for UNIX.


    In those days plug-and-play was never invented, but so many people were interested
    in having a UNIX system of their own this was only a small obstacle. New drivers
    became available for all kinds of new hardware at a continuously rising speed.
    Almost soon as a new piece of hardware became available, someone bought it and
    submitted it to the Linux test, as the system was gradually becoming released,
    releasing free code for an even wider range of hardware. These copies didn''t
    stop at their PC; every piece of hardware they had was useful for Linux.'
  merge: -1
  pgno: 17
