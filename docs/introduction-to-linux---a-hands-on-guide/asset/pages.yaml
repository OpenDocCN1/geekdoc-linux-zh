    more money\nless work\nThu Feb 28 20:23:07 CET 2002\n```\n\nThe date command normally\
    \ put the last line on the screen; now it is appended to the file wish-\nlist.\n\
    \n# Advanced redirection features\n\n# Use of file descriptors\n\nThere are three\
