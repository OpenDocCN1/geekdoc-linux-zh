  md: '# Networking


    +   * The IP address is marked with “inet addr”.

    * The hardware address follows the “HWaddr” tag.


    Both ifconfig and ip display more detailed configuration information and a number
    of statistics about each interface, and maybe most important, whether it is “UP”
