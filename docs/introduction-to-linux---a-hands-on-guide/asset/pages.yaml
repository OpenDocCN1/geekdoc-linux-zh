    # # Scheduling processes


    # ## Use idle time!


    A Linux system can have a lot to suffer from, but it usually suffers only during
    office hours. Whether in an office environment, a server room or at home, most
    Linux systems are just idling away during the morning, the evening, the nights
    and weekends. Using this idle time can be a cheaper than buying machines you absolutely
    need if you are doing everything at the same time.


    There are three types of delayed execution:


    +   - Waiting a little and then resuming job execution, using the sleep command.
    Execution time depends on the system time at the moment of submission.


    +   - Running a command at a specified time, using the at command. Execution of
    the job(s) depends on system time, not the time of submission.


    +   - Regularly running a command on a monthly, weekly, daily or hourly basis,
    using the cron facilities.


    The following sections discuss each possibility:


    # # The sleep command


    The Info page on sleep is probably one of the shortest there is. All sleep does
    wait. By default the time is expressed in seconds.


    Why does it exist? Some practical examples:


    Somebody calls you on the phone, you say "Yes I''ll be with you in half an hour"
    but you''re about drowned in work as it is and bound to forget for your lunch:


    ```

    sleep 1800; echo "Lunch time.." &

    ```


    When you can''t use the at for some reason, it''s five o''clock, you want to go
    home but there''s still work to do and right now your eating system is crashing:


    ```

    sleep 10000; myprogram &

    ```


    Make sure there''s an auto-logout on your system, and that you log out or lock
    your desktop/office when submitting this kind of job, or run it in a screen session.


    When you run a series of large files, but yet other users are to print in between:


    ```

    lp lotext; sleep 900; lp hugefile; sleep 900; lp anotherlargefile

    ```


    Printing files is discussed in Chapter 8, Printers and printing.


    Programmers often use the sleep command to halt script or program execution for
    a certain time.


    # # At the command


    The at command executes commands at a given time, using your default shell unless
    you tell the command otherwise (see the man page).'
