  md: '```

    killproc ICanSeeYou

    echo

    rm -f /var/lock/subsys/ICanSeeYou

    rm -f /var/run/ICanSeeYou/ICanSeeYou.pid

    ;;

    status()

    status ICanSeeYou

    ;;

    restart()

    $0 stop

    $0 start

    ;;

    *

    echo "Usage: $0 {start|stop|restart|status}"

    exit 1

    esac

    ```


    First, with the .command (dot) a set of functions, used by almost all scripts
    in /etc/rc.d/init.d is loaded. Then a case command is issued, which defines 4
    ways the script can execute. An example might be made by ICanSeeYou start. The
    decision of which case to apply is by reading the first argument to command, with
    the expression $1.


    When no argument is given, the default case, marked with an asterisk, is applied,
    upon which the script gives an error message. The case list is ended with the
    esac statement. In the start case the server is started as a daemon, and a process
    ID is locked. In the stop case, the process is traced down, and the lock and the
    PID are removed. Options, such as the daemon option and functions like killproc
    are defined in the /etc/rc.d/init.d/functions file. This setup is specific to
    the distribution used in this example. The inscripts on your system may use other
    functions, in other files, or none at all.


    Upon success, the script returns an exit code of zero to its parent.


    This script is a fine example of functions, which make the script easier to read
    and the work done faster. Note that use sh instead of bash, to make them useful
    on a wider range of systems. On a Linux system, calling bash as sh results in
    the shell running POSIX-compliant mode.


    The man pages contain more information about commands, for- and while-loops and
    regular expressions. A Comprehensible Bash course for system administrators and
    power users, with from the same author as this Introduction to Linux guide, is
    at http://tld.garrels.be/training/bash/. Detailed description of Bash features
    and applications is in the reference guide Advanced Bash Script [http://tdlp.org/LDF/abs/index.html].


    # The graphical environment


    # Introduction


    The average user may not care too much about login settings, but Linux offers
    a wide variety of flashy window and desktop managers for under X, the graphical
    environment. The use and configuration of window managers and desktops is straightforward
    and may even resemble the MS Windows, Apple or UNIX Linux users prefer flashy
    desktops and fancier window managers. We won''t discuss the user specific configuration
    here and read the documentation using the built-in Help functions which these
    managers provide and you will get along fine.'
