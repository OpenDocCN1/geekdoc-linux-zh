  md: '# # Chapter 2. Quickstart


    In order to get the most out of this guide, we will immediately start with a practical
    chapter on connecting to the Linux system and doing some basic things.


    We will discuss:


    +   - Connecting to the system

    - Disconnecting from the system

    - Text and graphic mode

    - Changing your password

    - Navigating through the file system

    - Determining file type

    - Looking at text files

    - Finding help


    # # Logging in, activating the user interface and logging out


    # ## Introduction


    In order to work on a Linux system directly, you will need to provide a user name
    and password. You always need to authenticate to the system. As we already mentioned
    in the exercise from Chapter 1, What is Linux?, most PC-based Linux systems have
    two basic modes for a system to run in: either quick and sober in text console
    mode, which looks like DOS with mouse, multitasking and multi-user features, or
    in graphic mode, which looks better but eats more system resources.


    # ## Graphic mode


    This is the default nowadays on most desktop computers. You know you can connect
    to the system using graphic mode when you are first asked for your user name,
    and then in a new window, to type your password.


    To log in, use the mouse pointer is in the login window, provide your user name
    and password to the system and click OK or press **Enter**.


    # ### Careful with root account!


    It is generally considered a bad idea to connect (graphically) using the root
    user name, the system administrator''s account, since the use of graphics includes
    a lot of extra programs, in root''s case with a lot of extra permissions. To keep
    risks as low as possible, use a normal user to connect graphically. But there
    are enough reasons to keep this in mind as a general advice, for all use of the
    root account: only log in root when root privileges are required.


    After entering your user name/password combination, it can take a little bit before
    the graphical environment is started, depending on the speed of your computer,
    on the software you use and on your personal settings.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'To continue, you will need to open a terminal window or xterm for short (X
    being the name for the under-lying software supporting the graphical environment).
    This program can be found in the Applications -> Utilities, System Tools or Menu,
    depending on which window manager you are using. There might be icons that you
    can use as a shortcut to get an xterm window, and clicking the right mouse button
    on the desktop background will usually present you with a menu containing a terminal
    window.


    While browsing the menus, you will notice that a lot of things can be done without
    entering commands via the keyboard. However, the good old point-''n''-click method
    of dealing with the computer will do. But this is for future network and system
    administrators, who will need to deal with the heart of the system. They need
    a stronger tool than a mouse to handle all the tasks they will face. This tool
    is the shell, and in graphical mode, we activate our shell by opening a terminal
    window.


    The terminal window is your control panel for the shell. Almost everything that
    follows is done using this simple but powerful text tool. A terminal window should
    always show a command prompt when you open one. This terminal shows a standard
    prompt, which displays the user''s login name, and the current working directory,
    represented by the twiddle (-).


    **Figure 2.1.** Terminal window


    Another common form for a prompt is this one:


    ```

    `[user@host dir]`

    ```


    In the example, *user* will be your login name, *hosts* the name of the machine
    you are working on, and *dir* an indication of your current location in the file
    system.


    Later we will discuss prompts and their behavior in detail. For now, it suffices
    to know that prompts can display all kinds of information, but that they are not
    part of the commands you are giving to your system.


    To disconnect from the system in graphical mode, you need to close all terminal
    windows and other applications. After that, hit the login icon or Log Out in the
    menu. Closing everything is not necessary, and the system can do this for you,
    but session management might put currently open applications back on your screen
    when you connect again, which takes longer and is not always the desired effect.
    Here, this behavior is configurable.


    When you see the login screen, asking to enter user name and password, logout
    was successful.


    # Gnome or KDE?


    We mentioned before that Gnome and KDE desktops already ready a couple of times.
    These are the two most popular ways of managing your desktop, although there are
    many others. Whether desktop you choose to work with is fine - as long as you
    know how to open a terminal window. However, we will continue to refer to both
    Gnome and KDE for the most popular ways of achieving certain tasks.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Text mode


    You know you''re in text mode when the whole screen is black, showing (in most
    cases white) characters. A text mode login screen typically shows some information
    about the machine you are working on, the name of the machine and a prompt waiting
    for you to log in:


    RedHat Linux Release 8.0 (Psyche)


    ```

    blast login: _

    ```


    The login is different from a graphical login, in that you have to hit the Enter
    key after providing your user name, because there are no buttons on the screen
    that you can click with the mouse. Then you should type your password and press
    another Enter. You won''t see any indication that you are entering something,
    not even an asterisk, and you won''t see the cursor move. But this is normal on
    Linux and is done for security reasons.


    When the system has accepted you as a valid user, you may get some more information,
    called the message of the day, which can be anything. Additionally, it is popular
    on UNIX systems to give a fortune cookie, which contains some general wise or
    unwise (if it is up to you) thoughts. After that, you will be given a shell, with
    the same prompt that you would get in graphical mode.


    # Don''t log as root


    Also in text mode: log as root is only to setup and configuration that absolutely
    requires administrator privileges, such as adding users, installing software packages,
    and performing work and other system configuration. Once you are finished, immediately
    leave the special account and resume your work as a non-privileged user. Alternatively,
    some systems, like Ubuntu, will force you to use sudo, so that you do not need
    direct access to the administrative account.


    Logging out is done by entering the logout command, followed by Enter. You are
    successfully disconnected from the system when you see the login screen again.


    # The power button


    While Linux is not meant to be shut off without application of the proper procedures
    for halting the system, hitting the power button is equivalent to starting those
    procedures on newer systems. However, powering an old system without going through
    the halting process might cause severe damage! If you want to be sure, always
    use the Shut down option when you log out from the graphical interface, or on
    the login screen (where you have to give your user name and password) look around
    for a shutdown button.


    Now that we know how to connect and disconnect from the system, we are ready for
    our first commands.


    # Absolute basics


    # The commands


    Here are the quickies, we need to get started; we will discuss them later in detail.'
