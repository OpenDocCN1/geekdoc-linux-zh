  md: '# Exercises


    A practical exercise for starters: install Linux on your PC. Read the installation
    manual for your distribution

    /or the Installation HOWTO to do it.


    # Read the docs!


    Most errors stem from reading the information provided during the install. Reading
    the in-

    stall messages carefully is the first step on the road to success.


    You must know BEFORE starting a Linux installation:


    +   * Will this distribution run on my hardware?

    * Check with http://www.tldp.org/HOWTO/Hardware-HOWTO/index.html [http://www.tldp.org/HOWTO/Hardware-HOWTO/index.html]
    when in doubt about capability of your hardware.

    * What kind of keyboard I have (number of keys, layout)? What kind of mouse (serial/parallel,
    number buttons)? How many MB of RAM?

    * Will I install from a base workstation, or a server, or will I to select packages
    myself?

    * Will I install from my hard disk, from a CD-ROM, or using the network? Will
    I adapt the BIOS for any this? Does the installation method require a boot disk?

    * Will Linux be the only system on this computer, or will it a dual boot installation?
    Should I make a large partition in order to install virtual systems later on,
    or is this a virtual installation itself?

    * Is this computer in a network? What is its hostname, IP address? Are there gateway
    servers or other important networked machines my box communicate with?


    # Linux expects to be networked


    Not using the network or configuring it incorrectly may result in slow startup.


    +   * Is this computer gateway/router/firewall? (If you think to about this question,
    it probably isn''t.)

    * Partitioning: let the installation program do it for you, we will discuss partitions
    in detail in Chapter 3. About files and the file system. There is system-specific
    documentation available if you want to know everything about it. If your Linux
    distribution not offer default partitioning, that probably means it is not suited
    for beginners.

    * Will this start up in text mode or in graphical mode?

    * Think of a good password for the administrator of this machine (root). Create
    a non-root user account (non-privileged access to the system).

    * Do I need a rescue disk? (recommended)

    * Which languages do I want?


    The full checklist can be found at http://www.tldp.org/HOWTO/Installation-HOWTO/index.html
    [http://www.tldp.org/HOWTO/Installation-HOWTO/index.html].


    In the following chapters we will find out if the installation has been successful.'
