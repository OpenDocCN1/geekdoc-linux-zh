  md: '# Managing processes


    # Work for the system admin


    While managing system resources, including processes, is a task for the local
    system administrator, it doesn''t hurt a common user to know something about it,
    especially where his or her own processes and their optimal execution are concerned.


    We will explain a little bit on a theoretical level about system performance,
    though not as far as hardware optimization and other advanced procedures. Instead,
    we will study the daily problems a common user is confronted with, and actions
    such a user can take to optimally use the resources available. As we learn in
    the next section, this is mainly a matter of thinking before acting.


    **Figure 4.2. Can''t you go faster?**


    # How long does it take?


    Bash offers a built-in **time** command that displays how long a command takes
    to execute. The timing is highly accurate and can be used on any command. In the
    example below, it takes about a minute and half to make this book:


    ```

    tilly:///xml/src time make

    Output written on abook.pdf (222 pages, 1619861 bytes).

    Transcript written on abook.log.


    real lm41.056s

    user lm31.190s

    sys 0m.180s

    ```


    The GNU **time** command in `/usr/bin` (as opposed to the shell built-in version)
    displays more information that can be formatted in different ways. It also shows
    the exit status of the command, and the total elapsed time. The same command as
    the above using the independent **time** gives this output:


    ```

    tilly:///xml/src /usr/bin/time-make

    Output written on abook.pdf (222 pages, 1595027 bytes).

    Transcript written on abook.log.


    Command exited with non-zero status 2

    88.87user 1.74system 1:36.21elapsed 94%CPU

    (0avgtext+0avgdame 0maxresident)k

    ```'
