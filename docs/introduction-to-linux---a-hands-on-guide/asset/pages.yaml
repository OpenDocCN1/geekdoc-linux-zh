    # GRUB features


    This method is called *direct loading* because instructions are used to directly
    load the operating system, with no intermediate code between the boot-loaders
    and the operating system''s main files (such as the kernel). The boot process
    used by operating systems may differ slightly from the above, however. For example,
    Microsoft''s OS and Windows operating systems completely overwrite anything on
    the MBR when they are installed without incorporating any of current MBR configuration.
    This destroys any other information stored in the MBR by other operating systems,
    such as Linux. The Microsoft operating systems, as well as various proprietary
    operating systems, are loaded using a chain boot method. With this, the MBR points
    to the first sector of the partition holding the operating system, where it finds
    the special files necessary to boot that operating system.


    GRUB supports both methods, allowing you to use with almost any operating system,
    most popular file systems, and any hard disk your BIOS can recognize.


    GRUB contains a number of features; the most important:


    +   - GRUB provides a true command-based, pre-OS environment on x86 machines to
    maximize flexibility in loading operating systems with certain options or gathering
    information about the system.

    - GRUB supports Logical Block Addressing (LBA) mode, needed to access many IDE
    and all SCSI hard disks. Before LBA, hard drives encounter a 1024-cylinder limit,
    where the BIOS could not find a file after that.

    - GRUB''s configuration file is read from the disk every time the system boots,
    preventing you from having to write the MBR every time you change the boot options.


    A full description of GRUB may be found by issuing the *info grub* command or
    at the GRUB site [http://www.org/software/grub/]. The Linux Documentation Project
    has a Multiboot with GRUB MiniHOW [http://www.tdlp.org/mini/Multiboot-with-GRUB].


    # Init


    The kernel, once loaded, finds *init* in bin and executes it.


    When it starts, it becomes the parent or grandparent of all the processes that
    start up automatically on your Linux system. The first init does, is reading its
    initialization file, /etc/initab. This init instructs to read any initial configuration
    script for the environment, which sets the path, starts swapping, checks the file
    systems, and so on. This step takes care of everything that your system needs
    to have at initialization: setting the clock, initializing serial ports and forth.


    Then init continues to read the /etc/inittab file, which describes how the system
    should be set up in each run level and sets the default run level. A run level
    is a configuration of processes. All UNIX-like systems can be run in different
    configurations, such as the single user mode, which is referred to as run level
    1 or run level 5 (or s). In this mode, only the system administrator can connect
    to the system. It is used to perform maintenance without risks of damaging the
    system or user data. Naturally, in this configuration we don''t need to offer
    user services, so they will all be disabled. Another run level is the reboot level,
    or run level 6, which shuts down all running services according to the appropriate
    procedures and restarts the system.


    Use the who to check what your current run level is:


