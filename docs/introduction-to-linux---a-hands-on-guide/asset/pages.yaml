  md: 'If you see the file /etc/X11/XF86Config is present on your system, a full description
    can be found in the Info or pages about XF86Config.


    Because of licensing issues with Free8, new systems usually come with the XOrg
    distribution of the X server and tools. The main configuration file is xorg.conf,
    usually also in /etc/X11. The file consists of a number of sections that may occur
    in any order. The sections contain information about your monitor, your video
    adapter, the screen configuration, your keyboard et cetera. As a user, you need
    not worry too much about what is in this file, since everything is determined
    at the time the system is installed.


    Should you need to change graphical server settings, however you can run the configuration
    tools or edit the configuration files that set up the interface to the XFree86
    server. For more information; your distribution might have its own tools. Since
    misconfiguration may result in unreadable garbage in graphical mode, you may want
    to make a backup copy of the configuration before attempting to change it, just
    to be on the safe side.


    # Keyboard specific settings


    # Keyboard setup


    Setting the keyboard layout is done using the loadkeys command for text consoles.
    Use your local X configuration tool or edit the Keyboard section in XF86Config
    manually to configure the layout for graphical mode. The XkbLayout is the one
    you set to:


    ```

    XkbLayout      "us"

    ```


    This is the default. Change it to your local settings by replacing the quoted
    value with any of the names listed in the subdirectories of your keymaps directory.
    If you can''t find the keymaps, try displaying the location on your system using
    the command


    ```

    locate keymaps

    ```


    It is possible to combine keyboard layouts, like in this:


    ```

    Xkblayout      "us,ru"

    ```


    Make a backup of the /etc/X11/XF86Config file before editing it! You will need
    to use the root account to do this.


    Log out and reconnect in order to reload X settings.


    The Gnome Keyboard Applet enables real-time switching between layouts; no special
    permissions are needed for using this program. KDE has a similar tool for switching
    keyboard layouts.


    # Fonts


    Use the setfont command to load fonts in text mode. Most systems with a standard
    inputrc file which enables combining of characters, such as the French "é" (meta
    characters). The system admin should then add the line


    ```

    export INPUTRC="/etc/inputrc"

    ```'
