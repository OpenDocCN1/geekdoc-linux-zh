    # Remarks


    # General use of office documents


    Try to limit the use of office documents for the purposes they were meant for:
    the office.


    An example: it drives most Linux users if you send them a mail that says in the
    body something

    like: "Hello, I want to tell you something, see attach", and then the attachment
    proves to be an MS Word

    compatible document like: "Hello my friend, how is your new job going and you
    have to time

    with me tomorrow? Also a bad idea is the implication of your signature in a file,
    for instance.

    If you want to send messages or files, use GPG, the PGP-compatible GNU Privacy
    Guard or SSL (Secure

    Socket Layer) certificates.


    These users are not annoyed because they are unable to read these documents, or
    because they are worried\and that formats typically generate larger files, but
    because of the implication that they are

    using MS Windows, and possibly because of the extra work of starting some additional
    programs.


    # System and user configuration files


    In the next chapter, we start configuring our environment, and this might include
    editing all kinds of files\and determine how a program behave.


    > Don''t edit these files with any component!


    The default file specification would make the program add several lines of code,
    defining the format

    of the file and the fonts used. These files won''t be inserted in the correct
    way by the programs depending\and them, resulting in errors or a crash of the
    program reading the file. In some cases, you can save the file\sand plain text,
    but you''ll run into trouble when making this habit.


    # But I want a graphical text editor!


    If you really insist, try gedit, kind, write or xedit; these programs only do
    text files, which is what we

    be needed. If you plan on doing anything serious, stick to a real text editor
    such as

    vim or emacs.


    An acceptable alternative is gvim, the Gnome version of vim. You still need to
    use vi commands, but if

    you are stuck, you can look them up in the menus.


    # Summary


    In this chapter we learned to use an editor. It depends on your own individual
    preference which

    you use, it is necessary to at least know how to use one editor.'
