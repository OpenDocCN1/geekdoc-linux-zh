    * How to get the most out of your system


    # ## Processes inside out


    # ### Multi-user and multi-tasking


    Now that we are more used to our environment and we are able to communicate a
    little bit with our system, it is time to study the processes we can start in
    more detail. Not every command starts a single process. Some commands initiate
    a series of processes, such as mozilla, others, like ls, are executed as a single
    command.


    Furthermore, Linux is based on UNIX, where it has been common policy to have multiple
    users running commands at the same time and on the same system. It is obvious
    that measures must be taken to have the CPU manage all these processes, that functionality
    has to be provided so users can switch between processes. In some cases, processes
    will have to continue to run even when the user who started them logs out. And
    users need to reactivate interrupted processes.


    We will explain the structure of Linux processes in the next sections.


    # ## Process types


    # ### Interactive processes


    Interactive processes are initialized and controlled through a terminal session.
    In other words, there has to be someone connected to the system to start these
    processes; they are not started as part of the system functions. These processes
    can run in the foreground, occupying the terminal that started the program, and
    you can''t start other applications as this process is running in the foreground.
    Alternatively, they can run in the background, so that the terminal in which you
    started the program can'
