    # # Printing files


    # ## Getting the file to the printer


    Printing from within an application is very easy, selecting the Print option from
    the menu.


    From the command line, use the **lp** or **lpr** command.


    ```

    lp file(s)

    lpr file(s)

    ```


    These commands can read from a pipe, so you can print the output of commands using


    ```

    command | lp

    ```


    There are many options available to tune the page layout, the number of copies,
    the printer that you want to print to if you have more than one available, paper
    size, one-sided or double-sided printing if your printer supports this feature,
    margins and so on. Read the man pages for a complete overview.


    # ## Status of your print job


    Once the file is accepted in the print queue, an identification number for the
    print job is assigned:


    ```

    davy-> lp /etc/printqueue

    request id is blob-253 (1 file(s))

    ```


    To view (query) the print queue, use the **lpq** or **lpstat** command. When executed
    without arguments, it displays the contents of the default print.


    ```

    davy-> lpq

    blob is ready and printing

    Rank Owner Job File(s) Total Size

    active davy 253 profile 1024 bytes

    davy-> lpstat

    ```'
