    # File security


    # Access rights: Linux''s first line of defense


    The Linux security model is based on the one used in UNIX systems, and is as rigid
    as the UNIX security model (and sometimes even quite robust). On a Linux system,
    every file is owned by a user and a group user. There is also a third category
    of users, those that are not the user owner and belong to the group owning the
    file. For each category of users, read, write, and execute permissions can be
    granted or denied.


    We already used the long option to list files using the ls -l command, for other
    reasons. This command also displays file permissions for these three user categories;
    they are indicated by the characters that follow the first character, which is
    the file type at the beginning of the file permissions. As seen in the examples
    below, the first three characters in this series of nine access rights for the
    actual user who owns the file. The next three are for the group owner of the file,
    the last three for others users. The permissions are always in the same order:
    read, write, execute for the user, the group and others. Examples include:


    ```

    marise:-> ls -l To_Do

    --rw-r-- 1 marise users 5 Jan 15 12:39 To_Do

    marise:-> ls -l /bin/ls

    -rwxr-xr-x 1 root root 45948 9 15:01 /bin/ls*

