    In this example, the only information not included in an inode, is the file name
    and directory. These are stored in the special directory files. By comparing file
    names and inode numbers, the system can make up a tree-structure for the user
    accounts. Users can display inode numbers using the -i option to ls. The inodes
    have their own separate space on the disk.


    # # Orientation in the file system


    # ## path


    When you want the system to execute a command, you almost never have to give the
    full path to command. For example, we know that the command is in the /bin/directory
    (check with which -a ls), and we don''t have to enter the command /bin/ls for
    the computer to list the content of the current directory.


    ```

    rogier:> echo $PATH

    /opt/local/bin:/usr/bin:/usr/X11R6:/usr/sbin:/bin

    ```


    In this example, the directories /opt/local/bin, /usr/X11R6, /usr/bin, /usr/sbin
    and /bin are searched for the program. As soon as a match is found, the search
    is stopped, even if not every directory in the path has been searched. This can
    lead to strange situations. In the first example the user knows sendsms to send
    an SMS message, and another user on the same system can use it, but cannot. The
    difference is in the configuration of the PATH variable:


    ```

    [jenny@blob login]$$ sendsms

