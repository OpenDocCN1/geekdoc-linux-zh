    across the world.


    It is also worth to note that modern Linux not only runs on workstations, mid
    and high-end servers, but also on "gadgets" from PDAs, mobiles, a shipoad of embedded
    applications and even on experimental wristwatches. This makes Linux the only
    operating system in the world covering a wide range of hardware.


    # The user interface


    # Is Linux difficult?


    Whether Linux is difficult to learn depends on the person you''re asking. Experienced
    UNIX users will say no, because Linux is an ideal operating system for power-users
    and programmers, because it has and is being developed by such people.


    Everything a good program can wish for: compilers, libraries, development and
    debugging tools. These packages come with standard Linux distribution. The C-compiler
    is included for free - as opposed to UNIX distributions demanding licensing fees
    for this tool. All the documentation and manuals are there, where examples are
    included to help you get started in no time. It feels like UNIX switching between
    UNIX and Linux is a natural thing.


    In the early days of Linux, an expert was what required to start using the system.
    Those who mastered Linux felt better than the rest of the "users" who hadn''t
    seen the light. It was common practice to tell a beginner to use "RTFM" (read
    the manuals). While the manuals were on every system, it was'
