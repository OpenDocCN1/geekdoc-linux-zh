    # Summary


    Linux is a multi-user, multi-tasking operating system that has a UNIX-like way
    of handling processes. Execution speed of commands can depend on a thousand tiny
    things. Among others, we learned a lot of new commands to visualize and handle
    processes. Here''s a list:


