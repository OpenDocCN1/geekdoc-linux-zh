  md: 'The documentation for man will be displayed on your screen after you press
    Enter:


    man (1)


    man (1)


    # NAME


    man - format and display the on-line manual pages

    manpath - determine user''s search path for man pages


    # SYNOPSIS


    ```

    man [-acdfFhkkTW] [--path] [-m system] [-p string] [-C config_file]

    [-M path] [-P page] [-S section_list] [section] name ...

    ```


    # DESCRIPTION


    man formats and displays the on-line manual pages. If you specify

    section, man only looks in section of the manual page, which

    is normally the name of the manual page, which is typically the

    name of a command, function, or file. However, if man contains a

    slash/) then man interprets it as a file specification, so that you

    do do man /foo.5 or man /cd/foo/bar.1.


    See below for a description of where man looks for the manual

    page files.


    # OPTIONS


    ```

    -C config_file

    lines 1-27

    ```


    Browse to the next page using the space bar. You can go back to the previous page
    using the b-key. When

    y reach the end, man will usually quit and get you the prompt. Type q if you want
    to leave the

    man page before reaching the end, or if the viewer does not quit automatically
    at the end of the page.


    # Pagers


    The available key combinations for manipulating man depends on the pager used
    in

    our distribution. Most distributions use less to view the pages and scroll around.
    See the

    sec called“less is more” for more info on pagers.


    Each man page contains a couple of section details, as we can see from the man
    page example:


    +   - The first line contains the name of the command you are reading about, and
    the id of section

    in which this man page is located. The pages are ordered in chapters. Commands
    are likely to have

    multiple pages, for example the man page from the user section, the man page from
    the system

    admin section, and the man page from the programmer section


    +   - The synopsis of the command provides a technical notation of all the options
    and/or arguments this

    command can take. You can think of an option as way of executing the command.
    The argument

    is what you execute it. Some commands have no options or arguments. Optional options
    and

    arguments are put between “[ and ”]” to indicate that they can be left out.'
