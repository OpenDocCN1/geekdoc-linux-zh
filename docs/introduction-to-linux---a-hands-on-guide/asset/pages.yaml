  md: '# Pronunciation


    It''s pronounced "vee-eye".


    # Basic commands


    # Moving through the text


    Moving through the text is usually possible with the arrow keys. If not, try:


    +   * h to move the cursor to the left

    * l to move it to the right

    * k to move up

    * j to move down


    SHIFT-G will put the prompt at the end of the document.


    # Basic operations


    These are popular vi commands:


    +   * dd will delete n lines starting from the current cursor position.

    * nw will delete n words at the right side of the cursor.

    * x will delete the character on which the cursor is positioned

    * :in moves to line n of the file.

    * :w will save (write) the file

    * :q will exit the editor.

    * :q! forces the exit when you want to quit a file containing unsaved changes.

    * :wq will save and exit

    * wnewfile will save the text to newfile.

    * :wq overrides read-only permission (if you have the permission to override permissions,
    for instance you are using the root account.

    * /astring will search the string in the file and position the cursor on the first
    match below its position.

    * / will perform the same search again, moving the cursor to the next match.

    * :1,$s/anotherword/anotherword/g will replace word with anotherword throughout
    the file.

    * yy will copy a block of text.

    * np will paste it n times.'
