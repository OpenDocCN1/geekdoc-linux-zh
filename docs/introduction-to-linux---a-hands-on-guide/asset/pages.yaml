  md: '# About files and the file system


    working, whatever happens. On Linux, you will virtually never see irritating messages
    like Out of memory, please close some applications first and try again, because
    of this extra memory. The swap or virtual memory procedure has been widely adopted
    by operating systems outside the UNIX world by.


    Using memory on a hard disk is naturally slower than using the real memory chips
    of a computer, but having this extra is a great comfort. We will learn more about
    swap when we discuss processes in Chapter 4, Processes.


    Linux generally counts on twice the amount of physical memory in the free of swap
    on the hard disk. When installing a system, you have to know how you are going
    to do this. Example on a system with 512 MB of RAM:


    +   - 1st possibility: one partition of 1 GB

    - 2nd possibility: two swap partitions of 512 MB

    - 3rd possibility: with two hard disks: 1 partition of 512 MB on each disk.


    The last option will give the best results when a lot of I/O is expected.


    Read the software documentation for specific guidelines. Some applications, such
    as databases, require more swap space. Others, such as handheld systems, might
    not have any swap at all by lack of hard disk. Swap space may also depend on your
    kernel version.


    The kernel is on a separate partition in many distributions, because it is the
    most important file of your system. If this is the case, you will find that you
    also have a boot partition, holding your kernel(s) and accompanying data files.


    The rest of the hard disk(s) is generally divided into data partitions, although
    it might be that all of the system critical data resides on one partition, for
    example you perform a standard workstation installation. When non-critical data
    is separated on different partitions, it usually follows a pattern such:


    +   - a partition for users (/usr)

    - a partition containing the users'' personal data (/home)

    - a partition to store temporary data like print- and mail-queues (/var)

    - a partition for third party and extra swap (/opt)


    Once the partitions are made, you can only add more. Changing sizes or properties
    of existing partitions is possible but not advisable.


    The division of hard disks into partitions is determined by the system administrator.
    On larger systems, he or may extend one partition over several hard disks, using
    the appropriate software. Most distributions allow for standard setups optimized
    for workstations (average users) and for general server purposes, but also customized
    partitions. During the installation process you can define your partition layout
    using your distribution specific tool, which is usually a straightforward graphical
    interface, or fdisk, a text-based tool for creating partitions and setting their
    properties.


    A workstation or client installation is for used mainly one and the same person.
    The selected software for installation reflects this and is common on user packages,
    such as desktop themes, development tools, client programs for E-mail, multimedia
    software, web and other services. Everything is put together on one large partition,
    swap space twice the amount of RAM is added and your generic workstation is complete,
    providing the largest amount of disk space for personal use, but with the disadvantage
    of data integrity loss during problem situations.


