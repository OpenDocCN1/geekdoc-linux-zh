  md: '# Have I been hacked?


    +   - Know your system. After a while, you can almost feel when something is happening.


    How can you tell? This is a checklist of suspicious events:


    +   - Mysterious open ports, strange processes.

    - System utilities (common commands) behaving strange.

    - Login problems.

    - Damaged or missing log files, syslog daemon behaving strange.

    - Interfaces in unusual modes.

    - Unexpectedly modified configuration files.

    - Strange entries in shell history files.

    - Unidentified temporary files.


    # Recovery from intrusion


    In short, stay calm. Take the following actions in this order:


    +   - Disconnect the machine from the network.

    - Try to find out as much as can about how your security was breached.

    - Backup important non-system data. If possible, check these data against existing
    backups, made before the system was compromised, to ensure data integrity.

    - Re-install the system.

    - Use new passwords.

    - Restore from system and data backups.

    - Apply all available updates.

    - Re-examine the system: block unnecessary services, check firewall rules and
    other access policies.

    - Reconnect.


    # Summary


    Linux and networking go hand in hand. The Linux kernel has support for all common
    and most uncommon network protocols. The standard UNIX networking tools are provided
    in each distribution. Next to those, most distributions offer tools for easy network
    installation and management.


    Linux is well known as stable platform for running various Internet services,
    the amount of Internet software is endless. Unlike UNIX, Linux can be just as
    well and administered from a remote location, using one of several solutions for
    remote execution of programs.'
