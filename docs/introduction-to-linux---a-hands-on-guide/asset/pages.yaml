  md: '# # Chapter 9. Fundamental Backup Techniques


    Accidents will happen sooner or later. In this chapter, we''ll discuss how to
    get data to a safe place using other hosts, floppy disks, CD-ROMs and tapes. We
    will also discuss the most popular compressing and archiving commands.


    Upon completion of this chapter, you will know how to:


    +   - Make, query and unpack file archives

    - Handle floppy disks and make a boot disk for your system

    - Write CD-ROMs

    - Make incremental backups

    - Create Java archives

    - Find documentation to use other backup devices and programs

    - Encrypt your data


    # # Introduction


    Although Linux is one of the safest operating systems in existence, and even if
    it is designed to keep on going, data can get lost. Data loss is most often the
    consequence of user errors, but occasionally a system fault, such as a power or
    disk failure, is the cause, so it''s always a good idea to keep an extra copy
    of sensitive/or important data.


    # # Preparing your data


    # # Archiving with tar


    In most cases, we will first collect the data to back up in a single archive file,
    which we will compress later on. The process of archiving involves concatenating
    listed files and that unnecessary blocks. In Linux, this is commonly done with
    the `tar` command. `tar` was originally designed to archive data on tapes, but
    it can also make archives, known as tarballs.


    tar has many options, the most important ones listed below:


    +   - -v: verbose

    - -t: test, show content of a tarball

    - -x: extract archive

    - -c: create archive

    - -f archivedevice: use archiveddevice as source/destination for the tarball,
    the device defaults to the first tape device (usually /dev/st0 or something similar)

    - -j: filter through bzip2, see the section called "Incremental backups with tar"


    It is common to leave the dash-prefix with tar options, as you can see from the
    examples below.'
  merge: -1
