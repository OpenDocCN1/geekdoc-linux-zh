  md: '# The X server


    This procedure assumes that you have a running X server on the client where you
    want to display the application from the remote host. The client may be of different
    architecture and operating system than the remote host, as long as it can run
    an X server, such as Cygwin (which implements an X.org server for Windows clients
    and others) or Exceed, it should be possible to set up remote connection with
    any Linux or UNIX machine.


    # Secure authentication


    The ssh client/server system automatically maintains and checks a database containing
    identifications for all hosts it has ever used. Host keys are stored in ~/.ssh/known_hosts
    in the user''s home directory. Additionally, the file /etc/ssh/known_hosts is
    automatically checked for known hosts. New hosts are automatically added to the
    user''s file. If a host''s identification changes, ssh warns about this and disables
    password authentication to prevent a Trojan horse from getting the user password.
    Another purpose of this mechanism is to prevent man-in-the-middle attacks which
    could otherwise be used to circumvent the encryption. In environments where high
    security is needed, sshd can be configured to prevent logins whose host keys have
    changed or are unknown.


    # Secure remote copying


    The SSH suite scp as a secure alternative to the rcp command used to be popular
    when only rcp exists. scp uses ssh for data transfer, uses the same authentication
    and provides the same security as ssh. Like rcp it will ask for passwords or passphrases
    if they are needed for authentication:


    ```

    lenny /var/tmp scp Schedule.sdc.gz blob:/var/tmp/

    lenny@blob''s password:

    Schedule.sdc.gz 100% |************************************| 100 KB 00:00

    ```


    ```

    lenny /var/tmp

    ```


    Any file may contain a host and user specification to indicate that the file is
    to be copied/from that host. Copies between two remote hosts are permitted. See
    the Info pages for more information.


    If you would rather an FTP-like interface, use sftp:


    ```

    lenny /var/tmp sftp blob

    Connecting to blob...

    lenny@blob''s password:

    ```


    ```

    sftp cd /var/tmp


    sftp get Sch*

    Fetching /var/tmp/Schedule.sdc.gz to Schedule.sdc.gz


    sftp bye

    ```


    ```

    lenny /var/tmp>

    ```


    # Secure copy or FTP GUIs


    Don''t feel comfortable with the command line yet? Try Konqueror''s capabilities
    for secure remote

    copy, or use Putty.'
