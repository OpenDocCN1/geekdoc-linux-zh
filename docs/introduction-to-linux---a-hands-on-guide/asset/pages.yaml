    # LDAP


    The Lightweight Directory Access Protocol is a client-server system for accessing
    global or local directory services over a network. One, OpenLDAP implementation
    is used. It also includes slap, a stand-alone server; slurpd, a stand-alone LDAP
    replication server; libraries implementing the LDAP protocol and a series of utilities,
    tools sample clients.


    The main benefit of using LDAP is the consolidation of types of information within
    your organization. For example, all of the different users within your organization
    can be merged into one LDAP directory. This can be queried by any LDAP-enabled
    applications that need that information. It can also be accessed by users who
    need directory information.


    Other LDAP or X.500 Lite include its ease of implementation (compared to X.500)
    and its well-defined Application Programming Interface (API), which means that
    the number of LDAP-enabled applications and LDAP gateways would increase in the
    future.


    On the negative side, if you use LDAP you will need LDAP-enabled applications
    or the ability to use LDAP gateways. While LDAP usage should only increase, currently
    there are not many LDAP-enabled applications available for Linux. Also, LDAP does
    support some access control, it does not possess as many security features as
    X.500.


    Since LDAP is an open and configurable protocol, it can be used to store almost
    any type of information relating to a particular organizational structure. Common
    examples are mail address lookups, authentication in PAM, telephone directories
    and configuration databases.


    See your specific information and the man pages for related commands such as pammodify
    and ldsearch for details. More information can be found in the LDAP HOWTO [http://www.ldap.org/HOWTO/LDAP-HOWTO.html],
    which discusses installation, configuration, running and maintenance of an LDAP
    server on Linux. The author of this Introduction to Linux also wrote an LDAP Operations
    HOWTO [http://tille.garels.be/training/ldap/], describing the basics everyone
    should know when dealing with LDAP management, operations and integration of services.


