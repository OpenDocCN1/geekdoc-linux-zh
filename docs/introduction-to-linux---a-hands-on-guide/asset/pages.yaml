    Sometimes the content of a file doesn''t interest you, but you need the file name
    as a marker (for instance,

    just you need the timestamp of a file, a reminder that the file was there or would
    be some time in the

    future). Redirecting the output of a null command is how this is done in the Bourne
    and Bash shells:


    ```

    andy-> cat wishlist > placeholder

    andy-> ls -la placeholder

    -rw-r-- 1 andy andy 200 Jun 12 13:34 placeholder

    andy-> > placeholder

    andy-> ls -la placeholder

    -rw-r-- 1 andy andy 0 Jun 12 13:35 placeholder

    ```


    The process of reducing an existing file to a file with the same name that is
    0 bytes large is called truncating.


    For creating new empty file, the same effect is obtained with the touch command.
    On an existing file,

    touch will only update the timestamp. See the Info pages on touch for more details.


    To "almost" empty a file, the tail command. Suppose user and''s wishlist becomes
    rather long because

    he always stays at the end but never deletes the things he gets now. Now he only
    wants to keep

    the last five items:


    ```

    andy-> tail -5 wishlist > newlist

    andy-> cat wishlist > newlist

    andy-> rm newlist

    ```


    # More about log files


    Some Linux programs insist on writing all sorts of output in a log file. Usually
    there are options to only log

    errors, or to log a minimal amount of information, for example setting the debugging
    level of the program.

    But even then, you might not care about the log file. There are some ways to get
    rid of them or at least

    set limits to their size:


    +   - Removing the log file when the program is not running, you are sure that
    you won''t need it again. Some programs may run even, when restarted, there is
    no log file and will not log.

    - If you remove the log file and the program recreates it, read the documentation
    for this particular program in search for command options that avoid making log
    files.

    - Try making smaller log files by logging only the information that is relevant
    to you, or by logging only significant information.

    - Try replacing the log file with a symbolic link to /dev/null; if you''re lucky
    the program won''t complain. Don''t do this with the log files of programs that
    run at system boot or programs that run from'
