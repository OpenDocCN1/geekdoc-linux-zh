  md: '# Fundamental Backup Techniques


    Operation starts.


    Depending on your CD-writer, you now have the time to smoke~H*H*H*H*H eat a healthy
    piece of fruit and/or get a cup of coffee. Upon finishing the job, you will get
    a confirmation message:


    Track 01: Total bytes read/written: 341540864/341540864 (166768 sectors )


    There are graphical tools available to make it easier on you. One of the popular
    ones is xdroast, which is freely available from the X-CD-Roast web site [http://www.xdfrost.org/]
    and is included on most systems and in the GNU directory. Both the KDE and Gnome
    desktop managers have facilities to make your own CDs.


    # Backups on/from jazz drives, USB devices and other removables


    These devices are usually mounted into the file system. After the mount procedure,
    they are accessed as normal directories, so you can use the standard commands
    for manipulating files.


    In the example, images are copied from a USB camera to the hard disk:


    ```

    robin:-> mount /mnt/camera

    robin:-> /mnt | grep camera

    /dev/sda1 /mnt/camera type vfat (rw,nosuid,nodev)

    ```


    If the camera is the only USB storage device that you ever connect to your system,
    this is safe. Keep in mind that USB devices are assigned entries in /dev as they
    are connected to the system. Thus, if you connect a USB stick to your system,
    it will be on /dev/sda, and if you connect a camera after that, it will be assigned
    to /dev/sdb - provided that you do not have any SCSI disks, which are also on
    /dev/sdc. On newer systems, kernel 2.6, a hotplug system called HAL (Hardware
    Abstraction Layer) ensures that users don''t have to deal with this burden. If
    you want to check where your device is, type dmesg after inserting it.


    You can copy the files by:


    ```

    robin:-> cp -R /mnt/camera/* images/

    robin:-> ummount /mnt/camera

    ```


    Likewise, a jazz drive may be mounted on /mnt/jazz.


    Appropriate lines should be added in /etc/modules.conf and /etc/fstab to make
    this work. Refer to specific hardware HOWTOs for more information. On a 2.6.x
    kernel or higher, you may also want to check the pages for modprobe and modprobe.conf.


    # Backing up data using a tape device


    This is done using tar (see above). The mt tool is used for controlling the magnetic
    tape device, like /dev/st0. Entire books have been written backup tape, therefore,
    refer to your reading-list in Appendix B, DOS Linux commands for more information.
    Keep in mind that databases might need other backup procedures because of their
    architecture.'
