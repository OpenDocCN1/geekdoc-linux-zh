- img_proc: true
  md: 'Many other distributions support RPM packages, among the popular RedHat Enterprise
    Linux, Mandriva (former Mandrake), Fedora Core and SuSE Linux. After the advice
    for your distribution, you will want to read man rpm.


    # RPM examples


    Many packages are simply installed with the upgrade option -U, whether the package
    is already installed or not. The RPM package contains a complete version of the
    program, which overwrites existing versions or installs as a new package. The
    typical usage is follows:


    ```

    rpm -Uvh /path/to/rpm-package (s)

    ```


    The -v option generates more verbose output, and -h makes rpm print a progress
    bar:


    ```

    [root@jupiter tmp]# rpm -Uvh totem-0.99.5-1.fr.i386.rpm

    ########################################### [100%]

    Preparing...

    1:totem

    ########################################################### [100%]

    [root@jupiter tmp]#

    ```


    New packages, however, are installed with the install option -i, which does not
    overwrite existing version(s) of the package. That way, you will still be able
    to boot your system with the old kernel if the new one does not.


    You can also use rpm to check whether a package is installed on your system:


    ```

    [david@jupiter]# rpm -qa | grep vim

    vim-minimal-6.1-29

    vim-X11-6.1-29

    vim-enhanced-6.1-29

    vim-common-6.1-29

    ```


    Or you can find which package contains a certain file or executable:


    ```

    [david@jupiter]# rpm -qf /etc/profile

    setup-2.5.25-1

    [david@jupiter]# which cat

    cat is /bin/cat

    [david@jupiter]# rpm -qf /bin/cat

    coreutils-4.5.3-19

    ```


    Note that you may not have access to administrative privileges in order to use
    rpm to query the RPM database. You is normal to be root when adding, modifying
    or deleting packages.


    Below is one example, demonstrating how to uninstall a package using rpm:


    ```

    [root@jupiter]# rpm -e totem

    [root@jupiter]#

    ```


    Note that uninstalling is not verbose, by default is normal that you don''t see
    much happening. When in doubt, use rpm -qa to verify that the package has been
    removed.'
