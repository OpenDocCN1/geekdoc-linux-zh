    common options to the common commands, but you will still need the documentation
    as a primary source of information. Note that the information contained in the
    HOWTOs, FAQs, man and other sources is slowly being merged into the Info pages,
    which are today the most-to-date source of online (in readily available on the
    system).


    # Copying files


    Copying files is done with the cp command. A useful option is recursive copy (copy
    all underlying files and subdirectories), with the -R option to cp. The general
    syntax is


    ```

    cp [-R] fromfile to

    ```


    As an example of the user newguy, who wants the Gnome desktop settings use oldguy.
    Has one way to solve the problem is to copy the settings of oldguy to the home
    of newguy:


    ```

    victor:-> cp -R ../oldguy/.gnome/

    ```


    This gives some errors involving permissions, but all the errors are do with private
    files that newguy doesn''t need anyway. We will discuss in the next part how to
    change these permissions in case they are really a problem.


    # Removing files


    Use the rm command to remove single files, rmdir to remove empty directories.
    (Use -a to check whether a directory is empty or not). The rm command also has
    options for removing non-empty-directories with all its subdirectories, read the
    Info pages for these dangerous options.


    # How empty can a directory be?


    It is normal that the directories (dot) and .. (dot-dot) cannot be removed, since
    they are also necessary in an UNIX to determine the directories ranking in the
    file hierarchy.


    On Linux, there is no garbage can - at least not for the shell, although there
    are plenty of solutions for general use. So once removed, a file is really gone,
    and there is generally no way to get it back unless you have backups, or you really
    have a good system administrator. To protect the beginning user from this malice,
    the interactive behavior of the rm and cp commands can be activated using the
    -i option. In that case the system wont immediately act upon request. Instead
    it will ask for confirmation, so it takes an additional click to inflict the damage:


    ```

    mary:-> rm -ri archive/

    ```'
