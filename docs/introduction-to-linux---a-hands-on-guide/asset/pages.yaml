    # Date and time zone


    Setting time information is usually done at installation time. After that, it
    can be kept up to date using NTP (Network Time Protocol) client. Most Linux systems
    run ntpd by default:


    ```

    debbry->> ps -ef | grep ntpd

    tp      24678      1 0 2002 ?     00:00:33 ntpd -U ntp

    ```


    You can run ntdate to set the time, on that you can reach a server using ntdate.
    The ntpd daemon will not be running when you adjust the time ntdate. Use a server
    as argument to the command:


    ```

    root@box:-# ntpdate 10.2.5.200

    26 Oct 14:35:42 ntpdate[20364] adjust time server 10.2.5.200 offset

    -0.008049 sec

    ```


    See your manual and the documentation that comes with the NTP package. Most desktop
    managers include tools to set the system time, providing that you have access
    to the system administrator''s account.


    For setting the time correct, you can utilize or timezone commands. Timezone information
    is usually set during the installation of your machine. Many systems have distribution-specific
    tools to configure it, see your system documentation.


    # Language


    If you''d rather get your messages from the system in Dutch or French, you may
    want to set the LANG and LANGUAGE environment variables, enabling locale support
    for the desired language and eventually the fonts related to character conventions
    in that language.


    With most graphical logins, such as gdm or kdm, you have the possibility to configure
    these language settings before logging in.


    Note that on some systems, the default is to be en_US.UTF-8 these days. This is
    not a problem, because systems where this is the default, will also come with
    all the programs supporting this encoding. Thus, you can edit all the files on
    your system, cut won''t behave and so on.


    Trouble starts when you connect to an older system not supporting this encoding,
    or when you open a UTF-8 encoded file on a system supporting only 1-byte characters.
    The recode utility might come in handy to convert files from one character set
    to another. Read the man for an overview of features and usage. Another solution
    might be temporarily work with another encoding definition, by setting the LANG
    variable:


    ```

    debbry->> acread /var/tmp/51434s.pdf

    Warning: charset "UTF-8" not supported, using "ISO88859-1"

    Aborted

    ```


    ```

    debbry->> set | grep UTF

    LANG=en_US.UTF-8

    ```


