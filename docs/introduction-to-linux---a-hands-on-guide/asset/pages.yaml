  md: 'More information can be found at the following locations:


    +   - man smb.conf describes the format of the main Samba configuration file.


    +   - The Samba Project Documentation [http://www.samba.org/] (or check your local
    samba.org mirror) contains an entry to read installation and testing guide, which
