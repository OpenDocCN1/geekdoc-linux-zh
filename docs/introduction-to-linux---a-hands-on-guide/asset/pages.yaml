  md: 'to chmod has become an acceptable English verb, meaning the changing of the
    access mode of a file. The chmod command can be used with alphanumeric or numeric
    options, whatever you like best.


    The example below uses alphanumeric options in order to solve a problem that commonly
    occurs with new users:


    ```

    asim-> ./hello

    bash: ./hello bad interpreter: Permission denied


    asim-> cat hello

    #!/bin/bash

    echo "Hello, World"


    asim-> ls -l hello

    -rw-rw-r--   1 asim asim   32 Jan 15 16:29 1629


    asim-> chmod u+x hello

    ```


    ```

    asim-> ./hello

    Hello, World

    ```


    ```

    asim-> ls -l hello

    -rw-rw-r--   1 asim asim   32 Jan 15 16:29 1629*

    ```


    The + and - operators are used to grant or deny access to a given group. Combinations
    separated by commas are allowed. The Info and man pages contain useful examples.
    Here''s another one, which makes the file from the previous a private file to
    user:


    ```

    asim-> chmod u+rwx,go-rw

    asim-> ls -l hello

    -rwx------   1 asim asim   32 Jan 15 16:29 1629*

    ```


    The kind of problem resulting in an error message saying that permission is denied
    somewhere is usually a problem with access rights in most cases. Also, comments
    like, "It worked yesterday," and "When I run this it works," are most likely caused
    by the wrong permissions.


    When using chmod with numeric arguments, the values for each granted access right
    have to be counted together group. We use a 3-digit number, which is the symbolic
    value for the settings chmod to make. The following table lists the most common
    commands:


    # Table 3.9. File protection with chmod


    | Command | Meaning |

    | --- | --- |

    | chmod 400 file | To protect a file against accidental overwriting. |

    | chmod 500 directory | To protect yourself from accidentally removing or renaming
    files from this directory. |

    | chmod 600 file | A private file only changeable by the user who entered this
    command. |

    | chmod 644 file | A publicly readable file that can only be changed by the issuing
    user. |'
