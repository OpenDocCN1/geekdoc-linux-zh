    # # Linux in the office


    # # History


    Throughout the last decade of the office has been dominated by MS Office, and
    let''s face it: MS Word, Excel and PowerPoint formats are industry standards that
    you will have to deal with sooner or later.


    This monopoly of Microsoft proved to be a big disadvantage for new users to Linux,
    so a group of developers started the Office project, which was, and still, aimed
    at making MS Office close. Their company, StarDivision, was acquired by Sun Microsystems
    by the end of the 1990s, after the 5.2 release. Since continues but restricted
    to the sources. Nevertheless, development on the original set of sources continues
    in the Open Source community, which had to rename the project to OpenOffice: OpenOffice
    is now available for a variety of platforms, including MS Windows, Linux, MacOS
    and Solaris. This is a screenshot in the section "Ten years of experience at your
    service"


    Almost simultaneously, a couple of quite famous projects took off. Also a very
    common alternative to using MS Office is KOffice, the office suite that used to
    be popular among SuSE users. Like the original, this clone incorporates MS Word
    and Excel compatible program, and with more.


    Smaller projects deal with particular programs of the MS suite, such as Abiword
    and MS Word-view for compatibility with MS Word documents, and Gnumeric for viewing
    and creating Excel spreadsheets.'
