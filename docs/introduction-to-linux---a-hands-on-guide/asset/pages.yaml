  md: '# Glossary


    This section contains an alphabetical overview of commands discussed in this document.


    # A


    +   - a2ps: Format files for printing on a PostScript printer, see the section
    called "Format-ing".


    +   - acroread: PDF viewer, see the section called "Previewing formatted files".


    +   - adduser: Create a new user or update default user information.


    +   - alias: Create a shell alias for a command.


    +   - alsaconf: Configure sound card using the ALSA driver, see the section called
    "Drivers and Architecture".


    +   - alsamixer: Tune ALSA sound device output, see the section called "Volume
    control".


    +   - anacron: Execute commands periodically, does not assume continuously running
    machine.


    +   - apropos: Search the whatis database for strings, see the section called
    "The whatis and apro-pos commands".


    +   - apt-get: APT package handling utility, see the section called "APT".


    +   - arecord: Record a sound sample, see the section called "Recording".


    +   - aspell: Spell checker.


    +   - at, at, atrm: Queue, examine or delete jobs for later execution, see the
    section called "Auto-matic processes" and the section called "The at command".


    +   - antimix: Adjust audio mixer, see the section called "Volume control".


    +   - (g)awk: Pattern scanning and processing language.


    # B


    +   - bash: Bourne Again SHell, see the section called "The shell" and the section
    called "Shell scripts".


    +   - batch: Queue, examine or delete jobs for later execution, see the section
    called "Auto-matic processes".


    +   - bg: Run a job in the background, see the section called "Interactive processes".


    +   - bitmap: Bitmap editor and converter utilities for the X Windows System.


    +   - bzip2: A block-sorting file compressor, see the section called "Compressing
    and unpacking with gzip and bzip2".'
