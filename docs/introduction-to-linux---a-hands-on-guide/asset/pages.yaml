    to them, as long as the supported hardware list grew longer and longer. Thanks
    to these people, Linux is now not only ideal to run on new PCs, but is also the
    system of choice for elite and exotic hardware that would be useless if Linux
    didn''t exist.


    Two years after Linux post, there were 1200 Linux users. The project, with hobbyists,
    grew steadily, all staying within the bounds of the POSIX standard. All the features
    of UNIX were added over the next couple of years, resulting in the operating system
    Linux has become today. Linux is a full UNIX clone, for use on workstations as
