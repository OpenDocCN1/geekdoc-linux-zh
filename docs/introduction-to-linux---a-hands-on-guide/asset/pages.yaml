  md: '# Introduction


    # Why this guide?


    Many people still believe that learning Linux is difficult, or that only experts
    can understand how a Linux system works. Though there is a lot of free documentation
    available, the documentation is widely scattered on the Web, and often confusing,
    since it is usually oriented UNIX or Linux users. Today, thanks to the advancements
    in development, Linux has grown in popularity both at home and at work. The goal
    of this guide is to show people that Linux can be simple and fun, and used for
    all kinds of purposes.


    # Who read this book?


    This guide was created as an overview of the Linux Operating System, geared toward
    new users as an exploration tour and starting guide, with exercises at the end
    of each chapter. For advanced trainees it can be a desktop reference, a collection
    of the base knowledge needed to proceed with system and network administration.
    This book contains many real life examples derived from the author''s experience
    as a Linux system and network administrator, trainer and consultant. We hope these
    examples help you to get a better understanding of the Linux system and that you
    feel encouraged to try things on your own.


    Everybody wants to get a "CLUE", a Command Line User Experience, with Linux (and
    UNIX in general) will find this book useful.


    # New versions and availability


    This document is published in the Guides section of the Linux Documentation Project
    collection at http://www.tld.org/guides.html; you can also download PDF and PostScript
    formatted versions here.


    The most recent edition is available at http://tille.garrels.be/training/tldp/
    [http://title.garrels.be/train-tldp].


    The second edition of this guide is available in print from Fultus.com Books [http://fult.com/]
    as paperback Print On Demand (POD) book. Fultus distributes this document [http://store.fultus.com/product_info?products_id=140]
    through Ingram and Baker & Taylor to many bookstores, including Amazon.com [http://www.amazon.com/exec/obidos/ASIN/1596821124],
    Amazon.co.uk [http://www.amazon.co.uk/exec/obidos/ASIN/1596821124], BarnesAndNoble.com
    [http://search.barnesandnoble.com/booksearch/isbnquery?ISBN=1596821124] and Google''s
    Froogle [http://froogle.google.com/froogle?q=1596821124] global shopping portal
    and Google Book Search [http://books.google.com/books?isbn=1596821124].'
