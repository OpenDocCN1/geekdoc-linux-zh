  md: '# What is Linux?


    Most of all. Linux is free as in speech:


    The license commonly used is the GNU Public License (GPL). The license says that
    anybody who may want to do so, has the right to change Linux and eventually redistribute
    a changed version, or one condition that the code is still available after redistribution.
    In practice, you are free to grab a kernel image, for instance to add support
    for teletransportation machines or time travel and sell your new code, as long
    as your customers can have a copy of that.


    +   * Linux is portable to any hardware


    A vendor who wants to sell a new type of computer and don''t know what OS of his
    machine will run (say the CPU in your car or washing machine), can take a Linux
    kernel and make it work on his hardware, because documentation related to this
    activity is freely available.


    +   * Linux was made to run on:


    As with UNIX, a Linux system permits to run without rebooting the time. That is
    why a lot of tasks are being executed at night or scheduled automatically for
    calm moments, resulting in higher availability during busy periods and a more
    balanced use of the hardware. This property allows Linux to be applicable in all
    environments where people don''t have the time or the possibility to control their
    systems night and day.


    +   * Linux is secure and versatile:


    The security model used in Linux is based on the UNIX idea of security, which
    is known to be robust and of proven quality. But Linux is not only for use as
    a fort against every attack from the Internet; it will easily adapt to other situations,
    utilizing the same high standards for security. Your development machine or control
    station will be as secure as your future.


    +   * Linux is scalable:


    From a Palmtop with 2 MB of memory to a petabyte storage cluster with hundreds
    of nodes: add or remove the appropriate packages and Linux fits. You don''t need
    a supercomputer anymore, because you can use Linux to do big things using the
    building blocks provided with the system. If you want to do little things, such
    as making an operating system for an embedded processor or just recycling your
    old 486, Linux will do that well.


    +   * The Linux OS and most Linux versions have very short debug-times:


    Because Linux has been developed and tested by thousands of people, both errors
    and people to fix them are usually found rather quickly. It sometimes happens
    that there are only a couple of hours between discovery and fixing of a bug.


