    \n+   - standard input: 0\n- standard output: 1\n- standard error: 2\n\nIn the\
    \ following examples, if the redirection number is omitted, and the first character\
    \ of the red-\nirection operator is <, the redirection refers to standard input\
    \ (file descriptor 0). If the first character of the redirection operator is >,\
    \ the redirection refers to the standard output (file descriptor 1).\n\nSome practical\
    \ examples will make this clearer:\n\n```\nls dirlist 2>&&\n\ndwill direct standard\
    \ output and standard error to the file dirlist, while the command\n\ns 2>&1 dirlist\n\
    ```\n\nwill only direct standard output to dirlist. This can be a useful option\
