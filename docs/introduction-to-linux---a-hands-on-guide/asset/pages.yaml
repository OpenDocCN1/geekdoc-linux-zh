    # PCMIA commands


    On your laptop which you usually connect to the company network using the onboard
    Ethernet connection, but which you are not configured for dial-at home or in a
    hotel, you might need to activate the PCMIA card. This is done using the cardctl
    control utility, or the pcardctl on newer distributions.


    A usage example:


    ```

    cardctl insert

    ```


    Now the card can be configured, either using the graphical or the command line
    interface. Prior to taking the card out, use this command:


    ```

    cardctl eject

    ```


    However, a good distribution should provide PCMIA support in the network configuration
    tools, preventing users from executing PCMIA commands manually.


    # More information


    Further discussion of network configuration is out of the scope of your document.
    Your primary source for extra information is the man pages for the services you
    set up. Additional reading:


    +   * The Modem-HOWTO [http://www.ldp.org/HOWTO/Modem-HOWTO.html]: With selecting,
    connecting, troubleshooting, and understanding analog modems for a PC.

    * LDP Index, section 4.4 [http://www.ldp.org/HOWTO/HOWTO-IN-networking.html#NETGENERAL]:
    categorized list of HOWTOs about general networking, protocols, dial-up, DNS,
    VPNs, routing, security and more.

    * Most systems have a use of the ip-cref file (locate it using the locate command);
    the PS format of this file is viewable with instance gy.


    # Network interfaces name


    On a Linux machine, the device name or the local loop is linked with the 127.0.0.1
    address. The computer will have a hard time making your applications work if this
    device is not present; it is always even, on connections which are not normed.


    The first ethernet device, eth0 in the case of a standard network interface card,
    points to your local LAN address. Normal client machines have only one network
    interface card. Routers, connecting networks have one network interface device
    for each network they serve.


    If you use a modem to connect to the Internet, your device will probably be named
    ppp0.


    There are many names, for Virtual Private Networks (VPNs), and multiple interfaces
    can be active simultaneously, so that the output of the ifconfig or ip might become
    quite extensive when options are used. Even multiple interfaces of the same type
    can be active. In case, they are numbered sequentially: the first will get the
    number 0, the second will get a suffix of 1, the third will get 2, and so on.
    This is the case on many application servers, on machines which have a failover
    configuration, on routers, firewalls and many more.


    162'
