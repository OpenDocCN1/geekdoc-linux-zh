  md: 'In the /var directory we find a set of directories for storing specific non-constant
    data (as opposed to the /etc or system configuration files, which change relatively
    infrequently or never at all). Files that change frequently, such as log files,
    mailboxes, lock files, spoolers etc. are kept in a subdirectory of /var.


    As a security measure these files are usually kept in separate parts from the
    main system, so we can keep a close eye on them and set permissions where necessary.
    A lot of these files also need more permissions than usual, like /var/tmp, which
    needs to be writable for everyone. A lot of user activity might be expected here,
    even when generated by anonymous Users connected to your system. This is one reason
    the /var directory, including all its subdirectories, is usually on a separate
    partition. Then there is no risk that a mail bomb, for instance, will fill up
    the rest of the system, containing more important data such as your programs and
    configuration files.


    # /var/tmp and /tmp


    Files in /tmp can be deleted without notice, by regular system tasks or because
    of a system reboot. On some (customized) systems, also /var/tmp might behave unpredictably.
    Nevertheless, since this is not the case by default, we advise you to use the
    /var/tmp directory for saving temporary files. In doubt, check with your system
    administrator. If you manage your system, you can reasonably sure that this is
    a safe place if you didn''t consciously change settings on /var/tmp (as root user,
    no user can delete them).


    Whatever you do, try to restrict the privileges to a normal user - don''t go saving
    files directly under the root (/) of the system, don''t put them in /user or some
    subdirectory or another reserved space. This might limit your access to safe file
    systems.


    One of the main security systems is on a UNIX system, which is naturally implemented
    on every Linux machine, is the logging facility, which logs all user actions,
    processes, system events etc. The configuration file of the so-called syslogdaemon
    determines which and how long logged information will be kept. The default location
    of all logs is /var/log, containing different files for access log, server logs,
    system messages


    In /var we typically find data, which is kept here to protect it from critical
    data such as the server program and its configuration files. A typical example
    is /var/www, which contains the actual HTML files, pages and images that a web
    server serves. The FTP-tree of FTP server (that can be downloaded by a remote
    client) is also kept in /var/subdirectories. Because this data is publicly accessible
    and easily changeable by anonymous users, it is safe to keep it here, away from
    partitions or directories with sensitive data.


    On most installations, /var/spool will contain at least one and a cron directory,
    containing scheduled tasks. In office environments this directory usually contains
    lpd as well, which holds the print queue () and further printer configuration
    files, as well the printer log


    On servers we find /var/mail, containing incoming mails for local users, sorted
    in one file per user, the user''s "inbox". A related directory is mqueue, the
    spool area for unsent messages. These parts of the system can be very busy on
    mail servers with a lot of users. Servers also use the /var/spool area because
    of the enormous amounts of messages they have to process.


    The /var/lib/rpm directory is specific to RPM-based (RedHat Package Manager) distributions;
    it is where RPM package information is stored. Other Other package managers generally
    also store their data where in /var.'
