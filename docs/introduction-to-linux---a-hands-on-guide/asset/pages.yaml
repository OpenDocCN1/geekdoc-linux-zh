- img_proc: true
  md: '# /etc/hosts


    The /etc/hosts file always contains the localhost IP address, 127.0.0.1, which
    is used for interprocess communication. Never remove this line! Sometimes contains
    addresses of additional hosts, which can be contacted without using an external
    naming service as DNS (the Domain Name Server).


    A sample hosts file for a small home network:


    ```

    # Do not remove the following line, or various programs

    # that require network functionality will fail.

    127.0.0.1 localhost.localdomain localhost

    192.168.52.10 tux.mylan.com tux

    192.168.52.11 winxp.mylan.com winxp

    ```


    Read in man hosts.


    # /etc/resolv.conf


    The /etc/resolv.conf file configures access to a DNS server, see the section called
    “The Domain System”. This file contains your domain name and the server(s) to
    contact:


    ```

    mylan.com

    nameserver 193.134.20.4

    ```


    Read more in the resolv.conf man page.


    # /etc/nsswitch.conf


    The /etc/nsswitch.conf file defines the order in which to contact different name
    services. For Internet use, it is important that dns shows up in the “hosts” line:


    ```

    [bob@tux ~] grep /etc/nsswitch.conf

    hosts: dns

    ```


    This instructs your computer to look up hosts and IP addresses first in the /etc/hosts
    file, and to contact the DNS server if a given host does not occur in the local
    hosts file. Other possible name services to contact are LDAP, NIS and NIS.


    More in man nsswitch.conf.


    # Network configuration commands


    # The ip command


    The distribution-specific scripts and graphical tools are front-ends to ip (or
    ifconfig and route on older systems) to display and configure the kernel''s networking
    configuration.


    The ip command is used for assigning IP addresses to interfaces, for setting routes
    to the Internet and to other networks, for displaying TCP/IP configurations etcetera.


    The following commands show IP address and routing information:


    ```

    benny@home benny> ip addr show

    ```'
