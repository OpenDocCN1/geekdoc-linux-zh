  md: 'GNOME or kdm if you run KDE, but they can be mixed, and there''s also the xdm
    that comes with a standard X installation.


    There are other possibilities as well. On Debian, for instance, there is an iniscript
    for the display-managers, and the content of the /etc/X11/default-display-manager
    is used to determine which one to start. More about the graphical interface can
    be read in the section "The graphical environment". Ultimately, your system documentation
    will provide details about the higher level aspects of init.


    The /etc/default and /etc/sysconfig directories contain entries for a range of
    functions and services, which are all read at boot. The location of the directory
    containing defaults might be somewhat different depending on your Linux distribution.


    Besides the graphical environment, a lot of other services may be started as well.
    But if all goes well, you should be looking at a login prompt or login screen
    when the boot process finished.


    # Other procedures


    We explain how SysV init works on x86 machines. Startup procedures may vary on
    other architectures. Other systems use the BSD-style init, where startup processes
    are split into multiple /etc/rc<LEVEL>.d directories. It is also possible that
    your system uses /etc/rc/init.d instead of /etc/init.d.


    # Init run levels


    The idea behind operating services at different run levels essentially revolves
    around the fact that different systems can be used in different ways. Some services
    cannot be used unless the system is in a particular state, or mode, such as being
    ready for more than one user or having availability.


    There are times in which you may want to operate the system in a lower mode. Examples
    are disk corruption problems in run level 1 so no other users can be on the system,
    or leaving a server in run level 3 without an X session running. In these cases,
    running services that depend upon a higher system mode to function does not make
    sense because they will not work correctly anyway. By already having each service
    assigned to when its particular run level is reached, you ensure an orderly start
    up, and you can quickly change the mode of without without worrying about which
    services


    Available run levels are generally described in /etc/initittab, which is partially
    shown:


    ```

    #

    # inittab

    # This file describes how the INIT process should set up

    # the system in a certain run-level.

    #

    # Default run level. The run levels are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiseruser, without NFS

    # (The same as 3, if you do not have networking)

    # 3 - Full multiserver mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:5:initdefault:

    ```'
  merge: -1
