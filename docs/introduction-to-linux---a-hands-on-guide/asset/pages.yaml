  md: '# Table 2.1. Quickstart commands


    | Command | Meaning |

    | --- | --- |

    | ls | Displays a list of files in the current working directory, like the dir
    command in DOS |

    | cd directory | change directories |

    | passwd | change the password for the current user |

    | file filename | display file of type with name filename |

    | cat textfile | throws content of textfile on the screen |

    | pwd | display present working directory |

    | exit or logout | leave this session |

    | man command | read man pages on command |

    | info command | read Info pages on command |

    | apropos string | search the database for strings |


    # General remarks


    You type these commands at the prompt, in a terminal window in graphical mode
    or in text mode, followed by **Enter**.


    Commands can be issued by themselves, as **ls**. A command behaves different when
    you specify an option, usually preceded by a dash (-), as in **ls -a**. The same
    option character may have a different meaning for another command. GNU programs
    take long options, preceded by two dashes (--), like **ls --all**. Some commands
    have no options.


    The argument(s) to a command are specifications for the object(s) on which you
    want the command to take effect. An example is **ls /etc** where the directory
    /etc is the argument to the command. This indicates that you want to see the content
    of that directory, instead of the default, the content of the current directory,
    obtained by just typing **ls** followed by **Enter**. Some commands require arguments,
    some arguments are optional.


    You can find out whether a command takes arguments, and which ones are valid,
    by checking the online help for that command, see the section called "Getting
    help".


    In Linux, like UNIX, directories are separated using forward slashes, the ones
    used in web addresses (URLs). We will discuss directory structure in-depth later.


    The symbols and , have special meaning when directories are concerned. We will
    try to find out about these during the exercises, and in the next chapter.


    Try to avoid logging in or using the system administrator''s account, **root**.
    Besides your normal work, tasks, including checking the system, collecting information,
    etc., can be executed using a normal user account with no special permissions
    all. If needed, for instance when creating a new user or installing new software,
    the preferred way of obtaining root access is by switching user IDs, see the section
    "The path" for an example.


    Almost all commands in this book can be executed without system administrator
    privileges. In most cases, when issuing a command or starting a program as a non-privileged
    user, the system will warn you or prompt for the root password when root access
    is required. Once you''re done, leave the application or session that you you
    privileges immediately.'
