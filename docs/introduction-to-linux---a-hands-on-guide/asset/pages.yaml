    # Restrictions


    On most systems, the use of the chown and chgrp commands is restricted for non-privileged
    users. If you are not the administrator of the system, you cannot change user
    group permissions for security reasons. If the usage of these commands would not
    be restricted, malicious users could assign ownership of files to other users/groups
    and change behavior of users'' environments and cause damage to other users''
    files.


    # Special modes


    For the system admin to not be bothered solving permission problems all the time,
    special access rights can be to enter directories, or to separate programs. There
    are three special modes:


    +   - Sticky bit: After execution of a job, the command is kept in the system
    memory. Originally this was used a lot to save memory: big files are loaded into
    memory only once. But these days memory is inexpensive and there are better techniques
    to manage it, so it is not used anymore for its optimizing capabilities in single
    files. When applied to an entire directory, the sticky bit has a different meaning.
    In that case, a user can only change files in this directory when she is the user
    owner of the file or when the file has appropriate permissions. This permission
    is used on directories like /var/tmp, that have to be accessible for everyone,
    but it is not appropriate for users to change or delete each other''s data. The
    sticky bit is indicated by an i at the end of the file permission field:


    ```

    mark:> ls -ld /var/tmp

    drwxrwt 19 root 8192 Jan 16 10:37 /var/tmp/

    ```


    The sticky bit is set using command chmod +t. The historic origin of the "t" is
    in UNIX'' save access feature.


    +   - UID (set user ID) and SGID (set group ID): represented by the character
    s in the user or group permission field. When this mode is set on an executable
    file, it will run with the user and group permissions on the file instead of those
    of the user executing it. We will discuss this in Chapter 4, Processes.


    +   - SGID (set group ID) on a directory: in this special case every file created
    in the directory will have the same group owner as the directory (while normal
    behavior would be that new files are owned by the users who create them). This
    user, users don''t need to worry about file ownership sharing directories.'
