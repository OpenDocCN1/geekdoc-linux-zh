  md: '# Shell Features


    | Command | Meaning |

    | --- | --- |

    | exec | Execute a new shell |

    | fg | Foreground execution |

    | jobs | Show active jobs |

    | kill | Terminate running jobs |

    | newgrp | Change to a new group |

    | shift | Shift positional parameters |

    | stop | Suspend a background job |

    | suspend | Suspend a foreground job |

    | time | Time a command |

    | umask | Set or list file permissions |

    | unset | Erase variable or function definitions |

    | wait | Wait for a background job to finish |


    # Differing features


    The table shows major differences between the standard shell (sh), Bourne Again
    SHell (bash), Korn shell (ksh) and the C shell (csh).


    # Shell compatibility


    Since the Bourne Again SHell is a superset of sh, all sh commands will also work
    in bash - not vice versa. bash has many features of its own, and as the table
    demonstrates, many features incorporated from other shells.


    Since the Turbo C shell is a superset of csh, all csh commands will work in tsh,
    but not the other way round.


    # Table C.2. Differing Shell Features


    | | bash | ksh | csh | Meaning/Action |

    | --- | --- | --- | --- | --- |

    | $ | | $ | % | Default user prompt |

    | | > | | | ! | Force redirection |

    | > file 2>&1 | &file or > | > file 2&1 | &file | Redirect stdout and stderr to
    file |

    | | file 2&1 | | | | Expand elements in list |

    | `command` | `command` or $(command) | $(command) | `command` | Substitute output
    of enclosed command |

    | $HOME | $HOME | $HOME | $home | Home directory |

    | | ~ | | | Home directory symbol |

    | | ~+, ~, dirs | ~+, ~, | =-, =N | Access directory stack |'
