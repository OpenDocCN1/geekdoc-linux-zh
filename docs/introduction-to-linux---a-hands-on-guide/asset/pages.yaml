    # # Logging on another group


    When you type the command line, you get a list of all the groups that you possibly
    belong to, preceded by your user name and ID and the group name and ID that you
    are currently connected. However, on many Linux systems you can only be actively
    logged in to one group at a time. By default, this active or *primary* group is
    the one that you get from the `/etc/passwd` file. The fourth field of this field
    holds users'' primary group ID, which is looked up in the `/etc/group file. For
    example:


    ```

    asim-> id

    uid=501(asim) gid=501(asim) groups=100(users), 501 (asim), 3400 (web)

    ```


    ```

    asim-> grep asim /etc/passwd

    asim:501:501:El Baraka:/home/asim:/bin/bash

    ```


    ```

    asim-> grep 501 /etc/group

    asim:501:

    ```


    The fourth field in the line from `/etc/passwd` contains the value “501”, which
    represents the group *asim* in the above example. From `/etc/group` we get the
    name matching with group ID. When initially connecting to the system, this is
    the group that *asim* will belong to.


    # ## User private group scheme


    In order to allow more flexibility, Linux systems follow the so-called *user private
    group scheme*, which assigns each user primarily to his or her own group. This
    is a group that contains this particular user, the name “private group”. Usually
    this group has the same name as the user login name, which can be bit confusing.


    Apart from his own private group, asim can also be in the groups *users* and *web*.
    Because these are secondary groups to this user, he will need to use the **newgrp**
    to log into any of these groups (use **gpasswd** for setting the group password
    first). In the example, asim needs to create files that are owned by the group
    web.


    ```

    asim:/var/www/html> newgrp web

    asim:/var/www/html> id

    ```'
