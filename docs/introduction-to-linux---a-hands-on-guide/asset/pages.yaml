    is completely interlinked, so you can click through the “SEE ALSO” sections and
    wherever links to other man pages appear, and thus browse and acquire knowledge
    without interruption for hours at the time.


    # # Exceptions


    Some commands do not separate documentation, because they are part of another
    command. cd, exit, login and pwd are such exceptions. They are part of your shell
    program and are called shell built-in commands. For information about these, refer
    to the man page of your shell. Most beginning Linux users have a Bash shell. See
    the section “The shell” for more about shells.


    If you have changed your original system configuration, it might also be possible
    that man pages are still there, but not visible because your environment has changed.
    In that case, you will need to check the MANPATH variable. How to do this is explained
    in the section “Exporting Variables”,


    Some programs or packages only have a set of instructions or references in the
    directory /usr/share/doc. See the section “Ways to view file content” to display.


    In the worst case, you may have removed the documentation from your system by
    accident (hopefully not, because it is a very bad idea to do this on purpose).
    In that case, first try to make sure that there is really nothing appropriate
    left using a search tool, read on the section “Finding files”. If so, you may
    have to re-install the package that contains the command to which the documentation
    applied, see the section “Installing new software”.


    # # Summary


    Linux traditionally operates in text mode or in graphical mode. Since CPU and
    RAM are not cost anyone every days, Linux user can afford to work in graphical
    mode and will usually do so. This does not mean that you don''t have to know about
    text mode: we will work in the text environment throughout this course, using
    a terminal window.


    Linux encourages its users to acquire knowledge and to become independent. Inevitably,
    you will have to read a lot of documentation to achieve that goal; that is why,
    we will refer to extra documentation for almost every command, tool and problem
    listed in this book. The more you read, the easier it will become and the faster
    you will leaf through manuals. Making reading documentation a habit as soon as
    possible. When you don''t know the answer to a problem, referring to the documentation
    should become a second nature.


