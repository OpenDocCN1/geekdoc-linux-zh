    # Mail


    # Servers


    Sendmail is the standard mail server program or Mail Transport Agent for UNIX
    platforms. It is robust, scalable; and when properly configured with appropriate
    hardware, handles thousands of users without blinking. More information about
    how to configure Sendmail is included with the sendmail and sendmailcf packages,
    you may find to read the README and README.cf files in /usr/share/doc/sendmail.
    The **mainmail** and many **aliases** are useful.


    Qmail is another mail server, gaining popularity because it claims to be more
    secure than Sendmail. While Sendmail is a monolithic program, Qmail consists of
    smaller interacting program parts that can be secured. Postfix is another mail
    server that is gaining popularity.


    These servers handle mailing lists, filtering virus scanning and more. Free and
    commercial scanners are available for use with Linux. Examples of mailing list
    software are Mailman, Listserv, Majordomo and Eznim. See the web page of your
    favorite virus scanner for information on IMAP client and server support. Avit
    and Spassassin are free implementations of a virus scanner and a spam scanner.


    # Remote mail servers


    The most popular protocols to access mail remotely are POP3 and IMAP4. IMAP and
    POP both allow offline operation, remote access to new mail and both rely on an
    SMTP server to send mail.


    While POP is a simple protocol, easy to implement and supported by almost any
    mail client, IMAP is to be preferred:


    +   * It can manipulate message status flags.

    * It can store as well as fetch mail messages.

    * It can access and manage multiple mailboxes.

    * It supports concurrent updates and shared mailboxes.

    * It is also suitable for using Usenet messages and other documents.

    * IMAP works on both on-line and off-line.

    * It is optimized for on-line performance, especially over low-speed links.


