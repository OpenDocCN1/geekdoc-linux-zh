  md: '# # Chapter 5. I/O redirection


    This chapter describes more about the powerful UNIX mechanism of redirecting input,
    output and errors. Topics include:


    +   - Standard input, output and errors

    - Redirection operators

    - How to use output of one command as input for another

    - How to put output of a command in a file for later reference

    - How to append output of multiple commands to a file

    - Input redirection

    - Handling standard error messages

    - Combining redirection of input, output and error streams

    - Output filters


    # # Simple redirections


    # ## What are standard input and standard output?


    Most Linux commands read input, such as a file or another attribute for the command,
    and write output. By default, input is given by the keyboard, and output is displayed
    on your screen. Your keyboard is your standard input (stdin) device, and the screen
    or a particular terminal window is the standard output (stout) device.


    However, since Linux is a flexible system, these default settings don''t necessarily
    have to be applied. The standard output, for example, on a heavily monitored server
    in a large environment may be a printer.


    # ## The redirection operators


    # ### Output redirection with > |


    Sometimes you will want to put output of a command in a file, or you may want
    to issue another command on the output of one command. This is known as redirecting
    output. Redirection is done using either the ">" (greater-than symbol), or using
    "|"(pipe) operator which sends the standard output of one command as another standard
    input.


    As we saw before, the cat command concatenates files and puts them all to the
    standard output. By redirecting this output to a file, this file name will be
    created - or overwritten if it already exists, so take care.


    ```

    nancy-> cat test1

    some words

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'nancy->> cat test2

    some other words


    nancy->> cat test1 test2 > test3


    nancy->> cat test3

    some words

    some other words


    # Don''t overwrite!


    Be careful not to overwrite existing (important) files when redirecting output.
    Many shells, including Bash, have a built-in feature to protect you from that
    risk: noclobber. See the Info pages for more information. In Bash, you would want
    to add the set -o noclobber command to your .bashrc configuration file in order
    to prevent accidental overwriting of files.



    Redirecting "nothing" to an existing file is equal to emptying the file:


    ```

    nancy->> ls -l list

    -rw-rw-r-- 1 nancy nancy 117 Apr 2 18:09 list

    ```


    ```

    nancy->> ls list

    ```


    ```

    nancy->> ls -l list

    -rw-rw-r-- 1 nancy nancy 0 Apr 4 12:01 list

    ```


    This process is called truncating.


    The same redirection to a nonexistent file will create a new empty file with the
    given name:


    ```

    nancy->> ls newlist

    : No such file or directory

    ```


    ```

    nancy->> newlist

    ```


    ```

    nancy->> ls -l newlist

    -rw-rw-r-- 1 nancy nancy 0 Apr 4 12:05 newlist

    ```


    Chapter 7, Home sweet/home gives some examples on the use of this sort of redirection.


    Some examples using piping of commands:


    To find a word within some text, display all lines matching "pattern1", and exclude
    lines also "pattern2" from being displayed:


    ```

    grep pattern1 file | grep -v pattern2

    ```


    To display output of a directory listing one page at a time:


    ```

    ls -la | less

    ```


    To find a file in a directory:'
  merge: -1
  pgno: 110
