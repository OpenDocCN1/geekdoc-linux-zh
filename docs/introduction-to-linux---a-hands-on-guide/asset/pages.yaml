  md: '# Summary


    The GNU/Linux platform is fully multi-media enabled. A wide variety of devices
    like sound cards, tv-cards, headsets, microphones, CD and DVD players is supported.
    The list of applications is sheer endless, that is why we needed to shorten list
    of new commands below and limit ourselves to general audio commands.


    Table 11.1. New commands in chapter 11: Audio


    | Command | Meaning |

    | --- | --- |

    | alsaconf | Configure the ALSA sound system. |

    | alsamixer | Tune output levels of ALSA driver. |

    | arecord | Record a sound sample. |

    | aumix | Audio mixer tool. |

    | cdp | Play an audio CD. |

    | cdparanoia | Rip an audio CD. |

    | cdplay | Play an audio CD. |

    | gnome-alsmixer | Gnome ALSA front-end. |

    | gnome-cd | Gnome front-end for playing audio CDs. |

    | gnome-sound-recorder | Gnome front-end for recording sound samples. |

    | kaudiocreator | KDE front-end for creating audio CDs. |

    | kmix | KDE front-end for sound settings. |

    | krec | KDE front-end for recording sound samples. |

    | mplayer | Multimedia player. |

    | play | Command line tool for playing sound samples. |


    # Exercises


    +   1. From the Gnome or KDE menu, open your sound configuration panel. Make sure
    audio boxes or headset are connected to your system and find an output level that
    is comfortable for you. Make sure, when your system is ALSA-compatible, that you
    use the appropriate panel.


    +   2. If you have a microphone, try recording a sample of your own voice. Make
    sure the input volume is not too high, as will result in high-pitched tones when
    you communicate with others, or transferring background noise to the other party.
    On the command line, you might even try to use **arecord** and **aplay** for recording
    and playing sound.


    +   3. Locate sound files on your system and play them.


    +   4. Insert an audio CD and try to play it.


    +   5. Find a chat partner and configure a VoIP program. (You might need to install
    one first.)


    +   6. Can you listen to Internet radio?


    +   7. If you have a DVD player and a movie on a DVD disk, try to play it.'
