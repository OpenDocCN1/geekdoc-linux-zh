    # Boot process, Init and shutdown


    # Introduction


    One of the most powerful aspects Linux concerns its open method of starting and
    stopping the operating system, where it loads programs using their particular
    configurations, permits you to change those configurations to control the boot
    process, and shuts down in a graceful and organized way.


    Beyond controlling the boot or shutdown process, the nature of Linux makes it
    easier to determine the exact source of most problems encountered with starting
    up or shutting down your system. A basic understanding of this process is quite
    beneficial to everyone who uses a Linux system.


    A lot of Linux systems use lilo, the Linux Loader for booting systems. We will
    only discuss GRUB, which is easier to use and more flexible. You should need information
    about lilo, refer to the pages and HOWTOs. Both systems support dual boot installations,
    we refer to the HOWTOs on this subject for practical examples and background information.


    # The boot process


    When an x86 computer is booted, the process looks at the end of the system memory
    for the BIOS (Basic Input/Output System) and runs it. The BIOS program is written
    into read-only memory and is always available for use. The BIOS provides the lowest
    level interface to peripheral devices and controls


    The BIOS tests the system, looks for and checks peripherals, then looks for a
    drive to boot the system. Usually it checks the floppy drive (or CD-ROM drive
    on many newer systems) for bootable media, if present, and then to the hard drive.
    The order of the drives for booting is usually controlled by a particular BIOS
    setting on the system. Once Linux is installed on the hard drive of a system,
    the BIOS looks for a Master Boot Record (MBR) at the first sector on the first
    hard drive, loads its contents into memory, then passes control to it.


    This MBR contains instructions on how to load the GRUB (or LILO) boot-loader,
    using a pre-selected operating system. The MBR loads the boot-loader, which takes
    over the process (if the boot-loader is installed in the MBR). In the default
    Red Linux configuration, GRUB uses the settings in the MBR to'
