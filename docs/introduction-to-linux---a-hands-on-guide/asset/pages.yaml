    # The tools


    # Creating directories


    A way of keeping things in place is to give files specific default locations by
    creating directories and subdirectories (folders or sub-folders) if you wish).
    Do this with the mkdir command:


    ```

    richard->: mkdir archive


    richard->: ls -ld archive

    drwxrxr-x 2 richard richard 4096 Jan 13 14:09 archive/

    ```


    Creating directories and subdirectories in one step is done using the -p option:


    ```

    richard->: cd archive


    richard->~/archive mkdir 1999 2000 2001


    richard->~/archive ls

    1999/ 2000/ 2001/


    richard->~/archive mkdir 2001/reports/Restaurants-Michelin/

    mkdir: cannot create directory `2001/reports/Restaurants-Michelin/'':nNo file
    or directory


    richard->~/archive mkdir -p 2001/reports/Restaurants-Michelin/


    richard->~/archive ls 2001/reports/Restaurants-Michelin/

    ```


    If the new files need permissions other than the default creation permissions,
    the new rights can be set in one move, using the mkdir command, see the Info pages
    for more. We are going to discuss access modes in the next section on file system.


    A name of a file has to comply with the rules as outlined on regular file names.
    One of the most important restrictions is that you can''t have two files with
    the same name in one directory (keep in mind that Linux is, unlike UNIX, a case
    sensitive operating system). There are virtually no limits to the length of a
    file name, but it is usually shorter than 80 characters, so it can fit on one
    line of a terminal. You can use any character you want in a file name, although
    it is advised to exclude characters that have a special meaning to the shell.
    In doubt, check with Appendix C, Shell Features.


    # Moving files


    Now that we have properly structured our home directory, it is time to clear up
    unclassified files using the mv command:


    ```

    richard->~/archive mv ..report[1-4].doc reports/Restaurants-Michelin/

    ```


    This command is also applicable when renaming files:'
