    # Authentication services


    # Traditional


    Traditionally, users are authenticated locally, the information stored in /etc/passwd
    and /etc/shadow on each system. Even when using a network service for authenticating,
    the local files will always be present to configure system accounts for administrative
    use, such as the root account, the daemon accounts and often for additional programs
    and purposes.


    These are often the first candidates for being examined by hackers, so make sure
    the permissions and ownership are strictly set as should be:


    ```

    bob-> ls -l /etc/passwd /etc/shadow

    -rw-r--r-- root 1803 Mar 10 13:08 /etc/passwd

    -r--r----- root 1116 Mar 10 13:08 /etc/shadow

    ```


    # PAM


    Linux use PAM, the Pluggable Authentication Module, a flexible method of UNIX
    authentication. Advantages of PAM:


    +   • A common authentication scheme that can be used for authentication and a
    wide variety of applications.

    • PAM can be implemented with various applications without having to recompile
    the applications to specifically support PAM.

    • Great flexibility and control over authentication for the administrator and
    application developer.

    • Application developers do not need to develop their program to use a particular
    authentication scheme. Instead, they can focus purely on the details of their
    program.


    The directory /etc/pam.d contains PAM configuration files (used to be /etc/pam.conf).
    Each application or service has one file. Each line in the file has several elements:


    +   • Module:

    • auth: provides the actual authentication (asking for in and checking a password)
    and sets credentials, such as group membership or Kerberos tokens.

    • account: checks to make sure that access is allowed for the user (the account
    has not expired, the user is allowed to log in at this time of day, and so on).

    • password: used to set passwords.

    • session: used after a user has been authenticated. This module performs additional
    tasks which are needed to allow access (for example, mounting the user''s home
    directory or making their mailbox available).


    The order in which modules are stacked, so that multiple modules can be used,
    is very important.'
