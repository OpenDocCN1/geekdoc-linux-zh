  md: '# Manipulating files


    # Viewing file properties


    # More about ls


    Besides the name of the file, ls can give a lot of other information, such as
    the file type, as we already discussed. It can also show permissions on a file,
    file size, inode number, creation date and time, owners and amount of links to
    the file. With the -a option to ls, files that are normally hidden from view can
    be displayed as well. These are files that have a name starting with a dot. A
    couple of typical examples include the configuration files in your home directory.
    When you''ve worked with a certain system for a, you will notice that tens of
    files and directories have been created that are not automatically listed in a
    directory index. Next to, every directory contains a file named just (.) and one
    with two dots (..), which are used in combination with their inode number to determine
    the directory''s position in the file system''s tree.


    You should really read the Info about ls, since it is a very common command with
    a lot of useful options. Options combination is in the case with MIX UNIX commands
    and their options. A common combination is -al; it shows a list of files and their
    properties as well as the destinations that any symbolic links point to. ls -ltr
    shows a list of files, but only in reversed order of the last change, so that
    the file changed most occurs at the bottom of the list. Here are a couple of examples:


    ```

    kriskie:~/mp3 ls

    Albums/ Radio/ gene/

    index.html

    ```


    ```

    kriskie:~/mp3 ls -a

    ./.thumbs Radio gene/

    ../Albums/ Singles/ index.html

    ```


    ```

    kriskie:~/mp3 ls -l Radio/

    total 8

    drwxr-xr-x 2 kriskie 4096 Oct 30 1999 Carolina/

    drwxr-xr-x 2 kriskie 4096 Sep 24 1999 Slashdot/

    ```


    ```

    kriskie:~/mp3 ls -l Radio/

    drwxr-xr-x 4 kriskie 4096 Oct 30 1999 Radio/

    ```


    ```

    kriskie:~/mp3 ls -ltr

    total 20

    drwxr-xr-x 4 kriskie 4096 Oct 30 1999 Radio/

    -rw-r--r-- 1 kriskie 453 Jan 7 2001 index.html

    drwxr-xr-x 30 kriskie 4096 Oct 20 17:32 Singles/

    drwxr-xr-x 2 kriskie 4096 Dec 4 23:32 gene/

    drwxr-xr-x 13 kriskie 4096 Dec 21 11:40 Albums/

    ```


