    # Cron and crontab


    The system is managed by the cron daemon. It gets information about which programs
    and when they should run from the users'' and crontab entries. The root user has
    access to all crontabs, each user should only have access to his own crontabs.
    On some systems (some) users may not have access to the crontab.


    At startup the crontab searches /var/spool/cron for crontab entries are named
    after accounts in /etc/passwd, it searches /etc/cron and it searches /etc/crontab
    then uses this information every minute to check if there is something to be done.
    It executes commands as the user who owns the crontab and mails any output of
    commands to the owner.


    On systems using Vixie, jobs that occur hourly, daily, weekly and monthly are
    kept in separate directories in /etc to keep an overview, as opposed to the standard
    UNIX cron function, where all tasks are entered into one big file.


    Example of a Vixie crontab:


