  md: '# Sound and video playing


    # CD playing and copying


    The cdp package comes with most distributions and cdp or cdplay, a text-based
    CD player. Desktop managers usually include a graphical tool, such as the gnome-cd
    player in Gnome, that has started from a menu.


    Be sure to understand the difference between an audio CD and a CD data. You do
    not have to mount an CD into the file system in order to listen to it. This is
    because the data on CD are not Linux file system data; they are accessed and sent
    to the audio output directly, using a CD player program. If your CD is CD containing
    .mp3 files you will first need to mount it into the file system, and how to mount
    CDs into the file system is explained in the section called “Installing extra
    packages from the installation CDs"


    The paranoia from the package with the same name reads audio directly from the
    data, without conversions, and writes data to a file or pipe in different formats,
    of which .wav is probably the most popular. Various tools for conversion to other
    formats, such as .mp3, come with most distributions or are downloadable as separate
    packages. The GNU project provides several CD playing, ripping and encoding tools,
    database managers; see the Free Software Directory, Audio section [http://www.gnu.org/directory/audio/]
    for detailed information.


    Audio-CD creation is eased many others, with the kaudiocreat tool from the KDE
    suite. It comes with clear information from the KDE Help Center.


    CD burning is covered in the section called “Making a copy with a CD-writer”.


    # Playing music files


    # mp3 files


    The popular .mp3 format is widely supported on Linux machines. Most distributions
    include programs that can play these files. Among many other applications, XMMS,
    which is presented in the screenshot below, is one of the most wide-spread, partially
    because it has the same look and feel as the Windows tool.


    Figure 11.1. XMMS mp3 player


    Also very popular for playing music is AmaroK, a KDE application that is steadily
    gaining popularity, and MPlayer, which can also play movies.'
