    # Update regularly


    Its ability to adapt quickly in an ever changing environment is what makes Linux
    thrive. But it also creates a possibility that security updates have been released
    even while you are installing a brand new version, so the first thing you should
    do (and this goes for any OS you can think of) after installing is getting the
    updates as soon as possible. After that, update all the packages you use regularly.


    Some updates may require new configuration files, and old files may be replaced.
    Check the documentation, and ensure that everything runs normal after updating.


    Most distributions provide mailing lists for security update announcements, and
    General Linux only security issues are reported among others at Linuxsecurity.com
    [http://linuxsecurity.com].


    Updating is an ongoing process, so it will be an almost daily habit.


    # Firewalls and access policies


    # What is a firewall?


    In the previous section we already mentioned mentioned firewall capabilities in
    Linux. While firewall administration is one of the tasks of your network admin,
    you should know a couple of things about firewalls.


    182'
