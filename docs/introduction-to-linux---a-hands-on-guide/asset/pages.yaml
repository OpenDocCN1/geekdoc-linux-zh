  md: '```

    ls -1 | grep part_of_file_name

    ```


    # Input redirection


    In another case, you may want a file to be the input for a command that normally
    wouldn''t accept a file as an option. Redirection of input is done using the “<”
    (less-than symbol) operator.


    Below is an example of sending a file to somebody, using input redirection.


    ```

    andy-> mail mike@somewhere.org < to_do

    ```


    If the user uses on the system, you don''t need to type the full address. If you
    want to reach somebody on the Internet, enter the fully address as an argument
    to mail.


    This reads a bit more difficult than the cat file | mail someone, but it is of
    course a much more elegant way of using the available tools.


    # Combining redirections


    The following example combines input and output redirection. The file text.txt
    is first checked for spelling mistakes, and the output is redirected to an error
    file:


    ```

    spell <text.txt >error.log

    ```


    The following command lists all commands that you can issue to examine another
    file when using less:


    ```

    mike-> less --help | grep -i examine

    :e [file] Examine a new file.

    * Examine the (N-th) next file from the command line.

    :p Examine the (N-th) previous file from the command line.

    :x Examine the first (or N-th) file from the command line.

    ```


    The -i option is used for case-insensitive searches - remember that UNIX systems
    are very case-sensitive.


    If you want to save output of this for future reference, redirect the output to
    a file:


    ```

    mike-> less --help | grep -i examine > example-files-in-ls

    mike-> cat examine-files-in-ls

    :e [file] Examine a new file.

    * Examine the (N-th) next file from the command line.

    :p Examine the (N-th) previous file from the command line.

    :x Examine the first (or N-th) file from the command line.

    ```


    Output of one command can be piped into another command as many times as you want,
    as long as these commands would normally read input from standard input and write
    output to the standard output. Sometimes, then there may be special options that
    instruct these commands to behave according to the standard definitions; so read
    the documentation (man and Info pages) of the commands if you should encounter
    errors.


    Again, make sure you dont use names of existing files that you still need. Redirecting
    output to existing files will replace the content of those files.'
