    # Automatic processes


    Automatic or batch processes are not connected to a terminal. Rather, these are
    tasks that can be queued into a spool area, where they will be executed on a FIFO
    (first-in, first-out) basis. Such tasks can be executed using one of two criteria:


    +   - At a certain date and time: using the at command, which we will discuss
    in the second part of this chapter.

    - At times when the system load is low enough to accept extra jobs: using the
    batch command. By default, tasks are put in a queue where they will be executed
    when the system load is lower than 0.8. In large environments, the system administrator
    may prepare batch processing when large amounts of data have to be processed or
    when tasks demanding a lot of system resources have to be executed on an already
    loaded system. Batch processing is also used for optimizing system performance.


    # Daemons


    Daemons are server processes that run continuously. Most of the time, they are
    initialized at system startup and wait in the background until their service is
    required. A typical example is the networking daemon, xinetd, which is started
    in almost every boot procedure. After the system is booted, the network daemon
    just sits and waits until a client program, such as an FTP client, needs to connect.


    # Process attributes


    A process has a series of characteristics, which can be viewed with the ps command:


    +   - The process ID or PID: a unique identifier used to refer to the process.

    - The parent process ID or PPID: the number of the process (PID) that started
    that process.

    - Nice number: the degree of friendliness of this process toward other processes
    (not to be confused with process priority, which is calculated based on this number
    and recent CPU usage of the process).

    - Terminal or TTY: the terminal to which the process is connected.

    - User name of the real and effective user (RUID and EUID): the owner of the process.
    The real owner is the user using, the effective user is the one determining access
    to system resources. RUID and EUID are usually the same, and the process has the
