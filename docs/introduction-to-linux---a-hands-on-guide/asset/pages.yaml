  md: '# Fundamental Backup Techniques


    The key ID of this key is "BF5C3DBB". You can send your key ID and your name to
    a key server, so that other people can get this info and use it to encrypt data
    for you. Alternatively, you can send your public key directly to the people who
    need it. The public part of your key is the long series of numbers that you see
    when using the --export option to the gpg command:


    ```

    gpg --export -a

    ```


    However, as far as this is concerned, we assume that you only need your key to
    encrypt and decrypt data for yourself. The gpg man pages if you want to know more.


    # Encrypted data


    Now you can encrypt a .tar archive or a compressed archive, prior to saving it
    to a backup medium or transporting it to the backup server. Use the gpg command
    like:


    ```

    gpg -e -r (part of) uid archive

    ```


    The -e tells gpg to encrypt, the -r option indicates who to encrypt. Keep in mind
    that only the one user(name) with this -r option will be able to decrypt the data
    again. For example:


    ```

    willy@ubuntu:-$ gpg -e -r Willy /var/tmp/home-willy-20060808.tar

    ```


    # Decrypting files


    Using the -d option, you can decrypt files that have been encrypted for you. The
    data will scroll over your screen, but an encrypted copy will remain on disk.
    So for file formats other than plain text, you will want to save the data, so
    that you can view it with the appropriate program. This is done using the -o option
    to the gpg command:


    ```

    willy@ubuntu:-$ gpg -d -o /var/tmp/home-willy-decrypt.tar /var/tmp/home-willy-2006

    ```


    You need a passphrase to unlock the secret key for


    user: "Willy De Wandel (Willem) <wdw@nv.vg>

    4096 ELG-E key, ID A349CF7, created 2006-08-08 (main key ID BF5C3DBBB)


    gpg: encrypted with 4096-bit ELG-E key, ID A349CF7, created 2006-08-08

    "Willy De Wandel (Willem) <wdw@nv.vg>


    # No password = no data


    If you cannot remember your password, the data is lost. Not even the system administrator
    will be able to decrypt the data. This is why a copy of important keys is kept
    in a sealed vault in a bank.


    # Summary


    Here''s a list of commands involving file backup:


    Table 9.1. New commands in chapter 9: Backup

    | Command | Meaning |

    |---|---|

    | bzip2 | A block-sorting file compressor. |'
