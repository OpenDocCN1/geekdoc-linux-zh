    # General good housekeeping


    # Introduction


    As mentioned before, it is easy enough to make a mess of the system. We can''t
    put enough stress on the importance of keeping the place tidy. When you learn
    this from the start, it will become a good habit that will save you time when
    programming on a Linux or UNIX system or when confronted with system management
    tasks. Here are some ways of making life easier on yourself:


    +   * Make a bin directory for your program files and scripts.


    +   * Organize non-executable files in appropriate directories, and make as many
    directories as you like. Examples include separate directories for images, documents,
    projects, downloaded files, spreadsheets, personal files, and so on.


    +   * Make directories private with the chmod 700 dirname command.


    +   * Give your files sensible names, such as Complaint to the prime minister
    050302 rather than letteri.


    # Make space


    On some systems, the quota system may force you to clean up from time to time,
    or the physical limits of your hard disk may force you to make more space without
    running any monitoring programs. This section discusses a number of ways, besides
    the rm command, to reclaim disk space.'
