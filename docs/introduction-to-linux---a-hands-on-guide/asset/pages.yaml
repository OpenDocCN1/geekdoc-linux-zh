    # Proxy servers


    # What is a proxy server?


    Companies and organizations often want their users to use a proxy server. Especially
    in environments with lots of users, a proxy server can enable faster downloads
    of web pages. The proxy server stores pages. When a user asks for a page that
    has already been requested previously, the proxy server will give that to the
    user, so that does not need to get from the Internet, which would take longer.
    Of course, measures be taken so that the proxy server does a quick check and always
    serves the most recent version of a page. In some environments, usage of the proxy
    server is compulsory, in other environments you may have the choice whether or
    not to use it.'
