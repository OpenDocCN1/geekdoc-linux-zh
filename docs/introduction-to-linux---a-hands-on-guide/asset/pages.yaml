    # Installing new software


    # General


    Most people are surprised to see that they have a running, usable computer after
    installing Linux; most distributions contain ample support for video and network
    cards, monitors and other external devices, there is usually no to install extra
    drivers. Also common tools such as office suites, web browsers, email and other
    network clients are included in the main distributions. Even so, an installation
    might not meet your requirements.


    If you just cannot find what you need, maybe it is not installed on your system.
    It may be that you have the required software, but it does not what it is supposed
    to do. Remember that Linux moves fast, and software improves on a daily basis.
    Don''t waste your time troubleshooting problems that might already be resolved.


    You can update your system or add packages to any time you want. Most software
    comes in packages. Extra software may be found on installation CDs or on the Internet.
    The website of your Linux distribution is a good place to start looking for additional
    software and instructions about how to install it on your type of Linux, see Appendix
    A, Where to go from here?. Always read the documentation that comes with new software,
    and any installation guidelines the package might contain. All software comes
    with a README file, which are strongly advised to read.


    # Package formats


    # RPM packages


    # What is RPM?


    RPM, the RedHat Package Manager, is a powerful package manager that you can use
    to install, update and remove packages. It allows you search for packages and
    keeps track of the files that come with each package. A system is built-in so
    that you can verify the authenticity of packages downloaded from the Internet.
    Advanced users can build their own packages with RPM.


    An RPM package consists of an archive of files and meta-data used to install and
    erase the archive files. The meta-data includes helper scripts, file attributes,
    and descriptive information about the package. Packages come in two varieties:
    binary packages, used to encapsulate software to be installed, and source packages,
    containing the source code and recipe necessary to produce binary packages.'
