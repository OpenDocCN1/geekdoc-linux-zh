- img_proc: true
  md: 'When you see that one of your processes is eating too much of the system''s
    resources, there are two things that you can do:


    +   1. Make the process use less resources without interrupting it;


    +   2. Stop the process alterog.


    In the case that you want the process to continue to run, but you also want to
    give the other processes on the system a change, you can **renice** the process.
    Apart from using the **nice** or **renice** commands, **top** is an easy way of
    spotting the troublesome process(s) and reducing priority.


    Identify the process in the "NI" column, it will likely have a negative priority.
    Type **r** and enter the process ID of the process that you want to renice. Then
    enter the nice value, for instance "20". That means from now on, this process
    will take 1/n of the CPU cycles at most.


    Examples of processes that you want to keep on running are editors, virtual machines,
    compilers and so on.


    If you want to stop a process because it hangs or is totally berserk in the way
    of I/O consumption, file creation or use of other system resources, use the **kill**
    command. If you have the opportunity, first try to kill the process softly, sending
    the SIGTERM signal. This is an instruction to terminate it by doing, as described
    in the code of the program:


    ```

    joe:: ps -ef | grep mozilla

    joe 25822 1 Marill 00:34:04 /usr/lib/mozilla-1.4.1/mozilla-

    joe:: kill -15 25822

    ```


    In the example above, *joe* stopped his Mozilla browser because it was hung.


    Some processes are a little hard to get rid of. If you have the time, you might
    want to send them the SIGINT signal to interrupt them. If that does not work either,
    use the strongest signal, SIGKILL. In the example below, joe stops a process that
    is frozen:


    ```

    joe:: ps -ef | grep mozilla

    joe 25915 1 Marill 00:15:06 /usr/lib/mozilla-1.4.1/mozilla-

    joe:: kill -9 25915

    ```


    ```

    joe:: ps -ef | grep 25915

    joe 2634 32273 0 18:09 pts/4 00:00:00 grep 25915

    ```


    In such cases, you might want to check that the process is really dead, using
    the **grep** filter again on the PID. If this only returns the **grep** process,
    you can be sure that succeeded in stopping the process.


    Among processes that are hard to kill is shell. And that is a good thing: if they
    would be easy to kill, you would lose your shell every time you type **Ctrl-C**
    on the command line accidentally, since this is equivalent to sending a SIGINT.


    # UNIX with pipes is almost unthinkable


    The usage of pipes (|) for using output of one command as input of another is
    explained in the next chapter, Chapter 5, I/O redirection.'
