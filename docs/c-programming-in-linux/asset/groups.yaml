    \ and begin to see the complexity.\n\n## 7. Apache modules\n\n### 7.1 Safer web\
    \ applications\n\nIn real life few web administrators dream of letting anyone\
    \ CGI generators because the Apache server itself is written in C there are simple\
    \ utilities with its development tools permit to create stubs into which you can\
