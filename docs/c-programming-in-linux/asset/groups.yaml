    \ to notice the difference between single quote marks ' used around characters\
    \ and double quote marks \" used around character strings.\n\n```c\n/*\n* C Programming\
    \ in Linux (c) David Haskins 2008\n* chapter2_2.c\n*/\n#include <stdio.h>\n\n\
