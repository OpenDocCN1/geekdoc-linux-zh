- md: "\n## 7.3 Apache Modules Conclusion\n\nWhilst tricky to write and debug, this\
    \ is probably the most rewarding and esoteric area where you do real, commercially\
    \ useful and safely deployable web content generation. It is easy to see how this\
    \ example could be extended with parameters for colours and fonts to make a useful\
    \ web content tool.\n\nThere is very little clear simple material about apache\
    \ modules but start with the on-line documentation at http://httpd.apache.org/docs/2.2/developer/\n\
    \nOne recent book worth looking at “The Apache Modules Book” Nick Kew, Prentice\
    \ Hall.\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_76_0.png)\n\n## 8. The Ghost\
    \ project\n\n### 8.1 A PHP web site generator project\n\nThe ability to write\
    \ short programs in C to automate tedious tasks or to do things that would otherwise\
    \ take hours of fiddling with cumbersome tools such as doing mail-merge, is one\
    \ of the things you will be pleased you have learned how to do it. This project\
    \ is such a time-saver. Ghost is a lightweight PHP generator for you to customise.\n\
    \nIf you find yourself having to build PHP web sites all the time, a quick way\
    \ to generate all the parameter-passing, decoding, forms building and database\
    \ management code in one step would be useful. Tools like Ruby on Rails offer\
    \ such functionality but are infinitely more complex to set up and run you without\
    \ needing to learn yet another language to go any.\n\nTo run the site generator\
    \ type:\n\n- /ghost testwebsite data1 data2 data3 data4 data6 data6\nWill create:\n\
    - a folder public_html/testwebsite\n- a mysql database table called testwebsite\
    \ with text fields data1 data2 data3 data4 data6\n- a testwebsite.css file\n-\
    \ empty header.html and footer.html pages\n- index.php that demonstrates a form\
    \ handling entry, edit & update, and delete to the database table for the data\
    \ items specified.\n\nIn a browser you will see this at http://localhost/~username/testwebsite\n\
    \n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_77_0.png)\n\nThe idea behind this is\
    \ that all the mechanical bits to create and manage the form content are done\
    \ and can be customised. This screen shot shows the result of submitting one record.\
    \ Thode top row is for entering data, the lower row(s) allow editing or deleting\
    \ of records. It is a framework that allows you to take and use parts in your\
    \ own website design.\n\nLet us use code in sections.\n\nThe first section declares\
    \ the required data and creates the folder and CSS file.\n\n```c\nint main(int\
    \ argc\n```\n\nNext the header.html and footer.html files are generated. These\
    \ files is loaded by the PHP file and could be used as a generic header and footers.\
    \ The CSS file is referenced from the header.html file.\n\n```c\n//BUILD HEADER\
    \ HTML////////////////////////////////////\nprintf(BIT,\"../%s/head.html\",argv[1]);\n\
    out = fopen(BIT,\"w\");\nprintf(out,\"<html>\\n\");\nprintf(out,\"<head>\\n\"\
    );\nprintf(out,\"<link rel=\"%s\" type=\"text/css\" href=\\\"\\%s.css\" />\\n\"\
    ,argv[1]);\nprintf(out,\"<title>%s</title>\",argv[1]);\nprintf(out,\"</head>\\\
    n\");\nprintf(out,\"<body>\\n\");\nprintf(out,\"<center>\\n\");\nprintf(out,\"\
    <table><tr><td>\\n\");\nprintf(out,\"</td></tr></table>\\n\");\nprintf(out,\"\\\
    n\");\nfclose(out);\n//BUILD FOOT HTML////////////////////////////////////\nprintf(BIT,\"\
    ../%s/foot.html\",argv[1]);\nout = fopen(BIT,\"w\");\nprintf(out,\"</body></html>\\\
    n\");\nfclose(out);\n```\n\n## C Programming in Linux\n\n## The Ghost project\n\
    \nWe create the DATABASE base.\n\n```c\n// OPEN DATABASE/////////////////////////////////////\n\
    conn = mysql_init((MYSQL *) 0);\nmysql_options(conn,MYSQL_READ_DEFAULT_GROUP,\"\
    mysqlcap\");\nmysql_real_connect(conn,\"localhost\",\"\",\"\",\"test\",0,NULL,0);\n\
    // CREATE TABLE///////////////////////////////////////\nsprint(SQL,\"drop table\
    \ if exists %s\",argv[1]);\nrc = mysql_query(conn,SQL);\nsprint(SQL,\"create table\
    \ %s (ID varchar(255)),\",argv[1]);\nfor(i=2; i < argc; i++) {\n\tsprint(SQL,\"\
    BIT,%s varchar(255)),\",argv[i]);\n\tstrcat(SQL,BIT);\");\n}\nrc = mysql_query(conn,SQL);\n\
    ```\n\nThe complicated part starts now, of generating php script. The best way\
