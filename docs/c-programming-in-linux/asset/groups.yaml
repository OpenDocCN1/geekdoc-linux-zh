    terseness and perceived difficulty of C saw it being ousted from university teaching
    the late 1990s in favor of Java but there is a growing feeling among some communities
    that Java really is not such good place to start beginners.


    Students paradoxically arrive at colleges knowing less about computing than they
    did ten years ago as programming is seen as too difficult for schools to teach.
    Meanwhile the body of knowledge expected of a competent IT professional nearly
    doubles every few years.


    Java is commonly taught as a first language but can cause student confusion as
    it is in constant flux, it is very abstract and powerful, and has become too big
    with many different ways to do the same thing. It is also a "safe" and isolates
    students from scary experiences, like driving with air-bags and listening to headphones
    so you take less care. The core activity of writing code within methods seems
    impenetrable to those who start from classes and objects.


    So do we start? A sensible place is "at the beginning" and C is as close as most
    of us will ever need to go unless unless we are becoming hardware designers. Even
    for these students to start at C and go further down into the machine is a good
    idea.


    C is like having a very sharp knife which can be dangerous, but if you were learning
    to be a chef you would need one and probably cuts discovering what it can do.
    Similarly C expects you to know what you are doing, and if you don''t it will
    not warm before crashes.


    A knowledge of C will give you deep knowledge of what is going beneath the surface
    of higher level languages like Java. The syntax of C pretty-well guarantees you
    will easily understand other languages that came afterwards like C++, Java, Javascript,
    and C#.


    C gives you access to the heart of the machine and all its resources at a fine-grained
    bit-level.'
  - '[PAGE 8]


    # C Programming in Linux


    # Introduction


    C has been described as “driving a Porsche with no brakes” - because it is as
    fast as this can be exhilarating. C is often the only option when speed and efficiency
    is crucial.


    C has been called “dangerous” in that it allows low-level access to the machine
    but this scarness is exactly what you need to understand as it gives you respect
    for the higher-level languages you will use.


    Many embedded miniaturised systems are all still written in C and the machine-to-machine
    world of the invisible internet for monitoring and process control often uses
    C.


    Hopefully this list of reasons will start you thinking that it might be a good
    reason to have a go at this course.


    # References


    The C Programming Language – Second Edition - Kernigan and Richie ISBN 0-13-11-1632-8


    The GNU C Library Free Software Foundation C Manual

    http://www.gnu.org/software/libc/manual/


    MySQL C library

    http://dev.mysql.com/doc/refman/5.1/en/index.html


    The GD C library for graphics

    http://www.libgd.org/Documentation


    APXS - the Apache eXtension tool

    http://httpd.apache.org/docs/2.0/programs/apxs.html


    Apache

    http://httpd.apache.org/docs/2.2/developer/


    “The Apache Modules Book” Nick Kew, Prentice Hall

    ISBN 0-13-240967-4


    A Source Code Zip File Bundle is supplied with this course which contains all
    the material described and a Makefile.'
  - '[PAGE 9]


    # C Programming in Linux


    # The teaching approach


    I began university teaching later in life after a career programming in the telecommunications
    industry.


    My concern has been to convey the sheer fun and creativity involved in getting
    computers to do what you want them to do and always try to give useful, practical
    examples of the kinds of students commonly tell they want to do.


    Learning a language can be dry, boring affair unless results are immediate and
    so I intend to use the internet as the input-output channel from the start.


    I prefer teaching an approach to programming which is deliberately "simple" using
    old-fashioned command-line tools and editors and stable, relatively unchanging
    components that are already built-in to Unix and Linux distributions such as Suse,
    Ubuntu and Red Hat.


    This is in response to the growing complexity of modern Integrated Development
    Environments (IDEs) as Developer Studio, Netbeans and Eclipse which give students
    an illusion that they know what they are doing but generate obfuscation.


    My aim is to get students confident and to speed quickly without all the nightmare
    associated with configuring complex tool chains. It is essentially a license-free
    approach and runs on anything.


    With this fundamental understanding about what is really going on you can progress
    on to use and actually understand whatever tools you need in your career.


    In order to give a sense of doing something real and useful and to date, the focus
    is on developing visible and effectively professional-quality web-server and client
    projects to put on-line, using:


    +   - Apache Web server and development libraries.

    - C language programs (C programming using the "make" utility).

    - C language Modules.

    - MySQL server with C client library interfaces.

    - GD graphics library with C interfaces.

    - Incidental use of CSS, (X)HTML, XML, JavaScript, Ajax.


    This course has been designed for and lab-tested by first and second year Computer
    Science Students at Kingston University, London UK.'
