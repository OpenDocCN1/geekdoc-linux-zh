    n\");\nprintf(out,\"<table><tr><td>\\n\");\nprintf(out,\"</td></tr></table>\\\
    n\");\nprintf(out,\"\\n\");\nfclose(out);\n//BUILD FOOT HTML////////////////////////////////////\n\
    printf(BIT,\"../%s/foot.html\",argv[1]);\nout = fopen(BIT,\"w\");\nprintf(out,\"\
    </body></html>\\n\");\nfclose(out);\n```\n\n## Linux 下 C 语言编程\n\n## Ghost 项目\n\
