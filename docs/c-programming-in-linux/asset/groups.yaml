  mdcn: "\n在声明该数据的函数外部，该数据是不可访问的——这就是声明的*作用域*（scope）。如果我们声明了 main() 函数，它在作用域上将是*全局的*（global），其他函数可以访问它。C允许你根据需要进行一些危险的操作，也可以保持谨慎。\n\
    \n通常，我们会密切关注数据的作用域，并向程序中可能需要处理甚至修改它的部分传递**只读副本**或**内存地址**。这些带有标记的内存地址被称为**指针**（pointers）。\n\
    \n我们正在使用 *printf* 家族的库函数（包括：**sprintf** 用于创建字符串，**fprintf** 用于写入文件等），它们都使用一个通用的**格式字符串**参数来指定数据的表示方式。\n\
    \n- %c 字符\n- %s 字符串\n- %d 整数\n- %f 浮点数\n\n参数中的剩余系列变量将按照指定的顺序放入格式字符串中。\n\n在 C 中，**初始化**你声明的任何数据是一个好习惯，因为为其分配的内存内容不会被清除，可能包含任何旧的垃圾数据。\n\
    \n编译命令：`gcc -o data1 chapter2_1.c -lc`\n运行 ./data1 时的程序输出：\n\n```\nTown name:\
    \ Guildford population:66773\nCounty: Surrey\nCountry: Great Britain\nLocation\
    \ latitude: 51.238598 longitude: -0.566258\nchar = 1 byte int = 4 bytes float\
    \ = 4 bytes\nmemory used:780 bytes\n```\n\n# 关于制作一个实用工具的说明\n\n到这里，你可能对输入所有这些编译器命令感到无聊了，因此有一个名为\
    \ make 的工具，它可以在代码存储文件夹中运行一个名为 Makefile 的文件。以下是目前为止示例的 Makefile：\n\n```\n#Makefile\n\
    all:chap1 chap2\nchap1: 1-1 1-2 1-3 1-4\n1-1:\n    gcc -o hello1 chapter1.c -lc\n\
