    \ The Ghost project 78\n8.1 A PHP web site generator project 78\n# Conclusion\
    \ 84\n\n# About the author, David Haskins\n\nI was born in 1950 in Chelsea, London,\
    \ but grew up in New Zealand returning to England in 1966. I have worked in the\
    \ computer industry since 1975 after a couple of years as a professional drummer.\n\
    \nMy first experience was five years as a mainframe engineer for Sperry Unic (now\
    \ Unisys) followed by 14 years as an analyst programmer with British Telecom in\
    \ London.\n\nWhile engaged in a complex task of converting large quantities of\
    \ geographical data (map coordinate references) I discovered the joys of C – speed\
    \ and efficiency. That was in 1985 and I have been a fan of C ever since.\n\n\
    Since 1994 I have been a senior lecturer at the Faculty of Computing, Information\
    \ Systems and Mathematics at Kingston University, London. This is a mostly technically\
    \ university that evolved from a former poly college with a long tradition of\
    \ aeronautical engineering.\n\nI am engaged in teaching many computer languages\
    \ and internet systems design to a large and multicultural student body.\n\nMost\
    \ of my academic research and commercial consultancy has been involved with spatial\
    \ systems design and the large data volumes and necessary processing efficiency\
    \ concerns has led me to concentrate on C and C++. My teaching web site is www.abiubi.org\
    \ which shows some of its material.\n\nA keen Open Systems enthusiast, I have\
    \ exclusively centred my teaching on the Linux platform since 2002 and Kingston\
    \ University is well advant in delivering dual boot facilities for all its student\
    \ labs.\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_6_0.png)\n\nI am a keen swimmer\
    \ and in 2009 completed the annual Lorne Pier-to-Pub race in Victoria, Australia\
    \ which is the largest open-sea swimming race in the world where 4,500 people\
    \ of all ages swim each January as the sharp-spotting planes fly overhead.\n\n\
    When not teaching I am a keen vegetable gardener and amateur musician, playing\
    \ in jazz groups and in Scottish bagpipe bands. I play the drums, the great highland\
    \ bagpipe, the clarinet, the guitar and the piano.\n\n# Introduction\n\n# Why\
    \ learn the C language?\n\nBecause the C language is like Latin - it is finite\
    \ and has not changed for years. C is tight and spare, and in the current economic\
    \ climate we will need a host of young people who know C to keep existing critical\
    \ systems running.\n\nC is built into the core of Linux and Unix. The design idea\
    \ behind Unix was to write an operating system in C so all you need to port it\
    \ to a new architecture is a C compiler. Linux is essentially the success story\
    \ of years of earlier attempts to make a PC version of Unix.\n\nA knowledge of\
    \ C is now and has for years a pre-requisite for serious software professionals\
    \ and with the recent popularity and maturity of Open Systems this terseness and\
    \ perceived difficulty of C saw it being ousted from university teaching the late\
    \ 1990s in favor of Java but there is a growing feeling among some communities\
    \ that Java really is not such good place to start beginners.\n\nStudents paradoxically\
    \ arrive at colleges knowing less about computing than they did ten years ago\
    \ as programming is seen as too difficult for schools to teach. Meanwhile the\
    \ body of knowledge expected of a competent IT professional nearly doubles every\
    \ few years.\n\nJava is commonly taught as a first language but can cause student\
    \ confusion as it is in constant flux, it is very abstract and powerful, and has\
    \ become too big with many different ways to do the same thing. It is also a \"\
    safe\" and isolates students from scary experiences, like driving with air-bags\
    \ and listening to headphones so you take less care. The core activity of writing\
    \ code within methods seems impenetrable to those who start from classes and objects.\n\
    \nSo do we start? A sensible place is \"at the beginning\" and C is as close as\
    \ most of us will ever need to go unless unless we are becoming hardware designers.\
    \ Even for these students to start at C and go further down into the machine is\
    \ a good idea.\n\nC is like having a very sharp knife which can be dangerous,\
    \ but if you were learning to be a chef you would need one and probably cuts discovering\
    \ what it can do. Similarly C expects you to know what you are doing, and if you\
    \ don't it will not warm before crashes.\n\nA knowledge of C will give you deep\
    \ knowledge of what is going beneath the surface of higher level languages like\
    \ Java. The syntax of C pretty-well guarantees you will easily understand other\
    \ languages that came afterwards like C++, Java, Javascript, and C#.\n\nC gives\
    \ you access to the heart of the machine and all its resources at a fine-grained\
    \ bit-level.\n\n# C Programming in Linux\n\n# Introduction\n\nC has been described\
    \ as “driving a Porsche with no brakes” - because it is as fast as this can be\
    \ exhilarating. C is often the only option when speed and efficiency is crucial.\n\
    \nC has been called “dangerous” in that it allows low-level access to the machine\
    \ but this scarness is exactly what you need to understand as it gives you respect\
    \ for the higher-level languages you will use.\n\nMany embedded miniaturised systems\
    \ are all still written in C and the machine-to-machine world of the invisible\
    \ internet for monitoring and process control often uses C.\n\nHopefully this\
    \ list of reasons will start you thinking that it might be a good reason to have\
    \ a go at this course.\n\n# References\n\nThe C Programming Language – Second\
    \ Edition - Kernigan and Richie ISBN 0-13-11632-8\n\nThe GNU C Library Free Foundation\
    \ C Manual\nhttp://www.gnu.org/software/libc/manual/\n\nMySQL C\nhttp://dev.mysql.com/doc/refman/5.1/en/index.html\n\
    \nThe GD library for graphics\nhttp://www.libgd.org/Documentation\n\nAPXS - the\
    \ Apache Extension tool\nhttp://httpd.apache.org/docs/2.0/programs/apxs.html\n\
    \nApache\nhttp://httpd.apache.org/docs/2.2/developer/\n\n“The Apache Modules Book”\
    \ Nick Kew, Prentice Hall\nISBN 0-13-240967-4\n\n Source Code Zip Bundle is supplied\
    \ with this course which contains all the material and a Makefile.\n\n# C Programming\
    \ in Linux\n\n# The teaching approach\n\nI began university teaching later in\
    \ life after a career programming in the telecommunications industry.\n\nMy concern\
    \ has been to convey the sheer fun and creativity involved in getting computers\
    \ to do what you want and always try to give useful, practical examples of the\
    \ kinds students commonly tell they want to do.\n\nLearning a language can be\
    \ dry, boring affair unless results are immediate and so I intend to use the internet\
    \ as the input-output channel from the start.\n\nI prefer teaching an approach\
    \ to programming which is deliberately \"simple\" using old-fashioned command-line\
    \ tools and editors and stable, relatively unchanging components that are already\
    \ built-in to Unix and Linux distributions such as Suse, Ubuntu and Red Hat.\n\
    \nThis is in response to the growing complexity of modern Integrated Development\
    \ Environments (IDEs) as Developer Studio, Netbeans and Eclipse which give students\
    \ an illusion that they know what they are doing but generate obfuscation.\n\n\
    My aim is to get students confident and to speed quickly without all the nightmare\
    \ associated with configuring tool chains. It is essentially a license-free approach\
    \ and runs on anything.\n\nWith this fundamental understanding about what is really\
    \ going on you can progress on to use and actually understand whatever tools you\
    \ need in your career.\n\nIn order to give a sense of doing something real and\
    \ useful and to date the focus is on developing visible and effectively professional-quality\
    \ web-server and client projects to put on-line, using:\n\n- Apache Web server\
    \ and development libraries.\n- C language programs (C programming using the \"\
    make\" utility).\n- C Modules.\n- MySQL server with C client library interfaces.\n\
    - GD graphics library with C interfaces.\n- Incidental use of CSS, (X)HTML, XML,\
    \ JavaScript, Ajax.\n\nThis course has been designed for and lab-tested by first\
    \ and second year Computer Science Students at Kingston University, London UK.\n"
