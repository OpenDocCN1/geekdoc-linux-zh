    \ utility will change according to the Linux distribution you are using like this.\n\
    \n```\n/usr/sbin/apxs -n labelmaker -g\nCreating [DIR] labelmaker\nCreating [FILE]\
    \ labelmaker/Makefile\nCreating [FILE] labelmaker/modules.mk\nCreating [FILE]\
    \ labelmaker/mod_maker.c\nCreating [FILE] labelmaker/.deps\n```\n\nThis creates\
    \ a folder of the name (labelmaker) and a Makefile, modules.mk file which can\
    \ be used by Make utility, and a file called mod_maker.c. The C file is generated\
    \ like Hello World for Apache. It may look like a complex thing but does supply\
    \ explanatory header which is worth reading. The idea is that Apache starts its\
    \ modules in a specified location which are configured as needing to be loaded\
    \ in the server configuration files, the *_register_hooks function lists the names\
    \ and signatures of functions that can be called at specific stages in the Apache\
    \ process. In this case the name of this module will be asked to handle whatever\
    \ happens in the *_handler function.\n\nThe configuration of the server can be\
    \ a bit fiddly we have to add this to the file:\n\n### /etc/apache2/default.conf\n\
    \n```\n<Location /labelmaker>\n    SetHandler labelmaker\n</Location>\n```\n\n\
    and in /etc/apache2/conf we add the name of our module labelmaker to comma-separated\
    \ list in the line starting\nAPACHE_MODULES=\"....labelmaker\"\n\nNow go to the\
    \ folder labelmaker and type:\n\n```\n/usr/sbin/apxs -e -i mod_maker.c\nsudo /etc/init.d/apache2\
    \ restart\n```\n\n## C Programming in Linux\n\n## Apache modules\n\nCall this\
    \ in a browser like this:\n\n```\n#include \"httpd.h\"\n#include \"http_config.h\"\
    \n#include \"http_protocol.h\"\n#include \"ap_config.h\"\n\n/* The sample content\
    \ handler */\nstatic int labelmaker_handler(request_rec *r)\n{\n    if (strcmp(r->handler,\
    \ \"labelmaker\")) {\n        return DECLINED;\n    }\n    r->content_type = \"\
