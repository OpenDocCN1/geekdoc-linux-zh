  mdcn: "\n\n# 3. 函数、指针与结构体\n\n## 3.1 函数\n\n我们所有程序的入口都称为 main()，这是一个函数，或者是一段执行某些操作的代码，通常会返回某个值。我们将程序结构化为函数，以防止它们变成在一个屏幕或页面上无法显示的不可读代码块，并确保我们不会在到处都是重复的相同代码段。我们可以调用库函数，如\
    \ `printf` 或 `strtok`（它们是 C 语言的一部分），我们也可以调用自己的或其他人的函数和函数库。我们必须确保相应的头文件存在并可以被预处理器读取，或者编译后的库也存在且可以访问。\n\
    \n正如我们之前学过的，数据的作用域限制在定义它的函数内部，因此我们使用指向数据和数据块的指针传递给希望对其进行某些处理的函数。我们已经看到字符串被处理为指向以\
    \ NULL 字符终止的单字符数组的指针。\n\n# Linux 下 C 编程\n\n* Linux 下 C 编程 (c) David Haskins 2008\n\
    * chapter3_1.c\n\n```\n#include <stdio.h>\n#include <string.h>\n#include <math.h>\n\
    \ndouble doit(int number1, int number2)\n{\n    return sqrt((double)number1 +\
    \ number2);\n}\n\nint main(int argc, char *argv[], char *env[])\n{\n    int n1\
    \ = 0, n2 = 0, i=0;\n    n1 = atoi((char *) strtok(argv[1],\",\"));\n    n2 =\
    \ atoi((char *) strtok(NULL,\",\"));\n    printf(\"Content-type:text/html\\n<html>\\\
    n<body>\\n\");\n    for(i=1;i<100;i++) printf(\"%f ,\\n\",doit(n1+i,n2));\n  \
    \  printf(\"</body>\\n</html>\\n\");\n    return 0;\n}\n```\n\n在这个示例中，我们可以反复调用函数\
    \ \"doit\"，该函数接受两个整数参数并返回某些数学计算的结果。\n\n- 编译：gcc func1 chapter3_1.c -lm\n- 复制到\
    \ cgi-bin：cp func1 /home/david/public_html/cgi-bin/func1\n\n（随着你的进展，你现在应该维护一个\
    \ Makefile，在进行的过程中为编译示例添加目标。）\n\n# Linux 下 C 编程\n\n# 函数、指针与结构体\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_36_0.png)\n\
    \n浏览器中的结果看起来像这样，被称为 \"func1:5\"。\n\n在这种情况下，我们函数的参数是以拷贝的形式发送的，在使用的函数内部不会被修改。\n\n\
    如果我们想修改一个变量，就必须向函数发送它的指针。\n\n# Linux 下 C 编程\n\n我们通过 `&result` 发送变量 'result' 的地址，在函数内部，我们对指针\
    \ *result* 进行解引用以获取 float 并在 main 内部的作用域之外更改它的值。这与 chapter3_1.c 的输出完全相同。\n\n##\
    \ 3.2 库函数\n\nC 包含了许多用于常用任务的内置函数。到为止，我们使用了 `atoi`、`printf`、`sizeof`、`strtok` 和\
    \ `sqrt`。要获取任何内置库函数的完整细节，我们只需要输入：\n\n- man 3 atoi\n\n我们就会看到所有这些内容：\n\n# Linux\
    \ 下 C 编程\n\n# 函数、指针与结构体\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_38_0.png)\n\
    \n这很好地告诉了你关于该函数的所有知识、如何使用它及其变体。最重要的是它告诉了你需要包含哪个头文件。\n\n## 3.3 库函数函数参考\n\n所有可用函数的细节可以在此处找到：\n\
    http://www.gnu.org/software/libc/manual/\n\n# 按头文件分类常用库函数：\n\n| 头文件 | 类别 | 示例\
    \ |\n| :--- | :--- | :--- |\n| **math.h** | 三角函数 | cos, sin tan |\n| | 指数、对数和幂函数\
    \ | exp log pow sqrt |\n| | 其他数学函数 | ceil floor fmod |\n| **stdio.h** | 文件函数 |\
    \ close feof fgetpos fopen read freseek |\n| | 格式化 I/O 函数 | printf scanf |\n|\
    \ | 字符 I/O 函数 | getc fgetc fputc getuts getchar gets putc puts |\n| **stdlib.h**\
    \ | 字符串函数 | atof atoi atoi |\n| | 内存函数 | calloc free malloc |\n| | 环境函数 | abort\
    \ exit getenv system |\n| | 数学函数 | abs div rand |\n| **string.h** | 字符串函数 | strcat\
    \ strchr strcmpncmp strncpy strnpy strcspn strstr strtok |\n| **time.h** | 时间函数\
    \ | asctime clock difftime time |\n\n在发现需要执行某些事情之前，学习库函数是没有意义的，因为这会引导你去寻找为该目的编写的函数或函数库。你需要理解函数签名——或者参数列表的含义、如何使用它，以及函数返回什么，或对作为指针传递的变量做了什么。\n\
    \n*(注：原文后续部分存在大量重复段落，已根据指令要求进行处理，不再重复输出)*\n\n"
