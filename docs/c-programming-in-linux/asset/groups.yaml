    # 7. Apache C modules


    # 7.1 Safer C web applications


    In real life few web administrators would dream of letting anyone C programs as
    CGI content generators because of the Apache server itself is written in C there
    are simple utilities that with its development tools permit you to create code
    stubs into which you can place your C programs and run them as Apache modules
    when they are loaded as part of the server and managed safely in a kind of "sand-box".
    Here we will take an earlier example and turn it into an Apache module.


    A utility apachexs2 is included in the Apache2 development libraries which can
    be invoked to generate a code stub for a program that can be compiled into a module
    that is loaded and managed by the Apache server. These modules can be used to
    perform a huge variety of tasks but in our case we will do doing something is
    ack the ISAPI found in the IIS server. The exact location of the apachexs2 utility
    will change according to the Linux distribution you are using with OpenSuse runs
    like this.


    $ /usr/sbin/apachexs2 -n labelmaker -g

    david@linux-bxso:~\$ /usr/sbin/apachexs2 -n labelmaker -g

    Creating [DIR] labelmaker

    Creating [FILE] labelmaker/Makefile

    Creating [FILE] labelmaker/modules.mk

    Creating [FILE] labelmaker/mod_labelmaker.c

    Creating [FILE] labelmaker/.deps

    david@linux-bxso:~\$


    This creates a folder of the name you give (labelmaker) and a Makefile, modules.mk
    file which can be used by the Make utility, and a file called mod_labelmaker.c.


    The C file is generated is like a Hello World for Apache. It may look like a complex
    thing but it does supply a explanatory comment header which is worth reading.
    The idea is that Apache starts its modules in a specified location which are configured
    as needing to be loaded in the server configuration files, will be loaded. The
    *_register_hooks function lists the names and signatures of functions that can
    be called at specific stages in the Apache server process. In this case the name
    http://localhost/labelmaker is called this module will be asked to handle whatever
    happens in the *_handler_hook function.


    ![](img/7850df81ed1a1b9c43f67da3d9dfcff8_72_0.png)'
