- md: "\n# 3. Functions, pointers and structures\n\n## 3.1 Functions\n\nThe entry\
    \ point into all our programs is called main() and this is a function, or a piece\
    \ of code that does something, usually returning some value. We structure programs\
    \ into functions and also to stop them from becoming unreadable blocks of code\
    \ that cannot be seen in one screen or page to ensure that we do not have repeated\
    \ identical chunks of code all over the place. We can call library functions like\
    \ printf or strtok which are part of the C language and we can call our own or\
    \ other peoples functions and libraries of functions. We have to ensure that the\
    \ appropriate header file exists and can be read by the preprocessor or compiled\
    \ library exists too and is accessible.\n\nAs we learned before, the scope of\
    \ data is restricted to the function in which it is declared, so we use pointers\
    \ to data and blocks of data to pass to functions that we wish to do some work\
    \ on our data. We have seen already that strings are handled as pointers to arrays\
    \ of single characters terminated with a NULL character.\n\n# C Programming in\
    \ Linux\n\n* C Programming in Linux (c) David Haskins 2008\n* chapter3_1.c\n\n\
    ```\n#include <stdio.h>\n#include <string.h>\n#include <math.h>\n\ndouble doit(int\
    \ number1, int number2)\n{\n    return sqrt((double)number1 + number2);\n}\n\n\
    int main(int argc, char *argv[], char *env[])\n{\n    int n1 = 0, n2 = 0, i=0;\n\
    \    n1 = atoi((char *) strtok(argv[1],\",\"));\n    n2 = atoi((char *) strtok(NULL,\"\
    ,\"));\n    printf(\"Content-type:text/html\\n<html>\\n<body>\\n\");\n    for(i=1;i<100;i++)\
    \ printf(\"%f ,\\n\",doit(n1+i,n2));\n    printf(\"</body>\\n</html>\\n\");\n\
    \    return 0;\n}\n```\n\nIn this example we can repeatedly call the function\
    \ \"doit\" that takes two integer arguments and the result of some mathematical\
    \ calculation.\n\n- Compile: gcc func1 chapter3_1.c -lm\n- Copy to cgi-bin: cp\
    \ func1 /home/david/public_html/cgi-bin/func1\n\n(by now you should be maintaining\
    \ a Makefile as you progress, adding targets to compile examples as you go.)\n\
    \n# C Programming in Linux\n\n# Functions, pointers and structures\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_36_0.png)\n\
    \nThe result in a browser looks like this called \"func1:5\".\n\nIn this case\
    \ the arguments to our function are sent as copies and are not modified in the\
    \ function used.\n\nIf we want to modify a variable we would have to send its\
    \ pointer to a function.\n\n# C Programming in Linux\n\nWe send the address of\
    \ the variable 'result' with &result, and in the function we de-reference the\
    \ pointer *result to get the float and change its value, outside its scope inside\
    \ main. This gives identical output to chapter3_1.c.\n\n## 3.2 Library Functions\n\
    \nC contains a number of built-in functions for doing commonly used tasks. So\
    \ far we have used atoi, printf, sizeof, strtok, sqrt. To get full details of\
    \ any built-in library function all we have to do is type example:\n\n- man 3\
    \ atoi\n\nand we will see all this:\n\n# C Programming in Linux\n\n# Functions,\
    \ pointers and structures\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_38_0.png)\n\
    \nWhich pretty-well tells everything you know about this function and how to use\
    \ it and variants of it. Most importantly it tells you header file to include.\n\
    \n## 3.3 A short library function reference\n\nFull details of all the functions\
    \ available can be found at:\nhttp://www.gnu.org/software/libc/manual/\n\n# Common\
    \ Library Functions by Header File:\n\n| Header | Category | Examples |\n| :---\
    \ | :--- | :--- |\n| **math.h** | Trigonometric Functions | cos, sin tan |\n|\
    \ | Exponential, Logarithmic, and Power | exp log pow sqrt |\n| | Other Math Functions\
    \ | ceil floor fmod |\n| **stdio.h** | File Functions | close feof fgetpos fopen\
    \ read freseek |\n| | Formatted I/O Functions | printf scanf |\n| | Character\
    \ I/O Functions | getc fgetc fputc getuts getchar gets putc puts |\n| **stdlib.h**\
    \ | String Functions | atof atoi atoi |\n| | Memory Functions | calloc free malloc\
    \ |\n| | Environment Functions | abort exit getenv system |\n| | Math Functions\
    \ | abs div rand |\n| **string.h** | String Functions | strcat strchr strcmpncmp\
    \ strncpy strnpy strcspn strstr strtok |\n| **time.h** | Time Functions | asctime\
    \ clock difftime time |\n\nThere is no point in learning library functions until\
    \ you find to to do something which then leads you to look for a function or a\
    \ library of functions that has been written for this purpose. You will need to\
    \ understand the function signature – or what the argument list means and how\
    \ to use it and what will be returned by the function or done to variables passed\
    \ as pointers to functions.\n\n## 3.4 Data Structures\n\nSometimes we wish to\
    \ manage data into structures. We can use a struct to define a set. This uses\
    \ an array of player. The definition of the structure does not actually create\
    \ any data, but just sets the formal shape of what we can instantiate. If we make\
    \ a change to the definition we simply have to add code to handle new properties.\n\
    \nWe can see that a struct with additional functions or methods is essentially\
    \ what a class is in Java, and this is also in C++. If you take a look at the\
    \ Apache server development header files you will see a lot of structs for example\
    \ in this fragment of code:\n\nSometimes we wish to manage data into structures.\
    \ We can use a struct to define a set. This uses an array of player. The definition\
    \ of the structure does not actually create any data, but just sets the formal\
    \ shape of what we can instantiate. If we make a change to the definition we simply\
    \ have to add code to handle new properties.\n\nWe can see that a struct with\
    \ additional functions or methods is essentially what a class is in Java, and\
