  mdcn: "\n\n# 练习：\n\n使用 C 库函数创建一个具有以下功能的程序：\n\n- 以写模式打开一个文件\n- 将一个命令行参数写入文件\n- 关闭文件\n\
    - 以只读模式打开文件\n- 读取内容\n- 关闭文件\n- 将这些内容打印到屏幕上\n\n这将让你获得查找信息、寻找合适的库函数以及在线或从书中查找示例的经验。\n\
    \n## 4. 逻辑、循环和流程控制\n\n### 4.1 C 流程控制语法\n\n我们可以使用以下 C 结构来控制程序的执行。\n当我们可以通过计数遍历一个序列或系列时：\n\
    \n```c\nfor( initial value; keep on until ; incremental change )\n    { do this;\
    \ and this; and this; }\n```\n\n当我们在等待某些条件发生改变时：\n\n```c\nwhile( this is true\
    \ )\n    { do this; and this; and this; }\n```\n\n或者如果想想至少执行一次操作后再测试：\n\n```c\n\
    do { \n    do this; and this; and this;\n} while( this is true);\n```\n\n当我们有多于一个选项需要测试时：\n\
    \n```c\nif( this is true )\n    { do this; and this; and this; }\nelse\n    {\
    \ do this; and this; and this; }\n```\n\n当我们有更多选项需要测试时：\n\n```c\nif( this is true\
    \ )\n    { do this; and this; and this; }\nelse if ( this is true )\n    { do\
    \ this; and this; and this; }\nelse\n    { do this; and this; and this; }\n```\n\
    \n当我们根据整数或单字符值有更多选项需要测试时：\n\n```c\nswitch( on an integer or character value )\n\
    {\n    case 0: do this; and this; and this; break;\n    case n: do this; and this;\
    \ and this; break;\n    default: do this; and this; and this;\n}\n```\n\n## 4.2\
    \ 控制发生的情况以及顺序\n\n这部分完全关于 if、那么、以及 else、真与假——即我们表达和控制程序执行的基础知识。这些内容可能是非常枯燥且乏味的。为了让它更于理解，我们将解决一个你将在处理任何复杂的交互式\
    \ Web 开发时需要解决的问题。\n\n我们将构建一些可以使用的东西，以提供类似于 Java servlet 中 `getParameter(\"ITEM1\"\
    )` 方法或 PHP 中 `$_REQUEST['ITEM1']` 函数提供的功能。\n\n在第 1 章中，我们看到环境变量是由 `main` 函数的隐式参数引起的。我们也可以使用库函数\
    \ `getenv()` 来请求任何命名环境变量的值。\n\n```c\n* C Programming in Linux (c) David Haskins\
    \ 2008\n* chapter4_1.c\n\n#include <stdio.h>\n#include <string.h>\n\nint main(int\
    \ argc, char *argv[], char *env[]) {\n    printf(\"Content-type:text/html\\n<html><body\
    \ bgcolor=#23abe2>\\n\");\n    char value[256] = \"\";\n    strncpy(value, (char\
    \ *) getenv(\"QUERY_STRING\"), 255);\n    printf(\"QUERY_STRING :%s<BR>\\n\",\
    \ value);\n    printf(\"<form>\\n\");\n    printf(\"<input type=\\\"TEXT\\\" name=\\\
    \"ITEM1\\\">\\n\");\n    printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM2\\\"\
    >\\n\");\n    printf(\"<input type=\\\"SUBMIT\\\">\\n\");\n    printf(\"</form></body></html>\\\
    n\");\n    return 0;\n}\n```\n\n在这里我们显示 `QUERY_STRING`，它是程序从 HTML 表单中获取的内容，其中包含了所有命名表单元素的\
    \ NAME=VALUE 键对。\n\nHTML 表单默认使用 GET 方法，除非在 action 属性中另有指定，否则它会将所有表单数据传回包含表单的程序或页面。这些数据包含在\
    \ `QUERY_STRING` 中，格式为变量 = 值的对，并由 `&` 字符分隔。\n\n注意在 HTML 中，值是用引号括的，因此为了将这些值嵌入 C\
    \ 字符串中，我们必须使用特殊符号 `\\` 来转义字符，例如 `\"\\\"ITEM1\\\"\"` `。此外，我们还在每段 HTML 输出的末尾使用 `\\\
    n` 或显式的换行符，这样当我们在浏览器中选择“查看源代码”时，得到的是格式合理的文本以便查看，而不是整个页面显示为长长的一行。\n\n在浏览器中调用此程序，我们可以在框中查看并输入一些数据：\n\
    \n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_47_0.png)\n\n在此提交表单后，我们看到：\n\n![](img/7850df81ed1a1b9c43f67da3d9dfcff8_48_0.png)\n\
    \n为了彻底理解 `QUERY_STRING` 并在其中找到特定值，我们需要进行解析，将其拆分成各个组成部分，为此我们需要一些条件逻辑（if、else 等）和循环来计数遍历变量中的字符。编写一个执行此操作的基础函数是理想的，因为你可能需要重复执行此任务，所以有一个可以重复调用的块是有意义的。\n\
    \n在下一个示例中，我们将看到如何解析 `QUERY_STRING` 并在其中找到特定值。我们需要进行解析，将其拆分成各个组成部分，为此我们需要一些条件逻辑（if、else\
    \ 等）和循环来计数遍历变量中的字符。编写一个执行此操作的基础函数是理想的，因为你可能需要重复执行此任务，所以有一个可以重复调用的块是有意义的。\n\n（注：由于原文后续存在大量重复段落，此处已根据要求不再重复输出翻译内容，仅保留核心逻辑翻译）\n\
    \n"
