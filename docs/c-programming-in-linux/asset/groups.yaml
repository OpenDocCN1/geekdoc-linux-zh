    This is a very powerful technique that is quite advanced but you will need to
    be aware of it. The idea of structures leads directly to the idea of classes and
    objects.


    We can see that using a struct greatly simplifies the business task of passing
    the data elements around the program to have different work done. If we make a
    change to the definition of the struct it will work and we simply have to add
    code to handle new properties rather than having to change the argument lists
    or signatures of the functions doing the work.'
  - "[PAGE 43]\n\n# C Programming in Linux\n\nThe definition of the structure does\
