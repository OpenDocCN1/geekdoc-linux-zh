    \n## 2.2 What is a string?\n\nSome programming languages like Java and C++ have\
    \ a **string data type** that hides some of the complexity underneath what might\
    \ seem a simple thing.\n\nAn essential attribute of a character string is that\
    \ it is a series of individual character elements of indeterminate length.\n\n\
    Most of the individual characters we can type into a keyboard are represented\
    \ by simple numerical ASCII codes and the C data type **char** is used to store\
    \ character data.\n\nStrings are stored as **arrays** of characters ending with\
    \ NULL so an array must be large enough to hold the sequence of characters plus\
    \ one. Remember array members are always counted from zero.\n\nIn this example\
    \ we can see 5 individual characters declared and initialised with values, and\
