    1-4:\n    gcc -o hello4 chapter1.c -lc\nchap2: 2-1 2-2\n2-1:\n    gcc -o data1\
    \ chapter2.c -lc\n2-2:\n    gcc -o data2 chapter2.c -lc\nclean:\n    rm hello*\
    \ data* **\n```\n\n编译所有内容输入 make all\n编译 chapter2_1.c 的目标 2-1 输入 make 2-1\n每个\
    \ make 目标后的制表符（tab）对 make 的语法至关重要\n\n代码包中有一个适用于整本书的 Makefile。\n\n## 2.2 什么是字符串？\n\
    \n像 Java 和 C++ 这样的编程语言拥有**字符串数据类型**，它隐藏了看似简单事物底下的某些复杂性。\n\n字符字符串的一个基本属性是它是系列长度不确定的单个字符元素。\n\
    \n我们可以在键盘上输入的大多数单个字符由简单的数值 ASCII 代码表示，C 数据类型 **char** 用于存储字符数据。\n\n字符串以以 NULL\
    \ 结尾的字符**数组**形式存储，因此数组必须足够大以容纳字符序列加上一个字节。记住，数组成员始终从零开始计数。\n\n在这个示例中，我们可以看到 5 个声明并初始化了值的单个字符，以及一个设置为\
    \ \"\" 的空字符数组。\n\n# Linux 下 C 编程\n\n注意区分用于字符周围的单引号 ' 与用于字符字符串周围的双引号 \" 之间的区别。\n\
    \n```c\n/*\n* Linux 下 C 编程 (c) David Haskins 2008\n* chapter2_2.c\n*/\n#include\
    \ <stdio.h>\n\nint main(int argc, char *argv[], char *env[]) {\n    char c1 =\
    \ 'd';\n    char c2 = 'a';\n    char c3 = 'v';\n    char c4 = 'i';\n    char c5\
    \ = 'd';\n    char name[6] = \"david\";\n    printf(\"%c%c%c%c%c\",c1,c2,c3,c4,c5);\n\
    \    printf(\"%s\\n\",name);\n    return 0;\n}\n```\n\n编译命令：gcc -o data2 chapter2_2.c\
    \ -lc\n运行 ./data2 时的程序输出：\n\ndavid\n\n## 2.3 字符串可以“意味着”什么\n\n任何事情——赋予变量的名字及其含义或用途完全取决于观察者的想法。尝试一下\n\
    \n# Linux 下 C 编程\n\n****************************************************\n* Linux\
