    \ shown\ncreating a list of sequences data elements that conform to the definition\
    \ we have made.\n\nYou can possibly see that a struct with additional functions\
    \ or methods is essentially what a class is in\nJava, and this is also in C++.\
    \ Object Oriented languages start here and in fact many early\nsystems described\
