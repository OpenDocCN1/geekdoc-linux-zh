    # C Programming in Linux


    It looks like we are going to have to do some work on this decode_value package
    so as this is work we can expect to do over and again it makes sense to write
    a function that can be reused.


    First off we can put this function into a separate file called decode_value.c
    and create a file for all the functions we may write called e_in_linux.h and compile
    this into a library. In the Make file we can add:


    ```

    SRC_CIL = decode_value.c

    OBJ_CIL = decode_value.o

    #CIL_INCLUDES = -I/usr/include/apache2 -I/usr/include/apache2 -I/usr/include/apr-1

    #CIL_LIBS = -L/usr/lib -lmysqlclient -L/usr/lib -lgd -

    L/home/david/public_html/Ventus/code


    all: lib cil 4-4

    lib_cil:

    gcc -c $(SRC_CIL)

    ar cs c_in_linux.a $(OBJ_CIL)

    $(RM) *o


    4-4:

    gcc -o logic4_3.c c_in_linux.a -lc

    cp logic4 /home/david/public_html/cgi-bin/logic4

    ```


    This looks horrible and complex but all it means this:

    typing "make all" will:


    ```

    compile all *.c files listed in the list OBJ_SRC and into object files *.o

    compile the object files into a library archive called lib_c_in_linux.a

    compile 4-4 using this new archive.

    ```


    This is the model we will use to keep our files as small as possible and the share-ability
    of code at its maximum.


    We can now have a simpler "main" function file, and files for stuff we might want
    to write as call-able functions from anywhere which we do not know about. This
    is organised into a library file (*,a for archive) – these can also be compiled
    as dynamically loadable shared objects ,*so which are much like Windows DLLs.
    This exactly how all Linux software is written and delivered.'
