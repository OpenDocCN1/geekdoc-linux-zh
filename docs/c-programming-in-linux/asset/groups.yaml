    \ 文件夹并：\n\n```\n/usr/sbin/apxs -e -i mod_maker.c\nsudo /etc/init.d/apache2 restart\n\
    ```\n\n## 在 Linux 中 C 编程\n\n## Apache 模块\n\n在浏览器中这样调用它：\n\n```\n#include \"httpd.h\"\
    \n#include \"http_config.h\"\n#include \"http_protocol.h\"\n#include \"ap_config.h\"\
    \n\n/* 示例内容处理器 */\nstatic int labelmaker_handler(request_rec *r)\n{\n    if (strcmp(r->handler,\
    \ \"labelmaker\")) {\n        return DECLINED;\n    }\n    r->content_type = \"\
    text/html\";\n}\n\nif (r->header_only) {\n    ap_puts(\"The sample page from mod_maker.c\\\
    n\", r);\n    return OK;\n}\n\nstatic void labelmaker_register_hooks(apr_pool_t\
    \ *p)\n{\n    ap_hook_handler(labelmaker_handler, NULL, NULL, APR_HOOK_MIDDLE);\n\
    }\n\n/* API hooks 的分发列表 */\nmodule AP_MODULE_DECLARE_DATA labelmaker_module =\
    \ {\n    STANDARD20_MODULE_STUFF,\n    NULL,        /* 创建目录配置结构 */\n    NULL,\
    \        /* 合并目录配置结构 */\n    NULL,        /* 创建服务器配置结构 */\n    NULL,        /*\
    \ 合并服务器配置结构 */\n    NULL,        /* 配置文件命令 */\n    labelmaker_register_hooks /*\
    \ 注册 hooks */\n};\n\n## 7.2 添加某些功能\n\n我们将第 6 章中为图形库的工作作为替换处理器函数（在代码 `Chapter_7.c`\
    \ 中有两个处理器，其中一个被注释掉了）。注意对修改后的 `decode_value` 函数的调用，它使用 `r->args` 指针从 `getenv()`\
    \ 获取 `QUERY_STRING`。此外Apache 处理输出的方式不同——通过调用 `gdImagePtr` 获取图像字节数组的指针，然后由 `ap_write`\
    \ 函数输出数据。我们必须在调用后使用 `gdFree` 释放指针。\n\n```\nstatic int labelmarker_handler(request_rec\
    \ *rec)\n{\n    void *iptr;\n    int sz = 0;\n\n    if (strcmp(r->handler, \"\
    labelmaker\")) {\n        return DECLINED;\n    }\n\n    r->content_type = \"\
    image/gif\";\n    if (r->header_only) {\n        ap_puts(\"The sample page from\
    \ mod_maker.c\\n\", r);\n        return OK;\n    }\n\n    gdImagePtr im_out;\n\
    \    int text=0,background=0,x=0,y=0,size=30,string_rectangle[8];\n    double\
    \ angle=0.0;\n    char value[255] = \"Hello\";\n    char font[256] = \"/usr/share/fonts/truetype/DejaVuSans.ttf\"\
    ;\n    char *err = NULL;\n    im_out = gdImageCreate(x,y);\n    decode_value(r,\"\
    TEXT\",(char*)&value, 255);\n    err=gdImageStringFT(NULL,string_rectangle[0],font,\n\
    \    font_size,angle,0.0,value[6]) + 6;\n    x=string_rectangle[2]-string_rectangle[6]\
    \ + 6;\n    y=string_rectangle[3]-string_rectangle[7] + 6;\n    im_cat = gdImageCreate(x,y);\n\
    \    background=gdColorAllocate(im_out,0,0,0);\n    text=gdColorAllocate(im_out,255,255,255);\n\
    \    x=3-string_rectangle[6];\n    y=3-string_rectangle[7];\n    err = gdImageStringFT(im_out,string_rectangle[0],text,\n\
    \    font_size,angle,x,y,value);\n    iptr = gdImageGifPtr(im_out,&sz);\n    ap_write(iptr,sz,\
    \ r);\n    gdFree(iptr);\n}\n    gdImageDestroy(im_out);\n    return OK;\n}\n\
    ```\n\n"
