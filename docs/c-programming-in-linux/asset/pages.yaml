  md: 'Outside the function in which the data has declared this data is inaccessible
    – this is the *scope* of declaration. If we had declared the main() function would
    be *global* in scope and other functions could access it. C lets you do kind of
    dangerous stuff if you want to, or be careful.


    Generally we keep a close eye on the scope of data, and pass either **read-only
    copies**, or **memory addresses** to our parts of the programs that might need
    to work on it and even change it. These labelled memory addresses are called **pointers**.


    We are using the *printf* family of library functions (**sprintf** for creating
    strings, **fprintf** for writing to files etc) which all use a common **format
    string** argument to specify how the data is to be represented.


    +   - %c character

    - %s string

    - %d integer

    - %f floating point number.


    The remaining series of variables in the arguments are placed in sequence into
    the format string as specified.


    In C it is a good idea to **initialise** any data you declare as the contents
    of the memory allocated for it is not cleared but may contain any old rubbish.


