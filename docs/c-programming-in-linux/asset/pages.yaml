  md: '# C Programming in Linux


    # Data and Memory


    Or if send a parameter of anything at all you will get surprising results:


    ![](img/7850df81ed1a1b9c43f67da3d9dfcff8_29_0.png)


    What we are doing here is **using the string parameter `argv[1]`** as a background
    colour code inside **HTML** body tag. We change the Content-type specification
    to text/html and miraculously now our program is generating HTML content. A language
    being expressed inside another language. Web browsers understand a limited set
    of colors rather can also be defined hexadecimal codes such as #FFFFFF (white)
    #FF0000 (red) #00FFFF (green) #0000FF (blue).


    This exercise is not just a lightweight trick, the idea that one program can generate
    another in another language is very powerful and behind the power of the internet.
    When we generate HTML (or XML anything) from a **common gateway interface program**
    like we are creating **dynamic content** that can be linked to live, changing
    data rather than **static** pre-edited web pages. In most web sites have a mix
    of dynamic and static content, but here we see how this is done at a very simple
    level.


    Throughout this book we use the browser as the preferred interface to our programs
    here we will be generating HTML and binary stream web content purely as a means
    to make immediate the power of our programs. Writing code that you peer at a terminal
    screen is not too impressive, and writing window-type applications is not nearly
    straightforward.


    In most software you may be asked to write is running on the web so we might start
    well with this idea away. Most applications involve **multiple languages** too
    such as CSS, (X)HTML, XML, JavaScript, PHP, JAVA, JSP, ASP, .NET, SQL. If this
    sounds frightening, don''t panic. A knowledge of C will show you that many of
    these languages, which all perform different functions, have a basis of C in their
    syntax.'
