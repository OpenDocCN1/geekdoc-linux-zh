    Close examination of the file index.php will allow you to see where all this happens,
    and to work backward to find where in the ghost.ghost source this PHP code is
    generated. A good idea is to use a highlighter pen on a printout we are embedding
    a language (HTML) inside another language (PHP) which is in turn inside another
    language so very careful use is made of the escape characters \ to express quotation
    marks both single and double where necessary to make it all work. This may seem
    complex – the speedy prototyping that ghost permits it worthwhile to spend time
    customising the C code so the PHP that you want and the database you want come
    out the way you want.'
