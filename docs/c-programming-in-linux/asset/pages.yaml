  md: '# 2. Data and Memory


    # 2.1 Simple data types?


    When we write programs we have to make decisions or assertions about the nature
    of the world as we declare and describe variables to represent the kinds of things
    we want to include in our information processing.


    This process is deeply philosophical; we make **ontological** assertions that
    this or that thing exists and we make **epistemological** assertions when we select
    particular data types or collections of data types to use to describe the attributes
    of these things. Heavy stuff with a great responsibility and not to be lightly
    undertaken.


    As a practical example we might declare something that looks like the beginnings
    of a database record for geography.'
