  md: "The configuration of the server can be a bit fiddly in OpenSuse we have to\
    \ add this to the file\n\n# /etc/apache2/default-server.conf\n\n```\n<Location\
    \ /labelmaker>\n    SetHandler labelmaker\n</Location>\n```\n\nand in /etc/config.sys/apache2\
    \ we add the name of our module labelmaker to long comma,comma-separated list\
    \ in the line starting\n\nAPACHE_MODULES=\"....labelmaker\"\nNow go to the folder\
    \ labelmaker and type:\n\n```\nsudo /usr/sbin/apxs2 -e -i mod_labelmaker.c\nsudo\
    \ /etc/init.d/apache2 restart\n```"
