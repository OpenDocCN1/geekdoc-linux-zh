  md: '# Anatomy of the program:


    The part inside/*** *** is a comment and is not compiled but just for information
    and reference.


    The "#include..." part tells the compiler which system libraries are needed and
    which header files are being referenced by program. In our case "printf" is used
    and is defined in the stdio.h header.


    The "int main(int argc, char *argv[])" part is the start of the actual program.
    This is an entrypoint and most C programs have a main function.


    The "int argc" is an argument to the function "main" which is an integer count
    of the number of character strings passed in "char argv[]" (a list of pointers
    to character strings) that might be passed at the command line when we run it.


    A pointer to something is a name given to a memory address for this kind of data
    type. We can have a pointer to integer: int *iptr, or a floating point number:
    float *ptr. Any list of things is described by [], and if we know exactly how
    big this list is we declare it as [200]. In this case we know that the second
    argument is a list of pointers to character strings.


    Everything else in the curly brackets is the main function and in this case the
    entire program expressed as lines.


    Each line or statement ends with a semi-colon ".


    We have function calls like "printf(...)" which is a call to the standard input
    / output library defined in the header file stdio.h.


    At the end of the program "return 0" ends the program by returning a zero to the
    system.


    Return values are used to indicate the success or status should the program not
    run correctly.


    # 1.2 Hello Program


    Taking this example stage further, we examine the start of the program at the
    declaration of the entry point function: int main(int argc, char *argv[])


    In plain English this means:'
