  md: "# C Programming in Linux\n\n# The Ghost project\n\nHere is the part of the\
    \ PHP file index.php which generates the edit or delete rows. The static HTML\
    \ is highlighted and the other parts are inserted by MySQL PHP function calls.\n\
    \n```\n$result = mysql_query(\"select * from testwebsite\");\nwhile($row = mysql_fetch_array($result))\n\
    {\n    echo \"<tr>\";\n    echo \"<form><input type='hidden' name='MODE' value='UPDATE'>\"\
    ;\n    for($i=0; $i<mysql_num_fields($result); $i++) {\n        if($i==0) {\n\
    \            echo \"<td><input type='hidden' name='\" .\n                mysql_field_name($result,$i)\
    \ . \" value='\" .\n                \">\" .\n                $row[mysql_field_name($result,$i)]\
    \ .\n                \"</td>\";\n        } else {\n            echo \"<td><input\
    \ type='text' name='\" .\n                mysql_field_name($result,$i) .\n   \
    \             \" value='\" .\n                \">\" .\n                $row[mysql_field_name($result,$i)]\
    \ .\n                \"</td>\";\n        }\n    }\n    echo \"<td><input type='submit'\
    \ value='edit'></form>\";\n    echo \"<a href='?ID=\" .\n        \"&MYSQL_FIELD_name=\"\
    \ . $result[0] . \">delete</a>\";\n    echo \"<td>delete</td>\";\n    echo \"\
    </tr>\";\n}\n\nmysql_free_result($result);\nmysql_close($con);\n```\n\nAs you\
    \ can see a deal of tedious and repetitive works has been automated. You can move\
    \ on by modifying the PHP code or go deeper to customise the C program which generates\
    \ all of it.\n\nI personally use ghost frequently to save time on-building and\
    \ this is why I wrote it. I got bored making mistakes writing virtually identical\
    \ code to decode HTML forms and populate or update databases.\n\n83"
