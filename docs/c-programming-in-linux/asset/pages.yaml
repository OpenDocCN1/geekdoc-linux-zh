  md: '# About the author, David Haskins


    I was born in 1950 in Chelsea, London, but grew up in New Zealand returning to
    England in 1966. I have worked in the computer industry since 1975 after a couple
    of years as a professional drummer.


    My first experience was five years as a mainframe engineer for Sperry Unic (now
    Unisys) followed by 14 years as an analyst programmer with British Telecom in
    London.


    While engaged in a complex task of converting large quantities of geographical
    data (map coordinate references) I discovered the joys of C – speed and efficiency.
    That was in 1985 and I have been a fan of C ever since.


    Since 1994 I have been a senior lecturer at the Faculty of Computing, Information
    Systems and Mathematics at Kingston University, London. This is a mostly technically
    university that evolved from a former poly college with a long tradition of aeronautical
    engineering.


    I am engaged in teaching many computer languages and internet systems design to
    a large and multicultural student body.


    Most of my academic research and commercial consultancy has been involved with
    spatial systems design and the large data volumes and necessary processing efficiency
    concerns has led me to concentrate on C and C++. My teaching web site is www.abiubi.org
    which shows some of its material.


    A keen Open Systems enthusiast, I have exclusively centred my teaching on the
    Linux platform since 2002 and Kingston University is well advant in delivering
    dual boot facilities for all its student labs.


    ![](img/7850df81ed1a1b9c43f67da3d9dfcff8_6_0.png)


    I am a keen swimmer and in 2009 completed the annual Lorne Pier-to-Pub race in
    Victoria, Australia which is the largest open-sea swimming race in the world where
    4,500 people of all ages swim each January as the sharp-spotting planes fly overhead.


    When not teaching I am a keen vegetable gardener and amateur musician, playing
    in jazz groups and in Scottish bagpipe bands. I play the drums, the great highland
    bagpipe, the clarinet, the guitar and the piano.'
