  md: '# 3. Functions, pointers and structures


    # 3.1 Functions


    The entry point into all our programs is called main() and this is a function,
    or a piece of code that does something, usually returning some value. We structure
    programs into functions and also to stop them become unreadable blocks of code
    that cannot be seen in one screen or page to ensure that we do not have repeated
    identical chunks of code all over the place. We can call library functions like
    printf or strtok which are part of the C language and we can call our own or other
    peoples functions and libraries of functions. We have to ensure that the appropriate
    header file exists and can be read by the preprocessor or compiled library exists
    too and is accessible.


    As we learned before, the scope of data is restricted to the function in which
    is declared, so we use pointers to data and blocks of data to pass to functions
    that we wish to do some work on our data. We have seen already that strings are
    handled as pointers to arrays of single characters terminated with a NULL character.'
  merge: -1
