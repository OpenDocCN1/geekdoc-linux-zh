- img_proc: true
  md: '# There Is Always a Bottleneck


    One to keep in mind is that there is always a bottleneck in the system. If there
    wasn''t, the work of the system would be done as soon as it was initiated. Whether
    it''s the CPU, the network, the drive interface, memory fragmentation, or various
    combinations among them, some subsystem undoubtedly will be slowing the overall
    speed of the system. All of these have their limitations and applicability in
    your situation, so the best you can do is find a balance among them. If you can
    find a point at which the system is operating as fast as possible with the given
    hardware and software allotments, you can consider the problem of tuning to be
    solved.


    # User Expectations


    In the end, your tuning success relies on what the users say about the system.
    As long as they are reporting performance issues, the tuning process goes on.
    But it is important to consider that some user complaints are not resolvable,
    the hardware or the software architecture in place. As development and rollout
    occurs, users tend to want more from the system as they see the inherent it. But
    there comes a point at which expectations exceed reality. Hopefully the system
    was constructed with future growth in mind, but that can cover all the bases.
    To make room for increased demands, new software needs to be written or a major
    infrastructure upgrade is in order.


    As an administrator or an architect, it is important to know when this point has
    been reached and when further tuning efforts will not likely introduce the needed
    performance gains. Likewise, it is important to realize when the system is being
    used improperly—such as when inefficient database queries are being used, which
    can have disastrous effects on the system as a whole. Finding these abuses often
    can have a greater impact on overall utilization than tuning operation.


    # Performance Agreements


    Depending on your system, you might be bound to bound by different types of performance
    agreements. Chapter 7, "Network Performance," covers quality-of-service agreements
    that generally apply to network service levels, but this is only one specific
    type of agreement. If you are a provider, you will be bound to different contractual
    obligations, whether they are network coverage guarantees, system uptimes, processing
    rates, or something else. If you are the receiver of these services, you might
    be promised certain transfer rates at given times, certain data received within
    a given turnaround time, and so on.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Apparent and Nonapparent Bottlenecks

    CHAPTER 5


    These agreements could have a significant impact on your system''s bottom line.
    If you are promised data within a certain time range and promise analysis to your
    customers within a range beyond that, a bad link further could put you in a bad
    situation very quickly. A performance agreement to cover liability with everyone
    in these situations is highly recommended because your customers have essentially
    hired you with a contract, which can be viewed as its own performance agreement.
    Liability also must be defined between your systems and the ones on which they
    depend. If you don''t get the data ready by the time specified in your contract,
    the data might be useless. The same situation might occur if your system experiences
    an unusual load, causing normal users to deal with unreasonable delays in their
    data.


    Either way, safeguards need to be in place to cover these agreements, with insurance
    to cover the worst case. This could include redundancy of network links, servers,
    application failures, and duplication of the data involved. The system needs to
    be capable of suffering the most imaginable tragedy and still maintaining a quality-of-service
    level; without that failure, your business could go down with that server or network
    uplink.


    # Tuning CPU Bottlenecks


    Depending on your architecture, you might have a CPU-bound load. In this case,
    no matter how much you tweak the systems, no noticeable gain will occur until
    you fix the CPU usage or throw more hardware at the problem.


    # Hardware Solutions


    Chances of getting around CPU bottlenecks will depend on your application. For
    starters, let''s assume your application is running on a single-processor machine.
    By monitoring system usage over time, you find that the CPU specifically being
    overworked in comparison to the rest of the system. You have a couple of options.
    One should be fairly obvious: Get a faster processor. This will reduce the strain
    that your application is placing on the system.


    What if you are already using the fastest CPU you can get, and there''s still
    a bottleneck? In this case, you probably need an SMP machine. Depending on the
    application, different numbers of CPUs might be appropriate. Another factor is
    whether your application will benefit from this hardware. If it works by forking
    into separate processes, it can benefit. A preferred method is a threading model
    that would allow it to scale its computations across the CPU present, but this
    could require more in-depth knowledge of your application than you have.


    Check with your vendor about what benefits would be gained by going with an SMP
    machine. Linux can scale to many CPUs, depending on the architecture. On 32-bit
    systems, it can handle 32 processors, it can manage 64 on a 64-bit architecture.
    But gains might not be as


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_103_0.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Peformance Monitoring Techniques


    PART III


    apparent as you approach this limit. In reality, on a 32-bit system, Linux would
    scale scale fairly cleanly to 2-, 4-, and 8-CPU systems, with some performance
    drop-off on 16 CPUs and above. Also keep in mind that by the time you hit these
    limits, there is a high probability that the system is overloading other subsystems,
    such as the memory bus, and that your bottleneck has shifted elsewhere. If your
    requirements have met, that''s all well and good, but you might have just opened
    a performance-tuning problem in another area.


    We discussed briefly in Chapter 2, "Aspects of Performance Tuning," but some grounding
    of this knowledge is probably in order. Consider the case in which your application
    is performing many calculations, most of which can be independently from each
    other. If your application is written in a threaded manner, having multiple CPUs
    will allow the kernel scheduler to run some computations on other CPUs, balancing
    the load nicely. This is true only if the application was written with advantage
    of POSIX threads, though. If it was written with user-space threads, it cannot
    take advantage of the other CPUs, except by virtue of the fact that the system
    can use the extra hardware for general work that it needs to do, as handling interactive
    logs and disk interaction.


    If your load is high enough, you might be stretching the capabilities of the architecture.
    The Intel architecture has been upgraded constantly the years, but it has its
    limits. Some applications might be better suited to another architecture, such
    as Compaq''s Alpha processor, which is a 64-bit architecture known for its speed.
    Many scientific clustering systems have been built around this architecture for
    its capabilities in this area. This is just one example, of course—Linux has been
    ported to many other architectures.


    Another architecture that might be of interest is Non-Uniform Memory Access (NUMA).
    In this system, CPU nodes maintain local memory, and the system tries to keep
    the local data in local memory bank because it is more expensive to coordinate
    access to memory on other nodes in the system. Although this is generally assumed
    to be a memory bandwidth, it helps in CPU scalability because the local node is
    free to fully utilize the CPUs present. SGI has contributed to Linux''s support
    for the NUMA model, although this is not a very common option. Rumors it that
    various chipmakers are moving towards NUMA architecture for future systems, but
    the effects of this research remain to be seen.


    # Software Solutions


    Hardware problems are tough to work around because you are generally locked into
    your system''s physical architecture. You might be running the absolute latest
    in hardware, but it might not be enough. In this case, you need to look at exactly
    what software you are running and how it is configured. Although this requires
    extensive knowledge of your problem domain (which you should already have), solutions
    are much cheaper and easier to deploy on the software-side than in hardware.'
