  md: '# Tuning NFS


    Chapter 2 discussed options concerning NFS performance. The size and size parameters
    are the best way to directly affect how your NFS server behaves. Some people have
    found 4096 to be a good value to use when sharing between Linux boxes, although
    that might change in your environment, depending on the types of network cards
    you use. Generally, dealing with other implementations of NFS, as when mounts
    on a Solaris machine, it takes more testing to get these values right for each
    NFS implementation.


    A few options can go beyond the previous example. For instance, One is the number
    of NFS demands that you run on your server. The default number is eight, mainly
    because that is simply what it has always been. If you are using NFS servers,
    you might need to raise that number. Having more servers available will help serve
    large numbers of requests efficiently. This is because there are more processes
    that might be available to handle a request, rather than blocking and waiting
    for an already busy process to finish. Keep in mind that the number of processes
    shouldn''t be too high because it will outstrip the number of requests, and only
    be defined in your distribution''s NFS startup, something like the following:


    ```

    daemon rpc.nfsd $RPCNFSDCOUNT

    ```


    Packet sizing can also affect your performance if you are using NFS over UDP.
    TCP should autodiscover the correct packet size for the network, but UDP will
    be used to find the base MTU over a network path, if there is any doubt.(Tracepath
    generally isnt installed by default, check with your vendor for a package including
    it.) If you are using on a local network and there are no routers involved, this
    likely isn''t a problem.


    > Tip


    For more information, visit In high-volume situations, you might need to make
    some changes to kernel resources as affect NFS performance. One is the input queue,
    which buffers requests until they can be handled. If you have a large number of
    daemons running, each instance will be only a small portion of the overall input
    queue to use for its client''s requests. To fix this, use the following commands:


    ```

    # echo 262144 > /proc/sys/net/core/rmem_default

    # echo 262144 > /proc/sys/net/core/rmem_max

    (start/restart your nfs server)

    # echo 65536 > /proc/sys/net/core/rmem_default

    # echo 65536 > /proc/sys/net/core/rmem_max

    ```'
