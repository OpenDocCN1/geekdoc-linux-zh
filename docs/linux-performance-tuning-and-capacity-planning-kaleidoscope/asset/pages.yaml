    The free command rapidly snags inags about the state of memory on your Linux system.
    The syntax for free is pretty straightforward:


    ```

    $ free

    ```


    The following is an example of free''s output:


    | total | used | free | shared | buffers | cached |

    | --- | --- | --- | --- | --- | --- |

    | Mem: | 1036152 | 1033560 | 2592 | 8596 | 84488 | 932080 |

    | + buffers/cache: | | 16632 | 1019520 | | |

    | Swap: | 265064 | 380 | 264684 | | |


    The first line of output shows the physical memory, and the last line shows similar
    information about swap. Table 3.9 explains the output of free.


    # TABLE 3.9 free Command Output Fields


    | Field | Description |

    | --- | --- |

    | total | Total amount of user available memory, excluding the kernel memory.
    (Don''t be alarmed when this is lower than the memory on the machine.) |

    | used | Total amount of used memory. |

    | free | Total amount of memory that is free. |

    | shared | Total amount of shared memory that is in use. |

    | buffers | Current size of the disk buffer cache. |

    | cached | Amount of memory that has been cached off disk. |


    An analysis of the sample output shows that this system seems to be healthy. Of
    course, this is only one measurement. What if you want to watch the memory usage
    over time? The free command provides an option to do that: the -s option The -s
    activates polling at a specified interval. The following is an example:


    ```

    $ jfink@kerry jfink$ free -s 60

    total used free shared buffers cached

    Mem: 257584 65244 192340 12132 40064 4576

    +- buffers/cache: 26064 236980

    Swap: 1028120 0

