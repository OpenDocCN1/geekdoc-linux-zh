  md: '# Performance Monitoring Techniques

    PART III


    Also built in is the idea of network transparency, so you can run the server on
    one machine in one language, such as C, and the client on another machine in another
    language, as Java. CORBA will handle all the translations in the background, allowing
    the developer to work on the problem and not have to worry about where the server
    is running or what protocol to use to reach it. (This is only a small subset of
    CORBA does—refer to the GNOME project documentation or a CORBA book for more details.)


    GNOME uses this to cleanly define system components, by other reasons. But the
    average GNOME desktop user is running code solely on his machine: At the moment,
    at least, it is rare for someone to be using components that are served off remote
    machines. The problem is that even though CORBA implementations have become much
    faster over the years, CORBA still be slower than an application that is simply
    linking to a shared library. Inherent in CORBA is the process of talking server-bound
    calls, preparing the parameters for network transfer (marshalling), talking to
    the remote object to make the call, reconstructing the passed values on the other
    side (demarshall), and optionally returning data the same way. No matter how fast
    you write your code, this process will be slower than a direct hop to a function
    resident in your process''s memory space as result of the linking process.


    So, to get a speed advantage in the common case, the designers made a modification
    to ORBit, which is the CORBA implementation that GNOME uses. When you make a CORBA
    call, ORBit first tries to make the call via a shared library as a normal operation
    would, and then it resorts to the CORBA transport, if it needs to. For the average
    case, the “short circuit” to a normal linking saves a lot of time, both for the
    machine and for the user. This results in a responsive desktop system.


    Does this sound complicated to you? It should—this is not as simple as looking
    at your system and playing with a configuration file. But in the end, it results
    in a high performance gain, without the system might be usable for most people.
    This is a very good example of making sure that you use every bit of technology
    available—and how sometimes intelligent use of this knowledge is what makes the
    system work.


