- img_proc: true
  md: '# Capacity Planning


    # PART V


    quick solution might be to upgrade the link between the sites. As a short-term
    solution, this might be valid. Rather than just double the speed of the leased
    line, it could be more beneficial to take a step back and ask some questions about
    what has changed.


    First of all, compare how the system works now to how it was specified in the
    original documents. If the system was to be equally balanced at both sites in
    the original planning specifications but now business practice has moved most
    of the activity to one end of the line, it makes sense to change the architecture
    to reflect this. In this case, stopping the replication completely might be the
    solution. You might need to have the users at the other end of the leased line
    query a single server at the main office. The repercussions of this could create
    different areas and even require some retraining. However, you''ll end up with
    a more centralized database-management platform and better utilization of the
    leased line—and this will make your users happy.


    Making the effort to realign your architecture might take time, but your system
    is probably better off in terms of growth potential. Without replication happening
    over the leased line, you don''t have nearly the same bandwidth retrictions, and
    the centralized database has much more potential to grow as a result of this.
    But you can''t expect to be able to make these adjustments overnight and delay
    the next day. There needs to be a process of stepping back, looking at the problem
    as a whole, and determining how it can be solved avoiding any other capacity problems
    hidden in some of the other solutions. Depending on the problem, there could be
    a large number of solutions—some of which need to be prototyped to determine their
    effectiveness. You could feel pressure to roll something quickly, but time needs
    to be spent making sure you''re taking the right path. When your solution saves
    three-months of network management down the line, or saves several million dollars
    in overhead over the system''s lifespan because of correct resource planning,
    you will be comfortable with the knowledge that you didn''t just make a bad decision.


    # Having a Global View of Requirements


    As you have guessed, a full view of your requirements is absolutely necessary.
    Without requirements of how it will work within the larger whole, all of your
    work will most likely be fruitless. In the case of a processing cluster, you might
    have specified enough hardware, configured your software, and that it suited your
    needs. As it works as a component of a larger system, however, your capabilities
    will be woefully inadequate. Knowing what you must build at a local and global
    level, you can get more detail and the system can be constructed more intelligently,
    saving trouble down the road. Otherwise, as time goes on and you learn more of
    the global view, holes will begin to appear in the system''s capacity. You can
    avoid this by knowing all scopes up-front.'
