  md: '# Performance Tuning Tools


    PART II


    Performance monitoring and tuning are not the easiest of tasks. Both require a
    large toolbox and the expertise to understand exactly what many of those tools
    are conveying. Chapter 3, “Popular Unix Performance-Monitoring Tools for Linux,”
    discussed how to interpret generic tools for Unix operating systems.


    Coupled with the normal complexities of understanding generic tools, operating
    systems have their own eccentricities or differences. All Unix or Unix-like operating
    systems have their own differences. In some cases these differences are seen only
    in system administration commands; in other cases, the performance analyst faces
    a myriad of differences in the underlying subsystems and architecture.


    Because of these underlying differences among operating systems and even revisions
    over those systems, performance-monitoring tools must be tailored to the OS. Many
    tools (generic tools) are portable or can be emulated easily for Linux (vmstat
    is one example). Not all tools are easily ported, though, and sometimes it is
    easier to design a tool specifically for a particular operating system.


    The Linux kernel has inspired a great deal of software writers to write tools
    just for the Linux kernel and subsystems. This is partly due to the efforts of
    ibiblio.org (formerly metalab, which was formerly synes). Authors can write their
    tools, package them, and upload them to the ibiblio.org FTP server for the rest
    of the Linux world to use at no cost.


    This chapter examines tools designed to be used specifically for Linux, as well
    as some tools that were originally used for Linux and have been ported to other
    Unix-like and Unix operating systems.


    # sysstat for Linux Distribution


    In 1999, a bright software writer named Sebastian Godard wrote a set of utilities
    for Linux sysstat. In sysstat the entire collection of tools includes mpstat,
    iostat, sar, isag, and sa tools. These tools exist on other systems, but Godard
    wrote versions of them for Linux. This section looks at iostat and mpstat.


    > The sysstat package can be downloaded in a variety of formats from ftp://ftp.ibiblio.org/pub/Linux/system/status/,
    or from the sysstat Web site at http://perso.wanadoo.fr/sebastian.godard/.'
  merge: -1
  pgno: 86
