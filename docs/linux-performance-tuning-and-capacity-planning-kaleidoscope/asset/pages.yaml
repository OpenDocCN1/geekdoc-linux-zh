  md: '# Tuning and Performance Mechanics


    # PART IV


    +   - **threads-max**—This is the maximum number of POSIX threads that the system
    can handle. The default value should be adequate for most configurations.

    - **msg*** and **shm***—These deserve special attention. Many books, especially
    those on configuring Oracle, have said that to raise the SHMAX value to a reasonable
    level for your database, you may need to modify the value hard-coded in the source,
    recompile the kernel, and reboot. This is absolutely false and it applies only
    to commercial Unixes such as Solaris need modification of a boot file to configure
    maximum values for SysV work. Most of these values are modifiable directly through
    the /proc interface. For example, the SHMAX for your system should be as large
    as the SGA plus other pools under Oracle. This doesn''t have to spend time splicing
    datasets across multiple shared segments. To raise the SHMAX, just echo the value
    that you need in bytes to the file in /proc, and the kernel instantly allows segments
    up to that size. Under extremely load, couple values might need to be raised in
    the source, but for all the largest databases, the values are fine and any dynamic
    parameters can be changed through /proc.


    # Network Manipulation


    The realm of network tuning is outside the scope of this chapter. But, if you
    know what modification you want to make to the kernel''s network stack behavior,
    chances are good that you can make the change through the /proc interface. Depending
    on the physical network hardware you are using and the transport protocols, there
    might be different entries under /proc/sys/net, but most users will at least see
    an entry for IPv4. To give an idea of what can be done with the network here,
    some examples with IP are shown. However, it would take a whole chapter or book
    to cover all the possible repercussions of changing parameters.


    Depending on load, you might need to raise the keepalive time for sockets. If
    there is a processing delay, connected sockets might timeout waiting for connection.
    Echoing a larger value to tcp_keepalive_time could resolve the issue. Likewise,
    you might want to alter the parameters dealing with IP fragmentation. For nearly
    all tasks, though, the kernel''s behavior is more than sufficient for handling
    the load. If you are convinced that you need to make IP stack modifications, make
    sure that you completely understand the underlying technology and implications;
    otherwise, you''re chasing a false lead on a problem.


    It is also worth noting that there are other parameters here, although not relevant
    to tuning, might help in other configuration issues. IP forwarding is present
    here, along with settings for the maximum number of SYN backlogs, which could
    come into play your machine is suffering performance loss because of a network
    attack.'
