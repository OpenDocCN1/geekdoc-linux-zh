  md: '# Popular Unix Performance-Monitoring Tools for Linux CHAPTER 3


    As you can see, there is a slightly higher time lapse, on average.


    ping has a number of useful options. Table 3.10 lists some of them with example
    usage datas:


    # Table 3.10 ping Options


    +   - c This option means ping will ping a node only c times. This is especially
    useful for noninteractive scripts or if you are not interested in watching ping
    for more than a quick test to determine whether it is alive.


    +   - f The flood option sends requests as fast as you are pinging from can. This
    is a good way to measure how well a host can send them. As mentioned in a previous
    example, it''s also an easy way to load down a system for testing.


    +   - r This option bypasses routing tables and helps if a new node is on the
    network but the system you are pinging from is not aware of or is not in the same
    subnet.


    +   - s This option can modify the packet size and is useful for seeing whether
    the node that is being pinged has issues with the size of packets sent to it from
    other nodes.


    # traceroute


    The traceroute utility is invaluable for discovering where a problem on a network
    might be located. It is also of great use in ensuring that your host is talking
    to the network just fine and that any problems might lie elsewhere. On this particular
    network, I show two traceroutes, one to a host that is local to the network and
    one to a remote host on a network in another city. The difference between them
    is astounding.


    Here''s the local traceroute:


    ```

    $ traceroute

    troute to strider.diverge.org (192.168.1.1), 64 hops max, 40 byte packets

    1 strider.diverge.org (192.168.1.1) 0.547 ms 0.469 ms 3.383 ms

    $

    ```


    And here''s the remote traceroute:


    ```

    $ traceroute www.diverge.org

    troute to www.diverge.org (192.168.2.2), 64 hops max, 40 byte packets

    1 strider.diverge.org (192.168.1.1) 7.791 ms 7.182 ms 6.457 ms

