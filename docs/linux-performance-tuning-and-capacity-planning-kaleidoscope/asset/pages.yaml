  md: '# Verify the Server Configuration File


    Making sure that the configuration file, /etc/X11/XF86Config on many Linux systems
    running XFree86 4.x, correctly describes the host system''s hardware configuration
    is another step to take. XFree86 servers do a good job of detecting most hardware,
    but values in the configuration file override defaults. Thus, if the values are
    wrong, the server''s performance suffers. Pay particular attention to the Device
    section, making sure that the driver it loads (using the Driver keyword) corresponds
    to the graphics chipset. If it is present, ensure that the VideoRAM directive
    correctly states the amount of RAM (in kilobytes) on the card.


    Among similar lines browse the server''s log file, open in /var/log, looking for
    signs of misconfiguration. Any entry in the log prefixed with (EE) denotes an
    error that should be investigated and solved, whether it affects performance or
    not. For example, the following entry from the server log indicates that one of
    ATI''s built-in video modes cannot be used:


    +   * (WW) ATI(0): Default mode "1792x1344" deleted (insufficient memory for mode)


    Discrepancies between detected information, prefixed in the log with (--), and
    actual values, such as the graphics chipset, the amount of RAM, or the keyboard
    or mouse type, should be corrected.


    # Decrease Color Depth or Display Resolution


    The higher you set the server''s color depth (that is, the number of bytes used
    to color a pixel on the screen), the more memory, CPU cycles, and the time the
    graphics card need to refresh the screen. Accordingly, the server and graphics
    card have less memory and CPU cycles for graphics and window-management operations.
    The same applies to display resolution, the number of pixels displayed on the
    screen.


    The memory requirements for a given combination of color depth and display resolution
    is easy to calculate. Simply multiply the number of bytes required to color a
    single dot on the screen. Then dividing the result by 1024 to obtain the value
    in kilobytes rather than bytes. The basic formula is this:


    > (Hres × Vres × Bytes) / 1024 = Memory in Kilobytes


    Keep in mind that 24 bits per pixel (bpp) equates to 3 bytes per pixel, 16bpp
    equates to 2 bytes, and 8bpp equates to 1 byte. Also, there are 1024 bytes in
    a kilobyte, not 1000, as many people erroneously believe. So, for a resolution
    of 1024 × 768 at 24bpp, the calculation would be this:


    (1024 × 768 × 3) / 1024 = 2304KB'
