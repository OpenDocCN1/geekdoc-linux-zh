  md: '# Aspects of Performance TuningnCHAPTER 2


    Here''s an example: You need to make sure that the buffer cache is used correctly.
    The kernel allows you to play with the buffer cache via the /proc interface. For
    nearly all uses, the default kernel configuration should be sufficient, as reflected
    by this:


    ```

    # cat /proc/sys/vm/bdflush

    30 64 256 500 3000 60 0 0

    #

    ```


    These values correspond to the buffer cache data within the kernel. The first
    number, 30, represents the percentage of the cache that needs to be dirty before
    the cache is flushed. You can update this by echoing new values to it. Assume
    that you want to try raising the percentage to 100 before a flush would have:


    # 2

    ASPECTS OF PERFORMANCE TUNING


    ```

    # echo 100 64 64 256 500 3000 20 0 0 > /proc/sys/vm/bdflush

    ```


    As you can see, you have done two things. First, we have set the percentage to
    100, which effectively disables the buffer cache. This might help performance
    because it will use more of the cache before incurring disk overhead. If you have
    done something else the same time—you set the third-from-last number to 20 rather
    than 60. This corresponds to the number of seconds between flushes of the superblock.
    On one hand you probably increased performance by raising your usage percentage,
    you''ve probably hurt performance by forcing more flushes due to timeouts. Have
    you solved the original problem? No one knows.


    Note that these values are documented in /usr/src/linux/Documentation/sysctl/vm.txt.
    Also, here is a set of values that some people have found to be beneficial for
    increasing performance in relation to the buffer cache:


    ```

    # echo 100 5000 640 2560 15800 5000 1884 2 >/proc/sys/vm/bdflush

    ```


    Compare these values to what you need, and check with the documentation for each
    field to see if it might the right combination for you.


    # Look for Common Causes


    This might sound like common sense, but when you are facing a bottleneck, for
    common causes. Take the time to step back and ask yourself what all the problems
    are. If they all seem to be related to drive I/O, check the storage area. If you
    have the drives housed in a SAN and one of the raids has corrupted itself and
    is trying to rebuild, this could be a noticeable performance degradation until
    the recovery is complete. Try to dissociate yourself from the problem directly
    and focus on the possible causes. Many hours have been lost so frustrated with
    the problem that the solution was completely overlooked.'
