  md: '# Introduction and Overview


    # PART I


    There are other ways to alter the linking process, but this covers most of the
    common operations. Refer to a guide on C programming under Unix for more operations
    you can use with the linking process.


    This might seem like a fairly complicated section that you, as a user or administrator,
    shouldn''t have to deal with directly. This is true, although it does help to
    get an understanding of how all fits together. Simply put, you''ve got binaries
    that are executed via a set of system calls, which, in most cases, depend on external
    libraries. Through a couple of optional linking mechanisms, the linking process
    links these libraries (from the disk or shared memory) with the binary into a
    usable executable. The resulting process is executed by the kernel based on various
    priority levels and scheduling rules determined by the process itself and other
    work happening on the system. This is enough for most users to understand, although
    the minor details can come handy occasionally. Next, you''ll look at threading
    models and how they affect the process mechanisms examined.


    # Process and Thread Management


    Processes are heavy, particularly in terms of memory usage, and the work involved
    in switching them between the kernel is significant. In addition, in any system
    that requires a decent amount of work, there needs to be some interaction among
    components of the system. This can be done with processes, but it takes some effort.
    Processes also tend to block single operations (such as disk access or network
    waits) for a large portion of their time. It would be useful to allow other work
    to be done while some part of the system is waiting on a resource.


    Enter threads. Threads share the same space for resources, but each has a different
    path of execution. Among the the benefits of threads, sharing data becomes much
    simpler (although not foolproof). Memory requirements are also lighter, because
    than having a hundred processes running along, you can get away with a single
    process that is executing multiple paths of execution internally. Coordinating
    different operations becomes easier because each thread can easily access mutex
    variables controlling what gets to do during operation and when. If multiple processes
    were doing the work, both processes would have to maintain separate instances
    of the data or work through a shared memory system to coordinate motions.


    Linux allows a couple methods of handling threads. Using POSIX threads is one
    way, and this method generally is preferred because POSIX threads are considered
    portable to almost any modern Unix system. Under this scheme, threads created
    by your process are handled by the'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Aspects of Performance Tuning

    CHAPTER 2


    kernel, through the linux-threads component of glibc, which should be part of
    your distribution. This way, the user doesn''t have to worry about scheduling
    at all. The kernel treats running threads as lightweight processes and schedules
    them as if they were normal running processes. (From a shell, you''ll be able
    to see the individual threads as normal processes.) Internally, the kernel knows
    that these threads, not processes, so it doesn''t replicate all the data that
    normally be duplicated if the thread was a full-fledged process. The kernel ends
    up with large savings in memory overhead, compared to the full process model.


    The other method is to use user-space threads, implemented by GNU pth. This API
    looks virtually the same as POSIX threads for most operations, but the threading
    is done entirely within the scope of the single parent process. Within the program,
    the scheduling systemrates all the threads on behalf of the process. The kernel
    never has idea that multiple threads are running within the program, and it schedules
    them as a normal job.


    User-space threads are generally not the first method people go with—POSIX is
    much more portable and scalable. If you know, that data is likely to reside on
    one CPU''s hardware cache, user-space threads provides a nice way of ensuring
    that your process will stay on that CPU because the scheduler will learn to run
    on another CPU that might need data on the local hardware cache. User-space thread
    swapping is lighter than kernel-scheduling, so speed gains can be achieved. It''s
    a matter of choosing the right tool for the job at hand.


    Another difference between the two systems is that only POSIX threads can scale
    to SMP systems. Because user-space threads reside within the space of a single
    program, they cannot use multiple CPUs at the same time. On single-processor systems,
    they can give better results, but on a four-way system, the most they can use
    is all of one processor.POSIX threads, on the other hand, are scheduled by the
    kernel and, because the kernel knows to schedule across CPUs, can use all CPUs
    at the time, with more scheduling overhead. Taking these factors into account
    when designing a system can have a large impact on how the system behaves in the
    field. In general, POSIX threads are the better choice for most operations.


