  md: '# Capacity Planning

    PART V


    In the end, the software drives the need for hardware. Although you can judge
    hardware needs based on what kind of hardware you are using today, this might
    not give you the insight into handling the upcoming advances on the software side.
    You don''t want to be blindsided six months after deployment with a software requirement
    for which you didn''t account. The lesson here is that you should be prepared
    in all aspects of the deployed system.


    # Actual Versus Potential needs


    In the course of performing capacity planning, it is assumed that planning is
    done to specify the system while taking into account current plans and future
    growth potential. Without this process, it can hardly be called capacity planning.
    Another angle needs to be considered well: Does the current capacity plan take
    into account potential needs in addition to what has been determined as actual
    growth rates?


    This almost sounds like the same question, and it can be confusing at first. Let''s
    step back and take a closer look at it make sure that everything is perfectly
    clear. Assume that you are tasked with capacity planning for a certain system.
    As mentioned earlier, various factors must be taken into consideration, including
    previous usage statistics, current needs, and future growth needs. Based on the
    numbers, you might plan on a system that validly assumes a growth potential of,
    say, 10% per year in terms of bandwidth usage, 23% growth in the SAN architecture,
    and modest growth in management overhead to compensate for increased usage.


    As specified, the system should sustain these growth rates over a period of five
    years, which point the system components should be reassessed according to advances
    in various technology. At this point, new technology can be rolled into place
    to extend the system, most likely at a lower cost than it would take to outfit
    everything for 10 years. New software can be injected into the process flow to
    allow better use of the system. This would be the process of finding the actual
    needs of the system, as determined by the capacity assessment. The final result
    takes into account what is perceived to be the actual growth of the system. This
    act of determining actual needs is one aspect of the capacity-planning process.


    Now let''s look at the other side of the assessment process. This is looking for
    the potential growth of the system. Although a 23% annual growth rate in sight
    might seem valid for actual growth, it could be beneficial to allow other factors
    involving potential growth to come into play. For most situations, this requires
    heavy interaction with the company''s group of people responsible for business
    development. These minds most likely be involved in looking for ways to grow the
    business, so their input about the business development is going very important.
    If the current plan is to merge an existing product with your system or apply
    your system to a different market, separate capacity planning must be done to
    take these extra growth rates into account. Because they are not going to happen,
    the growth rates should be classified as potential rates.'
