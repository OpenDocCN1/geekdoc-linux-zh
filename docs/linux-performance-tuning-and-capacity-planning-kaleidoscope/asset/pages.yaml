    Let''s look at a couple examples. Assuming that one of your primary components
    is an application server, consider a scenario in which a vendor is intending to
    release a version in six months that will increase the throughput of your system
    through some architectural changes within the system. The bar might be raised
    slightly with hardware requirements, but the associated savings will improve your
    business tremendously and you seamlessly introduce some of the capabilities for
    users who are screaming.


    In this case, assuming that the software is a quick upgrade, the disruption to
    the system should be minimal. It will require only the amount of time to perform
    the installation upgrade. By testing your later code extensively, you can add
    extra capability without severely disrupting the users of the system. Assuming
    a lot of online tests, this likely will work into the system nicely. As such,
    it should be figured into the capacity plan. The slight hardware change also be
    reflected so that everything is ready for it when the times comes.


    Now look at another possibility. When you''re planning the storage needs of the
    system, you find out that a new SAN is being offered by a certain vendor. Although
    it is new—and, therefore, expensive—it would fit your needs perfectly and allow
    your system to maintain its growth rate well. But it might be difficult to get
    that hardware in now. Instead, you have the option to save a lot of money by getting
    a small storage array and working with that. That assumes that in a year or so,
    its capacity will be maximized, and the SAN hardware will be within a price range
    that is agreeable to those in charging of particular. Choosing which is appropriate
    depends on the situation, of course. In a perfect world, the higher-end hardware
    is the obvious choice. In reality, however, a cap must be placed on the system''s
    construction.


    The point of all is that there is a trade-off between disruption and capabilities
    when planning a system. Because the software is always changing, an attempt must
    be made to allow for paradigm shifts. Some of them will be required to allow the
    system to grow, some just for different capacities down the road, and some might
    provide the need for in-depth tuning. All will likely cause disruptions to the
    system, either now or later. Determining the route is up to you.


    These are the general principles that should be applied when approaching the problem.
    Although they cannot necessarily be executed in a clean order, they may make chronological
    sense. Some of them might require you to back up a start and evaluate the data
    you gathered. It makes sense to understand the basic set of requirements up-front.
    This should give a clear view of what the system is originally specified to do,
    and any questionable requirements can be fleshed out easily before getting mixed
    with the rest of the process.


    Now that you understand your requirements, you must gather statistics on how your
    system has behaved in the past. This should be a straightforward process because
    you have your requirements and know what to look for.'
