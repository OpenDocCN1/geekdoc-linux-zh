    # PART IV


    Where do all these patches come from? That''s a very good question. As always,
    it depends on what you are trying to do. If an application is trying to patch
    the kernel, the patch most likely comes with the software. If you are applying
    a patch to solve a kernel issue, it could have from anywhere. For most kernel
    problems, the patch becomes available through whoever wrote it and posted to the
    kernel mailing list. If the patch is small, it might be contained in the message,
    or it might be on a Web site, referenced on it. Sometimes a vendor might supply
    the source patch through whatever channels are appropriate for that vendor.


    Generally, if you are patching a kernel, you will likely be using one of the default
    patch sets against the current baseline. Two trees are in active use: the one
    controlled by Linux Torvalds and another by Alan Cox (although more could spring
    up until the works get into the main kernel). Linux runs the development tree,
    Alan runs the stable tree. The older trees continue to be in use, but development
    on them drops off, to the point of only significant bugs being fixed. Depending
    on time, Alan also maintains a patch against current trees (development or stable)
    that are considered radical to be rolled into the default line without more testing.
    For example, the current tree is 2.4; because it is in a stable testing, Linux
    keeps a patch set of fixes against it. Likewise, Alan keeps a patch set. Linux
    is focused on lifting high-importance patches without major repercussions. Alan,
    on the other hand, is accepting in his tree and accepts risky bits and pieces
    for testing. When they have been proven, these bits get sent to Linux, who keeps
    them in his patch set to rolled into the next version (Refer to the kernel mailing
    list summaries at http://kt.zork.net for more information and insight into Linux
    and Alan''s work).


    During normal development cycles—say, when 2.5 begins in full swing—Linux will
    change how he focuses on that, leaving Alan to continue working on the 2.4 series,
    integrate drivers as needed, and merge fixes as needed. Eventually the leadership
    will change hands to someone when Alan needs to focus on the 2.6 stable tree.
    Currently, he is still maintaining the 2.2 tree. The 2.0 leadership has been handed
    over to David Weinhall.


    Now you may have ever wanted to know about the kernel development process. The
    names shift over time, the overall model holds up and will likely continue for
    the foreseeable future. But how do you know when a fix is out for your problem?
    The best way is to watch the kernel development list, but that''s not feasible
    for most people because of the volume of involved mail and the fact that not everyone
    wants to spend their life watching kernel development. News services such as Linux
    Weekly News (http://www.lwn.net/daily), which gives up-to-minute announcements
    or Kernel Traffic (kt.zork.net), which gives weekly summaries of kernel development,
    can help keep you up-to-date when Alan or Linux release patch updates. In both
    cases, a changes document is attached to the release, specifying exactly what
    is updated. If you see something that pertains to your problem, it might be worth
    patching.'
