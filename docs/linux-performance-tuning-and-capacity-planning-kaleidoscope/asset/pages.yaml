  md: '# Tuning and Performance Mechanics

    PART IV


    It is the systems administrator''s job to decide what hardware, if any, a system
    needs. One aspect of that decision process is memory requirements. Within the
    realm of performance, the proper application and use of memory is by far one of
    the most (if not the most) important process.


    Random Access Memory (RAM) is where system operations, processes, and tasks are
    stored until called upon by the CPU. The kernel also uses swap space (discussed
    in this chapter) as virtual memory in case there is not enough physical memory
    or for use on a convenience basis.


    The first part of this chapter looks at deciding how much RAM is needed for a
    new system. The second part examines buying additional RAM and also discusses
    swap space.


    # Determining Physical RAM Requirements


    You can determine how much RAM a system needs in many ways. The Unix industry
    as a whole has certain places where standard usage information is kept, but many
    vendors of both software and hardware products related to Linux. The best way
    to determine how much RAM is needed is to figure out what role of the new system
    will be. Most often there are clear methods of determining the amount of RAM that
    a system will need, based on its role. This role really revolves around two factors:
    How many users will be accessing it, and what software will be up and in use?
    That question puts the topic into two vague categories:


    +   - Single-user systems (workstations)

    - Multi-user systems (servers)


    Looking at these separately makes things a great deal simpler.


    # Single-User Systems


    Obviously all Linux systems are multiuser systems, but “single-user” in this context
    means that one physical person is using the system. Now it is quite easy to start
    figuring out the memory requirements for a single-user system; there is a general
    step-by-step approach for this:


    +   - If the system will be in console mode and will not be running any services
    except typical single-user ones, then 16MB to 32MB should be fine.

    - If the system requires X Window and the user is comfortable with fwm or blackbox,
    then 32MB to 48MB should be enough.

    - If the user requires a larger X environment or will be doing graphics manipulation
    or large-scale programming, a high-end graphics adapter and 64MB to 128MB is recommended.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Linux and Memory Management


    # CHAPTER 11


    +   - If the user requires a test database, test Web servers and other heavy developmental
    tools and X Window, 128MB+ should be adequate.


    These are all estimations, really. The situation might be more complex and would
    not fit well within this framework. This comes into play with high-end workstations
    that might be required to run graphics tools (such as the GIMP). A classic example
    is that some of the Oracle management clients use Java. A system might be better
    off with a faster processor than tossing memory or it to help render the Linux
    client.


    The RAM amount revolves around central usage; for example, a Linux server running
    an Oracle database would need enough RAM to contain Oracle’s common running processes,
    while a small workstation that is primarily used for remote management by Telnet
    or secure shell would require a minimal amount of RAM.


    # Multiuser Systems


    The larger multiuser server environment is a completely different animal. Some
    Unix-house systems go well into the range of terabytes of RAM. In any case, the
    best is to always err on the high side. Heavily loaded file-sharing systems that
    use NFS and SMB servers require extra memory for additional overhead, but not
    as much as you think. For example, a 100GB file server that serves a norm of 20
    concurrent users transferring documents would only need about 128MB of RAM or,
    if you put on print servers, the formula changes. In this case, with same number
    of concurrent users doing printing and using a database, it might be wise to move
    the RAM all the way up to 1GB.


    On the flip side, static Web on a Web server surprisingly very little RAM at all.
    It is possible to use 128MB of RAM for static pages that take in, 2000 hits per
    hour. However, if a dynamic engine that generates Web pages on the fly is connected
    to a database either on the Web server or elsewhere, a larger hike in RAM will
    be required, again bouncing into the gigabytes ranges. The experienced database
    administrator knows that even 1GB on some systems is trivial compared to the sheer
    volume of large companies, where terabyte ranges are the norm.


    With the ever-growing acceptance and use of Linux in the mainstream computing
    world, a whole new monster has roared its head: the high-end database server (actually,
    the high anything). Until about 1997 or 1998, Linux was mainly used for low-end
    systems, the smaller home hobbyist system, or of course, the nefarious “server
    in a closet.” It is worth noting, however, that when intensely high ranges become
    the norm, the topic begins to move more into the realm of overall networking and
    load balancing than pure Linux administration.'
