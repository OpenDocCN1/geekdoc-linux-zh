  md: '# Introduction and Overview


    PART I


    So far, you''ve seen a lot of subsystems and learned how they relate to the overall
    performance of the system. You''ve learned different layers of I/O, performance
    issues, memory management, buffering, swap utilization, and how the system pieces
    together at runtime into processes. On their own, these factors can appear complex,
    especially because they interact with each other. (Processes can force the buffer
    cache to shrink or swap files to be used, which will utilize your I/O subsystems.)
    As you will see in the next section, these factors must be taken into account
    and be handled systematically to effectively manage your system.


    # Methodology


    Systematic decision making is key to designing a capable system. If you build
    the system with the wrong ideas in mind, there is no way you can recover from
    the decisions made up front. These ideas apply to any system that you might be
    building, whether or not it is constructed with Linux in mind. Approaching design
    without clear and precise goals is like running into a battle without a battle
    plan. You might come alive, but don''t count on it.


    # Assessment


    Assessment tuning is a complex issue, with possible wild goose chases if you''re
    not careful. Determining that the system is not working at the speed it should
    is generally a fairly obvious conclusion. Determining why requires a stringent
    approach to the problem. If it looks like the system is slow when it comes to
    file accesses, you might guess that the disks or drive mounts are at fault. The
    database providing the file lookup could be swamped. Determining the root cause
    of the problem requires considering all aspects of the system. If that weren''t
    enough, it also helps to be able to keep all the different load factors in mind
    at the same time. (If that was really easy, why would you need a book on the subject?)


    # System Configuration


    Know the system''s configuration. If you''re tracking performance issues and don''t
    realize that the machine in question has a drive subsystem, you''re chasing a
    red herring indefinitely. Keep in mind kernel capabilities, the hardware present,
    and the state of the installation. Linux boxes can run for years, but the installations
    tend to go out-of-date very quickly, considering the rate at which development
    occurs in the field. Unless the box is regularly updated, it could be outdated
    for what you are trying to get. For example, if you are trying to deal with files
    larger than 2GB, you will need a recent (at the time of publishing) version of
    the C libraries and preferably the 2.4 kernel. If the box has just working away
    for the past two years in the server room without updates, it''s probably going
    to need some work.'
