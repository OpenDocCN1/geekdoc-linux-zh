  md: '# About the Author


    Jason Fink has been involved with computers and electronics since 1984 when he
    blew up a power supply while he tried to “improve” in high school. Since then
    he has worked on mainframe systems, Unix clustered LANs and a variety of other
    interesting networks and systems. He contributes to the Open Source community
    in various manners.


    Matthew (Matt) Sherer has been fixated with computers for years, starting with
    a Laser128 back when Apple-compatible machines were all the rage. This fixation
    resulted in a degree in Computer Science from Juniata College in Huntington, PA,
    and a discovery of UNIX and Linux along the way. Upon graduation, he spent some
    time in the government contracting world for a while succumbing to the lure of
    commercial work. He spends a large portion of his time following all things pertaining
    to Open Source and Free Software, attempting to project their impact and assist
    in making sure that they are chosen over more limiting solutions whenever possible.
    Matt can usually be found behind his monitors either hacking or catching up on
    news about the latest code. If he’s suspiciously not at his machine, chances good
    that he’s off travelling to some distant corner of the world.


    # About the Tech Editor


    Kurt Wall has extensive technical experience, including programming and administering
    Unix and Linux systems. He is the author of Linux Programming Unleashed, Linux
    Programming Unleashed, 2nd Ed., and Linux Programming by Example. He is also a
    contributing author for numerous other books, user guides and papers. He has been
    technical editor for too many books to list here. Kurt is the Vice President of
    the Salt Lake Linux Users Group, former President of the Informix on Linux SIG
    of the International Informix Users Group, and former maintainer of the Informix
    on Linux FAQ.'
