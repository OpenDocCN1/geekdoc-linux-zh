  md: "# The Linux Kernel\nCHAPTER 9\n\nbase of 2.4.3. If your fix was rolled into\
    \ patch level 5 against 2.4.3, you can roll the fix into your base kernel without\
    \ waiting for the final version. (You still need to be careful about what else\
    \ comes with this patch, of course. It might sense to get the individual patch\
    \ for the specific problem from the original author rather than getting the intermediate\
    \ patch for the whole kernel.)\n\nRegardless of how you get it, sometimes you\
    \ are left with a patch and a patchfile that you knows to be applied to your kernel\
    \ source. (Of course, the solutions described here can occur with any piece of\
    \ source code you have, whether it is in your own project, or somewhere else.\
    \ It in no way has to be the kernel.) If you are working with your vendor, it\
    \ might provide fixes another route, possibly by releasing precompiled binaries\
    \ of the patched kernels. For the sake of neutrality, though, we assume that you\
    \ are working on your own personal instance of the kernel source. Let's look at\
    \ it to get a better perspective on how this works.\n\ndiff is a utility that\
    \ generates patches to reflect the differences between two versions of a file.\
    \ When it runs on a source file, it provides nearly human-readable files that\
    \ specify the exact steps needed to get from one version of a file to the other.\
    \ Let's look at simple example: Assume that you have a simple file with these\
    \ contents:\n\n```\n#include <stdio.h>\nint main (int argc, char **argv) {\n \
    \   printf(\"diff testing\\n\");\n}\n```\n\nThis file is saved in a file named\
    \ dtest.c. As people use this wonderful little program, someone notices there\
    \ is a spelling error. They need to fix it and get the patch to you. So, the bugfixer\
    \ creates a copy of the file named dtestupdate.c and makes the change so that\
    \ the program now reads as:\n\n```\n#include <stdio.h>\nint main (int argc, char\
    \ **argv) {\n    printf(\"diff testing\\n\");\n}\n```\n\nNow, to get the patch\
    \ back to you that you can apply it to your local copy, diff is run in the following\
    \ fashion:\n\n```\n# diff -u dtest.c dtestupdate.c > dtestpatch\n```\n\nBy default,\
