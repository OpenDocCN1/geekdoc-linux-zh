  md: '# Thinking About Capacity Planning

    CHAPTER 13


    A good rule to follow is to always build your components—whether hardware, software,
    a product, or any combination thereof—in terms of how it will be implemented in
    the-largest scope. This really pertains to the point of knowing your global scope.
    Although this generally applies more to software design, it can just as applicable
    in this case. If you don''t know how the system will be used outside the core
    scope, there is no reason to believe it will work at all. If you have details
    of how it will interact with other systems, you can draw a more concise picture
    of what exactly the system in question will have to do in terms of usage and interfaces,
    protocols, and other items it needs to present to everyone involved.


    Generally, this applies to code interfaces, but in the system sense, it might
    mean planning based on a common knowledge of working out of your group. Consider
    the case in which you anticipate database replication requirements in the future,
    through different groups within the enterprise. If the rest of the enterprise
    is using Oracle, it might make sense to work in that requirement, as the system
    moves forward, integration with the rest of the system becomes much easier.


    By looking at the global plan, you can also add functionality overlap. If all
    the component systems are archived and developed by individuals who don''t understand
    the bigger picture, application, expertise, hardware, and data redundancy will
    likely occur across the units. By seeing these overlaps ahead of time from the
    global perspective, many of these redundancies can be easily avoided. This results
    in cooperation and consolidation of domain expertise rather than replicated work
    throughout the components, as well as centralization of hardware and management
    operations, and cleaner requirements for each component system. Of course, the
    greatest benefit will most likely come from the large time and money savings from
    avoiding duplicate work. The redundant work should be avoided at the functional
    level—only redundancy within the system defines is not to be stripped off if it
    can be helped. Planned database replication is an example of redundancy that is
    good—it provides load balancing, failover, and other bonuses. But having two customer
    databases within the enterprise that operate independently is an example of the
    type of redundancy that should be eliminated.


    # A Twofold Approach


    Don''t assume that everything from the 10,000-foot level, or the perspective of
    the highest levels of management will solve all your problems, though. Stealing
    terms from software development, you need two views of planning: top-down and
    bottom-up. As in software development, top-down refers to the concept of knowing
    exactly what you want the system to do, from the global perspective. Based on
    this set of high-level requirements, you can drill down and specify subcomponents
    that will perform the work you need to do. But involved in the process is a bottom-up
    approach, in which you take details about the lowest-level


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_255_0.png)'
