    In general, hardware caches provide good speed gains, but growing them too large
    can actually cause longer cache lookups than it would take to get the data directly
    from the normal memory banks. Passing this crossover point can give you a system
    that costs more to build and works less efficiently. Caches have grown larger
    over the years, well past what used to be considered good sizes to prevent the
    crossover point. Along with them, however, have come speed improvements when searching
    cache.


    For the memory itself, getting the fastest for the bus and the processor is mainly
    CPU– and memory-bound. This way, the data that the processor needs to keep running
    at high rates can be as fast as the processor requests it. As usual, this requires
    a good understanding of your problem. Some interesting developments coming in
    the industry will yield better performance. One of the most recent advancements
    has resulted in doubling clock speed by syncing both sides of the clock pulse.
    But this is a fast-moving market, and it helps to see what''s out and what''s
    coming in relation to the system you are trying to build.


    # Virtual Address Space


    In general, Linux will handle managing your process''s address space transparently,
    as it should. If you or your applications kick off new processes, the kernel will
    take care of creating a new process to run in. If the process outgrows this area
    by using the stack allocated to it, the kernel might decide to allow more program
    space. Likewise, the kernel handles allocations are outside the stack, or on the
    heap, and faults occur involving these areas.


    Signs of trouble involving your process''s address space usually indicate of bad
    coding by the developer, unless it is a simple problem of not having memory. Stack
    problems should never be visible to the user. One thing to keep in mind is that
    user-level threads implement all threads in the same address space as the parent
    process, carving out portions of the stack for each individual thread''s stack.
    Or, if a certain thread is exceedingly heavy on its stack, it is more likely to
    cause a crash of the process than a program threaded with POSIX threads.


    # PAE


    One aspect of process space management that you might have to deal with occurs
    on Intel systems with large amounts of memory. Intel''s current family of chips
    is a 32-bit architecture, these chips can address only 4GB of memory. (2³ works
    out to four billion, or 4GB of RAM.) But systems are being built to address more
    than this amount of memory, and Intel''s 64-bit chip isn''t out yet. So what can
    you do to get your machine to address large amounts of physical RAM?


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_109_0.png)'
