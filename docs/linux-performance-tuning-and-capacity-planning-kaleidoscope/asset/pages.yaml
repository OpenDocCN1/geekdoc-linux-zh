  md: '# X Window Performance CHAPTER 6


    Before running your tests, restart the X server. Doing so ensures the most consistent
    results. In fact, for both testing and tuning, it might be easiest to start X
    from the command line (run level 3) rather than endure the long shutdown and restart
    procedure of the X login (run level 5). Depending on your situation and need,
    you might want to restart the entire system.


    x1perf accepts more than 280 command-line arguments, most of which specify tests
    to perform. Its basic syntax is:


    ```

    x1perf [-option1] [-option2 ..]

    ```


    Table 6.1 lists useful options that do not specify tests.


    | Option | Description |

    | --- | --- |

    | -display host:display | Connects to the X server running on host:display. |

    | -repeat n | Performs each test n times. The default is 5. |

    | -time s | Performs each test for s seconds. The default is 5. |

    | -all | Performs all tests. |

    | -range test1[,test2] | Performs all tests from test1 to test2, inclusive. |

    | -labels [test1,test2...]] | Displays the descriptive labels for each listed
    test. If a test is not specified, all labels are displayed. |

    | -fg color | Uses the foreground color color when performing tests. The default
    is black. |

    | -bg color | Uses the background color color when performing tests. The default
    is white. |

    | -depth n | Sets the color depth to n bits per pixel during the test session.
    The default is the current device''s depth. |


    # Table 6.1 x1perf Nontest Command-Line Options


