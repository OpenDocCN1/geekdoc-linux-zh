- img_proc: true
  md: '# Case Studies


    PART VI


    No performance-tuning manual is good without examples. Sometimes inline examples
    are not enough to fully explain the processes of troubleshooting a real performance
    problem. In this chapter, you''ll look at some case studies. Symptoms will be
    gathered, a quick look for the most common causes will ensure, a more in-depth
    analysis will be performed, and finally, a list of possible solutions will be
    drawn behind. These cases will not follow the actions verbatim because all the
    tools needed are elsewhere. However, the sections will thoroughly explain all
    the tools used and what they told the troubleshooter.


    It should be noted that these cases are based on fact, although all names have
    been omitted.


    # Web Server Performance


    The most visual server systems in use today are Web servers (for file servers
    of all types running behind). Almost Unix administrator maintains a Web server
    in some capacity—most often the sysadmin is the Web master as well. In this, the
    main function of this particular Linux system is to serve up static Web pages,
    a few CGI-generated Web pages, and some pages generated through PHP scripts that
    connect to a database server behind a firewall.


    # The Symptoms


    The symptoms are vague, at somewhat consistent sporty performance from any client.
    Obviously, any clients access the Web server within the network will be faster,
    but there is still a noticeable performance drop of nearly 50% in download times.
    The database server can be eliminated quickly because the problem occurs on both
    static and dynamic pages (albeit the problem is much longer on dynamic ones).


    # The Quick Checks


    The industrious administrator quickly runs top and sees several httpd processes
    eating up the system. This is still not enough information, though, because httpd
    requires the use of many subsystems (especially on this system).


    The next step is to use tools that are a bit more granular. After employing sar
    and vmstat, it is discovered that the processor and memory see I/O-bound, but
    disk I/O sees okay.


    This tells the administrator that the problem could be a CPU problem. Even though
    memory is being used more than it normally is, there is no excessive paging.


    # Some Quick Guesses


    Because the problem is directly related to the Web server and not the database,
    this points to the only part of the Web server that could be the culprit: the
    pages in general. This does not make much sense, though—static Web pages hardly
    cause any overhead by themselves.'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'The administrator takes a look at the HTML documents and discovers that they
    have all been modified recently along with the Web server''s configuration files.

    After viewing the configuration files, the culprit is finally revealed.


    # # The Web Server Culprit


    Someone (a virtual person?) has activated server-side includes and added a whole
    host of SSI scripts that get called by each document (even dynamically generated
    ones). The scripts range from date/time, last modification times, file sizes,
    and owner names to hit counters for each page.


    # # Possible Solutions


    The first solution might be to remove anything that is not necessary. For example,
    hit counters on each page are a bit excessive, and the server logs provide a much
    more accurate picture away. In addition to the counter, file sizes of current
    documents and owner names could go as well.


    If the user simply live without the scripts, alternatives might be offered. For
    example, PHP can do most all of the functions that these new scripts do within
    PHP itself (without relying upon calling external scripts).


    Ultimately, the best solution is a combination of the two:


    +   - Eliminate scripts that are not necessary.

    - Find a better way to run the ones that remain.


    # # A Classic Memory Problem


    No performance-tuning example would be complete without a memory problem. Although
    this time the troubled subsystem is revealed, the solution is not exactly what
    most people might consider.


    # # The System Configuration


    This system has three SCSI hard drives, all the same size and model. Additionally,
    the system has a tape backup device and the CD-ROM drive. It is used as test server
    for compiling programs and running the drives. They are all on the same channel.


    # # The Beginnings of a Problem


    In any development environment, eventually critical mass will be reached. In today''s
    ever-changing environment, new tools are created, downloaded, and installed daily.
    It finally'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Case Studies

    PART VI


    becomes apparent that this system is getting beaten up. The compile time for the
    ever-growing projects is getting larger, and test runs are going slower. This
    is because of the obvious creep of the software being developed.


    # Detailed Analysis Says...


    It is discovered that although the programs are larger, they are still not large
    enough to hug memory. The stalwart administrator employs sar again and discovers
    that the swap disk is getting/O-bound. The swap disk is the first disk in the
    system, and it is also used to contain a lot of tools used for compiling.


    # Quick Solutions


    The obvious quick solution is to upgrade the system—first memory, then perhaps
    the motherboard. In the Linux world (and most of the open source OS community
    in general), this hardly seems appropriate. Furthermore, it is not that easy;
    rarely (if ever) does an administrator have funds available to stop sneaking types
    of problems. Instead, more fundamental solutions are necessary.


    # Changing the Disk Configuration(s)


    You''ve already figured out the most plausible solutions (especially if you thoroughly
    read Chapter 11, “Linux and Memory Management”).


    One method is to juggle the swap partitions onto lower-used disks, thus splitting
    off the load. The great thing about this solution is that no downtime is required
    (hopefully). This is not the best solution, though.


    Perhaps the best (but most time-consuming) method is to back up all the data files
    and reinstall the system. This time, however, use stripping across all three disks,
    including the swap partition. Then load the data back after the system is configured.
    This will evenly allocate disk resources.


    # Increasing Network Latency


    Network problems plague even non-network administrators. With chatty protocols,
    a seemingly endless list of new file-sharing protocols, and everyday changes to
    network security systems, it is a wonder that more administrators are locked away
    in asums. This case study reveals an extraordinarily succinct problem that actually
    has little to do with Linux but certainly seems that way.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# A Day in the Life of an FTP Server


    In this case, an internal FTP server is the troubled child. The problem is file
    transfer times. In a nutshell, these times are steadily getting worse, although
    in almost unnoticed increments. Large differences are noticed only over weeks,
    and the situation is getting worse.


    # The First Look


    Initially, the administrator looks at netstat and ntop and notices that the system
    itself seems to be dropping a lot of packets in out. The administrator tries to
    adjust the media settings, changing a few parameters and the like. None of these
    seems to have any effect, other than mutating the problem—for example, expanding
    the MTU of the NIC in more packets being dropped.


    Even more in-depth analysis, nothing seems to stand out. After several (worsening)
    weeks, the administrator surrenders and installs a new NIC. After monitoring the
    interface for nearly a week, the problem begins to creep up again.


    # And the Answer Is...


    It is quite obvious that one of two things is wrong:


    +   - The networking subsystem grossly messed up.

    - Some sort of hardware issue is at stake.


    The administrator installs a clone of the system on a spare PC and does not see
    similar results. The administrator moves the NIC in the FTP server to another
    slot, and it works fine for several weeks. The problem was the slot itself; had
    intermittent problems most likely brought on by cold solder joints.


    # Another Memory Problem


    # The Symptoms


    Under extremely heavy load, the system behaves erratically, and becomes very slow.
    This is happening on your database server, during peak hours. The machine keeps
    going, but it is obvious that something is wrong.


    # Tracing the Problem


    Let’s look more closely at the problem. By watching the drive I/O with the standard
    tool set, it is obvious that it is being fairly hard, although the throughput
    numbers seem to be within reason for the number of users involved.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Case Studies

    PART VI


    Next, check the CPUs the kernel and memory to see if something is bound for by
    factors. Watching it, the system is being worked fairly hard, but it looks like
    it''s weathering the stormy well. The CPUs aren''t fully hammered, and memory,
    while high, isn''t absolutely gone.


    All right. Let''s check the database logs, just to make sure the problem is not
    a software configuration issue. Nothing really looks too bad, but there are some
    memory errors in a couple of the logs that seem to be lining up closely with the
    peak usage.


    Now things are getting confusing. The system looks to be right from most of the
    normal tools, but the application logs seem to be saying that there is a memory
    issue. Now it''s time to check around the kernel itself, as this one is becoming
    difficult to check in the normal fashion.


    Bongo. Looking at the kernel ring buffer with dmesg, and looking at the /var/log/messages,
    there are messages in the following format:


    ```

    # tail /var/log/messages

    Apr 22 12:15:07 db kernel: VM: do_try_to_free_pages failed for db...

    Apr 22 12:15:07 db kernel: VM: do_try_to_free_pages failed for db...

    Apr 22 12:23:52 db kernel: VM: do_try_to_free_pages failed for db...

    Apr 22 12:53:58 db kernel: VM: do_try_to_free_pages failed for db...

    ```


    # Finding a Solution


    All right, this obviously has a problem, but what is exactly going on? Checking
    the kernel mailing lists, the current kernel has a problem in the VM system is
    under heavy load. The kernel source has been installed by hand since it was necessary
    to make sure what was built into the system, so the state of the kernel source
    is known. Based on the current state of the 2.4 series, driver support for RAID
    isntt yet. It will be ready in a month or so, which will enable the jump to 2.4
    to get rid of the problem. But what about dealing with the problem immediately?


    Further research shows that there is an existing patch against the 2.2.18 pre
    that has been used by other people in this situation and has been found for effect.
    The people directory on kernel.org, where there is a patch for the VM patch from
    Andrea Arcangeli set of patches. The current one is against 2.2.18pre25, which,
    as described in the kernel chapter, is Alex Cox''s patch against the 2.2.17, which
    will eventually become 2.2.18. A lot is going on in the series, and there have
    25 patches against the 2.2.17, with no end in sight. Rather than waiting until
    the final 2.2.18 comes out, which might not have the patch that is needed, the
    2.218pre25 patch is retrieved from Alan''s directory.


    Now, you have your 2.2.17 source base, Alan 2.2.18pre25 patch, and Andrea''s VM
    patch that was made against 2.2.18pre25. So, patch the base kernel up to pre25,
    then apply the VM patch and build the kernel as usual. ( configuration parameters
    were set before, so it''s just a build.) Once you reboot with the new kernel,
    the system''s problems will go away, and it will handle the high load (and higher)
    with ease'
