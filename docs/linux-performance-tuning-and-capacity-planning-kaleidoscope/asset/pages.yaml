- img_proc: true
  md: 'The Linux kernel is the core of the Linux system. Technically, Linux is the
    kernel, and the rest of the system that rides on top of the kernel is simply a
    collection of utilities and applications having nothing to do with the kernel
    itself. Some people argue that a Linux system should be GNU/Linux, as a whole,
    the kernel is only a piece of the entire system—overall, it is quite a small part
    of the code of a fully utilized system. This can easily open into an almost religious
    debate among those in the open source and free software movements, but for the
    purposes of this chapter, consider Linux to be the kernel, not a specific instance
    of a certain vendor''s collection of utilities.


    A little bit of background is needed for those new to the idea of modifying a
    core part of the operating system. Many people who come to Linux from other operating
    systems such as Windows 2000 find the concept of replacing a component such as
    the kernel jarring. They end thinking that to upgrade the core, you need to upgrade
    the whole system. The kernel provides an interface to hardware and manages processes
    running on the machine. It can perform other operations, but this is the core
    of the kernel''s responsibilities.


    The graphical interface is handled X Windows, or a frame-buffer system, but for
    the most part, the kernel could less about graphical interaction. Likewise, support
    for nearly all server-oriented services is provided by normal applications, and
    the kernel handles only the operations of getting data from hardware to the userspace.
    tar couldn''t care less about the kernel, and the kernel couldn''t care less about
    tar. Because its role is so defined and only providing an interface to hardware,
    replacing your kernel generally has little impact on user-level applications.
    Even jumping from the 2.2 series to the 2.4 kernel requires very little to be
    modified throughout the system.


    This does not mean that you can run around swapping kernels left and right on
    production machines, especially between large revisions. Depending on what the
    machine is doing, some modifications might need to occur on the user side of the
    kernel wall. For example, as mentioned before, support for large files is now
    included, but to fully utilize this capability, you need to have both a 2.4 kernel
    and a set of the C libraries that knows to take advantage of the 64-bit file handling
    cases. Refer to your vendor''s documentation for instructions on how to put this
    into, if this information isn''t already there. Another example is that, during
    the jump from 2.0 to 2.2, the kernel interface for PPP interaction changed. This
    required an update to the PPP daemon to handle the new semantics.


    Generally, these changes are fairly simple and not very far-reaching, but you
    should check for known issues when making large kernel revision jumps. Before
    a development series becomes the new default stable series, a list of nonkernel
    changes must occur before making the jump. It is usually a good idea to make a
    note of this list and see if any of the specified changes have an impact on your
    system.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Why Alter the Kernel?


    Before you go in and start replacing your kernel, make sure you know the reasons
    for doing so, and determine whether it makes sense in your situation. Here are
    a few possible reasons:


    +   - New capabilities or scalability is present in a new kernel.

    - A security flaw was found in the version that you have and is fixed in a newer
    revision. (Yes, security holes in the kernel occur, but they are rare)

    - Support for a new driver has been integrated into the kernel. Sometimes this
    can be added to your existing kernel with a patch, as described later.

    - External software requires a new kernel. This is rare, but some software does
    need this. For example, the VPN software FreeS/WAN integrates IPSec support into
    your kernel via a patch and requires you update your kernel so that the patch
    can apply correctly.

    - By removing unwanted components from the kernel, you can reduce the memory footprint
    and ensure that you''re not running anything you absolutely don''t need. This
    will increase your speed.

    - Your vendor''s default kernel might not be configured for what you need the
    machine to do. You might need to configure a small kernel with support for a strange
    device that isn''t supported, and the vendor''s version might not be configured
    to handle it. Generally, most vendors ship kernels with support for many types
    of devices and a large number of different patches. This might not be what you
    need, but because you have the source, you can do anything you want to.


    # Modular and Monolithic Kernels


    Linux provides an easy mechanism for loading and unloading different parts of
    the kernel. The core architecture of the kernel itself is monolithic, meaning
    that, in general, a large portion of the kernel is irreplaceable. The presence
    of the module loader, allows things such as drivers, protocols, and other components
    to be swapped in and with relative ease.


    If you have a driver for a piece of hardware that might not always be present,
    you can let the system run without the driver most of the time and load it only
    when needed. This saves the trouble of dealing with a system that reports all
    kinds of errors when a driver fails because the hardware isn''t present. A real
    example would be support for a Zip drive. With a modular driver, you can load
    the driver into the kernel when you need to use it, and then you can remove it
    when you are done. This way you aren''t using kernel memory for a device that
    isn''t always present. Here is an example of a system with a couple modules loaded:


    ```

    #lsmod

    Module Size Used by

    vfat 87520 0

    fat 29600 [vfat]

    emu0k1 39968 0

    ```


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_181_0.png)'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Tuning and Performance Mechanics


    # PART IV


    This machine shows modular support for the vfat filesystem (and fat, which vfat
    uses) and a module for the SoundBlaster Live! Value card, represented by the emu10k1
    module. The lsmod command shows all loaded modules and their dependencies. Here
    is the same machine after loading the modules to a second sound card that is onboard:


    ```

    #modprobe via82cxxx_audio

    #lsmod

    Module            Size Used by

    via82cxxx_audio  17008 0 (unused)

    ac97_codec        0 [via82cxxx_audio]

    vfat               8752 0

    fat                29600 0 [vfat]

    emu10k1          39968 0

    ```


    As you can see, there are now two lines—one for the ac97 codec support and one
    for the chip driver that drives the onboard sound. Note that, even the dependency
    via82cxxx_audio has on the ac97 codec is shown by the ac97_codec line. Let''s
    say that you want to use only the one audio feed present on you emu10k1/Sound
    Blaster Live! Value card. All you need to do is remove the modules for that device,
    in this example as:


    ```

    #rmmod -r via82cxxx_audio

    #lsmod

    Module            Size Used by

    vfat               8752 0

    fat                29600 0 [vfat]

    emu10k1          39968 0

    ```


    Using the -r switch on rmmod will remove any modules on the requested module,
    if it can. If any particular module is still in use, rmmod will fail on removal.
    This is, if two applications are triggering of the same module in the kernel,
    the commonly used module won''t be removed. If two modules were the via82cxxx_audio
    module with -r, the ac97_codec module would have failed because it is still in
    use. If all applications are using the device drive that driver is finished, the
    module should unload cleanly. If it doesn''t unload cleanly, it''s probably a
    sign of broken driver code or something wrong with the device itself.


    A couple other points about modules must be specified here. In addition to the
    presented examples, the commands depmod and insmod perform dependency checking
    similar to modprobe, and insmod performs individual module loading. This can be
    handy if are installing a hierarchy of problematic module dependencies because
    you can watch kernel messages after each module is loaded. For safety''s sake,
    it is generally a good idea to have a root login running tail -f /var/log/messages
    during all interactions, to be sure that everything is going as planned. There
    are also switches to the module commands to syslog, which makes it easier to track
    down what happened down the road if something goes awry.'
