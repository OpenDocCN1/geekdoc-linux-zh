  md: '# The Linux Kernel

    CHAPTER 9


    +   **General setup**—This one be pretty obvious. General system settings live
    under here. You can control what busses the system supports, what kind of binaries
    understands, and drop power management options. Also make sure you enable SysV
    support, along with system1. Make sure that your kernel supports ELF binary formats
    and a.out, if you have any legacy binaries that use this format. For the most
    part, this is not needed anyone. The kernel allows you to arbitrarily set up handlers
    for different types of binaries, which makes Java class files to be transparently
    handled as true binaries. This is left as an exercise for you, though.


    +   **Block device support**—Use this section to allow kernel drivers for different
    types of block devices, such as ramdis, network block support, and some RAID drivers.
    Block devices are useful in situations such as when you need to layer a filesystem
    on top of a device that normally wouldn''t appear to be one. Ramdisk is a good
    example of this because you can take a chunk of memory and drop a filesystem on
    top of it, making it appear that it is not. Network block devices enable you to
    mount remote servers as a local device and use it for I/O or as a swap device.


    +   **Networking options**—This is an extensive tree of configuration options
    that control what protocols the kernel will work with, along with how it will
    work with them. For example, you can enable network quality-of-service capabilities
    in this section, along with network packet filtering. Generally, this turns certain
    sets of possible behavior in the kernel, and user tools are used to control exactly
    how the kernel should behave. In the example of packet filtering, you would use
    the iptables-user tools to control the kernel''s tables of rules for what to do
    with different packet traffic. If you need a specific protocol enabled, it is
    handled here—anything from DECnet support to IPv6 and ATM.


    +   **ATA/IDE/MFM/RLL and SCSI support**—This enables support for the various
    subsystems, as IDE and SCSI, and it presents drivers for each. A good rule, especially
    in a server environment, is to have at least SCSI enabled as a module. This way,
    even though the box might be serving Web data off an IDE drive, when high load
    demands a SCSI drive, you can add the hardware but have the machine only down
    long enough to physically add the card. If it is back up, you can dynamically
    add the SCSI driver to the kernel without requiring another set of reboots to
    make sure that the driver is correctly built into the kernel.


    +   **Network device support**—Network cards of various types are enabled here.
    Everything from ARCNet to FDDI is supported, and many drivers are integrated into
    the kernel tree for the myriad of Ethernet devices on the market. Note that many
    similar cards are grouped under the same driver, as is the case with the 3COM
    hardware. A single driver works with all types of cards listed.


    The Linux Kernel KERNEL'
