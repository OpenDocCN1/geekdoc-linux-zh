    # Summary


    Regardless of all the recommendations made here, your individual blueprint for
    capacity planning likely will vary from this model. The fundamentals might be
    similar, but you probably will need to weight the various components of the basic
    rule differently. If you are in a very dynamic market, you might determine that
    all your capacity plans must revolve around the capability to drop in new components
    at any time, or perhaps that your global view needs to be revisited on a monthly
    basis. You might need to include domain-specific factors that were not even mentioned
    here.


    In general, however, you need a solid blueprint when doing capacity planning to
    help prevent different system deployments from having to relearn the same lessons.
    With a good blueprint that fits your needs, you should be able to generate a viable
    capacity plan that will reliably determine your system''s future.


