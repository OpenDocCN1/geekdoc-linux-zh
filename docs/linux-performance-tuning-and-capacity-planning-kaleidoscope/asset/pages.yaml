    involves a certain number of unknowns. Good system capacity planning depends on
    having good knowledge-edge of your domain and targets, so this can present a problem.


    When possible, the unknowns involved in planning should be mitigated. In theory,
    any unknown can have disastrous consequences on what was considered to be a solid
    capacity plan. Adding several unknowns to the mix, with various interactions among
    them, can turn any system resource-planning process into a useless exercise. If
    an emerging system is being constructed, assumptions need to be placed on the
    process at some point.


    Depending on the scale of the system, different approaches might apply. If it
    is a prototyping effort, a looser set of restrictions can be placed on the design
    process because the primary focus is the concept. For most other projects that
    are considered in this text, though, a formal process needs to be put in place
    to make sure that everyone offers inputs on the system and also gets to review
    the contents of the capacity plan. Organizational systems vary widely, but the
    process should follow the same steps for the most part, just acted by different
    groups depending on the environment.


    If possible, capacity planning should be approached as a normal system, from an
    organizational perspective. This implies the systems in the question, the need
    for change, the approach recommended, and the rationale for the chosen path. Inside
    a normal business process flow, this should be reviewed by all parties involved,
    with comments being collected and discussed until the needs of every party are
    satisfied.


