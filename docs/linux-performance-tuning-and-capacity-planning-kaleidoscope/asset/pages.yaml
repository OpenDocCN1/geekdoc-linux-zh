  md: '# Tuning and Performance Mechanics

    PART IV


    Remember that when working with these settings, these options are enabling capabilities
    that might not be properly handled in your hardware. This could result in data
    loss or drive of integrity, which works out to the same problem in the end. That
    said, there is a commonly used set of options that gives good performance rates
    without placing your drive at risk. (Again, make sure that your hardware can handle
    the following options before attempting them.)


    ```

    # hdparm -d 1 -m 8 -u 1 -c1 /dev/hda1

    ```


    You should also make sure that your drive subsystems handle impairment: If you
    are running everything off a RAID drive, multiple tests must be run to make sure
    you can handle any load. Run an I/O test while the drive is fully operational,
    and another while it is missing a drive from the set or is rebuilding. Performance
    will be degraded, but you still need to be sure that the performance during these
    times is enough to carry the load. If not, RAID itself won''t stop you from having
    system failure—it will only keep you from doing a restore from tape. Although
    this represents an improvement over offline backups, it is decidedly not optimal.


    # Swap Strategies


    Although swap space gets a lower priority than the rest of the system, it requires
    some planning. If you end up using your swap space aggressively, this is usually
    indicative of a more general problem of memory starvation. However, the swap space
    does need to be present to handle unexpectedly high loads.


    In some situations, it might be beneficial to have swap on multiple drives, although
    each one is used in a balanced fashion is in the air. Under heavy load when you
    are sure to use large amounts of swap, you might get a slight bit of performance.


    In general, though, it could be a better idea to add swap on a drive that doesn''t
    get as many system requests. Placing swap on the same drive as your central file-serving
    directories won''t help in; fact, it''ll probably hurt performance of the extra
    drive. Instead, add swap to a drive that might house only semi-used data, and
    on an I/O channel that isn''t being heavily used, such as a storage partition
    that isn''t used in general. This, the extra drive spinning likely won''t effect
    the rest of the system as much.


    # Using RAID


    In most situations, a redundant array of independent (or inexpensive) disks (RAID)
    will help with both performance and data reliability. Your needs might vary, but
    from this, you should find a type of RAID that will help you speed your subsystem.
    This list is noninclusive because some types of RAID never made it to market,
    but it does cover most of the common types of RAID systems.'
