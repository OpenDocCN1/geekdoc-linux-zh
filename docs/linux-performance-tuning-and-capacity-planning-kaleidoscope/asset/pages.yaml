- img_proc: true
  md: '# Starting, Stopping, and Restarting


    The system administrator might not know for sure whether particular process or
    service is actually required (hopefully it is ironed out before the system is
    in production). An easy way to stop, start, or restart a service is simply invoke
    the script in /etc/rc.d/init.d directly. The following is an example of stopping
    and starting dhcpd:


    ```

    # /etc/rc.d/init.d/dhcpd stop

    # /etc/rc.d/init.d/dhcpd start

    ```


    A service also might be restarted for changes to take effect. It is important
    to know how to restart a service because, in most cases, this is the only way
    to reread the configuration or settings of a service without rebooting. A good
    example of this might be alter inetd.conf to allow a service to run:


    ```

    # /etc/rc.d/init.d/inetd restart

    ```


    # Summary


    One of the easiest ways to enhance performance on a Linux system is to run only
    the services that are absolutely necessary for the system to accomplish the task
    that will be (or is being) performed. When this is done, this task is finished.'
