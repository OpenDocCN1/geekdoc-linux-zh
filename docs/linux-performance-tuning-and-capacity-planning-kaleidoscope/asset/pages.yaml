  md: '# What Is Performance Tuning?


    In the simplest sense, performance tuning pretty much involves what it sounds
    like: making something (in the case of this book, a Linux-based Unix machine)
    run more efficiently. A phrase to remember here is “more efficient”—later in this
    chapter, we take a good, hard look at real efficiency.


    Performance tuning certainly simple enough, but there are nuances to tuning that
    many people are quite surprised to hear about. As an example, the definition of
    "fast" is almost completely dependent upon perspective. I briefly studied computer
    usability, and the first lesson I learned about speed where computers are concerned
    is this simple golden rule:


    “It depends....


    This rule has a strong role in performance evaluation. A simple example might
    be the difference in performance that a user on a remote network might see, compared
    to a user on the local network (especially if there is a great deal of network
    traffic). A more complex example might arise when someone using a Web page on
    a system that is maintaining a client system that is older than that of the Web
    site—in this case, performance certainly will be different.


    When you perform performance tuning


    In reality, performance tuning is a process as a whole. It could be said (arguably)
    that there are two types of performance tuning:


    +   1. Proactive

    2. Reactive


    That is, the system administrator is in one of two modes: either carefully planning
    and monitoring the system continuously or trying to fix an immediate problem.
    Most administrators run in both modes. (These two rules pretty much apply to any
    job. It involves continually striving to make the process better. In performance
    tuning, this has a very special connotation because the general health of the
    system is very important.)'
