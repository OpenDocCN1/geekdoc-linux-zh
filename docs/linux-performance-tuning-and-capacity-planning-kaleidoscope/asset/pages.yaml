    # The Interrelationship of Performance Tuning and Capacity Planning


    Proper planning and tuning are intimately connected. Although it always makes
    sense to tune your applications carefully, the need for this might not occur if
    the system has extra capacity planned into the architecture. A balance between
    the two should be found, resulting in a healthy balance between usage of hardware
    and software. If enough detail is present, it is a good idea to build specific
    tuning points into the capacity plan. Over time, the plan will attempt to predict
    the points at which hardware will become overloaded and tuning will become a factor.
    By doing this and watching growth rates as system usage rises, you can keep cost
    analysis in mind deciding when it is a good time to tune and when it is a cheaper
    matter of making changes to the hardware.


    # Planning May Preempt the Need for Tuning


    With a large amount of extra capacity, there might not be an immediate need for
    application or operating system tuning. Assuming large growth potentials, it could
    be a long time before tuning enters the picture. In some ways, this is a necessary
    evil. This is not to say that you can


