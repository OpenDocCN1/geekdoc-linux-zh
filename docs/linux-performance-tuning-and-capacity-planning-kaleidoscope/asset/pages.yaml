    # Tools


    How will you know if there is a bottlenecking problem with your network unless
    you have the tools to watch for it? Network analysis tools are the most important
    part of any performance analysis: Without them, the changes you are making might
    either help or harm operations—but you have no way of knowing. These tools may
    help sure that you are using the right protocols, assist in troubleshooting connectivity
    problems, and ensure that the right content is used within each protocol.


    If your application is configured to communicate requests over TCP in a certain
    format but it''s not acting correctly, analyzing the packets being sent might
    be the best way to track exactly what is going wrong in the network. The next
    sections discuss a couple of the tools used to examine networks and explain how
    they might be used in your environment. Although these are very capable tools,
    you might need to bring in more protocol analyzers to get a good picture of all
    angles of your network. Depending on your hardware, bringing in a vendor to check
    your network configuration with its hardware might be worth your time and money.


