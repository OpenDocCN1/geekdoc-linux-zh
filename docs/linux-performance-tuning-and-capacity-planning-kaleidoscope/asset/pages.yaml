    # 6 X WINDOW PERFORMANCE


    # Tuning X Desktop Performance


    The tips in this section focus on coaxing better performance from X client programs
    and from the desktop environment in general. The following is a general observation
    regarding desktop environments and window managers; it offers to improve overall
    desktop X program performance.


    # About Those “Desktop Environments...


    GNOME and KDE, arguably the two most popular Linux GUI interfaces, provide rich
    functionality and stunning visuals. They also make heavy demands on the host system
    and the X server because they are more than window managers. Instead, they are—or
    attempt to be—desktop environments.


    What is the difference between a window manager and a desktop environment? Why
    does it matter? Keep in mind that the X specification defines the core services
    that a windowing system should provide, not what a window looks like. It is the
    job of a window manager to define a window’s appearance and how it responds to
    keystrokes or mouse clicks. Window managers largely disregard the underlying operating
    system, providing instead the user interface to the X System.


    Desktop environments, on the other hand, provide more than a convenient interface
    for the protocol. In addition to implementing the standard window-management functions,
    desktop environments are keenly aware of the underlying OS. In fact, they attempt
    to hide and extend the OS by encapsulating OS features and services, such as file
    management and Internet access, beneath an attractive, user-friendly interface
    for manipulating OS services. Desktop environments also layer additional capabilities
    on top of basic window management, but not limited to these:


    +   * A consistent interface and appearance, enforced on compliant and noncompliant
    applications

    * A complete application-programming framework

    * A unified help system incorporating the environment’s own documentation and
    the standard man and info pages, the LDP FAQs HOWTOs, and application documentation
    stored in the /usr/doc directory tree (/usr/share/doc on LSB-compliant systems)'
