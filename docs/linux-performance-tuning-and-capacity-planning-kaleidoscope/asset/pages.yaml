    involved in the architecture of the system. This list should include the people
    who developed it, the maintenance group, sections that might be implementing business
    plans that use it, and people who can integrate with it in the future.


    Applying this data likely will depend on your infrastructure and environment.
    Everything is handled within a single company, the best route would be to figure
    out who is involved, in what manner, and build your structure from that—this could
    be from a manpower perspective or from an incurring cost perspective. Cost distribution
    can be set up at any point through internal billing infrastructures so that the
    cost of managing the system is balanced among all involved parties.


    If the system is to be used by both internal and external groups, this involves
    a more complex approach. In general, service agreements are needed to ensure that
    all people involved are guaranteed levels of use of the system. It goes without
    saying that these kind of assurances need to be in place when bridging organizations,
    especially when individual corporations are involved. This is where your capacity
    plan can start to shine. Because it takes into account all these groups involved
    and their respective growth strategies, with the allotted system availability
    guarantees, you can truly plan for the growth track and bring together the management
    infrastructure.


    # Creating the Group


    Many times part of the structure definition for the capacity plan will laying
    out a new management infrastructure to implement the plan over time. Given the
    capacity plan, you need to determine management overhead and calculate the number
    of people it will take to manage the system going onward, especially as the system
    grows. Can the system handle a quadrupling of load without adding more employees
    to staff it? If the system was designed carefully, this should generally be fine
    with self-sufficient systems, but a defined list still must'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Methods for Capacity Planning


    # CHAPTER 14


    identify administrators and services performed over the growth cycle, even if
    it is only for minimal component upgrades and operational maintenance such as
    backups. In general, the plan should account for at least a minimal increase in
    management over time as the plan is reached, the hardware''s capacity will need
    to be tested and will require tuning as implemented by administrators.


    As with any group created for this kind of work, it is important to select people
    with the correct domain expertise. If the system is bridging internal business
    structures, it might be helpful to enlist directly from the groups involved because
    there likely be specific domain expertise in each group involved. By making that
    this expertise is used correctly, you could build a more efficient team, resulting
    in a smoother implementation of the plan. In addition, this can prevent overlap
    of expertise, prevent extra resources from being brought in, and generally make
    better use of the resources available within the organizations involved.


    # # Outsourcing


    The previous section extolled the virtues of making sure that all the in-house
    talent was used to implement the capacity plan effectively. Why would outsourcing
    be an issue at this point? Simple: The system still might have needs that your
    organization is not equipped to handle. It does not make sense to lay out an internal
    infrastructure to do yourself. It might make sense to have someone perform some
    part of the operation. After all, the party in question might already learned
    the lessons involved; relearn those lessons in-house would present risks that
    shouldn''t be taken.


    A classic example of this is with bandwidth management. Most businesses are interested
    in developing and managing an application because they have the domain expertise
    relevant to the problem. But when it comes to making sure users get adequate bandwidth
    to the application and bringing in a new set of experts. If you''re working on
    a project that does customer relationship management, you don''t necessarily have
    a full staff on hand that understands the-management issues that might come up
    when deploying it.


    In this case, some kind of co-location company should be brought in to handle
    all of this for you and perform all the work on bandwidth management, guaranteed
    reliable power, and so. This saves the trouble of bringing the bandwidth to the
    company to manage, providing a 24-hour maintenance infrastructure, and so on.


    For example, consider the concept of laying the lines to the company to provide
    bandwidth. When this bandwidth is exhausted, upgrading the line can be a costly
    undertaking. But if this is managed by a service provider, it can result in significant
    cost savings. Realizing what should be done in-house, along with what should be
    outsourced, and then applying it to the capacity plan can result in a much more
    effective use of available expertise.


