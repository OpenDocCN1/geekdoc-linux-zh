  md: '# Tuning and Performance Mechanics

    PART IV


    But as mentioned before, localizing the storage in this manner is not recommended.
    Running a link to a centralized storage facility is highly preferred because you
    can centralize your storage, backup, and management. This also minimizes the need
    for failover systems such as the various RAID levels.


    Aside from volume management and location, there are other ways to manage your
    storage effectively, although most rely on policy rather than the operating system.
    With the network, high bandwidth requests should be deferred to off-hours. In
    addition, it is generally a good idea to watch the drive usage closely because
    most filesystems performance drop-offs as the partition on which they are resid
    fills up. This depends on your filesystem, but 75% usage is generally a good number
    to watch for. This can prevent overusage slowdown and alert you to storage shortages
    before the situation gets out of control. As you saw with the LVM, recovering
    from a filled partition is very simple.


    # Disk I/O Utilization


    For most server configurations, SCSI and Fibre Channel are preferred methods of
    interacting with your storage system. Even when using Fibre Channel, it is usually
    just a transport method to an array constructed of SCSI drives. In general, SCSI
    is known for confusing parameters, depending on what card is used, what speed
    devices are present on the bus, and so on. In general, there''s not much you can
    do to the kernel to speed it beyond what you configure in the driver section when
    setting up the driver. If you have a prebuilt system, specific options might be
    enabled for speed. If you are rolling your own kernel, be sure to find out what
    these options are and then apply them to your set of changes. By default, there
    is little in the kernel that will help performance, except for making sure that
    queue debugging is off; this will inject consistency checking into the SCSI subsystem.
    Nearly all performance gains will be found by tweaking the module settings for
    the specific driver in use.


    If you need to test the throughput of your card and drives, the standard dd tests
    apply as described elsewhere in the text. Other tests include:


    +   * dt—This is similar to dd, but it can do more than just a copy data. It will
    test all of SCSI devices for you.


    +   * lmmbd—This is part of the lmbench suite, which is also recommended in testing
    your drive systems. lmbench is a suite of benchmarks for various components of
    your system.


    +   * sg_dd—This is part of the SCSI generic suite, which can be used to test
    various types of SCSI devices. sg_dd is a component of the sg_utils suite, and
    is similar to the dt-program noted previously.


    +   * sard—This gives I/O statistics on mounted partitions and other devices.
    It collects data through a kernel patch that adds more informative statistics
    to the /proc interface, and can provide more insight about your system than the
    normal higher-level tools.'
