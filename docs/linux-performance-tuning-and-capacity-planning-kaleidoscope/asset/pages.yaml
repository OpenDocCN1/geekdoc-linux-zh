    In addition to just watching the top display, you can manipulate the top display
    in interactive mode and running processes. The interactive mode is invoked by
    pressing H while the display is running.


    What about understanding what tells you and knowing how to filter? A good example
    is simple filtering. In this example, a process is intermittently jumping to the
    top of the monitor. It might help to stop the monitor and start it with a few
    filtering options to get rid of information you do not want:


    ```

    $ top -i

    ```


    Still, you cannot catch the culprit in action. Next you can disable some of the
    information that you want by toggling on or off displays such the memory summary.


    The great thing about top is that it it provides a lot of different information
    quickly, and it updates periodically. For example, a process might be at the top,
