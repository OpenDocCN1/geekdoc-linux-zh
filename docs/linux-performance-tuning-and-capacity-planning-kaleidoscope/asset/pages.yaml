    With today memory prices, the importance of having large amounts of swap is lessened.
    When you''re deploying a machine that could be severely overloaded, it''s always
    good to have a large amount of swap space just in case. The traditional rule is
    to double the amount of physical memory, although, if you consistently it, that''s
    generally a sign that you need more memory.


