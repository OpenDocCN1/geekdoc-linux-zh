  md: '# Performance Monitoring Techniques

    PART III


    handy when doing failover and load balancing between devices. By making sure that
    all devices in a bonding set use the same hardware address, the kernel can selectively
    load-balance throughput with the set. As it hits the wire, it appears that all
    data transferred came from the same hardware address. The bonding set gets its
    hardware address from the first card that is added to the slave set.


    In a load-balancing situation, the kernel uses a round-robin method to balance
    output between cards in the set. If you are looking to use bonding as failover,
    only one card will be used at a time, but the others in the set will be used if
    one fails.


    At this point, bonding sounds like a good idea, but how do you actually do it?
    First, as mentioned, make sure you are running a compatible kernel, or add to
    your kernel with a patch, which controls the bonding set. This is available at
    www-maif.li/willy/pub/bonding/. (Willy Tarreau and Constantine Gavril are the
    current maintainers of bonding). Your vendor might have their own way of getting
    the tools you need. Check the vendor channels for possible information on this.
    If you need to do it by hand, don''t be alarmed; it''s very simple. After you
    download the ifensclave.c file run the following commands to compile and install
    on your system:


    ```

    # gcc -02 -s -o ifensclave ifensclave.c

    # cp ifensclave /sbin

    ```


    Now you need to configure your modules to prepare the system for the bonding module.
    It is assumed that bonding is enabled as a module, some parameters can be passed.
    If you read through this and determine that you don''t need to send parameters
    to the bonding module on load feel free to build it into the kernel statically.
    You will need at least the following line in /etc/modules.conf assuming that you
    have a single bonding device:


    ```

    alias bond0=bonding

    ```


    If you need more bonding devices, add more lines for each bonding device present,
    naming them in sequence bond1,bond2 and so on. Now that the association between
    the bonding device and the bonding module in the kernel is set, the bonding device
    itself needs to be configured. This assumes that the machine you are using a Red
    Hat-distributed distribution, but it can be modified to suit any vendor''s method
    of handling devices. Under Red Hat for each network interface are stored under
    /etc/sysconfig/network-scripts. Each ifcfg-* file corresponds to one of your network
    devices, whether they are Ethernet (eth*), PPP (ppp*), or something else. Add
    a file to specify the parameters for the new bonding interface as follows:


    ```

    DEVICE=bond0

    IPADDR=192.168.1.1

    NETMASK=255.255.255.0

    NETWORK=192.168.1.0

    BROADCAST=192.168.1.255

    ```'
