  md: '# Introduction and Overview


    # PART I


    to understand, but even after some minor examination, you can sometimes find entire
    subsystems that are not needed. Once I was customizing a Linux kernel for a workstation,
    I found several subsystems that I did not need, such as amateur radio and DSL
    subsystems. I removed all undesired drivers that I could identify to strip down
    the kernel and enhance performance.


    So what does all this achieve in terms of critical system resources? Obviously,
    not running services are not required frees resources. A trimmed kernel will load
    faster, and in some cases, depending on what drivers were removed, the kernel
    will work faster.


    Another important aspect of undesired services running on a Linux system is that
    undesired services are almost always unmonitored services. This is a serious security
    threat. Turning off unnecessary services improves system security as well as performance.


    # Reflecting Priorities in Resource Allocations


    The previous two sections discussed how to determine priority components of the
    system and how to remove or disable processes that are not needed. By doing so,
    you free the system to focus more on handling the important processes. Unfortunately,
    sometimes you must go beyond those steps to ensure that a system is performing
    to the best possible standard. For instance, you must understand which resources
    require the highest priority and determine how these relate to system-wide resource
    allocation.


    That might sound fancy, but it is not that difficult. Let''s look at a really
    simple case. Imagine that a Linux system is configured for two tasks:


    +   1. Run a php3-enabled Web server with a MySQL back end on the same server

    2. Serve as an FTP server for Linux updates (meaning temporary files)


    Php3 is a layer that can access the server or another server using its own language.
    In the case of this particular server, it will be communicating with another server
    running a MySQL-driven database.


    Both services are needed, and this system is the one that can do the best. It
    is obvious that the php3 to the MySQL Web server should have the highest priority.
    By allocation, I mean that it might be a good idea to limit the amount of disk
    space that the FTP processes have, to free them up for the MySQL processes. This
    is perhaps another oversimplification, but the idea remains the same: The allocation
    of resources should be proportionate to priorities. Essentially, they should directly
    reflect the planning or allocation of current resources.'
