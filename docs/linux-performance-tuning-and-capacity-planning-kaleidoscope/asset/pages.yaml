  md: '# Tuning and Performance Mechanics

    PART IV


    symbolic link to the current working directory of the process, and gives a dump
    of the environment that the process is using. This can be extremely helpful in
    making sure that your process is running with the right settings. If your Apache
    configuration is misbehaving, the environment as specified by the http child processes—it
    might be a simple matter of having the wrong environment configured. Useful bits
    are a symbolic link to the running executable, status about the process''s usage
    in memory, and a directory containing its file descriptors.


    # Presentation Areas


    Several directories provide information about the system, but they won''t help
    you much in tuning, except to point you in the direction where some of the load
    is coming from. The bus, fs, and SysV IPC directories all fall into this category:
    They give you information about various subsystems, but are not geared toward
    tuning. The bus, for example, gives you about each type of bus system has, devices
    present, and so on. The fs directory gives you NFS export data if that is enabled,
    and SysV IPC can give you stats on current SysV usage on your system. The kernel''s
    implementation of SysV has tunable parameters, which are described in the next
    section on kernel parameters. values are used mostly with applications like Oracle.
    Also, the net hierarchy can get you some interesting data about the network subsystem.


    # Modifiable Parameters


    Most of the interesting parameters relate to live tuning under the /proc/sys directory
    because this is where the sysctl interface of the kernel is active. Different
    areas that can be tuned include file limits, general system attributes, and vm
    balancing data. If you don''t see the values presented here, chances are good
    that your kernel doesn''t have sysctl control on the build. Refer to the section
    on "Recompiling the Kernel" for more information on turning on this capability.


    # Filesystem Limits


    Under /proc/sys/fs, several parameters affect limit what the kernel places on
    file operations. Here is an overview of what some of the relevant ones does. More
    information on a per-field basis can be found in the kernel documentation.


    +   - dentry-state—Entries are name-to-inode translation structures that are cached
    aggressively. This entry can be used to modify the number of dentries being used
    for caching.'
