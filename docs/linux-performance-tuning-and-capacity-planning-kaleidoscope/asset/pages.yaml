    filesystem (like ReiserFS), you can dynamically grow your partition without notifying

    users, let alone trying to schedule an outage reboot the system or perform take
    backups

    to between the old filesystem and the new. Because you can extend logical sets,
    you

    also configure a large set of devices, allocating only a base amount to each filesystem
    and

    grow each partition as needed. This helps that storage usage is more easily

    watched and that, in an emergency, extra storage can be injected anywhere you
    need it.


    When you create volume sets, they can also be stripped, which means that data
    will alternately

    be written to different drives in the set. This can yield performance improvements,
    although it

    might be better utilized in hardware. Of other little side benefits also exist,
    but that cov-

    er the large ones. The end result is a more manageable system, with a much simpler

    growth-management strategy.


    Depending on the age of your distribution, the LVM might not be included by default.
    If it was

    based on the 2.2 kernel and you added your own installation of the 2.4 kernel,
    you will likely

    need to get the users tools by hand or as a package from your vendor.


    When it comes to a high-availability machine requiring high demands of throughput,

    underlying bus system should be carefully considered. For SCSI-2, it might have
    been

    putting multiple busses on the same machine. With the data rates that SCSI-3 or
    the next stan-

    dard brings to the table, however, the card might swamp the PCI subsystem in some
    situations,

    though the data rate coming off individual drives isn''t enough to do this. Usually,
    multiple

    cards are needed only if there is a need for a lot of physical devices.


