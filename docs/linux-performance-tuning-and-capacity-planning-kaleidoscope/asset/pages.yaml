  md: '# Popular Unix Performance-Monitoring Tools for Linux

    CHAPTER 3


    It is important to note that we do not break down the tools by subsystem alone
    because there are very few subsystem-specific tools. Many performance-monitoring
    tools can monitor all the subsystems or, as might noted in Chapter 1, “Overview
    of Performance Tuning,” by the three: CPU, disk, and memory.


    # Interpreting Results and Other Notes


    Before diving into how each tool works and what the returned information means,
    I have to throw out a disclaimer. Most performance-monitoring tools used in a
    somewhat random pattern can sometimes yield random results. It is quite common
    for documentation that comes with a tool to state that scripting with it might
    yield better-term results.


    To better understand this, think about real performance and perceived performance.
    Even system administrator can be tricked into “freaking out” over a quick loss
    of performance. A prime example is with quick compiling programs. If you happen
    to run a monitoring tool around the same time that programmer is running a compile,
    it might appear that the system is being taxed when, in fact, it is not under
    a sustained load. Most likely you already realize that systems will occasionally
    face a quick burst load that does not harm the overall performance of the system.
    However, do all users or staff members realize this? Most likely they do not—remember,
    a little user education never hurts.


    # All-Purpose Tools


    Unix provides many tools for the system administrator to monitor systems. However,
    it is worth noting at this point what you read about these utilities might be
    different, depending on your Linux distribution.


    # The top Utility


    Arably one of the most popular tools for performance monitoring on Unix systems
    in general is the top utility. As its name might suggest, this tool displays the
    top CPU-intensive processes in real time. The top display refreshes every 5 seconds
    by default, but can be modified with the -s option for longer or shorter intervals.
    The top utility provides an interactive mode for modifying process behavior. The
    following is the syntax for starting top:


    ```

    $ top

    ```


    Figure 3.1 shows an example of top output to a standard terminal screen.


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_63_0.png)'
