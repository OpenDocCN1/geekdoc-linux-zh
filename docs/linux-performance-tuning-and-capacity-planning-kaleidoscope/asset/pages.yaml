    # Other Free Utilities


    The ibilio FTP server has a plethora of utilities available for Linux performance
    monitoring and tuning. Additionally, other Web sites have host or list utilities,
    including these:


    +   - Freshmeat: http://www.freshmeat.net/

    - Appwatch: http://www.appwatch.com/


    In addition to all the command-line tools, many of the ibilio utilities are GUI-driven.


    # Summary


    Although traditional Unix tools are a great addition to the kit for the performance
    analyst and system administrator, sometimes it is best to use a tool that is designed
    specifically for the Linux kernel. Additionally, the filesystem interface to /proc
    provides an easy way for the sysadmin to write his own scripts and programs to
    analyze the kernel.'
