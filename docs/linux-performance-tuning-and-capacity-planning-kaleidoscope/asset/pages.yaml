- img_proc: true
  md: '# General Application Tuning


    Before you start throwing hardware at the problem, make sure that your application
    is correctly configured. Be sure to turn off components or capabilities of the
    app that you are not using. For example, if it is an audio-streaming tool that
    is taking in a feed and streaming to some clients, you might not need the content
    after it is finished with the data. Make sure that it is doing only the streaming
    conversion, not trying to save the contents by converting it to another codec.
    This might sound obvious, but most gains can be made by analyzing your system
    and making sure that it is doing exactly what you need—and nothing more. Because
    it is highly dependent on the needs of the system, this task must be done on a
    case-by-case basis.


    As mentioned in the earlier section "Hardware Solutions," it might also be a good
    idea to know about the capabilities of your application. If you find that your
    application cannot benefit from more CPUs and you already have the fastest hardware
    possible, it is probably time to look for another solution—which probably means
    a more capable piece of software.


    # Specific Clustering Solutions


    If you are truly running up against the capabilities of a single machine, clustering
    is probably the next best. In the realm of scientific applications, large performance
    gains and scalability can be achieved by writing your code to be cluster-aware
    or by selecting products that can take advantage of a cluster, if present.


    # Beowulf


    When most people think of clustering and Linux, Beowulf clusters are the first
    systems that come to mind. By writing code to take advantage of these clustering
    capabilities, calculations can be distributed across a group of machines relatively
    easily. There are a few prerequisites, though. One is that your problem be capable
    of being inherently parallel. If it relies on serial calculations and cannot be
    broken into independent operations, having a cluster present will not help. Also,
    the code needs to be explicitly written to use the cluster, which might not be
    the case. In general, clustering applications are custom-built to the problem
    at hand, although a few applications can be run off the shelf and can use a local
    cluster.


    Third, the networking infrastructure needs to be very solid. Because a great deal
    of message passing is going on in the system, the interconnection needs to be
    as fast and as capable as possible. This means using switching fabrics, and maybe
    the network bottleneck described in Chapter 7. Although this places a lot of preconditions
    on the application, it is generally thought to be the most capable and scalable
    solution. Refer to http://www.scyl1.com for more information on deploying and
    using a Beowulf cluster.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Although it''s not as well known as Beowulf, the Multicomputer Operating System
    for Unix (MOSIX) can give you clustering capabilities without requiring that your
    applications be written explicitly for a cluster. MOSIX transparently migrates
    processes to other nodes in a cluster, all from within the kernel. It can balance
    your load by migrating processes off a machine that might be swapping over to
    a machine that has free memory. Using Direct File System Access (DFSA), processes
    that have migrated away from their home can still perform I/O operations without
    being forced back to the home node. Currently, the GFS and MFS filesystems are
    DFSA-compliant, allowing this capability.


    Because the migration is handled inside the kernel, the operation is hidden from
    the application''s view. Your application doesn''t need to have any idea that
    it is running inside a cluster, and it doesn''t need any specific alterations
    to its configuration or code base. It takes a small amount of planning to make
    sure that the machines are correctly balanced for the application and that the
    network is up to load. However, when compared to applying normal clustering technologies,
    MOSIX is very easy to deploy.


    Some caveats to MOSIX clusters prevent them from being applicable in your specific
    system. One is that shared memory cannot be migrated between the nodes, and processes
    using mmap calls cannot be. Other restrictions also exist, but in general, if
    your application doesn''t rely on these methods, MOSIX might be the right path
    for you. For the cost of a set of new systems, you essentially have a large SMP
    machine that communicates over the network and doesn''t require any modification
    to the application you are running. Compared to systems that require specific
    code rewrites to utilize clusters, this can be a very cost-effective solution
    that is easy to deploy.


    Clustering is a scalable technology that, when applied correctly, can make a CPU-bound
    system almost indefinitely scalable. But this requires you to specific knowledge
    of the problem domain, and it might require specific code to be written to take
    advantage of the cluster. Both techniques described here have been used in production
    environments for years, though, and have worked on very difficult problems; if
    you can''t scale your system via the network, a Linux cluster might be what you
    need. In general, MOSIX is helpful when you can''t directly parallelize the code
    yourself, and Beowulf can yield gains if you can write to take advantage of the
    system.


