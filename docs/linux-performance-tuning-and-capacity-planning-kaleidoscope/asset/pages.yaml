  md: '# Tuning and Performance Mechanics


    +   **Character devices**—This might be a misnomer for newcomers. Various types
    of devices fall under the character device umbrella. From different mouse types
    to realtime clocks to direct video rendering support can be enabled from here.


    +   **Multimedia devices**—The only component present this is Video 4 Linux, or
    V4L. This enables applications using the V4L set of system calls to work with
    video and audio capture hardware. Cards as TV tuners and radio cards are present,
    but other types that may be qualified as multimedia have fallen in other configuration
    areas.


    +   **File systems**—As you might guess, you enable Linux’s support for various
    filesystem types under this tree, along with partition types. Linux support for
    many types of filesystem formats, although normal users won’t need support for
    most of them. Ext2 is the default filesystem format, although ReiserFS is rapidly
    becoming a favorite because Network filesystems are also in this area, where you
    can enable support for NTFS client or server support, with SMB filesystem support
    so that you can mount drives that are remote Windows shares. You can also enable
    support to read NTFS drives on your system. By some of the options here, they
    can be compiled as a module and inserted on the fly without rebooting, don''t
    worry about making sure that you can directly support everything that you might
    need in the kernel.


    +   **Sound**—Again, as you might guess, this is support for various sound cards.
    Many drivers are integrated into the kernel, but the ALSA project (http://www.alsa-project.org)
    also maintains a separate set of drivers that could work better for your hardware.
    If your hardware is only marginally supported in the kernel, either because it
    is poorly documented or because it is on the market, you might want to look at
    the ALSA baseline.


    +   **USB**—If you USB devices, this will enable the USB subsystem. With the SCSI
    subsystem mentioned previously, it might be a good idea to enable this, to save
    the trouble of enabling USB the down if you have a device to use it.


    This covers the general sections of configuration—for the normal user, the best
    preset configurations should be chosen for you already, with a few possible exceptions.
    If you’re not normal user (and you know who you are), you might need to make many
    changes to get things just the way you want. If you are looking to reduce the
    memory footprint of the kernel, building your own kernel is a good way to trim
    any unwanted fat from the running system. This won’t save you as much as correctly
    configuring all applications present and disabling unused services, running a
    slim kernel can save some space and remove ambiguities about what might or not
    be present in a running system.'
