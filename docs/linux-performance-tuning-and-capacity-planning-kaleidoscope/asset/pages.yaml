- img_proc: true
  md: '# I/O Performance Management


    Most of the details of I/O performance management are covered in later chapters
    that discuss the various utilities for monitoring and interacting with different
    I/O subsystems. A general overview is needed at this point, though. The most important
    thing to keep in mind when managing your I/O is the underlying architecture. Know
    exactly what you want to get out of the system, and determine whether the system
    is going to be up for load.


    For example, if you''re looking to do video streaming, don''t use a slow disk.
    If you want to do operations that could be done in parallel, get an SMB box. This
    might sound simple, but it is very important to know whether you''re fighting
    a bad application configuration or whether you are running up a wall because of
    the physical capabilities of the hardware. If you have too many devices on the
    PCI bus pushing too much data across it, delays and missing data are likely possibilities,
    and not reconfiguring of the kernel, tools, or applications will fix the problem.
    Make sure that the hardware can handle what you think a peak load will be.


    Sometimes the easiest out of an I/O bottleneck is to change how you''re doing
    the work. Rather than do all work on a real disk, configure the system to use
    ramdis and keep temporary storage there. This can speed interaction with that
    data, and at the same time reduce the strain on the disk underneath.


    # Layers for File I/O


    The Logical Volume Manager (LVM) was introduced to the kernel in the 2.3 development
    cycle, and it provides a clear way of handling layered file operations. You can
    picture LVM as sitting on top of the filesystem layer. It can join multiple disks
    to create single virtual disks. This can be done at runtime without interrupting
    normal work on the filesystem that users or applications are using. If your home
    directory is filling up, you can use the LVM to add another disk partition to
    the set; as it is joined, the /home partition usage will drop proportionally.
    Simply, this removes the need for painful reing in the future as disks fill up
    and need to be reconfigured.


    There are other means of layering file operations as well. Within the kernel is
    a filesystem interface called the VFS layer. This provides a clear interface for
    user applications to interact with mount points, regardless of whether the filesystem
    is used in ext2, nfs, cramfs, or something else. The software RAID implementation
    also sits within this layer and can provide RAID across devices without having
    physical hardware to do the work.

    Interests, there are also filesystems as PerFS that sit behind this interface
    and allow normal file operations to be done on remote HTTP sites. For example,
    you could use the command /mnt/perfs/http://www.com/index.html, and the file would
    be retrieved and cataloged as if it were a local file residing on a local disk.
    Allowing filtered like this can open all kinds of interesting possibilities without
    forcing you to reinvent the wheel when interacting with the data; it behaves as
    a file, just like everything else.'
