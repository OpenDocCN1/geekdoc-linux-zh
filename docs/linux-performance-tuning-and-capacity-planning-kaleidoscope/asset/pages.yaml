  md: '# The Linux Kernel

    CHAPTER 9


    You should have a good idea of how to manipulate your kernels. The capability
    to keep multiple versions around is very useful in practice. For example, if you
    are testing a series of kernels on your hardware, you can easily add the kernel
    source, configure, boot the new kernel, and still have the old one just in case.
    If something goes wrong, such as a driver not being up to yet, the old kernel
    is only a reboot away, and the system will be back as it was before the upgrade.


    Leaving the old kernel at the boot default might be a good idea until you are
    comfortable with the new one in all situations. This way, if something goes wrong
    with the box and it forces a reboot, the old safe kernel will be the default when
    the system comes back. One thing to keep in mind is that both kernels have similar
    capabilities. If you add a drive with a ReiserFS filesystem using the new kernel''s
    support for ReiserFS, but the old kernel doesn''t understand the filesystem, reverting
    back to the old kernel is no longer a safe option. If you change the kernel and
    not the underlying system, as you should, this problem shouldn''t occur.


    # Choosing the Right Drivers


    How do you know which drivers to use? A rule of thumb is that, for your given
    hardware, it is usually a good idea to use the version of the driver that is integrated
    into the kernel. To get into the kernel, drivers are reviewed by more people and
    get wider testing because people have direct access to it. But there are exceptions
    to this rule. Sometimes the kernel driver is stable, but the developers have pushed
    the driver further ahead and can now take advantage of advanced portions of the
    hardware—they haven''t submitted a new version to the kernel list. Sometimes you
    need to be able to use that extra capacity and need to use the external version.
    (A good example of this is the btv driver, which provides a driver for TV tuning
    cards. The kernel version tends to lag behind the current external version. In
    this case, it exists with the kernel as an external set of drivers, or as a patch
    to the kernel to bring the kernel up to speed.) Sometimes the only source of a
    driver is the hardware vendor, and that is your only choice.


    Whatever the case is, there can be justifiable to look outside the kernel for
    drivers. Regardless of whether the driver was in the kernel or external, though,
    the system should be thoroughly tested to ensure that it is up to handling the
    expected need. It should be assumed that if the driver is in the kernel source,
    the system should be deployed with it immediately.


    In reality, having multiple versions of a driver can be a good thing. On your
    needs, you might end up with a choice, such as between a more stable but less
    hardware-capable kernel and a newer version with less testing but one that lets
    you take better advantage of the hardware. If you need stability over the absolute
    latest hardware, the obvious choice


    | THE LINUX KERNEL |

    | KERNEL'
