    of data are created. In terms of your business’s planning, it is probably beneficial
    to find these patterns and make sure that everyone collects at least the baseline
    statistics. Not only will you get more data for analysis, but it might also uncover
    bottlenecks in your systems as you compare the sets.


    # Achieving a Global View


    As mentioned before, it is important to take a global view of the system over
    time. The more you know about where your system came from and where it is intended
    to go, the more accurate your capacity plan will be. Search for a high-level view
    most likely unearth aspect that a certain business director could want to extend
    in the future. Without this knowledge, the capacity plan will end up blinded down
    the road when these plans come out of the closet and the system is expected to
    be capable of handling them.


    If you are working on planning the future of an already existing system, another
    angle could help: information on what group originally put it together and, more
    importantly, what kind of patterns the system has already suited. If you know
    that the system historically had bottlenecks in drive utilization and network
    slowdown during high rates of growth, you should most definitely take this into
    account. This indicates that a large portion of the work is I/O-bound and that
    extra capacities must be incorporated into the capacity plan to ensure smooth
    growth patterns in the future.


    # Using Upcoming Technologies


    When you are projecting the path of the system in the foreseeable future, it is
    important to know what is going on in the relevant technology markets that might
    have an impact on your system. This—requires in-depth knowledge of what is going
    on in the relevant markets and an understanding of how well the new technologies
    might impact your system. You must consider this from an increased performance
    perspective, and you must also know how disruptive it will be to implement them.


