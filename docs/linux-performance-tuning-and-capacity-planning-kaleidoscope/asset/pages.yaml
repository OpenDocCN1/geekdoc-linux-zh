    +   * W #—Gets or sets the drive''s write-caching setting. This is off by default.
    If used, keep in mind that it introduces an ambiguity whether data sent to the
    disk has been written.


    +   * m #—Sets the sector count for numbers that can be transferred during a single
    interrupt. The default is one sector, 8 is a common value.


    +   * c #—Enables (1) or disables (0) 32-bit I/O burst. A special value of 3 is
    to allow special sync sequences, but this is not an option as 1, and it might
    not be safe on your hardware.


