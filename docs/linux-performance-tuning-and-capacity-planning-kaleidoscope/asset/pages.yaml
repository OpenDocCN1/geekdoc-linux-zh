    though, the load balancer selects the machine that will handle the request, modifies
    the Ethernet address of the data frame to match the requesting server, and rebroadcasts
    it on the local network. At this point, the handler server responds to it, handles
    the request, and ships the response back to the client. The catch is that all
    handling servers need to be on the same physical segment. Although this introduces
    everyone onto one segment, the request for data would be smaller than the data
    itself and can be configured to leave the network through different paths. This
    also saves on the initial server because it doesn''t have to tunnel the data—it
    only needs to select a server, modify the packet, and drop it on the back-channel
    network. And this tunneling approach would scale cleanly to more than 100 nodes,
    still without a load balancer.


    Getting a light overview of high availability and load balancing is probably more
    dangerous than knowing anything about it all. However, you should have enough
