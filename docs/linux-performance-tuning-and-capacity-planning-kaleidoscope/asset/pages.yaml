  md: '# Aspects of Performance Tuning

    CHAPTER 2


    On the other end of the drive spectrum are solid-state drives, which historically
    have smaller capacities but a much higher cost. The advantage is that there are
    no moving parts, which yields large increases in drive speed. Typically, they
    are used for embedded systems because of their smaller form factor, but the price
    differential is failing. As a result, these drives find their way into other soon.
    If you need to build a cluster of machines for intensive CPU work with minimal
    disk interaction, using a small solid-state drive on each box would greatly increase
    the CPU per square foot.


    Linux offers solid support for all types of disks and will even support a compressed
    filesystem on a solid drive, as in case of a solid-state drive. If you''re looking
    for something with wide availability, Fiber Channel access to a RAID array is
    the way to go: It gives you shared access to a common disk pool, fast interconnects,
    and consolidated drive management. For many servers, IDE and SCSI can be used
    interchangeably, although if you know that the box is going to be disk-intensive
    you don''t want to drop money on Fiber Channel, SCSI will give you the biggest
    performance.


    Note that although Linux supports a wide variety of drives, in many instances
    software tuning will do the trick. Refer to the later chapter on drive performance
    for specifics on how to tune your existing hardware to get the most out of it.


    # Managing Disk Space


    As mentioned before, the LVM integrated into the kernel as of version 2.4 is a
    great addition to Linux''s drive- management suite. It allows easy integration
    of using unused drive space into an already mounted filesystem. Planning your
    system around the LVM is a good way to ensure expandability as your system grows.


    In managing the drives themselves, there is a large industry push toward area
    networks (SANs). These offer high-availability drive space, with high-bandwidth
    connections, all collected in a central location. Rather than having 10 servers
    in your server room, all with separate RAID cards and individual storage and backup
    mechanisms, a SAN puts all these drives together in a common pool. This can seemingly
    introduce single points of failure, but the hardware in the SAN is far more tolerant
    than what would be seen on an individual machine because the failover hardware
    is more effectively used. Depending on your needs, a SAN can be configured to
    replicate between physical locations. Generally, each machine that needs access
    to the drives gets a Fiber Channel card, connecting to a Fiber Channel switch
    that allows crossover to the drive array. This keeps drives co-located, simplifying
    storage immensely. Also, by having all the drives in the same physical location,
    you can connect a single tape loader to the SAN and back up the data directly,
    without transporting large amounts of data over the network during backups. This
    speeds the backup process and reduces the impact on your operational network.


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_51_0.png)'
