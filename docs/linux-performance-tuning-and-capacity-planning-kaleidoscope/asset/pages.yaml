  md: '# Thinking About Capacity Planning

    CHAPTER 13


    its throughput without some serious reorganization. That said, doing everything
    that you can from the global perspective with growth in mind will result in a
    resilient system as you can reasonably expect.


    # Classic System Requirements


    A myriad of different factors might exist in your system, but a few core requirements
    need to be addressed first. This might sound elementary, but it is a good way
    to focus your planning process without feeling swamped with all the possibilities.
    These areas include the processor, memory, drives, the network, and, to a lesser
    extent, bus subsystems.(They usually go in hand with the processor architecture
    you are using.) Sounds simple, right? It should.


    After you have laid out the requirements for these core subsystems, the rest should
    fall into place easily. Because much relies on these parts, after this is solidified,
    narrowing the specs on the types of peripheral systems can become your focus,
    without being meshed in the cloud of the whole system. This is not to say that
    the process can be completely taken apart—if specific requirements call for a
    set of physical cards on a certain architecture, this must be taken into account
    when selecting the CPU, the architecture, and the level of expandability on the
    machine. In general, though, focusing on the core components can simplify the
    process.


    # Application-Specific Requirements


    When doing capacity planning for a system, hardware is generally considered more
    important because it is harder to manage from within production. However, you
    should also consider application requirements very carefully. Whether it is an
    in-house application or a large application server, the requirements placed on
    hardware determine what hardware ultimately is needed.


    Aside from being to list the items on your application''s list of features, it
    is always good to know the software inside and out—especially when it comes to
    how it will behave under the load you are preparing for it. Sort of being an expert
    on it, knowing its real system load as compared to what the vendor promises is
    advantageous.


    Following the application''s market is also a good idea. If you know (or guess)
    where the application will be in a year or two. Based on trends in the industry,
    you might want to be able to handle its upcoming capacities. Something released
    down the line might fit in nicely with your application when it hits the street.
    However, this will likely incur some additional overhead for the system or require
    specific type of hardware that you can get today. If you plan ahead for it, when
    it comes, you''ll have the hardware in place. What''s more, you will only need
    to perform a normal software upgrade to take advantage of the new features.


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_257_0.png)'
