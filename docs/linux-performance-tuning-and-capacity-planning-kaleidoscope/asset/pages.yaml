- img_proc: true
  md: '# Case Studies


    PART VI


    # Configuration


    As explained earlier, LVS works by having a central director (with failover) arbitrates
    connections for the cluster. To install this, a single central machine (the director)
    needs to be built and the LVS code installed on it. The details aren''t shown
    here, as they are in the software, well, some local software is installed, and
    there is a kernel patch that needs to be put in place on the director.(Your vendor
    might ship the kernel with the ipv support already built in.) There are patches
    for the 2.2 series, which is considered to be in production at this point, and
    also for 2.4, which is stable but still under testing. Once the patch is installed,
    a series of kernel options needs to be enabled and the kernel reboot.


    Once the director is built and running, the real servers need to be installed.
    VS-DR is determined to be the best configuration. As described earlier, LVS can
    run in a NAT configuration or Direct Routing. With NAT, services are simpler because
    everything back through the director machine. But this introduces a bottleneck
    at the NAT director. Direct Routing, or DR, is generally chosen over this solution.
    In this case, every machine in the cluster is required to have a routable address
    so that it can directly talk back to the client for the response rather than through
    the controller: While in this case is not likely that there will be a huge load
    on the director, it is generally advantageous to use direct routing if possible
    in the factor of growth. Since it only requires a few IP addresses, the gain of
    able to grow the cluster nearly infinitely is worth the


    Now that the director is configured, and the real servers are in place, there
    is one more configuration piece to put in place—the failover for the load balancer.
    With the heartbeat component of the Linux High Availability project, this failover
    can be handled easily. The actual implementation process is covered in the heartbeat
    at least should be configured on the director server. By communicating over two
    interfaces, it can watch the master server, and in the event of a failure perform
    full IP address takeover. This machine needs to be configured in the same way
    as the master server so that it can rely on it in an emergency.


    In the end, the resulting structure is simple—there is a central server (with
    failover) that handles the incoming traffic, and a set of real servers that are
    going to do the real work, all connected to the required networks. Services need
    to be configured on the director, with a file containing all of the relevant data
    network. From this configuration, a file is generated that needs to be on the
    director and all of the real servers with ipvadm.


    Once everything is running, the cluster is ready. Tests can be performed to see
    which one is responding to each request, which should be a different server each
    time assuming the normal scheduling rotation. By default, simple round-robin is
    used, as most clusters consist of identical hardware. However, weighted round-robin
    can be selected to give more work to larger boxes. LVS also supports least-connection
    scheduling, which directs new requests against'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'machine in the cluster with the fewest connections, and weighted least-connection.
    This again is the same algorithm but with weights toward individual machines.


    As you can see, it''s really not that hard to deploy a cluster with all that is
    needed is an IP address, a director server (and hopefully a failover machine for
    it), and some real servers to do the work. In some cases, this might be used to
    distribute access to file data, over several protocols, or as a way to distribute
    processor-intensive requests. In some situations, it could be used as a way to
    distribute a view on an even bigger system behind the cluster, if that is what
    is required. The system is extremely flexible and fairly simple to set up. As
    it runs on any commodity hardware, deploying a cluster will only cost as much
    as the hardware involved and the time used to bring up the nodes, assuming normal
    management of the machines over time.


    # Summary


    Although the case studies in this chapter have attempted to cover the big subsystems,
    many different types of performance issues can crop up on both server and client
    Linux systems. Hopefully the case studies in this chapter showed how gradual insights
    can serve as administrator. A great deal of other resources are also available
    on the Web and in other publications discussed in the next chapter.'
