- img_proc: true
  md: '# Conclusion


    While this was a fairly complex example, the hardest part was diagnosing the problem.
    The longest path was to find the solution, but in reality, all could have been
    done in a matter of minutes, and in general, it is just as easy to run dmesg.
    In situations where the culprit is not known directly, dmesg is a good first pass
    to head off any kernel level issues.


    While this was a known issue, it was resolved in the 2.2 series and is not a factor
    in the 2.4 series. This should not be taken as a common problem with any of the
    current kernel series.


    # Linux Virtual Server (LVS) Walkthrough


    # Concept


    As described earlier, the LVS project allows for the clustering of machines so
    that they appear to be one single service. The most common case for this is in
    web farms, where there is a need to make a large set of machines to respond to
    a single routing point. Some people implement round-robin DNS to handle this,
    but this process is now resilient to failures. (If you have three machines in
    round-robin DNS, and one fails, DNS will still send out one third of all requests
    to the dead machine.) LVS, with failover applied services like the Linux High
    Availability project, provides a nice way to distribute the load safely. Though
    it was discussed earlier, this deserves some coverage with an example. It is a
    core component in capacity planning operations, due to the fact that it can provide
    cheap, nearly linearly-scalable solutions for a minimal cost in hardware.


    # Assumptions


    If LVS is selected as an option, there must have been a determination at some
    point that there is a strict need for this capability over a traditional web server
    configuration. In many cases LVS is used to aggregate bandwidth which could not
    be achieved with a single machine, in this case, let''s assume the service being
    configured is HTTP, and it can''t be served speed from one machine to processor
    speed and memory usage.


    In our capacity plan, it was determined that our client base, we need to be sufficiently
    handle 300 simultaneous users. In testing, it is found that the default server
    configuration, about 100 users can load the map that begins to become a factor,
    and the processors to hit peak usage. It is feasible to triple the processor capacity
    and add more memory, this won''t fit with the growth model, which assumes a doubling
    growth over the next few years as more users migrate from the previous system.
    In these tests, since the uplink is relatively slow, the full network throughput
    is not a factor. But as the system grows, as it is likely to do so quickly, it
    would be nice to just drop new machines as needed and add them to the cluster
    set, which is why LVS is being used.'
  merge: -1
