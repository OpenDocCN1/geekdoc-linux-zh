    on files themselves, or relying on the network sharing server to deal with the
    locking mechanisms. But with multiple machines sharing the same physical storage,
    there needs to be some coordination in place to determine who has what access
    to individual pieces of data. DMEP provides the mechanism to support this. Because
    it is a relatively new standard, DMEP in hardware is not common yet, but it is
    operational in software for a while through a memexpd daemon, which is software
    daemon implementation of DMEP. Machines that have to the drive array coordinate
    all the files in the GFS pool this server, so it is helpful to have this implementation
    in hardware for speed. If it is deployed in software, it is highly recommended
    that a failover server be in place to take over in an emergency. The software
    implementation requires persistent storage for the locking data. Therefore, the
    failover machine needs to have direct access to this data so it can carry on the
    duties of managing the cluster. The locking data can be a bottleneck, it is important
    to make sure that storage is fast. A solid state drive might be appropriate for
    this situation.


    Under the hood, a lot of coordination is needed to maintain consistency in the
    drive pool. With GFS, no single machine is the master of the storage space, with
    the possible exception of a software implementation of the locking daemon. Because
    of this, each machine needs to be capable of removing any other from the cluster
    if it fails to respond correctly. To allow this, all machines must constantly
    ping or perform a heartbeat-like check against the global lock and check each
    other''s order. If a machine stops talking to the lock and becomes unresponsive,
    node must be taken out of the cluster to prevent corruption of the filesystem—the
    unresponsive machine might have held locks that are no longer valid. Taking the
    questionable out of the loop can be done in many ways, ranging from using hardware
    to physically cutting the machine''s power, disabling it with software methods.


    GFS can be very useful in environments where storage is centralized and there
    is a pressing need for large amounts of file operations that do not place heavy
    loads on the network. GFS can simplify the management of the SAN because a portion
    of the disk array be handled as one segment rather than doling out small pieces
    to each individual server. Sharing the filesystem is as helpful as normally conventional
    methods such as NFS or Samba, although it allows direct access to the hardware
    and saves the overhead usually placed on a file server. The hardware side of the
    implementation is still catching up, but GFS can make working with centralized
    filesystems much easier than it is in the past. As it stands, a GFS implementation
    exists for Linux at http://www.sistina.com/gfs. It will work; however, management
    of the GFS cluster will become simpler and faster when the DMEP protocol becomes
    more prevalent in the underlying hardware, reducing the dependency on a software
    implementation as memexpd. As far as SAN support goes, vendors are constantly
    moving their SAN solutions forward, and you should refer to your vendor for the
    latest information on Linux support for their SAN products.


