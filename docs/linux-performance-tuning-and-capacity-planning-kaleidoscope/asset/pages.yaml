  md: '# Performance Monitoring Techniques

    PART III


    Introduced with the Pentium Pro, the Processor Address Extension (PAE) provides
    a means of performing 36-bit addressing on a 32-bit machine, with hardware changes
    and a kernel that knows how to make use of it. This causes a bit more work in
    the kernel''s VM tables, allows addressing of up to 64GB of RAM without jumping
    to a 64-bit architecture, which can yield large cost savings. Without unnecessarily
    going into the details of how this works, the kernel breaks the memory above the
    4GB mark into 3GB chunks. These 3GB chunks can be allocated as address spaces
    for applications, although this still limits a single process to 3GB within its
    address space.


    If you need an application to use up to 64GB of RAM as one solid address space,
    you should look into using 64-bit architecture. Linux runs on several and is well
    established, especially on the Alpha architecture. This will make sure that your
    requirements are fulfilled, and you will get the other benefits of using a 64-bit
    architecture. PAE will cease to be applicable on systems with the introduction
    of Intel''s 64-bit offering.


    # Contiguous Memory Spaces


    Occasionally, your application might need to have a large portion of data in one
    contiguous area. Although this is generally limited to imaging drivers that need
    to have buffers ready for video capture, you might need it for another reason.
    The concept is fairly simple: At boot, a large portion of memory is set aside
    in a contiguous block for use. If it isn''t done, general memory use by normal
    applications could result in fragmentation that when the buffer is needed, a large
    chunk cannot be found. This capability resides outside the normal kernel tree
    in a bigmem patch, although it might be an integrated capability with the kernel
    that ships with your vendor''s distribution. Check with your vendor about this,
    or get the newest kernel along the bigmem patch to roll your own.


    # Dynamic Buffers Cache


    As described throughout the book, Linux makes heavy use of caching whenever it
    can. Because of this, it will appear at all times that your memory is in—and,
    in a way, it is. But as applications need the memory set aside for buffers, the
    kernel releases its buffers to make room for allocations by applications. Do not
    be alarmed, as a result of this, the system swaps out a little bit of data. This
    is normal. If the kernel decides that some programs don''t need to be in memory,
    as the gets attached to your other virtual terminals that haven''t been used in
    two months, it swaps them out. unused code leaves memory, the application requesting
    memory gets its request filled, and the kernel continues to use all or more of
    the buffers it had previously. Refer to Chapter 9, “The Linux Kernel,” for information
    on how to manipulate this cache.'
