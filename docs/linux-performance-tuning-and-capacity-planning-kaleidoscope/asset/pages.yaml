  md: '# Tuning and Performance Mechanics


    # PART IV


    The sixth and seventh parameters are the age_buffer and age_super fields. These
    specify, in jiffies, the maximum age for data buffers and filesystem metadata
    blocks before updates take place. A jiffy is a unit of time as measured by the
    kernel based on the clock present for the architecture. On most architectures,
    this hardware interrupt happens 100 times a second. A jiffy corresponds to this
    interrupt rate. When setting this value, make sure to use hundreds of a second
    as your basic unit.


    As you can see, the dot-ish parameters are fairly complex, and they can affect
    system performance in many ways. The example given earlier in the book is a decent
    example of finding a good set of numbers for a machine that is performing file-serving
    operations. Depending on your needs, you could come up with a different set, if
    you need to modify your parameters at all.


    The next file, buffers, enables you to specify the minimum amount of system memory
    to be used for buffer memory. The default is 2% with most configurations, and
    rarely used to change this. Because Linux caches so aggressively, it will generally
    use a lot of the system memory for buffering, but it is rare that a configuration
    would be so tight that it needs to steal the remaining fraction of buffer memory
    from the cache.


    Next is the pageswap file, with three values: the minimum number of free pages
    allowable, the low point to the kernel to start swapping, and a high value to
    allow the kernel to gently swap. Depending on the architecture, the kernel maps
    memory to 4KB pages internally. Based on your total system memory, it will decide
    on sane values for these variables. For the minimum, the kernel watches that it
    never allows applications to claim enough pages to drop below this point. If this
    is reached, the remaining pages can be allocated only by the kernel itself so
    that it can continue to perform house-cleaning operations and keep the system
    going. If the free page list hits this low number, swapping becomes a priority
    for the kernel. Until that point, it swaps as little as possible to keep performance.
    The kernel uses jiffy as a metric to start swapping data out, but not aggressively.
    Thus, free page counts anywhere from high to low are considered swapping ranges,
    to various degrees. If the system enters into the high range only at peak load,
    then you have a memory shortage. The system will not grind to a halt immediately.


    kswap controls the activity of the kernel paging daemon. As the system becomes
    loaded, memory demands rise as allocations become fragmented. Kswap runs as a
