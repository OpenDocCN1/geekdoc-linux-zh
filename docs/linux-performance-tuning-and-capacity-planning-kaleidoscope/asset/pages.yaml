- img_proc: true
  md: '# Tuning via the /proc Interface


    As explained earlier, the /proc filesystem is an in-memory filesystem that provides
    hooks to the kernel. By echoing values to certain files in the filesystem, an
    administrator can modify the behavior of the kernel without interrupting general
    usage. With a root login, simply echoing specific data to a file under /proc/sys
    will modify kernel behavior. It should be noted, though, that this is not to be
    handled lightly. For nearly all applications, the kernel is well balanced to handle
    expected loads. Only if you know that there are specific updates to be made should
    you tweak the kernel—and even then, make sure that what you know is being changed
    on the other side of the kernel wall.


    More information, the source for all of these controls, can be found under /usr/src/linux/documentation.
    Presented here is an overview of what is contained under /proc, along with a few
    examples of how to interact with it. If you really want specific details on how
    these values are manipulated within the kernel, the source code is the best place
    to get solid details. However, this generally requires more of a time than the
    administrator wants to invest.


    Note that to use the sysctl interface, you must have it in your kernel. Always
    ship kernels with the interface enabled, and the kernel configuration (when loaded
    by hand) defaults to on /proc/sysctl. It is important to make this distinction;
    /proc is a view of the kernel, but sysctl provides the means to actually push
    new behavior data into the kernel. The only time that sysctl is generally turned
    off is in very small systems, such as embedded architectures or boot disks that
    need to conserve every bit of available memory. So far, we have generally discussed
    /proc as an interface and, although this is true, it is important to understand
    that sysctl is the component within /proc (/proc/sys) that allows the administrator
    to actually modify the behavior of the system, rather than just read it, as is
    the rest of the /proc interfaces.


    # Top-Level Information


    At the top of the /proc interface, many files provide easy access to the kernel''s
    view. Most can be easily viewed with just cat, as shown here:


    ```

    #cat /proc/version

    Linux version 2.4.2-ac24 (root@host) (gcc version 2.95.3 19990103

    - (prerelease) #10 Fri Apr 6 13:54:00 EDT 2001

    ```


    As you can see, this retrieves the kernel version, information on what compiler
    was used to build it, and some other useful data. Retrieving data from the kernel
    this way is so simple that some system administration utilities use data directly
    from /proc to get their usage statistics.'
