    +   * t/-T #—Enables testing of current settings. The -t/-T options should be
    used around configuration changes, in order to get a better feel for when you
    are on the right track in tuning your drive. You could see improvements in your
    application during tuning, by the use of these options will make sure that the
    speed increases are coming from the disk and not another subsystem.


