  md: '# Tuning NIS


    If you have deployed NFS, you most likely use NIS to provide login and other centralized
    services. Frankly, NIS is very easy to tune for performance. The best way to do
    this is to add slave servers. The method for doing this is relatively simple:
    NIS needs to be configured as a slave server, preferably on subnets that are physically
    removed from the central server. This process is nearly the same as the original
    NIS configuration on the central server. On the slaves, you may ypbind NIS authentication
    over slow links with timeouts can be painful, so it''s recommended that you set
    up a slave at any subnet without quick access to the server.


    The next operation on the slave is the addition of the updates to the root crontab.
    Recommended settings are as follows:


    +   * 20 * * * /usr/lib/yp/ypxhr_1perhour

    * 40 6 * * /usr/lib/yp/ypxhr_1perday

    * 55 18 * * /usr/lib/yp/ypxhr_2perday


    Depending on the usage patterns on the link and the size of the user maps, you
    might want to go by hand and reconfigure how the transfers are done and when.
    If it is an extremely slow link, schedule updates once per day during off-peak
    hours. If you are unlucky enough to have a remote network with dial-up only access,
    this is probably your best bet. When, you reduce the load on the central server,
    replicate your information, and make the lives of the users on the other end of
    the link much better.


    There is another option to speed NIS operations. With the GNU C library, a daemon
    called nscd can cache NIS operations, greatly speeding lookups. In general, NIS
    with slave servers on a local net is plenty quick. The most you really need to
    tune it is to add new slave servers, although the nscd daemon can be handy if
    you have an application that requires many local lookups.


    # Making Kernel Changes to Improve Performance


    There generally isn''t much on the kernel side in driver control to get better
    performance. Sometimes driver versions are available on the net: One might be
    focused on getting extreme performance out of the card, whereas another might
    be focused on maintaining a generic driver for a whole family of cards. Sometimes
    drivers don''t take advantage of the card by default. To be safe, options might
    be turned off. Full-duplex mode can be turned off by default for some drivers,
    and it is a good idea to check your log files to make sure that the driver is
    initializing the card you want to. If it isn''t, usually an option can be passed
    to the kernel or to the module to modify the behavior of the driver.'
