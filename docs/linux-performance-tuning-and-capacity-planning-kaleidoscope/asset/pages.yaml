  md: '# Overview of Performance Tuning


    # CHAPTER 1


    # Identifying Critical Resources


    When troubleshooting system problems, it is generally a good idea to know which
    parts of a given system are the most important. That does not necessarily mean
    the hardware itself—or the kernel, for that matter. Knowing what the most important
    resources of a system are helps you''re spending priorities (which is discussed
    later in the section “Reflecting Priorities in Resource Allocations").


    Determining what is important can be difficult. The following is a small example
    of how important it is to understand critical resources.


    One system that I maintained for a long time was my Internet gateway server. This
    was a demand dial-up system that I configured as a router, a firewall, and a nameserver
    for my home network. Obviously, my most important resources were networking services
    and security. I did not spend a great deal of time the disk subsystem all the
    firewall really dealt with the disk was I wrote log files. I also did not have
    any additional applications or X Window on the system.


    Most operating systems are a bit more complex than a simple router/firewall, but
    necessarily less important. A large database server has a great deal to contend
    with, especially if the database must do a lot of complex number crunching. In
    a case like this, all kernel systems are equally important.


    # Minimizing Critical Resource Requirements


    Knowing what the system''s critical resources are helps, a system administrator
    can do even before beginning to tune the system. One of the best ways to enhance
    the performance of a Linux system or any Unix system is to eliminate everything
    that you do not need in terms of unused services and software.


    As stated earlier, obvious things that might not be required on the system are
    simple things, such as X Window. A case in point is an FTP server: There is no
    need to load X Window on it because the sole purpose of the server is to store
    and transfer files.


    Other items that can be removed include services that the system does not need.
    For example, if a system''s only task is to run a MySQL server, then services
    as sendmail and a Web server simply not to be running because they are not used.
    This is discussed in greater detail in Chapter 13, “Thinking About Capacity Planning."


    After unrequired services software have been turned off, the next step is to look
    at simple items in the kernel that might not be needed. A good example in the
    kernel is drivers that you do not need. This might seem daunting to a new administrator
    because the kernel can be hard'
