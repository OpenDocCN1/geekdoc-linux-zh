  md: '# Network Performance


    # CHAPTER 7


    # Socket Options


    Samba can handle many socket options to tweak usage of the operating system''s
    underlying socket system. Described here are the ones most relevant to tuning,
    but their applicability might vary depending on attributes present in your needs
    needs Some might even cause Samba to fail completely. Each option has an explanation
    of how it applies to the network stack, but it also helps to have an already solid
    ordering of TCP to know which options are right for your environment.


    +   - SO_KEEPALIVE—Keeps sockets over time. The length of time depends on the
    value specified by sysctl, as described later. This can help initialization overhead
    by already having sockets options for transfer.


    +   - TCP_NODELAY—Doesn’t delay TCP packet sends. Otherwise, it waits to coalesce
    packets before pushing them out. This is the most influential option, generally
    giving up to a 40% speed gain in environments


    +   - IPTOS_NODELAY—Is similar to TCP_NODELAY. This is helpful if you are on a
    local network. This option is generally used in conjunction with TCP_NODELAY.


    +   - IPTOS_THROUGHPUT—Is most helpful in wide area network environments, to make
    better use of the available bandwidth. You can use these options on a single line,
    as socket options = TCP_NODELAY IPTOS_LOWDELAY.


    # Write Cache Size


    With this, Samba creates an extra cache for every oplocked file. Both reads and
    writes are served from the cache, but the gains aren''t received from it. This
    is meant as a means of forcing reasonable writes for RAID devices. If the write
    cache size corresponds with the RAID stripe size, it can result in better handling
    of writes.


    ```

    Write cache size = 131072 # value per file cache in bytes

    ```


    As you can see, Samba has many angles to tune. Some of the works against each
    other, use only what is appropriate in your environment. Some options, such as
    TCP_NODELAY, seem to be appropriate in any environment. Keep in mind what clients
    you have, and plan your tuning process accordingly.


    Because 2.2 is out and offers integration with Windows 2000 networks, widespread
    acceptance probably isn’t too far off. The options presented here apply to 2.2,
    but keep in mind that there will probably be other ways to tweak 2.2 down the
    road as more people test with Windows 2000. Check for updates on the Samba Web
    page, at www.samba.org.'
