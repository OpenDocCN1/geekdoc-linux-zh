    of interrupts. Here you return to the idea of properly reading output. It is a
    good idea to look at the tools covered in this chapter when the system is idling
    so that you know what effect a performance-monitoring tool can have on the system.


    # xload and xosview


    Along with many command-line-driven tools for Unix systems are X11-based tools.
