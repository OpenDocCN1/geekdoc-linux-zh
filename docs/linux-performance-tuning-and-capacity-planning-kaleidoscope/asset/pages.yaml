  md: '# Tuning and Performance Mechanics

    PART IV


    In most cases, the kernel log daemon can trap data as it does all kernel messages.
    If it has a valid System.map file, it can translate the memory values to their
    human-readable symbolic values. This is why moving and replacing the current System.map
    file is recommended when configuring your kernel. From this data, you can reconstruct
    clues to what happened and find a solution.


    In the case of dynamically loaded modules, the kernel symbols were not present
    in the kernel image and thus cannot be translated if a module oops. There are
    ways to get relevant data in this situation, but it might be better to build the
    driver into the kernel so that tracing is easier. If the problem goes away when
    the driver is statically built into the kernel, the problem is probably not the
    driver''s general operation, rather how it deals with the kernel when loaded as
    a module.


    If you end up with a hard crash, if the interrupt handler killed before the data
    was written to disk, you might have the oops data for yourself and type it at
    the next boot. In this special case, also when symbol translations were not done,
    you might need to install kymools from the ftp.kernel mirror system. kymools can
    reconstruct the relevant symbols to generate useful debug information. The internals
    of kymools cannot be described here in full detail; check with the kymools documentation
    for a description of how to use it.


    After you have the data, check the MAINTAINERS file in the Linux sources for someone
    who would likely be able to trace the problem. Or, if you started having this
    problem as a direct result of applying someone''s patch, mail the information
    to that person. If you cannot find any-one who sees capable of solving the problem,
    post your problem to the Linux kernel mailing list, at linux-kernel@vger.kernel.org.


    # Summary


    This seems like a lot to handle all in one chapter, the Linux kernel is by no
    means a simple beast. In reality, it is dość of work for you, and it shouldn''t
    require much in the way of tuning. For more specific needs, the information presented
    here is a nice springboard into making changes in your environment. Keep in mind
    that Linux is always under development; although this information provides a good
    base from which to start, you should continually check for any improvements or
    changes made during the development cycle, as well as information from someone
    who has already solved your problem.'
