  md: '# Popular Unix Performance-Monitoring Tools for Linux

    CHAPTER 3


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_69_0.png)


    3.3 xview, with all subsystems monitored.


    One interesting aspect of xview is that it combines certain histograms into one
    horizontal bar. This requires some explanation.


    +   * LOAD—This has two colors. The first color is the load average of processes,
    and the second color (the background color) is idle processes relative to the
    load average. When the load average goes above 1.0, the bar will change colors.

    * CPU—The CPU field has four colors related to process type: usr, nice, sys, and
    free.

    * MEM—In this field, the amount of real memory is in use. There are four colors
    in this field: user-allocated memory, shared memory, buffers, and free memory.

    * SWAP—Swap has two colors; the first indicates the swap in use, and the second
    indicates what is free.

    * PAGE—This has three colors: in, for paging in; out, for paging out; and idle.

    * DISK—This has three colors: in, for transfers to disk; out, for transfers from
    disk; and idle.

    * INTS—This is a set of indicators that represent IRQ usage. They are numbered
    starting at 0 from the left.


    # uptime


    The uptime command displays the current time, the length of time that the system
    has been up, the number of users, and the load average of the system over the
    last 1, 5, and 15 minutes. It looks like this:


    ```

    6:51PM up 2 days, 22:50, 6 users, load averages: 0.18, 0.30, 0.34

    ```


