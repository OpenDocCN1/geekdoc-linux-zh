  md: '# Aspects of Performance Tuning

    CHAPTER 2


    (If you''re interested, looking at the kernel call goodness can paint a clearer
    picture of what is considered when selecting processes.)


    Quantums can be divided up. If a process is waiting for a disk to spin up, it
    is placed back in the task queue and retains the remaining part of its quantum
    for activity when the drive returns the requested data. At that point, the process
    is rescheduled and uses the remaining bits of its quantum for that epoch.


    In general, there are three types of processes: real-time, interactive, and batch.
    As mentioned earlier, real-time processes have specific scheduling needs. Although
    Linux is not a true real-time operating system (RTOS), it can accommodate what
    is a softer version of real-time operating. Our is to refine Linux''s process
    of real-time operations, because this generally applies to embedded systems, it
    won''t be covered in this chapter.


    The other types, interactive and batch processes, are normal user-run processes
    that have varying scheduling needs. Interactive processes are what the user generally
    works with, such as graphical applications and editors. Batch processes can be
    anything from databases to daemons. Although the kernel doesn''t have any idea
    about what an application is interactive, it can tell whether it is I/O-bound
    or CPU-bound. Interactive applications, such as editors, are I/O-bound because
    they act on I/O operations such as keyboard interrupts and mouse movements. Because
    these I/O events happen rarely in kernel terms, priority is deferred to I/O bound
    in general, to provide better visible performance to the user. The rest of the
    time is given to the CPU-bound processes.


    On SMP, each processor runs its own instance of the schedule function. The schedule
