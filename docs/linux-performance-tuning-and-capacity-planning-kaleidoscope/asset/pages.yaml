  md: '# Tuning and Performance Mechanics

    PART IV


    The hostname matching can use a string (as long as it will resolve) and IP address,
    and can also have the netmask. A netgroup might be used for NIS netgroups.


    Finally, the allow daemon and client fields are as follows:


    +   * ALL—This matches all.

    * LOCAL—This matches any whose name does not contain a dot.

    * UNKNOWN—This matches any user name who is unknown or any host host-name or address
    is not known.

    * KNOWN—This matches any username that is known or any host for which both the
    address and hostname are known.

    * PARANOID—This matches any host address and hostname do not match, and could
    be indicative of a spoof.


    The following is an example:


    ```

    ALL : ALLOW

    ```


    This will let everyone in. Additionally, the use of DENY and ALLOW at the end
    of rules can let the sysadmin use only /etc/hosts/allow. The following is an example:


    ```

    ALL : .evil.domain : DENY

    ALL : ALL ALLOW

    ```


    With /inetd.conf configured appropriately for the server''s use, it is time to
    look at rc scripts.


    # The rc.d Scripts


    In addition to services activated within the inet daemon, additional services
    usually are enabled via rc scripts. On most Linux distributions, these are contained
    in /etc/rc.d.


    The scripts in /etc/rc.d are symbolic links to scripts in /etc/rc.d/init.d. Each
    service or application is linked from its main script file in /etc/rc.d/init.d
    to the appropriate run-level directory (for example, /etc/rc.0/linuxconf). The
    scripts in /etc/rc.d/init.d can stop, kill, start, or restart a process. In the
    run-level subdirectories, each link starts with a K or S, to kill or start a process,
    respectively. The following is a set of partial listings from the out-tree of
    put on a Red Hat Linux system:


    ```

    rc.d

    |-- init.d

    |   -- amd

    |   -- anacron

    |   -- apmd

    |-- arpwatch

    ```'
