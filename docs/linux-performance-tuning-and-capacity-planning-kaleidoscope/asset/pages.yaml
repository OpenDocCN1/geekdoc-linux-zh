  md: '# Tuning and Performance Mechanics


    PART IV


    In this case, make will work through all the requested builds in order and will
    quit if it sees an error along the way. This is a simpler solution in most cases
    because you can walk away and do something else while it is building.


    # Installing the New Kernel


    Installation is a relatively straightforward process after the kernel is built.
    The end result is that you need your drive to be prepared to be capable of booting
    the new kernel image. On some systems, a make bzimage command will install the
    newly built kernel for you, but in most cases, it’s worth the trouble to make
    the modifications yourself.


    Most distributions use the lilo boot loader. Give some option of using the GRand
    Unified Bootloader (GRUB), which is the GNU offering, but both them perform the
    same function: They provide a clean way of booting multiple kernels and multiple
    operating systems. First, let''s look at how to configure lilo to use with all
    the old ones.


    Your new kernel, as previously shown, is sitting in /usr/src/kernel-name/arch/i386/boot,
    with the possible exception of the i386 portion if you are building on another
    platform. The best thing to do is to copy that file over /boot and give it a relevant
    name. Most distributions default to an image, such as vmlinuz, if you are looking
    for multiple kernels or are just testing, it''s a good idea to name it something
    like 2.4.2, with an optional trailing name specifying set of capabilities it has
    enabled. If you are testing the RAID options, for example, naming 2.4.2-RAID would
    be a good idea. The idea goes back to the premise that you should never change
    multiple components at the same time when on a system.


    Now that the file is in /boot, you need to add an entry to your /etc/lilo.conf
    to reflect this. Looking at your default file, it should appear to be something
    close to the following:


    ```

    # /etc/lilo.conf

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    vga=normal

    default=linux

    keytable=/boot/us.klt

    lba32

    prompt

    timeout=5

    message=/boot/message

    menu-scheme=wb:bw:bw

    image=/boot/vmlinuz

    label=linux

    root=/dev/hda1

    ititrd=/initrd.img

    read-only

    ```'
