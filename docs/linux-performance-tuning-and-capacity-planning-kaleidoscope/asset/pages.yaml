    # Commercial Products


    In the realm of commercial offerings, some fairly large players are involved in
    the market. BMC and SAP, two of the larger ones, offer products that work as enterprise
    resource planners. These products test your network to see if it can handle the
    strain of the resources as planned. Many large corporations are vying for the
    market, but they are all focused on the same areas, including consolidation of
    existing functional areas into a single system and predictive analysis for your
    network.


    These are very effective tools, but they also tend to be expensive. In most situations,
    they''re overkill for what you need. Deploying these kinds of systems might require
    large amounts of time, effort, and cash to get any kind of real value from them.
    The resulting overhand could be more than you can afford to implement in your
    scale. If you are planning a very large system, it might be worthwhile to look
    closely at these options because they can provide both software implementations
    and contracted manpower of domain expertise in your system.


    # Network Analysis Tools


    All is not lost if you can''t afford the time or resources to get a large enterprise-planning
    system in place. Some valid options get you the data you need to complete your
    model and finish implementing your plan so that the system can be built and deployed.


    Many analysis tools rely on using SNMP to gather their data, and then add value
    by calculating statistics based on these values.(Many take data not available
    via SNMP, but most of this can be retrieved with external software.) Sometimes
    this model might be overkill for much of this data can be gotten by hand; for
    the most part, rough statistics also can go a long way and save the large costs
    involved in deploying a large-scale product.( This is not to say that the large
    products don''t have their place; for small, medium, and even large businesses,
