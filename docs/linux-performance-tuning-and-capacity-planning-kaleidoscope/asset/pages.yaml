  md: '# Path Discovery


    As discussed earlier with NFS packet sizing, sockets attempt to discover the MTU
    for the path they will be taking and coordinate packet sizes accordingly. This
    should be fine in nearly all cases, but you can turn it off by setting a i=1 in
    /proc/sys/net/ipv4/ip_no_pmtu_disc. If you know that your machine is going to
    be taking, and it never involves paths that might fluctuate, this can be turned
    off safely. You should take steps to ensure that large packets are still in use,
    though haven''t dropped back to a small default such as 512 bytes, which would
    severely impair performance. Also, if you are working over a network segment that
    has ICMP disabled to prevent flood attacks, path discovery will fail, and trying
    to work with it is a complete waste of time. However, ICMP ECHO is used for pinging
    and, but ICMP has many useful and nondestructive uses on a network, such as path
    discovery. In many cases, ICMP is turned off only when ECHO requests should be
    disabled.


    # Fragmentation Thresholds


    Again, with NFS tuning, /proc/sys/net/ipv4/ipfrag_high_thresh and ipfrag_low_thresh
    values can be helpful in preventing lost packets during periods of high fragmentation.
    In that case, fragmentation could be raised to make sure that the stacks keeping
    to reassemble packets during these times. Otherwise, it will silently drop fragmented
    packets when it sees the high threshold until low threshold is reached.


    Keep in mind that you shouldn''t raise this too high because it will raise the
    kernel''s memory requirements. In that case, fragmentation could work as an attack
    against your system by forcing large amounts of memory to be used for fragment
    handling while the rest of the system suffers. Your underlying network architecture
    can help greatly. If you plan your architecture that fragmentation should not
    be an issue (by making sure that all network paths are correct for your needs),
    this shouldn''t be a problem. In reality, though, you might not have complete
    control over your network, or you might need to leave your network to get some
    data; in this case, fragmentation is a likely possibility.


    # ECN


    If you are working with data that is sensitive to packet loss, such as video streaming,
    /proc/sys/net/ipv4/tcp_ecn is worth investigating for the sake of your system''s
    performance. ECN is a congestion-notification system specified in RFC 2481. Although
    normal TCP sessions can handle packet loss, recovery of the lost data is generally
    done after the fact. If a router somewhere in the path experiences an overload
    and drops packets, the transport will ensure that the lost packet is re-requested.'
