    You might be wondering which terms mean what. The LVM contains a lot of names,
    all of which seem to mean the same thing. Here is a list of the common terms and
    what they mean, from the highest level in the system to the lowest:


    +   **Volume group**—This is the highest level in the LVM hierarchy. Logical and
    physical volumes inside this group.


    +   **Logical volume**—It is helpful to compare this to a disk partition on a
    drive, where the drive is the volume group and the logical volume is the partition.
    This is what is exposed to the system as a block device for a filesystem. In the
    previous example, /dev/vg00/boot is a logical volume.


    +   **Logical extent**—The logical volume is broken into extents, which are used
    as meters of size and growth of the volume. This is vaguely similar to the blocks
    present on a disk.


    +   **Physical volume**—This is normally a hard drive, although it can be anything
    that the system can mount as a normal storage disk.


    +   **Physical extent**—This is the physical equivalent of the logical extent
    described previously.


    This might seem confusing, but it''s really not bad. A volume group is made up
    of logical volumes, just like partitions on disks (or anything disk-like). Both
    logical and physical volumes have extents, which determine what chunks are used
    to grow the volumes in the future.


    Now let''s step through a couple of tasks to help ground all this. First, you
    need to initialize your disk to have the right partition type to be included in
    an LVM set. Using fdisk, cfdisk, or whatever is handy, set the partition type
    to be 0xe8. On that partition, you need to run pvcreate as follows:


    ```

    # pvcreate /dev/sdb1

    # pvcreate /dev/sdc1

    ```


    See? That wasn''t too hard. pvcreate created the low level physical volumes on
    the partitions involved, the first partitions on the second and third SCSI disks
    on the system. The drive has a physical volume descriptor on the front of that
    partition. Now run vgcreate, which creates a volume group over the two disks that
    have been configured as physical volumes:


    ```

