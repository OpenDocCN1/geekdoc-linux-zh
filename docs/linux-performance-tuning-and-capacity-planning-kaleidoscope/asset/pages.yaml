    As you can, lifilo understands several options, down to details such as color
    scheme for the boot menu. By pointing the boot line to different disks, you can
    update the boot sector for each, although you generally will point it only at
    your boot. You shouldn''t have to modify most of the options if lifilo is already
    in use. The default line might be worth modifying at if you want to change the
    image used as the default. (The default line corresponds to the label name for
    each image.)


    Each one of the images listed is a kernel that can be booted or a pointer, as
    with the other line that points to the floppy drive for your kernel. To add your
    new kernel to the list, add a new set of image lines, as shown here:


    ```

    ...

    menu-scheme=wb:bw:bw

    image=/boot/2.4.2

    label=2.4.2

    root=/dev/hda1

    image=/boot/vmlinuz

    ```


    As you can, you don''t necessarily need all the options enabled for your kernel.
    After lifilo.conf is saved, return to the console and /sbin/lifilo. You should
    see a line of output for each kernel entry in the list, with a * next to it. With
    this example setup, you should see something like this:


    ```

    #sbin/lifilo

    Added 2.4.2

    Added linux *

    Added failsafe

    Added floppy

    ```


    This means that 2.4.2 has been added, but because the default line still pointed
    to the default linux label, it will still be the default if no options are selected
    before the timeout passes. The timeout is in tenths of a second, so, in this case,
    there is a 5-second delay before the default kernel is selected.'
