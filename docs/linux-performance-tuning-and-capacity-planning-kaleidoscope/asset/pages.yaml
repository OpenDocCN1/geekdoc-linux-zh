    deploy after the system has gone to production, compared to a load-balanced Web
    cluster. Find the right trade off for your environment, and apply what makes sense
    for your future needs.


    # Pay Attention to Requirements and Administrators


    The technical details of specifying and building a system are often left to systems
    administrators. They have the technical expertise needed to build everything with
    the right components and to choose what technology to fit where. The flaw in this
    process is that, for the most part, this process is not integrated with those
    who need the system in the end, and some of the requirements might not make it
    to the designers. In a perfect world, a requirements document would be constructed
    by people who are laying out the high-level system architecture. This would then
    be given to system administrators to plan individual component usage and build.
    Unfortunately, this rarely works in practice.


    In the real world, extensive communication must occur between doing the high-level
    planning and implementing the details of the solution. Refer back to the sections
    "Having a Global View of Requirements" and "A Twofold Approach" for more information
    on how this applies. In addition to making sure that the right fit is found for
    all technologies involved, this process also ensures that requirements specifications
    are fully comprehended at all levels of the operation.


    Otherwise, system administrators might get some requirements documentation and
    apply it without a global understanding of all the issues at hand. The people
    in the server room are just as important to the success of the business as those
    at the higher levels, and they need to be fully briefed on the needs of the system.
    The best system administrator in the world doing capacity planning without requirements
    knowledge might as well be replaced with anyone off the street.


    To make sure that this point is clear, let''s go back to the example from the
    section on "Actual Versus Needs" in relation to capability planning. Without interacting
    with the people in business development, the system administration team might
    not have any idea what is in the system for them down the road. The potential
    needs might not have been explicitly addressed in the requirements document. This
    results in what is basically a large communication gap within the business organization.


    The important part of this process is that communication needs to take place among
    involved parties—and even parties who might possibly be affected. As the communication
    takes place, needs will be assessed at all levels, yielding several benefits:
    All angles of expertise are applied to the problem in affected areas of the business,
    the pending capacity needs are fleshed out, and the right technology is used for
    the job. This communication is the most effective means of ensuring success across
    the board.'
