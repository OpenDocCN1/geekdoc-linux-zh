  md: 'This book is not the ultimate solution to performance tuning on Linux systems.
    Instead, it is a guide filled with many great suggestions, methodologies, and
    ideas. This is a good starting point, and serves as a quick reference for many
    operations that the Linux administrator might have to perform to tune a Linux
    system.


    # # World Wide Web Resources


    Linux has spawned an incredible number of Web sites. Most are personal, but many
    are run by groups of people who share a common interest or by a distributor of
    Linux. These sites range from just "Hey, I like Linux" to massive online archives
    of detailed information.


    In the realm of performance tuning, very few sites are solely geared to it. Many
    sites are generic Linux sites, so there are far too many to list here. These are
    a few dedicated sites that cover performance monitoring and tuning:


    +   * The Performance Tuning Site: http://linuxperf.nl.linux/

    * Dan Kegel''s Web Hostel, a personal site with several papers on Linux Tuning:
    http://www.kogel.com/

    * Linux.com''s performance-tuning section: http://www.linux.com/enhance/tuneup

    * The Linux Server Performance Checklist: http://home.att.net/-jageorge/performance.html

    * Linux tuning in general: http://www.tunelinux.com/

    * Benchmarking rules: http://oss.sgi.com/LDP/HOWTO/Benchmarking-HOWTO.html


    As you can see, many sites are specifically geared to Linux performance tuning,
    but rather the knowledge is scattered throughout the net. Always remember to refer
    to your application distribution for accurate information as well. Samba, for
    example, ships a large amount of technical documentation with the source.


    The ultimate location for documentation on Linux, however, is the Linux Documentation
    Project (http://www.linuxdoc.org/), which has a vast repository of HOWTO-style
    documents. You should note that many documents in the LDP tend to undergo a long
    update before the newest revisions make it to the Official Web site, especially
    since the code is usually being developed at the same time. This ensures that
    the projects they are describing are solidified and that the documentation is
    accurate. If you are working on something that could be a little more bleeding-edge
    than what is described by the document, you might find it worthwhile to email
    the author or search for the more recent revisions of the document.'
