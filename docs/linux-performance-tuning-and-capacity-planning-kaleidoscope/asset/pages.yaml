  md: '# Capacity Planning


    PART V


    So, given a little knowledge about how to use SNMP, you might be able to do predictive
    analysis on your network yourself. This precludes the need for expensive applications,
    enables you to get the exact data you need, and even you tune your statistics
    generation to what might be domain-specific needs. The downside of this is that
    it requires a little bit of in-house knowledge using the protocol. This is fairly
    straightforward, though, and it''s very easy to get up to speed. The other downside
    is that some of the custom statistics packages that come with the large applications
    might not be directly available to you, but that situation could be changed in
    the future.


    We''ve talked about SNMP throughout the book, but what exactly is it The acronym
    stands for Simple Network Management Protocol, and it really does what its name
    suggests. Most management applications and services imply that this is a complex
    system to use, but it''s really not difficult to work with at all.


    Although SNMP can have different capabilities beyond this, here is the overall
    explanation of the protocol: It enables you to look at a system from over the
    network and watch various usage parameters presented in a tree-like format. Every
    node in this tree has a numeric path, such as 1.3.6.1, which is called an object
    identifier (OID). This numeric sequence is mapped to a meaningful known name as
    an object identifier by Message Information Base (MIB). MIB defines the names
    in ASN.1 notation.


    Different places in the tree of data are reserved for different types. This provides
    a standard for establishing normal places to find specific data about things such
    as uptime values. It provides trees of application-specific data for vendors to
    implement. Keep in mind that this is an extremely simplistic view of what SNMP
    does; more research is encouraged to make sure that you know how to use it correctly
    for your needs.


    # Pollers


    Many applications out there speak SNMP and retrieve data for you to analyze. At
    their basic level, they simply poll specific resources at defined intervals. For
    the sake of simplicity, we will call these pollers. Applications that fall into
    this group Hewlett-Packard''s Network Node Manager (NNM), known as OpenView, BMC''s
    PATROL software, among others. In the open source world, there are several means
    of doing the same work, using more simplistic tools such as Big Brother. Although
    Big Brother does not come close to the commercial application''s support for various
    reports and whistles, an up OpenNMS will provide much of that functionality in
    the near future.


    Because it is so expensive to deploy an infrastructure based on tools such as
    HP''s NNM, the coders at www.opennms.org have been putting together a framework
    application that provides much of the same functionality, but with a fresher look.
    This provides a flexible system in the face of networking standards. Some people
    view network-management systems as'
