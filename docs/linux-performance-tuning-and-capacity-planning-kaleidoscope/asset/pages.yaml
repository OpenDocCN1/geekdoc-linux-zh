  md: 'Capacity Planning

    PART V


    # Ensuring Flexibility in the Future


    This can be difficult to determine in objective terms, but you should keep it
    in mind reviewing the structure being built. What will happen to the structure
    if some of the business systems are reorganized? Can the existing infrastructure
    handle the subsequent reorganizations? These are very important questions because
    they can directly affect the future viability of the system. Having a global view
    can mitigate risks because the predicted patterns are somewhat clearer. However,
    it is ludicrous to assume that all factors can be accounted for. Large, unforeseen
    business reorganizations can still have a large impact, but it is important to
    account for all known pending or possible organizational changes in the structure.


    # Building a Contract


    Obviously, the details of forming a contract based on the ideas presented here
    will depend greatly on your needs. Contractual negotiation varies from company
    to company, and your needs will be very unique. In the end, however, especially
    with systems that bridge organizations, there needs to be some kind of contractual
    obligation concerning the system in question. By solidifying the growth patterns
    as much as possible and specifying the requirements, the capacity plan accounts
    for every known contingency and for all the factors presented.


    A contract should be in place to ensure that every resource needed will be present.
    This can cover anything regarding the system, usage rates to management hours,
    the capability to call on domain expertise in other departments as needed. By
    building this a binding contract, you modify any of the remaining unknowns that
    prevent the system''s growth patterns, further ensuring the viability of your
    capacity plan.


    # Handling Project Management


    Capacity planning should be treated as a normal project-development problem. Although
    it can be viewed as a service contract, it generally makes sense to look at it
    as a normal project, the same as other projects within the organization. Stepping
    back to look at the factors involved, this makes sense—it has all the classic
    factors involved in normal project management: employee burn rates, research into
    individual technologies as time goes on, hardware deployment costs, code updates
    in months, and so on.


    The details of implementing the plan as a normal project within your organization
    will vary, but you definitely treat this no differently than any other project.
    The plan should be subjected to periodic review, should have internal resources
    allocated to it as if it were a normal project, and so on. By viewing it as a
    standard procedure, you better ensure that it will receive the same amount of
    internal attention over time and the plans won''t fall by the wayside as time
    moves on and resources are reallocated. Devoting specific resources to'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Methods for Capacity Planning

    CHAPTER 14


    manage ensures that the built-in deadlines are handled effectively in a prepared
    manner as they occur. When combined with a binding contract laid out in the structure
    segment, the capacity plan should have enough resources dedicated to that it consistently
    meets its requirements.


    # Navigating Political Aspects


    Now we get to the ugly side of capacity planning and deployment. If handled correctly,
    political problems shouldn''t affect your plans for moving the system forward.
    However, if you miss them, you can face serious repercussions. Either way, it
    helps to know the environment to make sure that it works for the system, not against
    it.


    Let''s look at the possible negative repercussions. In implementing your, there
    could be significant overlaps with other groups. This is a good thing, but not
    necessarily for everyone''s perspective. Although it might make sense for the
    overall health of the product line, some groups might not want to release the
    work they are doing, to maintain their status quo within the infrastructure. This
    likely will happen if you are deploying a system that involves a SAN or something
    else that implies centralization of different sources. Another group might already
    have that information, so it would make sense to move your group''s databases
    into the management infrastructure and consolidate efforts. From the group''s
    perspective, however, this could mean a loss of management costs in the budget,
    a loss of employees, or other factors. Steps should be taken to reduce the impact
    of this centralization, possibly by getting the employees over to the new system
    to maintain the expertise in the company, or simply jestring operations among
    the groups involved.


    Another pitfall that can occur, mostly as a result of the previous example, is
    groups withholding data. If a group determines that the system is a threat to
    its line of business, it might not be forthcoming with relevant data as it should
    be. If you are attempting to build an effective capacity plan, the lack of such
    data can lead large holes in your prediction models, resulting in a much less
    effective plan. For this reason, you should take every possible step to work with
    the groups getting the data you need.


    Management also might have some fears when looking at your proposed system. If
    you do not allow these fears, management might prevent the project from happening,
    rendering all the work you have done useless. Many factors can contribute to this:
    Maybe the business model isn''t quite believable and there is not much of a market
    as believed. Perhaps the management team believes there is no need for the system,
    let alone a capacity plan to go with it. Or, maybe the new product is so far outside
    the company''s core competency group that fears arisen about its viability within
    current structure. Whatever the reason, the fears need to be considered and built
    into the current plan. Without the support of upper management, your plan''s chances
    of survival, let alone grow, slim.


    | 14 |

    | METHODS FOR CAPACITY PLANNING |'
