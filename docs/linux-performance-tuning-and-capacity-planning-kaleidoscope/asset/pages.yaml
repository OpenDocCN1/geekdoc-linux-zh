  md: '# iostat at Linux


    The iostat utility is a common Unix utility.


    As you might have guessed, the iostat utility monitors system I/O. It can generate
    two types

    reports:


    +   - CPU utilization

    - Device utilization


    The general syntax of iostat is as follows:


    ```

    iostat iostat [ -c | -d ] [ -t ] [ -V ] [ -x [ device ] ] [interval [

    count ]

    ```


    In the most generic form, iostat can be run like this:


    ```

    iostat

    ```


    The following is an example of iostat running:


    ```

    # iostat 10 2

