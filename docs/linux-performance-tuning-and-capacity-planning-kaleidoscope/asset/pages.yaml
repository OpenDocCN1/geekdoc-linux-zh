  md: '# Advanced Topics


    This chapter''s earlier coverage of the initial estimation of memory was vague
    (at best) because there is no concrete method for precisely figuring out how much
    RAM a large system will need. This section readdresses that topic in the context
    of what a system is doing and where an administrator can get help for figuring
    out memory requirements.


    # Industry Guidelines


    The first tool at the administrator''s disposal is industry and organizational
    guidelines. Many to-high-end application systems such as databases have published
    documents that an administrator can use to determine how much memory the system
    will need. Most often these are extreme cases, so they should be properly weighted.


    As an example, a database product might have the guidelines shown in Table 11.1
    for a Linux system.


    | Number of Processors | RAM | Swap | CPU | Disk |

    |---|---|---|---||

    | 1 | 1GB | 2GB | 1GHz | 100GB |

    | 2 | 3GB | 7GB | 1GHz | 100GB |


    It is quite clear that there is an upward curve, but one thing that is not taken
    into account with this particular database is the number of concurrent connections.
    For example, this could be an internal database for a company that has 50 employees,
    only 20 of whom would ever use this particular database. This could also be the
    only application on this system. In such a case, it would be safe to say that
    these estimates are a wee bit on the high side. The exact location of such guidelines
    are scattered across the Web in user group sites, vendor pages, and application-centric
    Web sites.


    By the easiest way to figure out what the requirements is to take a set of baseline
    requirements when the system is under a minimal load and then steadily load it
    down again using the methods for memory estimation. A completely different situation
    arises when a system is already in production. In this case, the best way to estimate
    possible future needs is to take measurements throughout the day to establish
    user patterns and then take the appropriate steps. You might find that having
    certain processes run at certain times seems possible.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Linux and Memory Management


    CHAPTER 11


    221


    # Application Effects and Memory Operations


    11


    Another useful tool for the administrator is to understand how an application
    uses and manages memory. Some applications load a large amount of data into memory
    all at once. Others are written to use little memory space as possible. A good
    example of this is that particular X Window manager is designed to be fully functional,
    but it uses the capabilities of C++ for software reuse. Thus, it uses a bit more
    efficiently than one of its cousins. Finding nifty details like this can sometimes
    be as simple as reading information about the software or as difficult as probing
    newsgroups and mailing lists. The most common ways to profile how applications
    use memory is to watch them, write a script to watch them, or use some of the
    more advanced tools mentioned in this book to keep track of the amount of resources
    they demand.


    Sometimes application effects on systems are quite apparent. For example, many
    databases load the management area of the database directly into memory. Obviously,
    if it helps the system can actually hold the entire image in memory. Again, normally
    some sort of documentation can be found with or about the product, to explain
    how this works in detail. In any case, after the database instance is started,
    it is pretty easy to tell how much memory it just needs to be able to run, let
    alone operate, efficiently.


    # The Crash Test Dummy


    In today''s new world of commodity hardware, having a test system is no longer
    such a difficult feat for a system administrator. Any benchmark, no matter how
    vague, is better than nothing. Being able to acquire and use an older system to
    see how applications will affect its operation is an important and highly recommended
    practice. This does not mean that the administrator necessarily has to duplicate
    the environment on a one-to-one basis; instead, simple proportionate do the job
    for him.


    As an example, a new system that will be installed must have optimum flexibility
    for users when it comes to screen-based editors. This means installing a lot of
    free editors such as emacs, vi, vim, nvi, and so on. In this case, there will
    be 20 developers using the system. The memory requirements then must be capable
    of running the largest editor with, say, 80 concurrent sessions. Four concurrent
    emacs sessions per user is probably a good maximum estimate. Then add padding,
    if possible, just in case!


    For simplicity, each emacs session takes up roughly 1MB of RAM. This means that
    80MB is a good estimate for memory needs, plus 10MB or so for padding.'
