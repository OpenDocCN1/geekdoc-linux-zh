    # Increase the Server’s Priority


    As a rule, the X server is one of the most CPU-intensive processes on a Linux
    system. However, few Linux vendors or Linux users take advantage of the capability
    to increase the server’s priority in relation to other processes. As a result,
    the X server runs at the same priority as a simple text editor. In many situations,
    simply increasing the X server’s priority will eliminate sluggish performance.
    Home computers, office workstations, and computers used primarily for Internet
    access generally respond well to this straightforward technique.


    To increase the X server’s priority gives it a lower nice value. A process’s *nice*
    value is a number that the kernel uses to modify how CPU time the kernel will
    give relative to other processes. Nice values range from -20 to 20. The lower
    a process’s nice value, the less “nice” it will be to processes—that is, the less
    the kernel will interrupt it to give CPU time to other processes. The default
    value is 0, meaning that the kernel will not modify the process’s priority based
    on the nice value. So, given two processes, A and B, both running with the default
    nice value of 0, changing A’s nice value to -20 gives it greater priority over
    B. Changing B’s priority to 20 gives it less priority than A.


    NOTE


    The Linux kernel’s algorithms and heuristics for process scheduling are more complicated
    than explained here. Nevertheless, for this chapter’s purposes, this simplified
    explanation will do.


    To start the X server with a specific nice value, use the *nice* command. To adjust
    a running server’s nice value, use the *renice* command. Mortal users can decrease
    the priority of their own processes, but only the root user can change other users’
    processes or increase a process’s priority.


    The syntax of the nice command is as follows:


    nice *[option] [command arguments]*'
