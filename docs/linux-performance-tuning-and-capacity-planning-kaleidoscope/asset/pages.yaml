  md: '# Introduction and Overview

    PART I


    That is not to say these are the only subsystems (there’s also the sound subsystem,
    for example), but the three mentioned here are normally the subsystems that a
    system administrator will to troubleshoot in relation to the system itself. The
    networking subsystem is also of great interest to the administrator.


    How these subsystems affect the user’s experience and each other is very important.
    For example, one problem might mask, or hide, another. Suppose that the system
    appears to have heavy disk usage. However, upon closer examination, you discover
    that it is also doing an unusual amount of paging to the same disk(s). Obviously,
    this will result in heavier disk usage under normal circumstances. That does not
    mean disk I/O is all right; it only means that some of memory problem could be
    the culprit instead of disk I/O. This is the essence of performance monitoring
    and tuning.


    The kernel subsystems and their relations will be discussed in Chapter 10, “Disk
    Configurations for Performance.”


    # Defining Performance-Tuning Objectives


    As stated earlier, the most obvious reason for performance tuning is to solve
    an immediate performance issue. However, it is generally a good idea to have long-term
    performance objectives. The reason for this is simple: There is always room for
    improvement somewhere. You might also have uptime requirements—a system simply
    might have to work a little under for a period of time until the system administrator
    can work on it.


    This type of performance tuning falls under the proactive category of tuning.
    As a good case example, imagine that you want to upgrade BIND to a new release
    in a networking architecture that can benefit from such enhancement. Obviously,
    you cannot replace just an organization’s BIND services on a whim. Some degree
    of planning must take place before you take any actions.


    Long-term objectives might be simple: Find a way to speed up drives so that backups
    will take less time. Others might be incredibly complex, such as improving an
    entire network infrastructure, which is discussed more in Chapter 7, “Network
    Performance.”


    As you can see, performance tuning even in proactive mode can be time-consuming
    yet extraordinarily rewarding. The benefits of performance tuning obviously include
    a faster system, but often a well-tuned system is also a bit more stable. As example,
    a kernel that has only the drivers that a system needs is less prone to error
    than a generic installation kernel.'
