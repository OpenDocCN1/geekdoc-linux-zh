  md: '# Aspects of Performance Tuning CHAPTER 2


    recover. In extreme instances, when the kernel has absolutely no other resource,
    a process killer could be activated that will look for the most likely culprit
    of the memory loss and then kill off in an attempt to get the box back into a
    usable state. There have been many arguments about whether this is a valid approach,
    and it can be enabled or disabled with the kernel, depending on whether you feel
    that this is a safe last-ditch effort. Personally, I have had it kick several
    times in the process of testing code, and it has done a great job of getting the
    machine back in a usable state without a crash. Otherwise, because my box was
    remotely installed, I would have to wait until someone at the location facility
    could recover it for me.


    # Resource Starvation


    Saturation and starvation are related concepts, with a slight difference. Think
    of resource saturation as a subsystem that is overworked, or saturated. Starvation
    is the problem of processes that are waiting long periods of time for resources
    they need access. In most cases, starvation is a byproduct of saturation, that
    doesn''t necessarily have to be the case. Resource starvation can be an example
    of broken code as it is of an illequipped system. If a process is constantly blocked,
    waiting for a resource, and the scheduler never sees that it can be scheduled
    in, this is generally another piece of code that has locked that resource and
    hasn''t given it back. Avoiding deadlock of this kernel''s job; if a single process
    waits to hold on a device indefinitely while another process waits for it, the
    code is either broken or misconfigured.


    If the machine in question is misconfigured, it doesn''t have the hardware that
    it needs. In this case, fact that one process is locking a device and a second
    process is waiting for one might be because the machine should have two instances
    of the device in question. This depends on the task at hand and is generally a
    solvable problem. Likewise, if the Web server tries to create another child but
    fails with an out-of-memory error the system can''t physically allocate any RAM,
    this is a simple issue of a machine not having enough hardware to do it.


    # Unsatisfactory Response Time


    This is a fairly obvious problem, usually detected when users ask why the system
    isn''t behaving correctly. Most of the time, this is an instance of a system that
    has grown and is resource-starved; the problem is solvable with more hardware
    form, depending on the symptoms. If users are connecting to the database but are
    blocking until the machine has a chance to answer the request, it could be a simple
    problem of increasing the maximum number of connections to the database or adding
    more to the machine that it can serve the new influx of users causing the increased
    system load.


