  md: '# Capacity Planning

    PART V


    If your specific application supports external statistic polling, values present
    there should be tracked to make sure that it is behaving correctly under the load.


    In the end, it all depends on finding the data that you need to watch and making
    sure that it is collected at a useful interval for your environment. This might
    vary over time, depending on shifts in load types, but as long as you keep a good
    handle on the basic set of statistics and the specific extra set in which you
    are interested, usage patterns on the system rarely spin out of control.


    # Ways of Gathering Relevant Data


    If you need to gather data, there are a number of methods to do so, ranging from
    standard means to hacks. By far the most common method is SNMP: It is flexible,
    and different vendors hook into it for application-specific data. If you are serious
    about getting true statistics from your systems, SNMP is probably what you are
    looking for.


    You might not be interested in data directly from the systems, but have metavata
    about the overall architecture. In this case, methods range from rings around
    the network to port checkers and the like. Most of this information can be retrieved
    through SNMP, by hooking into various data points or judging outliers by holes
    in your data gatherings.


    For live data, the standard monitoring apps will probably do the trick. Refer
    to “Methods for Capacity Planning” for information on what applications are used
    to collect data. These can monitor most data you are looking for, or you can have
    a script poke at various components for you and report statistics back. This watches
    only transient data points, though it is generally not recommended. Keep in mind
    that the process of tracking statistics imposes a skew in the system itself—due
    to the Heisenberg Principle—by causing activity on the system to retrieve statistics,
    you are causing extra work for the system. In the case of SNMP, you are causing
    the kernel to handle the network interrupts and stack work to handle the request,
    and process overhead to handle the request in the SNMP daemon. In addition is
    the work involved in getting the statistics themselves. In general, this should
    be a light operation, but it is important to focus on the fact that you might
    be skewing the system lightly by monitoring it.


    If you need to look at a particular application''s status but cannot get to it
    through SNMP or other standards, there are probably other methods of hooking into
    it for usage data. Most applications of significant size have their own monitoring
    applications to keep tabs on the process''s health. The downside of this is that,
    depending on how the data is collected, it might not be integrated easily into
    a collection facility. This is why SNMP access is favored, but sometimes native
    data generated by the application is the only route available.'
