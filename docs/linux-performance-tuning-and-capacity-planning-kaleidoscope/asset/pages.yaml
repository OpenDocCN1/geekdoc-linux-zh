  md: '# vmstat


    The vmstat comes from "report virtual memory statistics." The vmstat utility does
    a bit more than this, in addition to reporting virtual memory, vmstat reports
    certain kernel statistics about processes, disk, trap, and CPU activity.


    The syntax for vmstat is as follows:


    $ vmstat interval [count]


    A sample syntax with an interval of 5 seconds and five counts would look like
    this:


    | r b w swpd free buff memory cache swap si so bo in system cs us sy id |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | 0 0 0 380 3768 71616 94176 0 0 0 24 10 105 45 0 32 |

    | 0 0 0 380 3768 71616 94176 0 0 0 0 1 105 5 0 99 |

    | 0 0 0 380 3768 71616 94176 0 0 0 0 0 105 4 0 100 |

    | 0 0 0 380 3768 71616 94176 0 0 0 0 0 103 0 0 100 |

    | 0 0 0 380 3768 71616 94176 0 0 0 0 0 103 5 0 100 |


    The very first line of output by vmstat is the average values for statistics since
    boot time, so do not be alarmed by highs.


    The vmstat output is actually broken up into five sections: procs, memory, swap,
    and cpu.


    Each section is outlined in the following table.


    # Table 3.3 The Procs Section


    | Field | Description |

    |---|---|

    | r | Number of processes that are in a wait state and basically not doing anything
    waiting to run |

    | b | Number of processes that were in sleep mode and were interrupted since the
    last update |

    | w | Number of processes that have been swapped out by mm and vm subsystems and
    have yet to run |


    # Table 3.4 The Memory Section


    | Field | Description |

    |---|---|

    | swpd | The total amount of physical virtual memory in use |

    | free | The amount of physical memory that is free or available |

    | buff | Memory that was being buffered when the measurement was taken |

    | cache | Cache that is in use |'
