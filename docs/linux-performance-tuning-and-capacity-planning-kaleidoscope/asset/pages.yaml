  md: '# Thinking About Capacity Planning

    CHAPTER 13


    Constantly plotting usage trends can save a lot of heartache. If the system''s
    memory usage is rising ahead of schedule, predicting the point where this turns
    into heavy swap usage allows you to take evasive action. This could be simple
    tuning, memory upgrades, or maybe the addition of a spare machine to the cluster.


    It is very important to remember that capacity planning does not involve predicting
    usage, building a system, deploying it, and then waiting until the scheduled time
    when the system should need upgrades to start looking at usage patterns. It cannot
    be said enough that although usage patterns can follow a predictable pattern,
    they can also spin out of control in a fairly short amount of time. By constantly
    monitoring all of system use, you will be the first to know about new trends on
    the system instead of finding out through angry users.


    Actual results of system monitoring, not the predictive results from a year ago
    what drives the upgrade path. As much as you would like to deploy systems and
    forget about them, if you suddenly have an increase in usage by several thousand
    percent, you need to see that curve coming and deploy fixes before it finishes
    growing. Hopefully, scalability was built into the capacity plan, simple upgrades
    will be all that you need.


    # The Neyer-Ending Need for Data


    You probably spend much of your time away in a sea of data, trying to make sense
    of it all— and all the systems seem to give you more to think about. When your
    task is to determine the usage of a system path over time and to plan its future
    extensibility, there is no such thing as too much data. Any bit of data that you
    can extract from the system to give insight on what should drive the capacity-planning
    process is invaluable.


    # Quality Versus Quantity


    Generating massive amounts of data is easy to do. Set up your SNMP polling device
    to check the status of every machine''s envie tree (which provides large amounts
    of system statistics), once every minute, around the clock. Or, set to update
    status every tenth of a second. Chances are good, though that of this data is
    useless to you. To avoid drowning in data, make sure that you collect exactly
    what you need. Tracking some peripheral data could be helpful, but to be truly,
    focus your needs on a central group of data points that most accurately describe
    the status of your machine.


    But what exactly do you want to watch? There should be a few things: Processor-
    memory, swap, I/O status on the drive subsystems, and network statistics such
    as transmission and error rates should round out most of the biggest indicators.
    Beyond that, individual statistics that matter to your system might vary wildly.
    Sometimes individual network card rates indicate problems. If you have multiple
    cards in your system and one seems to be getting much heavier when the two should
    be balanced, those numbers need to be tracked.'
