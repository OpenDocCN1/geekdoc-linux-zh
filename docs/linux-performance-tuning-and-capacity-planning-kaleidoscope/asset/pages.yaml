  md: '# xload


    The first of the two is xload. In a nutshell, xload displays the system load average.
    It also has an alarm bar that shows when the load average is high. Figure 3.2
    shows what xload typically looks like.


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_68_0.png)


    FIGURE 3.2

    An example of xload.


    To start xload, simply open an xtermal on the system and type the following:


    ```

    $ xload &

    ```


    The system knows to which display to go, so it automatically pops up. If you are
    running xload from a remote system to your X Window System, you can do one of
    two things:


    +   1. Set a permanent DISPLAY variable in your .profile by entering this:

    DISPLAY=<your_ip_address>:\0

    EXPORT DISPLAY

    2. Simply direct it to your system with this syntax:

    $ xload -display <your_ip_address> &


    The xload utility displays a histogram (chart) of the system load average. It
    updates information periodically. The default is every 10 seconds, but this can
    be changed with the -update option.


    # xosview


    The xosview utility can display a much more detailed collection of histograms
    about the system''s performance in close to real time.


    Of course, you can easily filter what you want to see in xosview using command-line
    options by specifying the subsystem with + or - (true and false, respectively).
    For example, to not see the CPU histogram, the syntax would be this:


    ```

    $ xosview -cpu &

    ```


    The xosview utility can be started from remote systems to a local X server in
    the same manner as xload. The colors, font, font, and other properties can be
    controlled by Xresource settings.'
