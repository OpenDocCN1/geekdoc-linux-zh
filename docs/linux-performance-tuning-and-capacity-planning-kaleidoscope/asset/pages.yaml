    The implications and work involved in deploying a true QoS (Quality of Service)
    and rate-limiting architecture are beyond the scope of this book. Large companies
    make a living by selling these capabilities as a service, so it''s really not
    something that can be summed easily in a few pages of text. Rather than flood
    the text with all the possible ways of doing this, here is an overview of the
    technology involved, some tools that were used in the process, and some pointers
    on to look next if this is viable for your situation. Also remember that many
    of the concepts here are generally implemented in hardware and also in recent
    years become available for standard software packages. Generally, deploying a
    Linux box will be much cheaper than rolling out expensive hardware, but it depends
    on your specific needs and whether the tools here will fit them. For some situations,
    a hardware device is still your best bet.


    Limiting bandwidth is a common practice. As explained in the previous example,
    there are many instances in limiting bandwidth for certain groups could be beneficial
    to the network in general. Also, if you are reselling your bandwidth in fragments,
    this is a clean way of making sure everyone using a fragment of your bandwidth
    is only using that fraction and is not stepping on everyone else. There are implementations
    on the market that are more affordable than Linux for some uses; there are situations
    in which a customer might be allowed to burst higher rates than others.


    The Linux traffic shaper might be what you need when working with limitation rules
    such as yours. You will need the shapecfg tool. The sharper device attaches to
    your Ethernet (or other) interface, and enforce bandwidth limitations on the sharper
    device with shapecfg. As you need to add another shape device with bandwidth limitation
    and attach it to your uplink, for route you might need the iproute2 tools to take
    full advantage of different routing tables.


    QoS takes another angle on bandwidth management. Differentiated Services is usually
    grouped with this term. Generally, the concept is that a certain level of quality
    is ensured by group managing the network. QoS with Differentiated Services has
    been available as a patch to the 2.2 kernel and is integrated with the iproute2+tc
    package added to your installation to make use of the 2.2 kernel. With the shaper,
    you will need the iproute2+tc package added to your installation to make use of
    it. By default, the packet scheduler will be a first, first out (FIFO) mechanism
    to determine what gets sent first. With QoS enabled, you can choose from a variety
    of algorithms to determine ordering. QoS and bandwidth limiting are related to
    each other in general, but not to be the same thing. QoS guarantees certain types
    of service in any type of resource load, whereas bandwidth limiting as the name
    limits the amount of bandwidth that any group can have. Segmenting your bandwidth
    to ensure a level of QoS can be done by making sure that no one user can use the
    entire bandwidth, but bandwidth limiting is only a small part of the problem of
    guaranteeing QoS.'
