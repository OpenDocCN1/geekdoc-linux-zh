  md: '# Introduction and Overview


    PART I


    For a lower cost, it is also feasible to get a normal storage array, perhaps with
    a SCSI interface, and place a server in front of it that exports the drive set
    to the rest of the network over something like NFS or Sma. This keeps the drive
    management centralized but introduces a single point of failure. Using a shared
    SCSI system, two machines can be plugged directly into the system that one can
    take over in the event of a failure. However, this is still a secondary solution
    to a Fiber Channel switch. If all interested machines have physical access to
    the drives, the load of all data being transported over your network is reduced.
    Although Samba is feature-rich, it is known to be a fairly faulty protocol, and
    can impact the performance of your network if all data is being transported over
    it.


    The gist of all of this is that storage is again heading for the centralized model.
    As the system grows, the savings begin to show in management overhead. The days
    when every machine had all the hardware within and managed itself are slowly disappearing
    as the concept of a SAN really takes hold. Many of the larger vendors support
    SANs with Linux nodes.


    # Identifying Bottlenecks


    Identification of bottlenecks is a difficult task, to say least. Depending on
    software interaction, simply looking at the memory usage and finding the culprit
    generally doesn''t work. As usual, this involves knowing the system and what might
    be causing the slowing, depending on the current load across different aspects
    of the system. If you''re looking for a rough order of what to check, a good sequence
    might be the one here (This isn''t to be taken as gospel, but it''s a decent enough
    gauge. If the path to the problem is fairly obvious, it might not make sense to
    feel all the checkpoints every time.


    +   * CPU—Look into what is using the CPU and when. Look for obvious abuses.

    * Memory—Look for abuses of memory on the system, according to various usage loads.

    * Swap—This interacts with memory, of course, but make sure to note various levels
    of swap usage over time.

    * I/O subsystems—Usage levels of all involved I/O subsystems; such as IDE and
    SCSI busses, proprietary interfaces that applications depend on, and so on.

    * Application settings—As noted previously, it is of paramount importance that
    you know your environment and how your applications should be configured. In the
    end, this will likely be the source of many bottlenecks.


    # Resource Saturation


    Saturation can occur in many forms. One is that the disk could be full, or approaching
    full. Generally, most filesystems start to experience degraded performance after
    usage goes over the 75% mark. Memory could be overextended, and the book could
    be swapping severely to'
