    # Using the Sniffer tcpdump


    A sniffer is a network-monitoring system that captures a great deal of information
    about the real content of a given network. Sniffers are particularly powerful
    they allow for the storage of several layers of TCP information, which, of course,
    can be used for performing malicious attacks as well as monitoring.


    On the upside, a sniffer can provide detailed information for troubleshooting
