  md: 'The patches usually reside on the same kernel servers as the rest of the source,
    except that they reside in the directory of the person who made the patch. Several
    people have directories here; depending on their focus, they might have patches
    in which you are interested. In general, the location of the patch that you need
    be specified in the changes file.


    When you get the patch, you need to apply it. It is assumed that you are applying
    the patch to a clean copy of the previous version of the kernel. For example,
    if you are running 2.4.4 and need to apply the 2.4.5 patch 2, which will eventually
    be 2.4.5, it is assumed that your kernel source is a clean version of 2.4.4. Likewise,
    if you are running 2.3 and want to patch up to the full release of 2.4.4, it is
    assumed that you have a clean copy of 2.4.3 to patch.


    In reality, you might have applied patches to 2.4.3—this is just a matter of whether
    the changes in 2.4.4 conflict with the patches you have applied. If so, you''ll
    probably need to revert the patches, apply the patch to 2.4.4, and get the new
    copies of your other patches that have been done against 2.4.4. Also remember
    that if you want to bring up the base to a larger jump—from 2.3 to 2.4...—you
    need to apply the patches in sequence: In this case, you''ll need to apply the
    patch for 2.1 to bring up the base so that it''s the same as the real 2.4.1. Then
    you''ll need to apply the 2.2 patch, to bring the 2.1 base up to 2.4.2, and so
    on. Depending on the age of the source, it could be simpler to get the complete
    new version—from the old series of 2.2.0 to 2.2.19 requires a lot of downloading
    and patching.


    To wrap this up before leaving this section, let''s walk through an example. Assume
    that you are running kernel 2.4.3 and are experiencing problems with your logic
    code. Looking at the latest news, Linus is up to version 2.4.4pre4, which means
    that four patches have been released since 2.4.3 came out. Looking at the release
    for patch level 4, you see that there are fixes for the logic driver integrated
    into pre3. Because these patches are cumulative in 2.4.3, you can get the 2.4.4pre4
    patch, patch it against your system, and see if it solves the problem. Whether
    you''re at it, it might make sense to look at the source difference in the logic
    code, to see whether it could fix your problem or whether it''s completely unrelated.


    Tracking these patches sounds like a daunting task, but with the help of news
    sources, vendors supplying fixes, and a quick release schedule, getting the latest
    isn''t that difficult. It ends up fairly rare that a specific patch is needed
    for very long before it is resolved within the kernel or whatever base it touches.


    # Trapping Kernel Oopses


    In the process of testing all these patches, you might crash the kernel. How do
    you take the kernel oops message and reconstruct meaningful data to fix the problem?
    Fully understanding the methods involved in tracing internal data can take years
    of practice, so this section points you in the right direction of getting the
    data to someone who can trace the meaning


