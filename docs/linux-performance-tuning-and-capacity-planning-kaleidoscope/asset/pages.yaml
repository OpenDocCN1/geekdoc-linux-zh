  md: '# Overview of Performance Tuning


    CHAPTER 1


    By virtue, performance tuning is also boundless. It is not necessarily constrained
    to a particular system on a network or to systems that have multiple-channel disk
    interfaces. Again, the problem might not be related to the core operating system
    at all.


    # Why Consider Tuning?


    Well, aside from obvious reasons, such as a system that might be running incredibly
    slowly, the most important reason is to improve system performance and enhance
    efficiency. The rewards that can be gained from a well-tuned system are pretty
    clear. For example, an order-entry system can now process orders faster because
    part of the system have been enhanced through performance tuning. This means that
    more entries can be pushed through, so production increases. In most organizations,
    this means savings of time and money.


    Performance tuning need not only apply to organizations, either. As a good example,
    a user might work on large programs that require a great deal of disk and I/O
    subsystems. Trimming the kernel and enhelby the disk I/O subsystem can help the
    programmer speed up compile time.


    The list of examples can go on forever, and there are very few reasons why you
    would not tune a system. The only imaginable case might be one in which the system
    administrator is too inexperienced to tune the system. Some other reasons might
    include uptime requirements, corporate policy, vendor support agreements, or other
    influences that are external to the sysadmin or the “shop” in general.


    # What Can I Tune?


    In a nutshell, you can tune whatever you want. Most Linux performance tuning revolves
    around the kernel, with perhaps the biggest exception being aspects of the X Window
    System. As mentioned earlier, the kernel itself is not always the only thing that
    requires tuning. A few examples of tuning outside the kernel are changing hardware
    parameters on the hardware, tuning the video driver within X Window, changing
    the way disks are organized, or simply changing the way a particular process is
    performed or engineered.


    The kernel is divided into parts known as subsystems. For the most part, these
    subsystems are all based on input and output (I/O). The main subsystems you will
    find tuning are:


    +   1. CPU


    +   2. Disk


    +   3. Memory'
