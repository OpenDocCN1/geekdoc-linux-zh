    build a system and assume that you don''t have to touch it for the next two years.
    It simply means that tuning shouldn''t be as much of a priority at the beginning
    as it should as time moves on. If tuning needs to be done from day one to make
    the system operate accordingly, this indicates a system that will not scale well
    over time. If the system was built to withstand normal growth rates for years,
    tuning should not enter immediately unless there is a huge unexpected explosion
    in usage. This indicates that the system was improperly planned or that the general
    market changed directions faster than anticipated. (Although this is stressful,
    it isn''t such a bad thing).


    Fortunately, hardware is inexpensive these days, and it is easy to build a system
    that can safely scale to at least intermediate levels. Given standard low-cost
    Intel hardware, most systems can be built to handle relatively high loads, which
    can carry enough time to deploy a more capable infrastructure in the face of the
    suddenly rising demand.


    In general, though, if things go along at the rate planned, don''t expect tuning
    to enter the picture significantly until the second half of the expected lifetime
    of the system''s current increment. When this happens, a blend of tuning and hardware
    upgrades are adopted—hardware may have advanced and general tuning has already
    been performed.


    Because hardware is relatively inexpensive, it is usually preferred to have heavy
    tuning. Upgrading a drive array or the memory in a server will be cheaper than
    paying several employees to spend weeks of time looking for bottlenecks and chasing
    minor speed gains. Only at the tail end of the system''s life should heavy tuning
    be adopted, when the cost of deploying new hardware in scale becomes more expensive
    than having employees or experts in order to tune operations.


    In general, because growth is usually expected, the time bought can be used to
    begin preparations for deploying major upgrades to the infrastructure. If the
    system is reaching the end of its life span or there is no growth potential for
    it in the future, software tuning is recommended. When the performance is brought
    back up to par, the system can be considered perpetually in most respects.


    # Predictive Analysis Versus Actual Results


    If your system was carefully planned, it should have to grow. As time goes on,
    though, constant checks on its health must be performed to see whether the plans
    in place are valid and whether the growth rate is on track. When you''re figuring
    the growth for the system, past data points should be taken into account. As time
    goes on, the new data points should always be merged into the various sets of
    data reflecting system usage over time. If this curve is moving ahead of schedule,
    hardware upgrades or tuning might need to be done sooner than planned.'
