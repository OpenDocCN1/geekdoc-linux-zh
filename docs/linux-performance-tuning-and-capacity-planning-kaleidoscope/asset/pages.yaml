  md: '# Tuning and Performance Mechanics

    PART IV


    The next time you boot, enter or select the new kernel from the list and then
    test the system with accordingly. If you don''t have a graphical list of options,
    hit tab at the LILO prompt for the list of available kernels to choose from and
    also disable the pending time. If there are problems, you might want to try booting
    in single-user mode, which is a good way to test the system before all services
    are started. It is an invaluable means of performing tests and doing administrative
    work that shouldn''t be done when the system is in multiuser mode. A surprising
    number of administrators never know how to enter a kernel in single-user mode
    under Linux, but all it takes is typing the single name of the kernel that you
    want to boot.


    So, far we''t said anything about GRUB. In theory, it performs the same operation
    and gives you the same list of kernels or other operating systems to choose from
    boot time. The major difference with GRUB, from a normal user''s point of view,
    is that you don''t have to initialize the boot sector of your drive every time
    you add a new kernel. After GRUB is installed, you have to modify only a single
    file to enter the new kernel option. It is typically /boot/grub/menu.lst. After
    you enter your new kernel into the list and reboot, the option will be in the
    list without running a utility such as lilo.


    GRUB also provides nice capabilities that might make it a better choice, depending
    on your environment. Besides being compliant with all relevant standards, it enables
    to download images over a network, making centralized management of kernels simpler.
    It also protects disks. The GNU developers have never declared it to be complete
    and have not made public announcements about its status, distributions are beginning
    to offer it as an optional bootloader, for example. Some making it the system
    default (Caldera and Mandrake). At this point, most users are still more familiar
    with lilo, although that could change.


    One more operation should be done, although it is not critical to the operation
    of your new kernel. The kernel build left a System.map file in the /usr/src/linux
    directory, which can be used to get symbol locations. It is generally good practice
    to copy this file to /boot and name something like System.map-kernel, where "kernel"
    is whatever you named your kernel. Then rename the existing System.map in /boot
    (or rename it to something meaningful) and symbolically link System.map to the
    new file, as shown shown here:


    ```

    # cp /usr/src/linux/System.map /boot/System.map-2.4.2

    # cd /boot

    # mv System.map System.map.original

    # ln -s System.map-2.4.2 System.map

    ```


    This enables you to change symbol tables easily when trying to debug kernel versions,
    but it is not an absolutely necessary step in the process. The system can run
    without having the map, although some distributions will dump errors about the
    wrong map being in place.'
