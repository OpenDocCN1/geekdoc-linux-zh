  md: '# Measuring the Results


    After implementing a possible enhancement, you will want to see if it worked.
    x11perf makes this task easy. First, retry using the same test, saving the output
    to a file. Next, use x11perf to compare the results. The good news is x11perf
    is much simpler than x11perf. Its syntax is:


    ```

    x11perf [-r -ro] [-l label_file] file1 file2 [...]

    ```


    Here, file1 and file2 store the results of the tests of the first and second tests.
    You can specify additional files, too. -r indicates that the output should include
    a column showing the performance of the second and subsequent tests relative to
    the first. -l label_file restricts the tests selected for comparison (use x11perf
    -labels to determine the proper labels to use). file1 must count results for all
    tests in the retests, or the program will fail. Listing 6.3 illustrates a typical
    x11perf session.


    # Listing 6.3 Output from x11perf


    ```

    $ x11perf -r movree.1 movree.2

