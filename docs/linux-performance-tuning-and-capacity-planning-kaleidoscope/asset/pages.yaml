    it knows it doesn''t have? In reality, policy on overcommitting memory has caused
    many arguments in kernel development. As explained earlier, the kernel uses "copy-on-write"
    mechanism to conserve memory. When a process forks itself, the child doesn''t
    really need all the data structures copied over. Realizing this, the kernel saves
    the memory that would be needed for the original and allows the child to go on
    no duplication. If the child requests this data, the original structures from
    the parent are copied over so that it can behave as normal.


