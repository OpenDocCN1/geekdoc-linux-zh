- img_proc: true
  md: '# Thinking About Capacity Planning


    Potentials also need to be figured in developing a small testing system (both
    and possibly component types) that will have to scale by large amounts if it does
    well in the testing market. In this case, the system''s actual growth rate is
    less of a factor than the potential rate because the system might not need to
    handle moderate growth well—instead, it should have the capacity to potentially
    grow by leaps and bounds. The actual growth rate will likely be moderate and easily
    predictable, whereas the potential growth rate will be large and will assume more
    architecture work front.


    Each metric applicability might be somewhat vague, so let''s run through an example
    of how to apply the two in a situation. As a system designer, you are working
    on a normal, run-of-the-mill Web site that has a transaction server and a database
    on the back end. When designing for system deployment, the normal annual growth
    rate of users is assumed to be 25% (a random number) annually, once word gets
    out and the initial customer base is in. This rate is determined from a number
    of factors, based on other products and where the target market is heading over
    the next few years. To account for this rate, you construct a sufficiently powerful
    Web server, application server, and database server to handle the eventual load.
    In discussions with the heads of business development, however, plans are uncovered
    on that to open this to another group of users. An in-house prototyping is going
    on that, if successful, is possible to scale your system; this would be rolled
    into your capacity set, which could raise your load significantly.


    Suddenly, your normal growth rate remains the same, your potential growth rate
    is phenomenally high. How do you prepare for this? You need to target on your
    initiative architecture to reflect this shift in potential. When you had one Web
    server, you might need a load balancer and a failover node to correspond with
    it. Your single Web server''s requirements can be loaded and distributed across
    several nodes in the load-balancing pool. Small modifications are needed to scale
    the transaction system; where you had one database, but now makes sense to install
    a parallel cluster, resulting in two machines where previously was one.


    Now, for the slight hike in pricing, your previous architecture can load-balance
    an arbitrary number of servers, and your database system is much more scalable.
    In the end, the cost might not be different, but your capacity for potential growth
    has gone through the roof.


    The lesson be learned here is that both methods need to be applied, and risks
    between the two need to be assessed up front. If you absolutely build for potential
    growth, take those factors into account. But if those are too high for your environment
    and the focus should instead on actual growth, that path might be far more important.
    Some combination of the two is probably beneficial, allowing for normal actual
    growth and maximizing your preparation for a large jump in potential. As applied
    to this example, a good intermediate solution might be to apply the database cluster,
    maximizing growth there because it would be most disruptive to'
