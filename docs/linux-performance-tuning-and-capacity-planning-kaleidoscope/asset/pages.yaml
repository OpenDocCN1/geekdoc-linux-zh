  md: '# Popular Unix Performance-Monitoring Tools for Linux

    CHAPTER 3


    Tools like bonnie really help illustrate the difference between an untuned system
    and a tuned one, or an older one (in this case, the sparc system) and a new one
    (x86 box).


    # Other Tools


    In addition to the general tools and subsystem-specific ones, you have a variety
    of mixed and other performance-monitoring tools at your disposal. The next sections
    look at these in more detail.


    # ps


    The ps command is another highly used tool where performance performance is concerned.
    Most often it is used to isolate a particular process. However, it also has numerous
    options that can help you get out of ps and perhaps save some time while trying
    to isolate a particular process.


    The ps command basically reports process status. When invoked without any options,
    the out-put looks something like this:


    ```

    $ ps

    PID TTY TIME CMD

    3220 pts/0 00:00:00 bash

    3251 pts/0 00:00:00 ps

    ```


    This basically tells you that the current session of the user who invoked it is
    doing.


    To look at other users or the system as a whole, ps requires some further options.
    The ps com-mand''s options on Linux are actually grouped into sections by selection
    criteria.


    Let''s see what you are doing and what they can do.


    # Simple Process Selection


    Using simple process selection, you can be a little selective about what you see.
    For example, if you want to see only processes that are attached to your current
    terminal, you would use the -T option:


    ```

    [jfink@kerry jfink]$ ps -T

    PID TTY STAT TIME COMMAND

    1668 pts/0 S 00:00 login -- jfink

    1669 pts/0 S 00:00 -bash

    1708 pts/0 R 00:00 ps -T

    ```


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_71_0.png)'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Process Selection by List


    Another way to control what you see with ps is to view by a list type. As an example,
    if you want to see all the ident processes running, you would use the -C option
    from this group that displays a command:


    ```

    [jfink@kerry jfink$ ps -C ident

    PID TTY             TIME CMD

    535 ?               00:00:00 ident

    542 ?               00:00:00 ident

    545 ?               00:00:00 ident

    546 ?               00:00:00 ident

    550 ?               00:00:00 ident

    ```


    # Output Format Control


    Following process selection is output control. This is helpful when you want to
    see information in a particular format. A good example is using the jobs with
    the -j option:


    ```

    [jfink@kerry jfink$ ps -j

    PGID SID TTY             TIME CMD

    1669 1669 1668 pts/0      00:00:00 bash

    1729 1729 1728 pts/0      00:00:00 ps

    ```


    # Output Modifiers


    Output modifiers can apply high-level changes to the output. The -e option is
    to show the environment after running ps:


    ```

    [jfink@kerry jfink$ ps -ae

    PID TTY             STAT TIME COMMAND

    1668 pts/0        S      00:00 login -- jfink

    1669 pts/0        S      00:00 -bash TERM=ansi REMOTEHOST=172.164.102

    HOME=/home/j

    1754 pts/0        R      00:00 ps ae LESSOPEN|/usr/bin/lessipe sh %s

    ```


    The remaining sections are INFORMATION, providing version information and help,
    and OBSOLETE options. The next three sections give some specific cases of using
    ps with certain options.


    # Some Sample ps Output


    Of course, reading the man page pages, but a few practical applied examples always
    light the way a little.


    The most commonly used ps on Linux and BSD systems is:


    ```

    $ ps aux

    USER       PID %CPU %MEM VSZ RSS TTY STAT TIME COMMAND

    root         1  0.0  0.0 1116 380 ?        S Jan27 00:01 init [3]

    ```'
