    software people might have looking at new ways of disseminating some business
    intelligence using new distribution protocol. Hearing about this plan, they learn
    about a new market that the company is working to capture. As a result, they can
    plan code to accommodate the upcoming needs.


    # Grounding Planning Reliability in the Real World


    Global planning might not be perfect, though. As mentioned before, there are always
    unknowns. If you develop as much as you can to fit the global view and still for
    different capacity fluctuations, factors beyond your control might change. Consider
    the case in which your business acquires some companies, and all of these new
    companies'' systems are rolled into yours to prevent duplication of effort. Although
    you might have factored in normal business growth rates, chances are good that
    the system isn''t ready to double or triple'
