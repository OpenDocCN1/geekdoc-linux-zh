  md: '# Overview of Network-Performance Issues


    In these days when nearly everything you depend on your network, you need to make
    sure that the network you are deploying will be physically capable of handling
    the load and your machines on the network are correctly configured to maximize
    usage of the physical wiring. Generally there are many ways to increase performance,
    through modifications to the network hardware, the protocols used over the network,
    the machines and applications that use those protocols, and good policy on utilization
    of bandwidth, either physically imposed or just through general procedures.


    Always take into account all activity happening on your network, your current
    architecture, the planned architecture, and planned usage. Ensure that decent
    knowledge is present on both the operating system and application side and on
    the networking side. Decent knowledge should be enough to cover your current needs,
    but also enough for you to know that won''t be held back in the future because
    of a lack of expertise. If you''re just doing basic application work, a decent
    knowledge of TCP/IP and maybe DNS is probably appropriate; whereas if you are
    looking for extreme performance, you might need someone who knows the IP stack
    of the kernel. All the Tuning experts in the world won''t help a bit if your network
    isn''t laid out correctly.


    Poor network performance can effectively bring a system to a halt, as we are on
    able to communicate with systems in real time. A mismanaged network is probably
    the worst thing that can happen to your business because nearly everything will
    come to a dead stop without it. This chapter is as about making sure that your
    physical network is prepared as it is about making sure that your software is
    using correctly.


    # Hardware Methods


    Described here some methods you can use to improve your physical network to help
    your system''s efficiency. No book can cover everything, but this section presents
    some low-order changes you can make to your network.


    First, determine the correct underlying transport architecture, at the lowest
    level. Raw 10MB Ethernet simply isn''t going to cut it for many applications,
    and although 100MB switches do the job in many situations, in demanding environments
    even Gigabit Ethernet won''t provide the throughput you need. In some situations,
    you need to raise the bar to something like ATM, although usually you can pull
    some out of your sleeve to avoid that route—this is a management nightmare when
    compared to traditional technologies like Ethernet. Other systems out there, as
    Frame Relay and ISDN, generally aren''t contenders these days laying out a system.
    If they are, you will face special considerations in utilizing that bandwidth;
    some of the Linux bandwidth-management techniques described here'
