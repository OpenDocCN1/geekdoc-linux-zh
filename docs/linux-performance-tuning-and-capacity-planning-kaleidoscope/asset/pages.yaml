  md: '# Introduction and Overview


    PART I


    # Sudden Changes


    As mentioned previously, there can be sudden upswings of requirements. The system
    needs to be capable of handling this. Make sure there is adequate spare CPU power
    to handle peaks, and also enough redundancy to handle losses of nodes. There are
    many ways to handle this: through GFS clusters, the Linux Virtual Server project,
    and so on. The optimal system can have spare nodes offline that can be swapped
    in automatically at a moment''s notice. For something like a Web cluster using
    GFS with a Fiber Channel, failure of a given node is not so detrimental to the
    system overall. In a database environment, database clustering is a good option
    to handle


    Another type of sudden change to hit is a new rollout of software, whether it
    is your in-house system or new versions of software involved. It is impossible
    to overstress the importance of serious testing of every bit of piece of software
    before it gets dropped into production. Nothing is as wasteful as trying to recover
    from a failed installation of software because it wasn''t tested enough. With
    a large enough system, an hour of downtime due to this kind of glitch can be devastating.
    If possible, do the work incrementally and maintain the old software configurations
    in case you''re upgrading kernels to revert back. The cluster, keep the old images
    around so that you can back them up to what you need. Perform the upgrade slowly,
    and watch for disturbances along the way.


    Of course, the environment doesn''t always allow such a nice, easy change. Depending
    on your needs, you might be forced to drop in many modifications at the time any,
    any of which could cause a dozen different types of problems. In any case, back
    up anything and everything that you can. Nothing is foolproof, and having a handy
    tape backup can save you if the change goes away.


    If changes starting to happen to the system that weren''t planned, things can
    get very messy unless the problem is approached with a clear head. Determine when
    it is. Is it only during a peak load that the symptoms are evident, or is it consistent
    over time? Was some "trivial" update somewhere was thought to have no impact outside
    its scope? This is most often the cause. Some small part of the system gets a
    small tweak, and you think that it doesn''t affect anything but itself—sometimes,
    though, this can cause serious problems.


    # Introduction of the Problem


    If problems start occurring in what we seems like a random sequence, don''t lose
    your cool. Look at when and where it is happening. Again, is it only under heavy
    load? Does it happen only in the morning? Resolving these kinds of problems involves
    heavily on specific knowledge of the system in question. If the data that is processed
    first thing in the morning is a different type than what is handled throughout
    the rest of the day and the problem occurs only at 9:00 A.M., it''s probably a
    false assumption that the problem lies in the data.'
