- img_proc: true
  md: '# Tuning and Performance Mechanics

    PART IV


    there are 10 defined run levels, two of which are reserved for shutting down the
    system. The lowest run level for system interaction is run level 1 (also referred
    to as single-user mode). Run level 2 allows access to multiple users and might
    have networking services; however, it might not have optimal networking services,
    such as a news server. The default run level for systems not running X is 3, and
    the run level with X Window is 5. To switch run levels, the init command followed
    by the appropriate run level can be used. For example, to go into single-user
    mode, you would use this command:


    ```

    # init 1

    ```


    In addition to the rc numbering scheme, each script has a number either K or S.
    This number is used to define the order of start and kill processes. For example,
    S00init will start before S20random. The reasoning for this is simple: One particular
    process might have a dependency that must be started.


    It is now easier to see how run-level directs relate to the state of the system.


    Two ways exist to permanently change the state of an init script. One is to simply
    remove its capability to execute in /etc/rc.d/init.d. The other is to use a front
    end to manage services. The Linux utility and tksys, a Control Panel program,
    can be used as an easy front end to services.


    # The Role of Other Files in /etc/rc.d


    So far, the /etc/rc.d run-level directories and /etc/rc.d/init.d scripts have
    been covered. There are other files in /etc/rc.d that play a significant role
    as well, and these vary among distributions.


    /etc/rc.d/rc File

    This job''s job is to start or stop services when a run level has changed. It
    can also do very rudimentary setup functions that are not in their own rc scripts,
    such as setting the hostname.


    /etc/rc.d/rc.local

    This script is executed after all other init scripts. It can be used if the sysadmin
    does not want to install a full Sys–type init script.


    /etc/rc.d/rc.sysinit

    This script is run at boot time. It performs several critical checks and configuration
    actions, such as setting the system path and ensuring the filesystem is all right
    by running bcheckckrc and related tasks.'
