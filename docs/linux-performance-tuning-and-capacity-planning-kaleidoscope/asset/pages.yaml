- img_proc: true
  md: '# Network Performance

    CHAPTER 7


    Some data, as our example of video streams, doesn''t react well to waiting for
    the machines at either end to figure out that data was dropped and must be. In
    the case of a temporally compressed format such as MPEG, each frame can depend
    on what was present in a previous frame. If you lose part of a frame, it might
    take several frames for the algorithm to fully recover the image.


    Loss of content is one side effect, but performance is also slowed. By using ECN,
    routers can set the Congestion Experienced in the packet so that the machines
    know that packet loss likely happened. This can save the TCP stack on each end
    from extending its window until that loss does occur, and then it can take immediate
    action on the problem.


    The issue with ECN at this stage is that routers will block it, and some operating
    systems don''t understand it yet. If this is the case with your system or the
    network path you are using, you probably want disable ECN. But if you can convince
    anyone on your path to enable ECN, in both network hardware and systems, it can
    provide a better method of recovering from congestion.


    # Keepalive Times


    The Ttcp keepalive_value, specified in seconds (the default is 7200), controls
    how long sockets are left open when SO_KEEPALIVE is specified on the socket. This
    depends greatly on your needs. If you have applications that keepalive should
    be used but they don''t need it for most cases, you could end up with large numbers
    of old sockets left open for two hours. Reducing this value help lower the impact
    of having all leftover sockets open.


    As described earlier, Samba allows the specification of SO_KEEPALIVE, but two
    hours might be a long time to keep a socket open in the hopes that it might be
    used for SMB traffic. If the machine is doing other work and would benefit from
    having those elsewhere, shrinking the time and overhead of keeping that socket
    in a good state will save resources on the box. Finding a good balance between
    making sure sockets are kept open for a while and reducing overhead may help you
    manage your system load better.


    # tcp_sack


    When multiple packets of data are lost from a single window of data during a TCP
    transfer, performance can drop significantly. The sender can learn only about
    one lost packet per round trip. There are ways around this, but it generally results
    in retransmission of already handled data, wasting network bandwidth and processing
    overhead. Selective acknowledgement, as turned on /proc/sys/net/ipv4/tcp_sack,
    allows the receiver to send immediate SACK packets back to the sender about what
    set of packets were lost during the window. Because this


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_151_0.png)'
  merge: -1
