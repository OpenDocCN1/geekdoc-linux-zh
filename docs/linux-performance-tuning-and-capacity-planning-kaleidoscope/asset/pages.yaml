  md: '# Introduction and Overview


    PART I


    # Tuning or Upgrade?


    Users are screaming and the system is fully loaded. What do you do? Spend another
    fruitless day tweaking configurations, or just break down and buy more hardware?


    # Determine Particular Bottlenecks


    Understand your system. This is your mantra. If database access is slow but the
    machine’s memory, CPU, and disk look fine and the database relies on information
    halfway across the network, remote repository might be the culprit. Tracking problems
    should be a matter of deduction, not trial and error. You also see if there is
    a single bottleneck involved or the possibility of multiple snaps in the flow.
    Keep in mind that in fixing each snap, each should be handled independently, and
    system tests should be run after each fix to determine what actually the culprit.
    Never apply multiple fixes to the same problem at the same time. If you''re lucky,
    it''ll just fix the problem and you''ll know which was the real bottleneck. If
    you''re unlucky, the “fixes” could break things in a way you never expected, resulting
    in a system that is more broken after the fix than beforehand.


    # Determine a Simple Test for Measuring


    When trying to trace a problem, always look for a simple test metric that tests
    a certain component but unlike to stress others. By interacting with the system,
    you''re bound to the Heisenberg principle, but minimizing the effects is in your
    best interests. Consider the case in which drive speed is in question: The database
    is slow, and the consensus seems to be that throughput doesn''t keep up to pace:


    ```

    # time dd if=/dev/zero of=/mnt/file bs=1M count=200

    ```


    This creates a 200MB file on the disk. Make sure that you use a file larger than
    your system’s memory so that you are sure you are using the disk, not memory.
    Do this several times, and average the results. Figure out the throughput rate
    based on your elapsed time and file size, and compare this to the advertised speed
    of the drive in question. Does it match? If so, the drive is up to speed and the
    problem is elsewhere. Apply this kind of test for a single component against the
    next likely culprit, and eventually you''ll track it down.


    # Do Not Tune Randomly


    A few rules should always be applied when tuning. The first and most important
    is that you should never tune more than one subsystem at a time. This should be
    adhered to without fail, as tempting as it is to try save time by applying several
    fixes at once. You might just fix another problem, obscuring the problem that
    you might might not have just fixed.'
