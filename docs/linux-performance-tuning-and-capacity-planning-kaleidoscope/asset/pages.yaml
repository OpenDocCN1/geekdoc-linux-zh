    buffers will help performance. That way, the server doesn''t have to spin the
    disk to repeatedly get the files for clients. The first priority is to make sure
    that your machine is making use of its memory for filesystem buffers. In most
    environments, the machine running Samba is a standalone file server and isn''t
    taxed heavily by other applications running on the machine. In this case, most
