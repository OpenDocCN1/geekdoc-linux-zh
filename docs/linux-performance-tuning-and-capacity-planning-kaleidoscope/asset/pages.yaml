  md: '# Performance Monitoring Techniques

    PART III


    Similarly, the drivers have been modularized and optimized. Across the board,
    drivers are faster. A core driver might implement functionality common across
    a chipset family, supplemented by one or more modules specific to a particular
    chip or CPU revision loaded dynamically. Support for X extensions, features not
    present in the original X protocols added later, have also been broken down into
    functional units, implemented as modules, and loaded on an as-needed basis. Examples
    include the font drivers, support for input devices (keyboards, mouse devices,
    graphics tablets, joysticks, and so on), and features such as 3D graphics, video,
    multithread, and video.


    > NOTE

    When this book went to press, XFree86 4.0.3, the most current release, supported
    fewer graphics adapters than version 3.3.6, but the number of unsupported cards
    declined dramatically from the initial 0.4 release.


    Other improvements include better support for PCI and AGP video adapters; a more
    consistent and extended configuration file syntax; the Xinerama extension, which
    enables a single screen to be spread across multiple monitors; much support for
    3D graphics, particularly SGI OpenGL standard; native support for TrueType fonts;
    and support for VESA''s DDC standard, which enables graphics adapters and monitors
    to communicate.(The benefit here is that you are much less likely to blow out
    your monitor if the video card attempts to run the monitor beyond its capabilities.)


    To give credit where it is due, some of XFree86''s improvements are the result
    of markedly better support from vendors of video cards, manufacturers of graphics
    chips, and suppliers of commercial X servers. After Linux burst upon the scene
    in 1999, information and assistance from previously uncooperative sources became
    much easier to obtain.


    In short, if you are still using XFree86 version 3, you should upgrade to version
    4. In addition to offering an improved design and a richer feature set, it is
    the base upon which further enhancements will be built.


    # Upgrade the Hardware


    For the sake of completeness, the last tip is to upgrade the system on which the
    X server runs. In some cases, all of the software tweaks and refinements that
    you can apply will have less cumulative effect than more RAM, large disk drives,
    a faster CPU, or a 3D video adapter with all the latest whistles and bells. Recognizing
    that hardware upgrades might not be an option in many circumstances and the recommendation
