  md: '# Performance Monitoring Techniques

    PART III


    Failover of a single box to a secondary machine is done by what is known as heartbeat
    code.

    The heartbeat runs on the machines involved, so the failover machine will know
    when to perform IP if a failure occurs. The heartbeat must take place over at
    least two interfaces by default, as a serial line or UDP. This way, one connection
    can go down without the failover machine trying to take over the address. The
    primary machine might still be up, but someone in the server room might have disconnected
    the serial line to move it. In case the Ethernet connection was still valid, the
    machines could talk over the network and failover did not take place. The secondary
    machine determines that the primary is down through all interfaces, it takes over
    for the primary box.


    Although there is lot more involved in failover than that short paragraph, our
    main focus here is network load distribution, which is the other side of the project.
    This is handled by the Linux Virtual Server (LVS) project. The LVS allows a single
    front-end machine to act as a load balancer for a cluster of machines in the back.
    (Failover should be applied to the front server because losing its connection
    can result in the loss of access to the whole cluster.) If you are dealing large
    volumes of data transfers, probably doesn''t make sense to expect one machine
    to handle the load of the entire network. With LVS, you can place as many machines
    in your cluster as you want, depending on how far you want to distribute the load.


    This can be done a variety of ways, but not all of them apply to our problem of
    network load. The first is virtual serving via Network Address Translation (NAT).
    Clients make requests against a central server, which transparently forwards the
    request to a server in the cluster to handle the response and then ships the given
    response back to the client as if the NAT server actually done the work. Although
    this, it doesn''t scale beyond 20 servers in the NAT cluster, and it creates a
    bottleneck at the NAT box.


    The second solution offers more flexibility. As IP tunneling, it requires all
    responding nodes in the cluster to have IP addresses, but it may make much better
    use of the network than the NAT approach. In this system, clients talk to a central
    server (again with failover). However, rather than having the responses all back
    through the NAT server, the NAT machine creates an IP tunnel to one of the nodes
    in the cluster. This node handles the request and then responds directly to the
    client. This reduces the network-strain on the NAT box and also allowing the handler
    server to use another network segment to send the response. The extra network
    segment advantage might not help in serving Web clients over the Internet because
    the bandwidth isn''t quite as high, but it could be useful in clusters of machines
    that work close to each other and have high throughput demands.


    The second solution is much better, but some improvements could be made. A third
    solution, called direct routing, offers even better scalability and performance.
    In this situation, the central machine handles the initial request. Rather than
    tunneling to the handler server,'
