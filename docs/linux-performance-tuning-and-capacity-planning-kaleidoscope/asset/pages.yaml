  md: '# Performance Tuning Tools

    PART II


    Before the Linux kernel, there was Unix. Well, okay, there were a lot of different
    flavors of

    but most Unix systems came from Hewlett Packard''s Unix-UX to Sun

    Microsystem''s SunOS and Solaris. In addition to the commercial variety, there
    were also

    free operating systems. The Berkeley Software Distribution (BSD) was the main
    free

    Unix; it later spanned three flavors of free Unix: OpenBSD, FreeBSD, and NetBSD.


    Without going into too much historical detail, it is safe to assume that the art
    of performance

    tuning has around a long time. To better enable the system administrator in the
    task of

    performance tuning, many tools were created on these systems before the Linux
    kernel

    bame as popular as it is today. Almost all of these tools have been ported to
    or rewritten for

    use Linux-based operating systems. The reverse also is true: Many of the newer
    tools ini-

    tially developed on Linux-based systems have been ported to other flavors of Unix.
    This

    chapter looks at some of the popular Unix tools that have been ported or rewritten
    for use

    Linux systems.


    For more information on the history of Unix, go online and search

    http://www.yahoo.com/ or http://www.google.com/. Many Web sites chronicle Unix

    and Unix-like operating systems history.


    # The Scope of These Tools and the Chapter


    Take my word for it: A Plethora of other performance-monitoring tools are available
    for Linux

    and Unix operating systems. This chapter takes a look at the most of these

    tools. Indeed, an entire book could be written on every single performance tool
    ported to

    written on Linux. The unfortunate truth, however, is that the book would never
    be up-

    to-date because so many are added almost daily.


    This chapter is divided into four generic sections of tools:


    +   1. All-purpose tools


    +   2. Disk benchmark tools


    +   3. Network monitoring tools


    +   4. Other tools'
