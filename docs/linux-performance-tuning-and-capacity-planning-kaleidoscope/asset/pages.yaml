  md: '# Performance Monitoring Techniques

    PART III


    Also figured into this number is the space used by shared libraries. Because the
    memory used by shared libraries is shared across processes, this might shift the
    value higher than what is accurate. At a minimum, the C libraries are usually
    added to this, which can make the process look larger than it is; in reality,
    the shared instance of the C libraries, which could be in dozens of other processes
    on the system, is using only one copy of itself.


    +   - SHARE—This is the portion of the memory in the RSS that is shared data,
    such as shared libraries.


    Overall, a good estimate can be achieved by subtracting the SHARE value from the
    RSS value. This turns out to be a little low because there is an instance of the
    libraries that ends up being counted. For most purposes, this is sufficient.


    Also be sure to look into how processes are sharing data. Depending on the configuration,
    an application may resort to different types of sockets to transfer data, which
    can be resource-intensive compared to using SysV shared segments. Making sure
    that SysV is used when possible can result in much more efficient use of the system’s
    memory.


    # Paging and Swapping


    In general, the mechanics of paging and swapping are hidden behind the scenes
    and require interaction only when your machine runs out of physical memory and
    starts moving chunks of data into swap.


    Originally, historical Unix systems performed swapping by moving the entire address
    space of a process to disk. Linux uses a more fine-grained approach, in which
    swapping is done on a per-page basis. Because Linux uses a 4KB page, this is the
    most granular chunk that can be moved to disk. With some hardware hooks and of
    some room in the page table, requests for data that are swapped out are quickly
    detected and handled.


    As mentioned before, swapping can result in chunks of code being placed in swap
    and left for a long period of time. If you have memory free and there is still
    swap in use, don’t be alarmed: the kernel hasn''t found a reason to bring data
    back into memory. This is for the benefit of the in-memory kernel buffers and
    general memory access for applications that require it.


    Again, swapping is handled transparently by the kernel and should help only when
    the system is running out of resources. If you think that the system is not handling
    swap pressure as it should, refer to Chapter 9 for information on how to force
    it to shift behavior as swap levels are met.'
