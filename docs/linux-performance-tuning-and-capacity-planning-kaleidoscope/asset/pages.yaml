    # time


    One very simple tool for examining the system is the time command. The time command
    comes in handy for relatively quick checks of how the system performs when a certain
    command is invoked. The why works simple: time returns a string value with information
    about the process and is launched with process like this:


    ```

    $ time <command_name> [options]

    ```


    Here is an example:


    ```

    $ time cc hello.c -o hello

    ```


    The output from the time command looks like this:


    ```

    $ cc hello.c -o hello

    0.08Buser 0.04system 0.00.11elapsed 17%CPU (%avgcpu+0avgdata 0maxresident)

    inputs+outputs (985major+522minor)pagefaults0swaps

    ```


    Even though this output is low-level, the time command can return enlightening
    information about a particular command or program. It becomes very helpful in
    large environments where operations normally take a long time. An example of this
    is comparing kernel compile times between different machines.


    # Some Network-Monitoring Tools


    Many system performance can be relative to external factors such as the network.
    Unix has a vast array of tools to examine network performance, from single host-monitoring
    software to applications that can monitor and manage vast WANs. This section looks
    at relatively low-key applications for monitoring network activity:'
