  md: '# Network Performance

    CHAPTER 7


    Zero-copy networking handles this in a clean manner by allowing DMA directly from
    the page cache. It also uses the checksuming hardware in modern cards to save
    the overhead of copying the data for the checksum pass. This saves CPU overhead
    and prevents cache pollution by not replicating the data. The catch is that your
    network hardware (and driver) needs to be capable of doing the checksumming and
    performing the "scatter/gather" operations to piece together the data for transfer.


    Systems that rely heavily on network speed, this can yield large performance gains.
    Informal tests have that an average Pentium III machine with zero-copy networking
    enabled can push enough data onto the network to a gigabit speed and not even
    utilize the CPU. As this gets more testing in the field, get some interesting
    benchmark results.


    TUX, mentioned earlier, is a perfect example of use for zero-copy networking:
    it is written with the idea that the zero-copy networking patches are also present
    on the system. Because it is serving data directly from the kernel, ensuring that
    the kernel is efficiently sending files from disk to the network card is of utmost
    importance. Having zero-copy networking in places means that the kernel is getting
    the best performance from those few send requests it is handling. The data is
    going directly from the page cache to the network card via DMA, so the impact
    of these requests on the system is minimal.


    # High Availability/Load Balancing


    When you are working with a high-availability network, you have two major goals:
    making sure the machines are always available, and making sure that the network
    and general load are balanced between them. Although this can be a factor of CPU
    and memory performance, the Linux high-availability projects are also useful in
    distributing network requests. The work is done by several centralized groups,
    and several companies are building products on top of their work (Red Hat''s Piranha,
    VALin''s UltraMonkey, SGI''s FailSafe products are a few names close to the project).
    The project and implementation details of doing high-availability work can become
    complex, but the general concepts are easy to understand. Here are some basic
    concepts and information on how they would apply to distributing your network
    load over a set of machines.


    A couple angles on the approach, but two major components are involved: failover
    and load balancing. Although failover is not directly related to the task of tuning,
    it does apply to capacity planning: You need to build redundancy into a network
    of any significant size. Failing to do so in a design flaw in the network, with
    possibly disastrous repercussions.


    That said, the general approach for failover, as far as the high-availability
    project is concerned, focuses mainly on having quick IP address failover in a
    case primary machine fails. Although there are hardware solutions that can emulate
    failover, they are generally expensive; for most purposes, the approach described
    here is sufficient.'
