  md: '# Network Performance

    CHAPTER 7


    Some options can be done via sysctl in the /proc/sys/net interface to the kernel.
    Under /proc/sys/net is a slew of configuration options that you can use to customize
    behavior to your needs. As explained earlier in the section "Tuning NFS," rmem_max
    and rmem_default can be modified to lengthen the pending queue. Few others might
    help you out as well. Listed here are some configuration options that can help
    tune the IP layer. Speedups other protocols is possible, but these days, if you
    are doing heavy networking, chances are good that it is IP-based. Remember that
    the options listed here are not-inclusive. Other options that are the most relevant
    to the work at hand.


    # Device Backlogs


    If you are severely pressing the network subsystem with many connections and the
    machine is doing other work as well, raising the value in /proc/sys/net/core/netdev_max_backlog
    might help. This will allow a larger buffer to be used in dealing with the hardware
    device while the kernel is working on other issues. This can help prevent usage
    patterns that involve large spikes of usage, and prevent from being dropped.


    # Disabling ICMP


    Although this is for prevention of a denial-of-service attack, the /proc/sys/net/ipv4
    values icmp_echo_ignore_all and icmp_echo_broadcasts can be used to disable responses
    to ICMP requests and broadcasts. This will prevent the kernel from wasting time
    responding to these messages and prevent workloads during an attack. This also
    makes better use of your network because ICMP broadcasts result in massive amounts
    of traffic on your network. Although the congestion is not damaging to your servers
    directly, it can bring your network to a halt. Turning off both of these is not
    recommended as a precautionary measure, though, because it might make network
    management more difficult. If you don''t need ICMP ECHO for usage, it might be
    safe to turn it off.


    # Local Port Range


    An important for large systems is /proc/sys/net/ipv4/ip_local_port_range. When
    an incoming connection is made to your machine, such as an HTTP request, it is
    initially made on the default port for that service. But as the sockets negotiations
    place, the server effectively moves this socket''s port to a higher range for
    the rest of its lifetime. Another example that is more visible to the end user
    if done through a browser is FTP. Connections are made on the standard FTP port,
    for the actual transmission, it is renegotiated on a higher port for the duration
    of that file''s transfer. The default value for this used is 1024–4999 and is
    now 32768–61000. It is rare to need more than this, and if you are stretching
    this limit, the box is possibly also in extreme duress in general. Still, it might
    be helpful to try. You should have at least 128MB of range to use the32768–61000
    range.'
