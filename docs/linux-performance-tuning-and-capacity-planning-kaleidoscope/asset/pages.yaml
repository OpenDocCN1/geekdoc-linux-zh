  md: '# Tuning and Performance Mechanics


    # Swap Priorities


    To set or alter swap priorities, the swapon command is used with the -p option.
    Swap priorities are in ascending order—in other words, a higher swap priority
    number has a higher priority. As an example, three partitions are already set
    up for swap that need to be activated:


    Physical memory: 64MB


    ```

    /dev/hda2 64MB REALTY_FAST_HARD_DISK

    /dev/hdb1 32MB A_SLOWER_HARD_DISK

    /dev/hdd1 32MB A_SLOWER_HARD_DISK

    ```


    In this case, the desired result is to give /dev/hda2 the highest swap priority
    and then give /dev/hdb1 and /dev/hdd1 lower priorities:


    ```

    # mkswap /dev/hda2 1024

    # mkswap /dev/hdb1 1024

    # mkswap /dev/hdd1 1024

    # swapon -p 2 /dev/hda2

    # swapon -p 1 /dev/hdb1

    # swapon /dev/hdd1

    ```


    Notice that no priority was assigned to /dev/hdd1 because the default priority
    is 0. In this setup, /dev/hda2 has the highest priority, followed by /dev/hdb1
    and finally /dev/hdd1.


    The premise for such a configuration is when the higher-performance disk is exhausted
    (rather close to exhaustion) the system calls upon the next swap area.


    The last step for activating swap is to make an entry in the file system table,
    /etc/fstab. Using the previous examples, the entries for the swap partitions look
    like this:


    ```

    /dev/hda2 none swap 0 0

    /dev/hdb1 none swap 0 0

    /dev/hdd1 none swap 0 0

    ```


    A swap file would look like this:


    ```

    /path_to_swapfile none swap 0 0

    ```


    # Swap Partitions Versus Swap Files


    The Linux kernel and distributions are advanced Unix-like systems. One of the
    most powerful features offered is incredible flexibility. Swap files and partitions
    are one of these flexible features. Aside from reassigning, reprioritizing, and
    handling other management aspects of swap partitions is the judicious use of swap
    files.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Linux Memory Management

    CHAPTER 11


    There are definite pros and cons to swap files. For example, if a swap file is
    used on partition that is also used heavily by userland processes, it can obviously
    interfere with the userland processes.


    # Swap Files


    To simplify the discussion, it is better to look at the pros and cons of each
    individually. A swap file is more useful on a lower-end system where I/O contention
    is not of great concern. It is also a good idea (although not necessary) to put
    few swap files on different partitions. Swap files do not have a predefined limit
    unto themselves, so they can easily use up an entire partition. It is important
    to note (and, yes, this has been known to happen) that creating a partition, mounting
    it, and then putting swap file on it and using it for nothing else really defeats
    the purpose of swap files unless there is a special need (such as a quick test,
    mentioned earlier, to figure out how much memory is needed). Otherwise, it makes
    more sense to create a partition for swap.


    Another case for the swap file is the "flat install" of a Linux system. Sometimes
    the person installing a Linux distribution installs everything to one drive and
    uses a swap file. This practice is discouraged unless absolutely it will not fill
    the entire partition. This is because a swap file is actually the swap space,
    and processes are put into it when needed. It is quite possible to fill up a partition
    with it.


    There is no doubt about the best use for swap files: When a system''s swap partitions
    are thrashing, a quick method for stemming the tide of swap usage is to assign
    a swap file and then attack the real culprit, whatever that might be. Other uses
    include trying to determine the needs of RAM requirements on a temporary system.


    # Swap Partitions


    Using swap partitions brings two cons, although they are of little consequence
    to the seasoned system administrator. First, a swap partition is a little more
    difficult to set up and manage after installation. Second, a swap partition is
    finite in regard to the size of the partition it is on: It will not take up additional
    space, and it is easier measure. As noted in the previous section, you can easily
    play with swap files to help swap usage from a swap usage until the problem is
    solved.


    The primary advantage of swap partitions is performance. Because swap partitions
    are on their own partition and do not have to contend with a filesystem layer
    and buffers, they tend to work better than swap files. They are directly managed
    by the memory and virtual memory subsystems of the Linux kernel.'
