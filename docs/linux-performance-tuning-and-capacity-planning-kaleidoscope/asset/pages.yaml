- img_proc: true
  md: 'Here, command and arguments specify the program to run and any options that
    it requires, respectively. option can be -value or -n value, where value is the
    nice value that you want. If option is not specified, starts the program and increments
    its nice value by 10. For example, to start the X server with a nice value of
    -5, either of the following commands work:


    ```

    # nice -5 /usr/X11R/bin/X

    # nice -n 5 /usr/X11R/bin/X

    ```


    Of course, the command starts only the server itself, not the window manager,
    the-top environment (GNOME or KDE, for example), or any clients.


    Keep in mind that increasing the X server''s priority, especially if it is heavily
    used, can adversely affect other programs, particularly those that are sensitive
    to CPU scheduling, as CD-binding programs.


    > XFree86 documentation recommends a nice value of -10.


    If the server is already running, use renice to modify its nice value. The syntax
    is as follows: renice pri pid


    pri is the new priority, and pid denotes the process ID of the process to change.
    Remember that only root can increase a process nice value. For example, the following
    commands adjust the nice value of the X server (running with a PID of 786) to
    -10 and use ps to show the changed priority:


    ```

    # renice -10 786

    786: old priority 0

    ```


    As the output of ps shows, the new nice value, listed in the second column, is
    -10. The < in the STAT column indicates that the process is a high-priority one.


    The calling syntax of renice is actually more complex than shown. See the renice
    man or info page for complete details.'
