  md: '# Hiding/Veto Files


    If you are noticing performance slowdown and you have file hiding enabled, this
    could be the cause. The mechanics of hiding files is not discussed here because
    it is assumed that this was explicitly enabled by the administrator. Keep in mind
    that doing the work to make sure that the file is not in a hidden set when serving
    will slow the process of serving the said file. The reason for this is fairly
    straightforward—if the server is just serving any file it, assuming that the user
    has access, the process is straightforward and quick. The more complex the hiding
    mechanism is (the expressions become fancy), checking every file against this
    pattern can place a significant load on the server. With a lot of complex patterns
    and a lot of users running directory lists of in question, the server can experience
    a significant load. It is for this reason that hiding should be enabled only when
    needed; if files should be hidden, it is better to store them somewhere else in
    the system where they will not be seen.


    # Level 2 Oplocks


    This is the preferred method of handling oplocks with files that don''t generally
    get written to. Essentially, clients get an oplock allowing a read-write oplock
    while they are the only handler of a file. If another client comes into the picture,
    the oplock is downgraded to read-only. At this point, it can still cache reads
    until another client comes into the picture and performs a write. At that point,
    the clients holding the (read-only) oplock are told to delete their read-ahead
    caches. The main difference between this type of oplock and fake oplocks is that
    fake oplocks hand all off control to multiple clients and might allow users access
    to a file, whereas this type coordinates the concurrent work more safely. Level
    2 oplocks are a much better option in nearly all cases, and always should be preferred
    over fake oplocks unless you know your environment very well. This option is allowable
    on a share only if the share has also set to truce.


    ```

    level2 oplocks = yes

    ```


    # Log Level


    Using a log level above 2 is not recommended because it causes constant flushing
    of the log file, blocking the system. The higher the log level is, the slower
    the system will be. Try to find a trade-off point where you get the information
    you need, but not so much that the accounting of the operations impacts performance.


