  md: '# Tuning and Performance Mechanics


    # PART IV


    Linux (like Unix) has a small set of traditional job control facilities at the
    disposal of system administrators and, for the most part, users as well. These
    are as follows:


    +   - "Plain" background mode

    - The at facilities

    - cron

    - nice and renice


    Job control gives both the user and the sysadmin capability to manage workload
    by altering the way a job is performed, changing the priority of a job, or killing
    a job. These capabilities were one of the first things that set Unix apart. The
    first Unix systems were capable of multitasking in ways that most systems could
    not. Linux continues to carry on with this capability quite well.


    # Background Mode


    Putting a job in the background is not necessarily a separate facility—actually,
    it is more of a shell function depending on the shell, of course). To put a job
    in the background, simply enter the task and follow it with whatever character
    the shell uses for specifying background jobs (most often &). For example, consider
    this large deletion run by run (so that you know there are no permissions problem):


    ```

    # rm -rf /big_dir &

    ```


    Monitoring jobs is relatively easy as with most shells. Different shells report
    differently—in some cases, hardly tell the user anything.


    For example, vmstat is started in bash on a Linux system. Here''s what it looks
    like when you type the command:


    ```

    [jfink@kerry jfink]$ vmstat 5 5 >vmstat.out &

    1] 123

    ```


    The immediate output shown when a job is put into the background is the job number
    (starting at 1) and the PID of the job.


    ```

    [jfink@kerry jfink]$ jobs

    1]+ Running vmstat 5 5

    ```


    The jobs command is more of a facility because it is built into the shell. The
    most common shell on Linux is bash, so we have different ways of handling job
    control. As mentioned previously, simply typing jobs displays all currently running
    jobs. A job that is not in the background can be manipulated via the job control
    facility using certain keyboard strokes. On most Linux systems, if'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Job Control

    CHAPTER 8


    keyboards have not been remapped, the Ctrl+Z combination will suspend a job in
    the foreground, and Ctrl+Y will stop a job. Additionally, bash can tell a job
    in the foreground to move into the background with the command %<jobnumber>. For
    example, to bring the vmstat job to the foreground, you would type this:


    ```

    $ fg %1

    ```


    Similarly, you would type this to send a job to the background:


    ```

    $ bg %1

    ```


    > On most Linux distributions, bash, tcsh, and pdkhsh all display the same information.


    Using background mode doesn''t help a whole lot in performance monitoring (unless,
    for example, you are sending the output of a tool into a file), but it fits within
    the framework of job control and hence deserves mentioning.


    # The at Facilities


    On Linux, the facilities encompass a range of tools used to schedule jobs on the
    fly (unlike cron jobs, which recur periodically), list jobs in the queue, and
    delete jobs.


    # Using at


    The at utility executes a command at a specified time. It will accept either direct
    input or a file to be executed using /bin/sh. The syntax is as follows:


    ```

    at [-q queue] [-f file]TIME

    ```


    The following is an example using the file mycommands:


    ```

    $ at -f mycommands 2200

    ```


    The options used specify that the file mycommands (specified via the -f option)
    run at 2200 (or 10PM).


    To see a listing of jobs running, the atq command displays the date and time that
    the job will be executed, and shows the queue.


    ```

    [jfink@tesla~]$ at

    10 2001-05-22 22:00 a

    ```


    This lists the job number as 10, gives the date and time that the job will be
    executed, and shows the queue. The higher the character, the higher the queue.
    Queues from A to Z are treated as batch jobs.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Tuning and Performance Mechanics


    PART IV


    To remove a job from the queue, use the atm command:


    ```

    [jfink@tesla ~]$ atm 10

    ```


    This removes job 10 from the queue.


    # Using batch


    In the old days (you know, the 1970s and part of the 1980s), many systems ran
    almost user programs in batch mode. This was because processor time was expensive
    (in terms of both processor and memory). The difference between at and batch is
    a batch job will execute only when the processor is available (which, by default,
    is when the system average is below 0.8).


    The syntax of batch is similar to the syntax of at:


    ```

    batch [-q queue] [-f file] [TIME]

    ```


    The following is an example similar to at:


    ```

    batch -f mycommands 200

    ```


    In addition to scheduling an or at batch job, the queue into which a job goes
    can be modified with the -q option.


    Batch processing (the prudent use of at) can help reduce the load of the system
    because the program will run only when the CPU is below the watermark. This is
    helpful, for example, if you want to compile a job of some new software you are
    trying out, but you want to run the job at off-hours for minimal impact on the
    system.


    # Using cron


    The cron facility is related to performance tuning in several ways. First, it
    allows for the periodic execution of commands, scripts, or programs, which lends
    itself to periodic performance data collection. Second, it allows for the periodic
    scheduling of tasks when the system is known not to be in use. In addition to
    scheduling tasks appropriately, cron is flexible enough that jobs can be modified
    so that they do not interfere with the system, if that is a requirement.


    Access to cron can be restricted via /etc/cron.allow or /etc/cron.deny; simply
    enter the username. The default on Linux systems is to not have either of these
    files, allowing global access. If a username is listed in both, cron.allow takes
    priority.


    To use cron, you can write and submit a crontab file to cron, like this:


    ```

    $ crontab mycron

    ```'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Or, you can simply edit the crontab implicitly, like this:


    ```

    $ crontab -e

    ```


    In either case, the format is exactly the same.


    To view all current cronjobs, simply type this:


    ```

    $ crontab -1

    ```


    To delete all current jobs, simply type this:


    ```

    $ crontab -r

    ```


    > NOTE\There is no warning for crontab -r on systems with a lot of users who use
    cron, so a wrapper should be created to prompt them first.


    # The cron Format


    The following is a sample list of cron entries:


    ```

    03 02 * * /usr/local/bin/1backup 2>&1

    00 03 1 * * /usr/local/bin/monthly 2>&1

    ```


    The fields, from the left, are as follows:


    +   * minutes from 0 to 59

    * hour from 0 to 23

    * day of the month from 1 to 31

    * month from 1 to 12

    * day of the week from 0 to 7 where O and 7 are both sunday

    * command or script etc.


    The format is pretty simple and easy to understand. As an example, to run get_mem
    at 3:00 every morning, the entry would look like this:


    ```

    00 3 * * /usr/local/get_mem 2&*

    ```


    * * indicates a wildcard. In addition to using single numerical values, ranges
    can be specified in fields, as in this example:


    ```

    00 03 1-2 *

    ```


    This indicates that a job runs at 3 A.M. on Monday and Tuesday. A comma-delimited
    list can also be used:


    ```

    0,15,30,45 * * *

    ```'
