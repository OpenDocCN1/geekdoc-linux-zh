  md: '# Application Configuration


    Like system configuration, this largely depends on the situation, particularly
    the application in question. It is unwise to assume that plugging an application
    into a system will give you optimal performance. Sure, it''ll work, but when it
    comes to tuning the system for performance, it helps to know the application well
    enough to know what you can do to help performance. A perfect example of this
    is Oracle. Anyone install Oracle without a problem and get it running, but to
    really get it optimized for speed, you need to know how to tune both the application
    and the underlying operating system. You need to know how to split files across
    drives, poke at the /proc interface to make sure SHMMAX is appropriate, and so
    on.


    The point is that configuration for speed is a larger issue than just clicking
    a "fast go" wizard. You need to take as many factors into consideration as possible
    and then test your tuning ideas under many types of loads as possible.


    # Performance Expectations


    Make sure that you build expectations into the specification of the system at
    the hardware level first. When it is in place, getting the software up to speed
    is a matter of expertise, if it doesn''t perform out of the box. The most limiting
    thing you can do is to build a hardwaresolution that isn''t up to the job. No
    matter how software work you do, you''ll never recover from the inherent design
    flaws of the system. If possible, calculate the raw amounts of data you''ll need
    at any stage. If you''re trying to make sure that the disk array provided will
    be fast enough, determine what the maximum number of megs-per-second throughput
    needs to be, and compare that to the specification of the array. should be obvious
    the hardware will be up for the task. Also figure in some legroom for feature
    growth down the road.


    # Known Peak Periods


    Will the system be capable of handling the peak system load? Always build up the
    system to be capable of handling the heaviest load, preferably with minimal performance
    loss. If enough leeway can be built to assume a constant operation on megs-per-second,
    so much better. As the system grows, being capable of handling the upswing with
    an absolute immediate replace core components (hardware or software) can be a
    lifesaver in a production environment. Consider a stock-trading system that is
    operating at 50% load across the cluster and 85% at peak usage. After a massive
    media campaign, what used to be peak operating rates are now the norm, and there
    is still room to keep things going until all the new hardware comes in.'
