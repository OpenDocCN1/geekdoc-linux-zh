    # Kernel Architecture


    This briefly discusses some of the concepts behind technologies present in the
    Linux kernel and shows how they are used in the real world. In reality, nearly
    all of this happens behind the scenes and does not have to be handled directly.
    However, the concepts are important to keep in mind when you''re thinking about
    tuning concepts.


    # CPU Scheduling


    The internals of the Linux scheduler are too complex to be described here, but
    an overview is to give needed perspective on what is going on beneath the hood.
    Most programs dont need to be scheduled before what the scheduler picks for them,
    but occasionally this needs to be done. Interaction with process scheduling is
    done with the command-line utility or with the system calls nice and setpriority.


    The scheduler breaks down real time into a unit called an epoch. Within that,
    the epoch is divided among processes that need to be run so that the processes
    present their time among the current epoch, as long as each has time left in its
    current quantum. A process''s CPU time into a unit called a quantum. Units of
    time are divided into epochs. When all runnable processes are finished with their
    quantum, the scheduler determines a new epoch time and divides the time that get
    the quantum for each process. Depending on priority of each process, it can get
    the default amount of time or more, if it has a need for it. Real-time processes
    (which have very explicit timing and scheduling constraints) are assigned static
    priorities, and are never changed by the scheduler. Normal processes are given
    dynamic priority, which can shift based on the amount of time that they have left
    in the current epoch, their weighted priority. Their values relative to other
    pending processes are also taken into account.'
