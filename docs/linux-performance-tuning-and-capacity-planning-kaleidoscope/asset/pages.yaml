  md: '# Application Network Tuning


    Depending on what application you use, tuning its usage of the network probably
    will give you more of a performance jump than tuning the kernel. Specific applications
    that depend on their own protocols generally support different implementations
    of the protocols and configurations for each protocol, resulting in vastly different
    performance yields. What follows are a few examples of the normal means of ensuring
    that applications make the best possible use of the resources presented to them.


    # Examples: Database Work


    Although this example blurs the lines of pure network utilization and performance,
    it''s a good way to demonstrate how many factors be involved when looking to tune
    your operations. When you''re using code in Java with Oracle''s JDBC drivers,
    you can configure the JDBC driver to use the SQL*Net protocol in a few ways.


    The “thin” driver is a pure Java implementation of the protocol—that is, it doesn''t
    need to use any underlying system libraries to talk to the database. The code
    might be capable of having Java hook into the native drivers and interact with
    the database through the CBO interface. In this case, both types use the same
    protocol. However, you should get better performance with the native drivers,
    for high-bandwidth database requests which may stress a Java environment that
    isn’t optimized enough to handle the work effectively. Therefore, switching the
    application to hook through the native drivers could avoid the bottleneck.


    This case wasnt necessarily a matter of network tuning, but it shows what might
    appear to be a network issue could just easily be a matter of application configuration.
    At first glance, the problem was probably diagnosed as a slowdown of data transfer,
    and investigating both the processing server and the database server might not
    have shown anything out the ordinary. Your first guess in case might seem to look
    at network usage, when it’s more important to reconfigure the drivers for the
    application.


    Along that vein, another general application-tuning issue when dealing with database
    servers is the use of connection pooling. (Although it is not the exclusive domain
    of the database realm, this is a well-known method of speed processing.) When
    applications use and discard database connections, it might not make sense in
    most situations to really close the connection to the database. Because the database
    needs to perform initialization and shut down work on each connection, and both
    machines involved need to perform socket creation and destruction, it is generally
    a good idea to keep the connection to the database open. When one thread or section
    of code finishes with its connection, it can simply throw it back into the pool.
    When another thread needs a connection, rather than opening and initializing a'
