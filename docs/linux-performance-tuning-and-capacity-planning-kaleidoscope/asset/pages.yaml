- img_proc: true
  md: 'RAID 0—Although it''s not technically RAID because it is not redundant, RAID
    0 stripes data across multiple drives present in a set. By distributing the write
    (and read) load, drives can provide data to the bus faster because each one is
    acting independently. If you need speed but not redundancy, this is the path to
    take. Also make sure to use stripe sizes that are larger than average requested
    records so queries are completed in one request against the set.


    RAID 1—This is a simple mirror set. For each drive, there exists one counterpart
    that has its data updated with the master. In some situations, there can be more
    than one mirroring drive. Throughput is not as fast, but redundancy is maintained.


    RAID 5—This is the most common balance of redundancy and distributed data. In
    this case, a parity drive exists for the sole purpose of maintaining parity status
    for the data on other drives in the set. The two other drives have data distributed
    between them. Although can be slower than striping, RAID 5 offers fast reads and
    can survive the death of a drive in the set. However, this will impact performance.
    Performance during the rebuild is degraded, although the rebuild be done online.
    Make sure that this degradation of performance is permissible in your environment.
    If it''s handled by either hardware or software, a RAID 5 failure should never
    cause an interruption in service or loss of data.


    RAID 10—This is a hybrid of RAID 0 and 1; it performs striping across sets of
    mirrored drives. In this system, sets of drives are set up to mirrors of each
    other, and a strip is built across them. This requires more drives to be present
    because each drive needs to be duplicated. Data availability is high, and overall
    interaction, such as reads, writes, and rebuilds, is very good. If RAID 5 doesn''t
    quite right the performance during a rebuild and you have the drives to spare,
    RAID 10 is probably the right choice.


    Other types of RAID not mentioned here are RAID 2, 3, 4, 6, 30, and 50, JBOD (Just
    a Bunch Of Disks) configurations. These aren''t very common, and they generally
    don''t offer much more in performance aspects. If none of the options fits yours,
    you might want to check out the other levels. For most uses, if storage is available,
    RAID 5 and RAID 10 are the most recommended because they provide both good performance
    and redundancy.


    # Software RAID


    RAID is assumed to be handled by hardware. By abstracting the operations out to
    hardware, you lift a large load from the system and get less reliance on the operating
    system. In general, most hardware RAIDs are even resilient to power fluctuations
    because can battery-back their operations. Local caches can be controlled on the
    RAID card, treating the subsystem separate from the rest of the box. In nearly
    all situations, hardware RAID is preferred.'
