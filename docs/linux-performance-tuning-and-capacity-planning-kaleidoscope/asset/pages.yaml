    # Ethereal


    Ethereal is one of the better tools when it comes to live network analysis. Ethereal
    itself is meant for graphical analysis of network, while ethereal is for console-based
    analysis of traffic. You can read capture files from different sources, such as
    sniff, Microsoft''s Network Monitor, different router debug tools, nettl, and
    many others. By capturing data to a file, you can replay what exact is present
    on the network repeatedly, gaining insight into your application''s usage of the
    network. Ethereal categorizes the traffic into different types and collections
    of data to you as trees of information. Stream following is a capability, meaning
    that you can pick a session and view all the actions that took place over. When
    you''re debugging server problems with specific protocols, this can be very helpful.


    If you are running a proprietary protocol, it might take more to piece together
    what is going on. Using another tool, such as tcpdump to capture raw packets,
    could work better. If you are using any open protocol, ethereal probably has support
    for it. Direct support is enabled for Telnet to NetBIOS, to many of the protocols
    used for the various instant-messaging systems present. Ethereal also supports
    nearly any type of interface which you would need to use.


