  md: 'The CPU utilization report is the first of the two reports generated. It has
    the following fields:


    +   * %user

    * %nice

    * %sys

    * %idle


    Table 4.1 illustrates each field.


    # Table 4.1 iostat CPU Utilization Fields


    | %user | The CPU utilization percentage measurement, for user processes only
    or in nonprivileged mode |

    | %nice | Percentage of CPU utilization that occurred at a modified nice level
    |

    | %sys | Percentage of CPU utilization that was executed in system or privileged
    mode |

    | %idle | Percentage that the CPU was idling or rather doing nothing |


    It is worth noting some terminology here: The %user and %nice fields occur at
    the application level, or as people (especially in the BSD communities) refer
    to, in "userland". The %sys field occurs at the kernel level, or in privileged
    mode. The terms application, nonprivileged, and userland all mean the same thing—they''re
    processes that do not have direct access to the kernel. By the same token, system,
    privileged, and kernel (within this context) refer to processes that can talk
    directly to the kernel.


    The next portion of the report contains the device utilization fields. Table 4.2
    explains what each field represents.


    # Table 4.2 iostat Default Device Utilization Fields


    | tps | A verbose listing of the number of transfers per second that were sent
    to a device. |

    | Blk_reads/s | The amount of data read from the device. In the case of these
    disks, this is expressed in the number of blocks per second. |

    | Blk_wrtn/s | Data written to a device. Again, this is expressed in the number
    of blocks per second. |

    | Blk_read | Blocks read from the device per second. |

    | Blk_wrtn | Blocks written to the device per second. |


    Now let''s interpret the output of the example shown previously. According to
    the fields of the output, this system was doing a lot of writing when the measurements
    were'
