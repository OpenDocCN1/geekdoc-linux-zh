    # Use a Font Server


    Use a font server rather than a selection of fonts. A font server transfers fonts
    rendering and management from the X server to another process, the font, which
    has been designed and (hopefully) optimized for font management. Offloading font
    rendering to a separate service independent of the X server prevents font management
    from bogging down the X server. Frankly, XFree86 version 4 includes a sophisticated
    font server that is capable of managing standard X fonts and the popular TrueType
    fonts. So, rather than specifying a particular set of fonts in the configuration
    file, as illustrated in the previous section, the configuration file contains
    a single FontPath pointing to a font server, as shown:


    ```

    FontPath "unix:7100"

    ```


    This entry directs X programs to communicate with the server with port 7100, the
    server''s default port, on the local system for font services. The entry could
    just be like this:


    ```

    FontPath "fontbeat:7101"

    ```


    This directive tells X clients to connect to port 7101 on the host named fontbeat
    for fontrendering information and services.


    The font server itself can be configured to limit the number of clients that it
    will service, to specify alternate font sizes and resolutions available to X clients,
    and to offer only a limited selection of fonts to X programs. Individual users
    can also run font servers on their workstations, a measure that offloads font
    rendering to the user''s systems. This reduces server loads, but permits users
    to use as many fonts as desired.


    # Upgrade the Server


    Installing the latest and greatest XFree86 version might have more of an impact
    on your X server''s performance than any other single tip suggested so far, short
    of upgrading the computer''s underlying hardware. This is truly true if you are
    still using XFree86 version 3.


    Most importantly, version 4.0 introduced dramatic changes in XFree86''s basic
    design and architecture. It has a more modular design, resulting in more efficient
    performance because unrelated functionality has been split into separate modules
    loaded on demand rather than monolithically. The X server itself, the component
    that implements core X protocol functionality, has been stripped down to bare
    essentials. Noncore functionality is loaded on demand from modules and extensions.'
