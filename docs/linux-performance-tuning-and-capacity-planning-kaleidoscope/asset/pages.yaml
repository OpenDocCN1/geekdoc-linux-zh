- img_proc: true
  md: '# Introduction and Overview


    # PART I


    The virtual memory system is largely handled by the kernel. The most you should
    have to do in terms of administration is to add and delete swap files. Command-line
    utilities are the easiest way to do this: swapon and swapoff cover your needs.
    There are two general ways of handling swap: One is by explicitly partitioning
    your drive to create a swap partition. This is preferred because you can format
    partition as a swap device and because it provides the cleanest interface to the
    disk.


    But you might have already allocated your drives, and now the system is overloaded.
    There is no free space to create new partitions for swap space. What do you do?
    Simple: You can use a regular swap space, although it be layered on top of your
    regular filesystem. This is not preferred but it needs to be done in some situations.
    Here''s an example of how to do this on a running system:


    ```

    ```

    # dd if=/dev/zero of=/tmp/swapfile bs=1M count=100

    # mkswap /tmp/swapfile

    # swapon /tmp/swapfile

    ```

    ```


    The first line creates a zered file of 100MB. Next, mkswap turns that file into
    a valid swap file. Finally, swapon turns it on, and you instantly have 100MB of
    swap space on your system. Just make sure that you add the file on a disk that
    still has space left for it. (Also make sure that you place the swap in a proper
    place—make sure it''s on a drive that has room to grow and isn''t heavily loaded
    by I/O requests.)


    Keep in mind that you put the new entry in your /etc/fstab file that is used from
    now on. Otherwise, the swap will be active only for the current boot. When you
    reboot, the file still exists and is already a swap file, but you will need to
    run swapon to enable it. Here''s an example for:


    ```

    /tmp/swapfile swap swap defaults 0 0

    ```


    I recommend placing it in a more meaningful location than /tmp, though. Also remember
    that swapon -a and swapoff -a are convenient ways of enabling and disabling all
    swap specified in /etc/fstab. Disabling swap is rarely needed in most situations,
    unless you are looking to reclaim some disk space and know that the system load
    is low.


    One final note on swap space: When programs or data are swapped out, they remain
    until the system or user needs them again. If your box starts up with heavy load
    but then still seems to have swap usage afterward, don''t be alarmed. This is
    just the kernel leaving existing memory free for more useful operations. If the
    data can live in swap for an extended period of time, it''s probably safe to assume
    that you weren''t really using it in the first place.'
