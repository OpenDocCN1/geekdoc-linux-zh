    # Thinking Outside the Box


    As a side effect of the multifaceted review process in the previous section, many
    of the parties involved will be forced to consider options outside their normal
    problem domain. Making sure that people don''t get themselves in a closed set
    of choices is always a good idea. This is especially true in technology, when
    paradigms shift all the time and thinking the same invariably leads to outdated,
    troubled solutions.


    Cross-polination is a good means of enforcing this kind of behavior, as described
    in the other sections. Having tech leads interact with business leads will help
    both sides understand the other''s targets with greater detail, and this can open
    new opportunities. A technical person''s explanation of a new piece of hardware
    to someone on business side could spark an idea for a new business application.
    Likewise, a businessperson''s explanation of where the current markets are heading
    can give the technical team a heads-up on what the next capability targets might
    be. External groups, such as consultances, will not always appropriate, can provide
    a good source of different ideas. Regardless of the source, the exchange of ideas
    causes the other side to evaluate how things are and forces them to think about
    things in a new light.


    New technologies are appearing all the time, and keeping up-to-date with them
    can introduce new ways of getting down your system. If there is a new networking
    protocol or a new component architecture, it can have a profound impact on the
    operation of your system, if it is found to have an advantage. Even if the technologies
    aren''t directly used, they could be helpful in maintaining a clear perspective
    of where the market is going, and they could inspire an idea for a related branch
    that might have an effect.


    Any type of standard thought process must be questioned to make sure that all
    avenues are considered and sufficiently explored. If there is any aspect of the
    capability planning process that is taken for granted, it must be taken out, ripped
    apart, and replaced with a new perspective. In an era where things move at an
    absurd rate, there is no time to allow in assumptions to cloud the thought process
    in considering all options.


    Let''s look at an example. When building or expanding a system, it is easy to
    assume that a certain type of hardware is sufficient for a given task. Consider
    the building of a medium-range database server that needs to handle, say, 50 simultaneous
    users with 100GB of data, using some simple SQL queries and a 10% annual growth
    rate. If you have built database servers before, you probably already have at
    an inkling of mind to handle this load. Even without the numbers, if the system
    in question was something simple,'
