  md: '# A "Typical" inetd.conf File


    The Linux system runs constant services. These are processes or, in some cases,
    facilities that are always available and working. As an example, the sendmail
    service might run in the background in daemon mode to facilitate the movement
    of mail messages. In some cases, services are facilitated through another process.
    For, inetd (the Internet Server) can facilitate a great deal of services as FTP,
    Telnet, secure, and so on.


    A Linux system does not have to be running a great deal of services. One way to
    enhance the performance of a Linux system is to shut down services that it does
    not need. Regardless of the disk space, size of memory, or processor that a Linux
    system has, it will perform better if it is running only the services that are
    absolutely necessary.


    Services are managed and started one of three ways:


    +   - As an initialization script

    - Via the command line

    - As run levels


    An initialization script can be added to /etc/rc.d/rc.local (which is discussed
    later) and can be called directly. To start a service form the command line (for
    testing installing an init script of some sort), the user simple invokes it. For
    example, this command would be used to test sendmail as the user and group:


    ```

    $ sendmail -bd -q30m

    ```


    Finally, an init script is linked to a run-level directory that is called during
    bootup.


    In this chapter, two main aspects of services will be discussed:


    +   - The Internet Server (inetd)

    - The system rc scripts


    It is important to mention at this point that invariably some services will never
    need to be disabled. Perhaps the most prominent one that comes to syslog, the
    logging daemon. The administrator should take extra care when deciding which services
    to leave running and which ones to disable. If possible, the administrator should
    test changes or at least warn affected users of possible problems that might arise.


    # The Internet Server inetd


    The Internet Server (also referred to as the Internet “super-server”) runs as
    a daemon and listens for connections to certain ports. The ports are dependent
    on the local configuration. When a connection is received, inetd invokes a program
    to service the connection. In a'
