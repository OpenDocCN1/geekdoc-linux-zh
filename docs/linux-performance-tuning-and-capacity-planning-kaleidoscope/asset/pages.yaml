  md: '# Introduction


    The art of performance tuning has been around a very long time. Most people are
    aware of performance tuning with regard to activities such as race car driving.
    The race car driver, engineers, and team in general work together to make the
    car work as efficiently and fast as it can with the singular goal of winning the
    race in mind.


    Notice that I said the art of performance tuning and not the method or perhaps
    procedure of performance tuning. There are several reasons why performance tuning
    is much more of an art than hard-coded code. First, it is odd. Performance is
    relative to how any task is done, which means that humans (and many other species)
    well keep improving the way they do things. Second, performance tuning requires
    skills that are not always associated with computers. For example, as I write
    this, I am using a processor on a Linux system. That alone is a very mechanical
    process and does not require a great deal of skill. The practice of performance
    tuning requires additional skills outside of the scope of just knowing how to
    invoke a particular utility or command. Requires a degree of intuition and a great
    deal of subjectivity. The performance analyst must understand what is really happening
    and why.


    Linux-based systems of course are no exception to the rule of want for high performance.
    The primary reason many organizations use Linux is to squeak out those performance
    gains on hardware that will be in place for a very long time or is older hardware
    already in place.


    In this book, the reader will be introduced to the concepts behind performance
    monitoring and tuning, considerations of performance tuning, and methods of monitoring
    in order to understand results and actions to take.


    Not only does this book walk through methods, practices, and applications, but
    it does so in a compact and human readable way so the performance analyst can
    have a readily accessible volume that is easy to use and understand.


    In addition to these, the book also examines several practical case studies that
