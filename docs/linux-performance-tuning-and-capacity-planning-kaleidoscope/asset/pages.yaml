  md: '# Network Performance

    CHAPTER 7


    As always, kernel tuning parameters, are sure to check for any new capabilities
    that have worked their way into the kernel. Given the large number of uses that
    people have for their working systems, anything that might need to be tuned is
    generally tunable via sysctl1. As time goes on and more standards are written,
    more capabilities will be added.


    # Bonding


    Different vendors call this by different names, but the core concept remains the
    same. The idea is to add raw bandwidth to your machine, you add multiple interface
    cards to the machine and bind them together as one single interface. This should
    be done in conjunction with network infrastructure layout because its usefulness
    is limited to network configurations. This can be used to give a single machine
    200Mb interface to a 100Mb network, or it can be used for failover situations
    in a redundant environment. Its applicability varies, though, so be sure that
    you really have a network bottleneck before looking into bonding over your network.


    Originally, bonding was used in relation to the Beowulf project. Beowulf is a
    system that allows massively parallel computers to be constructed by interconnecting
    many Linux boxes over standard network interfaces. Because message passing in
    a cluster is directly related to the speed at which it can work through data,
    reaching the number of interconnects and bandwidth has a huge impact on the cluster''s
    usefulness. Since it was written, the bonding driver has undergone some significant
    changes. It now exists separately from the Beowulf project and ships with the
    kernel. (Kernel 2.2.18 at least recommended.)


    Bonding is enabled in the kernel under Device Support. It can be built as a module
    or can be built directly into the kernel. If you are in this live environment
    (which is possible but not recommended), you can enable support for bonding, bind
    devices to, and have a large bandwidth interface without an interruption in service,
    if your hardware is present. If you want to use bonding as a failover, you need
    to build it as a module when you need to send explicit options to the module when
    loading. In reality, it is best to test your network configuration and bonding
    approach on a test network, and to schedule some time to bonding to the production
    side. Alterations might need to be made to the network to handle the bonding,
    so this is the preferred method.


    Some description of what happens in order. If you know how the transport is handled,
    you know that the transport is dependent on your network hardware address. If
    you add a new card, it will cause traffic to use its separate hardware address,
    right? You would think so. But in reality, the hardware address of a network card
    is a configurable option in the hardware. By specifying the hardware address with
    ifconfig''s ether parameter, you can rewrite the value that is burned into the
    hardware, at least for the current boot. At first guess, this might sound like
    a trick that would be used in attacks against the network, but it comes in


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_153_0.png)'
