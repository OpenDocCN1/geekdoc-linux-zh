  md: '# Tuning and Performance Mechanics

    PART IV


    This indicates that the job will run at the beginning of the hour and every 15
    minutes. A simpler version of this can be specified with an interval in the form
    of */N:


    This also states that the job will run every 15 minutes.


    Command-line options are fully supported. Actually, regular syntax is supported
