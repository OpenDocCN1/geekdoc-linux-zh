    ```

    # insmod rd

    # dd if=/dev/zero of=/dev/ramdisk bs=1k count=4096

    # mkfs -t ext2 /dev/ramdisk

    # mount /dev/ramdisk /mnt/ramstories

    ```


    As you can see, this is a very simple process. If your system of managing data
    can use of ramdisks, this method is highly recommended. This can be the perfect
    place to drop data that needs to be populated with a set of scripts or pipes because
    it gives you all the I/O operations without any of the slowdown.


    In general, drive tuning will have the most impact on the overall speed of your
    system. The downside is that you might not be able to speed operations, short
    of the alternatives presented in this last section. Tuning your individual SCSI
    driver or enabling capabilities on the IDE drives can bring you a little more
    speed, but the physical construction of the average disk will still provide a
    bottleneck that is difficult to sidestep.


    # Summary


    For the most part, there are two types of bottlenecks. Problems tend to be processor
    bound or I/O bound. Depending on the problem, it could be feasible to apply more
    processors or Beowulf cluster to the problem, where each node handles a small
    piece of the problem. I/O problems tend to be the hardest to work around, and
    can cause the most headaches in the process. For some situations, the problem
    can be alleviated by throwing more hardware at or tuning. In general, it can be
    a simple matter of being limited by the technology of the physical drive.


    As mentioned, tuning can be effective by making sure that the kernel makes good
    use of the underlying hardware, and the correct options are to make sure that
    the kernel is allowing the commands to be sent to the hardware. If these tuning
    operations don''t quite cut it, other approaches such as ramdisks or solid state
    drives could be the optimal route. In addition, upgrading your hardware to a more
    capable bus could be the answer. There is still a possibility that there will
    be a slowdown to the physical construction of a rotational drive. But, these problems
    can be mitigated by making sure that all other factors are taken out of the picture,
    and then making sure that tests run on the drive result in numbers that push the
    raw throughput of the media.'
