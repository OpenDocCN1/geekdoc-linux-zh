    # SNMP


    SNMP is a simple protocol that allows applications to pull trees of configuration
    data from remote machines in a standard manner. Embedded in these trees is usage
    data about various subsystems present on the machine. From this, it becomes easy
    to keep track of various utilization rates and determine exactly what has happened
    to your network over time.


    Some applications, such as Oracle, have their own extensions to SNMP so that remote
    tools such as OpenView can look at specific variables concerning the Oracle instance
    running on that remote machine. With either off-the-shelf software or custom scripts
    to act on bad conditions, the SNMP suite can get your network management under
    control quickly. Most distributions with an SNMP daemon to run on the machine,
    with several tools to poke at the tree to retrieve data. OpenView, already mentioned,
    performs high-level management of the data, although OpenNMS might provide a viable
    option to this expensive software in the near future.


    # Testing Tools


    You can use a variety of tools to test your network''s performance. Most of them
