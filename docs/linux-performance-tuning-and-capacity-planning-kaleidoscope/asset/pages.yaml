  md: '# Linux Memory Management CHAPTER 11


    Before a device can be used for swap, it must be marked with a utility such as
    druid, fdisk, or the more "primitive" method of using mkswap.


    As an example, the device /dev/hda2 with a size of 64MB will be used. To determine
    the block size of a partition, the fdisk utility can be used with the -l option.
    For example, here is the output of fdisk -l on one system:


    ```

    [root@kerry/root]$# fdisk -l

    ```


    Disk /dev/sda: 255 heads, 63 sectors, 3276 cylinders Units = cylinders of 16065
    * 512 bytes


    | Device Boot | Start | End | Blocks | Id System |

    | /dev/sda1 * | 1 | 64 | 51404+ | 83 Linux |

    | /dev/sda2 | 65 | 3276 | 25800390 | 5 Extended |

    | /dev/sda5 | 65 | 2104 | 1638268+ | 83 Linux |

    | /dev/sda6 | 2105 | 2487 | 3076416 | 83 Linux |

    | /dev/sda7 | 2448 | 2742 | 2048256 | 83 Linux |

    | /dev/sda8 | 2743 | 2934 | 1542208+ | 83 Linux |

    | /dev/sda9 | 2935 | 3062 | 1028128+ | 82 Linux swap |


    First use mkswap to create the swap area on /dev/hda2:


    ```

    # mkswap -c /dev/hda2 1024

    ```


    Here, 1024 is the block size. Next, use the swap command to activate it:


    ```

    swapon [ device_name ]

    ```


    For this example, the command would be as follows:


    ```

    # swapon /dev/hda2

    ```


    To use a swap file, the operation is a little different; it uses the previous
    example, but with a swap file instead of an entire partition.


    Use the dd command to initialize the file. Basically, dd sends an input file to
    an output file. The bs parameter is the block size, and count is the number of
    blocks copied:


    ```

    # dd if=/dev/zero of=swapfile bs=1024 count=65536

    ```


    Using /dev/zero, you can effectively "zero out" a file that can be used for swapping.
    This has the effect of making the file look like a raw partition.


    Then use swapon to activate the swap file:


    ```

    # swapon swapfile

    ```


    The swapoff command will deactivate a specified swap device, or all devices, if
    the -a option is given. Take a look at this example:


    ```

    swapoff /dev/hda2

    ```'
