    whole new connection (which causes network overhead and extra traffic), it can
    simply out the old one back from the pool. This raises the requirements on the
    database and application server slightly because they each need to handle more
    simultaneous connections, but the speed gains greatly outweighs the cost.


    # HTTP Speed-ups


    A lot of work today revolves around Web interaction and HTTP transfers, so you
    might have software performance depends on its interaction with various HTTP servers,
    such as Apache. A simple way of speeding up transfers is to make sure all parts
    of the server are using HTTP 1.1. The original HTTP 1.0 specification had no mechanism
    for allowing multiple files to be transferred over the same HTTP. To pull a page
    with multiple components, such as frames, images, scripts, and so on, the client
    had make individual requests for each piece. Under HTTP 1.1, the specification
    was updated to allow multiple files to be transferred within the same socket,
    saving the cost of repeated socket negotiations and HTTP overhead. By making sure
    that everyone in the transfer is using HTTP 1.1, you might find a speed-up by
    a factor of 10 in your processing.


    Different content encodings can also help. By configuring your Web server to use
    gzip encoding (Apache has a module to do this), the content that comes over your
    Web server, which is generally textual HTML, can be automatically compressed before
    it hits the wire. When the client end, it can understand the "Content-encoding:
    gzip" response in the HTTP headers, it will receive the compressed version of
    the content, decompress it, and display it. In addition to getting the content
    quicker, this also make better use of your network. Text, as HTML, compresses
    very well. What''s more, if your network is congested due to thousands of HTTP
    requests for HTML, it could reduce your network load to a trickle. There is a
    penalty on both the Web server and the client because extra work is involved with
    the compression and subsequent decompression. If you can afford to handle that
    for better network performance, it is probably a path that you will want to.


    # The Value of Knowing Your Domain


    This might seem complicated, but it is a good example of your application domain
    and making good of the technology you have. The usability of the GNOME desktop
    system relies on this capability. GNOME is founded on the principles of CORBA,
    a system that forces the application designer to write out interfaces beforehand
    and then implement the client and server of the code based on the calls specified
    in the interface. There are CORBA mappings for many different languages, enabling
    you to implement the client and server in different languages.


