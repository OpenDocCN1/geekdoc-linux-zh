  md: '# What Is Capacity Planning?


    Before diving into the topic of capacity planning, it might be helpful to know
    exactly what capacity planning is. It is the process of determining a plan of
    your system’s needs, both for the present and for the future. Whether you are
    building a Web farm, a database cluster, a normal mail server, or a transaction
    system, the capacity of the system in question is nearly as important as it works
    at all. If the system is designed to handle the exact requirements as laid out
    at the time of construction, be prepared for the system to crash and burn in the
    real world. If you don''t allow for growth in your system, any slight fluctuation
    in usage could bring the whole thing to a standstill.


    Capacity planning means stepping back and looking at all your needs—past, present,
    and future. Valuable data can be gained from growth patterns and previous bottlenecks
    that the system has had (not to mention information held in a log book over the
    previous maintenance periods). If you have a history of ending with processor
    bottlenecks, this should give you some clue to what needs must be addressed in
    detail when planning for the future. If you have presently a running system, it
    can provide a testbed for usage statistics that can drive your next planning session.
    Assuming a similar system or an extension of the infrastructure, the current layout
    can show you what works and what doesn''t, along with what components are overworked
    and which ones are for explosive growth. Looking to the future with a view of
    what requirements are coming and in what areas you would like to grow, you should
    be able to determine growth rates for various system aspects and plan accordingly.


    If you are planning a system from scratch, it is helpful to have domain experts
    involved in the process. Otherwise, the system’s specifications can go horribly
    awry, resulting in structural problems down the road. In general, this can result
    in a reconstruction of the system, which can be more costly in development time
    and cost than simply having expertise on hand from the start.


    When you have past, present, and future data, it might be as simple as plotting
    some of these values to see exactly what kind of growth pattern you should expect.
    If it comes down to plotting average usage per customer based on database load,
    it is a straightforward process of taking a past ratio, a current one, and anticipated
    future rates and then plotting a growth trend. Depending on other changes brought
    into the system by new products and technology, the future data points might need
    to be weighted differently, but at least a target should be decided upon and followed.


    In the end, don''t assume that capacity planning will solve all your issues. Capacity
    management is as important as capacity planning, as time moves on. No how much
    domain expertise you have or how precise your requirements look, shifts will occur.
    Some of these will be caused by last-minute requirement changes that cannot be
    avoided. This usually raises the'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Thinking About Capacity Planning


    CHAPTER 13


    bar of expectations rather than lowering it. To balance this, technology is always
    shifting; by the time the system is deployed, there might be a new drive standard
    that enables you to double your work. Other times it might just be a simple shift
    that wasn''t anticipated. For example, planning around a proprietary or custom
    protocol was the norm years ago, but now many that once required custom transfer
    mechanisms have started to use open protocols, such as HTTP. Not all pitfalls
    can be seen—some might help, and others hide. Planning for the future doesn''t
    involve looking into a crystal ball and finding out specifically what should be
    done in all cases, although that would make many architects'' lives much easier.


    # Never a Quick Fix


    Capacity planning should never be thought of as a Band-Aid solution. If it''s
    done correctly, the need for quick fixes should never enter the equation. Assuming
    that the system has fully specified and extremely detailed requirements have been
    defined, there should be no kind of capacity problem or throughput bottleneck
    in the system,


    Because of forces beyond anyone''s control, there will always be some factor that
    comes into play when the system comes together. Times the network wasn'' specified
    correctly and there is now a slowdown over a certain link. Or, maybe the network
    was built correctly, but someone has determined that a subcomponent, such as a
    database server, needs to work over the same link, even though that not planned
    in the specifications. Now data is traversing that link during times when should
    be reserved for other services. The possibility exists that users start using
    the system, a feature request is putting increased strain on one of the application
    servers.


    Some of these issues might be simple policy problems that need to be worked out.
    But in our system, growth will help. Although some of it can be planned for, same
    tangential spurt will occur in any area wasn''t anticipated. These bursts aren''t
    accounted for in the global view of the system''s data flow, they can have large
    repercussions on system operation. Consider the database replication mentioned
    earlier. When on two physically disparate systems need replication, a DBA might
    schedule replication between the sites at certain times of the day. As the user
    grows and needs to see the other end''s data with real-time updates, the frequency
    of the replication scripts might have to change. If there was data growth over
    the lifetime of the system, the data replicated might have grown. Combine larger
    amounts of data with more frequent replication over what might be a slow link,
    and you''ve just introduced a problem that breaks the preferred methods of data
    flow that the system was built upon.


    The point of all this is when you''re responding to these kinds of problems, dropping
    a quick fix into the mix isn''t the solution. In the replication example, for
    this problem, the


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_253_0.png)'
