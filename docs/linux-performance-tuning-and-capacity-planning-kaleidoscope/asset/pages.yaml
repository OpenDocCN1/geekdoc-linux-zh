- img_proc: true
  md: '# Performance Monitoring Techniques


    PART III


    can be done immediately and in full, it saves the overhead of waiting multiple
    round-trip times, and the sender can retransmit all lost packets in one burst.
    Quicker recovery from data loss is experienced.


    By default, this value is turned on in the interface. Some people have gotten
    better results with it off, but this might require absolute control over your
    local network by disabling it to give you any advantage.


    # Urgent Pointers


    The tcp_urgent value is a setting, although disabled by default, might offer gains
    if your environment supports it. As specified in the TCP functional specification,
    control bits in the TCP header can specify urgency, along with an urgent pointer
    to data that the receiving end might not have gotten. By using the urgent pointers,
    the receiver will know that urgent data of some type is coming down the wire and
    that it should take appropriate action to make sure the data is handled quickly.


    This is disabled by default because it can cause interoperability problems with
    other systems. However, if you have control over the systems you are using, know
    that it is supported, and know that your patterns can make use of the capability,
    you might want to enable it.


    # Window Scaling


    Another example of a value that be left on is tcp_window_scaling. This is a capability
    specified in RFC 1323, which was a suite of performance enhancements to TCP. TCP
    packets need to be transmitted over the network and received with a sliding window
    algorithm because reassembly is likely to be done, and the system needs to know
    when some packets need to be resent. Scaling allows the transmission to use a
    wider window, allowing for a greater range in what data can be in transit at any
    point in time. The kernel defaults this value to 1, and it should be left this
    way unless you have a strange local implementation on your network that doesn''t
    support it.


    # Large Windows


    Unless you have a small amount of memory in your system, it is a good idea to
    make sure that large window support is enabled in your kernel build. Without it,
    the available window of what can be in transit is smaller, resulting in slower
    performance. This should be enabled on all systems by default.


    # TCP Timestamps


    By default, this option is off, although it can be enabled with a value of 1.
    As specified in RFC 1323, TCP timestamps are used to determine round-trip time
    measurements, but a slight performance hit is incurred in generating them.'
