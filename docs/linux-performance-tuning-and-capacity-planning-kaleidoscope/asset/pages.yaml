  md: '# Aspects of Performance Tuning CHAPTER 2


    # Understanding the Options


    Know what options are in front of you. If possible, have multiple options built
    into the design of the system. Say that the Web servers are getting swamped, the
    disk array that is serving that group is still okay. If the Web servers were designed
    to be dropped in as serving nodes in a cluster, that option is an easy one to
    take.


    If you don''t have any recourse for the problem, look carefully at the problems
    present. Everything has gone too far beyond the original scale? It might be time
    for a redesign of some of the core systems to handle the new load. The problem
    has scaled up so far that you need to switch architectures at this point to handle
    the amount of data involved. Maybe a couple slight tweaks here and there, such
    as tuning the Web servers or updating the drive array with better throughput,
    will solve the problem.


    In the end, finding the right solution will depend greatly on understanding the
    system at hand. If you don''t have a tight grip on your system works, no amount
    of tweaking will help you. The best you can hope for is to tweak random components
    of the architecture until you hit the one that can solve the problem in the first
    place. Insight into how your system works, combined with a clear understanding
    of where you want it to go, should be enough of a catalyst to get pretty much
    problem solved. The section “Identifying Bottlenecks,” later in this chapter,
    includes a rough path of checks to follow when trying to identify bottlenecks.


    # Measurements


    No performance data is worth anything if you don''t know how to interpret it.
    Given a few data points and how to relate them to the system, along with baseline
    metrics of what values the system should be operating, it becomes easy to build
    a view of the system''s current and projected usage rates.


    # Queue Versus Load Average


    The queue is the current runtime queue for processes. Load averages are measurements
    of metric over 5-, 10-, and 15-minute intervals. The runtime queue is a count
    of the number of processes ready to run at any given point in time. A value less
    than 1 is optimal. This means that there is no process sitting in the queue waiting
    to be run. When the load averages start to creep over 1, it means that there is
    always a process ready and waiting to be solve the problem and make sure there
    is a better chance of schedable time. There are several ways to watch this data—through
    vmstat, top, and uptime, and so on. Using uptime is the cleanest way to get the
    load average data:


    ```

    # uptime

    1:34pm up 61 days, 3:12, 1 user, load average: 0.00, 0.16, 0.19

    ```


