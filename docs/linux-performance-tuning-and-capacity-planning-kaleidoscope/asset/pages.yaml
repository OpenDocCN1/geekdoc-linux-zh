  md: '# Tuning and Performance Mechanics

    PART IV


    Rather than covering every single entry in /proc, here are the most important
    entries:


    +   - cpuinfo—This gives this information on every CPU present in the system.
    It shows what precise instruction sets the CPU supports, and it also reports any
    flaws that the kernel knows about.


    +   - devices—Depending on your configuration, you might have a normal /dev filesystem
    or devfs, which allows dynamic alterations of the device filesystem. devices lists
    the types of devices that it knows about. It also lists block devices that it
    understands, such as IDE or loop devices.


    +   - filesystems—From this, you can see what filesystems are supported by the
    kernel. It can fluctuate over time depending on what filesystem drivers are loaded
    into the kernel. Possible types are mbfsfs, ext2, reiserfs, and vfat, among others.


    +   - interrupts—This is a simple dump of what interrupts are being used by devices.


    +   - iomem and iports—These two show the current mappings in place for very hard-devices.
    Having need to use these in practice for troubleshooting is rare.


    +   - kcore—This gives a view of your memory. Unless you know what you are doing,
    this won''t give you useful information. However, by configuring your kernel to
    use /proc/kcore in Executable and Linking Format (ELF) format and compiling with
    the -g option, you can use gdb to debug a live kernel through this data.


    +   - kmsg—Use this to trap kernel data. Oops data will be discussed in further
    detail later in the chapter, under the “Tracking Kernel Oopses” section.


    +   - ksym—Kernel symbol locations are presented here. This will be described
    in more detail later in the section on troubleshooting kernel panics, in “Tracking
    Kernel Oops.”


    +   - loadavg—This is the system load data in 1-, 5-, and 15-minute intervals,
    as described similar to us in Chapter 2, “Aspects of Performance Tuning.”


    +   - meminfo—From this, you can get granular data on memory used, similar to
    us command like free or vmstat, but without having the utilities prepare all the
    data for you.


    +   - modules—This is a list of the currently loaded kernel modules, similar to
    running lsmod. In fact, the data presented here should be identical, without the
    column headers that 1mod provides.


    +   - mounts—Similar to running mount or df, this gives information on all filesystems
    mounted, along with their type and other relevant options. The output is similar
    to what should be contained in your /etc/fstab file.'
