  md: '# Prioritize Goals


    At any given time, multiple problems will need to be solved. Make sure that you
    systematically weigh these troubleshootakers against what has the most impact
    for the largest number of users, and act accordingly. At the same time, make sure
    that you do not allow problems themselves to become resource-starved. Finding
    a balance between high-priority new problems and low-priority old problems is
    difficult, but this needs to be done to make sure that, over time, every pending
    problem is solved.


    Linux has come a long way in scaling to large and small systems, but sometimes
    the architecture and the system aren''t the match. At some point, it might make
    sense to drop the money on a high-end Sun machine and make the jump to the stronger
    UltraSPARC architecture. If you''re a Web-hosting facility, it might be worthwhile
    to join the IBM S/390 bandwagon and centralize all your offerings. Intel’s instruction
    set is aging, but it has several facets to keep it around 64-bit systems are ubiquitous.
    As of this writing, this is still at least a year out, and even then there will
    be advantages to scaling up past the current architecture.


    # Risk Evaluation and Tuning


    Tuning, even when done with care, involves making changes to a production system.
    There will always be risks with this, no matter how careful you are in preparing
    yourself. Balancing the risks with the payoffs is difficult, but if approached
    with care, it can be done with minimal impact.


    # Different Levels of Risks


    Depending on what needs to be tuned, different levels of risk are involved. These
    can range anywhere from a full outage to a split-second glitch for a couple of
    users, to nothing at all.


    # Kernel Changes


    Kernel changes can be done seamlessly, if handled correctly. If the running kernel
    was built with support for loadable modules and the core subsystem enabled for
    most devices, most driver upgrades can be done to the kernel without a reboot.
    Underlying SCSI subsystem needs to be enabled as a module, to dynamically load
    a driver module for a controller. Nearly all distributions ship kernels with these
    switches on, and it is easy to do yourself if you are building your own kernel,
    as explained in Chapter 9, “The Linux Kernel.”'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Aspects of Performance Tuning

    CHAPTER 2


    If you need to completely replace the kernel, as in a full version change, a reboot
    might be in order. Coordination downtime for the box can keep unexpected problems
    from surfacing. Also, it is a good idea to leave your current kernel as a runnable
    at boot so that if something goes wrong, a simple reboot will get you back to
    the old configuration without a problem. That said, if possible, the kernel upgrade
    and testing should be done on a similar production system beforehand, just to
    make sure that there is no problem with any of the hardware drivers or general
    configuration differences. If you are running a production kernel (as you should),
    any problems that arise most will result from a misconfiguration of the kernel
    because it is very rare for a bug to enter the kernel in the stable series.


    # Service Changes


    This is a risky undertaking. Changing services generally implies downtime, and
    a lot of things can go wrong, most of which are outside of your control. If possible,
    deploy machines in the new facility to make sure the network and environment are
    prepared correctly for you. DNS propagation can take some time, so it is good
    to have machines at both sets of addresses to minimize confusion during the swap.


    # System Reconfiguration


    Reconfiguring various parts of the system can have different effects, depending
    on what is changed. Changing the IP address of a machine can break the listener
    configuration for an Oracle database because it won''t be capable of binding on
    the next restart. Although automatic upgrades are nice in theory because they
    reduce management overhead, they can cause problems if software on the box relies
    on specific versions of underlying utilities. Always keep all aspects of the system
    when performing an upgrade of any part of the machine.


    # Time Versus Benefits


    You might have had to get an extra 1% off of the disk array, but it would require
    downtime to implement, and the array is already working at only half utilization.
    This is an extreme example, but it''s something to keep in mind when considering
    modifications. Does your solution impose unnecessary risks for minimal gains?
    Does it really justify a week of research and testing to get that extra couple
    of bytes per second through the network? Keep all of these factors in mind when
    weighing your current set of goals and needs.


    # Conclusion


    This chapter has thrown a lot of information at you by covering many aspects of
    the system. You learned everything from threading methodologies to drive hardware
    configurations—it might seem a bit too much to handle at once, but it''s important
