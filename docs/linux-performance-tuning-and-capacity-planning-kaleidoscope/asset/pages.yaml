  md: '# make dep, bzImage, and Similar Commands


    After building a configuration, you will generally need to run a make dep, which
    runs down through the kernel tree and applies your configuration to the build.
    Depending on what you have chosen, different dependencies arise in the code, and
    make dep will resolve these for you.


    After running the dependency checking, it is time to build the kernel. A simple
    make bzImage at this point will do the job. Multiple types of images can be built,
    but bzImage is the default for nearly any user. If you need a different type of
    image build, you know exactly what you need and how to do it. (The reasons for
    doing so are outside the scope of this chapter.) After issuing the make bzImage,
    give the machine some time to work through the source code. The kernel is large,
    and depending on what options you have selected, the build could take such time.
    With modern hardware, the build should take only a few minutes. At the end of
    the build, you should see something like this:


    ```

    # make bzImage

    gcc -D_KERNEL -I/src/linux-2.4.2/include -Wall -Wstrict-prototypes

    --O2 -fomit-frame-pointer -no-strict-aliasing -pipe

    --preferred-stack-boundary=2 -march=i686 -malign-functions=4

    -c o init/main.o init/main.c

    ```


    ```

    tools/build -b bsetoot bset compressed/bvmlin.out CURRENT > bzImage

    Root device is (3, 1)

    Boot sector 512 bytes.

    Setup is 4500 bytes.

    System is 794 KB

    make[1]: Leaving directory /usr/src/linux-2.4.2/arch/i386/''

    ```


    This means that the kernel is built and resides in a file named bzImage under
    /usr/src/linux-2.4.2/arch/i386/. It also built a file named System.map that lives
    in /usr/src/linux, which can be used to map kernel symbol locations, if needed.


    Here is another step that takes place before you install the new kernel: If you
    enabled anything as a module, you will need to install the modules for that kernel
    version. This can be done with a simple make modules; make modules_install command,
    which will build any needed modules and install them in the right location, under
    /lib/modules/kernel-version.


    If you are making small modifications to an already configured system, this build
    process can be simplified with something like the following command, after the
    configuration has been updated:


    ```

    # make dep bzImage modules_install

    ```'
