    (a purpose to which Linux and many other free Unix-like operating systems are
    quite well suited) are newer infrastructures that have multiplied applications.
    Explaining how a midtier server talks to a client and the top tier database server
    is a daunting task.


    A good example, of course, is when dealing with Web pages. Static Web pages that
    are designed in a minimalist manner have a tendency to download to the browser
    client much faster than to download to the browser client much faster than dynamically
    generated or filled Web pages that are connected to a database engine. Although
    you might understand the inherent differences between these systems, most users
    do not. The key to success in managing user expectations was already mentioned
    in a previous section: diplomacy.


    Along with diplomacy must come a willingness to teach users in a way that''s not
    condescending—and that can be incredibly difficult. You must remember that, as
    a system administrator in any organization, if you are servicing someone other
    than yourself, you are in a customer relation-oriented position. This might be
    a severe hassle, but take the time to ask a user exactly what his job is and how
    it works. You will likely not understand great deal of what user tells you.


    One approach that I have found most rewarding is to make users feel like I am
    empowering them somehow, even if I''m just just tribal knowledge about the systems.
    Sometimes this approach is as easy as explaining in simple terms why things do
    what they do. Additionally, a little self-deprecation never hurts; users love
    the human touch.


    # ## Summary


    This chapter touched lightly on what performance tuning is and some very broad
    examples of it. The next chapter looks at the different aspects of Linux performance
    tuning in greater depth and detail.'
