  md: 'quote-max/dquot-nr—These two apply to the number of cached disk quota entries,
    both the maximum and the current number in use. This should hold up in normal
    circumstances but might need to be raised in the presence of a large number of
    users with quotas.


    file-max/file-nr—From these two, you can see the current number of file handles
    in use by the system. Actually, the number presented by file-max is the same as
    the third number presented by file-nr. The first two entries of file-nr are the
    current number of allocated handles and the current number of handles in use.
    The kernel allocates handles up to the maximum but does not release them; it keeps
    them and reallocates those that need them. To raise the maximum number of file
    handlers across the system, echo a new value to the file-max file, as shown here:


    ```

    # echo 16384 > /proc/sys/fs/file-max

    ```


    inode-nr/inode-state—These are similar to file-max and file-nr, except that they
    apply to the inodes behind the file. A good rule is to make sure that the maximum
    number of inode handlers is at least three times larger than the number of file
    handlers.


    overflowid/overflowid—If you are writing to a filesystem that is a 16-bit UID
    and GID rather than that Linux uses, you can use these values to force UIDs and
    GIDs to be mapped to whatever value is specified when writing to such a filesystem.


    super-max/super-nr—Although these are rarely used, they might need alteration
    in a large environment. These values track the current and maximum number of superblocks
    that the system uses. Because superblocks mount points, this is effectively the
    number of mount points you can have. The default is 256, but in a large, heavily
    worked environment, this value might need to be raised.


    # Kernel Parameters


    /proc/sys/kernel1 provides several ways to interact with the kernel''s handling
    of some parameters. Most will never come into play in a tuning session, but some
    can be handy.


    +   - Ctrl+Alt+Del—When 0, this causes the kernel to trap ctrl-alt-del combinations
    and causes a clean shutdown. When this is set to 1, it forces an immediate and
    messy shutdown.

    - panic—This is the number of seconds that the system waits before a reboot when
    a panic occurs.

    - printk—These are the debug logging levels for the kernel, as specified in the
    syslog pages. If you are tracing what looks like a kernel problem, raising these
    levels to generate more debug data might point you in the direction of a solution.'
