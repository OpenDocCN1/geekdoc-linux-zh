- img_proc: true
  md: '# Tuning and Performance Mechanics

    PART IV


    Follow the vendor''s instructions for building the source. In most cases, you
    will end up with an object file (a file ending in .o) in the directory of the
    source. Depending on the driver, there might be several object files. Check their
    instructions, but in most cases, you can run insmod or modprobe on the local module
    file. This should load the driver into the kernel without installing it anywhere
    on the system. modprobe the like to check your current local directory and the
    default location for module files, which is under /lib/modules/kernel-name. If
    you are running kernel 2.4.3, the root path to the modules is /lib/modules/2.4.3.
    From there, these are separated into subdirectories based on their type. For testing
    purposes, though, it is beneficial to maintain separate instances of the driver.
    If you are testing hardware capabilities with each, loading one, testing, unloading
    a second, and testing can be helpful in tracing the right fit for your needs or
    determining which one has a bug in the code.


    In some rare cases, you could end up with the source for the driver only, without
    utilities to build the module. This generally doesn''t happen, but here is an
    example of how to handle simple drivers. This won''t handle anything, but it will
    give you some idea of what is involved in creating a binary module from source:


    ```

    ls

    driver.c

    #gcc -DMODULE -D__KERNEL__ -02 -c vendor.c

    #insmod vendor.o

    ```


    This will compile a simple driver, build a local object file, and load it into
    the kernel. Check your /var/log/messages file to see if the driver dumped any
    information about its status. To install this, simply do the following:


    ```

    #install -m 644 vendor.o /lib/modules/~uname -r/appropriatesubdirectory

    ```


    Replace appropriatesubdirectory with the correct location, depending on the driver—for
    example, use net for a network driver. Also make sure that you use backticks for
    the name of the uname -r call. This replaces the subdirectory in the path with
    the currently running kernel, making sure that the object file is installed with
    the kernel version. You might need to repeat this install for other kernel versions
    with which you are working. Keep in mind that this situation doesn''t often occur,
    and this solution won''t apply all the time—this is only an illustration.


    In the end, you could have just as easily compiled support for the hardware in
    directly into the kernel. It all depends on your needs and whether you can afford
    an outage long enough to install a new kernel. With multiple instances of hardware,
    such as multiple network cards, it is usually easier to run drivers in a modular
    fashion. If the machine will be fairly static, though, it could be simpler to
    build support directly into the kernel for the device. In today''s frantic server
    environments, though, it is helpful to be able to swap drivers in and out dynamically,
    and modules might be needed in order to pass specific performance-related parameters
    to the kernel.'
