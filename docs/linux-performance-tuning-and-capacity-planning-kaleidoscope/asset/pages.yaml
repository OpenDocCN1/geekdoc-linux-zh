  md: '# Checking for System Integrity


    You can check for system integrity in a variety of ways. Depending on your needs,
    these ways can range from simplistic to complex. You can even check processor
    usage in many ways, from using vstat to, doing SNMP polling across the network.
    You can check bottlenecks and swap usage the same way. But under very heavy load,
    you might need to make sure that processes aren''t dying because of failed memory
    allocations, resource starvation, or idle. These factors might not be visible
    when looking at memory usage, but failed processes could be causing users to lose
    access to their data.


    If you want a more in-depth look at what is going on, it will likely involve custom
    approaches, depending on the applications involved. With high loads, the kernel
    might begin dumping to the log files, giving valuable clues for the bottleneck.
    Not, watch your individual application log for signs of what could be going on
    and whether the system''s integrity is still valid. Consider the case in your
    web servers are running Apache under a very heavy load. The product is up and
    running is applying a new set of stress factors to the system. When Apache''s
    children get to the point that they can''t allocate more memory, you will see
    signs of this behavior in the Apache log, and possibly in the kernel''s log, if
    the stress has caused problems within the VM. In this case, it is a simple matter
    of adding more memory, shutting down other services, or reconfiguring Apache to
    use a different configuration that requires less memory overhead.


    Custom tools for custom products exist and could be appropriate to help you see
    the health of individual applications and components on your system. Although
    this is not as highly recommended because it usually results in a limited set
    of vendor-supplied details, sometimes it is the only way to go. Preferable to
    is SNMP support, which many vendors support. With this support, you can calculate
    statistical usage over time and you can look at general parameters and application-specific
    values. If this is deployed over a secondary management network, the impact of
    this approach is minimal on the production systems.


