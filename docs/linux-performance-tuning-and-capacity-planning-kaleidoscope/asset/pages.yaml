  md: '# Overview of Performance Tuning


    # Methodology


    How you approach performance tuning is pretty much up to you. This book is a guide
    to performance tuning, but it is not a rule set. Some practices might be worth
    noting before we delve into all the different areas of performance tuning.


    # The Beater Box Theory


    Many Linux system administrators keep a spare "crash test dummy" box lying around.
    I refer to this practice as the "beater box theory." The idea of the beater box
    is simple: Test as many changes on it as you possibly can before altering a Linux
    system that is in production.


    For instance, imagine that you wanted to change some network parameters on the
    fly to make php3 to MySQL (and back) server perform a little better. If you have
    a beater box, you can easily test several or all of the changes on that system
    to see the effects. The inherent problem with beater boxes is emulating the load
    that the system will be. This is next to impossible unless you have an exact clone
    of a production system facing the same load. The beater box still retains its
    value, especially when low-level kernel changes such as filesystem parameters
    or networking parameters can be very volatile. In these cases, testing the effects
    of changes ahead of time can give you an estimation of the impact.


    # Local Documentation


    Although many people simply abhor writing local site documentation, it is a necessity.


    This is not to say that documentation must always be something that you simply
    cannot live with. If you have total control over a Unix system, then the system
    documentation is pretty much under your control, unless otherwise directed. This
    means that you can use something as complex as some sort of database or as simple
    as a written or text file log.


    This can actually be an interesting side, if properly used. For instance, I once
    wrote a simple Perl program to enter and retrieve information about system changes
    that I made. It was an interesting learning experience because most Perl programs
    I had written up to that point revolved around writing temporary reports about
    the system or automating tasks. I had never really dealt with creating permanent
    records and querying those records.


    # Under the Gun Versus Proactive Mode


    Methodology plays an important role when a system administrator comes under severe
    fire—take my word for it. I was once maintaining a Unix system that used BIND
    for its resolution. Unfortunately, the named server had two different address
    classes in it without different zones. This meant long reverse lookups when remote
    users were connecting, resulting in a long time'
