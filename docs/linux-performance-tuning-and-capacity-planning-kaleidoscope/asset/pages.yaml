  md: '# LVM


    Although the concept of SANs and GFS clusters is usually recommended for most
    medium and large networks, using GFS or a full-fledged SAN might not be suitable
    for your needs. Let''s look at another way to manage your centralized storage,
    the LVM. The LVM is a component that allows for transparent resizing of existing
    partitions, with addition, deletion, and other resource allocation of physical
    storage within the context of a running system. For now, assume that physical
    management of the disks is taken care of in a centralized manner, whether that
    is a true SAN or just a central drive array. Centralizing storage in capable hosts
    is the first step in proper storage management because it allows to add and remove
    storage to the system without rebooting machines, disassembling production hardware,
    and causing costly downtime. Usually, when storage is dispensed on a per-machine
    basis, the result is that each machine needs to be physically rebooted to add
    its storage requirements change. With a SAN or a simple drive this is generally
    not the case, so storage capacity can be added and removed at any time. Combined
    with the LVM''s capability to restructure your partitions on the fly, the amount
    of downtime for storage upgrades becomes much less.


    Now you have all storage in front of you. Whether it is physically close or over
    a Fibre Channel Link, it should be viewable as a hardware storage device. The
    question becomes how to manage it when it comes to allocating partitions, predicting
    usage, and adding storage to existing partitions as usage grows. First you''ll
    look at the traditional means of doing so, and then you''ll focus on how to use
    the Logical Volume Manager in the 2.4 kernel to simplify growth.


    First, assume that the system in question is running the old 2.2 series of kernels
    and cannot take advantage of the LVM. In this case, you need to allocate your
    partitioning scheme carefully; it becomes difficult to manage large amounts of
    data around a production system without scheduling an. Assume the following partition:


    ```

    /boot   /dev/sda1  5 megs

    swap    /dev/sda2  1 gigabyte

    home    /dev/sda3  12 gigabytes

    /       /dev/sda4  26 gigabytes

