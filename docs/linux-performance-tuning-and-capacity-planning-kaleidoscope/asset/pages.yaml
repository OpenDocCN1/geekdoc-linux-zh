  md: '# Performance Monitoring Techniques


    PART III


    # Fake Oplocks


    Oplocks (opportunistic locks) are granted by the Samba server to clients. If the
    server decides that the machine is the only one using a file, it grants an oplock
    to it, letting that client assume that it can cache file locally. Caching the
    operation on the local machine is obviously much faster because the machine doesn''t
    have to keep generating traffic to the server to coordinate what it is doing.
    By setting fake oplocks on the server, Samba grants oplocks to all clients, whether
    or not they are the only one working on the file. This can give large performance
    gains, particularly on read-only filesystems that will only ever have one user
    anyway, such as a shared CD-ROM. However, this can cause corruption if users are
    allowed to step on each other''s work. Samba turns this off by default. If you
    know your environment can survive the possible usage ambiguity, this can help
    speed performance, but shouldn''t be used in a multiuser environment.


    If needed, individual files can be selected to not allow oplocks. Refer to the
    documentation on the veto_oplock_files parameter for more information. Note that
    this applies only on older versions of Samba (before 1.9.18); although it works,
    this is now a deprecated behavior.


    ```

    fake oplocks = yes # no by default

    ```


    # Caching getwd Calls


    You can cache getwd() calls, which return the current working directory, with
    the use of the ''getwd cache=yes'' setting. Samba turns this off by default, especially
    when combined with the wide links parameter set to no. The wide links parameter
    controls whether a user can get a file outside the shared directory tree via a
    symbolic link. With wide links = yes, the server allows users to get anywhere
    they can in the filesystem, if a symbolic link allows them to go outside the default
    tree.


    With a badly symbolic link, users might be able to go to directories to which
    they shouldn''t otherwise have access. With wide links set to no, there is significant
    overhead involved for the server to make sure the user isn''t going outside the
    normal tree; making sure that getwd() calls are cached helps this process. So,
    what follows is the configuration recommended if you want to make that users cannot
    leave their tree. Even if you allow them to go outside their tree, the getwd cache
    can help performance in other areas, so it is always good to leave it on.


    ```

    getwd cache = yes

    wide links = no

    ```'
