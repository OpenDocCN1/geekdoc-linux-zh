  md: '# Tuning and Performance Mechanics


    # PART IV


    advances, IDE doesn''t scale well, it has significant problems handling negotiations
    on the bus, and utilizes the host CPU. Although SCSI is much better, it offers
    a speed that will cause other parts of the system to be the bottleneck. Firewire
    is built to handle this kind of problem—it offers 400Mb/sec rates, and was designed
    to handle the band-width requirements of video and other high-demand operations.
    Although Linux has support for Firewire devices, this bus has never achieved the
    universal acceptance its creators hoped for; however, it might be worth investigating
    for your use.


    This is not to discourage you. It is meant only to point out that, in most situations,
    the disk system will be the bottleneck. The best you can do is attempt to mitigate
    that fact.


    # Alternative Solutions


    In some situations, disk optimizations just''t cover the problem, and it''s not
    enough to sit back and accept the fact that the disk is the bottleneck. Presented
    here are different steps you can take in sidestepping the problem of a slow disk


    First, consider using a solid-state disk for high-speed work. Solid-state drives
    are much faster, offering times much faster than conventional mechanical drives.
    With solid state drives, there are no moving parts, so there no rotational latency,
    allowing the disk to get to the bus at speeds higher than those of normal disks.
    Although the cost is much higher than that of normal drives and the capacities
    are much lower, high-activity data to a solid-state disk can yield large performance
    gains on operations when the disk is waiting for large amounts of data from the
    disk. It is not uncommon for overall speed to increase by four times when rotational
    drives is lessened.


    Shifting work to a ramdisk might also offer gains. Linux buffers your data in
    RAM when it can, but, in this case, inevitably needs to interact with the disk.
    If you are dealing with volatile data that isn''t needed for a short period of
    time, or if you simply want to make sure that a portion of your work never goes
    to disk, a ramdisk is probably what you need. Remember that the data is volatile,—after
    the machine is rebooted, any data that was sitting in ramdisk is for good. Don''t
    store data that you need over time, unless you set up a job that periodically
    backs up to a more permanent storage solution.


    Configuring a ramdisk is relatively easy. For the most recent kernels, ramdisks
    can grow by stealing pages from the buffer cache and flagging them as being protected.
    Make sure that your kernel has built-in support for ramdisk, or compile and use
    insmod to load the ramdisk support as a module (rd.o). First, use dd to mount
    an appropriate amount of data into the ramdisk device; 4M is the default default
    size. Then layer a filesystem on top of the device, and mount it. From that point,
    you can use the mount as a normal filesystem. When you are done, simply unmount
    it. Remember that the process needs to be on a per-boot basis. Here''s an example:'
