- img_proc: true
  md: 'components of the systems involved and build up subcomponents that will satisfy
    intermediate requirements. The two approaches converge in the middle.


    Although this might sound strange, it works fairly well, if you consider the repercussions
    of selecting only one methodology. If you start with a fully top-down approach
    and specify components only from that angle, you might ignore viable paths that
    lead to the appropriate lowest-level components.


    Likewise, if you start with a bottom-up philosophy, you might end building subcomponents
    that piece together a high-level architecture that might not have the top-level
    goals you had in mind. By joining the two, the design should meet somewhere in
    the middle, between high-level directives are made and where the ruler hits the
    board in the server room. Another possible important angle of this is that you
    can interesting results that were never anticipated from either end. For example,
    from the top-down approach, a designer might not consider technologies while trying
    to fulfill requirements. But working with low-level details might come with some
    application of new technology that fits into a new midpoint. This can allow for
    a new high-level capability that wasn''t considered previously.


    This might be as simple as joining new networking technology in an interesting
    way that forms a bridge between two previously separate systems. When joined,
    this offers capabilities for the business as a whole. Doing all the planning for
    capacity and requirements at the highest level might never uncover this angle,
    and it would never have seen from the lowest level. By involving both ends of
