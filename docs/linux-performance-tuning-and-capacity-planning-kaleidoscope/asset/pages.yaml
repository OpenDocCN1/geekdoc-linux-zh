  md: '# Thinking About Capacity Planning

    CHAPTER 13


    Sometimes you have to break down and do some work yourself to collect the data
    you need, through custom code or scripts. If you can''t get memory usage any other
    way, you could set up a cron job that collects the data from vmstat and saves
    it in a file. This is done by using a simple script that runs vmstat for a couple
    rounds and redirects the output to a file, with the date of capture. Another script
    could parse this data and inject it into a collection facility such as a database
    or a spreadsheet for analysis. Although this is a strange example—and definitely
    not recommended—these situations do occur and call for inventive solutions.


    # Data Storage: When Enough Is Enough


    You''ve been saving usage data at three-minute intervals since 1997 and recording
    swap usage rates early 1998. How much is enough?


    Usually, most of this can be discarded. Overall statistics for the period should
    be kept as relevant, but after a time, granular data to this degree is simply
    overkill. When doing capacity planning, you need to be able to plot statistics
    of given types over time. Over larger time frames, however, most of these values
    can be rolled into averages, mins, maxes, standard deviations, and the like. From
    those data points, enough can be determined to plug something into the graph for
    that time range.


    If your architecture has completely changed, some of the data might not even be
    relevant at all. Although this does not mean you should immediately throw it out,
    it means you can take it offline without worrying too much. If you are planning
    a purely Fiber Channel interconnect, using usage statistics from a semi-equivalent
    system from years ago that was running on an old narrow SCSI drive won''t help
    you when you are planning a new system based on much—it will probably confuse
    you.


    Likewise, if your capabilities are completely different now than in the previous
    iteration, comparing throughput rates the new and old could be like comparing
    apples and oranges. There''s simply no value in it. In this case, the data can
    be taken offline.


    Usage statistics be kept online and figured into prediction models only when the
    data present in the system is from a system of similar capacities for what you
    are planning—or at least one that shares attributes. If you are working on a Web
    farm and you have some statistics from the last iteration of Web usage and bandwidth
    rates of your''s other project, keep it. Otherwise, get it out of the picture
    so that you can focus on the problem at hand. The timeframe is entirely subjective,
    but something reasonable for your needs. If your system has a life-cycle of 10
    years with upgrades only every two years, it would make sense to clean up every
    couple of years. With a more dynamic system, where components are upgraded every
    six months, it would probably make more sense to take invalid data out more often.


