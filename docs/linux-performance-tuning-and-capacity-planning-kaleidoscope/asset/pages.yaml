  md: '# Performance Monitoring Techniques

    PART III


    The speed and responsiveness of the X Window System, particularly on desktop and
    workstations, heavily influences the perception of a Linux system''s overall speed
    and responsiveness. This chapter discusses methods for improving X Window performance.
    In addition to describing methods for tuning the X server, it offers suggestions
    for improving the performance of X clients, explains how to create a baseline
    performance profile, and shows how to measure the effect of performance modifications.


    # Analyzing the X Server''s Performance


    Before exploring how to tune X servers and clients, it is important to evaluate
    the server''s current performance. Doing so establishes a starting point of objective
    metrics against which to measure the results of your tuning efforts. It may also
    identify specific problems, permitting you to focus your efforts. To measure X''s
    performance, use the x11perf program, a standard part of the XFree86 distribution
    and usually installed by default. After you have established the baseline, the
    basic tuning procedure is to apply one of the tweaks discussed in the section
    "Tuning the X Server for Local Use," run x11perf, and then it to measure the tweak''s
    impact. Another standard program in the XFree86 distribution, is a handy utility
    for comparing the results of several x11perf runs and displaying results.


    In the process of running tests and applying tuning enhancements, keep in mind
    that X servers and clients do not run in isolation. Rather, they run on loaded
    systems—that is, systems running other servers and programs. As result, tests
    on unloaded, relatively quiescent systems will vary sometimes dramatically from
    tests on loaded systems, tweaks that work on unloaded systems might not work well—or
    at all—on loaded systems. Finally, an enhancement that works on one system might
    not work on another identical system because of each system''s usage profile,
    the mix of programs and how each system is normally used.


    Consider, for example, the difference between the usage profile of a computer
    for standard office duties, such as email, Web browsing, and document preparation,
    and an identically configured computer used primarily as a computer-aided design
    (CAD) workstation. The office workstation makes considerably lighter demands on
    the CPU, graphics hardware, kernel, and X server than the CAD station, so performance
    enhancements sufficient for the office computer could be inadequate for the CAD
    workstation.


    # Understanding x11perf


    x11perf tests the performance of the X server. It also tests basic graphic functions,
    such as drawing circles, polygons, and lines, and the server''s speed while performing
    management functions, such as drawing windows, scrolling, and resizing windows.
    Although basic graphics operations are important, the window-management functions
    are arguably important for the user typing an email, starting and stopping applications,
    and minimizing windows.'
