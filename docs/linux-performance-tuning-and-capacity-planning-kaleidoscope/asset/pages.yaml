  md: '# Capacity Planning

    PART V


    This is not to say that all political aspects are bad. If care is taken, you can
    avoid these harmful factors and find some bonuses. Working within a larger infrastructure
    doesn''t have to be painful—it obviously has some merit, or so many people wouldn''t
    choose this environment.


    Many of the political influences are based on the idea of obtaining a global view
    of the project, an idea exposed throughout this text. Although you might need
    to rely on the help of an upper-level proponent to get operations pushed through,
    opening your requirements to the enterprise could ultimately offer some large
    rewards. First, there will be more eyes looking at your project. This means insight
    from more people of different competencies, which is always good for obtaining
    visibility within the enterprise and as a product. In addition, you''ll get better
    insight into what could be planned more efficiently. As more people analyze your
    system, they might find ways to consolidate preexisting infrastructures which
    reduces your cost and the cost factor within the company, and it removes variables
    from your capacity plan. Thus, the model that you are trying to project into the
    future is simplified. Fewer variables are better from the standpoint of planning
    simplicity and also from the perspective of those looking at the business''s bottom
    line.


    Working through the political minefield with care, you might come out with a more
    capable system that has fewer unknowns. At the same time, you might get free exposure
    within the enterprise. These factors can help bring different groups that historically
    might have had different core competencies, further helping the business''s bottom
    line. As you can see, the political aspects aren''t always bad; they just need
    to be carefully addressed.


    # Knowing Your Application Needs


    The most important part of defining a structure for your capacity planning is
    knowing your application needs. This can be viewed as just another angle on requirement
    specification, but its importance cannot be overstated. Whether it is the system
    as a whole or the applications that comprise it, nearly all of your capacity requirements
    will be driven by what you require. Any bit of knowledge that can be applied here
    should be considered, and any spare bit of research that can be done to eliminate
    ambiguities should be performed.


    Software drives hardware, and hardware drives the capability set of the system.
    If the soft-needs aren''t fully known, you end up with a system that either does
    not work or something that won''t scale over time. If there is one rule to be
    followed in defining the planning structure, it should be that application needs
    be considered first and foremost in moving forward.


    When you''re attempting to find the best path for your capacity plan, you could
    have many factors to consider or too many unknowns in the potential growth patterns
    to be sure that you''re looking down the right path. Sometimes this is a result
    of poor requirement'
