  md: '# Aspects of Performance Tuning


    CHAPTER 2


    # Metric Accuracy


    To get these statistics, you need to interact with a running system. By interacting,
    such as running-top, you are also altering the system. You might be adding another
    process to the run queue, but it shifts the numbers slightly. In terms of overall
    trends, though, the data retrieved in analysis can be counted to give you a good
    overview of the system resource usage.


    # Qualitative Versus Quantitative Measurements


    Make sure that you are recording statistics of relevant data. Don''t keep 1000
    records of vmstat data over the span of an hour when you''re really interested
    in overall CPU usage through the course of the day. You''ll reduce your interaction
    with the system and get only the data you need. Make sure to look everywhere for
    helpful data: You might not get anything interesting from top, but by watching
    the /var/log/messages file as the system hits load, you might see some kernel
    messages come through. One-line warning message (maybe a kernel driver module
    dropping a warning) can be more informative than watching a CPU usage meter for
    an hour.


    # Interpretation and Analysis


    If you are chasing a problem, try to approach it objectively. If you go into the
    research process with a clear view of what you think the culprit is, most likely
    you will look at the numbers that see what you want instead of what is really
    there. Objectivity is key in resolving issues quickly and easily.


    # Compute Versus I/O-Intensive


    Applications tend to fall into one of two categories: Either they are bound by
    the speed of the CPU or they are bound by the speed of I/O, whether it is a disk,
    a multimedia device, a printer, or something else. Accommodations can be made
    on either side to help matters, and expectations must be kept in mind when dealing
    with either type.


    # Application Architecture


    The architecture of an application can have large repercussions in how it interacts
    with the system and, in the larger scope, how it scales. Given a number-crunching
    scientific application, it is most likely CPU-bound. Scaling requires either multiple
    CPUs or a clustering capability within the software. Linux projects such as MOSIX
    can work around the lack of this kind of capability, but they are not foolproof;
    depending on how the application is written, they might not help matters at all.
    Likewise, if the application is entirely disk-bound, as a movie'
