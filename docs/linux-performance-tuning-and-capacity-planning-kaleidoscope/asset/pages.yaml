  md: '# A Blueprint for Capacity Planning


    In the previous chapter, you worked through many of the factors that go into capacity
    planning. Depending on what kind of enterprise you are, in what kind of business
    model you follow, and other factors, you might face a lot of competing pressures
    when trying to actually put together a solid capacity plan. To really effective,
    you must take into consideration everything that you can find to be relevant.
    As mentioned in the last chapter, you may have lots of data that needs to go into
    your analysis, all coming from different sources.


    # General Principles


    So do you make sense of this? Looking at it from a higher level, this can appear
    to be just a large mass of data and interleaving factors, with some very complicated
    interrelationships. This isn''t likely to be an illusion—rarely some planning
    be completely independent of everything in the set. This is just the nature of
    the beast. To construct a plan from all, you should approach the process in a
    structured manner. As you move forward, individual components of the data will
    become clear, and the plan can come together of these pieces. The following sections
    give some general principles to follow when performing effective capacity planning.
    These should provide a blueprint to follow in most situations.


    # Gathering Requirements


    When people first think about requirements gathering, it is usually associated
    with software development. But when doing capacity planning, you need to make
    sure that you completely understand every requirement involved in the system.


    It is important to make it fairly all-encompassing. You need to take all aspects
    of the system''s needs into account. This includes existing user agreements for
    timeouts on data, expected network behavior, expected transaction rates through
    the database, and so on. Consider every aspect of the existing system, or in the
    case of a new system, everything that will need to do. Track down every minute
    detail about every minor task that the system must perform.


    # Gathering Statistics


    Raw statistics can be as helpful in predicting system usage as any business plan
    document describing the anticipated usage over. Although the document is describing
    a potentiality, the statistics are working with an actuality. Your job is to make
    sure that this system can scale to future needs, so the plan is definitely needed.
    However, raw numbers on the whole system has worked up until now are just as valuable
    in piecing together an accurate view of the future.'
