    # PART I


    viewer, spreading across machines won''t help, but getting a faster disk subsystem
    (or multi-ple controllers and spreading the load) can send performance through
    the roof. Keep this in mind when selecting applications for your project, and
    fit them with your hardware needs.


    # Speed of CPU


    This might sound simple, but it can get out of control in many ways. As usual,
    it depends on your needs. If you''re running a static Web on a decent network
    connection, something like a T1, you''re safe with a 486. If you''re doing large
    amounts of processing, a two- or four-way machine could suit your needs and be
    much cheaper than purchasing a single-processor machine with today''s fastest
    chip. Building a Beowulf-style set with code or a load-balancing Web farm, might
    be appropriate. This depends entirely on your needs.


    If you''re looking at something that could end up being embedded somewhere, the
    ARM architecture might be the way to go. Looking at the higher end? As of writing,
    both Intel and AMD are moving toward a 64-bit architecture, while HP and Sun have
    been there for years. The Linux kernel is currently ported to about 20 different
    architectures. Finding the right one depends on your budget and target need.


    # Type of Disks


    Once upon time, there was a clear distinction in drive types. If you were building
    a desktop or a low-end system, it was assumed that you would deploy IDE. For a
    decent server, SCSI was the default. But now, with the advances in the IDE specifications,
    the current crop of disks can compete with SCSI in some applications. Ultra 160
    is the current high end in the SCSI world and is still the weapon of choice when
    building a decent server. SCSI benefits from a more intelligent bus scheme, which
    can show whether you have multiple applications attempting massive writes at the
    same time. This is an example of reordering. If you have several applications
    bursting data at once, the requests would normally send the head over the disk,
    wasting time. With command reordering, the requests are organized so that the
    writes are close to each other physically end up executed in sequence, reducing
    the strain on the drive.


    The next step beyond SCSI is Fiber Channel. Fiber Channel technology offers several
    bandwidth improvements over traditional SCSI and allows physically drives to be
    connected easily. (Ultra 160 SCSI allows up to 25 meters, while Fiber Channel
    allows separations in the kilometer range.) Many vendors use Fiber Channel as
    a connection mechanism to drive arrays that are backed by SCSI disks, which allows
    many machines to connect easily to the same physical drives. Combined with GFS,
    a Linux clustering filesystem, allowing many machines direct write access to the
    same physical hardware becomes feasible.'
