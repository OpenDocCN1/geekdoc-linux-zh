  md: '# Methods for Capacity Planning

    CHAPTER 14


    As mentioned in Chapter 13, “Thinking About Capacity Planning,” when dealing with
    your system statistics, you need to find every bit of relevant data that you can.
    Of course, relevant is the key word here. As gathering requirements, you need
    any bit of data that might have the slightest bit of relevance to the system''s
    operation. You must determine what kind of loads the system has handled in the
    past. This includes disk statistics, network usage, and anything might give information
    on past usage and indication of future trends.


    Make a point to determine what is commonly collected, and attempt to collect data
    on all systems for your capacity plan. The most part, data that you collect on
