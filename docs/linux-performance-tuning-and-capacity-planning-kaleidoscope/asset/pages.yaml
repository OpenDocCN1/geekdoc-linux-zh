    # New and Interesting Capabilities


    Because so much of Linux is done by interested parties all over the world, there
    are always new additions being made to its set of capabilities. Some of these
    get worked into general distributions, while others always exist outside the normal
    development tree and there are only for those interested in specific set of capabilities.
    They are a few of the current additions to the Linux community and how they can
    help in different situations.


    # TUX


    HTTP servers have been around for a long time, at least Internet standards. Over
    time, two major families have developed: those like Apache, which might not be
    the fastest implementations of HTTP handlers which are the most flexible and feature-rich,
    and those that might not have as many features but are designed to be as fast
    as possible when serving data.


    TUX joins the two. It is a kernel-resident HTTP server that may greatly speed
    the serving of Web data. Originally, in version 1.0, TUX was written to sit in
    the kernel and answer all HTTP requests. If the request is for static data, such
    as an HTML file or image data, TUX serves the request without having to pass the
    data to a userspace Web server as Apache. This meant much less work for the Web
    server, which translated into large improvements in performance. New records were
    made with Linux servers using a combination of the kernel and userspace servers.
    With TUX 1.0, if a request was for dynamic content, it was handed off to the userspace
    handler.


    As TUX 2.0, even dynamic capabilities have been rolled into the mix. With either
    userspace or kernelspace modules, TUX can hook to both handlers to generate and
    cache content as needed. For requests that involve a new dynamic content and pregenerated
    content, TUX can merge them from the cache for optimal speed. The catch is to
    be done on an as-needed basis for CGI requests that would benefit from the speed
    increase. Also in 2.0 is the integration of host-based virtual hosting support.
    By collecting different host roots under'
