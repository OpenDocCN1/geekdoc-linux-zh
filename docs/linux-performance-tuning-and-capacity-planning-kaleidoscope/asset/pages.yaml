    PART I


    # # Operating System Structure


    Linux''s overall structure, which is invisible to the user, is similar to that
    of other Unix systems in terms of its structure. Nearly everything on the system
    can be viewed as a file. This paradigm is apparent throughout the system, from
    interaction with real files to kernel tuning. Programmatically, most work is done
    through a file interface. Everything from network sockets, streams, interprocess
    communications, hardware driver interaction, and standard file operations is handled
    through a file interface. For nearly any operation, work is most likely to be
    done through some sort of file, allowing users and developers to adopt a common
    method for working with the system rather than maintaining different models for
    interaction with different aspects of the system.


    Let''s look at an example. Programmatically, if you need to get the kernel''s
    revision number, it can be retrieved through open/read (and hopefully close) calls
    on the hooks /proc/sys/kernel/release (This is through the /proc filesystem, a
    pseudo-filesystem that the kernel and is discussed in later). To get information
    on the contents of /etc/hosts, you will use these calls. Likewise, if you need
    to communicate with another machine over a network socket, the same read (and
    write) calls would be used. Regardless of the activity in question, the Linux/Unix
    model will likely present the data through the common file interface. This yields
    simplicity and provides clean mechanisms for interaction with everything from
    normal files to kernel performance metrics.


    One of these areas that will be discussed in detail later is the cache buffer.
    The buffer and page caches ride under the file interface and provides a way for
    the system to buffer as much data as possible within the available memory. This
    means that the system does not always have to use the underlying physical storage
    as the user requests it, for both reads and writes, whether it is a network mount
    or a local disk.


    In the case of file reads, the caches can maintain copies of the data requested
    in memory, preventing excessive disk reads. For writes, they can buffer data temporarily
    to prevent slowdown while the physical medium is being updated. This results in
    a more intelligent medium during writes and a more responsive system from the
    user''s perspective. A highly visible example of this action can be seen by copying
    a file to a mounted floppy disk. The device mechanisms cannot physically keep
    up with the write request, but the data becomes temporarily cached, allowing the
    user to continue on and do something else. Eventually, the data is synchronized
    to the medium, whether it is through a normal superblock flush, a forced drive
    sync, or the action of unmounting the floppy disk in question.


    Another concept that deserves an introduction here is the /proc interface. Linux
    follows the Unix filesystem concept of having a root filesystem, /, and various
    mount points and directories of varying depth below that. The /proc directory
    off the root of the filesystem is a pseudo-filesystem that doesn''t reside on
    any disk; the kernel presents some of its internals'
