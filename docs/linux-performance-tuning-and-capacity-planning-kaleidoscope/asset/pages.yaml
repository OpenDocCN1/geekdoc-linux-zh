    PART I


    connect. The immediate fix was to tell the particular action not to use DNS until
    the name-server could be fixed. That particular action showed grace under fire,
    as a quick short-term fix for a long-term problem. Of course, that''s not always
    the best of circumstances.


    In most extreme cases, when troubleshooting spans hours, the most important thing
    that the system administrator can do is keep his cool and stay reasonably focused.


    When I maintained mainframe systems, I was completely responsible for the hardware.
    Many times I was troubleshooting (especially interfaces) when I was under serious
    pressure to resolve a problem. When troubleshooting is under a general degree
    of stress, objectivity can be somewhat skewed. I found myself dreaming strange
    theories to explain to my supervisor what I thought was. Having come to learn
    that "I am not exactly what is wrong, but I am working on it" is the best route
    to take. (I have not grasped straws on any Unix-based system, including Linux.)


    Documentation pertaining to system problems and corrections can come quite handy
    in pressure-cooker situations. A problem likely has arisen before (especially
    on recently deployed Linux systems), if it is documented, the solution is not
    very far away.


    # Roles of the Performance Analyst


    Watching systems definitely requires wearing different hats for different situations.
    Anyone who has administered a Unix (or Linux or BSD) system knows this quite well.
    Your role as the one responsible for the well-being and performance of the system
    should make you quite familiar with the many-hats concept.


    You might say that the roles match the problem scope: Sometimes you are faced
    with more of diplomacy and education than tuning with a system. When a programmer
    writes an inefficient program, is the system to blame? When a user has so many
    aliases in his .alias file or login scripts that it causes problems, is it blame?
    When an Internet connection provider''s server is too slow, is the fault in your?
    Of course not. All these situations require a good ability to communicate and
    understand.


    Aside from these roles, the performance analyst (typically the system administrator)
    must also be able to ascertain the difference between disk I/O problems and swap
    thrashing, network configuration (as illustrated by the named problem), and local
    network configuration.


    You must understand precisely what you are troubleshooting and then how to react
    to users. In the best of environments, you are isolated from the user barge; in
    the worst, users will be visiting you every 10 seconds. Finding the focal point
    of the error and acting appropriately (and nice) to the users is the key to success.'
