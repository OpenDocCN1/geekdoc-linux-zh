  md: '# NFS Performance


    Historically, Linux''s NFS support has been lacking. However, many improvements
    were made late in the 2.2 series and also in the 2.3 to 2.4 development cycle.
    The NFS currently provided should be enough to satisfy most users, as security
    is taken into consideration. In general, NFS over public links should be done
    through some sort of encrypted tunnel. If they''re using NFS over a slow link,
    some users might want to mount with the time=n option. The value is .7 of a second,
    which is the length of the time waits before retransmitting a request. If you
    are on a slow line or have many gateways between you and the server, raising this
    could help prevent rebcasts and duplication of effort. The maximum value is 60
    seconds.


    Now let''s consider the normal case when you are fairly close to the server and
    there is a normal LAN between you and it. Mounting with the rsize and wsize parameters
    can help because this will make transfers more efficiently before pushing it over
    the network. Here is an example:


    ```

    # o rsize=1024,wsize=1024 server:/mnt/nfs /mnt/nfs

    ```


    This mounts the server''s /mnt/nfs export to the /mnt/nfs mount point, using an
    rsize and wsize of 1024. This will make sure that transfers are handled in groups.
    In reality, most users jump these values to something like 8192, although your
    needs might vary. If the network doesn''t support buffer sizes as specified, might
    might behave correctly. If this is the case, reduce the block size until things
    start to look normal again. A good test of the speed is to do time tests—the creation
    of a given file size over the network. Something like this will do the trick:


    ```

    # time dd=/dev/zero /mnt/nfs/test bs=1M count=50

    ```


    Do this times to get a decent average of the elapsed time for each copy. Also
    note that NFS does use the buffer cache as explained earlier, so raise the counter
    until you are pushing so much that it cannot fit comfortably within the buffer
    cache. Depending on the NIC and the underlying network, playing with the rsize
    and wsize parameters might be needed.


    After tweaking the parameters, if you''re not getting the results you need, consider
    alternatives. Although NFS is stable and common, it has been around for a long
    time and might not be the best solution. Samba and Global File System (GFS, a
    mechanism for multiple machines to share access to the same physical drive space
    without forcing the user to deal with synchronization problems) could be looking
    into possibilities. HTTP access to the files through a Web server on the remote
    box might be an option as well, depending on your needs.'
