    # Zero-Copy Networking


    This is a new addition to the 2.4 series, and it caused a stir when it was integrated
    into the kernel. Zero-copy networking reaches deep into the networking system,
    but it has been found to be very stable and yields large performance benefits
    on fast networks. This will likely raise the bar even when it comes to performance
    tests.


    You might be wondering what it is, though. Essentially, this is a way to ship
    data to the wire without copying it around the system. If you are using FTP to
    retrieve a file from a server, that server collects the data (read() calls) and
    ships it out of the socket (write() calls). Without zerocopy, the data in question
    gets copied several times. The absolute best case is a direct copy to the kernel
    side of the business, where it is broken down into packets to be sent to the wire.
    The act of doing this takes CPU time and dirties the cache. For most work, checksums
    also be computed over the data being transferred, which requires another pass
    over the data. All this work introduces a bottleneck, keeping the machine from
    utilizing its hardware correctly.


    With the introduction of sendfile() way in the 2.1 development series, this got
    a little better because the userspace application didn’t explicitly have to read
    the data into its memory and write back to the kernel through the socket. It was
    even faster than mmap/write combination that the kernel did all the work of the
    transfer. All you needed to give the kernel the outgoing socket file descriptor
    and the file descriptor of the file to be sent. The kernel handled the rest, keeping
    all memory management on that side of the wall.


    Even with the sendfile call, multiple copy operations were still taking place
    in the kernel. The kernel still had at least copy from the page to the network
    stack. The data was handled even further while the CPU did checksumming work over
    the data before it did the DMA call to push the data to the network card.'
