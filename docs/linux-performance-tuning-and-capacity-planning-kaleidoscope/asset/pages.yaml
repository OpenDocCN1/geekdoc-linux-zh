  md: '# Tuning and Performance Mechanics


    PART IV


    # Managing Disk Space


    To effectively manage your network, the most important factors are consistency
    and scalability. Historically, machines have been managed on an individual basis,
    resulting in complex network deployments that require much more management and
    general attention than they warrant. Using the following technologies, management
    of your network storage should become much simpler, while at the same time allowing
    for more capabilities as your system grows.


    # GFS/SAN


    SAN architectures are offered through many vendors and can conveniently keep your
    storage in the same area. This simplifies backup and failure management, among
    other things. Check with your hardware vendor to see whether a SAN would fit in
    your environment. Within your Storage Area Network (SAN), you can segment your
    storage so that different machines can see different portions of the disk. With
    something like the Global File System (GFS), all machines involved share the same
    drive area concurrently, and all normal disk operations are coordinated through
    the file system. GFS and SAN technologies seem as they overlap, and in a way they
    do. GFS allows multiple machines to share the same physical storage at the same
    time, whereas a SAN tends to be focused on the physical centralization of your
    network storage. In a way they are the same, but not completely. GFS could be
    used within a SAN, but it doesn''t have to be this way—the GFS cluster could be
    a small group of machines coordinating around a shared drive array, whereas the
    SAN exists for the rest of the data on the network.


    Normally, a namespace (a consistent naming system, generally having an enforced
    hierarchy and rules against duplication) is created on a per-machine basis between
    the filesystem and the underlying disk. In case of networked filesystems such
    as NFS and SMB shares, extra handling is injected to make that file manipulation
    is coordinated among users. In the case of GFS, this coordination can be handled
    by machines that are sharing access to the same physical drive set. Although this
    assumes a SAN architecture, it could just easily be a normal shared SCSI drive
    array or a network block device to which all machines are sharing access. The
    advantage is that the machines don''t have to bottleneck the rest of the system,
    and they can have direct hooks into the storage array. This allows for faster
    access to the data that the machines need and also reduces the load of traffic
    on your network.


    GFS works by coordinating file locking through a Device Memory Export Protocol
    (DP) server, which can be implemented in either software or hardware, DMEP is
    a protocol providing a global locking space for all nodes involved in a clustered
    filesystem. When machines are running their local filesystem or connecting to
    a share, they are free to do all the locking'
