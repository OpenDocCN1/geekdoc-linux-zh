    addressed them.


    Last and not least, although this book has strong recommendations for actions
    to take in almost every possible performance problem area, it is still more of
    a guide than a set of rules. In essence, it introduces the reader to concepts,
    methods, and solutions with solid examples. However, I can tell you for sure that
    you will encounter situations that are not in this book or perhaps not documented
