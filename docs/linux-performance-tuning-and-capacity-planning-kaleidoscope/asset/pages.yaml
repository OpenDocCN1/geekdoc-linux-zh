    # nice and renice


    The nice value of a process indicates how “nice” a process is to other processes.
    The nicer (or higher) the nice priority is, the slower the process will use system
    resources and the nicer will be to other processes. Likewise, a lower priority
    of process means that the process will be “less nice” and will use more system
    resources. This can be somewhat difficult to understand, but in a nutshell, a
    lower value translates into a higher priority (not priority—just priority) for
    the process, from the kernel’s perspective. Most people like to think of it in
    reverse.


    The nice and renice commands are used to modify the nice priority of a process.
    The nice command is used to modify a program at the time of invocation before
    it has an associated process. The renice command is used to modify a program after
    it is already running and is attached to a process.


    The default nice priority actually does vary from distribution, but the most common
    one is 0. Additionally, the standard range is 20 to -20.


    # The nice Command


    The nice command syntax is as follows:


    ```

    nice [OPTION]... [COMMAND [ARG]...]

    ```


    For example, to compile a job to run at a nice priority of 5, the command string
    is this:


    ```

    $ nice -n 5 cc mybigprog.c -o myprog

    ```


    This assigns a nice priority of 5 (7 less than the standard 12) for the compiler.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# The renice Command


    Sometimes a process''s nice priority must be changed. Most often this comes in
    the form of jobs that simply must get faster or should be slowed down after they
    have started because they are using a lot of the system''s resources. When such
    a situation arises, the renice command can be employed to alter a running process''s
    nice priority.


    In the simplest form, the process ID''s nice priority is changed like this:


    ```

    $ renice 10 1029

    1029; old priority 0, new priority 10

    ```


    Here, 10 is the new priority and the PID is 1029.


    Only the owner of a process can assign a higher nice priority, and only root can
    assign a lower priority with renice.


    # How nice Comes into Play


    Renicing the right command can sometimes help pull a system out of a bad situation
    without having to kill it altogether. As an example, a Linux system once had an
    -rf job that was interfering with production. However, it happened to be a job
    that was making room so that production could continue. This case is a classic
    catch 22; the wrong decision could have cost a great deal of money in production
    time. The ultimate decision was to raise the rm -rf''s attached PID and lower
    a few of the production processes'' attached PIDs, to even out the load.


    # Summary


    Linux provides the user, programmer, administrator, and engineer with many tools
    to aid in improving performance and make prudent of every session. Helpful tools
    include cron, the facility, and nice. Use them wisely, and spread the good word.'
  merge: -1
