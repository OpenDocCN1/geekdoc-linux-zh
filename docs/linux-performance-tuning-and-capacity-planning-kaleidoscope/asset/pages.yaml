    Modify names and parameters as needed, your first bonding device be named ifcfg-bond0.
    If you have multiple devices, create a file for each device. As with other configuration
    files, DEVICE names the device for the system control scripts, USERCTL makes sure
    that it can''t be modified by regular users, and BOOTPROTO means that it doesn''t
    use a boot protocol. ONBOOT should generally be specified if you want to create
    the bonding set as the system comes up. IPADDR is the address of the device, to
    which all network devices involved will be attached. The other parameters should
    be based on your network.


    Also present in the scripts directory should be configuration files for your network
    devices which will be integrated into the bonding set. We will assume ifcfg-eth0
    and ifcfg-eth1, although there may be more. This would be the case if you were
    adding more than two to the bonding set or the machine configured to use other
    Ethernet interfaces in addition to the two that are bonded. These file should
    look like the following:


    ```

    DEVICE=eth0

    USERCTL=no

    ONBOOT=yes

    MASTER=bond

    SLAVE=none

    BOOTPROTO=none

    ```


    As you can see, this is fairly straightforward. The major difference is that now
    the ifcfg-eth* files don''t specify the IP configuration because it is defined
    in the bond0 device. This file is just enough to make sure that the Ethernet device
    is configured to use bond0 as its master and is configured to be a slave. This
    should be replicated for all Ethernet devices involved, modifying the DEVICE name
    and MASTER name as needed. Also, the Ethernet devices present''t have to be of
    the same type to be bonded; they can be any type of Ethernet hardware that Linux
    supports, although it helps you understand MII status monitoring so that the bonding
    driver can cleanly handle situations when slave status goes bad. Refer to your
    hardware vendor documentation on the card to see if this is supported.


    To bring up the device, you need either use the system-specific restart script
    or do it by using ifconfig and ifensave, as discussed previously. For Red Hat
    and derived systems, running /etc/rc.d/init.d/network ''restart'' shuts down the
