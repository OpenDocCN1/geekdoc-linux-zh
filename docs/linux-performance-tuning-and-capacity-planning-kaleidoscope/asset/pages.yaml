- img_proc: true
  md: '# The Linux Kernel

    CHAPTER 9


    You can configure a whole slew of configuration directives to automate the loading
    and unloading of drivers and their dependency trees. Some drivers, especially
    if you are loading multiple instances of hardware, require you to specify options
    during the module load. (Performance can be greatly affected by what parameters
    are handed to the driver, so check your vendor''s documentation for what options
    are available.) Here''s an example of loading the NE2000 network driver with a
    parameter to specify IRQ 5:


    ```

    #modprobe ne irq5

    ```


    You probably don''t want to specify these parameters every time you use the driver,
    though. By specifying driver parameters and aliases in /etc/modules.conf, you
    can automate this process and even have the driver load access to the hardware.
    In addition, you can specify actions to take before and the module load. By aliasing
    devices to driver names, you can create simple interaction with the driver. Here''s
    a sample /etc/modules.conf file that should reflect basic capabilities:


    ```

    alias net-pf-4 ipx

    pre-install pcmia_core /etc/rc.d/init.d/pcmcia

    alias usb-lowlevel usb-hci

    alias partout_lowlevel portant_pc

    pre-install plip modprobe portant_pc ; echo 7 > /proc/parport/0/irq

    alias eth0 8139to

    ```


    As you can see, this makes use of options. If you have a device setup, such as
    a laptop might have, you''ll be making use of the pcmia core. The configuration
    makes sure to run the pcmia script in /etc/rc.d/init.d before doing any module
    configuration. Likewise, for parallel port drivers, the plip command is run, followed
    by a kernel setting pushed to the /proc interface. Aliasing drivers names is also
    handled. In this case, eth0, the first Ethernet device, is aliased to be driven
    by the 8139to driver. You might also get a second network card that relies on
    a different driver. Adding eth1 and the name of the module for the second card
    instructs the system to automatically use the other driver for eth1. If you are
    using the ne driver here, as demonstrated earlier with modprobe, and you wanted
    to specify IRQ 5 should be used, you would insert a line such as options irq=5


    What happens if you get source code for your hardware, but you don''t know how
    to integrate it with the kernel? If the vendor supplies a raw module file, you
    might need to have a specific instance of vendor''s kernel installed. If you''ve
    rolled your own, this might not work, and you''ll need to contact the vendor.
    This tends to happen with vendors who say that they support specific instances
    of individual distributions. In reality, the kernel can be modified to work with
    any distribution, but it might not work perfectly out of the set of files and
    a Makefile. vendors are providing source, though, you might end up with a set
    of


