  md: '# Network Performance

    CHAPTER 7


    This raises the size of the input queue (bytes available for socket handling during
    requests) for the NFS daemon (among other things), but puts back to the normal
    settings afterward. The socket queue by default is at 64KB, which, if you are
    running 8 instances of the NFS server daemon, limits each to having only 8KB of
    space to buffer requests. This example raises the size of the input queue to 256KB,
    with 8 servers, raises the space for each server to 32KB. (If you have a different
    use, be sure to check the original value before replacing it at the end.) This
    is a bit of a hack, and it shouldn''t be unless you are really losing a lot of
    data. If it is the case it should be done by your startup scripts rather than
    doing it after everything started. Even then, it might make sense to raise the
    values marginally and leave them as set. Before doing this, make sure that you
    are having problems with failed connections on the box. Run a port scanner across
    it at high load, and see if it fails the connects. (Nmap or xmap will do the job
    perfectly, by targeting it at all 111, the npc port might be beneficial to run
    a full scan, just to see if all services are getting the network resources you
    need.) If the scan fails, this approach might be needed; otherwise, you''re better
    off looking-where.


    Another possible source of problems is packet fragmentation overflow. Like the
    input queue problem, this is not really specific to NFS, and problems might exist
    elsewhere on the box if this is occurring. Essentially, the network stack is attempting
    to track fragmented packets by keeping them in memory until they can be reassembled.
    Fragmentation occurs when transmitted packets are broken up and need to be reassembled
    at the destination point, but need to be tracked in the meantime until the entire
    set has been received and can be put back together. But because of the volume,
    it doesn''t have enough space to keep all the balls in the air until enough packets
    come in and complete the set.


    If you modify what is considered allowed thresholds, look under /proc/sys/net/ipv4/,
    in ipfrag_high_thresh and ipfrag_low_thresh. Here''s how they work: If the number
    of fragmented packets goes above the high value, new ones are dropped until the
    number of incomplete packets drops below the value. To see if this is happening,
    /proc/net/snmp under high load, with careful attention to the ReasmFails field.


    Other than these tweaks, not much can be done with NFS other than raising the
    hardware bar, either the network, the drive hardware, or the machine''s components
    such as memory. NFS is an old protocol, and although it has been updated, it isn''t
    as flexible as schemes such as Samba, and NIS are fairly easy to deploy side by
    side, and what might make sense for your environment. Still, Samba will work as
    well as better than NFS as a server because it is more flexible in its options.
    It also fits better in a heterogeneous environment. Choose what is right for the
    environment, keeping in mind current needs and what might need to be integrated
    down the road.


