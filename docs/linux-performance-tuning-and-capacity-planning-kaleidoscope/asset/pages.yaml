  md: '# Network Performance

    CHAPTER 7


    Although this sounds like a nice, simple way of aggregating bandwidth on your
    local network, it should be approached with care. The underlying network might
    not be up to the task without adding switches. It is generally good to implement
    bonding over multiple switches, to ensure better failover in case of a switch
    failure, but this relies on an interswitch link (ISL), causing a bottleneck between
    the switches. If you have multiple bonding devices switching over the same ISL,
    that becomes a bottleneck.


    Take a look at what you are looking to implement and where bonding fits best.
    For many situations, it is probably better to configure bonding directly between
    two machines. This might be the case if you have replicating file servers or database
    servers that need to negotiate large amounts of data between them and may have
    an extra interface to work with the rest of the network. An interbond is best
    in this case because it doesn’t require extra hardware—you can simply connect
    the two machines to each other. Also, this reduces the load on the network because
    the data replication happens over the bonding link, outside the scope of the general
    network. You get better response on the replication because it has at least the
    bandwidth that it had previously, and the rest of the network will behave as it
    was upgraded, too. In this case, it might be worth getting a four-port card for
    each machine. This will save PCI slots in the machine from being used by all the
    network cards, leaving them for other uses.


    Another factor to remember is the speed of the storage mechanism that is feeding
    the network interface. If you have an old IDE disk, hooking a 400Mb link to it
    won’t gain you much you. Having a fast disk subsystem is a major prerequisite
    to getting this route, unless you are using it as an interconnect for distributed
    computation and are more interested in message passing than serving data.


    # Enforced Bandwidth Limitations


    Sometimes the best way to manage your bandwidth is by limiting it. Certain subsystems
    might need to get the data from a remote network, but that might mean trying to
    pull data over a slow link at one time another the network tries to pull some
    over, too. Eventually, everything will work out because it will just bottleneck
    at the link for a while. But if one machine’s smooth operation is more important
    than general system health, you might be in trouble.


    Say that you need to get analysis of the data at the other end of the link in
    two hours. If the other machine is taking bandwidth at the same time, you might
    not even be transferring, let alone begin the analysis, by the deadline is up.
    In this case, you probably want to configure your network to achieve a certain
    amount of guaranteed bandwidth over that link for each part involved. Applying
    guaranteed bandwidth and rate limitation is one of the first steps laying out
    a solid framework for reliable networking.


    ![](img/2b37d94d13f57db80d78b9bbd5ec8db9_157_0.png)'
