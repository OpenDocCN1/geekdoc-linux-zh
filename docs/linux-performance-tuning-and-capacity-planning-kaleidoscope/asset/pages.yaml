  md: '# Apparent and Nonapparent Bottlenecks

    CHAPTER 5


    # Shared Libraries


    These days, a program rarely needs to be statistically linked with all its libraries
    when it is built. Historically, code libraries were built to be static, which
    meant that when you built an executable image with your library, everything was
    linked back together into the image. Although this can remove any missing dependency
    problems, it results in larger binaries and wastes disk space because the library
    code is replicated in all binaries that need it.


    Shared libraries handle this problem. When you build or run an application involving
    shared libraries, the executable is built with the library names that it needs
    in the file. Then, when the executable is run, the appropriate libraries are found
    and linked so that the program can run. All applications that depend on this link
    against it at runtime, saving all the duplication that would be involved in the
    static build.


    Another advantage of shared libraries is that they reduce the load on main memory.
    With file mapping, the linking process links the image to the appropriate page
    frames where the library lives. The pages used by the library can be shared by
    all programs that are using it. If you have a lot of processes running all the
    same shared library, this can save the overhead of duplicating the shared library
    code dozens of times in the system''s RAM. When the code is configured to be a
    shared library and applications are linked against it, all management of this
    is controlled by the shared scenes. No interaction from the user would be required,
    except for maybe the LD_PRELOAD hooks described in Chapter 2.


    # Factors to Keep in Mind


    When you are watching memory, keep in mind that looking at the output of top might
    not be the best way of getting a handle on the real memory usage. Although it
    will give you a nice ballpark figure, the actual memory in use can differ greatly
    from this. This is how the fields presented in system usage should be interpreted:


    +   - SIZE—This is the address space seen by the process. It can include mmap
    calls, which can grow the apparent size of the application without allocating
    any more memory. For example, X servers use map the memory present in your video
    card. If you have a video card with 32MB of RAM, the size of the X server will
    grow by 32MB, even though no extra memory was allocated from normal physical RAM.
    This is generally viewed as the real size of the program when, in reality, it
    is very far off.


    +   - RSS—Resident Stack Size, or RSS, is the actual amount of memory that the
    process is using in RAM. When you''re looking for a basic metric, this is the
    path to take. Chunks of code that have been swapped out of the process''s memory
    to disk are not counted in this set. Thus, if you have a process using 1MB of
    RAM but the system has swapped out 300KB to disk, the RSS should be roughly 700KB.


    5 APPARENT AND NONAPPARENT BOTTLENECKS'
