  md: '# Filesystem Caching


    Linux aggressively caches filesystem data, sometimes to the alarm of users. Typing
    free from a shell gives you something like this:


    | total | used | shared | buffers | cached |

    |---|---|---|---|---||

    | Mem: | 387404 | 282288 | 71652 | 166284 | 40364 |

    | -/+ buffers/cache: | 801552 | 5576 | 311844 | | |


    Looking at these measures, you would guess that the system has roughly 378MB of
    RAM and that it is 282MB of that. You would think that it''s just caching within
    the kernel, utilizing the free memory for disk caches. Note the second line, which
    is the system memory usage with the buffer and page caches—roughly75MB, which
    is more in line with expectations. For a quick idea of the different caches, think
    of the buffer cache being a cache of the raw blocks on the disk, and think of
    the page cache being a cache of various files that are in the system. For sequential
    sectors on a physical device might be cached by the buffer cache. The page cache
    would handle a series of requests for the same section of a file that has been
    assembled in memory from what might have been discontinuous locations on disk.


    As the kernel is handling various data, it buffers as much as it can within the
    available RAM to save time on accesses of data. As the system load grows and applications
    request that, the buffer shrinks so that more memory is available to user-space
    programs. In general, using these caches can greatly improve system responsiveness,
    without any special code needed to take advantage of it. Later in this chapter,
    you will see an example of how to tune the buffer cache if you need to boost system
    performance.


    Incidentally, these caches tend to find memory rather quickly (as memory-intensive
    operations such as using GCC to compile the kernel). If you load an operating
    system that doesn''t cache as aggressively as Linux onto the machine, and if the
    box never uses all the available RAM, no fault is ever seen. But with Linux installed,
    faults occur frequently, and they can be wrongly attributed to the kernel behaving.
    A good test of this is to build the kernel. Between the memory-intensive compiler
    and the caches, the system ends up using all memory in one form or fairly quickly.


    # I/O Overview


    Your I/O subsystems should get a lot of attention, in the planning stage and during
    the tuning process. The right hardware needs to be in place to effectively handle
    the system''s needs. At the same time, it needs to be managed so that configuration
    changes down the road can be handled with little or no disruption. This section
    looks at some management factors to keep in mind.'
