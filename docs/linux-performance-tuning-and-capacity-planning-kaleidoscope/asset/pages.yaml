  md: '# Virtual Memory


    The virtual memory (VM) subsystem is a very important part of the kernel. It has
    implications throughout the kernel because it controls memory usage. Historically,
    the VM subsystem has been very good at tuning itself—the 2.0 series was known
    for being nearly perfect. The early 2.2 series, it could become unpredictable
    under heavy load, which was sorted out later in the 2.2 series. New metrics are
    in place for the 2.4 kernel and generally keep it from human help. Nevertheless,
    there are a few entries present if you need to override the default settings.


    bflush is the file that has the most impact on the system. In Chapter 2''s example
    of irresponsible tuning, we showed an example of updating the bflush parameters
    and a set of values that have been shown to generally increase performance. Here''s
    some additional information about what each parameter means so you can make of
    an educated decision how to tune the parameters for your machine.


    The first value, as described earlier, is the percentage of the buffers that need
    to be dirty before a flush occurs. This should be 30 or so; although it is tempting
    to raise it directly to 100 to make sure that the buffer is always used rather
    than disk, keep in mind your expected load. If the system waits until all buffers
    are dirty to trigger a flush, a large amount of I/O will occur during the flush,
    adversely affecting performance. If the system is prone to bursts, a lower number
    is recommended so that I/O flushes are spread out in a more gentle manner.


    The second parameter is the number of buffers that bflush can push through during
    a single flush operation. This number should be kept at the default value for
    all situations. Lowering it will only cause flushing on wake cycles because there
    will most likely be dirty buffers after each flush, and the dirty count cannot
    easily stay near the flushing threshold. Raising the value will cause more to
    be flushed per cycle, at the expense of time being locked up with disk interaction.
    Depending on your memory requirements, you might want to allow more buffers to
    be flushed per call.


    Next is the threshold of dirty buffers to trigger bflush when trying to refill
    buffers. Basically, when the system is trying to create new buffers to use, if
    this threshold of dirty buffers is passed, bflush will be triggered to clean up
    some of the old buffers, making room for new buffers.


    The fifth value is a dummy value, so it doesn''t matter what you enter.'
