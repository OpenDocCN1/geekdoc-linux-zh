  md: '# Case Studies

    PART VI


    itelf. It cannot be stressed enough that the kernel list is high-volume and accepts
    only questions that have been presented in a well-thought out manner—and possibly
    in a par-ticular format. (Note that you should read the Linux Kernel Mailing List
    FAQ before sending a question to ensure you are not breaking any of the rules.)


    With any of these resources, it is very important that you thoroughly describe
    the problem at hand, along with all factors that are relevant. In the special
    case of the kernel list, such as when posting an oops message, a specific format
    of what problems should be included, accompanied by a translated version of the
    oops data itself. Failure to follow these rules usu-ally will get you nowhere.
    In general, it is a good idea to read the list rules and, if possible, to “lurk”
    on the list to get a feeling for what should be asked and how it should be asked.


    # Summary


    With a little tenacity—and, hopefully, spare time—an administrator can easily
    fortify his arsenal- of information by taking a look on the Web, digging through
    the LDP, querying mailing lists, or subscribing to newsgroups. As always, remember
    that the open source and free soft-ware movements are extremely fast-moving entities,
    and pieces of code are coming into the bleeding edge and rapidly being stabilized
    into the normal distribution channels. If you don’t see a specific fix for your
    problem either in vendor documentation or other normal sources, be sure to check
    the lists for how to use the latest information.'
