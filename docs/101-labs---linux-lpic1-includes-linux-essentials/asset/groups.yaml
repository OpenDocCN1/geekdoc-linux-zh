    \ \n最后，进行清理：\n\n- 运行 `sudo visudo` 并删除您添加的 'luser' 行\n- `sudo userdel luser`\n\
    - `sudo userdel luser2`\n\n注意：  \n有关如何限制用户密码有效期及其他类似功能的更多信息，请参阅实验 74。如果在实验结束时无法删除用户“luser”，因为该用户仍被某个进程使用，您可以找到正在调用的\
    \ PID 并将其终止。luser 在删除前需要注销。\n\n## 实验 97\n\n### 执行安全管理任务：系统审计\n\n**实验目标：**  \n\
    学习如何管理和审计端口、进程及其他系统方面。\n\n**实验目的：**  \n在本实验中，您将回顾用于管理服务、端口、文件权限及其他功能的多种工具，以维护安全的\
    \ Linux 系统。\n\n**实验工具：**  \nUbuntu 18.04（或您选择的其他发行版）\n\n**实验拓扑：**  \n单台 Linux\
    \ 机器或虚拟机\n\n**实验步骤：**\n\n*任务 1：*  \n打开终端并运行：\n\n```bash\nsudo find / -perm /u+s,g=s\
    \ -type f -exec ls -l {} \\; 2>/dev/null\n```\n\n这是一条繁琐的命令，所以让我们拆解一下。在这里，您正在查找系统中所有设置了\
