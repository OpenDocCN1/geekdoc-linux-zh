  md: "\nFinally, clean up with `rm files.zip`\n\n## Task 3:\n\nThough ZIP is a common\
    \ format and well-supported on Linux, it is not the main compression format Linux\
    \ uses. That would be the classic gzip:\n\n```\ngzip f*\nls\n```\n\nWait a minute…\
    \ why are there now nine gzipped files instead of just one? And what happened\
    \ to the originals?\n\nThis is why gzip is considered a *compression* format rather\
    \ than an *archive* one. To create a single, easy-to-use archive file, we need\
    \ a different tool...\n\n## Task 4:\n\nRun: `tar -cf files.tar.gz f*`\n\nNow,\
    \ with the help of the *tar archiver*, you have your gzipped archive in files.tar.gz...\
    \ well, sort of.\n\nNormally, with a gzipped tarball, you would be able to extract\
    \ it with `tar xf files.tar.gz` and get all of the original files back. Instead,\
    \ you could try that yourself now, and you would get the nine .gz files.\n\nThere’s\
    \ a better way. Let’s blow this up and start over:\n\n```\nrm f*\ntouch f1 f2\
    \ f3 f4 f5 f6 f7 f8 f9\ntar -czf archive.tar.gz f*\ntar --list -f archive.tar.gz\n\
    ```\n\nTa-da! Now you see a list of nine files within your single compressed tarball.\n\
    \n## Task 5:\n\ngzip isn’t the only format you can use with tar:\n\n```\ntar -cjf\
    \ archive.tar.bz2 f*\ntar -cjf archive.tar.xz f*\n```\n\nThe bzip2 and XZ formats,\
    \ respectively, are newer and use different algorithms from gzip, but the end\
    \ result is the same. tar can extract all of its formats in the same way, simply\
    \ by using `tar -xf filename`.\n\n## Task 6:\n\nFinally, clean up:\n\n```\ncd\
    \ ~\nrm -r lab12\n```\n\n## Notes:\n\nZIP, gzip, bzip2, and XZ all have their\
    \ own strengths and weaknesses. You could look for benchmarks on the internet...\
    \ or, for an extra challenge, you could try running your own! You should have\
    \ ZIP installed but you might have to do so if for some reason it's not present.\n\
    \n# LAB 13\n\n## Searching and Extracting Data from Files: Pipes and Redirection\n\
    \n**Lab Objective:**  \nLearn how to use pipes and redirect input and output in\
    \ Bash.\n\n**Lab Purpose:**  \nBash has two commonly-used features, known as pipes\
    \ and I/O redirection, that make life easier when using Linux. In this lab, you\
    \ will learn how to make use of these powerful features.\n\n**Lab Tool:**  \n\
    Ubuntu 18.04 (or another distro of your choice)\n\n**Lab Topology:**  \nA single\
    \ Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\n### Task 1:\n\n\
    Open the Terminal application and run:\n\n```bash\nmkdir lab13\ncd lab13\necho\
    \ \"hello world\" > hello\ncat hello\n```\n\nYou just redirected the output from\
    \ your echo command into the hello file. The > is a shortcut; the proper version\
    \ of this would be 1>, where 1 is called a file descriptor, which references the\
    \ standard output.\n\n### Task 2:\n\nNow run:\n\n```bash\nls nonexistent 2>> hello\n\
    cat hello\n```\n\n### Task 3:\n\nBased on the new contents of the hello file (\"\
    ls: cannot access 'nonexistent': No such file or directory\"), what can you surmise\
    \ about the function of 2>? Here, 2 is a file descriptor for *standard error*.\n\
    \nSometimes, you want to redirect both output *and* error to the same place. In\
    \ ye olden days, you would have to do something ugly like this: `ls foo > bar\
    \ 2>&1`\n\nHowever, modern versions of Bash have an easy-to-use shortcut: `ls\
    \ foo && bar`\n\n### Task 4:\n\nWe’ve talked about redirecting output, but what\
    \ about input? To learn about that, run the following commands:\n\n```\ncat <\
    \ hello\n```\n\n```\nread foo <<< \"foo\"\necho $foo\n```\n\n```\ncat << END-OF-FILE\
    \ > goodbye\nhello\ngoodbye\nEND-OF-FILE\ncat goodbye\n```\n\nIn short: `<` redirects\
    \ input from a file name, `<<` starts a here document, and `<<<` redirects input\
    \ from another command.\n\n### Task 5:\n\nPipes (`|`) let you use the output of\
    \ a command as the input to another command. In many situations (but not all),\
    \ `|` and `<<<` are kind of a reverse of one another. For example, the output\
    \ of...\n\n```\necho \"hello world\" | grep e\n```\n\n... is identical to the\
    \ output of...\n\n```\ngrep e <<< \"hello world\"\n```\n\nTry to predict the output\
    \ of the following command string before you run it (see **Answer 1** below):\n\
    \n```\ngrep non hello | cut -d: -f3\n```\n\n### Task 6:\n\nFinally, clean up:\n\
    \n```\ncd ~\nrm -r lab13\n```\n\n### Answer 1:\n\nNo such file or directory\n\n\
    ### Notes:\n\ngrep searches for matching patterns in a string, while cut splits\
    \ the input into pieces. Both are very common tools which you will use more in\
    \ subsequent labs.\n\n# LAB 14\n\n## Searching and Extracting Data from Files:\
    \ Regular Expressions\n\n**Lab Objective:**\nLearn how to use regular expressions\
    \ for complex string pattern matching.\n\n**Lab Purpose:**\nRegular expressions\
    \ are a tool used commonly in Linux to match complex patterns in strings and text\
    \ files. Many tools support regular expressions.\n\n**Lab Tool:**\nUbuntu 18.04\
    \ (or another distro of your choice)\n\n**Lab Topology:**\nA single Linux machine,\
    \ or virtual machine\n\n**Lab Walkthrough:**\n\n### Task 1:\n\nOpen the Terminal\
    \ application. See if you can predict what the output of this command sequence\
    \ will be before you run it (see **Answer 1** below):\n\n```\necho \"foo\nbar\n\
    baz\nquux\nfrob\nplugh\nxyzzy\" | sort | tail -5 | grep [be]\n```\n\n### Task\
    \ 2:\n\nCan you match which of the following strings (on the right) would match\
    \ each regular expression (on the left)? Each regex may have multiple matches!\
    \ See **Answer 2** below for the solution.\n\n```\n^s?.*$      Hello World\n^[0-9]\
    \  .*$  1, 2, 3, Go!\n^. .*[a-z].*$  sayonara\n^q?[a-z]*$  101labs\n```\n\n###\
    \ Answer 1:\n\n```\nfrob\n```\n\n### Answer 2:\n\nThe first expression matches\
    \ all four strings.\nThe second expression matches “1, 2, 3, Go!” and “101labs”.\n\
    The third expression matches all four strings.\nThe fourth expression matches\
    \ “sayonara”.\n\n### Notes:\n\nRegexr is a great resource for practicing your\
    \ regular expressions.\n\n# LAB 15\n\n## Turning Commands into a Script: Shell\
    \ Scripting\n\n**Lab Objective:**\nLearn how to write a simple shell script containing\
    \ multiple commands.\n\n**Lab Purpose:**\nScripting with Bash is a daily task\
    \ by many professional Linux administrators. When a task is repetitive, you don’t\
    \ want to be typing the same list of commands over and over; you want to create\
    \ a script, and perhaps also schedule that script to run automatically.\n\n**Lab\
    \ Tool:**\nUbuntu 18.04 (or another distro of your choice)\n\n**Lab Topology:**\n\
    A single Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\n### Task\
    \ 1:\n\nOpen the Terminal application, and run your favorite text editor, such\
    \ as `vi` or `nano`. (If you have never used `vi` or `vim`, then `nano` is strongly\
    \ recommended.)\n\nCreate a file with the following contents:\n\n```\n#!/bin/bash\n\
    for (( n=0; n<$1; n++ ))\ndo\n    echo $n\ndone\necho \"Output from $0 complete.\"\
    \n```\n\n### Task 2:\n\nMake the file executable (with `chmod +x filename`), then\
    \ run it like:\n\n```\n./filename 10\n```\n\n### Task 3:\n\nYou should see the\
    \ numbers 0-9 printed out, one at a time. Knowing what the script does now, can\
    \ you understand it in its entirety? What happens if you fail to pass an argument,\
    \ or if you pass \"gibberish\" like letters instead of a number?\n\nRun your script\
    \ without an argument. Then run: `echo $?`\n\n`$?` is a special variable that\
    \ references the *exit status*. In a successful program, the exit status would\
    \ be 0. Please try it for yourself now. Then edit the script by removing the last\
    \ echo statement. This script then fails without an argument, returning a different\
    \ exit status.\n\n### Notes:\n\nThat first line, starting with `#!` (called a\
    \ *shebang*), denotes what program will be used to interpret your script. Usually,\
