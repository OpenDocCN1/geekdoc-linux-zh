    ### # 前言 101 Labs


    欢迎阅读您的 101 Labs 图书。


    当我在 2002 年开始教授 IT 课程时，我发现大多数培训手册几乎完全专注于理论知识，这让我震惊。除了几个使用命令或配置指南的示例外，你只能埋头苦读，却永远不知道如何将所学内容应用到实际设备或现实世界中。


    快进 17 年，情况几乎没有改变。我仍然在纳闷，当大约 50% 的考试分数基于动手技能和知识时，为什么大多数书籍对培养你通过考试并在选定的网络、安全或云工程师职业生涯中赚钱所需技能的关注寥寥无几。


    101 Labs 不是一本理论书：它的目的是将你在学习指南中学到的知识转化为作为网络工程师在入职第一天就会用到的宝贵技能。例如，我们不教 DHCP，而是向你展示如何配置
    DHCP 服务器，哪些地址你不应该使用，以及你可以向主机分配哪些参数。如果协议不起作用，我们会告诉你可能的原因。这听起来有用吗？我们当然希望如此。


    我们选择考试大纲中最相关的部分，并使用免费软件或免费试用版（尽可能）逐步指导你完成配置和故障排除命令。随着你信心的增长，我们会增加难度级别。如果你想成为一名卓越的网络工程师，你可以自己创建实验，添加其他技术，尝试破坏它们，修复它们，然后重做一遍。


    –Paul Browning


    ## 101 LABS–LINUX LPIC-1：系统管理员


    本书旨在巩固您在 Linux LPIC-1 学习指南或视频培训课程中阅读到的理论知识。如果您尚未学习任何理论，请查看我们的网站 https://www.howtonetwork.com，该网站还包含模拟考试。


    本书的目标是显著提高您的动手技能和速度，使您能够在 Linux LPIC 考试的实操部分中取得成功，并将您的技能转移到现实世界，成为 Linux 网络工程师。我们没有空间在这里涵盖任何理论，因此请参考您的
    Linux LPIC 学习指南，以充分理解每个实验背后的学习要点。每个实验都旨在涵盖一个特定的理论问题，例如 fdisk 的配置要求。


    如果您希望获得 Linux LPIC-1 认证，您必须通过两项考试：


    - 101-500

    - 102-500


    本书实际上从 Linux Essentials 大纲开始，涵盖实验 1 到 25。如果您希望参加此认证，您可以预订考试：


    - 010-160


    请访问 LPIC 网站了解考试主题和预订详情：

    https://www.lpic.org


    我们已尽力涵盖 Linux Professional Institute 网站上的考试大纲中提到的所有大纲主题。请检查他们网站上的大纲，因为它可能会发生变化。他们的网站还提供了关于每个主题区域权重的更多详细信息。


    还值得注意的是，一旦我们展示如何配置某些服务或协议几次，我们就会在后续实验中停止逐步指导——以节省宝贵的空间。无论如何，您总是可以翻回几页查看它是如何完成的。


    我们已尽力使拓扑尽可能简单，因此，几乎所有实验都是在运行在虚拟机上的 Ubuntu 安装（具有互联网访问）上配置的。请务必查看我们的资源页面，其中包含您可能需要的任何附加信息：https://www.101labs.com/resources


    ## 进行实验


    除了开头的几个研究性实验外，所有实验都是动手操作型的。它们已由多名学生以及一名高级 Linux 顾问检查，因此应该没有错误。请记住，每台机器都会有所不同，因此您的输出在许多情况下将与我们的不同。如果您使用的发行版不是
    Ubuntu 18.04，您的结果将与我们的有显著差异。


    如果您遇到困难或事情不起作用，我们建议您休息一下，稍后头脑清醒地回到实验。那里有许多 Linux 支持论坛，您可以在那里提问，如果您也是 101labs.net
    的成员，当然也可以在我们的论坛上发帖。


    祝学习顺利。


    –Paul Browning, CCNP, MCSE


    ## 101 LABS–LINUX LPIC1 视频课程


    每本 101 Labs 图书都配有相应的视频培训课程。您可以观看讲师配置每个实验并逐步讲解整个过程，同时分享现实 IT 世界中有用的提示。每门课程还包含 200
    道考试风格的问题，为真实的考试做准备。使用此资源并非必要，但如果您使用，请在结账页面使用优惠码 ‘101lpic’ 以获得大幅折扣，作为对您购买此书的感谢。https://www.101labs.net


    ## 说明


    - 1. 请从头到尾遵循这些实验。如果您遇到困难，请做下一个实验，稍后再回到有问题的实验。随着您在配置软件和使用命令方面获得信心和经验的积累，您很有可能想出解决方案。

    - 2. 您可以按任何顺序进行实验，但我们已尽力在过程中逐步提高您的技能水平。为了获得最佳效果，在尝试考试之前，请将所有实验重复做几遍。

    - 3. www.101labs.net/resources 上有资源。

    - 4. 请勿在实时网络上或属于公司或个人的设备上配置这些实验。


