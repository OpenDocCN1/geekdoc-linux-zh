    Here, you’ve switched to a valid shell and changed the password for user bar,
    but then you used `chage` (change age) to set the account as expired, so you once
    again cannot log in.


    Sometimes you may want to lock a user’s password but not the account itself (preserving
    access for root, or for SSH keys, for example). You would do this with `sudo usermod
    -L bar`


    ## Task 4


    Finally, clean up:


    - `sudo userdel foo`

