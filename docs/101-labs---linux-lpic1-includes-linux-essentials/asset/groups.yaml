    Finally, clean up with `rm files.zip`


    # Task 3:


    Though ZIP is a common format and well-supported on Linux, it is not the main
    compression format Linux uses. That would be the classic gzip:


    ```

    gzip f*

    ls

    ```


    Wait a minute… why are there now nine gzipped files instead of just one? And what
    happened to the originals?


    This is why gzip is considered a *compression* format rather than an *archive*
    one. To create a single, easy-to-use archive file, we need a different tool...


    # Task 4:


    Run: `tar -cf files.tar.gz f*`


    Now, with the help of the *tar archiver*, you have your gzipped archive in files.tar.gz...
    well, sort of.


    Normally, with a gzipped tarball, you would be able to extract it with `tar xf
    files.tar.gz` and get all of the original files back. Instead, you could try that
    yourself now, and you would get the nine .gz files.


    There’s a better way. Let’s blow this up and start over:


    ```

    rm f*

    touch f1 f2 f3 f4 f5 f6 f7 f8 f9

    tar -czf archive.tar.gz f*

    tar --list -f archive.tar.gz

    ```


    Ta-da! Now you see a list of nine files within your single compressed tarball.


    # Task 5:


    gzip isn’t the only format you can use with tar:


    ```

    tar -cjf archive.tar.bz2 f*

    tar -cjf archive.tar.xz f*

    ```


    The bzip2 and XZ formats, respectively, are newer and use different algorithms
    from gzip, but the end result is the same. tar can extract all of its formats
    in the same way, simply by using `tar -xf filename`.'
