    ### # Introduction 101 Labs


    Welcome to your 101 Labs book.


    When I started teaching IT courses back in 2002, I was shocked to discover that
    most training manuals were almost exclusively dedicated to theoretical knowledge.
    Apart from a few examples of commands to use or configuration guidelines, you
    were left to plough through without ever knowing how to apply what you learned
    to live equipment or to the real world.


    Fast forward 17 years and little has changed. I still wonder how, when around
    50% of your exam marks are based on hands-on skills and knowledge, most books
    give little or no regard to equipping you with the skills you need to both pass
    the exam and then make money in your chosen career as a network, security, or
    cloud engineer (or whichever career path you choose).


    101 Labs is NOT a theory book: it''s here to transform what you have learned in
    your study guides into valuable skills you will be using from day one on your
    job as a network engineer. We don''t teach DHCP, for example; instead, we show
    you how to configure a DHCP server, which addresses you shouldn''t use, and which
    parameters you can allocate to hosts. If the protocol isn''t working, we show
    you what the probable cause is. Sound useful? We certainly hope so.


    We choose the most relevant parts of the exam syllabus and use free software or
    free trials (whenever possible) to walk you through configuration and troubleshooting
    commands step by step. As your confidence grows, we increase the difficulty level.
    If you want to be an exceptional network engineer, you can make your own labs
    up, add other technologies, try to break them, fix them, and do it all over again.


    –Paul Browning


    ## 101 LABS–LINUX LPIC-1: SYSTEM ADMINISTRATOR


    This book is designed to cement the theory you have read in your Linux LPIC-1
    study guide or video training course. If you haven’t studied any theory yet, then
    please check out our website https://www.howtonetwork.com, which also features
    practice exams.


    The goal of this book is to dramatically improve your hands-on skills and speed,
    enabling you to succeed in the practical portions of the Linux LPIC exams and
    also to transfer your skills to the real world as a Linux network engineer. We
    don’t have space here to cover theory at all, so please refer to your Linux LPIC
    study guide to get a good understanding of the learning points behind each lab.
    Every lab is designed to cover a particular theoretical issue, such as the configuration
    requirements of fdisk.


    If you want to become Linux LPIC-1 certified, you must pass two exams:


    - 101-500

    - 102-500


    The book actually starts with the Linux Essentials syllabus for labs 1 through
    25. If you wish to take this certification you can book the exam:


    - 010-160


    Please visit the LPIC website for information about the exam topics and booking
    details:

    https://www.lpic.org


    We’ve done our best to hit every syllabus topic mentioned in the exam syllabus
    on the Linux Professional Institute website. Please do check the syllabus on their
    website which may change. Their website also gives more details on the weighting
    given each subject area.


    It’s also worth noting that once we show you how to configure a certain service
    or protocol a few times, we stop walking you through the steps in subsequent labs—to
    save valuable space. Anyway, you can always flick back a few pages to see how
    it’s done.


    We’ve done our best to keep the topology as simple as possible, for this reason,
    almost all labs have been configured on a Ubuntu installation running on a virtual
    machine (with internet access). Please do check out our resources page, which
    will cover any additional information you need: https://www.101labs.com/resources


    ## DOING THE LABS


    Apart from a couple of research labs at the start, all of the labs are hands-on.
    They have been checked by several students as well as a senior Linux consultant
    so should be error-free. Bear in mind that each machine will differ so your output
    will differ from ours in many instances. If you use a distro other than Ubuntu
