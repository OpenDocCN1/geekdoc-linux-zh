    \ every file in the directory (non-recursively) and, if it passes *both* tests,\
    \ prints that file's name.\n\nExample:\n\n```bash\n./foo.sh ~/mydir -f -w\nmyfile\n\
    ```\n\nIn this example, the script is looking for files with ~/mydir that are\
    \ regular files with write permissions granted. myfile passes those tests.\n\n\
    All error conditions should print a friendly message and exit with status 1. For\
    \ example, if three arguments are not passed, or the passed directory doesn't\
    \ exist, or one of the *test* arguments is not valid. See **Answer 1** below for\
    \ one possible solution.\n\nFor an extra challenge, you might print all files,\
    \ but sort them according to how many tests they passed.\n\n### Answer 1:\n\n\
    ```bash\n#!/bin/bash\n\ntest $# -eq 3 || { echo \"Exactly three arguments are\
    \ required.\"; exit 1; }\ntest -d $1 || { echo \"Not a directory.\"; exit 1; }\n\
    files=$(ls $1 2>/dev/null) || { echo \"I can't read that directory.\"; exit 1;\
    \ }\n\nfor f in $files; do\n   test $2 $1/$f 2>/dev/null\n   rc1=$?\n   test $3\
    \ $1/$f 2>/dev/null\n   rc2=$?\n\n   test $rc1 -gt 1 && { echo \"First test argument\
    \ is invalid.\"; exit 1; }\n   test $rc2 -gt 1 && { echo \"Second test argument\
    \ is invalid.\"; exit 1; }\n   test $rc1 -eq 0 && test $rc2 -eq 0 && echo $f\n\
    done\n```\n\n### Notes:\n\nRemember that using */bin/sh* as an interpreter can\
    \ have different results from */bin/bash*! It is good to understand what makes\
    \ a *Bourne-compatible* shell, and what non-Bourne-compatible additions are available\
    \ in Bash.\n\n## LAB 69\nInstall and Configure X11\n\n**Lab Objective:**\nLearn\
    \ about the X11 window system and how to configure it.\n\n**Lab Purpose:**\nIn\
    \ this lab, you will explore various aspects of X11 configuration.\n\n**Lab Tool:**\n\
    Ubuntu 18.04 (or another distro of your choice), and a running X11 system. If\
    \ you aren't sure whether your system runs X11, test with `sudo ps -ef | egrep\
    \ -i x11\\xorg`\n\n**Lab Topology:**\nA single Linux machine, or virtual machine\n\
    \n**Lab Walkthrough:**\n\n***Task 1:***\nOpen the Terminal and attempt to look\
    \ at `/etc/X11/xorg.conf` or `/etc/X11/xorg.conf.d.` These paths may not exist—on\
    \ a default Ubuntu 18.04 VM install, they don't. If not, run `startx` and take\
    \ a look there instead—for example, in `/usr/share/X11/xorg.conf.d`. You are just\
    \ trying to view some example Xorg config files.\n\nA typical X11 config will\
    \ have one or more sections, each section dealing with a single device; for example,\
    \ a monitor, or a graphics card, or an input device. Within a section, a given\
    \ device may have several directives, like specifying a driver or various options\
    \ for the device.\n\nIf you are setting up Xorg on a new server, you can run `Xorg\
    \ -configure` to generate a new configuration. This is not recommended on a machine\
    \ of any importance, as it is easy to mess up. (Though a backup should be automatically\
    \ created.)\n"
  mdcn: "\n\n**任务 2：**\n通常你会使用 `alias` 来设置更简单的快捷方式（可以说，`mkhello` 甚至都有点太复杂了）。但如果你需要更复杂的功能怎么办？现在运行：\n\
    \n- function newdir { mkdir $1; pushd $1; ls -al; }\n- newdir foo\n- newdir bar\n\
    - newdir ~/baz\n\n这通过给 `mkdir` 添加一些“糖衣”（额外的便利功能）创建了 `newdir` 命令。与别名不同，函数可以直接使用参数。还有另一种更类似于\
    \ C 语言的方式来编写这个：\n\n```bash\nnewdir() { mkdir $1; pushd $1; ls -al; }\n```\n\n\
    **任务 3：**\n最后，清理环境：`cd ~; rm -r foo baz`\n\n**备注：**\n还有一个 shell 技巧是 `source`，或者\
    \ `.`（句点，在 Bash 中它是 `source` 的同义词）。你通常不会在交互模式下使用它，而是在脚本或 shell 初始化文件中从另一个文件读取命令。主要区别在于，`source`\
    \ 将这些命令读入*当前* shell，而不是启动一个新的 shell，这就是为什么通常不用于独立的脚本。\n\n## 实验 66\n自定义或编写简单脚本：标准语法\n\
    \n**实验目标：**\n学习特定于脚本设置的标准 shell 语法。\n\n**实验目的：**\n在本实验中，你将学习标准的 shell 脚本语法，例如测试和控制流。\n\
    \n**实验工具：**\nUbuntu 18.04（或你选择的任何其他发行版）\n\n**实验拓扑：**\n一台 Linux 机器，或虚拟机\n\n**实验操作指引：**\n\
    \n***任务 1：***\n通过终端打开你喜欢的编辑器，创建一个名为 lab66.sh 的文件：\n\n```bash\n#!/bin/sh\ni=0\n\
    while test $i -lt 5\ndo\n    echo $i\n    i=$((i+1))\ndone\n\nfor file in $(ls\
    \ /etc)\ndo\n    test -r /etc/$file && echo \"$file is readable by $USER.\"\n\
    \    test -s /etc/$file || echo \"$file has size zero!\"\n    if test -d /etc/$file\n\
    \    then\n        echo \"$file is a directory.\"\n    fi\ndone\n```\n\n这个高度人为构造且不太实用的脚本包含许多重要特性。第一个是\
    \ test，它可以根据其标志测试多种条件，并返回 0 或 1（真或假）的退出状态。该退出状态反过来可以被控制流语法使用——例如 if 语句，或 for 或\
    \ while 循环。一种更简单的 if 语句是 `&&` 或 `||` 语法，分别是布尔 'and' 或 'or'。\n\n如果你愿意，可以通过以下方式运行脚本来测试它：\n\
    \n- chmod +x lab66.sh\n- ./lab66.sh\n\n你应该看到打印出的数字 0–4，随后根据 /etc 目录中包含的内容，会有大量的文本输出。\n\
    \n### 备注\n\n这是一个比较罕见的情况，使用 /bin/sh 和 /bin/bash 作为解释器可能会产生不同的结果。Bash 有用于变量递增的 `((++var))`\
    \ 语法，这在标准的 Bourne shell 中是非标准的。`[[ ]]`（一种测试语法）和 C 风格的 for 循环语法也是如此：`for ((i=0;\
    \ i<5; i++))...`\n\n## 实验 67\n自定义或编写简单脚本：其他工具\n\n**实验目标：**\n学习更多实用的脚本命令，例如 `read`、`seq`\
    \ 和 `exec`。\n\n**实验目的：**\n在本实验中，你将学习如何使用 `read` 读取脚本输入，使用 `seq` 打印数字序列，以及使用 `exec`\
    \ 替换当前 shell。\n\n**实验工具：**\nUbuntu 18.04（或你选择的任何其他发行版）\n\n**实验拓扑：**\n一台 Linux\
    \ 机器，或虚拟机\n\n**实验操作指引：**\n\n*任务 1：*\n打开终端并运行：\n\n- `read -p \"What is your name?\
    \ \" name`\n- `<输入你的名字>`\n- `echo $name`\n\n这是 `read` 的一个简单用法，但也可以用来从文件描述符而不是标准输入中读取。更多信息请参阅\
    \ man 手册页。\n\n*任务 2：*\n`seq` 是另一个相当容易理解的命令。运行以下内容：\n\n- `seq 5`\n- `seq 3 5`\n\
    - `seq 0 2 5`\n- `seq 0 0.5 5`\n\n你应该看到数字 1-5、3-5、0-4（步长为 2）和 0-5（步长为 0.5）。\n\n\
    *任务 3：*\n*exec* 比前两个稍微复杂一些。它的行为取决于是否向其传递参数。\n\n如果传递了参数，它会像 'exec' 不存在一样执行这些命令，但会用新命令替换当前\
    \ shell。实际上，这意味着 shell 脚本中位于 *exec* 之后的任何命令都不会被执行（除非 *exec* 在子 shell 中运行）。\n\n\
    打开一个新的终端并运行 `exec ls`——你永远看不到输出，因为终端会先退出！\n\n如果不是参数，而是 *exec* 后面跟着重定向，那么该重定向将应用于脚本/shell\
    \ 的其余部分。例如，如果你打开一个新的终端并运行：\n\n- `exec > exec.log`\n- `echo \"Where is my echo?\"\
    `\n- `ls nonexistent`\n\n在你打开 exec.log 之前，你不会看到 *echo* 语句打印的任何内容，但你会看到来自 *ls*\
    \ 的错误消息。如果你运行 `exec 8> exec.log`，所有输出和错误都会发送到日志文件。\n\n### 备注\n\n*exec* 常用于包装脚本中。这些脚本可能会修改参数或简化另一个程序的运行。以这种方式使用时，包装脚本完成其处理过程，然后使用\
    \ *exec* 调用主程序，意味着它“退到一旁”。如果没有 *exec*，包装脚本将保持运行，占用资源，并可能让想要终止该进程的用户感到困惑。\n\n##\
    \ 实验 68\n自定义或编写简单脚本：脚本练习\n\n**实验目标：**\n利用你已有的知识，从零开始编写一个简单的 shell 脚本。\n\n**实验目的：**\n\
    使用 Bash 编写脚本是许多专业 Linux 管理员的日常任务。当一项任务是重复性的时，你不想一遍又一遍地输入相同的命令列表；你希望创建一个脚本，甚至可能安排该脚本自动运行。\n\
    \n**实验工具：**\nUbuntu 18.04（或你选择的任何其他发行版）\n\n**实验拓扑：**\n一台 Linux 机器，或虚拟机\n\n**实验操作指引：**\n\
    \n*任务 1：*\n打开终端应用程序并运行你喜欢的文本编辑器。\n\n如果你还没有这样做，可以参考实验 66 和 67。你的目标是编写一个接受三个参数的脚本——一个目录路径，以及两个传递给\
    \ *test* 的标志。该脚本应检查目录中的每个文件（非递归地），如果同时通过*两个*测试，则打印该文件的名称。\n\n示例：\n\n```bash\n\
    ./foo.sh ~/mydir -f -w\nmyfile\n```\n\n在这个例子中，脚本在 ~/mydir 中寻找是常规文件且授予了写权限的文件。myfile\
    \ 通过了这些测试。\n\n所有错误情况都应打印友好的消息并以状态 1 退出。例如，如果没有传递三个参数，或者传递的目录不存在，或者其中一个 *test*\
    \ 参数无效。请参见下方 **答案 1** 获取一种可能的解决方案。\n\n作为额外的挑战，你可以打印所有文件，但根据它们通过测试的数量进行排序。\n\n\
    ### 答案 1：\n\n```bash\n#!/bin/bash\n\ntest $# -eq 3 || { echo \"Exactly three arguments\
    \ are required.\"; exit 1; }\ntest -d $1 || { echo \"Not a directory.\"; exit\
    \ 1; }\nfiles=$(ls $1 2>/dev/null) || { echo \"I can't read that directory.\"\
    ; exit 1; }\n\nfor f in $files; do\n   test $2 $1/$f 2>/dev/null\n   rc1=$?\n\
    \   test $3 $1/$f 2>/dev/null\n   rc2=$?\n\n   test $rc1 -gt 1 && { echo \"First\
    \ test argument is invalid.\"; exit 1; }\n   test $rc2 -gt 1 && { echo \"Second\
    \ test argument is invalid.\"; exit 1; }\n   test $rc1 -eq 0 && test $rc2 -eq\
    \ 0 && echo $f\ndone\n```\n\n### 备注：\n\n请记住，使用 */bin/sh* 作为解释器可能会产生与 */bin/bash*\
    \ 不同的结果！了解使 *Bourne 兼容* shell 的特性，以及 Bash 中可用的非 Bourne 兼容附加功能是很重要的。\n\n## 实验 69\n\
    安装和配置 X11\n\n**实验目标：**\n学习 X11 窗口系统及其配置方法。\n\n**实验目的：**\n在本实验中，你将探索 X11 配置的各个方面。\n\
    \n**实验工具：**\nUbuntu 18.04（或你选择的任何其他发行版），以及一个正在运行的 X11 系统。如果你不确定你的系统是否运行 X11，请用\
    \ `sudo ps -ef | egrep -i x11\\xorg` 进行测试\n\n**实验拓扑：**\n一台 Linux 机器，或虚拟机\n\n**实验操作指引：**\n\
    \n***任务 1：***\n打开终端并尝试查看 `/etc/X11/xorg.conf` 或 `/etc/X11/xorg.conf.d.`。这些路径可能不存在——在默认的\
    \ Ubuntu 18.04 VM 安装中，它们并不存在。如果不存在，请运行 `startx` 并在那里查看——例如在 `/usr/share/X11/xorg.conf.d`。你只是试图查看一些示例\
    \ Xorg 配置文件。\n\n典型的 X11 配置将有一个或多个部分，每个部分处理单个设备；例如，监视器、图形卡或输入设备。在一个部分内，给定设备可能有多个指令，如指定驱动程序或设备各种选项。\n\
    \n如果你正在新服务器上设置 Xorg，可以运行 `Xorg -configure` 来生成新的配置。这不建议在重要的机器上使用，因为很容易搞乱。（不过应该会自动创建备份。）\n\
    \n"
