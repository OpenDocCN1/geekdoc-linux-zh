    \ TCP、UDP 或 UNIX 域套接字的任意客户端或服务器，并支持 IPv4 和 IPv6。\n\n# 实验 93\n\n# 基本网络故障排除：传统工具\n\
    \n实验目标：  \n学习如何使用 *net-tools* 排除 Linux 上的网络问题。\n\n实验目的：  \n在本实验中，你将体验一些经典的 Linux\
    \ 网络工具，它们是 *net-tools* 软件包的一部分。\n\n实验工具：  \nUbuntu 18.04（或你选择的其他发行版）\n\n实验拓扑：\
    \  \n一台单独的 Linux 机器或虚拟机\n\n实验步骤：\n\n任务 1：  \n首先，如果你尚未安装 *net-tools* 软件包，请安装它：\n\
    \n```\nsudo apt install net-tools\n```\n\n现在运行以下命令，以收集当前网络配置的信息：\n\n- `ifconfig\
