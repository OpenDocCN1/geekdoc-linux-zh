    ## LAB 22: Basic Security and Identifying User Types


    **Lab Objective:**

    Learn how to identify the differences between the root user, standard users, and
    system users.


    **Lab Purpose:**

    In this lab, you will learn about the different types of Linux users and a few
    tools to identify and audit them.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1

    Open the Terminal and run: `cat /etc/passwd`


    This file is an inventory of all users on your system. The passwd file is a database
    with seven fields, separated by colons:


    - Username

    - Encrypted password (in practice, hardly ever used—see below)

    - User ID

    - Group ID

    - Comment

    - Home directory

    - Default shell


    Take note of the *root* user, which should be listed on the first line. This is
    the administrative user, and is the only user that can unconditionally do anything
    on the system. By running a command preceded with `sudo`, you are running that
    command as the root user. (You can also use `sudo -i` or `su` to access a root
    shell directly.)


    If you look at the user IDs, you will notice that most of them, on a default system,
    are below 1000. These are `system` users, typically used to run specific services,
    rather than running those as root, which can create security problems. On most
    systems, human user ID''s begin at 1000 or 500.


    You can easily see the `passwd` information for your own user with: `grep ^$USER
    /etc/passwd`


    ### Task 2


    Now run: `sudo cat /etc/shadow`


    The `shadow` file is a sensitive database containing hashed user passwords, among
    other information. Be careful with the contents of this file! It contains nine
    fields, again, separated by colons—however, on a default Ubuntu install, only
    the first three are likely to be significant:


    - Username

    - Encrypted password

    - Date of last password change


    The other fields contain information like account expiration dates and minimum/maximum
    password ages, which are not configured on a default system. See `man 5 shadow`
    for more information.


    You can see this information for your own user with: `sudo grep ^$USER /etc/shadow`


    ### Task 3


    Now run: `cat /etc/group`


    As you might expect, this is a database of all groups on the system. It contains
    four fields separated by colons:


    - Group name

    - Encrypted group password

    - Group ID

    - List of users who are members


    Run `groups` to learn which groups your user has membership in. You can get more
    information, including group ID''s, with the `id` command.


    ### Task 4


    Finally, a few commands you can use to audit user logins:


    - `who`

    - `w`

    - `last`

    - `last $USER` # For your own user


    ### Notes


    In the next lab, you will learn how to add regular users and system users. In
    practice, you will rarely need to add system users manually—these are typically
    added along with the services that use them.


    ## LAB 23: Creating Users and Groups


    **Lab Objective:**

    Learn how to create and customize users and groups.


    **Lab Purpose:**

    In this lab, you will learn how to create users and groups, as well as set their
    passwords.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1

    Open the Terminal and run:


    ```

    sudo sh -c ''echo "Hello World" > /etc/skel/hello.txt''

    ```


    Here, you are adding a file to the `/etc/skel` directory, which determines the
    default files in a new user''s home directory.


    Now:


    - `sudo useradd -m foo`

    - `sudo cat ~/foo/hello.txt`


    You should see the output "Hello World". What happened is that you created a new
    user, called foo (using the `-m` switch to ensure a home directory was created).
    Every file in `/etc/skel` was then copied to the new user''s home directory.


    Finally, set an initial password for this user with: `sudo passwd foo`


    ### Task 2


    Now let''s add a system user. Run: `sudo useradd -r bar`


    When adding a system user, `useradd` does not add any account or password aging
    information, and sets a user ID appropriate for a system user (typically below
    1000). It also does not create a home directory unless you specify `-m`.


    ### Task 3


    Now let''s create a group and add our new users to it:


    - `sudo groupadd baz`

    - `sudo usermod -a -G baz foo`

    - `sudo usermod -a -G baz bar`


    Verify that the users were added with: `grep ^baz /etc/group`


    ### Task 4


    Finally, clean up:


    - `sudo rm /etc/skel/hello.txt`

    - `sudo userdel foo`

    - `sudo userdel bar`

    - `sudo groupdel baz`

    - `sudo rm -r /home/foo`


    ### Notes


    `usermod` is a very useful command for managing users. In addition to adding and
    removing users from groups, it allows you to manage account/password expirations
    and other security features.


    ## LAB 24: Managing File Permissions and Ownership


    **Lab Objective:**

    Learn how to manipulate file permissions and ownership settings.


    **Lab Purpose:**

    In this lab, you will learn to use `chmod` and `chown`, as well as view permissions
    and ownership settings with `ls`.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    Open the Terminal and run (you may need to add the user ''foo'' if you removed
    it on the last lab):


    ```

    echo "Hello World" > foo

    ls -l foo

    ```


    Look at the first field; you should see `-rw-r--r--`.


    This indicates the user, group, and other permissions. The last nine characters,
    in groups of three, denote these permissions. In this instance:


    - `rw-` indicates read/write (but not execute) permissions for the user who owns
    the file

    - `r--` indicates read-only permissions for the group that owns the file

    - `r--` indicates read-only permissions for all non-owners, a.k.a. "world"


    The first character indicates the type of file. In this case, it is a regular
    file; directories begin with `d`.


    Who are the user and group owners of this file? The third and fourth fields of
    `ls -l` tell us that. By default, it should be your own user and primary group.


    ### Task 2


    Now run:


    - `sudo chown root foo`

    - `ls -l foo`

    - `cat foo`


    You''ve just changed the user ownership to root, while keeping the group ownership.
    As the file has group- and world-read permissions, you can still see its contents.


    ### Task 3


    Now run:


    - `sudo chmod o-r foo`

    - `ls -l foo`

    - `cat foo`


    That `chmod` command removes read permissions from other. However, as you still
    have group ownership, you can still see the file''s contents.


    ### Task 4


    Now run:


    - `sudo chmod 600 foo`

    - `ls -l foo`

    - `cat foo`


    This `chmod` command sets the permissions explicitly, to read-write for the owning
    user only. As that is root, we can no longer read the file.


    ### Task 5


    Finally, clean up with `sudo rm foo`


    ### Notes


    Execute permissions come into play on executable files as well as directories.
    If a user/group cannot "execute" a directory, it cannot view the contents of said
    directory or any subdirectories.

