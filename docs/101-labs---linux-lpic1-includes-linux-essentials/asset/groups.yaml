    a higher level, pointing directly to a file or directory name.) You can see the
    inode number with `ls -i`, or see how many hard links share a given file''s inode
    in the second column of `ls -l`


    ## LAB 63


    ## Find System Files and Place Files in the Correct Location


    **Lab Objective:**

    Learn how to locate files on a Linux system.


    **Lab Purpose:**

    In this lab, you will learn multiple ways of locating files on a system, in accordance
    with the Filesystem Hierarchy Standard (FHS).


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    In previous labs, you''ve worked with `find`, a tool which can find files fitting
    a certain specification and even execute commands on those files. `find` is great
    for a limited scope, but becomes unwieldy when you don''t actually know where
    a given file is located, because then it has to search the entire filesystem!
    There''s another way. Open the Terminal and run:


    ```bash

    sudo updatedb

    locate updatedb.conf

    ```


    As you might guess, `locate` operates from a database which is updated by `updatedb`.
    The `updatedb` command may take a couple of minutes, but once it''s done, every
    subsequent `locate` will be very fast.


    Here, you should have found two files: One is the actual `updatedb` config file,
    and the other is the man page. You can investigate these now if you like:


    ```bash

    cat /etc/updatedb.conf

    man 5 updatedb.conf

    ```


    The updatedb.conf file should include a directive to prune paths like /tmp/ and
    /media, among others. Given what you know about the FHS: Why do you think it''s
    a good idea to prune these paths from the locate database? Why is it a good idea
    to prune filesystem types like nfs and proc?


    ### Task 2


    Now run:


    ```bash

    which which

    which locate

    whereis locate

    whereis updatedb

    whereis whereis

    ```


    `which` shows you the absolute location of a given (relative) command, while `whereis`
    expands on this by showing other related files like config files, databases, and
    man pages.


    ### Notes


    Many common Linux tools are fairly complicated C programs; which is one exception.
    It is a short shell script which, with a bit of practice, you could understand
    in its entirety. Take a look at the /bin/which file and see how much of it makes
    sense to you!


