    \n101 Labs 是注册商标。\n\n## 版权声明\n\n版权所有 2019 Paul Browning，保留所有权利。未经出版商书面许可，不得以机械、电子或任何其他手段（包括复印）复制本书的任何部分。\n\
    \nhttps://www.101labs.net\n\nISBN: 978-0-9928239-1-7\n\n由 Reality Press Ltd. 出版。\n\
    \n## 法律免责声明\n\n本书中的建议旨在帮助您达到 LPIC-1：系统管理员的标准。LPIC-1 将验证候选人在命令行执行维护任务、安装和配置运行 Linux\
    \ 的计算机以及配置基本网络的能力。在执行更复杂的操作之前，建议寻求专家建议。\n\n本书中的实际场景仅用于说明技术要点，并且只能用于您私有拥有的设备上，切勿用于在线网络。\n\
    \n## 作者简介\n\n### Paul Browning\n\nPaul Browning 在英国担任警察 12 年，之后转行成为帮助台技术员。他通过了多项\
    \ IT 认证，并开始在 Cisco Systems 工作，为大型企业客户支持 WAN。\n\n![](img/64f3c5d0defa97e8b856b229f9322b97_4_0.png)\n\
    \n他于 2002 年创办了一家 IT 咨询公司，帮助设计、安装、配置和故障排除从小型到大型公司的全球网络。随后不久，他开始教授 IT 课程，并通过他的课堂教学、在线培训和指导书帮助数万人通过\
    \ IT 考试并在 IT 行业享受成功的职业生涯。\n\n2006 年，Paul 创办了在线 IT 培训门户 www.howtonetwork.com，该网站已发展成为领先的\
    \ IT 认证网站之一。\n\n2013 年，Paul 与家人搬到了布里斯班。他的业余时间弹吉他、阅读、喝咖啡，并练习巴西柔术。\n\n### Arturo\
    \ Norberto Baldo\n\n![](img/64f3c5d0defa97e8b856b229f9322b97_4_1.png)\n\nArturo\
    \ Norberto Baldo 负责本书的技术编辑工作。他是 Linux 爱好者，AS26218 的网络工程师，自 2012 年起担任自由 IT 顾问，也是\
    \ ISOC 和 IETF 成员。他拥有无法在此一一列举的众多认证。他支持的技术包括 VMware ESXi、Vcenter、Veeam Backup And\
    \ Replication、Spiceworks、osTicket、Active Directory、Windows 服务器、Debian 和 Ubuntu\
    \ 服务器、Web 托管面板、视频监控系统（如 Bosch BVMS、Genetec、Digifort 和 Milestone 等）以及其他技术。\n\n\
    他曾在多家大型公司担任网络工程师、系统管理员和安全专家。他拥有技术理学士学位（B.Tech.）和技术理硕士学位（M.Tech.）。业余时间他喜欢阅读和骑自行车。\n\
    \n由 Internet Archive 于 2023 年数字化，资金来自 No Sponsor\n\nhttps://archive.org/details/isbn_9780992823917\n\
