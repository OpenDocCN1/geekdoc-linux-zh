    # LAB 75


    # Automate System Administration Tasks by Scheduling Jobs: Cron


    **Lab Objective:**

    Learn how to use cron utilities to schedule automated system tasks.


    **Lab Purpose:**

    In this lab, you will manage automated system tasks using the classic cron utilities.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    ***Task 1:***

    Open the Terminal and run: cat /etc/crontab


    In this file, you will likely see a few rows of commands to be run at certain
    times. The first five columns designate the minute, hour, day-of-month, month,
    and day-of-year, respectively, for a given job to be run. Then you will see the
    user (usually root) and, finally, the actual command. See man 5 crontab for a
    full description of crontab format.


    On a default Ubuntu installation, /etc/crontab should contain “meta” commands
    to run cron jobs from other files—/etc/cron.hourly, /etc/cron.daily, and so forth.
    Look at these next:


    ```

    ls /etc/cron.{hourly,daily,weekly,monthly,d}

    ```


    As you might guess, these directories hold jobs to be run hourly, daily, weekly,
    monthly, or on some other interval. Inspect a few files to see what jobs are run
    periodically on your system.'
  - '[PAGE 207]


    On some systems, a user-based crontab is used. In this case, `run crontab -l`
    and `sudo crontab -l` to view the jobs. These jobs are stored in /var/spool/cron/crontabs.


    # Task 2:


    Run `crontab -e` and add a cron job for your user:


    ```

    `* * * * * date > ~/foo`

    ```


    Then: `sleep 60 && cat ~/foo`


    You should see that your cron job has run (every minute) and printed the date
    into file foo. Clean up with `crontab -e`, delete the line you added, and `rm
    foo`


    # Notes:


    /etc/cron.allow and /etc/cron.deny control user access to `crontab`. On a default
    Ubuntu system, these files may not exist—according to the man page, that means
    only root should have access to `crontab`, but default system configuration allows
    *all* users access. See `man crontab` to understand how these files work.'
