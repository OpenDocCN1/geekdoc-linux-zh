  - "[PAGE 221]\n\nYou might see directives here like `rotate 12` (keep for 12 weeks\
    \ instead of 4, or 12 months if it includes *monthly*), `compress` to compress\
    \ the archives, or `notifempty` to ignore the log if it is empty.\n\nSee `man\
    \ logrotate` for more details.\n\n*Task 2:*\n\nNow, with `sudo` (or `sudoedit`),\
    \ open a text editor and create a file called `/etc/logrotate.d/mylog` with the\
    \ following contents:\n\n```\n/var/log/mylog.log {\n    hourly\n    su root syslog\n\
    \    rotate 2\n    create\n    compress\n    missingok\n}\n```\n\n*Then:* `sudo\
    \ touch /var/log/mylog.log`\n\nNormally you'd have to wait at least an hour to\
    \ see any rotation happen, but you can force the situation with the `-f` switch.\
    \ Run:\n\n+   -   `sudo logrotate -fv /etc/logrotate.d/mylog`\n+   -   `ls -al\
    \ /var/log/mylog*`\n\nYou should see a compressed archive of the original file,\
    \ as `mylog.log.1.gz`, and a new log called `mylog.log`. Run that first command\
    \ twice more. The second time you run it will create a second archive file, but\
    \ on the third run you should see a line at the bottom saying “removing old log\
    \ /var/log/mylog.log.3.gz”, as per the configuration file.\n\n*Task 3:*\n\n*Finally,\
    \ clean up:* `sudo rm /etc/logrotate.d/mylog /var/log/mylog*`\n\n*Notes:*\n\n\
    *Typically*, `logrotate` is run via a daily cron job. Can you find where this\
    \ cron job is configured on your system? (Hint: See Lab 75!)"
