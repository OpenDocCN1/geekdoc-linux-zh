    # LAB 95


    # Configure Client-Side DNS: systemd-resolved


    **Lab Objective:**

    Learn how to use Systemd utilities to configure client-side DNS.


    **Lab Purpose:**

    In this lab you will work with Systemd to configure and troubleshoot DNS resolution.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `systemd-resolve --status`


    This is another, Systemd-friendly way of getting your DNS servers, along with
    some other information. Hold onto those nameserver addresses for below.


    Most likely your DNS servers will be listed as local, under your main network
    interface, rather than global. You can edit the global nameservers this way:


    +   - Add a line like `DNS=1.2.3.4 5.6.7.8` to `/etc/systemd/resolved.conf`

    +   - Run: `sudo systemctl restart systemd-resolved`


    But in this case, you can also just change the DNS servers attached to the current
    interface (which you should identify the name of above, e.g. enp0s3):


    ```

    systemd-resolve --set-dns=1.2.3.4 --set-dns=5.6.7.8

    --interface=[interface]

    ```'
  - '[PAGE 249]


    Now, if you type that command as-is, your DNS will break, because, of course,
    those addresses aren’t real DNS servers. You can substitute the IP addresses for
    real public nameservers if you like.


    In either case, you’ll probably want to switch back to what you had before:


    ```

    systemd-resolve --set-dns=[dns1] --set-dns=[dns2] --interface=[interface]

    ```


    Notes: `systemd-resolve` can also be used to make DNS queries a la `dig`, but
    its options for this are much more limited.'
  - "[PAGE 250]\n\n# LAB 96\n\n# Perform Security Administration Tasks: User Auditing\n\
    \n**Lab Objective:**  \nLearn how to manage and audit users and user restrictions.\n\
    \n**Lab Purpose:**  \nIn this lab, you will review a variety of tools used to\
    \ manage users and maintain security through limitations on their privileges.\n\
    \n**Lab Tool:**  \nUbuntu 18.04 (or another distro of your choice)\n\n**Lab Topology:**\
    \  \nA single Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\n*Task\
    \ 1:*  \nThroughout most of these labs, you've used `sudo` to grant yourself root\
    \ privileges for certain tasks. Now, it's finally time to learn how to configure\
    \ it:\n\n+   - `sudo useradd luser`\n+   - `sudo visudo`\n+   - Under the \"User\
    \ privilege specification\",add the following line:\n+       ```\n+       luser\
    \            ALL=NOPASSWD:/usr/sbin/useradd\n+       ```\n+   - `sudo su luser`\n\
    +   - `sudo useradd luser2`\n+   - `exit`\n\nIn this sequence, you edited the\
    \ `/etc/sudoers` configuration file safely with `visudo` (which you should always\
    \ do—a syntax error in the sudoers file can lock you out of your own system!)\
    \ The addition means that the 'luser' user can run `useradd` as root, without\
    \ being prompted for a password. \"ALL\" here means that it can be run on \"ALL\"\
    \ systems, which in this case is only one, since you aren't connected to a NIS\
    \ domain."
  - '[PAGE 251]


    After switching to *luser*, you should have been able to add another user seamlessly,
    without being prompted. If you tried any other `sudo` command, you would be prompted
    for a password and the command would fail altogether.


    # *Task 2:*


    Now run (the first command should all be on one line):


    +   • `sudo sh -c ''echo "luser hard nproc 2" >> /etc/security/limits.conf''`

    +   • `sudo su luser`

    +   • `ulimit -a`

    +   • `sleep 10000 &`

    +   • `sleep 10000 &`

    +   • `exit`


    Attempting to run the second `sleep`, you should have been greeted with a mysterious
    error about “Cannot fork”. What''s going on here? Your first command applied a
    limit of 2 user processes to the ''luser'' user. The shell counts as one process,
    which means luser can''t do a whole lot after that! This is why the first `sleep`
    was successful while the second one failed.


    Remove the process limit from luser in `/etc/security/limits.conf` before moving
    on.


    # *Task 3:*


    Now, a few commands to audit user activity and logins:


    +   • `who -a`

    +   • `w`

    +   • `lastlog`


    # *Task 4:*


    Finally, clean up:


    +   • Run `sudo visudo` and delete the ''luser'' line that you added

    +   • `sudo userdel luser`

    +   • `sudo userdel luser2`


    Notes:


    See Lab 74 for more information on how to restrict user password validity and
    other similar features. If you are unable to delete user “luser” at the end of
    the lab, because the user is still used by a process, you can find the PID being
    called to kill. luser needs to log out before deletion.'
  - "[PAGE 252]\n\n# LAB 97\n\n# Perform Security Administration Tasks: System Auditing\n\
    \n**Lab Objective:**  \nLearn how to manage and audit ports, processes, and other\
    \ system aspects.\n\n**Lab Purpose:**  \nIn this lab, you will review a variety\
    \ of tools used to manage services, ports, file permissions, and other features\
    \ to maintain a secure Linux system.\n\n**Lab Tool:**  \nUbuntu 18.04 (or another\
    \ distro of your choice)\n\n**Lab Topology:**  \nA single Linux machine, or virtual\
    \ machine\n\n# Lab Walkthrough:\n\n# *Task 1:*  \nOpen the Terminal and run:\n\
    \n```\nsudo find / -perm /u+s,g=s -type f -exec ls -l {} \\; 2>/dev/null\n```\n\
    \nThat's a hairy command, so let's break it down. Here, you're finding all files\
    \ on the system with either the setuid or setgid bits set (or both), which are\
    \ regular files (and not directories) or some other special file). Then you execute\
    \ `ls -l` on each of those files. The `2>/dev/null` is just to silence some spurious\
    \ errors about special filesystems like /proc.\n\nThe end result should be a detailed\
    \ list of possibly “insecure” files on your system—files which are run with their\
    \ owner and/or group permissions instead of the permissions of the user who executed\
    \ them."
  - '[PAGE 253]


    # Task 2:


    In previous labs, you''ve used `ss` to list open ports. However, there are other
    approaches.

    Install the nmap port scanner: `sudo apt install nmap`


    Now run a standard nmap scan: `sudo nmap -v -sU -sS -p1-65535 localhost`


    This command may take quite some time. It will run a standard UDP and TCP SYN
    scan of every port on your system. An nmap scan, when run from a remote host (which
    you did not do here), is a great way to get a look at open ports on your system
    from an outside perspective.


    # Notes:


    `fuser` and `lsof` are two tools which can be used to link files and processes,
    but they work differently. `fuser` is handier to answer the question of "Which
    process opened this file?", while `lsof` would be better to answer "Which files
    did this process open?"'
  - '[PAGE 254]


    # LAB 98

    Setup Host Security: User Security


    **Lab Objective:**

    Learn how to use login-related features to secure a Linux host.


    **Lab Purpose:**

    In this lab you will review shadow passwords and login restriction features to
    secure a Linux host.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**

    We''ve discussed the `/etc/shadow` file in previous labs, but now we''re going
    to take a closer look at it. The second field in a given shadow file entry is
    the password, obfuscated by a one-way hashing algorithm. Most users are probably
    system users and thus don''t have passwords, but at least your user should.


    Take a look at `man 3 crypt`—this is how those hashes are created. The man page
    notes that a hash is split into 3 sections, delimited by dollar signs. The first
    is an ID denoting the encryption method. Look at your shadow hash again—what is
    the ID number in the first field? If it''s a 6, then your password is hashed with
    SHA-512 and you''re in good shape. If it''s a 5, your hash is SHA-256—not the
    best, but still pretty good. A password hash beginning with a 1 is MD5, and only
    likely if the hash was copied from an older system. (If you have any hashes like
    that, you should run `passwd` for those users to change them.)'
  - '[PAGE 255]


    # Task 2:


    Now run: man 5 nologin


    The /etc/nologin file, which disallows non-root logins and shows those users a
    message of whatever is in the file, is great for putting a system into emergency
    maintenance. Aside from that, you probably don’t want it to be present!


    Notes:


    cracklib is a password-cracking library that can be used with tools like shadow
    and PAM to enforce secure password practices.'
