    # Configure Client-Side DNS: dnsutils


    **Lab Objective:**

    Learn how to use classic Linux utilities to configure client-side DNS.


    **Lab Purpose:**

    In this lab you will work with classic tools such as `dig` to configure and troubleshoot
    DNS resolution.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    In ye olden days, one could just `cat /etc/hosts /etc/resolv.conf` and gather
    all the DNS information one needed. This is, sadly, no longer true. Instead, run
    `nmcli` to find out what your current DNS servers are (see “DNS configuration”
    near the bottom), then save these for later. You probably have two nameservers,
    which will be referred to as [dns1] and [dns2] below.


    *Task 2:*

    Now you will experiment with `dig`, one of the most common and useful DNS troubleshooting
    utilities:


    +   * `dig 101labs.net`

    +   * `dig 101labs.net MX +short`

    +   * `dig CNAME www.101labs.net [dns1]`

    +   * `dig AAAA example.com [dns2] +short`'
  - '[PAGE 247]


    There are many more options available, most of which you will probably never need--but,
    as always, the man page is worth a skim.


    # Task 3:


    Not to be outdone, host can do many of the same things that dig can:


    +   - host -v -t A 1011abs.net

    +   - host -t MX 1011abs.net

    +   - host -v -t CNAME www.1011abs.net [dns1]

    +   - host -t AAAA example.com [dns2]


    See the similarities?


    # Task 4:


    By default, Ubuntu 18.04 uses a local caching nameserver. If you run a non-recursive
    query on this (with the dig option +norecurse), it will come up empty:


    ```

    dig 1011abs.net +norecurse 127.0.0.53

    ```


    Run this on one of your main nameservers and it will work.


    # Notes:


    resolvconf is a tool that was previously used in Ubuntu to manage resolv.conf.
    No longer installed by default, it seems to have been superseded by systemd-resolved.


    For some users, the dig and host commands for the AAAA record required ‘www’ before
    the “example” address.'
