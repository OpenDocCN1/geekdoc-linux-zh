    # # About the Authors


    # ## Paul Browning


    Paul Browning worked as a police officer in the UK for 12 years before changing
    careers and becoming a helpdesk technician. He passed several IT certifications
    and began working for Cisco Systems doing WAN support for large enterprise customers.


    ![](img/64f3c5d0defa97e8b856b229f9322b97_4_0.png)


    He started an IT consulting company in 2002 and helped to design, install, configure,
    and troubleshoot global networks for small to large companies. He started teaching
    IT courses soon after that and through his classroom courses, online training,
    and study guides has helped tens of thousands of people pass their IT exams and
    enjoy successful careers in the IT industry.


    In 2006 Paul started the online IT training portal www.howtonetwork.com, which
    has grown to become one of the leading IT certification websites.


    In 2013 Paul moved to Brisbane with his family. In his spare time he plays the
    guitar, reads, drinks coffee, and practices Brazilian jiu-jitsu.


    # ## Arturo Norberto Baldo


    ![](img/64f3c5d0defa97e8b856b229f9322b97_4_1.png)


    Arturo Norberto Baldo did the technical edit on this book. He is a Linux enthusiast,
    network engineer at AS26218 and has been a freelance IT consultant since 2012,
    ISOC and IETF member. He holds too many certifications to list here. He supports
    technologies including VMware ESXi, Vcenter, Veeam Backup And Replication, Spiceworks,
    osTicket, Active Directory, Windows Servers, Debian and Ubuntu Servers, Web Hosting
    Panels, Video surveillance systems: Bosch BVMS, Genetec, Digifort and Mileston
    and others.


    He has worked as a network engineer, systems administrator and security specialist
    for several large companies. He holds a Bachelor of Technology (B.Tech.) and Master
    of Technology (M.Tech.). He likes to read and cycle in his spare time.'
