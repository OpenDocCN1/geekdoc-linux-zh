    ## LAB 83: System Logging: Journald


    **Lab Objective:**

    Learn how to manage and read data from `journald`, the Systemd logger.


    **Lab Purpose:**

    In this lab, you will get to know `journald`, the Systemd logging system that
    is slowly replacing classic `syslog` variants in most Linux distros.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    Open two Terminal windows/tabs.


    In the first one, run: `journalctl -f`


    In the second one, run: `systemd-cat echo "Hello World"`


    Now go back to the first tab. Did your friendly message show up in the system
    logs? Hit Ctrl+C to exit.


    `systemd-cat` is a convenient tool, like `logger`, that can send output directly
    to the `journald` logs.


    ### Task 2


    Now look at the configuration: `cat /etc/systemd/journald.conf`


    On a default Ubuntu 18.04 system, you will probably see... a lot of commented-out
    lines. This is just the default configuration, which can still tell you a lot.
    You can learn the meaning of these options from `man journald.conf`, which is
    conveniently laid out in the same order as the config file.


    Use the two tabs from Task 1, or open a second tab if necessary. In the first
    tab, run `tty`, then save the value it prints out for later.


    In the second tab, open /etc/systemd/journald.conf for editing as root (via `sudo`
    or `sudoedit`). Append these two lines to the bottom of the file:


    ```text

    ForwardToConsole=yes

    TTYPath=[tty]

    ```


    ... where `[tty]` is the value printed by `tty` in the other tab. Save and quit
    the editor, then run:


    - `sudo systemctl restart systemd-journald`

    - `systemd-cat echo "Hello World"`


    Now look back at the first tab again. You should see logs being printed directly
    to your console! This can be useful for monitoring system logs, generally, without
    having to keep a process running.


    ### Task 3


    Clean up:


    - Edit /etc/systemd/journald.conf again and delete the two lines you added

    - Run `sudo systemctl restart systemd-journald`


    **Notes:**


    When stored persistently on the disk (which is typically what you want to do,
    as opposed to only storing logs in memory), `journald` logs are stored in /var/log/journal.
    If you try to read these files, however, you will quickly notice that they are
    not the text logs you may be used to! Somewhat inconveniently, `journald` stores
    its logs in a binary format which is only readable by systemd-related tools.


    ## LAB 84: Mail Transfer Agent (MTA) Basics: Aliases and Forwarding


    **Lab Objective:**

    Learn how to perform basic mail forwarding and alias configuration.


    **Lab Purpose:**

    In this lab, you will experiment with the Postfix MTA to learn about aliases and
    mail forwarding.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    First, install Postfix: `sudo apt install postfix mailutils`


    On Ubuntu, you will be prompted to ask how you want to configure Postfix initially.
    Choose the "Local only" option, and leave any other options as the default.


    You’ve set up a mail server that is meant only to deliver messages to other local
    users. This means that in the rest of this lab, where you might normally see an
    e-mail address (formatted@like this.com), you will see only a username.


    ### Task 2


    Now run `cat /etc/aliases`


    This is a system-wide alias list for the purpose of mail redirection. Right now
    the file probably only has one line, which tells Postfix that mail to ‘postmaster’
    should go to root.


    Add your own aliases:


    - `sudo USER=$USER sh -c ''echo "mymail: $USER" >> /etc/aliases''`

    - `sudo newaliases`


    The aliases are stored in a database, which `newaliases` refreshes. Now you can
    send a message to the ''mymail'' user and have it forwarded to you: `echo "Hello
    World" | sendmail mymail`


    You might be wondering what `sendmail` is doing there. Sendmail was one of the
    first Linux MTAs, woven into the early fabric of the internet—but that is not
    the MTA you installed above. Because Sendmail was so central to e-mail on Linux
    for many years, most major open-source MTAs, including Postfix, have an emulation
    layer for it.


    ### Task 3


    Now, confirm that you received the message sent to ''mymail'':


    - Run: `mail`

    - You will see your inbox, in text format. Ideally, the message you sent is the
    first one, but it doesn''t really matter. Enter `1` to read the first message
    in your inbox (including the headers, which you might not normally see—don''t
    be thrown off by this).

    - When you''re done, enter `q` to quit.


    ### Task 4


    In addition to system-wide mail forwarding, a user can control their own mail
    forwarding by adding a .forward file to their home directory. Try it yourself:


    - `echo root > ~/.forward`

    - `echo "Forwarding enabled" | mail -s "A forwarded message" mymail`

    - `mail`

    - `sudo mail`


    If you did it correctly, the first `mail` command should print "No mail for [username]";
    or at least show an inbox without the message you just sent. root''s inbox should
    show the message instead.


    ### Task 5


    Finally, clean up:


    - `rm ~/.forward`

    - `sudo sed -i ''/mymail:/d'' /etc/aliases`

    - `sudo newaliases`


    **Notes:**


    You might find the `mail` command''s inbox a bit hard to navigate. This is, of
    course, why people install and use their own mail clients. Even on the Linux command
    line, you would typically use something like `mutt` or `alpine`.


    ## LAB 85: Mail Transfer Agent (MTA) Basics: Other MTAs


    **Lab Objective:**

    Learn about other major MTAs, like Sendmail and Exim.


    **Lab Purpose:**

    In this lab, you will experiment with MTAs other than Postfix (which was featured
    in Lab 84).


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    First, install Exim: `sudo apt install exim4`


    Like Postfix, Exim also has an emulation layer for the classic Sendmail. If you
    check the man pages for commands like `newaliases` or `mailq`, you will instead
    see the man page for `exim4`.


    You can do all of the things with Exim that you did in Lab 84, including aliases
    and sending mail with `sendmail`. (The `mail` command is actually part of a different
    package, `mailutils`.)


    ### Task 2


    Now, install the venerable Sendmail: `sudo apt install sendmail-bin sendmail`


    This is the classic MTA, so it doesn’t have an emulation layer… though it may
    feel like it does, just because of how long some commands can take. (Compare the
    run time, for instance, of `newaliases` under Sendmail vs. under Postfix.)


    ### Task 3


    Finally, take the most important step you will take in this lab, by removing Sendmail.
    Sendmail has a well-deserved reputation for security problems, so even on a lab
    machine, it''s best not to keep around longer than necessary:


    - `sudo apt remove sendmail-bin sendmail`

    - `sudo apt autoremove`


    **Notes:**


    Another thing you can do with aliases is forward mail to a file, rather than another
    user. However, Exim doesn''t allow this by default—you''d have to wade into the
    configurations to do so.


    ## LAB 86: Manage Printers and Printing


    **Lab Objective:**

    Learn how to manage print jobs using CUPS.


    **Lab Purpose:**

    In this lab, you will learn about managing print queues and jobs using CUPS and
    the LPD compatibility interface.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1


    To eliminate variability around printer hardware and all the problems it brings
    (and in case you don''t have a printer handy), this lab will assume printing to
    a PDF file instead. If you would like to print to a real printer, ignore this
    step. Otherwise, run `sudo apt install printer-driver-cups-pdf` (you may have
    to run `apt-get update --fix-missing` in order to install `cups-pdf` correctly).


    Verify with `ls -l /var/spool/cups`—you should see "device for PDF: cups-pdf:"
    as part of the output. Or, if you plug in a real printer, it should be auto-detected.
    (If not, then it would be easier to print to PDF for the purposes of this lab.)


    Finally, check where your files should be printed: `grep "OutputFile" /etc/cups/cups-pdf.conf`.


    You may see something like `${HOME}/PDF` as the directory where your “printed”
    files will end up. You can change this if you like; if you do, finalize it with
    `sudo systemctl restart cups`

