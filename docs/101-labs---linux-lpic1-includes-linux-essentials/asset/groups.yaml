    ## 实验 48

    ### 创建、监控和终止进程：前台和后台任务


    **实验目标：**

    学习如何在前台和后台运行任务。


    **实验目的：**

    有时，你希望在 Linux 中运行一个进程，然后离开，或者将任务隐藏在后台，这样你就看不到它了。在本实验中，你将学习如何做到这一点。


    **实验工具：**

    Ubuntu 18.04（或你选择的其他发行版）


    **实验拓扑：**

    单台 Linux 机器或虚拟机


    **实验步骤：**


    #### 任务 1

    打开终端并运行 `sleep 10000`，然后按 Ctrl+Z。现在运行：


    - `jobs`

    - `bg`

    - `jobs`

    - `fg`


    按 Ctrl+C 取消 sleep 任务。


    当你最初运行 `sleep` 命令并按下 Ctrl+Z 时，该命令被*停止*了（尽管“停止”这一术语可能会产生误解——“暂停”更准确）。当被停止时，任务不再运行，不再计时秒数，也不再执行它本应执行的操作。`bg`
    命令改变了这一状态，使任务在后台运行。你可以使用 `jobs` 查看运行中任务的列表，并使用 `fg` 将最近的后台任务调回前台。请注意，你也可以对已停止的任务运行
    `fg`；你不需要先让它们开始运行。


    若要直接在后台运行任务，只需在末尾添加 &，例如：`sleep 10000 &`


    #### 任务 2

    运行 `sleep 10000 &`，然后完全退出终端，通过关闭窗口来退出（不要使用 `exit` 命令）。


    当你打开一个新终端时，运行 `ps -ef | grep sleep`，你应该会发现你的 sleep 进程已经终止。即使关闭 shell 会话后仍希望任务继续运行，请在
    `nohup` 下运行该命令：


    ```bash

    nohup sleep 10000 &

    ```


    如果你现在退出终端并稍后回来，你仍会发现该进程正在运行。`nohup` 使命令忽略所谓的 `hangup`（挂起）信号。


    #### 任务 3

    有时，你可能需要运行一个普通的前台进程，但希望即使你离开后它仍保持运行。这在服务器上更为常见，管理员通过 OpenSSH 连接，希望将正在运行的进程与其自身的
    shell 解耦，同时仍能监控问题。


    有两个工具，`screen` 和 `tmux`，可以帮助解决此问题，但在默认配置下，你需要先安装它们：`sudo apt -y install screen
    tmux`


    `screen` 和 `tmux` 的操作方式略有不同，但原理是相同的。从 `screen` 开始：


    - `screen`

    - `i=0; while true; do i=$((i+1)); echo $i; sleep 1; done`


    现在按 Ctrl+A，然后按 D。这些按键组合将从你的 `screen` 会话中分离并返回到你的 shell。你可以使用 `screen -list` 查看这些会话。现在：


    - `tmux`

    - `j=0; while true; do j=$((j+1)); echo $j; sleep 1; done`


    现在按 Ctrl+B，然后按 D。同样，这将从会话中分离并把你带回到 shell，但你的进程仍在运行。你可以使用 `tmux ls` 查看这些会话。


    最后，分别使用 `screen -x` 和 `tmux attach` 返回到每个会话。（在它们之间按 Ctrl+C 并运行 `exit` 以终止进程。）如果有多个会话，系统会提示你选择一个；否则，命令将重新连接到正在运行的会话。


    **注意事项：**

    `screen` 和 `tmux` 具有多种选项，在某些方面类似于文本编辑器。它们都没有绝对的“优劣”之分，但你可能会想探索这两个工具并决定你更喜欢哪一个。


    ---


    ## 实验 49

    ### 创建、监控和终止进程：进程监控


    **实验目标：**

    学习如何监控进程及其资源使用情况。


    **实验目的：**

    在本实验中，你将学习如何监控前台和后台进程的若干项指标。


    **实验工具：**

    Ubuntu 18.04（或你选择的其他发行版）


    **实验拓扑：**

    单台 Linux 机器或虚拟机


    **实验步骤：**


    #### 任务 1

    如果你在实验 48 中没有小心终止所有的 sleep 进程，可能会有一两个遗留的进程正在运行。让我们来看看：


    ```bash

    ps -ef

    ```


    嗯，输出内容很多！你可以通过 `| grep sleep` 进行过滤，或者使用不带参数的 `ps`，但有一种更好的方法：


    ```bash

    pgrep -a sleep

    ```


    `pgrep` 支持正则表达式，并提供许多匹配选项，以确保你找到正确的进程。


    #### 任务 2

    sleep 进程不会使用太多的系统资源，但许多其他进程可能会。了解如何监控这些资源非常重要。


    查看一下 `free -h`。这会给出系统内存使用的输出。这里最通用的列是“total”（总计）、“used”（已用）和“available”（可用）。“available”列提供了可用于启动新进程而无需交换内存的内存估算值。这与“free”（空闲）内存不同，后者在
    Linux 系统中通常较低。这是因为操作系统可以利用这些内存以提升性能，同时仍将其视为对用户进程“可用”的状态。


    `free` 有一个 `-s` 开关，可以每 N 秒自动打印输出。这本身很有用，但你不希望每个命令都有这种功能吗？那么 `watch` 可能适合你！`free
    -h -s 10` 等同于 `watch -n 10 free -h`


    最后，看一下 `top` 命令。运行 `top` 会打开一个不断变化的、略显混乱的输出屏幕，但其最有用的功能之一可能仅仅是按 CPU 或内存使用率对进程进行排序。在
    `top` 中，使用 `<` 和 `>` 键将排序列切换到你感兴趣的指标。在上方面板中，你还可以看到系统负载、运行中进程的数量以及一些 CPU 和内存指标。最后，按
    ''q'' 退出。


    强烈建议花一些时间阅读 `top` 手册页，因为它是默认安装的最功能丰富的系统监控工具之一。


    #### 注意事项

    `uptime` 尽管名称如此，却是获取系统负载的另一种快捷方式。然而，`top` 也显示这些信息，以及许多其他有用的信息。


    '
