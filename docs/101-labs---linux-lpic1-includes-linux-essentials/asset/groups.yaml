    \n在你的一个主要名称服务器上运行此命令，它将起作用。\n\n# 注意事项：\n\nresolvconf 是以前在 Ubuntu 中用于管理 resolv.conf\
    \ 的工具。不再默认安装，它似乎已被 systemd-resolved 取代。\n\n对于某些用户，AAAA 记录的 dig 和 host 命令在“example”地址前需要加‘www’。\n\
    \n"
