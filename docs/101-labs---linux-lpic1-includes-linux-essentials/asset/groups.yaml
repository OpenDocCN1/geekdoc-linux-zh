    - `dig AAAA example.com [dns2] +short`\n\n还有更多可用选项，其中大多数你可能永远不需要——但一如既往，查阅 man\
    \ 页面是值得的。\n\n# 任务 3：\n\n不甘落后的 host 可以做 dig 所做的许多相同的事情：\n\n- `host -v -t A 101labs.net`\n\
    - `host -t MX 101labs.net`\n- `host -v -t CNAME www.101labs.net [dns1]`\n- `host\
    \ -t AAAA example.com [dns2]`\n\n看到相似之处了吗？\n\n# 任务 4：\n\n默认情况下，Ubuntu 18.04 使用本地缓存名称服务器。如果你在此运行非递归查询（使用\
