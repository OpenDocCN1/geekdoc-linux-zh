    \ and is the only user that can unconditionally do anything on the system. By\
    \ running a command preceded with **sudo**, you are running that command as the\
    \ root user. (You can also use `sudo -i` or `su` to access a root shell directly.)\n\
    \nIf you look at the user ID's, you will notice that most of them, on a default\
    \ system, are below 1000. These are *system* users, typically used to *run* specific\
    \ services, rather than running those as root, which can create security problems.\
    \ On most systems, human user ID's begin at 1000 or 500.\n\nYou can easily see\
    \ the *passwd* information for your own user with: `grep ^$USER /etc/passwd`\n\
    \n# Task 2:\n\nNow run: `sudo cat /etc/shadow`\n\nThe *shadow* file is a sensitive\
    \ database containing hashed user passwords, among other information. Be careful\
    \ with the contents of this file! It contains nine fields, again, separated by\
    \ colons—however, on a default Ubuntu install, only the first three are likely\
    \ to be significant:\n\n1. Username\n2. Encrypted password\n3. Date of last password\
    \ change\n\nThe other fields contain information like account expiration dates\
    \ and minimum/maximum password ages, which are not configured on a default system.\
    \ See `man 5 shadow` for more information.\n\nYou can see this information for\
    \ your own user with: `sudo grep ^$USER /etc/shadow`\n\n# Task 3:\n\nNow run:\n\
    \n```\nsudo sh -c 'echo \"Hello World\" > /etc/skel/hello.txt'\n```\n\nHere, you\
    \ are adding a file to the `/etc/skel` directory, which determines the default\
    \ files in a new user's home directory.\n\nNow:\n\n- `sudo useradd -m foo`\n-\
    \ `sudo cat ~/foo/hello.txt`\n\nYou should see the output “Hello World”. What\
    \ happened is that you created a new user, called foo (using the -m switch to\
    \ ensure a home directory was created). Every file in /etc/skel was then copied\
    \ to the new user’s home directory.\n\nFinally, set an initial password for this\
    \ user with: `sudo passwd foo`\n\n# Task 4:\n\nFinally, clean up:\n\n- `sudo rm\
