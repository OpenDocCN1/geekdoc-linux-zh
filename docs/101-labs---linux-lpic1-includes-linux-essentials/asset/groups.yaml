    \n*任务 2：*  \n在之前的实验中，您使用过 `ss` 来列出打开的端口。然而，还有其他方法。  \n安装 nmap 端口扫描器：`sudo apt\
    \ install nmap`\n\n现在运行标准的 nmap 扫描：`sudo nmap -v -sU -sS -p1-65535 localhost`\n\
    \n此命令可能需要相当长的时间。它将对您系统上的每个端口执行标准的 UDP 和 TCP SYN 扫描。从远程主机运行 nmap 扫描（您在此并未这样做）是从外部视角查看系统中打开端口的绝佳方式。\n\
    \n注意：  \n`fuser` 和 `lsof` 是两个可用于关联文件和进程的工具，但它们的工作方式不同。`fuser` 更便于回答“哪个进程打开了这个文件？”的问题，而\
    \ `lsof` 则更适合回答“这个进程打开了哪些文件？”\n\n## 实验 98\n\n### 设置主机安全：用户安全\n\n**实验目标：**  \n\
