    \ 计算机，或虚拟机\n\n**实验步骤：**\n\n#### 任务 1：\n理解以下观点很重要：尽管 shell 通配符扩展与正则表达式有一些共同点，但\
    \ Bash 本身并不识别完整的正则表达式语法。相反，Bash 只是识别并展开通配符。\n\n打开 **终端** 并运行：\n\n- `mkdir lab44`\n\
    - `cd lab44`\n- `touch a1 a2 a12 b1 b2 b12 c1 c2 c12`\n\n#### 任务 2：\n为了理解高级通配符扩展是如何工作的，运行以下命令并观察输出（右侧）：\n\
    \n- `ls a?` a1 a2\n- `ls a*` a1 a12 a2\n- `ls [ab]?` a1 a2 b1 b2\n- `ls [ab]*`\
    \ a1 a12 a2 b1 b12 b2\n- `ls [^ab]*` c1 c12 c2\n- `ls ?[1-2]` a1 a2 b1 b2 c1 c2\n\
    - `ls ?[1-2]*` a1 a12 a2 b1 b12 b2 c1 c12 c2\n\n#### 任务 3：\n现在，应用这种 shell 通配符扩展来查找并在一组特定文件上执行命令（以下操作无法通过复制粘贴完成）：\n\
    \n```bash\nfind . -name \"c?\" -execdir ls -l {} \\;\n```\n\n此命令的功能是在当前目录（递归地）搜索所有名为\
    \ \"c?\" 的文件，在本例中匹配 c1 和 c2。然后，它实际上在每个找到的文件上执行 `ls -l [file]`。`{}` 语法引用文件名，而转义的分号表示\
    \ `ls` 命令参数的结束。\n\n进一步尝试 `find`：\n\n- `sudo find / -not -type l -perm -o+w`\n\
    - `sudo find / -perm -u+s -user root -type f`\n\n上述两个命令对于安全审计目的都非常有用。第一个搜索（非符号链接的）所有用户可写文件。第二个搜索“setuid\
    \ root”文件，换句话说，即非 root 用户以 root 权限运行的文件。\n\n#### 任务 4：\n清理：\n\n- `cd ..`\n- `rm\
    \ -r lab44`\n\n**注意事项：**\n另一个有用的命令是 `file`，它可以告知您给定文件的类型。您能想出如何使用 `file` 结合 find\
    \ 来定位主目录中的所有文本文件吗？\n\n## 实验 45\n\n### 执行基本文件管理：归档与解归档\n\n**实验目标：**\n学习如何创建、提取和检查各种类型的归档文件。\n\
    \n**实验目的：**\n在本实验中，您将了解 gzip、bzip2 和 xz 压缩归档，以及两个用于管理大多数 Linux 归档类型的工具：`tar` 和\
    \ `cpio`。\n\n**实验工具：**\nUbuntu 18.04（或您选择的其他发行版）\n\n**实验拓扑：**\n一台 Linux 计算机，或虚拟机\n\
    \n**实验步骤：**\n\n#### 任务 1：\n打开终端应用程序并运行以下内容：\n\n```bash\nmkdir lab45\ncd lab45\n\
    touch f1 f2 f3 f4 f5 f6 f7 f8 f9\n```\n\n#### 任务 2：\n尽管 ZIP 是一种常见的格式并且在 Linux\
    \ 上得到很好的支持，但它并不是 Linux 使用的主要压缩格式。Linux 主要使用的是经典的 gzip：\n\n```bash\ngzip f*\nls\n\
    ```\n等等……为什么现在有九个 gzip 压缩的文件而不是一个？原始文件发生了什么？\n\n这就是为什么 gzip 被认为是一种*压缩*格式而不是*归档*格式的原因。要创建一个单一且易于使用的归档文件，我们需要另一个工具……\n\
    \n#### 任务 3：\n运行：`tar -cf files.tar.gz f*`\n\n现在，在 tar 归档器的帮助下，您拥有了 gzip 压缩的归档文件\
    \ files.tar.gz……或者这么说吧。\n\n通常，对于 gzip 压缩的 tar 包，您可以使用 `tar -xf files.tar.gz` 对其进行提取，并恢复所有原始文件。相反，您可以现在尝试一下，您将得到九个\
    \ .gz 文件。\n\n有一种更好的方法。让我们把这个清理掉并重新开始：\n\n```bash\nrm f*  \ntouch f1 f2 f3 f4 f5\
    \ f6 f7 f8 f9  \ntar -czf archive.tar.gz f*  \ntar --list -f archive.tar.gz\n\
    ```\n瞧！现在您可以看到您的单个压缩 tar 包内的九个文件列表。\n\n#### 任务 4：\ngzip 并不是您可以与 tar 一起使用的唯一格式：\n\
    \n```bash\ntar -cjf archive.tar.bz2 f*  \ntar -cJf archive.tar.xz f*\n```\nbzip2\
    \ 和 XZ 格式分别是较新的格式，使用与 gzip 不同的算法，但最终结果相同。tar 可以通过使用 `tar -xf filename` 以相同方式提取其所有格式。\n\
    \n#### 任务 5：\ncpio 是另一个归档工具，最值得注意的是在 RPM 软件包管理器和 initramfs 中使用。运行：\n\n- `find\
    \ . | cpio -o > lab45.cpio`\n- `cpio -t < lab45.cpio`\n- `rm f1`\n- `cpio -i -d\
    \ f1 < lab45.cpio`\n- `rm f*`\n- `cpio -i -vd < lab45.cpio`\n\n简而言之，您在这里做的是创建一个归档，列出该归档（使用\
    \ -t），提取 f1 文件，然后提取所有文件。\n\n#### 任务 6：\n备份的另一个有用命令是 `dd`。通常这用于整个磁盘或分区的块级复制，但它也可以用于普通文件：\n\
    \n```bash\ndd if=f1 of=f1.bak\n```\n当然，如果您只是做这些，您可以直接使用 `cp`。更典型的使用方法类似于以下内容（请勿实际运行此命令）：\n\
    \n```bash\ndd if=/dev/sda1 of=/dev/sdb1\n```\n假设您已经连接了备份驱动器，这将把整个 /dev/sda1 分区复制到该驱动器上。\n\
    \n#### 任务 7：\n最后，清理：\n\n```bash\ncd ~\nrm -r lab45\n```\n\n**注意事项：**\n如果仅使用压缩而不使用\
    \ tar 进行归档，每种格式都有自己的压缩和解压缩命令。分别使用 gzip/gunzip、bzip2/bunzip2 和 xz/unxz 来处理 gzip、bzip2\
    \ 和 LZMA 格式。\n\n## 实验 46\n\n### 使用流、管道和重定向：重定向与文件描述符\n\n**实验目标：**\n学习如何在 Bash\
    \ 中重定向输入和输出。\n\n**实验目的：**\nBash 拥有一个常用的功能，称为 I/O 重定向，这使得使用 Linux 变得更加容易。在本实验中，您将学习如何利用这一强大功能。\n\
    \n**实验工具：**\nUbuntu 18.04（或您选择的其他发行版）\n\n**实验拓扑：**\n一台 Linux 计算机，或虚拟机\n\n**实验步骤：**\n\
    \n#### 任务 1：\n打开终端应用程序并运行：\n\n```bash\nmkdir lab46\ncd lab46\necho \"hello world\"\
    \ > hello\ncat hello\n```\n您刚刚*重定向*了 `echo` 命令的输出到 hello 文件。`>` 是一个快捷方式；这个的完整版本是\
    \ `1>`，其中 `1` 被称为*文件描述符*，它引用*标准输出*。\n\n#### 任务 2：\n现在运行：\n\n```bash\nls nonexistent\
    \ 2>> hello\ncat hello\n```\n根据 hello 文件的新内容（'ls: cannot access ‘nonexistent’:\
    \ No such file or directory'），您能推断出 `2>>` 的功能是什么吗？在这里，2 是标准错误的文件描述符。\n\n#### 任务\
    \ 3：\n有时，您希望将输出和错误都重定向到同一个位置。在旧时代，您不得不做像这样丑陋的事情：`ls foo > bar 2>&1`\n\n然而，现代版本的\
    \ Bash 提供了一个易于使用的快捷方式：`ls foo >& bar`\n\n#### 任务 4：\n我们讨论了重定向输出，但输入呢？要了解这一点，请运行以下命令：\n\
    \n```bash\ncat < hello\n\nread foo << \"foo\"\necho $foo\n\ncat << END-OF-FILE\
    \ > goodbye\nhello\ngoodbye\nEND-OF-FILE\ncat goodbye\n```\n简而言之：`<` 从文件名重定向输入，`<<`\
    \ 开始一个 here document（此处文档），`<<<` 从另一个命令重定向输入。\n\n#### 任务 5：\n您还可以创建自己的文件描述符。观察：\n\
    \n- `exec 3> foo`\n- `echo \"Hello World\" >&3`\n- `cat foo`\n- `exec 3>&-`\n\
    - `echo \"fail\" >&3`\n这做的是打开文件描述符 3（用于读取和写入），使用文件 foo，并将输出发送到该描述符。第四行关闭文件描述符，导致最后一个\
    \ echo 命令失败。\n\n"
