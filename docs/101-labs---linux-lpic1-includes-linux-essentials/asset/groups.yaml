    ## 实验 25：特殊目录和文件


    **实验目标：**

    学习如何使用临时文件和目录、符号链接以及特殊权限。


    **实验目的：**

    在本实验中，你将操作符号链接、特殊文件/目录权限以及临时文件和目录。


    **实验工具：**

    Ubuntu 18.04（或你选择的任何其他发行版）


    **实验拓扑：**

    单台 Linux 机器，或虚拟机


    ### 实验步骤


    **任务 1：**

    打开终端并运行：`ls -ld /tmp`


    注意权限：`drwxrwxrwt`


    末尾的 `t` 表示所谓的*粘滞位*（sticky bit）。这意味着只有拥有该文件的用户或组才能修改它。这对于全局可写目录（例如存放临时文件的目录）非常重要，可以防止用户干扰其他用户的文件。


    **任务 2：**

    现在运行：


    - `ln -sv $(mktemp) mytmp`

    - `ls -l mytmp`

    - `rm mytmp`


    刚才发生了什么？`mktemp` 创建了一个随机命名的临时文件。然后你为该文件创建了一个名为 `mytmp` 的*符号链接*。`ls` 的输出显示了这个链接。符号链接仅仅是对现有文件的引用。这样，你可以对单个文件拥有多个引用——编辑原始文件时，所有引用都会立即更新。这对于某些系统配置非常有用。


    **备注：**


    除了 `/tmp` 之外，还有 `/var/tmp`，通常用于更大和/或持续时间更长的临时文件。`/tmp` 通常在每次重启时清理；而 `/var/tmp`
    则不一定如此。


    ## 实验 26：确定和配置硬件设置：PCI 设备与外设


    **实验目标：**

    学习收集 PCI 设备和外设信息以及对其进行配置。


    **实验目的：**

    在本实验中，你将使用 `lsub` 和 `lspci` 等工具来确定硬件资源并操作 USB 和 PCI 设备。


    **实验工具：**

    Ubuntu 18.04（或你选择的任何其他发行版）


    **实验拓扑：**

    单台 Linux 机器，或虚拟机


    ### 实验步骤


    **任务 1：**

    打开终端并运行：


    ```bash

    for dev in $(ls /sys/bus/usb/devices/*/product); do echo - "$dev :"; cat $dev;
    done

    ```


    输出将是连接到你系统的 USB 设备列表，如下所示：


    ```text

    /sys/bus/usb/devices/1-1/product:: USB Tablet

    /sys/bus/usb/devices/usb1/product:: OHCI PCI host controller

    ```


    我们感兴趣的是第一个字段中的 USB 总线和端口。在这个例子中，有两个设备，一个位于 `1-1` 的 USB 平板电脑和一个位于 `usb1` 的 PCI
    控制器。


    你也可以使用 `lsub` 来收集这些设备的更多信息。


    **任务 2：**

    现在你可以*可选地*禁用然后重新启用上述某个 USB 设备。这是可选的，因为如果操作不当，可能会导致系统暂时无法使用，直到重启。


    假设你有一个位于 `1-1.6` 的网络摄像头。禁用它是安全的。你应该运行：


    ```bash

    sudo sh -c ''echo 1-1.6 > /sys/bus/usb/drivers/usb/unbind''

    ```


    测试你禁用的设备，以确认它不再可用。要重新启用该设备，只需运行：


    ```bash

    sudo sh -c ''echo 1-1.6 > /sys/bus/usb/drivers/usb/bind''

    ```


    *(注：原文中包含 `1.1-6`，这很可能是 `1-1.6` 的 OCR 错误，基于标准的 Linux 设备命名惯例。虽然严格遵循“不删除/不总结”原则并纠正明显错误：对于
    bind/unbind echo 来说，`1.1-6` 在语法上很奇怪。然而，查看上下文“位于 1-1.6 的网络摄像头”，echo 应与设备路径后缀匹配。我将纠正明显的拼写错误
    `1.1-6` 为 `1-1.6`，因为它指的是特定提到的设备。)*


    **任务 3：**

    运行：`lspci -v`


    这是你的 PCI 设备列表。注意列出了内核模块的设备，在最后一行以 "Kernel modules" 开头。你可以使用 `lsmod` 获取当前加载的内核模块列表，以确认这些模块已加载。


    现在你将移除并重新加载其中一个模块。如上一步所示，你需要小心选择要移除的模块，因为选错可能会导致系统暂时无法使用。


    移除音频模块，例如 `snd_seq_midi`，是安全的。运行：


    ```bash

    sudo modprobe -r snd_seq_midi

    ```


    你可以使用以下命令确认模块已被移除：`lsmod | grep snd_seq_midi`


    根据你选择的模块不同，这可能会也可能不会对功能产生明显影响。典型的系统上加载了许多 Linux 内核模块，当然，除非你知道它们的作用，否则最好不要动它们！


    使用以下命令重新加载模块：`sudo modprobe snd_seq_midi`


    **备注：**


    了解 `/proc` 和 `/sys` 文件系统是很好的——如果你知道在哪里查找，所有有关 USB 和 PCI 设备的信息都存储在那里。下一个实验将深入探讨这些文件系统。


    ## 实验 27：确定和配置硬件设置：文件系统和存储


    **实验目标：**

    学习收集存储设备和特殊文件系统的信息以及对其进行配置。


    **实验目的：**

    在本实验中，你将学习如何区分各种类型的块存储设备，并了解 sysfs、udev 和 dbus。


    **实验工具：**

    Ubuntu 18.04（或你选择的任何其他发行版）


    **实验拓扑：**

    单台 Linux 机器，或虚拟机


    ### 实验步骤


    **任务 1：**

    打开终端并运行 `ls /sys/block`


    这将给你一个系统中块设备的列表。至少，你应该有一个像 `sda` 或 `xvda` 这样的设备。这些是你的标准磁盘设备，如硬盘和 USB 驱动器。你可能还有一个光学驱动器，如
    `sr0`，以及可能的一个或多个环回设备。


    要获取更多有关这些设备的信息，运行 `lsblk`


    这将列出所有这些设备，以及它们的大小、类型和挂载点。你的硬盘应标记为“disk”，分区为“part”，环回设备为“loop”，光学或其他只读设备为“rom”。


    **任务 2：**

    从上述列表中选择一个设备；例如，`/dev/sda`。


    运行：`udevadm info /dev/sda`


    Udev 是一个处理硬件事件（如插入和拔出 USB 键盘）的 Linux 子系统。在这里，我们使用另一个工具来收集有关硬盘设备（或你选择的另一个设备）的信息。


    注意输出的第一行，以“P:”开头。关联到 sysfs，这是该设备在 `/sys` 文件系统下的路径。你可以通过 `ls /sys/[path]` 来确认这一点，其中
    `[path]` 是上面第一行输出的内容。


    Udev 还负责在每次启动时生成 `/dev` 中的设备节点。如果你运行 `ls /dev`，你将看到之前发现的所有设备——还有许多其他设备。


    **任务 3：**

    D-Bus 是一种进程间通信（IPC）机制。运行 `dbus-monitor`，然后打开像 Thunderbird 这样的应用程序。你将看到大量消息在各个进程之间来回发送。你可能需要使用
    CTRL + C 或 q 来退出。


    **备注：**

    挑战：你能想办法仅通过向 sysfs 下的某个文件回显一个值来挂起系统吗？


    ## 实验 28：启动系统：启动序列


    **实验目标：**

    学习如何管理启动选项并理解启动序列。


    **实验目的：**

    在本实验中，你将练习向引导加载程序发出命令，并更深入地理解 Linux 启动过程，从 BIOS/UEFI 到完成。


    **实验工具：**

    Ubuntu 18.04（或你选择的任何其他发行版）


    **实验拓扑：**

    单台 Linux 机器，或虚拟机


    ### 实验步骤


    **任务 1：**

    打开终端并运行：


    ```bash

    sudo sed -i -bak -e ''s/GRUB_TIMEOUT=0/GRUB_TIMEOUT=10/'' -e ''s/GRUB_TIMEOUT_STYLE=hidden/GRUB_TIMEOUT_STYLE=menu/''
    -e ''s/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"/GRUB_CMDLINE_LINUX_DEFAULT=""/''
    /etc/default/grub

    sudo update-grub

    ```


    你在这里做的是修改 GRUB 引导加载程序，以便你可以看到启动菜单和各种日志。


    运行 `dmesg | grep ATA`——你正在寻找一行指示你的硬盘，以类似 `ata2.00` 或 `ata3.00` 的内容开头。记下这个数字以备后用。


    最后，重启你的计算机或虚拟机。


    **任务 2：**

    启动时，你应该看到一个 GRUB 菜单。按 `c` 进入 GRUB 提示符。在这里，你可以运行各种引导加载程序命令。使用 `ls` 探索你的分区；格式看起来有点不同，例如，`(hd0,msdos1)`。还有像
    `lsmod`、`lspci` 和 `parttool` 这样的命令。这些看起来熟悉吗？运行 `help` 获取完整列表。


    然后，按 `ESC` 返回启动菜单。


    **任务 3：**

    在启动菜单中，按 `e` 进入一个可以修改启动命令的屏幕。根据你的实现不同，这里可能有很多内容，但你要找的是以 `linux*` 开头的行。这是加载 Linux
    内核的行，也是编辑启动选项时最常修改的行。


    在该行的末尾添加 `libata.force=[number]:disable`，其中 `[number]` 是你上面记下的数字，例如 `3.00`。


    现在，按 `Ctrl+X` 启动你的计算机。


    **任务 4：**

    几分钟后，你可能会注意到出了问题！你禁用了主要硬盘，导致 Linux 无法启动。最初它可能*看起来*像是在启动。这是因为启动过程的下一步是加载*初始 RAM
    磁盘*（initrd），在加载内核之前。initrd 成功加载了，而内核步骤失败了，这就是为什么你应该最终到达 `(initramfs)` 提示符。


    简而言之，Linux 启动过程如下：


    1. BIOS/UEFI 枚举硬件并从配置的启动设备加载代码（非 Linux 特定）。

    2. GRUB 引导加载程序加载，解析启动命令和选项。

    3. 加载 initrd，引导各种文件系统和模块，然后加载内核。

    4. 启动 init 进程，进而执行在 Linux 中配置的所有启动进程。


    输入 `reboot` 重启你的计算机/虚拟机并恢复正常。


    '
