    ## LAB 33


    ### Install a Boot Manager


    **Lab Objective:**


    Learn how to install and configure a boot manager.


    **Lab Purpose:**


    In this lab, you will learn about GRUB and how to configure it.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**


    Classically, to edit GRUB configuration you would make changes to grub.cfg, menu.lst,
    and other files manually. In Ubuntu 18.04, the configurations are auto-generated
    based on the contents of /etc/grub.d and /etc/default/grub.


    Open the Terminal, and with your favorite editor, edit /etc/default/grub:


    - Change GRUB_TIMEOUT_STYLE to menu.

    - Change GRUB_TIMEOUT to 10 or another value you prefer (in seconds).

    - Change GRUB_CMDLINE_LINUX_DEFAULT to "", or experiment with other values for
    default kernel boot options.

    - Change the background by setting GRUB_BACKGROUND to a beautiful image of your
    choice.

    - (See Answer 1 below if you''re struggling to find a working /etc/default/grub
    file.)

    - Finally, close the editor and run `sudo update-grub`


    **Task 2:**


    Have a peek at /boot/grub/grub.cfg. This is a rather long file, but you should
    recognize parts of it if you have done Lab 28 and customized GRUB boot commands.


    If you are running this on a Linux system that''s already fully installed, the
    next step won''t be necessary. However, if you ever wish to boot a secondary disk,
    you might need to run `grub-install` on that disk. `grub-install` installs GRUB
    to a disk''s master boot record (MBR) so that a BIOS can boot it successfully.


    **Task 3:**


    Finally, reboot your computer/VM and see/hear your shiny new GRUB boot menu. From
    here you may hit e to edit boot commands or c to enter a command prompt, as in
    Lab 28.


    ### Answer 1:


    ```

    GRUB_DEFAULT=0

    GRUB_TIMEOUT_STYLE=menu

    GRUB_TIMEOUT=10

    GRUB_DISTRIBUTOR=`lsb_release -i -s 2> /dev/null || echo Debian`

    GRUB_CMDLINE_LINUX_DEFAULT=""

    GRUB_CMDLINE_LINUX=""

    GRUB_INIT_TUNE="480 440 1"

    # This file must be placed in the /boot/grub directory first

    GRUB_BACKGROUND="/boot/grub/image.png"

    ```


    **Notes:**


    There have been multiple common bootloaders, including LILO and GRUB Legacy. GRUB2
    is the most common and recommended bootloader today.


    ## LAB 34


    ### Manage Shared Libraries


    **Lab Objective:**


    Learn how to identify and install shared libraries.


    **Lab Purpose:**


    Shared libraries provide common functionality to one or more (often many more)
    Linux applications. In this lab, you will learn how to manage these very important
    libraries.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**


    Open the Terminal and run:


    ```bash

    cat /etc/ld.so.conf ../d/*

    ```


    (The above syntax is a shortcut for "/etc/ld.so.conf /etc/ld.so.conf.d/*")


    These files are used to define shared library directories to be used by `ldconfig`.
    When run as root, `ldconfig` creates links and cache (used when linking a new
    program) to the most recent libraries in those directories, plus the “trusted”
    directories of /lib, /usr/lib, /lib64, and /usr/lib64.


    **Task 2:**


    Now run `ldd $(which passwd)`


    This command tells you which shared libraries are linked by the `passwd` tool.
    The results will vary by implementation, but nearly every program should link
    to `libc.so.6`, among several others, at a minimum.


    Occasionally, if you download software outside of a package manager, you will
    need to manually install its runtime shared libraries. You can use `ldd` on a
    binary file to figure out its dependencies, then search for those dependencies
    within the package manager.


    **Notes:**


    You can use the `LD_LIBRARY_PATH` environment variable, instead of `ld.so.conf`,
    to enable additional library directories. However, in most situations, this is
    not recommended.


    ## LAB 35


    ### Use Debian Package Management: Apt


    **Lab Objective:**


    Learn how to use the Apt package manager to install, upgrade, search for, and
    uninstall packages.


    **Lab Purpose:**


    The Apt package manager is a collection of tools meant for Debian-based distros
    to install and manage DEB-based packages.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**


    Open the Terminal and run:


    ```bash

    grep -v -e ^# -e ^$ /etc/apt/sources.list

    cat /etc/apt/sources.list.d/*

    ```


    These files determine which repos will be used by Apt. There are many reputable
    third-party repos (and many unreputable ones), which you can enable by adding
    to one of these files, but we''ll stick with the defaults for now.


    Apt uses a cache that needs to be updated periodically. Do that now with: `sudo
    apt update`


    And then let''s run all system updates: `sudo apt -y full-upgrade`


    You might not have any updates, even if it''s been a while since you''ve checked:
    `apt list --installed | grep unattended-upgrades`


    Ubuntu 18.04 should come with this package installed and configured by default.


    **Task 2:**


    Now install a useful package: `sudo apt install apt-file`


    Then: `sudo apt-file update`


    Now, let''s say that you''ve downloaded the source code for some new and amazing
    application. Upon attempting to compile it, the code complains that “libvorbis.so”
    is missing. You can now use `apt-file` to see if there''s a package available
    containing it: `apt-file search libvorbis.so`


    It turns out there are several, the most relevant of which being libvorbis-dev
    (you can run `apt show libvorbis-dev` to confirm that that is the correct package).
    If you were to install that package, you would then be able to compile your application.


    **Notes:**


    You may be familiar with the classic tools such as `apt-get` and `apt-cache`.
    apt has not completely superseded those yet, but is more appropriate for interactive
    usage rather than scripting.


    ## LAB 36


    ### Use Debian Package Management: Dpkg


    **Lab Objective:**


    Learn how to use the dpkg package manager to install, uninstall, and obtain information
    on packages.


    **Lab Purpose:**


    Dpkg is a tool for installing Debian-based packages. It does not use repositories
    nor have automatic dependency resolution like Apt does, but it is useful for managing
    packages you may have downloaded outside of official repos.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**


    Open the Terminal and run: `dpkg -l`


    This lengthy list is, of course, your list of installed packages. To get more
    information on a given package, try:


    - `dpkg -s sudo`

    - `dpkg -l sudo`

    - `dpkg -p sudo`


    Some packages have configuration scripts which can be re-run with:


    ```bash

    sudo dpkg-reconfigure [package]

    ```


    To install a package manually, you would download the .deb file and run:


    ```bash

    sudo dpkg -i [file]

    ```


    Though, again, you would have to also install the dependencies manually first.
    To remove the package when you''re done with it: `dpkg -P [package]`


    **Notes:**


    Though `dpkg` is great for information gathering, in practice it is generally
    better to manage your installed packages through a single central database. That
    may mean adding a third-party repo, or downloading a package and then manually
    adding it to Apt.


    ## LAB 37


    ### Use RPM and YUM Package Management: YUM


    **Lab Objective:**


    Learn how to use the YUM package manager to install, upgrade, search for, and
    uninstall packages.


    **Lab Purpose:**


    The YUM package manager is a collection of tools meant for RedHat-based distros
    to install and manage RPM-based packages.


    > **IMPORTANT:** YUM is not pre-installed with Ubuntu and it may not install correctly.
    In that case, we recommend setting up another VM with a RedHat-based distro, such
    as CentOS.


    **Lab Tool:**


    A RedHat-based distro such as CentOS. Ubuntu is not recommended for this lab.


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**


    Open the Terminal and run:


    ```bash

    grep -r -v -e ^# -e $ /etc/yum.conf{,.d/*}

    cat /etc/yum.repos.d/*

    ```


    These files determine which repos will be used by YUM. There are many reputable
    third-party repos (and many unreputable ones), which you can enable by adding
    to one of these files, but we''ll stick with the defaults for now.


    Let''s start by running all system updates: `sudo yum -y update`


    If you chose Fedora, you will be using a newer tool: `sudo dnf -y update`

