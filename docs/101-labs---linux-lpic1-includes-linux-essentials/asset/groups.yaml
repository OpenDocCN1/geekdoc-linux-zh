    out how to remove such a file?


    ## LAB 11: Creating, Moving, and Deleting Files


    **Lab Objective:**

    Learn how to copy, move, and manage larger numbers of files.


    **Lab Purpose:**

    In this lab, you will learn the difference between copying and moving a file,
    and how simple shell globbing works.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough


    **Task 1:**

    Open the Terminal application, then enter:


    ```bash

    mkdir lab11

    cd lab11

    touch f1 f2 f3

    ```


    You now have a single directory containing three empty files.


    **Task 2:**


    ```bash

    cp f1 f4

    ls

    ```


    As expected, the `cp` command has created a fourth empty file. However, what happens
    when you do the following?


    ```bash

    cp f1 f3

    ```


    The f3 file gets overwritten—hope you didn''t have any important data in there!


    To prevent this, use either the `-i` or `-n` flag. `-i` stands for *interactive*,
    which means you will be prompted before overwriting. `-n` stands for *no-clobber*,
    which means the target file will never be overwriten. However, `cp` won''t warn
    you about this, so `-i` is recommended for general shell usage.


    **Task 3:**


    Now run:


    ```bash

    mv f1 f5

    ```


    `mv` is the move command, so this does what you might expect, effectively renaming
    `f1` to `f5`. Like `cp`, `mv` also has `-i` and `-n` flags, which have the same
    effects.


    **Task 4:**


    Now run:


    ```bash

    mkdir foo bar

    mv f2 foo

    mv f3 foo

    mv f* bar

    ```


    What do you predict the final directory structure will look like? Now check it
    with `ls -aR bar`—did it match your prediction? (See **Answer 1** below.)


    What you did with `f*` is called *globbing*. That command matched every file *and*
    directory starting with `f` (but not `F`—like everything else in Linux, globbing
    is case-sensitive), so `f4`, `f5`, and `foo` were all moved into `bar`.


    **Task 5:**


    Copy `foo` back to the current directory, with `cp bar/foo ./`


    ... Whoops! What happened? In order to copy a directory with its contents, you
    must use the `-r` flag (for *recursive*): `cp -r bar/foo ./`


    **Task 6:**


    Finally, let''s clean up:


    ```bash

    cd ~

    rm -r lab11

    ```


    ### Answer 1:


    ```text

    bar:

    . .. f4 f5 foo

    bar/foo:

    . .. f2 f3

    ```


    **Notes:**

    Be careful with `rm -r`—that command removes an entire directory without prompting
    you. Many horror stories can be found on the internet of people inadvertently
    deleting important files when they weren’t paying attention!


