    \n由于这些工具已被弃用，完成后最好将它们卸载：`sudo apt remove net-tools`\n\n**注意事项：**\n`net-tools`\
    \ 软件包大约十年来一直没有积极更新。虽然变化缓慢且它在大多数软件包仓库中仍然可用，但显而易见的是，`ifconfig` 及其同类工具将不会回归。`ipaddr`\
    \ 已被 `ip address` 取代。\n\n# 实验 94\n\n# 配置客户端 DNS：dnsutils\n\n**实验目标：**\n学习如何使用经典的\
    \ Linux 实用工具配置客户端 DNS。\n\n**实验目的：**\n在本实验中，你将使用诸如 `dig` 等经典工具来配置和故障排除 DNS 解析。\n\
    \n**实验工具：**\nUbuntu 18.04（或你选择的其他发行版）\n\n**实验拓扑：**\n一台单独的 Linux 机器或虚拟机\n\n**实验步骤：**\n\
    \n*任务 1：*\n在旧时代，人们只需 `cat /etc/hosts /etc/resolv.conf` 即可收集所需的所有 DNS 信息。不幸的是，现在情况已不再如此。相反，运行\
