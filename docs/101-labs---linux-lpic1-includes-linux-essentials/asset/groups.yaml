    \ 3 个部分，由美元符号分隔。第一个部分是标识加密方法的 ID。再次查看您的 shadow 哈希值——第一个字段中的 ID 编号是多少？如果是 6，则您的密码是使用\
    \ SHA-512 哈希的，您处于良好状态。如果是 5，您的哈希是 SHA-256——不是最好的，但仍然相当不错。以 1 开头的密码哈希是 MD5，只有当哈希是从旧系统复制过来时才可能出现。（如果您有类似的哈希，您应该为这些用户运行\
    \ `passwd` 来更改它们。）\n\n*任务 2：*  \n现在运行：`man 5 nologin`\n\n`/etc/nologin` 文件禁止非\
