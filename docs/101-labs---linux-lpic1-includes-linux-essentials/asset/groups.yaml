    Now you will partition this new block device. `gdisk` is a useful tool for creating
    GPT partition tables. It is based on `fdisk` and the syntax is nearly identical,
    so please reference Lab 32 to learn about `gdisk`. For now, use `parted` instead:


    ```bash

    sudo parted [dev]

    ```


    You can use `parted` non-interactively, but here, run the following commands in
    interactive mode:


    - `mklabel gpt`

    - `mkpart primary ext4 0 50%`

    - `mkpart primary linux-swap 50% -1s`

    - `quit`


    These changes may prompt some warnings; they are not important for this case and
    you should respond in the affirmative.


    It is worth noting that, unlike `fdisk` and `gdisk`, `parted` does not store all
    changes in memory and write them at the end, but writes every change made as you
    make it. Thus, it might be considered less safe than the previous two.


    #### Task 3


    Now create an ext4 filesystem on the first partition of your block device. The
    name should end in “p1”—for example, if your block device is `/dev/loop0`, the
    first partition should be `/dev/loop0p1`:


    ```bash

    sudo mkfs.ext4 [dev]p1

    ```


    Finally, create a swap partition as well: `sudo mkswap [dev]p2`


    If you were actually setting up a new system, you would then activate the swap
    partition with `swapon`, but in this case you should not do that. You could also
    mount the `[dev]p1` partition, and start using it as a normal ext4 filesystem
    if you wanted to.


    #### Task 4


    Clean up:


    - `sudo losetup -d [dev]`

