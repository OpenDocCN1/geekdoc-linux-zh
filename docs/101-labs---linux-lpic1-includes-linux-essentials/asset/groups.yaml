    space you can make it larger for more flexibility. Now run:


    - `sudo losetup -fP block.img`

    - `losetup -a | grep block.img | cut -d: -f1`


    This should print a device name such as `/dev/loop0`. This is the loopback block
    device, and is what should be substituted everywhere you see `[dev]` for the rest
    of this lab.


