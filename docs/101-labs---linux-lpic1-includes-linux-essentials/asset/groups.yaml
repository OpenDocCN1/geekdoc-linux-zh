    - `sleep 10000 &`

    - `kill -19 $(pgrep sleep)`

    - `jobs`

    - `kill -18 $(pgrep sleep)`

    - `jobs`


    What is happening here? Contrary to its name, the `kill` command doesn''t necessarily
    kill processes. Instead, it sends them a *signal*, which may or may not be `SIGKILL`,
    the signal that immediately terminates a process. In fact, by default, `kill`
    doesn''t even send `SIGKILL`—it sends `SIGTERM` (terminate gracefully), which
    is basically a computer''s way of saying “please wrap up everything that you''re
    doing... or else I''ll have to send `SIGKILL`.”


    In this sequence, you first sent signal 19, which is SIGSTOP (stop), followed
    by signal 18, which is SIGCONT (continue). Given the output of `jobs`, this should
    now make more sense.


    You can see a list of all signals with `kill -L`.


    ### Task 2:


    Now create a few sleep processes if you haven''t already, and use either `killall`
    or `pkill` to terminate them all with a single command. Both commands have the
    same general function, with slightly different arguments, so it''s worth experimenting
    with and reading the man pages for both.


    ### Notes:


    `pkill` and `pgrep` have exactly the same searching/matching semantics. This means
    you can use `pgrep` as a "dry run" to find the processes you want to signal before
    actually doing so.


    ## LAB 51

    ### Modify Process Execution Priorities


    **Lab Objective:**

    Learn how to manage the priority of started and running processes.


    **Lab Purpose:**

    In this lab, you will learn how to get a running task''s priority, change its
    priority, and set the priority of a task to be run.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run the following commands:


    - `nice -n 19 sleep 10000 &`

    - `ps -l`

    - `sudo renice -n -20 $(pgrep sleep)`

    - `ps -l`

    - `pkill sleep`


    What you’ve done here is started a `sleep` process with a “niceness” value of
    19. This is the most “nice” a process can be— in other words, the least demanding
    in terms of priority. Then you changed its priority, with `renice`, to the “meanest”
    possible value of -20, or the most demanding in terms of priority. The default
    priority for all user processes is 0, and you must be root to run a process with
    higher priority. `ps -l` will list your running processes with their priorities.


    **Notes:**

    You can also use `top` to list and sort processes by their priority values.


