    刚才发生了什么？你为名为 foo 的文件创建了一个名为 myfoo 的符号链接。ls 的输出显示了该链接。符号链接仅仅是对现有文件的引用。这样，你可以对单个文件拥有多个引用——编辑原始文件，所有引用都会立即更新，如
    cat 所示。


    当你删除链接时，原始文件仍然存在。（如果你在保留符号链接的情况下删除原始文件，你将得到一个所谓的 *损坏的链接*，就像在互联网上一样。）这对于某些系统配置非常有用。


    ### 任务 2


    现在运行：


    ```bash

    ln -v foo myfoo

    echo goodbye > foo

    cat myfoo

    rm foo

    ls -l myfoo

    cat myfoo

    ```


    你刚刚创建了一种不同类型的链接，称为 *硬链接*。硬链接的行为与符号链接相似，因为当原始文件被修改时，链接也会随之更新，反之亦然。然而，如果原始文件被删除，硬链接会保留其数据。硬链接也不能跨文件系统或分区边界创建，并且目录不能进行硬链接。


    ### 任务 3


    最后，使用 `rm myfoo` 进行清理


    ### 备注


    在底层，硬链接实际上是对 *inode* 的操作。硬链接创建另一个指向与原始文件相同 inode 的文件。（符号链接在更高层级工作，直接指向文件或目录名称。）你可以使用
    `ls -i` 查看 inode 号，或者在 `ls -l` 的第二列中查看有多少个硬链接共享给定文件的 inode。


    ## 实验 63


    ## 查找系统文件并将文件放置在正确位置


    **实验目标：**

    学习如何在 Linux 系统上定位文件。


    **实验目的：**

    在本实验中，你将学习根据文件系统层次标准（FHS）在系统上定位文件的各种方法。


    **实验工具：**

    Ubuntu 18.04（或你选择的其他发行版）


    **实验拓扑：**

    一台单 Linux 机器或虚拟机


    **实验操作指引：**


    ### 任务 1


    在之前的实验中，你使用过 `find`，这是一个可以查找符合特定规格的文件甚至在这些文件上执行命令的工具。`find` 适用于有限范围，但当你实际上不知道给定文件的位置时，它会变得难以管理，因为它必须搜索整个文件系统！还有另一种方法。打开终端并运行：


    ```bash

    sudo updatedb

    locate updatedb.conf

    ```


    正如你可能猜测的，`locate` 操作自一个由 `updatedb` 更新的数据库。`updatedb` 命令可能需要几分钟，但一旦完成，随后的每次 `locate`
    都会非常快。


    在这里，你应该找到两个文件：一个是实际的 `updatedb` 配置文件，另一个是 man 手册页。如果你愿意，现在可以检查这些文件：


    ```bash

    cat /etc/updatedb.conf

    man 5 updatedb.conf

    ```


    updatedb.conf 文件应包含一条指令，用于修剪（prune）如 /tmp/ 和 /media 等路径以及其他路径。鉴于你对 FHS 的了解：你认为从
    locate 数据库中修剪这些路径是个好主意吗？为什么修剪 nfs 和 proc 等文件系统类型是个好主意？


    ### 任务 2


    现在运行：


    ```bash

    which which

    which locate

    whereis locate

    whereis updatedb

    whereis whereis

    ```


    `which` 显示给定（相对）命令的绝对位置，而 `whereis` 在此基础上扩展，显示其他相关文件，如配置文件、数据库和 man 手册页。


    ### 备注


    许多常见的 Linux 工具是相当复杂的 C 程序；`which` 是一个例外。它是一个简短的 shell 脚本，经过一点练习，你可以完全理解它。查看 /bin/which
    文件，看看其中有多少内容对你来说是有意义的！


