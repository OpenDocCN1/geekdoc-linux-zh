    ## LAB 29


    ### Boot the System: SysVinit and Systemd


    **Lab Objective:**

    Learn how to manage SysVInit and Systemd, and understand the differences between
    them.


    **Lab Purpose:**

    SysVinit and Systemd are two different ways of managing Linux startup processes.
    SysVinit is considered the “classic” method, while Systemd has supplanted it in
    many distros today.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    *Task 1:* Ubuntu 18.04 is one of the distros that has switched to Systemd. However,
    many SysVInit-based scripts are still present and active:


    ```bash

    ls /etc/init.d

    ```


    Every file in this directory is a script which starts, stops, checks status, and
    possibly other features for a given service. You can see which scripts are enabled
    for which *runlevels* with:


    ```bash

    ls -lR /etc/rc*

    ```


    Take a look the symlinks listed under /etc/rc5.d. Runlevel 5 is the default boot
    runlevel, when you’re booting normally into a desktop with display manager. Runlevel
    0 (under /etc/rc0.d) contains links to the scripts run when your computer is halted.


    *Task 2:*


    Now run:


    ```bash

    systemctl list-unit-files --state=enabled

    ```


    These are the services which are enabled at boot within Systemd, and should be
    mostly distinct from the ones listed under /etc/rc*. Use CTRL + C or q to quit.


    While SysVInit relies on standard shell scripts, Systemd uses unit files with
    its own custom format. As just one example, take a look at:


    ```bash

    cat /lib/systemd/system/rsyslog.service

    ```


    Systemd unit files can have many options. See man systemd.unit for more information.


    *Task 3:*


    Finally, take a look at those system logs with:


    ```bash

    journalctl -xe

    ```


    Journalctl is Systemd’s replacement for the classic syslog. Again, however, Ubuntu
    still has quite a few logs in classic text format—see /var/log.


    ### Notes:


    Ubuntu once used Upstart as a replacement for SysVInit. However, that project
    is currently in maintenance mode and no longer being updated. Ubuntu has migrated
    to Systemd as a replacement for Upstart.


    ## LAB 30


    ### Change Runlevels / Boot Targets and Shutdown or Reboot System: Runlevels and
    Boot Targets


    **Lab Objective:**

    Learn how to set and change Linux runlevels and boot targets.


    **Lab Purpose:**

    The standard Linux *runlevels* are as follows:


    - 0: Halt

    - 1 (or S): Single-user mode

    - 2: Multi-user mode, no networking

    - 3: Multi-user mode, with networking

    - 4: Unused, or runlevel 3 + display manager

    - 5: Unused, or runlevel 3 + display manager

    - 6: Reboot


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    *Task 1:*


    Make sure all of your work is saved. Then, you will enter single-user mode (rescue
    mode) from the Terminal:


    ```bash

    sudo telinit 1

    ```


    You will be greeted with a root command prompt—this is the original Linux! As
    hinted by the name, this mode is typically used for rescue operations. If you
    ever forget your root password (and the root partition isn’t encrypted), this
    is how you could reset it.


    From here, type `reboot` to reboot your machine into a GRUB menu. (See Lab 28
    if you cannot see the GRUB boot menu.)


    *Task 2:*


    From the GRUB boot menu, type ''e'' to edit the boot commands. Append 3 to the
    line beginning with “linux”, then hit Ctrl+X to boot.


    You should find yourself prompted to log in via command line, rather than the
    graphical prompt you may be used to. After logging in, you will have a shell just
    as if you had opened the Terminal application.


    Now run `sudo telinit 5` to start the display manager.


    You may also use `init` for the same purpose.


    ### Notes:


    It should be noted that, according to the `telinit` man page in Ubuntu 18.04,
    “the concept of SysV runlevels is obsolete.” In the past, you could also use `/etc/inittab`
    to set the default runlevel—this is also removed in Ubuntu 18.04.


    ## LAB 31


    ### Change Runlevels / Boot Targets and Shutdown or Reboot System: Systemd and
    Processes


    **Lab Objective:**

    Learn how to manage Systemd and properly shutdown/restart services.


    **Lab Purpose:**

    In this lab you will practice managing running services with Systemd and gracefully
    stopping and starting processes.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    *Task 1:*

    Open the Terminal and run:


    ```bash

    systemctl status rsyslog

    ```


    You should receive some basic status output showing that the rsyslog service is,
    indeed, running.


    **Now:** `sudo systemctl restart rsyslog`


    Check the logs again and you will see the rsyslog startup messages from just a
    moment ago.


    *Task 2:*

    Run: `ls /lib/systemd/system`


    These are the Systemd unit files (there are a lot). As the equivalent to SysV
    runlevels, these unit files are symlinked from various *targets* in /etc/systemd/system.
    Run:


    ```bash

    ls -/ /etc/systemd/system

    ls -/ /etc/systemd/system/multi-user.target.wants

    ```


    *Task 3:*

    Acpid is an ACPI daemon for managing hardware events, like sleep or hitting the
    power button. To check whether ACPI is active on your system (it probably is):


    ```bash

    acpi_available && echo yes || echo no

    ```


    If yes, then you can run `acpi_listen` and hit the power or sleep buttons, or
    close the screen, to trigger and view ACPI events.


    ### Notes:


    A classic command is called `wall`, which was used to notify users of system maintenance
    and other events. In practice, it is rarely used anymore, but still present on
    most Linux systems.


    ## LAB 32


    ### Design Hard Disk Layout


    **Lab Objective:**

    Learn how to design a disk partitioning scheme.


    **Lab Purpose:**

    In this lab, you will learn about disk partitioning, partition types, and how
    to set up partitioning using tools such as *fdisk*.


    **WARNING:** In this lab, you will begin partitioning your main disk with *fdisk*.
    As long as you do not use the write command, these changes will stay in memory
    only and your data will be safe. As an extra precaution, you may wish to run *fdisk*
    on a secondary drive, or create another VM just for this purpose.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    *Task 1:*

    Open the Terminal and run *sudo fdisk /dev/sda*—substitute your hard disk for
    */dev/sda*, if *sda* is not the right device.


    Enter p to see the current partition layout. If you selected your main disk, you
    should see at least one partition, along with its size, type, and whether it is
    a boot partition. For example, in the output below:


    ```text

    /dev/sda1 * 2048 41940991 41938944 20G 83 Linux

    ```


    The disk contains a single 20GB partition, of type 83—a Linux filesystem (enter
    i to list all of the types).


    *Task 2:*

    Now let''s delete (again, *from memory only*) any pre-existing partitions. Type
    d and answer the prompts until none remain.


    Then:


    - Enter n to add a new partition. This should be a primary partition, number 1,
    100M in size. It would be mounted at /boot.

    - Repeat this for the swap partition. Make it 4G in size, or double the system
    RAM. Enter t to change this partition type to 82 (Linux swap). Swap space is "backup
    RAM" which uses disk as secondary memory if your system runs out of RAM.

    - Repeat this for the /var filesystem. Make it 4G in size, or whatever feels right
    to you based on the disk size.

    - Create an extended partition that fills up the rest of the disk. Within this
    extended partition, you will create partitions for /home and /.

    - Create a partition for the /home filesystem. Make it 4G in size, or whatever
    feels right to you based on the disk size.

    - Repeat this for the / filesystem. It will fill up the rest of the disk.

    - Enter a to toggle the bootable flag on partition 1.

    - Enter p again to see what your results would be.

    - **IMPORTANT:** Enter q to quit without writing the partition table.


    In most situations, you probably wouldn''t need this many partitions, and if you
    did, you would instead use Logical Volume Manager (LVM). LVM provides a more flexible
    way of managing logical volumes rather than partitions. In LVM, you would create
    a *volume group* consisting of one or more physical volumes (disks), and then
    create logical volumes on top of that in lieu of partitions.


    ### Notes:

    Some systems contain an EFI System Partition. This would show up in `fdisk` as
    a GPT partition, and in general should not be deleted, especially if you have
    a dual-booting machine.

