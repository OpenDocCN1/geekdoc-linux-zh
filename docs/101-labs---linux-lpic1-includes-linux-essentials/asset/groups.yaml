    \ 18.04 (or another distro of your choice)\n\n**Lab Topology:**\nA single Linux\
    \ machine, or virtual machine\n\n**Lab Walkthrough:**\n\n*Task 1:*\nIn ye olden\
    \ days, one could just `cat /etc/hosts /etc/resolv.conf` and gather all the DNS\
    \ information one needed. This is, sadly, no longer true. Instead, run `nmcli`\
    \ to find out what your current DNS servers are (see “DNS configuration” near\
    \ the bottom), then save these for later. You probably have two nameservers, which\
    \ will be referred to as [dns1] and [dns2] below.\n\n*Task 2:*\nNow you will experiment\
    \ with `dig`, one of the most common and useful DNS troubleshooting utilities:\n\
    \n- `dig 101labs.net`\n- `dig 101labs.net MX +short`\n- `dig CNAME www.101labs.net\
    \ [dns1]`\n- `dig AAAA example.com [dns2] +short`\n\nThere are many more options\
    \ available, most of which you will probably never need--but, as always, the man\
    \ page is worth a skim.\n\n# Task 3:\n\nNot to be outdone, host can do many of\
    \ the same things that dig can:\n\n- `host -v -t A 101labs.net`\n- `host -t MX\
    \ 101labs.net`\n- `host -v -t CNAME www.101labs.net [dns1]`\n- `host -t AAAA example.com\
    \ [dns2]`\n\nSee the similarities?\n\n# Task 4:\n\nBy default, Ubuntu 18.04 uses\
    \ a local caching nameserver. If you run a non-recursive query on this (with the\
    \ dig option +norecurse), it will come up empty:\n\n```\ndig 101labs.net +norecurse\
    \ 127.0.0.53\n```\n\nRun this on one of your main nameservers and it will work.\n\
    \n# Notes:\n\nresolvconf is a tool that was previously used in Ubuntu to manage\
    \ resolv.conf. No longer installed by default, it seems to have been superseded\
    \ by systemd-resolved.\n\nFor some users, the dig and host commands for the AAAA\
    \ record required ‘www’ before the “example” address.\n"
  mdcn: "\n## `/etc/resolv.conf` 列出了你的 DNS 服务器 IP 地址，可能还有一些其他相关选项。（正如文件注释中所提到的，现在这已由\
