    # LAB 6

    ## Command Line Basics: Syntax and Quoting


    **Lab Objective:**

    Learn basic Linux commands and shell syntax.


    **Lab Purpose:**

    The Bash command shell is pre-installed on millions of Linux computers around
    the world. Understanding how this shell works is a critical skill for working
    with Linux.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1:

    Open the Terminal application, then enter: `echo Hello World`


    The `echo` command simply prints out all of the "words," or arguments, that you
    give to it. This might not seem very useful, until...


    ### Task 2:

    Now enter the following four commands, in order:


    ```

    quote=''cat /etc/issue''

    backquote=`cat /etc/issue`

    echo $quote

    echo $backquote

    ```


    Here, `quote` and `backquote` are called variables. In the first two lines, we
    set them to the values `''cat /etc/issue''` and `` `cat /etc/issue` ``, respectively.
    (We''ll get to the difference between quotes and backquotes in a minute.) In the
    last two lines, we reference the variables by putting `$` before them, and print
    out their contents.


    ### Task 3:


    To understand single quotes, double quotes, and backquotes, enter the following:


    ```

    hello="echo hello"


    echo "$hello"


    echo ''$hello''


    echo `$hello`

    ```


    The output should be as follows:


    ```

    echo hello

    $hello

    hello

    ```


    Double quotes allow for variables to have their values referenced. Single quotes
    are always literal, while backquotes *execute* the command (including variable
    references) within those quotes.


    ## Notes:


    In some cases, you will want to reference variables with the `${variable}` syntax.
    This is equivalent to `$variable`, but the reasons for choosing one over the other
    are beyond the scope of this lab.


    Backquotes also have an alternative syntax:


    ```

    $(echo hello)

    ```


    This syntax is generally preferred over backquotes. We only mention backquotes
    to distinguish them from single quotes and ensure the differences are clear.


    # LAB 7

    ## Command Line Basics: Environment Variables, Types, and History


    **Lab Objective:**

    Learn about Bash environment variables, types, and how to use the shell history.


    **Lab Purpose:**

    The Bash command shell is pre-installed on millions of Linux computers around
    the world. Understanding how this shell works is a critical skill for working
    with Linux.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ### Task 1:

    Open the Terminal application, then enter: `echo $PATH`


    The PATH environment variable lists all locations that Bash will search when you
    enter a command with a relative path. A relative path example is `bash`, compared
    to `/bin/bash`, which is an absolute path.


    There are other environment variables as well. You can view all of them, and their
    values, using the `env` command.


    ### Task 2:

    You can add or modify an environment variable with `export`. For example:


    ```

    export PATH=$PATH:./

    ```


    In most cases, this change will disappear when you exit Bash, but the advantage
    of `export` is that child processes will now be able to see the new/modified variable.


    ### Task 3:


    Another useful Bash command is called *type*. Use **type** to figure out information
    on other commands or functions:


    ```

    type -a date

    type -a if

    type -a echo

    type -a ls

    ```


    ### Task 4:


    Enter **history** to see a history of commands you have typed into Bash.


    To repeat a command, simply enter `!` and then the appropriate number. For example,
    `!12` will execute command `#12` in the history list.


    If you accidentally saved a password or other sensitive information to the history,
    you may use, for example, `history -d 47` to delete command #47 from the list,
    or even `history -c` to clear the history altogether.


    If you want to save your current shell''s history to another file, use `history
    -w filename`


    ## Notes:


    If you wish to permanently modify an environment variable or other shell settings,
    look into the `.bashrc` and `.bash_profile` files.

