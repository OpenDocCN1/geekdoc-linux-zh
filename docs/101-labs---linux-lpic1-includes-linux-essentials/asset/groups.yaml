    有时，您可能还需要获取文件在八进制或其他格式下的字节级表示。如果文件包含终端无法读取的字符，这可能很有用：


    ```bash

    od lab42.txt

    ```


    最后，使用 `wc` 统计字符、单词和行数：


    - `wc -c lab42.txt`

    - `wc -w lab42.txt`

    - `wc -l lab42.txt`


    您分别得到了 109、16 和 8 吗？


    **任务 5：**

    现在您将使用 `tr` 过滤器来修改输出并将所有数字替换为下划线：


    ```bash

    cat lab42.txt | tr [0-9] _

    ```


    `sed` 是另一种更复杂但功能更丰富的完成相同任务的方法：


    ```bash

    sed ''s/[0-9]/_/g'' lab42.txt

    ```


    关于 `sed` 语法的全面讨论超出了本实验的范围，但它能做的远多于 `tr`，是一个值得学习的工具。


    最后，将此文件拆分为四个文件，每个文件两行：


    - `split -l2 lab42.txt lab42`

    - `ls lab42*`

    - `cat lab42aa`


    **任务 6：**

    现在使用 `rm lab42*` 进行清理。


    **注意事项：**

    除了 `cat`，您还可以直接查看压缩文件的内容。分别使用 `zcat`、`bcat` 或 `xzcat` 处理 gzip、bzip2 或 LZMA 格式。


    ## 实验 43


    ### 执行基本文件管理：文件和目录


    **实验目标：**

    学习如何复制、移动和管理大量文件和目录。


    **实验目的：**

    在本实验中，您将学习如何管理文件和目录，包括递归操作。


    **实验工具：**

    Ubuntu 18.04（或您选择的其他发行版）


    **实验拓扑：**

    一台 Linux 计算机或虚拟机


    **实验步骤：**


    **任务 1：**

    打开终端应用程序，然后输入：


    ```bash

    mkdir lab43

    cd lab43

    touch f1 f2 f3

    ```


    您现在有一个包含三个空文件的目录。


    **任务 2：**


    ```bash

    cp f1 f4

    ls

    ```


    正如预期，`cp` 命令创建了一个第四个空文件。但是，当你执行以下操作时会发生什么？


    ```bash

    cp f1 f3

    ```


    `f3` 文件被覆盖——希望里面没有重要数据！


    为了防止这种情况，使用 `-i` 或 `-n` 标志。`-i` 代表*交互式*，意味着覆盖前会提示。`-n` 代表*不覆盖*，这意味着目标文件永远不会被覆盖。然而，`cp`
    不会警告您这一点，因此建议在日常 shell 使用中使用 `-i`。


    **任务 3：**

    现在运行：


    ```bash

    mv f1 f5

    ```


    `mv` 是移动命令，因此它执行了您可能预期的操作，实际上将 `f1` 重命名为 `f5`。与 `cp` 一样，`mv` 也有 `-i` 和 `-n` 标志，效果相同。


    **任务 4：**

    现在运行：


    ```bash

    mkdir foo bar

    mv f2 foo

    mv f3 foo

    mv f* bar

    ```


    你预测最终的目录结构是什么样的？现在用 `ls -aR bar` 检查一下——与你的预测相符吗？（见下方答案 1。）


    你对 `f*` 所做的操作称为*通配符*。该命令匹配所有以 `f` 开头的*文件和*目录（但不包括 `F`——与 Linux 中的其他一切一样，通配符区分大小写），因此
    `f4`、`f5` 和 `foo` 都被移动到了 `bar` 中。


    **任务 5：**

    使用 `cp bar/foo ./` 将 `foo` 复制回当前目录。


    ... 哎呀！发生了什么？为了复制目录及其内容，必须使用 `-r` 标志（代表*递归*）；`cp -r bar/foo ./`


    **任务 6：**

    最后，让我们清理一下：


    ```bash

    cd ~

    rm -r lab43

    ```


    '
