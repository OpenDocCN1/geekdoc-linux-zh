    # **Task 4:**


    Enter **history** to see a history of commands you have typed into Bash.


    To repeat a command, simply enter `!` and then the appropriate number. For example,
    `!12` will execute command `#12` in the history list.


    If you accidentally saved a password or other sensitive information to the history,
