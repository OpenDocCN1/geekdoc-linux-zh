    # **LAB 79**


    # Maintain System Time: NTP


    **Lab Objective:**


    Learn how to maintain system time and synchronize the clock with NTP.


    **Lab Purpose:**


    In this lab, you will learn about the classic Network Time Protocol (NTP) and
    its settings for synchronizing the system clock.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


