    \ you should always do—a syntax error in the sudoers file can lock you out of\
    \ your own system!). The addition means that the 'luser' user can run `useradd`\
    \ as root, without being prompted for a password. \"ALL\" here means that it can\
    \ be run on \"ALL\" systems, which in this case is only one, since you aren't\
    \ connected to a NIS domain.\n\nAfter switching to *luser*, you should have been\
    \ able to add another user seamlessly, without being prompted. If you tried any\
    \ other `sudo` command, you would be prompted for a password and the command would\
    \ fail altogether.\n\n*Task 2:*  \nNow run (the first command should all be on\
    \ one line):\n\n- `sudo sh -c 'echo \"luser hard nproc 2\" >> /etc/security/limits.conf'`\n\
    - `sudo su luser`\n- `ulimit -a`\n- `sleep 10000 &`\n- `sleep 10000 &`\n- `exit`\n\
    \nAttempting to run the second `sleep`, you should have been greeted with a mysterious\
    \ error about “Cannot fork”. What's going on here? Your first command applied\
    \ a limit of 2 user processes to the 'luser' user. The shell counts as one process,\
    \ which means luser can't do a whole lot after that! This is why the first `sleep`\
    \ was successful while the second one failed.\n\nRemove the process limit from\
    \ luser in `/etc/security/limits.conf` before moving on.\n\n*Task 3:*  \nNow,\
    \ a few commands to audit user activity and logins:\n\n- `who -a`\n- `w`\n- `lastlog`\n\
    \n*Task 4:*  \nFinally, clean up:\n\n- Run `sudo visudo` and delete the 'luser'\
    \ line that you added\n- `sudo userdel luser`\n- `sudo userdel luser2`\n\nNotes:\
    \  \nSee Lab 74 for more information on how to restrict user password validity\
    \ and other similar features. If you are unable to delete user “luser” at the\
    \ end of the lab, because the user is still used by a process, you can find the\
    \ PID being called to kill. luser needs to log out before deletion.\n\n## LAB\
    \ 97\n\n### Perform Security Administration Tasks: System Auditing\n\n**Lab Objective:**\
    \  \nLearn how to manage and audit ports, processes, and other system aspects.\n\
    \n**Lab Purpose:**  \nIn this lab, you will review a variety of tools used to\
    \ manage services, ports, file permissions, and other features to maintain a secure\
    \ Linux system.\n\n**Lab Tool:**  \nUbuntu 18.04 (or another distro of your choice)\n\
    \n**Lab Topology:**  \nA single Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\
    \n*Task 1:*  \nOpen the Terminal and run:\n\n```bash\nsudo find / -perm /u+s,g=s\
    \ -type f -exec ls -l {} \\; 2>/dev/null\n```\n\nThat's a hairy command, so let's\
    \ break it down. Here, you're finding all files on the system with either the\
    \ setuid or setgid bits set (or both), which are regular files (and not directories)\
    \ or some other special file). Then you execute `ls -l` on each of those files.\
    \ The `2>/dev/null` is just to silence some spurious errors about special filesystems\
    \ like /proc.\n\nThe end result should be a detailed list of possibly “insecure”\
    \ files on your system—files which are run with their owner and/or group permissions\
    \ instead of the permissions of the user who executed them.\n\n*Task 2:*  \nIn\
    \ previous labs, you've used `ss` to list open ports. However, there are other\
    \ approaches.  \nInstall the nmap port scanner: `sudo apt install nmap`\n\nNow\
    \ run a standard nmap scan: `sudo nmap -v -sU -sS -p1-65535 localhost`\n\nThis\
    \ command may take quite some time. It will run a standard UDP and TCP SYN scan\
    \ of every port on your system. An nmap scan, when run from a remote host (which\
    \ you did not do here), is a great way to get a look at open ports on your system\
    \ from an outside perspective.\n\nNotes:  \n`fuser` and `lsof` are two tools which\
    \ can be used to link files and processes, but they work differently. `fuser`\
    \ is handier to answer the question of \"Which process opened this file?\", while\
    \ `lsof` would be better to answer \"Which files did this process open?\"\n\n\
    ## LAB 98\n\n### Setup Host Security: User Security\n\n**Lab Objective:**  \n\
    Learn how to use login-related features to secure a Linux host.\n\n**Lab Purpose:**\
    \  \nIn this lab you will review shadow passwords and login restriction features\
    \ to secure a Linux host.\n\n**Lab Tool:**  \nUbuntu 18.04 (or another distro\
    \ of your choice)\n\n**Lab Topology:**  \nA single Linux machine, or virtual machine\n\
    \n**Lab Walkthrough:**\n\n*Task 1:*  \nWe've discussed the `/etc/shadow` file\
    \ in previous labs, but now we're going to take a closer look at it. The second\
    \ field in a given shadow file entry is the password, obfuscated by a one-way\
    \ hashing algorithm. Most users are probably system users and thus don't have\
    \ passwords, but at least your user should.\n\nTake a look at `man 3 crypt`—this\
    \ is how those hashes are created. The man page notes that a hash is split into\
    \ 3 sections, delimited by dollar signs. The first is an ID denoting the encryption\
    \ method. Look at your shadow hash again—what is the ID number in the first field?\
    \ If it's a 6, then your password is hashed with SHA-512 and you're in good shape.\
    \ If it's a 5, your hash is SHA-256—not the best, but still pretty good. A password\
    \ hash beginning with a 1 is MD5, and only likely if the hash was copied from\
    \ an older system. (If you have any hashes like that, you should run `passwd`\
    \ for those users to change them.)\n\n*Task 2:*  \nNow run: `man 5 nologin`\n\n\
    The `/etc/nologin` file, which disallows non-root logins and shows those users\
    \ a message of whatever is in the file, is great for putting a system into emergency\
    \ maintenance. Aside from that, you probably don’t want it to be present!\n\n\
    Notes:  \ncracklib is a password-cracking library that can be used with tools\
    \ like shadow and PAM to enforce secure password practices.\n"
