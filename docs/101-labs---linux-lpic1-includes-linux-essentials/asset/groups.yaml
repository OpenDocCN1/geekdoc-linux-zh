    # LAB 72


    # Manage User and Group Accounts and Related System Files: Users


    **Lab Objective:**

    Learn how to add, modify, and remove users.


    **Lab Purpose:**

    In this lab, you will learn about the different types of Linux users and a few
    tools to add, modify, and remove them.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `cat /etc/passwd`


    This file is an inventory of all users on your system. The passwd file is a database
    with seven fields, separated by colons:


    +   • Username

    +   • Encrypted password (in practice, hardly ever used—see below)

    +   • User ID

    +   • Group ID

    +   • Comment

    +   • Home directory

    +   • Default shell


    Take note of the *root* user, which should be listed on the first line. This is
    the administrative user, and is the only user that can unconditionally do anything
    on the system. By running'
  - '[PAGE 199]


    a command preceded with **sudo**, you are running that command as the root user.
    (You can also use `sudo -i` or `su` to access a root shell directly.)


    If you look at the user ID''s, you will notice that most of them, on a default
    system, are below 1000. These are *system* users, typically used to *run* specific
    services, rather than running those as root, which can create security problems.
    On most systems, human user ID''s begin at 1000 or 500.


    You can easily see the *passwd* information for your own user with: `grep ^$USER
    /etc/passwd`


    # Task 2:


    Now run: `sudo cat /etc/shadow`


    The *shadow* file is a sensitive database containing hashed user passwords, among
    other information. Be careful with the contents of this file! It contains nine
    fields, again, separated by colons—however, on a default Ubuntu install, only
    the first three are likely to be significant:


    +   1.  Username

    +   2.  Encrypted password

    +   3.  Date of last password change


    The other fields contain information like account expiration dates and minimum/maximum
    password ages, which are not configured on a default system. See `man 5 shadow`
    for more information.


    You can see this information for your own user with: `sudo grep ^$USER /etc/shadow`


    # Task 3:


    Now run:


    ```

    `sudo sh -c ''echo "Hello World" > /etc/skel/hello.txt''`

    ```


    Here, you are adding a file to the `/etc/skel` directory, which determines the
    default files in a new user''s home directory.


    Now:


    +   -   `sudo useradd -m foo`

    +   -   `sudo cat ~/foo/hello.txt`'
  - '[PAGE 200]


    You should see the output “Hello World”. What happened is that you created a new
    user, called foo (using the -m switch to ensure a home directory was created).
    Every file in /etc/skel was then copied to the new user’s home directory.


    Finally, set an initial password for this user with: `sudo passwd foo`


    # Task 4:


    Finally, clean up:


    +   - `sudo rm /etc/skel/hello.txt`

    +   - `sudo userdel foo`

    +   - `sudo rm -r /home/foo`


    # Notes:


    `usermod` is a very useful command for managing users. In addition to adding and
    removing users from groups, it allows you to manage account/password expirations
    and other security features. `usermod` will be discussed in the next two labs.'
