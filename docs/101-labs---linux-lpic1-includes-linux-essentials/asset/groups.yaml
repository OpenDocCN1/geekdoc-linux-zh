    **实验目标：**

    了解一些通常部署在 Linux 服务器上的软件和开发工具。


    **实验目的：**

    在本实验中，你将调研几种常见的 Linux 服务器软件工具。虽然详细配置这些工具超出了本实验的范围，但熟悉它们的应用场景非常重要。


