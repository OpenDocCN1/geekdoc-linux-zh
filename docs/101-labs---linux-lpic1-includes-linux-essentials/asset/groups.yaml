    ## LAB 57

    ### Maintain the Integrity of Filesystems


    **Lab Objective:**

    Learn how to verify filesystem integrity and repair basic problems.


    **Lab Purpose:**

    In this lab, you will use tools such as `fsck` and `xfs_repair` to search for
    filesystem problems, as well as learn how to monitor free space and inodes.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    #### Task 1


    First, set up a dummy block device for use in the rest of this lab:


    - `dd if=/dev/zero of=block.img bs=100M count=10`

    - `sudo losetup -fP block.img`

    - `losetup -a | grep block.img | cut -d: -f1`


    This should print a device name such as `/dev/loop0`. This is the loopback block
    device, and is what should be substituted everywhere you see `[dev]` for the rest
    of this lab (ignore all warnings you may see for `parted`).


    Continue with:


    - `sudo parted [dev] mklabel gpt`

    - `sudo parted [dev] mkpart primary ext4 0 50%`

    - `sudo parted [dev] "mkpart primary xfs 50% -1s"`

    - `sudo mkfs.ext4 [dev]p1`

    - `sudo apt -y install xfsprogs`

    - `sudo mkfs.xfs [dev]p2`

    - `mkdir lab57-ext4 lab57-xfs`

    - `sudo mount [dev]p1 lab57-ext4`

    - `sudo mount [dev]p2 lab57-xfs`

    - `sudo dd if=/dev/urandom of=lab57-ext4/random bs=1M count=500`

    - `sudo dd if=/dev/urandom of=lab57-xfs/random bs=1M count=500`

    - `md5sum lab57-{ext4,xfs}/random`


    What you''ve just done is created two filesystems on your block device and filled
    them up with a file containing random data. Then you obtained the md5 hash of
    each file, which you should save for later.


    #### Task 2


    Now, you get to do something you would never do on a live system... cause damage,
    intentionally!


    - `sudo umount [dev]p1 [dev]p2`

    - `sudo dd if=/dev/urandom bs=1 count=10M of=[dev]p1 seek=1M`

    - `sudo dd if=/dev/urandom bs=1 count=10M of=[dev]p2 seek=1M`


    You''ve just caused some significant corruption to both filesystems, though unfortunately
    because of the nature of such corruption, the results can''t be predicted. What
    you should do is attempt to remount both filesystems and get the MD5 sums again:


    - `sudo mount [dev]p1 lab57-ext4`

    - `sudo mount [dev]p2 lab57-xfs`

    - `md5sum lab57-{ext4,xfs}/random`


    However, it''s possible that `md5sum` or even `mount` will fail for one or both
    filesystems. Make sure the filesystems are unmounted again, then run:


    - `sudo fsck [dev]p1`

    - `sudo xfs_repair [dev]p2`


    You should then be able to mount the filesystems again. However, you may notice
    that the MD5 sums of your "important" data have been permanently altered. This
    is the unfortunate fact of filesystem corruption--not everything can always be
    saved.


    #### Task 3


    Check disk space on both filesystems with:


    - `du -hs lab57*`

    - `df -h [dev]*`


    Are they still full, or were one or both of your files actually deleted because
    of the corruption?


    #### Task 4


    Finally, clean up:


    - `sudo umount lab57*`

    - `sudo losetup -d [dev]`

    - `rm block.img`

    - `rmdir lab57*`


    ### Notes


    Both ext4 and XFS have advanced tuning parameters for a variety of needs. See
    the man pages for `tune2fs`, `xfs_fsr`, and `xfs_db`.

