    \ 96\n\n### 执行安全管理任务：用户审计\n\n**实验目标：**  \n学习如何管理和审计用户及用户限制。\n\n**实验目的：**  \n在本实验中，您将回顾用于管理用户并通过限制其权限来维护安全的多种工具。\n\
    \n**实验工具：**  \nUbuntu 18.04（或您选择的其他发行版）\n\n**实验拓扑：**  \n单台 Linux 机器或虚拟机\n\n**实验步骤：**\n\
