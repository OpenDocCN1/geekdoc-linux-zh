    ## LAB 25: Special Directories and Files


    **Lab Objective:**

    Learn how to use temporary files and directories, symbolic links, and special
    permissions.


    **Lab Purpose:**

    In this lab, you will work with symbolic links, special file/directory permissions,
    and temporary files and directories.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough


    **Task 1:**

    Open the Terminal and run: `ls -ld /tmp`


    Notice the permissions: `drwxrwxrwt`


    The `t` at the end indicates what is called the *sticky bit*. This means that
    only users/groups who own a given file may modify it. This is important on world-writable
    directories, such as those holding temporary files, to prevent users from messing
    with other users’ files.


    **Task 2:**

    Now run:


    - `ln -sv $(mktemp) mytmp`

    - `ls -l mytmp`

    - `rm mytmp`


    What just happened? `mktemp` created a randomly-named temporary file. Then you
    created a *symbolic link* to that file called `mytmp`. The `ls` output shows this
    link. A symbolic link is simply a reference to an existing file. This way, you
    may have multiple references to a single file—edit the original file, and all
    of the references instantly update. This is useful for some system configurations.


    **Notes:**


    In addition to `/tmp`, there is also `/var/tmp`, which is typically used for larger
    and/or longer-lasting temporary files. `/tmp` is usually cleaned on every reboot;
    the same is not necessarily true for `/var/tmp`.


    ## LAB 26: Determine and Configure Hardware Settings: PCI Devices and Peripherals


    **Lab Objective:**

    Learn about gathering information on and configuring PCI devices and peripherals.


    **Lab Purpose:**

    In this lab, you will use tools such as `lsub` and `lspci` to determine hardware
    resources and manipulate USB and PCI devices.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough


    **Task 1:**

    Open the Terminal and run:


    ```bash

    for dev in $(ls /sys/bus/usb/devices/*/product); do echo - "$dev :"; cat $dev;
    done

    ```


    The output will be a list of USB devices connected to your system, such as the
    following:


    ```text

    /sys/bus/usb/devices/1-1/product:: USB Tablet

    /sys/bus/usb/devices/usb1/product:: OHCI PCI host controller

    ```


    What we''re interested in is the USB bus and port from the first field. In this
    example, there are two devices, a USB tablet at `1-1` and a PCI controller at
    `usb1`.


    You may also use `lsub` to gather more information on these devices.


    **Task 2:**

    You will now *optionally* disable and re-enable one of the above USB devices.
    This is optional because if done incorrectly, it could render your system temporarily
    unusable until a reboot.


    Let''s say that you have a webcam at `1-1.6`. This is safe to disable. You would
    run:


    ```bash

    sudo sh -c ''echo 1-1.6 > /sys/bus/usb/drivers/usb/unbind''

    ```


    Test the device you disabled to confirm that it is no longer available. To re-enable
    the device, simply run:


    ```bash

    sudo sh -c ''echo 1-1.6 > /sys/bus/usb/drivers/usb/bind''

    ```


    *(Note: The original text contained `1.1-6` which is likely an OCR error for `1-1.6`
    based on standard Linux device naming conventions, but strictly adhering to "no
    deletion/summary" and correcting obvious errors: `1.1-6` is syntactically weird
    for a bind/unbind echo. However, looking at the context "webcam at 1-1.6", the
    echo should match the device path suffix. I will correct the obvious typo `1.1-6`
    to `1-1.6` as it refers to the specific device mentioned.)*


    **Task 3:**

    Run: `lspci -v`


    This is a list of your PCI devices. Take note of the devices which list kernel
    modules, on the last line beginning with "Kernel modules". You can confirm that
    these modules are loaded by getting a list of the currently loaded kernel modules
    with `lsmod`.


    Now you will remove, and reload, one of these modules. As in the previous step,
    you need to be careful which module you remove, as choosing the wrong one could
    render your system temporarily unusable.


    Removing a sound module, such as `snd_seq_midi`, is safe. Run:


    ```bash

    sudo modprobe -r snd_seq_midi

    ```


    You may confirm that the module is removed with: `lsmod | grep snd_seq_midi`


    Depending on the module you choose, this may or may not have any noticeable effect
    on functionality. There are many Linux kernel modules loaded on a typical system,
    though of course it best not to mess with them unless you know what they do!


    Reload the module with: `sudo modprobe snd_seq_midi`


    **Notes:**


    It is good to understand the `/proc` and `/sys` filesystems—all information on
    USB and PCI devices is stored there, if you know where to look. The next lab will
    dive into these filesystems.


