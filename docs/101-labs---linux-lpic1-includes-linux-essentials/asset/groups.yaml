    # Task 2:


    Now add another user account which we will apply some limitations to:


    ```

    `sudo useradd -s /usr/sbin/nologin bar`

    ```


    You’ve created an account with a special shell that is... well, not a shell at
    all. It just displays a message that the account is not available. (Test this
    with `sudo su bar`) You might use this in combination with the -r flag to create
    a non-interactive system user, solely for the purpose of running daemons or other
    specific processes.


    # Task 3:


    Now run:


    +   - `sudo usermod -s /bin/bash bar`

    +   - `sudo passwd bar`

    +   - `<give the user a password>`

    +   - `sudo chage -E1 bar`

    +   - `su bar`


    Here, you’ve switched to a valid shell and changed the password for user bar,
    but then you used `chage` (change age) to set the account as expired, so you once
    again cannot log in.


    Sometimes you may want to lock a user’s password but not the account itself (preserving
    access for root, or for SSH keys, for example). You would do this with `sudo usermod
    -L bar`


    # Task 4:


    Finally, clean up:


    +   - `sudo userdel foo`

    +   - `sudo userdel bar`


    # Notes:


    It is recommended to look over the `/etc/login.defs` file for a complete understanding
    of limitations and privileges that can be applied to Linux accounts.'
