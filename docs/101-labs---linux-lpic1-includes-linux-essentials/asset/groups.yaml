    ## LAB 75


    ## Automate System Administration Tasks by Scheduling Jobs: Cron


    **Lab Objective:**

    Learn how to use cron utilities to schedule automated system tasks.


    **Lab Purpose:**

    In this lab, you will manage automated system tasks using the classic cron utilities.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    ### Lab Walkthrough:


    ***Task 1:***

    Open the Terminal and run: `cat /etc/crontab`


    In this file, you will likely see a few rows of commands to be run at certain
    times. The first five columns designate the minute, hour, day-of-month, month,
    and day-of-year, respectively, for a given job to be run. Then you will see the
    user (usually root) and, finally, the actual command. See `man 5 crontab` for
    a full description of crontab format.


    On a default Ubuntu installation, /etc/crontab should contain “meta” commands
    to run cron jobs from other files—/etc/cron.hourly, /etc/cron.daily, and so forth.
    Look at these next:


    ```

    ls /etc/cron.{hourly,daily,weekly,monthly,d}

    ```


    As you might guess, these directories hold jobs to be run hourly, daily, weekly,
    monthly, or on some other interval. Inspect a few files to see what jobs are run
    periodically on your system.


    On some systems, a user-based crontab is used. In this case, `run crontab -l`
    and `sudo crontab -l` to view the jobs. These jobs are stored in /var/spool/cron/crontabs.


    ## Task 2


    Run `crontab -e` and add a cron job for your user:


    ```

    * * * * * date > ~/foo

    ```


    Then: `sleep 60 && cat ~/foo`


    You should see that your cron job has run (every minute) and printed the date
    into file foo. Clean up with `crontab -e`, delete the line you added, and `rm
    foo`


    ## Notes


    /etc/cron.allow and /etc/cron.deny control user access to `crontab`. On a default
    Ubuntu system, these files may not exist—according to the man page, that means
    only root should have access to `crontab`, but default system configuration allows
    *all* users access. See `man crontab` to understand how these files work.


    ## LAB 76


    ## Automate System Administration Tasks by Scheduling Jobs: At and Systemd


    **Lab Objective:**

    Learn how to use *at* and Systemd utilities to schedule automated system tasks.


    **Lab Purpose:**

    In this lab, you will manage automated system tasks with Systemd and scheduled
    tasks using *at*.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `sudo apt install at`


    In contrast to *cron*, *at* is used for running one-time jobs at some time in
    the future.


    Now run:


    - `echo "touch foo" | at now + 1 min`

    - `atq`

    - `sleep 60 && ls foo`

    - `rm foo`


    You scheduled a *touch foo* command to be run in the future; *atq* shows this
    job (which you could delete if you wanted to, using *atrm*). One small caveat,
    though—*at* will not necessarily schedule your job *exactly* one minute in the
    future, when used with this syntax. The seconds are truncated, so, in fact, it
    may run less than one second from “now,” at isn’t generally used in scenarios
    requiring such precision!


    Like with *cron*, *at* can be user-restricted in the `/etc/at.allow` and `/etc/at.deny`
    files. In Ubuntu, by default, a blacklist is set up—see this with `cat /etc/at.deny`


    *Task 2:*

    Any Systemd service can be configured with a timer, which can use an OnCalendar
    directive to mimic *cron*, for example:


    ```

    [Timer]

    OnCalendar=*-*-* 03:30:00

    Persistent=true

    ```


    See `man systemd.timer` for more info.


    You can also create transient timer units, a la *at*, with `systemd-run`:


    ```

    systemd-run --on-active=60 touch ~/foo

    ```


    That will touch a file after 60 seconds. This can also be used with pre-existing
    services, for example, if you have a unit called *myunit*:


    ```

    systemd-run --on-active="12h" --unit myunit.service

    ```


    **Notes:**

    Though Systemd can effectively replace both *cron* and *at*, it is not without
    problems. Cron-like jobs especially take far more time to set up within Systemd,
    compared to adding a single line to a crontab file.


    ## LAB 77


    ## Localization and Internationalization: Timezones


    **Lab Objective:**

    Learn how to configure timezone settings.


    **Lab Purpose:**

    In this lab, you will learn how timezones work in Linux and how to configure their
    settings.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run:


    ```

    cat /etc/timezone

    ls -i /etc/localtime

    file /usr/share/zoneinfo/$(< /etc/timezone)

    ```


    These commands just print a bit of information about your configured local timezone.
    `/etc/timezone` contains a designator, while `/etc/localtime` should be a symlink
    to a file under `/usr/share/zoneinfo`. As the third command shows, this is not
    a human-readable file, but `file` can still share some information about it.


    *Task 2:*

    Now run: `tzselect`


    Going through this interactive process will, at the end, print out your timezone
    (which is hopefully already configured) and note how you can make it permanent
    for your user by setting the TZ environment variable.


    Finally, use `timedatectl` to print out some additional information, and `date`
    to get the current time. Both commands have several more options described by
    their man pages.


    **Notes:**

    If your lab machine is a VM running on hardware that is often put into sleep or
    hibernation, you may find that your VM''s RTC time has drifted. To fix this, you
    can enable NTP in the VM:


    ```

    systemctl enable --now systemd-timesyncd

    ```


    ## LAB 78


    ## Localisation and Internationalisation: Locales


    **Lab Objective:**

    Learn how to configure locale settings.


    **Lab Purpose:**

    In this lab, you will learn how locales work in Linux and how to configure their
    settings and environment variables.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `locale`


    You should see a number of variables, the first of which being `LANG`—as you might
    guess, this is the locale setting for your default language. Several other variables
    are listed below it, naming the settings for dates/times, phone numbers, currency,
    and other designations.


    To see the locale settings currently supported by your system: `locale -a`


    And to see supported character maps: `locale -m`


    Your default locale settings are probably some variation of `UTF-8`, which is
    a standard character map on Linux.


    *Task 2:*

    If you''re feeling daring (this is not recommended), you can use `update-locale`
    to change your settings to a radically different language and/or character map.
    For example, `sudo update-locale LANG=<setting>`


    `LANG=C` is notable for being useful in scripting -- it disables localization
    and uses the default language so that output is consistent.


    **Notes:**

    You can use `iconv` to convert text between character encodings.

