  mdcn: "\n如果用户没有提供参数，或者提供了一个没有意义的参数（例如一个单词），你应该打印一条友好的消息，例如“请提供一个数字。”\n\n记得在测试之前将文件设为可执行（使用\
    \ `chmod +x filename`）。关于一种可能的解决方案，请参见下面的 **答案 1**。\n\n### 答案 1\n\n```bash\n#!/bin/bash\n\
    if ! [ “$1” -ge 0 ]\nthen\n    echo “Please give a number.”\n    exit 1\nfi\n\
    for (( n=0; n<= $1; n++ ))\ndo\n    echo $(( $1-$n)) $n\ndone\n```\n\n#### 说明\n\
    \n在实验 15 中，你阅读了有关退出状态的内容。就错误检查而言：你能想出如何在脚本退出之前使用退出状态吗？\n\n# 实验 17\n\n## 选择操作系统\n\
    \n**实验目标：**  \n学习如何根据你的特定目的选择操作系统。\n\n**实验目的：**  \nWindows、OS X 和 Linux 各有其优势、劣势和应用场景。在本实验中，你将复习这些内容。\n\
    \n**实验工具：**  \n连接互联网的设备及网络浏览器\n\n**实验拓扑：**  \n不适用\n\n**实验步骤：**\n\n**任务 1：**  \n\
    与 Windows 和 OS X 不同，Linux 在版本或“发行版”（distros）方面提供了近乎无限的选择。Linux 由开发者社区创建，并几乎可以运行在任何现有硬件上。Linux\
    \ 发行版在实验 1 中已讨论过。探索 Distrotchooser 和 Distrowatch 以了解更多关于众多 Linux 发行版的信息。\n\n**任务\
    \ 2：**  \nOS X 是由 Apple 创建的专有操作系统，设计为仅在 Apple 硬件上运行。现代 OS X 的核心是 Unix，但附带了经过大量重新设计的\
    \ Apple 用户界面以及其他修改。OS X 将功能强大的图形用户界面与 Unix 管理员熟悉的许多工具相结合。\n\n**任务 3：**  \nWindows\
    \ 是由 Microsoft 创建的专有操作系统。尽管是专有软件，它仍然可以在广泛的各种硬件上运行（尽管不如 Linux 那么广泛）。在管理方面，Windows\
    \ 传统上较少关注命令行工具，而更多地关注图形工具。然而，近年来，随着 PowerShell 的出现，至少在 Windows 服务器版本上，这一情况已开始改变。\n\
    \n**说明：**  \n即使 LPIC 考试专注于 Linux，作为一名 Linux 专业人士，你难免会在某个时刻被要求提供与其他操作系统的互操作性。学习\
    \ Windows 和 OS X 的基础知识，以及旨在与它们互操作的 Linux 工具（如 Samba），将有助于你实现这一点。\n\n# 实验 18\n\n\
    ## 理解计算机硬件\n\n**实验目标：**  \n了解构建计算机所需的硬件以及如何从 Linux 与某些硬件进行交互。\n\n**实验目的：**  \n\
    以下是台式机和服务器计算机的主要硬件组件：\n\n- 主板\n- 处理器(s)\n- 内存\n- 电源供应器\n- 硬盘/固态硬盘\n- 光盘驱动器\n-\
    \ 外设\n\n**实验工具：**  \nUbuntu 18.04（或你选择的其他发行版）\n\n**实验拓扑：**  \n单台 Linux 机器，或虚拟机\n\
    \n**实验步骤：**\n\n**任务 1：**  \n打开终端并运行以下命令，以检查支持你 Linux 计算机运行的部分硬件（实际或虚拟化的）：\n\n\
    - lscpu\n- lspci\n- lsusb -t\n- sudo lshw\n- sudo hdparm -I /dev/sd*\n\n**任务 2：**\
    \  \n现在调查一些相关的低级资源，如分区、驱动程序（内核模块）和资源使用情况：\n\n- sudo fdisk -1\n- lsmod\n- df -h\n\
    - free -m\n\n**说明：**  \n如果你想要获取不知如何查找的硬件信息，一个很好的开始方式是探索 /proc 文件系统。上述大多数工具只是收集和格式化\
    \ /proc 中的信息；那里是内核呈现信息的地方。\n\n# 实验 19\n\n## 数据存储位置：进程和配置\n\n**实验目标：**  \n学习如何管理运行中的进程和程序配置。\n\
    \n**实验目的：**  \n在本实验中，你将学习如何配置各种系统进程，并在这些进程运行时如何管理和监控它们。\n\n**实验工具：**  \nUbuntu\
    \ 18.04（或你选择的其他发行版）\n\n**实验拓扑：**  \n单台 Linux 机器，或虚拟机\n\n**实验步骤：**\n\n**任务 1：**\
    \  \n打开终端并运行 `ls /boot`\n\n内容会有所不同，但通常你会看到一个 Linux 内核文件（名称以 `vmlinuz` 开头），initrd\
    \ 文件，System.map，grub 配置目录，有时还有内核配置文件的副本。\n\n此目录中的所有内容，包括 `grub` 配置文件（`/boot/grub/grub.cfg`），都与你的系统引导过程相关——正如你可能预期的那样。除非你知道自己在做什么，否则不想乱动这个目录！\n\
    \n**任务 2：**  \n接下来，运行：`ls /etc`\n\n在 Linux 术语中，'etc' 代表 'editable text configuration'（可编辑文本配置）。`/etc`\
    \ 是所有系统配置的主要目录树；除了少数例外，几乎所有配置都存储在 `/etc` 中，或从中链接。\n\n少数（非用户特定的）例外可能在 /dev、/sys\
    \ 或 /proc 中。这些是特殊的动态生成的文件系统。你偶尔可以从这些文件系统读取信息，但大多数时候你不应该直接写入它们。\n\n**任务 3：**  \n\
