    \ 主机配置为网络客户端。\n\n**实验工具：**\n\nUbuntu 18.04（或你选择的其他发行版）\n\n**实验拓扑：**\n\n一台单独的 Linux\
    \ 机器或虚拟机\n\n**实验步骤：**\n\n*任务 1：*\n\n虽然你可能已经熟悉作为 GUI 工具的 NetworkManager，但本实验将侧重于命令行版本\
    \ `nmcli`。\n\n打开终端，获取网络信息的清晰视图，所有信息集中在一处：\n`nmcli`\n\n假设你的网络连接现在运行正常……所以让我们把它弄断：\n\
    `nmcli n off`\n\n这只是接管了整体网络控制并将其关闭。具体但有效。使用以下命令重新开启：`nmcli n on`\n\n你也可以禁用单个链接、Wi-Fi\
    \ 无线电等。但现在专注于修改值。首先，获取正确的设备：`nmcli d`\n\n你应该有一个通过有线或无线连接连接的设备；从第一列获取该设备名称并在下方使用它：\n\
    \n```\nnmcli d show [device]\n```\n\n现在从第二列获取你的 IP 地址和网关，并将其保存以备后用。\n\n# 任务 2：\n\
    \n现在修改你的 IP 设置：\n\n```\nnmcli d mod [device] ipv4.method manual ipv4.addresses\
    \ [address/netmask] ipv4.gateway [gateway]\n```\n\n理想情况下，你应该为 [address/netmask]\
    \ 和 [gateway] 选择与你已有的不同但略微接近的值。如果你更改了两个值，你的网络几乎肯定会断开（请自行测试）。\n\n如果需要，你可以再次使用 `nmcli`\
    \ 恢复以前的值；该命令会根据你是否使用 DHCP 而有所不同。然而，修复连接最简单、最可靠的方法是做你之前做过的事情……经典的“关闭再开启”：\n\n-\
    \ `nmcli n off`\n- `nmcli n on`\n\n# 注意事项：\n\n另一个用于管理网络配置的极佳工具是 `netplan`。它对客户端的用处较小，对具有更复杂设置的服务端更有用。\n\
    \n# 实验 92\n\n# 基本网络故障排除：现代工具\n\n实验目标：\n学习如何使用 iproute2 排除 Linux 上的网络问题。\n\n实验目的：\n\
    在本实验中，你将体验最新的 Linux 网络工具，其中一些是 iproute2 软件包的一部分。\n\n实验工具：\nUbuntu 18.04（或你选择的其他发行版）\n\
    \n实验拓扑：\n一台单独的 Linux 机器或虚拟机。为了使这些工具正常工作，必须在实验中启用 IPv6，否则所有步骤都会返回“网络不可达”错误。\n\n\
    实验步骤：\n\n任务 1：\n打开终端并运行以下命令，以收集当前网络配置的信息：\n\n- `ip addr show`\n- `ip route show`\n\
    - `ss -ap`\n- `hostname -f`\n- `nmcli`\n\n# **任务 2：**\n\n安装 traceroute：`sudo apt\
    \ install traceroute`\n\n现在运行一些额外的命令，以验证你与 101labs.net 之间的端到端连接性，并跟踪中间的路由。\n\n\
    - `ping 101labs.net`\n- `traceroute 101labs.net`\n- `sudo traceroute -I 101labs.net`\n\
    - `tracepath -b 101labs.net`\n\n这里的第一个 `traceroute` 和 `tracepath` 命令使用的是 UDP，而第二个\
    \ `traceroute` **使用的是 ICMP**。有时这些方法会产生不同的结果；有时则不会。\n\n如果你具有 IPv6 连接性，你还可以尝试这些工具的那些版本。（在撰写本文时，101labs.net\
    \ 没有 IPv6 地址。）\n\n- `ping6 example.com`\n- `traceroute6 example.com`\n- `tracepath6\
