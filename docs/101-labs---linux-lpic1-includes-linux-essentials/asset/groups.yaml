    # LEGAL NOTICE


    The advice in this book is designed to help you achieve the standard of LPIC-1:
    System Administrator. The LPIC-1 will validate the candidate''s ability to perform
    maintenance tasks on the command line, install and configure a computer running
    Linux and configure basic networking. Before you carry out more complex operations,
    it is advisable to seek the advice of experts.


    The practical scenarios in this book are meant only to illustrate a technical
    point and should be used only on your privately owned equipment and never on a
    live network.'
