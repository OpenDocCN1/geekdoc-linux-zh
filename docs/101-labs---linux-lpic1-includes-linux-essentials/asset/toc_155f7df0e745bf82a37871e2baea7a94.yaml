  - '`/etc/resolv.conf` 列出了你的 DNS 服务器 IP 地址，可能还有一些其他相关选项。（正如文件注释中所提到的，现在这已由 systemd-resolved
    接管。）'
- - '###'
  - '`/etc/nsswitch.conf` 稍微超出了本实验的范围，但这里相关的行是以 `hosts:` 和 `networks:` 开头的行。这些行中的下一个词应该是
    `files`，这意味着某些应用程序在查找该信息时将参考你刚刚查看的文件。如果你连接到集中式身份验证（例如，当应该查询 LDAP 服务器而不是 /etc/passwd
    获取信息时），你可能需要对 nsswitch.conf 进行重大编辑。'
