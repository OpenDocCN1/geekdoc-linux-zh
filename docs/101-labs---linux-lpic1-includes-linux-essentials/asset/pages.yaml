  md: '# # LAB 23

    ## Creating Users and Groups


    **Lab Objective:**

    Learn how to create and customize users and groups.


    **Lab Purpose:**

    In this lab, you will learn how to create users and groups, as well as set their
    passwords.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ***Task 1:***

    Open the Terminal and run:


    ```

    `sudo sh -c ''echo "Hello World" > /etc/skel/hello.txt''`

    ```


    Here, you are adding a file to the `/etc/skel` directory, which determines the
    default files in a new user''s home directory.


    Now:


    +   * `sudo useradd -m foo`

    +   * `sudo cat ~/foo/hello.txt`


    You should see the output "Hello World". What happened is that you created a new
    user, called foo (using the `-m` switch to ensure a home directory was created).
    Every file in `/etc/skel` was then copied to the new user''s home directory.


    Finally, set an initial password for this user with: `sudo passwd foo`'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# **Task 2:**


    Now let''s add a system user. Run: `sudo useradd -r bar`


    When adding a system user, `useradd` does not add any account or password aging
    information, and sets a user ID appropriate for a system user (typically below
    1000). It also does not create a home directory unless you specify `-m`.


    # **Task 3:**


    Now let''s create a group and add our new users to it:


    +   - `sudo groupadd baz`

    +   - `sudo usermod -a -G baz foo`

    +   - `sudo usermod -a -G baz bar`


    Verify that the users were added with: `grep ^baz /etc/group`


    # **Task 4:**


    Finally, clean up:


    +   - `sudo rm /etc/skel/hello.txt`

    +   - `sudo userdel foo`

    +   - `sudo userdel bar`

    +   - `sudo groupdel baz`

    +   - `sudo rm -r /home/foo`


    # **Notes:**


    `usermod` is a very useful command for managing users. In addition to adding and
    removing users from groups, it allows you to manage account/password expirations
    and other security features.'
  merge: -1
