  md: '# LAB 19


    # Where Data is Stored: Processes and Configuration


    **Lab Objective:**

    Learn how to manage running processes and program configurations.


    **Lab Purpose:**

    In this lab, you will learn how to configure various system processes and how
    to manage and monitor those processes while they are running.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ***Task 1:***

    Open the Terminal and run `ls /boot`


    The contents will vary, but generally what you will see is a Linux kernel file
    (name starting with `vmlinuz`), initrd file, System.map, a grub configuration
    directory, and sometimes a copy of the kernel configuration.


    Everything in this directory, including the `grub` config file (`/boot/grub/grub.cfg`),
    is related—as you might expect—to your system boot processes. This is one directory
    you don’t want to mess with unless you know what you’re doing!


    ***Task 2:***

    Next, run: `ls /etc`


    In Linux parlance, ''etc'' stands for ''editable text configuration.'' `/etc`
    is the primary directory tree for all system configuration; with few exceptions,
    nearly all configurations are stored in, or linked from, `/etc`.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The few (non-user-specific) exceptions might be in /dev, /sys or /proc. These
    are special, dynamically-generated filesystems. You may occasionally read information
    from these filesystems, but most of the time you shouldn''t be writing directly
    to them.


    # Task 3:


    Run the following commands in your Terminal:


    +   • free -m

    +   • ps -ef

    +   • top # press q to quit


    These are three common tools to monitor processes and their resource usage. (Got
    a runaway process that won''t quit via the normal means? Try kill or pkill.)


    # Notes:


    /dev contains special files called device nodes, which are linked to device drivers.
    /sys and /proc contain files by which the kernel presents non-process and process-related
    information, respectively. (In reality, this is more muddled, but that is the
    ideal separation.)'
  merge: -1
  img_proc: true
