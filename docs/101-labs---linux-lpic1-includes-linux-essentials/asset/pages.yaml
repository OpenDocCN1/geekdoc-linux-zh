- pgno: 127
  md: "# Task 3:\n\nRun: `tar -cf files.tar.gz f*`\n\nNow, with the help of the tar\
    \ archiver, you have your gzipped archive in files.tar.gz … well, sort of.\n\n\
    Normally, with a gzipped tarball, you would be able to extract it with `tar -xf\
    \ files.tar.gz` and get all of the original files back. Instead, you could try\
    \ that yourself now, and you would get the nine .gz files.\n\nThere's a better\
    \ way. Let's blow this up and start over:\n\n```\nrm f*  \ntouch f1 f2 f3 f4 f5\
    \ f6 f7 f8 f9  \ntar -czf archive.tar.gz f*  \ntar --list -f archive.tar.gz\n\
    ```\n\nTa-da! Now you see a list of nine files within your single compressed tarball.\n\
    \n# Task 4:\n\ngzip isn't the only format you can use with tar:\n\n```\ntar -cjf\
    \ archive.tar.bz2 f*  \ntar -cJf archive.tar.xz f*\n```\n\nThe bzip2 and XZ formats,\
    \ respectively, are newer and use different algorithms from gzip, but the end\
    \ result is the same. tar can extract all of its formats in the same way, simply\
    \ by using `tar -xf filename`.\n\n# Task 5:\n\ncpio is another archiving tool\
    \ used, most notably, in the RPM package manager and initramfs. Run:\n\n+   find\
    \ . | cpio -o > lab45.cpio  \n+   cpio -t < lab45.cpio  \n+   rm f1  \n+   cpio\
    \ -i -d f1 < lab45.cpio  \n+   rm f*  \n+   cpio -i -vd < lab45.cpio"
