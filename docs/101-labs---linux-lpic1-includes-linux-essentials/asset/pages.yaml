- pgno: 231
  md: '# **Task 2:**


    You can probably guess what happens next:


    +   - `echo "Hello World" | lpr`

    +   - Locate the file in the directory you identified above (it may have an odd
    name, like stdin__tu_PDF-job_1.pdf), and open it in a PDF viewer or web browser.


    You should find a nondescript PDF file with your text printed in the top left
    corner. If you didn''t change anything, this should be under PDF/ in your home
    directory.


    # **Task 3:**


    Now some other helpful commands:


    +   - `lpr -T gibberish`

    +   - Type some gibberish, followed by Ctrl+C to cancel. (The -T flag also influences
    the filename after printing.)

    +   - `lpq`

    +   - The previous command should tell you the job number (third column) of the
    queued job. Then run: `lprm [number]`

    +   - You canceled the job (if you do it quickly enough—there is a timeout), but
    it will still show up as "completed" via `lpstat -W completed`


    # **Notes:**


    `lpadmin` can be used to add and configure printers which are not auto-detected.
    For example, you would add a cups-pdf printer manually with:


    ```

    sudo lpadmin -p cups-pdf -v cups-pdf:// -E -P /usr/share/ppd/cups-pdf/CUPS-PDF-opt.ppd

    ```'
