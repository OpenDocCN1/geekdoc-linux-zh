  md: '# **LAB 12**


    # Archiving Files on the Command Line


    **Lab Objective:**

    Learn how to create, extract, and examine various types of archive files.


    **Lab Purpose:**

    In this lab, you will learn about zip, gzip, bzip2, and xz compressed archives—as
    well as a tool, called `tar`, to manage most Linux archive types.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ***Task 1:***

    Open the Terminal application and run the following:


    ```

    ```

    mkdir lab12

    cd lab12

    touch f1 f2 f3 f4 f5 f6 f7 f8 f9

    ```

    ```


    ***Task 2:***

    If you''ve worked with Windows, you may be familiar with ZIP files. ZIP is a common
    type of archive which both compresses and stores files.


    Run:


    ```

    ```

    zip files.zip f*

    unzip -l files.zip

    ```

    ```


    You can see that all nine files are included in files.zip, although since they
    were empty there was nothing to compress. You can unzip this archive with `unzip
    files.zip`, but you will be prompted to overwrite the existing files.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Finally, clean up with `rm files.zip`


    # Task 3:


    Though ZIP is a common format and well-supported on Linux, it is not the main
    compression format Linux uses. That would be the classic gzip:


    ```

    gzip f*

    ls

    ```


    Wait a minute… why are there now nine gzipped files instead of just one? And what
    happened to the originals?


    This is why gzip is considered a *compression* format rather than an *archive*
    one. To create a single, easy-to-use archive file, we need a different tool...


    # Task 4:


    Run: `tar -cf files.tar.gz f*`


    Now, with the help of the *tar archiver*, you have your gzipped archive in files.tar.gz...
    well, sort of.


    Normally, with a gzipped tarball, you would be able to extract it with `tar xf
    files.tar.gz` and get all of the original files back. Instead, you could try that
    yourself now, and you would get the nine .gz files.


    There’s a better way. Let’s blow this up and start over:


    ```

    rm f*

    touch f1 f2 f3 f4 f5 f6 f7 f8 f9

    tar -czf archive.tar.gz f*

    tar --list -f archive.tar.gz

    ```


    Ta-da! Now you see a list of nine files within your single compressed tarball.


    # Task 5:


    gzip isn’t the only format you can use with tar:


    ```

    tar -cjf archive.tar.bz2 f*

    tar -cjf archive.tar.xz f*

    ```


    The bzip2 and XZ formats, respectively, are newer and use different algorithms
    from gzip, but the end result is the same. tar can extract all of its formats
    in the same way, simply by using `tar -xf filename`.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Task 6:\nFinally, clean up:\n\n```\n```\n    cd ~\n    rm -r lab12\n```\n\
    ```\n\n# Notes:\n\nZIP, gzip, bzip2, and XZ all have their own strengths and weaknesses.\
    \ You could look for benchmarks on the internet... or, for an extra challenge,\
    \ you could try running your own! You should have ZIP installed but you might\
    \ have to do so if for some reason it's not present."
  merge: -1
  img_proc: true
