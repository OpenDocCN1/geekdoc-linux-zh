- pgno: 217
  md: 'Run `help` at this prompt to see a list of what you can do, or run `quit` to
    quit.


    In comparison with `ntpd`, the chrony FAQ page states "If your computer is connected
    to the Internet only for a few minutes at a time, the network connection is often
    congested, you turn your computer off or suspend it frequently, the clock is not
    very stable (e.g. there are rapid changes in the temperature or it''s a virtual
    machine), or you want to use NTP on an isolated network with no hardware reference
    clocks in sight, `chrony` will probably work much better for you."


    # Notes:


    `hwclock` can be used to check the hardware time, which is not necessarily the
    same as system time (especially when the hardware clock uses a different timezone).
    Run `sudo hwclock` followed by `date`—do they match up?


    The Chrony FAQ page URL is -


    https://chrony.tuxfamily.org/faq.html#_how_does_code_chrony_code_compare_to_code_ntpd_code'
  merge: -1
