  md: '# LAB 64


    # Customize and Use the Shell Environment: User Profiles


    **Lab Objective:**

    Learn about global and user profiles.


    **Lab Purpose:**

    In this lab, you will manage shell profiles and learn which files can be used
    to customize both global profiles and those for specific users.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*


    Open your favorite editor via the terminal, and take a look at the following files
    (some of these files may not exist, that''s normal):


    +   - /etc/profile

    +   - /etc/skel/bash_profile and/or ~/.bash_profile

    +   - /etc/skel/bash_login and/or ~/.bash_login

    +   - /etc/skel/profile and/or ~/.profile

    +   - /etc/bash.bashrc

    +   - /etc/skel/bashrc and/or ~/.bashrc

    +   - /etc/skel/bash_logout and/or ~/.bash_logout


    Bash attempts to read the first four files (in preference order) every time you
    start a *login* shell, while it reads the latter two whenever you start an *interactive*
    shell. Typically, a login shell is started once per boot, or once per SSH login,
    while an interactive shell is started every time you open the Terminal application
    (or a new tab within it)—but, as with all things, there are exceptions. Finally,
    Bash reads ~/.bash_logout when a login shell is exited.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'You won''t necessarily understand everything that''s happening in these files
    right away. The key takeaway is that this is where you can make permanent changes
    to every aspect of a shell''s profile, including environment variables, shell
    options, and even text and background colors.


    *Task 2:*


    Test this theory by adding a simple welcome message. Open `~/.bashrc` in your
    favorite editor and add the following line at the end of the file:


    ```

    echo "Welcome, $USER! You''ve successfully modified the .bashrc file!"

    ```


    Save and quit, exit the terminal, then open a new terminal, and you should be
    greeted with your message.


    Note that this only applies to your user. If you wanted it to apply to a different
    user, you would have to modify that user''s own .bashrc file. To apply it to all
    future users, you would edit /etc/skel/.bashrc, or /etc/bash.bashrc to apply it
    to all *current* (and future) users.


    **Notes:**


    An interesting environment variable to experiment with is PS1. Running `echo $PS1`
    will print out a confusing mess of special symbols, but simply running `PS1="$
    ` will make it immediately apparent that this, in fact, what defines your prompt!'
  merge: -1
