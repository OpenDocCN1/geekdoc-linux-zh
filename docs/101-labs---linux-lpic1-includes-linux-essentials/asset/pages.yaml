- pgno: 191
  md: "All error conditions should print a friendly message and exit with status 1.\
    \ For example, if three arguments are not passed, or the passed directory doesn't\
    \ exist, or one of the *test* arguments is not valid. See **Answer 1** below for\
    \ one possible solution.\n\nFor an extra challenge, you might print all files,\
    \ but sort them according to how many tests they passed.\n\n# Answer 1:\n\n```\n\
    ```\n#!/bin/bash\n\ntest $# -eq 3 || { echo \"Exactly three arguments are required.\"\
    ; exit 1; }\ntest -d $1 || { echo \"Not a directory.\"; exit 1; }\nfiles=$(ls\
    \ $1 2>/dev/null) || { echo \"I can't read that directory.\";\nexit 1; }\n\nfor\
    \ f in $files; do\n   test $2 $1/$f 2>/dev/null\n   rc1=$?\n   test $3 $1/$f 2>/dev/null\n\
    \   rc2=$?\n\n   test $rc1 -gt 1 && { echo \"First test argument is invalid.\"\
    ; exit 1;\n   }\n   test $rc2 -gt 1 && { echo \"Second test argument is invalid.\"\
    ; exit 1;\n   }\n   test $rc1 -eq 0 && test $rc2 -eq 0 && echo $f\ndone\n```\n\
    ```\n\n# **Notes:**\n\nRemember that using */bin/sh* as an interpreter can have\
    \ different results from */bin/bash*! It is good to understand what makes a *Bourne-compatible*\
    \ shell, and what non-Bourne-compatible additions are available in Bash."
  merge: -1
  img_proc: true
