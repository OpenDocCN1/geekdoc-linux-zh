  md: '# **LAB 60**


    # Manage File Permissions and Ownership: File Permissions


    **Lab Objective:**

    Learn how to manipulate permissions and ownership settings of files.


    **Lab Purpose:**

    In this lab, you will learn to use `chmod`, `chown`, and `chgrp`, as well as `umask`.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    # *Task 1:*


    Open the Terminal and run:


    ```

    ```bash

    ● echo "Hello World" > foo

    ● ls -l foo

    ```

    ```


    Look at the first field; you should see `rw-r--r--`.


    This indicates the user, group, and other permissions. The last nine characters,
    in groups of three, denote these permissions. In this instance:


    +   - `rw-` indicates read/write (but not execute) permissions for the user who
    owns the file

    +   - `r--` indicates read-only permissions for the group that owns the file

    +   - `r--` indicates read-only permissions for all non-owners, a.k.a. "world"


    The first character indicates the type of file. In this case it is a regular file;
    directories begin with d.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Who are the user and group owners of this file? The third and fourth fields
    of `ls -l` tell us that. By default, it should be your own user and primary group.


    # Task 2:


    Now run:


    +   - `sudo chown root foo`

    +   - `ls -l foo`

    +   - `cat foo`


    You''ve just changed the user ownership to root, while keeping the group ownership.
    As the file has group- and world-read permissions, you can still see its contents.


    # Task 3:


    Now run:


    +   - `sudo chmod o-r foo`

    +   - `ls -l foo`

    +   - `cat foo`


    That `chmod` command removes read permissions from foo. However, as you still
    have group ownership, you can still see the file''s contents.


    # Task 4:


    Now run:


    +   - `sudo chgrp root foo`

    +   - `sudo chmod 600 foo`

    +   - `ls -l foo`

    +   - `cat foo`


    This `chmod` command sets the permissions explicitly, to read-write for the owning
    user only. As that is root, we can no longer read the file.


    # Task 5:


    The default permissions for a newly created file can be adjusted with `umask`.
    This serves to "mask out," at a bit level, permissions that a new file should
    not have. Run the following


    +   - `u=$(umask)`

    +   - `umask 0777`'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   - touch bar

    +   - ls -l bar

    +   - umask $0


    The bar file should have no permissions set— you’ve masked them all out with umask.


    # Task 6:


    Finally, clean up with sudo rm foo bar


    # Notes:


    The first octal bit of chmod deals with setuid and setgid (and the sticky bit,
    on directories). When set, these bits will run an executable file as the user/group
    owner, rather than the user running the executable. This opens up security risks,
    particularly when a program is owned by root. For this reason, most systems will
    ignore the setuid/setgid bits when set on shell scripts.'
  merge: -1
  img_proc: true
