    **Lab Walkthrough:**\n\n***Task 1:***\nOpen your favorite editor via the terminal\
    \ and create a file called lab66.sh:\n\n```\n#!/bin/sh\ni=0\nwhile test $i -lt\
    \ 5\ndo\n    echo $i\n    i=$((i+1))\ndone\n\nfor file in $(ls /etc)\ndo\n   \
    \ test -r /etc/$file && echo \"$file is readable by $USER.\"\n    test -s /etc/$file\
    \ || echo \"$file has size zero!\"\n    if test -d /etc/$file\n    then\n    \
    \    echo \"$file is a directory.\"\n    fi\ndone\n```"
