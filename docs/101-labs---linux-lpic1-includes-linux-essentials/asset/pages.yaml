  md: '# **LAB 91**


    # Persistent Network Configuration: NetworkManager


    **Lab Objective:**


    Learn how to configure TCP/IP on a Linux host using NetworkManager.


    **Lab Purpose:**


    In this lab, you will learn how to configure a Linux host as a network client,
    using NetworkManager.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*


    While you may have familiarized yourself with NetworkManager as a GUI tool, this
    lab will focus on the command-line version, `nmcli`.


    Open the Terminal and get a nice view of your networking information, all in one
    place:

    `nmcli`


    Presumably, your network connection is working right now... so let''s break it:

    `nmcli n off`


    All this did was take the overall networking control and shut it off. Simplectic,
    but effective. Turn it back on with: `nmcli n on`


    You can also disable an individual link, Wi-Fi radio, etc. But now focus on modifying
    values. First, get the right device: `nmcli d`'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'You should have a device that is connected on a wired or wireless connection;
    get that device name from the first column and use it below:


    ```

    nmcli d show [device]

    ```


    Now grab your IP address and gateway from the second column and save those for
    later.


    # Task 2:


    Now modify your IP settings:


    ```

    nmcli d mod [device] ipv4.method manual ipv4.address [address/netmask]

    ipv4.gateway [gateway]

    ```


    Ideally, you should choose values for [address/netmask] and [gateway] that are
    different from what you already had, but just slightly. Your network will almost
    certainly break if you change both values (test it yourself).


    If you want, you can use `nmcli` again to restore the previous values; the command
    will differ depending on whether you were using DHCP or not. However, the simplest
    and most foolproof way to fix your connection is to do what you did earlier...
    the classic "turn it off and back on again":


    +   - `nmcli n off`

    +   - `nmcli n on`


    # Notes:


    Another great tool for managing network configurations is `netplan`. This is less
    useful for clients, and more useful on servers with more complex setups.'
  merge: -1
  img_proc: true
