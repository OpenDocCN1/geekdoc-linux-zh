    +   * `<type your name>`

    +   * `echo $name`


    This is a simple use of `read`, but it can also be used to read from file descriptors
    rather than standard input. See the man page for more info.


    *Task 2:*

    `seq` is another command that''s fairly straightforward to understand. Run the
