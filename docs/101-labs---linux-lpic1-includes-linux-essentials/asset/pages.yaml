- pgno: 220
  md: '# ## LAB 82


    # System Logging: Logrotate


    Lab Objective:

    Learn how to configure the logrotate to rotate system logs.


    Lab Purpose:

    logrotate is a commonly used tool to rotate logs, i.e. archive them every X days/weeks
    and delete them every Y weeks/months. In this lab, you will learn how to configure
    it.


    Lab Tool:

    Ubuntu 18.04 (or another distro of your choice)


    Lab Topology:

    A single Linux machine, or virtual machine


    Lab Walkthrough:


    Task 1:

    Open the Terminal and run cat /etc/logrotate.conf

    This is the main logrotate configuration file, the one that contains the default
    directives. You may see lines like:


    ```

    weekly

    rotate 4

    create

    ```


    In combination, these lines will save an archive of some log file every week,
    keep each archive for four weeks, and create a new empty log file after rotating
    an older one.


    Additionally, you probably have a directory called /etc/logrotate.d, where some
    package-specific configs are stored. Ubuntu has one for apt, so look at /etc/logrotate.d/apt,
    or another file of your choosing.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "You might see directives here like `rotate 12` (keep for 12 weeks instead of\
    \ 4, or 12 months if it includes *monthly*), `compress` to compress the archives,\
    \ or `notifempty` to ignore the log if it is empty.\n\nSee `man logrotate` for\
    \ more details.\n\n*Task 2:*\n\nNow, with `sudo` (or `sudoedit`), open a text\
    \ editor and create a file called `/etc/logrotate.d/mylog` with the following\
    \ contents:\n\n```\n/var/log/mylog.log {\n    hourly\n    su root syslog\n   \
    \ rotate 2\n    create\n    compress\n    missingok\n}\n```\n\n*Then:* `sudo touch\
    \ /var/log/mylog.log`\n\nNormally you'd have to wait at least an hour to see any\
    \ rotation happen, but you can force the situation with the `-f` switch. Run:\n\
    \n+   -   `sudo logrotate -fv /etc/logrotate.d/mylog`\n+   -   `ls -al /var/log/mylog*`\n\
    \nYou should see a compressed archive of the original file, as `mylog.log.1.gz`,\
    \ and a new log called `mylog.log`. Run that first command twice more. The second\
    \ time you run it will create a second archive file, but on the third run you\
    \ should see a line at the bottom saying “removing old log /var/log/mylog.log.3.gz”,\
    \ as per the configuration file.\n\n*Task 3:*\n\n*Finally, clean up:* `sudo rm\
    \ /etc/logrotate.d/mylog /var/log/mylog*`\n\n*Notes:*\n\n*Typically*, `logrotate`\
    \ is run via a daily cron job. Can you find where this cron job is configured\
    \ on your system? (Hint: See Lab 75!)"
  merge: -1
  img_proc: true
- pgno: 222
  md: "# LAB 83\n\n# System Logging: Journald\n\n**Lab Objective:**  \nLearn how to\
    \ manage and read data from `journald`, the Systemd logger.\n\n**Lab Purpose:**\
    \  \nIn this lab, you will get to know `journald`, the Systemd logging system\
    \ that is slowly replacing classic `syslog` variants in most Linux distros.\n\n\
    **Lab Tool:**  \nUbuntu 18.04 (or another distro of your choice)\n\n**Lab Topology:**\
    \  \nA single Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\n*Task\
    \ 1:*  \nOpen two Terminal windows/tabs.\n\nIn the first one, run: `journalctl\
    \ -f`\n\nIn the second one, run: `systemd-cat echo \"Hello World\"`\n\nNow go\
    \ back to the first tab. Did your friendly message show up in the system logs?\
    \ Hit Ctrl+C to exit.\n\n`systemd-cat` is a convenient tool, like `logger`, that\
    \ can send output directly to the `journald` logs.\n\n*Task 2:*  \nNow look at\
    \ the configuration: `cat /etc/systemd/journald.conf`\n\nOn a default Ubuntu 18.04\
    \ system, you will probably see... a lot of commented-out lines. This is just\
    \ the default configuration, which can still tell you a lot. You can learn the"
  merge: -1
  img_proc: true
- pgno: 223
  md: 'meaning of these options from `man journald.conf`, which is conveniently laid
    out in the same order as the config file.


    Use the two tabs from Task 1, or open a second tab if necessary. In the first
    tab, run `tty`, then save the value it prints out for later.


    In the second tab, open /etc/systemd/journald.conf for editing as root (via `sudo`
    or `sudoedit`). Append these two lines to the bottom of the file:


    ```

    ```text

    ForwardToConsole=yes

    TTYPath=[tty]

    ```

    ```


    ... where `[tty]` is the value printed by `tty` in the other tab. Save and quit
    the editor, then run:


    +   - `sudo systemctl restart systemd-journald`

    +   - `systemd-cat echo "Hello World"`


    Now look back at the first tab again. You should see logs being printed directly
    to your console! This can be useful for monitoring system logs, generally, without
    having to keep a process running.


    # Task 3:


    Clean up:


    +   - Edit /etc/systemd/journald.conf again and delete the two lines you added

    +   - Run `sudo systemctl restart systemd-journald`


    Notes:


    When stored persistently on the disk (which is typically what you want to do,
    as opposed to only storing logs in memory), `journald` logs are stored in /var/log/journal.
    If you try to read these files, however, you will quickly notice that they are
    not the text logs you may be used to! Somewhat inconveniently, `journald` stores
    its logs in a binary format which is only readable by systemd-related tools.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# LAB 84


    # Mail Transfer Agent (MTA) Basics: Aliases and Forwarding


    **Lab Objective:**

    Learn how to perform basic mail forwarding and alias configuration.


    **Lab Purpose:**

    In this lab, you will experiment with the Postfix MTA to learn about aliases and
    mail forwarding.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**

    First, install Postfix: `sudo apt install postfix mailutils`


    On Ubuntu, you will be prompted to ask how you want to configure Postfix initially.
    Choose the "Local only" option, and leave any other options as the default.


    You’ve set up a mail server that is meant only to deliver messages to other local
    users. This means that in the rest of this lab, where you might normally see an
    e-mail address (formatted@like this.com), you will see only a username.


    **Task 2:**

    Now run `cat /etc/aliases`


    This is a system-wide alias list for the purpose of mail redirection. Right now
    the file probably only has one line, which tells Postfix that mail to ‘postmaster’
    should go to root.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Add your own aliases:


    +   - `sudo USER=$USER sh -c ''echo "mymail: $USER" >> /etc/aliases`

    +   - `sudo newaliases`


    The aliases are stored in a database, which `newaliases` refreshes. Now you can
    send a message to the ''mymail'' user and have it forwarded to you: `echo "Hello
    World" | sendmail mymail`


    You might be wondering what `sendmail` is doing there. Sendmail was one of the
    first Linux MTAs, woven into the early fabric of the internet—but that is not
    the MTA you installed above. Because Sendmail was so central to e-mail on Linux
    for many years, most major open-source MTAs, including Postfix, have an emulation
    layer for it.


    # Task 3:


    Now, confirm that you received the message sent to ''mymail'':


    +   - Run: `mail`

    +   - You will see your inbox, in text format. Ideally, the message you sent is
    the first one, but it doesn''t really matter. Enter `1` to read the first message
    in your inbox (including the headers, which you might not normally see—don''t
    be thrown off by this).

    +   - When you''re done, enter `q` to quit.


    # Task 4:


    In addition to system-wide mail forwarding, a user can control their own mail
    forwarding by adding a .forward file to their home directory. Try it yourself:


    +   - `echo root > ~/.forward`

    +   - `echo "Forwarding enabled" | mail -s "A forwarded message" mymail`

    +   - `mail`

    +   - `sudo mail`


    If you did it correctly, the first `mail` command should print "No mail for [username]";
    or at least show an inbox without the message you just sent. root''s inbox should
    show the message instead.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Task 5:


    Finally, clean up:


    +   - rm ~/.forward

    +   - sudo sed -i ''s/my mail://d'' /etc/aliases

    +   - sudo newaliases


    # Notes:


    You might find the `mail` command''s inbox a bit hard to navigate. This is, of
    course, why people install and use their own mail clients. Even on the Linux command
    line, you would typically use something like `mutt` or `alpine`.'
  merge: -1
  img_proc: true
