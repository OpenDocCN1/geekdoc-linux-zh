  md: '# LAB 48


    # Create, Monitor, and Kill Processes: Foreground and Background Jobs


    **Lab Objective:**

    Learn how to run jobs in the foreground and background.


    **Lab Purpose:**

    Sometimes, you want to run a process in Linux and then walk away, or hide the
    job in the background so you don''t see it. In this lab, you will learn how to
    do that.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*


    Open the Terminal and run `sleep 10000`, then press Ctrl+Z. Now run:


    +   * jobs

    +   * bg

    +   * jobs

    +   * fg


    Hit Ctrl+C to cancel the sleep job.


    When you first ran the `sleep` command and then pressed Ctrl+Z, that command was
    *stopped* (although the term “stopped” may be misleading—“paused” is more accurate).
    When stopped, a job is no longer running, ticking down seconds, or whatever it’s
    supposed to be doing. The `bg` command changes that, making the job run in the
    background. You can see the list of running jobs with `jobs`, and bring the most
    recent background job into the foreground with `fg`. Note that you can run `fg`
    on stopped jobs as well; you don''t have to start them running first.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'To run a task in the background directly, simply append a &, like: `sleep 10000
    &`


    # **Task 2:**


    Run `sleep 10000 &`, then exit your terminal completely by closing the window
    (do not use the `exit` command).


    When you open a new terminal, run `ps -ef | grep sleep` and you should find that
    your sleep process has terminated. To keep a job running even after closing a
    shell session, run the command under `nohup`:


    ```

    `nohup sleep 10000 &`

    ```


    If you exit the terminal now and come back, you will still find that process running.
    `nohup` causes a command to ignore what''s called the `hangup` signal.


    # **Task 3:**


    At times, you may need to run a normal foreground process, but still have it running
    even after you have walked away. This is more common on servers, where an admin
    will connect via OpenSSH and wants to decouple a running process from their own
    shell, while still monitoring for problems.


    There are two tools, `screen` and `tmux`, which can help with this, but on a default
    setup you''ll need to install them first: `sudo apt -y install screen tmux`


    `screen` and `tmux` operate slightly differently, but the principles are the same.
    Start with `screen`:


    +   * `screen`

    +   * `i=0; while true; do i=$((i+1)); echo $i; sleep 1; done`


    Now hit Ctrl+A, followed by D. These keystrokes will detach from your `screen`
    session and return to your shell. You can view these sessions with `screen -list`.
    Now:


    +   * `tmux`

    +   * `j=0; while true; do j=$((j+1)); echo $j; sleep 1; done`


    Now hit Ctrl+B, followed by D. Again, this will detach from the session and put
    you back at the shell, but your process is still running. You view these sessions
    with `tmux ls`.


    Finally, return to each session, respectively, with `screen -x` and `tmux attach`.
    (Hit Ctrl+C and run `exit` in between them to terminate the processes.) If there
    is more than one'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'session, you will be prompted to choose one, otherwise the command will reattach
    to the running session.


    **Notes:**

    `screen` and `tmux` have a variety of options, comparable to text editors in some
    respects. Neither of them is “better,” but you might want to explore both tools
    and decide which you prefer.'
  merge: -1
