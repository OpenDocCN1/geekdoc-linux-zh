  md: "# LAB 66\nCustomize or Write Simple Scripts: Standard Syntax\n\n**Lab Objective:**\n\
    Learn about standard shell syntax specific to scripting setup.\n\n**Lab Purpose:**\n\
    In this lab, you will learn about standard shell scripting syntax, such as tests\
    \ and control flow.\n\n**Lab Tool:**\nUbuntu 18.04 (or another distro of your\
