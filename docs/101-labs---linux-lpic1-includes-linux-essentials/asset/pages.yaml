    \ related to one another?\n\n*Task 2:*  \nIf you haven't already done so, consider\
    \ that you are about to install a Linux distro for the first time. Think about\
    \ what your needs would be on a desktop, or a server, or both. Then take this\
    \ quiz: https://distrochooser.de/en\n\n*Task 3:*  \nMake a note of your results\
    \ from Task 2. Visit the websites of any distros that look interesting to you.\
    \ What are their use cases and development philosophies (if any)?\n\n*Task 4:*\
    \  \nNow it is time to install a Linux distro for use in the rest of the labs.\
