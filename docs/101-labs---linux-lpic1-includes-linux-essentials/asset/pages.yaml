- pgno: 20
  md: "Enter the details for your e-mail account, then click Continue. Many common\
    \ mail providers are included in Mozilla’s own database and will require no further\
    \ configuration. For example, if you have a Gmail account, Thunderbird will set\
    \ it up for you automatically once you’ve provided credentials.\n\nIf your e-mail\
    \ service is not auto-configured, you will have to click “Manual config” (on the\
    \ next screen) to enter your server details. Check with your mail provider for\
    \ the correct values to enter.\n\n# *Task 3:*\n\nWhat if you want to use an application\
    \ that isn’t already installed? You will have to install it! Fortunately, with\
    \ Linux package managers, this is easy to do. Search for “GIMP” and install it\
    \ with Ubuntu Software. Then, familiarize yourself with GIMP as well. GIMP is\
    \ an image editing application.\n\n# *Task 4:*\n\nUnder the hood, Ubuntu Software\
    \ uses a package manager called *apt*. Different Linux distros use different package\
    \ managers, but their primary purpose is the same—to provide a centralized location\
    \ from which to install and update thousands of common software packages.\n\n\
    Can you match the following distros below with their default package managers?\n\
