    **Lab Walkthrough:**


    *Task 1:*

    It is important to understand that, although shell globbing shares some commonalities
    with regular expressions, Bash itself does not recognize the full regex syntax.
    Instead, Bash simply recognizes and expands wild cards.


    Open the **Terminal** and run:


    +   • `mkdir lab44`

    +   • `cd lab44`

    +   • `touch a1 a2 a12 b1 b2 b12 c1 c2 c12`


    *Task 2:*

    To understand how advanced globbing works, run the following commands and observe
    the output (on the right):


    +   • `ls a?` a1 a2'
  merge: -1
