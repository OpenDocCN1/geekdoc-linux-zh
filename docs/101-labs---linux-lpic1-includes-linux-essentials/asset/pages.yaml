    give to it. This might not seem very useful, until…


    Task 2:

    Now enter the following four commands, in order:


    ```

    quote=''cat /etc/issue''

    backquote=`cat /etc/issue`

    echo $quote

    echo $backquote

    ```


    Here, `quote` and `backquote` are called *variables*. In the first two lines,
    we set them to the values `“cat /etc/issue”` and `` `cat /etc/issue` ``, respectively.
    (We’ll get to the difference between quotes and backquotes in a minute.) In the
    last two lines, we reference the variables by putting `$` before them, and print
    out their contents.'
