  md: '# LAB 49


    # Create, Monitor, and Kill Processes: Process Monitoring


    **Lab Objective:**

    Learn how to monitor processes and their resource usage.


    **Lab Purpose:**

    In this lab, you will learn how to monitor a number of metrics for both foreground
    and background processes.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    ***Task 1:***

    If you weren’t careful to terminate all of your sleep processes from Lab 48, you
    might have a stray or two running. Let’s find out:


    ```

    ps -ef

    ```


    Well, that’s a lot of output! You could maybe filter it through `a | grep sleep`
    or use `ps` without arguments, but there’s a better way:


    ```

    pgrep -a sleep

    ```


    `pgrep` supports regex and has a number of matching options to make sure you find
    the right process(es).'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Task 2:


    A sleep process isn''t going to use many system resources, but plenty of other
    processes might. It''s important to know how to monitor those.


    Take a look at `free -h`. This gives you an output of system memory usage. The
    most generally useful columns here are “total,” “used,” and “available.” The “available”
    column offers an estimate of memory which is free for starting new processes without
    swapping. That isn''t the same as “free” memory, which is often low on Linux systems.
    This is because the OS can take advantage of this memory for performance reasons,
    while still holding it as “available” for user processes.


    `free` has a `-s` switch to automatically print the output every N seconds. That''s
    useful in its own right, but wouldn''t you like to have that ability for every
    command? Then `watch` might be for you! `free -h -s 10` is equivalent to `watch
    -n 10 free -h`


    Finally, take a look at the `top` command. Running `top` opens a rather confusing
    output screen that''s continually changing, but one of its most useful capabilities
    may be simply sorting processes by CPU or memory usage. When in `top`, use the
    `<` and `>` keys to shift the sorting column over to the metric you''re interested
    in. In the upper panel, you can also see the system load, a count of running processes,
    and some CPU and memory metrics. Finally, press ''q'' to quit.


    It is strongly recommended to spend some time reading the `top` man page, as this
    is one of the most featureful system monitoring tools that is installed by default.


    # Notes:


    `uptime`, despite the name, is another quick way to get system load. However,
    `top` also shows this, as well as lots of other useful information.'
  merge: -1
  img_proc: true
