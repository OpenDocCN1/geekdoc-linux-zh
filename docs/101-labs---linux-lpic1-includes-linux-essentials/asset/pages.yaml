  md: '# *Task 2:*


    In Lab 46, you learned how to redirect command output. Now run:


    ```

    ```bash

    echo "Hello World" | tee hello

    cat hello

    ```

    ```


    What''s going on here? The *tee* command redirects output to a file while also
    sending it to stdout. You can use a special `|&` pipe to redirect both stdout
    and stderr:


    ```

    ```bash

    rm hello

    ls hello |& tee hello

    cat hello

    ```

    ```


    *tee* also has a `-a` switch to append to the file rather than overwriting it.


