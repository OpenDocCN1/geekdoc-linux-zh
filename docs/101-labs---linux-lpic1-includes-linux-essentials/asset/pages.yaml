- pgno: 81
  md: '# **Task 2:**


    You will now **optionally** disable and re-enable one of the above USB devices.
    This is optional because if done incorrectly, it could render your system temporarily
    unusable until a reboot.


    Let''s say that you have a webcam at 1-1.6. This is safe to disable. You would
    run:


    ```

    ```bash

    sudo sh -c ''echo 1.1-6 > /sys/bus/usb/drivers/usb/unbind''

    ```


    ```


    Test the device you disabled to confirm that it is no longer available. To re-enable
    the device, simply run:


    ```

    ```bash

    sudo sh -c ''echo 1.1-6 > /sys/bus/usb/drivers/usb/bind''

    ```


    ```


    # **Task 3:**


    Run: `lspci -v`


    This is a list of your PCI devices. Take note of the devices which list kernel
    modules, on the last line beginning with "Kernel modules". You can confirm that
    these modules are loaded by getting a list of the currently loaded kernel modules
    with `lsmod`


    Now you will remove, and reload, one of these modules. As in the previous step,
    you need to be careful which module you remove, as choosing the wrong one could
    render your system temporarily unusable.


    Removing a sound module, such as snd_seq_midi, is safe. Run:


    ```

    ```bash

    sudo modprobe -r snd_seq_midi

    ```


    ```


    You may confirm that the module is removed with: `lsmod | grep snd_seq_midi`


    Depending on the module you choose, this may or may not have any noticeable effect
    on functionality. There are many Linux kernel modules loaded on a typical system,
    though of course it best not to mess with them unless you know what they do!


    Reload the module with: `sudo modprobe snd_seq_midi`


    # **Notes:**


    It is good to understand the /proc and /sys filesystems—all information on USB
    and PCI devices is stored there, if you know where to look. The next lab will
