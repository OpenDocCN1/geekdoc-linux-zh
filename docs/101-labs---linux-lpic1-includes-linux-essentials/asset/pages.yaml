  md: '# LAB 41


    # Work on the Command Line: Environment Variables, Types, and History


    **Lab Objective:**

    Learn about Bash environment variables, types, and how to use the shell history.


    **Lab Purpose:**

    The Bash command shell is pre-installed on millions of Linux computers around
    the world. Understanding how this shell works is a critical skill for working
    with Linux.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**

    *Task 1:*

    Open the Terminal application, then enter: `echo $PATH`


    The `PATH` environment variable lists all locations that Bash will search when
    you enter a command with a *relative path*. A *relative path* example is `bash`,
    compared to `/bin/bash`, which is an *absolute path*.


    There are other environment variables as well. You can view all of them, and their
    values, using the `env` command.


    *Task 2:*

    You can add or modify an environment variable with `export`. For example:


    ```c

    export PATH=${PATH}:../

    ```

    In most cases, this change will disappear when you exit Bash, but the advantage
    of `export` is that child processes will now be able to see the new/modified variable.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'For example:


    +   - foo=123

    +   - export bar=456

    +   - bash

    +   - echo $foo $bar


    This prints 456 because only bar is seen by the child shell.


    # Task 3:


    Another useful Bash command is called type. Use type to figure out information
    on other commands or functions:


    ```

    type -a date

    type -a ff

    type -a echo

    type -a ls

    ```


    type will tell you if a command/shell function is a binary file (like /bin/date),
    a shell built-in (like help), an alias (which you can view with alias), or a shell
    keyword (like if or while).


    # Task 4:


    Enter history to see a history of commands you have typed into Bash.


    To repeat a command, simply enter ! and then the appropriate number. For example,
    !12 will execute command #12 in the history list.


    If you accidentally saved a password or other sensitive information to the history,
    you may use, for example, history -d 47 to delete command #47 from the list, or
    even history -c to clear the history altogether.


    If you want to save your current shell’s history to another file, use history
    -w filename


    The default filename Bash saves its history to is .bash_history. However, by default,
    it only saves at the end of a session. If your session crashes, or you open multiple
    sessions, etc., then your shell history could become incomplete or out of order.


    **Notes:**

    If you wish to permanently modify an environment variable or other shell setting,
    look into the .bashrc and .bash_profile files.'
  merge: -1
  img_proc: true
