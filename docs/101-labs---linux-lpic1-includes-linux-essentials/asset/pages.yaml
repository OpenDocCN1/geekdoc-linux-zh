  md: '# LAB 46


    # Use Streams, Pipes, and Redirects: Redirection and File Descriptors


    **Lab Objective:**

    Learn how to redirect input and output in Bash.


    **Lab Purpose:**

    Bash has a commonly-used feature, known as I/O redirection, that makes life easier
    when using Linux. In this lab, you will learn how to make use of this powerful
    feature.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal application and run:


    ```

    ```bash

    mkdir lab46

    cd lab46

    echo "hello world" > hello

    cat hello

    ```

    ```


    You just *redirected* the output from your `echo` command into the hello file.
    The `>` is a shortcut; the proper version of this would be `1>`, where `1` is
    called a *file descriptor*, which references the *standard output*.


    *Task 2:*

    Now run:


    ```

    ```bash

    ls nonexistent 2>> hello

    cat hello

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Based on the new contents of the hello file (''ls: cannot access ‘nonexistent’:
    No such file or directory''), what can you surmise about the function of ?>?''>
    Here, 2 is a file descriptor for standard error.


    # Task 3:


    Sometimes, you want to redirect both output and error to the same place. In ye
    olden days, you would have to do something ugly like this: ls foo > bar 2>&1


    However, modern versions of Bash have an easy-to-use shortcut: ls foo >& bar


    # Task 4:


    We''ve talked about redirecting output, but what about input? To learn about that,
    run the following commands:


    ```

    ```

    cat < hello


    read foo << "foo"

    echo $foo

    ```

    ```

    cat << END-OF-FILE > goodbye

    hello

    goodbye

    END-OF-FILE

    cat goodbye

    ```

    ```


    In short: < redirects input from a file name, << starts a here document, and <<<
    redirects input from another command.


    # Task 5:


    You can also create your own file descriptors. Observe:


    +   - exec 3> foo

    +   - echo "Hello World" >&3

    +   - cat foo

    +   - exec 3>&-

    +   - echo "fail" >&3


    What this is doing is opening file descriptor 3 (for both reading and writing),
    with the file foo, and sending output to that. The fourth line then closes the
    file descriptor, causing the last echo command to fail.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '**Task 6:**


    Finally, clean up:


    ```

    cd ~

    rm -r lab46

    ```


    **Notes:**


    To open a file descriptor for reading only, you could use `exec 3< file`, or for
    writing only, `exec 3> file`.'
  merge: -1
