  md: "# LAB 74\n\n# Manage User and Group Accounts and Related System Files:  \n\
    Special Purpose Accounts\n\n**Lab Objective:**  \nLearn how to manage special-purpose\
    \ user accounts.\n\n**Lab Purpose:**  \nIn this lab, you will learn about the\
    \ special purpose and limited user accounts, and how to create and manage them.\n\
    \n**Lab Tool:**  \nUbuntu 18.04 (or another distro of your choice)\n\n**Lab Topology:**\
    \  \nA single Linux machine, or virtual machine\n\n# **Lab Walkthrough:**\n\n\
    *Task 1:*  \nOpen the Terminal and add a system user: `sudo useradd -r foo`\n\n\
    When adding a system user, `useradd` does not any account or password aging information,\
    \ and sets a user ID appropriate for a system user (typically below 1000). It\
    \ also does not create a home directory unless you specify -m.\n\n`getent` is\
    \ a cleaner way of getting entries from `passwd`, `group`, and other administrative\
    \ databases. Inspect the new user with: `sudo getent passwd foo`\n\n`getent --help`\
    \ will tell you which databases are supported."
