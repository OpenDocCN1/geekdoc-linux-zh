  md: '# LAB 62


    # Create and Change Hard and Symbolic Links


    Lab Objective:

    Learn how to create and manage hard links and symbolic links.


    Lab Purpose:

    In this lab, you will work with hard links, symbolic (soft) links, and learn the
    difference between copying and linking.


    Lab Tool:

    Ubuntu 18.04 (or another distro of your choice)


    Lab Topology:

    A single Linux machine, or virtual machine


    Lab Walkthrough:


    Task 1:

    Open the Terminal and run:


    ```

    touch foo

    ln -sv foo myfoo

    ls -l myfoo

    echo hello > foo

    cat myfoo

    rm myfoo

    ls -l foo

    ```


    What just happened? You created a symbolic link to a file (foo) called myfoo.
    The ls output shows this link. A symbolic link is simply a reference to an existing
    file. This way, you may have multiple references to a single file—edit the original
    file, and all of the references instantly update, as shown by cat.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'When you remove the link, the original file still remains. (If you remove the
    original file while keeping the symlink, you will have what''s called a *broken
    link*, just like on the internet.) This is useful for some system configurations.


    # ### Task 2:


    Now run:


    +   * ln -v foo myfoo

    +   * echo goodbye > foo

    +   * cat myfoo

    +   * rm foo

    +   * ls -l myfoo

    +   * cat myfoo


    You just created a different type of link, called a *hard link*. Hard links behave
    similarly to symlinks in the sense that when the original is modified the links
    follow, and vice versa. However, a hard link keeps its data if the original file
    is deleted. Hard links also cannot be made across filesystem or partition boundaries,
    and directories cannot be hard-linked.


    # ### Task 3:


    Finally, clean up with `rm myfoo`


    # ### Notes:


    Under the hood, hard links are really acting upon *inodes*. A hard link creates
    another file pointing to the same inode as the original file. (Symlinks work at
    a higher level, pointing directly to a file or directory name.) You can see the
    inode number with `ls -i`, or see how many hard links share a given file''s inode
    in the second column of `ls -l`'
  merge: -1
  img_proc: true
