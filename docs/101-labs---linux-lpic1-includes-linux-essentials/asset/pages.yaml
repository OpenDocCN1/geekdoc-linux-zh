  md: '# LAB 95


    # Configure Client-Side DNS: systemd-resolved


    **Lab Objective:**

    Learn how to use Systemd utilities to configure client-side DNS.


    **Lab Purpose:**

    In this lab you will work with Systemd to configure and troubleshoot DNS resolution.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `systemd-resolve --status`


    This is another, Systemd-friendly way of getting your DNS servers, along with
    some other information. Hold onto those nameserver addresses for below.


    Most likely your DNS servers will be listed as local, under your main network
    interface, rather than global. You can edit the global nameservers this way:


    +   - Add a line like `DNS=1.2.3.4 5.6.7.8` to `/etc/systemd/resolved.conf`

    +   - Run: `sudo systemctl restart systemd-resolved`


    But in this case, you can also just change the DNS servers attached to the current
    interface (which you should identify the name of above, e.g. enp0s3):


    ```

    systemd-resolve --set-dns=1.2.3.4 --set-dns=5.6.7.8

    --interface=[interface]

    ```'
