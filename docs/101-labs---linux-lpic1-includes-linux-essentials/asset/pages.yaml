  md: '# LAB 61


    # Manage File Permissions and Ownership: Directory Permissions


    **Lab Objective:**

    Learn how to manipulate permissions and ownership settings of directories.


    **Lab Purpose:**

    In this lab, you will learn to use `chmod`, `chown`, and `chgrp`, as well as `umask`,
    and their implications for directories.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run:


    ```

    `   mkdir foo`

    `   echo "Hello World" > foo/bar`

    `   ls -la foo`

    ```


    Look at the first field; you should see `drwxr-xr-x`


    This indicates the user, group, and other permissions. The first ‘d’ just indicates
    a directory. The last nine characters, in groups of three, denote these permissions.
    In this instance:


    +   *   `rwx` indicates read/write/execute permissions for the user who owns the
    file

    +   *   `r-x` indicates read/execute permissions for the group that owns the file

    +   *   `r-x` indicates read/execute permissions for all non-owners, a.k.a. “world”


    Who are the user and group owners of this file? The third and fourth fields of
    `ls -la` tell us that. By default, it should be your own user and primary group.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# **Task 2:**


    Now run:


    +   - sudo chown root foo

    +   - ls -la foo

    +   - cat foo/bar


    You’ve just changed the user ownership to root, while keeping the group ownership.
    As the directory has group- and world-read permissions, you can still see its
    contents.


    # **Task 3:**


    Now run:


    +   - sudo chmod o-r foo

    +   - ls -la foo

    +   - cat foo/bar


    That chmod command removes read permissions from foo. However, as you still have
    group ownership, you can still see the file’s contents.


    # **Task 4:**


    Now run:


    +   - sudo chgrp root foo

    +   - ls -la foo

    +   - ls -ld foo

    +   - cat foo/bar


    You’ve now set yourself up with execute-only permissions on the foo directory,
    which is an interesting scenario. You no longer have permissions to view the contents
    of the directory, nor to add new files to it… but if you already know that a given
    file exists, your permissions for that file still allow you to act on it. In this
    example, you can view the contents of foo/bar, and even still modify them! This
    also applies to any subdirectories under foo.


    # **Task 5:**


    Now run:


    +   - sudo chmod 2777 foo

    +   - touch foo/baz

    +   - ls -l foo/baz'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'What you did was set the setgid bit for this directory, which causes files
    created under it to have the same group ownership as the directory itself. In
    practice, this is a way to ensure a group of users sharing files doesn''t have
    to worry as much about permissions.


    # Task 6:


    The default permissions for a newly created file can be adjusted with `umask`.
    This serves to "mask out," at a bit level, permissions that a new file should
    not have. Run the following


    +   - `u=\$(umask)`

    +   - `umask 0777`

    +   - `mkdir bar`

    +   - `ls -ld bar`

    +   - `umask \$u`


    The bar directory should have no permissions set—you''ve masked them all out with
    `umask`.


    # Task 6:


    Finally, clean up with `sudo rm -r foo bar`


    # Notes:


    Another special bit specific to directories is called the sticky bit, which is
    covered in Lab 25. This bit, set on a world-writable directory, ensures that users
    can only remove or modify files that they themselves own. This is most useful
    on `/tmp`.'
  merge: -1
  img_proc: true
