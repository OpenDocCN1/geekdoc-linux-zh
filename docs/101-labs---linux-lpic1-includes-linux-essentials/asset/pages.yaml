  md: '# LAB 8

    # Using the Command Line to Get Help


    **Lab Objective:**

    Learn how to read various manuals from the command line.


    **Lab Purpose:**

    In a world of Google, Stack Overflow, and *Wikipedia*, sometimes we forget that
    Linux comes with its own library of documentation!


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    # *Task 1:*


    In Linux, there are three fairly reliable ways to obtain information on a given
    tool. Not every tool has all three options available. The `date` command does,
    so we will use it as an example.


    Open the Terminal application, then enter: `date --help`


    This is the quick, concise way of finding information about a given command. Most
    commands support either the `-help` or `-h` flags. Sometimes, though, you will
    run into a command that doesn’t, or you just need more information than the quick
    help offers...


    # *Task 2:*


    Enter: `man date`


    `man` is short for *manual*, and is the most common way to provide documentation.
    Unlike quick help flags, it also is not limited to commands—you can use `man`
    pages to get information about *system* and *library* calls, special files, file
    formats, and even `man` itself (try entering `man man`).'
  merge: -1
  img_proc: true
- pgno: 35
  md: '*Task 3:*

    *Enter:* `info date`


    When even `man` isn''t enough, sometimes you may need to rely on `info`. `info`
    is not the most convenient tool for casual browsing, but it provides the most
    details on any given aspect of a Linux system.


    **Notes:**

    Using unknown flags, like `--help` and `-h`, could potentially be risky, especially
    when a command is run as root. Do you understand why?'
  merge: -1
  img_proc: true
