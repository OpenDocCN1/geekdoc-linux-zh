  md: '# LAB 6


    # Command Line Basics: Syntax and Quoting


    Lab Objective:

    Learn basic Linux commands and shell syntax.


    Lab Purpose:

    The Bash command shell is pre-installed on millions of Linux computers around
    the world. Understanding how this shell works is a critical skill for working
    with Linux.


    Lab Tool:

    Ubuntu 18.04 (or another distro of your choice)


    Lab Topology:

    A single Linux machine, or virtual machine


    Lab Walkthrough:


    *Task 1:*

    Open the Terminal application, then enter: echo Hello World


    The `echo` command simply prints out all of the "words," or arguments, that you
    give to it. This might not seem very useful, until...


    *Task 2:*

    Now enter the following four commands, in order:


    ```

    quote=''cat /etc/issue''

    backquote=`cat /etc/issue`

    echo $quote

    echo $backquote

    ```


    Here, quote and backquote are called variables. In the first two lines, we set
    them to the values ''cat /etc/issue'' and `cat /etc/issue`, respectively. (We''ll
    get to the difference between quotes and backquotes in a minute.) In the last
    two lines, we reference the variables by putting $ before them, and print out
    their contents.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Task 3:


    To understand single quotes, double quotes, and backquotes, enter the following:


    ```

    hello="echo hello"


    echo "$hello"


    echo ''$hello''


    echo `$hello`

    ```


    The output should be as follows:


    ```

    echo hello

    $hello

    hello

    ```


    Double quotes allow for variables to have their values referenced. Single quotes
    are always literal, while backquotes *execute* the command (including variable
    references) within those quotes.


    # Notes:


    In some cases, you will want to reference variables with the `$\{variable\}` syntax.
    This is equivalent to `$variable`, but the reasons for choosing one over the other
    are beyond the scope of this lab.


    Backquotes also have an alternative syntax:


    ```

    $(echo hello)

    ```


    This syntax is generally preferred over backquotes. We only mention backquotes
    to distinguish them from single quotes and ensure the differences are clear.'
  merge: -1
  img_proc: true
