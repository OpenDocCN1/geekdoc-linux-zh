  md: '# **LAB 79**


    # Maintain System Time: NTP


    **Lab Objective:**


    Learn how to maintain system time and synchronize the clock with NTP.


    **Lab Purpose:**


    In this lab, you will learn about the classic Network Time Protocol (NTP) and
    its settings for synchronizing the system clock.


    **Lab Tool:**


    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**


    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    **Task 1:**

    Open the Terminal and run: `sudo apt install ntp ntpdate`


    Now view the main NTP configuration file with: `cat /etc/ntp.conf`


    NTP works by synchronizing time in a tree topology—your lab machine gets its time
    from a distro-specific pool of servers, specified by “pool” (for example, *ubuntu.pool.ntp.org*).
    Ubuntu’s own servers get their times from some upstream source, and so on, all
    the way up to a system of atomic clocks in laboratories worldwide.


    **Task 2:**

    Now run:


    +   - `sudo systemctl stop ntp.service`

    +   - `sudo ntpdate ntp.ubuntu.com`


    (You can, of course, use a different time server in place of ntp.ubuntu.com.)'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'After a few seconds, you should see output indicating that `ntpd` has updated
    the system time, noting where it got the time from and what the offset adjustment
    was.


    `ntpd` can be useful for updating the system time on every boot, sometimes before
    `ntpd` (the NTP daemon) takes over, or for synchronizing the time manually on
    servers that usually have restricted or no internet access. Beyond that, however,
    `ntpd` is recommended instead of running `ntpd` via `cron`.


    **Notes**


    `ntpd` is a command, mostly useful for debugging, that can be used to query NTP
    servers for various information.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# LAB 80


    # Maintain System Time: Chrony


