  md: "# **LAB 81**\n\n# System Logging: Rsyslog\n\n**Lab Objective:**  \nLearn how\
    \ to configure the `rsyslog` logging daemon.\n\n**Lab Purpose:**  \nIn this lab,\
    \ you will learn about basic configuration of `rsyslog` and its different logging\
    \ options.\n\n**Lab Tool:**  \nUbuntu 18.04 (or another distro of your choice)\n\
    \n**Lab Topology:**  \nA single Linux machine, or virtual machine\n\n**Lab Walkthrough:**\n\
    \n+   *Task 1:*  \n+   Open two Terminal windows/tabs.\n\nIn the first one, run:\
    \ `tail -f /var/log/syslog`\n\nIn the second one, run: `logger \"Hello World\"\
    `\n\nNow go back to the first tab. Did your friendly message show up in the system\
    \ logs? Hit Ctrl+C to exit `tail`.\n\n> `logger` is a generic utility for sending\
    \ logs to a number of daemons, including `rsyslog`, and `journal` which we will\
    \ discuss in Lab 83.\n\n+   *Task 2:*  \n+   Now look at the configuration:\n\n\
    ```\ngrep -v -e ^# -e ^$ /etc/rsyslog.conf /etc/rsyslog.d/*\n```"
