  md: '# LAB 24


    # Managing File Permissions and Ownership


    **Lab Objective:**

    Learn how to manipulate file permissions and ownership settings.


    **Lab Purpose:**

    In this lab, you will learn to use `chmod` and `chown`, as well as view permissions
    and ownership settings with `ls`.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    # ***Task 1:***


    Open the Terminal and run (you may need to add the user ''foo'' if you removed
    it on the last lab):


    ```

    echo "Hello World" > foo

    ls -l foo

    ```


    Look at the first field; you should see `-rw-r--r--`.


    This indicates the user, group, and other permissions. The last nine characters,
    in groups of three, denote these permissions. In this instance:


    +   * `rw-` indicates read/write (but not execute) permissions for the user who
    owns the file

    +   * `r--` indicates read-only permissions for the group that owns the file

    +   * `r--` indicates read-only permissions for all non-owners, a.k.a. "world"


    The first character indicates the type of file. In this case, it is a regular
    file; directories begin with `d`.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Who are the user and group owners of this file? The third and fourth fields
    of `ls -l` tell us that. By default, it should be your own user and primary group.


    # **Task 2:**


    Now run:


    +   - sudo chown root foo

    +   - ls -l foo

    +   - cat foo


    You''ve just changed the user ownership to root, while keeping the group ownership.
    As the file has group- and world-read permissions, you can still see its contents.


    # **Task 3:**


    Now run:


    +   - sudo chmod o-r foo

    +   - ls -l foo

    +   - cat foo


    That `chmod` command removes read permissions from other. However, as you still
    have group ownership, you can still see the file''s contents.


    # **Task 4:**


    Now run:


    +   - sudo chmod 600 foo

    +   - ls -l foo

    +   - cat foo


    This `chmod` command sets the permissions explicitly, to read-write for the owning
    user only. As that is root, we can no longer read the file.


    # **Task 5:**


    Finally, clean up with `sudo rm foo`


    **Notes:**


    Execute permissions come into play on executable files as well as directories.
    If a user/group cannot "execute" a directory, it cannot view the contents of said
    directory or any subdirectories.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# LAB 25

    Special Directories and Files


    Lab Objective:

    Learn how to use temporary files and directories, symbolic links, and special
    permissions.


    Lab Purpose:

    In this lab, you will work with symbolic links, special file/directory permissions,
    and temporary files and directories.


    Lab Tool:

    Ubuntu 18.04 (or another distro of your choice)


    Lab Topology:

    A single Linux machine, or virtual machine


    Lab Walkthrough:


    Task 1:

    Open the Terminal and run: ls -ld /tmp


    Notice the permissions: drwxrwxrwt


    The *t* at the end indicates what is called the *sticky bit*. This means that
    only users/groups who own a given file may modify it. This is important on world-writable
    directories, such as those holding temporary files, to prevent users from messing
    with other users’ files.


    Task 2:

    Now run:


    +   - ln -sv $(mktemp) mytmp

    +   - ls -l mytmp

    +   - rm mytmp


    What just happened? *mktemp* created a randomly-named temporary file. Then you
    created a *symbolic link* to that file called mytmp. The *ls* output shows this
    link. A symbolic link'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'is simply a reference to an existing file. This way, you may have multiple
    references to a single file—edit the original file, and all of the references
    instantly update. This is useful for some system configurations.


    **Notes:**


    In addition to /tmp, there is also /var/tmp, which is typically used for larger
    and/or longer-lasting temporary files. /tmp is usually cleaned on every reboot;
    the same is not necessarily true for /var/tmp.'
