  md: '# LAB 29


    # Boot the System: SysVinit and Systemd


    **Lab Objective:**

    Learn how to manage SysVInit and Systemd, and understand the differences between
    them.


    **Lab Purpose:**

    SysVinit and Systemd are two different ways of managing Linux startup processes.
    SysVinit is considered the “classic” method, while Systemd has supplanted it in
    many distros today.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    *Task 1:* Ubuntu 18.04 is one of the distros that has switched to Systemd. However,
    many SysVInit-based scripts are still present and active:


    ```

    ls /etc/init.d

    ```


    Every file in this directory is a script which starts, stops, checks status, and
    possibly other features for a given service. You can see which scripts are enabled
    for which *runlevels* with:


    ```

    ls -lR /etc/rc*

    ```


    Take a look the symlinks listed under /etc/rc5.d. Runlevel 5 is the default boot
    runlevel, when you’re booting normally into a desktop with display manager. Runlevel
    0 (under /etc/rc0.d) contains links to the scripts run when your computer is halted.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# **Task 2:**


    Now run:


    ```

    systemctl list-unit-files --state=enabled

    ```


    These are the services which are enabled at boot within Systemd, and should be
    mostly distinct from the ones listed under /etc/rc*. Use CTRL + C or q to quit.


    While SysVInit relies on standard shell scripts, Systemd uses unit files with
    its own custom format. As just one example, take a look at:


    ```

    cat /lib/systemd/system/rsyslog.service

    ```


    Systemd unit files can have many options. See man systemd.unit for more information.


    # **Task 3:**


    Finally, take a look at those system logs with:


    ```

    journalctl -xe

    ```


    Journalctl is Systemd’s replacement for the classic syslog. Again, however, Ubuntu
    still has quite a few logs in classic text format—see /var/log.


    # **Notes:**


    Ubuntu once used Upstart as a replacement for SysVInit. However, that project
    is currently in maintenance mode and no longer being updated. Ubuntu has migrated
    to Systemd as a replacement for Upstart.'
  merge: -1
  img_proc: true
