  md: '# LAB 87


    # Fundamentals of Internet Protocols: Ports and Services


    **Lab Objective:**

    Learn how to gather information on ports and services on a Linux system.


    **Lab Purpose:**

    In this lab, you will examine some common networking principles, namely ports
    and services, using some Linux command-line tools.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    # **Lab Walkthrough:**


    *Task 1:*

    Open the terminal and run: `sudo ss -Saputrn`


    This is a list of currently open connections and listening ports on your machine.
    There''s a lot of output here, but you''re mostly interested in the first column
    and the last three columns.


    The first column lists what protocol each connection follows. Most likely this
    will be either UDP or TCP, which you may recall are *faster/connectionless* and
    *more-reliable/connection-oriented*, respectively.


    Columns 5 and 6 list your IP:port and the remote host''s IP:port. Lab 89 will
    discuss IP addressing, but you''re interested in the port numbers here. TCP and
    UDP each have 65,535 ports available, some of which are assigned (either officially,
    by IANA, or unofficially by common use) to various services.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Look at the port numbers and try to identify which services are using each
    “server” port. The server port is important, because the client port (the port
    from which a client first makes a connection) is usually dynamic. It may help
    to look at column 7 to see what process on your machine is using the connection.


    # **Task 2:**


    Programs commonly use the */etc/services* file to map service names to the port(s)
    they should listen or connect on. The file is human-readable, however, so you
    should look yourself.


    By looking through */etc/services* (with `cat /etc/services), can you identify
    what services your machine was listening for, or connecting to, in Task 1? Can
    you identify which ports are used by common services, such as HTTP,SSH, LDAP,SNMP,
    and SMTP?


    # **Task 3:**


    Another very common protocol is one that you won’t find any listening ports for…
    because it doesn’t have ports! This is ICMP, a.k.a. “ping” (though in reality,
    it is used for much more than pinging).


    Open two terminal windows/tabs. In the first one, run: `sudo tcpdump -n -i any
    icmp`


    In the second one, run: `ping -c 5 localhost`


    Go back to the first tab, and you should see the requests and replies from your
    pings— and maybe some other ICMP traffic too, if you’re lucky.


    # **Notes:**


    If you couldn’t see any traffic or get any ICMP replies in the last task, a firewall
    on your machine may be to blame. Blocking ICMP traffic indiscriminately like that
    is a poor practice, so it’s an exercise to the student to figure out how to open
    that up a little. (Hint: `iptables)`'
  merge: -1
  img_proc: true
