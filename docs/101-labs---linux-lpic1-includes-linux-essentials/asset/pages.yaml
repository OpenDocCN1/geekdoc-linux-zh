  md: '# LAB 65


    # Customize and Use the Shell Environment: Aliases and Functions


    **Lab Objective:**

    Learn about aliases and functions in Bash.


    **Lab Purpose:**

    In this lab, you will use aliases and functions within Bash to define "shortcuts"
    which may make your life easier.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task I:*


    Open the Terminal and run:


    +   alias mkhello="t=\$(mktemp); echo ''Hello World'' > \$t; echo \$t; unset t''

    +   mkhello


    You just created an alias that you may wish you''d had in earlier labs. This new
    `mkhello` command just creates a temporary file with our favorite text in it,
    then prints the filename for your use.


    You likely already have some aliases defined for you—take a look at `grep alias
    ~/.bashrc`'
  merge: -1
  img_proc: true
- pgno: 185
  md: '**Task 2:**

    Typically you would use `alias` for simpler shortcuts (arguably, `mkhello` is
    even a bit too complicated). But what if you need something more complex? Now
    run:


    +   function newdir { mkdir $1; pushd $1; ls -al; }

    +   newdir foo

    +   newdir bar

    +   newdir ~/baz


    This creates the `newdir` command by adding a bit of sugar to `mkdir`. Functions,
    unlike aliases, can directly use arguments. There’s also another, more C-like
    way you could have written this:


    ```

    newdir() { mkdir $1; pushd $1; ls -al; }

    ```


    **Task 3:**

    Finally, clean up: `cd ~; rm -r foo baz`


    **Notes:**

    One more shell trick is `source`, or `.` (the dot, which in Bash is a synonym
    for `source`). You don’t typically use this interactively, but from a script or
    shell initiation file to read commands from another file. The main difference
    is that `source` reads these commands into the *current* shell rather than launching
    a new one, which is why it is not typically used on independent scripts.'
  merge: -1
  img_proc: true
