- pgno: 237
  md: 'There are subtle differences, too, when it comes to system administration that
    you may not be aware of. For example, run this exercise as you did in Lab 87:


    +   - Open two terminal windows/tabs

    +   - In the first, run: `sudo tcpdump -n -i any icmp`

    +   - In the second, run: `ping6 -c 5 ipv6-localhost`


    If all goes well, you should see the ping replies. But what happens when you check
    back to the first tab? Where are the ICMP packets?


    The answer, as you may have discovered, is to use `icmp6` instead of `icmp`. But
    even that isn''t universal—`ip6tables` (the IPv6 version of `iptables`) calls
    it `ipv6-icmp`… despite the fact that `ip6tables` only operates on IPv6 traffic
    anyway.


    In short: When in doubt, read the man pages.


    # Notes:


