- pgno: 83
  md: '*Task 2:*


    Choose a device from above; for example, /dev/sda.


    Run: `udevadm info /dev/sda`


    Udev is a Linux subsystem that deals with hardware events, like plugging and unplugging
    a USB keyboard. Here, we are using yet another tool to gather information on a
    hard disk device (or another device of your choice).


    Notice the first line from the output, beginning with “P:”. Tying back to sysfs,
    this is the path for said device under the /sys filesystem. You can confirm this
    with


    `ls /sys/[path]`, where [path] is the output from the first line above.


    Udev is also responsible for generating the device nodes in /dev on every boot.
    If you run `ls /dev`, you will see all of the devices you discovered earlier—plus
    many others.


    *Task 3:*


    D-Bus is a mechanism for inter-process communication (IPC). Run `dbus-monitor`
    and then open an application like Thunderbird. You will see a large number of
    messages being sent back and forth between various processes. You might need to
    use CTRL + C or q to quit.


    *Notes:*


    Challenge: Can you figure out how to suspend the system just by echoing a value
    to a file under sysfs?'
