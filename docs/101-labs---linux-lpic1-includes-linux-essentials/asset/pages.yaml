- pgno: 16
  md: '# LAB 1


    # Linux Evolution and Popular Operating Systems


    **Lab Objective:**

    Understand what Linux is, how various Linux distributions evolved, and the use
    cases and target audiences of those distributions. Install Ubuntu 18.04, or a
    distro of your choice, into a VM.


    **Lab Purpose:**

    Unlike with proprietary operating systems, Linux''s nature means that its users
    have limitless options in terms of what software will (and won''t) be installed
    on their computers. There are hundreds of Linux distributions or “distros” available
    today, but Linux didn''t begin that way. Debian, Slackware, and Red Hat have existed
    since the early 1990s and are three of the oldest distros still in use. Many of
    the current most popular distros were derived or forked from one of those three.


    **Lab Tool:**

    An internet-connected computer that can support VirtualBox, or another hypervisor
    software.


    **Lab Topology:**

    N/A


    # **Lab Walkthrough:**


    # *Task 1:*


    Review this tree of Linux distributions (see URL in the notes). Try to locate
    some of the most commonly used distros:


    +   - Debian

    +   - Ubuntu

    +   - CentOS

    +   - SUSE

    +   - Red Hat

    +   - Linux Mint'
  merge: -1
  img_proc: true
