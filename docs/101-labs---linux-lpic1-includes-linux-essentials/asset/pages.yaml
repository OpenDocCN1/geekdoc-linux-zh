  md: '# LAB 22

    Basic Security and Identifying User Types


    **Lab Objective:**

    Learn how to identify the differences between the root user, standard users, and
    system users.


    **Lab Purpose:**

    In this lab, you will learn about the different types of Linux users and a few
    tools to identify and audit them.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal and run: `cat /etc/passwd`


    This file is an inventory of all users on your system. The passwd file is a database
    with seven fields, separated by colons:


    +   1. Username

    +   2. Encrypted password (in practice, hardly ever used—see below)

    +   3. User ID

    +   4. Group ID

    +   5. Comment

    +   6. Home directory

    +   7. Default shell


    Take note of the *root* user, which should be listed on the first line. This is
    the administrative user, and is the only user that can unconditionally do anything
    on the system. By running'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'a command preceded with `sudo`, you are running that command as the root user.
    (You can also use `sudo -i` or `su` to access a root shell directly.)


    If you look at the user IDs, you will notice that most of them, on a default system,
    are below 1000. These are `system` users, typically used to run specific services,
    rather than running those as root, which can create security problems. On most
    systems, human user ID''s begin at 1000 or 500.


    You can easily see the `passwd` information for your own user with: `grep ^$USER
    /etc/passwd`


    # **Task 2:**


    Now run: `sudo cat /etc/shadow`


    The `shadow` file is a sensitive database containing hashed user passwords, among
    other information. Be careful with the contents of this file! It contains nine
    fields, again, separated by colons—however, on a default Ubuntu install, only
    the first three are likely to be significant:


    +   1.  Username

    +   2.  Encrypted password

    +   3.  Date of last password change


    The other fields contain information like account expiration dates and minimum/maximum
    password ages, which are not configured on a default system. See `man 5 shadow`
    for more information.


    You can see this information for your own user with: `sudo grep ^$USER /etc/shadow`


    # **Task 3:**


    Now run: `cat /etc/group`


    As you might expect, this is a database of all groups on the system. It contains
    four fields separated by colons:


    +   1.  Group name

    +   2.  Encrypted group password

    +   3.  Group ID

    +   4.  List of users who are members'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Run `groups` to learn which groups your user has membership in. You can get
    more information, including group ID''s, with the `id` command.


    # Task 4:


    Finally, a few commands you can use to audit user logins:


    +   *   `who`

    +   *   `w`

    +   *   `last`

    +   *   `last $USER` `# For your own user`


    # Notes:


    In the next lab, you will learn how to add regular users and system users. In
    practice, you will rarely need to add system users manually—these are typically
    added along with the services that use them.'
  merge: -1
