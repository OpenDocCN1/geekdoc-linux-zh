- pgno: 187
  md: 'This highly contrived and not very useful script contains a number of important
    features. The first is test, which can test a wide variety of conditions depending
    on its flags and return a 0 or 1 (true or false) exit status. That exit status
    can, in turn, be used by control flow syntax—if statements, or for or while loops.
    A simpler kind of if statement is the && or || syntax, a boolean ''and'' or ''or'';
    respectively.


    If you wish, you can test the script by executing it with:


    +   * chmod +x lab66.sh

    +   * ./lab66.sh


    You should see the numbers 0–4 printed out, followed by a large amount of text
    output, depending on what''s in your /etc directory.


    # Notes:


    This is a somewhat-rare situation where using /bin/sh and /bin/bash as the interpreter
    may yield different results. Bash has a ((++var)) syntax for variable incrementation,
    which is non-standard in the normal Bourne shell. Similar for [[ ]] (a test syntax)
    and the C-style for loop syntax: for ((i=0; i<5; i++))...'
  merge: -1
