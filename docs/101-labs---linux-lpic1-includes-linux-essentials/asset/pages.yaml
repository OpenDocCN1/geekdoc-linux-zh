  md: "# ## LAB 13\n\n# Searching and Extracting Data from Files: Pipes and Redirection\n\
    \nLab Objective:  \nLearn how to use pipes and redirect input and output in Bash.\n\
    \nLab Purpose:  \nBash has two commonly-used features, known as pipes and I/O\
    \ redirection, that make life easier when using Linux. In this lab, you will learn\
    \ how to make use of these powerful features.\n\nLab Tool:  \nUbuntu 18.04 (or\
    \ another distro of your choice)\n\nLab Topology:  \nA single Linux machine, or\
    \ virtual machine\n\nLab Walkthrough:\n\nTask 1:  \nOpen the Terminal application\
    \ and run:\n\n```\n```bash\nmkdir lab13\ncd lab13\necho \"hello world\" > hello\n\
    cat hello\n```\n```\n\nYou just redirected the output from your echo command into\
    \ the hello file. The > is a shortcut; the proper version of this would be 1>,\
    \ where 1 is called a file descriptor, which references the standard output.\n\
    \nTask 2:  \nNow run:\n\n```\n```bash\nls nonexistent 2>> hello\ncat hello\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Based on the new contents of the hello file ("ls: cannot access ''nonexistent'':
    No such file or directory"), what can you surmise about the function of 2>? Here,
    2 is a file descriptor for *standard error*.


    # *Task 3:*


    Sometimes, you want to redirect both output *and* error to the same place. In
    ye olden days, you would have to do something ugly like this: `ls foo > bar 2>&1`


    However, modern versions of Bash have an easy-to-use shortcut: `ls foo && bar`


    # *Task 4:*


    We’ve talked about redirecting output, but what about input? To learn about that,
    run the following commands:


    ```

    cat < hello

    ```


    ```

    read foo <<< "foo"

    echo $foo

    ```


    ```

    cat << END-OF-FILE > goodbye

    hello

    goodbye

    END-OF-FILE

    cat goodbye

    ```


    In short: `<` redirects input from a file name, `<<` starts a here document, and
    `<<<` redirects input from another command.


    # *Task 5:*


    Pipes (`|`) let you use the output of a command as the input to another command.
    In many situations (but not all), `|` and `<<<` are kind of a reverse of one another.
    For example, the output of...


    ```

    echo "hello world" | grep e

    ```


    ... is identical to the output of...


    ```

    grep e <<< "hello world"

    ```


    Try to predict the output of the following command string before you run it (see
    **Answer 1** below):


    ```

    grep non hello | cut -d: -f3

    ```'
