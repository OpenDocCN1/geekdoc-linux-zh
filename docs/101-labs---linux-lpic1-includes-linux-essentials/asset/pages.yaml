    passes the output of a command as the *argument(s)* of another command:


    ```

    ```bash

    echo hello | xargs cat

    rm hello

    ```

    ```


    The *xargs man page* describes a number of useful arguments, including setting
    a delimiter and forcing interactive prompting for each argument.


