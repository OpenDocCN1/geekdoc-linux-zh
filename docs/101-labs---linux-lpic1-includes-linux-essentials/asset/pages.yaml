  md: '# LAB 68


    # Customize or Write Simple Scripts: Scripting Practice


    **Lab Objective:**

    Use what you already know to write a simple shell script, from scratch.


    **Lab Purpose:**

    Scripting with Bash is a daily task by many professional Linux administrators.
    When a task is repetitive, you don''t want to be typing the same list of commands
    over and over; you want to create a script, and perhaps also schedule that script
    to run automatically.


    **Lab Tool:**

    Ubuntu 18.04 (or another distro of your choice)


    **Lab Topology:**

    A single Linux machine, or virtual machine


    **Lab Walkthrough:**


    *Task 1:*

    Open the Terminal application and run your favorite text editor.


    You may wish to reference Labs 66 and 67 if you have not already done so. Your
    goal is to write a script which accepts three arguments—a directory path, and
    two flags to be passed to *test*. This script should check every file in the directory
    (non-recursively) and, if it passes *both* tests, prints that file''s name.


    Example:


    ```

    ​

    ```bash

    ./foo.sh ~/mydir -f -w

    myfile

    ```

    ```


    In this example, the script is looking for files with ~/mydir that are regular
    files with write permissions granted. myfile passes those tests.'
