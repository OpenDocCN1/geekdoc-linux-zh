- pgno: 219
  md: 'This may vary by distro—once you locate the correct file(s), you may want to
    open them with a text editor.


    Ultimately, you are looking for a file such as *50-default.conf* or similar, defining
    what facilities log to what files. On Ubuntu, this file should contain a line
    like:


    ```

    auth,authpriv.*


    /var/log/auth.log

    ```


    At the top of this file, add the following line:


    ```

    *.*


    /var/log/allthelogs

    ```


    Then restart the daemon: *systemctl restart rsyslog*


    Wait a few minutes (or create your own logs with *logger*), then check the contents
    of */var/log/allthelogs*. This should be an amalgamation of all the logs which
    are going to many other log files.


    # *Task 3:*


    Clean up by deleting the line you added to the *rsyslog* config, and run *systemctl
    restart rsyslog*


    # Notes:


    Aside from *journald*, which most distros have migrated to as a result of Systemd,
    there are also other logging daemons like *syslog* and *syslog-ng*. While some
    daemons have their own configuration formats, all at least support the classic
    *syslog* configuration format (and that should be what you saw in *rsyslog*’s
    own configs). Learn that format, and you will have learned configuration for all
    of the major logging daemons.'
