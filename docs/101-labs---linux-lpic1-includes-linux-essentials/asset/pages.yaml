    \ enter the following:\n\n```\nhello=\"echo \"\"hello\"\"\"\n echo \"\"$hello\"\
    \"\n echo '$hello'\n echo `$hello`\n```\n\nDouble quotes allow for variables to\
    \ have their values referenced. Single quotes are always literal, while backquotes\
    \ *execute* the command (including variable references) within those quotes.\n\
