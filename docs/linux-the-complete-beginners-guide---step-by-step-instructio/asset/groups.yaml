    +   1. Get Linux “pre-installed” on a new computer


    This is one of the easiest ways to start working with Linux. Several major retailers
    now offer Linux pre-installed on their computer systems. Just buy it, boot it
    and start working!


    +   2. Install Linux on a system that doesn’t have Windows


    You can install Linux “from scratch”, from CD or DVD, on a new or used system
    that doesn’t already have an operating system (like Windows) on it.


    +   3. Install Linux on a Windows system


    If you don’t want to buy a new or used system for Linux, you can install Linux
    on an existing Windows system. When you do this, you create a “dual boot” (Linux
    and Windows) system.


    After you install Linux and boot your system, a menu will appear allowing you
    to boot into Windows or boot into Linux!


    In this case, you don’t need to buy a computer just for Linux. But there is a
    downside: if you make a mistake during the installation, or even if you delete
    Linux from your system later, you may lose all your Windows programs and data!


