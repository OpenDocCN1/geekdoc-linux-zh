    # Differences Between Linux And Windows


    This sub-topic will discuss the differences between the Linux and Windows operating
    software, I’ll discuss some of the pro’s and con’s of each system.


    Let us first start out with a general overview of the Linux operating system.
    Linux at its most basic form is a computer kernel. The Kernel is the underlying
    computer code, used to communicate with hardware, and other system software, it
    runs all of the basic functions of the computer.


    The Linux Kernel is an operating system, which runs on a wide variety of hardware
    and for a variety of purposes. Linux is capable of running on devices as simple
    as a wrist watch, or a cell phone, but it can also run on a home computer, for
    example Intel, or AMD processors, and is even capable of running on high end servers
    using Sun Spar CPU’s or IBM power PC processors. Some Linux distro’s can only
    run one processor, while others can run many at once.


    Common uses for Linux include that of a home desktop computing system, or more
    commonly for a server application, such as use as a web server, or mail server.
    You can use Linux as a dedicated firewall to help protect other machines that
    are on the same network.


    A programmer student named Linus Torvalds first made Linux in 1991 as a variant
    of the Unix operating system. Linus Torvalds made Linux open source with the GNU
    (GPL) (General Public License), so other programmers could download the source
    code of free and alter it any they see fit. Thousands of coders the world began
    downloading and altering the source code of Linux, applying patches, and bug fixes,
    and other improvements, to make the OS better and better. Over the years Linux
    has gone from a simple text based clone of Unix to a powerful operating system,
    with full-featured desktop environments, and unprecedented portability, and a
    variety of uses. Most of the original Unix code has also been gradually written
    out of Linux over the years.


    As a result of Linux being open source software, there is no one version of Linux;
    instead there are many different versions or distributions of Linux, that are
    suited for a variety of different users and task. Some Distributions of Linux
    include Gentoo, and Slackware, due to the lack of a complete graphical environment
    is best, for Linux experts, programmers, and other users that know their way around
    a command prompt. Distributions that lack a graphical environment are best suited
    for older computers lacking the processing power necessary to process graphics,
    or for computers performing intensive task, where it is desirable to have all
    of the system resources focused on the task at hand, rather than wasting resources
    by processing graphics.'
  - '[PAGE 12]


    Other Linux distributions aim at making the computing experience as easy as possible.
    Distributions such as Ubuntu, Linspire make Linux easier to use, offering full-featured
    graphical environments that eliminate the need for a command prompt. Of the downside
    of ease of use is less configurability, and wasted system resources on graphics
    processing. Other distributions such as S try to find a common ground between
    ease of use and configurability.


    Linux has two parts, they include the Kernel mentioned previously, and in most
    circumstances it will also include a graphical user interface, which runs atop
    the Kernel" reference #3. In most cases the user will communicate with the computer
    via the graphical interface. (ref #6) Some of the more common graphical environments
    that can run on Linux include the following. The KDE GUI (Graphical user interface).


    Matthias Ethrich developed KDE in 1996. He wanted a GUI for the Unix desktop that
    would make all of the applications look and feel alike. He also wanted a desktop
    environment for Unix that would be easier to use than the ones available at time.
    KDE is a free open source project, with millions of coders working on throughout
    the world, but it also has some commercial support from companies such as Novell,
    Troltech, and Mandriva. KDE aims to make an easy to use desktop environment


    without sacrificing configurability. Windows users might note that KDE has a similar
    look to Windows. Another popular GUI is (ref #7) GNOME. GNOME puts a heavy emphasis
    on simplicity and user ability. Much like KDE


    GNOME is open source and free to download. One feature of GNOME is the fact that
    it supports many different languages; GNOME supports over 100 different languages.
    Gnome is licensed under the LGPL license (lesser general public license). The
    license allows applications written for GNOME to use a much wider set of licenses,
    including some commercial applications. The name GNOME stands for GNU Network
    object environment.


    GNOME''s look and feel is similar to that of other desktop environments. Fluxbox
    is another example of a Linux GUI. With less emphasis on ease of use and eye candy,
    Fluxbox aims to be a very lightweight, and a more efficient user of system resources.
    The interface has only a taskbar and a menu bar, which is accessed by right clicking
    over the desktop. Fluxbox is most popular for older computers that have a limited
    abundance of system resources.


    Although most Linux distributions offer a graphical environment, to simplify the
    user experience, they all offer a way for more technically involved users to directly
    communicate with the Kernel via a shell or command line. The command line allows
    you to run the computer without a GUI, executing commands from a text-based interface.'
