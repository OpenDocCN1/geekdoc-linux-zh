  mdcn: '

    使用命令行提示符的优点是它消耗系统资源较少，并让计算机将更多精力放在当前任务上。命令示例包括用于更改目录的 `cd` 命令、用于关闭系统的 `halt` 命令以及用于重启电脑的
    `reboot` 命令。


    现在我们对 Linux 操作系统有了了了解，可以注意到 Linux 与世界上最流行的操作系统——微软 Windows 之间的许多不同。从现在开始，我们将讨论
    Linux 与 Windows 之间的一些最显著的不同。


    首先，只有一家公司发布 Windows 操作系统，那就是微软。所有的 Windows 版本，无论是 Windows XP 家庭版、商业版还是 Vista 版，其所有更新、安全补丁和服务补丁均来自微软。相比之下，Linux
    并不是由某一家公司发布的。


    Linux 全范围内有数百万编码者和公司投入时间开发更新、新版本和软件应用程序。尽管有些公司对技术支持收费，另一些公司则对他们的 Linux 发行版收费，但通过将其与非免费软件打包，你始终可以免费获得
    Linux 内核，并且可以免费获得带有所有通用所需应用程序的全功能 Linux 桌面。那些对 Linux 发行版收费的供应商也必须根据 GPL 许可协议发布免费版本。而微软
    Windows 则需要你向微软支付软件费用，你还必须为你使用的大多数应用程序付费。


    Windows 和 Linux 在技术支持问题上也有不同。Windows 由微软公司支持，这意味着如果你的任何产品出现问题，该公司应该负责解决。例如，如果微软
    Windows 无法运行，你应该能够拨打微软并利用他们的技术支持来修复问题。技术支持通常在购买产品时包含在一段时间内（也许是两年），此后你可能需要支付服务费。尽管
    IBM 支持他们的 Linux 产品，但对于大多数使用 Linux 的人来说，你需要自力更生。如果你在 Ubuntu Linux 上遇到问题，你无法致电 Ubuntu
    并获得任何帮助。尽管缺乏专业帮助，你仍然可以从网络上的成千上万个 Linux 论坛获得良好的技术建议。你还可以通过 Myspace 等社交网络网站，通过在许多
    Linux 群组中提问来获得巨大的帮助。你通常可以在几小时内收到专业人士对你问题的回复。


    可配置性是这两个操作系统之间的另一个关键区别。尽管 Windows 提供了控制面板帮助用户按照喜好配置计算机，但它无法比 Linux 提供的配置选项，特别是如果你是一个精通的编码者。在
    Linux 中，内核是开源的，因此如果你拥有相关知识，你可以以任何你认为合适的方式对其进行修改。此外，Linux 还提供了多种图形环境，如 KDE 这样的全功能图形环境，或者更轻量级、节省资源的
    GUI（如 Fluxbox 或 Blackbox），以适应其他计算机的用户。还有一些 Linux 版本旨在尽可能地模拟 Windows 的外观和感受。像 Linspire
    这样的发行版最适合从 Windows 世界迁移过来的用户。


    还有一些完全不包含图形环境的发行版，以更好地适用于需要为各种计算活动榨出所有计算能力的用户，以及那些比他人更高级的用户。所有这些可配置性有时可能会带来问题，因为你必须决定哪个桌面最适合你，而且为了让操作变得更简单，你还需要安装与你的发行版和图形环境原生的应用程序。


    (ref #1) Linux 的性价比是它区别于 Windows 的另一种方式。对于家庭使用，Linux 非常廉价，且在大多数情况下是完全免费的，而 Windows
    的成本取决于你使用的版本。对于 Linux，大多数应用程序也将是免费的，但对于 Windows，在大多数情况下你必须为应用程序付费。对于大多数情况，使用 Linux
    在安装时不需要输入产品激活密钥，你可以随心所欲地在许多计算机上安装。而 Windows 只允许在一台计算机上安装，微软使用产品激活软件来执行这一规则。


    在安装 Windows 时，你必须输入产品激活密钥，该密钥在多次使用后过期。如果你愿意，可以从各种供应商处购买 Linux，这将包含一套盒装光盘、手册以及大约
    40-130 美元的技术支持。当然，如果你购买用于服务器的高端 Linux 版本，可能可能花费 400-2000 美元。

    '
