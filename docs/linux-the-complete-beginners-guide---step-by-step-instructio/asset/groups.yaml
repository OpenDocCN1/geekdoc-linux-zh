    分区是组织硬盘空间的一种方式，通过创建相互独立的虚拟区域来实现。大多数运行 Windows 或 MS DOS 的计算机只有一个巨大的操作系统空间。这个空间就是
    C 盘。如果你有一个大硬盘，它可能被分成了较小的分区。这些分区通常被称为 D:、E: 等，你可以在任何分区上安装 Linux。


    Windows 98 在整个硬盘上创建 FAT32 文件系统，DOS 和 Win95 使用 FAT16。Linux 有许多文件系统，最流行的是 ext3。但你也可以在
    Fat32 分区上安装 Linux。

