    嗯，大多数新发行版都能在短时间内检测并配置你的硬件，除非你拥有一些非常老旧或奇特的硬件。所有硬件都能被正确检测并安装驱动程序。只有由 Windows 驱动程序驱动的现代
    Windows 系统才会遇到问题。


    至于软件，有非常多。而且其中大部分都是免费提供给你，你可以根据自己的需要进行使用、修改和配置。几乎所有优秀的 Linux 软件都是免费的，你尝试一下也不会损失任何东西。你可以在网络上快速获得你可能有的任何查询的免费支持。你甚至不需要删掉
    Windows。只需将 Linux 安装在不同的硬盘分区上，并根据你的意愿在它们之间切换即可。


    其他软件包是商业性的，你必须购买软件——但这主要是是为了软件以及对你的培训，而不是为了软件本身。有时，如果你有 Windows 版本（作为一种保险），你可以下载一个小型程序，允许你在
    Linux 中运行该游戏。Linux 中的游戏质量非常高且功能强大。你会喜欢它们的。这里有：


    - 办公套件：Star Office, Open Office, Appixware, Corel WordPerfect

    - 图形：GIMP, Corel Photo pear

    - 音乐：XMMS, Free amp, Real Player

    - 视频：MTV, Xine

    - 游戏：FreeCiv, Tux racer, Doom, Quake, Heretic, Unreal，列表仍在不断增长。


    ## 适用于家庭用户的 Linux 种类：


    既然有这么多人在开发它，很可能也有很多 Linux 版本。许多致力于 Linux 的公司都开发了所谓的 Linux 发行版（Linux distributions）。有些
    Linux 版本是经过编译、打包并附带额外软件释放的。


    - **RedHat (红帽)**：可能是最流行且在许多方面处于领先的版本。它目前是第 9 版本。安装和配置非常简单。蓝色的文件管理器和默认的 GNOME
    桌面看起来非常惊艳。它有一系列工具，可以作为服务器和工作站使用。由红帽开发的红帽软件包管理器 (RPM) 格式几乎已经成为 Linux 世界软件分发的标准。安装新软件轻而易举。它还有一个先进且易用的字体管理系统，使得
    X Windows 中的字体看起来非常漂亮。


    - **Mandrake Linux**：现在是第 10 代。它可以使用 Lin4Win 工具安装在原生 Windows 分区上，这可能会减慢机器速度。它还允许你在自己的分区中进行传统的
    Linux 安装。Mandrake 的配置和软件安装是非常轻松的。它遵循一种略微修改的 RPM 架构，称为 mdk.rpm，但大多数红帽软件也可以用于 Mandrake。该版本的显著特征是窗口管理器集合——视觉狂热者会度过一段极快的时光。


    - **SUSE (苏萨)**：来自德国的“变色龙”SUSE。现在处于 8.x 版本，它拥有编译最全面的软件包集合之一，通过 yast（Yet Another
    Software Tool，又一个软件工具）可以轻松获取它们，yast 提供了一个集中式界面，你可以在从中选择要安装的软件。除外，SUSE 还带有一些惊艳的
    3D 游戏，展示了 Linux 的游戏实力。


    - **Corel/Xandross**：几年前带着 Core Linux 进入了 Linux 市场。现在它已合并为基于 Core Linux 的 Xandross
    OS。这是一个 Debian 类型的版本，在调整 Windows 分区大小后可以无需费力地安装。Xandross 包含了 Crossover office，这是
    WINE 的精简零售版，你可以在其中安装并运行许多微软应用程序。


    ## Linux 中的 Windows 应用程序


    某些应用程序已经移植到 Linux，另一些通过一个名为 WINE 的程序运行（Wine 并不是模拟器）。Crossover 这种商用可用软件也允许你在 Linux
    上使用你的 Windows 程序。VMware 是另一个允许你在 Linux 上运行 Windows 的程序。现在许多软件公司开始为 Linux 开发高级软件。Linux
    的酷炫之处在于大多数软件都是免费的，你可以合法盗版地使用它们。如果你担心 Linux 不像 Windows 那么漂亮，只需查看一些有趣的 Linux 界面和窗口管理器。如果你有一台运行两者的电脑，就可以轻松地在它们之间切换，获得两者的优点。


    ## Linux 与 Windows 的区别


    本主题将讨论 Linux 和 Windows 之间的区别，我们将讨论每个系统的优缺点。


    让我们先从 Linux 系统的通用概览开始。Linux 在最基本的形式是一个计算机内核（Kernel）。内核是用于与硬件和其他系统通信的底层计算机代码，它运行计算机的所有基本功能。


    Linux 内核是一个运行在各种硬件和各种用途上的操作系统。Linux 能够运行在如手表或手机等简单设备上，也可以运行在家用电脑（例如 Intel 或 AMD
    处理器），甚至运行在使用 Sun CPU 或 IBM PC 处理器的高端服务器上。某些 Linux 发行版只能运行一个处理器，而另一些可以同时运行多个。


    Linux 的常见用途包括家庭计算系统，或者更常见的服务器应用程序，例如作为 Web 服务器或邮件服务器。你可以将 Linux 作为专用的防火墙来帮助保护同一网络上的其他机器。

    '
