    ## Linux Installation Help - How To Install the Linux OS from a New Linux Download


    You can install Linux from CD or DVD onto a new computer system. This will allow
    you to learn how to use Linux to get real, practical Linux training and experience.
    In this section, we''re talking about a new system that doesn''t already have
    an operating system (like Windows) on it.


    You can download the Linux OS (operating system) as a Linux ISO file and burn
    it to CD or DVD yourself, or you can order Linux on CD or DVD and have it mailed
    to you.


    **Linux Tips:** Linux ISO files are large. Only download Linux if you have high-speed
    Internet access. You can buy and have the Linux OS delivered to you by mail very
    cheaply. Just do an Internet search for “list of linux cds” or “list of linux
    dvds”.


    **Linux Tips:** Linux DVDs hold a lot more programs than CDs. Order a Linux DVD
    version and you will have more Linux software programs to choose from than on
    a CD version - and you will also need fewer DVDs than CDs!


    ## 7 Steps to Install Linux on a New Computer System


    ### 1. Document Your Linux Installation Settings


    During the Linux installation, you need to specify some system settings. These
    include: the Linux software programs and desktop(s) you want installed, networking
    settings, and disk partition sizes.


    ### 2. Boot with the Linux CD or DVD and Start the Linux Installation Routine


    The steps to set up your system to boot from its CD or DVD drive.


    Shut down your system and boot it with the first Linux CD / DVD in the drive and
    start the Linux installation routine.


    ### 3. Specify Your Linux Installation Settings


    Follow the on-screen prompts and put in the installation settings you documented
    in Step 1.


    ### 4. Create a Regular (“Non-root”) User


    You log in to work on a Linux system as a Linux “user”, with a user name and password.
    You can log in as the “root” user, or as a “non-root” user.


    You log in and work on the Linux OS as the root user when you need to do Linux
    system administration tasks. For example, you work as the root user to run a Linux
    command to create a new user, or to do the steps to install a Linux server.


    When you install Linux, the root user is always created automatically for doing
    Linux system administration tasks. However, for security reasons, you should never
    log in to a Linux desktop as the root user.


    At some point during the installation routine, you will be asked if you want to
    create one more “regular” (non-root) Linux users. Always create at least one regular
    Linux user and log in this user to day-to-day tasks.


    ### 5. Let the Linux OS Install on Your Hard Disk


    After you specify the Linux installation settings and create one or more new Linux
    users, the installation routine will copy the Linux OS and Linux software programs
    onto the hard disk in the system, and then reboot.


    ### 6. Log In to Test the System


    Once the system reboots, log in as a “regular” (non-root) Linux user to test that
    you can work as this user. At this point, the Linux desktop appears and you can
    run Linux programs to test the system.


    **Linux Tips:** Remember not to log in to a Linux desktop as the root user.


    Test the root user by logging in as a regular Linux user and opening a terminal
    emulation window. Then run the su command to log in and work as the root user.


    ### 7. Have fun!


    The Linux OS is an amazing and extremely reliable system. And there are thousands
    of Linux software programs for all kinds of uses.


    By installing and running Linux you can get lots of great practical Linux training
    experience while working with Linux. You can work at a Linux desktop and run commonly
    Linux software programs. You can also work at the Linux command line and learn
    how to use Linux commands - the way real pros do Linux system administration.


    ## Linux Quick Start - How to Use Linux Video Tutorials from CD and Run Linux
    in Windows


    Linux video tutorials are an excellent, easy and fast way to get started at learning
    how to use Linux.


    Getting Linux Running in Windows - So You Can Learn How to Use Linux in Windows!


    You can download a free Linux virtual machine “player” and a free Linux virtual
    machine so you can run Linux in Windows.


    Just download and quickly install the free Linux virtual machine player so you
    can run Linux in Windows.


    **Linux Tips:** There are hundreds of free virtual machines available for Linux
    distributions, including Ubuntu, Debian Linux, Red Hat Linux, Fedora Linux, SUSE
    Linux!


    ## Running Video Tutorials from CD


    Now put in the CD that contains the video tutorials. This causes your browser
    to automatically run and display the list of video tutorials.


    To watch a Linux video, just click on the name of the video tutorial in the list,
    such as “Running Linux in Windows”, or “Installing Linux from CD / DVD”, or “Learning
    How to Run Linux Commands” - and the tutorial runs in the browser.


    ## Learning Linux in Windows to Get Real Practical Experience Yourself!


    Now here’s the best part about running Linux in Windows to get Linux training.


    Not only do you get to watch the Linux videos to see and hear how to use Linux,
    but you also get to use a Linux desktop to run Linux software programs and most
    importantly - run Linux commands!


    Just start a Linux video, such as “How to Run the Linux grep Command” and watch
    a bit of how to run the command - step-by-step. Then click on the pause button.


    Hold down the Alt key (at the left of the spacebar on your keyboard) and press
