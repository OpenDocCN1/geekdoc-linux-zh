    # Understanding Linux Partition Types & Linux Hard Disk Partitioning


    When you’re doing Linux disk partitioning (during or after installing Linux) you
    will likely run into situations where you can’t create partitions - and can’t
    do other tasks you’d like to do with partitions!


    This is when you need to understand the Linux hard disk partitioning “rules” described
    below.


    Linux System Admin Training Tips: Keep in mind that the “rules” below apply to
    using the Linux fdisk command, which is the most commonly used disk partitioning
    utility. You may be able to “break” these rules with other hard disk partitioning
    utilities.'
  - '[PAGE 20]


    # “Setting Up” Linux Hard Disk Partitions


    You can “set up” and configure your Linux partitions while using the installation
    routine of most Linux distributions - also by using the Linux fdisk and parted
    commands - and some other partitioning commands.


    Also, as a Linux System Administrator, you will also need to manage (create, delete,
    and modify) partitions on existing Linux systems (after the OS has been installed).
    To do this, you use the fdisk command / utility or the parted command / utility
    - and there are also other disk partitioning commands and utilities.


    There are several Linux hard partition “types”, such as primary, extended and
    logical - and there are strict “rules” about using these Linux partition types.


    # Linux Primary Partitions


    The disk partitioning utility in a Linux installation routine and the fdisk command
    (and other disk partitioning commands) can create a maximum of four Primary partitions
    per hard disk drive.


    If you need more than four hard disk partitions, you need to create at least one
    Extended partition and then create one or more Logical partitions in the Extended
    partition.


    To be able to create an Extended partition on a hard disk that already has four
    Primary partitions, you need to delete one of the Primary partitions and then
    create the Extended partition. So, you can have a maximum of three Primary partitions
    if you are creating an Extended partition on a Linux hard disk.


    # Linux Extended Partitions


    A Linux hard disk must have at least one Primary partition before it can have
    an Extended partition. fdisk cannot create more than one Extended partition per
    drive. To be able to use the disk space in at least one Extended partition, it
    must have at least one Logical partition (within the Extended partition).


    # Linux Logical Partitions'
- md: '

    Extended partitions contain one or more Logical partitions. An Extended partition
    is not accessed directly. It is accessed via one or more Logical partitions within
    the Extended partition. If a hard disk has an Extended partition, then it has
    at least one Logical partition in that partition.


    ## Partition Numbering


    The maximum number of Primary partitions that fdisk can create is four and the
    maximum number of Extended partitions that it can create is one.


    Remember, you must have at least one Primary partition before you can have an
    Extended partition. You can only have one Extended partition and the maximum number
    of the combination of Primary and Extended partitions is four.


    The Linux disk partitioning concepts covered here apply to: Debian, Red Hat, Fedora,
    Ubuntu, Slack, SUSE, openSUSE - and ALL other Linux distributions.


    ## Steps to Create and Run a Linux Script to Run Linux Commands


    Creating and running a Linux script to automatically run a series of Linux commands
    that you commonly run is easy!


    With a Linux script, you put a series of routinely run commands in a text file,
    and then run all of them by simply typing in the name of the file and pressing
    Enter.


    Linux Script Example to Create a Script to Automatically Run A Series of Linux
    System Administration Commands.


    Follow along with the steps in the example below to create and run your first
    Linux script!


    1. Run a Linux text editor.


    2. Put the following text at the top left of the text file (indented below for
    emphasis):

    #!/bin/bash


    This indicates that the text file is a Linux script file.


    Press Twice to have a blank line below the line above.


    3. Put the Linux command(s) in the script file.


    The Linux commands below are used to provide an example. You can put any commands
    in a script.


    The Linux commands below will: clear the screen, change into the /etc directory,
    and then show the current path with the Linux pwd (path to working directory).
    Then provide a long list of the fstab file (to show it''s there) and then change
    into your home directory (represented by ~) and then show the path of the current
    directory.


    Linux Commands Tips: A Linux script can contain hundreds of lines if necessary
    - and also include complex logic, such as if statements.


    4. Save the text file with a meaningful name to create it and give it a name.
    For example, if you want to list files in a few directories, call the file: list.


    5. Run the Linux command to change the permissions of the file and make the Linux
    text file "executable". In our example, the file is named list. Below is a Linux
    chmod example for changing the permissions of the Linux script file - to make
    it "executable", so that you can run the script file in the same way as you run.
    The $ (dollar sign) below is the Linux command prompt. Type in the $ (dollar sign),
    the command that appears at the right of the $: The Linux command above is chmod
    and it is being used to assign the x (executable) permission to the u (user) of
    the file with u+x and the file name is list.


    Running a Linux Script to Run System Administration Commands


    To run a Linux script (that is in the “current” directory), such as the list script,
    simply type a period (.) and then the name of the file and press Enter. The concepts
    and Linux command examples shown above work in Red Hat, Ubuntu, Fedora, Slackware,
