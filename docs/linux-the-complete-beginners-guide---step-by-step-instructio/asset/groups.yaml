    There are three main parts of a Linux command:


    +   1. The Linux command name


    +   2. Options that can be used with the Linux command


    +   3. The “item(s)” that the Linux command is being run “on”


    When you run a Linux command, spaces are used between: the Linux command name,
    the command options and the “item” is being run “on”. The “item” could be a Linux
    directory, file, user or some other Linux software component.


    For example, you run the Linux command named ls (for list) “on” a Linux directory
    to see a list of files in the directory. You run the Linux command named rm (remove)
    “on” a Linux directory to remove the directory from the Linux file system.


