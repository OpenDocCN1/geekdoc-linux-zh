    # Download Linux Virtual Machines and Run Linux in Windows!


    You can run Linux in Windows by running a free Linux virtual machine player program
    and opening a free Linux virtual machine!


    This is fantastic for a new Linux user who needs to get Linux training and wants
    to learn Linux in Windows.


    You just download Linux in Windows as a “pre-installed” virtual machine, uncompress
    the virtual machine files in the Linux download file into a folder on the Windows
    hard disk, and run a virtual machine player program to run in Windows.


    There are lots of new Linux “flavors” (versions) available as virtual machines
    to choose from. You can experiment with Linux commands to do Linux administration
    tasks - without messing up Windows on your computer system!


    For example, while learning to do Linux administration tasks, you do things like:
    create a new Linux user, install Linux software programs, and create or delete
    directories in the Linux file system.


    When you do these steps, you may accidentally cause the Linux system to stop working
    properly. If this happens, all you have to do is erase the Linux virtual machine
    files, uncompress the original files into their folder again, and start running
    Linux in Windows again!


    The steps below outline how Linux is installed on a computer system, how a Linux
    virtual machine is created, and how to run Linux in Windows.


    Installing the Linux OS on a computer system “from scratch” is a very time-consuming
    process. You do the following steps:


    - Set up the system to boot from CD / DVD

    - Boot the system with a Linux CD / DVD

    - Run the Linux installation routine

    - Provide several Linux system configuration settings, such as Linux networking
    settings and partition settings

    - Select the Linux software programs to be installed on the system

    - Wait while thousands of Linux software programs are copied onto the hard disk
    of the system


    To create a Linux virtual machine, someone does the following steps for you:


    All the steps above to install the Linux OS on a computer system - as a virtual
    machine compresses the files that make up the virtual machine into a single file
    puts the virtual machine on a Linux server as a free Linux download file


    # To run Linux in Windows, you just:


    - Download and install the virtual machine player program

    - Download a single file containing the compressed Linux virtual machine files

    - Uncompress the virtual machine files into a folder

    - Run the virtual machine player

    - Open (and run) the Linux virtual machine


    To run a Linux command, open a terminal emulation window on the Linux desktop
    to get to the Linux command line.


    Once you get a Linux virtual machine running, you can go to the Linux command
    line and run Linux commands. This is the best way to learn how to do Linux administration
    tasks. And you can use Linux video tutorials with your virtual machine learn how
    to use Linux. Just watch a bit of a video tutorial on a Linux command and then
    go to the Linux virtual machine and try the command yourself!


    This is a great way to get Linux training and experiment with using Linux.


    # How to Use Linux Command Line Components


    Linux Commands - The great thing about Linux commands is that they are virtually
    identical from one Linux distribution (version) to another. So the way real pros
    os Linux administration is to work at the Linux command line and run Linux commands.


    Learning how to run a Linux command can be very difficult for someone new to Linux,
    so here are some Linux tips that will help you learn how to use Linux commands
    when working at the Linux command prompt.


    There are three main parts of a Linux command:


    1. The Linux command name

    2. Options that can be used with the Linux command

    3. The “item(s)” that the Linux command is being run “on”


    When you run a Linux command, spaces are used between: the Linux command name,
    the command options and the “item” is being run “on”. The “item” could be a Linux
    directory, file, user or some other Linux software component.


    For example, you run the Linux command named ls (for list) “on” a Linux directory
    to see a list of files in the directory. You run the Linux command named rm (remove)
    “on” a Linux directory to remove the directory from the Linux file system.


    To run a Linux command, you type in the name of the command, and any other parts
    of the command, such as options, and press the Enter key.


    You can see an example of the Linux command that is used to create a new Linux
    user below. The useradd command is being run “on” the bthatcher user name to create
    this Linux user.


    **Linux Tips:** Linux commands are run at the Linux command line prompt and this
    is shown as # at the left of the command. You don’t type in the prompt, you type
    the Linux command at the right of the prompt.


    **Linux Tips**: The Linux command prompt may also appear as: $ or as another symbol,
    instead of # or $.


    ```bash

    # useradd -c "Becky Thatcher" bthatcher

    ```


    This Linux command creates a new Linux user named bthatcher with the full name
    of “Becky Thatcher”. The -c (for comment) option is used with this command to
    add the full name as a comment to the Linux user name of bthatcher.


    One of the easiest and best ways to get Linux training is to see Linux commands
    being run in Linux video tutorials. With this method - you see, hear and do.


    With a Linux video tutorial, you see and hear how to run a Linux command and see
    hear a description of the output of the command. You can also pause the video
    so you can run the Linux command yourself!


    # Running Linux to Get Real Experience


    You learn Linux best by getting real practical experience working with it. By
    using a Linux desktop, running Linux programs, and especially running Linux commands
    - the real power Linux administration.


    # 5 Ways to Get Linux Running to Get Training


    1. Get Linux “pre-installed” on a new computer

    This is one of the easiest ways to start working with Linux. Several major retailers
    now offer Linux pre-installed on their systems. Just buy it, boot it and start
    working!


    2. Install Linux on a system that doesn’t have Windows

    You can install Linux “from scratch”, from CD or DVD, on a new or used system
    that doesn’t have an operating system (like Windows) on it.


    3. Install Linux on a Windows system

    If you don’t want to buy a new or used system for Linux, you can install Linux
    on an existing Windows system. When you do this, you create a “dual boot” (Linux
    and Windows) system. After you install Linux and boot your system, a menu will
    appear allowing you to boot into Windows or boot into Linux!

    In this case, you don’t need to buy a computer just for Linux. But there is a
    downside: if you make a mistake during the installation, or even if you delete
    Linux from your system later, you may lose all your Windows programs and data!


    Linux Tip: Be sure to back up your system before you install Linux and before
    remove Linux.


    4. Boot a system with a Linux “live” CD or DVD version

    This one’s quite fun and very easy to do!

    You can work with a Linux “live” version by booting a system with a Linux live
    CD DVD.

    Just put the Linux live CD / DVD in your drive and start your system. As soon
    as system boots, Linux will automatically start and run “live”. No installation
    required!


    Linux Tip: If you don’t have a high-speed connection to download Linux, you can
    buy Linux on CD or DVD and have it mailed to you anywhere in the world for a surprisingly
    small amount of money.


    5. Run Linux from within Windows

    A free “player” version of Linux is the easiest and fastest way to get Linux running
    within Windows, on an existing Windows system!

    Just run Windows and download and install the free Linux “player” program and
    a free “player” version of Linux. This lets you easily run Linux from within Windows!


    Run the player program and open the player version of Linux and you get a fully
    functional version of Linux running within Windows!

