    ## Linux 安装帮助 - 如何从新的 Linux 下载包安装 Linux OS


    你可以从 CD 或 DVD 将 Linux 安装到新的计算机系统上。这将允许你学习如何使用 Linux，获得真实的真实的 Linux 培训和经验。在本节中，我们讨论的是尚未安装操作系统（如
    Windows）的新系统。


    你可以将 Linux OS（操作系统）下载为 Linux ISO 文件并自行刻录到 CD 或 DVD，也可以订购 CD 或 DVD 版 Linux 并邮寄给你。


    **Linux 技巧：** Linux ISO 文件很大。只有在你有高速网络的情况下才下载 Linux。你可以非常廉价地购买并邮寄 Linux OS。只需在互联网搜索“list
    of linux cds”或“list of linux dvds”即可。


    **Linux 技巧：** Linux DVD 比 CD 多得多程序。订购 Linux DVD 版本，你会有比 CD 版本更多的 Linux 软件供选择——而且你需要的
    DVD 比 CD 少！


    ## 在新计算机系统上安装 Linux 的 7 个步骤


    ### 1. 记录你的 Linux 安装设置


    在 Linux 安装过程中，你需要指定一些系统设置。这些包括：你想安装的 Linux 软件程序和桌面、网络设置以及磁盘分区大小。


    ### 2. 使用 Linux CD 或 DVD 启动并开始 Linux 安装程序


    设置系统从 CD 或 DVD 驱动器启动的步骤。


    关闭你的系统，并在驱动器中插入第一个 Linux CD / DVD 启动系统，开始 Linux 安装程序。


    ### 3. 指定你的 Linux 安装设置


    按照屏幕提示，输入你在第 1 步中记录的安装设置。


    ### 4. 创建普通（“非 root”）用户


    你以 Linux “用户”的身份登录并在 Linux 系统上工作，拥有用户名和密码。你可以以“root”用户身份，也可以以“非 root”用户身份登录。


    当你需要执行 Linux 系统管理任务时，以 root 用户身份登录并在 Linux OS 上工作。例如，你以 root 用户身份运行 Linux 命令来创建新用户，或执行安装
    Linux 服务器的步骤。


    当你安装 Linux 时，系统总是会自动创建 root 用户用于执行 Linux 系统管理任务。然而，出于安全考虑，你永远不要以 root 用户身份登录 Linux
    桌面。


    在安装过程的某个时刻，系统会询问你是否想再创建一个“普通”（非 root）Linux 用户。请务必至少创建一个普通 Linux 用户，并使用该用户处理日常任务。


    ### 5. 让 Linux OS 安装在硬盘上


    在指定 Linux 安装设置并创建一个或多个新 Linux 用户后，安装程序会将 Linux OS 和 Linux 软件程序复制到系统的硬盘上，然后重启。


    ### 6. 登录并测试系统


    系统重启后，以“普通”（非 root）Linux 用户身份登录，测试你是否可以以此用户身份工作。此时，Linux 桌面会出现，你可以运行 Linux 程序来测试系统。


    **Linux 技巧：** 记住不要以 root 用户身份登录 Linux 桌面。


    通过以普通 Linux 用户登录并打开终端仿真窗口来测试 root 用户。然后运行 `su` 命令登录并以 root 用户身份工作。


    ### 7. 享受其中吧！


    Linux OS 是一个惊人且极其可靠的系统。有数以千计的 Linux 软件供各种用途。


    通过安装和运行 Linux，你可以在操作 Linux 的同时获得很多实用的培训经验。你可以在 Linux 桌面操作并运行常用的 Linux 软件程序。你也可以在
    Linux 命令行操作学习如何使用 Linux 命令——就像专业人士管理 Linux 系统的方式一样。


    ## Linux 快速入门 - 如何使用 CD 中的 Linux 视频教程并在 Windows 中运行 Linux


    Linux 视频教程是学习如何使用 Linux 的极佳、简单且快速的方法。


    在 Windows 中运行 Linux - 这样你就可以学习如何在 Windows 中使用 Linux！


    你可以下载免费的 Linux 虚拟机“播放器”和一个免费的 Linux 虚拟机，这样就可以在 Windows 中运行 Linux。


    只需下载并快速安装免费的 Linux 虚拟机播放器，即可在 Windows 中运行 Linux。


    **Linux 技巧：** 有数百个免费的 Linux 发行版虚拟机可用，包括 Ubuntu、Debian Linux、Red Hat Linux、Fedora
    Linux、SUSE Linux！


    ## 从 CD 视频教程


    现在放入包含视频教程的 CD。这会导致你的浏览器自动运行并显示视频教程列表。


    要观看 Linux 视频，只需点击列表中的视频教程名称，例如“Running Linux in Windows”或“Installing Linux from
    CD / DVD”或“Learning How to Run Linux Commands”——教程将在浏览器中运行。


    ## 在 Windows 中学习 Linux 以亲自获得真实的实战经验！


    现在是在 Windows 中运行 Linux 获取 Linux 培训最好的部分。


    你不仅可以通过观看 Linux 视频来观察和学习如何使用 Linux，还可以使用 Linux 桌面运行 Linux 软件程序，最重要的是——运行 Linux
    命令！


    只需启动一个 Linux 视频，例如“How to Run the Linux grep Command”，并观察如何运行命令——逐步进行。然后点击暂停按钮。


    按住键盘上的 Alt 键（空格键左侧）并按下 Tab 键，进入 Linux 窗口中的 Linux 命令行提示符。


    现在尝试你刚刚看到的 Linux 命令——实验一下！


    然后按 Alt+Tab 回到 Linux 视频窗口，继续观看 Linux 视频并学习该命令的更多选项。

