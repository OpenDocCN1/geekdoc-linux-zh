  md: 'few applications as possible in order to reduce the number of potential security
    risks. As such, bastion firewalls do not perform data management tasks.


    fort implements a series of tests to determine whether a data packet is valid.
    For example, it can determine that a data packet is authorized by determining
    the data packet header contains:


    +   - A valid source address

    - A valid destination address

    - Proper information to access a proper port of an infrastructure server


    If a data packet fails any of the firewall component''s filtering tests, the data
    packet is discarded. Whenever the reason for discarding the data packet can be
    recorded in a log file for future reference.


    To harden with basic rules quickly, we used a script available online at:

    http://www.sf.net/project/simplestfirewall


