  md: "# Virtual I/O adapter\n\nVirtual I/O is storage devices (disk drives, CD/DVD,\
    \ tape, and so on) that are physically owned by one partition and accessed by\
    \ the operating system running in another partition. Virtual I/O is the predominate\
    \ method of storage allocation for a Linux partition on the System p. For planning\
    \ purposes, access to Virtual I/O resources requires that a Small Computer System\
    \ Interface (SCSI) pairing be established between the Linux partition and the\
    \ VIOS partition that host the I/O resources.\n\n# Direct I/O adapter\n\nNative\
    \ I/O is storage devices (disk drives, CD/DVD, tape and so on) that are physically\
    \ owned by the logical partition in which Linux is running. In this case, a physical\
    \ storage adapter is allocated to the logical partition in which Linux is running.\n\
    \n# 2.7.4 Network\n\nThe System p supports the allocation of both virtual and\
    \ native network adapters to a logical partition (in both types of adapters can\
    \ be allocated to the same logical partition). With virtual network adapters,\
    \ network packets are “copied” from the memory allocations of the partitions by\
    \ the Supervisor and provides for very fast, reliable, and secure communications\
    \ between logical partitions.\n\nIn addition to virtual network adapters, physical\
    \ network adapters can also be allocated to a logical partition. For Linux partitions,\
    \ physical network adapters are typically used when Linux is being implemented\
    \ as a firewall or when there is a heavy network bandwidth requirement on the\
    \ workload being supported on Linux.\n\nThere are a number of considerations for\
    \ determining the allocation of network adapters to a Linux partition. These considerations\
    \ include:\n\n+   * Requirements for fast intra-partition access\n* Requirement\
    \ for external network using Shared Ethernet Adapter to access to the Linux operating\
    \ partitions\n* Requirement for direct access (that is, firewall implementation)\
    \ by the Linux partition to network traffic\n* While the assignment of virtual\
    \ and physical network adapters are very dependent on the environment as well\
    \ as the availability of system resources, some general recommendations can be\
    \ made:\n  * Linux partitions that are going to perform firewall functions should\
    \ have a physical network adapter allocated to it for the external traffic, or\
    \ one"
