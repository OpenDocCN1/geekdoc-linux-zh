- img_proc: true
  md: 'To manage a system using IBM Systems Director, that system, at a minimum, must
    support the SSH or DCOM protocol. Level-0 managed systems can be IBM or non-IBM
    servers, desktop computers, workstations, and mobile computers.


    IBM Systems Director discovers Level-0 managed systems by verifying the IP addresses
    on your network and scanning the ports of these addresses using the SSH or DCOM
    protocols. The range of IP addresses that are verified is governed by the IBM
    Systems Director discovery preferences. By default, IBM Systems Director uses
    the range of addresses that are in the IP domain of the manager server.


    When a Level-0 managed system is discovered, it is locked by default. You can
    unlock the system by requesting access to through IBM Systems Director Console.
    After you discover and unlock a Level-0 managed system, you can perform a minimum
    set of tasks on the system:


    +   - Collect inventory that is available from the operating system.


    +   - Install Level 1: Core Services or Level 2: IBM Systems Director Agent by
    using Software Distribution.


    +   - Restart the operating system (Linux only).


    +   - Run command-line programs (only if SSH is present)


    The list of agentless managed systems can be obtained by selecting Level 0: Agentless
    Systems from the Groups panel and right-clicking one of the systems. This shows
    the general tasks available for it (see Figure 5-12), which includes collecting
    and viewing the inventory, viewing the event log, and the remote session feature.
    Some tasks are more general, while others are specific to the operating system.
    For example, we can use the remote session to have console access to the system,
    and that is possible because the system provides the SSH access to it.'
