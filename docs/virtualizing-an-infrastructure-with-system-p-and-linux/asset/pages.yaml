  md: 'Figure 3-2 shows a sample configuration using IVM. VIOS owns all physical adapters,
    while the other two Linux partitions are configured to use only virtual devices.


    ![](img/85c3abc163982638968f0cd21ddc337c_72_0.png)


    Figure 3-2 The IVM configuration


    The tight relationship between the VIOS and the IVM enables the administrator
    to manage a partitioned system without the HMC. The software that is normally
    running on the HMC has been reworked to fit inside the VIOS, reducing its functions
    to those required by the IVM configuration model. Because IVM is running using
    system resources, the design has been developed to have minimal impact on their
    consumption.


    IVM does not interact with the system''s service processor. A specific device
    named the Virtual Management Channel has been developed on VIOS to enable a direct
    Hypervisor configuration without requiring additional network connections to set
    up. This device is activated by default when VIOS is installed as the first partition.


    The IVM was designed to enable a quick deployment of partitions. Compared to HMC
    managed systems, configuration flexibility has been reduce to provide a basic
    usage model. A new user with no HMC skills can manage the system easily in an
    effective way.'
