    # 5.4.8 Managing agentless environment


    This section covers the management features that are provided by IBM Systems Director
    for systems where no IBM Systems Director software is installed. Because most
    of the operating systems installations come with the SNMP software installed (because
    the book is to systems on POWER platforms, we refer here to Linux), this section
    also covers the SNMP installation, configuration, and features provided, and how
    IBM Systems Director can interact with these systems.


    The agentless systems are managed through the network services that are native
    to the operating system. These services can be SSH or Windows Management Instrumentation
    (WMI). They are called agentless or Level-0 managed systems because no IBM Systems
    Director Agent is installed.'
