    # 3.7.2 Hotplug scripts to detect resource changes


    System p running Linux systems with the IBM service and productivity tools installed
    in the system support /bin/hotplug event notification. These events include PCI
    I/O slot changes.


    For example, when an Ethernet adapter is added to a partition dynamically, the
    following agents are invoked to configure the adapter and network:


    +   - pci_bus.agent

    - pci.agent

    - net.agent


    Some of these agents are invoked more than once to allow for event changes at
    different stages.


    In addition to LPAR I/O changes, Linux that support dynamic LPAR changes on processors
    invoke the cpu.agent. Therefore, a cpu.agent script can be added to the /etc/hotplug
    directory to enable multi-threading CPU changes events. This script agent can
    be used for license management/entitlement software and system management tools,
    such as performance monitoring tools. The script can be used to modify user space
    parameters or to invoke different applications based on the CPU change. You can
    find several event scripts in the /etc/hotplug directory after you install the
    rpm, and can use as guides for event programming. Example 3-25 for the list of
    files from /etc/hotplug directory on Red Hat operating system.


