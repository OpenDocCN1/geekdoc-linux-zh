    With an unattended installation, at this point we already have in our furnish
    server:


    +   - An active TFTP service including the netboot.img file in its base directory

    /ftpboot


    +   - The /nfs directory is shared to our private subnet through NFS service and
    the RPM files for Red Hat Enterprise Linux installation are in the directory /nfs/RedHat/RPMS
    of our furnish server


    +   - The DHCP service running and the servers IP addresses mapped to their MAC
    addresses stored in /etc/dhcpd.conf file


    +   - A basic Kickstart file to be used as a template


    To perform an unattended installation of the remaining servers and the servers
    that we want to install later, we need a Kickstart file that includes the necessary
    data about the particularities for each case, such as basic configuration, installation
    method, boot loader options, partition information, network configuration, authentication,
    firewall configuration, display configuration, packages selection, as well as
    pre- and post-installation scripts. For more information about Kickstart installations,
    including commands that we do not discuss here, see the Kickstart installation
    guide, which is available online at:


    http://www.redhat.com


    # ks template files


    We created the Kickstart file, named ks, using the Kickstart configuration tool.
    The final files are we modify this template file following the next ks templates
    table. The final files are ks templates that you can use each time to install
    a new server. You can modify these files according to your requirements, or you
    can create own files using the Kickstart installation guide.


    Each ks template includes the minimal configuration stored in the ks file some
    additional services or packages that we specify in the Additional Packages column
    of the Table 4-3 on page 117 as well as the particular post-installation script
    for each server.'
