  md: '# Configuring HMC to send serviceable events to IBM Systems Director


    One HMC can manage several IBM System p5 servers. Each server can send informational
    or warning messages to the HMC and these messages are collected by the HMC as
    serviceable events.


    The serviceable events collected by the HMC can also be forwarded as SNMP traps
    to the IBM Systems Director Server. HMC software has the capability to notify
    an SNMP manager about any new SNMP event. This is the Customer Notification feature
    of the Service Agent component.


    Figure 5-6 Managing CEC and LPAR using IBM Systems Director


    ![](img/85c3abc163982638968f0cd21ddc337c_182_0.png)


    Chapter 5. Managing a virtualized server environment 169'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'To configure the HMC to send events to IBM Systems Director server, we have
    to connect to HMC using the WebSM client or from the IBM Systems Director Console
    (the HMC Extension must be installed). Follow these steps:


    +   1. From the IBM Systems Director Console, you have to right-click the HMC
    system and select HMC Manager Tools then select Service Focal Point.


    +   2. Provide the credentials and you will log in to the WebSM.


    +   3. Select the Service Agent icon from the Service Applications Navigation
    area and click the Customer Notification in the Service Agent Configuration pane.


    +   4. Customer Notification feature can send messages to the IBM Systems Director
    when a service events occurs on the HMC or on the connected systems. By the Customer
    Notification dialog box, select the SNMP Trap Configuration tab and add the IP
    address of the IBM Systems Director Server and the public community name, as shown
    in Figure 5-7.


    ![](img/85c3abc163982638968f0cd21ddc337c_183_0.png)


    Figure 5-7 Customer notification feature of HMC


    **Generating serviceable events**

    To test the HMC can send serviceable events (as SNMP messages) to the IBM Systems
    Director Server, you have to generate a serviceable event. For this example, we
    choose the Virtual I/O partition from our OpenPower test server that is managed
    by the HMC that we configured previously.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'To generate a serviceable event from VIOS partition, use the diag utility:


    +   1. To execute diag command from Virtual I/O Server, we run oem_setup_env command
    to access AIX shell prompt.


    +   2. To generate such an event, run diag in a shell prompt.


    +   3. In the FUNCTION SELECTION menu, go to Advanced Diagnostics Routines and
    select Problem Determination.


    +   4. From the list of resources, select the Operator panel (oppanel) resource
    by moving the cursor to it and pressing Enter.


    +   5. Press F7 to continue, and finish by selecting Yes to create a test serviceable
    Event.


    Later you can observe the event in the HMC Service Focal point using the HMC Manager
    Tools that are provided in the IBM Systems Director Console or by running the
    command shown in 5-16 from an SSH session on the HMC console.


    Example 5-16 Serviceable event generated by Virtual I/O Server


    ```

    hscroot@riorange:~> lssvcevents -t hardware

    problem_num=33,pmh_num,refcode=B0J30001,status=open,first_time=08/31/2006

    14:53:50,last_time=08/31/2006

    14:53:50,name=riorange,sys_mtms=9124-720/100180DA,e

    closure_mtms=9124-720/100180DA,firmware_fix,text=other subsystem

    (0XC): Predictive Error (0x20),created_time=08/31/2006

    14:53:50,reporting_name=riorange,repo

    rting_mtms=9124-720/100180DA,failing_mtms=9124-720/100180DA,analyzing_hmc

    =riorange,event_time=01/09/1970 21:00:59

    ```


    We can see the serviceable event generated from the Virtual I/O partition in the
    list of the events, as shown in Example 5-16. After you configure HMC to send
    serviceable events to IBM Systems Director, the same event can be seen in the
    IBM Systems Director Console as a warning message associated with the HMC system.


    # 5.4.7 IVM managed environment


    IVM support has been introduced in IBM Systems Director version 5.20. This section
    discusses how IBM Systems Director 5.20 works with an IVM managed IBM Systems
    p5 server. Throughout this section, we present this new functionality and how
    we applied it in this test environment. This scenario presents how to manage an
    IVM server using SNMP in IBM Systems Director 5.20 and'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'the tasks for making an IVM server a managed device in IBM Systems Director
    5.20.


    IBM Systems Director 5.20 support for IVM functionality also works with a Level-0
    IBM Systems Director Agent (known as an agentless system). Thus, this section
    covers a Level-0 Agent environment using an IVM server. For the chart shown in
    Figure 5-8 illustrates the infrastructure that we have used for this scenario.


    Our test environment consists of:


    +   - Management Server

    - Red Hat Enterprise Linux 4.4

    - IBM Systems Director Server 5.20 (including all the install-time extensions)

    - VNC Server 4.0-8.1 to enable GUI-based Director Console

    - IVM Server (managed server)

    - Virtual I/O Server v1.4

    - OpenSSH_4.3p2


    ![](img/85c3abc163982638968f0cd21ddc337c_185_0.png)


    Figure 5-8 Access IBM Systems Director Console using vnc-server


    172 Virtualizing an Infrastructure with System p and Linux'
