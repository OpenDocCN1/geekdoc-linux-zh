  md: '# 1.1 Overview


    This book looks at the question of running your infrastructure in a totally virtualized
    environment. There are many reasons for a business to perform an architectural
    review of their existing infrastructure to determine the value of migrating to
    a virtualized environment. A few include:


    +   - Business challenges to reduce costs of existing infrastructure

    - Consolidation of IT resources during a business merger

    - Containing costs of growth

    - Capturing opportunities by provisioning new resources quickly

    - Business desire to utilize Capacity On On Demand

    - Physical consolidation to reduce space, power and cooling requirements

    - Moving from a just-on-time purchase model to an architected high availability
    business model with flexibility and scalability


    The IBM System p hardware with the enterprise ready Linux OS provides a solid
    foundation on which to build your business. Advanced POWER virtualization provides
    flexibility and proven IBM p systems provide scalability. The infrastructure can
    be ready to handle your business opportunities without the burdensome costs that
    growth can otherwise bring to your IT environment.


    Consolidating existing infrastructure server farms into a IBM System p virtualized
    environment can help you business challenges of space, power, and total cost of
    ownership.


    # 1.2 Virtualization overview


    Virtualization is the creation of substitutes for real resources, that is substitutes
    that have the same functions and external interfaces as their counterparts but
    differ in attributes such as size, performance, and cost. These substitutes are
    called virtual resources, and their users are typically unaware of the substitution.
    Virtualization is commonly applied to physical hardware resources by combining
    multiple physical resources into shared pools from which users receive virtual
    resources. With virtualization, you can make one physical resource look like multiple
    virtual resources. Virtual resources can have functions or features that are not
    available in their underlying physical resources.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Virtualization can provide the following benefits:


    +   Consolidation to reduce hardware cost:

    - Virtualization enables you to access and manage resources efficiently to reduce
    operations and systems management costs while maintaining needed capacity.

    - Virtualization enables you to have a single server function as multiple virtual
    servers.


    +   Optimization of workloads:

    - Virtualization enables you to respond dynamically to the application of its
    users.

    - Virtualization can increase the use of existing resources by enabling dynamic
    sharing of resource pools.


    +   IT flexibility and responsiveness:

    - Virtualization enables you to have a single, consolidated view of, and easy
    access to, all available resources in the network, regardless of location.

    - Virtualization enables you to reduce the management of your environment by providing
    emulation for compatibility, improved interoperability, and transparent change
    windows.


    # 1.2.1 Business drivers


    Increasing emphasis on the cost of delivering IT services has caused an unprecedented
    interest in server consolidation. *Server consolidation* is the simplification
    and optimization of IT environments by a reduction of the number of discrete components
    of infrastructure. Consolidation can be done on application environments, such
    as servers and databases, and on physical hardware, such as servers, routers,
    and storage. While numerous benefits can be cited for server consolidation, this
    book focuses on the practical management aspects of consolidating mixed workload
    types to asymmetrically configured CPU server partitions.


    Server consolidation has become especially attractive as the current generation
    hardware and logical partitioning allowing a number of systems to be hosted within
    a single frame. With the announcement of the POWER5™ processor-based family of
    systems, optional mainframe-inspired IBM Virtualization Engine™ technologies have
    arrived for the Linux environment. The term virtualization* has achieved near
    universal recognition. It refers to the ability to abstract the physical properties
    of hardware in a way that allows a more flexible usage model. Virtualization can
    apply to microprocessors, memory, I/O devices, or storage. Fine grain virtualization
    permits near instantaneous matching of'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'workload to resources allocated, eschewing wasted resources common to the one-server/one-application
    model of computing.


    This ability to balance CPU resources quickly and dynamically between different
    workload priorities on multiple partitions in a single server fulfills an important
    requirement for an an on demand operating environment.


    # # 1.2.2 Why IT optimization and virtualization


    The primary purpose of IT optimization and virtualization is to simplify the IT
    infrastructure. It simplifies access to resources and the management of those
    resources.


    Figure 1-1 shows how virtualization solutions address the concerns of IT optimization.
    The yellow bars reflect spending on new systems that, over time, levels off and
    then actually turns downward. The blue bars reflect the cost of people, which
    keeps escalating and is expected to more than quadruple by 2008. The blue trends
    show a rapid growth of server footprints and the associated management expense
    somewhat. Virtualization can help reduce the number of footprints by increasing
    the utilization of servers and reallocating resources.


    In the current economy, IT managers of competitive companies are searching for
    growth of revenue. This growth has returned as one of the most important concern.
    However, this growth must be contained on the same budget. Coupled with dramatically
    escalating administrative costs, space issues, and energy costs, enterprises cannot
    make headway by suppressing hardware spending. In addition to management headaches,
    these servers can be frequently utilized perform at peak loads, creating both
    efficiency and user satisfaction issues. In the end, these issues can cost money.
    IT managers must address the underlying infrastructure of administrative and server
    costs and making significant improvements in cost containment to grow and enabling
    proliferation and fracturing. Business is becoming more fluid, but the IT infrastructure
    is becoming more unmanageable.


    4 Virtualizing an Infrastructure with System p and Linux'
