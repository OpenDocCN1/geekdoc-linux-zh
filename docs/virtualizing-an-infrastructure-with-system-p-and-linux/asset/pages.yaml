    # # Resource monitor attributes on Linux on POWER


    This appendix provides a list of resource monitor attributes that are supported
    by Linux on POWER. You can use Table B-1 to identify the resource monitor attributes
    that you want to monitor on your Linux environment.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Linux on POWER resource-monitor attributes


    These resource-monitor attributes are for Red Hat Enterprise Linux AS and SUSE
    Linux Enterprise Server 9 for IBM POWER operating systems.


    Table B-1 Resource monitor attributes on Linux on POWER


    | Resource monitor | Attributes |

    | --- | --- |

    | CPU | CPU utilization<br>Process count |

    | Disk | Notes:<br>1. The disk drive monitor attributes are repeated for each
    local nonvolatile logical drive that is found.<br>2. The list of file-system attributes
    is displayed first; then, the disk monitor attributes are displayed under each
    file system.<br>-Blocks available<br>-Blocks used<br>-Inodes available<br>-Inodes
    used<br>-Percentage blocks available<br>-Percentage block used<br>-Percentage
    Inodes available<br>-Percentage Inodes used<br>-Percentage space available<br>-percentage
    space used<br>-Space available (MB)<br>-Space used (MB) |'
  merge: -1
  pgno: 261
- img_proc: true
  md: '| Resource monitor | Attributes |

    | --- | --- |

    | File | Notes:

    1. File-monitor attributes can be files or directories.

    2. For compatible file-system types, the "Directory exists" or "File exists" attribute
    (depending on which is applicable) is always valid data.

    3. If there are additional directories, additional subelements are displayed.

    4. A directory can contain hundreds of subelements. If it does, a directory might
    take 5 seconds or longer to open.

    ► Directory

    - Directory exists

    - Last modified

    - Directory attributes

    - Directory owner

    - Directory size (bytes)

    - Object type

    ► File

    - Checksum

    - File exists

    - Last modified

    - File attributes

    - File owner

    - File size (bytes)

    - Object type |

    | List of directory contents | ► Directory attributes

    ► Directory exists

    ► Directory owner

    ► Directory size (bytes)

    ► Last modified

    ► Object type |

    | Memory | ► Available (bytes)

    ► Used (bytes)

    ► Total memory

    ► Unused non-cached (MB) |'
  merge: -1
  pgno: 262
- img_proc: true
  md: '| Resource monitor | Attributes |

    | --- | --- |

    | Process | Note: The number of applications or executable files that a process
    monitor checks can vary. The IBM Systems Director user configures the processes
    that are monitored using the Process monitor task in IBM Systems Director Console.
    Each of the process-monitor attributes is displayed for each executable file that
    is monitored.

    > Current active processes

    > Maximum running at once

    > Maximum running yesterday

    > New executions counted

    > Times failed to start

    > Time started

    > Time stopped

    > Total execution time

    > Yesterday''s execution time

    > Yesterday''s new executions |

    | CIM | Note: The attributes for CIM monitors can vary depending on the features
    and functions that you have configured on the managed system.

    > CIMV2

    > ibmsd

    > ibmsd_remote

    > pg_internal

    > pg_interop |'
  merge: -1
