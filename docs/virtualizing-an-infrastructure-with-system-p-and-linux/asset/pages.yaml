    # 3.7 Installing service and productivity tools for Linux on POWER


    There are a number of additional Linux on POWER utilities that you need to install
    to support specific functions of a running Linux operating system on a POWER based
    system, including hardware service aids and productivity tools, as well as installation
    aids. Some tools that are available for Linux on POWER include:


    +   - The libtasks package contains a library that allows access certain functionality
    provided by platform firmware. This functionality is required by many of the higher-level
    service and productivity tools


    +   - System Resource Controller (SRC) is a facility for managing daemons on a
    system. It provides a standard command interface for defining, undefined, starting,
    stopping, querying status, and controlling for daemons.


    +   - The Reliable, Scalable, Cluster Technology (RSCT) packages provide the Resource
    Monitoring Control (RMC) functions and infrastructure to monitor and manage one
    or more Linux systems. RMC provides a flexible and extensible system for monitoring
    numerous aspects of the system. It also allows customized responses to detected
    events.


    +   - Cluster Systems Management (CSM) packages provide for the exchange of host-based
    authentication security keys. These tools also set up distributed RMC features
    on the HMC.'
  merge: -1
