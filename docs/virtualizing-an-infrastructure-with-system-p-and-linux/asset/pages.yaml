    # 3.6 Installing the client Linux partition


    This section describes the method to install Linux onto a previously defined client
    partition. You can choose from different Linux installation methods:


    +   * Install from Linux ISO image and boot the system from the DVD/CD-ROM drive.
    This method is applicable if you only have few Linux to install in your environment.

    * Linux network installation (using NFS, FTP, or HTTP). This method requires that
    your client partition can access network where the ISO image is located. This
    method is useful if you deploy more Linux operating systems in your environment.


    For our test environment, we created a furnish partition to handle the Linux ISO
    image and configured this partition as an TFTP/NFS/DHCP/DNS partition. We use
    the Virtual Ethernet adapters for booting and the virtual SCSI disks that were
    previously allocated to client partitions for operating system image. For more
    information regarding Linux installation, refer to Chapter 4, “Installing and
    configuring Linux infrastructure services” on page 93.


    > Tip: A virtual optical device in a System p virtualization environment can be
    used for a CD or DVD installation, as long as it is not already assigned to a
    client partition.


    # 3.6.1 Installation tools for Linux on POWER


    The IBM Installation Toolkit for Linux on POWER provides a set of tools and utilities
    that can help you install the Linux operating system on IBM servers with Power
    Architecture. The toolkit is available for download as an ISO image, which you
    can burn to your own CD for the Toolkit:


    ```

