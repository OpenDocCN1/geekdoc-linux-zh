- img_proc: true
  md: 'To create, build, and maintain EAPs:


    +   1. Plan for EAP implementation. Consider what event you want to monitor for,
    and what action should occur as a result of that alert.


    +   2. Create any trigger points if necessary, such as resource monitors, process
    monitors, and so forth. This step is only required if you want to trigger your
    EAP on an event that does not occur normally. For example, a CPU utilization threshold
    or process termination


    +   3. Create any actions if necessary, such as process tasks, batch files, and
    so forth. This step is only required if you want to take an action that does not
    exist in the standard installation (for example, a Process Task that terminates
    a process or a batch file that executes a series of commands).


    +   4. Create and name an empty EAP to contain the desired event filters and actions.
    The purpose of an EAP is to bind an event generated by one or more managed systems
    to one or more desired actions.


    +   5. Create an event filter. Event filters can be configured to use an approach
    where the criteria is very broad (for example, IBM Systems Director Agent event),
    or a very specific approach (for example, IBM Systems Director Console login failure
    due to a bad password). An EAP can have one or more event filters associated with
    it.


    +   6. Select and customize the actions. Most actions require some configuration
    in order to be used. For example, you must provide several pieces of information
    about the recipient and e-mail server to use the Send an Internet (SMTP) e-mail
    action. An event filter can have one or more actions associated with it.


    +   7. Apply (associate) the completed EAP to a group or managed system.


    It is important to understand how the typical event flows through IBM Systems
    Director. A basic understanding of the process can help you build and troubleshoot
    an action plan efficiently.


    When IBM Systems Director receives an event message from a system, it performs
    the following steps to determine which actions must be:


    +   1. The system generates an event and forwards the event to all IBM Systems
    Director Servers that have discovered the system (except for some events, such
    as Resource Monitor thresholds, which are sent only to the management server where
    they were configured).


    +   2. IBM Systems Director Server examines the event and determines which system
    generated the event and to which groups the system belongs.


    +   3. IBM Systems Director Server checks to see if EAPs are associated with the
    system or its groups.'
  merge: -1
  pgno: 197
- img_proc: true
  md: "4. The associated EAPs are checked to determine whether any event filters match\
    \ the event that was received.\n\n5. The server carries out each associated action\
    \ for each matching filter.\n\n# Definitions of terms:\n\n+   - Event\n  A flag\
    \ that identifies a change in a process or device, such that notification of that\
    \ change can be generated and tracked. Examples include a server going offline,\
    \ or CPU utilization exceeding a predefined percentage.\n\n+   - Event filter\n\
    \  A set of characteristics or criteria that determine whether an incoming event\
    \ should be acted upon.\n\n+   - Action\n  A step that is taken in response to\
    \ an event.\n\n+   - Event action plan\n  An association of one or more event\
    \ filters with one or more actions. EAPs become active when you apply them to\
