- img_proc: true
  md: 'This failure can happen after an upgrade installation of the HMC, when the
    firewall ports for Open Pegasus and SLP are disabled and no longer have firewall
    access. To correct this problem, complete the following steps, as shown in Figure
    5-5 on page 167:


    +   1. In the HMC Navigation Area pane, expand the affected and expand **Management**.
    Click **HMC Configuration.**


    +   2. In the HMC Configuration pane, click **Customize Network Settings.**


    +   3. Select the LAN Adapter that is connected to your LAN and click **Details.**


    +   4. In the LAN Adapter window, go to the Firewall page.


    +   5. The top pane displays the firewall ports that you can enable. Select **Open
    Pegasus** and **SLP** from the list and click **Allow Incoming.** Open Pegasus
    and SLP is added to the bottom pane of enabled ports. Click **OK.**


    +   6. If a message window about restarting the HMC displayed, click **OK.** After
    the HMC is restarted, the ports are enabled and IBM Systems Director Server can
    discover the HMC.'
