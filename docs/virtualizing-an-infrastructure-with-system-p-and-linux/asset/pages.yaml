    To implement virtualization on System p, the Advanced POWER Virtualization feature
    is required. A logical partition running VIOS with enough resources to share with
    other partitions is required. Table 2-1 lists the minimum hardware requirements
    that must be available to create the VIOS.


    | Table 2-1 Resources that are required to create the VIOS |

    | Resource | Requirement |

    | HMC or IVM | Required to create the partition and assign resources |

    | Storage adapter | The server partition needs at least one storage adapter |

    | Physical disk | Must be at least 16 GB; can be shared |

    | Ethernet adapter | If you want to route network traffic from virtual Ethernet
    adapters to a Shared Ethernet Adapter, you need an Ethernet Adapter |

    | Memory | At least 512 MB required |

    | Processor | At least 0.1 shared pool virtual processor capacity |


    # 2.7 Planning for resource allocation


    Planning for the virtualization implementation on the System p platform consists
    of determining resource allocation in the following areas:


    +   * Processor

    * Memory

    * I/O Adapter

    * Network'
