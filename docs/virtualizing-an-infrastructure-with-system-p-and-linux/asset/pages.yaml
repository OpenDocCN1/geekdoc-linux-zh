  md: '# 1.4.3 Virtualization capabilities of System p running Linux


    With the introduction of the Power Architecture in the System p servers and JS20
    and JS21 blades, there has been advancement in the ability to virtualize server
    resources and selective I/O devices within a single server. supports this function.
    The first LPAR capability of POWER4 processor-based systems is extended with dynamic
    LPAR capabilities (the ability to change processor allocation to partitions without
    having to reboot the partition) in Power Architecture technology-based systems
    and currently supported by SUSE Linux Enterprise Server 9, SUSE Linux Enterprise
    Server 10, and Red Hat Enterprise Server AS 4. In addition to dynamic LPAR, you
    can run partitions with processor allocations in fractional amounts. This is called
    Micro-Partitioning.


    Micro-Partitioning. Micro-Partitioning can be used to provide a partition with
    less than a full processor (for example, a firewall or a DNS server partition).


    Partitions as small as 1/100th of a processor and in increments as small as 1/100th
    of a processor can be defined. These partitions can reside and within a pool of
    processors (shared processor pool) where the allocation of processors to the workload
    can change dynamically based on user-defined parameters and rules. The rules indicate
    that a partition can only have a maximum amount of processing power or be unlimited
    in its ability to absorb all unused processor capabilities.


    Another feature in System p and BladeCenter virtualization is Virtual I/O Server
    (VIOS) where several partitions can share a single physical adapter, thus saving
    the cost of multiple adapters when workloads allow the sharing. Today Power Architecture
    technology-based systems with Linux can share SCSI, Channel, DVD, and Ethernet
    adapters. Virtual LAN capabilities (AIX 5L V5.3 and Linux) allow inter-partition
    communications on a virtual LAN without the need for LAN adapters or cabling.


    The virtualization capabilities in System p5 servers and BladeCenter JS21 are
    partially included in the base system as no extra charge feature (providing LPAR,
    dynamic LPAR, and VLAN) and an optionally charged for feature, Advanced POWER
    Virtualization (Virtual I/O Server and Micro-Partitioning), which is standard
    on the p-590 and ps-595. Both capacities require partition management support
    through IVM or an HMC. This support is required to initialize and manage the virtualized
    environment. A single HMC can manage up to 48 different physical servers. The
    IVM feature is enabled through a Web browser and can only manage the system to
    which the Web browser is connected. The JS21 blade is supported by these same
    virtualization capabilities but only through the IVM interface because the JS21
    has no HMC connectivity support.


