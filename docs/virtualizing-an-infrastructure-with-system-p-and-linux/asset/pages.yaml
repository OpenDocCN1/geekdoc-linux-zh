- img_proc: true
  md: '**Important:** These systems must, at a minimum, support either the SSH or
    DCOM protocol.


    For more details about enhancing Level-0 features with SNMP, see 5.4.8,

    "Managing agentless environment" on page 177.


    # Agent Level-1 managed system


    Managed systems that have IBM Systems Director Core Services (but IBM

    Systems Director Agent) installed on them are referred to as Level-1. It provides

    hardware-specific functionality for IBM Systems Director to communicate with

    and administer the managed system.


    The IBM Systems Director Core Services package installs on Linux:


    +   * A Service Location Protocol (SLP) service agent

    * An Secure Sockets Layer (SSL) enabled CIMOM

    * An optional ssh server

    * Platform-specific instrumentation


    IBM Systems Director Core Services provide a subset of IBM Systems Director

    Agent functionality. Level-1 Agent provides management server through

    standard protocols. You can perform the following tasks on a Level-1 managed

    system:


    +   * All Level-0 functions

    * Collecting inventory

    * Promotion to Level-2 management by distributing the IBM Systems Director

    Agent package

    * Managing events using event action plans, event subscription, and the event

    log

    * Monitoring hardware status

    * Running command-line programs

    * Distributing system update packages through Software Distribution


    # Agent Level-2 managed system


    A managed system on which the IBM Systems Director Agent is installed

    referred to as Agent Level-2 managed system. It provides enhanced

    management functionality, which vary depending on the operating system

    which it is installed.'
