    > Attention: Some tasks are available on a Windows management server used

    as System p5 management but are not available in a System p5 management

    server, regardless of the managed operating system.


    # IBM Systems Director Agent features


    Depending on the agent level, a System p managed system provides different

    features for management.


    # Agentless managed systems


    A System p5 server on which no IBM Systems Director component is

    installed is named as an agentless system, or Level-0.


    An agentless managed system provides the following basic features:


    +   - Discovery

    - Remote session (requires ssh)

    - Power control

    - Promotion to Level-1 or Level-2 through Update Assistant'
