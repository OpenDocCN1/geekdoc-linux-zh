    #  5.4.2 IBM Systems Director components


    The IBM Systems Director product consists of four components:


    +   * IBM Systems Director Core Services


    Systems that have IBM Systems Director Core Services (but not IBM Systems Director
    Agent) installed on them are referred to as *Level-1*. Level-1 control provides
    administer-specific functionality for IBM Systems Director to communicate with
    and administer the managed system.


    +   * IBM Systems Director Agent


    Systems that have IBM Systems Director Agent installed on them are referred to
    as *Level-2* managed systems. Level-2 provides enhanced functionality with'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'which IBM Systems Director can communicate with and administer the managed
    system.


    +   IBM Systems Director Console


    This is the graphical interface (GUI) for IBM Systems Director Server from which
    the system administrator can perform tasks in IBM Systems Director. This is installed
    automatically with the Director Server on System p, running AIX or Linux. The
    IBM Systems Director console provides the same GUI, independently of the machine
    type and operating system.


    +   IBM Systems Director Server


    This is the main component of IBM Systems Director. It contains the management
    repository and data, the server engine and it provides all the management functions
    of IBM Systems Director.


    IBM Systems Director can also manage systems on which no component of IBM Systems
    Director is installed. Such managed systems are referred to as Level-0 managed
    systems. These systems must at a minimum support either the Secure Shell (SSH)
    or Distrub Component Object Model (DCOM) protocol.


    IBM Systems Director capabilities relative to the different levels are detailed
    in the next section, IBM Systems Director capabilities on System p. The management
    features vary according to the operating system on which the agent is installed.


    # 5.4.3 IBM Systems Director capabilities on System p


    IBM Systems Director provides a comprehensive suite of system capabilities. Management
    capabilities can vary depending on the operating system that is hosting the management
    server, the operating system of the managed system, and the agent level that is
    installed on it.


    This section provides a list of the tasks that are available for a System p management
    server and the features available from a managed System p.


