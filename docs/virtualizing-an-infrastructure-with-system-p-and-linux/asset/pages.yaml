  md: '# 3.1 Comparing the use of the HMC and the IVM


    Mid-range and larger System p servers need a Hardware Management Console (HMC)
    to create and manage logical partitions, dynamically, to invoke Capacity On Demand,
    to utilize Focal Point, and to facilitate hardware control. High-end servers with
    Bulk Power Controller (BPC), such as the IBM p5 model 590, 595, and 575 systems,
    require at least one HMC as a Dynamic Host Configuration Protocol (DHCP) server.
    Two HMCs are recommended for enhanced availability. Mission critical solutions,
    even those hosted on entry or mid-range servers, can benefit from having dual
    HMCs.


    HMCs might not be cost-effective for distributed, entry-level systems that nevertheless
    require the capabilities of Advanced POWER Virtualization. Entry-level servers
    can be configured without an HMC using the Integrated Virtualization Manager (IVM).
    The IVM provides a subset of HMC functions and a single point of control for small
    system virtualization. The IVM does not offer the full range of management capabilities
    found on the HMC, but it might be sufficient for a small server with one to eight
    processors. The IVM is a component of the Virtual I/O Server Version 1.2 and later,
    which comes with purchase of the Advanced POWER Virtualization hardware feature
    code.


    Table 3-1 provides comparison between the HMC and the IVM.


    Table 3-1 Comparison between the HMC and the IVM


    | HMC | IVM |

    |---|---||

    | Physical footprint | A desktop or rack-mounted appliance | Integrated into the
    server |

    | Installation | Appliance is pre-installed | Installed with the VIOS (pre-installed
    is available on some systems) |

    | Managed OS supported | AIX 5L, Linux and i5/OS | AIX 5L and Linux |

    | Virtual console support | AIX 5L, Linux, and i5/OS virtual console support |
    AIX 5L and Linux virtual console support |

    | User security | Password authentication with granular control of task-based
    authorities and object-based authorities | Password authentication with support
    for either full or read-only authorities'
