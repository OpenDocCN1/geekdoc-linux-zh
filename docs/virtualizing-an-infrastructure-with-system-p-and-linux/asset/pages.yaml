  md: 'The VIOS CLI supports two execution modes:


    +   - Traditional mode

    - Interactive mode


    The traditional mode is for single command execution. In this mode, you run one
    command at a time from the shell prompt. For example, to display the mapping between
    physical, logical and virtual devices, enter the command shown in 3-4.


    Example 3-4 The ismap command in traditional mode


    ```

    $ ioscli ismap -all

    ```


    ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

    To reduce the amount of typing required in traditional shell level mode, there
    is an alias for each subcommand. With the aliases set, you are not required to
    type the ioscli command as shown in Example 3-5.


    Example 3-5 The ismap command with an alias used


    ```

    $ ismap -all

    ```


    In interactive mode, the user is presented with the ioscli command prompt by executing
    the ioscli command without any subcommands or arguments. From this point forward,
    ioscli commands are run one after the other without having to re-enter the ioscli
    command. For example, to enter interactive mode, enter the command shown in Example
    3-6.


    Example 3-6 Interactive mode


    ```

    $ ioscli

    ```


    When in interactive mode, to list all virtual devices, enter the l1map command
    as shown in Example 3-7.


    Example 3-7 Command in interactive mode


    ```

    $ lmap -all

    ```


    External commands, such as grep or sed, cannot be run from the interactive mode
    command prompt. You must first exit interactive mode by entering quit or exit.'
