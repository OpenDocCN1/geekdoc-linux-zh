    ![](img/85c3abc163982638968f0cd21ddc337c_177_0.png)


    Figure 5-4 Content of HMC and HMC members icon


    3. To check the current state of the HMC, right-click the HMC, and select Presence
    Check. You can also right-click the HMC and select Open to view the general attributes
    of a managed server, in this case the HMC.


    Virtualizing an Infrastructure with System p and Linux'
