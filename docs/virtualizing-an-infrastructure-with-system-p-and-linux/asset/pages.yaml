    # 5.4.6 HMC managed environment


    This section discusses the integration of IBM Systems Director with an HMC system
    that is used for managing one or more IBM p servers. As a hardware control point,
    HMC provides access to features such as local partition management, micropartitioning,
    and dynamic LPAR operations.


    The HMC extension is installed automatically with IBM Systems Director Server
    and IBM Systems Director Console on management servers and management consoles
    running Linux on POWER. You can check the installed HMC extension of IBM Systems
    Director Server on Linux on POWER by entering the `rpm -qa` grep command, as shown
    in Example 5-15.


    Example 5-15 Verifying HMC extensions installed on Linux


    ```

    [root@myrmt bin]# rpm -qa | grep HMC

    HMMMCCommonExt-5.20-1

    HMMCServerExt-5.20-1

    HMMMCConsoleExt-5.20-1

    ```'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'HMC support from IBM Systems Director Server is provided by an extension installed
    automatically with the IBM Systems Director. Therefore, you do not have to install
    additional extensions.


    # Discovering the HMC


    To manage and monitor HMC through IBM Systems Director Server, you have to add
    the HMC definition to the IBM Systems Director Server database. We recommend that
    you use the automatic discovery process for the HMC, rather than adding it to
    the system manually. Before running automatic discovery, you can change certain
    HMC discovery options in Discovery Preferences under the Options menu.'
  merge: -1
