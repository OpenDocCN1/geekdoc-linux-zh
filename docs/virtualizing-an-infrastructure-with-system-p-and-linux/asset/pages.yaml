    ### Extending the firewall policy

    Suppose address 192.168.1.0/24 matches your internal network. So, there is no
    need to change it, but you need to add support for the Web server inside. For
    that, we need to add rules to permit clients on the Internet to connect to it
    via TCP port 80. Let the server''s address be 192.168.1.10.


    There is an available Firewall Builder Cookbook on the Web site at:

    http://www.fwbuilder.org/archives/cat_cookb.html


