  md: '# 2.4 IBM Systems Workload Estimator


    You can use the IBM Systems Workload Estimator when planning for capacity and
    workloads. Using the IBM Systems Workload Estimator, you can model your logical
    partition environment, specify operating systems and applications that run in
    those logical partitions, and specify what types of jobs they will handle. The
    IBM Systems Workload Estimator then assists you in making sure that your configuration
    is sufficient to meet the computing requirements. This tool is a Web-based sizing
    tool for System i, System p, and System x. You can use the tool to size a new
    system, to size an upgrade to an existing system, or to size a consolidation of
    several systems.


