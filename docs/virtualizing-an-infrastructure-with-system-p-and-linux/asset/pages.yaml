  md: '# Working with HMC Manager Tools


    When you select HMC functions provided by IBM Systems Director Console, an HMC
    WebSM window is started. Follow these steps:


    +   1. Click the HMC and HMC Members in the left panel. Go to the central panel
    of IBM Systems Director Console and right-click the managed object that represents
    the HMC. Go to HMC Manager Tools. Select the task that you want to run.


    +   2. Provide HMC credentials (user ID and password) to launch the HMC WebSM
    console. Usually, this is the hscroot user.


    # Managing CECs and LPARs


    In addition to the HMC Manager Tools, IBM Systems Director Server provides support
    for managing CECs. For example, you can turn off and turn on the IBM p server
    hardware that is managed by HMC through IBM Systems Director Console. Follow these
    steps:


    +   1. Start by clicking the HMC and HMC Members in the Groups panel on the left.
    Go to the central panel and right-click the physical platform that represents
    the System p server hardware. Select Power Management™ from the menu to turn ON
    or OFF, or restart the System p server. See Figure 5-6.


    +   2. You can schedule another time to turn System p server on or off by selecting
    the Schedule button. To turn it on or off immediately, click the Execute Now button.'
