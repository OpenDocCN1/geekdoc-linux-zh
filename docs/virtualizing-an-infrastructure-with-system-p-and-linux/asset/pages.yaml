    With these additional features from APV such as Micro-Partitioning™ and virtual
    I/O (disk and communication adapter), users can now further utilize resources
    within a single server.


    Micro-Partitioning is the ability to run more partitions on a server than there
    are physical processors. The concept is not novel. IBM Mainframe systems have
    supported it for years. What is unique is that IBM has implemented Micro-Partitioning
    as an option in the POWER processor-based servers (on System p5™ 590 and 595),
    bringing this function to a broader class of Linux environment clients and applications.
    The Linux operating system has been adapted and optimized for virtualization.


    Micro-Partitioning is the latest in a set of evolutionary steps in virtualization
    for POWERS processor-based servers. Figure 1-2 shows the steps of partitioning
    evolution, with the historical view of a server with one operating system managing
    the resources of the system.


    The next step was logical partitioning (LPAR), which was first offered on the
    POWER4™-based servers in 2001. With logical partitioning, it is possible to run
    more than one partition on a server, with each partition having a unique operating
    system. The CPU granularity of logical partitions was done at the physical processor
    level. Thus, there could not be more partitions than physical processors. Logical
    partitioning was extended with Linux in 2004 to permit resources to be moved between
    partitions dynamically, though the granularity of the partitions was still'
