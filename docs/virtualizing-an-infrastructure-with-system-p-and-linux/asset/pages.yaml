  md: 'Note: This test environment used a single VIOS. For a higher degree of data
    access or resilience, consider a scenario that uses multipath I/O or include a
    second Virtual I/O Server.


    We use Table 3-2 on page 55 as an example in creating virtualization environment
    for Linux infrastructure services in Chapter 4, "Installing and configuring Linux
    infrastructure services" on page 93. There are two ways you can implement virtualization
    on System p, using the HMC or the IVM. We explain how to use both in the following
    sections.


    # 3.2.1 Using the HMC for System p virtualization


    The HMC provides a centralized point of hardware control in System p environment.
    A single HMC can manage multiple POWER5 processor-based systems, and two HMCs
    can manage the same set of servers in a dual-active configuration that is designed
    for high availability.


    Hardware management is performed by an HMC using a standard Ethernet connection
    to the service processor of each system. Interacting with the service processor,
    the HMC is capable of modifying the hardware configuration of the managed system,
    querying for changes, and managing service calls.


    An administrator can either log in to the physical HMC and use the native GUI
    or download a client application from the HMC. This application can be used to
    manage the HMC from a remote desktop with the same look and feel of the native
    GUI.


    Because it is a stand-alone personal computer, the HMC does not use any managed
    system resources and can be maintained without affecting system activity. Reboots
    and software maintenance on the HMC do not have any impact


    In the likely case that the HMC requires manual intervention, the systems continue
    to be operational and a new HMC can be plugged into the network and configured
    to download from the managed systems the current configuration, thus becoming
    operationally identical to the replaced HMC.


    The major HMC functions include:


    +   - Monitoring of system status

    - Management of IBM Capacity on Demand

    - Creation of logical partitioning with dedicated processors

    - Management of LPARs including power on, power off, and console

    - Dynamic reconfiguration of partitions'
  merge: -1
  pgno: 70
- img_proc: true
  md: '+   Support for deploying plans created by the SPT

    Management of virtual Ethernet among partitions

    Clustering

    Concurrent firmware updates

    Hot add or remove of I/O drawers


    One HMC supports up to 48 POWER5 processor-based systems and up to 254 LPARs using
    the HMC Machine Code Version 6.1. For updates of the Machine Code and HMC functions
    and hardware pre-requisites, refer to the following Web site:


    ```

    http://www14.software.ibm.com/webapp/set2/sas/f/hmc/home.html

    ```


    # 3.2.2 Using the IVM for System p virtualization


    When using the IVM to manage System p virtualization, consider the following guidelines:


    +   The first operating system to be installed must be the VIOS. Virtual I/O Server
    Version 1.2 or higher has to be installed on the predefined partition.


    +   The VIOS is configured automatically to own all of the I/O resources. It can
    be configured to provide service to other LPARs through its virtualization capabilities.
    With this, you cannot allocate dedicated physical Ethernet adapter on the Firewall
    partition as shown in Table 3-2 on page 55.


    +   The IVM does not provide a Web-based terminal session to partitions. to connect
    to an LPAR console, the administrator has to log in to the VIOS and use the command
    line interface.


    +   It is important to note that moving between an HMC and an IVM environment
    requires a certain amount of reconfiguration that is dependent on the configuration
    of the server at the time of the migration.'
  merge: -1
