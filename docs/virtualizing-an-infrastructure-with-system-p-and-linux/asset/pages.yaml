    [root@mngmt npc]# /dirinstall

    ```


    The installer performs the basic verifications and deploys the RPM packages on
    the system. When the installation has finished, for both server and agent you
    can use the following commands:


    +   To start IBM Systems Director services, run the command shown in Example 5-5.


    Example 5-5 Start IBM Systems Director services


    ```

    [root@mngmt FILES]# /opt/ibm/director/bin/twgstart

    Service started.

    ```


    You can use the same command for the server and the agent, because the server
    installation comes by default with the agent (and the console). Therefore, at
    the server side, running the /opt/ibm/director/bin/twgstart command starts the
    server components processes, which also include the discovered environment functionality.
    The IBM Systems Director Server system can also be discovered and managed as a
    Level-2 agent system.


    +   To stop IBM Systems Director services, run the command shown in Example 5-6.


    Example 5-6 Stop IBM Systems Director services


    ```

    [root@mngmt FILES]# /opt/ibm/director/bin/twgstop

    Requesting service to end.

    Waiting for service to end.

    Service ended.

    ```


    +   To view status of IBM Systems Director services, run the command shown in
    Example 5-7.


