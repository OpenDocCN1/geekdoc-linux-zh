    # ## 4.1.2 Security considerations


    Our example scenario fulfills the need by providing an LPAR that has integrated
    firewall security. In this chapter, we describe how to implement a firewall on
    one of our LPARs that we call fort, how to implement a firewall management system
    over the overseer LPAR that comprises a firewall component for determining requests
    server-access requests are authorized, and how to implement a data management
    component for accepting an authorized request from the firewall and providing
    the requested access to the server.


    Server-access requests are sent by a network node, such as a network client. The
    server-access requests are contained in data packets having headers. The LPAR
    accepts the data packets and determines whether the data packets are authorized
    based on information that is included in the data packets.


    Thus, our infrastructure bastion firewall, such as, is the only layer of security
    for network devices that are attached to 9.3.5.0 (LAN). Therefore, when fort is
    penetrated, whether by an authorized or unauthorized user, the user typically
    gains unrestricted access to all resources of the LAN. However, in this chapter,'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'we discuss an easy way to local or integrated firewalls in each of our LPARs
    using the setup -> firewall option. An integrated firewall into each server provides
    an additional layer of security beyond that provided by fort.


    Depending of your organization security rules, the level of security that is provided
    by a bastion firewall as fort might not always supply adequate protection for
    the infrastructure. For example, you might want to establish varying levels of
    security clearance, that only authorized users of the LAN are permitted to access
    a particular server. Also, if a server provides access to valuable or sensitive
    data, you might want to implement extra security measures to prevent unauthorized
    use of the LAN. You can find additional information about firewall rules, including
