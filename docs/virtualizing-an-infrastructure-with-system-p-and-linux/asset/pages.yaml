    Micro-partitioning technology further refines this to allow the creation of partitions
    with less than a full processor for applications that require fewer resources,
    for example, a firewall or a DNS server partition as shown in Figure 1-3. Partitions
    can be defined as small as 1/10th of a processor and in increments as small as
    1/100th of a processor. These partitions can reside and run within a shared processor
    pool where the allocation of processors to the workload can dynamically change
    based on user defined parameters. Rules can be defined that set priorities and
    maximum amount of processing power for partitions. The system can then allocate
    resources dynamically to meet the needs of users.'
