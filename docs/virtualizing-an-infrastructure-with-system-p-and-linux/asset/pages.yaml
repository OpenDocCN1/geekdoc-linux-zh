    # 5.3 Virtual I/O Server


    This section provides an overview of the Virtual I/O Server in the context of
    managing virtual resources.


    The Virtual I/O Server provides virtual storage and shared Ethernet capability
    to client logical partitions. It allows physical adapters with attached disks
    or optical devices on the Virtual I/O Server logical partition to be shared by
    one or more client partitions. Virtual I/O Server partitions are not intended
    to run applications or for general user sessions. The Virtual I/O Server is installed
    in its own logical partition.'
