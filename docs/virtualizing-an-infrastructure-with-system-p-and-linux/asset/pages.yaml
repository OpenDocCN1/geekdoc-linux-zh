    Figure **5-41** The Firewall Builder install options


    Here the name used to log in to the firewall is prepopulated using information
    taken from the Install tab of the firewall object box. If you used password authentication,
    enter the password in the "Password or passphrase" entry field. If you use passphrase
    protected private key, enter the passphrase in the same field.


    Here is the description of the options available in the installer:


    +   - **Quiet install**

    Suppresses the output during install.


    +   - **Verbose**

    nThe opposite of a quiet install. Installer runs an external ssh client with **-v**
