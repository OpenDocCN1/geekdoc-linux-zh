  md: "# 3.5.2 Mirroring VIOS rootvg\n\nWhen the installation of the VIOS rootvg is\
    \ complete, the following commands can be used to mirror the VIOS rootvg volume\
    \ group to a second physical volume. This protects the single VIOS partition setup\
    \ on a disk failure. For other VIOS high availability sample configurations deployment,\
    \ refer to Advanced POWER Virtualization on IBM System p Virtual I/O Server Deployment\
    \ Examples, REDP4224, which is available online at:\n\n```\nhttp://www.redbooks.ibm.com/abstracts/redp4224.html#7open\n\
    ```\n\nThe steps show how to mirror the VIOS rootvg:\n\n+   1. Use the extendvg\
    \ command to include hdisk1 as part of the rootvg volume group. The LVM concept\
    \ applies—you cannot use an hdisk that belongs to another volume group, and the\
    \ disk needs to be of equal size or greater.\n2. Use the lspv command, as shown\
    \ in 3-8, to confirm that rootvg has been extended to include hdisk1.\n\n> Example\
    \ 3-8 lspv command output\n\n| lspv | PVID | VG |\n|---|---|---|n| STATUS hdisk0\
    \ active | 00c18ea19cacb2a | rootvg |\n hdisk1 active | 00c18ea1f04575 | rootvg\
    \ |\nhdisk2 | 00c18ea8ae5fd5d | NONE |\nhdisk3 | 00c18ea8ae665c7 | NONE |\n\n\
    +   3. Use the mirrors command to mirror the rootvg to hdisk1, as shown in Example\
    \ 3-9. With the -f flag, the mirrors command reboots the VIOS partition automatically.\n\
    \n> Example 3-9 Mirroring VIOS rootvg\n\n```\n$ extendvg rootvg hdisk1\nChanging\
