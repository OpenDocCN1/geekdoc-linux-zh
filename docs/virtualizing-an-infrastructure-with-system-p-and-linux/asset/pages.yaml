- img_proc: true
  md: '4. To activate the integrated HMC support menu on IBM Systems Director Console,
    you have to grant access to the HMC. Right-click the HMC and then select Request
    Access. In the dialog box, enter the HMC user ID (usually hscroot), and the password
    for this ID.


    5. Next, the newly integrated HMC-related menus on the IBM Systems Director Console,
    see Figure 5-4. The HMC Manager Tools that are integrated with IBM Systems Director
    Consoles are:


    +   * Frame Management

    * Server Management


    +   * Licensed Internal Code Maintenance

    * HMC Code Update

    * Licensed Internal Code Updates


    +   * HMC Management

    * HMC Users

    * HMC Configuration


    Information Center and Setup Wizard


    Service Focal Point


    Delete HMC Console credential


    When you run one of these tools, an HMC Web-based System Manager window is launched,
    and you can go to the selected tool panel. You can also manage Central Electronics
    Complex (CEC) and HMC-managed LPARs. We discuss the detailed CEC support functionality
    in “Managing CECs and LPARs” on page 168.


    6. You can see all the HMC-managed LPARs that are discovered by IBM Systems Director
    Server regardless of the IBM Systems Director Agent level. Click the HMC and HMC
    Members in the left panel, and observe the HMC and HMC-managed LPARs, as shown
    in Figure 5-4.


    When IBM Systems Director Server fails to discover the HMC managed objects, the
    following message displays:


    ```

    Error occurred while attempting to add the HMC

    Usable to establish a connection with the system.

    ```'
