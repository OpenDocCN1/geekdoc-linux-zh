    \n+   - IBM Systems Director Management Guide Version 5.20\n  http://publib.boulder.ibm.com/infocenter/eserver/v12/topic/dirincf_5.20/frq0_bk_system_mgmt.pdf\n\
    \n+   - Implementing IBM Director 5.20, SG246188\n  http://www.redbooks.ibm.com/abstracts/sg246188.html?open\n\
