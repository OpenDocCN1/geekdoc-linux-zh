    # SNMP devices


    IBM Systems Director discovers SNMP devices in your network according to discovery
    parameters that you can use. The process that is used to discover SNMP devices
    in your network uses lists of initial IP addresses, SNMPv1 and SNMPv2 community
    names, subnet masks, and SNMPv3 profiles.


    IBM Systems Director works with SNMPv1, SNMPv2c, and SNMPv3 for all communications
    and recognizes Management Information Bases (MIBs) in System Management Information
    (SMI) version 1 and 2 formats.


    SNMPv1 and SNMPv2 devices use community names to control their access. A community
    name can be any case-sensitive text string. By default, the community name of
    an SNMP device is set to public. If specific SNMP devices in your network have
    unique community names to restrict access,


    Chapter 5. Managing a virtualized server environment 179'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'you can specify the correct name to gain access to a device. SNMPv3 devices
    and use profiles to control their access.


    The subnet mask enables you to further refine the scope of the discovery process,
    limiting the search to certain subnets in the network. The default subnet mask
    is set to the subnet of each corresponding IP address.


    Using your lists of IP addresses, community names, and subnet masks, a series
    of SNMP GET statements are performed across port 161 of the IP address to determine
    whether the address is associated with a valid SNMP device. A valid SNMP device
    for IBM Systems Director has the following accessible values:


    +   * sysName

    * sysObjectID

    * sysLocation

    * sysContact

    * sysDesc

    * sysUpTime


    If the object is determined to be a valid SNMP device, another series of SNMP
    GET statements are sent to obtain information in the ipToMediaNetAddress table,
    where additional IP addresses can be used to discover even more SNMP devices.
    The search continues until no new addresses are located. Newly discovered or created
    SNMP-managed objects default to the value of sysName. If sysName has no value,
    the host name of the device is used. If no host name is assigned, the IP address
    is used.


    All SNMP traps that are configured with IBM Systems Director Server as the destination
    are forwarded as events to the log event. Therefore, you can view an SNMP trap
    using the event log on the managed device that originated the trap. If a trap
    is received that corresponds to a SNMP device that has not been discovered, IBM
    Systems Director creates the device automatically, if you selected the Auto-add
    unknown agents which contact server check box on the SNMP discovery in the Discovery
    Preferences.


    The MIB file is used to translate SNMP decimal notation into human-readable text.
    This is especially useful for SNMP devices of Level-0 managed devices, which do
    not have IBM Systems Director Core Services or IBM Systems Director Agent installed
    (such as network hubs, switches, routers, and USPs). MIBs that are placed in the
    data\sn directory on the management server are compiled automatically. You can
    also compile MIBs manually from the SNMP Browser window.


