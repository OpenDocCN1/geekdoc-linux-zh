  md: 'Upon logging in to the VIOS, you are placed into a restricted Korn shell. The
    restricted Korn shell works the same way as a regular Korn shell with the following
    restrictions:


    +   - Cannot change the current working directory.


    +   - Cannot set the value of the SHELL, ENV, or PATH variable.


    +   - Cannot specify the path name of the command that contains a >, |, <, >,
    or *.


    As a result of these restrictions, you are not able to run commands that are not
    accessible to your PATH variable. These restrictions prevent you from sending
    output of the command directly to a file, requiring that you pipe the output to
    the **tee** command.


    After you are logged on, you can enter the **help** command to get an overview
    of the supported commands, as shown in Example 3-2.


