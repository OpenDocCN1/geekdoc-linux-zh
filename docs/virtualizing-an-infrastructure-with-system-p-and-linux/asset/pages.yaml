    updates, the serv_config command for modifying various serviceability policies,
    the usydent and usysattn utilities for manipulating system LEDs, the bootlist
    command for updating the list of devices from which the system will boot, and
    the snap command for capturing extended error data to aid analysis of intermittent
    errors.


    +   The 1svyd package contains the 1svyd, 1scfg, and 1smcode commands. These commands,
    along with a boot-time scanning script update-1svyd-vdb, constitute a hardware
