- img_proc: true
  md: '+   Store copy of fwb file on the firewall


    Makes the installer copy the data file (.fwb) to the firewall along with generated
    firewall script. Some users use this as a simple form of backup.


    The installer can install the policy in a test mode if the "Test run" option is
    in. In this case, the policy script does not overwrite the old copy is in /etc/firewall
    but is saved in a temporary place and executed from there. This is intended for
    testing changes in the policy or for temporary changes. After reboot, the firewall
    comes up with last known good policy.


    Use the "Schedule reboot" option to schedule a reboot in a few minutes if you
    want to. This, in combination with test mode installation, helps avoid issues
    when an error in the policy blocks communication between management station and
    the firewall. If this happens, a scheduled reboot will reboot the firewall in
    a few minutes. The installer comes up with the policy as it was before the change,
    so that you can recover from the error.


    If installation was successful, you can cancel scheduled reboot either by logging
    in to the firewall and executing the shutdown -c command or by installing a policy
    again with test mode turned off. Click OK in this dialog box to start the installer.'
  merge: -1
