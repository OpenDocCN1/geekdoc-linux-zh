    Renaming of the library User is optional. However, it helps when the library name
    is meaningful and in some way relates to the objects that it contains. You might
    want to create more libraries in the future, depending on the complexity of your
    network. Libraries provide a simple way to group objects logically, reflecting
    some real-world structure that unites them. For example, if the network consists
    of several data centers, it makes sense to place objects describing each one in
    a separate library.


