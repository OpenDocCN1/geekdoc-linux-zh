  md: '# 2.1 Planning for virtual environment


    This chapter describes the different aspects of planning that you must consider
    before you deploy a virtual environment. Planning your virtual environment is
    the first step to take when creating a virtual environment. Sufficient planning
    helps ensure that the virtual environment is configured in a way that meets your
    computing needs and that you are using your hardware resources effectively.


    Various tools exist to help you when planning your virtual environment:


    +   - The IBM Systems Workload Estimator estimates the computing resources that
    are required to support various workloads.

    - The IBM System Planning Tool (SPT) assists in designing LPAR systems.

    - You can use output from the SPT to deploy the LPAR configuration on the Hardware
    Management Console (HMC) or Integrated Virtualization Management (IVM).


    # 2.2 Understanding infrastructure services workload


    There are various server workloads in the client IT environment that place different
    requirements on the underlying IT infrastructure. To satisfy these workloads,
    some infrastructures might require high network bandwidth, a high degree of backup,
    or large disk I/O rates. Most workloads have a combination of these various characteristics.


    Planning for your workload helps set the hardware and software resources that
    you will need when you create and use a virtual environment. Workload planning
    includes the capacity, performance, and availability requirements for your server
    and its logical partitions. For example, the workload requirements for your server
    or logical partitions can vary based on the type or importance of the work that
    it is performing. Several workload planning tools are available to assist you
    in planning for workloads.


    To optimize system performance in a virtualized environment, it is important to
    understand the intended use of the system and the performance constraints that
    might be encountered. When you have identified the critical subsystems, you can
    focus your attention on these components when resolving performance issues, such
    as whether to use virtual or native I/O in a partition.


    This section describes the common infrastructure services workload that are most
    likely deployed in your environment using open source tools that are'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'available on Linux OS. When defining the subsystem workload for server types,
    we list them in order of impact.


    # ##2.2.1 Domain Name System


    Domain Name System (DNS) is a protocol for naming computers and network services
    through user-friendly names. It is used to locate computers and services. When
    a client uses a DNS name, DNS services can resolve the name to other information
    that is associated with it, such as an IP address. The number of requests that
    the DNS server is required to respond to is determined by the size of the environment
    that it is supporting and the number of DNS servers that are located within that
    environment. You should consider these factors when sizing the server type.


    Important subsystems include:


    +   - Network


    +   - Memory


    Overall, the network subsystem, particularly the network interface card or the
    bandwidth of the LAN itself, can create a bottleneck due to heavy workload or
    latency. Performance measurements of the virtual Ethernet within LPARs within
    a System p has greater throughput than the physical interfaces to the outside
    network. If a latency problem exists when accessing a DNS, it is recommended that
    you check the network route between the client and DNS server and you start your
    investigations with firewalls through which the DNS traffic is passing.


    Insufficient memory might limit the ability to cache files and thus cause more
    disk and CPU activity, which results in performance degradation. For a system
    that is running a large or very large DNS system, insufficient system resources
    would be the primary item to monitor.


    Due to the nature of DNS serving, the processor subsystem is the least utilized
    in the system and has the least need for monitoring.


    # ##2.2.2 Dynamic Host Configuration Protocol


    Dynamic Host Configuration Protocol (DHCP) is a protocol for using a server to
    manage and administer IP addresses and other related configuration items in the
    network. When a device starts, it can issue a request to obtain an IP address.
    The DHCP server responds and provides that device with a valid IP address that
    is valid for a predefined period of time. This protocol removes the requirement
    to assign individual IP addresses for each device.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'The number of requests that the DHCP server is required to respond to and the
    size of IP address scope is critical in determining the server size. Having multiple
    DHCP and splitting the scope might reduce overheads on individual servers.


    Important subsystems include:


    +   - Network

    - Disk

    - Memory


    The network subsystem, particularly the network interface card or the bandwidth
    of the LAN itself, can create a bottleneck due to heavy workload or latency. High
    I/O requests require an appropriately designed disk subsystem. Insufficient memory
    might limit the ability to cache files and thus cause more disk and CPU activity,
    which results in performance degradation.


    Due to the nature of DHCP serving, the processor subsystem is the least utilized
    in the system.


    # 2.2.3 Web server


    Web server is responsible for hosting Web pages and running server-intensive Web
    applications. If Web site content is static, the subsystems that might be sources
    of bottlenecks are:


    +   - Network

    - Memory

    - CPU


    If the Web server is computation-intensive (such as with dynamically created pages),
    the subsystems that might be sources of bottlenecks are:


    +   - Memory

    - Network

    - CPU

    - Disk


    The performance of Web servers depends on the site content. There are sites that
    use dynamic content that connects to databases for transactions and queries and
    this requires additional CPU cycles. It is important in that the server there
    is adequate RAM for caching and to manage the processing of dynamic pages for
    a Web server. Also, additional RAM is required for the Web server service. The
    operating system adjusts the size of cache automatically, depending on requirements.


    Because of high ratio and transferring large dynamic data, the network subsystem
    can be a source of high subsystem utilization.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# 2.2.4 Database server


    The database server''s primary function is to store, search, retrieve, and update
    data from disk. Examples of open source database engines include MySQL and Postgresql
    Due to the high number of random I/O requests that database servers are required
    to do and the computation intensive activities that occur, the potential areas
    that have the most impact on performance are:


    +   - Memory


    Buffer caches are one of the most important components in the server and both
    memory quantity and memory configuration is a critical factor. If the server does
    not have sufficient memory, paging occurs, which results in excessive I/O, which
    in turn generates latencies. Memory is required for both the operating system
    and the database engine.


    +   - Disk


    Even with sufficient memory, most database servers will perform large amounts
    of I/O to bring data records into memory and flush modified data to disk. The
    disk substorage system needs to be well designed to ensure that it is not a potential
    bottleneck.


    Therefore, it is important to configure a sufficient number of disk drives and
    keep the data files on different disks to other SCSI clients. If the database
    requires high IO and throughput, it is recommended to put the data files in the
    direct IO (not virtualize). This can be done by installing additional physical
    adapters that can access the IO device and assigning it to the LPAR that is running
    the database.


    +   - Processor


    Processing power is another important factor for database servers because database
    queries and update operations require intensive CPU time. The database replication
    process also requires considerable amounts of CPU cycles.


    Database servers are multi-threaded applications. SMP-capable systems provide
    improved performance scaling to 16-way and L2 cache size is also important due
    to the high hit ratio-proportion of memory requests that fill from the much faster
    cache instead of memory.


    +   - Network


    The networking subsystem needs to be the least important component on an application
    or database server, because the amount of data returned to the client is a small
    subset of the total database. The network can be important, however, if the application
    and the database are on separate servers.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 2.2.5 File server


    The role of the file server is to store, retrieve, and update data that is dependent
    on client requests. Therefore, the critical areas that impact performance are
    the speed of the data transfer and the networking subsystems. The amount of memory
    that is available to resources such as network buffers and disk I/O caching also
    influence performance greatly. Processor speed or quantity typically has little
    impact on file server performance.


    In larger environments, you should also consider where the file servers are located
    within the networking environment. It is advisable to locate them on a high-speed
    backbone close to the core switches as possible.


    The subsystems that have the most impact on file server performance are:


    +   - Network

    - Memory

    - Disk


    The network subsystem, particularly the network interface card or the bandwidth
    of the LAN itself, might create a bottleneck due to heavy workload or latency.
    Network capacity can be extended using Ethernet adapter bonding.


    Insufficient memory can limit the ability to cache files and thus cause more disk
    activity, which results in performance degradation.


    When a client requests a file, the server must initially locate, read and forward
    the requested data back to the client. The reverse of this applies when the client
    is updating a file. Therefore, the disk subsystem is potentially a bottleneck
    on systems where you have a large number of clients accessing the file server.


    # 2.2.6 Print server


    Print servers remove the requirement to install printers on individual clients
    and are capable of supporting a large number of printer types and print queues.
    They manage client print requests by spooling the print job to disk.


    The printer device itself can influence performance, because having to support
    slower printers with limited memory capacity takes longer to produce output while
    using resources on the Print Server. Therefore, the critical areas that impact
    performance are the speed of the data transfer and memory configuration.


    By default, the spool directory is located on the same disk as it is better to
    redirect the directory to another physical drive than'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'the operating system disk to improve printing performance. Implementing printer
    pools and virtual printer configurations might help to reduce printing workload.


    The subsystems that have the most impact on print server performance are:


    +   - Memory

    - Disk

    - Processor


    # 2.2.7 The e-mail server


    An e-mail server acts as a repository and router of electronic mail, and it handles
    the transfer of e-mail to its destination. Because e-mail servers need to communicate
    regularly to do directory replication, mail synchronization, and interface to
    third-party servers, they generate network traffic. Because they also have to
    store and manage mail, the disk subsystem is becoming increasingly more important.


    The important subsystems for e-mail servers are:


    +   - Memory

    - CPU

    - Disk

    - Network


    An e-mail server uses memory to support database buffers and e-mail server services.
    Ensuring that memory is sized appropriately and that the disk subsystems are effective
    is very important because these impact server performance. For example, if memory
    size is sufficient, the server is capable of caching more data, which results
    in improved performance.


    An e-mail server uses logs to transfer modified data to an information store.
    These logs are written sequentially, which means that new transactions are appended
    to the end of the transaction files. Logs and database files use different usage
    patterns, with logs performing better with physical disks and databases performing
    better with striped disk arrays due to random workload. Using several drives instead
    of a single drive can significantly increase e-mail throughput. Read-ahead disk-caching
    disk subsystems can also offer performance benefits.


    Users'' mailboxes can be stored on the server, on each user''s local hard drive,
    and on both. In each case, you need high network performance because clients still
    retrieve their mail over the network. The larger the size of the e-mails, the
    more bandwidth that is required. Also, server-to-server traffic can be a significant
    load in the network and using multiple LAN adapters can help to improve its network
    performance.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'When an e-mail server receives a message, it determines the appropriate server
    to handle the e-mail. If the address is local, it is stored in the database of
    the e-mail server. If the address is not local, the e-mail is forwarded to the
    most appropriate server for processing. If the address is a distribution list,
    the server checks the addresses in the list and routes the message accordingly.
    These processes require CPU cycles, and sufficient memory must be allocated to
    ensure that these processes occur efficiently.


    If your server supports directory replication and connectors between sites, your
    server will experience high distribution list usage, and the CPU will be a more
    important factor in e-mail server performance.


    Adequate network bandwidth between e-mail servers and their clients is essential.
    However, contrary to popular belief, this is not the most impacted subsystem.
    If IPSec is used to encrypt network traffic, using a specialized network card
    to off the encryption process will reduce CPU utilization.


    # 2.3 Understanding Virtual I/O Server workload


    To activate the Virtual I/O Server (VIOS), the Advanced POWER Virtualization feature,
    and a logical partition with enough resources to share with other is required
    on your System p.


    Due to the characteristics of the virtualization features of System p servers,
    the operating system and application do not realize that they are running in a
    micro-partition or a virtualized I/O environment. This allows applications to
    run unmodified in partitions that take advantage of both features. Additionally,
    VIOS partitions handle the translation of the virtual I/O operation to the physical
    adapter, you need to make sure that this partition is sized properly to handle
    I/O requirements in all partitions.


    The IBM Systems Hardware Information Center provides a starting point for detailed
    planning calculations to help with CPU and memory planning:


    ```

    http://publib.boulder.ibm.com/infocenter/eserver/v1rs3/topic/iphbl/iphbl_vios_planning.htm

    ```


    System workload such as network and disk activity has sporadic because there are
    bursts of network traffic and disk activity when actions are performed. For example,
    when a client accesses a Web site and submits changes, some network usage is generated
    with a burst of disk activity to update a backend database. For this reason, making
    full use of micro-partitioning and uncapped CPU features in the VIOS makes the
    most sense. A guideline is to use 1 GB of memory as a starting point for the VIOS,
    and scale down or from'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'there. The CPU can take a bit more thought, but the only way to guarantee accuracy
    is to run the system under real workloads and then monitor performance for tuning.


    If you plan dual VIOS, a bit of planning can make sure that you can size smaller
    Virtual I/O Servers that support all of the virtual I/O clients each. Additional
    capacity to allow for virtual I/O resilience can be provided through the uncapping
    facility of the servers. With redundant VIOS environment, partitions can access
    a physical adapter in two different VIOS partitions, through the definition of
    multiple virtual adapters. This environment for clients can take advantage of
    high availability features such as multi-path I/O software or link aggregation
    technologies such as Etherchannel, and the whole partition can continue to operate
    even in the case of a fault of the VIOS level or even in the external network
    or storage devices connected to the server.


    The strategic planning of using Virtual I/O Servers also allows you to do maintenance
    on one Virtual I/O Server while the other continues to provide production services.


