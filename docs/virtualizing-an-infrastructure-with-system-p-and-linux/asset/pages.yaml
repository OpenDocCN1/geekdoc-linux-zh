  pgno: 53
- img_proc: true
  md: 'This section discusses each of these items, presents steps for determining
    current resource allocation on your System p platform, and discusses considerations
    for allocating resources for the Logical Partition that will contain the resources
    for the Linux instances.


    # 2.7.1 Processor


    This section discusses the requirements for allocating processor resources for
    the logical partition for Linux.


    # Whole or partial processor allocation


    The System p platform supports the allocation of processor resources to a logical
    partition as either whole or dedicated processors or partial or shared processor
    units. A *dedicated* processor is a processor that is allocated in totality to
    a single logical partition and used exclusively by that partition. *Partial* processor
    allows for the sharing of a processor across a number of logical partitions (up
    to 10 on a single processor). Additionally, the use of shared processor units
    allows for the automatic movement of processor units between partitions as determined
    by the POWER Hypervisor.


    The allocation of dedicated processors is the most efficient use of a processor
    on the System p platform because there is no processor migration or task switching
    events that need to be managed by the POWER Hypervisor. Alternatively, the use
    of shared processors allows for a full exploitation of the overall resources of
    the system because many workloads can be implemented on the System p require less
    than a full processor allocation.


    In a shared logical partition, there is no fixed relationship between virtual
    processors and physical processors. The POWER Hypervisor can use any physical
    processor in the shared processor pool when it schedules the virtual processor.
    By default, it attempts to use the same physical processor, but this cannot be
    guaranteed. The POWER Hypervisor uses the concept of a *home node* for virtual
    processors, enabling it to select the best available physical processor from a
    memory affinity respect for the virtual processor that is to be scheduled.


    Affinity scheduling is designed to preserve the content of memory caches that
    the working data set of a job can be read or written in the shortest time period
    possible. Affinity is actively managed by the POWER Hypervisor because each partition
    has a completely different context. Currently, there is one shared processor pool,
    so all virtual processors are implicitly associated with the same pool.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'It is recommended that infrastructure servers installed into LPARs that are
    configured with shared processors instead of dedicated processors. The reason
    is simple—you want to lower the total cost of the solution by increasing the utilization
    of the server. Shared processors will move from one server to another automatically
    as the workload moves from one server to another. Running this configuration on
    multiple servers causes CPU resources to be wasted because they are unable to
    transfer idle resources to another server that could use the resources. If you
    run the workload in multiple LPARs that are configured with shared processors,
    then the idle CPU resources of one LPAR are moved automatically to handle the
    increased workload of another LPAR. Results in higher overall server utilization
    and can result in higher throughput by the infrastructure.


    # Number of virtual processors


    After you have determined the amount of processor resource, you need to determine
    the number of virtual processors across to spread the workload. A virtual processor
    can be thought of as a manifestation of a processor and is represented by the
    operating system as a processor thread. The number of virtual processors to allocate
    to a logical partition can be affected by a number of factors, including:


    +   - Type of workload

    - Amount of processor allocation

    - Number of physical processors in the system


    There are certain workloads, such as database, that can benefit from a large number
    of processor threads; however, most workloads that are implemented on the System
    p do not require a large number of processor threads. Each processor thread that
    is allocated to a logical partition requires at least 0.1 of a processor unit
    allocated to the partition. Additionally, no more than a full processor (that
    is, 1.00 processor units) can be allocated to a single processor thread. Put another
    way, if 4.20 processor units are allocated to a partition, then the minimum number
    of virtual processors that can be allocated is 5, while the maximum number of
    virtual processors that can be allocated is 42.


    As a general rule for Linux partitions, the number of virtual processors allocated
    will be the least amount required by the allocation of processor units to the
    platform.


    On the System p platform, for each virtual processor allocated to the logical
    partition, the Linux operating system will actually see two processors. This is
    due to the SMT support on the System p platform and ensures that the Linux operating
    system will benefit from multi-threading even across a single virtual'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'It is recommended that every LPAR that is using resources from the shared processor
    pool you configure the virtual processor count to be equal to the number of physical
    processors in the shared processor pool. This is a good place to start because
    it allows all partitions to be able to utilize the CPUs in the shared processor
    pool. Configuring the virtual processor count to be the entire processor pool
    reduces the risk of an LPAR using these resources and being unable to use idle
    resources.


    Later, if you find an LPAR that should not have access to the shared processor
    pool, you can change the LPAR profile to have a smaller number of virtual processors.
    The other reason for choosing a smaller number of virtual processors is for software
    that is licensed by processor (core).


    # Capped and uncapped setting


    The System platform micro-partitions provide every specific processing modes that
    determine the maximum processing capacity given from the shared processor pool.
    The processing modes are:


    +   - Capped mode


    In capped mode, the processing units given to the partition at a time never exceed
    the guaranteed processing capacity (the entitlement capacity is guaranteed by
    the system and it is not exceeded when resources are available in the shared processing
    pool).


    +   - Uncapped mode


    Uncapped partitions provide the ability to balance the allocation of processor
    resources across the system based upon the active workloads. In uncapped mode,
    the processing capacity given at a time can exceed the guaranteed processing capacity
    when resources are available in the shared processing pool. You must specify the
    uncapped weight of that partition.


    If multiple uncapped logical partitions require idle processing units to the logical
    partitions in proportion to each logical partition''s uncapped weight, the managed
    system distributes idle processing units. The higher the uncapped weight of a
    logical partition, the more processing units the logical partition gets.


    The uncapped weight must be a whole number from 0 to 255. The default uncapped
    weight for logical partitions is 128. A partition''s size is computed by dividing
    its variable capacity by the sum of the variable capacity weights for all uncapped
    partitions. If you set the uncapped weight at 0, the managed system treats the
    logical partition as a capped logical partition. A logical partition with an uncapped
    weight of 0 cannot use more processing units than those that are committed to
    the logical partition.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'From a software licensing perspective, different vendors have different structures
    on which they license their applications running in an uncapped partition. Because
    an application has the potential of using more processor resource than the partition''s
    entitled capacity, many software vendors charge on a processor basis require additional
    processor licenses to be purchased based on the possibility that the application
    might consume more processor resource than it is entitled. When deciding to implement
    an uncapped partition, with your software vendor regarding their licensing terms.


    It is recommended that you start with your LPARs in uncapped mode to allow the
    System p to distribute its resources to every LPAR that is executing the workload.
    As you monitor the LPARs and feel like not receiving enough CPU resources compared
    to others, you can go back and increase the weight of the uncapped resources.
    Alternatively, if you want to lower the priority for a particular LPAR, you can
    lower the weight. This allows it to get all of the CPU resources that it desires
    but only if other LPARs are not using them. If other LPARs are running with few
    idle resources, then this weighted LPAR runs with less CPU resources until the
    other LPARs CPUs idle.


    # 2.7. Memory


    Memory is allocated to the logical partitions on the System p platform from the
    overall memory that is installed in the system. The amount of memory to allocate
    to a Linux partition is directly dependent on the workload that will be implemented
    in the Linux partition as well as the type of I/O (virtual or direct) that will
    be allocated to the Linux partition.


    For each partition on the managed system, the Hypervisor sets aside memory resources
    to manage the memory addressing for the partition. This is referred to as the
    Hardware Page Table (HPT). The size of the HPT is based on the maximum memory
    definition for the partition and provides a set of offsets from the partitions
    memory address to the physical memory of the system. When selecting maximum memory
    value for the LPAR, such as 128 GB, you pin a lot of memory. The Hypervisor firmware
    reserves 1/64 of the value entered as the maximum value in the Hypervisor firmware
    memory. For example, if you select 128 GB, you reserve 2 GB memory in the Hypervisor
    for a value that you might never need.


    You can obtain the estimate size of Hypervisor memory in the SPT as shown in Figure
    2-2. The estimate is calculated based on system configuration and assumes that
    all I/O connections in the system are to be used.'
  merge: -1
