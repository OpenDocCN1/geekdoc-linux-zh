    are available. The following list includes both core features and extensions:


    +   Base Director tasks


    Available on System p5 server: Discovery, Associations, Group Management, System
    Status, Inventory, Event Log Viewer, Event Action Plan, Resource Monitor, Process
    Management, Remote Control, Remote Session, File Transfer, CIM Browser, Scheduler,
    Update Assistant,'
