    3. Assign a name for the new firewall object and choose firewall platform iptables
    and OS Linux 2.4/2.6 in the drop-down boxes, because you are going to create firewall
    object describing the iptables firewall on Linux.

    If is your first firewall and your firewall setup is rather simple, its probably
    easier to set it up using one of the preconfigured templates. A firewall object
    created from a template will be completely configured, including typical set of
    interfaces with IP addresses and basic set of policy and NAT rules. You can then
    edit the object and change anything in it to match your actual configuration.
    The program comes with several templates to choose.


    4. To use the template, select Use preconfigured firewall objects.

    However, if none of the templates are close to your setup, you have an option
    of building a firewall manually. Do not check this option and click Next. You
    are then taken to the panel where you add interfaces manually. In this book, we
    use one of the templates.'
