  md: '# 3.3 Working with a system plan


    A system plan is a specification of the hardware and the logical partitions that
    are contained in one or more systems. Each system plan is contained within a system
    plan file. This section explains how to validate the system plan, how to import
    the system plan (using both the HMC and the IVM), and how to deploy a system plan
    (using both the HMC and the IVM).


    # 3.3.1 Validating the system plan


    When validating the hardware on the managed system, the HMC compares the following
    information from the system plan with the hardware that is available on the managed
    system:


    +   - Amount of processor and memory

    - Physical I/O adapter placement


    The hardware that is described in the system plan passes validation if it matches
    the hardware that is specified by the managed system. The hardware on the managed
    system can contain resources in addition to those specified in the system plan
    and still pass validation. However, the hardware on the managed system must at
    least match the hardware that is specified in the system plan.


    For example, a system plan specifies a server with two processors, 8 GB of memory,
    and a specific placement of physical I/O adapters within the system unit. A server
    that contains two processors, 16 GB of memory, a matching placement of physical
    I/O adapters within the system unit, and an expansion unit with additional physical
    I/O adapters allows the system to pass validation. A server that contains 4 GB
    of memory fails the validation if the system plan specifies one type of physical
    I/O adapter in a slot, but the actual system unit has a different type of physical
    I/O adapter in slot. (However, if the system plan specifies an empty slot, validation
    allows any type of physical I/O adapter to be in slot on the actual system.)


    The HMC does not validate the disk drives that are attached to physical I/O adapters
    against the disk drives that are specified in the system plan. You must ensure
    that the disk drives that are installed in the managed system support the desired
    logical partition configuration. Embedded devices pass hardware validation automatically
    because they are embedded into the system and cannot be removed.


    When validating an existing logical partition, the HMC validates the following
    for that logical partition. Validation fails for the existing logical partition
    if any step. Any partition found on the managed system must appear in the'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'system plan and must match the system plan as it appears in the managed system.


    +   - Is a logical partition in the system plan that has the same partition ID
    as the existing logical partition specified in the machine default configuration?


    +   - Does the logical partition have partition profiles that match each partition
    profile specified for the logical partition in the system plan?


    +   - Do the partition profiles for the existing logical partitions contain the
    resources specified in the corresponding partition profiles in the system plan?


    For example, if the server has an existing logical partition with a partition
    ID of I, the HMC looks for the logical partition in the system plan that has a
    partition ID of I. If this logical partition exists and has a partition profile
    that is PROFILE01, the HMC looks at the existing logical partition to see if it
    also has a partition profile that is named PROFILE01. If so, the HMC verifies
    that the resources specified in the PROFILE01 partition profile in the system
    plan are contained in the PROFILE01 partition profile in the existing logical
    partition.


    When the HMC validates partition profiles, it compares the following resources
    in the partition profiles:


    +   - Amount of processor and memory

    - Physical I/O slot assignments


    For example, if the PROFILE01 partition profile in the system plan specifies 2
    GB of memory and the PROFILE01 partition profile for the existing logical partition
    specifies 3 GB of memory, the amount of memory is valid. If the PROFILE01 partition
    profile for the existing logical partition in the system plan specifies 4 GB of
    memory and the amount of memory is invalid. If I/O slot P1 is assigned to the
    PROFILE01 partition profile in the system plan but not to the PROFILE01 partition
    profile for the existing logical partition, the physical slot assignment is invalid.
    If I/O slot P2 is not assigned to the PROFILE01 partition profile in the system
    plan, it does not matter whether slot P2 is assigned to the PROFILE01 partition
    profile for the existing logical partition.


    The HMC does not install the operating systems on the logical partitions. Thus,
    the HMC is also unable to configure virtual I/O adapters within the operating
    systems so that logical partitions can provide virtual storage resources to other
    partitions.


    # 3.3.2 Importing a system plan


    This section describes how to import a system plan into an HMC and an IVM managed
    system.'
  merge: -1
