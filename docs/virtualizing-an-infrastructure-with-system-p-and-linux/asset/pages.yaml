  md: '# How to compile and install firewall policy


    To use firewall policy created in Firewall Builder, it needs to be compiled and
    the generated firewall script needs to be installed on the firewall.


    To compile firewall policy use the main menu **Rules → Compile**. The compiler
    dialog box opens as shown in Figure 5-37.


    ![](img/85c3abc163982638968f0cd21ddc337c_225_0.png)


    Figure 5-37 The Firewall Builder compiler dialog box


    This dialog box is more useful when you have multiple firewalls in the object
    tree. In that case, you can choose which firewalls you want to compile by selecting
    and clearing boxes in the first column.


    Click **Next** to proceed with compilation. The dialog box shows compilation progress
    indicators and output from the compiler. If compilation is successful, a status
    line in the list on the left turns green and displays *Success*. Otherwise, it
    displays *Failure*.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'Figure 5-38 demonstrates this dialog box after a successful compilation. You
    can save the output from the compiler in a log file by selecting Save log to file.
    Finish to close the dialog box.


    ![](img/85c3abc163982638968f0cd21ddc337c_226_0.png)


    Figure 5-38 The Firewall Builder successful compilation


    You can install the generated script on the firewall using the installer that
    is provided as part of the GUI. The built-in installer launches an external ssh
    client to communicate with the firewall. You can log in either as root or as a
    regular user. Sudo is used to elevate privileges when regular user is used. Here,
    we describe the method using regular user account for access.


    To use this method, we need to configure administrative account on the firewall.


    First, create a directory on the firewall machine where the script will be installed
    (for example /etc/firewall).'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Then, create an account fwadmin and group fwadmin on the firewall machine as
    shown in Example 5-20. Actual commands used for this depend on the distribution
    that is used for the firewall. Generally, this could be adduser or a similar command.
    User fwadmin should belong to the group fwadmin. For example, this can be done
    as follows (assuming one is logged in as root).


    # Example 5-20 Add user and group name fwadmin


    ```

    root@mgmt ~ ]# groupadd fwadmin

    root@mgmt ~ ]# adduser fwadmin -g fwadmin

    ```


    The directory where policy script will be stored needs to belong to this user
    as shown in Example 5-21.


    # Example 5-21 Create /etc/firewall


    ```

    root@mgmt ~ ]# mkdir -m 0770 /etc/firewall

    root@mgmt ~ ]# chown fwadmin:fwadmin /etc/sudoers

    ```


    This account needs to be added to the list of accounts permitted to use sudo to
    elevate privileges. This is done using visudo command. This command invokes visual
    editor to change file /etc/sudoers.


    Add the following line to this file:


    ```

    fwadmin = NOPASSWD:/etc/firewall/name_of_the_firewall_object.fw

    ```


    Note that the iptables script that is generated by Firewall Builder has the same
    name as the firewall object, with the extension .fw. To avoid complications, do
    not use white spaces or special characters in the firewall object name.


    You can either set up password for the user fwadmin or copy any existing public
    key that will be used for authentication.


    Test by trying to log in to the firewall using SSH from the management workstation
    as shown in Example 5-22.


    # Example 5-22 Login to firewall partition using ssh


    ```

    root@mgmt ~ ]# ssh -l fwadmin firewall

    ```'
  merge: -1
  pgno: 227
