    # Advanced POWER Virtualization option


    IBM has been a long leader in virtualization. With the arrival of POWERS processor-based
    systems, virtualization capabilities extend IBM''s leadership in this field. IBM
    offers a set of advanced features in the Advanced POWER Virtualization (APV) option
    available for System p and BladeCenter® JS20 and JS21 platforms. APV was named
    Best Virtualization Solution at Linux World 2006. For more information, see Web
