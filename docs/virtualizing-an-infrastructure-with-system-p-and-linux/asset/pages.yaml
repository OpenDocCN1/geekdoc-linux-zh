    The Hardware Management Console (HMC) is a separate machine that provides hardware
    control of managed systems. It provides logical partition management, dynamic
    resource allocation, monitoring, power control, and call home features to initialize
    hardware calls to IBM service automatically in the event of a detected problem.
    The HMC maintains a unified event log for all its managed systems that can be
    used for diagnostic and alerting purposes. For more information about HMC managed
    System p virtualization, refer to 3.2.1, “Using the HMC for System p virtualization”
    on page 57.


    # Integrated Virtualization Manager


    The Integrated Virtualization Manager (IVM) is a hardware management solution
    that inherits the most basic features of the HMC and removes the requirement of
    an external HMC. The IVM is limited to managing a single System p server. For
    more information about IVM managed System p virtualization, refer to 3.2.2, “Using
    the IVM for System p virtualization” on page 58.


    # 1.4.2 Linux for System p enablement


    Both 32-bit and 64-bit versions of Linux for System p are provided to optimize
    choices and exploit System p hardware capabilities. The 64-bit systems provide
    a 32-bit and 64-bit kernel and support a 32-bit and 64-bit application environment,
    depending on the model and Linux distribution. Current Linux development efforts
    are focused on the 64-bit products.'
