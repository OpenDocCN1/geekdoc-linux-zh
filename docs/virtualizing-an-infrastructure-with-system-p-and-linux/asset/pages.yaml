- img_proc: true
  md: 'This cookbook provides many examples of typical NAT and policy rules for various
    situations. Because we use private addresses for the internal network (192.168.1.0/24,
    as per RFC-1918), we are going to add NAT and a policy rule to support our Web
    server. Cookbook also explains how to do Server behind the firewall using NAT
    Rules.


    In this example, we assume that we only have one external IP address, which will
    be used for both outgoing translation and for access to the Web server (inbound
    translation). Note that we do not know the actual IP address of our external interface
    because it is obtained dynamically. However, the **iptables** script that Firewall
    Builder generates works around this problem. If at all possible, Firewall Builder
    uses **iptables** commands format that allows it to avoid using actual interface
    address. Using **iptables** can INPUT makes this possible in many cases. For other
    cases, Firewall Builder adds shell script code to the beginning of the generated
    script to determine actual address of the dynamic interface and then uses this
    address in rules where necessary. This makes it possible to use interface with
    dynamic address for the inbound translation, among other things.


    Let us start with the server object. Choose library **Lab** in the tree, open
    tree branch **Objects**, and right-click **Addresses**. Then, use menu item **New
    Addresses**. New address object is created and opened in the editor as shown in
    Figure 5-32.'
