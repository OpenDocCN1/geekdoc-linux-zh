  md: '# 1.4.4 Logical Partitioning Linux on Power Architecture


    Linux is supported running in one or more logical partitions (LPARs) on all System
    p servers and BladeCenter blades that support logical partitioning. The AIX 5L
    and Linux operating systems can run concurrently in separate partitions on an
    LPAR-enabled system in any combination. This capability enables client to consolidate
    workloads from several separate physical servers to a single system, increasing
    the system utilization. Because the partitioning is controlled by the POWER Hypervisor
    firmware and the HMC or the IVM, the AIX 5L operating system is never required
    to run Linux.


    Dynamic LPAR is not supported by Linux 2.4 kernel-based distributions or on POWER4
    processor-based systems. However, you can create Linux partitions on systems that
    are enabled for dynamic LPAR. The Linux partition is disabled on the HMC and cannot
    be changed dynamically on POWER4 systems. On POWER4 systems, to reconfigure Linux
    in an LPAR environment, you must first stop it, then reconfigure the partition,
    and then restart Linux.


    To see how virtualization can benefit IT solutions, consider a typical service
    provider or Web hosting environment. It is designed as a two- or three-tier model.
    In most instances, there are front-end systems (typically edge of network and
    appliance servers) to handle caching, proxy, DNS, and so forth. There can then
    be a second tier of mid-range servers (or larger or smaller-tier servers, based
    on workload) to do Web application serving using WebSphere in conjunction with
    an ERP or CRM product. The third tier of servers run a UNIX or Linux operating
    system on a large symmetric multiprocessor (SMP) that provides the back-end and
    database management (DBMS) functions that require high performance and scalability.
    In many cases, the first and, possibly, second tiers are running Linux or Microsoft®
    Windows operating systems. This setup results in a proliferation of servers and
    the need for more expensive software to manage multiple platforms.


    Installing the IBM productivity tool packages for Linux on POWER is required for
    dynamic LPAR support. (See 3.7, "Installing service and productivity tools for
    Linux on POWER" on page 88 for more detailed information regarding this tool.)
    After you install these packages, you can now add or remove processors or I/O
    dynamically from the supported Linux operating system running on a partition using
    an attached HMC.'
