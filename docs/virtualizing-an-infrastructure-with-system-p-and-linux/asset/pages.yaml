  md: 'The IBM Systems core infrastructure is designed to provide a single point of
    control for managing up to 5000 agents. It has a graphical user interface that
    provides easy access to both local and remote systems.


    For more information about IBM Systems Director, details on managing other platforms,
    and for licensing information, visiting the following Web pages:


