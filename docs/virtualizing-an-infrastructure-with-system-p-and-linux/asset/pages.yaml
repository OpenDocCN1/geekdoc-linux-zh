    can be either local disks or SAN attached disks.


    SAN disks can be used both for the Virtual I/O Server rootvg and for virtual I/O
    clients disks.


    > Tip: A virtual disk, physical volume can be mapped to more than one partition
    by using the -f option of the mkdev command for the second mapping of the disk.
    This could be used for concurrent-capable disks between partitions.


