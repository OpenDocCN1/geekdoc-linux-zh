  md: '# 5.1 Hardware Management Console


    This section provides an overview of the Hardware Management Console (HMC) and
    the role that it plays in configuring, managing, and troubleshooting virtual resources.


    HMC is a hardware appliance that allows you to create and manage logical partitions
    on a managed system. You use the HMC to specify how you want resources to be allocated
    among the logical partitions. You also use the HMC to start and stop the logical
    partitions, update the server firmware code, and transmit service information
    to service and support if there are any hardware problems with your managed system.
    For more information about the HMC, refer to the following Web sites:


    +   - IBM Support for System p AIX for HMC:

    http://www14.ibm.com/webapp/set2/sas/f/hmc/home.html


    +   - System i and System p Managing the Hardware Management Console

    http://publib.boulder.ibm.com/infocenter/eserver/vr3s/topic/iphai/phaibook.pdf


    +   - IBM Systems Hardware Information

    http://publib.boulder.ibm.com/infocenter/eserver/vr3s/index.jsp?iphai/hmc.htm


    +   - Hardware Management Console Service Strategy and Best Practices

    http://www14.ibm.com/webapp/set2/sas/f/best/hmc_best_practices.html


    HMC can be integrated to IBM Systems Director to have a centralized management
    console to support customers variety of hardware infrastructure environment. See
    5.4.6, "HMC managed environment" on page 161 for information about how to integrate
    HMC to IBM Systems Director.


    # 5.2 Integrated Virtualization Manager


    This section provides an overview of Integrated Virtualization Manager (IVM) and
    describes how you can use it to manage virtual resources.


    The IVM is a browser-based system-management interface that you can use to manage
    a single managed system that uses the Virtual I/O Server on a management partition.
    You can use the IVM to create and manage AIX and Linux logical partitions on a
    single managed system, the virtual storage'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'and virtual Ethernet on the managed system, view service information related
    to the managed system. See Table 3-1 on page 52 for the supported servers on IVM.


    If you install the Virtual I/O Server on a supported server, and there is no HMC
    attached to the server when you install the Virtual I/O Server, the IVM is enabled
    on your server. You can then use the IVM to configure the managed system.


    For more information about the IVM, refer to the following Web sites:


    +   System i and System p Managing the Integrated Virtualization Manager

    http://publib.boulder.ibm.com/infocenter/eserver/v1r3s/topic/ipchn/iphcnpdf.pdf


