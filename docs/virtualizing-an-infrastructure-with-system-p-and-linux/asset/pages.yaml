    # # 3.4 Installing the Virtual I/O Server


    This section provides the concepts and steps to install the VIOS software on the
    created partition using SPT.


    # ## 3.4.1 VIOS overview


    The VISO is software that is located in a logical partition. This software facilitates
    the sharing of physical I/O resources between AIX and Linux clients within the
    server. The VIOS provides virtual SCSI target and Ethernet Adapter capability
    to client logical partitions within the system, allowing the client partitions
    to share SCSI devices and Ethernet adapters. The VIOS software requires that the
    logical partition be dedicated solely for its use.


    Using the VIOS facilitates the following functions:


    +   - Sharing of physical resources between logical partitions on the system

    - Creating more logical partitions without requiring additional physical I/O resources'
  merge: -1
  pgno: 78
- img_proc: true
  md: '+   - Creating more logical partitions than there are I/O slots or physical
    devices available with the ability for partitions to have dedicated I/O, virtual
    I/O, or both

    - Maximizing use of physical resources on the system

    - Helping to reduce the Storage Area Network (SAN) infrastructure


    The VIOS comprises the following primary components:


    +   - Virtual SCSI


    Physical adapters with attached disks or optical devices on the VIOS logical partition
    can be shared by one or more client partitions. The VIOS offers a local storage
    subsystem that provides standard SCSI-compliant logical unit numbers (LUNs). The
    VIOS can export a pool of heterogeneous physical storage as an homogeneous pool
    of block storage in the form of disks.


    Unlike typical storage subsystem that are physically located in the SAN, the SCSI
    devices exported by the VIOS are limited to the domain within the server. Although
    the SCSI LUNs are SCSI compliant, they might not meet the needs of all applications,
    particularly those that exists in a distributed environment.


    The following SCSI peripheral-device types are supported:


    +   - Disks backed by a logical volume

    - Disks backed by a physical volume

    - Optical devices (DVD-RAM) and DVD-ROM


    +   - Virtual networking


    Shared Ethernet Adapter allows logical partitions on the virtual local area network
    (VLAN) to share access to a physical Ethernet adapter and to communicate with
    systems and partitions outside the server. This function enables logical partitions
    on the internal VLAN to share the VLAN with stand-alone servers.


    +   - IVM


    The IVM provides a browser-based interface and a command-line interface that you
    can use to manage IBM System p servers that use the VIOS. On the managed system,
    you can create logical partitions, managed the virtual storage and virtual Ethernet,
    and view service information related to the server. The IVM is packaged with the
    VIOS, but it is activated and usable on certain platforms and where no HMC is
    present. See 3.2.2, "Using the IVM for System p virtualization" on page 58 for
    more information regarding IVM.'
  merge: -1
