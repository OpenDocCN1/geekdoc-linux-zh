  md: '# Installing the prerequisites


    After you download the prerequisite files to a local directory, you can install
    them by one in the order shown in the following list. You can also install them
    together. To install a package, use the following command:


    ```

    rpm -ivh <package>.rpm

    ```


    In this command, <package>.rpm is the name of the package.


    Starting with the requirements that are specified in the IBM Systems Director
    Planning, Installation, and Configuration Guide for installing the IBM Systems
    Director Server or Agent components, and the files that are available online at
    the time of writing this paper, the following minimum set of packages are required:


    +   - libertas-1.3.0-ppc64.rpm

    - lsvpd-0.15.1-ppc.rpm

    - servicicelog-0.2.2-0-ppc64.rpm

    - diagela-2.1.0-ppc64.rpm

    - powerpc-utils-1.0.3-ppc64.rpm

    - powerpc-utils-papr-1.0.3-1.ppc64.rpm


    You need to install the RPM files (or later versions) for Red Hat Enterprise Linux
    4, SU Linux Enterprise Server 9, and SU Enterprise Enterprise 10 systems. For
    Red Hat Enterprise Linux 4 systems, before installing IBM Systems Director, ensure
    that the compat-libstdc-++-33.2.3-47.3.rpm file (or later version) is installed.


    Depending on the POWER platform (System p or BladeCenter), there might be cases
    when one or more of the packages that you have to install are in conflict with
    an existing vendor-provided package that is installed by default with the Linux
    operating system. In Example 5-9 and Example 5-10, we present the installation
    options for Red Hat Enterprise Linux 4 that we used in our testing environment.


    > Tip: In case of a file conflict reported when installing an RPM package, use
    the --Uvh --force option to install the package. This might apply to the libertas-1.3.0-ppc64.rpm,
    powerpc-utils-1.0.0-1.ppc64.rpm, and powerpc-utils-papr-1.0.3-1.ppc64.rpm files
    on Red Hat Enterprise Linux 4 and SUSE Linux Enterprise Server 10.'
