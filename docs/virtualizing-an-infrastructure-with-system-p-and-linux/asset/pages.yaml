    # 1.3 Linux as the operating system


    This section provides a brief description of the Linux operating system and explains
    why other companies adopted Linux as their operating system. It also demonstrate
    the advantages of choosing System p as the platform for Linux deployment in a
    virtualized environment.


    # 1.3.1 Overview of the Linux operating system


    Linux is an operating system (OS) that is based on a development approach that
    delivers innovation and portability, sometimes referred to as open source. It
    is an open, reliable, and efficient operating system that runs on virtually any
    platform from embedded systems to mainframes.


    The Linux OS is the creation of Linux Torvalds, a Finnish computer student, who
    developed it while a student at the University of Helsinki in 1991. The architecture
    is similar to the UNIX OS. Linux provides a cost-effective, UNIX-like implementation
    for many computer architectures. After doing the initial development work, Torvalds
    made the source code available on the Internet for use, feedback, and further
    development by others who were interested in helping to evolve Linux.


    As open source technology, Linux is not owned or controlled by any individual
    (although Linux Torvalds does not the copyright) or company, but rather it is
    maintained by the open source community—a dedicated group of independent developers
    collaborating to make it the most open operating system. Being open source, the
    Linux kernel, like other open source technologies, can be acquired at no cost.


    The GNU Project was launched in 1984 to develop a complete clone of the UNIX operating
    system which is free software: the GNU system. (GNU is a recursive'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'acronym for “GNU’s not UNIX”) Variants of the GNU operating environment use
    the Linux kernel are now widely used. These systems are often referred to as Linux,
    they are perhaps more accurately called GNU/Linux systems. You can find the GNU
    Project web site at:


    http://www.gnu.org/gnu/the-gnu-project.html


    Clients benefit from the rapid innovation and enhancements made to Linux, enabled
    by the open source development approach. Linux is licensed under the terms of
    the GNU General Public License or GPL:


    http://www.fsf.org/copyleft/gpl.html


    The GPL requires, among other things, that the source code be made freely available
    to all who receive the program and all modifications to the code are licensed
    using the GPL as well. This requirement ensures that changes and even derivative
    works remain open source. A result, innovations are rapidly fed back into Linux
    for the benefit of all users.


    At the time of writing, the current version of the Linux kernel is 2.6 and is
    available for download:


    http://www.kernel.org


    The commercially available distributions of the 2.6 kernel that are certified
    to support the IBM Power Architecture™ technology include: Red Hat, Inc., Red
    Enterprise AS 4 for POWER, Novell SUSE Linux: SUSE Linux Enterprise Server 10
    for POWER, SUSE Linux Enterprise 9. While Linux is a UNIX-like, it is not the
    same as UNIX. The similarity ends with the fact that Linux is based on the same
    design principles and standards as UNIX, and it is derived from that heritage.
    The Linux source code is distinct from the original code. Linux offers compatibility,
    portability, and horizontal scalability for many architected platforms.


    Today, UNIX has split into a series of competing operating systems derived from
    the original. Standards such as POSIX and UNIX 98 have been promulgated to specify
    many of the APIs and features of various UNIX offerings. Linux is a single source
    operating system available to all, and as such has common APIs and capabilities
    regardless of the system it executes on. Through the GPL, developers must contribute
    their modifications back to the community, which also continues the system singularity
    as Linux progresses in capabilities.'
