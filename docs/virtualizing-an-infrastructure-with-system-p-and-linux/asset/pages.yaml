    # Figure 5-26 The Firewall Builder policy option rules


    Rule 0 is anti-spoofing interface. It blocks packets that enter the firewall from
    the Internet through outside interface but have source address that belongs to
    either the firewall or internal network. Interface and Direction rule define which
    this rule is associated with and direction in which the packet should cross the
