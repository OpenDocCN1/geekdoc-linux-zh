  md: '# Installing IBM Systems Director Server on Linux on POWER


    You can perform the installation of IBM Systems Director components in an interactive
    (standard) way, or you can use a response file to customize the features to be
    installed.


    The standard installation is a straightforward process. You have to run the dirinstall
    utility from the directory where the installation image files have been extracted
    (or from the CD mount point), and the file sets are installed on the system. In
    case has the IBM Systems Director Console or IBM Systems Director Agent components
    already installed, you must first uninstall these components, because the IBM
    Systems Director Server includes the functionality for both the agent and the
    console.


    You can download the IBM Systems Director for Linux on POWER, Version 5.20 image
    (Dir5.20_LinuxPower.tar.gz) from the IBM Systems Director Web site at:


    ```

    http://www.ibm.com/systems/management/director

    ```


    Then extract the archive:


    ```

    gzip -cd Dir5.20_LinuxPower.tar.gz | tar -xvf -

    ```


    Start the installation from the same directory by running dirinstall. Example
    5-11 shows the dirinstall installation output.


    Example 5-11 Start IBM Systems Director Server installation


    ```

    root@nmgmt[]# ./dirinstall

    ```


    In case you have the IBM Systems Director for Linux on POWER, V5.20 CD, mount
    it and run the installer from the correct location, using the commands as shown
    in Example 5-12.


    Example 5-12 Installation from CD media


    ```

    root@nmgmt power5]# mount /dev/cdrom /mnt/cdrom

    root@nmgmt power5]# cd /mnt/cdrom/director/server/linux/ppc

    root@nmgmt power5]# ./dirinstall

    ```


    Example 5-12, cdrom is the CD drive device, and /mnt/cdrom is the mount point
    for the ISO file system. Example 5-13 shows the output from the previous command.


    Example 5-13 Output of IBM Systems Director Server installation


    ```

    root@nmgmt[]# ./dirinstall

    ```'
