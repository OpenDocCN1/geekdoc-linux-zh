    This section focuses on System p5 management on Linux environment using IBM Systems
    Director Version 5.20.


    # 5.4.1 IBM Systems Director environment


    IBM Systems Director is designed to manage complex environments that contain a
    large number of servers. Focusing on System p5 management, an IBM Systems Director
    environment contains the following groups of hardware:


    +   - Management servers

    One or more servers on which IBM Systems Director is installed.

    - Managed systems

    Logical partitions (LPARs) and servers that are managed by IBM Systems Director.
    It includes System p and System p5 servers and IBM BladeCenter JS20 and JS21.

    - SNMP devices

    Devices that have Simple Network Management Protocol (SNMP) installed.

    - Managed objects

    Any additional managed object, such as platforms, chassis, and HMC.'
