  md: '# LPAR and shared-processor partitions


    A logical partition (LPAR) is not constrained to physical processor boundaries
    and can be allocated processor resources from a shared processor pool. LPAR that
    uses processor resources from the shared processor pool is known as a Micro-Partition
    LPAR.


    The percentage of a physical processor that is allocated is known as processor
    entitlement. Processor entitlement can range from 10% of a physical processor
    up to the maximum installed processor capacity of the IBM System p. You can allocate
    additional processor entitlement in increments of 1% of a physical processor.


    # Dynamic reconfiguration


    It is possible to move system resources, physical processors, virtual processors,
    memory, and I/O slots dynamically between partitions without rebooting. This process
    is known as dynamic reconfiguration or dynamic LPAR.


    # Virtual LAN


    A function of the POWER Hypervisor, Virtual LAN allows secure communication between
    logical partitions without the need for a physical I/O adapter. The ability to
    share Ethernet bandwidth securely across multiple partitions increases hardware
    utilization.


    # Virtual I/O


    Virtual I/O provides the capability for a single physical I/O adapter to be used
    by multiple logical partitions of the same server, which allows consolidation
    of I/O resources and minimizes the number of I/O adapters required.


    # Capacity on Demand


    There are multiple Capacity on Demand (CoD) possibilities offered, including:


    +   - Permanent Capacity Upgrade on Demand, which enables permanent system upgrades
    by activating processors or memory.


    +   - Trial Capacity Upgrade on Demand, which includes partial or total activation
    of installed processors or memory for a fixed period of time.


    +   - On/Off Capacity Upgrade on Demand, which includes usage based billing that
    allows for activation and devaluation of both processors and memory as required.


    +   - Reserve Capacity Upgrade on Demand, which includes a prepaid agreement that
    adds reserve processor capacity to the shared processor pool that is used if the
    base shared pool capacity is exceeded.'
