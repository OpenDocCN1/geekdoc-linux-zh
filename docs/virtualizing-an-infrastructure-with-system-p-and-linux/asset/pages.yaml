  md: '# Virtualizing an Infrastructure with System p and Linux


    +   Use System p virtualization capabilities with Linux


    +   Plan, configure, and install Linux infrastructure services


    +   Create and manage a Linux operating system-based environment


    This book positions the capabilities of IBM System p to visualize Linux infrastructure
    services for server consolidation using Advanced POWER Virtualization features.
    It discusses the benefits of virtualization, the Linux services workload, planning,
    and configuration of a virtualized server environment, and the various tools are
    available.


    This book can help you configure, and install Linux infrastructure services on
    System p and use virtualization capabilities of System p with Advanced POWER Virtualization
    features. It also covers various topics on how to configure Linux built-in infrastructure
    services, such as DNS, DHCP, firewall, and so forth, and the different virtualization
    management tools that are available on System p.


    This book is intended as an additional source of information that, with existing
    sources referenced throughout the book, can enhance your knowledge of IBM® virtualization
    technology. While the discussion focuses on the Linux operating system, you can
    extend the basic concepts to other operating systems running on System p. The
    information in this book is not intended to replace the latest marketing materials
    and tools.


    ![](img/85c3abc163982638968f0cd21ddc337c_279_0.png)


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Our recommendations are provided to
    help you implement IT’ solutions more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-7499-00 ISBN 0738486752'
  merge: -1
  pgno: 279
