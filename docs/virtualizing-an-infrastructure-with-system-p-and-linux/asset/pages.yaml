    a threshold is met or exceeded, an event is generated. You can create action plans
    to respond to resource-monitor events. You can apply resource monitors to individual
    managed systems and devices to groups.


    In IBM Systems Director Console, under the Resource Monitors task, two subtasks
    are displayed:


