    # NFS and iptables


    NFS server has a lot of ports to open, and because we have iptables running, NFS
    client might not be able to access it. So, you need to configure the NFS ports
    as shown in in Table 4-2. Table 4-2 summarizes the relevant information for the
    ports required and the iptables.


    > Table 4-2 Information for configuring NFS ports to access iptables


    | Service | Default port | Used port | Tasks to do |

    |---|---|---|{}|

    | portmap | 111 | 111 | Nothing |

    | rpc.nfsd | 2049 | 2049 | Nothing |

    | rpc.statd | Random | 4000 | Add STATD_PORT=4000 to /etc/init.d/nfsflock |

    | rpc.lockd | Random | 4001 | Add options lockd nlm_udpport=4001 nlm_tcpport=4001
    to /etc/modprobe.conf |

    | rpc.mountd | Random | 4002 | Add MOUNTD_PROD_PORT=4002 to /etc/sysconfig/network
    |'
