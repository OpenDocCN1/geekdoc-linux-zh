  md: '# Scalpel


    Scalpel is a file carving utility that searches a database of known file header
    footer signatures, and attempts to carve files from a disk image. This is done
    by configuring the scalpel.conf file with the file type(s) you would like to locate
    prior to launching it against a database.


    # bulk_extractor


    bulk_extractor can extract a variety of things from an image, including credit
    card numbers, phone numbers, URLs, and emails. bulk_extractor can generate wordlists
    from an image that could be used in dictionary attacks, bulk_extractor can take
    several hours to run, but the data that is extracted is well worth the wait for
    use in forensics.


    # Summary


    It is critical that security is considered during the entire lifecycle of any
    resources that are important to business operations. Our goal for writing this
    book beyond supporting a Penetration Tester is educating readers on various methods;
    malicious users can compromise a resource, so administrators can improve their
    security defenses. Everybody is a target, and it is up to the asset owner to invest
    in the proper time and resources into reducing the risk of being compromised.


    This chapter serves as a means to defend against attacks presented in previous
    chapters. It should be assumed that tools used in previous chapters could be leveraged
    to verify vulnerabilities on your own systems. Topics covered in this chapter
    included how to clone a web application to avoid testing live systems, baseline
    security standards, and defending against topics from previous chapters. Those
    topics include passwords, man-in-the-middle attacks, SSL striping, DoS, stealing
    cookies, and clickjacking. This chapter also included a dedicated section on using
    Kali Linux for forensic investigations.


    The next chapter will cover best practices for delivering Penetration Testing
    services, including methods for developing professional customer deliverables.'
