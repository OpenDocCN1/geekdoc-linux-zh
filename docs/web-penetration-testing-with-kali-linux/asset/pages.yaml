  md: '# Penetration Testing and Setup


    +   * **Information Gathering**: These are Reconnaissance tools used to gather
    data on your target network and devices. Tools range from identifying devices
    to protocols used.


    +   * **Vulnerability Analysis**: Tools from this section focus on evaluating
    systems for vulnerabilities. Typically, these are run against systems found using
    the Information Gathering Reconnaissance tools.


    +   * **Web Applications**: These are tools used to audit and exploit vulnerabilities
    in web servers. Many of the audit tools we will refer to in this book come directly
    from this category. However applications do not always refer to attacks against
    web servers, they can simply be web-based tools for networking services. For example,
    web proxies will be found under this section.


    +   * **Password Attacks**: This section of tools primarily deals with brute force
    or the offline computation of passwords or shared keys for authentication.


    +   * **Wireless Attacks**: These are tools used to exploit vulnerabilities found
    in wireless protocols. 802.11 tools will be found, including tools such as aircrack,
    airmon, and wireless password cracking tools. In addition, this section has tools
    for RFID and Bluetooth vulnerabilities as well. In many cases, the tools in this
    section will need to be used with a wireless adapter that can be configured by
    Kali to be put in promiscuous mode.


    +   * **Exploitation Tools**: These are tools used to exploit vulnerabilities
    found in systems. Usually, a vulnerability is identified during a Vulnerability
    Assessment of a target.


    +   * **Sniffing and Spoofing**: These are tools used for network packet captures,
    network packet manipulators, packet crafting applications, and web spoofing. There
    are also some VoIP reconstruction applications.


    +   * **Maintaining Access**: Maintaining Access tools are used to establish a
    foothold in a target system or network. It is common to find compromised systems
    having multiple hooks back to the attacker to provide alternative routes in the
    vulnerability that is used by the attacker is found and remediated.


    +   * **Reverse Engineering**: These are tools used to disable an executable and
    debug programs. The purpose of reverse engineering is analyzing how a program
    was developed so it can be copied, modified, or lead to development of other programs.
    Reverse Engineering is also used for malware analysis to determine what an executable
    does or by researchers to attempt to find vulnerabilities in software applications.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   **Stress Testing:** Stress Testing tools are used to evaluate how much
    data a system can handle. Undesired outcomes could be obtained from overloading
    systems as causing a device controlling network communication to open all communication
    channels or a system shutting down (also known as a denial of service attack).


    +   **Hardware Hacking:** This section contains Android tools, which could be
    classified as mobile, and Arduino tools that are used for programming and controlling
    other electronic devices.


    +   **Forensics:** Forensics tools are used to monitor and analyze computer network
    traffic and applications.


    +   **Reporting Tools:** Reporting tools are methods to deliver information forward
    during a penetration exercise.


    +   **System Services:** This is where you can enable and disable Kali services.
    Services are grouped into BeEEF, Dradis, HTTP, Metasploit, MySQL, and SSH.


    > There are other tools included in the Kali Linux build as web browsers, links
    to tune how the Kali Linux build is seen on the network, search tools, and other
    useful applications.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_48_0.png)


    # Summary


    This chapter served as an introduction to Penetration Testing Web Applications
    and an overview of setting up Kali Linux. We started off defining best practices
    for performing Penetration Testing services including defining risk and differences
    between various services. The takeaway is to understand what makes a Penetration
    Test different from other security services, how to properly scope a level of
    service and best method to perform services. Positioning the right expectations
    upfront with a potential client will better qualify the opportunity and simplify
    developing an acceptable scope of work.


    This chapter continued with providing an overview of Kali Linux. included how
    to download your desired version of Kali Linux, ways to perform the installation,
    and brief overview of toolsets available. The next chapter will cover how to perform
    Reconnaissance on a target. This is the first and most critical step in delivering
    Penetration Testing services.'
  merge: -1
