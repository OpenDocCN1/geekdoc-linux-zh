- img_proc: true
  md: 'From a client''s viewpoint, Penetration Testers will encounter individuals
    that gain satisfaction in stopping Penetration Testers to prove their value as
    employees, as well as how well they prepared for cyber attacks. It is highly recommended
    that a professional Penetration Tester does not get into a conflict with a client''s
    staff while penetration services are being performed. A Penetration Tester should
    focus on security awareness, and reveal what vulnerabilities exist with the least
    amount of interaction with a target''s staff during a service engagement.


    The following are the best available tools in Kali for web application Reconnaissance.
    Other tools may be available for web applications or different target types however,
    the focus of this chapter is enabling a reader for evaluating web application-based
    targets.


    # HTTrack – clone a website


