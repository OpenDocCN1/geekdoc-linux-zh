  md: '# Penetration Test Executive Report


    There may be general findings you would want to include beyond vulnerable systems
    to show additional value. For example, there is a mandate that all US federal
    agencies have equipment capable of supporting IPv6. Not having this isn''t necessarily
    a vulnerability; however, using a US customer would be interested in knowing.
    Another example would be future technologies, such as capabilities for Voice over
    IP (VoIP), and video.


    Following is a suggested list for items to include in Penetration Testing services
    to show additional value:


    +   - Difference in start-up and running configurations for devices

    - Best practice deviation

    - Support for IPv6

    - End of scale or end of life devices

    - Support for capabilities required for VoIP and video

    - Compliance to common standards such as FISMA, PCI

    - List of serial numbers, IP address, MAC, and so on of devices found

    - Network topology

    - Available protocols and public facing data


    # Network considerations and recommendations


    This section explains recommendations to remediate items found from services provided.
    Recommendations can range from high-level suggestions, such as "patch this system",
    to very detailed steps to close a vulnerability. Some remediation steps could
    impact other services, such as closing ports to defend from a specific attack,
    which also ripples another system that utilizes that channel for communication.
    It is important to include warnings of possible negative impact with any suggested
    remediation along with confirming that steps do not guarantee to fix the problem
    or bring a system into compliance with a specific regulation. The last thing you
    want is a customer being compromised post services and point blame at you for
    not providing successful remediation steps to a vulnerability identified during
    your services.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 8


    It is very important to state in a deliverable report what guarantees or coverages
    are included post services. Customers that fail an audit may assume your previous
    services are liable if you do not state your services, do not guarantee meeting
    mandates or requirements. For example, there is a huge difference between having
    a PCI report included with services, compared to actually contracting a PCI expert
    in reviewing all aspects of the regulation with the customer''s network, in a
    similar method used by auditors.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_310_0.png)


    There are many levels of remediation. Sometimes there the network in architecture
    exposes a weakness, but other times it''s a gap in policy, configuration, or missing
    patch. Items to include for recommendations are summary of findings, high-level
    and detailed recommendations for remediation, other useful data outside of requested
    items, such as IPv6 capabilities, changes in network design, recommendations for
    hardware, software, patches, and compliance summary.


    Example:


    We commend CUSTOMER for proactively managing technology risk and network security
    through procuring our services. Due to the impact to the overall organization
    as uncovered by this Penetration test, appropriate resources are recommended to
    be allocated to ensure that remediation efforts are accomplished in a timely manner.
    Although a comprehensive list of items that should be implemented beyond the scope
    of this engagement, some high level items are important to mention.


    +   - Implement a patch management program: Many identified vulnerabilities could
    be avoided with proper patch management. We recommend the guidelines outlined
    in NIST SP 800-408 as a source for developing security policies for proper patch
    management. This will reduce the risk of running vulnerable systems.


    +   - Enforce change control over all systems: Common vulnerabilities are caused
    by human error. Many misconfiguration issues could be avoided through a strong
    change and control process on all active systems


    +   - Leverage multifactor and role-based access control: Some critical systems
    were found leveraging password security as the only means of validating authorized
    individuals. Best practice is having at least two forms of authentication, along
    with limiting administration account access.


    +   - Restrict access to critical systems: Critical systems should be isolated
    from other systems using whitelists, ACLs, VLANs and other means. The design concept
    of least privilege will limit the amount of damage an attacker can inflict using
    a compromised resource. Consult NIST SP 800-27 RevA11 for guidelines on achieving
    a security baseline for IT systems.'
  merge: -1
  pgno: 310
