  md: '# samdump2


    samdump2 is a utility that dumps the Microsoft Windows password hashes from a
    SAM file so they can be cracked by an offline tool. For newer versions of Windows,
    you will need another tool to capture the SYSKEY (boot key) file to access the
    hashes stored in the SAM database.


    samdump2 can be found under Password Attacks | Offline Attacks | samdump2. When
    you open samdump, a Terminal window will pop up.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_178_0.png)


    You must mount your Windows system so that samdump can access the SAM file.


    ```

    root@kali:-# mkdir /mnt/Windows

    root@kali:-# mount -t ntfs-3g /dev/hdb1/mnt/windows

    ```


    Next, copy the SAM and SYSTEM files into your attack directory.


    cp SAM SYSTEM /root/AttackDirectory


    Navigate to the attack directory and issue bkhive SYSTEM bootkey to obtain the
    bootkey. Copy the bootkey into a text file so that samdump has the SAM file with
    bootkey.


    cd /root/AttackDirectory > windowshashfiles.txt


    Execute samdump using the samdump SAM bootkey command. Copy the output into a
    second text file.


    Samdump2 SAM bootkey > windowshashfiles.txt


    Now use a password cracking tool such as John the Ripper to crack the hashes:


