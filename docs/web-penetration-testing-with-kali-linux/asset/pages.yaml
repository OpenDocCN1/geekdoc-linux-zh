  md: '# Server-side Attacks


    There will be a window that pops up to generate or import a certificate. You can
    generate a certificate by clicking on **Generate**. You can save the new certificate
    by clicking on **Save** and selecting where to place it. The new certificate file
    is called owasp_cap_root_ca.cer.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_107_0.png)


    Once you have saved the CA file, click on **OK** and open your browser. For Firefox,
    go under **Edit** | **Preferences** and click on the **Advanced** tab. Click on
    the **Encryption** subtab and click on **View Certificates**. Click on **Import**
    and select the certificate you generated in Zaproxy (*.cer file). Firefox will
    ask you to trust this new **Certificate Authority**. Check all three options,
    which are trust for websites, e-mail users, and software developers. Click on
    **OK**.


