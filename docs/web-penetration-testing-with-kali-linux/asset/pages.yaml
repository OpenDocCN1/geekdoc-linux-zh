  md: 'Here is an example of taking advantage of one of these SEED links by injecting
    a script. We will create a URL and add the alert (1) script to see if the website
    will create a popup error:


    ```

    http://google-gruye.appspot.com/326352883334/

    <script>alert(1);</script>

    </script>

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_246_0.png)


    The example shows our target web application server issue a popup proving that
    this site is vulnerable to an attack. We can use ZAP to replay the attack, try
    other attacks, or test similar XSS methods.


    We recommend playing around with errors you find and see if you can manipulate
    them to generate a sensitive output for your Penetration Testing exercises. The
    Gruyere project is a great way to test your skills finding other vulnerabilities
    like ZAP.


    To defend against remote attacks, ZAP can be great for testing web vulnerabilities
    such as XSS attacks. Some people believe that users don''t need to be concerned
    with XSS when surfing websites if the browser advertises that it has XSS defenses.
    The truth behind that concept is that browser protection can be perfect, based
    on the principle that browsers are not aware of how secure the code is behind
    the web application. Clever hackers may be able to circumvent protection, such
    as exploiting an XSS vulnerability and issuing scripts against hosts visiting
    the website. Best practices for protecting your server and clients accessing your
    applications is identifying and remediating vulnerabilities using a tool like
    ZAP.'
