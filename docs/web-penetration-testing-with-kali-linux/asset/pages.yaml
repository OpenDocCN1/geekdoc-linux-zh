    If you would like to use Hydra on a web form, you will need to gather the information
    collected from the Tamper Data plugin. The syntax for Hydra on a web form is `url::form
    parameters::failure string`.


    ```

    URL=https://www.facebook.com/login.php?login_attempt=email&pink&password=princessl&login="log
    in"

    ```


    You can run Hydra. You will need to provide a file that contains a list of usernames
    and a file that contains passwords.


    ```

    hydra -L /cloudcentrica/usernamelist -F /cloudcentrics/passwords_file.txt -facebook.com
    http-get-form "login.php?login_attempt=1:username=%^&TOKEN=%^PASSWORD&login=Login:incorrect"

    ```


    The syntax can get complicated and change from site to site. This can happen on
    the same site as well. It''s recommended to master Tamper Data and Hydra in a
    lab prior to performing live Penetration Testing.


    # DirBuster


    DirBuster is designed to brute-force directories and filenames on web application
    servers. It is common that web servers present themselves as a default installation
    state, however applications and pages are actually hidden within. DirBuster is
    designed to seek out these hidden factors.


    DirBuster can be found under **Web Applications | Web Crawlers | dirbuster**.
    Once opened, there are fields that must be filled before starting an attack. At
    the least, you must enter a target URL, select the number of threads (we suggest
    max out at 100), and the files list. You can click on **Browse** and select the
    default list or develop your own.'
