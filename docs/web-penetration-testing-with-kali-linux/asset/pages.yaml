- img_proc: true
  md: "# Chapter 7\n\nUsing Kali in Forensic mode helps you achieve your number golden\
    \ rule of not modifying the original filesystem. The internal hard drive is not\
    \ touched and there is no automount of internal disks. Swap partitions and any\
    \ other memory or caching partitions are also not used in any way.\n\nIn forensics\
    \ mode, removable media will not be automounted. If a CD or thumb drive is inserted\
    \ into the system, nothing will happen. It is possible you may want to use removable\
    \ media in forensics mode by manually mounting it. This gives the forensics specialist\
    \ complete control of the filesystem and media that is being mounted on the system.\n\
    \nAs previously stated, you should always work on a copy of the data source. It\
    \ is important to keep the filesystem of the copy intact so you can show that\
    \ you did not modify it as well as your steps can be recreated. Let's look at\
    \ how to use tools available in Kali to copy and hash data.\n\n# Filesystem analysis\
    \ with Kali\n\ndd is one of the most common Linux/Unix tools to copy filesystems.\
    \ The tool can be used to make an exact copy of a filesystem, including deleted\
