  md: '# 3 Server-side Attacks


    A server by definition is a dedicated computing system running services to users
    and other computers on a network. Examples of service range from public services
    such as online gaming to sharing sensitive files inside a large organization.
    In the context of client-server architecture, a server is a computer program to
    run the requests of other programs, known as the "clients". Thus, the server performs
    some computational task on behalf of "clients". The clients either run on the
    same computer, or connect through the network. For example, a server would host
    a game to the world while clients would access the game remotely. There are various
    forms of providing services to clients such as an Apache Web Server limited to
    HTTP or a BEA WebLogic Application Server that does HTTP plus more.


    Network servers are typically configured to handle the load of servicing large
    volumes of clients. This means adding additional processing, memory and storage
    making these assets valuable targets for hackers. Organizations typically manage
    servers remotely and do not actively monitor activity, meaning small hits in performance
    or other indicators of being compromised may go unnoticed. Common to find malicious
    users have accessed compromised servers for long periods of time prior to the
    owners identifying the vulnerability used to access the system.


    This chapter will focus on identifying and exploiting vulnerabilities in web application
    servers. We will start out with showcasing tools available in Kali used to identify
    vulnerabilities. Next, we will focus on exploiting vulnerabilities to gain access
    to web application servers. We will conclude with other methods to access web
    application services.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Server-side Attacks


    # Vulnerability assessment


    Server-side attacks are exploiting and finding vulnerabilities in services, ports,
    and applications running on a server. For example, a web server has several attack
    vectors. It is a server running an operating system and running various pieces
    of software to provide web functionality. It has many open TCP protocols. Each
    of these could harvest a vulnerability that an attacker could exploit to get into
    the system and obtain valuable information. Protocols on servers are handled through
    readable non-encrypted text.


    Let''s take a look at some tools available in Kali for identifying vulnerabilities
    on servers.


    # Webshag


    Webshag is a multi-threaded, multi-platform tool used to audit web servers. Webshag
    gathers commonly useful functionalities for web servers such as port scanning,
    URL scanning and fuzzing. It can be used to scan a web server in HTTP or HTTPS,
    through a proxy and using HTTP authentication (basic or digest). In addition,
    Webshag can use IDS evasion capabilities aimed at making correlation requests
    more complicated.


    Webshag provides additional innovative capabilities such as retrieving the list
    of domain names hosted on a target machine as well as fuzzing using dynamically
    generated filenames. Webshag can perform fingerprinting of web pages while being
    resistant to content changes. This feature is designed as a false positive removal
    algorithm aimed at dealing with "soft 404" server responses.


    Webshag is accessed through a GUI or a command-line console and available with
    the Linux and Windows platforms. Webshag can be found under Web Applications |
    Web Vulnerability Scanners as webshag-gui.


    Webshag is easy to use. Each feature has a tab on the top. Select the desired
    feature tab, enter your target URL under the target space and click on OK to execute.
    You can run multiple tabs simultaneously. Features include Port Scanning, Spider,
    URL Scan, and Fuzzing. The next four screenshots show Webshag performing a port
    scan, web spider crawl, URL scan, and file Fuzz of www.thesecurityblogger.com.'
