    # pdf-parser


    pdf-parser is used to parse and analyze Portable Document Format (PDF) documents,
    as well as extract raw information as code, images, and other elements from PDF
    documents. It is a tool used to examine and reconstruct PDF documents that are
    identified as possibly malicious code.


    # Foremost


    Foremost is a data carving utility used to recover files based on their headers,
    footers, and internal data structures. Foremost works with image files, such as
    those generated by da, Safeback, Encase, or directly on a drive. The image file
    headers and footers can be specified by a configuration file or using command
    line to identify file types. These built-in types look at the data structures
    of a given format, allowing for a more reliable and faster recovery.


    # Pasco


    Pasco is a forensic tool for reading the index.dat files that are created by Microsoft
    Internet Explorer. The Internet Explorer index.dat files store the user''s browser
    history, which can be useful for an investigation of host. Microsoft stores the
    index.dat file in various locations on the host system''s hard drive. For example,
    some index.dat files are in the user''s home folder used for the user profile.


    > Pasco only works for Internet Explorer. Other browsers like Firefox and Chrome
    do not leave index.dat.

    Firefox and Chrome store browser information in SQLite databases.

    The location of the database varies from operating system to operating system,
    but they can be opened with any SQLite viewer. One of the author''s favorite tools
    for SQLite clients is Firefox plugin named SQLite Manager.


