  md: '# Other forensics tools in Kali


    Kali has numerous forensics tools built in the category labeled Forensics. Here
    are some commonly used tools in Kali, as applied to web application forensics:


    # chkrootkit


    chkrootkit can be run on Linux systems to determine if rootkits exist on the system,
    based on signatures and processes. Think of it as antivirus or antimalware for
    Linux systems.


    To run chkrootkit, open a Terminal window and type chkrootkit. This will check
    the local operating system for any installed rootkits.


    ```

    root@kali:~# chkrootkit

    ```


    Chkrootkit is a simple program that can ensure your copy of Kali has not been
    infected. You can also run chkrootkit on other Linux distributions by installing
    it on those systems.


    # Autopsy


    Autopsy is an open source digital forensic tool that runs on Windows, Linux, OS
    X, and other Unix systems. Autopsy can be used to analyze disk images and perform
    a in-depth analysis of filesystems such as NTFS, FAT, HFS+, Ext3, UFS, and several
    volume system types. The most common use of Autopsy is as a case management tool
    for managing analysis of image files. Remember how we created an image using the
    dd tool? Autopsy will help us investigate the image.


    To run Autopsy, navigate to Kali Linux | Forensics | Digital Forensics and select
    Autopsy. This will bring up a Terminal window, which will start the application.
    Leave that window open and use the tool through its interface. To access the interface,
    open a web browser and navigate to http://localhost:9000/autopsy.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_288_0.png)'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Defensive Countermeasures


    Select New Case to create a new case. This will give you the following example
    screenshot:


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_289_0.png)


    Autopsy will prompt a few questions before continuing. Questions include setting
    the time zone, entering time offsets between your Kali system and the system you
    are investigating, and descriptions, such as hostnames.


    The next example will use Autopsy to create an image that was created in a previous
    example with the dd tool, as shown in the following screenshot:


    ```

    root@kali:~# dd if=/dev/sda5 of=mytestimage.dd

    2648064+ records in

    2648064+ records out

