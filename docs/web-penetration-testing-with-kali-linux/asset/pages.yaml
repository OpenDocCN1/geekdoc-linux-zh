- img_proc: true
  md: '# Web Attacks


    The focus of this chapter will be on Internet-based attacks. Security administrators
    for organizations are aware that there are malicious parties on the Internet,
    continuously looking for ways to penetrate any network they come across and in
    defense, have security measures in place. Common defenses include Firewalls, IPS/IDS,
    host-based security products, such as Anti-Virus, Content Filters, etc. In the
    past, these defenses were sufficient; however, threats are becoming more sophisticated
    nowadays, with the ability to circumvent commercial off the shelf or "COTS" security
    solutions. The tools covered in this chapter will include methods in Kali Linux,
    used to bypass standard security defenses from a remote location.


    This chapter wraps up the Penetration Tester''s arsenal. After reviewing material
    covered in previous chapters, you should understand how to conduct reconnaissance
    on a target, identify server-client-side vulnerabilities, and techniques used
    for exploiting them. This chapter will cover the final element of attack related
    to using web server itself and compromise web applications using exploits, such
    as browser exploitation attacks, proxy attacks, and password harvesting. We will
    also cover methods to interrupt services using denial of service techniques.


    # Browser Exploitation Framework – BeEF


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Web Attacks


    Browser vulnerabilities can be exploited by malicious software to manipulate the
    expected behavior of a browser. These vulnerabilities are a popular attack vector,
    because most hosts leverage some form of Internet browser software. Let''s take
    a look at a popular tool developed to exploit browser vulnerabilities.


    There are many Penetration Testing applications that should be included in your
    hacking arsenal, as one of our favorites known as Browser Exploitation Framework
    (BeEF). BeEF is a browser-based exploit package that "hooks" one or more browsers
    as beachheads for launching attacks. A user can be hooked by accessing a customized
    URL and continue to see typical traffic, while an attacker has access to the user''s
    session. BeEF bypasses security appliances and host-based, anti-virus applications
    by targeting the vulnerabilities found in common browsers, such as Internet Explorer
    and Firefox.


    BeEF is not included with the 1.0 release of Kali Linux, but can be found at beefproject.com.
    We expect BeEF to be added into a future release of Kali Linux based on its popularity
    in the Penetration Testing community.


    To install BeEF, open a command terminal on Kali Linux as a root user and issue
    the following commands:


    +   - apt-get update

    - apt-get install beef-xss


    ```

    root@kali:~# apt-get update

    ```


    You may be asked to install, update, or overwrite some older files when you run
    the apt-get update command. In most cases, you can just accept the default prompts.
    When the update process is completed, you may use apt-get to install BeEF:


    ```

    root@kali:~# apt-get install beef-xss

    ```


    Once the process is complete, you will have BeEF installed on Kali Linux.'
