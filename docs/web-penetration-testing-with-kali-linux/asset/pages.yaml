  md: '# Chapter 2


    Click on the **Ping** tab. Select the **-Pn** flag option so Nmap will not ping
    the first host. When this flag is not set, Nmap will ping your target hosts and
    networks. Default settings only perform scan on hosts that are alive or reachable.
    The -Pn flag allows Nmap to scan a host even without a ping response. Although
    this makes the scan considerably lengthy, the **-Pn** flag allows Nmap to avoid
    a common problem of not receiving a ping response when the requests are blocked
    by security defenses.


    | nmap -T4 -A -v -Pn 10.0.1.0/24 | Scan |

