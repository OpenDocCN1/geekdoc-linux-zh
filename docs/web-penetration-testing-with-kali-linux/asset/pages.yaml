  md: 'To use a custom word file such as the one built in the previous example called
    NoDuplicatesOrUppercase, you will need to edit the default wordlist. This can
    be found by editing the file john.conf under the default John the Ripper folder.
    In that file, you will find the wordlist pointing to a default passwords.lst.


    ```

    # Wordlist file name, to be used in batch mode

    Wordlist = $JOHN/password.lst

    ```


    Change the file list to name of your new word file. Following the previous example,
    you would change it to Wordlist = NoDuplicatesOrUppercase.list. The new wordlist
    file must be in the folder specified in the john.conf file. The default is listed
    under the $JOHN directory.


    Use the John Ripper on a password file, you will first need to copy the target
    file to the John directory. Issue the command cp to move the file into the John
    directory. For example, to copy a shadow file (a common password file found in
    Linux systems) type cp /etc/shadow.


    Once the file is in the same directory as John the Ripper, issue the command john
    and the filename. To run John Ripper on a shadow file, type john shadow.


    You can check the progress of John the Ripper by pressing Enter, which will display
    the current password being guessed as well as the cracks per second listed as
    c/s.


    You can pause the John Ripper by pressing CTRL and C keys together. If you restart
    John by issuing john FILE, it will resume where you last paused the file.


    To see the results once John the Ripper finishes, type john -show FILE. To see
    the results of the shadow file, type john -show shadow.


    You can find more information on John the Ripper such as other commands at http://www.openwall.com/.


    # Man-in-the-middle


    A man-in-the-middle attack by standard definition is a form of active eavesdropping
    by having an attacker make independent connections with victims. The most common
    form of man-in-the-middle attacks are between systems. Not too long ago, a vulnerability
    was found that the system that moves people from insecure to secure web pages.
    This gives attackers the ability to eavesdrop on users connecting to secure servers.
    The next section will cover in that vulnerability. Common man-in-the-middle attacks
    will be covered in later chapters in this book.'
