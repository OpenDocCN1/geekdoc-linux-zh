  md: '# Defensive Countermeasures


    To properly test a HTTP session, examine the certificate and look at the certificate
    authority. This additional effort discourages many users from verifying a secured
    session, which makes this attack method very effective.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_277_0.png)


    The previous screenshot shows a SSL certificate for Gmail was issued by the Google
    Internet Authority. This sounds great, but who is the Google Internet Authority?
    Can I trust them? Is it really Google? In this example, I have another certificate
    authority above the Google Internet Authority named Equifax Secure Certificate
    Authority. Equifax has a number of checks and balances before issuing a certificate
    to ensure a business is valid. Verifying that Equifax generated this certificate
    makes me feel I can trust this certificate.


    Ultimately, HTTPS relies on the concept of trust. To be more explicit, the question
    comes down to trusting the certificate authority that issued the certificate is
    valid and legitimate. For lab environments, it is common to find self-signed certificates
    that trigger alarms from most popular Internet browsers. That annoying popup that
    users complain about when accessing websites as a means to warn that the certificate
    authority is likely not trustworthy, there is a risk of a MITM attack.


    # This Connection is Untrusted


    You have asked Firefox to connect securely to insidemit-apps.mit.edu, but we can''t
    confirm that your connection is secure.


    Normally, when you try to connect securely, sites will present trusted identification
    to prove that you are going to the right place. However, this site''s identity
    cannot be verified.


    # What Should I do?


    If you normally connect to this site without problems, this error could mean that
    someone is trying to impersonate the site, and you shouldn''t continue.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_277_1.png)


    +   - Technical Details

    - I Understand the Risks'
