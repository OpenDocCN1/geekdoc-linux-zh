    # DNSCHEF


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_262_1.png)


    DNSChef is a DNS proxy for Penetration Testers and Malware Analysts. A DNS

    proxy also known as "Fake DNS" is a tool for application network traffic

    analysis and other use cases. Domain Name System (DNS) is a distributed naming

    system for computers, services, or any network connected to the Internet or private

