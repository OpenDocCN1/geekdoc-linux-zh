- img_proc: true
  md: '# Digital forensics


    Kali Linux 1.0 includes a number of tools for dealing with forensic requirements.
    Forensics is the practice of investigating evidence and establishing facts of
    interest that links to an incident. This section will give you an introduction
    to digital forensics as we believe it is necessary to have a reaction plan when
    one of your assets, such as a server or web application, is compromised. It is
    recommended to research other sources for a more thorough as this topic extends
    beyond the tools available in Kali Linux. Digital forensics is a growing area
    of interest in information security with very few people who know it.


    It is important to remember three rules you work on digital forensics. Failure
    to comply with these rules will make opinions of yours seem amateurish, and probably
    render your forensics investigation inclusive.


    The first rule is never work on original data. Always use a copy. Ensure you do
    not modify data when you create a copy. The moment you touch or modify original
    data, your case becomes worthless. Tampered evidence cannot be used in any legal
    proceeding regardless of what is found. The reason is once an original is modified,
    there is a possibility of identifying false evidence that can misrepresent the
    incident. An example is making a change that adjusts the timestamp in the system
    logs. There would be no way to distinguish this change from an amateur analyst''s
    mistake or hacker trying to cover his tracks.


    Most forensic scientists will use specialized devices to copy data bit for bit.
    There is also very popular software that will do the same. It is important that
    your process be very well documented. Most digital copies in legal proceedings
    that have been thrown out were removed to a hash of a storage medium, such as
    a hard drive, not matching copied data. A hash of a hard drive will not match
    a contaminated copy, even if only a single bit is modified. A hash match means
    it is extremely likely the original data including filesystem access logs, deleted
    data information, and metadata is an exact copy of the original data source.


    The second rule for digital forensics is anything that can store data should be
    examined. In famous cases involving digital media, critical evidence has been
    found on a camera DVR recorders, video game consoles, phones, iPads, and other
    random digital devices. If the device has any capability of storing user data,
    then it is possible that device could be used in a forensics investigation. Do
    not dismiss a device just because it is unlikely. A car navigation system that
    stores maps and music on SD cards could be used by culprits to hide data, as well
    provide evidence for Internet usage based on download music tags.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Defensive Countermeasures


    The last critical rule for digital forensics is ensuring you document all your
    findings. All evidence and steps used to reach a conclusion must be easy to understand
    for it to be credible. More importantly, your findings must be recreatable. Independent
    investigators must arrive at the same conclusion as you using your documentation
    and techniques. It is also important that your documentation establishes a timeline
    of events when specifics occurred and how they occurred. All timeline conclusions
    must be documented.


    A forensic investigation is all about the perception of being a security expert
    validating evidence linked to an incident. It is easy to get caught looking for
    bad guys and drawing conclusions on what may have happened based on opinion. This
    is one of the fastest ways to discredit your work. As a forensics specialist,
    you must only state the facts. Did person Alice steal Bob''s files, or did the
    account that was logged on as username Alice invite a copy from the user account
    Bob''s home directory to a USB drive with serial number XXX at the timestamp XXX
    on day XXX? See the difference? The real bad guy could have stolen Alice''s login
    credentials (using methods covered in this book) and steal Bob''s data while posing
    as Alice. The moment you jump to a conclusion is your case becomes inconclusive
    based on personal interference. Remember, as a forensics specialist, you could
    be asked out to give testimony on exactly what happened. When anything outside
    of facts enters the record, your credibility will be questioned.


    # Kali Forensics Boot


    Kali Linux has the option of using a Forensics Boot. Kali forensics mode is selected
    when you boot a system with a Kali boot-up disk, such as the Live CD. If you want
    to use Kali as a forensics toolkit, we highly recommend keeping a Kali Live CD
    as part of your toolkit. The Kali Live CD can be obtained as an ISO image downloaded
    from the Kali Linux website (refer to Chapter I, installing Kali). When Kali boots,
    you will see Forensics mode as one of the selectable options.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_283_0.png)'
