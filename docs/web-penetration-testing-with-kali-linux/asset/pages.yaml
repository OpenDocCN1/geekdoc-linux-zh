  md: '# Defensive Countermeasures


    You can take the value that is calculated and put directly into Autopsy.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_291_0.png)


    Autopsy is a platform that can help collect forensics information for documentation
    purposes. When a partition is ready to be examined, you can use Autopsy to look
    at specific disk, file information, raw files, and their metadata. Autopsy can
    also connect to the National Institute of Standards Reference Library to compare
    hashes of known files to determine if they are good or bad programs.


    # Binwalk


    It is often challenging to determine the purpose of binary files identified during
    a forensic investigation. The reason is the source code for binary files is usually
    not available. Binwalk is a firmware analysis tool designed to assist in the analysis,
    extraction, and reverse engineering of firmware images and other binary software.
    The focus of Binwalk is firmware binary files; however, there are updates for
    home networking and wireless equipment, as well as all consumer electronics gadgets.


    Binwalk has a few different options that can be found at: https://code.google.com/binwalk/wiki/Usage.
    You can run the command binwalk with the filename of a binary file you would like
    to examine. The next example uses binwalk on a binary firmware for a wireless
    router as shown in the following screenshot:


    ```

    root@kali:~/Desktop$ ls

    Ao66PC_Fw_WRT54Gv_2.8.2.08.001_US_20691085.bin leic

    root@kali:~/Desktop$ binwalk Fw_WRT54Gv_2.8.2.08.001_US_206bin

    ```


    Binwalk will output results of the binary file:'
