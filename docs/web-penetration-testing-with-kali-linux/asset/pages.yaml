    # ICMP Reconnaissance techniques


    The ping and traceroute commands are good ways to find out basic information about
    your target. When information travels across networks, it usually traverses several
    systems, such as routers, firewalls, and other computer systems before it gets
    to its destination. The traceroute command identifies each system the data travels,
    along with the time it takes for the data to move between systems. The tool is
    installed in every modern operating system. For most high-value targets, the ping
    and traceroute commands will most likely be disabled, and excessive use of these
    services will most likely trigger alerts on network security systems. Many firewalls
    or other systems are set up to respond to B24RYE routes. If systems respond to
    traceroute, using this excessively can trigger security events. These tools are
    noisy, and when used indiscriminately, they will set off alarms and logs. If your
    goal is to be stealthy, you have just defeated, giving your target an opportunity
    to set up and deploy counter measures against your Penetration Test.


    An ICMP sweep sends out an echo request and looks for a reply. If a reply is returned,
    then there is a possible target. The problem with ICMP scans is that ICMP is usually
    blocked by firewalls. That means any scans from outside going to an internal target
    network will be blocked by an ICMP scanner.


    The ping command is the most basic way to start an ICMP sweep. You simply type
    in ping followed by a hostname or IP address to see what will respond to the ICMP
    echo request. The following screenshot shows a ping of www.google.com:'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Chapter 2


    ```

    Last login: Tue Sep 10 10:28:12 on console

    rtp-jumieiz-8815-: jumieiz ping www.google.com

    PING www.google.com (72.44.93.94): 55 data bytes

    64 bytes from 72.44.93.94: icmp_seq=0 ttl=55 time=123.56 ms

    64 bytes from 72.44.93.94: icmp_seq=1 ttl=55 time=110.31 ms

    64 bytes from 72.44.93.94: icmp_seq=2 ttl=55 time=106.218 ms

    64 bytes from 72.44.93.94: icmp_seq=3 ttl=55 time=116.40 ms

    -

    --- www.google.ping statistics

    5 packets transmitted, 5 packets received, 0.0% packet loss

    round-trip min/avg/stddev = 106.218/116.4/123.566/5.935 ms

    rtp-jumieiz-8815-: jumieiz

    ```


    If you get any responses back, you will know that your host is alive. If you get
    timeouts, your ICMP ping is being blocked, or no destination host has received
    your request.


    The problem with the ping command is that it only allows you to use ICMP to check
    on one host at a time. The fping command will allow you to ping multiple hosts
    with a single command. It will also let you read a file with multiple hostnames
    or IP addresses and send using ICMP echo packets.


    To use the fping to run an ICMP sweep on a network, issue the following command:


    ```

    fping-asg network/host bits

    fping -asg 10.0.1.0/24

    ```


    Although a flag will return the results via IP address of live hosts only, the
    s flag displays statistics about the scan, the g flag sets fping in quite mode,
    which means it shows the user the status of each scan, only the summary when it
    has completed.


    > The Nmap provides similar results as the fping command.


    # DNS Reconnaissance techniques


    Most high-value targets have a DNS name associated to an application. DNS makes
    it easier for users to access a particular service and add a layer of professionalism
    to their system. For example, if you want to access Google for information, you
    could open a browser and type in 74.125.227.101 or type www.google.com.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'DNS information about a particular target can be extremely useful to a Penetration
    Tester. DNS allows a Penetration Tester to map out systems and subdomains. Older
    DNS attacks a zone file from an authoritative DNS, allowing the tester to examine
    the full contents of the zone file to identify potential targets. Unfortunately,
    most DNS servers today do not allow unauthenticated zone transfers. However, all
    is not lost! DNS by its very nature is a response that responds to queries; therefore,
    an attacker could use a word list query containing hundreds of names with a DNS
    server. This attack vector is an extremely consuming task; however, most aspects
    can be automated.


    Dig (domain information groper) is one the most popular and widely used DNS Reconnaissance
    tools. It queries DNS servers. To use Dig, open a command prompt and type dig
    and hostname, where hostname represents the target domain. Dig will use your operating
    systems default DNS settings to query the hostname. You can also configure Dig
    to query custom DNS servers by adding @<IP> to the command. The example in the
    following screenshot illustrates Dig on www.cloudcentrics.com.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_71_0.png)'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Chapter 2


    The `-t` option in Dig will delegate a DNS zone to the authoritative servers.
    We type **dig -t ns cloudcentrics.com** in the example in the following screenshot:


    ```

    alakhani — bash — 80x24

    Last login: Tue Mar 19 23:50:26 on ttys000

    chaos:~ alakhani dig -t ns cloudcentrics.com

    ; >> DIG 9.8.3-P1 << -t ns cloudcentrics.com

    ; global options: +cnd

    ; Got answer:

    ; -->HEADER-- opcode: QUERY, status: NOERROR, id: 15672

    ; flags: qr rd ra, QUERY: 1, ANSWER: 2, AUTHORITY: 0, ADDITIONAL: 0


    ; QUESTION SECTION:

    IN      NS

    cloudcentrics.com.


    ; ANSWER SECTION:

    IN      NS

    cloudcentrics.com. 85749 ns3681.hostgator.com.

    cloudcentrics.com. 85749 ns3682.hostgator.com.


    ; Query time: 5 msec

    ;; SERVER: 10.0.0.1#53(10.0.1.1)

