  md: '# Penetration Testing and Setup


    Penetration Testing is the method of attacking system vulnerabilities in a similar
    way to malicious attackers. Typically, Penetration Testing services are requested
    when a system or network has exhausted investments in security and clients are
    seeking to verify if all avenues of security have been covered. Penetration Testing
    can be Black, White, or Gray box depending on the scope of work agreed upon.


    The key difference between a Penetration Test and Vulnerability Assessment is
    that a Penetration Test will act upon vulnerabilities found and verify if they
    are reducing the level of confirmed risk associated with a target. A Vulnerability
    Assessment of a target could change to a Penetration Test once the asset owner
    has authorized the service provider to execute attacks against the vulnerabilities
    identified in a target. Typically, Penetration Testing services have a higher
    cost associated since the services require more expensive resources, tools, and
    time to successfully complete assignments. One popular misconception is that Penetration
    Testing service enhances IT security since services have a higher cost associated
