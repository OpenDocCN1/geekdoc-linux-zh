  md: '# Exploitation


    If a Penetration Tester invests the proper time and resources during the Reconnaissance
    of a target, the Penetration Tester ends up with a list of targets with possible
    vulnerabilities. The next step is prioritizing each target''s value to your mission,
    approximating the level of effort required to exploit potential vulnerabilities,
    and judging the associated risk with performing the attack. The vulnerability
    and exploitation available in Kali are ideal for identifying and exploiting vulnerabilities
    during the Reconnaissance of web application servers.


    # Metasploit


    The Metasploit framework is one of the most popular tools for exploiting server-side
    attacks. It is considered one of the most useful tools for Penetration Testers.
    HD Moore created it in 2003. It is used as a legitimate Penetration Testing tool,
    as well as a tool used by attackers to conduct unauthorized exploitation of systems.


    There are plenty of sources dedicated to teaching how to use the Metasploit framework.
    In the context of this book, we will examine how Metasploit is used for server-side
    exploitation for testing potential web applications.


    > Note to make sure Postgres SQL and Metasploit services are started. You can
    do so by typing service postgres start and service metasploit start in the Terminal
    window as root.


    The first step is to open a console and type in msconsole to launch Metasploit.
    msconsole is the most popular way to launch Metasploit. It provides a user interface
    to access the entire Metasploit framework. Basic commands such as help and show
    allow you to navigate through Metasploit.


    > Note that there are other methods to launch Metasploit such as msfgui (GUI-based)
    and msfcli (command line-based).


    In addition to Metasploit commands, msconsole will allow you to invoke underlying
    OS commands such as ping or nmap. This is helpful because it allows an attacker
    to execute routine tasks without leaving the console.


    In our first step, we will use nmap to scan the local network. The results will
    be automatically added into Metasploit using an XML file.'
