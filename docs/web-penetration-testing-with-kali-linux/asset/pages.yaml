  md: 'There are other tools that are available to clone a filesystem. We recommend
    the dd tool for cloning specific partitions, because it is built into Kali and
    most other Linux and Unix systems. The process to clone a system can be very time
    consuming, depending on how large the partition is that you are trying to copy.
    Although dd is a great tool, it may not always be the best tool. if you are looking
    to clone an entire disk, there are other popular tools, such as IMAGE or AIR Image,
    that do not come preloaded with Kali, but are very popular. It is important to
    confirm tools used in a forensic investigation adhere to standard evidence admissibility
    if there is a possibility the result will be used in a legal matter.


    # dc3dd


    dc3dd is the dd tool with added functionality for forensics. dc3dd can calculate
    a hash between the tool you are copying and the source drive on a bit-by-bit level.
    This is critical when proving the copy of data you are working is exactly like
    the original. This can be accomplished by creating a hash of the original and
    the copy to later verify a match.


    For the next example, we will run the sfdisk -l command to see the drives and
    partitions available, as shown in the following screenshot:


    ```

    root@kali:~# sfdisk -l

    Disk /dev/sda: 3916 cylinders, 255 heads, 63 sectors/track

    Warning: extended partition does not start at a cylinder boundary.

    DOS and Linux will interpret the contents differently.

    Units = cylinders of 8225208 bytes, blocks of 1024 bytes, counting from 0

    Device Boot Start End #cols #blocks Id System

    /dev/sda * 0+ 3751- 30130176 83 Linux

    /dev/sda2 3751+ 3916- 165- 1324033 5 Extended

    /dev/sda3 0 - Empty

    /dev/sda4 0 - Empty

    /dev/sda5 3751+ 3916- 165- 1324032 82 Linux swap / Solaris

    root@kali:~# _

    ```


    The dc3dd command is executed in a similar way as the dd tool. You pick a source
    drive or partition as the destination to save the image. There is also a hash
    option. In the next example, we take the partition of /dev/sda2 and copy it to
    an image named CopyOfDrivedc3dd, along with calculating a hash using sha256.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Defensive Countermeasures


    This example is for demonstration purposes. A real forensic investigation would
    not save the image back to the same drive.


    ```

    root@kali:-# dc3dd if=/dev/sda2 of=/CopyofDrivedcd3dd version hash=sha256

    ```


    dc3dd will give you a unique hash for the input file of the copied drive when
    it is complete.


    ```

    dc3dd 7.1.614 started at 2013-07-06 17:32:32 -0400

    compiled options:

    command line: dc3dd if=/dev/sda2 of=/CopyofDrivedcd3dd_version hash=sha256

    device size: 2 sectors (probed)

    sector size: 512 bytes (probed)

    1024 bytes (1 K) copied (100%), 0.10156 s, 9.8 K/s

    input results for /dev/sda2:

    2 sectors in

    0 bad sectors replaced by zeros

    c28635c09505425c793774a6c8e5d5e98a6b7a4cd8a9a24e6f6473d490e6b (sha256)

    out results for /CopyofDrivedcd3dd_version:

    2 sectors out

    completed at 2013-07-06 17:32:32 -0400

    ```


    It is important to prove the hash of the copy copies matches exactly with the
    original. We use the command sha256sum to calculate the hash. If we calculate
    the hash on our file CopyofDrivedcd3dd as our hard drive /dev/sda2, we will see
    they match. We can see the output from our dc3dd copy is also the same. Since
    the hash matches, we have confirmed the files are exactly the same for a forensic
    investigation.


    ```

    dc3dd 7.1.614 started at 2013-07-06 17:32:32 -0400

    compiled options:

    command line: dc3dd if=/dev/sda2 of=/CopyofDrivedcd3dd_version hash=sha256

    device size: 2 sectors (probed)

    sector size: 512 bytes (probed)

    1024 bytes (1 K) copied (100%), 0.10156 s, 9.8 K/s

    input results for /dev/sda2:

    2 sectors in

    0 bad sectors replaced by zeros

    c28635c09505425c793774a6c8e5d5e98a6b7a4cd8a9a24e6f6473d490e6b (sha256)

    out results for /CopyofDrivedcd3dd_version:

    2 sectors out

    dc3dd completed at 2013-07-06 17:32:32 -0400

