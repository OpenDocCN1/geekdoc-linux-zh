    # XSS cookie stealing / Authentication hijacking


    Script kiddies may use XSS for generating pop-up alerts, as a professional Penetration
    Tester, the real value of XSS is to gain privileged access to a system. The next
    section will explain how to do this. If you have not done so already, assign your
    Gruyere instance for testing the next section''s contents.


    Navigate to http://google-gryere.appspot.com/start. App Engine will start a new
    instance of Gruyere for you, assign it a unique ID and redirect you to http://google-gryere.appspot.com/123456/
    (where 123456 is the unique ID for this example).


    Each instance of Gruyere is completely isolated from any other instances, so your
    instance will not be affected by anyone else using Gruyere. You''ll need to use
    your unique ID instead of 123456 in all the examples.


    If you want to share your work and project you complete in Gruyere with someone
    else (for example, to show them a successful attack), just share the full URL
    with your friend including your unique ID.


    Do not use the password for your Gruyere account as you use for any real service.


    Let''s walk through an example of using an XSS vulnerability to steal a session
    cookie. If you try this technique on a local network, your Kali box and vulnerable
    web server must be able to communicate. Because we are using Gruyere project,
    we needed to put our Kali Linux box on the Internet with a facing IP address,
    so Kali Linux can properly communicate with the target Gruyere server.'
