    # Low Orbit Ion Cannon


    Low Orbit Ion Cannon (LOIC) is network stress testing tool, meaning it is designed
    to test how much traffic a target can handle for planning future resource expectations.
    The software has inspired other similar software such as JavaScript, LOIC, which
    allows a user to do stress testing directly from a web browser.


    The software was famously used by Anonymous to help facilitate DDoS attacks against
    several websites, including some very well-known public entities. Some legal arguments
    have been made that LOIC is similar to going to a website several thousand times;
    however, some American law enforcement groups treat the use of LOIC as a violation
    of the computer security and fraud act.'
