  md: '# Client-side Attacks


    > Note that if you access a file in Windows, you modify the MAC (modify, access,
    and change), which is how Windows logs your presence. To avoid leaving forensic
    evidence, it is recommended to copy the target host system prior to launching
    attacks.


    # Mounting Windows


    There are tools available for capturing the Windows SAM and SYSKEY files. One
    method to capture these files is mounting the target Windows system so that the
    other tools can access these files while Microsoft Windows is not running.


    The first step is to use the fdisk -l command to identify your partitions. You
    must identify the Windows and partition types. The fdisk output shows a NTFS partition,
    as follows:


    ```

    Device Boot Start Blocks Id System

    /dev/hdb1 1 2432 19535008+ 86 NTFS

    /dev/hdb2 2433 2554 979965 82 Linux swap/Solaris

    /dev/hdb3 2555 6202 29302560 83 Linux

    ```


    Create a mount point using the command mkdir /mnt/windows.


    Mount the Windows system using the command as shown in the following


    ```

    mount -t <WindowsType> <Windows partition> /mnt/windows

    root@kali:~# mkdir /mnt/windows

    root@kali:~# mount -t ntfs-3g /dev/hdb1/mnt/windows

    ```


    Now that your target Windows system is mounted, you can copy the SAM and SYSTEM
    files into your attack directory using the following command:


    ```

    cp SAM SYSTEM /pentest/passwords/AttackDirectory

    ```


    There are tools available for dumping the SAM file. PwDump and Cain and Abel are
    just a few examples. Kali offers sandump shown, in the password tools section
    of this chapter.


    > Note that you will need to recover the Bootkey and SAM files. The Bootkey file
    is used to access the SAM file. Tools used to access the SAM file will require
    the Bootkey file.'
