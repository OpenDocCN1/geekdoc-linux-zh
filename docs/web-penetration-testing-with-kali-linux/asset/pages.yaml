  md: '# Penetration Testing and Setup


    The following is the list of Reconnaissance goals:


    +   - Identify target(s)

    - Define applications and business use

    - Identify system types

    - Identify available ports

    - Identify running services

    - Passively social engineer information

    - Document findings


    # Step 2 – Target evaluation


    Once a target is identified and researched from Reconnaissance efforts, the next
    step is evaluating the target for vulnerabilities. At this point, the Penetration
    Tester should know enough about a target to select how to analyze for possible
    vulnerabilities or weakness. Examples for testing for weakness in how the web
    application operates, identified services, communication ports, or other means.
    Vulnerability Assessments and Security Audits typically conclude after this phase
    of the target evaluation process.


    Capturing detailed information through Reconnaissance improves accuracy of targeting
    possible vulnerabilities, shortens execution time to perform evaluation services,
    and helps to aid existing security. For example, running a generic vulnerability
    scanner against a web application server would probably alert the asset owner,
    a wait to execute and only generic details about the system and applications.
    Scanning a server for a specific vulnerability based on data obtained from Reconnaissance
