    # Denial of Services (DoS)


    Typically, a Penetration Testing exercise is focused on identifying the gaps in
    security rather than harming a system. This is a key feature that separates a
    real attacker from an authorized Penetration Tester. Real hackers not follow the
    rules and are not concerned about interrupting if they can improve their situation.
    In some cases, a hacker is looking to create any form of negative impact on a
    target, taking down critical systems. For this reason, it makes sense in some
    cases to test systems for the risk of Denial of Service (DoS) type attacks. This
    is commonly termed as stress testing your Internet facing services.


    > It is absolutely critical to have an approval to test an asset for DoS vulnerabilities.
    Some attack methods may have a negative impact to a system-Penetration Test. It
    is advised to test against redundant systems, equipment, or nonfiction systems
    if possible.


    The most common DoS attack involves flooding a target with external communication
    requests. This overload prevents the resource from responding to legitimate traffic,
    or slows its response so significantly that it is rendered unavailable. DoS attacks
    can target system resources (IE disk space, bandwidth, and so on), configuration
    information (IE remove route tables), state information (TCP session resetting),
    or anything that can harm system operation.


    > The difference between a DoS and Distributed Denial of Service (DDoS) is that
    a DoS attack involves one machine while a DDoS attack involves many. DoS is out
    of scope for this text.


    [ 235 ]'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Web Attacks


    There are four major DoS/DDoS attack categories:


    +   - **Volumed Attacks:** It involves UDP floods, ICMP floods, and other spoofed
    packet-based floods. The purpose is to saturate the bandwidth of the victim website.

    - **Protocol Attacks:** It consumes resources of servers or intermediate communication
    equipment, such as routers, firewalls, load balancers, and so on. Examples are
    SYN floods, Ping of death, Smurf, Teardrop, fragmented packets, and so on.

    - **Application Layer Attacks:** It leverages legitimate traffic to crash a web
    service. It includes Zero-day attacks, vulnerability exploitation, and so on.

    - **Session Exhaustion:** Abusing session limitations by repeatedly establishing
    but not closing sessions with the goal of consuming resources.


    Kali Linux contains multiple vulnerability exploitation tools covered in previous
    chapters that can be used for Application Layer DoS attacks such as Metasploit.
    Also, Chapter 3 covered a popular Protocol DoS tool Scapy. Here are a few more
    tools available in Kali Linux to perform DoS attacks:


    > To DoS, you can use www.upndown.org to view whether a website is available.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_253_0.png)


    # THC-SSL-DOS


    The **Secure Socket Layer (SSL)** protocol is used to secure connections and transactions
    over the Internet. Establishing a secure SSL connection requires 15x more processing
    power on the server than the client. THC-SSL-DOS exploits this asymmetric property
    by overloading the server until it is unable to provide any service to legitimate
    users. The attack exploits the SSL secure re-negotiation feature to trigger thousands
    of re-negotiations using a single TCP connection. This is known as an SSL-Exhaustion
    attack. The advantage of this approach is that the processing capacity for SSL
    handshakes is far superior at the client side, meaning that a common laptop over
    an average network connection can challenge a web application server. This is
    a known vulnerability, and no real solution exists to remediate this as of the
    writing of this text.'
