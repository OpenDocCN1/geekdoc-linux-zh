- img_proc: true
  md: '# Server-side Attacks


    Before we target mail servers, it is important to know what systems are hosting
    the mail servers. If you do not have this information, you can use the Reconnaissance
    techniques we learned in Chapter 2, Reconnaissance. In this example, we used fierce
    to determine the MX hosts for a particular domain. In most cases the MX host is
    the SMTP server. The following screenshot is running Fierce on www.cloudcentric.com:


    ```

    root@kali:~# fierce -dns www.cloudcentric.com

    DNS Servers for www.cloudcentric.com:

    ns3682.hostgar.com

    ns3681.hostgar.com


    Trying zone transfer...

    Request timed out or transfer not allowed.

    Testing ns3682.hostgar.com

    Testing ns3681.hostgar.com

    Request timed out or transfer not allowed.

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_123_0.png)


    First we need to see if the mail server is vulnerable to direct attacks. The main
    purpose for which most attackers want to exploit mail servers is to spoof e-mails
    and use the e-mail server as an unauthorized e-mail relay server. This book will
    cover more on how compromised e-mail servers can be used for social engineering
    attacks in Chapter 4, Client-side Attacks.


    In this example, we will use Netcat as the tool to connect to the mail server.
    Netcat is a computer networking service for reading and writing to network connections
    using TCP or UDP. Netcat is designed to be a dependable "back-end" device that
    can be used directly or easily driven by other programs and scripts. Netcat is
    also a feature-rich network debugging and investigation tool with the ability
    to produce almost any kind of correlation with a number of built-in capabilities.


    A common method to launch Netcat is issuing the command netcat mail-server port.
    In this example, our mail server target is running servers over port 25. We verified
    this information using nmap over the Reconnaissance steps in Chapter 2, Reconnaissance.


    ```

    root@kali:~# netcat mail.secmob.net 25

    ```


    Once we connect to the server using Netcat, we use the HELO command to tell the
    server who we are.'
