  md: '# Penetration Testing and Setup


    Black box assumes the Penetration Tester has no prior knowledge of the target
    network, company processes, or services it provides. Starting a Black box project
    requires lot of reconnaissance and, typically, is a longer engagement based on
    the concept that real-world attackers can spend long durations of time studying
    targets before launching attacks.


    As a security professional, we find Black box testing presents some problems when
    scoping a Penetration Test. Depending on the system and your familiarity with
    the environment, it can be difficult to estimate how long the reconnaissance phase
    will last. This usually presents a billing problem. Customers, in most cases,
    are not willing to write a blank cheque for you to spend unlimited time and resources
    on the reconnaissance phase; however, if you do not spend the time needed your
    Penetration Test is over before it began. It is also unrealistic because a motivated
    attacker will not necessarily have the same scoping and billing restrictions as
    a professional Penetration Tester. That is why we recommend Gray box over Black
    box testing.


    White box is when a Penetration Tester has intimate knowledge about the system.
    The goals of the Penetration Test are clearly defined and the outcome of the report
    from the test is usually expected. The test has provided with details on the target
    such as network information, type of systems, company processes, and services.
    White box testing typically is focused on a particular business objective such
    as meeting a compliance need, rather than generic assessment, and could be a shorter
    engagement depending on how the target space is limited. White box assignments
    could reduce information gathering efforts, such as reconnaissance services, equaling
    less cost for Penetration Testing services.


    > An internal security group usually performs white box testing.


    Gray box testing falls between Black and White box testing. It is when the client
    or system owner agrees that some unknown information will eventually be discovered
    during a Reconnaissance phase, but allows the Penetration Tester to skip this
    part. The Penetration Tester is provided some basic details of the target; however,
    internal workings and some other privileged information is still kept from the
    Penetration Tester.'
