  md: '# Cover page


    A cover page at a minimal will provide a report name, version, date, author, service
    provider name, and intended party. Cover pages can also list additional items
    such as the document security classification or highlight results from other sections.


    # Confidentiality statement


    The information obtained during the majority of penetration services will be sensitive.
    It is critical to identify the level of security expected to protect information
    captured during the engagement, as well as who is permitted to view such data.
    Certain levels of clearance may require special handling or secured locations
    for storage such as a Sensitive Compartmentalized Information Facility (SCIF)
    for storing classified material. Violations of data privacy can have financial,
    brand, and legal repercussions.


    A Confidentiality statement should explain what level of security is involved
    with the document, who is authorized to view it, what is and what is not permitted
    to be copied, distribution rights, and other legal language. We recommend having
    an individual with a legal background develop your standard Confidentiality Statement.


    Example 1: Confidentiality Statement


    This document contains confidential and privileged information from SERVICE PROVIDER.
    The information is intended for the private use of CUSTOMER for their understanding
    of the current state of security of their organization. By accepting this document,
    CUSTOMER agrees to keep the contents of this document in confidence and not copy,
    disclose, or distribute it to any parties, other than those that will provide
    services and/or products directly to CUSTOMER as a result of the recommendations
    of this document, without request to and written confirmation from SERVICE PROVIDER.
    If you are not the intended recipient, be aware that any disclosure, copying,
    or distribution of this document or its parts is prohibited.


    Example 2: Statement of Confidentiality


    This confidential information is being provided to SERVICE PROVIDER as a deliverable
    of this consulting engagement. The sole purpose of this document is to provide
    CUSTOMER with the results and recommendations from this engagement. Each recipient
    agrees that they will follow the distribution restrictions according to the agreement
    between this consulting agent and SERVICE PROVIDER.'
  merge: -1
