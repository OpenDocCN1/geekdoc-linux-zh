  md: '# Introducing Kali Linux


    The creators of BackTrack have released a new, advanced Penetration Testing Linux
    distribution named Kali Linux. BackTrack 5 was the last major version of the BackTrack
    distribution. The creators of BackTrack decided to move forward with the challenges
    of cyber security and modern testing a new foundation needed. Kali Linux was born
    and released on March 13, 2013. Kali Linux is based on Debian and an FHS-compliant
    filesystem.


    Kali has many advantages over BackTrack. It comes with more updated tools. The
    tools are streamlined with the Debian repositories and synchronized four times
    a day. The may users have the latest package updates and security fixes. The new
    compliant systems translate into running most tools from anywhere on the system.
    Kali has also made customization, unattended installation, and flexible desktop
    environments strong features in Kali.


    Kali Linux is available for download at http://www.kali.org/


    # Kali system setup


    Kali Linux can be downloaded in a few different ways. One of the most popular
    ways to get Kali Linux is to download the ISO image. The ISO image is available
    in 32-bit and 64-bit images.


    If you plan on using Kali Linux on a virtual machine such as VMware, there is
    a VM image preload. The advantage of downloading the VM is that it comes preloaded
    with VMware tools. The VM image is a 32-bit image with Physical Address Extension
    support, or better known as PAE. In theory, a PAE kernel allows you to access
    more memory system than a traditional 32-bit operating system. There have been
    some well-known personalities in the world of operating systems that have argued
    for and against the usefulness of PAE kernel. However, the authors of this book
    suggest using the VM image of Kali Linux if you plan on using in a virtual environment.


    # Running Kali Linux from external media


    Kali Linux can run without installing software on a hard drive by accessing it
    from an external media source such as a USB drive or DVD. This method is simple
    to enable; however, it has performance and operational implementations. Kali Linux
    having to load programs from a remote source would impact performance and some
    applications or hardware settings may not operate properly. Using read-only media
    does not permit saving custom settings that may be required to make Kali Linux
    operate correctly. It''s highly recommended to install Kali Linux on a hard drive.'
