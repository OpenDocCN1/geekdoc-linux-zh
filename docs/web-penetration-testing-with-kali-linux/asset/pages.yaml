  md: '# Chapter 6


    Slowlor is a low bandwidth HTTP client that can issue DoS attacks. What makes
    Slowlor unique is its method of attacking a target without using common flooding
    techniques. Slowlor holds connections open by sending partial HTTP requests. It
    continues to send hundred subsequent requests at regular intervals to keep sockets
    from closing. This behavior will overwhelm the target''s resources, making it
    unable to respond to legitimate traffic. High-traffic websites may take a long
    time to free up available sockets, other users must finish their requests before
    the sockets become available for Slowlor to consume. Nevertheless, Slowlor eventually
    flood all the available sockets, killing service to the victim website.


    Slowlor takes advantage of servers that used thread processing, meaning vulnerable
    to limiting the amount of threading permitted. Examples include Apache 1.x, 2.x,
    dhtop, GoAhead, and so on.


    Slowlor does not come installed on Kali Linux. You can download Slowlor from http://ckers.org/slowloris


