    Technical Details

    SERVICE PROVIDER performed a vulnerability scan on host 100.25.5.55 and discovered
    that the MS System administrator (sa) account still had its default password "sa".
    The screenshot shows SERVICE PROVIDER used these credentials to access the host.


    ```

    meterpreter > ipconfig

