    Some fundamentals for developing a scope of work for a Penetration Test are as
    follows:


    +   **Definition of Target System(s):** This specifies what systems should be
    tested. This includes the location on the network, types of systems, and business
    use of those systems.


    +   **Timeframe of Work Performed:** When the testing should start and what is
    the timeframe to meet specified goals. Best practice is NOT to limit the time
