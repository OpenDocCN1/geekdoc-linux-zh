    ```


    We see from the results we have two authoritative DNS servers for the domain www.cloudcentrics.com;
    they are ns3681.hostgator.com and ns3682.hostgator.com.


    Congratulations, you have just found the authoritative DNS server for your target
    DNS.


    # DNS target identification


    Now that you have found the authoritative DNS servers for a domain, you might
    want to see what hosts have entries on that domain. For example, drchaos.com may
    have several hosts, such as cloud.drchaos.com, mail.drchaos.com, sharepoint.drchaos.com.
    These all could be potential applications and potentially high value targets.


    Before randomly choosing hosts, we should query the DNS server to see what entries
    exist. The best way to do that is to ask the DNS server to tell us. If the DNS
    server is configured to allow zone transfers, it will give us a copy of all its
    entries.'
