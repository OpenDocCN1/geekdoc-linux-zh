  md: '# The Certified Information Systems Security Professional (CISP) curriculum
    lists


    formulas for calculating risk as follow.


    A Single Loss Expectancy (SLE) is the cost of a single loss to an Asset Value
    (AV). Exposure Factor (EF) is the impact of the loss of the asset will have on
    an organization such as lost revenue due to an Internet-facing server shutting
    down. Customers should calculate the SLE of an asset when evaluating security
    investments to help identify the level of funding that should be assigned for
    controls. If a SLE would cause a million dollars of damage to the company, it
    would make sense to consider that in the budget.


    The Single Loss Expectancy formula:


    SLE = AV * EF


    The next important formula is identifying how often the SLE could occur. If an
    SLE worth a million dollars could happen once in a years, as a meteor falling
    out of the sky, it may not be worth investing in a protection dome around your
    headquarters. In contrast, if a fire could cause a million dollars worth of damage
    and is expected every couple of years, it would be wise to invest in a fire prevention
    system. The number of times an asset is lost is called the Annual Rate of Occurrence
    (ARO).


    The Annualized Loss Expectancy (ALE) is an expression of annual anticipated loss
    due to risk. For a example, a meteor falling has a very low annualized expectancy,
    while a fire is lot more likely and should be calculated in future investments
    for protecting a building.


    Annualized Loss Expectancy formula:


    ALE = SLE * ARO


    The final and important question to answer is the risk associated with an asset
    used to figure out the investment for controls. This can determine if and how
    much the customer should invest into remediating vulnerability found in an asset.


    Risk formula:


    Risk = Asset Value * Threat * Vulnerability * Impact


    It is common for customers not to have values for variables in Risk Management
    formulas. These formulas serve as guidance systems, to help the customer better
    understand how they should invest in security. In my previous examples, using
    the formulas with estimated dollar value for a meteor shower and fire in a building,
    should help explain why a fire prevention system is a better investment than metal
    dome protecting from falling objects.'
