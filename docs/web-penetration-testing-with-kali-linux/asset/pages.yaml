    # Inundator


    Inundator is a tool that evades Intrusion Detection Systems (IDS) and Intrusion
    Prevention Systems (IPS) by flooding their log files. The concept is that you
    may want to flood a target with false positives so you can hide a real attack
    from a reaction and forensic viewpoint. Inundator can also be used to test the
    effectiveness of the alerting system of your security reporting tools, such as
    SIEM and IDS/IPS.


    # TCPReplay


    TCPReplay uses previously captured traffic in libpcap format to test a variety
    of network devices. TCPReplay can classify traffic as client or server, rewrite
    Layer 2, 3, and 4 headers and replay the traffic back onto the network as well
    as through other devices, such as switches, routers, firewalls, and IDS/IPS. TCPRe
    supports single and dual NIC modes for testing both sniffing and inline devices.


    Basically, TCPReplay can capture traffic between a client and server, and replay
    it anywhere in the network.'
