  md: '# BURP Proxy


    Burp Proxy is a tool that intercepts HTTP and HTTPS traffic. It allows a Penetration
    Tester to examine an application, its vulnerabilities, and the two-way traffic
    between a client and a web server. Burp Proxy is very popular because of its ability
    to not only examine the traffic, but also, it manipulates requests. We will examine
    how Burp Proxy is used to manipulate, reply, and steal authentication.


    It is important to remember that Burp Proxy is actually a part of Burp Suite,
    which is a collection of tools. When a user enters a URL in their web browser
    such as http://www.DtChaos.com, they expect to be directed to the website. A proxy
    server will intercept that request and send it on behalf of the client. Proxy
    servers are usually put in place to inspect the traffic and protect the clients
    from harmful data. As a Penetration Tester, you can use a proxy server to intercept
    traffic from a client, copy the request, or manipulate it:


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_235_0.png)


    To launch Burp Suite, simply navigate to: Kali | Sniffing/Spoofing | Web Sniffers
    and select Burp Suite.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Once Burp Suite is launched, you will be presented with the Burp launch dashboard:


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_236_0.png)


    To configure Burp, click on the Proxy tab. By default, the Intercept option is
    selected in this tab. When the Intercept option is enabled, Burp stops all requests
    from a web browser to the web server. The feature allows a Penetration Tester
    to manually allow the connection to continue once it''s viewed.


    > The Intercept button requires manual intervention, or the request will never
    make it to the web server.


    The next configuration setting is found on the Options submenu. This section will
    allow users to check or change the default port when Burp is running. By default,
    Burp is set to run on the loopback interface, as shown in the following screenshot.
    A loopback interface is a special interface that has the IP address of 127.0.0.1
    associated with it. It does not have a physical hardware connection tied to it,
    but is a way for the operating system to reference itself. In other words, when
    you want to communicate with yourself in networking, you could use a loopback.
    If you plan on testing Burp Suite beyond the local machine, you should add your
    Ethernet interface and IP address.'
