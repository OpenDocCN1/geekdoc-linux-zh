    # # sqlmap


    sqlmap automates the process of detecting and exploiting SQL injection flaws and
    taking over of database servers. sqlmap comes with a detection engine, as well
    as a broad range of Penetration Testing features from database fingerprinting
    to accessing the underlying file system and executing commands on the operating
    system out-of-band connections.


    Features include support for common database management systems, support for many
    SQL injection techniques, enumerating users, password hashes, and many others,
    sqlmap also supports database process'' user privilege escalation using Metploit''s
    Meterpreter getsystem command.


    sqlmap is a tool that can be used to exploit database servers and is built into
    Kali. To use sqlmap, you will need to point the tool to a URL of a SQL script
    on a webserver. These can be identified because they usually have php in the URL.


    You can find sqlmap under Vulnerability Analysis | Database Assessment | sqlmap.
    A Terminal window will open displaying the sqlmap help page.


    The basic syntax to use sqlmap:


    ```

    sqlmap -u URL -- function

    ```


    A common function is dbs. The dbs keyword will have sqlmap get the databases.
    sqlmap -u http://www.drchaos.com/article.php?id=5 --dbs


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_220_0.png)


    You can see from our results we have several databases that were found. For this
    example, we will concentrate on the test database.'
