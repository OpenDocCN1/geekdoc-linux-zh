  md: '# Man-in-the-middle attack


    Man-in-the-middle attack is a form of active eavesdropping in which the attacker
    makes a connection with victims and relays messages between victims, making them
    believe they are talking to each other. There are many forms of this attack, such
    as using a Hak5 Pineapple router that pretends to be a trusted wireless access
    point while really acting as a man-in-the-middle between a victim and wireless
    network. Another example is using Kali to forward traffic between a victim and
    default router while sniffing for useful information, such as login credentials.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_210_0.png)


    Many cloud services such as Facebook and Gmail leave secure login via HTTPS, which
    prevents a generic man-in-the-middle attack. To bypass HTTP Secure, you can use
    SSLstrip, which will reveal all login information to your man-in-the-middle attack.
    The SSLStrip / man-in-the-middle combination is a very effective method to steal
    victim''s login credentials, if you have an attack on the same network as the
    target system(s).


    # sniff and arpspoof


    dsiff is a set of password sniffing and network traffic analysis tools designed
    to parse different application protocols and extract relevant information.


    arpspoof is used when an attacker sends fake address resolution protocol (ARP)
    messages into a local area network. The goal of this process is to associate the
    attacker''s MAC address with the IP address of another host, causing any traffic
    meant for the IP address to be sent to the attacker instead.


    One manual method to perform a man-in-the-middle using arpspoof and dsiff to sit
    between systems. The first step is identifying the IP address of your victim and
    default gateway of the network using techniques from Chapter 2, Reconnaissance
    - Concepts. Once you know the IP addresses, you need to tell your victim you are
    really another system or the default gateway. For example, if victim one is 172.16.76.128,
    the default gateway is 172.16.76.2, and the attacker is 172.16.76.131, you would
    set your 131 IP address to look like the victim and default gateway using the
    arpspoof command.


    Open two Terminal windows and type the following commands in each window to spoof
    your victims:'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Attacking Authentication


    TERMINAL 1:


    ```

    arpspoof -t 172.16.762.128 172.16.762.2 // tells victim 2 you are the

    default gateway

    ```


    TERMINAL 2:


    ```

    arpspoof -t 172.16.76.2 172.16.76.2 // tells victim 1 you are the

    default gateway

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_211_0.png)


    If you enter the commands correctly, you should see that traffic is being replayed
    through the attacking system. Traffic is not going to and from the victim, the
    victim would not see traffic going out of the network at this point. To complete
    the attack, you need to enable IP forward so traffic will continue to flow from
    the default gateway to the victim and versa, while the attacker is watching traffic
    between the victim and default gateway.


    Open a third Terminal window and type:


    ```

    echo 1>/proc/sys/net/ipv4/ip_forward

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_211_1.png)


    At this point, traffic should be flowing between the victim and default gateway
    while going through the attacker system. The following screenshot shows the ping
    fail while IP forward is not enabled.'
  merge: -1
  pgno: 211
