    # Driftnet


    Driftnet is a man-in-the-middle tool used to capture images from live network
    traffic. Driftnet requires a man-in-the-middle attack to be established prior
    to working. You can leverage the arpspoof and dsniff or Ethercap packets previously
    covered to launch your man-in-the-middle attack prior to launching Driftnet. Driftnet
    can be run simultaneously to give you quickly the visibility of all images flying
    across the wire.'
