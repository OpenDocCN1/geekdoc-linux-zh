  md: '# Client-side Attacks


    > Note that John the Ripper command line and Hydra were covered in Chapter 3,
    Server-side Attacks.


    # Johnny


    Johnny is a GUI for the very popular John the Ripper password cracking tool. We
    covered the traditional command-line version of John the Ripper is Chapter 3,
    Server-side Attacks. Like the command-line version, Johnny has several engines
    that allows it to crack different types of passwords, including encrypted and
    hashed passwords. Johnny has the ability to auto-detect most hashes and encrypted
    passwords, making the process easier for Penetration Testers. Attackers like the
    tool because it is very customizable and can be configured in a variety of different
    ways to speedup password cracking.


    > Some customizations may not be available in Johnny. We recommend the command-line
    version, John the Ripper, for most attacks.


    John the Ripper operates in the following manner:


    +   - Attempts cracking passwords with dictionary words

    - Uses dictionary words with alphanumeric characters appended and prepended

    - Puts dictionary words together

    - Adds alphanumeric characters to combine words

    - Runs dictionary words with special characters mixed in

    - When all else fails, attempts brute-force.


    To use Johnny, go to Password Attacks | Offline Attacks and select Johnny. Click
    on Open Password File and select the password file you want to crack. The following
    screenshot shows a shadow file with users BOB, mary, and joey as the targets.'
