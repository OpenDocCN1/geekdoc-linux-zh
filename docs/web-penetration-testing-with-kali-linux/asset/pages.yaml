  md: '# Chapter 2


    The first step is creating a new profile. A profile in Zenmap allows a Penetration
    Tester to choose what type of scan to execute and what different options to include.
    Navigate to the Profile menu and select New Profile or Command to create a new
    profile, as shown in the following screenshot:


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_78_0.png)


    When you select New Profile or Command, the profile editor will launch. You will
    need to give your a descriptive name. For example, you can call the profile My
    Scan or anything else you would like.


    Optionally, you can give the profile description. During your course of using
    Zenmap you will probably create many profiles and make multiple scans. A natural
    reflex may be to delete profiles post execution. Here is a word of advice: profiles
    don''t take any space and come handy when you want to recreate something. We recommend
    being extremely descriptive in profile names and come up with a standard naming
    method. I start all my profile description with the date, time, description of
    my location, my target network scan location, and customer name.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_78_1.png)'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'When you completed the description, click on the Scan tab. In the Targets section,
    you will add what hosts or networks you would like to scan. This field can take
    a range of IP addresses (10.0.0.1-255) or it can take a network in CIDR format
    (10.0.1.0/24).


    You can see option -A is selected by default to enable aggressive scanning. Aggressive
    scanning will enable OS detection (-O), version detection (-sV), script scanning
    (-sC) and tracer (-traceroute). Essentially, aggressive scanning allows a user
    to turn on multiple flags without the need to remember them.


    Aggressive scan is considered intrusive, meaning it will be detected by most security
    devices. An aggressive scan may go unnoticed if your target is an extremely specific
    host, but regardless of the situation, it is recommended you have the permission
    to scan before using this or scanning option. As a reminder, completing the ACK
    in the three-way handshake with an unauthorized system is considered illegal by
    the US standards.


    We use the information we received from our DNS Reconnaissance exercise to target
    a very specific host. Before we do that, let''s view a common options first.


    ```

