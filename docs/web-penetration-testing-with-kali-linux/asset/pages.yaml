    # MitM Proxy


    MitM Proxy is a great tool for a Penetration Tester to examine the client''s vulnerabilities.
    It allows the administrator to examine the HTTPS connection, halt, examine, and
    reply traffic. MITM Proxy allows an administrator to alter the request or response
    from a web server.


    MitM Proxy can allow a Penetration Tester to examine the attacks quickly and see
    what requests and responses are coming from the web browser. MITM Proxy can be
    launched by going to Kali | Sniffing/Spoofing | Web Sniffers and selecting mitmproxy.


