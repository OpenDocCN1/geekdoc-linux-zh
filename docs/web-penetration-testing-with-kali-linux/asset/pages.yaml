    SERVICE PROVIDER proceeded to dump the contents of the SAM database. This database
    is used by Windows NT to store and retrieve user credentials. With this information,
    we could run a rainbow tables or brute-force attack to decipher the passwords
    to all of these accounts. If any of these passwords were the same for other systems,
    we could then hop to other systems and compromise them as well. In order to validate
    that files could be opened by an attacker, SERVICE PROVIDER confirmed it could
