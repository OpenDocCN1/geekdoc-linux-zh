    +   **How Targets Are Evaluated:** What types of testing methods such as scanning
    or exploitation are and not permitted? What is the risk associated with targets
    that become inoperable due to penetration attempts? Examples are; social networking
    by pretending to be an employee, denial of service attack on key systems, or executing
    scripts on vulnerable servers. Some attack methods may pose a higher risk of damaging
