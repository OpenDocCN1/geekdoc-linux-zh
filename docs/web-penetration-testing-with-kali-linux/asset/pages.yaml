    # Exploiting the e-mail systems


    By nature, all the e-mail systems sit on the Internet and allow external anonymous
    access from the outside world to be productive. Users in many organizations send
    sensitive information over e-mail. In most environments, e-mail servers hold valuable
    information making them high priority target for attackers. The good news for
    consumers is that properly configured e-mail systems are extremely difficult to
    exploit. This does not mean e-mail systems are not vulnerable to attacks since
    most e-mail systems use web applications and are accessed through a web interface.
    This promotes the possibility of a remote attacker gaining access to a core system
    that could be leveraged as a jumping point to other systems.'
  merge: -1
