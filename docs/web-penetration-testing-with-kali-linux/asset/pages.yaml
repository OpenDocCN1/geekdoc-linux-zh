  md: '# 2 Reconnaissance


    The term **Renaissance** by definition comes from the military warfare strategy
    of exploring beyond the area occupied by friendly forces to gain information about
    the enemy for future analysis or attack. Reconnaissance of computer systems is
    similar in nature, meaning typically a Penetration Tester or hacker will attempt
    to learn as much as possible about a target''s environment and system traits prior
    to launching an attack. This is also known as establishing a Footprint of a target.
    Reconnaissance is typically passive in nature and in many cases not illegal (however,
    we are not lawyers and cannot offer legal advice) to perform as long as you do
    not complete a three-way handshake with an unauthorized system.


    Examples of Reconnaissance include anything from researching a target on public
    sources such as Google, monitoring employee activity to learn operation patterns,
    and scanning networks or systems to gather information, such as manufacture type,
    operating system, and open communication ports. The more information that can
    be gathered about a target brings a better chance of identifying the easiest and
    fastest method to achieve a penetration goal, as well as method to avoid existing
    security. Also, alerting a target will most likely cause certain attacks to close
    as a reaction to preparing for an attack. Kali''s official slogan says this best:


    > "The quieter you become, the more you are able to hear"


    Reconnaissance services should include heavy documentation, because data found
    may be relevant at a later point in the penetration execution. Clients will also
    want to know how specific data was obtained, and ask for references to resources.
    Examples are what tools were used to obtain the data or what publicfacing resources;
    for example, the specific search query in Google that was submitted to obtain
    the data. Informing a customer "you obtained the goal" isn''t good enough, because
    the purpose of a Penetration Test is to identify weakness for future repairs.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Reconnaissance objectives


    +   * Target background: What is the focus of the target''s business?

    * Target''s associates: Who are the business partners, vendors, and customers?

    * Target''s investment in security: Are security policies advertised? What is
    the potential investment security, or security user awareness?

    * Target''s business and security policies: How does the business operate? Where
    are the potential weaknesses in operation?

    * Target''s people: What type of people work there? How can they become your asset
    for the attack?

    * Define targets: What are the lowest hanging fruit targets? What should be avoided?

    * Target''s network: How do the people and devices communicate on the network?

    * Target''s defenses: What type of security is in place? Where is it located?

    * Target''s technologies: What technologies are used for e-mail, network traffic,
    storing information, authentication, and so on? Are they vulnerable?


    Kali Linux contains an extensive catalog of tools **Information Gathering** specified
    for Reconnaissance efforts. It could fill a separate book to cover all tools and
    methods offered for Information Gathering. This chapter will focus on various
    web application Reconnaissance topics and relate the best tools found on the Internet
    as well as that offered by Kali Linux.


    # Initial research


    Reconnaissance should begin with learning as much as possible about people and
    business associated with the target. *Sun Tzu* is credited with the phrase, "know
    your enemy" in the book, *The Art of War*. As a Penetration Tester, you need to
    know your target. If your target happens to be a website, you should look at all
    aspects of that website. It will give you a better understanding of how the site
    is maintained and run. Great Reconnaissance returns more possibilities.


    It is scary how much information is available on public sources. We have found
    the unimaginable, such as classified documents, passwords, vulnerability reports,
    undesirable photography, and access to security cameras. **Many Penetration Testing
    project objectives start with leveraging information off public sources.** Here
    are some starting points for gathering information from public sources.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Company website


    There is a lot of valuable information that can be obtained from a target''s website.

    Most corporate websites list their executive team, public figures, and members
    from recruiting and human resources contacts. These can be targets for other search
    efforts and social engineering attacks.


    More valuable information can be obtained by looking at what other companies are
    listed as partners, current job positions, business information, and security
    policies. Reconnaissance on a high-valued partner can be as important as the primary
    target, because partners may provide a new source for obtaining intelligence.
    An example is compromising a contracted resource that manages the helpdesk at
    a target''s headquarters.


    The Robots.txt file is publicly available and on websites that gives instructions
    to web robots (also known as search spiders), about what is and not possible using
    the Robots Exclusion Protocol. The Disallow: / statement tells a browser not to
    visit a source; however, a Disallow can be ignored by a researcher intelligence
    on what a target hopes to disclose to the public.


    To view find the Robots.txt file in the root directory of a target website. For
    example, adding the Robots.txt file to Facebook would look like shown in the following:


    ```

    ← https://www.facebook.com/robots.txt


    # Notice: if you would like to crawl Facebook you can

    # contact us here: http://www.facebook.com/apps/site_scraping_tos.php

    # to apply for white listing. Our general terms are available

    # at http://www.facebook.com/apps/site_scraping_tos.php


    User-agent: baidususpider

    Disallow: /ac.php

    Disallow: /ae.php

    Disallow: /ajsx/

    Disallow: /album.php

    Disallow: /ap.php

    Disallow: /autologin.php

    Disallow: /checkpoint/

    Disallow: /feeds/

    Disallow: /l.php

    Disallow: /o.php

    Disallow: /p.php

    Disallow: /photo.php

    Disallow: /photo_comments.php

    Disallow: /photo_search.php

    Disallow: /photos.php

    Disallow: /share.php

    Disallow: /sharer/

    ```'
