- img_proc: true
  md: '# Server-side Attacks


    The next three steps will configure IP forwarding, arspoof redirection, and configure
    port redirection. all commands are the executed from command-line terminal. Enabling
    IP Forwarding:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    ```

    root@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    For the purposes of this example, we will need to know the victim/target host''s
    IP address. This is to avoid contention and ARP address flooding to the entire
    network by all the attack hosts. In a real attack scenario, it might be ideal
    to run arspoof against the entire layer 2 segment (this is the default if the
    victim''s ip is omitted) and/or utilize packet capturing and sniffing in order
    to determine the victim IP. In an environment with many hosts this might cause
    the flow of traffic to slow and potentially jeopardize the attacker''s ability
    to remain unnoticed. The command is:


    ```

    arspoof -i eth0 -t victimip default_gateway_ip

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_141_0.png)


    It is recommended that you do not send this process to the background and leave
    the window up. Just start a new terminal session.


    # Setting up port redirection using iptables


    This enables the attacker to grab traffic destined for an HTTP server on TCP 80
    and redirect to the SSL strip listener port. In this example, redirection will
    be on TCP 10000 for both destination port and redirect destination. The attacker
    can use any applicable value. The redirect destination here must also be used
    for setting the listener port for SSL strip. The command is as follows:


    ```

    iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-ports
    10000

    ```'
