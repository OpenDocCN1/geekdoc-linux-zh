    middleware, such as databases. Therefore, they may not be appropriate in all Penetration
    Testing environments.


    +   * **WebCopier**: It is a tool that clones a website for offline evaluation,
    such as Penetration Testing.

    * **w3mir**: It is an all purpose HTTP copying and mirroring tool. The main focus
    of w3mir is to create and maintain a browsable copy of one, or several, remote
    WWW sites.


    # # Man-in-the-middle defense


    Man-in-the-middle attacks are difficult to protect against. The attack happens
    outside the victim''s controlled environment, and when executed properly, doesn''t
    leave an obvious signature that alerts the victims involved. MITM is typically
    the first step of a more sinister attack such as SSL strip. One common way to
    protect against MITM is ensuring websites use SSL/TLS 3.0. In other words, make
    sure the websites are accessed using HTTPS or HTTP secure connections. Verifying
    HTTPS is not as easy as looking for a little green address bar, because attackers
    can serve victims certificates to make it appear like the session is secure.'
