    ### The Social-Engineer Toolkit (SET) Report Generator

    #### Report generated by the Social-Engineer Toolkit


    Welcome to the Social-Engineer Toolkit Report Generator. This report should contain
    information obtained during a successful phishing attack and provide you with
    the website and all of the parameters that were harvested. Please remember SET
    is open-source, free, and available to the information security community. This
    tool is for good, not evil.


    When using tools such as SET to attack clients, it is important for a Penetration
    Tester to understand the behavior of the clients. One of the most efficient ways
    to do this is by using a proxy to examine and inspect web requests.


    In Chapter 6, Web Attacks, we will look at Proxies in much greater detail; however,
    it is still important to learn how to examine how the client is behaving when
