  md: '# Defensive Countermeasures


    Up until this chapter, we have covered how to use Kali Linux to compromise targets.
    Now it is time to switch gears and become the defender with the goal of avoiding
    being compromised by methods we have demonstrated as well as other forms of attack.
    Defending an Internet-facing resource is extremely difficult, based on being exposed
    to the entire world through public access, mixed with the operations requirement
    of not being able to impact service to trusted users at a cost of security. It
    is absolutely critical to include security in the entire lifecycle from conception
    to termination of anything public facing, rather than considering security as
    an afterthought. This will not only reduce the risk of threats against the service,
    but also likely be less expensive to remediate in the event of a cyber incident.


    It is common knowledge that there are bad people attacking systems on the Internet,
    regardless of the nature of the business. As a defensive counter measure, organizations
    put their trust in solutions for defense from these cyber threats. The problem
    with this strategy is the vendor is not the victim of an attack and doesn''t absorb
    damages from a cyber incident. Vendors will offer protection; however, they can''t
    be responsible for anything outside their product''s control. All it takes is
    a missing update, configuration error, or millions of situations that can cause
    a breach for which the vendor will not be liable. Plus, many organizations leverage
    multi-vendor solutions that don''t share security intelligence, making it possible
    for liability to be passed and forth between vendors. For these reasons and more,
    we recommend the customer take ownership of the responsibility to protect assets
    by hardening systems from threats.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Defensive Countermeasures


    Kali Linux is a leading Penetration Testing tool that can be used to identify
    where systems are vulnerable to attack. Rather than attacking a target, we recommend
    Penetration Testing your own network assets to identify vulnerabilities before
    a malicious intent beats you to.


    > "If you know the enemy and yourself, you need not fear the result of a hundred
    battles. If you know yourself but not the enemy, for every victory gained you
    will also suffer a defeat. If you know neither the enemy nor yourself, you will
    succumb in every battle"


    We believe the same foundational concepts are true; you know it''s happening,
    and Kali Linux to know yourself, and know your weakness.


    The advantage you have is you know it''s happening, and you can use extreme measures
    without the worry of triggering alarms. Typically, hackers will not risk exposing
    themselves, reducing their options for attack. Stealth requires patience, minimal
    touch to the target and lots of planning. It is up to you to capitalize on your
    ability to invest proper time and resources into security before somebody invests
    more into bypassing it. A common saying from the authors of this book is "99 percent
    secure is 100 percent insecure".


    This chapter will provide different methods of using Kali Linux to audit your
    web applications for common vulnerabilities, as well as other best practices for
    hardening your network. We will cover security baselines, patch management, password
    policies, and defending against attack methods, covered in previous chapters.
    This chapter will also include a focused section on using Kali Linux in a forensic
    investigation. Forensics is important after identifying that your web application
    or other assets have been compromised, to avoid future impact.


    # Testing your defenses


    As explained in the introduction, the best approach for hardening your defense
    is attacking your existing security controls with the goal of identifying weakness.
    Some key concepts to consider when developing a strategy for testing your security
    defenses are as follows:


    +   - Black, white, or gray hat approach?

    - Test a copy or the real system?

    - Possible risks from Penetration Test?

    - Who should be informed?'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 7


    +   * Are you testing detection and response to threats or focusing on identifying
    vulnerabilities?

    * Are any compliance standards being considered?


    Let''s look at establishing a plan for validating our security. We first need
    to know our baseline for security, so what we know to validate against.


    # Baseline security


    One common question asked by industry experts is what should be the minimal acceptable
    level for security. Many organizations must be in compliance with mandates by
    their industry and government. Any system accepting payments must adhere to the
    Payment Card Industry Data Security Standard (PCI DSS). Healthcare environments
    must meet Health Insurance Portability and Accountability (HIPAA) Common mandates,
    as these are covered in Chapter 8, Penetration test Executive Report, are popular
    business drivers for showing value for Penetration testing services.


    Outside of mandates, a good starting place for establishing a baseline for security
    is reviewing how other agencies secure their systems. As security consultants
    for American customers, we identify how the United States government secures sensitive
    information as an example for baseline security. Most US-based organizations would
    be interested in having similar security standards as the White House. This same
    concept can be applied to other country IT standards, specific organization security
    best practices, or recommended military security controls. There are also best
    practices for security standards published from organizations made up of vendors
    and industry leaders, such as the International Organization for Standardization
    (ISO).


    Let''s take a look at the United States baseline security of anything accessing
    a government-controlled network.


    > Your baseline for security should be the absolute minimal level of security
    used in your environment. Best practice is securing systems beyond the baseline,
    because most documented security baselines are limited, due to date published,
    influence from funding parties, and other elements.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Defensive Countermeasures


    # STIG


    A Security Technical Implementation Guide (STIG) is a methodology for standardized
    secure installation and maintenance of computer software and hardware. This term
    was coined by the Defense Information Systems Agency (DISA), which creates configuration
    documents in support of the United States Department of Defense (DOD). The implementation
    guidelines include recommended administrative processes and security controls
    used during the lifecycle of the asset.


    An example where STIGs would be of benefit is in the configuration of a desktop
    computer. Most operating systems are not inherently secure, leaving them vulnerable
    to criminals. A STIG describes how to minimize network-based attacks and prevent
    system access when the attacker is present at the device. STIGs also describe
    maintenance processes, such as software updates and vulnerability patching.


    STIGs are great guidelines to secure operating systems, network devices, and applications.
    You can download STIG guidelines from http://www.stigviewer.com/stigs. You will
    find STIG documents contain step-by-step guides for hardening a variety of systems,
    including web servers. In addition, STIG guidelines are a starting point for configuring
    systems to meet several regulatory compliance standards. For United States federal
    employees, STIGs are required for systems in networks controlled by the Department
    of Defense and other government organizations.


    > There are many other resources available for finding security standardization
    templates. Examples are the Center for Internet Security (CIS) and Cisco Network
    Foundation Protection (NFP).


    # Patch management


    With targeted attacks and zero-day vulnerabilities reducing the window of time
    between when a vulnerability is disclosed and attackers develop an exploit, it''s
    becoming more incumbent on security managers to understand the assets in their
    IT environment, and the patch levels of those systems. Patch management is an
    ongoing process and can only be successful if there is a method to identifying
    when a patch is available, prioritize when to implement the patch, validate it
    regarding business compliance, and how to react when a patch is not available
    for a known vulnerability. This also applies to applications within systems and
    software such plugins.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '![](img/df1fdcde66c92c1fef83bd651dd5ffe3_272_0.png)


    Patch management is just one aspect of the larger vulnerability lifecycle. The
    first step is identifying vulnerabilities, which can be done through vendor updates
    or services that range from periodic scanning to hardcore Penetration Testing.
    There should be a policy that explains how different levels of scans are performed
    as well as who is responsible for review threats that are found. A good starting
    point for establishing a baseline for how often to scan for vulnerabilities is
    reviewing what regulatory compliance standards you must follow, as many include
    language around internal and external vulnerability scanning.


    The second step for patch management is reacting to systems identified as vulnerable.
    As explained in Chapter 1, Penetration Testing and Setup, being vulnerable does
    not necessarily mean there is a risk unless the vulnerability is validated through
    exploiting a Penetration Test or other method. Securing a vulnerability could
    simply require a patch or upgrade; however, some vulnerabilities may require more
    investment in time and labor to remediate. Calculating the risk associated with
    investment to remediate comes into play for these situations.


    The final step in patch management is scheduling the patch as it pertains to how
    critical the vulnerability is to business operations. It is a key, as many compromised
    systems could have been safe if they were patched prior to being identified by
    a malicious party. We find many of our customers have maintenance windows scheduled
    on a monthly or longer basis for patch management, that leaves a large window
    of time for exposing the system becomes vulnerable to attack. Best practice is
    assigning an Information Assurance Specialist the responsibility of calculating
    the risk associated with systems identified as vulnerable, as well as having the
    authority to trump maintenance windows when a threat reaches a certain level of
    risk to business operations.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Defensive Countermeasures


    Patch management is one of the best defense strategies for avoiding many of the
    threats presented in this textbook. Make sure to revisit how your organization
    handles patch management periodically to avoid being a victim of exposing a vulnerable
    system that could have been secured. This should apply to all managed assets,
    including servers and web applications.


    # Password policies


    In general, having a policy that controls the possible outcomes can negatively
    impact the strength of passwords. Regardless of the policy, users will use human
    nature, to simplify passwords anyway by using repeating characters, predictable
    behavior, such as using 12345 to extend the length of a password, or other means.
    Users will also typically change passwords unless forced by a system. For reasons,
    a password policy should follow the following guidelines:


    +   - Have an expiration that is under 90 days

    - Not permit the last five passwords as replacements

    - Enforce a length of at least 12 characters

    - Not limit any characters, such as special characters

    - Mandate at least one uppercase, number, and special character

    - Warn or deny repeating digits such as 12345 or asdfg to avoid brute-force attacks


    > Computer processing is constantly improving, meaning 12 character passwords
    will not be strong in the near future. A recent article published in spring 2013,
    stated a team of hackers cracked more than 14,800, 16-character cryptographically
    hashed passwords from a list of 16,449. This is a special case at the time of
    publishing; however, it will be the common longterm for future hackers. Consider
    the recommended length of a password a moving target.


    The authors of this book are fan of password generator by Steve Gibson, as a method
    of generating random passwords. The secure random password generator by Steve
    Gibson can be found at the Gibson Research Center at: https://www.grc.com/passwords.htm.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '> Many websites and web applications are compromised, because developers implemented
    poor security protocols. Web developers should use strong encryption to store
    user passwords and data. Passwords implement hashing and salting techniques to
    further mitigate risks in stolen or lost data.


    You can evaluate the strength of passwords used on your systems leveraging password-cracking
    tools covered in Chapter 3, Server Side Attacks, and Chapter 4, Client Side Attacks
    of this textbook. Suggested tools are John the Ripper, Johnny, Hashcat, oclHashcat,
    and Ophcrack. Crunch and Hashcat can also be used to generate password lists that
    can validate the strength of your password policy.


    > There are websites available, such as Crackstation, that offer pre-generated
    lists of popular passwords. You could use these lists to test the strength of
    your passwords and policies.


    # Mirror your environment


    Before testing a system against a recommended security setting, checking for vulnerabilities,
    or validating a vulnerable system through exploitation, it may make sense to clone
    your system for testing purposes, rather than testing the real system. Best practices
    are replicating everything from the hardware hosting the web application to all
    content because vulnerabilities can exist in all technology layers. Testing a
    cloned environment will give the Penetration Tester freedom to execute any degree
    of attack while avoiding negative impact to operations. Although most people cannot
    mirror the exact environment, it is possible to set up a virtual environment with
    the same functionality.


    # HTTrack


    HTTrack is a free offline browser utility. HTTrack allows you to download a website
    from the Internet to a location directory, build all directories, capture HTML,
    images, and other files from the server and store them on your computer. You can
    browse the cloned website link-to-link, as well as test it for vulnerabilities.
    HTTrack is an extremely simple tool to work with basic websites. It will not replicate
    dynamic content, nor will it replicate website middleware, such as databases.
    Therefore, it may not be appropriate in all Penetration Testing environments.'
