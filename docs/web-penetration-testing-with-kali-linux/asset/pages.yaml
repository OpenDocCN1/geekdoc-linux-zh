  md: '# Client-side Attacks


    The term client or host means an endpoint used to connect to a network, such as
    a computer, a tablet, or a mobile device. A client may offer information, services,
    and applications to other clients or obtain information from another system, such
    as a server. Typically, the term client refers to endpoints used by people. Having
    involved opens a range of possible vulnerabilities.

    abilities exist on those systems, and whether those systems can be a means to
    gain access or information from a web application. The focus of this chapter will
    be identifying systems accessing web applications, evaluating systems for vulnerabilities,
    and exploiting those vulnerabilities, if possible. This chapter will focus heavily
    on compromising passwords, as they are the most common methods used to secure
    host systems.


    This chapter will kick-off by covering how to attack hosts using social engineering.
    Later, we will look at how to identify vulnerabilities on host systems so that
    you can exploit those vulnerabilities using tools covered in other sections of
    this book. We will conclude with attacking passwords, because they are the most
    common means to secure host systems.


    # Social engineering


    Humans will always be your weakest links for a target''s security posture. The
    more you try to control the end users, the more they will try to bypass policies.
    The less controls you put in place, the less likely that the policies will be
    followed. This creates a double-edge sword when deciding how to protect end users
    from cyber threats. Hackers know this and target end users in various ways that
    focus on compromising a key characteristic of the average user, which is trust.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Social engineering is the art of manipulating people into performing actions
    of divulging information. Many client-side attacks are based on tricking an end
    user into exposing their systems to an attack. Social engineering can range from
    calling somebody while pretending to be an authorized employee to posting a link
    on Facebook that claims to be a service while really being a means to compromise
    the client.


    Best practices for launching a successful social engineering attack is taking
    the time to understand your target; learn how the users communicate and attempt
    to blend into their environment. Most social engineering attacks that fail to
    be written in a generic format, and they don''t include a strong hook to attract
    the victim, as po a poorly written e-mail claiming the user is entitled to unclaimed
    funds. Using social media sources such as Facebook is a great way to learn about
    a target, as what hobbies and speaking patterns targets favor. For example, developing
    traps based on discounted sports tickets would be ideal if a Facebook profile
    of a target is covered with the sports team logos.


    Because most client-side attacks leverage social engineering, the next section
    will explore a popular social engineering arsenal available in Kali.


    # Social Engineering Toolkit (SET)


    The Social Engineer Toolkit (SET) was created and written by the founder of TrustedSec.
    It is an open-source Python-driven tool aimed at Penetration Testing using social
    engineering, SET is an extremely popular tool used by security professionals to
    test an organization''s security posture. Real-life attackers use SET to craft
    active and malicious attacks. It is the tool of choice for the most common social
    engineering attacks.


    To launch SET, go to the following link of the menu bar Exploitation Tools | Social
    Engineering Tools, and select se-toolkit.


    The first time you launch SET on Kali, SET will display the SET distribution updates
    directly from GitHub. You will be presented with the option of receiving updates
    automatically. Select yes to receive automatic updates.'
