    # Owasp-Zap


    Owasp-Zap also known as Zaproxy is an intercept proxy designed for the security
    testing of web applications.


    Open Zaproxy by going to Web Applications | Web Application Fuzzers and selecting
    owasp-zap. There will be a declaimer pop-up that must be accepted to the program.


    Upon accepting the license disclaimer, Owasp-Zap will open and display another
    pop-up asking if you would like to create an SSL Root CA certificate. This allows
    Zaproxy to intercept HTTPS traffic over SSL in a browser. This is important to
    test aspects that use HTTPS. To generate an SSL certificate, click on the Generate
    button.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_106_1.png)


