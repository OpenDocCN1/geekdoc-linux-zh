  md: '# Skipfish


    Skipfish is a web application security Reconnaissance tool. Skipfish prepares
    an interactive sitemap for the target using recursive crawl and dictionary-based
    probes. The resulting map provides output after being scanned by security checks.


    Skipfish can be found under Web Applications | Web Vulnerability Scanners as skipfish.
    When you first open Skipfish, a Terminal window will pop showcasing the Skipfish
    commands. Skipfish can use built-in or customizable dictionaries for vulnerability
    assessment.


    +   Note that some dictionaries may not be found in Kali. You can download the
    latest version of Skipfish and default dictionaries from https://code.google.com/p/skipfish/


    The available dictionaries are located in the dictionary file.


    ```

    root@kali:~/Desktop/skipfish-2.0/dictionaries#1

    complete.wl extensions-only.wl medium.wl minimal.wl

    ```


    There are various command options available in Skipfish. To run Skipfish against
    a target website using a custom wordlist, enter skipfish, select your wordlist,
    select your output directory using the -o followed by the location, and finally
    the target website.


    Skipfish -o (output location) -W (location of wordlist) (target website)


    The following example shows a scan using a wordlist called complete.wl on securityblogger.com.
    Skipfish will create a folder called Skipfishoutput on the desktop. This is run
    using the keyword skipfish, -o /root/Desktop/Skipfishoutput to specify the location
    to which send the output, -W /root/Desktop/complete.wl to specify the location
    of the dictionary and http://www.thesecurityblogger.com as the target to scan.


    ```

    root@kali:~# skipfish -o /root/Desktop/Skipfishoutput -W /root/Desktop/complete.wl
    http://www.thesecurityblogger.com

    ```'
