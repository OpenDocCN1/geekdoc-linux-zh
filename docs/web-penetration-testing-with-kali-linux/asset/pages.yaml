    # # Nmap


    Nmap stands for Network Mapper, and is used to scan hosts and services on a network.
    Nmap has advanced features that can detect different applications running on systems
    as well as services and OS fingerprinting features. It is one of the most widely
    used network scanners making it very effective, but also very detectable. We recommend
    using Nmap in very specific situations to avoid triggering a target''s defense
    systems.


    For more information on how to use Nmap, http://nmap.org/


    Additionally, Kali comes with Zenmap. Zenmap gives Nmap a graphical user interface
    (GUI) to run commands. Although there are many purists who will tell you the command-line
    version is the best version of its speed and flexibility, Zenmap has come a long
    way and has incorporated most of the Nmap features. Zenmap also offers exclusive
    features not offered in Nmap, such as developing graphical representations of
    a scan, which can be used later by other reporting systems.'
