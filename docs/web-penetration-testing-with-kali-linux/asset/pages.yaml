  md: 'Encrypted Virtual Private Network (VPN) is another way of protecting against
    man-in-the-middle attacks. By encrypting all data sent to and from your device
    while masking your public Internet Protocol (IP) address, encrypted VPNs ensure
    you''re on a network that cannot be monitored or recorded by anyone except the
    VPN provider.


    VPNs can use strong authentication methods, such as two-factor authentication,
    which includes a username and password, along with some other forms of authentication,
    such as OTP (one-time passwords), tokens, or certificates. This makes it difficult
    for an attacker to steal the authentication required to establish a VPN by another
    user.


    VPNs have the ability to use encryption methods, such as PPTP, L2TP, SSL, and
    IPSec. SSL and IPSec VPNs provide higher-level security for guarding data compared
    to other protocols because of their use of strong encryption protocols.


    > VPNs are provided by both public and private organizations. It is possible that
    the VPN provider may be able to examine your traffic, because they are the trusted
    service providers. Therefore, the question of trust is a very important concept
    when using a VPN. You must ask if your VPN provider to protect your data and privacy.
    Your data security is in the service provider''s hands.


    Other techniques that can be used to defend against MITM attacks are Media Access
    Control Security (MACsec) and 802.1x. These approaches use advanced networking
    to provide source authentication, data integrity, and encryption as traffic travels
    across the network. Both approaches require equipment compatibility and must be
    enabled properly in order to be effective.


    # SSL strip defense


    SSL strip (covered in Chapter 3, Server Side Attacks), allows attackers to strip
    or tear away the encrypted portion of a website and view the victim''s Internet
    session, including confidential information. It is common to link SSL strip with
    another attack, such as man-in-the-middle, meaning hackers will capture all traffic
    and strip away SSL encryption so everything is visible to the hacker''s traffic
    sniffing tools. We de cover this concept in Chapter 5, Attacking Authentication,
    of this textbook.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Defensive Countermeasures


    To protect against SSL strip attacks, it is important to understand how SSL strip
    exploits a victim. The attack takes advantage of websites redirecting users from
    a non-encrypted version of the site, to an encrypted version of the site. When
    you navigate to http://www.facebook.com or http://www.gmail.com, you will notice
    you are redirected to https://www.facebook.com SSL strip breaks the redirection
    and forces the victim to use the non-secure version of the website. Furthermore,
    even if the site does not have a non-secure version, but has a redirect, SSL strip
    will intercept the HTTP request and forward the user to HTTPS site. When a victim
    does this, the attacker can view the victim''s entire session.


    One method to protect against SSL strip attacks is to ensure that websites do
    not have a non-secure version of itself and that do not implement redirect features.
    This would prevent a SSLstrip attack, because there is no redirection possibility.
    When a victim is attacked, they will simply not be able to get to a website. We
    understand from a real world standpoint that this is very difficult to enforce.
    People are used to using a non-secure HTTP request and being automatically redirected
    when security is needed. Also, many businesses would not want thinking their website
    is down to not accessing a secure version of the website. The best protection
    from SSL strip is educating users on how cyber attacks occur so they can identify
    them.


    In addition, the defense methods we outlined earlier against man-in-the-middle
    will also defend against SSL strip attacks. The reason for this is SSL strip relies
    on a man-in-the-middle attack to occur.


    # Denial of Service defense


    Most Distributed or Denial of Service (DoS/DoS) tools are open source utilities
    written in C# or Java. We demonstrated in Chapter 6, Web Attacks, how a single
    person using a DoS tool can have a devastating impact to a business by limiting
    access to online sources or taking down a website. DDoS/DoS tools are advertised
    as web application stress-testing tools. Although they could potentially be used
    for, in many cases they are used for nefarious purposes.


    DDoS/DoS attacks in most cases require robust network infrastructure hardware.
    One of the common methods to defend against DDoS/DoS is configuring network devices
    that can handle large influx of packets, the ability to detect anomalous behavior,
    and traffic patterns. Malicious traffic identified should be automatically filtered
    to avoid interruption of service. Tools from vendors, such as load-balancers and
    web application firewalls, do a great job of detecting and defending against volumetric
    and application-type attacks. Security tools with DoS detection capabilities are
    able to recognize network, session, and application layer traffic, which is imported
    for mitigating DoS risks that can exist at all layers of the protocol stack.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Chapter 7


    To defend against sustained and prolonged attacks, many organizations turn to
    DDoS application service provider. A DDoS application service provider works with
    your ISP and attempts to stop DDoS from reaching your network by redirecting traffic
    away from your organization. They do this by using protocols, such as BGP and
    advanced DNS techniques.


    Most DDoS/DoS attacks spoofed or invalid IP addresses when attacking an organization.
    Network administrators should deploy Unicast Reverse Path Forwarding (UCPF) on
    their Internet-facing border routers as a protection mechanism against spoofing
    of IP source addresses used to launch DDoS attacks. UCPF is considered best practices
    for Internet-edge facing routers, and a good start to defend against DDoS/DoS.
    UCPF is configured at the interface level on Cisco routers. Other enterprise manufactures
    may have similar features on their routers as well. When UCPF is configured, non-verifiable
    or invalid addresses will be dropped.


    A more recent technique to identify DDoS/DoS traffic is leveraging Netflow in
    conjunction with access lists to stop the traffic from entering the network as
    well as identifying internal attacks. Traffic behavior is analyzed and any indication
    that the network seeing malicious traffic will trigger alarms as Smurf or Teardrop
    packets. Leading DDoS/DoS solutions offer the ability to monitor for both internal
    and external DDoS/DoS threats.


    # Cookie defense


    As we discussed in earlier chapters, cookie hijacking is a technique where an
    attacker steals session cookies. Cookie hijacking can be defeated if your website
    is running SSL/TLS 3.0. Many attackers will bypass SSL/TLS by using a combination
    of man-in-the-middle and SSL strip attacks; however, by ensuring your web application
    only has secure pages, not providing a launch HTTP to HTTPS redirection, will
    mitigate those forms of attack.


    > Cookie hijacking can work over SSL/TLS connections as attackers use cross-site
    scripting to send cookies to their servers. Developers can mitigate this risk
    by setting the Secure and HttpOnly flags on the cookies.


    A common mistake regarding web security is assuming developers secure the entire
    session rather than just the authentication portal to a web application. When
    the entire session is not secured, a user possibly be attacked. Developers must
    ensure their entire application supports secure and encrypted web sessions through
    SSL/TLS 3.0 to avoid being vulnerable to attack.


    [ 263 ]'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'Additional defense against cookie hijacking is available with popular Application
    Delivery Controller (ADC) appliances, such as load balancers and content filters.
    Popular vendors to consider are Cisco, Bluecoat, Riverbed, Websense, and many
    others. Most of these vendors change cookie flags to Secure and HttpOnly. They
    also have built in propriety techniques to mitigate some cross-site scripting
    attacks.


    # Clickjacking defense


    Clickjacking was covered in Chapter 5, Attacking Authentication, and is the technique
    where an attacker tricks a user into clicking on something other than what they
    believe they are clicking on. One of the best ways to protect clickjacking is
    by running the noscript extension for Firefox or Chrome browsers. This will prevent
    unauthorized code from running in your web browser. Noscript can detect unauthorized
    scripts, alert the user of the script and prevent the script from running. Users
    have the ability to turn off scripting controls globally per session or per website.


    The authors of this book are big fans of noscript; however, you should encourage
    web developers to set up X-Frame-Options header in HTTP responses to mitigate
    this risk in web applications. Furthermore, some application delivery controller
    appliances (ADCs), give administrators the option of writing custom scripts that
    can also help mitigate this risk.


    > Some websites may have legitimate reasons to run a script. This could be for
    shopping carts or other e-commerce sites.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_281_0.png)'
