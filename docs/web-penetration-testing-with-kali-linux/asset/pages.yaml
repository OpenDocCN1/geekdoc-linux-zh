  md: '# Chapter 1


    A Penetration Testing engagement''s success for a service provider is based on
    profitability of time and services used to deliver the Penetration Testing engagement.
    A more efficient and accurate process means better results for less services used.
    The higher the quality of the deliverables, the closer the service can meet customer
    expectation, resulting in a better reputation and more secure future. For these
    reasons, it''s important to develop a methodology for executing Penetration Testing
    services as well as for how to report what is found.


    # Kali Penetration Testing concepts


    Kali Linux is designed to follow the flow of a Penetration Testing service engagement.
    Regardless if the starting point is White, Black, or Gray box testing, there is
    a set of steps that should be followed when Penetration Testing a target with
    Kali or other tools.


    # Step 1 – Reconnaissance


    You should learn as much as possible about a target''s environment and system
    traits prior to launching an attack. The more information you can identify about
    the target, the better chance you have to identify the earliest and fastest path
    to success. Black box testing requires more reconnaissance than White box testing
    since data is not provided about the target(s). Reconnaissance services can include
    researching a target''s Internet footprint, monitoring resources, people, and
    processes, scanning for network information such as IP addresses and systems types,
    social engineering public services such as help desk and other means.


    Reconnaissance is the first step of a Penetration Testing service engagement regardless
    if you are verifying known information or seeking new intelligence on a target.
    Reconnaissance begins by defining the target environment based on the scope of
    work. Once the target is identified, research is performed to gather intelligence
    on the target such as what ports are used for communication, where it is hosted,
    the type of services being offered to clients, and so on. This data will develop
    a plan of action regarding the easiest methods to obtain results. The deliverable
    of a reconnaissance assignment should include a list of all the assets being targeted,
    what applications are associated with the assets, services used, and possible
    asset owners.


    Kali Linux offers a category labeled Information Gathering that serves as a Reconnaissance
    resource. Tools include methods to research network, data center, wireless, and
    host systems.'
