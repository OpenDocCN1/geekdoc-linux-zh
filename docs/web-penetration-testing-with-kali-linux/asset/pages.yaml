- img_proc: true
  md: '# Penetration Test Executive Report


    How you present results will be the most influential and determining factor for
    future business. Once you get familiar with a writing style, there are more appropriate
    styles and flows associated with technical audits. This includes industry standards
    that come from PCI and other industry specific organizations, such as CoBIT and
    ITIL. Ultimately, the theme of your report will follow the accepted standards
    of corporate governance for the organization you are auditing. Also keep in mind
    that a penetration report will be seen by many people, and referred to for a much
    longer period of time than you intended.


    Customers want to know how vulnerable they are, and requirements to patch gaps
    so that they reduce their overall security risk from attack. Formatting and tone
    of a report can cause a negative reaction or damage to data. Jobs could be over
    being linked to a vulnerability. On the contrary, a critical gap in security could
    be ignored if the language from a report doesn''t properly highlight how essential
    a fix is needed. The best service provides balance and technical competencies
    when developing executive reports the final results will positively impact leadership
    and technical staff.


    A good starting point is looking at what regulations, standards, and mandates
    are important to your customer. Mixing customer requested requirements with industry
    mandates is the first topic of this chapter. Next, we will look at the different
    service models used to charge for delivery services. After that, we will focus
    on the different types of document formatting for executive reports so you can
    leave the proper impression post service engagement. This chapter will conclude
    with some reports and cover the remaining reporting tools available in Kali Linux.


    # Compliance


    Customers have limited budgets and typically, security is not a top spending objective
    requiring proactive purchasing. In our experience, customers will spend money
    on other technology areas until something bad happens causing spending. It becomes
    even more challenging to offer services that evaluate security such as a Penetration
    Test when many customers have enough trouble maintaining existing gear as well
    as keeping up with the latest technology. A simple analogy is when people purchase
    a laptop, they look at what software to install for functionality rather than
    defense (that is, purchasing Microsoft Word rather than Antivirus). When that
    same laptop becomes infected, users stop thinking about functional software and
    prioritize security software to remove the malicious application.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Chapter 8


    One method to elevate your services to the top of the purchasing priority list
    is aligning with business mandates. Customers are more prone to purchase services
    meeting business obligations, making the investment conversation easier to justify.
    Many industry mandates have severe repercussions for failing audits that range
    from fines to job termination. Aligning your deliverables with mandated regulations
    is a strong option to justify procuring your services.


    Terms that are important regarding industry compliance are follows:


    +   * **Baselines**: They are used to create a minimum level of security necessary
    to meet policy requirements. Baselines can be configurations, architectures, or
    procedures that might or not reflect the business process, but can be adapted
    to meet those requirements. You can use baselines as an abstraction to develop
    standards.


    +   * **Standards**: They are mandatory requirements that support higher-level
    policies. A standard may require the use of a specific technology including brand,
    product, and protocol. An example is creating a standard for 802.1x using Cisco
    Identity Services Engine from a baseline of having a form of automated access
    control.


    +   * **Guidelines**: They are recommendations rather than required. Consider
    guidelines similar to standards; however, nothing forces people to follow them.
    An example is controlling which ports to open in a firewall rather than using
    the allow all traffic rule.


    # Industry standards


    There are many important industry standards that your customers are mandated to
    follow. The following list is commonly used to justify procurement of funding
    for products and services:


    +   * **Health Insurance Portability and Accountability Act (HIPAA)**: It requires
    proper controls are in place to ensure health care transactions and administrative
    information systems protect individually identifiable electronic health information.
    There is a low risk of fines associated with HIPAA non-compliance; however, significant
    collateral risks, such as civil liability and brand damage could result from not
    meeting HIPPA requirements.


    +   * **Federal Information Processing Standards (FIPS)**: They are U.S. computer
    security standards developed to protect information transmitted by government
    agencies and contractors.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '+   Federal Information Security Management Act (FISMA) / National Institute
    of Standards and Technology (NIST): The FISMA and NIST special publications 800-153
    and 800-137 provide a comprehensive framework for ensuring the effectiveness of
    information security controls over resources that support federal operations and
    assets.


    +   North American Electric Reliability Corporation (NERC): It has developed mandatory
    Critical Infrastructure Protection (CIP), security standards to protect the Critical
    Infrastructure Assets that control or affect the reliability of North American
    bulk electric systems. Approved by the Federal Energy Regulatory Commission (FERC),
    compliance with these standards is mandatory for all organizations with the country''s
    bulk electrical network.


    +   Payment Card Industry Data Security Standard (PCI DSS) and Payment Application
    Data Security Standard (PA-DSS): These are the standards for organizations that
    handle cardholder information for the major debit, credit, prepaid, e-purse, ATM,
    and POS cards.


    +   Sarbanes-Oxley Act (SOX): It mandates strict reforms to improve financial
    disclosures from corporations and prevent accounting fraud.


    # Professional services


    The most common strategies to bill customers for services are Turnkey and Time
    and Material. Turnkey means all services have a set cost that can only adjust
    if services are requested outside of agreed scope of work. Typically, modifications
    to a Turnkey engagement require a separate request for change that the customer
    must accept prior to including additional billing.


    Turnkey services put the risk of losing profitability on the service provider,
    because cost does not adjust the amount of labor required to meet the scope of
    work. This means the service provider has an opportunity to complete tasks under
    proposed time equaling additional profit. This could also backfire when services
    exceed the cost of labor. This is why it is absolutely critical to define an achievable
    scope of work for proposed services with some additional padding hours used for
    unforeseen incidents.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Chapter 8


    Customers tend to lean towards Turnkey services based on the ability to plan for
    expected costs. Customers can focus on achieving the results expected from requested
    services and hold service providers responsible when tasks are not completed without
    incurring additional labor costs. Large organizations like the US government are
    known to request for Turnkey services in formal Requests for Pricing (RFP) public
    postings. In most situations, there are guidelines written by the procurement
    office to determine who will be awarded the engagement based on factors such as
    best value, price, and meeting required items. We have seen RFPs backfire in some
    cases, the bad services cause more problems and cost times higher than the previous
    best value offering. To help customers avoid this situation, we recommend working
    with customers on how to request specific terms and conditions that only qualified
    candidates could meet, to force a balance of best value and cost as an awarding
    metric.


    The other common billing method for services is Time and Materials. Time and Materials
    proposals charge for hours used. Typically, service providers will list different
    hourly rates for billing categories, such as Project Manager could be 100 dollars
    an hour, but a Senior Engineer is 200 an hour. It is common for services to be
    broken into tasks with expected hours to help the customer prepare for expected
    charges as the project proceeds.


    Time and Materials puts the risk of high cost services on the customer, because
    services that exceed task orders continue to be billed. The benefit for customers
    is they may be able to spend less if they can own part of the work, as well as
    avoid the common extra padding hours charged with a Turnkey proposal. The downside
    for customers is the service provider is not incentivized to finish the project
    and could delay completion.


    As a professional service provider, it is recommended to aim for developing a
    Turnkey services offering as you build a practice. Well-defined practices can
    set proper expectations with clients to avoid scoping services. In your experience,
    customers do not have blank checkbooks for services, and desire a set cost prior
    to requesting for budget.


    > Periodically, customers may request to replace billable members with their staff
    to reduce the overall project cost. For example, a customer may ask to use an
    internal Project Manager for planning. This introduces the risk of not managing
    resources, which could lead to problems and cause excessive hours that eat away
    at expected profits. We recommend avoiding these scenarios, because it is difficult
    to control a team member that is not directly part of your organization.


