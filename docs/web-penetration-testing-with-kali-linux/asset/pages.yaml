    # Cracking passwords


    Passwords are the most common method users verify authentication to systems. It
    is common to identify passwords that can access other systems while exploiting
    a target system. Chapter 4, Client-side Attacks, provides a section dedicated
    to cracking passwords with many tools available in Kali. The next section will
    touch upon cracking passwords showcasing a very popular tool available in Kali.


    # John the Ripper


    John the Ripper is the most popular password cracker that is used today. It has
    several engines that it crack different types of passwords, including encrypted
    and hashed passwords. John the Ripper has the ability to autodetect hashes and
    encrypted passwords making the process easier for Penetration Testers. Attackers
    like the tool because it is very customizable and can be configured in a variety
    of ways to speed-up password cracking.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Server-side Attacks


    John the Ripper operates in the following manner:


    +   - Attempts cracking passwords with dictionary words

    - Uses dictionary words with alphanumeric characters appended and prepended

    - Puts dictionary words count

    - Adds alphanumeric characters to combine words

    - Runs dictionary words with special characters mixed in

    - When all else fails, attempts brute-force


    Best practice is updating the default dictionary. We found the default wordlist
    is limited (around 3115 words) and in many cases won''t crack common passwords.
    You can find dictionaries by searching Google. To verify the size of a new word,
    open a terminal and issue the word count command, once the file is loaded to the
    active folder. The command is wc -1 FILENAME.


    It is common to have duplicate words when downloading and combining multiple words
    lists from the Internet. It''s recommended to remove duplicates as well as uppercase
    letters since John toggles case styles automatically. An example of the command
    to remove words is:


    ```

    tr A-Z a-z < CustomWordFile AllLowerCaseFile

    ```


    An example of the command to remove duplicates:


    ```

    sort -u AllLowerCaseFile > NoDuplicatesOrUpperCase

    ```


    Verify the new count by issuing the word count command on your new file:


    ```

    wc -1 NoDuplicatesOrUpperCase

    ```


    To open John the Ripper in Kali, go under Password Attacks | Offline Attacks and
    select John. A command-line terminal will open.


    > Johnny is a GUI for John the Ripper. Johnny is covered in Chapter 4, Client-side
    Attacks.


    You can benchmark the speed of John the Ripper by typing john -test to get an
    idea of how fast it will run.'
