  md: 'Web Attacks


    For example, a DNS proxy can be used to fake requests for badguy.com to point
    to a local machine for termination or interception instead of a real host somewhere
    on the Internet. For this to, you need to gain access and modify DNS entries on
    a single server or poison the real DNS so that traffic gets to the Kali Linux
    server. DNSChef tool is easy to use; however, the challenge is the DNS attack
    method to direct traffic to Kali Linux.


    # SniffJoke


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_263_0.png)


    SniffJoke handles your TCP connection transparently, providing delay, modifying,
    and injecting fake packets inside your transmission. This process makes it extremely
    difficult for a passive wiretapping technology such as an IDS/IPS or sniffer to
    interpret the traffic correctly. This is done by exploiting technology what is
    presumed recorded by a sniffer and what is transmitted by the client, making this
    inconsistent for the algorithm of packet reassembly. The next two diagrams showcase
    wiretapping traffic between two users without and with SniffJoke.


