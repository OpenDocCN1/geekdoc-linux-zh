  md: '# Social media resources


    Social media is everywhere, and in most cases, publicly accessible. Most people
    have a Facebook, LinkedIn, blogs, or other forms of cloud accounts containing
    valuable information. This information can be used as a means of social engineering
    intelligence from a target''s current or previous staff. An example is searching
    Glassdoor.com to identify previous employees who are disgruntled, based on feedback.


    There are many people finding web resources like Maltego (found in Kali Linux)
    that can comb social media, public records, and job recruiting websites to fingerprint
    an individual based on limited information, such as a first and last name. A researcher
    could gather information such as everywhere an individual has lived, done business,
    people with whom they socialize, special interests, favorite sport teams, and
    other useful data for future research and social engineering attacks.


    # Trust


    Most people are naturally trusting and assume information posted on public sources
    are real. To test this concept, the writers of this book created a fake person
    through social media and pretended to be a new hire for a target company. The
    fake person would become friends with associates of our target, post fake holiday
    cards that are linked to a BeEF system designed to compromise vulnerable Internet
    browsers (using BeEF is covered later in this book), and captured sensitive information
    from compromised systems. We were able to map out the entire organization, obtain
    network information, and even had hardware shipped to us without an internal e-mail
    or phone number. Our fake person, Emily Williams, yet received job offers, was
    provided inside information, and access it to events hosted by the target. Information
    is power, and people will give it to a requester who seems they can be trusted.


    More information on this project can be found at: http://www.thesecurityblogger.com/?p=1903


    # Job postings


    Job postings contain a wealth of knowledge about a target''s environment. Job
    listings can provide details on what type of systems are installed, who manages
    them, how the large staff is, and the staff''s skill level. Human Resource representatives
    are typically eager to share information with a potential new hire, which can
    be used as an avenue to inside information. An example is targeting a job posting
    for an Oracle developer to understand the hardware, version of Oracle, names of
    existing and previous administrators, existing operation issues, security gaps,
    and methods to access such as asking "can administrators work from home, and how
    do they access the systems?”'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Another avenue to review is a job''s expected salary, benefits, and turnover
    rate on popular job boards. These trends may uncover new vectors for attack. Glassdoor
    is an example of a popular source for this type of data.


    # Location


    The investment in cyber security for a target can typically be determined based
    on the level of physical security. One would assume a building with fences and
    armed guards would have a higher investment in cyber security than a target located
    within a public building. Online mapping sources such as Google maps can help
    identify where the target. Other areas of interest are identifying where a Penetration
    Tester could move to and from the target. could camp out to scan for wireless
    networks, and possible methods to bypass access controls, such as attire and badges
    used to obtain physical access.


    # Shodan


    Shodan is a search engine that can identify a specific device, such as computer,
    router, server, using a variety of filters, such as metadata from system banners.
    For example, you can search for a specific system, such as a Cisco 3850, running
    a version of software such as IOS Version 15.0(1)EX.'
  merge: -1
