  md: '# Server-side Attacks


    In the Attack Setup tab there is an url field, which must be filled with the target
    URI. Using the URL field are the Headers and POST data input fields. There is
    an option to set the payload type, which can be Dictionary, Range, or Payload.
    The Dictionary can be a file containing payloads, which can a custom file or selected
    from a list of available dictionaries. The Range setting can be used to specify
