  md: '# Defensive Countermeasures


    The previous screenshot shows five partitions. Partitions **1, 2, and 5** seem
    to be the most interesting since partition **3** and **4** are listed as empty.
    Remember, swap partitions can contain information from user caches and cache.
    If we had booted the Live CD on a Windows-based system, we would see a different
    partition structure; however, the overall concept would be the same.


    The next step is deciding which partition to copy. Let''s select the first partition
    listed in the previous image as `/dev/sda1`.


    The basic usage of the dd command is as follows:


    ```

    dd if=/media/partition on a media of=/image_file

    ```


    For this example, we will type the following command to make a copy of the first
    partition:


    ```

    dd if=/dev/sda of=sda-image.dd

    ```


    This will create an image file that is an exact copy of the sda partition to our
    local filesystem. Just we broke one of our golden rules of not modifying the original
    data when we wrote the file to our local filesystem. Best practice is writing
    the image file to another filesystem, or as a different partition, network share,
    or a USB drive. The author''s personal preference is to use a USB drive; however,
    for this example, using the local filesystem is acceptable for testing purposes
    only.


    To use a USB drive for the storage of the copied system, you will first need to
    plug a large USB drive into your system. Since you are in forensics mode on the
    Live CD, Kali will not mount the USB drive. Typically, you want to leave the filesystem
    unmounted and let the dd tool handle the drive specs. To do this, run the command
    shown in the following screenshot:


    ```

    root@kali:~# dd if=/dev/sda of=/dev/null/sda-image.dd

    ```


    The device location was `/dev/null/`; however, you can chose any location. You
    can also save the image directly to a NFS network share. You do do so by using
    the following command:


    ```

    dd if=/dev/sda | nc my_ip_address_to_network_server optional port

    ```


    In the following example, we are cloning the partition sda to our NFS storage
    server with an IP address of 10.0.0.5.


    ```

    dd if=/dev/sda | nc 10.0.0.5

    ```'
