  md: '# Documentation


    Developing a deliverable can be broken into a few stages, as shown in the following
    diagram. The first stage is Project Review. This is where the service provider
    reviews the statement of work, customer business objectives, areas of concern,
    and proposed value to provide. All of this plus additional material is used to
    build a report template.


    The next step is filling the report template using the Information Collection
    stage. Information captured includes devices identified, processes used, vulnerabilities
    found, verification of vulnerabilities, suggested remediation, and other data.


    Once all data is captured and aligned with the template, the third phase is preparing
    a First Draft. This draft will not be customer facing and containing as much data
    as possible. Last is the Review phase, to slim down the report to the strongest
    data along with tuning to meet business demands in a professional manner. Best
    practice is having both a technical and professional writer edit the draft to
    make sure it addresses both executive and technical requirements.


    | Project Review | Information Collection | First Draft | Review and finalization
    |


    > A scope of work should always account for hours needed to create documentation.
    Typically 60 percent of the report writing time will be used for the draft, and
    document review and project sign off will use the remaining hours. Make sure to
    calculate the document lifecycle into your project timeline to avoid lost revenue.


    # Report format


    Regardless of the project type, there are certain items that should be included
    in service deliverables. All documents should explain their purpose, advertise
    your brand, identify parties involved, list work that was performed, and conclude
    with an expected result. This section will provide some pointers and examples
    for meeting formatting goals in a professional manner.'
