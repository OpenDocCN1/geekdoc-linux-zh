  md: "Network Reconnaissance was conducted against the address space provided by\
    \ CUSTOMER with the understanding that this range of targets would be considered\
    \ the scope for this engagement. It was determined that the company maintains\
    \ a minimal external presence, consisting of an external web site and other services\
    \ identified by SERVICE PROVIDER for Reconnaissance of CUSTOMER.\n\nWhile reviewing\
    \ the security of the primary CUSTOM website, it was discovered that a vulnerable\
    \ plugin was installed. This plugin was successfully exploited, leading to administrative\
    \ access. This access was utilized to obtain interactive access to the underlying\
    \ operating system, and then escalated to root privileges.\n\nSERVICE PROVIDER\
    \ was able to use administrative access to identify internal network resources.\
    \ A vulnerability in an internal system was leveraged to gain local system access,\
    \ which was then escalated to domain administrator rights. This placed the entire\
