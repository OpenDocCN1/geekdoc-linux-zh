    # Summary of findings


    The Summary of findings is the meat behind the proposal. This is where the findings
    from the services are explained, including how items identified may impact business.
    How these results are formatted will determine your customer''s reaction, to be
    aware of not only what is said, but also how data is presented.


    Best practice is including a risk ranking to help customers understand how to
    react to items identified. Common ranking characteristics are likelihood, risk
    evaluation, charts, color schemes, and so on. We recommend including both a summary
    chart and detailed section on all individually identified items. To back up your
    findings, best practice is having references to public sources on why the identified
    asset has an issue to further validate your claim. Public sources could be violations
    in compliance, not meeting a mandated standard or explanation of a known vulnerability
    from a reputable source.


    Example:


    +   - **Critical**: Immediate threat to key business processes

    - **High**: Indirect threat to key business processes / threat to secondary business
    processes

    - **Medium**: Indirect / partial threat to business processes

    - **Low**: No direct threat exists; vulnerability may be leverage with other vulnerabilities'
