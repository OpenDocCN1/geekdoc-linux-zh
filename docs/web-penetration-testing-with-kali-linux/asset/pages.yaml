  md: 'Defending against browser-based penetration tools is difficult. The best defense
    is ensuring that all browser-based software is updated with the latest versions
    and security patches, along with disabling the browser from running Flash and
    Java. In addition, security solutions that can detect common application-based
    threats as Next Generation Intrusion Prevention Systems (NGIPS) can provide an
    extra layer of security. The majority of victims to penetration tools can be BeEF
    users who click links included in emails or social media guests posing as a trusted
    party sharing things wrapped with malicious links/software/code and so on.


    # # FoxyProxy – Firefox plugin


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_233_0.png)


    If you plan on using proxies for testing web applications such as Zed Attack Proxy
    (ZAP) or BURP, you may want to use the Firefox plugin FoxyProxy to simplify switching
    between, as well as enabling Proxy usage. FoxyProxy is a Firefox extension that
    lets you to easily manage, change, enable, or disable proxy settings on Firefox.
    You can download FoxyProxy from the Firefox add-on library.


    Once FoxyProxy is installed, there will be an icon added on at the top of the
    Firefox browser window. Click on that to open the FoxyProxy options dialog:


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_233_1.png)'
