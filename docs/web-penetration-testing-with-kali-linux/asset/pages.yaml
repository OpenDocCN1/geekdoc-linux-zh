    # Obtaining and cracking user passwords


    Password cracking by definition is recovering passwords from data that has been
    stored or transmitted by a computer system. Passwords are used to secure various
    system types, which we have touched upon in Chapter 3, Server-side Attacks, while
    attacking web servers.


    Host systems are usually Windows or Linux-based and have specific characteristics
    regarding how they store and protect user passwords. This section will focus on
    cracking host system password files. We included this in the Web Application Penetration
    Testing book, because host systems are a common authorized client to access a
    targeted web application.


    The easiest method to obtain user passwords is through social engineering. As
    previously described, a hacker could obtain passwords or clues how passwords are
    created by posing as an unauthorized subject. For example, identifying that all
    passwords must be between 6-10 characters, start with a capital letter, and end
    with a number dramatically reduces the number of possible outcomes a hacker would
    need to attempt to crack a password.(Kali offers a tool called Crunch that makes
    generating a password list for this type of attack extremely easy).


    [ 151 ]'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Client-side Attacks


    A savvy Penetration Tester should use Reconnaissance techniques presented in Chapter
    2, Reconnaissance, to identify system types, possible password policies, people
    involved with administering systems, and other information that would help narrow
    down the possibilities required to crack a password.


    There are a few ways hackers crack passwords. Using information obtained these
    are listed as follows:


    +   - Guess: Manually guess information obtained about a target

    - Dictionary attack: Use an automated attack that tries all the possible dictionary
    words

    - Brute-force: Try all the possible character combinations

    - Hybrid: Combining dictionary with brute-force


    Passwords must be stored so that the systems can verify a user''s identity and
    access rights. Most systems do not store passwords in plain text files for obvious
    security reasons. Most systems do not use encryption as the only means to protect
    passwords, because a key is required to decrypt, which poses a weakness to protecting
    the encrypted files.


    Hashing was invented as a means to transform a key or password, using arithmetic,
    into a completely different value. Hashing is non-reversible and outputs the same
    value for an entered key, which means a hash is stored and verified against an
    entered password to verify authenticity. Changing one factor, such as making a
    letter capital or adding a space, generates a completely different hash output.


    Hashes can be brute-forced like a password if you know the formula for generating
    a Hash. Many password cracking tools such as John the Ripper are capable of detecting
    a hash and brute-force attacking all hash output combinations with auto-generated
    hash outputs. Once a match is found, John the Ripper will print the plain password
    used to generate the matching hash.


    Rainbow tables are the worst adversary to common Hash algorithms. Rainbow tables
    are a pre-computed database of all the hash outputs that could be searched to
    identify a hash output. Websites such as www.freerrainbowtables.com offer versions
    for popular hash algorithms as MD5 found in most Windows systems. Kali also offers
    applications such as RainbowCrack used to generate Rainbow tables.


    Salting a hash was created as a means to combat Rainbow tables by adding additional
    bits to change the output of a hash to something not found in common Rainbow tables.
    Unfortunately, many systems such as Windows do not use salted hashing.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Chapter 4


    # Windows passwords


    Windows is the most common operating system used by businesses worldwide. Microsoft
    has a rocky regard regarding protecting passwords. The current Microsoft products
    are much more secure than older versions; however, they are still vulnerable to
    attacks by many tools offered in Kali.


    Windows stores passwords in the SAM (System Account Management) registry file.
    The exception to this is when Active Directory is used. An Active Directory is
    a separate authentication system that stores passwords in an LDAP database. The
    SAM file is located at C:\systemroot>\sys32\config.


    The SAM file stores passwords in a hashed format using the LM and NTLM hash to
    add security to the protected file. The SAM file cannot be moved or copied while
    Windows is running. The SAM file can be dumped, displaying the password hashes
    that can be moved offline for a brute-force tool to crack. A hacker can also get
    the SAM by booting a different OS, mounting C:\, booting a Linux distribution
    on a disk (such as Kali), or booting off a CD/floppy drive.


    One common place to find a SAM file is in the C:\systemroot>\repair folder. The
    backup file is created by default and typically not deleted by system administrators.
    The backup file is unprotected but compressed, meaning that you must decompress
    the file to obtain the hashes. You can use the expand utility to do this. The
    command is Expand [FILE] [DESTINATION]. Here is an example of expanding the SAM
    file into the decompressed SAM file.


    ```

    C:\> expand SAM uncompressedSAM

    ```


    To enhance the security from offline hacking, Microsoft Windows 2000 and newer
    versions use a SYSKEY utility. The SYSKEY utility encrypts the hashed passwords
    in the SAM file using the 128-bit encryption key, which is a different key for
    each installation.


    An attacker with physical access to a Windows system can obtain the SYSKEY (also
    called the boot key) using the following steps:


    +   1. Booting another operating system (such as Kali).

    2. Stealing the SAM and SYSTEM hives (c:\<systemroot>\sys32\config).

    3. Recovering the boot key from the SYSTEM hive using bkreg or bkhive.

    4. Dump the password hashes.

    5. Crack them offline with a tool such as the Ripper.


    [ 153 ]'
