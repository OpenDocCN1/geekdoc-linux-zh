  md: '# ProxyStrike


    ProxyStrike is a web application proxy built to identify vulnerabilities while
    browsing an application. It runs like a proxy listening on port 8008 by default,
    meaning you have to configure your Internet browser to run ProxyStrike so that
    you can analyze all the parameters in the background while you surf your target''s
    website. The proxy features are great for identifying, intercepting, and modifying
    requests.


    To configure an Internet browser as Firefox to use ProxyStrike, select in Firefox
    Preferences | Advanced | Network and select Settings. Select Manual Proxy and
    you enter the IP address of | Kali server followed by the port of 8008 (unless
    you plan to change the ProxyStrike default port).


