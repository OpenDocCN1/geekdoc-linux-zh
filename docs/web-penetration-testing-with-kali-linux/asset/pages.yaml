  md: '# Web history sources


    There are archived versions of most public websites available on sources such
    as the Wayback Machine at archive.org. Interesting information can be found in
    an older version of a target''s website, such as outdated charts, phone numbers,
    customer intelligence, systems information listed in fields, such as view or /robots.txt,
    older business partnerships, vulnerabilities fixed in later versions, and other
    useful data the target doesn''t want on the current website version. It is important
    to understand that the publicly available information is hard to remove completely,
    making historical sources a valuable place for Reconnaissance research.


    To access the Wayback Machine, open up the web browser and navigate to http://archive.org,
    you will see the Internet Archive Wayback Machine in the middle of the page, as
