  md: '# Reconnaissance


    Kali ships with a tool named Fierce. Fierce will check to see if the DNS server
    allows zone transfers. If zone transfers are permitted, Fierce will execute a
    zone transfer and inform the user of the entries. If the DNS server does not allow
    zone transfers, Fierce can be configured to brute force host names on a DNS server.
    Fierce is designed as a reconnaissance tool before you use a tool that requires
    you to know IP addresses, such as Nmap.


    To use Fierce, navigate to Information Gathering | DNS Analysis | Fierce. Fierce
    will load into a terminal window as shown in the following:


    ```

    --threads Specify how many threads to use while scanning (d is single threaded)

    --traverse Specify a number of IPs above and below what have found for nearby
    IPs. Default is 5 ab below. Traverse will not move into other C blocks.

    --version Output the version number.

    --wide Scan the entire class C after finding any hostnames in that class C. This
    generates a lot more but can uncover a lot more information.

    --wordlist Use a separate wordlist (one word per line)

    perl fierce.pl -dns examplecompany.com -wordlist dictionary


    ```


    To run the Fierce script, type the following command:


    ```

    fierce.pl -dns thesecurityblogger.com

