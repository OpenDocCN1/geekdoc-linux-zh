  md: '# Server-side Attacks


    We can see from this example that we need an RHOST entry. RHOST is the IP address
    of the remote host we are attacking. We also need to select the payload and set
    the payload options. A payload is code that injects itself and runs the exploit.
    Since some vulnerability can exist using multiple methods, we can possibly have
    multiple payloads to choose. To see the available payloads, the show payloads
    command.


    Once we see a payload that we want to use, the next step is to use the set payload
    command and in the patch of the payload we see.


