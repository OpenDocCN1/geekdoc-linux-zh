    A full list of the SMTP commands can be found through the SMTP RFC commands or
    using Google.


    # Brute-force attacks


    A brute-force attack is when all possible keys are checked against encrypted data
    until the right key is found. Brute-force attacks are extremely costly from a
    resource and time perspective because the attacker is exploiting vulnerabilities
    in the encryption by taking advantage of key length and simplicity of the key.
    A password is often based on dictionary words making the total space an attacker
    would have to test all words in a matching dictionary making the guessing significantly
    smaller than a password using random characters. Best practice to mitigate brute-force
    attacks is using long and complicated keys as well as timeouts after a number
    of attempts and other methods to add more secure factors.


    # Hydra


    Hydra is a tool developed by The Hacker''s Choice (THC) that uses the brute-force
    attack method to test against a variety of different protocols. It is ideal for
    attacking e-mail systems because Hydra can target a specific IP and protocol as
    the admin account for POP3 and SMTP by the e-mail systems.


    Prior to launching Hydra, you should perform Reconnaissance on a target such as
    a mail system. Chapter 2, Reconnaissance, covers a vulnerability assessment tool
    Zenmap that can be used to gather the following information for Hydra:


    +   - The target''s IP address (for example, 192.168.1.1)

    - Open Ports (for example, port 80 or 25)

    - Protocol (for example, HTTP for web or SMTP for mail)

    - User name (for example, admin)'
