- img_proc: true
  md: '# Chapter 8


    The central objective of our external and web Penetration Testing effort is to
    exploit the inherent security weaknesses of the network perimeter, web domain,
    and web application delivery. Adjacent application delivery elements, including
    backend databases and middleware, are also included in this domain and evaluated
    as well. Common vulnerabilities and exploits that we focus on during this phase
    are the ones related to buffer overflows, SQL injections, and cross-site scripting.
    Our engineers may also engage in a manual navigation of the web domain to extract
    other pieces of sensitive and critical data. Furthermore, as requested by the
    CUSTOMER, devices in the DMZ will also be included in this Penetration Testing
    exercise in an attempt to logically break down the defenses surrounding the web
    application domain.


    Detailed testing procedures:


    SERVICE PROVIDER will complete the following testing procedures for the web application
    domain:


    +   * Identify the servers to be tested, based on the customer''s web site, and
    crawl a website to harvest addresses published on the site.

    * Leverage major search engines to locate addresses for a given domain.

    * Find addresses in PGP and WHOIS databases.

    * Launch multiple, simultaneous attacks to speed the Penetration Testing process.

    * Interact with compromised machines via discrete agents that are installed only
    in system memory.

    * Run local exploits to attack machines internally, rather than from across the
    network.

    * Analyze custom, customized, and out-of-the-box web applications for security
    weaknesses.

    * Validate security exposures using dynamically generated exploits, emulating
    a hacker trying various attack paths and methods.

    * Demonstrate the consequences of an attack by interacting with web server file
    systems and databases through command shells and database consoles.

    * Perform Penetration Testing without corrupting web applications or running code
    on targeted servers.


    Customer responsibilities are as follows:


    +   * Identify the web domain''s for which web assessment will be performed. Communicate
    service maintenance and/or impacts during Penetration Testing.

    * Ensure web accessibility to domains and perimeter devices in scope if not publicly
    available.'
