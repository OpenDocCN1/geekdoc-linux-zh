    # Linux passwords


    Linux host systems are not as common as Windows and pose a different challenge
    for obtaining ROOT access. Many systems may have passwords stored in the clear
    when auto-login is enabled such as the netrc files used for Telnet and FTP. Most
    attacks, you will want to capture the passwd and shadow files commonly stored
    at /etc/passwd and /etc/shadow.


    The shadow file is readable only by ROOT and typically an MD5 hash. The shadow
    file is harder to capture than a Windows''s SAM file. There are methods of capturing
    the shadow file using boot loaders such as grub.


    Breaking a Linux password is similar to other systems such as Windows. Most hybrid
    automated cracking programs such as John the Ripper can identify the type of hash
    and brute-force attack the shadow passwords with the right dictionary.


    # Kali password cracking tools


    Kali offers various utilities to bypass password security. Password cracking tools
    can be found under Password Attacks and divided into tools used for offline and
    online attacks. This section will focus on tools used to compromise host systems
    during a web application Penetration Test. There are other tools available in
    Kali, such as tools designed to crack passwords for wireless protocols; however,
    that is out of scope for this text.'
  merge: -1
