  md: '# Statement of Work (SOW)


    Before you offer Penetration services, you may need to write a Statement of Work
    (SOW) that outlines the work you are going to perform. This is typically the first
    step you would want to complete with your stakeholders before starting a project.


    When writing a SOW, we recommend you follow a format that will ultimately represent
    your reporting structure. The basic format of a Statement of Work documents include
    the following:


    +   - Executive report: A high-level summary of the work you are doing, what you
    hope to accomplish, and your target audience..


    Example of SOW executive summary is as follows:


    The SERVICE PROVIDER is pleased to present the CUSTOMER with our methodology for
    conducting a security assessment. The principal objective of CUSTOM for initiating
    this engagement is to evaluate the current level of risk and exposure adequately
    within the organization with a focused view to develop and/or implement solutions
    that will help reduce critical threats and ultimately mitigate relevant risks.


    In response to the needs of CUSTOM, SERVICE PROVIDER has outlined an effective
    security assessment strategy that has proven to be very successful in elevating
    the security posture in many similar organizations. Our approach begins with understanding
    the business requirements associated with the assessment, followed by a detailed
    topology mapping and base-lining of the existing infrastructure identified to
    be in scope. Upon completion of the discovery of the infrastructure, we begin
    a systematic vulnerability assessment of critical systems and network devices
    to identify threat vectors that may be behavioral in nature. A careful exploitation
    method is then reviewed and executed to identify the relevance of vulnerabilities
    that have been detected. Techniques such as Penetration Testing and social engineering
    may be employed during this phase. Lastly, we undergo weekly status briefings
    throughout the life cycle of the engagement to review activities for the week
    and communicate key goals and objectives for the upcoming weeks. This provides
    CUSTOM an opportunity to inform our engineers of any system upgrades that require
    special consideration. SERVICE PROVIDER provides credible project expertise to
    ensure operational excellence and a superior customer experience in all our engagements
    and this is no exception.


    SERVICE PROVIDER recognizes a consistent need to assess and improve the security
    posture of an organization continually, and we believe that this engagement will
    help in reducing operational expenses from minimized risks and downtime while
    providing data protection and brand reputation benefits to CUSTOMER.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Penetration Test Executive Report


    Furthermore, the insight gained from such an exercise is crucial in planning for
    future services that will enable business performance and profitability. These
    benefits are consistent and well aligned with the CUSTOMER''s objectives listed
    as follows:


    +   - Gain a better understanding of potential CUSTOMER network vulnerabilities
    and security risks


    +   - Determine critical security architecture weakness within the CUSTOMER infrastructure


    +   - Evaluate the security associated with the CUSTOMER website and external-facing
    applications


    +   - Activity report: A report of all executed exploits (available in three levels
    of detail).


    +   - Host report: Detailed host information, including the number of compromised
    computers, the average number of vulnerabilities exploited on each computer, and
    the CVE names of vulnerabilities found on each computer.


    +   - Vulnerability report: A detailed report of successfully exploited, versus
    potential, vulnerabilities on each computer.


    +   - Client-side Penetration Test report: A full audit trail of each client-side
    Penetration Testing, including the email template sent, exploit launched, test
    results (success or failure), and details about compromised systems.


    +   - User report: A client-side testing report of which links were clicked, they
    were clicked, and by whom.


    # External Penetration Testing


    Special consideration should be given to Penetration Testing from external sources.
    An external Penetration Testing SOW identifies your target and possible steps
    you are willing to take during your attack. The SOW also defines when you will
    stop testing or what circumstances are beyond scope. In other words, the SOW gives
    you a stopping point.


    The next example shows an external Penetration Testing summary. It includes a
    quick overview of the testing process, followed by an outline with step-by-step
    instructions of the work that will be performed. This example also outlines the
    client and application owner''s responsibility.


    External web test SOW example:'
