  md: '# Siege


    Siege is a HTTP/HTTPS testing utility designed for web developers to measure the
    performance of their code under stress. Siege offers multi-threaded HTTP load
    testing and benchmarking by hitting a web server with a configurable number of
    concurrent, simulated users. Siege offers a regression, Internet simulation and
    brute force modes.


    You can find Siege under Stress Testing | Network Stress Testing | Siege:


    ```

    SIEGE 2.70

    Usage: siege [options]

    sieve [options] URL

    sieve -g URL


    Options:

    -V, --version prints the version number.

    -h, --help prints this section.

    -C, --config show the current config.

    -v, --verbose prints notifications to screen.

    -G, --get GET, Great for application debugging pull HTTP headers and display the
    transaction.

    -c, --concurrent=NUM CONCURRENT users, default is 10

    -i, --internet USER simulation, hits URLs randomly.

    -b, --benchmark BENCHMARK: no delay between requests.

    -t, --time=NUM TIMED: where "m" is the modifier S, M, or H

    ex: --time=1H, one hour test.

    -r, --reps=NUM REPS, number of times to run the test.

    ```


    To run Siege, type the following command:


    ```

    siege [options] <target URL>

    ```


    The following screenshot shows running Siege against www.thesecurityblogger.com.
    The default user count is 15, as shown in the screenshot. When you stop the Siege
    test, the tool provides a report post test as follows:


    ```

    root@kali:~# siege www.thesecurityblogger.com

    ** SIEGE 2.70

    ** Preparing 15 concurrent users for battle.

    The server is now under siege..

    ```


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_264_0.png)'
