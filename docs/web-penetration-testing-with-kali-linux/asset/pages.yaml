    # Calculating risk


    It is important to understand how to calculate risk associated with vulnerabilities
    found, so that a decision can be made on how to react. Most customers look to
    the CISSP triangle of CIA when determining the impact of risk. CIA is the confidentiality,
    integrity, and availability of a particular system or application. When determining
    the impact of risk, customers must look at each component individually as well
    as the vulnerability in its entirety to gain a true perspective of the risk and
    determine the likelihood of impact.


    It is up to the customer to decide if the risk associated to vulnerability justifies
    or outweighs the cost of controls to reduce the risk to an acceptable level. A
    customer may not be able to spend a million dollars on remediating a threat that
    compromises guest printers; however, they will be very willing to spend twice
    as much on protecting systems with the company''s confidential data.'
