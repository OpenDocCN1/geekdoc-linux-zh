- img_proc: true
  md: '# 5

    Attacking Authentication


    Authentication is the act of confirming the trust of one''s identity. This might
    involve confirming the identity of a person, program, or hardware, such as verifying
    Joseph Muniz is a government employee, as well as his laptop is issued by the
    government agency. as a Penetration Tester, it is valuable to be able to gain
    the trust of a system and bypass security as an authorized entity.


    The Certified Information Systems Security Professional (CISSP) curriculum classifies
    authentication based on three factor types, as follows:


    +   - Something you know, such as a PIN or password

    - Something you have, such as a smart card

    - Something you are, such as a fingerprint


    The most common method by which people confirm their identity is using something
    they know, such as a password. We covered various ways to crack passwords in Chapter
    4, Client Side Attacks, while attacking host systems. Cracking a password will
    get you access to some systems however, many targets leverage multifactor authentication,
    meaning a combination of authentication steps to prove one''s identity.


    It is common that user authentication involves the use of a username and password
    combination. It becomes cumbersome for a user to enter this information every
    time authentication is required. To overcome this, single-on was created as a
    means to authenticate one to a central authority that is trusted by other websites.
    The central authority will verify on behalf of the user or device, so the user
    can access multiple secured systems without having to be prompted at each security
    gateway. A common trusted authority is a Windows domain controller, providing
    authentication for internal users to intranet resources. In such cases, compromising
    a trusted authority or account with high privileges could mean access to many
    internal resources in this type of system.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Attacking Authentication


    Many government agencies leverage a Personal Identity Verification (PIV) or Common
    Access Card (CAC) along with a password, to meet something users have and know.
    It is common for remote workers to use a digital token that produces a fresh number
    every few seconds with a PIN to represent something they have and know. High security
    physical locations may require fingerprint scanning along with PIN for access.
    Network access control technology may verify how a user is authenticated into
    a laptop, as well as seek a hidden certificate to verify the identity of system
    and user prior to providing network resources. It is critical to identify the
    method of authentication used by your target during the reconnaissance phase of
    a Penetration Test, so you can plan out a strategy to bypass that trust.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_193_0.png)


    The focus of this chapter is around how users and devices authenticate to web
    applications with the goal of compromising trust. We will start by attacking the
    process of managing authentication sessions, which is how trust is established
    between the client and the server. Next, we focus on clients by attacking how
    data is stored on host systems through cookie management. From there, we will
    look at hiding in between client and server using man-in-the-middle attack techniques.
    The last topics will be identifying and exploiting weakness in how web applications
    accept authentication through SQL and cross-site scripting (XSS) attacks.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# # Attacking session management


    Authentication and session management make up all aspects of handling user authentication
    and managing active sessions. With regards to web applications, a session is the
    length of time users spend on a website. Best practice is managing authorized
    sessions (that is, what you are permitted to access), based on how people and
    devices authenticate as well as, controlling and how long resources are available
    during the active session. This makes authentication a key aspect of managing
    authorized sessions.


    The goal for a Penetration Tester is to identify accounts that are permitted access
    to sessions with high-level privileges, and unlimited time to access the web application.
    This is why session management security features, such as session timeouts and
    SSL certificates, were created. Either way, tools available in Kali can identify
    flaws in how sessions are managed, such as capturing an active session on a web
    application post logout, and that session for another person (also known as a
    session fixation attack).


    Session management attacks can occur using vulnerabilities in applications or
    how users access and authenticate to those applications. Common ways attackers
    do this through cross-site scripting or SQL injection attacks to a web server,
    which will be covered later in this chapter. Attackers can also take advantage
    of session cookies in web browsers or vulnerabilities in web pages to achieve
    similar results. Let''s start off by looking at a technique used to trick users
    into divulging sensitive information, or exposing them to attacks through modified
    hyperlinks and iFrames.


    # # Clickjacking


    Clickjacking is a technique where an attacker tricks a user into clicking something
    other than what they believe they are clicking. Clickjacking can be used to reveal
    confidential information, such as the login credentials, as well as permitting
    an attacker to take control of the victim''s computer. Clickjacking usually exposes
    a web browser security issue or vulnerability using embedded code or script that
    executes without the victim''s knowledge. One example of performing clickjacking
    is having the hyperlink to a trusted site different than the actual site. The
    average user doesn''t verify hyperlinks prior to clicking, or notices changes
    associated with common clickjacking attempts, making this a very effective form
    of attack.


    In this following example, the user will see Visit on Facebook.com however, when
    they click on the text, they will be actually redirected to www.badfacebook.com.


    ```

    <a href="http://www.badfacebook.com">Visit Us on Facebook.com</a>

    ```'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Attacking Authentication


    Clickjacking can be more malicious and complicated than changing hyperlinks. Attackers
    who use clickjacking normally embed IFrames into a webpage. The content of the
    IFrames contains data from the target website and usually placed over a legitimate
    link making it difficult to detect.


    To craft your clickjacking attack, you can use the clickjacking tool by Paul Stone,
    which can be downloaded at: http://www.contextis.com/research/tools/clickjacking-tool.


    ![](img/df1fdcde66c92c1fef83bd651dd5ffe3_195_0.png)


    Once you have downloaded the tool, you can use it to take code from another website,
    such as a voting button or a like button. The clickjacking tool works with Firefox
    3.6 The tool by Paul Stone will not work with newer versions of Firefox; however,
    you can run multiple versions of Firefox on the Kali arsenal including Firefox
    3.6 or older.


    > Website code often changes, so make sure to adjust your attacks to accommodate
    updates that mirror the trusted website.


    # Hijacking web session cookies


    Cookies are a small piece of data sent from a website and stored on a user''s
    browser while the user is accessing the website. The website can use a cookie
    to verify the user''s return to the site and obtain details about the user''s
    previous activity. This can include what pages were accessed, how they logged
    in, and what buttons were pressed. Anytime you log into a website, such as Facebook,
    Gmail, or Wordpress, your browser assigns you a cookie.'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'Cookies can include tracking history from users for long periods of time, including
    behavior on a website years ago. Cookies can also store passwords and form values
    a user has previously filled, such as their home address or credit card number.
    This is useful for businesses such as retail to provide a simplified experience
    for their consumers. A session token is delivered from a web server anytime a
    host authenticates. The session token is used as a way to recognize among different
    connections. Session hijacking occurs when an attacker captures a session token
    and injects it into their own browser to gain access to the victim''s authenticated
    session. Essentially, it is the act of replacing an attacker''s cookie with a
    victim''s unauthorized cookie.


    There are some limitations of session hijacking attacks:


    +   - Stealing cookies is useless if the target is using https:// for browsing,
    and end-to-end encryption is enabled. Adoption has been slow; however, most secured
    websites provide this defense against session hijacking attacks.


    > You can use SSLStrip as a method to prevent your target from establishing an
    https connection prior to launching a session hijack or other attack. See Chapter
    3, Server-Side Attacks, for more information on SSLStrip.


    +   - Most cookies expire when the target logs out of a session. This also logs
    the attacker out of the session. This is a problem for mobile apps that leverage
    cookies that don''t expire, meaning an attacker could gain access for life if
    a valid session token is captured.


    Many websites do not support parallel logins, which negates the use of a stolen
    cookie.


    # Web session tools


    The next section will cover tools used for Penetration Testing web sessions. Some
    tools are not available in Kali1.0; however, they can be obtained online.'
