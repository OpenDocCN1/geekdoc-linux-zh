    Table 8.1 Tru64 UNIX Supported Formats and Tools


    | Format | Read Tool | Write Tool |

    | --- | --- | --- |

    | tar | tar and pax | tar and pax |

    | cpio | cpio and pax | cpio and pax |

    | dump | restore | dump |

    | vdump | vstore | vdump |

    | ANSI | ltf | ltf |

