    operating system. In that case, you can pick any format that the operating system
    supports and be pretty sure it will be readable at the destination. The other
    hand, if someone is sending you data on tape from a non-Tru64 UNIX system that
    you need to read on Tru64 UNIX, you can most likely read the tape if it is in
    tar or cpio format.


    These two formats are the most universally supported among different UNIX vendors,
    so you will have the greatest chance of success if you use them. The tar format
    is becoming popular that many non-UNIX systems now support it. Other UNIX vendors
    also support dump: however, not at all, so you will have to check to be sure that
    format will be readable. Also, one vendor''s dump tape part might not be supported
    by another because of internal differences in format. Tru64 UNIX''s vdump format
    is proprietary to Tru64 UNIX and is unlikely to be readable by any other''s systems.


    If the other system is not UNIX, your best chance of compatibility is with an
    ANSI formatted tape. For example, the OpenV writes tapes in ANSI format, which
    can be read on Tru64 UNIX using the Labeled Tape Facility, ltf(1). The same is
    true for tapes you need to send to another non-UNIX operating system. Using ltf
    to create an ANSI tape is generally the best bet.


    The "blocking factor" is the size of the record that will be read from the tape
    in a single chunk. Some brands of UNIX use a different factor for their tape tapes
    than Tru64 UNIX uses by default. The blocking factor of tape is not always obvious
    and some utilities, such as tar, will not function properly without this information.
    If this happens, you''ll get a "premature end of tape" error from tar. The trick
