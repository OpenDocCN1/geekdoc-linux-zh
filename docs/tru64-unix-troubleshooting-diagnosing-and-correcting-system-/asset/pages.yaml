    # 10.4 Timezone Issues


    The system timezone is a minor element of UNIX system configuration, but it is
    nevertheless an important one. In most cases, there will never be a problem with
    the timezone definition, nor any need to modify it (unless the system is moved
    to a different geographic location). However, in the rare event that a timezone
    problem does arise, it can be quite serious for users and applications—and mysterious
    to the unlucky system administrator who has to track down the problem and fix
    it. In the interest of minimizing unnecessary anguish on the part of system administrators,
    we''re including a discussion of the most likely timezone problems and their solutions.


    In order to troubleshoot timezone problems, it''s necessary to understand how
    UNIX in general—and Tru6 UNIX in particular—handles system time and timezones.
    From an internal timekeeping perspective, the UNIX kernel has no concept of timezones.
    The kernel keeps as the absolute number of seconds since the beginning of the
    year 1970—that is, since 00:00:00 January 1, 1970, Greenwich Mean Time (GMT).
    (GMT is also known as Universal Time, or UTC). This internal time is never adjusted
    for'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'timezones or daylight saving time. The system define a timezone, but it is
    used to convert the internal time to a form convenient for users. For example,
    an internal time value of 1050000000 seconds since the beginning of 1970, or in
    more familiar terms, 18:40:00 GMT on April 10, 2003.


    In some older versions of UNIX, the timezone definition was built into the kernel
    and could be changed only by rebuilding the kernel. Modern versions, including
    Tru64 UNIX, are more flexible. Tru64 UNIX uses the symbolic link /etc/zoneinfo/localtime
    to define the system time. The target of this link is a timezone definition file
    which represents the timezone name, geographic region, or a major city within
    the zone. For example, a Tru64 UNIX version 5 in the Eastern timezone of the United
    States has the localtime link as follows:


    ```

    # cd /etc/zoneinfo

    # ls -l localtime

    lrw-xr-x 1 root system 16 Jul 1 10:30

    /etc/zoneinfo/localtime -> America/New_York

    ```


    To change the timezone, all that has to be is modify the symbolic link to point
    to the desired zone. This can be done on the fly and not require a kernel rebuild
    or even a reboot. For example, suppose the system in the above example is moved
    from Atlanta to Houston, which requires the timezone to be changed from U.S. to
    Central. All that needs to be done is to replace the symbolic link with the correct
    value:


    ```

    # cd /etc/zoneinfo

    # ln -sf America/Chicago localtime

    ```


    The timezone definition files reside in subdirectories under /etc/zoneinfo, so
    the target of the symbolic link could be either a relative path ("America/Chicago")
    or an absolute path ("/etc/zoneinfo/America/Chicago") with equal validity. Each
    definition file defines its time zone in terms of its offset from GMT, for starting
    and ending daylight saving time, and the abbreviation(s) used to designate the
    timezone. For example, the America/New_York file defines the U.S. Eastern time
    zone. Standard time is five hours before GMT, daylight saving time advances the
    clock by an hour beginning the first Sunday in April and ending the first Sunday
    in October,'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'and the abbreviations "EST" and "EDT" are used for Eastern Standard Time and
    Eastern Daylight Time respectively.


    Most (but not all) of the timezone names changed between Tru64 UNIX versions 4
    and 5. For example, the U.S. Eastern timezone is "US/Eastern" in version 4, but
    "America/New_York" in version 5. When a system is upgraded from version 4 to version
    5, the update installation procedure changes the symbolic link if the timezone
    name changed; no action is taken—which leads to one of the possible configuration
    problems. There is a set of timezones strictly by their offset from GMT, with
    no daylight saving changes. These timezones have names such as "GMT-5," "GMT+2,"
    etc. In Tru64 UNIX version 4, the timezone name represents the offset from GMT—or
    the equivalent of U.Central Standard Time (CST). "GMT-6" is six hours behind GMT,
    or the equivalent of U.Central. Tru64 UNIX version 5 was changed to comply with
    the POSIX.1 standard (ISO/IEC 9945-1 IEEE 1003.1), which defines GMT-offset timezone
    names in terms of the number of hours that must be added to local time to match
    GMT. In this scheme, the time equivalent to U.S. CST has six hours to add in order
    to match GMT, so this timezone is now called "GMT+6." In other words, the definition
    effectively swapped the plus and minus signs in the zone names; the old GMT-6
    is now GMT+6, and vice versa. (In our opinion, the definition called for the POSIX.1
    standard is counterintuitive and confusing; however, it is standard.)


    When using one of the GMT-offset timezones is upgraded from Tru64 UNIX version
    4 to version 5, the symbolic link is changed—but the definition of a timezone
    as "GMT-5" has changed in an unexpected way. Now a timezone that was five hours
    behind, or a total of 10 hours ahead of the desired timezone, becomes a problem.
    This usually appears as the system time "jumping" forward or backward several
    hours when the system is upgraded to version 5. If you encounter this behavior,
    check if you are using one of the GMT-offset timezones. If so, change it to the
    timezone with the opposite sign or (preferably) a timezone with an appropriate
    "meaningful" name.


    Timezone problems can also occur if a timezone definition file becomes corrupted.
    This is usually caused by issuing an "In" command to change the localtime symbolic
    link, but specifying the arguments in the wrong order (e.g., "In -sf localtime
    America/New_York" instead of "In -sf America/New_York localtime\). The latter
    correctly defines the symbolic link "localtime" pointing to target file "America/New_York."
    Specifying the arguments in the wrong order defines "America/New_York" as a symbolic'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 10.4 Timezone Issues


    link, which overwrites the actual timezone definition file. If there is a problem
    with the underlying timezone file, Tru64 UNIX won''t be able to interpret the
    timezone correctly. In this case, there are alternatives: Either copy the affected
    timezone file from another Tru64 UNIX system or the installation CD-ROM, or rebuild
    it from the timezone source files.


    The timezone source files are located in directory /etc/zoneinfo/sources. There
    is one file for each continent containing the time zones on that continent (e.g.,
    "europe", "northamerica", etc.). To rebuild the timezone definition files, use
    the timezone compiler, sic(8), on the appropriate source file. For example, if
    America/New_York is corrupted, the following commands will rebuild all of the
    North American timezone definition files:


    ```

    # cd /etc/zoneinfo/sources

    # zic northamerica

    ```


    This replaces the corrupted "America/New_York" file with a newly built version.


    If you suspect a corrupted timezone file, the "zdump-v" command can be used to
    verify the timezone definition. The "zdump-v" reads a timezone definition file
    and displays the GMT offset and daylight saving time transitions in each year
    from 1900 to 2038. This generates a lot of output, but it can be pared down by
    piping the command to grep for the current year. For example, the following command
    checks the definition for America/New_York:


    ```

    # zdump -v America/New_York | grep 2003

    America/New_York Sun Apr 6 06:59:59 2003 GMT = Sun

    Apr 6 01:59:59 2003 EST isdst=-18000

    America/New_York Sun Apr 6 07:00:00 2003 GMT = Sun

    Apr 6 02:00:00 2003 EDT isdst=-1 -14400

    America/New_York Sun Oct 26 05:59:59 2003 GMT = Sun

    Oct 26 01:59:59 2003 EDT isdst=1 -14400

    America/New_York Sun Oct 26 06:00:00 2003 GMT = Sun

    Oct 26 01:00:00 2003 EST isdst=0 -18000

    ```


    Chapter 10'
  merge: -1
  img_proc: true
- pgno: 288
