- pgno: 119
  md: '# 5.1.2 System Crashes During Boot


    If a system crashes during the boot sequence, there are five general types of
    errors. These are distinguished by the type of error message displayed before
    the system returns to the console prompt. Examples of these messages are shown
    below; the actual error message may vary slightly but should be similar to one
    of the following five examples:


    +   - "Failed to open device," possibly combined with more specific error messages
    referring to a specific device


    +   - "Can’t open os_boot" or "No vmnix module list"


    +   - "Machine check," "unrecoverable hardware error," or a similar hardware-oriented
    message


    +   - Any panic message other than machine check

    Each of these possibilities is discussed in its section.


    # 5.1.2.1 Boot Disk Access Failure


    The Tru64 UNIX boot process consists of the following steps:


    +   - The console firmware selects the boot disk from the boot command line or,
    if no device is specified, from the console variable BOOTDEF_DEV.


    +   - The firmware loads the primary bootstrap from block 0 of the boot disk.


    +   - The primary bootstrap loads the secondary bootstrap from blocks 1 to 15
    of UFS file systems or blocks 64 to 95 of AdvFS file systems.


    +   - The secondary bootstrap loads the os_boot program from the root file system.


    +   - The os_boot program loads the Tru64 UNIX kernel file specified by (a) the
    command line, (b) the console variable BOOT_FILE, or (c) a default of "vmnix,"
    in that order.


    +   - The kernel program initializes the system and begins running Tru64 UNIX.


    A message such as "Failed to open device" indicates that the system is unable
    to read the disk from which it''s trying to boot. When this'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'the first thing to do is to verify that the console boot parameters are set
    rectly. This can be done with the following command:


    ```

    >>> SHOW BOOT*

    ```


    which generates output similar to the following:


    ```

    BOOT_DEV         dka100.1.0.15.0

    BOOT_FILE        A

    BOOT_OSFLAGS      OFF

    BOOT_RESET       OFF

    BOOTDEF_DEV      dka100.1.0.15.0

    BOOTED_DEV       dka100.1.0.15.0

    BOOTED_OSFLAGS   A

    ```


    Ensure the default boot disk (BOOTDEF_DEV) is pointing to the correct disk. BOOT_FILE
    defines the kernel to boot; it is usually left blank and defaults to "vmunix".
    BOOT_OSFLAGS defines the default boot flags as a string of zero or more characters,
    with each character representing one flag. Table 5.1 lists the most useful boot
    flags for Tru64 UNIX.


    # Table 5.1 Boot Flags for Tru64 UNIX


    | Flag | Meaning |

    |---|---|

    | A | Boot to multiuser mode |

    | C | Do not process /etc/sysconfigtab at startup |

    | D | Enable full crash dumps |

    | I | Boot to interactive mode |

    | K | Start in kdebug (remote kernel debugger) |

    | S | Boot to single-user mode (the default if none specified) |


    After verifying the console boot parameters (and correcting them if necessary),
    check to see whether the boot disk is "seen" by the console firmware. Enter the
    console command "SHOW DEV" and verify that the boot disk appears in the resulting
    output. If the disk is not listed, there is a hardware problem preventing access
    to the disk. Troubleshooting hardware'
