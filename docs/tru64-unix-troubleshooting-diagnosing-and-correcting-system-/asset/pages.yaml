    filesets in the domain and resume normal operations. You should also file a problem
    report with HP and provide them with the savemeta output and the results from
    a `sys_check -escalate` run on the system.


    +   8. As last resort, if there is no current backup, the salvage(8) utility can
    be used to attempt to recover files from the damaged domain. See section 9.2.4
    for an explanation of the salvage utility.


    # Troubleshooting Tip


    AdvFS domain panic is usually caused by a hardware malfunction. Therefore, if
    you discover a domain panic message in the system messages file or binary error
    log file, it is a good idea to examine the binary error log for hardware failures
    that occurred at or prior to the time of the domain panic.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 9.2 AdvFS


    As mentioned earlier, the default response of Tru64 UNIX is to take the file system
    off-line in a domain panic situation. In addition, the system will create a live
    crash dump, which saves the system''s state at the time the domain panic occurred.
    A live crash dump is a snapshot of the system''s internal state taken at the time
    the problem occurred; it can be used for debugging the problem at a later time.
    A live dump is similar to the information obtained when a computer system crashes,
    except that the system doesn''t reboot itself; it simply writes the information
    onto disk and continues. (For more information about the differences between a
    live dump and a system crash, see Chapter 5.) You can change the system''s behavior
    to one of several responses, depending on your troubleshooting needs, with the
    system parameter “AdvfsDomainPanicLevel.” See Table 9.1 for a list of the possible
    values of this parameter.


    # Table 9.1 AdvfsDomainPanicLevel Values


    | Level | Description |

    | --- | --- |

    | 0 | No live crash dump will be created during a domain panic. |

    | 1 | A live crash dump will be created if a domain panic occurs in a domain that
    has any mounted filesets. This is the default. |

    | 2 | A live crash dump will always be created during a domain panic, whether
    or not the domain has any mounted filesets. |

    | 3 | A domain panic will be promoted into a system panic, causing the system
    to crash. |


    # 9.2.3 AdvFS Error Messages


    AdvFS error messages are special error codes that pertain only to the AdvFS file
    system. They provide additional data that can be used in troubleshooting a problem
    with the file system. These error messages look like the following:


    ```

    # clonefileset export_dmn clone_local another_clone

    clonefileset: can''t create clone file set ''another_clone''

    of set ''clone_local'' in domain ''export_dmn''

    clonefileset: error = E_CANT_CLONE_A_CLONE (-1125)

    ```'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 9.2 AdvFS


    When you encounter one of these errors, you can consult the advfs_err(4) reference
    page for more information to assist you with debugging the problem. In this case,
    the error message makes it rather obvious what the problem is, but other errors
    may not be as obvious as us. We suggest that you scan this reference page before
    you have problems in order to get a feel for the kinds of errors listed there.
    For example, the reference entry for the above AdvFS error is the following:


    ```

    (-1125)

    E CANT_CLONE_A_CLONE

    nYou cannot create a clone fileset from a clone fileset.

    ```


    In this example, you would discover that there is a restriction that prevents
    cloning a clone fileset, and then you would take appropriate action.


    # 9.2.4 Dealing with AdvFS Corruption


    A file system corruption problem is something that nobody wants to encounter,
    but it can happen and should be dealt with swiftly when it does. As most topics
    we cover in this book, there are methods for determining whether a problem is
    really one of corruption or not; and, once you''ve confirmed that corruption exists,
    there are techniques for correcting the problem. These two topics are discussed
    in the following sections.


    # 9.2.4.1 Detecting File System Corruption


    In many cases, there isn''t much that you need to find corruption in a file system.
    Most of the time, either users will let you know or an application will fail with
    a data inconsistency. File system corruption can manifest itself in many different
    ways, and it may not always be obvious whether the problem is really with the
    file system or with one of the layers underneath. When looking at an apparent
    file system problem, keep in mind that it may just be the outward manifestation
    of an underlying device issue. For example, a failing disk could generate a symptom
    such as an AdvFS I/O error, followed by a domain panic. In such a case, see the
    procedure in section 9.2.2 for information on dealing with this kind of situation.


    In general, corruption falls into one of two categories, based on the effect the
    problem can have on the system and the system''s response to it:'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Metadata corruption. This type of corruption is in the file system''s on-disk
    internal structures. This means it can have a wide-ranging effect on the entire
    domain (including other filesets in the same domain). The system''s response to
    a metadata corruption will most likely be a domain panic. In this case, follow
    the domain panic response discussed previously to troubleshoot the situation.


    User-level corruption. This type of corruption occurs in user data files. It is
    usually not detected until users try to access the data and get an AdvFS I/O error
    or simply notice that their data is incorrect. If an AdvFS I/O error is logged,
    it''s necessary to analyze the error in order to determine the best way to deal
    with it.


    In addition, a problem with a device can lead to corruption in a file system.
    In that situation, it''s necessary to correct the device before dealing with the
    corruption. If you try to correct the corruption first, the problem will most
    likely reappear because the underlying device problem remains untreated. Once
    all hardware problems have been addressed, you can move on to detect (and hopefully
    correct) any corruption that remains.


    # 9.2.4.2 Correcting AdvFS Corruption


    To correct a domain that has encountered AdvFS corruption, multiple tools may
    need to be employed. The Tru64 UNIX system has several utilities and techniques
    that can use; we discuss the best ways to use them in the following list:


    +   - verify(8). The verify tool is used to detect and correct metadata corruption
    in an AdvFS domain. Because it must mount the files to perform its work, this
    utility cannot be used if a domain is so badly damaged that its filesets cannot
    be mounted. A clean run of verify (no errors returned) is a good (albeit less-than-perfect)
    indication that problems have been corrected. It is possible for user corruption
    to exist without being detected by verify.


    +   - fixdmn(8). This tool will fix certain types of AdvFS metadata corruption
    so that a domain can be mounted for further correction by the verify tool. Do
    not attempt to use a domain after correcting it with fixdmn without first using
    verify to make certain no other problems exist.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'salvage(8). The salvage command is used to recover files from a domain that
    has been badly corrupted and for which no backups exist. The salvage has two modes:
    normal and sequential. The former is the default and attempts to follow the metadata
    structures to find files. The sequential mode is used to scan the volumes block
    by block, looking for metadata signatures. This technique tends to be much slower,
    but it yields better results. It is recommended that you use the normal mode first
    and then, if the results are not sufficient, use sequential mode.


    +   - Other techniques. For certain types of isolated, user-level corruptions,
    it is possible, using knowledge of the on-line disk structure, to remove or isolate
    the corrupted files so that operations can continue without downtime. After this
    kind of correction, some data may need to be restored, and it''s a good idea to
    run the verify program on the domain to check for other corruption. We do not
    recommend this on your own without contacting HP support for assistance. Without
    the proper knowledge, this type of correction could make your domain inaccessible.


    +   - Restore from backups. When all fails, and once all hardware problems have
    been corrected, the domain can be recreated and the data restored from a known
    good backup. This is always the final option in any corruption situation.


    # 9.2.4.3 Missing or Incorrect AdvFS Volumes


    AdvFS stores the association of domain names to storage volumes in directory /etc/fdmns.
    This directory contains subdirectories for the domain on the system. Located within
    each of these domain directories are symbolic links that point to the devices
    that compose the volumes of the domain. The benefit of this arrangement is that
    the domain name can be manipulated with normal UNIX commands. Unfortunately, this
    can also lead to problems if, for example, the /etc/fdmns directory is accidentally
    removed. Luckily, if that happens, the advscan(8) tool can be used to scan and
    recreate the domain information.


    In addition, because advscan does not know what domain names were before the directories
    were removed, you will need to supply this information by renaming the directory
    to the correct name after advscan has completed its work. You can avoid having
    to use advscan (and having to remember this information) by keeping a good backup
    of the root file system. From this backup, simply restore those directories (/etc/fdmns
    and its)'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'subdirectories) and the problem will be solved. Once again, keeping backups
    can be a great time saver.


    # Troubleshooting Tip


    The advscan tool is useful for debugging certain types of corruptions in AdvFS
    domains because it can read the on-disk structure and provide some useful information
    even without mounting fileset on a domain. If you attempt to use advscan on a
    particular volume and it fails to read useful domain information, this may indicate
    a serious metadata corruption.


    # 9.2.4.4 AdvFS Performance Issues


    In this section, we will briefly discuss how to deal with AdvFS performance issues.
    When faced with any performance problem, you need to characterize the problem
    with some quantifiable data that demonstrates (1) a real problem exists and (2)
    that it is definitely a problem with AdvFS and not with another component of the
    operating system or hardware.


    The advfsstat utility can be used to answer some of these questions. This tool
    has many options and can gather many different types of AdvFS-related statistics,
    so we refer to the reference page for more details. The advfsstat utility will
    gather statistics on a single AdvFS domain (and fileset, if specified) and can
    be set up to perform its data gathering at a specified interval and for a specified
    number of iterations. The main categories of statistics to be collected are the:


    +   - Fileset statistics

    - Lock effectiveness statistics

    - Volume performance statistics

    - Cache effectiveness statistics

    - Metadata statistics


    It is possible to tune some aspects of individual AdvFS file systems or of the
    entire AdvFS subsystem. Although there are some tuning parameters available through
    sysconfig, we don''t recommend changing them unless you really know what you''re
    doing. Generally, if you are having a bad performance problem where you may need
    to change one or more of these parameters, you should already be talking to HP
    technical support. How-'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'ever, there are some configuration adjustments you can make to help improve
    the performance of AdvFS domains under certain circumstances.


    +   - File striping. An individual hot file can be striped across multiple volumes
    in a domain to try to improve the performance of I/O to that.


    +   - Direct I/O. This is a feature of AdvFS that allows a program to open a file
    and write directly to the disk, bypassing the Tru64 UNIX file system cache. This
    should be used only by database applications that perform their own caching; it
    that reduces the double caching effect that occurs when not using direct I/O.
    it''s not a good idea to bypass caching, because it is designed to speed up application
    performance when data items are reused frequently.


    +   - I/O size. The read and write I/O sizes for a volume in a domain can be modified
    using the chvol command. This may possibly improve performance.


    +   - User file fragmentation. Because AdvFS is an extent-based file system, files
    can become discontinuous with pieces over the domain. Making files contiguous
    with the defragment(8) command can improve performance.


    +   - Metadata fragmentation. Some metadata files can become fragmented in the
    same way user files can; however, the defragment utility will not help in all
    cases. When this happens, one way to relieve the fragmentation is to back up the
    domain, recreate it, and restore its files. Alternatively, you can do this process
    on-line using addvol(8) and rmvol(8) if additional disk space is available.


    +   - On-disk version. The AdvFS on-disk structure was changed with Tru64 UNIX
    V5.0 to perform better when there are a large number of files in a single directory
    and when there are a large number of smaller files in a file domain. Both the
    old AdvFS version 3 and the newer AdvFS version 4 are fully supported in Tru64
    UNIX version 5. However, if you have not updated your domains, you may be missing
    out on some performance benefits.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 9.3 UFS


    # Troubleshooting Tip


    To examine an individual file for fragmentation, use the "showfile" command with
    no options, which gives a performance value associated with the file''s fragmentation.
    A 100 percent performance number is the best, with lower numbers indicating greater
    fragmentation of the file. Use showfile with the -x option to examine the file''s
    extent map and to obtain a more detailed picture of its fragmentation.


    # 9.3 UFS


    Unix File System (UFS) troubleshooting is fairly straightforward a couple of reasons:


    +   1. Its structure is less complex than that of AdvFS.

    2. It has been around for so long that the tools and techniques for detecting
    and correcting problems have been fine-tuned for most potential problems.


    # 9.3.1 Dealing with UFS Corruption


    It may occasionally be necessary to deal with corruption on a UFS file system.
    When this happens, the primary tool for detecting and correcting file system corruption
    is the file system checker, fsck(8). When a Tru64 UNIX system boots up, it runs
    /sbin/beckck, which executes fsck on each UFS file system specified in /etc/fstab
    prior mounting the file. If the file system was cleanly unmounted before the boot,
    fsck will not need to do anything; the file system will be mounted and the process
    moves.


    However, if the file system was not cleanly unmounted, fsck will run with the
    -p switch, which is also known as preen mode. In preen mode, fsck will make some
    corrections that are safe to make without user interaction. The correction occurs
    in the majority of cases, this is perfectly fine, in a few cases, this process
    will not result in a file system that is mountable when the process is complete.
    In these cases, the boot process will stop in single-user mode, and manual interaction
    will be required.


    The fsck tool performs an enormous number of checks on a UFS file system and can
    take a long time to run for very large file systems. That''s one'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'reason why HP recommends AdvFS for very large file systems. Rapid recovery
    is one of the major advantages of that file system over UFS.


    In addition to fckck, there are other tools available to assist with debugging
    or correcting UFS file system corruption. Some of these are listed below with
    a short description:


    +   - ncheck, itcheck, dcheck. These tools are older and are used for specific
    types of troubleshooting or correction tasks. In general, these are all replaced
    by fsck today.

    - dumpfi. This tool will provide a detailed output of all the file system structures
    for a UFS file system. These can be useful or when you need to know the current
    values for the filesystem parameters used in its creation.

    - fsdb. This file system debugger allows changes to the on-disk structure of a
    filesystem to be made. The syntax is similar to that of the ad debugger, for those
    familiar with that tool. The fsdb requires very detailed knowledge of the file
    system to be successful.

    - newfs. In order for fsck to do its work, it must have access to a usable superblock.
    Luckily, UFS stores the superblock in many locations throughout the disk. The
    "newfs" command with the -N option can be used to find out all the alternative
    superblocks are located so they can be used by fsck with the -b option.


    # 9.3.2 UFS Performance Issues


    Due to its simplistic design, the UNIX file system tends to perform consistently
    in many different situations. However, there are a few things you can tune to
    an individual file system''s performance based on your workload. These options
    are discussed in the following sections.


    # 9.3.3 Fragmentation


    Fragmentation of a UNIX file system is a different situation from the one discussed
    earlier for AdvFS. UFS is not extent-based, so performance does not suffer if
    a file contains discontinuous blocks. Thus, fragmentation pertains to the use
    of fragments, which can still have a negative impact on system performance. A
    fragment in a UFS file system is a partial block that is used to hold the parts
    of files that are too small to fill a complete data'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'block. This can be either an entire file that is smaller than a complete (8
    KB) file system page or the "leftover" portion of a file that exceeds an integral
    number of file system pages.


    The main problem with larger blocks in file systems is that most UNIX file systems
    contain primarily small files. Studies of typical workloads show that a uniformly
    large block size tends to waste space in the file system. Wasted space is the
    percentage of disk space not containing user data. Conversely, another finding
    is that although smaller blocks are much less wasteful of space, performance suffers
    as a result. Compromise to allow larger block sizes but use a smaller data structure
    called a fragment to store the pieces that don''t fill an entire block.


    Therefore, the best performance on a UFS file system can be achieved by eliminating
    the use of fragments on the file system at the expense of disk space. This may
    be a desirable trade-off for some users; for others it may not. The "optimization
    preference" specifies whether the file system has been set up to utilize fragments
    or not it is created with the "newfs" command or at a later time with tunfs. The
    two possible values for the optimization preference are "space" and "time." Space
    optimization means fragments will be used, while time optimization means they
    will not. The default is to optimize for space.


    # 9.3.4 Tuning UFS File Systems


    The tunfs(8) command modifies the dynamic, tunable parameters of a UFS file system
    located in the superblock. This tool does not alter any data in the file system;
    it only affects the way in future writes will be handled. The command switches
    that you specify indicate parameters are to be changed. The following items can
    be changed using tunfs:


    +   - The maximum number of contiguous blocks that will be written in one transfer
    (the cluster size)

    - The rotational delay between groups of blocks in a file

    - The maximum number of blocks any single file can allocate out of a single cylinder
    group at one time

    - The percentage of free space on the file system held back from use by nonroot
    users (minfree)

    - The optimization preference'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The “tunefs” command works on mounted and active file systems, as well as those
    that are unmounted. However, the superblock for a mounted file system is cached
    in memory, so changes made while a file system is mounted will be clobbered the
    next time the buffers are synchronized. If you attempt to make changes to a mounted
    root file system, the system must be rebooted for those changes to be effective.


    A file system''s superblock contains the values of the parameters that can be
    modified using tunefs. You can find out how particular UFS parameters are configured
    by examining the superblock with the dumpfs(8) tool.


    # Summary


    In this chapter, we have focused on troubleshooting common file system problems.
    With this and the previous chapter, we have tried to give you a feel for how to
    find and fix problems anywhere in the I/O subsystem. Always keep in mind that
    a problem needs to be solved at the lowest layer in the I/O subsystem. A problem
    in the lower layers will have an impact on the upper layers, but the solution
    to the problem must be in the appropriate layer. For example, a disk problem can
    impact the LSM and file system layers. Be careful not to make the mistake of correcting
    file system corruption without first identifying and correcting a possible hardware
    problem that caused it.'
  merge: -1
  img_proc: true
