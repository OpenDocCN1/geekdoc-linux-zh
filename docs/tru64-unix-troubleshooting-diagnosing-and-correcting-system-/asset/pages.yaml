- pgno: 217
  md: '# Storage


    > Data is not information. Information is not knowledge. Knowledge is not understanding.
    Understanding is not wisdom.


    > —Cliff Stoll and Gary Schubert


    Every Tru64 UNIX system is different in the way its storage is configured. There
    are many options available. One system may be configured to use file systems to
    store its data, another may use raw disks, and a third might use logical volumes
    created by the logical storage manager (LSM). Many administrators use tape devices
    for their backups, however others use a newer technique known as disk-to-disk
    backups. Even within a relatively narrow category, such as disk-to-disk backups,
    there are many different technologies one could employ to obtain the desired result.
    A system can be configured to use a combination of these storage options. This
    flexibility is powerful and gives the system administrator many tools to accomplish
    a task; however, it also greatly complicates the process of troubleshooting in
    a generic way.


    Our aim in this chapter is to provide the reader with a set of troubleshooting
    tools and techniques to aid in solving common problems seen in the storage subsystem.
    Because there are so many options, we cannot hope to list all the possible ways
    to troubleshoot storage problems. However, what at first seems like an insurmountable
    problem can be broken down into simpler components. Therefore, we always start
    a storage troubleshooting exercise by first trying to narrow the problem down
    to a component of the I/O subsystem, such as a disk, tape, LSM, or AdFS, among
    others. Sometimes the nature of the symptom makes it obvious which subsystem is
    the culprit, most of the time the symptom does not clearly indicate the broken
    component. For example, a problem in which a user is unable to access his or her
    files might be a simple file permissions issue, but it could'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'also be caused by any of the components in the underlying storage. The hierarchical
    nature of storage is powerful, but it can make it difficult to immediately determine
    which component is failing.


    We begin this chapter at the lowest layer in the I/O subsystem: disks and tapes.
    These discussions include both the actual hardware devices and the kernel drivers
    that support them. After that, we move up to LSM, which is an optional product
    used on many Tru64 UNIX systems for flexibility and redundancy. Because LSM supports
    RAID in software, it is an easy way to provide redundancy in the storage subsystem.
    Finally, we finish the I/O subsystem in the next chapter with a discussion of
    file systems troubleshooting, including the UNIX File System and Advanced File
    System. Each of these areas alone could fill volumes, but we will cover the most
    common problems we have seen.


    # 8.1 Disks


    Within the I/O subsystem, the disk layer is one of the largest and most-components.
    The disk subsystem by itself can be large and complex. When a disk is failing,
    Tru64 UNIX logs an error to the binary error log, which you can examine with a
    number of tools, as discussed in Chapter 3. However, there are other useful techniques
    for diagnosing disk failures. These techniques are brought up in this section.


    # 8.1.1 Detecting Disk Failures


    Disk failures are often detected by the disk driver in the Tru64 UNIX kernel,
    for the simple reason that the driver is the software component that is "closest"
    to the hardware. Errors are usually detected by the kernel and reported to the
    binary error log. The application performing I/O to the disk may possibly place
    an entry in the syslog as well. An application that attempts to access a file
    located on a failing device will usually get an I/O Error (EIO errno) return from
    the failed system call. (The errno mechanism is discussed in greater detail in
    Chapter 3.)


    There are several types of hardware failures that can indicate a failed disk to
    the operating system. These include the following:


    +   - Failed disk drive

    - Faulty SCSI cable

    - Bad SCSI or Fiber hub

    - Failed RAID controller'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Disks


    As with most types of failures, the easiest type of device failure troubleshoot
    is one where the device has failed completely. For example, this type of failure
    on an HP StorageWorks disk drive would most likely display itself with an amber
    light on the front of the drive. A correctly operating drive from HP should have
    green lights while disk activity is occurring; an amber light indicates a fault
    of some kind. A less conclusive way to find a failure by physical inspection is
    to check for deen lights when you know that I/O is being attempted to the device.
    If the light stays out, it''s possible that it has simply burned out, but it could
    also indicate a problem with the drive.


    In addition, you can confirm a suspected problem by checking for any noise coming
    from the drive. Active disk drives are constantly spinning; a drive that''s not
    spinning could have failed (but it could have been spun down by the power management
    subsystem). It may also be the case that a drive is intermittently failing, which
    is a much tougher situation to diagnose than if it had failed. In this kind of
    situation, checking the system logs might provide a better indication of the problem.


    # Troubleshooting Tip


    We''re on the subject of locating a hardware device, we''d like to point out the
    "locate" option to the hmgwr command. This option helps to identify some types
    of SCSI devices. This command can be used to physically locate a SCSI disk. For
    example, the following command flashes the light on a particular SCSI disk for
    one minute:


    ```

    # hmgwr locate -id 83 -time 60

    ```


    You can then check the disks for the drive whose light is flashing. This may or
    may not be helpful, depending on how much disk activity is happening on the system
    it may be difficult to distinguish your attempt to flash the light from normal
    disk activity. It''s also not useful if the drive is behind an intelligent controller
    of some kind, such as an HSZ50. Naturally, if the drive has totally failed, you
    will not be able to flash the light.


    Although it can be useful, physical inspection usually doesn''t yield the first
    indication that a drive has failed. If physical inspection doesn''t bear'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'fruit, you can try to get some response from the disk at the system console.

    When the system is at the console prompt, try the following command:


    ```

    >>> SHOW DEVICES

    ```


    A basic indication of whether the disk is responding at all is whether it is present
    in the output from this command. If the disk is not listed—and assuming that the
    disk is normally a well-behaved device—you can be pretty confident that it has
    failed. In this case, the drive can be reseated or power cycled to attempt to
    revive it. Generally, if the drive fails to respond, the only thing that can be
    done to correct the problem is to replace the faulty drive as soon as possible.
    You can check to make sure that external power is reaching the drive and its cabinet.
    On the other hand, if the drive shows up at the console, but indicates errors
    from the operating system, you''ll need to do some further troubleshooting to
    determine the cause.


    After verifying the console can see the device, another method for diagnosing
    with a SCSI device is to make sure the kernel sees the device at boot time. In
    Tru64 UNIX version 5, the cam subsystem in /etc/sysconfig (you may not already
    have any entries) contains a parameter that can be used to turn on the display
    of disk names at boot time:


    ```

    cam:

    cam_bootmgs = 1

    ```


    If this parameter is set to 1, the kernel will print a list of all SCSI devices
    found as it boots. If the questionable device is not in the list, the kernel cannot
    see the disk and running, which means the disk has probably failed.


    Once a system is up and running, you can use the tools from the operating system
    to determine whether a drive is functioning properly or not. The most important
    tool is the binary error log, which can be examined with various utilities, as
    discussed in Chapter 3. There are two types of errors recorded in the binary error
    log: hard errors and soft errors.


    A soft error is usually a correctable medium error. An example of such error is
    a bad block replacement (BBR), which is an automatic replacement of a faulty block
    on a disk by the device itself without operating system intervention. When this
    happens, the device will let the operating system know that the BBR occurred,
    but was corrected; the requested data was successfully retrieved on one or more
    attempts of the I/O operation. The operating system will log this as a soft error.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 8.1 Disks


    Occasional, isolated soft errors are normal and most likely don''t indicate a
    serious problem. However, if many soft errors appear on the same device over a
    period of time, it is a cause for concern and should be investigated. In our opinion,
    a drive logging multiple BBRs should be replaced because it indicates that the
    drive is most likely on the way to failure. Most drives will not let the operating
    system know that a bad block has been replaced until there has been some effect,
    such as a retry being needed to get the data requested. Therefore, a report of
    BBRs indicates that the drive has already exhausted the cache of spare blocks
    it can use to replace bad blocks on its. By the time a soft error is logged, the
    drive is already on the way to going bad. In addition, retries of an operation
    due to a soft error could waste the system''s time and could negatively affect
    system performance.


    Hard errors, on the other hand, indicate that a serious, uncorrectable error occurred
    on the device in question. This is not good from the perspective of a user trying
    to access the data on the device. This is very good news for the troubleshooting
    problem, because it provides a strong indication of exactly which piece of hardware
    has gone bad. Once this identification has been made, it''s usually an easy task
    to replace the faulty hardware and return the data to service.


    # 8.1.2 Recovering from Disk Failure


    When a SCSI disk fails, the operating system will not give the replacement device
    exactly the same characteristics as the failed device. For example, in Tru64 UNIX
    version 5, device names are tied to worldwide ID numbers (WWWIDs), the new disk
    will, by default, have a different device name from the one it replaced. However,
    you might want the replacement disk to take on the same characteristics as the
    original device. The "redirect" option in hwmgr(8) command enables you to assign
    such characteristics. For example, if you have an HSZ (RAID) cabinet and a disk
    fails, you can swap the failed disk and use the "redirect" command to bring the
    new disk on-line as a replacement for the failed disk.


    Do not use this procedure alone if a failed disk is being managed by AdFS or LSM.
    Before you can swap disks, you must put the disk from the management application
    into an appropriate state or remove the disk from the management application.
    For example, a failed drive in an AdFS domain would make the domain unusable until
    it was remade and the data restored in some fashion. In addition, the replacement
    disk must be of the same type for the redirect operation to work.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'The following example shows how to use the redirect option:


    ```

    # hmwgr show scsi

    ```


    | | SCSI DEVICE DEVICE DRIVER NUM DEVICE FIRST |

    |---|---|---|---|---|---|---||

    | HWID: DEVICE- HOST- TYPE SUB- OWNER PATH VALID |

    | 23: | 0 | clul disk none 2 | 1 | dsk0 | [0/3/0] |

    | 24: | 1 | clul cdrom none 0 | 1 | dskm0 | [0/4/0] |

    | 25: | 2 | clul disk none 0 | 1 | dsk1 | [1/2/0] |

    | 30: | 4 | clul tape none 0 | 1 | tape2 | [1/6/0] |

    | 31: | 3 | clul disk none 0 | 1 | dsk4 | |

    | 37: | 5 | clul disk none 0 | 1 | dsk10 | [2/5/0] |


    This output shows a failed SCSI disk with hardware ID (HWID) 31 and a SCSI device
    ID (ID) of 3. The component has no valid paths. To replace this failed disk with
    a new disk that has the same device-special name (dsk4) and device information,
    use the following procedure:


    +   1. Perform the hardware steps to install the drive as described by the hardware
    manufacturer.


    +   2. Use the following command for the operating system to find the new device:


    ```

    # hmwgr scan scsi

    ```


    This command probes the SCSI subsystem for new devices and automatically registers
    those devices. You can repeat this command and obtain the SCSI device identifier
    (ID) of the replacement device.


    +   3. Use the following command to assign the component characteristics from
    the failed disk to the replacement disk. This example assumes that the SCSI device
    id (DID) assigned to the new disk is 36:


    ```

    # hmwgr redirect scsi -src 3 -dest 36

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 8.1.3 Removing Stale Path Using hwmgr


    You will sometimes need to deal with multiple I/O paths, particularly in a fiber
    channel storage configuration. This kind of setup provides multiple data paths
    to a single device; when one active path fails and becomes stale, it must be dealt
    with. The following set of commands will remove the stale path and restore it,
    if necessary:


    +   - hwmgr -delete component -id <did>

    - hwmgr -scan scsi

    - dsfmgr -m <new devname> <original devname>


    # 8.1.4 Disk Label


    The disk label on a UNIX disk tells the system where to find the partition table
    and other important information. There will be times when you need to manipulate
    the disk label, which is generally done using the Tru64 UNIX disklabel(8) command.
    This usually works correctly; however, it is possible to run into trouble, so
    we have a few items in this section to help you avoid problems.


    # 8.1.4.1 Recovering a Corrupted Disk Label


    When a disk''s label becomes corrupted, you may have to recover the label from
    a known correct label that was previously saved to a file. You should always keep
    the labels for your disks available in case you have a problem and need to recover
    a label. The way to write a label into a file is with a command similar to the
    following:


    ```

    disklabel -r dsk4 > dsk4_label.out

    ```


    Once you have this file on disk, you can easily recover it at any time. The option
    to recover a disk label from a disk file is -R. A sample command to accomplish
    this for a corrupted disk label would be the following:


    ```

    disklabel -z dsk4

    disklabel -rw dsk4

    disklabel -Rr -t advfs dsk4 dsk4_label.out rzxx

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 8.1.4.2 Writing Boot Blocks to a Disk


    When recovering a disk''s label as shown above, it''s possible to change the boot
    blocks for the disk inadvertently to UFS when the disk is actually an AdvFS boot
    disk. This happens because the default, if the -t option is not specified, is
    to write UFS boot block to the disk. If you recover the label but don''t specify
    -t advfs, UFS boot blocks are written, rendering the disk unbootable. This is
    quickly rectified by following the above disklabel procedure and specifying the
    correct options as follows:


    ```

    # disklabel -Rr -t advfs <disk> <filename> rzxx

    ```


    # 8.1.4.3 Partition Is Open by Another Application


    Occasionally, when you try to edit a disk''s label, the response from the "disklabel"
    command may be something like:


    ```

    disklabel: ioctl DIOCSDINFO: Open partition would move or shrink

    ```


    This means that you are attempting to change or alter a partition which has an
    actively mounted file system. Such a modification to an on-line file system could
    wreak havoc on your Tru64 UNIX system, so the system will not allow you to continue,
    thereby protecting you. In some cases, message occurs while editing the disk''s
