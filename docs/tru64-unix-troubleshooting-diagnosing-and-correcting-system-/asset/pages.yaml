- pgno: 272
  md: '# 2. Products that must be deleted before the update installation can proceed


    For the first type, the installer displays a dialog box that lists the products
    that may need to be reinstalled. You can exit the update installation and manually
    remove this software or you can continue. In the latter case (continuing without
    removing the layered product), it''s important to test the layered software as
    soon as the update installation is complete. It may also be necessary to update
    the layered product to a newer version that is more compatible with the new version
    of the operating system.


    In the second case above (a layered product must be removed to continue the update),
    the installer provides the option to remove the layered product. You can either
    take this option (i.e., delete the product and continue) or you can exit the update
    installation; it is not possible to continue without removing the conflicting
    software. If you choose to exit at this point, no changes are made to the system.
    The conflicting software is not supported by the new version of the operating
    system and the software is critical to your operation, you probably wouldn''t
    continue unless you have an alternative way to provide the critical functionality.
    If you do continue, note that the layered product deletion will occur immediately.
    The deleted software will not be automatically restored if the update installation
    is canceled at a later point.


    # 10.1.9 File-Type Conflicts


    All system files (i.e., those files distributed as part of the operating system)
    have a specific file type: regular file, directory, hard link, symbolic link,
    block device, or pipe. In an update installation, the installer expects to find
    each system file of the same type as was shipped with the currently installed
    version of the operating system. A file-type conflict exists when a system file
    has a different type. There are two types of file type conflicts:


    +   1 Serious conflicts, which must be resolved before the update installation
    can continue


    +   2 Minor conflicts, which can optionally be ignored while the update installation
    proceeds'
