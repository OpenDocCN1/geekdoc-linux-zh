    If the syslog configuration is absent, syslog defaults to these rules:


    These defaults instruct syslog to send all error messages to the console and all
    kernel panic messages to all logged-in users. No files are written.


    # 3.1.1.6 Sending Messages to syslog from Scripts


    Since syslog is the primary logging mechanism for the operating system, occasionally
    makes sense to use syslog for generating custom messages from system administration
    or user scripts. The standard mechanism to send messages to syslog from a script
    or the command line is the logger(1) command. The logger command provides a handy
    command line interface to the syslog() routine. The tool''s syntax allows specification
    of both the facility and severity; in addition, it provides the ability to specify
    either the message to be logged or a file that contains the message text. For
    example, the following command entered on the command line


    ```

    # logger -p user.debug "Program error"

    ```


    will cause syslog to log the following message:


    ```

    # tail /var/adm/syslog.dated/current/user.log

    Jul 13 22:23:05 mysydog root: Program error

    ```


    This message will end up in the destination specified in /etc/syslog.conf for
    the "user.debug" facility,severity pair.'
