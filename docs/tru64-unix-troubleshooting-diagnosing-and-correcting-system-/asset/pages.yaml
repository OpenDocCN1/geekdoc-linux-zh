  md: '# 5.1 Boot Failures


    If the problem still exists, the most likely cause is a missing or corrupted osf_boot
    file or more widespread corruption of the root file system or the entire disk.
    Boot the system from CD-ROM and the root file system from partition “a” of the
    root disk. For a UFS file system, this is accomplished by a command such as the
    following:


    ```

    # mount /dev/disk/dskla /mnt

