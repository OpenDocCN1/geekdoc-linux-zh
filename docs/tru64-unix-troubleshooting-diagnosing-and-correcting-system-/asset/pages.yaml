    ot a shell prompt. The “option” arguments allow the operator to set kernel

    parameters interactively, a feature that can be very useful in some circum-\stances
    (but not this one). At the “” prompt, enter a new kernel file name;

    osf_boot will attempt to find kernel file and load it. In64 UNIX

    version 5.1A and later, you can also enter “ls” at this prompt for a listing of

    t root directory or any subdirectory within the root file system. It is

    extremely useful when trying to remember the name of an alternative

