- pgno: 77
  md: '# 3.4 Kernel Debugging Tools


    Tru64 UNIX has some helpful tools available for analyzing the system at the kernel-data
    structure level. Naturally, to be successful at using these tools requires an
    internals-level knowledge and source code that you may not have. If you don''t,
    we recommend you acquire the necessary skills either by taking an internals class,
    reading an internals book, or consulting an expert.


    Because we don''t discuss internals here, these tools may not be of much use to
    you if you learn the syntax of the tool itself. One of the reasons you might need
    to use these tools is if your system experienced a panic and you might want to
    analyze the resulting crash dump to determine what the problem was. Also, you
    might want to look at some kernel variables to determine whether kernel tuning
    may be necessary. We discuss these topics in Chapter 5, so please consult that
    for more information on how to use these tools to perform their functions.


    # 3.4.1 The dbx Debugger


    The standard debugger that comes with Tru64 UNIX is called dbx. This has been
    the traditional debugger since the days of Unix, and it can be used for debugging
    user-level programs with appropriate developer''s license, or for debugging at
    the kernel level with no additional license required. Usually, in order to use
    useful data included in a program or kernel module when debugging, programs must
    be compiled with debugging information included by using the “g” flag (as the
    -g2 flag) to the C compiler. This option tells the compiler to include the maximum
    amount of symbol table information that can be used for debugging. Without this
    information, the task of debugging an executable program is much more difficult
    and akin to reading the program''s disassembled raw instructions. Including this
    symbol table information comes at the cost of a larger executable.


    The dbx debugger can be used to examine a program in one of two ways. First, you
    use it to analyze a core file from a program that received a signal that caused
    it to core dump. Many administrators find files on their system and consider them
    a nuisance, they appear only to take up space on the file systems and need to
    be cleaned up from time to time in order to conserve disk space. This is most
    likely true in the case of user directories where programmers develop and test
    their code. In that environment, it would be normal to find lots of core files
    from programs under active development.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'A correctly functioning executable program should not produce a core file,
    so it should raise a red flag if you find core files in system directories. As
    most programmers know, a core file can be a useful diagnostic tool if you know
    what to do with it. If you find a core file in the root directory or another system
    directory, you should first try to determine the program that created the file:


    ```

    # file /core

    /core: core dump, generated from ''lpd''

    ```


    To examine a core file generated from the line printer daemon, you would use a
    command such as the following:


    ```

    dbx /usr/lbin/lpd/core

    dbx version 3.11.10

    Type ''help'' for help.

    Core file created by program ''lpd''

    warning:/usr/lbin/lpd has no symbol table -- very little is supported without
    it

    ```


    ```

    signal Segmentation fault at >*[select, 0x3ff800d5758

    beq r19, 0x3ff800d5770

    (dbx)

    ```


    You can also use dbx to examine a running program. For example, you examine a
    system program named volnotify with a process identifier of 682, you would use
    a command such as the following:


    ```

    dbx -pid 682 /usr/sbin/volnotify

    dbx version 3.11.10

    Type ''help'' for help.

    warning: /usr/sbin/volnotify has no symbol table -- very little is supported without
    it

    ```


    ```

    stopped at>**[__poll, 0x3ff80112b28 beq r19,

    0x3ff80112b40

    (dbx)

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 3.4 Kernel Debugging Tools


    Similar to the way you use dbx to analyze user programs, you can analyze either
    a running kernel or a crash dump. To use dbx to examine the kernel on a running
    system, you would use a command such as the following:


    ```

    dbx -k /vmunix /dev/kmem

    ```


    Alternatively, to look at a crash dump with a file name of vmzcore.l and with
    a kernel called vmunix.l, you would use this command:


    ```

    dbx -k vmunix.l vmzcore.l

    ```


    For example, if you wish to examine a kernel parameter ubc_maxpercent, you can
    issue a command such as the following:


    ```

    (dbx) print ubc_maxpercent

    100

    ```


    # 3.4.2 The Kernel Debugger


    The kernel debugger, kdbx, is essentially the dbx debugger with a wrapper around
    it that provides some enhancements for looking at crash dumps and running systems.
    A typical kdbx command to examine a running Tru64 UNIX system''s kernel would
    be the following:


    ```

    kdx -k /vmunix /dev/kmem

    ```


    A similar command for examining a crash dump with a kernel name of vmunix.l and
    a crash dump name of vmzcore.l would be as follows:


    ```

    kdx -k vmunix.l vmzcore.l

    ```


    For example, if you wish to examine the name cache entries, you can use the kdbx
    macro "namecache" as follows:'
  merge: -1
