  md: '# 2.1 The Troubleshooting Process


    work, then at least one of the possibilities has been eliminated. In cases where
    there are multiple possible solutions, try the quickest or least disrup- tive
    one first.


    # 2.1.5 Prevention


    It may seem a little strange to consider problem prevention as part of the troubleshooting
    process. After all, if a problem is prevented from occurring, there isn''t much
    to troubleshoot. Nevertheless, prevention is part of the cycle shown in Figure
    2.1. Problem prevention and detection are frequently related, as shown in the
    RAID system example in section 2.1.1. Early detec- tion correction of minor problems
    can prevent them from growing into major problems.


    Prevention can also be thought of as proactive troubleshooting. The easiest problems
    to solve are the ones that are prevented from occurring at all. To paraphrase
    an old proverb: once of prevention is worth a ton of troubleshooting. Preventive
    actions also have the advantage that they can be done at your convenience, and
    usually inconvenient—moment. in response to a problem that occurs at a random—and
    usually inconvenient—moment.


    Prevention includes not only avoiding problems, but also preparing for those when
    problems happen. No matter how reliable your system is or how proactive you are,
    some problems are inevitably going to happen. And no matter how much redundancy
    is present in your system, a severe'
