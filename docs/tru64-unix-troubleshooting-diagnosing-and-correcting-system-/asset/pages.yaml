    executes a number of startup scripts containing environment variables and commands.
    The first of these is a system-wide initialization file: /etc/profile for the
    Bourne and Korn shells, /etc/csh.login for the C shell. After the global login
    script, the shell executes the user''s individual startup scripts. For the C shell,
    these are .cshrc and login (in that order) in the user''s home directory. The
    Bourne and Korn shells both execute .profile in the home directory; the Korn shell
    then executes the script pointed to by the ENV variable, if it is defined.


    The purpose of these startup scripts is to create aliases, define important environment
    variables, and perform other housekeeping functions, such as setting the terminal
    type. If an error occurs in one of the scripts, the user''s environment will not
    be set properly. If there is a serious one, such as illegal command syntax, there
    will be at least an error message. However, if there is a problem where a command
    is legal but doesn''t do what is intended, it can be a little harder to troubleshoot.
