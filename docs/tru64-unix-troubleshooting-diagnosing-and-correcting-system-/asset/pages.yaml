- pgno: 33
  md: '# 2.2 Troubleshooting Techniques


    An example of this technique occurred in the case of a three-node cluster that
    experienced severe problems after some hardware components and firmware were upgraded.
    A combination of several unlikely events left the three members of the cluster
    with three different views of the attached storage, none of which matched the
    hardware database previously used by the cluster. As a result, the cluster was
    completely down. None of the members would boot, even to single-user mode.


    This problem was too complex to attack all at once; it was necessary to break
    it down into more manageable pieces. The first step was to get one member booted
    successfully from the cluster''s emergency repair disk. Member''s hardware database
    was repaired, and the corrected database was copied to the cluster root file system.
    The now-working member was rebooted to form a one-node cluster.


    At this point, the cluster was sufficiently restored that it could be placed into
    limited production service, which reduced the urgency of solving the remaining
    problems. The corrective process was continued by copying the repaired database
    to each of the other member boot partitions. Each member was booted to single-user
    mode in order to correct additional problems and then finally rebooted into the
    cluster until everything was back to normal.


    The problems on this cluster were too serious and widespread to troubleshoot all
    at once. It was necessary to break the problem down to manageable pieces and resolve
    these one at a time. This step-by-step process allowed a complex and difficult
    problem to be solved in a systematic manner. It also allowed service to be restored
    to users before all parts of the problem were completely resolved.


    # 2.2.4 Retrograde Analysis


    Retrograde analysis is the logical deduction of causative events based on their
    observed effects. The term is borrowed from a particular class of problems in
    a final position is provided and the object is to deduce the sequence of moves
    that led to that position. This technique is most used when after-the-fact analysis
    of a problem—particularly a one-shot or intermittent problem—in order to understand
    and prevent it from happening again. Ideally, all problems would leave clear and
    undisputed evidence of the events that caused them.


    Unfortunately, problems are rarely so accommodating, and there is sometimes little
    or no evidence of what actually happened. In such cases, reasoning about what
    must have happened is the next best thing. In some'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 2.2 Troubleshooting Techniques


    cases, this will point to possible sources of evidence that were not previously
    apparent; with luck, you may find some information to confirm your theory of what
    happened. Sometimes, however, there will be no evidence to prove or disprove the
    validity of retrograde analysis. Without such evidence, confidence will be less
    than 100 percent that the problem has been correctly analyzed. How much less depends
    on a variety of factors: how clearcut the chain of reasoning is, the likelihood
    of other causes, and your experience with similar situations.


    An example of retrograde analysis occurred in the case of a system that kept crashing
    at random intervals. The system would display a panic message indicating an AdvFS
    problem and reboot, but it never produced a crash dump. Even though the system
    had crashed numerous times, there was no evidence of any problem in the system
    log files. The system administrator detailed records, but there was no discernible
    common factor among the crashes.


    Because there was no direct evidence of a problem, retrograde analysis was used
    to deduce possible causes of the crashes. The AdvFS panic message provided a starting
    point. Recurring AdvFS panics are typically caused by one or both of the following:


    +   - File system metadata corruption

    - I/O failures while updating file system metadata


    The verify(8) command was used to check the metadata on all of the AdvFS systems,
    but no errors were found. With metadata corruption ruled out, I/O problems appeared
    to be the likely cause. The typical sequence of events in an I/O-induced AdvFS
    panic is shown in Figure 2.2. Normally, however, this sequence of events should
    have left some indication of problem in one of the system logs.


    ![](img/0c61d0bcd2bcbfa9f85f77a2369d3610_34_0.png)'
