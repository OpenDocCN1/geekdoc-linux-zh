- pgno: 159
  md: '# System Performance


    > Performance is your reality. Forget everything else.

    —Harold Geneen


    The performance of a computer system can best be defined as the system''s ability
    to accomplish its assigned tasks. Good performance means that the system is performing
    its workload in an acceptable amount of time and with acceptable usage of system
    resources. This can be difficult to quantify because it depends on a variety of
    factors that are both objective (performance indices) and subjective (user perception).
    On the other hand, it''s usually pretty obvious when a performance problem exists:
    things don''t happen within acceptable (objective or subjective) time or resource
    constraints.


    Managing system performance has two primary aspects: maximizing performance (proactive)
    and responding to specific performance problems (reactive). Maximizing system
    performance is an ongoing task of evaluating current performance, making adjustments,
    and observing the effects. This is a subject about which much has been written,
    and it is really beyond the scope of this book. Because our focus is on troubleshooting,
    we will concentrate on the second aspect of performance management: responding
    to specific performance problems.


    Among the many resources available on the subject of performance and tuning, we
    especially recommend the Tru64 UNIX System Configuration and Tuning Manual. This
    document has improved with each successive version, and the current edition is
    clear, informative, and practical—a fine example of what computer manuals should
    be like. Anyone interested in system performance should spend some time going
    through this manual: the time spent will be a worthwhile investment.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 6.1 General Principles


    At the most basic level, performance problems are really very simple. All activities
    require certain amounts of one or more resources. If resources are not available,
    the activity can''t be performed as desired. This is true only with respect to
    computers but in all aspects of life. For example, if you like to take a two-week
    vacation to Hawaii, you need two primary resources: money to pay for the trip,
    and time off to take the trip. If either resource is lacking, you can''t take
    the desired vacation. Such resource shortages lead to workarounds. For example,
    you could choose to work within the available resources by taking a less expensive
    or shorter vacation. Alternatively, an extra amount of one resource sometimes
    makes a tradeoff possible. If you have plenty of money but only a week of paid
    vacation, you might be able to take a week of unpaid leave in order to have the
    full vacation. Such tradeoffs aren''t always possible; in this example, the tradeoff
    doesn''t work in the other direction. If you don''t have enough money to go to
    Hawaii, it doesn''t really matter whether you have enough off.


    With regard to computer systems, a resource is any component (hardware or software)
    needed to accomplish a particular task. For practical purposes, the main resources
    are the three primary components in every introductory computer class: CPU, memory,
    and I/O. Every computer job needs a certain amount of each of these resources.
    Some activities require more than one resource than another; the actual amounts
    needed depend on the type of work being performed. Therefore, understanding a
    system''s workload is extremely important when it comes to identifying potential
    resource bottlenecks. Unfortunately, the trend toward consolidating multiple functions
    onto a single large server complicates this understanding. If a system is responsible
    only for serving Web pages, its I/O (particularly network connections) is likely
    to be the most critical resource. But if the system also runs an Oracle database
    and serves as a development platform for mathematical models, good system performance
    will require a different mix of resources depending on the workload mix at any
    particular time.


    # 6.1.1 Understanding System Performance


    There are a variety of factors that affect the performance of a Tru64 UNIX system,
    some of which are nontechnical and beyond the ability of a system administrator
    to change. Understanding the nature of these factors is a fundamental part of
    performance management and troubleshooting. Of these,'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'perhaps the most important factor to understand is the system''s normal environment
    and workload. It''s difficult to identify abnormalities without first knowing
    what is normal. This understanding is gained over time by monitoring a system
    to determine its average throughput and behavior. Knowing a system''s typical
    workload also allows an administrator to see short- and long-term trends in system
    activity, and to predict the effects of changes to the system configuration, applications,
    or usage patterns.


    As a starting point for understanding a system''s performance, the following questions
    should help the effort to characterize and understand the normal workload:


    +   - What are the types of applications running on the system (for example, database
    server, program development, Web server?)

    - What is the average number of users on the system at each time of day?

    - What are the busiest times of operation?

    - Which jobs run at which times of the day?

    - What are the known resource-intensive jobs?

    - What is the average response time at various times of the day?


    The answers to some of these questions are best obtained by logging into the system
    and monitoring its behavior. Tru64 UNIX provides tools and utilities that allow
    the system administrator to view the usage of various system resources. We discuss
    several of these tools in more detail at appropriate places throughout this book,
    but a short list would include vmstat, iostat, advfstat, netstat, collect, and
    sys_check. All of these are part of the Tru64 UNIX distribution. In addition,
    there are also popular (but unsupported) performance monitoring tools available
    on the Internet, such as "monitor" and "top."


    Over time, a system administrator should gain an understanding of what is normal
    for a particular system. "Normal," though, is a relative term and assumes a stable
    workload. This isn''t always the case in real life; for example, a financial management
    system may be quite speedy during the first part of the month, but nearly unusable
    towards the end of the month as the system is under stress to complete an end-of-month
    close-out. In this case, both situations are normal as long as it is understood
    what the system is being asked to do and when. If, however, the system''s'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'response gets suddenly worse in the middle of a month, such behavior would
    most likely be considered abnormal and worthy of investigation. The "historical
    mode" feature of the collect(8) utility is useful for understanding a system''s
    performance over time.


    Some of the characterization questions listed above are best answered by working
    closely with the user community and understanding their needs and perceptions.
    Users tend to accept an average response time as normal, and jobs are expected
    to finish in about the same amount of time they run. These expectations are always
    valid, but they nevertheless. In a time-sharing system such as Tru6 UNIX, an individual
    user''s response can vary greatly depending on other work going on the same time.
    Users who come from a PC-only background may not understand this, and it is up
    to the system administrator to educate them rather than affect a change to the
    system''s behavior.


    In addition, you may discover that a user''s perception of reduced response time
    or increased execution time is due to factors outside your control. For example,
    a user may be connected to the system via a slower connection than usual, resulting
    in slower response to that user only. The system may be performing well within
    acceptable parameters but still slower to that particular user. A system administrator
    needs the proper skills to interpret user complaints; one of the most important
    skills is patience. You will occasionally receive feedback that "the system slows
    down." When this happens, work with the affected users to quantify their perceptions
    and enlist their help in collecting basic troubleshooting information, such as
    the following:


    +   * What is the user''s measured response/execution time versus normal?


    +   * Are reported hung processes truly hung?


    +   * Did the problem occur suddenly or did it degrade over time?


    +   * Is the first time this behavior has been experienced?


    +   * Can the problem be duplicated?


    +   * How many (and which) users were on the system at the time of the problem?
    What were they doing?


    +   * Is the problem on the local system or a remote system?


    Going through this process with users will help to educate them and (hopefully)
    impress upon them the importance of collecting useful'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# General Principles


    rather than just complaining that the system is slow. That way, you will be making
    them part of the process of identifying the problem and finding the solution.


    # 6.1.2 Troubleshooting Guidelines


    In the following sections, we''ll discuss each of the three main resources (CPU,
    memory, and I/O) with respect to common performance problems and possible corrective
    actions. Before getting down to that level, we''ll present some general principles
    in the form of a “top 10 list” of performance troubleshooting guidelines. These
    guidelines are based on recurring themes from performance problems that we''ve
    investigated in our experience as support personnel.


    # Guideline 1: Every situation is unique.


    Don''t assume that a solution that worked for one problem or one system will necessarily
    work in another situation. Similar problems often have similar causes, but not
    always. It''s certainly worth looking for similarities and patterns when troubleshooting,
    but don''t focus on one particular solution just because it worked in the past—at
    least until you perform further analysis.


    # Guideline 2: Work on one problem at a time.


    Sometimes a problem with one resource is caused by problems in another area. Fixing
    the primary problem may resolve others as well. The trick is to determine whether
    multiple problems are related and, if so, which one is the fundamental problem.
    We''ll discuss common interactions in the later sections of this chapter.


    # Guideline 3: Look for memory problems first.


    Memory is the resource for which adjustments usually provide the best return.
    This applies both to tuning—small adjustments can yield large results—and to adding
    more physical memory. Adding memory to a system is much less expensive than adding
    CPU or I/O resources.


    # Guideline 3.5: But don''t assume memory is cure-all.


    Insufficient memory is not the cause of every performance problem. When it isn''t
    the cause, throwing memory at the problem won''t solve any-'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'thing (and, in rare circumstances, can actually make the problem worse). Check
    for memory problems first, but if you don''t find any, look for other resource
    issues.


    # Guideline 4: CPU bottlenecks can be caused by problems in other


    Shortages of memory or I/O bandwidth can cause the system to use extra CPU time
    trying to compensate. Resolve memory and I/O problems first, and CPU bottlenecks
    may disappear.


    # Guideline 5:A motor scooter will never win the Indianapolis 500.


    It comes as no surprise that some systems are more powerful than others. If a
    system has inadequate CPU power to perform its tasks, it will never perform well—no
    matter how well it is tuned.


    # Guideline 6:You can''t put 11 gallons in a 10-gallon hat.


    Inadequate memory, like inadequate CPU resources, will prevent a system from performing
    well, despite the best tuning efforts in the world. If you''ve tried tuning and
    the system still has a memory bottleneck, strongly consider adding more physical
    memory. This principle has a corollary: a small increase in workload can reduce
    performance dramatically if the system is near capacity. (If the 10-gallon contains
    9.5 gallons, everything is fine. Add one more gallon and the hat overflows.)


    # Guideline 7:A fast system with one part is a slow system.


    Good system performance requires that all necessary resources perform adequately.
    If one resource has problems or doesn''t have sufficient capacity, it doesn''t
    matter if the other resources are blazing fast. Anyone who has surfed the Internet
    via a slow dialup connection has experienced this principle firsthand. It doesn''t
    matter how powerful your computer is; connection speed (bandwidth) is the limiting
    factor when it comes to Web surfing.


    # Guideline 8: Swapping is bad.


    Swapping is one of the worst things that can happen to system performance. Data
    access is reduced from memory speed to disk speed, which is'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'orders of magnitude slower. Avoid swapping at all costs; if this means buy-ing
    additional memory, it''s well worth the investment.


    # Guideline 9: Write-back cache is good.


    Disk writes can be extremely slow, particularly in mirrored or RAID-5 configurations.
    Write-back cache improves throughput significantly and should be considered a
    necessity.


    # Guideline 10: Know when to quit.


    Remember the law of diminishing returns. Significant performance problems should
    certainly be resolved, but further work to squeeze out the few percentage points
    of performance can take more effort than what has gone before. If your situation
    absolutely requires the maximum level of performance, this effort may be worthwhile.
    In most situations, it''s not.


    # Memory Resources and Performance


    To understand how memory resources affect system performance, it''s necessary
    to understand how memory is managed by the Tru64 UNIX kernel. In broad terms,
    memory resources are needed for three main functions. First, all processes require
    memory to run their executable code and hold their data. Similarly, the kernel
    requires memory for its own instructions and data structures. Finally, a Unified
    Buffer Cache (UBC) is used to hold data blocks that have been read from I/O devices
    that contain file systems. All of these uses must be considered when considering
    the overall memory usage of a Tru64 UNIX system.


    The basic unit of memory is called a page. The standard size of a page in Tru64
    UNIX is 8,192 bytes (8 KB). In all versions of Tru64 UNIX up to including V5.1A
    (the current version of this book was writ-ten), the page size is fixed and cannot
    be changed. However, it''s possible that future versions may be less restrictive
    in this area.


    At boot time, the Tru64 UNIX kernel instructions and data structures are “wired”
    into memory, which means that they will always be resident in physical memory
    and can never be p out. As such, the wired memory set aside for the kernel is
    permanently assigned and can never be used for processes or the UBC. The remainder
    of physical memory becomes “managed” memory (i.e., it is placed under the control
    of the kernel''s vir-ual memory (vm) subsystem). A managed page can be in one
    of states:'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 6.2 Memory Resources and Performance


    active pages belong to either a running process or the UBC; free pages don''t
    belong to either. In addition, active pages are either clean (unmodified) or dirty
    (modified). Finally, the oldest active pages belonging to processes are known
    as “inactive,” while the oldest UBC pages are called “least recently used” (LRU).
    These are the first to be selected by the vm subsystem for page reclamation, which
    we will discuss further in the next section. This terminology can be a little
    confusing, because the “active list” of pages includes both the inactive and LRU
    pages.)


    # 6.2.1 Paging and Swapping


    The virtual memory subsystem attempts to maintain the number of free pages above
    a designated threshold. This threshold is defined by parameter vm_page_free_target
    and defaults to 128 pages (1 MB) in older versions of Tru64 UNIX. In version 5,
    the kernel chooses an initial value for vm_page_free_target based on the amount
    of physical memory in the system. The relationship between physical memory and
    vm_page_free_target is shown in Table 6.1.


    Table 6.1 Default Values for Free Memory Target (Tru64 UNIX Version 5)

    | Physical Memory in System | Default Value of vm_page_free_target (pages) |

    |---|---|n| Less than 512 MB | 128 |

    | At least 512 MB but less than 1 GB | 256 |

    | At least 1 GB but less than 2 GB | 512 |

    | At least 2 GB but less than 4 GB | 768 |

    | 4 GB or more | 1,024 |


    When the number of free pages falls below the threshold defined by vm_page_free_target,
    the vm subsystem goes through a series of memory reclamation steps in order to
    get free memory back above the threshold. These steps are progressive in nature;
    the quickest and easiest are performed first. If they don''t reclaim a sufficient
    number of free pages, successively stronger steps are applied. The first step
    is to prewrite dirty pages to disk. These pages remain active, but because they
    are now clean, they can be reclaimed very quickly if necessary. The next step
    is to find clean pages that the UBC has borrowed from processes and return them
    to the free list. Again, since these are clean pages, they can be reclaimed quickly.
    If this'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 6.2 Memory Resources and Performance


    doesn''t reclaim enough memory, dirty inactive and LRU pages are written to disk
    and moved to the free list. If this still doesn''t do the trick, the system begins
    swapping out entire processes in order to reclaim their resident pages. (This
    is obviously a brief overview of the memory reclamation mechanism. For more information,
    see the Tru64 UNIX System Configuration and Tuning Manual, which contains a very
    detailed discussion of memory management.)


    Nonwired memory pages must be backed by disk storage of one form or another. Readonly
    memory pages, such as program text and shared libraries, are backed by the file
    from which they were read. Because these pages can''t be modified, they can always
    be reread from the original disk blocks if necessary. Modifiable data, however,
    must have a "home" to which the dirty page can be written. Such data could be
    backed by a file (such as a database) that is being modified by a running program.
    Alternatively, it could be "anonymous" memory, which is swapped by swap space.
    Anonymous memory includes process data segments (i.e., program variables), shared
    memory segments, and which is dynamically allocated by a process.


    When paging occurs, individual pages are selected for reclamation as described
    previously. The selected pages are written to disk if necessary (i.e., if they''re
    dirty) and then unmapped. Swapping is far more drastic than paging because swapping
    operates on entire processes rather than individual pages. When a process is selected
    for swapping, all of the process''s resident pages are written to disk and unmapped.
    Obviously, swapping results in more disk I/O than paging does. Because disk I/O
    is slower than memory operations, swapping should be avoided if possible.


    Tru64 UNIX has two modes of swap space allocation. The default is immediate (also
    called "eager" mode). In immediate mode, whenever a process is created, enough
    swap space is reserved to hold all of the process''s virtual memory. If there
    isn''t enough unreserved swap space, the process will fail to start, and will
    generate an error message such as "unable to obtain requested space." If sufficient
    swap space is available, the process keeps it reserved throughout the process
    lifetime, but uses the swap space only if paging or swapping actually becomes
    necessary. Immediate mode provides a level of safety by ensuring that a process
    always has enough space for paging or swapping. The downside is that it requires
    the system to have at least much swap space as physical memory, preferably more.
    (For average systems, swap space should be at least two or three times the size
    of physical memory.) In Very Large Memory configurations, this might result in
    a big waste of storage because it''s quite possible that little or no swap space
    will ever need to be used.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'The alternative to immediate mode is deferred ("lazy") mode. In this mode,
    processes do not reserve swap space when they start up; instead, they attempt
    to allocate swap space only when they actually need it for paging or swapping.
    Deferred mode has the advantage of not requiring much swap space as immediate
    mode. The potential disadvantage is that if a process needs to swap and there
    isn''t enough swap space to hold its pages, the process is terminated. In most
    cases, this is not a risk worth taking for critical applications unless it''s
    certain that swap space will never be exhausted.


    Paging and swapping (particularly the latter) are detrimental to system performance
    because they add the overhead of disk I/O to memory access. While it''s best to
    avoid paging and swapping completely, it''s possible to minimize the performance
    degradation by configuring swap space for maximum I/O performance. This entails
    the use of multiple swap partitions on multiple disks in a one-to-one relationship
    (i.e., configuring a single, disk as one swap partition). Don''t put multiple
    swap partitions on a single disk or put swap space on a disk that''s also used
    for other purposes. The other hand, don''t stripe or combine multiple disks into
    a single swap space. The memory management subsystem uses a special algorithm
    to interleave swap I/O among multiple disks. Algorithms perform better than stripping
    at a hardware or LSM level, so it''s best to take advantage of it. Finally, from
    a hardware point of view, use only fast disks for swap space, and spread them
    across multiple I/O buses possible.


    #  6.2.2 The Unified Buffer Cache


    As mentioned previously, the UBC is used to cache file system data blocks. Because
    processes often require repeated access to the same data in a short period of
    time, caching data in the UBC makes it likely that the data will still be in memory
    for subsequent operations, preventing extra I/O operations. The UBC provides a
    general method of caching that is transparent to user applications, although some
    choose to manage their own data caches. There are a couple of methods by which
    such applications can bypass the UBC. The first is to use "raw" disk partitions
    (i.e., partitions that do not contain file file systems) and perform I/O directly
    to the disk device. This can improve I/O throughput (although it doesn''t always,
    because the file system code performs some optimization of disk I/O), but has
    the advantage that raw disk partitions are easier to manage than many file systems.


    The second method of bypassing the UBC is direct I/O, an AdvFS enhancement that
    was introduced in Tru64 UNIX V5.0. Direct I/O can significantly improve disk I/O
    performance for applications that rarely reuse data. Direct I/O is enabled on
    a per-file basis by opening a file with'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the O_DIRECTIO flag on the open(3) system call. There are a couple of performance
    considerations to keep in mind when using direct I/O:


    +   - For optimum performance, direct I/O operations should start on a disk sector
    boundary and should be a multiple of the disk sector size (generally 512 bytes).


    +   - By default, direct I/O operations are synchronous, but an application can
    also use asynchronous I/O (aio) operations to issue direct I/O requests without
    waiting for them to complete.


    It''s a fairly straightforward conclusion that the more data there is in a cache,
    the more likely it is that subsequent reads will find the desired data in the
    cache (a “cache hit”). For this reason, more data is read from file systems, the
    UBC expands to hold the additional data. Without some constraints, the UBC would
    eventually consume all of a system''s memory. This would be too much of a good
    thing, because it would leave no memory to run processes! For similar reasons,
    processes like to keep many pages active as in case their pages will be referenced
    again. Therefore, there are two factions competing for physical memory: processes
    and the UBC. The virtual memory subsystem maintains a balance between the two
    fluctuates based on the system''s current workload. If lots of I/O is occurring,
    the UBC tends to grow towards a maximum limit. If the currently running processes
    require more memory, the UBC shrinks to a minimum.


    Two vm subsystem parameters, “ubc_minpercent” and “ubc_maxpercent”, constrain
    the subsystem and maximum size of the UBC. A third parameter, “ubc_borrowpercent”,
    lies between the minimum and maximum; UBC memory above this limit is considered
    to be borrowed from process memory. These three parameters are defined in terms
    of available (managed) physical memory—for example, the default ubc_maxpercent
    of 100 of 100 theoretically allows the UBC to consume 100 percent of available
    memory. The default values for ubc_minpercent and ubc_borrowpercent are 10 and
    20, respectively.


    In practice, the UBC can''t really grow to consume 100 percent of available memory.
    When free memory drops below the threshold defined by vm_page_target, the memory
    management subsystem begins using the page reclamation techniques described above.
    This will result in inactive pages being freed; however, if the I/O demand increases,
    the free pages will quickly move back to the UBC. In addition, running processes
    will continue to need new pages. As a result, the free memory count will'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 6.2 Memory Resources and Performance


    above and below the target threshold while pages are shuffled among process memory,
    the UBC, and the free page list. This behavior, is called “page thrashing,” is
    detrimental to system performance. Not only does the kernel spend unnecessary
    overhead moving pages around, but as dirty pages are reclaimed, they must be written
    to disk.


    Page thrashing can be detected by watching the size of the free-page list and
    the UBC. To check the free-page count, use a command such as vmstat -w 2 10 and
    observe the “free” column. If its values are bouncing above and below the value
    of vm_page_free_target, check the UBC size. The vmstat -P displays various statistics
    about physical memory. The UBC size can be determined from the “Managed Pages
    Break Down” section of the resulting output. Here is an example:


    ```

    # vmstat -P

    Managed Pages Break Down:

    free pages = 16495

    active pages = 27910

    inactive pages = 0

    wired pages = 6001

    ubbc pages = 12355

    ============

    Total = 62761

    ```


    In the above example, the “Total” line indicates that there are 62,761 pages (490
    MB) of managed memory. The system actually contains 512 MB; the remaining 22 MB
    is used by the kernel’s wired memory. ubc_maxpercent is set to the default value
    of 100, so the UBC could grow to 100 percent of the available (managed) memory,
    or 490 MB. The “ubc pages” line shows that at the time the vmstat command executed,
    there were 12,355 pages (96 MB) in the UBC. This is less than onefifth of the
    UBC’s maximum possible size, so it’s clear that the UBC is not being heavily used.
    In general, page thrashing occurs only if the UBC is close to 100 percent of its
    maximum size.


    It’s also useful to check the UBC hit rate (i.e., the percent of page lookups
    that are actually found in the UBC). A high hit rate indicates that the UBC is
    being used effectively; every page in the cache is a page that doesn’t have to
    be read from disk. To determine the hit rate, it’s necessary to use dbx to examine
    the number of attempted page lookups and the'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Memory Resources and Performance


    number of hits. The ratio of the second number to the first is the UBC hit


    Unfortunately, the relevant data structures (like many others) changed between
    versions 4 and 5, so the appropriate command syntax depends on which version you''re
    running. Note that these commands display a large data structure. Only the two
    lines of interest are shown in the following examples; the remainder has been
    omitted. In version 4, the command


    ```

    (dbx) pd vm_perfsum

    vpf_ubclookups = 61973362

    vpf_ubclookhits = 161003561

    ```


    The version 5 command is somewhat more complex:


    ```

    (dbx) p*(struct vm_perf*)processor_ptr[0].vm_perf

    vp_u_lookups = 13405605

    vp_u_clookhits = 13360878

    ```


    These numbers are cumulative since the last boot, so they may not necessarily
    reflect current system activity. To calculate the current hit rate, it is necessary
    to gather two samples over a short time and compute the changes in the two parameter
    values. For example, here''s a look back at the version 4 shown above:


    ```

    vpf_ubclookups = 62804369

    vpf_ubclookhits = 16257136

    ```


    In the time between these two samples, (62,804,369 - 61,973,362) = 831,007 page
    lookups, and (16,257,136 - 16,100,351) = 156,785 cache hits. The UBC hit rate
    is (156,785 / 831,007) or 19 percent. This seems like a pretty low number, indicating
    that the UBC is probably not being used effectively. However, it''s not possible
    to define a good hit rate in absolute terms because much depends on the type of
    data and the application. If the application doesn''t tend to re-read a significant
    amount of data, the hit rate naturally be'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'low. Therefore, checking the UBC hit rate is most useful for a relative comparison
    of the performance of a particular system or application (e.g., before and after
    tuning).


    For some applications, 19 percent might be a reasonable UBC hit rate. In the example
    system, however, 19 percent was indeed too low. After tuning, the hit rate increased
    to a little over 40 percent. This still leaves room for improvement, the question
    naturally arises could tuning be beneficial? One way to answer this is to look
    at the "fullness" of the UBC. Before the initial tuning attempts,"vmstat -P" showed
    the UBC at its maximum possible size, which was 40 percent of available memory.
    Tuning changes included raising ubc_maxpercent from 40 to 60. Although the hit
    rate improved (as did disk I/O throughput), the UBC was still fully at 60 percent
    of available memory, indicating that an even bigger UBC was worth a try. Unfortunately,
    even the 60 percent UBC took too much memory away from processes, and the system
    began thrashing and even swapping. There was no "happy medium" available between
    processes and the UBC within the available memory resources. The only way to alleviate
    the memory bottleneck was to add more physical memory—a solution that was subsequently
    implemented with very good results.


    The preceding discussion shows that if the UBC is too large, page thrashing can
    occur."Too large" is a variable amount; in many cases, the system workload is
    such that page thrashing does not occur even with ubc_maxpercent set to 100. In
    such a case, there''s no reason to lower the maximum. As noted previously, the
    bigger the cache, the more cache hits that will result. As such, it''s best to
    let the UBC grow as large as possible, as long as it doesn''t generate other problems.
    However, if page thrashing does occur, the UBC should be constrained to a smaller
    maximum. In this situation, it''s best to tune the limit in small increments.
    As a starting point, decreasing ubc_maxpercent to 70 or 80 and monitoring the
    system further. If page thrashing still occurs, continue lowering the maximum
    in steps of 10 percent.


    Don''t go too far in this direction, however. It is possible to make the UBC too
    small, so we generally recommend not going below 20 percent, except under special
    circumstances that we will discuss in a bit. Also, it''s extremely important that
    ubc_maxpercent is larger than ubc_minpercent, and that ubc_borrowpercent be between
    the minimum and maximum (inclusive). Violating these last two guidelines is likely
    to result in strange (and generally unpleasant) behavior from the virtual memory
    subsystem.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'A too-large UBC can lead to performance problems, a too-small UBC has the same
    potential. Because file system I/O must go through the UBC, limiting the size
    of the UBC creates a bottleneck that effectively limits its system''s I/O bandwidth.
    In addition, a smaller cache makes it less likely that a desired disk block will
    still be in the cache. There will be fewer cache hits, resulting in more disk
    read operations. Also, new reads from disk will reuse existing pages; if dirty,
    these pages will be flushed to disk, increasing the number of disk writes. To
    determine whether the UBC is too small, check the UBC size and cache hit rate,
    as shown above. UBC size nears the maximum possible and the hit rate seems low,
    raising u_maxpercent. Do this in small steps. If u_maxpercent is set to 20, try
    raising it in 10 percent increments until the UBC is no longer fully used or until
    page thrashing occurs. If thrashing begins and the UBC is full, consider adding
    more physical memory to the system, as in the preceding example.


    It should also be remembered that some system configurations require a significant
    UBC. For example, if you are using a database that uses only disk devices or AdvFS
    direct I/O, the UBC serves little purpose. In such cases, it is reasonable to
    limit the UBC to a very small percentage of physical memory. However, it is important
    to limit the UBC in this way only in situations in which it is justified—for example,
    where the system''s primary applications are all using direct I/O or raw devices.
    If any conventional (i.e., nondirect) file system I/O is done by applications,
    don''t use a very small UBC; performance of conventional file system I/O will
    suffer dramatically.


    As an alternative to adding physical memory, it may be possible to tune some kernel
    parameters. If you have adjusted the UBC size but still appear to have insufficient
    memory (e.g., page thrashing or swapping is occurring), tuning may provide some
    relief. The virtual memory subsystem provides a significant number of parameters
    that govern page reclamation and other aspects of memory management. These parameters
    provide the system administrator with a great deal of control over memory behavior.
    Examining each of these parameters is beyond the scope of this book. For information
    on them, please consult the Tru64 UNIX System Configuration and Tuning Manual,
    which discusses these parameters in detail, including their side effects, potential
    benefits, and tradeoffs. It should be recognized, however, that the potential
    performance gains from tuning these parameters are fairly limited.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 6.3 CPU Resources and Performance


    The amount of available CPU resources is perhaps the most important factor in
    system performance. The type, speed, and number of CPUs define the system''s processing
    power. In some situations, or more faster CPUs will perform a given set of tasks
    more quickly. There are some exceptions to this rule. Some jobs aren''t suited
    to multiprocessing environments, in which case additional processors will provide
    no benefit. Also, if memory or I/O is a limiting factor, additional CPU power
    will make little or no difference. In some cases, it can actually make a problem
    worse, which is important to understand the cause of a performance problem before
    attempting to correct it.


    Information about a system''s CPU resources can be obtained with the "psinfo -v"
    command, which produces output such as the:


    ```

    psinfo -v

    Status of processor 0 as of: 06/09/02 15:13:42

    Processor has been on-line since time unknown

    The alpha EV5 (21164) processor operates at 250 MHz, and has an alpha internal
    floating point processor.

    Status of processor 1 as of: 06/09/02 15:13:42

    Processor has been on-line since time unknown

    The alpha EV5 (21164) processor operates at 250 MHz, and has an alpha internal
    floating point processor.

    ```


    Information is important to understanding the available CPU resources. It can
    also reveal whether a processor is unexpectedly off-line, which is one possible
    cause of performance problems. Something to look for in particular is the unintentional
    disabling of one or more CPUs by kernel parameters or console variables. The console
    variable CPU_ENABLED and the kernel parameter "cpu_enable_mask" allow individual
    CPUs to be disabled. In addition, setting kernel parameter "lockmode" to a value
    less than 2 will disable all but the primary CPU. These parameters are sometimes
    used just as workarounds for boot failures or recovering system crashes, as discussed
    in section 5.1.2.5, but by reducing the available CPU resources, they can cause
    a significant performance degradation.


    CPU utilization can be displayed using that very useful command, vmstat. With
    no command switches, vmstat displays the percentage of CPU time spent in system
    mode, user mode, and idle time. We recommend'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 6.3 CPU Resources and Performance


    adding the -w (undocumented in older versions of Tru64 UNIX), which separates
    the portion of idle time spent waiting for I/O to complete. To examine CPU utilization,
    run vmstat for several intervals (e.g., "vmstat -w 2 10") to display 10 samples
    at two-second intervals. A typical output is as follows:


    vmstat -w 2 10


    Virtual Memory Statistics: (pagesize = 8192)


    | r | w | u | act | free | | | rm | in | sy | cs | us | id | idwait |

    |---|---|---|---|---|---|---|---|---|---|---|---|---||

    | 3 | 33 | 30 | 77K | 25K | 685M | 139M | 136M | 8864 | 5 | 2K | 1 | 13 | 84 |
    0 |

    | 3 | 33 | 30 | 77K | 25K | 924 | 28 | 29 | 0 | 469 | 13K | 2K | 4 | 72 | 0 |

    | 3 | 33 | 30 | 77K | 25K | 368 | 13 | 19 | 0 | 492 | 6K | 2K | 5 | 72 | 0 |

    | 3 | 33 | 36 | 77K | 25K | 308 | 0 | 0 | 479 | 2K | 5 | 21 | 74 | 0 |

    | 3 | 33 | 36 | 77K | 25K | 367 | 13 | 19 | 0 | 501 | 6K | 2K | 5 | 22 | 0 |

    | 3 | 33 | 36 | 77K | 25K | 344 | 0 | 0 | 484 | 3K | 2K | 5 | 18 | 78 |

    | 3 | 33 | 37 | 77K | 25K | 465 | 48 | 27 | 0 | 730 | 6K | 2K | 6 | 24 | 0 |

    | 3 | 33 | 36 | 77K | 25K | 498 | 61 | 4 | 0 | 476 | 5K | 2K | 5 | 19 | 7 |

    | 3 | 33 | 36 | 77K | 25K | 456 | 46 | 0 | 0 | 523 | 8K | 2K | 5 | 20 | 6 |

    | 3 | 33 | 36 | 77K | 25K | 306 | 0 | 0 | 500 | 3K | 2K | 5 | 18 | 76 |  |


    The last fields display total CPU utilization for all processors: "sy" is system
    time, "us" is user time, "id" is true idle time, and "iowait" is idle time spent
    waiting for I/O. These represent the percentage of available time, so they should
    add up to 100 (or something very close to it, for rounding). Note that the first
    line has different numbers in these fields. The first line of vmstat output contains
    cumulative values since boot time, so it should be ignored.


    In vmstat, system time is the percentage of time spent by the kernel doing system-related
    tasks, such as processing interrupts or managing memory. User time is spent in
    user mode, running actual programs (both system utilities and user applications).
    Idle time is spent doing neither system or user work; true idle time ("id") generally
    covers capacity. I/O wait time is also idle time, but it''s a sort of "forced"
    idle time because it''s usually the case that a process will be able to resume
    execution as its I/O completes.


    User time represents the accomplishment of real work (as opposed to system housekeeping
    tasks) and therefore should be maximized. System time and I/O wait time represent
    unavailable to do real work, so they should be minimized in order to maximize
    performance. (System time and'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 6.3 CPU Resources and Performance


    I/O wait time cannot be completely eliminated because neither the kernel nor the
    system''s I/O devices are infinitely fast. There are no absolute criteria that
    define an acceptable amount of system time is high or low is somewhat subjective
    and depends on the workload mix and overall capacity of the system. In some situations,
    20 percent system time is unacceptably high, whereas in other cases it is perfectly
    reasonable. Historical data can help to decide whether a system is performing
    normally. For example, if system time is at 20 percent and has always been around
    that level, it is probably not worrying unless there are other indications of
    a performance problem. But if system time has historically been around 10 percent
    and suddenly jumps to 20 percent, the cause should be investigated.


    The first three columns of vmstat output are also useful in measuring CPU workload.
    The r, w, and u columns display the current number of runnable (running) processes,
    waiting processes, uninterruptible processes, respectively. If the r column is
    significantly higher than the number of processes in the system, it indicates
    a backlog of jobs waiting for CPU resources.


    A quick look at CPU performance is provided by the uptime(1) command. A typical
    output of this command is as follows:


    ```

    uptime

    15:19 up 209 days, 52 mins, 70 users, load average:

    0.07, 0.22, 0.23

    ```


    The last three numbers represent the system load average over the past 5, 30,
    and 60 seconds. Load average is the number of jobs waiting to run at any given
    time. A low number (less than 1) indicates that the system is not experiencing
    a backlog and is performing well. A higher load average indicates an increasing
    backlog of jobs. More powerful systems (i.e. with more processors) are better
    able to handle backlogs without affecting overall performance. For a workstation,
    a load average of 3 generally represents a heavily loaded system, while for a
    large server, 3 is usually an acceptable load average.


    Heavily used CPUs don''t always mean that the system has insufficient CPU resources.
    Because activities like memory management and interrupt handling consume system
    time, memory or I/O problems can cause CPU utilization to increase. As such, it''s
    important to eliminate memory and I/O as the cause of a performance problem before
    looking at CPU usage. In'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'such cases, fixing the actual underlying problem may free up significant CPU
    resources.


    If a system really does insufficient CPU resources, there''s not a lot that can
    be done in terms of tuning. Some possible ways to alleviate CPU bottlenecks include
    the following:


    +   - Use the nice(1) or renice(8) commands to run the most important jobs at
    higher priorities.

    - Use the class scheduler [see the class_admin(8) reference page] to allocate
    CPU resources among users and applications.

    - Shift work to off-peak times to reduce the maximum workload.

    - Look for inefficiencies in user applications.

    - Use hardware RAID instead of LSM to relieve the CPU from the overhead of some
    disk I/O operations.

    - Stop unnecessary system daemons that may consume CPU time. A prime candidate
    for this is the AdvFS daemon, advsd, which is needed only if you use the AdvFS
    GUI.

    - If all else fails, add more CPUs and/or upgrade your CPUs to faster speeds,
    if available. Note that prior to Tru64 UNIX V5.1A, all processors in a system
    had to be at the same speed. In V5.1A, mixed-speed configurations are allowed,
    with some restrictions.


    # I/O Resources and Performance


    When looking at I/O resources, it''s useful to separate storage (disk and tape)
    resources from network resources. Although there are common elements between the
    two, there are significant differences in the ways that they affect system performance.
    Each type of I/O resource is discussed in our subsection.


    # Storage I/O


    In modern computer systems, storage devices are generally the slowest components.
    CPUs, memory, and network devices all have greater throughput than storage devices.
    Therefore, maximizing storage I/O performance is often the key to overall system
    performance. In discussing storage I/O, we are primarily concerned with disk I/O.
    Tape devices typically have few'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 6.4 I/O Resources and Performance


    other than backup/archiving in Tru64 UNIX systems. In addition, there''s

    not a lot that can be done to improve tape performance. However, there are

    a few guidelines for optimizing tape I/O performance:


    +   - Don''t mix disks and tapes on the same I/O bus. An even better idea,

    if the configuration permits, is to isolate each individual tape device

    on its own bus.

    - Perform backups during off-peak hours.

    - Use the highest available tape drive density.

    - Use hardware compression if the tape device supports it. If the device

    does''t support hardware compression, use software compression

    (e.g., the -C switch on the vdump command). Don''t use both hard-

    ware software compression at the same time.


    When more I/O operations are directed to an I/O device then it can

    process, an I/O bottleneck results. This causes processes to wait longer than

    necessary for I/O to complete, which, in turn, causes the jobs to take longernto
    complete. A bottleneck can occur on a single disk or at the bus/controller

    level if there are a large number of requests to multiple devices on the bus or

    controller.


    The key to troubleshooting I/O performance problems involves the fol-\lowing three
    steps:


    +   1. Detecting an I/O problem exists

    2. Locating the cause of the problem

    3. Identifying corrective action


    Detecting an I/O problem is usually a matter of an I/O-intensive appli-

    cation too long to complete. "Application" here includes any pro-

    gram that has a significant amount of I/O. This could be a user-written

    program, third-party software (e.g., a database application), a system utility

    such as vdump, or a shell command as "cp". When you suspect an I/O

    problem, the first thing to check is whether processes are spending signifi-\cant
    time waiting for I/O to complete. Use the command "stat -w 2" to

    gather statistics at two-second intervals. If there is a significant amount of

    idle or I/O wait time, but jobs are waiting to run, an I/O bottleneck exists.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "When a general guideline, a bottleneck probably exists if the numbers in the\
    \ id and iat columns consistently total more than 20 or so and the number in the\
    \ r column exceeds more than 1 or 2.\n\nWhen an I/O problem is suspected, the\
    \ next step is to locate the cause of the problem. First, check the error log\
    \ for disk errors and correct any problems that you find. Use the \"iostat\" and\
    \ \"collect\" commands to gather statistics on disk activity. The iostat command\
    \ is adequate for configurations with just a few disks, but it is too limited\
    \ to be useful for larger setups. If you find that a single disk or a small subset\
    \ of disks has significantly more I/O transactions than the others, this is the\
    \ natural place for further investigation.\n\nIf the disk(s) in question contain\
    \ an AdvFS file domain, of the domain can have a significant impact on performance.\
    \ Use the command \"defragment -vn <domain_name>\" to see how fragmented the domain\
    \ is. The -n switch tells the defragment command to just gather statistics and\
    \ not perform any actual fragmentation.\n\n```\n# defragment -vn data_domain\n\
    defragment: gathering data for domain 'data_domain'\nExtents: 266295\nFiles w/extents:\
    \ 95474\nAvg per file w/exts: 2.7\nAggregate I/O perf: 65%\nFree space fragments:\
    \ 16596\n          <100K  <1M  <10M  >10M\n  Free space: 17%   60%   21%   2%\n\
    \          Fragments: 12675 3661 258 2\n```\n\nThe file domain in this example\
    \ is significantly fragmented. Generally, if the aggregate I/O performance is\
    \ below 90 percent, the domain should be fragmented. For more information on fragmentation,\
    \ as as other AdvFS performance considerations, the Tru64 AdvFS Administration\
    \ Manual.\n\nThe next step in troubleshooting an I/O bottleneck is to determine\
    \ how the heavily-used disks are used. Are the disks used for swap space, a data-base,\
    \ mail pool files, user home directories, or something else? Character-izing disk\
    \ usage is necessary to perform the next step, which is to distribute the I/O\
    \ load among multiple disks. The primary method for distributing the load is to\
    \ stripe data across multiple disks to allow faster I/O access."
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Either hardware RAID or LSM (or both) can be used for this purpose. LSM allows
    the load to be distributed across multiple buses, but at the cost of additional
    CPU overhead.


    Another useful technique is to distribute heavily used file systems on multiple
    disks, preferably on I/O buses. For example, if you have a large number of user
    home directories on a very active disk, dividing them into smaller groups (by
    organization, alphabetically, whatever makes the most sense) and putting each
    group on its own disk. Distributing the I/O load may be more difficult in some
    situations; for example, a large database file may need to remain as a single
    file. Even in such situations, there is usually some action that can be taken
    to distribute I/O. It might be possible to move index or log files associated
    with the database to other disks. Also, if the file is on a multivolume AdvFS
    domain, the stripe(1) command can be used to stripe the file across the disks
    within the domain, which will improve I/O throughput to the file.


    # 6.4.2 Network I/O


    Network interfaces are technically I/O devices, but they are so different from
    storage I/O devices that really need to be considered separately. Problems with
    network performance have a wide variety of causes. Many of these are external
    to the system experiencing the problem and in some cases you may be able to identify
    a problem, but corrective action is the responsibility of some other person or
    organization. In such cases, all you can do is to notify the responsible party
    and wait for that person to resolve the issue.


    Chapter 7 discusses the troubleshooting of network problems, including network
    performance issues, so we won''t duplicate that information here. In addition,
    there are a number of tuning options that may improve network performance in certain
    configurations. One important parameter is "nistthreads"in the net subsystem),
    which specifies the number of network interrupt handlers. By default, this parameter
    is set to 1 on a single-processor system; on multiprocessor systems, the default
    value is one more than the number of processors. This allows incoming interrupts
    to be handled in parallel fashion by threads running independently of each CPU.
    If you have a multiprocessor system, verify that nistthreads is set to the proper
    value.


    There are a few other network parameters that can be tuned to optimize performance
    in various situations. These parameters have various trade-offs and may not be
    suitable for all configurations. If your system experiences heavy network usage,
    check out the discussion of managing'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Checking System Performance


    network performance in the Tru64 UNIX System Configuration and Tuning Manual.
    This section of the manual contains a detailed discussion of each network tuning
    parameter, including when it should be modified and the possible side effects.


    # 6.5 Checking System Performance


    In the preceding sections, we talked about the ways that shortages of different
    resources can lead to performance problems. In this section, we''ll look at how
    these pieces fit together. The procedure listed below will provide a quick, high-level
    look at system performance to identify general problem areas. After identifying
    the areas (if any), you can use the techniques discussed previously to narrow
    down the problem and take the appropriate corrective action.


    Monitoring system performance should be an ongoing, iterative process. After making
    any changes, start over from the beginning in case the changes have unintended
    side effects. Even if you don''t make any changes, consider going through this
    procedure on a regular basis or when the system workload changes. By keeping a
    log of the results, you will create a record of system performance. Running the
    collect regularly will also help to build a record of historical performance data.


    In addition to the quick-look procedure described in the following sections, we
    also recommend running the sys_check utility with the -perf switch and looking
    at its performance and tuning suggestions. The sys_check output may immediately
    identify potential problems and suggest possible corrections. However, it should
    be remembered that sys_check fails to detect an obvious problem. In addition,
    sys_check occasionally generates tuning suggestions that may or may not actually
    do anything to help performance, although are unlikely to hurt it. Consequently,
    it''s important to understand the basis for sys_check''s tuning suggestions before
    implementing them.


    # 6.5.1 Looking at Memory


    When examining system performance, the first item to monitor is free memory. Use
    the vmstat command to gather memory statistics for a short time. For example,
    the "vmstat -w 2 10" command returns 10 samples to two-second intervals. In the
    first line of vmstat output, several (though not all) fields contain values that
    have accumulated since the system was last booted.'
  merge: -1
