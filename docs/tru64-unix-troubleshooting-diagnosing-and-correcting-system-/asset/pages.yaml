  md: '+   - System disk encapsulation problem

    - Volume configuration daemon fails to start

    - Hardware problem


    Boot hangs are difficult to diagnose because there isn''t a lot of data to work
    with. LSM boot hangs typically happen after the system has already gotten to single-user
    mode, but in some cases they can happen earlier. The system has not yet gotten
    to single-user mode, check the console and how far the system gets. Also see Chapter
    5 for information on trouble-shooting boot problems.


    In the case of a boot hang when the system disk is encapsulated or mirrored, check
    for the following possible causes:


    +   - Check the LSM entries in /etc/sysconfig and make sure they are correct.
    The "lsm_rootdev_is_volume" parameter should be set to 1.

    - If you are using UFS for your system file systems, make sure that /etc/fstab
    correctly shows them as LSM volumes and not as the underlying disks.

    - If AdvFS is used for the system disk file systems, make sure that the links
    in /etc/fdmins are pointing to LSM volumes and not to the under-lying partitions.

    - If the system disk is mirrored and the first disk has failed, do you have the
    second disk defined in the BOOTDEF_DEV console variable so the system will automatically
    attempt to boot from it? An example of setting this value at the Alpha system
    console would be the following:


    ```

    >>> set BOOTDEF_DEV DKA0,DKBO

    ```


    +   - If the system disk is encapsulated, LSM must be able to find the space or
    it could cause the boot to hang.

    - Make sure the disk label is correct and the LSMpriv region exists.


    # 8.3.7 Recovering LSM Metadata


    One of the problems you may run into with the logical storage manager is what
    to do if the configuration is lost. How do you get back the LSM con-'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 8.4 LSM Performance


    figuration without making the situation worse by messing around with commands?
    Unfortunately, the volsave(8) and volstore(8) commands are designed to solve this
    problem. If you save your configuration ahead of time with volsave, you can later
    use volstore to bring it back.


    Performance usually isn’t the main reason that administrators choose to use LSM.
    The primary reasons are the flexibility and redundancy that LSM provides at a
    relatively low cost. However, there are a few areas where you may be able increase
    performance with LSM. These are discussed in the following sections.


    # 8.4.1 Improving Mirror Synchronization Performance


    The standard method of performing mirror volume synchronization is by copying
    every block from one plex to another. This can take long time and be very I/O
    intensive. One way to improve the performance of mirror resynchronization is by
    implementing a logging feature, dirty region logging (DRL). DRL was designed to
    reduce mirror volume synchronization by keeping track of the areas or regions
    of the disk that have out-of-sync (i.e., dirty) data. With this information, LSM
    needs to resynchronize only the dirty regions, improving performance tremendously.


    # 8.4.2 Enhanced Round-Robin Scheduling


    In Tru64 UNIX version 5, LSM introduced a feature designed to increase the performance
    of sequential reads by taking advantage of disk read-ahead cache. This performance
    enhancement introduces a new round-robin mode where the difference between the
    last block read and the next block to read is compared with a new tunable parameter
    in the LSM subsystem “LSM_V_ROUND_proximity.” If the difference is less or equal
    to the parameter value, data is read from the same plex. This is an attempt by
    the LSM software to take advantage of disk caching, increasing the chance that
    reading the block will result in a cache hit. The result should be improved sequential-read
    performance. The new tunable parameters added by this enhancement are:


    +   1. lsm_V_ROUND_enhanced. This variable activates the new enhanced round-robin
    read policy if it is set to TRUE (1). Otherwise, the policy is deactivated. The
    default value is 1 (TRUE).'
  merge: -1
  img_proc: true
- pgno: 240
  md: '226


    8.5 Summary


    2. lsm_V_ROUND_enhance_proximity. This variable provides the proximity in which
    the last read and new read must lie in an attempt to read data from the disk''s
    cache by reading from the same plex. The variable can be adjusted from 0 to 4,096.
    The default value for this parameter is 512.


    Testing has shown that by implementing this enhanced round-robin algorithm and
    tuning the proximity value appropriately, it''s possible to come very close to
    reaching the performance of the preferred-plex algorithm with sequential reads.
    Test results show that the performance improvement can come close to 10 percent.
    Naturally, your own mileage may vary. You can set up your own test for round-robin
    and preferred-plex settings of a mirrored LSM volume using commands similar to
    the following:


    ```

    # volstat -r

    # time dd if=/dev/rvol1/rootdg/vol01 of=/dev/null bs=512k

    # volstat -i 1 vd vol01

    ```


    In this way, you can test different values for the proximity parameter in your
    own environment to get an idea of the kind of performance improvement you can
    expect. An even better way to get an idea of how well this enhancement would improve
    performance in your environment is to use your application in the above test instead
    of dd(1).


    # 8.5 Summary


    In this chapter, we have provided guidelines for troubleshooting storage problems
    on your system. In most cases, troubleshooting storage problems involves working
    on some kind of hardware problem. Consequently, it''s important to become familiar
    with the tools discussed in Chapter 3 and reading the binary error log, because
    that you''ll find most of the useful information for troubleshooting bad hardware.
    We have also provided you with some techniques that can help you in other aspects
    of storage troubleshooting. This information should provide a good foundation
    for the discussion to come in Chapter 9, because file systems are totally dependent
    on the reliability of their underlying storage devices.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# File Systems


    > If you don''t ask the right questions, you don''t get the right answers. A question
    asked in the right way often points to its own answer. Asking questions is the
    ABC of diagnosis. Only the inquiring mind solves problems.


    > —Edward Hotnett


    In this chapter, we begin our discussion of the file system layer of the I/O subsystem.
    As before, our goal is to give you a flavor for the kinds of issues you are likely
    to run into and some strategies for dealing with them. There are books devoted
    exclusively to the topic of file systems, and we refer to those and to the Tru64
    UNIX documentation for exhaustive coverage of all the options associated with
    a particular command. Within this book, we will attempt to give you as much information
    as we can to head off problems that crop up in the area of file systems.


    # 9.1 Generic File Systems Systems


    We''ll begin with generic file system problems. These are the kinds of problems
    that arise no matter what type of file system is involved. Later in the chapter
    we discuss issues specific to particular types of file system (e.g., AdvFS or
    UFS).


    # 9.1.1 File System Full


    One of the most common of all file system issues—and one that almost every UNIX
    system administrator runs into eventually—is a full file system. Appropriate planning
    can make this less likely to happen, so we believe that a proactive approach is
    the best way to deal with this potential problem. However, as it may still crop
    up despite your efforts, both'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'proactive steps and corrective steps are presented in this section. A full
    file system can become a crisis if it prevents work from being accomplished on
    the system. Therefore, once it does happen, it''s important to deal with it quickly.


    # 9.1.2 Detecting a Full File System


    The first step in troubleshooting a full file system is detecting that a user
    file system has, in fact, become full. This is usually not difficult on a user
    file system, because you''ll usually get a phone call from your users complaining
    about it. The applications your users are running will be unable to add more files
    to their directories, and they will most likely return an ENOSPC (no space) error
    (If you''re not sure what an erno is, see the discussion of this topic in Chapter
    3.)


    Here is an example of the error you might receive:


    ```

    # cp vmunix /tmp/1.8

    / write failed, file system is full

    cp /tmp/1.8: No space left on device

    # df

    ```


    | Filesystem 52-blocks Used Available Capacity Mounted on |

    | /dev/rz3a 253374 252678 0 111 percent |


    If the full happens to be a system or application file system, it will probably
    impact all your users, and you will quickly get inundated with calls about the
    problem. Tru64 UNIX will also log an entry in the messages file whenever a write
    attempt is made to a full file system. These entries look similar to the following:


    > Jul 24 14:07:00 mightydog vmunix: : file system full


    It''s a good idea to check your logs periodically for these errors. When you see
    them, check to see whether a real problem exists. It''s possible the system is
    actually full and requires attention. However, it may also become full and subsequently
    corrected without your involvement. For example, a user may have copied a large
    file to the /tmp directory and inadvertently filled up the root file system, but
    later realized the error and removed the file.


    Regardless of how you are notified, you will most likely use the df(1) tool to
    find the full file system. The output from df for a typical small Tru64 UNIX system
    might look as follows:'
