    if the program is not particularly documented, you may be able to investigate
    the source code for debugging flags or options. When additional debugging is enabled,
    the standard location for debug output is the daemon log or system message file
    (unless the daemon maintains a log of its own). If you''ve modified the syslog
    configuration, check the appropriate locations specified by syslog''s configuration.
    See the discussion of syslog in Chapter 3 or the syslogd(8) reference page if
    you''re not familiar with this facility.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 7.2.2.2 Standalone Daemon Issues


    As we have previously noted, a standalone daemon remains active at all times,
    usually waiting in a sleep state until an event occurs that it wakes up. Depending
    on the nature of the event, the daemon may perform some action or it may fork
    a child process to do the work for it. Because standalone demons stay alive all
    the time, they should be present in the process table at all. If a standalone
    daemon is missing from the system, a problem has occurred. Standalone daemons
    tend to have their own startup and shut-down scripts in /bin/init.d directory.
    Some examples of this type of daemon are sendmail, httpd, xntpd. Space limitations
    prevent us from providing detailed troubleshooting information about each of the
    standalone daemons that might be active on a Tru64 UNIX system, but we will provide
    some general principles and guidelines for troubleshooting them.


    When a problem occurs in a standalone daemon, the first approach should be to
    check to see whether the daemon for service is running; if it isn''t, try to restart
    it. If the daemon is behaving erratically, try stopping and restarting the daemon.
    (Once again, if the process has entered an uninterruptible state, you may not
    be able to stop it. When this happens, isn''t much you you can do to correct the
    problem other than waiting for the condition to clear or rebooting the system.)
    If the daemon fails to start, check the daemon.log file for additional information
    as to why it may be failing. Some daemons have additional logging that can be
    enabled to provide more information to help track down the problem. Also, make
    sure there are not two or more daemons listening on the same port simultaneously.
    For example, if the HP-supplied xntpd daemon is active and a third-party xntpd
    is attempting to start up, there will be a conflict, and unusual behavior will
    most likely result.


    Other than these general principles, anything you do to correct a problem with
    a standalone daemon will be very specific to that daemon. For example, a problem
    with the sendmail daemon could be a problem with its configuration file; therefore,
    correcting the problem could require some complex configuration changes. Because
    there are several thick books dedicated to the topic of sendmail (see the Bibliography),
    we can''t possibly cover all the details involved here. Your troubleshooting activities
    may include consulting one of these references, and the same holds for other standalone
    daemons, such as xntpd and httpd.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 7.2.2.3 Hostname Resolution Issues


    Hostname resolution is the mechanism by which network hostnames are translated
    into their corresponding IP addresses. There are generally means by which this
    can be accomplished:


    +   1. A local /etc/hosts file

    2. The Network Information Service (NIS)

    3. The Domain Name Service (DNS)


    Tru64 UNIX can be configured on your system to use any combination of these, in
    any possible order of precedence. This is configured by the “hosts” entry in the
    /etc/svc.conf file. For example, the default configuration for a Tru64 UNIX system
    is as follows: first check the hosts file; then failing, to check DNS; and finally,
    failing, to check the NIS service. The hosts entry would look like this:


    ```

    hosts=local,bind

    ```


    This indicates that a hostname will first be checked for the local /etc/hosts
    file. If it is not found there, then BIND (Berkeley Internet Name Domain service—i.e.,
    DNS) will be queried for the hostname. If that does not return an IP address,
    then NIS will be queried. Normally, if you want to use DNS or NIS, clients for
    these services must be configured on your system. The “sysnetwork” command can
    be invoked to configure the various network services. You may need to consult
    your local network administrator to determine the servers and domain names available
    on your local network.


    Problems with hostname resolution generally fall into two categories: (1) names
    that do not resolve at all, and (2) names that resolve to the wrong IP address.
    The way to begin troubleshooting a resolution problem is by modifying the /etc/svc.conf
    file to use only the local hosts file. You don''t have to do anything else for
    the svc.conf change to take effect, so you should begin to see the effect immediately.
    If the problem doesn''t change, then the hosts file has been eliminated, you can
    quickly determine whether the problem is with DNS or NIS by adding them one at
    a time and trying to use the hostname. Once you''ve isolated the problem component,
    you can focus further troubleshooting efforts appropriately.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 7.2 Networking Software Issues


    For DNS problems, the best troubleshooting tool is the nslookup(8) utility. When
    provided with a host name, this tool will attempt to look up the IP address using
    only the DNS servers and domain information defined in the /etc/resolv.conf file.
    In other words, nslookup ignores the resolver settings in /etc/svc.conf file and
    uses only DNS to make the name translation. As such, it is very handy for debugging
    DNS issues. As an example, the following command will find the IP address for
    host ftp.x.org (and incidentally find the DNS server from which information was
    obtained):


    ```

    nslookup ftp.x.org

    Server: ns2.cca.pcqcorp.net

    Address: 16.110.248.21

    ```


    Non-authoritative answer:

    Name: ftp.x.org

    Address: 192.153.166.94


    One of two things could cause this command to give an incorrect answer. First,
    the host was not found in the DNS server''s database. This could be true if you
    provided an invalid hostname by mistyping the name or by using the right hostname
    in the wrong domain. Alternatively, the DNS server might be inaccessible or disabled
    in some way. The second reason can be avoided in most cases by including a second
    or third DNS server in the /etc/resolv.conf file. The resolver will try the servers
    in the ordered list, so list the closest or most available server, the next closest
    second, and so on.


    One of the most common symptoms of DNS server or network problems is that a request
    will hang. This often occurs as part of a higher-level service, so it''s always
    obvious that DNS is part of the problem. For example, you might be trying to telnet
    to another host. This requires the resolver to translate the hostname to an IP
    address before the connection can be made. If there is a DNS problem, the telnet
    command will hang, and you may need to enter Control-C to break out of it. In
    this kind of situation, pinging the DNS server''s IP address directly to verify
    that it''s up. If that works, try doing an "nslookup" command for the host you''re
    trying to reach. If this succeeds, DNS is not the problem.


    Unlike DNS, which is used only for hostname resolution, NIS can be used to distribute
    a number of different databases to clients in the same domain. (Note that an NIS
    domain is not the same as an Internet domain.) In addition to the hosts file,
    these databases include the password,'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 7.2 Networking Software Issues


    group, and networks files as well. For NIS problems, you can use the "yp" series
    of tools to help troubleshoot the issue. The ypcat(8) command displays a listing
    of a database that is being served to the NIS clients in your domain. For example,
    to list the NIS-distributed hosts:


    # # ypcat hosts


    The output from this command should resemble a local hosts file (i.e., IP addresses
    paired with host names). If no output is returned, it could be that the host is
    not properly set up as a client for the NIS domain. Check the NIS setup and verify
    the ypbind daemon is running on your system. Also, make sure the domain you are
    using is spelled correctly. Tru64 UNIX administrators may not realize that NIS
    names are case sensitive. Another common mistake is to assume that the DNS name
    and the NIS domain are the same. This can lead to very strange behavior, but in
    most cases it means that the resolver will not able to resolve a host name or
    NIS functions will not work. The term domain is common in networking (not to mention
    other components, such as AdS), and care should be taken to specify the context
    (e.g., "NIS domain or "Internet domain") to minimize possible confusion.


    If NIS databases are being successfully served to your host, the hosts file is
    not,, take a look at /etc/svc.conf and make sure "yp" is included in the "hosts"
    entry. If the target host is not listed in the "ypcat hosts" output, either talk
    to the NIS database administrator and request that the host be added, or switch
    to another method (DNS or local hosts) for resolving this hostname.


    Finally, it should also be noted that NIS depends on RPC communication between
    systems. Therefore, the discussion of RPC-based problems in the next section is
    also applicable to troubleshooting NIS problems.


    # 7.2.2.4 RPC-Based Services


    The Remote Procedure Call (RPC) mechanism allows two networked computers to communicate
    with each other using a common protocol. RPC is the basis for some widely used
    networking protocols, including the Network File System (NFS) and the Network
    Information Service (NIS). In addition, the daemons used in HP''s TruCluster product
    are heavy users of the RPC mechanism.


    Problems with RPC-based services may be caused by problems with the underlying
    RPC mechanism, which in turn usually occur if the portmap(8)'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 7.3 Summary


    daemon (also called the “portmapper”) is not running or not functioning properly.
    The portmapper is the “traffic cop” that accepts incoming RPC requests and hands
    them off to the appropriate subdaemons. In this way, portmap functions verify
    much like the ined daemon. However, the portmapper listens on only one TCP/IP
    port and uses a program identifier to keep track of its subdaemons. This conserves
    the use of reserved TCP/IP ports on the system.


    The programs that portmap will listen for are listed in the /etc/rpc file. When
    these daemons start up, they register with the portmapper. If you are trying to
    find out why a particular program is not communicating, check this file to verify
    that the program is properly listed and has a unique program number assigned.
    If so, use the rpcinfo(8) command to verify that the subdomain is running and
    has registered itself with the portmapper. To display the daemons registered with
    the portmapper on the local host, use the following command:


    ```

    # rpcinfo -p

    ```


    Alternatively, to check a host called “george” using rpcinfo, add the hostname
    to the command: for example:


    ```

    # rpcinfo -p george

    ```


    This will tell you that not only is the program properly registered, the portmapper
    is responding to its requests. This is a good sign that portmap is working properly.


    # 7.3 Summary


    We have discussed the troubleshooting of some of the most common network problems
    that can occur on a Tru64 UNIX system. The topic of network troubleshooting is
    vast, and many volumes could be written to describe some of the most common issues
    and how to analyze and resolve them. It is our hope that this will help you resolve
    most of the problems you might encounter.


    One of the most important things you can do is to thoroughly understand your network
    configuration and how the system looks when things are working correctly in order
    to compare with how things behave when they''re not working. It''s also very important
    to understand the tools'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 7.3 Summary


    available for troubleshooting before you actually need them. Every situation is
    different, and you never know exactly what is going to fail and in what way. Therefore,
    the more experience you have, the better prepared you will be when the time comes
    to correct a problem.


    # Before you call support


    Before calling technical support for a networking problem, make sure you have
    first checked the following:


    +   Is networking really the problem, or do you have a system issue that prevents
    network access? Check for an expired license and proper run level.


    +   Is your NIC seen at the console? If not, the NIC is most likely bad and should
    be replaced.


    +   Have you systematically eliminated every hardware component? Try the shotgun
    approach if you have spare hardware available.


    +   If the problem cropped up following a system reboot, check your system change
    logbook for changes made since the last reboot.


    +   Make sure that the IP address, netmask, and broadcast address are correct.


    +   Routes should show up in the routing table and can be checked using the "traceroute"
    command.


    +   Determine whether the problem is due to a resolver issue by using the IP address
    directly.


    +   If a standalone daemon hangs or behaves erratically, restarting the daemon.
    Check the daemon.log file for possible errors reported by an improperly behaving
    daemon. If an inetd-controlled daemon is failing, try restarting inetd itself.'
  merge: -1
  img_proc: true
