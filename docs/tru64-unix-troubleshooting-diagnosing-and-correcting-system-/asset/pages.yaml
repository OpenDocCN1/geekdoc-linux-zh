    then restart syslogd. This can quickly tell you whether the problem is in the
    old configuration file or not.


    The first half of a syslog.conf entry specifies the source and severity of messages
    for which syslog should watch. The facility and its severity level must be separated
    by a period. For example:


    ```

    kern.debug /var/adm/syslog.dated/kern.log

    ```


    More than one facility can be specified on a line by separating multiple facilities
    with commas or semicolons:


