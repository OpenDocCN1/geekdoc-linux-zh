  md: '# 5.1 Boot Failures


    be restored to service as soon as possible. The workaround is to disable all but
    one CPU on the system, which effectively disables all SMP locking. To do this,
    enter the following from the console:


    ```

    >>> CPU_ENABLED 1

    ```


    CPU_ENABLED is a bit mask for the enabled CPUs. A value of 1 indicates that only
    the first CPU (CPU 0) is enabled, a value of 3 would indicate that both CPUs 0
    and 1 are enabled, and so on. The parameter is normally set to FFFF or FFFFFFFF,
    which are hexadecimal values with all relevant bits set, indicating that all CPUs
    are enabled by default.


    # Caution


    Booting a multiprocessor system with CPU_ENABLED set to 1 will degrade system
    performance, possibly severely. This should be considered a temporary workaround
    to be used until the problem has been properly resolved.


