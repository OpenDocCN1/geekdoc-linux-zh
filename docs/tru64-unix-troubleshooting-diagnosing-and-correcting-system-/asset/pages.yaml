    # 3.3.7 Auditing


    Tru64 has a built-in tool that is very useful for troubleshooting programs that
    you cannot debug because no source code is available. It is sometimes to look
    at the system calls (and their results) that a program is executing to help narrow
    down the reason a program is failing.


    As an example, let''s consider a problem where a program is generating an error
    message that doesn''t seem to correspond with what the kernel returns to the shell:


    ```

    df / /

    Filesystem 512-blocks Used Available Capacity Mounted on

    /dev/rz3a 253374 252678 0 111% /

    # cp /vmunix /tmp/1.8

    /: write failed, file system is full

    cp: /tmp/1.8: No space left on device

    # echo $?

    ```


    This return value corresponds to errno 1, which is EPERM:


    ```

    # grep EPERM /usr/include/errno.h

    #define EPERM                 /* Not owner */

    ```


    Based, on the error message coming from the cp program, one would expect the error
    to be ENOSPC, which is errno 28:


    ```

    # grep ENOSPC /usr/include/errno.h

    #define ENOSPC                28      /* No space left on device */

    ```


    So why don''t these two results agree? With auditing enabled, this question can
    be easily answered. Examining the audit log would reveal the following:


    ```

    # audit_tool ''auditd -q'' -e exec -e write:0:1 -e exit

    aud_id: 0ruid/eid: 0/0

    ```'
  merge: -1
  img_proc: true
