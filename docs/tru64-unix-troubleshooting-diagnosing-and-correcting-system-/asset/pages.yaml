    # 3.1.1.4 The syslog Configuration Files


    The Tru64 UNIX version 5 syslog facility has three configuration files: /etc/syslog.conf,
    /etc/syslog_evm.log, and /etc/syslog.auth. These files are simple text files that
    the syslog daemon reads at startup or after receiving a hang-up signal.


    # 3.1.1.4.1 /etc/syslog.conf


    This configuration file contains entries that specify the facility (see Table
    3.1), which is the part of the system that produced the message, the message severity
    level (see Table 3.2), and the destination to which the syslogd daemon should
    send the message.


