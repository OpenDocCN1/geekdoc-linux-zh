    # 3.1.3.2 Starting and Stopping binlog


    The binary error log daemon, binlog, is usually started at boot time by the binlog
    startup script, /sbin/rc3.d/S10binlog, which is actually a symbolic link to /sbin/init.d/binlog.
    The binlog daemon is started early in the boot process because of its importance
