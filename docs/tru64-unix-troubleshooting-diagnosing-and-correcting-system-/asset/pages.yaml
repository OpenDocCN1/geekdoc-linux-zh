- pgno: 121
  md: '# 5.1 Boot Failures


    problems is beyond the scope of this book; however, some obvious things to try
    are power-cycling the system and the external storage cabinet (if any) that contains
    the boot disk, checking the disk for fault indicator lights, and booting from
    an alternative disk.


    # Troubleshooting Tip


    If you are running a version of Tru64 UNIX older than V5.0, make sure that the
    boot disk has a logical unit number (LUN) of zero—that is, that the console device
    name (e.g., DKA100) ends in zero. Older versions of Tru64 UNIX cannot boot from
    a LUN other than zero.


    If the boot disk does appear in the “SHOW DEV” output, it might have a hardware
    problem; however, there are a few other things to check before deciding this is
    the case. To continue troubleshooting at this point, it''s necessary to boot the
    system from an alternative boot disk or install CD-ROM. The next step is to try
    reading the disklabel of the problem disk. This requires that you know how the
    disk is identified by the system. For Tru64 UNIX version 5, the command “hmwgr
    -view devices” (or “hmwgr -v d” for short) will list the attached devices. The
    SCSI bus, target, and LUN information in this list can be used to locate the disk.


    For example, suppose the boot disk is at the console as DKC100, indicating that
    the disk is bus 2, target 1, LUN 0. Booting the system from CD-ROM, hmwgr shows
    the following devices:


    ```

    # hmwgr --view devices

    HWID: Device Name      Mfg            Model               Location


    3: scp                               (unknown)          (unknown)

    4: /dev/ksvm                            3.5in floppy       fdi0-unit-0

    35: /dev/disk/floppy0c  COMPAQ      CDR-8435            bus-2-targ-0-lun-0

    45: /dev/disk/cdrm0c    COMPAQ      BD009222C7         bus-2-targ-0-lun-0

    46: /dev/disk/dsk0      COMPAQ      BD009222C7         bus-2-targ-1-lun-0

    ```


    The bus, target, and LUN information for the last disk in the list identifies
    it as the disk in question. The full device name /dev/disk/dsk1c indicates that
    Tru64 UNIX knows this disk as dsk1.


