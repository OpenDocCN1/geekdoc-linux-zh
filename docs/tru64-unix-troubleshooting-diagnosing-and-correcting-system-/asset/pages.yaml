    button or cycle power, because this will clear the contents of physical memory.
    The actual halting mechanism varies depending on the processor type and usually
    involves a halt button, the Control-P key sequence, or a command interpreter.
    Whatever method is appropriate for your system, use to bring the system to the
    console prompt. If the halt mechanism doesn''t produce a console prompt, there
    is almost certainly a hardware problem, and you should troubleshoot the problem
    accordingly.


