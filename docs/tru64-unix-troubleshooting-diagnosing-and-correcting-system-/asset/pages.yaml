  md: '# 4.1 User Account Problems


    three options. Because the options on either side are checked by default, some
    administrators check the middle option as well without fully understanding the
    consequences. When this happens, there are two ways to disable the feature and
    enable nonroot users to execute permission bits:


    +   - Run `sysman secconfig`, clear the "Execute bit set only by root" option,
    exit secconfig, and reboot the system.


    +   - Using `sysconfigdb(8)`, change the "noad_exec_access = 1" line in /etc/sysconfigtab
    to "noad_exec_access = 0," then reboot.


    Users sometimes have problems performing operations on files because they don''t
    understand the way permissions affect directories. In order to access any file,
    a user must have the appropriate access to the file itself, well as search (execute)
    access to every directory in the path to the file. It''s also necessary to search
    access to a directory to set it as the current directory with cd. However, to
    list the contents of a directory or perform wildcard operations on files, read
    access to the directory is required. A common error is trying to access a file
    in a directory that has read access, but not execute access. Table 4.3 shows the
    effects of the four possible combinations of read and execute access on a directory.


    # Table 4.3 Effects of Read and Execute Permission Bits on Directories


    | Read | Execute | Allowable Operations |

    |---|---|---|

    | No | No | None |

    | Yes | No | List directory contents; perform wildcard operations |

    | No | Yes | cd to directory; access files in directory |

    | Yes | Yes | All of the above operations |


    On a similar note, it seems straightforward to most users that they can''t create
    a new file in a directory unless they have write access to the directory. However,
    it may not be so obvious that write access to the directory is required to delete
    or rename a file—even if the user has write access to the file itself. This is
    because deleting a file removes its directory link, while renaming a file requires
    modifying its link. Because both operations require writing to the directory structure,
    write access to the directory is necessary.'
