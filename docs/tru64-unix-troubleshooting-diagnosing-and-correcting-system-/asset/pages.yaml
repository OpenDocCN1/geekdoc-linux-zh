    # 5.2.2.2 Simple Lock Timeouts and Other Related Panics


    Tru64 UNIX, like many other operating systems, uses a multithreaded kernel capable
    of executing simultaneously on multiple processors within a single computer. As
    such, independent threads running on different processors may require access to
    the same data structures. Without some form of locking mechanism to prevent simultaneous
    modification by multiple threads, data structures could easily become corrupted.
    Tru64 UNIX uses two forms of locks for purpose: simple locks, which operate at
    the most basic level, and the more sophisticated complex locks. Problems with
    complex locks can lead to a variety of panics beginning with the string “lock,”
    such as “lock_write: hierarchy violation.” Analysis of panics involving complex
    locks is well beyond the scope of this book and should be left to HP technical
    support.


    When a kernel requires access to an object protected by a simple lock, it attempts
    to acquire the lock for the required access (read or write). If the lock is successfully
    acquired, the kernel thread performs some operation on the object and then releases
    (unlocks) the simple lock. On the other hand, if another thread is already holding
    the lock, the thread will wait until the other thread releases the lock. (This
    is somewhat oversimplified, but it conveys the general idea.) If a thread waits
    for a simple lock for longer than a designated timeout period, a simple timeout
    occurs. The timeout period is defined by kernel parameter “lock-timeout” in the
    generic subsystem and is normally set to 15 seconds. This is'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'far longer than necessary, because most locks should be held for no more than
    a small fraction of a second. A simple lock timeout indicates that something is
    seriously wrong, the kernel panics with the panic string “simple_lock: time limit
    exceeded.”


    The simple lock mechanism is not entirely suited to nonuniform memory architecture
    (NUMA) systems, such as the AlphaServer GS80, GS160, and GS320. A different locking
    scheme, known as “MOCS locks,” is used on NUMA systems. Although the underlying
    implementation is different, the principle is the same. On a NUMA system, the
    type of panic described above would have a panic string of “mcs_lock: time limit
    exceeded,” rather than “simple_lock: time limit exceeded.”


    The immediate case of a simple lock timeout is a thread lock for longer than the
    timeout of 15 seconds. But how can this happen? A few possibilities:


    +   - A kernel thread fails to unlock a simple lock that it holds (i.e., kernel
    programming bug).

    - A kernel thread is blocked (waiting on some event) while it holds a simple lock.

    - A CPU hangs (due to a hardware problem) while executing a thread that holds
    a simple lock.


    Although timeouts are the most common, there are a number of other simple lock
    panics (e.g., “simple_lock: lock already owned by cpu”). These other simple lock
    panics are usually, though not always, caused by kernel programming errors.


    Unfortunately, simple lock timeouts are even more difficult to analyze than kernel
    memory faults. Identifying the calling routine in the stack trace of a simple
    lock panic may not be particularly helpful because the problem is not the thread
    that is trying to get the lock; rather, the thread that is holding the lock for
    too long. Identifying the problem thread is not always possible; when it is, the
    kernel debugging techniques involved are beyond the scope of this book.


    With as other panics, detailed analysis of a simple lock panic is probably best
    left to HP technical support. However, there are a few troubleshooting techniques
    that may prove helpful. When a simple lock panic occurs, the kernel prints some
    additional information, as it does with'
