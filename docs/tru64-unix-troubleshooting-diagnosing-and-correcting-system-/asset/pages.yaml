- pgno: 186
  md: '# Before you call support


    Before calling technical support for a performance problem, take the following
    actions:


    +   - Examine the error logs for hardware errors. If any errors are occurring,
    correct the problem and check performance again.

    - Go through the performance quick-look procedure discussed in section 6.5 and
    try to identify (and correct, if possible) the problem.

    - Look for unusual events, such as network problems, that may be related to the
    performance problem.

    - Check the system workload (number of users and jobs) to see whether it is unusually
    high.

    - If performance is so poor that you must reboot the system, preserve the contents
    of memory first by using the "dumpsys" command (available on V5.0 and higher)
    or forcing a crash dump. For instructions on forcing a crash dump, see section
    5.3.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Networking


    > From error to error, one discovers the entire truth.

    n—Sigmund Freud


    Creating a network can be as simple as connecting two Tru64 UNIX systems with
    a single cross-connect cable. If that all there was up to it, really wouldn''t
    be very much to troubleshoot. In real life, even the average office worker has
    a much more complex setup, often consisting of multiple hubs, a router, and a
    firewall. Any decent-sized organization today has a very sophisticated and complex
    set of communications gear and host systems to contend with. Networking, by its
    very nature, tends to involve another sets of diverse people and organizations,
    all with their own expectations and desires. In this type of environment, troubleshooting
    a network problem can be a very complex and involved process. It would be easy
    to spend many pages discussing different networking troubleshooting topics; while
    books have been written on just this topic. To stay within the scope of this book,
    we''ll confine our discussion to network issues that are directly related to Tru64
    UNIX.


    When the users on your system report a network problem, it would be nice to know
    first, if the problem is on your system, and second, if there is something you
    can do about it. If your investigation reveals that the issue is with another
    network or host, then your task is essentially done once you have forwarded the
    issue to the responsible person or organization. To make sure it actually gets
    resolved and possibly to forward the resolution to the affected users.


    In this chapter, we focus on detecting and correcting networking issues that may
    arise from your Tru64 UNIX system. These problems tend to fall'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 7.1 Networking Hardware Problems


    into two main categories: networking hardware and software issues. In the sections
    that follow, we''ll cover each of these two categories in greater depth.


    # 7.1 Networking Hardware Problems


    In this section, we will familiarize you with ways to recognize a networking hardware
    problem. Dealing with hardware problems—once they are identified—is usually a
    straightforward process, because you simply need to fix or replace the broken
    piece of equipment. For our purposes, a broken piece of networking hardware can
    include a network interface card (NIC), a cable, or a hub. Broken routers, firewalls,
    and all other complex networking gear are beyond the scope of this text and are
    not discussed.


    # 7.1.1 Intermittent Failures


    Hardware problems can manifest either as total failures or intermittent problems.
    While it would be preferable not to have hardware problems at all, it''s better
    (from a troubleshooting perspective) to have a total failure than an intermittent
    one. Total failures are easier to diagnose because the problem is static; it isn''t
    going anywhere. Intermittent failures, on the other hand, can be very difficult
    to troubleshoot. In most cases, intermittent hardware failures will leave at least
    some clues that will help to track down the faulty component.


    # Troubleshooting Tip


    When an intermittent networking hardware failure is suspected, it may be possible
    to deal with it by replacing all of the possibly faulty hardware, including the
    NIC, cable, and hub. If the problem doesn''t return, this approach can spare you
    long hours of troubleshooting a problem that only occasionally shows up. This
    is sometimes known as the "shotgun" approach because it is not very elegant. Because
    the exact cause of the failure is never known, it''s impossible to be completely
    certain that the problem won''t return.


    One of the most important tools in troubleshooting a networking hardware problem
    is the netstat(1) utility. The first step in narrowing down a network hardware
    problem is to determine which of your network inter-'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 7.1 Networking Hardware Problems


    faces (if you have more than one) is experiencing the problem. In this case, the
    `netstat -i` command provides an overview of all network interfaces and a simple
    count of the errors encountered by each interface. This command displays the number
    of outgoing and incoming errors seen by the interfaces (under the Oerr and Ierr
    headings). If any of these greater than zero, you can then drill down to get more
    information on the errors. The netstat utility can display more detailed counters
    for an individual port on a NIC. It also allows you to reset the counters so that
    it''s easy to see whether the errors are continuing to increase.


    The netstat utility provides access to counters kept by the link layer level of
    the network stack, which are most useful when diagnosing network hardware problems.
    The link layer contains the specific interface driver that interacts most closely
    with the network interface hardware; consequently, the link layer driver is the
    most likely to be exposed to any hardware layer errors that occur. A typical command
    to get the link level counters for a particular interface on a Tru64 UNIX system
    is following:


    ```

    netstat -I ln0 -s

    ```


    In this example, "ln0" is the UNIX name for the first Ethernet interface on a
    system. This command will display a plethora of statistics about the various types
    of errors detected by the network interface. This includes information about collisions,
    which are a normal occurrence for interconnects, such as Ethernet.(Although collisions
    are not errors as such, an excessive number of collisions can indicate a problem
    in the form of a swamped network.) In this output, the key phrase to look for
    is "receive failures, errors" and the subsequent list of reasons. These are typically
    hardware-related problems that should be investigated.


    Instead of watching these counters iteratively (especially because they eventually
    overflow if not zeroed periodically), you might wish to create a cron script that
    runs daily to reset these counters and then them them. This approach will make
    it easier to detect trends, such as errors that happen at particular times of
    day or other specific conditions. If the problem occurs with some regularity,
    you could adjust the time for the cron job to run just before and just after the
    time eventually occurs. This would provide the further evidence you need to support
    (or disprove) any theories as to the cause of the problem.


    As an example of a problem that first didn''t look as though it would end up as
    an intermittent hardware issue, we started with a symptom that'
