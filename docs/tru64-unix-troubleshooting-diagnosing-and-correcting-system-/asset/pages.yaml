- pgno: 183
  md: '# 6.5 Checking System Performance


    +   1. If free memory consistently stays above the target value, there is no a
    memory problem.


    +   2. If free memory is bouncing above and below the target, it''s likely that
    page thrashing is occurring. Check and tune the UBC as described in section 6.2.2.


    +   3. If free memory consistently stays below the target, the system is probably
    swapping. Check the pout column in the vmstat output; a nonzero value (except
    in the first line) confirms swapping occurring. Check and tune the UBC. If this
    doesn''t help, look for some of the other memory issues discussed in section 6.2.


    If free memory stays low, monitor the amount of system memory (the "wire" field)
    over a reasonably long period of time—hours or even days. If the amount of wired
    memory increases, the system may be experiencing a memory leak. This type of problem
    should be reported to technical support. If you tune memory, but problems still
    remain, it may be time to add physical memory to the system. However, it''s worth
    checking for performance problems in other areas first. Some problems have effects
    in multiple areas; for example, an overloaded network can cause the system to
    use a large amount of memory to hold incoming network packets.


    # 6.5.2 Looking at CPU Utilization


    The vmstat command also provides a quick look at CPU utilization. The last four
    fields ("us", "sy", "iowait") display the percentage of CPU time spent in user
    mode, system (kernel) mode, and waiting for I/O to complete. (Without the -w switch,
    IO wait is included in idle time.) The number of runnable processes (the first
    field in the vmstat output line) is also useful. Different distributions of CPU
    time lead to different conclusions:


    +   - If idle time is high and the load average (displayed by the uptime command)
    is low, the system is performing well.


    +   - If idle time is high but load average is high or there are too many runnable
    processes (consistently greater than the number of processors 1 or 2), there may
    be an I/O bottleneck. Use tools like iostat and collect to gather I/O statistics
    and check for I/O problems, as'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 6.5 Checking System Performance


    discussed in section 6.4. It''s also possible that the UBC is too small; check
    for this using the method described in section 6.2.2.


    +   - If idle time and system time are low, but user time is high, check the load
    average and the number of runnable processes. If these look reasonable, the system
    is probably performing well. If it is too high, there may be a CPU bottleneck.
    Check for CPU problems as discussed in section 6.3.


    +   - If idle is low and system time is high, it''s likely that either a memory
    or I/O bottleneck exists. Check the free memory usage as described previously;
    if there isn''t a bottleneck, check for I/O problems as discussed in section 6.4.


    +   - If user time is high, run the "ps aux" (piped to "head" or "more") to identify
    the processes consuming the most CPU time. If a process is using an unreasonable
    amount of CPU resources, it should be investigated.


    The foregoing suggestions contain some fairly vague terms like high, low, and
    reasonable. Unfortunately, CPU utilization is not as easily quantifiable as memory
    utilization, which is a simple matter of comparing the amount of free memory to
    an objective target. Whether system time or user time is high or low is somewhat
    subjective and depends on the workload mix and overall capacity of the system.
    In some cases, 20 percent system time is unacceptably high, while in other cases
    it''s perfectly reasonable. Historical data can help decide whether a problem
    exists.


    # 6.5.3 Looking at I/O Performance


    It takes a little more work to look at I/O performance than it does for the other
    two components, simply because I/O performance can be affected by many factors.
    Consequently, there are several things to look for. The following steps don''t
    need to be performed in the order listed; if any seem applicable to your situation,
    check them first.


    +   - Check the binary error log using tools as DECevent or Compaq Analyze. Correct
    any errors in the I/O subsystem. (Note: a high number of device errors can also
    lead to excessive system-mode CPU time.)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   Check AdvFS domains for fragmentation, as described in section 6.4.1.


    +   Check for a too-small UBC (see section 6.2.2) and correct it necessary.


    +   Gather I/O and file system statistics using tools such as iostat, advfsstat,
    and collect. Look for heavy I/O loads to a single device or I/O bus.


    If an I/O bottleneck exists, look for ways to improve the I/O configuration as
    it affects the problem devices. Some possible actions to take include the following:


    +   Enable write-back cache if it''s available and not currently used. This can
    provide a dramatic performance improvement.


    +   Distribute the I/O load if possible. Avoid having tape and disk devices on
    the same I/O bus. If possible, multiple heavy-usage disks on a single bus should
    be distributed to different buses.


    +   Check the swap configuration, as described in section 6.2.1.


    +   Look for ways to optimize the storage configuration. Consider using RAID 0+1
    instead of RAID 5. Try to stripe across multiple buses if possible.'
