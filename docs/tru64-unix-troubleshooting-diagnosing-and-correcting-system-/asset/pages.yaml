    Corruption in the authentication database can lead to a wide variety of problems
    with user accounts. When you encounter difficulties while running Enhanced security,
    one of the first troubleshooting steps should be to run the authchk(8) command.
    This command checks the components of the authentication database for integrity
    and consistency. If authck reports any problems, repair them with edauth and see
    whether the problem is corrected.


    Tru64 UNIX version 5.0 introduced the enhanced security daemon, prpasswdd(8).
    This daemon coordinates writes to the authentication database files, preventing
    file lock contention among multiple writers, particularly in Cluster environments.
    If prpasswdd stops accepting requests for reason, logins may fail or hang. This
    is generally corrected by restarting prpasswdd with the command `/sbin/init.d/prpasswdd
    restart.” (Note that there is only one "d" in "prpasswd" in the restart command,
    although there are two in the daemon''s name.) In a cluster, it may be necessary
    to restart prpasswdd on all members.


    Also beginning in version 5, changes to the authentication database are recorded
    in log files under directory /var/tcb/files/dblogs. These log files can lead to
    some potential problems:


    +   Unless they are periodically trimmed, the log files will continue to grow
    without limit until the /var file system is full, which can cause any number of
    unpleasant errors. It''s possible to set up a cron job to `sysmanseconfig`; on
    the Custom Options screen, click the button to configure authorization database
    options. This lets you trim the logs immediately or create a cron job to trim
    the logs at regular intervals. Note that you should always use seconfig to trim
    the logs rather than just removing the log files with rm, or the authentication
    database may become inconsistent.


    +   Corruption of the log files can cause logins to fail, resulting in messages
    such as “log_get: read I/O error” and “log_get: checksum mismatch.” When this
    happens, simply trim the log files via sysmanconfig as described above. You may
    also need to restart prpasswdd.'
