- pgno: 118
  md: '# 5.1 Boot Failures


    tiuser mode with no network) to run level 3 (multiuser mode with network). /sbin/rc2
    and /sbin/rc3 are Bourne shell scripts. The first line of each of these script
    files is


    ```

    #/sbin/sh

    ```


    In both files, modify the first line by adding “-x” at the end of the line. The
    new line will be


    ```

    #/sbin/sh -x

    ```


    The “x” switch turns on echo mode in the Bourne shell. As a result, each command
    or script executed by /sbin/rc2 or /sbin/rc3 will be echoed to the console. After
    modifying the scripts, try booting the system to multiuser mode with “init 3”
    command. As the commands echo to the console, observe the last command executed
    before the problem occurs. This will identify the particular startup script (in
    /sbin/rc2.d or /sbin/rc3.d) that is executing when the problem occurs.


    To isolate the problem, you can repeat this process by turning on echo mode the
    startup script that was identified. Boot the system to single-user mode and mount
    the local file systems as described above. Then edit the startup script in question
    and add “x” to the end of its first line. Continue the boot to multiuser with
    “init 3” and observe the last command that executes before the problem. This will
    identify the utility that is executing when the problem occurs. This information
    may help you locate the actual problem and correct it.


    Alternatively, you may choose to disable the startup script (if it is not critical
    to system operation) as a workaround to continue booting. For example, if the
    problem is “sbin/rc3.d/S40endmail” and mail is not a critical function of the
    system, you can temporarily rename the script so that its name begins with a character
    other than “S,” such as “disable.S40endmail.” The run-level startup scripts (/sbin/rc2
    and /sbin/rc3) execute only startup scripts whose names begin with an upper-case
    “S.” Then trying to see if the system boots successfully or if further problems
    occur later in the boot sequence. In this example, a successful boot would indicate
    that the problem is specifically tied to mail in some way, while a further problem
    in the boot sequence would indicate a wider problem.'
