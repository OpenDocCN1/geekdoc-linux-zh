- pgno: 192
  md: '# 7.1 Networking Hardware Problems


    Here we see that the errors are "Block chain error," "Framing error," and "Frame
    too long." All of these messages indicate a hardware problem, to determine whether
    the problem is with the NIC, the cable, or the hub, but we had to do further investigation.
    In this case, the first thing that we tried was to move the primary interface
    over tu0, because that wasn''t currently being used. These were on two different
    DE500 cards, which indicate whether tu1''s NIC was bad. However, the interface
    was switched, the errors returned. Next, the cable was switched out and didn''t
    help either. Finally, a longer cable was plugged into another hub a little farther
    away; the errors immediately stopped, and the NFS errors didn''t return. This
    conclusively proved that the hub was failing and needed to be replaced. Once this
    was done, the longer cable was eventually removed and the former cable put back
    in place to the new hub.


    This example shows how a problem first displayed as a software problem with NFS
    turned out to be an intermittent hardware issue. This was far from when the investigation
    started, so to keep an open mind with regard to intermittent hardware issues.
    If all services working, then it is pretty the problem involves a total failure
    of some kind, and it would be reasonable to start an investigation in that case.
    The next thing we want to illustrate with this example is a methodical approach
    for troubleshooting a problem like this. It may seem hopeless at first, but if
    you follow logical steps using the tools available with Tru64 Unix, you will eventually
    succeed in discovering the root cause of the problem.


    In addition to using "netstat" to keep track of counters, you may want to keep
    an eye on the system''s binary error log to help discover the nature of a networking
    hardware problem. If a driver encounters a hardware issue, it will typically record
    the issue in a log file, and the binary error log is one such place. It''s necessary
    to use a tool such as Compaq Analyze (or any of the tools discussed in Chapter
    3) to format the binary error log into a readable form.


    # 7.1.2 Total Failures


    In contrast to intermittent NIC failures, total failures tend to be obvious in
    the way they affect multiple network services. For example, when a NIC fails completely,
    one user may report problems accessing a Network File System (NFS) served by your
    system, while another user complains about not being able to telnet to the system,
    and a third is unable to access the system''s Web pages. Further investigation
    is needed to identify'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 7.1 Networking Hardware Problems


    the particular NIC common to all three problems. If the system has a single NIC,
    this is pretty obvious. More complex setups are trickier. For example, the system
    may contain more than one NIC, with networks located on different subnets. The
    problem may be further complicated if a dynamic routing daemon, such as gated(8),
    is in use; it could masking the true nature of the problem. It may even be that
    the host is working as intended by masking the problem from your users. While
    this is good for the users, it can make troubleshooting more difficult.


    # 7.1.2.1 Identifying the Failing NIC


    The first step in troubleshooting a total failure situation is identifying the
    NIC most affected by the problem. Many systems today have multiple NICs, possibly
    running different sets of networking protocols. A typical system may contain a
    single 10/100-Mb Ethernet adapter; on the other end of the complexity scale, a
    single system might have multiple 10/100 Ethernet, gigabit Ethernet, X.25 WAN,
    and a Token Ring interface—or even more. In most cases, the process of troubleshooting
    a failed NIC is not affected by the underlying technology. The first step is to
    use "netstat" command (as discussed in section 7.1.1) to examine the link layer
    statistics and determine if any error counters are increasing.


    # Troubleshooting Tip


    Before your system has trouble, it is worth to employ the time to a littleemptive
    troubleshooting. To simulate various failures, try removing the network cable
    from each active port on all NICs (one at a time) when the system can be used
    for testing. This is sometimes known as the "cable pull" test. Following each
    cable removal, you should observe how the different services behave. This will
    provide valuable experience for understanding how the system might react during
    a real failure. As an added bonus, you might also see a way to redesign the network
    to reduce the impact of a network hardware failure.


    The total failure case differs from the intermittent case in that for every outgoing
    packet, the error count will increase by one. In the intermittent case, there
    probably wont be such a one-to-one correspondence; there may be many packets successfully
    sent for each failed packet. For this reason, the total failure case is much more
    straightforward to troubleshoot. We recommend setting up one window with a running
    netstat output. In another


    # Chapter 7'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 7.1 Networking Hardware Problems


    window


    # 7.1.3 Determining the Broken Component


    Once you''ve narrowed the problem to the affected NIC, the next step is to determine
    whether the problem component is the affected NIC itself, the hub or switch to
    which the NIC is connected, the interconnecting cable, or some other hardware
    between the two. In some cases, software-based troubleshooting is not sufficient
    to make this determination. It''s frequently necessary to replace components systematically
    with known good parts until the faulty one is discovered. We recommend starting
    with the cable because it is probably the most easily replaced, then trying another
    port on the hub or switch to which the host is connected, and finally replacing
    the NIC. If the cable involves complicated building-level wiring, see whether
    you can switch to another circuit or use a patch cable. Because the problem is
    not intermittent, you should know very quickly whether the problem has been resolved
    or not after each component replacement.


    There is a wide variety of possible hardware problems that can lead to a total
    network interface failure. These problems include the following:


    +   - Broken NIC

    - Cable cut

    - Broken cable connector

    - Faulty wiring

    - Unsupported NIC

    - Incorrect system console parameters for the NIC

    - Bad or powered-off hub/switch

    - Failed hub/switch port

    - Bad transceiver

    - Bad or powered-off repeater

    - Bad or improper cable tap

    - Bad terminator'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 7.1 Networking Hardware Problems


    The last four of these pertain mostly to older configurations. With some older
    configurations, such as 10Base2 or 10Base5, there may be a transceiver connected
    from the NIC to the cable, as well as another device known as a cable tap, or
    perhaps even a repeater such as a DELNI, DEREP, DESPR, or DEMPR in the mix.


    The authors have experienced problems with cable taps that have gone bad when
    exposed to moisture or simply when too close together. For example, a new tap
    on a 10Base5 cable may cause problems elsewhere on the backbone due to reflections
    in the signal. Similarly, a bad or misconfigured transceiver could cause failures
    along the entire cable. It is very common for the heartbeat setting to be incorrect
    on a transceiver, which causes strange issues for the host connected to.


    When troubleshooting networking hardware problems, it is usually helpful to come
    up with a simple reproducer, such as pinging a host one away from the affected
    NIC. Another host or router on the same physical network is ideal for this; your
    network''s default gateway is a good choice. Alternatively, if the host is a member
    of a cluster or a group of systems performing the same function, you can try one
    of its peers. Be use the Internet Protocol (IP) address or hostname that exists
    in the local /etc/hosts file so that the problem will not be complicated by possible
    DNS or NIS issues. If you''re not sure what hostname resolution order is, consult
    the /etc/svc.conf file on your system and look for the hosts entry. If local is
    not listed first, use the IP address and forgo attempting to use network names
    for this. (For more information on issues related to hostname resolution, section
    7.2.5.3.)


    Some NICs, as as the DE504 and the DE602, have more than one Ethernet interface
    or port within the same card. In such cases, the problem you''re troubleshooting
    may affect more than one of these ports. Sometimes you get lucky and the affected
    NIC fails in a way that the problem manifests itself on another port on the same
    NIC. We consider this to be a good thing because almost invariably indicates that
    the problem is with the NIC itself, not a bad cable or hub/switch port. This obviously
    streamlines the troubleshooting process.


    Auto-negotiation is an Ethernet feature (described in clause 28 of the 1998 IEEE
    802.3 standard) by which two adjacent interfaces, such as a NIC and a hub, decide
    what speed to use to communicate with each other. Because Ethernet supports multiple
    speeds, autonegotiation uses a very low-level protocol that works at the hardware
    level to determine the highest possible speed at which the devices communicate.


    Chapter 7'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Troubleshooting Tip


    Remember that in a critical network-troubleshooting situation, DNS or NIS services
    may not be available. Keep a list of your system names and IP addresses, along
    with a sketch of the network topology, in a separate location, such as a notebook
    or a file located on another system. This will prevent loss of valuable troubleshooting
    time when you''re under the gun.


    In rare cases, autonegotiation doesn''t work properly (usually because of some
    misbehavior in one of the devices) and you may need to set one of the devices
    explicitly to use a specific speed setting. There is usually a way to set the
    speed on a hot NIC port or hub/switch port. On an Alpha system, you can set the
    speed of each port on each NIC via a console parameter. For example, to change
    the port speed characteristics for the first port on DE602, you will need to look
    for the parameter "iao_mode" and change it to the desired mode. The default setting
    is "Auto-Negotiate," "Half-Duplex," "Full-Duplex," and "Twisted-Pair" are also
    valid. See the documentation for your network card for a complete description
    of these settings.


    # Troubleshooting Tip


    Some hubs have ports that are used only for uplink ports and should be used only
    to connect to other upstream hubs. If you attempt to use one of these ports to
    connect to a host system, the port will not auto-negotiate correctly and your
    system will not be able to communicate with the network. For this reason, the
