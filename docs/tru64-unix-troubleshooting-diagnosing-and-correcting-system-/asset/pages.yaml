    # 7.2.1.3 Routing Issues


    If you''ve verified the system and network configuration, but the host still has
    a problem communicating on the network, the next logical thing to check is the
    system''s routing configuration. If routing is not configured properly, some hosts
    might be unable to connect to your system, while others might have no problem.
    In the previous section, we discussed setting up a basic default gateway. The
    default gateway is a special route that should exist on every system, but there
    can be other routes, which could become numerous and complex. Your system operate
    simply as an end point on'
