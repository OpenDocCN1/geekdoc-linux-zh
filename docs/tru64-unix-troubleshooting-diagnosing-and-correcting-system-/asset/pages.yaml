- pgno: 127
  md: 'When this happens, try booting the generic kernel (genvmunix) or an alternative
    kernel.


    # 5.1.2.4 Machine Checks


    Machine checks, which generate messages such as “machine check” or “unrecoverable
    hardware error,” are always hardware problems, as a CPU cache read error. Software-generated
    machine checks aren''t completely unknown, but they are extremely rare. If your
    system experiences a machine check while booting, try the standard workarounds
    listed in section 5.1.1 to get the system booted. This will at least give you
    access to some of the system utilities for error detection, which may help you
    to troubleshoot the hardware.


    # 5.1.2.5 Panics During Boot


    A “panic” occurs when the UNIX kernel detects a severe error that prevents it
    from operating safely. Rather than continuing to operate in an environment where
    data corruption may occur, the kernel chooses to bring the system down and write
    a crash dump to preserve information about the problem. Depending on the console
    parameter settings, the system may immediately try to reboot and resume operation.


    When a system panics while booting, a limited amount of troubleshooting is possible.
    Certain panic messages at boot may indicate specific problems that are worth checking
    for. These panic messages include the following:


    +   - “ialloc: dup alloc"

    - “kernel memory fault” or similar messages, such as “unaligned kernel access”

    - “rmalloc"

    - “simple_lock: time limit exceeded” or other lock-related panics

    - “vfs_mountroot: cannot mount root”


    We will discuss this a bit further below. There are also certain panics that almost
    always indicate hardware problems. In addition to machine checks, these include
    “tb_shoot ack timeout” and “vm_swap I/O error.” These'
  merge: -1
  img_proc: true
- pgno: 128
  md: "should be handled similarly to machine checks (i.e., follow the appropriate\
    \ hardware troubleshooting procedures for your site).\n\nThe “ialloc: dup alloc”\
    \ panic is caused by UFS file system corruption. This is usually (but not always)\
    \ in the root file system. The corruption can usually be corrected by the fck(8)\
    \ command. Using the techniques listed in section 5.1.1, mount each file system\
    \ in order to identify the corrupted one, then use the fck command to repair it—for\
    \ example:\n\n```\n# fsck -y /dev/rdisk/dsk1\n```\n\nSubstitute the correct disk\
    \ partition for “dsk1.” Normally, fsck will ask whether to correct each instance\
    \ of corruption that it detects. The “y” switch automatically answers “yes” to\
    \ all of these questions. After correcting the corruption, make sure that the\
    \ /etc/fstab contains a non-zero number in the last field. For the root file system,\
    \ this number should be 1; for other file systems, it should be 2 or higher. \n\
    \n“Kernel fault” is a generic panic indicating that the kernel attempted to access\
    \ an invalid memory address. (A more detailed explanation is provided in section\
    \ 5.2.2.1.) This panic generally requires further analysis—at a minimum, examination\
    \ of the stack trace leading up to the panic. However, there is one problem known\
    \ to cause this panic at boot time. If you have upgraded the console firmware\
    \ on an Alpha system that contains an EISA bus (which most, but not all, models\
    \ do contain), you must re-run the EISA Configuration Utility (ECU) after upgrading\
    \ the firmware.\n\nThe “malloc” panic is seen on AlphaStations with ISA buses\
    \ and is generally a result of improper or corrupted ISA configuration data. It\
