    A UNIX process includes a text segment, which contains executable code and other
    constants; a data segment, which contains defined data storage; and a stack segment,
    which contains the program stack. The data and stack segments are limited as shown
    in Table 4.2, the text segment is not specifically constrained. However, the total
    size of the text, data, and stack segments is limited by the virtual memory size
    limit. (There is one further constraint in older versions of Tru64: the total
    size of the text, data, and stack segments, as well as all shared memory segments
    attached to the process, is limited by kernel parameter `vm_maxvas` in the vm
    subsystem. This limit was removed in V5.0).


    An additional limit (imposed by the kernel, not the shell) is the `max_proc_per_user`
    parameter in the proc subsystem. This parameter, defaults to 64, defines the maximum
    number of processes that a nonprivileged user can execute at any time. This limit
    prevents a user from accidentally or maliciously creating a huge number of processes,
    which could consume all of the system''s available process slots. The default
    value of 64 is not enough for some applications; to increase it, change the value
    of `max_proc_per_user` with `dxkerneltune(8)` or `sysconfdb(8), and then reboot
    the system.


    There is also a hidden limit involving `max_proc_per_user`. Because a single user
    can run more processes than the entire system is allowed to run at one time, `max_proc_per_user`
