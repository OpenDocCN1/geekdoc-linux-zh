  md: '# 3.1 System-Level Error-Reporting Facilities


    # 3.1.1.5 Default syslog.conf


    When the syslog daemon starts, it looks for /etc/syslog.conf by default. Alternatively,
    a configuration file may be specified on the syslog command line when starting
