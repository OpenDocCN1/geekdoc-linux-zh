- pgno: 237
  md: '# Logical Storage Manager


    hardware problems or errors logged by the daemon itself. If you find any errors
    of this type, take steps to correct the underlying problem so the volume-configuration
    daemon doesn''t hang again.


    If restarting the daemon fails because it has become uninterruptible, you may
    need to reboot the system to clear the issue. Again, check for hardware or other
    problems that led to the hanging daemon. If necessary, report the problem to HP
    technical support for help in diagnosing the hang.


    # 8.3.6 Diagnosing LSM Boot Failures


    As we have previously noted, there may come a time when LSM doesn''t behave properly
    on system boot. Diagnosing a boot problem in LSM can be tricky, because it may
    appear that some of the tools are not available, hindering the troubleshooting
    process. This occurs because the system typically hasn''t gotten far enough in
    the boot sequence to mount its /var file system and started the syslog and binlog
    daemons; as result, errors are not being logged. In this, the first approach is
    to check the system configuration and verify that it is correct. If you find something
    that looks wrong, make an adjustment and see whether the boot process succeeds.


    You can also try watching the system console on boot or capturing terminal or
    printer to the console to log any messages that might be coming to it. There may
    be a useful piece of information in the console log that points you to the real
    problem. Another useful technique is increasing the logging level of the volume
    configuration daemon, as shown in the previous section. In this situation, make
    sure the output from the log is sent to a file on the root file system, so that
    it will be accessible in single-user mode (using the system gets that).


    If none of these techniques reveal the problem, it''s helpful to understand the
    kinds of LSM problems that can happen during the system boot process. Armed with
    this information, you can investigate a problem in the configuration. Once again,
    if you have made any adjustments to the system since the last successful system
    boot that impact LSM, you should also concentrate on those areas as well. Your
    system configuration log should tell you what was done and when.


    Some of the problems that could crop up in the boot process include the following:


    +   - Boot hang'
  merge: -1
  img_proc: true
