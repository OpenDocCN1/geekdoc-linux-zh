    The first step in tracking down a potential software problem is to examine any
    configuration issues that may be preventing the network from operating properly.
    The three main areas to be checked are the following:


    +   1. Are there any system-related issues that prevent networking?

    2. Is the interface configured properly for the network it is connected?

    3. Is the routing correct, and are the packets going where they should?


