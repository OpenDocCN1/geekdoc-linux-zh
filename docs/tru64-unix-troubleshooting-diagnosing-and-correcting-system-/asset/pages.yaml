- pgno: 313
  md: '# Display Problems


    > Experience is that marvelous thing that enables you to recognize a mistake when
    you make it again.


    Franklin P. Jones


    In this final chapter, we discuss problems that arise connected to Tru64 UNIX
    systems. These problems fall into three general classes:


    +   1. No display

    2. Incorrect display appearance

    3. Problems with the Common Desktop Environment (CDE)


    Each of these problem types is discussed in the following sections. Before beginning,
    however, there are a few general troubleshooting techniques worth mentioning.
    These techniques apply to all types of display problems.


    # 12.1 General Troubleshooting Techniques


    There are three generic issues that can lead to display problems:


    +   1. Obsolete system firmware

    2. Incorrect EISA or ISA configuration

    3. Incorrect Open3D version'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'These can cause a wide variety of problems, so it''s a good idea to check for
    them early in the process of troubleshooting any display problem.


    # 12.1.1 Obsolete System Firmware


    Out-of-date system (console) firmware can cause a graphics display to operate
    incorrectly or not at all. To check the system firmware version, enter the following
    command at the console prompt:


    ```

    >>> SHOW VERSION

    V6.1-1011 Oct 11 2001 13:39:58

    ```


    If your system is already booted, you can still determine the console firmware
    version without shutting down the system. The following command will retrieve
    the firmware version on some—but not all—Alpha systems:


    ```

    # consvar -g version

    version = V6.1-1011 Oct 11 2001 13:39:58

    ```


    If the "consvar" command doesn''t work on your system, it''s possible to find
    the firmware version in the most recent boot record in the system message file:


    ```

    # grep "vmunix: Firmware" /var/adm/messages | tail -1

    Jun 28 03:18:09 hostname vmunix: Firmware revision:

    V6.1-1011

    ```


    Ensure that the firmware is compatible with the version of Tru64 UNIX you''re
    running. If it isn''t, upgrade to a compatible version. If you upgrade the firmware,
    be sure to run the EISA Configuration Utility (ECU) afterwards.


    # 12.1.2 Incorrect EISA or ISA Configuration


    A number of Alpha systems communicate with their graphics adapters via an ISA
    bus, and a few of the older AlphaStation models use an ISA bus for this purpose.
    If the EISA or ISA configuration information becomes cor-'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'rupted, display problems (among others) may occur. In addition, updating the
    console firmware will clear the EISA/ISA configuration data. Restoring the EISA/ISA
    configuration may resolve a display problem immediately. Because this is a quick
    and easy process, it''s worth a try in most situations.


    If your system contains an ISA bus, you can initialize the ISA configuration by
    entering the following command at the console:


    ```

    >>> isacfg -init

    ```


    This restores the ISA configuration to a known baseline. Depending on the graphics
    adapter and operating system, additional "isacfg" commands may be necessary to
    configure the adapter for proper operation; check the graphics adapter documentation
    for details. Also, the necessary console command may be "config" rather than "isacfg"
    on systems.


    To restore the ISA configuration, run the ECU, which is provided on a floppy diskette
    with the Tru64 UNIX distribution. Older versions of the ECU come in two versions—one
    for Tru64 UNIX and OpenVMs, the other for Windows systems. Be sure to use only
    the former version, which is labeled "UNIX/VMS" on the diskette. For EISA graphics
    cards, the ECU automatically configures the correct EISA configuration options.
    For ISA cards attached to an EISA bus, additional ECU operations may be necessary;
    check the documentation for your graphics adapter. When finished, choose the "Save
    and Exit" option. After the ECU exits, reset the system.


    # 12.1.3 Incorrect Open3D Version


    In Tru64 UNIX 4 and earlier, some graphics adapters required the Open3D layered
    product to operate correctly. (Version 5 systems do not require Open3D.) If the
    Open3D version isn''t compatible with the operating system, graphics displays
    may behave strangely or fail to work at all. Check the documentation for your
    version of Open3D to make sure it supports your version of Tru64 UNIX. If not,
    switch to an appropriate version of Open3D.


    # 12.2 No Display


    If a graphics display fails to work at all, there are a number of possible problems
    in addition to the general possibilities in the previous section. The following
    questions will help to verify basic operation and connectivity:'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 12.2 No Display


    +   - Is the cable from the graphics adapter to the monitor hooked up correctly?
    If not, most modern monitors will display a message such as “No Video” or “No
    Signal.”


    +   - Does the graphics card require any jumpers to be set? Check the documentation
    and verify the jumper settings, if any.


    +   - Does the display work in console mode (i.e., with the system halted?) If
    so, the hardware is working and there is connectivity for the video signal.


    If basic connectivity is verified, the problem may be that the X server isn''t
    running. To check this, log into the system via telnet and determine whether a
    display manager process (either “dtlogin” or “xdm”) is running. This can be accomplished
    with the following command:


    ```

    # ps ax | egrep ''dtlogin|xdm'' | grep -v grep

    ```


    If the X server is running, the above command should return one line of ps(1)
    showing the display manager process. If no output is produced, the X server isn''t
    running. In this case, it''s worth a quick try to restart the X server:


    ```

    /sbin/init.d/xlogin start

    ```


    If the X server isn''t running, it''s possible that console variable “CON-SOLE”
    is set to “SERIAL” rather than “GRAPHICS.” The former setting specifies that the
    system is using a serial terminal as the system console; in this situation, Tru64
    UNIX will not start the X server. To check the setting of this variable with the
    system halted, enter the “SHOW CONSOLE” command at the console prompt:


    ```

    >>> SHOW CONSOLE

    SERIAL

    ```


    On some Alpha platforms, you can use the consvar(8) command to retrieve the console
    setting while Tru64 UNIX is running:


    ```

    # consvar -g console

    console = serial

    ```'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'On other platforms, you may need to halt the system to check the variable setting.
    If the console variable setting is correct, verify that Tru64 UNIX recognizes
    the presence of a graphics display. To check this, enter the command `sizer -wu`.
    If this returns a value of zero, Tru64 UNIX does not detect any graphics displays
    on the system.


    Another way to determine whether Tru64 UNIX detects a graphics adapter is with
    the `sizer -gt` command. If this command does not return any output, the operating
    system does not detect a graphics device. Or if no output, the output is the word
    "GENERIC", Tru64 UNIX is operating in generic console mode. Generic console mode
    is a fallback used to operate a graphics display as a console terminal if no graphics
    adapters or hardware is detected. (This mode is used only for console terminal
    support; X windows will not run in generic console mode.)


    If the system is in generic console mode, there should be messages on the console
    and in /var/adm/messages that will help determine the source of the problem. Typical
    error messages include the following:


    +   - No graphics console driver configured

    - Generic console support installed: using firmware callbacks

    - Generic console support installed: using VGA


    The presence of any of these messages usually indicates one or more of the following
    problems:


    +   - The graphics driver for the adapter isn''t configured in the kernel. (This
    is often an Open3D version problem.)

    - The graphics device has a hardware problem or incorrect jumper setting.

    - The EISA or ISA configuration is corrupt.


    If Tru64 UNIX detects a graphics adapter and the graphics console is selected,
    the X server should at least be trying to start. Try starting the X server manually
    with the command `/sbin/init.d/xlogin start`. If this works, the next step is
    to determine whether the X server is starting at boot time and then crashing,
    or failing to start at all. The X server is one of the last things to start as
    Tru64 UNIX boots to run level 3. The symbolic link `/sbin/rc3.d/S95xlogin`, which
    points to `/sbin/init.d/xlogin` (the actual startup script file), must be present
    for the X server to start automat-'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 304


    # 12.2 No Display


    ically. If the symbolic file is missing (i.e., it was removed or renamed such
    that its name no longer starts with the letter S), the startup script will not
    run and the X server will not start.


    To verify that the script is running at startup (and if so, whether the X server
    is starting), edit the startup file (/sbin/init.d/xlogin) and add "-x" to the
    end of the first line (i.e., change the line from "#/bin/sh" to "#/bin/sh -x").
    The -x switches the shell to echo each line of the script to the console as it
    executes. Reboot the system and watch the console messages during the boot process.
    When the commands in the xlogin script are echoed to the screen, you can observe
    whether the X server starts fully.


    If the X doesn''t start successfully, examine its log file for errors or other
    messages. The location of the log file is dependent on the system you are running.
    For CDE (the default for Tru6 UNIX), the log file is /var/dt/Errors for the older
    X display manager (xdm), the log file is /var/X11/xdm/xdm-errors. The messages
    in this log file should help identify the problem.


    A common cause of X server startup problems is an error in one of the X server
    configuration files. These include the general configuration file ("var/X11/Xserver.conf")
    and a specific file dependent on which display manager you are running (/var/dt/Xservers
    for CDE or /var/X11/xdm/Xservers for xdm). If you have made any changes to the
    X server configuration, try backing out the changes by reverting to the previous
    version of the modified configuration file.


    Another problem that can prevent the X server from starting is not having the
    appropriate display fonts installed. In this case, the Xerrors log file will contain
    messages indicating that a font was not found. There are two different font subsets
    to be concerned with. If both subsets are installed (as in the following example
    from a V5.1 system), there is nothing to worry about:


    ```

    # setld -i | grep dpi

    OSFFONT515 installed DECwindows 100dpi Fonts

    (Windowing Environment)

    OSFFONT510 installed DECwindows 75dpi Fonts

    (Windowing Environment)

    ```


    However, if only one font subset is installed, it may be the wrong one. Graphics
    devices with a resolution of at least 1280 x 1024 use the 100dpi'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'fonts, whereas the 75 dpi fonts are used for resolutions of 1024 x 768 and
    lower. If you have a graphics device whose default resolution is 1024 x 768, it''s
    possible that only the 75 dpi font subset is installed. If you upgrade to a graphics
    adapter with a resolution of 1280 x 1024 by the 100 dpi fonts weren installed,
    the X server will not be able to start. This problem is quickly resolved by loading
    the missing subset from the Tru64 UNIX installation CD-ROM.


    Another no-display problem occurs when trying to run a graphical interface on
    a remote system (i.e., with an X display on the local system). This requires that
    X access control be set up to allow connections from the remote system to the
    local X server. To enable or disable X access, use the "xhost(IX)" command. If
    X access is not properly configured, attempting to run a program remotely in a
    sequence of error messages similar to the following:


    ```

    Xlib: connection to "martin.alt.cpqcorp.net:0.0" refused

    by server

    Xlib: Client is not authorized to connect to Server

    Error: Can’t open display: martin.alt.cpqcorp.net:0

    ```


    In this situation, remote X access from hostname "foo" can be enabled with a command
    such as the following:


    ```

    xhost +foo

    ```


    See the xhost reference page for more information.


    # Incorrect Display Appearance


    If a graphics display works (assuming a reasonably tolerant definition of “works”),
    but the display appearance is incorrect, there are a number of possibilities.


    +   - Incorrect X server configuration

    - Incorrect graphics adapter type

    - Incorrect jumper settings on the graphics card'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 306


    # 12.3 Incorrect Display Appearance


    “Incorrect appearance” includes problems such as strange or missing colors, incorrect
    resolution, text overflowing the surrounding boxes, and similar problems.


    An incorrect setting in one of the X server configuration files ("/var/X11/Xservers"
    and either ("/var/dt/X11/xdm/XServers") can cause a graphics adapter to generate
    incorrect display output. This is most frequently a problem with the screen resolution
    or vertical synchronization rate. These parameters can be configured by defining
    X server switches in the server configuration file. For example, the following
    line at the end of the configuration file sets screen 0 (the first or only graphics
    display) to a resolution of 1280 x 1024 and a vertical sync rate of 70.


    ```

    :0 Local local@console /usr/bin/X11/X -screen0 1280

    -vsync 70

    ```


    # Caution


    Not all monitors support all resolutions or vertical synchronization rates; check
    your monitor documentation before making adjustments. Older monitors can potentially
    be damaged when attempting higher resolutions or sync rates.


    If Tru64 UNIX doesn''t recognize a graphics adapter correctly, it may attempt
    to use the wrong graphics driver or, more likely, default to either generic console
    mode (described above) or to standard VGA mode. Standard VGA supports a resolution
    of 640 x 480 and a maximum of 16 colors. Since this is quite limited compared
    to most graphics devices currently in use, most displays won''t look too good.
    If the "sizer-gt command returns "VGA," Tru64 UNIX is operating in standard VGA
    mode. In this case, the problem is usually one of the following:'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 12.4 CDE Problems


    +   - The graphics driver for the adapter isn''t configured in the kernel (check
    the Open3D version).


    +   - The graphics device has a hardware problem or incorrect jumper setting.


    +   - The EISA or ISA configuration is corrupt.


    # 12.4 CDE Problems


    The Common Desktop Environment (CDE) is the default display manager for Tru64
    UNIX systems. It''s also possible to use the older X Display Manager (xdm) instead
    of CDE. The choice of display manager is controlled by environment variable XLLOGIN
    in /etc/rc.config. If XLLOGIN is set to “xdm”, xdm is selected; if it''s set to
    “cde” or blank, CDE is used. In this section, we''ll discuss some common problems
    that prevent users from logging into and working with CDE.


    Login problems are probably the most common type of CDE problem. The login problems
    discussed in Chapter 4 can arise when logging into CDE or any other source; in
    addition, there are CDE-specific issues that can affect logins. When troubleshooting
    a CDE login problem, the first step should be attempting to log in from another
    source, such as a telnet connection or serial terminal. Use the techniques in
    Chapter 4 to troubleshoot the problem. On the other hand, if logs fail only through
    CDE, it''s pretty clear that the problem is CDE-related.


    When a CDE login problem exists, it''s important to try logging in from multiple
    accounts in order to determine whether the problem affects all users (with the
    possible exception of root) or just one. If root is the only user who can log
    in, the problem is frequently a file permission issue; in this case, the allverify
    utility described earlier in this book will help to locate the problem. If no
    users (including root) are able to log in, the cause is a misconfigured network
    setup. Typical problems include the local host name not being consistent between
    /etc/rc.config and /etc/hosts, incorrect information in /etc/svc.conf, and others.
    This type of problem is usually, though not always, indicated by the error message
    “DT messaging system could not be started” during log in. In this situation, Chapter
    7 for information for troubleshooting the network configuration.


    If all users, including root, are unable to log, it might be a little tricky to
    get access to the system to troubleshoot the problem. This is particularly true
    if the problem is a network configuration problem, because'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 12.4 CDE Problems


    network issues could also prevent access via telnet. In such cases, there is a
    “failsafe” login option at the system console. From the CDE login screen, pull
    down the Sessions menu and select “Failsafe Session.” This will provide a generic
    terminal with no additional CDE features or options. Once logged in, you can start
    troubleshooting the problem. A good first step is to check the following log files:


    ```

    /var/dt/Xerrors

    $HOME/.dt/errorlog

    $HOME/.dt/startlog

    ```


    A useful technique in this situation is setting the environment variable DTNONETWORK
    to “true.” This can be done by following the two lines to /.dtprofile, which is
    the root user’s CDE login script:


    ```

    DTNONETWORK=true

    export DTNONETWORK

    ```


    The preceding technique is also useful when only one user is unable to log in.
    Add the lines shown above to the user’s $HOME/.dtprofile file and try another
    CDE login. If the login succeeds, it usually indicates some type of corruption
    in the user’s local CDE configuration. In this case, try removing the following
    files:


    +   - $HOME/.dt (a directory)

    - $HOME/.TTauthority

    - $HOME/.Xauthority'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'CDE automatically creates these files if necessary, so removing them is not
    harmful. If this cures the problem, corruption in the user''s CDE configuration
    was the cause; recreating the files resolved the problem.


    In addition to logins failing, logins that take a time to complete (e.g., several
    minutes) or hang indefinitely are possible problems. These tend to have the same
    causes as logins failing completely; therefore, the troubleshooting techniques
    described above apply to problems as well. A related problem with a different
    cause is "one-shot" CDE login. In this situation, the first CDE login from the
    system console works fine; however, after the user logs out, the login box doesn''t
    reappear, which makes it rather difficult to log in again. This problem occurs
    if the X session manager doesn''t terminate properly when the user logs out. To
    resolve this problem, you can force the session manager to terminate when the
    session ends by adding the -terminate switch to the X server command line at the
    bottom of the /var/dat/dt/Xservers file. The modified line should look like this:


    ```

    :0 Local local@console /usr/bin/X11/X :0 terminate

    ```


    A less serious issue occurs when a user logs in with CDE, but the shell script
    $HOME/.profile for the Bourne and Korn shells, $HOME/.login for the C shell is
    not executed. This is actually the default behavior for CDE logins. At session
    startup, CDE executes the commands in $HOME/.dtprofile. (These commands can use
    Bourne or Korn shell syntax.) The last line in dtprofile is the following:


    ```

    # DTSOURCEPROFILE=true

    ```


    The DTSOURCEPROFILE environment variable executes the appropriate shell startup
    script (.profile or .login) after executing the other commands in .dtprofile.
    However, above line is commented out by default, which means the variable doesn''t
    get set and the shell script is not executed. To change this uncomment the line
    by removing the initial "#" character. On subsequent logins, the variable will
    be set and the desired startup script will execute.


    The problems described in the preceding text when using CDE. This is by no means
    a comprehensive list of possible CDE problems; CDE has a rich set of features
    and options, and problems might arise with any of them. However, a detailed treatment
    of'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'CDE’s capabilities is beyond the scope of this book. For further information,
    we recommend the three CDE manuals in the Tru64 UNIX documentation set:


    +   - Common Desktop Environment: User’s Guide

    - Common Desktop Environment: Advanced User’s and System Administrator’s Guide

    - Common Desktop Environment: Product Glossary


    # Before you call support


    Before calling technical support with a display problem, perform the following
    troubleshooting steps:


    +   - Check for basic connectivity; does the display work in console mode?

    - Check the jumper settings (if any) on the graphics card.

    - Ensure that the system firmware is up-to-date.

    - Rerun the ECU to restore the EISA configuration.

    - If you have an older AlphaStation with an ISA bus, redo the configuration.

    - If your graphics adapter requires Open3D, verify that you have the correct version
    installed.

    - Log in via another method (e.g., telnet) and verify that the X server is running
    (see section 12.2).

    - Check the system message file and the Xerrors log file for error messages.

    - Verify that the system recognizes the graphics adapter correctly ("sizer -gt").'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Electronic Resources


    Even with the best information we can provide in this book, you may still end
    up with a tricky Tru64 UNIX problem to solve. In this appendix, we list some additional
    electronic resources (outside of HP technical support) to help you solve the problem
    as quickly as possible. Some of these resources will prove to be very valuable,
    but others may be less so. We provide a comprehensive list as much possible because
    experience shows that it is impossible to tell in advance where the solution to
    a problem will come


    # A. I Mailing Lists


    There are a couple of mailing lists that are of direct interest to a Tru64 UNIX
    system administrator. These mailing lists contain a great deal of useful information
    and can be an invaluable resource. Be aware, though, that mailing lists can easily
    overwhelm you with their volume. An active mailing list may generate hundreds
    of e-mails per day. One useful strategy when subscribing to mailing lists is to
    use an e-mail client with filtering capabilities to transfer incoming mailing
    traffic into another folder for later perusal. In addition, many mailing lists
    provide the ability to receive digests in which you are periodically sent a summary
    of activity. Such digests may be sent daily, weekly, or monthly, depending on
    the list volume. Some mailing lists are also archived, allowing easy keyword searching
    through months or years of list activity.


    > Note: Always regard information from a mailing list with caution, especially
    if the list is unmoderated. While there will always be experienced individuals
    who happily share their experience and knowledge, there are also less experienced
    folks who, through error or malice, provide incorrect information to the list.
    Never blindly believe a single person''s contribution. Always substantiate any
    piece of information if you are unsure of its'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'source or validity. Remember as well that even experts can make an error.

    Mailing lists are frequently valuable sources of useful and pertinent information,
    but you should treat them carefully.


    # A.1.1 Tru64-UNIX-Managers List


    The Tru64-UNIX-Managers list is a quick-turnaround troubleshooting aid for people
    who administer and manage Alpha systems running Tru64 UNIX. Its primary purpose
    is to provide a Tru64 UNIX system administrator with a quick source of information
    for system management problems that are of a time-critical nature. This list allows
    any subscriber to pose a question to the entire list or contribute a possible
    answer to individual''s question.


    To subscribe to the list, send an e-mail to majordomo@ornl.gov containing the
    command "subscribe tru64-unix-managers." The Tru64-UNIX-Managers list is archived
    at


    ```

    http://www.ornl.gov/its/archives/mailing-lists

    ```


    Additionally, the following URL provides the ability to keyword the entire archive
    of the Tru64-UNIX-Managers list (and its predecessor, the Alpha-OSF-Managers list):


    ```

    http://www-archive.ornl.gov:8000

    ```


    There are two more archive search engines:


    ```

    http://www.geocrawler.com/lists/3/Miscellaneous/530/0

    http://www.xray.mpe.mpg.de/mailing-lists/tru64-unix-managers

    ```


    # A.1.2 Tru64 UNIX Patch list


    The Tru64 UNIX Patch list is a nondiscussion list provided by HP that announces
    the latest patches for the Tru64 UNIX operating system and layer software products.
    These notices cover both public and entitled patches. Whereas the entitled patches
    are available only to contract customers, the public patches are readily available
    via anonymous FTP from


    ```

    http://ftp.support.compaq.com/public/unix

    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# A.3 Web Resources


    You can also visit


    ```

    http://www.support.compaq.com/patches

    ```


    To subscribe to the mailing list and receive individual patch notices, click on
    the "joining mailing list" link found on the above page.


    # A.2 USENET Newsgroups


    There are several USENET newsgroups that may be of interest to a Tru64 UNIX system
    administrator. These newsgroups tend to have an even higher "noise ratio" than
    mailing lists, and the recommendation is to be cautious with information presented
    in a newsgroup.


    +   - comp.unix.tru64—the primary Tru64 UNIX discussion group

    - comp.unix.osf.misc—miscellaneous Tru64 UNIX discussions

    - comp.unix.admin—general UNIX system administration topics

    - comp.admin.policy—general UNIX system administration policy issues

    - comp.unix.security—UNIX security

    - comp.security.misc—miscellaneous system and network security

    - comp.unix.questions—a forum for general UNIX users

    - comp.unix.wizards—advanced UNIX topics


    # A.3 Web Resources


    The Wide Web (WWW) has grown tremendously since its inception and is now an invaluable
    resource for Tru64 UNIX administrators. Some Web pages are extremely broad in
    content, while others are narrowly focused or address single topics. The pages
    listed below make a good starting point for a Tru64 UNIX system administrator.
    Many of these pages provide links to other, associated pages. Over time, you will
    build a personal set of favorite pages.


    Note that on-line resources change, and these addresses may not apply in the future.
    Readers can always use a Web search engine to identify the new location if an
    address is not found.'
  merge: -1
  img_proc: true
