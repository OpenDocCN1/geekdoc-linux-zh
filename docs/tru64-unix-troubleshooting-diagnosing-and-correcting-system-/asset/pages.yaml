    If you then attempt to modify partition “a,” the conflict message appears because
    the “disklabel” command itself already has partition “a” open. This problem is
    easily worked around by specifying the “c” partition instead. By convention, the
    “c” partition also starts at block 0 and includes the entire disk, so it also
