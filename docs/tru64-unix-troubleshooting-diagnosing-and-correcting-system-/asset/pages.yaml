    connectivity on the network. This assumes that the hardware is correctly configured
    and in proper working order. If the hardware has not been validated, then a minimal
    network configuration may not operate. We recommend taking a look at the discussion
    in section 7.1 on network hardware troubleshooting if you''re not sure that your
    hardware is operating correctly.


    The appropriate method in most UNIX systems—and Tru64 UNIX in particular—for examining
    network interface parameters, such as the IP address, netmask, and broadcast address,
    is the ifconfig(8) command. This command can display the current interface configuration
    for a single interface (in this example, tu0):


