    # 4.1.3.4 File and Directory Permissions


    Some elements of a user''s account or shell environment can lead to performing
    operations on files or directories. The most common of these is incorrect permissions
    on newly created files. When new files are created by the shell or commands such
    as cp, the file''s permission bits are based on the user''s current file creation
    umask. This mask is usually defined by executing the umask(1) command in the user''s
    shell login. The mask is an octal number indicating which bits will not be set
    for newly created files. For example, the command "umask 022" causes the group-write
    and other-write bits to be cleared. The remaining bits will be set on whether
    a regular file or a directory has permission bits except those specified in the
    umask [i.e., the resulting permissions will be 777 (octal) minus the umask]. Thus,
    with a umask of 022, a new directory will have permissions of 755, or "rwrx-xr-x".
    However, regular files will not have any execute permission bits; their permissions
    will be 644, or "rw-r-r--". The difference between regular files and directories
    is not common to other variants of UNIX, it often turns up when using Tru6 UNIX
    users.


    The creation of regular files without execute permission is usually an issue when
    creating shell scripts. Script files need permission to run, but when first created,
    they don''t have it. As a result, it''s very common for a user to create a new
    script, attempt to run it, it will fail with a "permission denied", and wonder
    what the problem is. When is it necessary to use the chmod(1) command to add execute
    permission to the file. However, setting the execute bits may fail because because
    of the accidental setting of a kernel parameter. noadd_exec_access in the vfs
    subsystem provides an additional level of security for highly secure systems such
    as frameworks. When noadd_exec_access is set to 1, non-root users cannot add execute
    permission to their files; this is to prevent the introduction of Trojan horse
    programs. Although this feature is disabled by default, it''s easy to set it accidentally
    while running the security configuration utility, seconfig. On seconfig''s System
    Configuration Options menu, the option "Execute bit set only by root" is the middle
    of'
