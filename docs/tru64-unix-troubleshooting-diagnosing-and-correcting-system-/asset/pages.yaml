- pgno: 273
  md: '# 10.1 Installation Problems


    In both cases, the installer identifies the conflict and informs the operator
    of the action required to resolve it. This feature helps to ensure the integrity
    of the operating system version that is being installed.


    A serious file-type conflict causes the update installation to exit without updating
    the system. If the update were to continue, it could result in a corrupt operating
    system. As such, serious conflicts must be resolved manually before restarting
    the update installation. Serious file-type conflicts include the following:


    +   - A directory changed to a regular file or symbolic link

    - A symbolic link changed to a directory


    All other file-type changes are considered minor conflicts. The installer automatically
    resolves conflicts by copying the file with the modified type to a file with the
    extension "PreUPD" (e.g., /etc/hosts.PreUPD). When the new version of the operating
    system is loaded, the original file (e.g., /etc/hosts) is replaced by the new
    version—with the correct file type—that is shipped with the new operating system
    version. In this situation, the installer will not be able to merge the original
    and new files properties. As a result, any customizations in the original file
    must be manually merged from the "PreUPD" version into the new version after the
    update installation is finished.


    # Before you call support


    Before calling technical support on an installation issue, check the following:


    +   - Verify that the system firmware is up-to-date.

    - Run the EISA Configuration Utility (ECU).

    - Make sure the operating system version is compatible with your hardware. Older
    systems may not be compatible with newer operating versions (and vice versa).

    - If the installation media has a problem, try another copy if one is available.

    - And please back up your system before starting any kind of installation!'
