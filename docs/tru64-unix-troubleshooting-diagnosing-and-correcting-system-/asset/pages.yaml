    # 5.2.2.1 Kernel Memory Faults


    When Tru64 UNIX tries to access a memory location that is not mapped into physical
    memory, a page fault occurs to load the desired page into memory. This is perfectly
    normal for user mode code and is the mechanism of all virtual memory systems.
    However, all code and data structures in the Tru64 UNIX kernel are “wired” into
    memory (i.e., their pages stay in physical memory at all times). If a page fault
    occurs in kernel mode, it means that the kernel has tried to access a location
    that''s not remotely mapped—by definition, an invalid location for kernel access.
    This could occur when the kernel tries to read or write data, or when it goes
    to fetch the next instruction to execute. These three cases are distinguished
