  img_proc: true
- pgno: 206
  md: '# 192 7.2 Networking Software Issues


    coverage of all available services is beyond the scope of this book. Our approach
    in this section is to discuss the primary mechanisms for implementing networking
    services in Tru64 UNIX, as well as the best troubleshooting tools available to
    examine them.


    A failure of the TCP/IP higher-level protocols in Tru64 UNIX can fall into one
    of the four following major categories:


    +   1. Internet services daemon (inetd) issues

    2. Standalone daemon issues

    3. Hostname resolution issues

    4. Remote Procedure Call (RPC) issues


    # 7.2.2.1 Internet Services Daemon (inetd) Issues


    Internet services daemon, /usr/bin/inetd, controls many of the commonly used server
    protocols on a Tru64 UNIX system. These functions include telnet, FTP, remote
    shell, and the other "ir" controls (rcp, login, etc.). inetd controls these services
    by listening on the appropriate port for each service. When a connection is initiated,
    inetd forks a specialized child process to handle the request. The child process
    becomes the daemon that performs the actual work to service the connection according
    to the protocol''s specifications. These daemons behave differently from those
    in the standalone category, so you can''t just make a standalone daemon operate
    with inetd with no modifications. Some daemons, such as the Apache httpd daemon,
    operate as either a standalone daemon or in conjunction with inetd. Even such
    a flexible daemon as Apache may be told of the two mechanisms is being used, or
    problems may occur.


    > Configuration Tip

    Some might ask why we need both standalone and inetd-controlled daemons? The answer
    is that although you give up some performance and control over the daemon when
    you allow it to be controlled by inetd, you have the advantage of not having to
    waste system resources by keeping a bunch of standalone daemons around that may
    not be very often. Therefore, in situations where a choice is possible, you should
    configure a daemon as a standalone if it will be frequently used and performance
    is important. Otherwise, let the daemon be controlled by inetd in order to control
    and conserve system resources.'
  merge: -1
  img_proc: true
