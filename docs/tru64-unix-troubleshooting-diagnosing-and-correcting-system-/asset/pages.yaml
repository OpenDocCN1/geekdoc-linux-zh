    improves. In general terms, a default gateway tells the system where to send packets
    that are bound for a network that is not directly reachable from the local host.
    Without this information, the network interface will not know where to send those
    nonlocal packets, and they will simply vanish into the bit bucket. This would
    be a serious problem for remote users of the system, but it might not even be
    noticed by users of any host connected to the local network.


    One issue that can cause serious—and often maddening intermittent—problems with
    network connectivity is a duplicate IP address on the same local network. Depending
    on the network configuration, this situation can lead to very strange problems
