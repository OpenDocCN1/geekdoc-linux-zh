  md: '# 4.2 Security Problems


    access. For example, typing in the wrong password a few times can cause a user
    account to be disabled for some period of time or until an administrator explicitly
    re-enables it.


    An explanation of all the possible login and password controls is beyond the scope
    of this book; for details, see the Tru64 UNIX Security Manual or the man pages
    for authcap(4), prassword(4), trys(4), devassign(4), and default(4). What we will
    do is discuss the ways in which these controls can prevent user logins. The following
    paragraphs describe each of the possible login failures, their causes, and how
    to correct them.


    +   - "Account is disabled—see Account Administrator."


    This is the most common login failure in enhanced security. It is also the only
    failure that has multiple possible causes (five, to be exact) without specifically
    identifying the problem. The possible causes of this failure are as follows:


    +   a. The system administrator has explicitly locked the account; this is indicated
    by the presence of the “u_lock” field in the user’s protected password entry.
    To correct this, the administrator must unlock the account with one of the account
    maintenance tools. A low-level method to do this (e.g., for use in a script) is
    to editauth the protected password entry and either remove “u_lock” or add the
    negation operator “@” to it (i.e., “u_lock” means the account is locked, but “u_lock@”
    means the account is not.)


    +   b. The user is on vacation, as defined by the “u_vacation” field in the protected
    password entry. If this is set in error, the fix is to remove the u_vacation field
    with editauth or change the vacation definition using one of the account maintenance
    utilities.


    +   c. The user’s password has exceeded the allowable password lifetime. In other
    words, the time of the last successful password change (u_succhg) was more than
    “u_life” seconds in the past. To correct this, either set u_life to 0 to disable
    the check or set u_succhg to a time close to the present.


