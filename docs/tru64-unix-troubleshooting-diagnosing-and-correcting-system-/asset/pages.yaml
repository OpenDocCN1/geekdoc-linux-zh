- pgno: 54
  md: '# Before you call support


    If the system is not logging the expected messages to the syslog facility:


    +   1. Is the syslog daemon running?


    +   2. Do the /dev/log and /dev/klog device special files exist? Do they have
    the correct major and minor numbers?


    +   3. Is there a problem with the configuration file /etc/syslog.conf? Does the
    file exist? Is the file correctly formatted?


    +   4. When using the logger(1) command, can you successfully send a test message?


    +   5. Is syslog properly configured to log messages of the facility for which
    you are looking?


    # 3.1.2 The Event Manager


    The event manager (evm) is a Tru64 UNIX facility intended to simplify and unify
    event reporting from a variety of channels into a single source. It works in cooperation
    with older mechanisms, such as syslog and binlogd. In this section, we will provide
    a brief overview of evm and how to use it.


    The components that make up the evm facility are as follows:


    +   1. Events—indications that something interesting happened


