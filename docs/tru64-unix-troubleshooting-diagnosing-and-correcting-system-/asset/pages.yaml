- pgno: 28
  md: 'enough incident can require you to restore your disks from backup—or even reconstruct
    your system from scratch. Catastrophes do happen; what would you do if a tornado
    hit your computer center? (This actually happened at one of the authors'' previous
    jobs.) Disaster recovery is a topic beyond the scope of this book, but you should
    at least think about the questions listed below.


    # Are you prepared for the worst?


    +   - Do you have current backups of all of your important file systems?

    - Do you have copies of recent backups stored off-site?

    - Do you ever test your backups by restoring a few randomly selected files?

    - Do you have copies of the operating system and layered product on hand in case
    you need to reinstall?

    - Do you have a disaster recovery plan? Is it current? Is it in a safe place?

    - Do you have your system configuration documented in case you have to rebuild
    from scratch? Is it up to date with your latest additions or changes? Is there
    a copy stored off-site?


    # 2.1.6 Summary of the Troubleshooting Process


    Troubleshooting is a process consisting of five major components:


    +   1. Detection—becoming aware that a problem exists

    2. Identification—characterizing the problem sufficiently to begin correcting
    it

    3. Analysis—determining the underlying causes of the problem

    4. Correction—restoring or replacing the affected function

    5. Prevention—avoiding future problems


    The arrows in Figure 2.1 connect the components of the troubleshooting process
    in a cycle: detection leads to identification, identification to analysis, and
    so on. Depending on the problem being solved, the troubleshooting process may
    or may not form such an orderly cycle. Some components may be unnecessary, some
    may happen simultaneously, or it may be necessary to go back and forth between
    some steps. The star in the'
