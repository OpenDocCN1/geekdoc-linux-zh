    nOne of a system administrator’s primary concerns is preventing unauthorized access
    to the system. This is a broad topic that extends well beyond the scope of this
    book; for further information, see the references listed in Appendix A. As such,
    we won''t discuss how to prevent or respond to break-attempts. What we will discuss
