    # 10.1.5 Defective Installation Media


    In cases, a defect in the installation CD-ROM can cause an I/O error while loading
    the software subsets for the new version. If the error is a “hard” error that
    the I/O driver cannot recover from, installation cannot proceed. This kind of
    error is indicated by console messages such as “unable to open device,” “unrecoverable
    hardware error,”irrecoverable media error,” or similar messages. In this situation,
    it is necessary to start over with a new copy of the installation media. (Alternatively,
    you could try cleaning the problematic CD-ROM.) If this problem occurred in the
    middle of an update installation, it would be necessary to restore the system
    from its predate backup. This is because not all of the new version software subsets
    have been loaded, which means the system will contain a mix of the original and
    new operating system versions. Such a mix probably wont run at all; even if it
    runs, correct operation is extremely unlikely.


    # 10.1.6 Interrupted Installation


    As the previous section indicated, the loading of new software subsets should
    not be interrupted for any reason. Unfortunately, sometimes this occurs to power
    failure or operator mishap. As noted above, there is no way to recover from this
    situation gracefully; it’s necessary to start over from the beginning. In the
    case of an update installation, the operating system is left in an inconsistent
    state (i.e., a mix of the old and new versions). In that case, it’s necessary
    to restore the system to the predate backup and begin again.'
  merge: -1
  img_proc: true
