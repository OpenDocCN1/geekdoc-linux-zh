    ```

    # voldctl mode

    mode: not-running

    ```


    Obviously, this indicates that the daemon is not running, which you can

    confirm by using the "ps" command. However, it doesn''t give you an idea of

    what the problem is or why the daemon may not be running.


    If the daemon is not running, there are several possibilities:


    +   - The daemon was killed.

    - The daemon has exited prematurely.

    - The daemon never started.


    Naturally, if the daemon was killed, it would have been by a user on the

    system with root privileges; this type of problem should be dealt with

    administratively. There should be right control over who has root privileges

    the system for the very reason that someone could do something without\your knowledge
    and end up causing tremendous damage.


    If the daemon exits prematurely, a serious problem occurred; the daemon

    is designed to be running at all times and never to go away. In this situation,

    uation, you should report the problem to HP technical support. You will

    need some information from you to aid in debugging the problem, including

    a a core file, if it exists, and a trace output from the daemon. If the daemon

    created a core file, you should be able to find it in the root directory.


    One mechanism for troubleshooting the volume configuration daemon

    is by restarting in debug mode, using a command similar to the

    following:


    ```

    vold -k -x 9 -x tracefile=somefile.out

    ```


    This command turns on maximum debugging (level 9) and writes the

    trace output to a file called somefile.out. This can be helpful in debugging a

    situation where the daemon is behaving erratically or is exiting prematurely.

    You may find that the LSM database has become corrupt or there is a

