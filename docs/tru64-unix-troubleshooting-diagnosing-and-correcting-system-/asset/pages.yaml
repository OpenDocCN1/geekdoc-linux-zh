- pgno: 11
  md: '# Preface


    The idea for this book arose shortly after the completion of the Tru64 UNIX System
    Administrator''s Guide (Digital Press, 2001), of which we were two of the authors.
    We were quite happy with that book—and we certainly think you should buy a copy
    if you don''t already have one—but we also realized that there was a lot more
    that could be said on the subject of troubleshooting Tru64 UNIX problems. Although
    the earlier book does contain some troubleshooting information, its focus is on
    the performance of everyday system administration tasks. After taking a closer
    look at other UNIX books, we discovered that they all had a similar orientation;
    there simply weren''t any that focused primarily on troubleshooting. As we discussed
    the idea, our common experience as UNIX system administrators and Tru64 UNIX support
    engineers convinced us that a troubleshooting book would be extremely useful.
    Our editors edited, and the end result is this book.


    Although this book is about troubleshooting Tru64 UNIX problems, we''ve tried
    to make the material as useful as possible for administrators of other operating
    systems as well. The common elements among the various flavors of UNIX make much
    of the information in this book useful for other UNIX variants. Some parts, of
    course, are specific to Tru64 UNIX. In addition, the general troubleshooting principles
    and techniques in Chapter 2 can be applied to any operating system—and even to
    non-computer-related problems.


    The material in this book is based primarily on Tru64 UNIX version 5.1A, which
    at the time of this writing is the version of Hewlett-Packard''s (HP) Tru64 UNIX
    product that is currently shipping. Version 5.1B was a few weeks from shipping
    at press time, and we have done our best to make the content applicable to that
    version as well.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'During the preparation of this manuscript, HP acquired Compaq Computer Corporation.
    As a result, Tru64 UNIX, along with the Alpha processor on which it runs, changed
    owners for the second time. Compaq acquired the operating system in its merger
    with Digital Equipment Corporation in 1998. We''ve endeavored to reflect the new
    ownership throughout this book, but in case we''ve missed any, please substitute
    HP for any stray instances of Compaq.


    Although both authors worked together on the entire book, our individual interests
    led to a natural division of the primary writing duties. We''ve tried to use a
    consistent style and "voice," but minor stylistic differences may still be noticeable.
    For the record, Steve was the primary author of chapters 1, 3, and 7-9, while
    Martin wrote most of chapters 2, 4-6, and 10-12.'
  merge: -1
  img_proc: true
