    Most of the security-related problems seen in Tru64 UNIX involve the enhanced
    security level. This is not because enhanced security is particularly buggy (actually,
    it works very well) but because it contains a large number of features and options
    whose effects are sometimes unclear to users or administrators. In the following
    sections, we''ll cover the following problem areas relating to Enhanced security:


    +   - Authentication database problems

    - Security configuration problems

    - Login failures


    # 4.2.1 Authentication Database Problems


    Tru64 UNIX enhanced security stores all security information in a set of five
    databases collectively known as the authentication database. The five component
    databases and the types of information they contain are shown in Table 4.4.


    Each component database contains a set of entries—for example, the protected password
    database contains one entry for each user account on the system. Each entry consists
    of an name, followed by a set of one or more fields, followed by the field “chent,”
    which indicates the end of the entry. The fields are separated—and the chekent
    field is terminated—by a colon. Fields can be strings, integers, or Boolean values.
    A string field has the form “field_name=value.” Integer fields have the form “field_name#value.”
    Boolean fields have the form “field_name” if they have a true value, and'
