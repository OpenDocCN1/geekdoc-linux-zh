    # 5.2 System Crashes


    Most system crashes are caused by kernel panics. A panic occurs when the UNIX
    kernel detects a severe software or hardware error and deliberately brings the
    system down rather continuing to operate in an unsafe manner. It is also possible
    for a system to crash without panicking. This kind of crash is invariably due
    to hardware or environmental issues, such as power or temperature problems. A
    system may crash due to a kernel panic that doesn''t leave any traces of the panic;
    an example of this type of problem was discussed in section 2.2.4.


    In general terms, crashes can be divided into three major classes:'
