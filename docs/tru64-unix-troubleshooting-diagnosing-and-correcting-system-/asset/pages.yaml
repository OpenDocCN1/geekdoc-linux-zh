    # 7.2.2 Problems with Services


    Not all network problems are general failures affecting all network services or
    from a particular host. In many cases, the problem manifests as a failure (or
    perhaps strange behavior) of one or more services, but not all of them. In this
    context, service means a high-level network protocol, such as the Network File
    System (NFS), tnel, or send. In the realm of TCP/IP server-based protocols, a
    specialized process known as a daemon implements a network service by accepting
    requests from other hosts and forking a child process to service the request.
    Newer and more efficient methods have been developed to implement these protocols
    that improve the classic design; however, the principle remains the same. Therefore,
    in order to troubleshoot a services-based networking problem, you must become
    familiar with the way each service is implemented on your Tru64 UNIX system and
    the tools available to troubleshoot them. An exhaustive'
