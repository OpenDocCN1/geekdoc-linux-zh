  md: '# 2.1 The TroubleshootingProcess


    problems are lurking. In the university system example, the problem has been identified
    as a failed disk. This disk must be replaced and its files restored, regardless
    of whether any other problem exists. But it is worth doing some additional analysis
    to see there might be problems extending beyond a single disk. One possibility
    is to check the error log for disk errors. If there are numerous errors on the
    failed disk but few or no on other disks, the problem can reasonably be assumed
    to be limited to the failed disk. However, if there are a number of errors on
    other disks, then it is time to look for a pattern. Are the disks all on the same
    bus or controller, or in the same storage cabinet? Any of these may indicate an
    underlying problem that, if not found, could lead to other disk problems in the
    near future. By rooting out and correcting the underlying problem now, those other
    problems can be prevented from ever happening.


    In some cases, additional analysis is needed to refine the identification of a
    problem and determine the corrective action. For example, Tru64 UNIX panic if
    the root filesystem cannot be mounted at startup. When this occurs, the console
    prints the panic message "fs-mount: not mount root." This message is quite clear
    as what the problem is: the root file system won''t mount. This appears to be
    a specific, well-defined problem. However, there are no less than nine possible
    causes—each with a different solution—for this error:


    +   1. The root file system is corrupted.

    2. The /etc/fstab entry for the root file system is incorrect.

    3. The root file system is AdvFS, but built into the kernel.

    4. The root file system appears to be an LSM volume, but LSM isn''t built into
    the kernel.

    5. The /etc/fdms link to the root file domain is pointing to the wrong device.

    6. The root file system is an AdvFS domain with more than one volume.

    7. The hardware configuration has changed, causing the numbers to change.

    8. The console firmware is outdated and incompatible with the current operating
    system version.

    9. The root device has a nonzero logical unit number (a limitation in Tru64 UNIX
    versions earlier than V5.0.)'
