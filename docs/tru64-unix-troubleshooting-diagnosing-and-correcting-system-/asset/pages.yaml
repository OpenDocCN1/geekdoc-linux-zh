    # 5.2.3 Panics Without Crash Dumps


    In theory, every panic, unless it occurs very early in the boot sequence, should
    create a crash dump. When a dump is not created, troubleshooting must focus on
    examining the system log files as described previously. If a system repeatedly
    crashes without producing a dump, and the cause of the panic can''t be determined
    from log files, an effort should be made to find out why no crash dumps are being
    produced. There are six possible reasons for this:


    +   * There is not enough swap space to hold the contents of memory. If this happens,
    make sure you are selecting partial dumps or add additional swap space.'
