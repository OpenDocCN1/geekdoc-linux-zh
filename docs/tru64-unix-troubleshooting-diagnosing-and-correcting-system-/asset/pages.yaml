    This chapter provides an overview of the troubleshooting tools and facilities
    available to the Tru64 UNIX system administrator. It is vitally important to become
    familiar with these tools before problems occur, so you dont not waste time when
    trying to work a real problem by still trying to understand how the tools work.
    With these tools and your available knowledge, in conjunction with the troubleshooting
    principles and techniques presented in the previous chapter, virtually any system
    problem can be solved.'
