    # 4.1.2.2 Ineffective Password Changes


    Occasionally, users will attempt to change passwords and appear to succeed. However,
    the new password doesn''t work. Experimentation shows that the user''s password
    is still in effect. This is always caused by a failure to update the hashed password
    database. This database consists of two files—/etc/passwd.pag and /etc/passwd.dir—that
    organize the information in /etc/passwd into a more efficient format for searching
    by system routines. Without the hashed password database, the system must perform
    a sequential search of the password file. This can lead to significant performance
    degradation on systems with a large number of users.


    Utilites such as dcacount, passwd, and userm normally recreate the database to
    reflect the updated password file. (However, editing /etc/passwd with vi does
    not.) But if the modification time on /etc/passwd.pag is in the future, the hashed
    database appears to be current and is not updated. System routines will continue
    to use the old information in the database, making it appear that the change did
    not take. Also, if the hashed database is corrupted, it may not be updated properly,
    leading to similar symptoms.


    If a password change appears to be ineffective, try removing the hashed database
    files (/etc/passwd.pag and /etc/passwd.dir) temporarily. Try the new password
    again; if it works, this verifies that the hashed database was the cause of the
    problem. You can then recreate the hashed database with the following commands:


    ```

    # cd /etc

    # mkpasswd passwd

    ```


    After recreating the database, verify that the new password continues to work.


