    This file contains a single line with the PID of the binlog process. This file
    can be used to obtain binlog’s PID when it is necessary to stop or restart binlog.


    For example, you could use either of these commands to terminate binlogd:


    ```

    # kill `cat /var/run/binlog.pid`

    # /sbin/init.d/binlog stop

    ```


    Running the binary script with a “stop” will kill binlogd using the “kill” command
    given above.


