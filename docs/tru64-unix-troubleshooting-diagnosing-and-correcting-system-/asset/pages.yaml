- pgno: 37
  md: '# 2.3 Troubleshooting Principles


    mentioned, but we''ll repeat them here in order to have them all in place.


    # 2.3.1 Document Everything


    One of the most frustrating experiences in troubleshooting is to successfully
    analyze and correct a complex problem, begin a follow-up analysis ... and suddenly
    realize that you don''t remember exactly which commands you used to find and resolve
    the problem. Was it "hwmgr delete" or "hwmgr remove" (Both are valid commands
    with slightly different effects). This is just one of the reasons to document
    all of your actions and their results. In some cases, what seems to be a simple
    problem has an unexpected turn; when this happens, it''s helpful to keep notes
    as you go in order to know which avenues you''ve already investigated.


    Documenting your actions applies not just to troubleshooting activities, but to
    any changes made during normal system administration. If something goes wrong
    as a result of a configuration change—for example, a system fails after you change
    some kernel parameters—it''s extremely helpful to be able to see exactly what
    commands were executed. If notes on paper is inconvenient, the script(1) command
    is very useful in these situations. This command records subsequent terminal input/output
    in a file. The resulting transcript files are not only useful for troubleshooting;
    they can also become part of a system''s configuration records, and are an invaluable
    resource if you ever need to reconstruct or duplicate the configuration.


    # 2.3.2 Preserve the Evidence


    Documenting your actions preserves one kind of information: actions and their
    results. It''s also important to preserve as much information as possible about
    the system''s current state. When a system hangs and becomes unresponsive, it''s
    usually necessary to reboot the system. Unfortunately, rebooting clears the contents
    of memory, which destroys valuable information about the state of the system at
    the time that it hung. An alternative to rebooting is to halt the system, forces
    a crash dump, and then reboot the system. The crash dump preserves the contents
    of memory for later analysis.


    Preserving evidence is not always necessary; some problems are straightforward
    and quickly resolved. In other cases, lack of time or other resources may render
    it impractical to preserve some. For example, it might be necessary to recreate
    a corrupt file system and restore its contents from'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'backup. Recreating the file system on the same disk partition will destroy
    the old, corrupted metadata. However, if a spare device is available on recreate
    the file system, the corrupt file system can be left intact for later analysis.
    Obviously, this depends on the availability of sufficient resources; if the file
    system occupies a 400GB RAIDset, it’s not too likely that enough extra storage
    is sitting around unused.


    # ## 2.3.3 Reduce Variables


    When troubleshooting a problem, you may encounter multiple possibilities in trying
    to isolate or correct the problem. When this happens, try to change only one element
    at a time, then see what effect that has on the problem. This will help narrow
    the problem to a single possible case. Similarly, when making changes to a system,
    it''s best to do them one at a time. If a problem arise, all that''s needed is
    to be out of the last change, rather than to determine which of several changes
    caused the problem.


    Unfortunately, changing only one variable at a time is not always practical. For
    example, if a system fails to boot after six kernel parameters have been changed,
    reverting to the previous configuration will not doubt correct the problem. However
    this will determine which of the six parameters was the real problem. Reverting
    one parameter at a time would isolate the real problem, but it might take several
    reboots to get. Whether the additional information is worth the extra time and
    inconvenience is a tradeoff. In such cases, you''ll have to make a choice based
    on circumstances such as the number of affected users, the criticality of the
    system, and the importance of knowing the exact cause of the problem.


    # ## 2.3.4 Minimize Your Risk


    Whenever you change a key system file—whether as part of troubleshooting or normal
    system maintenance—be sure to save a backup copy of the original file. This will
    allow you to revert to the original version in case of a problem. It can also
    be handy to distinguish your changes easily by comparing the old and new files
    with the diff(1) command.


    This principle applies not only to files but to other components, such as entire
    systems. For example, when performing an action that could affect a file system
    (e.g., upgrading to a new version of Tru64 UNIX) always make backups of any file
    systems that could possibly be damaged. The insurance value of backups is well
    worth the time it takes to create them. If'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 2.3 Troubleshooting Principles


    One further extension of this principle is to delay irreversible actions as long
    as possible. For example, if a system is not accepting new logins while existing
    actions are still working, don''t log out of the system. Similarly, if a file
    system is damaged, it may be necessary to recreate and restore it, but this should
    be a last resort after exhausting all other possibilities to repair the file system.
    Sometimes a last resort is necessary, but make sure it is the last resort.


    # 2.3.5 Maximize Your Return


    When troubleshooting a problem, choose your actions so as to get the most return
    for the least cost. In this case, cost includes both effort on your part and disruption
    of the system. In other words, try for a quick and easy fix whenever possible.
    If there is a choice among multiple solutions, try the quickest or least disruptive
    action first. If it works, the problem is quickly resolved; if it doesn, not much
    is lost in the way of time or disruption.


    For example, if you have an AdvFS file system with some corruption, recreating
    the file system and restoring it from backup will undoubtedly resolve the problem.
    However, this is time-consuming and highly disruptive to users. Before resorting
    to this solution, it''s worth trying to verify the verify(8) command to fix the
    corruption; if that doesn''t work, the more the type and extent of the corruption,
    these commands may or may not repair the problem. Nevertheless, they should be
    attempted first because they may resolve the problem in a much faster and less
    disruptive fashion than rebuilding the file system.


    This principle also applies when there appear to be multiple problems occurring.
    In such cases, one problem may be causing another, and fixing the first may resolve
    the others. In order to maximize your return, fix the simplest problem first.
    Even if it doesn''t resolve the remaining problems, it will at least remove a
    distracting factor.


    # 2.3.6 Verify System Integrity


    Many seemingly mysterious problems are caused by incorrect ownership or permissions
    on system files. When other possibilities have been exhausted, it''s a good idea
    to verify the integrity of the operating system software.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'fverify(8) command will verify the ownership, permissions, and checksum of
    all files in a software subset; however, it is limited to one subset at a time
    and doesn''t consider the effect of patches. A better method is the allverify
    tool available from HP technical support. More information on allverify is contained
    in Chapter 3.


    # 2.3.7 Use Your Resources


    Few problems are totally new. It''s highly likely that any problem you may encounter—or
    if not the exact same problem, one similar to it—has been before by someone. When
    you need advice on a particular problem, don''t overlook the numerous resources
    available to provide assistance. These include written materials such as HP manuals,
    books as this one, and articles on the Internet. It is also valuable to consult
    with other people; if they don''t have an immediate answer, it often helps to
    get a fresh viewpoint on a problem. In addition to your coworkers, there are a
    number of Web-based forums, newsgroups, and mailing lists available to connect
    you with Tru64 UNIX professionals around the world. A number of useful resources
    (both paper and electronic) are listed in Appendices A and B.


    # 2.4 Summary


    Troubleshooting is an activity that every system administrator has to perform
    at some point. There are a number of resources that describe specific troubleshooting
    activities for various computers and operating systems, but there is a tremendous
    lack of information concerning the actual process of troubleshooting. In this
    chapter, we''ve attempted to address that lack by describing the troubleshooting
    techniques and principles that we developed in the course of our technical support
    experience. It is our hope that these general-purpose techniques and principles
    will serve as a foundation for the specific Tru64 UNIX troubleshooting information
    to follow, and that they will better equip you to troubleshoot the problems you
    encounter.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Tools and Resources


    > If your only tool is a hammer, you tend to see every problem as a nail.

    —Abraham Maslow


    When a problem crops up on a Tru64 UNIX system, the initial symptoms may or not
    be sufficient to determine its root cause. Therefore, you will occasionally need
    to avail yourself of some of the system''s tools to isolate the problem down to
    the failing component. Luckily, Tru64 UNIX provides an array of tools and facilities
    to aid the troubleshooting process. Your task is to choose the correct tool to
    use or log files to examine in order to find the information you need. Our task
    is to familiarize you with the tools available to make your troubleshooting tasks
    as easy as possible.


    In this chapter, we discuss the major troubleshooting facilities and tools available
    for the Tru64 UNIX operating system. Specifically, we will cover the following
    four categories:


    +   1. System-level error-reporting facilities

    2. Process-level reporting facilities

    3. System troubleshooting tools

    4. Kernel debugging tools


    These categories are discussed in the following sections.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 3.1 System-Level Error-Reporting Facilities


    In this section, we introduce some of the facilities and tools available on a
    Tru64 UNIX system for detecting and analyzing errors. Some of these are nearly
    identical to their counterparts in other versions of UNIX; others are unique to
    Tru64 UNIX. For example, readers familiar with another vendor''s UNIX product
    will find the Tru64 UNIX syslog facility to be very similar to what they have
    seen before, whereas the binary error log facility would not be so familiar.


    The three main facilities we will be discussing in this chapter are the following:


    +   1. The system logger

    2. The event manager

    3. The binary error log


    Extensive, in-depth coverage of these facilities is beyond the scope of this text;
    for detailed information, consult the Tru64 UNIX system documentation. Our goal
    is to make you aware of their existence as troubleshooting-ids. It is important
    for a capable administrator to be familiar with their use as possible. As other
    tools of the trade, these facilities are the Tru64 UNIX administrator’s “bread
    and butter” when it comes to tracking down and correcting system problems. In
    addition, with any software system, one or more of these facilities may fail to
    operate properly. Therefore, you may occasionally find that these facilities will
    require troubleshooting themselves. In that case, you need a sound understanding
    of how they work in order to determine how they may be failing.


    # 3.1.1 The System Logger


    Most UNIX implementations provide a centralized facility for collecting and recording
    messages. This facility, commonly referred to as the syslog, is the primary logging
    mechanism used by many system processes and utilities. In addition, syslog’s architecture
    allows nonsystem applications, including user and administrative scripts, to send
    messages to syslog for dispatch. Because syslog is typically the destination for
    error messages by system processes, understanding how syslog works and how to
    interpret and'
  merge: -1
  img_proc: true
