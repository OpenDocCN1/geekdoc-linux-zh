    # 5.2.4 Nonpanic Crashes


    When a system crashes with no trace of a panic—not only crash dump, but no panic
    entries in any log files—the problem is almost certainly due to hardware or environmental
    issues. If this is a one-shot occurrence, there is unfortunately little can be
    done to troubleshoot the problem. For a recurring problem, it should first be
    verified that the system really isn''ticking. It is possible, though unlikely,
    that a panic could occur due to a problem that prevented any of the log files
    from being written. An example of such a problem was discussed in section 2.2.4.)
    The best idea in such a case is to capture the output of the serial console, either
    by attaching a printer or connecting the serial line to another system that logs
    the console output. If this isn''t possible (e.g., if the system has graphics
    console which is always in use), consider moving the system log files to a different
    system, preferably on a different storage controller. If the panic is caused by
    a problem like the one discussed in section 2.2.4, this method will bypass the
    problem and allow the panic to leave some evidence of its occurrence.


    For systems that crash with no panic, the most common cause is power supply problems—either
    the external or the internal power supply. If there is reason to suspect the external
    power supply, consider placing a power monitor on the incoming line to monitor
    the consistency of the internal power supply.


    # 5.3 System Hangs


    System hangs are among the most frustrating problems for a system administrator.
    Unlike a system panic, there is little or no immediate evidence to'
