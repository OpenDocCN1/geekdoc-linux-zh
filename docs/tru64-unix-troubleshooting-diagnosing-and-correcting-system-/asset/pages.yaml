- pgno: 236
  md: 'If, on the other hand, the daemon never started when the system booted, there
    are several possibilities to check. Some of the reasons this could have happened
    include the following:


    +   - LSM has not been configured on the system.

    - LSM is not built into the system''s kernel.

    - The LSM entries in /etc/initstab have been removed or are not in the correct
    order.

    - No valid rootdg configuration copies were found.

    - The system is in single-user mode.


    Let''s assume for a moment that the volume configuration daemon started. As discussed
    in the previous section, the symptom of this problem is an error from LSM commands.
    The first thing to do is to try starting LSM using the following command:


    ```

    # lsmstartup

    ```


    It may be that the system is in single-user mode and, in that case, LSM will not
    have started yet. Starting LSM by hand like this will be your first course of
    action. It is also possible, depending on the timing of the boot process, the
    disks containing the LSM configuration copies were not accessible when LSM was
    trying to start. In this case, trying to start LSM should succeed the second time
    around. This type of timing problem should never happen in practice; if it happens
    more than once, it is advisable to report it to HP technical support.


    It''s possible that the daemon hung up for some reason and is not responding.
    In this case, you see that the daemon is running, but you get a symptom that LSM
    commands are hanging. When this happens, try restarting the daemon with the following
    command:


    ```

    # void -k

    ```


    This command kills any daemons that might already be running before trying to
    start a new one. If this succeeds, you have solved the problem and you should
    be able to use LSM commands at this point. Of course, the daemon should not hang;
    if it does, check the logs for possible'
