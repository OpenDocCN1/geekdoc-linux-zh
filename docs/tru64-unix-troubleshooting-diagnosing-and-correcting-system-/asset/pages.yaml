    specific to each kernel and will almost certainly not match an example from any
    other system. Deciding how many frames of a match is not exact science; it depends
    mostly on the type of panic and experience in crash dump analysis.


    A particular problem that causes a panic may arise through a number of different
    code paths in the kernel. The stack traces from several occurrences of such a
    bug will probably show several common routines below the panic, but may have divergent
    paths thereafter. We generally consider three or more frames following “panic”
    to be a close match, unless the panic is a kernel memory fault or a lock problem,
    which we will discuss further on. This should considered a rough guideline, rather
    than an absolute definition.


    It can also be helpful to examine the preserved message buffer in a crash dump.
    This buffer contains messages that were to be written to the system message file
