    Table 4.4 Components of the Enhanced Security Authentication Database


    | Database Name | File Name | Field Prefix |

    |---|---|---|

    | Protected Password | /tcb/files/auth.db and /var/tcb/files/auth.db | u_ |

    | Terminal Control | /etc/auth/system/ttys.db | t_ |

    | System Default | /etc/auth/system/default | d_ for systemwide defaults; t_,
    u_, and v_ may also appear |

    | Device Assignment | /etc/auth/system/devassigen | v_ |

