- pgno: 52
  md: '# 3.1.1.4.2 /etc/syslog_evm.conf


    The /etc/syslog_evm.conf file specifies which syslog messages to be forward to
    the event manager (evm). Entries in this file have a format of facility.priority[].
    These facilities and priorities are roughly the same as syslog.conf. The optional
    plus sign (+) indicates that if the priority is higher than listed it is also
    forwarded; otherwise, only the priority specified is forwarded.


    Consider this fragment of an /etc/syslog_evm.conf file:


    +   * emerg

    kern.info+

    user.notice


    All emergency messages are forwarded; kernel messages of informational priority
    and higher are forwarded; and user-generated messages with the priority of notice
    (but no other priorities) are forwarded.


    # 3.1.1.4.3 /etc/syslog.auth


    Finally, the local syslogd does not accept syslog messages from just any remote
    host. If a remote host is not listed in the /etc/syslog.auth configuration file
    and the file does not exist, syslog messages from that host are ignored. If the
    file does not exist, the /etc/syslog.auth file is not created at installation
    time. It should be the default behavior is to allow all remote hosts to forward
    syslog messages. The format of this file is simply a list of fully qualified remote
    host names, one line:


    ```

    sunny.abc.com

    cloudy.xyz.com

    ```


    A local host with these entries would accept syslog messages from both sunny.abc.com
    and cloudy.xyz.com.


    # Configuration Tip


    Make sure any system name used in the syslog.auth file is present in the hosts
    file in case of name resolver problems. If your DNS server become unavailable,
    for example, this would allow syslogd to still accept system log messages from
    other hosts.'
