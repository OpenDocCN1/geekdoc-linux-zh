    sometimes do not realize that user names and passwords are case sensitive, and
    the problem may be due to nothing than the Caps Lock key being on. If the user
    is typing the user name and password correctly, the most likely explanation is
    that it''s the wrong password. Try giving the user a new password, and then verify
    that the user can log in with the new one.


