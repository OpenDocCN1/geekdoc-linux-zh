    administrator to query the binary.errlog for the records of interest. For example,
    if you suspect a particular disk is beginning to fail, keep a watch on the binary
    error log for events from that disk. One possibility would be to run the following
    uerf command via cron(8) each night before midnight to e-mail the disk-related
    events that have occurred since the previous midnight:


    ```

    uerf -R -D -t s:0:00

    ```


    Useful though it may be, the uerf command does not provide absolutely every piece
    of information that exists in the binary error log, although specifying the -o
    full command line switch provides more detailed output. The uerf command''s main
    advantage is, to this point, it exists on all Tru64 UNIX systems. To address uerf''s
    translation shortcuts, a more advanced tool was created to replace uerf: DECevent.


    The uerf utility will not provide useful information for newer architecture Alpha
    systems and should not be counted on for accuracy. Compaq Analyze is the best
    tool for analyzing these newer files.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 3.3.2 DECevent


    DECevent is an optional product available directly from HP technical support,
    on the Tru64 UNIX Associated Products CD-ROM, or downloadable from the HP DECevent
    Web page at http://support.compaq.com/svctools/decevent/


    According to the Web page, "DECevent is a rules-based hardware management diagnostic
    tool that provides event translation. During translation, the binary portion of
    an event log is transformed into human-readable text. These events can then be
    displayed on the screen or printed." In essence, DECevent is simply a better uerf(8).
    DECevent, or dia(8) as the DECevent executable is called, has a command syntax
    similar to uer''s and reads the same binary:error as uerf. See the dia(8) reference
    page for the differences. The output from DECevent is more detailed than the euerf
    output. Although much of the DECevent output is unintelligible to the average
    person, it provides a level of detail that HP engineers and technical support
    specialists need to identify and resolve problems quickly.


    To diagnose problems on the Alpha EV6- and later platforms, Compaq Analyze must
    be used. The exception to this rule is that DECevent will work on the AlphaServer
    GS60 and GS140 systems.


    # 3.3.3 Compaq Analyze


    Compaq Analyze (CA) is another optional product on the Associated Products CD.
    You can find out more about Compaq Analyze by visiting the Compaq page at http://www.support.compaq.com/svctools/webes/ca.html.


    To quote the Web page, Compaq Analyze is "rules-based hardware fault management
    tool that provides event analysis and translation." Compaq Analyze is a replacement
    for both uerf and DECevent. CA does both bit-to-text (BTT) translation and multievent
    correlation analysis.


    CA reads the same binary:error that uerf and DECevent read, but uses different
    command syntax and a different translation and analysis engine. The idea behind
    this syntax is that once one is familiar with CA, it does not matter whether the
    platform is UNIX, OpenVMS, Windows NT, or some newly added operating system; the
    command is the same. There are currently three syntax flavors of CA on Tru64 UNIX:
    the old common syntax, a DECevent-like syntax, and the new common syntax. The
    default syntax is configurable, and this setting is systemwide. To set the default
    CA syntax for your system, use the command


    ```

    ca syntax n|ux

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 3.3 System Troubleshooting Tools


    where n is for the new common syntax, x is the old common syntax, and u is for
    the UNIX-like DECevent syntax.


    Whether you use uerf, dia, or CA, the concept is the same. The tool translates
    the binary error log into something that can be understood by a system administrator
    or support specialist. You should use the most recent tool that is compatible
    with your system type—that is ca on all new systems and on most pre-EV6 Alphas.
    Also, ca and DIA have the added functionality of analysis. Table 3.4 lists some
    of the more useful CA commands and dia equivalents and describes what they do.


    # Table 3.4 Useful ca and dia Commands


    | Desired Output | CA Command | DIA Command |

    | --- | --- | --- |

    | Bit-to-text output in reverse order | ca tra rev | dia -R |

    | Summary of events | ca sum | dia -summary |

    | Provide analysis of events | ca ana | dia ana |

    | Specify alternate binary.errlog for bit-to-text formatting | ca tra input <filename>
    | dia -f <filename>


    In addition to the CA command line interface, there is a GUI-based interface that
    you can access by Web browser. See the documentation for instructions on setting
    up your browser. Point your browser to port 7902 for the system you wish to analyze,
    for example: sunny.abc.com:7902.


    From this view, you can see both an analysis of events from the binary error log
    as well as a full view of the BTT translation. Compaq Analyze is part of a suite
    of service tools from the Web-Based Enterprise Services (WEBES) kit. This kit
    also includes the Compaq Crash Analysis Tool (CCAT) and the Revision and Control
    Management Tool (RCM).


    Some of the WEBES tools communicate with a new daemon, desta (distributed service
    tools architecture), or the Director daemon. If CA is installed, desta monitors
    the system log files for new events to translate or analyze. It also responds
    to manual analysis. If CCAT is installed, desta automatically processes new crash
    dump files during the boot process. It also responds to manual crash analysis
    commands.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 3.3.4 sys_check


    The sys_check(8) tool was originally developed to gather essential system information
    for use by HP technical support in diagnosing problems with Tru64 UNIX system.
    By default, the tool creates an HTML-formatted document containing a summary of
    the information found and hyperlinks to various types of system information. The
    tool can also gather more detailed logs, system configuration files, and even
    crash dumps, if they exist. To run sys_check and gather all the configuration
    and log files, use the following command:


    ```

    # sys_check -escalate

    ```


    Data is useful not only to HP support, but to a system administrator as well.
    It can be useful when diagnosing a problem with the system. The HTML document
    may also provide some parameter adjustment suggestions for improving system performance.
    As any tuning suggestions, you should consider the implications of making the
    change beforehand. Any tuning change undertaken blindly has a potential for disaster
    and is highly discouraged. If you have any questions about tuning suggestions,
    we recommend calling HP technical support.


    # Troubleshooting Tip


    sys_check data is gathered into a large compressed tar file. We suggest running
    this tool periodically and archiving the data so that historical comparisons can
    be made. This is often useful when you want to see the state of the system at
    some point in the past and compare it with the current state. For example, if
    a daemon mishaving at a certain time, you could go back to the sys_check data
    and look at the configuration file when the daemon was working properly and compare
    it to the current version of the file.


    # 3.3.5 allverify


    In the past, the only tool available with the Tru64 UNIX operating system that
    you could use to verify the integrity of a software subset is fverify(8). This
    tool is still available today, but it has some serious limitations. First, it
    will verify only a single software subset at a time; with possibly hundreds of
    subsets installed, it is difficult to check an entire system. Second, because'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 3.3 System Troubleshooting Tools


    verify works only on a single subset, it cannot know whether a file is legitimately
    patched using the dutpatch utility. This could lead to false indications that
    a file is corrupted or of unknown origin. Third, verify checks ownership and mode
    for a file based on the information in a subset''s inventory, but it does not
    check whether these characteristics were changed by the subset postinstall script.
    This could lead to a false indication that a file''s mode or ownership information
    is incorrect. Finally, verify does not correctly handle the CDLS commonly used
    in Tru64 UNIX version.


    The avenir tool is a TCL script available from HP technical support that addresses
    the limitations of verify. You can use the avenir tool to determine whether all
    of the subsets loaded on your system are installed correctly, with a high degree
    of assurance that errors reported recently are incorrect files on a system. The
    script allows files to be marked as "volatile," meaning that it will not report
    whether the file has changed from the originally installed version. This is useful
    for files, such as the password file, that are known to change frequently. A typical
    command to check your system without making changes and producing verbose output
    would look as follows:


    ```

    # allverify -nv

    ```


    When you get this tool from HP support, it comes with a reference manual that
    explains all the available options and how they work.


    # 3.3.6 Collect


    It is important to understand what is considered normal activity on the system,
    that abnormal behavior can be compared with it. In such cases, a baseline of previous
    performance levels is invaluable in putting a new performance problem in perspective.
    The collect(8) utility, if configured to run automatically, is a performance-monitoring
    tool that collects system performance information. In addition, there is a GUI,
    called collect, that you can run against collected data to get a quick picture
    of historical system performance. The collect utility itself is available on patched
    V4.x systems and is standard on V5.0A systems and later. The collect tool is a
    separate kit and is not officially supported by HP; however, it is very useful
    in visually tracking performance trends. The collect kit can be obtained from
    the following location:


    ```

    ftp://ftp.digital.com/pub/DEC/collect

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 3.3 System Troubleshooting Tools


    To turn on the autorun feature of collect so that that it survives reboots and
    keeps a historical record of the system''s performance, execute this command as:


    ```

    # rcmgr set COLLECT_AUTORUN 1

    ```


    You might be concerned that collect will impact the system''s performance. Because
    collect is a very lightweight tool and tunable as far as its collecting interval
    and the specific statistics that it monitors, typically takes less than 1 percent
    of the system CPU. It can also be configured to suspend and resume operation based
    on amount of free disk space, you do not have to be overly concerned about storage
