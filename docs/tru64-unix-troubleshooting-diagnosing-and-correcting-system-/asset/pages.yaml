    The syntax and format of the /etc/binlog.conf file must be followed exactly because
    the binlog daemon, like the syslog daemon, unforgiving of configuration file errors.
    Within the binlog.conf file, event code and priority pairs must be separated from
    the destination by spaces or tabs. Blank lines and lines beginning with a pound
    sign (#) are considered to comments and are ignored.


    The first half of a binlog.conf entry specifies the event code and priority of
    messages for which the binlog daemon should watch. The event code and priority
    level must be separated by a period. In addition, asterisk may be specified in
    place of both an event code and priority, indicating that all events and all priorities,
    are to be logged.


