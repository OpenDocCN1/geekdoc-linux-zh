  md: '# 5.3 System Hangs


    Unfortunately, some daemons will ignore the TERM signal. If TERM does not cause
    the process to exit, it may be necessary to use the “big hammer”(signal 9), which
    cannot be handled or ignored by a process. This should be used only as a last
    resort because it will not allow the process to clean up itself before exiting.
    Depending on what the process was doing, you could end up with corrupted files
    or another undesirable result. Therefore, proper administration practice is to
    try the HUP and TERM signals first and wait for a reasonable period of time before
    taking action.


    If a process is in the uninterruptible (U) state, a KILL signal will not cause
    it to terminate. The U state is usually caused by a hardware or driver issue that
    prevents any further action until some kernel-level activity is completed. It’s
    possible that the uninterruptible state is transitory, so you should wait for
    a few minutes for the problem to clear itself assuming the worst. If the U state
    persists, you must take steps to correct the underlying driver or hardware issue.
    This may involve replacing hardware or installing a patched driver on the system.
    If you run into this and make any further progress, consider making a call to
    HP technical support for assistance.) It’s necessary to reboot the system in order
    to clear up an uninterruptible process, it’s necessary to force a crash dump (see
    section 5.3.2 before rebooting.


    When you attempt to kill a process, it will change states and eventually become
    a defunct process (commonly called a zombie) just prior to its initial exit. This
    state is very short in duration and there is no reason for concern in normal operation
    of a UNIX system. If, however, defunct processes are hanging around for a long
    time and seem to be growing in number, there is reason to be concerned. Although
    zombies no longer consume any of the resources they once used, too many zombies
    can cause a system to run out of process slots, thereby the creation of new processes.
    A zombie process cannot be killed because it is already “dead”(hence the nickname);
    the zombie is simply waiting to be cleaned up by the system.


    Zombie processes tend to arise in either of two situations. First (and most commonly),
    they are the result of a poorly written application that does not correctly handle
