- pgno: 29
  md: '# 2.2 Troubleshooting Techniques


    middle of the figure is intended to show that each of the components may affect
    any of the others.


    With some problems, it can be difficult to decide where to start or what to do.
    Keeping the five process components in mind can help to determine the next steps
    in troubleshooting a problem. In the following section, we''ll look at some of
    the techniques you can use to perform this process.


    # 2.2 Troubleshooting Techniques


    In the previous section, we discussed the steps that make up the troubleshooting
    process. Those steps define what you need to do, but they don''t address how to
    actually do it. We will introduce some techniques for your troubleshooting toolbox.


    The following troubleshooting techniques are among the most useful that we''ve
    used or observed in our experience in technical support. It is important to remember
    that not all of these will be effective on every problem. You may find that a
    particular technique works well in most cases, but doesn''t help for a particular
    problem. When this happens, it''s important to remain flexible and use another
    approach, rather than trying to force results from a technique that isn''t working.


    # 2.2.1 Reproducing the Problem


    If the cause of a problem is not immediately apparent, one of the best ways to
    identify the problem is to reproduce it under controlled conditions. Problems
    that occur consistently, as in the failed login example, this is not difficult.
    Intermittent or transient problems, however, are much harder to troubleshoot.
    Such problems always seem to go away on their own before you really get started
    troubleshooting them. But because the root cause of the problem was not identified
    and corrected, the problem may crop up again and again.


    In order to reproduce a problem, it''s necessary to recreate the environment and
    the actions that led to it. If the problem is reproducible, you can then vary
    any of these conditions; this will be discussed in the following section. For
    intermittent problems, it''s extremely important to record the environment and
    actions as accurately as possible. The common factors among multiple occurrences
    will determine the key elements that led to the problem. Intermittent problems
    can be very difficult to reproduce and solve, and the key element among many occurrences
    may not be at obvious.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 2.2 Troubleshooting Techniques


    In an ideal world, the cause of all problems would be immediately obvious; failing
    this, it would be nice if all problems were at least reproducible. However, this
    is not the case in the real world. Some problems, unfortunately, are not reproducible.
    They are among the most frustrating experiences, and they can be difficult or
    impossible to troubleshoot. Although some of the techniques in the following sections
    may aid in identifying and analyzing problems, it must be recognized that with
    some problems, it may never be possible to identify or analyze them sufficiently
    to correct them. When this happens, there are really only three choices, none
    of them satisfying: live with the occasional recurrence of the problem, work around
    the problem, or resort to a "brute-force" approach, such as restoring from backup
    or even reinstalling the system. Although the brute-force approach usually eliminates
    the problem, the lack of a true understanding tends to lower confidence that the
    problem is really gone.


    # 2.2.2 Isolating the Problem


    In section 2.1.2, problem identification was defined as the minimum characterization
    of a problem necessary to begin correcting it. It was also noted that different
    problems can have similar or identical symptoms. In order to identify a problem
    correctly, it''s necessary to determine which factors are common to all instances
    of the problem while eliminating those that aren''t part of the problem. This
    allows you to drill down to the key elements that characterize the problem. The
    process of singling out these key characteristics is known as isolating the problem.


    Isolating a reproducible problem is a straightforward process: vary one (but only
    one) condition at a time, and observe whether the problem occurs. If this reveals
    an element whose presence or absence determines the problem occurs, you''ve isolated
    the problem and are on the way to identifying it. In the example of the failed
    student logins, many users were unable to log in, but this was not true of all
    users. It was also observed that members of the operations staff were able to
    log in. Therefore, the key element must be some characteristic that was true for
    the problem accounts, but not for the working accounts (or vice versa).


    The next step in isolating the problem was to list the conditions that could vary
    from one account to another. This list included the following items:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 2.2 Troubleshooting Techniques


    +   - Username (obviously each username is different, but there is some common
    factor among the problem accounts, such as location in the alphabet, length of
    username, etc.?)


    +   - Home directory (again, each user has a different home directory, but are
    the problem accounts all on the same disk?)


    +   - Group membership (same primary group, member of same secondary group?)


    +   - Default shell


    +   - Login environment (do all the problem accounts run a particular login script?)


    +   - Password length


    +   - Time of last login (is there some dividing point between the problem accounts
    and working accounts?)


    Some of these possibilities (e.g., username length and password length) may seem
    a little far-fetched. It is true that they are unlikely, but even unlikely possibilities
    occasionally happen; the authors have used username length and password length
    turn out to be the key element isolating a problem. The more likely possibilities
    should be checked first, but if none of them reveals a key element, it''s worth
    looking at the unlikely possibilities.


    The last item in the foregoing list illustrates another point to keep in mind:
    most problems have not always existed; they started at some point in time. (If
    a problem has always existed, that''s also useful information.) If something was
    previously working and is now broken, try to determine if any new circumstances
    were introduced around the same time. Did the system configuration change? Were
    other unusual events noticed? Even seemingly unrelated events may provide a clue
    to the nature of the problem.


    In the example problem, it was quickly determined that there were two elements
    to the problem accounts but not to the working accounts. All of the problem accounts
    belonged to undergraduate math majors, which meant they all of their home directories
    were in the same file system—not too surprising, since that file system was dedicated
    to undergraduate math majors. So how could you determine which one was actually
    the key?'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 2.2 Troubleshooting Techniques


    In such cases, one possibility seems more likely (based on your experience or
    intuition), then investigate that one first; if it doesn''t yield any results,
    investigate the other possibility. If both seem equally likely, then pick the
    most easily investigated and try that first. (If there''s still no way to choose
    among the possibilities, just pick one.). In the example problem, there were a
    number of ways in which the home directory could be a key element; for example,
    the disk could be off-line or have no free space. It''s not quite so to come up
    with a way in which primary group membership be the problem. Looking at the more
    likely possibility, it was quickly determined that the disk in question was off-line.
    The cause of the problem was identified, and the administrators could working
    to correct it.


    Just as some problems are not reproducible, all problems can be isolated. Sometimes
    no common element can be identified. In other cases, there may be one or more
    common elements, but investigating them doesn''t reveal the true cause of the
    problem. When this happens, it is necessary to resort to other troubleshooting
    techniques. However, failing to completely isolate the problem isnt necessarily
    a total failure. Even negative information is useful. If attempts to isolate the
    problem fail to determine exactly what the problem is, they may at least provide
    some idea what it is not.


    # 2.2.3 Problem Decomposition


    Problem decomposition is the breaking down of a large or complex problem into
    smaller, more manageable pieces. Decomposition is related to problem isolation;
    both techniques are ways of refining a problem down to a more tractable level.
    The difference between the two techniques is that problem isolation focuses on
    finding the key element of a single problem. Problem decomposition, in contrast,
    is used to break up a complex problem into smaller problems—each of which need
    to be isolated.


    Decomposition is also a useful technique when there appear to be multiple problems
    happening at the same time. As noted in section 2.1.4, what appears to be multiple
    problems aren''t always independent; in such cases, one problem is actually the
    cause of the others. Attempting to break the situation down might reveal a cause-and-effect
    relationship among the multiple problems. When this happens, work on solving the
    root problem first; correcting this problem has a good chance of resolving the
    other problems as well. On the other hand, your efforts to decompose the problem
    may prove that there really are multiple, independent problems occurring, and
    you can work on solving these one at a time.'
