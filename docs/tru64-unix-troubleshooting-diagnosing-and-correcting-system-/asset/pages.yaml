    # 3.1.1.3 Disabling and Enabling syslogd Console Messages


    A common destination for syslog messages is the system console. Depending on the
    amount of activity or the health of the system, the volume of messages printed
    on the console may be very low. Occasionally, the system administrator needs to
    diagnose one or more ongoing system problems from the console. If the syslog daemon
    is denied sending frequent messages to the console, it may be distracting and
    difficult to troubleshoot problems. Beginning with Tru64 UNIX version 4.0, the
    /usr/sbin/syslog command allows enabling and disabling syslog-generated console
    messages.


    If you are working from the console and find syslog informational messages are
    hampering your effectiveness, simply issue the following command:


    ```

    # /usr/sbin/syslog console_off

    ```


    This disables syslog messages. Remember to re-enable syslog messages when the
    console is completed so that the messages will once again be sent to the console:


    ```

    # /usr/sbin/syslog console_on

    ```'
