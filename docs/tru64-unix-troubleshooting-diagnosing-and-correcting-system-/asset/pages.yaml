    Finally, strange build errors can occur if there is a problem with the null device,
    /dev/null. Typical error messages include (but are not limited to the following):


    ```

    /usr/lib/cmplrs/cc/cfe: Fatal: Cannot open the file rm

    cc Error: no source, object or ucode file specified

    /usr/lib/cmplrs/cc/cfe: Fatal: Cannot open the file vmnix

    /usr/lib/cmplrs/cc/cfe: Fatal: Cannot open the file vmnix.*

    ```


    This problem occurs if /dev/null is a regular file instead of a device. This is
    almost always caused by a privileged user accidentally deleting /dev/null. The
    next command that redirects output to /dev/null (e.g., many of the system startup
    scripts) recreates /dev/null as a regular file. This doesn''t really cause any
    problems for most operations; output sent to such a /dev/null just accumulates
    in the file instead of disappearing. However, the kernel build process uses /dev/null
    in some creative ways, and if /dev/null is a regular file, it causes errors like
    those shown above. The problem doesn''t surface until the next kernel build, but
    it may exist for some time without being noticed.


    To see whether this problem exists on your system, use the file(1) command to
    check the null device type:


    ```

    # cd /dev

    # file null

    null: empty

    ```


    The only correct output is “null: character special (2/2).” If the result is anything
    else, remove the null file and recreate it:


    ```

    # rm null

    # /.MAKEDEV null

    ```


    Now the file command should show the null device as a special file with major
    and minor numbers both equal to 2:


    ```

    # file null

    null: character special (2/2)

