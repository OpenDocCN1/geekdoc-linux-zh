    # 7.2.1.2 Interface Configuration Issues


    Once you''ve eliminated system problems as being the cause of a networking problem,
    you''ll need to examine the network configuration itself. At a minimum, you''ll
    need to check and correct any issues arising from the following:


    +   1. Verify that the IP address, netmask, and broadcast address are correct.

