    has a “soft” and a “hard” value. Soft limits can be raised, using the limit or
    ulimit command, up to the corresponding hard limit; hard limits, once set, cannot
    be increased. The limits for resources—though not all of them—are derived from
    kernel parameters in the “proc” (process) subsystem. Table 4.2 contains information
    about each resource limit.


    # Table 4.2 Process Resource Limits


    | Resource | limit Field Name | ulimit Field Name | "ulimit" Switch | Derived
    from |

    |---|---|---|---||

    | CPU time | cputime | time | - | (none) |

    | File size | filesize | file | -f | filesystem type and quotas |

    | Data segment size | datasize | data | -d | (soft) per_proc_data_size (hard)
    max_per_proc_data_size |

    | Stack segment size | stacksize | stack | -s | (soft) per_proc_stack_size (hard)
    max_per_proc_stack_size |

    | Core dump size | coredumpsize | coredump | -c | (none) |'
