  md: '# 5.3 System Hangs


    guide troubleshooting efforts. The focus shifts to determining what the system
    is doing and why it is not responding in the expected manner, and then determining
    the appropriate course of action to resolve the problem. In most cases, it''s
    not possible to recover from a hang cleanly or to gather much information while
    the system is hung. A reboot is usually required to alleviate the hang condition.
    Unfortunately, this destroys the "live" evidence on the system, making troubleshooting
    more difficult. Some evidence can be preserved by forcing a crash before rebooting
    the system. The resulting crash dump files contains the contents of physical memory
    at the time of the hang, providing a snapshot of conditions at that instant.


    Not hangs are created equal. From a user''s point of view, a hang can be any condition
    in which the system is not responding. This could be caused by an application
    not responding, a network connection, or a system that is truly hung (i.e., not
    executing at all). Users need to be an inpatient lot; a system or application
    that is actually responding very slowly may be reported to be hung. As such, the
    first step in troubleshooting a hang is to determine the severity of the hang,
    a process that is discussed in 5.3.1.


    Most hangs are not cleanly recoverable, and it''s necessary to reset the system
    (forcing a crash). After the system is restored to service, it''s important to
    look for evidence in the same places as you would for a crash: the binary error
    log, the system message file, and other system logs. It''s important to note what
    the system was doing at the time—for example, running a large or new job of some
    type, experiencing an extremely high user load. For recurring problems, look for
    patterns to isolate key elements common to multiple hangs. If you find an apparent
    key element, try reproducing the problem if at possible. This is always a useful
    troubleshooting technique, but it''s particularly valuable when troubleshooting
    hangs systems, simply hangs frequently provide little else to work with.


    # 5.3.1 Determining the Severity of a Hang


    Determining the severity of a hang is a matter of trying various ways to elicit
    a response from the system. If the system fails to respond in any way, it''s completely
    hung. When this happens, there is little alternative but to force a crash (a procedure
    we will discuss in the next section) and reboot the system. The first step is
    to try to ping the system from another host on the network. If the system responds
    to the ping, it indicates that the kernel is still running and able to respond
    to network interrupts. In this case, the sys'
