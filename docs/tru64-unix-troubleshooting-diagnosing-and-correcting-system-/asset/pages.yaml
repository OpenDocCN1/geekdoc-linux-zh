  md: 'Tru64 UNIX has the ability to create daily syslog log files. If you specify
    a path such as /var/adm/syslog.dated/mail.log as a destination, a new directory
    and associated log files are created each day. These file names have the form
    /var/adm/syslog.dated/<date>/file, where <date> is the day, month, and time and
    <file> is the log file name, such as mail.log. For example:


    ```

    mail.debug      /var/adm/syslog.dated/mail.log

    ```


    This is a nice feature because it produces a day-by-day account of the messages
    received. For example, an entry such the mail.debug entry above will cause syslogd
    to log debug messages in the file if syslog was started or restarted on June 2nd
    at 6:54 P.M.:


    ```

    /var/adm/syslog.dated/02-Jun-18:54/kern.log

    ```


    Furthermore, the symbolic link "current" in the /var/adm/syslog.dated directory
    always points to the currently active syslog directory, making it easy to find
    the current set of syslog log files. Simply set the working directory to /var/adm/syslog.dated/current.


    # Configuration Tip


    The daily log files from syslog.dated are generated every 24 hours, beginning
    from the time the syslog daemon was started. Because this could be any time of
    the day, data for a particular day may be split between two instances of the log
    files, making it difficult to put together data from a particular day''s events.
    To avoid this problem, you can make the daemon reset its log files each day at
    midnight by adding a line similar to the following to the root crontab file:


    ```

    0 0 * * * /sbin/kill -HUP /sbin/cat /var/run/syslog.pid

    ```


    It''s important to be aware that if a syslog destination is a normal file (i.e.,
    it begins with a leading slash as in /etc/syslog.conf), always appends data to
    that file and the file will grow indefinitely. Monitor log files and trim them
    when necessary to avoid filling up the destination system(s). The following is
    an example of trimming /var/adm/messages:'
