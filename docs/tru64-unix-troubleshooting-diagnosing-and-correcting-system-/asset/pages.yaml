    the problem.


    If all of the file systems, you can modify the scripts /sbin/rc2 and /sbin/rc3
    to debug the boot process in more detail. These two scripts run the startup scripts
    (located in directories) /sbin/rc2.d and /sbin/rc3.d) as the system transitions
    from single-user mode through run level 2 (mul-'
