- pgno: 15
  md: '# # Introduction


    > Problems are only opportunities in work clothes.

    — Henry J. Kaiser


    # ## I.I Tru64 UNIX History


    The operating system that we discuss in this book has had a varied and interesting
    history. Recent history has seen some very interesting developments, culminating
    in the decision to merge key elements of Tru64 UNIX, such as the Advanced File
    System (AdvFS) and TruCluster, with the HP-UX kernel to create a powerful new
    UNIX. The merger of Compaq Computer Corporation (Compaq) with the Hewlett-Packard
    Company (HP) is sure to make the future of this product interesting as the two
    UNIX powerhouses combine resources to create exciting new synergies.


    Tru64 UNIX began as an attempt to commercialize the Mach kernel


    A group known as the Open Software Foundation (OSF), making an attempt to reverse
    this trend, adopted the Mach kernel as its core. As a founding member of OSF,
    Digital Equipment Corporation (Digital) took'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 1.2 Scope


    much of the work done by the group and decided to commercialize it into a product
    running on a hot new processor they were developing at the time—the 64-bit Alpha
    processor. The operating system that Digital developed, based on the work done
    by the OSF, was named DEC OSF/1. The new operating system, designed from the ground
    up to 64-bit, continued to evolve over time. More advanced features, such as symmetric
    multip own (SMP), the Advanced File System (AdvFS), the Logical Storage Manager
    (LSM), and clustering, were added.


    Around the same time, it became clear that Digital was the only member of the
    OSF/1 core for its UNIX operating system. The decision was made to change the
    product''s name to Digital UNIX (at version 3.2C) in order to break away from
    OS roots and emphasize its UNIX character. Before long, clusters of large “Turbaser”
    8000-series systems were equipped with this powerful and flexible operating system.
    Later, when Compaq acquired Digital, it decided to rename the product to Tru64
    UNIX (at version 4.0E) in order to better represent its 64-bit qualities and eliminate
    the old Digital name.


    The Tru64 development team began an incredible overhaul of the product in version
    5.0. This major version and its successors introduced support for single system
    image (SSI) clustering and nonuniform memory architecture (NUMA) systems. Some
    of the new features added to support SSI clustering were a device-naming standard
    and a cluster file system. UNIX enhanced to support the global server (GS) series,
    supporting up to 64GB of physical memory and 32 processors. With V5.1A release,
    the product gained the additional capacity of local-area network (LAN) interconnect
    clustering in memory channel, providing much greater flexibility in designing
    and fielding new clusters. In the future, there will be additional support for
    the even more powerful “Marvel” Alpha platform. As of writing, these systems seem
    to push the limits again for memory and processor support in the operating system.


    # 1.2 Scope


    This book is written for the average Tru64 UNIX system administrator who has a
    tough problem to solve and isn''t sure how to troubleshoot it. We attempt to distill
    our years of experience in troubleshooting Tru64 problems into a disciplined approach.
    There are always tricks and techniques that can be used in any particular situation,
    and we will provide those whenever appropriate. The overriding goal of this book,
    is'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Organization


    to instruct the reader in basic troubleshooting principles and techniques. From
    that foundation, specific practices follow naturally. Tru64 UNIX system administration.


    It is assumed that the reader is familiar with basic Tru64 UNIX system administration.
    Because of space constraints, this is not meant as a comprehensive reference,
    and the reader is referred to the on-line reference pages or Tru64 UNIX documentation
    for in-depth coverage of a particular tool or option. The reader can also look
    for additional references in Appendix B that this discusses Tru64 UNIX version
    5.1A, although in many cases the material is sufficiently general to be fully
    applicable to other versions. If a technique or feature applies only to a specific
    version of the operating system, that will be so noted.


    # Organization


    This book is organized into 12 chapters, which cover the following topics:


    +   1. Introduction. This includes a brief overview of the history of Tru64 UNIX
    and its current standing. We will also describe the scope of the book and what
    we hope the reader will gain from it.

    2. Principles and Techniques. This chapter is the foundation of the book. We will
    present techniques for detecting problems and isolating their root causes. The
    material in this chapter is primarily of general applicability, not limited simply
    to Tru64 UNIX.

    3. Tools and Resources. This chapter focuses on tools available for system reporting,
    error detection, and isolation in Tru64 UNIX, including parts of the operating
    system (e.g., Event Manager, Compaq Analyze, collect, and sys_check).

    4. User Accounts and Security. This chapter discusses common problems with individual
    user accounts, such as login failures; password problems; enhanced security features;
    and shell environment problems.

    5. System Failures. This chapter covers system failures such as crashes, system
    hangs, and boot failures. Regarding system crashes, we do not provide a detailed
    course in crash dump analysis; this would be overly long, beyond most readers,
    and of little help except for those administrators who have purchased a Tru64
    UNIX source license. We provide a way for administrators to take a quick look
    at crash dumps and, in many cases, determine'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Organization


    whether the problem is a local issue (e.g., a hardware failure or full disk) or
    an operating system failure that needs to be referred to HP technical support.


    +   6. System Performance. In this chapter, we focus on identifying and relieving
    system performance bottlenecks. We include general system-tuning information,
    but our intent is to focus on responding to performance problems rather than on
    tuning for maximum performance. The latter is a complex issue and beyond the scope
    of this book.


    +   7. Networking. We focus on common problems with Tru64 UNIX utilities, including
    the Network File System (NFS), Network Information Service (NIS), and Berkeley
    Internet Name Domain (BIND) services. We discuss ways to determine whether a network
    problem is caused by hardware, but troubleshooting specific network hardware components
    is outside the scope of this book.


    +   8. Storage. Our focus here is on disk and tape issues: identifying hardware
    problems (but not troubleshooting specific hardware components), device-naming
    issues, and Logical Storage Manager (LSM) problems.


    +   9. File systems. Here we cover common problems with the UFS and AdvFS filesystems.
    We also discuss problems with the Tru64 native backup utilities such as tar, vdump,
    and vrestore.


    +   10. System Configuration. This chapter discusses problems that arise in various
    aspects of system configuration: installing or upgrading the operating system,
    installing patches, and configuring the kernel.


    +   11. System Administration. This chapter includes problems in several areas
    of system administration, including licensing problems, printing problems, and
    job scheduling.


    +   12. Display Problems. This chapter covers common problems with graphics consoles
    and X Windows displays. The discussion is limited to isolating and correcting
    such problems, and is not intended as a comprehensive treatment of computer graphics
    or X Windows.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Principles and Techniques


    > When you have eliminated the impossible, whatever remains, however improbable,
    must be the truth.

    —Sherlock Holmes


    # 2.1 The Troubleshooting Process


    Every computer system, no matter how reliable, well-designed, or well-managed,
    will inevitably encounter problems. When a problem occurs, it is up to the system
    administrator to identify and correct the problem—and then, in most cases, to
    provide explanations to users or management. This chapter provides a basic set
    of troubleshooting principles and techniques that will apply to any problem situation.
    These principles and techniques lay a foundation for the Tru64 UNIX troubleshooting
    specifics in the remainder of the book.


    For the most part, troubleshooting computer problems has never been a well-defined
    subject. College classes and training courses provide a great deal of information
    on the theory and operation of computers, but they tend to focus on what happens
    when the system works, not when it breaks. Some computer manuals provide troubleshooting
    information, but it is of a specific nature, focusing on the responses to specific
    errors. Such specific information is useful and necessary (in fact, it forms the
    basis for the latter chapters in this book), but it doesn''t address the process
    of troubleshooting.


    In our experience as technical support providers, we''ve found that troubleshooting
    ability seems to be independent of academic achievement, computer skills, or experience
    as a system administrator. One of the interesting things about training new support
    personnel is finding that some'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'people just seem to get it. They have an intuitive knack for getting to the
    root of a problem and finding the proper solution. Other people don''t have this
    knack and usually have to acquire their troubleshooting skills the hard way. The
    troubleshooting principles and techniques in this chapter are the result of our
    observation of such people (both with and without the knack), as well as the practices
    we''ve developed in our own work.


    In general terms, the process of troubleshooting can be broken down into five
    components:


    +   1. Detection—does a problem exist?

    2. Identification—what is the problem?

    3. Analysis—what caused the problem?

    4. Correction—how can the problem be fixed?

    5. Prevention—how can the problem be avoided?


    Figure 2.1 depicts a somewhat idealized relationship between these components.
    In practice, not all problems encompass all five distinct steps. Some steps overlap
    in troubleshooting a particular case; in other cases, some steps are unnecessary.
    However, it is useful to think of each component as an independent step when troubleshooting
    a problem. The following sections describe each component and explain how the
    five components relate to each other.


    ![](img/0c61d0bcd2bcbfa9f85f77a2369d3610_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 2.1.1 Detection


    The first step in troubleshooting a problem is detecting a problem that has occurred.
    At first glance, it may seem unnecessary to list problem detection as a distinct
    component of the troubleshooting process. However, not all problems are equally
    obvious, and it is worth considering the various ways in which problems can be
    detected.


    In the case of a major problem affecting an entire system (e.g., a system crash),
    it is immediately obvious to everyone using the system that a problem exists.
    In such cases, we can move on to the next step: identification of the problem.
    Other types of problems, however, are not immediately obvious. It''s important
    to detect and respond to such problems as soon as possible; early detection and
    resolution can prevent more severe problems from occurring. For example if a disk
    is starting to experience occasional errors leading to bad-block replacements,
    replacing the disk will require only a little downtime. But if the problem is
    not taken care of, the disk will continue to deteriorate and will probably crash
    at the worst possible time.


    When a problem is first detected by a system administrator, troubleshooting can
    begin immediately. However, if a problem is noticed by users working on the system,
    it must be reported to an administrator before it can be resolved. As such, it
    is necessary to have a way for users to report problems quickly and easily. The
    exact method used depends on local circumstances; it might be a help desk, a pager,
    an electronic mailbox, or a shout of "Help" over the cubicle wall. Whatever method
    you choose, make sure that your users are willing to report problems as they occur.
    The best way to promote such willingness is to have an easy-to-use problem-reporting
    system, and of all, to be responsive to reported problems.


    A trickier issue is "invisible" problems. For example, RAID (redundant independent
    disks) storage systems are a popular method of providing storage redundancy at
    relatively low cost. Some RAID storage sets an extra disk to a number of disks,
    compute parity information across the disks, and store the parity information
    on the extra disk. If any one disk fails, the RAID controller automatically regenerates
    the data from the remaining data chunks and the parity data. Because the data
    is still available, it appears that the storage set is fine, though perhaps a
    little. This is great for data availability—but not so great for problem detection.


    Because there is no immediately obvious problem, no action will be taken to correct
    the problem unless there is some other means of detecting it. The RAIDset will
    continue to operate with one failed disk, but it will'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'now be operating with no redundancy. If a second disk in the set fails, the
    storage set will go down and data will have been lost. If the first failure had
    been detected, the failed disk could have been replaced and the RAID- restored
    to its normal level of redundancy before another disk failed. Detecting this kind
    of problem can be tricky; we will discuss strategies for doing so later in this
    book.


    Problems are characterized by their range of effect and their severity. Range
    of effect defines who or what is affected by the problem: is the whole system
    or a critical function down, or is the problem limited to a subset (perhaps only
    one) of your users or applications? Severity defines the seriousness of the problem:
    is the system or function completely down, partially working, or performing poorly?
    These two pieces of information are extremely important when reporting a problem.
    Not only are they necessary for problem identification, but they help define the
    urgency of resolving the problem.


    Let''s consider a hypothetical problem. The system administrator of a student
    server at a major university receives a report that some students are unable to
    log into their accounts on the server. Other students, are able to log in with
    no problem. In addition—but not all—students who were already logged in are now
    experiencing various problems.


    This problem''s range of effect is (as yet undefined) subset of the system''s
    users. Defining the extent of this subset of users will help to characterize the
    problem. For those affected, the problem is extremely severe; the system is completely
    unusable for them. We''ll continue to follow this problem through the remaining
    components of the process. For now, we''ll leave it and go on to discuss problem
    identification.


    # 2.1.2 Identification


    Once the existence of a problem has been detected, the next step is to determine
    exactly what the problem is. This might seem redundant; after all, doesn''t the
    detection or report of a problem tell you what the problem is? To a certain extent,
    the detection and identification phases do overlap. In some cases, the problem
    report will contain all information needed to identify the problem. In other cases,
    though, more work must be done to determine exactly what the problem is—and identifying
    the problem is necessary in order to correct it. This, in fact, is the key difference
    between detection and identification. Detection is simply the awareness that a
    problem exists, whereas identification is the minimum characterization of a problem
    necessary to begin correcting it.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2.1 The Troubleshooting Process


    As an analogy, consider a visit to the doctor because you have a cough, a sore
    throat, and a fever. These symptoms cause you to detect that a problem exists,
    but they don''t identify the problem. You might have a cold, the flu, a virus,
    or some other disease that you''ve never heard of. The doctor will consider your
    symptoms in diagnosing your condition, and he may also check your vital signs,
    ask about your recent history, and perhaps do some other tests to identify the
    problem accurately. Only by identifying the actual problem can it be effectively
    treated. It might be possible to treat the symptoms while this might make you
    feel better, it probably won''t cure the underlying condition. Similarly, when
    troubleshooting systems problems, it may be useful to provide a workaround for
    a problem in order to quickly restore lost capability. However, this is just like
    treating the symptoms of a medical problem. It may be helpful in the short term,
    but in the long term it''s important to identify and correct the really underlying


    How do you identify a problem? Identifying something—whether a problem, car model,
    or animal—is a process of observing characteristics with a known model until a
    match is found. This definition divides the process of identification into two
    components: observation and comparison. Observing the characteristics of a problem
    begins with the initial problem report. At a minimum, the type of problem, its
    severity, and its range of effect must be noted. It may be that these pieces of
    information are sufficient to identify the problem. If not, it''s necessary to
    continue gathering information about the problem. The gathering of information
    is not necessarily a passive process. Fully characterizing the problem often requires
    the troubleshooter to perform some actions and observe the results.


    Once a problem is characterized, it must be matched with a known model in order
    to identify the problem. This may be an automatic process that you don''t even
    have to think about. If the problem is a type of that you recognize, your mind
    matches the problem characteristics to a known model in your memory; your recognition
    of the problem provides the identification. On the other hand, if you''re not
    already familiar with the problem, you''ll probably need to consult other sources
    to find a matching set of problem characteristics. These sources may include coworkers,
    records of past problems you''ve encountered, Internet resources, and books like
    this one. Every system administrator should maintain a list of resources for troubleshooting
    information. Appendixes A and B contain some valuable resources to add to your
    list.


    Problem identification is rarely a one-shot process. In many cases, the initial
    information won''t be sufficient to identify the problem.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'When this happens, identification becomes an iterative process. After consulting
    resources, you determine that additional information is needed to characterize
    the problem completely. Using your troubleshooting resources and the techniques
    described in section 2.2, you gather additional information. This cycle is repeated
    until the problem has been completely identified. It''s possible that the problem
    might be completely solved at this point. The only way to identify a problem fully
    is to try various corrective actions and see which one fixes the problem.


    Let''s continue with the hypothetical problem from the previous section. Some
    of the students of a university system are unable to log in, and some who have
    already logged in are now having problems. The report of this problem made the
    system administrator aware of the problem but it was not enough to identify the
    problem. In order to identify the problem fully and begin correcting it, more
    information is needed.


    The first step is to characterize the range of effect. What is common among users
    having problems, and what is different between those users and other users who
    are still working normally? After comparing a few users of both types, it appears
    the problem is affecting only users with home directories on a particular disk.
    A quick check confirms that the directories are no longer accessible. Further
    checking reveals that the disk is off-line, and attempts to bring it on-line are
    unsuccessful; the disk has failed. The problem has now been identified, and corrective
    action can begin.


    # 2.1.3 Analysis


    Once a problem has been identified, you can start working to correct it. If the
    problem is well understood and has a clear solution, there is probably no need
    to delve further into what caused the problem. However, sometimes it''s just as
    important to know why the problem occurred as it is to identify the problem. In
    such cases, it''s frequently necessary to perform additional analysis in order
    to understand the root cause of the problem. This is particularly true when trying
    to resolve a recurring problem. It may be possible to fix the problem each time
    it occurs—especially if you''re getting a lot of practice at it—but it''s highly
    likely that there''s something going on that causes the problem to keep returning.
    In the long run, it''s much better to find and address the underlying cause in
    order to prevent the problem from recurring.


    Even if the problem isn''t a recurring one, it may be desirable to perform additional
    analysis as a preventive measure to see whether any additional'
