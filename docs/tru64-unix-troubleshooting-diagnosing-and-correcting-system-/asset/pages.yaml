    “field_name@” if they have a false value; in other words, the “@” at the end of
    the fields acts as a negation operator. It is not necessary for every possible
    field to be present in every entry. When a particular field is not specified in
    an individual entry, the corresponding field value from the system default database
    is used for that entry.


    Many of the authentication database fields indicate time values, either a duration
    (e.g., password lifetime) or an absolute time (e.g., time of last successful login).
    All time values are represented in seconds. For an absolute time, the value is
    the number of seconds since the standard UNIX time epoch, which is the beginning
    of the year 1970. The value zero has a special meaning in many of the integer
    fields, generally indicating an infinite value or a check that will not be performed.
    For example, the field “u_exp#0” indicates that the password expiration time is
    infinite (i.e., the password will never expire).


    The authentication database can be manipulated manually via the edauth(8) command,
    which can view, edit, and remove entries in the authentication database. For example,
    the following command displays the protected password entry for the root account:


    ```

    # edauth -g root

    ```


    To edit the entry for the root account:


    ```

    # edauth root

    ```'
