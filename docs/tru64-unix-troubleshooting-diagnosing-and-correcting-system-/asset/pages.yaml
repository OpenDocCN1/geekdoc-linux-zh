    # 2.1.4 Correction


    Once a problem has been identified, it must be corrected. Correction is the heart
    of the troubleshooting process, and it is the focus of most of the detailed information
    in this book. As a component of the troubleshooting process, correction includes
    any action taken to restore or replace lost. This may include finding a workaround,
    as well as actually fixing the problem. There are times when a full solution may
    be too expensive, time-consuming, or risky to implement immediately; in such cases,
    a workaround can serve as a temporary measure until the real problem can be fixed.


    With some problems—particularly minor problems—the most appropriate corrective
    action may be to do nothing. After identifying a problem and determining its solution,
    you might decide that implementing the solution is disruptive or risky that it''s
    better to use a workaround or, if no workaround is possible, to live with the
    problem. For example, there may be a feature that you would like to use, but it''s
    not available in the version of the operating system that you''re currently running.
    Upgrading to a later version would provide that feature, but upgrading might not
    be a practical option. As such, the only choices are finding an alternative way
    of providing the desired functionality or doing without it.


    Like problem identification, problem correction isn''t always a one-shot process.
    Sometimes it''s necessary to fix one part of a problem, then and continue with
    further corrective action. This is particularly true when there appear to be multiple
    problems present. In such cases, fixing the first problem will probably resolve
    the others. As a rule, when you have multiple problems, fix the simplest problem
    first. This might resolve some or all of the others; even if it doesn''t, it will
    least remove one distraction and allow you to focus on the remaining problems.


    There are also situations in which problem identification and correction go in
    hand. A problem may be narrowed down to two or three causes, each with a different
    solution, but there''s no way to determine which of them is the correct one. When
    this happens, the only recourse is to try one of the possible solutions. If it
    fixes the problem, then the problem has been identified—and corrected at the same
    time. If the solution didn'
