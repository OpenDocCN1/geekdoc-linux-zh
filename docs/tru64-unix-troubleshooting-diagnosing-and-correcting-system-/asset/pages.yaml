    if you write the tape at the lowest density supported by the drive.


    # Before you call support


    If you can''t read a tape, check the following:


    +   * Is the tape blank? Has it been degaussed?

    * Did you try dd to see whether the tape contains any type of data?

    * Is the tape format supported by Tru64 UNIX?

    * If the tape is from a UNIX system, did you try cpio, ltf, and dump?

    * If the tape is from a non-UNIX system, did you try ltf and tar?

    * Is the tape density supported by the tape drive


