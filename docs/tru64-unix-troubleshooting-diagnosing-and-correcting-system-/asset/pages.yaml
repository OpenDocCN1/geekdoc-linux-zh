    be very difficult to diagnose, particularly on a large network. The best thing
    to do if you suspect this is happening is to take your system off-line and then
    use another system to ping your IP address. If you can still successfully ping
    with your host off the network, you can be pretty sure that has “borrowed” your
    IP address. It is usually a good idea to get your networking people involved at
