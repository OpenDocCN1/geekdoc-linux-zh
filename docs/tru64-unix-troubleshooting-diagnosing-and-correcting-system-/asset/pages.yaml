    # Network Design Tip


    The Tru64 UNIX feature known as NetRAIN can save many hours dealing with network
    problems. This feature allows you to set up multiple network interfaces to the
    same physical network and make them perform as a single logical connection. If
    one of the network connections breaks, another takes over automatically. This
    configuration can make your network more robust and utilize unused NIC ports.


    # Troubleshooting Tip


    NICs and cables are relatively cheap today compared with other components. We
    recommend keeping spare NICs and cables of each type used on your critical systems
    available to be “popped into” a system when a problem is encountered. This can
    save lots of time waiting for a new part when the system is in a degraded condition.


    # 7.2 Networking Software Issues


    Software tends to be more complex than hardware and can fail in strange and unpredictable
    ways. Therefore, tracking down networking software problems to be trickier than
    their hardware cousins. Although the symptoms may seem strange (e.g., failure
    to connect to a given service on a given machine; some services working while
    others are not), it is possible to troubleshoot such problems in a logical manner.


    The first step is to determine whether the problem can be isolated to a single
    system. If so, is only one service or more than one failing? When these questions
    have been answered, look for common elements among the'
