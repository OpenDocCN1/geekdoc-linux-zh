  md: '# 10.3 Kernel Configuration


    determines a value for maxusers (if it''s not specified in /etc/sysconfig) based
    on the amount of physical memory in the system. The relationship between maxusers
    and physical memory is shown in Table 10.2. The minimum possible value for the
    parameter is 8, while the maximum is 16,384 (4,096 in version 4).


    # Table 10.2 Default Value of maxusers in Tru64 UNIX Version 5


    | Physical Memory Size | Default Value of maxusers |

    | --- | --- |

    | Up to 32 MB | 16 |

    | More than 32 MB, less than 256 MB | 128 |

    | At 256 MB, less than 512 MB | 256 |

    | At 512 MB, less than 1 GB | 512 |

    | At 1 GB, less than 2 GB | 1,024 |

    | More than 2 GB | 2,048 |


    If maxusers is too small, the most common error is a shortage of available slots.
    When this happens, attempting to run a command fails with an error message such
    as "pid table is full," "too many processes already exist," or something similar.
