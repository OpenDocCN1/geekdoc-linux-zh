  md: '# 4.1 User Account Problems


    One last file-related problem occurs when users try to perform wildcard operations
    on large numbers of files. Because the shell expands wildcards before executing
    a command, a large number of files can cause the expanded command to exceed the
    maximum shell length, which is 38,912 characters (ARG_MAX in /usr/include/sys/limits.h).
    This error generates the message "arg list too long." For example, the command
    "rm *" in a directory containing thousands of files is very likely to experience.
    In some cases, this can be worked; in this example, the command "rm -r" would
    do the trick (assuming there were no subdirectories that not deleted) because
    the "rm -r" would work its way through the directory structure rather than having
    all the files expanded by the shell.


    However, not all cases have a similar workaround; in these other cases, the find(1)command
    and possibly the xargs(1) command can be used. For example, if the desired result
    were to delete all files name start with the letter "a," the command "rm a" would
    fail if there were too many files. In this case, "rm -r" wouldn''t help, because
    that would delete all other files as well. But the task could be accomplished
    in a couple of ways with the find command:


    ```

    find -name ''a*'' -exec rm \ \

    or

    find -name ''a*'' | xargs rm-

    ```


    Using xargs, as in the second example above, would probably be faster, but might
    also run into a command-length limit. The first example, although slower, would
    work no matter how many files were involved.


    # 4.1.4 Account Maintenance Problems


    Account maintenance includes the tasks of adding, modifying, and deleting user
    accounts or groups. Problems with these tasks fall into two main areas:


    +   1. Inability to perform the task (an error prevents the task from being completed)


    +   2. Ineffectiveness (the task is performed, but the results are not as expected)'
