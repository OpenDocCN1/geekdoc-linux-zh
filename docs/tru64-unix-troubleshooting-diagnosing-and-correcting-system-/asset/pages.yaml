    name within the domain. Create a subdirectory under /etc/fdmn for the new domain.
    In this subdirectory, create a link to the disk partition containing the root
    file system. The domain link may be created automatically by the CD boot, but
    in case it isn’t, here is how to do it:


    ```

    # mkdir -p /etc/fdmn/root_domain

    # cd /etc/fdmn/root_domain

    # ln -s /dev/disk/dskla

    ```


    Now mount the root file system:


    ```

    # mount root_domain#root /mnt

    ```


    If you have problems mounting the root file system (whether UFS or AdvFS), verify
    that all your information is correct. If it is, make sure that your current working
    directory is not set to the mount point; this will cause the mount to fail with
    a “device busy” error. Also, make sure that the file system is not already mounted;
    use the “mount” command with no options to list mounted file systems (you will
    not be able to use df). If the file system still won’t mount, it has been deleted
    or corrupted, and it will be necessary to restore the root file system from backup.
    (For details on restoring a root file system, see the Tru64 UNIX System Administration
    manual.) If no backup exists, there is little alternative except to reinstall
    the operating system.


