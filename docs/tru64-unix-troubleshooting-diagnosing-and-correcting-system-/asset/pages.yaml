- pgno: 248
  md: '# 9.1.6 Issues with Mounting and Unmounting File Systems


    Attempting to mount a file system is an operation that usually succeeds. Sometimes
    it doesn''t, however, and you will need to troubleshoot the problem. Some of the
    more common problems are listed below. The likely error message is listed in parentheses
    with each possible cause:


    +   - You are not logged in as root (Permission denied).

    - The file system is already mounted (Device busy).

    - Another application has the block-special-device file open (Device busy).

    - The mount point specified is not a directory (Not a directory).

    - An AdvFS file system has experienced a domain panic (I/O error).

    - The device has encountered a hardware error (I/O error).

    - The file system is not supported in the kernel (File system invalid or not installed).

    - The AdvFS file system is a copy of an already mounted file system (I/O error).


    One of the most common issues you may run into unmounting file systems is that
    the mount command will fail with a "Device busy" message if there are open files
    anywhere in the file system. When this happens, the fuser command will show which
    users are using the file system so they can be asked to move or, if necessary,
    their processes can be killed. Some other problems occur when unmounting local
    file systems are the following:


    +   - You are not logged in as root (Not owner).

    - The file system is not mounted (Currently mounted).


    # 9.1.7 Leveling Cache Flush Performance


    Since early in the development of caching in UNIX, the update(8) daemon has operated
    in the same manner as it does today. This daemon runs every 30 seconds and executes
    a sync() system call to flush all dirty (i.e., modified) I/O buffers to disk.
    This mechanism works well for most systems, but sys-'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 9.1 Generic File Systems Issues


    235




    tems with a large amount of volatile data can experience a momentary

    pause in system response while the cache is flushed.


    The smooth sync and I/O throttling features were first introduced in

    Tru64 UNIX V5.0 in order to address the problem of systems pausing

    when large numbers of dirty pages were flushed to disk each pass of the

    update daemon. In the case of very large, very active UFS and AdvFS

    file systems, the pauses could be frequent and disruptive to other operations

    on the system.


    Smooth sync allows each dirty page to be aged for a specified time period

    before being written out to disk. This allows more opportunity for frequently
    modified pages to be found in the cache, decreasing the overall

    I/O load on the system. In addition, pages are queued to a device only after

    haged sufficiently, rather than being flushed by the update daemon.

    Therefore, caches in which large numbers of dirty pages become

    locked on the device queue are minimized.


    In addition, the I/O throttling feature addresses the problem of locking

    dirty pages on the device queue. It enforces a limit on the number of

    delayed I/O requests on the device queue at one time. The result of this

    constraint is to allow the system to be more responsive to any synchronous

    requests to the device queue. This may also decrease the duration of

    process waits for specific dirty buffers, because pages will continue to

    remain available until placed on the device queue.


    # 9.1.8 General Performance Issues


    There are a few general issues that can affect file system performance,

    regardless of the type of file system. These are as follows:


    +   - Caching. Poor use of one of the system caches can have a negative impact
    on the general performance of file systems. A very badly tuned cache can cause
    a situation known as "cache thrashing" where cache thrashing can cache can cause
    the system to spend so much time managing the cache that very little normal work
    can be accomplished.

    - LSM mirror syncing. If the performance of a file system that resides on an LSM
    mirrored volume seems slow, check to see whether the volume is synchronizing.

    - Hardware problems. On occasion, poor performance of a file system may result
    from an underlying hardware issue that needs to be addressed. Check the error
    log for evidence of hardware errors if there'
  merge: -1
  img_proc: true
