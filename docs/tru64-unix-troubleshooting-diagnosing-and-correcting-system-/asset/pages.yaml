- pgno: 274
  md: '# 10.2 Installing Patches


    Tru64 UNIX uses the dupatch(8) utility to install operating system and TruCluster
    This keeps track of installed patches, checks for patch prerequisites and dependencies,
    and generally makes installing Tru64 UNIX patch a straightforward process. When
    dupatch installs a patched file, it checks the size and checksum of the existing
    version of the file against known values (i.e., it expects the file from the original
    operating system or a previously installed patch). If the size and checksum are
    not as expected, dupatch will display a warning and not install the patch. This
    is done to protect the system against accidental removal of a problem correction
    provided by HP technical support or another source. If a patch was installed manually
    (i.e., without dupatch), then dupatch could supersede the patched file with a
    version of the same file from the patch kit it was installing. The file from the
    patch kit might not include the same problem correction, in which case superseding
    it not be a good idea. On the other hand, the patch kit might include problem
    correction among others, so installing the file from the patch kit would be desirable.


    In such cases, dupatch has no way to tell whether superseding a “manual” patch
    is desirable. As such, it informs the operator of the conflict and will not install
    the conflicting patch until the conflict is resolved. To resolve the conflict,
    use the Baseline/Analysis option from the patch installation menu. This locates
    and displays any patch file conflicts and provides the option to install the patch
    away. It’s a good idea to run the Baseline/Analysis option before attempting to
    actually install a patch kit. If any conflicts are detected, you can determine
    whether or not the previous file should be superseded. Your system log should
    have a record of the previous patch installation and the problem it was intended
    to fix. With this patch kit release notes to see if the fix in question is included;
    if the fix is not, you can choose to go ahead and install the patch. If the fix
    is not included in the new patch kit—or you cannot be sure from the patch documentation—you
    should probably hold off on installing the conflicting patch (and perhaps the
    rest of the patch kit as well). In this situation, it’s a good idea to contact
    HP technical support for further assistance.


    # 10.3 Kernel Configuration


    The Tru64 UNIX kernel includes a wide variety of options and parameters. Options
    are features or capabilities of the operating system (e.g., AdvFS),'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 10.3 Kernel Configuration


    while parameters are values that control or limit system behavior. A typical kernel
    parameter is “maxusers,” which defines the number of simultaneous users that the
    system can support efficiently. (The maxusers parameter is an important one; it''s
    discussed in greater detail further on.)


    An option is included in the kernel by statically building its code into the kernel.
    If the option is not selected, the kernel code that provides the associated capability
    is left out of the kernel. Unnecessary options can be left out of the kernel in
    order to minimize the amount of disk space and physical memory consumed by the
    kernel. However, this is beneficial for older systems that have small root file
    systems or limited physical memory. With newer systems, it''s usually easier to
    include all possible options. The extra disk space and memory consumed are relatively
    insignificant in a modern system.


    Parameter values are also statically built into the kernel. In older versions
    of Tru64 UNIX, rebuilding the kernel with new values was the only way to configure
    parameters. V4.0 introduced a way to configure the kernel dynamically by means
    the sysconfig(8) utility and the /etc/sysconfig file contains parameter values
    that are read by the kernel during system startup; these values supersede the
    static values that were built into the kernel. Thus, changing a parameter value
    no longer requires rebuilding the kernel. Instead, all that needs to be done is
    to modify the parameter value in /etc/sysconfig and reboot the system. The new
    value is read at boot time and immediately takes effect. (Most but not all) parameters
    can be adjusted on a running system without requiring a reboot.


    Configuring the Tru64 UNIX kernel (i.e., modifying the options and parameters)
    is almost always necessary after a new system installation; systems are ideally
    configured out of the box for their allant environment. After a system has been
    in place for a while, kernel configuration is an occasional task whose frequency
    is highly variable. If a system is up and running in a stable situation, you might
    never have to modify the kernel configuration. On the other hand, if you frequently
    add new capabilities or perform a great deal of system tuning, you might need
    to configure the kernel on a daily basis. As discussed previously, there are two
    ways to configure the kernel: statically (rebuilding the kernel) and dynamically
    (using the sysconfig utility and /etc/sysconfig). Each of these methods has its
    own set of potential problems, which are discussed in the following subsections.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 10.3.1 Building the Tru64 UNIX Kernel


    Tru64 UNIX uses the docfig(8) utility to build a customized kernel. The docfig
    utility reads the kernel configuration file to determine the kernel options, parameter
    values, and some hardware configuration information. The kernel configuration
    file is located in directory /sys/conf and has a name of the form HOSTNAME (i.e.,
    the system''s host name in upper case). It''s possible to have multiple kernel
    configuration files in /sys/conf. These can be used to build alternative kernels
    for the system or for other systems.


    In Tru64 UNIX version 5, rebuilding the kernel is necessary when adding new kernel
    options or a new type of hardware (e.g., a I/O adapter not previously present
    on the system). In version 4, it''s necessary to rebuild the kernel when any new
    adapter is added, whether or not an adapter of the same type is already present.
    As mentioned previously, it''s also possible to change the value of kernel parameters
    by rebuilding the kernel. However, dynamic parameter configuration via /etc/sysconfig
    is more convenient than we recommend rebuilding the kernel for this purpose.


    If docfig is invoked with the -c switch, it builds a new kernel from the specified
    configuration file. For example, "docfig -c HOSTNAME" uses configuration file
    /sys/conf/HOSTNAME to build the new kernel. If docfig is specified without -c,
    it first invokes the sizer(8) program to determine the system''s hardware configuration
    and generate a new configuration file, which is used to build the new kernel.
    The docfig utility builds the kernel in a build directory named /usr/sys/HOSTNAME,
    which docfig creates if it doesn''t already exist. There is also a symbolic link,
    /sys/sys/HOSTNAME, which points to /usr/sys/HOSTNAME. The newly built kernel is
    in file /usr/sys/HOSTNAME/vmunix, which must be copied to the root directory (and
    the system reboot) in order to take effect.


    The process of copying the kernel to the root directory is one of the potential
    trouble spots in the kernel build process. In older versions of Tru64 UNIX, copying
    the new kernel to the root directory was usually accomplished by the "mv" command
    (i.e., "mv /sys/sys/HOSTNAME/vmunix") because this has the added benefit of removing
    the kernel from the build directory after copying it to the root directory. In
    version 5, "vmunix" is a context-dependent symbolic link (CDSL) rather than a
    regular file. If the "mv" command is used to copy the new kernel, the vmunix will
    become a regular file, unintentionally removing the CDSL. This is not a significant
    problem for standalone systems, but can cause'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 10.3 Kernel Configuration


    strange problems in a cluster. Therefore, it''s important to use any cp rather
    than mv to move a new version 5 kernel to the root directory.


    If the kernel build fails, there are a couple of generally useful troubleshooting
    techniques. The first involves recreating the temporary build directory in case
    some corruption or inconsistency is present in the files it contains. To do this,
    remove the directory and its contents with `rm -rf /usr/sys/$HOSTNAME` and try
    to build the kernel again. The directory will be automatically recreated and repopulated
    with the correct files. It''s important to remove the root directory (/usr/sys/$HOSTNAME)
    rather than the symbolic link (/usr/sys/$HOSTNAME) that points to the directory.
    In older versions of Tru64 UNIT the build directory, and `rm -rf /usr/sys/$HOSTNAME`
    was the appropriate way to remove it; in version 4 and higher, this command removes
    only the symbolic link rather than the underlying build directory. The next attempt
    to rebuild the kernel restores the symbolic link, but its target is the original
    build directory with its original (and possibly corrupt) contents.


    The second troubleshooting technique is one that we''ve suggested in a number
    of other situations. The defconfig utility is usually a shell script, so it''s
    possible to edit the script file (`/usr/sbin/defconfig`) and add `-x` to the first
    line to order each command line as the script executes. This identifies the command
    that''s executing when a problem occurs, allowing you to focus on the failing
    command. It may be necessary to repeat this process one or more times in order
    to drill down further into the problem.


    Rebuilding the kernel can fail in one of two ways: Either the defconfig command
    never finishes, or it exits with errors. The defconfig normally prints a "Working"
    message every two minutes while the kernel is being built. The build process should
    take no more than 15 minutes—it''s usually much faster on faster (i.e., newer)
    systems. If its running after 20 minutes, it is probably never going to finish.
    This problem is usually caused by the shell trapping signal 15 (SIGTERM), which
    is used by the timer process that prints the "Working" message. If signal 15 is
    trapped, the timer process will not work properly and the kernel build will not
    complete. This is most likely caused by a "trap" command in a shell startup script—for
    example:


    ```

    trap 1 2 3 15

    ```'
  merge: -1
