- pgno: 35
  md: '# 2.2 Troubleshooting Techniques


    What circumstances could prevent I/O errors from being logged? Two possibilities
    surfaced:


    +   - The system''s error logging capabilities were not working.

    - The I/O problem prevented information from being written to the log files.


    The first possibility was quickly eliminated. Regular messages, such as system
    startup and shutdown events, were appearing normally in the logs. In addition,
    the logger(8) command was used to confirm that system logging was working. This
    left the possibility that the I/O problem was affecting the system log files.
    Deducing that this must have occurred to a key insight: virtually all system logs
    are located in the /var file system. If an I/O problem affected /var, rendering
    it inoperable, the log would contain no evidence of the problem. If the problem
    was transient, then the file system might return to normal operation by the time
    the system rebooted, neatly concealing the fact that a problem had occurred.


    At this point, retrograde analysis had produced a plausible explanation of the
    observed symptoms; however, there was no guarantee that it was in fact the true
    explanation. To verify this theory, error logging was redirected to a different
    file system located in a different storage array. This experiment produced some
    real evidence: on the next occurrence of the panic, the new binary error log recorded
    a hard I/O error on the disk containing /var, as well as several other disks in
    the same array.


    The questionable array controller did not have any errors stored in its memory,
    a printer was attached to its console to capture its output. This yielded the
    final piece of the puzzle: the array controller was occasionally rebooting for
    no apparent reason. When this happened, all of the attached storage would go off-line
    until the controller finished rebooting. Replacing the faulty controller solved
    the problem for good.


    In this case, the nature of the underlying problem prevented the system from recording
    any evidence of it. Retrograde analysis made it possible to work backward from
    the final result to deduce what must have occurred. This led to a plausible explanation
    that was verified by experiment, allowing the true cause of the problem to be
    identified and subsequently corrected.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 2.2.5 Circumstantial Evidence


    In legal terms, circumstantial evidence (as fans of courtroom dramas already know)
    is evidence that is not directly related to a fact in question. Instead, it is
    related to other circumstances from which the occurrence of the fact may be inferred.
    For our purposes, this simply means that when there is no direct evidence of a
    problem, it''s a good idea to look for any other evidence that might be useful.
    In particular, investigate any unusual occurrences in the same general area (e.g.,
    storage), whether they happened around the same time. On the other hand, you should
    also check out anything that occurred near the time of the problem occurrence,
    whether or not it happened in the same general area. This is particularly effective
    when the affected system is part of a cluster; in such cases, checking the logs
    on the other members frequently turns up valuable clues.


    An example of this technique occurred in a situation where user logins hung for
    a significant length of time, after which they would usually (though not always)
    fail. The system administrator quickly rebooted the system, hoping that the problem
    would go away. It did, but the administrator was left with the task of explaining
    to his manager why the problem had occurred and preventing it from happening again.
    No useful information was found in the system logs. However, the system was also
    an NFS server, and several of its clients recorded numerous "NFS server not responding"
    messages during the problem period. This information indicated a possible network
    problem on the server. Because the password database was distributed via NIS,
    a network problem could easily make logins slow or impossible.


    With this clue in mind, the server''s network interface was monitored closely.
    This monitoring revealed that the interface was experiencing bursts of errors.
    Replacing the network interface card cured the errors, and no further login problems
    occurred. Without the clues found in the other systems'' logs, there would have
    been no way to troubleshoot this problem, and it undoubtedly have occurred again—much
    to the displeasure of the users, the system administrator, and the manager.


    # 2.3 Troubleshooting Principles


    No matter which techniques you use to troubleshoot a problem, there are some general
    principles that should serve as a framework for your actions. Keeping these principles
    in mind will make your troubleshooting activities smoother and more effective.
    A few of these principles have already been'
