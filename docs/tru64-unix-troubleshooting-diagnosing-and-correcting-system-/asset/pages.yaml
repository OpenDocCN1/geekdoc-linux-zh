    Alternatively, you can simply specify a single file system to check, as in the
    following:


    ```

    # df /

    ```


    Using these techniques, it will be rather easy to find which file system is becoming
    full, so you can take action to correct the situation and possibly prevent even
    occurrences in the future.


    # 9.1.3 Correcting a Full File System Condition


    Once you''ve determined which file system is full, you will need to figure out
    (or who) is filling it up and correct the situation. We''ve already said, the
    df command is the most useful for finding the file system. The set of actions
    needed to correct the problem will vary depending on the type of file system in
    question. In general, we recognize three major categories of file systems on a
    typical Tru64 UNIX system:


    +   1. System file system. If the root, /usr, or /var file systems (or their cluster)
    become full, this can have severe consequences, so it is important to correct
    the problem quickly. A full file system in'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 9.1 Generic File Systems Issues


    this category can cause the system to misbehave or fail to operate altogether.


    +   2. Major application file system. A major application is one that takes all
    or a majority of a file system for its own use. Typically, these are large databases
    or other enterprise applications that cannot be interrupted. Again, a full file
    system can cause the application to misbehave or fail to operate.


    +   3. User file system. A file system containing user directories will move up
    and down in usage (but mostly up) on a regular basis. A full file system condition
    on a user directory will prevent users from creating new files, saving their work,
    or running certain applications.


    These categories can be dealt with in different ways. The possible techniques
    for dealing with full file systems include the following:


    +   Self-policing. This option tends to be used only for user file systems. It
    has the benefit of relieving you from dealing with a full file system situation
    on some file systems. You can set up user file systems as a free-for-all, where
    it''s up to the users to police themselves. If there''s plenty of disk space and
    the users mostly know each other (and behave like adults), this can be a good
    option. When it works, this option certainly prevents phone calls and e-mails
    to the system administrator to correct a full file system situation, except in
    the case where the entire group needs more space; in that case, you may need to
    add more storage or reorganize the file systems. In practice there are always
    users who choose not to delete anything and who eventually end up hogging the
    space. When that happens, you will probably get involved always.


    +   Threats and intimidation. Once this again, the self-policing policy is primarily
    used on user directories. When the self-policing policy fails, this option gets
    you more heavily involved by requiring you to monitor file use and to penalize
    users who take too much space. It is still up to the users to find and remove
    their own files, as in the self-policing method, but you become the enforcer when
    people don''t follow the policy. The amount of success you usually depends on
    the amount of power that the management of the organization allows'
  merge: -1
