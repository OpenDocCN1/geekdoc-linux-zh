  md: 'the network, or it can act as a routing node by forwarding packets on other
    hosts or networks.


    When diagnosing a routing problem on your system, you need to know whether the
    host is an end node or a routing node. An end node would have a simple configuration
    similar to the one discussed in the previous section. A routing node may utilize
    static routing, but it is more likely that a dynamic routing scheme is being used.


    When troubleshooting a routing issue, there are three main issues to consider:


    +   1. Is static routing correct?


    +   2. If dynamic routing is used, has it been configured properly?


    +   3. Is dynamic routing used properly in the framework of the rest of the network?


    "netstat -r" command can be used to verify that routing (whether static or dynamic)
    is correct on the running system. This will display a list of the routes that
    are currently configured on the system, regardless of how they got into the routing
    table. Verify that the static routes (if any) are set up correctly; if they are,
    investigate why they weren''t. If the /etc/routes file is properly configured,
    the static routes should be set up at boot time. Manually installing the route
    commands from /etc/routes and see whether an error is reported. If no error is
    reported and the route is configured, either the route was somehow removed or
    there was a problem when the system tried to set the routes at boot time. Most
    likely, /etc/routes syntax is incorrect and needs fixing. Failing that some kind
    of boot error is at fault. As usual, common sense will dictate what should come
    next in the investigation of the problem. The section on troubleshooting boot
    problems in Chapter 5 for additional information on fixing boot problems.


    Determining whether a dynamic routing daemon is operating correctly is more complicated
    than the static routing case. Once again, the first thing is to check the routing
    table by using the netstat command. If the routes are incorrect, the dynamic routing
    daemon should be checked for proper operation. There are two routing daemons:
    routed and gated. If dynamic routing is being used, one or the other of these
    daemons will be in use, not both. Which of these two is to be depends on the protocols
