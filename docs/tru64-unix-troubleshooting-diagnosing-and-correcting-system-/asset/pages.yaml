    # 5.1.2.3 Kernel Load Failure


    If the osf_boot program is unable to locate the desired kernel file (usually

    vmunix), it will print an error message and go into interactive boot mode.

    This will prompt the operator to enter a new kernel name, for example:


    ```

    Can’t open vmunix

    Enter: <kernel_name> <option_1> <option_2> ... <option_n>

