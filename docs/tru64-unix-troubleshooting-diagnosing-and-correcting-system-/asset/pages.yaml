- pgno: 291
  md: '# System Administration


    > To be really great in little things, to be truly noble and heroic in the insipid
    details of everyday life, is a virtue so rare as to be worthy of canonization.

    —Harriet Beecher Stowe


    In this chapter, we will discuss problems that arise in some of the less common
    areas of system administration—tasks that come up occasionally, but usually not
    on a daily basis. These tasks include the following:


    +   - Software license management

    - Printing

    - Scheduling jobs with the cron facility


    Another way of looking at this chapter is that it includes miscellous bits that
    don''t fit anywhere else.


    # 11.1 Software Licenses


    In most cases, the purchase of any software package (whether it''s an operating
    system or a layered product) requires a license agreement with the software vendor.
    The license agreement defines the terms and conditions under which software package
    may be used legally. System administrators have a twofold responsibility with
    respect to software licenses. First, they must ensure that all license terms and
    conditions are observed. Second, they must perform the license management operations
    needed to install and operate the licensed software.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# II.I.I License Management


    In order to troubleshoot license problems, it''s necessary to understand how Tru64
    UNIX manages licenses. This function is performed by the aptly-named License Management
    Facility (LMF). LMF creates and maintains a database of license information, which
    is stored in the file /var/adm/lmf/ldb. The Tru64 UNIX operating system and most
    layered products contain license-checking functions. These functions interact
    with the license-base to verify that the software is properly licensed for the
    system on which it is running.


    Most products that run under Tru64 UNIX are licensed by either an activity license
    or an availability license. An activity license (also called a per-user license)
    limits the number of users who can use a product simultaneously by requiring a
    certain number of license units for each unit. On the other hand, an availability
    license (capacity license) provides unlimited access to a software product whose
    license has been registered and loaded on a particular system. For some licenses,
    different models of hardware require different numbers of license units to allow
    a product to run. In general, the more powerful the hardware, the more license
    units are needed to run a product. License unit requirement tables (LURTs) specify
    how many license units are needed to run a product on a particular model of hardware.


    Although there are a plethora of licenses that may be installed on your system,
    there are two of particular concern for all Tru64 UNIX installations: OS-BASE
    and OSF-USR. OS-BASE is an availability license that grants the right to run the
    Tru64 UNIX operating system on a particular system. A Tru64 UNIX system without
    a valid, active OS-BASE license can still operate, but with limited functionality.
    Among other restrictions, the root user can log in, and only from the system console.


    The number of units required for a valid OS-BASE license depends on the type and
    number of processors in the system, all the way to 12 units for some of the smaller
    systems up to 6,000 units for a fully loaded (32 CPU) AlphaServer GS320. The LURT
    for OS-BASE, showing the required number of units for all Alpha systems, can be
    found at the followingURL:


    ```

    http://www.compaq.com/products/software/refmat/swl_alpha.html

    ```


    Tru64 UNIX also accepts the UNIX-SERVER license as an alternative to OS-BASE;
    however, the UNIX-SERVER license is rarely (if ever) seen in practice. By themselves,
    both OS-BASE and UNIX-SERVER allow'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# II.1 Software Licenses


    logins only by the root user; for nonprofit users to log in, the OSF-USR license
    is also required. OSF-USR is an activity license that allows a specific number
    of non-root users to log in and use the system. Both licenses (OSF-BASE and OSF-USR)
    must be active for nonprofit users to use the system.


    OSF-USR requires 100 units for each nonprofit user (e.g., a four-user license
    contains 400 units). As with other parameters in UNIX, a value of zero indicates
    an unlimited amount, so an unlimited OSF-USR license contains 0 units. Tru64 UNIX
    comes with an implicit four-user (400-unit) OSF-USR license that can be used if
    a larger license is not purchased.


    It is also possible to have a UNIX-WORKATION license instead of OSF-BASE and OSF-USR.
    This license combines the functions of OSF-BASE and OSF-USR. It grants the right
    to run Tru64 UNIX on a workstation system and have two nonprofit licenses. Like
    the UNIX-SERVER license, UNIX-WORKSTATION is rarely seen in practice.


    Some components of the operating system provide basic functionality without an
    additional license, but contain advanced features that are available only when
    a license is present. For example, AdvFS is provided as part of Tru64 UNIX, and
    AdvFS file systems can be created and used without an additional license. However,
    advanced AdvFS features, as multvolume domains, require the ADVFS-UTILITIES license.
    Similarly, basic LSM functionality comes with the operating system, but advanced
    features such as striped or RAID-5 require the LSM-OA license.


    # II.1.2 Troubleshooting License Problems


    Most license problems surface when a license-dependent function suddenly stops
    working. In many cases, an informative error message is generated. For example,
    the following message at boot time indicates that a valid OSF-BASE license wasn''t
    loaded:


    > Can''t find an OSF-BASE, UNIX-WORKSTATION, or UNIX-SERVER license PAK


    However, some license problems aren''t quite as obvious. A nonroot user attempting
    to log in may be denied access with the following error message:


    Too many users logged on already. Try again later.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 11.1 Software Licenses


    This lmf indicates that there aren''t enough OSF-USR units available for another
    login. This may or may not actually be a problem. There might be a problem with
    the OSF-USR license, or it could be that the maximum number of licensed users
    is already logged in. In the latter case, the license is functioning as intended
    and the user is just out of luck until somebody logs out.


    The most important tool for troubleshooting license problems is the lmf(8) command.
    When a license appears, the first step is to use the "lmf list" command for a
    quick look at the status of the license; for example, if a problem with the OSF-USR
    license is suspected:


    ```

    # lmf list | egrep ''OSF-USR|Product''

    Product         Status      Users: Total  Active

    OSF-USR         active      4

    ```


    The above output indicates that the OSR-USR license supports a total of four nonresident
    logins, of which one is currently in use. The license has a status of "active",
    which is the desired state. A status of "enabled" or "terminated" indicates a
    problem.


    To get more detailed information about a license, use the "full" option with the
    "lmf list" command. For example:


    ```

    # lmf list full for OSF-USR

    Product Name: OSF-USR

    Producer: DEC

    Issuer: DEC

    Authorization Number: UNIX-SERVER-IMPLICIT-

    Number of units: 400

    Version:

    Product Release Date:

    Key Termination Date:

    Availability Table Code:

    Activity Table Code: CONSTANT=100

    Key Options:

    Product Token:

    Hardware-Id:

    License status: active

    Cancellation Date:

    Revision Number: 0

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# II.1 Software Licenses


    # 281


    Comment:

    Cache Total Units: 400

    Activity Charge: 100

    Usable Units: 300


    The above example shows the four-user implicit license that comes with the operating
    system. The availability code field indicates that 100 units are needed for each
    user. The user has a total of 400 units (four users), of which 100 units are currently
    charged for one login. There are 300 usable units remaining, indicating that three
    more nonroot users could log in at the same time. (The user limits the number
    of simultaneous logins, not the total number of accounts on the system.) The “Key
    Termination Date” field is empty, indicating that the license will never expire.
    Depending on the terms of it, it may may not have a termination date.


    When a license has a status of “terminated,” it means that the license has expired.
    Check the termination date with the “Imf list full” command. If the termination
    date is indeed past, it’s time to get a new license. On the other hand, if the
    termination date is in the future, check the system date; it’s possible that the
    date has accidentally been set to sometime in the future. After correcting the
    date, enter the “Imf reset” command to activate the license. The reset option
    instructs LMF to rescan the license database and load the appropriate licenses
    into the kernel’s license cache.


    If a license status is “enabled,” it is possible that the license has not been
    loaded into the kernel cache. The first thing to try is the “Imf reset” command.
    This will either activate the license—solving the problem—or produce an informative
    error message, such as “Not enough units to load OSF-BASE.”


    If no licenses are activated, there’s most likely a problem with the license database
    file. Make sure the /var file system (or the user file system, if /var is part
    of /usr) is mounted and file /var/adm/imf/ldb is accessible. If the database file
    is missing, restore it from a recent backup and enter the “Imf reset” command.
    If the file is present, but has however corrupted, Imf will usually detect this
    and display an error message indicating that the file is corrupt. In this case,
    rename the corrupt database to a different name, such as “ldb.db,” and restore
    the file from backup.


    Insufficient units can be a problem for both OSF-BASE and OSF-USR. When this problem
    arises with OSF-BASE, check the number of units for “Imf list full.” Compare this
    with the LURT (at the URL listed in section 11.1.1) to verify that you have enough
    units for your system configuration.


    Chapter II'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'If you don''t have enough units, there are several possibilities. If you''ve
    upgraded your system to a newer model and used the license present on the older
    system, the old OSF-BASE license may not have enough units for the new system.
    In this case, you''ll need to purchase additional OSF-BASE units.


    Another possibility is that you''ve increased the number of processors by the
    system adding CPUs or reconfiguring a partitioned system. The LURT shows, multiprocessor
    systems generally require additional OS-BASE units for each CPU added to the system.
    If you''ve added a new CPU, you also need to install an additional license (which
    usually comes with the new processor) in order to provide the necessary units.


    If you don''t have the additional license on, it''s possible to disable the additional
    CPU(s) temporarily until the license can be enabled. This can be done by changing
    the value of the console variable CPU_ENABLED, which is a bit mask specifying
    which processors. Setting bit 0 enables CPU 0, 1 enables CPU 1, and so on. The
    default of CPU_ENABLED is FFFF or FFFFFFFF (hexadecimal)—that is, all bits set,
    indicating that all CPUs are enabled.


    For example, adding a third processor to a two-CPU AlphaServer ES45 requires an
    additional 50 units of OSF-BASE. If the additional license is not available, booting
    the system with all CPUs enabled would result in the “Can''t find OSF-BASE” error
    message, and system functions would be severely limited. To workaround this problem
    until the additional license becomes enabled, the third CPU could temporarily
    be disabled by setting CPU_ENABLED to a value of 3. This value has only bits 0
    and 1, so the system would use only those two CPUs. After the additional license
    is obtained and installed, CPU_ENABLED would need to be reset to its default value
    in order to enable the new CPU.


    When there are insufficient units for OSF-USR, the problem is usually related
    to the implicit user license: either it is active when it shouldn''t, or it''s
    not active when it should be. Licenses of the same type can be combined in order
    to use all of their units. For example, in the situation above, a 50-unit OSF-BASE
    license could be combined with an existing 100-unit license to provide the 150
    units needed for a three-CPU AlphaServer ES45. The same is true of user licenses:
    a 12-user license might actually be issued as an 8-user and a 4-user license,
    which would combine to provide the necessary 1,200 units of OSF-USR. Multiple
    licenses of the same type are easily detected by piping “Imf list” to the grep
    command, as shown previously in this section.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# II.1 Software Licenses


    Problems can arise because the implicit four-user license is intended for situations
    in which it''s the only user license needed, so it may not combine with other
    OSF-USR licenses. As a result, the implicit user license accidentally becomes
    activated, it may override the other user licenses in the database. This can be
    quite disconcerting when the system contains an unlimited user license, but allows
    only four simultaneous logins! If fewer logins than expected, use the following
    command to examine all of the OSF-USR licenses on the system:


    ```

    # lmf list full for OSF-USR | more

    ```


    If multiple licenses are present, check their Authorization Number fields. If
    one contains "UNIX-SERVER-IMPLICIT-USER," it’s the implicit license. Try deleting
    this license (it can be recreated if necessary) with the following commands:


    ```

    # lmf delete OSF-USR DEC UNIX-SERVER--IMPLICIT-USER

    # lmf reset

    ```


    This should remove the license conflict and resolve the problem.

    The opposite problem exists when the implicit license is the only user license
    on the system, but it’s not active. In this case, "lmf list" to determine whether
    the license is present (enabled), but has not been activated. If so, the "lmf
    reset" command should cure the problem. However, if the license isn’t present,
    it can be recreated and activated with the following commands:


    ```

    # /sbin/it.d/bin/load_usr_pak

    # lmf reset

    ```


    The load_usr_pak script creates a new implicit user license. Prior to Tru64 UNIX
    version 4.0, the equivalent script was /sbin/it.d/bin/twouser. As the script name
    implies, the implicit license allowed only two logins in early versions of Tru64
    UNIX.


    One other problem worth mentioning can occur while registering a new license.
    License information is frequently provided in the form of a product authorization
    key (PAK). The information on the PAK must be manually entered with the "lmf register"
    command. If the error message "Checksum does not validate" occurs, make sure that
    you entered all the'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'information on the PAK exactly as it appears; the information is case sensitive.
    If this does not resolve the problem, contact the license provider.


    # Before you call support


    Before calling technical support for a license problem, check the following:


    +   - Use "lmf list" to check the status of the problematic licenses.

    - Try "lmf reset" command.

    - Verify that the license database (/var/adm/lmf/ldb) is accessible. If it''s
    missing, restore it from a recent backup.

    - For OSF-BASE license problems, verify that you have at least the required number
    of OSF-BASE units for your system configuration.

    - For OSF-USR license problems, check the implicit user license. If the implicit
    user license is active when it shouldn''t, delete it. If the implicit user license
    should be active but isn''t, recreate it.


    # 11.2 Printing


    There are a number of ways that printing can be implemented on a Tru64 UNIX system.
    These include the following:


    +   - Traditional (BSD-style) UNIX printing

    - Advanced printing software (APS)

    - System V printing


    Of these three methods, we''ll discuss only the first, BSD-style printing. APS
    is a separately licensed layered product, while System V printing is used only
    with the System V extensions available in Tru64 UNIX versions 4 and earlier.


    In Tru64 UNIX, printers can be categorized by their connection type as follows:'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 11.2 Printing


    +   - Local printers are connected directly to a system''s parallel or serial
    port.


    +   - Remote printers are directly connected (i.e., local) to another host on
    the network.


    +   - Network printers are connected directly to the network with their own network
    interface cards.


    The appropriate troubleshooting techniques for a printing problem based on the
    printer''s connection type. We''ll cover each type in its own sub-: first, however,
    we''ll discuss some general principles for troubleshooting printing problems regardless
    of the connection type. We''ll also put in a recommendation for some further reading.
    The Tru64 UNIX System Administration Manual contains some excellent information
    in its chapter on administering print services.


    # 11.2.1 General Printer Troubleshooting


    The initial step in troubleshooting a printing problem is isolating the problem
    to the area in which it is occurring. There are three possible areas to consider:


    +   1. The printer itself

    2. The UNIX printing subsystem

    3. The connection between the printer and the UNIX system


    285


    The first thing to check is whether the printer itself is operational. If you
    have physical access to the printer, check its indicator lights to determine whether
    the printer is powered on, is on-line, and contains paper of the proper size.
    If so, try the printer''s self-test function. If no test page appears, something
    is wrong with the printer, and you should consider its operating manual or built-in
    diagnostics.


    Assuming the printer self-test works, the next step is to try sending something
    to the printer from a different host or by an alternative method. For locally
    connected printers, the best way to do this is to send a short ASCII file directly
    to the interface port, bypassing the UNIX subsystem. For example, to send a file
    to a printer connected to the parallel interface port:


    Chapter II'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 11.2 Printing


    ```

    # cat /etc/motd > /dev/lp0

    ```


    For PostScript™ printers, you may need to pipe the file through a print filter
    on the way to the printer. To send a file to a PostScript printer connected to
    the first serial port:


    ```

    # cat /etc/motd | /usr/lbin/ln03rof > /dev/tty00

    ```


    If the file prints, it verifies that both the printer and the printer-host connection
    are working. The problem is isolated to the UNIX printing subsystem.


    For remote network printers, try something from a different host on the network.
    If this is successful, it verifies that the printer is operational; however, if
    it doesn''t, the problem could be with either the printer or the connection to
    it (i.e., the network). If the printer is remote and you have sufficiently privileged
    access to its host system, you can also troubleshoot it as a local printer from
    that host.


    Once you''ve verified that the printer can print a test page, start looking at
    the UNIX printing subsystem. Begin by checking the printer log files for errors
    or other informative messages. The primary printer log file is /var/adm/syslog.dated/current/lpr.log,
    which logs messages from the printer daemon, lpd(8). In addition, an error log
    file for an individual printer may optionally be specified in the printer configuration
    file, /etc/printcap. For example, in the following sample printcap entry for printer
    "lp0," the error log file is specified by the "lf" field—this case, /var/adm/lp0err.


    ```

    lp0|unix.ln17a.ascii:0|lp1|lp0|lpr0:

    :lf=/var/adm/lp0err:\n:lp=@unln17a/tcpprnt:\n:if=/usr/lbin/ln03rof:\n:of=/usr/lbin/ln03rof:\n:tcp=\n:mc#20:\

    :mx#0:\

    :pl#66:\

    :pw#80:\

    :sd=/var/pool/lpd0:

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 11.2 Printing


    Please note that the foregoing example shows only a small subset of the many possible
    fields in /etc/printcap. See the printcap(4) reference page for information on
    all of the available options.


    If the printer log files dont yield any clues, make sure that the printer daemon
    is running. Use the following command to check for lpd processes on the system:


    ```

    # ps aux | grep lpd | grep -v grep

    ```


    One or more lines of output indicate that the daemon is running. Multiline lines
    are not a problem; lpd forks a copy of itself for each print job, so there will
    be one additional lpd process for every print job "stuck" in a print queue. However,
    if the above command doesnt indicate any running lpd processes, the daemon needs
    to be restarted. This can be done with either of the following commands:


    ```

    # /usr/bin/lpd [-l]

    # /sbin/init.d/lpd start

    ```


    Even if lpd is already running, it may be worthwhile to restart it in the daemon
    or one of its child processes is hung. To restart lpd:


    ```

    # /sbin/init.d/lpd stop

    # /sbin/init.d/lpd start

    ```


    # Troubleshooting Tip


    Starting the printer daemon (/usr/lbin/lpd) with the -l switch causes it to log
    all print requests over the network. This can be useful for troubleshooting problems
    with remote printers.


    If lpd is running, use the lpc utility to check the status of a particular printer
    and its print queue:


    ```

    # lpc status lpd0

    lpd0:


    printer is on device ''/dev/tty00'' speed 9600

    ```'
  merge: -1
  img_proc: true
