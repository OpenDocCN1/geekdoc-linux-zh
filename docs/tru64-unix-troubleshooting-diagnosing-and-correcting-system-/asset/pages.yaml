    # 8.3.2 Volumnotify


    One potential problem with LSM is that in most cases, it works too well. For example,
    you may discover that a mirrored volume has contained a failed disk for some unknown
    amount of time. LSM simply did its job more or less silently, perhaps only writing
    a message to the error log, and the system kept running normally. It is for these
    situations that the watch and notify facilities were designed. They work together
    to inform you of events and problems that occur with LSM.


    +   - smartwatch(8) is a script that monitors LSM, waiting for exception events
    to occur. It sends e-mail to the root user (by default) or to those users specified
    on the command line.

    - volnofify(8) is a utility that displays events related to disk and configuration
    changes as managed by the LSM configuration daemon. volnofify displays requested
    event types until it is killed by a signal, or a specified number of events have
    been received, or a specified period has passed.


    # 8.3.3 RAID


    LSM implements RAID at a software level in order to provide increased storage
    redundancy and performance. For critical data, we recommend implementing RAID
    on the storage located under those file systems. In most cases, hardware-based
    RAID will perform better than software RAID, such as LSM, but the cost tends to
    be significantly higher.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'The RAID levels supported by LSM are the following:


    +   RAID 0—Also known as striping, RAID level 0 is not redundant, hence it does
    not truly fit the RAID acronym. In level 0, data is distributed across drives,
    resulting in higher data throughput. Because no redundant information is stored,
    performance is very good, but the failure of any disk in the array results in
    data loss.


    +   RAID 1—RAID level 1 provides redundancy by writing all data to two or more
    drives. The performance of a level 1 RAID array tends to be faster on reads and
    slower on writes compared with a single drive, if either drive fails, no data
    is lost. This is a good entry-level redundant system, because only two drives
    are required. On the other hand, because the data is completely duplicated, the
    cost per megabyte is high. This level is commonly referred to as mirroring.


    +   RAID 0+This level was never referred to in the original Berkeley paper, but
    it is a combination of mirroring and striping and provides complete redundancy
    along with the performance benefit of striping for each copy of the data. The
    cost per megabyte for this level is the same as for RAID 1, but the performance
    tends to be better.


    +   RAID 5—RAID level 5 is similar to RAID 0 but adds an extra disk and distributes
    parity among the drives to gain redundancy. Redundancy is provided at a cost that
    is only slightly higher than RAID 0, but with a performance penalty.


    # 8.3.4 Correcting a Failed LSM Drive


    When a drive under LSM control fails, it is necessary to put a new disk in place
    to replace the failed drive. However, when LSM is involved, there''s a little
    more to just replacing the broken drive. The following steps describe the process
    of replacing a failed drive in LSM:


    +   Put a new label on the disk, and, if possible, recover the old disk label.
    If you don''t have the label saved in a file (doing so is a good practice), see
    if you can find another drive of the same type used in the same way in LSM and
    copy its disk label to the new drive.


    +   Remove old references to the failed drive (as shown in “voldisk list”) using
    the “voldisk rm” command.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - Initialize the private region of the new disk using the “voldisk -f init”
    command.


    +   - Reconnect the failed drive with its old media name with the “voldg -k adddisk”
    command.


    +   - If the disk was in a mirrored volume, the plexes will not be in sync at
    this point. Allow the plexes to resynchronize with the “volcover -sb” command.


    The problem was not a totally failed drive but simply a transient failure so that
    the drive itself is still good, then use the following steps to recover it:


    +   - Put the LSM disk back on-line using the “voldisk online” command.


    +   - Reconnect the drives to their disk media names with the “voldg -k adddisk”
    command.


    +   - Resynchronize the mirrored volumes using the “volrecover -sb” command.


    # 8.3.5 Failure of the Volume Configuration Daemon


    The volume configuration daemon (vold) is a critical component of the LSM architecture.
    This daemon must be running at all times to respond to requests for configuration
    changes and to gather information about the status of LSM. Problems with the daemon
    do not necessarily mean that there is anything wrong with the volumes and data
    under LSM control. However, if the daemon fails to respond or exits for some reason,
    there is a serious problem that must be addressed. If your LSM configuration has
    been correctly set up and running for some time, the first symptom of a problem
    may be an error from one of the LSM commands.


    ```

    # voldisk list

    lsm:voldisk: ERROR: IPC failure: Configuration daemon is not accessible

    ```


    If you receive such an error, check the health of the daemon with the following
    command:'
