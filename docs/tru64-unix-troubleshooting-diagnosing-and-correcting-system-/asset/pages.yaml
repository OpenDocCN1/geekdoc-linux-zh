- pgno: 123
  md: 'If the disk was previously in use by another operating system such as Linux,
    older versions of the disklabel command may not be able to write a new label on
    the disk. In this case, reformatting the disk with the SCSI CAM utility (scu)
    will solve the problem. (Be aware, that it also destroys all data on the disk.)
    To reformat a disk with scu, enter the following command:


    ```

    # scu -f /rdisk/disk0c [substitute the appropriate disk name]


    scu format

    scu quit

    ```


    After writing (and editing, if necessary) the disk label, halt the system and
    try booting from the problem disk. If it still fails, the most likely explanation
    is that the disk''s primary or secondary bootstraps have corrupted. To restore
    the bootstraps, boot the system from CD-ROM and escape to the shell prompt. Use
    the following two commands to write new blocks on the disk:


    ```

    # disklabel -r dskl > /tmp/label

    # disklabel -Rrt advfs dskl /tmp/label rzxx

    ```


    The first command reads the label and stores it in file /tmp/label. (This file
    is writable when booted from CD-ROM, because /tmp is a memory file system in this
    situation.) The second command writes the label from the file back onto the disk,
    but adds the appropriate bootstrap blocks for AdvFS root system. If the root file
    system is UFS, substitute “ufs” for “advfs” in the command. This command sequence
    does not affect existing data on the disk. Only the label is written, and the
    partition sizes and offsets are not changed because the existing partition table
    is copied to the disk.


    After writing new blocks on the disk, halt the system and try booting from the
    disk. If this still fails, the error message will most likely have changed to
    “Can''t open osf_boot” or “Can''t open vmunix.” These possibilities are discussed
    in the following two sections.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 5.1.2.2 Inability To Open osf_boot


    The message “Can’t open osf_boot” indicates that the secondary bootstrap loader
    is unable to load the osf_boot program, which is used to load the kernel file.
    There are several possible causes of this error:


    +   - An attempt was made to boot the wrong disk (one that isn’t bootable).

    - The root file system (or entire boot disk) has been corrupted.

    - Just the osf_boot file is missing or corrupted.

    - The disk’s primary and secondary bootstrap are for the wrong file system type
    (UFS bootstraps when the root file system is AdvFS, or vice versa).

    - The disk’s boot blocks have been destroyed or corrupted.


    Enter the following command at the console prompt:


    ```

    >>> SHOW BOOTDEF_DEV

    ```


    Verify that BOOTDEF_DEV is pointing to the correct boot disk. If it is boot the
    system from an alternative disk or CD-ROM and try to verify the boot disk’s label
    as described in section 5.1.2.1.


    If the disk has a good label (after you’ve written a new label), the next step
    depends on whether the disk has ever successfully booted or whether it’s a new
    boot disk (e.g., a restoration from backup following a boot disk or root file
    system failure). In the latter case, the most likely explanation is that the disk’s
    boot blocks are for the wrong file system type. This is particularly likely if
    the root file system is AdvFS, because the disklabel command uses UFS boot blocks
    by default. To correct this, rewrite the disklabel using the correct boot blocks.


    ```

    # disklabel -r dsk1 > /tmp/label

    # disklabel -Rrt advfs dsk1 /tmp/label rxxz

    ```


    If the root file system is UFS, substitute “ufs” for “advfs” in the second command.
    Halt the system and try again to boot from the problem disk.'
  merge: -1
  img_proc: true
