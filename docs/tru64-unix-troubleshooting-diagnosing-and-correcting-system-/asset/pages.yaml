  md: 'is any unexplained file system performance problem. The system could be using
    resources logging the errors, which doesn''t leave as much time available for
    normal activities.


    The authors are all too familiar with complaints from system users who simply
    state, “The system is slow.” This kind of response is not quantified and virtually
    impossible to troubleshoot without additional information. More investigation
    is required in order to determine what “slow” really means. It is important to
    get an idea of the slowness. Is the system 10 percent, 50 percent, or 100 percent
    slower than before?


    It is also helpful to get the user to quantify the problem with a time frame:
    When did the slowness start, and is it a temporary or permanent problem? Is performance
    better or worse at some times or others? In order to answer these questions, it
    is useful to employ a tool such as collect, which we discussed in Chapter 3. The
    tool can be set up to gather system performance statistics in an ongoing fashion
    so that, over a time, record of historical data can be obtained. The record can
    be used to compare recent performance with past performance to help pinpoint when
    the issue arose.


    # 9.2 AdvFS


    In this section, we are concerned with problems specific to the Advanced File
    System. AdvFS is a complex and powerful file system with features that make it
    extremely useful for critical production systems. For example, the clone feature
    is ideal for sites that cannot afford to take a file system off-line to perform
    backups. Because AdvFS is heavily relied on, it is critical to understand and
    correct file system problems quickly.


    AdvFS includes some very good facilities and tools to help with trouble-shooting,
    correction, and repair of problems. Our main areas of concern with respect to
    troubleshooting AdvFS are the following:


    +   - AdvFS I/O errors

    - Domain panics

    - AdvFS-specific error messages

    - File system corruption

    - Missing or incorrect volumes

    - Performance issues'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 9.2.1 AdvFS I/O Errors


    AdvFS I/O errors are a special logging feature of AdvFS that lets you know a problem
    has occurred on one of the file systems. The error messages include information
    to help you figure out what the cause of the problem was. These messages are sent
    to the syslog daemon, so they typically appear in the /var/adm/messages file.
    An example of an AdvFS I/O error seen on a real system is the following:


    ```

    AdvFS I/O error:

    Domain#Fileset: CCS_domain#CCS

    Mounted on: /usr/CCS

    Volume: /dev/vol/rootdg/CCSol

    Tag: 0x00007477.8001

    Page: 90

    Block: 21373444

    Block count: 32

    Type of operation: Write

    Error: 5

    ```


    To obtain the name of the file on which the error occurred, type the command:


    ```

    # /sbin/advfs/tag2name /usr/CCS/.tags/29815

    ```


    As you can see, this message indicates that a problem was discovered when performing
    a write operation on a domain called CCS_domain. The specific problem was encountered
    with an errno of 5 (which as we discussed in Chapter 3) indicates that an EIO
    or I/O error was returned to the application.


    # Troubleshooting Tip


    The users of the system may not always let you know that they received one of
    these errors because they may not realize that it was a system error. Therefore,
    we suggest you check the messages file with an automated script that runs each
    night. This is one way to be proactive so you can take immediate action in case
    a disk or other hardware has begun to fail.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Troubleshooting Tip


    AdvFS I/O errors usually correspond to hardware events, as in the example shown.
    Therefore, if you examine the binary error log file around the time period as
    the I/O error occurred, you will most likely find more helpful information about
    the root cause of the problem. A bad block replacement (BBR) is a typical disk
    error that can lead to an AdvFS I/O error.


    # 9.2.2 Domain Panic


    If an AdvFS file system encounters an error so severe that it is no longer considered
    safe to continue using the file system, the system will take the file system off-line
    rather than continue with a potentially unsafe condition. This event is known
    as an AdvFS domain panic. A domain that has entered this state will no longer
    be accessible to users, but will still show as mounted. The system typically logs
    a domain panic to syslog; it will appear in the messages file with an entry similar
    to the following:


    ```

    AdvFS Domain Panic; Domain var_domain Id

    032e4e8d9.00073ce00

    ```


    In logging to syslog, the domain panic message will also be logged to the binary
    error log file. Ways to examine this file are discussed in greater depth in Chapter
    3 of this book.


    If a domain panic occurs on your system, you will need to deal with the situation
    quickly to get your data back on-line as quickly as possible. To recover from
    a domain panic, perform the following steps:


    +   Use the mount command with no options to obtain a list of all the filesets
    in the domain. Then use the umount command to unmount all of these filesets in
    preparation for using the verify utility on the domain. Keep in mind that the
    filesets in a domain must be in the unmounted state in order to run the verify
    utility that checks them. [For more information, see the restrictions noted in
    the verify(8) reference page.] If umount fails because files are still open on
    the file system, use fuser to clean these up to allow the mount to succeed.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 9.2 AdvFS


