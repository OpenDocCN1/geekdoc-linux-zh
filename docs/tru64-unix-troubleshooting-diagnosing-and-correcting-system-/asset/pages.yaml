- pgno: 115
  md: '# System Failures


    > It does not matter how slowly you go, so long as you do not stop.

    —Confucius


    One of the first principles that we introduced back in Chapter 2 was that problems
    vary in their severity and their range of effect. In this chapter, we''ll discuss
    problems that are at the high end of both scales: system failures that take an
    entire system out of commission until corrected. These problems can be divided
    into three principal classes:


    +   1. Boot failures

    2. System crashes

    3. System hangs


    The following sections discuss each of these kinds of failures and how to go about
    troubleshooting them. In some cases, the underlying problem turns out to be in
    another area (e.g., storage) that is discussed elsewhere in this book. In these
    cases, the techniques presented in this chapter should least take you to the point
    of identifying the underlying problem area, at which you can turn to the appropriate
    chapter.


    # Boot Failures


    A system that won''t boot can be frustrating and difficult to troubleshoot. The
    troubleshooting tools that come with Tru64 UNIX require (not reasonably) Tru64
    UNIX to be up and running. The troubleshooting capabilities-'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 5.1 Boot Failures


    ties available at the console firmware level are much more limited in scope. In
    many cases, a trial-and-error approach is necessary to determine the cause of
    the problem. However, by approaching the problem systematically, it''s usually
    possible to isolate the cause and begin correcting the problem.


    In this section, we consider failures that happen when booting from a disk (using
    a CD-ROM) or a disk-based storage set (e.g., a RAID-5 set). Tru64 UNIX can also
    be booted over a network using datac management services (DMS) or from a bootable
    tape created with the btcreate(8) command. Neither of these last two options are
    commonly employed; the vast majority of boot problems occur when booting from
    disk.


    In general terms, a system can fail to boot in four ways:


    +   1. It gets an error message and returns to the console prompt (i.e., crashes
    during the boot sequence).

    2. It loops trying to boot, then crashes, tries to boot again, etc.

    3. It displays an endless series of error messages until interrupted.

    4. It hangs at some point in the boot sequence and never continues.


    Each of these situations is discussed individually, but first here are some general
    workarounds suitable for all boot problems.


    # 5.1.1 General Workarounds for Boot Problems


    In any boot problem, there are certain standard procedures that frequently help
    to work around the problem and get the system up and functioning. These procedures,
    which are listed below, may also help to isolate the problem. They don''t need
    to be tried in the order shown, although the items further down in the list require
    that the system be booted to single-user mode. Also, some of the items may not
    be useful in all circumstances. Following list should not be considered a checklist,
    but rather a list of possibilities from which you can choose the procedures appropriate
    to your situation.


    +   1. Try power-cycling the system and attached storage.

    2. Try booting from genvmux or an alternative kernel.'
  merge: -1
  img_proc: true
