    the ttys file itself be corrupted. In that case, restore the latest version from
    backup and try the convauth command again. If you don''t have a good backup of
    this file, you can use the prototype file “.new..ttys” to create a new database:


    ```

    # mv ttys ttys.old

    # cp .new..ttys ttys

    # convauth -dt

    ```'
