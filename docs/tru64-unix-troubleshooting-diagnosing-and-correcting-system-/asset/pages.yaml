  md: '# 3.1 System-Level Error-Reporting Facilities


    auth.info;syslog.debug /var/adm/syslog.dated/syslog.log


    Finally, an asterisk (*) may be specified in place of a facility, indicating that
    messages generated by all parts of the system are to be logged. All messages of
    the specified severity and greater will be logged:


    *.emerg *


    A Tru64 UNIX–facility.severity pair is msgbuf.err. This facility.severity pair
    is crucial for recovering any messages that may be pending in the kernel syslog
    buffer in the event of a system crash. When a Tru64 UNIX system recovers from
    a system crash, any messages recovered are placed in the file specified as the
    msgbuf.err destination in the syslog.conf file. When syslog starts, it looks for
    this file. If the file exists, syslog processes any messages contained within
    and then deletes the file. The default syslog.conf entry to provide this functionality


    ```

    msgbuf.err /var/adm/crash/msgbuf.savecore

    ```


    The second half of a syslog.conf entry specifies the destination where syslog
    will log the messages that match the facility.severity criteria defined by the
    first half of the syslog.conf entry. There are four possible destinations for
    messages:


    +   1. A file name that begins with a leading slash character (/). The syslog
    daemon will append messages to this file. Note that this can be either an ordinary
    file or a device-special file as /dev/console, which causes all messages sent
    to this destination to appear on the system console.

    2. A host name preceded by an "at" (@). Appropriate messages are forwarded to
    the syslog daemon on the named host (if the named host''s /etc/syslog.auth permits
    it). The named host must have a record in its /etc/syslog.auth if it is to receive
    these messages.

    3. A comma-separated list of users. Appropriate messages are written to those
    users if they are logged in.

    4. An asterisk (*). Appropriate messages are written to all users who are logged
    in.'
