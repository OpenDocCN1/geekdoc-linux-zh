- pgno: 158
  md: '# Before you call support


    Before calling technical support for a system crash or hang, try the following:


    +   - For repeated problems, try undoing any recent changes (adding hardware,
    using a new kernel, etc.) and see whether that resolves the problem.

    - If the problem is so severe that the system won''t stay up, try the troubleshooting
    ideas for boot problems listed in section 5.1.

    - For an apparently hung system, try logging in as root at the system console.
    It may be that the problem is limited to network access.

    - Don''t reset a hung system without first forcing a crash dump.

    - Check the console firmware version and verify that it''s compatible with the
    version of Tru64 UNIX that you''re running.

    - If you''re going to send a crash dump (forced or otherwise) to technical support,
    run “sys_check -escalate” to collect the necessary files into a single package.
    See Chapter 3 for more information on using the sys_check tool.'
