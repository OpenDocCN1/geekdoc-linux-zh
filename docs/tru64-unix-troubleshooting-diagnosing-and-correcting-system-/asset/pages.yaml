- pgno: 265
  md: '# System Configuration


    > To build may have to be the slow and laborious task of years. To destroy can
    be the thoughtless act of a single day.


    > —Sir Winston Churchill


    In the previous chapters, we''ve discussed problems that generally arise during,
    everyday system usage or common system administration tasks. In this chapter,
    we''ll look into problems that occur when performing some relatively infrequent
    activities—those involved in setting up and configuring a Tru64 UNIX system. Specifically,
    these activities include the following:


    +   * Installing or upgrading the operating system

    * Installing patches

    * Configuring the kernel

    * Setting the system timezone


    A typical system administrator might never have to perform some of these tasks.
    Because they are relatively infrequent activities, there is generally less less
    troubleshooting information available concerning them (e.g., from Internet sources).
    We hope to address this lack of information by describing common problems and
    troubleshooting techniques for these areas in the following sections.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Installation Problems


    Tru64 UNIX has two principal forms of installation: full installation and update
    installation. Full installation does just what the name implies. It installs a
    new copy of the operating system from scratch. Update installation, on the other
    hand, upgrades an existing system to a later version of the operating system while
    preserving existing file systems, user accounts, and other aspects of the system
    configuration. There is also a third form of installation called cloned installation,
    which replicates an installation onto multiple similar systems. Cloned installation
    is not widely used, so we won''t discuss it further in this book.


    # 10.1.1 Full versus Update Installation


    Before performing an installation, it''s important to understand the differences
    between the two principal types of installation. A full installation installs
    a brand-new copy of the Tru64 UNIX operating system. The installation creates
    new file systems and swap partitions, overwriting any existing system and user-created
    files on the disks where the new file systems and swap partitions are installed.
    After installation, the system must be configured for general use by adding user
    accounts, setting up the network configuration, and similar tasks.


    In contrast to a full installation, an update installation converts a system that
    is running a specific version of Tru64 UNIX to a later version of the operating
    system. Unlike a full installation, an update installation preserves existing
    partitions, file systems, network configuration, user accounts, and all other
    customizations.


    It''s important to realize that update installation is generally available only
    to the next version of the operating system, or to two or three subsequent versions.
    Upgrading to a later version can''t be done in a single update installation. Table
    10.1 shows the available installation paths in recent versions of Tru64 UNIX.
    For example, V5.1A can be installed via a single update from V5.0 or V5.1, but
    not from V5.0. Upgrading from V5.0 to V5.1A would require two installations: one
    to V5.0A or V5.1 and a second to V5.1A. Obviously, larger version jumps require
    more updates; for example, upgrading from V4.0 to V5.1A would require at least
    four update installations. At some point, it becomes easier to do a full installation
    and reconfigure the system rather than performing multiple updates. Each update
    requires the appropriate distribution media, takes time to perform, and increases
    the risk that something may go wrong.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The trade-off point between full and update installations is somewhat subjective
    and depends largely on the degree of customization involved, which in turn depends
    on the complexity of the system configuration. We generally consider it worthwhile
    to perform two installations for a simple configuration and three for a complex
    system. Beyond that point, it''s usually easier to do a full installation.


    # Table 10.1 Available Update Installations in Tru64 UNIX


    | Target Version | Starting Versions |

    | V4.0 | V3.2C, V3.2D |

    | V4.0A | V3.2G, V4.0 |

    | V4.0B | V4.0, V4.0A |

    | V4.0C | None |

    | V4.0D | V4.0A, V4.0B, V4.0C |

    | V4.0E | V4.0B, V4.0C, V4.0D |

    | V4.0F | V4.0D, V4.0E |

    | V4.0G | V4.0D, V4.0E, V4.0F |

    | V5.0 | V4.0D, V4.F |

    | V5.0A | V4.0F, V5.0 |

    | V5.1 | V4.0G, V5.0A |

    | V5.1A | V5.0A, V5.1 |

    | V5.1B | V5.1, V5.1A |


    Although an update installation preserves the existing system configuration, a
    full installation does not. A full installation results in the loss of existing
    configuration information, user accounts, layered products, and third-party software.
    For the first installation on a new system, this is not an issue because there
    is no existing data to be lost. But if you are performing a full installation
    over a previously used disk, it''s important to recognize the fact and be prepared
    for it. All user data in any of the standard UNIX systems (such as /usr/users)
    must be backed up before the installation and restored afterwards. Any configuration
    information that you wish to preserve, such as the password and group files, must
    also be backed up.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 254 10.1 Installation Problems


    Before beginning any installation operation, there is one cautionary note that
    can''t be emphasized too strongly. It''s always a good idea to back up your data
    before making significant changes to a system, but this is particularly true of
    an installation. We strongly recommend that you back up all existing file systems
    before beginning a full or update installation. The installation process is inherently
    destructive to existing data: if something goes wrong, restoring from backup is
    usually the only alternative.


    Installation problems tend to be caused by one of the following:


    +   - Out-of-date system firmware

    - Invalid EISA configuration data

    - Invalid operating system version

    - Defective installation media

    - Interrupted installation


    These problems can affect both full and update installations. There are a few
    problems specific to update installations:


    +   - Insufficient disk space

    - Layered product conflicts

    - File-type conflicts


    These problem types are discussed in the following sections.


    # 10.1.2 Out-of-Date System Firmware


    Obsolete firmware can prevent Tru64 UNIX from installing. To check the system
    firmware version, enter the following command at the SRM console prompt:


    ```

    >>> SHOW VERSION

    ```


    Ensure that the firmware version is compatible with the version of Tru64 UNIX
    that you''re running. If it isn''t, upgrade to a compatible version. If'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 10.1 Installation Problems


    do you upgrade the firmware, be sure to run the EISA Configuration Utility (ECU)
    afterwards.


    # 10.1.3 Invalid EISA Configuration Data


    Many Alphas systems, particularly older models, contain EISA buses. The EISA configuration
    information is stored in non-volatile memory. If it becomes corrupted or is never
    initialized, Tru64 UNIX may not install successfully. In addition, updating the
    system firmware will clear the EISA configuration data, requiring that it be restored.


    To restore the EISA configuration, run the EISA Configuration Utility (ECU), which
    is provided on a floppy diskette with the Tru64 UNIX distribution. Older versions
    of the ECU existed in two versions: for Tru64 UNIX and OpenVMS systems, the other
    for Windows NT systems. Be sure to use only the former version, which is labeled
    "UN/VMS" on the diskette. The console command to run the ECU may vary depending
    on the platform type, which is usually one "runecu", "ecu", or "run equ.\ When
    the ECU starts up, simply choose the "Save and Exit" option. After exiting the
    ECU, power cycle the system.


    # 10.1.4 Invalid Operating System Version


    Not all versions of Tru64 UNIX support all Alpha platforms. Support for new hardware
    is added from time to time; for example, V5.1a introduced support for the AlphaServer
    ES45. Attempting to install an older version of Tru64 UNIX on a platform not supported
    by that version will fail. Booting the installation CD-ROM for the older version
    will cause the system to halt after displaying a warning message such as the following:


    > WARNING: proc_type 0x42 / sys_type 0x45 unknown


    (The hexadecimal numbers 0x42 and 0x45 in the example are arbitrary; the actual
    numbers displayed will probably be different.)


    Similarly, support for very old systems based on obsolete technologies (such as
    the Turbochannel-based DEC 3000 series) have been removed from recent versions
    of the operating system. Booting the operating system in such a situation will
    panic the system with a message such as "platform supported."


    This kind of situation can also arise by moving or duplicating a system disk from
    one platform type to another. For example, if you copied the system


