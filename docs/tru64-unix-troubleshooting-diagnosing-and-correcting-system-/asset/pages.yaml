    # 4.1.3.3 Process Limits


    A number of process resources are restricted by limits imposed by the command
    shell or the Tru64 UNIX kernel. If a process attempts to exceed one of these limits,
    it will fail with an appropriate error code, such as EMFILE (too many files).
    Some of these errors are specific in indicating which limit has been reached,
    while others are more ambiguous. For example, ENEM (not enough memory) indicates
    that a memory-based limit has been reached (possibly that the system is low on
    swap space). However, there are three memory-based limits: stack segment size,
    data segment size, and virtual memory size. Determining which of these has been
    exceeded requires knowing what the program is trying to do—or nothing else, trial
    and error.


    When a process exceeds one of the resource limits, the straightforward response
