- pgno: 122
  md: "Older versions of Tru64 UNIX use a different naming scheme for\nperimetric\
    \ devices. SCSI disk names in version 4 and earlier are of the form\n“rzLnn,”\
    \ where “nn” equals ((bus * 8) + target) and L is the LUN indicator,\nwith the\
    \ letters “a” through “h” indicating LUN 0 through 7. (For LUN 0,\nt “a” may be,\
    \ and usually, is omitted.) Using this formula, the disk at\n2, target 1, LUN\
    \ 0, would be known as rz17 (or, less commonly, rza17).\n\nOnce the device name\
    \ is known, try reading the disk's label. For a disk\ndamed dsk1, try\n\n```\n\
    disklabel -r dsk1\n```\n\nIf this fails with a message such as “I/O error,” there\
    \ is a hardware prob-\blem with the disk or another component leading to it, such\
    \ as an adapter or\ncable. The disklabel command returns “disk is unlabeled,”\
    \ the label (at a\nminimum) has been corrupted. The remainder of the disk may\
    \ or not\nrupted. The next step is to try writing a new label onto the disk\n\
    to see if the corruption is limited to the label.\n\nFirst, write a default label\
    \ on the disk. If the root file system type is\nuFS, enter\n\n```\ndisklabel -wrt\
    \ ufs dsk1\n```\n\nThe root file system type is AdvFS, enter\n\n```\ndisklabel\
    \ -wrt advfs dsk1\n```\n\nThis will write a default disk label, which includes\
    \ a standard partition\nlayout. If the disk was previously using the default layout,\
    \ this is sufficient.\nHowever, if the disk was using a customized partition layout,\
    \ it is now nec-\\sessary to edit the label using a record of the previous partition\
    \ layout (which\nhhopefully was saved in hard-copy form or on another disk). To\
    \ edit the\ndisklabel, enter:\n\n```\ndisklabel -re dsk1\n```\n\nand make the\
    \ necessary changes to the partition layout. It is necessary to\nchange only the\
    \ “size” and “offset” fields for partitions that need to be\nmodified. Other fields\
    \ are calculated automatically."
