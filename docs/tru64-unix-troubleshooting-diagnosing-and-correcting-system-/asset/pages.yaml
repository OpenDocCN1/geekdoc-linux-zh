    | Name(s) | Description |

    | --- | --- |

    | local4 | Reserved for local use |

    | local5 | Reserved for local use |

    | local6 | Reserved for local use |

    | local7 | Reserved for local use |


    Each line of the syslog configuration file contains a single entry. See Figure
    3.1 for an example of an /etc/syslog.conf file.


    # Table 3.2 Available syslog Priorities


    | Name(s) | Number | Description |

    | --- | --- | --- |

    | emerg | 0 | System is unusable |

    | alert | 1 | Action must be taken immediately |

    | crit | 2 | Critical conditions |

    | err | 3 | Error conditions |

    | warning | 4 | Warning conditions |

    | notice | 5 | Normal but significant condition |

    | info | 6 | Informational |

    | debug | 7 | Debug |


    The syntax and format of the /etc/syslog.conf file must be followed exactly, as
    the syslog daemon will stop reading the syslog.conf file if an error or format
    violation is encountered. This means that a simple typographical error in the
    middle of the syslog.conf file will prevent syslog from seeing any entries after
    the error. The most common error is using spaces to delimit the facility and severity
    levels from the destination. The only permitted delimiter is one or more tab characters.
    Spaces are not allowed in syslog.conf entry.'
