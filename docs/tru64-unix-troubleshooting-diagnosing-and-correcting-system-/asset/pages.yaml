- pgno: 81
  md: '# # User Accounts and Security


    > The problem is not that there are problems. The problem is expecting otherwise
    and thinking that having problems is a problem.


    - Theodore Rubin


    Problems affecting user accounts are among the most frequent to arise in system
    administration. The wide variety of such problems—and the fact that many of them
    are caused by a user''s own actions—makes it necessary for an administrator to
    be familiar with their causes and solutions. In this chapter, we will discuss
    the principal types of account problems and how to deal with them. This is not
    a comprehensive list of all possible user account problems; such a list would
    be practically huge, if not impossible to produce. The problem areas here include
    the most common types of problems that an administrator might encounter. For other
    types of user account problems, the troubleshooting techniques presented in this
    and other chapters should at least provide a way to approach them.


    Some types of user account problems, such as login and password problems, are
    greatly influenced by the system''s security configuration. A system''s security
    level (base security or enhanced security) often determines the correct method
    of troubleshooting a user account problem. Because these topics are so closely
    linked, we''ll also discuss security-related problems in this chapter.


    # ## 4.1 User Account Problems


    The general term user account problems includes problems that prevent one or more
    users from accessing their accounts or using them effectively. These problem areas
    include the following:'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 4.1 User Account Problems


    +   - Login problems

    - Password problems

    - Shell problems


    All three of these areas are discussed in the following sections, as are problems
    that a system administrator may encounter while performing account tasks.


    There are a couple of general principles to keep in mind when trouble-shooting
    account problems. First, many of these problems can be caused by incorrect file
    ownership or permissions. For example, an administrator (in a misguided attempt
    to so increase system security) might change the permissions on the root directory
    so that only the root user can access secure that no root can log in. This is
    because login operation requires access to a number of system and user files.
    Access to a file in UNIX is determined not only by the permissions on the file
    itself; it also requires search (execute) access to all directories in the full
    path to the file. Because the root directory is in the path to every file on the
    system, restricting access to root effectively denies access to all other files
    and directories.


    Incorrect file permissions can be an issue not only with the root directory, but
    with any important file or directory. For example, if user directories are located
    under /usr/users, incorrect permissions on any of the intermediate directories
    will prevent a user''s home directory, which will cause logins to account to fail.
    In addition, a number of utilities (such as the login program) require the setuid
    permission to be set to perform certain privileged operations. Removing the setuid
    from utilities that it needs is another mistake frequently made by administrators
    trying to increase system security.


    # Troubleshooting Tip


    Insecure ownership or permissions on system files can cause a variety of user
    account problems. Verify system files with the fverify(8) command or the allverify
    utility available from HP technical support.


    These types of problems sometimes produce informative error messages that quickly
    reveal the problem, but in other cases the symptoms can be'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# 4.1 User Account Problems\n\nquite mysterious. In such cases, one of the\
    \ first troubleshooting steps is to verify system software integrity with the\
    \ verify(8) or allverify(8) commands. (The allverify command is not part of the\
    \ Tru64 Unix distribution. It can be obtained from HP technical support). However,\
    \ these commands only check files that are listed in software subset inventories.\
    \ Files or directories not listed in the inventories must be checked manually.\
    \ These include locally defined directory structures and two key files: the root\
    \ directory and /etc/sia/matrix.conf. The root directory is created by the system\
    \ installation process, while /etc/sia/matrix.conf is built from a prototype file.\
    \ As such, neither is listed in any subset inventory. The correct ownership and\
    \ permissions for these two files are shown by the:\n\n```\nrwxr-xr-x 30 root\
    \ system 8192 Feb 12 09:50 / \n\n-rw-r--r-- 1 root bin 2185 Mar 08:08:07\n/etc/sia/matrix.conf\n\
    ```\n\nThe above example is from a system running Tru64 UNIX V5.1A. Prior to V5.0,\
    \ /etc/sia/matrix.conf was a symbolic link that usually pointed to either bsd_matrix.conf\
    \ or OSFC2_matrix.conf. On older systems, the ownership and permissions on the\
    \ target file, rather than the symbolic link, are significant.\n\nWhen troubleshooting\
    \ user account problems, it's also important to pay close attention to the problem's\
    \ range of effect. Does the problem affect one user, a group of users, or all\
    \ users? As shown in Chapter 2, the range of effect is often a key piece of information\
