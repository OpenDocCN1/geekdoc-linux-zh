  md: '# System Hangs


    # Table 5.3 Process State Indicator Characters (continued)


    | Character | Process State |

    |---|---|

    | I | Idle (sleeping longer than 20 seconds) |

    | T | Stopped |

    | H | Halted |

    | W | Swapped out |

    | > | Exceeding memory soft limit |

    | N | Niced (process priority reduced) |

    | < | Process priority raised |

    | + | Process group leader |


    Examine the state characters for processes of interest (e.g., system demons or
    applications that aren''t responding). If a process is failing to responding to
    user requests, and it''s in the I (idle) state, something is preventing the process
    from seeing and responding to the requests. In this situation, stopping and restarting
    the process may resolve the problem. A process state of U is more serious. This
    flag indicates that the process is an uninterruptible wait state. This state should
    not persist for longer than a fraction of a second. If a particular process remains
    in the U state, something is seriously wrong with it. Even, processes in the U
    state usually can''t be killed.


    When—whether system or user—is not responding, the first recourse is usually to
    try stopping and restarting the process. This is fairly simple in principle. Use
    the ps command to find the process identifier (PID). If the ps command itself
    hangs, try using the dbx command ''kps'' as an alternative. The PID is an argument
    to the kill(1) command, which is used to send a signal to a process. By default,
    the kill command sends TERM (signal 15) to the receiving process. This is usually
    sufficient to terminate the normally because most UNIX processes are designed
    to respond to a TERM signal by exiting gracefully. It may take a few seconds for
    the process to perform some final housekeeping and exit. Some demons are also
    programmed to respond to HUP (1) as a ''warm reset,'' causing them to return to
    default configurations, reread configuration files, or perform similar initialization
    activities. As, it''s worth trying HUP before TERM in most cases. If HUP works,
    it''s less drastic than terminating the process, and if it doesn''t work, nothing
    is lost.'
  merge: -1
  img_proc: true
