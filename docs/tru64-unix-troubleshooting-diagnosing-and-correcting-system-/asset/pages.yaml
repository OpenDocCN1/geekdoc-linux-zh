- pgno: 107
  md: '# 4.2.2 Security Configuration Problems


    In this section, we''ll discuss problems that can arise while setting the system''s
    security configuration, as well as common misconfiguration errors. One of the
    latter (unintentionally enabling the “Execute bit set only by root” option) was
    already discussed in section 4.1.3.4. Another error of this type is unintentionally
    disabling segment sharing. Segment sharing allows the text segments (only) of
    shared libraries to be shared by all users, regardless of the file permissions
    on the library. Systems requiring a very high level of security may choose to
    disable segment sharing to prevent undesired sharing of shared library texts.
    The consequence is to cause every process to have its own copy of the text segment
    of every shared library that it uses. It consumes a great deal of memory, possibly
    leading to memory shortages and performance problems. Unless you are certain that
    segment sharing should be disabled on your system, leave it enabled.


    There is one other area where enhanced security can affect the performance of
    a Tru64 UNIX system. By default, enhanced security records login times and unsuccessful
    login attempts for each user and terminal. If many users are constantly logging
    in and out (e.g., on a large university system with thousands of student users),
    the recording of login information can create a bottleneck on the files in this
    information is recorded. If performance is more of a concern information can be
    partially or completely disabled. The “Configure break-in detection and evasion”
    option in seccfig lets you select enable or disable the following:


    +   - Successful and unsuccessful logins on each terminal device

    - Successful logins for each user

    - Unsuccessful login attempts for each user


    Disabling some or all of these options may improve performance on a system with
    a large number of interactive users. However, disabling them will also disable
    the system''s ability to automatically detect and evade breakin.


    A number of problems can arise when converting from base security to enhanced
    security. The most common of these affects users with passwords longer than eight
    characters on older versions of Tru64 UNIX. The password encryption algorithm
    used in Base security encrypts only the first eight characters entered by the
    user; any additional characters are ignored.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Thus, a user may believe that his or her password is 10 or 12 characters long,
    but in reality the password is only the first eight of those characters. When
    the system switches to enhanced security, the entire string of 10 or 12 characters
    is encrypted, which results in a different encrypted password than encrypting
    just the first 8 characters. Thus, the previous password appears to fail. When
    this happens, users need to log in using those first eight characters, after which
    they can change passwords and use the longer string if desired.


    The problem is even worse when switching from enhanced to basic security. Passwords
    longer than eight characters not work at all after the conversion, so users need
    to ensure that their passwords are eight characters or fewer before the switch.
    To avoid having either of these problems affect the root user, the seconfig utility
    provides an opportunity to change the root password when changing the security
    level. The new password is encrypted with the appropriate algorithm so it will
    be certain to work when the system is rebooted at the new security level.


    There are some additional security configuration issues to be aware of in TruCluster
    environments. To begin, with all members of the cluster must operate at the same
    security level. Mixing security levels within a cluster makes it impossible for
    users to log in on some members. When converting a cluster from base to enhanced
    security, some extra steps are necessary. First, seconfig is used to select enhanced
    security with the “Upgrade” option, after which each member of the cluster must
    be rebooted. After all members are rebooted, seconfig must be run again to finish
    customizing the security options.


    The best way to set up a cluster with enhanced security is to set up the desired
    security configuration on the initial member before creating the cluster. As additional
    members are added to the cluster, the security configuration is automatically
    duplicated on the new members. This is much easier and less error-prone than converting
    a cluster after it is already up and running.


