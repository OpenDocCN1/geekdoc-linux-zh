    Another guideline for modifying sysconfigtab is always to use the sysconfigdb(8)
    utility instead of modifying /etc/sysconfigtab with a text editor. Although editing
    the file is usually simpler, sysconfigdb performs basic syntax checking on the
    parameters being modified. Using sysconfigdb prevents the possibility of a parameter
    being specified twice in /etc/sysconfig. If a parameter is specified more than
    once, only the last value found is used, with no error message. This can cause
    a great deal of confusion when a parameter change appears not to take effect,
    also because the parameter is specified with a different value later in the file.
    Also, manually editing sysconfigtab may cause problems if the operating system
    is subsequently upgraded with the installupdate utility. The installation process
    merges the existing sysconfigtab file with the new version from the Tru64 Linux
    distribution. The merge operation is quite sensitive to the layout of the sysconfigtab
    file, and unintended changes to this layout can cause problems when the files
    are merged.


    One final problem to watch out for is an excessively large sysconfigtab file.
    Because this file is read very early in the boot process (before the kernel is
    operating), it is constrained to a fairly small size: 32,768 characters in version
    4, and 49,152 characters in version 5. The character count excludes comment lines
    and white space). This size is sufficient for all situations, but without much
    to spare. A large part of the file is occupied by hardware configuration information.
    Consequently, it''s important to include only those kernel parameters that need
    to be set to defaultval values. Attempting to specify all configurable parameters
    in /etc/sysconfigtab will exceed the size limit. When this happens, all information
    beyond the'
