    # 8.1.4.4 Reusing a Disk from Another Operating System


    Disks that are shipped by HP for use with Tru64 UNIX is usually for formatted
    correctly straight out of the box. However, when a disk has been used on another
    operating system, it will not have a Tru64 UNIX-compatible disk label on it. The
    disklabel command will usually see the disk as unlabeled or as having a corrupt
    label and print out a message similar to the following:


    > Disk is unlabeled or, /dev/rrz20a is not in block 0 of the disk


    However, because of low-level formatting differences with some other operating
    systems, disklabel will also fail when an attempt is made to write a default label
    to the drive. When this occurs, the drive must be reformatted before disklabel
    can write a default label to it. This is accomplished by using the sc “format”
    command to perform the low-level formatting, writing a new label with disklabel.


    # 8.2 Tapes


    In the previous section, we were concerned with disk devices, which have certain
    characteristics, such as random access and very fast/write ability. These characteristics
    make them desirable for storing on-line data. Some other characteristics, such
    as high cost and lack of portability, make them less desirable for off-line or
    archival storage of large amounts of data. It is in this area that tape drives
    are particularly useful, given their sequential'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'nature and relatively low cost. Once a tape drive is purchased, the storage
    media (tapes) have a very low cost per megabyte compared to disk drives.


    Just like other storage devices, tape drives can do and fail, and when you will
    have to troubleshoot and correct the problem. Tape problems usually fall into
    one of the following three categories:


    +   1. Hardware problems

    2. Media problems

    3. Formatting issues


    Each of these areas is discussed in the following subsections.


    # 8.2.1 Hardware Problems


    Tape drive hardware problems will be obvious when you (or one of your users) attempt
    to read or write to a tape and receives some kind of error. As with most device
    problems in Tru64 UNIX, the system logs such errors into the binary log, so you
    will need to examine the error log using one of the tools discussed previously.
    The error returned to the application performing the I/O will generally be EIO,
    or I/O Error. With disks, errors from a tape drive are either hard or soft.


    As disks, a hard error indicates a real problem that needs to be investigated
    and corrected. Sometimes tape drives in an external cabinet get into a high state,
    and simply resetting power to them will correct the problem. For example, a tape
    drive that fails to eject a tape may fall into this category. If power cycling
    fails to reset the device, you should also check termination and cable lengths
    of the SCSI bus. In other troubleshooting situations, try to determine when the
    drive last worked and what has changed since then.


    A soft error on a tape drive usually indicates a medium problem or a dirty tape
    drive. Medium problems many read errors are discussed in the following section.
    A dirty drive can cause read errors and generally will only worsen as time goes
    by. Regular maintenance of the drive is recommended to prevent this. In addition
    to cleaning the tape drive, another form of preventive maintenance that should
    be performed periodically is updating the tape drive''s firmware. This is accomplished
    in different ways on each vendor''s device, which is usually done in one of two
    ways. The first method is with a specially formatted tape from the device vendor;
    when the tape'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 8.2 Tapes


    loaded, the tape drive updates its firmware and ejects the tape when it is done.
    The second method is by using the Tru64 UNIX scu(8) command with the "download"
    option. This requires that you have the correct firmware-update file on a disk
    somewhere before you begin.


    One way to isolate a tape drive problem is by moving the drive to another system.
    If the drive works over there, then the problem is likely some piece of hardware
    in the first system, such as an adapter or cable. Once you''ve eliminated other
    possibilities, the remaining conclusion is that the drive is just broken and it''s
    time to call the vendor to get the drive repaired or replaced. Because tape drives
    can be expensive, it''s a good idea to eliminate other possibilities, such as
    cabling, before calling the vendor.


    Although Tru64 UNIX supports many different types of devices, doesn''t mean that
    all possible types are supported. First, there are some types of tape drives that
    are very old and no longer supported by HP. Second, there are some third-party
    drives that do not behave like any drive supported by HP and, using them requires
    some sort of special driver. If that special driver is not available, the drive
    will not function properly. In order to see a list of all the currently supported
    tape devices on your system, check out the ta(7) reference page.


    # Before you call support


    +   If a tape drive is logging hard errors, check the following:

    - Are the SCSI bus length and termination correct?

    - Is the SCSI adapter functioning correctly?

    - Did you try cycling power to the drive?

    - Is the tape drive supported?

    - If the drive requires a special driver, is it installed?

    - Have you tried updating the drive''s firmware?


    # 8.2.2 Media Problems


    With disk drives, even a few soft errors should be investigated as a potential
    indicator of a real problem. However, the threshold for the number of soft tape
    drive errors that should be investigated is much higher. It is fairly normal to
    see soft errors coming from a tape drive during a backup, for example. This indicates
    that the tape itself contains bad areas that failed a consistency check. Too many
    of these errors could indicate that a tape has'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'been reused too many times or the tape drive heads are getting dirty. A new
    tape should be tried to help determine which of these could be the problem. Of
    course, only high-quality media should be used for critical data such as backups,
    near-line, and archival storage.


    In addition, some other types of tape errors are best addressed by simply replacing
    the bad tape. These include the:


    +   - Bad tape mechanism

    - Broken tape

    - Worn tape


    Sometimes you may find that a tape is incorrectly formatted for use with the tape
    drive you are using. This situation usually be rectified by first degaussing the
    tape with a degausser before using it. A degausser will completely erase a tape
    by using alternating magnetic fields that scramble the data. Some very powerful
    degaussers are so effective that they are even approved for use by the U.S. government
    for declassifying information or before throwing away an old tape.


    # Before you call support


    If a tape has excessive soft errors, check the following:


    +   - The tape may be worn. Did you try a new tape?

    - Are the tape drive heads clean?


    # 2.2.3 Tape Formatting Issues


    Tru64 UNIX supports many different tape formats. In most cases, the format of
    a particular tape is already known. For example, you may have a backup tape created
    with vdump from which you need to recover some last files. In this case, you already
    know the format, so there''s no problem with deciding how to read the tape. If
    you don''t know the format, you may have to try a number of different tools to
    see whether one can find that will read the tape. Table 8.1 contains a list of
    supported tape formats. If you try all the possible types and still can''t read
    the tape, try to use dd(1) as a last resort. If that at least returns some data,
    the tape is not blank.


    Interchange between different computer systems can be problematic. If you''re
    lucky, the source and destination are both using the'
