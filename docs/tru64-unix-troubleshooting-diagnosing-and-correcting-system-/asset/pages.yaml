  md: '# 5.2 System Crashes


    +   1. Kernel panics that produce crash dumps


    +   2. Kernel panics that don''t produce crash dumps


    +   3. Non-panic crashes


    These three classes require different troubleshooting techniques. Before getting
    into these, we''ll discuss how Tru64 UNIX crash dumps are created.


    # 5.2.1 Crash Dump Creation


    When the kernel encounters a severe problem that causes it to panic, it first
    writes a panic message to the system console, the system message file, and the
    binary error log. The panic routine then stops all processes and calls a kernel
    routine named "dumps" to dump the contents of physical memory to disk, specifically
    to one or more of the swap devices. (The dumps routine can also be invoked by
    entering the console command "CRASH"; in this way, a forced crash dump can be
    created when a system is hung.) The dumps routine locates the available swap partitions
    to see whether there is free space to hold the contents of memory, and then writes
    the contents of memory to the swap dumps. By default, the dumps routine writes
    a partial dump, which contains only the "interesting" parts of physical memory,
    rather than a full dump, which contains every last byte of physical memory. There
    are a number of kernel parameters that configure how crash dumps are written and
    what they contain; for details, see the reference page for sys_attrs_generic(5).


    When the system next boots to multiuser, the savecore program runs at the beginning
    of level 2 startup. The savecore program checks the swap partitions for the presence
    of a memory dump. If a dump is present, savecore copies the memory contents into
    a crash dump file named vmcore (or vmcore. for the uncompressed dumps used in
    older versions of Tru64 UNIX). The savecore program also copies the currently
    running kernel to a file named vmunix.n in the crash directory defined by rc.config
    parameter SAVECORE_DIR, or in /var/adm/crash by default. The "n" in the file names
    represents a number that keeps track of subsequent crashes on the system. This
    sequence is stored in file "bounds" in the crash directory and starts with crash
    0. That is, the first crash dump on a system will create vmcore.0 and vmunix.0,
    the next will create vmcore.1 and vmunix.1, and so on. Later in the boot sequence
    (during the run level 3 startup), the crashdc(8) program runs to create a snapshot
    of the crash dump. The snapshot file (crash-data.n'
