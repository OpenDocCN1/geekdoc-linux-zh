  md: '# 3.1 System-Level Error-Reporting Facilities


    manage the entries in syslog configuration file is vital to effective system administration.


    The syslog facility consists of the syslog daemon, /usr/sbin/syslog, and the syslog
    configuration files: /etc/syslog.conf the primary configuration file, and /etc/syslog.auth
    identifies the remote hosts that are allowed to forward ward messages to the local
    syslog daemon. In Tru64 UNIX version 5, the /etc/syslog_evm.conf file is also
    used by syslog to determine what information to forward to the event manager.
    We discuss the event manager in greater depth later in this chapter.


    # 3.1.1.1 The syslog Daemon


    The syslog daemon, /usr/sbin/syslog, is an executable system normally started
    at run level 3 during system startup and always running while the system is in
    multiuser mode. The syslog daemon reads messages sent to it from system processes,
    the kernel, and user applications. These messages can be informational only, warnings,
    or errors that need attention. The messages themselves are single lines, optionally
    containing a priority value indicating the severity of the message. These priorities
    are defined in the /usr/include/sys/syslog_pri.h header file. Messages are received
    by syslog from three sources:


    +   - The device special file /dev/klog, also called the domain socket

    - The device special file /dev/klog, which reads kernel messages

    - Other systems across the network via a socket specified in /etc/services


    Most processes and utilities—and optionally user applications—submit messages
    to syslog using the syslog(3) function call or the logger(1) command. These messages
    are relayed to syslog via the device special file /dev/klog. Kernel messages are
    similarly sent to syslog through the device special file /dev/klog. Finally, syslog
    may receive messages from other systems via the network using a socket specified
    in the /etc/services file, provided that the /etc/syslog.auth file allows it;
    see section 3.1.8 for more information about /etc/syslog.auth. The point in mentioning
    these syslog message sources is to identify these files when troubleshooting syslog
    problems. For example, if kernel messages are not being received and logged by
    syslog, ensure that the /dev/klog file exists:'
