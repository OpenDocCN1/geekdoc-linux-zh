  md: '# 3.2.1 stderr


    The standard error, or stderr, is the channel by which error messages are reported
    back to a process. For example, if you enter a command such as the following:


    ```

    # cat bogus.file

    cat: cannot open bogus.file

    ```


    The resulting error message would not go to the normal standard output (stdout)
    but to another location—standard error. In this case, the standard error is the
    same as the standard output, so they go to the same place—the terminal. It is
    possible to redirect the errors to a different place from where the standard output
    goes, such as a log file. As an example of this concept, consider the following
    fictitious command entered at the Bourne shell line:


    ```

    # mydaemon > /dev/console 2 > /var/adm/mydaemon.log

    ```


    In this case, the standard output of the daemon is sent to the console device,
    while the standard error (file descriptor 2) is directed into a log file.


    # 3.2.2 errno


    Usually, the first indication a user gets that something is wrong is an error
    returned after a system command or utility has been issued. When an error condition
    is encountered while executing a UNIX system call, the kernel returns a status
    back to the caller indicating whether the system call failed or succeeded. Successful
    execution of the system call generally returns a status of 0 to the caller, while
    an unsuccessful result usually returns a -1. A is an indication to the caller
    to check a global status variable errno for further information about the failure.


    As an example, consider the following fragment of code:


    ```

    fd = open("/steve/test2", O_RDONLY, 0666);

    ```


    In this case, an application or utility is using the open(2) system call to request
    that the UNIX kernel open a file to allow further operations such as'
