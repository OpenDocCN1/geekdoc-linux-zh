    no entries

    no daemon present


    Both queuing and printing should have a status of "enabled." If not, you

    able them with the lpc "enable" and "start" options, respectively.

    There are numerous other useful options for controlling printers; see the

    lpc(8) reference page for more information.


    # Troubleshooting Tip


    When using lpc, keep in mind that remote printers queues on

    loth the local and remote hosts, but lpc affects only the local queues.

    To manage the remote queue (i.e., the local queue on the system that

    actually hosts the printer), you''ll need access to the remote system.


    Problems can also arise if the printer spool directories or log files are

    missing or dont have the proper ownership or permissions. The lpd daemon- runs
    as user "daemon," so the spool directories and log files must be

    writable by that user. The spool directories, which are generally located

    under /var/spool, should have owner "daemon," group "daemon," and per-

    mission bits equal to 775. For example:


    ```

    # ls -ld /var/spool/lpd0

    drwr-xr-x 2 daemon      8192 Aug 21 13:29

    /var/spool/lpd0

    ```


    The printer log files must also be writable by user "daemon." For

    example:


    ```

    # ls -l /var/adm/lp0err

    -rw-r-r- 1 daemon      0 Aug 21 13:27

    /var/adm/lp0err

    ```


    Another thing to be aware of is that /var/spool/lpd is a Context-Dep-

    dent Symbolic Link (CDSL) in Tru64 UNIX version 5. If the CDSL is'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 11.2 Printing


    replaced with a regular directory, it will cause problems in a TruCluster-configuration.
    (It''s harmless on a standalone system.)


    One final issue in the printing subsystem affects local printers connected to
    the parallel interface port, /dev/lp0. The presence of the "rw" field in a printcap
    entry indicates that the printer is a read/write device. However, /dev/lp0 is
    a write-only device, so it''s not possible for lpd to open the device in read/write
    mode. Lpd fails to open the device, it can''t send any output to the printer.
    This problem was much frequent with older versions of Tru64 UNIX (prior to V4.0),
    when the printer setup didn''t always set up parallel printers correctly. If should
    occur on your system, simply edit /etc/printcap and remove the "rw" field from
    the printer entry.


    If the UNIX printing subsystem looks good and is working, the problem must be
    in the connection between the UNIX system and the printer. The troubleshooting
    methods for each connection type have significant differences, so we''ll discuss
    each of them separately.


    # 11.2.2 Local Printers


    A printer is connected to a parallel or serial interface port on the local system.
    The parallel port is always /dev/lp0. Alpha systems generally have one or two
    serial ports; the first is /dev/tty00 and the second is /dev/tty01. If additional
    serial ports are available (e.g., from a multiplexer device), their device names
    will also start with /dev/tty.


    To test a parallel interface connection, try to "cat" a small ASCII file to the
    printer port, as shown in 11.2.1. If the file prints correctly, the connection
    is fine; any remaining problems are part of the UNIX printing subsystem. If the
    file doesn''t print—then you''ve verified the printer operation with a self-test—then
    it''s time to start troubleshooting the connection.


    The first thing to check is that the printer configuration on the UNIX system
    matches the actual printer configuration. For example, if the printer has multiple
    connection methods, is it set to print jobs from the correct port? For serial
    printers, is the baud rate correct? If the baud rates on each end don''t match,
    the printer will print garbage or nothing, but activity lights on the printer
    may flash while the job is being received.


    The next thing to check is the cable between the printer and the Tru64 UNIX host.
    If a spare cable is available, swapping it for the existing cable. If start working,
    you''ve isolated the problem to a bad cable. Cable length can also be an issue,
    particularly for serial interfaces at high baud rates. It may be worthwhile to
    try a lower baud rate or a shorter cable.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'In addition, verify that the cable is a "null modem" cable. Finally, if the
    host system has more than one serial port, verify that the printer cable is connected
    to the right port. (This may seem obvious, but it''s often a source of confusion.)


    Another technique may be helpful in troubleshooting serial printer connections.
    If a serial terminal, such as a DEC VT220, is available, try hooking it up in
    place of the printer. Make sure the baud rate is correct, and then sending a file
    to the printer with cat(1). If the correct output appears on the terminal, the
    connection isn''t the problem.


    # 11.2.3 Remote Printers


    A remote printer is attached directly to another system on the network. Print
    jobs are first sent to the remote host, which receives the job and spools it for
    transmission across its local interface to the printer. Remote printers are indicated
    by the presence of the "rm" and "rp" fields in a printcap entry. The "rm" field
    defines the remote host, while "rp" defines the remote printer name—that is, the
    local printer name on the remote host. For example, in the following printcap
    entry, the printer known locally as "lp1" is a remote printer hosted by system
    "labserv," which is a valid host name in the local network address space. The
    printer is known as "lp3" on its host, labserv.


    ```

    lp1|1|labprinter:\n:lf=/var/adm/lp1err:\n:lp=

    :rm=labserv:\n:rp=lp3:\n:sd=/var/pool/lpd1:

    ```


    When troubleshooting remote printers, try to verify that the printer is operating
    normally as a local printer on the remote host. If it isn''t, the problem needs
    to be worked at the remote host. If the printer works locally, not from your host,
    try isolating the problem by attempting to print from a third system. If this
    succeeds, the problem is isolated to your local system; if not, the problem is
    most likely on the remote host.


    The next step is to verify basic network connectivity between the local and remote
    hosts. Can you ping the remote system successfully? If not,'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 11.2 Printing


    there’s a network problem between the two hosts. See Chapter 7 for information
    on troubleshooting network problems.


    If the ping succeeds, try connecting via telnet to port 515 on the remote system.
    Port 515 is used by lpd (or the equivalent on other operating systems) to listen
    for remote print requests. There are three possible outcomes to the telnet attempt:
    it succeeds, it hangs, or it fails with a "connection refused" message. A successful
    telnet attempt will look similar to the following:


    ```

    # telnet labserv 515

    Trying 10.1.0.17...

    Connected to 10.1.0.17.

    Escape character is ''^]''.

    ```


    This verifies that the remote printer daemon is listening for connections. Enter
    "Control-J" to terminate the connection. In this case, the most likely cause of
    the problem is a difference in configuration between the local and remote hosts.
    For example, the remote printer name defined in /etc/print-cap may not match the
    local printer name on the remote host.


    If the telnet attempt hangs, a network problem exists and further shooting focus
    on the network. On the other hand, if the connection is refused, it means that
    the printer daemon is not listening on port 515. On the remote system, check the
    port using the commands shown below. (This assumes that the remote system is a
    UNIX system; if it’s not, use the equivalent command for its operating system).


    ```

    # netstat -Aa | grep printer

    1ddaaf00 tcp 0 0 *.printer *.*

    LISTEN

    ```


    If this does not generate any output, check for port 515 as follows:


    ```

    # netstat -Aan | grep 515

    1ddaaf00 tcp 0 0 *.515 *.*

    LISTEN

    ```'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'If there is no output from either netstat command, nothing is listening

    port 515; verify that the printer daemon is running on the remote sys-

    them you get output from "515" but not from "printer", something other

    then the daemon is listening on port 515. This could be like a

    spooler application, which is not a problem; however, it could also indicate

    that some other program has inappropriately grabbed port 515, preventing

    the printer daemon from listening for incoming requests.


    # 11.2.4 Network Printers


    Network printers contain a network interface card that allows them to

    connect directly to the local network. Print jobs are sent directly from

    hosts to the printer without requiring an intervening host. Net-

    work printers are characterized by an "lp" field in /etc/printcap of the

    form @nodename/servicename. In this field, nodename is the printer''s

    host name or IP address, while servicename is the name of a net-

    work service defining the printer''s TCP port in the /etc/services file.

    The port number is specific to the type of printer; for example, HP print-

    er use port 9100, whereas DEC printers frequently use port 2501 or

    10001.


    The example /etc/printcap entry earlier in this chapter is for a network

    printer. That entry contains the following line:


    ```

    :ip=@unln17a/tcpprt:\

    ```


    This indicates that the printer host name is unln17a, which is defined in

    the local network DNS database. The service name "tcpprt" is defined in

    the local /etc/services file:


    tcpprt 2501/tcp


    The name "tcpprt" is a locally chosen mnemonic; it could be any arb-

    tary name not used elsewhere in /etc/services. The service is defined as a

    TCP service on port 2501, which is used by DEC LN-17 printers.


    Network connectivity is obviously critical to the successful operation of

    a network printer, so the first step is to verify connectivity. To ping the

    printer; if it doesn''t respond, make sure the printer is operational. If the

    printer is working, try pinging or printing from another system to see if

    that works.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 11.2 Printing


    If you can ping the printer, try connecting to it with telnet. Some devices, such
    as an HP JetDirect card, enter a configuration session if you connect them to
    the default telnet port (23). For example:


    ```

    # telnet hpjet

    Trying 10.12.40.167

    Connected to hpjet.

    Escape character is ''^]''

    ```


    Please type [Return] two times, to initialize telnet configuration

    For HELP type "?”

    >


    You can also try telnetting to the printer’s listener port. For example:


    ```

    # telnet hpjet 9100

    Trying 10.12.40.167

    Connected to hpjet.

    Escape character is ''^]''

    ```


    # Before you call support


    Before calling technical support for a printing problem, check the following:


    +   * Check the lpr.log file and the printer’s individual error log (e.g., /var/adm/lp0err).

    * Make sure that the printer is is turned on, is on-line, and has the right size
    paper available.

    * Try to print a test page using the printer’s self-test capability.

    * Verify that the printer daemon (lpd) is running.

    * Use "lpc status" to verify that printing and queuing are enabled for the printer.

    * For local printers, copy a small file directly to the parallel or serial port.

    * For remote or network printers, check for network connectivity issues. Also
    try printing from a different host on the network.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 11.3 The cron Facility


    If the printer accepts ASCII input (as opposed to PostScript only), anything you
    type at this point should be printed. This is a great way to verify that the printer
    is—or isn''t—accepting connections and working properly. If it is, but you''re
    still unable to print from Tru64 UNIX, make sure that you''ve got the correct
    listener port defined in /etc/services and the correct service name in /etc/printcap.


    # 11.3 The cron Facility


    The system clock daemon, cron(8), is used to execute recurring jobs at regularly
    scheduled times. Users can run the crontab(1) utility to create cronab files,
    which contain lists of commands to run over the days and times at which to run
    them. For nonrecurring jobs, a couple of relative to cron—the at(1) and batch(1)
    commands—can be used to schedule a job for one-time execution by cron.


    There isn''t whole lot that can go wrong with cron and its associated commands.
    However, there are a few problems that crop up occasionally. These can be divided
    into the following categories:


    +   - Scheduled jobs don''t run at all.

    - Scheduled jobs run at the wrong time or more often than necessary, or other
    odd scheduling behavior is observed.

    - A job works properly when executed from the command line, but not cron.

    - Users can''t schedule new jobs.


    # 11.3.1 Jobs Not Running


    If no cron jobs are being executed, it usually means that the cron daemon is not
    running. Check for a cron process on your system:


    ```

    # ps -ef | grep cron | grep -v grep

    root 915 1 0.0 Aug 12 ?? 00:00:22

    /usr/sbin/cron

    ```


    There should be one (and only one) cron process running on the system. If cron
    isn''t running, restart it with the following command:'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 11.3 The cron Facility


    ```

    # /sbin/init.d/cron start

    ```


    # 11.3.2 Jobs Running at the Wrong Time


    If there are multiple cron daemons on the same system, jobs can run multiple times
    or exhibit other strange behavior. In recent versions of Tru64 UNIX, cron is smart
    enough to check for the existence of a running cron daemon and not start a second
    copy. However, this was not the case in older versions. Occasionally, the root
    user would attempt to edit the crontab file and accidentally type "cron" instead
    of "crontab," causing a second daemon to start. If you encounter this situation,
    the best remedy is to kill all of the current cron processes and start a fresh
    one. The easiest way to do this is with the following command:


    ```

    # /sbin/init.d/cron restart

    ```


    On some versions of Tru64 UNIX, cron jobs can run at the wrong times, or as the
    wrong user, if either of the following conditions are true:


    +   1. An empty crontab file exists.


    +   2. A crontab file exists for a user whose account has been removed.


    To check for these possibilities, enter the following command:


    ```

    # ls -l /var/spool/cron/crontabs

    ```


    If any files have a length of zero, remove them. Also, check the file names against
    your user database (/etc/passwd and/or the NIS password file). If any crontab
    files exist that aren''t in the user database, remove them.


    Another problematic situation can occur in TruCluster version 5 configurations.
    In Tru64 UNIX version 5, /var/spool/cron and /var/adm/cron are CDs. If either
    of them is changed to a regular directory, strange behavior can result. If this
    happens, recreate the CDSL with the mkcds(8) command.


    Depending on the operating system version, cron jobs could run at the wrong times
    on the day that daylight saving time begins or ends. This was only a problem in
    older versions of Tru64 UNIX. In version 4.0F'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'higher (and in older versions with recent patch kits), cron handles the time
    change correctly.


    # 11.3.3 Job Works from Command Line but Not from Cron


    If a cron job fails to execute correctly, but the same job works perfectly when
    executed from the command line, the cause is invariably a shell environment problem.
    The cron daemon executes jobs using the Bourne shell and a minimal set of environment
    variables: HOME, LOGNAME, PATH, and SHELL. If a job requires a different or additional
    environment variables, they must be explicitly specified within the job. As such,
    it''s a good idea to create a script that defines all the necessary environment
    variables before performing the desired commands. This shell script can be specified
    in the cron file as the command to run.


    # 11.3.4 Users Unable To Create Jobs


    If root users are unable to schedule jobs, the problem lies in one of two areas.
    Either there is a permission problem or the user is not authorized to schedule
    jobs. The first problem arises when /usr/bin/crontab or /usr/bin/at/usr/bin/at
    has the wrong ownership or permissions. Both files must be setuid root—that is,
    owned by root, executable by others, and with the setuid bit. The correct ownership
    and permissions are illustrated by the following:


    ```

    # ls -l /usr/bin/crontab /usr/bin/at

    -rwxr-xr-x 1 root      bin 57840 May 29 04:47

    /usr/bin/at

    -rwxr-xr-x 1 root      bin 41472 May 29 04:48

    /usr/bin/crontab

    ```


    If the set bit is missing from either file (i.e., the fourth character in the
    output is not "s”), you can recreate it with a command such as the following:


    ```

    # chmod 4755 /usr/bin/crontab

    ```


    The second problem arises from the ability to restrict the cron to specific users.
    This ability is controlled by pairs of files in /var/adm/cron. Access to cron
    (i.e., the ability to run the crontab command) is controlled by'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 11.3 The cron Facility


    If the "cron.allow" file exists, cron access is restricted to those users listed
    in the file. If "cron.allow" doesn''t exist, then all users except those listed
    in "cron.deny" (if it exists) are allowed to use cron. Normally, neither file
    exists, only the root user can schedule a cron job. Normally, "cron.allow" and
    "cron.deny" are an empty file, meaning that all users have access to cron or are
    controlled in similar fashion by "at.allow" and "at.deny" files.


    If you intend to restrict access to cron, these files may be doing exactly what
    you want. However, if a user is unable to schedule a job and your intention is
    to restrict that user, check for one or more of the following situations:


    +   - The "cron.allow" file exists and the user is not listed in it.

    - The "cron.deny" file exists and the user is listed in it.

    - The "cron.deny" file doesn''t exist.


    # Before you call support


    Before calling technical support for a cron problem, check the following:


    +   - Ensure that one (and only one) copy of the cron daemon is running.

    - Try restarting cron with /sbin/init.d/cron restart.

    - Verify the executable files /usr/bin/crontab and /usr/bin/at are setuid root.

    - Check the /var/spool/cron/crontabs directory for empty files belonging to a
    user whose account has been removed.

    - Check the "cron.allow," "cron.deny," "at.allow," and "at.deny" files as described
    above.'
  merge: -1
  img_proc: true
