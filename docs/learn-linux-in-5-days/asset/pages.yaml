  md: '# Secret Decoder Ring for Permissions


    Now you have enough background information to start decoding the permissions string.
    The first character is the type. the next three characters represent the permissions
    available to the user, also known as the owner of the file. The next three characters
    represent the permissions available to the members of the file''s group. The final
    three characters represent the permissions available to all others.


    In this case order has meaning. Permission types will be displayed for user, followed
    by group, and finally for others. Also, the permission types of read, write, and
    execute are displayed in that order. If a particular permission is not granted
    a hyphen (--) will take its place.


    Here is a graphical representation of the permission information displayed by
    ls -1.


    ![](img/95537d0c63f8d4551bf141591350cad2_76_0.png)


    If you happen to see an extra character at the end of the permissions an alternative
    access control method has been applied. If you see a period (.), the file or directory
    has an SELinux (Security Enhanced Linux) security context applied to it. If you
    see a plus sign (+), ACLs (Access Control Lists) and ACLs are beyond the scope
    of this book. However, you will be pleased to know that the use of either of these
    is rare. If you having troubles with permissions and notice an extra character
    in the permissions string, know that further investigation may be necessary.


    ```

    $ ls -1 sales.data.selnx

    --rw-r----. 1 bob users 10400 Sep 27 08:52 sales.data.selnx

    $ ls -1 sales.data.acl

    -rw-r--+ 1 bob users 10400 Sep 27 08:52 sales.data.acl

    ```'
