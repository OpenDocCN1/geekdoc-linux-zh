    # Vi Modes


    # Command Mode


    Vi has the concept of modes. You are always working in one of three modes: command
    mode, insert mode, or line mode. When vi starts you are placed into command mode.
    To get back to command mode at any time hit the escape key (Esc). Letters typed
    while command mode are not sent to the file, but are rather interpreted as commands.
    Command mode allows you to navigate about the file, perform searches, delete text,
    copy text, and paste text.


