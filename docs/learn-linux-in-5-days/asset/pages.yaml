  md: '# COMPARING FILES


    If you want to compare two files and display the differences you can use diff,
    sdiff, or vimdiff.


    diff file1 file2 - Compare two files.


    sdiff file1 file2 - Compare two files side by side.


    vimdiff file1 file2 - Highlight the differences between two files in the vim editor.


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: Abee!

    $ cat secret.bak

    site: facebook.com

    user: bob

    pass: bee

    $ diff secret secret.bak

    3c3

    ```'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# LEARN LINUX IN 5 DAYS


    ```

    < pass: Abee!

    ---

    > pass: bee

    $ diff secret secret.bak

    site: facebook.com   site: facebook.com

    user: bob           user: bob

    pass: Abee!         | pass: bee

    ```


    In the **diff** output, the text following the less-than sign (<) belongs to the
    first file. The text following the greater-than sign (>) belongs to the second
    file. The first line of the diff output provides some additional information.
    The first number represents line numbers from the first file and the second number
    represents lines from the second file. The middle character will be a **c** meaning
    change, a **d** meaning deletion, or an **a** meaning addition. In this example
    the third line of the first file is changed from "pass: Abee" to the text on the
    third line in the second file which is "pass: bee."


    In the diff output the pipe (|) means that the text differs in the files on that
    line. You will also see the less-than sign (<) meaning that line only exists in
    the first file. The greater-than sign (>) means that line only exists in the second
    file.


    Here is a screenshot of **vimdiff** **secret** **secret.bak** demonstrating how
    the changes are highlighted using color.


    ![](img/95537d0c63f8d4551bf141591350cad2_112_0.png)'
