  md: '# GETTING CONNECTED


    When your account is created you will be provided with details on how to connect
    to the Linux server. You may be provided with some or all of the following information:


    +   - Username. This is also known as an account, login, or ID.

    - Password

    - SSH key

    - Server name or IP address

    - Port number

    - Connection protocol


    The connection protocol will either be SSH (Secure Shell) or telnet. SSH and telnet
    provide ways to connect to a server over the Internet or a local area network.
    In the vast majority of cases the connection protocol will be SSH. Telnet is practically
    obsolete at this point, however you may run into it if you need to access a legacy
    system.'
  merge: -1
  pgno: 13
