    # Default Permissions and the File Creation Mask


    The file creation mask is what determines the permissions a file will be assigned
    upon its creation. The mask restricts or masks permissions, thus determining the
    ultimate permission a file or directory will be given. If no mask were present
    directories would be created with 777 (rwrwxrwx) permissions and files would be
    created with 666 (rw-rw-rw--) The mask and is typically set by the system administrator,
    but it can be overridden on per account basis by including a umask statement in
    your personal initialization files.


    umask [-S] [mode] - Sets the file creation mask to mode if specified. If it is
    omitted, the current mode will be displayed. Using the -S argument allows umask
    to display or set the mode with symbolic notation.


    The mode supplied to umask works in the opposite way as the mode given to chmod.
    When you supply 7 to chmod, that is interpreted to mean all permissions or rwx.
    When you supply 7 to umask, that is interpreted to mean all permissions off or
    ---. Think of chmod as turning on, adding, or giving permissions. Think of umask
    as turning off, subtracting, or taking away permissions.


    A quick way to estimate what a umask will do to the default permissions is to
    subtract the octal mask mode from 777 in the case of directories and 666 in the
    case of files. Here is an example of a umask 022 which is typically the default
    umask used by Linux distributions or set by system administrators.'
