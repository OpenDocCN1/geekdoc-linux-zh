  md: '# DETERMINING A FILE''S TYPE


    There are file clues as to what a file might contain. For instance, some files
    will have extensions. If a file ends in .txt, it is probably a text file. If a
    file has execute permissions, it might be a program. An easy way to determine
    the type of a file is to run the file command against it.


    file file - Display the file type.


    ```

    $ file /etc/passwd

    /etc/passwd: ASCII text

    $ file *

    bin: directory

    bob.tar: POSIX tar archive

    test.data: data

    test.txt: ASCII English text

    email-reports.sh: Bourne-Again shell script, ASCII

