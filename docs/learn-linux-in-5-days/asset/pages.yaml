  md: '# FINDING FILES


    If you ever need to locate a file or directory you can use the find command. It
    can be used to find files by name, size, permissions, owner, modification time,
    and more.


    find [path...] [expression] - Recursively finds files in path that match expression.
    If no arguments are supplied it finds all files in the current directory.


    ```

    $ find

    ./profile

    ./bash_history

    ./PerfReviews

    ./PerfReviews/Fred

    ./PerfReviews/current

    ./PerfReviews/current/tps-violations.log

    ./PerfReviews/John

    ./sales.data

    ...

    ```


    Here are some useful ways in which to use the find command.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# LEARN LINUX IN 5 DAYS


    find -name pattern - Displays files whose name matches pattern. This is case sensitive.


    find -iname pattern - Same as -name, but ignores case.


    find -ls - Performs an ls on each of the found files or directories.


    find -mtime num_days - Finds files that are num_days old.


    find -newer file - Finds files that are newer than file.


    find -exec command {} \ - Run command against all the files that are found.


    Let''s look at some examples. Let''s say you are looking for a file or directory
    named "apache." You think it is in /opt somewhere and are not quite sure if it
    is "Apache" or "apache." You could provide find with the path of /opt, use -iname
    to ignore case, and look for "apache"


    ```

    $ find /opt -iname apache

    /opt/web/Apache

    ```


    To find all the files in /usr/local that end in "conf", you can use this command.


    ```

    $ find /usr/local -name *conf

    /usr/local/etc/dhcpd.conf

    /usr/local/etc/httpd.conf

    ```


    If you are looking for files that are more than 10 days old, but less than 13
    days old in the current directory you can use this command.


    ```

    $ find -mtime +10 -mtime -13

    ./.profile

    ./PerfReviews

    ```'
  merge: -1
