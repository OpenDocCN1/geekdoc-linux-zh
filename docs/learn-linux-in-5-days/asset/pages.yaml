    since spaces are typically ignored by the shell. Single quotes or double quotes
    work the same in this situation.


    ```

    $ strings BlueTrain.mp3|grep -i john|head -1|cut -d '' '' -f2

    Coltrane

    $

    ```


    You will find that there many small commands that do just one well. Some examples
    are awk, cat, cut, fmit, join, less, more, nl, pr, sed, seq, sort, tr, and uniq.
    Let''s take an example using some of those commands and chain them together with
    pipes.


    The /etc/passwd file contains a list of accounts on the system and information
    about those accounts. In this example, the goal is to find all of the users named
