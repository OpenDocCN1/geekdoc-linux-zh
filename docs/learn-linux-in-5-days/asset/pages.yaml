    # Creating Aliases


    If you find yourself typing the same command over and over again, you can create
    a shortcut for it called an alias. An alias can be thought of as a text expander.
    Creating aliases for commands that are really long also a common practice. For
    example, if you type `ls -l` frequently, you may want to abbreviate it to `ll`.
    As a matter of fact, this alias often comes predefined on many Linux distributions.


    alias [name[value]] - List or create aliases. If no arguments provided the current
    list of aliases is displayed. Use name=value to create a new alias.


    ```

    $ ls -l

    total 4

    -rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt

    $ alias ll1=''ls -l''

    $ ll

    total 4

    -rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt

    $ alias

    alias egrep=''egrep --color=auto''

    alias fgrep=''fgrep --color=auto''

    alias grep=''grep --color=auto''

    alias l=ls=''ls -CF''

    alias la=ls=''ls -A''

    alias ll=ls=''ls -1''

    alias ls=ls=''ls --color=auto''

    $

    ```


    You can even use aliases to fix common typing errors. If you find yourself typing
    `grep` when you intend to type `grep`, create an alias.


    ```

    $ alias grpe=''grep''

    ```


    Aliases can be created to make your work environment similar to that of'
