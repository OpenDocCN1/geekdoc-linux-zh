    # Connecting via Telnet


    Telnet used to be the de facto way to connect to a Unix or Linux server. Over
    the years telnet has been replaced with Secure Shell, abbreviated SSH. SSH is,
    as its name implies, more secure than telnet. Telnet sends your login credentials
    over the network in plain text. SSH encrypts the communications between the client
    and the server, thus greatly improving security. If someone were to be packet
    snooping or eavesdropping on your connection, they would see garbled text and
    random characters. If you do have a need to telnet to a system you can use the
    SSH instructions from above, but with a couple of minor changes.


    # Connecting via Telnet from Windows


    Run PuTTY and select the Telnet radio button. If no port was given to you, leave
    it at the default value of 23. You will be prompted for username and password
    when you connect to the server.'
