  md: '# WORKING WITH DIRECTORIES


    Directories are simply containers for files and other directories. They provide
    a tree like structure for organizing the system. Directories can be accessed by
    their name and they can also be accessed using a couple of shortcuts. Linux uses
    the symbols . and .. to represent directories. Think of . as "this directory"
    and .. as and "the parent directory."


    | Symbol | Description |


    | . | This directory.


    | .. | The parent directory.


    | / | Directory separator. Directories end in a forward slash and this is often
    assumed.


    The directory separator is optional for the last subid in a path or command. For
    example, the following commands work identically.


    ```

    $ cd /var/tmp

    $ cd /var/tmp/

    ```'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Using the shortcuts can make navigating easier. For example, type cd.. to go
    to the directory just above your current directory.


    ```

    $ pwd

    /home/bob

    $ cd tpsreports

    $pwd

    /home/bob/tpsreports

    $ cd ..

    $pwd

    /home/bob

    $ cd ..

    $pwd

    /home

    $ cd .

    $pwd

    /home

    ```


    The cd .. command did not take you anywhere. Remember that . is "this directory"
    and .. is the "parent directory." Another shortcut for navigating directories
    is cd -. This command takes you to the previous directory. The environment variable
    that represents your previous working directory is OLDPWD. So, cd - and cd $OLDPWD
    are equivalent.


    ```

    $pwd

    /home/bob

    $ cd /var/tmp

    $pwd

    /var/tmp

    $ echo $OLDPWD

    /home/bob

    $ cd -

    /home/bob

    $

    ```


    How would you execute a command that is in your current directory? Assume your
    current directory is your home directory. By default your home directory is not
    in your $PATH. Here is how to do that.'
