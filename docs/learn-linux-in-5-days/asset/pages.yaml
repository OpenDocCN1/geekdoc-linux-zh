    | Base Permission | 777 | 666 |

    | Minus Umask | -022 | -022 |

    | Creation Permission | 755 | 644 |


    Using a umask of 002 is ideal for working with members of your group. You will
    see that when files or directories are created the permissions allow members of
    the group to manipulate those files and directories.


    | Dir | File |

    |---|---|

    | Base Permission | 777 | 666 |

    | Minus Umask | -002 | -002 |

    | Creation Permission | 755 | 644 |


    Here is another possible umask to use for working with members of your group.
    You Use 007 so that no permissions are granted to users outside of the group.


    | Dir | File |

    |---|---|

    | Base Permission | 777 | 666 |

    | Minus Umask | -007 | -007 |

    | Creation Permission | 770 | 660 *


    Again, using this octal subtraction method is a good estimation. You can see that
    the method breaks down with the umask mode of 007. In reality, to get an accurate
    result each time you need to convert the octal permissions into binary values.
    From there you use a bitwise NOT operation on the umask mode and perform a bitwise
    AND operation against that and the base permissions.


    It is fine to gloss over the subtleties here since there are only a few practical
    umask modes to use. They are 022, 002, 077, and 007. Save yourself the binary
    math homework and look at the following table containing all the resulting permissions
    created by each one of the eight mask permutations.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# JASON CANNON


    | Octal | Binary | Dir Perms | File Perms |

    |---|---|---|--|

    | 0 | 000 | rwx | rw- |

    | 1 | 001 | rw- | rw- |

    | 2 | 010 | r-x | r-- |

    | 3 | 011 | r-- | r-- |

    | 4 | 100 | -wx | -w- |

    | 5 | 101 | -w- | -w- |

    | 6 | 110 | --x | --- |

    | 7 | 111 | --- | --- |


    # Special Modes


    Look at this output of umask when the mask is set to 022.


    ```

    $ umask

    0022

    ```


    You will notice an extra leading 0. So far you have only been dealing with three
    characters that represent permissions for user, group, and other. There is a class
    of special modes. These modes are setuid, setgid, and sticky. Know that these
    special modes are declared by prepending a character to the octal mode that you
    normally use with umask chmod. The important point here is to know that umask
    0022 is the same as umask 022. Also, chmod 644 is the same as chmod 0644.


    Even though special modes will not be covered in this book, here they are for
    your reference. There are links at the end of this chapter so you can learn more
    about these modes if you are so inclined.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# LEARN LINUX IN 5 DAYS


    setuid permission - Allows a process to run as the owner of the file, not the
    user executing it.


    setgid permission - Allows a process to run with the group of the file, not of
    the group of the user executing it.


    sticky bit - Prevents a user from deleting another user''s files even if they
    would normally have permission to do so.


    # umask Examples


    Here are two examples of the effects umask modes have on file and directory creation.


    ```

    $ umask

    0022

    $ umask -S

    u=rwx,g=rx,o=rx

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxr-xr-x 2 bob users 4096 Dec 5 00:03 a-dir

    -rw-r---- 1 bob users 0 Dec 5 00:03 a-file

    $ rmdir a-dir

    $ rm a-file

    $ umask 007

    $ umask

    0007

    $ umask -S

    u=rwx,g=rwx,o=

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxrwx--- 2 bob users 4096 Dec 5 00:04 a-dir

    -rw-rw---- 1 bob users 0 Dec 5 00:04 a-file

    ```'
  merge: -1
