  md: '# REIRECTION


    You have already learned how to redirect output from one command and send it as
    input to another one by using pipes. In the previous example you saw another way
    to redirect output using the greater-than (>) sign. Let''s take a closer look
    at I/O (input/output) redirection.


    There are three default types of input and output. They are standard input, standard
    output, and standard error. By default, standard input comes from the keyboard
    and standard output and standard error are displayed to the screen. Each of these
    I/O types is given a file descriptor. File descriptors are just numbers that represent
    open files. For humans it is easier for to reference files by name, but it is
    easier for computers to reference them by number.


    You may be thinking, "my keyboard isn''t a file, nor is my screen." On one level
    it is true, but on another level it is not. Linux represents practically everything
    as a file. This abstraction allows you to do powerful things like take the standard
    output of one command that would normally be displayed to your screen and use
    it as input to another command. It''s easier to run `cat file.txt | sort` than
    it is to type the entire contents of `file.txt` as the input to the `sort`'
  merge: -1
  pgno: 134
- img_proc: true
