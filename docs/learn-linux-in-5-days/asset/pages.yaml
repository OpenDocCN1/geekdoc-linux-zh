  md: '# Sudo - Super User Do


    Another way to switch users or execute commands as others is to use the sudo command.
    Sudo allows you to run programs with the security privileges of another user.
    Like su, if no username is specified it assumes you are trying to run commands
    as the superuser. This is why sudo is referred to as super user do. It is commonly
    used to install, start, and stop applications that require superuser privileges.


    sudo - Execute a command as another user, typically the superuser.


    One advantage of using su command is that you do not need to know the password
    of the other user. This can eliminate the issues that arise from using shared
    passwords and generic accounts. When you execute the sudo command you are prompted
    for your password. If the sudo configuration permits access, the command is executed.
    The sudo configuration is typically controlled by the system administrator and
    requires root access to change.


    # Using Sudo


    Here are the common ways to use the sudo command.


    +   sudo -l - List available commands.


    +   sudo command - Run command as the superuser.


    +   sudo -u root command - Same as sudo command.


    +   sudo -u user command - Run command as user.


    +   sudo su - Switch to the superuser account.


    +   sudo su - Switch to the superuser account with an environment like you would
    expect to see if you had logged in as that user.'
  merge: -1
