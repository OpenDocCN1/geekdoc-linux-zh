  md: '# CREATING A COLLECTION OF FILES


    If you want to bundle a group of files and/or directories together in an archive,
    you can use the tar command. You may want to create a copy or backup of a group
    of files. You may have several files you want to transfer at once or as a set.
    In these situations, tar can help.


    tar [-] c|x|t tarfile [pattern] - Create, extract or list contents of a tar archive
    using pattern, if supplied.


    You will notice that tar does not require a hyphen (-) to precede its arguments.
    Traditionally the hyphen is excluded, but tar still works with it. If you see
    tar cf file.tar it is the same as tar -cf file.tar. Here is a look at some of
    the most commonly used tar options.


    +   - c - Create a tar archive.


    +   - x - Extract files from the archive.


    +   - t - Display the table of contents (list).


    +   - v - Causes tar to be verbose.'
