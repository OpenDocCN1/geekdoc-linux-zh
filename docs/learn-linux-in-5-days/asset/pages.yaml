    Ctrl-r - Reverse search. Search for commands in your history.


    You can search for commands in your history. For example, if you have the command
    find /var/tmp -type f in your shell history could find it by typing Ctrl-r Enter.
    Ctrl-r initiates the reverse search and displays the prompt, fi is the search
    string, and Enter executes the command that was found. You do not have to search
    for the start of the string. You could have very well searched for "var", "tmp",
    or "type."


    ```

    $ find /var/tmp -type f

