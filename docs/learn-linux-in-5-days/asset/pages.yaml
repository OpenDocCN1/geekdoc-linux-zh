  md: '# COMPRESSING ARCHIVES


    In modern versions of the tar command gzip compression is built-in. If you want
    to create, extract, or list the contents of a compressed archive use the -z argument.
    As a matter of convention compressed tar files will end in either .tar.gz or .tgz.
    Here is how this looks.


    ```

    $ tar zcf tps.tgz tpsreports

    $ ls *.tgz

    tps.tgz

    $ tar zf tps.tgz

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $

    ```


    If you run across an older version of tar without gzip compression built-in, you
    can use pipes to create compressed archives. When a hyphen (-) is used in place
    of a file name that means to use standard output. Running the command tar cf -
    pattern will create an archive of "pattern" and send the output to standard output
    which is normally your screen. If you follow the command with a pipe that standard
    output will be used as the input for the next command following the pipe. To force
    gzip to send its output to standard out,'
