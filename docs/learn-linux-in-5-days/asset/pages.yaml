  md: '# DELETING, COPYING, MOVING, AND RENAMING FILES


    # Removing Files


    Eventually you will get tired of all the old files you created just laying around,
    cluttering up your home directory, and taking up precious space. To delete them,
    use the `rm` command.


    rm file - Remove file.


    rm -r directory - Remove the directory and its contents recursively. If you want
    to remove a directory with `rm`, you have to supply the `-r` argument.


    rm -f file - Force removal and never prompt for confirmation.


    Search patterns can be used to delete multiple files at once. It''s a good idea
    to double check what you are going to remove with `ls` before you execute `rm`.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '```

    $ ls s*

    sales-lecture.mp3 sales.data secret secret.bak

    $ rm -d *.

    . . . .profile.bash_history

    $ rm *

    rm: cannot remove ''.\'': Is a directory

    rm: cannot remove ''..'': Is a directory

    $ ls -d *

    . . .

    ```


    Note that rm * will not remove . (this directory) and . . (the parent directory).


    # # Copying Files


    To copy files, use the cp command. If you want to create a copy of a file you
    can run cp source_file destination_file. You can also copy a file, or a series
    of files, to a directory by using cp file(s) dir.


    cp source_file destination_file - Copy source_file to destination_file.


    cp source_filel [source_fileN ...] destination_directory - Copy source_files to
    destination_directory.


    cp -i source_file destination_file - Run cp in interactive mode. If the destination_file
    exists, cp will prompt you before it overwrites the file.


    cp -r source_directory destination - Copy source_directory recursively to destination.
    If destination exists, copy source_directory into destination, otherwise create
    destination with the contents of directory.'
