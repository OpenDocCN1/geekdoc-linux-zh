    \ used with chmod, convert the binary representation into base 10 (decimal). The\
    \ shortcut here is to remember that read equals 4, write equals 2, and execute\
    \ equals 1. The permissions number is determined by adding up the values for each\
    \ permission type. There are eight possible values from zero to seven, hence the\
