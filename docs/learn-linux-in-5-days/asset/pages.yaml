  md: 'LEARN LINUX IN 5 DAYS


    # Choosing an SSH Client


    If you were given a specific SSH client to use, use that program and follow the
    documentation for that product. If you are free to choose your own client or were
    not provided one, I suggest using PuTTY for Windows or Terminal for Mac.


