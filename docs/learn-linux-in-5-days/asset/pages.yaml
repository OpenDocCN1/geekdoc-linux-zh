    ccc

    ddddd

    $ cat file.txt

    ddddd

    a

    ccc

    bb

    $ cat file.txt | sort

    a

    bb

    ccc

    ddddd

    $

    ```


    | I/O Name | Abbreviation | File Descriptor Number |

    |---|---|---|

    | standard input | stdin | 0 |

    | standard output | stdout | 1 |

    | standard error | stderr | 2 |


    Use the greater-than sign (>) to redirect output and the less-than sign (<) to
    redirect input. The explicit way of using redirection is to provide a'
