  md: '# Killing Processes


    Ctrl-c - Kills the foreground process.


    kill [signal] pid - Send a signal to a process.


    kill -l - Display a list of signals.


    The default signal used by kill is termination. You will see this signal referred
    to as SIGTERM or TERM for short. Signals have numbers that correspond to their
    names. The default TERM signal is number 15. So running kill pid, kill -15 pid,
    and kill -TERM pid are all equivalent. If a process does not terminate when you
    send it the TERM signal, use the KILL signal which is number 9.


    ```

    $ ps | grep hard-to-stop

    27398 pts/1 00:00:00 hard-to-stop

    $ kill 27398

    $ ps | grep hard-to-stop

    27398 00:00:00 hard-to-stop

    $ kill -9 27398

    $ ps | grep hard-to-stop

    $

    ```


