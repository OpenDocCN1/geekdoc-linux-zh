  md: "order has meaning. Permissions are always in read, write, and execute order.\
    \ If r, w, and x are all set to off, the binary representation is 000. If they\
    \ are all set to on, the binary representation is 111. To represent read and execute\
    \ permissions while omitting write permissions, the binary number is 101.\n\n\
    | r | w | x | | \n| 0 | 0 | 0 | Binary Value for off |\n| 1 | 1 | 1 | Binary Value\
    \ for on |\n| r | w | w | | \n| 0 | 0 | 0 | Base 10 (decimal) value for off |\n\
