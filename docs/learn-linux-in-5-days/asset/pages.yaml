  md: '# TEACH YOURSELF TO FISH


    Knowing where executable commands live and the man command take you a long way.
    You can teach yourself how to use Linux with this method, but it would be a long,
    slow process. More often than not, the man command will be used as a quick reference.
    It would be nearly impossible to memorize every option for every command and there
    is no need to do so when you have the man command at your fingertips.


    To get help for the man command type the letter h while viewing a manual page.
    That will give you a list of commands you can use to navigate or search. Here
    is the concise version.


    Enter - Move down one line.


    Space - Move down one page.


    g - Move to the top of the page.


    G - Move to the bottom of the page.


    q - Quit.


    An environment variable is a storage location that has a name and a'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# LEARN LINUX IN 5 DAYS


    value. The one we are interested in at the moment is PATH. The PATH environment
    variable contains a list of directories that contain executable commands. You
    can determine the value of PATH by prepending it with a dollar sign ($PATH) and
    using the echo command to display its value to the screen.


    ```

    $ echo $PATH

    /bin:/usr/bin:/usr/sbin:/usr/local/bin

    ```


    When you type a command at the prompt and press Enter, that command will be searched
    for in the directories in $PATH. In this example, /bin will be searched first.
    If the command is found it will be executed. If it is not found, then /usr/bin
    will be searched and so on. If no executable command is found that matches your
    request, you will be politely told that it cannot be found.


    ```

    $ whatsupdoc

    -bash: whatsupdoc: command not found

    ```


    If you want to know exactly where a command is located you can use the which command.
    If the program cat is located in /usr/bin and in /usr/local/bin, the one which
    will get executed depends on your $PATH.


    ```

    $ which cat

    /bin/cat

    $ which tac

    /usr/bin/tac

    ```


    Putting all this together, you can start looking at what is in each directory
    in your $PATH and use the man command to discover what each one of them does and
    how to use them. Remember, to exit the man command type the letter q.


    ```

    $ echo $PATH

    /bin:/usr/bin:/usr/sbin:/usr/local/bin

    $ cd /bin

    $ ls

    awk diff cal cat cp date du echo grep groups list

    ```'
