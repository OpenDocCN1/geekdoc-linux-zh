    $ grep bob passwd | cut -f1,5 -d:

    bob:Bob

    bobjr:Robert Downey

    bobb:Bob Hope

    bobs:Bob Saget

    bobd:Bob Dylan

    bobb:Bob Barker

    $ grep bob passwd | cut -f1,5 -d: | sort

    bob:Bob

    bobb:Bob Barker

    bobd:Bob Dylan

    bobjr:Robert Downey

    bobb:Bob Hope

    ```


    112'
