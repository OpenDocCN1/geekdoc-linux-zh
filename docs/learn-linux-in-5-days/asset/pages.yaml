    this simple concept of piping makes Linux extremely powerful.


    # Pipe Output to a Pager


    Another common use of pipes is to control how output is displayed to your screen.
    If a command produces a significant amount of output it can scroll off your screen
    before you have the chance to examine it. To control the output use a pager utility
    such as more or less. You have already used these commands directly on files,
