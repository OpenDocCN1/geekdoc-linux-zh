  md: '# Exporting Environment Variables


    When a process is started it inherits the exported environment variables of the
    process that spawned it. A variable that is set or changed only effects the current
    running process unless it is exported. The variables that are not exported are
    called local variables. The **export** command allows variables to be used by
    subsequently executed commands. Here an example.


    ```

    $ echo $PAGER


    $ PAGER=less

    $ echo $PAGER

    less

    $ bash

    $ echo $PAGER


    $ exit

    exit

    $ export PAGER=less

    $ bash

    $ echo $PAGER

    less

    $ exit

    exit

    ```


    In the above example **PAGER** was defined in the current environment. When you
    start a child process it inherits all the environment variables that were exported
    in your current environment. Since PAGER was not exported it was not set in the
    spawned bash shell. When you exported PAGER you saw that it was indeed available
    in the child process.'
  merge: -1
