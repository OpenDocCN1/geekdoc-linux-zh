    ## Listing Files Recursively


    Using the -R option with ls causes files and directories to be displayed recursively.


    ```

    $ ls -R

    .:

    PerfReviews lecture.mp3 tpsreports

    ./PerfReviews:


    John old


    ./PerfReviews/old:

    Jane.doc

    $

    ```


    You can also use the tree command for more appealing output. If you only want
    to see the directory structure, use tree -d.


