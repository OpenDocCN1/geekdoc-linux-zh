    \ hard-to-stop\n$ kill 27398\n$ ps | grep hard-to-stop\n27398 00:00:00 hard-to-stop\n\
    $ kill -9 27398\n$ ps | grep hard-to-stop\n$\n```\n\n# Deep Dive\n\n- Bash Documentation\
    \ on Job Control\n  http://gnu.org/software/bash/manual/html_node/Job-Control.html\n\
    \n# SCHEDULING REPEATED JOBS WITH CRON\n\nIf you need to repeat a task on a schedule,\
    \ you can use the cron service. Every minute the cron service checks to see if\
    \ there are any scheduled jobs to run and if so runs them. Cron jobs are often\
    \ used to automate a process or perform routine maintenance. You can schedule\
    \ cron jobs by using the crontab command.\n\ncron - A time based job scheduling\
    \ service. This service is typically started when the system boots.\n\ncrontab\
    \ - a program to create, read, update, and delete your job schedules.\n\nA crontab\
    \ (cron table) is a configuration file that specifies when commands are to be\
    \ executed by cron. Each line in a crontab represents a job and contains two pieces\
    \ of information: 1) when to run and 2) what to run. The time specification consists\
    \ of five fields. They are minutes, hour, day of the month, month, and day of\
    \ the week. After the time specification you provide the command to be executed.\n\
    \n# Crontab Format\n\n| * * * * command | | | | |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| | | | Day of the Week (0-6) | |\n| | | | Month of the Year (1-12)\
    \ | |\n| | | Day of the Month (1-31) | | |\n| | | Hour (0-23) | | |\n| | | |\n\
    \nThe command will only be executed when all of the time specification fields\
    \ match the current date and time. You can specify that a command be run only\
    \ once, but this is not the typical use case for cron. Typically, one or more\
    \ of the time specification fields will contain an asterisk (*) which matches\
    \ any time or date for that field. Here is an example crontab.\n\n```\n# Run every\
    \ Monday at 07:00.\n0 7 * * 1 /opt/sales/weekly-report\n```\n\nHere is a graphical\
    \ representation of the above crontab entry.\n\n```\n0 7 * * 1 /opt/sales/bin/weekly-report\n\
    | | |--- Day of the Week (0-6) |\n| |++++ Month of the Year (1-12) |\n| |+ Day\
    \ of the Month (1-31) |\n| +------ Hour (0-23) |\n||+------ Minute (0-59) |\n\
    ```\n\nThis job will run only when the month is 0, the hour is 7, and the day\
    \ of the week is 1. In the day of the week, 0 represents Sunday, 1 Monday, etc.\
    \ This job will run on any day and during any month since the asterisk was used\
    \ for those two fields.\n\nIf any output is generated by the command it is mailed\
    \ to you. You can check your local mail with the mail command. If you prefer not\
    \ to get email you can redirect the output of the command as in this example.\n\
    \n```\n# Run at 02:00 every day and send output to a log.\n0 2 * * * /opt/acme/bin/backup\
    \ > /tmp/backup.log 2>&1\n```\n\nYou can provide multiple values for each of the\
    \ fields. If you would like to run a command every half-hour, you could do this.\n\
    \n```\n# Run every 30 minutes.\n0,30 * * * /opt/acme/bin/half-hour-check\n```\n\
    \n```\n# Another way to do the same thing.\n*/2 * * * /opt/acme/bin/half-hour-check\n\
    ```\n\nInstead of using 0,30 for the minute field you could have used */2. You\
    \ can even use ranges with a dash. If you want to run a job every minute for the\
    \ first four minutes of the hour you can use this time specification: 0-4 * *\
    \ * command.\n\nThere are several implementations of the cron scheduler and some\
    \ allow you to use shortcuts and keywords in your crontabs. Common keywords have\
    \ been provided below, but refer to the documentation for cron on your system\
    \ to ensure these will work.\n\n| Keyword | Description | Equivalent |\n| :---\
    \ | :--- | :--- |\n| @yearly | Run once a year at midnight in the morning of January\
    \ 1 | 0 0 1 1 * |\n| @annually | Same as @yearly | 0 0 1 1 * |\n| @monthly | Run\
    \ once a month at midnight in the morning of the first day of the month | 0 0\
    \ 1 * * |\n| @weekly | Run once a week at midnight in the morning of Sunday |\
    \ 0 0 * * 0 |\n| @daily | Run once a day at midnight | 0 * * * * |\n| @midnight\
    \ | Same as @daily | 0 * * * * |\n| @hourly | Run once an hour at the beginning\
    \ of the hour | 0 * * * * |\n| @reboot | Run at startup | N/A |\n\n# Using the\
    \ Crontab Command\n\nUse the `crontab` command to manipulate cron jobs.\n\n```\n\
    crontab file - Install a new crontab from file.\ncrontab -l - List your cron jobs.\n\
    crontab -e - Edit your cron jobs.\ncrontab -r - Remove all of your cron jobs.\n\
    ```\n\n```\n$ crontab -l\nno crontab for bob\n$ cat my-cron\n# Run Every Monday\
    \ at 07:00.\n0 * * * 1 /opt/sales/bin/weekly-report\n$ crontab my-cron\n$ crontab\
    \ -l\n# Run Every Monday at 07:00.\n0 * * * 1 /opt/sales/bin/weekly-report\n$\
    \ crontab -e\n# #EDITOR is invoked.\n$ crontab -r\n$ crontab -l\nno crontab for\
    \ bob\n$\n```\n\n# Deep Dive\n\n- CronWFT - Decodes crontab lines. Print out human\
    \ readable output.\n  http://cronwtf.github.io/\n\n- CronMaker - A utility which\
    \ helps you to build cron expressions.\n  http://www.cronmaker.com/\n\n# SWITCHING\
    \ USERS AND RUNNING COMMANDS AS OTHERS\n\n# su\n\nOne way to start a session as\
    \ another user on the system is to use the su command.\n\nOne way to start a session\
    \ as another user on the system is to use the su command. If no username is specified\
    \ it assumes you are trying to become the superuser. This is why su is referred\
    \ to as super user do.\n\nsu [username] - Change user or become superuser\n\n\
    Common su options:\n\n- A hyphen is used to provide an environment like you would\
    \ expect if you had logged in as that user.\n- c - Specify a command to be executed.\
    \ If the command is more than one word, it needs to be quoted.\n\n```\nbob@linuxsvr:~$\
    \ export TEST=1\nbob@linuxsvr:~$ su oracle\nPassword:\noracle@linuxsvr:/home/bob$\
    \ echo $TEST\n1\noracle@linuxsvr:/home/bob$ pwd\n/home/bob\noracle@linuxsvr:~$\
    \ exit\nbob@linuxsvr:~$ su -c 'echo $ORACLE_HOME' oracle\nPassword:\n/u01/app/oracle/product/current\n\
    bob@linuxsvr:~$\n```\n\n```\n\nIf you want to know what user you are working as,\
    \ run the whoami command.\n\nwhoami - Displays the effective username.\n\n```\n\
    $ whoami\nbob\n$ su oracle\nPassword:\n$ whoami\noracle\n$\n```\n\n# Sudo - Super\
    \ User Do\n\nAnother way to switch users or execute commands as others is to use\
    \ the sudo command. Sudo allows you to run programs with the security privileges\
    \ of another user. Like su, if no username is specified it assumes you are trying\
    \ to run commands as the superuser. This is why sudo is referred to as super user\
    \ do. It is commonly used to install, start, and stop applications that require\
    \ superuser privileges.\n\nsudo - Execute a command as another user, typically\
    \ the superuser.\n\nOne advantage of using su command is that you do not need\
    \ to know the password of the other user. This can eliminate the issues that arise\
    \ from using shared passwords and generic accounts. When you execute the sudo\
    \ command you are prompted for your password. If the sudo configuration permits\
    \ access, the command is executed. The sudo configuration is typically controlled\
    \ by the system administrator and requires root access to change.\n"
