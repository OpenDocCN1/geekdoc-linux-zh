    Editing in nano is quite easy. The up and down arrow keys will take you to the
    previous or next lines let you navigate forwards and backwards on the same line.
    Simply type the desired text into the editor. To save the file, type Ctrl-o. If
    you forget to save the file before you exit, nano will ask you if you want to
    save the file. To learn more type Ctrl-g for help.


