    # LINUX 目录结构


    现在你已经能够连接到服务器并熟悉了你将要使用的界面，是时候学习目录布局了。理解目录结构将对你未来在系统上搜索组件时非常有帮助。它可以帮助你回答这类问题：


    - 程序存位于哪里？

    - 配置文件存在哪里？

    - 我可以在哪里找到此应用程序的日志文件？


    # 常见目录


