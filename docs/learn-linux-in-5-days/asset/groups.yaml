    # Working with Spaces in Names


    If you want to make your life easier when working from the command line, do not
    use spaces in file and directory names. Hyphens (-) or underscores (_) can be
    good substitutes for spaces. CamelCase, the practice of capitalizing each word,
    is another good option. For example, instead of naming your latest literary "the
    next great american novel.txt" you could use "the-next-great-american-novel.txt",
    "the_next_great_american_novel.txt" or even "TheNextGreatAmericanNovel.txt."


    Sooner or later you will encounter a file or directory that contains a space in
    the name. There are two ways to deal with this. The first is to use quotation
    marks. Even though the file name is a file, operate on it using "a file." The
    second option is to escape the space. Escaping is like using quotes, but for single
    characters. The escape symbol is \, also known as a backslash. To escape a space,
    precede the space with the backslash (\) character.


    ```

    $ ls -l

    -rw-r--r-- 1 bob users 18 Oct 2 05:03 a file

    $ ls -l a file

    ls: a: No such file or directory

    ls: file: No such file or directory

    $ ls -l "a file"

    -rw-r--r-- 1 bob users 18 Oct 2 05:03 a file

    $ ls -l a\\

    -rw-r--r-- 1 bob users 18 Oct 2 05:03 a file

    $ ls -lb a*

    -rw-r--r-- 1 bob users 18 Oct 2 05:03 a\\

    $

    ```


    The -b option to ls causes it to print escape codes. Note that quoting and escaping
    not only applies to spaces, but with other special characters as well including
    | & '' ; ( ) > space tab.


