    # 您的免费礼物


    感谢阅读《5天学会Linux》，我想送给你一份《Linux 版 Windows 替代应用程序》。在书中，你将了解到今天 Linux 上超过 50 个最流行的应用程序。这些应用程序将允许你浏览网页、观看电影、听音乐、连接你喜爱的社交网络、创建演示文稿等。这份礼物是本书的完美补充，将在你的
    Linux 之旅中提供帮助。请访问 http://www.linixtrainingacademy.com/linux-apps 下载你的免费礼物。


    # 引言


    作为 Linux 培训学院的创始人和多门课程的讲师，我有幸帮助过数千万的人磨练他们的 Linux 技能。与许多刚开始接触 Linux 操作系统的朋友互动，让我对人们在这个阶段面临的特定困难和挑战有了无足价值的见解。


    对于那些想要学习 Linux 细节的人来说，面临的最大挑战之一就是简单的缺乏时间。当你处理有限且极其宝贵的资源时，你希望确保充分利用它。


    Linux 新手的下一个一个大挑战是不知道从何开始。可用信息如此之，以至于决定先将注意力放在哪里成为了一个足够大的障碍，让许多人甚至无法开始。更糟糕的是，开始学习之路后却发现有太多未被解释的棘手概念、命令和细微差别。这种经历是令人沮丧的，并让你留下的问题比答案还多。


    这就是我写下这本书的原因。


    我不仅将最重要的材料浓缩成五个部分，每个部分都设计为一天内完成，我还以逻辑且系统的方式组织了内容。通过这样，你将确保通过首先学习 Linux 的基础方面，然后每天在基础的基础上继续，从而最充分地利用你的时间。


    在《5天学会Linux》中，你将学习到最重要的概念和命令，并在几个实际且真实的示例指导下逐步进行。遇到新的概念、命令或术语时，将用通俗易懂的语言进行解释，使其易理解。


    让我们开始吧。


    # 第1天


    # 获取访问


    为了开始学习熟悉环境并测试你新学的知识，你将需要访问一个 Linux 系统。如果你已经在 Linux 系统上有了账户，可以跳到下一章。


    # Web 托管 Shell 账户


    如果你使用 Web 托管服务来托管你的网站，你可能已经有一个可以使用的 Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell access”。SSH
    代表 Secure Shell（安全壳），它提供了一种连接方法。使用 Web 托管服务来托管你的网站，你可能已经有一个可以使用的 Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell
    access”。SSH 代表 Secure Shell（安全壳），它提供了一种连接方法。如果你使用 Web 托管服务来托管你的网站，你可能已经有一个可以使用的
