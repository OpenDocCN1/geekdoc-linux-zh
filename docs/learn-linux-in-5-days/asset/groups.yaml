    # SWITCHING USERS AND RUNNING COMMANDS AS OTHERS


    # su


    One way to start a session as another user on the system is to use the su command.
    If no arguments are supplied to su, it assumes you are trying to become the superuser.
    Executing su is the same as executing su root. Your current environment is passed
    to the new shell unless you specify a hyphen (-). In case, su creates an environment
    like you would expect to see had you logged in as that user.


    su [username] - Change user ID or become superuser


    Common su options:


    +   - A hyphen is used to provide an environment similar to what the user would
    expect had the user logged in directly.


    +   - c command - Specify a command to be executed. If the command is more than
    one word in length, it needs to be quoted.'
