    # Viewing Files In Real Time


    cat can be a fine way to view files that have fairly static content. However,
    if you are trying to keep up with changes that are being made in real time to
    a file, cat is not the best choice. A good example of files that can change often
    and are rapidly log files. For example, you may need to start a program and look
    at that program''s log to see what it is doing. For this case, use the tail -f
    file command.


    tail -f file - Follow the file. Displays data as it is being written to the file.


    ```

    $ tail -f /opt/app/var/log.txt

    Oct 10 16:41:17 app: [ID 107833 user.info] Processing request 7680687

    Oct 10 16:42:28 app: [ID 107833 user.err] User pat denied access to admin functions

    ...

    ```


