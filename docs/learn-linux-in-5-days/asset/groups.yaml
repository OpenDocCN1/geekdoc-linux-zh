- md: '

    LEARN LINUX IN 5 DAYS


    ## Choosing an SSH Client


    If you were given a specific SSH client to use, use that program and follow the
    documentation for that product. If you are free to choose your own client or were
    not provided one, I suggest using PuTTY for Windows or Terminal for Mac.


    PuTTY can be downloaded from this website:

    http://www.LinuxTrainingAcademy.com/putty/. You only need putty.exe to get started.


    The Terminal application comes pre-installed on Macs and is located in the /Applications/Utilities
    folder.


    A list of other SSH clients is provided in the Deep Dive section at the end of
    this chapter.


    9


    ## Connecting via SSH with a Password from Windows


    To connect to the Linux server using the SSH connection protocol, launch PuTTY.


    ![](img/95537d0c63f8d4551bf141591350cad2_15_0.png)


    Type the host name or IP address you were given into the Host Name (or IP address)
    box. If no port was given to you, leave it at the default value of 22.


    ![](img/95537d0c63f8d4551bf141591350cad2_16_0.png)


    Enter your username by clicking on Data in the left pane. It is located directly
    below Connection. Type your username into the Auto-login username field. If you
    skip this step you will be prompted for your username when you connect to the
    server.


    ![](img/95537d0c63f8d4551bf141591350cad2_17_0.png)


    Save your session by typing a name in the Saved Sessions box and clicking Save.
    This allows you to speed up this process by simply double clicking on your saved
    session to connect to the Linux server.


    ![](img/95537d0c63f8d4551bf141591350cad2_18_0.png)


    When you click Open a connection attempt will be made. The first time you connect
    to a particular server, PuTTY will ask to cache that server''s host key. You will
    not be prompted again on subsequent connections. To add the server''s SSH host
    key to PuTTY''s cache, simply click Yes when prompted.


    ![](img/95537d0c63f8d4551bf141591350cad2_19_0.png)


    Once you are successfully logged in, you will see something similar to this:


    ```

    [bob@linuxsvr ~] $

    ```


    ## Connecting via SSH with a Password from Mac


    The built-in SSH client on Mac is a command line program. Command line programs
    can be run with the Terminal application that comes with the Mac operating system.
    It is located in the /Applications/Utilities folder. The format of the ssh command
    is ssh -p port_number username@servername. If you were not provided a port number,
    the default port of 22 is assumed and you can omit -p 22 from the ssh command.
    Similarly, the username only needs to be specified if it is different on the server
    than it is on your Mac workstation. For example, your username on your Mac is
    bob and your username on linuxsvr is also bob, you can omit bob@ and simply type
    ssh linuxsvr. Once Terminal is running, type in the ssh command. Commands are
    case-sensitive and the ssh command is lowercase. It should look like one of these
    three options:


    ```

    ssh linuxsvr

    ssh bob@linuxuxsvr

    ssh -p 2222 bob@linuxuxsvr

    ```


    The first time you connect to a particular server you will be asked to verify
    that server''s host key. You will not be prompted again on subsequent connections.
    When you are asked Are you want to continue connecting (yes/no)? type yes and
    press Enter. Once you have established a connection, you will be prompted for
    your password.


    ![](img/95537d0c63f8d4551bf141591350cad2_21_0.png)


    Like Mac, Linux also comes with a terminal program and an SSH client. Once you
    are connected to one Linux server you can use the ssh command to connect to another
    Linux server. You can nest multiple connections and navigate through your network
    of Linux servers in this fashion.


    ## General Information on Connecting via SSH with Keys


    You may not have been given a password, but rather given an SSH key or even asked
    to generate one. In the physical world a key unlocks a door. Similarly, an SSH
    key is used to unlock the access to your account on a server. If you do not have
    a key, you cannot unlock the door.


    Using account passwords or a combination of account passwords and SSH keys is
    a common practice. With the growth of cloud computing in recent years, it is becoming
    more and more popular to use SSH keys exclusively. Since cloud servers are often
    connected to the public internet, they are prone to brute attacks. A mischievous
    person could write a program that repeatedly connects to your server trying a
    new username and password combination each time. They can increase their odds
    of gaining entry by using a list of common usernames and passwords. Configuring
    your cloud server to not accept account passwords and to only accept SSH keys
    eliminates this threat.


    You can further increase the security of your SSH key by giving it a passphrase.
    In this case it takes something you have -- the key -- and something you know
    -- the passphrase -- to gain access to your account. If you feel confident that
    your key will only be under your control, you can forgo providing a passphrase
    for your key. This will allow you to log into servers without typing a password
    at all. Having an SSH key without a passphrase can allow you to automate and schedule
    tasks that require logging in to remote systems.


    ## Importing SSH Keys on Windows


    If you were given an SSH key that is not already in the PuTTY format, you will
    need to convert it. PuTTYgen is required in order to convert an SSH key on a Windows
    system.


    Run PuTTY, click Load and navigate to the private SSH key you were given. The
    names of the files are typically id_rsa for private keys, and id_rsa.pub for public
    keys.


    ![](img/95537d0c63f8d4551bf141591350cad2_23_0.png)


    Now you can save the public and private keys for later use with PuTTY.


    ## Generating SSH Keys on Windows


    In order to create an SSH key on a Windows system, you will need PuTTYgen.


    ![](img/95537d0c63f8d4551bf141591350cad2_24_0.png)


    When you run PuTTYgen you will be asked to move the mouse around to create some
    random data that will be used in the generation of the key.


    ![](img/95537d0c63f8d4551bf141591350cad2_25_0.png)


    You have the option to use a passphrase for your key. You can also change the
    comment to something more meaningful like Bob''s key.


    ![](img/95537d0c63f8d4551bf141591350cad2_26_0.png)


    Now, save the public and private keys by pressing Save public key and then Save
    private key. Give the public key to the system administrator so they can associate
    it with your account. The private key is for your eyes only.


    ## Importing SSH Keys on Windows


    Next, export the key as OpenSSH key by clicking Conversions and then ExportSSH
    Key. This OpenSSH key can be used on Unix or Linux systems.


    ![](img/95537d0c63f8d4551bf141591350cad2_27_0.png)


    ## Connecting via SSH from Windows


    Follow the "Connecting via SSH with a Password from Windows" instructions, but
    this time add one step to specify your private key. Click on Auth. In the right
    pane select Browse under Private key file and locate your SSH key.


    Like Mac, if you generated your keys, this part is already done for you. If you
    were given an SSH key, you need to place it in a directory named .ssh underneath
    your home directory. Open the Terminal application and type in the following commands.
    Press the Enter key at the end of each line.


    ```

    mkdir ~/.ssh

    chmod 700 ~/.ssh

    ```


    You will gain a full understanding of what these commands do as you progress through
    this book. In order to expedite the process of getting connected, the details
    will be saved for later.


    Switch to the Finder to copy your keys into the .ssh folder. In the Finder menu
    click Go and then Go to Folder... and type ~/.ssh when prompted. When you click
    go, the .ssh folder will be displayed.


    ## Generating SSH Keys on Mac


    If you are asked to generate a key, launch the Terminal application and use the
    command line utility named ssh-keygen. You be asked a series of questions. Accept
    all the defaults by pressing Enter. Optionally enter a passphrase for your key.


    ```

    mac:~ bob$ ssh-keygen

    Generating public/private rsa key pair.

    Enter file in which to save the key (/Users/bob/.ssh/id_rsa):

    Enter passphrase (empty for no passphrase):

    Enter same passphrase again:

    ```


    Your identification has been saved in /Users/bob/.ssh/id_rsa.

    Your public key has been saved in /Users/bob/.ssh/id_rsa.pub.

    The key fingerprint is:

    0b:14:c5:85:5f:55:77:35:5f:9e:15:a9:b4:b0:54:05

    bob@mac

    The key''s random image is:


    ```

    --- RSA 2048-----

    | .E+=@ |

    |   o  .. oo|

    |   ...+ o.o|

    |   .      o |

    |   . S |

    |   . |

    |   . |

    +-----------------------

    ```

    ## Connecting via SSH with Keys from Mac

