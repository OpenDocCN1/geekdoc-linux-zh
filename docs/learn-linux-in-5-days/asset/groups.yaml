    | -rw-rw-r-- | 664 | Allows a group of people to modify the file and let others
    read it. |


    | -rw-rw---- | 660 | Allows a group of people to modify the file and let others
    read it. |


    | -rw-r--r-- | 644 | Allows everyone on the system to read the file but only the
    owner can edit it. |


    When you encounter 777 or 666 permissions, ask yourself "Is there a better way
    to do this? Everybody on the system need write access to this? For example, if
    a script or program is set to 777, then anyone on the system can make changes
    to that script or program. Since the execute bit is set for everyone, that program
    can then be executed by anyone on system. If malicious code was inserted either
    for purpose or on accident it could cause unnecessary trouble. If multiple people
    need write access to a file consider using groups and limiting the access of others.
    It is good practice to avoid using 777 and 666 permission modes.'
