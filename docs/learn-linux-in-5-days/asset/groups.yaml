    # FILE AND DIRECTORY PERMISSIONS EXPLAINED


    Looking back at the long listings provided by the ls command you see that the
    first bit of information displayed is the permissions for the given file or directory.


    ```

    $ ls -l sales.data

    --rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    The first character in the permissions string reveals the type. For example, -
    is a regular file, d is a directory, and l is a symbolic link. Those are the most
    common types you will encounter. For a full listing read the ls man page.


    | Symbol Type |

    | --- |

    - Regular file |

    - Directory |

    - Symbolic link |


    You will also notice other characters in the permissions string. They represent
    the three main types of permissions which are read, write, and execute. Each one
    is represented by a single letter, also known as a symbol. Read is represented
    by r, write by w, and execute by x.


    | Symbol | Permission |

    | --- | --- |

    | r | Read |

    | w | Write |

    | x | Execute |


    Read, write, and execute are rather self-explanatory. If you have read permissions
    you can see the contents of the file. If you have write permissions you can modify
    the file. If you have execute permissions you can run the file as a program. However,
    when these permissions are applied to directories they have a slightly different
    meaning than when they are applied to files.


    | Permission | File Meaning | Directory Meaning |

    | --- | --- | --- |

    | Read | Allows a file to be read. | Allows file names in the directory to be
    read. |

    | Write | Allows a file to be modified. | Allows entries to be modified within
    the directory. |

    | Execute | Allows the execution of a file. | Allows access to contents and metadata
    for entries in the directory. |


    There are three categories of users that these permissions can be applied to.
    These categories or classes are user, group, and other. Like the permission types,
    each set is represented by a single letter. The user who owns the file is represented
    by u, the users that are in the file''s group are represented by g, and the other
    users who do not own the file or are not in the file''s group are represented
    by o. The character a represents all, meaning user, group, and other. Even though
    these characters do not show up in an ls listing, they can be used to change permissions.


    | Symbol | Category |

    | --- | --- |

    | u | User |

    | g | Group |

    | o | Other |

    | a | All - user, group, and other. |


    Every user is a member of at least one group called their primary group. However,
    users can and often are members of many groups. Groups are used to organize users
    into logical sets. For example, if members of the sales team need access to some
    of the same files and directories they can be placed into the sales group.


    Run the groups command to see what groups you are a member of. If you supply another
    users ID as an argument to the groups command you will also see the list of groups
    to which that belongs. You can also run id -Gn [user] to get the same result.


    ```

    $ groups

    users sales

    $ id -Gn

    users sales


    $ groups pat

    users projectx apache

    $ groups jill

    users sales manager

    ```


    # Secret Decoder Ring for Permissions


    Now you have enough background information to start decoding the permissions string.
    The first character is the type. the next three characters represent the permissions
    available to the user, also known as the owner of the file. The next three characters
    represent the permissions available to the members of the file''s group. The final
    three characters represent the permissions available to all others.


    In this case order has meaning. Permission types will be displayed for user, followed
    by group, and finally for others. Also, the permission types of read, write, and
    execute are displayed in that order. If a particular permission is not granted
    a hyphen (--) will take its place.


    Here is a graphical representation of the permission information displayed by
    ls -1.


    ![](img/95537d0c63f8d4551bf141591350cad2_76_0.png)


    If you happen to see an extra character at the end of the permissions an alternative
    access control method has been applied. If you see a period (.), the file or directory
    has an SELinux (Security Enhanced Linux) security context applied to it. If you
    see a plus sign (+), ACLs (Access Control Lists) and ACLs are beyond the scope
    of this book. However, you will be pleased to know that the use of either of these
    is rare. If you having troubles with permissions and notice an extra character
    in the permissions string, know that further investigation may be necessary.


    ```

    $ ls -1 sales.data.selnx

    --rw-r----. 1 bob users 10400 Sep 27 08:52 sales.data.selnx

    $ ls -1 sales.data.acl

    -rw-r--+ 1 bob users 10400 Sep 27 08:52 sales.data.acl

    ```


    # Changing Permissions


    Permissions are also known as modes. That is why the command you use to change
    permissions is called chmod, short for "change mode." The format of the chmod
    command is chmod mode file. There are two ways to specify the mode. The first
    way is called symbolic mode. The symbolic mode format is chmod user_category operator
    permission. Here is a table view of the chmod command symbolic mode.


    | Item | Meaning |

    | --- | --- |

    | chmod | The change mode command. |

    | ugoa | The user category. One or more of u for user, g for group, o for other,
    a for all. |

    | += | One of +, -, or .. Use + to add permissions, – to subtract them, or = to
    explicitly set them. |

    | rwx | The permissions. One or more of r for read, w for write, and x for execute.
    |


    You can add, subtract, or set permissions using user category and permission pairs.
    For example, if you want to add the write permission for the members of a file''s
    group, you would specify chmod g+w file.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g+w sales.data

    $ ls -l sales.data

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


