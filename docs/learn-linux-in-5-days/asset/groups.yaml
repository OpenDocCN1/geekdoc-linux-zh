  mdcn: '

    # 5天学会 Linux


    vi [file] - 编辑文件。


    vim [file] - 与 vi 相同，但具有更多功能。


    view [file] - 以只读模式启动 vim。当你只想查看文件而不进行任何更改时，请使用 view 命令。


    Vim 代表“改进版的 Vi”（Vi IMproved）。它与 vi 中的命令兼容。Vim 的一些额外功能包括语法高亮、通过网络编辑文件、多层级撤销/重做以及屏幕分屏。在许多
    Linux 发行版中，当你调用 `vi` 时，实际上运行的是 `vim`。


    学习 vi 的优势之一是 vi 或像 vim 这样的变体在系统中总是可用的。另一个优势是，一旦你学会了 vi 的按键映射，就可以将其应用到其他命令，如 `man`、`more`、`less`、`view`
    甚至你的 shell。


    # Vi 模式


    ## 命令模式 (Command Mode)


    Vi 有模式的概念。你始终处于三种模式之一中：命令模式、插入模式或行模式。当 vi 启动时，你将进入命令模式。要随时回到命令模式，请按下退出 键 (Esc)。在命令模式下输入的字母不会发送到文件中，而是被解释为命令。命令模式允许你在文件中进行进移动、执行搜索、删除文本、复制文本和粘贴文本。


    以下是一些用于导航的常用按键绑定。


    - k - 向上移动一行。

    - j - 向下移动一行。

    - h - 向左移动一个字符。

    - l - 向右移动一个字符。

    - w - 向右一个单词。

    - b - 向左移动一个单词。

    - ^ - 跳到行首。

    - $ - 跳到行尾。


    注意，大写和小写命令是区分大小的。例如，如果你想向下移动一行，输入小写的 `j`。大写的 `J` 会合并行。原始的 vi 编辑器并没有使用方向键，但 vim
    使用了，因此你可能会发现你的系统上可以使用方向键。学习原始按键绑定的优势在于：1) 它们始终有效；2) 速度更快，因为你的手不需要离开主位键。


    # 插入模式 (Insert mode)


    要进入插入模式，请按下以下按键之一。


    - i - 在光标位置插入。

    - I - 在行首插入。

    - a - 在光标位置后追加。

    - A - 在行尾追加。


    进入插入模式后，输入所需的文本。完成后，输入 `Esc` 回到命令模式。


    # 行模式 (Line mode)


    要进入行模式，你必须从命令模式开始，然后输入冒号 `:` 字符。如果你处于插入模式，先按 `Esc` 回到命令模式，然后输入 `:` 进入行模式。以下是一些你可能需要知道的最常见的行命令。


    - :w - 写入（保存）文件。

    - :w! - 强制保存文件，即使没有设置写权限。这仅适用于你拥的文件。

    - :q - 退出。只有在文件没有任何修改时，此命令才有效。

    - :q! - 不保存对文件所做的更改直接退出。

    - :wq - 保存并退出。在修改文件后，此命令确保保存并关闭 vi。

    - :x - 与 :wq 相同。

    - :n - 将光标置于第 n 行。例如，`:5` 将将光标放在文件的第五行。

    - :$ - 将光标置于文件的最后一行。

    - :set nu - 开启行号。

    - :set nonu - 关闭行号。

    - :help [子命令] - 获取帮助。如果你想获得更多关于 `:w` 命令的信息，输入 `:help :w`。


    # JASON CANNON


    | 模式 | 键 | 描述 |

    |---|---|---|

    | 命令 | Esc | 用于导航、搜索以及复制/粘贴文本。 |

    | 插入 | i a A | 也称为文本模式。允许在文件中插入文本。 |

    | 行 | : | 也称为命令行模式。保存文件、退出 vi、替换文本和执行某些导航。 |


