    ## 默认权限与文件创建掩码


    文件创建掩码（umask）决定了文件在创建时被分配的权限。掩码会限制或屏蔽权限，从而决定了文件或目录将获得的最终权限。如果没有掩码，目录将以 777 (rwxrwxrwx)
    权限创建，文件将以 666 (rw-rw-rw--) 权限创建。掩码通常由系统管理员设置，但可以通过在个人初始化文件中包含 `umask` 语句来按账户对其进行覆盖。


    umask [-S] [mode] - 如果指定，则将文件创建掩码设置为 `mode`。如果省略，将显示当前模式。使用 `-S` 参数允许 umask 以符号表示显示或设置模式。


    提供给 `umask` 的模式工作方式与提供给 `chmod` 的模式相反。当你向 `chmod` 提供 7 时，它被解释为所有权限或 rwx。当你向 `umask`
    提供 7 时，它被解释为关闭所有权限或 ---。将 `chmod` 视为开启、添加或赋予权限。将 `umask` 视为关闭、减去或取回权限。


    估算 umask 对默认权限产生什么影响的快速方法是：对于目录从 777 减去八进制掩码，对于文件从 666 开始。以下是 umask 022 的示例，这通常是
    Linux 发行版或系统管理员使用的默认值。


    | 目录 | 文件 |

    | --- | --- |

    | 基础权限 | 777 | 666 |

    | 减去 Umask | -022 | -022 |

    | 创建权限 | 755 | 644 |


    使用 002 的 umask 对于与组员协作非常理想。你会发现，当创建文件或目录时，权限允许组内成员操作这些文件和目录。


    | 目录 | 文件 |

    | --- | --- |

    | 基础权限 | 777 | 666 |

    | 减去 Umask | -002 | -002 |

    | 创建权限 | 755 | 644 |


    这是另一个用于与组员协作的 umask。使用 007，这样就不会给组外的用户授予任何权限。


    | 目录 | 文件 |

    | --- | --- |

    | 基础权限 | 777 | 666 |

    | 减去 Umask | -007 | -007 |

    | 创建权限 | 770 | 660 |


    再次，使用这种八进制减法方法是一个很好的估算。你可以看到这种方法在 umask 模式为 007 时失效了。在实际上，为了每次都获得准确的结果，你需要将八进制转换为二进制值。从那里开始，你对
    umask 模式使用按位取反（NOT）操作，并对基础权限执行按位与（AND）操作。在这里略过这些细微差别是可以接受的，因为只有几种 umask 模式。它们是
    022、002、077 和 007。省去你的二进制作业吧，直接查看下表其中包含了八种排列组合产生的所有结果权限。


    | 八进制 | 二进制 | 目录权限 | 文件权限 |

    | --- | --- | --- | --- |

    | 0 | 000 | rwx | rw- |

    | 1 | 001 | rw- | rw- |

    | 2 | 010 | r-x | r-- |

    | 3 | 011 | r-- | r-- |

    | 4 | 100 | -wx | -w- |

    | 5 | 101 | -w- | -w- |

    | 6 | 110 | --x | --- |

    | 7 | 111 | --- | --- |


    ## 特殊模式


    看看 umask 设置为 022 时的输出。


    ```

    $ umask

    0022

    ```


    你会注意到多出一个前导 0。到目前为止，你只处理了代表用户、组和其他用户权限的三个字符。有一类特殊模式。这些模式是 setuid、setgid 和 sticky。知道，这些特殊模式是通过在通常用于
    umask `chmod` 的八进制模式前面加上一个字符来声明的。这里的关键点是知道 umask 0022 等于 umask 022。同样，`chmod 644`
    等于 `chmod 0644`。


    尽管书中不会涵盖特殊模式，但这里列出供你参考。本章末尾有链接，如果你感兴趣，可以学习更多关于这些模式的内容。


    - setuid 权限 - 允许进程作为文件者运行，而不是执行它的用户。

    - setgid 权限 - 允许进程以文件所属组运行，而不是执行用户所在的组运行。

    - sticky bit（粘位） - 防止用户删除另一个用户的文件，即使他们通常有权限那样做。


