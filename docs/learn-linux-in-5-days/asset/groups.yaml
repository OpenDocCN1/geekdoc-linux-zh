    # WORKING WITH DIRECTORIES


    Directories are simply containers for files and other directories. They provide
    a tree like structure for organizing the system. Directories can be accessed by
    their name and they can also be accessed using a couple of shortcuts. Linux uses
    the symbols . and .. to represent directories. Think of . as "this directory"
    and .. as and "the parent directory."


    | Symbol | Description |


    | . | This directory.


    | .. | The parent directory.


    | / | Directory separator. Directories end in a forward slash and this is often
    assumed.


    The directory separator is optional for the last subid in a path or command. For
    example, the following commands work identically.


    ```

    $ cd /var/tmp

    $ cd /var/tmp/

    ```'
  - '[PAGE 60]


    Using the shortcuts can make navigating easier. For example, type cd.. to go to
    the directory just above your current directory.


    ```

    $ pwd

    /home/bob

    $ cd tpsreports

    $pwd

    /home/bob/tpsreports

    $ cd ..

    $pwd

    /home/bob

    $ cd ..

    $pwd

    /home

    $ cd .

    $pwd

    /home

    ```


    The cd .. command did not take you anywhere. Remember that . is "this directory"
    and .. is the "parent directory." Another shortcut for navigating directories
    is cd -. This command takes you to the previous directory. The environment variable
    that represents your previous working directory is OLDPWD. So, cd - and cd $OLDPWD
    are equivalent.


    ```

    $pwd

    /home/bob

    $ cd /var/tmp

    $pwd

    /var/tmp

    $ echo $OLDPWD

    /home/bob

    $ cd -

    /home/bob

    $

    ```


    How would you execute a command that is in your current directory? Assume your
    current directory is your home directory. By default your home directory is not
    in your $PATH. Here is how to do that.'
- md: '

    ```

    $ ./program

    ```


    Why does that work? Well, . represents "this directory", / is the directory separator,
    and program is the program to execute. You can always use the full path to execute.
    Here are two ways to execute program.


    ```

    $pwd

    /home/bob

    ./program

    $ /home/bob/program

    ```


    ## Creating and Removing Directories


    mkdir command is used to create directories and the rmdir command removes them.


    - mkdir [-p] directory - Create a directory. Use the -p (parents) option to create
    intermediate directories.


    - rmdir [-p] directory - Remove a directory. Use the -p (parents) option to remove
    all the specified directories. rmdir only removes empty directories. To remove
    directories and their contents, use rm.


    - rm -rf directory - Recursively removes the directory and all files and directories
    in that directory structure. Use with caution. There is no "trash" container to
    quickly restore your file from using the command line. When you delete something,
    it is gone.


    ```

    $ mkdir newdir

    $ mkdir newdir/product/reviews

    mkdir: Failed to make directory

    "newdir/product/reviews"; No such file or directory

    $ mkdir -p newdir/product/reviews

    $ rm newdir

    rmdir: directory "newdir": Directory not empty

    $ rm -rf newdir

    $ ls newdir

    ls: newdir: No such file or directory

    $ pwd

    /home/bob

    $ cd ..

    $ pwd

    /home

    ```


    ## LISTING FILES AND UNDERSTANDING LS OUTPUT


    Here is the output from an ls command using the -l option. The -l flag tells ls
    to display output in a long format. If you need to see files or directories exist,
    use ls. However, if you need detailed information use ls -l.


    ```

    $ ls -l

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    On the far left of the ls output is a series of characters that represent the
    file permissions. The number that follows the permissions represents the number
    of links to the file. The next bit of information is the owner of the file followed
    by the group name. Next the file size is displayed by the date and time when the
    file was last modified. Finally, the name of the file or directory is displayed.
    Here is the information displayed by the ls -l command in table form.


    | Item | Value |

    |---|---|

    | Permissions | -rw-rw-r-- |

    | Number of links | 1 |

    | Owner name | bob |

    | Group name | users |

    | Number of bytes in the file | 10400 |

    | Last modification time | Sep 27 08:52 |

    | File name | sales.data |


    The meaning of -rw-rw-r-- will be covered in detailed in the "File and Directory
    Permissions Explained" chapter.


    ## Listing All Files, Including Hidden Files


    Files or directories that begin with a period (.) are considered hidden and are
    not displayed by default. To show these hidden files and directories, use the
    -a option.


    ```

    $ ls -a

    .

    .profile

    .bash_history

    lecture.mp3

    PerfReviews

    sales.data

    tpsreports

    ```


    Up until this point when you have used options, you have preceded each option
    with a hyphen (-). Examples are -l and -a. Options that do not take arguments
    can be combined. Only one hyphen is required by the options. If you want to show
    a long -l listing with hidden files you could run ls -l -a or ls -la. You can
    even change the order of the flags, so ls -al works too. They are all equivalent.


