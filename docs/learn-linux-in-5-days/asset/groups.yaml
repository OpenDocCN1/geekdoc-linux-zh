    # Changing Permissions


    Permissions are also known as modes. That is why the command you use to change
    permissions is called chmod, short for "change mode." The format of the chmod
    command is chmod mode file. There are two ways to specify the mode. The first
    way is called symbolic mode. The symbolic mode format is chmod user_category operator
    permission. Here is a table view of the chmod command symbolic mode format.


    | Item | Meaning |

    | --- | --- |

    | chmod | The change mode command. |

    | ugoa | The user category. One or more of u for user, g for group, o for other,
    a for all. |

    | += | One of +, -, or =. Use + to add permissions, – to subtract them, or = to
    explicitly set them. |

    | rwx | The permissions. One or more of r for read, w for write, and x for execute.
    |


    You can add, subtract, or set permissions using user category and permission pairs.
    For example, if you want to add the write permission for the members of a file''s
    group, you would specify chmod g+w file.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g+w sales.data

    $ ls -l sales.data

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    Notice that after running chmod g+w sales.data the permissions'
- md: '

    string changed from ''-rw-rw-r-'' to ''-rw-rw-r-''. Remember that the permissions
    are displayed in the order of user, group, and other. The group permission set
    now includes the w symbol indicating that the write permission has been granted.
    Now the owner of the file (bob) and members of the group (users) can read and
    write to the sales.data file. Here is the reverse. This is how you would subtract
    the write permission.


    ```

    $ ls -l sales.data

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g-w sales.data

    $ ls -l sales.data

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    You can change more than one permission at a time. This time write and execute
    permissions are added for the file''s group.


    ```

    $ ls -l sales.data

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod gwx sales.data

    $ ls -l sales.data

    -rw-rwx-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    You can even set permissions on different user categories simultaneously. Here
    is how to change permissions for the user and group. Notice that before running
    this command that the user already has the write permissions. Using + to add permissions
    does not negate existing permissions, it just adds to them.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod ugwx sales.data

    $ ls -l sales.data

    -rw-rwx-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you want to set different permissions for different user categories, you can
    separate the specifications with the comma. You can mix and match to produce the
    outcome you desire. Here is how you can specify rwx for user adding x for group.


    ```

    $ ls -l sales.data

    -rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod u=rwx,g+x sales.data

    $ ls -l sales.data

    -rwxr-xr-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you want to set the file to be just readable by everyone, run a=r file. When
    you use the equal (=) the permission are set to exactly what you specify. If you
    specify just read, then only read will be available regardless of any existing
    permissions.


    ```

    $ ls -l sales.data

    -rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod a=r sales.data

    $ ls -l sales.data

    -r----r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you do not specify permissions following the equal sign, the permissions are
    removed. Here is an illustration of this behaviour:


    ```

    $ ls -l sales.data

    -rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod u=rwx,g=rx,o= sales.data

    $ ls -l sales.data

    -rwxr-x--- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    # Numeric Based Permissions


    In addition to symbolic mode, octal mode can be used with chmod to set file and
    directory permissions. Understanding the concepts behind symbolic mode will help
    you learn octal mode. However, once you learn octal mode you may find that it
    is even quicker and easier to use than symbolic mode. Since there are only a few
    common and practical permission modes they can be readily memorized and recalled.


    In octal mode permissions are based on binary. Each permission type is treated
    as a bit that is either set to off (0) or on (1). In permissions, order has meaning.
    Permissions are always in read, write, and execute order. If r, w, and x are all
    set to off, the binary representation is 000. If they are all set to on, the binary
    representation is 111. To represent read and execute permissions while omitting
    write permissions, the binary number is 101.


    | r | w | x | Description |

    |---|---|---|---|

    | 0 | 0 | 0 | Binary Value for off |

    | 1 | 1 | 1 | Binary Value for on |

    | r | w | w | (Note: corrected OCR) |

    | 0 | 0 | 0 | Base 10 (decimal) value for off |

    | 4 | 2 | 1 | Base 10 (decimal) value for on |


    To get a number that can be used with chmod, convert the binary representation
    into base 10 (decimal). The shortcut here is to remember that read equals 4, write
    equals 2, and execute equals 1. The permissions number is determined by adding
    up the values for each permission type. There are eight possible values from zero
    to seven, hence the name octal mode. This table demonstrates all eight of the
    possible permutations.


    # Octal Binary String Description


    | Octal | Binary | String | Description |

    |---|---|---|---|

    | 0 | 000 | --- | No permissions |

    | 1 | 001 | --x | Execute only |

    | 2 | 010 | -w- | Write only |

    | 3 | 011 | -wx | Read and execute (2 + 1) |

    | 4 | 100 | r-- | Read only |

    | 5 | 101 | r-x | Read and execute (4 + 1) |

    | 6 | 110 | rw- | Read and write (4 + 2) |

    | 7 | 111 | rwx | Read, write, and execute (4+2+1) |


    Again, in permissions order has meaning. The user categories are always in user,
    group, and other order. Once you determine the octal value for each category you
    specify them in that order. For example, to get `rwxr-xr--`, run `chmod 754 file`.
    That means the user (owner) of the file has read, write, and execute permission;
    the group has read and execute; and others have read only.


    # Commonly Used Permissions


    Here are the most commonly used permissions.


    | Symbolic | Octal | Description |

    |---|---|---|

    | rwx------ | 700 | Owner full permissions |

    | rwxrxr-x | 755 | Owner full, group/others execute |

    | rw-r--r-- | 644 | Owner read/write, others read |

    | rwxrrw---- | 760 | Owner and group read/write |

    | rwxr-xr-- | 754 | Owner full, group read/exec, others read |


