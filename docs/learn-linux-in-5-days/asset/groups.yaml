    # LEARN LINUX IN 5 DAYS


    modes. They are emacs, which is typically the default mode, and vi. Depending
    on the shell you can change editing modes by using the set or bindkey command.
    If you want to ensure your preferred mode is set upon login, add one of the two
    commands to your personal initialization files.


    | Shell | Emacs Mode | Vi Mode | Default Mode |

    | --- | --- | --- | --- |

    | bash | set -o emacs | set -o vi | emacs |

    | ksh | set -o emacs | set -o vi | none |

    | tcsh | bindkey -e | bindkey -v | emacs |

    | zsh | bindkey -e | bindkey -v | emacs |

    | zsh | set -o emacs | set -o vi | emacs |


    # Emacs Mode


    As you would expect, in emacs mode you can use the key bindings found in the emacs
    editor. For example, to move to the beginning of the command line type Ctrl-a.
    To recall the previous command type Ctrl-p.


    Esc Esc - Escape completion. Similar to tab completion.


    Ctrl-b - Move cursor to the left (back)


    Ctrl-f - Move cursor to the right (forward)


    Ctrl-p - Up (Previous command line)


    Ctrl-n - Down (Next command line)'
  - '[PAGE 159]


    Ctrl-e - Move to the end of the line


    Ctrl-a - Move to the beginning of the line


    Ctrl-x Ctrl-e - Edit the current command line in the editor defined by the $EDITOR
    environment variable.


    See the section in this book on the emacs editor for more key bindings.


    # Vi Mode


    When you are using vi command line editing mode you start in insert mode so you
    can quickly type commands. To enter command mode, press Esc. To move the previous
    command, for example, type Esc k. To resume editing enter insert mode by pressing
    i, I, a, or A.


    Esc - Enter command mode.


    Key bindings in command mode:


    +   - Vi style file completion. Similar to tab completion.


    +   - h - Move cursor left


    +   - k - Up (Previous command line)


    +   - j - Down (Next command line)


    +   - 1 - Move cursor right


    +   - $ - Move to the end of the line


    +   - ^ - Move to the beginning of the line


    +   - i - Enter insert mode.


    +   - a - Enter insert mode, append text at current location.'
  - '[PAGE 160]


    # LEARN LINUX IN 5 DAYS


    A - Enter insert mode, append text at end of line.


    I - Enter insert edit mode, prepend text to start of line.


    v - Edit the current command line in the editor defined by the $EDITOR environment
    variable.


    See the section in this book on the vi editor for more key bindings.


    # Dealing with Long Shell Commands


    The backslash (\ is the line continuation character. You have learned how to use
    the backslash to escape special characters like spaces. However, when a backslash
    is placed at the end of a line it is used as a line continuation character. This
    allows you to create command lines that are displayed as multiple lines but are
    executed as a single command line by the shell. You can use line continuation
    to make commands more readable and easier to understand.


    ```

    $ echo "one two three"

    one two three

    $ echo "one \

    > two \\

    > three"

    one two three

    $ echo "onetowothree"

    onetowothree

    $ echo "one\"

    > two\\

    > three"

    entowothree

    $

    ```


    The greater-than symbol (>) in the above example. It is the secondary prompt string
    and can be customized by changing the PS2 environment variable. You learned previously
    how to change the primary prompt string with PS1 in the "Customizing the Prompt"
    section'
