    \ file\n$ # Typing: cat f[Tab][Tab] results in:\n$ cat file\nfile1.txt file2.txt\n\
    $ # Typing cat f[Tab] 2[Tab][Enter] results in:\n$ cat file2.txt\nThis is file2!!!\n\
    $\n```\n\n# Shell Command Line Editing\n\nFrom time to time you will want to change\
    \ something on your current command line. Maybe you noticed a spelling mistake\
    \ at the front of the line or need to add an additional option to the current\
    \ command. You may also find yourself wanting to recall a command from your shell\
