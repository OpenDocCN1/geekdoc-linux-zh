    \ (0-59) |\n```\n\n此作业将仅在月份为 0、小时为 7 且星期为 1 时运行。在星期中，0 代表星期日，1 代表星期一，等等。由于在这两个字段使用了星号，该作业将在任何一天和任何月份运行。\n\
    \n如果命令生成了任何输出，将通过邮件发送给你。你可以使用 `mail` 命令检查本地邮件。如果你不希望接收电子邮件，可以像示例那样重定向命令输出。\n\n\
