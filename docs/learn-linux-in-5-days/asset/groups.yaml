- md: "\n## Deep Dive\n\n- Filesystem Hierarchy Standard\n  http://refspecs.linuxfoundation.org/FHS_2.3\n\
    - man hier\n- RedHat Enterprise Linux\n  http://redhat.com/products/enterprise-linux/\n\
    - SUSE Linux Enterprise Server\n  https://www.suse.com/products/server/\n- Ubuntu\n\
    \  http://www.ubuntu.com/\n\n## BASIC LINUX COMMANDS\n\nHere is a short list of\
    \ basic, but essential commands. In Linux, commands are case-sensitive and more\
    \ often than they are not entirely in lowercase. Items that are surrounded by\
    \ brackets ([ \\]) are optional. You will more than likely you use at least some\
    \ of these commands every time you log into a Linux system. Become familiar with\
    \ these commands because they can get you pretty far in a short amount of time.\n\
    \n- ls - Lists directory contents. You will use ls to display information about\
    \ files and directories.\n\n- cd [dir] - Changes the current directory to dir.\
    \ If you execute cd without specifying a directory, cd changes the current directory\
    \ to your home directory. This is how you navigate around the system.\n\n- pwd\
    \ - Displays the present working directory name. If you don't know what directory\
    \ you are in, pwd will tell you.\n\n- cat [file] - Concatenates and displays files.\
    \ This is the command you run to view the contents of a file.\n\n- echo [argument]\
    \ - Displays arguments to the screen.\n\n## LEARN LINUX IN 5 DAYS\n\n- man command\
    \ - Displays the online manual for command. Type q to quit viewing the manual\
    \ page. The documentation provided by the man command is commonly called \"man\
    \ pages.\"\n\n- exit, logout, or Ctrl-d - Exits the shell or your current session.\n\
    \n- clear - Clears the screen.\n\nHere is a screen capture of Bob's session using\
    \ the above commands.\n\n```\n$ ls\nPerformanceReviews sales-lecture.mp3 sales.data\n\
    tpsreports\n$ cd tpsreports\n$ pwd\n/home/bob/tpsreports\n$ ls -l\ntotal 2\n-rw-r--r--\
    \ 1 bob users 31 Sep 28 14:49 coversheet.doc\n-rw-r--r-- 1 bob users 35 Sep 27\
    \ 08:47 sales-report\n$ cat sales-report\nWe sold lots of widgets this week!\n\
    $ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n$ man ls\nNAME\tls - list\
    \ directory contents\n...\n```\n\nMore details on how you can fully exploit the\
    \ power of these simple commands will be covered later. But right now, grab your\
    \ fishing pole -- you're about to learn how to fish.\n\n## TEACH YOURSELF TO FISH\n\
    \nKnowing where executable commands live and the man command take you a long way.\
    \ You can teach yourself how to use Linux with this method, but it would be a\
    \ long, slow process. More often than not, the man command will be used as a quick\
    \ reference. It would be nearly impossible to memorize every option for every\
    \ command and there is no need to do so when you have the man command at your\
    \ fingertips.\n\nTo get help for the man command type the letter h while viewing\
    \ a manual page. That will give you a list of commands you can use to navigate\
    \ or search. Here is the concise version.\n\n- Enter - Move down one line.\n\n\
    - Space - Move down one page.\n\n- g - Move to the top of the page.\n\n- G - Move\
    \ to the bottom of the page.\n\n- q - Quit.\n\nAn environment variable is a storage\
    \ location that has a name and a value.\n\n## LEARN LINUX IN 5 DAYS\n\nThe one\
    \ we are interested in at the moment is PATH. The PATH environment variable contains\
    \ a list of directories that contain executable commands. You can determine the\
    \ value of PATH by prepending it with a dollar sign ($PATH) and using the echo\
    \ command to display its value to the screen.\n\n```\n$ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n\
    ```\n\nWhen you type a command at the prompt and press Enter, that command will\
    \ be searched for in the directories in $PATH. In this example, /bin will be searched\
    \ first. If the command is found it will be executed. If it is not found, then\
    \ /usr/bin will be searched and so on. If no executable command is found that\
    \ matches your request, you will be politely told that it cannot be found.\n\n\
    ```\n$ whatsupdoc\n-bash: whatsupdoc: command not found\n```\n\nIf you want to\
    \ know exactly where a command is located you can use the which command. If the\
    \ program cat is located in /usr/bin and in /usr/local/bin, the one which will\
    \ get executed depends on your $PATH.\n\n```\n$ which cat\n/bin/cat\n$ which tac\n\
    /usr/bin/tac\n```\n\nPutting all this together, you can start looking at what\
    \ is in each directory in your $PATH and use the man command to discover what\
    \ each one of them does and how to use them. Remember, to exit the man command\
    \ type the letter q.\n\n```\n$ echo $PATH\n/bin:/usr/bin:/usr/sbin:/usr/local/bin\n\
    $ cd /bin\n$ ls\nawk diff cal cat cp date du echo grep groups list\n```\n\n```\n\
    more\n$ man diff\nNAME\ndiff - compare two files\n...\n$ cd /usr/bin\n$ ls\nclear\
    \ crontab cut dos2unix find kill mv ptree pwd\nsed strings touch ...\n$ man touch\n\
    ```\n\nNote that the output of the above ls commands was truncated. In reality\
    \ there can be hundreds of commands in /bin and /usr/bin.\n\nMany commands will\
    \ provide hints for how to use them at the command line. Some commands will accept\
    \ the -h flag, others will accept --help, and some will refuse to give you any\
    \ help at all.\n\n```\n$ cal -h\n```\n\n```\nUsage:\ncal [options] [[day] month]\n\
    ```\n\n- 1, show current month\n- 3, show next month\n- s, show Sunday\n- m, show\
    \ Monday\n- j, show Julian\n- y, show whole year\n- V, show version\n- h show\
    \ help\n\nUsage: diff [OPTION]...\n\n```\n$ cd -\n/home/bob\n$\n/home/bob\n```\n\
    \nIf you are not sure which directory is,, you you the the...... the.........\n\
    \n\n\n\n\n\n/\n.\n\n```\n$pwd\n/home/bob\n$ cdps\n\n/home/bob/\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n```\n```bash\n$pwd\n/home/bob\n\
    $ cd-ls\n/home/bob\n$ cd -\n/home/bob\n```\n\n## WORKING WITH DIRECTORIES\n\n\
    Directories are simply containers for files and other directories. They provide\
    \ a tree like structure for organizing the system. Directories can be accessed\
    \ by their name and they can also be accessed using a couple of shortcuts. Linux\
    \ uses the symbols . and .. to represent directories. Think of . as \"this directory\"\
    \ and .. as the parent directory.\n\n| Symbol | Description |\n| :--- | :--- |\n\
    | . | This directory. |\n| .. | The parent directory. |\n| / | Directory separator.\
    \ |\n\nThe directory separator is optional for the last sub in a path or command.\
    \ For example, the following commands work identically.\n\n```\n$ cd /var/tmp\n\
    $ cd /var/tmp/\n```\n\nUsing the shortcuts can make navigating easier. For example,\
    \ type cd.. to go to the directory above your current directory.\n\n```\n$pwd\n\
    /home/bob\n$ cd tpsreports\n$pwd\n/home/bob/tpsreports\n$ cd ..\n$pwd\n/home/bob\n\
    $ cd ..\n$pwd\n/home\n$ cd .\n$pwd\n/home\n```\n\nThe cd .. command did not take\
    \ you anywhere. Remember that . is \"this directory\" and .. is the \"parent directory.\"\
    \ Another shortcut for navigating directories is cd -. This command takes you\
    \ to the previous directory. The environment variable that represents your previous\
    \ working directory is OLDPWD. So cd - and cd $OLDPWD are equivalent.\n\n```\n\
    $pwd\n/home/bob\n$ cd /var/tmp\n$pwd\n/var/tmp\n$ echo $OLDPWD\n/home/bob\n$ cd\
    \ -\n/home/bob\n$\n```\n\nHow would you execute a command that is in your current\
    \ directory? Assume your current directory is your home directory. By default\
    \ your home directory is not in your $PATH. Here is how to do that.\n"
