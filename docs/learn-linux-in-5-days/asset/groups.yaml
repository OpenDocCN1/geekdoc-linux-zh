    # LEARN LINUX IN 5 DAYS


    | Dir | Description |

    | /etc/opt/apache | Configuration files for the application. |

    | /opt/apache/bin | The application''s binaries and other executable programs.
    |

    | /opt/apache/lib | Application libraries. |

    | /var/opt/apache | Application log files. |


    Sometimes applications that are not part of the standard operating system are
    installed in a shared manner and are not given their own subdirectory. For example,
    if apache was installed directly into /usr/local its binaries would live in /usr/local/bin
    and its configuration would live in /usr/local/etc. Apache may not be the only
    locally installed software so it would share that space with the other installed
    applications.


    Another common practice is to create a directory structure based on a company,
    organization, or team name. For example, if you work at the Acme Corporation you
    may find a directory named /opt/acme or /usr/local/acme. Sometimes scripts and
    utilities are installed directly in that structure and other times there are segregated
    into their own subdirectories. Here''s an example.


