    # VIEWING AND EDITING FILES


    Here are some simple commands that display the contents of files to the screen:


    - cat - Display the entire contents of file.

    - more - Browse through a text file. Press the Spacebar to advance to the next
    page. Press Enter to advance to the next line. Type q to quit viewing the file.

    - less - Like more but allows backward movement and pattern searches. Commands
    are based on vi editor, which is covered in the next section.

    - head - Output the beginning (top) portion of file.

    - tail - Output the ending (bottom) portion of file.


    This is how you might examine a file named file.txt with the commands cat, tail,
    and more:


    # JASON CANNON


    ```bash

    $ cat file.txt

    This is the first line.

    This is the second.

    Here is some interesting text.

    Knock knock.

    Who''s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    All my base are belong to.

    Finally, the 2th and last line.

    $ head file.txt

    This is the first line.

    This is the second.

    Here is some interesting text.

    Knock knock.

    Who''s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    tail file.txt

    Here is some interesting text.

    Knock knock.

    Who''s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    All my base are belong to.

    Finally, the th and last line.

    $ more file.txt

    ...

    By default head tail only display ten lines. You can override the behavior and
    tell them to display a specified number of lines. The format is -n where n is
    the number of lines you want to display. If you only want to display the first
    line of a file use head -1 file. Want to display the last three lines? Then run
    tail -3 file.


    ```bash

    $ head -2 file.txt

    This is the first line.

    This is the second.

    $ tail -1 file.txt

    Finally, the th and last line.

    $

    ```


    # Viewing Files In Real Time


    cat can be a fine way to view files that have fairly static content. However,
    if you are trying to keep up with changes that are being made in real time to
    a file, cat is not the best choice. A good example of files that can change often
    and are rapidly log files. For example, you may need to start a program and look
    at that program''s log to see what it is doing. For this case, use the tail -f
    file command.


    tail -f file - Follow the file. Displays data as it is being written to the file.


    ```bash

    $ tail -f /opt/app/var/log.txt

    Oct 10 16:41:17 app: [ID 107833 user.info] Processing request 7680687

    Oct 10 16:42:28 app: [ID 107833 user.err] User denied access to admin functions

    ...

    ```


