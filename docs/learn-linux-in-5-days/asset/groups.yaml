    \n# 使用 CRON 调度重复任务\n\n如果你需要计划执行某个任务，可以使用 `cron` 服务。`cron` 服务每分钟检查一次是否有任何计划的作业需要运行，如果有，则运行它们。Cron\
    \ 作业通常用于自动化流程或执行例行维护。你可以通过 `crontab` 命令来调度 cron 作业。\n\ncron - 一种基于时间的作业调度服务。该服务通常在系统启动时启动。\n\
    \ncrontab - 一个用于创建、读取、更新和删除作业计划的程序。\n\ncrontab（cron 表格）是一个配置文件，指定了 cron 何时执行命令。crontab\
    \ 中的每行代表一个作业，包含两部分信息：1) 何时运行以及 2) 运行什么。时间规范由五个字段组成。它们分别是：分钟、小时、日期、月份和星期。在时间规范之后，你提供要执行的命令。\n\
    \n# Crontab 格式\n\n| * * * * command | | | | |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| | | | 星期 (0-6) | | |\n| | | | 月份 (1-12) | | |\n| | | 日 (1-31) | | |\n|\
    \ | | 小时 (0-23) | | |\n| | | | | |\n\n只有当所有时间规范字段都匹配当前日期和时间时，命令才会执行。你可以指定命令只运行一次，但这并不是\
    \ cron 的典型用例。通常，一个或多个时间规范字段会包含一个星号 (\\*)，它可以匹配该字段的任何时间或日期。以下是一个 crontab 示例。\n\n\
    ```\n# 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/weekly-report\n```\n\n以下是上述 crontab\
