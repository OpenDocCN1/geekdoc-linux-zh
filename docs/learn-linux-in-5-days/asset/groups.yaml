    Find files start with an "s" and perform an ls on them.


    ```

    $ find -name "s*" -ls

    52 11 -rw-r--r-- 1 bob users 1040 Sep 27 08:52 ./sales.data

    48 1 -rw-r--r-- 1 bob users 35 Sep 27 08:47 ./demos/sr.txt

    53 112 -rw-r--r-- 1 bob sales 266 Sep 27 08:54 ./salesdemo.mp3

    ```


    The -size argument to find takes a number followed by a letter that represents
    the unit of space. Valid options are:


    c for bytes


    k for Kilobytes (units of 1024 bytes)


    M for Megabytes (units of 1048576 bytes)


    G for Gigabytes (units of 1073741824 bytes)


    Here is an example of how to find files that are larger than 300 megabytes.


    ```

    $ find . -size +300M

    ./PerfReviews/current/tps-violations.log

    ```


    Here is how to find directories that are newer than a given file. In this case
    you are looking for directories that are newer than "b.txt."


    ```

    $ find . -type d -newer b.txt

    ./PerfReviews

    ./PerfReviews/current

    ./tpsreports

    ```


    On some occasions you may want to run a list of files. You can use the find command
    with the -exec option to do this sort of thing. Use a pair of braces ({}) to act
    as a placeholder for the current file being processed. The command is terminated
    with the'
  - '[PAGE 94]


    # LEARN LINUX IN 5 DAYS


    semicolon (;) character. You need to either escape or quote the semicolon like
    '';'' or like this \. If you want to run the command

    file NAME on every file in the current directory you would

    use the following command.


    ```

    $ find -exec file {} \ \

    :: directory

    ./.profile: ASCII text

    ./.bash_history: ASCII text

    ./PerfReviews: directory

    ./PerfReviews/Fred: directory

    ./PerfReviews/current: directory

    ./PerfReviews/current/tps-violations.log: ASCII text

    ./PerformanceReviews/John: empty

    ./sales.data: data

    ```


    As you can see find is a really powerful tool and it has even more features than
    you have seen so far. Take a look at the man page or refer to the links at this
    end of this chapter.


    # Locate - A fast find


    Every time you run the find command it evaluates each file and

    returns the appropriate response. This can be a slow process at times.

    For instance, if you are looking for a file on the system and cannot

    narrow its location down to a subdirectory you would find / /

    name something. That command looks at each and every file on the

    system. If you know the file''s name or at least part of its name and just

    want to know where it resides, the locate command is the right tool

    for that job.


    locate pattern - List files that match pattern.


    Once a day all the files on the system are indexed by a process called

    updateddb. When you run locate it is simply querying the index or

    database created by updateddb and not looking at each file on the

    system. This is really, fast. The down side is that the data is not in'
  - '[PAGE 95]


    real time. If you are trying to find a file you created just a few minutes ago,
    chances are it is not indexed and locate will not find it. Also, locate can potentially
    return a file that matches your search, but the file may have been removed from
    the system since the index was last updated. On some servers locate is not installed
    or enabled, so your only choice may be to use find.


    Here is what it looks like when locate is disabled.


    ```

    $ locate bob

    locate: /var/locatedb: No such file or directory

    ```


    If it is enabled you will get a quick response to your queries. Notice that you
    do not need to know the entire file name, just a portion works.


    ```

    $ locate tpsrep

    /home/bob/tpsreports

    /home/bob/tpsreports/coversheet.doc

    /home/bob/tpsreports/sales-report.txt

    ```


