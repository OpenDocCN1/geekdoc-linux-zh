    ## Listing Files By Type


    When you use the -F option for ls a character is appended to the file name that
    reveals what type it is.


    ## LEARN LINUX IN 5 DAYS


    ```

    $ ls

    dirl link program regFile

    $ ls -F

    dirl/ link@* regFile

    $ ls -lf

    total 8

    drwx-xr-x 2 bob users 117 Sep 28 15:31 dirl/

    lrwxr-xr-x 1 bob users 7 Sep 28 15:32 link@ -> regFile

    -rwxr-xr-x 1 bob users 10 Sep 28 15:31 program@

    -rw-r-- 1 bob users 750 Sep 28 15:32 regFile

    ```


    | Symbol | Meaning |

    |---|---|

    | / | Directory. |

    | @ | Link. The file that follows the -> symbol is the target of the link. |

    | * | Executable program. |


    A link is sometimes called a symlink, short for symbolic link. A link points to
    the location of the actual file or directory. You can operate on the link as if
    it were the actual file or directory. Symbolic links can be used to create shortcuts
    to long directory names. Another common use is to have a symlink point to.


    ```

    $ ls -F

    dirl/

    drwxr-xr-x 2 bob users 117 Sep 28 15:31 dirl/

    lrwxr-xr-x 1 bob users 7 Sep 28 15:32 link@ -> regFile

    -rwxr-xr-x 1 bob users 10 Sep 28 15:31 program@

    -rw-r-- 1 bob users 750 Sep 28 15:32 regFile

    ```


    ## Listing Files by Time and in Reverse


    If you want to sort the ls listing by time, use the -t option. When you have a
    directory that contains many files it can be convenient to sort them by reverse,
    but the most recent will be at the top.


    ```

    $ ls -lat

