    \ position.\n- I - Insert at the beginning of the line.\n- a - Append after the\
    \ cursor position.\n- A - Append at the end of the line.\n\nAfter entering into\
    \ insert mode, type the desired text. When you are finished, type Esc to return\
    \ to command mode.\n\n# Line mode\n\nTo enter line mode you must start from command\
    \ mode and then type a colon:) character. If you are in insert mode, type Esc\
    \ to get back to command mode and then type a colon for line mode. Here are some\
