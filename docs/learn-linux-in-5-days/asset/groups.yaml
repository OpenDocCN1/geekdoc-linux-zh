    - du -h - 以人类可读的格式显示大小。例如 1.2M、3.7G 等。


    这里有几个快速示例，演示了如何压缩和解压缩文件。


    ```

    $ du -k data

    15360 data

    $ gzip data

    $ du -k data.gz

    26 data.gz

    $ ls data*

    data.gz

    $ gunzip data.gz

    $ ls data*

    data

