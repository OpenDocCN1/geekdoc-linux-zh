    An article that takes an in-depth look at escaping. http://linux.net/escaping-special-characters-in-linux-and-unix-with-7-practical-examples/

    - - man bash - Look at the "QUOTING" section for handling special characters including
    spaces.

    - - man ls - To learn about all of the available options to ls refer to the man
    page.


