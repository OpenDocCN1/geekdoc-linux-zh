    | @daily | 每天凌晨运行一次 | 0 * * * * |\n| @midnight | 与 @daily 相同 | 0 * * * * |\n|\
    \ @hourly | 每小时开始时运行一次 | 0 * * * * |\n| @reboot | 启动时运行 | N/A |\n\n# 使用 Crontab\
    \ 命令\n\n使用 `crontab` 命令来操作 cron 作业。\n\n```\ncrontab file - 从文件安装新的 crontab。\n\
