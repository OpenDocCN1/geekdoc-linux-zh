    # FINDING FILES


    If you ever need to locate a file or directory you can use the find command. It
    can be used to find files by name, size, permissions, owner, modification time,
    and more.


    find [path...] [expression] - Recursively finds files in path that match expression.
    If no arguments are supplied it finds all files in the current directory.


    ```

    $ find

    ./profile

    ./bash_history

    ./PerfReviews

    ./PerfReviews/Fred

    ./PerfReviews/current

    ./PerfReviews/current/tps-violations.log

    ./PerfReviews/John

    ./sales.data

    ...

    ```


    Here are some useful ways in which to use the find command.'
