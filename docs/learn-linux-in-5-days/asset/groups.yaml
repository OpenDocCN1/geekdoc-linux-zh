    # 压缩归档文件


    在现代版本的 tar 命令中，gzip 压缩是内置的。如果你想创建、提取或列出压缩归档的内容，请使用 -z 参数。按照惯例，压缩的 tar 文件将以 .tar.gz
    或 .tgz 结尾。其外观如下。


    ```

    $ tar zcf tps.tgz tpsreports

    $ ls *.tgz

    tps.tgz

    $ tar zf tps.tgz

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $

    ```


    如果你遇到了一个没有内置 gzip 压缩的旧版本 tar，可以使用管道（pipes）来创建压缩归档。当用连字符 (-) 代替文件名时，意味着使用标准输出。运行命令
    `tar cf - pattern` 将创建一个 "pattern" 的归档并将输出发送到标准输出（通常是你的屏幕）。如果你在命令后紧跟一个管道符，那么标准输出将作为作为管道后下一个命令的输入。要强制
    gzip 将其输出发送到标准输出，请使用 -c 参数。基于此，以下是你可以如何使用 tar、gzip 和管道来创建、列出和提取压缩归档。


    ```

    $ tar cf - tpsreports | gzip > tps.tgz

    $ ls *.tgz

    tps.tgz

    $ gunzip -c tps.tgz | tar tf -

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ cd /tmp

    $ gunzip -c /home/bob/tps.tar | tar xf -

    $ ls tpsreports/

    coversheet.doc sales-report.txt

    ```


    # 重定向


    你已经学习了如何使用管道重定向一个命令的输出并将其作为另一个命令的输入。在上一个示例中，你看到了另一种使用大于号 (>) 重定向输出的方法。有三种输入和输出类型：标准输入、标准输出和标准错误。默认情况下，标准输入来自键盘，标准输出显示在屏幕上。每种
    I/O（输入输出）类型都分配了一个文件描述符（file descriptor）。文件描述符只是代表文件的数字。对于人类来说，通过名称引用文件更容易，但对于计算机来说，通过数字引用则更容易。这在某个方面是正确的，但在另一个方面并非如此。Linux
    将几乎一切都表示为文件。这种抽象允许你执行强大的操作，例如将通常显示在屏幕上的一个命令的输出作为另一个命令的输入。运行整个文件内容更容易。


    为了演示这个概念，运行 sort，输入一些文本，并在空行处按 Ctrl-d。显示如下。


    ```

    $ sort

    a

    ccc

    bb

    ```


    | I/O 名称 | 缩写 | 文件描述符数字 |

    |---|---|---|

    | 标准输入 | stdin | 0 |

    | 标准输出 | stdout | 1 |

    | 标准错误 | stderr | 2 |


    使用大于号 (>) 重定向输出，使用小于号 (<) 重定向输入。重定向的显式方法是提供文件描述符数字，但如果省略了它，则假设输入重定向使用文件描述符 0，输出重定向使用
    1。


    - > 将标准输出重定向到文件，并覆盖（截断）该文件的任何现有内容。如果文件不存在，则创建一个。

    - >> 将标准输出重定向到文件，并追加到现有内容之后。如果文件不存在，则创建一个。

    - < 将文件的输入重定向到命令（在小于号之前的显示内容）。


    ```

