    interface you will be using, it''s time to learn about the directory layout. Understanding
    the directory structure will help you in the future when you are searching for
    components on the system. It can help you answer questions like:


    - Where are programs located?

    - Where do configuration files live?

    - Where might I find the log files for this application?


    # Common Directories


    Here are the most common top level directories that you need to be aware of and
    may interact with as a normal user.


    # JASON CANNON


    | Dir | Description |

    | --- | --- |

    | / | The directory called ''root.'' It is the starting point for the file system
    hierarchy. Note that this is not related to the root, or superuser, account. |

    | /bin | Binaries and other executable programs. |

    | /etc | System configuration files. |

    | /home | Home directories. |

    | /opt | Optional or third party software. |

    | /tmp | Temporary space, typically cleared on reboot. |

    | /usr | User related programs. |

    | /var | Variable data, most notably log files. |


    # Comprehensive Directory Listing


    Here is a comprehensive list of top level directories that you may find on various
    Linux systems. Some subdirectories are included to clearly define the purpose
    of the top level directory. You may never interact with many of these directories.
    Some of these directories will be on every system you encounter like /usr. Other
    directories are unique to specific Linux distributions. You can safely skim over
    this list and refer back to it if or when you have a practical need to do.


    | Dir | Description |

    | --- | --- |

    | / | The directory called "root." It is the starting point for the file system
    hierarchy. Note that this is not related to the root, or superuser, account. |

    | /bin | Binaries and other executable programs. |

    | /boot | Files needed to boot the operating system. |

    | /cdrom | Mount point for CD-ROMs. |

    | /cgroup | Control Groups hierarchy. |

    | /dev | Device files, typically controlled by the operating system and the system
    administrators. |

    | /etc | System configuration files. |

    | /export | Shared file systems. Most commonly found on Solaris systems. |

    | /home | Home directories. |

    | /lib | System Libraries. |

    | /lib64 | System Libraries, 64 bit. |

    | /last+found | Used by the file system to store recovered files after a file
    system check has been performed. |

    | /media | Used to mount removable media like CD-ROMs. |

    | /mnt | Used to mount external file systems. |

    | /opt | Optional or third party software. |


    | Dir | Description |

    | --- | --- |

    | /proc | Provides information about running processes. |

    | /root | The home directory for the root account. |

    | /sbin | System administration binaries. |

    | /selinux | Used to display information about SELinux. |

    | /srv | Contains data which is served by the system. |

    | /srv/www | Web server files. |

    | /srv/ftp | FTP files. |

    | /sys | Used to display and sometimes configure the devices and busses known
    to the Linux kernel. |

    | /tmp | Temporary space, typically cleared on reboot. This directory can be used
    by the OS and users alike. |

    | /usr | User related programs, libraries, and documentation. The sub-directories
    in /usr relate to those described above and below. |

    | /usr/bin | Binaries and other executable programs. |

    '
