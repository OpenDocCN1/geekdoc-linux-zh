    # Learn Linux in 5 Days


    JASON CANNON


    # Contents


    - Introduction 1

    - Day 1 3

    - Getting Access 4

    - Getting Connected 8

    - Welcome to Shell 33

    - Day 2 36

    - Linux Directory Structure 37

    - Basic Linux Commands 48

    - Teach Yourself to Fish 50

    - Working with Directories 54

    - Listing Files and Understanding Output 58

    - Day 3 67

    - File and Directory Permissions Explained 68

    - Finding Files 86

    - Viewing and Editing files 91

    - Comparing Files 106

    - Determining a File''s Type 108

    - Searching in Files 109

    - Day 4 115

    - Deleting, Copying, Moving, and Renaming Files 116

    - Sorting Data 121

    - Creating a Collection of Files 123

    - Compressing Files To Save Space 125

    - Compressing Archives 127

    - Redirection 129

    - Transferring and Copying Files 136

    - Welcome Back to Shell 142

    - Day 5 161

    - Processes and Job Control 162

    - Scheduling Repeated Jobs with Cron 169

    - Switching Users and Running Commands as Others 174

    - Installing Software 179

    - The End and the Beginning 189

    - About the Author 190

    - Other Books by the Author 191

    - Additional Resources Including Exclusive Discounts for You 192

    - Appendices 197

    - Appendix A: 198

    - Abbreviations and Acronyms 198

    - Appendix B: FAQ 202

    - Appendix C: Trademarks 205


    # OTHER BOOKS BY THE AUTHOR


    Bash Command Line Pro Tips

    http://www.linxtrainingacademy.com/bash-pro-tips


    Command Line Kung Fu: Bash Scripting Tricks, Linux Shell Programming Tips, and
    Bash One-liners

    http://www.linxtrainingacademy.com/command-line-kung-fu-book


    High Availability for the LAMP Stack: Eliminate Single Points of Failure and Increase
    Uptime for Your Linux, Apache, MySQL, and PHP Based Web Applications

    http://www.linxtrainingacademy.com/ha-lamp-book


    Python Programming for Beginners

    http://www.linxtrainingacademy.com/python-programming-for-beginners


    # YOUR FREE GIFT


    As thank you for reading Learn Linux in 5 Days, I would like to give you a copy
    of Linux Alternatives to Windows Applications. In it, you will be introduced to
    over 50 of the most popular applications available for Linux today. These applications
    will allow you to browse the web, watch movies, listen to music, connect to your
    favorite social networks, create presentations, and more. This gift is a perfect
    complement to this book and will help you along your Linux journey. Visit http://www.linixtrainingacademy.com/linux-apps
    to download your free gift.


    # INTRODUCTION


    As the founder of the Linux Training Academy and an instructor of several courses,
    I''ve had the good fortune of helping thousands of people hone their Linux skills.
    Interacting with so many people who are just getting started with the Linux operating
    system has given me invaluable insight into the particular struggles and challenges
    people face at this stage.


    One of the biggest challenges for people interested in learning the ins and outs
    of Linux is simply a lack of time. When you are working with a limited and extremely
    valuable resource you want to make sure you make the most of it.


    The next biggest challenge for Linux newcomers is knowing where to start. There
    is so much information available that deciding where to focus your attention on
    first is a big enough hurdle to keep many people from even starting. What''s worse
    is starting down the path of learning only to discover too many tricky concepts,
    commands, and nuances that aren''t explained. This kind of experience is frustrating
    and leaves you with more questions than answers.


    That''s why I''ve written this book.


    Not only I have condensed the most important material into five sections, each
    designed to be consumed in a day, I''ve also structured the content in a logical
    and systematic manner. This way you''ll be sure to make the most out of your time
    by learning the foundational aspects of Linux first and then building upon foundation
    each day.


    In Learn Linux in 5 Days you will learn the most important concepts and commands,
    and be guided step-by-step through several practical and real-world examples.
    As new concepts, commands, or jargon are encountered they are explained in plain
    language, making it easy to understand.


    Let''s get started.


    # DAY 1


    # GETTING ACCESS


    In order to start learning your way around and putting your newfound knowledge
    to the test, you''re going to need access to a Linux system. If you already have
    an account on a Linux system, you can skip ahead to the next chapter.


    # Web Hosting Shell Accounts


    If you use a web hosting service to host your website you may already have a Linux
    account that you can use. Consult your hosting company''s documentation and search
    for "SSH" or "shell access." SSH stands for Secure Shell and it provides a way
    to connect to a server over a network, like the Internet. If you don''t already
    have a web hosting provider, you can sign up for one and use it for shell access.
    Shared web hosting providers typically charge just a few dollars a month.


    Here are some shared web hosting companies that can provide you with a shell account
    and SSH access.


    - and1and.com

    - BlueHost.com

    - DreamHost.com

    - HostGator.com

    - Site5.com


    # Using Preinstalled Linux Images


    VirtualBox is virtualization software that can be installed on Windows, Mac, Solaris,
    or Linux. It allows you to run an operating system (guest) inside your current
    operating system (host). It''s more time consuming than the other options, but
    it can be worth the extra effort to have your own Linux system. In this scenario
    you will spend a few minutes installing the virtualization software, downloading
    a pre-installed Linux image, and importing that image.


    To get started, head over to the VirtualBox download page located at https://www.virtualbox.org/wiki/Downloads
    and grab the installer for your current operating system. Click through the install
    screens and accept the defaults.


    Next, download a virtual disk image (VDI) from http://virtualboxes.org to use.
    I recommend that you download a CentOS or Ubuntu image unless you already know
    which Linux distribution you will be working with in the future. Honestly, you
    can''t make a wrong decision. The concepts that you will be learning in this book
    apply to any Linux distribution.


    Launch VirtualBox, create a new virtual machine, and use the virtual disk image
    that you just downloaded. When are asked for a hard disk image select the "Use
    existing hard disk" radio button and click on the directory icon. Next, click
    "Add" and select the virtual disk image.


    When the virtual machine is powered on you can log into the server using the username
    and password provided with the downloaded image.


    # Deep Dive


    These links along with other supplemental material is available at:


    http://www.linuxxtrainingacademy.com/lfb


    - How to Install VirtualBox on Mac - A video that guides you through the installation
    of VirtualBox on Mac.

    http://youtu.be/CBQdflx1L1o

    - How to Install VirtualBox on Windows - A video that guides you through the installation
    of VirtualBox on Windows.

    http://youtu.be/CBhppdewtEQ

    - VirtualBox Documentation - Official VirtualBox documentation

    https://www.virtualbox.org/wiki/Documentation

    - VirtualBox download page - Where to obtain a copy of the VirtualBox software.

    https://www.virtualbox.org/wiki/Downloads

    - VirtualBoxes.org - A good source of virtual disk images.

    http://virtualboxes.org/


    # GETTING CONNECTED


    When your account is created you will be provided with details on how to connect
    to the Linux server. You may be provided with some or all of the following information:


    - Username. This is also known as an account, login, or ID.

    - Password

    - SSH key

    - Server name or IP address

    - Port number

    - Connection protocol


    The connection protocol will either be SSH (Secure Shell) or telnet. SSH and telnet
    provide ways to connect to a server over the Internet or a local area network.
    In the vast majority of cases the connection protocol will be SSH. Telnet is practically
    obsolete at this point, however you may run into it if you need to access a legacy
    system.

