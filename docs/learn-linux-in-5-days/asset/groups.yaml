    # CREATING A COLLECTION OF FILES


    If you want to bundle a group of files and/or directories together in an archive,
    you can use the tar command. You may want to create a copy or backup of a group
    of files. You may have several files you want to transfer at once or as a set.
    In these situations, tar can help.


    tar [-] c|x|t tarfile [pattern] - Create, extract or list contents of a tar archive
    using pattern, if supplied.


    You will notice that tar does not require a hyphen (-) to precede its arguments.
    Traditionally the hyphen is excluded, but tar still works with it. If you see
    tar cf file.tar it is the same as tar -cf file.tar. Here is a look at some of
    the most commonly used tar options.


    +   - c - Create a tar archive.


    +   - x - Extract files from the archive.


    +   - t - Display the table of contents (list).


    +   - v - Causes tar to be verbose.'
- md: '

    - file - The tar archive file to perform operations against.


    In the following example tar is used to create (tar cf tps.tar) an archive, list
    the contents of the archive (tar tf tps.tar) and extract the contents (tar xf
    tps.tar).


    ```

    $ tar cf tps.tar tpsreports/

    $ tar tf tps.tar

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ cd /tmp

    $ tar xf /home/bob/tps.tar

    $ ls tpsreports/

    coversheet.doc sales-report.txt

    ```


    If you would like to see the files that are getting placed into the archive or
    extracted from the archive, use -v to enable verbose mode.


    ```

    $ tar cvf misc.tar sec* tpsreports

    secret

    secret.bak

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ tar xvf /home/bob/misc.tar

    secret

    secret.bak

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    ```


    # COMPRESSING FILES TO SAVE SPACE


    - gzip file - Compress file. The resulting compressed file is named file.gz.

    - gunzip file - Uncompress files.

    - gzcat or zcat - Concatenates and prints compressed files.


    You can use the command du to display how much space is used by a file.


    - du - Estimates file usage.

    - du -k - Display sizes in Kilobytes.

    - du -h - Display sizes in human readable format. For example, 1.2M, 3.7G, etc.


    Here are a couple of quick examples that demonstrate how to compress and uncompress
    files.


    ```

    $ du -k data

    15360 data

    $ gzip data

    $ du -k data.gz

    26 data.gz

    $ ls data*

    data.gz

    $ gunzip data.gz

    $ ls data*

    data

    $ du -k misc.tar

    10 misc.tar

    $ gzip misc.tar

    $ du -k misc.tar*

    misc.tar.gz

    $

    ```


    # COMPRESSING ARCHIVES


    In modern versions of the tar command gzip compression is built-in. If you want
    to create, extract, or list the contents of a compressed archive use the -z argument.
    As a matter of convention compressed tar files will end in either .tar.gz or .tgz.
    Here is how this looks.


    ```

    $ tar zcf tps.tgz tpsreports

    $ ls *.tgz

    tps.tgz

    $ tar zf tps.tgz

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $

    ```


    If you run across an older version of tar without gzip compression built-in, you
    can use pipes to create compressed archives. When a hyphen (-) is used in place
    of a file name that means to use standard output. Running the command tar cf -
    pattern will create an archive of "pattern" and send the output to standard output
    which is normally your screen. If you follow the command with a pipe that standard
    output will be used as the input for the next command following the pipe. To force
    gzip to send its output to standard out, use the -c argument. With this in mind,
    here is how you can create, list, and extract a compressed archive using tar,
    gzip, and pipes.


    ```

    $ tar cf - tpsreports | gzip > tps.tgz

    $ ls *.tgz

    tps.tgz

    $ gunzip -c tps.tgz | tar tf -

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ cd /tmp

    $ gunzip -c /home/bob/tps.tar | tar xf -

    $ ls tpsreports/

    coversheet.doc sales-report.txt

    ```


    # REDIRECTION


    You have already learned to redirect output from one command and send it as input
    to another using pipes. In the previous example you saw another way to redirect
    output using the greater-than (>) sign. There are three types of input and output:
    standard input, standard output, and standard error. By default, standard input
    comes from the keyboard and standard output are displayed to the screen. Each
    of these I/O types is given a file descriptor. File descriptors are just numbers
    that represent files. For humans it is easier to reference files by name, but
    it is easier for computers to reference them by number. On one level it is true,
    but on another level it is not. Linux represents practically everything as a file.
    This abstraction allows you to do powerful things like take the output of one
    command that would normally be displayed to your screen and use it as input to
    another command. It is easier to run the entire contents of a file.


    To demonstrate this concept, run sort, type in some text, and press Ctrl-d on
    a blank line. Here is how that looks.


    ```

    $ sort

    a

    ccc

    bb

    ```


    | I/O Name | Abbreviation | File Descriptor Number |

    |---|---|---|

    | standard input | stdin | 0 |

    | standard output | stdout | 1 |

    | standard error | stderr | 2 |


    Use the greater-than sign (>) to redirect output and the less-than sign (<) to
    redirect input. The explicit way of redirection is to provide the file descriptor
    number, however if it is omitted then file descriptor 0 is assumed for input redirection
    and 1 for output redirection.


    - > Redirects standard output to a file, overwriting (truncating) any existing
    contents of the file. If no file exists, it creates one.

    - >> Redirects standard output to a file and appends to any existing contents.
    If no file exists, it creates one.

    - < Redirects input from a file to the command preceding the sign.


    ```

    $ ls -lF /opt/apache

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.3

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4

    lrwxrwxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    $ ls -lF /opt/apache > files.txt

    cat files.txt

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.3

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4

    lrwxrxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    $ ls -lF /opt/apache >> files.txt

    cat files.txt

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.3

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4

    lrwxrxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.3

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4

    lrwxrxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    $ sort < files.txt

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.3

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.3

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.4

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.4

    ```


    # JUNCTION


    ```

    lrwxrwxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    lrwxrwxr-x 1 root root 5 Nov 27 15:43 current -> 2.4

    ```


    In the above examples ls -lF /opt/apache > files.txt is the same as ls -lF /opt/apache
    1>. Do not use a space between the file descriptor and the redirection operator.


    ```

    $ ls -lF /opt/apache > files.txt

    ls: 1: No such file

    $ ls -lF /opt/apache 1> files.txt

    ls: 1: No such file

    $ sort 0 < files.txt

    sort: open 0: No such file

    ```


    Input and output redirection can be combined. This example shows files.txt being
    redirected as input for the sort command. The output of the sort command is then
    redirected to the sorted_files.txt.


