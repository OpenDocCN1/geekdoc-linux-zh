  mdcn: "\n\n# 标准错误 (Standard Error)\n\n当程序遇到错误时，它会将结果报告到标准错误（standard error）。文件描述符\
    \ 1 用于标准输出，2 用于标准错误。请记住，文件描述符 1 是输出重定向的默认文件描述符。这意味着程序生成的所有输出默认并不被捕获。以下是一个示例。\n\
    \n```\n$ ls here-not-here\nls: not-here: No such file or directory\nhere\n$ ls\
    \ here-not-here > out\nls: not-here: No such file or directory\n$ cat out\nhere\n\
    $ ls here-not-here 2> out.err\nhere\n\ncat out.err\nls: not-here: No such file\
    \ or directory\n$ ls here-not-here 1> out 2> out.err\n$ cat out\nhere\n$ cat out.err\n\
    ls: not-here: No such file or directory\n$\n```\n\n你会发现，使用 `>` 时，错误消息显示在屏幕上，而不是重定向到\
    \ `out` 文件。要重定向错误消息，你必须使用 `2>` 显式指定文件描述符 2。你可以将标准输出发送到一个文件，同时将标准错误发送到另一个文件。你可以利用这一点：让一个文件包含已知的良好输出，另一个文件则供你检查错误。\n\
    \n如果你想同时捕获标准输出和标准错误，请使用 `2>&1`。通常情况下，重定向时文件跟在重定向运算符后面。如果你想使用文件描述符而不是文件名，请使用波浪\
    \ `&` 符号。因此，与其将标准错误重定向到文件（`2>out.err`），不如将其重定向到标准输出（`2>&1`）。如果你省略了 `&`，`&1` 将被视为名为\
    \ `1` 的文件。\n\n- 与重定向配合使用，表示使用文件描述符而非文件名。\n- 2>&1 - 合并标准错误和标准输出。\n\n```\n$ ls here\
    \ not-here > out.both 2>&1\n$ cat out.both\nls: not-here: No such file or directory\n\
    here\n```\n\n命令 `ls here not-here > out.both 2>&1` 的意思是“将 `ls here not-here` 的标准输出发送到名为\
    \ `out.both` 的文件，并将标准错误附加到标准输出”。由于标准错误被重定向到标准输出，而标准输出被重定向到 `out.both`，所有输出都将写入\
    \ `out.both`。\n\n# 空设备 (Null Device)\n\n>/dev/null - 将输出重定向到无处。\n\n如果你想忽略输出，可以将其发送到空设备\
    \ `/dev/null`。空设备是一个特殊文件，会丢弃输入到它的任何内容。你可能会听到人们将其称为比特桶（bit bucket）”。如果你不想在屏幕上保存错误，也不想将其保存到文件中，可以将它们重定向到\
    \ `/dev/null`。\n\n```\n$ ls here not-here 2> /dev/null\nhere\n```\n\n```\n$ ls\
    \ here not-here > /dev/null 2>&1\n$\n```\n\n# 深度学习 (Deep Dive)\n\n- 文件描述符 (File\
    \ Descriptors) http://en.wikipedia.org/wiki/File_descriptor\n- Here 文档 (Here Documents)\
    \ http://en.wikipedia.org/wiki/Here-document\n- 空设备 (Null Device) http://en.wikipedia.org/wiki/dev/null\n\
    - 重定向 (Redirection) http://en.wikipedia.org/wiki/Redirection_(computing)\n\n#\
    \ 传输和复制文件\n\n你已经知道如何使用 `cp` 命令将文件从同一系统的一个位置复制到另一个位置。但如果你想从本地工作站向 Linux 服务器复制文件或在\
    \ Linux 服务器之间复制文件怎么办？你可以使用 SCP 或 SFTP。\n\nSCP 是安全拷贝（secure copy），SFTP 是 SSH 文件传输协议（SSH\
    \ file transfer protocol）。有时 SFTP 被安全文件传输协议。SCP 和 SFTP 都是安全 shell（SSH）协议的扩展。这意味着如果你为\
    \ SSH 配置了 SSH 密钥认证，它也同样适用于 SCP 和 SFTP。\n\n为了使用 SCP 或 SFTP，你需要一个客户端。Mac 和 Linux\
    \ 自带了 `scp` 和 `sftp` 命令行工具。如果你正在运行 Windows，可以使用 PuTTY 安全客户端 (`pscp.exe`) 和 PuTTY\
    \ 安全文件传输客户端 (`psftp.exe`) 程序。命令行工具并不是你唯一的选择。每个平台都有图形化客户端。有些可以在 Windows、Linux 和\
    \ Mac 上运行（如 FileZilla），而另一些仅运行在一个平台上（如适用于 Windows 的 WinSCP）。\n\n# 5 天学习 Linux\n\
    \n```\nC:\\WINDOWS\\system32\\cmd.exe\n\nPuTTY Server client\nRelease 0.68\nUsage:\
    \ pscp [options] [user]@host:source target\npscp [options] source [source=...]\
    \ [user]@host:target\npscp [options] -l [user]@host:filespec\nOptions:\n  -v print\
    \ version information and exit\n  -pgp print fingerprints and exit\n  -p preserve\
    \ file attributes\n  -q quiet, don't show statistics\n  -r copy directories recursively\n\
    \  -V show verbose message\n  -L load settings from saved session\n  -P port connect\
    \ to specified port\n  -l connect with specified username\n  -pw pass login with\
    \ specified password\n  -A force use of SSH protocol\n  -6 force use of IPv6\n\
    \  -C enable compression\n  -i key private key file for authentication\n  -moagent\
    \ disable use of Pagent\n  -agent enable use of Pagent\n  -batch disable interactive\
    \ prompts\n  -allow allow override wildcards <DANGEROUS>\n  -sftp force use of\
    \ SFTP protocol\n  -scp force use of SCP protocol\nC:\\>\n```\n\n# JASON CANNON\n\
    \nscp source destination - 将源文件复制到目标位置。\n\nsftp [username]@host - 以用户名身份连接到主机，开始安全文件传输会话。\n\
    \n如果你在寻找更具交互性的体验，可以在其中检查本地和远程文件系统，请使用 SFTP。使用 SCP 时，你需要在使用命令之前就知道想要传输哪些文件。这是一个\
    \ SFTP 会话示例。\n\n```\nbobby@laptop:~/ $ sftp bob@linuxsvr\nbob@linuxsvr's password:\n\
    Connected to linuxsvr.\nsftp> pwd\nRemote working directory: /home/bob\nsftp>\
    \ ls -la\ndrwx-xr-x 4 bob bob 4096 Dec 25 19:00 .\ndrwx-xr-x 4 root root 4096\
    \ Dec 2 22:01\n--rw-r--r-- 1 bob bob 3655 Dec 2 22:02 .bashrc\n--rw-r--r-- 1 bob\
    \ bob 675 Apr 3 2012 .profile\ndrwx------ 2 bob bob 4096 Dec 25 19:00 .ssh\nsftp>\
    \ lpwd\nLocal working directory: /tmp\nsftp> ls\nfile.txt\nsftp> put file.txt\n\
    Uploading file.txt to /home/bob/file.txt\nfile.txt\n100% 18 0.0KB/s 00:00\nsftp>\
    \ ls\nfile.txt\nsftp> ls -la\ndrwx-xr-x 4 bob bob 4096 Dec 25 19:02 .\ndrwx-xr-x\
    \ 4 root root 4096 Dec 2 22:01\n--rw-r--r-- 1 bob bob 3655 Dec 2 22:02 .bashrc\n\
    --rw-r--r-- 1 bob bob 675 Apr 3 2012 .profile\ndrwx------ 2 bob bob 4096 Dec 25\
    \ 19:00 .ssh\nsftp> quit\n```\n\n# 5 天学习 Linux\n\n使用 `scp` 你可以从本地系统传输到远程系统、从远程系统传输到本地系统，或者在两个远程系统之间传输。示例如所示：\n\
    \n```\n$ scp file.txt linuxsvr:~/file.txt\nfile.txt\n100% 35KB 35.3KB/s 00:00\n\
    $ scp linuxsvr:~/file.txt .\nfile.txt\n100% 35KB 35.3KB/s 00:00\n\n 并不是向远程系统传输文件的唯一方法。有时会启用\
    \ FTP（文件传输协议）。在这种情况下，可以使用 Linux 和 Mac 上内置的 `ftp` 命令以及 Windows 上的 WinSCP 等图形化客户端。请注意，FTP\
    \ 不使用 SCP 和 SFTP 那样的安全协议。这意味着你的登录凭据是在网络上明文传输的。此外，你上传和下载的文件也没有加密。如果在 SCP/SFTP 和\
    \ FTP 之间做出选择，请使用 SCP/SFTP。\n\n```\nbobby@laptop:~$ ftp linuxsvr\nConnected to\
    \ linuxsvr.\n220 ubuntu FTP server (Version 6.4) ready.\nName (linuxsvr:bobby):\
    \ bob\n331 Password required for bob.\nPassword:\n230 User logged in.\nRemote\
    \ system type is UNIX.\nUsing binary mode to transfer files.\nftp> pwd\n257 \"\
    /home/bob\" is current directory.\nftp> quit\n221 Goodbye.\n```\n\n如果 FTP 未启用，你会看到“连接拒绝”（Connection\
    \ refused）错误消息。\n\n```\nbobby@laptop:~$ ftp linuxsvr\nftp: connect: Connection\
    \ refused\nftp> quit\nbobby@laptop:~$\n```\n\n"
