    # Searching for Text in ASCII Files


    If you are looking for text within a file, use the **grep** command.


    grep pattern file - Search for pattern in file.


    grep -v pattern file - Invert match. Return lines from file that do not match
    pattern.


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: Abee!

    $ grep user secret

    user: bob

    $ grep o secret

    site: facebook.com

    user: bob

