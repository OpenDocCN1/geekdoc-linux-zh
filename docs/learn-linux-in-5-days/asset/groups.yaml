    ## Default Permissions and the File Creation Mask


    The file creation mask is what determines the permissions a file will be assigned
    upon its creation. The mask restricts or masks permissions, thus determining the
    ultimate permission a file or directory will be given. If no mask were present,
    directories would be created with 777 (rwxrwxrwx) permissions and files would
    be created with 666 (rw-rw-rw--). The mask is typically set by the system administrator,
    but it can be overridden on a per account basis by including a umask statement
    in your personal initialization files.


    umask [-S] [mode] - Sets the file creation mask to mode if specified. If it is
    omitted, the current mode will be displayed. Using the -S argument allows umask
    to display or set the mode with symbolic notation.


    The mode supplied to umask works in the opposite way as the mode given to chmod.
    When you supply 7 to chmod, that is interpreted to mean all permissions or rwx.
    When you supply 7 to umask, that is interpreted to mean all permissions off or
    ---. Think of chmod as turning on, adding, or giving permissions. Think of umask
    as turning off, subtracting, or taking away.


    A quick way to estimate what umask will do to the default permissions is to subtract
    octal mask from 777 in the case of directories and 666 in the case of files. Here
    is an example of umask 022 which is typically the default used by Linux distributions
    or by system administrators.


    | Dir | File |

    | --- | --- |

    | Base Permission | 777 | 666 |

    | Minus Umask | -022 | -022 |

    | Creation Permission | 755 | 644 |


    Using a umask of 002 is ideal for working with members of your group. You will
    see that when files or directories are created the permissions allow members of
    the group to manipulate those files and directories.


    | Dir | File |

    | --- | --- |

    | Base Permission | 777 | 666 |

    | Minus Umask | -002 | -002 |

    | Creation Permission | 755 | 644 |


    Here is another umask to use for working with members of your group. Use 007 so
    that no permissions are granted to users outside of the group.


    | Dir | File |

    | --- | --- |

    | Base Permission | 777 | 666 |

    | Minus Umask | -007 | -007 |

    | Creation Permission | 770 | 660 |


    Again, using this octal subtraction method is a good estimation. You can see that
    the method breaks down with umask mode of 007. In reality, to get an accurate
    result each time you need to convert octal into binary values. From there you
    use a bitwise NOT operation on umask mode and perform a bitwise AND operation
    against the base permissions. It is fine to gloss over the subtleties here since
    there are only a few umask modes. They are 022, 002, 077, and 007. Save yourself
    the binary homework and look at the following table containing all the resulting
    permissions created by each one of the eight permutations.


    | Octal | Binary | Dir Perms | File Perms |

    | --- | --- | --- | --- |

    | 0 | 000 | rwx | rw- |

    | 1 | 001 | rw- | rw- |

    | 2 | 010 | r-x | r-- |

    | 3 | 011 | r-- | r-- |

    | 4 | 100 | -wx | -w- |

    | 5 | 101 | -w- | -w- |

    | 6 | 110 | --x | --- |

    | 7 | 111 | --- | --- |


    ## Special Modes


    Look at this output of umask when the mask is set to 022.


    ```

    $ umask

    0022

    ```


    You will notice an extra leading 0. So far you have only been dealing with three
    characters that represent permissions for user, group, and other. There is a class
    of special modes. These modes are setuid, setgid, and sticky. Know that these
    special modes are declared by prepending a character to the octal mode that you
    normally use with umask chmod. The important point here is to know that umask
    0022 is the same as umask 022. Also, chmod 644 is the same as chmod 0644.


    Even though special modes will not be covered in this book, here they are for
    your reference. There are links at the end of this chapter so you can learn more
    about these modes if you are inclined.


    - setuid permission - Allows a process to run as the owner of the file, not the
    user executing it.

    - setgid permission - Allows a process to run with the group of the file, not
    of the group of the user executing it.

    - sticky bit - Prevents a user from deleting another user''s files if they would
    normally have permission to do so.


    ## umask Examples


    Here are two examples of the effects umask modes have on file and directory creation.


    ```

    $ umask

    0022

    $ umask -S

    u=rwx,g=rx,o=rx

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxr-xr-x 2 bob users 4096 Dec 5 00:03 a-dir

    -rw-r---- 1 bob users 0 Dec 5 00:03 a-file

    $ rmdir a-dir

    $ rm a-file

    $ umask 007

    $ umask

    0007

    $ umask -S

    u=rwx,g=rwx,o=

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxrwx--- 2 bob users 4096 Dec 5 00:04 a-dir

    -rw-rw---- 1 bob users 0 Dec 5 00:04 a-file

    ```


    ## FINDING FILES


    If you ever need to locate a file you can use the find command. It can be used
    to find files by name, size, permissions, owner, modification time, and more.


    find [path...] [expression] - Recursively finds files in path that match expression.
    If no arguments are supplied it finds all files in the current directory.


    ```

    $ find

    ./.profile

    ./bash_history

    ./PerfReviews

    ./PerfReviews/Fred

    ./PerfReviews/current

    ./PerfReviews/current/tps.log

    ./PerfReviews/John

    ./sales.data

    ```


