    # 压缩文件以节省空间


    - gzip file - 压缩文件。生成的压缩文件命名为 file.gz。

    - gunzip file - 解压缩文件。

    - gzcat 或 zcat - 合并并打印压缩文件。


    你可以使用命令 du 来显示文件占用了多少空间。


    - du - 估计文件使用情况。

