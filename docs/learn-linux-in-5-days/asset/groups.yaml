    \n## DAY 5\n\n## PROCESSES AND JOB CONTROL\n\n## Listing Processes and Displaying\
    \ Information\n\nTo display the currently running processes use the ps command.\
    \ If no options are specified, ps displays the processes associated with your\
    \ current session. To see every process including ones that are not owned by you,\
    \ use ps -e. To see processes running by a specific user, use ps -u username.\n\
    \nps - Display process status.\n\nCommon ps options:\n\n- -e - Everything, all\
    \ processes.\n- -f - Full format listing.\n- -u username - Display processes running\
    \ as username.\n- -p pid - Display process information for pid. A PID is a process\
    \ ID.\n\nCommon ps commands:\n\nps -e - Display all processes.\n\nps -ef - Display\
    \ all processes.\n\nps -eH - Display a process tree.\n\nps -e --forest - Display\
    \ a process tree.\n\nps -u username - Display processes running as username.\n\
    \n```bash\n$ ps\nPID TTY         TIME CMD\n19511 pts/2      00:00:00 bash\n19554\
    \ pts/2      00:00:00 ps\n$ ps -p 19511\nPID TTY         TIME CMD\n19511 pts/2\
    \      00:00:00 bash\n$ ps -f\n      PID PPID C STIME TTY       TIME CMD\nbob\
    \   19511 19509      0 16:50 pts/2  00:00:00 -bash\nbob   19556 19511      0 16:50\
    \ pts/2  00:00:00 ps -f\n$ ps -ef | head\nPID TTY         TIME CMD\n1 ?      \
    \         00:00:02 init\n2 ?               00:00:00 kthread\n3 ?             \
    \  00:00:19 ksoftirq/0\n5 ?               00:00:00 kworker/0:0H\n7 ?         \
    \      00:00:00 migration/0\n8 ?               00:00:00 rcu_bh\n9 ?          \
    \     00:00:17 rcu_sched\n10 ?              00:00:12 watchdog/0\n11 ?        \
    \      00:00:00 khelper\nUID      PID PPID C STIME TTY       TIME CMD\n```\n\n\
    ```bash\nroot      1 0 Dec 27 ?      00:00:02 /sbin/init\nroot      2 0 Dec 27\
    \ ?      00:00:00 [kthreadadd]\nroot      3 0 Dec 27 ?      00:00:19 ksoftirq/0\n\
    root      5 0 Dec 27 ?      00:00:00 kworker/0:0H\nroot      7 0 Dec 27 ?    \
    \  00:00:00 migration/0\nroot      8 0 Dec 27 ?      00:00:00 rcu_bh\nroot   \
