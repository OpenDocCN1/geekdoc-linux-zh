    # TRANSFERRING AND COPYING FILES


    You already know how to copy files from one location to another on the same system
    using the cp command. But what if you want to copy files from your local workstation
    to a Linux server or between Linux servers? For that you can use SCP or SFTP.


    SCP is secure copy and SFTP is SSH file transfer protocol. Sometimes SFTP is referred
    to as secure file transfer protocol. SCP and SFTP are both extensions of the secure
    shell (SSH) protocol. This means that if you have SSH key authentication configured
    for SSH, it will also work with SCP and SFTP.


    In order to use SCP or SFTP you need a client. Mac and Linux come with scp and
    sftp command line utilities. If you are running Windows, you can use the PuTTY
    Secure Client (pscp.exe) and the PuTTY Secure File Transfer client (psftp.exe)
    programs. Command line utilities aren''t your only option. There are graphical
    clients for each platform as well. Some run on Windows, Linux, and Mac like FileZilla,
    while others only run on one platform like WinSCP for Windows.'
