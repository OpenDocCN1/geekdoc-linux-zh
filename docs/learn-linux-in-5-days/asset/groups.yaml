    ## Graphical Editors


    So far you have learned about command line editors that are appropriate to use
    when you connect to a server via ssh. However, if you are running Linux as a desktop
    operating system you might be interested in some graphical text editors and word
    processors. Here are some for your consideration.


    - emacs - Emacs has a graphical mode, too.

    - gedit - The default text editor for the Gnome desktop environment.

    - gvim - The graphical version of vim.

    - kedit - The default text editor for the KDE desktop environment.


    If you are looking for a Microsoft Word replacement, consider AbiWord or LibreOffice.
    LibreOffice not only includes a word processor, but it is a complete office suite
    with a spreadsheet program, a database, and presentation software.


    If you are looking for a source code editor to aid in computer programming, look
    at Geany, jEdit, or Kate. Sublime Text is another option. It is a commercial product
    that runs on Windows, Mac, and Linux.


    ## Specifying a Default Editor


    Some commands rely on the $EDITOR environment variable to tell them which program
    to use for editing. Since cron''s primary purpose is to schedule jobs, it delegates
    the task of editing files to another program. The crontab -e command invokes the
    editor specified by the $EDITOR environment variable. You can set $EDITOR in your
    personal initialization files to ensure your favorite editor is used, be it nano,
    emacs, vi, or something else.


    ```

    $ echo $EDITOR

    vi

    ```


    ## Deep Dive


    - Emacs How To - An emacs tutorial. http://help.ubuntu.com/community/EmacsTo

    - Emacs built-in tutorial - Start emacs and type Ctrl-h.

    - The Beginner’s Guide to Nano http://www.howtogeek.com/howto/

    - Vi tutorial https://www.washington.edu/computing/unix/vi.html

    - vim tutorial - Run vim from the command line.

    - Welcome Back to Shell - The commands more and less are called because they allow
    you to page through a file. You will learn more about them in the "Welcome Back
    to Shell" chapter.


    ## COMPARING FILES


    If you want to compare two files and display the differences you can use diff,
    sdiff, or vimdiff.


    - diff file1 file2 - Compare two files.

    - sdiff file1 file2 - Compare two files side by.

    - vimdiff file1 file2 - Highlight the differences between two files in the editor.


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: bee!

    $ cat secret.bak

    site: facebook.com

    user: bob

    pass: bee

    $ diff secret.bak

    ```


    ## LEARN LINUX IN 5 DAYS


    ```

    < pass: bee

    > pass: bee

    $ diff secret.bak

    site: facebook.com

    user: bob

    pass: bee

    ```


    In the diff output, the text following less-than sign (<) belongs to the first
    file. The text following greater-than sign (>) belongs to the second file. The
    diff output provides some additional information. The first number represents
    line numbers from the first file and the second number represents lines from the
    second file. The middle character will be **c** meaning change, **d** meaning
    deletion, or **a** meaning addition. In the example the third line of the first
    file is changed from "pass: bee" to the text on the third line in the second file.
    In the diff output the pipe (|) means that the text differs. You will also see
    the less-than sign (<) meaning line only exists in the first file. The greater-than
    sign (>) means line only exists in the second file. Here is a screenshot of vimdiff
    demonstrating how the changes highlighted using color.


    ## DETERMINING A FILE''S TYPE


    There are clues as to what a file might contain. For instance, some files will
    have extensions. If a file ends in .txt, it is probably a text file. If a file
    has execute permissions, it might be a program. An easy way to determine the type
    of a file is to run the file command against it.


    - file - Display the file type.


    ```

    $ file /etc/passwd

    /etc/passwd: ASCII text

    $ file *

    bin: directory

    bob.tar: POSIX tar archive

    test.data: data

    test.txt: English text

    reports.sh: Bourne-Again shell script, ASCII

    text executable

    ```


    ## SEARCHING IN FILES


    If you are looking for text within a file, use the grep command.


    - grep pattern file - Search for pattern in file.

    - grep -v pattern file - Invert match. Return lines from file that do not match.


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: bee!

    $ grep user secret

    user: bob

    $ grep o secret

    site: facebook.com

    user: bob

    $ grep -v o

    pass: bee!

    ```


    ## JASON CANNON


    Here are some more common options to use with grep.


    - grep -i - Perform a search, ignoring case.

    - grep -c - Count the number of occurrences in a file.

    - grep -n - Precede output with line numbers from the file.


    ```

    $ grep secret

    $ grep -i secret

    user: bob

    $ grep -ci secret

    1

    $ grep -ni secret

    2:user: bob

    ```


    ## Searching For Text in Binary Files


    If you run grep against a binary file, it will simply display whether or not that
    information was found in the file, but it will not display the surrounding text.
    To look at textual data within a binary file use the strings command.


    - strings - Display printable strings in binary files.


    ```

    $ grep -i john BlueTrain.mp3

    Binary file BlueTrain.mp3 matches

    $ strings BlueTrain.mp3 | grep -i john

    John Coltrane

    John Coltrane

    $

    ```


    ## Pipes


    You will notice that two commands have been chained together with a vertical bar,
    also known as the pipe symbol. The pipe (|) means take the standard output from
    the preceding command and pass it to the standard input to the following command.
    If the first command displays error messages those will not be passed to the second
    command. Those error messages are called "standard error" output. You will learn
    how to manipulate standard error output in the "Redirection" chapter.


    Also notice that in the first occurrence of the `grep` command the format of `grep
    -i pattern file` was used. In the second, the format of `grep -i pattern` was
    used. In the first format the input for grep came from `file`. In the second format
    the input for grep came from the preceding command via the pipe.


    If you run `strings BlueTrain.mp3` a lot of text will be displayed on the screen.
    Instead of letting that text pass you, you can feed it to `grep -i john` using
    a pipe. The result, as you can see, is that ''John Cole'' found twice in the `strings
    BlueTrain.mp3` output.


    Pipes aren''t limited to just two commands. You can keep chaining commands together
    until you get the desired result you are looking for. Let''s feed the output from
    `grep` to `head -1` to limit the output to one line.


    ```

    $ strings BlueTrain.mp3 | grep -i john | head -1

    John Colrane

    $

    ```


    Let''s say you only want to display the second word of the above output. You can
    use the `cut` command to accomplish that goal.


    - cut [file] - Cut out selected portions of file. If file is omitted, use standard
    input.

    - cut -d delimiter - Use delimiter as the field separator.

    - cut -f N - Display the Nth field.


    To extract ''Colrane'' from ''John Colrane'', use a space as the delimiter (-d
    '' '' ) and print the second field (-f 2). The space was quoted.

