    # Locate - 快速查找


    每当你运行 `find` 命令时，它都会评估每个文件并返回相应的响应。这有时是一个缓慢的过程。例如，如果你想在系统中查找一个文件，且无法将其位置缩小到子目录，你会运行
    `find / -name something`。该命令会查看系统上的每一个文件。如果你知道文件的名称或至少是文件名的一部分，只想知道它在哪里，那么 `locate`
    命令就是完成这项工作的正确工具。


    `locate 模式` - 列出匹配模式的文件。系统上的所有文件都会由一个名为 `database` 的进程进行索引。当你运行 `locate` 时，它只是在查询索引或实时查看每个文件。这实际上非常快。缺点是数据不是实时的。如果你尝试查找一个刚刚创建的文件，它很可能还没有被索引，`locate`
    将找不到它。此外，`locate` 可能会返回匹配搜索的文件，但该文件可能自索引更新以来已从系统中删除。在某些服务器上没有安装 `locate`，因此你唯一的选择使用
    `find`。


    ```bash

    $ locate bob

    locate: No such file or directory

    $ locate tpsrep

    /home/bob/tpsreports/report.txt

    ```


