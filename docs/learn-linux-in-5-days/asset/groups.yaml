    # Locate - A fast find


    Every time you run the find command it evaluates each file and returns the appropriate
    response. This can be a slow process at times. For instance, if you are looking
    for a file on the system and cannot narrow its location down to a subdirectory
    you would find / / name something. That command looks at each and every file on
    the system. If you know the file''s name or at least part of its name and just
    want to know where it resides, the locate command is the right tool for that job.


    locate pattern - List files that match pattern. Once all the files on the system
    are indexed by a process called database. When you run locate it is simply querying
    the index or looking at each file in real time. This is really fast. The downside
    is that the data is not in date. If you are trying to find a file created just
    a few ago, chances are it is not indexed and locate will not find it. Also, locate
    can potentially return a file that matches your search, but the file may have
    been removed from the system since the index was updated. On some servers locate
    is not installed so your only choice may be to use find. Here is what it looks
    like when locate is disabled:


    ```bash

    $ locate bob

    locate: No such file or directory

    $ locate tpsrep

    /home/bob/tpsreports/report.txt

    ```


