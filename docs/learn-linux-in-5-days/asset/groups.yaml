    \ $PAGER\nless\n$ bash\n$ echo $PAGER\n\n$ exit\nexit\n$ export PAGER=less\n$\
    \ bash\n$ echo $PAGER\nless\n$ exit\nexit\n```\n\n在上面的示例中，**PAGER** 在当前环境中定义。当你启动一个子进程时，它会继承你当前环境中导出的所有环境变量。由于\
