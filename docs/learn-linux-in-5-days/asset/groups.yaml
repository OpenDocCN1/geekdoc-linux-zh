    bob@linuxsvr

    File Edit View Terminal Tabs Help

    这是第一行。

    这是第二行。

    这里有一些更多有趣的文本。

    咚咚。

    是谁在？

    更多填充文本。

    敏捷的棕色狐狸跳过了懒狗。

    那只狗相当惊讶。

    玫瑰是红色的，

    紫罗花是蓝色的，

    我的基地都是你们的。

    最后，是第 12 行也是最后一行。

    ~~

    "file.txt" 12L, 296C                 1,1 All

    ```


    # 使用 vi 进行高级编辑


    你可以通过在命令前加上数字来重复 vi 命令。例如，如果你想让光标向上移动 5 行，输入 `5k`。如果你想插入 80 次某文本，输入 `80i` 并开始输入文本。一旦按下
    `Esc` 回到命令模式，你输入的文本将重复 80 次。如果你想制作一行星号，可以输入 `80i*Esc`。你现在开始看到 vi 为什么比 nano 这样的编辑器更强大了吗？


    # 删除文本


    - x - 删除一个字符。

    - dw - 删除一个单词。要删除五个单词，输入 `d5w`。vi 中的重复概念出现在很多地方。

    - dd - 删除一行。要删除 3 行，输入 `3dd`。

    - D - 删除从当前位置到行尾的所有文本。


    # 修改文本


    - r - 替换当前字符。

    - cw - 修改当前单词。

    - cc - 修改当前行。

    - c$ - 修改从当前位置到行尾的文本。

    - C - 与 c$ 相同。

    - ~ - 反转字符的大小写。


    # 复制与粘贴


    - yy - 复制（提取）当前行。

    - y<位置> - 复制 <位置>。例如，复制一个单词输入 `yw`。复制三个单词输入 `y3w`。

    - p - 粘贴最近删除或复制的文本。


    # 撤销 - 重做


    - u - 撤销。

    - Ctrl-r - 重做。


    # 搜索


    - /<模式> - 开始正搜索。

    - ?<模式> - 开始反向搜索。


    # Emacs


    Emacs 是另一个强大的编辑器。


    emacs [file] - 编辑文件。


    emvim [file] - 与 vi 相同，但具有更多功能。


    emview [file] - 以只读模式启动 vim。当你只想查看文件而不进行任何更改时，请使用 view。


    Emacs 代表 "Extaron''s Editor"。它与 vi 中的命令兼容。Vim 的一些额外功能包括语法高亮、通过网络编辑文件的能力、多层级撤销/重做以及屏幕分屏。在许多
    Linux 发行版中，当你调用 `vi` 时，实际上运行的是 `vim`。


    学习 vi 的优势之一是 vi 或像 vim 这样的变体在系统中总是可用的。另一个优势是，一旦你学会了 vi 的按键映射，就可以将其应用到其他命令，如 `man`、`more`、`less`、`view`
    甚至你的 shell。


