    - rmdir [-p] directory - 删除目录。使用 `-p` (parents) 选项删除所有指定的目录。`rmdir` 只能删除空目录。要删除目录及其内容，请使用
    `rm`。


    - rm -rf directory - 递归删除目录以及该目录结构中的所有文件和目录。请谨慎使用。在命令行中，没有可以快速恢复你被删除文件的“回收站”容器。当你删除某个东西时，它就消失了。


