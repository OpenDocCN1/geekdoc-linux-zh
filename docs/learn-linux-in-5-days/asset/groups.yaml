- md: "\n## Exporting Environment Variables\n\nWhen a process is started it inherits\
    \ the exported environment variables of the process that spawned it. A variable\
    \ that is set or changed only effects the current running process unless it is\
    \ exported. The variables that are not exported are called local variables. The\
    \ **export** command allows variables to be used by subsequently executed commands.\
    \ Here an example.\n\n```bash\n$ echo $PAGER\n\n$ PAGER=less\n$ echo $PAGER\n\
    less\n$ bash\n$ echo $PAGER\n\n$ exit\nexit\n$ export PAGER=less\n$ bash\n$ echo\
    \ $PAGER\nless\n$ exit\nexit\n```\n\nIn the above example **PAGER** was defined\
    \ in the current environment. When you start a child process it inherits all the\
    \ environment variables that were exported in your current environment. Since\
    \ PAGER was not exported it was not set in the spawned bash shell. When you exported\
    \ PAGER you saw that it was indeed available in the child process.\n\n## Removing\
    \ Variables from the Environment\n\nYou can use unset to remove or delete an environment\
    \ variable.\n\n```bash\n$ echo $PAGER\nless\n$ unset PAGER\n$ echo $PAGER\n$\n\
    ```\n\n## Deep Dive\n\n- Bash it - A framework for managing your bash configuration.\n\
