    Web 托管服务来托管你的网站，你可能已经有一个可以使用的 Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell access”。SSH 代表
    Secure Shell（安全壳），它提供了一种连接方法。如果你使用 Web 托管服务来托管你的网站，你可能已经有一个可以使用的 Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell
    access”。SSH 代表 Secure Shell（安全壳），它提供了一种连接方法。如果你使用 Web 托管服务来托管你的网站，你可能已经有一个可以使用的
    Linux 账户。咨询你托管公司的文档并搜索“SSH”或“shell access”。SSH 代表 Secure Shell（安全壳），它提供了一种连接方法。


    以下是一些可以提供 shell 访问的 Web 托管公司：


    - and.com

    - BlueHost.com

    - DreamHost.com

    - HostGator.com

    - Site.com


    # 使用预装镜像


    VirtualBox 是一种可以安装在 Windows、Mac、Solaris 或 Linux 上的虚拟化软件。它允许你在操作系统（主机）内部运行操作系统（虚拟机）。它比其他选项更耗时，但对于你自己的
    Linux 系统是值得的。要开始，前往位于 https://www.virtualbox.org/wiki/Downloads 的 VirtualBox 下载页面并获取程序。接下来，从
    http://virtualboxes.org 下载磁盘镜像（VDI）。我建议下载 CentOS 或 Ubuntu 镜像，除非你已经知道将来与哪个 Linux
    发行版工作。说实话，你不会做错。启动 VirtualBox，创建一个虚拟机，并使用你下载的磁盘镜像。在询问硬盘镜像时选择“使用现有硬盘”单选按钮并点击目录图标。接下来，点击“添加”并选择磁盘镜像。当虚拟机开启电源后，你可以使用提供的用户名和密码登录服务器。


    # 深度解析


    这些链接以及补充材料可用：


    http://www.linuxxtrainingacademy.com/lfb


    - [如何在 Mac 上安装 VirtualBox - 一段引导你在 Mac 上安装 VirtualBox 的视频](https://youtu.be/CBQdflx1L1o)

    [如何在 Windows 上安装 VirtualBox - 一段引导你在 Windows 上安装 VirtualBox 的视频](https://youtu.be/CBhppdewtEQ)

    - [VirtualBox 文档 - 官方 VirtualBox 文档](https://www.virtualbox.org/wiki/Documentation)

    - [VirtualBox 下载页面 - 获取 VirtualBox 软件的地方](https://www.virtualbox.org/wiki/Downloads)

    - [VirtualBoxes.org - 磁盘镜像的好来源](http://virtualboxes.org/)


    # 获取连接


    当账户创建时，将提供有关连接到 Linux 服务器的详情。你可能会收到部分或全部信息：


    字体 用户名。也称为账户、登录名或 ID。

    - 密码

    - SSH 密钥

    - 服务器名称或 IP 地址

    - 端口号

    - 连接协议


    连接协议将是 SSH（安全壳）或 telnet。SSH 和 telnet 提供了通过 Internet或局域网连接到服务器的方法。在大多数情况下，连接协议将是
    SSH。telnet 现在几乎几乎过时，但如果你需要访问遗留系统，你可能会遇到它。


