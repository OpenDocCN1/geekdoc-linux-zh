- md: "\n# WELCOME BACK TO SHELL\n\n## Customizing the Prompt\n\n\\h - the hostname\
    \ up to the first '.'\n\n# LEARN LINUX IN 5 DAYS\n\n\\H - the hostname\n\n\\n\
    \ - newline\n\n\\t - the current time in 24-hour HH:MM:SS format\n\n\\T - the\
    \ current time in 12-hour HH:MM:SS format\n\n\\@ - the current time in 12-hour\
    \ am/pm format\n\n\\A - the current time in 24-hour HH:MM format\n\n\\u - the\
    \ username of the current user\n\n\\w - the current working directory, $HOME abbreviated\
    \ with a tilde\n\n\\W - the basename of the current working directory, $HOME abbreviated\
    \ with a tilde\n\n\\$ - if the effective UID is 0\n\nHere are some examples of\
    \ changing bash shell prompt by manipulating the PS1 variable.\n\n```\n[bob@linuxsvr\
    \ ~] echo $PS1\n[@\\h \\w]\\$\n[bob@linuxsvr ~$] PS1=\"\\u@h \"nbob@linuxsvr $\
    \ PS1=\"\\t \\u@h \\w>\"\n16:42:58 bob@linuxsvr ~\\$ cd /tmp\n16:43:02 bob@linuxsvr\
    \ ~/tmp$ PS1=\"\\d -t \\h \\w\\$\"\nNov 18 16:45:51 linuxsvr tmp$ PS1=\"\\t\\\
    n[\\h \\w]\\$\"\n16:46:47\n[linuxsvr /tmp]$\n```\n\nTo make your customized shell\
    \ prompt persist between logins, the PS1 value to your personal initialization\
    \ files. Personal initialization files are commonly referred to as \"dot files\"\
    \ since they begin with a dot or period.\n\n$ echo 'export PS1=\"[\\u@h \\w]\\\
    $ \" >> \\\n~/.bash_profile\n\n# Creating Aliases\n\nIf you find yourself typing\
    \ the same command over and over again, you can create a shortcut for it called\
    \ an alias. An alias can be thought of as a text expander. Creating aliases for\
    \ commands that are really long is also a common practice. For example, if you\
    \ type `ls -l` frequently, you may want to abbreviate it to `ll`. As a matter\
    \ of fact, this alias often comes predefined on many Linux distributions.\n\n\
    alias [name[value]] - List or create aliases. If no arguments provided the current\
    \ list of aliases is displayed. Use name=value to create a new alias.\n\n```\n\
    $ ls -l\ntotal 4\n-rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt\n$ alias ll1='ls\
    \ -l'\n$ ll\ntotal 4\n-rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt\n$ alias\nalias\
    \ egrep='egrep --color=auto'\nalias fgrep='fgrep --color=auto'\nalias grep='grep\
    \ --color=auto'\nalias l=ls='ls -CF'\nalias la=ls='ls -A'\nalias ll=ls='ls -1'\n\
    alias ls=ls='ls --color=auto'\n$\n```\n\nYou can even use aliases to fix common\
    \ typing errors. If you find yourself typing `grep` when you intend to type `grep`,\
    \ create an alias.\n\n```\n$ alias grpe='grep'\n```\n\nAliases can be created\
    \ to make your work environment similar to that of\n\n# LEARN LINUX IN 5 DAYS\n\
    \nanother platform. For instance, in Windows cls clears the screen, but in Linux\
    \ the equivalent command is clear. If you are coming from an HP-UX background\
    \ you are most likely familiar with the command bdf which displays disk usage.\
    \ On Linux a very similar command is df. You could create these shortcuts to help\
    \ you feel more at home.\n\n```\n$ alias cls='clear'\n$ alias bdf='df'\n```\n\n\
    Note that if you were to log out and log back in, your aliases would be lost.\
    \ To make them persist between sessions add them to one of your personal initialization\
    \ files (dot files) .bash_profile.\n\nThe downside of creating several aliases\
    \ is when you are on a system that does not have your aliases you might feel lost.\
    \ If you want to be able to work effectively on any system that you have access\
    \ to, keep your alias usage to a minimum. Another way to handle this situation\
    \ is to copy your configuration files to each system that you work on.\n\n# Interactive\
    \ vs Non-interactive Sessions\n\nThe shell behaves in slightly different ways\
    \ when you log on interactively versus when you just connect to run a single command.\
    \ Here is an example to better illustrate the difference between interactive and\
    \ non-interactive shells.\n\nInteractive:\n\n```\nmac:~ bob$ ssh linuxsvr\nLast\
    \ login: Nov 7 01:26:37 UTC 2013\nWelcome to Ubuntu 12.04.3 LTS\n\n* Documentation:\
    \ https://help.ubuntu.com/\n\nSystem info as of Nov 14 01:26:52 UTC 2013\n\nSystem\
    \ load: 0.42\n```\n\n# JASON CANNON\n\n```\nUsage of /: 3.1% of 40GB\nMemory usage:\
    \ 32%\nSwap usage: 0%\nProcesses: 89\nUsers logged in: 0\nIP address for eth0:\
    \ 10.0.0.7\n```\n\n```\nbob@linuxsvr~$ uptime\n11:49:16 up 97 days, 2:59, 5 users,\
    \ load average:\n0.15, 0.25, 0.31\n```\n\n```\nbob@linuxsvr~$ ls\n-rw-r--r-- 1\
    \ bob bob 221 Nov 13 11:30 file.txt\nbob@linuxsvr~$ exit\nlogout\nConnection to\
    \ 10.0.0.7 closed.\nmac~ bob$\n```\n\n# Non-interactive:\n\n```\nmac~ bob$ ssh\
    \ linuxsvr uptime\n11:49:16 up 97 days, 2:59, 5 users, load average:\n0.15, 0.25,\
    \ 0.31\nmac~ bob$ ssh linuxsvr 11\nbash: 11: command not found\nmac~ bob$\n```\n\
    \nThe contents of .profile or .bash_profile are only executed for interactive\
    \ sessions. If you are not aware of this subtle difference it may leave you scratching\
    \ your head as to why something works perfectly when you log in and type a command\
    \ versus you just ssh to run that same command. For example, if you define an\
    \ alias for 11 in ~/.bash_profile it will work during an interactive session but\
    \ it will not be available during a non-interactive session.\n\nYou can save yourself\
    \ some hassle by making your interactive and non-interactive sessions behave the\
    \ same. To do this, configure .bash_profile to reference .bashrc and put all of\
    \ your configuration in .bashrc. You can read in the contents of another file\n\
    \n# LEARN LINUX IN 5 DAYS\n\nby using the source command or dot operator.\n\n\
    source filename - Read and execute commands from filename and return. Any variables\
    \ created or modified in filename will remain available after the script completes.\n\
    \n+ - filename - Same as source filename.\n\n```\n$ cat .bash_profile\n# Put our\
    \ settings in .bashrc so we have the same\nenvironment for login and non-login\
    \ shells.\nif [ -f ~/.bashrc ]; then\n  source ~/.bashrc\nfi\n$ cat .bashrc\n\
    # use a vi-style line editing interface\nset -o vi\n\n# Set the prompt.\nPS1=\"\
    [\\u\\h \\w]\\$\"\nexport PS1\n\n# Set the PATH.\nPATH=$PATH~/bin\nexport PATH\n\
    \n# Aliases\nalias grpe='grep'\nalias ll='ls -l'\nalias utc='TZ=UTC date'\nalias\
    \ vi='vim'\n```\n\nNow the aliases you have defined are available during interactive\
    \ and non-interactive sessions. Here is how the sessions behave after this change.\n\
    \nInteractive:\n\n```\nmac:~ bob$ ssh linuxsvr\nLast login: Nov 7 01:26:37 UTC\
    \ 2013\nWelcome to Ubuntu 12.04.3 LTS\n\n* Documentation: https://help.ubuntu.com/\n\
    \nSystem info as of Nov 14 01:26:52 UTC 2013\n\nSystem load: 0.42\nUsage of /:\
    \ 3.1% of 40GB\nMemory usage: 32%\nSwap usage: 0%\nProcesses: 89\nUsers logged\
    \ in: 0\nIP address for eth0: 10.0.0.7\n```\n\n```\nbob@linuxsvr~$ uptime\n11:49:16\
    \ up 97 days, 2:59, 5 users, load average:\n0.15, 0.25, 0.31\n```\n\n```\nbob@linuxsvr~$\
    \ ls\n-rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\nbob@linuxsvr~$ exit\nlogout\n\
    Connection to 10.0.0.7 closed.\nmac~ bob$\n```\n\nNon-interactive:\n\n```\nmac~\
    \ bob$ ssh linuxsvr uptime\n11:49:16 up 97 days, 2:59, 5 users, load average:\n\
    0.15, 0.25, 0.31\nmac~ bob$ ssh linuxsvr 11\nbash: 11: command not found\nmac~\
    \ bob$\n```\n\n# Comments\n\nIn the above examples you might have noticed the\
    \ octothorpe (#) followed by some human like text in ~/.bash_profile and ~/.bashrc\
    \ files. Any text that follows an octothorpe is ignored by the shell. This is\
    \ a very common pattern that not only works for shells, but also for several programming\
    \ languages.\n\nOctothorpe. Also known as a hash, square, pound sign, or number\
    \ sign. This symbol precedes comments.\n\n```\n$ # This does nothing.\n$ This\
    \ does something.\nThis: command not found\n$ alias -- Show my aliases.\nalias\
    \ egrep='egrep --color=auto'\nalias fgrep='fgrep --color=auto'\nalias grep='grep\
    \ --color=auto'\nalias l1='ls -CF'\nalias la1='ls -A'\nalias ll1='ls -l'\nalias\
    \ ls1='ls --color=auto'\n$\n```\n\n# Shell History\n\nThe shell keeps a record\
    \ of the commands you have previously executed. Bash keeps its history in memory\
    \ for the current session and in the ~/.bash_history file so it can be recalled\
    \ during future sessions. Other shells may use ~/.history, ~/.zsh_history, or\
    \ other similarly named files. Having access to your shell history is extremely\
    \ useful because it allows you to quickly repeat commands. This can save you time,\
    \ save keystrokes, prevent you from making mistakes by running a previously known\
    \ good command, and generally speed up your work flow.\n\nhistory - Display a\
    \ list of commands in the shell history.\n\n!N - Repeat command line N.\n\n!!\
    \ - Repeat the previous command line.\n\n!string - Repeat the most recent command\
    \ starting with \"string\".\n"
  mdcn: "\n\n# 欢迎回到 SHELL\n\n## 自定义提示符 (Prompt)\n\n\\h - 到第一个 '.' 之前的主机名\n\n# 5天学会\
    \ Linux\n\n\\H - 主机名\n\n\\n - 换行\n\n\\t - 24 小时制 HH:MM:SS 的当前时间\n\n\\T - 12 小时制\
    \ HH:MM:SS 的当前时间\n\n\\@ - 12 小时制 am/pm 格式的当前时间\n\n\\A - 24 小时制 HH:MM 的当前时间\n\n\
    \\u - 当前用户的用户名\n\n\\w - 当前工作目录，$HOME 用波浪号 ~ 缩写\n\n\\W - 当前工作目录的基名（basename），HOME\
    \ 用波浪号 ~ 缩写\n\n\\$ - 如果有效 UID 为 0\n\n以下是一些通过操作 PS1 变量更改 bash shell 提示符的示例。\n\n\
    ```\n[bob@linuxsvr ~] echo $PS1\n[@\\h \\w]\\$\n[bob@linuxsvr ~$] PS1=\"\\u@h\
    \ \"nbob@linuxsvr $ PS1=\"\\t \\u@h \\w>\"\n16:42:58 bob@linuxsvr ~\\$ cd /tmp\n\
    16:43:02 bob@linuxsvr ~/tmp$ PS1=\"\\d -t \\h \\w\\$\"\nNov 18 16:45:51 linuxsvr\
    \ tmp$ PS1=\"\\t\\n[\\h \\w]\\$\"\n16:46:47\n[linuxsvr /tmp]$\n```\n\n为了让你自定义的\
    \ shell 提示符在登录之间持久存在，将 PS1 值写入你的个人初始化文件。个人初始化文件通常被称为“点文件”（dot files），因为它们以点（period）开头。\n\
    \n$ echo 'export PS1=\"[\\u@h \\w]\\$ \" >> \\\n~/.bash_profile\n\n# 创建别名 (Aliases)\n\
    \n如果你发现自己自己在反复复地输入相同的命令，可以为它创建一个快捷方式，称为别名（alias）。别名可以被看是一个文本扩展器。为很长的命令创建别名也是一种常见的做法。例如，如果你经常输入\
    \ `ls -l`，你可能想将其缩写为 `ll`。事实上，这个别名在许多 Linux 发行版中已经预定义了。\n\nalias [name[value]]\
    \ - 列出或创建别名。如果没有提供参数，则显示当前的别名列表。使用 name=value 创建新别名。\n\n```\n$ ls -l\ntotal 4\n\
    -rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt\n$ alias ll1='ls -l'\n$ ll\ntotal 4\n\
    -rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt\n$ alias\nalias egrep='egrep --color=auto'\n\
    alias fgrep='fgrep --color=auto'\nalias grep='grep --color=auto'\nalias l=ls='ls\
    \ -CF'\nalias la=ls='ls -A'\nalias ll=ls='ls -1'\nalias ls=ls='ls --color=auto'\n\
    $\n```\n\n你甚至可以使用别名来修复常见的输入错误。如果你发现自己本想输入 `grep` 却打成了 `grpe`，就为其创建一个别名。\n\n```\n\
    $ alias grpe='grep'\n```\n\n创建别名可以让你你的工作环境与另一个平台相似。\n\n# 5天学会 Linux\n\n例如，在 Windows\
    \ 中 `cls` 清除屏幕，但在 Linux 中等效的命令是 `clear`。如果你有 HP-UX 背景，你很可能熟悉显示磁盘用量的 `bdf` 命令。在\
    \ Linux 上，非常相似的命令是 `df`。你可以创建这些快捷方式来帮助自己感觉更习惯。\n\n```\n$ alias cls='clear'\n$\
    \ alias bdf='df'\n```\n\n注意，如果你注销并重新登录，你的别名将会丢失。为了让它们持久存在，请将它们添加到你的个人初始化文件（点文件）`.bash_profile`\
    \ 中。\n\n创建多个别名的缺点是，当你处于一个没有你别名的系统时，可能会感到不知所措。如果你希望在访问的任何系统中都能高效工作，请将别名的使用减少到最低。处理这种情况的另一种方法是将配置文件复制到你工作的每个系统中。\n\
    \n# 交互式 vs 非交互式会话 (Interactive vs Non-interactive Sessions)\n\n交互式登录与仅仅连接运行单个命令时，shell\
    \ 的行为略有不同。有一个例子可以更好地说明交互式和非交互式 shell 之间的区别。\n\n交互式：\n\n```\nmac:~ bob$ ssh linuxsvr\n\
    Last login: Nov 7 01:26:37 UTC 2013\nWelcome to Ubuntu 12.04.3\n\n* Documentation:\
    \ https://help.ubuntu.com/\n\nSystem info as of Nov 14 01:26:52 UTC 2013\n\nSystem\
    \ load: 0.42\n```\n\n# JASON CANNON（注：此处原文可能为人名或占位符，保持原样或翻译）\n\n```\nUsage of\
    \ /: 3.1% of 40GB\nMemory usage: 32%\nSwap usage: 0%\nProcesses: 89\nUsers logged\
    \ in: 0\nIP address for eth0: 10.0.7\n```\n\n```\nbob@linuxsvr~$ uptime\n11:49:16\
    \ up 97 days, 2:59, 5 users, load average:\n0.15, 0.25, 0.31\n```\n\n```\nbob@linuxsvr~$\
    \ ls\n-rw-r--r-- 1 bob 221 Nov 13 11:30 file.txt\nbob@linuxsvr~$ exit\nlogout\n\
    Connection to 10.0.0.7 closed.\nmac~ bob$\n```\n\n非交互式：\n\n```\nmac:~ bob$ ssh\
    \ linuxsvr uptime\n11:49:16 up 97 days, 2:59, 5 users, load average:\n0.15, 0.25,\
    \ 0.31\nmac~ bob$ ssh linuxsvr 11\nbash: 11: command not found\nmac~ bob$\n```\n\
    \n.profile 或 .bash_profile 的内容只在交互式会话中执行。如果你没有意识到这种细微的区别，可能会困惑为什么某些东西在登录并输入命令时运行完美，但在非交互式会话中却不可用。你可以通过让交互式和非交互式会话行为一致来节省一些麻烦。为此，配置\
    \ `.bash_profile` 将你所有的配置写入 `.bashrc` 中。\n\n# 5天学会 Linux\n\n通过使用 `source` 命令或点操作符\
    \ `.` 读取文件。\n\nsource filename - 读取并执行 filename 并返回。在 filename 中创建或修改的变量在脚本完成后仍然有效。\n\
    \n. - 与 source filename 相同。\n\n```\n$ cat .bash_profile\n# 将我们的设置写入 .bashrc 以便拥有相同的登录和非登录\
    \ shell 环境\nif [ -f ~/.bashrc ]; then\n  source ~/.bashrc\nfi\n$ cat .bashrc\n\
    # 使用 vi 风格的行编辑界面\nset -o vi\n\n# 设置提示符。\nPS1=\"[\\u\\h \\w]\\$\"\nexport PS1\n\
    \n# 设置 PATH。\nPATH=$PATH~/bin\nexport PATH\n\n# 别名\nalias grpe='grep'\nalias ll='ls\
    \ -l'\nalias utc='TZ=UTC date'\nalias vi='vim'\n```\n\n现在定义的别名在交互式和非交互式会话中可用。这是更改后会话的行为。\n\
    \n交互式：\n\n```\nmac:~ bob$ ssh linuxsvr\nLast login: Nov 7 01:26:37 UTC 2013\n\
    Welcome to Ubuntu 12.04.3 LTS\n\n* Documentation: https://help.ubuntu.com/\n\n\
    System info as of Nov 14 01:26:52 UTC 2013\n\nSystem load: 0.42\nUsage of /: 3.1%\
    \ of 40GB\nMemory usage: 32%\nSwap usage: 0%\nProcesses: 89\nUsers logged in:\
    \ 0\nIP address for eth0: 10.0.0.7\n```\n\n```\nbob@linuxsvr~$ uptime\n11:49:16\
    \ up 97 days, 2:59, 5 users, load average:\n0.15, 0.25, 0.31\n```\n\n```\nbob@linuxsvr~$\
    \ ls\n-rw-r--r-- 1 bob bob 221 Nov 13 11:30 file.txt\nbob@linuxsvr~$ exit\nlogout\n\
    Connection to 10.0.0.7 closed.\nmac~ bob$\n```\n\n非交互式：\n\n```\nmac~ bob$ ssh\
    \ linuxsvr uptime\n11:49:16 up 97 days, 2:59, 5 users, load average:\n0.15, 0.25,\
    \ 0.31\nmac~ bob$ ssh linuxsvr 11\nbash: 11: command not found\nmac~ bob$\n```\n\
    \n# 注释 (Comments)\n\n在上面的示例中，你可能注意到 `.bash_profile` 和 `.bashrc` 文件中井号（#）后面跟着一些类人类可读的文本。井号之后的任何文本都会被\
    \ shell 忽略。这是一个非常常见的模式，不仅适用于 shell，也适用于多种编程语言。\n\n井号。也称为 hash、square、pound sign\
    \ 或 number sign。该符号位于注释之前。\n\n```\n$ # 这都不做。\n$ 这做了什么。\nThis: command not found\n\
    $ alias -- 显示我的别名。\nalias egrep='egrep --color=auto'\nalias fgrep='fgrep --color=auto'\n\
    alias grep='grep --color=auto'\nalias l1='ls -CF'\nalias la1='ls -A'\nalias ll1='ls\
    \ -l'\nalias ls1='ls --color=auto'\n$\n```\n\n"
