  - '[PAGE 171]


    # JASON CANNON


    ```

    $ jobs

    [1] Done /long-running-program

    [2] Done /long-running-program

    [3]- Running /long-running-program &\n[4]+ Running /long-running-program &

    ```


    The plus sign (+) in the jobs output represents the current job while the minus
    (-) represents the previous job. The current job is considered to be the last
    job that was stopped while it was in the foreground or the last job started in
    the background. The current job can be referred to by %% or +%. If no job information
    is supplied to the fg or bg commands, the current job is operated upon. The previous
    job can be referred to by %-.


    You will notice that job number 1 and 2 are reported as being done. The shell
    does not interrupt your current command line, but will report job statuses before
    a new prompt is displayed. For example, if you start a program in the background
    a prompt is returned. The shell will not report the status of the job until a
    new prompt is displayed. You can request a new prompt be displayed by hitting
    Enter.


    To bring a job back to the foreground, type the name of the job or use the fg
    command. To foreground the current job execute %%, +, fg, fg %%, fg +, or fg %num.
    To foreground job 3, execute %3 or fg3.


    ```

    $ jobs

    [3]- Running /long-running-program &

    [4]+ Running /long-running-program &

    $ %3

    /long-running-program

    ```


    To pause or suspend a job that is running in the foreground, type Ctrl-z. Once
    a job is suspended it can be resumed in the foreground or background. To background
    a suspended job type the name of the job followed by an ampersand or use bg followed
    by the job name.


    ```

    $ jobs

    ```'
