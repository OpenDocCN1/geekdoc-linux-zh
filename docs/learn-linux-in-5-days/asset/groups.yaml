    # APPENDIX B: FAQ


    Q: Where can I access all the links in this book?


    The links covered in this book along with other supplemental material is available
    at:


    http://www.linxtrainingacademy.com/lfb


    Q: What is Linux?


    Linux is an open-source operating system modelled after UNIX.


    Q: What is the Linux kernel?


    The Linux kernel handles the interactions between the software running on the
    system and the hardware. To learn more, visit the official Linux kernel website
    at http://www.kernel.org.


    Q: Which Linux distribution should I use?


    If your goal is to eventually become a Linux system administrator, focus on CentOS
    or Ubuntu. CentOS is a Red Hat Enterprise Linux (RHEL) derivative. As a general
    rule, CentOS and RHEL are often found in'
  - '[PAGE 208]


    corporate environments. Ubuntu is popular with startups and smaller companies
    that run their operations in the cloud. If you are Linux for your own personal
    reasons, choose a distribution that appeals to you. To get some ideas look at
    DistroWatch.com''s top 10 distributions page.


    Here are some other common Linux distributions:


    +   - Arch Linux - https://www.archlinux.org/

    - Debian - http://www.debian.org/

    - Fedora - http://fedoraproject.org/

    - LinuxMint - http://www.linuxmint.com/

    - Mageia - http://www.mageia.org/

    - openSUSE - http://www.opensuse.org/


    There are several special purpose Linux distributions that focus on a single area.
    Examples areas of focus include education, minimalism, multimedia, networking/firewalls,
    and security. Here is just a sampling of the available specialty distros.


    +   - ArtistX - A DVD which turns a computer into a full multimedia production
    studio.

    http://artistx.org/

    - Edubuntu - An education oriented operating system.

    http://www.edubuntu.com/

    - live.linuxX-gamers.net - A live Linux distribution focused on gaming.

    http://live.linux-gamers.net/

    - Mythbuntu - Mythbuntu is focused upon setting up a'
  - '[PAGE 209]


    # JASON CANNON


    standalone MythTV by PVR (personal video recorder) system.

    http://www.mythbuntu.org/


    +   - Parted Magic - A Hard disk management solution.

    https://partedmagic.com/


    +   - Scientific Linux - Scientific Linux is put together by Fermilab, CERN, and
    other labs and universities around the world. Its primary purpose is to reduce
    duplicated effort of the labs, and to have a common install base for the various
    experimenters.

    https://www.scientificinux.org/


    +   - Ubuntu Studio - Provides the full range of multimedia content creation applications
    for audio, graphics, video, photography and publishing.

    http://ubuntudio.org/


    +   - VortexBox - VortexBox is a multifunctional solution to rip, store and stream
    CDs, digital music and Internet radio.

    http://www.vortexbox.co.uk/


    Q: Can I use Microsoft Office in Linux?


    Microsoft Office is not available for Linux, however there are alternatives such
    as LibreOffice, Open Office, and AbiWord.


    Q: How do I run XYZ program in Linux?


    To find Linux alternatives for software you use on Mac and Windows, visit http://alternativo.net/.'
