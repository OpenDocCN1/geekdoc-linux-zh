    # BASIC LINUX COMMANDS


    Here is a short list of basic, but essential commands. In Linux, commands are
    case-sensitive and more often than they are not entirely in lowercase. Items that
    are surrounded by brackets ([ \]) are optional. You will more than likely you
    use at least some of these commands every time you log into a Linux system. Become
    familiar with these commands because they can get you pretty far in a short amount
    of time.


    ls - Lists directory contents. You will use ls to display information about files
    and directories.


    cd [dir] - Changes the current directory to dir. If you execute cd without specifying
    a directory, cd changes the current directory to your home directory. This is
    how you navigate around the system.


    pwd - Displays the present working directory name. If you don''t know what directory
    you are in, pwd will tell you.


    cat [file] - Concatenates and displays files. This is the command you run to view
    the contents of a file.


    echo [argument] - Displays arguments to the screen.'
