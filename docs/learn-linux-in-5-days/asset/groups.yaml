- md: "\n# Standard Error\n\nWhen a program encounters an error it reports its findings\
    \ to standard error. File descriptor 1 is for standard output, 2 is for standard\
    \ error. Remember that file descriptor 1 is the default file descriptor for output\
    \ redirection. This can mean that not all of the output generated by a program\
    \ is captured by default. Here is an example.\n\n```\n$ ls here-not-here\nls:\
    \ not-here: No such file or directory\nhere\n$ ls here-not-here > out\nls: not-here:\
    \ No such file or directory\n$ cat out\nhere\n$ ls here-not-here 2> out.err\n\
    here\n\ncat out.err\nls: not-here: No such file or directory\n$ ls here-not-here\
    \ 1> out 2> out.err\n$ cat out\nhere\n$ cat out.err\nls: not-here: No such file\
    \ or directory\n$\n```\n\nYou will notice that using > the error message was displayed\
    \ to the screen and not redirected to the out file. To redirect the error messages\
    \ you had to explicitly specify file descriptor 2 with 2>. You can send standard\
    \ output to one file while sending standard error to another file. You can use\
    \ this to your advantage by having one file that contains known good output and\
    \ another file that you can examine for errors.\n\nIf you want to capture both\
    \ standard output and standard error, use 2>&1. Normally with redirection a file\
    \ follows the redirection operator. If you want to use a file descriptor instead\
    \ of a file name, use the ampersand (&) symbol. So instead of redirecting standard\
    \ error to a file (2>out.err), redirect it to standard output (2>&1). If you omit,\
    \ &1 will be treated as a file named 1.\n\n- Used with redirection to signal that\
    \ a file descriptor is being used instead of a file name.\n- 2>&1 - Combine standard\
    \ error and standard output.\n\n```\n$ ls here not-here > out.both 2>&1\n$ cat\
    \ out.both\nls: not-here: No such file or directory\nhere\n```\n\nThe command,\
    \ ls here not-here > out.both 2>&1 means \"send the standard output of ls here\
    \ not-here to file named out.both and append standard error to standard output.\"\
    \ Since standard error is redirected to standard output and standard output is\
    \ redirected to out.both, all output will be written to out.both.\n\n# Null Device\n\
    \n>/dev/null - Redirect output to nowhere.\n\nIf you want to ignore output, you\
    \ can send it to the null device, /dev/null. The null device is a special file\
    \ that throws away whatever is fed to it. You may hear people refer to it as the\
    \ bit bucket. If you do not want to save errors on your screen and you do not\
    \ want to save them to a file, you can redirect them to /dev/null.\n\n```\n$ ls\
    \ here not-here 2> /dev/null\nhere\n```\n\n```\n$ ls here not-here > /dev/null\
    \ 2>&1\n$\n```\n\n# Deep Dive\n\n- File Descriptors http://en.wikipedia.org/wiki/File_descriptor\n\
    - Here Documents http://en.wikipedia.org/wiki/Here-document\n- Null Device http://en.wikipedia.org/wiki/dev/null\n\
    - Redirection http://en.wikipedia.org/wiki/Redirection_(computing)\n\n# TRANSFERRING\
    \ AND COPYING FILES\n\nYou already know how to copy files from one location to\
    \ another on the same system using the cp command. But what if you want to copy\
    \ files from your local workstation to a Linux server or between Linux servers?\
    \ For that you can use SCP or SFTP.\n\nSCP is secure copy and SFTP is SSH file\
    \ transfer protocol. Sometimes SFTP is referred to as secure file transfer protocol.\
    \ SCP and SFTP are both extensions of the secure shell (SSH) protocol. This means\
