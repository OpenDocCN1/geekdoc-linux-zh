    # INSTALLING SOFTWARE


    Typically when you install software on a Linux system you do so with a package.
    A package is a collection of files that make up an application. Additionally,
    a package contains data about the application as well as any steps required to
    successfully install and remove that application. The data, or metadata, that
    is contained within a package can include information such as the description
    of the application, the version of the application, and a list of other packages
    that it depends on. In order to install or remove a package you need to use superuser
    privileges.


    A package manager is used to install, upgrade, and remove packages. Any additional
    software that is required for a package to function properly is known as a dependency.
    The package manager uses a package''s metadata to automatically install the dependencies.
    Package managers keep track of what files belong to what packages, what packages
    are installed, and what versions of those packages are installed.


    # Installing Software on CentOS, Fedora, and RedHat Distributions


    The yum command line utility is a package management program for Linux distributions
    that use the RPM package manager. CentOS, Fedora, Oracle Linux, RedHat Enterprise
    Linux, and Scientific Linux are RPM based distributions on which you can use yum.


    `yum search search-string` - Search for search-string.


    `yum install [-y] package` - Install package. Use the -y option to automatically
    answer yes to yum''s questions.


    `yum remove package` - Remove/uninstall package.


    `yum info [package]` - Display information about package.


    To search for software to install, use yum search search-string.


