    # Working with Groups


    If you work on the sales team and each member needs to update the sales.report
    file, you would set the group to sales using the chgrp command and then set the
    permissions to 664 (rw-rw-r--). You could even use 660 (rw-rw---) permissions
    if you want to make sure only members of the sales team can read the report. Technically
    774 (rwxrxr--) or 770 (rwxwx---) permissions work also, but since sales.report
    is not an executable program it makes more sense to use 664 (rw-rw-r--) or 660
    (rw-rw---).


    When you create a file its group is set to your primary group. This behaviour
    can be overridden by using the newgrp command, but keep in mind when you create
    a file it typically inherits your default group. In this example Bob''s primary
    group is users. Note that the format of the chgrp command is chgrp GROUP FILE.


