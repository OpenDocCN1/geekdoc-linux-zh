    # Running Processes in the Foreground and Background


    Up until this point all the commands you have been been running in the foreground.
    When a command, process, or program is running in the foreground the shell prompt
    will not be displayed until that process exits. For long running programs it can
    be convenient to send them to the background. Processes that are backgrounded
    still execute and perform their task, however they do not block you from entering
    further commands at the shell prompt. To background a process, place an ampersand
    (&) at the end of the command.'
  - '[PAGE 170]


    command & - Start command in the background.


    Ctrl-c - Kill the foreground process.


    Ctrl-z - Suspend the foreground process.


    bg [%num] - Background a suspended process.


    fg [%num] - Foreground a background process.


    kill [%num] - Kill a process by job number or PID.


    jobs [%num] - List jobs.


    ```

    $ ./long-running-program &

    [1] 22686

    $ ps -p 22686

