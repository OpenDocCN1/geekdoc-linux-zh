    \ Running ./another-program &\n$\n```\n\n# Killing Processes\n\nCtrl-c - Kills\
    \ the foreground process.\n\nkill [signal] pid - Send a signal to a process.\n\
    \nkill -l - Display a list of signals.\n\nThe default signal used by kill is termination.\
    \ You will see this signal referred to as SIGTERM or TERM for short. Signals have\
    \ numbers that correspond to their names. The default TERM signal is number 15.\
    \ So running kill pid, kill -15 pid, and kill -TERM pid are all equivalent. If\
    \ a process does not terminate when you send it the TERM signal, use the KILL\
