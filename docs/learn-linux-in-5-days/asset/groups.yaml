    -e 命令调用由 $EDITOR 环境变量指定的编辑器。你可以在个人的初始化文件中设置 $EDITOR，以确保使用你喜欢的编辑器，无论是 nano、emacs、vi
    还是其他。


    ```

    $ echo $EDITOR

    vi

    ```


    ## 深度学习


    - Emacs How To - 一个 emacs 教程。http://help.ubuntu.com/community/EmacsTo

    - Emacs built-in tutorial -  emacs 并输入 Ctrl-h。

    - The Beginner’s Guide to Nano http://www.howtogeek.com/howto/

    - Vi tutorial https://www.washington.edu/computing/unix/vi.html

    - vim tutorial - 从命令行运行 vim。

    - Welcome Back to Shell - more 和 less 命令之所以这样命名，是因为它们允许你对文件进行分页。你将在“Welcome Back
    to Shell”章节中学习更多关于它们的知识。


    ## 文件


    如果你想比较两个文件并显示差异，可以使用 diff、sdiff 或 vimdiff。


    - diff file1 file2 - 比较两个文件。

    - sdiff file1 file2 - 左右比较两个文件。

    - vimdiff file1 file2 - 在编辑器中突出两个文件之间的差异。


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: bee!

    $ cat secret.bak

    site: facebook.com

    user: bob

    pass: bee

    $ diff secret.bak

    ```


    ## 5天学习 LINUX


    ```

    < pass: bee

    > pass: bee

    $ diff secret.bak

    site: facebook.com

    user: bob

    pass: bee

    ```


    在 diff 输出中，紧跟小于号 (<) 的文本属于第一个文件。紧跟大于号 (>) 的文本属于第二个文件。diff 输出提供了一些额外信息。第一个数字代表第一个文件的行号，第二个数字代表第二个文件的行号。中间字符将
    **c** 表示更改（change）、**d** 表示删除（deletion）或 **a** 表示添加（addition）。示例中，第一个文件的第三行从 "pass:
    bee" 变为第二个文件第三行的文本。在 diff 输出中，管道符号 (|) 表示文本不同。你还会看到小于号 (<) 表示该行仅存在于第一个文件中。大于号
    (>) 表示行仅存在于第二个文件中。这里是 vimdiff 的截图，演示了如何使用颜色突出显示更改。


    ## 确定文件类型


    线索可以判断文件可能的内容。例如，某些文件会有扩展名。如果文件以 .txt 结尾，它可能是一个文本文件。如果一个文件具有执行权限，它可能是一个程序。确定文件类型的一种简单方法是对文件运行
    file 命令。


    - file - 显示文件类型。


    ```

    $ file /etc/passwd

    /etc/passwd: ASCII text

    $ file *

    bin: directory

    bob.tar: POSIX tar archive

    test.data: data

    test.txt: English text

    reports.sh: Bourne-Again shell script, ASCII

    text executable

    ```


    ## 在文件中搜索


    如果你在文件中查找文本，请使用 grep 命令。


    - grep pattern file - 在文件中搜索模式。

    - grep -v pattern file - 反向匹配。返回文件中不匹配模式的行。


    ```

    $ cat secret

    site: facebook.com

    user: bob

    pass: bee!

    $ grep user secret

    user: bob

    $ grep o secret

    site: facebook.com

    user: bob

    $ grep -v o

    pass: bee!

    ```


    ## JASON CANNON


    这里是更多与 grep 常用的选项。


    - grep -i - 执行搜索，忽略大小写。

    - grep -c - 统计文件中出现的次数。

    - grep -n - 在输出前加上文件的行号。


    ```

    $ grep secret

    $ grep -i secret

    user: bob

    $ grep -ci secret

    1

    $ grep -ni secret

    2:user: bob

    ```


    ## 在二进制文件中搜索文本


    如果你对二进制文件运行 grep，它将仅仅显示文件中是否找到了该信息，但不会显示周围的文本。要查看二进制文件中的文本数据，使用 strings 命令。


    - strings - 显示二进制文件中的可打印字符串。


    ```

    $ grep -i john BlueTrain.mp3

    Binary file BlueTrain.mp3 matches

    $ strings BlueTrain.mp3 | grep -i john

    John Coltrane

    John Coltrane

    $

    ```


    ## 管道


    你会注意到两个命令通过竖线连接在一起，也称为管道符号。管道 (|) 意味着获取上一个命令的标准输出并将其传递给下一个命令的标准输入。如果第一个命令显示了错误信息，这些信息不会传递给第二个命令。这些错误信息被称为“标准错误”。你将在“重定向”章节中学习如何处理标准错误。


    此外注意，在第一次使用 grep 命令时，使用了 `grep -i pattern file` 格式。在第二次时，使用了 `grep -i pattern`
    格式。在第一个格式中，grep 的输入来自 `file`。在第二个格式中，grep 的输入通过管道来自上一个命令。


    如果你运行 `strings BlueTrain.mp3`，屏幕上将显示大量文本。与其让这些文本流过，不如通过管道将其传递给 `grep -i john`。正如你所见，结果是
    John Cole 在 `strings BlueTrain.mp3` 输出中出现了两次。


    管道不仅限于两个命令。你可以不断链接命令，直到获得你想要的结果。让我们把 `grep` 的输出传递给 `head -1`，将输出限制为一行。


    ```

    $ strings BlueTrain.mp3 | grep -i john | head -1

    John Colrane

    $

    ```


    假设你只想显示上述输出的第二个单词。你可以使用 `cut` 命令来实现该目标。


    - cut [file] - 切割文件的选定部分。如果省略文件，则使用标准输入。

    - cut -d delimiter - 使用分隔符作为字段分隔符。

    - cut -f N - 显示第 N 个字段。


    要从 "John Colrane" 中提取 "Colrane"，使用空格作为分隔符 (-d '' '' ) 并打印第二个字段 (-f 2)。空格被引号括起来。


