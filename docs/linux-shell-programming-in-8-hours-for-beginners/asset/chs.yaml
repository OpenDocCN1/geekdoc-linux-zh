  \ 大于等于\n| `-lt` | 小于 |\n| `-le` | 小于等于 |\n\n## 布尔运算符\n使用逻辑运算符后，结果将为真或假。\n\n| 运算符\
  \ | |\n| :--- | :--- |\n| `-a` | 与 (AND) |\n| `-o` | 或 (OR) |\n| `!` | 非 (NOT) |\n\
  \n## 字符串运算符\n| 运算符 | 检查 |\n| :--- | :--- |\n| `=` | 字符串相等 |\n| `!` | 字符串不相等 |\n\
  | `-z` | 字符串长度为 0\n- `-n` | 字符串长度不为 0 |\n\n## 参数\nShell 中内置参数：\n\n| 参数 | 描述 |\n\
  | :--- | :--- |\n| `$0` | 脚本名称 |\n| `$#` | 参数总数 |\n| `$*` | 所有参数 |\n| `$@` | 作为参数的所有参数\
  \ |\n| `$$` | 当前进程 ID |\n| `$?` | 上一个命令的状态 |\n| `$!` | 上一个后台进程 |\n\n## 文件运算符\n文件运算符用于检测文件的各种属性。\n\
  \n| 运算符 | 检查 |\n| :--- | :--- |\n| `-d` | 是否为目录 |\n| `-f` | 是否为文件 |\n| `-p` | 是否为管道\
  \ |\n| `-r` | 是否可读文件 |\n| `-w` | 是否可写文件 |\n| `-x` | 是否为可执行文件 |\n| `-e` | 是否存在 |\n\
  | `-s` | 是否非空 |\n| `-b` | 是否为块设备文件 |\n| `-c` | 是否为字符设备文件 |\n\n## I/O 重定向图\nLinux\
