  trans: "\n\n# 数组操作\n\n| `array_name[@]` 或 `array_name[*]` |\n\n### 示例 3.2\n```bash\n\
    #!/bin/bash\nmy_array[0]=Java\nmy_array[1]=Ruby\nmy_array[2]=Html\nmy_array[3]=Rust\n\
    echo \"All elements are: ${my_array[@] }\"\necho \"All elements are: ${my_array[*]\
    \ }\"\n```\n**输出：**\n```\nAll elements are: Java  Ruby  Html  Rust\nAll elements\
    \ are: Java  Ruby  Html  Rust\n```\n**解释：** `my_array[@]` 或 `my_array[*]` 可以获取数组的所有元素。\n\
    \n### 数组长度\n`#array_name[@]` 或 `#array_name[*]` 可以获取的长度。\n\n| `#array_name[@]`\
    \ 或 `#array_name[*]` |\n\n### 示例 3.3\n```bash\n#!/bin/bash\nmy_array=(PHP MySQL\
    \ in 8 Hours)\nlength1=${#my_array[@] }\nlength2=${#my_array[*] }\necho $length1\n\
    echo $length2\n```\n**输出：**\n```\n5\n5\n```\n**解释：** `#my_array[@]` 或 `#my_array[*]`\
    \ 可以获取数组的长度。\n\n# Printf 命令\n\n`printf` 是 Shell 中用于格式化输出的命令。\n\n| `printf` `type`\
    \ `variables` |\n\n`type` 是用于格式化输出的参数。\n\n| 类型 | 描述 |\n| :--- | :--- |\n| `%b`\
    \ | 以二进制值打印 |\n| `%d` | 以整数值打印 |\n| `%f` | 以浮点值打印 |\n| `%o` | 以八进制值打印 |\n| `%s`\
    \ | 以字符串值打印 |\n| `%x` | 以十六进制值打印 |\n\n例如：\n- `%10s` 表示格式化为最大宽度为 10 个字符的字符串\n-\
    \ `%-10s` 表示格式化为最大宽度为 10 个字符的字符串（`-` 符号表示左对齐，无 `-` 则表示右对齐）\n- `%8. 2f` 表示格式化为浮点值，`8`\
    \ 表示 8 位整数，`2` 表示 2 位小数\n- `%-8. 2f` 表示格式化为浮点值，`8` 表示 8 位整数，`2` 表示 2 位小数（`-` 符号表示左对齐，无\
    \ `-` 则表示右对齐）\n\n### 示例 3.4\n```bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age Weight\n\
    ```\n**输出：**\n```\nName      Age     Weight\n```\n**解释：**\n- `%-10s` 被 `Name`\
    \ 替换，`Name` 被格式化为最大 10 个字符的字符串，左对齐。\n- `%-7s` 被 `Age` 替换，`Age` 被格式化为最大 7 个字符的字符串，左对齐。\n\
    - `%-8s` 被 `Weight` 替换，`Weight` 被格式化为最大 8 个字符的字符串，左对齐。\n- `\\n` 用于换行。\n\n### 示例\
    \ 3.5\n```bash\n#!/bin/bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age Weight\nprintf\
    \ \"%-10s %-7d %-5. 2f\\n\" Andy 18 91.8843\nprintf \"%-10s %-7d %-5. 2f\\n\"\
    \ Tomy 19 95.4675\nprintf \"%-10s %-7d %-5. 2f\\n\" Rosy 17 80.8563\n```\n**输出：**\n\
    ```\nName      Age     Weight\nAndy      18      91.88\nTomy      19      95.47\n\
    Rosy      17      80.86\n```\n**解释：**\n- `printf \"%-10s %-7d %-5. 2f\\n\" Andy\
    \ 18 91.8843` 格式化了三个参数 `Andy`、`18`、`91.8843`。\n- `%-10s` 被 `Andy` 替换，`Andy` 被格式化为最大\
    \ 10 个字符的字符串，左对齐。\n- `%-7d` 被 `18` 替换，`18` 被格式化为最大 7 位数字的整数类型，左对齐。\n- `%-5. 2f`\
    \ 被 `91.88` 替换，`91.88` 被格式化为最大 5 位整数、2 位小数的浮点类型，左对齐。\n- `\\n` 用于换行。\n\n# 转义序列\n\
    \n`\\` 反斜线字符可以用于转义字符。\n- `\\a` 输出警报。\n- `\\n` 将内容输出到下一行。\n- `\\r` 使回车。\n- `\\\
    t` 使制表符。\n- `\\f` 将内容输出到下一页。\n- `\\'` 输出单引号。\n- `\\\"` 输出双引号。\n\n### 示例 3.6\n\
    ```bash\n#!/bin/bash\nprintf \"%s %s \\'%s\\' \\n\" He said OK\nprintf \"%d\\\
    t %d\\n\" 10 100\nprintf \"%s\\n %s\\n\" \n```\n**输出：**\n```\nHe said 'OK'\n10\t\
    100\n```\n**解释：**\n- `%\\'` 输出单引号。\n- `%d\\t` 输出数字和制表符。\n- `%s\\n` 输出字符串。\n\n\
    # 运算符\n\nShell 与其他编程语言一样支持多种运算符，包括：算术运算符、关系运算符、布尔运算符、字符串运算符。\n\n| `expr…` |\n\n\
    `expr…` 是一个表达式。\n\n### 示例 4.1\n```bash\n#!/bin/bash\nsum=`expr 100 + 20`\necho\
    \ \"The sum is: $sum\"\n```\n**输出：**\n```\nThe sum is: 120\n```\n\n# if 语句\n\n\
    `if...then...else...fi` 当条件为真时执行代码，否则执行 else。\n\n### 示例 4.2\n```bash\n#!/bin/bash\n\
    a=10\nb=20\nif [ $a == $b ]; then\n  echo \"a is equal to b\"\nelse\n  echo \"\
    a is not equal to b\"\nfi\n```\n**输出：**\n```\na is not equal to b\n```\n**解释：**\
    \ `[ $a == $b ]` 比较 `a` 和 `b`。`==` 是比较运算符。\n\n# 算术运算符\n\n| 运算符 | 操作 |\n| :---\
    \ | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模\
    \ |\n| `=` | 赋值 |\n| `==` | 检查相等 |\n| `!=` | 检查不等 |\n\n### 示例 4.3\n```bash\n#!/bin/bash\n\
    a=100\nb=20\nresult=`expr $a + b`\necho \"a + b : $result\"\nresult=`expr $a -\
    \ b`\necho \"a - b : $result\"\nresult=`expr $a * b`\necho \"a * b : $result\"\
    \nresult=`expr $a / b`\necho \"a / b : $result\"\nresult=`expr $a % b`\necho \"\
    a % b : $result\"\n```\n**输出：**\n```\na + b : 120\na - b : 80\na * b : 2000\n\
    a / b : 5\na % b : 0\n```\n\n# 比较运算符\n\n| 运算符 | 检查 |\n| :--- | :--- |\n| `-eq`\
    \ | 等于 |\n| `-ne` | 不等于 |\n| `-gt` | 大于 |\n| `-ge` | 大于 |\n| `-lt` | 小于 |\n| `-le`\
    \ | 小于 |\n\n比较表达式返回真或假。\n\n### 示例 4.4\n```bash\n#!/bin/bash\na=100\nb=200\nif\
    \ [ $a -eq $b ]; then\n  echo \"$a -eq $b is equal to b\"\nelse\n  echo \"$a -eq\
    \ $b is not equal to b\"\nfi\nif [ $a -ne $b ]; then\n  echo \"$a -ne $b is not\
    \ equal to b\"\nelse\n  echo \"$a -ne $b is equal to b\"\nfi\nif [ $a -gt $b ];\
    \ then\n  echo \"$a -gt $b is greater than b\"\nelse\n  echo \"$a -gt $b is not\
    \ greater than\"\nfi\nif [ $a -lt $b ]; then\n  echo \"$a -lt $b is less than\
    \ b\"\nelse\n  echo \"$a -lt $b is not less than b\"\nfi\nif [ $a -ge $b ]; then\n\
    \  echo \"$a -ge $b is greater than or equal to b\"\nelse\n  echo \"$a -ge $b\
    \ is less than b\"\nfi\nif [ $a -le $b ]; then\n  echo \"$a -le $b is less than\
    \ or equal to b\"\nelse\n  echo \"$a -le $b is greater than b\"\nfi\n```\n**输出：**\n\
    ```\n100 -eq 200 is not equal to b\n100 -ne 200 is not equal to b\n100 -gt 200\
    \ is not greater than\n100 -lt 200 is less than b\n100 -ge 200 is less than b\n\
    100 -le 200 is less than or equal to b\n```\n\n### 示例 4.5\n```bash\n#!/bin/bash\n\
    a=100\nb=200\nif [ $a -eq $b ]; then\n  echo \"$a -eq $b is equal to b\"\nelse\n\
    \  echo \"$a -eq $b is not equal to b\"\nfi\n# (剩余逻辑遵循相同模式)\n```\n*(注：示例 4.5 输出演示了表格中所有比较运算符的逻辑).*\n\
    \n"
