    ## 前言

    本书涵盖了所有必要的 Linux Shell 语言知识。你可以快速轻松地掌握 Linux Shell 编程的核心技能。


    本书为初学者提供了超过 60 多个实战示例，并包含了针对大学考试、工程师认证考试以及工作面试的测试与答案。


