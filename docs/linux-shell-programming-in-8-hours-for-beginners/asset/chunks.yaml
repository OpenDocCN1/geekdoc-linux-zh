    # 示例 1.5

    ```bash

    #!/bin/bash

    myVar="C# in 8 Hours"

    readonly myVar

    myVar="Scala in 8 Hours"    # 修改变量值

    ```

    输出：

    (错误信息如下:)

    ```

    test. sh: line 4: myVar: readonly variable

    ```

    解释：

    `readonly myVar` 将 `myVar` 设置为只读。输出是一个错误信息。在 `myVar` 变为只读变量后，对 `myVar` 值的任何更改都会导致错误。


    ## 删除变量

    `unset` 命令可以删除变量。


    ```bash

    unset variable

    ```


    # 示例 1.6

    ```bash

    #! /bin/sh

    myVar="C++ in 8 Hours"

    unset myVar        # 移除变量

    echo $myVar

    ```

    输出：

    (无输出)

    解释：

    变量被移除后，该变量不再存在，其值也不复存在。因此，你不会看到任何输出。


    ## 变量输入

    变量的值可以由用户从键盘输入。


    ```bash

    read variable

    ```


    # 示例 1.7

    ```bash

    #! /bin/sh

    echo "Please input your name. "

    read myInput         # 输入值将存储在 myInput 中

    echo "Hi! Your name is: $myInput"  # 假设我输入我的名字：Ray Yao

    ```

    输出：

    Please input your name.

    Ray Yao

    Hi! Your name is Ray Yao

    解释：

    假设我输入了名字：Ray Yao。`read myInput` 将输入值存储在 `myInput` 中。`echo "Hi! Your name is: $myInput"`
    显示了输入值。


    # 第 2 小

    ## Shell 字符串 (1)

    字符串被单引号包裹。


    ```bash

    str=''This is a string''

    ```

    *   单引号内的任何字符将以其原始格式打印。

    *   单引号内的字符串变量是无效。


    # 示例 2.1

    ```bash

    #! /bin/sh

    var=Andy

    str=''Hello, $var''    # 单引号字符串

    echo $str

    ```

    输出：

    Hello, $var

    解释：

    `''Hello, $var''` 是一个单引号字符串。单引号内的任何字符将以其原始格式打印。


    ## Shell 字符串 (2)

    字符串被双引号包裹。


    ```bash

    str="This is a string"

    ```

    *   双引号内的任何字符将通过其返回值打印。

    *   双引号内的字符串变量是有效的。


    # 示例 2.2

    ```bash

    #! /bin/sh

    var=Andy

    str="Hello, $var"       # 双引号字符串

    echo $str

    ```

    输出：

    Hello, Andy

    解释：

    `"Hello, $var"` 是一个双引号字符串。双引号内的任何字符将通过其返回值打印。


    ## 连接字符串

    我们可以使用双引号连接两个字符串。


    # 示例 2.3

    ```bash

    #! /bin/sh

    str1="Kotlin"

    str2="in 8 Hours"

    myString="$str1 $str2"     # 连接两个字符串

    echo $myString

    ```

    输出：

    Kotlin in 8 Hours

    解释：

    `"$str1 $str2"` 使用双引号将两个字符串连接为一个字符串。


    ## 字符串长度

    我们可以通过 `#` 符号获取字符串的长度。


    ```bash

    #string

    ```


    # 示例 2.4

    ```bash

    #! /bin/sh

    str="jQuery in 8 Hours"

    echo ${#str }      # 获取字符串的长度

    ```

    输出：

    17

    解释：

    `#str` 可以获取字符串的长度。字符串长度为 17 个字符（包括空格）。


    ## 提取子字符串

    我们可以从字符串中提取子字符串。


    ```bash

    string : start : length

    ```

    *   `start`: 提取从此索引开始。

    *   `length`: 提取的大小。


    # 示例 2.5

    ```bash

    #! /bin/sh

    str="DjanGo in 8 Hours"

    echo ${str:4:16 }     # 提取子字符串

    ```

    输出：

    Go in 8 Hours

    解释：

    `"str: 4: 16"` 从从索引 4 开始提取子字符串，提取长度为 16。


    ## 关于 `expr…`

    `expr…` 是一个表达式，用于计算。


    ```bash

    expr…

    ```

    注意：`` ` 是反引号，而不是单引号。`` ` 键位于键盘的最左侧。


    # 示例 2.6

    ```bash

    #! /bin/sh

    x=100

    y=200

    z=`expr $x + $y`       # 一个表达式

    echo "The sum is $z"

    ```

    输出：

    The sum is 300

    解释：

    `expr $x + $y` 是一个表达式，计算结果将赋值给 `z`。

    注意：`` ` 是反引号，而不是单引号。`` ` 键位于键盘的最左侧。


    ## 搜索索引

    我们可以找到字符串中字符首次出现的索引。


    ```bash

    expr index "string" character

    ```

    注意：`` ` 是反引号，而不是单引号。`"string"` 是一个参数，用于搜索字符的索引。`"character"` 是一个参数。


    # 示例 2.7

    ```bash

    str="Kotlin in 8 Hours"

    expr index "$str" o

    ```

    输出：

    10

    解释：

    `expr index "$str" o` 查找字符 "o" 的索引。


