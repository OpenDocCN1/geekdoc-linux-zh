    | `%d` | Print it as a digital value |\n| `%f` | Print it as a float-point value\
    \ |\n| `%o` | Print it as an octal value |\n| `%s` | Print it as a string value\
    \ |\n| `%x` | Print it as a hexadecimal value |\n\nFor example:\n- `%10s` means\
    \ formatting as a string with a maximum width of 10 characters\n- `%-10s` means\
    \ formatting as a string with a maximum width of 10 characters (`-` sign means\
    \ left aligned, no `-` sign means right aligned)\n- `%8. 2f` means formatting\
    \ as float-point value, `8` means 8 integers, `2` means 2 decimal places\n- `%-8.\
    \ 2f` means formatting as float-point value, `8` means 8 integers, `2` means 2\
    \ decimal places (`-` sign means left aligned, no `-` sign means right aligned)\n\
    \n### Example 3.4\n```bash\nprintf \"%-10s %-7s %-8s\\n\" Name Age Weight\n```\n\
    **Output:**\n```\nName      Age     Weight\n```\n**Explanation:**\n- `%-10s` is\
    \ replaced by `Name`, `Name` is formatted as a string with maximum 10 characters,\
    \ left aligned.\n- `%-7s` is replaced by `Age`, `Age` is formatted as a string\
    \ with maximum 7 characters, left aligned.\n- `%-8s` is replaced by `Weight`,\
    \ `Weight` is formatted as a string with maximum 8 characters, left aligned.\n\
    - `\\n` is used to go to the next line.\n\n### Example 3.5\n```bash\n#!/bin/bash\n\
    printf \"%-10s %-7s %-8s\\n\" Name Age Weight\nprintf \"%-10s %-7d %-5. 2f\\n\"\
    \ Andy 18 91.8843\nprintf \"%-10s %-7d %-5. 2f\\n\" Tomy 19 95.4675\nprintf \"\
    %-10s %-7d %-5. 2f\\n\" Rosy 17 80.8563\n```\n**Output:**\n```\nName      Age\
    \     Weight\nAndy      18      91.88\nTomy      19      95.47\nRosy      17 \
    \     80.86\n```\n**Explanation:**\n- `printf \"%-10s %-7d %-5. 2f\\n\" Andy 18\
    \ 91.8843` formatted three parameters `Andy`, `18`, `91.8843`.\n- `%-10s` is replaced\
    \ by `Andy`, `Andy` is formatted as a string with maximum 10 characters, left\
    \ aligned.\n- `%-7d` is replaced by `18`, `18` is formatted as a digital type\
    \ with maximum 7 numbers, left aligned.\n- `%-5. 2f` is replaced by `91.88`, `91.88`\
    \ is formatted as a float-point type with maximum 5 integers, 2 decimal places,\
    \ left aligned.\n- `\\n` is used to go to the next line.\n\n# Escape Sequences\n\
    \nThe `\\` backslash character can be used to escape characters.\n- `\\a` outputs\
    \ an alert\n- `\\n` outputs the content to the next new line.\n- `\\r` makes a\
    \ return\n- `\\t` makes a tab\n- `\\f` outputs the content to the next page.\n\
    - `\\'` outputs a single quotation mark.\n- `\\\"` outputs a double quotation\
    \ mark.\n\n### Example 3.6\n```bash\n#!/bin/bash\nprintf \"%s %s \\'%s\\' \\n\"\
    \ He said OK\nprintf \"%d\\t %d\\n\" 10 100\nprintf \"%s\\n %s %d %s\\n\" C# in\
    \ 8 Hours\n```\n**Output:**\n```\nHe said 'OK'\n10\t100\nC#\nin 8 Hours\n```\n\
    **Explanation:**\n- `%\\'` outputs the single marks.\n- `%d\\t` outputs a tab\
    \ between numbers.\n- `%s\\n` outputs following strings in the next line.\n\n\
    # Operators\n\nThe Shell, like other programming languages, supports a variety\
    \ of operators, including: Arithmetic operator, Relational operator, Boolean operator,\
    \ String operator.\n\n| `expr…` |\n\n`expr…` is an expression tool. The ` ` key\
    \ is back quote, rather than single quote.\n\n### Example 4.1\n```bash\n#!/bin/bash\n\
    sum=`expr 100 + 200`\necho \"The sum is: $sum\"\n```\n**Output:**\n```\nThe sum\
    \ is: 300\n```\n**Explanation:** The ` ` key is back quote, rather than single\
    \ quote. The complete expression must be included by back quotes. There must be\
    \ a space between the expression and the operator. For example, `10+20` is wrong,\
    \ `10 + 20` is correct.\n\n# If Statement\n\n`if…then…else…fi` `if statement`\
    \ executes code 1 if a specified condition is true, executes 2 if false.\n\n###\
    \ Example 4.2\n```bash\na=10\nb=20\nif [ $a == $b ]; then\n  echo \"a is equal\
    \ to b\"\nelse\n  echo \"a is not equal to b\"\nfi\n```\n**Output:**\n```\na is\
    \ not equal to b\n```\n**Explanation:** `[ $a == $b ]` compares `a` and `b`, check\
    \ if equal to or not. Note: About `==`, it should be put between square brackets.\
    \ For example: `$a==b]` is wrong, `[ $a == $b ]` is correct. `==` is a comparison\
    \ operator. If `a` is equal to `b`, return true. If `a` is not equal to `b`, return\
    \ false. Above `if statement`, because the test condition returns false, the `echo\
    \ \"a is not equal to b\"` is executed.\n\n# Arithmetical Operators\n\n| Operators\
    \ | Running |\n| :--- | :--- |\n| `+` | add |\n| `-` | subtract |\n| `*` | multiply\
    \ (note: `*`) |\n| `/` | divide |\n| `%` | get modulus |\n| `=` | assignment |\n\
    | `==` | check equality |\n| `!=` | check inequality |\n\n### Example 4.3\n```bash\n\
    #!/bin/bash\na=100\nb=20\nresult=`expr $a + b`\necho \"a + b : $result\"\nresult=`expr\
    \ $a - b`\necho \"a - b : $result\"\nresult=`expr $a * b`\necho \"a * b : $result\"\
    \nresult=`expr $a / b`\necho \"a / b : $result\"\nresult=`expr $a % b`\necho \"\
    a % b : $result\"\n```\n**Output:**\n```\na + b : 120\na - b : 80\na * b : 2000\n\
    a / b : 5\na % b : 0\n```\n**Explanation:** (The table above describes the operations).\n\
    \n# Comparison Operators\n\n| Operators | Checks |\n| :--- | :--- |\n| `-eq` |\
    \ equal |\n| `-ne` | not equal |\n| `-gt` | greater than |\n| `-ge` | greater\
    \ or equal |\n| `-lt` | less than |\n| `-le` | less or equal |\n\nThe comparison\
    \ expression returns true or false.\n\n### Example 4.4\n```bash\n#!/bin/bash\n\
    a=100\nb=200\nif [ $a -eq $b ]; then\n  echo \"$a -eq $b is equal to b\"\nelse\n\
    \  echo \"$a -eq $b is not equal to b\"\nfi\nif [ $a -ne $b ]; then\n  echo \"\
    $a -ne $b is not equal to b\"\nelse\n  echo \"$a -ne $b is equal to b\"\nfi\n\
    if [ $a -gt $b ]; then\n  echo \"$a -gt $b is greater than b\"\nelse\n  echo \"\
    $a -gt $b is not greater than\"\nfi\nif [ $a -lt $b ]; then\n  echo \"$a -lt $b\
    \ is less than b\"\nelse\n  echo \"$a -lt $b is not less than b\"\nfi\nif [ $a\
    \ -ge $b ]; then\n  echo \"$a -ge $b is greater than or equal to b\"\nelse\n \
    \ echo \"$a -ge $b is less than b\"\nfi\nif [ $a -le $b ]; then\n  echo \"$a -le\
    \ $b is less than or equal to b\"\nelse\n  echo \"$a -le $b is greater than b\"\
    \nfi\n```\n**Output:**\n```\n100 -eq 200 is not equal to b\n100 -ne 200 is not\
    \ equal to b\n100 -gt 200 is not greater than\n100 -lt 200 is less than b\n100\
    \ -ge 200 is less than b\n100 -le 200 is less than or equal to b\n```\n\n### Example\
    \ 4.5\n```bash\n#!/bin/bash\na=100\nb=200\nif [ $a -eq $b ]; then\n  echo \"$a\
    \ -eq $b is equal to b\"\nelse\n  echo \"$a -eq $b is not equal to b\"\nfi\n#\
    \ (remaining logic follows same pattern)\n```\n*(Note: Example 4.5 output demonstrates\
    \ the logic for all comparison operators listed in the table).*\n"
