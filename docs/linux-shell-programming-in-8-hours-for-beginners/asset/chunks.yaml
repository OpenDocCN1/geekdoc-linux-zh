  trans: "\n\n# 示例 4.6\n\n```bash\n#!/bin/bash\nx=true\ny=false\nif [ $x -a $y ] \
    \     # -a 表示“与”\nthen\n    echo flase\nfi\nif [ $x -o $y ]      # -o 表示“或”\n\
    then\n    echo true\nfi\nif [ !$x ]          # ! 表示“非”\nthen\n    echo flase\n\
    fi\n```\n\n输出：\n```\nflase\ntrue\nflase\n```\n\n### 解析：\n| true -a true;返回 true;\
    \ | true -a false;返回 false; | false -a false;返回 false; |\n| true -o true;返回 true;\
    \ | true -o false;返回 true; | false -o false;return false; |\n| ! false;返回 true;\
    \ | ! true;返回 false; | |\n\n# 第 5 小时：字符串运算符\n\n| 运算符 | 检查项 |\n| :--- | :--- |\n\
    | `=` | 如果两个字符串相等，返回 true . |\n| `!=` | 如果两个字符串不等相等，返回 true . |\n| `-z` | 如果字符串长度为零，返回\
    \ true . |\n| `-n` | 如果字符串长度不为零，返回 true |\n| `$` | 如果字符串不为空，返回 true . |\n\n# 示例\
    \ 5.1\n\n```bash\n#!/bin/bash\na=\"Java\"\nb=\"Ruby\"\nif [ $a = $b ]      # 检查\
    \ a 是否等于 b\nthen\n    echo \"$a = $b ?  a is equal to b\"\nelse\n    echo \"$a\
    \ = $b ?  a isn't equal to b\"\nfi\nif [ $a != $b ]      # 检查 a 是否等于 b\nthen\n\
    \    echo \"$a ! = $b ?  a isn't equal to b\"\nelse\n    echo \"$a ! = $b ?  a\
    \ is equal to b\"\nfi\nif [ -z $a ]      # 检查字符串长度是否为 0\nthen\n    echo \"-z $a\
    \ ?  The string length is 0\"\nelse\n    echo \"-z $a ?  The string length isn't\
    \ 0\"\nfi\nif [ -n \"$a\" ]        # 检查字符串长度是否不为 0\nthen\n    echo \"-n $a ? \
    \ The string length isn't 0\"\nelse\n    echo \"-n $a ?  The string length is\
    \ 0\"\nfi\nif [ $a ]        # 检查字符串是否为空\nthen\n    echo \"$a ?  The string isn't\
    \ empty\"\nelse\n    echo \"$a ?  The string is empty\"\nfi\n```\n\n输出：\n```\n\
    Java = Ruby ?  a isn't equal to b\nJava ! = Ruby ?  a isn't equal to b\n-z Java\
    \ ?  The string length isn't 0\n-n Java ?  The string length isn't 0\nJava ? \
    \ The string isn't empty.\n```\n\n### 解析：\n| `=` | 如果两个字符串相等，返回 true . |\n| `!=`\
    \ | 如果两个字符串不等相等，返回 true . |\n| `-z` | 如果字符串长度为零，返回 true . |\n| `-n` | 如果字符串长度不为零，返回\
    \ true |\n| `$` | 如果字符串不为空，返回 true . |\n\n# 文件运算符\n文件运算符用于检测 Linux 文件的各种属性。\n\n\
    | 运算符 | 检查项 |\n| :--- | :--- |\n| `-d file` | 如果对象是目录，返回 true . |\n| `-f file`\
    \ | 如果对象是文件，返回 true . |\n| `-p file` | 如果对象是管道，返回 true . |\n| `-r file` | 如果对象是可读文件，返回\
    \ true . |\n| `-w file` | 如果对象是可写文件，返回 true . |\n| `-x file` | 如果对象是可执行文件，返回 true\
    \ . |\n| `-e file` | 如果对象是空文件，返回 true . |\n| `-s file` | 如果对象不是空文件，返回 true . |\n\
    | `-b file` | 如果对象是块设备文件，返回 true . |\n| `-c file` | 如果对象是字符设备文件，返回 true . |\n\n\
    # 示例 5.2\n假设文件 `myFile.sh` 不存在，但仍然检查该文件的属性。\n\n```bash\n#!/bin/bash\nfile=\"/root/myFile.sh\"\
    \nif [ -r $file ]      # 检查对象是否可读\nthen\n    echo \"The object is readable\"\n\
    else\n    echo \"The object isn't readable\"\nfi\nif [ -w $file ]      # 检查对象是否可写\n\
    then\n    echo \"The object is writable\"\nelse\n    echo \"The object isn't writable\"\
    \nfi\nif [ -x $file ]      # 检查对象是否可执行\nthen\n    echo \"The object is executable\"\
    \nelse\n    echo \"The object isn't executable\"\nfi\nif [ -f $file ]      # 检查对象是否为文件\n\
    then\n    echo \"The object is a file\"\nelse\n    echo \"The object isn't a file\"\
    \nfi\nif [ -d $file ]      # 检查对象是否为目录\nthen\n    echo \"The object is a directory\"\
    \nelse\n    echo \"The object isn't a directory\"\nfi\nif [ -s $file ]      #\
    \ 检查对象是否不是空文件\nthen\n    echo \"The object isn't empty\"\nelse\n    echo \"The\
    \ object is empty\"\nfi\nif [ -e $file ]      # 检查文件是否存在\nthen\n    echo \"The\
    \ file exists\"\nelse\n    echo \"The file doesn't exist\"\nfi\n```\n\n输出：\n```\n\
    The object isn't readable\nThe object isn't writable\nThe object isn't executable\n\
    The object isn't a file\nThe object isn't a directory\nThe object is empty\nThe\
    \ file doesn't exist\n```\n\n### 解析：\n假设 `root` 目录下没有 `myFile.sh`，但我们仍然检查该文件的属性。回顾以下运算符：\n\
    | `-d` | 如果对象是目录，返回 true |\n| `-f` | 如果对象是文件，返回 true |\n| `-r` | 如果对象是可读文件，返回\
    \ true |\n| `-w` | 如果对象是可写文件，返回 true |\n| `-x` | 如果对象是可执行文件，返回 true |\n| `-e`\
    \ | 如果对象存在，返回 true |\n| `-s` | 如果对象不是空文件，返回 true |\n\n# `echo` 命令\n`echo` 命令用于输出内容。这里是它的用法。\n\
    \n### 转义字符\n```bash\n#!/bin/bash\necho \"Hello World\"\n```\n输出：\n```\nHello World\n\
    ```\n\n### 变量\n```bash\n#!/bin/bash\nbook=\"Shell\"\necho \"$book is great\"\n\
    ```\n输出：\n```\nShell is great\n```\n\n### 同行输出\n```bash\n#!/bin/bash\necho -e\
    \ \"Hello\\nWorld\" # -e 开启转义\n```\n输出：\n```\nHello\nWorld\n```\n\n### 输出到文件\n\
    ```bash\n#!/bin/bash\necho \"Hello\" > myFile # > 重定向到文件\n```\n（此时创建了 myFile）\n\
    \n### 原始格式\n```bash\n#!/bin/bash\necho 'He said: OK!' # 使用单引号\n```\n输出：\n```\n\
    He said: OK!\n```\n\n### 执行结果\n```bash\n#!/bin/bash\necho date # 使用双引号而非单引号\n\
    ```\n输出：\n```\nThu Aug 22 09:01:19 UTC 2023\n```\n\n### 用户输入\n```bash\n#!/bin/bash\n\
    echo \"Please type your name:\"\nread name # read 接受用户输入\necho \"My name is $name\"\
    \n```\n输出：\n```\nPlease type your name:\nMy name is Ray Yao\n```\n\n# 第 6 小时：test\
    \ 命令\n`test` 命令用于检查条件是否真。它可以测试三个方面：数字、字符和文件。`[]` 用于执行运算。\n\n| test 测试数字 / 字符 /\
    \ 文件 |\n| :--- |\n| `[]` 符号用于执行运算。 |\n\n### 示例 6.1\n```bash\n#!/bin/bash\nnum1=10\n\
    num2=20\nif [ $num1 -eq $num2 ]\nthen\n    echo 'Two numbers are equal.'\nelse\n\
    \    echo 'Two numbers are not equal.'\nfi\n```\n输出：\n```\nTwo numbers are not\
    \ equal.\n```\n### 解析：\n`test $num1 -eq $num2` 测试两个数字的相等性。在表达式中，`=` 两边不能有空格。\n\
    \n### 示例 6.2\n```bash\n#!/bin/bash\nx=100\ny=200\nz=$[x + y]\necho \"The result\
    \ is： $z\"\n```\n输出：\n```\nThe result is： 300\n```\n### 解析：\n`[x + y]` 执行运算。注意：`=`\
    \ 两边不能有空格。\n\n### 测试相等性\n`test` 命令可以测试两个字符串是否相等。\n\n### 示例 6.3\n```bash\n#!/bin/bash\n\
    str1=\"Java\"\nstr2=\"JavaScript\"\nif test $str1 = $str2\nthen\n    echo 'Two\
    \ strings are equal!'\nelse\n    echo 'Two strings are not equal!'\nfi\n```\n\
    输出：\n```\nTwo strings are not equal!\n```\n### 解析：\n`test $str1 = $str2` 测试两个字符串的相等性。\n\
    \n### 测试存在性\n`test` 命令可以测试文件是否存在。\n\n### 示例 6.4\n```bash\n#!/bin/bash\n# 假设 theFile\
    \ .sh 不存在。\nif test -e /root/theFile.sh      # -e 检查存在性\nthen\n    echo 'The file\
    \ exists!'\nelse\n    echo ' The file doesn't exist! '\nfi\n```\n输出：\n```\nThe\
    \ file doesn't exist!\n```\n### 解析：\n假设 `theFile.sh` 不存在。`test -e /root/theFile.sh`\
    \ 测试文件是否存在。\n\n### 测试空字符串\n`test` 命令可以测试字符串是否为空。\n\n### 示例 6.5\n```bash\n#!/bin/bash\n\
    # 假设 “$myString” 尚未被赋值。\nif test -n \"$myString\"      # -n 检查非空字符串\nthen\n  \
    \  echo \"It's not an empty string.\"\nelse\n    echo \"It's an empty string.\
    \ \"\nfi\n```\n输出：\n```\nIt's an empty string.\n```\n### 解析：\n由于 `myString` 没有被赋值任何值，它是一个空字符串。\n\
    \n"
- fmt: "\n# Example 6.6\n\n```bash\n#! /bin/bash\nmyFunction() {\n    # define a function\n\
    \    echo \"jQuery in 8 Hours\"\n}\necho \"Before calling the function. \"\nmyFunction\
    \     # call the function\necho \"After calling the function. \"\n```\n**Output:**\n\
    ```\nBefore calling the function.\njQuery in 8 Hours\nAfter calling the function.\n\
    ```\n**Explanation:**\n`myFunction(){ }` defines a function. `myFunction` calls\
    \ the function.\n\n# Function with Arguments\n\nWhen calling a function, you can\
    \ pass parameters to the function body. For example, pass the first parameter\
    \ to `${1}`, pass the second parameter to `${2}` ...\n\n## Example 6.7\n```bash\n\
    #! /bin/bash\nmyFunction(){\n  echo \"The first parameter is: ${1} ! \"\n  echo\
    \ \"The second parameter is: ${2} ! \"\n  echo \"The third parameter is: ${3}\
    \ ! \"\n  echo \"The fourth parameter is: ${4} ! \"\n  echo \"All parameters are:\
    \ $* ! \"\n}\nmyFunction Kotlin in 8 Hour     # pass four parameters\n```\n**Output:**\n\
    ```\nThe first parameter is: Kotlin !\nThe second parameter is: in !\nThe third\
    \ parameter is: 8 !\nThe fourth parameter is: Hours !\nAll parameters are: Kotlin\
    \ in 8 Hours !\n```\n**Explanation:**\n`${1}` accepts the first parameter, `${2}`\
    \ accepts the second parameter. `$*` shows all parameters. `myFunction Kotlin\
    \ in 8 Hour ` calls the function and pass four parameters.\n\n# Return Values\n\
    \n`return` can return a value to the `$?` . `$?` shows the return value. (In some\
    \ machine, `$?` only shows the value from 0 to 255.)\n\n| function_name { return\
    \ value } |\n| :--- | :--- |\n| `$?` | # shows the return value |\n\n## Example\
    \ 6.8\n```bash\n#! /bin/bash\nadd(){\n    # define a function\n    x=100\n   \
    \ y=155\n    z=`expr $x + $y`\n    return $z    # returns the value to $ ?\n}\n\
    add      # call the function\necho \"The sum of two numbers is $? \"\n```\n**Output:**\n\
    ```\nThe sum of two numbers is 255\n```\n**Explanation:**\n`return $z` returns\
    \ the value to `$?`. `$?` shows the return value. (In some machine, `$?` only\
    \ shows the value from 0 to 255.)\n\n## Example 6.9\n```bash\n#! /bin/bash\nmyFunction(){\n\
    \  echo \"Please enter the first number:\"\n  read x          # assume entering\
    \ 80\n  echo \"Please enter the second number:\"\n  read y          # assume entering\
    \ 90\n  z=`expr $x + $y`\n  return $z       # returns a value to \"$? ?\"\n}\n\
    myFunction\necho \"The return value is $? \"\n```\n**Output:**\n```\nPlease enter\
    \ the first number:\n80\nPlease enter the second number:\n90\nThe return value\
    \ is 170\n```\n**Explanation:**\n`return $z` returns a value to `$?`. `$?` shows\
    \ the return value.\n\n# Hour 7\n\n### if .. then .. elif .. then .. else\n\n\
    `if...then…elif…then…else` runs this code if a condition is true and runs that\
    \ code if the condition is false.\n\n| if condition1 then code1 elif condition2\
    \ then code2 else code3 fi |\n`elif` means `else…if…`\n\n## Example 7.1\n```bash\n\
    #! /bin/bash\nx=100\ny=80\nif [ $x == $y ]\nthen\n  echo \"x is equal to y\"\n\
    elif [ $x -gt $y ]      # meet this condition\nthen\n  echo \"x is greater than\
    \ y\"\nelif [ $x -lt $y ]\nthen\n  echo \"x is less than y\"\nelse\n  echo \"\
    n/a\"\nfi\n```\n**Output:**\n```\nx is greater than y\n```\n**Explanation:**\n\
    `elif` means `else…if…`. `elif [ $x -gt $y ]` tests if `$x` is greater than `$y`.\n\
    \n# For Loop\n\n`For loop` runs a block of code repeatedly by the specified items.\n\
    \n| for var in item1 item2 item3… do code1 code2… done |\n\n## Example 7.2\n```bash\n\
    #! /bin/bash\nfor var in 1 2 3\ndo\n  echo \"The number is: $var\"\ndone\n```\n\
    **Output:**\n```\nThe number is: 1\nThe number is: 2\nThe number is: 3\n```\n\
    **Explanation:**\n`for var in 1 2 3` repeatedly run the next code when `var=1`,\
    \ `var=2`, `var=3`.\n\n## Example 7.3\n```bash\n#! /bin/bash\nfor str in Rust\
    \ in 8 Hours\ndo\n  echo $str\ndone\n```\n**Output:**\n```\nRust\nin\n8Hours\n\
    ```\n**Explanation:**\n`for str in Rust in 8 Hours` repeatedly run the next code\
    \ when `str=Rust`, `var=in`, `var=8`, `var=Hours`.\n\n# While Loop\n\n`while loop`\
    \ loops through a block of code if the specified condition is true.\n\n| while\
    \ condition code done |\n\n## Example 7.4\n```bash\n#! /bin/bash\ncounter=1\n\
    while(( $counter<=4 ))      # run 4 times\ndo\n  echo $counter\n  counter=`expr\
    \ $counter + 1`\ndone\n```\n**Output:**\n```\n1\n2\n3\n4\n```\n**Explanation:**\n\
    `($counter<=4)` is a test condition, if the condition is true, the code will loop\
    \ at most four times. `While Loop` statement can be used to input data continuously,\
    \ but if you want to finish the input, please press `<ctrl + d>` to quit the program.\n\
    \n## Example 7.5\n```bash\n#! /bin/bash\necho 'Please enter a name: '\nwhile read\
    \ book  # accepts the input from user\ndo\n  echo \"OK! $book is a good book!\"\
    \n  echo \"If quit, please press <ctrl + d>.\"\ndone\n```\n**Output:**\n```\n\
    Please enter a name:\nPHP in 8 Hours\nOK! PHP in 8 Hours is a good book!\nIf quit,\
    \ please press <ctrl + d>.\n```\n**Explanation:**\n`while read book` accepts the\
    \ continuous input from the user. You can input data more than one time you want.\n\
    \n# Until Loop\n\n`until loop` loops through a block of code if the specified\
    \ condition is false, will quit the loop if the condition is true.\n\n| until\
    \ condition code done |\n\n## Example 7.6\n```bash\n#! /bin/bash\nn=0\nuntil [\
    \ $n -ge 4 ]  # will quit the loop if true\ndo\n  echo $n\n  n=`expr $n + 1`\n\
    done\n```\n**Output:**\n```\n0\n1\n2\n3\n```\n**Explanation:**\n`until [ $n -ge\
    \ 4 ]` will quit the loop if `$n` is equal to 4.\n\n# Case Statement\n\n`case\
    \ statement` is a multi-select. The case statement matches a value to a pattern.\
    \ If the match succeeds, executes the matching command.\n\n| case value in pattern1)\
    \ code1;; pattern2) code2;; pattern3) code3;; pattern*) code4;; # match nothing,\
    \ run this . esac |\n\n## Example 7.7\n```bash\n#! /bin/bash\necho 'Please input\
    \ a number between 1 to 4:'\nread num\ncase $num in\n  1)\n    echo 'You have\
    \ input 1';;\n  2)\n    echo 'You have input 2';;\n  3)\n    echo 'You have input\
    \ 3';;\n  4)\n    echo 'You have input 4';;\n  *)\n    echo 'Your number is not\
    \ between 1 to 4';;\nesac\n```\n**Output:**\n```\nPlease input a number between\
    \ 1 to 4:\n2\nYou have input 2\n```\n**Explanation:**\nAssume we input a number\
    \ 2, which matches the second case, therefore the second code is executed.\n\n\
    # Break Command\n\n`break` keyword is used to stop the running of a loop according\
    \ to the condition.\n\n| break |\n\n## Example 7.8\n```bash\n#! /bin/bash\nnum=0\n\
    while(( $num<=8))\ndo\n  if [ $num == 3 ]\n  then\n    break # quit the while\
    \ loop\n  fi\n  num=`expr $num + 1`\ndone\necho $num\n```\n**Output:**\n```\n\
    3\n```\n**Explanation:**\nIf `$num` is 3, the program will run the `break` command,\
    \ and quit the loop.\n\n# Continue Command\n\n`continue` command is used to stop\
    \ the current iteration, ignoring the following code, and then continue the next\
    \ loop.\n\n| continue |\n\n## Example 7.9\n```bash\n#! /bin/sh\nnums=\"1 2 3 4\
    \ 5 \"\nfor n in $nums\ndo\n  if [ $n -eq 3 ]\n  then\n    continue # run the\
    \ next for\n  fi\n  echo $n\ndone\n```\n**Output:**\n```\n1\n2\n4\n5\n```\n**Explanation:**\n\
    Note: The output has no 3 number. If `$n = 3`, the program will run `continue`\
    \ command, ignore the next command `echo $n`, and then run the next `for loop`.\n\
    \n# Hour 8\n\n# Select Statement\n\n`select` statement allows the user to select\
    \ one item to meet the condition, and run the related code. `Select` statement\
    \ usually works with `Case` statement.\n\n| select var in item1 item2 item3...\
    \ do case statement done |\n\n## Example 8.1\n```bash\n#! /bin/bash\necho \"Please\
    \ input a number between 1 to 4. \"\necho \"If you input 4, the program will exit.\
    \ \"\nselect choice in 1 2 3 4  # select one number\ncase $choice in\n  1)\n \
    \   echo \"You choose 1\";;\n  2)\n    echo \"You choose 2\";;\n  3)\n    echo\
    \ \"You choose 3\";;\n  4)\n    echo \"You choose 4 to exit\"\n    break;;\n \
    \ *)\n    echo \"Enter error! \"\n    break;;\nesac\ndone\n```\n**Output:**\n\
    ```\nPlease input a number between 1 to 4.\nIf you input 4, the program will exit.\n\
    1) 1\n2) 2\n3) 3\n4) 4\n? 2\nYou choose 2\n? 4\nYou choose 4 to exit\n```\n**Explanation:**\n\
    Assume that we input 2 at the first time, input 4 at the second time. `select\
    \ choice in 1 2 3 4 ;` choose one of the 4 numbers. `Select` statement usually\
    \ works with `Case` statement. `?` is an input prompt, you can input one number.\n\
    \n# I/O Redirection\n\nLinux Shell system commands take input from your terminal\
    \ and send the resulting output back to your terminal. A command usually reads\
    \ data from standard input, and writes data to standard output. The commands of\
    \ the redirection are as follows:\n\n| Commands | Descriptions |\n| :--- | :---\
    \ |\n| command > file | redirect output to the file. |\n| command < file | redirect\
    \ input to the file. |\n| command >> file | append output to the file. |\n| n\
    \ > file | redirect File n to the file |\n| n >> file | append File n to the file\
    \ |\n| n >& m | combine the output file m and File n |\n| n <& m | combine the\
    \ input file m and File n |\n| << tag | take the content between tags as input.\
    \ |\n"
