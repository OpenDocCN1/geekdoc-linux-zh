    “File n”, “File m”意味着文件描述符为 `0`、`1` 或 `2` 的文件。`0` 表示标准输入 (STDIN)，`1` 表示标准输出 (STDOUT)，`2`
    表示标准错误 (STDERR)。


    ## 输出重定向

    输出重定向：使用 `>` 执行命令并将输出内容存储到文件中。


    | `command > file` |


    ### 示例 8.2

    ```bash

    echo "R in 8 Hours" > myFile

    cat myFile # “cat”查看 myfile 内容

    ```

    **输出：**

    `R in 8 Hours`

    **解释：** `echo "R in 8 Hours" > myFile` 将输出重定向到 `myFile`。你需要使用 `cat` 命令来查看 `myFile`
    的内容。(rsrc3M2.jpg)


    ## 追加重定向

    如果你不想覆盖文件内容，请使用 `>>` 将内容追加到文件末尾。


    | `command >> file` |


    ### 示例 8.3

    ```bash

    echo "R in 8 Hours" > myFile

    echo "It is good! " >> myFile

    cat myFile # “cat”查看 myfile 内容

    ```

    **输出：**

    `R in 8 Hours`

    `It is good!`

    **解释：** `echo "It is good! " >> myFile` 将内容追加到 `myFile`。(rsrc3M3.jpg)


    ## 输入重定向

    输入重定向：使用 `<` 从文件获取输入。


    | `command < file` |


    ### 示例 8.4

    ```bash

    wc < myFile # myFile 在上一页创建。

    ```

    **输出：**

    `2 7 25`

    **解释：** `wc < myFile` 从 `myFile` 获取输入。`wc` 统计文件中行数、单词和字符数。

    - `2`：两行。

    - `7`：七个单词。

    - `25`：字符（包括空格）。

    `myFile` 是上一页创建的文件。


    ## 文件描述符

    当每个 Linux 命令执行时，它们会打开三个文件：


    1. **标准输入文件 (stdin)：** `stdin` 的文件描述符为 `0`，Shell 程序默认从 `stdin` 读取数据。

    2. **标准输出文件 (stdout)：** `stdout` 的文件描述符为 `1`，Shell 程序默认向 `stdout` 写入数据。

    3. **标准错误文件 (stderr)：** `stderr` 的文件描述符为 `2`，Shell 程序向 `stderr` 流写入错误信息。


    ### 示例：

    `command < file` 将 `stdin` 重定向到文件。

    | `$ command < file` |


    示例：`command > file` 将 `stdout` 重定向到文件。

    | `$ command > file` |


    示例：从 `infile` 文件读取输入，将输出写入 `outfile`。

    | `$ command < infile > outfile` |


    ## Here Document（在此文档中）

    Here Document 用于将文件内容重定向到命令。


    | `command << delimiter delimiter` |


    第二个分隔符必须位于最左侧，前面不能有字符，后面也没有字符。


    ### 示例 8.5

    ```bash

    #! /bin/bash

    cat << DOC # DOC 定义了一个 Here Document

    AngularJS in 8 Hours

    JavaScript in 8 Hours

    Visual Basics in 8 Hours

    DOC

    ```

    **输出：**

    `AngularJS in 8 Hours`

    `JavaScript in 8 Hours`

    `Visual Basics in 8 Hours`

    **解释：** `cat << DOC...DOC` 是一种特殊的重定向模式，将文件内容重定向到命令。`cat` 显示文件内容。`DOC` 是分隔符。你可以指定其他字符作为分隔符。`DOC...DOC`
    定义了一个 Here Document。


    ### 示例 8.6

    ```bash

    #! /bin/bash

    wc << EOF # wc 统计行、单词、字符数

    AngularJS in 8 Hours

    JavaScript in 8 Hours

    Visual Basics in 8 Hours

    EOF

    ```

    **输出：**

    `3 13 68`

    **解释：** `wc << EOF...EOF` 将文档内容重定向到 `wc`。`wc` 用于统计行、单词和字符数。`EOF` 是分隔符，定义了一个 Here
    Document。

    - `3`：表示 3 行。

    - `13`：表示 13 个单词。

    - `68`：表示 68 个字符（包括空格）。


    ## 包含文件

    Shell 可以将外部脚本文件包含到当前文件中。


    | `source ./external_file` |


    `./` 定位外部文件。我们将创建两个文件作为示例。


    **(1) 文件 `file1.sh` 如下：**

    ### 示例 8.7

    ```bash

    #! /bin/bash

    url ="http://www.lulu.com/spotlight/Ray_Yao"

    ```

    **(2) 文件 `file2.sh` 如下：**

    ### 示例 8.8

    ```bash

    #! /bin/bash

    source ./file1.sh # 包含外部文件

    echo "The website of Ray Yao is： $url "

    ```

    **输出：**

    `The website of Ray Yao is： http://www.lulu.com/spotlight/Ray_Yao`

    **解释：** `source ./file1.sh` 包含了一个外部文件。


    ## Printf 命令

    `printf` 用于格式化输出。


    ### 转义序列

    - `%b`: 二进制

    - `%d`: 进制

    - `%f`: 浮点

    - `%o`: 八进制

    - `%s`: 字符串

    - `%x`: 十六进制

    - `\n`: 新行

    - `\a`: 警报

    - `\r`: 回车

    - `\t`: 制表符

    - `\f`: 分页


    `printf` 用于格式化输出。


    | 类型 | 描述 |

    | :--- | :--- |

    | `%b` | 二进制 |

    | `%d` | 进制 |

    | `%f` | 浮点 |

    | `%o` | 八进制 |

    | `%s` | 字符串 |

    | `%x` | 十六进制 |


    ## 比较运算符

    Linux Shell 拥有比较运算符：


    | 运算符 | 检查 |

    | :--- | :--- |

    | `-eq` | 等于 |

    | `-ne` | 不等于 |

    | `-gt` | 大于 |

    | `-ge` | 大于等于

    | `-lt` | 小于 |

    | `-le` | 小于等于 |


    ## 布尔运算符

    使用逻辑运算符后，结果将为真或假。


    | 运算符 | |

    | :--- | :--- |

    | `-a` | 与 (AND) |

    | `-o` | 或 (OR) |

    | `!` | 非 (NOT) |


    ## 字符串运算符

    | 运算符 | 检查 |

    | :--- | :--- |

    | `=` | 字符串相等 |

    | `!` | 字符串不相等 |

    | `-z` | 字符串长度为 0

    - `-n` | 字符串长度不为 0 |


    ## 参数

    Shell 中内置参数：


    | 参数 | 描述 |

    | :--- | :--- |

    | `$0` | 脚本名称 |

    | `$#` | 参数总数 |

    | `$*` | 所有参数 |

    | `$@` | 作为参数的所有参数 |

    | `$$` | 当前进程 ID |

    | `$?` | 上一个命令的状态 |

    | `$!` | 上一个后台进程 |


    ## 文件运算符

    文件运算符用于检测文件的各种属性。


    | 运算符 | 检查 |

    | :--- | :--- |

    | `-d` | 是否为目录 |

    | `-f` | 是否为文件 |

    | `-p` | 是否为管道 |

    | `-r` | 是否可读文件 |

    | `-w` | 是否可写文件 |

    | `-x` | 是否为可执行文件 |

    | `-e` | 是否存在 |

    | `-s` | 是否非空 |

    | `-b` | 是否为块设备文件 |

    | `-c` | 是否为字符设备文件 |


    ## I/O 重定向图

    Linux Shell 系统命令从终端获取输入并将输出发送回终端。命令通常从标准输入读取数据，向标准输出写入数据。重定向命令如下：


    | 命令 | 描述 |

    | `command > file` | 将输出重定向到文件。 |

    | `command < file` | 将输入重定向到文件。 |

    | `command >> file` | 将输出追加到文件。 |

    | `n > file` | 将文件 n 重定向到文件 |

    | `n >> file` | 将文件 n 追加到文件 |

    | `n >& m` |合并输出文件 m 和文件 n |

    | `n <& m` |合并输入文件 m 和文件 n |

    | `<< tag` | 将标签之间的内容作为输入。 |


