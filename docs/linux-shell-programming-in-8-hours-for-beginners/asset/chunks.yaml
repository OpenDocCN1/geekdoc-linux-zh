- fmt: "\n# Example 1.5\n```bash\n#!/bin/bash\nmyVar=\"C# in 8 Hours\"\nreadonly myVar\n\
    myVar=\"Scala in 8 Hours\"    # change the variable value\n```\nOutput:\n( an\
    \ error message as follows:)\n```\ntest. sh: line 4: myVar: readonly variable\n\
    ```\nExplanation:\n`readonly myVar` sets `myVar` as read only. The output is an\
    \ error message. After `myVar` becomes a read-only variable, any change in the\
    \ value of `myVar` will cause an error.\n\n## Remove Variable\nThe `unset` command\
    \ can delete variables.\n\n```bash\nunset variable\n```\n\n# Example 1.6\n```bash\n\
    #! /bin/sh\nmyVar=\"C++ in 8 Hours\"\nunset myVar        # remove a variable\n\
    echo $myVar\n```\nOutput:\n(nothing)\nExplanation:\nAfter a variable is removed,\
    \ the variable no longer exists, and its value no longer exists. So you don't\
    \ see any output.\n\n## Input to Variable\nThe value of a variable can be input\
    \ from keyboard by a user.\n\n```bash\nread variable\n```\n\n# Example 1.7\n```bash\n\
    #! /bin/sh\necho \"Please input your name. \"\nread myInput         # the input\
    \ value will be stored in myInput\necho \"Hi! Your name is: $myInput\"  # Assume\
    \ that I will input my name: Ray Yao\n```\nOutput:\nPlease input your name.\n\
    Ray Yao\nHi! Your name is Ray Yao\nExplanation:\nAssume that I input my name:\
    \ Ray Yao. `read myInput` stores the input value to `myInput`. `echo \"Hi! Your\
    \ name is: $myInput\"` shows the input value.\n\n# Hour 2\n## Shell String (1)\n\
    The string is enclosed in single quotes.\n\n```bash\nstr='This is a string'\n\
    ```\n*   Any characters in the single quotes will be printed in its original format.\n\
    *   The string variables in the single quotes are invalid.\n\n# Example 2.1\n\
    ```bash\n#! /bin/sh\nvar=Andy\nstr='Hello, $var'    # single-quote string\necho\
    \ $str\n```\nOutput:\nHello, $var\nExplanation:\n`'Hello, $var'` is a single-quote\
    \ string. Any character in the single quotes will be printed in its original format.\n\
    \n## Shell String (2)\nThe string is enclosed in double quotes.\n\n```bash\nstr=\"\
    This is a string\"\n```\n*   Any characters in the double quotes will be printed\
    \ by its returned value.\n*   The string variables in the double quotes are valid.\n\
    \n# Example 2.2\n```bash\n#! /bin/sh\nvar=Andy\nstr=\"Hello, $var\"       # double-quote\
    \ string\necho $str\n```\nOutput:\nHello, Andy\nExplanation:\n`\"Hello, $var\"\
    ` is a double-quote string. Any character in the double quotes will be printed\
    \ by its returned value.\n\n## Connect Strings\nWe can use double quotes to connect\
    \ two strings.\n\n# Example 2.3\n```bash\n#! /bin/sh\nstr1=\"Kotlin\"\nstr2=\"\
    in 8 Hours\"\nmyString=\"$str1 $str2\"     # connect two strings\necho $myString\n\
    ```\nOutput:\nKotlin in 8 Hours\nExplanation:\n`\"$str1 $str2\"` connects two\
    \ strings into one string by using double quotes.\n\n## String Length\nWe can\
    \ get the length of the string by using `#` symbol.\n\n```bash\n#string\n```\n\
    \n# Example 2.4\n```bash\n#! /bin/sh\nstr=\"jQuery in 8 Hours\"\necho ${#str }\
    \      # get the length of the string\n```\nOutput:\n17\nExplanation:\n`#str`\
    \ can get the length of the string. The string length is 17 characters and spaces.\n\
    \n## Extract Substring\nWe can extract a substring from a string.\n\n```bash\n\
    string : start : length\n```\n*   `start`: the extraction starts at this index.\n\
    *   `length`: the extraction size.\n\n# Example 2.5\n```bash\n#! /bin/sh\nstr=\"\
    DjanGo in 8 Hours\"\necho ${str:4:16 }     # extract the substring\n```\nOutput:\n\
    Go in 8 Hours\nExplanation:\n`\"str: 4: 16\"` extracts a substring starting at\
    \ the index 4, the extracting length is 16.\n\n## About `expr…`\n`expr…` is an\
    \ expression, which is used for calculation.\n\n```bash\nexpr…\n```\nNote: ``\
    \ ` is a back quote, rather than a single quote. The ` ` key is on the most left\
    \ side of the keyboard.\n\n# Example 2.6\n```bash\n#! /bin/sh\nx=100\ny=200\n\
    z=`expr $x + $y`       # an expression\necho \"The sum is $z\"\n```\nOutput:\n\
    The sum is 300\nExplanation:\n`expr $x + $y` is an expression, the calculated\
    \ result will be assigned to the `z`. \nNote: `` ` is a back quote, rather than\
    \ a single quote. The ` ` key is on the most left side of the keyboard.\n\n##\
    \ Search Index\nWe can find the index of the first occurrence of a character in\
    \ a string.\n\n```bash\nexpr index \"string\" character\n```\nNote: `` ` is a\
    \ back quote, rather than a single quote. `\"string\"` is a parameter, for searching\
    \ the index of a character. `\"character\"` is a parameter, indicating the character\
    \ you specify.\n\n# Example 2.7\n```bash\nstr=\"Kotlin in 8 Hours\"\necho `expr\
    \ index \"$str\" n`\n```\nOutput:\n6\nExplanation:\n`expr index \"$str\" n` finds\
    \ the index of the first occurrence of the character `\"n\"` in the string.\n\
    Note: `` ` is a back quote, rather than a single quote.\n\n## Shell Parameters\n\
    We can pass parameters to Shell. The syntax is as follows:\n\n```bash\nn\n```\n\
    *   `$0` represents the filename.\n*   `$1` represents the first parameter.\n\
    *   `$2` represents the second parameter.\n*   `$3` represents the third parameter.\n\
    \n# Example 2.8\n```bash\n#! /bin/sh\necho \"My name is: $0\"\necho \"$1\"\necho\
    \ \"$2\"\necho \"$3\"\n```\nOutput:\nMy name is: script.sh\nparam1\nparam2\nparam3\n\
    Explanation:\nThe script is executed with `script.sh` and three parameters.\n\n\
    ## Built-in Parameters\nThere are built-in parameters in Shell:\n\n| Parameter\
    \ | Description |\n| :--- | :--- |\n| `$0` | The filename |\n| `$#` | The total\
    \ number of parameters |\n| `$*` | All parameters as a single string |\n| `$@`\
    \ | All parameters as separate words |\n| `$$` | The process ID of the current\
    \ shell |\n| `$?` | The exit status of the last command |\n| `$!` | The process\
    \ ID of the last background command |\n| `$line` | The line number of the current\
    \ line |\n\n# Example 2.9\n```bash\n#! /bin/sh\necho \"My name is: $0\"\necho\
    \ \"Total parameters: $#\"\necho \"All parameters: $*\"\necho \"Exit status: $?\"\
    \nls /nonexistent_file\necho \"Exit status: $?\"\necho \"Process ID: $$\"\necho\
    \ \"Line number: $line\"\n```\nOutput:\nMy name is: script.sh\nTotal parameters:\
    \ 3\nAll parameters: param1 param2 param3\nExit status: 0\nls: cannot access '/nonexistent_file':\
    \ No such file or directory\nExit status: 2\nProcess ID: 1234\nLine number: 9\n\
    ```\n\n# Hour 3\n## Shell Array\nAn array is a particular variable, which can\
    \ contain one or more values at a time. Bash supports one-dimensional arrays,\
    \ does not support multidimensional arrays, and does not limit the size of arrays.\n\
    \n### 1. The syntax to create an array\n```bash\narray_name = (value0 value1 value2…)\n\
    ```\n`myArray=(100 101 102 103)`\nExplanation:\nThe above code creates an array,\
    \ the array name is `myArray`, it has four elements, its index is 0, 1, 2, 3,\
    \ its value is 100, 101, 102, 103. Note that index begins with zero.\n\n### 2.\
    \ Another syntax to create an array\n```bash\narray_name[0]=value0\narray_name[1]=value1\n\
    array_name[2]=value2\n```\n`color [0] = \"red\"; color [1] = \"blue\"; color [2]\
    \ = \"green\";`\nExplanation:\nAbove code creates an array, the array name is\
    \ `color`, and it has three elements: color [0], color [1], color [2]. Its indexes\
    \ are 0, 1, and 2. Its values are red, blue, and green. Note that index begins\
    \ with zero.\n\n## Accessing the Elements\nThe syntax to access the elements of\
    \ an array is as follows:\n\n```bash\n${array_name[index]}\n```\n\n# Example 3.1\n\
    ```bash\n#!/bin/bash\nmy_array=(Rust in 8 Hours)\necho \"The first element is:\
    \ ${my_array[0]}\"\necho \"The second element is: ${my_array[1]}\"\necho \"The\
    \ third element is: ${my_array[2]}\"\necho \"The fourth element is: ${my_array[3]}\"\
    \n```\nOutput:\nThe first element is: Rust\nThe second element is: in\nThe third\
    \ element is: 8\nThe fourth element is: Hours\nExplanation:\n`my_array=(Rust in\
    \ 8 Hours)` creates an array. `${my_array[0]}` accesses the element at index 0.\
    \ `${my_array[1]}` accesses the element at index 1. `${my_array[2]}` accesses\
    \ the element at index 2. `${my_array[3]}` accesses the element at index 3.\n\n\
    ## Get All Elements\n`array_name[@]` or `array_name[*]` can get all elements of\
    \ an array.\n"
