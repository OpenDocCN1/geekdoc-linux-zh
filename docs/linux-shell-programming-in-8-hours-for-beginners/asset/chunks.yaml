    \  echo 'Two numbers are not equal.\nfi\n```\nOutput:\n```\nTwo numbers are not\
    \ equal.\n```\n### Explanation:\n`test $[num1] -eq $[num2]` tests the equality\
    \ of two numbers. In an expression, the two sides of `=` cannot have spaces.\n\
