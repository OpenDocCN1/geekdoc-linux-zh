  trans: "\n\n# 示例 6.6\n\n```bash\n#! /bin/bash\nmyFunction() {\n    # define a function\n\
    \    echo \"jQuery in 8 Hours\"\n}\necho \"Before calling the function. \"\nmyFunction\
    \     # call the function\necho \"After calling the function. \"\n```\n**输出：**\n\
    ```\nBefore calling the function.\njQuery in 8 Hours\nAfter calling the function.\n\
    ```\n**解释：**\n`myFunction(){ }` 定义了一个函数。`myFunction` 调用了该函数。\n\n# 带参数的函数\n\n在调用函数时，你可以将参数传递给函数体。例如，将第一个参数传递给\
    \ `${1}`，将第二个参数传递给 `${2}` ...\n\n## 示例 6.7\n```bash\n#! /bin/bash\nmyFunction(){\n\
    \  echo \"The first parameter is: ${1} ! \"\n  echo \"The second parameter is:\
    \ ${2} ! \"\n  echo \"The third parameter is: ${3} ! \"\n  echo \"The fourth parameter\
    \ is: ${4} ! \"\n  echo \"All parameters are: $* ! \"\n}\nmyFunction Kotlin in\
    \ 8 Hour     # pass four parameters\n```\n**输出：**\n```\nThe first parameter is:\
    \ Kotlin !\nThe second parameter is: in !\nThe third parameter is: 8 !\nThe fourth\
    \ parameter is: Hours !\nAll parameters are: Kotlin in 8 Hours !\n```\n**解释：**\n\
    `${1}` 接收第一个参数，`${2}` 接收第二个参数。`$*` 显示所有参数。`myFunction Kotlin in 8 Hour ` 调用了函数并传递了四个参数。\n\
    \n# 返回值\n\n`return` 可以向 `$?` 返回一个值。`$?` 显示返回值。（在某些机器上，`$?` 只显示显示 0 到 255 之间的值。）\n\
    \n| function_name { return value } |\n| :--- | :--- |\n| `$?` | # 显示返回值 |\n\n\
    ## 示例 6.8\n```bash\n#! /bin/bash\nadd(){\n    # define a function\n    x=100\n\
    \    y=155\n    z=`expr $x + $y`\n    return $z    # returns the value to $ ?\n\
    }\nadd      # call the function\necho \"The sum of two numbers is $? \"\n```\n\
    **输出：**\n```\nThe sum of two numbers is 255\n```\n**解释：**\n`return $z` 将值返回给 `$?`。`$?`\
    \ 显示返回值。（在某些机器上，`$?` 只显示 0 到 255 之间的值。）\n\n## 示例 6.9\n```bash\n#! /bin/bash\n\
    myFunction(){\n  echo \"Please enter the first number:\"\n  read x          #\
    \ assume entering 80\n  echo \"Please enter the second number:\"\n  read y   \
    \       # assume entering 90\n  z=`expr $x + $y`\n  return $z       # returns\
    \ a value to $ ?\n}\nmyFunction\necho \"The return value is $?\"\n```\n**输出：**\n\
    ```\nPlease enter the first number:\n80\nPlease enter the second number:\n90\n\
    The return value is 170\n```\n**解释：**\n`return $z` 向 `$?` 返回一个值。`$?` 显示返回值。\n\n\
    # 7 小 if .. then .. elif .. then .. else\n\n`if...then…elif…else` 在条件为真时执行代码，在条件为假时执行该代码。\n\
    \n## 示例 7.1\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x == $y ]\nthen\n  echo\
    \ \"x is equal to y\"\nelif [ $x -gt $y ]\nthen\n  echo \"x is greater than y\"\
    \nelse\n  echo \"x is less than y\"\nfi\n```\n**输出：**\n```\nx is greater than\
    \ y\n```\n**解释：**\n`elif` 表示 `else…`。`elif [ $x -gt $y ]` 测试 `$x` 是否大于 `$y`。\n\
    \n# For 循环\n\n`For loop` 通过指定的项目重复执行代码块。\n\n| for var in item1 item2… do code1\
    \ code2… |\n\n## 示例 7.2\n```bash\n#! /bin/bash\nfor var in 1 2 3\ndo\n  echo \"\
    The number is: $var\"\ndone\n```\n**输出：**\n```\nThe number is: 1\nThe number is:\
    \ 2\nThe number is: 3\n```\n**解释：**\n`for var in 1 2 3` 在 `var=1`、`var=2`、`var=3`\
    \ 时重复执行代码。\n\n## 示例 7.3\n```bash\n#! /bin/bash\nfor str in Rust 8\ndo\n  echo\
    \ $str\ndone\n```\n**输出：**\n```\nRust\n8\n```\n**解释：**\n`for str in Rust 8` 在\
    \ `str=Rust`、`str=8` 时重复执行代码。\n\n# While 循环\n\n`while loop` 在条件为真时循环执行代码。\n\n\
    | while condition code done |\n\n## 示例 7.4\n```bash\n#! /bin/bash\ncounter=1\n\
    while(( $counter<=4 )) # run 4 times\ndo\n  echo $counter\n  counter=`expr $counter\
    \ + 1`\ndone\n```\n**输出：**\n```\n1\n2\n3\n4\n```\n**解释：**\n`($counter<=4)` 是测试条件，如果条件为真，最多循环四次。`While\
    \ Loop` 语句用于连续输入，但如果你想结束输入，请按 `<ctrl + d>` 退出程序。\n\n## 示例 7.5\n```bash\n#! /bin/bash\n\
    echo 'Please enter a name: '\nwhile read book # accepts the input from user\n\
    do\n  echo \"OK! $book!\"\n  echo \"If quit, please press <ctrl + d>.\"\ndone\n\
    ```\n**输出：**\n```\nPlease enter a name: \nPHP\nOK! PHP!\n```\n**解释：**\n`while\
    \ read book` 接受用户的连续输入。你可以根据需要多次输入。\n\n# Until 循环\n\n`until loop` 在条件为假时循环执行代码，在条件为真时退出循环。\n\
    \n| until condition code done |\n\n## 示例 7.6\n```bash\n#! /bin/bash\nn=0\nuntil\
    \ [ $n -ge 4 ] # will quit the loop if true\ndo\n  echo $n\n  n=`expr $n + 1`\n\
    done\n```\n**输出：**\n```\n0\n1\n2\n3\n```\n**解释：**\n`until [ $n -ge 4 ]` 在 `$n`\
    \ 等于 4 时退出循环。\n\n# Case 语句\n\n`case statement` 是多重选择。`case statement` 将值与模式匹配。如果匹配成功，则执行匹配命令。\n\
    \n| case value in pattern1) code1;; pattern2) code2;; pattern3) code3;; pattern*)\
    \ code4;; # match nothing, run this esac |\n\n## 示例 7.7\n```bash\n#! /bin/bash\n\
    echo 'Please input a number between 1 to 4:'\nread num\ncase $num in\n  1)\n \
    \   echo 'You have input 1';;\n  2)\n    echo 'You have input 2';;\n  3)\n   \
    \ echo 'You have input 3';;\n  4)\n    echo 'You have input 4';;\n  *)\n    echo\
    \ 'Your number is not between 1 to 4';;\nesac\n```\n**输出：**\n```\nPlease input\
    \ a number between 1 to 4:\n2\nYou have input 2\n```\n**解释：**\n假设我们输入数字 2，它匹配第二个\
    \ case，因此执行了第二个代码。\n\n# Break 命令\n\n`break` 关键字用于根据条件停止循环的运行。\n\n| break |\n\n\
    ## 示例 7.8\n```bash\n#! /bin/bash\nnum=0\nwhile(( $num<=8))\ndo\n  if [ $num ==\
    \ 3 ]\n  then\n    break # quit the while loop\n  fi\n  num=`expr $num + 1`\n\
    done\necho $num\n```\n**输出：**\n```\n3\n```\n**解释：**\n如果 `$num` 为 3，程序将运行 `break`\
    \ 命令并退出循环。\n\n# Continue 命令\n\n`continue` 命令用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\n| continue\
    \ |\n\n## 示例 7.9\n```bash\n#! /bin/sh\nnums=\"1 2 3 4 5 \"\nfor n in $nums\ndo\n\
    \  if [ $n -eq 3 ]\n  then\n    continue # run the next for\n  fi\n  echo $n\n\
    done\n```\n**输出：**\n```\n1\n2\n4\n5\n```\n**解释：**\n注意：没有 3。如果 `$n` 为 3，则执行 `continue`\
    \ 运行下一次 `for` 循环。\n\n# Select 语句\n\n`select statement` 允许用户选择项目以满足条件。`select`\
    \ 语句通常与 `case` 语句配合使用。\n\n| select var in item1 item2... do |\n\n## 示例 8.1\n```bash\n\
    #! /bin/bash\necho \"Please select a number between 1 to 4:\"\necho \"Input 4\
    \ to exit.\"\nselect choice in 1 2 3 4  # select one number\ncase $choice in\n\
    \  1)\n    echo \"You choose 1\";;\n  2)\n    echo \"You choose 2\";;\n  3)\n\
    \    echo \"You choose 3\";;\n  4)\n    echo \"You choose 4 to exit\"\n    break;;\n\
    \  *)\n    echo \"Enter error! \"\n    break;;\nesac\ndone\n```\n**输出：**\n```\n\
    Please select a number between 1 to 4:\nInput 4 to exit.\n1) 1\n2) 2\n3) 3\n4)\
    \ 4\n? 2\nYou choose 2\n? 4\nYou choose 4 to exit\n```\n**解释：**\n假设我们第一次输入 2，第二次输入\
    \ 4。`?` 是输入提示符，你可以输入数字。\n\n# I/O 重定向\n\nLinux Shell 系统命令从终端获取输入并将结果输出传回终端。命令通常从标准输入读取数据并向标准输出数据。重定向命令如下：\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| command > file | 将输出重定向到文件。 |\n| command < file\
    \ | 将输入重定向到文件。 |\n| command >> file | 将输出追加到文件。 |\n| n > file | 将文件 n 重定向到文件 |\n\
    | n >> file | 追加文件 n 到文件 |\n| n >& m | 合并输出 m 和文件 n |\n| n <& m | 合并输入文件 m 和文件\
    \ n |\n| << tag | 将标签之间的内容作为输入。 |\n\n"
- fmt: '

    “File n”, “File m” means the file with file descriptor `0`, `1` or `2`. `0` means
    Standard Input (`STDIN`), `1` means Standard Output (`STDOUT`), `2` means Standard
    Error (`STDERR`).


    ## Output Redirection

    Output redirection: Execute the command and store the output into the file by
    using `>`.


    | `command > file` |


    ### Example 8.2

    ```bash

    echo "R in 8 Hours" > myFile

    cat myFile # “cat” views the content of myfile

    ```

    **Output:**

    `R in 8 Hours`

    **Explanation:** `echo "R in 8 Hours" > myFile` redirects the output to `myFile`.
    You need to use `cat` command to view the contents of `myFile`.![](rsrc3M2.jpg)


    ## Append Redirection

    If you don''t want the file content to be overwritten, please append the contents
    to the end of the file by using `>>`.


    | `command >> file` |


    ### Example 8.3

    ```bash

    echo "R in 8 Hours" > myFile

    echo "It is good! " >> myFile

    cat myFile # “cat” views the content of myfile

    ```

    **Output:**

    `R in 8 Hours`

    `It is good!`

    **Explanation:** `echo "It is good! " >> myFile` append the contents to `myFile`.![](rsrc3M3.jpg)


    ## Input Redirection

    Input redirection: Get input from a file by using `<`.


    | `command < file` |


    ### Example 8.4

    ```bash

    wc < myFile # myFile is created on the previous page .

    ```

    **Output:**

    `2 7 25`

    **Explanation:** `wc < myFile` gets the input from `myFile`. `wc` counts how many
    lines, words, characters in the file.

    - `2`: there are two lines.

    - `7`: there are seven words.

    - `25`: there are characters (including spaces).

    `myFile` is the file created on the previous page.


    ## File Descriptor

    When each Linux command executes, they will open three files:


    1. **Standard input file (stdin):** the file descriptor of `stdin` is `0`, and
    the Shell program reads data from `stdin` by default.

    2. **Standard output file (stdout):** the file descriptor of `stdout` is `1`,
    and Shell program writes data to `stdout` by default.

    3. **Standard error file (stderr):** the file descriptor of `stderr` is `2`, and
    the Shell program writes error messages to the `stderr` stream.


    ### Examples:

    `command < file` redirects `stdin` to file.

    | `$ command < file` |


    Example: `command > file` redirects `stdout` to file.

    | `$ command > file` |


    Example: Read the input from the `infile` file, write the output to the `outfile`.

    | `$ command < infile > outfile` |


    ## Here Document

    Here Document is used to redirect the file contents to a command.


    | `command << delimiter delimiter` |


    The second delimiter must be on the most left, no characters in front, and no
    characters in the back.


    ### Example 8.5

    ```bash

    #! /bin/bash

    cat << DOC # DOC defines a Here Document

    AngularJS in 8 Hours

    JavaScript in 8 Hours

    Visual Basics in 8 Hours

    DOC

    ```

    **Output:**

    `AngularJS in 8 Hours`

    `JavaScript in 8 Hours`

    `Visual Basics in 8 Hours`

    **Explanation:** `cat << DOC...DOC` is a special redirecting mode, redirect the
    file contents to a command. `cat` shows the contents of the file. `DOC` is a delimiter.
    You can specify other characters as a delimiter. `DOC...DOC` defines a Here Document.


    ### Example 8.6

    ```bash

    #! /bin/bash

    wc << EOF # wc counts the number of lines, word, characters

    AngularJS in 8 Hours

    JavaScript in 8 Hours

    Visual Basics in 8 Hours

    EOF

    ```

    **Output:**

    `3 13 68`

    **Explanation:** `wc << EOF...EOF` redirects the document contents to `wc`. `wc`
    is used to count the numbers of lines, words and characters. `EOF` is a delimiter,
    defines a Here Document.

    - `3`: means 3 lines.

    - `13`: means 13 words.

    - `68`: means 68 characters, including spaces.


    ## File Included

    The Shell can include an external script file into the current file.


    | `source ./external_file` |


    `./` locates the external file. We will create two files as examples.


    **(1) The file `file1.sh` is as follows:**

    ### Example 8.7

    ```bash

    #! /bin/bash

    url ="http://www.lulu.com/spotlight/Ray_Yao"

    ```

    **(2) The file `file2.sh` is as follows:**

    ### Example 8.8

    ```bash

    #! /bin/bash

    source ./file1.sh # include an external file

    echo "The website of Ray Yao is： $url "

    ```

    **Output:**

    `The website of Ray Yao is： http://www.lulu.com/spotlight/Ray_Yao`

    **Explanation:** `source ./file1.sh` includes an external file.


    ## Printf Command

    `printf` is used to format the output.


    ### Escape Sequences

    - `%b`: binary

    - `%d`: digital

    - `%f`: float-point

    - `%o`: octal

    - `%s`: string

    - `%x`: hexadecimal

    - `\n`: new line

    - `\a`: alert

    - `\r`: return

    - `\t`: tab

    - `\f`: page


    `printf` is used to format the output.


    | Type | Description |

    | :--- | :--- |

    | `%b` | binary |

    | `%d` | digital |

    | `%f` | float-point |

    | `%o` | octal |

    | `%s` | string |

    | `%x` | hexadecimal |


    ## Comparison Operators

    Linux Shell has comparison operators:


    | Operators | Checks |

    | :--- | :--- |

    | `-eq` | equal |

    | `-ne` | not equal |

    | `-gt` | greater than |

    | `-ge` | greater or equal |

    | `-lt` | less than |

    | `-le` | less or equal |


    ## Boolean Operators

    After using logical operators, the result will be true or false.


    | Operators | |

    | :--- | :--- |

    | `-a` | AND |

    | `-o` | OR |

    | `!` | NOT |


    ## String Operators

    | Operators | Checks |

    | :--- | :--- |

    | `=` | If two strings are equal |

    | `!` | If two strings are not equal |

    | `-z` | If the length of a string is equal to zero |

    | `-n` | If the length of a string is not equal to zero |


    ## Parameters

    There are built-in parameters in Shell:


    | Parameters | Descriptions |

    | :--- | :--- |

    | `$0` | name of the script |

    | `$#` | total number of parameters |

    | `$*` | all parameters |

    | `$@` | all parameters as arguments |

    | `$$` | current process ID |

    | `$?` | last command status |

    | `$!` | last background process |


    ## File Operators

    File operators are used to detect various properties of files.


    | Operator | Checks |

    | :--- | :--- |

    | `-d` | If the object is a directory |

    | `-f` | If the object is a file |

    | `-p` | If the object is a pipe |

    | `-r` | If the object is a readable file |

    | `-w` | If the object is a writable file |

    | `-x` | If the object is an executable file |

    | `-e` | If the object exists |

    | `-s` | If the object isn’t empty |

    | `-b` | If the object is a block device file |

    | `-c` | If the object is a character device file |


    ## I/O Redirection Chart

    Linux Shell system commands take input from your terminal and send the resulting
    output back to your terminal. A command usually reads data from standard input,
    and writes data to standard output. The commands of the redirection are as follows:


    | Commands | Descriptions |

    | :--- | :--- |

    | `command > file` | redirect output to the file. |

    | `command < file` | redirect input to the file. |

    | `command >> file` | append output to the file. |

    | `n > file` | redirect File n to the file |

    | `n >> file` | append File n to the file |

    | `n >& m` | combine the output file m and File n |

    | `n <& m` | combine the input file m and File n |

    | `<< tag` | take the content between tags as input. |

