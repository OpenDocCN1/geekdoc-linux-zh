    input 4, the program will exit. "select choice in 1 2 3 4 ;     # select one numberdocase
    $choice in1)  echo "You choose 1";;        2)  echo "You choose 2";;             3)  echo
    "You choose 3";;                  4)  echo "You choose 4 to exit"break;;           *)  echo
    "Enter error! "break;;esacdoneOutput:Please input a number between 1 to 4.If you
    input 4, the program will exit.1) 12) 23) 34) 4#? 2You choose 2#? 4You choose
    4 to exitExplanation:Assume that we input 2 at the first time, input 4 at the
    second time.“select choice in 1 2 3 4 ;” choose one of the 4 numbers.“Select”
    statement usually works with “Case” statement.#? is an input prompt, you can input
