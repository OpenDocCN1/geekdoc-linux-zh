    \ file, return true . |\n| `-e file` | If the object is an empty file, return\
    \ true . |\n| `-s file` | If the object isn’t an empty file, return true . |\n\
    \n# `echo` Command\nThe `echo` command is used to output contents. Here, let’s\
    \ talk about its usages.\n\n### Escape Characters\n```bash\n#!/bin/bash\necho\
    \ \"\\\"C++ in 8 Hours\\\"\n```\nOutput:\n```\nC++ in 8 Hours\n```\n\n### Variable\
    \ Value\n```bash\n#!/bin/bash\nbook=\"C in 8 Hours\"\necho \"$book is a great\
    \ book\"\n```\nOutput:\n```\nC in 8 Hours is a great book\n```\n\n### Contents\
    \ in the Same Line\n```bash\n#!/bin/bash\necho -e \"Go\\ne\" # -e turn on escape\
    \ switch\necho \"8 Hours\" output in the same line\n```\nOutput:\n```\nGo\n8 Hours\n\
    ```\n\n### Output to a File\n```bash\n#!/bin/bash\necho \"PHP in 8 Hours\" > myFile\
    \ # > redirect to\n```\n\n### Original Format\n```bash\n#!/bin/bash\necho 'He\
    \ said: \"OK!\" ' # using single quotes\n```\nOutput:\n```\nHe said: \"OK!\"\n\
    ```\n\n### Executed Result\n```bash\n#!/bin/bash\necho Today is `date` # using\
    \ back quotes rather than single quotes\n```\nOutput:\n```\nToday is Thu Aug 22\
    \ 09:01:19 DST 2019\n```\n\n### Input by Users\n```bash\n#!/bin/bash\necho \"\
    Please type your name: \"\nread name # read accepts the input by users\necho \"\
    My name is $name\"\n```\nOutput:\n```\nPlease type your name:Ray Yao\nMy name\
    \ is Ray Yao\n```\n\n# Hour 6: Test Command\nThe `test` command checks to see\
    \ if a condition is true. It can be used to test three aspects: numerics, characters\
    \ and files. `[]` is used to execute the arithmetical calculation.\n\n| test numerics\
    \ / characters / files |\n| :--- |\n| `[]` Symbol used to execute theithmetical\
