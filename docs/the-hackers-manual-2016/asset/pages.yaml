    many large classified and auction websites (such as eBayClassifiers, Craigslist
    and Monster) or job websites (such as CareBuilder and Indeed websites allow you
    to obtain XML feeds that can be parsed too).


    In many instances, you can just use a special script to parse the RSS, while other
    times you will need to use an API with a specified publisher key to obtain the
    feeds. One example of what would require the publisher key for the API is the
    popular job index.


