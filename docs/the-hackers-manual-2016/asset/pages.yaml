    service.

    [https://jitsi.org](https://jitsi.org)


    ### Tox

    ![Tox](https://example.com/path/to/tox_icon.png)

    Privacy users should try the new decentralised IM and VoIP client. Tox runs on
    the network. It uses the same technology as BitTorrent to provide a direct connection,
    between users for chat, and unlike Skype, it uses no centralised servers, which
    could be compromised. All chats are encrypted using the audited Sodium crypto
    library.

    [https://tox.chat/library](https://tox.chat/library)


    ### Torrent

    ![Torrent](https://example.com/path/to/torrent_icon.png)

    Is popular for downloading. Linux distros and there are numerous download clients.
    One of the best is uTorrent which has a simple and clean interface. It features
    advanced enabled users to tweak it to their liking and has a vast library of plugins.

    [www-torrent.org](http://www-torrent.org)


    ### Aria

    ![Aria](https://example.com/path/to/aria_icon.png)

    Makes Aria a unique tool that can download the same file at different times or
    places. The lightweight CLI can be downloaded via FTP


    ### Pidgin

    ![Pidgin](https://example.com/path/to/pidgin_icon.png)

    Is a wonderful app for instant messaging networks. You can sign in with multiple
    accounts and chat with many friends in different networks. You can use it to connect
    to IM, MSN, Google, Yahoo, Jabber, IRC and more networks at all.

    [www.pidgin.org](http://www.pidgin.org)


    ### Q.A.D.

    ![Q.A.D.](https://example.com/path/to/qad_icon.png)

    This is another strategy civilisation-building strategy game that challenges players
    to lead four Q.A.D. to the space age.

    [www.freeciv.org](http://www.freeciv.org)


    ### FreeCiv

    ![FreeCiv](https://example.com/path/to/freeciv_icon.png)

    A first person shooter with such a theme and the tournament style based on Doom
    and Unreal Tournament. The game has several modes and over 60 maps


    ### OpenMW

    ![OpenMW](https://example.com/path/to/openmw_icon.png)

    OpenMW is a new game engine that replicates the Morrowind RPG. The aim of the
