  md: '# Web administration


    Most severs run without a monitor and need remote administration.


    Hardcore coders do everything in a terminal using Emacs or (heaven forbid) vi
    edit configuration files. Mere mortals prefer a graphical interface, especially
    for tasks that they aren''t familiar with. So it can be important for


    a server distro to have a good administrative interface and the usual way of doing
    this, as servers often run headless, is to run it in a browser session. Then you
    can manage your server over any network. A server distro has lot of components


    to look after, so it''s important for the admin interface to be clear and well
    organised. Of course, you''ll be locked into using such an interface. If you know
    what you need to do even dive into a server, SSH access is also important.


    # ClearOS


    ClearOS boots a graphical display showing the details to connect it and a link
    to change your network settings. When you choose the ClearOS interface you are
    presented with the install wizard, where each page has a main panel making the
    process easy for inexperienced users. This process involves registering an account.
    The last part of wizards enables you to choose what you want, either by function
    or name, you can skip this section and do it yourself. The ClearOS marketplace
    provides free and paid applications yet this is a free version of a commercial
    product. The interface is slick and easy to navigate many parts of, particularly
    the marketplace, can be slow.


    ![](img/532f1b7284ceaabe875a6e3330711435_37_0.png)


    # NethServer


    NethServer enables you to set the IP address when you install it, so you can load
    it through your web browser after it has booted. The Server manager is clear and
    well laid out, making it easy to find and fix any settings with the minimum of
    fuss. Each page has a ''Help'' button which will help you navigate any of the
    options. The pages cover configuration installation and updates, network configuration
    and much more. It supports various services that you want to run - all done easily
    from here.


    There are options available to backup and restore your system backups are automatic
    but you can do it manually when you are experimenting with the setup. Scheduled
    backups of data are also taken and can be sent to a network share or USB drive.


    ![](img/532f1b7284ceaabe875a6e3330711435_37_1.png)


    # Working with Windows


    Sometimes we needs a server to cater to those less fortunate.


    And we do need a lot in fact. There are a lot of people who do not use Linux,
    so we will need a server that will work with other operating systems.


    For Windows it''s not that hard, there are standard protocols and the server generally
    doesn''t have the operating system that is used to talk to it. However there are
    some protocols designed for Windows, how will they be supported?


    Of most importance is the group facilities of Microsoft Exchange which is considered
    by many to be an essential requirement for a server on a network that includes
    Windows systems. Zarafra as an affordable (paid) option. Zarafra provides MS Exchange-like
    services. What Exchange does, it is not directly compatible, but it can work with
    desktop and mobile platforms: if you want name


    compatibility with Microsoft Exchange, you should consider OpenChange, which will
    just find us perfect for a restart. NethServer uses SGO, which is just as good
    as Zarafra in that respect it provides Exchange services, but you can also use
    OpenChange for true Exchange compatibility. In contrast, Ubuntu is restricted
    by the constraints of a web interface


    # Verdict


    +   ClearOS

    NethServer

    TheSSS

    Ubuntu Server

    Zentral

    NethServer (for its ease of configuration.)'
