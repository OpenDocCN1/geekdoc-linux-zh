- img_proc: true
  md: '# Replicate permissions


    Use the --reference option to copy the permissions of one file to another, such
    as chmod --reference=[copy-from-file] [apply-on-this-file].


    # Securely delete files


    Install and use shred to delete files so they cannot be recovered. For example,
    shred [file] will overwrite the file with random data several times.


    # Enable built-in Firewall


    Some others such as UFW with a simpler front-to-back interface, call UFW. By default,
    you can enable it with ufw enable.


    # Allow incoming connection


    UFW allows incoming connections by default. To tweak this policy and allow connections
    between servers use ufw allow ssh, ufw allow www, etc.


    # Network & Internet


    # 174 Run commands


    You can use ssh to execute commands on a remote machine, such as ssh [hostname][command].


    # 175 Copy SSH keys


    Use ssh-copy-id [remote-host] to copy your public key to the remote host.


    # 176 Keep connection


    If you frequently get disconnected from ssh sessions, use the ServerAliveInterval
    option, such as ServerAliveInterval 60 in the //.ssh/ssh_config file.


    # 177 Browse via tunnel


    First create an ssh tunnel to a remote host using ssh -f -N [user@host]. Then
    change your browser Proxy settings and set the SOCKS to 127.0.0.1 and the port
    you used.


    # 178 Play music over SSH


    Use ssh -R [remote-port]:localhost:[local-port] to redirect the output of media
    file to play on the local machine.


    # 179 Mount partitions


    Use sshfs to mount remote directories such as sshfs [user@remote]:[remote-dir]
    [local-dir] to mount the remote directory over the local filesystem.


    # 180 Better monitor traffic


    Ntop is available in the official repos of most dist and gives detailed analysis
    of the network traffic via web-based interface on port 3000.


    # 181 View statistics


    Use netstat -at to view statistics for all processes or netstat -an for only TCP
    port.


    # 182 Save a webpage


    Use wget to download a webpage, e.g., wget -p [url] will download all images and
    content in the HTML and CSS files to files locally.


    ![](img/532f1b7284ceaabe875a6e3330711435_136_0.png)


    > Ntop is a tool that can be extended with plugins.


    # 183 Save multiple files


    If you have multiple files in a directory, use wget -r [url] to download them
    all.


    # 184 Limit data rate


    Prevent hogging all the bandwidth by imposing limits, such as --limit=2m will
    limit the traffic to two megabytes per second.


    # 185 Download files based on modification


    Use wget -N to download only files that have been modified after a period time.
    For example, use wget -N -2days [download].


    # 186 Upload files


    Use curl to connect to an FTP server and upload files, such as curl -u [user:pass]
    -T file ftp://example.com.


    # 187 Get definitions


    Use curl to fetch the definition of a word from a directory server. Use curl dict://dict/
    [word] and then one query with curl which fetches the definition from Sheld''s
    dictionary.


    # 188 Simple web filtering


    To prevent scraping a website use its URL in hosts, such as 127.0.0.1/address.


    # 189 Mirror entries


    Use the graphical Web-Track tool to access the official repos of most distros
    to mirror websites and automatically modify links.


    # 190 Use bandwidth


    Use curl Trick, lightweight bandwidth to control up and download speeds. It also
    regulate for package managers using trickle --limit=20kps get.


    # 191 Monitor bandwidth


    Use ntop to monitor bandwidth by individual applications using nethtop, a small
    top tool that''s available in the repos of most distros to show breaking traffic
    by protocol groups group by process.


    ![](img/532f1b7284ceaabe875a6e3330711435_136_1.png)


    The Hacker''s Manual 2016 | 137'
