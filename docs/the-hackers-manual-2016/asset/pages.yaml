    Do you shoot with a single lens camera (DSLR)? Then take a look at RawTherapie.
    It provides a wide range of tools for processing and converting RAW files. In
    addition to manipulations, you can also adjust the color and brightness values
    of maps, white balance, tones, and more. Best of all, use RawTherapie for editing
    traditional image files, and it also includes Adobe editors.


    # Stellarium


    Stellarium is a free open source planetarium for your computer. It calculates
    the positions of the Sun and Moon, planets and stars as they appear over time.
    It can also draw the constellations and simulate astronomical phenomena such as
    meteor showers, eclipses.


    # Inkscape


    another pro quality tool; Inkscape offers advanced vector graphics drawing and
    art line, with paths and layers. Features, such as clones, alpha blending, and
