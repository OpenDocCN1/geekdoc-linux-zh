  md: '# Privacy distros


    Cover your tracks and keep your identity private – we compare special-purpose
    Linux distros that''ll help you stay invisible on the web.


    # How we tested...


    ![](img/532f1b7284ceaabe875a6e3330711435_91_0.png)


    Nearly two years ago mainstream media started discussing TorBrowser, which raised
    a lot of concerns about privacy and anonymous access to the Internet. Shortly
    after that, Linux Freedom magazine came out with a great round-up, which highlighted
    a number of new releases for Tails, Whonix and other Linux distros for the security
    conscious. We revisit the topic with a different selection of contenders and a
    changed perspective: current state of anonymity distros; their availability; ease
    of use; performance; feature and documentation; and, but not: we weigh the level
    of compromise they require for general purpose computing.


    ![](img/532f1b7284ceaabe875a6e3330711435_91_1.png)


    There are numerous cases where security conscious might want to use a specialised
    and non-mainstream Linux distribution instead of a regular one. We selected five
    systems, each with its own traits and benefits.


    # “The winner should be not only secure, but balanced and friendly to even tech-savvy
    users.”


    Tails is the most established system we''re cooling, and each provides anonymous
    access, circumvent censorship. Ubuntu Privacy (UPR) provides anonymity with a
    strong means of securing your data. It runs only in live mode, encrypts your data
    and protects it against unsolicited


    access. Whonix boasts the same features as Tails but goes further by dividing
    your workflow into two parts: server and gateway. Lexicon offers better anonymity
