    # Performance


    # How do they impact boost us?


    An important criterion for selecting a DE is the age of the hardware that it will
    power. Newer desktops need accelerated graphics and plenty of RAM. If you have
    an older computer, you should stick to a DE, such as Gnome 3, KDE or Cinnamon.
    Mate and Enlightenment will give you a smoother experience. Gnome books on older
    machines takes a lot of resources. KDE on the other hand will be


    responsive on the same machine and is more efficient with every release. For a
    solid experience, you should only use it on a machine with at least 2GB of RAMnThe
    difference between Cinnamon and Mate is that the former takes advantage of modern
    hardware to provide slick widgets while Mate runs more efficiently on older hardware.
    Mate is often better as the desktop for users that need the productivity of Cinnamon,
    but lacks the resources for.


    On our test Mate booted fast as Gnome and KDE. It also managed to shave off five
    seconds on average compared to Cinnamon, while having an equal memory footprint.
    Unlike light DEs, the Enlightenment desktop is full of day what you can get from
    a full-blown DE, but it is in a fraction of the resources. In fact, our test of
    the Sparkly Linux edition booted about seven seconds faster than desktop''s Mate.


    # Verdict


    +   - Cinnamon

    - Enlightenment

    - Gnome

    - KDE

    - Mate


    > Gnome needs a speedy modern system to flex its muscles


