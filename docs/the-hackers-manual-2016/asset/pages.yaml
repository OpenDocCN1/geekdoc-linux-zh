    Manage LUKS


    Normal volume


    Windows System


    Linux System


    Enter encryption key to unlock volume


    Cancel


    +   * You can''t backup a volume without a header. If the original gets corrupted,
    you can bring it back by right-clicking on a mounted volume and selecting the
    option.


    The default option is LUKS or Unified Key Setup, which is a disk-encryption specification
    designed for Linux. In addition to LUKS, ZuluCrypt can also create and open TrueCrypt
    volumes. Plain volumes are headerless and the encryption is provided by ZuluCrypt.
    Because Plain volumes are volume-dependent and not volatile, the encrypted volume
    is shared between Linux, Windows and OS.


    When you decide on the type of volume, you will have to pick a cipher, algorithm
    that does the encryption and decryption. The security of the attribute is tied
    to the key. The complexity of the algorithm determines how hard it becomes to
    crack the encryption decrypt.


    The most popular cipher is AES Encryption Standard (AES) which is based on Rijndael.
    AES with 256 bit key offers the best balance of speed and speed. The default cipher
    in ZuluCrypt is Twofish, and Serpent. However, the app supports a large range
    of ciphers numbering more than Twofish and Serpent.


    You can select the default values for each field, filesystem for the volume (EXT4)
    and press the Button. When the process completes, you will receive a notice with
    the file name for the encrypted container with little content and select to what
    you want to use.


    # Making sense


    Before you start using this encrypted volume you''ll have to decrypt and mount
    it. Head to > Plain.LUKS.ZuluCrypt Create Container. In the file pop up you will
    need to name the encrypted container file and create it. For the mount name for
    the file, just enter the password and press Enter. Toggle the checkbox if you
    only want to read the contents of encrypted volume.


    Once the volume is mounted you can use it in any file system like any other mounted
    file. The ZuluCrypt will also list the volume along with the mount point. You
    can create directories within the mounted volume and create files just as you
    would on any regular device. When you want to unmount, right-click on the mounted
    volume interface and select the


    ''Close'' option. This will unmount the volume and you''ll have only once the
    single encrypted file is legible without content. To mount it again follow the
    procedure mentioned to reveal its contents.


    If you have multiple passwords, ZuluCrypt gives you the option to create random
    keyfiles which you can then use to encrypt and decrypt files. Create a name for
    the key and its storage path. From a security point of view, make sure the keys
    are not stored on the same disk as the files or on an external drive where your
    encrypted data remains safe if someone grabs the keyfile of your encrypted volumes
    and.


    To use a keyfile of a password, select the keyfile option using the drop-menu
    when creating an encrypted volume or encrypted file. After selecting you''ll also
    have to point the app to the keyfile, which will be used to lock data.


    # Scalable partitions and disks


    If you need to store large amounts of data, it''s best to place the encrypted
    container inside a partition of its own or on a USB drive. Note that when you
    create a container ZuluCrypt takes the entire partition or disk, so backed up
    by extra space.


    Also make sure the partition or drive isn''t mounted. Use the command to list
    all mounted partitions. If you want to use it, use /dev/sdX, and make sure you
    have to unmount it before using ZuluCrypt.


    Now launch ZuluCrypt and head to Create Container In Handler. The pop up will
    show all the partitions that you can use to create the encrypted volume. The devices
    are listed by drive name and also by their identity. If you are creating a container
    on a remote disk, make sure you select the correct drive first. Now double-click
    on the drive/partition to create the volume. You can then create an encrypted
    volume on it using the same cipher and method we used earlier.


    At first it might seem though, but over time ZuluCrypt will get used to it and
    you will get used to it. There is no other way to keep your data safe.


