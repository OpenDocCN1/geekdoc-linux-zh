    `$ python2


    Alternatively, start IDE and a command prompt by choosing from the Windows menu.
    Both will start the Python 2.7 interpreter, where commands can be typed by the
    `$` prompt and executed interactively. Here is how we will get your first program
    by typing out the following commands:


    ```

    $ >>> print("Hello World")

    ```


    As you might suggest, pressing Enter creates a global variable. You can then enter
    any point in the program by pressing Ctrl-C to exit the command. For larger projects
    it is better to use an Integrated Development Environment (like IDE), but the
    interpreter is a great way to test small constructs. So we''ll use it to introduce
