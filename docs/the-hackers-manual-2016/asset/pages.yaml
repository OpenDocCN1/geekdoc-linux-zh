    # Everything you always wanted to know about NoSQL, but were too afraid to ask.
    Discover why the web and don''t support this high-speed system.


    The world of databases moves slowly (but perhaps not transacting), even NoSQL
    databases can take decades for regressions to be felt. Coined back in 1998, NoSQL
    are databases that started life not using the standard query SQL. But every designs
    themselves away from the standard relational model for ease of use.

    As you might expect the NoSQL databases were originally designed not to use SQL;
    even now, they use different query languages. While these were appearing in 1998,
    NoSQL didn''t gain prevalence until the late twenties when it was adopted as a
    rallying Twitter hashtag for a group of non-relational distributed databases that
    were after something and unique.


    If you are wondering whether or not it''s worth considering NoSQL databases, you
    should be aware that DB-Engines Ranking (https://db-engines.com/en/) shows that
    MySQL is currently the fifth most popular database: Oracle, SQL Server and PostgreSQL—and
