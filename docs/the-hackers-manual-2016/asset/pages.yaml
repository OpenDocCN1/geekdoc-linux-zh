  md: '# The 30-30-30 reset


    Don''t underestimate how skew-whiff things become when the variables of firmware
    come out with custom firmware. The 30-30-30 is a catch-all reset for NVRAM and
    restoring routers to their firmware defaults, which you should do before and after
    flashing each new firmware.


    Your router''s reset button is probably on the back of the unit. Grab a paper
    if you need one, and get into a comfortable position; you are going to be holding
    your router''s reset button for 30 seconds or more, which is a long time for someone
    with cramps.


    Hold down your router''s reset button and count a full 30 seconds. Not letting
    go of the reset button, put the AC plug into the back of the router. Count 30
    more seconds while holding that reset button. Count 30 seconds. Finally, let go
    of the reset button until the lights begin to blink and your circulation flowing
    again. Your router should be back to defaults whatever it had before.


    A handful of older, with an ever-increasing number of AC routers, need to be hard
    reset other. If the 30-30-30 doesn''t return you to default values, what works
    for your router, and what methods worked?


    ![](img/532f1b7284ceaabe875a6e3330711435_148_0.png)


    +   - Yes, you can buy a tool that does the job of a pauper.


    DD-WRT will support us the GUI via HTTP or HTTPS. There''s no way in this life
    that you''d want to go to the shot at the core of your home when you only have
    a simple laptop handy, but you might be thinking about HTTP connections.


    Wait, here''s a better trick: why not disable Router Web admin access, and just
    connect via SSH? If you''re as adept at managing things with a command line as
    you are with a GUI, then you''ll love it.


    First, setting up the access to SSH is done in a different part of the DD-WRT
    GUI to enable the service. You''ll need to go to the router web admin interface
    and find the remote access settings. Don''t forget to enable the DD-WRT GUI.


    Now you can SSH to your router from the outside, or in the way that you do with
    your local network. You''ll just need to specify the port, and use the outside
    facing IP address of your router.


    ```

    ssh -p 1918 root@WAN

    ```


    now replace WAN with the global address of your local network. This might be a
    DNS name, or an IP address. In the unlikely event that your ISP doesn''t provide
    you a static IP, you won''t necessarily need to keep track of every IP address.
    DD-WRT will support automatically updating of the number of dynamic DNS services
    - to take a look at DNS under the Setup tab for


    options.


    So we''ve come this far, but what about that GUI? We''ll try starting your SSH
    session with command:

    sh -p 1918 root -L 8080:localhost:80


    This starts an SSH session before, the last part of the command creates a tunnel
    from port 8080 on your local machine, to port 80. Now you''re opening a browser
    and visiting http://localhost:8080/


    Wow. Presto. You''ve got your GUI from a local machine, and it''s all encrypted
    through your SSH session. Now, what you got, literally, is your desktop.


    # The gauntlet


    Now you''ve got the GUI and SSH, what new things are we trying? Actually, what
    things are not working? If something sounds like a challenge, let us know.


    How about setting up the SSH tunnel to route traffic through your router on a
    SOCKS proxy, via which you can encrypt your traffic when you''re not at home?
    Connecting with your router as the client? (This can help for hooking up other,
    less-capable devices which might not support VPN natively. Maybe you have a USB
    broadband dongle? DD-WRT can do with that. Why not try creating an internet connection
    through the router, for days when your ISP connection drops?


    It''s not easy. Absolutely amazing possibilities that would have previously taken
    kinds of wizardry to around, running on something already sitting in a cupboard.
    Router becomes bread and butter, so don''t be afraid to make it a living!


