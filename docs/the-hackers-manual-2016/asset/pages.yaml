  md: '# Linux Mint 17.2 ★★★★★


    Mint has climbed to the top of the Linux charts - at least on distro.com - by
    combining the features of Ubuntu with a similar-looking and desktop environment
    (DE). While it''s based on Ubuntu, the distro modifies it to make them more approachable
    to its user base. One of the best custom tools is the Mint Software Manager which
    predates the Ubuntu Software Center and is just as slick.


    A core strength of Mint is its Cinnamon, which is based on Gnome 3, but returns
    the look and feel of Gnome 2. You feel all the familiar desktop environment, including
    a panel at the bottom left and list of Applications in the top-left corner. Since
    it''s


    homebrew, the weird components of Cinnamon, such as the file manager are well
    integrated into the spiffy desktop.


    ![](img/532f1b7284ceaabe875a6e3330711435_12_0.png)


    # Ubuntu 15.04


    Perhaps the biggest challenge to Ubuntu''s ease of use is its installer, which
    can easily carve out space on your disk and set up a dual-boot system without
    effort. But while it is not different from other distro installed, its desktop
    is another matter. While it doesn''t look like alien Gnome 3, Ubuntu''s Unity
    is visually different to the desktops that most users are familiar with. However,
    acclimatating to it doesn''t take much time once set in you can easily appreciate
    the tight integration of the desktop and apps. One of the nicest elements is the
    Message menu which enables you to control your messaging status and presence across
    various online services. Unity little tools like this and the Ubuntu Software
    Center give Ubuntu a


    edge over its peers. It''s also one of the best documented and most supported
    distro.


    ![](img/532f1b7284ceaabe875a6e3330711435_12_1.png)


    # OpenUBSE 13.2


    One of the most pleasant looking distros to the extent that it even customs the
    plainly screens of the core apps, such as LibreOffice. This also tweaks the rendition
    of KDE to ensure that all the applications are branded with OpenUBSE, which gives
    a slick look over the desktop.

    The distro also has marks for integrating its tools and settings inside the vast
    custom control panel for easy access. While it could do with a little polish it
    really isn''t an eyesore. Some of its tools, particularly the package manager,
    aren''t as neatly, as pretty as Ubuntu Software Center. That said, it is just
    as stated and the distro''s oneclick install system makes the distro stand out.
    The distro is also


    well documented and proved. However, while a looker, it isn''t welcoming to first
    users as Ubuntu or Mint.


    ![](img/532f1b7284ceaabe875a6e3330711435_12_2.png)


    # Package Management flush or flush out your desktop


    While a might ship with many applications, sooner or later you''ll need to control
