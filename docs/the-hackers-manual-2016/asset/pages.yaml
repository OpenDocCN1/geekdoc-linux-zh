  md: '# Find memory


    To figure out which processes are hogging the RAM, use `ps --sort=` which arranges
    processes in ascending order of memory consumption at the bottom.


    # Memory of a particular process


    View detailed memory consumption report of a process with `pmap -x <PID>` which
    shows the amount of non-shared, anonymous and locked memory for each mapping.


    # Trace the execution of a binary


    If you have an unknown binary, trace it with `strace -v` to view the signals and
    calls it makes.


    # Logged in users


    Use `w` to get a list of logged in users and their processes `-o` to include the
    hostname of users in the output.


    # Kill a process


    Type `kill <PID>` which changes the process into a non-responsive state. If it
    still resists, use `kill -9 <PID>` to terminate the process.


    # Decrease of usage


    If you want to lower overall usage, swap edit using `renice` or change the value
    of `vm.swappiness`.


    # Backup


    # Backup the boot sector


    A boot sector contains information when you accidentally write out your MBR. Make
    a backup of the boot sector with `dd if=/dev/sda count=1 bs=512 of=/root/boot.bak`.


    ![](img/532f1b7284ceaabe875a6e3330711435_135_0.png)


    # Backup partition


    You should also keep a backup of your partition in the event of a failure or other
    critical bits get corrupted. Use `dd if=/dev/sda1 of=/root/sda1.bak` to back up
    the partition.


    # Monitor the disk


    Install the `parted` tool to monitor your disk''s report. For example, use `df
    -h --output=avail,pcent /dev/sda1` to check usage.


    # Speed up transfers


    If bandwidth is limited, use `rsync -z` to transfer files and save time by compressing
    the changed blocks.


    # View changes between source


    Use `diff` to view the list of items changed by an operation, or use `rsync -n
    --delete` to see the changes.


    # Track process


    Append the `--append` option to `rsync` command to see the data transfer.


    # Rsync over ssh


    To transfer rsync data over SSH, use `rsync -avz ssh [source] [destination]`


    # Exclude files


    Rsync also lets you skip files that you can specify with the `--exclude=''pattern''`
    option when running with rsync.


    # Test sync


    First time users should use the `--dry-run` option to simulate rsync operations
    and scan the output for any unexpected outcomes before running it.


    # Limit bandwidth


    To make the rsync operation bandwidth, use the `--bwlimit=KB` option with rsync.


    # Don''t exclude files


    Tar is a useful for creating an archive of the disk. Use the `--file-system option
    to make sure you don''t back up any mounted partitions or virtual filesystems
    (/proc/).


    # Security & Firewall


    Find which port is running to see the list of ports that particular application
    is communicating with.


    # Disable ping


    Pings can be used to flood the network and cause network damage. To disable with
    `echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_all` or permanently to prevent echo
    reply to add net, `echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_all`.


    # Exclude updates


    If you''ve custom the kernel''s iptables rules, make sure you back them up with
    `iptables-save > iptables.bak`


    # Block a domain


    First, you need to get the IP address of your host: `example.com`. Use this to
    get the CIDR with `[ IP Address ] get CIDR`. Use the CIDR to block the access
    to the domain, such as `iptables -A OUTPUT -p tcp --drop`.


    # Change password for user


    If you''ve forgotten a password for a user, you can set a new one with `sudo passwd
    [username]` without needing the password.


    ![](img/532f1b7284ceaabe875a6e3330711435_135_1.png)


    +   - Use Needs to get a real-time view of the bandwidth consumed by an application.


    136 | The Hacker''s Manual 2016'
