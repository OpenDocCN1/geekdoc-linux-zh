  md: '# # Better manage software


    Use the command line to get more from your distro''s package manager.


    # ## Tips for RPM/Yum/Fedora


    +   89 **Install RPMs with yum**

    To resolve and fetch dependencies install RPM packages with `yum install <package-name>`.


    +   97 **Uninstall apps**

    To completely uninstall apps along with their configuration files, use `apt-get
    remove --purge <app-name>`.


    +   90 **Update a particular package**

    Use `yum update <package>` to check for updates for the package you can install
    with `yum update <package>`.


    +   98 **Downgrade packages installed from RPM**

    Install an older version of a package with `apt-get install <package>=<version>`
    and revert upgraded packages with `apt-get purge <package>`.


    +   91 **Search for packages**

    Use `yum search <name>` to fetch the name of the package that mentioned.


    +   99 **Install dev libraries**

    To install a version of an app fetch for development in your use `apt-get build-dev-<name>`.


    +   92 **Install package groups**

    List all available groups with `yum groupist` and install them with `yum groupinstall
    <group-name>`.


    > > Linux Mint has great custom software management tools for easy management
    of mirrors and PPAs.


    +   93 **Rollback updates**

    Get a list of actions with `yum history` and undo the one you need with `yum undo
    <id>`.


    +   105 **Install from a URL**

    Instead of first downloading you can install them directly from the web with `apt-get
    install <URL-to-the-deb>`.


    # ## Tips for DPKG/Ubuntu/Mint


    +   109 **Installed packages**

    The `aptzypper` command displays a list of all installed packages.


    +   94 **Speed up yum**

    Install the fastest-mirror plugin with `yum install-fastestmirror` and use the
    closest mirror for installation.


    +   110 **Update a package**

    Use `zypper update <name>` to update a package. The command will also install
    the package if it''s not installed.


    +   111 **Faster zipper**

    Use `zypper` to enter the shell which fetches packages as faster as it keeps all
    relevant data in memory.


    +   100 **Remove unused**

    Use `apt-get autoremove` to remove packages that have been replaced by newer versions.
    You can also get all of them with `apt-get clean`.


    +   101 **Remove unnecessary**

    The `apt-get autoremove` cleans dependencies no longer in use.


    +   102 **Fix broken install**

    Use `apt-get install -f` if you get an error while installing a Dpkg package without
    its dependencies fix.


    +   112 **Simulate update**

    Before you install do a dry run with `zypper update --dup-info`.


    +   103 **In mirror**

    In Ubuntu''s Software & Applications, select ''Other'' from the menu and click
    the ''Select server button''.


    +   113 **Backup repos**

    Save all the configurations with `zypper -r --export=backup-repos`.


    # ## Tips for RPM/Maya


    +   114 **Restore package**

    Use `zypper update --backup-repo` to restore repos from the backed up file.


    +   104 **Fetch a list of dependencies**

    The command `zypper info <package-name>` will get you a list of required dependencies.


    +   105 **Update all**

    Use `zypper update-all` to update the list of available packages.


    +   106 **Save the repos**

    Append the `--backup` option to prevent automatically downloading the repos after
    installing an app.


    +   115 **View required packages**

    Fetch a list of required update packages with `zypper`.


    +   107 **Install from local directory**

    Drop RPMs inside a directory and then add it as an installation medium with `addmedia
    backup-<directory>`.


    +   116 **Install patches**

    Upgrade apps by applying all patches with `zypper patch`.


    ![](img/532f1b7284ceaabe875a6e3330711435_133_0.png)


    > > Use Ubuntu''s Additional Tools to install proprietary drivers for your graphics
    card and hardware.


    134 | The Hacker''s Manual 2016


