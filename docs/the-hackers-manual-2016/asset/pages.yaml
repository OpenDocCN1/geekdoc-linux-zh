  md: '# # Encryption: full drive protection


    Keep your files safe from prying eyes, even others of your computer, by creating
    a stacked system with encryptfs.


    Last year, when everyone was interested in the aftermath of Edward Snowden''s
    revelations, Linux Format looked at using cryptfs to encrypt disk partitions with
    the Linux kernel''s crypt facilities, but there are other encryption systems available.
    There are several ways of encrypting your data:


    ### Introducing encryptfs

    The next option and the one we are concerned with today, is what called a stacked
    filesystem, where one filesystem on top of another, and this is what encryptfs
    (which we''ve covered before, uses stacked block devices, the filesystem) works.


    The method we looked before encrypting a whole device, usually a disk partition.
    This is good for whole system encryption, but making everything available only
    when the system is booted. There was also TrueCrypt, which creates a whole file
    that acts like a disk. Sadly the project was abandoned in-place. Another alternative
    is using encryptfs to handle the encryption, as ZFS does on Linux systems but
    encrypt them.


    +   - This is how your files look after encryption, and their contents are equally
    unintelligible.


    It''s not restricted to encrypt partitions, it can be used to encrypt individual
    directories. This method uses encryptfs to protect your home directories if you
    want to isolate installations. For example, the encryptfs itself is contained
    in the Linux kernel, which you will need to install the encryptfs-utils package
    to work with it. Create two directories and create an encrypted plan:


    ### mount encryptfs crypt


