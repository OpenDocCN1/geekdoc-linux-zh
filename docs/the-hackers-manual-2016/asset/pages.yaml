  md: '# Ubuntu Privacy Remix


    Sad true, Ubuntu Privacy Remix (UPR) has no networking functionality at all. The
    system is kept isolated, which means that UPR cannot be attacked via LAN, Bluetooth
    etc. There is no web browser, no tools, no data downloaded from the web, and no
    instant messaging or remote clouds. All traces of network connectivity are wiped
    off the UPR, though some are still there. For example, /etc/ifup/commands are,
    but they are useless, as network services are properly disabled.

    In this test UPR fails to be any use for web, even if it is part of the design.
    If, you''re not paranoid and want a system that avoids being online then UPR will
    be the right solution.


    ![](img/532f1b7284ceaabe875a6e3330711435_94_0.png)


    # Whonion


    Tails includes top-notch networking features, and the most important one is Tor,
    which is an open network of servers that attempts to prevent your identification
    and traffic analysis.

    This is accompanied by Tails, a front-end for Tor, a Debian-based live system
    which comes equipped with a Button, HTTPS Everywhere, NoScript and AdBlock Plus
    extensions.

    Tails includes many extra like Tor anonymity, proxy and VPN support, the Frontend,
    virtual keyboard, application support via GnuPG for generating strong passwords
    and managing them, and ACforWG for networking works without auditing etc.

    Tor and if2or are also dedicated, thanks to the de-identified Tor Browser, and
    Privoxy-bridges to ensure the more Sec-Off (ORT) method.


    Whonion also uses Tor for network anonymity and shares many third-party tools
    with Tails. So the point is that here Tor runs on Whonion-Gateway, which provides
    better protection against IP and location discovery on the workstation.

    But in Tails there is a risk of misconfiguration, which could lead to IP leak
    and in Whonion this doesn''t exist. If the workstation is compromised (by someone
    getting root access), it would be impossible to protect the data within a standalone
    VM or any physical PC we grant. Whonion also uses ''entry guards'' (Tor random
    endpoints), which is something that is missing in Tails out of the box.


    # Performance


    How snappy do they run?


    Tails uses Linux 3.6.7 kernel and loads into Gnome by default. The system is lightweight;
    not as fast as the latest as Gnome 2. In previous releases, it still requires
    at least 1GB of RAM to work smoothly, which we think is a bit.

    Ubuntu Privacy Remix updated to use the Ubuntu-LTS base and thus has many recent
    backports and more features, it permits


    very easy on resources, UPR uses a class 2 desktop, which loads in a couple of
    seconds. If your RAM is enough, UPR can use more of the RAM available as the system''s
    ''virtual resources''.

    JondoLive-DVD can be run on old PCs, and if2or is very fast. However, you need
    it 1GB RAM to work smoothly with the Tails-based Joondo app and the web browsers

    Where is different, again, because


    you need a capable of running two Virtualbox guest machines at a time. Your host
    OS and configuration is down to, you''re going to need at least 4GB of RAM, a
    space 12GB of hard drive or SSD. The SSD and hardware support are both very welcome.

    For Qubes OS, you''ll need a 64-bit CPU, 4GB of RAM and at least 32GB for partition.
    Qubes OS is, therefore, the most demanding choice.


    # Verdict


    +   Jondo Live

    Qubes OS

    Ubuntu Privacy Remix

    Tails

    Whonion

    Both Tails and Jondo Live are modest on resources.


    The Hacker''s Market 2016 | 95'
