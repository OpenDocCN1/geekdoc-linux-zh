  md: '# # Web surfing protection


    # ## How effectively they shield you from web threats?


    When you''re accessing the internet, things become complicated and no one can
    guarantee that it''s ''absolute''. But most of us try their best to offer the
    maximum protection.


    We also assume that while security is a top priority users will still need to:
    access webmail; download and upload files; store passwords and sensitive data;
    and perform other activities on the internet. Anonymity requires some compromises,
    which


    as lower download speeds and a harder password policy; we also noticed a comfortable
    browsing experience. But don''t confuse security and hardened internet policies
    with good user data safety. This is different from what we cover later.


    # ### JonDo Live-DVD ★★★


    JonDo provides network anonymity using the JonDo IP® chganery (also TorJonymym),
    which is a Java Anon Proxy, Firefox-based TorBrowser (using a Firefox asbased)
    with revocable passwords and sends requests through a cascade and might data streams
    of multiple users to further hide the data to outsiders. It is worth noting the
    while is open source for free and commercial plans. The free one can use destination
    ports 80 and 43 that are used for HTTP and HTTPS protocol (enough for web browsing
    and filtering). The premium service provides additional socks anonymity and better
    connection speed. Generally, we find JonDo safer than Tor, JonDo is much more
    decentralised and cannot include malicious nodes (which is possible in Tor).




    ![](img/532f1b7284ceaabe875a6e3330711435_93_0.png)


    # ### Qubes OS ★★★


    Qubes OS implements some concept of virtualization-based isolation. The system
    runs Xenvisor with multiple instances of android on top of it. Qubes is divided
    into several ''domains'' and applications can be run as virtual machines (AppVMs)


    The standard of anonymity network traffic is Qubes Tor, which connects to internet
    and routed applications can be assigned to this ''Torfied'' connection. The positive
    side is that an application doesn''t need to be aware of Tor; it in regular mode
    without needing add-ons, and all IPv4 TCP and UDP traffic is routed through Tor
    to ensure everything normally. We also noticed that this concept tends to restrict
    attacks and malware from spreading domain/AppVM rather than prevent them entirely.


    ![](img/532f1b7284ceaabe875a6e3330711435_93_1.png)


    # # Data safety


    # ## How safe is your sensitive data within each distro?


    The most important feature of Tails is its ''ameless'' in live mode, you can use
    it on your hard drive and it will just like a Linux distro. All of the benefits
    of dating, you''ll note that your RAM is wiped on reboot or shutdown, which will
    prevent forensic recovery techniques. Ubuntu Privacy resets when it is securing
    your data. The only way to use it is using extended Tails-Volumes which


    can be stored on removable USB media (which, in turn, is mounted with a ''hover''
    option). There''s no way for data to be on drive partitions, unless encrypted
    or otherwise. Whonix is more secure than Tails. On the Workstation all data can
    be stored protected and up to how you keep it. You may want to encrypt and protect
    it with a password or store it on installed locations. Generally Whonix has a
    strong focus on data security.


    Qubes OS is much better for data security, it is possible to isolate sensitive
    data in a separate domain/App without network access, but again the security is
    heavily dependent on the skill of the user and how they use it. Qubes Live offers
    a way for using persistent storage, and it is built to be user-friendly. It''s
    ready to use LUKS, encrypted USB sticks and provides a special assistant to prepare
    your media.


    # Verdict


    +   - JonDo ★★

    - Qubes OS ★★★

    - Ubuntu ★

    - Privacy Remix ★★

    - Whonix ★★


    In this time UPR offers the most secure anonymity for your data.


    ![](img/532f1b7284ceaabe875a6e3330711435_93_2.png)


    94 / The Hacker''s Manual'
