  md: '# # Utilities


    Apps that let you do more with your computer.


    ## Gnome Tweak Tool

    Not satisfied with the stock Gnome desktop? Use Gnome Tweak Tool to customise
    various aspects, including the appearance settings of desktop. With this app you
    can also change the behavior of the desktop Workspaces, manage extensions and
    can even circumvent the philosophy of Gnome by playing screens. [http://bit.ly/GnomeTweakTool](http://bit.ly/GnomeTweakTool)


    ## Grub Customizer

    Grub 2 is the most popular Linux bootloader that is used by virtually all major
    distributions. It''s an impressive piece of software with lots of options. The
    Grub Customizer is a simple tool to quickly update all the bootloader including
    its appearance [launch.me/grub-customizer](https://launch.me/grub-customizer)


    ## Handbrake

    When you need to convert a video series, Handbrake the video transcoder app can
    convert nearly any format and supports a wide range of codecs. It also has built-in
    filters for popular devices that make the conversion process easier. [www.handbrake.fr](http://www.handbrake.fr)


