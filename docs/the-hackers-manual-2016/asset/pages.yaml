  md: "# PHP: Code and calculate\n\nHP used to stand for Personal Home Page, but lately\
    \ it's a recursive acronym for php Hypertext Processor. Many of the web applications,\
    \ such as WordPress and OpenCloud, are written in PHP. Some of the biggest websites\
    \ on the web, are so big (Facebook) that they had to write their own (HTML) for\
    \ it. Using PHP in a traditional setting (running as a module) works well, let's\
    \ install PHP-the command line interface. This saves us the trouble of setting\
    \ up Apache or some (although that's pretty easy nowadays, you may want to do\
    \ the tutorials now and in future)\n\nThis time we're going to define a function\
    \ called fib that takes an int as an argument and returns the Fibonacci number.\
    \ Variables in PHP are preferred with dollar signs, functions are wrapped in brackets\
    \ and it in regular expressions:\n\n```\nfunction fib($n) {\n    if ($n == 0)\
    \ {\n        return 0;\n    }\n    if ($n == 1) {\n        return 1;\n    }\n\
    \    return fib($n - 1) + fib($n - 2);\n}\n```\n\nis provided. It's worth noting\
    \ that there's an error if we convert a string to an int. This conversion is usually\
    \ unwanted, which triggers our optional error message. Unfortunately our program\
    \ doesn't work for the zeroth Fibonacci number, but anything larger than zero\
    \ can be found. Our new algorithm works well, but not quite anything - the 93rd\
    \ Fibonacci number is greater than 2^64, so it cannot be a 64-bit integer. PHP\
    \ handles this (using double-exponent mantissa with limited precision), except\
    \ for 1447 (on our servers) numbers which become too big for that\n\nOn Debian\
    \ based distributions and their derivatives, you'll run it with:\n\nOther distributions\
    \ might have different packages - or it's already installed. Ultimately, if you\
    \ find your package manager starts to install a lot of other guests, then you\
    \ probably chose the wrong package.\n\nWe'll work in the editor, or you can use\
    \ the whole thing from the terminal, or use something like Sublime or VS Code.\
    \ Whatever you choose, our program is going to be short - this short:\n\n```\n\
    echo \"Hello!\";\n```\n\nSo hello PHP, and then we'll see how it works.\n\nYou\
    \ likely know how to display HTML. If you want to show code in HTML, you should\
    \ use the <code> tags. These tags wrap the code on the first and last lines of\
    \ the section. Pre-codeblocks - but it's not limited to, attributes, and if allow_tags\
    \ must be enabled with a session (most of regular configurations mark it by default).\
    \ If we want to show the code in an HTML document on a web page, the page's source\
    \ through the browser would show only its output: Spooky.\n\nLet's try a more\
    \ complicated example:\n\nEven without any coding experience or the Fibonacci\
    \ sequence you will probably figure out that the 'zeroth' Fibonacci number and\
    \ the next one are one. Fibonacci numbers are defined as\n\n# Many of the web\
    \ apps and OpenCloud, are written in PHP.\n\nwith its two predecessors, the rest\
    \ of the sequence is 1,1,2,3,5,8,13... This requires us to use recursion to fully\
    \ call the function from within, and to avoid infinite loop. It's recursion and\
    \ it's illustrated by the code. When you find a better picture of the Fibonacci\
    \ switch, which has one more than half the calls as false, you might like that\
    \ because the two base cases are the limit of recursion. But as it is, it's not\
    \ the most efficient way to compute Fibonacci numbers. But for now, it's fine.\
    \ As we grow, this duplication of effect is what happens when you call the function.\
    \ To calculate the 40th Fibonacci number (it is over 100 million, and uses about\
    \ 45 calls to compute).\n\nCheck out the box for a fix:\n\n```\nfunction fib($n)\
    \ {\n    if ($n == 0) {\n        return 0;\n    }\n    if ($n == 1) {\n      \
    \  return 1;\n    }\n    return fib($n - 1) + fib($n - 2);\n}\n```\n\nNote that\
    \ if you try to pass an argument to fib() (from source), then PHP will complain\
    \ the array doesn't have an entry at index 1. The value of Arg[0] is the name\
    \ of the program in this case, which is fib.php. Where an argument\n\nPerhaps\
    \ it's worth noting that there's an inherent overhead in every level of recursion\
    \ and function you call to your program. If you are really worried about it, an\
    \ iterative solution might exist, but there's only one here. There's no performance\
    \ speed gains in this case (base 1447 gives an answer immediately, so not so much).\
    \ You need to look for loops in PHP for which is the best feature of this next\
    \ section.\n\n# Caesar\n\nTo finish off today, we'll use some Caesar cipher. But\
    \ be ready because our glimpse on this subject shows that Julius Caesar used to\
    \ encrypt messages by shifting each letter three places down the alphabet, wrapping\
    \ X Y and Z to A, B and C. This is slightly tricky to code. The best way is to\
    \ shift every character of character: shifting letters A-Z and a-z, and characters\
    \ within the range 97-122 and leaving all other characters (like punctuation)\
    \ untouched in the ciphertext.\n\nWe will loop over each character of the string,\
    \ and shift the ASCII value of each character, properly appropriate, get the new\
    \ value and find it in PHP.\n\nOnce you get the result from the function and then\
    \ show it with the ASCII value:\n\n```\n?php\nfunction caesar($str, $shift) {\n\
    \    $result = '';\n    for ($i = 0; $i < strlen($str); $i++) {\n        $char\
    \ = $str[$i];\n        if ($char >= 'A' && $char <= 'Z') {\n            $result\
    \ .= chr((ord($char) - 65 + $shift) % 26 + 65);\n        } elseif ($char >= 'a'\
    \ && $char <= 'z') {\n            $result .= chr((ord($char) - 97 + $shift) %\
    \ 26 + 97);\n        } else {\n            $result .= $char;\n        }\n    }\n\
    \    return $result;\n}\n```\n\n![](img/532f1b7284ceaabe875a6e3330711435_159_0.png)"
