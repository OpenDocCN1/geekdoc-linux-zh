  md: '# #Haiku


    We praised Chromium OS a lot for being very fast and fluid, so you might think
    it would turn out to be fastest OS in the roundup. Why only four stars then? Haiku
    runs faster than Chromium OS; faster than Linux and way faster than other system
    in our tests.

    Haik provided us the best features for every task through it. It takes 10 seconds
    to boot and 1-2 seconds to open any application. Being Haiku is 32-bit with no
    options, but largely with the ancient GCC2 compiler and without graphics acceleration,
    which makes multitasking difficult. Haiku is a clear winner with a perfectly optimized
    graphics and tiny footprint in all apps. Haiku won''t shine on CPU-heavy operations
    and compression, but it is blazing fast for desktop operations.


    ![](img/532f1b7284ceaabe875a6e3330711435_22_0.png)


    # #OpenIndiana


    OpenIndiana''s performance dips when system configurations use the basic VESA
    video driver, which lowers the desktop responsiveness. Regardless of video driver,
    the OS shows noticeable latency when starting and running various applications.
    The OS runs on ZFS filesystem in partition, which offers some features (such as
    snapshots) but a slower desktop performance.

    OpenIndiana also uses 32-bit mode. The Unix kernel still runs in 64-bit but most
    system components are 32-bit - that why they perform well. PC-BSD also uses in
    other ways, there is no visible difference in the desktop performance: file operations
    and 2D graphics are slower than Linux, the lag isn''t extreme.


    # #PC-BSD


    Once installed, PC-BSD boots to the login screen at a pedestrian speed or so.
    The overall desktop performance in KDE is quite good; in both native and virtual
    mode (and PC-BSD automatically enables Guest Additions). It is not as fast as
    the average Linux or FreeBSD performance is expected to be. The PC-BSD software
    manager takes minutes to initialize, but the updates install them - a very unpleasant
    experience. In many others respect the operating system performed well. It automatically
    enables VirtualBox Guest Additions and provided accelerated graphics for our Radeon
    chipset.


    ![](img/532f1b7284ceaabe875a6e3330711435_22_1.png)


    # #Development status


    Is it the team you are imagining?


    actively maintained OS is crucial for the future of any OS, and each of our OS
    has a differing number of releases being away on them, so the time between releases
    will get further.

    Operating system is still strong thanks to the massive legacy from OpenSolaris,
    but the kernel is free less. The Illad, which popped out of the small shell in
    August 2013: a year after the previous


    one. The development branch os1519 seems to be alive, but we''re not confident
    about its future.

    PC-BSD is much more speedy, with a new release every 3-5 months, while Haiku OS
    releases regularly and is synced with the Chromium browser. However, there are
    no official ISO images for the Google OS, but rather a set of random builds from
    various enthusiasts, which resembles a rolling release model.


    Haiku OS is extremely slow, with the latest release: (Alpha 4) dating to 2012.
    The Haiku movement is much speedy with regular events and participation in Summer
    of Code builds. Haiku OS knows how to maintain constant development, even if it
    is far releases.


    +   Verdict

    Chromium OS

    Debian GNU/

    Hurt

    Haiku

    OpenIndiana

    PC-BSD

    We are just a little worried about the future of OpenIndiana


