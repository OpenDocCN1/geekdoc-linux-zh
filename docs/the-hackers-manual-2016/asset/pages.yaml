  md: '# # Advanced Fog


    Fog is a collection of software and whistles that we consider the core feature
    of the server. It ships with everything. The Fog server is scalable and can manage
    large networks over multiple locations in the same building or across. It allows
    you to organize machines into groups for easier management. One of the most useful
    features of Fog, especially for larger networks, is the feature that lets you
    deploy multiple machines in one.


    To use this feature you will need to make sure your Fog host has computational
    resources to run multiple images simultaneously. For larger networks, you can
    have multiple Fog installations configured as storage servers. These storage servers
    share images and tasks among different computers. The distributed storage servers
    also scale up without introducing latency.


    Besides the two important Fog tasks that we have covered in this tutorial (online
    and downloaded), you can create special servers for any of the Fog hosts.


    However, to use this feature you will need to make sure your Fog host has


    Now you''ve installed Fog on one of the computers on the network, and it boots
    up. The computer is set to boot from the network card, so it''ll use the PXE boot
    environment from the Fog server. Scroll down the Fog menu and select the ''Quick
    Registration and Inventory'' option. The Fog server will now add the computer
    to the repository of known hosts.


    # ## Upload an image


    When it''s done, download the Fog header back to the Fog server. Use the Fog dashboard
    to manage hosts. The Fog server identifies it by its MAC address. You can rename
    it to whatever you like (e.g., give it a name like ''Fog 22'') by clicking on
    the icon. Here you can change its name and add a description to the computer.
    Most importantly, use the Fog Image pull-down menu to image the installed Fedora.
    This will save your image.


    Now that our basic framework is ready, it''s time to image the installed Fedora.
    Head back to Management -> All Hosts and list your registered Fedora. Under the
    task menu select ''image''. Clicking on the image again, Fog will show you options
    to schedule the task. You can choose the options after clicking save with Fog
    for now or just use the default for now.


    Then head back to the Fedora and boot it up. It''ll boot via PXE and Fog will
    automatically image and upload it to the Fog server. The process will take some
    time depending on the size of the image, the processing capabilities of the computers
    involved and the speed of the network.


    The Fedora will restart once it''s done uploading


    ![](img/532f1b7284ceaabe875a6e3330711435_144_0.png)


    | Name | MAC | IP | Status | OS |

    |---|---|---|---|--|

    | Fedora 22 | 00:15:5d:01:02:03 | 192.168.1.10 | Online | Fedora |

    | Fedora 23 | 00:15:5d:01:02:04 | 192.168.1.11 | Offline | Fedora |

    | Ubuntu 20 | 00:15:5d:01:02:05 | 192.168.1.12 | Online | Ubuntu |


    ![](img/532f1b7284ceaabe875a6e3330711435_144_1.png)


    > > You can deploy and image computers by accessing Fog dashboard from a mobile
    device like a tablet.


    You can now use Fog to deploy this image to all the lab computers with a single
    click! You can deploy any other image on the network, which is now Windows 10
    installations.


    # ## Deploy the image


    Before you deploy it, you need to select the targets machines with the Fog server.
    The process is the same as before. Boot the new computer from the network which
    should detect Fog''s PXE environment. When it''s done, select the ''Quick Registration
    and inventory'' option.


    Once the computer has been added to the repository, go to the Fog dashboard and
    Management -> All Hosts. Click on the icon corresponding to the newly added machine
    and remember it to select the task (like something like Lab PC #1). Then use the
    Fog Image pull-down menu to select the Fedora 22 image that you''ve merged from
    another computer. Then follow the prompts to give the computer an identifiable
    name and select the image as the host image.


    Now replicate the image to the other lab computers, head to Management -> All
    Hosts. List the hosts to find the entry for the computer you wish to deploy and
    select the corresponding deploy arrow. After the task has been created, head the
    lab computer and power it on. It will automatically detect the task from Fog and
    copy the image from the server to the local machine. When it''s done, repeat the
    process to deploy Fedora on other labs as well.


    ```

    Host is registered as Fedora 22

    Host from root disk

    Update Product Key

    Quick Selection

    Guest Information (Compatibility)

    ```


    > Once a host is registered you can use your hardware and get compatibility before
    imaging it.


