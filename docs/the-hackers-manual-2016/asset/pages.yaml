  md: '# User experience


    # Navigating the knobs and crannies.


    Since all the distros bundle almost the same collection of tools and apps, the
    one factor that makes or breaks a distro is the user experience. In addition to
    creating custom artwork, distro distros spend a lot of time varying settings and
    configurations to ensure their users get a wonderful experience. All the leading
    distros spend a considerable amount of effort making their final


    product is a cohesive unit rather than a loose conglomeration of its parts. They
    spend time homogenising software to help the applications blend with the rest
    of the desktop. While the main factor that has a lot of bearing on user experience
    is the default desktop environment, some distros make tweaks and adjustments to
    the default settings to deliver a product that offers smooth output,


    # Mageia ★★★★


    Mageia is a wonderful little distro that looks like itself with its custom theme
    and customised KDE desktop. The distro comes from a family of distros that have
    always been at tradition. The distro greets others with a web app, but unlike
    many other distros it can do a lot. It informs you about the distro''s needs and
    lets you install some commonly used open source and proprietary packages.


    Besides the installable live media for the Gnome desktop that are robust and reliable
    as the KDE desktop, it also has an expansive set of custom tools and utilities
    that can be used by first-time users and many offer enough flexibility to easily
    advanced


    users. The project complements your experience with vast support infrastructure
    and detailed documentation.


