  md: '# # Tor: Set up a Wi-Fi hotspot


    # ## Worried about privacy? Configure a Raspberry Pi as an anonymous point that
    routes all traffic through the Tor network.


    Do you use Tor to prevent being tracked by using a Raspberry Pi? Although it is
    quite straightforward to turn on it can be hard to configure for all your Internet-enabled
    devices. You can save a lot of hassle by connecting them all to the Pi. The Raspberry
    Pi will do out your IP address and any data that connects to it. To get this project
    running, you''ll need a Raspberry Pi with an SD card with the Raspberry Pi OS.
    If you don''t have one, follow the guide on how to install Raspberry Pi. Hook
    one end into the Pi Ethernet port and the other into your wireless router. You''ll
    need a USB WiFi adapter to connect the Raspberry Pi if you haven''t got one yet.
    Check the list of adapters that are known to work with the Pi (http://raspberrypi.org/RPI_USB_WiFi_Adapters).


    and install the software that will make it an access point with. When it''s installed,
    it''s time to set up DHCP. Begin by editing the DHCP and automatically assigning
    IP addresses to connected devices.


    ```

    sudo apt-get install hostapd-dhcp-server

    ```


    the /etc/dhcpcd.conf file that controls the DHCP


    ```

    sudo nano /etc/dhcpcd.conf

    ```


    and comment out the following lines by adding a # from front of them, then:


    ```

    # interface=eth0

    # option domain-name=example.

    ```


    In the same file, scroll down and add the following lines, removing the #:


    ```

    interface=wlan0

    static ip_address=192.168.1.2

    static mask=255.255.255.0

    static routers=192.168.1.1

    option domain-servers=192.168.1.1

    option routers-range 192.168.1.50 192.168.1.150

    option routers-time=700

    ```


    > If you get connected to the Pi remotely, you can make your traffic look private
    by editing /etc/tor/rc and commenting out the SOCKS line.


    # Access Point Pi


    Once you''ve set up the Pi, you can configure the Pi as a network gateway. For
    this, use the ssh command on a terminal that''s connected. The address of your
    Pi is 192.168.1.2 to connect to it.


    ```

    ssh pi@192.168.1.2

    ```


    after authenticating yourself into the Pi make sure the gateway is recognized.
    Refresh your package list


    ```

    sudo apt-get update

    ```


    ![](img/532f1b7284ceaabe875a6e3330711435_98_0.png)


    In these lines we define the IP address of your Pi (192.168.1.2), and the range
    of IP addresses it will hand out to devices (from 192.168.1.50 to 192.168.1.150),
    and also the address of the DNS servers (8.8.8.8 and 8.8.4.4). You can change
    any of these values as you prefer. Save (Ctrl+X) when you''re done.


    # Setting up a static IP


    We edit the /etc/dhcpcd.conf file to specify the interfaces that our DHCP server
    should listen to. Open the file and scroll down to the lines that say INTERFACES:


    Insert wlan0 between the quotes so that it now reads INTERFACES: Now restart the
    adapter (wlan0) and give it a static IP address. Finally, deactivate the adapter
    with:


    ```

    sudo ifdown wlan0

    ```


    and then use the /etc/network/interfaces file. In this file, comment out any entry
    already existing with wlan, and:


    ```

    # iface wlan0 inet manual

    ```


    +   It takes more than Tor to stay anonymous. Make sure you read the documentation
    on Tor Project''s website.


