    Variables in Python are automatically assigned a type based on the content. A
    name is a string (for a string variable), an integer (for an integer variable),
    or a float (for a number). You can change the type at any time.


    Some types can be converted to other types - we can convert an integer to a float,
    a number (with one decimal point) with casting


    but this will only work if the original string looks like its target: `float(''1.0'')`
    will not, `Float(''1'')` will.


    Just as division works differently for integers, addition also works differently
    for strings, hence the operator stands for concatenation, taking the latter string
    to the end of the former:


    ```

    $ >>> name = "Hello"

    $ >>> world = "world"

    $ >>> print(123+456)

    579

    $ >>> print(123*3)

    369

    $ >>> print(BeteluseBeteluseBeteluse)

    ```


    The last line shows that we can also multiply, divide and subtract, but they are
    not defined for strings.


    Data types indicate how data is represented, internally, and the effects of this
    can be subtle. In Python 2 the division operator works differently if one of the
    arguments is a float:


