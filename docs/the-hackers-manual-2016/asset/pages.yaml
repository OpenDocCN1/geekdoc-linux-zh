  md: '# Essential apps


    A Linux desktop isn''t complete without them.


    # LibreOffice


    Forked from OpenOffice.org, LibreOffice has one of the best productivity suites
    available. It includes programs for word processing, and can create spreadsheets,
    slides, drawings and diagrams, mathematical formulae. It also supports documents
    in proprietary formats and has recently a new face. www.librereoffice.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_0.png)


    # Thunderbird


    Another gift from the Mozilla Foundation. Thunderbird is the best email client,
    easy to set up and is brimming with features. Simple setup allows syncing with
    popular webmail services and multiple accounts, supports encryption and is extended
    across many others. www.mozilla.org/thunderbird


    ![](img/532f1b7284ceaabe875a6e3330711435_56_1.png)


    # Gufw


    You may not be using a firewall currently, and that''s because it is difficult
    to set up them. Gufw makes managing inbound and outbound traffic rules for various
    apps and individuals easy. Its wizard-like graphical interface is designed for
    inexperienced users. www.gufw.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_2.png)


    | Preconfigured | Simple | Advanced |

    |---|---|--|

    | Policy | | | |

    | Category | | | |

    | Application | | | |


    > Gufw provides configured rules tailored to in needs.


    Wine

    Wine is a compatibility layer that allows you running Windows applications on
    Linux.

    Despite the increasing number of cross-platform apps that work on Linux, there
    are still some that only run natively on Windows. These include third-party programs,
    such as Adobe Photoshop or just small niche-home games that you can''t do without
    Wine. Wine lets you run these Windows apps and games with ease. The project supports
    over 20,000 apps, though some require minor configuration tweaks to work. www.winehq.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_3.png)


    # KeepassX


    Keeping passwords for various services is a challenge for most users, but not
    with KeepassX allows you to store your passwords in an encrypted database. It
    can also fill the password automatically and also supports a password generator.
    www.keepass.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_4.png)


    # Bleachbit


    Everything becomes a bit clunky over time. Bleachbit helps you protect your privacy,
    it removes unnecessary and temporary files, to securely delete files or wipe your
    history. www.bleachbit.org


    # VirtualBox


    When you don''t want to cut it off you can use VirtualBox to run an entire Linux
    installation inside your host machine. This is useful for using experimental apps
    that you don''t want to deploy on a real computer, or to test other OS without
    exposing it to risk. www.virtualbox.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_5.png)


    # Remmina


    Remmina allows you to access a computer from the comforts of your desktop. It
    supports and connects to all kinds of remote servers. It is easy to use, and has
    features that make it a valuable option for occasional use. http://remmina.sourceforge.org/


    ![](img/532f1b7284ceaabe875a6e3330711435_56_6.png)


    # OpenSSH


    If you need to connect securely with a remote computer, you cannot doubt OpenSSH.
    It is a family of tools that provides tunneling capabilities by encrypting all
    traffic and includes authentication methods, and supports all SSH protocols. www.openssh.org


    ![](img/532f1b7284ceaabe875a6e3330711435_56_7.png)


    # Clonezilla


    This is a cloning solution that is distributed as a live CD and is for deep disk
    backup and restoration of files. It can also display an image of multiple computers
    in a network. Clonezilla can work with a large number of disks, partitions and
    filesystem types. www.clonezilla.org


    # VLC


    VLC distrips with a functional video player. If you need to convert video files,
    VLC is very helpful. It supports virtually every video and audio format and includes
    many plugins for advanced users. www.videolan.org/vlc


    # Gparted


    Use Gparted to restructure a disk on your computer. It is available as a live
    USB or installed inside your system. Gparted can resize, move, delete or create
    partitions and supports many filesystems. www.gparted.org


    # ZuluCrypt


    Create an encrypted disk within a file system or partition disk. ZuluCrypt has
    an intuitive user interface and can manage multiple individual files with GPG.
    http://homebank.free//zulucrypt


    # HomeBank


    This is a feature-rich finance app. It can import data from other sources and
    manage accounts in popular formats. It can also detect duplicate transactions
    and features. Easy to use for budgeting. http://homebank.free/


    ![](img/532f1b7284ceaabe875a6e3330711435_56_8.png)


    # Software tools for you'
