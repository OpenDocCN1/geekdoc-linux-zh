    # Installing an operating system


    Once you have built it you will need to install an operating system. We will look
    at how to do that, but at least know that there are enough distributions to choose
    from. Most motherboards use UEFI or BIOS and have Secure Boot enabled. You will
    also need to turn off the firmware before you press the relevant key at boot to
