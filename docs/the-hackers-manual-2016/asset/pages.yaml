  md: '# # Availability


    # What does it take to get running?


    When you decide to try out an anonymous distro, you have to get involved in using
    them, but it varies, so see what it takes to get yours up and running. Tails is
    a well-known distro, and we downloaded its ISO file and write it to USB stick
    with some convenient tool like Imdd or front-end ImageWriter. But the process
    with Tails


    turns out to be straightforward, because the image has to be signed with the rightbybit.
    So, when you use tails-iso-3.6.2-amd64.iso 256. 5 bs


    ```

    dd=tails-iso-3.6.2-amd64.iso of=/dev/sdx

    ```


    Where/s your first run? After that it works like a charm. The system boots into
    the live session just like a regular de-distro.


    Whonix and Qubes are significantly harder to launch, and here is why: Whonix comes
    in the form of two Virtual machines, one for the Gateway and other for the Workstation.
    The idea behind this secure delivery is to isolate your work from the internet
    access


    So, the first thing to do is launch and configure the Gateway then access it from
    another VM, where all work will be done. We didn''t find any issues with it, but
    we had to admit that only advanced users will be able to deploy their work under
    Whonix.


    After running Qubes OS from USB stick and booting it, we discovered that it''s
    not persistent, only an installation mode. Qubes is based on a recent Fedora release
    and shares the install with it. But it has some surprising system requirements:
    it wants you to provide with 4GB of RAM, for the root partition and for video-acceleration.
    NVIDIA or AMD have some issues in Qubes OS. The next system is your isolation-approach,
    which we''ll discuss later.


    Ultimately, Ubuntu Remix and JoDo Live-DVD were extremely easy to install. Their
    respective live sessions were easy to use.


    # ### Verdict


    +   * JoDo Live

    * Qubes OS

