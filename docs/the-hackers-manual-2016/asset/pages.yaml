  md: '# Pros and cons of Encrypt


    Encrypt has a number of advantages over LUKS-dm-crypt as encryption is at file
    level, you can back up your Private directory to a cloud service without worrying
    about your data being accessible to


    +   **Back up to cloud** Encrypt can also be used for system directories and swap,
    with a fstab entry, but it will prompt for a passphrase.


    +   **Login to read** User''s data is only available after the user logs in. Encrypt
    defaults to making it readable only by that user (and of root).


    +   **Multi-user security** Encrypt can encrypt separate directories for each
    user.


    +   There are, however, disadvantages: Managing is difficult when dealing with
    directories that contain many files, as this


    +   Large files Because each file is encrypted separately, the files all increase
    in size, which can be significant for small files, like an example checkbox.


    +   **Not-crossplatform** Encrypt is Linux only, using features of the kernel,
    which won''t be a problem for everyone if we are aware, there''s no way to read
    Windows files.


    creates three directories: .Private contains your encrypted directories, .Data
    is for the decrypted contents and .encrypts files that are used to mount them.
    As the encrypt is installed, you should make a copy and store it somewhere secure,
    such as a USB key or your computer.


    ```

    encrypts-unmount /encrypts/wrapped-passphrase ~/home/alice/encrypts

    ```


    Now you can mount and unmount your private data with these commands or use the
    desktop icon if provided.


    ```

    encrypts-mount

    ```


    ```

    encrypts-unmount

    ```


    This is a single encrypted directory in your home, but what if you want more?
    Let''s say you want out encrypted directories but not in encrypting Points and
    Documents or Music (why this that possible?). The answer is to encrypt .Private
    and create symbolic links to your home locations, like


    ```

    my Documents

    ```


    Make Private is private when you do this


    # Automatic mounting


    You give you permission to unlock the password to encrypts-mount (you can use
    the -auto-private flag) if you want it to automatically unmount so you may not
    be asked for password when you''ve already logged in to system and you need to
    access your private files: this is a valid question. If you do not, you might
    have to wait a few seconds later. Then you can have your Private directory automatically
    mounted when you log in (and unmounted when you log out)


    ```

    auth required /etc/pam.d/common.session

    session required /etc/pam.d/common.session

    ```


    Now PAM will mount your encrypts home directory when you log in. This happens
    if not you have auto-login enabled, otherwise you would have no security at all.


    # Encrypted \$HOME


    If all of this looks like magic then probably because you have used the encrypts
    home directory in Ubuntu, which is the default. (This standard kernel is restricted
    to one partition (ChromeOS OS uses encrypts before the scenes). Encrypt doesn''t
    just set up a Private-


    ![](img/532f1b7284ceaabe875a6e3330711435_102_0.png)


    directory when you are in, it encrypts your entire home directory. The simplest
    way to get a fully encrypted home directory is to install Encrypt and use that
    option. There are a couple of reasons why you might not want to encrypt your home
    directory: maybe you might already be using it, or you don''t want to start without
    any encryption yet.


    There''s a command that you can use to encrypt specific home directories, but
    that''s a couple of cases. You might want


    ```

    encrypts-home --user ~\$username

    ```


    After process completes, you must log in to that home before, completing the setup
    and then once you have verified that everything is working. Once it is there and
    manageable, you can delete the original unencrypted files that are still in /home/~user/random_string.
    Be aware that deleting directory does not affect your encrypt table. To be secure,
    you should ensure overall unused space filled with random data.


    This creates a file of data that fills the drive and then it returns it to the
    space.


    If you use encrypts-private or encrypts-migrate-home, you must use encrypts-passphrase
    to store passphrase in a safe place. If you don''t keep a of your passwords, you
    will not be able to access your data if the encrypts directory is lost or damaged.


    The Hacker''s Manual 2016 | 103'
