  md: '# Installation and distro support


    # Who supports to another desktop and do you ''em''?


    You can switch to another desktop environment without going through the pains
    of changing it. A DE is just another piece of software, and so you can install
    any desktop in your distro is supported by all others, so they''re just a package
    manager away.


    Gnome is the default DE on many popular distros. Fedora and OpenSUSE projects
    release an officially supported live CD/DVD version based around Gnome. In fact,
    Gnome is used by default and Ubuntu itself does use the Gnome 3 libraries.


    Cinnamon is the default environment that ships with Linux Mint and its development.
    The desktop is available in the official repositories of Fedora, Magea and you
    can install it as its respective package managers. Gnome has carved a name for
    itself among distros designed for other customers.


    Next up for popularity is KDE. Gnome and Fedora are some of the top desktops that
    officially support the DE and provide an live CD/DVD image based on KDE. If you
    prefer the desktop on top, you can get the Kubuntu distro. Some distro like Linux
    include multiple bundles of the desktop with different packages, such as kde-standard
    and kde-full


    Enlightenment is one of the oldest desktops in this Roundup and it doesn''t depend
    on top of any mainstream distro. Its biggest winner was Bodh Linux which has shut
    down recently, you can find Enlightenment in the official repositories of every
    distro.


    If you installed multiple desktop environments you can switch to another. To do
    this just out of the box. With the buttons of login manager and one of them will
    reveal a drop-down list of all installed desktops. The one you want to use and
    the login manager will log you into that.


    ![](img/532f1b7284ceaabe875a6e3330711435_64_0.png)


    > The Ubuntu project has officially supported flavour for the KDE, Gnome and Mate
    desktops.


    # Default applications


    # What''s prepared for the setup?


    desktop environments usually ship with their own core applications. For instances,
    a typical installation will have a collection of two core applications related
    to task manager.


