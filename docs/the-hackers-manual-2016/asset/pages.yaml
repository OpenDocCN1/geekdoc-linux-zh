  md: '# Deploy machines


    Image and rollout several computers from the comfort of your work.


    Managing a network of computers is an involved process. Before you can tackle
    the problem of managing machines, you have to install an operating system on each
    of them. It is a time-consuming task even for a small number of 10 computers.
    Cloning involves systems, drivers, software, and data on one computer, then automatically
    replicating the setup on others—much faster than ghosting or installing multiple
    machines over the network without out multiple effort. If you use Fog, here is
    one of the most popular ways to clone systems.


    To use Fog you need to set up an imaging server. The project officially supports
    Ubuntu, Fedora, Debian, and CentOS releases, but it can work on any Linux distribution
    as well. First make sure the Fog server has a static IP address, which you can
    configure from your router''s page. For example use 192.168.1.13. Also ensure
    that the Fog server is the only DHCP server on your network or connected to it.
    Make sure you do not have any other DHCP servers on the network as they will conflict.


    Once you have set up the server, head to the machine and install the Fog server.
    Download the stable release from [https://sourceforge.net/projects/fogproject/](
    and extract and download the installation script.


    ```

    tar xzvf fog-1.2.0-centos.gz

    ```


    Change into the bin directory of the extracted folder and run the install.sh script.
    The Fog server will be prepared for your clients


