  md: '# # Features


    # ## Who has the best and to test, whom hath the whistles?


    A of the clients you test, modify the corporate configuration and let you connect
    to desktop from afar. But they all cater to different needs, have differences
    and do different tricks. In this category we see features


    candidate offers, whether those features are useful or whether they leave the
    user in a state of confession.


    All of the clients on test fullscreen mode, so that (bandwidth permitting) may
    you''re sitting in front of the remote


    machine. Some things we mention are strictly properties of the client, whereas
    are dependent on the client connecting to the right kind of server. This is particularly
    true of TigerVNC, so much of our praise and criticism is here directed at the
    server side of things.


    # ### Remmina


    Remmina is an impressive client. It brings NX, VNC and RDP through the XDMCP protocol
    underlying the display server and client. It enables free connections via SSH
    and SFTP. If that it can be extended through a plugin system. It supports quality,
    which you can vary depending on available bandwidth, scaling options (or on a
    low powered device). The VNC protocol is unencrypted so it is common to tunnel
    your connection through SSH. But you can secure this via a options dialog. Further
    it supports shared clipboard across all protocols. You can set up the client to
    listen for an incoming connection to add few wheels.


    ![](img/532f1b7284ceaabe875a6e3330711435_77_0.png)


    ![](img/532f1b7284ceaabe875a6e3330711435_77_1.png)


    # ### TigerVNC


    TigerVNC is a client/server package that has been around since 1999. It supports
    multiple connections and compression levels, so that the best results can be gained
    from low-bandwidth connections. TigerVNC began as a fork of the largely-deprecated
    TightVNC and uses the same strategy of dividing the screen into subrectangles
    (or even subregions) to handle moving windows and title bars. It has advanced
    compression methods, such as TLS-based encryption (including authentication by
    TLS certificates) and more alternatives. Furthermore, xvncnc is a client for controlling
    an X session, without starting than one awake.


    # # Development status


    # ## Do these projects have a future?


    remmina continues to improve development since its inauguration in 2009. But it
    is mostly free-to-lend and xfreef, which needs more attention during basic maintenance.
    As a result, only GTK3-Valies is a somewhat aging area of interest. It''s what
    that is counts for.


    The tragic legacy behind the origins of RealVNC (RVNC), TigerVNC TightVNC have
    been compiled, but it has been the


    detriment of source VNC implementations. TigerVNC is significantly better than
    the rest, but still needs more attention. In fact, NoMachine seems to be relentless
    in its progress. It''s not without flaws.


    XVnc was started by a pair of high-school students in 2006. They and a core team
    of four others maintain the project. They have noble goals which is as good as
    it gets for three other projects based on the NX


    protocol are no longer maintained. From our performance test it''s clear that
    Xvnc isn''t quite as good as NoMachine, but the rest of the capabilities and gains
    the team is leaning towards the goal. The port of Remote VNC Desktop was launched
    last July, and its lackservice performance is frustrating since those things the
    NativeClient way is complicated, but the only way to provide packages that work
    for more than Ubuntu 2.04.


    # Verdict


    +   - Remote Desktop

    - NoMachine NX

    - Remmina

    - TigerVNC

    - XGo


    +   - NoMachine is relentless and wants to be all of your machines.


    78 | The Hacker''s Manual 2016'
