    # How we tested...


    For testing we used a number of machines: a high-end PC, a Raspberry Pi 2 Model
    B (where software existed), and we dusted off a slightly sluggish 2.3GHz dual
    core for some perspective. To see how the candidates fared in low-bandwidth scenarios,
    we ran the clients through Thele bandwidth filter. We simulated slow (25kb/s)
    and very slow (4kb/s) connection speeds in order to allow each client to reach
    its potential. We first paired each client with its partner and measured maximum
    performance. We used a Windows 7 PC to test the mantle of the RDP opens against
    the original protocol (the xrdp server only implements the parts in the public
    domain). In the compatibility test we mixed this up to see how different clients
    servers interact.


    While everyone knows the best way to remote SSH, it''s nothing (even nearly) to
    have access to an entire desktop. You might need to show Aunt Ethel how to change
    her desktop background, or how to get a map of a rival killing network. This set
    of graphics presents a problem, especially for the bandwidth-challenged, which
    we aim to solve. Linux favours the VNC protocol, while Windows favours the factors
    closely


