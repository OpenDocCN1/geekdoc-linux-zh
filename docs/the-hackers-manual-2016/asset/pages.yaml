  md: '# Appearance


    Which gives the best desktop experience?


    When Unity and Gnome 3 came about, the Ubuntu and Fedora dismissed new desktop
    options. But their radical design in a controversial new direction, re-imaging
    the desktop for the next gen of computing devices didn''t use the trusty mouse
    and keyboard combination. In accommodating new devices, they alienated a huge
    swath of desktop users, who were forced to learn new ways of interacting with
    their computers. Mate and Cinnamon were born out of controversy, as is usually
    the case with FOSS, in then Unity and Gnome 3 have become malleable enough to
    win back some of their old audience. What sets them apart from each other is how
    they look, and how you operate.


    # Cinnamon


    Cinnamon is the desktop environment that sticks to the desktop metaphor, and came
    into as a result of the community''s dissatisfaction with Gnome 3 and Unity. The
    Cinnamon desktop is a standard-fare with an panel at the bottom, which shows notifications
    alongside open windows and applications menu in corner of the screen. Like Mate,
    the Cinnamon Applications menu is a refresh of the standard menu and extends the
    corrected text-layout of the traditional menu with usability features from other
    environments, such as Favorites tab and many widgets that you can place on your
    Panel as the desktop. There''s also an Exposed hot like corner feature that presents
    an overview of open windows.


    ![](img/532f1b7284ceaabe875a6e3330711435_65_0.png)


    # Enlightenment


    The Enlightenment Window Manager was born in 1997 with a pleasantly different
    and refreshing of the desktop, when the viable choices were back then Gnome or
    KDE. The default desktop has a Workspace Switch on the top and a panel at the
    bottom with an application launcher. You can also left-click anywhere on the desktop
    to bring up the launcher and drop icons on the desktop. Enlightenment gives you
    a few new mechanism for interacting with the windows; for example, there are six
    different options for maximizing a window. The latest Enlightenment is still gradually
    accumulating. The widgets you can add known as gadgets. Unlike the other desktops,
    graphical effects on Enlightenment, such as fading and minimising windows, works
    well on older powered hardware.


    ![](img/532f1b7284ceaabe875a6e3330711435_65_1.png)


    # Help and documentation


    # Need some help?


    The desktop environment projects have adequate delevens for serving and support.
    Gnome, has a help portal (http://help.gnome.org/) for users and there''s also
    http://wiki.gnome.org for various Gnome projects. There are also several mailing
    lists and IRC channels. KDE has documentation suitable for all kinds of users.
    Their documentation is available for almost every KDE app on http://docs.kde.org/
    and there


    are also help and tutorials in the UserBase Wiki, which has a Sachys wiki. For
    a sysadmin''s guide, for support to subscribe to one of the mailing lists, forums
    or visit the IRC channel. Mate has a wiki with bit-by-bit instructions on how
    to install the desktop on top of several desktops, as well as that of Gnome 2
    and its matter. Mate User Manual for help should lead head on the official forum
    boards or should


    IRC channel. Surprisingly there''s no official documentation for Cinnamon which
    has a Sachys inside, although the Linux Mint user guide has a section on it. Cinnamon
    has a wiki with details about its components and you can ask for help on IRC or
    see what other users making list. Many projects as Gnome and KDE also have you
    to keep in touch with their developers by aggregating their blog feeds via Special
    Panel ports, such as http://planet.kde.org, and http://planet.gnome.org.


    # Verdict


    +   -Cinnamon


    +   -Enlightenment


    +   -KDE


    +   - All the its the same kind of support infrastructure for users.


    66 | The Hacker''s Manual 2016'
