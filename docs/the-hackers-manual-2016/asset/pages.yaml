  md: '# Linux environments


    Not entirely happy with your distribution''s default desktop environment?

    Let''s check out of the mainstream alternatives.


    # How we tested...


    Some drool rather behind a particular desktop environment by actively participating
    in its development. For example, Fedora through its corporate sponsor Red Hat,
    has several Gnome developers on its payrolls. Similarly, many full KDE developers
    draw their paychecks from OpenSE.


    This being the case, we felt needed a neutral environment, so we installed the
    desktop on one of the main Ubuntu distro that ships with Unity and has nothing
    to do with the desktop environments. However, we also used the native environment
    suggested by the desktop to experience it. We''ll compare their level of flexibility
    while configuring their native command and any third-party or community extensions.


    ![](img/532f1b7284ceaabe875a6e3330711435_63_0.png)


    or most desktop Linux users, a desktop environment is a paramount medium for interacting
    with them.

    distribution is the collection of all the graphical elements that you can see
    on the desktop of the computer, including windows, toolbars and icons. Desktop
    environments (DE) also include a Window Manager that is responsible for the appearance
    of windows in the GUI.


    # “The ability to alter the DE is as important as being able to alter the default
    applications.


    important being able to change and alter the desktop applications.

    Most major distributors officially support Fedora, Mageia, OpenSUSE all support
    KDE, and Gnome. Then there are others that officially support only limited number
    of desktops, as Ubuntu that supports Unity and Linux Mint


    Like all Linux and open source, sources are split for choice when it selects a
    DE. The ability to is just


    that prefer Cinnamon and Mate.

    However, then still doesn''t stop us from replacing the official default DE with
    other options.


    In this Roundup, we will look at all the most popular DEs and their advantages.
    One mainstream DE is missing from our list: Ubuntu, which being open source, is
    best experienced on Ubuntu only.


    64 | The Hacker''s Manual 2016'
