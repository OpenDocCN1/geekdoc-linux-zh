    Protected Kernel!


    # # Development


    # ## Private and secure, how are they maintained?


    His aspect is often overlooked, but it''s vital for regular users who want to
    have an up-to-date and actively supported distro. There are some distros abandoned
    by developers (such as at


    Privately (or unmaintained for years (like LibreOffice)) one might think there''s
    a lot of new features and fixes, but let''s not forget that Linux distros may
    have trouble running modern things like UEFI and Secure Boot. Tails is one of
    the best maintained anonymity distros, with a very fast pace of development.


    New releases are offered every few months, which means Tails has had six releases
