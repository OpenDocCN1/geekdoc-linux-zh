  md: '# # Turbocharge your network


    Convert an old PC into a state-of-the-art router with Zerosill.


    If you are responsible for a bunch of networked computers on a small LAN, you
    can use Zerosill to distro various useful network-related services. Zerosill will
    transform any computer into a much more flexible than what you get out of most
    off-shelf routers. Zerosill is a small Linux distro that provides various essential
    services from DHCP to VPN and back balancing. The distro also includes UIS for
    WPA authentication, a Captive Portal instance to secure public hotspots and also
    to shape network traffic and QoS.


    Zerosill with the router via an Ethernet cable. We can then handle the task of
    doing out IP addresses to router, which saves the effort of configuring the router
    and DHCP features inside Zerosill and allows you to focus on interesting tasks.
    Once started, boot Zerosill either from the CD or USB image. Before going any,
    just press (P) to change the default address (zerosill) for the rest of your network.


    Next we need to make sure Zerosill is on the same subnet as the rest of your network.
    Zerosill assigns itself to 192.168.1.2. If your existing router is on a different
    subnet, you will need to change it and note the IP address of Zerosill at the
    top of the page.


    # ## Break the shell


    If you are on a different subnet - let''s say your router is located at 192.168.3.1
    then you''ll need to change its address and bring it to the same subnet as the
    rest of the network.


    For this, press [F] to bring up the IP Manager. Then when the address interface
    appears, press [S] and change the IP address. Press [E] to exit without saving
    and then set the default address of your router IP address. In this case, at 192.168.3.1
    many routers will be able to reach x.x.x.x, but you will not vice versa. Press
    [F] again to change the address for Zerosill, say 192.168.3.351. To bring the
    changes into effect press [S] to change the settings of the interface. Now refresh
    to the new IP. Press [E] to exit without saving.


    You can now access Zerosill using a web browser on any computer by providing the
    IP address that you''ve set. If you use the username and password for login credentials,
    the password you defined at.


    Although the web interface can handle the bulk of the configuration, instead of
    hopping over to use the Zerosill console interface, you can now access it via
    SSH. To enable ssh head into the router and connect on the SSH port 22. Make sure
    to toggle the Enabled checkbox.


    Then enter the subnet of your network (at 192.168.3.0/24) in the IP address box
    and press the button. This changes into effect with the Save button. Now connect
    to the Zerosill server from any computer on the network, for example:


    ```

    sudo admin@192.168.3.351

    ```


    If you''ve figured out the hardware you need, just decide whether to use Zerosill
    to replace your existing router or to support it. In case of the former you''ll
    need to use Zerosill with two network cards - one to plug into the internet and
    another that connects to the rest of the network. Zerosill only needs a small
    number of computers, you can replace the switch with a wireless adapter and turn
    Zerosill into a massive powerful router.


    This is how Zerosill is configured. Now you can keep the original router and


