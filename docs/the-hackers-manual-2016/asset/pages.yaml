  md: '# # Internet apps


    Get the best of the web with tools.


    ### Firefox

    ![Firefox](https://example.com/path/to/firefox_icon.png)

    One of the most widely regarded pieces of open source. Mozilla''s web browser
    is the default browser on every Linux distro. It''s pretty responsive and known
    for its features. You can customize the browser with an impressive number of extensions.

    [www.firefox.com](http://www.firefox.com)


    ### RSSw

    ![RSSw](https://example.com/path/to/rssw_icon.png)

    An excellent desktop news reader. RSSw is a powerful aggregator for RSS and Atom
    news feeds that''s easy to configure. The app gathers, organizes, and stores news
    in one easy to use interface, and selects items for reading or sharing.

    [www.rssowl.com](http://www.rssowl.com)


    ### Midori

    ![Midori](https://example.com/path/to/midori_icon.png)

    The go-browser for anyone concerned about resource consumption. Midori is a lightweight
    distro. By nature and design, Midori has all the features you need, including
    a speedy, tabbed interface, bookmark manager and configurable web search as well
    as incognito mode.

    [www.midori-browser.com](http://www.midori-browser.com)


    ### gFTP

    ![gFTP](https://example.com/path/to/gftp_icon.png)

    The gFTP client is a feature-rich client that''ll get the job done, if you need
    to download files via FTP occasionally. It has a simple two-pane interface that
    shows content of local and remote filesystems. With gFTP you can also transfer
    files between two servers.

    [http://gftp.so](http://gftp.so)


    ### FileZilla

    ![FileZilla](https://example.com/path/to/filezilla_icon.png)

    For those who use FTP, there''s no FileZilla. The client supports FTP, SFTP and
    protocols and helps you with any configuration you can imagine. It has a simple
    interface and you can manage more than one server and transfer files simultaneously
    between multiple servers.

    [https://filezilla-project.com](https://filezilla-project.com)


    ### Jitsi

    ![Jitsi](https://example.com/path/to/jitsi_icon.png)

    Is the best video app, as long as you''re not afraid of Java. Its app integrates
    one-to-one audio and video calls, as well as group conferencing. Using the widely
    used Jitsi protocols, including SIP, XMPP, AIQ, and MUM, you''ll expect a secure
