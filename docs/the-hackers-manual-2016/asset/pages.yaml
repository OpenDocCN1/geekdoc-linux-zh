    two and we will explain how to do that in the code. When your output is shown
    in the browser, it will link back to the root post and you can do whatever you
    want from there, eg about the job position...


    # Getting started


    Have you wondered how some websites display data from various sources? This is
    a bit of tricky but it can be done using few methods, including direct database
