  md: '# Encrypt drives with zCrypt another way


    Insulate your data from navigating to a new location


    While you can access the data on your computer using user accounts and permissions,
    it''s not enough to prevent an intruder from gaining access to your private files.
    The only reliable way to keep your data safe is to encrypt it. Sure, encrypting
    with Crypt is a simple process that has an easy way to follow. You can create
    an encrypted drive within a partition, and on USB disk. It can also encrypt individual
    files with GPG.


    Next enter the password for encrypting the file in the key file. Make sure the
    password is a mix of characters and numbers to make it difficult to guess. Also
    remember that if you forget it, there''s no possibility of recovering the file—that''s
    the sort of the point! Once you''ve confirmed the password press the Button to
    create the file. This process might take a few seconds depending on the hardware.
    When it''s done, you''ll have the encrypted version with the .zc extension in
    the destination location you specified. Once a file is finished, the original
    file remains untouched.


    To install zCrypt visit http://github.com/zCrypt and download the latest binary
    packages. The app is available as .deb packages for Debian and Ubuntu. Download
    the package and extract it with your tool. Inside the extracted folder, switch
    to the folder corresponding to your architecture (x86 for 32-bit machines and
    amd64 for 64-bit). Both folders contain four binary packages that you can install
    using dpkg. On others, install it using your utility. Download the app''s manual
    and follow the detailed steps in the BUILD-INSTRUCTIONS file to get started.


    You now have to select the file before you can create and make changes. For this,
    launch zCrypt and head to > . Select the file you want to encrypt and the location
    of the file in the destination field. Enter the password with which you want to
    encrypt and click the Button. When it''s done, the encrypted file is created in
    the specified location. To like follow the outlined procedure.


    zCrypt also supports encryption which is the process of encrypt an already encrypted
    message, either using the same or different algorithm.


    Encrypted silos work well if you only need to protect a few files. It''s a bit
    cumbersome, and only suitable for files that you don''t need to read or modify
    frequently. If you need to protect a number of files, a better approach would
    be to use encrypted drives.


    One of the first things you should do afterward is to create encrypted versions
    of all files that you consider sensitive. For this launch zCrypt and head to >
    . Select the file you want to encrypt and the location adjacent to the Source
    field and navigate to the file you wish to encrypt. zCrypt will use this information
    to create a file with the same name and with .zc extension at the end—or save
    it elsewhere by clicking the icon adjacent to


    zCrypt uses block device encryption, which means it can encrypt everything within
    a certain device. The device can be a disk, a partition, or even a file mounted
    as a block device. With device encryption, the user creates the file system on
    the block device before writing the data to the locked device. The encrypted storage
    appears like a large block of random data and doesn''t even reveal its directory
    structure.


