    of quality to provide.


    ![](img/532f1b7284ceaabe875a6e3330711435_78_1.png)


    # NoMachine NX


    NoMachine NX uses the in-your-face interface, with its branded, black and orange
    windows. But if you can find this and its proprietary nature, then it''s of a
    powerhouse. X农村 gives access to the running desktops, and RDP supports audio/video
    redirection as well. It allows file transfers and remote desktop session recording.
    The released Raspberry Pi package is still in alpha NoMachine can use UDP to transfer
    multimedia data which it can encode using H.264, VP9 or MPEG compression. The
    latter less CPU power is suited for low power devices. NoMachine 4 no longer allows
    SSH connections, but you can connect by authenticate key.


