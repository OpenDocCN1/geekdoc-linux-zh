  md: '# Gnome


    Gnome is a revolutionary UI that still takes getting used to, and we note that
    its apps look best when viewed full-screen and run inside windows. The desktop
    begins with the Activities, which gives you access to installed apps and has a
    launcher-like bar for frequently used apps.

    The Workspace Switcher is in the right-hand side of the screen and lists all active
    windows; switching to another workspace will automatically add a third workspace.

    At the time KDE is a desktop that matches clings to apps and documents stored
    or linked online services. Operations that jar with traditionalists are the inability
    to fill the desktop with icons and the lack of an options menu when right-click
    on the desktop.


    ![](img/532f1b7284ceaabe875a6e3330711435_66_0.png)


    # KDE


    In contrast to Gnome, the KDE desktop is a mallable that''s all about customisation.
    The default layout and behaviour of the desktop and the Kickoff app launcher feel
    much familiar to users from Linux operating systems.

    KDE offers different views designed to make the best available desktop real-estate
    for rescues and not, and doesn''t force the user to stick to either. The default
    layout is the Desktop View, which encourages you to use widgets and you can also
    add widgets to the panels. Most place the widgets on the desktop to show the controls
    of a folder in a neat box that you can place anywhere on your screen. The new
    features allow its Activities to be more accessible and configurable.


    ![](img/532f1b7284ceaabe875a6e3330711435_66_1.png)


    # Mate


    The Mate desktop is a fork of the Gnome desktop and mimics its look to the linux.
    Linux Mate looks different with a panel bar and an application menu. Clicking
    on the launcher reveals a true application menu. In the first-panel you get the
    quick layout and system tools including the Package Manager. Control Center is
    also with the power options. In the second-panel, you can get the typical software
    settings, such as Categories and Offices. You can click any one of these to reveal
    it in the third-panel. Many of these panels are fully customizable that you can
    easily turn off with your preferences. You can choose icons and shortcuts on the
    desktop and place files and folders. You can add a panel on top and add it as
    to use in Gnome 2.


