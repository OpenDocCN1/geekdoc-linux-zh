    Want to control your PC with the wheel of your mouse? The EasyStroke app lets
    you define and manage gestures by recording the movements of your hand and mouse
    button. You can then configure actions that will be executed when the app recognises
    the deigned stroke. [https://easystroke.sourceforge.org](https://easystroke.sourceforge.org)


