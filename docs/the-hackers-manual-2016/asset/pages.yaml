  md: '# # Installation and update


    # ## An involved process or even one?


    Although mainstream vendors — such as Dell and Lenovo — have taken the lead of
    region-specific vendors — such as System7 and Caffeine—offering stable Linux distributions,
    the majority of users'' distro installation is still their first encounter with
    Linux.


    A few releases ago, the Fedora project overthrew its Anaconda installer, which
    now uses a ''hub and spoke'' model instead of a wizard. It''s not the most intuitive
    installer but has taken a few releases to become stable but can still be used
    with complex layouts. Advanced users can use it to create a custom partition layout.


    One of the most newbie-friendly installers is Ubuntu one that''s beaten by several
    other distros. The installer is easy to use and intuitive for new users. The latest
    version in Ubuntu offers its installs and third-party software, such as codecs.


    ![](img/532f1b7284ceaabe875a6e3330711435_10_0.png)


    Another allows you to install into a VM partition and offers to encrypt the partitions.


    ![](img/532f1b7284ceaabe875a6e3330711435_10_1.png)


    Debian is not designed for upgrading. You use the Update Manager, which checks
    for the availability of new releases and upgrades you. But the recommended method
    for upgrading Debian is to use the distupgrade tool.


    OpenSUSE and might have the most mature installers of the lot. Both distros have
    over 4000 packages, with software. Both distros offer several desktops, including
    KDE, Gnome, Xfce and LinuxDE.


    The OpenSUSE installer allows creation of custom partitions, and lets users during
    setup. It''s the only installer that allows you to select a network authentication,
    such as LDAP or NIS, as well as a password encryption scheme. The encryption you
    can choose can be simple or auto-encrypt mode.


    Mint is designed to help you upgrade your installation when there''s a new release.
    The current Mint 19 is an LTS release that provides security updates and bug fixes
    until April 2023.


    # ## Specialised distros


    Besides the desktop distros we compare there are several other specialised flavours
    of Linux designed for a single purpose, eg. DroidLive which is perfect for resurrecting
    an old computer with single disk or a NAS server.


    If you''re concerned about your privacy online to try the Tails distro that has
    a number of internet apps pre-configured for anonymity. The Tor distro does not
    allow access to internet internet and includes cryptographic tools to encrypt
    all files, except messaging.


    There are some other distros that you might enjoy for gaming if needed. Using
    the SteamOS from Valve serves as a Debian-based distro that is designed to run
    Steam games. But there are tons of non-Steam distros which run well.


    Kali Linux is a distro that comes with hundreds of tools for penetration testing
    and security auditing. The Caine distro is specially designed for forensic analysis
    and includes applications for forensic analysis, database and we


    ![](img/532f1b7284ceaabe875a6e3330711435_10_2.png)


    # ## Verdict


    Fedora

    Workstation 22

    Linux Mint 17

    Magia


    OpenSUSE 13.2


    +   The Mint and Ubuntu don''t have the same flexibility as Magia or OpenSUSE.


    ![](img/532f1b7284ceaabe875a6e3330711435_10_3.png)


    +   Tails can camouflage itself as a Windows desktop and also includes the Ethereum
    bitcoin coin.


    The Hacker''s Manual 2016 | 11'
