  md: '# # Beef up security with Kali Linux


    Plug the holes in your network defenses with this pentesting demo.


    Kali Linux is the swiss army for ethical hackers. The distro is used for penetration
    testing that you can use to compromise your own network in order to identify weak
    points of entry that are exposed by crackers. The Debian-based distro is available
    in multiple flavours and can be used as a Live distro or inside a virtual environment.
    In this tutorial we will use Kali Linux to explore the weak points in our network.


