  \ IOU L2 镜像中不支持的功能\n> \n> 术语表资源关于作者索引\n\n# GNS3 实战教程：使用 Cisco、Juniper 及其他技术构建虚拟网络实验室\n\
  \n### Jason C. Neumann 编写\n\n由 No Starch Press 出版\n\n# 前言\n\n网络无处不在。它们连接着各种各样的业务，从本地书店到巨型企业，再到大学，跨越了多个城市和洲陆。从概念上讲，网络非常容易理解，但它们正变得越来越复杂，软件定义网络\
  \ (`SDN`)、物联网 (`IoT`) 以及其他技术的创新已触手可及。\n\n为了理解、设计和管理当今复杂的网络，网络专业人士不仅仅要精通理论，还要在不断变化的环境中实践并验证概念。这正是\
  \ `GNS3` 用用武之地：它为用户提供了极大的活性来构建自己的网络实验室，允许他们尝试新的网络功能、捕获数据包以分析协议，并验证配置以便日后在真实设备上部署。这一切都无需投资昂贵的硬件。`GNS3`\
  \ 是一个强大且适应性强的工具，不断演进以集成了多个供应商，并满足网络专业人士日益增长的需求。但你如何精通 `GNS3` 本身，又要从哪里开始呢？\n\n在《GNS3\
  \ 实战教程》中，Jason 涵盖了网络工程师、管理员以及准备认证的人所需的所有入门知识，从引导你安装和配置 `GNS3` 到创建和管理你的项目。Jason 在展示软件真正深度的同时进行了深入探讨，涵盖了如何捕获网络数据包、如何连接到真实网络和现场交换机，以及如何在实验室中包含\
  \ Juniper 的 `vSRX Firefly` 和 Cisco 的 `IOS-XRv` 等高级系统。他花大量时间解释概念并提供技巧，这些技巧将让你迅速成为专家用户。\n\
  \nJason 的书是利用 `GNS3` 并充分发挥你网络实验室价值的理想选择。无论你是网络领域的初学者还是资深专业人士，我保证你离开时一定会有新收获。\n\n\
