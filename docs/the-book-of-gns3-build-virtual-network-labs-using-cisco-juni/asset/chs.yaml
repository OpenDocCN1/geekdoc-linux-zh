  \ 分区消息\n\n阅读消息后，按 `ENTER` 继续进入 FreeBSD Disklabel Editor。\n\n下一步是创建`Juniper 兼容分区`。密切关注你如何划分虚拟硬盘分区非常重要，因为\
  \ Juniper Olive 软件包必须看到正确的 FreeBSD 分区，否则安装将失败。你必须按照特定的顺序创建分区。\n\n要创建第一个分区，选择 `C`\
  \ 并在提供的字段中输入分区大小，如图图 6-8 所示。\n\n![指定分区大小。](img/httpatomoreillycomsourcenostarchimages2208983.png.jpg)\n\
