  \ Routers](img/bfig14.png.jpg)\n\n# 附录 C. NM16ESW 和 IOU L2 局限性\n\nGNS3 `Dynamips`\
  \ `NM16ESW` 模块的操作与其真实的实体相同。与该物理模块一样，`Dynamips` 模块不支持 Cisco Catalyst 交换机的所有功能，这意味着获取完整\
  \ Catalyst 交换机功能的唯一方法是将一个或多个真实的交换机集成到你的 GNS3 项目中。本附录列出了不支持的功能，以及 IOU L2 镜像可能不支持的功能。\n\
  \n如果你想使用特定的 Catalyst 交换机，首先检查这些列表以确定是否需要使用物理交换机。\n\n# 不支持 NM16ESW 功能\n\n`NM16ESW`\
  \ 交换模块不支持以下功能：\n\n- 接入交换设备管理器 (`SDM`) 模板\n- `ACL` – 改进合并\n- `ARP` 优化\n- `BGP` 对编号\
  \ `as-path` 访问列表的支持增加到 500\n- `BGP` 在达到 `max-prefix` 限制后重启邻居会\n- `BGP` 路由映射继续出站策略\n\
  - 端口清除计数器\n- `DHCP` 旁听\n- `DHCP` 旁听计数器\n- 启动时的诊断选项\n- 端口 `ErrDisable` 重激活\n- `ErrDisable`\
  \ 超时\n- `EtherChannel`\n- `EtherChannel` – 灵活 `PAgp`\n- `EtherChannel` 保护\n- 回退桥接\n\
  - `Flex Link` 双向快速收敛\n- `Flex Link` VLAN 负载均衡\n- `Flex Links` 接口抢占\n- `GOLD` – 通用在线诊断\n\
  - `IEEE 802.1ab`，链路层发现协议 (LLDP)\n- `IEEE 802.1s` – 多实例生成树 (`MST`) 标准\n- `IEEE 802.1s`\
  \ VLAN 多实例生成树\n- `IEEE 802.1t`\n- `IEEE 802.1W` 快速生成树重配置\n- `IEEE 802.1ad` 快速生成树协议\
  \ (RSTP)\n- `IEEE 802.1ag` 桥接链路检测 (CCD)\n- `IEEE 802.1au` 链路聚合控制协议 (LACP)\n- `IEEE\
  \ 802.1Q` VLAN 标记\n- `IEEE 802.1R` 属性生成树协议 (MSTP)\n- `IEEE 802.1S` 多个生成树协议 (MSTP)\n\
  - `IEEE 802.1X` 端口认证\n- `802.3ad` 链路聚合协议 (LACP)\n- `802.3u` 以太网\n- `802.3x` 聚合链路协议\
  \ (PAGP)\n- `802.3z` 链路聚合\n- (ST) 端口\n- 生成树协议 (STP) 环路保护\n- `SRR` (形状轮询) - 备用端口\n\
  - `STP` 系统日志\n- 交换数据库管理器 (`SDM`)\n- 躯干故障转移\n- 信任边界（针对 `CDP` 设备）\n- 单播 MAC 过滤\n-\
  \ `UDLD` (单向链路检测)\n- VLAN 访问列表 (`VACL`)\n- VLAN 感知端口安全\n- 加权尾丢 (`WTD`)\n\n# IOU\
  \ 镜像不支持的功能\n\nIOU 被认为支持实际 Catalyst 交换机 90% 的功能。以下功能可能不支持，视而异：\n\n- `DHCP` 旁听\n-\
  \ `ISL` 躯干\n- L3 `Etherchannel`\n- `MLS` QoS\n- 端口安全\n- 私有 VLAN\n- `QinQ`\n- `SPAN`/`RSPAN`/`ERSPAN`\n\
  - `UDLD`\n-  VLAN\n\n#### 术语\n\n以下书中使用的缩写。\n\n`APT` (高级软件包工具)：基于 Debian 的 Linux\
  \ 处理软件包的命令行工具。\n\n`ARP` (地址解析协议)：用于映射网络层地址到链路层地址的协议。用于 IP 到 MAC 地址的解析。\n\n`AS` (自治系统)：在一个行政控制下共享网络前的路由器组。\n\
  \n`ASA` (适应安全设备)：Cisco 防火墙设备。\n\n`ASDM` (适应安全设备管理器)：用于管理和监控 Cisco 安全设备的软件。\n\n`ASIC`\
  \ (专用集成电路)：一种通常是特定厂商的专用电路。\n\n`ATM` (异步传输模式)：一种用于通过公共和私有网络传输语音、视频和数据的技术。大部分已被 MPLS\
  \ 代替。\n\n`BGP` (边界边界协议)：互联网的路由协议。BGP 使用自治系统交换路由信息。\n\n`BSD` (Berkeley 软件发行)：在加州伯克利开发的\
  \ Unix 操作系统。\n\n`CCIE` (思科认证互联网专家)：Cisco 的专家级认证。\n\n`CCNA` (思科认证网络工程师)：Cisco 的入门级认证。\n\
  \n`CCNP` (思科认证网络专业人员)：Cisco 的专业级认证。\n\n`CCP` (Cisco 配置专家)：用于管理和监控 Cisco 路由器的软件。\n\
  \n`CDP` (Cisco 发现协议)\n\n\n\n\n\n一种 Cisco 私有协议，用于从网络上直接连接的 Cisco 设备上收集硬件和配置信息。\n\n\
  ### CIDR（无类网域间路由）\n一种为 IP 地址分配网络掩码的简写方法。`CIDR` 使用斜杠，后跟 IP 地址中掩码部分的二进制位长度；例如，`192.168.1.1`\
  \ `255.255.255.0` 在 `CIDR` 表示法中被写为 `192.168.1.1 /24`。\n\n### CPU（中央处理器）\n计算机中负责执行代码和控制输入/输出操作的电路。\n\
  \n### DHCP（动态主机配置协议）\n一种用于用于向主机动态应用 IP 地址和其他其他网络设置的协议。\n\n### DLCI（数据链路连接标识符）\n\
  一种链路本地虚拟电路标识符，用于将帧分配给 `PVC` 或 `SVC`。\n\n### DNS（域名系统）\n一种分层数据库服务器结构，用于将 Internet\
  \ 主机名映射到 IP 地址。\n\n### EIGRP（增强型内部网关路由协议）\n一种 Cisco 私有的高级距离矢量路由协议。\n\n### FTP（文件传输协议）\n\
  一种使用 `TCP/IP` 将文件从一个主机传输到另一个主机的协议。也指允许用户在远程主机之间传输文件的程序名称。\n\n### GLBP（网关负载均衡协议）\n\
  一种支持负载均衡的 Cisco 私有冗余路由器协议。\n\n### HSRP（热备备路由协议）\n一种 Cisco 私有的冗余路由器协议，在默认网关处提供自动路由器故障转移（failover）。\n\
  \n### IDS/IPS（入侵检测系统/入侵防御系统）\n一种用于监控网络活动以检测恶意代码的设备，通常与防火墙配合工作。不需要的活动会触发警报并报告给系统管理员。\n\
  \n### I/O（输入/输出）\n用于描述任何向计算机或设备设备传输数据的程序、操作或设备。\n\n### IOL（Linux 上的 IOS）\n运行在 Linux\
  \ 上并模拟 Cisco `IOS` 路由器或交换机特性的软件。\n\n### IOS（网络操作系统）\nCisco 的主要的路由器和交换机操作系统。\n\n\
  ### IOU（Unix 上的 IOS）\n运行在 Linux/Unix 上并模拟 Cisco `IOS` 路由器或交换机特性的软件。\n\n### IP（网协议）\n\
  `TCP/IP` 栈中的网络层协议，提供路由和逻辑地址。\n\n### IPv4（网协议第 4 版）\n`IP` 的第四版本。`IPv4` 使用 32 位地址方案。\n\
  \n### IPv6（网协议第 6 版）\n`IP` 的第六版本。`IPv6` 使用 128 位地址方案。\n\n### ISL（交换机间链路）\n一种 Cisco\
  \ 私有的 VLAN 组链路协议，在现代网络中已被 `802.1Q` 取代。\n\n### ISP（互联网服务提供商）\n为消费者和企业提供接入互联网服务的公司。\n\
  \n### ISR（集成服务路由器）\n一种用于小型企业或家庭办公室的 Cisco 路由器，通常通过 `DSL` 或电缆调制解调器连接到互联网。`ISR` 硬件通常使用专用集成电路（ASIC）设计。\n\
  \n### JNCIA（Juniper 网络认证关联工程师）\n`Junos OS` 入门关联工程师认证。\n\n### LAN（局域网）\n连接在小地理区域（如单栋建筑或一组建筑）内的计算机和外围设备的网络。\n\
  \n### LMI（逻辑管理接口）\n一种用于路由器和分隙传输（Frame Relay）交换机之间的信号标准。\n\n### MAC（介质访问控制）\n写入以太网卡固件中的唯一标识符。`MAC`\
  \ 地址用于物理网络网段上的通信。\n\n### MPLS（多协议标签交换）\n一种使用标签做出数据转发决策的封包转发技术。在现代网络中取代了 `ATM` 和分隙传输。\n\
  \n### MTU（最大传输单元）\n协议数据单元的最大帧大小。以太网的默认帧大小为 1500 字节，但可以根据你的以太网硬件和驱动程序进行减小或增大。\n\n\
  ### NAT（网络地址转换）\n一种在边缘路由器或防火墙上使用单个 `IP` 的方法，使得边缘设备背后的网络设备可以使用单个 `IP` 访问边缘之外的网络（如互联网）。`NAT`\
  \ 负责重写数据报文头，以跟踪边缘设备与内部主机之间的数据包。\n\n### NIO（网络输入/输出）\n用于描述任何通过网络向计算机或设备传输数据的程序、操作或设备。\n\
  \n### NPE（网络处理引擎）\n一种 Cisco 机箱卡，为某些 Cisco 路由器型号（如 `c7200`）提供额外功能。\n\n### NVRAM（非易失性随机存储器）\n\
  一种在掉电后仍保留内容的内存。\n\n### OS（操作系统）\n管理计算机的内存、进程以及所有的软件和硬件。\n\n### OSPF（开放最短路径优先）\n\
  一种内部网关协议，它使用链路状态数据库和最短路径优先（`SPF`）算法来计算到达网络的最佳路由。\n\n### OVA（开放虚拟设备）\n一种用于封装和分发虚拟设备的标准文件格式，这些设备可以使用\
  \ `VirtualBox` 和 `VMware` 等虚拟机软件运行。\n\n### POS（SONET 之上的封包）\n一种用于在 `SONET` 上传输点对点协议（`PPP`）数据包的通信协议。\n\
  \n### PVC（永久虚拟电路）\n在分隙传输或 `ATM` 网络中两个或多个节点之间建立的连接。\n\n### QEMU（快速仿真器）\n一种开源机器模拟器和虚拟化工具。\n\
  \n### RAM（随机存储器）\n一种掉电后不保留内容的内存类型。\n\n### RIP（路由信息协议）\n一种使用跳数作为选择网络最佳路由指标的距离矢量协议。通常被称为传闻路由。\n\
  \n### SSH（安全外壳）\n用于安全地登录远程机器并在上面执行命令。\n\n### SONET（同步光纤）\n一种用于在光纤网络上同步传输数据的协议。\n\
  \n### SVC（交换虚拟电路）\n分隙传输或 ATM 网络中两个或多个节点之间建立的动态连接。\n\n### TAR（带归文件）\n创建和处理流存档。\n\n\
  ### TCP（传输控制协议）\n`TCP/IP` 栈中的面向连接传输协议。`TCP` 负责创建可靠的端到端连接。\n\n### TFTP（简单文件传输协议）\n\
  `TFTP` 允许用户在没有认证或错误的情况下向远程机器传输文件。\n\n### UDP（用户数据报协议）\n一种无握手的无连接传输协议。`UDP` 在不确认的情况下交换数据报。\n\
  \n### VIRL（虚拟路由实验室）\nCisco 的网络仿真平台，包含运行 Cisco 核心网络系统的虚拟机。\n\n### VLAN（虚拟局域网）\n一种将二层网络划分为独立广播域的机制。\n\
  \n### VM（虚拟机）\n一种模拟特定硬件并允许安装和运行为该硬件设计的操作系统程序。\n\n### VMDK（虚拟机磁盘）\n通常被 `VMware`、`VirtualBox`\
  \ 和 `QEMU` 等虚拟机软件使用的虚拟磁盘镜像文件。\n\n### VPCS（虚拟 PC 模拟）\n一个模拟 PC 基本网络功能和命令的简单程序。\n\n\
  ### VPN（虚拟专用网络）\n一组安全协议，允许两个设备通过公共网络（如互联网）共享加密信息。\n\n### VPNC（虚拟专用网络连接）\n用于 Cisco\
  \ `VPN3000 Concentrator`、`IOS` 设备和 `PIX` 设备的软件客户端。\n\n### VRRP（虚拟路由器冗余协议）\n\n\n\n\
  \n\n一种开放标准的冗余路由器协议，可在默认网关处提供路由器自动故障转移。\n\n### WAN（广域网）\n覆盖地理范围广泛的网络，通常由通过一个或多个 VPN\
  \ 连接的多个网络组成。\n\n### WIC（WAN 接口卡）\n一种思科专有的接口卡，通常为路由器提供串行接口。\n\n# 资源\n访问 [`nostarch.com/gns3/`](http://nostarch.com/gns3/)\
