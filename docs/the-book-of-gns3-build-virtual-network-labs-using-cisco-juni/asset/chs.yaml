  \ no shutdown\n```\n\n接下来，在路由器 `R1` 的回环接口上配置三个 IP 地址。\n\n```\nR1(config-if)# interface\
  \ loopback1\nR1(config-if)# ip address 172.16.1.1 255.255.255.0\nR1(config-if)#\
  \ interface loopback2\nR1(config-if)# ip address 172.16.2.1 255.255.255.0\nR1(config-if)#\
  \ interface loopback3\nR1(config-if)# ip address 172.16.3.1 255.255.255.0\nR1(config-if)#\
  \ exit\n```\n\n这些地址将通过 `EIGRP` 宣告到你的 `IOS-XRv1` 设备。最后，配置 `EIGRP` 并宣告所有网络。\n\n```\n\
  R1(config)# router eigrp 10\nR1(config-router)# no auto-summary\nR1(config-router)#\
  \ network 10.0.0.0\nR1(config-router)# network 172.16.0.0\n```\n\n完成路由器 `R1` 的配置后，配置\
  \ IOS-XR 设备。\n\n### 配置 IOS-XR 设备\n\n登录 `IOS-XRv1` 并创建一个与你在路由器 `R1` 上创建的类似的配置。你将配置\
  \ IP 地址并启用 `EIGRP`，允许 `IOS-XRv1` 和路由器 `R1` 交换路由信息。\n\n```\n➊ RP/0/0/CPU0:ios#\n\
  \  RP/0/0/CPU0:ios# configure terminal\n  RP/0/0/CPU0:ios(config)# interface GigabitEthernet\
  \ 0/0/0/0\n➋ RP/0/0/CPU0:ios(config-if)# ipv4 address 10.1.1.2/24\n  RP/0/0/CPU0:ios(config-if)#\
  \ no shutdown\n  RP/0/0/CPU0:ios(config)# router eigrp 10\n➌ RP/0/0/CPU0:ios(config-eigrp)#\
  \ address-family ipv4\n➍ RP/0/0/CPU0:ios(config-eigrp-af)# interface GigabitEthernet\
  \ 0/0/0\n➎ RP/0/0/CPU0:ios(config-eigrp-af)# commit\n```\n\nIOS 和 IOS-XR 之间的第一个显著区别是提示符。`IOS-XRv1`\
  \ 提示符 ➊ 表示你的第一个处理器（`RP/0/0/CPU0`）。由于这是 IOS-XR 的演示版本，它被限于此处理器。接下来，当在以太网接口上配置 IP 地址时，你需要指定使用的\
  \ IP 族（`IPv4` 或 `IPv6`），且子网掩码以 CIDR 表示（`/24`）➋。同样，在配置 `EIGRP` 过程 ➌ 时需要指定 `IPv4`\
  \ 或 `IPv6`。最后，通过将网络放在 `EIGRP` 过程 ➍ 下来宣告。完成后，务必 `commit` 你的更改➎。一旦你完成了所有配置，输入 `show\
  \ eigrp` 命令，你应该看到此输出：\n\n```\nRP/0/0/CPU0:ios# show eigrp neighbors\nIPv4-EIGRP\
  \ Neighbors for AS(10) VRF default\n\nH   Address                 Interface    \
  \  Hold Uptime   SRTT   RTO  Q\n                                           (sec)\
  \         (ms)        Cnt\n0   10.1.1.1             GigabitEthernet0/0/0  00:00\
  \      0   \n```\n\n\n\n\n2010 年，Cisco 将 IOU 集成到 Cisco Learning Network 中，为 CCNA\
  \ 和 CCNP 学生提供在线虚拟实验设备。这些实验室价格低廉且设计良好。如果你对 Cisco Learning Labs 感兴趣，应该查看 Cisco Learning\
  \ Center ([http://learningnetwork.cisco.com/])。\n\n正如名称所示，IOS on Unix 仅运行在基于 Unix\
  \ 的系统上。它有时被称为 IOS on Linux (IOL)，在 Solaris Unix 和 Linux 上开发。\n\n## IOU 对 GNS3 意味着什么\n\
  \n在 Cisco 宣布其将放弃行业标准硬件转而使用专有的集成服务路由器（ISR）硬件之后，GNS3 社区曾怀疑 Dynamips 和 GNS3 的时代是否已经结束。由于无法获取新专有硬件的技术规范，无法创建运行最新\
  \ IOS 软件所需的新型虚拟机程序。最终，旧的 Dynamips 设备将停止 IOS 更新并变得过时。\n\nCisco 实际上为 GNS3 使用的 7200\
  \ 系列路由器保持 IOS 的更新，但所有其他 GNS3 路由器在 IOS 版本 12.4(15)T 处停止更新，这限制了学习 VoIP 等现代技术的能力。这就是为什么\
  \ IOU 令人兴奋。它为 GNS3 注入了新的生命，允许你将更新的 IOS 技术集成到你的 GNS3 项目中——这非常酷！\n\n## 交换、交换、更多的交换！\n\
  \n将 IOU 集成到 GNS3 的最佳理由之一是你可以使用 Cisco 的许多高级交换功能，而这些功能在 Dynamips 的 NM-16ESW 模块中是缺失的（参考\
  \ [附录 C \"Appendix C. NM-16ESW and IOU L2 Limitations\"]]）。这些功能让 GNS3 能够提升水平，成为\
  \ CCIE 等更高级认证的全方位培训工具。\n\n有了 IOU，你不再需要购买物理交换机并创建分段交换机，或使用 ISL 桥接等小技巧来访问真实的交换机。使用\
  \ GNS3 EtherSwitch 路由器，现在可以从你的 Dynamips 交换机到运行在 PC 上的 IOU 交换机块创建一个普通的 802.1Q 中继链路。IOU\
  \ 交换机稳定、运行快速，而且与物理交换机不同，它们是完全便携的，这意味着它们可以作为 GNS3 项目的一部分随笔记本电脑携带。\n\n#### IOU 镜像\n\
  \nIOU 镜像围绕 IOS 特性设计，其文件名通常揭示了它们包含的功能，就像 IOS 镜像文件名一样。例如，让我们拆解名为 `I86BI_LINUXL2-UPK9-M-15.0`\
  \ 的 IOU 交换机文件名。\n\n*   `I86BI`: 表示这是一个 Intel 32 位二进制镜像。\n*   `LINUX`: 表示它运行在 Linux\
  \ 上。\n*   `L2`: 表示它是一个 L2/L3 交换机。\n*   `UPK9`: 表示镜像包含高级加密功能，如 3DES/AES。\n*   `M`:\
  \ 表示它是主线（mainline）IOS。\n*   `15.0`: 指定了镜像基于的 IOS 版本。\n\n使用这些信息，你应该能够查看任何 IOU 文件名来快速确定包含哪些功能。\n\
  \n## 安装 IOU 之前需要了解的事项\n\n默认情况下，标准的 GNS3 安装不允许运行 IOU。IOU 设备是 Linux 文件，因此它们只能使用 Linux\
  \ 操作系统运行。通常，镜像是 32 位二进制文件，但通过适当的库文件，你可以轻松地在 64 位 Linux 系统上运行它们。如果你在 Windows 或 OS\
  \ X 上运行 GNS3，必须安装类似 VirtualBox 的虚拟化程序并使用虚拟机运行 IOU 设备。坦率地说，GNS3 提供了一个可以从 GNS3 网站下载的\
  \ IOU 虚拟机。GNS3 IOU 虚拟机准备好运行 IOU 镜像，为你提供了上传镜像的简单方法，并且不需要你如何使用 Linux。\n\n在 Linux 中运行\
  \ GNS3 的优点是安装和配置 IOU 更加直观，且一切都应该无缝运行，无需额外配置。缺点是你必须稍微了解 Linux，但在我看来，这是一个很小的代价。当你在\
  \ Windows 或 OS X 上运行 GNS3 时，你必须配置它通过 TCP/IP 与 Linux 虚拟机通信，这管理起来可能很。如果你的工作站或 IOU\
  \ 虚拟机的 IP 地址发生变化（这经常发生），你必须重新配置 GNS3 使用新的 IP 地址。此外，当你升级 GNS3 时，你必须升级运行在 IOU 虚拟机上的\
  \ GNS3 软件。版本号必须一致，否则 IOU 将无法运行。当你在 Linux 上同时运行 GNS3 和 IOU 时，这些步骤都是多的。\n\n## 在 Linux\
  \ PC 上设置 IOU\n\n在 Linux PC 上运行 GNS3 和 IOU 有一些明显的优势。最大的优势是你不需要使用 IOU 虚拟机，因为 IOU 镜像文件是原生运行的。这意味着你不需要放弃\
  \ IOU 虚拟机会占用的可用资源（如 CPU 周期和内存）。另一个优势是你可以使用 Wireshark 捕获并监控两个 IOU 设备之间的包，而使用 IOU\
  \ 虚拟机无法这样做。这是因为启动 Wireshark 捕获时创建的 `.pcap` 捕获文件保存在 IOU 虚拟机而不是本地，因此 Wireshark 无法访问该文件。\n\
  \n如果你在 Linux 上运行 GNS3，请遵循本节中的指令来启动 IOU。否则，请跳到“在 Windows 和 OS X 上使用 GNS3 IOU 虚拟机”。\n\
  \n#### 安装 IOU\n\n当你运行 IOU 镜像时，镜像会寻找 `libcrypto.so.4` 文件，如果没有它将无法运行。虽然系统中可能安装了 libcrypto\
  \ 库文件，但你应该安装 `libssl.0.0`，因为该版本已被证明与 IOU 镜像兼容稳定。接下来，从 `libcrypto.so.1.0.0` 创建 `libcrypto.so.4`\
  \ 的符号链接（sym-link）；符号链接是 Linux 于 Windows 快捷方式。如果你使用的是 32 位的 Ubuntu，请使用以下命令安装 libcrypto：\n\
  \n```\nsudo apt-get install libssl1.0.0\nsudo ln -s /lib/i386-linux-gnu/libcrypto.so.1.0.0\
  \ /lib/libcrypto.so.4\n```\n\n运行 64 位 Ubuntu 系统时，你需要在配置 `libcrypto` 之前安装 32 位的 `libssl`\
  \ 包，以便运行 32 位 IOU 镜像。如果你是 32 位的 Ubuntu 系统，可以忽略后续命令。\n\n```\nsudo apt-get install\
  \ libssl1.0.0:i386\nsudo ln -s /lib/i386-linux-gnu/libcrypto.so.1.0.0 /lib/i386-linux-gnu/libcrypto.so.4\n\
  ```\n\n如果你没有运行 Ubuntu，那么你可能需要一些研究来在你的系统中配置 `libcrypto`，因为并不是所有的 Linux 系统都使用相同的库文件和版本，甚至不以\
  \ Ubuntu 相同的目录存储文件。关键是 `libcrypto` 文件必须链接到 `libcrypto.so.4`。\n\n配置好 `libcrypto.so.4`\
  \ 后，将一个或多个 IOU 镜像文件复制到你的 Ubuntu 系统。你必须在运行前赋予 IOU 文件可执行权限；操作方法如下：\n\n```\nsudo chmod\
  \ 555 I86BI_LINUXL2-UPK9-M-15.0.bin\n```\n\n接下来，安装 GNS3 `iouyap` 所需的依赖项。该程序负责设置\
  \ IOU 与其他 GNS3 设备（如 Dynamips 路由器）之间的通信。首先安装 `bison` 和 `flex`，这是编译 `iouyap` 之前需要的两个包。\n\
  \n```\nsudo apt-get install bison\nsudo apt-get install flex\n```\n\n现在，使用以下命令安装并编译\
  \ `iniparser` 程序：\n\n```\nsudo apt-get install git\ngit clone http://github.com/ndevilla/iniparser.git\n\
  cd iniparser\nmake\nsudo cp libiniparser.* /usr/lib/\nsudo cp src/iniparser.h /usr/local/include\n\
  sudo cp src/dictionary.h /usr/local/include\n```\n\n\n\n\n\n一个包含 `iouyap` 的 ZIP\
  \ 文件应该已经包含在你 Linux GNS3 下载包中了。解压 `iouyap-<x>.zip`（将 `<x>` 替换为你拥的版本），并使用以下命令编译程序：\n\
  \n```bash\n$ cd iouyap-x\n$ sudo make\n$ sudo make install\n```\n\n如有必要，将编译后的应用程序拷贝到\
  \ `/usr/local/bin` 目录。\n\n```bash\n$ sudo copy iouyap /usr/local/bin\n```\n\n现在所有应用程序已安装完毕，你需要进行一些配置。\n\
  \n#### 创建许可证文件\n\n在运行 IOU 之前，你必须创建一个许可证文件，该文件包含你的 PC 主机名和一个有效的许可证密钥。许可证密钥根据你的 Linux\
  \ 主机名生成，因此请确保你对 PC 的主机名满意。如果你更改了主机名，你需要输入一个新的许可证密钥。\n\n获取密钥后，使用文本编辑器创建许可证文件。我通常将文件命名为\
  \ `.iourc`，但任何名称都可以。以下是一个名为 Ubuntu 的 PC 使用许可证密钥 `1234567812345678` 的许可证文件示例。主机名对大小写敏感，因此在许可证文件中输入时请务必小心。\n\
  \n```\n[license]\nUbuntu = 1234567812345678\n```\n\n如果你不确定你的 Linux 主机名称，可以使用终端中的\
  \ `hostname` 命令来显示名称。\n\n#### 配置 GNS3\n\n接下来，在 IOS on UNIX 偏好中设置 `iouyap` 应用程序路径和你的\
  \ IOU 许可证文件。`iouyap` 应用程序用于将 Dynamips 以及其他 GNS3 设备与 IOU 设备桥接，以便你的所有设备能够无缝连接在一起。选择\
  \ **Edit（编辑）** ▸ **Preferences（偏好）**，然后从左菜单选择 **IOS on UNIX**，如图图 9-1 所示。\n\n![IOS\
  \ on UNIX preferences, General settings tab](img/httpatomoreillycomsourcenostarchimages2209111.png.jpg)\n\
  \n图 9-1. IOS on UNIX 偏好，常规设置选项卡\n\n在 General（常规）设置选项卡上，在 Path to IOURC 中设置许可证文件的路径和名称。这指的是你之前创建的\
  \ IOU 许可证文件。此外，在 Path to iouyap 中设置你的 `iouyap` 文件的路径，通常为 `/usr/ local/bin/iouyap`。接下来，进入\
  \ Server（服务器）设置选项卡，如图图 9-2 所示。\n\n勾选 **Always use the local server (Linux only)（始终使用本地服务器（仅限\
  \ Linux））** 复选框，以便 IOU 使用本地 PC 进行 GNS3 和 IOU 的集成成。然后，进入 Advanced（高级）设置选项卡，如图图 9-3\
  \ 所示。\n\n每个 IOU 设备在定义的范围内被分配了一个唯一的控制端口号。除非该范围与 PC 上运行的其他基于 IP 的应用程序发生冲突，否则不要更改这些值；UDP\
  \ 隧道端口范围也是如此。UDP 端口用于建立 IOU 与其他 GNS3 设备之间的网络通信。\n\n![IOS on UNIX preferences, Server\
  \ settings tab](img/httpatomoreillycomsourcenostarchimages2209113.png.jpg)\n\n图\
  \ 9-2. IOS on UNIX 偏好，服务器设置选项卡\n\n![IOS on UNIX preferences, Advanced settings tab](img/httpatomoreillycomsourcenostarchimages2209115.png.jpg)\n\
  \n图 9-3. IOS on UNIX 偏好，高级设置选项卡\n\n最后，在 Preferences（偏好）窗口的左菜单中展开 **IOS on UNIX**，显示\
  \ IOU 设备部分，如图图 9-4 所示。从这里，你可以向 GNS3 添加一个或多个 IOU 镜像文件。\n\n![Adding IOU images to\
  \ GNS3](img/httpatomoreillycomsourcenostarchimages2209117.png.jpg)\n\n图 9-4. 向 GNS3\
  \ 添加 IOU 镜像\n\n要向 GNS3 添加 IOU 镜像文件，点击 **New（新建）** 按钮启动新建 IOU 设备向导，如图图 9-5 所示。\n\n\
  ![New IOU device wizard](img/httpatomoreillycomsourcenostarchimages2209119.png.jpg)\n\
  \n图 9-5. 新 IOU 设备向导\n\n为你的新设备输入名称（本例中为 `IOU_L2`）；然后点击 **Browse（浏览）** 按钮定位并选择你的 IOU\
  \ 镜像文件。完成后，点击 **Finish（完成）** 完成向导。添加后，你的 IOU 镜像文件应被复制到 GNS3 用户目录下的 `GNS3/images/IOU`\
  \ 中。要要配置 IOU 设备，请从 IOU 设备部分拖入 IOU 设备图标。右键点击设备打开配置器，如图图 9-6 所示。\n\n![IOU configurator](img/httpatomoreillycomsourcenostarchimages2209121.png.jpg)\n\
  \n图 9-6. IOU 配置器\n\nGeneral（常规）选项卡上的选项允许重命名设备并更改控制端口号和 RAM 值。默认值均为 2，但你可以根据需要轻松调整数量。在\
  \ Network（网络）选项卡上，你可以调整以太网和串口适配器的数量。默认值均为 2，但每个适配器提供四个接口。适配器的总数不能超过 16 个，每个 IOU\
  \ 设备最多有 64 个接口。\n\n要导出 IOU 配置，请从 IOU 控制台中输入 `copy running-config unix:initial -cfg`，然后右键点击设备并选择\
  \ **Export config（导出配置）**。系统将提示文件名和位置，文件将保存在那里。你可以选择 **Import config（导入配置）** 来导入配置。\n\
  \n\n\n\n\n使用浏览图标定位并选择 `GNS3 IOU VM.ova` 文件。在图 9-7 中，我的虚拟机位于我的 `Downloads` 目录，即 `C:\\\
  Users\\jneumann\\Downloads`。一旦选择了该文件，点击**Next**（下一步）并验证设备设置。它们看起来应该与图 9-8 相似。\n\n\
  ![Virtual Appliance settings](img/httpatomoreillycomsourcenostarchimages2209125.png.jpg)\n\
  \n图 9-8. 虚拟设备设置\n\n你应该接受建议的设备设置。注意，默认的 RAM 设置为 2048MB。我发现，如果你在项目中仅使用几个 IOU 设备，可以将\
  \ RAM 减少到 1024MB。这样做可以减少 PC 占用的内存总量，并且在资源紧张时可能帮助 GNS3 运行得更好。如果你不确定，只需接受默认值并点击**Import**（导入）完成导入。你以后可以修改设置。\n\
  \n导入虚拟机后，点击**Settings**（设置），然后点击**Network**（网络）访问网络面板，如图 9-9 所示。\n\n![Bridge the\
  \ network adapter to your PC.](img/httpatomoreillycomsourcenostarchimages2209127.png.jpg)\n\
  \n图 9-9. 将网络适配器桥接到你的 PC。\n\n在 Adapter 1 标签页中，选择**Enable Network Adapter**（启用网络适配器）选项。然后在\
  \ Attached to（连接到）字段旁边选择**Bridged Adapter**（桥接适配器）。完成后，点击**OK**。这将虚拟机的以太网适配器桥接到你的\
  \ PC，并允许其访问互联网，以便根据需要安装额外的包。\n\n## 上传 IOU 镜像文件\n\n现在你已经导入了 GNS3 IOU 虚拟机，你应该能够运行虚拟机并上传你的\
  \ IOU 镜像文件。要启动虚拟机，请选择如图 9-10 所示的**GNS3 IOU VM**，并点击**Start**（启动）。\n\n![Select and\
  \ start your GNS3 IOU virtual machine.](img/httpatomoreillycomsourcenostarchimages2209129.png.jpg)\n\
  \n图 9-10. 选择并启动你的 GNS3 IOU 虚拟机。\n\n虚拟机启动几分钟是正常的，因为它正在启动一个功能完整的 Linux OS。虚拟机运行后，屏幕上应显示类似下面的控制台消息：\n\
  \n```\nWelcome to GNS3 IOU appliance\nUse 172.16.231.204 to configure a remote server\
  \ in GNS3 Preferences\nUse your browser with http://172.16.231.204:8000/upload to\
  \ upload IOS images\n\ngns3-iouvm login:\n```\n\n注意，屏幕提示你使用 PC 的浏览器浏览器上传 IOU 镜像文件。为了使之生效，你的\
  \ PC 和 GNS3 IOU 虚拟机必须都从本地网络分配一个 IP 地址。在本示例中，我的虚拟机的 IP 地址是 172.16.231.204。\n\n###\
  \ 注意：有时 IOU 虚拟机可能不显示 IP 地址。在这种情况下，请使用用户名 `root` 和密码 `cisco` 登录虚拟机。然后输入 `ifconfig\
  \ eth0` 来显示虚拟机以太网接口的 IP 地址。\n\n要上传 IOU 镜像文件，打开网页浏览器并访问端口 8000 的 IP 地址。在输入 URL（在本例中为\
  \ [`http://172.16.231.204:8000/upload`](http://172.16.231.204:8000/upload)）后，你应该看到一个类似于图\
  \ 9-11 的网页。\n\n![Select and upload your IOU image files.](img/httpatomoreillycomsourcenostarchimages2209131.png.jpg)\n\
  \n图 9-11. 选择并上传你的 IOU 镜像文件。\n\n使用**Browse...**（浏览...）按钮从 PC 选择 IOU 镜像文件。一旦选择完毕，点击**upload**（上传）完成过程。对你想在\
  \ GNS3 中使用的每个镜像和 IOU 文件重复此步骤。镜像存储在 IOU 虚拟机的 `/home/gns3/GNS3/images/` 下，路径会显示在网页上供日后使用。在\
  \ GNS3 中配置 IOU 镜像时你需要这些信息，因此现在高亮并复制完整路径和文件名是个好主意。这样就不用手动输入它了。\n\n## 为 IOU 配置 GNS3\n\
  \n现在 IOU 已经就绪，你只需要准备 GNS3。首先，准备 GNS3。首先，如图 9-10 所示，选择**GNS3 IOU VM**并点击**Start**（注：此处根据上下文逻辑应为启动\
  \ IOU 虚拟机）。\n\n*纠正：原文此处描述可能存在逻辑微调或翻译偏差，根据语意应为启动虚拟机。*\n\n*重新翻译该段落：*\n现在 IOU 已经就绪，你只需要准备\
