  md: '# The ABCs of Network Security


    be a real design criterion for you. Wherever possible, these practices should
    be followed as a matter of policy. And don''t just follow them, write them down
    and tell people where to find the piece of paper.


    # Physical Security


    Securing the important machines makes it much harder for someone to gain physical
    access to them. It''s nearly impossible to prevent a machine from being subverted
    if someone can get to it physically. At MIT, network security and authentication
    are handled by a software system kerberos that makes it extremely hard to lie
    about who or where you are on the network. The kerberos system, however, is only
    as secure as the machine which approves all the other requests. This ticket-granting
    server, as it is known, lives in a locked steel cage inside a room with a hefty
    lock on the door. Very few keys to the padlock on that cage exist. All the network
    services that might be used to compromise the machine have been turned off, to
    sure, but MIT has put much effort into the physical security of the machine as
    they have into its network security.


    Home offices should consider moving crucial machines out of public view. At the
    very least, make it difficult for someone to accidentally type on. If any of your
    services are running on desktop machines, try to migrate them out as soon as possible.
    Start to distinguish between servers and desktops, and secure the servers.


    Small businesses should consider moving all of the servers, along with the Internet
    connection, into a single room with no people in it. This makes providing other
    services that computers like (for example, uninterruptible power and air conditioning)
    easier as well. Then, put a good lock on the server room door and don''t hand
    out keys.


    Larger installations should review their policy for access to the servers. A two-tier
    architecture may be appropriate: Group the servers into ones that people need
    access to sometimes, and ones that people never need to access. The server that
    writes backup tapes nearly needs to be in a sheltered place accessible by the
    person who changes the tapes. The primary database server and the firewall are
    MIT''s ticket-granting server; they should be well away from everyone else''s
    eyes.


    Physical security shouldn''t stop at servers. Have you ever told your email package
    to store your password so you don''t have to type it time you want to check your
    email? You''re not the only one. People store their passwords on their computer.
    As a result, for far as your computers are concerned, possession of someone''s
    desktop machine amounts to possession of their identity. A good password-protected
    screensaver that cuts in after a machine has been idle for a'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'few minutes can stop opportunistic walk-up cracking. It would be better if
    people could be prevented from storing their passwords on their computers, but
    this can prove extremely difficult to do. Never doing itself is a good start.
    In any case, desktop security shouldn''t be neglected (see the upcoming section,
    Host-Based Security).


    # Network Security


    Securing the network hardware is particularly important if you have shared rather
    than switched Ethernet. To explain this will take a moment; the explanation only
    applies if you are using what''s known as twisted-pair Ethernet. You can tell
    that by looking at your network cable. If it terminates in something like a fat
    plug, you most likely have twisted pair. If it''s anything else, you don''t, so
    you can skip the next few paragraphs and secure your network hardware now.


    In traditional shared Ethernet, every packet sent is seen by every machine on
    the same subnet (strictly speaking, in the same domain, but let''s not complicate
    matters). This means passwords from your desktop to your servers can, in principle,
    be read by any machine on your subnet. In fact, there exists hardware and software
    systems as sniffers, designed to exploit this fact. They nose around all network
    traffic and capture the interesting-looking blocks. Worse, and contrary to common
    belief, there is no generally valid way to stop a sniffing device (even programs
    like AntiSniff can''t detect all sniffers). With switched Ethernet, on the other
    hand, switches learn which machines are attached to which ports on the switch,
    and don''t send traffic to machines that don''t need to know it. You can see how
    this will help—the password you are sending to the server is seen by only yourself
    and the server.


    Maybe an analogy will clarify this. Suppose you need to tell a secret to Fred,
    who lives somewhere the other end of the office. Perhaps you need to tell him
    where you keep the spare key to your front door hidden. But you don''t remember
    which cubicle he works in. Now, you could stand on your chair, howl "Fred!" at
    the top of your voice, and shout out the location of the key. Your coworkers will
    know the message is for Fred, not for them; therefore they will ignore it, right?
    Well, yes, they would, but I hope you haven''t anything valuable in your front
    hallway. That''s shared Ethernet works, though. Now suppose you decide against
    shouting, you get off your chair, and ask a trusted coworker to go and tell Fred
    where the key is. The coworker knows Fred sits, and he walks down to Fred''s cubicle
    and quietly tells him the message. Only you, Fred, and the trusted coworker know
    the message. That''s how switched Ethernet works, with the switch playing the
    part of the trusted coworker (also starring Fred as "the server").'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Telling which kind of Ethernet you have can be tricky. Go look at your network
    concentrators, the boxes in which all your network cables are plugged. If they
    are labeled as switches, they probably are. Most other things indicate a shared
    network. Whether you''re shared or switched, making sure people can''t plug things
    willy-nilly into your network is a good internal security measure.


    Passing on from the network, desktop modems are considered a very insecure idea.
    Individual users generally don''t have the ability to securely use a modem. Dial-in
    and dial-out should both be handled centrally if at all possible.


    For dial-in, there are a variety of devices that can receive calls and authenticate
    properly (using one of the remote authentication protocols described in the section
    titled Password Security). Centralizing dial-in will also give you the option
    of ensuring that dial-in users land in some secured part of your network, one
    that won''t let them behave as if they were inside your building.


    For dial-out, there are network-based modems that can be accessed like any other
    IP-based network device. Furthermore, they can be configured to only allow certain
    classes of outgoing call, and can be made to log all calls. These are more expensive
    than just slapping a 56k modem on one''s office PC. However, while it it can be
    hard to resist the siren song of someone who just wants to pop a modem on their
    serial port to do this or that bulletin board, try to do so. It is always better
    to offer these services in a structured, well-designed, audited way.


    Some network services are implicitly insecure. Email, for example, is plain text,
    which can be read by any administrative user on any machine it passes through
    its way across the Internet. Make sure your users understand what things are implicitly
    insecure, and the implications of this. Make sure your users know what isn''t
    confidential. This applies even more if you are deliberately insecure. For example,
    you may find it necessary to monitor keystrokes, email messages, and/or telephone
    calls. Unless you''d like your company to be at the center of a huge privacy scandal,
    you''ll need to have a clear policy in place what you are monitoring. You should
    also state how the data will be used, who can access it, and how it will be protected
    from unauthorized access.


    So, to summarize:


    Home offices should make sure that visitors don''t plug laptops and other devices
    into their network. If you use modems for dial-out, make sure the modems won''t
    pick up the phone if someone dials in. If you use modems for dial-in, make sure
    there''s decent authentication on the line. Don''t assume that an unlisted number
    adds any degree of security. There are hundreds of free programs that will test
    every number in an exchange for a modem. They''re called war dialers, and they''re
    very effective.'
