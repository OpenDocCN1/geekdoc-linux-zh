  md: '# First Match Wins


    The order in which rules are added to a chain is important. To understand this,
    consider the ways chains are evaluated. A packet enters the chain and is tested
    against the rules in sequence until it matches the conditions of one of them.
    That rule has a target, which will specify the acceptance or refusal of that packet.
    Chain processing stops at that point, whether the packet was accepted or refused.
    Let us reiterate, because this is very important: Once a packet has matched a
    rule, it goes no further through that chain. The target of the matched packet
    determines the fate of the matched packet. End of rule.


    # NOTE


    A rule with no target does not stop chain processing. It''s the act of jumping
    to a target, not merely matching the rule, that stops chain processing.


    How does this affect you? Suppose, for example, you wish to refuse all traffic
    from a particular IP address, save Web traffic you wish to permit. There is no
    point in writing the refuse rule first, then the accept rule, since all packets
    from that IP address will match the first rule and be refused. Web packets will
    never get to the rule that lets in; they will be refused along with the rest.


    Specific rules must come before general rules. To put it another way, exceptions
    must precede rules. English often has this the other way around: The rule is stated,
    the exception. When in English is written "none of my cats are allowed inside
    my house, except the grey one" must be written for ipchains as two rules: "the
    grey cat may enter my house" followed by "no cats may enter my house."


    The second rule did not have to make an explicit exception for the grey cat. She
    has already matched the first rule and been admitted; chain processing stopped
    for her after one rule. All my other cats pass through one rule, match rule two,
    and get unceremoniously out the back door. It is with packets as it is with cats,
    but quieter.


    # User-Defined Chains


    As we mentioned earlier, you can define your own chains and give them rules just
    as you would give rules to the three built-in chains (input, output, and forward).
    You just give your chains different names.


    The definition and invocation of user-defined chains are easy. We''ll cover how
    to define them later in the chapter. Once you have defined a chain, you can invoke
    it as you would any other target. If you have defined a chain called'
