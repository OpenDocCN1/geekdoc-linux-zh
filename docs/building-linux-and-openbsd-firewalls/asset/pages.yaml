  md: '# Summary


    Now, you''ve got a running production firewall. Your network is humming along
    gently. By and large, your users can get to the Internet, which by and large can''t
    get to them. What is there left to worry about?


    Well, intrusion detection would be a good idea. Don''t think for a second that
    you''ve finished securing the network without it. We''re going to look at monitoring
    and checking your network in the next chapter. We''ll also come to terms with
    the possibility of a compromise by discussing what to do if you believe you''ve
    been hacked. Then you can go to sleep, peacefully.'
