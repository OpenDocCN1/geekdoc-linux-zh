  md: '# Try Out a Rule or Two


    We''re going to try out a few rules, just to get you familiar with ipchains. It''s
    easier to appreciate what you''re doing if you can see the effect that it''s having.
    Seeing the effects is a lot easier if you have another computer to test it.


    We assume that you have at least one other machine on your internal network. When
    we want you to try something on that machine, we''ll refer to it as the test machine.
    You will need to know the IP addresses of both the test machine and the firewall.
    You will also need to move physically to the test machine to try things from it—you
    are unlikely to be able to keep a network connection up through most of these
    tests.


    Let''s try refusing all packets of a certain type, say all TCP packets:


    ```

    ipchains -A input -p tcp -j DENY

    ```


    This is the first rule we have written. We used the ''-A'' flag, which appends
    the rule we''re writing to the existing rules already on that chain. There are
    no rules on that chain, since we flushed the chain in the previous section. This
    allows us to define new rule. The condition in this case is specified by the ''-p''
    flag, which specifies a protocol type. We used ''tcp''; we could have used ''udp'',
    or ''icmp'', or ''all''meaning any protocol. The ''-j'' flag specifies the target
    for the rule, which in this case is long and hairy any rule is, at some point
    in the ipchains command you''ll see the ''-j'' flag preceding the target (unless
    the rule has no target mentioned earlier).


    To see what this has done, go to the test machine. issue the ''telnet ip.address.of.firewall''
    from a command prompt. You should find that telnet just sits, sending requests
    for a connection, receiving no answer. Since we used the DENY target, the firewall
    is silently dropping those packets on the ground. To see the difference between
    DENY and REJECT, try:


    ```

    ipchains -F input

    ipchains -A input -p tcp -j REJECT

    ```


    The first line flushes the input, to get rid of the DENY rule we just defined.
    If we didn''t do this, the new rule would be appended after the DENY rule, and
    because the conditions are the same for both rules (-p tcp), the first rule would
    match any TCP packets, and we would never see the REJECT target in action. The
    second line defines our new rule with the same conditions as in our original rule,
    but with a different target.'
  merge: -1
