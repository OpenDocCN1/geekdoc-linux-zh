- img_proc: true
  md: '# NOTE


    If your system is set up to boot from CD-ROM in preference to the hard disc, the
    computer is going to start trying to reinstall the OS again. The right thing would
    be to take the CD out of the drive before you reboot, but most modern CD drives
    allow the operating system to lock the drive shut (in other words, disable the
    eject button) if the OS considers it necessary. Since that is necessary when the
    CD is mounted, it has been throughout the installation, it is unlikely that you
    will be able to eject the CD before rebooting. So, if your computer tries to reboot
    off the CD, and it starts looking like you you''re about to reinstall the OS,
    don''t panic. Press the reset button on your computer, and then hold the eject
    button down on your CD-ROM. As soon as the computer has reinitialized the CD-ROM
    drive, the drive should obey the button and pop the CD tray out. Remove the CD,
    and close the drive.


    You might want to consider tweaking the bios so that it doesn''t boot off the
    CD-ROM. This isn''t a bad idea, as you may be using the CD later on install packages
    and might forget about the CD''s presence. If the system reboots for any reason,
    you could be stuck on the install screen for a while.


    # Basic System Configuration


    Just because your machine boots to a login prompt doesn''t mean that it''s of
    much use at the moment. Sorry to break it to you, but you''re far from setting
    up your OpenBSD system. You''ve got a lot of work ahead of you in order to configure
    it properly. There are numerous tasks you''ll need to perform to configure and
    tune the system for use as a firewall. The good news is that we''ll keep walking
    you through the process. Our first configuration task will involve properly setting
    up your network cards and/or a modem.


    Before you do anything, we''re going to suggest taking a good look at the afterboot
    man page. Type afterboot<CR> at a command prompt. Don''t worry if you don''t understand
    everything—we''re actually going to cover many of these topics in the following
    pages. Reading afterboot now will help your understanding of the rest of this
    chapter.


    # Configuring Network Cards


    If you''re creating a DMZ you''ll need to go beyond the network configuration
    performed during the installation. Even if you aren''t building a DMZ, you''ll
    have occasion to alter the settings of your network cards as your network evolves.
    This section will describe how to use the "ifconfig" program as well as describing
    the few critical configuration files needed to set up your network.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# # ifconfig Tool


    First lets work with ifconfig. This program is used to make real-time changes
    to your interface settings. It''s very useful for diagnostics and initial configuration.
    It''s important to note that ifconfig doesn''t save the changes you make, but
    we''ll get to that in a little bit.


    Log in as root and type `ifconfig -a` and hit Enter. This tells ifconfig to print
    out a status report on the current configuration. You should see a list of each
    network interface in your system, a number of which will look very unfamiliar
    to you. Don''t worry about those—just look for your ethernet adapters. If you
    don''t see an adapter you know is in the machine, your system isn''t recognizing
    the adapter. You should make sure the adapter is properly seated in the PCI slot
    and that the adapter is supported by OpenBSD.


    There are two other status options for ifconfig: `-A` does the same as `-a`, but
    also prints alias information for each interface. `-Am` and `-am` cause the list
    of potential media options for each card to be printed out. These are options
    such as `10baseTX`, `10baseT`, and `autoselect`.


    Of course, the real purpose of ifconfig is to actually tweak your card settings.
    The format for the ifconfig command is:


    ```

    ifconfig <interface> <address family> <address> <parameters>`

    ```


    where `<interface>` is the name of the interface you want to configure. If your
    network card is named pn0 when you typed `ifconfig -a`, then that''s your interface
    name.


    The rest of the parameters are somewhat optional, depending on what you''re trying
    to do (throughout this book, optional arguments are surrounded by `[brackets]`).
    For example, if you''re trying to turn off an interface, you can skip the `<address
    family>` and `<address>` parameters and simply type:


    ```

    ifconfig eth0 down

    ```


    <address family> describes the type of network addressing structure on your network.
    For us, we''re going to use the value `inet`, which we-connecting to the Internet.
    Valid other options include `ipx`, `talk` (appletalk), and a few more obscure
    network types. `<address>` is the IP address you wish to assign to the interface.


    If you provide just the address to ifconfig, it will simply set the interface
    to the given address. If you make a mistake, run ifconfig again with the correct
    address and the old one will be overwritten.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The fun happens within the <parameters> part. There are many different parameters
    that you can set for a given interface. Here''s a list of the most important ones.
    You can figure out the rest by looking at the man page for ifconfig.


    **Down.** Turns the interface off. A useful way of cutting the cable that can
    be done remotely. Just remember—if you down the interface that you''re connecting
    on, you''ll lose your connection. Unless you can get into another interface, you''ll
    have to bring the interface back up from the console.


    **Up.** Turns the interface back on again.


    **Netmask.** This keyword is followed by the network mask, which can be expressed
    in dotted quad notation (255.255.255.0) or as a single hexadecimal (0xffffff).


    **Alias.** Allows you to directly alias addresses for the interface. For example,
    if the interface p0 is currently configured with the address 10.9.8.7 and you
    would like the interface to accept packets destined for both 10.9.8.7 and 10.9.8.6,
    you could use the command:


    ```

    ifconfig eth0 10.9.8.6

    ```


    **delete.** Removes the network address specified from the given interface. If
    you erroneously add an alias to an interface you can use this to remove the bad
    aliases.


    **Media.** Many cards today are 10/100 capable. This means that they can function
    as 10baseT and 100baseTX cards. Some cards can also handle other network technologies
    as 10base2, although you should avoid having anything to do with those older technologies,
    if at all possible. Figure out what media is supported by your card, do an ‘ifconfig
    -am’.


    **Mediaopts.** Lets you switch between ‘full-duplex’ and ‘half-duplex’ modes if
    your card supports it. Don''t play with this setting unless you know what you''re
    doing; the results can be unpredictable.


    # Configuration Files


    As we mentioned up front, ''ifconfig'' does not save your changes. It''s good
    for making runtime alterations, but when you reboot the computer all of your changes
    will be lost. In order to make your changes permanent, you''ll need to place them
    in configuration files that are located in the /etc directory. These files are
    named ''hostname.xxx'' where xxx is the name of a network adapter. There should
    be one file for each adapter in your system. The format of this file is:


    ```

    <address family> <ipaddress> <netmask> <broadcast address> <parameters>

    [dest <destination address>]

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Which Interface Is Which–Revisited


    Once you''ve configured your interfaces with their appropriate addresses, you''ll
    want to make sure you know which card physically corresponds to which interface.
    ‘ifconfig -a’ used to give a status line that made it really easy to figure this
    out, but now it''s gone. There''s another way to do it.


    Connect one of your network cards to a live computer on it that will respond to
    a ‘ping’ request. For each interface, execute the following command:

    ping -l 10.0.0.1 10.0.0.2


    where ‘10.0.0.1’ should be replaced with the address you give the interface and
    10.0.0.2 should be replaced with the IP address of a machine that is accessible
    from that network. If you get a response, you''ve just matched a card to an interface.
    If you don''t get a response, switch the ethernet cable into the next card and
    try it again.


    If this interface is configured through DHCP, the file should contain only the
    word ‘dhcp’. Otherwise, this file controls all of the interface attributes that
    can be set with the program ifconfig. In fact, this file is read at startup (when
    the script ‘/etc/netstart’ is executed), and the contents are passed almost verbatim
    to the ifconfig program.


    # Editing Files


    If you''ve never edited files in a Unix environment, you''re in for a bit of a
    shock. There''s no “notepad” equivalent for the Unix command line. Instead, there''s
    ‘vi,’ a powerful text-editing tool that is easily the most unintuitive program
    ever created by man. Don''t believe us? Type “vi” at a command prompt and hit
    return. In two seconds, the screen will fill with a bunch of ‘~’ symbols. You’re
    now in. Okay, now try and quit the program. If you can figure this out within
    10 minutes, you’re doing better than any of the authors did the first time they
    encountered it. We’ll explain how to perform some basic editing tasks (such as
    quitting) in Chapter 12.


    You should be aware that the syntax of this file is not as flexible as the ifconfig
    syntax. You must give an address family, an address, a netmask, and a broadcast
    address before specifying extras. For the broadcast address, it often easiest
    to put the value ‘NONE’, unless you have a specific reason to do otherwise. By
    using ‘NONE’, the program simply defaults to the broadcast address implied by
    the IP address and the netmask. This should be correct unless you’re doing something
    really weird. All of the other fields correspond directly to their ‘ifconfig’
    equivalents.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'You can force the system to re-read the hostname.xxx files by running the

    command:


    ```

    sh /etc/netstart

    ```


    While ''ifconfig'' is useful for setting up interfaces, it doesn''t tell the OS
    how to get

    packets from one interface to another. There is another program called ''route''

    which used to alter the kernel''s packet routing tables. While it''s helpful to\know
    a bit about ''route'', we actually don''t need to worry about it here, because

    the proper commands are automatically executed by the /etc/netstart/

    ''newifailases'' scripts. We suggest looking at the man page for ''route'' some

    when your firewall is finished, but it''s not needed for today.


    There''s one ''ifconfig'' parameter that won''t work in the hostname.xxx file:

    ''alias''. In order to set persistent aliases you''ll need to edit the /etc/ifaliases

    once Once. this file is read during start up and the contents are passed to

    the ''ifconfig'' program. The format of this file is very simple. Each alias is
    a

    separate line; there can be as many lines as needed. The format of each line is:


    ```

    <interface> <address> <netmask>

    ```


    All three values must be present. If you have multiple aliases for an interface,

    place one alias on each line. The ''netstart'' script will not activate the changes
    in

    this file. Instead, you should use the script we called ''newifailases.''

    Download the script from the companion Web site (or just type it into your

    avorite editor). If you don''t use our script, there are two other ways to get
    there

    alias to activate: 1) reboot and use the ''ifconfig'' program with the ''alias''

    parameter.


    Another important file is /etc/hosts. This file contains mappings of IP

    addresses to hostnames. The domain resolver often checks this file first

    before checking with the DNS system. It''s a good idea to have entries for your

    firewall system here. A typical file might look like this:


    ```

    127.0.0.1           localhost

    10.0.0.1             firewall-internal    firewall-internal.mydomain.com

    101.112.131.4       firewall-external    firewall-external.mydomain.com

    ```


    The first line sure that the system knows what to do with the loopback

    address. The second line handles the internal network interface, and the third

    line handles the external interface. On the second and third line, we specify
    the

    internal and external hostnames, followed by the host + domain name. All

    three are different ways of referring to the same machine.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Knowing about these files will enable you to configure any combination of interfaces
    and networks. If one of the interfaces is connected directly to the Internet via
    a dedicated line, then you''ll be able to skip the next section and move on to
    the section titled *Fine-Tuning the System*. Otherwise, keep reading to figure
    out how to get on the net with a modem.


    # # Connecting to the Internet via Modem


    If you don''t have a dedicated Internet connection through some device such as
    a T1 multiplexer, an external ISDN modem, or some sort of DSL unit, then you''ll
    probably need to connect to the net with a modem. This is far less trivial a task
    than connecting via a network card, because there are numerous additional pieces
    in the puzzle. We''ll need to deal with determining the port the modem is on,
    creating a dialup script, configuring the modem to adapt your ISP, and so forth.
    If your IP address is dynamically determined by ISP, then you''ll have even more
    issues to deal with.


    # # Finding Your Modem


    The first thing to do is work out which port the modem is on. If you don''t find
    this challenging, please skip to the next section. It occurred to us that we''ve
    hardly ever been able to look at the back of a PC and know which serial port is.
    While it''s true that some machines externally label the ports as “1” and “2,”
    these labels don''t necessarily correspond with the internal designations. Because
    the black of identification is rather badly documented elsewhere, we''ll dwell
    on it a little here.


    There are only two serial ports on most modern PCs (don''t confuse them with the
    parallel, or LPT, and they are accessed through the device files /dev/cu00 and
    /dev/cua01, which somewhatewhat correspond to the PC concept of COM1 and COM2).
    If your modem''s connected to a serial port on the back of your firewall, it can
    be talked through /dev/cu00 or /dev/cu01.


    Theoretically, there should be some way of determining which is COM1 and which
    is COM2, looking at the motherboard. But this isn''t a great guide, because BIOS
    and OS issues move the ports around. For example, if you happen to have a serial
    card of some sort COM1 be on the card while COM2 is one of the two ports and the
    other is disabled.


    The easiest to locate the modem is to plug it into one of the two serial ports.
    Then at a prompt type "ppp" followed by <CR>. This brings us into the interactive
    mode of the ppp program. We''ll be in and out of this mode many times over the
    next pages.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 232 BUILDING LINUX AND OPENBSD FIREWALLS


    Before doing anything, look at the modem. Note which lights are on and which are
    off. Now, at the prompt, type:


    ```

    set device /dev/cua00<CR>

    term<CR>

    ```


    If the program hangs for a while, don''t panic. After some time of two things
    happen: 1) you get another prompt or 2) one or more new status lights illuminate
    on your modem, the ppp program tells you to type “?” for help and if the former
    occurs it seems to hang. or simply means your modem is on another device. If the
    latter occurs, type the following:


    ```

    ATH1<CR>

    ```


    You won''t see anything on screen as you type, but when you hit return you should
    hear a dialtone (assuming you have the modem plugged into a live phone line).
    Even if you don''t hear anything, you should see more status lights on your modem
    than before. That''s a good sign. It means your modem was found on device cua00.
    Now''s turn off that annoying dialtone:


    ```

    ATH0<CR>

    ```


    If the modem doesn''t work, you''ll need to type:


    ```

    set device /dev/cua01

    term

    ```


    and try again. If that doesn''t work, then you should switch the physical port
    in back and start again from the top. You can also try the following devices:
    /dev/cua00, /dev/cua1, /dev/pcc00, and /dev/pcc01. Just keep repeating the process
    by changing the device until you find the modem.


    If things still aren''t working, check the cable. Connecting the modem to the
    computer is often another source of problems. Assuming the ends are the right
    size and gender to connect your modem to your computer, there are two types of
    modem cables: one is intended to connect modems to computers, the other is intended
    to connect computers to computers (or modems to modems). If you have the wrong
    type (they''re very difficult to tell apart), no signals will get. If you suspect
    that might be the case, a device called a null modem adapter, which plugs into
    one end of either type of cable and turns into the other, can be extremely helpful
    in testing. They don''t cost much, and most computer stores should carry them.
    You might have a defective cable or a cable that has the right gender but is meant
    for something else entirely. (One of the authors is a router that uses a special'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'serial cable for management spent while debugging the modem before realizing
    that he had the wrong cable.)


    # After You''ve Found the Modem


    Once you''ve worked out which port the modem is on, it will save a lot of time
    in the future if you put in a link—much like the mouse link mentioned above—to
    point to the modem, and refer to the modem through that.


    If your modem turned out to be /dev/cua00, issue the following commands:


    ```

    cd /dev

    ln -s cua00 modem

    ```


    If the modem turned out to be /dev/cua01, change the cua00 in the preceding command
    to link it, every time you refer to "/dev/modem", you''ll automatically be talking
    to your modem. The rest of the modem section assumes you have done this.


    # Gettin'' Jiggy with PPP (Point-to-Point Protocol)


    Given that your modem and computer are talking to each other, now we have to get
    them talking to the Internet. This involves transmitting IP (Internet Protocol)
    signals down a serial cable. In the early days of the Internet, the first protocol
    to try to do this was called SLIP (Serial Line Internet Protocol). This limitations
    was replaced nearly everywhere with PPP, the Point-to-Point Protocol.


    PPP is what you will likely be running over your modem, between your OpenBSD box
    and your ISP, in order to talk to the Internet. A full discussion on all the aspects
    of PPP is beyond the scope of this book, and moreover it is unnecessary, because
    you have just installed an excellent manual on the subject. If you type "man ppp-crs-"
    at a command prompt, you will find an excellent document that discusses the theory,
    application, and configuration of PPP. This document, along with every other man
    page, is available online from www.openbsd.org/cgi-bin/man.


    Nonetheless, we won''t leave you to figure it all out on your own. The initial
    configuration of PPP can be a bit confusing, so we will walk you through it here.
    Before we do, we need to make an important point: The ppp program in OpenBSD is
    a very complex piece of software. It goes far more than its Linux counterpart.
    For example, it includes the ability to dial-on-demand, which requires an additional
    program in Linux (dial). It''s also capable of doing its own packet filtering,
    separate from the filtering we''ll be talking about in the next chapter (we do
    not recommend using PPP''s filtering system—it just means'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    you''ll have two sets of rules to keep in sync, and that can make your life a
    living hell you forget to tweak one or the other. This means that you won''t find
    too much additional help on PPP outside of the BSD community, because Linux users
    have a much simpler program.


    The first step is to dial your ISP from the ppp program. We need to figure out
    the login procedure for your ISP. Hopefully this will be fairly straightforward.
    If it isn''t, we suggest changing your ISP or calling your ISP''s tech support
    and asking for help. Often changing ISPs is faster and easier. We use MindSpring,
    which happens to be compatible with the default settings in the ppp.conf file.


    Start the ppp program by typing "ppp" at the command line. Once you''re in the
    program, type:


    ```

    set device dev modem

    term

    ```


    This will put you in terminal mode. To connect with your ISP, type:


    ```

    ATHIMDT1234567

    ```


    Replace the 1234567 with your ISP phone number and hit <CR>.


    If your modem is connected correctly, after a few seconds you''ll hear a bunch
    of beeping, followed by the sound of a pig in a blender on a pogo stick. This
    is a good, albeit sick, sound. Shortly the blender will stop and you should see
    something like:


    ```

    CONNECT 9600

    Welcome to MindSpring Dialup Service

    arc-la.bos login:

    ```


    If the prompt doesn''t say "login" then write down exactly what it says (maybe
    it says "username"). Type in your username. For MindSpring, it''s your emailmail
    address. After hitting <CR> it will say:


    Password:


    Once again, if this says something other than "password" you''ll need to write
    it down. Type in your password and hit <CR>. If both username and password were
    correct and active, you''ll see something like this:


    ```

    Packet mode enabled: PPP session from 168.121.1.1 to 165.247.33.16

    beginning...

    ~#A!{}}}}} 8)}S%n0}%%& %&&|~*-5]-

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'This means you''ve successfully established a PPP connection. Exit the session
    by typing “~.” followed by “close<CR>” at the command prompt. If you had trouble
    connecting, or it didn''t ask for anything remotely like a login and password,
    you probably have an ISP that uses a different authentication method. The ppp
    program can connect to these types of ISPs, but we don''t cover the process in
    this chapter. The ppp man page and the ppp.conf.sample file give a detailed explanation
    of this process. If you can''t figure it out, try switching ISPs.


    Now let''s create a script to automate the connection process. Go into your /etc/ppp
    directory via the command:


    ```

    cd /etc/ppp

    ```


    In this directory there are numerous sample configuration files. These files can
    be easily turned into real configuration files by removing the .sample extension
    from them. What we''re going to do is copy one of the files, removing the .extension
    in the process. We''ll then edit the copied file and convert it into a real file.
    To do this, type:


    ```

    cp ppp.conf.sample ppp.conf

