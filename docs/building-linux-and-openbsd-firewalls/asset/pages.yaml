  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    We''re going to wreak a little havoc at the zoo. Place the cursor over the p in
    pet.

    Then type:


    ```

    d?look

    ```


    The resulting sentence will read:


    ```

    Feel free to pet the animals.

    ```


    One thing to note: The backwards search will match the first occurrence of the
    characters you type. For example, if you typed:


    ```

    d?lo

    ```


    above, the resulting sentence would be a bit confusing:


    ```

    Feel free to look. Unless you want to pet the animals.

    ```


    This is because the lo matches lose before it matches look (remember, we were
    searching backwards).


    # How Do I Quit?


    Most Unix applications will respond to either CTRL-C as a quit signal or CTRL-Z
    as a signal to suspend the program and escape to the shell. In vi, CTRL-C doesn''t
    ever work, and CTRL-Z only works in the command mode (and then, it doesn''t quit
    vi, it just pushes it into the background). Almost everyone who has used vi has
    some recollection of their first encounter with: "I banged on a lot of keys before
    anything appeared on screen. Then I couldn''t quit, let alone save what I had
    typed, and I couldn''t escape to the shell or suspend the program, I turned off
    the machine."


    What happened is that the initial keyboard binding shifted the vi system into
    the editing mode. Once in editing mode, control sequences are interpreted as literals,
    and get placed in the text file. Thus, CTRL-Z or CTRL-C just puts some funny characters
    on the screen. Hitting the key has no visible effect, and typing "quit" results
    in the letter ''q'' appearing on the screen (the ''i'' in "quit" puts the system
    in insert mode, and the ''t'' is inserted into the document). The lucky ones get
    CTRL-Z to suspend vi, and then either start reading the man page or use the kill
    command to terminate the suspended process.


    The right way to quit is the incredibly obvious command :q. That right—a colon
    before the q. Make sure you hit a few times first. Of course, it isn''t straightforward.
    If you''ve accidentally made any changes or typed any-'
