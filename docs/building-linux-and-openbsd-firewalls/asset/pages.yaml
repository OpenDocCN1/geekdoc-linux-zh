  md: '# Rlogin


    Rlogin and rsh (the noninteractive version of rlogin) allow you to avoid sending
    a password across a network by pre-instructing the remote system to allow any
    requests that claim to come from a particular user at a particular IP address.
    Needless to say, forging the username is trivial, and forging the IP address is
    just as easy. The r-command servers (rexec, rlogind, rshd (which also provides
    RCP service), and rwhod) run on TCP ports 512, 513, 514, and UDP port 513, respectively.
    None of these services should be allowed to enter your network.


    # How to Make Rlogin Secure


    Don''t bother trying. Use ssh. Ssh does everything rlogin does and more. Making
    rlogin secure would involve using ssh anyway, so just keep reading and pretend
    that rlogin doesn''t exist.


    # ssh


    ssh is an application whose time had definitely come. It descended on the world
    from Helsinki University of Technology in Finland, and answered the prayers of
    many administrator. In its basic form, it uses encryption to protect an interactive
    session between two computers. The protection ensures that: You are talking to
    the same machine you talked to last time you accessed that IP address; no one
    is eavesdropping on your conversation; no one may hijack your conversation midstream.
    The protection is not useful if either the local or the remote machine have been
    compromised; it protects the channel, not the endpoints. The ssh server runs on
    TCP port 22.


    As discussed in the earlier decursion on tunneling, ssh can do more than provide
    a secure shell. Having established an ssh connection to a remote server, you can
    (configuration permitting) tunnel connections from your local machine to arbitrary
    ports on the remote server (the POP port, for example). If you invest some time
    in configuration, all TCP conversations between you and the remote server can
    benefit from ssh''s protection. UDP tunneling is unfortunately not part of the
    standard ssh distribution, but there''s no reason why this feature couldn''t be
    built into a GPL''d version of ssh by some kind individuals (hint hint).


    Configuration of an ssh server is outside the scope of this book. The reference
    implementation is available from SSH Communications Security (www.ssh.fi).'
