  md: 'If your hard drive was empty prior to this install, you will most likely have
    a ‘c’ partition and an ‘a’ partition. The ‘c’ partition should never be touched—it
    spans the total size of the disk. The ‘a’ partition should never be deleted, so
    we can re-size it properly. To do this, type ‘d’ and <CR>. ‘d’ is the delete partition
    command. ‘d a says to delete partition ‘a’.


    Next we''ll create real partitions. We''re going to create only two partitions—a
    root that spans most of the disk, and a swap partition of 200 megs. You could
    get away with less, but there''s really no point unless you''re using a very small
    hard drive. In general, you should have twice as much swap space as you have RAM.


    When adding a partition, the installer will ask for the partition size. There
    are two ways to specify this: 1 in megabytes, or 2 in sectors. Specifying megabytes
    is slightly easier, but there are some funny issues with drive sizing that we
    discuss in the sidebar. We''re going to show you how to do it both ways, dealing
    with sectors is something with which you should be familiar.


    # When Is 1000 Equal to 1024?


    The drive size problem stems from the fact that drive manufacturers often calculate
    their drive size assuming that 1 meg is equal to 1000 kilobytes (10³), instead
    of 1024 kilobytes (2¹⁰). Since computers work off of 2, the latter calculation
    is correct.


    The result of this is that the drives appear slightly larger. This difference
    normally is not too relevant, but the current trend in storage is toward entry-level
    drives with upwards of 4 gigs. At those sizes, the few extras can add up. Here''s
    an example of what we mean:


    If you have a 4 gig drive, you might think you have 4096 megs (4,294,967 bytes
    of space). In reality you''re getting triple whamied. If you''re a drive manufacturer
    is playing the game, they probably have not defined a meg as 1000 kilobytes, but
    also a kilobytes as 1000 bytes, and a gig as also 1000 megs. The short of it is
    that you''re losing 294,967,296 bytes (281 megs).


    If you''re going to specify the partition sizes in megabytes, you''ll need to
    create the swap partition first. If you don''t, then you need to know the exact
    size of your drive beside the problem, which might not leave enough room for swap.
    It''s far easier to start with the swap partition, which is a known size (200
    megs) and then use the rest of the drive for the main partition.


    Type “a b” and <CR>. The ‘a’ adds a new partition and the ‘b’ tells it to create
    partition ‘b’. The installer will ask you for an offset value. The offset'
