  md: '# Configuring the Firewall under OpenBSD


    ```

    block in on eth0 proto tcp call all head 100

    block in on eth0 proto udp all head 101

    pass in from any to any port = 22 group 100

    ```


    In this example, we create a group (100) from all TCP packets on eth0. We create
    a second group for all UDP packets on eth0. The third line says to pass in any
    connections on any port 22 (ssh) but only for those packets that are part of group
    100. This means the TCP packets, but not the UDP packets (which are part of group
    101). The example could also have been written as:


    ```

    block in on eth0 proto tcp/udp all

    pass in on eth0 proto tcp from any to port = 22

    ```


    Although rule groups have the potential to make certain rule writing more elegant,
    it can increase your confusion levels dramatically. We''d suggest avoiding this
    syntax unless your filtering rules are already complex and you need to achieve
    high degrees of optimization.


    # IPNAT


    Network Address Translation is accomplished via a separate program called ipnat.
    You''ll store your NAT code in a separate script file /etc/ipnat.rules. The rule
    structure for ipnat is similar to, but much simpler than, ipf. There are only
    two actions that can be performed and very few variations on the matching criteria.
    The main action we''re concerned with is the map action. We''ll also touch on
    the rdr action.


    # map


    The map action is used to cause packets from an internal address to appear to
    come from an external address.


    If the internal address + netmask specifies multiple internal addresses, then
    all of the addresses will be mapped to the given external address. Likewise, the
    external address can refer to multiple addresses.


    If there are an equal number of internal and external addresses, there will be
    a 1-to-1 mapping between internal and external addresses. If there are more internal
    addresses, things can get complicated. See the portmapping section for more information.


    The general format for the map action is:


    ```

    map [interface] [int_ip+mask] -> [ext_ip+mask] <portmapping>

    ```'
