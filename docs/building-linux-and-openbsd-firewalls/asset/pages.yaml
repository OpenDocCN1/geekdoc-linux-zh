    Once you''ve established an active connection, it''s time to finish automating
    the connection process. The ppp program has an option called "auto", which causes
    ppp to run in the background and automatically dial up your ISP the moment a program
    tries to use the Internet.


    The auto option is great for networks where you''re only concerned about providing
    outbound account on demand, but it''s not good for servers. This because auto
    responds to outbound connections only—there''s no way for it to know if someone
    is trying to reach your machine if the PPP connection is down. In, due to the
    very nature of PPP, the inbound packet will never reach your machine. Instead,
    the ISP will send an ICMP unreachable error whenever someone tries to access your
    IP address. If you''re running important servers on a fixed IP address, you''ll
    want to make sure your PPP connection is always active. You don''t want a poor
    connection to keep your servers off for extended periods of time. Luckily, there''s
    an option for this exact situation "dial". This option ensures that the PPP connection
    is always active—if the link goes down it immediately brings it back again.


    We need to ensure the ppp program is run with either the auto or the ddial option
    whenever the computer boots. To do this, add the following line to your /etc/rc.local
    file:


    ```

