    not use any of these except MASQ (and you might not use that, either).


    MASQ is used only in the forward chain. It is active only if the kernel has been
    configured with CONFIG_IP_MASQUERADE defined (this is true for the stock Red Hat
    6 kernel; if you rebuild the kernel and use masquerading, you will need to make
    sure this parameter stays defined). If the target of a rule is MASQ packets matching
    the rule will be masqueraded if they had originated from the interface by which
