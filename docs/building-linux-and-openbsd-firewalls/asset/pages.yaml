    awaiting possible requests or replies. This is important, because the very nature
    of ARP creates some security risks, which we''ll talk about momentarily.


    The sidekick to ARP is the Reverse Address Resolution Protocol (RARP). Some networks
    have machines that are diskless terminals and do not contain any means of storing
    their IP addresses. These machines read all of their boot information from the
    network. But in order to form packets to send out, they need to know their IP
    address. RARP allows a diskless machine to ask RARP servers for an IP address.


