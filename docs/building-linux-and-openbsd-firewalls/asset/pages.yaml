    The BSD family has been released under what is now called the Berkeley license.

    Historically, the Berkeley license came first—it was the license that BSD was
    initially released under. Programmers who developed software for the BSD platform
    also chose to use the Berkeley license for their software. It is a short license
    that is easy to understand. The article “Choosing a Software License” in the April
