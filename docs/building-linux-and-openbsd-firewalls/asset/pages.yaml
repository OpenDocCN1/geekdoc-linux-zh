    We are assuming that you have a fully assembled computer with a blank or completely
    sacrificial hard drive installed. To the best of your knowledge, this computer
    is in working order. The preceding two sentences describe your situation, you''re
    ready to begin the installation. If not, we''re incredibly proud of you for deciding
    to read all the instructions first, before doing anything irreversible.


    Your life will be much easier if your machine is capable of booting off the CD-ROM
    drive. This is due to the nature of the installer program. The installer doesn''t
