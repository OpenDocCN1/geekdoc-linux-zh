    # TCP Vulnerabilities


    The LAND attack is one of the simplest TCP attacks: A TCP packet is created where
    the source and destination IP address and port are set to the same values. The
    address must be the address of the target machine and the port must have an active
    service running. The LAND attack has the remarkable effect of rebooting or otherwise
    killing numerous machines!


    Setting the source IP address to the target machine''s address requires pretending
    that your machine is the target machine for the purposes of constructing the packet.
    This is accomplished by “spoofing” the target machine. As we mentioned earlier
    in the chapter, a spoofed packet appears to be coming from some location other
    than its true origin.


    The reason for the LAND attack''s effectiveness is rooted in the reliable nature
    of TCP. In order to make connections reliable, TCP performs two critical tasks.
    The first is session initialization. A process known as a three-way handshake
    exchanges initialization data between the client and the server. This establishes
    a reference point for all future communications, known as the sequence number.
    The sequence number helps TCP reorder packets and determine if packets have been
    lost. The other critical task involves sending acknowledgments with each packet
    received. If the acknowledgment isn''t received within a certain amount of time,
    the packet is retransmitted.


    The LAND attack takes advantage of the way in which acknowledgment occurs during
    the initial connection establishment. The key to the attack is that the server
    side and the client side each has its initial sequence numbers. For example, the
    server''s sequence number might be 1, 2, 3, 4... while the client''s sequence
    is 1000,1001,1002, etc. For every transmission, the receiving sends an acknowledgment
    that contains the next sequence number expected from the transmitting application.


    The attack starts with the attacker sending a random sequence number as the first
    handshake. The target computer says, okay, here''s my random sequence number.
    I acknowledge your number by incrementing it and sending it back to you. This
    is the second handshake. If this was a normal situation, the attacker''s machine
    would be listening for the number and'
