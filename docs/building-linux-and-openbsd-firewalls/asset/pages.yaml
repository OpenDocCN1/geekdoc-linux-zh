    # Keeping Your Machine Secure


    We''ll talk about this in much greater depth in Chapter 10, "Configuring Firewall"
    but there are some OpenBSD specific issues we need to address now.


    One of the key strengths of OpenBSD is its security audit process. Once a piece
    of software has passed through this process a few times, it''s important to get
    future patches and upgrades from the OpenBSD site directly; otherwise, you risk
    introducing code that hasn''t been audited.


    # Apache


    One notable exception to this rule is Apache. OpenBSD now includes Apache as part
    of its default distribution. The version of Apache that comes with OpenBSD has
    not been fully audited. Therefore, you should consider the most recent stable
    version of apache to be the most secure. If a security hole is found in apache
    and posted at apache.org, then you should upgrade your version of apache. This
    has absolutely no relevance to your firewall, since you won''t be running a Web
    server on your firewall. But after going through this chapter, you might decide
    to run OpenBSD on a few other machines in your network (such as your Web server).
    In that case, this will be very relevant.


    You should check the OpenBSD site at least once for security updates. It''s also
    useful to check the changelog between version 2.5 and whatever is current. This
    will give you some idea of what will be in the next release.


    In Chapter 10 we talk about stripping down the firewall, removing anything that
    is unnecessary. In OpenBSD, this is not nearly easy as it is with Red Linux. The
    problem is that most of the tools on the system were installed from a disk set.
    These are tarballs that are unwound in the "/" directory. This means that files
    that'
