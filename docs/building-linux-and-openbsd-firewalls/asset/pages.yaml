  md: 'Hat Installation Guide (p. 91), and let''s finish up the installation. Chapter
    5 deals with other forms of install the “Local CD-ROM” and “Hard drive” varieties.


    # Chapter 6


    Red Hat''s Chapter 6 discusses how to complete the Red Hat installation and reboot
    your system into its new configuration. This will conclude the Red Hat-managed
    phase of the firewall installation. We''ll then proceed to our phase of the installation.


    # Section 6.1


    At this point, you need to configure a mouse. Assuming you have a supported one-button
    mouse and it''s attached, the system should find it. If you only have a two-button
    mouse, you might wish to check “Emulate 3 Buttons” before selecting OK and hitting
    <CR>.


    # Section 6.2


    The networking configuration refers to your ethernet card, not to dial-up networking
    you might be using. If you''re going to be using a two (or more) ethernet card
    configurations, the discussion refers to the interior interface of the firewall,
    rather than the interface to the DMZ and/or the interface to the outside world.
    We''ll be putting the other ethernet cards in later.


    If you''re using private ethernet addresses with a view to masquerading (see the
    IP Masquerading section in Chapter 3, “How Secure Should Your Network Be?”), you
    should pick an ethernet address for your firewall''s interior interface from that
    range. Pick one that suits your numbering plan. Often we use 192.168.1.1 or 192.168.1.254,
    depending on policy, for the firewall itself. You could use these addresses, or
    you could use others (Chapter 3). If you plan to use real IP addresses for your
    network, you''ll need to pick one of these to assign to the ethernet card.


    If your internal network is using DHCP (Dynamic Host Configuration Protocol),
    you need to find an address in your local subnet that isn''t going to be assigned
    by your DHCP server. Unless you want to run routing protocols on your internal
    network, having your firewall continuously changing internal addresses is Not
    A Good Idea. If your external address is assigned by way of DHCP, that''s OK.


    If you''ve used a particularly old network card, Red Hat may ask you to tell it
    about what kind of card it is, in which case, do so. Red Hat will then ask if
    you want to configure LAN networking. Select YES and hit <CR>.'
