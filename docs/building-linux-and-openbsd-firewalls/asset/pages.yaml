    made this elementary mistake.


    Now you know that buffer overflows are caused by a program trying to store too
    much data in a chunk of memory that''s too small. What we haven''t explained is
    why this enables a programmer to execute arbitrary code.


    The secret lies within the way that memory is used by the computer. When a program
    is running, there are three types of information it needs to access. The first
    is the program instructions themselves. It also needs access to data that the
    program will manipulate. Some of this data is fixed or static and will not change
    while the program is running. Other data is dynamic and may change while the program
    is running.


    The third type of information pertains to functions, or subroutines. Program-mers
    use functions to simplify simplify writing their programs. If a task is done many
    times within a program, it helps to write the instructions for the task once and
    then just to point to those instructions every time the task needs to be run.
    The task becomes known as a function. Whenever the program wants to use the function,
    it calls the function.


    A program is a series of instructions. Many of these instructions will be calls
    to functions. When the program runs, it processes the instructions in order. When
    a program calls a function, it pauses processing its own instructions and processes
    the function''s instructions. Once it''s done with the function''s instructions,
    the program continues with its own instructions. In order for this to happen,
    the program needs to keep track of where it was before it called the function.
    This piece of data is called the Instruction Pointer and contains the memory address
    of the program''s next instruction.


    The portion of memory that stores the dynamic data for the function, as well as
    the Instruction Pointer, is called the stack. Figure 2.10 shows a simplified view
    of a stack being flooded.


    # The Stack Overflow


    ![](img/2fea8bfa30d45d039dcc057b944028fc_74_0.png)


    Figure 2.10 A simple stack overflow.'
