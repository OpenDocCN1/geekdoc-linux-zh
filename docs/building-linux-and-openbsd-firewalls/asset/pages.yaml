- img_proc: true
  md: '# Stateful Inspection


    This is a huge buzzword that every major firewall vendor is sure to have in glossies.
    Originally, firewalls had a feature that allowed one to filter TCP connections
    that were established. This meant that it could tell if a packet was part of an
    established connection or not and make a filtering decision based on that information.
    Unfortunately, the mechanism used for this was simply looking at the TCP flags.
    If the flags contained an ''ACK'', but not a ''SYN'', then the firewall said,
    "looks established to me" (this is the sort of system we''ve just implemented
    above in the section on TCP flags).


    Of course, any four year old could forget a packet through such a firewall, so
    new mechanism was devised stateful inspection. It basically means that certain
    bits of information are recorded by the firewall when a connection is established.
    This includes sequence numbers and source/destination addresses. When subsequent
    packets arrive claiming to be part of the established connection, the firewall
    verifies their sequence numbers against the recorded numbers. If the inbound sequence
    numbers fall within a certain range, the packets are considered part of the connection.


    The advantage of stateful inspection is that it is rather difficult to create
    a packet with the proper sequence numbers. This doesn''t mean it is impossible,
    just that it''s more difficult (see the following Session Hijacking). Regardless,
    it''s significantly more secure than just filtering based on TCP flags. Furthermore,
    it can significantly save processing power—the kernel doesn''t have to pass the
    established packets through the filtering rules. It just applies the initial policy
    to all of the subsequent packets.


    # Session Hijacking


    We talk about the nature of the TCP session hijacking vulnerability in Chapter
    2, "Fundamental Internet Security Issues." Firewalls are not able to effectively
    stop an attack based on session hijacking. The best security against this is an
    encrypted data stream—the attacker might be able to get a packet past the firewall,
    but they won''t be able to get the receiving response without the proper encryption
    algorithm and key.


    The good news is that stateful inspection is also implemented in the IPFilter
    system. Not only can it keep state on TCP sessions, but it can also track UDP
    and ICMP sessions (although this creates some interesting security issues, since
    UDP and ICMP are stateless protocols). It''s the best way to ensure that only
    machines inside the network can initiate connections with machines outside of
    the network.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'Stateful inspection is implemented in ipf as the keywords ''keep state''. If
    you want to allow established connections to come into the firewall, you need
    to apply the ''keep state'' keywords to a rule that spots the outbound request
    from the client inside your network. Thus, for useful inspection on outbound telnet
    client, you should write:


    ```

    pass out on ppp0 proto tcp from any to any port = telnet keep state

    ```


    We can generalize this further to allow all outbound TCP connections to benefit
    from stateful inspection:


    ```

    pass out on ppp0 proto tcp all keep state

    ```


    Likewise, ''keep state'' can be used as an additional security measure with inbound
    connections. A classic example is providing access to a Web server that''s inside
    your network. Assuming you already have the above rule in place with a default
    policy of denying all inbound traffic, the following code will allow the external
    web client to make the initial page request. After this request, the Web server
    sends a response to the client. The response is tracked with ''keep state'', so
    all future communications between the client and the server are tracked.


    ```

    pass in on ppp0 proto tcp from any to any port = 80 flags S/A keep state

    ```


    State is a good filtering concept for TCP rules, although it should not be used
    as grounds for passing a packet with no further inspection—do not assume that
    a packet is your friend merely because its state looks good. In the context of
    UDP and ICMP, there is no state; trying to invent state for them and use it as
    a sensible adjunct to other filtering is a bad idea.


    # Network Address Translation


    In Chapter 3, we discussed Network Address Translation (NAT), but we generally
    referred to it as IP Masquerading. Masquerading refers to the art of hiding a
    internal network behind one valid IP address. NAT is actually a superset of IP
    Masquerading. The NAT portion of the IP Filter package handles both masquerading
    and port forwarding. You can think of masquerading and port forwarding as two
    sides of the same coin—masquerading maps the outbound connections from private
    machines so that they appear to be coming from a public address, as port forwarding
    maps inbound connections from external machines to a server running on a private
    port of the network.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Activating NAT Rules


    Before your NAT rules work, you''ll need to make some changes to various configuration
    files. The first step is to add "net.inet.ip.forwarding=1" to the file /etc/sysctl.conf.
    NAT requires IP packet forwarding, and this enables packet forwarding at the kernel
    level.


    In Chapter 8 we ensured that "option IPFILTER" and "option IPFILTER_LOG" were
    present in the kernel config file when we rebuilt the kernel. If these lines are
    not present, NAT will not work. Likewise, IPF must be enabled for NAT to work—even
    if you aren''t using it for anything. See the section Starting the Firewall for
    instructions on enabling IPF.


    When NAT is activated it needs to have a valid IP address for each interface.
    If you are using PPP, you have two options for starting NAT:


    +   1. Start up the PPP connection before starting NAT (not a very reliable option)


    or


    +   2. Start NAT whenever a PPP connection is established. To do this, add the
    following line to the /etc/ppp/ip-up shell script:


    ```

    /sbin/ipnat -CF -f /etc/ipnat.rules

    ```


    In IPF, NAT rules are stored separately from IPF rules. The NAT rules are read
    from a file /etc/ipnat.rules. Don''t try and put them in the ipf.rules file—it
    won''t work. Likewise, the NAT rules are injected into the kernel using a different
    tool. The following line will activate the NAT rules specified in the following
    file:


    ```

    ipnat -f /etc/ipnat.rules

    ```


    # Outbound Mapping


    We need to map packets going out from our internal network, automatically rebadging
    them with the IP address of the interface which they leave. The kernel takes care
    of automatically tracking replies, mapping them back to the appropriate internal
    addresses, and redirecting them out to the correct interface. Since much care
    is taken on our behalf, all we really have to do is tell the kernel which addresses
    should be mapped. It''s pretty easy. For the sake of argument, we assume that
    the internal network is a subset of one of the private address ranges, 192.168.1.0–192.168.1.255,
    and we connect to the outside world via ppp0. 210.210.210.0–210.210.210.255, which
    means we have one IP address for every internal address. We know this'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Configuring the Firewall under OpenBSD


    probably isn''t the case for you; bear with us though, it''ll all make sense.

    The above situation can be properly mapped using the rule:


    ```

    map ppp0 192.168.1.0/24 -> 210.210.0/24

    ```


    This is ensure that every internal machine can communicate with the external world.

    So what do we do if we only have one IP address? We can''t write:


    ```

    map ppp0 192.168.1.0/24 -> 210.210.0.1/32

    ```


    Why won''t this work? If two machines on the internal network make a connection
    to the outside, they both appear come from the same IP address. So far so good.
    But what if both machines are connecting to the same external machine and waiting
    for a response on the same port number? Now when the responses come back, the
    NAT system has no idea what packet goes to which internal machine. They both are
    destined for the same port and IP address. The solution is to use the following
    two rules:


    ```

    map ppp0 192.168.1.0/24 -> 210.210.0.1/32 portmap tcp/udp 1025:65000

    map ppp0 192.168.1.0/24 -> 210.210.0.1/32

    ```


    The first rule invokes the portmapping technique for TCP and UDP connections,
    which works as follows. Internal client192.168.1.1 sends a TCP packet out to a
    machine on the Internet. The source port is 4001, the destination port is 80.
    This means that the internal client is listening on port 4001 for a response.
    The packet hits the firewall. The NAT system changes the IP address of the packet
    to 210.210.0.1. The portmapper changes the port from 4001 to 60000 and notes the
    change, the originating internal machine, in a table. Now the packet gets out
    of the firewall to the aforementioned machine on the Internet. That machine sends
    its response back to the firewall (210.210.0.1) port 60000. The portmapper is
    listening on port 60000 for the inbound connection. It gets the returned packet
    and looks up port 60000 in its table. It sees that 192.168.1.1 is waiting for
    this packet on port 4001, so changes the destination information in the packet
    appropriately and sends the packet out the internal interface. 192.168.1.1 gets
    the packet as if nothing had happened. Mission accomplished.


    So, how does this help us? While we only have one IP address to work with, we
    have tens of thousands of ports available. If another internal machine were to
    make an outbound connection such that it were waiting for a response on port 4001,
    the portmapper would assign it a different port—maybe 60001. When the connection
    returns, it''s very easy for the portmapper to tell the difference—the different
    connections simply return on different ports.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    One more point: Note that we start our range at port 1025. Why not 0? Because
    ports under 1025 are special; they can only be accessed by services running as
    the root user. Therefore most important services tend to run on these ports and
    they have special meaning. It''s a good idea to avoid messing with these ports.


    So on earth the second line do? Well, what about ICMP? It doesn''t have ports
    to map. We need to simplify it by IP address. If an ICMP packet comes in, the
    NAT system will try its best to identify the appropriate machine for the packet
    based on the source and destination IP addresses and previous connection history.
    If you just have one IP address, this means ICMP packets may get lost or broadcast
    to too many machines. This isn''t a critical problem—at the worst it will only
    affect your network performance.


    The really observant readers will note that the order of rules for ipnat appears
    to contradict the order rule for ipf. According to last match counts theory, TCP
    and UDP packets would match both the first rule AND the second rule, and therefore
    match the second rule. Well, with ipnat, it''s the first match that counts. Don''t
    try and rationalize it. Just accept that the rules need to be in the above order
    and get on with your life.


    ```

    map ppp0 192.168.1.0/24 -> 0/32 portmap tcp/udp 1025:65000

    ```


    The 0/32 tells IPNAT that the address is being dynamically assigned. We will read
    the address from the ifconfig system. Whenever the IP address changes, you need
    to run the command "ipf -y", to notify IPF that it needs to update its NAT tables.
    This can be automated in your ppp.conf file by adding the line to your ''pmdemand''
    section:


    ```

    bg ipf -y

    ```


    # Inbound Mapping


    Throughout this book we have made reference to a three-legged DMZ structure. This
    allows you to have a secure internal network and a separate secure network (DMZ)
    behind your firewall. The DMZ can be used to provide security for public servers.
    It adds another layer through which the hacker must penetrate. If the servers
    are compromised your internal network will still remain protected (unless your
    firewall is also compromised)


    The servers in your DMZ can either have public or private IP addresses. Either
    way, all of the traffic to your DMZ will pass through your firewall rules.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Configuring the Firewall under OpenBSD


    have a number of public IP addresses, you can use some of them for the servers
    in your DMZ. This can be accomplished by subnetting your address space and configuring
    your firewall to appropriately route traffic to the machines in the DMZ subnet.
    If you only have a small number of IP''s to play with you''ll probably want to
    set up mappings instead of subnetting. The time of writing this can only be done
    with OpenBSD. Discussions on setting routing and configuring an appropriate subnetting
    strategy are beyond the scope of this book.


    If you only have one public IP address, you can still use a three-legged-wall.
    The server would have an internal IP address. The firewall would redirect connections
    to a particular port on the external IP address directly to the port of your choice
    on your internal server machine. For example, if our firewall''s IP is 4.3.2.1,
    we could make 4.3.2.1 port 80 route directly to a server running on 192.168.1.2
    port 8088. This system ONLY exposes port 8088 of the internal machine yet allows
    external browsers to access the server as if it were on an external machine with
    the standard port of 80. The following NAT rule will just do that (assuming your
    external interface is ppp0):


    ```

    rdr 4.3.2.1 port 80 -> 192.168.1.2 port 8088

    ```


    Creative use of the redirection rule can allow all sorts of neat tricks.


    There are some limitations to inbound port mapping. Here''s one: You only have
    one port 80 on your firewall''s external IP address, so you can only redirect
    port 80—only one Web server. There''s no way to run multiple internal Web servers,
    all on port 80, and have them all accessed by the outside world from port 80 (unless
    your firewall has more than one external IP address, but if you''re lucky that,
    you can simply write multiple rdr rules, one for port 80 on each address).


    Here''s another problem: This technique works for any protocol that has a single
    channel. HTTP, NTP, DNS—any UDP or TCP protocol that has just one channel is fine,
    but protocols like IRC or FTP, which have control and data channels, cause particular
    problems for port forwarding. Consider passive-mode FTP. Sure, you can forward
    the incoming command requests to port 21, but when the server passes back a random
    port for the client to open a data channel, how are you going to tell the firewall
    what port needs forwarding? There''s no way to tell, in advance, what port the
    FTP server is going to pick, so there''s no way to write the rule. In the future,
    ipfilter will include proxy support for FTP and possibly other common multi-channel
    protocols, but for now, multiple-channel protocols are out.'
