  md: '# Password Security


    Small businesses should consider replacing hubs with switches.

    Larger installations should already be using switches. If there are any moderns
    in the building, hunt them down with spears and kill them like the dinosaurs (throw
    them in a box with some AOL floppies and send them to your competitors). All of
    your dial-in and dial-out should be centralized.


    Passwords are a classic weak point in security. Since most organizations assign
    usernames on a systematic basis, the password becomes the final line of defense.
    Let''s be clear about this: If a cracker can work out your username, the only
    unknown he or she needs to convince the system of his or her authorization is
    your password. Once the cracker has that, if passwords are so simple the ageold
    problem with picking passwords is subject to easy discovery; if they are too difficult,
    they will be regularly forgotten or gotten (worse) written down. You can usually
    set passwords to expire after a set time, then the user has to change it. Opinion
    is on the merits of this, but we recommend against it for a variety of reasons.
    Our preference is to ask users to take a little time and choose a single, easy-to-remember
    hard-to-guess password, and then make sure the central username/password database
    consult for everything. Most software systems want to include their own database,
    instead of consulting the central one, but if you push the vendor, they''ll often
    up to how to make the software consult the database. If they claim their product
    won''t it at any price, don''t buy it. Each new password users have to remember
    makes the choice of a bad one more likely.


    Home offices should start using passwords. Yes, administering these does time,
    but you will have to start someday. Today is a good day.


    Small businesses should ensure that password security is in their written security
    policy. This will ensure that employees know they have a duty of confidentiality
    regarding their passwords, with other access devices such as keys, and ensure
    they are clear about what constitutes a bad password.


    Larger installations should start running proactive password checkers to ensure
    that passwords are good at the point of setting, and as regularly running a password
    cracking utility. "Crack" is a good utility for Unix passwords; "10ptchcrack"
    is good for NT passwords. References for both these packages can be found in Chapter
    12. The first time you run a password cracker, you should expect to crack around
    40 percent of your passwords. If you can crack your passwords, someone else can
    too. Do it before they.'
