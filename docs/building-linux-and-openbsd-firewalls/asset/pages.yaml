  md: '# SMTP: The Simple Mail Transport Protocol


    POP-3 and IMAP are protocols for getting mail from its final resting place to
    a mail reader on the recipient''s computer. They do not, however, deal with getting
    mail from the sender to the recipient''s POP or IMAP server, nor do they handle
    any replies or original mail. The sending and transmission of mail is the responsibility
    of a Mail Transport Agent (MTA). The protocol behind nearly all MTAs is SMTP;
    and its extension, ESMTP, the Extended-Simple Mail Transport Protocol. The following
    discussion applies to both.


    The reference implementation of SMTP is sendmail (www.sendmail.org/). By default,
    SMTP servers run on TCP port 25. If you read all incoming mail for your site using
    POP, and all outgoing mail using an SMTP server at your ISP, you won''t need to
    run your own local SMTP server. You''ll only need to deal with outbound access
    to your ISP''s SMTP server. On the other hand, if you want to run your own local
    SMTP server—be it sendmail, qmail, Exchange, and so forth—you will need to allow
    inbound connections to TCP port 25 on your network.


    Should you run your own SMTP server? Good question. The decision may be yours—you
    may already have a fullyged mail server running at your site, or there may be
    a higher-level management refusal to accept the time and expense of running one.
    If the question is still open for discussion, here are some thoughts.


    The pros to running your own mail server are the vast increases in functionality
    you get from email. Instead of merely receiving and sending individual emails,
    you can set up mail lists—both static (you add new users) and dynamic (they add
    themselves). You can run auto-responders, which automatically generate replies
    to new sales leads, for example. Email can be used to initiate more things than
    simple while responses from human beings. It is possible to do all these things
    while fetching mail from a POP mailboxbox, but you might end up trying to rewrite
    your MTA to have a POP interface, and it''s probably not worth the trouble.


    The drawbacks of running your own mail server are security and complexity. It
    takes time, effort, and knowledge to run a mail server properly. If you don''t
    invest that time and effort, you will be running an invitation to crackers.


    # Problems Associated with SMTP


    The classic abuse of SMTP is the relaying of UCE (unsolicited commercial email),
    more popularly known as spam. We''re fairly certain that there isn''t anyone on
    the Internet who hasn''t at some time or received mail offering, well, let''s
    just call them unwanted business or entertainment opportunities. If'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    you ever try to trace these emails back to their source, the trail almost invariably
    leads to somebody who had nothing to do with sending the message.


    How does spam work? It takes advantage of the fact that SMTP passes on messages
    blindly. The program that connects to a SMTP server tells the server where the
    message is going, and who/where it came from. SMTP never checks to see if the
    messenger is telling the truth. When a spamner connects to an open SMTP server,
    he or she forces the details of the message origin and sends it off en masses
    of frustrated souls. Clever spammers will use a variety of techniques to cover
    their traces once more completely. They will also choose Intelligent From and
    To: addresses to circumvent standard filters.


    System administrators everywhere have been striving to solve the spam problem.
    Like various types of Denial of Service attacks, you cannot completely prevent
    spam, but you can avoid the cost of more spam. We''ll discuss this in the section
    Making SMTP Secure later in this chapter, along with some techniques for getting
    rid of spam.


    As we have said, running your own SMTP server vastly increases the power of email.
    It allows everyone to initiate all of things other than replies from your mail
    server. Sadly, not all these things may be what you wanted. By way of example,
    considering a mailing-list subscription engine. Most of us have used them—you
    send mail saying "subscribe me@mysite.com RedHotice" to a remote server, and then
    you get lots of interesting about serving strawberry sorbet at lip-catching temperatures.
    Of course, if the subscription engine were badly written, you might be able to
    send an email that fooled the remote server into executing code instead of adding
    you to a list. You''d suddenly have a lot of control over someone''s mail server.
    This is not a fantasy example. Many free and commercial mail servers have been
    susceptible to problems like this in the past. Some still are.


    Another interesting point about subscription services: Forging a From: address
    is exceedingly trivial. People often are subscribed to high-volume mailing lists
    and if you''re running such a list, make sure there is some sort of sign-on verification
    process. On a verified list, after sending the subscribe message, you receive
    an email saying: "reply to this message if you REALLY want to subscribe." This
    mechanism should be noted at the top or bottom of every message sent across the
    list. This helps to prevent the incredibly annoying "Please unsubscribe me" messages
    that are guaranteed to appear on any unmoderated mailing mailing lists.


    In summary, if you decide to run any of these interesting services at your site,
    you need to be careful about which ones you run. Generally, any program that''s-'
