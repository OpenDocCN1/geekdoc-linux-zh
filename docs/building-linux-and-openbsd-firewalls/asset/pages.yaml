- img_proc: true
  md: '# Intrusion Detection and Response


    not going to be interested. Although there''s no harm in telling them (they) can
    set their own priorities quite well!), you may not be able to lay your hands on
    the right policeman in the heat of the incident. When the right person does he
    or she may regret not being able to ask questions at the time. If you think calling
    law enforcement may be an option, you should perhaps try to contact them now to
    find out whether they would like to know, and whom you should talk to in the event
    of an incident. Put this information in your plan. In any event, your plan should
    say who decides to call them.


    # Laptops


    This is one of these little ideas that didn''t fit anywhere else. A laptop can
    be worth its weight in gold when portable network sniffing''s in order. You don''t
    have to shell out big bucks to get one these days; Linux and FreeBSD are much
    lighter OSes than you can think of, needing less laptop to do a good job. With
    a few tools like tcpdump, you can carry it around your building and plug it in
    anywhere to see what''s going on. They make good portable VT100s for reconfiguring
    printers, switches, hubs, and routers, too.


    It''s worth getting a big hard drive for your laptop, since you can store captured
    packets that way.


    # Summary


    That''s really all we have to say on the topic of intrusion response. A really
    depressing large number of Internet sites—even companies with good security and
    firewalls—don''t think systematically about this sort of disaster. If you do,
    you spend time monitoring systems and planning your response, you''ll be doing
    better than some big companies. Recall our comments earlier in the book about
    trying to make your car less stealable than your neighbors? Well, this is the
    equivalent of installing a Great Big car alarm on your Yugo and parking near a
    Ferrari. Well done.


    Now, on Chapter 12 “Loose Notes,” where we run through all the resources we promised
    you earlier in the book—mailing lists, patch sites, discussion sites, sources
    of information, and system security fora. We will wrap up the book with a few
    completely irrelevant remarks, so stay tuned.'
