  md: '# Fitting Extra Network Cards


    If you are using a three-legged configuration, or your Internet presentation is
    Ethernet, or you just fancy fitting more than one ethernet card, you''ll need
    to fit a second ethernet card, or maybe even more. This isn''t necessarily a production,
    but it can be. One good guide is the Ethernet-HOWTO, which you can find at /usr/doc/HOWTO/Ethernet-HOWTO
    on your new firewall; you''re looking for Section 3.2, "Using more than one Ethernet
    Card per Machine.", since this is something you are likely to do, we''ll give
    it some time air here.


    # Kernel Recognition


    You''ll have the easiest time of it if you''ve bought several PCI cards, as we
    strongly recommend. The one driver installed at installation time will detect
    all the cards on each boot. You''ll all need to provide enough configuration files
    to go around (per card). Well, nearly all. The trickiest bit about this configuration
    is working out which card is. This is mother-dependent; the network card in the
    lowest-numbered PCI slot will be eth0, the card in the next-numbered PCI slot
    will be eth1, and so on. Your motherboard manual will be of great assistance to
    you here. If it isn''t, roughly consult your motherboard manufacturer and start
    looking on the board itself for some indication of slot is the lowest.


    If you didn''t go for identical PCI cards, you''re in unsupported territory. We
    don''t want to tease you totally in the dark, so we''ll throw a few measly paragraphs
    to just you into thinking that there is hope for you. We''ll mention two situations:
    multiple PCI cards from different vendors, and multiple ISA cards in general.
    If you''re mixing PCI and ISA cards, you deserve to be sandwiched between two
    large circuit boards with lots of pointy-spikes pressing into your skin.


    The easiest of these scenarios is if you have several PCI cards from different
    vendors. There exists a file in /etc called conf.modules. This file controls which
    driver are loaded when devices are initialized. If you look in it, you''ll notice
    a line that starts "alias eth0". The word after that will be something like "3c509,"
    or "3c59," or "tulip," or "2ek-pci"; the precise word depends on what brand of
    network card you bought. To force your card to be recognized, you need to add
    a line that says "alias eth1 xxxx". In place of "xxxx" you need the driver appropriate
    to your network card. To find out which driver that is, your best is to go to
    Donald Becker''s Linux-Network Drivers page at http://cesdis.gsfc.nasa.gov/linux/drivers/.
    Look through your card, then cross-reference it to the driver (they''re all called
    something.c-just chop off the .c).'
