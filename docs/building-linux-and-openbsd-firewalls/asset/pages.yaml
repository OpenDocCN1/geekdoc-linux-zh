  md: '# NOTE


    Have you noticed that some URLs have numbers to the host name, but others don''t?
    The numbers tell the Web server is running on a port other than 80. For URLs without
    numbers, the 80 is implied. For instance, Web browsers consider the URL www.news.com
    equivalent to www.com:80 because port 80 is the default port.


    This port number system allows you to run several servers on the same machine—even
    servers of the same type. For instance, MIT''s Student-Information Processing
    Board (SIPB) runs two Web servers on www.mit.ed on ports 80 and 8001, which can
    be accessed at www.mit.ed and www.mit.ed:8001 respectively. If you look closely
    at these URLs, you will see that these return the same pages, but they don''t
    necessarily have to.


    The reason that these two Web servers return the same Web pages has a lot to do
    with how we serves their own standard port numbers. When the Web was a neat little
    novelty that nobody knew about, Web didn''t have a standard TCP port to call home.
    SIPB decided to set up a Web server on port 8001 of one of their machines. They
    called the machine www.mit.ed (which sort of off MIT''s administration later on
    when the Web became popular and the name www.mit.ed was already taken). By the
    time the Web had become popular and had a standard port, thousands of MIT students,
    faculty, and labs had already written Web pages on www.mit.ed and registered the
    URLs on places like Yahoo! using the port 8001 URL. This eventually led to much
    confusion among people who didn''t understand the concept of typing "8001" in
    a URL. To rectify this issue, SIPB added a redundant server on port 80 that mirrors
    the old server at 8001.


    SIPB''s non-standard choice of port number was not due to oversight or error.
    Port numbers under 1024 are generally reserved for established protocols; at the
    time that the www.mit.ed server first went online, the Web was far from established.
    The way in which these ports are reserved on Unix/Linux systems is that a user
    must have privileged access to a machine or to activate a server that sits on
    (binds to) a port below 1024. This is a security measure to prevent a rajan mail,
    nonadministrative use of the machine from running a Trojan mail, Web server, or
    Telnet server, to name a few possibilities (such a server could intercept data
    traveling to the reserved mail, Web, or Telnet ports). Windows does not enforce
    this restriction. The person who initially set up the SIPB Web server may not
    have privileged access to the machine, forcing the use of port 8001.


    Why are we getting this technical in regards to TCP and IP? Because the firewall
    sees the IP packet before it gets demultiplexed. Each layer of encapsulation provides
    a header that can be used for filtering the packet. In some cases we''ll need'
