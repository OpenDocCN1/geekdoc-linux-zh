    Provided you get a case that fits the motherboard you''re buying, there''s really
    not much that can go wrong with the case. However, some cases will make you regret
    the purchase a lot more than others. You''re going to be fiddling around inside
    this case a lot, however, and you''ll be trying to fit your own motherboard..'
