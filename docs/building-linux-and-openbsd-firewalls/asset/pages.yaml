  md: '# Strict and Loose Source Routing


    The best hackers ever cover their traces well. A real hacker will never directly
    send a packet from their machine—it''s too easy to trace. Instead, they will work
    through a network of other machines to which they have gained unauthorized access.
    This causes the attack to trace back to someone else''s machine and account. An
    extra layer of confusion can be added by taking advantage of a few options within
    the IP protocol that can be implemented on a number of systems. One such option
    allows the packet to specify the path it must take to its destination. This is
    known as source routing. There are two types of source routing: loose and strict.
    Source routing allows you to specify machines that the packet must pass through,
    but it can also pass through a number of other machines in-between. Strict source
    routing forces the packet to take the prescribed route.


    Source routing allows a hacker to craft attacks that are not traceable, or appear
    to be originating from one of your machines. Source routing also allows hackers
    to impersonate trusted machines. Luckily, source routing is not used by any major
    services. Therefore, we have our firewall filter out any source-routed packets
    that appear on our network.


    # The Control Freak: TCP


    The IP is a very simple system. Its only task is to standardize the way information
    moves around the Internet. It doesn''t do to ensure that the data leaving point
    A arrive at point B. It''s difficult to write networked applications if you can''t
    assure that the packets you send will be received in the order you sent them.
    It''s even tougher if you don''t know all of the packets made it in the first
    place! Therefore, most applications do not use IP directly. The Transmission Control
    Protocol (TCP) was created to make the life of developers easier.


    TCP is a system that provides a mechanism for sending a reliable stream of data
    over an unreliable network. It accomplishes this goal by keeping track of whether
    data are duplicated, sent out of order, or lost. If it notices a problem, it corrects
    the mistake. This means you can count packets arriving in order without gaps or
    duplicates. In fact, TCP lets you avoid dealing with packets altogether. Give
    TCP a chunk of data and the end will receive that chunk of data. The application
    developer doesn''t have to deal with breaking it apart into smaller chunks. This
    allows an application to stream data across a TCP connection without worrying
    about how the data are transported across the network.


    When TCP is layered on top of the Internet Protocol, the resulting system is known
    as TCP/IP. This system provides programmers with a level of abstraction that lets
    them avoid dealing with the issues involved in verifying the data that is received
    from the Internet.'
  merge: -1
