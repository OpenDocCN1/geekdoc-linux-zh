  md: '# Distributed Computing


    Most of computer science research and development is directed toward distributed
    computing. The Internet is essentially a giant computing network. The Web is a
    perfect example. Documents are stored on computers all over the world, but can
    be easily retrieved on any other machine via a simple protocol (HTTP). Over the
    past few years, the Web has moved even more toward true distributed computing.
    Many Web servers now present content dynamically to users on various input parameters—all
    sent over the simple HTTP protocol.


    Of course, HTTP is far from the mechanism for distributed computing. Most of the
    computing world has settled on the object-oriented paradigm of software development.
    A good distributed computing architecture should be able to work with objects
    directly. There are numerous architectures that do this, and they have created
    a confusing landscape of acronyms, which many are almost pronouncable. The common
    goal for all of these architectures is that an object on one machine can use an
    object on another machine.


    In this section we''ll deal with two of the most distributed computing frameworks:
    Remote Method Invocation (RMI) and the Common Object Request Broker Architecture
    (CORBA). Each framework has its own protocol for communicating over the network.
    RMI uses the Java Remote Method Protocol (JRMP) while CORBA uses the Inter-ORB
    Protocol (IIOP). Sun added support for RMI to communicate over IIOP in addition
    to JRMP.


    Before we get into any of this, we''ll take a moment to sort out a few terms.
    One of the most daunting aspects of distributed computing is the plethora of acronyms
    found in every sentence. Some writers don''t even bother to explain what any of
    the acronyms mean, expecting you to already know their meanings and relationships.
    We''ll give you a road map that will help guide you when you encounter these technologies.


    Object. A small program. Each object performs a specific task. The goal of object-oriented
    programming is to make the task performed by the object as simple as possible,
    so that it is easily reusable in any other program. Combining lots of little objects
    can create complex systems. For example, a “car” program might be composed of
    an engine object, a wheel objects, some seat objects, etc. Objects can also contain
    other objects. For example, an engine object would be made up of spark plugs,
    a carburetor object, a radiator object, etc. Any one of these objects might be
    composed of smaller objects.


    The key to object-oriented programming is that the smaller parts are “abstracted”
    away from the larger program. The car object doesn''t need to'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# How Secure Should Your Network Be 109


    know how the spark object fits into the engine object. It just knows that it needs
    an engine, and it needs to be turned on the engine. The engine object takes care
    of asking the spark object to “fire.” The car object can also link other objects
    together; for example, the accelerator pedal would be linked to the engine object.


    The functionality of a given object is described by its *methods*. For example,
    the engine object would have a method called “ignition” and another called “throttle”.
    When the car object wants to tell the engine object to turn on, it would call
    the engine’s “ignition” method and pass it value such as “on.”


    The benefit to this system is that it becomes very easy to build complex systems.
    Once a programmer is familiar with the object-oriented approach, it becomes easy
    to see programs as a collection of objects communicating. Often, many of these
    objects have already been designed. For example, the Java Developers Kit (JDK)
    comes with thousands of pre-made objects that handle many common tasks. There
    are also third-party vendors that sell objects, and many objects have been made
    freely available on the Internet. Even if the object needed doesn''t exist, it
    is often made of smaller objects that are available.


    The object-oriented program often starts as a collection of *interfaces*. These
    are descriptions of how the *components* (objects) used together in a program
    they are often referred to as components) communicate with one another. Looking
    at a well-designed set of interfaces should quickly reveal exactly what a program
    does and how it functions. As long as an object conforms to the interface specified,
    it should work in the program. A major advantage to this system is that different
    programmers can work on different components and the system will still integrate
    as easily as long as everyone adheres to the interface descriptions.


    Some types of object communications are so common that the interfaces have become
    standardized. For example, the JavaMail specification defines interfaces for objects
    that handle email. When programmers need to incorporate email functionality, they
    can use the JavaMail interface and then choose from a number of objects that implement
    the standardized interface. As long as the object is JavaMail compliant, it will
    work with the programmer’s application.


    These concepts are important to understand, because all of the technologies we’re
    about to discuss attend to extend these concepts into a networked environment.


    **Distributed Computing.** Machines networked together share resources (files,
    processor time, databases, programs, and so forth) to perform a given task.'
