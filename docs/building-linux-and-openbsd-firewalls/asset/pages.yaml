    it in such a way that the Instruction Pointer gets overwritten with a value that
    points back to the start of the hacker''s code in the buffer. The result? The
    next instruction executed by the computer is the hacker''s code. The size of the
    allocated buffer limits the amount of code a hacker can execute, but this doesn''t
    really cause many problems. Hackers can create very malicious code within an incredibly
    small space, often on the order of a few bytes. In the case where the buffer is
    so small, there may be other buffers between the buffer and the Instruction Pointer.
    These can be used to add to the space available for the hacker''s code.


    Programmers are finally starting to use coding standards and helper libraries
    to minimize the occurrence of buffer overflows. Nonetheless, these problems occur,
    and the likelihood of occurrence increases with the complexity of the application.
    Programs such as Microsoft''s Internet Explorer are so complex that they become
    riddled with buffer bugs.


