    attacker''s machine. The attacker doesn''t want to be noticed, so all of the client''s
    commands are passed through the server and the server''s responses are passed
    back to the client. To the client and the server, it appears as if they are communicating
    directly with one another. Because it''s watching the sequence numbers, it can
    place its own spoofed packets into the TCP stream as needed. This allows the attacker
    to access the server with all the privileges of the spoofed client. The attacker
    can also watch for any output related to the attack and NOT pass it on the client.
    Thus, the attack becomes transparent. In a situation, the attacker doesn''t even
    need to figure out a password to get access to the machine. The attacker simply
    waits until the user has logged in and then hijacks the session stream. Figure
