    well, you should see a listing of the files on the OpenBSD CD. If you see something
    other, then you may have mounted the wrong device. Look more carefully at the
    “dmesg | more” output.


    Let''s make our lives a bit easier by making a link to our CD-ROM device, similar
    to what we did with the modem:


    ```

    ln -s /dev/acd0a /dev/cdrom

    ```


    Once again, replace the “acd0a” with your CD-ROM device name. From here in, we
    can access the CD via /dev/cdrom.


    Now let''s unmount the CD so that we can eject it:


    ```

    cd /

    umount /mnt/cdrom

    ```'
