  md: '# Set the Default Policies


    Now that we have a clean slate, let''s open up the /etc/ipf.rules file in vi and
    get cracking. We''re going to create two rules that will form our default policy.
    Between the two rules, we''ll match every packet that passes through the firewall.
    If no other rules match, then one of these rules will apply. Start your ipf.rules
    file with the following lines:


    ```

    pass in all

    pass out all

    ```


    This is the simplest type of rule. The ''pass'' term is the action. The other
    common action we''ll be using is ''block''. The ''in'' and ''out'' refer to the
    direction in which packets are traveling, such as coming into the firewall or
    going out of the firewall. Finally, the ''all'' serves to match all packets. With
    these rules we''re allowing all packets coming in and out to pass through the
    firewall. This is equivalent to going down everything that is not explicitly denied
    road, described in Chapter 3, “How Secure Should Your Network Be?” When we build
    the firewall, we will avoid death and destruction by starting with a more restrictive
    policy (''block in all'', ''block out all'').


    To see what this does, we need to first activate the rules in the ipf.rules file.
    To do this, save the file, exit vi, and type:


    ```

    ipf -Fa -vf /etc/ipf.rules -E

    ```


    > If you''ve already enabled (-E) the ipfilter rules, you''ll get an error message
    when executing this command. The solution is to leave off the ''-E'' once the
    firewall has been activated.


    The verbose output should look something like this:


    ```

    [pass in all]

    pass in from any to any

    [pass out all]

    pass out from any to any

    ```


    What you''re seeing is the expansion of the ''any'' keyword into its full meaning,
    from any to any. We''ll explain what this is all later on this chapter. If there
    are no errors, then your ruleset active. If there are errors, you probably have
    a typo somewhere in your file. Check that each rule appears on a separate line.
