    # How the Internet Works: The Quick Explanation


    Connecting to the Internet means different things for different users. Some users
    have dedicated lines running into their computer. They are always connected to
    the Internet. Others use modals to dial into Internet service providers. There
    are many ways of establishing an Internet connection, and it would be very difficult
    for an application to figure out which type of connection is being used. Even
    if the application could interface with the connection directly, it might interfere
    with data being sent and received by other programs on the computer.


    Instead of trying to interface with the Internet connection directly, networked
    applications "talk" to the operating system and ask it to either send data to,
    or retrieve data from, the Internet. The operating system knows exactly how your
    specific machine is connected to the Internet. The interface to the operating
    system is called a network driver.'
