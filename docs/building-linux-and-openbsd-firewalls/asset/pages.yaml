  md: '# Configuring the Firewall under OpenBSD


    are flowing. If ''in'' is used, the rule will only apply to packets coming in
    to the firewall. If ''out'' is used, the rule only applies to outbound packets.
    There is no way to write a rule that applies to both inbound and outbound packets.


    # source/destination


    After ''in'' or ''out'', the only other required parameter is the ''source/destination''
    parameter. This denotes the IP address or range of addresses to which the rule
    apply. If you want to have the rule apply to all IP addresses, you can use the
    value all. Very short, yet valid, rules use the minimum possible notation:


    ```

    block in all

    pass out all

    ```


    These rules have a practical use: They set a default policy if they''re the first
    rules in your rule file. Every packet will match one of these two rules. These
    two rules have the effect of setting a policy of denying all inbound traffic and
    permitting all outbound traffic.


    # from/to


    The IP parameter usually is a bit more specific. The most common form used is
    the from/to notation. This creates a condition where the packet must be from a
    particular address or range and heading to another address or range. For example:


    ```

    block in from any to 10.0.0.0/8

    ```


    This rule says to block all inbound packets from any address that are heading
    for the internal 10.x.x.x network. Packets that match this rule are most likely
    malicious, since the internal network numbers are not accessible from the outside
    world. No properly-configured router would ever forward a packet destined for
    an internal network address.


    As you might begin to fuzz the example, the from/to parameter can take IP addresses
    in a number of formats. The format used above is just one way to specify an address
    range. You could also use a hostname instead of an IP address, but this is not
    recommended for performance reasons (resolving the hostname takes time). The network
    mask can be specified with the /-32 format used above, or it could be given using
    hex or dotted quad notation along with the ''mask'' keyword. For example:


    ```

    block in from any to 10.0.0.0 mask 0xff000000

    ```'
