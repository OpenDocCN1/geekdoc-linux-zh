    the floppy drive, the graphics card, the motherboard, the floppy drive, the processor
    and the keyboard, but that''s all. Get it to the boot stage with this limited
    kit, then add in pieces one at a time and keep trying to boot. Maybe add the rest
    of the memory, then try one network card, and then try a hard disc.


    +   - Place the CD-ROM on the secondary IDE controller as "MASTER". Do not try
    to use it as a slave to the primary controller.


    +   - If you have two hard drives in a RAID array, use a separate power lead for
    each drive.


    +   - Take a moment to determine which motherboard socket is for the Primary IDE
    controller and which is for the Secondary controller. Also note the order of the
    PCI sockets—PCI 0 the leftmost socket or the rightmost on the motherboard?


    Building a system from components can be very frustrating, but as we said earlier,
    you''ll have it back in pieces one day when it goes wrong. Better now than then.
    It''s also a completely logical process. The motherboard does not hate you—yet
    (the hate circuitry doesn''t kick in until the operating system has'
