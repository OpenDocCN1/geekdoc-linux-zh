  md: 'As we’ve said already, IP Masquerading is great, but it does have a few disadvantages.
    In particular, if you’re using private IP addresses—say 192.168.1.1-254—in your
    internal network, and masquerading them behind a real IP address on a firewall,
    the outside world has no way to get to any server other the firewall. Reminder:
    running services on your firewall isn''t a very good idea. Say you want to run
    a Web server on an internal machine with the address 192.168.1.7, and your firewall’s
    external address is 203.42.57.2. How will the world get to it?


    Enter the port forwarding tool. You can get the RPM from http://juanjox.linuxuhq.com/;
    install it as we described in Chapter 6 then read on. We’re not going to cover
    this in the thorny detail that we get to ipchains, but we will show you one concrete
    example and give pointers—and a warning or two. syntax of ipmasquadm (the port
    forwarding tool) is remarkably like that of ipchains, except that some of ipmasquadm’s
    arguments are in lowercase where ipchains’ arguments were in uppercase. Give your
    shift key a half-off day and read on.


    ```

    ipmasquadm portfw -f

    ```


    The ''-f’ is for flush, just like ipchains (but lowercase). Then, do an:


    ```

    ipmasquadm portfw -l -n

    ```


    to check that there are no rules. The ‘-l’ is for list, and the ‘-n’ is for no-DNS-lookups,
    again, just like ipchains (but, again, in lowercase). You’ll see something-like
    this:


    | prot localaddr rediraddr lport rport pcnt pref |


    Now, let’s add the rule that will let people get to your real Web server by connecting
    to port 80 on your firewall. Do the following:


    and you will see this:


    | prot localaddr rediraddr lport rport pcnt pref |

    | TCP 203.42.57.2 192.168.1.17 80 80 10 10 |'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'The first field is protocol. Recall that HTTP is a TCP protocol that runs on
    port 80 (usually). The second field is the local address, that is, the address
    on the firewall that people will be trying to connect to when they want to get
    to this service. The third field is the redirect address, that is, the internal
    network address to which these connection attempts should be sent. The lport and
    rport are, respectively, the port on the firewall that people will be trying to
    connect to, and the port on the specified internal address that should be sent
    instead. The last two fields refer to preference; their use is outside the scope
    of this coverage.


    What will this do for you? Well, if you open a hole in incoming traffic to port
    80, anyone trying to connect to port 80 on your firewall will get magically transported
    to port 80 on 192.168.1.17, well inside your network. You can run your Web server
    on this machine, safe in the knowledge that no packet can get to any other port
    on it, however hard it tries.


    We mentioned some downsides, right? Here''s one: You have one port 80 on your
    firewall''s external IP address, so you can only redirect port 80 once—only one
    Web server. There''s no way to run multiple Web servers, all on port 80, and have
    them all accessed by the outside world from port 80 (unless your firewall has
    more than one external IP address, but if you''re lucky, then you can simply write
    multiple ipmasquad rules, for port 80 on each address).


    Here''s another problem: This technique works for any protocol that has a single
    channel. HTTP, NTP, DNS—any UDP or TCP protocol that has just one channel is fine.
    But protocols like IRC or FTP, that have control and data channels, cause particular
    problems for port forwarding. Consider passive-mode FTP. Sure, you for the incoming
    command requests to port 21, but when the server sends back a random port for
    the client to open a data channel, how are you going to tell the firewall what
    port needs forwarding? There''s no way to tell, in advance, what port the FTP
    server is going to pick, so there''s no way to write the rule. Doubtlessly, in
    the future, a more adaptive ipmasquadm will be developed that deals with these
    problems, but for now, multi-channel protocols are out.


    A last problem to mention relates to dynamic IP addresses. You will notice that
    you have to specify your firewall''s IP address in the ipmasquad command; you
    can''t just tell it to forward any old connection request to port 80 that happens
    to wander off the Internet. If your external IP address is dynamically assigned,
    then there''s no way of making one rule that will be valid for any IP address
    you might be given. You''ll have to rewrite the rule in real time, as your address
    is given to you. That''s well beyond the scope of this book, so you''ll have to
    discourage you from trying to forward services in this manner unless you have
    a static address.'
  merge: -1
