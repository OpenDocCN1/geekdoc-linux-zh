    # # Card Configuration


    In /etc/sysconfig/network-scripts lives a file ifcfg-eth0. This file contains,
    in very simple language, the parameters required to configure the first ethernet
    card; et the mere presence of this file is enough to trigger the card''s configuration
    at boot time. Here''s an example file.


    ```

    DEVICE=eth0

    IPADDR=192.168.1.2

    NETMASK=255.255.255.0

    NETWORK=192.168.1.0

    BROADCAST=192.168.1.255

    ONBOOT=yes

    ```


    This file is straightforward, and makes minimal use of deep magic. To issue a
    second card, cd into /etc/sysconfig/network-scripts and issue the command "cp
    ifcfg-eth0 ifcfg-eth1". Edit the new file, "ifcfg-eth1". The DEVICE parameter
    must be changed to "eth1"; ONBOOT should stay as "yes" unless you really don''t
    want this network card to do much. The other parameters are a function of the
    IP address you need this card to have in real life, and we can''t help you with
    them because they''ll be particular to your network.


