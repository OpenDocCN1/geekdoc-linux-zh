  md: '# # Masking


    Subnets and address ranges are identified by a value known as the subnet mask,
    or more commonly, the netmask. This is a value with the same form as an IP address,
    but with a different meaning. They often look very similar, all starting with
    255, or some other number. To understand the subnet mask, let''s first define
    a mask in general.


    In the art world, masking is used when spray painting to cover portions of a work
    that shouldn''t be altered. Thus the true purpose of "masking tape." In the computer
    world, masking also covers up portions of a number that shouldn''t be changed.
    Let''s look at an IP address and a netmask. In decimal these are 169.69.6.9 and
    255.255.255.0; respectively; in binary, these are:


    +   - The address: 10101001.01000010.00000101

    - The mask: 11111111.11111111.11111100


    The 1''s in the mask "cover up" the parts of the address that should stay the
    same. The 0''s allow the "paint" to alter the address. This particular mask says
    the last eight bits (each 0 or 1 is a bit) can be any value. Or to put it another
    way, any address that matches the first 24 bits of the first address belongs to
    the subnet. Valid addresses for the subnet specified by this mask range:


    ```

    10101001.01000010.00000011

    ```


    to:


    ```

    10101001.01000010.11111111

    ```


    Converting from binary to base 10 does not come naturally to those who don''t
    program for life, so an alternate method is to count the 1''s in the mask from
    the left to the right. In the preceding example, there are 24 1''s. The subnet
    mask is then expressed as the IP address/number of ones. For this example, it''s
    "24". As we increase the number after the slash (up to /32), we decrease the number
    of free bits. 169.69.6.9/32 means 169.69.6.9 and no other IP addresses at all
    (all 32 bits are fixed). As we decrease the number after the slash (down to /0)
    we increase the number of free bits. 0.0.0.0/0 matches any IP address.


    If you think about, you''ll also see that 169.69.6.0/9 matches any IP address—it
    has no fixed bits (all 32 bits are free). It is traditional, however, when using
    this form to force zero any bits that are not fixed by the mask. For example,
    the subnet containing the addresses 169.69.6.0-169.69.6.255 can be represented
    equally well as "169.69.6.9/24" and "169.69.6.0/24", but the convention suggests
    that the latter is better as the free bits—the last eight—are set to zero.'
  merge: -1
