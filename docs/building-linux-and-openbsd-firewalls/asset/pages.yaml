    rejected, the remote server will just shrug, and get on with the SMTP conversation.
    If the attempt is denied, the remote server will wait until it proceeds before
    the conversation. The net effect is a delay of a minute or every time you try
    to connect to a mail server. If you ever send outgoing mail, rejecting inbound
    TCP port 113 instead of using DENY will speed up connections substantially. Please
