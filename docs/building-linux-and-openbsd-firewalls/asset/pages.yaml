    # The Free Spirit: UDP


    There is a price you pay for TCP. The process of verifying that the packets are
    complete and in order creates a considerable overhead. A lot of extra data is
    generated and transmitted to control the flow. Additionally, TCP has to wait until
    it is sure that it has the right data before passing it to the application. If
    there''s a significant amount of packet loss or network congestion, TCP connections
    suffer dramatically.


    Some applications don''t really care if the data arrive out of order or are missing.
    The performance gain from not using TCP can sometimes outweigh the drawbacks of
    lost or scrambled data. The classic example is streaming audio/video. A missed
    packet can be skipped without creating much of a problem for the user. Out of
    order packets also have minimal effect. Enter the User Datagram Protocol (UDP)
    packet.


    UDP is a stateless, unreliable transport mechanism. It basically adds a number
    to an IP packet. It also contains a length and a checksum value for packet level
    data integrity checking. It contains the minimum information necessary to get
    a packet from one application to another.


    Streaming video and audio servers use UDP to send the data stream to the client.
    By not using TCP, less data needs to be sent, which results in better performance.


    Often the client will implement its own data integrity checking when UDP is used.
    With some creative programming the client can compensate for the garbled data.


    Of course, there''s nothing stopping an application using both TCP and UDP. In
    fact, most streaming video/audio packages use TCP for the control commands and
    statistic information sent between client and server. TCP makes sense because
    this information is not critical to playback performance but needs to arrive intact.'
