  md: 'stops. If your Internet connection is completely full of people downloading
    pirate software that some cracker made available on your corporate file server,
    email from legitimate customers may not reach you.


    A whole class of attacks, *denial of service attacks*, is designed not to access
    your computers but to prevent the authorized users of the computers from being
    able to use them. They can be depressingly sophisticated, such as network attacks
    that rely on known weaknesses in your network code. They can be depressingly simple,
    such as rapidly and repeatedly downloading a short file from your FTP server,
    to flood your log files and shut the server down. As operating systems become
    increasingly secure attacks, denial of service attacks are becoming more and more
    common. They are in many ways harder to defend against than more intrusive attacks
    because they overuse, or abuse, services you genuinely wish to offer, instead
    of accessing services not intended for use. Fortunately, there are defenses against
    some of these attacks.


    # Reputation


    This is in many ways the trickiest of all casualties of unauthorized access. You
    can lose the confidence of your customers, your staff, your coworkers, your service
    providers, and the rest of the world in general. Being successfully attacked is
    not necessarily embarrassing. Failing to notice the intrusion, ignoring it, or
    handling it badly, is. If someone penetrates your network, he or she can only
    damage your internal data, but your reputation as well. Attacks on other sites
    can be launched from your site, which will not endow you you to other administrators
    or law-enforcement personnel; the intruder can send email or post to newsgroups
    in a manner that looks very authentic. If an intruder sends mail to all your customers
    from your mail server, insulting them and including a couple of dirty pictures,
    people will remember for a long time.


    Earlier, we said that you can overdo security. Why would we say such a thing?
    Why not lock everything down tight and eat the keys? Because security is a trade-off
    with convenience. The least secure operating system in the world can be secured
    by turning the machine off and locking it in a sealed room (don''t forget to post
    armed guards). This machine is now pretty much invincible to any form of subversion.
    On the other hand, it is not going to do anything useful. Every step you take
