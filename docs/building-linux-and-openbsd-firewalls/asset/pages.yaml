    It''s worth noting that there are AGP, PCI, and ISA cards on the market (although
    ISA cards are quite rare). We recommend AGP if your motherboard supports AGP,
    because it saves you PCI slot that may be needed for a network card. An ISA card
    would also help free up a PCI slot, but we recommend against using technology
    old in your firewall system. It could create numerous conflicts that would be
    very difficult to fix.


    # Hard Disc


    Since we''ve decided against the Linux Router Project''s approach of keeping the
    entire OS on a single floppy, you need a hard disc. You don''t need a particularly
    big one, however, and you don''t need a blinding fast one.


    The two main contenders are IDE and SCSI. SCSI discs come in narrow, wide, and
    ultra-wide flavors, they''re all a lot more expensive than IDE discs. We would
    go with an IDE disc, and we''d be happy with 1 Gb. You''re not going to be keeping
    data on this machine. However, we haven''t seen a 1 Gb IDE disc for sale since
    Richard got back from the crusades, so it''s our guess that you''ll end up with
    a 3 Gb disc for the very least. Oh well.


    # CD-ROM Drives


    We can''t see any good reason not to stock a IDE CD-ROM drive. We will suggest
    avoiding Mitsumi models, which are notorious for being problematic.


