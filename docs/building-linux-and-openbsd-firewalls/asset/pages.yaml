  md: '# Fundamental Internet Security Issues


    One of the most common is to gain anonymity. By spoofing packets, the attack appears
    to be coming from somebody else''s machine. Attackers also use spoofing when they
    want to assume the identity of a machine that has privileged access to certain
    resources. In order for spoofing to work, a number of other factors need to be
    at play; we''ll approach these in greater detail throughout the chapter.


    There are numerous attacks that can be mounted with a simple IP packet. We will
    touch on a few specific attacks that have caused considerable havoc over the past
    few years. By examining how these attacks work, you''ll better understand the
    basis for new exploits when they appear.


    Understanding how an exploit works helps you more thoroughly evaluate the threat
    and enables you to implement effective safeguards.


    # Ping of Death


    The simplest IP-based attack is probably the infamous Ping of Death (PoD). This
    attack is effected with a single packet with a length that exceeds the maximum
    length for an IP packet, as stated in the protocol specification. Creating such
    a packet is exceedingly simple. Win95 provides a program that can do this in one
    line from a DOS prompt (specifically, ping -l 65510 target.ip.addr). Unix systems
    provide a similar command, although many recent versions don''t allow the generation
    of such packets.


    How does the Ping of Death work? It has to do with the way IP packets are broken
    (fragmented) into small pieces that fit within an Ethernet frame. When an IP packet
    is larger than the maximum size for an Ethernet frame (minus the header/trailer),
    it splits up and sent as multiple frames. The receiving computer extracts the
    fragments and assembles them back into a complete IP packet.


    Normally, the IP header contains the length of the IP packet. When an IP packet
    is fragmented, the header contains the fragment''s length instead. None of the
    fragmented packets contains the length of the complete packet. Thus, when packets
    are fragmented the length of the fully assembled packet can only be determined
    after all the fragments are received.


    The IP specification sets a maximum size for an IP packet. The Ping of Death is
    effective because some packet handling routines assume that packets larger than
    this maximum size would never occur. The packet reassembly code sets aside enough
    memory for the maximum IP packet length. When the oversized packet is reassembled,
    the extra data in the packet overflows into other'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 26 BUILDING LINUX AND OPENBSD FIREWALLS


    memory areas. The result is that it throws the operating system into an unstable
    state. The operating system desperately clamors for stability, and invariably
    ends up in the most stable state of all—dead. This is a typical of buffer overflow
    attack. We describe the process of buffer overflows in greater detail at the end
    of this chapter.


    # NOTE


    The ping program made this type of attack so easy that it became the weapon of
    choice, and ultimately the namesake of the attack method. Although PoD type attacks
    are performed with "ping," the attack could be accomplished with other tools or
    custom programs. Protecting yourself solely against "ping" requests will not adequately
    address this vulnerability.


    The best way to prevent Ping of Death is to patch your version that is not susceptible.
    The kernel will no longer attempt to reassemble packets that exceed the maximum
    length. It is very difficult to catch this attack at the firewall level because
    the individual fragments look perfectly normal. It''s only when one of the fragments
    are assembled into a complete IP packet that the problem occurs.


    # NOTE


    The only way to effectively block this attack at the firewall level would be to
    assemble every fragmented IP packet at the firewall and check to see if it''s
    too long before passing the fragments on to the destination machine. This can
    be time- and CPUconsuming, and could create problems for real-time communication
    or bandwidth intensive services. Nonetheless, most firewalls have an option for
    this.


    # Teardrop


    Along similar lines to the PoD of the Teardrop attack. Here, the fragments of
    a large IP packet overlap, instead of properly lining up end-to-end. In Figure
    2.2, packet one has an offset of 0 and a length of 10. Packet two has an offset
    of 5. This means it starts midway through the packet. The kernel attempts to eliminate
    the overlap, or if an overlapping fragment is smaller than the size of the overlap
    (as shown in Figure 2.3) the kernel finds itself in a state that it isn''t prepared
    to handle. This is lovingly referred to as a kernel panic. Kernel panics are frequently
    caused by unhappy death-like manifestations from the unfortunate recipient machine.


    These problems aren''t necessarily due to the nature of the IP protocol—they''re
    simply common holes in many implementations of the protocol. The next hole is
    actually created by a feature of the IP protocol.'
