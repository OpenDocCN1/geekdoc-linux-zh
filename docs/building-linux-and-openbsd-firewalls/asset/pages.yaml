    # Patches and Updates


    OpenBSD updates on a regular, infrequent basis (twice a year). Patches (an efficient
    way of updating large or complex programs) are provided from a central location.
    Patches always address security concerns and occur infrequently. This is due to
    the incredible strength of the current release''s security.


    On the other hand, the Linux kernel constantly updates. Continuous development
    creates security holes all the time. Keeping up with the latest Linux kernel release
    is very difficult and not always worthwhile. Release goals are primarily features
    and stability, whereas security is less of a concern. However, most updates are
    kernel level and you won''t need to do most of them.


    Sometimes, only source code patches are provided. This is a good thing—if you
    study the patch you will be able to learn about the security hole. The inconvenient
    side to this is that you''ll need to recompile affected programs when patches
    are released. The catch is that we''ll be recommending the removal of the compiler
