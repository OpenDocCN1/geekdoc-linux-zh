    the usual problem with building a firewall is getting a slow-enough processor.
    Hopefully, you weren''t thinking of trying to build a multiprocessor system. Well,
    please don''t. Red Hat 6 supports that, but OpenBSD doesn''t. Try it.


    # Memory


    The amount of memory is not likely to be your limiting requirement. Both OSes
    will run quite happily in 8 Mb of memory. However, you might wish to do something
    wild like start X (Linux and OpenBSD''s windowing system) on the console, which
    will benefit from a little more memory. The author with 48/66-32 Mb firewall often
    uses it as a ''guest'' console, allowing trusted visitors to the office with an
    email and Web terminal. We wouldn''t recommend that, for security reasons which
    we covered at the end of Chapter 3, "How Secure Be?" but just goes to show how
    little memory is needed. 32 Mb is enough for most of us. You might go to 64 Mb
    if you''re firewalling a T-1.


    Speed of memory is always worth maximizing. Memory is used by the OS as buffer
    space for all sorts of data involved in firewalling. If you''re putting another
    new system, it''s probably getting the fastest memory you can. For most modern
    systems, that means 100 MHz synchronous memory (SDRAM), often known as PCI10 memory.
    Check with your trusted vendor.


    If possible, use ECC or parity memory. Parity adds some functionality to see if
    the data in RAM have been corrupted some correction errors on the fly. ECC extends
    this functionality and attempts to correct them. If you aren''t using ECC/parity
    memory, you may get data corruption and other abnormalities. This can occur due
    to power fluctuations and related issues. Unix workstations have using parity
    (and now ECC) memory for several years in all of their product lines. Take the
    hint.


    If, despite our best advice, you decided to build a Pentium-II system, be in mind
    that the memory may come in pairs of matched SIMMs. Check with your vendor.


    # Motherboards


    At first glance, there doesn''t seem to be a lot to choose between motherboards.
    You will need one that supports the kind of processor you intend to get, at the
    clock speed that the processor supports. It will need to support the memory you
    intend to put in it, and have enough PCI/ISA slots for the network cards'
