  md: '# CHAPTER 4


    # Choosing an OS: Linux versus OpenBSD


    ![](img/2fea8bfa30d45d039dcc057b944028fc_144_0.png)


    Controversy sells. Don''t believe us? Try to avoid reading this chapter. You won''t
    be able to resist. It''s too compelling, too seductive. We hope people will use
    this chapter as kindly for the age-old “my flavor of Unix is superior” flame war.
    That''ll really boost sales of the book, since there are only a few hundred pages
    and modern-day book paper burns fast.


    If you''re like a large portion of the population, you''ve never heard of OpenBSD.
    Frankly, you''re probably confused by its prominent position in the title of this
    book. You might ask, why would anyone choose some unknown system over Linux? You''d
    be asking a good question.


    You might also be rather confused about the terminology—a lot of words in this
    section of the book look the same: Unix, Linux, POSIX, BSD, NetBSD, OpenBSD, BSDI,
    FreeBSD, etc. Some of these words refer to specific operating systems. Others
    refer to standards or conceptual frameworks. The reasons why the Unix world is
    so confusing are rooted in history, politics, and law. In fact, many of the technical
    differences among the various systems are prompted by legal and political reasons,
    rather than by pure technical merit. Therefore, in order to understand the Unix
    world a bit better, we need to take a quick look at its history.'
