    # Transparent Web Cache


    A transparent Web cache is an elegant device for people who run networks with
    many users surfing the Web. There''s a pretty good chance that many of them will
    want to go to the same Web. If people were to satisfy their requests through a
    central local server, that server would only need to go to the remote server the
