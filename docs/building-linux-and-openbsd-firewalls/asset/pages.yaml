  md: '# protocol


    You will find many of your rules are specific to a particular protocol. At the
    most basic level, you will find it convenient to deal with TCP, UDP, and ICMP
    separately. To this extent the protocol parameter is used. This parameter is usually
    used tcp, udp, tcp/udp (specifies both TCP and UDP), or icmp. You could also pass
    in any transport-level protocol that appears in /etc/protocols. Protocols like
    ftp and http are notably absent from this file, because they are application-level
    protocols, which live in /etc/services. Don''t edit the protocols file.


    # options


    You have the ability to specify one or more optional parameters that can affect
    the processing of the packet. Many of your rules will call on at least one of
    these options.


    # log


    Specifying the log option causes the packet details to be written to the logging
    system. This will only occur if the rule at hand is the last rule to match for
    a given packet. See the above discussion of logging in the action section of this
    reference guide.


    # quick


    The quick option forces the given rule to be the last rule processed for a particular
    packet. This improves performance by reducing the amount of work that the kernel
    has to perform when filtering. It is useful when blocking packets that are known
    to be bad, such as routed packets.


    # on [interface name]


    By definition, your firewall will have at least two interfaces. This option allows
    you to apply rules to packets that appear ''on'' a particular interface. This
    rule is most useful when there are more than two interfaces.


    # dup-to [interface]:<destination IP>


    This option duplicates the packet and sends the copy out from the specified interface.
    If a destination IP address is given, the kernel will change the packet''s original
    destination to the specified IP.


    # to [interface]


    The option transparently forwards the packet to the interface specified. The word
    fastroute may be used instead of to if you prefer.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'If you use more than one of these options, you should make sure they appear
    in the following order: log, quick, on, dup-to, to/fastroute.


    # Misc


    The following parameters can appear at the end of a rule. They allow you to filter
    with greater precision, using additional information present in certain types
    of IP packets.


    # with [short | frag | opt <ip option>]


    The ‘with’ keyword adds a condition to the rule that pertains to the structure
    of the packet itself. Multiple with statements can be used in a given rule. The
    ‘and’ keyword may be used as a direct synonym for ‘with’.


    short. If a packet is too short to contain complete IP header information, the
    kernel flags it. The rule, as follows, will block all inbound IP packets that
    are too short to be legitimate:


    ```

    block in all with short

    ```


    frag. ‘with frag’ matches packets that are part of a fragmented IP packet.

    <ip option>. The IP specification allows packets to contain additional options
    that can be used by routers and applications. These are called IP options, and
    are rarely used by standard Internet applications. To filter based on the presence
    of specific IP option you use ‘with opt’ followed by the name of the IP option.


    Most IP options are harmless, but there are a few (loose and strict source routing)
    which we’ll want to block. An example of a filter that blocks loose and strict
    source routed packets is:


    ```

    block in all with opt lsrr

    block in all with opt ssrr

    ```


    Note that you can specify multiple options by just stringing them after the first
    one. You can also filter based on options that are not present: use the ‘not’
    keyword before the option in question.


    # flags <flag selection>


    TCP packets contain special flags that convey additional information about the
    status of the TCP connection. One such flag is the ‘SYN’ flag, which is only sent
    during the handshake process. Another is the ‘ACK’ flag, which signifies'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Configuring the Firewall under OpenBSD


    an acknowledgment. See the discussion of the TCP''s handshake process in Chapter
    2 if you are unclear about how the handshake works.


    By using the ''flags'' parameter, you can filter based on the presence of specific
    flags and combinations of flags. There are six possible TCP flags, as shown in
    Table 9.3.


    To filter on a combination of TCP flags, simply list the first letters of the
    flags that must be present. For example, ''flags RFAS'' will require the ''RST'',
    ''FIN'', ''ACK'', and ''SYN'' flags to be active for the packet to match. If there
    are any other active flags the packet will not match the rule.


    But if you don''t care whether other flags are active? want to filter any packet
    that contains active ''RST'', ''FIN'', ''ACK'', and ''SYN'' flags—even if the
    packets also contain active ''URG'' or ''PUSH'' flags. This is done with the ''flags
    mask'', which involves placing a ''/'' after the flag list, the second list contains
    the flags we are interested in checking. To alter our earlier example, we can
    use ''flags RFAS/RFAS''. This will accomplish the goal of ignoring whether the
    ''URG'' and ''PUSH'' flags are set.


    The flag mask notation is especially useful for denoting flags that must be set.
    For example, ''flags S/SAP'' will match packets with the ''SYN'' flag, but not
    the ''ACK'' or ''PUSH'' flag. The rest of the flags may or may not be set.


    Filtering on TCP flags allows you to prevent external machines from initiating
    connections to your internal network. An example rule that would accomplish this:


    ```

    block in proto tcp all flags S/SA

    ```


    Table 9.3 TCP Flags


    | TCP FLAG | MEANING | LETTER USED FOR "FLAGS"SELECTION |

    | SYN | Synchronize a connection | S |

    | ACK | Acknowledgement | A |

    | FIN | Finishing connection | F |

    | RST | Reset the connection | R |

    | PUSH | No longer used* | P |

    | URG | Urgent packet | U |


    * The ''PUSH'' flag tells the TCP stack to flush its buffers and push all data
    to the application layer. This is done automatically by all modern TCP implementations.'
