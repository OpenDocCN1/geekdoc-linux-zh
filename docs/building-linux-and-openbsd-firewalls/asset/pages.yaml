  md: '# Network Services


    We''ve finally reached the heart of the security policy—identifying and controlling
    the services that will be provided to your users. This is most relevant to the
    rest of the book, as the decisions made here will directly affect the design of
    your firewall.


    Our first step into the world of network services brings us to a fork in the road.
    The sign pointing to the left reads; permit everything that is not explicitly
    denied. The road leading in this direction looks well paved and easy to travel
    along. There appears to be a small, dark storm cloud in the far distance. The
    sign pointing to the right says: deny everything that is not explicitly permitted.
    This pathway is overgrown with tangled vegetation and red-tape hangs off of every
    limb. You have a machete, but it looks like a lot of hard work to get down the
    road to the right. The only encouragement is the large rainbow that appears to
    end somewhere in that direction.


    Should you take the path that looks easy but lead to trouble, or should you put
    in the intense effort now for the possibility of a pot of gold? If this were an
    adventure game, you''d probably hit the Save right now. If you chose the wrong
    path, you could always re-start. Here, the wrong path could mean serious trouble
    for your network or possibly your job.


    It should be apparent by which path we are going to recommend for this book. But
    the reasoning might not be as apparent, so let''s take a look at each of these
    roads.


    # Permit Everything That Is Not Explicitly Denied


    The general concept here is to select a few things that you know to be troublesome
    and protect against them. Everything else is fair game. The advantage to this
    method is that you can be immediately fully functional. It takes very little time
    to create policy that enforces this rule, because you can always add to the denied
    list whenever a problem arises.


    Users and bosses will love you if you didn''t deny anything explicitly, then they
    have the authority to go ahead and do it. There''s always a way around anything
    that''s denied—that is, until you it and plug the hole. And therein lies the rub.
    You''re always playing catch-up. Sure, you might put in some work and block off
    all the known security holes (which would take a long time to accomplish), but
    at some point someone is going to find a new way in that you didn''t block off.
    By the time you realize what has happened, the damage may have already been done.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Maintaining security with this policy requires constant intense monitoring of
    your network and of the various security advisories. Which begs the question:
    What should you be monitoring? It''s not possible to scan every incoming and outlet
    packet, and monitoring ports is equally futile. The range of services is unbounded—which
    makes effective monitoring very difficult, if at all possible. What looked like
    an easy path in the beginning will turn out to be a stormy road to hell. This
    path is getting hyperbolic, so let''s try the other one.


    # Deny Everything That Is Not Explicitly Permitted


    In order to travel this path, you need to decide what is permitted. This means
    that you need to evaluate all the networking needs and desires of your users.
    It may help to break your users into groups based on needs. Only then can you
    make an informed and defensible (without doubt you will be attacked by a boss
    or user at some point) as to software, services, and access needed by each group
    of users.


    Along this road you''re sure to meet many of the denizens of the ether. With names
    such as TCP/IP, UDP, ICMP, ARP/RARP, BOOT/DHCP, and HTTP, they may look gloomy
    and foreboding. Have no fear—in this chapter we will be your guide, showing you
    the good and bad sides—of all the ones you''re likely to be dealing with your
    network.


    The advantage to this road is that it forces you to have an understanding of everything
    that happens on your network. Things that you don''t understand are denied and
    there''s no workaround unless you explicitly make one. Except for security holes
    in the services you''ve permitted, you don''t have to worry about your network
    being compromised through a service that you don''t know.


    One corollary to this policy is that you shouldn''t permit knowing as much as
    possible about its effects on your network. This chapter gives you some tools
    that you can use to produce new services.


    Problems with this route are that your users will not like being restricted. You
    will get a lot of resistance, especially when you decide not to permit a service
    or access that a user who has been enjoying for any period of time. Many of these
    problems can be avoided if the policy is crafted and enforced at a very early
    stage in your network''s development. If you''re not lucky enough to be at that
    point, you can look forward to some serious ahead


    From here we''ll assume you''ve sharpened your machete and rolled up your sleeves.
    Hack your way through a few vines and meet us in the next section. We''re about
    to get technical. We''re going to dissect the common protocols'
  merge: -1
