    Once you figure it out, you can use the command `ps auxw | grep service_name`
    to try to figure out which services are running and what their PIDs.


    Keep stopping demons by commenting lines out of inetd.conf unless there are few
    network listeners as possible. This will immunize the machine against workload
    demands on nearly all TCP and UDP ports. Packets which make it beyond the firewall
    rules will find that nothing is waiting for them on the other side. The result
    is that they''ll get dropped on the floor.


    # Routing


    It would be remiss of us not to dwell on routing tables, at least briefly. You
    can set up your firewall perfectly (all of your firewall rules correctly in-line,
    proper masquerading/NAT, FORWARD_IPV4 to “true,” for example) but if your routing
    tables are wrong, packets won''t flow. Before we can claim that our firewall is
    finished, we''ll need to make sure the routing tables are correct.


    Generally, you should never have to play directly with the routing tables. Many
    of the programs used to configure your firewall directly affect the rout'
