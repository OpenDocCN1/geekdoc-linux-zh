  md: '# The ABCs of Network Security


    Make sure that people are not fooled into parting with. No user should need to
    disclose passwords, particularly not by telephone or email. Tell your users that
    they should not be disclosing passwords, even to people who claim to be authorized.
    It is very easy for a cracker to get a password by calling some poor peon in the
    systems group, pretending to be the VP of sales and shouting at them until the
    peon changes the VP''s password. Make sure staff who are authorized to change
    passwords have a clear policy about how people should request changes. Tell them
    that it is okay to tell anyone to go through the proper channels if they''re trying
    to sidestep those channels. Be prepared to take the heat when the CEO is infuriated
    because some systems group peon refused to let him read his own email. We mean
    it.


    # What''s a Good Password?


    Sorry, can''t tell you. We can tell you, though, some characteristics of a bad
    word. Bad passwords include:


    +   - Any word or words in any language that can be represented in the roman alphabet

    - Any word or words varied by changing letters into numbers, and/or suffixing
