  md: '# # IPChains Reference


    The following is a listing and description of every single flag that can be used
    to modify the behavior of the ipchains command. Many of these flags are not needed
    to build most firewalls, but if you ever find wondering how to do such-and-a thing,
    this section may give you food for thought. This information can also be found
    by typing “man ipchains”, but it’s ordered differently—function, not alphabetically.
    We hope this is also a useful resource for you.


    **A:** Appends a rule to a chain.


    **b:** A rule with this bidirectional mode flag will match packets in both directions
    (i.e., swapping source and destination).


    **C:** Checks a given packet against the specified chain. If you’re not sure something
    would be allowed through, specify the parameters of a test packet with the -s,
    -i, and -p flags, and other flags if you need them. Ipchains whips up test packet
    according to these specifications and runs it past the specified chain, telling
    you if it would be allowed in or not.


    **D:** Deletes the specified rule. This can be either a rule number (do a listing
    with -L, and counting) or the rule itself.


    **d:** Specifies the destination of a packet. The remainder of the argument is
    an IP address, with an optional mask; the mask is separated from the address by
    a slash. You may also specify a port or a numerically sequential range of ports;
    the port information is separated from the address or address/mask combination
    by a space; if a range of ports is given, the start and end values are separated
    by colons. Examples are:


    +   - d 1.2.3.4 matches the destination address 1.2.3.4

    - d 1.2.3.0/24 matches the destination addresses 1.2.3.0-1.2.3.255 inclusive

    - d 1.2.4.6 1023 matches the address 1.2.4.6 but only if the port is between 1
    and 1023 inclusive


    Before the address negates the address/mask criterion; before the port or port
    range, if present, negates the port criterion. These may be combined to negate
    both criteria. Example:


    +   - d !1.2.3.0/24 56:78 requires that the destination address not be between
    1.2.3.0 and 1.2.3.255 inclusive, AND that the destination port be between 56 and
    78 inclusive


    **destination-port, -dport:** Specifies only the destination port of a packet.
    a numerically sequential range may be specified, as shows under -d, in the'
  merge: -1
