  md: '# OpenBSD


    Our first three filters are blanket filters that cover all packets. This is equivalent
    to setting a default policy in IPChains. Add these lines to the /etc/ipf.rules
    file:


    ```

    block in log all

    pass out all

    ```


    The ''log'' ensures that any inbound packets that are not matched by any other
    rules will be logged.


    The following lines will accept all packets on the internal interface (eth0) and
    loopback interface. If your internal interface isn''t eth0, change the code accordingly.
    You can use "ifconfig -a" to check which interface has which address.


    ```

    pass in on lo all

    pass in eth0 all

    ```


    From now, when we get ipf rules, it is implied that these rules should be added
    to /etc/ipf.rules. When the ordering of the rules becomes important, we''ll make
    note of the relative position that a rule should have in the file.


    # Stopping Blatantly Hacked Packets


    There are few packets that we should never see on the firewall. These packets
    do not occur naturally in the world. They include spoofed packets that pretend
    to originate from an internal machine, unroutable packets destined for your internal
    network that should never have made past the prior router, and various flavors
    of evil packets exist only to cause pain and torment.


    The only reason you''d see these packets is if someone was playing naughty games.
    If you follow these highly suggested rules, the last sound the trespasser hear
    before their packets are unceremoniously kicked out the front door is the "Ka-click!
    of an eBun intruder dispatch packet arming itself (see Chapter 12, "Loose Notes",
    for further explanation and/or new addiction).


    # Protecting Against Spoofed Internal Packets


    You should always forbid inbound packets from the outside world that are intended
    for the private networks. They should not be routed to you in the first place.
    Likewise, you should never see packets coming into the external interface that
    appear to have originated from within your private network. These rules apply
    to other unroutable IP addresses—such as the loopback'
