  md: 'The first S indicates that this rule will match TCP packets with only the ''SYN''
    flag—not the ''ACK'' flag. The ''/SA'' means we don''t care about the status of
    any other flags—this rule applies only to the ''SYN'' and ''ACK'' flags.


    # icmp-type <message-type> [code <code-type>]


    This must be used in conjunction with the option proto icmp. It allows you to
    specify a particular type of icmp message. For example, you could use it to block
    all echo-request messages:


    ```

    block in proto icmp icmp-type 8

    ```


    Certain ICMP types have additional information that is conveyed with a code number.
    For example, ICMP type 3, the ''destination unreachable'' ICMP message, would
    use code 1 to signify ''host unreachable,'' or code 0 to show ''network unreachable,''
    among others. You could permit ''port unreachable'' messages, being code 3, to
    leave your network with the following:


    ```

    pass out proto icmp all icmp-type 3 code 3

    ```


    # keep [state | frags]


    The keep option can speed up the processing of TCP connections by keeping track
    of TCP sequence numbers. Once a TCP connection has been established, additional
    packets with the correct sequence numbers will be allowed through the firewall
    without passing through the filter. Keeping state does not protect your network
    against hijacked TCP sessions. In fact, it may be slightly more vulnerable, since
    the hijacked packets do not ever pass through the filter—keep state has okayed
    the data stream short-cuts all processing and shoves the packets through. We recommend
    the judicious use of keep state; it has value, but it is not secure.


    We do not recommend ''keep frags'', which tracks fragments of an IP packet. If
    the filter allows the fragment, it will automatically pass through any other fragments.
    This can be very dangerous and is not necessary for average operation. In this
    day and, IP fragmentation is not all common, since most TCP/IP stacks are smart
    enough to avoid creating large IP packets.


    # head <group id>, group <group id>


    The head and group options are used to create group rules. This allows the creation
    of complexity and optimized firewall rules. The ''head'' of a group is a generic
    rule. When you create the generic rule, add ''head'' followed by a number. Now
    you can use the ''group'' keyword to further filter packets that only match the
    generic ''head'' rule. For example:'
