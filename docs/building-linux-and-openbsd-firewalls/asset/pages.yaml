- img_proc: true
  md: '# How Secure Should Your Network?


    services that are built upon TCP and UDP. For each one we''ll look at what they
    do and which programs are standard components. Then we''ll look at the various
    networking requirements. Finally we''ll look at the insecurities presented by
    these protocols and services, with an eye toward how hackers can use them to compromise
    your network.


    # Domain Name Translation


    Life on the Internet would be pretty dull if every site was only accessible by
    its IP address. It''s hard to imagine Yahoo! becoming popular if they had to advertise
    as "204.200.71.68" This section will describe the system that allows your Web
    browser to translate a domain name like www.yahoo.com into an IP address such
    as 204.200.71.68.


    # DNS: The Domain Name Service


    The DNS is what turns names like www.yourcompany.com, which humans can read, into
    numbers 127.145.13.68, which routers can route. It''s pretty hard to function
    on the Internet without it. In the simplest form, your ISP will tell you the IP
    addresses of their DNS server or servers, you will plug this into all your clients,
    and name resolution will just happen. In a more complex form, you can run a caching
    name server on your local network, which does exactly what the ISP''s name servers
    do, remembers the result. If a second client on your network asks for the same
    name to be resolved shortly after the first client, the caching name server can
    produce the answer from its own memory without having to go out on the Internet
    and ask. In the most complex case, you run your own name server which lets the
    outside world resolve names inside your domain; this will usually act as a caching
    name server for your internal clients as well.


    DNS is also responsible for reverse-resolution—taking the question "what host
    has the IP address 127.145.13.68?" and answering "www.yourcompany.com."


    It''s not the job of this book to tell you how to set up a DNS server. If you
    want to know more, a very good book on the subject is DNS and BIND by Paul Albitz
    and Cricket Liu (O''Reilly, 1998). Suffice to say that to permit simple through
    a firewall, you need to permit UDP packets either to or from port 53 on the machines
    you use at your provider to resolve DNS requests. If you run a name server for
    your own domain and you have secondary servers outside your internal network,
    you need to permit TCP to and from port 53 between your name server and your secondary
    name servers as well.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Problems Associated with DNS


    DNS, like all services, is subject to the usual guard of buffer overflows and
    denial-of-service attacks. Keeping an eye out for your DNS server in CERT (the
    Computer Emergency Response Team) advisories (see Chapter 12) is prudent. DNS
    also suffers from a more serious vulnerability in that it can be lied to. When
    your client asks DNS to resolve, "cert.org" to an IP address, your system tends
    to believe the answer. It is possible, although cumbersome, to generate false
    replies to DNS requests, which may be believed. Because this requires some skill
    as well non trivial control over your upstream ISP service, it''s not common.
    If it were to, though, someone would have almost arbitrary control over your access
    to the Internet—mail could be redirected. Web requests could be sent to the oddest
    places; in general, bad things could happen.


    # How to Make DNS Secure


    If this possibility worries you, you can always hard code important IP addresses
    in your local /etc/hosts file. This has unpleasant consequences if, for example,
    your ISP decides to change the IP address of your mail server, which you have
    hard coded. Alternatively, read RFC (Request For Comments) 2065, which deals with
    authenticated, verified DNS using public-key cryptography. You can find RFC 2065
    at, inter alia, www.isi.edu/in-notes/rfc2065.txt. Support for secure DNS exists
    in BIND 8, which can be found at www.isc.org/. Most of us, however, just tend
    to hope no one hacks the DNS.


    # Email


    Email is, in many ways, the Internet''s herald. Even totally paranoid companions,
    who fear an Internet connection as they fear little of human origin, tend to make
    arrangements to get email in and out of the company. One of your authors has worked
    at a bank where email was sent to a central server machine, which dialed up the
    outside world using a 9600 baud modem and used UU (the venerable and inscrutable
    Unix-to-Unix Copy Program) to copy tarfiles full of mail in and out of the company,
    which were then unpacked and sent on to the recipients. The latency on this was
    enough to make grown men weep; and yet, it was almost unusably slow. And yet,
    it was faster than snail mail, and you could send things without printing out,
    so it was used. Email gets everywhere.'
  merge: -1
  pgno: 95
