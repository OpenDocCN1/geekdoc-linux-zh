    # X/VNC/NFS/SMB


    Alphabet soup! These are four protocols that it is always wise to block explicit-ly
    going out. Some of these have a tendency to broadcast things that you wouldn''t
    want to release to the outside world, others are just bad news. Assuming eth0
    is your internal interface, block them as shown in the code below. The lines are
    in the same protocol order as in the section heading. Note that the third line,
    NFS, isn''t guaranteed to work. Chapter 3 pointed out that NFS can theoretically
    run on just about any unused UDP port, and the RPC portmapper manages the whole
    scenario. However, nearly all the nfs ends up on port 2049, just block it (insert
    swoosh here).


    # Linux


    ```

    iptchains -A input -i eth0 -p tcp --dport 6000:6010 -j DENY

    iptchains -A input -i eth0 -p tcp --dport 5900:5910 -j DENY

    iptchains -A input -i eth0 --dport 2049 -j DENY

    iptchains -A input -i eth0 --dport 137:139 -j DENY

    ```


    If you have used rules such as those in Basic Policies above to permit traffic
    coming into the firewall from eth0, you will need to put this rule before Basic
    Policy rules in your firewall script; otherwise, this rule will never take effect.


    # OpenBSD


    Note that there are spaces after the word ''port'' and before and after the "><"
    operator in the following rules. If you don''t put in the spaces the rule won''t
    work.


    ```

    block in quick on eth0 proto tcp from any to any port 5999 > 6011

    block in quick on eth0 proto tcp from any to any port 5899 > 5911

    block in quick on eth0 from any to any port = 2049

    block in quick on eth0 from any to any port 136 > 140

    ```


    # Masquerading/Network Address Translation


    The dictionary defines a masquerade to be an assembly of persons wearing masks.
    We''re pretty sure this weird concept originates from the British. Frankly'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'there''s no other conceivable explanation. In our particular context, masquerading
    is hiding one or more IP addresses used on an internal network behind one or more
    globally valid IP addresses. Others greatly prefers this definition. One of the
    authors is galloping around the English country-side screaming “I’m Batman” and
    therefore cannot be reached for comment. It must be something in the currency.


    In the context of Linux and OpenBSD firewalls, masquerading (also known as Network
    Address Translation in the OpenBSD world) is more precisely hiding one or more
    internal network addresses behind one globally valid IP addresses. If any of this
    is news, refer to Chapter 3 and reread the IP Masquerading section. Please, take
    mask off.


    Assuming you’re using the private range 192.168.1.0/24 on your internal network,
    IP Masquerading can be achieved with the code in the next section.


    # Linux


    IPChains automatically uses the address assigned to your external interface when
    masquerading. You only need to specify the addresses on your internal network
    that should be masqueraded. There is currently only support for masquerading behind
    one IP address.


    ```

    ipchains -A forward -s 192.168.1.0/24 -d ! 192.168.1.0/24 -j MASQ

    ```


    # OpenBSD


    Network Address Translation under OpenBSD works somewhat differently than IPMasquerading
    under Linux. With NAT, you map a range of internal IP addresses to a range of
    external IP addresses. If the ranges are not of equal size, you will need to use
    the portmapper. The portmapper will map an internal tcp or udp connection to an
    arbitrary port on an arbitrary IP address within the range specified.


    How does this help? Let say you have 100 internal machines that all have Web browsers.
    Each Web browser’s source port is likely to be the same. Now ipt has to map each
    of these requests to an external address and With the port mapper, each request
    is mapped to a unique IP address and the source port remains the same. This means
    you’d need at least 100 real IP addresses to handle all 100 connections simultaneously.
    On the other hand, if you had just one IP address, the portmapper would change
    the source port on each outbound connection but would use the same IP address
    for all of them. Since there are slightly less than 64000 tcp and udp ports available,
    one IP address could support many simultaneous outbound connections.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'The following example shows ipnat mapping all connections from the internal

    192.168.1.0 subnet to the external IP address 1.2.3.4. The portmapper is use to

    map tcp and udp connections. All protocols (ICMP, IGMP, for example)

    are mapped directly to the external IP address 1.2.3.4.


    ```

    map ppp0 192.168.1.0/24 -> 1.2.3.4/32 portmap tcp/udp 1025:65000

    map ppp0 192.168.1.0/24 -> 1.2.3.4/32

    ```


    OpenBSD also allows you to masquerade behind multiple IP addresses. This is

    particularly useful once your network accesses a large number of machines. To

    do this, use a larger range of IP addresses in the map command.

    this example shows your internal subnet being mapped to the real

    addresses range 1.2.3.1-1.2.3.254.


    ```

    map ppp0 192.168.1.0/24 -> 1.2.3.4/32 portmap tcp/udp 1025:65000

    map ppp0 192.168.1.0/24 -> 1.2.3.4/32

    ```


    # I Can Do Anything


    Don''t try to fly out of a 20th century window. At least not until your first
    real

    incursion. You have all the tools you need to create packet-filtering firewalls
    of

    arbitrary complexity. You might still be daunted by the precise combina-

    you need, To help with this we have put sample firewalls on

    the book''s companion Web site at www.wiley.com/compbooks/sonnenreich.

    Our firewall scripts make extensive use of variables which are all assigned at

    the beginning of the script. But don''t worry, we''ve heavily commented every-

    thing, you should be able to beat them into submission with ease. Just don''t

    get away with the beating. Modern-day firewalls are much more sen-

    sitive to abuse than the brick ones of yesterday.


    There are three scripts: One is for moderate security without a DMZ,

    another is for moderate security with a DMZ, and the third is for high security

    with a DMZ. There''s also a skeleton file which you can use to create your own

    firewall. Each script is designed to be placed in the appropriate location on

    your system, as described in Chapters 7 and 9.


    Whether you use one of our scripts or you write your own, you''ll need to make

    sure''s executed when the system boots. The following are instructions for

    ensuring that the firewall code is loaded when the system boots.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Linux


    System startup files live in /etc/rc.cd/init.d. Your firewall script file should
    be placed in /etc/rc.cd/init.d/firewall. Then, work out which init level normally
    runs at by doing a "grep initdefault /etc/initab". You''ll get something like
    this:


    ```

    # 0 - halt (Do NOT set initdefault to this)

    # 6 - reboot (Do NOT set initdefault to this)

    init:3:initdefault:

    ```


    The last line is the important one (note that the first two are comments—the leading
    # gives away). The ''id:3'' means that this particular configuration runs at init
    level 3 by default. The other common init level is 5. Whichever init level is
    your default, cd to the startup directory /etc/rc.rc.N, where N is your default
    level, and execute the command:


    ```

    ln -s ../init.d/firewall S09firewall

    ```


    From now on, when you boot, your firewall should start up automatically. You can
    check this in practice by doing "ipchains -L -v" after the system has booted.


    # OpenBSD


    The first step is to place your firewall rules script in the right directory.
    It needs to be called ipf.rules and should be located in the /etc directory. Likewise,
    any NAT rules you have should be called ipnat.rules and also should be placed
    in the /etc directory.


    The next step is to tell the system to read the files when it boots. Edit the
    file /etc/rc.conf and look for the line that starts with ''ipfilter=''. Change
    it to read "ipfilter=YES".


    Finally, edit the file /etc/sysctl.conf and make sure there''s a line that says
    "net.inet.ip.forwarding=1". If it''s equal to 0, change it to 1. If it''s not
    there, add it. This line enables NAT.


    The next time you reboot, your filtering rules will take effect.


    # Tying Things Down Tighter


    You''ve now got a working firewall. The firewall rules will prevent the outside
    world from reaching any services that happen to be running on your firewall'
