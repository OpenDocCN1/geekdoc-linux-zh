  md: '# How Secure Should Your Network?


    More than one small network administrator has found himself or herself sharing
    more than he or she wanted the neighbors.


    # Newsgroups


    If you''ve been using the Internet for a few years, you have probably looked at
    newssgroups. Newer users have also probably seen some part of the system without
    even realizing it. It takes Internet newbies alike to realize that there''s more
    than the Net email and the Web. A first encounter with the newsgroups is likely
    to be through a Web-based interface to a particular newsgroup or through an organization
    whose Web page explains how to participate in their newsgroup. Regardless of how
    you learn about the newsgroups, invariably you will be blown away by the sheer
    amount of information being exchanged.


    Newsgroups are basically bulletin boards. The difference between newsgroup and
    some Web-based discussion boards is that the postings to a public newsgroup are
    all over the Internet. Posting to a Web board is only available on that particular
    Web site.


    The framework of the newsgroups is a giant hierarchy, much like the way the Web
    is set up. Top-level groups have names like "alt," "rec," "comp," and "org," and
    so forth. These are conceptually equivalent to the "com," "net," and "org" domains
    on the Web, although it''s possible to create new top-level newsgroup domains
    by running your own server. Underneath these top level names there are thousands
    of specialization topics. For example, under "comp" there are "sys," "os," "mail,"
    "lang," and others. These topics break down many more times, resulting in group
    names like: comp.unix.bsd.openbs and comp.security.unix. Each level has numerous
    branches, and sometimes the topic is very vague until you get down past the third
    branch; looking for keywords within the tree of newsgroup names is an effective
    way to find a group that discusses a particular topic.


    # NNTP: The Network News Transfer Protocol


    Unlike email, netnews has a single protocol that deals with reading, posting and
    transmitting news. It''s called the Network News Transfer Protocol (NNTP). An
    NNTP server normally runs on TCP port 119. The reference implementation is "inn.",'
  merge: -1
