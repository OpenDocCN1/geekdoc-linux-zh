    # BIOS Tweaking


    The BIOS, or Basic Input/Output System, is the chip on the motherboard that serves
    as a repository for all sorts of settings relating to the low-level hardware configuration.
    It provides access to the floppy, CD-ROM and hard drives and enables the operating
    system to communicate with other peripherals, such as the keyboard, mouse and
    printer. It is responsible for everything that happens to the point where an OS
    is loaded from either the floppy, CD-ROM or hard-drive. As such, you will need
    to work with it in order to enable booting off of the CD-ROM. We''ll give you
    a general overview here; you can learn more about BIOS at www.sysopopt.com/biosdef.html.


    When you first boot a PC, hitting the key will usually bring you into the BIOS
    configuration screen (your motherboard you may use a different key—check the manual).
    There are two BIOS configuration settings necessary to enable CD-ROM booting.
    You need to let the BIOS know that you have a CD-ROM drive in the system. This
    is often accomplished from a configuration screen with a title that''s something
    along the lines of “Standard CMOS Setup.” If you don''t see this option, look
    for “IDE,”HDD,” or “Hard Disk/Drive.” The screen you want should have a table
    with four rows (sometimes this is in the initial screen or is across the top bottom).
    The first column should read: Primary Master, Primary Slave, Secondary Master,
    Secondary Slave.


    If your CD is connected as Primary Slave, then you need to make sure the value
    for the TYPE column is set to “CD-ROM” or “AUTO” if there is no “CD-ROM” value.
    Every BIOS interface is designed differently, so please refer to your motherboard
    manual if your BIOS configuration screen doesn''t match this description, or if
    you''re excessively confused.'
