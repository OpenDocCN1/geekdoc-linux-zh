    in, when you say “activate the ruleset”, you should execute this command). Now
    try to telnet once again. This time, the telnet client should return immediately
    with an error message that says “Connection refused.” Any other TCP connections
    to the machine will be likewise rejected.


    Another type of message that can be returned is an ICMP error. This is useful
