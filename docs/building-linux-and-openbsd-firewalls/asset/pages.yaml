- img_proc: true
  md: '# What to Do Your CD Drive Isn''t Recognized


    The easiest way to do a network install is via FTP. Install an FTP server on the
    other computer (if it''s a Windows box, we suggest using one of the many good
    FTP servers, such as WAR-FTPD). Make the CD-ROM drive accessible by anonymous
    FTP login (OK to use any anonymous FTP, since you''re just connecting these two
    machines to an isolated hub—just make sure turn off the FTP server when you''re
    finished). Connect the network and the FTP server to a hub. Select appropriate
    IP addresses for the FTP server and the firewall. Make sure they''re within the
    same subnet. Now when you''re asked to choose an installation method, select FTP.
    Specify the FTP server by its IP address. Give the installer path to the CD-ROM
    drive and it should make the connection. If the FTP install doesn''t seem to work,
    look at the FTP server. Does the server show a connection? If not, the server
    may not be properly installed or the IP address you gave might be incorrect. If
    it does show a connection, the problem might be an incorrect path or a bad username/password
    combination.


    After you finish installing and reboot, you should see if OpenBSD detects the
    CD-ROM drive. If not, you should definitely return the drive and exchange it for
    a new one. Don''t buy Mitsumi drives—they tend to create lots of problems. Once
    you''ve installed the new drive, try doing a full install again. If it boots and
    finds the CD, then you''re doing much better!


    active development. These programs are distributed as source code and compiled
    as needed. The unusual aspect of the ports tree is that the source code for a
    given program is downloaded from its author''s Web site during the installation.
    The tree itself is simply an index of what''s available. When you go to a directory
    in the tree for a program you need, simply typing “make” will cause the ports
    system to download the necessary source code, compile it, and install it—all automatically.


    What we''re dealing with is the disk set method. Disk sets are basically gzipped
    tarballs (a collection of files archived using the tar program and compressed
    using gzip) that are extracted in the / directory. The problem with this is it''s
    an all or nothing approach—either you take all or none of the files in a disk
    set. To make matters worse, there is no standard method for uninstalling a disk
    set later on. This is OK because well is installing programs that you''ll want
    to leave on the system. For the truly adventurous, your benevolent authors have
    provided you with a tool for managing disk sets after the installation (you''ll
    find it on the companion Web site). You can send us praise and thanks, but we''d
    prefer money.'
  merge: -1
