    connected to the internal network. Furthermore, it shouldn''t contain information
    that could hackers compromise other parts of the network. This includes user names,
    passwords, network hardware configuration information, and so forth.


    +   It must not contain anything you can''t bear to lose. Any important files
    placed on the DMZ should be read-only copies of originals located within the network.
