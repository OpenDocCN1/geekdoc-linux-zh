  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    If your external interface isn''t ppp0, change the code accordingly. Technically,
    the interface specification isn''t required because we''ve already allowed all
    packets coming from the internal and loopback interfaces. However, we find it
    helps focus the mind on the purpose of the rule, and there''s no real harm in
    specifying the interface.


    # Linux


    In the following rules, the ''-b'' flag stands for bidirectional, which means
    it will match packets from either or to the IP address range specified.


    ```

    # first take care of standard unroutables

    ipchains - Input -i ppp0 -s 255.255.255.252 -b -j DENY

    ipchains - Input -i ppp0 -s 127.0.0.0/8 -b -j DENY

    # now let''s deal with the internal networks

    ipchains - Input -i ppp0 -s 10.0.0.0/8 -b -j DENY

    ipchains - Input -i ppp0 -s 172.16.0.0/12 -b -j DENY

    ipchains - Input -i ppp0 -s 192.168.0.0/16 -b -j DENY

    ```


    # OpenBSD


    With OpenBSD, NAT takes place before filtering. The filter sees the network address
    as the destination address for all inbound packets that have passed through NAT.
    This means that at the filtering level there''s no way to distinguish between
    a normal inbound packet that has passed through NAT and an inbound spoofed packet
    that has been created to have an internal destination address going through NAT.
    This means that a spoofed packet could technically pass through your firewall
    rules.


    This might seem like a security hole at, but it really isn''t that bad if you''re
    using portmapping properly (although it could be better). When NAT sees the spoofed
    packet it doesn''t know how to deliver the packet because it routes packets internally
    based on the portmapping table—not the IP address of the inbound packet (which
    is usually that of the firewall). When it looks up the spoofed packet''s port
    and source address in the table it finds nothing and drops the packet. While there
    be sophisticated ways to gain enhanced access by taking advantage of this issue,
    for the most part it''s not to lose sleep over. Future versions of IPFilter may
    allow you to specify whether NAT should occur before or after filtering.


    ```

    # first take care of standard unroutables

    block in log quick on ppp0 from 0.0.0.0/32 to any

    block in log quick on ppp0 from 255.255.255.252 to any

    block in log quick on ppp0 from 127.0.0.0/8 to any

    block in log quick on ppp0 from any to 0.0.0.0/32

    block in log quick on ppp0 from any to 255.255.255.252 to any

    block in log quick on ppp0 from any to 127.0.0.0/8

    ```'
