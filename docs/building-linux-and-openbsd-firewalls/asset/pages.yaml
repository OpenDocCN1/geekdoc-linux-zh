  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    # TIP


    Appropriate security strikes the right balance between “secure enough to be safe”
    and “insecure enough to be usable.”


    # Internal Security


    Threats come from both inside and outside of your company. Frequently, the combination
    of both is what creates a real security breach.


    The average user is not actively concerned about security. Security becomes a
    concern when it creates inconvenience for the users, or when there’s a security
    breach that directly and negatively impacts the users. Because of this, a system
    administrator can’t assume that users will ever think about how their actions
    affect the security of the network. In fact, the average user will probably lean
    toward security, since it’s more convenient.


    What prevents this leaning is your security policy. In its simplest form, this
    is a list of things users should do and things they must not do. This list should
    be written down and easy to find. A good security policy will keep security breaches
    to a minimum.


    Preventing problems is always a thankless job. The better you do your job, the
    less anyone knows about it. Users will undoubtedly complain about the inconveniences
    of your policy, saying “nothing has ever happened, so why are you worried?” The
    proper response is to repress the desire to smack them simply and explain that
    the reason nothing has happened is because of the security policy they’re trying
    to subvert. If they pull rank, or try to go over your head for the issue, make
    sure you have a very clear paper trail of your strong opposition to it. You don’t
    want to be under it. A good security policy also helps keep itself intact—it’s
    easier to enforce something that clearly, in black and white, applies to everyone.


    This book is primarily about firewalls, so once we leave Chapter 1, we will not
    be concerned with internal security. But protection against threats from inside
    is very often overlooked. Internal security should not be overlooked, and this
    part of the book is where we don’t overlook it. If you choose to ignore it, you
    have only half a security policy. When discussing internal security, we will give
    concrete recommendations when possible. However, not all organizations are identical,
    and we have tried to break down recommendations into “home office,” “small business,”
    and “larger installations.” Practices that everyone should comprise the first
    set. The second set is practices that apply to a network of 10 to 20 computers.
    The third set is not so much advice to enormous corporations as are practices
    you should progress to as time and resources allow, ideas to get you thinking
    about how security can progress'
