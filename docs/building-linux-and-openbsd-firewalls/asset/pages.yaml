    # HTTP


    If you''re a control freak, and you want to prevent people from making outgoing
    Web connections, you could do it as follows. In each section the first rule is
    a blanket restriction on outgoing Web connections. The second rule is a restriction
    on one particular external address, 1.2.3.4. You would use the second form to
    interdict one particular Internet site. The third rule, when used with the first
    rule, will let you selectively browsing of approved sites. eth0 is to be the internal
    network interface; modify your configuration.


    # Linux


    ```

    ipchains -i eth0 --dport 80 -j DENY

    ipchains -i eth0 -d 1.2.3.4 80 -j DENY

    ipchains -i eth0 -d 1.2.3.5 80 -j ACCEPT

    ```


    > NOTE If you have used rules such as those in the Basic Policies section above
    to permit all traffic coming into the firewall from eth0, you will need to put
    this rule before those Basic Policy rules in your firewall script. Otherwise,
    this rule will never take effect.'
