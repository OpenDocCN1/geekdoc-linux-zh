- img_proc: true
  md: 'appears in /etc/named.conf. If you have managed to make your name server communicate
    on port 53, you can tighten the rules shown in the preceding section as in the
    following subsections.


    # Linux


    ```

    ipchains -A input -i ppp0 -p udp -s 1.2.3.4 53 --dport 53 -j ACCEPT

    ipchains -A input -i ppp0 -p tcp -s 1.2.3.4 53 --dport 53 -j ACCEPT

    ipchains -A input -i ppp0 -p udp -s 1.2.3.5 53 --dport 53 -j ACCEPT

    ipchains -A input -i ppp0 -p tcp -s 1.2.3.5 53 --dport 53 -j ACCEPT

    ```


    # OpenBSD


    ```

    pass in on ppp0 proto tcp/udp from 1.2.3.4 port = 53 to any port = 53

    pass in on ppp0 proto tcp/udp from 1.2.3.4 port = 53 to any port = 53

    ```


    Rules for nameservers running other than forward-only mode are outside the scope
    of this book, as is a discussion of what "forward-only" means. Still, you should
    be able to adapt the rules to suit your needs.


    # SMTP


    If you''re running a mail server inside your firewall, you will want to allow
    connections to it, otherwise you''re not going to get any mail. On the other hand,
    you will want to reject connection attempts to ident, as discussed in Chapter
    3. Assuming your mail server has a real IP address, which is 1.2.3.4, and that
    your external interface is ppp0, you can do this as shown in the next two subsections.


    # Linux


    ```

    ipchains -A input -i ppp0 -p tcp -d 1.2.3.4 25 -j ACCEPT

    ipchains -A input -i ppp0 -p tcp -d 1.2.3.4 113 -j REJECT

    ```


    # OpenBSD


    ```

    pass in on ppp0 proto tcp from any to 1.2.3.4 port = 25

    block in quick on ppp0 proto tcp from any to 1.2.3.4 port = 113

    ```


    If you''re running a mail server inside your firewall and using IP Masquerading,
    you will need to permit inbound SMTP, deny inbound ident, and forward the SMTP
    connection to the appropriate internal private address. Assuming that your internal
    mail server is 192.168.1.99, that your external interface is ppp0, and that your
    external fixed IP address is 2.3.4.5, you can do this as shown in the following
    subsections.'
