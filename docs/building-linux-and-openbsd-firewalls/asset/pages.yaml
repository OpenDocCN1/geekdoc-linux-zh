- img_proc: true
  md: '# How Do Undo that Last Mistake?


    The u command will undo the last command. Some versions of vi, such as the one
    that ships with Red Hat Linux (which is really vim—Improved) have multiple levels
    of undo. With vanilla-flavor vi only get to mess up once, and you need to catch
    it immediately—pressing a second time undoes the undo and puts the mistake back!


    # How Do I Cut, Copy, and Paste?


    In every program you''ve ever used, cut and paste works almost in the same way:
    Highlight a region of text, hit cut/copy, move to where you want to put it, and
    hit paste. Simple enough. The problem with vi is that there''s no way to highlight-text,
    since vi came well before the concept of highlighting. The vi system works as
    follows: Tell it whether you want to cut or copy, and move the cursor to the end
    of the region. The catch is that the movement must be the result of a single motion.
    This means you can''t use the arrow keys to move because each tap of the arrow
    key is a separate motion (holding the key down doesn''t help either). If you try
    to use the arrow keys, you''ll just pull one character.


    So what do we do if we want to yank a large region of text? Take a closer look
    at the How Do I Move Around section. We can use any of these commands to get to
    where we want in a single motion. Let''s try cutting a single word. Go for yank.
    Hit e to move to the end of the word. You might even see something on the bottom
    of the screen saying you''ve yanked a few characters. Great! Now let''s paste
    the word somewhere and hit the p character. Your word should be inserted under
    the cursor. If we wanted to cut the word, we would have first hit the lowercase
    d character for delete and then e. Once, p can be used to paste the text somewhere
    else.


    Just as you used the e character to move to the end of the word, you could have
    used } to move to the end of the paragraph, or } back a sentence. But if we want
    to copy an arbitrary region of text, for example, from the middle of one sentence
    to the middle of another a few sentences later? The easiest way to accomplish
    this is by pulling a trick with the search command.


    First, go to the end of the region you want to copy or cut. Hit d to cut or y
    to copy. Then type the first few letters of the start of the region. Hit return
    and voila! You''ve just grabbed your text. As an example, we''re going to alter
    the following text:


    Free to look. Unless you want to lose your hand DO NOT pet the animals.'
  merge: -1
  pgno: 364
