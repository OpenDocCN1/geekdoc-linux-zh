  md: '# OpenBSD


    pass in proto udp from aaa.bbb.ccc.ddd to any port = nnn


    # ICMP


    To permit an arbitrary ICMP packet of message type iii, coming from host aaa.bbb.ccc.ddd,
    the generic forms are shown in the following sections.


    # Linux


    ```

    ipchains -A input -p icmp --dport iii -s aaa.bbb.ccc.ddd -j ACCEPT

    ```


    You can add the ''-d'' flag to control destination IP address, if need be, and
    several other flags (as documented in Chapter 7). To deny the packet and drop
    it on the floor, replace "-j ACCEPT" with "-j DENY".


    # OpenBSD


    pass in proto icmp from aaa.bbb.ccc.ddd to any icmp-type iii


    There are certain classes of message type which would be well advised to permit.
    At the least you should allow your firewall to receive them. Type 3 should be
    permitted to enable certain network-level discussions to happen correctly; type
    0 should be permitted if you want to be able to use the ping program to check
    the availability of hosts outside your network, and type 11 should be permitted
    if you want to be able to use the traceroute program to check similar things.
    You''ll notice that your network cannot be pinged from the outside - we consider
    this to be a good thing. If you feel differently, you''ll also want to allow icmp
    type 8 through the firewall. Our suggestions can be permitted with the following
    code; to modify ppo correctly.


    # Linux


    ```

    ipchains -A input -i ppp0 -p icmp --dport 3 -j ACCEPT

    ipchains -A input -i ppp0 -p icmp --dport 0 -j ACCEPT

    ipchains -A input -i ppp0 -p icmp --dport 11 -j ACCEPT

    ```


    # OpenBSD


    ```

    pass in on ppp0 proto icmp all icmp-type 3

    pass in on ppp0 proto icmp all icmp-type 0

    pass in on ppp0 proto icmp all icmp-type 11

    ```'
