  md: 'Next, you''ll be asked to choose a method of assigning host addresses. Select
    Static and hit <CR>. Give the IP address you''ve selected, and the appropriate
    netmask. If you''ve decided to do masquerading, and to use 192.168.1.1 address
    for your firewall''s internal interface, the appropriate values for these are
    192.168.1.1 and 255.255.255.0. Since this is your default gateway, you need to
    leave the "default gateway" box here blank, but when you set up other machines
    on your network interface, you will tell them 192.168.1.1 (or if you''ve picked
    another address, the address you chose) their default gateway. If you have an
    internal nameserver, enter its IP address in the "primary nameserver" box; otherwise,
    enter the IP address of your ISP''s name server (DNS server).


    Select OK and hit <CR>. This takes us to screen name of the network parameters
    setup. If you are lucky enough to have a real domain name, enter it in the first
    box. If not, leave the first box blank. Your hostname goes in the second box.
    If you have a real domain name, you will need to talk to the person who administers
    your DNS to get the hostname properly. If, as is the case for most of us, you
    don''t have a real domain name, think of a catchy hostname and enter it in this
    box.


    If you entered a domain name in the first box, it will be automatically pasted
    into the second box. The cursor will be put at the beginning of the domain name
    in the hostname box. This is OK. As a brief example, if you enter the domain name
    "foo.bar" in the first box, when you leave the "foo.bar" will be automatically
    pasted into two box, and the cursor will appear before the leading dot. If you
    decide that "fnord" makes a catchy host name (well, there''s no accounting for
    taste), you would type "fnord" in here, the second box reads "fnord.bar".


    Should you have more than one internal DNS server already, or should your ISP
    have more than one server, you can enter secondary and (available) tertiary DNS
    servers in boxes three and four. Again, enter them by IP address, not by name.
    and hit <CR>.


    # Section 6.3


    Now, you need to select your time zone from the list provided. The box at the
    top, regarding whether your machine clock keeps GMT, is a little more confusing.
    The terse answer seems to be that most modern motherboards observe local time,
    and the time shifts in autumn and spring, and thus do not keep GMT. So don''t
    select "Hardware Clock set to GMT" at this time. If this assumption turns out
    to be wrong, you can change it later by editing the file /etc/sysconfig/clock
    and changing the line "UTC=false" to read "UTC=true".


    Select OK and hit <CR>. (We''re not going to say this any more, by the way).'
