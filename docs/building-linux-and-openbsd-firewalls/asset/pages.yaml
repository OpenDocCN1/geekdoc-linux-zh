    firewall this is probably a waste of resources.


    # Conditions


    What sort of conditions can you impose upon a rule? You can discriminate based
    on many different aspects of a packet: where it comes from, where it''s going
    to, what kind of IP protocol is it, what source or destination port is (in the
    case of UDP and TCP), or what kind of message is it (if it''s ICMP). You can also
    discriminate based on the particular interface a packet wishes to enter (for the
    input chain) or leave (for the output chain). How just discriminating you can?
