  md: '# Section 6.4


    Choosing services to start on reboot is a bit like partitioning discs; you can
    have holy holes about it. Our opinion is that you should select the following,
    and deselect all other, services: atd, crond, gpm, inet, keytable, network, random,
    syslog. You need these to get things running properly; the other services provide
    only potential security holes.


    # Section 6.5


    Don''t configure a printer. This is a firewall, not a print server.


    # Section 6.6


    It''s worth taking a few minutes to think about setting a root password. The usual
    rules apply: No words from any language, no variants on any such words—don''t
    think mixing a couple of numbers into a word makes it secure. Our recommendation
    would be to take a book down off bookshelf, pick a sentence at random, and use
    the initial letters of that sentence. Don''t pick a famous sentence. Don''t open
    the book at page one. Don''t use the book you''re currently reading (this book!)
    and don''t leave this book next to the one you choose, either. If you need to
    highlight or underline the sentence as an emergency reference if you forget the
    root password, that''s OK (well, it''s better than writing the root password down
    on a piece of paper, anyways). Pick a good one and spend a little time fixing
    it in your memory.


    # Section 6.7


    We would strongly recommend enabling "Use Shadow Passwords" and "Enable NIS,"
    and disabling "NIS." Shadow passwords help by storing the encrypted away from
    public view, and MD5 passwords help frustrate dictionary attacks by allowing you
    to pick passwords of more than eight characters (conventional Unix permits passwords
    of more than eight characters, but ignores every character from the ninth onwards).
    Enabling NIS, the Network Information Service, would delegate authority who can
    and can''t log in to the firewall to some other server. Nobody but you should
    be logging in the firewall. Since NIS is insecure, enabling it is not a good idea.


    # Section 6.8


    If you have a spare preformatted floppy, we would also recommend creating a boot
    diskette. The floppy doesn''t need to be blank, but anything on it will be erased.
    Don''t overwrite the Red Hat boot floppy by mistake (as we often do).'
