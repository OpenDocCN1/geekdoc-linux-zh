  md: '# CHAPTER 8


    # Installing OpenBSD


    ![](img/2fea8bfa30d45d039dcc057b944028fc_234_0.png)


    Consider yourself fortunate. You are embarking on an exciting journey of discovery.
    You will be facing challenges that have brought highly skilled administrators
    to their knees, with tears flowing into their pocket protectors. You will tread
    forward, over the backs of those whom fear has crushed. Your bravery comes from
    the eternal source that has likewise emboldened the hearts of humanity''s most
    cherished heroes: You have nothing to lose.


    Many people embark on the quest to install OpenBSD with the desire to retain an
    existing operating system on a portion of their hard drive. These poor souls take
    each tiny step knowing that one wrong move means lengthy recoveries from backup
    files. Our deepest sympathies go to the novices, who assume that a recovery from
    backup is the worst case scenario (if they didn''t backup, they''re about to win
    a one way trip to hell). The reality is that Windows has a host of little chicken
    and egg problems, which means that loading the recovery program can be more difficult
    than one would expect. This is especially true when the recovery program realizes
    that the OpenBSD installer has changed the partition table (more on that in a).


    Not that setting up a dual OS with Linux is a stroll in the park either unless
    that is in Cambodia or Kosovo. Those who are using Linux with LILO (Linux LOader
    the default boot loader for Linux) are in a rather harsh surprise when the inevitable
    wrong move happens. LILO is very sensitive to'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'the way the hard disk is set. Once you''ve played with the partition table,
    it can become unbelievably difficult to get LILO to respond to anything short
    of a shotgun blast to the drive-head. There is a road to recovery, but it is a
    windy mountain road that''s only one car-width wide, has deep potholes everywhere,
    and a convoy of 18-wheeler logging rigs driven by inebriated monkeys coming the
    other way.


    You, on the other hand, couldn''t care less if you make a mistake during the install.
    You can wipe the hard-drive time and time again with reckless abandon each time
    you splatter your experience all over the partition table. You are also working
    with a very simple system consisting of the most basic hard-ware. There''s little
    chance of deconflict.


    Think you can install the right first time through? Don''t even bother. You should
    do a full install at least twice, and walk through the upgrade procedure at least
    once. The best is now time to play around and figure out everything works. The
    knowledge will really pay off when you''re 4:30 A.M. and your network is being
    torn apart by a bunch of teenagers. Playing with the installer a few times now
    will ensure that you aren''t confused in the future. Take good notes and keep
    them near the firewall at all times.


    # But First...


    Suggestion number one: Read this chapter once before actually attempting to install
    OpenBSD. They tried to teach us to do that in school, but we never listened. To
    this day, we still get bitten in the rump by it. Speaking of roast,, last week,
    one of the authors was making a frittata with sundried tomatoes, asparagus, and
    possibly mushrooms. At the bottom of the recipe, it said to immediately the pan
    into a preheated oven for a few minutes until the top is golden brown. Two problems
    suddenly appeared: 1) the oven hadn''t been preheated because there was no early
    mentioning of it; and 2) the handle of the pan for cooking the frittata was plastic.
    Excessive application of grated romano cheese saved the frittata (we like romano),
    and even improved the non-slip grip of the pan by becoming partially embedded
    in the molten plastic base. With lessons like that, it''s no wonder we never learn.


    Suggestion number two: Print some of the critical online documentation and read
    it through at least once (many potential problems have been documented—if you
    read it now you''ll recognize problems a faster later on). It''s also really helpful
    to have it in front of you on paper—plus you can make notes. The key docs are:'
