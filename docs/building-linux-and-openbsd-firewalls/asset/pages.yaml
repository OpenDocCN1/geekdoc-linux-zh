- img_proc: true
  md: 'OpenBSD makes a great platform for highly sensitive or exposed servers, such
    as Web servers, FTP servers, or internal NFS servers. It is important to remember
    that OpenBSD''s security will only protect you against operating system level
    attacks. There are plenty of opportunities for security holes in Web server software
    and FTP software. NFS might be secure from buffer overflows, but that won''t protect
    you if you make a configuration error that allows anyone to read/write all of
    your files. With other OS, you''ll still have to monitor your application''s security
    closely.


    Linux is definitely a better choice for machines that need extended features,
    rather than security. This includes desktops, development machines, and file/application/database
    servers. While OpenBSD can run Linux software, the lack of support and thorough
    documentation makes it more difficult to use. As an example, the Red Hat 6 distribution
    makes it easy to run a nice desktop environment such KDE or GNOME. With OpenBSD,
    you just get X Windows with the distribution. It''s up to you to get GNOME or
    KDE running.


    # Flame War


    Both Linux and BSD have advocates. Some of these are intelligent people. Others
    consider the opposing camp to be the enemy and are constantly trying to convince
    everyone that their operating system is superior. Initially, there was undoubtedly
    strong resistance to Linux among the BSD community. They were worried it would
    pull developers away from their own operating system, resulting in fewer software
    packages for the BSD platform. The intelligent developers quickly found an intelligent
    solution to the problem: They made their systems compatible with Linux. Now, BSD
    organizers tell developers to write for the Linux platform first, then port to
    BSD if desired. Their logic is that Linux has a larger user base, so the developer
    will find a larger population of interested beta-testers and codvelopers. Because
    BSD can run Linux programs, the amount of available software will still increase.
    Eventually, if high performance on a BSD platform is desired, one will port the
    software to BSD.


    # Summary


    OpenBSD is a remarkable endeavor. Its existence almost illustrates its value,
    given the saturated marketplace for free Unix-based operating systems. When OpenBSD
    began, Linux was already gaining popularity, and NetBSD and FreeBSD were well
    established. OpenBSD was able to convince many users from both camps to switch
    over on the basis of its heightened security alone.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'That said, OpenBSD is not for everyone. A portion of the security was obtained
    by removing unnecessary programs from the core distribution. This can make it
    less user friendly than Red Hat. It is often used as the foundation for firewalls
    and other systems where the emphasis is on security rather than features. It does
    not make a very good desktop system, and isn''t the easiest system to configure.
    Most of its users are very competent in Unix administration. There is very little
    in the way of documentation. This can be especially frustrating for Linux users,
    who have long been spoiled by the vast wealth of well-organized and easily accessible
    documentation.


    Linux is the Operating System juggernaut of the 1990s, and one of the largest
    distributed software projects ever. It''s poised to lead a revolution in the way
    software is developed. Red Hat provides a convenient package with lots of helpful
    features for beginners and expert users alike. It is constantly in development,
    with components undergoing daily to weekly updates.


    That said, Linux is not for everybody. If security is of high concern, you''ll
    want to go with OpenBSD. Linux machines are high-profile targets in the script-kiddie
    community. Security problems are often discovered only after they have been exploited.


    From here, you are now ready to choose the hardware for your system. The next
    chapter will steer you through the treacherous waters of hardware compatibility
    issues.'
