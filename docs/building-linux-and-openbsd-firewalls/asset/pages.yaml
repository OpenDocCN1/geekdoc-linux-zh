    On the topic of VPNs, it''s worth mentioning IPSec—the IP Security Protocol. This
    is a rather aqua of protocols: the Authentication Header (AH) and the Encapsulating
    Payload (ESP). It is used to create a secure IP level tunnel between two networks.
    This is a relatively new protocol, which is governed by an official standardization
    board, and is quite a hot area of development. There are open source implementations
    for both Linux and OpenBSD. OpenBSD actually contains a built-in VPN solution
    that uses IPSec. It is still in development, but it''s pretty cool nonetheless.
