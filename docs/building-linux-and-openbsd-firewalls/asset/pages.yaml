    more of a bind. A number of good ssh clients are commercial and/or closed source.
    SSH Communications Security (www.ssh.fi) is the commercial entity that sprung
    from the original development effort. They provide the latest version of ssh on
    a license basis. It''s still open, but it''s no longer freeway. Datafellows (www.datafellows.com)
    offers a full-featured set of ssh tools, but at a price. Cedomir Igaly''s ssh
    program (www.doc.ic.ac.uk/~ci2/ssh) is free, but is closed source.


    The best open source ssh client that is fully featured is the Mindright Java client
    (www.mindbright.com/english/technology/products/mindterm/) The advantage of Mindterm
    is that you can run the same client on any platform. It has all the features you
    need, and it''s GPL''d. Programs will have the core ssh client functionality was
    designed as a library. This makes it very easy to embed ssh functionality into
    your applications. The only downside is that Java is still somewhat slow on Windows.
    The code has been extended to make it easier to tunnel. The Mindterm code and
    its extensions are available on the companion Web site.


    # Problems Associated with ssh


    Attacks on ssh rely on cryptographic techniques. Every once in a while, someone
    finds out that an encryption algorithm thought to be secure has some problem that
    allows it to be cracked some way other than brute force. Alternatively, a couple
    thousand hackers link their computers together over the net and decide to crack
    a few weakly encrypted keys. Things like this happen; keep up with your patches
    and watch for unusual gatherings of nerds.'
