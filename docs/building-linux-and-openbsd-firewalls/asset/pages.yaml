- img_proc: true
  md: '# OpenBSD


    The flag filtering capabilities of IPFilter, combined with the ''keep state''
    option give us a better and more secure way of handling this situation. We''re
    going to block all inbound requests to initiate a connection (flags S/SA). In
    the strange event that something manages to get through that rule, we''ll block
    the inbound responses to such a connection also (flags SA/SA). Finally, we''ll
    allow all inbound responses to connections initiated from an internal machine
    (keep state).


    ```

    block in on ppp0 proto tcp flags S/SA

    block out on ppp0 proto tcp flags SA/SA

    pass out on ppp0 proto tcp keep state

    ```


    # Blocking Particular TCP Servers/Services


    You may wish to prevent machines on your internal network from accessing certain
    TCP services on the Internet. Let suppose you wish to block port 80 to prevent
    Web browsing across the firewall from your internal network. Here''s how to do
    it. In this example, eth0 is taken to be the internal interface; you should modify
    accordingly.


    # Linux


    ```

    ipchains -A input -i eth0 -p tcp --dport 80 -j DENY

    ```


    > If you have used rules such as those in "Basic Policies" above to permit all
    traffic coming into the firewall from eth0, you will need to put this rule *before*
    those Basic Policy rules in your firewall script. Otherwise, this rule will never
    take effect.


    # OpenBSD


    ```

    block in on eth0 proto tcp from any to any port = 80

    ```


    # UDP


    To permit an arbitrary UDP packet directed to port nnn, coming from host aaa.bbb.ccc.ddd,
    the generic forms are shown in the following sections.


    # Linux


    ```

    ipchains -A input -p udp --dport nnn -s aaa.bbb.ccc.ddd -j ACCEPT

    ```'
