  md: '# Flush the Chains


    Step one is to get us to a known, good state. Issue these commands:


    ```

    ipchains -F input

    ipchains -F output

    ipchains -F forward

    ```


    The ''-F'' flushes all rules from the specified chain; the combination of these
    three commands flushes all of the built-in chains.


    Step two is to set the policies. Issue these commands (yes, case is important):


    ```

    ipchains -P input ACCEPT

    ipchains -P output ACCEPT

    ipchains -P forward ACCEPT

    ```


    The ''-P'' flag sets policy for the specified chain. We’ve set all three built-in
    chains to ACCEPT. This is equivalent to going down the "accept everything that
    is not explicitly denied" road, described in Chapter 3. When we build the real
    firewall, we will avoid death and destruction by starting with a more restrictive
    policy.


    Step three is to see what we’ve done. At any point you can show the state of your
    rules and chains by typing


    ```

    ipchains -L -n

    ```


    The ''-L'' lists the rules for the specified chain (or all chains if none is specified),
    the ''-n'' flag presents all IP addresses as dotted instead of trying to reverse-resolve
    them back to domain names. That distinction isn’t important now as we don’t have
    any addresses in our chains, but as we add rules this becomes important. If you
    omit this, it can take a long time to get the output, as you must wait for each
    DNS reverse-resolve to time out—it’s better to get into the habit of using it
    now. In any case, this is what you see:


    ```

    Chain input (policy ACCEPT):

    Chain forward (policy ACCEPT):

    Chain output (policy ACCEPT):

    ```


    Simple, eh? Three chains, three policies, no rules. Just what we asked for. Now
    it gets tougher. (However tough it gets, you can come back to this section and
    perform these three steps to return your firewall to sanity.)'
  merge: -1
  pgno: 215
