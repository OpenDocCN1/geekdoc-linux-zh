    # NOTE


    You can''t set policies for user-defined chains. You also can''t invoke the built-in

    chains as targets for user-defined chains.


    User-defined chains constitute the exception to the first-match-wins-and-

    ds-the-game rule. The previous paragraph told you how a packet passes

    from one chain to another when a rule in the first chain specifies a second

    chain as the rule''s target. We will call the first chain the *calling chain*,
    and the

    second chain the *called chain*. If you call a user-defined chain, and the packet

    dn''t match any of the rules in the user-defined chain, the packet is

    passed back to the calling chain (remember that there is no policy to a catch-

    all, as there would be with a built-in chain). The packet re-enters the calling

    chain at the rule after the one that sent it to the called chain. If a packet
    running

    through a called chain matches a rule inside that chain that has the target

    RETURN, the same thing happens—the packet is immediately passed

    back to the calling chain, returning to the rule following the one that sent it

    away.


    The function of user-defined chains is to allow very complex sets of rules to
    be

    moved off into their own chain for clarity and modularity of thought. How-

    ever, we have rarely come across chains so complex as to benefit from this kind

    of modularization. On the other hand, user-defined chains do have certain

    uses in accounting. And by large, we would generally advise you to steer clear

    of user-defined chains; the examples in this chapter are written entirely with

    built-in chains.


    # Practical Chain-Making


    We''ve covered the theory. Now we''ll cover the practice. In order to manipulate

    your kernel''s chains, you need to execute " /bin/su - ", give the root

    password, and away we go.


