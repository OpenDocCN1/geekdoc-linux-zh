  md: '# A step-by-step guide to building a commercial-grade firewall with open source
    software


    # Building Linux and OpenBSD Firewalls


    It''s now more important than ever to protect your data and computers from people
    trying to hack into your network. Without the proper security, the wrong person
    can gain access to your system and read critical documents, change data, delete
    items, and much worse. With this book, you''ll quickly learn how to protect your
    network from such attacks as you build a Linux or OpenBSD firewall. Determining
    how much security you''ll need to configure the firewall and monitoring your system,
    authors Thomas Yates and Wes Sonnenreich clearly guide you through all the necessary
    steps to improve your security.


    They show you how to:


    +   - Build Linux and OpenBSD firewalls that meet your security needs

    - Choose the appropriate hardware for each operating system and put the machine
    together

    - Configure a firewall that allows network services such as email, news-groups,
    and intranet access

    - Monitor and update your system to close any holes in security

    - Detect intruders and restore your network security


    WES SONNREICH is CTO of //programmarket, an Internet marketing-service for the
    pharmaceutical industry. Wes is also President of the Sonnenreich Corporation,
    Inc., an Internet solutions consulting company. Clients include Inflection and
    the Boston Medical Center. He is the author of several books, including Web Developer
    Guide to Search Engines (Wiley) with Tim Mancinta.


    TOM YATES, ten years in hacker, believes passionately in comprehensively understanding
    open source-based technology. He is CTO of Gatekeeper Technology LTD, specialists
    in open source network and security solutions in Cambridge, UK.


    The companion Web site at www.wiley.com/compbooks/sonnenreich features:


    +   - Updates for the most recent releases of OpenBSD and Red Hat

    - Useful scripts and tools

    - Sample firewall configurations

    - Additional online resources


    Wiley Computer Publishing Timely. Practical. Reliable.


    Visit our Web site at www.wiley.com/compbooks/


    JOHN WILEY & SONS, INC.

    New York • Chichester • Weinheim

    Brisbane • Singapore • Toronto


    ISBN 0-471-35366-3 54499


