    CD in the other machine and perform the install over the local network. It''s
    a lot faster than FTPing the files from the Internet!


    # Burn-In (or Burning?)


    Once it boots from the floppy drive or the CD-ROM drive, everything is fine. Put
    the rest of the hardware in, check that it still boots, and leave it running over
