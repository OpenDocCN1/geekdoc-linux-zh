- img_proc: true
  md: '# Implementing Your Security Policy


    In this section we''re going to look at each of the protocols described in Chapter
    2. We''ll talk bit about the issues involved in letting the protocol through the
    firewall, and we will give example code that either permits or explicitly denies
    the protocol. Each example will contain code for IPChains (Linux) and IPFilter
    (OpenBSD). But first, we need to set some default policies and stop some blatantly
    evil traffic.


    # Basic Policies


    We''ve chosen to start with a default policy of DENY (block) for packets coming
    in, and ACCEPT (pass) for the other policies. What will this do? It will cut the
    firewall off from the world. Sure, anything can go out or through the machine,
    but nothing can initiate a connection or a packet through it, it is dead in the
    water. This isn''t too helpful, so we''ll add some short rules that allow machines
    on your internal network less restricted access to the firewall. We''ll also allow
    the loopback interface access, since that''s necessary for the system to work
    properly.


    # Linux


    Flush the chains:


    ```

    iptchains -F input

    iptchains -F output

    iptchains -F forward

    ```


    Chain policies: deny input, permit output and forward.


    ```

    iptchains -P input DENY

    iptchains -P output ACCEPT

    iptchains -P forward ACCEPT

    ```


    Accept all packets on the internal interface (eth0) and loopback interface. If
    your internal interface isn''t eth0 change the code accordingly: You can use "ifconfig
    -a" to check which interface has address.


    ```

    iptchains -A input -i lo -j ACCEPT

    iptchains -A input -i eth0 -j ACCEPT

    ```'
