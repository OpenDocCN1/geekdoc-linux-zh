  md: 'Our last bit of advice on the topic: Stay simple for now. Use the basic dual-homed
    host until you''re comfortable with it. Then you can approach the more complex
    topologies with skill and confidence.


    # Other Thoughts on Security


    The classic clueless-user damage comes from viruses. If a virus makes its way
    into your network (and it''s not the job of a firewall to stop it), the damage
    can be disastrous, and can potentially open up security holes to boot. There are
    three ways in which a virus can get onto your network:


    +   - A user deliberately creates it on a local machine

    - It comes in on a disk

    - It comes in from the Internet


    Nothing can protect you from the first situation. A good desktop virus scanner
    can protect you from the second, as well as some strong policies about installing
    software (must be checked by system administration first, etc.). The third is
    the hardest to protect against. Most Internet-based viruses do the bulk of their
    damage before the major virus protection companies can update their software to
    recognize the virus.


    After desktop virus scanning, good internal host security is your best general
    defense against virus damage, because it minimizes the damage a virus can cause.
    Not letting ordinary users edit system files, a policy Unix applies by default
    and NT can be made to apply, helps an awful lot here. Discretionary control on
    network resources does much of the rest. A recent popular virus attempted to delete
    any files it could find on any local or network-attached file stores; a Certain
    Large Company, which set up its file store for documentation that any doc writer
    could read and write any doc file, lost the lot when hit by that virus.


    # User Management


    One holy grail sought by firewall managers, as opposed to firewall administrators,
    is to limit access by certain people to certain network services. Before you allow
    anyone to convince you to do this, you need to realize that user-level restriction
    is a huge filled with many fat and slimy worms. Don''t open it if it''s not absolutely
    necessary.


    If you must offer different Internet services to different users, there are a
    few ways of accomplishing the task. One of the most common (yet least secure'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'methods is filtering based on internal IP address. This method assumes that
    the user logs into only one particular machine and no other users can access that
    machine or that IP address. This is a bad assumption. It''s hard to enforce, and
    requires updating the filters any time someone changes or moves machines about.
    This approach is totally useless if you are also using a dynamic IP assignment
    system within your network.


    Another approach is to set up proxy servers with user authentication. If you''re
    really lucky, you may be able to tie your central authentication system into the
    proxy authentication. This means that a user would only have to log in once—the
    proxy server will be able to authenticate the user automatically using some sort
    of token or ticket framework. Good luck putting off—maybe in a few years by Kerberos
    (a highly secure authentication system developed at MIT) meets the Windows standard.
    Until then, your users will probably have to log into the proxy server every time
    they wish to access a proxied service. Said will be much happier about this if
    their client software fully supports proxy servers. This means the client software
    can cache the authentication information so that the user only has to log in the
    first time they connect, or after an extended idle period. Note that this authentication
    information is stored in a retrievable format on the user''s machine. This is
    a significant security concern. If the client software can read the authentication,
    a hacker can also


    The advantage to the proxy server approach is that it gives fine-grained, user
    level control over Internet access. It is also an application-level firewall tool,
    which offers added security. Some proxy servers may be able to perform useful
    services such as antivirus detection. The disadvantage is that the access list
    needs to be maintained independently, which just adds another item to the system
    administrator''s workload. It also makes accessing the Internet very complicated
    for the people who are authorized to so. One of the best ways to persuade management
    not to try to enforce such complex restrictions is to show them how complex it
    will make their lives.


    # Back Orifice: A Worst-Case Illustration


    An important point to keep in mind all of this is that any form of Internet access
    creates considerable security risk, regardless of how tightly you think you''ve
    secured your network. We''ll illustrate with a hack that will blow through every
    security measure you build.


    Joe User is browsing the Web using a Windows-based machine and goes to Sam Evil''s
    site. Sam''s site contains a browser-based exploit (Web code that takes advantage
    of flaws in popular browsers), which causes a buffer overflow on Joe''s machine.
    The code that Sam executes installs a program'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# How Secure Should Your Network?


    called Back Orifice onto Joe''s machine. Once installed, Sam''s version of Back
    Orifice (BO) is undetectable by any existing virus detection program. This is
    because BO runs in the background, and Windows has no way of detecting programs
    that are running in the background. Furthermore, the BO program file can go by
    any name. It is important important that Sam also has the source code to BO (it''s
    freely available) and has altered the program so that existing BO detectors can''t
    see his version.


    BO looks at Joe''s machine and sees that it''s connected behind an IP-querying
    firewall. The only service Joe can access is the Web. BO tries to connect Sam''s
    server through the Web, but is stopped by the proxy server, which asks it for
    authentication. This doesn''t deter BO, which has been programmed to handle this
    situation. It simply waits for Joe to log into the Web and captures the keystrokes
    as he types in the password (on Windows machines BO has access to absolutely everything
    that is happening). Now BO can access Sam''s machine whenever it wants via HTTP,
    because it has the authentication information it needs to pass through the proxy
    server. HTTP provides more than two-way communication flexibility for Sam, even
    though theoretically there is no direct route from Sam''s machine to Joe''s machine.
    Lest you think this is only a Web-based attack, BO can be delivered via email,
    either as a Trojan attachment or as a direct exploit (meaning that you don''t
    have to read the mail for the exploit to work) for any of the main client clients.
    Social engineering can also be used to get BO installed if all else fails.


    Could this have been avoided? The only way is to not run Windows on machines that
    have direct or proxied access to the Internet. Only allow this sort of access
    through a DMZ machine. If the DMZ machine is "owned" by a hacker, it shouldn''t
    make it any easier to access your internal network. Keeping Windows off the DMZ
    machines will help protect you against BO-style attacks, it''s no magic bullet
    either.


    If you must provide full network access, make sure that the user''s machines are
    running only the minimum services needed. Log all traffic to and from proxy servers.
    Inspect the logs by hand once a week. Soon you''ll recognize patterns, and you''ll
    be able to spot any anomalies that could hide hacker activity.


    You also need to make sure that you are running the most recent versions of their
    Internet clients. Do not use Internet Explorer as a Web browser—which has many
    security flaws both in the design and in the implementation. Instead, we recommend
    using an open source browser such as Mozilla. If you must go with a commercial
    browser, then use the latest versions of Netscape or Opera, because you''ll cut
    down on a large number of security risks. Likewise, do not use Active desktop
    or any other type of unnecessary Web-frill technology such'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    as ActiveX, Java, Shockwave, Flash, Splash, JavaScript is heavily used throughout
    the Internet—disabling it will break a number of important Web sites. It''s best
    to turn it off by default and enable it only when necessary.


    # A Word on Java


    It is true that malicious Java applets can be created. Newer Java virtual machines
    (VM—the system that enables Java programs to run) protect against these malicious
    applets. Unfortunately, the VM integrated into older versions of Netscape and
    IE are susceptible to certain malicious applets. Because of this, we recommend
    disabling the browser''s internal Java VM support.


    On the other hand, we feel that Java is an important tool for dynamic content.
    You can have the best of both worlds by using the Java Plug-in. This is a browser
    plug-in from Sun Microsystems (the makers of Java) that enables you to use the
    VM of your choice with the browser of your choice. The result is that you can
    always run the latest Java without having to wait for the browser manufacturer
    to upgrade your system.


    Of course, the Java Plug-in may have some security problems itself, but as a plug-in
    it''s fairly easy to upgrade. Thus far, the plug-in has been fairly stable.


    Finally, there''s always the option of not running Windows at all machines inside
    your LAN. Linux is slowly becoming a viable desktop system, and it''s far less
    susceptible to these types of attacks. You owe it to yourself at least to see
    what alternatives are available.


    The moral of our story: Don''t assume that you can outsmart a hacker. The skilled
    and determined hacker can find a way to compromise almost any system. In fact,
    there is some value in not going overboard with your security. There are two levels
    of hackers: recreational and professional. The recreational hackers will be stopped
    by a well-designed firewall. The professional hacker will blast through anything
    you can dream up. The goal is to keep your site from being a professional hacker''s
    target. Often pros break into secure sites just to prove that they can. By not
    bragging about your ultra-secure site, you will reduce the likelihood of being
    a target of this sort of attack. On the other, if someone hires a pro to hack
    your site for a specific reason, there is little you can do. Hope that your security
    measures buy you enough time to detect the intrusion and find a way to shut out
    the hacker. In the worst-case scenario, just think about deep sea diving. Divers
    always carry a knife on them they get tangled in a cord or need to cut themselves
    free. Likewise, you should always keep a pair of wire cutters handy.'
