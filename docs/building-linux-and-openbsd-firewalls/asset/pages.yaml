  md: '# The Web


    What on earth could we say about the World Wide Web that hasn''t already been
    said, or better yet, posted on the Web itself? Fire up a browser and go look.
    However, for this book, the Web server protocols are our concern. It must be stressed
    that this section is in no way an attempt to tell you how to set up a Web server.


    # HTTP: The HyperText Transfer Protocol


    HTTP servers normally run on TCP port 80. We''ve used the phrase normally in most
    of the protocol sections in this chapter when discussing port bindings, but in
    most cases it''s pretty mandatory. There''s nothing to prevent you from compiling
    a mail server that runs on port 5037, but don''t expect to get too much mail—no
    else will know how to find your server. HTTP, however, genuinely allows a server
    to run on any port because the general format of an HTTP URL looks like “www.company.com:81/page.html?”
    It''s the81 after the colon that specifies the port number. If none is specified,
    as is usual, the default is port 80. There''s nothing to stop you from running
    a Web server on port 81, or 1999, or 8080, or 60003 for matter. If the URL a browser
    follows contains your server and its port number, your server will be found.


    # Problems Associated with HTTP


    The HTTP protocol by definition is an insecure protocol, that is, there is no
    authentication, and no encryption of data. HTTPS, provides for an encrypted data
    stream and authentication of the server, but it is up to the HTTP client and server
    to figure out how to authenticate the client. This is often done via an HTTP form
    that collects a username and password from the client. On the back end, either
    the Web server or a program processes the data.


    Dynamic pages are the most prolific source of web security problems. Back-end
    form processing scripts are notoriously riddled with buffer overflow problems.
    Hidden HTML tags are also occasionally used as a shortcut when building dynamic
    pages. This can create significant security problems by revealing crucial access
    data to hackers. A poorly written form handler script can give a hacker all they
    need to compromise an entire network.


    There are no major flaws in HTTP itself, although there are plenty of problems
    with any particular HTTP server implementation. Each day it seems as if another
    teenager finds a new way to break into Microsoft Web servers. Netscape server
    security holes are found less often. This doesn''t mean'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# How Secure Should Your Network?


    Netscape servers have fewer holes though. Many hackers are looking for bugs in
    Microsoft products with the sole intention of discrediting Microsoft. Hackers
    tend to feel sympathetic to Netscape and generally don''t look for holes in Netscape
    products—unless they''re trying to break into a system.


    So your choice is a system with lots of highly published security holes, or a
    system that may or not have security holes that only hackers know. Not too appealing,
    is it? Luckily, it''s a better option. It''s called Apache (www.apache.org/),
    and it''s the most commonly used Web server for the Internet for some good reasons:
    It''s free, open source, and it does everything a Microsoft or Netscape server
    can do and more—but faster, better, and with less security holes. Tough sell,
    huh?


    # How to Make HTTP Secure


    Hopefully you''re running Apache as your Web server. For some reason you''re not
    allowed to run Apache, lie to management and run it anyway. They''ll never notice
    the difference. Actually, if they notice anything, they''ll be complimenting you
    on the increase in stability andter performance. Okay, we''re done pushing Apache.


    There are some general steps you can take to improve the security of any Web server,
    especially others other than Apache. The first step is to make sure you''re running
    the latest version of the Web server. The second step is to make your server has
    no more access to the system it absolutely needs. Under Unix systems, you can
    prevent the Web server from accessing critical resources by running it as if it
    were a user with very low privileges. Essentially the Web server only needs to
    be able to view a few files in a limited selection of directories. There is no
    reason for it to be able to execute arbitrary user programs. Finally, you should
    turn off every feature you can. Turn each feature back after you know what it
    does. Let''s take a look at a few of these features.


    If you configure your server to permit it, client Web browsers can activate executables
    on your server via the Common Gateway Interface (CGI). This feature can lead to
    many problems. Any CGI script you allow to run on your server must be carefully
    checked for potential security holes—buffer overflows, file permissions, and the
    security hole in a CGI script could compromise your entire server. It makes sense
    to keep your CGI scripts and executables outside the Web document hierarchy. This
    is because any file inside the document tree can be read by the HTTP server process
    and will be served to a browser on request (barring separate security precautions).
    If your CGI scripts live inside your document tree, people can retrieve them,
    read them, and look for security holes at their leisure.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    There are numerous alternatives to using CGI for dynamic content. One popular
    alternative is pre-processed HTML, used by tools such as Java Server Pages (jsp),
    php, Cold Fusion, and Microsoft Internet Information Server. Instead of loading
    a plain HTML page, the web server is configured to load more complex pages that
    include programs within them. For example, a j page might be mostly Java code.
    The output of the Java program creates the HTML that is sent to the end user.


    The advantage to pre-processed HTML is that arbitrary programs are not executed
    at the system level. Instead, the pre-processor is responsible for interpreting
    the programs directly from the source code. Since the programs reside on the server
    in source code form, an administrator can always look at the code to see if any
    violations are occurring. Furthermore, a well-written processor will not poorly
    written pages do bad things to the system.


    If you run a Web server, you will need to allow the Internet to access TCP port
    80 on your server. While it''s possible to choose another port, it''s not a great
    idea if you want your site to be easily accessible. On the other hand, don''t
    assume that using an obscure port number will make the site private or secure.
    It is trivial to determine what ports are running Web servers given an IP address.
    Ensuring that no publicly accessible pages link to private URLs adds a marginal
    degree of security against the casual surfer, but this technique is mostly worthless
    against a professional hacker. You can gain far greater security by protecting
    your private pages or running a private Web server inside the firewall.


    # HTTPS: Secure Web Service


    This is probably a bit of misnomer in a book on network security. There exists
    a subsidiary protocol called HTTPS, or Secure HTTP. This normally runs on TCP
    port 443, and provides for secure, authenticated connections between browser and
    client. Authentication is one-way—the client browser is the server who says it
    is, but the server still knows very little about the client. The security here
    merely means that both client and server can be sure that nobody eavesdropping
    on or changing the data being sent across the network. From a network security
    viewpoint, exactly the same concerns apply to HTTPS servers and the content they
    serve as to HTTP servers.


    # Web Clients


    To make people feel more comfortable about using the Web, Microsoft and Netscape
    have both spent a lot of advertising dollars on convincing the public of their
    product''s security.'
