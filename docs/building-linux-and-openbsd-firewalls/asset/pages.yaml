  md: "# What's in an IP address?\n\nAn IP address looks like this:\n18.62.2.61\n\
    The IP address is composed of four 8-bit numbers (0–255 in value), which are called\
    \ octets, separated by dots. Using this system, there are 4 trillion possible\
    \ IP addresses. It would obviously take a very powerful computer to store the\
    \ route to all of those addresses. Therefore, a method of grouping these addresses\
    \ was devised.\n\nThere are three basic groupings, which are known as Class A,\
    \ B, and C networks. The first IP address number (18 in our example) happens to\
    \ specify a particular Class A network. Only 128 A networks are possible, specified\
    \ by a first number between 0 and 127. Over half of these groupings are reserved\
    \ for special purposes. The rest are available only to governments and large organizations.\
    \ The reason for this is that a Class A holder has control over all of the addresses\
    \ that are formed from combinations of the three octets. Each Class A network\
    \ contains 16.7 million individual addresses. Massachusetts Institute of Technology\
    \ (MIT) is one of them, and our example points to a specific machine on MIT’s\
    \ campus (gsd.mit.edu, home of the Global School District). Any IP address that\
    \ starts with 18 will therefore point to a machine that is part of MIT’s network.\n\
    \nClass B networks have a first octet between 128 and 191. Unlike Class A networks,\
    \ a Class B network is determined by fixing the second octet at a particular number.\
    \ The holder of a Class B network can assign all of the addresses that result\
    \ from combinations of the last two octets, for a total of 65,500 or so possible\
    \ addresses. A total of around 16,000 Class B networks are available, and most\
    \ of these have been assigned already.\n\nClass C networks are the most limited\
    \ type of network. The first octet can be within the range of 192–223. The second\
    \ and third octets are fixed. The Class C administrator has only 254 possible\
    \ IP addresses available to assign. Over 2 million Class C networks are available.\n\
    \ method of breaking down the possible IP address numbers means that a core router\
    \ would only need know how to get information about 2 million networks, instead\
    \ of 4 trillion addresses. Most routers don't even have a complete routing table\
    \ (the 2 million-plus addresses) but instead know how to get information to a\
