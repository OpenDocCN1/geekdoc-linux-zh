  md: '# Configuring the Firewall under OpenBSD


    There are two events that will trigger the kernel to block or pass a packet. The
    first is when kernel reaches the last rule in the rule list. It will then perform
    the action specified in the last matching rule. If no matches, the packet will
    be passed by default. The second event is when a matching rule explicitly says
    to stop processing the packet and take the prescribed action (accomplished via
    the option keyword quick). This used to short-circuit ipf'' processing, and can
    significantly speed up the firewall if there''s a large ruleset. We''ll talk more
    about the value of quick rules a little later.


    If a packet matches a rule with a log or count action, the action is immediately
    taken. The kernel continues to process the packet against the remaining rules.
    This enables logging and accounting of traffic that is independent from whether
    a packet is accepted or rejected.


    But wait, you say. What happens if more than one rule matches a packet and none
    have the quick option? What if the first match says to block the packet, the second
    says to pass the packet, and a third match says to block the packet again? How
    do we know which action will be performed by the kernel?


    # Only the Last Match Counts


    This is not a philosophicaling by a chain smoker. Instead, it''s the key to understanding
    how IPFilter works. IPFilter processes its rules much like we process rules in
    English. Let''s take a common situation as an example: Selecting certain pets
    into our apartment. If we want to prohibit all pets from our apartment, we would
    hang up a sign that says: “No pets allowed.” If we decide that goldfish and iguanas
    are bearable, we could amend the sign to read: “No pets allowed, except for goldfish
    and iguanas.” It would be awkward to say it the other around: “Goldfish and iguanas
    are allowed in my apartment. No other pets are allowed.” Why this format awkward?
    Because we tend to hear the general rule first and then the exceptions, especially
    when there''s a long list of exceptions. There''s a good reason for this. Imagine
    hearing the following:


    > “Goldfish, tropical, catfish, crayfish, lobsters, crabs, dolphins, guppies,
    iguanas, lizards, toads, turtles, scorpions, spiders, caribou, elk, reindeer,
    moose, gazelles, rabbits, ferrets, mice, and hamsters are allowed in my apartment.
    No other pets are allowed.”


    After the penguins listener is wondering where the heck this list is going. By
    the time we get to gerb, their eyes glazed over. When we finally get to the rule,
    almost every listener has forgotten most of the list (with the exception of the
    landlord, who''ll be copying it down verbatim for'
