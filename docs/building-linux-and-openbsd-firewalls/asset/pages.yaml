    # Setting Up the Hard Drive


    This part of the install deals with configuring and formatting your hard drive
    to run OpenBSD. It''s a rather tricky part of the install, but we can just reboot
    and try again if we mess up.


    The installer will first ask you about the root disk. It will show a list of all
    the drives in your system (there should be only one). The name will be something
    like “wd0”. This should also be the default answer in brackets, so hit <CR> again.


    The next question asks if you want to use the entire disk for OpenBSD. We can''t
    think of any reason why you should settle for less, so type “yes” and hit <CR>.


    Suddenly, the installer tells you that “BIOS ‘A6’ (OpenBSD)’ partition has been
    created, and proceeds to give you all sorts of confusing information about partition
    tables, offsets, and disklabels. It then says:


    ```

    Treating sectors 63-### as the OpenBSD portion of the disk.

    You can use the ‘b’ command to change this.

    Initial label editor (enter ‘?’ for help at any prompt)

    >

    ```


    ### is the total number of sectors on your hard disk.


    Now you''re at a > prompt. Unfortunately, the manual talks about disklabel in
    a very generic way. It doesn''t help your problem, which is that the > prompt
    won''t go away.


    First thing to do is hit <CR>. This should give you a list of commands. The first
    command in the list is ‘p’ for print label. Let''s do that to see what the current
    disk setup looks like. Press “p” and hit <CR>.


    You should see a bunch of information about your disk geometry, followed by a
    list of the active partitions. Write down the number next to: bytes/sector. You''ll
    need this later.'
