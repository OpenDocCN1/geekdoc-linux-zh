  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    ![](img/2fea8bfa30d45d039dcc057b944028fc_47_0.png)


    **Figure 2.1** Ethernet packets depicted as a badly drawn Russian doll.


    The combination of header, data, and trailer is called a *datagram* (the term
    "Russian doll") was never officially adopted by government officials, possibly
    because most of the initial technology was developed by DARPA during the Cold
    War, but most likely due to the fact that I just made up the term). The process
    of placing one datagram within another is called *encapsulation*.


    The outermost datagram is called the *Ethernet frame*. It contains a header and
    a trailer. In between is the IP datagram. The IP datagram contains a header and
    another datagram, which is usually either a TCP or UDP datagram. TCP and UDP datagrams
    may contain raw data or may have other protocols encapsulated within.


    The process of unwrapping the layers in a packet is called *demultiplexing*. The
    Ethernet hardware demultiplexes the Ethernet frame and passes the encapsulated
    IP datagram to the IP service. The IP service then demultiplexes its data-gram
    and passes the resulting information to the appropriate service—usually the TCP
    or UDP service.


    # IP Vulnerabilities


    Before going into various IP-based attacks, we need to introduce a critical concept
    called *spoofing*. It is very easy to create a packet that has a fictitious source
    IP address. When another machine receives this packet, it may believe that the
    packet originated from the fictitious sender. This process is called spoofing
