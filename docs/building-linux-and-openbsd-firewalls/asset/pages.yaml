  md: '# How Secure Should Your Network?


    one-upmanship, called it X. It was first conceived in 1984. Over the years, it
    was expanded, improved, standardized, and ported to every platform under the sun.


    X is, in the words of the Jargon File, “An over-sized, over-featured, over-engineered
    and incredibly over-complicated window system developed at MIT and widely used
    on Unix systems." X is so complex that it can take a highly skilled programmer
    years to understand. Go to a book shop and look at the O''Reilly series on X programming
    (assuming you can find a computersish book that doesn''t mind devoting a full
    third of its shelf space to this particular series).


    X is confusing from an end-user standpoint. Envision the following scenario: You
    are sitting at Computer A. You want to display an application running on Computer
    B on Computer A’s. Guess which computer is running the X? If you use Computer
    B, you’d be wrong. Here’s an explanation from The Free On-line Dictionary of Computing
    (http://wombat.doc.ic.ac.uk/; Editor Denis Hovis:)


    X uses a client-server protocol, the X protocol. The client or X terminal with
    the screen, keyboard, mouse and server program and the clients are applications
    programs. Clients run on the same computer as the server or on a different computer,
    communicating over Ethernet via TCP/IP protocols. This is confusing because X
    clients run on what people usually think of their server (e.g., a file server)
    but in X, it is the screen and keyboard, etc., which is being “served out” to
    the applications.


    X runs on TCP port 6000; if you have more than one display on a machine, other
    displays run on 6001, 6002, and so on. You are strongly advised to block TCP from
    port 6000 to other port 6010 in directions through your firewall.


    # Problems Associated with X


    X is not encrypted, and its authentication system can be compromised. A hacker
    could easily hijack an X session, creating sorts of mischief. Versions of X clients
    and servers may also have inherent insecurities. Running an X session across the
    firewall is a very bad idea.


    # How to Make X Secure


    You can use ssh to create a secure tunnel for X. Part of the ssh standard implementation
    includes a facility for creating X connections. The ssh client automatically sets
    the DISPLAY environment variable on the server, telling it to forward all connections
    through the ssh tunnel. The ssh client also uses a secure authorization mechanism
    separate from the login authentication.'
