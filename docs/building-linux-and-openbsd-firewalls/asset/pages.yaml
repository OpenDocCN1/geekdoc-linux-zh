  md: "Not only is this a book on installing Red Hat, it's also not a book on getting\
    \ packets to flow between you and the outside world. The job of the firewall is\
    \ to stop packets flowing between anywhere and you, and the job of this book is\
    \ to help you build a firewall. However, we think it would be a good idea to dwell\
    \ briefly on the basics of setting up Internet connectivity, and all to include\
    \ new ideas and pointers to reference source. \n\nYou need to get your network\
    \ set up before you can firewall. One of the beauties of Unix is that things are\
    \ modular—you can separate the networking setup from that of the firewall, and\
    \ set up the network utilities separate from the network, and so on. Take advantage\
    \ of this modularity, and don't try to do everything in one giant stage. It's\
    \ easier to create and verifiably manage a small part of the setup than it is\
    \ to get the whole thing right. Few people can accomplish this, and fewer would\
    \ ever want to do it that way we are not among the few, the proud, and the soon\
    \ enough to be regretful. There's no reason you should be, either.\n\n# Installing\
    \ Extra Packages\n\nThe first thing to do is install a few more Red Hat packages.\
    \ If you installed from local CD-ROM, Red Hat will have automatically set up your\
    \ system so you can mount your CD-ROM by popping the Red CD-ROM into the drive,\
    \ and typing `mount /mnt/cdrom`. If you get an answer like “mount: can't find\
    \ /mnt/cdrom in /etc/mtab or /etc/fstab”, try “mount -t iso9660 -o /dev/cdrom\
    \ /mnt/cdrom” .\n\nOnce you've got the CD mounted, type `cd /mnt/cdrom/RedHat/RPM`.\
    \ You're now in the directory where all the software packages live, including\
    \ all those that were installed a few minutes ago when you built your system.\
    \ We want a few more of them. Try the following commands:\n\n```\nrpm -ivh ipchains-*.1386.rpm\n\
    rpm -ivh tcpdump-*.1386.rpm\n```\n\nRPM is the RedHat Package Manager, the tool\
    \ that manipulates the packages that make up the OS and applications. -ivh is\
    \ the combination of, and is equivalent to, the three flags -i, -v and -h. The\
    \ first means “install the package at the end of the line”, the second means “verbose\
    \ about problems you encounter,” and the third means “print some hash marks while\
    \ you install the package.” When you hit `<CR>`, you will install two packages.\
    \ The first, ipchains, is the firewall manipulation tool. The second, tcpdump,\
    \ is an application for monitoring traffic on a network, by packet. It is very\
    \ useful for debugging network problems, so we're likely to want it. The third,\
