  md: '# INTRODUCTION


    Thank you for buying the sequel to the greatest tragedy of all time: Hamlet. You
    might not recognize it as such, and we apologize for any confusion this may cause.
    Due to logistical issues, we simply couldn''t house and clean up after the infinite
    supply of monkeys and typewriters required to properly complete such a project.
    So we had to settle for only two primates (albeit hairy ones) sitting in front
    of computer keyboards. It''s actually a testament to the laws of probability.
    After three months of banging on the keyboards randomly we had forty thousand
    pages of useless text. We edited out all the unnecessary characters, we were left
    with this book. True, some sentences are difficult we edited down. But for the
    most part a creative writing allowed us to retain sense and continue. Few apples
    were lost, horates


    After reviewing the final product we feel that as a sequel to Hamlet it''s a resounding
    success. We''re not sure why our publishers insist on marketing it as a book about
    firewalls—a quite modern-day concern compared to the evocative and timeless drama
    that we have crafted. But you have seen through the ruse and have bought our masterpiece
    guarantee that it will not disappoint.


    # What This Book Is Really About


    Okay, back to reality. This is a cookbook for building firewalls using Red Hat
    Linux 6.0 and OpenBSD 2.5. It contains step-by-step instructions on how to build
    a very useful powerful firewall from scratch. This book assumes you are starting
    with nothing more than the processed flesh you''re holding in your hands. It will
    then walk you through some basic theory, the process of selecting between Linux
    and OpenBSD, getting the right hardware for your system, installing the operating
    system, configuring the firewall, and detecting and dealing with security breaches.


    We''re going to go out on a limb and guarantee that you want to connect a local
    network—even if it''s just one machine—to the Internet. You''ve decided that a
    firewall would be an excellent way to help you get your network out to the world
    without inviting the whole world back in for a. Good for you.


    But why would anyone want to build their own firewall? What do all want is a box
    with two holes and a button: Into one hole we plug the Internet and into the other
    hole we plug our local network. Then we push the button on the box labelled “Be
    A Firewall,” and everything just kind of happens, right?


    Wrong.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'A lot of people out there will be happy to sell you a box with two holes and
    a button, to be sure. When you try and set it up, though, you find the box wants
    to be told all about your network, what sort of services you want going in and
    out, and answers to all manner of other questions. To answer these, you find you
    have to understand much more than you''ve bargained for about what your network
    does. When you plug the firewall in and push the button, you still don''t know
    what''s going on inside, and you only have the manufacturer''s word that things
    are secure. These days, let''s face it, not all computer makers are completely
    honest about the الرياضيات in their own products.


    So what can you do? Well, you can take responsibility for your own network and
    its security. If you take time to understand your network, you can build a firewall
    from publicly available, free software. This software has been created by highly
    knowledgeable enthusiasts and scrutinised line by line, by the whole line. If
    anyone finds a hole in this stuff, it''s not going to get sat on by some heavy-handed
    corporate marketing department while the world''s crackers pass your network''s
    secrets behind your back. Holes are made public within hours, and very often fixed
    within the same day. We''re not joking, never in world history has there been
    a software development engine as fast or powerful as the free software movement.


    Take their effort and expertise, apply it to your own network, and be secure in
    knowledge.


    # What This Book Isn’t About


    We did not want to create another text on firewall theory. We want this to be
    a practical book that gives you all the information you need to create a working
    firewall. Nonetheless, the astute reader will note that there are a number of
    Chapters (1,2,3, and 11) which cover more theory than practical implementation.
    This is because a solid understanding of security is as valuable as, if not more
    than, the firewall itself. That''s a really important point, so will state it
    here again, and numerous times throughout the rest of the book:


    > A firewall is only secure once you understand what it''s securing, how the security
    works, and what''s not being secured.


    The chapters on theory are there to help you understand the fundamental security
    issues of network security, and then specifically of Internet security. We have
    taken every effort to make these chapters as readable as possible. So that you
    could fully understand the issues and implications. Our goal was to provide just
    enough technical information so this book is not meant to be a replacement for
    more authoritative texts on network, security and firewall theory. The curious
    reader'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Introduction


    will want to learn more about many of the topics we skim over. O''Reilly has an
    excellent series of such books that are easily recognizable by two distinguishing
    features on the cover: 1) titles that are comprised of seemingly random combinations
    of 3 and 4 letters to form words that supposedly have some meaning; like sed,
    awk, perl, dns, nis, nfs, and so forth, 2) woodcutings of bizarre animals that
    have no immediately meaningful relationship to the tiger (assuming the title has
    any meaning to you in the first place).


    With any luck, the story of your firewall will not resemble the story of Hamlet,
    or it''s modern day spin-off, Rosencrant and Guidenstern are Dead. We hope it''s
    more like an episode of the 80''s Saturday morning cartoon series "GI Joe." The
    bad guys are always repelled or defeated at the end, and all we learn that “knowing
    is half the battle."


    # Why Linux and OpenBSD?


    This question is very similar to the Mac vs de. Microsoft Windows debate. Macs
    are easy to use because they limit the amount of control the average user over
    their system. Windows is more difficult to use, but give the end user greater
    flexibility. Novice users tend to prefer Macs, while more experienced users like
    the flexibility of Windows. Both are capable of performing the same tasks equally
    (which may not be “well” when compared to either Linux or OpenBSD, but that''s
    a totally separate war fame).


    Likewise, both Linux and OpenBSD will make excellent firewalls. They are both
    open software, although the licensing is different. OpenBSD is easier to work
    with and better supported in the community and by the distributors. OpenBSD was
    built with security in mind and has a number of powerful security features not
    found in Red Linux (Red Hat can include strong encryption due to US export restrictions;
    OpenBSD comes from Canada to everything''s fair game, eh?). Linux and OpenBSD
    have many commonalities, but also use two totally different systems for packet
    filtering.


    If you''ve picked up this book with a preconceived notion as to which OS you''re
    going to use, we''d like to ask you to put aside until you''ve finished reading
    Chapter 4 “Choosing an OS: Linux versus OpenBSD.” We don''t expect most readers
    to have heard of OpenBSD. We do that after reading Chapter 4, all of readers will
    have a better appreciation of the relative strengths and weaknesses of Linux and
    OpenBSD, and will be better placed to make a decision on which one suits them
    best. They both exemplify the power of the Open Source movement. Both OpenBSD
    and Linux exist and are thriving (along with numerous other open operating systems
    such as FreeBSD, NetBSD, the Hurd, for example) is a testament to this power.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    Regardless of the choice you make, your willingness to trust the security of your
    network to an open source initiative is what counts. Both the Linux community
    and the FreeBSD community understand that it''s not about which open source system
    is better. It''s really about choosing open source as a viable alternative in
    the first place.


    # Why Red Hat?


    We chose the Red Hat distribution because it is the most popular distribution
    of Linux. This means that they are well understood and heavily supported by the
    user community. Red Hat also comes with real commercial-grade installation support.
    If you''re having trouble, you can make a phone call to a live person that will
    help you out. There are some technical advantages to the Red Hat system, including
    a good installer and powerful tools for configuring the system, such as the Red
    Hat Package Management system (RPMS). We were able to save space for firewall
    issues and not waste it on OS installation by using the Red Hat Linux Installation
    Guide as our example.


    However, we should consider that the tools used to build the firewall come with
    any Linux distribution that includes a 2.2.x kernel (which nearly all modern distributions
    do). Ninety percent of the Linux-specific parts of this book apply equally well
    to other distributions.


    # How This Book Is Organized


    This book can be read in a number of ways. We first suggest skimming the entire
    book through, including the installation and configuration sections for each operating
    system. Read the chapters that were most interesting. When you''re ready to install
    your firewall, turn to the step-by-step instructions for the operating system
    of your choice.


    The book is structured in three major sections.


    # Part I


    Part I is networking theory, as clear and simple as we could make it. Don''t know
    your IP from your UDP? Always thought that TCP was an antiseptic, or that the
    ICMP was in funny clothes upholding the law in Canada? Chapters 1 through 3 will
    take you through networking until you feel confident enough to face the rest of
    the book—and the rest of the Internet—with with equanimity.


    Chapter 1, "The ABC''s of Network Security," is a broad overview of security issues
    in any networked environment. First we look at why security doesn''t'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# introduction


    # xvii


    come naturally with the Internet. Then we step back and ask why we want security
    in the first place—what is it we''re trying to protect? The job of the firewall
    is to protect your network from outside hackers, but what happens if the hacker
    is on the inside? We wrap up Chapter 1 by looking at internal security and its
    implications on the design of your firewall.


    In Chapter 2, “Fundamental Security Issues,” we look at how the Internet works,
    how core protocols work and vulnerabilities inherent within these protocols. Specifically,
    we look at the TCP/IP suite of protocols. We also deal with some general techniques
    for attacking machines over the Internet, buffer overflows.


    Following our discussion of the underlying Internet protocols, Chapter 3, “How
    Secure Your Network Be?” contains a detailed look at all of the major services
    and protocols built on top of TCP/IP. These include the services and protocols
    that enable email, the Web, chat, and file sharing. We''ll tell you how they work,
    how they''re vulnerable, and what you can do to make them more secure. This chapter
    also describes issues pertinent to the configuration of your physical network
    and managing your users.


    # Part II


    Part II gets down to nuts and bolts. Chapter 4, “Choosing an OS: Linux versus
    BSD,” discusses the history, the development, and the consequent pros and cons
    of the two operating systems we deal with, OpenBSD and Linux. Hopefully, this
    will help you make your choice.


    Chapter 5, “Getting the Right Hardware,” assumes you''ve made your OS decision
    and are now ready to acquire the equipment you''ll need. Many readers have picked
    up this book thinking, “I''ve got an old 486 that will make a great firewall.”
    You''re right. It will make a great firewall, but it might not be very easy to
    get all of the necessary hardware working with the operating system. If at all
    possible, you''re better off acquiring a system that fits our recommendations.


    Then you''ve got to install the OS, and at this point the linear flow of the book
    stops (to resume in Chapter 10). Chapters 6 and 7 are for Linux users, Chapters
    8 and 9 are for OpenBSD users.


    Chapter 6, “Installing Linux,” and Chapter 8, “Installing OpenBSD,” deal with
    installing the operating system. They are not installation manuals. Instead, they''re
    meant to be read alongside the installation manuals and other supporting documents.
    The purpose of these chapters is to guide you through the installation knowing
    that the ultimate goal is a firewall system. When a choice is presented to you,
    we''ll help you make the right choices for a firewall. After'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    the system is installed, we''ll also discuss a few further configurations you''ll
    need to make before you can start working on the firewalling rules.


    Chapter 7, “Configuring the Firewall under Linux,” and Chapter 9, “Configuring
    the Firewall under OpenBSD,” deal with writing firewalling rules for Linux and
    OpenBSD. Both operating systems use different packet filtering frameworks. Linux
    uses IPCh while OpenBSD uses IPFilter. Both chapters explain the syntax of the
    packet filtering rules and explain how the filters work.


    At this point, you''ve got a running machine and you know how to write packet
    filters. Chapter 10, “Tuning Your Firewall,” revisits the protocols described
    in Chapter 3 and takes you through the finer points of configuring your firewall
    to handle them as you wish. Extensive examples are given for both Linux and OpenBSD.
    By the time you leave this chapter, you''ll have a working firewall.


    # Part III


    Part III explains how your work is not yet done. You need to think about what
    happens when things go wrong. How do you do once you know? Chapter 11, “Intrusion
    Detection and Response,” deals with figuring out when someone’s in your system
    (intrusion detection) and what you do about it when it happens (response).


    Chapter 12, “Loose Notes,” is a catchall chapter that we allude to in every other
    chapter but don''t deal with explicitly. This includes references to other sources,
    scripts, and more theory. We also include a brief tutorial on the standard Unix
    editor, vi.


    # I Don’t Like Reading


    If you want to set up a working firewall without reading anything extraneous,
    you could get away with skipping Chapters 1, 2, and 3. Skip Chapter 4, go with
    Linux as an operating system and read Chapter 5. This will help you pick out some
    hardware and put it together. Read Chapter 6 to learn how to install the operating
    system, and Chapter 7 to learn the basics of firewall configuration. Finally,
    Chapter 10 will show you how to configure your firewall, in detail. It will also
    direct you to the sample firewalls on the book’s companion Web site, and you can
    pick the one that best suits you and use as a starting point.


    That should get you up and running. However, come back later and read the rest
    of the book. Really, we mean it. It all applies to you.'
  merge: -1
