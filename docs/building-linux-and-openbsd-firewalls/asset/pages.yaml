  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Eventually you''ll need to make a decision about your DMZ; are you going to be
    using real IP addresses within the DMZ, or will you use private addresses with
    NAT and port forwarding, both? If you plan on using internal addresses, you''ll
