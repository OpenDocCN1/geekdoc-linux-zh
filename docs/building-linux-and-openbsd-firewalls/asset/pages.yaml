    # After You''ve Found the Modem


    Once you''ve worked out which port the modem is on, it will save a lot of time
    in the future if we put in a link—much like the modem link we already mentioned—to
    point to the modem, and refer to the modem through.


    If your modem turned out to be /dev/ttyS0, issue the following commands:


    ```

    /dev

    ln -s ttyS0 modem

    ```


    If the modem turned out to be on /dev/ttyS1, change the ttyS0 in the preceding
    command—this link is made, every time you refer to /dev/modem, you''ll automatically
    be talking to your modem. The rest of the modem section assumes you have done
    this.


    # Firing Up Minic


    Now we want to have a serious talk with the modem. To talk to a device on a serial
    port, we need some kind of software to mediate the conversation. Minicom comes
    with Red Hat 6, and we installed a few sections ago. If you have a preferred package,
    by all means use that, and skip ahead to the section below PPP.


    To set it up, run "minicom -s". The parameters that need to be changed are “Serial
    port setup” and “Modem and dialing”—the rest of the parameters will be set sanely.


    Use the arrow keys to move to “Serial port setup” and press <CR>. Press “A” to
    edit the device, and change the text to read "/dev/modem" (if it doesn''t already
    say that). Hit <CR> to confirm that. If you need to change the speed, or data/parity/stop
    bit settings, press “E” and choose from the menu that appears. Our experience
    has been that most speeds are fine, as modern modems will adjust automatically
    (and this speed doesn''t represent the speed you want to drive the modem when
    talking to the Internet, anyway): 8N1, which is short for 8 data bits, no parity
    bit, one stop bit, is usually fine for the latter setting.'
