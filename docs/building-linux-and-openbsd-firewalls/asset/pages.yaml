  md: '# CORBA/IIOP


    punching holes in the firewall for RMI. Explain your position clearly and firmly.
    Let the people who want RMI access argue among themselves as to how they''re going
    to get through the firewall, stay out of it until they provide you with an acceptable
    solution (such as VPN tunneling).


    There are three critical aspects to a security model for networked applications.
    The first is a secure user access system that can limit the access to a particular
    user has to a particular set of resources. An unauthorized user should not be
    able to access restricted data. This is invariably the responsibility of the application
    programmer. The second aspect is a secure method of user authentication. In the
    CORBA framework, this is the responsibility of the ORB, which either provides
    its own authentication system or uses an external system such as the operating
    system''s own authentication scheme. Finally, the data that pass across the network
    need to be secure. This is the part that we''re most concerned about.


    The problem with securing the communications channel is that both endpoints need
    to agree on an encryption system. The CORBA security model deals with providing
    security within a single security technology domain. This means that the security
    policy and framework for the entire environment is consistent—for example, within
    a large, well-organized company. The CORBA specification does not deal with connecting
    two or more domains with different security policies. It suggests using a security
    gateway technology, , which translates to a VPN solution.


    Using a VPN solution is great, but requires the remote administrator to support
    ssh and not some other VPN solution. This also limits the usefulness of CORBA,
    since only trusted systems will be able to securely connect. Ideally, CORBA can
    let any system on the network access a resource security.


    The current trend towards this end is to build SSL support into IIOP. The advantage
    to SSL is that if it becomes part of the CORBA specification, then all ORBs will
    support it and the channel can be considered secure without tweaking the firewall.
    The problem with SSL is that you''re locked into a particular technology for encryption.
    With secure tunneling, you achieve the same goal but with the flexibility of switching
    your method of tunneling at any point.


    Technically, it should be possible to use ssh to tunnel between two ORBs, but
    this requires coordination on both ends of the connection. Of course, any other
    existing security measure we might requires just as much communication at the
    moment.'
