    The BSD community has rallied around the three BSD projects: NetBSD, FreeBSD,
    and OpenBSD. They all happily coexist because they address different ideological
    concerns. Each can run code written for the others by way of emulators (a program
    that converts binary code from any other system into a format the host OS can
    understand) or by way of direct binary compatibility (the kernel can directly
    process the binary code from the other operating systems).


    # The Finnish Startup


    Unlike the BSD bunch, Linux did not evolve from the original Unix source code.
    It evolved from an entirely different starting point: Minix. Andrew Tanbaum created
    Minix as a teaching tool to illustrate his approach to operating system design.
    His book, Design and Implementation (Prentice-Hall, 1997), used Minix for its
    examples. The publisher of the book allowed Minix to be freely downloaded and
    used for educational purposes. At the time, it was the only freely available Unix-like
    system, since it was built from scratch and did not include any of the AT&T codet.
    It also ran on numerous platforms, making it an easy system for non-PC users to
    obtain.


    Tannenbaum had only intended on creating a supplement to his book—he had never
    planned on making Minix into a fully fleshed out Operating System. But many students
    who took courses based on his book hooked on Minix. They wanted Unix for their
    home machines, and Minix was the only option. Unfortunately, Minix needed a bit
    of work. It didnt even come close to approaching the standard Unix feature set.
    Frustrated, Minix users added the tools they needed themselves. A community formed
    around the software. The Minix community added functionality to the system and
    fixed bugs, ultimately creating a freely available Unix-like operating system,
    albeit one was a bit rough around the edges. It attracted a large user base of
    hackers, including one student at the University of Helsinki by the name Linus
    Torvalds.


    Linus had just purchased a 386 and was excited about learning how it worked. He
    installed Minix on his machine and started playing. Soon, he was experimenting
    with concepts that were core to any operating system''s design. He decided to
    build "a better Minix than Minix." After a few months of work, he was able to
    create a freely functional new operating system. It was purely a hacker''s concept,
    and it contained even less functionality than Minix. One of the people he was
    in email correspondence offered to get the source code a home on his ftp server.
    This person effectively named Linus''s new system by naming the main directory
    Linix.'
