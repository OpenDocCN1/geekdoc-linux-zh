    # Unicasting, Broadcasting, and Multicasting


    When one computer sends data directly to another computer, it is called unicasting.
    If a computer sends data to all of the computers on a subnet at once, it''s called
    broadcasting. Every subnet has two reserved addresses: a *network* address and
    a *broadcast* address. Each computer on the subnet listens to its own IP address(es)
    and the broadcast address.


    There''s a third option for sending data called multicasting. There are situations
    where a message needs to be delivered to some of the computers on a network, but
    not all of them. Multicasting is similar to broadcasting, except only hosts who
    wish to receive the multicast tune in the specified multicast address. Hosts can
    listen to multiple multicast addresses, and can send to a multicast address even
    if they''re not listening. If the message is long or frequent, multicasting can
    reduce the network traffic by only sending the message once.


    To effectively fraggle a machine, you need to broadcast a UDP packet from the
    target machine. The packet should be broadcast on a number of highly saturated
    networks (where most of the IP addresses in a subnet have computers on them).
    The key is to select an interesting UDP port. If the port is unreachable, the
    result will be a flood of "ICMP port unreachable" messages. One interesting port
    is the echo port, which simply sends (echoes) the packet back to the target machine.
    If the spoofed port is the echo port, one could potentially set up a loop where
    the target machine is constantly trying to echo a huge number of machines. This
    will quickly flood the target machine (probably faster than it would flood any
