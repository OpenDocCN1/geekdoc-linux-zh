  pgno: 108
- img_proc: true
  md: 'We don''t recommend using email programs integrated within a browser (Netscape,
    IE/Outlook) because it''s too easy for a Web page to use an exploit that gathers
    the user''s email address. Additionally, HTML mail is a bad thing, and both Netscape
    and IE encourage its creation. HTML mail is bad because it means that any of the
    Web-based exploits we''re talking about can be sent as an email message and activated
    immediately upon opening the message. If your users don''t have HTML mail, they
    can''t get hurt as easily through email.


    # Transferring Files between Machines


    Sometimes, you just need to move a file from point A to B. It might be a zip file
    of images, or an archive file containing the source of the FSF''s (Free Software
    Software Foundation) latest masterpiece, or you might just be moving data off
    to a backup site for storage.


    # FTP: The File Transfer Protocol


    FTP is the most common method of moving files around the Internet. Traditionally,
    it was the first protocol for file transfer across the Internet, and as such it
    is the system best understood by the bulk of serious Internet users (those users
    who realize that the Internet is more than just Web and email access).


    Like many of the major TCP/IP protocols, FTP was not designed with security in
    mind. In fact, its design creates numerous security problems. Combine this with
    its immense popularity and you''ll quickly see why it poses one of the firewall
    administrator''s bigger problems.


    # Problems Associated with FTP


    We talked about how FTP can be a real pain briefly in the earlier section IP Masquerading.
    Now let''s look at it in greater detail.


    Some people say that bad things come in pairs. Others say that bad things come
    in threes. FTP covers all the bases by having three pairs of bad things: (1) it
    communicates with the server on two separate ports—one for commands and the other
    for data; (2) it operates in two different modes (active and passive); and (3)
    it will give you headaches—first from trying to understand it, again when you
    realize the implications. We''ll now look at why two channels and two modes are
    bad things. If you don''t understand why headaches are bad, you should repeatedly
    hit yourself on the head with a brick. If you still don''t get it, then you''ll
    have years of happiness ahead of you as a system administrator.'
  merge: -1
