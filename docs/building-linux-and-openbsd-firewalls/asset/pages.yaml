  md: '# Active versus Inactive Rulesets


    The kernel has two sets of firewall rules: active and inactive. The purpose of
    the inactive ruleset is for debugging. When you load new rules into the inactive
    ruleset, ipf can notify you if there are any errors in your rule code. If you
    load buggy rules directly into the active ruleset, your firewall will not function
    properly until the bugs are fixed. Using the inactive rules avoids having to make
    your network vulnerable during testing and debugging. Once you have a working
    ruleset, you can swap the active and inactive rules.


    The ‘v’ in ‘vf’ flag enables verbose mode, which will print out additional information
    as the kernel processes each rule in the file. This will help you quickly spot
    any errors. The ‘f’ indicates that the rules should be read from the specified
    file (/etc/ipf.rules). The ‘E’ says to immediately enable the rules. This command
    is almost identical to the command executed when the machine first boots up—the
    only difference is that the boot version doesn''t use the verbose flag.


    The easiest way to add new rules is to edit the ipf.rules files and then execute
    the above command. This is what we''re going to do as we experiment with different
    rulesets in the following sections.


    # Adding Rules in Production


    If your firewall is already in production, you probably don''t want to mess with
    the active ruleset until you know that it works properly. Therefore, you''ll want
    to execute the following:


    ```

    <run test scripts>

    ipf -Fa -vf /etc/ipf.rules

    ipf -s

    ```


    This reads the contents of the ipf.rules file into the inactive ruleset (-I).
    If all looks good, you can swap the active and inactive rulesets with the “ipf
    -s” command to activate your changes.


    # Why You Shouldn''t Do It Remotely, and How You Can Anyway


    We recommend doing all firewall modifications from the console. Nonetheless, you
    might find it necessary to alter the firewall rules remotely. This creates a major
    problem: if your rules contain an error, you might find yourself unable to access
    the machine once the ruleset has been activated.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'There is a simple solution to this problem. Instead of just executing "ipf
    -s", try: "ipf -s; sleep 10; ipf -s". This command sequence will swap the rules,
    wait ten seconds, and then swap them back.


    Once the command has been executed, type a few random commands (change directories,
    and and so on). If your connection is good, then you know the changes haven''t
    broken your ability to remotely administer the machine. If your connection freezes,
    don''t worry—in 10 seconds the rules will revert to their original state and you''ll
    get your connection back. If everything works, you should execute "ipf -s" one
    final time to fully activate the rules.


    This technique may give you a false sense of accomplishment if you''re using "keep
    state" within your rules. When you swap rulesets, the state tables are preserved.
    Packets matching the state table will continue to pass through, even if the new
    filter rules would otherwise break the connection. To flush the state tables,
    you''ll need to execute "ipf -F".


    We suggest doing all filter modifications from a console login if you''re using
    state.


    # Some Thoughts on Testing Your Rules


    We''re going to do all of our testing using the active ruleset, because our firewall
    isn''t hooked up to anything critical yet. Our tests will be real time: We''ll
    connect computers to the inbound and outbound interfaces in order to test the
    validity of our rules. For example, if we block telnet access, we can test to
    see if the rule worked by trying to telnet to an internal computer from an external
    computer.

    Eventually, you''ll find that real time tests can become tedious. The best way
    to effectively test your ruleset is to create a test script using the ''iptest''
    utility lets you create packets with specific attributes. The ipf program then
    reads your firewall rules and tests each packet against a simulated firewall.
    By creating a good set of test packets you can be sure that your firewall is functioning
    properly. We''ve created a sample test script for our firewall examples, which
    you can find on the Companion Web site at www.wiley.com/compbooks/sonnenreich.

    Once your rulesets are finalized, you''ll occasionally need to make changes to
    the ruleset. The best way to test this is to first run the iptest script on the
    new rules. If the test passes, you can place the new rules in the inactive ruleset.
    You can swap the active and inactive sets to activate your new rules. If there
    are any errors, you can swap the rulesets back, restoring your original firewall
    rules.'
