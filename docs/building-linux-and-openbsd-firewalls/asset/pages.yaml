    # The (Mostly) Complete Guide to Writing, Testing, and Monitoring Firewall Rules


    The rest of this chapter is a fairly thorough guide to the syntax of writing filter
    rules. It covers both ipf rules and ipnat rules. It also gives a brief overview
    of iptest, ipstat, and ipmon—programs that will help you test and monitor your
    firewall''s performance. While some of this information is repetition of things
    said earlier in the chapter, we have presented it in a form that will be easier
    to use as a future reference. We have also dealt with certain parameters in detail.
    We much recommend reading this section through—it will help to solidify your understanding
    of the basics. It also contains details that will be very useful when we build
    the real firewall in Chapter 10.


    # IPF


    The syntax of a rule follows this general format:


    ```

    [action] [in | out] <options> <protocol> [source/destination] <misc>

    ```


    This somewhat follows the syntax described in the ipf man page, but we''ve tried
    to make it easier to understand. For a complete discussion of ipf rules options,
    see the ipf man page, Section 5. The following paragraphs discuss each parameter
    in the above rule format. Note that we discuss them in order of importance—not
    in the sequence they appear.


    There are actually a few more optional parameters that can be squeezed in, but
    they''re not necessary for anything we''re going to do. If you''re curious about
    all of the possible options, look at the ipf man page.


    # action


    The ''action'' parameter is used to determine the fate of packets that matches
    the given rule. The two most common values for this parameter are block and pass.
    An action of ''block'' means packets matching the rest of the rule will not be
    allowed through the firewall. Conversely, packets that match the condition of
    a ''pass'' rule may travel through the firewall. Remember though, the only rule
    that counts is the last one that matches a given packet. For example, a packet
    can match 20 block rules, but if the last rule is a pass rule then the packet
    will be allowed through the firewall. Yes, this point was made earlier, but it
    pays to be redundant. Out-of-sequence rules can render a firewall worthless.'
