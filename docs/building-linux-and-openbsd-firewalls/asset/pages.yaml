  md: '# NOTE


    While you''re on the IDE controller screen, you should also check to see if the
    hard drive is properly configured—if in doubt, setting the TYPE value to “AUTO”
    for the Primary Master drive won''t hurt. If the AUTO setting isn''t available,
    there may be another BIOS configuration screen for IDE auto detection. This process
    will try to determine the proper drive configuration automatically. If all else
    fails, you may need to input your hard drive geometry by hand.


    The other necessary configuration involves the BIOS to try booting off the CD
    before booting the hard disk. This is often done from a screen titled “BIOS FEATURES
    SELECTION.” The setting you''re looking for says something like “boot sequence:
    A, C, SCSI.” You want to change this to read: “CD-ROM, A, C”, “CD-ROM, C, A” or
    something of the sort. Refer to your motherboard for instructions on how to accomplish
    this.


    If you configured everything properly, you should access the CD-ROM drive first
    and then the floppy drive or the hard drive. If nothing happens, try rebooting.
    If you are still having no luck, check to see if the system is detecting the drive.
    Often, the BIOS will print out status messages, including drive detection messages.
    It should say something about finding a CD-ROM drive within the first few seconds
    of booting (after testing the memory), assuming your BIOS provides this type of
    information.


    If the BIOS is properly detecting the drive, then your particular configuration
    might be incapable of booting from the CD-ROM. If the BIOS can''t see the drive,
    the only explanation is that it hates you—just kidding. Read on figure to figure
    out what might be wrong.


    # CD-ROM Troubleshooting


    If the BIOS isn''t detecting the drive, you first should review all of your BIOS
    settings. Sometimes your changes might not get properly saved if you exit the
    BIOS configuration program the wrong way.


    If everything is properly configured in the BIOS, it''s time to open up the case
    again. First step is to check those ribbon cables. Did you align the red stripe
    with one on both the drive and the motherboard? Try a different ribbon cable—sometimes
    they are defective. Another common problem is the master/slave setting on the
    CD-ROM drive. If it''s connected to the primary IDE controller along with the
    hard drive, the jumper on the CD-ROM should be set to slave. If the drive is alone
    on the secondary controller, then the jumper should be set to the master position.
