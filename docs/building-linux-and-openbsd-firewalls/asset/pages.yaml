  md: '# CHAPTER 9

    Configuring the Firewall under OpenBSD


    ![](img/2fea8bfa30d45d039dcc057b944028fc_272_0.png)


    At this point you should have OpenBSD installed on your equipment. What you don''t
    yet have is a useful firewall. Your machine, if connected to the network properly,
    will cut off all traffic between your network and the outside world. The firewall
    can talk to the outside world, and the internal network can talk to the firewall,
    but nothing will pass between the firewall''s external and internal interfaces.
    This is a good thing. This chapter will teach you how to selectively allow data
    to move between the inside and outside world.


    We''ll start this chapter by discussing the underlying concepts behind firewalling
    in OpenBSD. We''ll learn how to work with the tools used to implement the firewall.
    Then, we''ll practice making a few traffic rules and we''ll run some tests to
    ensure that they work properly. The goal is to configure a basic functional firewall.
    If necessary, we''ll also help you set up Network Address Translation (known as
    Masquerading in the Linux world). We''re not going to make too many important
    decisions regarding the services your firewall allows—that''s the job of Chapter
    10, "Tuning your Firewall"


    The tool in OpenBSD for configuring firewalls is called IPFilter. IPFilter is
    actually a suite of programs—ipf, ipnat, and ipstat. ipf is used to configure
    the packet filtering aspects of the firewall. ipnat is used to perform Network
    Address Translation (NAT) and packet redirection (forwarding). ipstat is used'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'to obtain a printout of the rules currently active within the kernel. This
    is very useful for debugging firewall problems.


    The good news is that there''s nothing else to install—the IPFilter package is
    part of the basic OpenBSD installation (everything is in the base disk set). Before
    we start playing with these programs, let''s take a look at the fundamental theory
    behind IPFilter.


    # IPFilter Theory


    IPFilter is a very simple, yet powerful, filtering system. It can do nearly everything
    the Linux IPChains system can do. IPFilter even has a few advantages over IPChains,
    the most notable which is its easy-to-read syntax. Another advantage of IPFilter
    is the distinct separation of filtering (ipf) and forwarding/masquerading (ipnat)
    functions. This makes the rule system much easier to understand, which means you''ll
    be less likely to write incorrect rules that do bad things, which in turn is a
    good thing.


    # IPF


    The bulk of your firewall rules will be crafted with the ipf program. This program
    is used to add and remove filter rules from the kernel''s filter queue. The kernel
    actually takes care of the filtering, but the rules are set using the ipf program.


    > IPFilter does not make decisions about how to route packets; that''s handled
    by the routing tables. The only decision made by the filter is whether to route
    packets. We will cover routing tables in more depth in Chapter 10.


    The ipf program processes a rule file, which is a simple text file that you will
    create. In this file, each line specifies a filtering rule. A filtering rule is
    a set of conditions and an action to take when the conditions are met. In general,
    the action is to discard the packet (the ipf term for this block) or to allow
    the packet to pass through the firewall (pass). We say "in general" because there
    are other things rules can do, such as packets to be logged (log). For the truly
    adventurous, rules can even trigger the execution of special kernel functions
    (call). For this part, we''re only concerned with the block and pass actions.


    The rules in the rule file are processed in the order they appear. When a packet
    arrives at an interface, the kernel tests the packet against each rule, in sequence.
    When a packet matches a rule, the kernel takes note of the action. In some cases
    it takes immediate action and stops processing the packet. In other cases it will
    continue processing the packet against more rules.'
