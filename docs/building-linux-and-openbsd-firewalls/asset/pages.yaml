    ask. Likewise, they''ll give you the IP addresses of your DNS servers. You can
    leave out the DNS server, but we don''t recommend it. When it asks you if "like
    to use the name server now," you should answer yes if you''ve given it a valid
    DNS address.


    Next it will give you the opportunity to escape to the command shell to perform
