- img_proc: true
  md: '# Choosing an OS: Linux versus OpenBSD


    mercial Unix System Laboratories, BSDI for violating the AT&T license. Unfortunately
    for BSDI, they had not effectively removed all traces of the original Bell Labs
    code. The result was BSD/386 with circulation. Eventually, an agreement was reached,
    and an incomplete system BSD4.4-Lite was released. BSD4.4-Lite contained none
    of the original AT&T code.


    While all of this legal maneuvering was occurring, another license-free BSD system
    was being developed for the Intel platform. It was called 386BSD and it had the
    same goal of replacing leftover Bell Labs code. 386BSD was released in 1993. Two
    groups independently used this code base to create their own versions of the BSD
    framework. The two groups never merged due to ideological differences. The NetBSD
    group wanted to make the BSD framework available for every piece of hardware under
    the sun. The FreeBSD group wanted to make a freeway, highly reliable, commercial-grade
    BSD system, but only for the Intel platform. Both succeeded at their goals—NetBSD
    is one of the most widely available operating systems. FreeBSD is highly optimized
    for the Intel platform (and is now available on a few others) and is considered
    powerful enough for high-load commercial environments. For example, Yahoo!’s Web
    servers run FreeBSD.


    BSD did not give up—they continued to work toward their goal and released yet
    another BSD-derived Unix system, this time based on BSD4.4-Lite. They decided
    to commercialize their system and have created a successful and reliable product
    line.


    So does OpenBSD fit into all of this? The OpenBSD project was founded by de Raadt
    in 1996. Theo''s goal was to create the most secure operating system in the world.
    He started with the NetBSD codebase and began what is likely the largest security
    audit ever. The following is an excerpt from the OpenBSD site:


    Our security auditing typically has between six and twelve members who continue
    to search and find new security holes. We have been auditing since the summer
