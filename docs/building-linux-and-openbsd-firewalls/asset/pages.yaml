  md: 'o: Copies matching packets to the userspace device. This requires kernel reconfiguration
    and substantial kernel internal knowledge. Don''t use this flag.


    P: Sets the policy for the specified chain to the specified target. ''iptchains
    -P input DENY sets the policy for the input chain to DENY. Neither built-in or
    user-defined chains may be used as policy targets.


    p: In a rule, matches the specified protocol. The protocol must be tcp, udp, icmp,
    or all, a protocol name from /etc/protocols, or the corresponding protocol number.
    ''!'' may be used with -p and the protocol number to invert the selection. Example:
    -p ! icmp specifies all protocols except ICMP.


    R: Replaces the specified rule in the specified chain with the rule in this command.
    The rule is specified by number, starting at the first rule in each.


    S: With -M, sets the timeout parameters for masquerading. This is Deep Magic From
    The Dawn Of Timing, and you shouldn''t need to use this flag unless you''ve got
    a lot of busy clients behind your firewall.


    s: specifies the source address of a packet. Arguments are identical to -d.source-port,
    -sport: specifies only the source port of a packet. Arguments are identical to—destination-port.


    t: Can be used to specify marks for altering the Type Of Service (TOS) field in
    the packet header. Magic doesn''t come deeper than this. Don''t use this this
    flag.


    v: Verbose output, when used with -L. A 132-column window is recommended for reading
    the output this flag produces. It''s as overwhelming as it is educational.


    X: Deletes the specified user-defined chain. There must be no references to that
    chain in any other chains, nor must the chain contain any rules, or deletion will
    fail. If no chain is given, it will attempt to delete all user-defined chains.


    y: When protocol is set to tcp


    Z: Zeros the packet and byte counters in the specified chain. If no chain is specified,
    all chains are cleared. Doesn''t clear the policy counters on the chains; we have
    to reboot or change the policy to clear those.'
