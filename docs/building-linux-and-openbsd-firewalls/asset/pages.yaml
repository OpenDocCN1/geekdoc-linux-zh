    IP address your firewall uses. Replies to connections initiated by users will
    be allowed back in (the ''keep state'' rule) and demasqueraded. Unsolicited TCP
    connections will not be allowed through the firewall other than inbound mail and
    ssh connections.


    With regard to UDP, only DNS packets from your ISP''s DNS servers, and NTP from
    your ISP''s NTP server will be permitted. Any UDP-based Internet service will
    be inaccessible to your firewall and to machines on your internal network.


    # Starting the Firewall


    The firewall code needs to be embedded in the system startup scripts so that the
    firewalling happens automatically each time the network is rebooted. The later
    in the boot process this happens, the longer the network interfaces are up to
    be without firewall protection. If there is enough time, a hacker may be able
    to compromise the firewall by crashing the machine and attacking the network before
    the firewall rules take effect.


    Luckily, the OpenBSD team has already thought about this and has preconfigured
    the necessary startup files. All you have to do is activate these configurations
    by editing the file /etc/rc.conf and changing "ipfilter=NO". That''s it—the ipf
    and ipnat rules will be in and activated at boot time.


    Reboot your system and run a few tests to ensure that your firewall started properly.
    If everything worked, you''re almost ready to move on to Chapter 10. But first,
    we recommend reading through the following sections. There are many juicy bits
    of knowledge that we couldn''t fit into the main part of this'
