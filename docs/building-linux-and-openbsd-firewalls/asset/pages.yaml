  md: 'form start:finish. If Used for packets of type ICMP, specifies the message
    type.


    **F:** Flushes (deletes all rules on) the specified chain.


    **f:** Requires that the rule be applied only to second and later packets of data-grams
    which have become fragmented.


    **h:** The help flag gives a brief description of ipchains syntax.


    **I:** Requires a chain and a rule number, or a rule; inserts the specified rule
    at the specified position in the specified chain. `-ipchains -I 1 ...` inserts
    the rule that follows in position 1 (i.e., the first rule) of the input chain


    **i:** Specifies an interface through which the packet must enter (for an input)
    or leave (for an output). `-ipp0` specifies the interface called ppp0. `-eth+`
    specifies all interfaces whose names start with the string ''eth''.


    **icmp-type:** A more convenient and efficient way of specifying the interface
    for ICMP message type.


    **j:** Specifies the target to jump to in the case of a match. The rest of the
    argument must be one of the six built-in targets ACCEPT, DENY, MASQ, REDIRECT,
    RETURN, or the name of a user-defined chain.


    **L:** Lists all the rules in the specified chain, or in all chains if no chain
    is specified.


    **I:** Logs information about any packet that matches this rule, and any target
    specified.


    **M:** Combined with -L, lists information about the masquerading tables generally
    used in it. This isn''t the general masquerading policy, this is live information
    about how (eg) port A has been remapped to port B for TCP access from machine
    C to machine D, and the entry in the masquerade tables will expire at time E.
    To look at, if you are looking magic at work.


    Combined with -S, allows you to manually set entries in the masquerade tables.
    -S for further information. Don''t do this.


    **m:** Marks matching packets with the specified value. This is analogous to slapping
    a sticky note on the packet as it goes. In the words of the man page, "If you
    are not a kernel hacker, are unlikely to care about this." Trust them


    **n:** Creates a user-defined chain by the specified name. Name must be eight
    letters or less, and must not already exist. You cannot assign rules to a userdefined
    chain, nor use it as a target, until you have declared it with this flag.


    **n:** In a listing (-L), presents all IP addresses as numbers. This can be very
    useful if your link to the Internet is a dial-on-demand link; otherwise, DNS lookups
    will bring the line up.'
