  md: 'example, often encryption keys and passwords are stored on disk so users don''t
    have to type them in every time. Regardless of how complex the scheme, the original
    information can always be recovered if the password is stored on disk and can
    be recovered by the program without user input.


    Many Windows applications are developed using common development libraries, most
    of which come from Microsoft. Hackers have repeatedly found insecurities through
    buffer overflow conditions in these libraries. It becomes trivial to determine
    if an application has been using such a library. For example, many Windows applications
    are susceptible to buffer overflow attacks due to weakness in a core Microsoft
    development library. These libraries have provided hackers with a reliable and
    consistent set of exploits.


    Because of this, you must assume that while the data may be secure in transit,
    the client and server applications themselves are fundamentally insecure and can
    often be easily compromised. As for the security of the data in transit, your
    trust should also be reserved. You cannot trust an encryption algorithm unless
    you can view the source code that implements the algorithm.


    Laplink, NetMeeting, PC Anywhere, and other remote session control systems for
    Windows all rely on proprietary unpublished transport mechanisms to create an
    aura of security. While you may be able to determine what these programs are going
    with your data, rest assured that hackers know exactly how the data are being
    transported and how to compromise the data stream. Nobody can see the source code,
    and since only the vendor can create and distribute fixes, these programs are
    a hacker''s dream.


    # How to Make Windows Remote Control Products Secure


    Drop the machine off a cliff. Okay, that''s not always an option. Sadly, you can
    do very little to secure most of these programs. If you''re able to determine
    the exact transport mechanism, you may be able to use ssh port forwarding to create
    a secure tunnel that the applications can use for their communications. Based
    on that, our best recommendation is VNC or X through ssh. These are well-understood
    packages that many rely upon.


    There is one other open source remote control program available for the Windows
    platform that''s worth mentioning: Back Orifice. It can be very useful as a remote
    control tool, but you need to read every line of the source code and compile it
    yourself. Putting the effort into understanding how Back Orifice works at this
    level could also help you avoid future BO attacks. Because it''s open source,
    you can figure out a way to encrypt the communications through ssh. The downside
    to running BO as a network tool is that it may make it more difficult to detect
