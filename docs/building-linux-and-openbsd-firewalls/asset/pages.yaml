  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Going back to our example: What if you wanted to build a car that used somebody
    else''s engine? Wouldn''t it be cool to see how your car might run using the latest
    engine from Ferrari? With distributed computing, it''s possible! You would use
    one of the frameworks we''ll describe shortly to interact with an engine object
    that actually resides on a server at the Ferrari labs in Fiorano. The car would
    run as if all the parts were were on your machine, but in reality the engine would
    be running off of the high-performance racing engine in Italy.


    Remote Invocation (RMI). If your car is a Java object, and the Ferrari engine
    is also a Java object, then you would probably use RMI to connect the two. RMI
    is Java''s own way of letting one object reference the method of another object
    located somewhere on the network. It uses its own protocol for communication,
    and is not very useful for anything other than pure Java environments. It is possible
    to use RMI to access non-Java objects through the use of Native Method wrappers
    (a system that allows you to run non-Java programs from within Java) but there
    are better ways of accomplishing the goal.


    Object Request Broker (ORB). The problem with our example is while you speak English
    and Java, the paisani at Ferrari speak italiano. How does your program communicate
    with the Ferrari server? The answer is that you use an Object Request Broker.
    This is a special type of program known as middleware, because it sits in the
    middle (like a translator) and doesn''t really care what the transaction is about.
    Its job is to figure out how to make the transaction happen.


    Interface Definition Language (IDL). Each language has its own way of providing
    access to methods and data. Not every language provides adequate facilities for
    an ORB to figure out which methods are available and what data types they support.
    The ORB''s IDL is a common way to specify the methods that each object has available,
    along with the types of data they can receive as parameters. When a programmer
    creates an object, they also create an interface definition file written in the
    ORB''s IDL. Every programming language uses the same interface definition language.
    Using the IDL files, the ORB can figure out how to make a Java object seem like
    a C++ object to the C++ programmer and versa.


    Common Object Request Broker Architecture (CORBA). The problem with our story
    so far is that every ORB vendor specify a different interface. If that were the
    case, a programmer would have to define on an ORB ahead of time. If they ever
    wanted to use a different ORB they might have to rewrite their program. That''s
    where CORBA comes in. CORBA is a specification for how ORBs should interface with
    various programming languages. This is mostly accomplished through the CORBA IDL—an
    interface definition language standard that all CORBA compliant ORBs use. It is
    an'
