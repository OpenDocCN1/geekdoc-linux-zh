- img_proc: true
  md: 'Once you''ve gotten these changes to successfully compile, you may want to
    align with stripping out unnecessary kernel options. The GENERIC configuration-file
    includes everything under the sun—your system needs less than half of the file.
    The trick is figuring out which half to delete. Slimming your kernel will improve
    boot time and the performance of your machine. It will also make it a little more
    secure—there’s still stuff that might be insecure. We''re not going to help you
    much here, but here are some general pointers:


    +   - Instead of deleting lines you don''t want (done with ''dd'' in), you should
    comment them out by placing a # at the beginning of the line. This turns the line
    into a comment, which is not processed when the kernel is compiled. The advantage
