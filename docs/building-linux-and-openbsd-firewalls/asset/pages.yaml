  md: '# Cookies and Privacy


    Since version 4 for both IE and Navigator, cookies are turned "on" during an install
    or upgrade. Should you turn them off? We can''t answer that question for you,
    but we can help you understand the main issues.


    The good: Cookies are an important way for Web servers to provide targeted or
    personalized content to visitors. Many popular sites won''t work without cookies.
    Furthermore, major sites need cookies to track their visitors. Analyzing visitor
    patterns helps the Web developers to make better sites. It also helps them get
    better ad revenues. Web sites are expensive to run and maintain—someone needs
    to pay for it.


    For the most part, cookies are secure. Each cookie can only be read by a Web server
    from the same domain as the server that created the cookie. This means that go.com
    can''t read the information that yahoo.com stored in the cookie file. Furthermore,
    the information stored in the cookie file is an ID number that maps to an internal
    database connected to the Remote Web server. Even if another site could read the
    cookie, the ID number would be meaningless. Used properly, cookies can only reveal
    personal information that has been voluntarily given by the user to the site that
    is being visited.


    The bad: Nevertheless, cookies can be used improperly. One major company sells
    a popular product for managing advertisements and dynamic content. When a Web
    site using this product collects detailed demographic information about a user,
    the information is associated with a cookie. That''s pretty straightforward. What
    is scary is that this cookie is stored in a global database along with the profile.
    When the visitor goes to another site that uses the same product, all of their
    profile information is immediately available. The company that offers this product
    ensures that no personally identifiable information is associated with the global
    profile. Assuming that this is really the case, there''s a more significant problem.
    Someone may be willing to give demographic information to a medical site under
    the belief that not entering their name and address anywhere on the site protects
    their privacy. They might give their name and address to a different site in order
    to make a purchase. If both sites used the aforementioned product, this latter
    site would have the ability to correlate the visitor''s name and address with
    the demographic profile gathered at the medical site.


    The ugly: If you think that was bad, look at what''s around the corner. At the
    time of this writing, one of the largest online advertisers, and one of the largest
    direct market data companies, announced a merger. If you have have cookies enabled,
