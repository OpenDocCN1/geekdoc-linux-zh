- img_proc: true
  md: 'The second thing to note about vi is that it''s modal, which is an unusual
    concept for people brought up on modern editors with drop-down menu bars and 46
    function keys. In one of its two modes, it is expecting text input, and i interpret
    everything you type it as text to be added to your document. In the other mode,
    it''s expecting command input, and i will interpret everything you type as commands
    to be executed. We will call these modes INPUT mode and COMMAND mode. Just to
    cheer you up, vi often won''t tell you which mode it''s in.


    Are you getting our point about user hostility yet?


    # Create a Test Document


    Let''s create something for us to work on, something that we can damage without
    destroying needed. Try:


    ```

    cp /etc/protocols /tmp/prototest

    ```


    and then enter vi with


    ```

    vi /tmp/prototest

    ```


    # How Do I ESCape?


    The escape key is your friend when using vi. Pressing ESC takes you back from
    input mode to command mode, and continuing to press it has no sideeffects—it just
    keeps you in command mode (and may emit a beep or two). All vi users develop the
    tendency to bash on the ESC key a couple of times to make sure they''re in command
    mode. Try it now.


    # How Do I Type Something?


    Lets place vi into input mode. There are numerous ways of doing this. The most
    common are by typing i or a in a command mode. The i places into insert mode,
    whereas a places it into append mode. Both are input modes, what''s the difference?
    In insert mode, the new character you type appear before the character currently
    under the cursor. In append mode, it will appear after character currently under
    the cursor. There are other ways of getting text into the file, but these are
    the two commands you''ll use most often. Both modes are exited by using ESC to
    return to command mode.


    We generally use i most of the time. a is useful if you want to add something
    to the end of the line, because you can''t move the cursor off the end of the
    line.'
