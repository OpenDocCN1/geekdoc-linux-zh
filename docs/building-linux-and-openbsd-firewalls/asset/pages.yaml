  md: '# The ABCs of Network Security


    This chapter offers a broad overview of security issues in any networked environment.
    First we look at why security doesn''t come naturally with the Internet. Then
    we step back and ask why we want security in the first place and what it is that
    we''re trying to protect. The purpose of a firewall is to protect your network
    from outside hackers, but what happens if the hacker is on the inside? With that
    in mind we wrap up this chapter by looking at internal security and its implications
    for the design of your firewall.


    # Why Is Security an Issue?


    This isn''t as daft a question as it first appears. Inasmuch as it was designed
    at all, the Internet was designed so that moving information around would be as
    easy as possible, mostly in a university environment. Security was not so much
    a lesser concern as a positive hindrance.


    You doubt us? Consider the ubiquitous http protocol, in many ways the heart of
    the modern Web. It was originally designed not for online shopping, but for publishing
    and distributing research papers with greater speed and flexibility than printed
    media. The idea was to get information to as many people as possible, as quickly
    as possible. Preventing people from reading your papers,'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'acquiring your credit card number, and altering your payroll information just
    weren''t the major considerations. If it had been any other way, the Internet
    would probably be a much more secure place, but you probably wouldn''t have heard
    of it.


    # The Internet doesn''t secure for you. Its openness is its strength.


    The design criteria of the quiet past are inadequate for the stormy modern Internet.
    Most machines and networks connected to the Internet are still inappropriately
    secured. Why is this? Since you''ve read the previous two paragraphs, you get
    no extra points for correctly deducing that it''s security is still not a major
    design consideration. During design, security gets sacrificed to other requirements
    like usability, cool graphics, and other kinds of chrome.


    **Chrome:** Showy features added to attract users but contributing little or nothing
    to the power of a system. "The 3D icons in Motif are just chrome, but they are
    perfectly chrome!" Distinguished from bells and whistles by the fact that the
    latter are usually added to gratify developers'' own desires for featurefulness.
    Often used as a term of contempt.


    > —Jargon File 4.0.0


    Invariably, moments before deployment, everyone decides that the new system ought
    to be secure as well. Mass pandemonium ensues, iron Band-Aids are slapped on the
    ailing project, and marketing tools the airtight security of the new system. It''s
    only a matter of time before somebody falls through that kind of security. In
    case you haven''t guessed, we think this is a bad idea.


    # Security is not an afterthought. If you try to deploy a system, then add security
    afterwards, the system will be either unusable, insecure, or both. Security must
    be deigned from the beginning.


    Including security from the beginning means understanding what security is. Understanding
    the nature of security means understanding the threats against which you wish
    to secure, the assets you wish to secure against those threats, and the technology
    available for doing so.


    # Work out what you''ve got, who wants it, how they can get it, and how you can
    stop them. That''s appropriate security.'
