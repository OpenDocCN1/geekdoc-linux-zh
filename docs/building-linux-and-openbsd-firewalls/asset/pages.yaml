    +   If you put a machine in the DMZ, it must be for a good reason. Sometimes,
    companies will set up a few workstations with full access within the DMZ. Employees
    can use these machines for games and other insecure activities. It is a good reason
    if the internal machines have no Internet access, or extremely limited access.
    If your policy is to let employees moderate access from their desktops, creating
    workstations like this sends the wrong message. The only reason why they would
    use a DMZ machine is if they were doing something inappropriate for the workplace.


