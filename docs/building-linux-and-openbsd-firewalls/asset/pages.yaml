  md: '# Configuring the Firewall under OpenBSD


    The ''on'' parameter allows you to specify a particular interface. If, for example,
    your Internet connection is via PPP across a modem, then it is likely that your
    network interface is ppp0. If it were true, you could apply more stringent conditions
    to packets by including "on ppp0" in the rule. If your external interface has
    another name (eth0 or sl0, for example) then just substitute that name for ppp0.
    Since this is the behavior we require of a firewall—that it be much cleaner to
    packets coming in from the outside world than to packets leaving your internal
    network—we will use this flag frequently in the final firewall. Let''s rewrite
    the prior TCP example above to specifically reference our inbound interface (the
    example assumes it''s ppp0). Note that the ''on'' comes after the ''/in/out''
    portion of the rule.


    ```

    block in on ppp0 proto tcp from 1.2.3.4 to any port = telnet

    ```


    Hopefully, you can already see how these tools will be used together to build
    a powerful packet-filtering firewall. There are still a few more tools we need
    to cover, if you''ve got your head around everything this last section, you''ve
    got most of what you need under your belt. Practice and experiment until you are
    comfortable with everything up to this point.


    # Other Important Concepts


    There are a few things we need to discuss before we''re ready to write some real
    rules. We''re going to talk about ICMP, route optimization, TCP flags, and stanie
    inspection. These concepts are a little more advanced, but you should be ready
    to handle them. If you''re confused, many of the underlying concepts are explained
    in Chapter 2, "Fundamental Internet Security Issues."


    # ICMP


    If you are matching on ICMP, then the ''port'' parameter might not seem useful,
    as ICMP doesn''t have ports. It does, however, have message types, and the ''icmp-type''
    parameter is used with ICMP to specify message types. You should consider permitting
    0 (echo-reply), if you want to be able to ping outside your network, and 11 (time-exceeded),
    if you want to be able to use the traceroute tool to check machines outside your
    network. (If you''re not familiar with traceroute is an extremely useful tool
    that can be used to find the path a packet is taking through a network, including
    the Internet. "man tracer" for more information.)


    Do not block ICMP type 3 unless suffering is fun for you. Not only is this used
    by remote hosts to signify that a firewall or other device has chosen to block'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'your packet, but type 3 ICMP is used by the TCP to negotiate certain parameters.
    Your network performance will suffer badly if you block type 3 ICMP to the machine
    you use to connect to the outside world. To allow it, use a line like:


    ```

    pass in proto icmp icmp-type 3

    ```


    Note that we have now allowed ICMP type 3 packets to enter the firewall, whether
    they are intended for the firewall or for some machine inside your network.


    There are numerous ways to filter ICMP packets. Some types of ICMP messages contain
    additional information in the form of code numbers.


    # Quick


    One of the most powerful, yet confounding, options is quick. It short-circuits
    the rule processing by forcing a matching rule to be the last rule processed.
    It''s a great way to save processing by quickly throwing away packets that are
    known to be bad or passing in packets that are known to be good. The problem with
    quick is that it is very order-sensitive. If a quick rule appears in the wrong
    place, it can cripple your entire firewall.


    Recall our earlier point about performance and first-match firewalls. If speed
    becomes an issue for you, you can use the quick keyword to achieve first-match
    performance levels for your most commonly blocked or admitted packets. We''ve
    just said, though, this increased performance comes with added complexity in your
    ruleset. Think carefully before using quick.


    Let''s look at our most recent ICMP example. We know we want to let in all ICMP
    type-3 packets without exception. Therefore, let''s place this rule at the beginning
    of the file and give it a quickie:


    ```

    pass in quick proto icmp icmp-type 3

    ```


    Now any ICMP packets will rapidly shoot through the firewall without ensuring
    prodding by the kernel for mundane conditions such as TCP flags, UDP ports, and
    so forth.


    # Only Allowing Established Connections


    Bear in mind that, behind your firewall, there will be flocks of users all initiating-TCP
    connections to all sorts of ports on all sorts of servers all over the Internet.
    Packets will be coming back to a variety of local ports from a variety of remote
    ports on a variety of machines. The only thing all these packets have in'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'common is that they''re all responses to connections initiated by your users.
    If your users start the connection, it''s good—if someone else tries to start
    the connection, it might not be so good.


    Consider the following rule:


    ```

    pass in ppp0 proto tcp all flags A/SA

    ```


    This rule applies only to packets on interface ppp0, and only which are TCP packets.
    So far, good. But then there''s this ''A/SA'' bit. What does it mean? After consulting
    the Rosetta Stone of IPF (the man page) we learned that it lets us filter the
    TCP flags present in a packet. There are two parts to the condition: before the
    / and after the /. The part before the ''/'' says that we''re testing for the
    presence of the ''ACK'' flag. The part after the ''/'' says we''re only concerned
    with the state of the ''SYN'' and ''ACK'' flags. When we put the two together,
    we see that this rule will match a packet that has the ''ACK'' flag set but not
    the ''SYN'' flag. Any of the other TCP flags could be set or not set—this rule
    doesn''t count.


    So what does this mean, in practical terms? Going back to the threeway handshake
    model described in Chapter 2, we see that when a client initiates a connection
    it sends a packet with the ''SYN'' flag and the initial sequence number. When
    the server responds, it sends a packet with the ''SYN'' and ''ACK'' flags set,
    along with the server''s initial sequence number and the client''s incremented
    sequence as an acknowledgment. Once the connection is established, neither side
    will send SYN packets. The only things that get are ACKs. Therefore, if we want
    to only allow established connections, we should not accept any packets with the
    ''SYN'' flag.


    There is an alternate way of implementing this policy that is more explicit: Blocking
    the offending packets right up front. To do this, the following line needs to
    appear at the top of your filter file:


    ```

    block in ppp0 proto tcp all flags S/SA

    ```


    If you want to add another safety measure, you can block the response that your
    internal machines would give if an external machine somehow was able to originate
    a connection.


    ```

    block out of ppp0 proto tcp all flags SA/SA

    ```


    This stops your machines from offering the second handshake. Combine these rules
    with a default policy of ''block in all'' and some rules to accept packets originating
    inside your network, and you''ve done some highly selective filtering already.'
  merge: -1
