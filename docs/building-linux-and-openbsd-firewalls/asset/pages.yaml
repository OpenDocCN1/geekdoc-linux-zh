  md: '# Rules and Chains


    Recognizing that heading may cause deviant thoughts, we''d like to immediately
    refocus your attention on firewalls. Two concepts are key to the correct use of
    ipchains: rules and chains. Chains are what packets must pass through to enter
    or leave a network interface, or to move from one interface to another; rules
    control the passage of the packets through those chains.


    # Chains


    When packets travel through a network interface, they are sent through one or
    more chains. Specifically, when a packet attempts to enter a network interface,
    it passes through the input chain; when a packet attempts to leave a network interface,
    it passes through the output chain; when a packet tries to travel between one
    interface and another, it passes through the forward chain. These chains are applied
    sequentially. If a packet enters one network interface with a destination that
    requires it to be routed out another interface, it must pass through the input
    chain to decide if it''s allowed to be forwarded, and through the forward chain
    and through the output chain to decide if it''s allowed to leave. This point is
    particularly important in the case of a firewall router, since its job is to move
    packets selectively from one interface to another.


    The forward chain is where masquerading will be included if we decide to use it.
    Recalling the IP Masquerading section from Chapter 3, "How Secure Should Your
    Network Be?", you will need to use IP Masquerading if you have less public IP
    addresses assigned to you than you have on your internal network. As we pointed
    out back then, you may choose to use masquerading for security if you have enough
    addresses to go around.


    # NOTE


    +   Chains do not make decisions about how to route packets; that''s handled by
    the routing tables. The only decision made by the chains is whether to route packets.
    We will cover routing tables in more depth in Chapter 10.


    Chains have a default policy, which is defined by you. If a chain contains nothing
    else except a default policy, every packet that passes through that chain will
    be treated similarly. The possible policies are ACCEPT, DENY, and REJECT. ACCEPT
    means "allow to pass through the chain," DENY and REJECT both mean "do not allow
    to pass through the chain." There is a subtle difference between DENY and REJECT,
    which we cover next. To make this concrete, consider chains with no rules: if
    the default policy of the input chain is ACCEPT,'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Configuring the Firewall under Linux


    then any packet will be allowed to enter any network interface; if the default
    policy of the output chain is DENY or REJECT, then no packet will be allowed out
    of any network interface.


    # DENY or REJECT?


    DENY and REJECT both mean to refuse passage through a chain to a packet. However,
    in the case of DENY, the kernel silently discards the packet. Drops it on the
    floor, as it were. This is the most resource-efficient way of refusing a packet,
    but it can be unhelpful to the sender—the message disappears into the void, without
    any trace that it was dropped. REJECT, on the other hand, tells the kernel to
    discard the packet and send an ICMP message back to the sender to advise that
