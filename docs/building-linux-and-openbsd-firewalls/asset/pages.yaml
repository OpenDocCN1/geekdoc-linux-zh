  md: 'on the modem can be very useful for diagnosing problems. Some internal modems
    do have blinking lights, but they''re generally at the back of the machine they''re
    a lot harder to monitor.


    If you go with an internal modem, you might wish to disable the external serial
    port in the motherboard''s BIOS; it can help to minimize internal conflicts. See
    the following section in BIOSes for details.


    # Other Considerations


    Again, failure in the firewall can be a bad thing. Although failure in the PSU
    is annoying—your firewall''s going to be dead until you get a new PSU—failure
    in the disc can be catastrophic. If you don''t have backups, your whole firewall
    will vanish. You can replace the disc, but you''re going to have to rebuild the
    system from scratch. If you have backups, you''re still going to have to install
    enough of an OS to be able to read and then restore the tapes, but you''re going
    to be down for a while.


    An alternative is hardware RAID (Redundant Array of Inexpensive Discs), although
    it''s usually done with high-end drives and might be better called a Redundant
    Array of Particularly Expensive Discs. An in-depth discussion of the nature of
    RAID is somewhat beyond the scope of this paragraph, which can be found at many
    places, www.repairsite.com/info.htm among others. One particular aspect of RAID,
    known as RAID-1 or “disc mirroring,” is of interest here. Instead of having one
    disc with everything on, you have two. Both of them have everything on. Every
    change made to one disc is automatically copied to the other as well. If one disc
    fails, the other is still there and will run the system. When the first is replaced,
    the contents of the second are automatically copied onto it, and life continues
    calmly.


    RAID software is built into Linux, but it can be pretty hairy to configure, and
    we would not recommend it. However, you can do cheap and cheerful hardware- RAID
    with two IDE drives and a small piece of dedicated hardware that writes to both.
    The system thinks that it has only one disc. Such hardware can be obtained from
    ARCO (www.arcoide.com), and doubtless from other places, too. Ask your favorite
    Web search engine about “IDE,” “RAID,” and “mirroring.” See what happens.


