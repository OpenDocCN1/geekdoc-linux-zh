    # Hardware Overview


    What we''re trying to build here is a pretty simple machine with the following
    components:


    +   - A CPU on a motherboard

    - Some memory

    - A graphics card, monitor, keyboard, hard and floppy disc drives, a CD-ROM drive,
    and a mouse

    - A modem, ethernet card, or other device to connect to the outside world

    - One or two ethernet cards to connect to your internal network


    This isn''t rocket science. The system is performing a relatively simple and highly
    repetitive task. Therefore, the design should be as simple as possible. There''s
    a maxim about this: KISS (it stands for keep it simple, stupid). The more complex
    this machine, the more that can go wrong with it. Therefore, we''ll keep it as
    basic and boring as we can.


    Lest you think we''re elaborating the point, take a look at the Linux Router Project.
    You can find these people at linuxrouter.org. They''re serving humanity by making
    a router so simple that it can fit on a single 1.4Mb floppy—OS, the routing code,
    everything. Take an empty box, stick the floppy in it, and presto! That''s that.
    We''re not going to go far. Being there has some design implications that we don''t
    want here. For example, instead of editing a configuration file, you need to remake
    the boot using special tools. You''ll need another machine configured to work
    with these special tools, since the floppy doesn''t have room for anything other
    than the essentials. Simplicity configuration is sacrificed for simplicity in
    operation. This is not a bad thing—it''s not just what we''re writing about. But
    it''s an impressive stuff, and it should bring home to you the idea that simple
    is good.


