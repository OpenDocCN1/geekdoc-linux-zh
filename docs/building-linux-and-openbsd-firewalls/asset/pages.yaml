  md: '# Intrusion Detection and Response


    Fortunately, these two tasks parallelize well. The job of restoring systems from
    known-good backup media or re-installing systems from read-only installation media
    is essentially great work which requires technical direction, while the job of
    incident evaluation requires a high level of expertise but not many people. Technical
    lead on the post-incident recovery, you will be able to concentrate better on
    the evaluation if you have prepared the recovery phase. Let''s take them one at
    a time.


    # Incident Recovery


    The only truly safe thing to do is to reinstall all your systems from installation
    media, then reinstall all your programs similarly. This could take a very long
    time, so people are usually extremely unwilling to do it. On the other hand, sometimes
    anything has been so badly compromised that there''s no other safe course of action.
    Trying anything can lead to a vicious cycle of restore after intrusion after intrusion
    and general wailing and grashing of teeth. Life will be simpler if you have some
    clearly defined criteria about when the bullet has been bitten. Try to make some
    metrics for determining when a machine must be reinstalled from scratch, when
    a machine must be restored from tape, and when a machine can be patched up. Cryptographic
    measures such as tripwire can be a great help here, because they can very quickly
    tell you what has changed on a given system.


    Bear in mind that a good intrusion won''t be noticed for some time; some are never
    noticed. Only if you can precisely pin down when an intrusion happened can you
    say with confidence whether any of the backups are knowngood, and if so, what
    date they must precede to be known. If you can''t be sure about that, restores
    cannot be safe and reinstalls are your only recourse until a machine can get a
    clean bill of health.


    Your plan should lay out what tests have been passed for a machine to get a clean
    bill of health. If your plan calls for restore or reinstall, it should lay out
    where the media are, which tape or CD drives are suitable to read them, and lay
    out the commands needed to perform the restore/reinstall.


    Finally, you need to make arrangements for damaged systems to be backed up to
    tape for analysis before the damage is erased, should the recovery team get so
    far ahead of the analysis team that they have no other machines to check the very
    ones you''re analyzing. Make sure that you''ve got enough spare media on site,
    over and above your regular stocks, to allow you to keep what snapshots you need
    to keep in the event of an incident.'
