  md: '# Intrusion Detection and Response


    found kernel bug and is shutting down our web server. What do we Right

    Now, and what do we do after the core breach has been locked down?


    Like Chapter 1, “The ABCs of Network Security,” incident response breaks well
    into guidelines for small, medium and large businesses. Remember that the large
    company section is more a list of discussion points for good practice than a set
    of instructions to be used the day you hire your 101th employee. Like most things
    military, incident response benefits from regular planning and practice. Practice
    doesn necessarily mean staging events; it can be as simple as dragging the tech
    off for pizza and bear-playing an incident. Leave the bear until the post-incident
    phase, unless the inevitable massive hack-in-at 6:00 P.M. on Friday, two hours
    into your weekly corporate bear-blast.


    # During an Incident


    We feel organized behavior during an incident comes in four stages. Your policy
    for each of these stages needs to be carefully thought out ahead of time—not during
    the breach. The stages, in order, are notify; evaluate; disconnect or shut down;
    and further notification. Some of the later stages may happen in parallel, but
    if you cover all these bases you''ll be doing well.


    # Notify


    At some point, something will happen that alerts you to an incident in progress
    or an incident that went unnoticed—until now. It may happen at night, it may happen
    during lunch, it may be noticed by whoever’s responsibility for security, or it
    may be noticed by an operator, or a user, or an automated system. The automated
    system will do what it’s programmed to do: To get this right, you just need to
    keep it’s list of conditions and responses (if A happens, page B; if C happens,
    page D only if it’s before midnight, otherwise page E) up to date. If anyone is
    noticed by some person not qualified to evaluate it, you will have a problem unless
    you have a clear policy for the situation. People need to know who to tell, and
    how to tell them, if they see something’s not right.


    If you’re a small company, notification is usually easy—at one of the author’s
    sites, people are instructed to call the author’s cell phone. The cell phone redirects
    to an answering machine at nights. This policy works well for the author. You
    need to work out what you can live with, tell people, and live with it.


    At medium companies, you will probably already have some kind of system in place
    for the users to tell the computing support person (or people) what to do when
    something’s not right. This system will already be used for messages'
