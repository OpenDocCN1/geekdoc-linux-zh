- img_proc: true
  md: 'The two-channel structure deals with separating requests for data from the
    data itself. Each FTP server has a *command channel*, where the requests for data
    and directory listings are issued; and a *data channel*, over which the requested
    data is delivered. All other control information, such as authentication exchanges,
    is sent over the command channel.


    # Active Mode


    In active mode, an FTP server receives commands on TCP port 21, but uses a strange
    mechanism to exchange data with the client. When a client contacts an FTP server
    in active mode and wants to send or receive data, the *client* picks an unused
    local TCP port between 1024 and 65535, tells the server to connect on the chosen
    port. The server opens a connection from TCP port 20 to the specified port on
    the client machine. Once the connection is established, the data are passed across.
    Most command-line FTP programs use active mode by default, though some of them

    can be configured to use passive mode.


    Active mode is good for FTP servers behind firewalls, because the firewall only
    has to permit access to one predetermined port on the server. Unfortunately, it''s
    terrible for clients behind firewalls for two reasons. First, the server is communicating
    with the client on any arbitrary port between 1024 and 65535. This means this
    firewall needs to permit any computer on the Internet to access any port between
    1024 and 65535. For a network security administrator, that''s very bad news indeed.


    The other problem with active FTP is a technical hurdle for masquerading firewalls:
    When the client picks a port for the data connection, it sends it across the command
    channel. The server initiates a return connection to the firewall on the port
    chosen by the client. The server expects the client to be waiting for inbound
    connection, and indeed, the client is waiting—but the firewall isn''t. Most standard
    portmasters have no way of knowing that the incoming connection is part of an
    active FTP session. Additionally, the information present in the inbound packets
    doesn''t tell the firewall which internal machine is the intended recipient.


    One attempt to address the port mapping issue is called *adaptive firewalling*
    and is described in detail later in this chapter in the section *Commercial Firewalls*.
    You''ll see, adaptive firewalling is not really a great solution.


    To be brief: Unless you want to blow large, swiss-cheese type holes in your firewall,
    you have to say no to active-mode FTP clients.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Passive Mode


    In passive mode, the command channel is port 21 on the server, but the traditional
    data channel port 20 is not used. Instead, the client requests passive mode, the
    server picks an unused TCP port between 1024 and 65535 and tells the client. The
    client opens a connection to that port on the server. The server is listening
    on that port for the inbound connection from the client. Once the connection is
    established, the data flow across. Most modern browsers use passive mode for accessing
    ftp://.


    It''s easy to have your firewall support passive FTP clients because the client
    is initiating the command and data channel connections to the server. The portmapper
    sees the outbound connection from the client and sets the proper mapping. The
    server can then communicate back with the firewall through the new channel.


    The trouble with passive mode begins if you''re running an FTP server. The nature
    of passive mode requires you to permit any connection to open to any port between
    1024 and 65535 on your FTP server. If your FTP server is on your internal network
    and is meant for internal access only, this may not be a terrible problem. It
    is an issue if you''re concerned about attacks within the network, since it creates
    opportunities for hackers who already within your internal network. In such a
    scenario, you might consider making an internal-only active mode FTP server. Of
    course, the best solution is to use a non-FTP alternative for internal-only access.


    The real problem with passive mode occurs if you need your FTP server to be externally
    accessible. It is an extremely poor idea to allow this sort of access to your
    internal network, and it''s very hard to do with port forwarding anyhow. Therefore,
    servers that can be accessed from the Internet in general should always be in
    a DMZ. To your internal machines, the DMZ server should look like any other outside
    machine—that is, they''ll have to use passive mode to get past the firewall. Even
    if serving your own users is not a priority, the general trend on the Internet
    is strongly towards passive mode in most web browsers when connecting to FTP servers.


    By and large, if you can hide under a rock, do it. This means not having a local
    FTP server, and only allowing users to use passive mode across the firewall.


    # More Problems: Anonymous FTP


    Many FTP servers support anonymous FTP. While FTP once required a valid username
    and password on the FTP server, it eventually became clear that there were some
    files the server administrator wish to make available to everyone, regardless
    of whether they had an account on the server. Anonymous FTP was the solution to
    this problem. You can talk to an anonymous FTP server by logging in as user "anonymous"
    (or as user "FTP" on more recent'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'servers—those of us who can''t type quickly). By tradition, the password you
    pass back should be your full email address. Many FTP servers will grumble if
    you provide a junk password, but they''ll still let you in. A few rather fascist
    FTP servers will refuse you access unless you provide a real (or correctly formatted)
    email address, but they have no way of checking if it''s your address.


    Any half-decent FTP server will make use of the chroot system call, or OS-specific
    equivalent, for anonymous access. This is a system call that hides the file system
    from the FTP server process. It works by constraining the server to a specific
    subdirectory and all of its subdirectories. As far as the server is concerned,
    there are no other directories outside of the chosen subdirectory. It thinks that
    the chosen subdirectory is the root, or top-level directory, of the file system.
    This isn''t perfect security, but it makes it very hard for a user to abuse an
    anonymous FTP session and get to parts of the FTP server that the client should
    not see. If you must run an FTP server, make like the wu-ftpd (originally the
    Washington University archive FTP server), current details of which can be found
    at www.landfield.com/wu-/


    Now for on incoming FTP: If you must run an FTP server, and it must support anonymous
    FTP; fight as hard as you can to avoid incoming anonymous FTP. This is an area
    on your FTP server to which the FTP user can create. Not only are they glaring
    targets for denial-of-service attacks, but you will end up being used for warehousing.
    This is when some random punk uploads a whole pile of pirated software (usually
    Windows games) to your FTP area, and then tells about half a million "friends"
    of his where they can download "warez.". Not only does this bog your Internet
    connection, but it may have unpleasant legal liabilities for you, depending on
    your location.


    One of your authors worked for a company that insisted on having anonymous FTP,
    and in consequence made it on several lists of "open" sites by the warez community.
    When we discovered the problem, our first thought was to control monitoring uploads
    and rapidly deleting anything suspicious was uploaded. We wrote a perl script
    that relayed every new upload information to our beers. The theory was that the
    warehousers would wise up in a couple of days and move on.


    It turns out that our theory had no correlation with reality. We found that we
    could rapidly get fed up by being woken at 4.30 A.M. because someone uploaded
    his latest junk to our FTP site. The warehousers didn''t pay any attention, they
    just continued uploading stuff. After three weeks of this, we turned off incoming
    with an axe, and threatened to give our beepers to anyone who wanted it back on.
    It''s still off.'
