  md: '# Nonanonymous FTP


    Running an FTP server that requires a username and password is only a good idea
    if the usernames and passwords have nothing to do with internal network logins.
    The entire FTP session is unencrypted; passwords are sent over the network in
    plain text. The only way to protect the login process is to encrypt the entire
    network session between the client and the server. If you have the capability
    to create a secure tunnel, then you also have available better mechanisms of file
    transfer available to you. Read on to see what we''re talking about.


    # Other File Transfer Options


    FTP isn''t the only method of moving files around the Internet. TFTP, the trivial
    File Transfer Protocol, is mostly used for booting workstations, configuring network
    equipment, and the like. It should not be allowed through a firewall; it runs
    on UDP port 69. RCP, the Unix Remote Copy Program, is so insecure that it is scary,
    and under no circumstance should it be allowed through a firewall (along with
    all the other r commands, etc. below). If you wish to use a Unix style copy command,
    SCP, the Secure Copy Program. This is part of the ssh (secure shell) suite which
    we praise in a few ''pages'' time.


    Filesharing (mounting a file system from one computer onto another across a network)
    should not be allowed unless done securely (i.e., with a proper Virtual Private
    Network solution, discussion of which is outside the scope of this book touched
    upon in a few pages). This translates to NFS (Network File System), a Unix filesharing
    technology; or SMB (Server Message Block), a Windows filesharing technology, across
    a firewall.


    NFS runs on UDP (and, in some modern implementations, TCP). The port it runs on
    is less tightly defined than normal TCP and UDP services; clients coming to NFS
    do so by asking a service called the RPC portmapper (Remote Procedure Call) to
    tell them UDP or TCP ports the NFS service is running on. Note that RPC is different
    from RCP, the Remote Copy Program. The RPC portmapper runs on TCP and UDP ports
    111; access to this port number should never be allowed through a firewall because
    it can give a hacker tons of useful information. With most standard versions of
    NFS, it''s also a good idea to block TCP and UDP access to port 2049, because
    this is the default port number on which the NFS server usually ends running.


    SMB uses TCP ports 137, 138, and 139. and in our opinion it should be blocked
    outgoing incoming as well, especially if you have any Windows boxes on your internal
    network.'
