- img_proc: true
  md: '# Problems Associated with NNTP


    NNTP has precisely one responsibility, the transmission of news. Nearly all modern
    enhancements to NNTP servers are concerned with performance improvements and keeping
    up with the flood of news. This tends to make NNTP servers efficient and short
    on security holes.


    The real issue with NNTP is practicality. Do you really want to run an NNTP server
    within your organization? Is your primary goal to allow people within your organization
    to access public newsgroups, or are you planning on running your news hierarchies?


    Taking a full news feed creates significant bandwidth problems. At the time of
    this writing, the average daily volume of news traffic can easily exceed the capacity
    of a T-1 leased line, which is about 15 Gb per day. You might notice that supporting
    a full news feed is an expensive proposition of limited value, especially given
    that a significant amount of this volume is composed of pornography and spam.


    If you just want internal access to public news groups, the easiest solution is
    to point your users at one of a number of Web-based interfaces to Usenet such
    as Deja.com and remarQ. The next best solution is to find an ISP that runs a news
    server and to let your users connect to the ISP''s news server directly.


    If you want to run public discussions on specific topics, there are better ways
    to accomplish this than by using a news server. You can set up a Web-based discussion
    list, or you can use a commercial site that lets you create your own on their
    server.


    # How to Make NNTP Secure


    With all that said, we hope we''ve managed to communicate that you probably don''t
    want to run a public NNTP server. Nonetheless, you might consider an application
    for which it is necessary and worthwhile. If you do, you''ll need to open access
    to TCP port 119 from the outside world. As with any other server, pick any common,
    reliable, open source implementation, keep an eye on the developers'' mailing
    list, and you''ll hear about the few holes as soon as they''re known. Keep up
    with your patches.


    If you just want to provide access to an outside news server, you merely need
    to let machines at your site access port 119 on the external NNTP server of your
    choice.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Streaming Services


    Until now, we''ve discussed communications protocols that are based around the
    concept of request and response. The client or server requests information, and
    the other party sends it. Data are sent across chunks and are processed upon the
    complete receipt of the information. There is another type of communication where
    the data flow is continuous and processed immediately. This is known as streaming
    communications because there is a constant stream of data.


    The first types of streaming communications were very basic. Programs like talk
    enabled two users to type messages to each other in real-time across a network
    connection. Each letter would appear on the other user''s terminal as soon as
    it was typed. This gave a sense of immediacy to the communication that could not
    be obtained through email.


    Initially, video and audio were downloaded in bulk form—only after the client
    had received a large data chunk could it play the result to the user. It wasn''t
    long before some somebody figured out how to send small chunks of information
    that could be processed and played immediately. If the connection between two
    machines was very fast and stable, real-time audio or video could be sent across
    the network. It was a short leap to then enable two-way communications over the
    Net.


    Somewhere along the line, some over-eager developers slipped and let a marketroid
    look at the technology. Immediacy things things like Internet phones, voice chat,
    and video conferencing were being hyped up as "the next big thing." The marketroids
    didn''t understand that the fundamental framework of the Internet simply couldn''t
    fulfill the promises they were making. Unfortunately, their hype was creating
    a large demand for the technology. Kicked out of the house at an early age by
    the marketing hype, streaming technology had to do a lot of growing up, and quickly.


    The problems facing real-time streaming services are numerous. A minute of video
    or audio results in several megabytes of data. Without compression technology,
    it''s not possible to transfer that data in real time, especially considering
    that most users connect to the Internet over mobile. But existing compression
    technology required the entire data file ahead of time. Furthermore, the decompressing
    of the data took significant processing time. New compression technologies were
    invented to reduce the amount of data sent by a significant factor.


    On the network side, TCP requires too much overhead to deliver streaming services
    quite quickly. Remember that TCP was designed to provide reliability at the expense
    of redundancy. Thus, UDP was used for data and TCP was'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'reserved for command information. Since UDP might be missing or out of order
    at any given time. The real trick was finding compression formats that could still
    be decompressed with missing data. Over the past few years, major strides have
    been accomplished in delivering streaming content. Nevertheless, there''s a long
    way to go. Issues like latency, lag, and computing resources still greatly influence
    the performance of streaming communications, especially the most recent variants.


    We address two of the most common types of streaming services here, but be aware
    that all of the following sections deal with sending data in real time across
    the network and have many of the same underlying problems from a network design
    standpointpoint.


    # Internet Relay Chat


    In late 1988, Jarkko Oikainen wrote Internet Relay Chat (IRC) to enable multiple
    users on multiple servers across the world to communicate in real time. Other
    multiuser environments existed prior to this, but were limited to smaller networks
    or individual computers. Since then, IRC has grown to become the most popular
    mechanism for real-time communication. Many of the Web-based and proprietary chat
    networks also use IRC as the technology.


    # Problems Associated with IRC


    IRC is not a secure communications framework. Everything is sent cleartext over
    the network, including private messages. Given the size and nature of the IRC
    network, this means a lot of computers will see your message, unless you''re running
    a private IRC server.


    The biggest problem with IRC is that tons of wanna-be hackers are roaming the
    public networks, looking for targets. They probing your IP addresses for standard
    vulnerabilities. Some popular IRC clients (mIRC in particular) have notable insecurities
    that allow these hackers to directly attack the machines of your users, completely
    bypassing any network security measures you have in place. They''ll also try to
    use various social engineering techniques to get your users to download Trojan
    programs such as Back Orifice.


    Once a hacker has penetrated your network, they may decide to brag about their
    accomplishment by setting up an IRC server on your network. When other immature
    hackers see this, they are filled with envy and rush out to try and hack somebody''s
    network. If you see an IRC server running on your network filled with users named
    k''Ng3g1, g0d, phr33d00d, etc., you can bet that you''ve been hacked by a bunch
    of 103z3r2 (for an explanation, see the Jargon file entry on lamer-speak: www.tuxedo.org/~esr/jargon.html#Lamer-speak).'
