  md: 'There are only two serial ports on most modern PCs (don''t confuse them with
    the parallel, or LPT, port), and they are accessed through the device files /dev/ttyS0
    and /dev/ttyS1, and they correspond to COM1 and COM2, respectively. These can
    also be known as COMA and COMB, respectively. If your modem''s connected to a
    serial port on the back of your firewall, it can be talked to through /dev/ttyS0
    or /dev/ttyS1.


    But which one? Your best guide is your motherboard manual. If it makes clear which
    of the serial ports are COM1 and which is COM2, you will know which modem is connected
    to. If it''s COM1 or COMA, you will use device file /dev /ttyS0 to talk to your
    modem; if your modem is on COM2 or COMB, talk to it through /dev/ttyS1. If your
    motherboard manual isn''t helpful, read on.


    If you have a serial mouse, life''s easy—the mouse on the other part of the mouse
    You find out which port the mouse is on doing "ls -al /dev/mouse";dev/mouse is
    a soft link which points to the real device the mouse is. On the machine I have
    with a serial mouse, the output from the above command looks like this:


    ```

    lrwxwxrwxrwx 1 root root                May 15 14:22 /dev/mouse

    -> /dev/ttyS1

    ```


    which means the mouse is on /dev/ttyS1, the modem must be on /dev/ttyS0. You may
    find that the "dev/" is missing from the "ttyS1"; don''t worry, it''s not important.
    If you get something like this:


    ```

    lrwxwxrwxrwx 1 root root                10 Nov 18 1998 /dev/mouse

    -> /dev/psauxx

    ```


    then you have a PS/2 mouse, and will have to think harder.


    If you don''t have a serial mouse, it''s a good thing you have an external modem
    with status lights (did you follow our suggestion in Chapter 5, "Getting the Right
    Hardware," right?). Trying "echo AT > /dev/ttyS0 &" and watching the lights on
    the modem. If the lights flicker, yet they don''t flicker, try it with /dev/ttyS1
    installed. The "&" was used to run the command in the back-ground, because this
    has a tendency to wedge the serial ports—you certainly can''t do it twice in a
    row unless you''re lucky.


    The other thing that can go wrong is the wrong type of cable. Assuming the ends
    are right size and gender to connect your modem to your computer, there are still
    two types of cables: one is intended to connect modems to computers, and the other
    is intended to connect computers to computers (or modems to modems). If you have
    the wrong type (they''re very difficult to tell'
