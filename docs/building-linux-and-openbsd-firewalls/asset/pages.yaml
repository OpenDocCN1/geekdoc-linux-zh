  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    the payment of salaries halted, pain killers may become inadequate and you’ll
    need a suicide hotline.


    Even machines containing only public data need security: When the New York Times
    Web site crashed in September 1998, everyone had a laugh at their expense. You
    can do without that kind of publicity.


    One of the worst cases of unauthorized access to data is that it is so hard to
    detect. If someone copies your payroll records and doesn''t make them public,
    you may never know. If someone changes a single bit in the middle of your latest
    software package, the one you were about to ship, you may not hear anything until
    a horde of irate customers comes outside your front gate. Even if you can tell
    that a machine’s been compromised, you may well have no idea of the extent of
    the damage.


    # TIP


    If a machine is found to have been penetrated, you need to treat it as having
    been fundamentally compromised, even if nothing appears to have been changed.


    The data, the OS, and any other machine that trusts the compromised machine, are
    all now suspect. You will need to go over them with a fine-toothed comb before
    you can trust them again. This can take a monstrously long time. Reinstalling
    from scratch may be quicker. In many ways, it is easier to recover from the cracker
    who brute-forces your entire hard disk than it is to recover from the machine
    which shows a couple of privileged logins from off-site. Later in this book, we
    will cover tools designed to deal with the difficulty of intrusion detection,
    and we will also cover what to do if you believe you have been penetrated—namely,
    incident response.


    # Computers


    You know what your computers are: They’re the actual machines with the hard disks,
    right? Well, yes, they also include the network that connects them to each other
    and the Internet connection that connects network to the outside world, your backup
    tapes (you are keeping backups, aren’t you?), and in brief, just about anything
    that’s hooked up to one of your computers that isn''t breathing.


    If a cracker comes and uses your computers but doesn’t touch your data, has any
    harm been done? Well, for companies in the business of selling those resources,
    such as Internet service providers, computer resources being used by bad guys
    can''t be sold to paying customers. If your company’s product is not the services
    of its computers, it almost certainly uses the computers in the process of selling;
    if the computers slow down or even crash, the sales process'
