  md: '# # CHAPTER 5


    # # Getting the Right Hardware


    ![](img/2fea8bfa30d45d039dcc057b944028fc_164_0.png)


    In the previous chapter, we helped you select an operating system for your firewall.
    This action assumes you''ve made your choice and are now ready to take decisive
    action. If you haven''t yet made up your mind, you should find a rock garden somewhere
    and contemplate matters before continuing.


    In this chapter, we''ll help you choose appropriate hardware for each operating
    system. We''ll think about where you might get it, and the pros and cons of putting
    your system together from components, versus buying it off the shelf. The performance
    of your system will be important, so we''ll discuss what makes a system good for
    the job. Finally, we''ll talk about putting your machine together.


    After this chapter, you should have a few boxes sitting in front of you. Some
    will be cardboard. One should be heavy, metallic, and probably beige. If all goes
    well, the metal one will become a critical part of your network and the others
    will go into storage. If you find that the reverse has occurred, you''ll probably
    also find this book more useful as a doorstop. At any rate, from here on when
    we refer to a box we''re talking about the expensive whirring gadget with blinking
    lights.


    When you''ve worked through this chapter, your box should contain hardware you
    believe to be compatible with the OS of your choice, and in working order.'
