  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Why does this kill a machine? TCP is a high-priority kernel kernel-level process.
    This means that it takes priority over all nonkernel applications. It basically
    interrupts normal system operation so that it can claim kernel resources to processes
    incoming data. The infinite loop rapidly consumes all of the system''s resources
    and on most systems causes a painful death. Some, TCP will eventually time-out,
    but few popular operating systems are stable enough to survive when kernel resources
    are maxed out for an extended period of time.


    There''s something else to watch out for—a variant of Teardrop is combined with
    the LAND attack, hitting your system with a double wann. Teardrop and LAND attacks
    can be fixed by downloading a patch for your operating system. Both OpenBSD and
    Linux have been patched. Most versions of Windows also have patches. The companion
    Web site links to major security patches for each platform.


    OK, that was easy. Now let''s get into some serious TCP issues. We just described
    the process by which TCP connections are initialized. We also talked about how
    TCP sends acknowledgments after each successfully transmitted packet. What you
    might have noticed missing was an authentication mechanism. That''s because there
    is none. TCP assumes that the data are acceptable as long as it receives properly
    formed packets with sequence numbers. Once the connection has been established,
    there''s no way for a server to determine whether the data are coming from the
    client machine or from a machine pretending to be the client machine.


    Imagine the following situation: A client program is communicating with a server
    via TCP. An attacker uses the ARP technique (described later in this chapter)
