    # Practical Firewalling


    Enough theorizing, enough practicing—it''s time to write a real firewall. We''re
    now going to give a simple example. You could take this script and use it as your
    own firewall, if your circumstances were right. On the companion Web site at www.wiley.com/combooks/sonnenreich,
    you''ll find scripts that are more generally valid, in that they use variables
    to allow you to edit interface names, and networks, for example, without editing
    every rule by. If you want to start from a cut-and-dried script, we''d recommend
    using one of those.


    In this example, any line that starts with a ''#'' is a comment. Comment precede
    each section and each substantive line of code where needed. ppp0 is our external
    network, eth0 is our internal network, and lo is the loopback interface. You should
    permit traffic come in the loopback interface unmasked. Our internal network is
    masqueraded, and we are using the private subnet 192.168.1.0/24 internally. Our
    ISP''s DNS servers have the IP addresses 1.2.3.1 and 1.2.3.2, or our ISP''s NTP
    server has the IP address 1.3.4.5.


    ```

    ****************************************************************

    # Firewall rules

    ****************************************************************

    # set our default policies: see note 1

    block in log all

    pass out all


    # accept packets coming from the internal interface

    pass in eth0 all

    pass in lo all


    # deny any coming from outside which are illegal: see note 2

    # first take care of standard untroutables

    ```


    ```

    block in log quick on ppp0 from 0.0.0.0/32 to any

    block in log quick on ppp0 from 255.255.255.255/32 to any

    block in log quick on ppp0 from 127.0.0.0/8 to any

    block in log quick on ppp0 from any to 0.0.0.0/32

    block in log quick on ppp0 from any to 255.255.255.255/32

    block in log quick on ppp0 from any to 127.0.0.0/8

    ```'
