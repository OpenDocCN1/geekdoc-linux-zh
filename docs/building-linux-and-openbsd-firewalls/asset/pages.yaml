- img_proc: true
  md: '# How to Make IRC Secure


    The first question you need to ask yourself is, “Do I need IRC?” If you just want
    to participate in IRC discussions, you can use a Web-based interface or some other
    chat network. Virtually every portal site offers some form of real-time chat.
    Talkcity.com is one of the main Web chat providers. Linux.com offers a Java applet
    interface to a number of IRC discussion channels. Undernet.org, Webmaster.com,
    and others offer full Web-based interfaces.


    If you still want to use a traditional IRC client to connect to IRC networks,
    be aware that many popular IRC clients are notoriously full of security holes.
    The most popular Windows clients, mIRC, is continuing to be exploited. Even worse,
    mIRC is not open source. As popular as this client is, we recommend you avoid
    it. In general, Windows clients are not very secure. The best IRC clients are
    those that have been around for a while and are open source such as ircii. These
    open source clients are only available for Unix platforms. You can find links
    to them on irhelp.org.


    It''s hard to imagine any situation in which users within your private network
    need IRC access. You''re far better off providing this service on a DMZ machine,
    preferably running one Linux or some relatively secure OS. You should also pick
    a set of IRC servers that will be allowed. Some servers will use nonstandard ports,
    and this will require punching more holes in your firewall. As it is, you''ll
    need to allow outbound connections to TCP port 6667 and possibly a few others.
    There are also SOCKS proxies for IRC servers.


    Running a publicly accessible IRC server is also not recommended. There are plenty
    of alternative solutions to providing real-time chat that are easier to access
    and interact with. Many IRC users want to run a server to simply gain operator
    access. These users feel that operator status is impressive. Real server operators
    know that it''s just a time-consuming job.


    If you''re running on an IRC server, you need to make sure your software is open
    source and actively being developed. Running a full IRC server is an expensive
    proposition. The bandwidth requirements are very high—you won''t be able to link
    your server to many of the public networks without at least a T-1 connection.


    A great place to learn more about IRC is irhelp.org/.


    # Streaming Media


    There are numerous variations in the streaming audio/video theme. Broadcasting/audio,
    canned video/audio clips, Internet telephony, and even video games fall into this
    category. As bandwidth increases, more and more applications are using streaming
    technology to deliver real-time interactivity to their users.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'The demands of streaming media are closely tied with the level of interactivity.
    The lowest demands are from one-way broadcast audio, such as Internet radio. Usually
    the broadcast source has a good connection to the Internet, so the quality of
    your connection is greatly influenced by the quality of your network. Two-way
    broadcast audio requires that both parties have a decent connection. Video is
    far more demanding, and video conferencing is absolutely meaningless on anything
    less than a T1 connection.


    There are two methods generally used for optimizing conferencing-type applications
    (which can include multiplayer video games). With the first method, each client
    application connects to a central server. The central server processes the data
    and sends them to each client. In the case of an audio conference, the server
    needs to handle the case where multiple people are speaking at the same. This
    is a very difficult task, and slows down the conferencing to point of unusability.
    Nonetheless, for less-demanding applications such as videogames, From a firealling
    standpoint, this method is easier to implement. It means you only have to open
    up a hole to a particular''s IP address.


    The second method is used by newer conferencing packages and by high-performance
    networked games. A central server is used as a matching service, identifying the
    IP addresses of all the participants. Each client application establishes connections
    with each of the other clients in the conference. The burden of processing the
    incoming data is on the client''s end. If a particular client can''t keep up,
    only that client will suffer. From a firealling standpoint, this method is a total
    nightmare—any computer on the Internet needs to be able to connect to one or more
    ports on your firewall.


    # Problems Associated with Streaming Media


    Streaming media applications are very complex. Companies compete based on the
    quality of their application''s performance, which is determined by their compression
    algorithms and networking tricks. The only way to keep this information out of
    competitors'' hands is to keep their software closed source. This means that the
    applications may have numerous security vulnerabilities. On the Windows platform,
    a secure hole can quickly lead to a compromised paysise.


    The plethora of streaming media products available also creates an opportunity
    for trojan programs. A user might go to a Web site that offers exciting streaming
    media, but requires a special plug-in. Users often download this plug-in and install
    it without any thought as to whether the plug-in is doing what it claims. Because
    of the high bandwidth requirements, a user wouldn''t notice if the site is downloading
    the contents of their hard drive in the background.'
  merge: -1
