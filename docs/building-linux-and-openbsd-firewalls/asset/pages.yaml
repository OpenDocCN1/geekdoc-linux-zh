  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    If you don''t have physical control of your own machines, if they''re at a location
    facility, you will want to shut the machines down gracefully, immediately, and
    without warning. Your plan should have the relevant commands spelled out, in sequence.


    # More Notification


    Now that you''ve managed to halt any further damage, you need to let people know
    what''s happened. This is another time when a clear, prearranged intrusion response
    plan will help you immensely. It''s much quicker to tell management that "An intrusion
    was detected at 3:05 A.M. today, and the intrusion plan of March 1999 was implemented"
    than try to list everything that you have disconnected.


    Small companies will probably be able to get away with the grapevine, or a quick
    phone call to anyone relevant to let them know that things are down.


    Medium companies, and anyone with external clients who rely on network access,
    will need to decide in advance on a method of notifying clients that the network
    is down. Don''t assume you will be able to do this by email!—notices stuck inside
    the lifts, or on the doors, can be surprisingly effective in spreading this kind
    of news. The notices written out in advance.


    Larger companies need to have a pre-thought bulletin to send telling them what
    has been shut down, why it''s been done, that you''re doing everything to restore
    service, and that you''ll fill them in in the details later. This should form
    part of a comprehensive disaster-recovery plan. You might also wish to tell them
    what they should do in the absence of computing facilities—leaving you alone is
    a good idea. You will also need to have decided on a medium for sending the bulletin—again,
    don''t assume that you will be able to use email! If you have a voice-mail system,
    it may allow you to send broadcast messages. Make sure that the technique for
    doing this will be available to the incident response team—few incident response
    teams in large organisations include the voice-telecom administrator.


    # After an Incident


    You will have two competing priorities in the aftermath of an incident: working
    out what went wrong, and fixing the systems. If you spend all your time on the
    first, it could be days before you are able to do business again, if not longer.
    If you spend all your time on the second, the act of fixing things will erase
    all the data about the incident itself.'
