  md: '# # Who Should Read This Book


    The answer is anyone who''s got one or more computer connected to a larger public
    network such as the Internet. Even if you just have one computer at home, you
    might want to build a firewall to protect yourself against attacks from the outside
    while you''re logged in. This is especially true if your computer is Windows or
    Macintosh based. Nothing is more frustrating than losing an hour''s worth of work
    because some teenager ran WinNuke (a program that crashes Windows machines) on
    a bunch of random IP addresses, one of which happened to be yours.


    Home networks and small companies on a budget will benefit from this book the
    most. You might get commercial grade firewall protection from a very small investment
    in hardware. The process of learning about security will also be of great benefit
    to you as the network administrator for this small or medium network.


    We don''t expect too many large companies to be reading this book—they''re more
    likely to go straight for a commercial firewalling solution thanks to traditional
    FUD (fear, uncertainty, and doubt) techniques used to make managers wary of open
    source solutions. It''s a shame, the firewall you''ll build in this book is every
