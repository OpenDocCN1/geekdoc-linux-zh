    ```

    ipchains -A input -i ppp0 -s 209.10.20.32/27 -j DENY

    ```


    # OpenBSD


    ```

    block in log quick on ppp0 from 209.10.20.32/27 to any

    ```


    # Blocking Packets With IP Options (Source Routed)


    IP packets can contain one or more options. These are additional parameters in
    the IP header used by some applications for greater control over the way in which
    packets are delivered across a network. There are a few options in general that
    are known to cause serious problems. These are "lsrr" and "ssrr," which stand
    for loose source routing and strict source routing, respectively. These are bad
    and should be killed on sight. Ka-click!


    # Linux


    Linux doesn''t do this in the firewalling rules. To remind yourself how to instruct
    the kernel not to relay source routed packets, re-read the Source Routing section
    in Chapter 7.


    # OpenBSD


    To block all packets with IP options, try the following:


    ```

    block in log quick all with ipopt

    ```'
