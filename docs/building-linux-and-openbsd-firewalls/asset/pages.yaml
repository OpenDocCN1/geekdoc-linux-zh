- img_proc: true
  md: '# Configuring the Firewall under Linux


    Regarding TCP, any machine on your internal network will be able to establish
    TCP connections to the outside world, private addresses you use inside (picked
    from the range 192.168.1.1–192.168.1.254) will be masqueraded the real IP address
    your firewall uses, and replies will be allowed back in and demasaded. Inbound,
    only mail and ssh connections to your firewall will be permitted, and TCP connections
    from your ISP''s DNS servers.


    With regard to UDP, only DNS packets from your ISP''s DNS servers, and NTP from
    your ISP''s NTP server will be permitted. Any UDP-based service be inaccessible
    to your firewall and to machines on your internal network.


    # Starting the Firewall


    The firewall code needs to be embedded in the system startup scripts so that the
    firewall happens automatically each time the network is rebooted. The later in
    the boot process this happens, the longer the network interfaces are up without
    firewall protection. If there''s enough time, a hacker may be able to compromise
    the firewall by crashing the machine and then attacking the network before the
    firewall rules take effect.


    We suggest starting the firewall just before the network interfaces are initialized.
    To do this, look in the directory /etc/rc.d/rc3.d. This contains a list of files
    which are executed when the system shuts down (they start with K and a two-digit
    number) or starts (they start with S and a two-digit number). They are executed
    in the order that they appear in a directory listing. S10network is the file responsible
    for initializing the network interfaces. If you put the firewall startup script
    in this directory, and call S09firewall, it will run at startup time just before
    the network interfaces are brought up. You can put the script just as it appears,
    or you can use a wrapper (a script in turn calls the firewall start after doing
    a few checks) and be somewhat better behaved. A wrapper can be found on the companion
    Web Site (www.wiley.com/books/sonnenreich). See Chapter 12 for more details.


    Remember our earlier section on forwarding and the discussion on how to start
    forwarding in the kernel? If you choose to start the firewall before the network
    interfaces, the method of starting forwarding by manually writing a “1” to /proc/sys/net/ipv4/ip_forward
    won''t work. If you look more closely at the contents of S10network, you will
    see this is the startup script that actually starts forwarding, or the /etc/sysconfig/file
    tells it to do so. If you write a “1” to /proc/sys/net/ipv4/forward at the end
    of S09firewall, but don''t change the value of FORWARD_IPV4 in /etc/sysconfig/network,
    packet forwarding will be turned off by network about half a second after S09firewall
    turns on. This is why we prefer the /etc/sysconfig/network method of activating
    forwarding.


    ![](img/2fea8bfa30d45d039dcc057b944028fc_226_0.png)'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Input, Output, Forward


    Almost all of the rules in our example firewall are on the input chain, and we
    make almost no use of the forward or output chains. You may be wondering about
    this.


    On the whole, we feel it is safer to use the input chain for control. Any rule
    in the input chain implicitly protects the firewall as well as all the machines
    behind the firewall. Since the firewall''s main line of defense against the Internet,
    protecting it is a good thing.


    # Source Routing


    You may recall that we discussed why source routing is bad in Chapter 2, "Fundamental
    Internet Security Issues." To prevent source routed packets being relayed by your
    firewall, issue the commands:


    ```

    echo 0 > /proc/sys/net/ipv4/conf/all/accept_source_route

    ```


    and


    ```

    echo 0 > /proc/sys/net/ipv4/conf/default/accept_source_route

    ```


    The first line sets a general policy, the second sets a default which will be
    explicitly applied to interfaces defined after this line is executed. Putting
    both lines inside your firewall startup script would be an excellent plan.


    # No Compiler?


    This section''s more of an advisory note than a rule. Some people feel that it''s
    a good idea to take cracker-friendly tools off the firewall; others feel that
    a really cracker will get by with what he''s got. Should you wish to remove the
    most useful tools, taking the C compiler off the firewall would be a good place
    to start. You can remove it with:


    ```

    rpm -ev egcs-c++1.1.2-12

    ```


    and


    ```

    rpm -ev egcs-1.1.2-12

    ```


    If you find you need to put them back later, you can find the packages on the
    Red Hat CD in the same location as all the other packages.'
  merge: -1
