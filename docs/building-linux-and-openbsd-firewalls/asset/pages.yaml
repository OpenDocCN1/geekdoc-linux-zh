  md: '# Procedures


    One of the most critical procedures is that of detecting and neutralizing security
    breaches. Refer to Chapter 11 for more information.


    **Maintenance.** Another important procedure involves checking to make sure that
    all software is up to date, and upgrading any software with the latest security
    patches if necessary. There should be a list of all software in use. Each entry
    should point to a Web page or other resource for security patches.


    **New Technologies.** New technologies appear on the Internet faster than potholes
    on I-95 between New Haven and New York (for UK readers: this is nearly as fast
    as traffic jams on the M25). These technologies need to be evaluated in terms
    of their potential utility to the organization and the risks inherent within the
    protocols and implementing applications. There should be a process for identifying
    a new technology, evaluating the technology, and making recommendations. Often
    users will identify the new technology, so the procedure should include a method
    for users to submit new technology requests. It also should set expectations for
    response time frames.


    **Policy Changes.** The United States Constitution was very well thought out,
    and it did not survive long before changes were needed. Likewise, regardless of
    how well you plan your security policy, you will still need to make changes every
    once in a while. As it stands, every time a user has a problem with the policy,
    they''ll come whining to you. What you need is a clearly defined procedure for
    requesting changes to the policy—one that allows you to discard the majority of
    requests with impunity. This will save you countless hours and headaches. You
    need to have a process for suggesting changes, evaluating the suggestions, and
    distributing amendments to the policy such that all employees are aware of the
    relevant changes.


    # Hardware Solution to Manage the Flow of Requests


    Encase a paper shredder in a large metal box. Place a slit for request forms on
    the box such that the forms are immediately shredded upon insertion. The box should
    be completely sealed and unopenable by users with a padlocked door so that the
    shredder bag can be removed. On the front should be a sign that says, "This box
    contains a scanner which electronically processes the form and adds the request
    to the system administrator’s queue. Response time could be long due to large
    demand. Original paper forms are compressed for efficient storage."'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Compliance


    There are two aspects to compliance:


    +   1. Your users must abide by the security policy at all times, otherwise its
    value is greatly diminished.

    2. The security policy itself should be compliant with general company compliance
    policies, unless the administration has specifically requested otherwise.


    Enforcing security policy is hard. Unless your users are tied down with levels
    of security so tight they can''t hit a key without an Engineering Change Order,
    they can probably subvert at least some of it if they choose to. Making your policy
    simple, short, and easily explicable helps a lot getting your users to buy in
    both the technical and the administrative sides of your policy. Getting them to
    sign a copy can help convince them that You Really Mean It.


    # Risk Tolerance


    A startup company can take much greater risks than a Fortune 500 company. The
    close-knit nature of small companies means that nobody is expecting everything
    to go by the books. But once there is a larger number of employees, interpersonal
    problems and lack of discretion can create internal havoc. The Internet only makes
    the situation worse. Here we outline some of the internal and external risks presented
    by the Internet.


    # Internal Risks


    Email. This is easily the greatest source of risk posed by the Internet. It should
    be made clear to everyone in the company that sending an email is equivalent to
    posting your message on the big TV in Times Square. Anyone might see it, and it
    could stay around for a long time. Email messages have a habit of arriving at
    the wrong person''s inbox with alarming regularity. Things people wrote two years
    ago come back to haunt them—just ask Bill about his feelings on email.


    The Web. The second largest risk is the Web. An inappropriate Web site, and someone
    else could take offense. An employee might post company information onto the internet
    anonymously. Your company might even suffer due to someone maliciously posting
    inaccurate information about your company on a popular Web site. There have already
    been several major incidents involving inaccurate information on a Yahoo! chat
    forum causing excessive problems for a company.'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'Other Internet Services. There are plenty of other risks that come with having
    networked computers in your office. For example, a disgruntled employee could
    write programs to intercept network traffic and gain access to forbidden Resources.


    # External Risks


    Put Internet and Risk in the same sentence and you''ll almost invariably find
    Hacker in the next sentence. Connecting a computer to the outside world means
    that it''s only a matter of time until uninvited guests show up for dinner.


    If you provide Web access to your employees, the tightest firewall in the world
    won''t protect your internal network. By now, almost everything you can do on
    a computer can be done by going to a web site and possibly downloading a plug-in.
    This means you might think you''re preventing employees from IRC access by just
    allowing Web access, but a smart employee could easily gain access through a Web
    site with an IRC plug-in or a Java applet. malicious Web sites do. It''s not very
    difficult for someone to be duped into going to such a site.


    # Business Needs


    When creating your security policy, the most important factor should be the needs
    of your business. To help figure out your needs, work with management to answer
    the following questions and you''ll have a good overview of your company''s networking
    requirements.


    Internal Access. What services do your users inside the network need to get at?


    Remote Access. What services do remote users need? Do they need access to data
    inside the network?


    Public Access. What services do you need to provide to the public?


    Electronic Commerce/Data Interchange. Do you need to exchange information securely
    with other companies?


    Availability. Can your network go down? How long?


    # Scripts


    This section contains a bunch of useful scripts that we have also placed on the
    companion Web site at www.wiley.com/compbooks/sonnenreich. These scripts are designed
    to help you configure your system.'
  merge: -1
