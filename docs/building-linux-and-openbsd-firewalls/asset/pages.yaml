  md: '# interface


    Each rule must specify the interface to which it applies. That''s all there is
    to this parameter.


    # ip+mask


    This is an IP address followed by a netmask. The netmask can be specified using
    the ''/''notation (with the mask given as a hex value, dotted quad, or as the
    number of masked bits), or with the ''netmask'' keyword followed by a hex or dotted-quad
    netmask.


    The first ip+mask value (int_ip+mask) is the internal network. The ip+mask value
    after the ''-'' (ext_ip+mask) is the external network. inmap will make connections
    from the internal network to IP addresses on the external network.


    # portmapping


    A problem arises if there are more internal network addresses than external addresses--the
    extra internal addresses will conflict with existing external addresses that have
    already been allocated to other machines. Why is this a problem? If multiple machines
    are using the same IP address and are waiting for connections on the same ports,
    the NAT system will not be able to determine which packets go to which machine.


    To illustrate the problem, let''s look at a common situation: You have one IP
    address that you''d like to share among many machines within your network. Two
    machines on your network are using Netscape at the same time. Because Netscape
    uses a very simple algorithm to select a local port for the return connection,
    there''s a high chance that both will be waiting for connections on the same port
    number. When the packets come back from the external Web servers, they are all
    addressed to the IP number and the same port number. There''s no way for the NAT
    system to figure out which internal machine made which request without additional
    information.


    One solution to this problem is to use the portmapping technique. When an internal
    machine makes a request to an external service, it waits for a return connection
    on a specific port. This information is stored within the packet. The portmapper
    chooses a new port number that is unique and unused on the firewall''s external
    interface. It rewrites the packet so that return connections will arrive at the
    new port number. The portmapper stores the original port, the internal machine
    address, and the new port number in a table. When the return connection arrives,
    it looks up the port in its table and can easily determine the internal machine
    for which the packet is destined.


    Why does this work? There are over 60,000 available TCP and UDP ports for a given
    IP address. By using a portmapper, a single IP address could support over 600
    machines making 100 simultaneous connections. Even at peak usage'
