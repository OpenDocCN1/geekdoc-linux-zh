    \ (this translates to 209.21.10.31—if the slashes are\nconfusing you, see the\
    \ sidebar titled Masking). You have public access servers\nthat need to have real\
    \ IP addresses, but you want to be able to apply filtering\nrules to packets before\
    \ they get to the public servers. The problem is, your fire-\nall and/or router\
    \ is in the 209.21.10.0/27 subnet. You need to break\nt subnet down further in\
    \ order to create a separate subnet for the DMZ. The\n way to do this is by subnet\
    \ follows: 209.21.10.0/28 (0–15) and\n209.21.10.16/28 (16–31).\n\nThere are two\
    \ problems with this approach. The first is that each time you sub-\nett, you\
    \ effectively lose two addresses. In the preceding example, 209.21.10.15\nbecomes\
    \ the broadcast address for the 209.21.10.0/28 subnet, and 209.21.10.16\ncomes\
    \ the network address for the 209.21.10.16/28 subnet. These addresses\nare longer\
    \ assignable to external machines.\n\nThe other problem is that you really need\
    \ two addresses in one of the sub-\nets: for your firewall and for your external\
    \ router. That means you\nhave 12 extra IP addresses that will probably be wasted,\
    \ in addition to the four\nunassignable network and broadcast addresses that resulted\
    \ from subnetting.\nOne solution to this is to further subnet one of the two subnets.\
    \ Break the\n209.21.10.0/28 subnet into 209.21.10.0/29 and Now you cannassign\
    \ the router and firewall to one of the six addresses in the first subnet. You\n\
    c also set up the DMZ interface to receive packets for both\n209.21.10.16/28 subnet\
    \ AND the 209.21.10.8/27 subnet. This means you\nhave 20 usable addresses in your\
    \ DMZ, and you've lost six to subnetting.\nThere are now only four fully exposed\
    \ addresses. This is a bit more com-\nplicated, but potentially worth it if you're\
    \ on short address space.\n\nThere is a way to get around the different subnet\
    \ issue by bridging between\nthe two interfaces. Bridging involves having the\
    \ firewall take active role in\ndetecting packets on one network and forwarding\
    \ them to another network.\nThis can create all sorts of problems, and makes understanding\
    \ what's hap-\npening on the network a lot more difficult. This technique is way\
    \ beyond\ns scope of the book, and flat out not needed.\n\nThese are the simplest\
    \ networks, but think of them as building\nblocks. It's possible to use a combination\
    \ of dual-homed hosts and multi-\nged firewalls to make much more complex networks.\
    \ There's also the issue\nof proxy servers—where they fit into the picture? The\
    \ answer requires too\nmuch for this topic. The Chapman and Zwicky book Building\
    \ Internet\nFirewalls (O'Reilly 1995) deals with these topics in much greater\
    \ depth. Path\nthat, you'll want to look at various achieved firewall lists (Chapter\n\
    12 will tell you where to find them). There's bound to be plenty of chat\noptimal\
    \ configurations for proxy servers, as well as tons of other useful in-\nm about\
    \ firewalling in general."
