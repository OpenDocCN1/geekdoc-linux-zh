- img_proc: true
  md: '# How Secure Should Your Network? 77


    open source, has been around for a few years, and is reasonably common to have
    had most of its blatant holes found. Anything that''s brand-new, or closed source,
    or unheard of will cause problems sooner or later. Sendmail is a perfect example
    of a good open source mail server. It used to be very insecure. Through extensive
    use and debugging by the Internet community, all of the known holes were closed
    up. Now it is very rare that a security hole is in sendmail.


    # How to Make SMTP Secure


    If you decide to run your own mail server, you would be well advised to ensure
    that it doesn''t relay what it shouldn''t. In other words, you need to prevent
    your SMTP server from acting as a spam server. The easiest way to do this is to
    ensure that your SMTP server only outbound mail to originate from your network.
    This will foil most spammers, unless they can trick your SMTP server into believing
    that they are within your network.


    Some prevention technical assistance for a variety of mail transport agents can
    be found at Glennishman''s site, currently at www.glenn.org/spam/sendmail.antispam.html.
    You don''t want to be a spam relay. Trust us. Organizations like the Mail Abuse
    Prevention System (http://maps.vis.com/) and the Open-Relay Behavior Modification
    System (www.orbs.org/) will ensure that lot of other people refuse to accept mail
    from you. It can also cost you lot of money paying for the bandwidth required
    to relay mail. Make no, if someone finds you running an open relay on a good connection,
    it''s perfectly normal to find yourself sending on a quarter of a million pieces
    of somebody''s junk mail. That''s quite the denial-of-service attack.


    You should also take advantage of your MTA''s ability to limit the size of incoming
    messages.1Mb is enough for most low-bandwidth sites, and 10 Mb is enough for nearly
    anyone. There are better ways than mail to send 600 Mb files around, and not every
    600 Mb file someone tries to send is something you want.


    You could run your SMTP server within your DMZ or in your internal network. Putting
    it inside your firewall has pros and cons. An advantage is that you don''t have
    to spend time securing nonfunctional of the machine against attack, because your
    firewall protects it. The problem is that if the machine is compromised due to
    a security hole in the SMTP server, the Bad Guy has a direct connection inside
    your firewall. Whatever you do, dont run your SMTP server on the firewall itself.
    The section Your Firewall Provide Services?, later in the chapter, will explain
    why this is a bad idea.'
