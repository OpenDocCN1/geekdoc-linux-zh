  md: '# Transparent Web Cache


    A transparent Web cache is an elegant device for people who run networks with
    many users surfing the Web. There''s a pretty chance that many of them will want
    to go to the same Web site. If one were to satisfy their requests through a central
    local server, server would only need to go to the remote site first time any page
    was requested. Subsequent requests for the same page could be satisfied from the
    local server, saving access time and Internet bandwidth. A local server is called
    a Web cache.


    To establish a standard Web cache, every user''s browser needs to be configured
    to go to the central server for Web pages, instead of going out to the Internet.
    It can be very difficult to maintain in large organizations. If, however, the
    firewall through which they had to pass in order to get to the Internet that all
    Web requests should be sent to a local Web cache (except requests from that Web
    cache, which of course must be allowed onto the Internet), you could get the benefit
    of Web caching without having to reconfigure every desktop browser. This is transparent
    caching, and if youveve enough users all going through the one, it can cut Internet
    traffic by 50 percent or more.


    To effect a transparent Web cache with the ipnat and rdr, use the following rules
    (assuming eth0 is the internal network interface, 10.10.10.1 is the address of
