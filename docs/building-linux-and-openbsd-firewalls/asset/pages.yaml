    # TCP Wrappers


    TCP wrappers are an excellent package, originally written by Wietse Venema, that
    contributes to network security on many well-configured machines throughout the
    world. It allows connections to network services to be screened with respect to
    the host requesting connection.


    Hang on a minute, we hear you cry; that sounds just like a firewall. Well, it
    is. TCP wrappers does many of the things a packet-filtering firewall does, but
    the configuration files are a lot simpler. Why, then, do we propose to make you
    large, heavy, and complex iptchains instead of short, friendly, TCP wrappers code?


    TCP can only control access to TCP services—no UDP or ICMP control—and then only
    to TCP services started through the inet daemon, inetd (if you want to know more
    about the inet daemon, we''ll be turning most of his functions off in Chapter
    7). No TCP service that ''s started at boot time through inetd, such as sendmail,
    or a Web server, can generally be protected by TCP wrappers.


    It is true that a few other services, such as the new and improved RPC portmapper,
    have been modified to check the TCP wrappers control files and honor them, but
    an awful lot of applications haven''t.


    TCP wrappers can, however, do things iptchains can''t so well. For example, you
    can use hostnames instead of IP addresses to narrow down who can connect to services,
    and can use wildcards in names. For example, you could bar any machine in the
    mit.edu domain by denying the *mit.edu. Clearly, this makes for pleasant, readable
    code. It also makes for a gaping security hole. If someone can compromise your
    DNS server, or any DNS server that''s trusted by your DNS server, they can disarm
    your TCP'
