    We can see that the state entry has a time to live of 240 hours (ttl 86400—the
    86400 is in seconds), which is an absurd long time, but it is the default for
    an established tcp connection. This ttl counter is decremented every second that
    the state entry is not used, and will finally result in the connection being purged
