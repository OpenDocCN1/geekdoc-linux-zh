  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Another option is to use the Mindbright variant of the Java VNC client. Upon a
    suggestion by one of the authors, Mindbright plugged their Mindterm ssh library
    into the Java VNC client (it involved changing less than 10 lines of code). The
