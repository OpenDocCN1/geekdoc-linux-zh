    connected to multiple networks, this table helps the router figure out which network
    is most likely to contain the destination machine. Entries in a routing table
    can be specific,e.g., a host is directly connected to a specific interface—or
    more general, based on network numbers and network masks. For example, an entry
    may map to all packets destined for the network 10.69.0.0 with mask 255.255.255.0
