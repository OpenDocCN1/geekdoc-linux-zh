    # The Gimp: IGMP


    We talked briefly about multicasting in a sidebar a few pages back. Multicasting
    is easy if all the machines on a LAN are connected to one hub. The moment a router
    is involved it gets a little more complicated. There’s no point for a router to
    forward multicast packets across its interfaces if nobody is listening on the
    other end. A system is needed so that routers can figure out anyone on a subnet
    is listening to a particular multicast. Enter the Internet Group Management Protocol
    (IGMP).


    IGMP is an IP level protocol, meaning that each message is encapsulated within
    an IP datagram. IGMP messages are very simple—they’re all 8 bytes long and there
    is no header. There are two types of messages: a query, which is sent by multicast
    routers, and a report, which is sent by hosts in response to a query. Because
    IGMP messages are sent out via IP, there’s no guarantee they make it to their
    destination. Messages are repeated at random intervals to increase the likelihood
    of the packet making it to all necessary machines.


    Multicast communications are sent to groups of listening programs. Groups are
    designated by Class D IP addresses. Each address within the Class D space is a
    group number. A program can join multiple groups on the same hardware interface,
    as well as the same group on multiple interfaces. Unlike the port concept, multiple
    programs can join the IGMP group on a given interface.


    A host joins a multicast group by sending an IGMP report to the router. This tells
    the router that it will start forwarding multicast packets for the host’s subnet.
    Routers will send out queries at regular intervals during a multicast. When a
    multicast router sends a query, at least one host on a subnet needs respond to
    the router to forward multicast packets to that subnet. It doesn’t matter if more
    hosts respond—in fact, many systems are designed not to respond if another host
    on the multicast network has already responded to the query. This helps cut down
    on bandwidth usage. If no responses are received after a while from a subnet,
    the router can stop forwarding multicast packets to that subnet.


