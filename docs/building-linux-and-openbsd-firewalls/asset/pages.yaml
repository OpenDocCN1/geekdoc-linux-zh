    Since we used ''block'' without sending any feedback message, the firewall is
    silently dropping those packets on the ground. Let''s try sending back a TCP reset
    packet to notify the telnet client that the service is unavailable. When the firewall
    detects a TCP connection, it will send a Reset packet, which immediately shuts
    down the connection. Change the last line in the ipf.rules file to read:


    ```

    block return-rst in proto tcp all

