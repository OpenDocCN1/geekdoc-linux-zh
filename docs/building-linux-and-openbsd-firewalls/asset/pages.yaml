    # A Brief vi Tutorial


    The first thing to note is that it''s pronounced "vee eye." Not "vie" not "vee,"
    and never, ever "six." Vi is, as we intimated earlier, possibly the most hostile
    editor invented. Byter TECO, which is in turn the most hostile editor invented.
    Why, then, do we suggest you use vi? Because it is canonical, it is the default
    editor on nearly every Unix system in the world. You can sit down at any box and
    use vi to edit a file. If the box is primitive enough to support full-screen editing,
    you can use your vi line editor to edit a file using subset of vi commands. And
    if you''re sitting down in a box that has no full-screen capability and no useful
    programs whatever, you can usually find vi''s hairy old grandfather, "ed," hanging
    around somewhere. Although ed''s ever more than vi, and speaks in a funny accent,
    you can usually figure out how to talk to him by talking vi commands in the same
    funny accent. Don''t try to this unless you have to, but if you''ve ever to, you''ll
    bless vi name.


    Speaking of name, you might be wondering about the name vi. It stands for visual,
    most likely referring to the fact that you can see what you''re editing. Believe
    it or not, the fact of vi creation was quite a revolutionary idea. For some reason
    this feature was overlooked by the designers of earlier programs such as ed, which
    only lets you work on one line at a time. Don''t for a second think that visual
    has any relationship to the Microsoft concept of visual, where pretty pictures
    and jumping paperclips help you drag and drop buttons and other graphical gadgets
    all over the screen. The most visual vi gets is a terse column of – marks the
    left side of the screen to indicate that you''ve reached the end of the file and
    the beginning of squiggleland.'
