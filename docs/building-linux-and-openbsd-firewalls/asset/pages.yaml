    Once you''ve finished configuring your interfaces, type "done" on the "Configure"
    interface prompt. You''ll be asked for the IP address of the default route. If
    your IP address is assigned dynamically, leave this and the next question blank.
    If you have a static IP address, you''ll need to use IP address of your router,
