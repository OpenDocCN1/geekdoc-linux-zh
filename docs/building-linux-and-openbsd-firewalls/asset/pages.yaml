  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    com, a terminal emulator package. It allows us to talk to devices such as modems,
    and have the results of the conversation appear on the screen in a recognizable
    manner.


    Unmount the CD-ROM by typing `cd /`, then `umount /mnt/cdrom` (that''s "unmount"
    and not "unmount") is necessary because the kernel won''t let you unmount a file
    system if it''s busy. The fact that your current directory is within the CD-ROM''s
    path constitutes a "busy" CD-ROM device. Even though you''re not technically accessing
    any files, unmounting the device would leave you with an invalid current directory.
    The kernel would like to avoid this unpleasant situation and so would we:


    # Removing Unwanted Packages


    We don''t want to turn this into a manual for RPM any more than we wanted to rewrite
    the installation manual. However, RPM lies at the heart of software management
    on a pure Red Hat system, so it''s worth discussing.


    To list the packages you''ve currently installed, type `rpm -qa`. To remove any
    one of these, type `rpm -e PACKAGENAME`, substituting the name of the package
    for PACKAGENAME. For example, to remove the C compiler, you''d type `rpm -e egcs-1.1.2-12`,
    but don''t do that. We''ll need it for a while, but we will remove it before the
    firewall goes into production.


    # Modem-Based Firewalls


    This section is particularly relevant if your connection to the Internet is through
    a serial connection. By serial connection, we mean something that attaches to
    a serial port, rather than a network port, or on your computer.


    It is true that leased lines (such as the ubiquitous T1) are serial in a sense,
    as well. However, they''re rather beyond the remit of this book. They usually
    require special equipment that ends up giving you a standard network (ethernet)
    connection to the leased line anyway.


    # Finding Your Modem


    The first thing to do is work out which serial port the modem is on. If you don''t
    find this challenging, please skip to the next section. It occurred to us that
    we''ve hardly ever been able to look at the back of a PC and know which serial
    port is which. While it''s true that some machines externally label the ports
    as "1" and "2," these labels don''t necessarily correspond with the designations.
    Since the black art of identification is rather badly documented elsewhere, we''ll
    dwell on it a little here.'
