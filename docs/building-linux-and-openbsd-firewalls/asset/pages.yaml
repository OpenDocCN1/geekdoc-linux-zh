    # # Building the Box


    This can be pretty traumatic if you let yourself think about it. The bravest of
    us have received a big box in the mail, unpacked a motherboard and 38 little anti-static
    bags, spread them all over the floor, and burst crying.


    Well, don''t think about it.


    Firstly, your vendor manuals are your new friends. You''re going to grow to love
    them. Read them and thoroughly digest them. The motherboard manual, in particular,
    will take you gently through the details of setting all the-board jumpers. These
    jumpers control things such as processor speed and board clock rates. Most motherboard
    manuals will have lookup tables that show you the settings for all relevant jumpers
    on a processor-by-processor basis. The trickiest part is connecting the tie and
    power wires to the case to the appropriate pins on the motherboard. Often a flashlight
    can help in reading the pin labels. Just take it slowly and gently, and think
    logically.


