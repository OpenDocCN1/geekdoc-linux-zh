    # Other Services


    There are some services that don''t fit into any of the above categories, but
    need to be mentioned as well.


    # NTP


    The Network Time Protocol (NTP) is one of life''s great boons, at least if you
    need to know what time it is. Using NTP, you can keep the clocks on your systems
    slaves to Real Time, often within millisecond accuracy. A discussion of NTP is
    outside the scope of this book, but more information can be found at weecis.udel.edu/~ntp/
    and on the newsgroup com.protocols.time.ntp.


    NTP uses TCP and UDP ports:123; you will have to allow some of this through your
    firewall if you wish to synchronize one or more of your machines to one or external
    NTP servers. Access to these services on any of your internal servers should be
    limited to packets coming from trusted NTP servers (such as those by your ISP)
    and going to those internal machines that synchronize externally. The nature of
    NTP is that you only need to synchronize one or two internal machines to external
    sources, then your other machines synchronize to one or two.


    Yes, you can synchronize everything directly to external servers, but it''s pretty
    risky to load NTP servers down like that. Especially public servers. Using your
    firewall to prevent any internal machines other than your NTP servers from synchronizing
    to external NTP servers is a good way of forcing most local machines to sync to
    your local servers.


    > NTP wants to talk to its servers every couple of minutes or so. It''s not a
    good protocol to run if you''re on a dialup line of any sort, because the line
    will be off the hook lot more than you would like. It''s okay on a line charged
    by bandwidth, because NTP packets are small.'
