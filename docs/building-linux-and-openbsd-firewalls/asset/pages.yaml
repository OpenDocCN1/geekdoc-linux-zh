  md: '# Optimizing the Kernel


    The FreeBSD distribution comes with a fairly generic kernel. This kernel has support
    for most hardware, but isn''t optimized for firewall usage. If your firewall has
    to process a large number of packets, the stock kernel may run out of memory.
    Therefore it''s necessary to rebuild the kernel with certain memory parameters
    added. While we''re at it, we''ll apply a few patches to the system. This may
    sound like the scarciest part of the entire installation, but in reality it''s
    no more difficult than anything else we''ve already done.


    The first step is to locate the source code for the kernel and make it directly
    accessible to the filesystem. The kernel source code can be found in the sys directory
    on the CD-ROM, Disk #1. If we didn''t need to patch anything, we could just compile
    it directly from the CD-ROM. But, since we need to change the source code, we''ll
    have to copy the entire source code off the CD-ROM and onto your hard drive. This
    will take a while, and isn''t necessarily the best option. At least, it''s one
    more thing you''ll have to remember to strip out of the system later.


    A better thing to do is to use a concept known as a ''union mount''. This is a
    cool technique—the CD-ROM is mounted as a writable file system. How does this
    work? It''s relatively simple: When you edit a file on the CD, it actually creates
    a temporary file on the hard drive with the changes. When the edited file is read,
    the union mount system transparently retrieves the changes from the CD—only the
    files that are changed are copied to the hard drive.


    > > **NOTE**

    >

    There is a downside to the union mount: Your changes are not permanent. When the
    device is unmounted, all of your changes are lost.


    To perform a union mount, type the following:


    ```

    mkdir /mnt/cdrom<CR>

    mkdir /usr/src<CR>

    mount -t union -o -b /mnt/cdrom /usr/src<CR>

    ```


    # Editing the Kernel Configuration File


    Configuring the kernel isn''t as easy as OpenBSD as it is on Linux, it doesn''t
    have a neat little graphical interface. Nonetheless, it''s a pretty straightforward
    process that''s entirely managed by a single configuration file. The OpenBSD distribution
    comes with numerous example configuration files, each'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'of which is tailored to a specific purpose. The one that best fits our purposes
    is the "GENERIC" configuration file. Assuming that youve performed a successful
    union mount, you''ll be able to view this configuration file by typing:


    ```

    more /usr/src/sys/arch/i386/conf/GENERIC

    ```


    Before we edit the file, let''s create a copy of it so that we don''t have to
    change the original:


    ```

    cd /usr/src/sys/arch/i386/conf

    cp GENERIC MYKERNEL

    ```


    Now let''s edit the MYKERNEL file with vi:


    ```

    vi MYKERNEL

    ```


    The goal is to add a few lines that will improve firewalling performance. These
    lines can be added to the end of the file. Hit ctrl-d until the cursor is at the
    end of the line. Hit "e" a few times to advance to the end of the line. Hit "a"
    to append text to the end of the file. Hit <CR> to start a new line and type:


    ```

    option NMBCLUSTERS=8192

    option NKEMCLUSTERS=8192

    option MAX_KMAP=120

    option MAX_KMAPENT=6000

    ```


    This is pure and adulterated black magic (okay, maybe a wee of adultery was thrown
    in). If you want to know what''s going on, you''ll need to read the OpenBSD FAQ,
    section 12, and the page for "options":


    You might notice a line that says "include ../conf/GENERIC" toward the beginning
    of the file. There is actually another GENERIC file that contains the options
    which apply to all platforms on OpenBSD compiles (the file we''ve been editing
    is Itel specific). To view the file, type:


    ```

    more /usr/src/sys/conf/GENERIC

    ```


    Note the two lines that say:


    ```

    option IPFILTER

    option IPFILTER_LOG

    ```


    These lines enable the IPFilter code in the kernel. If either of these lines starts
    with "#" (the comment symbol), you''ll need to edit the file and remove the "#".
    If the lines are not present, you''ll need to add them. If you''re using the OpenBSD
    2.5 CD, these lines should be present and uncommented.'
