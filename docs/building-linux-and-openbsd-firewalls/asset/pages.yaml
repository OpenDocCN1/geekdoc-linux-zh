  md: '# POP: The Post Office Protocol


    Back in the interesting old days, everyone who wanted to connect to the Internet
    used a Unix machine, or a VAX, or a similar multiuser system. This system was
    permanently connected to the Net and permanently up, so it could mail as and when
    mail felt like arriving. The mail was collected in some central location, and
    users then read it with mail clients that often operated on the mail files directly.


    This solution does not work well with modern desktop machines, and with PCs in
    particular. People tend to turn them off, move them around buildings—around continents,
    in the case of laptops—and still expect to collect mail. The Post Office Protocol—was
    designed to cope with your need to collect mail from a central mail repository
    without making you run a full-blown mail server on each desktop. POP-2, which
    is now of primarily historical interest, runs on TCP port 109, and POP-3, the
    more modern variant, runs on TCP 110.


    # Problems Associated with POP


    For a widely-used protocol, POP leaves a lot to be desired. Because email is supposed
    to be private, POP has an authentication step. In this step, the username and
    password are transmitted from the client to the POP server in plain text. This
    isn''t so bad on an internal network (as long as you don''t mind your employees
    reading your mail). But when you let passwords go outside your network in cleartext
    (unencrypted), things get hairy. If passwords are only going to your ISP''s POP
    server, and you have a direct connection to that server (not always the case),
    it''s probably not a terrible security risk. But if you''re using something like
    a cable modem to connect to the outside world, where your neighbors may see your
    traffic, it''s bad. And if you''re sending passwords across the Internet in cleartext,
    you''re asking for trouble.


    # How to Make POP Secure


    For secure access from your site to remove POP servers, a limited number of POP
    clients support APOP, which enables authentication without actually exchanging
    the password at all. You will need to ensure that both client and server support
    this, if you wish to use it. More details can be found in RFC 1939 at www.isi.iu/in-notes/rfc1939.txt.
    You should also read the sidebar on secure tunneling, because this technique can
    befully applied to POP.


    For secure access from remote clients to your POP servers, you should not let
    outsiders have access to any POP servers you are running inside your net-'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 74 BUILDING LINUX AND OPENBSD FIREWALLS


    work. If people want to read mail from offsite, you need a proper remote access
    solution. Letting POP in is a bad idea.


    # Secure Tunneling


    Suppose you had set up a secure connection between a trusted local machine, and
    a trusted remote machine, over the insecure untrusted Internet. Suppose the connection
    were authenticated, so that the remote machine knew that was talking to the real
    you, and you knew that you were talking to the right remote machine. If you were
    clever, you could use that connection to have a login session on the remote machine
    without any eavesdropping or changing your communications. You could open up another
    connection to exchange mail with the remote machine, without anyone seeing your
    POP. You could do more things. If you were really clever, you could write a protocol
    that allows a single secure connection to negotiate on a packet-by-packet basis
    what service each particular packet is intended for. One packet could be part
    of a login session, another part of a mail session. Fortunately, such protocols
    already exist. This technique of making connections to multiple services through
    the one pipe is called secure tunneling or secure port forwarding. You can find
    more about secure tunneling in the ssh section later in this chapter.


    # IMAP: The Internet Message Access Protocol


    POP-3 has several disadvantages as a mail collection protocol, so IMAP was created
    as a more sophisticated replacement. It runs on TCP port 143.


    However, as a network protocol, it has the same problems as POP; passwords are
    sent in cleartext. Like POP, it supports more secure authentication methods. If
    you connect to an IMAP server over your own network, your best option is to create
    a secure tunnel to the IMAP server. This way you don''t have to worry about the
    quality or nature of the encryption scheme. Additionally, it''s recommended that
    external passwords be different from those used internally, especially if you
    don''t have exclusive control over the IMAP server (for example, if the IMAP server
    is run by an ISP). If you''re running your own IMAP server, you cannot allow direct
    connections to your server from outside your network. If you need to provide remote
    access to the IMAP server, have your users create a secure tunnel to the IMAP
    server. To the server it will appear as if the connections are coming from within
    the network.


    ![](img/2fea8bfa30d45d039dcc057b944028fc_97_0.png)'
