    # Diald


    Chatting to your modem with minicom can be very enjoyable (we have no lives),
    but it''s not too good for day-to-day Internet access. The README.linux file gives
    some good suggestions for doing it all with a single command, but you may not
    want to type the command every time you want to bring up the network. In particular,
    you may not want to manually bring the link up time you want to go out to the
    Internet, and you may not want to have to bring it down each time you''re finished.


    If you don''t, you should take a look at diald. This is an extremely neat utility
    that pretends to be a route to the Internet all the time, but isn''t. When you
    try and send packets over this fake link, diald nips round the back of your, taps
    the modem on the shoulder, and brings up the link to the Internet for real. When
    you''ve finished doing stuff, and diald goes idle, diald nips round the back again
    and shuts the link down. If you live in a country that you don''t have to pay
    by the minute when your modem''s off the hook, but you have several providers
    you want to dial up, under different circumstances (say, your university for work
    and your ISP for fun), diald can also be very handy.


    You can find out about diald at http://diald.Unix.ch/. If you want to ask questions
    and/or find help, there''s a very active user''s mailing list that you can learn
    more about at the Web site.


    # Ethernet-Based Firewalls


    Some people are lucky enough to have semiperman links to the Internet (cable modem,
    or leased-line) or they''re planning on hanging a network off somebody''else network.
    In any case, their prospective connection to the Internet appears to them as a
    piece of network cable instead of a modem''s serial cable. This section also makes
    useful reading for those people planning to have three-legged firewalls: one internal
