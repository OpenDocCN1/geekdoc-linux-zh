- img_proc: true
  md: '# CHAPTER 11


    # Intrusion Detection and Response


    You''re sitting in your office one day, reading mail and surfing the Web, perhaps
    drinking tea. All of a sudden, intruders are detected on the long-range packet
    sniffers! Red strobe lights fill the office, the wail of klaxons fills every corridor,
    and the only sound that penetrates the din is the repetitive voice of the monitoring
    system intoning “Red Alert! Red Alert!” Calmly, you step up to the console of
    the firewall and bring the weapons systems online at the same moment you silence
    the alarms. Now, the only sounds in the Network Operations Center are your gentle
    (yet firm) commands to crew members: “activate packet logging devices,” “fire
    traceroutes,” “bring the tape drives online.” Within minutes, the intruders are
    routed (no pun intended) and life in the NOC returns to normal.


    Science fiction or operational fact? Sadly, for most of us,it''s science fiction,
    and unsoothed poached science fiction at. The fact remains, however, that a good
    monitoring system to look for intrusions, and a good plan for dealing with disasters—preferably
    one you''ve practiced—will stand you in good stead in a crisis. Better leave the
    red T-shirt at home, though.


    We''re not going to elaborate these points, but in this chapter we''ll run through
    some good network monitoring systems. We''ll then try and talk about disaster
    recovery in a way which provokes ideas and makes you think about what you would
    want to be able to do in such an event, and what you''d need to have ready in
    order to do it. But first let''s get a feel for what we''re against.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Know Thine Enemies


    You''re not fighting Klingons or the Borg. That''s the good news. The bad news
    is that you''re probably up up against a bunch of pimpy teenagers that dress up
    as Klingons or the Borg on a regular basis. The majority of them fall into the
    script kiddie category. They''re the most likely ones to show up at your doorstep.
    A few of them are good enough to be public service hackers. Unless your name is
    Bill Gates, or you''ve been in Microsoft, you''ve got little to fear from these
    hackers. The pros are likely to be older and far scarier. Leave them a plate of
    cookies and they might decide to be nice to your network after they slide down
    the chimney. Let''s examine each group in a bit more detail.


    # Script Kiddies


    One word: Nuisance. Whether they''re a big nuisance or a small one depends on
    how well you''ve protected yourself against them. These wanna-hackers download
    pre-made hacking tools from the Internet. The vast majority of them have no idea
    how these tools work, but they have no problem unleashing them on random IP addresses.


    The goal of the script kiddie is to gain 15 seconds of fame in the script kiddie
    community by hacking a well-known machine. Often this is a Web server or any exposed
    server on a prestigious subnet (FBI, NASA, NSA, for example). They boast of their
    deed either by altering a Web page to say something totally insane or they set
    up a warez FTP server or an IRC server on the compromised machine. If they''re
    totally unsuccessful at breaking into your site, they''ll probably launch some
    sort of denial of service attack in frustration.


    Script kiddies are relatively easy to neutralize. If you built your network following
    the principles outlined in this book (minimizes the services that go in and out
    of the internal network, use a DMZ, for example) you''ll keep most of the recreational
    script kiddies at bay. The adjustments made to the firewall in Chapter 10, "Tuning
    Your Firewall," will repel the vast majority of the ambitious ones. Keeping up
    with your patches will repel the rest of them.


    Many of the tools used by script kiddies leave giant neon flags all over your
    network. A very simple intrusion detection system will spot most of these these
    attacks. The relative cluelessness of script kiddies also ensures that they''ll
    leave a very traceable trail. A few choically worded legal documents sent to their
    homes will keep them and their friends off your network for quite a while.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Public Service Hackers: Friend or Foe?


    They keep finding new holes in Microsoft products. They release “exploits” which
    script kiddies quickly snatch up add to their arsenal. They are “Public Service”
    hackers who feel they are doing the public great service. By making security holes
    public knowledge, they make it for professional hackers to get into a site (it''s
    lot easier to patch holes and watch for attempts to exploit them when they know
    they are). Furthermore, their hacks force companies to acknowledge security defects.
    The theory is that if a company gets embarrassed, they''ll build better quality
    control into their development cycle to avoid future embarrassments. The reality
    is that the company uses all the money it should have spent on quality control
    suing everyone that could possibly be indicted for the breach.


    Public service hackers won''t bother you


    Many people debate whether this sort of hacking is a good thing. Obviously, frequently
    targeted companies such as Microsoft are against it. They tend to claim that the
    vulnerability is completely theoretical (which makes it none less exploitable),
    ignore it in the hope that it will go away, or fire off lawsuits in seemingly
    random directions. A sort of etiquette exists for people who have discovered security
    holes and want to be polite about it: They should contact the maintainers of the
    code, who come up with a fix in a short while, then the holes and the fix are
    announced at the same time. Needless to say, this gets honored more in the breach
    than the observance: People finding holes call press conferences later the same
    day, vendors claim-up for weekends on end and refuse to comment on how the patches
    are coming along, and everyone''s generally acrimious.


    Should you be enterprising to discover a hole for yourself, we strongly recommend
    the polite way of going about it. It''s just better for every-one. Should you
    ever be approached by someone kind enough to be polite about the hole he or she
    has found in your code, we urge you to devote your every resource to fixing it—the
    better to honor their public spirit and make the world a safer place.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# The Pros


    The pros are the Kevin Mitnicks that haven''t gotten arrested yet. They''re knowledgeable
    as the public service hackers, but they don''t share their knowledge. Instead,
    they keep an arsenal of unknown exploits for private and often criminal use. These
    are real criminals—they get paid to commit serious felonies. They''re really good.
    You might detect that they''re in your system, but you''ll probably have no idea
    how much or little they''ve done. You can''t stop them, and there''s a little
    you can protect yourself from them. Don''t worry about them. Unless you''re doing
    something really secret and important, you have little to fear. If you are doing
    something secret and important, don''t keep any of the important information on
    a computer that''s connected to the network; otherwise you''re just asking for
    trouble.


    # Monitoring Systems


    Monitoring systems fall into two categories: network monitoring, and host monitoring.
    The former monitor the traffic on your network, and the latter monitor itself.
    Both are useful in the context of intrusion detection. Sadly for Linux users,
    few of these are available in RPM format; this means you''re going to have to
    become proficient with tar and make—the former, to unpack software distributions;
    the latter, to create the binaries. Unix has long been loved and reviled (often
    by the same people, for us) because all the really good software is distributed
    in source. That means that, in the end, you have to get good at building software.
    There''s no way we can even begin to touch how to build software instructions
    in this book, but many packages days come with excellent instructions, well-tuned
    Makefiles which automate the build, and a generally good attitude. Try it.


    A passing comment on monitoring systems: They''re not generally use if they can''t
    talk to you to know something''s up, or down. Be prepared to have an old modem
    sitting on a dedicated telephone line so that whatever monitoring systems you
    put in place can call your beeper and let you know the bad news. If you don''t
    have, or don''t want, a beeper, then modern cell phones simulate this facility.
    However whatever you decide to it, remember that these messages are short and
    sour, so you rarely need more than a 9600 baud modem dedicated to this service.
    It''s an excellent use of that old modem you''ve got sitting in a corner. Just
    make sure it doesn''t answer incoming calls.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Network Monitors


    These are tricky to build, but the best of breed is the Network Flight Recorder
    from NFR, Inc. it''s not free (in either sense of the word), but it is open source
    (in the sense that it comes with source, so you can read it). You can find out
    the details at www.nfr.com, but the short version is that NFR sits on your network
    and watches all the traffic it sees. It includes a sophisticated engine for deciding
    whether what it sees is something it should keep, or report, flag as interesting,
    or indeed cause the NFR to start singing, and this can be configured in a whole
    variety of interesting ways.


    Interestingly, using switches on your network makes NFR unhappy, since it wants
    to see everything. If you are using a switched network (good for you!), the NFR
    documentation addresses this issue with some joyful solutions.


    # Host Monitors


    Host monitors themselves come in two flavors. Those that monitor a host from the
    network, possibly to see if it''s exposing itself on the network, and those that
    monitor the host from inside to see if it is internally vulnerable, and whether
    anyone''s done anything nasty. Both types have their uses in a well-managed network.


    # Host Monitoring From the Network


    One way hackers look for holes is to run tools known as "port scanners" on your
    network. These tools attempt to connect to each IP address on your network using
    numerous protocols across the entire range of valid ports. The simplest ones search
    for Telnet ports, mal ports, etc. One of the most famous of these is SATAN, the
    System Administrator''s Tool for Analyzing Networks. It looks for classic vulnerabilities
    on a specified host or network. It shouldn''t find anything through a well-configured
    firewall, so it''s more useful for running on your local network to scan machines
    on the local network. This tool''s a few years old now, but since people keep
    making the same old silly mistakes, it will keep finding holes in your network
    if you don''t find them first. You can find information and the tool itself at
    www.fish.com/~zen/satan/satan.html. If you don''t like the name, there''s a patch
    included which returns all references to SATAN to SANTA.


    There is a SATAN detector, which looks for the network traces of someone launching
    a SATAN probe against your network. It''s called courtesy. With a rather fetching
    picture of a small child whom we assume to be Courtney, it can be found at http://ciac.lnnl.gov/ciac/ToolsNetMon.html.
    If'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'you have a DMZ it can be particularly worthwhile to run this on a machine in
    the DMZ.


    A more recent, and extremely powerful, scanner is a utility called nmap (www.inception.org/nmap/).
    Upon seeing this tool you might think it''s a script kiddies delete. You''d be
    right. But it should be even more delightful to. Running nmap on your own network
    will tell you everything the script kiddies will. You can then use this information
    to plug up the holes, until there''s nothing left for a script kiddie to use.


    Nmap scans for most known TCP/IP weaknesses in many different ways. Simply studying
    its list of features can be an awareness-heightening experience:


    Vanilla TCP connect() scanning (checks to see which TCP reports respond to a standard
    connect request)


    +   - TCP SYN (half open) scanning

    - TCP FIN, Xmas, or NULL (stealth) scanning

    - TCP ftp proxy (bounce attack) scanning

    - SYN/FIN scanning using IP fragments (bypasses packet filters)

    - UDP raw ICMP port unreachable scanning

    - ICMP scanning (ping-sweep)

    - TCP Ping scanning

    - Remote OS Identification by TCP/IP Fingerprinting

    - Reverse-ident scanning


    Possibly the coolest feature of nmap is the remote OS identification system. Nothing
    is more useful to a hacker than the exact make and model of your OS. They can
    then consult tables of known security problems and take their pick of the exploit
    du jour. It would be a good idea to try and obscure this information as much as
    possible. Other features of nmap are also described on the nmap Web site:


    Nmap also supports a number of performance and reliability features such as dynamic
    time calculations, packet timeout and retransmission, parallel port scanning,
    detection of down hosts via parallel pings. Nmap also offers flexible target and
    port specification, decoding scanning, determination of TCP sequence predictability
    characteristics, and output to machine parseable or human read-able logs.


    What can we offer besides port scanners? Often, the first sign of an intruder
    is the sudden unavailability of a server, or some other important service/machine.
    mon, the service monitoring daemon, can keep a very good eye on'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'your important systems, and let you know if they go away. Then you can start
    wondering why they went away. In the words of the mon authors, "mon is a general-purpose
    resource monitoring system, which can be used to monitor network service availability,
    server problems, environmental conditions such as the temperature in a room, or
    any number of things." If you’re interested in mon, you can find more about it
    at http://ftp.kernel.org/software/mon/


    The catchy-named AAFID, Autonomous Agents For Intrusion Detection, is a project
    of COAST (Computer Operations, Audit and Security Tools) at Purdue University.
    It''s an infrastructure of little agents that sit on individual machines, reporting
    on their state of wellbeing and unhackness, and a central monitor that talks to
    the agents edu/www.purdue.edu/coast/projects/autonomous-agents.html.


    # Logging


    All of the above tools are great for detecting various security holes and intrusions,
    but what do you do if they don''t spot the intruder while the intrusion is happening?
    Your primary concern in this situation is to assess the damage done and to build
    up the logs they crawled through. In order to do this you''ll need very logs of
    everything that happened on your network.


    One of the things a hacker will do is to shut down or disable any logging agents
    they can find. They will also try and manually edit the logs to remove any traces
    of their existence. An industrial strength prevention technique is to have a single
    system to which all machines send their syslog information (see the sidebar on
    Logging in Chapter 7, "Configuring the Firewall under Linux"). This has two advantages:
    1 The hacker now needs to compromise a second machine in order to hide their traces,
    and 2 it provides a single, central repository of data for incident evaluation.


    If you choose to build a centralized logger, you will need to spend some time
    hardening the security of the box. A machine should be dedicated to logging and
    run no other network services. Only trusted administrative staff should have an
    account on it. It should accept and process any and all syslog information that''s
    sent to it from your network, breaking down the logs in some systematic way. We
    have provided one syslog.conf file on the Web site.


    A busy network should not generate more than 300 Mb of logs a day, so a 10 Gb
    disc will allow you to hold a fair amount of logged information. For an even higher
    degree of security, you can devise a system where the logs are written to some
    write-once medium like WORM tape or CD-R in real time. Even if a hacker compromises
    the logging device, there''s no way they can erase the logs.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Host Monitoring From The Itself


    Tripwire is a gem of a package which allows you to automate monitoring for changes
    in file system. It works by obtaining a fingerprint from each critical file in
    your system. This fingerprint is unique, and will change if any aspect (even one
    little bit) of file has been altered.


    You''re wondering what this does for you? It provides a simple and quick way to
    see if someone''s changed an important file on your system. It''s true that keeping
    copies of every important file and comparing them routinely would accomplish the
    task, but, some of these files can get big, and comparing them can get pretty
    slow. If tripwire interests you, you can find the free version at ftp://coast.cs.purdue.edu/pub/COAST/Tripwire/.
    Tripwire is a good thing to run on a firewall, by the way.


    COPS, the Computer Oracle and Password System, is another good old classic. One
    would think that nobody would release an operating system that miserably fails
    the basic tests in an old system as COPS, but it happens with depressing regularity.
    Since the same old mistakes keep on perpetating, running this tool can in fact
    extremely useful. It''s the local analogue of SATAN, in that it looks for classic
    security holes on a local machine. Some of these classics include: bad system
    directory permissions, bad device file permissions, and bad anonymoussetup. COPS
    tries some basic password cracking (although there are better tools for this available).
    This shouldn''t raise any flags on your firewall system since Red Hat is careful,
    and OpenBSD is particularly careful, about the permissions on the default installation.
    Furthermore you haven''t set up any network services on your firewall, and you
    read our section on choosing passwords earlier in the book, so you should be okay—but
    run it anyway. While running COPS on regular internal hosts, you can find COPS
    at ftp://coast.cs.purdue.edu/pub/tools/cops/


    Just in case we haven''t beaten the point into the ground, let us try harder.
    Keep up with your hot patches, particularly on your firewall. There''s no excuse
    for having a known security hole on your firewall. It''s really embarrassing.
    See Chapter 12, "Loose Notes," for the locations of Red Hat and OpenBSD pages,
    and for subscription details of the several good mailing lists for monitoring
    the state-of-the-art in hacking


