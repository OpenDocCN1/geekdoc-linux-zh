  pgno: 349
- img_proc: true
  md: 'phone and croak “Make it so” to your colleague before collapsing back into
    bed and letting him deal with things.


    At large companies, systems like tripwire allow an automated determination of
    compromise to be made rapidly. A separate machine like a Network Flight Recorder
    or a centralized, secure logging machine will provide access to known-good data
    about recent network activity. You will find these invaluable in a disaster—at
    the time of writing, one of your authors had been called to a site when a client
    believed an intrusion had resulted in the deletion of a senior manager’s account
    and email. Good logging enabled us to quickly determine that an administrator
    had mistyped a username when deleting a group of old users, and that was no security
    incident in progress.


    # Disconnect or Shut Down


    Once you’ve established that an incident is in progress, you must start responding
    intelligently. Some people advocate leaving untouched while you monitor the intruder,
    in order to pursue him or her later. We feel this is rather pointless. In the
    first place, your intruder is quite likely coming from abroad. If you could track
    him down, you can’t touch him without ridiculously complex international crime-b
    warrant, which you won’t get. In the second place, you can see their IP address,
    but this is very likely some system elsewhere that they’ve already cracked. Only
    if you’re extremely lucky will you find helpful, alert administrators at remote
    sites to help you trace the intruder through layer upon layer of intermediary
    machines. Even then, tracing a phone involves a whole new level of legal pain.
    In the third place, you’re not in the cracker-tracking business. You are in some
    other line of business where your computers exist to help you yourself. Waiting
    until the intruder has erased everything he or she can find just so you can prove
    it is not the single best course of action for your business. If you feel there
    might be some discussion regarding this point, it would be better to have it with
    your colleagues and management now, while you’re not being blamed, rather than
    late, while you are.


    So, you’re going to shut down. Which helps a lot if you’ve thought about this
    in advance. If you have a single connection to the Internet, unplug it. If you
    have multiple connections in failover configuration, unplug what you need to do
    to bring the connection down. Although Big Red Switches that cause all the humming
    in the machine room to stop are in vogue, unplugging the right cables is often
    the fastest way of preventing any further damage. You need to have worked out
    in advance which cables are the right ones.'
