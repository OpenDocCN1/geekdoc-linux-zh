    # ARP/RARP Vulnerabilities


    The largest problem with ARP is that it is stateless, which means that the process
    that listens for replies is unaware of the process that sends requests. This means
    that if an ARP reply comes to your machine, there''s no way to tell if you ever
    sent an ARP request.


    Imagine a situation in which your machine receives a false ARP reply that maps
    the hardware address of another machine on the network to the IP address of the
    router. This updates the ARP cache on your machine with the incorrect mapping.
    This technique is known as cache poisoning. Suddenly, all packets destined for
    the router get sent to this other machine. If the other machine is compromised
    and is set up to analyze the packets and forward them to the real router, you
    may never know the difference.


    The router isn''t the only machine worth impersonating. A smart hacker might choose
    to impersonate a file server or a database server. With some knowledgeable, the
    hacker could intercept database files or queries. A more complex approach might
    involve two deceptions—the database user would think the hacker''s machine was
    the database. Likewise, the database would think the hacker''s machine was the
    user''s machine. If you think about it, you''ll realize there is a lot of power
    in this type of attack.


    The ARP cache does expire after a short period of time, but a simple piece of
    software can constantly send the ARP reply, ensuring that the cache entry stays
    valid. Some implementations of ARP also attempt to update their cache by sending
    ARP requests to each entry in the cache. This creates a major problem for the
    attacker, the machine with the real IP address will respond with its proper hardware
