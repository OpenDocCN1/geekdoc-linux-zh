    license’s main points:


    +   - This is a copyrighted material and own it.

    - This material is free.

    - You can use it however you want, selling it for a profit, as long as you include
    a credit to it, and do not claim you wrote it.

    - Whatever happens to you because of this material is your own responsibility,
    and I am not liable. There are no warranties, guarantees, or refunds.


    # The Great Divide


    There is a core ideological difference between the Berkeley license and the GNU
    Public License. The Berkeley license was designed to make software freely public.
    The GPL was designed to keep software freely available. Under the GPL, derivative
    works (software based on, or including any portion of, the original) must also
    be licensed under the GPL unless used internally. This ensures that someone doesn''t
    take an GPL work, improve it, and then distribute the result as proprietary software.
    The Berkeley license has no provisions.


    The best way to understand the concerns of the Free Software Foundation is through
    example. Joe Hacker releases some cool code under the Berkeley license. Jim Corporation
    takes too much advantage of free software without contributing anything to the
    community. Now Joe Hacker releases another cool software package under the GPL.
    Jim Corporation uses the code as part of their software. Jim Corporation is forced
    by the GPL to in-turn GPL their software and make the source code publicly available.
    Jim Corporation can still charge for the distribution of the software or for support.
    Now Jim Corporation has contributed to the free software community, Stallman is
    happy.


    While the above is a compelling argument for the GPL, it doesn''t really show
    the whole picture. The GPL raises the barrier to entry for non-free competition
