    # NOTE


    The point here is that the *ordering of the rules* is very important. If the rules
    are not in the right sequence, the firewall may not work properly.


    We''ve elaborated the point more than enough. Now let''s look at how rules are
    written.


    # Practical Rule Making


    In order to manipulate the kernel''s rule list


    # NOTE


    Do everything in this section while logged on at the console. If you mess with
    the networking functions of the machine while logged in over the network, you''re
    very likely to lock yourself out. Since you will be opening up your server to
    attack, you may also wish to disconnect any hostile networks while you try these
    examples. Turn off and unplug the modem, or yank any suspicious-looking ethernet
    cables.


    # Adding Rules


    The most common method for adding rules to the kernel''s ruleset is via a script
    file. This file is usually `/etc/ipf.rules`. The ip program will read in the script
    file whenever the machine boots. Additionally, the following command can be used
    to flush all of the rules and re-read the contents of the script file:


    ```

    ipf -Fa -vf /etc/ipf.rules -E

    ```


    The ''-F'' flag flushes all rules from the kernel, and the ''a'' says to flush
    the active ruleset. See the following sidebar, *Active versus Inactive Rules*.'
