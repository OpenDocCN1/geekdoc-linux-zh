    As with everything else in this book, open source client/server software is the
    preferred route. With any sort of complex multichachine communication tool, it''s
    critical to know as much as possible about whom you are communicating with. Nonetheless,
    it''s also important not to base security solely on trust relationships. The server
    you trusted yesterday may have been compromised today.


    # Providing Command Level Access


    Often, there''s no substitute for logging onto a remote machine and issuing commands.
    Anytime this happens over the Internet in a manner that requires a username and
    password to be sent, there''s a good chance of them being intercepted. If they''ve
    been sent in cleartext, there''s a very good chance you''ll have unexpected visitors
    soon thereafter.


    # Telnet


    Telnet, the classic remote access application, runs on TCP port 23. It runs completely
    in the open - no encryption, no authentication other than the username and password
    that are transmitted in clear. We think anyone who allows telnet access in this
    day and is foolish as someone who bungie jumps off of a 200-ft bridge with, but
    if your users need to telnet that''s fine. Let them know, clearly, that they''re
    going to get intercepted. Let them know, very clearly, that they should not use
    the same passwords for these remote systems that they use for internal systems.
    Let them know why. Do not allow incoming connections on port 23 to any machine
    inside your network; if people must have remote, interactive access, try ssh.


    # How to Make Telnet Secure


    There exist versions of telnet designed to work with Kerberos. If the remote system
    supports this, and you can get hold of kerberised telnet, that will adequately
    secure your entire telnet session. Otherwise, it is pretty much impossible to
    make telnet secure. More information about Kerberos can be found in Chapter 12.'
