    # Specifying ports


    The source or destination port of the packet can also be specified using the ''from/to''
    parameters. The format for this is:


    ```

    from src_ip_port <op> y to dest_ip_port <op> z

    ```


    You can either specify a single port number, or a range of ports with the appropriate
    operator (''op''). If you leave out the ''port'' keyword altogether, it is equivalent
    to saying ''all ports''. For a single port number, use ''='' as the operator.
    Note that there is a space before and after the operator. For example, to filter
    on a destination port of 80, you would write:


    ```

    pass out from any to any port = 80

    ```


    > ''from any to any'' is equivalent to the ''all'' keyword...almost. The difference
    is that you can specify a port number with the former. For example, ''pass out
    from any port 80'' specifically allows internal machines to access Web servers
