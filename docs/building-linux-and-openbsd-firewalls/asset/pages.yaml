  md: '# Which Interface Is Which?


    If you have more than one network card, it''s a bit tricky to figure out which
    is, especially if they''re all the same type (as they should).


    Technically, the interfaces follow the numbering of the PCI slots. So, if your
    slots increase as you go left to right along the motherboard, the leftmost network
    card should be 0, the next one to be 1, and so forth. Skipping a PCI slot won''t
    cause the network interface numbers to skip through. Network interfaces are assigned
    incrementally from the lowest PCI slot to the highest.


    On some motherboards, the slots are numbered from left to right. On others''s
    there are two ways to tell:


    +   - Open the case and look for the board. Somewhere the PCI slot should be a
    label like ''pci''. That''s the slot number.

    - Open your motherboard manual and look for a diagram of the motherboard. Often,
    the PCI slots are labeled in the diagram.

    - During the installation, it really doesn''t matter which interface gets assigned
    to which network. In the worst case, you can always reassign them later on. In
    a later sidebar we''ll explain how to positively identify each network card using
    the ''ping'' command.


    Once you''ve entered the internal address of the firewall, either it at the prompt
    and hit <CR>. Now pick a host name for this particular IP address. The default
    will be the hostname you entered few screens back. Just accept it and move on,
    unless there''s a specific reason why the hostname used for internal network needs
    to be something different.


    If you entered 10.0.0.1 as your IP address, you should enter in 255.255.255.0
    as your net mask. If you entered in something else because of an existing network-work
    structure, you''ll need to figure out the netmask for your particular network.
    For more information, see the Netmasking section in Chapter 2, "Fundamental Internet
    Security Issues."


    Now you''ll be a bunch of information about media directives. The choice you make
    here will depend on the nature of your network card. If your card is a 10/100
    card that can autodetect the network speed, type "media autoselect" at the prompt
    and hit <CR>. Otherwise, choose the setting that is appropriate for your card
    and hit <CR>.


    That''s it! You''ve finished configuring an interface. Now you''ll be looking
    at the interface selection screen again. If you have more than one interface,
    you should configure the other ones now. Note that the default answer to the "Configure
    which interface?" question is "done." You''ll want to manually enter the interface
    that needs to be configured. If you have a DMZ, configure that interface next.'
