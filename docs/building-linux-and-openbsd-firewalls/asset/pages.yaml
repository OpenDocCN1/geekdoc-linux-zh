    Due to the often laggy nature of the Internet, sometimes packets be regenerated.
    In such a situation, it''s entirely possible that two copies of the same packet
    will arrive at your firewall. If you''re keeping state, the system which sequence
    numbers will have already seen and processed the sequence number. It will therefore
    assume that the packet is part of a different connection and will not automatically
    allow the packet through. Instead, the packet will continue to be processed through
    your filter rules. Chances are, this packet will be blocked and logged as suspicious,
    since otherwise shouldn''t exist. Another non-malicious reason why packets get
    logged is when a stateful connection has been closed. You''ll often see the last
    packet of a session being closed logged because the ''keep state'' code has already
    torn down your firewall. Here is another example of a packet that you might see
    in your logs:


    ```

    12:46:12.470951 i10 @0:1 S 20.20.20.254 >> 255.255.255.255 PR icmpnlen 20 icmp
    9/0

    ```


    The ''icmp 9/0'' shows at the end of this line means ICMP type 9, code 0. This
    indicates that we''re looking at an ICMP router broadcast cast message. The point
    we''re trying to make is that you will see packets being logged every once in
    a while—this doesn''t mean that your system is under attack.


