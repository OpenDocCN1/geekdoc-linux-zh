    One more tip: if you have just to change a single character, you can place the
    cursor over the character and hit r, followed by the new character. If you want
    to overwrite a bunch of characters, hit R. This puts you into replace mode, which
    is also an input mode, but types over characters on the current line rather than
    inserting text. As all input modes, you can return to command mode by hitting
    ESC.


    # How Do I Move Around?


    We hope the arrow keys on your keyboard work; they''re very useful. In the event
    that they don''t, which may well be the case, or if you just want to look like
    a for not using the arrow keys, there are alternatives. The most useful are h,
    j, k, and l, which move left, down, and right, respectively. There''s also e,
    which advances to the end of the next word; w, which advances to the beginning
    of the next word; and b, which moves back to the beginning of the previous word.


    Other move-quick commands are \," which will take you back one sentence and ";"
    which will take you forward a sentence. Likewise, "" moves back a paragraph, while
    "" moves forward a paragraph.


    To get to the beginning of the line quickly, type "0" to get to the end of the
    line quickly, type "$"


    To search for a word, type "/" followed by the search term. This will search forward
    through the document. If you want to search backwards, type "?" instead of "/".


    The period (\.") repeats the last command. If you want to repeat the previous
    command, you can use n. The advantage of using n instead of . is that you can
    do a few other commands between searches. n will repeat the last search, even
    if it isn''t the most recent command.


    All these commands only work in command mode (sorry if that seems a little obvious).
    If you want to stop entering text at the current location and enter it somewhere
    else, you need to leave insert mode.


    # How Do I Delete?


    To delete the letter under your cursor, hit the x key. To delete all of the text
    from your cursor to the end of the line, use the capital D key. For deleting larger
    regions of text, see the next section on cutting. Again, all these commands work
    only in command mode.'
  merge: -1
