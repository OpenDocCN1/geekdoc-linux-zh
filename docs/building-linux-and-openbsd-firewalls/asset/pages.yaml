    # Fine-Tuning the System


    We''ve got a computer that can connect to the Internet, but it''s still not ready
    to be configured as a firewall. We need to patch up a few things (in order to
    get rid of known security holes) and optimize the system for use as a firewall.
    This is a process you''ll need to go through once in a while anyhow, so you might
    well learn it while you still have nothing to lose.


    # Mounting the CD-ROM


    Before we can patch anything, we''ll need to be able to access some files on the
    CD-ROM. Unfortunately, you can''t just stick a CD in the drive and immedi'
