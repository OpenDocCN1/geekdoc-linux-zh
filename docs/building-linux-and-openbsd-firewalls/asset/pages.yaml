  md: '# Tuning Your Firewall


    ing tables. The tables are usually set when programs such as pppd, dial,

    config, and the like are executed during the boot sequence. Even though

    don''t recommend modifying this thing, it''s good to know what one looks like\sand
    how it works. Take a look from time to time and it can be instructive.


    The command used to interrogate routing tables "netstat -rm". It produces

    output similar to the following sample output.


    # Linux


    Kernel IP routing table

    | Destination | Gateway | Genmask | Flags | MSS Window | irtt Iface |

    | 192.168.1.2 | 0.0.0.0 | 255.255.255.255 | | 0 | 0 | eth0 |

    | 192.168.1.0 | 0.0.0.0 | 255.255.255.0 | U | 0 | 0 | eth0 |

    | 127.0.0.1 | 0.0.0.0 | 255.0.0.0 | | | | lo |

    | 0.0.0.0 | 192.168.1.1 | 0.0.0.0 | UG | 0 | 0 | eth0 |


    # OpenBSD


    Internet:

    | Destination | Gateway | Flags | Refs | Use | Mtu | Interface |

    | 192.168.1.2 | 0a:ce:38:8fe:7 | | U | 0 | - | eth0 |

    | 192.168.1.0/24 | | | U | | 0 | - | eth0 |

    | 127/8 | 127.0.0.1 | | UH | | 0 | - | lo0 |

    | default | 192.168.1.1 | | UGS | | 0 | - | eth0 |


    This is an extremely basic routing table, the sort of you''d find on a

    machine within your internal network. This particular machine has an IP

    address of 192.168.1.2. There are a few minor differences between the Linux and

    OpenBSD versions of netstat. One easy to spot difference is how the network

    mask is displayed. With OpenBSD, it''s displayed using the ip/mask notation

    on the destination address. Under Linux it''s written as a dotted quad in a sep-

    column. The fields we''re most interested in are Destination, Gateway,

    Genmask, (incorporated into OpenBSD) and Iface/Interface.


    The first line has a destination of the machine''s internal IP address, with

    no gateway (0.0.0.0) under Linux and the Ethernet MAC address of the inter-

    face under OpenBSD. The netmask is 255.255.255.0. You''ll recall from the

    section on masking in Chapter 7 that such a mask refers to the singular,

    sspecified address. The route ends with the interface of eth0. This is the

    kernel''s way of reminding itself that it has to use its own ethernet to get

    to its own IP address. This entry in the routing table was created during the

    initialization of the ethernet card.


    The second line has a destination of the local subnet, with a genmask of

    255.255.255.0 (/24). This is a class C net, and comes from the mask that

    given to this interface in /etc/sysconfig/ifcfg-eth0.

    Again, the gateway is 0 (well, 0.0.0.0) under Linux, but under OpenBSD we see

    that the gateway is link#1. This tells OpenBSD to send all packets destined for'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'that subnet out of the first interface card. The purpose of the line is to
    tell the kernel that all hosts on the local broadcast network can be reached directly
    from the local network interface. This entry was also created during the initialization
    of the ethernet card.


    The third line is a bit weird. This is an entry for the destination 127.0.0.0
    with a class-A network (255.0.0.0 or /8)—that is, all addresses that start "127.".
    Hopefully, you will recall the IP Masquerading section in Chapter 3 that 127 is
    the loopback network, a way for a kernel to talk to itself via the networking
    code but without going on the network. This line tells the kernel that any address
    starting 127, should be talked to via the loopback interface "lo."


    The last line is the only real line here, and the only line where the gateway
    entry isn''t null. This has an entry for destination 0.0.0.0 (default under FreeBSD),
    with a netmask of 0.0.0.0. A little thought would reveal that this matches any
    IP address. What effect will this line have? Well, it sends all outbound packets
    to the gateway shown, 192.168.1.1, via the interface eth0. This is the line that
    enables this to send packets to the Internet—192.168.1.1 is the local IP masquerading
    router.


    Hang on, here you cry, if that last line tells the kernel to know what with any
    packet whatsoever, Come to that, what about the first two lines—packets addressed
    to myself will match both those lines, as well as the last one. Which line will
    take precedence? The answer is that routing tables are designed to look for the
    most specific match possible. Packets addressed to myself can match line 1, or
    line 2, or line 4. However, they only they can match line 1, so line 1 is applied
    to them in preference to line 2 or 4. Similarly, packets addressed to say, 192.168.1.24
    could match line 2 or line 4. However, they are a better match for line 2 than
    line 4 as only packets addressed to the local network match line 2. Here, line
    2 is applied to them. Strictly, when more than one match is possible for a packet,
    the match with the most precise mask (that is, the greatest number of 1s and smallest
    number of 0s in binary form) is the one which is applied.


    Hopefully, this is making sense. Routing tables aren''t magic, they''re lookup
    tables that tell the kernel how to get packets to different addresses. Most of
    the lines in a routing table are usually memos from the kernel to itself. Technically,
    the kernel can determine this information in other manners, but this makes dealing
    with special cases faster and more efficient. For example, packets from the machine
    to the machine itself can be processed through the routing tables like any other
    packet.'
