  md: '# NOTE


    There are more ways of denoting the <CR> key on a computer keyboard than there
    are packets on the Internet. Some call it “Enter,” some call it “Return,” some
    label it “arrow pointing down and to the left.” We’re calling it <CR>, short for
    “Carriage Return,” because we are traditionalists.


    So gather your courage and take the plunge—hit that <CR> key for all it’s worth.
    If you can’t muster the inner resolve to take such a leap of faith, the installer
    will do it for you after about 10 seconds. Either way, you’re going over the edge—by
    jumping you can at least relieve yourself into thinking that you had some choice
    in the matter:


    ```

    Booting fda0:/bsd#######

    ```


    ###### is a number followed by a twirling cursor.

    ###### is a number followed by a twirling cursor.


    If all goes well, you’ll see something like the above line. If you’re booting
    off a floppy or a slow CD-ROM drive, it will stay this way for a long time. Don’t
    freak out. Soon, another number will be appended to the line, and you’ll wait
    even longer longer. Stay calm.

    With little warning, stuff in blue will start scrolling up the screen (if it’s
    oozing out the side of the screen, run for your life). Reading this stuff carefully
    can tell you OpenBSD a lot about your system, but it won’t mean anything to you.
    So just wait until the screen shows the following:


    ```

    sh: /etc/rc: No such file or directory

    Enter pathname of shell or RETURN for:

    ```


    Pull all your money out of your bank account, pray for your hard drive, and keep
    your suppose out of the room. It’s time to hit <CR> again. If all goes well, you
    should now see:


    ```

    (I)install, (U)grade or (S)hell?

    ```


    Type “I” and hit <CR>.


    Next you’ll see a welcome screen with some information on how to restart the install
    process. Finally, it asks you if you’d to proceed with the installation. Type
    “y” and hit <CR>. Hitting just <CR> actually does the WRONG thing here—it quits
    the installer. Luckily, no harm is done. If you accidentally hit <CR> before typing
    “y,” you can restart the install by typing “install” at the shell prompt followed
    by <CR>.'
