  md: '# Some Thoughts on Passwords


    There are standard rules that you should always try and follow when choosing a
    password: no words from any language, no variants on any such words—don''t think
    that a couple of numbers into a word makes it secure.


    Hackers have wonderful tools that crack password files very easily. You can and
    download these tools and run them on your password files. If you have a sizable
    number of users, you will be shocked by the high percentage of passwords that
    can be cracked by these password cracking programs. If you crack a user''s password,
    they should be instructed to change their password immediately. This should not
    be done through e-mail if you could crack the password, somebody probably did
    too and remind the users a visit, or leave them a voicemail (although first check
    to see if their mailbox code is 12345).


    Our recommendation is to take a book off your bookshelf, pick a sentence at random,
    and use the initial letters of that sentence. Don''t pick a famous sentence. Don''t
    open the book at page one. Don''t use the book you''re currently reading (this
    book!), and don''t leave this book next to the one you choose, either. If you
    need to highlight or underline the sentence to give you an emergency reference
    if you forget the root password, that''s OK (well, it''s better than writing the
    root down on a piece of paper, anyway). Pick a good one and spend a little time
    fixing it in your memory.


    You''ll now see a list of CD-ROM drives available for use. If this list is empty,
    then you need to read the sidebar on "what to do if your CD drive isn''t being
    recognized." Assuming it worked properly, you should see one CD-ROM drive. Answer
    the question "Which is the CD-ROM" by typing in the name of the drive (which could
    be something like "acd0").


    When it asks for file system, select cd9660—which should be the default. The directory
    relative to the mount point that contains the file is /2.5/i386 (which should
    also be the default).


    Now comes the fun part: Selecting the various packages to install. This process
    is somewhat different from that of RedHat 6.0 and quite different from Microsoft
    installs. There are three separate systems for packages under OpenBSD. The first
    is called the disk set, which are the collections of core programs that make up
    the OpenBSD. The installer will let you choose among these sets (although some
    are required). The second system is the package system, and it consists of few
    tools that operate on a directory of precompiled software deemed stable by the
    OpenBSD crew. When needed, a simple command adds and removes packages from your
    system. Finally, there''s the ports tree, which is for programs that are under'
