  md: 'machine. However these services will be available to machines on your internal
    network. We don''t want to neglect host security, because a compromise can happen
    from the inside as well as the outside. Also, there may be moments when you take
    your firewall code down—it''s a good idea not to leave your underwear flapping
    in the breeze at such moments.


    The file that controls network services is /etc/inetd.conf. If you look at the
    file, you''ll see many lines that begin with # These lines are comments. Some
    of the comments are actually valid configuration instructions that have been commented
    out by default. These lines refer to services that are not necessary for standard
    operation. The commands are provided as comments to make it easier for system
    administrators to activate the service (they simply remove the #).


    Each line that is not a comment is an active service. This service will get started
    at boot time. The line contains information about the name of the service (column
    0) and what port the service runs on (column 1). You might notice that a number
    of the port numbers are actually words such as “ftp


    Once you''ve commented out those entries, you need to get inetd to reread the
    file. On both Linux and OpenBSD, this is done with the command:


    ```

    kill -1 `cat /var/run/inetd.pid (yes, those are backticks)

    ```


    Linux users can also check what services are still talking to the network with
    the command “netstat -apn”, which should be run as root for maximum effectiveness.
    The output from this can be a bit verbose, but here are a few representative lines:'
