  md: 'ately access it. You''ll first need to mount the CD drive onto the file system.
    This basically means you''ll be creating a directory and making the contents of
    the CD accessible from that directory.


    We like to make the CD accessible from /mnt/cdrom. Therefore, the first step is
    to make the directory. Type: “mkdir -p /mnt/cdrom” and hit <CR>.


    The next step is to figure out what system device represents your CD-ROM drive.
    The fastest way to do this is to type: “dmesg | more” and scroll through the file.
    You''re looking at the output your system created when it first booted. Somewhere
    in this file should be a line about your CD-ROM drive, often appearing shortly
    after the network cards are listed. Look for something like “ATAPI” or “volume
    levels” somewhere on the line.


    Once you''ve found the right line, look at the beginning. The first thing on the
    line is the CD-ROM device name. For us, it happens to be “acd0”. Tack an “a” to
    the end of that device name and you have the device name for your CD-ROM. So,
    our CD-ROM is “/dev/acd0a”.


    If you don''t see anything that could be a CD-ROM drive in the “dmesg” output,
    then you should re-read the note on CD-ROM troubleshooting in Chapter 5. Your
    CD-ROM may need to be connected differently (slave instead, and master instead).


    Now that we''ve found the CD-ROM, let''s verify that we''ve got the right drive.
