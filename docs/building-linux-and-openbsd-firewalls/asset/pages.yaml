    and pick up your zip file of exploits, give the IP address of the target, and
    click start. Nowadays, it''s no longer a question of whether, it''s a question
    of when. The good side of this is that, by large, keeping a tight ship against
    the most common exploits will keep you reasonably safe. If someone with sufficient
    skill gets sufficiently bad at you, they will get in, but such people are rare,
    and (we hope!) unlikely to have a grudge against you.


    Good internal security helps external security. If a bad guy walking into the
    building can''t grab passwords people''s screens or fool users into parting with
    them, his only way into your network as an authorized user is to fool the machines,
    and that means subverting the firewall. You have now simplified your problem.


    By now, you will naturally be thinking about putting a firewall between your network
    and the Internet to keep the bad guys getting inside your network. A firewall
    is a very, very good thing to have between you and the rest of the world, but
    it''s no panacea. What a firewall can do for you is distinguish between authorized
    users and the rest of the world. If done properly, it can go a long way keeping
    the rest of the world out of your network, except in the precisely defined way
    that you want them inside it. What it can''t do is solve everything in a single
    go. A firewall is no substitute for a good internal security policy, nor for good
    host-based security. However, it will be the single strongest element of your
    attempt to keep the bad guys out.


