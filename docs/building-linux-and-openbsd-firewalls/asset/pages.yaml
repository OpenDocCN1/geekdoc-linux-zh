  md: '# # CHAPTER 6


    # # Installing Linux


    ![](img/2fea8bfa30d45d039dcc057b944028fc_184_0.png)


    There are many good books on how to install Linux, which proves two things: It’s
    possible to write a whole book about installing and configuring Linux, and it’s
    been done already. We wanted to be a little more original. Our first thought was:
    *Installing Linux Whilst Bungie Jumping In The Nude*, but logistical problems
    prevented us from completing the necessary research. We settled for the mundane
    but slightly more relevant topic of building a firewall with Linux.


    For reasons described in the introduction, this is a book that specifically targets
    Red Hat Linux 6.0. You should therefore have access to the appropriate RedHat
    distribution (CD-ROM highly recommended). If you’ll find that the rather hasty
    nature of the box is due to the inclusion of their excellent book entitled “Installation
    Guide.” This guide is so well written you’ll forgive them for not including a
    section on what bungee jumping is.


    However, the Installation Guide doesn’t know you’re trying to set up a firewall.
    To general, it leaves open some questions that shouldn’t be left open for a firewall.
    It doesn’t require you to install certain things that we will, and (equally importantly)
    it doesn’t tell you not to install certain things that we’re going to forbid.


    This chapter will walk alongside the installation process. We’ll offer helpful
    suggestions when the choices get too wide. We’ll try to ensure that you don’t'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    leave anything that you''ll need. We''ll try even harder to ensure you don''t
    accept anything you shouldn''t. Once you''ve got a working system, we''ll go through
    stripping things you don''t need on a firewall. Finally, we''ll direct you to
    and help install and configure tools you''ll need that don''t come on the stock
    CD. By the end of this chapter, you should have gone from a pile of hardware,
    a CD, and a boot disc to a bootable system, stripped and ready for action.


    # The Red Hat Install


    The best way to learn about installing Linux is to install it. All of us do it,
    and we do it often. Every time we set up a new box, even though we''ve installed
    Linux maybe 50 or 100 times before, we usually end up doing it twice three times
    to get the best-tuned system.


    The Red Hat installation recommends that you read the entire guide before trying
    to install. There is some wisdom in this, particularly if you''ve never done a
    Red Hat install before. It would be wiser to read the rest of this chapter before
    actually performing the install as well.


    If you''re all worried about the basic install, we suggest that you go through
    one. Accept all the defaults. Let the install script make all the hard decisions.
    Watch and learn—it doesn''t take more than an hour to do an install. It can take
