    # # Dynamic Routing: RIP and OSPF


    People don''t pick IP addresses out of thin air. The Internet Assigned Numbers
    Authority allows them to ISPs and other large network providers. These network
    providers turn allocate blocks of addresses to smaller networks. As networks come
    and go and move about, these numbers get reassigned. The numbers are not tied
    to any geographic locality and can move around needed. Some networks dynamically
    assign IP addresses as needed. Because of these, routes to IP addresses or networks
    can change on a moment to moment basis. In these scenarios ICMP redirects or router
    discoveries aren''t enough.


    The Routing Information Protocol (RIP) is the most popular, though necessarily
    the best, solution to complex routing needs. It provides a mechanism for routers
    to inform each other of the networks to which they connect. RIP communications
    are sent as UDP packets, the standard RIP port is 520.


    RIP is a relatively simple service: upon initialization it requests packets out
    every available interface, effectively asking every directly connected router
