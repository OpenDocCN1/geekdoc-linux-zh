  md: '# Individual Services


    In this section, we''re going to go through and give examples of individual

    pieces of code to block and/or permit certain services.


    Being the perspicacious type you are, you will have noticed that not every pro-

    tocol listed in Chapter 3 is covered here. This is because not all of them need
    to

    be. We have recommended using a single line of code to permit most of your

    internal machines to safely have TCP conversations with the outside world.

    Few TCP or UDP services need to be permitted into most networks,

    sits very well with a general policy of denial. We need to prevent a few

    from escaping from your internal network into the unknown, and permit a few

    special cases in, but other than that, life can be pretty simple. Read on.


    # DNS


    At the very least, you want to be able to talk to your ISP''s DNS servers. Since

    y''ve used a blanket rule to accept all packets coming from the internal-

    works, you''re only worried about accepting the information coming back

    from your ISP.


    If, when you set your DNS on machines inside your network you told

    them your ISP''s nameservers by IP address, then you''re resolving directly

    from your ISP''s name servers. In the following example code, we''ve assumed

    ppp0 is the external interface, and that 1.2.3.4 and 1.2.3.5 are the IP

    addresses of your ISP''s nameservers. Modify these data accurately.


    # Linux


    ```

    ipchains -A input -i ppp0 -p udp -s 1.2.3.4 53 -j ACCEPT

    ipchains -A input -i ppp0 -p tcp -s 1.2.3.4 53 -j ACCEPT

    ipchains -A input -i ppp0 -p udp -s 1.2.3.5 53 -j ACCEPT

    ipchains -A input -i ppp0 -p tcp -s 1.2.3.5 53 -j ACCEPT

    ```


    # OpenBSD


    ```

    pass in ppp0 proto tcp/udp from 1.2.3.4 port = 53 to any

    pass in ppp0 proto tcp/udp from 1.2.3.5 port = 53 to any

    ```


    If you are running a caching nameserver inside your network, you can tie the

    rules down somewhat more tightly. Nameservers communicate with each

    other on port 53 at both ends of the connection. Actually, as as you should be
    get-

    ting to use by now, this''s strictly true of some most recent names servers;

    you may need to check your name server''s documentation. In particular, if

    y''re running BIND 8.2, you will need to make sure that the line


    query-source address * port 53;'
  merge: -1
