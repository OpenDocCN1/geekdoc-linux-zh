    Table 9.2 contains the possible operators.


    # Table 9.2 Operators


    | | |

    |---|---|

    | = eq | Equal to |

    | != = or ne | Not equal to |

    | < or lt | Less than |

    | <= or le | Less than or equal to |

    | > gt | Greater than |

    | >= or ge | Greater than or equal to |

    | x<> y | Less than x and greater than y–not inclusive |

    | x>>y | Greater than x and less than y–not inclusive |'
