  md: '# The Abridged History of Unix


    A concise description of the early days of Unix can be found on the Unix Workstation
    Support Group Website at Indiana University. (www.uwsg.indiana.edu /uasail/concepts/unixhx.html).
    Here''s an accuracy enhanced extract:


    The operating system found its beginnings in MULTICS, which stands for Multiplexed
    [Information] and Computing Service. The MULTICS project began in the mid 1960s
    as a joint effort by General Electric, Massachusetts Institute for Technology
    and Bell Laboratories. In 1969 Bell Laboratories pulled out of the project.


    One of Bell Laboratories people involved in the project was Ken Thompson. He liked
    the potential MULTICS had, but felt it was too complex and the same thing could
    be simpler in way. In 1969 he wrote the first version of Unix, called UNICS. UNICS
    stood for Unplexed [Information] and Computing System. Although the operating
    system has changed, the name stuck and was eventually shortened to Unix.


    Ken Thompson, Dennis Ritchie, and others at the labs were able to justify continuation
    of the Unix project as a documentation system. The functionality of the system
    evolved and by 1974 the system was significant enough to warrant its use outside
    of Bell Labs. Bell decided to license the system and its source code to a number
    of universities. Little did they realize that this decision would change computing
    forever.


    # The Berkeley Bunch


    One of the universities that embraced Unix was UC Berkeley. This was partially
    due to the fact that Ken Thompson spent a year''s sabbatical there in 1976. Several
    people at Berkeley began to develop Unix by adding features as true virtual memory
    and TCP / IP networking. Many programmers from AT&T- licensed institutions all
    over the world contributed to this project, and the result was known as the Berkeley
    Software Distribution (BSD). This was great, but it contained much of original
    Unix code, it could only be used under the terms of the Bell Labs license. During
    the 1980s, the people at Berkeley rewrote so of the Unix code that little of the
    original Bell Labs code was left in the BSD. A group of programmers decided to
    replace all of the Bell Labs code, creating a version of Unix that was free of
    the Bell Labs restrictions. A few of these programmers decided to capitalize on
    the work and formed a company called Berkeley Software Design, Inc. BSD/386 emerged
    from this effort in the early 1990s.


    At the same time, AT&T/Bell Labs had not given up on Unix. Development continued,
    ultimately producing a system now more commonly known as System V. When BSD/386
    was released, AT&T was not too happy about it. Their com-'
  merge: -1
