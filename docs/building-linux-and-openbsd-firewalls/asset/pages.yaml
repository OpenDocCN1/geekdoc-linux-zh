  md: '# How Secure Should Your Network?


    # NIS


    The ubiquitous Network Information System (NIS) allows information about user
    accounts and the like to be centrally administered. You should run NIS, denying
    access to the portmapper (see earlier discussion of NFS in File Transfer Options)
    is even more important. This won''t stop someone from guessing what UDP port server
    might be running on, but it does stop them from cribbing off the portmapper. Blocking
    inbound UDP except on certain ports that you choose to, rather than accepting
    all UDP packets save those you choose to deny, is the other main weapon in your
    fight to keep the cracker from having a chat with your NIS server.


    # Yet Other Services


    This book will turn into a telephone directory if we try to list all the protocols
    available on the Internet. However, we''ve covered the most common. When someone
    comes to you and asks “can you open up port xxx so I can access the squidplotz
    server at Notta University?”, you will have some idea what the question means.
    You can then make some kind of rational decision about the consequences. Services
    that require you to open up all UDP ports between 40000 and 55000 for inbound
    traffic, for example, are Not Good. Services that require you to open up TCP service
    on port 4638 from one external server by some institution you have reasonable
    confidence in might be acceptable—if there''s a demonstrable need for the service,
    if the implementation is in regular use at other sites, and/or if there are no
    horror stories from any of the major security advisory channels relating to the
    service.


    # Should Your Firewall Provide Services?


    The simple and idealistic answer to this question is no. Anything that your firewall
    does besides packet filtering reduces the level of security. It also increases
    the load on the machine, and may require more powerful hardware than we''re recommending.


    The real answer to this question depends on your resources. If you have limited
    resources, then you may not be able to afford additional machines for your other
    services. In that case, your firewall may end up providing Web, mail, news, and
    proxy services.


    The problem with services is that each added service weakens the security of the
    machine dramatically. Programs such as Web servers and mail servers are very complex
    and notoriously riddled with security holes. Sendmail had a'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'particularly bad reputation due to some incredibly nasty holes. If sendmail
    is running on your firewall and a hacker exploits a security hole, they gain access
    to the firewall. Once that happens, your entire network has been completely compromised.


    Another problem with the one-box-does-all solution is that each additional service
    increases the chance that an error could occur. If a Web server crashes your firewall,
    you lose your network. Web, email, and news servers can also become overloaded
    with heavy traffic. This will slow down the machine, which will cause your network
    to slow down noticeably.


    Services also publicly expose your firewall to a greater degree. Someone might
    try to hack your server without realizing it''s also your firewall. You don''t
    want to explicitly invite users to your firewall.


    # Commercial Firewall Systems


    To this point, we''ve treated the firewall as an abstract box. As we close this
    chapter, it''s time to see what''s inside the box. If you work through this book,
    your box will be a standard PC system, from a hardware point of view. Less-enlightened
    system administrators might go out and spend a lot of money on a commercial firewall
    box. These sound great in the advertisements, and we won''t argue: They are wonderful
    solutions. But in general, they offer nothing more than what you''ll get if you
    follow the instructions in this book.


    How could something that''s mostly free be as good as an expensive commercial
    product? Believe it or not, there are very few practical differences between firewall
    boxes and what you''re going to build. Many commercial firewalls run an operating
    system internally that is derived from BSD, one of the OS''s we use in this book.
    The software that is layered on frequently uses the same available core tools
    we use. You''re paying for a nice interface and support. The hardware used is
    sometimes optimized for packet routing and filtering (all firewalls are filtering
    routers by definition), but you''re unlikely to notice the difference unless what
    makes your connection to the outside world is faster than the T1, and especially
    if the PC you''re using is powered by a Pentium/Pentium II class processor.


    Of course, when you factor in the time you''ll spend building and configuring
    your own firewall, the real price gap between your box and a commercial solution
    narrows considerably. But the knowledge you''ll gain from building the firewall
    with your own hands will have a far greater value in the long run.


    “But what about security?”" you might ask. All of the commercial firewall vendors
    now claim that their firewall can do things that no ordinary packet filter-'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'ing firewall can accomplish. We just said that the firewall we''re building
    is an ordinary packet filtering firewall, and isn''t very different from a commercial
    firewall. So what''s going on?


    The competition among commercial firewall vendors is intense. To help differentiate
    their products, vendors have been expanding the scope of what a firewall is and
    adding features. One of the standard features is something called stateful inspection.
    With this technology, the firewall keeps track of connection details in a table.
    It constantly verifies every connection against the table and cuts the connection
    if something doesn''t match up. Sounds great, but in practice it offers a very
    marginal increase in security. Stateful inspection might be able to stop a handful
    of attacks, hackers have an almost limitless supply of attacks that won''t be
    stopped by stateful inspection. These include attacks directed specifically at
    the firewall itself, social engineering attacks, denial-of-service attacks, client
    exploits, and many others.


    Another hot feature is adaptive filtering. Here, the firewall gets involved at
    the application level by analyzing packets. If it recognizes the application it
    can dynamically adjust the firewall. The most common example is active mode FTP.
    Adaptive firewall recognizes the outbound FTP command packets from the client.
    When the client tells the FTP server which port to use, the firewall intercepts
    the command packet and port number and the server''s IP address. The firewall
    then knows what to do when an incoming connection from the FTP server''s IP address
    to the specified port on the client machine. Numerous other communications protocols,
    such as Real Audio/Video, work better using this technology.


    Adaptive filtering sounds like a great solution, but it can have some nasty side
    effects. Do you really want your firewall automatically opening and closing ports
    based on client requests? Crafty users within the network can take advantage of
    such technology to open arbitrary ports on the firewall simply by “faking” a few
    packets. Furthermore, it''s an unnecessary technology. Most applications will
    work through a normal firewall. Real Audio/Video provides numerous alternatives
    for those behind a firewall. Proxy servers are basically adaptive technology,
    except the technology is placed outside the firewall, where it belongs. Most applications
    that have trouble with firewalls tend to have some sort of support for a proxy
    server.


    Most commercial firewall vendors have rolled some form of intrusion detection
    into their firewall product. While this makes for one-stop shopping, it doesn''t
    significantly improve security. The quality of the intrusion detection method
    may not be as good as some of the other products available on the market. But
    if your firewall comes with an intrusion detection package, it''s likely that
    you''ll shop for another one that might be better. The all-in-one approach might
    also lead you to believe that the intrusion detection'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'software can be set up and forgotten about. In reality, the biggest component
    of intrusion detection system is you. Don''t expect any product to provide adequate
    intrusion detection on its own. If you go through the process of selecting and
    configuring an intrusion detection system yourself, you''ll have a better understanding
    of why the human factor is a critical component of a good detection system.


    As you can see, features that look good on paper may not really add that much
    value to your firewall. Add some filtering rules on top of Network Address Translation
    and you''re most of the way. This will get you at least that far and hopefully
    a bit further. The rest of the features provided by commercial vendors are just
    icing on the cake.


    # Creating Your Policy


    Now that we''ve looked at all the issues behind your security policy, it''s time
    to sit down and write. Let''s review the key issues first:


    +   - Evaluating your current network design and planning for future growth

    - Evaluating the services needed by your users


    Even if you''re the only user at the moment, you already have two groups of users:
    administrators (yourself) and guests (Web visitors, etc.). This is a good start.
    You might also want to create a third group for people who physically visit your
    home office or wish to access the network. Call these "local guests." If you have
    a large network, you will want to group users by business needs. It''s a good
    idea to work on this manager. By nature, managers love to group people. There
    are already group structures set throughout any large organization—latching onto
    these structures, your own network structure will be easier for the end users
    to understand.


    Once you have groups of users, you''ll need to figure out how your grouping can
    be improved. Try to keep your implementation options in mind while creating the
    groups. If you''re using a proxy server to control outbound access, check to see
    if it has user-level access control. The last thing you want to do is on a policy
    that is too complex to actually implement and maintain. Simple is good. A lot
    can be accomplished with creative subnetting, which brings us to network design.


    Is your network a computer and a modem? Or is it 20 workstations and a router
    all connected to a single hub? However your network is set up now, building a
    firewall will give you a lot more flexibility for the future.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# How Secure Should Your Network?


    Do you want a DMZ? What types of machines do you want to put in your DMZ? We recommend
    putting servers in the DMZ and tunneling to services inside the protected network.
    For example, you could put your Web server in the DMZ, but all of the content
    could come from a database or file server within the internal network. An ssh
    tunnel could connect the DMZ to the internal network in a controlled, secure fashion.
    You might decide to create three zones: a DMZ, a server zone, and the internal
    network. The server zone could be made significantly more secure than the DMZ,
    from a firewall level or by hardening the actual servers themselves. With this
    setup, the DMZ has no privileged means of communication with the internal network.


    The final step is to look over the entire list of resources that we''ve mentioned
    in this chapter. Did we leave out anything your company uses? The process of reading
    through our list of protocols and resources should help you analyze other protocols
    in a similar manner. Once you''ve figured out the set of tools your company uses,
    you''ll need to sit down with the manager and determine the sets of tools that
    each group should be able to access. The manager will love you for this. It gives
    them power to say “No secretary should ever access FTP resources.” It will give
    you great pleasure when they call a few months later and request FTP access for
    their own secretary so they can get a critical file. You can then politely suggest
    that the manager use the appropriate channels for requesting a change to the security
    policy.


    And that''s our final point for this chapter: Make sure this policy is well documented.
    Make sure you''ve got a clearly defined procedure for making changes to the policy.
    It should be nontrivial for anyone in the organization to change the policy. It
    should also be very clear that the policy can''t be changed in a short period
    of time. Forcing a week or two of review before any changes are accepted will
    help prevent managers from blowing holes in the security framework to meet deadlines.
    Make sure that management understands and signs off on the procedures for requesting
    changes. If someone complains later, management cannot do anything about it. Follow
    the policy to the letter of the law—any leeway you create will shatter the usefulness
    of your policy.


    # Summary


    Now that you understand what you''re trying to protect, it''s time to start building
    a firewall to protect it. The first step along this path is choosing the platform
    on which you''ll build your opus. This book offers a step-by-step guide for two
    excellent open source platforms: Linux and FreeBSD. The next chapter will help
    you decide which of the two operating systems is better for you.'
