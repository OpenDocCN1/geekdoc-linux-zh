  md: '# 326


    # BUILDING LINUX AND OPENBSD FIREWALLS


    like “no toner on printer 3,” “disc’s full on Gandalf again,” or “the mail system’s
    not working.” If you only have one support person, and it’s you, then you''ll
    automatically get the notification of the first sign. Your problem will be separating
    it out from all the other noise you get during the day. To this end, keep your
    mind open to the possibility that, occasionally, it might be a security incident.
    Of course, the problem is more along the lines of someone mistaking the CD-ROM
    drive for a cup holder.


    Large companies, with more than one support person, need to let the support people
    know that it’s okay to escalate things if there’s an inexplicable bug, or if you
    see something that worries them. They need to know how to get hold of you, and
    you may need guidelines about what yourself would consider worrying. You don''t
    need to put the fear of God into it, you just need to talk about this sort of
    thing occasionally. You also want to write it all down and have it in hardcopy
    somewhere well-known.


    # Evaluate


    Okay, notification worked. You''ve now been dragged out of bed at 4:30 A.M. because
    one of your administrators was logged in 3:00 A.M. ... from Latvia! (If you''re
    at a site in Eastern Europe, please read that sentence as “Langley, Virginia.”)
    You are the right person to be told about this, as per your incident response
    plan (phase 1), which you drew up after reading the last section.


    Now what? Well, you need to evaluate, based on your understanding of correct behavior
    on your network as a whole, whether this is a real problem. There’s no substitute
    for your own understanding of how your network is used normally, and what the
    right thing is. To continue with our example, if you know that one of your network
    people happens to be Latvian, and he he happens to be on holiday at the moment,
    then evaluation might merely involve calling him at home and congratulating him
    on his work ethic. Boy, will he be impressed by your incident response! If, however,
    you can find no reason for what caused the event that started the incident, you
    must conclude that you have an incident in progress.


    At small companies, evaluation involves you, as network administrator, knowing
    what normally happens on your network.


    At medium companies, you should have a policy—either in practice or in writing—that
    says which individuals are laid out and how they function. This will let you quickly
    look at a fault and determine if it’s accidental or malicious. You, as network
    administrator, will need to nominate a second-in-command who knows what you know
    and can act in your absence to evaluate an incident. If you''re in bed with Martian
    Death Flu, life will be simpler if you can pick up the'
