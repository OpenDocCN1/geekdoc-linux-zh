- img_proc: true
  md: 'The installer allows you to select the disk sets you want from the following
    list:


    +   [x] base25.tar.gz

    [x] etc25.tar.gz

    [ ] misc25.tar.gz

    [ ] comp25.tar.gz

    [ ] man25.tar.gz

    [ ] game25.tar.gz

    [ ] xbase25.tar.gz

    [ ] xshare25.tar.gz

    [ ] xfont25.tar.gz

    [ ] xserv25.tar.gz

    [x] bsd


    Note that base, etc, and bsd are already selected because they are required. We''ll
    also need misc, comp, and man. You can select these additional packages in a number
    of ways. The easiest is to use the file names one at a time.


    The fastest is to use wildcard. Type m*<CR>, followed by c*<CR> will select the
    other three. Using * will select everything, and * will delete everything. You
    don''t need to select the x packages because you won''t be running X on your firewall.
    The same applies to games.


    Type "done<CR>" and hit <CR> again when it asks if you''re ready. This will start
    the installation process. With any luck, the process will finish after a few minutes
    and if you want to extract any more sets. The default is [n], so just hit <CR>.


    The next step is to select a timezone for location. This is pretty straightforward.
    Type "?" for a list of valid timezones. You''ll notice that some locations in
    the list have a trailing slash. If you select one of these locations, you''ll
    be prompted to select a more specific region.


    Once you''ve finished selecting a timezone, the installer will go through some
    gratings. It will ask you if you are running X on this system. Your answer should
    be "n" followed by <CR>.


    That''s it! You''ve finished installing OpenBSD. It will tell you to type halt
    at the command prompt to shut down your machine. Actually, you can pop out the
    CD-ROM and type: reboot* instead. This will halt the machine and force a reboot.


    At this point, you should have a system that boots up to a login prompt. If you
    don''t, please read over the install.i386 file, look inside the cover booklet
    for the CD-ROM, and read the FAQ. In one of those documents is the answer to the
    problem you''re having, assuming you''re using relatively standard hardware. If
    not, you can always try the OpenBSD news groups for support.'
