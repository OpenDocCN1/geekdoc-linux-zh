  md: '# CHAPTER 10


    # Tuning Your Firewall


    ![](img/2fea8bfa30d45d039dcc057b944028fc_318_0.png)


    You''ve finally built a working firewall. If you followed the examples in the
    previous chapters, you even have a few filtering rules in place. Now comes fun
    part: Tuning your firewall to suit your own networking needs. This involves:


    +   - Implementing your security policy.

    - Tightening up security on your firewall box.

    - Ensuring packets are routed properly.


    In Chapter 2, "Fundamental Internet Security Issues," and Chapter 3, "How Secure
    Should Your Network Be?", we discussed many of the protocols that comprise the
    Internet. We talked about what they did, how they were insecure, and how they
    could be made more secure. We also spoke about whether you would want to allow
    or deny access to such services on your network. Hopefully you''ve given it some
    thought and have an idea of what you''d like to allow and disallow. If you haven''t
    finished thinking about it, now would be a good time to take a stab at it. Write
    your thoughts down, because they''re the basis for your Internet security policy.'
  merge: -1
