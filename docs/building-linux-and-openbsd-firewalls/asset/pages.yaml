  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Again, try telnet from the test machine to the firewall. This time, you should
    immediately get a "connection-refused" message. That''s the ICMP response telling
    the test machine that it can''t get to the firewall—the difference between DENY
