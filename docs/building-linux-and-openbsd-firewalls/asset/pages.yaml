  md: '# Won’t This Book Be Out-Of-Date Soon?


    We are fully aware that the time most of our readers get this book, Red Hat will
    have gone through a number of additional releases, and OpenBSD will have gone
    through at least one or two revisions. This is not a problem—this book was specifically
    designed to be just as relevant two years from now as it is today.


    There are two ways to deal with future revisions. The first is to simply ignore
    them—initially. Just get your hands on a Red 6 CD, or burn an OpenBSD 2.5 CD from
    the OpenBSD Web site, and the book will be 100 percent accurate. Once you''ve
    finished installing and configuring the firewall with Red Hat 6 or OpenBSD 2.5,
    you can then upgrade to the most recent version. This will often be an easier
    process since both operating systems come with installers that also allow upgrade
    while maintaining all configuration data. Furthermore, going through the process
    a few times with the Red Hat 6/OpenBSD 2.5, you''ll be comfortable enough to handle
    a layer on your own.


    The other alternative is to get the latest release and look at our Web site (www.wiley.com/compbooks/sonreich).
    We''ll be placing information on the Web site with each release that highlights
    the major points of departure from the text. We''ve already done quite a bit of
    forward looking, and here''s what we''ve found:


    Installing a firewall in Red Hat 6.1 is not going to be radically different from
    6.0. There may be a few minor changes, but nothing a page of errata on the companion
    web site won''t fix. A year or so after 6.1, its expected that Red Hat will change
    from the 2.2.x kernels to the 2.4.x kernels. The 2.4.x kernels replace ipchains-based
    firewalling with netfilter/iptables-based firewalls. Luckily, the iptables syntax
    is very similar to the ipchains syntax, and there''s a backwards compatibility
    option for people who wish to continue using ipchains the developers expect to
    remain supported until late 2003.


    The installer in OpenBSD 2.6 will be almost identical to 2.5, with a few minor
    enhancements. Once again, these will be mentioned on the companion web site. OpenBSD
    will most likely stick with IPFilter as its firewall tool for some time to come.


    # What''s on the Web Site?


    Lots of naked and totally exposed text files. Everything you need to fulfill your
    fantasies of tightly secured networks and hairy sysadmins. Tools for spanking
    script kiddies. Penguins.'
