  md: '# The Security Policy


    A well-designed policy is your shield against the forces of evil that threaten
    to disrupt the very fabric of your network. Namely, your boss, your users, and
    hackers everywhere. Of course, it would be inaccurate to imply that every boss
    and user is evil, we''ll do it anyhow for simplicity''s sake (and because the
    existence of good bosses and users has yet to be proven as as anything more than
    a statistical possibility). Your security policy will balance the needs of your
    users with the realities of hackers and other threats to your network. It might
    protect you from the occasional clueless command-from-above, such as: "Give my
    friend root access so that he can install some programs (read:solitaire)."


    Do you, personally, need a security policy? Hard to say. If you could create one
    on the spot you felt it needed, then you probably don''t, because things aren''t
    complex enough for you to need a formal policy. If, on the other hand, you would
    have to get someone else''s approval for such a policy, then you almost certainly
    need one. In any case, you should think about the points before you reject the
    idea of having a policy.


    We are assuming that your company is not bloated to the point where the authority
    to implement a major access policy requires 20 meetings with people who think
    security involves deleting all of their files and shredding every document on
    their desk every time their computer says it has performed an illegal action.
    If this is the case in your company and you haven''t had the sanity to leave already,
    this book can only help you in one way: Throw it at your window to shatter the
    glass, making it easier for you to get out (if you''re on the first or second
    floor) or end the pain (if you''re significantly higher). We do not recommend
    trying this from the third through tenth floors or if there''s a large amount
    of shrubbery beneath your window.


    # What Is a Security Policy?


    A security policy starts with a conceptual framework. It ultimately manifests
    itself as a document that describes the company policy with regards to network
    access, usage, support, hardware, and software. The policy discusses the methodology
    behind user access rights, the services that will be provided, and a procedure
    for requesting services or access that is not allowed under the policy. To create
    one, you''ll need to do a lot of thinking, followed by a lot of real writing ("a
    lot") meaning significantly more than your average sh script, and "real" meaning
    sentences that don''t start with grep and regular expressions that don''t primarily
    consist of brackets, parentheses, and other punctuation characters).'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Creating a Security Policy


    The amount of work you''ll have to do when creating your security policy grows
    exponentially with the size and complexity of your network and company. A full
    security policy for a large corporation may require months of evaluation and planning
    before being created. It may result in a fairly lengthy document or extensive
    set of documents. At the very least it involves quite a bit more than deciding
    how the firewall should work. Good security policy provides the framework for
    controlling the flow of all digital information both into and out of your company.


    It will help your effort greatly if there are existing policies that you can reference.
    For example, there may already be a policy for physical access to your office
    space. There might be a phone access policy. If your company has a Corporate Communications
    or Public Affairs department, there will most likely be policies for releasing
    information to the public. Any of these policies would be of help.


    Before you create your security policy, you have to make some significant decisions.
    These fall into three categories: administration, risk tolerance, and business
    requirements. You need to identify the person or people who can make executive-level
    decisions about security policy. Hopefully this includes you. You also need to
    assess the degree of risk to which your company can sustain exposure. If you are
    setting up a network for a top-secret military branch, you will have a less risk
    tolerance than if you''re setting up a home-office LAN. Finally, you''ll need
    to determine the various ways in which people will need to use the network, both
    from inside the network and from the outside. Let''s look at each of these areas
    in greater detail.


    # Administration


    Setting any type of policy involves administration level decisions, and a security
    policy is no exception. There are a number of critical rules that must be defined
    and assigned. Even if you end up handling everything today, that might not be
    the case tomorrow. If the rules are clearly laid out, it will be easy to reassign
    them to other people as your company and network expand.


    You''ll also need to think about issues pertaining to compliance. How do you ensure
    that your users are following your security policies? Does your policy protect
    you and your company if a user either knowingly or unknowingly breaks the law?


    There also needs to be a set of clearly defined procedures for handling a number
    of issues pertaining to your network security. What happens when you'
