- img_proc: true
  md: '# Refusing Politely


    When a packet is blocked, the kernel silently discards the packet (drops it on
    the floor, as it were). This is the most resource-efficient way of refusing a
    packet, but it can be unhelpful to the sender—message disappears into the void,
    without any trace that it was dropped.


    Some applications will benefit from knowing if their communications have been
    denied. The standard mechanism for doing so is returning an ICMP ''Destination
    Unreachable'' message or a TCP Reset when a packet has been blocked. There are
    two options to the ''block'' action that allow you to send these messages. The
    options tell the kernel to discard the packet and send a message back to the sender
    to advise that the connection failed. Specifically, the options are: ''block return-rst''
    and ''block return-icmp(code)


    The ''return-rst'' option is for TCP connections; it will send a reset packet,
    effectively forcing the sender''s connection to terminate. The ''return-icmp''
    option lets you send an ICMP type 3 (destination unreachable) message to the sender.
    You can choose the exact type of destination unreachable by specifying an optional
    ''code'' in parentheses. Note that there is no space between the ''return-icmp''
    and the (code). Use Table 9.1 to determine the value for the ''code'' parameter.
    You can use either the code name or the code number from the table. Either, it
    must be in parentheses.


    # Table 9.1 ''Code'' Parameter Values


    | CODE NAME | CODE NUMBER | MEANING |

    |---|---|--|

    | net-unr | 0 | Network unreachable |

    | host-unr | 1 | Host unreachable |

    | proto-unr | 2 | Protocol unreachable |

    | port-unr | 3 | Port unreachable |

    | needfrag | 4 | Needs fragmentation but fragmentation is not allowed |

    | srcfail | 5 | Source routing failed |

    | net-unk | 6 | Destination network unknown |

    | host-unk | 7 | Destination host unknown |

    | isolate | 8 | Source host isolated (obsolete) |

    | net-prohib | 9 | Destination network administratively prohibited |

    | host-prohib | 10 | Destination host administratively prohibited |

    | net-tos | 11 | Network unreachable for TOS |

    | host-tos | 12 | Host unreachable for TOS |'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'Returning ICMP information does open you up to probed for information. If you
    send ICMP rejection to packets you don''t want, then any packet that doesn''t
    trigger one might not know where the packet has gone, but he or she knows it wasn''t
    dropped on the floor. The attacker can then concentrate on sending more packets
    like the one that got through. It''s generally better to have attackers sending
    stuff you can cheaply drop on the floor. It''s usually much better to block packets
    outright than to provide excessive feedback.


    # Logging


    Logging can be accomplished in two ways. The first is with the log action, which
    immediately writes any matching packet to the logging device (a program called
    discussed later). The last match counts rule does not apply to the log action.
    This can be used to log certain types of packets, regardless of whether they''re
    actually passed or blocked.


    The other way to log packets is with the ''log'' option. When ''log'' is used
    as an option rather than an action, it only logs packets if the rule is the last
    rule to match. This allows you to see exactly what your firewall blocked or passed.
    This is especially useful for certain malicious packets that usually occur as
    part of an attack on your network. A good logging system can be a first warning
    of an oncoming attack.


    With either method of logging, the following qualifiers can be placed after the
    ''log'' keyword. If more than one is used, they should be used in the order shown
    here.


    body. This will write the first 128 bytes of the packet''s content to the log
    file.

    first. used with the ''keep'' option and logs only the first packet that triggers
    a ''keep'' rule and allows the rest of the packets to pass without logging.


    block. If the logging system can''t log the packet for some reason, the action
    of the rule should be changed to ''block''. This means that if the rule is the
    last to match and the packet can''t be logged for some reason, then the packet
    will be blocked altogether. If a subsequent rule matches, then this will have
    no effect.


    Another action that doesn''t follow the last match counts rule is count. The count
    action causes various accounting information to be written to a system that is
    separate from the logging system. The accounting data can be seen with the program
    ipstat, discussed later.


    # in | out


    An action parameter is required for every rule. Likewise, the action must be followed
    by either in or out. This refers to the direction in which the packets'
  merge: -1
