    Regardless of how you do it, you should run VNC through ssh. Ssh has built-in
    compression that will significantly reduce network traffic and improve the speed
    of the connection.


    # NOTE


    +   VNC has a number of different encoding formats for communicating between client
    and server. The client defaults to sending raw data if it sees the server is on
    the local machine. This results in much more data being sent across the connection,
    but gives better performance for local use. By using ssh to tunnel the connection,
    the client will think that the VNC server is local and will send raw data. To
    reduce the bandwidth usage, you should run the client with the "hexiles" option.
    This uses an encoding system that''s more efficient for network transmissions.


    # Microsoft Windows-Based Products


    There are numerous products on the market that allow you to remotely control a
    Windows machine from another machine somewhere on the network. Fundamentally,
    this is the most dangerous type of service you could possibly offer—full control
    over a machine. Thus, it''s absolutely critical that the system used is secure
    as possible.


    # Problems Associated with Windows Remote Control Products


    The Windows platform was never built with security in mind; security was added
    as an afterthought. There are fundamental weaknesses in the operating system that
    can''t be cured with a bandage. For example, background processes can run in a
    way such that they cannot be detected. This is just the tip of the iceberg—point
    your browser at bugtraqs'' archive (www.securityfocus.com)—look under "forums"
    or use the search tool and search for "win" or "windows" to see what we''re talking
    about. Part of the problem stems from the fact that the vast majority of Windows
    packages are closed source. This means that only the original developers can identify
    and fix bugs in the software. Most Windows-based software products that aren''t
    compiled directly from GNU licensed Unix code are security disasters.


    To matters worse, companies confuse us by claiming security through strong encryption.
    While the data in transit might be secure, that has nothing to do with whether
    the program is secure on a fundamental level. For'
