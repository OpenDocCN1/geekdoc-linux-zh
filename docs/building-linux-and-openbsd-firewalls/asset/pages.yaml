  md: '# How Secure Should Your Network?


    open standard managed by the Object Management Group (OMG). If the pro grammer
    uses the CORBA interface for their language, they can be sure that their program
    will work with any CORBA-compliant ORB on the market.


    General Inter-ORB Protocol (GIOP). It''s also important that ORBs from different
    vendors can intercalate. While I might run one vendor''s CORBA-compliant ORB on
    my network, the Ferrari team might use a different ORB. GIOP is part of the CORBA
    framework. As long as ORBs are CORBA-compliant, they''ll be able to intercalate
    via GIOP.


    Internet-ORB Protocol (IIOP). CORBA-compliant ORBs use IIOP to communicate between
    one another over the Internet. IIOP is an Internet-specific implementation of
    the GIOP.


    Distributed Component Object Model (DCOM). Microsoft''s attempt to make the rest
    of the world use its proprietary standards. DCOM has the same goals as CORBA.
    Most CORBA-compliant ORBs will treat DCOM objects as CORBA objects without much
    effort. Because of this, it''s safe to ignore DCOM and assume the world is CORBA
    compliant.


    Did you notice what happened? With each definition, the ratio of acronyms to English
    grew. And we were trying to keep it as readable as possible. Try looking at some
    of the technical documents on the Object Management Group''s Web site (www.omg.org).
    Some documents manage to have entire pages of nothing but acronyms. At least that''s
    being. Now we can look at how this will affect network security.


    # RMI


    Your RMI-through-the-firewall experience is going to be heavily influenced by
    whether you control both endpoints or not. If you control the client and the server,
    then you''ll have little trouble making RMI work. If the server is behind your
    firewall, then you have some flexibility. If the client is behind your firewall
    and you don''t control the server, you may have some trouble, especially if the
    remote server is behind a firewall. Finally, if you don''t control either the
    client or the server, you''re in for a fun ride.


    Let''s start with the easy scenario: you control both the client and the server.
    The best thing to use is ssh to tunnel between the client and the server. This
    makes everything easy. Unfortunately, you rarely have the luxury of having much
    control over your environment.


    The next best situation is if you can control the server, and it''s behind your
    firewall. The first thing to do is to force all the clients to tunnel via ssh.
    If that doesn''t work, things get difficult. You''ll probably have to put the
    server in the DMZ. If you do, you might want to consider running RMI on port 98—more
    on this in a bit.


    * Smith'
