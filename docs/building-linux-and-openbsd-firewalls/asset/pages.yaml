  md: '# TCP Ports


    TCP also handles another major issue: What happens when multiple servers are running
    at one IP address? Many programs use the TCP protocol to provide reliable connections.
    On one machine, it would not be unusual to be running a Web server, a mail server,
    and X Windows server, all using the TCP protocol to accept connections from other
    computers (clients). How would a machine know which service client wants to connect
    to when it establishes a TCP connection with that machine?


    The IP header contains the address of the destination machine, but there''s no
    information in the packet that points to a particular application. Since many
    services may be associated with a given IP address, this is clearly not enough
    information.


    The solution is called the TCP port number. The TCP port provides an address for
    each piece of software running on the machine. When a server starts on a machine,
    it must tell the machine TCP port number it wants to use. Then, whenever a client
    wants to connect to a particular server, it connects to the machine that the server
    is on and asks for that specific port number.


    Each server application is bound to a particular port number when it opens up
    a TCP connection. There can be only one application bound to a particular port
    number on a given IP address at any one time (else a Frenchman with a bad Scottish
    accent and slices the extra application head off with a big sword). The client
    application places this port number in the TCP header of each outbound packet.
    TCP automatically delivers the packets to the proper server application based
    on the port number. Most common protocols use standard port numbers to which servers
    are usually bound.


    The client application also opens a TCP connection (TCP connections are also called
    sockets) on the client machine. The port number and IP address of the client are
    also included in the header of each TCP packet sent by or to that. The port number
    used by the client is rarely standardized, since the server can identify it by
    looking at the TCP header. There are a few important cases where these ports are
    standardized, which we will describe shortly.


    There are two ways for a client to know which port its respective server is. If
    the server is designed to receive connections from a specific client software
    package, the port will probably be hard coded into the client. If the server is
    supporting a standard service—a Web server, an FTP server, or a Telnet server—there
    are standardized port numbers for each of these services. For instance, – servers
    are usually run on port 23; IRC servers are usually run on port 6667; Web servers
    are usually run on port 80.'
