  md: '# The ABCs of Network Security


    Security can be overdone. You don''t have to lock yourself up in an iron box to
    have appropriate security. Consider car alarms and other forms of car security.
    They can''t render a car unstealable. Nothing can do that. What they can do is
    make your car harder to steal the next equally attractive car. When you buy car,
    you''re not setting out to stop all theft. You''re setting out to stop the theft
    of your car. That''s an important difference. However, if you choose to live without
    car security, then sooner or later your car will be stolen. If you choose to connect
    to the Internet without network security, then sooner or later the crackers will
    find you. If you''re really unlucky, both things will happen on the same day.


    # What Are You Protecting?


    Formally, security is the prevention of unauthorized access to your data, to your
    computers, and to your reputation. These groups are interrelated, meaning that
    harm to one often harms another in passing. As you read each section, think about
    what assets you have that fall into these categories and how you might be abused.


    # Data


    The term data refers to more than one datum, which is a unit of information. You
    have more data than you think. Your data include *inter alia*:


    +   - Documents and databases stored on your systems

    - Passwords and other tokens transmitted across your network

    - Electronic mail stored in queues or in mailboxes

    - System files that direct the behavior of your systems

    - Logs that the systems produce bad guys in the normal course of operations


    What happens if crackers or other bad guys access this data? One or more of three
    things: (1) people read (and disseminate) the data; (2) people change the data;
    (3) people delete the data. All of these will cause headaches. If some-one gets
    into your corporate payroll system and discovers the salary of every employee
    in the company, the loss of privacy will cause headaches. If this information
    gets posted on an internal bulletin board system—or worse, on USenet newsgroup—it
    will cause migraines. If payroll information gets altered, and people are paid
    too much or too little, addiction to painkillers may become your second most serious
    problem. Finally, if all payroll records are erased and'
