    for now its highly unlikely that anyone is intercepting credit card orders over
    HTTPS. Why bother? A simple radio receiver can capture hundreds of credit card
    orders made over cordless phones.


    This isn''t to say that encryption is pointless. On the contrary, encryption is
    of the utmost importance. But it has nothing to do with this section. We''re concerned
    about the security of the browser itself. In this area, Microsoft and Netscape
    have shown a consistent inability to deliver. It is all too easy to construct
