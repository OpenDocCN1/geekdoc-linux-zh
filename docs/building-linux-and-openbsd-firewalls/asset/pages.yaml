  md: '# The Network Driver


    The network driver abstracts away the details of how the operating system is dealing
    with the programs that need to access the network. Each program can “pretend”
    that it lives in its own world and can simply ask for or send information or to
    the network as though it were the only program running on the machine. If multiple
    programs want data from the network at the same time, the network driver will
    mediate among the programs, hopefully ensuring that program gets the data it needs
    as quickly as possible.


    # The Internet Protocol


    There are many types of network drivers, and different drivers are used to connect
    different types of networks. Each type of network has its special rules for how
    data is to be passed around. The Internet Protocol (IP) by definition is the standard
    for Internet communications and specifies how data is to be transferred from machine
    to machine. By using a standard protocol, one machine doesn’t have to know what
    type of computer is on the other end of a transaction. The computer (via the network
    driver) handles converting the data into a form that it can use.


    # How Data Moves on the Internet


    When data is transmitted across the Internet, it is broken up into small chunks
    packets. Each packet is sent out separately from the transmitting computer. All
    that the packet knows is the address it’s supposed to get to. It has no idea how
    to get there. The method it uses is very similar to the way mail gets from your
    local mailbox to its intended addressee.


    Consider a packet to be equivalent to a letter you are sending out to your cousin
    in a small town in Alaska. You “send” the letter by dropping it off in the mailbox
    at your end of street. Of course, the letter doesn’t get magically transported
    to your cousin. A postal worker comes by and empties the mailbox at about 5:45
    P.M. He has no idea how to get your letter to Alaska, but he knows how to get
    it to the local post office. He takes it and drops it in a bin with the rest of
    the mail.


    Later that day, the postal workers sort the mail and see that there’s a letter
    bound for Alaska. They don’t know how to get it to Alaska, but they know how to
    get it to a central dispatch office, which may have a better idea of what to do
    with it. They put the letter in a hopper that is bound for a central dispatch
    office. A truck comes, picks up the hopper, and takes it away.


    This process of getting the letter to various central dispatch offices continues
    until one of the larger offices actually knows how to get the letter to Alaska.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    A worker at that office puts it in a hopper that gets loaded onto a plane bound
    for Anchorage.


    The plane lands in Anchorage, and the postal workers there look at the letter.
    They know where the small mining town is, but they don''t have any trucks that
    go directly there. So, the letter travels to a larger, nearby town. The postal
    worker in the larger town is going to visit a friend in the mining town later
    that week, so he takes the letter with him and delivers it to your cousin when
    he arrives.


    What was the point of that long and complex story? It actually quite a few points.
    The first major point is that you replace the postal workers with computers known
    as routers and the trucks with Internet wires, you have a pretty good idea of
    how data get from point A to B on the Internet. A router is essentially a digital
    postal worker. Just as a postal worker passes a mail to a post office closer to
    the envelope, a router is a computer that is dedicated to passing information
    to other computers nearer the intended destination. The first routers may not
    know how to get the data to its intended location, but they can pass it to other
    routers that may have a better idea. Eventually, a router somewhere along the
    line “knows” to get the data to the right recipient.


    How do the first routers guess where to send the information? Each computer on
    the Internet has a unique address in the form of a four-part number known as an
    IP address. This variety is very much like a phone number, in which the first
    part is the country code, the second is the area code, the third is the exchange,
    and the fourth is the phone itself. The routers look at the IP address, which
    is a combination of four numbers, each of which can be in the range of 0 to 255.
    For an explanation of IP addresses, please see the sidebar titled, What’s in an
    IP Address?


    The first router looks at the four numbers in the destination IP address. If it
    knows how to get information to a router with the same first four numbers, it
    sends the packet along the proper direction. If it doesn''t know where the network
    is, it will send the packet to another router that may have a better chance at
    locating the destination in question.


    If the packet is being sent in the right direction, each router it should know
    how to get the packet to a machine that is closer to one of the actual destination
    network. This process occurs when the packet is at a machine that’s on the network
    itself.


    If at any point this chain knows that it is directly connected to a computer within
    the destination network or possibly even the destination itself, it will send
    the packet straight there, bypassing all of the coming in work. Going back to
    our original letter-to-Alaska example, imagine if your hometown was near the central
    dispatch station knows how to send mail to Alaska. Your letter would get there
    much faster because it would bypass many unnecessary steps to other dispatching
    offices.'
