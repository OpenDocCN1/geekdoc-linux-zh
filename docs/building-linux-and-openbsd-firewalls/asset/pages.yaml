    # Configuring the Network


    So you''ve set up your hard disk. Great. Your next move is to get your network
    connection up and running. You don''t need to get all of your cards running now,
    but it will really help if at least one card is configured (especially if your
    CD-ROM isn''t working and you need to perform a network install).


    The installer makes network configuration very simple. If your card is likely
    to be supported with the default kernel, then the installer will detect it. The
    installer will also let you configure multiple cards. Therefore, we recommend
    connecting your firewall to the network in the configuration you ultimately plan
    on using. This will give you an early heads-up to potential networking problems,
    and the lights on the cards/switches/hubs will provide useful diagnostics.


    If you aren''t placing your DMZ behind the firewall, then you''ll just need to
    plug one network card into a switch/hub on the internal network, and either another
    network card plugged into the external network or a modem. If you''re using a
    modem, we''ll have to configure it later.


    If you are creating a three-legged network with a DMZ, you''ll need three network
    cards or two network cards and a modem. Plug one network card into a switch/hub
    on the internal network. Plug another network card into a switch/hub in the DMZ.
    If you''re connecting to the Internet via Ethernet, then connect the last network
    card to your external network router/switch.


    Assuming that your network card has diagnostic lights, to make sure that they''re
    showing a "link." Likewise, the switches/hubs should also show an active link.
    If the cards aren''t lighting up, they may be installed incorrectly or they may
    be defective. Catching this type of problem now will spare you numerous headaches
    a few paragraphs later.


    It''s time to move on with the installation. When the installer asks if you want
    to configure your network, type "y" and hit <CR>.


    You''re now asked for the system host name in short form. The system host name
    is the name you want to give your computer. You might want to call it something
    other than "firewall"; this makes it a less obvious to the casual hacking observer.
    Maybe calling it "pita" or "nostril" would be a better choice. Short form means
    that you shouldn''t put your domain name after the hostname. If your domain name
    is bread.com, you''d enter just "pita" here, not "pita.bread.com".'
