    we have already discussed: ACCEPT, DENY, REJECT. Their function as rule targets
    is the same as their function as policies. If a rule matches a packet, and the
    target is ACCEPT, the packet passes through the chain. Congratulations, packet!
    If a rule matches a packet, and the target is DENY or REJECT, the packet fails
    to pass through the chain. Try again next week, evil attacking packet.


