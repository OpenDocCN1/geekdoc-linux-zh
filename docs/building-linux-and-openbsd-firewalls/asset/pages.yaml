  md: '# Loose Notes


    thing into the document, you''ll need to save your file before you let quit. To
    save your file, use the command :w (stands for :write). To save and quit, use
    :x or :wq. Without saving, use the command :q! (whenever vi starts to complain!,
    can be used to force the system to comply with your wishes). By now the truth
    should be apparent: vi was created as a celebration of the medieval arts of paint
    and persuasion. The text editing features were thrown in as an after-thought.
    It''s not supposed to be friendly, it''s supposed to be light and powerful.


    # Look After Your Colon


    In command mode, the colon precedes long-form commands—that is, commands which
    are more than a single key. Pressing : in command mode, and you''ll be taken to
    the bottom of the screen and a colon will appear. Press <CR> and you''ll be in
    ordinary command mode, or type "set" and hit <CR> to see a long-form command working
    (it''ll display a list of the current variables which have been set, and invite
    you to hit <CR> to return to ordinary command mode).


    # How Do I Get More Help?


    If you want to get a list of all the available commands on OpenBSD, type:


    ```

    :viusage

    ```


    The colon puts the vi system into extended command mode. There are many extended
    commands available, including the useful :q command we just learned about. To
    see the list of other :commands, type:


    ```

    :exusage

    ```


    You can also try:


    ```

    :help

    ```


    which will bring up short help screen.

    On Red Hat''s :help in command mode will open up the full help system, which is
    pretty extensive.

    That''s the extent of our vi tutorial. Some implementations come with a built-in
    tutorial—you can learn quite a bit more from that. Additionally, there''s always
    the vi man page—if you dare. Once you''re familiar with working in vi you might
    begin to feel that, for all of its faults, vi is a reasonable improvement over
    punch cards. This feeling is only temporary and will pass with time.'
