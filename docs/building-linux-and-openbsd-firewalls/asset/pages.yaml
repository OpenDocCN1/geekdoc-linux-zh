    # The Foundation: IP


    Data that are sent over IP are sent as a series of fragments, called *packets*.
    A large chunk of data is broken up into many packets. The key to IP is its simplicity.
    IP provides a mechanism for delivering packets across a network. What it DOES''T
    ensure is that the packets get there, or they arrive in any particular order.
    If a router doesn''t know how to get an IP packet to its destination, it throws
    it away and sends back an error message.


    When you can''t guarantee a packet will be called *unreliable*. If there''s no
    information that could help relate one packet to the next, the system is called
    *connectionless* or stateless.


    Very few applications deal with IP directly. is usually handled in the kernel
    (core) of an operating system. Instead applications use TCP and UDP, which provide
    a higher level interface to IP. There is a class of applications that deal with
    IP directly—these are the various packet monitoring tools that we''ll be looking
    at in Chapter 11, "Intrusion Detection and Response."


    Every packet sent across the network resembles a Russian doll (see Figure 2.1).
    Each *shell* is a header and possibly a trailer. The header is information that
    is placed at the beginning of a data chunk. The trailer refers to information
    that appears after the data chunk. Inside the shell are the data, which are often
    other smaller Russian dolls.'
