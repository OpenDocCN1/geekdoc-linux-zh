    get used nearly as much as other methods of communication; therefore, less attention
    has been paid to multicasting security.


    IGMP does not have any type of security built in, meaning that anyone could technically
    listen to any multicast on their network. All aspects of multicast security are
    left to the application level. The only way to make multicast session eavesdrop-proof
    is to encrypt the data stream. There are numerous projects underway to make IGMP
