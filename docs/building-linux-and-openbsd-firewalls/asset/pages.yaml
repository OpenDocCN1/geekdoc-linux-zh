  md: '# Choosing an OS: Linux versus OpenBSD


    patches and/or new RPM releases are often quick to appear in the Linux community.


    # Performance


    For firewalling, both Linux and OpenBSD will offer very similar performance profiles.
    Various benchmarks show both systems to be nearly identical in execution speed.
    In general, it appears that OpenBSD has somewhat better heavy load stability.
    OpenBSD machines also tend to have longer uptimes (elapsed time before rebooting)—notice
    that both systems are very close in performance, and under certain configurations
    Linux may outperform OpenBSD.


    Both operating systems provide significantly faster and more stable performance
    than Windows NT (benchmarked on the same machine). Linux and OpenBSD also fare
    favorably when compared to commercial Unix flavors. For example, one benchmark
    picks OpenBSD against Solaris, a commercial operating system from Sun Microsystems,
    and that OpenBSD is actually faster than Solaris for certain types of calculations.


    Rumor is that it has the fastest performance on a PC comes from FreeBSD, which
    has been specifically optimized for the PC architecture. It is for this reason
    that Yahoo! and cdrom.com (a high-traffic FTP server) are primarily run on FreeBSD.


    # Miscellaneous Issues


    Beyond the various considerations outlined above, we might want to touch on three
    other issues that one needs to consider. The first deal with the security implications
    of the differing development philosophies. The second is applicable if you plan
    on working with OpenBSD or Linux for other projects in the future. The third deals
    with the large amount of “my operating system is better” conversations that appear
    on the Internet.


    # Development Philosophy


    There is a significant difference between the development philosophies for Linux
    and OpenBSD. Jason Downs, an OpenBSD developer, describes these differing philosophies
    in an article for ComputerBits magazine (www.computerbits.com/archive/1999030/bsd.htm).


    Linux itself is actually a kernel: the portion of an operating system that handles
    devices, manages memory, runs programs and does other things like an interface
    between the computer and its network. Everything that makes up the Linux operating
    system is contained in separate programs, usually written by different programmers
    than those who work on the kernel. The entire system'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'is integrated and packaged by yet another person or company and sold or given
    to users as a distribution. The distributor has little or nothing to do with the
    actual development of the kernel or of the other programs they''re packaging;
    they just make a few changes, compile everything and create installation tools.


    OpenBSD and the other BSD systems are not developed like this. All user programs
    are developed in conjunction with the kernel, from the same source tree... This
    allows a much higher level of system quality control and better integration: If
    an internal API [Application Programming Interface] is added or changed, all programs
    using it will be changed at the same time, with the system having remaining compatible
    with previous interfaces. When a security feature is added to the kernel, all
    of the user programs that should be using it will be modified at the same time.
    Conversely, no single person organization has complete oversight of every program
    that makes what is considered the Linux operating system.


    What does this philosophical difference mean in real terms? For example, consider
    buffer overflows. We covered these briefly at the end of Chapter 2, "Fundamental
    Internet Security Issues."


    The concept of a buffer overflow has been around for a very long time, and exploits
    have been around nearly as long. Nevertheless, new exploits are constantly turning
    up. Since the beginning of 1998, the Computer Emergency Response Team (CERT; CERT)
    has issued 17 general advisories. Of these, a third involved overt buffer overflows.


    Once the concept of a buffer overflow was understood, the OpenBSD team went through
    the OS code and ripped out every potential buffer overflow. That''s not to say
    that the thing hasn''t also happened to Linux, but the OpenBSD team have a clear
    mandate to do that sort of thing—even if it means they can''t do new features
    that people want.


    We''t want to scare anyone. There haven''t been any CERT advisories regarding
    Linux kernel holes in that same period, either. But there''s clear added value
    in an OS that makes security a formal requirement across the entire distribution
    base, even at the expense of chrome.


    If you want to avail yourself of this, it will mean learning to live without chrome—and
    ideal functionality. Your firewall is your machine, so you have to make the call.
    One author uses Red Hat, the others use OpenBSD, so even we can''t quite make
    up our minds.


    # Suitability Outside the Scope of This Book


    After reading through this book, you might decide to embark on other projects
