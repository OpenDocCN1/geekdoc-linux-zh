    the daemon by typing: "/usr/local/sbin/sshd" at a command prompt.


    # Summary


    In this chapter you learned how to install OpenBSD. You also learned how to prepare
    it for a firewall. We walked through configuring PPP, additional network cards,
    and your kernel. You should go through the process of installing and configuring
    OpenBSD a number of times. Each time you do it you''ll become more comfortable
