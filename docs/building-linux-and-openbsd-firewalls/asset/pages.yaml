    but "mount /mnt/cdrom" is easier to remember. In case you’re wondering, the "mount"
    attempts to automatically determine the type of file system’s being mounted. It
    calls the appropriate filesystem mount command. For CD-ROMs, this is "mount_cd9660".
    We explicitly state "_cd9660" here because sometimes the mount doesn’t recognize
    the CD filesystem. If you make the suggested addition to /etc/fstab, the mount
