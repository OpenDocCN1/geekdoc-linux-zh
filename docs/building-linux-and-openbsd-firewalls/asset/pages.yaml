  md: '# Configuring the Firewall under Linux


    So far, you''ve decided to install Linux, you''ve acquired and assembled compatible
    hardware, and if you''re still reading you''ve also installed the OS without any
    major loss of life or limb. In this chapter, we''ll start by discussing the theory
    behind the firewall tool and the underlying concepts. Then, we''ll practice making
    a few trivial rules, and testing them to see that they work. We''re not going
    to make too many important decisions regarding the services your firewall allows—that''s
    the job of Chapter 10, "Configuring the Firewall.\ The goal is to end the chapter
    with a basic functional firewall. If necessary, we''ll also help you set up IP
    Masquerading.


    The tool in Linux 2.2 kernels for configuring firewalls (and masquerading) is
    called ipchains. Until version 2.2 released, the tool was called ''ipfwadm'',
    and was a rewrite of BSD''s ''ipfw.'' Rusty Russell and friends completely overhauling
    the packet filtering code for the 2.2 kernel.


    Before we do anything else, we must make sure you''ve got ipchains installed in
    the OS. Use the command `rpm -qa | grep ipchains`. This lists all packages and
    from that list extracts any that contain the word ''ipchains''. If you see something
    like ''ipchains-1.3.8-3'', you''re clear to proceed. If you don''t get anything
    except a prompt, you''ll need to go back to Chapter 6, "Installing Linux," and
    revisit installing ipchains.


