    # IP Masquerading


    While nearly all IP addresses specify a machine on the Internet, some have been
    set aside by Internet Assigned Numbers Authority (IANA) as “reserved for specific
    purposes.” For example, the address range starting with numbers “224.” through
    “255.” is dedicated to various uses including multicast communications. Every
    address starting with “127.” is reserved as the loopback network; 127.0.0.1 is
    specially reserved as the loopback address for the local host. The loopback device
    provides a machine with a convenient way to communicate with itself. The client
    program thinks it''s sending data out to a regular IP address. A server running
    on the same machine sees the data as if they were coming from a machine on the
    network. Most importantly us, three ranges of addresses have been deliberately
    held back for internal network use: 10.abc.def.ghi, 172.jkl.abc.def, and 192.168.abc.def
    (where abc, def, and ghi are numbers between 0 and 255, and jkl is between 16
    and 31).


    Addresses in all of the reserved ranges are unrouted. This means the Internet
    as a whole doesn''t have any idea how to deliver packets to these addresses. In
    consequence, these addresses are available for you to assign to your machines
    with impunity. Most people use the first (10.abc.def.ghi) and the (192.168.abc.def)
    group (we don''t know what they''ve got against the middle one).


    The immediate implication of using private address space is that machines on the
    Internet will not be able to send information to your private machines. For example,
    if a computer on your internal network asks for a Web page from the Internet,
    the target Web server will not be able to send the Web page back to your internal
    computer. This may leave you wondering anyone in their right mind would use private
    addresses on their network.


    What appears to be a major problem with private addresses is actually a desirable
    feature for some people. In many cases, you may not have machines on your network
    to have any communications with the Internet. By assigning these machines unrouted
    IP addresses, they are impossible to reach directly from the Internet. If the
    rest of your network is configured properly, this strategy can significantly increase
    the security of critical internal machines.


    Another advantage of private address space is the wealth of freely available private
    IP addresses, versus the rapidly diminishing pool of routed IP addresses. Your
    ISP has a limited number of IP addresses to assign to all of their customers.
    Each extra address they give you lowers the potential number'
