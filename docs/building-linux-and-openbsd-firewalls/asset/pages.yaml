    It must be running, since it doesn''t know when the client will want to communicate.
    The client, on the other hand, can be run at any time.


    The term server is often used loosely, and can refer to a single program running
    on a machine, or an entire machine that is running one or more server applications.
    To avoid confusion, a more specific term for the individual server application
    is frequently used: service. Thus, a server provides one or more services to clients.


    A protocol is the language that a service uses to communicate with its clients.
    There are a number of international organizations that work together to standardize
    internet protocols. Without standards, every networked application would have
    its own proprietary protocol, client, and server application. Imagine what the
    Internet would look like if Netscape browsers could not talk to Apache Web servers.
    The reason is HTTP—the HyperText Transport Protocol. All Web browsers and servers
    use the same language to communicate, ensuring that any HTTP client browser will
    be able to connect with any HTTP compliant server.


    Open-standards protocols have helped the Internet evolve rapidly. A programmer
    doesn''t have to worry about creating both the client and the server software
    if a standard protocol is used. This ultimately gives the user the greatest flexibility.
    Because of this, many networked applications'
