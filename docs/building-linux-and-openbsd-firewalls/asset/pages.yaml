    A god idea is to put a smoke detector above the machine and make sure someone''s
    in the house/office overnight. If youve accidentally misconfigured a jumper setting,
    you might cause your processor to overheat. Leave the case open so that the chance
    of a fire is reduced. Use the sniff test frequently.


