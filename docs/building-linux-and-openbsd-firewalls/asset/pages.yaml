    tables. RIP processes the response and builds its own routing tables accordingly.
    From that point forward, RIP broadcasts its routing table to its neighbors at
    regular intervals. When something changes, RIP also sends out a specific update
    detailing the change.


    As simple as RIP is, it has a number of problems that make it less optimal for
    modern networks. One replacement for RIP is Open Shortest Path First (OSPF), which
    fixes the problems with RIP and anticipates some future issues as well. OSPF utilizes
    IP directly, and therefore must be supported by the IP handler in the kernel of
    the operating system. Most new OS releases support.


