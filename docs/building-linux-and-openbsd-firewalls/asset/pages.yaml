  md: '# BUILDING LINUX AND OPENBSD FIREWALLS


    Do not block ICMP type 3 unless fun for you. Not only is this used by remote hosts
    to signify that a firewall or other device has chosen to block your packet (recall
    the difference between REJECT and DENY), but type 3 ICMP is used by the TCP implementation
    to negotiate certain parameters. Your network performance will suffer badly if
    you block type 3 ICMP to the machine you use to connect to the outside world.
    To allow it, use a line like:


    ```

    ipchains -A input -p icmp-destination-port 3 -j ACCEPT

    ```


    Note that we have now allowed ICMP type 3 packets to enter the firewall, whether
    they are intended for the firewall or for some machine inside your network.


    The ‘i’ flag allows you to specify only a particular interface. If, for example,
    your Internet connection is via PPP across a modem, then it is likely your network
    interface is ppp0. If this were true, you could apply more stringent conditions
    to packets coming from the Internet using ‘i ppp0’ in the conditions or the stringent
    rules. If your external interface has name (eth0 or sl0, for example) then just
    substitute name for ‘ppp0’. Since this is exactly the behavior we require of a
    firewall—that it should be meaner to packets coming from the outside world than
    to packets leaving from your internal network—we will use this flag in the final
    firewall.


    The ‘y’ flag allows you to match packets with the ‘SYN’ flag set on, and the ‘ACK’
    and ‘FIN’ flags cleared. Any packet trying to initiate a TCP connection which
    has three flags set as described; conversely, any packet which has some other
    set of values for those three flags is not initiating a conversation.


    Why is this so helpful? Bear in mind, behind your firewall, there will be flocks
    of users initiating TCP connections to all sorts of ports on all sorts of servers
    over the Internet. Packets will be coming back to a variety of local ports from
    a variety of remote ports on a variety of machines. The only thing that all packets
    have in common is that they are all responses to connections initiated by users
    at your sites. You want to let them all in, but you don''t want to let everything
    else in with them.


    Consider the following rule:


    ```

    ipchains -A input -i ppp0 -p tcp -y -j ACCEPT

    ```


    This rule is part of the input chain. It applies only to packets on interface
    ppp0, and only those which are TCP packets. It also requires that the ‘-y’ flag
    not apply; that is, it requires that a packet be part of an existing conversation,
    not a request for a new one. If all three conditions are satisfied, the packet
    is accepted. Any TCP packet that presents itself on your exterior interface claim-'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'ing to be part of an existing conversation is one you want to invite in for
    a closer look. Combine this with an input policy of DENY and a rule to accept
    packets originating inside your network, and you''ve done some highly selective
    filtering.


    Right now, you may be wondering if the SYN flag can be faked. Well, yes can. As
    a network nasty person, can put a packet together that says nearly anything. If
    a packet arrives at a machine claiming to be part of a pre-existing conversation,
    but the machine has no knowledge of such a conversation, the naughty packet should
    get dropped on the floor. A rule like the one above isn''t completely safe—but
    it can make your filter simpler. A simple filter is much less likely to fail at
    unforeseen holes due to rule ordering or poor syntax.


    Nevertheless, you may wish to be picky about the source port of such packets.
    If instead of one blanket rule we see above, but have several rules also specified
    source ports, we could permit only packets that were part of pre-existing telnet
    conversations, or ssh conversations. The three rules below do, in that order:


