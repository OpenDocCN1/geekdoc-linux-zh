  md: '# Incident Analysis


    There''s no roadmap to incident analysis. We can''t tell you to find system vulnerabilities;
    if we could, we would find them and fix them ourselves. Working out how you were
    compromised is much like scientific investigation. You have to be painstaking
    and methodical, and you have to avoid lying to yourself or accepting faulty logic.


    Start with what you know—the event that triggered the incident. Summarize what
    you know about it. Think about how someone might have got into a position where
    they could do such a thing. Work through such a process in your mind and figure
    out what logging information such an activity would have generated. Check your
    network audit systems for evidence of such activity.


    Sometimes an exploit will involve a vulnerability of which you are completely
    unaware. Nothing will help you in such a case; you will not be able to find a
    trail that makes sense. When you''re confident that you''ve overlooked an audit
    trail or failed to spot the important thing in the logs, make sure you keep the
    tapes of the damaged systems for later analysis. We should stress that there are
    a lot of systems on the Internet these days. It''s very unlikely that your site
    is the very first to be hit through the brand-new frobnitzed11.3(1). Search imaju
    as well as CERT and other advisories thoroughly before you conclude that you''re
    involved in something new.


    You may also wish to notify CERT and other emergency-response teams, particularly
    if intrusion appears to have been caused by the exploitation of a new vulnerability
    in your systems rather than by an unpatched hole or a misconfiguration. Your plan
    should list contacts for all these organizations, and it should say who will decide
    whether or not to call them.


    If you wish to pursue legal action, or think that might be a possibility, you
    will need to make arrangements to have your media secured. At the very least,
    label each tape with an exact description of the contents, and sign and date the
    label. Write-protect the media. If this can be done in a permanent manner, by
    saving a read-only tape in place, so much the better. Finally, make arrangements
    to have the media secured so that tampering is infeasible until it''s handed over
    to law-enforcement personnel. If you have third-party offsite storage for your
    backup media, making up a special box and sending it offsite may well be enough
    to prove that it wasn''t touched if you can''t prove that they could possibly
    have been tampered with.


    Speaking of the Old Bill (okay, “law enforcement personnel") everywhere outside
    of the U.K.), should you call them or not? Unless the incident involved the loss
    of a substantial amount of money, or real major damage, they''re probably'
