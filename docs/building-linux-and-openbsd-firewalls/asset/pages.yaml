    a rule, but you can''t add it to a policy. The ''-I'' flag in a rules carries
    information about any packet that matches the rule to be logged. The information
    is logged through the syslog service, with facility "kern" and severity "info."
    It''s a pretty good idea to keep an eye on those knocking on your door. See the
    sidebar on logging to learn how to do this.


    You''ve seen your first full-blown firewall. It''s short and sweet, but it''s
    usable. What will do for you?


    # Logging


    All Unix mixes come with an excellent tool for centralizing logging called. The
    primary parts are the syslog daemon syslogd, which we told the system to start
    at boot time when we installed Linux, and the configuration file /etc/syslog.conf.
    While the precise operation of syslog is too complex to cover in this book, you
    can read the full documentation by typing "man syslog" and "man syslog.conf".
    For a quick and dirty logging system, add one line to the end of your syslog.conf
    file which says:


    ```

    /var/log/firewall

    ```


    It should also be noted that syslog is itself network service—it runs on UDP port
    514. Although Red Linux distributes syslog configured to ignore any messages that
    originate from machines other than the one it''s running on, it would be wise
    to bar packets arriving from the Internet on UDP port 514.'
