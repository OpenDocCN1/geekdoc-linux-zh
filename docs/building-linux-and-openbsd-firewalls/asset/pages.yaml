    has been assimilated into networking, without the cheese. The network uses it
    to mean: "a portion of your network, although under your control, is outside your
    heaviest security." Compared to the rest of your network, machines you place in
    the DMZ are less protected, or flat-out unprotected, from the wrath of the Internet.


