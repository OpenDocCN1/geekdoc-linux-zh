- img_proc: true
  md: '# How Secure Should Your Network? 97


    Even the official tools might be sending private information to third parties
    without your knowledge. Nonetheless, one can reasonably trust the Real Player,
    from Real Networks (www.real.com). They give you options to turn certain types
    of tracking that they perform (although it''s still possible that other data are
    gathered without your consent).


    Privacy notwithstanding, there''s also the possibility that a hostile site could
    send back data to your client that exploit a security hole in the client software,
    allowing the hostile site to take control of your machine. Microsoft NetMeeting
    has been notorious for containing numerous insecurities of its nature. The fact
    that it is installed by default on Windows-based machines and can be launched
    (and compromised) from an email message should cause some concern. NetMeeting
    is a scary program when you realize it''s capable of and how many problems have
    been found in it. Check out NetMeeting vulnerabilities bugtraq (www.geek.com/bugtraq).


    Conferencing software (not just NetMeeting) is very general for a number of reasons.
    For speed reasons, the transmissions are almost never encrypted. This means people
    on the Internet eavesdrop on an entire conversation very easily. It''s like talking
    on an old radio-based cordless phone. Anyone in the neighborhood can listen with
    an AM/FM radio. Most conferencing packages also have tools such as file exchange
    and remote desktop-control. A hacker doesn''t even have to cause a buffer overflow
    to use the software to attack your machine if they can find a flaw in the client''s
    access (assuring it has some). We explore this further in the Remote Window Interface
    Control section in this chapter.


    Another problem with any type of multiuser networking software is that it can
    involve broadcasting your IP address to the world as a user of software service.
    For example, many conferencing tools allow you to be listed in a directory so
    that others can connect to you. These directories often contain sorts of information
    useful to a hacker—from the version of the software you''re using to other personal
    information (such as your name), which can help them if they decide to use social
    engineering.


    Games are notorious targets for hacking. Game release cycles are very short, and
    there''s a lot of pressure to get games out the door. This results in poorly coded
    games with numerous bugs that take a fix. Sometimes the game has security bugs
    that allow hackers to invade the machine of a gamer while they''re connected to
    the game network. Hackers simply wait on the game network-works for victims and
    then strike when they get a vulnerable IP address.


    Another popular attack is the simple denial of service. In combative multiplayer,
    players often are ranked based on their in-game performance. Many gamers take
    these rankings very seriously. Some losers may sometimes'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'resort to DoS attacks if they fear they might lose a match. By launching a
    DoS at their opponent they''ll either paralyze the opponent, allowing a win for
    the attacker, or they''ll disrupt the match, invalidating the match score. This
    is a reason for not allowing highly popular multiplayer games through the firewall—your
    network may get disrupted by an external disgruntled player who decides to flood
    flood in retaliation.


    # # How to Make Streaming Media Secure


    Getting multiuser software (conferencing and games) to run through a firewall
    is simply not recommended. If you need to conference between branch offices of
    the same company, or with other trusted companies, you can set up a secure tunnel
    for the conferencing application. Either way, running the software in the DMZ
    is a better alternative.


    In general, the more client software tells you, the better. Systems that only
    require connection to one machine with a fixed IP are easier to handle than those
    that allow arbitrary connections to machines all over the Internet. For example,
