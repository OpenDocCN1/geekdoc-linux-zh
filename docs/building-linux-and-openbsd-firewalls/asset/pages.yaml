    # How to Make Web Clients Secure


    You would think that upgrading to the latest version of your chosen browser would
    fix the security holes. To some extent, you''d be right. The most publicized holes
    are usually plugged up with the next release. Of course, each release has also
    introduced numerous security holes. Furthermore, there are many holes that hackers
    have not published. When browser exploits received significant press, it was worthwhile
    for hackers to publish a few. Now that the media is completely ignoring security
    issues, hackers have little incentive to publish holes they find. Instead, they
    keep the holes within the hacking community. End users now have a false sense
    of security—the lack of media attention would lead one to believe that browsers
    have become more secure. Nothing could be further from the truth.


    So what can you do? A firewall won''t protect your users against many of the browser
    exploits, especially the most dangerous ones like Back Orifice. A proxy server,
    forbidding-plugins, and turning off Java, JavaScript, and ActiveX will help to
    some extent, but it still leaves more than open holes.


    The most secure solution is to not use Netscape or Internet Explorer. Give instead
    yours an open source browser such as Mozilla. Since it''s open source, you can
    fix any security holes that you find. More to the point, you can fix any holes
    that anyone can find, as soon as you hear about them.


    Another solution is to allow only Web access from machines in DMZ. This definitely
    reduces convenience, but it''s a major boon for security. If Back Orifice compromises
    a DMZ machine, it won''t compromise your internal network, although your DMZ might
    be a stepping stone for future attacks.


    Back Orifice and similar exploits are only undetectable on operating systems that
    do not log processes. Operating systems like Linux and BSD keep a record of every
    running process. A good suite of intrusion detection software will be able to
    detect unauthorized processes. Windows and Mac machines are much more susceptible
    to Back Orifice-type attacks because background processes cannot be detected.
    This means there''s no way to tell if Back Orifice has compromised a machine just
    by examining the machine alone. Some intrusion detection programs, such as the
    Network Flight Recorder (NFR) released by the loft, are capable of detecting communications
    between a standard BO client and server. Unfortunately, the open source nature
    of both Back Orifice and the detection tool means that a skilled hacker could
    easily create a variant of BO that is not detectable by the NFR tool. Nonetheless,
    the löpht tool will definitely catch recreational Back Orifice use by script kiddies.'
