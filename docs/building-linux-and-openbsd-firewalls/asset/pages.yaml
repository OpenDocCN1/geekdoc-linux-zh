    # ## Problems Associated with VNC


    Like X, VNC is not a secure protocol. All of the caveats about X apply.


    # ## How to Make VNC Secure


    Unlike X, it''s true open source, so you can get the source code without a license.
    This means you can plug in any type of encryption system you''d like, but we don''t
    recommend it now. Instead, simply forward the VNC TCP connection through an ssh
    tunnel.


    Forwarding VNC is easy to do: Let’s say your VNC server is running on port 5900
    (the default for display :0). Tell your client program to communicate with local
    port 5900. Then, use ssh on the client side to forward local port 5901 to port
    5900 on the server end.'
