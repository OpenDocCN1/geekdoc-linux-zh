    The latest LTS release is 20.04 and will be available until 2025. Ubuntu supports
    both (CLI) command line interface (CLI) and graphical user interface (GUI) to
    perform various tasks on the OS. CLI is the primary way to interact with systems
    hardware (processor/memory); you can perform all GUI''s tasks. This chapter will
    explain the use of various commands that provide ease to execute multiple functions
    of Ubuntu using CLI.


    # WHAT IS CLI?


    It is a powerful program. Beginners are unwilling to use it, considering it only
    for advanced users. However, this is not the case.


    The command-line interface is referred to as CLI. It''s an application that lets
    users send text instructions into the computer to tell it what to do.


    In this whole chapter, you will learn everything you need to know about CLI.


    # Roots of CLI


    In the 1960s, CLI was in use.


    People have only a keyboard as an input device, and the computer screen could
    only display text information. The CLI was the standard user interface in operating
    systems like MS-DOS.


    Users need to type a command on the CLI window to perform tasks, and this is the
    only method to communicate with the computer.


    After typing a command, the users get the result either in a piece of text information
    or specific action performed by the system. That being said, typing the correct
    command is the key.'
