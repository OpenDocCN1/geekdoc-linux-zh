  md: '# FLATPAK APPLICATION


    It is a utility for software and package management for Linux. It offers a sandbox
    environment where users can run the application software in separateness from
    the rest of the system.


    It was developed as part of the freedesktop.org project known as X Desktop Group
    or XDG and was initially called xdg-app.


    # Features of Flatpak


    +   * It provides a sandboxing environment for running apps.

    * It provides support for 24 Linux distros.

    * It helps run multiple versions of the same app at the same time.

    * There are no dependency incompatibilities.

    * The automatic application update in the background.


    # Enabling Flatpak Support


    If you are using Fedora, Endless OS, Linux Mint, CentOS, or Elementary OS, you
    can skip this step because you do not need to install Flatpak. Most of these distro
    comes with preinstalled and default Flatpak support.


    To enable Flatpak on other Linux distributions, we have to run a single command
    to install Flatpak and autoconfigure with the Linux system.


    To install Flatpak on Debian, OS, Ubuntu, and its derivatives, use the following
    command:


    ```

    $ sudo apt install flatpak

    ```


    To install Flatpak on the version of Ubuntu before 18.10, use the following commands:


    +   * sudo apt install flatpak

    * sudo apt update


    Once you install Flatpak, restart your system, and we are ready to hop on to the
    next step of Flatpak applications. But before going forward, we will discuss three
    methods to download and install Flatpak apps from the Flathub repo.'
