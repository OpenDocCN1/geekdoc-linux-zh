  md: '# Install Shutter Screenshot Tool in Ubuntu


    It is a neat tool for adding arrows and text to the images. You can use it to
    resize Ubuntu images or whatever Linux distribution you are using. Most of the
    screenshot tutorials on FOSS have been edited on Shutter.


    Here we are using the concept of PPA. If not, I highly recommend reading the detailed
    guide given below to know more about PPA and how to use it.


    # What Is a PPA?


    PPA stands for “Personal Package Archive” and is an application repository used
    to upgrade and install packages from unofficial sources.


    # Difference between PPAs and Other Repositories


    DEB packages can be served through any repository that adheres to Debian’s rules
    and guidelines for creating and maintaining repositories. For example, the openSUSE
    build service provides repositories used to install and upgrade packages in Ubuntu.


    On the other side, a PPA is hosted on Canonical servers and is served through
    its Launchpad platform. Users hosting PPAs on Launchpad do not require their server
    to distribute packages, while other repositories need a server to do the same.


    Open a terminal window and run the given command to add the new repository


    ```

    $ sudo add-apt-repository -y PPA:linuxuprising/shutter

    ```


    There is no need to use apt update anymore because starting Ubuntu 18.04, the
    repositories are updated automatically.


    Now you can use the apt command to install Shutter


    ```

    $ sudo apt install shutter

    ```


    Removing Shutter installed via PPA


    To remove Shutter from your system, execute the following code


    ```

    $ sudo apt remove shutter

    ```'
