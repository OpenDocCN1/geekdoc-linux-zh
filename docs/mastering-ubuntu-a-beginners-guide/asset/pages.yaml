    # PWD COMMAND


    PWD stands for Print Working Directory. It refers to the current directory in
    which you are operating your terminal is open. To check PWD, run the PWD keyword
    in your terminal and hit enter; the command of PWD is written below along with
    the result of that command. PWD command has two flags:


    +   - **pwd -L**: Prints the symbolic path


    +   - **pwd -P**: Prints the actual path


    The default behavior of /bin/PWD is the same as pwd -P.

    The default behavior of Built-in pwd is the same as pwd -L.

    PWD command is a built-in shell command and is available on most of the shell
    — bash, Bourne shell, ksh, zsh, etc.

    The basic syntax of PWD:


    ```

    $ PWD [OPTION]

    ```


    Various options used with pwd


    +   - **L (logical)**: Uses PWD from the environment, even if it contains symbolic
    links.


    +   - **P (physical)**: It avoids all symbolic links.


    +   - **help**: It displays this help and exit.


    +   - **version**: It outputs version information and exit.


    ```

    jaskiran@jaskiran-VirtualBox:~$ pwd

    /home/Jaskiran

    ```'
