  md: 'There are three types of an update to the APT database:


    +   1. **Hit**: It means there has been no change to the package since the last
    check.


    +   2. **Ign**: It means the package has been ignored because it is so recent
    that there is no need to check it or because there is a slight error.


    +   3. **Get**: It means a package update is available, and APT will now download
    the details for any update, but not the update itself.


    Once you update your database, you can use APT to update the packages on your
    system and update applications and the Ubuntu core system to the latest versions
    available:


    ```

    sudo apt-get upgrade

    ```


    # UPGRADE A SPECIFIC PACKAGE


