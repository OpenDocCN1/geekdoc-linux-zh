    Then, after years of using a keyboard to the command line, the mouse was invented.
    The mouse marked the point-and-click method as a new way to interact with any
    system. This strategy is safer for users, them from the risk of CLI. However,
    we will discuss why using CLI is preferable later. Apart from that, operating
    systems began to create a more appealing style of computing, employing graphical
    user interaction (GUI), which was a wonderful approach of using buttons and menus
