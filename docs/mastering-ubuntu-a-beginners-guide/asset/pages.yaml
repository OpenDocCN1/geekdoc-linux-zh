  md: '# BRAVE APPLICATION


    It is a free and open-source web browser based on Chromium that blocks ads and
    trackers so that you can browse any content fast and safely. It does is that it
    pays to websites and YouTubers on behalf of you. If you prefer contributing to
    websites and YouTube rather than seeing advertisements, this browser is for you.
    It features a faster page loading speed and blocks ads and trackers by default.


    The browser offers an official repository. So Ubuntu, Debian, and Linux Mint-based
    systems can easily install the software and receive updates via built-in manager
    utility.


    It is a new concept and could be a good browser for those who prefer safe browsing
    without compromising essential data on the internet.


    Firstly, open "terminal" from your system from the start menu. When it opens,
    paste the command below into the terminal and hit Enter:


    ```

    $ sudo apt install apt-transport-HTTP curl

    ```


    All the necessary packages will start downloading.

    Next is to copy and paste the command, run it to download and install the GPG
    key:


    The command is given below:


    ```

    sudo curl -fSLO /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg

    ```


    And run the command to add the apt repository to your system. So far, is for only
    64-bit PC / laptop is supported.


    ```

    echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64]
    https://brave-browser-apt-release.s3.brave.com/ stable main"|sudo tee /etc/apt/sources.list.d/brave-browser.list

    ```


    Refresh the system cache and install the web browser by running the commands as
    follows:


    ```

    $ sudo apt update

    ```


    ```

    $ sudo apt install brave-browser

    ```'
