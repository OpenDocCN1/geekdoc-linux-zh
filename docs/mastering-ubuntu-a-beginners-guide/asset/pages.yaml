  md: '# HOW TO USE THE SUDO COMMANDS


    sudo was designed as that way to grant a user administrative privileges temporarily.
    To make it work, use sudo before a restricted command. The system prompts for
    the password. Once provided, the system runs the command.


    # Syntax


    Use the following syntax to start sudo:


    ```

    $ sudo [command]

    ```


    For example:


    ```

    sudo -V |-h |-v |-k -K -s [-H] [-S] [-b] |

    [-p prompt] [-c class|-] [-a auth_type] [-r role] [-t type]

    [-u username|uid] sudo -V|-h|-l|-L|-v|-k|-K|

    s [-H] [-P] [-S] [-b]

    [-p prompt] [-c class|-] [-a auth_type] [-r role] [-t type]

    [-u username#uid] command

    ```


    When you use the sudo command, a timestamp is entered in the system logs. The
    user can quickly run commands with elevated privileges (by default, 15 minutes).


    # OPTIONS


    Sudo can use with additional options:


    +   1. -h – means help: It displays syntax and command options.


    +   2. -V – means the version: It shows the current version of the sudo application.


    +   3. -v – means validate: It refreshes the time limit on sudo without running
    a command.


    +   4. -l – means the list: It lists the user’s privileges or checks a specific
    command.


    +   5. -k – means kill: It ends the current sudo privileges.'
