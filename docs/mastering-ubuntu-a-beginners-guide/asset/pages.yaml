  md: '# Mastering Ubuntu


    Mastering Ubuntu helps the reader learn the ropes in Ubuntu for a faster and robust
    computing experience.


    Ubuntu is a free Linux OS created by the Canonical community. It is highly customizable
    and features a Software Center full of apps, in addition to being open source.


    Ubuntu is one of the most popular distributions due to its simplicity. It has
    found good traction among universities and research groups because it combines
    all of the functionality of a UNIX OS with a customized graphical user interface.


    But just because it is free doesn Ubuntu lacks the bells and whistles. It has
    every ingredient that a successful operating system should have, including desktop
    apps for a variety of purposes, as such:


    +   * Support for all the modern web browsers, including Chrome, Firefox, Edge,
    and Opera

    * Office and productivity apps

    * Video players, audio players, and multimedia apps

    * A slick and intuitive user interface

    * Regularly patched security updates and bug fixes

    * A robust and reliable development cycle


    Ubuntu is ideal for beginners and advanced users alike. Regardless of skillset,
    users can quickly get to speed with Ubuntu Linux for everyday usage. This is where
    Mastering Ubuntu comes in.


    With Mastering Ubuntu, using Ubuntu for day-to-day computing becomes a charm.
    This book will help readers undoubtedly boost their productivity.


    The Mastering Computer Science series is edited by Sufyan bin Uzair, a writer
    and educator with more than a decade of experience in the computing field.'
