    # WHAT IS SUDO?


    Sudo is a command that allows users to run programs with the security and privileges
    of another user. The default is the root user.

    This section will tell how to create a new user using the Ubuntu systems sudo
    command. You can use the user account to perform administrative commands without
    logging in to your Ubuntu server as a root user.

    Sudo stands for SuperUser DO. It is used to access restricted files and operations.
    By default, Linux restricts access to specific system parts controlling sensitive
    files from being compromised.

    The sudo command temporarily elevates privileges allowing users to complete sensitive
    tasks without logging in as the root user.


    Prerequisites


    +   - A system running Linux

    - A command line or terminal window then go to Activities>Search>Terminal.

    - A user account with root privileges'
