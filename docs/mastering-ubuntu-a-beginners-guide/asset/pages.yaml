    # The Ubuntu default desktop


    It is the Ubuntu desktop. While Canonical foundation has added a few charm elements,
    the interface you see is not exclusive to Ubuntu. It’s known as GNOME.


    # WHAT IS GNOME?


    It is a desktop environment with free operating systems that come from the GNU
    Project, which has provided the other with free software for decades.


    Ubuntu uses the kernel to make software communicate with your system, and it uses
    GNOME to provide you with an easy-to-use on-screen interface. The panel showing
    the time, the launcher that opens apps, and the overview screen showing all your
    open windows are all part of GNOME.


    When you press Activities in the upper-left corner of the desktop, the screen
    darkens and displays a new set of controls.


    +   * Open windows are arranged conveniently in the middle of the screen showing
    you what is running in the background.


