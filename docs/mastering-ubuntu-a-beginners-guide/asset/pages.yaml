  md: '# TOUCH COMMAND TO CREATE MULTIPLE FILES


    The touch command can create multiple numbers of files simultaneously.

    These files would be empty during creation.


    Syntax:


    ```

    touch File_1 File_2 File_4

    ```


    touch -a

    It is used to change access time only. To change or update the last access or
    modification times of a file touch -a command is used.


    Syntax:


    ```

    touch -a file_name

    ```


    touch -c

    It is used to check whether a file is created or not. If not created, then don''t

    create it. This command avoids creating files.


    Syntax:


    ```

    touch -c file_name

    ```


    touch -c-d

    It is used to update access and modification time.


    Syntax:


    ```

    touch -c-d filename

    ```


    touch -m

    It is used to change the modification time only. It only updates the last

    modification time.


    Syntax:


    ```

    touch -m fileName

    ```


    touch -r

    It is used to use the timestamp of another file. Here Doc2 file is updated

    with the timestamp of File_1.


    Syntax:


    ```

    touch -r second_file first_file

    ```'
