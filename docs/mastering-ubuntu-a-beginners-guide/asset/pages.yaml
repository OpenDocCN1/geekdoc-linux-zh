  md: '# DIR COMMAND


    The command dir displays directory of files and directories stored on disk. ls
    command is used in listing contents in default listing options. By default, the
    dir lists the files and folders in columns, sorted vertically, and backslash escape
    sequences represent special characters.


    When you execute the dir command and you want to see them, use -a command-line
    option. The syntax of the dir command is given below:


    ```

    $ dir [OPTION] [FILE]

    jaskiran@jaskiran-VirtualBox:~$ Desktop google-chrome-stable_current_amd64.deb
    Public Templates Documents Music snap Videos Downloads Pictures Steam

    ```


    To view all files in a directory, including hidden files, use the -a option and
    include the -l option to format output as a list.


    ```

    $ dir -a

    ```


    ```

    $ dir -al

    ```


    To view the index number of every file, use the option -i. The output below shows
    that the first column shows numbers, and numbers are called inodes.


    ```

    $ dir -il

    ```


    You can view all files sizes using the -s option, and if you need to sort the
    files according to size, use the -S option.


    You also need to use the -h option to view the files sizes in a human-readable
    format.


    ```

    $ dir -shl

    ```'
