    # TOUCH COMMAND


    The touch is a standard command used in the UNIX-Linux operating system, which
    is used to create, change and modify time-stamps of a file. Syntax:


    ```

    $ touch file_name

    ```


    There are two commands to create a file which is as follows:


    +   - **Cat**: It is a command to create the file with the content.

    - **touch**: It is a command to create a file without any content. The file made
    using the touch command is empty. The command can be used when the user doesn''t
    have data to store at the file creation time.


    ```

    jaskiran@jaskiran-VirtualBox:~/Desktop/ubuntu$ touch ubuntu.txt

    jaskiran@jaskiran-VirtualBox:~/Desktop/ubuntu$ echo ''This is my first file in
    ubuntu'' >>ubuntu.txt

    jaskiran@jaskiran-VirtualBox:~/Desktop/ubuntu$ 1 ls

    jaskiran@jaskiran-VirtualBox:~/Desktop/ubuntu$ ubuntu .txt

    ```


    In the code, we have created a file name ubuntu.txt and added some text without
    opening it. Then we use >> symbol with the file name. echo is used to print the
    text on the output screen.'
