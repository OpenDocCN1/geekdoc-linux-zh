  md: '# UBUNTU


    Ubuntu Linux is one of several variants, and it is also referred to as distributions
    of the Linux operating system and is a U.K. company named Canonical Ltd. In 1994,
    the company was founded by Mark Shuttleworth. This chapter will give you knowable
    of the Linux operating system and Ubuntu history.


    It also defines the history of Ubuntu throughout its past and looks to its future.
    If you are looking for installation, you can jump right in and get started with
    Ubuntu, and you can even miss this and proceed immediately to Chapter 2, Installing
