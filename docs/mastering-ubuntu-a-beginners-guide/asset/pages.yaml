  md: '# 112 Mastering Ubuntu


    Xfce Desktop Environment


    It is a desktop environment for the X window system for UNIX-based systems. It
    has been about for more than two decades, and it has changed a lot and was rewritten
    two times. The latest version was released in 2015.


    It has various features which we will discuss one by one.


    +   1. **Modular:** It is based on the UNIX of modularity and reusability. It
    is a modular DE, a collection of various modules rather than a single package.
    It means that you can also install an individual module of Xfce, such as its file
    manager, without the complete package.


    +   2. **Lightweight:** Xfce is lxde in terms of minimal resource usage. performs
    GNOME and KDE to a large extent. Its aim is to reduce resource usage, which many
    distros Linux lite can use. It feels to bring back the old system to the new.


    +   3. **Appearance:** Xfce might be old, but it is modern in its look and feel.
    It is used in many other Linux distributions. It gives customization to make it
    like a different DE.


    +   4. **Stability:** Xfce can be called the most stable DE. But now there is
    also a problem with that. Its updates are available once a year or more and do
    not change much. It is written with gtk+ based on C. Xfce is recently trying to
    rewrite its code to gtk3. Some components are available in gtk3, while others
    are still in the developmental stages. Gtk is open-source, and GNOME uses the
    same.


    +   5. **User-friendly:** It has a valuable panel for Windows users and has a
    dock for Mac users. Mint has Cinnamon as the main advantage over Ubuntu in getting
    windows users. The Cinnamon has bugs and is developed keep in mind, whereas Xfce
    is for all distros. Freedesktoporg publishes the desktop standards. It tries to
    follow the paths laid by those standards. These are one of the main priorities
    of Xfce development.


