  md: 'The permissions are represented as characters or -. The “—” (dash) means

    the users do not have permission.


    # CHMOD SYNTAX


    The syntax of chmod is given below:


    ```

    $ chmod {users options} {operator} {permission} {filename}

    ```


    Various operators let you specify the permissions.

    There are three different operators used in chmod command:


    +   1. +: Adds the permission.

    2. -: Removes the permission.

    3. =: Let’s specify the explicit permission.


    chmod command modifies the file’s permissions specified by filename

    the permissions by Permissions.

    Permissions define the permissions for the owner of the file (“user”),

    members of the group who owns the file (“group”), and (“others”).

    There are two methods to represent these permissions:


    +   1. Using symbols (alphanumeric characters)

    2. Octal numbers (the digits 0 through 7)


    If you are the owner of a file named my_file, and you can set its permiss-ions
    so that:


    +   * You can read, write, and execute it.

    * Members of the group can read and run it, and others can only

    read it.

    * The command does the trick:

    chmod u=rwx,g=rx,o=r myfile


    The digits 7, 5, and 4 represent the user’s, group’s, and others’ permiss-ions
    in the same order. Each digit is a combination of the 4, 2, 1, and 0

    digit numbers:'
