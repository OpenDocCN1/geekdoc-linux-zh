    \ with Existing GRUB Menus.** If another operating system and an older Linux version\
    \ are installed in other partitions, the menu is generated from an entry for the\
    \ new SUSE Linux, an entry for the other system, and all entries of the old boot\
    \ loader menu. This procedure might take some time and is only available with\
    \ GRUB.\n\n+       * **Restore MBR from Hard Disk.** The MBR saved on the hard\
