- pgno: 309
  md: 'Using virtual domains requires the definition of the virtual domain first.
    This is done by placing the virtual domain name in the first column and arbitrary
    text in the second column. This text is only used to keep the structure of the
    file and has no meaning.


    Every other line describing a recipient address of this domain contains


    +   *   First column: The recipient address.

    +   *   Second column:

    +       *   The user name of the local email user to whom the incoming email should
    be delivered.

    +           or

    +       *   A comma-separated list of all local email users to whom incoming emails
    should be delivered.


    When you specify a virtual domain, only email addresses containing this virtual
    domain are modified. Address with a subdomain or host name are not modified. You
    need to specify them as virtual domains first.


    Example:


    ![](img/63e88022bf135307e3eac051ad238b5b_309_0.png)


    # **The aliases Lookup Table**


    The /etc/aliases lookup table is used to define aliases. You cannot redirect emails
    to mailboxes on other hosts or domains.


    The following topics are described:


    +   *   Activate the Lookup Table

    +   *   The aliases Lookup Table Format'
  merge: -1
