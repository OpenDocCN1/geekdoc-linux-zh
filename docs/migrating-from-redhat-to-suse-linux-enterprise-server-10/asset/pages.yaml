    # **Figure 3-3**


    ![](img/63e88022bf135307e3eac051ad238b5b_131_0.png)


    From this dialog, you enter details of the interface to configure such as Network
    Device Type (**Ethernet**) and Configuration Name (**0**). Under **Kernel Module**,
    enter the name of the module to load. You can select the card model from a list
    of network cards.


    Some kernel modules can be configured more precisely by adding options or parameters
