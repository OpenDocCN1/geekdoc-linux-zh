- pgno: 404
  md: "# Objective 7\n\n# Migrate a Guest Domain\n\nOne advantage of virtualization\
    \ is that domains can easily be moved from one physical system to another. Under\
    \ Xen this procedure is called a **domain migration**.\n\nA domain migration is\
    \ performed by copying the current memory content. Please note the following before\
    \ migrating a domain:\n\n+   - There is no automatic way to copy the mass storage\
    \ devices of a domain to another system. You have to make sure that the file systems\
    \ (file system images or physical partitions) are available on the current and\
    \ on the new host system. This can either be done by copying the data manually\
    \ or by using a distributed file system (like NFS or SAN/NAS storage solutions).\n\
    +   \n+   - When a domain is migrated, the network settings are not automatically\
    \ adjusted. Therefore the current and the new host system have to be in the same\
    \ subnet or the network settings have to be manually adjusted after the migration.\n\
    \nYou have the following two options to migrate a Xen domain:\n\n+   - Use Domain\
    \ Save and Restore\n+   \n+   - Use Migration and Live Migration\n\n# Use Domain\
    \ Save and Restore\n\nA very simple way to migrate a domain is to use the save\
    \ and restore function of the xm tool.\n\nWith the command **xm save <domain_id>\
    \ <filename>**, you can suspend the specified domain and save the status to the\
    \ given filename.\n\nThis file can then be copied to the new host system. To restore\
    \ the domain, use the command **xm restore <filename>**."
  merge: -1
  img_proc: true
- pgno: 405
  md: 'As mentioned above, besides the file created with xm, you might also have to
    copy the file systems to the new host system.


    # Use Migration and Live Migration


    Instead of the save and restore commands of xm, you can also use the command **xm
    migrate <domain_id> <target_host>**. This command migrates a domain directly to
    a new host. In this case it’s not necessary to copy memory state files manually.


    In order to get this working, the current and new host must be running Xen and
    xend.


    By adding the option **-live** to the migration command line, the downtime during
    the migration can be reduced to typically 60-300ms. Instead of shutting down the
    domain before the migration starts, Xen attempts to keep it running while the
    migration is in progress.


    The xend configuration file **/etc/xen/xend-config.sxp** contains two options
    concerning domain migration:


    **(xend-relocation-server yes)**


    This option enables the migrating functionality in xend.


    **(xend-relocation-hosts-allow ''^(localhost)$'')**


    This option controls which hosts are allowed to connect to xend for domain migration.
    By default, only localhost is allowed to connect. The option takes regular expressions
    as parameter. Have a look at the configuration file for examples.


    > Please note, that there are two xend involved in a domain migration (current
    and new host). You might have to adjust the xend-config.sxp file on both systems.'
  merge: -1
  img_proc: true
