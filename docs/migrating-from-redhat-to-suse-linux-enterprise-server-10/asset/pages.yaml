    # Init and Runlevels


    This section provides a layout and comparison of the paths and methods that are
    different between Red Hat and SUSE boot processes and runlevels.


    The way that Red Hat and SUSE Linux Enterprise Server store and manage their daemons
    are slightly different. The main path difference is that Red Hat uses and documents
    its service and runlevel root in the `/etc/rc.d` tree, while SUSE Linux Enterprise
    Server uses the more traditional `/etc/init.d` tree.


    SUSE Linux Enterprise Server provides a symbolic link named `/etc/rc.d` that points
    to the `/etc/init.d` directory for Red Hat compatibility. You''ll find upon inspection
    that Red Hat systems include a symlink named `/etc/init.d` that really points
    to the directory `/etc/rc.d/init.d`.


    | | Red Hat Enterprise Linux | SUSE Linux Enterprise Server |

    | :--- | :--- | :--- |

    | Init files Root | `/etc/rc.d/init.d` | `/etc/init.d` |

    | Runlevel Directories | `/etc/rc.d/init.d/rcXd` | `/etc/init.d/rcXd` |

    | Service Scripts | `/etc/init.d/service start/stop` | `/etc/init.d/service start/stop`
    |

    | | `service <name> start/stop` | `rc=<name> start/stop` |

    | | `(executes /sbin/rename scripts)` | |

    | Service Commands | `chkconfig -level <name> on/off` | `chkconfig -level <name>
    on/off` |

    | | | `insserv <name>` |


