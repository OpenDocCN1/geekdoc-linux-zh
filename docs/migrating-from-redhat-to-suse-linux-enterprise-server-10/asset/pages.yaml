- pgno: 370
  md: '# ## SECTION 8  Manage Virtualization with Xen


    Virtualization is one of the hottest topics in the industry at the moment. However,
    the idea of virtualization is not new at all. Hardware platforms like IBMs pSeries
    or zSeries support virtualization since a long time and software like VMware Workstation
    for x86 based systems has been available for many years.


    Now virtualization moves to mainstream, because affordable Intel or AMD based
    x86 systems, provide enough resources to run more than one virtual machine at
    the same time.


    SUSE Linux Enterprise Server 10 is the first enterprise level Linux product that
    comes with build-in virtualization support through the Xen virtual machine monitor.
    In the following section you''ll learn how to use this powerful feature.


    # ### Objectives


    +   1. Understand the Concept of Virtualization

    +   2. Understand How Xen Works

    +   3. Install Xen

    +   4. Manage Xen Domains with YaST

    +   5. Manage Xen Domains at the Command Line

    +   6. Understand Xen Networking

    +   7. Migrate a Guest Domain'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# **Objective 1 Understand the Conecpt of Virtualization**


    Virtualization technology separates a running instance of an operating system
    from the physical hardware. Instead of a physical machine, the operating system
    runs in a so-called virtual machine. Multiple virtual machines share the resources
    of the underlying hardware.


    Virtualization allows you to run multiple virtual systems on one single physical
    machine.


    ![](img/63e88022bf135307e3eac051ad238b5b_371_0.png)


    The following are the main advantages of virtualization, in comparison with non-virtualized
    physical hardware:


    +   1.  **Efficient Hardware Utilization.** Often systems are not using the full
    potential of their hardware. By running multiple virtual machines on the same
    hardware, the resources are used more efficiently.

    +   2.  **Reduced Downtime.** Virtual machines can be easily migrated to a new
    physical host system. This reduces the downtime in case of a hardware failure.

    +   3.  **Flexible Resource Allocation.** Hardware resources can be allocated
    on demand. When the resource requirements of a virtual machine change, resource
    allocation can be adjusted or the machine can be migrated to a different physical
    host.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# **Objective 2   Understand How Xen Works**


    The idea of virtualization is not new. Platforms like IBM zSeries or pSeries offer
    built-in virtualization and Intel x86 based systems can be virtualized using third-party
    software like VMware.


    SUSE Linux Enterprise Server 10 comes with a virtualization technology called
    Xen, which allows you to run multiple virtual machines on a single piece of Intel
    x86 based hardware.


    At the moment, the operating systems that run in a Xen virtual machine need to
    be modified. Therefore only open source operating systems like Linux or BSD can
    be installed. One exception is Netware, which has been adjusted by Novell to run
    in a Xen virtual machine.


    Intel and AMD are developing extensions (Intel Vanderpool and AMD Pacifica) to
    the x86 Standard to support virtualization. Once these extensions are available,
    Xen will be able to run unmodified operating systems including Microsoft Windows.


    > You can find updated information about Xen, including an instruction how to
    run unmodified operating systems on the OpenSUSE Xen page at: [http://en.opensuse.org/Xen](http://en.opensuse.org/Xen)


    To understand how Xen works, you need to do the following:


    +   1. Understand Virtualization Methods

    +   2. Understand the Xen Architecture'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Understand Virtualization Methods


    Before we talk in detail about the Xen technology, you should understand the following
    two different virtualization methods.


    +   - **Full Virtualization.** In this case the virtualization software emulates
    a full virtual machine including all hardware resources. The operating system
    running in the virtual machine (guest OS) communicates with these resources as
    if they were physical hardware. VMware Workstation is a popular full virtualization
    software.


    ![](img/63e88022bf135307e3eac051ad238b5b_373_0.png)


    ![](img/63e88022bf135307e3eac051ad238b5b_373_1.png)'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   **Para Virtualization**. Instead of emulating a full virtual machine, para-virtualization
    software provides an Application Programming Interface (API) which is used by
    the guest OS to access hardware resources. This requires that the guest OS is
    aware that it runs in a virtual machine and needs to know how to access the API.
    Xen is a para-virtualization software.


    ![](img/63e88022bf135307e3eac051ad238b5b_374_0.png)


    Para virtualization provides better performance because it does not emulate all
    hardware details. The drawback is that the guest OS needs to be modified to run
    with para-virtualization. Full-virtualization works with an unmodified guest OS
    but generates more overhead resulting in a weaker performance.


    Another advatage of para-virtualization is the flexible resource allocation. As
    the guest OS is aware of the virtual environment, Xen can, for example, change
    the memory allocation of a virtual machine on the fly without any reboot.'
  merge: -1
  img_proc: true
- pgno: 375
  md: "# Understand the Xen Architecture\n\nXen consists of the following two major\
    \ components:\n\n+   **Virtual Machine Monitor.** The virtual machine monitor\
    \ forms a layer between physical hardware and virtual machines. In general this\
    \ kind of software is called a **Hypervisor**.\n+   \n+   **Xen tools.** The Xen\
    \ tools are a set of command line applications that are used to administer virtual\
    \ machines.\n\nThe virtual machine monitor must be loaded before any of the virtual\
    \ machines are started. When working with Xen, virtual machines are called **domains**.\n\
    \nThe Xen virtual machine monitor neither includes any drivers to access the physical\
    \ hardware of the host machine nor an interface to communicate directly with an\
    \ administrator. These tasks are performed by an operating system running in the\
    \ privileged **domain0**.\n\nThe following is an overview of a Xen system with\
    \ three domains.\n\n![](img/63e88022bf135307e3eac051ad238b5b_375_0.png)"
  merge: -1
  img_proc: true
- pgno: 376
  md: 'A process called **xend** runs in the domain0 Linux installation. This process
    is used to manage all Xen domains running on a system and to provide access to
    their consoles.


    An unprivileged domain is also called domainU in the Xen terminology.


    SUSE Linux Enterprise Server 10 can be used for privileged (domain0) and unprivileged
    (domainU) Xen domains.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# ### Objective 3 Install Xen


    To set up a Xen system, you start from a normal SUSE Linux Enterprise 10 installation,
    which is going to run in domain0.


    The other Xen domains can later be installed in physical partitions or file system
    images. When you plan to use physical partitions, you have to make sure that the
    initial SUSE Linux Enterprise Server 10 installation is not using all of the available
    disc space.


    For maximum flexibility it makes sense to use the logical volume manager LVM or
    EVMS for a Xen system.


    The following packages have to be installed in the initial SUSE Linux Enterprise
    Server 10 installation:


    +   * **xen**. This package contains the Xen virtual machine monitor (Hypervisor).

    +   * **xen-tools**. Contains xend and a collection of command line tools to administer
    a Xen system.

    +   * **kernel-xen**. This package contains a modified Linux kernel that runs
    in a Xen domain.

    +   * **xen-doc-\*** (optional). Xen documentation in various formats.


    The installation of the Xen package automatically adds an entry like the following
    into the boot loader configuration file **/boot/grub/menu.lst**.


    ```

    ```

    title Xen

    root (hd0,3)

    kernel /boot/xen.gz

    module /boot/vmlinuz-Xen root=/dev/hda3 selinux=0

    module /boot/initrd-Xen

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 378
  md: "![](img/63e88022bf135307e3eac051ad238b5b_378_0.png)\n\nOn some Xen systems\
    \ you might see the parameter **dom0_mem** in the kernel module line. This parameter\
    \ assigns a certain amount of initial main memory to domain0 at boot time. However\
    \ in Xen version 3, this parameter is not required anymore.\n\nInitially all available\
    \ memory is used by domain0. When you start additional domainUs, the required\
    \ amount of memory is reduced in domain0 and used for the new domainU.\n\nThe\
    \ entry in menu.lst adds a new option to the boot menu of your system. When selecting\
    \ this entry, the Xen virtual machine monitor is loaded (**kernel/boot/xen.gz**)\
    \ which starts SUSE Linux Enterprise Server 10 in domain0 (see the lines starting\
    \ with **module**).\n\nBefore rebooting your system with the Xen option, you should\
    \ check if the automatically generated entry is correct. Make sure that ...\n\n\
    +   - ... the line **root (hd0,3)** points to the file system which contains the\
    \ Xen Virtual Machine Monitor and the Kernel of the Linux installation for domain0.\
    \ In our example **hd0,3** means the fourth partition on the first hard drive\
    \ in the system. Also check if the parameter **root** in the first module line\
    \ points to the root partition of the domain0 installation.\n+   \n+   - ... the\
    \ Xen version of the Linux kernel and the initrd are loaded in the module line.\
    \ The names of the image files should end in **-xen**.\n\nAfter checking the boot\
    \ loader configuration file, you can reboot your system and select the Xen option\
    \ at the boot loader menu. In the early stages of the boot process, you will see\
    \ some messages of the Xen virtual machine monitor on the screen. Then the domain0\
    \ Linux installation is started.\n\nIn case the system is not booting properly,\
    \ you can switch back to a non-virtualized system by selecting the regular SUSE\
    \ Linux Enterprise Server 10 boot option."
  merge: -1
  img_proc: true
- pgno: 379
  md: "When running Xen, the network setup is done by the xend management process.\
    \ This can interfere with the native network configuration scripts of the domains.\
    \ Especially SuSEfirewall2 is known to cause problems. It is therefore recommended\
    \ to stop SuSEfirewall2 with `rcSuSEfirewall2` and to remove the firewall scripts\
    \ from the init process:\n\n```\n`insserv -r SuSEfirewall2_setup`  \n`insserv\
    \ -r SuSEfirewall2_init`  \n`insserv -r SuSEfirewall2_final (conditional)`\n```"
  merge: -1
  img_proc: true
