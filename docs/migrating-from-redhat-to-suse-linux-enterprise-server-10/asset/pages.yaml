- pgno: 244
  md: '# Objective 3


    # ## Manage Runlevels


    Managing runlevels is an essential part of Linux system administration. In this
    objective, you learn what runlevels are, the role of the program init, and how
    to configure and change runlevels:


    +   - The init Program and Linux Runlevels

    +   - init Scripts and Runlevel Directories

    +   - Change the Runlevel

    +   - Compare Start Scripts between RHEL and SLES 10


    # ### The init Program and Linux Runlevels


    +   - The init Program

    +   - The Runlevels

    +   - init Configuration File (/etc/inittab)


    # #### The init Program


    The system is initialized by **sbin/init**, which is started by the kernel as
    the first process of the system.


    This process, or one of its child processes, starts all additional processes.
    In addition, because **init** is the last process running, it ensures that all
    other processes are correctly ended. This means that init controls the entire
    booting up and shutting down of the system.


    Because of this position of priority, signal 9 (SIGKILL), with which all processes
    can normally be ended, has no effect on init.


    The main configuration file of init is /etc/inittab. Various scripts are started
    by init, depending on entries in this file. All these scripts are located in the
    directory /etc/init.d/.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Part of the configuration in /etc/inittab is the runlevel the system uses after
    booting.


    # The Runlevels


    In Linux, various runlevels define the state of the system. The following are
    the available runlevels:


    Table 5-1


    | Command | Description |

    | --- | --- |

    | 0 | Halt |

    | S | Used to boot into single-user mode (US keyboard layout) |

    | 1 | Single-user mode |

    | 2 | Multiuser mode without network server services |

    | 3 | Multiuser mode with network |

    | 4 | Not used |

    | 5 | Multiuser mode with network and display manager |

    | 6 | Reboot |


    The command **runlevel** displays the runlevel you are currently in (second number)
    and the previous runlevel (first number), as in the following:


    ```

    ```sh

    da10:~ # runlevel

    N 5

    da10:~ # ```

    ```'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# **init Configuration File (/etc/inittab)**


    To understand the contents of the file /etc/inittab, you need to know the following:


    +   - initab Syntax

    +   - initab Standard Entries


    # **inittab Syntax**


    The following is the syntax of each line in the file /etc/inittab:


    ```

    *id*:*rl*:*action*:*process*

    ```


    The following describes the parameters:


    +   - *id*. A unique name for the entry in /etc/inittab. It can be up to four
    characters long.

    +   - *rl*. Refers to one or more runlevels in which this entry should be evaluated.

    +   - *action*. Describes what init is to do.

    +   - *process*. Is the process connected to this entry.


    # **inittab Standard Entries**


    The first entry in the file /etc/inittab contains the following parameters:


    ```

    id:5:initdefault:

    ```


    The parameter initdefault signals to the init process which level it should bring
    the system to. The standard default runlevel is normally 3 or 5.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The next entry in `/etc/inittab` looks like this:


    ```

    si::bootwait:/etc/init.d/boot

    ```


    The parameter **bootwait** indicates to carry out this command while booting and
    wait until it has finished.


    The next few entries describe the actions for runlevels 0 to 6:


    ```

    10:0:wait:/etc/init.d/rc 0

    11:1:wait:/etc/init.d/rc 1

    12:2:wait:/etc/init.d/rc 2

    13:3:wait:/etc/init.d/rc 3

    #14:4:wait:/etc/init.d/rc 4

    15:5:wait:/etc/init.d/rc 5

    16:6:wait:/etc/init.d/rc 6


    1s:S:wait:/etc/init.d/rc S

    ---:S:respawn:/sbin/sulogin

    ```


    The parameter **wait** means that when the system changes to the indicated level,
    the appropriate command is carried out and init waits until it has been completed.
    The parameter also means that further entries for the level are only performed
    after this process is completed.


    The single user mode S is a special case, as it works even if the file `/etc/inittab`
    is missing. In such a case, enter **S** at the boot prompt when the computer starts.
    The command sulogin is started, which allows only the system administrator to
    log in. The parameter **respawn** indicates to init to wait for the end of the
    process and to then restart it.


    `/etc/inittab` also defines the Ctrl+Alt+Del key combination for restarting:


    ```

    ca::ctrlaltdel:/sbin/shutdown -r -t 4 now

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The action ctrlatdel is carried out by the init process only if these keys
    are pressed. If you do not want to allow this action, comment out (#) or remove
    the line.


    The final large block of entries describes in which runlevels getty processes
    (login processes) are started:


    ```

    1:2345:respawn:/sbin/mingetty --noclear tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6

    ```


    The getty processes provide the login prompt and in return expect a user name
    as input. They are started in runlevels 2, 3, and 5.


    > Runlevel 4 in the above example is ignored because the line that defines the
    actions for the runlevel is commented out earlier in the file: (#4:4:wait:/etc/init.d/rc
    4).


    If a session ends, the processes are started again by init. If a line is disabled
    here, no further login is possible at the corresponding virtual console.


    > You should take great care when making changes to the file /etc/inittab. If
    the file is corrupted, the system will no longer boot correctly.


    If an error does occur, first try entering S at the kernel command line in the
    GRUB boot menu. If this does not work, it is still possible to boot the system.
    Enter init=/bin/bash at the kernel command line in the GRUB boot menu.


    In this way, the init process is replaced by a shell (so inittab is not read)
    and you can then repair the system manually.


    When you changed /etc/inittab, use init q to have init reload its configuration.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# **init Scripts and Runlevel Directories**


    /etc/inittab defines the runlevel the system uses after booting is complete. The
    services that need to be started in a certain runlevel are not defined in /etc/inittab
    itself. These are configured by symbolic links in directories /etc/init.d/rcx.d/
    which point to scripts in /etc/init.d/. To be able to manage runlevels, you need
    to understand the following:


    +   - init Scripts

    +     - Runlevel Symbolic Links

    +   - How init Determines which Services to Start and Stop

    +   - Activate and Deactivate Services for a Runlevel

    +   - Activate and Deactivate Services for a Runlevel with YaST'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# # init Scripts


    The directory /etc/init.d/ contains shell scripts that are used to perform certain
    tasks at boot up and start and stop services in the running system. The following
    shows some of the files in /etc/init.d/.


    ```

    ```

    halo:~ # ls -al /etc/init.d/

    total 635

    drwxr-x--- 11 root root   3336 May 24 13:40 .

    drwxr-x---  77 root root   6712 May 25 13:19 ..

    -rw-r-----  1 root root   1393 May 24 13:40 .depend.boot

    -rw-r-----  1 root root   3465 May 24 13:40 .depend.start

    -rw-r-----  1 root root   3002 May 24 13:40 .depend.stop

    -rw-r-----  1 root root     482 Aug  25  2004 Makefile

    -rw-r-----  1 root root    7827 May 10 18:17 README

    -rwxr-xr-x  1 root root    1257 May  8 20:09 SuSEfirewall2_init

    -rwxr-xr-x  1 root root    1650 May  8 20:09 SuSEfirewall2_setup

    -rwxr-xr-x  1 root root    2696 May  8 20:29 aacagentd

    -rwxr-x---  1 root root     5729 May  8 20:15 acpid

    -rwxr-xr-x  1 root root    5265 May  8 21:01 alsaasound

    -rwxr-xr-x  1 root root    3689 May  9 14:49 atd

    -rwxr-xr-x  1 root root    6691 May  9 15:03 audtd

    -rwxr-xr-x  1 root root    9234 May  9 15:01 autofs

    -rwxr-xr-x  1 root root    2967 Mar 14 13:40 autovast

    -rwxr-xr-x  1 root root     7072 Apr 20 15:02 boot

    -rwxr-xr-x  1 root root    2792 May  8 20:29 boot.apparmor

    ...

    ```

    ```


    The files .depend.\[boot,start,stop\] are created by insserv and contain dependencies
    that are used to determine the proper sequence for starting services when RUN_PARALLELL
    in /etc/sysconfig/boot is set to yes.


    The shell scripts can be called up in the following ways:


    +   - Directly by init when you boot the system, when the system is shut down,
    or when you stop the system with Ctrl+Alt+Del. Examples for these scripts are
    /etc/init.d/boot or /etc/init.d/rc.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   Indirectly by init when you change the runlevel. In this case, it is the
    script /etc/init.d/rc that calls the necessary scripts in the correct order and
    with the correct parameter during the runlevel change.


    +   Directly by /etc/init.d/script parameter.


    You can also enter rcs* script parameter* if corresponding links are set in /sbin/
    or /usr/sbin/.


    The following parameters may be used:


    Table 5-2

    | Parameter | Description |

    |-----------|-------------|

    | start | Starts a service that is not running. |

    | restart | Stops a running service and restarts it. |

    | stop | Stops a running service. |

    | reload | Rereads the configuration of the service without stopping and restarting
    the service itself. |

    | force-reload | Reloads the configuration if the service supports this. Otherwise,
    it does the same thing as restart. |

    | status | Displays the current status of the service. |


    When a script is called without parameters, a message informs you about the possible
    parameters.


    Some of the more important scripts stored in /etc/init.d/ are:


    +   boot. This script is started directly by init when the system starts. It is
    run once and once only. It evaluates the directory /etc/init.d/boot.d/ and starts
    all the scripts linked by filenames with an “S” at the beginning of their names
    (see “Runlevel Symbolic Links” on page 5-31).


    These scripts perform, for instance, the following tasks:


    +   Check the file systems'
  merge: -1
  img_proc: true
- pgno: 252
  md: "+   - Set up of LVM\n+   \n+   - Delete unnecessary files in /var/lock/\n+\
    \   \n+   - Set the system time\n+   \n+   - Configure PnP hardware with the isapnp\
    \ tools\n\n**boot.local**. This script includes additional commands to execute\
    \ at boot before changing into a runlevel. You can add your own system extensions\
    \ to this script.\n\n**halt**. This script is run if runlevel 0 or 6 is entered.\
    \ It is called up either with the command halt (the system is completely shut\
    \ down) or with the command reboot (the system is shut down and then rebooted).\n\
    \n**rc**. This script is responsible for the correct change from one runlevel\
    \ to another. It runs the stop scripts for the current runlevel, and then it runs\
    \ the start scripts for the new one.\n\n**service**. Each service (like cron,\
    \ apache2, cups) comes with a script allowing you to start and stop the service,\
    \ to reload its configuration, or to view its status. To create your own scripts,\
    \ you can use the file /etc/init.d/skeleton as a template.\n\n# Runlevel Symbolic\
    \ Links\n\nTo enter a certain runlevel, init calls the script /etc/init.d/rc with\
    \ the runlevel as parameter. This script examines the respective runlevel directory\
    \ /etc/init.d/rc*.d/ and starts and stops services depending on the links in this\
    \ directory.\n\nFor each runlevel, there is a corresponding subdirectory in /etc/init.d/.\
    \ For runlevel 1 it is /etc/init.d/rc1.d/, for runlevel 2 it is /etc/init.d/rc2.d/,\
    \ and so on."
  merge: -1
  img_proc: true
- pgno: 253
  md: 'When you view the files in a directory such as /etc/init.d/rc3.d/, you see
    two kinds of files—those that start with a “K” and those that start with an “S”:


    ```

    gal0:~ # ls /etc/init.d/rc3.d/

    K10cron K1network S07auditd

    K10smbfs K2haldaemon S07portmap

    K1nscd K21acpid S07splash_early

    K1postfix K21dbus S08 nfs

    K12alsasound K21fbset S08nfsboot

    K12boot.apparmor K21irq_balancer S10alsasound

    K12 cups K21random S10boot.apparmor

    K12microcode K21resmgr S10cups

    K12powersaved S01acpid S10kbd

    K12splash S01dbus S10microcode

    K12shd S01fbset S10powersaved

    K14 nfs S01irq_balancer S10splash

    K14nfsboot S01random S10sshd

    K15auditd S01resmgr S11ncsd

    K15portmap S02haldaemon S11postfix

    K15splash_early S05network S12cron

    K6novell-zmd S06novell-zmd S12smbfs

    K16s1pd S06s1pd

    K16syslog S06syslog

    ```


    The first letter is always followed by 2 digits and the name of a service. Whether
    a service is started in a specific runlevel depends on whether there are **S**\*\*\*service
    and **K**\*\*\*service files in the /etc/init.d/rc\*.d/ directory.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Entering `ls -l` in an `/etc/init.d/rcX.d/` directory indicates that these
    files are actually symbolic links pointing to service scripts in `/etc/init.d/`
    (as in the following):


    ```

    dallo:~ # ls -l /etc/init.d/rc3.d/

    total 0

    lrwxrwxrwx 1 root root  7 May 15 10:32 K10cron   -> ../cron

    lrwxrwxrwx 1 root root  8 May 15 10:48 K10mbfs -> ../mbfs

    lrwxrwxrwx 1 root root  7 May 15 10:32 K1nscd  -> ../nscd

    lrwxrwxrwx 1 root root 10 May 15 10:32 K1postfix -> ../postfix

    lrwxrwxrwx 1 root root 12 May 15 10:26 K12alsaasound -> ../alsaasound

    ...

    lrwxrwxrwx 1 root root  7 May 15 10:31 S10sshd -> ../sshd

    lrwxrwxrwx 1 root root  7 May 15 10:32 S1nscd  -> ../nscd

    lrwxrwxrwx 1 root root 10 May 15 10:32 S11postfix -> ../postfix

    lrwxrwxrwx 1 root root  7 May 15 10:32 S12cron -> ../cron

    lrwxrwxrwx 1 root root  8 May 15 10:48 S12mbfs -> ../mbfs

    ```


    By using symbolic links in subdirectories only the version in `/etc/init.d/` needs
    to be modified in case of necessary changes to the script.


    Usually, two links within a runlevel directory point to the same script. For example,
    if you enter **ls -l \*network** in the `/etc/init.d/rc3.d/` directory, you see
    that two network links both point to the script `/etc/init.d/network`:


    ```

    dallo:~ # ls -l /etc/init.d/rc3.d/\*network

    lrwxrwxrwx 1 root root 10 May 15 10:23 /etc/init.d/rc3.d/K17network -> ../network

    lrwxrwxrwx 1 root root 10 May 15 10:23 /etc/init.d/rc3.d/S05network -> ../network

    ```


    > Sometimes **K/x** links are referred to as _kill scripts_, while **S/x** links
    are referred to as _start scripts_. In fact, there are separate scripts for starting
    and stopping services, but the script is either called with the parameter `stop`
    or with the parameter `start`.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# How init Determines which Services to Start and Stop


    You already know that a service is started with the parameter start, and stopped
    with the parameter stop. The same parameters are also used when changing from
    one runlevel to another.


    When the runlevel is changed, init calls the script rc with the new runlevel as
    parameter, like /etc/init.d/rc 3. The script /etc/init.d/rc examines the directories
    /etc/init.d/currrent rl .d and /etc/init.d/rcnewrl.d/ and determines what to do.


    Let’s say we change from our current runlevel 5 to the new runlevel 3. There are
    three possibilities:


    +   *   There is a Kxx link for a certain service in /etc/init.d/rc5.d/ and there
    is an Sxx link in /etc/init.d/rc3.d/ for the same service.

    +       In this case, the service is neither started nor stopped; the corresponding
    script in /etc/init.d/ is not called at all.

    +   *   There is a Kxx link for a certain service in /etc/init.d/rc5.d/ and there
    is no corresponding Sxx link in /etc/init.d/rc3.d/.

    +       In this case, the script in /etc/init.d/service is called with the parameter
    stop and the service is stopped.

    +   *   There is an Sxx link in /etc/init.d/rc3.d/ and there is no corresponding
    Kxx link for the service in /etc/init.d/rc5.d/.

    +       In this case, the script in /etc/init.d/service is called with the parameter
    start and the service is started.


    The number after the K or S determines the sequence in which the scripts are called.


    Therefore script K10cron is called before script K20haldaemon, which means that
    cron is shut down before haldaemon.


    Script S05network is called before S11postfix, which means that the service network
    starts before postfix. This is important if postfix depends on a running service
    network.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'For example the following happens when you change from runlevel 3 to runlevel
    5:


    +   1. You tell `init` to change to a different runlevel by entering (as root)
    `init 5`.

    +   2. `init` checks its configuration file (`/etc/inittab`) and determines it
    should start `/etc/init.d/rc` with the new runlevel (`5`) as a parameter.

    +   3. `rc` calls the stop scripts (`Kxx`) of the current runlevel for those services
    for which there is no start script (`Sxx`) in the new runlevel.

    +   4. The start scripts in the new runlevel for those services for which there
    was no kill script in the old runlevel are launched.


    When changing to the same runlevel as the current runlevel, `init` only checks
    `/etc/inittab` for changes and starts the appropriate steps (such as starting
    a `getty` on another interface).


    # Activate and Deactivate Services for a Runlevel


    Services are activated or deactivated in a runlevel by adding or removing the
    respective `K*`*`*service and `S*`*`*service links in the runlevel directories
    `/etc/init.d`/`rc.d`.


    Although you could create symbolic links in the runlevel subdirectories yourself
    to modify services, an easier way is to edit the header of a script and then call
    `inserv`.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'The INIT INFO block at the beginning of the script for a service describes
    in which runlevel the service should start or stop and what services should run
    as a prerequisite:


    ```

    ### BEGIN INIT INFO

    # Provides:     syslog

    # Required-Start: network

    # Should-Start:   earlysyslog

    # Required-Stop:  network

    # Default-Start:  2 3 5

    # Default-Stop:

    # Description:    Start the system logging daemons

    ### END INIT INFO

    ```


    The INIT INFO block is used by the program insserv to determine in which runlevel
    subdirectories links need to be placed and what numbers need to be put after K
    and S.


    > For details on the program insserv, enter man 8 insserv.


    The entry Default-Start determines in which runlevel directories links are to
    be placed. The entry Required-Start determines which services have to be started
    before the one being considered.


    After editing the INIT INFO block, enter insserv -d service (default) to create
    the needed links and renumber the existing ones as needed.


    To remove all links for a service (disabling the service), stop the service (if
    it is running) by entering /etc/init.d/service stop, and then enter insserv -r
    service (remove).


    Within the INIT INFO block, the use of certain variables is possible. These are
    explained and defined in /etc/insserv.conf.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'A tool with similar functionality is **chkconfig**. It can be used to disable
    or enable services and also to list which services are enabled in which runlevel.
    The following gives a brief overview on how to use chkconfig:


    ```

    dal0:~ # chkconfig cron

    cron on

    dal0:~ # chkconfig cron -l

    cron          0:off 1:off 2:on 3:on 4:off 5:on 6:off

    dal0:~ # chkconfig cron off

    dal0:~ # chkconfig cron -l

    cron          0:off 1:off 2:off 3:off 4:off 5:off 6:off

    dal0:~ # chkconfig cron on

    dal0:~ # chkconfig -l

    Makefile      0:off 1:off 2:off 3:off 4:off 5:off 6:off

    SUSEfirewall2_init  0:off 1:off 2:off 3:off 4:off 5:off 6:off

    SUSEfirewall2_setup 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    aeeventd    0:off 1:off 2:off 3:off 4:off 5:off 6:off

    acpid       0:off 1:off 2:on 3:on 4:off 5:on 6:off

    alsasound   0:off 1:off 2:on 3:on 4:off 5:on 6:off

    atd         0:off 1:off 2:off 3:off 4:off 5:off 6:off

    auditd      0:off 1:off 2:on 3:on 4:off 5:on 6:off

    ...

    ```


    You can also use the YaST runlevel editor to set these links. We recommend that
    you either use inserv/chkconfig or YaST. Switching between methods can lead to
    errors.


    # **Activate and Deactivate Services for a Runlevel with YaST**


    To configure runlevels with YaST, start the YaST Runlevel Editor module by starting
    YaST and then selecting System > System Services (Runlevel), or open a terminal
    window and as root enter **yast2 runlevel**.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The following appears:


    # Figure 5-6


    ![](img/63e88022bf135307e3eac051ad238b5b_259_0.png)


    From this dialog, you can select from the following modes:


    +   *   **Simple Mode.** This mode displays a list of all available services and
    the current status of each service.

    +       *   You can select a service, and then select **Enable** or **Disable**.

    +           *   Selecting **Enable** starts the service (and services it depends
    on) and enables them to start at system boot time. Selecting **Disable** stops
    dependent services and the service itself and disables their start at system boot
    time.

    +   *   **Expert Mode.** This mode gives you control over the runlevels in which
    a service is started or stopped and lets you change the default runlevel.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Expert Mode looks like the following:


    # **Figure 5-7**


    ![](img/63e88022bf135307e3eac051ad238b5b_260_0.png)


    In this mode, the dialog displays the current default runlevel at the top. You
    can select a new default runlevel from the drop-down menu.


    Normally, the default runlevel of a SUSE Linux system is runlevel 5 (full multiuser
    with network and graphical environment). A suitable alternative might be runlevel
    3 (full multiuser with network). Runlevel 4 is initially undefined to allow creation
    of a custom runlevel.


    Changes to the default runlevel take effect the next time you boot your computer.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'To configure a service, select a service from the list, then from the options
    below the list, select the runlevels you want associated with the service.


    The list includes the services and daemons available, indicates whether they are
    currently enabled on your system, and lists the runlevels currently assigned.


    If you want a service activated after editing the runlevels, from the drop-down
    list select Start now, Stop now, or Refresh status.


    You can use Refresh status to check the current status (if this has not been done
    automatically).


    From the Set/Reset drop-down list, select one of the following:


    +   *   **Enable the service**: activates the service in the standard runlevels.

    +   *   **Disable the service**: deactivates the service.

    +   *   **Enable all services**: Activates all services in their standard runlevels.


    When you finish configuring the runlevels, save the configuration by selecting
    Finish.


    Remember that faulty runlevel settings can make a system unusable. Before applying
    your changes, make absolutely sure you know the impact of the changes.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Change the Runlevel


    When starting the system, you can choose a runlevel different from the default
    runlevel defined in /etc/inittab. The runlevel can also be changed in the running
    system.


    To change the runlevel, you need to understand:


    +   Change the Runlevel at Boot


    +   Manage Runlevels from the Command Line


    # Change the Runlevel at Boot


    The standard runlevel is 3 or 5, as defined in the file /etc/inittab by the entry
    initdefault. However, it is also possible to boot to another runlevel by specifying
    the runlevel on the kernel command line of GRUB.


    Any parameters that are not evaluated by the kernel itself are passed to init
    as parameters by the kernel. The desired runlevel is simply appended to the boot
    options already specified in GRUB (in the file /boot/grub/menu.lst), as in the
    following example:


    ```

    root=/dev/hda1 vga=0x317 resume=/dev/hda2 splash=silent showopts 1

    ```


    As root partition /dev/hda1 is transmitted to the kernel, various parameters including
    the framebuffer are set, and the system boots to runlevel 1 (single user mode
    for administration).


    # Manage Runlevels from the Command Line


    You can change to another runlevel once the system is running by using the command
    **init**. For example, you can change to runlevel 1 from a command line by entering
    **init 1**.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'In the same way, you can change back to the standard runlevel where all programs
    needed for operation are run and where individual users can log in to the system.


    For example, you can return to a full GUI desktop and network interface (runlevel
    5) by entering **init 5**.


    ![](img/63e88022bf135307e3eac051ad238b5b_263_0.png)


    > If the partition */usr* of a system is mounted through NFS, you should not use
    runlevel 2 because NFS file systems are not available in this runlevel.


    Like most modern operating systems, Linux reacts sensitively to being switched
    off without warning. If this happens, the file systems need to be checked and
    corrected before the system can be used again.


    For this reason, the system should always be shut down properly. With the appropriate
    hardware, Linux can also switch off the machine as the last stage of shutting
    down.


    You stop the system by entering **init 0**; you restart the system by entering
    **init 6**. The commands **halt** and **poweroff** are equivalent to init 0; the
    command **reboot** is equivalent to init 6.


    The command **shutdown** shuts down the system after the specified time (**+m**:
    minutes from now; **hh:mm**: time in hours:minutes, when Linux should shut down;
    **now**: system is stopped immediately). The option **-h** causes a system halt,
    if you use the option **-r** instead the system is rebooted. Without options,
    it changes to runlevel 1 (single user mode).


    The command **shutdown** controls the shutdown of the system in a special way,
    compared with the other stop commands. The command informs all users that the
    system will be shut down and does not allow other users to log in before it shuts
    down.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The command shutdown can also be supplied with a warning message, such as the
    following:


    ```

    shutdown +5 "The new hard drive has arrived"

    ```


    If a shutdown planned for a later time should not be carried out after all, you
    can revoke the shutdown by entering **shutdown -c**.


