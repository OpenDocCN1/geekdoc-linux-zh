- pgno: 497
  md: '# Figure C-5


    # OVERVIEW


    This white paper assists IT administrators who have to replace their Red Hat®
    Enterprise Linux servers with SUSE™ Linux Enterprise Server. Distributed by Novell®,
    SUSE Linux Enterprise Server empowers businesses to leverage IT and open source
    by delivering a scalable, high-performance foundation for secure enterprise computing.
    This white paper covers the technical needs for integrating SUSE Linux Enterprise
    Server into an existing IT environment, with particular emphasis on replacing
    legacy Red Hat Linux systems with SUSE Linux Enterprise Server systems.


    Both the Red Hat and the SUSE Linux distributions are similar in focus and scope.
    However, enough differences exist to make any integrations or migrations frustrating
    unless a mapping is successfully made so that system administrators know where
    both distributions store the same configuration file or how they perform the same
    task.


    # AUDIENCE


    This white paper targets the professional system administrators who are currently
    running Red Hat 5.x-9.x or Red Hat Enterprise Linux Version 3 and beyond. The
    format is designed to help Red Hat system administrators find the corresponding
    SUSE Linux Enterprise Server topic and provide a side-by-side comparison and set
    of steps for configuring the SUSE Linux Enterprise Server system.


    # RED HAT ENTERPRISE LINUX


    Red Hat Enterprise Linux 4 is a family of Linux server and desktop operating systems.
    Delivered to market in early 2005, Red Hat Enterprise Linux 4 adapts the latest
    Linux kernel 2.6 technology and its benefits: better performance, scalability,
    security and hardware support.


    When purchasing Red Hat Enterprise Linux 4, customers gain access to Red Hat Network,
    a subscription-service bundle that keeps software up to date and provides access
    to Red Hat technical support. The Red Hat Enterprise Linux 4 product family includes
    the AS version for advanced servers, the ES version for mid-range servers and
    the WS version for desktop users.


    Red Hat offers clustering software separately, and the company plans to offer
    new directory server and Java™ 2 Enterprise (J2EE™) application server. For more
    information, visit: www.redhat.com


    # NOVELL ENTERPRISE LINUX


    Novell offers enterprise Linux servers and desktops based on the latest kernel
    2.6. Shipping since August 2004, SUSE LINUX Enterprise Server 9 supports native
    kernel 2.6 features and is ideal for application hosting, high-performance computing
    and Web-infrastructure workloads.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# Figure C-6


    ![](img/63e88022bf135307e3eac051ad238b5b_498_0.png)


    # TOPICS COVERED


    The remainder of this white paper covers the technical differences between Red
    Hat Enterprise Linux and SUSE Linux Enterprise Server, including:


    +   Installation

    +   Boot processes and run levels

    +   Services and daemons

    +   User management and environment

    +   System administration

    +   Service and support packs vs. Red Hat updates

    +   File-system hierarchy

    +   Documentation and help resources


    # INSTALLATION


    While both Red Hat Enterprise Linux 4 and SUSE Linux Enterprise Server 9 feature
    GUI and text-based manual installation methods and automated installation methods,
    they take somewhat different approaches. Red Hat Enterprise Linux uses the Anaconda
    program to guide the installation; SUSE Linux Enterprise Server uses YaST. Both
    employ various sub-modules for tasks such as partitioning and configuring X.


    Additionally, both include methods for installing systems in completely hands-off
    mode; Red Hat’s is called Kickstart, and Novell offers AutoYAST. The concept of
    an access-the-network or automated installation is not new to the system administrator’s
    world, and although the systems take a slightly different approach, they both
    need the installation sources (packages and files), an answer file to provide
    the configuration for the target installation and the various methods of getting
    the target machine booted and in contact with the required resources.


    # Overview of Automated installations


    In the sections that follow, we compare tasks in the two installations: Red Hat
    Enterprise Linux on the left and SUSE Linux Enterprise Server on the right. In
    cases of disparate tasks, linkage is provided.


    **Note:** When comparing the two systems, Red Hat’s Kickstart can appear simpler
    due to the number of steps that an action takes, but AutoYAST makes up for a slightly
    more complex setup with its plethora of options and extreme flexibility.'
  merge: -1
  img_proc: true
