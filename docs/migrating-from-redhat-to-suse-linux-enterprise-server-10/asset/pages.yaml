- pgno: 37
  md: '# Use the YaST Expert Partitioner


    When you start the YaST Expert Partitioner, the following appears:


    ![](img/63e88022bf135307e3eac051ad238b5b_37_0.png)


    In the top part of the dialog, YaST lists details of the current partition setup.
    Depending on your previous choice, the list contains the partitioning proposal
    created by YaST or the current physical disk setup.


    The buttons in the lower part of the dialog are used to create, edit, delete,
    and resize partitions, as well as to administer LVM (Logical Volume Manager),
    EVMS (Enterprise Volume Management System), RAID (Redundant Array of Independent
    Disks).


    > The changes made with the YaST Expert Partitioner are not written to disk until
    the installation process is started. You can always discard your changes by selecting
    **Back** or you can restart the Expert Partitioner to make more changes.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The following entries are displayed for every hard disk in your system:


    +   One entry for the hard disk itself, which has the corresponding device name
    in the Device column (such as /dev/sda).


    +   One entry for every partition on the hard disk with the corresponding device
    name and the partition number in the Device column (such as /dev/sda1).


    Each entry in the list includes information in the following columns:


    +   Device. Displays the device name of the hard disk or the partition.


    +   Size. Displays the size for the hard disk or partition.


    +   F. When the character "F" is displayed in this column, the partition will
    be formatted during the installation process.


    +   Type. Displays the partition or hard disk type. Depending on the operating
    system and the architecture, partitions can have various types, like Linux native,
    Linux swap, Win95 FAT 32, NTFS, etc.


    +   Mount. Displays the mount point of a partition. For swap partitions, the keyword
    swap is used instead.


    +   Mount By. Indicates how the file system is mounted: K—Kernel Name, L—Label,
    U—UUID, I—Device ID, and P—Device Path.


    +   Start. Displays the start cylinder of a hard disk or partition. Hard disk
    entries always start with 0.


    +   End. Displays the end cylinder of a hard disk or partition.


    +   Used By. This column holds information about the system using this partition,
    like LVM-system.


    +   Label, Device ID, Device Path. These columns list the respective information.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "The buttons in the lower part of the dialog let you\n\n+   ■ Create New Partitions\n\
    +   \n+   ■ Edit Existing Partitions\n+   \n+   ■ Delete Existing Partitions\n\
    +   \n+   ■ Resize Existing Partitions\n+   \n+   ■ Perform Expert Tasks\n\nThese\
    \ administrative tasks are covered in more detail below. EVMS (http://evms.sourceforge.net/)\
    \ and Crypt File Partitions are not covered in this course.\n\n# Create New Partitions\n\
    \nCreate a new partition by selecting **Create**. A dialog with one of the following\
    \ options appears (the options you see depend on your hard disk setup):\n\n+ \
    \  ■ If you have more than one disk in your system, you are asked to select a\
    \ disk for the new partition first.\n+   \n+   ■ If you do not have an extended\
    \ partition, you are asked if you want to create a primary or an extended partition.\n\
    +   \n+   ■ If you have an extended partition, and there is space on the hard\
    \ drive outside the extended partition for additional primary partitions, you\
    \ are asked if you want to create a primary or a logical partition.\n+   \n+ \
    \  ■ If you have 3 primary partitions and an extended partition, you can only\
    \ create logical partitions.\n\nYou need enough space on your hard disk to create\
    \ a new partition. You learn later in this section how to delete existing partitions\
    \ to free used disk space."
  merge: -1
  img_proc: true
- pgno: 40
  md: "If you choose to create a primary or a logical partition, the following appears:\n\
    \n![](img/63e88022bf135307e3eac051ad238b5b_40_0.png)\n\n![](img/63e88022bf135307e3eac051ad238b5b_40_1.png)\n\
    \nThis dialog provides the following options:\n\n+   * **Format.** This lets you\
    \ choose one of the following options:\n\n+   \t* **Do not format.** Do not format\
    \ the newly created partition.  No file system will be created on this new partition.\
    \ You can select the partition type in the drop-down list.\n\n+   \t* **Format.**\
    \ Formats the new partition with the file system you select from the File System\
    \ drop-down list.  You can choose from the following file systems:\n\n+   \t\t\
    * **Ext2.** Formats the partition with the Ext2 file system.  Ext2 is an old and\
    \ proven file system, but it does not include journaling.\n\n+   \t\t* **Ext3.**\
    \ Formats the partition with the Ext3 file system.  Ext3 is the successor of Ext2\
    \ and offers a journaling feature.\n\n+   \t\t* **Reiser.** Formats the partition\
    \ with ReiserFS, a modern journaling file system. (This is the default option.)"
  merge: -1
  img_proc: true
- pgno: 41
  md: "+   - **FAT.** Formats the partition with the FAT file system. FAT is an older\
    \ file system used in DOS and Windows. You can use this option to create a data\
    \ partition which is accessible from Windows and Linux. You must not create a\
    \ root partition with this file system.\n\n+   - **XFS.** Formats the partition\
    \ with XFS, a journaling file system originally developed by SGI.\n\n+   - **Swap.**\
    \ Formats the partition as a swap partition.  \n+   If you are not sure which\
    \ file system to choose, select Reiser for root and data partitions and Swap for\
    \ swap partitions.\n\n+   - **Options.** By selecting Options, you can change\
    \ parameters for the file system you selected. You can use the default parameters\
    \ in most cases.\n\n+   - **Encrypt file system.** If you select this option,\
    \ the partition with the file system is encrypted. Encrypting a file system prevents\
    \ unauthorized mounting only; once mounted the files are accessible like any other\
    \ file on the system.  \n+   You should only use this option for non-system partitions\
    \ such as user home directories.\n\n- **Size.** Lets you configure the size of\
    \ the new partition with the following:\n\n+   - **Start Cylinder.** Determines\
    \ the first cylinder of the new partition. YaST normally preselects the first\
    \ available free cylinder of the hard disk.\n\n+   - **End.** Determines the size\
    \ of the new partition. YaST normally preselects the last available free cylinder.\
    \  \n+   To configure the end cylinder, do one of the following:\n\n+   - Enter\
    \ the cylinder number."
  merge: -1
  img_proc: true
- pgno: 42
  md: '+   Enter a plus sign (+) followed by the amount of disk space for the new
    partition. Use M for MB and G for GB. YaST calculates the last cylinder number.
    For example, enter +5G for a partition size of 5 GB.


    +   **Fstab Options.** Select this option to edit the fstab entry for this partition.
    The default setting should work in most cases.


    +   **Mount Point.** Select the mount point of the new partition from this drop-down
    list. You can also enter a mount point manually, if it’s not available in the
    list. The mount point will be created automatically during installation.


    After changing the parameters, select **OK** to add the new partition to the partition
    list.


    If you chose to create an extended partition, the following appears:


    # Figure 1-10


    ![](img/63e88022bf135307e3eac051ad238b5b_42_0.png)


    You can enter the following:


    +   **Start cylinder.** The start cylinder determines the first cylinder of the
    new partition. YaST normally preselects the first available free cylinder of the
    hard disk.


    +   **End.** The end cylinder determines the size of the new partition. YaST normally
    preselects the last available cylinder of the hard disk.


    To configure the end cylinder, do one of the following:


    +   Enter the cylinder number.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   Enter a plus sign (+) followed by the amount of disk space for the new
    partition. Use M for MB and G for GB. YaST calculates the last cylinder number.


    For example, enter **+5G** for a partition size of 5 GB.


    After entering the size, select **OK** to add the new extended partition to the
    partition list.


    # ## Edit Existing Partitions


    Select a partition from the list and select **Edit**. You can edit only primary
    and logical partitions with the Expert Partitioner. You cannot edit extended partitions
    or the entry for the entire hard disk.


    If you edit a primary or logical partition, a dialog appears which is very similar
    to the Create Partition dialog described above. You can change all options except
    the partition size.


    After changing the partition parameters, select **OK** to save your changes to
    the partition list.


    # ## Delete Existing Partitions


    To delete a partition, select a partition from the list, select **Delete**, and
    then select **Yes** in the confirmation dialog. The partition is deleted from
    the partition list.


    Remember that you also delete all logical partitions when you delete an extended
    partition.


    If you select the entry for the entire hard disk and select **Delete**, all partitions
    on the disk are deleted.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Resize Existing Partitions


    Select a partition from the list and select **Resize**.


    > Although you can reduce a partition’s size without deleting it to increase free
    space on the hard disk, you should always back up the data on the partition before
    resizing it.


    > If the selected partitions are formatted with the FAT or NTFS file system, there
    are certain steps you should take in Windows before resizing (scandisk and defrag).
    See the section on installation in the *SUSE Linux Enterprise Server 10 Administration
    Manual* (*usr/share/doc/manuals/sles-admin_en/, package sles-admin_en) for details.


    After you select **Resize**, the following appears:


    ![](img/63e88022bf135307e3eac051ad238b5b_44_0.png)


    This dialog includes the following:


    +   *   Two bars representing the partition before and after the resizing process

    +       *   **Now**. Used space is designated by dark blue and the available space
    by light blue. If there is space not assigned to a partition it is designated
    by white.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   □ **After installation.** Used space is designated by dark blue and the
    free space by light blue. The space that is available for a new partition is designated
    by white.

    +   ■ A slider to change the size of the partition

    +   ■ Two text fields that display the amount of free space on the partition being
    resized and the space available for a new partition after the resizing process

    +   ■ A Do Not Resize button used to reset the partition to the original size


    To resize the partition, move the slider until enough unused disk space is available
    for a new partition. When you select **OK**, the partition size changes in the
    partition list.


    # Perform Expert Tasks


    When you select **Expert**, the following options are available:


    +   ■ **Recreate the Partition Table.** Resets the partition list to the current
    physical disk setup. All changes will be lost.

    +   ■ **Import Mount Points from Existing /etc/fstab.** Scans the hard disks for
    an /etc/fstab file. You can load this file and set the mount points accordingly.

    +   ■ **Delete Partition Table and Disk Label.** Deletes the partition table and
    the disk label of the selected hard disk. *All data on that disk will be lost.*


    When you finish configuring settings in the Expert Partitioner, return to the
    installation proposal by selecting **Finish**.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# ## Select Software


    SLES 10 contains many software packages for various application purposes. Instead
    of selecting needed packages one by one, you can select various software categories.


    Depending on the available disk space, YaST preselects several of these categories.
    Selecting **Software** in the installation overview opens the following dialog:


    ![](img/63e88022bf135307e3eac051ad238b5b_46_0.png)


    The figure above shows the default selection. A brief description appears on the
    right when you highlight a category in the center column.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'To find out which packages are contained in the various categories, select
    Details, which opens the following dialog:


    ![](img/63e88022bf135307e3eac051ad238b5b_47_0.png)


    ![](img/63e88022bf135307e3eac051ad238b5b_47_1.png)


    Selecting one pattern on the left shows the software packages contained in that
    category on the right. Selecting the square to the left of the pattern selects
    it for installation or deselects it.


    A package typically contains an application and all additional files required
    to use the software. Sometimes larger applications can be split into multiple
    packages and several small applications can be bundled into a single package.
    SUSE Linux Enterprise Software uses the RPM Package Manager for software management.


    Sometimes one software package needs another one to run. Information on these
    dependencies is stored in the RPM packages. YaST can automatically select software
    packages when another package requires them.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'You can install a package by selecting the check box for that **package** in
    the **package list** on the right.


    To view details for a package, highlight its entry in the package list. The details
    for the currently selected package are displayed below the package list.


    The Filter drop-down menu offers different views on the software packages available
    and the software scheduled for installation.


    # **Figure 1-14**


    ![](img/63e88022bf135307e3eac051ad238b5b_48_0.png)


    +   - **Patterns**. This leads to the dialog shown in Figure 1-13.

    +   - **Package Groups**. Displays the packages in a hierarchical tree view. There
    are main categories, like Productivity, Programming, System, Hardware, etc. and
    subcategories. Selecting a category on the left displays the software packages
    belonging to that category on the right.

    +   - **Languages**. You can select support for additional languages.

    +   - **Installation Sources**. Displays the installation sources configured.

    +   - **Search**. Displays a search dialog to search for packages.

    +   - **Installation Summary**. Displays a summary of the packages selected for
    installation.


    The disk usage of the software packages selected for installation is displayed
    in the lower left corner of the dialog.


    Select the option **Check** to check the dependencies of the selected packages.
    This check is also done when you confirm the package selection dialog.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'If the check box **Autocheck** is selected, dependencies are checked every
    time you select or deselect a package.


    Confirm your package selection and return to the installation proposal by selecting
    **Accept**.


    # Start the Installation Process


    After customizing the installation proposal, select *Accept*. A dialog appears
    asking you to confirm the proposal. Start the installation process by selecting
    **Install**; return to the installation proposal by selecting **Back**.


    Before installing software packages, YaST changes the hard disk partitioning.


    Depending on your software selection and the performance of your system, the installation
    process takes 15–45 minutes.


    If you are using the product CD set instead of the DVD, YaST asks you to change
    the installation CDs. Insert the requested CD and continue the installation by
    selecting **OK**.


    After all software packages are installed, YaST reboots the computer and prompts
    you for the host name, root password, network configuration details, etc., to
    further customize your installation.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# **Objective 2**

    **Configure the SLES 10 Installation**


    In this part of the installation process, you use YaST to perform the following
    configuration tasks:


    +   - Set the Host Name

    +   - Set the root Password

    +   - Configure the Network

    +   - Test the Internet Connection

    +   - Novell Customer Center Configuration and Online Update

    +   - Manage Users

    +   - Configure Network Services

    +   - Configure Hardware

    +   - Finalize the Installation Process


    # **Set the Host Name**


    YaST suggests a host name **liux-xxxx**, with xxxx being composed of random characters.
    The domain defaults to *site*. Change the host and the domain name to the correct
    values for the computer and remove the check mark in front of **Change Hostname
    via DHCP**.


    If the computer gets its host name and domain via DHCP you do not need to change
    anything in this dialog.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Set the root Password


    *root* is the name of the administrator of the system. Unlike regular users, who
    might not have permission to do certain things on the system, root has unlimited
    power to do anything, including the following:


    +   Access every file and device in the system.

    +   Change the system configuration.

    +   Install software.

    +   Set up hardware.


    The root account should only be used for system administration, maintenance, and
    repair. Logging in as root for daily work is risky: a single mistake can lead
    to irretrievable loss of many system files.


    To let you set the root password during the installation process, YaST displays
    the following:


    ![](img/63e88022bf135307e3eac051ad238b5b_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Enter the same password in both text fields of the dialog.


    You should choose a password that cannot be guessed easily. Use numbers, lowercase
    and uppercase characters to avoid dictionary attacks.


    By selecting **Expert Options**, you can choose the password encryption algorithm.
    In most cases you can use the default setting, which is **Blowfish**.


    After entering the root password, continue to the next configuration step by selecting
    **Next**. In case your password is too simple or weak, you are shown a warning.
    Go back to enter a better password, or accept the weakness and go on.


    # Configure the Network


    To let you configure the network connection of your system, YaST displays the
    following:


    ![](img/63e88022bf135307e3eac051ad238b5b_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'In the top part of the dialog, you can choose one of the following options:


    +   * **Skip Configuration.** Skip the network configuration for now. You can
    configure the network connection later in the installed system.

    +   * **Use Following Configuration.** Use the network configuration proposal
    displayed in the area below.


    The network configuration proposal is similar to the installation proposal at
    the beginning of the base installation, with headings that can be selected to
    view and configure further details, and includes the following entries:


    +   * **Network Mode.** Switch between the traditional method of managing the
    network and network manager. On a server use the traditional method. Network manager
    is more suitable for a notebook, enabling users to easily switch between for instance
    Ethernet and wireless access.

    +   * **Firewall.** If you want to administer the computer via SSH, toggle **SSH
    port is blocked** to **SSH port is open** by clicking on **blocked**. You can
    disable the firewall by clicking on **enabled**. When the firewall is disabled,
    then SSH is accessible as well. Selecting **Firewall** itself opens a dialog allowing
    detailed configuration of the firewall settings.

    +   * **Network Interfaces.** Displays the network interfaces found (such as Ethernet
    or a Wireless-LAN adapter) and their configuration (like DHCP).

    +   * **DSL Connections.** Displays the configuration of DSL devices. These can
    be DSL modems connected with an Ethernet adapter or internal DSL modems.

    +   * **ISDN Adapters.** Displays the configuration of ISDN devices.

    +   * **Modems.** Displays the configuration of analog modems.

    +   * **VNC Remote Administration.** Displays the configuration of remote administration
    using VNC.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   ■ **Proxy**. Displays the HTTP and FTP proxy settings.


    You can change a configuration by selecting the headline of the entry or by selecting
    the entry from the **Change** drop-down list. This menu also lets you reset all
    settings to the defaults generated by YaST.


    If you are not sure which settings to use, stay with the defaults generated by
    YaST.


    # ## Configure Network Interfaces


    After starting the network interface configuration, YaST displays the **Network
    Card Configuration Overview**. It lists all network cards, the configured ones
    as well as those which are not yet configured:


    ![](img/63e88022bf135307e3eac051ad238b5b_54_0.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The upper part lists the cards found, the lower part show details for the network
    card that is highlighted in the upper part.


    At this point, you can do one of the following:


    +   Add a Network Card Manually

    +   Edit an Existing Configuration

    +   Delete Existing Partitions


    # Add a Network Card Manually


    If you want to configure a network card that was not automatically detected, select
    **Add** to display the following:


    ![](img/63e88022bf135307e3eac051ad238b5b_55_0.png)


    From this dialog, you can configure the following:


    +   *   **Network Configuration.** Specify the network **Device Type** (Ethernet,
    Bluetooth, Wireless, etc.) and the device number.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - **Kerel Module.** If your network card is a PCMCIA or USB device, select
    the corresponding check boxes and confirm selecting **Next**.


    +   - Otherwise, select **Select from List** and select your network card from
    the list. YaST automatically loads the appropriate driver for the selected card.
    Confirm by selecting **OK**.


    +   - If you selected **Wireless** as Device Type for a WLAN card, **Next** brings
    you to a Network Address dialog. The default, DHCP, is usually the right choice.
    Selecting **Next** again opens a dialog where you can enter WLAN specific configuration
    parameters, like the **Operating Mode**, the **Network Name** (ESSID), the **Authentication
    Mode**, and the encryption key. WEP keys are entered in a separate dialog after
    selecting **WEP Keys**. Expert settings concern parameters like the bit rate.


    When you are finished with this dialog, select **Next**, which returns you to
    the Network Card Configuration Overview.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# Edit an Existing Configuration\n\nTo edit a network card configuration, highlight\
    \ its entry in the upper part of the **Network Card Configuration Overview** and\
    \ select **Edit**.\n\n![](img/63e88022bf135307e3eac051ad238b5b_57_0.png)\n\nThe\
    \ **Address** tab offers the following configuration options:\n\n+   \n+   * **Automatic\
    \ Address Setup (via DHCP)**. If your network has a DHCP server, you can set up\
    \ your network address automatically. You should also use this option if you are\
    \ using a DSL line with no static IP address assigned by the ISP.\n+   \n+   If\
    \ you decide to use DHCP, you can configure the details after selecting **DHCP\
    \ Options** from the **Advanced** drop-down list. Specify whether the DHCP server\
    \ should always broadcast its responses (in this case select **Request Broadcast\
    \ Response**) and any identifier to use."
  merge: -1
  img_proc: true
- pgno: 58
  md: 'By default, DHCP servers use the network card''s hardware address to identify
    an interface. If you have a virtual host setup where different hosts communicate
    through the same interface, an identifier is necessary to distinguish them.


    +   * **Static Address Setup.** If you have a static address, select the corresponding
    check box. Then enter the address and subnet mask for your network. The preset
    subnet mask should match the requirements of a typical home network.

    +   * **Hostname and Name Server.** Select this option to set the host name and
    the name server manually.

    +   * **Routing.** Select this option to configure routing manually.


    The **General** tab offers the following configuration options:


    +   * **Firewall Zone.** Decide whether this interface belongs to the Internal,
    External, or Demilitarized Zone, or if all traffic should be blocked (No Zone).

    +   * **Device Activation.** Choose from At Boot Time, On Cable Connection, On
    Hotplug, Manually, or Never.

    +   * **Detailed Network Interface Settings.** Specify the Maximum Transfer Unit
    (MTU), which sometimes improves the performance of certain DSL (Digital Subscriber
    Line) connections. For PPPoE (Point-to-Point over Ethernet) values between 1400
    and 1492 are common; these values vary, depending on your ISP (Internet Service
    Provider).


    Confirm the Network Address Setup and return to the Network Card Configuration
    Overview by selecting **Next**.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Delete an Existing Configuration


    To delete an existing configuration, highlight it in the upper part of the Network
    Card Configuration Overview and select **Delete**.


    When finished with adding, editing, or deleting network card configurations, save
    the network device configuration and return to the Network Configuration proposal
    by selecting **Next**.


    After finishing the Network Configuration, select **Next**.


    # Test the Internet Connection


    YaST then asks you to test your connection to the Internet. Select one of the
    following options:


    +   * **Yes, Test Connection to the Internet.** YaST tries to test the Internet
    connection by downloading the latest release notes and checking for available
    updates.

    +       * If you select this option, the results are displayed on the next dialog.

    +   * **No, Skip This Test.** Skip the connection test. If you skip the test,
    you cannot update the system during installation.


    Select one of the options and select **Next**.


    If the test fails, you can view the logs to find out what went wrong. Select **Next**
    to continue.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# **Novell Customer Center Configuration and Online Update**


    If the Internet connection test was successful, you can configure the Novell Customer
    Center, which is required to perform an online update. If there are any update
    packages available on the SUSE update servers, you can download and install them
    to fix known bugs or security issues.


    ![](img/63e88022bf135307e3eac051ad238b5b_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Selecting **Next** starts a Browser and connects to the Novell web site, where
    all you have to enter is your email address, and an activation code, if available.


    # Figure 1-21


    ![](img/63e88022bf135307e3eac051ad238b5b_61_0.png)


    After successful registration, the Online Update dialog opens. You can start the
    Online Update by selecting **Run Update** and **Next**. (You can also select **Skip
    Update** to perform the update later in the installed system.)'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'YaST''s online update dialog opens up with a list of available patches (if
    any).


    ![](img/63e88022bf135307e3eac051ad238b5b_62_0.png)


    Select the patches you want to install, and then start the update process by selecting
    **Accept**.


    Once the installation is complete, visit the Novell Customer Center at http://www.novell.com/center/
    to administer your Novell products and subscriptions.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Configure Network Services


    In the next installation step, YaST displays the Service Installation Settings
    dialog.


    In the top part of the dialog, you can choose one of the following options:


    +   *   **Skip Configuration.** Skip this configuration step. You can enable the
    services later in the installed system.

    +   *   **Use Following Configuration.** Use the automatically generated configuration
    displayed below this option or select one of the following headlines to change
    the configuration:

    +       \-   **CA Management.** The purpose of a CA (certification authority or
    certificate authority) is to guarantee a trust relationship among all network
    services that communicate with each other.

    +       If you decide that you do not want to establish a local CA, you must secure
    server communications using SSL (Secure Sockets Layer) and TLS (Transport Layer
    Security) with certificates from another CA.

    +       By default, a CA is created and enabled during the installation.

    +       To create proper certificates, the hostname has to be set correctly earlier
    in the Network Interface Configuration; otherwise the generated certificate will
    contain an incorrect hostname.

    +       \-   **LDAP Server.** You can run an LDAP (Lightweight Directory Access
    Protocol) server on your host to have a central service managing a range of configuration
    settings. Typically, an LDAP server handles user account data, but since SLES
    9 you can also use LDAP for mail, DHCP, and DNS related data on SUSE Linux Enterprise
    Server. By default, an LDAP server is not set up during installation.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'If you are not sure about the correct settings, keep the defaults generated
    by YaST. You can change the configuration later in the installed system.


    When you are finished, select **Next**.


    # # Manage Users


    To manage users during this configuration step, do the following:


    +   * Select the Authentication Method

    +   * Configure the Authentication Method


    # ## Select the Authentication Method


    The Authentication Method dialog offers four methods: You can selecting one of
    the following options:


    +   * **Local** (*`/etc/passwd`*). Select this option to configure the system
    to use the traditional file-based authentication method.

    +   * **LDAP**. If you have an LDAP server in your network, you can configure
    your system as an LDAP client.

    +   * **NIS**. If you have a NIS server in your network, you can configure your
    system as a NIS client.

    +   * **Windows Domain**. Choose this if you want to authenticate against a Windows
    Server.


    If you are not sure which method to select, stay with **Local**, which is the
    default for SLES 10.


    After selecting an authentication method, select **Next**.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Configure the Authentication Method\n\nThe next dialog differs, depending\
    \ on which authentication method you selected. We will cover here:\n\n+   - \t\
    Add Local Users\n+   - \tConfigure the System as an LDAP Client\n\nThe dialogs\
    \ for NIS and Windows Domain are used in a similar fashion to obtain the necessary\
    \ information to enable the respective authentication method.\n\n# Add Local Users\n\
    \nIf you select Local as the authentication method, the following appears:\n\n\
    ![](img/63e88022bf135307e3eac051ad238b5b_65_0.png)"
  merge: -1
  img_proc: true
- pgno: 66
  md: "You can use the following in this dialog to add local users to the system (account\
    \ information is stored in the files **/etc/passwd** and **/etc/shadow**):\n\n\
    +   -   **User Data.** Enter the full user name, the login name, and the password.\n\
    +   \n+       To provide effective security, a password should be 8 or more characters\
    \ long. The maximum length for a password ranges from 8 to 128 characters, depending\
    \ on the algorithm used to hash the password. While the Crypt algorithm commonly\
    \ used in the past used only the first eight characters of the password, more\
    \ recent algorithms allow longer passwords.\n+   \n+       Passwords are case-sensitive.\
    \ Special characters are allowed, but they might be hard to enter depending on\
    \ the keyboard layout.\n\n+   -   **Password Settings.** Select this option to\
    \ change advanced password settings (such as password expiration). The default\
    \ settings are suitable in most cases.\n\n+   -   **Details.** Select this option\
    \ to edit details of the user account. The default settings are suitable in most\
    \ cases.\n\n+   -   **Receive System Mail.** Select this option to forward all\
    \ emails addressed to root to this user.\n\n+   -   **Automatic Login.** Select\
    \ this option to enable automatic login for this user. This option logs in the\
    \ user automatically (without requesting a password) when the system starts.\n\
    +   \n+       You should not enable this feature on a production system.\n\n+\
    \   -   **User Management.** Select this option to add more users (with the YaST\
