- pgno: 410
  md: '# # SECTION 9 iSCSI


    The Internet Small Computer Systems Interface (iSCSI) is an implementation of
    the regular SCSI commands over IP. SUSE Linux Enterprise Server 10 allows to connect
    to an iSCSI target as an iSCSI initiator, or to offer storage space to other iSCSI
    initiators as an iSCSI target.


    # ## Objectives


    +   1. iSCSI Background

    +   2. iSCSI Configuration'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# **Objective 1**


    # iSCSI Background


    SCSI commands are used to enable systems to communicate with I/O devices, especially
    storage devices. The Internet Small Computer Systems Interface implements the
    regular SCSI commands over IP.


    With iSCSI, the operating system (iSCSI initiator) does not send the SCSI command
    directly to a device, but to another system connected via the network (iSCSI target);
    this system will then redirect the SCSI commands to the actual storage device—for
    instance a partition, a logical volume or a file.


    This is basically a client/server connection between iSCSI initiator (client)
    and iSCSI target (server). However, unlike usual client/server connections, usually
    only one client may connect to the server. The iSCSI protocol is standardized
    in RFC3720.


    With iSCSI it is possible to connect to remote storage, which can be a disk, a
    logical volume or a file, and it will appear to the system as a local disk. This
    is also known as SAN. The advantage of iSCSI in comparison to other SAN solutions
    is primarily in the area of cost. Common SAN solutions use rather expensive FC
    (fibre channel) hardware, whereas iSCSI can use the already existing ethernet
    network. Furthermore, many SAN solutions also provide an iSCSI interface.


    Considering the amount of data transferred over the network it is important that
    enough bandwidth is available, for instance Gigabit Ethernet. It often makes sense
    to set up a dedicated network for the iSCSI connections.


    The remote devices are available on Linux as a regular SCSI (\*/dev/sdX\*) device
    and should be mounted with the option `ntdev`. You can configure the iSCSI targets
    to require a username and password upon connection from an iSCSI initiator.'
  merge: -1
  img_proc: true
- pgno: 412
  md: There is more than one iSCSI solution available on Linux, but all of them use
    by default port 3260 for the iSCSI connection.
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Objective 2 iSCSI Configuration


    The configuration and maintenance of iSCSI on RHEL4 and SUSE Linux Enterprise
    Server 10 differ in some aspects.


    +   Red Hat Enterprise Linux 4

    +   SUSE Linux Enterprise Server 10


    # Red Hat Enterprise Linux 4


    With RHEL, iSCSI is available since Service Pack 2. It is implemented by two modules,
    iscsi_sfnet and csi_transporl iscsi, and the package iscsi-initiator-utils.


    To see if any iSCSI devices are currently used, use the command iscsi -ls -I.


    If there are any devices listed, then you should analyze and save the configuration
    files used for the iSCSI connection: /etc/ietd.conf, /etc/icsci.conf and /etc/initiatorname.iscsi.
    Their role will be described in detail later in this section.


    Before you migrate to SUSE Linux Enterprise Server 10, you should stop the iSCSI
    daemon with the command service iscsi stop.


    You should also check /etc/fstab for any configured iSCSI devices.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# SUSE Linux Enterprise Server 10


    SUSE Linux Enterprise Server 10 can be configured as iSCSI target and as iSCSI
    initiator. You can do this with the configuration tool YaST or manually.


    +   - Set up an iSCSI Target

    +   - Set up an iSCSI Initiator

    +   - Mount iSCSI Targets Automatically at Boot Time


    # Set up an iSCSI Target


    You can either start YaST and select **Network Services > iSCSI Target**, or start
    the iSCSI Target module directly by entering as root in a console window **yast2
    iscsi-server**.


    If the iscsitarget package is not installed, YaST will invite you to do that:


    ![](img/63e88022bf135307e3eac051ad238b5b_414_0.png)'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'In the main menu of the iSCSI Target configuration there are 3 tabs available.
    **Service** is the first one; here you can configure how iSCSI will be started.
    Most likely **When Booting** is the right choice for you.


    ![](img/63e88022bf135307e3eac051ad238b5b_415_0.png)


    If your SuSE Firewall is active, you should select **Open Port in Firewall** to
    be able to access the port needed for iSCSI. If the Firewall is not activated,
    the option cannot be selected, as visible in the above screenshot.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'On the **Global** register you can configure the authentication between iSCSI
    target and initiator during the discovery process.


    ![](img/63e88022bf135307e3eac051ad238b5b_416_0.png)


    By default **No Authentication** is selected. That means that every iSCSI client
    can discover this target.


    The difference between **Incoming** and **Outgoing Authentication** is as follows:


    Incoming Authentication signifies that the iSCSI initiator is responsible for
    the authentication. If you use **Outgoing Authentication**, then the iSCSI target
    is responsible. Challenge-Handshake Authentication Protocol (CHAP) is used for
    authentication.


    The passwords defined here will be stored in the configuration files as clear
    text.


    You can also set up the iSCSI environment without authentication (default).


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 417
  md: "On the third register you can configure your iSCSI targets:\n\n![](img/63e88022bf135307e3eac051ad238b5b_417_0.png)\n\
    \nBy default there is already an iSCSI target defined, but because there is no\
    \ backend configured, it is not directly usable. You could edit this target, but\
    \ you can also delete it and create a new one.\n\nBefore you add an iSCSI target\
    \ you should decide on the backend device you want to use. As backend device you\
    \ can use a regular disk, a logical volume or a file. To demonstrate the configuration\
    \ we will use a file with a size of 1 GB, which can be created with the following\
    \ commands:\n\n```\n```\nmkdir /srv/iscsi\n```\n\n``` \ndd if=/dev/zero of=/srv/iscsi/first-device\
    \ bs=1M count=1024\n```\n```"
  merge: -1
  img_proc: true
- pgno: 418
  md: 'Selecting the **Add** button opens the following dialog:


    ![](img/63e88022bf135307e3eac051ad238b5b_418_0.png)


    ![](img/63e88022bf135307e3eac051ad238b5b_418_1.png)


    In this dialog you can define the name of the iSCSI device and the backend to
    use. To use more LUNs (Logical Unit Numbers) on one iSCSI target you have to edit
    the file /etc/ietd.conf manually.


    The target name should be unique world wide. By default, the following syntax
    is used:


    **iqn.YYYY-MM.reverse-domain-name: identifier**


    **iqn** (iSCSI qualified name) is normally followed by the date of device creation
    and the domain name of the company in reverse order. The identifier is optional
    and can be used for a name based identification, like for example “iscsi-database-target”.


    In the **path** box you define the backend device; in our case this would be /s/vliscsi/first-device.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'Selecting **Next** opens the next dialog where you can configure the authentication
    for this target.


    ![](img/63e88022bf135307e3eac051ad238b5b_419_0.png)


    By default there is no authentication used. If you add a user and password for
    **Incoming Authentication**, you have to remember user and password for the iSCSI
    initiator setup.'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'After selecting **Next** you can view your new iSCSI target:


    ![](img/63e88022bf135307e3eac051ad238b5b_420_0.png)


    ![](img/63e88022bf135307e3eac051ad238b5b_420_1.png)


    After selecting **Finish** the settings are written to the system.


    The command *rescsitarget status* (or */etc/init.d/iscsitarget status*) displays
    whether the iSCSI target daemon is running or not. If it is, *cat /proc/net/iet/volume*
    will display your configured iSCSI target.


    The iSCSI Target configuration is stored in */etc/ietd.conf* and is managed by
    the service iscsitarget-daemon (IETd: iSCSI Enterprise Target Daemon).


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 421
  md: "The following listing shows an /etc/ietd.conf with two targets; one uses the\
    \ device /dev/sda6 as physical storage, the other one a file. The comments explain\
    \ further parameters you might want to define for each target:\n\n```\n```\nTarget\
    \ iqn.2006-10.com.digitalairlines:87813d1d-d58f ...\nLun 0 Path=/dev/sda6,Type=fileio\n\
    Target iqn.2006-10.com.digitalairlines:14736b2d-f00e ...\nLun 1 Path=/srv/iscsi/second-device,Type=fileio\n\
    # Users, who can access this target. The same rules\n##as for discovery users\
    \ apply here. Leave them\n# alone if you don't want to use authentication.\n#IncomingUser\
    \ joe secret\n#OutgoingUser jim 12charpawswd\n# Logical Unit definition\n# You\
    \ must define one logical unit at least.\n# Block devices, regular files, LVM,\
    \ and RAID can\n# be offered to the initiators as a block device.\n#Lun 0 Path=/dev/sdc,Type=fileio\n\
    # Alias name for this target\n# Alias Test\n# various iSCSI parameters\n# (not\
    \ all are used right now, see also iSCSI spec\n# for details)\n#MaxConnections\t\
    1\n#InitialR2T\t\tYes\n#ImmediateData\tNo\n#MaxRecvDataSegmentLength 8192\n#MaxXmitDataSegmentLength\
    \ 8192\n#MaxBurstLength\t262144\n#FirstBurstLength\t65536\n#DefaultTime2Wait\t\
    2\n#DefaultTime2Retain\t20\n#MaxOutstandingR2T\t8\n#DataPDUInOrder\tYes\n#DataSequenceInOrder\
    \ Yes\n#errorRecoveryLevel\t0\n#HeaderDigest\tCRCS32,None\n#DataDigest\tCRCS32,None\n\
    # various target parameters\n#WThreads\t8\n```\n```"
  merge: -1
  img_proc: true
- pgno: 422
  md: '# ## Set up an iSCSI Initiator


