- pgno: 216
  md: '# Manage Software RAID


    To manage software RAID (Redundant Array of Independent (or Inexpensive) Disks),
    select **RAID** in the YaST Expert Partitioner.


    The purpose of RAID is to combine several hard disk partitions into one large
    virtual hard disk for optimizing performance and improving data security.


    There are two types of RAID configurations:


    +   - **Hardware RAID.** The hard disks are connected to a separate RAID controller.
    The operating system sees the combined hard disks as one device. No additional
    RAID configuration is necessary at the operating system level.

    +   - **Software RAID.** Hard disks are combined by the operating system. The
    operating system sees every single disk and needs to be configured to use them
    as a RAID system.


    In the past, hardware RAID provided better performance and data security than
    software RAID. However, with the current maturity of software RAID in the Linux
    kernel, software RAID provides comparable performance and data security.


    In this section, you learn how to set up software RAID.


    You combine hard disks according to RAID levels:


    +   - **RAID 0**. This level improves the performance of your data access, however
    there is no redundancy in RAID 0. With RAID 0, two or more hard disks are pooled
    together (striping). Disk performance is very good, but the RAID system is vulnerable
    to a single point of failure. If one of the disks fails, all data is lost.

    +   - **RAID 1**. This level provides enhanced security for your data because
    the data is copied to one or several hard disks. This is also known as *hard disk
    mirroring*. If one disk is destroyed, a copy of its contents is available on the
    other disk(s). Minimum number of disks (or partitions) required for RAID 1 is
    two.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "+   RAID 5, RAID 5 is an optimized compromise between RAID 0 and RAID 1 in\
    \ terms of performance and redundancy. Data and a checksum are distributed across\
    \ the hard disks. Minimum number of disks (or partitions) required for RAID 5\
    \ is three.\n+   \n+   If one hard disk fails, it must be replaced as soon as\
    \ possible to avoid the risk of losing data. The data on the failed disk is reconstructed\
    \ on its replacement from the data on the remaining disks and the checksum. If\
    \ more than one hard disk fails at the same time, the data on the disks is lost.\n\
    \n+   RAID 6, RAID 6 is comparable to RAID 5, the difference being that 2 disks\
    \ may fail without data loss. The minimum number of disks (or partitions) required\
    \ for RAID 6 is four.\n\nUsing YaST you can set up RAID levels 0, 1, and 5 (RAID\
    \ levels 2, 3, and 4 are not available with software RAID). To create software\
    \ RAID with YaST, do the following:\n\n+   Partition your hard disks. For RAID\
    \ 0 and RAID 1, at least 2 partitions on different disks are needed. RAID 5 requires\
    \ at least 3 partitions. We recommend that you use only partitions of the same\
    \ size.\n\n+   Set up RAID, Select RAID in the YaST Expert Partitioner to open\
    \ a dialog to choose between the RAID levels 0, 1, and 5, and then add partitions\
    \ to the new RAID."
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Choose a file system and a mount point for your RAID. By changing the chunk
    size, which is explained in the help text in Figure 4-12, you can fine tune the
    RAID performance.


    # Figure 4-12


    ![](img/63e88022bf135307e3eac051ad238b5b_218_0.png)


    After finishing the configuration, the RAID partitions appear in the partition
