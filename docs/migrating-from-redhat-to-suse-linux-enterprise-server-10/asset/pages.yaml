- pgno: 109
  md: 'Save the configuration settings by selecting **Next > Finish**. The values
    are written to the file **/etc/default/useradd**.


    ```

    dal0:~ # cat /etc/default/useradd

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    GROUPS=video,dialout

    CREATE_MAIL_SPOOL=no

    ```


    You can also use the command line program **useradd** to view or change the defaults.
    The option **--show-defaults** displays the same as the cat above. The option
    **--save-defaults** followed by an option with a value changes them:


    ```

    dal0:~ # useradd --save-defaults -d /export/home

    dal0:~ # useradd --show-defaults

    GROUP=100

    HOME=/export/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    GROUPS=video,dialout

    CREATE_MAIL_SPOOL=no

    ```


    The manual page for useradd lists the possible options.


    > **useradd** on SUSE Linux Enterprise Server 10 does not create a home directory
    for a new user by default; use the option **-m** to create a home directory when
    creating a new user.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Configure Security Settings


    YaST provides a Local Security module that lets you configure the following local
    security settings for your SUSE Linux Enterprise Server:


    +   Password settings


    +   Boot configuration


    +   Login settings


    +   User creation settings


    +   File permissions


    You can select from (or modify) three preset levels of security, or create your
    own customized security settings to meet the requirements of your enterprise security
    policies and procedures.


    You can access the Security Settings module from the YaST Control Center by selecting
    **Security and Users > Local Security**, or by entering as root `yast2 security`
    in a terminal window.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The following appears:


    # Figure 2-18


    ![](img/63e88022bf135307e3eac051ad238b5b_111_0.png)


    From this dialog, you can select one of the following preset configurations:


    +   ■ **Home Workstation.** Select for a home computer not connected to any type
    of a network. This option represents the lowest level of local security.


    +   ■ **Networked Workstation.** Select for a computer connected to any type of
    a network or the Internet. This option provides an intermediate level of local
    security.


    +   ■ **Network Server.** Select for a computer that provides any type of service
    (network or otherwise). This option enables a high level of local security.


    +   ■ You can also select **Details** or **Custom Settings** to modify an existing
    security level or create your own configuration.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'By selecting one of the three predefined security levels and selecting **Next**,
    the chosen security level is applied. By selecting **Details**, you can change
    the settings for the security level you have selected.


    If you choose the **Customs Settings** and then select **Next**, you can directly
    change the details of the security configuration.


    The dialogs for the detail settings look the same for every security level, but
    the preselected options are different. In the following dialogs, you see the settings
    for Level 3 (Network Server).


    In the first dialog you can change the default password requirements that are
    accepted by the systems:


    ![](img/63e88022bf135307e3eac051ad238b5b_112_0.png)


    From this dialog, you can select or enter the following password settings (mainly
    stored in /etc/login.defs, some values also in /etc/default/passwd and /etc/security/pam_pwcheck.conf):'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   **Check New Passwords.** It is important to choose a password that cannot
    be found in a dictionary and is not a name or other simple, common word. By selecting
    this option, you enforce password checking in regard to these rules.


    +   **Test for Complicated Passwords.** Passwords should be constructed using
    a mixture of uppercase and lower case characters as well as numbers. Special characters
    like *:=* etc. may be used too, but could be hard to enter on a different keyboard
    layout. This makes it very difficult to guess the password. Select this option
    to enable additional checks.


    +   **Password Encyption Method.** From the drop-down list, select one of the
    following encyption methods:


    +   **DES.** This is the lowest common denominator. It works in all network environments,
    but it restricts you to passwords no longer than eight characters. If you need
    compatibility with other systems, select this method.


    +   **MD5.** This encyption method allows longer passwords and is supported by
    all current Linux distributions, but not by other systems or older software.


    +   **Blowfish.** This encyption method uses the blowfish algorithm to encrypt
    passwords. It is not yet supported by many systems. A lot of CPU power is needed
    to calculate the hash, which makes it difficult to crack passwords with the help
    of a dictionary. It is used as default encyption method on SLES 10


    +   **Minimum Acceptable Password Length.** Enter the minimum number of characters
    for an acceptable password. If a user enters fewer characters, the password is
    rejected. Entering 0 disables this check.


    +   **Password Age.** Minimum refers to the number of days that have to elapse
    before a password can be changed again. Maximum is the number of days after which
    a password expires and must be changed.


    1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.

    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   - **Days Before Password Expires Warning**. A warning is issued to the
    user this number of days before password expiration.


    Although root receives a warning when setting a password, she can still enter
    a bad password despite the above settings.


    When you finish configuring password settings, continue by selecting **Next**.
    The following appears:


    Figure 2-20


    ![](img/63e88022bf135307e3eac051ad238b5b_114_0.png)


    From this dialog, you can select the following boot settings (which update the
    file /etc/initab):


    +   - **Interpretation of Ctrl + Alt + Del**. When someone at the console presses
    the **Ctrl+Alt+Del** keystroke combination, the system usually reboots.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "+   □ **Ignore.** Sometimes you want to have the system ignore this keystroke\
    \ combination, especially when the system serves as both workstation and server.\
    \ Nothing happens when the **Ctrl+Alt+Del** keystroke combination is pressed.\n\
    +   \n+   □ **Reboot.** The system reboots when the **Ctrl+Alt+Del** keystroke\
    \ combination is pressed.\n+   \n+   □ **Halt.** The system is shut down when\
    \ the **Ctrl+Alt+Del** keystroke combination is pressed.\n\n+   ■ **Shutdown Behavor\
    \ of KDM.** You use this option to set who is allowed to shut down the computer\
    \ from KDM.\n+   \n+      □ **Only Root.** To halt the system, the root password\
    \ has to be entered.\n+   \n+      □ **All Users.** Everyone, even remotely connected\
    \ users, can halt the system using KDM.\n+   \n+      □ **Nobody.** Nobody can\
    \ halt the system with KDM.\n+   \n+      □ **Local Users.** Only locally connected\
    \ users can halt the system with KDM.\n+   \n+      □ **Automatic.** The system\
    \ is halted automatically after log out.\n\nFor a server system you should use\
    \ **Only Root** or **Nobody** to prevent normal or even remote users from halting\
    \ the system"
  merge: -1
  img_proc: true
- pgno: 116
  md: 'When you finish configuring boot settings, continue by selecting Next. The
    following appears:


    # Figure 2-21


    ![](img/63e88022bf135307e3eac051ad238b5b_116_0.png)


    From this dialog, you can enter and select the following login settings (mainly
    stored in /etc/login.defs):


    +   * **Delay After Incorrect Login Attempt**. Following a failed login attempt,
    there is typically a waiting period of a few seconds before another login is possible.
    This makes it more difficult for password crackers to log in.

    +   This option lets you adjust the time delay before another login attempt. Default
    is 3 seconds, which is a reasonable value.


    +   * **Record Successful Login Attempts**. Recording successful login attempts
    can be useful, especially in warning you of unauthorized access to the system
    (such as a user logging in from a different location than normal).'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Select this option to record successful login attempts in the file `/var/log/wtmp`.
    You can use the command `last` to view who logged in at what time.


    +   * **Allow Remote Graphical Login**. You can select this option to allow other
    users access to your graphical login screen via the network.


    Because this type of access represents a potential security risk, it is inactice
    by default.


    When you finish configuring login settings, continue by selecting **Next**. The
    following appears:


    ![](img/63e88022bf135307e3eac051ad238b5b_117_0.png)


    From this dialog, you can enter the following ID settings (stored in `/etc/login.defs`):'
  merge: -1
