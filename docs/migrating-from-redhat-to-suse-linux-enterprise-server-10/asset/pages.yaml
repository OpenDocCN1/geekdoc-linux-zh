- pgno: 211
  md: '+   □ **View all mount points, not just the current volume group.** When you
    select this option, all partitions and volumes that have entries in `/etc/fstab`
    are displayed. Otherwise, only the volumes in the selected volume group are displayed.


    +   □ **Add.** Adds a new logical volume to the volume group. When you select
