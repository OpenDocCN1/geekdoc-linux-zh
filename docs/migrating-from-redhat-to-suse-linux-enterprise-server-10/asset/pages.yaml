- pgno: 162
  md: '# **Objective 4 Use the NetworkManager to Configure the Network**


    In case you are using SUSE Linux Enterprise Server 10 on a laptop, you will most
    likely use different kinds of Internet access, depending on where you are—maybe
    a LAN in your office and a wireless connection at a customer site.


    The conventional network setup requires you to switch to the root account to change
    the network configuration. The purpose of the NetworkManager (package NetworkManager)
    is to allow the user to change the network configuration according to his needs,
    without switching to the root account.


    NetworkManager runs as a root-user system level daemon, since root privileges
    are needed to manipulate hardware directly. The programs used for this purpose
    are /usr/sbin/NetworkManager and /usr/bin/NetworkManagerDispatcher. nm-tools can
    be used to list information about NetworkManager, devices, and wireless networks.


    From a list of all adapters currently installed on the system, NetworkManager
    will first try a wired and then a wireless adapter. Wireless adapters that support
    wireless scanning are preferred over ones that cannot. NetworkManager does not
    try to keep a connection up as long as possible, meaning that plugging into a
    wired network will switch the connection to the wired network, away from the wireless
    one.


    For wireless networking support, NetworkManager keeps two lists of wireless networks:
    a *Trusted list*, and a *Preferred list*. The trusted list contains networks the
    user specifically adds to it, while the preferred list contains networks the user
    forces NetworkManager to connect to.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Since trusted and preferred networks are user-specific, there must be some
    mechanism of getting and storing this information per user. This is achieved with
    a desktop-level per-user process, **nm-applet** or KNetworkManager in KDE. NetworkManager
    communicates over DBUS with these user-level processes.


    Switching to NetworkManager is done by starting YaST and selecting **Network Devices
    > Network Cards**. In the Network Setup Method dialog, you select **User Controlled**
    with NetworkManager:


    # Figure 3-9


    ![](img/63e88022bf135307e3eac051ad238b5b_163_0.png)


    The following dialogs of this module are the same for both setup methods.


    When selecting **User Controlled with NetworkManager**, YaST sets the variable
    **NETWORKMANAGER** in */etc/sysconfig/network/config* to “yes”.'
  merge: -1
  img_proc: true
