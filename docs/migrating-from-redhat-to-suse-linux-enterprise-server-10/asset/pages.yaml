- pgno: 159
  md: '# Objective 3  Configure Host Name and Name Resolution


    The host name and the name resolution can also be set up manually. In this objective,
    you learn how to do the following:


    +   - Set the Host and Domain Name

    +   - Configure Name Resolution

    +   - Files Holding the Network Configuration


    # Set the Host and Domain Name


    The host name is configured in the file /etc/HOSTNAME.


    The content of the file is similar to the following:


    ```

    ```

    da2.digitalairlines.com

    ```

    ```


    The file contains the fully qualified domain name of the system, in this case,
    **da2.digitalairlines.com**.


    # Configure Name Resolution


    The name resolution is configured in the file /etc/resolv.conf.


    The content of the file is similar to the following:


    ```

    ```

    search digitalairlines.com

    nameserver 10.0.0.254

    nameserver 10.10.0.1

    nameserver 10.0.10.1

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The file contains 2 types of entries:


    +   * **search.** The domain name in this option is used to complete incomplete
    host names. For example, if you look up the host name da3, the name is automatically
    completed to the fully qualified domain name da3.digitalailines.com.


    +   * **nameserver.** Every entry starting with nameserver is followed by an IP
    address of a name server. You can configure up to 3 name servers. If the first
    name server fails, the next one is used.


    # Files Holding the Network Configuration


    The following table lists the files used to store the network configuration on
    RHEL and SUSE Linux Enterprise Server 10. The content of the files is not exactly
    identical, but the table should nevertheless help you to find the information
    you are looking for.


    | Table 3-1 | RHEL | SLES 10 |

    | :--- | :--- | :--- |

    | | /etc/sysconfig/networking/devices/ifcfg-ethx, hard-linked to /etc/sysconfig/networking/profiles/default/ifcfg-ethx,
    and to /etc/sysconfig/network-scripts/ifcfg-ethx. | /etc/sysconfig/network/ifcfg-eth\*-id-macaddress
    |

    | | /etc/sysconfig/networking/profiles/default/hosts, hard-linked to /etc/hosts
    | /etc/hosts |

    | | /etc/sysconfig/networking/profiles/default/resolv.conf, hard-linked to /etc/resolv.conf
    | /etc/resolv.conf |

    | | /etc/nsswitch.conf | /etc/nsswitch.conf |

    | | /etc/sysconfig/network | /etc/HOSTNAME |

    | | /etc/sysconfig/network-scripts/ | /etc/sysconfig/network/scripts/ |'
