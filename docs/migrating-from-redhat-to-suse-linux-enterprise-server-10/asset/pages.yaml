    # The relocated Lookup Table


    You can use the /etc/postfix/relocated lookup table to return the corresponding
    bounced email, with a note of the new address of the desired addressee, to senders
    of emails to users that no longer exist on this system.


    The following topics are described:


    +   * Activate the Lookup Table


    +   * The relocated Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.cf by the entry


    ```

    relocated_maps = hash:/etc/postfix/relocated

    ```'
  merge: -1
