    |  | modules that can be loaded | `/etc/modprobe.conf.local` |


    Note: SUSE Linux Enterprise Server uses `/filename-local` files for a lot of items.
    The use of a _local file ensures that when a security patch or fix for a bug comes
    out and the updated package is applied to the system, the _local file that matches
    up with the configuration file will not be touched; it is solely the realm of
    the system administrator.


    # **The SUSE Linux Enterprise Server Boot Process**


    SUSE Linux Enterprise Server uses a boot process that is similar to the process
    employed by Red Hat Enterprise Linux in many ways, but while Red Hat Enterprise
    Linux uses the kudzu tool, SUSE Linux Enterprise Server uses the linresrc script
    to do the system initialization tasks.


    The following list explains the SUSE Linux Enterprise Server boot process in detail.


    +   1. Power-on self-tests

    +   2. Initially detects and sets up hardware (such as PNP)

    +   3. Locates the MBR on the bootable device

    +   4. Reads the MBR from the bootable device

    +   5. BIOS starts the boot manager

    +   6. Boot Manager (such as GRUB) loads the Kernel and Initial (Initial RAM Disk)

    +   7. Boot Manager starts the Kernel

    +   8. Kernel decompresses itself and then takes control of the booting of the
    system

    +   9. Note: if the initial root ext3, is it mounted as the root of the system.
    The Linuxrc script then loads the needed drivers to access the real system root
    and initrd is unmounted.

    +   10. Kernel mounts the real system root

    +   11. Kernel checks and sets up the console, reads RDS settings and initializes
    basic hardware interfaces

    +   12. Drivers probe and initialize existing hardware

    +   13. Kernel now controls the system, including hardware access and allocation
    of CPU time and memory

    +   14. Kernel loads the init program, which becomes PID 1

