- pgno: 285
  md: "If **POSTFIX_LOCALDOMAINS** is empty, the variable is set to $my*hostname*,\
    \ localhost.$my*domain* by **SUSEconfig**.\n\n+   POSTFIX_NULLCLIENT. A nullclient\
    \ is a host that can only send mail over the network, does not receive mail over\
    \ the network, and does not deliver any mail locally.\n+   \n+   If you enter\
    \ **yes**, the variable mydestination in the file /etc/postfix/main.cf will remain\
    \ empty after running **SuSEconfig**.\n+   \n+   The default entry is **no**.\n\
    \n+   POSTFIX_DIALUP. If this value is set to **yes**, emails that cannot be delivered\
    \ locally are not sent to their destination until the command sendmail -q is run.\n\
    +   \n+   The setting is useful for dial-up systems; otherwise, error messages\
    \ would appear when sending emails if the system is not online, or a connection\
    \ would be established for every email message if dial-on-demand is used.\n+ \
    \  \n+   The value **no** leads to an immediate attempt to deliver any emails\
    \ waiting for delivery.\n+   \n+   If this variable is assigned the value **yes**,\
    \ the line defer_transports = smtp will be added to the file /etc/postfix/main.cf\
    \ by running **SuSEconfig**.\n\n+   POSTFIX_NODNS: If this variable is set to\
    \ **yes**, Postfix will not carry out any DNS lookups for the sender and recipient\
    \ domains when processing emails.\n+   \n+   If this variable is assigned the\
    \ value **yes**, the variable disable_dns_lookups = yes in the file /etc/postfix/main.cf\
    \ will be activated by running **SuSEconfig**.\n\n+   POSTFIX_CHROOT. If this\
    \ variable is set to **yes**, the services will be run in a chroot environment,\
    \ if possible. You can find the chroot environment in /var/spool/postfix.\n+ \
    \  \n+   If the variable is set to **no** (default), all Postfix processes will\
    \ run in the normal environment."
  merge: -1
  img_proc: true
- pgno: 286
  md: '+   POSTFIX_UPDATE_CHROOT_JAIL. If SuSEconfig is to set up the chroot environment,
    this value should be set to yes. By default, the variable is set to no.


    +   POSTFIX_LAPTOP. Some Postfix services access FIFOs frequently, thus preventing
    the hard disk from spinning down. However, if this is desired on notebooks for
    power-saving purposes, the variable can be set to yes.


    +   POSTFIX_UPDATE_MAPS. If SuSEconfig is to create the database files from the
    corresponding lookup tables, this variable should be set to yes (default).


    +   POSTFIX_MAP_LIST. If POSTFIX_UPDATE_MAPS is set to yes, you can select the
    lists Postfix should support here.


    +   POSTFIX_RBL_HOSTS. Here you can specify a comma-separated list of host names
    from which RBLs (Realtime Blackhole List) can be obtained. No mail is accepted
    from clients that are these lists. This entry makes sense only if POSTFIX_BASIC_SPAM_PREVENTION
    is not set to off.


    +   POSTFIX_BASIC_SPAM_PREVENTION. Here, specify how strict filter rules for UCE
    (unsolicited commercial email) should be configured. Possible levels are off,
    medium, and hard. More details you can find at http://www.postfix.org/uce.html.


    +   POSTFIX_MDA. Here, specify an MDA with which Postfix should cooperate. The
    entries are


    +   procmail. Use Procmail to deliver mail locally.


    +   cyrus. Use lmtp to deliver to cyrus-imapd.


    +   local. Use Postfix local MDA.


