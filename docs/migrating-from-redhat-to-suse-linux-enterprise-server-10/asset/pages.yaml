- pgno: 430
  md: 'You can see that there is a new SCSI device available (/dev/sdb). You can create
    partitions using fdisk, create file systems on the partitions and mount them.


    With the command lsscsi you can see all available SCSI devices.


    In case you want to see whether any active iSCSI connection exists, have a look
    into the file /proc/net/iet/session on the server hosting the target using cat.
    You can see all iSCSI connections to a target on this host, as in the following
    example:


    ```

    da3:~ # cat /proc/net/iet/session

    tid:1

    name:iqn.2006-10.com.digitalairlines:d3d43303-8b2c-43df-83ea-6721942677e2

    sid:281474980708864 initiator:iqn.1996-04.de.ruse:01.427f8cb385f5

    cid:0 ip:127.0.0.1 state:active hd:none dd:none

    ```


    You can see that a connection from the IP address 127.0.0.1 is established to
    the Target with the id 1 (tid).


    While it is possible to have more than one connection you should keep in mind
    that it is not recommended to mount an iSCSI target more than once without any
    precautions (like a cluster file system on top of the iSCSI target).


    # Mount iSCSI Targets Automatically at Boot Time


    On the server (iSCSI target) side you have to make sure that the iscsi target
    service will be started automatically after a reboot. Use the command chkconfig
    iscsitarget on (or inserv iscsitarget) to do this.


    On the client (iSCSI initiator) side the open-iscsi daemon has to start automatically
    at boot time. This is achieved using the command chkconfig open-iscsi on.


    If you checked the button When booting in the respective YaST dialog, it is not
    necessary to issue the above chkconfig commands.


    1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'Generally you enter all the devices which should be mounted automatically at
    boot time into the file /etc/fstab. One problem you face with iSCSI devices is
    that no network is available when the file /etc/fstab is read during the boot
    process. Another problem is that you do not know for sure which local SCSI device
    will be used for the iSCSI target.


    There is a solution for both problems. To be sure that the iSCSI device will be
    mounted to the same directory every time you have to use the UUID (Unique Universal
    ID) from the partition. To establish the UUID of a device use the following command:


    ```

    da3:~ # udevinfo -q symlink -n /dev/sdb1

    disk/by-id/iscsi-149454000000000000000001000005d9a01000 200800-part1

    disk/by-path/ip-127.0.0.1:3260-iscsi-ign.2006-10.com.digit alairlines:d3d4303-8b2c-43df-83ea-6721942677e2-part1

    disk/by-uuid/8b4dcb80-372d-44ba-a35b-96b5619b8237

    ```


    In this example, the last line contains the UUID of the device /dev/sdb1. Now
    you can create an entry like the following in /etc/fstab to mount this iSCSI device
    to the /iscsi directory:


    ```

    /dev/disk/by-uuid/8b4dcb80-372d-44ba-a35b-96b5619b8237

    /iscsi auto hotplug,defaults 0 0

    ```


    With the mount option hotplug the first problem is also solved. This option signifies
    that the hotplug daemon, which is started after the network, will take care of
    this mount.'
  merge: -1
  img_proc: true
