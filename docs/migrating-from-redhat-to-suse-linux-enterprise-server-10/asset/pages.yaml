- pgno: 333
  md: '# Objective 1  Understand the Difference between SELinux and AppArmor


    +   - Discretionary Access Control

    +   - Linux Security Modules

    +   - Mandatory Access Control


    # Discretionary Access Control


    With Discretionary Access Control (DAC) the user (subject) has complete control
    over the files (objects) he owns or the programs he executes.


    DAC describes which files a process can access based on the UID of the process.
    In general, the UID of the process is the same as the UID of the user who started
    the process. An exception are binaries where the SUID bit is set.


    One of the main problems with DAC Process security is that if a process is hacked
    or is out of control for some reason, this process can access all the files which
    are owned by the process’ UID as well as the files belonging to other UIDs which
    it may access according to the file permissions set.


    The command chroot is a way to restrict a process from accessing selected files.
    However, the chroot command is known for its limitations and restrictions.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# ## Linux Security Modules


    To solve this problem, the Linux Security Modules (LSM) were developed. In an
    LSM enabled system a process (Subject) can only access the files (Objects) defined
    in a policy. This policy is set by the system administrator and enforced by the
    operating system kernel; access to files is no longer at the discretion of the
    user.


    According to the kernel documentation, the LSM kernel patch provides a general
    kernel framework to support security modules. In particular, the LSM framework
    is primarily focused on supporting access control modules, although future development
    is likely to address other security needs such as auditing. By itself, the framework
    does not provide any additional security; it merely provides the infrastructure
    to support security modules.


    The best known Linux tools based on LSM are Security Enhanced Linux (SELinux,
    used in RHEL) and AppArmor (used in SLES). With these tools you can define with
    high granularity which process can access which file with which permissions. These
    rules are enforced by the kernel and are independent of the UID of the process
    and the permissions set in the file system.


    To define these policies you must have a thorough understanding of the respective
    applications and the way they work.


    This kind of access control is also known as Mandatory Access Control (MAC).'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# **Mandatory Access Control**


    In contrast to Discretionary Access Control, where the user determines the permissions
    granted to the object she creates, Mandatory Access Control permissions are set
    by the administrator according to a policy.


    The following is described:


    +   - SELinux

    +   - AppArmor


    # **SELinux**


    Mandatory access control in SELinux is possible in two ways: *Type Enforcement
    (TE)* and *Role Based Access Control (RBAC)*. To learn more about these, we recommend
    the web site of the National Security Agency at <http://www.nsa.gov/selinux/>.
    The NSA initiated the SELinux project.


    The main configuration files for SELinux on an RHEL system are stored in the directory
    `/etc/selinux/`.


    SELinux is normally activated by the init process at the boot time. Activation
    during boot can be disabled by entering the boot parameter `selinux=0` or by setting
    the SELINUX parameter in `/etc/selinux/config` to `disabled`.


    There are two types of SELinux policies: *targeted* (only targeted network daemons
    are protected) and *strict* (full SELinux protection). Only one type of policy
    can be active in the Kernel at a time. Which policy is used when activating SELinux
    is defined by the parameter **SELINUXTYPE** in the file `/etc/selinux/config`.


    Policies are created using the m4 macro language. The sources are kept in `/etc/selinux/<POLICY-NAME>/src/policy/`,
    while the binaries can be found in `/etc/selinux/<POLICY-NAME>/policy/`.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Policies are managed by the Security-Server which is a core SELinux component.
    Messages from the Security-Server are stored in the /var/log/messages.


    Using the command **ls -Z** you can view the security context used for a file.
    Using the **-Z** option in combination with the **ps** command shows the security
    context of a running process.


    The command **setenforce** is used to switch SELinux from “on” to “warn only”
    and vice versa. **system-config-securitylevel** is a tool that allows to change
    SELinux configuration parameters. The command **selsnxenabed** can be used to
    check the status of SELinux on a running system. The return code 0 signifies that
    SELinux is enabled.


    # ## AppArmor


    The AppArmor kernel modules (apparmor and aamatch_pctre) hook into the Linux Security
    Modules Framework of the kernel.


    **Profiles** in **/etc/apparmor.d/** are used to configure which application may
    access and execute which files.


    AppArmor has to be activated before the applications it controls are started.
    Applications already running when AppArmor is activated are not controlled by
    AppArmor, even if a profile has been created for them. Therefore, AppArmor is
    activated early in the boot process by **/etc/init.d/boot.apparmor**.


    In a default installation of SUSE Linux Enterprise Server 10, AppArmor is actively
    protecting several services using a set of profiles provided by Novell. Using
    the provided YaST modules or command line tools, you can easily adapt these to
    your needs and create new profiles for additional applications you want to protect.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'As a general rule, you should confine programs that grant privilege, i.e.,
    programs that have access to resources that the person using the program does
    not have:


    +   Network agents—programs that have open network ports

    +   - Cron jobs

    +   - Web applications


    > At some points in the documentation of AppArmor you will find AppArmor’s former
    name, Subdomain.


    AppArmor protection can be turned on and off using the command rcaparmor start
    and stop, respectively. Single applications can be toggled between enforce (AppArmor
    limits what an application may do) and complain (only log entries are created)
    mode with commands of the same name.


    # 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Objective 2 Create and Manage AppArmor Profiles


    SUSE Linux Enterprise Server 10 comes with AppArmor Profiles for various applications,
    such as named, ntpd, nscd, and others.


    The profiles are contained in */etc/apparmor.d/*. The filename of the profile
    represents the filename of the application including the path, with “/” being
    replaced by a “:”. The profile for /usr/sbin/squid would be contained in /etc/apparmor.d/usr.sbin.squid.


    A profile can include other files with an **#include** statement. The directory
    */etc/apparmor/abstractions/* contains several files that are intended to be included
    in profiles, depending on the kind of program to be protected by AppArmor. There
    are abstractions for files that should be readable or writable by all programs
    (base), for name service-related files like */etc/passwd* (nameservice), for files
    related to console operations (console), and others.


    The profiles are plain text files and it is therefore possible to create and modify
    them with any text editor. However, command line tools as well as a YaST module
    greatly simplify the process of creating profiles.


    In addition to the active profiles in */etc/apparmor.d/*, several profiles are
    already prepared in */etc/apparmor/profiles/extras/* that you can customize to
    your needs and copy to */etc/apparmor.d/* to activate them.


    To successfully administer AppArmor, you need to


    +   * Understand Profiles and Rules

    +   * Administer AppArmor Profiles with YaST

    +   * Administer AppArmor Profiles with Command Line Tools'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# ### Understand Profiles and Rules


    Novell AppArmor profiles contain two types of AppArmor rules: path entries and
    capability entries. Path entries specify what a process can access in the file
    system. AppArmor, by default, limits the capabilities a process is given (see
    man apparmor). Capability entries are used to specify specific POSIX capabilities
    (man 7 capabilities) a process is granted, overriding the default limitation.


    Other files containing AppArmor rules can be pulled in with \#\include statements.


    As an example, let’s have a look at the profile for /sbin/klogd, the kernel log
    daemon (/etc/apparmor.d/sbin.klogd):


    ```

    ```python

    # Profile for /sbin/klogd


    #include <tunables/global>


    /sbin/klogd {

    #include <abstractions/base>


    capability sys_admin,


    /boot/System.map*     r,

    /proc/kmsg           r,

    /sbin/klogd          rmx,

    /var/log/boot.msg    rwl,

    /run/klogd.pid       rwl,

    }

    ```

    ```


    Comments (as in line1) start with a \# sign,


    \#\include (as in line 3 and 6) is not interpeted as a comment, but is used to
    include rules from other files. The path as given above is relative to /etc/apparmor.d/.'
  merge: -1
  img_proc: true
- pgno: 340
  md: "/etc/apparmor.d/tunables/global (line 3) is used to include definitions that\
    \ should be available in every profile. By default, it just includes /etc/apparmor.d/tunables/home,\
    \ which defines the variables @ {HOMEDIRS} and @ {HOME}. These variables are used\
    \ in many profiles.\n\nThe directory /etc/apparmor.d/abstractions/ contains files\
    \ with general rules grouped by common application tasks. These include, for instance,\
    \ access to files all applications need (base), access to authentication mechanisms\
    \ (authentication), graphics environments (kde, gnome), name resolution (nameservice),\
    \ and others. Instead of having these redundantly specified in several profiles,\
    \ they are defined at one point and included in the profiles that need them.\n\
    \nLine 5 in the example above gives the absolute path to the program confined\
    \ by AppArmor. The rules as well as any includes follow within the curly braces\
    \ {}. \n\nLine 8 enables the capability sys_admin for this program. Any other\
    \ capabilities needed would be listed in separate lines starting with capability.\n\
    \nThe remaining lines list files and directories, and the access permission granted.\n\
    \nWithin lines listing files and directories, the following wildcards can be used:\n\
    \n+   - \\*. Substitutes any number of characters, except /.\n+   - \\*\\*. Substitutes\
    \ any number of characters, including / . Use \\*\\* to include subdirectories.\n\
    +   - ?. Substitutes any single character, except /.\n+   - [abc]. Substitutes\
    \ a, b, or c.\n+   - [a-d]. Substitutes a, b, c, or d.\n+   - {ab,cd}. Substitutes\
    \ either ab or cd."
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The permissions granted can be


    +   *   **r.** Allows the program to have read access to the resource. Read access
    is required for scripts, and an executing process needs this permission to allow
    it to dump core or to be attached to with ptrace.


    +   *   **w.** Allows the program to have write access to the resource. Files
    must have this permission if they are to be unlinked (removed).


    +   *   **L** Link mode mediates access to symlinks and hardlinks and grants the
    privilege to unlink (remove) files.


    +   *   **m.** Allow executable mapping. This mode allows a file to be mapped
    into memory using mmap(2)''s PROT_EXEC flag. This flag marks the pages executable;
    it is used on some architectures to provide non-executable data pages, which can
    complicate exploit attempts. AppArmor uses this mode to limit which files a well-behaved
    program (or all programs on architectures that enforce non-executable memory access
    controls) may use as libraries, to limit the effect of invalid -L flags given
    to ld(1) and LD_PRELOAD, LD_LIBRARY_PATH given to ld.so(8).


    +   *   **ix.** Inherit Execute Mode. The executed resource inherits the current
    profile.


    +   *   **px.** Discrete Profile Execute Mode. This mode requires that a profile
    be defined for the resource executed. If there is no profile defined, access is
    denied.


    +   *   **Px.** Discrete Profile execute mode -- scrub the environment. **Px**
    allows the named program to run in **px** mode, but AppArmor will invoke the Linux
    Kernel''s unsafe_exec routines to scrub the environment, similar to setup programs.
    (See man 8 ld.so for some information on setuid/setgid environment scrubbing.)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '+   - **ux**. Unconstrained Execute Mode. Allows the program to execute the
    resource without any Novell AppArmor profile being applied to the executed resource.
    *This should only be used in rare exceptions.*

    +   - **Ux**. Unconstrained execute -- scrub the environment. As ux, it should
    only be used in rare exceptions.


    The last five, ix, px, Px, ux, and Ux, cannot be combined.


    The manual page covering the syntax of the profiles is

    man **5 apparmor.d**


    # Administer AppArmor Profiles with YaST


    The profile for /sbin/klogd, given in the example above, is a rather short profile.
    When you browse through the profiles in

    /etc/apparmor.d/ or /etc/apparmor/profiles/extras/ you will see that these profiles
    can be much more complex.


    AppArmor comes with several tools that help to create and maintain AppArmor profiles.
    YaST modules exist that provide a graphical interface to those tools.


    You can accomplish various tasks with YaST:


    +   - Create a New Profile

    +   - Update a Profile

    +   - Delete a Profile'
  merge: -1
  img_proc: true
