- pgno: 132
  md: 'After selecting **Next**, the following dialog appears:


    # **Figure 3-4**


    ![](img/63e88022bf135307e3eac051ad238b5b_132_0.png)


    From this dialog you enter the following information to integrate the network
    device into an existing network:


    +   * **Automatic address setup (via DHCP)**. Select this option if the network
    card should receive an IP address from a DHCP server.

    +   * **Static address setup**. If you choose this option, you need to enter the
    IP address of the network interface or of the computer in the network under **IP
    Address**.


    Each computer in the network has at least one address for each network interface,
    which must be unique in the entire network. According to the currently valid standard
    (IPv4), this address consists of a sequence of four bytes, separated by dots (such
    as 10.10.0.69).'
