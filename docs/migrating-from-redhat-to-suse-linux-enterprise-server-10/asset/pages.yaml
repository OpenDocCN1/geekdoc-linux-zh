    ```


    You can also view this information in the file /proc/mounts.


    # Mount a File System


    You can use the command **mount** to manually mount a file system. The general
    syntax for mounting a file system with mount is


    ```

    mount [-t *file_system_type*] [-o *mount_options*] *device*

    *mount_point_directory*

    ```


    By using mount, you can override the default settings in /etc/fstab. For example,
    entering the following mounts the partition /dev/hda9 to the directory /space/:


    ```

    mount /dev/hda9 /space

    ```


    You do not usually specify the file system type because it is recognized automatically
    (using magic numbers in the superblock, or simply by trying different file system
    types; see **man mount** for details).'
  merge: -1
  img_proc: true
- pgno: 196
  md: "The following are some of the options you can use when mounting a file system\
    \ with the command mount or by entering them in /etc/fstab:\n\n+   ■ remount.\
    \ This option causes file systems that are already mounted to be mounted again.\n\
    +   When you make a change to the options in /etc/fstab, you can use remount to\
    \ incorporate the changes.\n+   \n+   ■ rw, ro. These options indicate whether\
    \ a file system should be writable (rw) or only readable (ro).\n+   \n+   ■ sync,\
    \ async. These options set synchronous (sync) or asynchronous (async) input and\
    \ output in a file system. The default setting is async.\n+   \n+   ■ atime, noatime.\
    \ These options set whether the access time of a file is updated in the inode\
    \ (atime) or not (noatime). The option noatime should improve the performance.\n\
    +   \n+   ■ nodev, dev. The nodev option prevents device files from being interpreted\
    \ as such in the file system.\n+   \n+   ■ noexec, exec. You can prohibit the\
    \ execution of programs on a file system with the option noexec.\n+   \n+   ■\
    \ nosuid, suid. The nosuid option ensures that the suid and sgid bits in the file\
    \ system are ignored.\n\nSome options only make sense in the file /etc/fstab.\
    \ These options include the following:\n\n+   ■ auto, noauto. File systems set\
    \ with the option noauto in the file /etc/fstab are not mounted automatically\
    \ when the system is booted.\n+   \n+   ■ user, nouser. This option lets users\
    \ mount the file system. Normally, this is a privilege of the user root.\n+  \
    \ \n+   ■ defaults. This option causes the default options rw, suid, dev, exec,\
    \ auto, nouser, and async to be used."
  merge: -1
  img_proc: true
- pgno: 197
  md: "The options **noauto** and **user** are usually combined for removable media\
    \ such as floppy disk or CD-ROM drives.\n\n# Unmount a File System\n\nOnce a file\
    \ system is mounted, you can use the **umount** command (without an “-n”) to unmount\
    \ the file system.\n\nYou can unmount the file system by using umount with the\
    \ device or the mount point.\n\nFor example to unmount a CD file system mounted\
    \ at /media/cdrecorder, you could enter one of the following:\n\n+   *   umount\
    \ /media/cdrecorder\n+   \n+       or\n+   \n+   *   umount /dev/hdb\n\nIn order\
    \ to unmount the file system, no application or user may use the file system.\
    \ If it is being used, Linux sees the file system as being “busy” and will refuse\
    \ to unmount the file system.\n\n> To help determine the processes that are acting\
    \ on a file or directory, you can use the fuser utility.\n\nOne way to make sure\
    \ the file system is not busy is to enter **cd /** at the shell prompt before\
    \ using the umount command. This command takes you to the root of the file system.\n\
    \nHowever, there might be times when the system (kernel) still sees the file system\
    \ as busy, no matter what you try to do.\n\nIn these cases, you can enter **umount\
    \ -f** to force the file system to unmount. However, we recommend using this only\
    \ as a last resort, as there is probably a reason why the kernel thinks the file\
    \ system is still mounted."
  merge: -1
  img_proc: true
