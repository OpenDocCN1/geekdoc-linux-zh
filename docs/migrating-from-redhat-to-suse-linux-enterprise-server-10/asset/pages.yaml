- pgno: 313
  md: '# Use Postfix Tools


    Apart from the previously mentioned tools, Postfix also has a whole range of other
    useful administration tools that can make life considerably easier for a postmaster.


    This section briefly introduces the administration tools for Postfix:


    +   - **newaliases**. Converts the ASCII file `/etc/aliases` to the hash table
    `/etc/aliases.db`.


    +   - **mailq**. Lists all emails in the mail queues that have not yet been sent.


    +   - **postalias**. Converts the ASCII file `/etc/aliases` to the hash table
    `/etc/aliases.db`. Same as **newaliases**.


    +   - **postcat**. Displays the contents of a file from the queue directories
    in a readable form.


    +   - **postconf**. Without any parameters, this tool displays the values of all
    variables defined in the file `/etc/postfix/main.cf` as well as the values used
    by the standard variables. To modify variables directly, enter

    +     `postconf -e key=value`

    +   These changes are automatically integrated in the file `main.cf`.


    +   - **postdrop**. This is run automatically by using the `sendmail` command,
    if `sendmail` cannot write any files to the maildrop directory because of missing
    world-writable permissions. It saves the forwarded email as `sgid maildrop`.


    +   - **postfix**. Enables configuration errors to be found (**postfix check**),
    forces email from the deferred queue to be delivered immediately (**postfix flush**),
    or rereads the Postfix configuration files (**postfix reload**).


    +   - **postmap**. Generates the hash tables for the lookup tables in the directory
    `/etc/postfix/`.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '**postsuper**. Checks the file structure in the queue directories and removes
    unneeded files and directories (**postsuper -s**) or deletes files and directories
    that have been left after a system crash and are useless (**postsuper -p**). Individual
    email messages can be removed from the mail queues with **postsuper -d*ID***.
    In general, **postsuper** removes all files that are not normal files or directories
    (such as symbolic links).


    > Run the command **postsuper -s** immediately before starting the Postfix system.


    > For more information about these tools, see the man page **man 1 Postfix-Tool**.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# # Objective 2 Apache Web Server


    To set up a Apache web server on SUSE Linux Enterprise Server, you need to know
    the following:


    +   - Setup a Basic Web Server

    +   - Configure Virtual Hosts


    Other configuration tasks, like limiting access to the web server with .htaccess
    files, PHP, etc., are specific to Apache and do not differ substantially between
    RHEL 4 and SLES 10.


    # ## Setup a Basic Web Server


    +   - The Basic Functionality of a Web Server

    +   - Install a Basic Apache Web Server

    +   - Understand the Structure and the Basic Elements of the Apache Configuration
    Files

    +   - Understand the Default Apache Configuration


    # ## The Basic Functionality of a Web Server


    A web server delivers data that is requested by a web browser. The data can have
    different formats such as HTML files, image files, Flash animations, or sound
    files.


    Web browsers and web servers communicate using HTTP (Hyper Text Transfer Protocol).


    In addition to delivering data to the web browser, a web server can perform tasks
    such as limiting access to specific web pages, logging access to a file, and encrypting
    the connection between a server and browser.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# ## Install a Basic Apache Web Server


    To set up a basic Apache web server, you need to do the following:


    +   - Install the Required Software Packages

    +   - Start and Test the Web Server

    +   - Locate the DocumentRoot of the Web Server


    # ### Install the Required Software Packages


    To run a basic Apache web server, you need to install the following packages with
    YaST:


    +   - **apache2**. The basic web server software.

    +   - **apache2-prefork**. An additional Apache package that influences the multiprocesssing
    behavior of the web server.

    +   - **apache2-example-pages**. Sample HTML pages.


    When you install the packages listed above, YaST prompts you to also install one
    or more additional packages required by Apache. Confirm the additional package
    installation by selecting **OK** to resolve all dependencies of the Apache packages.


    # ### Start and Test the Web Server


    After installing the required software, you need to start the web server. Do this
    as the root user by entering the following:


    ```

    rcapache2 start

    ```


    As with all services, enter the following to stop the web server:


    ```

    rcapache2 stop

    ```'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'If you want the web server to start up at boot time, you need to enter the
    following:


    **insserv apache2**


    To test whether the web server is properly installed, open a web browser and enter
    the following address:


    **http://localhost/**


    The browser displays the following page:


    ![](img/63e88022bf135307e3eac051ad238b5b_317_0.png)


    If your SUSE Linux Enterprise Server 10 is connected to a network, you (and other
    hosts on the network) can remotely access the web server by entering the following:


    **http://your_system_IP_adress/**


    If your network provides a DNS server, you can use the hostname instead of the
    IP address.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Locate the DocumentRoot of the Web Server


    The default directory of the data provided by Apache is /srv/www/htdocs/.


    This directory is also called the DocumentRoot of the web server. After the installation,
    it contains the Apache example pages, which are displayed above.


    You can replace the data in the DocumentRoot directory to display your own web
    server content. Because the web server runs with the user id wwwrun, you have
    to make sure that this user has read access to files in the DocumentRoot directory.


    If you create subdirectories in DocumentRoot, you can access those subdirectories
    with the following web address scheme:


    http://your_server/name_of_subdirectory


    If no specific file is requested in the address, Apache looks for a file with
    the name index.html. You can change the name of this default file in the Apache
    configuration files.'
  merge: -1
  img_proc: true
