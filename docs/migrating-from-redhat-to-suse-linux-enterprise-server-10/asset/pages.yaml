- pgno: 189
  md: 'To view the available format options, select **Options**; the options shown
    depend on the file system you choose from the drop-down menu. We recommend keeping
    the default settings for most implementations. To return to the main format menu,
    select **OK**.


    If you want to encrypt all data saved to the partition, select **Encrypt file
    system**. Encrypting a file system only prevents unauthorized mounting; once mounted
    the files are accessible like any other file on the system. You should only use
    this option for non-system partitions such as user home directories.


    Select **Fstab Options** to edit the fstab entry for this partition.


    ![](img/63e88022bf135307e3eac051ad238b5b_189_0.png)


    These options are saved in `/etc/fstab` and are used when mounting the file system.
    In most cases the defaults offered don’t need to be changed.


    A description of each option is included in the left frame of the **Fstab options**
