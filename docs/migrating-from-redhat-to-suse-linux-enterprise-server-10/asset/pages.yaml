- pgno: 428
  md: 'After selecting **Next**, the **Connected Targets** tab displays your configured
    iSCSI devices.


    With the **Toggle Start-Up** button you can switch between **automatic** and **manual**,
    which defines how the device is activated.


    Select **Finish** to write the settings to the system.


    The client configuration is stored in the file /etc/iscsi.conf and within the
    directory /var/lib/open-iscsi/ in the database files discovery.db and node.db.
    The tool to use for manual configuration of these files is iscsiadm.


    ![](img/63e88022bf135307e3eac051ad238b5b_428_0.png)'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'The name of the iSCSI initiator is contained in the file**/etc/initiatorname.iscsi**.


    ```

    da3:~$ cat /etc/initiatorname.iscsi


    # DO NOT EDIT OR REMOVE THIS FILE!


    # If you remove this file, the iSCSI daemon will not start.


    # If you change the InitiatorName, existing access control lists


    # may reject this initiator. The initiatorName must be unique


    # for each iSCSI initiator. Do NOT duplicate iSCSI InitiatorNames.


    InitiatorName=iqn.1996-04.de.suse:01.42:0cb385f5

    ```


    A description of how iscsid, iscsiadm and the configuration files play together
    is contained in**/usr/share/doc/packages/open-iscsi/README**.


    In the file**/var/log/messages**you should see entries similar to the following:


    ```

    Oct 4 11:55:56 da3 kernel: scsi3 : iSCSI Initiator over TCP/IP, v1.0-595


    Oct 4 11:55:56 da3 kernel: sess_param (173) 1 1 1 8192 8192 262144 65536 2 0 1
    1 1 0 1 1


