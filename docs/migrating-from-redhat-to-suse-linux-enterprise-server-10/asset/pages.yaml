- pgno: 152
  md: 'If you want **ethtool** to modify any settings, list the options here; if no
    options are listed, **ethtool** is not called.


    The file **/etc/sysconfig/network/ifcfg.template** contains a template that you
    can use as a base for device configuration files. It also has comments explaining
    the various options.


    # **Configure a Device Dynamically with DHCP**


    If you want to configure a device by using a **DHCP** server, you set the **BOOTPROTO**
    option to **dhcp** as shown in the following:


    ```

    BOOTPROTO=''dhcp''

    ```


    When the device is configured by using **DHCP**, you don''t need to set any options
    for the network address configuration in the file. If there are any settings,
    they are overwritten by the settings of the DHCP server.


    # **Start and Stop Configured Interfaces**


    To apply changes to a configuration file, you need to stop and restart the corresponding
    interface. You can do this with the commands **ifdown** and **ifup**.


    For example, entering **ifdown eth0** disables the device eth0. **ifup eth0**
    enables eth0 again.


    When the device is restarted, the new configuration is read from the configuration
    file.


    > Configuring the interfaces with IP addresses, routes, etc. with the ip tool
    requires an existing device setup, including a correctly loaded kernel module.
    This is usually done at boot time by /sbin/hwup, using the configuration contained
    in files in the directory /etc/sysconfig/hardware/. Information is available in
    the manual page for hwup.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Under certain circumstances physical network devices can change the interface
    name, for instance the interface that used to be called eth0 now becomes eth1
    and vice versa. Sometimes this happens from one boot to the next, even without
    any physical changes on the hardware. Information on how to achieve persistent
    interface names is contained in the file `/usr/share/doc/packages/sysconfig/README.Persistent_Interface_Names.`


    # ## Set Up Routing with the ip Tool


    You can use the ip tool to configure the routing table of the Linux kernel. The
    routing table determines the path IP packets use to reach the destination system.


    Because routing is a very complex topic, this objective only covers the most common
    routing scenarios.


    You can use the ip tool to perform the following tasks:


    +   * View the Routing Table

    +   * Add Routes to the Routing Table

    +   * Delete Routes from the Routing Table


    As changes made with ip are lost with the next reboot, you also have to know how
    to:


    +   * Save Routing Settings to a Configuration File'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# View the Routing Table


    To view the current routing table, enter **ip route show**. For most systems,
    the output looks similar to the following:


    ```

    da2:~ # ip route show

    10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.2

    169.254.0.0/16 dev eth0 scope link

    127.0.0.0/8 dev lo scope link

    Default via 10.0.0.254 dev eth0

    ```


    Every line represents an entry in the routing table. Each line in the example
    is shown and explained below:


    +   *   **10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.2**

    +       This line represents the route for the local network. All network packets
    to a system in the same network are sent directly through the device **eth0**.


    +   *   **169.254.0.0/16 dev eth0 scope link**

    +       This line shows a network route for the **169.254.0.0** network.

    +       Hosts can use this network for address auto configuration.

    +       SLES 10 automatically assigns a free IP address from this network when
    no other device configuration is present. The route to this network is always
    set, especially when the system itself has no assigned IP address from that network.


    +   *   **127.0.0.0/8 dev lo scope link**

    +       This is the route for the loopback device.


    +   *   **default via 10.0.0.254 dev eth0**

    +       This line is the entry for the **default** route. All network packets
    that cannot be sent according to the previous entries of the routing table are
    sent through the gateway defined in this entry.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Depending on the setup of your machine, the content of the routing table varies.
    In most cases, you have at least 2 entries in the routing table:


    +   - One route to the local network the system is connected to

    +   - One route to the default gateway for all other packets


    # Add Routes to the Routing Table


    The following are the most common tasks you do when adding a route:


    +   - Set a Route to the Locally Connected Network

    +   - Set a Route to a Different Network

    +   - Set a Default Route


    > Remember to substitute your own network and gateway addresses when using the
    following examples in a production environment.


    # Set a Route to the Locally Connected Network


    The following command sets a route to the locally connected network:


    ```

    da2:~ # ip route add 10.0.0.0/24 dev eth0

    ```


    This system in this example is in the **10.0.0.0** network. The network mask is
    **24** bits long (255.255.255.0). All packets to the local network are sent directly
    through the device **eth0**.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# **Set a Route to a Different Network**


    The following command sets a route to different network:


    ```

    da2:~ # ip route add 192.168.1.0/24 via 10.0.0.100

    ```


    All packets for the network **192.168.1.0** are sent through the gateway **10.0.0.100**.


    # **Set a Default Route**


    The following command sets a default route:


    ```

    da2:~ # ip route add default via 10.0.0.254

    ```


    Packets that cannot be sent according to previous entries in the routing table
    are sent through the gateway **10.0.0.254**.


    # **Delete Routes from the Routing Table**


    To delete an entry from the routing table, use a command similar to the following:


    ```

    da2:~ # ip route delete 192.168.1.0/24 dev eth0

    ```


    This command deletes the route to the network **192.168.1.0**

    assigned to the device **eth0**.


    # **Save Routing Settings to a Configuration File**


    Routing settings made with the ip tool are lost when you reboot your system. Settings
    have to be written to configuration files to be restored at boot time.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "Routes to the directly connected network are automatically set up when a device\
    \ is started. All other routes are saved in the configuration file `/etc/sysconfig/network/routes`.\n\
    \nThe following shows the content of a typical configuration file:\n\n```\n```\
    \  \n192.168.1.0 10.0.0.100 255.255.255.0 eth-id-00:30:05:4b:98:85  \ndefault\
    \ 10.0.0.254 - -  \n```\n```\n\nEach line of the configuration file represents\
    \ an entry in the routing table. Each line is shown and explained below:\n\n+\
    \   □ **192.168.1.0 10.0.0.100 255.255.255.0  \n+   eth-id-00:30:05:4b:98:85**\
    \  \n+   All packets sent to the network **192.168.1.0** with the network mask\
    \ **255.255.255.0** are sent to the gateway **10.0.0.100** through the device\
    \ with the id **eth-id-00:30:05:4b:98:85**. The id is the same as used for the\
    \ device configuration file.\n\n+   □ **Default 10.0.0.254 - -**  \n+   This entry\
    \ represents a default route. All packets that are not affected by the previous\
    \ entries of the routing table are sent to the gateway **10.0.0.254**. It’s not\
    \ necessary to fill out the last 2 columns of the line for a default route.\n\n\
    To apply changes to the routing configuration file, you need to restart the affected\
    \ network device with the commands `ifdown` and `ifup`."
  merge: -1
  img_proc: true
