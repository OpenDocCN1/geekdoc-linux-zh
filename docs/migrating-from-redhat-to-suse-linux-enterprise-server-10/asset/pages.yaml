- pgno: 240
  md: '# Boot a System Directly into a Shell


    The boot screen of the GRUB boot loader lets you pass parameters that modify the
    Linux kernel before the kernel is actually loaded.


    At the bottom of the GRUB boot screen is a Boot Options field. To add a boot option,
    select an operating system and type the additional boot option in the Boot Options
    field.


    One way to access a system that is not booting anymore is to set a different program
    for the init process. Normally, the Linux kernel tries to find a program with
    the name init and starts this program as the first process. All other processes
    are then started by init.


    With the boot parameter init=new_init_program, you can change the first program
    loaded by the kernel. For example, by entering the boot parameter init=/bin/bash,
    the system is started directly into a bash shell. You are directly logged in as
    root without being asked for a password.


    > You could consider this somewhat equivalent to RHEL’s runlevel 1, where you
    are not asked for the root password before getting a shell.


    You can use this bash file to access the file system and to fix a misconfiguration.


    > The file systems are mounted as read-only after booting into a shell. To change
    configuration files, you need to remount the file system with the following command:

    > **mount -o remount,rw,sync -t filesystem_type device_name mount_point**

    > Enter **exec /sbin/init** at the bash prompt replaces the shell by the init
    program and continues the boot process until the default runlevel is reached.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'If you want to prevent access to the machine as described above, you can change
    the boot configuration to require a password before the kernel command line can
    be edited.


    In the file /boot/grub/menu.lst, the line


    **password** *seceret*


    within the general options makes sure that the choices defined further below in
    the file (title SUSE SLES 10, etc.) can only be selected in unmodified form. The
    use of additional kernel parameters requires the password *`seceret`*.


    As the graphical boot menu could be used to circumvent the password feature, it
    is automatically disabled.


    GRUB can also handle MD5-encrypted passwords that are generated as follows:


    ```

    gal0:~ # grub-md5-crypt

    Password:

    Retype password:

    $1$FtTeKl$qaV.tOrzbg3EYAgVfNup40

    ```


    This string can be copied to the file /boot/grub/menu.lst, with the following
    syntax:


    **password** -md5 $1$FtTeKl$qaVtOrzbg3EYAgVfNup40


    The parameter **lock** within a title section can be used to force the password
    query before these title entries can be selected.


    ```

    title Floppy

    lock

    chainloader (fd0)+1

    ```


    Selecting Floppy in the boot menu is now only possible after entering the password.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The parameter password can also be used in individual title entries to define
