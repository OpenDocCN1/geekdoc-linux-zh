- pgno: 223
  md: '# Objective 1  Describe the Linux Load Procedure


    The following represents the basic steps of booting a computer with a Linux system
    installed:


    ![](img/63e88022bf135307e3eac051ad238b5b_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The following describe the process:


    +   - BIOS and Boot Manager

    +   - Kernel

    +   - initramfs (Initial RAM File System)

    +   - init


    # BIOS and Boot Manager


    Tasks performed by the BIOS (Basic Input Output System) include performing a power-on
    self test, conducting the initial detection and setup of hardware, and accessing
    bootable devices (such as a CD or hard drive).


    If the bootable device is a hard drive, BIOS also reads the MBR (master boot record).
    Using the code in the MBR, the BIOS starts the boot manager.


    The boot manager (such as GRUB) loads the kernel and the initrd to memory and
    starts the kernel.


    # Kernel


    The kernel (/boot/vmlinuz, which is a link to /boot/vmlinuz-kernelversion) uncompresses
    itself and then organizes and takes control of the continued booting of the system.


    The kernel checks and sets the console (the BIOS registers of graphics cards and
    the screen output format), reads BIOS settings, and initializes basic hardware
    interfaces.


    Next, the drivers, which are part of the kernel, probe existing hardware and initialize
    it accordingly.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "The kernel controls the entire system, managing hardware access and allocating\
    \ CPU time and memory to programs.\n\n# initramfs (Initial RAM File System)\n\n\
    initramfs is a cpio archive that the kernel can load to a RAM disk. It provides\
    \ a minimal Linux environment that enables the execution of programs before the\
    \ actual root file system is mounted. initramfs must always provide an executable\
    \ named init that should execute the actual init program on the root file system\
    \ for the boot process to proceed.\n\nFormer SUSE Linux versions used an initial\
    \ RAM disk, initrd, instead. Despite the fact that the format changed, the file\
    \ name is still /boot/initrd. /boot/initrd is a link to /boot/initrd-kernelversion,\
    \ the file that holds the gzipped cpio archive.\n\nThe kernel starts the program\
    \ init contained in the initramfs. It is a shell script that, amongst other things,\
    \ loads the kernel modules needed to mount the actual root file system, mounts\
    \ the root file system and then finally starts /sbin/init from the root file system.\n\
    \nTo look at the script init in initramfs, unpack the cpio archive:\n\n```\nda10:~\
    \ # mkdir /tmp/initramfs\n da10:~ # cd /tmp/initramfs\n da10:/tmp/initramfs #\
    \ gunzip -c /boot/initrd-2.6.14-6-smp | cpio -i\n 12765 blocks\n da10:/tmp/initramfs\
    \ # ls\n bin boot sbin dev etc init lib proc root sys tmp\n da10:/tmp/initramfs\
    \ # less init\n```\n\n1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED\n\n\n\nVersion\
    \ 1"
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The initramfs is created with the proper modules included, for instance those
    needed to access the file system, during installation. The modules to include
    are listed in the variable **INITRD_MODULES=** in /etc/sysconfig/kernel. If additional
    or different modules are needed, for instance due to a hardware change, you would
    edit the list of modules, and then rebuild the initramfs. The command is the same
    as the one to build an initrd, **mkinitrd:**


    ```

    dai10:~ # mkinitrd

    Root device: /dev/sda2 (mounted on / as reiserfs)

    Module list: piix aic7xxx sym53c8xx processor thermal

    fan reiserfs edd (xennet xenblk)


    Kernel image: /boot/vmlinuz-2.6.16.14-6-smp

    Initrd image: /boot/initrd-2.6.16.14-6-smp

    Shared libs: lib/ld-2.4.so lib/libacl.so.1.1.0

    lib/libattr.so.1.1.0 lib/libc-2.4.so lib/libdl-2.4.so

    lib/libhistory.so.5.1 lib/libncurses.so.5.5

    lib/libpthread-2.4.so lib/libreadline.so.5.1

    lib/librt-2.4.so lib/libuuid.so.1.2


    Driver modules: ide-core ide-disk scsi_mod sd_mod piix

    scsi_transport_spi aic7xxx sym53c8xx processor thermal fan

    edd


    Filesystem modules: reiserfs

    Including: initramfs fsck.reiserfs

    BootSplash: SuSE-SLES (1024x768)

    12765 blocks

    ```


    > The manual page for mkinitrd lists the parameters that can be passed to the
    init program in the initramfs via the kernel command line.


    # init


    After checking the partitions and mounting the root file system, the program init
    located in initramfs starts /sbin/init, which boots the system with all its programs
    and configurations.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The init process is always assigned a process ID number of 1, and relies on
    the /etc/inittab file for configuration information on how to run the initialization
    process.


    Once the init process starts, it begins by accessing the /etc/init.d/boot script.
    The /etc/init.d/boot script controls the start of services such as initializing
    disk quotas and mounting local file systems and executes the Sxx-scripts in /etc/init.d/boot.d/.


    After the boot script has been completed, init starts the /etc/init.d/rc script
    which uses configured runlevels to start services and daemons.


    Each runlevel has its own set of services that are initiated. For example, runlevel
    5 includes the X Window components that run the Linux desktop.


    ![](img/63e88022bf135307e3eac051ad238b5b_227_0.png)


    > For additional details on init, see “Manage Runlevels” on page 5-23.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Objective 2


    # GRUB (Grand Unified Bootloader)


    RHEL and SLES 10 both use GRUB as their default boot loader.


    To manage GRUB, the Grand Unified Bootloader, you need to know the following:


    +   - What a Boot Manager Is

    +   - Boot Managers in SUSE Linux

    +   - Start the GRUB Shell

    +   - Modify the GRUB Configuration File

    +   - Configure GRUB with YaST

    +   - Boot a System Directly into a Shell


    # What a Boot Manager Is


    To boot a system, you need a program that can load the respective operating system
    into memory. This program, called the *boot loader*, loads the operating system
    kernel, which then loads the system.


    After running the Power-On Self Test (POST), the PC BIOS searches various media
    configured in the BIOS for a boot loader. If it finds one, it turns control of
    the boot process over to the boot loader.


    The boot loader then locates the operating system files on the hard drive and
    starts the operating system.


    A *boot manager* is not only a boot loader, but it can handle several operating
    systems. If there is more than one operating system present, the boot manager
    presents a menu allowing you to select a specific operating system to be loaded.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 229
  md: "Linux boot managers can be used to load Linux or other operating systems, such\
    \ as Microsoft Windows.\n\nGRUB is designed with the following 2-stage architecture:\n\
    \n+   *   **Stage 1.** The first stage of a boot loader is usually installed in\
    \ the master boot record (MBR) of the hard disk (first stage boot loader).\n+\
    \   \n+       As the space in the MBR is limited to 446 bytes, this program code\
    \ merely contains the information for loading the next stage.\n+   \n+       Stage\
    \ 1 can be installed in the MBR, in the boot sectors of partitions, or on a floppy\
    \ disk.\n\n+   *   **Stage 2.** This stage usually contains the actual boot loader.\
    \ The files of the second stage boot loader are located in the directory /boot/.\n\
    \n# ### Boot Managers in SUSE Linux\n\nSUSE Linux Enterprise Server provides 2\
    \ boot managers for the Linux environment: GRUB (GRAnd Unified Bootloader) and\
    \ LILO (LIinux LOader).\n\nTo gain a better understanding of these boot managers,\
    \ you need to know the following:\n\n+   *   GRUB Boot Manager\n+   *   LILO Boot\
    \ Manager\n+   *   Map Files, GRUB, and LILO"
  merge: -1
  img_proc: true
- pgno: 230
  md: "# ### GRUB Boot Manager\n\nGRUB is the standard boot manager in SUSE Linux\
    \ Enterprise Server. The following are some special features of GRUB:\n\n+   File\
    \ system support. Stage 2 includes file system drivers for ReiserFS, ext2, ext3,\
    \ Minix, JFS, XFS, FAT, and FFS (BSD). For this reason, the boot manager can access\
    \ files through filenames even before the operating system is loaded.\n\nThis\
    \ feature is useful when the boot manager configuration is faulty and you have\
    \ to search for and load the kernel.\n\n+   Interactive control. GRUB has its\
    \ own shell that enables interactive control of the boot manager.\n\n# ### LILO\
    \ Boot Manager\n\nBecause LILO is not the default boot manager of SUSE Linux Enterprise\
    \ Server, it is only covered briefly in this objective.\n\nThe LILO configuration\
    \ file is /etc/lilo.conf. Its structure is similar to that of the GRUB configuration\
    \ file.\n\n> When you modify the configuration file /etc/lilo.conf, you need to\
    \ enter the command **lilo** for the changes to be applied.\n> \n> You also need\
    \ to use the command lilo when moving the kernel or the intrd on your hard disk.\n\
    \n# ### Map Files, GRUB, and LILO\n\nThe main obstacle for booting an operating\
    \ system is that the kernel is usually a file within a file system on a partition\
    \ on a disk. These concepts are unknown to the BIOS. To circumvent this, maps\
    \ and map files were introduced."
  merge: -1
  img_proc: true
- pgno: 231
  md: 'These maps simply note the physical block numbers on the disk that comprise
    the logical files. When such a map is processed, the BIOS loads all the physical
    blocks in sequence as noted in the map, building the logical file in memory.


    In contrast to LILO, which relies entirely on maps, GRUB tries to become independent
    from the fixed maps at an early stage. GRUB achieves this by means of the file
    system code, which enables access to files by using the path specification instead
    of the block numbers.


    ![](img/63e88022bf135307e3eac051ad238b5b_231_0.png)


    More information on GRUB and LILO can be found in the respective manual and info
    pages and in /usr/share/doc/packages/grub and /usr/share/doc/packages/lilo.


    # Start the GRUB Shell


    As GRUB has its own shell, you can boot the system manually if the Linux system
    does not start due to an error in the boot manager.


    There are two ways to start the GRUB shell:


    +   - Start the GRUB Shell in the Running System


    +   - Start the GRUB Shell at the Boot Prompt


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Start the GRUB Shell in the Running System


    To start the GRUB shell during operation, enter the command grub as root. The
    following appears:


    ```

    GNU GRUB version 0.94 (640K lower / 3072K upper memory)


    [ Minimal BASH-like line editing is supported. For the first word, TAB

    lists possible command completions. Anywhere else TAB lists the

    possible completions of a device/filename. ]

    grub>

    ```


    As in a bash shell, you can complete GRUB shell commands with the Tab key. To
    find out which partition contains the kernel, enter the command find, as in the
    following:


    ```

    grub> find /boot/vmlinuz

    (hd0,2)

    grub>

    ```


    In this example, the kernel (/boot/vmlinuz) is located in the third partition
    of the first hard disk (hd0,2).


    Close the GRUB shell by entering quit.


    # Start the GRUB Shell at the Boot Prompt


    Start the GRUB shell at the boot prompt by doing the following:


    +   1. From the graphical boot selection menu, press Esc.

    +       A text-based menu appears.

    +   2. Start the GRUB shell by typing c (US keyboard layout).'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Modify the GRUB Configuration File\n\nConfigure GRUB by editing the file\
    \ /boot/grub/menu.lst. The following is the general structure of the file:\n\n\
    +   - First, there are general options:\n+   \n+       - **color white/blue black/light-gray.**\
    \ Colors of the boot manager menu.\n+       - **default 0.** The first entry (numbering\
    \ from 0) is the default boot entry that starts automatically if no other entry\
    \ is selected with the keyboard.\n+       - **timeout 8.** The default boot entry\
    \ is started automatically after 8 seconds.\n+       - **gfxmenu (hd0,0)/boot/message.**\
    \ This defines where the graphical menu is stored.\n\n+   - The general options\
    \ are followed by options for the various operating systems that can be booted\
    \ with the GRUB.\n+   \n+       - **title title.** Each entry for an operating\
    \ system begins with title.\n+       - **root (hd0,0).** The following entries\
    \ are relative to this hard disk partition given in the syntax of GRUB, in this\
    \ example the first partition on the first hard disk. With this entry it is not\
    \ necessary to specify the partition on each of the following entries like kernel.\n\
    \nNote the following regarding the designations for hard disks and partitions:\n\
    \nGRUB does not distinguish between IDE and SCSI hard disks. The hard disk that\
    \ is recognized by the BIOS as the first hard disk is designated as hd0, the second\
    \ hard disk as hd1, and so on.\n\nThe first partition on the first hard disk is\
    \ called hd0,0, the second partition hd0,1, and so on."
  merge: -1
  img_proc: true
- pgno: 234
  md: "+   • **kernel /boot/vmlinuz**. This entry describes the kernel location, relative\
    \ to the partition specified above. It is followed by kernel parameters, like\
    \ root=/dev/hda1, vga=normal, etc.  \n+   • **initrd /boot/initrd**. This entry\
    \ sets the location of the initial ramdisk (initramfs in SLES 10), relative to\
    \ root (hd0,0) specified above. The initrd contains hardware drivers that are\
    \ needed before the kernel can access the hard disk (such as a driver for the\
    \ IDE or SCSI controller).\n\nThe following is an example of the configuration\
    \ file **/boot/grub/menu.lst**:\n\n```\n# Modified by YaST2. Last modification\
    \ on Mon May 15 08:38:29 UTC 2006\n\n# color white/blue black/light-gray\n# default\
    \ 0\n# timeout 8\ngfxmenu (hd0,1)/boot/message\n\n###Don't change this comment\
    \ - YaST2 identifier: Original name: linux###\ntitle SUSE Linux Enterprise Server\
    \ 10\nroot (hd0,1)\nkernel /boot/vmlinuz root=/dev/sda2 vga=0x317 resu me=/dev/sda1\
    \ \n\tsplash=silent showopts\ninitrd /boot/initrd\n\n###Don't change this comment\
    \ - YaST2 identifier: Original name: floppy###\ntitle Floppy\nchainloader (fd0)+1\n\
    \n###Don't change this comment - YaST2 identifier: Original name: \nfailSafe###\n\
    title FailSafe -- SUSE Linux Enterprise Server 10\nroot (hd0,1)\nkernel /boot/vmlinuz\
    \ root=/dev/sda2 vga=normal showopts ide=nodma\n\tapm=off acpi=off noresume noemp\
    \ noapic maxcpus=0 edd=off 3\ninitrd /boot/initrd\n```\n\n1 HARDCOPY PERMITTED-NO\
    \ DISTRIBUTION ALLOWED"
  merge: -1
  img_proc: true
