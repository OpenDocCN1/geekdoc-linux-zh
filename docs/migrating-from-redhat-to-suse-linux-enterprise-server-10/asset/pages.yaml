- pgno: 280
  md: 'The meaning of individual fields in a configuration line and their possible
    values are listed below.


    Default values, if any, are listed in the description. If an entry is set to "--",
    the default value is used.


    +   * **service**. The name of the Postfix process.

    +       * An entry for a service that is controlled by the inet daemon can be
    specified in the form *host:port*.

    +       * inet is the service that controls who can connect to your computer and
    which services they can use.

    +       * An entry for the SMTP service could be **localhost:smtp**

    +       * This entry would start the Postfix process */usr/lib/postfix/smtpd*
    in such a way that it only receives mail messages on port 25 of the loopback interface
    (if this port is entered correctly in the file /etc/services).

    +       * The host prefix and the following colon are optional.


    +   * **type**. Allows you to specify a connection type.

    +       * Possible entries are

    +           * **inet** for Internet sockets (TCP/UDP)

    +           * **unix** for UNIX domain sockets (only for local communication)

    +           * **fifo** (first in, first out) for named pipes


    +   * **private**. Configures access to the service.

    +       * The value **y** (yes) only defines access to this service from the mail
    system.

    +       * The entry **n** (no) also allows access to this service for components
    outside the mail system. For services of the type inet, the value **n** must always
    be set.

    +       * The default value is **y**.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   - **unpriv.** Configures the UID under which this service is running.


    With the value y (yes), the configured service runs under the unprivileged user
    configured in the file /etc/postfix/main.cf with the variable mail_owner (as a
    rule, the user postfix).


    If this value is set to n (no), the service runs with root privileges - with the
    UID 0.


    The default value is y.


    +   - **chroot.** Specifies the chroot behavior of the service.


    The value y (yes) causes the service to be started in a chroot environment.


    The root path of this environment is defined in the variable queue_directory in
    the file /etc/postfix/main.cf (this is normally the directory /var/spool/postfix/).


    The default value is y.


    +   - **wakeup.** Runs the service again after the given number of seconds have
    expired.


    The default value of 0 deactivates this function for the service.


    Currently only the pickup daemon and the queue manager use this function.


    The default value is 0 (never).


    +   - **maxproc.** Defines the maximum number of processes that can be run simultaneously.


    The default value is defined in the variable default_process_limit in the file
    /etc/postfix/main.cf.


    The default value is 100.


    +   - **command + args.** Configures the command to run, including the required
    arguments.


    > 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 282
  md: "The path name of the command to run is relative to the directory defined in\
    \ the file /etc/postfix/main.cf via the variable daemon_directory (this is normally\
    \ the directory /usr/lib/postfix/).\n\nIf one or more **-v** arguments are given,\
    \ the debugging level is increased for the given command.\n\nSpecifying the **-D**\
    \ argument allows debugging by using the debugging command, specified in the file\
