- pgno: 444
  md: '# OCFS to OCFS2 Migration


    The on-disk layouts of OCFS and OCFS2 are not compatible. As drivers for OCFS
    only exist for 2.4.x linux kernels and drivers for OCFS2 only for 2.6.x linux
    kernels, you cannot use them both on the same machine concurrently.


    There are two possibilities to migrate to the new OCFS2:


    +   - If the old cluster file system is still online you can replicate it to the
    new one via the network. You have to ensure that there are no changes to the old
    OCFS storage cluster after the last replication; during the migration you need
    double SAN capacity.


    +   - Oracle provides the FSCat tools that can read OCFS disk images in userland.
    Using these tools on an OCFS2 cluster node, you can extract your OCFS backup into
    the OCFS2 mountpoint.'
  merge: -1
  img_proc: true
