- pgno: 434
  md: '# SECTION 10 Cluster File Systems


    With a cluster file system it is possible to share a file system between systems.
    In the cluster jargon these systems are called nodes. Cluster file systems are
    also known as "shared disk file systems". The benefit of these file systems is
    that data is still available to the remaining nodes if one node fails. Cluster
    file systems are routinely used in high availability environments.


    Different cluster file systems are available for Linux, the best known are:


    +   - OCFS (Oracle Cluster File System)

    +   - GPFS (General Parallel File System)

    +   - GFS (Gloabal File System)

    +   - LUSTRE


    # Objectives


    +   1. Global File System (GFS)

    +   2. Oracle Cluster File System 2 (OCFS2)'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# Objective 1


    # Global File System (GFS)


    Under RHEL, primarily GFS is used as cluster file system. GFS is a cluster file
    system that was originally developed at the University of Minnesota, later distributed
    by Sistina Software. Red Hat acquired Sistina Software at the end of 2003 and
    released their cluster file system as Open Source Software under the GPL in 2004.


    The Red Hat Cluster Suite for RHEL4 utilizes GFS 6.1 for shared storage for its
    high-throughput and high-availability features, but it can be used and is supported
    for the Oracle Real Application Cluster (RAC) as well.


    All releases up to the current iteration 6.1 are on-disk compatible and run under
    the GFS label. The successor GFS2, currently in development, will not be on-disk
    compatible with GFS(1), but will eliminate some of its current caveats. GFS2 has
    recently been included into the development version of the Linux kernel 2.6.19;
    GFS1 is developed out-of-tree.


    One can use GFS as a simple local file system without any cluster locking mechanism,
    but usually it is run in cluster mode, where it has to be supplemented by a SAN
    environment.


    GFS is not available on SUSE Linux Enterprise Server 10.'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'Cluster File Systems


    # Objective 2


    # Oracle Cluster File System 2 (OCFS2)


    This objective covers


    +   OCFS2 Background

    +   OCFS2 Configuration

    +   OCFS to OCFS2 Migration

    +   GFS - OCFS2 Comparison Table


    # OCFS2 Background


    OCFS2 is a cluster file system that was released by Oracle as Open

    Source software under the GPL in 2005. Contrary to its predecessor

    OCFS, released in 2002, it is now a general-purpose cluster file

    system that is suitable as a storage base for a more widespread type

    of scenarios than deploying Oracle Real Application Cluster (RAC)

    only.


    In SUSE Linux Enterprise Server 10 it can, for instance, be used to

    give several hosts access to XenVM loopback disk images. Thanks

    to OCFS2 virtual machines can be relocated from host to host.


    Novell has integrated OCFS2 version 1.0.8 into SLES 9 SP2,

    version 1.2.1 into SP3 and SLES 10. As OCFS2 has been included

    into the mainline Linux kernel starting with version 2.6.16, probably

    more Linux distributions will integrate OCFS2 in the future.


    All OCFS2 versions—starting with version 1.0—are on-disk

    compatible, but their corresponding tools are not. So take care to

    upgrade them together, and access the cluster filesystem only with

    management tools that are at the same level as the kernel driver.


    On SLES10 it is possible to set up an OCFS2 from the command

    line or with the shipped OCFS conslo which provides a GUI.


    1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED


    Version 1


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.

    To report suspected copying, please call 1-800-PIRATES.


    10-3'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'OCFS2 has the following features:


    +   * POSIX compliant

    +   * Support for multiple CPU architectures as it is endian-safe.

    +   * Thread-safe, asynchronous I/O, metadata and data caching provides high performance.

    +   * Lockless node-local allocation area enables fast creation of new files.

    +   * Extents-based; allocates metadata groups automatically, no fixed inode limit.

    +   * Direct I/O to bypass local OS cache.

    +   * Fully integrated with the Heartbeat 2 cluster solution in SUSE Linux Enterprise
    Server 10.

    +   * OCFS2 is certified for Oracle 9iR2, 10g, 10gR2 RAC on RHEL4, SLES 9 SP3
    and SLES 10.


    # OCFS2 Configuration


    The following sample configuration assumes that the OCFS2 resides on the device
    “sda”. To be able to share this device between nodes, this device could be made
    available using iSCSI as covered in Section “iSCSI” on page 9-1.


    > To avoid having the storage device as a possible single point of failure, which
    would thwart the purpose of a HA cluster, the storage device should include HA
    features as well. DRBD (Distributed Replicated Block Device) and Heartbeat could
    be used for this purpose; configuration of DRBD and Heartbeat is, however, beyond
    the scope of this course.'
  merge: -1
  img_proc: true
- pgno: 438
  md: "Most of the following steps to configure OCFS2 need to be taken on every node:\n\
    \n+   1. Create SSH keys for graphical OCFS2 frontend **ocfs2console**.\n+   \t\
    To facilitate the configuration on the different nodes, one usually uses ssh keys.\n\
    +   \tKeys are generated by the command **ssh-keygen**. The option **-N \"\"**\
    \ creates a key without a passphrase. **ssh-copy-id** is a script that adds the\
    \ public key to the .ssh/authorized_keys file on the destination computer.\n\n\
    ```\ndal0:~ $ ssh-keygen -t rsa -N \"\"\nGenerating public/private rsa key pair.\n\
    Enter file in which to save the key (/root/.ssh/id_rsa): <ENTER>\nCreated directory\
    \ '/root/.ssh'.\nYour identification has been saved in /root/.ssh/id_rsa.\nYour\
    \ public key has been saved in /root/.ssh/id_rsa.pub.\nThe key fingerprint is:\n\
    cb:1e:a9:7b:08:a7:82:d5:24:fc:90:49:cc:84:d6:a7 root@dal0\n\ndal0:~ $ ssh-copy-id\
    \ -i ~/.ssh/id_rsa.pub root@dal1;\ndal0:~ $ ssh-copy-id -i ~/.ssh/id_rsa.pub root@dal2;\n\
    ...\n```\n\n+   2. Install the OCFS2 packages.\n+   \tUse the YaST Software Management\
    \ module or the command **yast -i ocfs2-tools ocfs2console**."
  merge: -1
  img_proc: true
- pgno: 439
  md: "3. Create /etc/ocfs2/clster.conf\n\nThe following is an example with two nodes,\
    \ just adapt \"node_count\" if you add more.\n\n```\n```\ncluter:\n    name =\
    \ mycluster\n    node_count = 2\nnode:\n    name = da10\n    cluter = mycluter\n\
    \    number = 0\n    ip_address = 10.0.0.10\n    ip_port = 7777\nnode:\n    name\
    \ = da11\n    cluter = mycluster\n    number = 1\n    ip_address = 10.0.0.11\n\
    \    ip_port = 7777\n```\n```\n\nInstead of the hostname, **name** could also\
    \ be the fully qualified domain name; name resolution has to work.\n\n4. Create\
    \ an OCFS2 on the shared block device.\n\nThis is only done on one node.\n\nTake\
    \ care that you use the same label as in the cluster configuration file (this\
    \ is *mycluster* in the example above).\n\nThe command to create an OCFS2 file\
    \ system is **mkfs.ocfs2**.\n\nEntering the command without options gives a brief\
    \ syntax overview:\n\n```\n```\nda3:~ # mkfs.ocfs2\nUsage: mkfs.ocfs2 [-b block-size]\
    \ [-C cluter-size]\n[-N number-of-node-slots] [-T fileystem-type]\n[-L volume-label]\
    \ [-J journal-options] [-H%q\\v] device [blocks-count]\n```\n```\n\nThe manual\
    \ page explains the available options."
  merge: -1
  img_proc: true
- pgno: 440
  md: 'The following command creates an OCFS2 file system on /dev/sda:


    ```

    ```

    dal0:~ # mkfs.ocfs2 -b 4k -C 128k -N 4 -L mycluster /dev/sda

    mkfs.ocfs2 1.2.1

    Filesystem label=mycluster

    Block size=4096 (bits=12)

    Cluster size=131072 (bits=17)

    Volume size=8595308544 (65577 clusters) (2098464 blocks)

    3 cluster groups (tail covers 1065 clusters, rest cover 32256 clusters)

    Journal size=67108864

    Initial number of node slots: 4

    Creating bitmaps: done

    Initializing superblock: done

    Writing system files: done

    Writing superblock: done

    Formatting Journals: done

    Writing lost+found: done

    mkfs.ocfs2 successful

    ```

    ```


    +   5. Add an entry in /etc/fstab.


    The following is done on all nodes and assumes that the device (/dev/sda in this
    example) is the same on all nodes


    ```

    ```

    dal0:~ # echo ''/dev/sda /mnt ocfs2 defaults 0 0'' >> /etc/fstab

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 441
  md: '+   6. Configure the OCFS2 cluster services.

    +      Make sure that **Cluster to start on boot** is the same as the entry in
    `/etc/ocfs2/cluster.conf`


    ```

    ```bash

    da10:~ # /etc/init.d/o2cb configure

    Configuring the O2CB driver.

    This will configure the on-boot properties of the O2CB driver.

    ...

    Load O2CB driver on boot (y/n) [y]: <ENTER>

    Cluster to start on boot (Enter "none" to clear) [mycluster]: <ENTER>

    Use user-space driven heartbeat? (y/n) [n]: <ENTER>

    Writing O2CB configuration: OK

    ```

    ```


    +   7. Start the storage cluster services automatically.

    +      The following commands create the links in `/etc/init.d/rcx.d/` needed
    to start the services at boot time.


    ```

    ```bash

    da10:~ # chkconfig -a o2cb

    da10:~ # chkconfig -a ocfs2

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 442
  md: '8. Start the OCFS2 cluster services manually and mount the OCFS2.


    The following commands start the services needed for ocfs2:


    ```

    dal0:~ # /etc/init.d/o2cb start;

    Loading module "configfs": OK

    Mounting configfs filesystem at /sys/kernel/config: OK

    Loading module "ocfs2_nodemanager": OK

    Loading module "ocfs2_dlm": OK

    Loading module "ocfs2_dlmfs": OK

    Mounting ocfs2_dlmfs filesystem at /dlm: OK

    Starting cluster mycluster: OK

    dal0:~ # /etc/init.d/ocfs2 start

    Starting Oracle Cluster File System (OCFS2)     done

    ```


    The second command mounts the file system. Use the command **mount** to see the
    result.


    9. Check that the cluster file system works.


    ```

    dal0:~ # cat

    /sys/kernel/config/cluster/mycluster/heartbeat/dead_threshold

    7

    ```


    10. Stop the OCFS2 cluster services manually and unmount the OCFS2.


    The following commands stop the OCFS2 cluster services:


    ```

    dal0:~ # /etc/init.d/ocfs2 stop;

    Stopping Oracle Cluster File System (OCFS2)     done

    dal0:~ # /etc/init.d/o2cb stop;

    Cleaning heartbeat on mycluster: OK

    Stopping cluster mycluster: OK

    Unloading module "ocfs2": OK

    Unmounting ocfs2_dlmfs filesystem: OK

    Unloading module "ocfs2_dlmfs": OK

    Unmounting configfs filesystem: OK

    Unloading module "configfs": OK

    ```'
  merge: -1
