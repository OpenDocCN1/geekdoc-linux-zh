    # **SYSTEM ADMINISTRATION**


    System administration tools on the two systems are vastly different. If you''re
    accustomed to the multitude of tools in Red Hat, you''ll enjoy the SUSE Linux
    Enterprise Server common administration interface called YaST, which stands for
    "Yet Another Setup Tool."


    Instead of requiring administrators to install and use many different interfaces
    for administering applications, YaST is a "one-stop shop" that allows for either
    text-menu-based or full graphical administration of SUSE Linux Enterprise Server.
    Below are some of the more common tasks/services that can be managed via YaST:


    +   - Adding, deleting or updating software

    +   - Managing users and groups and security settings

    +   - Administering installed services (Apache, DNS, DHCP, TFTP, etc.)

    +   - Offering deployment services

    +   - Configuration and build management through AutoYaST

    +   - Automatic installation server setup and configuration

    +   - Installing and configuring hardware

    +   - Managing disks and volumes


    # **SuSEconfig—The Normalizer**


    While each YaST module/component performs slightly different tasks based on the
    application or service being administered, it typically modifies both application
    configuration files (e.g., /etc/rcidap.conf) as well as any related files in /etc/sysconfig
    (e.g., /etc/sysconfig/idapd). After making the needed changes, YaST runs a bash
    shell script called SuSEconfig (located in /sbin), which performs several key
    tasks. SuSEconfig configures the system according to the variables that are set
    in the various /etc/sysconfig/\* files either by YaST or by hand. It uses the
    subsystem-specific scripts in /sbin/conf.d/ to configure the various subsystems.
    For example, the variables in /etc/sysconfig/postfix are evaluated by the script
    /sbin/conf.d/SuSEconfig postfix.


    > **Note:** SuSEconfig is an excellent tool for those managing larger sets of
    systems because it normalizes how changes are made to the system''s running services
    and can assist in reducing downtime due to improperly applied changes or missed
    steps in complex configuration changes.


