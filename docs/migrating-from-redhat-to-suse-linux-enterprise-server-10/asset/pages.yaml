- pgno: 503
  md: "# **Figure C-11**\n\n![](img/63e88022bf135307e3eac051ad238b5b_503_0.png)\n\n\
    Another parameter that you may have to use is the one that forces text mode for\
    \ an\ninstallation. The installation routine defaults to a GUI X-based YaST display\
    \ if it is possible, so\n to run in text mode, add the “textmode=1” parameter\
    \ to the boot options dialog entries.\n\nNote: A full layout of the SUSE Linux\
    \ Enterprise Server boot options is included in a later\nsection.\n\n# **BOOT\
    \ PROCESS AND RUNLEVELS**\n\n**Boot Loader Differences**\n\nThe default boot loader\
    \ for SUSE Linux Enterprise Server is grub, and the file system layout for\nall\
    \ related boot files is generally the same as in Red Hat Enterprise Linux. The\
    \ one notable\nexception is while Red Hat Enterprise Linux maintains a link from\
    \ */boot/grub/menu.lst* to\n*/etc/grub.conf*, which is, in turn, a link back to\
    \ */boot/grub/grub.conf*, no such link exists in\nSUSE Linux Enterprise Server.\
    \ In SUSE Linux Enterprise Server, the */boot/grub/menu.lst* is a\nregular file\
    \ and contains all grub boot menu settings, while */etc/grub.conf* contains\n\
    information needed by the grub command to install itself into the MBR.\n\n**Note**:\
    \ You’ll see this two-stage process used throughout the SUSE Linux Enterprise\
    \ Server\nsystem where a service’s or command’s environment configuration is separated\
    \ from its service-\noriented configuration: it makes more sense than jumbling\
    \ all the configuration into a single\nfile. This can be particularly helpful\
    \ when troubleshooting processes that have complex\nconfigurations.\n\n**Init\
    \ scripts**\n\nBoth Red Hat Enterprise Linux and SUSE Linux Enterprise Server\
    \ use similar init script structures\nsuch as the */sbin/init* as the first process,\
    \ the PID 1 assignment. Moreover, both use the\n*/etc/inittab* file for the runlevel\
    \ definition and general housekeeping of what starts on boot\nduring the runlevels\
    \ and at various system events.\n\nThe following table compares the two systems’\
    \ boot process layouts:\n\n| | Red Hat Enterprise Linux | SUSE Linux Enterprise\
    \ Server |\n|---|---|---|\n| Kernel | /boot/vmlinuz-<version> | boot/vmlinux (symlink)\
    \ |\n| Initrd | /boot/initrd-<version> | /boot/initrd (symlink) |\n| Grub | uses\
    \ the /initrd directory<br><br>/boot/grub/menu.lst is a link to<br>/boot/grub/grub.conf<br><br>/etc/grub.conf\
    \ is a symlink to<br>/boot/grub/grub.conf | /boot/grub/menu.lst<br>/etc/grub.conf\
    \ (only for<br>installation purposes) |"
  merge: -1
  img_proc: true
