- pgno: 397
  md: '# **Objective 6    Understand Xen Networking**


    Usually the network connection of Xen domains works out of the box. However, in
    case you would like to change the configuration, networking with Xen can be a
    bit tricky. The following should give you an overview of how Xen domains are connected
    to the physical network.


    To better understand the concept of Xen networking, do the following:


    +   - Understand the Basic Networking Concept

    +   - Understand Bridging

    +   - Understand the Network Interfaces in domain0


    # **Understand the Basic Networking Concept**


    In a Xen setup, domain0 is controlling the physical network interfaces of a host
    system. Unprivileged domains are connected to domain0 through virtual ethernet
    adapters.


    One virtual adapter in an unprivileged domain is connected to one virtual adapter
    in domain0.


    In domain0, standard Linux networking mechanisms like bridging or routing are
    used to connect the virtual adapters through the physical adapter to the network.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'The following is an illustration of this basic concept:


    # **Figure 8-10**


    ![](img/63e88022bf135307e3eac051ad238b5b_398_0.png)


    # **Understand Bridging**


    On SUSE Linux Enterprise Server 10, the default mechanism to connect virtual and
    physical interfaces in domain0 is bridging. Other mechanisms like routing with
    or without Network Address Translation (NAT) are out of the scope of this course.


    Bridging basically means that multiple network interfaces are combined to one.
    Traditionally this technique is used to connect two physical network interfaces
    or network segments.


    In a Xen system, bridging is used to connect virtual and physical network adapters
    in domain0. In a Xen system, you can consider the bridge as a kind of virtual
    switch which all virtual and physical interfaces are connected to.


    The configuration of the bridge is done by the xend management process. When a
    new domain is created, the following changes to the network configuration are
    made (simplified):


    +   1. Xen provides a virtual interface to the new domain.

    +   2. xend creates a new virtual interface in domain0.

    +   3. Both virtual interfaces are connected through a virtual point to point
    connection.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 399
  md: '4.  The virtual interface in domain0 is added to the bridge with the physical
    interface.


    These steps only affect the general network connectivity. The IP configuration
    in the Xen domains has to be done separately with DHCP or a static network configuration.


    xend is performing these network changes with the help of scripts, which are located
    at /etc/xen/scripts/. The following scripts are used for bridged networking:


    +   - network-bridge. This script is called initially when xend is started. It
    sets up the bridge xenbr0 and moves the physical interfaces onto that bridge.


    +   - vif-bridge. This script is called for every domain that is started and adds
    the virtual interface to the bridge.


    In the file /etc/xen/xend-config.sxp you can configure which network scripts are
    used by xend.


    # Understand the Network Interfaces in domain0


    When you look at the network interfaces in domain0 with the command ip a, you
    can see that there are many more interfaces than in a regular Linux installation.'
  merge: -1
  img_proc: true
