- pgno: 99
  md: 'Enter or edit information in the following fields:


    +   - **User\u2019s Full Name.** Enter a real user name (such as **Geeko Chameleon**)


    +   - **Username.** Enter a user name that is used to log in to the system (such
    as **geeko**).


    +   - **Password and Confirm Password.** Enter and re-enter a password for the
    user account.


    When entering a password, distinguish between uppercase and lowercase letters.


    Valid password characters include letters, digits, blanks, and # * , ; : _ . +
    ! $ % & / ? ! { } ( ) [ ] = .


    The password should not contain any special characters (such as accented characters),
    as you might find it difficult to type these characters on a different keyboard
    layout when logging in from another country.


    With the current password encryption (Blowfish), the password length should be
    between 5 and 72 characters.'
