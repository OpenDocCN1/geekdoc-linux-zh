    in /etc/sysconfig/network\ config.

    +   - **IPADDR**. The IP address of the device.

    +   - **NETMASK**. The network mask.

    +   - **NETWORK**. The address of the network itself.


    +   - **MTU="**

    +   You can use the MTU option to specify a value for the MTU (Maximum Transmission
