- pgno: 129
  md: '# **Objective 1 Manage the Network with YaST**


    The YaST module for configuring network cards and the network connection can be
    accessed from the YaST Control Center.


    To activate the network configuration module, select Network Devices > Network
    Card.


    ![](img/63e88022bf135307e3eac051ad238b5b_129_0.png)


    YaST wants to know the network setup method:


    +   - **User Controlled with NetworkManager.** Use a desktop applet that manages
    the connections for all network interfaces. (This is mainly useful on mobile computers.)

    +   - **Traditional Method with ifup.** The traditional method uses the command
    ifup. (We recommend to use this setup method on a server.)'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Using the traditional method the next dialog shows the detected network cards.


    ![](img/63e88022bf135307e3eac051ad238b5b_130_0.png)


    Select the card you want to configure; then select *Edit*.


    Usually the cards are autodetected by YaST, and the correct kernel module is used.'
