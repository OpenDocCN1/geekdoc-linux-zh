- pgno: 20
  md: "# Exercise Conventions\n\nWhen working through an exercise, you will see conventions\
    \ that indicate information you need to enter that is specific to your server.\n\
    \nThe following describes the most common conventions:\n\n+   italicized/bolded\
    \ text. This is a reference to your unique situation, such as the host name of\
    \ your server. \n+   For example, if the host name of your server is da10, and\
    \ you see the following: \n+   *hostname.digitalairlines.com* \n+   you would\
    \ enter \n+   **da10.digitalairlines.com**\n\n+   **10.0.0.xx**. This is the IP\
    \ address that is assigned to your SLES 10 server. \n+   For example, if your\
    \ IP address is 10.0.0.10, and you see the following: \n+   **10.0.0.xx** \n+\
    \   you would enter \n+   **10.0.0.10**\n\n+   **Select**. The word *select* is\
    \ used in exercise steps to indicate a variety of actions including clicking a\
    \ button on the interface and selecting a menu item.\n\n+   **Enter and Type**.\
    \ The words *enter* and *type* have distinct meanings. \n+   The word *enter*\
    \ means to type text in a field or at a command line and press the Enter key when\
    \ necessary. The word *type* means to type text without pressing the Enter key.\
    \ \n+   If you are directed to type a value, make sure you do not press the Enter\
    \ key or you might activate a process that you are not ready to start."
  merge: -1
