    **Enabling Red Hat Network Support**


    Typically, a system administrator will arrange for a support subscription from
    Red Hat, register the system being supported via the `rhn_register` command and
    then connect via the `up2date` or `rhn-applet-gui`/`rhn-applet-tui` utilities.
    A wizard then outlines the remaining process. A visit to the `rhn.redhat.com`
    site is often needed to enable the support subscription if the registration process
    is unsuccessful.


    After enabling the support, the system can be updated manually, either with the
    `up2date` command-line tool or with the Red Hat Network Alert Notification Tool
    from the GUI desktop.


    **Enabling SUSE Linux Enterprise Server Support**


    The YOU (YaST Online Update) Server GUI/TUI client is extremely easy to use, as
    the root user selects `YaST -> Software -> Online Update`. The system will fetch
    the list of update servers and present a dialog that lets the system administrator
    configure how updates are performed.


    The YaST Online Update client allows for automatic updating on a scheduled basis;
    just click the `Configure Fully Automatic Update` button and configure it to update
    at a particular time. You can also configure it to download only patches and not
    other items.


    SUSE Linux Enterprise Server also offers the `online_update` command line tool
    to automate the updating of systems.


    A note about updating kernels: Red Hat Enterprise Linux has traditionally updated
    the system with the new kernel and added entries in the boot menu (GRUB or LILO),
    while SUSE Linux Enterprise Server has traditionally replaced the current kernel
    entry with the new one. SUSE Linux Enterprise Server will allow for keeping entries
    after the application of Support Pack 2.


    # **FILE-SYSTEM HIERARCHY**


    Both SUSE Linux Enterprise Server and Red Hat Enterprise Linux conform to the
    Linux Standards Base (LSB) specification, which now includes the Filesystem Hierarchy
    Standard (FHS). Red Hat Enterprise Linux 3 conforms to LSB 1.3, and SUSE Linux
    Enterprise Server 9 conforms to LSB 2.0. Supporting the LSB minimizes the differences
    between the two distributions filesystem layouts, and system administrators can
    typically rely on configurations and files being in common directory locations.


    You can find the LSB and FHS specifications along with a number of other free
    standards at the Free Standards site: `http://freestandards.org/`.


    One of the main differences that existed in previous versions was that Red Hat
    Enterprise Linux used the `/mnt` directory for all mounting of file systems, floppies
    and CD-ROMs, including USB keys and network file systems. SUSE Linux Enterprise
    Server has long used the `/mnt` directory as a container for network-based file
    systems, while the `/media` directory is for any attached but not integrated media
    object. For example, if you were to attach a USB key drive to a SUSE Linux Enterprise
    Server system, it would mount the USB key to a directory that is auto-created
    by'
