    # Install Modes


    Not only do Red Hat Enterprise Linux and SUSE Linux Enterprise Server provide
    the ability to use different types of installation media for the source of the
    installation, but they also provide several different install modes (ways to perform
    the installation).


    Typically, Linux installations are performed directly via the locally attached
    keyboard monitor and mouse. However, in some cases (such as on mainframes or headless
    servers), this may be impossible. Instead of relying on expensive third-party
    components such as IP KVMs or hardware remote-access cards, SUSE Linux Enterprise
    Server bundles remote installation methods such as'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# Figure C-10


    VNC (Web- or client-based), SSH or even telnet. Although Red Hat Enterprise Linux
    does support those options, initiating these methods is more complex and much
    less clear than it is in SUSE Linux Enterprise Server. Any of these remote-access
    methods may be specified prior to installation at the boot prompt.


    # Using VNC


    To enable a VNC-based installation on SUSE Linux Enterprise Server, simply add
    the following to the boot options when initiating the install:


    ```

    vnc=1 vncpassword=password

    ```


    A typical remote-installation boot options line that will use VNC will use a boot
    options line like the following:


    ```

    inromd=pcrel32 vnc=1 vncpassword=mowill dhcp=1

    install-http://10.0.0.254/ sle9/sledinst

    ```


    Note: The above command line options should be typed in the boot options dialog
    as one line.


    The system will initiate the installation, enable the VNC server and supply the
    VNC server with the proper password. It will then display an IP address and server
    instance on the screen for you to attach to with a Java-enabled browser or a VNC
    client on any platform.


    # Using SSH


    A similar process is used for an SSH installation. You can use the same boot options
    line as shown above, replacing the VNC-related information with SSH setup info:


    ```

    inromd=pcrel32 usessh=1 password=mowill dhcp=1

    install-http://10.0.0.254/sles9/sledinst

    ```


    Note: The above command line options should be typed in the boot options dialog
    as one line.


    Upon starting the installation binaries, the screen will display an IP address
    to which you can attach as the root user using your SSH client. This will cause
    the YaST installer to display on your local machine.


    Note: When using SSH to connect and redirect X applications, use the -X parameter.
    For example, if the system being installed has the IP address 10.0.0.144, you
    would use the following SSH command to attach to it properly:


    ```

    ssh root@10.0.0.144 yat

    ```


