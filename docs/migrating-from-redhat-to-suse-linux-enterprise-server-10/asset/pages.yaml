- pgno: 151
  md: '+   - **manual**. The device must be started manually with ifup.

    +   - **ifplugd**. The interface is controlled by ifplugd. If you want to use
    interfaces mutually exclusive, also set **IFPLUGD_PRIORITY**


    +   - **UNIQUE=''rBUF.+xOLBZCSAOQ''_\nm_name=''bus-pci-0000:00:0b.0''**

    +   These 2 lines contain options added by YaST when the device is configured.
    They don''t affect the network configuration itself.


    +   - **BROADCAST=''''

