- pgno: 204
  md: '# ## Objective 4


    # ## Configure Logical Volume Manager (LVM) and Software RAID


    Logical volume manager (LVM) provides a higher-level view of the disk storage
    on a computer system than the traditional view of disks and partitions. This gives
    you much more flexibility in allocating storage space to applications and users.


    After creating logical volumes with LVM, you can (within certain limits) resize
    and move logical volumes while they are still mounted and running.


    You can also use LVM to manage logical volumes with names that make sense (such
    as “development” and “sales”) instead of physical disk names such as “sda” and
    “sdb.”


    To configure a file system with LVM, you need to know the following:


    +   *   Use LVM Components

    +   *   Use LVM Features

    +   *   Configure Logical Volumes with YaST

    +   *   Configure LVM with Command Line Tools


    The Linux Kernel is capable of combining hard disks to arrays with the RAID levels
    0, 1, 5, and 6. Software RAID is covered in


    +   *   Manage Software RAID


    # **Use LVM Components**


    Conventional partitioning of hard disks on a Linux file system is basically inflexible.
    When a partition is full, you usually have to move data to another medium before
    you can resize the partition, create a new file system, and copy the files back.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Normally, these changes cannot be implemented without changing adjacent partitions,
    whose contents also need to be backed up to other media and written to their original
    locations after the re-partitioning.


    Because it is difficult to modify partitions on a running system, LVM was developed.
    It provides a virtual pool of memory space (called a volume group) from which
    logical volumes can be generated if needed. The operating system accesses these
    logical volumes like conventional physical partitions.


    This approach lets you resize the physical media during operation without affecting
    the applications.


    The basic structure of LVM includes the following components:


    # **Figure 4-6**


    ![](img/63e88022bf135307e3eac051ad238b5b_205_0.png)


    +   *   **Physical volume**. A physical volume can be a partition or an entire
    hard disk.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "+   - **Volume group**. A volume group consists of one or several physical\
    \ volumes grouped together. The physical partitions can be spread over different\
    \ hard disks. You can add hard disks or partitions to the volume group during\
    \ operation whenever necessary.\n+   \n+      The volume group can also be reduced\
    \ in size by removing physical volumes (hard disks or partitions).\n\n+   - **Logical\
    \ volume**. A logical volume is a part of a volume group. A logical volume can\
    \ be formatted and mounted like a physical partition.\n\nYou can think of volume\
    \ groups as hard disks and logical volumes as partitions on those hard disks.\
    \ The volume group can be split into several logical volumes that can be addressed\
    \ with their device names (such as /dev/system/usr) like conventional partitions\
    \ with theirs (dev/hda1).\n\n> Just as with other direct manipulations of the\
    \ file system, a data backup should be made before configuring LVM.\n\n# ## Use\
    \ LVM Features\n\nLVM is useful for any computer, as it is very flexible when\
    \ the need to adapt to changed needs for storage space arises.\n\nThe following\
    \ are features of LVM that help you implement storage solutions:\n\n+   - You\
    \ can combine several hard disks or partitions into a large volume group.\n+ \
    \  - Provided there is unallocated space in the volume group, you can enlarge\
    \ a logical volume when free space within the logical volume is exhausted. Resizing\
    \ logical volumes is easier than resizing physical partitions."
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - You can create extremely large logical volumes (Terabytes).


    +   - You can add hard disks to the volume group in a running system, provided
    you have hot-swappable hardware capable of such actions.


    +   - You can add logical volumes in a running system, provided there is free
    space in the volume group.


    +   - You can use several hard disks with improved performance in the RAID 0 (striping)
    mode.


    +   - There is no limit that is relevant in practice on the number of logical
    volumes (the limit in LVM version 1 was 256).


    +   - The Snapshot feature enables consistent backups in the running system.


    # **Configure Logical Volumes with YaST**


    The following are the basic steps for configuring logical volumes (LVM) with YaST:


    +   - Define the LVM Partitions (Physical Volumes) on the Hard Drive


    +   - Create the Volume Group and Logical Volumes


    +   - Access the YaST Module lvm_config


    # **Define the LVM Partitions (Physical Volumes) on the Hard Drive**


    During (or after) the installation of SUSE Linux Enterprise Server, you need to
    configure the LVM partition on the hard disk.


    You can use YaST or fdisk to perform this task as described in “Configure Linux
    File System Partitions” on page 4-13.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'For the File system ID, select **0x8E Linux LVM**. Do not create a file system
