- pgno: 118
  md: '+   * **User ID Limitations**. Enter a minimum and maximum value to configure
    a range of possible user ID numbers. New users get a UID from within this range.


    +   * **Group ID Limitations**. Enter a minimum and maximum value to configure
    a range of possible group ID numbers.


    When you finish configuring user and group ID limitations, continue by selecting
    **Next**. The last page of the security configuration appears:


    # Figure 2-23


    ![](img/63e88022bf135307e3eac051ad238b5b_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'From this dialog, you can select the following miscellaneous global settings:


    +   * **File Permissions.** Settings for the permissions of certain system files
    are configured in /etc/permissions.easy, /etc/permissions.secure, or /etc/permissions.paranoid.
    You can also add your own rules to the file /etc/permissions.local. Each file
    contains a description of the file syntax and purpose of the preset. Settings
    in files in the directory /etc/permissions.d/ are included as well. This directory
    is used by packages that bring their own permissions files.


    From the drop-down list, select one of the following:


    +   - **Easy.** Select this option to allow read access to most of the system
    files by users other than root.

    +   - **Secure.** Select this option to make sure that certain configuration files
    (such as /etc/ssh/sshd_config) can only be viewed by the user root. Some programs
    can only be launched by root or by daemons, not by an ordinary user.

    +   - **Paranoid.** Select this option for an extremely secure system. All SID/SID-Bits
    on programs have been cleared. Remember that some programs might not work correctly,
    because users no longer have the permissions to access certain files.


    Running SuSEconfig sets these permissions according to the settings in the respective
    /etc/permissions.* files. This fixes files with incorrect permissions, whether
    this occured accidentally or by intruders.


    +   * **User Launching updatedb.** If the program updatedb is installed, it automatically
    runs on a daily basis or after booting. It generates a database (locatedb) in
    which the location of each file on your computer is stored.


    You can search this database with the utility locate (enter **man locate** for
    details).


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'From the drop-down list, select one of the following:


    +   *   **nobody.** Any user can find only the paths in the database that can
    be seen by any other (unprivileged) user.


    +   *   **root.** All files in the system are added into the database.


    +   1.  **Current Directory in root’s Path and Current Directory in the Path of
    Regular Users.**


    If you deselect these options (the default), users must always launch programs
    in the current directory by adding “\.” (such as ./**configure**).


    If you select these options, the dot (“\.”) is appended to the end of the search
    path for root and users, allowing them to enter a command in the current directory
    without appending “../”.


    Selecting these options can be very dangerous because users can accidentally launch
    unknown programs in the current directory instead of the usual system-wide files.


    This configuration is written to /etc/sysconfig/suseconfig.


    +   2.  **Enable Magic SysRq Keys.** Selecting this option gives you some control
    over the system even if it crashes (such as during kernel debugging). For details,
    see /usr/src/linux/Documentation/sysrq.txt.


    This configuration is written to /etc/sysconfig/sysctl.


    When you finish configuring the miscellaneous settings, save the settings and
    run SuSeconfig by selecting **Finish**.'
  merge: -1
  img_proc: true
