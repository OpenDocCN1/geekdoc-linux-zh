- pgno: 239
  md: "+   * **Other.** When you select this, a drop-down menu with the following\
    \ additional choices opens up:\n\n+       * **Edit Configuration Files.** Display\
    \ and edit the configuration files (/boot/grub/device.map, /boot/grub/menu.lst,\
    \ or /etc/grub.conf).\n+   \n+           Note: /etc/grub.conf on SLES 10 contains\
    \ the information needed to install the bootloader (`grub --batch < /etc/grub.conf`),\
    \ while the same file on RHEL has the same content as /boot/grub/menu.lst.\n\n\
    +       * **Propose New Configuration.** This option generates a new configuration\
    \ suggestion. Older Linux versions or other operating systems found on other partitions\
    \ are included in the boot menu, enabling you to boot Linux or its old boot loader.\
    \ The latter takes you to a second boot menu.\n\n+       * **Start from Scratch.**\
    \ This option lets you create the entire configuration from scratch. No suggestions\
    \ are generated.\n\n+       * **Reread Configuration from Disk.** If you already\
    \ performed some changes and are not satisfied with the result, you can reload\
