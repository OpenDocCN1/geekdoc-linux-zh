- pgno: 213
  md: "The configuration options are the same as those accessed by selecting LVM in\
    \ the YaST Expert Partitioner.\n\n> For additional information on configuring\
    \ LVM, see the LVM HOWTO at http://tldp.org/HOWTO/LVM-HOWTO/.\n\n# ## Configure\
    \ LVM with Command Line Tools\n\nSetting up LVM consists of several steps, with\
    \ a dedicated tool for each:\n\n+   - Tools to Administer Physical Volumes  \n\
    +   - Tools to Administer Volume Groups  \n+   - Tools to Administer Logical Volumes\n\
    \nThis is just a brief overview, not all available LVM tools are covered. To view\
    \ the tools that come with LVM, enter  \n`rpm -ql vm2 | less` on a command line,\
    \ and have a look at the corresponding manual pages for details on each of them.\n\
    \n# ### Tools to Administer Physical Volumes\n\nPartitions or entire disks can\
    \ serve as physical volumes for LVM.\n\nThe ID of a partition used as part of\
    \ LVM should be **Linux LVM, 0x8e**. However the ID **0x83, Linux**, works as\
    \ well.\n\nTo use an entire disk as physical volume, it may not contain a partition\
    \ table. Overwrite any existing partition table with `dd`:\n\n```\nda10:~ # dd\
    \ if=/dev/zero of=/dev/hdd bs=512 count=1\n```"
