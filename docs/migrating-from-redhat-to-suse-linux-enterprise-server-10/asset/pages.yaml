  md: '# Figure C-26


    the system in the /media directory, such as /media/CRUZZER for a SanDisk Cruzer
    1 GB USB drive.


    With Red Hat’s Enterprise Linux Version 4 release, both similarly use the /mnt
    and /media directories, thus reducing a point of possible confusion.


    | | **Red Hat Enterprise Linux** | **SUSE Linux Enterprise Server** |

    |---|---|---|

    | | File Systems and Volumes | |

    | Mounting | Removable media | Removable media |

    | | • udev (Red Hat Enterprise Linux 4) | • submount2=suufs |

    | | • hotplug+udfsd/ud (Red Hat Enterprise Linux 3) | • /dev/cdrom and /media/cdrom
    are governed by suufs |

    | Directories | /mnt /media | /media |

    | Permissions | | Enables POSIX ACL’s by default |

    | Default FS | Ext3 | Reiser |

    | File Systems Not Supported | Reiser\* JFS and XFS not supported in the kernel
    or as modules | N/A |

    | **Note:** | \*Reiser needs special driver support in Red Hat Enterprise Linux
    4. Use the “linux reiserfs” load-time option to enable. | |


    # DOCUMENTATION AND HELP RESOURCES


    SUSE Linux Enterprise Server documentation is stored in the /usr/share/doc/folders.
    The package’s directory contains package-specific documentation. The SUSE Linux
    Enterprise Server administration guide (PDFs and HTML) are located under /manual/sles-admin_en,
    and release notes are contained in release-notes/.


    **Man pages:** In accordance with the default manpage directory specified in the
    FHS (www.pathshare.com/Thu/pub/Thu-2.2.html#OSSHSHEADMINMANPAGES), additional
    man-page search directories are added to the MANPATH variable. This, of course,
    depends on the software installed, but the most common additions are:'
