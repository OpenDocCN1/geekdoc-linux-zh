- pgno: 448
  md: '# SECTION A

    Appendix: AutoYaST


    This section explains how to perform an automated installation using the AutoYaST
    feature of SUSE Linux Enterprise Server 10.


    AutoYaST facilitates the roll-out of large numbers of machines. The installation
    is controlled by an XML file which contains the machine specific information,
    e.g. IP address, hostname, partitioning, etc. Manual intervention during the installation
    process is unnecessary.


    The installation is started using a CD, a boot floppy disk or a PXE capable network
    card.


    The installation source can be the set of CDs as well as an installation server
    in the network. The supported protocols for accessing the repository on the installation
    server are NFS, HTTP and FTP.


    # Objectives


    +   1. Autoinstallation Basics

    +   2. Set up an Installation Server

    +   3. Create a Configuration File for AutoYaST

    +   4. Start the Installation'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# **Objective 1**


    # **Autoinstallation Basics**


    Both Red Hat and SUSE Linux Enterprise Server 10 provide a way to automate installations:


    - Kickstart on RHEL4

    - AutoYaST on SUSE Linux Enterprise Server 10


    # **Kickstart on RHEL4**


    Red Hat uses the anaconda tool for the installation. If you set up the installation
    automatically this is referred to as kickstart environment.


    The kickstart configuration file is a regular text file that contains the answers
    to installation questions in separate lines.


    When installing a Red Hat system, a kickstart configuration file anaconda-ks.cfg
    will be created in the home directory of the root user (/root). This file contains
    the settings you entered during the installation. Before using it you have to
    uncomment the lines containing the partition setup.


    To create a kickstart file from scratch you would use the tool system-config-kickstart.
    Manual editing of the file is required if you want setup software raid or LVM.


    # **AutoYaST on SUSE Linux Enterprise Server 10**


    AutoYaST is the tool for automated installations on SUSE Linux Enterprise Server
    10. All information needed during installation, e.g. partitioning or software
    selection, is provided by a control file in XML format. No manual intervention
    is necessary during the installation process.'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'If you have to install several systems with the same setup you can save time
    by automating the installation. Depending on your requirements, you can ensure
    all systems are set up with the same configuration, or configure systems individually
    with specific control files.


    You should not confuse auto installation with cloning or imaging. An automated
    installation is a regular installation where answers to questions asked during
    the installation are contained in the control file. The hardware detection is
    still done so that the same control file can be used on diverse hardware. Imaging
    or cloning require identical hardware of source and target of the image.


    AutoYaST is optimally used in conjunction with an installation server also providing
    a TFTP and a DHCP server. The advantages are:


    +   To start the installation, you only have to insert a suitable boot disk.


    +   The computer receives all information necessary for the installation via the
    network.


    +   In conjunction with wake-on-lan and/or PXE boot-enabled network interface
    cards, not even a boot disk is required.


    +   Even the on-site attendance of an administrator is not necessary for the installation.


    The installation server can be accessed via the protocols NFS, HTTP and FTP.


    This results in a highly simplified installation of a large number of individually
    configured computers.


    AutoYaST can also be used to copy additional files into the installed system,
    as well as scripts which are executed at the end of the installation.


    # 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 451
