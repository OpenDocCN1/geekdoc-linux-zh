- pgno: 192
  md: '# Mount File Systems


    In Windows systems separate drive letters represent different partitions. Linux
    does not use letters to designate partitions, it mounts partitions to a directory
    in the file system. Directories used for mounting are also called *mount points*.


    For example, to add a new hard disk to a Linux system, first you partition and
    format the drive. You then use a directory (such as /data/) in the file system
    and mount the partition to that directory using the command **mount**.


    To unmount (detach) a file system, you use the umount command (for details, enter
    **man umount**).


    ![](img/63e88022bf135307e3eac051ad238b5b_192_0.png)


    You can also mount remote file systems, shared via the Network File System (NFS),
    to directories you create in your file system.


    The directory /mnt/ is used by default for temporarily mounting local and remote
    file systems. All removable devices are mounted by default to /media/, such as
    the following:


    +   - A CD-ROM on /dev/cdrom is mounted by default to /media/cdrom.


    +   - A floppy disk on /dev/floppy is mounted by default to /media/floppy.


    The above is identical to the scheme used on RHEL.


    When using SLES 10 from a desktop environment such as GNOME or KDE, media such
    as floppy disks and CDs are automatically mounted and unmounted. If the CD-ROM
    has a label, it is mounted to /media/label.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'To manage mounting (and unmounting) file systems, you need to know the following:


    +   - Configuration File for Mounting File Systems: /etc/fstab

    +   - View Currently Mounted File Systems

    +   - Mount a File System

    +   - Unmount a File System


    # Configuration File for Mounting File Systems: /etc/fstab


    The file systems and their mount points in the directory tree are configured in
    the file /etc/fstab. This file contains 1 line with 6 fields for each mounted
    file system.


    The lines look similar to the following:


    | Field 1 | Field 2 | Field 3 | Field 4 | Field 5 | Field 6 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/hda2 | / | reiserfs | acl, user, xattr | 1 | 1 |

    | /dev/hda1 | swap | swap | defaults | 0 | 0 |

    | proc | /proc | proc | defaults | 0 | 0 |

    | sysfs | /sys | sysfs | noauto | 0 | 0 |

    | debugfs | /sys/kernel/debug | debugfs | noauto | 0 | 0 |

    | usbfs | /proc/bus/usb | usbfs | noauto | 0 | 0 |

    | devpts | /dev/pts | devpts | mode=0620, gid=5 | 0 | 0 |

    | /dev/fd0 | /media/floppy | auto | noauto, user, sync | 0 | 0 |


    Each field provides the following information for mounting the file system:


    +   - Field 1. Lists the name of the device file, or the file system label, or
    the UUID (Universally Unique Identifier). Use of LABEL=label or UUID=uuid has
    the advantage that the partition is mounted correctly even if the device file
    used changes, for instance because you swapped hard disks on the IDE controller.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "+   \n+   *   **Field 2.** Lists the mount point—the directory to which the\
    \ file system should be mounted. The directory specified here must already exist.\
    \ You can access the content on the media by changing to the respective directory.\n\
    +   *   **Field 3.** Lists the file system type (such as ext2, reiserfs).\n+ \
    \  *   **Field 4.** Shows the mount options. Multiple mount options are separated\
    \ by commas (such as `noauto`, `user`, `sync`).\n+   *   **Field 5.** Indicates\
    \ whether to use the backup utility `dump` for the file system. `0` means no backup.\n\
    +   *   **Field 6.** Indicates the sequence of the file system checks (with the\
    \ `fsck` utility) when the system is booted:\n+       *   `0`: file systems that\
    \ are not to be checked\n+       *   `1`: the root directory\n+       *   `2`:\
    \ all other modifiable file systems; file systems on different drives are checked\
    \ in parallel\n\nWhile /etc/fstab lists the file systems and where they should\
    \ be mounted in the directory tree during startup, it does not contain information\
    \ on the actual current mounts.\n\nThe /etc/mtab file lists the file systems currently\
    \ mounted and their mountpoints. The mount and umount commands affect the state\
    \ of mounted file systems and modify the /etc/mtab file.\n\nThe kernel also keeps\
    \ information for /proc/mounts, which lists all currently mounted partitions.\n\
    \nFor troubleshooting purposes, if there is a conflict between /proc/mounts and\
    \ /etc/mtab information, the /proc/mounts data is always more current and reliable\
    \ than /etc/mtab.\n\n# 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED"
  merge: -1
