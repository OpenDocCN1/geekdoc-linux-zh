- pgno: 463
  md: '# Objective 4


    # Start the Installation


    To start the automated installation, you need to copy the XML file generated to
    a floppy disk containing a FAT file system format.


    ![](img/63e88022bf135307e3eac051ad238b5b_463_0.png)


    > Do not use a floppy disk with Ext2 file system format.


    The easiest way of installing is using a file name of autoinst.xml on the floppy
    disk. If you saved your control file with a name of da4.xml, copy it to the floppy
    disk by entering


    ```

    cp /var/lib/autoinstall/repository/da4.xml /media/floppy/autoinst.xml

    ```


    Alternatively, you may enter


    ```

    mcopy /var/lib/autoinstall/repository/da4.xml a:autoinst.xml

    ```


    The simplest way of installation is to have a DHCP server running which provides
    all network information during the installation.


    +   1. Insert CD 1 and the floppy disk into your machine and start the boot process.

    +   2. On the first boot screen, stop the boot process by pressing **Tab**.

    +   3. Select **Installation**.

    +   4. Now you have to provide the information that you want to use AutoYaST.'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'At the boot prompt, enter the following parameters (we assume here that the
    installation repository is available via NFS from 10.0.0.3/data/SL\_ES10/):


    ```

    autoyast=floppy:///autoinst.xml install=nfs://10.0.0.3/data/SL\_ES10/ splash=verbose

    ```


    The last parameter switches to the detailed display during the boot process, so
    you can easily look at the boot messages. After a short time, YaST is started.
    The installation starts with the Novell Software License Agreement (which is accepted
    automatically). After some checks, the packages are copied from the NFS server.
    The system is rebooted at the end of the installation process. After the reboot,
    you may log in as root without a password if no password was set in the AutoYaST
    configuration file. You should immediately set a password for root.


    # 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
