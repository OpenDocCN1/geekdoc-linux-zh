- pgno: 14
  md: '# ## Audience


    The primary audience for this course are experienced Red Hat Linux Administrators,
    like RHEs, or those with comparable knowledge.


    # ## Certification and Prerequisites


    This course helps to prepare for the Novell Certified Linux Professional 10 (CLP
    10) Practicum Exam, called the Practicum. The Novell CLP 10 is a prerequisite
    for the higher level certification Novell CLE 10 Practicum.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLP 10 Practicum (050-697).


    The Novell CLP 10 Practicum is a hands-on, scenario-based exam where you apply
