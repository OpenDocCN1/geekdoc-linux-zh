- pgno: 320
  md: "# Understand the Structure and the Basic Elements of the Apache Configuration\
    \ Files\n\nTo configure the Apache web server, you need to do the following:\n\
    \n+   - Locate the Apache Configuration Files\n+   - Understand the Basic Rules\
    \ of the Configuration Files\n\n# Locate the Apache Configuration Files\n\nThe\
    \ configuration of the Apache web server is spread over several configuration\
    \ files located in the directory /etc/apache2/.\n\nThe following is a list of\
    \ the most important Apache configuration files:\n\n+   - **httpd.conf.** This\
    \ is the main Apache configuration file.\n+   \n+   - **default-server.conf.**\
    \ This file contains the basic web server setup. However, all options set in this\
    \ file can be overwritten by other configuration files.\n+   \n+   - **vhost.d/.**\
    \ This is a directory containing configuration files for virtual host setups.\
    \ You will learn more about virtual hosts later in this section.\n+   \n+   -\
    \ **uid.conf.** This configuration file sets the user and group id for Apache.\
    \ By default, Apache uses the user id wwwrun and the group id www.\n+   \n+  \
    \ - **listen.conf.** In this configuration file, you can specify the IP addresses\
    \ and TCP/IP ports Apache is listening to. By default, Apache listens to all assigned\
    \ interfaces on port 80.\n+   \n+   - **server-tuning.conf.** You can use this\
    \ configuration file to fine tune the performance of Apache. The default values\
    \ should be fine unless you are going to run a web server that has to handle a\
    \ lot of requests at the same time.\n+   \n+   - **error.conf.** In this file\
    \ you configure the behavior of Apache when a request cannot be performed correctly."
  merge: -1
  img_proc: true
- pgno: 321
  md: "+   * **ssl-global.conf.** Configure the connection encryption with SSL in\
    \ this configuration file.\n\n# Understand the Basic Rules of the Configuration\
    \ Files\n\nThe options of the Apache configuration files are called *directives*.\
    \ Directives are case sensitive, which means that a word such as “include” is\
    \ not the same as “Include.”\n\nDirectives can be grouped so that they do not\
    \ apply to the global server configuration. In the following, the directives only\
    \ apply to the directory /srv/www/htdocs:\n\n```\n<Directory \"/srv/www/htdocs\"\
    >\n\n  Options None\n  AllowOverride None\n  Order allow,deny\n  Allow from all\n\
    </Directory>\n```\n\nThe directives are grouped by <Directory \"/srv/www/htdocs\"\
    > and </Directory> which limits their validity to the directory /srv/www/htdocs\
    \ only.\n\nYou can use the # character to indicate comments in the configuration\
    \ file. All lines starting with a # are ignored by the Apache server.\n\nWhenever\
    \ you edit the Apache configuration files, you need to reload the web server by\
    \ entering the following:\n\n```\nrcapache2 reload\n```\n\nIn some cases it is\
    \ not enough to reload Apache. You need to stop and restart the web server by\
    \ entering the following:\n\n```\nrcapache2 restart\n```"
  merge: -1
  img_proc: true
- pgno: 322
  md: 'If you are not sure that your changes use the correct syntax, you can verify
    the syntax of the configuration files by entering the following:


    apache2ctl configtest


    If the syntax is correct, the command displays the following message:


    ```

    Syntax OK

    ```


    # ## Understand the Default Apache Configuration


    The main Apache web server configuration is defined in the file \ **/etc/apache2/default-server.conf.
    The following is an overview of the most important directives used in that file:**


    Table 6-1 Directive Description DocumentRoot Specifies the DocumenttRoot of the
    web server. \<Directory "dir name"\> All directives used within this block apply
    only to the specified directory. \</Directory\> Options With this directive additional
    options can be applied to logical blocks like directories. AllowOverride Determines
    whether directives are allowed to be overwritten by a configuration found in a
    .htaccess file in a directory. Alias “fakename” “realname” Allows you to create
    an alias to a directory.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Table 6-1


    | Directive | Description |

    | :--- | :--- |

    | ScriptAlias | Allows you to create an alias for a directory containing scripts
    for dynamic content generation. |


    In most cases the default settings are suitable and don''t need to be changed.


    > An overview of all Apache directives can be found at http://httpd.apache.org/docs-2.0/mod/directives.html.


    # Configure Virtual Hosts


    To use the virtual host feature of Apache, you need to know the following:


    +   - The Concept of Virtual Hosts

    +   - Configure a Virtual Host


    # The Concept of Virtual Hosts


    With the default setup, the Apache server can be reached with a browser using
    the following web addresses (URLs):


    +   - **http://localhost** (from the computer where the web server is running)

    +   - **http//web_server_IP_address**

    +   - **http://web_server_hostname**


    For all of these addresses, Apache serves the same files located in the DocumentRoot
    directory.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Using this setup, you would need a dedicated computer for every domain of the
    Internet. To avoid this, Apache can be configured to host multiple virtual web
    servers on one physical system. These virtual web servers are called virtual hosts.


    To access virtual hosts, a DNS entry is needed for every virtual host of the Apache
    web server.


    The following outlines the steps of sending a request to the virtual host www.example.com:


    +   1. The web browser requests the IP address of the host www.example.com.

    +   2. The browser uses the IP address to request a file from the Apache web server
    listening on the IP address of www.example.com.

    +   3. In the HTTP request, the browser includes the hostname of the server it
    wants to reach.

    +   4. Apache uses the hostname to determine the corresponding virtual host and
    delivers the requested data from that host.


    1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The following illustrates this process:


    # Figure 6-5


    ![](img/63e88022bf135307e3eac051ad238b5b_325_0.png)


    # Configure a Virtual Host


    For every virtual host you need to create a configuration file in the directory
    /etc/apache2/vhosts.d/. The name of the configuration file has to end with .conf.


    You can find a template file vhost.template in the directory /etc/apache2/vhosts.d/
    to use as a base for your configuration file.


    You need to edit the following directives in the template:


    # Table 6-2


    | Directive | Description |

    | --- | --- |

    | ServerAdmin | Enter the email address of the Virtual Host administrator here.
    |'
  merge: -1
  img_proc: true
- pgno: 326
  md: '| Directive | Description |

    | --- |

    | ServerName | Enter the hostname of the virtual host as it is configured in the
    DNS. |

    | DocumentRoot | Set the DocumentRoot of the virtual host. The directory and the
    files in the directory must be readable by the user wwwrun. |

    | ErrorLog | Enter a filename for the error log. The file must be writable for
    the user wwwrun. |

    | CustomLog | Enter a filename for the general log file. The file must be writable
    for the user wwwrun. |

    | ScriptAlias | Set the ScriptAlias to a directory of your choice. The directory
    must not be under the DocumentRoot of the virtual host. If you don’t need scripts
    for dynamic content creation, delete this directive. |

    | <Directory "script_dir"> | If you’ve set a ScriptAlias before, you have to configure
    a directory which contains the script files. If you are not using a ScriptAlias,
    delete this directory block. |

    | <Directory "document_root"> | You need to adjust the path name of this directory
    directive to the path of your DocumentRoot. |


    After customizing the template file, you need to reload the Apache web server.
    You also need to make sure that the settings in DNS are updated so that the **hostname**
    of your virtual host is resolved correctly.


    # **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
