- pgno: 288
  md: "Instead, the file `/etc/postfix/main.cf.SuSEconfig` will be created, which\
    \ can be renamed to `/etc/postfix/main.cf` if necessary.\n\n# **Configure Postfix\
    \ with /etc/postfix/main.cf**\n\nThe main configuration file for Postfix is\n\n\
    **/etc/postfix/main.cf**\n\nThis file is well documented, including detailed comments.\n\
    \nIf you decide to configure Postfix directly by editing the configuration file\
    \ `/etc/postfix/main.cf`, set the variable `MAIL_CREATE_CONFIG` in `/etc/postfix/mail\
    \ to **no**`.\n\nThis will prevent SuSEconfig from overwriting the configuration\
    \ file.\n\n![](img/63e88022bf135307e3eac051ad238b5b_288_0.png)\n\n> In case there\
    \ are multiple lines containing settings for variables, the settings of the last\
    \ definition will be used. This allows putting all your configuration lines at\
    \ the end of the configuration file.\n\nSome important variables are the following:\n\
    \n+   - **queue_directory**. The directory in which the mail queue is located.\
    \ The default entry is `/var/spool/postfix`.\n\n+   - **command_directory**. The\
    \ directory in which the Postfix administration tools are located.\n+   \n+  \
    \ The default entry is `/usr/sbin`.\n\n+   - **daemon_directory**. The directory\
    \ in which the Postfix daemon is located.\n+   \n+   The default entry is `/usr/lib/postfix`.\n\
    \n+   - **mail_owner**. Describes the owner of the mail queue.\n+   \n+   By default,\
    \ this is set to **postfix**."
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   myhostname. Defines the host name of the computer. This value serves later
    as the default value for other parameters. By default, the FQDN is given here.


    +   mydomain. The domain name of the computer. This value serves later as the
    default value for other parameters.


    +   myorigin. The domain that appears as the sender for emails sent locally. The
    default value is the FQDN.


    +   mydestination. Describes a list of domains for which the computer should accept
    emails.


    +   masquerade_domains. For sender addresses of the specified domain(s), the host
    part is removed. For example, geeko@da2.digitalairlines.com becomes geeko@digitaalairlines.com.


    +   masquerade_exceptions. Specifies the users that should not be masqueraded.
    By default root is entered here.


    +   relayhost. All emails that cannot be processed locally are sent to the computer
    specified here.


    +   inet_interfaces. Specifies the network addresses on which Postfix waits for
    incoming mail. The default value is 127.0.0.1. To enable Postfix to receive mail
    from other hosts, enter the IP numbers of the network cards or all.


    +   mynetworks. Lists IP ranges belonging to your network. Postfix can be configured
    to forward mail from hosts in these networks.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'If you don’t want to specify the IP ranges of your network by hand, you can
    use the option **mynetworks_style** which allows three values:


    +   - **class.** Postfix trusts all SMTP clients in the same IP class (A/B/C).

    +   - **subnet.** Postfix trusts all SMTP clients in the same IP subnet.

    +   - **host.** Postfix trusts only the local host.


    +   * **smtpd_recipient_restrictions**, **smtpd_helo_restrictions**, **smtpd_client_restrictions**,
    **smtpd_sender_restrictions.** Control who is allowed to forward email over the
    mail server.


    The variables that are relevant for most deployment scenarios are in the file


    ```

    /etc/postfix/main.cf

    ```


    Variables that are not defined here are assigned default values or remain empty.


    To list all variables used by Postfix and their respective values, enter


    ```

    postconf

    ```


    # **Configure General Scenarios**


    The following scenarios presume that the variable **MAIL_CREATE_CONFIG** in the
    file /etc/sysconfig/mail is set to **no**.


    If it is, the file /etc/postfix/main.cf will not be changed by executing **SuSEconfig**,
    and the file /etc/postfix/main.cf.SuSEconfig will not be generated.


    # **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Because these files usually contain useful settings, only few modifications
    are necessary for some deployment scenarios.


    However, remember that the *last* entry of a variable in the file *etc/postfix/main.cf*
    is valid.


    If an entry is changed, the change does not take effect if a different value is
    assigned later in the file.


    The following topics are described:


    +   - Forward Mail to the Provider’s Mail Server

    +   - Receive Mail over the Internet


    # ## Forward Mail to the Provider’s Mail Server


    If all mail traffic is running from a mail server at the ISP, a small network
    merely needs a mail server that accepts the mail from the clients and passes it
    to the ISP’s mail server.


    Because the local mail server does not serve as the mail server for the company
    domain from the Internet, the configuration is rather simple.


    Such a mail server has to


    +   - Accept mail from the intranet clients.

    +   - Reject mail delivered by other clients.

    +   - Possibly rewrite sender addresses.

    +   - Submit all mail to the provider’s mail server.


    Only few changes are needed in the file *etc/postfix/main.cf*.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'The following entries merely ensure that Postfix only accepts mail from the
    clients in the local network:


    ```

    # 10.0.0.51 is the IP in the LAN

    inet_interfaces = 10.0.0.51, 127.0.0.1

    mynetworks = 10.0.0.0/24, 127.0.0.0/8

    smtpd_recipient_restrictions = permit_mynetworks, reject


    ```


    It is necessary to rewrite addresses to make sure that the sender does not appear
    in the form


    **geeko@da51.digitalairlines.com**


    but in the common form


    **geeko@digitalairlines.com**


    On the other hand, the host is important for messages sent to root.

    Therefore, mail addressed to root should not be rewritten.


    Two entries in the file /etc/postfix/main.cf are sufficient for this simple scenario:


    ```

    masquerade_exceptions = root

    masquerade_domains = digitalairlines.com


    ```


    Moreover, Postfix must be informed of the mail server to which it is supposed
    to deliver the mail.


    The relayhost entry also ensures that Postfix does not attempt to establish a
    direct contact to respective mail servers of the recipients.


    ```

    relayhost = dal.digitalairlines.com


    ```'
  merge: -1
  img_proc: true
