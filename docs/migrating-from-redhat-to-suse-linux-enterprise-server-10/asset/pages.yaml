- pgno: 297
  md: '# # Configure the Lookup Tables


    Lookup tables contain rules for processing email within the overall Postfix system.


    These tables are activated by variables in the file


    ```

    `/etc/postfix/main.cf`

    ```


    The tables are then defined as


    ```

    `/etc/postfix/lookup-table`

    ```


    After a lookup table has been defined, it needs to be converted to the required
    format (usually in the form of a hash table) using the command **postmap**.


    This is done by entering:


    ```

    ```postmap hash:/etc/postfix/lookup-table```

    ```


    The structure of lookup tables is subject to the following general rules:


    +   - Blank lines or lines that begin with a # are not interpreted as command
    lines.

    +   - Lines that begin with a space are regarded as a continuation of the previous
    line.


    It is also possible to use regular expressions.

    Instead of domain names, you also can use IP addresses.


    > > A man page exists for every lookup table: **man 5 lookup-table**.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The following lookup tables are described:


    +   ■  The access Lookup Table

    +   ■  The canonical Lookup Table

    +   ■  The recipient_canonical Lookup Table

    +   ■  The sender_canonical Lookup Table

    +   ■  The relocated Lookup Table

    +   ■  The transport Lookup Table

    +   ■  The virtual Lookup Table

    +   ■  The aliases Lookup Table


    # **The access Lookup Table**


    You can use the /etc/postfix/access lookup table to reject or allow email from
    defined senders.


    The smtpd daemon evaluates this table when email arrives.


    The following topics are described:


    +   ■  Activate the Lookup Table

    +   ■  The access Lookup Table Format


    # **Activate the Lookup Table**


    This function is activated in the file /etc/postfix/main.cf:


    ```

    ```text

    smtpd_sender_restrictions = hash:/etc/postfix/access

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 299
  md: "# **The access Lookup Table Format**\n\nEach line defines a rule that is evaluated\
    \ by smtwd when an email arrives.\n\nThe rules are processed from top to bottom\
    \ and the matching of rules ends when the first match occurs.\n\nEach line consists\
    \ of the definition of an email address in the first column and a defined action\
    \ in the second column.\n\nPossible values for email address patterns are\n\n\
    +   *   **user@domain**. Defines a filter for the specified email address.\n+\
    \   *   **domain.name**. Defines a filter for all email addresses of the specified\
    \ DNS domain.\n+   *   **user@**. Defines a filter for all email addresses with\
    \ the same user part.\n\nPossible values for actions are\n\n+   *   **4xx Text,\
    \ 5xx Text**. Rejects email with the specified numerical code (see RFC821) and\
    \ the defined text message.\n+   *   **REJECT**. Rejects the email with a generic\
    \ error message.\n+   *   **OK**. Accepts the email.\n+   *   **DISCARD** *optional\
    \ text*. Makes sure that the email is discarded without an error message to the\
    \ sender.\n+   \n+       The *optional text* appears in the log file. If no text\
    \ is specified, a generic message appears in the log.\n\nExamples:\n\n```\npostmaster@digitalairlines.com\n\
    spam@hahaha.net\n194.95.93.10\n\nOK\n550 We're fighting against spam!\nREJECT\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 300
  md: 'See the man pages (**man 5 access**) for other possible actions.


    # The canonical Lookup Table


    You can use the /etc/postfix/canonical lookup table to rewrite sender and recipient
    addresses of incoming and outgoing emails.


    Both the header and the envelope are rewritten.


    The cleanup daemon reads this table when an email arrives.


    The following is described:


    +   - Activate the Lookup Table

    +   - The canonical Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.cf:


    ```

    canonical_maps = hash:/etc/postfix/canonical

    ```


    # The canonical Lookup Table Format


    Each line defines a rule that is evaluated by smtpd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    Each line consists of the definition of an email address in the first column and
    a defined action in the second column.


    Possible values for email address patterns are


    +   - **user@domain**. Defines a filter for the specified email address.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "+   - **user**. Defines a filter for all email addresses with the same user\
    \ part, provided the domain part of the email is listed in one of the variables\
    \ $myorigin, $mydestination, $inet_interfaces, or $proxy_interfaces in the /etc/postfix/main.cf\
    \ file.\n\n+   - **@domain**. Defines a filter for all email addresses of the\
    \ specified domain.\n\nPossible values for action are\n\n+   - **user@domain**.\
    \ Rewrites the email address to the value defined here.\n\nExamples:\n\ntraining@digitalairlines.com\
    \   geeko@digitalairlines.com  \n@sdc.digitalairlines.com      sdc@digitalairlines.com\n\
    \nIf you want to convert sender addresses and recipient addresses in a different\
    \ way, use\n\n+   - **recipient_canonical** to convert the recipient addresses\n\
    \n+   - **sender_canonical** to convert the sender addresses\n\n# **The recipient_canonical\
    \ Lookup Table**\n\nYou can use the /etc/postfix/recipient_canonical lookup table\
    \ to convert recipient addresses of incoming and outgoing emails.\n\nThe cleanup\
    \ daemon evaluates this table when an email arrives before the generic lookup\
    \ table /etc/postfix/canonical is evaluated.\n\nThe following topics are described:\n\
    \n+   - Activate the Lookup Table\n\n+   - The recipient_canonical Lookup Table\
    \ Format\n\n**1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**"
  merge: -1
  img_proc: true
- pgno: 302
  md: '# **Activate the Lookup Table**


    This function is activated in the file `/etc/postfix/main.cf` by the entry


    ```

    ```text

    recipient_canonical_maps = hash:/etc/postfix/recipient_canonical

    ```

    ```


    # **The recipient_canonical Lookup Table Format**


    Each line defines a rule that is evaluated by smtppd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    Each line consists of the definition of an email address in the first column and
    a defined action in the second column.


    Possible values for email address patterns are


    +   - **`user@domain`**. Defines a filter for the specified email address.

    +   - **`user`**. Defines a filter for all email addresses with the same user
    part, provided the domain part of the email is listed in one of the variables
    `$myorigin`, `$mydestination`, `$inet_interfaces`, or `$proxy_interfaces` of the
    file `/etc/postfix/main.cf`.

    +   - **`@domain`**. Defines a filter for all email addresses of the specified
    domain.


    Possible values for actions are


    +   - **`user@domain`**. Rewrites the email addresses to the value defined here.


    Examples:


    ```

    ```text

    geeko@digitalairlines.com    training@digitalairlines.com

    @s1c.digitalairlines.com    s1c@digitalairlines.com

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# **The sender_canonical Lookup Table**


    You can use the /etc/postfix/sender_canonical lookup table to rewrite sender addresses
    of incoming and outgoing emails (for outgoing email: login@host_internal.com to
    firstname.surname@mycompany.com).


    The cleanup daemon reads this table when an email arrives before the generic lookup
    table /etc/postfix/canonical is read.


    The following topics are described:


    +   - Activate the Lookup Table

    +   - The sender_canonical Lookup Table Format


    # **Activate the Lookup Table**


    This function is activated in the file /etc/postfix/main.cf by the entry


    ```

    ```

    sender_canonical_maps = hash:/etc/postfix/sender_canonical

    ```

    ```


    # **The sender_canonical Lookup Table Format**


    Each line defines a rule that is evaluated by smtpd when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    Each line consists of the definition of an email address in the first column and
    a defined action in the second column.


    Possible values for email address patterns are


    +   - **user@domain**. Defines a filter for the specified email address.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '+   * **user.** Defines a filter for all email addresses with the same user
    part, provided the domain part of the email is listed in one of the variables
    $mymorigin, $mydestination, $inet_interfaces, or $proxy_interfaces of the file
    /etc/postfix/main.cf.


    +   * **@domain.** Defines a filter for all email addresses of the specified domain.


