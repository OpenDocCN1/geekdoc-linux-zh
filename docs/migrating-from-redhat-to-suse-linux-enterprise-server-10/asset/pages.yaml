- pgno: 12
  md: '# # Introduction


    *Migrating from RedHat to SUSE Linux Enterprise Server 10* (Course 3068) focuses
    on the main differences between Red Hat Enterprise Linux 4 and SUSE Linux Enterprise
    Server 10.


    It enables an experienced Linux administrator familiar with RedHat Enterprise
    Linux 4 to perform administrative tasks on the SUSE Linux Enterprise Server 10
    platform.


    By covering the administrative details specific to SUSE Linux Enterprise Server
    10, this course prepares you to take the Novell Certified Linux Professional 10
    (Novell CLP 10) certification practical test—provided you already have the general
    Linux knowledge covered in the courses *SUSE Linux Enterprise Server 10 Fundamentals*
    (Course 3071), *SUSE Linux Enterprise Server 10 Administration* (Course 3072),
    and *SUSE Linux Enterprise Server 10 Advanced Administration* (Course 3073).


