- pgno: 332
  md: '# ## SECTION 7 AppArmor


    Both, RHEL 4 and SUSE Linux Enterprise Server 10, provide tools to implement Mandatory
    Access Control (MAC). RHEL 4 uses SELinux, while SUSE Linux Enterprise Server
    10 uses AppArmor. SELinux and AppArmor share a similar purpose and both use the
    Linux Security Modules to implement MAC. However, beyond that they are distinctly
    different and there are no tools to convert the SELinux configuration to an AppArmor
    configuration.


    In this section, you will learn to configure AppArmor to protect services running
    on SUSE Linux Enterprise Server 10.


    # ### Objectives


    +   1. Understand the Difference between SELinux and AppArmor

    +   2. Create and Manage AppArmor Profiles

    +   3. Control AppArmor

    +   4. Monitor AppArmor'
  merge: -1
