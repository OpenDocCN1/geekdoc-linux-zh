  md: '# SECTION 4 Manage the Linux File System


    In this section, you learn how to manage your SUSE Linux Enterprise Server 10
    file system by implementing partitions, creating file systems, checking the file
    system for errors, and setting up LVM and software RAID.


    The default installation proposal for partitioning and file systems on SLES 10
    differs from RHEL. The default in SLES 10 does not include LVM, and the file system
    suggested is ReiserFS. Unlike RHEL, SLES 10 also supports XFS.


    # Objectives


    +   Select a Linux File System

    +   Configure Linux File System Partitions

    +   Manage Linux File Systems

    +   Configure Logical Volume Manager (LVM) and Software RAID'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# ## Objective 1    Select a Linux File System\n\nOne of the key roles performed\
    \ by the Linux operating system is providing storage services through creating\
    \ and managing a file system.\n\nTo successfully select a file system that meets\
    \ your server requirements, you need to understand the following about file systems\
    \ available for Linux:\n\n+   - Linux File Systems\n+   - Linux File System Internals\n\
    +   - File System Journaling\n+   - Additional File System Documentation\n\nIt\
    \ is very important to keep in mind that there might be no file system that best\
    \ suits all kinds of applications. Each file system has its particular strengths\
    \ and weaknesses, which must be taken into account.\n\nAlways bear in mind that\
    \ even the most sophisticated file system cannot be a substitute for a reasonable\
    \ backup strategy.\n\n> For additional details on specific file systems (such\
    \ as ext3 and ReiserFS), see Section 18.2 in the **SLES 10 Installation and Administration\
    \ manual** (/usr/share/doc/manual/sles-admin_en/, package sles-admin_en).\n> \n\
    > Also see “Additional File System Documentation” on page 4-12 at the end of this\
    \ objective.\n\n# ### Linux File Systems\n\nThe type of file system you select\
    \ depends on several factors (including speed and journaling). While Linux supports\
    \ several file systems, for a server the choice is usually between three of them."
  merge: -1
  img_proc: true
- pgno: 170
  md: "+   * **ext2/ext3.** The ext2 file system is inode-based, designed for speed,\
    \ is efficient, and does not fragment easily.\n+   Because of these features,\
    \ ext2 continues to be used by many administrators, even though it does not provide\
    \ a journaling feature.\n+   \n+   The ext2 file system has been available for\
    \ many years, and is easily converted to an ext3 file system.\n+   \n+   **ext3.**\
    \ ext3 is the version of the ext2 file system that supports journaling.\n+   *\
    \ **ReiserFS.** Originally designed by Hans Reiser, ReiserFS treats the entire\
    \ disk partition as if it were a single database table, storing not only the file\
    \ metadata, but the file itself.\n+   Directories, files, and file metadata are\
    \ organized in an efficient data structure called a “balanced tree,” which offers\
    \ significant speed improvements for many applications, especially those which\
    \ use lots of small files.\n+   * **XFS.** XFS is a high-performance journaling\
    \ file system from SGI. It provides quick recovery after a crash, fast transactions,\
    \ high scalability, and excellent bandwidth.\n+   \n+   XFS combines advanced\
    \ journaling technology with full 64-bit addressing and scalable structures and\
    \ algorithms.\n\nFor details on XFS, see http://oss.sgi.com/projects/xfs/.\n\n\
    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**"
  merge: -1
  img_proc: true
- pgno: 171
  md: '# **Linux File System Internals**


    File systems in Linux are characterized by the fact that data and administration
    information are kept separate. Each file is described by an *inode* (index node
    or information node).


    Each of these inodes has a size of 128 bytes and contains all the information
    about this file except the filename. This includes details such as the owner,
    access permissions, the size, various time details (time of modification, last
    time of access, and time of modification of the inode), and the links to the data
    blocks of the file.


    How data organization takes place differs from one file system format to the next.
    To understand the basics of file system data organization on Linux, you need to
    know the following:


    +   - ext2fs File System Format

    +   - ReiserFS Format

    +   - Directories

    +   - Network File System Formats


    # **ext2fs File System Format**


    The ext2 file system format is, in many ways, identical to traditional UNIX file
    system formats. The concepts of inodes, blocks, and directories are the same.


    When a file system is created (the equivalent of formatting in other operating
    systems), the maximum number of files that can be created is specified. The inode
    density (together with the capacity of the partition) determines how many inodes
    can be created.


    Remember that it is not possible to generate additional inodes later. You can
    only specify the inode density when creating the file system.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'An inode must exist for each file or directory on the partition. The number
    of inodes also determines the maximum possible number of files. Typically, an
    inode is generated for 4096 bytes of capacity.


    On average, each file should be 4 KB in size for the capacity of the partition
    to be used optimally. If a large number of files are smaller than 4 KB, more inodes
    are used compared with the capacity.


    This can result in the system being unable to create any more files, even if there
    is still space on the partition.


    For applications that create a large number of very small files, the inode density
    should be increased by setting the corresponding capacity to a smaller value (such
    as 2048 or even 1024). However, the time needed for a file system check will increase
    substantially.


    The space on a partition is divided into *blocks*. These have a fixed size of
    1024, 2048, or 4096 bytes. You specify the block size when the file system is
    created; it cannot be changed later.


    The block size determines how much space is reserved for a file. The larger this
    value is, the more space is consumed by the file, even if the actual amount of
    data is smaller.


    In the classic file system formats (to which ext2 also belongs), data is stored
    in a linear chain of blocks of equal size. A specific number of blocks is grouped
    together in a block group (as illustrated in the following) and each block group
    consists of 32768 blocks:


    ![](img/63e88022bf135307e3eac051ad238b5b_172_0.png)


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The boot sector is located at the beginning of this chain and contains static
    information about the file system, including where the kernel to load can be found.


    Each block group contains the following components:


    +   **Superblock.** The superblock is read when the file system is mounted and
    contains the following information about the file system:


    +   The number of free and occupied blocks and inodes.


    +   The number of blocks and inodes for each block.


    +   Information about file system use, such as the time of the last mount, the
    last write access, and the number of mounts since the last file system check.


    +   A valid bit, which is set to **0** when the file system is mounted and set
    to **1** again by unmount.


    When the computer is booted, the valid bit is checked. If it is set to 0 (power
    failure or reset), the automatic file system check is started.


    The remains of files that can no longer be reconstructed are stored in the directory
    lost+found (in an ext2/ext3 file system).


    For reasons of security, there are copies of the superblock. Because of this,
    the file system can be repaired, even if the first superblock has been destroyed.


    +   **Group Descriptor.** Information on the location of other areas (such as
    block bitmap and inode bitmap) is stored here. This information is stored at several
    locations within the file system for reasons of data security.


    +   **Block Bitmap.** Information is stored here indicating which blocks in this
    group are free or occupied.


    +   **Inode Bitmap.** Information is stored here indicating which inodes are free
    or occupied.


    1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   ▪ **Inode Table.** File information is stored in this table that includes
    owners, access permissions, time stamps, and links to the data blocks in which
    the data is located.


    +   ▪ **Data Blocks.** This is where the actual data is located.


    The ext2 file system format can process filenames with a length of up to 255 characters.
    With the path, a name can be a maximum of 4096 characters in length (slashes included).


    A file can be up to 16 GB in size for a block size of 1024 bytes or two TB for
    a block size of 4096 bytes. The maximum file system size is two TB (with a block
    size of 1024 bytes) or 16 TB (with a block size of 4096 bytes).


    ![](img/63e88022bf135307e3eac051ad238b5b_174_0.png)


    > The limitation on file size remains for the ext2 file system. However, the kernel
    can now handle files of almost any size.


    # ReiserFS Format


    On a file system with ext2 and a block size of 1024 bytes, a file 8195 bytes in
    size occupies 8 blocks completely and a ninth block with three bytes.


    Even though only three bytes are occupied, the block is no longer available. This
    means that approximately 11 percent of available space is wasted.


    If the file is 1025 bytes in size, two blocks are required, one of which is almost
    completely empty. Almost 50 percent of the space is wasted.


    A worst case occurs if the file is very small: even if the file is only 50 bytes
    in size, a whole block is used (95 percent wasted).'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'A solution to this problem is provided by the ReiserFS format, which organizes
    data in a different way. This file system format has currently a fixed block size
    of 4096 bytes.


    However, small files are stored more efficiently. Only as much space is reserved
    as is actually required—not an entire block. Small files or the ends of files
    are stored together in the same block.


    The inodes required are not generated when the file system is created, but only
    when they are actually needed. This allows a more flexible solution to storage
    requirements, increasing efficiency in the use of hard drive space.


    Another advantage of the ReiserFS is that access to files is quicker. This is
    done through the use of balanced binary trees in the organization of data blocks.


    However, balanced trees require considerably more processing power because after
    every file is written the entire tree must be rebalanced.


    The current version of the ReiserFS (3.6) contained in the kernel since version
    2.4.x allows a maximum partition size of 16 TB. A file also has a maximum size
    of 16 TB.


    The same limitations exist for filenames as with the ext2 file system format.


    # ### Directories


    Inodes contain all the administrative information for a file, but not the filename.
    The filename is stored in the directory.


    Like a catalog, directories contain information on other files. This information
    includes the number of the inode for the file and its name.


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Directories serve as a table in which inode numbers are assigned line-by-line
    to filenames. You can view the inode assigned to a filename by using the command
    `ls -i`, as in the following:


    ```

    dal0:~ # ls -i /           104002 cdr0m   80045 floppy    104081 mnt     103782
    sbin

    2 .              99068 dev     95657 home      81652 opt     80044 tmp

    2 ..             104004 dvd   102562 lib       1 proc       4 usr

    104005 bin       104004 etc    95718 media     81598 root    80046 var

    2 boot           95722 etc    95718 media     81598 root    80046 var

    ```


    Each filename is preceded by the inode number.


    On this particular SUSE Linux server there are 2 partitions: one holds the root
    directory /, and one holds the directory /boot/.


    Because inodes are always uniquely defined on one partition only, the same inode
    numbers can exist on each partition.


    In the example, the two entries “.” (a link to the current directory—here the
    root directory) and boot (the second partition is mounted on this directory) have
    the same inode number (2), but they are located on different partitions.


    If you were to unmount the /boot partition, ls -i would show a different inode
    number, that of the directory /boot (the mountpoint) on the root partition. The
    same holds true for /proc.


    The file “..”, which is actually a link to the previous layer in the direction
    of the root directory, also has an inode number of 2. Because you are already
    in the root directory, this link points to itself. It is another name entry for
    an inode number.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'The table (the directory file) for the root directory can be represented as
    in the following example:


    # **Table 4-1**


    | Inode Number | Filename |

    |---|---|

    | 2 | . |

    | 2 | .. |

    | 4 | usr |

    | 5 | proc |

    | 18426 | boot |

    | 80044 | tmp |

    | 80045 | floppy |

    | 80046 | var |

