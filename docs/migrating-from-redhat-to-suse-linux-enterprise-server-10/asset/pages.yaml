  md: '# **Objective 3**


    # ### **Troubleshoot the Installation Process**


    SUSE Linux Enterprise Server 10 has been installed and tested on many different
    machines and hardware platforms. However, sometimes problems can occur.


    The following table contains an overview of the most common installation problems,
    possible causes, and solutions:


    | **Table 1-1** |  |  |  |

    | :------------- | :--------------------------------------------------- | :----------------------------------------------------------
    | :---------------------------------------------------------- |

    | | Problem | Possible Cause | Solution |

    | | The system does not start from the installation media. | The system is not
    configured to boot from the CD or DVD drive. | Enter the BIOS setup of the system
    and choose the CD or DVD drive as the first boot drive. Read the system manual
    for details about the BIOS setup. |

    | | | The CD or DVD drive is defective. | Try to boot a different system with
    *SLES 10 CD 1*. If it works, the CD or DVD drive of the actual system might be
    defective. |

    | | | The installation CD or DVD is defective. | If the installation CD does not
    boot on a different system, the CD or DVD itself could be defective. Contact your
    reseller to exchange the SLES 10 CD or DVD set. |'
  merge: -1
  img_proc: true
- pgno: 72
  md: '| Problem | Possible Cause | Solution |

    | --- | --- | --- |

    | The installation program does not start. | Your system does not support newer
