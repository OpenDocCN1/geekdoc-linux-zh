- pgno: 199
  md: '# ## Check a File System


    Once you set up and begin using your Linux file system, you can monitor the status
    and health of the system by doing the following from the command line:


    +   - Check lost+found (ext2 and ext3 only)

    +   - Check and Repair File Systems (fsck)

    +   - Check and Repair ext2/ext3 and ReiserFS (e2fsck and reiserfsck)

    +   - Use Additional Tools to Manage File Systems


    # ### Check lost+found (ext2 and ext3 only)


    The directory lost+found is a special feature of the ext2 and ext3 file system
    format. After a system crash, Linux automatically carries out a check of the complete
    file system. Files or file fragments to which a name can no longer be allocated
    are not simply deleted, but stored in this directory.


    By reviewing the contents of this directory, you can try to reconstruct the original
    name and purpose of a file.


    # ### Check and Repair File Systems (fsck)


    The command fsck lets you check and optionally repair one or more Linux file systems.
    Normally, fsck tries to run file systems on different physical disk drives in
    parallel to reduce the total amount of time to check all file systems.


    If you do not specify a file system on the command line and do not specify the
    option -A, fsck defaults to checking file systems in /etc/fstab serially.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'fsck is a frontend for the various file system checkers (**fsck_fstype**) available
    on the system. The fsck utility looks for the system-specific checker in /sbin/
    first, then in /etc/fs/ and /etc/, and finally in the directories listed in the
    PATH environment variable.


    To check a specific file system, use the following syntax:


    ```

    `fsck device`

    ```


    For example if you wanted to check the file system on /dev/hda2, you would enter
    **fsck /dev/hda2**.


    Some options that are available with fsck include -A (walk through the /etc/fstab
    file and try to check all the file systems in one pass), -N (don''t execute, just
    show what would be done), and -V (verbose output).


    # ## Check and Repair ext2/ext3 and ReiserFS (e2fsck and reiserfsck)


    Switching off the Linux system without unmounting partitions (for example, when
    a power outage occurs) can lead to errors in the file system.


    The next time you boot the system, the fact that the computer was not shut down
    correctly is detected and a file system check is performed. If errors are found
    in the file system, they are corrected, if possible. If not, the computer does
    not start up properly and you are prompted to enter the root password, together
    with a hint on how to correct the issue. In cases of severe file system damage,
    you may even have to resort to the rescue system to repair the system.


    Depending on the file system type, you use either /sbin/e2fsck or /sbin/reiserfsck.
    These tools check the file system for a corrupt superblock (the block at the beginning
    of the partition containing information on the structure of the file system),
    faulty data blocks, or faulty allocation of data blocks.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'A possible problem in the ext2 (or ext3) file system is damage to the superblock.
    You can first view the location of all copies of the superblock in the file system
    using **dumpext2fs**.


    Then, with **e2fsck**, you can use one of the backup copies, as in the following:


    ```

    ```

    e2fsck -f -b 32768 /dev/hda1

    ```

    ```


    In this example, the superblock located at data block 32768 in the ext2 file system
    of the partition /dev/hda1 is used and the primary superblock is updated appropriately
    upon completion of the file system check.


    > > With a block size of 4k, a backup copy of the superblock is stored every 32768
    blocks.


    With **reiserfsck**, the file system is subjected to a consistency check. The
    journal is checked to see if certain transactions need to be repeated. With the
    option --**fix-fixable**, errors such as wrong file sizes are fixed as soon as
    the file system is checked.


    With an error in the binary tree, it is possible to have this rebuilt by entering
    **reiserfsck --rebuild-tree**.


    # ### Use Additional Tools to Manage File Systems


    There are additional tools to administer various aspects of file systems.


    **tune2fs** is used to adjust tunable filesystem parameters on ext2/ext3 file
    systems. Amongst these is the number of days or number of mounts a file system
    check is done. It is also used to add a label to the file system, or to add a
    journal to an ext2 file system, turning it into an ext3 file system.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '**reiserfstune** is the corresponding tool for ReiserFS. See the reiserfstune
    manual page for options and uses for this tool.


    **resize2fs** and **resize_reiserfs** are used to shrink or enlarge an ext2/3
    and ReiserFS, respectively. resize_reiserfs can enlarge ReiserFS online. Shrinking
    file systems as well as enlarging ext2/3 can only be done while the file system
    is unmounted.


    > As stated before, when planning to manipulate partitions and file systems, back
    up your data first!


    # 1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED'
  merge: -1
  img_proc: true
