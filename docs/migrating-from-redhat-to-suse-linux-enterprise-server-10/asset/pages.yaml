- pgno: 78
  md: '# SECTION 2 YaST


    YaST (*Yet another Setup Tool*) is not only used during installation, but also
    for many different tasks during routine system administration.


    In RHEL, separate tools (system-config-*) are used for specific purposes. In SUSE
    Linux Enterprise Server, YaST is the central system management tool. All YaST
    modules are accessible from the YaST Control Center. However, YaST modules can
    also be started separately.


    This section covers the purpose of YaST and its key modules. Further modules will
    be covered in the remaining sections of this course.


    # Objectives


    +   1. Get to Know YaST

    +   2. YaST Software Management

    +   3. Manage User and Group Accounts with YaST

    +   4. Find the YaST Module You Need


    **1 HARDCOPY PERMITTED-NO DISTRIBUTION ALLOWED**'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# ## Objective 1  Get to Know YaST


    To understand YaST, you should be familiar with


    +   - The YaST User Interface

    +   - The Role of SuSEconfig


    # ### *The YaST User Interface*


    The YaST user interface can appear in two kinds:


    +   - **ncurses**. Text mode

    +   - **QT**. Fully graphical mode


    The appearance of the user interface depends on which command you use to start
    YaST and on whether you use the graphical system or the command line, as indicated
    in the following:


    Table 2-1

    | Command | Terminal in X Window | Command Line |

    | :------ | :------------------- | :----------- |

    | yaST2   | Qt                   | ncurses      |

    | yaST    | ncurses              | ncurses      |


    In the graphical interface, you can control YaST with the mouse. To start it,
    select **YaST** from the main menu (application group: **System**). You are asked
    to enter the root password.


    ![](img/63e88022bf135307e3eac051ad238b5b_79_0.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The YaST dialog appears.


    # **Figure 2-2**


    ![](img/63e88022bf135307e3eac051ad238b5b_80_0.png)


    You control the ncurses interface with the keyboard. To start the ncurses interface
    of YaST, you can start a terminal emulation from your GNOME desktop by selecting
    **Gnome Terminal** from the main menu (application group: **System**).'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Enter **su -** to get root permissions. After entering the root password, start
    YaST by entering **yast**.


    ![](img/63e88022bf135307e3eac051ad238b5b_81_0.png)


    Press **Tab** to move from one box to another or to the text buttons. To go back
    to the previous box, press **Shift+Tab**. Use the arrow keys to navigate within
    the box. Mark highlighted menu items by pressing the **Spacebar**.


    To select a menu item, press **Enter**. You can often press **Alt** and the highlighted
    letter to access an item directly.


    Except for the controls and the appearance, the graphical mode and the text mode
    of YaST are identical.


    You can list the available YaST modules with the command **yast -l** or **yast
    --list**. To start an individual module, specify its name. For example, you can
    enter the following to start the software installation module:


    ```

    yast sw_single

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'You can enter the software module name with the command **yast** or **yast2**,
    as in the following:


    +   * **yast** sw_single (text mode)

    +   * **yast2** sw_single (graphical mode)


    > To install a software package you can also enter **yast -i *package.rpm***.
    The package is installed directly without any dialogs.


    To display a list of YaST options, enter one of the following:


    +   * **yast --help**

    +   * **yast -h**


    The main dialog of YaST is called the *YaST Control Center*.


    From here you can select a category on the left (such as Software or System) and
    a module on the right (such as Online Update) to configure and manage your system.


    When you finish making changes with a YaST module, YaST uses back end services
    such as SuSEconfig.


    # ### The Role of SuSEconfig


    You can consider YaST as a front end to various other programs, such as a front
    end to RPM (RPM Package Manager) software management, a front end to user management,
    or a front end to various configuration files of different services (like a mail
    or web server).


    Usually YaST writes your configuration changes directly into the final configuration
    file. In rare cases there is an additional intermediate step, where the information
    you enter is first written to a file in the directory */etc/sysconfig/* before
    it is written into the final configuration file.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'This is where the program **SuSEconfig** becomes important.


    SuSEconfig is a tool used in SUSE Linux Enterprise Server to configure the system
    according to the variables that are set in the various files in *`/etc/sysconfig/`*
    and its subdirectories.


    These files contain variables such as `SYSLOGD_PARAMS=""` in *`/etc/sysconfig/syslog`*
    and `SMTPD_LISTEN_REMOTE="no"` in *`/etc/sysconfig/mail`*.


    Some of these variables are used directly (such as in some start scripts). For
    example, if `SYSLOGD_PARAMS` is set to “-r”, the daemon that logs system messages
    is directed to listen on port 514 for system messages from other hosts.


    Other variables are used to modify other files. For example, if `SMTPD_LISTEN_REMOTE`
    is set to “yes,” the variable `INET_INTERFACES` in *`/etc/postfix/main.cf`* is
    set to “all” by the script *`/sbin/SuSEconfig`* and the scripts in *`/sbin/conf.d`*.


    SuSEconfig acts as a back end for YaST and activates the configuration changes
    you make when using a YaST module.


    If you modify files in *`/etc/sysconfig/`* using an editor, all you might need
    to do is restart a service for the change to take place. However, you might also
    need to run SuSEconfig.


    For this reason, we recommend running SuSEconfig after manually editing files
    in *`/etc/sysconfig/`*.


    SuSEconfig uses the subsystem specific scripts in *`/sbin/conf.d/`* to configure
    the various subsystems. For example the variables in *`/etc/sysconfig/postfix`*
    are evaluated by the script *`/sbin/conf.d/SuSEconfig.postfix`*.'
  merge: -1
  img_proc: true
