- pgno: 269
  md: '# **Objective 1 Postfix**


    Both, RHEL4 and SUSE Linux Enterprise Server 10, allow to choose between Sendmail
    and Postfix as mail server. While Sendmail is the default mail server under Redhat,
    the default mail server in SUSE Linux Enterprise Server 10 is Postfix.


    Postfix was written by Wietse Venema as an alternative to the well-known Mail
    Transfer Agent (MTA) Sendmail with the following goals:


    +   It should be a fast mailer.

    +   It should be easy to administer.

    +   It should be secure.

    +   It should be compatible with Sendmail.


    This objective covers the following topics:


    +   Understand the Architecture and Components of Postfix

    +   Configure Postfix

    +   Use Postfix Tools


    # ### Understand the Architecture and Components of Postfix


    Wietse Venema met his Postfix design goals using a series of modular function
    units.


    Unlike Sendmail, Postfix is not a large monolithic program block. Instead, it
    consists of a variety of small programs, each of which is allocated a specific
    task (for example, accepting an email).


    This modularization makes the system more transparent.


    The individual components are easier to administer, facilitating further development
    of Postfix.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'The following figure, taken from the original Postfix documentation, shows
    a rough summary of the modularization of Postfix.


    Modules that are not covered at this stage are in /usr/share/doc/packages/postfix/html/OVERVIEW.html.


    ![](img/63e88022bf135307e3eac051ad238b5b_270_0.png)


    Individual Postfix processes are represented in the diagram by ellipses. Dark
    squares stand for lookup tables and light squares represent mail queues or mailboxes.


    For security reasons, Postfix works with four mail queues. For every mail queue,
    there is a directory bearing the same name under /var/spool/postfix/.


    The functions of the queues and the Postfix files are described in


    +   - Process of Inbound Email

    +   - Process of Outbound Email

    +   - Components of the Postfix Program Package'
  merge: -1
  img_proc: true
- pgno: 271
  md: "# Process of Inbound Email\n\nThe following figure shows how an email can reach\
    \ Postfix and how it is processed.\n\n![](img/63e88022bf135307e3eac051ad238b5b_271_0.png)\n\
    \nThe following describe these processes:\n\n+   Email Received Locally  \n+ \
    \  Email Received over the Network\n\n# Email Received Locally\n\nPostfix uses\
    \ the **postdrop** command to place an email sent locally into the maildrop queue\
    \ before it is picked up by the pickup daemon.\n\nThe pickup daemon checks it\
    \ for content, size, and other factors based on rules; then it passes the email\
    \ to the cleanup daemon.\n\nThe cleanup daemon does the following:\n\n+   Inserts\
    \ missing header lines (Resent, From, To, Message-ID, Date:) in the email (if\
    \ the mail was written with telnet)  \n+   Deletes double recipient addresses"
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - Uses the trivial-rewrite daemon (/usr/lib/postfix/trivial-rewrite) to
    convert the email address in the header to the user@fully-qualified-domain convention

    +   - Writes data in the header according to the rules in the lookup tables /etc/postfix/canonical
    and /etc/postfix/virtual


    After this, the email is copied to the incoming queue and the queue manager /usr/lib/postfix/qmgr
    is informed of the arrival of this email.


    # Email Received over the Network


    Email received over the Internet or LAN is accepted by the daemon, smtpd. smtpd
    checks the email for content, size, and other factors before passing it to the
    cleanup daemon.


    The cleanup daemon does the following:


    +   - Replaces missing header lines (Recent:, From:, To:, Message-ID:, Date:)
    in the email

    +   - Deletes double recipient addresses

    +   - Uses the trivial-rewrite (/usr/lib/postfix/trivial-rewrite) daemon to convert
    the email address in the header to the user@fully-qualified-domain convention

    +   - Writes data in the header according to the rules in the lookup tables /etc/postfix/canonical
    and /etc/postfix/virtual


    Then the email is copied to the incoming queue and the queue manager /usr/lib/postfix/qmgr
    is informed of the arrival of this email.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Process of Outbound Email


    The following figure shows how an email is handled by Postfix before it leaves
    the system to be delivered do its destination:


    ![](img/63e88022bf135307e3eac051ad238b5b_273_0.png)


    The following topics describe this process:


    +   Deliver Email to Local Users

    +   Deliver Email to Users on Remote Systems

    +   Process Undeliverable Emails


    # Deliver Email to Local Users


    The queue manager fetches an email from the incoming queue and copies it to the
    active queue as soon as the active queue contains no other emails.


    The trivial-rewrite daemon takes over the checking procedure based on the lookup
    table /etc/postfix/transport to see whether the recipient of the email is on the
    local system or a remote system.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'If this daemon decides the email should be delivered locally, the queue manager
    orders the local delivery service (/usr/lib/ postfix/local) to deliver the email
    to the recipient’s mailbox, taking into account the alias database (/etc/aliases)
    as well as any forward files of the user (~/forward).


    The local daemon can also be configured to have mail delivered by external programs,
    such as Procmail.


    # **Deliver Email to Users on Remote Systems**


    The queue manager fetches an email from the incoming queue and copies it to the
    active queue, as soon as the active queue is empty.


    The trivial-rewrite daemon uses the /etc/postfix/ transport lookup table to see
    if the recipient of the email is on the local system or on a remote system.


    If the daemon decides the email should be delivered to a remote system, the queue
    manager activates the SMTP service to deliver the email.


    The SMTP service tries to find the mail exchanger specified for the target host;
    then it delivers the email to the mail exchanger for the recipient host.


    # **Process Undeliverable Emails**


    Emails that cannot be delivered are removed from the active queue by the queue
    manager and copied to the deferred queue.


    The queue manager then copies this email at regular intervals from the deferred
    queue back to the active queue and tries again to deliver the email.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Components of the Postfix Program Package


    During the Postfix installation, files are saved to various locations on a SUSE
    Linux Enterprise Server 10 system. These locations can be grouped according to
    the following criteria:


    +   * **/etc/aliases/.** This is the only file in /etc/. It has the same format
    as the aliases file for the MTA Sendmail and contains local address aliases.

    +   * **/etc/postfix/.** All the configuration files defining Postfix mail processing
    are in this directory.

    +   Normally, the Postfix administrator is the only one who can make changes to
    these files.

    +   * **/usr/lib/postfix/.** This directory contains all the programs needed directly
    by Postfix. To be more precise, these are the Postfix binaries.

    +   These programs are not accessed directly by the system administrator.

    +   * **/usr/sbin/.** This directory contains the administration programs for
    maintaining and manually controlling Postfix.

    +   An administrator uses these programs during maintenance work.

    +   * **/usr/bin/.** This directory contains symbolic links with the names mailq
    and newaliases.

    +   Both links point to the program /usr/bin/sendmail that provides a Sendmail-compatible
    administration interface for Postfix.

    +   * **/var/spool/postfix/.** This directory contains the queue directories for
    Postfix and the directories etc/ and lib/ for Postfix processes that run in a
    chroot environment.

    +   If the variables POSTFIX_CHROOT and POSTFIX_UPDATE_CHROOT_JAIL in /etc/sysconfig/postfix
    are set to **yes**, these two directories are set up by


    # SuSEconfig --module postfix'
  merge: -1
  img_proc: true
- pgno: 276
  md: '+   * /usr/share/man/man[1|5|8]/. These directories contain the manual pages
    for the Postfix binaries, for the configuration files, and the administration
    programs.

    +   * /usr/share/doc/packages/postfix/. This contains documentation for Postfix.


    The subdirectory html/ contains a detailed HTML description of Postfix and a very
    useful FAQ.


    # Configure Postfix


    This objective covers the following topics:


    +   * Configure the Postfix Master Daemon

    +   * Configure Global Settings

    +   * Configure General Scenarios

    +   * Configure the Lookup Tables


    # Configure the Postfix Master Daemon


    The Postfix master daemon /usr/lib/postfix/master is started directly by Postfix
    when the system is booted and is terminated only when the system goes down or
    if Postfix ends.


    The Postfix master daemon is normally configured once only when the email system
    is set up, and is usually never changed.


    The master daemon, which monitors the entire mail system,


    +   * Controls and monitors individual Postfix processes.

    +   * Adheres to configured resource limits, which were defined in the file master.cf.

    +   * Restarts killed Postfix processes.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The Postfix master daemon is configured in the file

    /etc/postfix/master.cf. Each line in the file contains an entry for one

    Postfix process.'
  merge: -1
  img_proc: true
