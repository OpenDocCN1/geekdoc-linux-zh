- pgno: 305
  md: "# The relocated Lookup Table Format\n\nEach line defines a rule that is evaluated\
    \ by smtpd when an email arrives.\n\nThe rules are processed from top to bottom\
    \ and the matching of rules ends when the first match occurs.\n\nEach line consists\
    \ of a key field in the first column, which refers to the email address of the\
    \ former recipient or defines this by means of a regular expression and contact\
    \ information in the second column, which may contain a new email address of the\
    \ recipient or other contact information.\n\nPossible values for the key field\
    \ are\n\n+   * **user@domain**. Defines a filter for the specified email address.\n\
    +   * **user**. Defines a filter for all email addresses with the same user part,\
    \ provided the domain part of the email is listed in one of the variables $mymorigin,\
    \ $mydestination, $inet_interfaces, or $proxy_interfaces of the file /etc/postfix/main.cf.\n\
    +   * **@domain**. Defines a filter for all email addresses of the specified domain.\n\
    \nPossible values for contact information include any information (such as email\
    \ address or telephone number) that will help someone reach the email addressee.\
    \ The information is used in \"user has moved to new_location\" bounce messages.\n\
    \nExamples:\n\n```\n```\ngeeko@digitalairlines.com geeko@novell.com\n\ttux@digitalairlines.com\
    \ Please call 1-800-PIRATES\n```\n```"
  merge: -1
  img_proc: true
- pgno: 306
  md: "The notifications of the mail server are sent by email to the sender:\n\n```\n\
    <geeko@digitalairlines.com>: host da51.digitalairlines.com[10.0.0.51]\n   said:\
    \ 550\n   <geeko@digitalairlines.com>: Recipient address rejected: User has\n\
    \   moved to\n   geecko@novell.com (in reply to RCPT TO command)\n<tux@digitalairlines.com>:\
    \ host da51.digitalairlines.com[10.0.0.51]\n   said: 550\n   <tux@digitalairlines.com>:\
    \ Recipient address rejected: User has moved\n   to\n   Please call 1-800-PIRATES\
    \ (in reply to RCPT TO command)\n```\n\n# ## The transport Lookup Table\n\nYou\
    \ can use the /etc/postfix/transport lookup table to define email routing for\
    \ special email address ranges.\n\nThe following is described:\n\n+   - Activate\
    \ the Lookup Table\n+   - The transport Lookup Table Format\n\n# ## Activate the\
    \ Lookup Table\n\nThis function is activated in the file /etc/postfix/main.cf\
    \ by the entry\n\n```\ntransport_maps = hash:/etc/postfix/transport\n```\n\n#\
    \ ## The transport Lookup Table Format\n\nEach line defines a rule that is evaluated\
    \ via the qmgr or the trivial-rewrite daemon before an email is sent.\n\nThe rules\
    \ are processed from top to bottom and the matching of rules ends when the first\
    \ match occurs."
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Each line consists of the definition of a domain pattern in the first column
    and a defined transport path in the second column.


    Possible values for the domain pattern are


    +   * user@domain. Email to the specified user is forwarded over the defined transport
    route.

    +   * domain. All email to the specified domains are forwarded via the defined
    transport path.

    +   * .domain. All email with subdomains under the specified domain are forwarded
    via the defined transport path. This is only important if transport_maps is not
    listed in the variable parent_domain_matches_subdomain; otherwise, domain also
    includes .domain.


    Possible values for the transport path are


    +   * transport:next hop. Different values can be assigned to transport, such
    as local, smtp, or uucp. Also, any transport path can be assigned to transport,
    including self-defined paths (such as Cyrus and Procmail).


    +       * local. Defines the delivery of email via the Postfix process local that
    delivers the email in the local system.

    +       For this specification, the value for next hop remains blank.


    +       * smtp. Defines the delivery of email via the Postfix process smtp, which
    delivers the email to a remote mail exchanger via the SMTP protocol.

    +       * host or host:port can be configured as next hop for an email exchanger
    on a remote host in case it does not accept email on port 25/TCP.

    +       To prevent DNS lookups on the MX entry, the form [host] or [host]:port
    should be used for the next hop entry.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   uucp. Defines the delivery of email via the Postfix process pipe, which
    is configured by means of the file /etc/postfix/master.cf for the delivery of
    email via UUCP. The recipient host is specified as nexthop.


    Examples:


    | dигііаlаіrlіnеs.com | smtp:da51.digitalairlines.com:10025 |

    | --- | --- |

    | suse.com | uucp:da150 |



    # The virtual Lookup Table


    You can use the /etc/postfix/virtual lookup table to set up email for a number
    of domains with separate user names.


    The following topics are described:


    +   Activate the Lookup Table

    +   The virtual Lookup Table Format


    # Activate the Lookup Table


    This function is activated in the file /etc/postfix/main.cf by the entry


    ```

    virtual_maps = hash:/etc/postfix/virtual

    ```


    # The virtual Lookup Table Format


    Each line defines a rule that is evaluated via smtpe when an email arrives.


    The rules are processed from top to bottom and the matching of rules ends when
    the first match occurs.


    # 1 HARD COPY PERMITTED-NO DISTRIBUTION ALLOWED'
