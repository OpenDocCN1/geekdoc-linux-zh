- pgno: 310
  md: "# Activate the Lookup Table\n\nThis function is activated in the file /etc/postfix/main.cf\
    \ by the entry\n\n```\nalias_maps = hash:/etc/aliases\n```\n\n# The aliases Lookup\
    \ Table Format\n\nEach line defines a rule that is evaluated by smt pd when an\
    \ email arrives.\n\nThe rules are processed from top to bottom and the matching\
    \ of rules ends when the first match occurs.\n\nEach line contains\n\n+   - First\
    \ column: A local recipient address followed by a colon.\n+   - Second column:\
    \ Filtered email is then redirected to another email user or to another email\
    \ alias.\n+     - Details of the target recipient in the second column can also\
