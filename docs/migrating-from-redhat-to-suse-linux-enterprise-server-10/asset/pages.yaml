- pgno: 133
  md: 'When choosing the IP address, you need to know if the computer will be directly
    connected to the Internet. In this case, use an assigned official IP address.
    Otherwise, use an address from a private address space.


    +   *   **Subnet Mask.** The network mask (referred to as subnet mask in YaST),
    determines in which network an IP address is located.

    +       The mask divides the IP address into a network section and a host section,
    thus defining the size of a network. All computers within the network can reach
    each other directly without a router in between.


    +   *   **Hostname and Name Server.** Computers in the network can be addressed
    directly using their IP addresses or with a unique name. A name server (DNS) must
    exist for the resolution of names into IP addresses and vice versa.


    After selecting **Hostname and Name Server** and if you are using DHCP, the following
    appears:


    Figure 3-5


    ![](img/63e88022bf135307e3eac051ad238b5b_133_0.png)'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'If you want to change data delivered by DHCP (e.g., IP number), select **Modify**.
    If you only want to change other information you can select **Accept** here.


    # Figure 3-6


    ![](img/63e88022bf135307e3eac051ad238b5b_134_0.png)


    This dialog lets you enter the following:


    +   1. **Hostname**. Enter a name with which the computer can be addressed. This
    name should be unique within the network.

    +   2. **Domain Name**. This is the name of the DNS domain to which the computer
    belongs. Domains help to divide networks. All computers in a defined organizational
    area normally belong to the same domain.


    A computer can be addressed uniquely by giving its FQDN (Fully Qualified Domain
    Name). This consists of the host name and the name of the domain, such as **da51.digitaalirines.com**.
    In this case, the domain would be digitalairlines.com.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "+   ▪ **List of name servers**. To address other computers in the network with\
    \ their host names, identify the name server, which guarantees the conversion\
    \ of computer names to IP addresses and vice versa.\n+   \n+    You can specify\
    \ a maximum of three name servers.\n\n+   ▪ **Domain search list**. In the local\
    \ network, it is more appropriate to address other hosts not with their FQDN,\
    \ but with their host names. The domain search list specifies the domains with\
    \ which the system can expand the host name to the FQDN.\n+   \n+    This complete\
    \ name is then passed to the name server to be resolved. For example, `da51` is\
    \ expanded with the search list `digitalairlines.com` to the FQDN `da51.digitalairlines.com`.\
    \ This name is then passed to the name server to be resolved.\n+   \n+    If the\
    \ search list contains several domains, the completion takes place one after the\
    \ other, and the resulting FQDN is passed to the name server until an entry returns\
    \ an associated IP address.\n+   \n+    Separate the domains with commas or white\
    \ space.\n\n+   ■ **Routing**. If the computer is intended only to reach other\
    \ computers in the same subnet, then it is not necessary to enter any routes."
  merge: -1
  img_proc: true
- pgno: 136
  md: 'However, if you need to enter a default gateway or create a routing table,
    select **Routing** from the Network address setup dialog. The following appears:


    ![](img/63e88022bf135307e3eac051ad238b5b_136_0.png)


    You can define the following:


    +   Default Gateway. If the network has a gateway (a computer that forwards information
