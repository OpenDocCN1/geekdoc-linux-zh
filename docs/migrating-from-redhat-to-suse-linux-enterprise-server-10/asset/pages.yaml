- pgno: 287
  md: "■ **POSTFIX_SMTP_AUTH_\\*.** These variables control the behavior of Postfix\
    \ with respect to the authentication: if Postfix accepts mail and if Postfix delivers\
    \ mail to other mail servers.\n\n■ **POSTFIX_SMTP_TLS_SERVER,**  \n**POSTFIX_SMTP_TLS_CLIENT.**\
    \ If these variables are set to **yes,** Postfix can encrypt the communication\
    \ with the other side when sending and receiving mail, provided the following\
    \ variables are configured.\n\n■ **POSTFIX_SSL_\\*,** **POSTFIX_TLS \\*.** These\
    \ variables control various aspects of the certificate and key management needed\
    \ for the encryption.\n\nEncrypted connections are not covered in this course;\
    \ this manual does not provide any details about the individual variables.\n\n\
    ■ **POSTFIX_ADD_\\*:** These variables can be used to set the Postfix variables.\n\
    \nThe variable must be converted to uppercase letters and appended to **POSTFIX_ADD_.**\n\
    \nFor example, to set the Postfix variable *message_size_limit* to 100000, enter\n\
    \n```\nPOSTFIX_ADD_MESSAGE_SIZE_LIMIT=100000\n\n```\n\nin */etc/sysconfig/postfix*.\n\
    \nSubsequently, SuSEconfig will generate the respective entry *message_size_limit*=100000\
    \ in */etc/postfix/main.cf*.\n\nAll available Postfix variables can be listed\
    \ by using *postconf*.\n\n■ **POSTFIX_REGISTER_SLP.** If this is set to **yes,**\
    \ Postfix registers automatically to SLP.\n\nApart from this method, further settings\
    \ can be made directly in the file */etc/postfix/main.cf*, which has very detailed\
    \ comments. Following a manual modification of the file */etc/postfix/main.cf*,\
    \ modifying */etc/sysconfig/postfix* and subsequently running of */sbin/SuSEconfig*\
    \ will not affect the file */etc/postfix/main.cf*."
  merge: -1
