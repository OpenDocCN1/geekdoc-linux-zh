- pgno: 283
  md: '+   The variable SMTPD_LISTEN_REMOTE should be set to yes and Postfix will
    listen on port 25 for arriving mails.

    +   Otherwise, only email from the local host will be accepted.


    By means of the /sbin/SuSEconfig script, both settings and the entries in the
    file /etc/sysconfig/postfix are translated into suitable parameters in the file
    /etc/postfix/main.cf.


    If you do not want SuSEconfig to generate this configuration file, set the variable
    MAIL_CREATE_CONFIG in the file /etc/sysconfig/mail to no.


    To configure Postfix, you need to know how to do the following:


    +   Configure Postfix with /etc/sysconfig/postfix

    +   Configure Postfix with /etc/postfix/main.cf


    # Configure Postfix with /etc/sysconfig/postfix


    Modifications in the file /etc/sysconfig/postfix are only adopted in the file
    /etc/postfix/main.cf and, in some cases, in the file /etc/postfix/master.cf after
    the execution of /sbin/SuSEconfig or the SuSEconfig module for Postfix:


    +   /sbin/conf.d/SuSEconfig.postfix

    +   or

    +   /sbin/SuSEconfig --module postfix


    The meanings of the variables are briefly commented on the configuration file
    /etc/sysconfig/postfix.


    The following provides a more detailed description.


    +   POSTFIX_RELAYHOST. If the local email server should use a relay host to deliver
    emails that cannot be locally delivered, the relay host itself or the domain of
    the relay host must be given here.'
  merge: -1
  img_proc: true
- pgno: 284
  md: "If the name of a domain is provided, Postfix determines the relay host for\
    \ the domain by an MX lookup.\n\nIf Postfix should forward all emails that cannot\
    \ be locally delivered to a relay host without carrying out an MX lookup, the\
    \ host name of the relay must be given in square brackets (for example, **\\[mailrelay.digitalairlines.com\\\
    ]**).\n\nIt is also possible to give an IP address in this form. Optionally, the\
    \ domain or host can be extended with a port number (for example, **digitalairlines.com:1025**).\n\
    \nIf you leave this entry empty, Postfix delivers all mails that cannot be delivered\
    \ locally to the mail exchanger.\n\nAny entries in the file `/etc/postfix/transport`\
    \ have precedence over the relay host.\n\nIf this variable is assigned a value,\
    \ the variable `relayhost` in the file `/etc/postfix/main.cf` will be modified\
    \ by running **SuSEconfig**.\n\n+   * **POSTFIX_MASQUERADE_DOMAIN.** If your own\
    \ DNS domain is configured with this variable (for example, digitalairlines.com),\
    \ all addresses in emails that contain a host prefix are shortened by this host\
    \ prefix.\n+     \n+     For example, geeko@da2.digitalairlines.com becomes geeko@digitalairlines.com.\n\
    +     \n+     If this variable is assigned a value, the variable `masquerade_domains`\
    \ in the file `/etc/postfix/main.cf` is modified by running **SuSEconfig**. Additionally,\
    \ the variable `masquerade_exceptions` = root will be set.\n\n+   * **POSTFIX_LOCALDOMAINS.**\
    \ Contains a comma-separated list of the domains for which Postfix should accept\
    \ emails.\n+     \n+     These values are written to the variable `mydestination`\
    \ in the file `/etc/postfix/main.cf` by running **SuSEconfig**."
