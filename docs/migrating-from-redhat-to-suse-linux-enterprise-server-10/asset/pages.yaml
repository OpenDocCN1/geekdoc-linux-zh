- pgno: 215
  md: "# Tools to Administer Logical Volumes\n\nTo create a logical volume, use `lvcreate`,\
    \ specifying the size, the name for the logical volume, and the volume group:\n\
    \n```\n```\nda10:~ # lvcreate -L 100M -n data system\nLogical volume \"data\"\
    \ created\n```\n```\n\nThe next step is to create a file system within the logical\
    \ volume and mount it:\n\n```\n```\nda10:~ # lvscan\n  ACTIVE          '/dev/system/data'\
    \ [100.00 MB] inherit\nda10:~ # mkreiserfs /dev/system/data\nmkreiserfs 3.6.19\
    \ (2003 www.namesys.com)\n...\nReiserFS is successfully created on /dev/system/data.\n\
    da10:~ # mount /dev/system/data /data\n```\n```\n\nAs shown above, `lvscan` is\
    \ used to view the logical volumes. It shows the device to use for the formatting\
    \ and mounting.\n\n**`lvextend`** is used to increase the size of a logical volume.\
    \ After that you can increase the size of the file system on that logical volume\
    \ to make use of the additional space.\n\nBefore you use `lvreduce` to reduce\
    \ the size of a logical volume, you have to reduce the size of the file system.\
    \ Only then reduce the size of the logical volume. If you cut off parts of the\
    \ file system by simply reducing the size of the logical volume without shrinking\
