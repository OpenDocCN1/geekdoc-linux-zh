    terraform-nixos-ng\"\n        rev = \"d8563d0d6cc65b699ffbf1fab8d692b1343ec927\"\
    \n        hash = \"\"\n      }\n    in\n      import source {\n        host =\
    \ \"root@${aws_instance.todo.public_ip}\"\n        flake = .default\n        arguments\
    \ = [ \"--build-host\", \"root@${aws_instance.todo.public_ip}\" ]\n        ssh_options\
    \ = [ \"-o StrictHostChecking=accept-new\" ]\n        depends_on = [ null_resource.wait\
    \ ]\n      };\n\n  aws_security_group todo = {};\n  tls_private_key nixos-in-production\
    \ = tls_private_key { };\n  local_sensitive_file.ssh_key_file = ssh_key_file {\
    \ };\n  aws_key_pair nixos-in-production = aws_key_pair { };\n  aws_instance todo\
    \ = aws_instance { };\n  null_resource wait = null_resource { };\n\n  output\n\
