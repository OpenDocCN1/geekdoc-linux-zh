  md: "# Advanced option definitions\n\n```\n{ lib, ... };\n\n{ options.foo = lib.mkOption\
    \ {\n  default = {};\n}\n```\n\nis the exact same thing as a NixOS module like\
    \ this:\n\n```\n{ lib, ... };\n\n{ options.foo = lib.mkOption { };\n\nconfig foo\
    \ = lib.mkOptionDefault {}; }\n```\n\nHowever, you will commonly use lib.mkDefault\
    \ which defines a configuration option with priority 1000. Typically you'll lib.mkDefault\
    \ if you want to override the default value of an option, while still allowing\
    \ a downstream user to override the option yet again at the normal priority (100).\n\
    \n# mkIf\n\nmkIf is far-away the most widely used NixOS module primitive, because\
    \ you can use mkIf to selectively enable certain options based on the value of\
    \ another option.\n\nAn extremely common idiom from Nixpkgs is to use mkIf in\
    \ conjunction with an enable option, like this:\n\n```\n* module.nix\n```\n\n\
    ```\nlet\n# Pretend that this came from another file\ncowsay = =\n  { config,\
    \ lib, pkgs, ... };\n\n{ options.services.cowsay = {\n  enable = lib.mkEnableOption\
    \ \"cowsay\";\n\n  greeting = lib.mkOption {\n    description = \"The phrase the\
    \ cow will greet you with\";\n\n    type = lib.types.str;\n\n    default = \"\
    Hello, world!\";\n  };\n}\n```\n\n```\nconfig = lib.mkIf config.services.cowsay\
    \ = {\n  systemd.services.cowsay = {\n    wantedBy = [ \"multi-user.target\" ];\n\
    \  };\n\n  script = \"$${pkgs.cowsay}/bin/cowsay \\${config.services.cowsay.greeting}\"\
    ;\n};\n```"
