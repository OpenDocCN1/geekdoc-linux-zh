  md: 'Setting up your development environment


    +   - On macOS the installer defaults to a multi-user Nix installation

    macOS doesn''t even support a single-user Nix installation, so this is a good
    default.


    +   - On Windows the installer defaults to a single-user Nix installation

    This default is also the recommended option.


    +   - On Linux the installer defaults to a single-user Nix installation

    This is the case where the default behavior is questionable. Multi-user Nix installations
    are typically better if your Linux distribution supports systemd, so you should
    explicitly specify --daemon if you use systemd.


    # # Pinning the version


    First, we will want to pin the version of the Nix that you install if you''re
    creating setup instructions for others to follow. For example, this book will
    be based on Nix version 2.11.0, and you can pin the Nix version like:


    ```

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```


    and you can find the set of available releases by visiting the release file server².


    > Feel free to use a Nix version newer than 2.11.0 if you want. The above installation
    script only pins the Nix 2.11.0 because that''s what happened to be the latest
    stable version at the time of this writing. That''s also the version that the
    examples from this book have been tested against.

    The only really important thing is that everyone within your organization uses
    the same version of Nix, if you want to minimize your support burden.


    However, there are a few more options that the script accepts we''re going to
    make good use of, and we can list those options by supplying --help to the script:


    ```

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL") --help

    ```


    ¹https://releases.nixos.org/prefix-nix/'
