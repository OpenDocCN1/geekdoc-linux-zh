- md: "```\n# Access the `config.system.nixos.release` attribute path\n= \"Fake NixOS\
    \ - version ${(22.05\")\"\n```\n\n```\n# Evaluate the string .interpolation\n\
    = \"Fake NixOS - version 22.05\"\n```\n\nSo even though our NixOS module is defined\
    \ recursively in terms of itself, that recursion is still well-founded and produces\
    \ an actual result.\n\n## 7. Advanced option definitions\n\nNixOS option definitions\
    \ are actually much more sophisticated than the previous chapter, and in this\
    \ chapter we'll cover some common tricks and pitfalls.\n\nMake sure that you followed\
    \ the instructions from the \"Setting up your development environment\" chapter\
    \ if you would like to test the examples in this chapter.\n\n## Imports\n\nThe\
    \ NixOS module system lets you import other modules by their path, which merges\
    \ the option declarations and option definitions with the current module. But,\
    \ did you know that the elements of an imports list don't have to be paths?\n\n\
    You can inline NixOS configurations in the imports list, like these:\n\n```\n\
    { imports = {\n  services.openssh.enable = true;\n  users.root.initialPassword\
    \ = \"\";\n};\n};\n```\n\nand they will behave as if you had imported files with\
    \ the same contents as those inline configurations.\n\nIn fact, anything that\
    \ is a valid NixOS module can go in the import list, including NixOS modules that\
    \ are:\n\n```\n{ imports = {\n  services.openssh.enable = true;\n  (( lib; {}):\
    \ users.root.initialPassword = lib.mkDefault(\"\"));\n};\n```\n\nI will make use\
    \ of this trick in a few examples below, so that we can simulate modules importing\
    \ other modules within a single file.\n\n## lib utilities\n\nNixpkgs provides\
    \ several utility functions for NixOS modules that are stored underneath the \"\
    lib\" hierarchy, and you can find the source code for those functions in lib/modules.nix¹.\n\
    \n> ¹https://github.com/NixOS/nixpkgs/blob/22.05/lib/modules.nix\n\nIf you want\
    \ to become a NixOS module system expert, take the time to read and understand\
    \ all of the code in lib/modules.nix.\n\nRemember that the NixOS module system\
    \ is implemented as a domain-specific language in Nix and lib/modules.nix contains\
    \ the implementation of that domain-specific language, so if you understand everything\
    \ in that then you understand essentially all that there is to know how the NixOS\
    \ module system works under the hood.\n\nThat said, this chapter will still try\
    \ to explain things enough so that you don't have to read through that.\n\nYou\
    \ do not need to use or understand all of the functions in lib/modules.nix, but\
    \ you need to familiarize yourself with the following primitive functions:\n\n\
    - lib.mkMerge\n- lib.mkOverride\n- lib.mkIf\n- lib.mkOrder\n\nBy \"primitive\"\
    , I mean that these functions cannot be implemented in terms of other functions.\
    \ They all hook into special behavior built into lib.evalModules.\n\n## mkMerge\n\
    \nThe lib.mkMerge function merges a list of \"configuration sets\" into a single\
    \ \"configuration set\" (where \"configuration set\" means a potentially nested\
    \ attribute set of configuration option settings).\n\nFor example, the NixOS module:\n\
    \n```\n{ lib, ... }:\n{\n  config = lib.mkMerge [\n    { services.openssh.enable\
    \ = true; }\n    { users.root.initialPassword = \"\"; }\n  ];\n};\n```\n\nis equivalent\
    \ to this NixOS module:\n\n```\nconfig = {\n  services.openssh.enable = true;\n\
    \  users.root.initialPassword = \"\";\n}\n```\n\n... and that would produce the\
    \ same result. Which is better?\nThe short answer is: lib.mkMerge is usually what\
    \ you want. \nThe long answer is that the main trade-off between imports and lib.mkMerge\
    \ is:\n\n- The imports section can merge NixOS modules that are functions.\n \
    \ lib.mkMerge can only merge configuration sets and not functions.\n- The list\
    \ of imports can't depend on any configuration values.\n  In practice, this means\
    \ you can easily trigger an infinite recursion if you try to do anything fancy\
    \ using imports and you can typically fix the infinite recursion by switching\
    \ to lib.mkMerge.\n\nThe latter point is which you should prefer using lib.mkMerge.\n\
    \n## Merging options\n\nYou can merge configuration sets that define the same\
    \ option multiple times, like this:\n\n```\n{ lib, ... };\n\n{\n  config = lib.mkMerge\
    \ [\n    ( networking.firewall.allowedTCPPorts = [ 80 ]; );\n    ( networking.firewall.allowedTCPPorts\
    \ = [ 443 ]; );\n    ( users.root.initialPassword = \"\");\n  ];\n}\n```\n\n...\
    \ and the outcome of merging two identical attribute paths depends on the option's\
    \ \"type\".\nFor example, networking.firewall.allowedTCPPorts type is:\n\n```\n\
    $ nix eval .machine.options.firewall.allowedTCPPorts.type\n\"list of unsigned\
    \ integer between 0 and 65535 (both inclusive)\"\n```\n\nIf you specify a list-valued\
    \ option twice, the lists are combined, so the above example reduces to:\n\n```\n\
    { lib, ... }:\n\n{\n  config = lib.mkMerge [\n    networking.firewall.allowedTCPPorts\
    \ = [ 80 443 ];\n    ];\nroot..root.\n =\n```\n\nHowever, you might find that\
    \ the repl more convenient if you prefer to interactively browse the available\
    \ options. Run this command:\n\n```\n$ nix repl .machine\n```\n\nwhich will load\
    \ your NixOS system into the REPL and now you can use tab-completion to explore\
    \ what is available:\n\n```\nnix-repl> config.<TAB>\nconfig.networking\n\nnix-repl>\
    \ config.networking.<TAB>\nconfig.networking.firewall\n\nnix-repl> config.networking.firewall.<TAB>\n\
    config.networking.firewall.allowedTCPPorts\n```\n\n> Exercise: Try to save the\
    \ following module to module.nix, which specifies the same option without using\
    \ lib.mkMerge:\n\n```\n{ lib, ... }:\n\n{ config = {\n  networking.firewall.allowedTCPPorts\
    \ = [ 80 ];\n  networking.firewall.allowedTCPPorts = [ 443 ];\n};}\n```\n\nThis\
    \ will fail to deploy. Do you understand why? Specifically, is the failure limitation\
    \ of the NixOS module system or the Nix programming language?\n\nYou can also\
    \ nest lib.mkMerge underneath an attribute. For example, this:\n\n```\nconfig\
    \ = lib.mkMerge {\n  networking.firewall.allowedTCPPorts = [ 80 ];\n  networking.firewall.allowedTCPPorts\
    \ = [ 443 ];\n}\n```\n\n... is the same as this:\n\n```\nconfig networking = lib.mkMerge\
    \ {\n  firewall.allowedTCPPorts = [ 80 ];\n  firewall.allowedTCPPorts = [ 443\
    \ ];\n}\n```\n\n... is the same as this:\n\n```\nconfig networking.firewall =\
    \ lib.mkMerge {\n  allowedTCPPorts = [ 80 ];\n  allowedTCPPorts = [ 443 ];\n}\n\
    ```\n\n... is the same as this:\n\n```\nconfig networking.firewall.allowedTCPPorts\
    \ = lib.mkMerge [ 80 ] [ 443 ]\n```\n\n... is the same as this:\n\n```\nconfig\
    \ networking.firewall.allowedTCPPorts = [ 80 443 ];\n```\n\n## Conflicts\n\nDuplicate\
    \ options cannot necessarily always be merged. For example, if you merge two configuration\
    \ sets that disagree on whether to enable a service:\n\n```\nlib, ...):\nconfig\
    \ = {\n  services.openssh.enable = lib.mkMerge [ true false ];\n}\n```\n\n...\
    \ then that will fail at evaluation time with this error:\n\n```\nerror: The option\
    \ 'services.openssl.enable' has conflicting definition values:\n- In '/nix/store/../source/module.nix':\
    \ true\n- In '/nix/store/../source/module.nix': false\n(use 'trace' to show detailed\
    \ location information)\n```\n\nThis is because services.openssl is enabled to\
    \ have a boolean type, and you can only merge multiple boolean values if all occurrences\
    \ agree. You can verify this yourself by changing both occurrences to true, which\
    \ will fix the error.\n\nAs a general rule of thumb:\n\n- Most scalar option types\
    \ will fail to merge distinct values\n  e.g. boolean values, strings, integers.\n\
    - Most complex option types will successfully merge in the obvious way\n  e.g.\
    \ lists will be concatenated and attribute sets will be combined.\n\nThe most\
    \ common exception to this thumb is the \"lines\" type (lib.types.lines), which\
    \ is a string option type that you can define multiple times. services.zookeeper.extraConf\
    \ is an example of one such option that has this type:\n\n```\n{ lib, ... };\n\
    \n{ config = {\n  services zookeeper = {\n    enable = true;\n\n    extraConf\
    \ = lib.mkMerge [ \"initLimit=5\" \"syncLimit=2\" ];\n  }\n}\n```\n\nand merging\
    \ multiple occurrences of that option concatenates them as lines by inserting\
    \ an intervening newline character:\n\n```\n$ nix eval services.zookeeper.extraConf\n\
    \"initLimit=5\\nsyncLimit=2\"\n```\n\n## mkOverride\n\nThe lib.mkOverride function\
    \ specifies the \"priority\" of an option definition, which comes in handy if\
    \ you want to override a configuration value that another NixOS module already\
    \ defined.\n\n## Higher priority overrides\n\nThis most commonly comes up when\
    \ we need to override an option that was already defined by one of our dependencies\
    \ (typically a NixOS module provided by Nixpkgs). One example would be overriding\
    \ the restart frequency of nginx:"
  mdcn: "\n```\n# 访问 `config.system.nixos.release` 路径\n= \"Fake NixOS - version ${(22.05\"\
    )\"\n```\n\n```\n# 求值字符串 .interpolation\n= \"Fake NixOS - version 22.05\"\n```\n\
    \n因此，尽管我们的 NixOS 模块是相对于自身递归定义的，但这种递归是有良好依据的，并且产生实际的结果。\n\n## 7. 高级选项定义\n\nNixOS\
    \ 选项定义实际上比上一章要复杂得多，在本章中，我们将涵盖一些常见的技巧和陷阱。\n\n如果你想测试本章中的示例，请确保你遵循了“设置开发环境”章节中的说明。\n\
    \n## Imports (导入)\n\nNixOS 模块系统允许你通过路径导入其他模块，这会将选项声明和选项定义与当前模块合并。但你知道吗，`imports`\
    \ 列表中的元素并不非路径路径？\n\n你可以在 `imports` 列表中内联 NixOS 配置，如下所示：\n\n```\n{ imports = {\n\
    \  services.openssh.enable = true;\n  users.root.initialPassword = \"\";\n};\n\
    };\n```\n\n它们的行为就像你导入了内容与这些内联配置相同的文件一样。\n\n事实上，任何有效的 NixOS 模块都可以放入导入列表，包括以下类型的\
    \ NixOS 模块：\n\n```\n{ imports = {\n  services.openssh.enable = true;\n  (( lib;\
    \ {}): users.root.initialPassword = lib.mkDefault(\"\"));\n};\n```\n\n我将在下方的几个示例中使用这个技巧，以便我们可以在单个文件中模拟模块导入其他模块的场景。\n\
    \n## lib utilities (lib 工具函数)\n\nNixpkgs 为 NixOS 模块提供了几个实用函数，这些函数存储在 \"lib\" 层级结构之下，你可以在\
    \ `lib/modules.nix`¹ 中找到这些函数的源代码。\n\n> ¹https://github.com/NixOS/nixpkgs/blob/22.05/lib/modules.nix\n\
    \n如果你想成为 NixOS 模块系统专家，请花时间阅读并理解 `lib/modules.nix` 中的所有代码。\n\n请记住，NixOS 模块系统是作为\
    \ Nix 中的一种领域特定语言（DSL）实现的，而 `lib/modules.nix` 包含了该领域特定语言的实现，因此，如果你理解了其中的所有内容，基本上你就理解了关于\
    \ NixOS 模块系统底层如何工作的所有知识。\n\n话虽如此，本章仍然会尝试解释足够的内容，让你没不必通读那些代码。\n\n你不需要使用或理解 `lib/modules.nix`\
    \ 中的所有函数，但你需要熟悉以下原语函数：\n\n- lib.mkMerge\n- lib.mkOverride\n- lib.mkIf\n- lib.mkOrder\n\
    \n我所说的“原语”是指这些函数无法通过其他函数来实现。它们都挂钩了 `lib.evalModules` 内置的特殊行为。\n\n## mkMerge\n\n\
    `lib.mkMerge` 函数将一组“配置集”（configuration sets）合并为一个单一的“配置集”（其中“配置集”指的是一个可能嵌套的配置选项设置的属性集）。\n\
    \n例如，这个 NixOS 模块：\n\n```\n{ lib, ... }:\n{\n  config = lib.mkMerge [\n    { services.openssh.enable\
    \ = true; }\n    { users.root.initialPassword = \"\"; }\n  ];\n};\n```\n\n等同于这个\
    \ NixOS 模块：\n\n```\nconfig = {\n  services.openssh.enable = true;\n  users.root.initialPassword\
    \ = \"\";\n}\n```\n\n... 并且产生相同的结果。哪种更好？\n短答案是：`lib.mkMerge` 通常是你想要的。\n长答案是，`imports`\
    \ 和 `lib.mkMerge` 之间的主要权衡在于在于：\n\n- `imports` 部分可以合并作为函数的 NixOS 模块。\n  `lib.mkMerge`\
    \ 只能合并配置集而不能合并函数。\n- `imports` 列表不能依赖任何配置值。\n  在实践中，这意味着如果你尝试使用 `imports` 进行任何复杂的操作，很容易就会触发无限递归，而你通常可以通过切换到\
    \ `lib.mkMerge` 来修复无限递归。\n\n后一点是你应该优先使用 `lib.mkMerge` 的原因。\n\n## Merging options\
    \ (合并选项)\n\n你可以多次定义相同选项的配置集，如下所示：\n\n```\n{ lib, ... };\n\n{\n  config = lib.mkMerge\
    \ [\n    ( networking.firewall.allowedTCPPorts = [ 80 ]; );\n    ( networking.firewall.allowedTCPPorts\
    \ = [ 443 ]; );\n    ( users.root.initialPassword = \"\");\n  ];\n}\n```\n\n...\
    \ 合并两个相同属性路径的结果取决于选项的“类型”。\n例如，`networking.firewall.allowedTCPPorts` 的类型是：\n\n\
    ```\n$ nix eval .machine.options.firewall.allowedTCPPorts.type\n\"list of unsigned\
    \ integer between 0 and 65535 (both inclusive)\"\n```\n\n如果你指定了两次列表值的选项，这些列表将合并，因此上面的示例简化为：\n\
    \n```\n{ lib, ... }:\n\n{\n  config = lib.mkMerge [\n    networking.firewall.allowedTCPPorts\
    \ = [ 80 443 ];\n    ];\n```\n（注：原文此处似乎有断码）\n\n然而，如果你喜欢交互式地浏览可用选项，可能会发现 `repl`\
    \ 更方便。运行此命令：\n\n```\n$ nix repl .machine\n```\n\n这会将你的 NixOS 系统加载到 REPL 中，现在你可以使用制表符补全来探索可用内容：\n\
    \n```\nnix-repl> config.<TAB>\nconfig.networking\n\nnix-repl> config.networking.<TAB>\n\
    config.networking.firewall\n\nnix-repl> config.networking.firewall.<TAB>\nconfig.networking.firewall.allowedTCPPorts\n\
    ```\n\n> 练习：尝试将以下模块保存到 `module.nix`，在不使用 `lib.mkMerge` 的情况下指定相同的选项：\n\n```\n{\
    \ lib, ... }:\n\n{ config = {\n  networking.firewall.allowedTCPPorts = [ 80 ];\n\
    \  networking.firewall.allowedTCPPorts = [ 443 ];\n};}\n```\n\n这将导致部署失败。你明白为什么吗？具体来说，这是\
    \ NixOS 模块系统的限制还是 Nix 编程语言的限制？\n\n你还可以在属性下嵌套 `lib.mkMerge`。例如，这个：\n\n```\nconfig\
    \ = lib.mkMerge {\n  networking.firewall.allowedTCPPorts = [ 80 ];\n  networking.firewall.allowedTCPPorts\
    \ = [ 443 ];\n}\n```\n\n... 等同于这个：\n\n```\nconfig networking = lib.mkMerge {\n\
    \  firewall.allowedTCPPorts = [ 80 ];\n  firewall.allowedTCPPorts = [ 443 ];\n\
    }\n```\n（注：原文此处格式似乎有偏差）\n\n... 等同于这个：\n\n```\nconfig networking = lib.mkMerge\
    \ {\n  allowedTCPPorts = [ 80 ];\n}\n  allowedTCPPorts = [ 443 ];\n}\n```\n\n\
    ... 等同于这个：\n\n```\nconfig.firewall.allowedTCPPorts = [ 80 443 ];\n```\n\n## Conflicts\
    \ (冲突)\n\n重复选项并不总是可以合并。例如，如果你合并两个对于是否启用服务意见不同的配置集：\n\n```\nlib, ...):\nconfig\
    \ = {\n  services.openssh.enable = lib.mkMerge [ true false ];\n}\n```\n\n...\
    \ 那将在求值时失败并报错：\n\n```\nerror: The option 'services.openssl.enable' has conflicting\
    \ definition values:\n- In '/nix/store/../source/module.nix': true\n- In '/nix/store/../source/module.nix':\
    \ false\n(use 'trace' to show detailed location information)\n```\n\n这是因为被设置为布尔类型，只有当所有出现处都一致时，你才能合并多个布尔值。你可以通过将两个出现处都改为\
    \ `true` 来亲自验证这一点，这将修复错误。\n\n通常规则：\n\n- 大多数基础选项类型无法合并不同的值\n  例如布尔值、字符串、整数。\n-\
    \ 大多数复杂选项类型将以明显的方式成功合并\n  例如列表将连接，属性集将合并。\n\n这种规则最常见的例外是 \"lines\" 类型（`lib.types.lines`），它是一种可以定义多次的字符串选项类型。`services.zookeeper.extraConf`\
    \ 是此类选项的一个示例，其类型如下：\n\n```\n{ lib, ... };\n\n{ config = {\n  services zookeeper\
    \ = {\n    enable = true;\n\n    extraConf = lib.mkMerge [ \"initLimit=5\" \"\
    syncLimit=2\" ];\n  }\n}\n```\n\n合并该选项的多次出现将通过插入换行符将它们连接为行：\n\n```\n$ nix eval\
    \ services.zookeeper.extraConf\n\"initLimit=5\\nsyncLimit=2\"\n```\n\n## mkOverride\n\
    \n`lib.mkOverride` 函数指定选项定义的优先级，当你覆盖另一个 NixOS 模块已经定义的配置值时，这非常有用。\n\n## Higher\
    \ priority overrides (高优先级覆盖)\n\n这最出现在我们需要覆盖一个由依赖项已经定义的选项（通常是 Nixpkgs 提供的 NixOS\
    \ 模块）时。一个例子是覆盖 nginx 的重启频率：\n"
