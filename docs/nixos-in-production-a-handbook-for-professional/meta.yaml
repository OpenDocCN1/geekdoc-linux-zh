    (use '--show-trace' to show detailed location information)\n```\n\nThe reason\
    \ why is because the reason is not well-founded:\n\n```\n# This attribute directly\
    \ depends on itself\n# /\nconfig = if config.services.cowsay.enable then (\n\\\
    and the reason why lib.mkIf doesn't share the same problem is because evalModules\
    \ pushes mkIf conditions to the \"leaves\" of the configuration tree, if we had\
    \ written this:\n\n{config, lib, pkgs, ... } :\n{\n  config = cowsay = {\n   \
    \ systemd.services.cowsay = {\n      wantedBy = lib.mkIf config.services.cowsay.enable\
    \ [ \"multi-user.target\" ];\n\n      script = =\n        lib.mkIf config.services.cowsay.enable\n\
    \          \"$${pkgs.cowsay}/bin/cowsay $${config.services.cowsay greeting}\"\\\
    n    };\n  };\n}\n```\n\nwhich makes the recursion well-founded.\n\nThe second\
    \ reason we use lib.mkIf is because it correctly handles the fallback case. To\
    \ see why that matters, consider this example that tries to create a service.kafka.enable\
    \ short-hand synonym for services. apache-kafka.enable:\n\n```\nkafkaSynonym =\
    \ \n{ config, lib, ... };\n```\n\n```\noptions services.kafka.enable = \"apache\"\
    ;\nconfig services.apache-kafka.enable = config.services.kafka.enable;\n```\n\n\
