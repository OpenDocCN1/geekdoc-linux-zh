  md: "What is NixOS for?\n\n+   - Application containers\n  Containers technically\
    \ do not need to run an entire operating system and can instead run a single process\
    \ (e.g. one service). You can do this with Nixpkgs, which provides support for\
    \ building application containers.\n\nSo which use cases are NixOS/Nixpkgs well-suited\
    \ for? If I had to rank these deployment models then my preference (in descending\
    \ order) would be:\n\n+   - NixOS as a guest operating system\n  Specifically,\
    \ this means that you would run NixOS as a virtual machine on a cloud provider\
    \ (e.g.-AWS) and all of your services run within that NixOS guest machine with\
    \ no intervening containers.\n  I prefer this because this is the least deployment\
    \ model and the lowest maintenance to administer.\n\n+   - NixOS without virtualization\n\
    \  This typically entails running NixOS on a physical rack server and you still\
    \ use NixOS to manage all of your services without containers.\n  This can potentially\
    \ be the most cost-effective deployment model if you're willing to manage your\
    \ own hardware (including RAID and backup/restore) or you operate your own data\
    \ center.\n\n+   - NixOS as a host operating system - Static containers\n  NixOS\
    \ also works well when you want to statically specify a set of containers to run.\
    \ Not only can NixOS run Docker containers or OCI containers, but NixOS also provides\
    \ special support for \"NixOS containers\" (which are systemd-spawn containers\
    \ under the hood) or application containers built by Nixpkgs.\n  I rank this lower\
    \ \"NixOS without virtualization\" because NixOS obviates some (but not all) of\
    \ the reasons for using containers. In other words, once you switch to using NixOS\
    \ you might find that you can find fine without containers or at least use them\
    \ more sparsely.\n\n+   - NixOS as a host operating system - Dynamic containers\n\
    \  You can also use NixOS to run containers dynamically, but NixOS is not special\
    \ in this regard. At best, NixOS might simplify administering a container orchestration\
    \ service (e.g. kubernetes).\n\n+   - Application containers sans NixOS\n  This\
    \ is technically a use case for Nixpkgs and not NixOS, but I mention it for completeness.\
    \ Application containers built by Nixpkgs work best if you are trying to introduce\
    \ the Nix ecosystem (but not NixOS) within a legacy environment.\n  However, you\
    \ lose out on the benefits of using NixOS because, you're no longer using NixOS."
