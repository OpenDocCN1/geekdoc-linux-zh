    \ 中的说明。特别注意不要为账户的根用户生成访问密钥。相反，请使用身份和访问管理 (IAM) 服务创建一个具有“管理员”权限的独立用户并并该用户生成密钥。根用户和管理员用户的区别在于，管理员的权限可以被限制或撤销，但根用户的权限永远不会撤销。\n\
    \n> AWS 文档还建议生成临时访问凭据。然而，正确且符合人体工程学的设置这些内容需要使用 IAM Identity Center，而这仅适用于设置了 AWS\
    \ Organization 的 AWS 账户。这出了本书的范围，因此你应该直接为非根管理员账户生成长期凭据。\n\n如果你正确生成了访问凭据，你应该拥有：\n\
    \n- ¹https://aws.amazon.com/premiumsupport/knowledge-center/create-and-activate-aws-account/\n\
    - ²https://docs.aws.amazon.com/general/latest/gr/aws-sec-cred-types.html\n\n##\
    \ 使用 Terraform 部署 AWS\n\n- 一个访问密钥 ID（即 `AWS_ACCESS_KEY_ID`）\n- 一个秘密访问密钥（即 `AWS_SECRET_ACCESS_KEY`）\n\
    \n如果你已经通过运行内核配置了开发环境以使用这些令牌：\n\n```bash\n$ nix run github:NixOS/npkgs/22.11*awscli\
    \ configure --profile nixos-in-production\nAWS Access Key Id [None]: :\nAWS Secret\
    \ Access Key [None]: :\nDefault region name [None]: :\nDefault format [None]:\n\
    ```\n\n## Minimal的 Terraform 规范\n\n现在运行以下命令启动你的第一个 Terraform 项目：\n\n```bash\n\
    $ nix flake init --template github:Gabriella439/nixos-in-production*server\n```\n\
    \n这将生成以下文件：\n- module.nix: TODO 列表 Web 应用程序的 NixOS 配置，已调整为在 AWS 上运行而不是在 qemu 虚拟机内部。\n\
