  - '[PAGE 19]


    Setting up your development environment


    +   - On macOS the installer defaults to a multi-user Nix installation

    macOS doesn''t even support a single-user Nix installation, so this is a good
    default.


    +   - On Windows the installer defaults to a single-user Nix installation

    This default is also the recommended option.


    +   - On Linux the installer defaults to a single-user Nix installation

    This is the case where the default behavior is questionable. Multi-user Nix installations
    are typically better if your Linux distribution supports systemd, so you should
    explicitly specify --daemon if you use systemd.


    # # Pinning the version


    First, we will want to pin the version of the Nix that you install if you''re
    creating setup instructions for others to follow. For example, this book will
    be based on Nix version 2.11.0, and you can pin the Nix version like:


    ```

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```


    and you can find the set of available releases by visiting the release file server².


    > Feel free to use a Nix version newer than 2.11.0 if you want. The above installation
    script only pins the Nix 2.11.0 because that''s what happened to be the latest
    stable version at the time of this writing. That''s also the version that the
    examples from this book have been tested against.

    The only really important thing is that everyone within your organization uses
    the same version of Nix, if you want to minimize your support burden.


    However, there are a few more options that the script accepts we''re going to
    make good use of, and we can list those options by supplying --help to the script:


    ```

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL") --help

    ```


    ¹https://releases.nixos.org/prefix-nix/'
  - '[PAGE 20]


    # Setting up your development environment


    Nix Installer [--daemon|--no-daemon] [--daemon-count INT] [--no-channel-add] [--no-modify-profile
    [--nix-extra-conf-file FILE]

    Choose installation method.


    +   --daemon: installs a background daemon that manages the store, providing multi-user
    support and better isolation for local builds. Both for security and reproducibility,
    this method is recommended for your platform.

    See https://nicos.org/manual/nix/stable/installation/installing-binary.html#multi-user-i-

    --no-daemon: Simple, single-user installation that does not require root and is
    default

    --no-channel-add: Don''t add channels. nixpkgs-unstable is installed by default.

    --no-modify-profile: Don''t modify the user profile to automatically load nix.

    --daemon-user-count: Number of users to create. Defaults to 2.

    --nix-extra-conf file: Path to nix.conf when installing /etc/nix/nix.conf

    --tarball-url-prefix URL: Base URL to download the Nix tarball from.


    > You might wonder if you can use the --tarball-url-prefix for distributing a
    custom build of Nix, but that''s not what this option is. You can only use this
    option to download Nix from a different location (e.g. an internal mirror), because
    the new download still has to match the integrity check as the old download.

    Don''t worry, though; there is still a way to distribute a custom build of Nix,
    and we''ll cover that in a later chapter.


    # Configuring the installation


    The extra options of interest to us are:


    +   --nix-extra-conf-file

    This lets you extend the installed nix.conf if you want to make sure that all
    users within your organization share the same settings.

    --no-channel-add

    You can (and should) enable this option in a professional organization to disable
    the preinstallation of any channels.


    These two options are crucial because we are going to use them to systematically
    replace Nix channels with flakes.'
  - "[PAGE 21]\n\n# Setting up your development environment\n\nNix channels are a\
    \ trap and I treat them as a legacy feature poorly suited for professional development,\
    \ despite how ingrained they are in the Nix ecosystem.\n\nThe issue with channels\
    \ is that they essentially introduce impurity to your builds by depending on the\
    \ Nix_PATH and there aren't great solutions for enforcing that every Nix user\
    \ or every machine within your organization has the same Nix_PATH.\n\nMoreover,\
    \ Nix supports flakes, which you can think of as a more modern alternative to\
    \ channels. Familiarity with flakes is not a preconditioning to reading this book,\
    \ though: I'll teach you what you need to know.\n\nWhat we're going to do is:\n\
    \n+   * Disable channels by default\nDevelopers can still opt in channels by installing\
    \ them, but disabling channels by default will discourage people from contributing\
    \ Nix code that depends on the Nix_PATH.\n\n+   * Append the following setting\
    \ to nix.conf to enable the use of flakes:\n\n```\nextra-experimental-features\
    \ = nix-command flakes repl-flake\n$ VERSION=`2.11.0`\n$ URL=\"https://releases.nix.org/nix/nix$(VERSION)/install\"\
    \n$ CONFIGURATION=\"extra-experimental-features = nix-command flakes repl-flake\\\
    nextra-trusted-users = $(USER)\"\n\nsh $(curl --location \"$(URL)\") \\\n  --no-channel-add\
    \ \\\n  --nix-extra-conf <<\\$$(CONFIGURATION)\"\n```\n\nSo the final installation\
    \ script we'll end up with:\n\nThe first script works only if your shell is Bash\
    \ or Zsh and all commands throughout this book assume the use of one of those\
    \ shells.\n\nFor example, the above command uses for process substitution (which\
    \ is not available in a POSIX shell environment) because otherwise we would have\
    \ to create a temporary file to store the CONFIGURATION and clean up the temporary\
    \ file afterwards (which is tricky to do 00% reliably). Process substitution is\
    \ also more reliable than a temporary file because it happens in memory and the\
    \ intermediate result can't be accidentally deleted.\n\n# Running a NixOS virtual\
    \ machine\n\nNow you've installed Nix so I will show you how to launch a NixOS\
    \ virtual machine (VM) so you can test the examples throughout this book."
  - "[PAGE 22]\n\n# macOS-specific instructions\n\nIf you are using macOS, then follow\
    \ the instructions in the Nixpkgs manual to set up a local Linux builder. We'll\
    \ need this builder to create other NixOS machines, since they require Linux products.\n\
    \nIn particular, you will need to leave that builder running in the background\
    \ while following the remaining examples in this chapter. In other words, in one\
    \ terminal window you will need to run:\n\n```\n$ run nixpkgs@darwin.builder\n\
    ```\n\nand you will need to be running whenever you need to build a NixOS system.\
    \ However, you can shut down the builder when you're not using it by giving the\
    \ builder the shut.down command.\n\n> The run nixpkgs@darwin.builder command is\
    \ not enough to set up Linux builds on macOS. Read and follow the full set of\
    \ instructions from the Nixpk manual linked above.\n\nIf you are using Linux (including\
    \ the Windows Subsystem for Linux) you can skip to the next step.\n\n# Platform-independent\
    \ instructions\n\nRunning the following command to generate your first project:\n\
    \n```\n$ nix flake init --template github.com/Gabriella439/nixos-in-production*setup\n\
    ```\n\nthat will generate the following .nix file:\n\n```\ninputs = {\n  flake-utils\
    \ url = \"github://numotide/flake-utils/v1.0.0\";\n  nixpkgs url = \"github:NixOS/nixpkgs/4e90e2b1a47eb43d73d60bae58e84a1e7610\"\
    ;\nn  outputs = { flake-utils, nixpkgs, ... };\n  flake-utils.eachSystem (system:\n\
    \    let\n      nixpkgs = nixpkgs.overlagePackages \"${system}\";\n\n      base\
    \ = { lib, modulesPath, ... }; {\n        imports = [ \"${modulesPath}/virtualisation/qemu-vm.nix\"\
    \ ];\n      } \n      # https://github.com/utmapp/ITM/2353\n      networking.nameserver\
    \ = lib mkIf pkgs.stdenv.isDarwin \"8.8.8.8\";\n    );\\};\n```"
