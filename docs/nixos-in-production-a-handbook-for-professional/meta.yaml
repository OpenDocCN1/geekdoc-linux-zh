  md: "Advanced option definitions\n\n42\n\n... and that would produce the same result.\
    \ Which is better?\nThe short answer is: lib.mkMerge is usually what you want.\n\
    The long answer is that the main trade-off between imports and lib.mkMerge is:\n\
    \n+   * The imports section can merge NixOS modules that are functions\n  lib.mkMerge\
    \ can only merge configuration sets and not functions.\nn* The list of imports\
    \ can't depend on any configuration values\n  In practice, this means you can\
    \ easily trigger an infinite recursion if you try to do anything fancy using imports\
    \ and you can typically fix the infinite recursion by switching to lib.mkMerge.\n\
    \nThe latter point is which you should prefer using lib.mkMerge.\n\n# Merging\
    \ options\n\nYou can merge configuration sets that define same option multiple\
    \ times, like this:\n\n```\n{ lib, ... };\n\n{ config = lib.mkMerge {\n  ( networking.firewall.allowedTCPPorts\
    \ = [ 80 ]; );\n  ( networking.firewall.allowedTCPPorts = [ 443 ]; );\n  ( users.root.initialPassword\
    \ = \"\");\n};\n```\n\n... and the outcome of merging two identical attribute\
    \ paths depends on the option's \"type\".\nFor example, the networking.firewall.allowedTCPPorts\
    \ option type is:\n\n```\n$ nix eval .machine.options.networking.firewall.allowedTCPPorts.type.description\n\
    \"list of 16 bit unsigned integer; between 0 and 65535 (both inclusive)\"\n```\n\
    \nIf you specify a list-valued option twice, the lists are combined, so the above\
    \ example reduces to:"
