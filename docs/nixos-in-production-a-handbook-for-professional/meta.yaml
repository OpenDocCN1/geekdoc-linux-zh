  md: "# Advanced option definitions\n\n```\n```nix\nconfig = {\n  services nginx.services.nginx\
    \ enable = true;\n  systemd.services.nginx serviceConfig RestartSec = \"5s\";n}\n\
    ```\n```\n\nThe above naive attempt will fail at evaluation time with:\n\n```\n\
    ```\nerror: The option 'systemd.services.nginx serviceConfig RestartSec' has conflicting\
    \ definition values:\n  - /nix/store/../source/nixos/modules/services/web-servers/nginx/default.nix:\
    \ \"1s\"\n  - /nix/store/../source/module.nix: \"5s\"\n(use 'show-trace' to show\
    \ detailed location information)\n```\n```\n\nThe problem is that we enable nginx\
    \ that automatically defines a whole bunch of other NixOS options, including system.services.nginx.serviceConfig.\
    \ This option is a scalar string option that allows multiple default values because\
    \ the NixOS system by default has no way to know which one to pick to resolve\
    \ the conflict.\n\nHowever, we can mkOverride to annotate our value with a higher\
    \ priority so that it overrides the other definition:\n\n```\n```nix\nlib, ...\
    \ :\nconfig = {\n  services nginx.enable = true;\n  systemd.services.nginx serviceConfig\
    \ RestartSec = lib.mkOverride 50 \"5s\";\n}\n```\n```\n\nand now that works, since\
    \ we specified a new priority of 50 that takes priority over the default priority\
    \ of 100. There is also a pre-existing utility named lib.mkForce which sets the\
    \ priority to 50, so we could also have used that:\n\n```\n```nix\nlib, ... :\n\
    config = {\n  services nginx.enable = true;\n  systemd.services.nginx serviceConfig\
    \ RestartSec = lib.mkForce \"5s\";\n}\n```\n```\n\n> https://github.com/NixOS/nixpkgs/blob/nixos-22.05/nixos/modules/services/web-servers/nginx/default.nix#L890"
