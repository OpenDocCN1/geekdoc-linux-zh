    \ \"nixos-in-production\" {\n  public_key = tls_private_key.nixos-in-production.public_key\n\
    }\n\n# Deploying to AWS with Terraform\n\nThe tls_private_key resource is currently\
    \ not secure because the deployment state is stored locally. We will fix this\
    \ by storing the deployment state using S3 backend - but that't be covered until\
    \ the next chapter.\n\nAfter we get to the actual server:\n\n```\nresource \"\
    aws_instance\" \"todo\" {\n  # This will be an AMI for NixOS server which we'll\
    \ get below.\n  ami = module.ami.ami\n\n  # We could use a smaller instance, but\
    \ at the time of writing the\n  # t3.micro instance is available for the free\
    \ tier.\n  instance_type = \"t3.micro\"\n\n  # Install the security groups we\
