    # # 8. Deploying to AWS using Terraform


    Until now we''ve been playing things safe and test-driving everything locally
    on our own machine. We could even prolong this quite for a while because NixOS
    has advanced support for building and testing clusters of NixOS machines locally
    using virtual machines. However, some point we will need to dive in and deploy
    a server if we''re going to use NixOS for real.


    In this chapter we''ll deploy our TODO app to our first "production" server in
    AWS meaning that we will need to create an [AWS account](https://aws.amazon.com/)
    to follow along.


    > AWS prices and offers vary so this book cannot provide any strong guarantees
    about what would cost you. However, at the time of writing the examples in this
    chapter would fit well within the current AWS free tier, which is 750 t3.micro
    instance.


    Even if there is no free tier, the cost of a t3.micro instance is ~$16 / hour
    or ~$7.50 / month if you never shut it off (and you can shut it off when you''re
    not using it). So what this chapter should only cost you a few cents from start
    to finish.


    Throughout this book I''ll take care to minimize your expenditures by showing
    you how to develop and test locally as much as possible.


    In the spirit of Infrastructure as Code, we''ll be using Terraform to declaratively
    provision AWS resources, but before doing so we generate AWS access keys for programmatic
    access.


    # ## Configuring your access keys


    To generate your access keys, follow the instructions in [Accessing AWS using
    AWS credentials](https://docs.aws.amazon.com/general/latest/gr/aws-credentials.html).
    In particular, take care to not generate access keys for your account''s root
    user. Instead, use the Identity and Access Management (IAM) service to create
    a separate user with "Admin" privileges and generate keys for that user. The difference
    between a root user and an admin user is that an admin user''s privileges can
    be limited or revoked, but the root user''s privileges never be revoked.


    > The AWS documentation also recommends generating temporary access credentials.
    However, setting this up properly and ergonomically requires using the IAM Identity
    Center which is only permitted for AWS accounts that have set up an AWS Organization.
    That is outside of the scope of this book so instead you should just generate
    long-term credentials for a non-root admin account.


    If you generated your access credentials correctly you should have:


    ```

    ¹https://aws.amazon.com/premiumsupport/knowledge-center/create-and-activate-aws-account/

    ²https://docs.aws.amazon.com/general/latest/gr/aws-sec-cred-types.html

    ```'
