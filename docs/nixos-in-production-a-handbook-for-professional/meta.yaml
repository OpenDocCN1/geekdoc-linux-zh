    # 4. Setting up your development environment


    I''d like you to be able to follow along with the examples in this book, so this
    chapter provides a quick setup guide to bootstrap from nothing to deploying a
    blank NixOS system that you can use for experimentation.


    # Installing Nix


    You''ve likely installed Nix if you''re reading this book, but I''ll still cover
    how to do this because I have a few tips to share that can help you author a more
    reliable installation script for your colleagues.


    Needless to, if you or any of your colleagues are using NixOS as your development
    operating system then you don''t need to install Nix and you can skip to the Running
    a NixOS Virtual Machine section below.


    # Default installation


    If you go to the download page for Nix¹ it will tell you to run something similar
    to this:


    ```

    $ sh --curl https://nixos.org/nix/install

    ```


    > Throughout this book I will use consistently long option names instead of short
    names (e.g. --location instead of -L), for two reasons:


    +   - Long option names are more self-documenting

    - Long option names are easier to remember


    For example, tar --extract --file is clearer and a better mnemonic than tar xf.


    You may freely use shorter option names if you prefer, though, I still highly
    recommend using long option names at least for non-interactive scripts.


    Depending on your platform the download instructions might also tell you to pass
    the --daemon or --no-daemon option to the installation script to specify a single-user
    or multi-user installation. For simplicity, the instructions in this chapter will
    omit the --daemon / --no-daemon flag, but keep in mind the following platform-specific
    advice:


    ![](img/c489b7e442a2ecbe2438de51de0c6a09_18_0.png)'
- md: '## Setting up your development environment


    - On macOS the installer defaults to a multi-user Nix installation. macOS doesn''t
    even support a single-user Nix installation, so this is a good default.


    - On Windows the installer defaults to a single-user Nix installation. This default
    is also the recommended option.


    - On Linux the installer defaults to a single-user Nix installation. This is the
    case where the default behavior is questionable. Multi-user Nix installations
    are typically better if your Linux distribution supports systemd, so you should
    explicitly specify --daemon if you use systemd.


    ## Pinning the version


    First, we will want to pin the version of the Nix that you install if you''re
    creating setup instructions for others to follow. For example, this book will
    be based on Nix version 2.11.0, and you can pin the Nix version like:


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```


    and you can find the set of available releases by visiting the release file server².


    > Feel free to use a Nix version newer than 2.11.0 if you want. The above installation
    script only pins the Nix 2.11.0 because that''s what happened to be the latest
    stable version at the time of this writing. That''s also the version that the
    examples from this book have been tested against.

    The only really important thing is that everyone within your organization uses
    the same version of Nix, if you want to minimize your support burden.


    However, there are a few more options that the script accepts we''re going to
    make good use of, and we can list those options by supplying --help to the script:


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL") --help

    ```


    ¹https://releases.nixos.org/prefix-nix/


    ## Setting up your development environment


    Nix Installer [--daemon|--no-daemon] [--daemon-count INT] [--no-channel-add] [--no-modify-profile
    [--nix-extra-conf-file FILE]]

    Choose installation method.


    - --daemon: installs a background daemon that manages the store, providing multi-user
    support and better isolation for local builds. Both for security and reproducibility,
    this method is recommended for your platform.

    See https://nicos.org/manual/nix/stable/installation/installing-binary.html#multi-user-i

    - --no-daemon: Simple, single-user installation that does not require root and
    is default

    - --no-channel-add: Don''t add channels. nixpkgs-unstable is installed by default.

    - --no-modify-profile: Don''t modify the user profile to automatically load nix.

    - --daemon-user-count: Number of users to create. Defaults to 2.

    - --nix-extra-conf file: Path to nix.conf when installing /etc/nix/nix.conf

    - --tarball-url-prefix URL: Base URL to download the Nix tarball from.


    > You might wonder if you can use the --tarball-url-prefix for distributing a
    custom build of Nix, but that''s not what this option is. You can only use this
    option to download Nix from a different location (e.g. an internal mirror), because
    the new download still has to match the integrity check as the old download.

    Don''t worry, though; there is still a way to distribute a custom build of Nix,
    and we''ll cover that in a later chapter.


    ## Configuring the installation


    The extra options of interest to us are:


    - --nix-extra-conf-file

    This lets you extend the installed nix.conf if you want to make sure that all
    users within your organization share the same settings.

    - --no-channel-add

    You can (and should) enable this option in a professional organization to disable
    the preinstallation of any channels.


    These two options are crucial because we are going to use them to systematically
    replace Nix channels with flakes.


    ## Setting up your development environment


    Nix channels are a trap and I treat them as a legacy feature poorly suited for
    professional development, despite how ingrained they are in the Nix ecosystem.


    The issue with channels is that they essentially introduce impurity to your builds
    by depending on the Nix_PATH and there aren''t great solutions for enforcing that
    every Nix user or every machine within your organization has the same Nix_PATH.


    Moreover, Nix supports flakes, which you can think of as a more modern alternative
    to channels. Familiarity with flakes is not a preconditioning to reading this
    book, though: I''ll teach you what you need.


    What we''re going to do is:


    - * Disable channels by default

    - * Append the following setting to nix.conf:


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```'
  mdcn: '

    ## 设置你的开发环境


    - 在 macOS 上，安装程序默认采用多用户 Nix 安装方式。macOS 甚至不支持单用户 Nix 安装，因此这是一个很好的默认设置。


    - 在 Windows 上，安装程序默认采用单用户 Nix 安装方式。该默认设置也是推荐的选项。


    - 在 Linux 上，安装程序默认采用单用户 Nix 安装方式。在这种情况下，默认行为是值得商的。如果你的 Linux 发行版支持 systemd，通常情况下多用户
    Nix 安装会更好，因此如果你使用 systemd，应该显式指定 `--daemon`。


    ## 锁定版本


    首先，如果你正在为他人创建供遵循的设置说明，你想要锁定你所安装的 Nix 版本。例如，本书将基于 Nix 2.11.0 版本编写，你可以像这样锁定 Nix
    版本：


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```


    你可以通过访问发布文件服务器²找到所有可用的发布版本。


    > 如果你愿意，可以使用比 2.11.0 更新的 Nix 版本。上面的安装脚本仅锁定 Nix 2.11.0，是因为在编写本书时它恰好是最新稳定版本。这也是书中示例经过测试的版本。

    如果你想尽可能减少你的支持负担，唯一真正重要的一点是你组织内的每个人都使用相同版本的 Nix。


    然而，脚本还接受其他几个选项，我们将充分利用这些选项，你可以通过向脚本提供 `--help` 来列出这些选项：


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL") --help

    ```


    ¹https://releases.nixos.org/prefix-nix/


    ## 设置你的开发环境


    Nix Installer [--daemon|--no-daemon] [--daemon-count INT] [--no-channel-add] [--no-modify-profile
    [--nix-extra-conf-file FILE]]

    选择安装方法。


    - --daemon：安装一个管理存储（store）的后台守护进程，提供多用户支持并为本地构建提供更好的隔离。出于安全和复现性的考虑，推荐你的平台使用此方法。

    见 https://nicos.org/manual/nix/stable/installation/installing-binary.html#multi-user-i

    - --no-daemon：简单的单用户安装，不需要 root 权限且是默认选项。

    - --no-channel-add：不添加通道（channels）。默认安装 nixpkgs-unstable。

    - --no-modify-profile：不修改用户配置以自动加载 nix。

    - --daemon-user-count：要创建的用户数量。默认为 2。

    - --nix-extra-conf file：安装 /etc/nix/nix.conf 时 nix.conf 的路径。

    - --tarball-url-prefix URL：下载 Nix 压缩包的基础 URL。


    > 你可能会奇是否可以使用 --tarball-url-prefix 来分发 Nix 的自定义构建，但并不是该选项的作用。你只能使用此选项从不同的位置（例如内部镜像）下载
    Nix，因为新的下载仍然必须通过旧下载相同的完整性检查。

    不过不用担心，仍然有分发 Nix 自定义构建的方法，我们将在后面的章节中介绍。


    ## 配置安装


    我们感兴趣的额外选项是：


    - --nix-extra-conf-file

    如果你想确保你组织内的所有用户共享相同的设置，这允许你扩展已安装的 nix.conf。

    - --no-channel-add

    你可以（也应该）在专业组织中启用此选项以禁用通道的预安装。


    这两个选项至关重要，因为我们将使用它们将 Nix 通道系统替换为 flakes。


    ## 设置你的开发环境


    Nix 通道是一个陷阱，我将其视为不适用于专业开发的遗留特性，尽管它们在 Nix 生态系统中根深蒂固。


    通道的问题在于，它们通过依赖 Nix_PATH 本质上为构建引入了不纯性，而且没有很好的方案可以强制你组织内的每个 Nix 用户或每台机器具有相同的 Nix_PATH。


    此外，Nix 支持 flakes，你可以将其视为通道的更现代的替代方案。熟悉 flakes 并不是阅读本书的先决条件：我将教你需要的内容。


    我们要做的是：


    - 默认禁用通道

    - 向 nix.conf 添加以下设置：


    ```bash

    $ VERSION=2.11.0

    URL="https://releases.nixos.org/nix-${VERSION}/install"

    sh $(curl --location "$URL")

    ```

    '
