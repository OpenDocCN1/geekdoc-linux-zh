  md: "# 7. Advanced option definitions\n\nNixOS option definitions are actually much\
    \ more sophisticated than the previous chapter let and in this chapter we'll cover\
    \ some common tricks and pitfalls.\n\nMake sure that you followed the instructions\
    \ from the \"Setting up your development environment\" chapter if you would like\
    \ to test the examples in this chapter.\n\n# Imports\n\nThe NixOS module system\
    \ lets you import other modules by their path, which merges the option declarations\
    \ and option definitions with the current module. But, did you know that the elements\
    \ of an imports list don't have to be paths?\n\nYou can inline NixOS configurations\
    \ in the imports list, like these:\n\n```\n{ imports = {\n  services openssh enable\
    \ = true;\n  users.root.initialPassword = \"\";\n};\n```\n\nand they will behave\
    \ as if you had imported files with the same contents as those inline configurations.\n\
    \nIn fact, anything that is a valid NixOS module can go in the import list, including\
    \ NixOS modules that are:\n\n```\n{ imports = {\n  services openssh enable = true;\n\
    \  (( lib, }): users.root.initialPassword = lib.mkDefault(\"\"));\n};\n```\n\n\
    I will make use of this trick in a few examples below, so that we can simulate\
    \ modules importing other modules within a single file.\n\n# lib utilities\n\n\
    Nixpkgs provides several utility functions for NixOS modules that are stored underneath\
    \ the \"lib\" hierarchy, and you can find the source code for those functions\
    \ in lib/modules.nix¹.\n\n> ¹https://github.com/NixOS/nixpkgs/blob/22.05/lib/modules.nix"
  merge: -1
  pgno: 43
- img_proc: true
  md: "If you want to become a NixOS module system expert, take the time to read and\
    \ understand all of the code in lib/modules.nix.\n\nRemember that the NixOS module\
    \ system is implemented as a domain-specific language in Nix and lib/modules.nix\
    \ contains the implementation of that domain-specific language, so if you understand\
    \ everything in that then you understand essentially all that there is to know\
    \ how the NixOS module system works under the hood.\n\nThat said, this chapter\
    \ will still try to explain things enough so that you don't have to read through\
    \ that.\n\nYou do not need to use or understand all of the functions in lib/modules.nix,\
    \ but you need to familiarize yourself with the following primitive functions:\n\
    \n+   - lib.mkMerge\n- lib.mkOverride\n- lib.mkIf\n- lib.mkOrder\n\nBy \"primitive\"\
    , I mean that these functions cannot be implemented in terms of other functions.\
    \ They all hook into special behavior built into lib.evalModules.\n\n# mkMerge\n\
    \nThe lib.mkMerge function merges a list of \"configuration sets\" into a single\
    \ \"configuration set\" (where \"configuration set\" means a potentially nested\
    \ attribute set of configuration option settings).\n\nFor example, the NixOS module:\n\
    \n```\n{ lib, ... }:\n{\n config = lib.mkMerge {\n  { services openssh enable\
    \ = true; }\n  { users.root.initialPassword = \"\"; }\n}\n\n```\n\nis equivalent\
    \ to this NixOS module:\n\n```\nconfig = {\n  services openssh enable = true;\n\
    \  users.root.initialPassword = \"\";\n}\n\n```"
  merge: -1
  pgno: 44
