  - "[PAGE 8]\n\nWhat is NixOS for?\n\n+   - Application containers\n  Containers\
    \ technically do not need to run an entire operating system and can instead run\
    \ a single process (e.g. one service). You can do this with Nixpkgs, which provides\
    \ support for building application containers.\n\nSo which use cases are NixOS/Nixpkgs\
    \ well-suited for? If I had to rank these deployment models then my preference\
    \ (in descending order) would be:\n\n+   - NixOS as a guest operating system\n\
    \  Specifically, this means that you would run NixOS as a virtual machine on a\
    \ cloud provider (e.g.-AWS) and all of your services run within that NixOS guest\
    \ machine with no intervening containers.\n  I prefer this because this is the\
    \ least deployment model and the lowest maintenance to administer.\n\n+   - NixOS\
    \ without virtualization\n  This typically entails running NixOS on a physical\
    \ rack server and you still use NixOS to manage all of your services without containers.\n\
    \  This can potentially be the most cost-effective deployment model if you're\
    \ willing to manage your own hardware (including RAID and backup/restore) or you\
    \ operate your own data center.\n\n+   - NixOS as a host operating system - Static\
    \ containers\n  NixOS also works well when you want to statically specify a set\
    \ of containers to run. Not only can NixOS run Docker containers or OCI containers,\
    \ but NixOS also provides special support for \"NixOS containers\" (which are\
    \ systemd-spawn containers under the hood) or application containers built by\
    \ Nixpkgs.\n  I rank this lower \"NixOS without virtualization\" because NixOS\
    \ obviates some (but not all) of the reasons for using containers. In other words,\
    \ once you switch to using NixOS you might find that you can find fine without\
    \ containers or at least use them more sparsely.\n\n+   - NixOS as a host operating\
    \ system - Dynamic containers\n  You can also use NixOS to run containers dynamically,\
    \ but NixOS is not special in this regard. At best, NixOS might simplify administering\
    \ a container orchestration service (e.g. kubernetes).\n\n+   - Application containers\
    \ sans NixOS\n  This is technically a use case for Nixpkgs and not NixOS, but\
    \ I mention it for completeness. Application containers built by Nixpkgs work\
    \ best if you are trying to introduce the Nix ecosystem (but not NixOS) within\
    \ a legacy environment.\n  However, you lose out on the benefits of using NixOS\
    \ because, you're no longer using NixOS."
  - '[PAGE 9]


    What is NixOS for?


    # The killer app for NixOS


    Based on the above guidelines, we can outline the ideal use case for NixOS:


    +   - NixOS shines as a server operating system for SaaS deployments

    - Services should preferably be statically defined via the NixOS configuration

    - NixOS can containerize these services, but it''s simpler to skip the containers


    If your deployment model matches that then NixOS is not only a safe choice, but
    the best choice! You will be in a great company if you use NixOS in this way.


    You can still use NixOS in other capacities, but the further you depart from the
    above “killer app” the more you will need to roll up your sleeves.


    # Profile of a NixOS adopter


    NixOS is a DevOps tool, meaning that NixOS blurs the boundary between software
    development and operations.


    The reason why NixOS fits the DevOps space is so well because NixOS unifies all
    aspects of managing a system through the NixOS options interface. In other words,
    you can use NixOS options to configure operational details (e.g. RAID, encryption,
    boot loaders) and also software development details (e.g. dependency versions,
    patches, and even small amounts of inline code).


    This means that a DevOps engineer or DevOps team is best situated to introduce
    NixOS within an engineering organization.


    > DevOps is more of a set of cultural practices than a team, but some organizations
    explicitly create a DevOps team or hire engineers for their DevOps expertise in
    order to support tools (like NixOS) that enable those cultural practices.


    # What does NixOS replace?


    If NixOS is a server operating system, does that mean that NixOS competes with
    other operating systems like Ubuntu Server, Debian or Fedora? Not exactly.


    NixOS competes more with the Docker ecosystem, meaning a lot of the value that
    NixOS adds over Docker:


    +   - NixOS supports declarative system specification

    ... analogous to docker compose.


    https://www.atlassian.com/devops'
  - '[PAGE 10]


    # What is NixOS for?


    +   * NixOS provides better isolation

    ... analogous to containers.

    * NixOS uses the Nix package manager to declaratively assemble software

    ... analogous to Dockerfiles.


    You can use NixOS in conjunction with Docker containers since NixOS supports declaratively
    launching containers, but you probably want to avoid buying further into the broader
    Docker ecosystem if you use NixOS. You don''t want to be in a situation where
    your engineering organization fragments and does everything in two different ways:
    the NixOS way and the Docker way.


    > For those familiar with the Gentoo Linux distribution, NixOS is like Gentoo,
    but for Docker\*. Similar to Gentoo, NixOS is an operating system that provides
    unparalleled control over the machine while targeting use cases and workflows
    similar to the Docker ecosystem.


    *Thank you to Adam Gordon Bell for this analogy'
  - '[PAGE 11]


    # #3. The big picture


    Before diving in further you might want to get some idea of what a “real” NixOS
    software enterprise looks like. Specifically:


    +   * What are the guiding principles for a NixOS-centric software architecture?

    * How does a NixOS-centric architecture differ from other architectures?

    * What would a “NixOS team” need to be prepared to support and maintain?


    Here I’ll do my best to answer those questions so that you can get a better idea
    of what you would be signing up for.


    # # The Zen of NixOS


    I like to use the term “master cue” to denote an overarching sign that indicates
    that you’re doing things right. This master cue might not tell you *how* to do
    things right, but it can still provide a high-level indicator of whether you are
    on the right track


    The master cue for NixOS is very similar to the master cue for the Nix ecosystem,
    which is this:


    > Every common build/test/deploy-related activity should be possible with at most
    one command using Nix’s command line interface.


    I say *at most one command* because some activities (like continuous deployment)
    should ideally require no intervention at all. However, activities that require
    human intervention should in principle compressible into a single Nix command.


    I can explain this by providing an example of a development workflow that *disregards*
    this master cue:


    Suppose you want to test your local project’s changes within the context of larger
    system at work (i.e. an integration test¹). Your organization’s process for testing
    your code might hypothetically look like this:


    +   * Create and publish a branch in version control regulating your changes

    * Manually trigger some workflow to build a software artifact containing your
    changes

    * Update some configuration file to reference the newly-built software artifact

    * Run the appropriate integration test


    Now if I tell you that the entire integration testing process from start to finish
    could be:


    ¹https://en.wikipedia.org/wiki/Integration_testing'
  - '[PAGE 12]


    # The big picture


    +   - Run nix flake check


    In other words:


    +   - There would be no need to create or publish your branch

    You could test uncommitted changes straight from your local project checkout.


    +   - There would be no multi-step publication process

    All of the intermediate build products and internal references would be handled
    transparently by the Nix build tool.


    +   - The test itself would be managed by the Nix build tool

    In other words, Nix would treat your integration test no differently than any
    other build product. Tests and their outputs are build products.


    +   - There would be no need to select the appropriate tests to rerun

    The Nix build tool would automatically verify which tests depended on your project
    and rerun those. Other test runs and results would be cached if their dependency
    tree did not include your changes.


    Some of these potential improvements are not specific to the Nix ecosystem. After
    all, you could attempt to create a script that automates the most painstaking
    multi-step process. However, you would likely need to reinvent large portions
    of the Nix ecosystem for this automation to be sufficiently robust and efficient.
    For example:


    +   - Do you maintain a file for storing intermediate build products?

    You''re likely implementing your own version of the Nix store and caching server


    +   - Do you generate unique labels for build products to isolate parallel workflows?

    In the best case scenario, you build products by a hash of their dependencies
    and you''ve reinvented the Nix store''s hashing scheme. In the worst case scenario
    you''re doing less accurate (e.g. using timestamps instead of hashes).


    +   - Do you have a custom script that updates references to these build products?

    This would be reinventing Nix''s language support for automatically updating dependency
    references.


    +   - Do you need to isolate your integration tests or run them in parallel?

    You would likely reimplement the NixOS test framework.


    You can save yourself a lot of headaches by taking time to learn and use the Nix
    ecosystem idiomatically as possible instead of learning these lessons the hard
    way.'
- md: "## GitOps\n\nNixOS exemplifies the Infrastructure as Code (IaC)² paradigm,\
    \ meaning that every aspect of your organization (including hardware/systems/software)\
    \ is stored in code or configuration files that are the source of truth for everything\
    \ is built. In particular, you don't make undocumented changes to your infrastructure\
    \ that cause it to diverge from what is recorded within those files.\n\nThis book\
    \ will expose a specific flavor of Infrastructure of Code known as GitOps³ where:\n\
    \n- The code and configuration files are (primarily) declarative\n  - In other\
    \ words, they tend to specify the desired state of the system rather than a sequence\
    \ of steps to get there.\n\n- These files are stored in version control\n  - Proponents\
    \ of this approach most use git as their version control software, which is why\
    \ it's called \"GitOps\".\n\n- Pull requests are the change management system\n\
    \  - In other words, the pull request review process determines whether you have\
    \ sufficient privileges, even vetting, or the correct awaits from relevant maintainers.\n\
    \n## DevOps\n\nNixOS also exemplifies the DevOps principle of breaking down boundaries\
    \ between software developers (\"Dev\") and operations (\"Ops\"). Specifically,\
    \ NixOS goes further in this regard than most other tools by unifying software\
    \ configuration and system configuration underneath the NixOS option system. These\
    \ NixOS options fall into roughly three categories:\n\n- Systems configuration\n\
    \  - These are options that are mostly interesting to operations engineers, such\
    \ as:\n  - log rotation policies\n  - kernel boot parameters\n  - disk encryption\
    \ settings\n\n- Hybrid systems/software options\n  - These are options that lie\
    \ in the grey area between Dev and Ops, such as:\n  - Service restart policies\n\
    \  - Networking\n  - Credentials/secrets management\n\n- Software configuration\n\
    \  - These are options that are mostly interesting to software engineers, such\
    \ as:\n  - Patches\n  - Command-line arguments\n  - Environment variables\n\n\
    In extreme cases, you can even embed-Nix code inside of Nix and do \"pure software\
    \ development\". In other words, you can author inline code written within another\
    \ language inside of a NixOS configuration file. I'll include one example of this\
    \ later on the \"Our first web server\" chapter.\n\n² https://en.wikipedia.org/wiki/Infrastructure_as_code\n\
    ³ https://about.gitlab.com/topics/gitops/\n⁴ https://en.wikipedia.org/wiki/DevOps\n\
    \n## Architecture\n\nA NixOS-centric architecture tends to have the following\
    \ key pieces of infrastructure:\n\n- Version control\n  - If you're going to use\
    \ GitOps then you had better git! More specifically, you'll likely use a git hosting\
    \ provider like GitHub or GitLab which supports pull requests and continuous integration.\n\
    \  - Most companies these use version control, so this is not a surprising requirement.\n\
    \n- Product servers\n  - These are the NixOS servers that actually host your product-related\
    \ services.\n\n- A central build server (the \"hub\")\n  - This server initiates\
    \ builds for continuous integration, which are delegated to builders.\n\n- Builders\
    \ for each platform\n  - These builders perform the actual Nix builds. However,\
    \ remember that integration tests will be Nix builds, too, so these builders also\
    \ run integration tests.\n  - These builders will come in two flavors:\n  - Builders\
    \ for the hub (\"spokes\")\n  - Builders for developers to use\n\n- A cache\n\
    \  - In simpler setups the \"hub\" can double as a cache, but as you grow you\
    \ will likely want to upload build products to a dedicated cache.\n\n> https://github.com/\n\
    \n## The big picture\n\n- One or more \"utility\" servers\n  - A \"utility\" server\
    \ is a NixOS server that you can use to host IT infrastructure and miscellaneous\
    \ utility services to support developers (e.g. web pages, chat bots).\n\n  This\
    \ server will play a role analogous to a container engine or virtual machine hypervisor\
    \ in other software architectures, except that we won't necessarily be using virtual\
    \ machines or containers: many things will run natively on the host as NixOS servers.\
    \ Of course, you can also use this machine to run a container engine or hypervisor\
    \ in addition to running things on the host.\n\n> A \"utility\" server should\
    \ not be part of your continuous integration or continuous deployment pipeline.\
    \ You should think of such a server as a \"junk drawer\" for stuff that does not\
    \ belong in CI/CD.\n\nMoreover, you will either need a cloud platform (e.g. AWS)\
    \ or a data center for hosting these machines. In this book we'll primarily focus\
    \ on hosting infrastructure on AWS.\n\nThese are not the only components you will\
    \ need to build your product, but these should be the only components necessary\
    \ to support DevOps workflows, including continuous integration and continuous\
    \ deployment.\n\nNotably absent from the above list:\n\n- Container-specific infrastructure\n\
    \  - A NixOS-centric architecture already mitigates some of the need for containerizing\
    \ services, but the architecture doesn't change even if you do containers, because\
    \ containers can be built by Nixpkgs, distributed via the cache, and declaratively\
    \ deployed to any NixOS machine.\n\n- Programming-language-specific infrastructure\n\
    \  - If Nixpkgs supports a given language then we require no additional infrastructure\
    \ to support building and deploying that language. However, we might still host\
    \ language-specific amenities on our utility server, as generated documentation.\n\
    \n- Continuous-deployment services\n  - NixOS provides out-of-the-box services\
    \ that we can use for continuous deployment, which we will cover in a later chapter.\n\
    \n- Cloud/Virtual development environments\n  - Nix's support for development\
    \ shells (e.g. nix develop) will be our weapon of choice here.\n\n> https://aws.amazon.com/\n\
    \n## Scope\n\nSo far I've explained NixOS in high-level terms, but you might prefer\
    \ a more down-to-earth picture of the day-to-day requirements and responsibilities\
    \ for a professional NixOS user.\n\nTo that end, here is a checklist that will\
    \ summarize what you would need to understand in order to effectively introduce\
    \ and support NixOS within an organization:\n\n- Infrastructure setup\n  - Continuous\
    \ integration\n  - Builders\n  - Caching\n- Development\n  - NixOS module system\n\
    \  - Project organization\n  - NixOS best practices\n  - Quality controls\n- Testing\n\
    \  - Running virtual machines\n  - Automated testing\n- Deployment\n  - Provisioning\
    \ a new system\n  - Upgrading a system\n  - Dealing with restricted networks\n\
    - System administration\n  - Infrastructure as code\n  - Disk management\n  -\
    \ Filesystem\n  - Networking\n  - Users and authentication\n  - Limits and quotas\n\
    - Security\n  - System hardening\n  - Patching dependencies\n- Diagnostics and\
    \ Debugging\n  - Nix failures\n  - Test failures\n  - Production failures\n  -\
    \ Useful references\n- Fielding inquiries\n  - System settings\n  - Licenses\n\
    \  - Vulnerabilities\n  - Non-NixOS Integrations\n  - Images\n  - Containers\n\
    \nThis book will cover all of the above topics and more, although they will not\
    \ necessarily be grouped or organized in that exact order.\n\n# 4. Setting up\
    \ your development environment\n\nI'd like you to be able to follow along with\
    \ the examples in this book, so this chapter provides a quick setup guide to bootstrap\
    \ from nothing to deploying a blank NixOS system that you can use for experimentation.\n\
    \n## Installing Nix\n\nYou've likely installed Nix if you're reading this book,\
    \ but I'll still cover how to do this because I have a few tips to share that\
    \ can help you author a more reliable installation script for your colleagues.\n\
    \nNeedless to if you or any of your colleagues are using NixOS as your development\
    \ operating system then you don't need to install Nix and you can skip to the\
    \ Running a NixOS Virtual Machine section below.\n\n## Default installation\n\n\
    If you go to the download page for Nix¹ it will tell you to run something similar\
    \ to this:\n\n```\n$ sh --curl https://nixos.org/nix/install\n```\n\n> Throughout\
    \ this book I will use consistently long option names instead of short names (e.g.\
    \ --location instead of -L), for two reasons:\n\n- Long option names are more\
    \ self-documenting\n- Long option names are easier to remember\n\nFor example,\
    \ tar --extract --file is clearer and a better mnemonic than tar xf.\n\nYou may\
    \ freely use shorter option names if you prefer, though, I still highly recommend\
    \ using long option names at least for non-interactive scripts.\n\nDepending on\
    \ your platform the download instructions might also tell you to pass the --daemon\
    \ or --no-daemon option to the installation script to specify a single-user or\
    \ multi-user installation. For simplicity, the instructions in this chapter will\
    \ omit the --daemon / --no-daemon flag, but keep in mind the following platform-specific\
    \ advice:\n\n![](img/c489b7e442a2ecbe2438de51de0c6a09_18_0.png)"
  mdcn: "\n## GitOps\n\nNixOS 是基础设施即代码（IaC)²范式的典范，这意味着你组织的每个方面（包括硬件/系统/软件）都存储在代码或配置文件中，这些文件是构建一切的单一真理来源。特别是，你不会对基础设施进行未记录的更改，从而导致其与这些文件中记录的内容偏离。\n\
    \n本书将介绍一种特定的基础设施即代码变体，称为 GitOps³，在其中：\n\n- 代码和配置文件是（主要是）声明式的\n  - 换句话说，它们倾向于指定系统的期望状态，而不是实现该状态的一系列步骤。\n\
    \n- 这些文件存储在版本控制**中\n  - 这种方法的支持者大多数使用 git 作为他们的版本控制软件，这就是为什么它被称为 \"GitOps\"。\n\
    \n- 拉取请求（Pull requests）是变更管理系统\n  - 换句话说，拉取请求审查过程决定了你是否有足够的权限、甚至是审核，或者是否获得了相关维护者的正确等待。\n\
    \n## DevOps\n\nNixOS 还体现了 DevOps 原则，即打破软件开发人员（\"Dev”）与运维人员（\"Ops”）之间的边界。具体而言，NixOS\
    \ 在这方面比大多数其他工具更进一步，它通过 NixOS 选项系统统一了软件配置和系统配置。这些 NixOS 选项大致分为三类：\n\n- 系统配置\n \
    \ - 这些是主要是运维工程师感兴趣的选项，例如：\n  - 日志轮转策略\n  - 内核启动参数\n  - 磁盘加密设置\n\n- 混合系统/软件选项\n\
    \  - 这些是位于 Dev 和 Ops 之间灰色地带的选项，例如：\n  - 服务重启策略\n  - 网络\n  - 凭据/密钥管理\n\n- 软件配置\n\
    \  - 这些主要是软件工程师感兴趣的选项，例如：\n  - 补丁\n  - 命令行参数\n  - 环境变量\n\n在极端情况下，你甚至可以在 Nix 内部嵌入-Nix\
    \ 代码并进行“纯软件开发”。换句话说，你可以在 NixOS 文件中编写编写在另一种语言内部的内联代码。我将在稍后的“我们的第一个 Web 服务器”章节中包含这方面的例子。\n\
    \n² https://en.wikipedia.org/wiki/Infrastructure_as_code\n³ https://about.gitlab.com/topics/gitops/\n\
    ⁴ https://en.wikipedia.org/wiki/DevOps\n\n## 架构\n\n一个以 NixOS 为中心的架构通常具有以下关键基础设施：\n\
    \n- 版本控制\n  - 如果你打算使用 GitOps，那么你最好学会 git！具体地说，你可能会使用像 GitHub 或 GitLab 这样的 git\
    \ 托管平台，它们支持拉取请求和持续集成。\n  - 大多数公司都使用版本控制，因此这并不是一个令人意外的要求。\n\n- 产品服务器\n  - 这些是实际托管你产品服务的\
    \ NixOS 服务器。\n\n- 中央构建服务器（“中心” hub）\n  - 该服务器启动持续集成所需的构建，构建被委托给构建器（builders）。\n\
    \n- 每个平台的构建器\n  - 这些构建器执行实际的 Nix 构建。然而，请记住，集成测试也将是 Nix 构建，因此这些构建器也会运行集成测试。\n \
    \ - 这些构建器将有两种类型：\n  - 用于中心的（“辐辐” spokes）构建器\n  - 开发者使用的构建器\n\n- 缓存\n  - 在较简单的设置中，“中心”可以兼任缓存，但随着规模的扩大，你可能希望将构建产物上传到专用缓存中。\n\
    \n> https://github.com/\n\n## 整体视图\n\n- 一或多个“工具”服务器\n  - “工具”服务器是一个 NixOS 服务器，你可以用它托管\
    \ IT 基础设施和各种支持开发者的杂用服务（例如：网页、聊天机器人）。\n\n  这台服务器的作用类似于其他软件架构中的容器引擎或虚拟机监视器，不同在于我们并不一定使用虚拟机或容器：许多事物将作为\
    \ NixOS 服务器在宿主机上原生运行。当然，你也可以在这台机器上除了运行其他事物之外运行容器引擎或监视器。\n\n> https://github.com/\n\
    \n“工具”服务器是一个 NixOS 服务器，你可以用它托管 IT 基础设施和各种支持开发者的杂用服务（例如：网页、聊天机器人）。\n\n  这台服务器的作用类似于其他软件架构中的容器引擎或虚拟机监视器，不同在于我们并不一定使用虚拟机或容器：许多事物将作为\
