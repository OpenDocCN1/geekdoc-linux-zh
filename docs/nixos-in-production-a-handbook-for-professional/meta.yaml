  - "[PAGE 30]\n\nOur first web server\n\n27\n\n![](img/c489b7e442a2ecbe2438de51de0c6a09_30_0.png)\n\
    \nEach time you click the + button it will will add a TODO list item consisting\
    \ of:\n\n+   - A text entry field to record the TODO item\n- A button to delete\
    \ the TODO item\n\n| | Buy eggs |\n|---||\n| | Walk the dog |\n| | Pick the prescription\
    \ |\n\n# Passing through the filesystem\n\nThe previous NixOS configuration requires\
    \ rebuilding and restarting the virtual machine every time we change the web page.\
    \ If you try to change the ../www/index.html file while the virtual machine isn't\
    \ running you will see any changes effect.\n\nHowever, we can pass through our\
    \ local filesystem to the virtual machine so that we can easily test changes.\
    \ To do so, add the following to your configuration:\n\n```\nvirtualisation.sharedDirectories.www\
    \ = {\n  source = \"$WWW\";\n  target = \"/var/www\";\n};\n\n... and change module.nix\
    \ to reference /var/www, like this:\n```\n\n```\nvirtualHosts localhosts \"/\"\
    \ = {\n  index = \"index.html\";\n  root = \"/var/www\";\n};\n```\n\nFinally,\
    \ restart the machine, except with a slightly modified version of our original\
    \ nix run command:\n\n```\n$ WWW=\"$PWD/www\" nix run\n```\n\nNow, we only need\
    \ to refresh the page to view any changes we make to index.html and we no longer\
    \ need to restart the virtual machine.\n\nExercise: Add a \"TODO list\" heading\
    \ (<h1>TODO list</h1>)to the web page and refresh the page to confirm that your\
    \ changes took effect."
