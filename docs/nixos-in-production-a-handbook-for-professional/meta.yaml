    \      private_key = tls_private_key.nixos-in-production.private_key.openssh\n\
    \    }\n    inline = [\":\"] # we're just testing connectivity\n  }\n}\n```\n\n\
    # Modules\n\nOur Terraform module also invokes two other modules (which I'll refer\
    \ to as \"child modules\") and we'll highlight here the module that deploys the\
    \ NixOS configuration:\n\n```\nmodule \"ami\" {\n}\n```\n\nmodule \"nixos\" {\n\
    \  source = \"https://github.com/Gabriella439/terraform-nixos-ng/nixos?ref=d8563d0dcc65b99ff1fab8d69b134ec\"\
