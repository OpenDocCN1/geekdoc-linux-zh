  md: "# Deploying to AWS using Terraform\n\n```\nmodule \"ami\" {\n  source = \"\
    github.Com/Gabriella439/terraform-nixos-ng/ami?ref=d8563d06cc65bc699ffb1fiab8d692b1343ecd97\"\
    \n  release = \"22.11\"\n  region = var.region\n  system = \"x86_64-linux\"\n\
    }\n```\n\nand the second child module deploys our NixOS configuration to our EC2\
    \ instance:\n\n```\nmodule \"nixos\" {\n  source = \"github.Com/Gabriella439/terraform-nixos-ng/nixos?ref=d8563d06cc65bc699ffb1fiab8d692b1343ecd927\"\
    \n  host = \"#root$/aws_instance.todo.public_ip\"\n\n  # Get the NixOS Configuration\
    \ from the nixOSConfigurations.default attribute\n  # of flake.nix file\n  flake\
    \ \".default\"\n\n  # Build our NixOS configuration on the same machine that we're\
    \ deploying to\n  arguments = [ \"--build-host\", \"#root$/aws_instance.todo.public_ip\"\
    \ ]\n\n  ssh_options = \"-o StrictHostKeyChecking=accept -i $[local_sensitive_file.ssh_key_file.filename\"\
    \n\n  depends_on = [ null_resource.wait ]\n}\n```\n\n> In this example we build\
    \ our NixOS configuration on our web server so that this example can be deployed\
    \ without any supporting infrastructure. However, you will typically want to build\
    \ a dedicated builder rather than building on the target server for two reasons:\n\
    \n+   - You can deploy to a smaller/lean server\n  Building a NixOS system typically\
    \ requires more disk space, RAM, and network bandwidth than running/deploying\
    \ the same system. Centralizing this build work onto a larger special-purpose\
    \ builder helps keep other machines lightweight.\n\n- You can lock permissions\
    \ on the target server\n  For example, if we didn't have to build on our web server\
    \ then we wouldn't need to permit outbound connections on that server since it\
    \ no longer need to fetch build-time dependencies.\n\nThe next chapter will cover\
    \ how to provide a dedicated builder for this purpose."
