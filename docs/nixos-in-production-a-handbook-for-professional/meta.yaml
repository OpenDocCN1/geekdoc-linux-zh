    # # 6. NixOS option definitions


    By this point in the book you may have copied and pasted some NixOS code, but
    perhaps you don''t fully understand what is going on, especially if you''re not
    an experienced NixOS user. This chapter will wisely slow down and help you solidify
    your understanding of the NixOS module system so that you can improve your ability
    to read, author, and debug modules.


    Throughout this book I will consistently use the following terminology to avoid
    ambiguity:


    +   - "Option declarations" will refer to the `options` attribute of a NixOS module

    - "Option definitions" will refer to the `config` attribute of a NixOS module


    Along the same lines:


    +   - "Declare an option" will mean to set an attribute nested underneath options

    - "Define an option" will mean to set an attribute nested underneath config


    In this chapter and the next chapter we will focus mostly on option *definitions*
    and later we''ll cover option *declarations* in more detail.


    # # Anatomy of a NixOS module


    In the most general case, a NixOS module has the following "shape":


    ```

    # Module arguments which our system can use to refer to its own configuration

    { config, lib, pkgs, ... };


    # Other modules to import

    imports = [

    ];


    # Options that this module defines

    options = {

    -

    };


    # Options that this module defines

    config = {

    -

    }


    ```'
  - "[PAGE 32]\n\n# NixOS definitions\n\nIn other words, the fully general case a\
    \ NixOS module is a function whose output is an attribute set with three attributes\
    \ named imports, options, and config.\n\n> Nix supports data structures known\
    \ \"attribute sets\" which are analogous to \"maps\" or \"records\" in other programming\
    \ languages.\nTo be precise, Nix uses the following terminology:\n\n+   - an \"\
    attribute set\" is a data structure associating keys with values\n  For example,\
    \ this is a nested attribute set:\n\n```\nbio = { name = \"Alice\"; age = 24;\
    \ }\njob = \"Software engineer\"; }\n```\n\n+   - an \"attribute\" is Nix's name\
    \ for a key or a field of an \"attribute set\"\n  For example, bio, job, name,\
    \ and age are all attributes in the above example.\n\n+   - an \"attribute path\"\
    \ is a chain of one or more attributes separated by dots\n  For example, bio.name\
    \ is an attribute path.\n\nI am explaining all of this because I'll use the terms\
    \ \"attribute set\", \"attribute\", and \"attribute path\" consistently throughout\
    \ the text to match Nix's official terminology (even though no other language\
    \ uses these terms).\n\n# Syntactic sugar\n\nAll elements of a NixOS module are\
    \ optional and NixOS supports \"syntactic sugar\" to simplify several common cases.\
    \ For example, you can omit the module arguments if you don't use them:\n\n```\n\
    imports = {\n}\noptions = {\n}\nconfig = {\n}\n```\n\nYou can also omit any of\
    \ the imports, options, or config attributes, too, like in this module, which\
    \ only imports other modules:"
  - "[PAGE 33]\n\n# NixOS option definitions\n\n```\n{ imports = [\n  ./physical.nix\n\
    \  ./logical.nix\n];\n```\n\nor this config-only module:\n\n```\n{ config = {\n\
    \  services = {\n    apache-kafka.enable = true;\n    zookeeper.enable = true;\n\
    \  }\n}\n}\n```\n\nAdditionally, the NixOS module system provides special support\
    \ for modules which only define options by letting you elite the config attribute\
    \ and promote the options defined within to the \"top level\". As an example,\
    \ we can simplify the previous NixOS module to this:\n\n```\n{ services = {\n\
    \  apache-kafka.enable = true;\n  zookeeper.enable = true;\n}\n```\n\n> You might\
    \ wonder if there be some sort of coding style which specifies whether people\
    \ should include or omit these elements of a NixOS module. For example, perhaps\
    \ you might require that all elements are present, for consistency, even if they\
    \ are unused.\n\nMy coding style for NixOS modules is:\n\n+   * you should permit\
    \ omitting the module arguments\n* you should permit imports, options, or config\
    \ attributes\n* you should avoid cliding the config attribute\n\nIn other words,\
    \ if you do define any options, always nest them underneath the config attribute.\n\
    \n# NixOS modules are not language features\n\nThe Nix programming language does\
    \ not provide any built-in support for NixOS modules. This sometimes confuses\
    \ new people to either the Nix programming language or the NixOS module system."
  - "[PAGE 34]\n\n# NixOS option definitions\n\nThe NixOS module system is a domain-specific\
    \ language implemented within the Nix programming language. Specifically, the\
    \ NixOS module system is (mostly) implemented within the lib/modules.nix file\
    \ included in Nixpkgs¹. If you ever receive a stack trace related to the NixOS\
    \ module system you will see functions from modules.nix up in the stack trace,\
    \ because they are ordinary functions and not language features.\n\nIn fact, a\
    \ NixOS module in isolation is 'inert' from the Nix language's point of view.\
    \ For example, if you save the following NixOS module to a file named example.nix:\n\
    \n```\nconfig = {\n  services openssh.enable = true;\n}\n```\n\nand you evaluate\
    \ that, the result will be the same, without the syntactic sugar:\n\n```\n$ nix\
    \ eval --file /example.nix\nconfig = { services = { openssh = { enable = true;\
    \ }; }; };\n```\n\n> The Nix programming language provides \"syntactic sugar\"\
    \ for nested attributes by chaining them with a dot (). In other words, this Nix\
    \ expression:\n\n```\nconfig = {\n  services.openssh.enable = true;\n}\n```\n\n\
    is the same thing as this Nix expression:\n\n```\nconfig = {\n  services = {\n\
    \    openssh = {\n      enable = true;\n    }\n  }\n}\n```\n\nand they are also\
    \ the same thing as this Nix expression:\n\n```\nconfig { services openssh.enable\
    \ = true; }\n```\n\nNote that this syntactic sugar is a feature of the Nix programming\
    \ language, not the NixOS module system. In other words, this feature works even\
    \ for Nix expressions that are not destined for use as Nix modules.\n\nAlong the\
    \ same lines, following the NixOS module:"
  - "[PAGE 35]\n\n# NixOS option definitions\n\n```\n{ config = {\n  services apache-kafka.enable\
    \ = config.services.zookeeper.enable;\n}\n```\n\nis just a function. If we save\
    \ that example.nix and then evaluate that the interpreter simply say that the\
    \ file evaluates to a \"lambda\" (an anonymous function):\n\n```\nnx eval --file\
    \ ./example.nix\n<LAMBDA>\n```\n\nalthough we can get a more useful result within\
    \ the nix repl by calling our function on a sample argument:\n\n```\nnix-repl\
    \ example = import ./example.nix\nnix-repl input = { config = { services.zookeeper.enable\
    \ = true; }; };\nnix-repl output = example input\nnix-repl :p output\n{ config\
    \ = { services = { apache-kafka = { enable = true; }; }; }\nnix-repl output.config.services.apache-kafka.enable\n\
    true\n```\n\nThis illustrates that our NixOS module really is just a function\
    \ whose input is an attribute set and whose output is also an attribute set. There\
    \ is nothing special about this function other than it happens to be the same\
    \ shape as the NixOS module accepts.\n\n# NixOS\n\nSo if NixOS modules are just\
    \ functions or pure attribute sets, what turns those functions or attribute sets\
    \ into a useful operating system? In other words, what puts the \"NixOS\" in the\
    \ \"NixOS module system\"?\n\nThe answer is that this actually happens in two\
    \ steps:\n\n+   - All NixOS modules your system depends on are combined into a\
    \ single, composite attribute set\nIn other words all the imports, options declarations,\
    \ and config settings are fully resolved, resulting in one giant attribute set.\
    \ The code for combining these modules lives in lib/modules.nix in Nixpkgs.\n\n\
    > https://github.com/NixOS/nixpkgs/blob/22.05/lib/modules.nix"
- md: "<channel|># NixOS option definitions\n\n- The final composite attribute set\
    \ contains a special attribute path which contains the system\n\nSpecifically,\
    \ there will be a `config.system.build.toplevel` attribute path which contains\
    \ a derivation we can use to build a runnable NixOS system. The top-level code\
    \ for assembling an operating system lives in `nixos/modules/system/activation/top-level.nix`\
    \ in Nixpkgs.\n\nThis will probably make sense if we use the NixOS module system\
    \ ourselves to create a placeholder value that will stand in a real operating\
    \ system.\n\nFirst, we'll create our own `top-level.nix` module that will include\
    \ a fake `config.system.toplevel` attribute path that is string instead of a derivation\
    \ for building an operating system:\n\n```nix\n# top-level.nix\n\n{ config, lib,\
    \ ... }:\n\nimports = [ ./other.nix ];\n\noptions = {\n  system.toplevel = lib.mkOption\
    \ {\n    description = \"A fake NixOS, modeled as a string\";\n    type = lib.types.str;\n\
    \  };\n};\n\nconfig = {\n  system.toplevel = \"NixOS version ${config.system.nixos.release}\"\
    ;\n};\n```\n\nThat imports a separate `other.nix` module which we also need to\
    \ create:\n\n```nix\n# other.nix\n\n{ lib, ... }:\n\noptions = {\n  system.nixos.release\
    \ = lib.mkOption {\n    description = \"The NixOS version\";\n    type = lib.types.str;\n\
    \  };\n};\n\nconfig = {\n  system.nixos.release = \"22.05\";\n};\n```\n\nWe can\
    \ then materialize the final composite attribute set like this:\n\n> https://github.com/NixOS/nixpkgs/blob/22.05/nixos/modules/system/activation/top-level.nix\n\
    \nNix option github:NixOS/nixpkgs/22.05\n\n```bash\n$ nix repl github:lib.evalModules\
    \ { modules = [ ./top-level.nix ] }\n\nnix-repl> result = p result.config\nsystem\
    \ = { build = { toplevel = \"Fake NixOS - version 22.05\"; }; nixos = { release\
    \ = \"22.05\"; }; }; }\nnix-repl> result.config.system.build.toplevel\n\"Fake\
    \ NixOS - version 22.05\"\n```\n\nIn other words, `lib.evalModules` is the magic\
    \ function that combines all of our NixOS modules into a composite set.\n\nNixOS\
    \ essentially does the same thing as in the example above, except on a much larger\
    \ scale. Also, in a real NixOS system the final `config.system.build.toplevel`\
    \ attribute stores a buildable derivation instead of a string.\n\n# Recursion\n\
    \nThe NixOS system modules refer to the final composite configuration using the\
    \ `config` argument that is passed into every NixOS module. For example, this\
    \ is how our `top-level.nix` module was able to refer to the `system.nixos.release`\
    \ option that was set in the `other.nix` module.\n\n```nix\n# This represents\
    \ the final composite configuration\n# /\n{ config, lib, ... };\n\nconfig = {\n\
    \  system.build.toplevel = ${config.system.nixos.release};\n  # which we can use\
    \ within our configuration\n  \"Fake NixOS - version 22.05\"\n};\n```\n\nYou're\
    \ not limited to referencing configuration values in other NixOS modules; you\
    \ can even reference configuration values within the same module. In other words,\
    \ NixOS modules support recursion where modules can refer to themselves.\n\nAs\
    \ a concrete example of recursion, we can safely merge the .nix module into the\
    \ top-level.nix module:\n\n> *https://en.wikipedia.org/wiki/Recursion*\n\n# NixOS\
    \ option definitions\n\n```nix\n{ config, lib, ... };\n\noptions = {\n  system.build.toplevel\
    \ = lib.mkOption (\n    description = \"A fake NixOS, modeled as a string\";\n\
    \    type = lib.types.str;\n  );\n\n  system.nixos.release = lib.mkOption (\n\
    \    description = \"The NixOS version\";\n    type = lib.types.str;\n  );\n};\n\
    \nconfig = {\n  system.build.toplevel = \n    \"Fake NixOS - version ${config.system.nixos.release}\"\
    ;\n\n  system.nixos.release = \"22.05\";\n};\n```\n\nand this would still work,\
