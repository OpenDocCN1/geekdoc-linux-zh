  md: '# # 1. Introduction


    This book is a guide to using NixOS in production, where NixOS is an operating
    system built on top of the Nix package manager.


    This guide assumes that you have some familiarity with NixOS, so if you have never
    used NixOS before and you''re looking for a tutorial or introduction this book
    might not be for you. Some chapters may review basic concepts, but in general
    they will not be written for a beginner audience.


    However, this book will appeal to you if you wish to answer the following questions:


    +   * What real-world use cases NixOS address better than the alternatives?

    * What does a mature NixOS enterprise look like?

    * How do I smoothly migrate an organization to adopt NixOS?

    * What potential pitfalls of NixOS should I be mindful to avoid?

    * How can I effectively support and debug NixOS when things go wrong?


    I am writing this book because I cultivated years of professional experience doing
    all of the above, back when no such resource existed. I learned NixOS the hard
    way and I''m writing this book so that you don''t have to make the mistakes I
    did.


    Currently, most educational resources for NixOS (including the NixOS manual) are
    written with desktop users in mind, whereas I view NixOS as far better suited
    as a production operating system. This book attempts to fill that documentation
    gap by catering to professional NixOS users instead of hobbyists.


    Continue reading on if you want to use NixOS "for real" and build a career around
    one of the hottest emerging DevOps technologies. This book will improve your NixOS
    proficiency and outline a path towards using NixOS to improve your organization''s
    operational maturity and reliability.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# 2. What is NixOS for?


    Some NixOS users might try to “convert” others to NixOS using a pitch that goes
    something like this:


    NixOS is a Linux distribution built on top of the Nix package manager. It uses
    declarative configuration and allows reliable system upgrades.

    Source: Wikipedia - NixOS¹


    This sort of feature-oriented description explains what NixOS does, but does not
    quite explain what NixOS is for. What sort of useful things can you do with NixOS?
    When is NixOS the best solution? What types of projects, teams, or organizations
    prefer using NixOS over other the alternatives?


    Come to think of it, what are the alternatives? NixOS is supposed to replace Debian?
    Or Docker? Or Ansible? Or Vagrant? Where does NixOS fit in within the modern software
    landscape?


    In this chapter I''ll help you understand when to recommend NixOS to others and
    (just as important!) when you gently nudge people away from NixOS. Hopefully this
    chapter will improve your overall understanding of NixOS’ “niche”.


    # Desktop vs. Server


    The title of this book might have tipped you off that I will endorse NixOS for
    use as a server operating system rather than a desktop operating system.


    I would not confidently recommend NixOS as a desktop operating system because:


    +   NixOS experts expects to be developers who are more hands-on with their system

    NixOS does not come preinstalled on most computers and the installation guide
    assumes a bit of technical proficiency. For example, NixOS is typically configured
    via text files and upgrades are issued from the command line.


    +   Nixpk doesn''t enjoy mainstream support for desktop-oriented applications

    ... especially games and productivity tools. Nixpk is a fairly large software
    distribution, especially compared to other Linux distributions, but most desktop
    applications use the Nix out-of-the-box.


    +   The NixOS user experience differs from what most desktop users expect

    Most desktop users (especially non-technical users) expect to install packages
    by each other downloading the package from the publisher’s web page or by visiting
    an “app store” of some sort. They don’t expect to modify a text configuration
    file in order to install package.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# What is NixOS?


    However, the above limitations don''t apply using NixOS as a server operating
    system:


    +   - Server are managed by technical users comfortable with the command-line

    Server operating systems are often headless² machines that only support a command-line
    interface. In fact, a typical Ops team would likely frown upon managing a server
    in any other way.


    +   - Nixpkgs provides amazing support for server-oriented software and services

    inx, postgres, redis, ... you name it, Nixpkgs most likely has the service you
    need and it''s a dream to set up.


    +   - End users can easily self-serve if they stray from the beaten path

    Server-oriented software is more likely to be open source than desktop-oriented
    software and therefore easier to package.


    Furthermore, NixOS possesses several unique advantages compared to other server-oriented
    operating systems:


    +   - NixOS can be managed entirely declaratively

    You can manage every single aspect of a NixOS server using a single, uniform,
    declarative option system. This goes hand-in-hand with GitOps³ for managing a
    fleet of machines (which I''ll cover in a future chapter).


    +   - NixOS upgrades are fast, safe and reliable

    grades are atomic, meaning you can''t leave a system in an unrecoverable state
    by canceling the upgrade midway (e.g. Ctrl-C or loss of power). You can also build
    the system ahead of time if you want to ensure that the upgrade is quick and smooth.


    +   - NixOS systems are lean, lean, lean

    If like Alpine Linux then you love NixOS. NixOS systems tend to be very light
    on disk, memory, and CPU resources because you only pay for what you use. You
    can achieve astonishing small system footprints whether you run services natively
    on the host or inside of containers.


    +   - NixOS systems have better security-related defaults

    You get several security improvements for free or almost free by virtue of using
    NixOS. For example, your system''s footprint is immutable and internal references
    to filepaths or executables are almost always fully qualified.


    > ²https://en.wikipedia.org/wiki/Headless_computer\³https://www.redhat.com/en/topics/devops/what-is-gitops'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# On-premises vs. Software as a service


    "Server operating systems" is still a fairly broad category and we can narrow
    things down further depending on where we deploy the server:


    +   - On-premises ("on-prem" for short)

    - "On-premises" software runs within the end user''s environment. For example,
    if the software product is a server then an on-premises deployment runs within
    the customer''s data center, either as a virtual machine or a physical rack server.

    - Software as a service ("SaaS" for short)

    - The opposite of on-premises is "off-premises" (more commonly known as "software
    as a service"). This means that you centrally host your software, either in your
    data center or in the cloud, and customers interact with the software via a web
    interface or API.


    NixOS is better suited for SaaS than on-premises deployments, because NixOS fares
    worse in restricted network environments where network access is limited or unavailable.


    You can still deploy NixOS for on-premises deployments and I will cover that in
    a later chapter, but you will have a much better time using NixOS for SaaS deployments.


    # Virtualization


    You might be interested in how NixOS fares with respect to virtualization or containers,
    so I''ll break things down into these four use cases:


    *https://blog.risingstack.com/operating-system-containers-vs-application-containers/'
  merge: -1
