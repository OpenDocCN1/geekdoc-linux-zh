    \ the output values the Terraform module declares several resources. For now,\
    \ we'll highlight the resource that provisions the EC2 instance:\n\n# Deploying\
    \ to AWS using Terraform\n\n```\nresource \"aws_security_group\" \"todo\" {\n\
    }\n```\n\n```\nresource \"tls_private_key\" \"nixos-in-production\" {\n}\n```\n\
    \n```\nresource \"local_sensitive_file\" \"ssh_key_file\" {\n}\n```\n\n```\nresource\
    \ \"aws_key_pair\" \"nixos-in-production\" {\n}\n```\n\n```\nresource \"aws_instance\"\
