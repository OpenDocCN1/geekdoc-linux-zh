  mdcn: "\n# NixOS 参数定义\n\n- 最终的复合属性集包含一个包含系统的特殊属性路径\n\n具体而言，将有一个 `config.system.build.toplevel`\
    \ 属性路径，它包含一个我们可以用于构建可运行 NixOS 系统的导出（derivation）。构建操作系统的顶层代码位于 Nixpkgs 中的 `nixos/modules/system/activation/top-level.nix`。\n\
    \n如果我们自己使用 NixOS 模块系统来创建一个占位值，代表真实的操作系统，这可能是有意义的。\n\n首先，我们将创建自己的 `top-level.nix`\
    \ 模块，它将包含一个虚假的 `config.system.toplevel` 属性路径，该路径是一个字符串而不是用于构建操作系统的导出：\n\n```nix\n\
    # top-level.nix\n\n{ config, lib, ... }:\n\nimports = [ ./other.nix ];\n\noptions\
    \ = {\n  system.toplevel = lib.mkOption {\n    description = \"一个虚假的 NixOS，被建模为字符串\"\
    ;\n    type = lib.types.str;\n  };\n};\n\nconfig = {\n  system.toplevel = \"NixOS\
    \ version ${config.system.nixos.release}\";\n};\n```\n\n这导入了另一个单独的 `other.nix`\
    \ 模块，我们也需要创建它：\n\n```nix\n# other.nix\n\n{ lib, ... }:\n\noptions = {\n  system.nixos.release\
    \ = lib.mkOption {\n    description = \"NixOS 版本\";\n    type = lib.types.str;\n\
    \  };\n};\n\nconfig = {\n  system.nixos.release = \"22.05\";\n};\n```\n\n然后我们可以像这样实例化化最终的复合属性集：\n\
    \n> https://github.com/NixOS/nixpkgs/blob/22.05/nixos/modules/system/activation/top-level.nix\n\
    \nNix option github:NixOS/nixpkgs/22.05\n\n```bash\n$ nix repl github:lib.evalModules\
    \ { modules = [ ./top-level.nix ] }\n\nnix-repl> result = p result.config\nsystem\
    \ = { build = { toplevel = \"Fake NixOS - version 22.05\"; }; nixos = { release\
    \ = \"22.05\"; }; }; }\nnix-repl> result.config.system.build.toplevel\n\"Fake\
    \ NixOS - version 22.05\"\n```\n\n换句话说，`lib.evalModules` 是将我们所有的 NixOS 模块组合成复合集的魔法函数。\n\
    \nNixOS 本质上做了与示例相同的事情，只不过规模大得多。此外，在真实的 NixOS 系统中，最终的 `config.system.build.toplevel`\
    \ 属性存储的是可构建的导出，而不是字符串。\n\n# 递归\n\nNixOS 系统模块通过传递到每个 NixOS 模块的 `config` 参数引用最终的复合配置。例如，我们的\
    \ `top-level.nix` 模块能够引用在 `other.nix` 模块中设置 `system.nixos.release` 参数。\n\n```nix\n\
    # 这代表最终的复合配置\n# /\n{ config, lib, ... };\n\nconfig = {\n  system.build.toplevel\
    \ = ${config.system.nixos.release};\n  # 可以在我们的配置中使用它\n  \"Fake NixOS - version\
    \ 22.05\"\n};\n```\n\n你并不限于引用其他 NixOS 模块中的配置值；你甚至可以在同一个模块内引用配置值。换句话说，NixOS 模块支持递归，模块可以引用自身。\n\
    \n作为递归的一个具体示例，我们可以安全地将 .nix 模块合并到 top-level.nix 模块中：\n\n> *https://en.wikipedia.org/wiki/Recursion*\n\
    \n# NixOS 参数定义\n\n```nix\n{ config, lib, ... };\n\noptions = {\n  system.build.toplevel\
    \ = lib.mkOption (\n    description = \"一个虚假的 NixOS，被建模为字符串\";\n    type = lib.types.str;\n\
    \  );\n\n  system.nixos.release = lib.mkOption (\n    description = \"NixOS 版本\"\
    ;\n    type = lib.types.str;\n  );\n};\n\nconfig = {\n  system.build.toplevel\
    \ = \n    \"Fake NixOS - version ${config.system.nixos.release}\";\n\n  system.nixos.release\
    \ = \"22.05\";\n};\n```\n\n尽管这个模块现在引用了它自己的配置值，但这仍然有效。Nix 解释器不会进入无限循环，因为递归是良定义的。\n\
    \n我们可以通过手动模拟 `lib.evalModules` 的工作原理来更好地理解为什么这种递归是良定义的。从概念上说，`lib.evalModules`\
    \ 执行的是：\n\n- 合并所有输入模块\n- 计算此复合模块的不动点*\n\n我们将通过执行与 `lib.evalModules` 相同的步骤来演示这一过程。为了简单起见，我们将代理示例转换为一个简单的\
    \ flake，我们可以在过程中对其进行评估：\n\n> https://en.wikipedia.org/wiki/Fixed_point_(mathematics)\n\
    \n# NixOS 参数定义\n\n```nix\ntopLevel =\n{ config, lib, ... }:\n  imports = [ other\
    \ ];\n  options system.build.toplevel = lib.mkOption {\n    description = \"虚假的\
    \ NixOS，被建模为字符串\"\n    type = lib.types.str;\n  }\n  config.system.build.toplevel\
    \ =\n    \"Fake NixOS - version ${config.system.nixos.release}\";\n};\n```\n\n\
    ```nix\nnixpkgs lib.evalModules { modules = [ topLevel ]; };\n```\n\n你可以像这样评估该块：\n\
    \n```bash\n$ eval ./evalModulesconfig\n{ system = { toplevel = \"Fake NixOS -\
    \ version 22.05\"; }; nixos = { release = \"22.05\"; }; };\n$ eval ./evalModules/config.system.build.toplevel\n\
    \"Fake NixOS - version 22.05\"\n```\n\n`evalModules` 的第一件事是将另一个模块合并到 `topLevel`\
    \ 模块，我们将通过手动执行相同的合并来模拟这一点：\n\n```nix\n{ inputs nixpkgs { url = \"github:NixOS/nixpkgs/22.05\"\
    ; }; };\nlet\ntopLevel =\n{ config, lib, ... }:\n  options system.nixos.release\
    \ = lib.mkOption {\n    description = \"NixOS 版本\";\n    type = lib.types.str;\n\
    \  }\n  options system.build.toplevel = lib.mkOption {\n    description = \"一个虚假的\
    \ NixOS，被建模为字符串\"\n    type = lib.types.str;\n  }\n  config.system.build.toplevel\
    \ =\n    \"Fake NixOS - version ${config.system.nixos.release}\";\nin\nnixpkgs\
    \ lib.evalModules { modules = [ topLevel ]; };\n```\n\n之后，我们通过传递自己的输入计算该模块的不动点，`evalModules`\
    \ 将...\n"
