    # Terraform walkthrough


    The key file in our Terraform project is main.tf containing the Terraform logic
    for how to deploy your TODO list application.


    You can think of a Terraform module as being sort of like a function with side
    effects, meaning:


    +   - The function has inputs

    Terraform calls these input variables.


    +   - The function has outputs

    Terraform calls these output values.


    +   - The function does other things than producing output values

    For example, the function might provide a resource.


    +   - You can invoke another Terraform module like a function call

    in other words, one Terraform module can call another Terraform module by supplying
    the child module with appropriate function arguments.


    Our starting main.tf provides examples of all of the above concepts.


    # Input variables


    For example, the beginning of the module declares one input variable:


    ```

    *https://developer.hashorp.com/terraform/language/values/variables

    *https://developer.hashorp.com/terraform/language/values/outputs

    *https://developer.hashorp.com/terraform/language/resources/syntax

    *https://developer.hashorp.com/terraform/language/modules#calling-a-child-module

    ```'
