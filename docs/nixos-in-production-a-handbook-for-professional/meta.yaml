  md: '# #3. The big picture


    Before diving in further you might want to get some idea of what a “real” NixOS
    software enterprise looks like. Specifically:


    +   * What are the guiding principles for a NixOS-centric software architecture?

    * How does a NixOS-centric architecture differ from other architectures?

    * What would a “NixOS team” need to be prepared to support and maintain?


    Here I’ll do my best to answer those questions so that you can get a better idea
    of what you would be signing up for.


    # # The Zen of NixOS


    I like to use the term “master cue” to denote an overarching sign that indicates
    that you’re doing things right. This master cue might not tell you *how* to do
    things right, but it can still provide a high-level indicator of whether you are
    on the right track


    The master cue for NixOS is very similar to the master cue for the Nix ecosystem,
    which is this:


    > Every common build/test/deploy-related activity should be possible with at most
    one command using Nix’s command line interface.


    I say *at most one command* because some activities (like continuous deployment)
    should ideally require no intervention at all. However, activities that require
    human intervention should in principle compressible into a single Nix command.


    I can explain this by providing an example of a development workflow that *disregards*
    this master cue:


    Suppose you want to test your local project’s changes within the context of larger
    system at work (i.e. an integration test¹). Your organization’s process for testing
    your code might hypothetically look like this:


    +   * Create and publish a branch in version control regulating your changes

    * Manually trigger some workflow to build a software artifact containing your
    changes

    * Update some configuration file to reference the newly-built software artifact

    * Run the appropriate integration test


    Now if I tell you that the entire integration testing process from start to finish
    could be:


    ¹https://en.wikipedia.org/wiki/Integration_testing'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# The big picture


    +   - Run nix flake check


    In other words:


    +   - There would be no need to create or publish your branch

    You could test uncommitted changes straight from your local project checkout.


    +   - There would be no multi-step publication process

    All of the intermediate build products and internal references would be handled
    transparently by the Nix build tool.


    +   - The test itself would be managed by the Nix build tool

    In other words, Nix would treat your integration test no differently than any
    other build product. Tests and their outputs are build products.


    +   - There would be no need to select the appropriate tests to rerun

    The Nix build tool would automatically verify which tests depended on your project
    and rerun those. Other test runs and results would be cached if their dependency
    tree did not include your changes.


    Some of these potential improvements are not specific to the Nix ecosystem. After
    all, you could attempt to create a script that automates the most painstaking
    multi-step process. However, you would likely need to reinvent large portions
    of the Nix ecosystem for this automation to be sufficiently robust and efficient.
    For example:


    +   - Do you maintain a file for storing intermediate build products?

    You''re likely implementing your own version of the Nix store and caching server


    +   - Do you generate unique labels for build products to isolate parallel workflows?

    In the best case scenario, you build products by a hash of their dependencies
    and you''ve reinvented the Nix store''s hashing scheme. In the worst case scenario
    you''re doing less accurate (e.g. using timestamps instead of hashes).


    +   - Do you have a custom script that updates references to these build products?

    This would be reinventing Nix''s language support for automatically updating dependency
    references.


    +   - Do you need to isolate your integration tests or run them in parallel?

    You would likely reimplement the NixOS test framework.


    You can save yourself a lot of headaches by taking time to learn and use the Nix
    ecosystem idiomatically as possible instead of learning these lessons the hard
    way.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# GitOps


    NixOS exemplifies the Infrastructure as Code (IaC)² paradigm, meaning that every
    aspect of your organization (including hardware/systems/software) is stored in
    code or configuration files that are the source of truth for everything is built.
    In particular, you don''t make undocumented changes to your infrastructure that
    cause it to diverge from what is recorded within those files.

    This book will expose a specific flavor of Infrastructure of Code known as GitOps³
    where:


    +   - The code and configuration files are (primarily) declarative

    - In other words, they tend to specify the desired state of the system rather
    than a sequence of steps to get there.


    +   - These files are stored in version control

    - Proponents of this approach most use git as their version control software,
    which is why it''s called "GitOps".


    +   - Pull requests are the change management system

    In other words, the pull request review process determines whether you have sufficient
    privileges, even vetting, or the correct awaits from relevant maintainers.


    # DevOps


    NixOS also exemplifies the DevOps principle of breaking down boundaries between
    software developers ("Dev") and operations ("Ops\ Specifically, NixOS goes further
    in this regard than most other tools by unifying software configuration and system
    configuration underneath the NixOS option system. These NixOS options fall into
    roughly three categories:


    +   - Systems configuration

    These are options that are mostly interesting to operations engineers, such as:

    - log rotation policies

    - kernel boot parameters

    - disk encryption settings


    +   - Hybrid systems/software options

    These are options that lie in the grey area between Dev and Ops, such as:

    - Service restart policies

    - Networking

    - Credentials/secrets management


    https://en.wikipedia.org/wiki/Infrastructure_as_code

    ³https://about.gitlab.com/topics/gitops/

    ⁴https://en.wikipedia.org/wiki/DevOps'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The big picture


    +   * Software configuration


    These are options that are mostly interesting to software engineers, such as:

    - Patches

    - Command-line arguments

    - Environment variables


    In extreme cases, you can even embed-Nix code inside of Nix and do "pure software
    development". In other words, you can author inline code written within another
    language inside of a NixOS configuration file. I''ll include one example of this
    later on the "Our first web server" chapter.


    # Architecture


    A NixOS-centric architecture tends to have the following key pieces of infrastructure:


    +   * Version control

    If you''re going to use GitOps then you had better git! More specifically, you''ll
    likely use a git hosting provider like GitHub or GitLab which supports pull requests
    and continuous integration.

    Most companies these use version control, so this is not a surprising requirement.


    +   * Product servers

    These are the NixOS servers that actually host your product-related services.


    +   * A central build server (the "hub")

    This server initiates builds for continuous integration, which are delegated to
    builders.


    +   * Builders for each platform

    These builders perform the actual Nix builds. However, remember that integration
    tests will be Nix builds, too, so these builders also run integration tests.

    These builders will come in two flavors:

    - Builders for the hub ("spokes")

    - Builders for developers to use


    +   * A cache

    In simpler setups the "hub" can double as a cache, but as you grow you will likely
    want to upload build products to a dedicated cache.


    > https://github.com/\https://about.gitlab.com/'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# The big picture


    +   - One or more "utility" servers


    A "utility" server is a NixOS server that you can use to host IT infrastructure
    and miscellaneous utility services to support developers (e.g. web pages, chat
    bots).


    This server will play a role analogous to a container engine or virtual machine
    hypervisor in other software architectures, except that we won''t necessarily
    be using virtual machines or containers: many things will run natively on the
    host as NixOS servers. Of course, you can also use this machine to run a container
    engine or hypervisor in addition to running things on the host.


    > A "utility" server should not be part of your continuous integration or continuous
    deployment pipeline. You should think of such a server as a "junk drawer" for
    stuff that does not belong in CI/CD.


    Moreover, you will either need a cloud platform (e.g. AWS) or a data center for
    hosting these machines. In this book we''ll primarily focus on hosting infrastructure
    on AWS.


    These are not the only components you will need to build your product, but these
    should be the only components necessary to support DevOps workflows, including
    continuous integration and continuous deployment.


    Notably absent from the above list:


    +   - Container-specific infrastructure


    A NixOS-centric architecture already mitigates some of the need for containerizing
    services, but the architecture doesn''t change even if you do containers, because
    containers can be built by Nixpkgs, distributed via the cache, and declaratively
    deployed to any NixOS machine.


    +   - Programming-language-specific infrastructure


    If Nixpkgs supports a given language then we require no additional infrastructure
    to support building and deploying that language. However, we might still host
    language-specific amenities on our utility server, as generated documentation.


    +   - Continuous-deployment services


    NixOS provides out-of-the-box services that we can use for continuous deployment,
    which we will cover in a later chapter.


    +   - Cloud/Virtual development environments


