  md: 'What is NixOS for?


    # The killer app for NixOS


    Based on the above guidelines, we can outline the ideal use case for NixOS:


    +   - NixOS shines as a server operating system for SaaS deployments

    - Services should preferably be statically defined via the NixOS configuration

    - NixOS can containerize these services, but it''s simpler to skip the containers


    If your deployment model matches that then NixOS is not only a safe choice, but
    the best choice! You will be in a great company if you use NixOS in this way.


    You can still use NixOS in other capacities, but the further you depart from the
    above “killer app” the more you will need to roll up your sleeves.


    # Profile of a NixOS adopter


    NixOS is a DevOps tool, meaning that NixOS blurs the boundary between software
    development and operations.


    The reason why NixOS fits the DevOps space is so well because NixOS unifies all
    aspects of managing a system through the NixOS options interface. In other words,
    you can use NixOS options to configure operational details (e.g. RAID, encryption,
    boot loaders) and also software development details (e.g. dependency versions,
    patches, and even small amounts of inline code).


    This means that a DevOps engineer or DevOps team is best situated to introduce
    NixOS within an engineering organization.


    > DevOps is more of a set of cultural practices than a team, but some organizations
    explicitly create a DevOps team or hire engineers for their DevOps expertise in
    order to support tools (like NixOS) that enable those cultural practices.


    # What does NixOS replace?


    If NixOS is a server operating system, does that mean that NixOS competes with
    other operating systems like Ubuntu Server, Debian or Fedora? Not exactly.


    NixOS competes more with the Docker ecosystem, meaning a lot of the value that
    NixOS adds over Docker:


    +   - NixOS supports declarative system specification

    ... analogous to docker compose.


    https://www.atlassian.com/devops'
  merge: -1
