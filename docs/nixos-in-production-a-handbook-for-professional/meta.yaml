    \ lib.mkForce as much as possible to protect against this common mistake.\n\n\
    The default priority is 100 and lower numeric values actually represent higher\
    \ priority. In other words, an option definition with a priority of 50 takes precedence\
    \ over an option definition with a priority of 100.\n\nYes, the NixOS module system\
    \ uses lower numbers to indicate higher priorities, in practice you will rarely\
    \ use explicit priorities. Instead, people need to use utilities like lib.mkForce\
    \ or lib.mkDefault to select the appropriate priority for you.\n\nIn extreme cases\
    \ you might need to specify an explicit priority. The most common example is when\
    \ one of your dependencies already define an option using lib.mkForce and you\
    \ need to override that. In that scenario you could use lib.mkOverride 49, which\
    \ would take precedence over lib.mkForce\n\n```\n{ lib, ... };\n\nconfig = {\n\
    \  services nginx enable = true;\n\n  systemd.services nginx.serviceConfig RestartSec\
    \ = lib mkMerge {\n  (lib.mkForce \"3s\")\n  (lib.mkOverride 49 \"3s\")\n}\n```\n\
