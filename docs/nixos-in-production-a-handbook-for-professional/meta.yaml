  md: "# Deploying AWS using Terraform\n\nin\n\n```\n{ output = aws_instance_todo.public_dns;\
    \ }\n```\n\nOur Terraform deployment declares resources, the first of which declares\
    \ a security group (basically like a firewall):\n\n```\nresource \"aws_security_group\"\
    \ \"todo\" {\n  # The \"nixos\" Terraform module requires SSH access to the target\
    \ machine\n  # our desired NixOS configuration\n  ingress {\n    from_port = 22\n\
    \    to_port = 22\n    protocol = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n\
    \  }\n\n  # We will be deploy our NixOS configuration on the target machine, so\
    \ we\n  # permit all outbound connections so that the build can download any missing\n\
    \  # dependencies\n  egress {\n    from_port = 0\n    to_port = -1\n    protocol\
    \ = \"-\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n  }\n\n  # We need to open port\
    \ 80 so that we can view our TODO list page.\n  ingress {\n    from_port = 80\n\
    \    to_port = 80\n    protocol = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n\
    \  }\n}\n```\n\nThe next three resources generate an SSH key pair that we'll use\
    \ to manage the machine:\n\n+   * Generate an SSH key pair as strings stored in\
    \ Terraform statenresource \"tls_private_key\" \"nixos-in-production\" {\n  algorithm\
    \ = \"ED25519\"\n}\n\n* Synchronize the SSH private key to a local file that the\
    \ \"nixos\" module can\n  use\nresource \"local_sensitive_file\" \"ssh_key_file\"\
    \ {\n  filename = \"$path/module/id_ed25519\"\n  content = tls_private_key.nixos-in-production.private_key.openssh\n\
    }\n\n* Mirror the SSH public key to EC2 so that we can later install the public\
    \ key\n  as an authorized key for our server\nresource \"aws_key_pair\" \"nixos-in-production\"\
    \ {\n  public_key = tls_private_key.nixos-in-production.public_key.openssh\n}"
