- md: "# Setting up your development environment\n\n$ nix run\n\n```\n<<< Welcome\
    \ to NixOS 22.11.20220918.fi4a9e2 (aarch64) - ttyAMA0 >>>\n```\n\nRun 'nixos-help'\
    \ for the NixOS manual.\n\nnixos login:\n\nYou can log into the virtual machine\
    \ as the root user and an empty password. After successfully logging in, shut\
    \ down the virtual machine by typing Ctrl-a + c to open the qemu prompt and then\
    \ type quit followed by Enter to exit.\n\nIf you successfully log into the virtual\
    \ machine you're ready to follow along with the remaining examples throughout\
    \ this book. If you see an example in this book that begins with this line:\n\n\
    ```\n# module.nix\n```\n\nthen that means I want you to save that example code\
    \ to the module.nix file and restart the virtual machine by running nix run.\n\
    \nFor example, let's test that now; save the following file to module.nix:\n\n\
    ```\n# module.nix\n```\n\n```\n{ users.root.initialPassword = \"\";\n\n  services.postgresql.enable\
    \ = true;\n}\n```\n\nthen start the virtual machine and log into the machine.\
    \ As the root user, run:\n\n```\n[root@nixos:~]# sudo --user postgres psql\npsql\
    \ (14.)\nType \"help\" for help.\n\npostgres=#\n```\n\nand now you have command-line\
    \ access to a postgres database.\n\nThe run script in the flake.nix file ensures\
    \ the virtual machine does not persist state between runs so that you can safely\
    \ experiment inside of the virtual machine without breaking upcoming examples.\n\
    \n# 5. Our first web server\n\nNow that we can build and run a local NixOS virtual\
    \ machine we can create our first toy web server. We will use this server throughout\
    \ this book as the running example which will start off simple and slowly grow\
    \ in maturity as we increase the realism of the example and build out the supporting\
    \ infrastructure.\n\n# Hello, world!\n\nWe will begin from the template project\
    \ from \"Setting up your development environment\". You can either begin from\
    \ the previous chapter by running the following command (if you haven't done so\
    \ already):\n\n```\n$ nix flake init --template github:Gabriella439/nix-in-production*setup\n\
    ```\n\nor if you want to skip straight to the final result of this chapter you\
    \ can run:\n\n```\n$ nix flake init --template github:Gabriella439/nix-in-production*server\n\
    ```\n\nLet's modify module.nix to specify a machine that serves a simple static\
    \ \"Hello, world!\" on http://localhost:\n\n```\n* module.nix\n\n{\n  pkgs, ...\
    \ = = ];\n\n  services.nginx = {\n    enable = true;\n\n    virtualHosts.localhost.locations.\"\
    /\" = {\n      index = \"index.html\";\n\n      root = pkgs.writeTextDir \"index.html\"\
    \ ''\n<html>\n<body>\nHello, world!\n</body>\n</html>''\n      '';\n    };\n \
    \ };\n\n  networking.firewall.allowedTCPPorts = [ 80 ];\n\n  virtualisation.forwardPorts\
    \ = [\n    (from = \"host\"; guest.port = 80; host.port = 8080; )\n  ];\n}\n```\n\
    \n## Our first web server\n\n```\n{\n  users.root.initialPassword = \"\";\n  system.stateVersion\
    \ = \"22.11\";\n}\n```\n\nYou can read the above code as saying:\n\n- * Enable\
    \ nginx which currently only listens on localhost\nIn other words, nginx will\
    \ only respond to requests addressed to localhost (e.g. 127.0.0.1).\n- * Serve\
    \ a static web page\n... which is a bare-bones \"Hello, world!\" HTML page.\n\
    - * Open port 80 on the virtual machine's firewall\n... since that is the port\
    \ that nginx will listen on by default until we create a certificate and enable\
    \ TLS.\n- * Forward port 8080 on the \"host\" to port 80 on the \"guest\"\nThe\
    \ \"guest\" is the virtual machine and the \"host\" is your development machine.\n\
    - * Allow the root user to log in with an empty password\n- * Set the system's\
    \ \"state version\" to 22.11\n\n> You always want to specify a state version graduate\
    \ that matches the starting version of that machine and never change it afterwards.\
    \ In other words, even if you upgrade Nixpkgs later on you would keep the state\
    \ version the same. nixpkgs uses the state version to migrate your NixOS system\
    \ because in order to migrate your machine needs to know where your started from.\n\
    \nTwo mistakes NixOS users sometimes make:\n\n- * updating the state version when\
    \ they upgrade Nixpkgs\nThis will cause the machine to never migrated because\
    \ Nixpkgs will think that the machine was never deployed to an older version.\n\
    - * specifying a uniform state version across a fleet of NixOS machines\nFor example,\
    \ you might have one NixOS machine in your data center that was first deployed\
    \ using Nixpkgs 21.11 and another machine in your data center that was first deployed\
    \ using Nixpkgs 22.05. If you try to change their state versions to match one\
    \ or the other might not upgrade correctly.\n\nIf you deploy that using nix run\
    \ you can open the web page in your browser by visiting http://localhost:8080\
    \ which should display the following contents:\n\nHello, world!\n\n> In general\
