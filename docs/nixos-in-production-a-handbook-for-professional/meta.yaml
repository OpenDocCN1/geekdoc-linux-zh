    \ = [ aws_security_group.todo.name ]\n  key_name = aws_key_pair.nixos-in-production.key_name\n\
    }\n```\n\n```\nroot_block_device = {\n  volume_size = ?\n}\n```\n\n```\nresource\
    \ \"null_resource\" \"wait\" {\n}\n```\n\nand you can think of resources sort\
    \ of like let bindings that provision infrastructure as a side effect:\n\n{ region\
    \ :\n\n```\nlet\n-;\n```\n\n```\naws_security_group.todo = aws_security_group\
    \ { _ };\n```\n\n```\ntls_private_key.nixos-in-production = tls_private_key {\
    \ _ };\n```\n\n```\nlocal_sensitive_file.ssh_key_file = ssh_key_file { _ };\n\
    ```\n\n```\naws_key_pair.nixos-in-production = aws_key_pair { _ };\n```\n\n```\n\
    aws_instance.todo = aws_instance {\n  ami = module.ami.ami;\n  instance_type =\
    \ \"t3.micro\";\n  security_groups = [ aws_security_group.todo todo name ];\n\
    \  key_name = aws_key_pair.nixos-in-production.key_name;\n  root_block_device\
    \ = { volume_size = ? }\n}\n```\n\n```\nnull_resource.wait = null_resource { _\
    \ };\n```\n\n# Deploying AWS using Terraform\n\nin\n\n```\n{ output = aws_instance_todo.public_dns;\
    \ }\n```\n\nOur Terraform deployment declares resources, the first of which declares\
    \ a security group (basically like a firewall):\n\n```\nresource \"aws_security_group\"\
    \ \"todo\" {\n  # The \"nixos\" Terraform module requires SSH access to the target\
    \ machine\n  # our desired NixOS configuration\n  ingress {\n    from_port = 22\n\
    \    to_port = 22\n    protocol = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n\
    \  }\n\n  # We will be deploy our NixOS configuration on the target machine, so\n\
