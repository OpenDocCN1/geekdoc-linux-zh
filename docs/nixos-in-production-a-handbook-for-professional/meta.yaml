  - '[PAGE 4]


    # # 1. Introduction


    This book is a guide to using NixOS in production, where NixOS is an operating
    system built on top of the Nix package manager.


    This guide assumes that you have some familiarity with NixOS, so if you have never
    used NixOS before and you''re looking for a tutorial or introduction this book
    might not be for you. Some chapters may review basic concepts, but in general
    they will not be written for a beginner audience.


    However, this book will appeal to you if you wish to answer the following questions:


    +   * What real-world use cases NixOS address better than the alternatives?

    * What does a mature NixOS enterprise look like?

    * How do I smoothly migrate an organization to adopt NixOS?

    * What potential pitfalls of NixOS should I be mindful to avoid?

    * How can I effectively support and debug NixOS when things go wrong?


    I am writing this book because I cultivated years of professional experience doing
    all of the above, back when no such resource existed. I learned NixOS the hard
    way and I''m writing this book so that you don''t have to make the mistakes I
    did.


    Currently, most educational resources for NixOS (including the NixOS manual) are
    written with desktop users in mind, whereas I view NixOS as far better suited
    as a production operating system. This book attempts to fill that documentation
    gap by catering to professional NixOS users instead of hobbyists.


    Continue reading on if you want to use NixOS "for real" and build a career around
    one of the hottest emerging DevOps technologies. This book will improve your NixOS
    proficiency and outline a path towards using NixOS to improve your organization''s
    operational maturity and reliability.'
  - '[PAGE 5]


    # 2. What is NixOS for?


    Some NixOS users might try to “convert” others to NixOS using a pitch that goes
    something like this:


    NixOS is a Linux distribution built on top of the Nix package manager. It uses
    declarative configuration and allows reliable system upgrades.

    Source: Wikipedia - NixOS¹


    This sort of feature-oriented description explains what NixOS does, but does not
    quite explain what NixOS is for. What sort of useful things can you do with NixOS?
    When is NixOS the best solution? What types of projects, teams, or organizations
    prefer using NixOS over other the alternatives?


    Come to think of it, what are the alternatives? NixOS is supposed to replace Debian?
    Or Docker? Or Ansible? Or Vagrant? Where does NixOS fit in within the modern software
    landscape?


    In this chapter I''ll help you understand when to recommend NixOS to others and
    (just as important!) when you gently nudge people away from NixOS. Hopefully this
    chapter will improve your overall understanding of NixOS’ “niche”.


    # Desktop vs. Server


    The title of this book might have tipped you off that I will endorse NixOS for
    use as a server operating system rather than a desktop operating system.


    I would not confidently recommend NixOS as a desktop operating system because:


    +   NixOS experts expects to be developers who are more hands-on with their system

    NixOS does not come preinstalled on most computers and the installation guide
    assumes a bit of technical proficiency. For example, NixOS is typically configured
    via text files and upgrades are issued from the command line.


    +   Nixpk doesn''t enjoy mainstream support for desktop-oriented applications

    ... especially games and productivity tools. Nixpk is a fairly large software
    distribution, especially compared to other Linux distributions, but most desktop
    applications use the Nix out-of-the-box.


    +   The NixOS user experience differs from what most desktop users expect

    Most desktop users (especially non-technical users) expect to install packages
    by each other downloading the package from the publisher’s web page or by visiting
    an “app store” of some sort. They don’t expect to modify a text configuration
    file in order to install package.'
  - '[PAGE 6]


    # What is NixOS?


    However, the above limitations don''t apply using NixOS as a server operating
    system:


    +   - Server are managed by technical users comfortable with the command-line

    Server operating systems are often headless² machines that only support a command-line
    interface. In fact, a typical Ops team would likely frown upon managing a server
    in any other way.


    +   - Nixpkgs provides amazing support for server-oriented software and services

    inx, postgres, redis, ... you name it, Nixpkgs most likely has the service you
    need and it''s a dream to set up.


    +   - End users can easily self-serve if they stray from the beaten path

    Server-oriented software is more likely to be open source than desktop-oriented
    software and therefore easier to package.


    Furthermore, NixOS possesses several unique advantages compared to other server-oriented
    operating systems:


    +   - NixOS can be managed entirely declaratively

    You can manage every single aspect of a NixOS server using a single, uniform,
    declarative option system. This goes hand-in-hand with GitOps³ for managing a
    fleet of machines (which I''ll cover in a future chapter).


    +   - NixOS upgrades are fast, safe and reliable

    grades are atomic, meaning you can''t leave a system in an unrecoverable state
    by canceling the upgrade midway (e.g. Ctrl-C or loss of power). You can also build
    the system ahead of time if you want to ensure that the upgrade is quick and smooth.


    +   - NixOS systems are lean, lean, lean

    If like Alpine Linux then you love NixOS. NixOS systems tend to be very light
    on disk, memory, and CPU resources because you only pay for what you use. You
    can achieve astonishing small system footprints whether you run services natively
    on the host or inside of containers.


    +   - NixOS systems have better security-related defaults

    You get several security improvements for free or almost free by virtue of using
    NixOS. For example, your system''s footprint is immutable and internal references
    to filepaths or executables are almost always fully qualified.


    > ²https://en.wikipedia.org/wiki/Headless_computer\³https://www.redhat.com/en/topics/devops/what-is-gitops'
  - '[PAGE 7]


    # On-premises vs. Software as a service


    "Server operating systems" is still a fairly broad category and we can narrow
    things down further depending on where we deploy the server:


    +   - On-premises ("on-prem" for short)

    - "On-premises" software runs within the end user''s environment. For example,
    if the software product is a server then an on-premises deployment runs within
    the customer''s data center, either as a virtual machine or a physical rack server.

    - Software as a service ("SaaS" for short)

    - The opposite of on-premises is "off-premises" (more commonly known as "software
    as a service"). This means that you centrally host your software, either in your
    data center or in the cloud, and customers interact with the software via a web
    interface or API.


    NixOS is better suited for SaaS than on-premises deployments, because NixOS fares
    worse in restricted network environments where network access is limited or unavailable.


    You can still deploy NixOS for on-premises deployments and I will cover that in
    a later chapter, but you will have a much better time using NixOS for SaaS deployments.


    # Virtualization


    You might be interested in how NixOS fares with respect to virtualization or containers,
    so I''ll break things down into these four use cases:


    *https://blog.risingstack.com/operating-system-containers-vs-application-containers/'
- md: "## What is NixOS for?\n\n- Application containers\n  Containers technically\
    \ do not need to run an entire operating system and can instead run a single process\
    \ (e.g. one service). You can do this with Nixpkgs, which provides support for\
    \ building application containers.\n\nSo which use cases are NixOS/Nixpkgs well-suited\
    \ for? If I had to rank these deployment models then my preference (in descending\
    \ order) would be:\n\n- NixOS as a guest operating system\n  Specifically, this\
    \ means that you would run NixOS as a virtual machine on a cloud provider (e.g.-AWS)\
    \ and all of your services run within that NixOS guest machine with no intervening\
    \ containers.\n  I prefer this because this is the least deployment model and\
    \ the lowest maintenance to administer.\n\n- NixOS without virtualization\n  This\
    \ typically entails running NixOS on a physical rack server and you still use\
    \ NixOS to manage all of your services without containers.\n  This can potentially\
    \ be the most cost-effective deployment model if you're willing to manage your\
    \ own hardware (including RAID and backup/restore) or you operate your own data\
    \ center.\n\n- NixOS as a host operating system - Static containers\n  NixOS also\
    \ works well when you want to statically specify a set of containers to run. Not\
    \ only can NixOS run Docker containers or OCI containers, but NixOS also provides\
    \ special support for \"NixOS containers\" (which are systemd-spawn containers\
    \ under the hood) or application containers built by Nixpkgs.\n  I rank this lower\
    \ \"NixOS without virtualization\" because NixOS obviates some (but not all) of\
    \ the reasons for using containers. In other words, once you switch to using NixOS\
    \ you might find that you can get fine without containers or at least use them\
    \ more sparsely.\n\n- NixOS as a host operating system - Dynamic containers\n\
    \  You can also use NixOS to run containers dynamically, but NixOS is not special\
    \ in this regard. At best, NixOS might simplify administering a container orchestration\
    \ service (e.g. kubernetes).\n\n- Application containers sans NixOS\n  This is\
    \ technically a use case for Nixpkgs and not NixOS, but I mention it for completeness.\
    \ Application containers built by Nixpkgs work best if you are trying to introduce\
    \ the Nix ecosystem (but not NixOS) within a legacy environment.\n  However, you\
    \ lose out on the benefits of using NixOS because, you're no longer using NixOS.\n\
    \n## What is NixOS for?\n\n# The killer app for NixOS\n\nBased on the above guidelines,\
    \ we can outline the ideal use case for NixOS:\n\n- NixOS shines as a server operating\
    \ system for SaaS deployments\n- Services should preferably be statically defined\
    \ via the NixOS configuration\n- NixOS can containerize these services, but it's\
    \ simpler to skip the containers\n\nIf your deployment model matches that then\
    \ NixOS is not only a safe choice, but the best choice! You will be in a great\
    \ company if you use NixOS in this way.\n\nYou can still use NixOS in other capacities,\
    \ but the further you depart from the above “killer app” the more you will need\
    \ to roll up your sleeves.\n\n# Profile of a NixOS adopter\n\nNixOS is a DevOps\
    \ tool, meaning that NixOS blurs the boundary between software development and\
    \ operations.\n\nThe reason why NixOS fits the DevOps space is so well because\
    \ NixOS unifies all aspects of managing a system through the NixOS options interface.\
    \ In other words, you can use NixOS options to configure operational details (e.g.\
    \ RAID, encryption, boot loaders) and also software development details (e.g.\
    \ dependency versions, patches, and even small amounts of inline code).\n\nThis\
    \ means that a DevOps engineer or DevOps team is best situated to introduce NixOS\
    \ within an engineering organization.\n\n> DevOps is more of a set of cultural\
    \ practices than a team, but some organizations explicitly create a DevOps team\
    \ or hire engineers for their DevOps expertise in order to support tools (like\
    \ NixOS) that enable those cultural practices.\n\n# What does NixOS replace?\n\
    \nIf NixOS is a server operating system, does that mean that NixOS competes with\
    \ other operating systems like Ubuntu Server, Debian or Fedora? Not exactly.\n\
    \nNixOS competes more with the Docker ecosystem, meaning a lot of the value that\
    \ NixOS adds over Docker:\n\n- NixOS supports declarative system specification\n\
    \  ... analogous to docker compose.\n\nhttps://www.atlassian.com/devops\n\n# What\
    \ is NixOS for?\n\n- NixOS provides better isolation\n  ... analogous to containers.\n\
    - NixOS uses the Nix package manager to declaratively assemble software\n  ...\
    \ analogous to Dockerfiles.\n\nYou can use NixOS in conjunction with Docker containers\
    \ since NixOS supports declaratively launching containers, but you probably want\
    \ to avoid buying further into the broader Docker ecosystem if you use NixOS.\n\
    \n> For those familiar with Gentoo, NixOS is like:\n  ... Thank you to Adam Bell\n\
    \n# 3. The big picture\n\nBefore diving in you might want to get some idea:\n\n\
    - What are the guiding principles of NixOS?\n- How does NixOS-centric architecture\
    \ differ from?\n- What would NixOS need to be prepared for?\n\n# The Zen of NixOS\n\
    \nI like to use the term “master cue” to denote that you're doing right.\n\nThe\
    \ master cue for NixOS is very similar to the Docker ecosystem, which is:\n> Every\
    \ deployment-related activity should be possible with at most one command.\n\n\
    I say *at most one command* because activities should ideally require no human\
    \ intervention.\n\nSuppose you want to test your local project changes (integration\
    \ test¹). Your organization's process might look like:\n\n  - Create and publish\
    \ a branch in version control\n  - Manually trigger some workflow to build software\
    \ artifact\n  - Update some configuration file to reference the newly-built artifact\n\
    \  - Run the integration test\n\n¹https://en.wikipedia.org/wiki/Integration_testing\n\
    \n# The big picture\n\n- Run flake check\n\nIn other words:\n- There would be\
    \ no need to create or publish your branch\n  You could test uncommitted changes\
    \ straight from your local checkout.\n- There would be no multi-step process\n\
    \  All of the intermediate build products and internal references would be handled\
    \ transparently by the Nix build tool.\n- The test itself would be managed by\
    \ the Nix build tool\n  In other words, Nix would treat your integration test\
    \ no differently than any other build product. Tests and their outputs are build\
    \ products.\n- There would be no need to select the appropriate tests to rerun\n\
    \  The Nix build tool would automatically verify which tests depended on your\
    \ project and rerun those. Other test runs and results would be cached if their\
    \ dependency tree did not include your changes.\n\nSome of these potential improvements\
    \ are not specific to the Nix ecosystem. After all, you could attempt to create\
    \ a script that automates the most painstaking multi-step process. However, you\
    \ would likely need to reinvent large portions of the ecosystem for this automation\
    \ to be sufficiently robust and efficient. For example:\n\n- Do you maintain a\
    \ file for storing intermediate build products?\n  You're likely implementing\
    \ your own version of the Nix store and caching server.\n- Do you generate unique\
    \ labels for build products to isolate parallel workflows?\n  In the best case,\
    \ you build products by a hash of their dependencies and you've reinvented the\
    \ Nix store's hashing scheme. In the worst case scenario you're doing less accurate\
    \ (e.g. using timestamps instead of hashes).\n- Do you have a custom script that\
    \ updates references to these build products?\n  This would be reinventing Nix's\
    \ language support for automatically updating dependency references.\n- Do you\
    \ need to isolate your integration tests or run them in parallel?\n  You would\
    \ likely reimplement the NixOS test framework.\n\nYou can save yourself a lot\
    \ of headaches by taking time to learn and use the Nix ecosystem idiomatically\
    \ as possible instead of learning these lessons the hard way."
  mdcn: "\n## NixOS 是什么用的？\n\n- 应用容器\n  容器在技术上并不需要运行整个操作系统，而是运行单个进程（例如一个服务）。你可以通过\
    \ Nixpkgs 实现这一点，它提供了对构建应用容器的支持。\n\n那么 NixOS/Nixpkgs 适用于哪些用例呢？如果让我对这些部署模型进行排序，我的偏好（按降序排列）是：\n\
    \n- NixOS 作为客户操作系统\n  具体来说，这意味着你将在云提供商（例如 AWS）上以虚拟机的形式运行 NixOS，你所有的服务都运行在该 NixOS\
    \ 客户机中，中间没有额外的容器层。\n  我更倾向于这种方式，因为它的部署模型最简单，维护成本也最低。\n\n- 不使用虚拟化的 NixOS\n  这通常意味着在物理机架服务器上运行\
    \ NixOS，你仍然使用 NixOS 来管理所有的服务，而不使用容器。\n  如果你愿意管理自己的硬件（包括 RAID 和备份/恢复）或者运营自己的数据中心，那么这可能可能是最具成本效益的部署模型。\n\
    \n- NixOS 作为宿主机操作系统 - 静态容器\n  当你想要静态指定一组要运行的容器时，NixOS 同样运行良好。NixOS 不仅可以运行 Docker\
    \ 容器或 OCI 容器，NixOS 还为“NixOS 容器”（底层是 systemd-spawn 容器）或由 Nixpkgs 构建的应用容器提供了特殊支持。\n\
    \  我将它的排在“不使用虚拟化的 NixOS”之后，因为 NixOS 消除了部分（并非全部）使用容器的原因。换句话说，一旦你切换到使用 NixOS，你可能会发现不需要容器也可以很好，或者至少更少地使用它们。\n\
    \n- NixOS 作为宿主机操作系统 - 动态容器\n  你也可以使用 NixOS 动态运行容器，但 NixOS 在这方面并不特殊。最好的情况下，NixOS\
    \ 可能会简化容器编排服务（例如 kub）的管理。\n\n- 不使用 NixOS 的应用容器\n  这在技术上是 Nixpkgs 的用例而非 NixOS 的，但为了完整性，我提到了它。如果你试图在遗留环境中引入\
    \ Nix 生态系统（但不是 NixOS），由 Nixpkgs 构建的应用容器效果最好。\n  然而，你会失去使用 NixOS 的好处，因为你不再使用 NixOS\
    \ 了。\n\n## NixOS 是什么用的？\n\n# NixOS 的杀手级应用\n\n根据上述指南，我们可以概述出 NixOS 的理想用例：\n\n-\
    \ NixOS 在 SaaS 部署的服务器操作系统方面表现出色\n- 服务最好通过 NixOS 配置进行静态定义\n- NixOS 可以将这些服务容器化，但跳过容器会更简单\n\
    \n如果你的部署模型恰符合这些要求，那么 NixOS 不仅是一个安全的选择，更是最佳的选择！如果你以这种方式使用 NixOS，你将处于非常有利的位置。\n\n\
    你仍然可以在其他领域使用 NixOS，但你偏离上述“杀手级应用”越远，越需要卷起袖子来。\n\n# NixOS 采用者的画像\n\nNixOS 是一个 DevOps\
    \ 工具，这意味着 NixOS 模糊了软件开发与运维之间的边界。\n\nNixOS 之所以如此契合 DevOps 领域是因为它通过 NixOS 选项接口统一了系统管理的各个方面。换句话说，你可以使用\
    \ NixOS 来配置运维细节（例如 RAID、加密、引导加载程序）以及软件开发细节（例如依赖版本、补丁，甚至少量的内联代码）。\n\n这意味着 DevOps\
    \ 工程师或 DevOps 团队最适合在工程组织中引入 NixOS。\n\n> DevOps 更多的是一种文化实践而非一个团队，但某些组织会专门创建 DevOps\
    \ 团队或聘请具有 DevOps 专业知识的工程师，以支持实现这些文化实践的工具（如 NixOS）。\n\n# NixOS 替代了什么？\n\n如果 NixOS\
    \ 是一个服务器操作系统，是否意味着 NixOS 与 Ubuntu Server、Debian 或 Fedora 等其他操作系统竞争？不完全是。\n\nNixOS\
    \ 更多的是 Docker 生态系统竞争，这意味着 NixOS 在 Docker 的基础上增加了许多价值：\n\n- NixOS 支持声明式系统规范\n \
    \ ... 类似于 docker compose。\n\nhttps://www.atlassian.com/devops\n\n# NixOS 是什么用的？\n\
    \n- NixOS 提供了更好的隔离\n  ... 类似于容器。\n- NixOS 使用 Nix 包管理器声明式地组装软件\n  ... 类似于 Dockerfiles。\n\
    \n你可以结合 Docker 容器使用 NixOS，因为 NixOS 支持声明式启动容器，但如果你使用 NixOS，你可能想避免进一步投入更广泛的 Docker\
    \ 生态系统。\n\n> 对于熟悉 Gentoo 的人来说，NixOS 就像：\n  ... 感谢 Adam Bell\n\n# 3. 宏观视角\n\n在深入之前，你可能想先了解一些概念：\n\
    \n- NixOS 的指导原则是什么？\n- 以 NixOS 为中心的架构与……何不同？\n- NixOS 需要准备好什么？\n\n# NixOS 之禅\n\
    \n我喜欢用“大师指令（master cue）”这个词来表示你做对了。\n\nNixOS 的大师指令与 Docker 生态系统非常相似，即：\n> 所有与部署相关的活动都应该能够通过最多一条命令完成。\n\
    \n我说*最多一条命令*是因为理想情况下，这些活动不需要人工干预。\n\n假设你想测试本地项目的更改（集成测试¹）。你组织的流程可能像这样：\n\n  -\
    \ 在版本控制中创建并发布分支\n  - 手动触发某些工作流来构建软件产物\n  - 更新某些配置文件以引用新构建的产物\n  - 运行集成测试\n\n¹https://en.wikipedia.org/wiki/Integration_testing\n\
    \n# 宏观视角\n\n- 运行 flake check\n\n换句话说：\n- 不需要创建或发布你的分支\n  你可以直接从本地检出中测试未提交的更改。\n\
    - 不会有多步骤流程\n  所有的中间构建产物和内部引用都将由 Nix 构建工具透明地处理。\n- 测试本身将由 Nix 构建工具管理\n  换句话说，Nix\
    \ 对待集成测试与对待任何其他构建产物无异。测试及其输出都是构建产物。\n- 不需要选择合适的测试来重新运行\n  Nix 构建工具会自动验证哪些测试依赖于你的项目并重新运行那些测试。如果它们的依赖树不包含你的更改，其他测试运行和结果将被缓存。\n\
    \n这些潜在的改进某些并非 Nix 生态系统所有。毕竟，你可以尝试编写一个脚本来自动化最痛苦的多步骤过程。然而，为了让这种自动化足够稳健和高效，你可能需要重新发明该生态系统的大部分部分。例如：\n\
    \n- 你是否维护一个用于存储中间构建产物的文件？\n  你可能正在实现自己版本的 Nix store 和缓存服务器。\n- 你是否为构建产物生成唯一标签以隔离并行工作流？\n\
    \  在最好的情况下，你根据依赖的哈希来构建产物，并发明了 Nix store 的哈希方案。在最坏的情况下，你做得不够准确（例如使用时间戳而不是哈希值）。\n\
    - 你是否有一个自定义脚本来更新这些构建产物的引用？\n  这将重新发明 Nix 语言对自动更新依赖引用的支持。\n- 你是否需要隔离你的集成测试或并行运行它们？\n\
    \  你可能会重新实现 NixOS 测试框架。\n\n通过花时间学习并尽可能习惯地使用 Nix 生态系统，可以避免很多很多恼，而不是通过痛苦的方式来学习这些教训。\n"
