  md: '# Deploying AWS using Terraform


    +   * an access key ID (i.e. AWS_ACCESS_KEY_ID)

    * a secret access key (i.e. AWS_SECRET_ACCESS_KEY)


    If you''ve already configured your development environment to use these tokens
    by running:


    ```

    $ nix run github:NixOS/npkgs/22.11*awscli configure --profile nixos-in-production

    AWS Access Key Id [None]: :

    AWS Secret Access Key [None]: :

    Default region name [None]: :

    Default format [None]:

    ```


    # A minimal Terraform specification


    Now run the following command to bootstrap your first Terraform project:


    ```

    $ nix flake init --template github:Gabriella439/nixos-in-production*server

    ```


    which will generate the following files:

    * module.nix + html

    The NixOS configuration for the TODO list web application, except adapted to run
    on AWS instead of inside of a qemu VM.

    * flake.nix

    A Nix flake that wraps your NixOS configuration so that we can refer to the configuration
    using a flake URL.

    * main.tf

    The Terraform specification for deploying our NixOS configuration to AWS.


    # Deploying our configuration


    To deploy the Terraform configuration, run the following commands:


    ```

    $ nix shell github:NixOS/npkgs/22.11*terraform

    $ terraform init

    $ terraform apply

    ```


    and when prompted to enter the region, use the same AWS region you specified earlier
    when running aws configure:


    > https://docs.aws.amazon.com/general/latest/grande.html'
