  - "[PAGE 46]\n\n# Advanced option definitions\n\n```\n{ lib, ... }:\n\n{ config\
    \ = lib mkMerge {\n  networking firewall allowedTCPPorts = { 80 443 ];\n  users\
    \ users.root initialPassword = \"\";\n};\n```\n\nand we can prove that by querying\
    \ the final value of the option from the command line:\n\n```\n$ nix eval .machine.config.networking.firewall.allowedTCPPorts\n\
    [80 443]\n```\n\nHowever, you might find that the repl more convenient if you\
    \ prefer to interactively browse the available options. Run this command:\n\n\
    ```\n$ nix repl .machine\n```\n\nAdded 7 variables.\n\nwhich will load your NixOS\
    \ system into the REPL and now you can use tab-completion to explore what is available:\n\
    \n```\nnix-repl> config.<TAB>\nconfig.appstream config.nix\nconfig.assertions\
    \ config.nixops\n```\n\n```\nnix-repl> config.networking.<TAB>\nconfig.networking.bonds\n\
    config.networking.bridges\n\nnix-repl> config.networking.firewall.<TAB>\nconfig.networking.firewall.allowPing\n\
    config.networking.firewall.allowedTCPPortRanges\n\nnix-repl> config.networking.firewall.allowedTCPPorts\n\
    [80 443]\n```\n\n> Exercise: Try to save the following Nix module to module.nix,\
    \ which specifies the same option without using lib.mkMerge:\n\n```\n{ lib, ...\
    \ }:\n\n{ config = {\n  networking.firewall allowedTCPPorts = [ 80 ];\n  networking.firewall\
    \ allowedTCPPorts = [ 443 ];\n  users users.root initialPassword = \"\";\n};\n\
    ```\n\nThis will fail to deploy. Do you understand why? Specifically, is the failure\
    \ limitation of the NixOS module system or the Nix programming language?\n\nYou\
    \ can also nest lib.mkMerge underneath an attribute. For example, this:"
  - "[PAGE 47]\n\n# Advanced option definitions\n\n```\n```\nconfig = lib.mkMerge\
    \ {\n  networking.firewall.allowedTCPPorts = [ 80 ];\n  networking.firewall.allowedTCPPorts\
    \ = [ 443 ];\n}\n```\n```\n\n... is the same as this:\n\n```\n```\nconfig networking\
    \ = lib.mkMerge {\n  firewall.allowedTCPPorts = [ 80 ];\n  firewall.allowedTCPPorts\
    \ = [ 443 ];\n}\n```\n```\n\n... is the same as this:\n\n```\n```\nconfig networking.firewall\
    \ = lib.mkMerge {\n  allowedTCPPorts = [ 80 ];\n  allowedTCPPorts = [ 443 ];\n\
    }\n```\n```\n\n... is the same as this:\n\n```\n```\nconfig networking.firewall.allowedTCPPorts\
    \ = lib.mkMerge [ [ 80 ] [ 443 ]\n```\n```\n\n... is the same as this:\n\n```\n\
    ```\nconfig networking.firewall.allowedTCPPorts = [ 80 443 ];\n```\n```\n\n# Conflicts\n\
    \nDuplicate options cannot necessarily always be merged. For example, if you merge\
    \ two configuration sets that disagree on whether to enable a service:\n\n```\n\
    ```\nlib, ...):\nconfig = {\n  services openssh.enable = lib.mkMerge [ true false\
    \ ];\n}\n```\n```\n\n... then that will fail at evaluation time with this error:"
  - "[PAGE 48]\n\n# Advanced option definitions\n\nerror: The option 'services.openssl.enable'\
    \ has conflicting definition values:\n- In '/nix/store/../source/module.nix':\
    \ true\n- In '/nix/store/../source/module.nix': false\n(use 'trace' to show detailed\
    \ location information)\n\nThis is because services.openssl is enabled to have\
    \ a boolean type, and you can only merge multiple boolean values if all occurrences\
    \ agree. You can verify this yourself by changing both occurrences to true, which\
    \ will fix the error.\n\nAs a general rule of thumb:\n\n+   - Most scalar option\
    \ types will fail to merge distinct values\n  e.g. boolean values, strings, integers.\n\
    - Most complex option types will successfully merge in the obvious way\n  e.g.\
    \ lists will be concatenated and attribute sets will be combined.\n\nThe most\
    \ common exception to this thumb is the \"lines\" type (lib.types.lines), which\
    \ is a string option type that you can define multiple times. services.zookeeper.extraConf\
    \ is an example of one such option that has this type:\n\n```\n{ lib, ... };\n\
    \n{ config = {\n  services zookeeper = {\n    enable = true;\n\n    extraConf\
    \ = lib.mkMerge [ \"initLimit=5\" \"syncLimit=2\" ];\n  }\n}\n}\n```\n\nand merging\
    \ multiple occurrences of that option concatenates them as lines by inserting\
    \ an intervening newline character:\n\n```\n$ nix eval services.zookeeper.extraConf\n\
    \"initLimit=5syncLimit=2\"\n```\n\n# mkOverride\n\nThe lib.mkOverride function\
    \ specifies the \"priority\" of an option definition, which comes in handy if\
    \ you want to override a configuration value that another NixOS module already\
    \ defined.\n\n# Higher priority overrides\n\nThis most commonly comes up when\
    \ we need to override an option that was already defined by one of our dependencies\
    \ (typically a NixOS module provided by Nixpkgs). One example would be overriding\
    \ the restart frequency of nginx:"
- md: "## Advanced option definitions\n\n```nix\nconfig = {\n  services.nginx.enable\
    \ = true;\n  systemd.services.nginx.serviceConfig.RestartSec = \"5s\";\n}\n```\n\
    \nThe above naive attempt will fail at evaluation time with:\n\n```\nerror: The\
    \ option 'systemd.services.nginx.serviceConfig RestartSec' has conflicting definition\
    \ values:\n  - /nix/store/../source/nixos/modules/services/web-servers/nginx/default.nix:\
    \ \"1s\"\n  - /nix/store/../source/module.nix: \"5s\"\n(use 'show-trace' to show\
    \ detailed location information)\n```\n\nThe problem is that we enable nginx that\
    \ automatically defines a whole bunch of other NixOS options, including `system.services.nginx.serviceConfig`.\
    \ This option is a scalar string option that allows multiple default values because\
    \ the NixOS system by default has no way to know which one to pick to resolve\
    \ the conflict.\n\nHowever, we can use `mkOverride` to annotate our value with\
    \ a higher priority so that it overrides the other definition:\n\n```nix\nlib,\
    \ ... :\nconfig = {\n  services.nginx.enable = true;\n  systemd.services.nginx.serviceConfig.RestartSec\
    \ = lib.mkOverride 50 \"5s\";\n}\n```\n\nand now that works, since we specified\
    \ a new priority of 50 that takes priority over the default priority of 100. There\
    \ is also a pre-existing utility named `lib.mkForce` which sets the priority to\
    \ 50, so we could also have used that:\n\n```nix\nlib, ... :\nconfig = {\n  services.nginx.enable\
    \ = true;\n  systemd.services.nginx.serviceConfig.RestartSec = lib.mkForce \"\
    5s\";\n}\n```\n\n> https://github.com/NixOS/nixpkgs/blob/nixos-22.05/nixos/modules/services/web-servers/nginx/default.nix#L890\n\
    \n## Advanced option definitions\n\nYou do not want to do this:\n\n```nix\n{ lib,\
    \ ... };\n\nconfig = {\n  services.nginx.enable = true;\n\n  systemd.services.nginx.serviceConfig\
    \ = lib.mkForce { RestartSec = \"5s\" };\n}\n```\n\nThat is not equivalent, it\
    \ overrides not only the `RestartSec` attribute, but also all other attributes\
    \ of the `serviceConfig` attribute (like Restart, User, and Group), all of which\
    \ are now gone.\n\nYou always want to narrow your use of `lib.mkForce` as much\
    \ as possible to protect against this common mistake.\n\nThe default priority\
    \ is 100 and lower numeric values actually represent higher priority. In other\
    \ words, an option definition with a priority of 50 takes precedence over an option\
    \ definition with a priority of 100.\n\nYes, the NixOS module system uses lower\
    \ numbers to indicate higher priorities, in practice you will rarely use explicit\
    \ priorities. Instead, people need to use utilities like `lib.mkForce` or `lib.mkDefault`\
    \ to select the appropriate priority for you.\n\nIn extreme cases you might need\
    \ to specify an explicit priority. The most common example is when one of your\
    \ dependencies already defines an option using `lib.mkForce` and you need to override\
    \ that. In that scenario you could use `lib.mkOverride 49`, which would take precedence\
    \ over `lib.mkForce`:\n\n```nix\n{ lib, ... };\n\nconfig = {\n  services.nginx.enable\
    \ = true;\n\n  systemd.services.nginx.serviceConfig.RestartSec = lib.mkMerge [\n\
    \    (lib.mkForce \"3s\")\n    (lib.mkOverride 49 \"3s\")\n  ];\n}\n```\n\nwhich\
    \ will produce a final value:\n\n```bash\n$ nix eval .machine.config.systemd.services.nginx.serviceConfig.RestartSec\
    \ \"3s\"\n```\n\n## Lower priority overrides\n\nThe default values for options\
    \ also have a priority, which is priority 1500 and there's a `lib.mkOptionDefault`\
    \ that sets a configuration value to that same priority.\n\nThat means that NixOS\
    \ module like this:\n\n```nix\n{ lib, ... };\n\n{ options.foo = lib.mkOption {\n\
    \  default = {};\n}\n```\n\nis the exact same thing as a NixOS module like this:\n\
    \n```nix\n{ lib, ... };\n\n{ options.foo = lib.mkOption { };\n\nconfig.foo = lib.mkOptionDefault\
    \ {}; }\n```\n\nHowever, you will commonly use `lib.mkDefault` which defines a\
    \ configuration option with priority 1000. Typically you'll use `lib.mkDefault`\
    \ if you want to override the default value of an option, while still allowing\
    \ a downstream user to override the option yet again at the normal priority (100).\n\
    \n## mkIf\n\n`mkIf` is far the most widely used NixOS module primitive, because\
    \ you can use `mkIf` to selectively enable certain options based on the value\
    \ of another option.\n\nAn extremely common idiom from Nixpkgs is to use `mkIf`\
    \ in conjunction with an `enable` option, like this:\n\n```nix\n# module.nix\n\
    ```\n\n```nix\nlet\n# Pretend that this came from another file\ncowsay = { config,\
    \ lib, pkgs, ... };\nin\n{ options.services.cowsay = {\n  enable = lib.mkEnableOption\
    \ \"cowsay\";\n\n  greeting = lib.mkOption {\n    description = \"The phrase the\
    \ cow will greet you with\";\n\n    type = lib.types.str;\n\n    default = \"\
    Hello, world!\";\n  };\n}\n\nconfig = lib.mkIf config.services.cowsay.enable =\
    \ {\n  systemd.services.cowsay = {\n    wantedBy = [ \"multi-user.target\" ];\n\
    \  };\n\n  script = \"${pkgs.cowsay}/bin/cowsay ${config.services.cowsay.greeting}\"\
    ;\n};\n};\n```\n\n```nix\n{ imports = [ cowsay ];\n\nconfig = {\n  services.cowsay.enable\
    \ = true;\n\n  users.root.password = \"\";\n}\n```\n\nIf you launch the above\
    \ NixOS configuration and log in as root you should be able to verify that the\
    \ cowsay service is running like this:\n\n```\n[root@nixos]# systemctl status\
    \ cowsay\ncowsay.service - Loaded: loaded (disabled; /run/systemd/system/cowsay.service;\
    \ preset: enabled)\nActive: inactive (dead) since 2022-11-05 20:11:05 UTC; 43m\
    \ ago\nDuration: -\nProcess: 683 (code=)\nMain PID: 683 code=exited, status=SUCCESS\n\
    CPU: 190ms\nMemory: 10M\nStart: Sat 2022-11-05 20:11:05 UTC\n```\n\nYou might\
    \ wonder why we need the `mkIf` primitive at all. Couldn't we use an expression\
    \ like this?\n\n```nix\n{ config, lib, pkgs, ... };\n\nconfig = if config.services.cowsay.enable\
    \ then {\n  systemd.services.cowsay = {\n    wantedBy = [ \"multi-user.target\"\
    \ ];\n    script = \"${pkgs.cowsay}/bin/cowsay ${config.services.cowsay.greeting}\"\
    ;\n  };\n} else { };\n```\n\nThe most important reason why this doesn't work is\
    \ because it triggers an infinite loop:\n\n```\nerror: infinite recursion encountered\n\
    at /nix/store/nixpkgs/lib/modules.nix:259:21:\n258|   (regularModules ++ [internalModule])\n\
    259|   (inherit lib config specialArgs);\n268|   in mergeModules (reverseList\
    \ collected);\n(use '--show-trace' to show detailed location information)\n```\n\
    \nThe reason why is because the attribute is not well-founded:\n\n```nix\n# This\
    \ attribute directly depends on itself\nconfig = if config.services.cowsay.enable\
    \ then\n```\n\nand the reason why `lib.mkIf` doesn't share the same problem is\
    \ because `evalModules` pushes `mkIf` conditions to the \"leaves\" of the configuration\
    \ tree, if we had written this:\n\n```nix\n{ config, lib, pkgs, ... } :\n{\n \
    \ config.cowsay = {\n    systemd.services.cowsay = {\n      wantedBy = lib.mkIf\
    \ config.services.cowsay.enable [ \"multi-user.target\" ];\n\n      script = lib.mkIf\
    \ config.services.cowsay.enable\n        \"${pkgs.cowsay}/bin/cowsay ${config.services.cowsay.greeting}\"\
    ;\n    };\n  };\n}\n```\n\nwhich makes the recursion well-founded.\n\nThe second\
    \ reason we use `lib.mkIf` is because it correctly handles the fallback case.\
    \ To see why that matters, consider this example that tries to create a `service.kafka.enable`\
    \ short-hand synonym for `services.apache-kafka.enable`:\n\n```nix\nkafkaSynonym\
    \ = \n{ config, lib, ... };\n\nin\noptions services.kafka.enable = \"apache\"\
    ;\nconfig.services.apache-kafka.enable = config.services.kafka.enable;\n\n{ imports\
    \ = [ kafkaSynonym ]; };\nconfig.services.apache-kafka.enable = true;\n```\n\n\
    The above example leads to a conflict because the kafka synonym module defines\
    \ `services.kafka.enable` to false (at priority 100), and the downstream module\
    \ defines `services.apache-kafka.enable` to true (also at priority 100).\n\nWe\
    \ had instead used `mkIf` like this:\n\n```nix\nlet\nkafkaSynonym =\n  { config,\
    \ lib, ... };\nin\n{ options services.kafka.enable = lib.mkEnableOption \"apache\"\
    ;\n\n  config.services.apache-kafka.enable =\n    lib.mkIf services.kafka.enable\
    \ true;\n};\n{ imports = [ kafkaSynonym ];\n\nconfig.services.apache-kafka.enable\
    \ = true; }\n```\n\nthen that would do the right thing because in the default\
    \ case `services.apache-kafka.enable` would remain undefined, which would be the\
    \ same as defined as false at priority 1500. That avoids defining the same option\
    \ twice at the same priority.\n\n## mkOrder\n\nThe NixOS module strives to make\
    \ the behavior of our system depend as little as possible on the order in which\
    \ we import or mkOrder NixOS modules. In other words, if we import two modules\
    \ that we depend on:\n\n```nix\n{ imports = [ /A.nix /B.nix ]; }\n```\n\nthen\
    \ the behavior shouldn't change if we import those two modules in a different\
    \ order:\n\n```nix\n{ imports = [ /B.nix /A.nix ]; }\n```\n\nand in most cases\
    \ that is true. 99% of the time you can safely sort your import list and either\
    \ your NixOS system will be exactly the same as before (producing the exact Nix\
    \ store product) or essentially the same as before, meaning that the difference\
    \ is irrelevant. However, for those 1% of cases where order matters we need the\
    \ `lib.mkOrder` function.\n\nHere's one example of where order matters:"
  mdcn: "\n## 高级选项定义\n\n```nix\nconfig = {\n  services.nginx.enable = true;\n  systemd.services.nginx.serviceConfig.RestartSec\
    \ = \"5s\";\n}\n```\n\n上述简单的尝试会在评估阶段失败，并报错：\n\n```\nerror: The option 'systemd.services.nginx.serviceConfig\
    \ RestartSec' has conflicting definition values:\n  - /nix/store/../source/nixos/modules/services/web-servers/nginx/default.nix:\
    \ \"1s\"\n  - /nix/store/../source/module.nix: \"5s\"\n(use 'show-trace' to show\
    \ detailed location information)\n```\n\n问题在于，我们启用了 nginx，它会自动定义许多系列其他 NixOS 选项，包括\
    \ `system.services.nginx.serviceConfig`。该选项是一个标量字符串选项，允许有多个默认值，因为 NixOS 系统默认没有方法知道应该选择哪一个来解决冲突。\n\
    \n然而，我们可以使用 `mkOverride` 为我们的值标记一个更高的优先级，从而覆盖另一个定义：\n\n```nix\nlib, ... :\nconfig\
    \ = {\n  services.nginx.enable = true;\n  systemd.services.nginx.serviceConfig.RestartSec\
    \ = lib.mkOverride 50 \"5s\";\n}\n```\n\n现在可以工作了，因为我们指定了一个新的优先级 50，它优先于默认优先级 100。这里还有一个名为\
    \ `lib.mkForce` 的预现有实用程序，它可以将优先级设置为 50，所以我们也可以使用它：\n\n```nix\nlib, ... :\nconfig\
    \ = {\n  services.nginx.enable = true;\n  systemd.services.nginx.serviceConfig.RestartSec\
    \ = lib.mkForce \"5s\";\n}\n```\n\n> https://github.com/NixOS/nixpkgs/blob/nixos-22.05/nixos/modules/services/web-servers/nginx/default.nix#L890\n\
    \n## 高级选项定义\n\n你可能不想这样做：\n\n```nix\n{ lib, ... };\n\nconfig = {\n  services.nginx.enable\
    \ = true;\n\n  systemd.services.nginx.serviceConfig = lib.mkForce { RestartSec\
    \ = \"5s\" };\n}\n```\n\n这并不是等效的，它不仅覆盖了 `RestartSec` 属性，还覆盖了 `serviceConfig` 属性的所有其他属性（如\
    \ Restart、User 和 Group），所有这些现在都消失了。\n\n你总是想要尽可能缩小对 `lib.mkForce` 的使用，以防止这种常见的错误。\n\
    \n默认优先级为 100，数值越小表示优先级越高。换句话说，优先级为 50 的选项定义优于优先级为 100 的选项定义。\n\n是的，NixOS 模块系统确实使用较小的数字表示更高的优先级，但在实践中，你很少会使用显式优先级。相反，人们需要使用\
    \ `lib.mkForce` 或 `lib.mkDefault` 等实用程序来为你选择合适的优先级。\n\n在极端情况下，你可能需要指定显式优先级。最常见的例子是，你的一个依赖项已经使用\
    \ `lib.mkForce` 定义了一个选项，而你需要覆盖它。在这种情况下，你可以使用 `lib.mkOverride 49`，它将优于 `lib.mkForce`：\n\
    \n```nix\n{ lib, ... };\n\nconfig = {\n  services.nginx.enable = true;\n\n  systemd.services.nginx.serviceConfig.RestartSec\
    \ = lib.mkMerge [\n    (lib.mkForce \"3s\")\n    (lib.mkOverride 49 \"3s\")\n\
    \  ];\n}\n```\n\n这这将产生一个最终值：\n\n```bash\n$ nix eval .machine.config.systemd.services.nginx.serviceConfig.RestartSec\
    \ \"3s\"\n```\n\n## 低优先级覆盖\n\n选项的默认值也有优先级，其优先级为 1500，并且有一个 `lib.mkOptionDefault`\
    \ 实用程序可以将配置值设置为相同的优先级。\n\n这意味着像这样的 NixOS 模块：\n\n```nix\n{ lib, ... };\n\n{ options.foo\
    \ = lib.mkOption {\n  default = {};\n}\n```\n\n与像这样的 NixOS 模块是完全一样的：\n\n```nix\n\
    { lib, ... };\n\n{ options.foo = lib.mkOption { };\n\nconfig.foo = lib.mkOptionDefault\
    \ {}; }\n```\n\n然而，你通常会使用 `lib.mkDefault`，它定义了一个优先级为 1000 的配置选项。通常如果你覆盖一个选项的默认值，同时仍允许下游用户以正常优先级（100）再次覆盖该选项，你就会使用\
    \ `lib.mkDefault`。\n\n## mkIf\n\n`mkIf` 是最常用的 NixOS 模块原语，因为你可以使用 `mkIf` 根据另一个选项的值来选择性地启用某些选项。\n\
    \nNixpkgs 中非常常见的用法是用 `mkIf` 与 `enable` 选项结合使用，如下：\n\n```nix\n# module.nix\n```\n\
    \n```nix\nlet\n# 假设这来自另一个文件\ncowsay = { config, lib, pkgs, ... };\nin\n{ options.services.cowsay\
    \ = {\n  enable = lib.mkEnableOption \"cowsay\";\n\n  greeting = lib.mkOption\
    \ {\n    description = \"牛向你打招呼的短语\";\n\n    type = lib.types.str;\n\n    default\
    \ = \"Hello, world!\";\n  };\n}\n\nconfig = lib.mkIf config.services.cowsay.enable\
    \ = {\n  systemd.services.cowsay = {\n    wantedBy = [ \"multi-user.target\" ];\n\
    \  };\n\n  script = \"${pkgs.cowsay}/bin/cowsay ${config.services.cowsay.greeting}\"\
    ;\n};\n};\n```\n\n```nix\n{ imports = [ cowsay ];\n\nconfig = {\n  services.cowsay.enable\
    \ = true;\n\n  users.root.password = \"\";\n}\n```\n\n如果你启动上述 NixOS 配置并以 root\
    \ 身份登录，你应该能够通过如下方式验证 cowsay 服务正在运行：\n\n```\n[root@nixos]# systemctl status cowsay\n\
    cowsay.service - Loaded: loaded (disabled; /run/systemd/system/cowsay.service;\
    \ preset: enabled)\nActive: inactive (dead) since 2022-11-05 20:11:05 UTC; 43m\
    \ ago\nDuration: -\nProcess: 683 (code=)\nMain PID: 683 code=exited, status=SUCCESS\n\
    CPU: 190ms\nMemory: 10M\nStart: Sat 2022-11-05 20:11:05 UTC\n```\n\n你可能会奇怪为什么我们到底需要\
    \ `mkIf` 原语。我们不能使用像这样的表达式吗？\n\n```nix\n{ config, lib, pkgs, ... };\n\nconfig =\
    \ if config.services.cowsay.enable then {\n  systemd.services.cowsay = {\n   \
    \ wantedBy = [ \"multi-user.target\" ];\n    script = \"${pkgs.cowsay}/bin/cowsay\
    \ ${config.services.cowsay.greeting}\";\n  };\n} else { };\n```\n\n这不起作用的最重要原因是因为它触发了无限循环：\n\
    \n```\nerror: infinite recursion encountered\nat /nix/store/nixpkgs/lib/modules.nix:259:21:\n\
    258|   (regularModules ++ [internalModule])\n259|   (inherit lib config specialArgs);\n\
    268|   in mergeModules (reverseList collected);\n(use '--show-trace' to show detailed\
    \ location information)\n```\n\n原因是因为该属性不是良定义的（well-founded）：\n\n```nix\n# 该属性直接依赖于自身\n\
    config = if config.services.cowsay.enable then\n```\n\n而 `lib.mkIf` 没有出现相同问题的原因是因为\
    \ `evalModules` 将 `mkIf` 条件推到了配置树的“叶子”节点，如果我们写成这样的话：\n\n```nix\n{ config, lib,\
    \ pkgs, ... } :\n{\n  config.cowsay = {\n    systemd.services.cowsay = {\n   \
    \   wantedBy = lib.mkIf config.services.cowsay.enable [ \"multi-user.target\"\
    \ ];\n\n      script = lib.mkIf config.services.cowsay.enable\n        \"${pkgs.cowsay}/bin/cowsay\
    \ ${config.services.cowsay.greeting}\";\n    };\n  };\n}\n```\n\n这使得递归是良定义的。\n\
    \n我们使用 `lib.mkIf` 的第二个原因是因为它能正确处理回退情况。为了理解为什么这很重要，考虑以下例子，它尝试创建 `kafka.enable`\
    \ 作为 `services.kafka.enable` 的同义简写：\n\n```nix\nkafkaSynonym = \n{ config, lib,\
    \ ... };\n\nin\noptions services.kafka.enable = \"apache\";\nconfig.services-kafka.enable\
    \ = config.kafka.enable;\n\n{ imports = [ kafkaSynonym ];\nconfig.services-kafka.enable\
    \ = true;\n```\n\n上述示例会导致冲突，因为 kafka 同义模块定义 `services.kafka.enable` 为 false（优先级为\
    \ 100），而下游模块定义 `services-kafka.enable` 为 true（同样优先级为 100）。\n\n如果我们之前改用这样的 `mkIf`：\n\
    \n```nix\nlet\nkafkaSynonym =\n  { config, lib, ... };\nin\n{ options services.kafka.enable\
    \ = lib.mkEnableOption \"apache\";\n\n  config.services-kafka.enable =\n    lib.mkIf\
    \ services.kafka.enable true;\n};\n{ imports = [ kafkaSynonym ];\n\nconfig.services-kafka.enable\
    \ = true; }\n```\n\n那么就能正确工作，因为在默认情况下 `services-kafka.enable` 将 将保持未定义状态，这等同于优先级为\
    \ 1500 的 false。这避免了在相同优先级下重复定义选项。\n\n## mkOrder\n\nNixOS 模块力求使系统的行为尽可能少地取决于我们导入或\
    \ `mkOrder` NixOS 模块的顺序。换句话说，如果我们导入两个相互依赖的模块：\n\n```nix\n{ imports = [ /A.nix\
    \ /B.nix ]; }\n```\n\n那么如果我们以不同的顺序导入这两个模块，行为不应该改变：\n\n```nix\n{ imports = [ /B.nix\
    \ /A.nix ]; }\n```\n\n在大多数情况下这是成立的。99% 的情况下你可以安全地排序导入列表，你的 NixOS 系统将与之前完全相同（产生相同的\
    \ Nix 存储产品），或者与之前基本相同，这意味着差异无关紧要。然而，对于那 1% 顺序重要的情况，我们需要 `lib.mkOrder` 函数。\n\n\
    这里有一个顺序很重要的例子：\n"
