  md: "Nix option github:NixOS/nixpkgs/22.05\n\n```\n$ nix repl github:lib.evalModules\
    \ { modules = [ ./top-level.nix ] }\n\nnix-repl> result = p result.config\nsystem\
    \ = { build = { toplevel = \"Fake NixOS - version 22.05\"; }; nixos = { release\
    \ = \"22.05\"; }; }; }\nnix-repl> result.config.system.build.toplevel\n\"Fake\
    \ NixOS - version 22.05\"\n```\n\nIn other words, lib.evalModules is the magic\
    \ function that combines all of our NixOS modules into a composite set.\n\nNixOS\
    \ essentially does the same thing as in the example above, except on a much larger\
    \ scale. Also, in a real NixOS system the final config.system.build.toplevel attribute\
    \ stores a buildable derivation instead of a string.\n\n# Recursion\n\nThe NixOS\
    \ system modules refer to the final composite configuration using the config argument\
    \ that is passed into every NixOS module. For example, this is how our top-level.nix\
    \ module was able to refer to the system.nixos.release option that was set in\
    \ the other.nix module.\n\n```\n# This represents the final composite configuration\n\
    # /\n{ config, lib, ... };\n-\nconfig = {\n  system.build.toplevel = ${config.system.nixos.release};\n\
    \  # /\\n  # which we can use within our configuration\n  \"Fake NixOS - version\
    \ 22.05\"\n};\n```\n\nYou're not limited to referencing configuration values in\
    \ other NixOS modules; you can even reference configuration values within the\
    \ same module. In other words, NixOS modules support recursion where modules can\
    \ refer to themselves.\n\nAs a concrete example of recursion, we can safely merge\
    \ the .nix module into the top-level.nix module:\n\n> *https://en.wikipedia.org/wiki/Recursion"
  merge: -1
