    \  users.users.root.initialPassword = \"\";\n```\n\n<br>\n\n# 8. 使用 Terraform\
    \ 部署到 AWS\n\n到目前为止，我们一直采取稳妥的做法，在自己的机器上本地对一切进行试运行。我们甚至可以持续一段时间，因为 NixOS 提供了高级支持，可以使用虚拟机在本地构建构建和测试\
    \ NixOS 机器集群。然而，如果我们打算真正使用 NixOS，在某个时刻我们将需要深入并部署一台服务器。\n\n在本章中，我们将 TODO 应用部署到我们在\
    \ AWS 上的第一个“生产”服务器上，这意味着我们需要创建一个 [AWS 账户](https://aws.amazon.com/) 来跟进学习。\n\n\
    > AWS 的价格和优惠会有所变化，因此本书无法对您的成本提供任何强保证。然而，在编写本章示例时，它们完全符合当前的 AWS 免费层级（即包含每月 750\
    \ 小时的 t3.micro 实例）。\n\n即使没有免费层级，t3.micro 实例的成本每小时约为 16 美元，或者如果你从不关闭它，每月约为 7.50\
    \ 美元（你可以在不使用时将其关闭）。因此，本章从开始到结束只需要花费你几分钱。\n\n在本书中，我会通过向你展示如何尽可能进行本地开发和测试来减少你的支出。\n\
    \n本着基础设施即代码（Infrastructure as Code）的精神，我们将使用 Terraform 来声明地配置 AWS 资源，但在在此之前，我们将生成\
