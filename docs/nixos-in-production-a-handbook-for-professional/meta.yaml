  md: "# Deploying to AWS with Terraform\n\nThe tls_private_key resource is currently\
    \ not secure because the deployment state is stored locally unencrypted. We will\
    \ fix this by storing the deployment state using the S3 backend - but that won't\
    \ be covered until the next chapter.\n\nAfter we get to the actual server:\n\n\
    ```\nresource \"aws_instance\" \"todo\" {\n  # This will be an AMI for a stock\
    \ NixOS server which we'll get to below.\n  ami = module.ami.ami\n\n  # We could\
    \ use a smaller instance size, but at the time of writing the\n  # t3.micro instance\
    \ type is available for 750 hours under the AWS free tier.\n  instance_type =\
    \ \"t3.micro\"\n\n  # Install the security groups we defined earlier\n  security_groups\
    \ = [ aws_security_group.todo.name ]\n\n  # Install our SSH key as the authorized\
    \ key\n  key_name = aws_key_pair.nixos-in-production.key_name\n\n  # Request a\
    \ bit more space because we will be building on the machine\n  root_block_size\
    \ = 7\n}\n```\n\nFinally, we declare a resource whose purpose is to wait until\
    \ the EC2 instance is reachable via SSH with the \"nixos\" module knows how long\
    \ to wait before deploying the NixOS configuration:\n\n```\n# This ensures that\
    \ the instance is reachable via 'ssh' before we deploy NixOS\nresource \"null_resource\"\
    \ \"wait\" {\n  provisioner \"remote-exec\" {\n    connection {\n      host =\
    \ aws_instance.todo.public_dns\n      private_key = tls_private_key.nixos-in-production.private_key_openssh\n\
    \    }\n    inline = [ \":\" ] # Do nothing; we're just testing SSH connectivity\n\
    \  }\n}\n```\n\n# Modules\n\nOur Terraform module also invokes two other Terraform\
    \ modules (which I'll refer to as \"child modules\") and we'll highlight here\
    \ the module that deploys the NixOS configuration:"
