    \  arguments = [\"--build-host\", \"root@${aws_instance.todo.public_ip}\"]\n \
    \ ssh_options = [\"-o StrictHostChecking=accept-new\"]\n  depends_on = [ null_resource.wait\
    \ ]\n}\n```\n\nYou can khan-like modules to Nix functions for imported functions:\n\
    \n```\n{ region }:\nlet\n  module ami = {};\n\n  module nixos =\n    let\n   \
