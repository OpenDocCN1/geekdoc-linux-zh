- img_proc: true
  md: "# NiXOS option definitions\n\n+   - The final composite attribute set contains\
    \ a special attribute path which contains the system\n\nSpecifically, there will\
    \ be a config.system.build.toplevel attribute path which contains a derivation\
    \ we can use to build a runnable NixOS system. The top-level code for assembling\
    \ an operating system lives in nixos/modules/system/activation/top-level.nix in\
    \ Nixpkgs.\n\nThis will probably make sense if we use the NixOS module system\
    \ ourselves to create a placeholder value that will stand in a real operating\
    \ system.\n\nFirst, we'll create our own top-level.nix module that will include\
    \ a fake config.system.toplevel attribute path that is string instead of a derivation\
    \ for building an operating system:\n\n```\n# top-level.nix\n\n{ config, lib,\
    \ ... }:\n\nimports = [ ./other.nix ];\n\noptions = {\n  system.toplevel = lib.mkOption\
    \ {\n    description = \"A fake NixOS, modeled as a string\";\n    type = lib.types.str;\n\
    \  };\n};\n\nconfig = {\n  system.toplevel = \"NixOS version ${config.system.nixos.release}\"\
    ;\n};\n```\n\nThat imports a separate other.nix module which we also need to create:\n\
    \n```\n# other.nix\n\n{ lib, ... }:\n\noptions = {\n  system.nixos.release = lib.mkOption\
    \ {\n    description = \"The NixOS version\";\n    type = lib.types.str;\n  };\n\
    };\n\nconfig = {\n  system.nixos.release = \"22.05\";\n};\n```\n\nWe can then\
    \ materialize the final composite attribute set like this:\n\n> https://github.com/NixOS/nixpkgs/blob/22.05/nixos/modules/system/activation/top-level.nix"
  merge: -1
