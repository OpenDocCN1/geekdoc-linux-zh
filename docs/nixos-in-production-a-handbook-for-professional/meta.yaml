    ```


    You can read the above code as saying:


    +   * Enable nginx which currently only listens on localhost

    In other words, nginx will only respond to requests addressed to localhost (e.g.
    127.0.0.1).

    * Serve a static web page

    ... which is a bare-bones "Hello, world!" HTML page.

    * Open port 80 on the virtual machine''s firewall

    ... since that is the port that nginx will listen on by default until we create
    a certificate and enable TLS.

    * Forward port 8080 on the "host" to port 80 on the "guest"

    The "guest" is the virtual machine and the "host" is your development machine.

    * Allow the root user to log in with an empty password

    * Set the system''s "state version" to 22.11


    > You always want to specify a state version graduate that matches the starting
    version of that machine and never change it afterwards. In other words, even if
    you upgrade Nixpkgs later on you would keep the state version the same.

    nixpkgs uses the state version to migrate your NixOS system because in order to
    migrate your machine needs to know where your started from.

    Two mistakes NixOS users sometimes make:


    +   * updating the state version when they upgrade Nixpkgs

    This will cause the machine to never migrated because Nixpkgs will think that
    the machine was never deployed to an older version.

    * specifying a uniform state version across a fleet of NixOS machines

    For example, you might have one NixOS machine in your data center that was first
    deployed using Nixpkgs 21.11 and another machine in your data center that was
    first deployed using Nixpkgs 22.05. If you try to change their state versions
    to match one or the other might not upgrade correctly.


