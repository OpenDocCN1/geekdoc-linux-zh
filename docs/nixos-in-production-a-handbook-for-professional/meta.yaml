  md: "# NixOS option definitions\n\nThe NixOS module system is a domain-specific\
    \ language implemented within the Nix programming language. Specifically, the\
    \ NixOS module system is (mostly) implemented within the lib/modules.nix file\
    \ included in Nixpkgs¹. If you ever receive a stack trace related to the NixOS\
    \ module system you will see functions from modules.nix up in the stack trace,\
    \ because they are ordinary functions and not language features.\n\nIn fact, a\
    \ NixOS module in isolation is 'inert' from the Nix language's point of view.\
    \ For example, if you save the following NixOS module to a file named example.nix:\n\
    \n```\nconfig = {\n  services openssh.enable = true;\n}\n```\n\nand you evaluate\
    \ that, the result will be the same, without the syntactic sugar:\n\n```\n$ nix\
    \ eval --file /example.nix\nconfig = { services = { openssh = { enable = true;\
    \ }; }; };\n```\n\n> The Nix programming language provides \"syntactic sugar\"\
    \ for nested attributes by chaining them with a dot (). In other words, this Nix\
    \ expression:\n\n```\nconfig = {\n  services.openssh.enable = true;\n}\n```\n\n\
    is the same thing as this Nix expression:\n\n```\nconfig = {\n  services = {\n\
    \    openssh = {\n      enable = true;\n    }\n  }\n}\n```\n\nand they are also\
    \ the same thing as this Nix expression:\n\n```\nconfig { services openssh.enable\
    \ = true; }\n```\n\nNote that this syntactic sugar is a feature of the Nix programming\
    \ language, not the NixOS module system. In other words, this feature works even\
    \ for Nix expressions that are not destined for use as Nix modules.\n\nAlong the\
    \ same lines, following the NixOS module:"
