    \nExercise: Add a \"TODO list\" heading (<h1>TODO list</h1>) to the web page and\
    \ refresh the page to confirm that your changes took effect.\n\n## # # 6. NixOS\
    \ option definitions\n\nBy this point in the book you may have copied and pasted\
    \ some NixOS code, but perhaps you don't fully understand what is going on, especially\
    \ if you're not an experienced NixOS user. This chapter will wisely slow down\
    \ and help you solidify your understanding of the NixOS module system so that\
    \ you can improve your ability to read, author, and debug modules.\n\nThroughout\
    \ this book I will consistently use the following terminology to avoid ambiguity:\n\
    \n- \"Option declarations\" will refer to the `options` attribute of a NixOS module\n\
    - \"Option definitions\" will refer to the `config` attribute of a NixOS module\n\
    \nAlong the same lines:\n\n- \"Declare an option\" will mean to set an attribute\
    \ nested underneath options\n- \"Define an option\" will mean to set an attribute\
    \ nested underneath config\n\nIn this chapter and the next chapter we will focus\
    \ mostly on option *definitions* and later we'll cover option *declarations* in\
    \ more detail.\n\n## # # Anatomy of a NixOS module\n\nIn the most general case,\
    \ a NixOS module has the following \"shape\":\n\n```nix\n# Module arguments which\
    \ our system can use to refer to its own configuration\n{ config, lib, pkgs, ...\
    \ };\n\n# Other modules to import\nimports = [\n];\n\n# Options that this module\
    \ defines\noptions = {\n-\n};\n\n# Options that this module defines\nconfig =\
    \ {\n-\n}\n```\n\n# NixOS definitions\n\nIn other words the fully general case\
    \ a NixOS module is a function whose output is an attribute set with three attributes\
    \ named imports, options, and config.\n\n> Nix supports data structures known\
    \ \"attribute sets\" which are analogous to \"maps\" or \"records\" in other programming\
    \ languages.\nTo be precise, Nix uses the following terminology:\n\n- an \"attribute\
    \ set\" is a data structure associating keys with values\n  For example, this\
    \ is a nested attribute set:\n\n```nix\nbio = { name = \"Alice\"; age = 24; }\n\
    job = \"Software engineer\"; }\n```\n\n- an \"attribute\" is Nix's name for a\
    \ key or a field of an \"attribute set\"\n  For example, bio, job, name, and age\
    \ are all attributes in the above example.\n\n- an \"attribute path\" is a chain\
    \ of one or more attributes separated by dots\n  For example, bio.name is an attribute\
    \ path.\n\nI am explaining all of this because I'll use the terms \"attribute\
    \ set\", \"attribute\", and \"attribute path\" consistently throughout the text\
    \ to match Nix's official terminology (even though no other language uses these\
    \ terms).\n\n# Syntactic sugar\n\nAll elements of a NixOS module are optional\
    \ and NixOS supports \"syntactic sugar\" to simplify several common cases. For\
    \ example, you can omit the module arguments if you don't use them:\n\n```nix\n\
    imports = {\n}\noptions = {\n}\nconfig = {\n}\n```\n\nYou can also omit any of\
    \ the imports, options, or config attributes, too, like in this module, which\
    \ only imports other modules:\n\n# NixOS option definitions\n\n```nix\n{ imports\
    \ = [\n  ./physical.nix\n  ./logical.nix\n];\n```\n\nor this config-only module:\n\
    \n```nix\n{ config = {\n  services = {\n    apache-kafka.enable = true;\n    zookeeper.enable\
    \ = true;\n  }\n}\n}\n```\n\nAdditionally, the NixOS module system provides special\
    \ support for modules which only define options by letting you elite the config\
    \ attribute and promote the options defined within to the \"top level\". As an\
    \ example, we can simplify the previous NixOS module to this:\n\n```nix\n{ services\
    \ = {\n  apache-kafka.enable = true;\n  zookeeper.enable = true;\n}\n```\n\n>\
    \ You might wonder if there be some sort of coding style which specifies whether\
    \ people should include or omit these elements of a NixOS module. For example,\
    \ perhaps you might require that all elements are present, for consistency, even\
    \ if they are unused.\n\nMy coding style for NixOS modules is:\n\n- you should\
    \ permit omitting the module arguments\n- you should permit imports, options,\
    \ or config attributes\n- you should avoid cliding the config attribute\n\nIn\
    \ other words, if you do define any options, always nest them underneath the config\
