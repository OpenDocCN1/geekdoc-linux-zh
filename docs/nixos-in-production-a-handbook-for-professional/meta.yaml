  - "[PAGE 25]\n\n# 5. Our first web server\n\nNow that we can build and run a local\
    \ NixOS virtual machine we can create our first toy web server. We will use this\
    \ server throughout this book as the running example which will start off simple\
    \ and slowly grow in maturity as we increase the realism of the example and build\
    \ out the supporting infrastructure.\n\n# Hello, world!\n\nWe will begin from\
    \ the template project from \"Setting up your development environment\". You can\
    \ either begin from the previous chapter by running the following command (if\
    \ you haven't done so already):\n\n```\n$ nix flake init --template github:Gabriella439/nix-in-production*setup\n\
    ```\n\nor if you want to skip straight to the final result of this chapter you\
    \ can run:\n\n```\n$ nix flake init --template github:Gabriella439/nix-in-production*server\n\
    ```\n\nLet's modify module.nix to specify a machine that serves a simple static\
    \ \"Hello, world!\" on http://localhost:\n\n```\n* module.nix\n\n{\n  pkgs, ...\
    \ = ];\n\n  services nginx = {\n    enable = true;\n\n    virtualHosts.localhost.locations.\"\
    / = {\n      index = \"index.html\";\n\n      root = pkgs.writeTextDir \"index.html\"\
    \ ''\n<html>\n<body>\nHello, world!\n</body>\n</html>''\n      '';\n    };\n \
    \ };\n\n  networking.firewall.allowedTCPPorts = [ 80 ];\n\n  virtualisation.forwardPorts\
    \ = [\n    (from = \"host\"; guest.port = 80; host.port = 8080; )\n  ];\n}\n```"
