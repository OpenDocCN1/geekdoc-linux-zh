    \ = libmkEnableOption \"apache\";\n\n  config services apache-kafka.enable =\n\
    \    libmkIf services.kafka enable true;\n};\n```\n\n```\nin\n  imports = [ kafkaSynonym\
    \ ];\n\n  config.services.apache-kafka.enable = true;\"\n```\n\nthen that would\
    \ do the right thing because in the default case services.apache-kafka.enable\
    \ would remain undefined, which would be the same thing as defined as false at\
    \ priority 1500. That avoids defining the same option twice at the same priority.\n\
    \n# mkOrder\n\nThe NixOS module strives to make the behavior of our system depend\
    \ as little as possible on the order in which we import or mkOrder NixOS modules.\
    \ In other words, if we import two modules that we depend on:\n\n```\n{ imports\
    \ = [ /A.nix /B.nix ]; }\n```\n\nthen the behavior shouldn't change if we import\
    \ those two modules in a different order:\n\n```\n{ imports = [ /B.nix /A.nix\
    \ ]; }\n```\n\nand in most cases that is true. 99% of the time you can safely\
    \ sort your import list and either your NixOS system will be exactly the same\
    \ as before (producing the exact Nix store product) or essentially the same as\
    \ before, meaning that the difference is irrelevant. However, for those 1% of\
    \ cases where order matters we need the lib.mkOrder function.\n\nHere's one example\
    \ of where ordering matters:"
- md: "## Advanced option definitions\n\nlet\n\n```nix\nmoduleA = { pkgs, ... }; :\
    \ {\n  environment.defaultPackages = [ pkgs.gcc ];\n};\n\nmoduleB = { pkgs, ...\
    \ }; : {\n  environment.defaultPackages = [ pkgs.clang ];\n};\n```\n\nin\n\n```nix\n\
    imports = [ moduleA moduleB ];\n\nusers.root.initialPassword = \"\";\n```\n\n\
    Both the gcc package and clang package add a cc executable to the PATH, so the\
    \ order matters because here is the first cc on the PATH. In above example, clang's\
    \ is the first on the PATH, because we imported moduleB second:\n\n```bash\n[nixopts::]\
    \ = readlink($type -p cc)\n/n/store/6ssy6fb8vyqrpm8mcgs7s82kkygyg5-clang-wrapper-11.0/bin/cc\n\
    ```\n\nbut if we merge the order:\n\n```nix\nimports = [ moduleB moduleA ];\n\
    ```\n\nthen gcc's cc comes first on the PATH:\n\n```bash\n[nixopts::] = readlink($type\
    \ -p cc)\n/n/store/9wqn04biky07333wk13b5bfj9zv009pl-gcc-wrapper-9.5.0/bin/cc\n\
    ```\n\nThis order-sensitivity frequently allows for \"list-like\" option types,\
    \ including actual lists or string types like lines that concatenate multiple\
    \ definitions. Formately, we can fix situations using the lib.mkOrder function,\
    \ which specifies a numeric ordering that allows merging multiple definitions\
    \ of the same option. Every option's number is 1000 by default, if we set the\
    \ numeric order of clang to 1500:\n\n```nix\nmoduleA = { pkgs, ... }; : {\n  environment.defaultPackages\
    \ = [ pkgs.gcc ];\n};\n\nmoduleB = { lib, pkgs, ... }; : {\n  environment.defaultPackages\
    \ = lib.mkOrder 1500 [ pkgs.clang ];\n};\n```\n\nin\n\n```nix\nimports = [ moduleA\
    \ moduleB ];\n\nusers.root.initialPassword = \"\";\n```\n\n## Advanced option\
    \ definitions\n\n... gcc will always come first on the PATH, no matter which order\
    \ we import the modules.\n\nYou can also use lib.mkBefore and lib.mkAfter, which\
    \ provide convenient synonyms for numeric order 500 and 1500, respectively:\n\n\
    ```nix\nmkBefore = mkOrder 500;\nmkAfter = mkOrder 1500;\n```\n\n... so we could\
    \ have also written:\n\n```nix\nlet\n  moduleA = { pkgs, ... } : {\n    environment.defaultPackages\
    \ = [ pkgs gcc ];\n  };\n  moduleB = { lib, pkgs, ... } : {\n    environment.defaultPackages\
    \ = lib.mkAfter [ pkgs clang ];\n  }\nin\n  imports = [ moduleA moduleB ];\n\n\
    \  users.users.root.initialPassword = \"\";\n```\n\n<br>\n\n# 8. Deploying to\
    \ AWS using Terraform\n\nUntil now we've been playing things safe and test-driving\
    \ everything locally on our own machine. We could even prolong this quite for\
    \ a while because NixOS has advanced support for building and testing clusters\
    \ of NixOS machines locally using virtual machines. However, some point we will\
    \ need to dive in and deploy a server if we're going to use NixOS for real.\n\n\
    In this chapter we'll deploy our TODO app to our first \"production\" server in\
    \ AWS meaning that we will need to create an [AWS account](https://aws.amazon.com/)\
    \ to follow along.\n\n> AWS prices and offers vary so this book cannot provide\
    \ any strong guarantees about what would cost you. However, at the time of writing\
    \ the examples in this chapter would fit well within the current AWS free tier,\
    \ which is 750 t3.micro instance.\n\nEven if there is no free tier, the cost of\
    \ a t3.micro instance is ~$16 / hour or ~$7.50 / month if you never shut it off\
    \ (and you can shut it off when you're not using it). So what this chapter should\
    \ only cost you a few cents from start to finish.\n\nThroughout this book I'll\
    \ take care to minimize your expenditures by showing you how to develop and test\
    \ locally as much as possible.\n\nIn the spirit of Infrastructure as Code, we'll\
    \ be using Terraform to declaratively provision AWS resources, but before doing\
    \ so we generate AWS access keys for programmatic access.\n\n## Configuring your\
    \ access keys\n\nTo generate your access keys, follow the instructions in [Accessing\
    \ AWS using AWS credentials](https://docs.aws.amazon.com/general/latest/gr/aws-credentials.html).\
    \ In particular, take care to not generate access keys for your account's root\
    \ user. Instead, use the Identity and Access Management (IAM) service to create\
    \ a separate user with \"Admin\" privileges and generate keys for that user. The\
    \ difference between a root user and an admin user is that an admin user's privileges\
    \ can be limited or revoked, but the root user's privileges never be revoked.\n\
    \n> The AWS documentation also recommends generating temporary access credentials.\
    \ However, setting this up properly and ergonomically requires using the IAM Identity\
    \ Center which is only permitted for AWS accounts that have set up an AWS Organization.\
    \ That is outside of the scope of this book so instead you should just generate\
    \ long-term credentials for a non-root admin account.\n\nIf you generated your\
    \ access credentials correctly you should have:\n\n- ¹https://aws.amazon.com/premiumsupport/knowledge-center/create-and-activate-aws-account/\n\
    - ²https://docs.aws.amazon.com/general/latest/gr/aws-sec-cred-types.html\n\n##\
    \ Deploying AWS using Terraform\n\n- an access key ID (i.e. AWS_ACCESS_KEY_ID)\n\
    - a secret access key (i.e. AWS_SECRET_ACCESS_KEY)\n\nIf you've already configured\
    \ your development environment to use these tokens by running:\n\n```bash\n$ nix\
    \ run github:NixOS/npkgs/22.11*awscli configure --profile nixos-in-production\n\
    AWS Access Key Id [None]: :\nAWS Secret Access Key [None]: :\nDefault region name\
    \ [None]: :\nDefault format [None]:\n```\n\n## A minimal Terraform specification\n\
    \nNow run the following command to bootstrap your first Terraform project:\n\n\
    ```bash\n$ nix flake init --template github:Gabriella439/nixos-in-production*server\n\
    ```\n\nwhich will generate the following files:\n- module.nix: The NixOS configuration\
    \ for the TODO list web application, except adapted to run on AWS instead of inside\
    \ of a qemu VM.\n- flake.nix: A Nix flake that wraps your NixOS configuration\
    \ so that we can refer to the configuration using the.\n- main.tf: The Terraform\
    \ specification for deploying our configuration.\n\n## Deploying our configuration\n\
    \nTo deploy our configuration, use the following commands:\n\n```bash\n$ nix shell\
    \ github:NixOS/npkgs/22.11*\nterraform init\nterraform apply\n```\n\nAfter that,\
    \ terraform will display the execution plan:\n\n```text\nPlan: 5 to add, 0 to\
    \ change, 0 to destroy.\n\nDo you want to perform these actions?\n```\n\nIf you\
    \ type `yes`, the output will show:\n\n```text\nPlan: 5 added, 0 changed, 0 destroyed.\n\
    ```\n\nThe final output will include the URL for your server:\n\n```text\npublic_dns\
    \ = \"ec2-xxx-xxx-xxx.compute.amazonaws.com\"\n```\n\nIf you open that URL in\
    \ your browser you will see the exact TODO server as before, now running on AWS\
    \ instead of a qemu virtual machine.\n\n## Cleaning up\n\nOnce you verify that\
    \ everything works you can destroy all deployed resources by running:\n\n```bash\n\
    $ terraform apply destroy\n```\n\nterraform will prompt you for the same information\
    \ (i.e. the region) and also prompt for confirmation just like before:\n\n```text\n\
    Plan: 0 to add, 0 to change, 7 to destroy.\n\nDo you want to perform these actions?\n\
    ```\n\nIf you type `yes`, terraform will destroy everything:\n\n```text\nPlan:\
    \ 0 added, 0 changed, 7 destroyed.\n```\n\n## Terraform walkthrough\n\nThe key\
    \ file in our Terraform project is main.tf containing the Terraform logic for\
    \ how to deploy your TODO application.\n\nYou can think of a Terraform module\
    \ as being sort of like a function with side effects, meaning:\n\n- The function\
    \ has inputs: Terraform calls these input variables.\n- The function has outputs:\
    \ Terraform calls these output values.\n- The function does other things than\
    \ producing output values: For example, the function might provide a resource.\n\
    - You can invoke another Terraform module like a function call: in other words,\
    \ one Terraform module can call another Terraform module by supplying the child\
    \ module with appropriate function arguments.\n\nOur starting main.tf provides\
    \ examples of all of the above concepts.\n\n## Input variables\n\nFor example,\
    \ the beginning of the module declares one input variable:"
