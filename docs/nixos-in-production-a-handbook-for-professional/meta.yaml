  md: "# NixOS definitions\n\nIn other words, the fully general case a NixOS module\
    \ is a function whose output is an attribute set with three attributes named imports,\
    \ options, and config.\n\n> Nix supports data structures known \"attribute sets\"\
    \ which are analogous to \"maps\" or \"records\" in other programming languages.\n\
    To be precise, Nix uses the following terminology:\n\n+   - an \"attribute set\"\
    \ is a data structure associating keys with values\n  For example, this is a nested\
    \ attribute set:\n\n```\nbio = { name = \"Alice\"; age = 24; }\njob = \"Software\
    \ engineer\"; }\n```\n\n+   - an \"attribute\" is Nix's name for a key or a field\
    \ of an \"attribute set\"\n  For example, bio, job, name, and age are all attributes\
    \ in the above example.\n\n+   - an \"attribute path\" is a chain of one or more\
    \ attributes separated by dots\n  For example, bio.name is an attribute path.\n\
    \nI am explaining all of this because I'll use the terms \"attribute set\", \"\
    attribute\", and \"attribute path\" consistently throughout the text to match\
    \ Nix's official terminology (even though no other language uses these terms).\n\
    \n# Syntactic sugar\n\nAll elements of a NixOS module are optional and NixOS supports\
    \ \"syntactic sugar\" to simplify several common cases. For example, you can omit\
    \ the module arguments if you don't use them:\n\n```\nimports = {\n}\noptions\
    \ = {\n}\nconfig = {\n}\n```\n\nYou can also omit any of the imports, options,\
    \ or config attributes, too, like in this module, which only imports other modules:"
