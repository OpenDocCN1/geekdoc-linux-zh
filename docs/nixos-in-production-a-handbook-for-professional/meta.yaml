  - "[PAGE 63]\n\n# Deploying AWS using Terraform\n\nin\n\n```\n{ output = aws_instance_todo.public_dns;\
    \ }\n```\n\nOur Terraform deployment declares resources, the first of which declares\
    \ a security group (basically like a firewall):\n\n```\nresource \"aws_security_group\"\
    \ \"todo\" {\n  # The \"nixos\" Terraform module requires SSH access to the target\
    \ machine\n  # our desired NixOS configuration\n  ingress {\n    from_port = 22\n\
    \    to_port = 22\n    protocol = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n\
    \  }\n\n  # We will be deploy our NixOS configuration on the target machine, so\
    \ we\n  # permit all outbound connections so that the build can download any missing\n\
    \  # dependencies\n  egress {\n    from_port = 0\n    to_port = -1\n    protocol\
    \ = \"-\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n  }\n\n  # We need to open port\
    \ 80 so that we can view our TODO list page.\n  ingress {\n    from_port = 80\n\
    \    to_port = 80\n    protocol = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n\
    \  }\n}\n```\n\nThe next three resources generate an SSH key pair that we'll use\
    \ to manage the machine:\n\n+   * Generate an SSH key pair as strings stored in\
    \ Terraform statenresource \"tls_private_key\" \"nixos-in-production\" {\n  algorithm\
    \ = \"ED25519\"\n}\n\n* Synchronize the SSH private key to a local file that the\
    \ \"nixos\" module can\n  use\nresource \"local_sensitive_file\" \"ssh_key_file\"\
    \ {\n  filename = \"$path/module/id_ed25519\"\n  content = tls_private_key.nixos-in-production.private_key.openssh\n\
    }\n\n* Mirror the SSH public key to EC2 so that we can later install the public\
    \ key\n  as an authorized key for our server\nresource \"aws_key_pair\" \"nixos-in-production\"\
    \ {\n  public_key = tls_private_key.nixos-in-production.public_key.openssh\n}"
  - "[PAGE 64]\n\n# Deploying to AWS with Terraform\n\nThe tls_private_key resource\
    \ is currently not secure because the deployment state is stored locally unencrypted.\
    \ We will fix this by storing the deployment state using the S3 backend - but\
    \ that won't be covered until the next chapter.\n\nAfter we get to the actual\
    \ server:\n\n```\nresource \"aws_instance\" \"todo\" {\n  # This will be an AMI\
    \ for a stock NixOS server which we'll get to below.\n  ami = module.ami.ami\n\
    \n  # We could use a smaller instance size, but at the time of writing the\n \
    \ # t3.micro instance type is available for 750 hours under the AWS free tier.\n\
    \  instance_type = \"t3.micro\"\n\n  # Install the security groups we defined\
    \ earlier\n  security_groups = [ aws_security_group.todo.name ]\n\n  # Install\
    \ our SSH key as the authorized key\n  key_name = aws_key_pair.nixos-in-production.key_name\n\
    \n  # Request a bit more space because we will be building on the machine\n  root_block_size\
    \ = 7\n}\n```\n\nFinally, we declare a resource whose purpose is to wait until\
    \ the EC2 instance is reachable via SSH with the \"nixos\" module knows how long\
    \ to wait before deploying the NixOS configuration:\n\n```\n# This ensures that\
    \ the instance is reachable via 'ssh' before we deploy NixOS\nresource \"null_resource\"\
    \ \"wait\" {\n  provisioner \"remote-exec\" {\n    connection {\n      host =\
    \ aws_instance.todo.public_dns\n      private_key = tls_private_key.nixos-in-production.private_key_openssh\n\
    \    }\n    inline = [ \":\" ] # Do nothing; we're just testing SSH connectivity\n\
    \  }\n}\n```\n\n# Modules\n\nOur Terraform module also invokes two other Terraform\
    \ modules (which I'll refer to as \"child modules\") and we'll highlight here\
    \ the module that deploys the NixOS configuration:"
