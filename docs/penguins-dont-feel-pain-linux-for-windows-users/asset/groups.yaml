- md: "\n## Penguins Don't Feel Pain: Linux for Windows Users\n\nLarry Bushey\n· Going\
    \ Linux Podcast ·\n\nSCaLE 8x\nFebruary 21, 2010\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_0_0.png)\n\
    \nThis work is licensed under a Creative Commons Attribution-Share Alike 3.0 United\
    \ States License.\n\n# Penguins Don't Feel Pain\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_1_0.png)\n\
    \nThis work is licensed under a Creative Commons Attribution-Share Alike 3.0 United\
    \ States License.\n\n# Get Prepared\n\n- Confidence\n- Motivation\n- Knowledge\n\
    - Support\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_2_0.png)\n\nThis work is\
    \ licensed under a Creative Commons Attribution-Share Alike 3.0 United States\
    \ License.\n\n# Have Confidence\n\n- You can do it\n- “Linux is for Smart People,\
    \ and You're Not as Dumb as You Think”\n- You are intelligent\n- You have the\
    \ skills\n- You are not alone – You're part of a community!\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_3_0.png)\n\
    \nThis work is licensed under a Creative Commons Attribution-Share Alike 3.0 United\
    \ States License.\n\n## You KNOW you want to make a change!\n\n- Your computer\
    \ used to be fast, right?\n- Your computer freezes or crashes now?\n- Expensive\
    \ antivirus software nagging you to renew or upgrade?\n- There is no risk to trying\
    \ Linux!\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_4_0.png)\n\nThis work is\
    \ licenced under a Creative Commons Attribution-Share Alike 3.0 United States\
    \ License.\n\n## What have you got to lose?\n\n- Viruses and spyware\n- Becoming\
    \ a \"spam factory\"\n- Losing important documents, photos and memories to a crash\n\
    - The ability to use a Windows application you depend on\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_5_0.png)\n\
    \n# Prepare For The Switch\n\n- Use cross-platform Open Source software\n- OpenDisc:\
    \ http://www.theopendisc.com\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_6_0.png)\n\
    \n## Now It's Easy To Move To Linux\n\n- Learn how to move your\n  - E-mail\n\
    \  - Browser favorites (bookmarks)\n  - Application preferences painlessly from\
    \ Windows to Linux\n\n- Thunderbird – e-mail\n- Move \"C:\\Documents and Settings\\\
    [User Name]\\Application Data\\Thunderbird\\Profiles\" to \"~/.mozilla-thunderbird\"\
    \n- Firefox – web browser\n- Move \"C:\\Documents and Settings\\[User Name]\\\
    Application Data\\Mozilla\" to \"~/.mozilla/\"\n- OpenOffice.org – office suite\n\
    - Move \"C:\\Documents and Settings\\[User Name]\\Application Data\\OpenOffice.org\\\
    3\" to \"~/.openoffice.org/3/\"\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_7_0.png)\n\
    \nThis work is licensed under a Creative Commons Attribution-Share Alike 3.0 United\
    \ States License.\n\n# Find Your Software\n\n- Linux alternatives for your favorite\
    \ applications\n- Use Your Package Manager!\n\nIf you **must** install third party\
    \ software:\n\nTop 100 applications:\nhttp://ubuntulinuxhelp.com/top-100-of-the-best-useful-opensource-applications/\n\
    \nList of equivalents:\nresources.goinglinux.com#SoftwareEquivalents\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_8_0.png)\n\
    \n> This work is licenced under a Creative Commons Attribution-Share Alike 3.0\
    \ United States License.\n\n# Use a LiveCD\n\n- Assure yourself that your hardware\
    \ (computer, printer, router, etc.) will work with Linux.\n- Linux Mint: http://www.linuxmint.com\n\
    - Ubuntu: http://www.ubuntu.com\n\nHow to burn a LiveCD:\nhttp://goinglinux.com/screencasts.html#glsc003\n\
    \n![](img/cb08a6ee76abf6cf613bd8bd44db367d_9_0.png)\n\n# You are not on your own!\n\
    \n- Tap-in to the support network for your new operating system and its applications\n\
    \  - On-computer help\n    - Help system\n  - “Virtual” help\n    - On-line help\
    \ resources\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_10_0.png)\n\nThis work\
    \ is licenced under a Creative Commons Attribution-Share Alike 3.0 United States\
    \ License.\n\n# You are not on your own!\n\n- “Virtual” and on-line help\n  -\
    \ Help from the publisher of your version of Linux\n    - Website, wiki or forum\n\
    \  - Help from the Linux community\n    - Distribution-agnostic wikis & forums\
    \ like linuxquestions.org\n    - Blogs & websites like goinginux.com\n    - Podcasts\
    \ like:\n      - Category5 or Computer Action Show (video)\n      - Linux Outlaws\
    \ or Going Linux (audio)\n  - Traditional media like:\n    - The Tech Guy\n  \
    \  - Computer America\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_11_0.png)\n\n\
    # Believe you can do this\n\n- For the first time, the pain of change is lower\
    \ than the pain of continuing to use Windows\n- You have the confidence that you\
    \ can do it yourself\n- You aren't by your yourself\n- You have nothing to fear\n\
    \n![](img/cb08a6ee76abf6cf613bd8bd44db367d_12_0.png)\n\nThis work is licenced\
    \ under a Creative Commons Attribution-Share Alike 3.0 United States License.\n\
    \n# Feel No Pain\n\n- Be like the penguin\n- Be prepared\n- Feel no pain\n- Try\
    \ Linux\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_13_0.png)\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_13_1.png)\n\
    \nThis work is licensed under a Creative Commons Attribution-Share Alike 3.0 United\
    \ States License.\n\n# Larry Bushey\nCreator and Host\n· Going Linux Podcast ·\n\
    \ngoinglinux@gmail.com\nhttp://goinglinux.com\n\nThis work is licenced under a\
    \ Creative Commons Attribution-Share Alike 3.0 United States License.\n"
  mdcn: "\n\n## 企鹅无痛：Windows 用户的 Linux 之路\n\nLarry Bushey\n· Going Linux Podcast\n\
    \nSCaLE 8x\n2010年2月21日\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_0_0.png)\n\n\
    本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n# 企鹅无痛\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_1_0.png)\n\
    \n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n# 做好准备\n\n- 信心\n- 动力\n- 知识\n- 支持\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_2_0.png)\n\
    \n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n# 拥有信心\n\n- 你可以做到的\n- “Linux 是给聪明人用的，而你并没有你想象中那么笨”\n\
    - 你很聪明\n- 你拥有这些技能\n- 你并不孤单——你是社区的一员！\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_3_0.png)\n\
    \n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n## 你很清楚你想想要改变！\n\n- 你的电脑曾经运行很快，对吧？\n- 现在你的电脑经常死机或崩溃？\n\
    - 昂贵的防病毒软件不断催促你续费或升级？\n- 尝试 Linux 没有任何风险！\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_4_0.png)\n\
    \n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n## 你能失去什么？\n\n- 病毒和间谍软件\n- 变成一个“垃圾邮件工厂”\n\
    - 因崩溃而丢失重要的文档、照片和记忆\n- 使用你依赖的 Windows 应用程序的能力\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_5_0.png)\n\
    \n# 为切换做好准备\n\n- 使用跨平台开源软件\n- OpenDisc: http://www.theopendisc.com\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_6_0.png)\n\
    \n## 现在迁移到 Linux 变得简单\n\n- 学习如何从 Windows 无缝地迁移你的\n  - 电子邮件\n  - 浏览器收藏（书签）\n  -\
    \ 应用程序偏好\n\n- Thunderbird – 电子邮件\n- 将 \"C:\\Documents and Settings\\[User Name]\\\
    Application Data\\Thunderbird\\Profiles\" 移动到 \"~/.mozilla-thunderbird\"\n- Firefox\
    \ – 网页浏览器\n- 将 \"C:\\Documents and Settings\\[User Name]\\Application Data\\Mozilla\"\
    \ 移动到 \"~/.mozilla/\"\n- OpenOffice.org – 办公套件\n- 将 \"C:\\Documents and Settings\\\
    [User Name]\\Application Data\\OpenOffice.org\\3\" 移动到 \"~/.openoffice.org/3/\"\
    \n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_7_0.png)\n\n本作品采用知识产权 署名-相同共享 3.0\
    \ 美国许可协议进行许可。\n\n# 寻找你的软件\n\n- 为你喜爱的应用程序寻找 Linux 替代方案\n- 使用你的包管理器！\n\n如果你**必须**安装第三方软件：\n\
    \n前 100 应用程序：\nhttp://ubuntulinuxhelp.com/top-100-of-the-best-useful-opensource-applications/\n\
    \n等效软件列表：\nresources.goinglinux.com#SoftwareEquivalents\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_8_0.png)\n\
    \n> 本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n# 使用 LiveCD\n\n- 确保你的硬件（电脑、打印机、路由器等）可以在\
    \ Linux 上运行。\n- Linux Mint: http://www.linuxmint.com\n- Ubuntu: http://www.ubuntu.com\n\
    \n如何刻录 LiveCD：\nhttp://goinglinux.com/screencasts.html#glsc003\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_9_0.png)\n\
    \n# 你并不孤单！\n\n- 接入你新操作系统及其应用程序的支持网络\n  - 计算机内置帮助\n    - 帮助系统\n  - “虚拟”帮助\n   \
    \ - 在线帮助资源\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_10_0.png)\n\n本作品采用知识产权\
    \ 署名-相同共享 3.0 美国许可协议进行许可。\n\n# 你并不孤单！\n\n- “虚拟”和在线帮助\n  - 来自你所使用的 Linux 版本发行者的帮助\n\
    \    - 网站、wiki 或论坛\n  - 来自 Linux 社区的帮助\n    - 不特定于发行版的 wiki 和论坛，如 linuxquestions.org\n\
    \    - 博客和网站，如 goinginux.com\n    - 播客，如\n      - Category5 或 Computer Action\
    \ Show (视频)\n      - Linux Outlaws 或 Going Linux (音频)\n  - 传统媒体如：\n    - The Tech\
    \ Guy\n    - Computer America\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_11_0.png)\n\
    \n# 相信你能做到\n\n- 第一次，改变的痛苦将低于继续使用 Windows 的痛苦\n- 你有信心可以自己完成\n- 你不是孤单的\n- 你无可畏\n\
    \n![](img/cb08a6ee76abf6cf613bd8bd44db367d_12_0.png)\n\n本作品采用知识产权 署名-相同共享 3.0\
    \ 美国许可协议进行许可。\n\n# 无痛体验\n\n- 像企鹅一样\n- 做好准备\n- 感觉不到痛苦\n- 尝试 Linux\n\n![](img/cb08a6ee76abf6cf613bd8bd44db367d_13_0.png)\n\
    ![](img/cb08a6ee76abf6cf613bd8bd44db367d_13_1.png)\n\n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\
    \n# Larry Bushey\n创作者与主持人\n· Going Linux Podcast\n\ngoinglinux@gmail.com\nhttp://goinglinux.com\n\
    \n本作品采用知识产权 署名-相同共享 3.0 美国许可协议进行许可。\n\n"
