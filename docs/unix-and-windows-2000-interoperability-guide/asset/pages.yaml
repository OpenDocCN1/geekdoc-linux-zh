    # 5.3 Network Application Interfaces


    Before we move on to describing the Application Layer in the next chapter, let’s
    look briefly at network application interfaces in both HP-UX and Windows 2000.


    # 5.3.1 Windows 2000


    There are primarily two network application program interfaces (APIs) used in
    Windows 2000: the Windows Sockets API and the NetBIOS API. Figure 5–1 depicts
    the relationship between these APIs and the TCP and UDP protocols.


    # 5.3.1.1 Windows Sockets


    Windows Sockets is based on the interface developed at the University of California
    Berkeley. The version shipped with Windows 2000 is 2.2 and is commonly known as
    Winsock2. Windows 2000 TCP/IP utilities such as Telnet and FTP, as well as applications
    such as Internet Explorer, are Winsock clients. These clients resolve host name
    and IP addresses using tools already familiar to UNIX administrators: HOSTES files
    and DNS.


    # 5.3.1.2 NetBIOS Interface


    Chapter 2, “What Is Windows 2000?,” briefly described the origins of NetBIOS.
    Windows 2000 networking services—the workstation, server, messenger, netlogon,
    browser—are NetBIOS applications. The term NetBIOS also refers to the protocols
    that support the API: name service, datagram service, and session service. These
    services can run over TCP/IP in addition to IPX/SPX and NetBEUI. NetBIOS implements
    NetBIOS over TCP/IP via a kernel component known as NetB.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Network Application Interfaces


    ![](img/1c1e7552b53cca888836b6c6895bdb48_84_0.png)


    > Figure 5-1 Windows 2000 application programming interfaces. Both APIs use TCP
    and UDP. From Microsoft Windows 2000 Server TCP/IP Core Networking Guide, p. 17.


    NetBT utilizes a different name resolution scheme, employing things as broadcasts,
    LMHOSTS files, and the Windows Internet Naming Service (WINS). Therefore, you
    need to manage both WinSock and NetBIOS name resolution in a Windows-based network.
    However, as stated in Chapter 2, the Windows 2000 workstation and server services
    support direct host hosting—but for computers running Windows 2000 only. With
    direct hosting, clients use DNS to resolve names and send communication to TCP
    port 445 (where NetBIOS session communication normally takes places).


    # 5.3.2 HP-UX


    As late as version 10.20, HP-UX TCP/IP is Berkeley sockets-based. In version 11,
    it is now STEAMS-based. Uresh Vahalia, in UNIX Internals: The Frontiers. (Prentice
    Hall, 1996), p. 548, describes it: "A stream is a full-duplex processing and data
    transfer path between a driver in kernel space and a process in user space. STEAMS
    is a collection of system calls, kernel resources, and kernel utility routines
    that create, use, and dismantle a stream."


    STRE-based network applications resolve host names and IP addresses, using either
    a HOSTS file, DNS, Network Information Services (NIS), or a combination of all
    three. There is no need to use WINS or the equivalent of an LMHOSTS file unless
    you install a product such as Hewlett-Packard’s Advanced Server/9000, which installs
    NetBIOS into the kernel.'
