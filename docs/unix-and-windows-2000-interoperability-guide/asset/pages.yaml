- pgno: 85
  md: '# 5.4 Conclusion


    We looked at the two protocols found at the transport layer of the TCP/IP protocol
    suite: the connection-oriented TCP and the connectionless UDP. You can tune TCP
    parameters in both HP-UX and Windows 2000, though exactly which ones depends on
    the operating system. NFS and NetBIOS have used UDP extensively for years, though
    the trend is toward TCP. Network APIs for Windows 2000 include WinSock and NetBIOS.
    HP-UX has transitioned from Berkeley sockets to STREAMS.


