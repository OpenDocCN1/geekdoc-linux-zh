- pgno: 22
  md: '# What Is UNIX?


    Formally, the name UNIX is a registered trademark of The Open Group, an international
    consortium of vendors and customers dedicated to the advancement of open systems.
    In everyday use, however, means any variant, derivative, or clone of the operating
    system first developed by AT&T''s Bell Laboratories in the 1970s. These variants
    include the commercially available HP-UX from Hewlett-Packard, AIX UNIX from IBM,
    Solaris from Sun Microsystems, UnixWare from SCO, and Tru64 UNIX from Compaq.
    These UNIX systems run mostly on RISC-based or Intel-based processors and usually
    contain modifications, additions, or other "enhancements" to make each of them
    different from the other, sometimes significantly different. Also available, for
    free on the Internet, are NetBSD, FreeBSD, and Linux. FreeBSD runs exclusively
    on Intel processor-based computers, while the others run on different platforms.
    Such operating systems are developed and maintained by volunteers who believe
    strongly in open systems and some form of open source software.


    Obviously, then, there is no such thing as THE operating system; there are many.
    Each has its own distinct characteristics, these operating systems have enough
    in common to warrant the designation of UNIX operating system. So, why is this
    the case? Where did UNIX come from anyway? Well—please don''t groan—to answer
    these questions, we have to look at a little history.


    # 1.1 In the Beginning


    UNIX began as an in-house project within AT&T''s Bell Telephone Labs (BTL) in
    1969. Two BTL staff members, Ken Thompson and Dennis Ritchie, began writing an
    operating system on a DEC PDP-7, in part to run a simulation program (and game)
    called Space Travel. Originally, Space Travel ran on a mainframe operating system
    called Multics (Multiplexed Information and Computing Service), and as it is on
    this acronym the new operating system eventually became called UNIX.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 1 · What is UNIX?


    UNIX underwent several editions in the early 1970s, but it remained primarily
    an internal operating system to BTL until 1974. In that year, Ritchie and Thompson
    published a paper describing UNIX in a computer science journal, and as a result,
    a number of academic institutions began copies of it for educational purposes.
    AT&T agreed to do so for a small fee, just enough to cover the cost of reproducing
    the tape and documentation. AT&T, operating under a consent at the time and really
    not in the computer operating system business, decided that releasing UNIX to
    universities in this manner and without support would be permissible.


    So, institutions receiving a copy of UNIX in those days got not only the compiled
    code as well. And because AT&T provided no support for UNIX, these sites felt
    to fix bugs and make changes and additions on their own. These changes made their
    way back to BTL and became incorporated into the next release of UNIX. One significant
    source of change came from the University of California-Berkeley. In 1975, Ken
    Thompson went to Berkeley, his alma mater, as a visiting professor, bringing with
    him the latest version of UNIX. Two graduate assistants, Bill Joy and Chuck Haley,
    quickly started hacking on the operating system, and this work eventually led
    to a separate distribution of UNIX, called BSD (Berkeley Distribution), first
    appearing in 1978.


    Meanwhile, work continued at AT&T, which released version 7 of UNIX in 1979. The
    releases of UNIX—one from AT&T and one from Berkeley—each had differences to warrant
    the widely growing view that they were two separate entities. In reality, contributions
    to UNIX came from many sources and grew tremendously in the 1980s. Sometimes,
    individuals passed on their contributions to BSD, and some of BSD’s were passed
    on to AT&T. Companies like SCO and Microsoft got into the act, releasing a version
    of UNIX called Xenix in 1980. Others, like Hewlett-Packard, Sun Microsystems,
    DEC, Apollo, and IBM began offering UNIX systems for their hardware, each containing
    elements of both AT&T and BSD of UNIX, as well as their enhancements.


    The result is that today there are many flavors of UNIX, all of which have roots
