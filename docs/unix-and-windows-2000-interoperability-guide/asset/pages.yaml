- pgno: 31
  md: '# Chapter 1 • What Is UNIX?


    When a user logs into a system, usually one of two mechanisms authenticate that
    user: the password and group files (/etc/passwd and /etc/group) or the Network
    Information Service (NIS). Both of these mechanisms establish the user and group
    identifiers (UIDs and GIDs) of each authenticated user. Among other attributes,
    the file system stores the UID and GID of the owner of each file and directory
    in an on-disk structure called an inode, sometimes called file system metadata.
    Also stored for each file is its permissions.


    Three classes of users can access files and directories: owner, group, and other.
    Owner is usually the person who created the file, group is several users grouped
    together and who share permissions, and other is all other users. For each of
    these classes there are three types of access permissions: read, write, and execute.
    These permissions mean different things, depending on whether you are talking
    about files or directories. Table 1–2 describes these differences.


    # Table 1–2 Standard UNIX Permissions


    | Permission | Means This for a Directory | Means This for a File |

    |---|---|---|n| read (r) | Users can view names of files and directories in that
    directory. | Users can view the contents of the file. |

    | write (w) | Users can create, rename, or remove files or directories contained
    in that directory. | Users can change the contents of the file. |

    | execute (x) | Users can view the contents of files within the directory, and
    run commands, scripts, and programs within that directory. | Users can run the
    file (execute it) by typing the file name at the command prompt. |


    To determine a file’s permissions, you use the `ls -l` command, which displays
    the following information:


    +   * Whether the item is a file or directory

    * The access permissions for each of the three classes of users (owner, group,
    and other)

    * Number of links

    * Name of the owner

    * Name of the group

    * Size in bytes

    * Date and time of last modification'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# The Elements of UNIX


    For example, if you type the following command:


    ```

    $ ls -l myfile

    ```


    you will get output something like this:


    ```

    -rw-r--r-- 1 leslie 154 Nov 4 10:18 myfile

    ```


    The first dash on the left indicates that myfile is a file. Were it a directory,
    you would see a d in place of the dash. Each of the other items is explained in
    the Table 1–3.


    # Table 1–3 Explanation of ls -l


    | Output | Meaning | Explanation |

    |---|---|---|

    | rw-r--r-- | Permissions | Permissions are displayed in groups of three. Owner
    leslie has read and write permission. Group users and others have read-only permission.
    If a permission is not allowed, a dash appears in place of the letter. |

    | | Number of links | Each entry has at least one link. |

    | leslie | The owner of the file | leslie is owner. |

    | users | Group | These are the permissions of the users group. |

    | 154 | Size of the file in bytes | A very small file. |

    | Nov 4 10:18 | Modification date | If the time of last modification was more
    than six months ago, the year is substituted for the hour and minute. |

    | myfile | The file name | myfile is the item being listed. |


    If you use the ls -l command by itself, you will see a listing of files in the
    current working directory. If you supply that command with the name of a directory
    as an argument, then you will get a listing of the contents of directory. If you
    want to see the permissions on a directory without seeing a listing of all its
    files, use the ls -l command.


    HP-UX supports commands that alter permissions: chown to change a file''s ownership,
    chgrp to change a file''s group, and chmod to change the actual permissions. However,
    the way in which each of these commands differs between the two operating systems.
    Check the man pages on the respective system for more information.'
  merge: -1
