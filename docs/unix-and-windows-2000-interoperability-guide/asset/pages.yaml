    # 11.5.2 Exporting Directories


    After ensuring that User Mapping is correct, export your directories with the
    appropriate options, particularly if you need root access. Also, remember that,
    unlike Regular shares, NFS shares are case-sensitive. For example, if you export
    a directory with an NFS share named Home, the client must mount the directory
    with the name Home, not.


    # 11.5.3 Local Permissions


    To ensure proper access to directories, be sure that the local file system permissions
    are correct. On Windows 2000, this means that you should export directories only
    from NTFS volumes If you have exported and mounted file systems with read/write
    permission, the local file system permissions may still prevent users from working
    properly with their mounted files and directories.


    # 11.5.4 Overall Experience


    Both Client for NIS and Server for Windows worked well, the client''s connection
    with the HP-UX server was a bit slow (two to three seconds), and this was on an
    isolated network. Here, read and write performance was satisfactory after connection.


    I did find, however, that having Windows 2000 configured as an NFS server was
    often tricky, involving the coordination of Server for NIS, User Name Mapping,
    and Server for NFS. For HP-UX users who need more than occasional access to files
    stored on a Windows 2000 server, it might be better to use a CIF on the HP-UX
    system, which we will look at in the next chapter.


    This chapter in now provides a comprehensive description on using NFS for file
    sharing HP-UX and Windows systems. For more in-depth information, see the Help
    pages that accompany Windows Services for UNIX and Hewlett-Packard''s Configuring
    and Admin NFS.


