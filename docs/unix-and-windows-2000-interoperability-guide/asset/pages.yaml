    # 7.2.2 Security Problems


    The ability of BIND 8.1.2 running on HP-UX11 to handle dynamic updates is great,
    but there is a caveat. As of this writing, the Internet Software Consortium (ISC)
    has announced at least two serious bugs binding BIND version 8.1.2: the "solinger"
    bug and the "fdmax" bug. (See www://isc.org/products/BIND/bin.8.html). For this
    reason, the ISC recommends that you upgrade to least BIND 8.2.2 patch level 5,
    which Hewlett-Packard does not support at this time. By the time this is published,
    HP will very well do so. But to do so, you must integrate BIND with Active Directory.


    According to Microsoft’s Microsoft Windows 2000 Server TCP/IP Core Networking
    Guide, p. 406. "Windows 2000 secures dynamic updates through the Generic Service
    Application Program Interface (GSS-API, specified in RFC 2708 rather than Domain'
  merge: -1
