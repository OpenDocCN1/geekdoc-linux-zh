- pgno: 39
  md: '# Chapter 2 · What Is Windows 2000?


    Therefore, while it is possible to refer to the kernel as the operating system
    in UNIX (which a lot of people do), in Windows 2000, the operating system is more
    than just the kernel. It consists of the HAL, the microkernel, device drivers,
    and several kernel-mode components, such as the I/O Manager, Memory Manager, and
    the Process Manager.


    Running in user mode is the POSIX, Win 32, and OS/2 subsystems. The POSIX subsystem
    provides APIs to enable POSIX-based applications to run. The OS/2 subsystem provides
    a set of APIs for 16-bit, character-based applications. Win 32 is a subsystem
    that provides an environment for running Win 16 and MS-DOS applications, as well
    as Win32-based applications. Also running in user mode are several integral subsystems.
    These subsystems perform essential operating system functions such as security
    services and the server and workstation services.


    # 2.3 Elements of Windows 2000


    Please note that in this book, the term directory is used interchangeably with
    the term folder. (I will also use the term login and logon interchangeably.)


    # 2.3.1 The Registry


    Windows 2000, like NT, keeps hardware and software settings in a hierarchical
    database called the Registry. Other versions of Windows keep this information
    in text files, often ending in .ini. UNIX systems, with the exception of AIX,
    still rely heavily on configuration files. However, you cannot change the contents
    of the Registry using a text editor. Instead, you use the Registry Editor, regedt2.exe.


    In Windows 2000, the Registry contains information about virtually everything
    installed on a particular system, things such as hardware (for example, CPU and
    bus type), device drivers, applications, and network settings. The following describe
    the components that use the Registry. (Taken from the Microsoft Windows 2000 Beta
    Training Kit, pp. 117–118).2


    # Windows NT Kernel


    During system startup, the kernel, ntoskrnl.exe, reads information from the Registry,
    including the device drivers to load and the order in which they should be loaded.
    The kernel writes information about itself to the Registry, such as the version
    number.


    # Device Drivers


    Device drivers receive configuration parameters from the Registry and also write
    information to it. A device driver informs the Registry which system resources
    it is using, such as hardware interrupts or DMA channels. Device drivers also
    report configuration data.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Elements of Windows 2000


    Setup Programs

    A setup program can add new new configuration data to the Registry when it installs
    hardware or software. It can also query the Registry to determine whether required
    components have been installed.


    Ntdect.com

    On Intel-based computers, ntdet.com scans the system for the hardware. It adds
    configuration information to the Registry for components it discovers. RISC-based
    computers extract such data from the computer firmware.


    Hardware Profiles

    Computers with two or more hardware configurations use hardware profiles. When
    Windows 2000 starts, the user selects a hardware profile. Windows 2000, with the
    Registry, then configures the system accordingly.


    User Profiles

    Windows 2000 creates and maintains user environmental settings in a user profile.
    When a user logs on, the system caches the profile in the Registry. Windows 2000
    first writes user configuration changes to the Registry and then to the user profile.


    # 2.3.2 Active Directory


    Active Directory is Windows 2000''s directory services. Directory services enables
    users and applications to locate network resources, including user data, servers,
    and printers. Active Directory uses the Domain Name System (DNS) to locate network
    names and Lightweight Directory Access Protocol (LDAP) or HyperText Protocol (HTTP)
    for obtaining resource information. Because of its reliance on DNS, Active Directory
    domain names coincide with DNS names, though an Active Directory domain is not
    exactly the same thing as a DNS domain.


    # 2.3.3 User Interfaces


    In Chapter 1, we saw that UNIX traditionally provided a default shell with which
    to run commands and applications. In recent years, HP-UX, AIX, and Solaris have
    provided a graphical user interface (GUI) called the Common Default Environment
    (CDE), which makes a number of day-to-day tasks easier. Additionally, all major
    forms of UNIX provide some of system management tool, such as SAM in HP-UX and
    SMIT in AIX, to help simplify system administration. Windows 2000 provides similar
    tools: a command interpreter, a GUI, and a system administration tool known as
    the Microsoft Management Console (MMC).


    # 2.3.3.1 Command Interpreter


    The Windows 2000 application C:\SystemRoot%/System32/cmd.exe starts a window running
    what looks like an MS-DOS prompt. (See Figure 2–2.) Actually, it is a 32-bit program
    that, according to the Help page, “retains and enhances almost all the functionality'
