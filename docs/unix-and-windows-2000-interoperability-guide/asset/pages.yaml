- pgno: 189
  md: '![](img/1c1e7552b53cca888836b6c6895bdb48_189_0.png)


    You cannot export a directory and its parent if they are on the same disk or logical
    volume. The same goes for directory (/) and one of its subdirectories. For example,
    you cannot export the root directory (/) and /opt if both reside on the same disk
    or logical volume. If two directories reside in the same tree but on different
    disks or logical volumes, then you can export both as long as you do so explicitly
    in /etc/exports.


    # 11.3.2.1 Symbolic Links


    Watch for symbolic links when exporting file systems on HP-UX (or any UNIX system,
    for that matter). A symbolic link is a file name that points to a file located
    elsewhere. If the link points to a file outside the file system being exported,
    the Windows 2000 Client NFS client will not be able to access the file, even though
    an icon for the link appears in Windows Explorer.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Windows 2000 NFS Client/HP-UX NFS Server


    # 11.3.2.2 Permissions


    Regular HP-UX file and directory permissions override any export permissions.
    Therefore, even if you export a file system as read-write, only users with the
    right HP-UX permissions actually read or write data on a mounted file system.
    You can also specify access permissions on the mount operation on the client side.
    If the mount permissions differ from the export permissions, the more restrictive
    permissions take precedence.


    # 11.3.3 Using Client for NFS


    After you install Client for NFS, you get a new folder in My Network Places called
    NFS Network. After you find this folder, double-click on My Network Places and
    then on Entire Network. In this folder is an icon called Default LAN, which represents
    all the NFS servers discovered via broadcast on the local segment. There is also
    an icon called Favorite LAN. You can add NFS servers from different segments to
    this folder, the idea being to add those that you use most frequently.


    You can see what a particular NFS server is exporting by right-clicking on the
    icon representing that server and selecting Properties. You will get a window
    similar to the one shown in Figure 11–5.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_190_0.png)


    **Figure 11–5** NFS server properties.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'This screen shows the NFS Server hpux1 exporting the /downloads directory with
    everyone having access. I configured this server using the process described in
    the previous section. This configuration gives users with a recognized UID read/write
    access to /downloads. Anonymous users have read-only access. Double-clicking on
    an NFS Server icon will display icons representing all the exported directories.
    If right-click on one of them and select Properties, you get a window describing
    that directory''s attributes.


    # 11.3.1 Mounting a File System


    Before a user can mount a file system, you should set up User Name Mapping and
    then direct Client for NFS to use the name mapping server. To do the latter, open
    the Services for UNIX Administration MMC, and select Client for NFS, as shown
    in Figure 11–6.


    On the Authentication page, provide the name of your User Name Mapping server.
    When a user tries to access an NFS resource, Client for NFS sends his or her Windows
    user name to the User Name Mapping server. This server checks to see if the user
    has been mapped to a UNIX account. If so, the server returns the UID and GID to
    Client for NFS, which then embeds them into the NFS request. If there is no mapping
    for the user account, Client for NFS assigns –2 for the UID and –1 for the GID,
    establishing anonymous access.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_191_0.png)


    Figure 11–6 Defining the User Name Mapping server.


    You mount NFS resources using either the mount command or use Map Network Drive.
    See the Help pages for more information on the mount command. The following is
    the procedure listed in Help for using Map Network Drive:'
