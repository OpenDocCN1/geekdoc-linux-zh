    \ order to do this. For Windows 2000 systems, you either need to install the\n\
    Data Link Control (DLC) protocol (through Local Area Connection Properties) or\
    \ use the\nStandard TCP/IP Port Monitor (SPM). Windows 2000 print servers can\
    \ contain the printer driv-\ners for Windows clients to print to JetDirect cards,\
    \ but HP-UX systems must have the appropri-\nate interface model scripts installed\
    \ locally. Printing to JetDirect printers is one simple way for\nboth Windows\
    \ 2000 and HP-UX clients to share printers. Another way is to print with locally\n\
    attached printers using technology based on the old line printer daemon (LPD).\n\
    \n# 13.3.1 HP-UX Print Server with Locally Attached Printer\n\nFirst, you must\
    \ attach your printer to the HP-UX system and—if you're smart—use SAM to\nconfigure\
