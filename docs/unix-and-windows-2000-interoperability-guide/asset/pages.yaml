  md: '# 11.5.1 User Mapping


    Key to the successful working of NFS, wherever it''s configured, is the correct
    use of the User Mapping Service. First and foremost, you need to use Advanced
    Mapping in this service to map the root user on HP-UX systems to the Administrator
    account on Windows 2000. Even if you export directories with root access, you
    must map these accounts in order for the permissions to work properly. The combination
    of mapping the root and Administrator accounts and the exporting of directories
    with root access provides administrators appropriate rights.


    For other user accounts, it helps to have your HP-UX user names and Windows 2000
    user names match each other exactly. If you create an account on Windows 2000
    with Server for NIS running, this is done for you automatically, provided you
    ensure that the UNIX attributes tab is properly configured. For example, see Figure
    11–14.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_201_0.png)


    **Figure 11–14** Enabling the NIS user. Select the user in Active Directory Users
    and Computers, right-click, and choose Properties. Then click the UNIX attributes
    tab.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'I created the account hilary using Active Directory Users and Computers. I
    then opened that user''s Properties to get to the UNIX attributes tab. You have
    to enable a new user for NIS by selecting the appropriate NIS domain name, which
    I did with this user. I also chose a Primary Group called tech, which also exists
    in NIS. As a result, whenever hilary accessed an NFS resource, User Mapping automatically
