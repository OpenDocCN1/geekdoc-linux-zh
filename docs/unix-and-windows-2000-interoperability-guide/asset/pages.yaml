- pgno: 72
  md: '# 4.2.5.2 HP-UX


    Both default and persistent routes are normally set in startup files. You can
    use SAM and set_params to configure a default gateway, or you can issue the following
    command:


    ```

    # /usr/sbin/route add default gateway_address 1

    ```


    The gateway_address argument is the IP address of the gateway host. Then, set
    the follow-ing environment variables in the /etc/rc.config dnetconf file:


    ```

    ROUTE_DESTINATION []="default"

    ROUTE_GATEWAY []="gateway_address"

    ROUTE_COUNT []="1"

    ```


    If the default gateway is your own host, set the ROUTE_COUNT variable to 0. Otherwise,
    set it to 1.


    To set up additional routes, type the command for each network you need to reach:


    ```

    #/usr/sbin/route add network_address gateway_address

    ```


    Then, create a new set of routing variables in the /etc/rc.config dnetconf file
    for each new route. Whenever you create a new set of variables, increment the
    number in the square brackets.


    ```

    ROUTE_DESTINATION [n]="gateway_address"

    ROUTE_GATEWAY [n]="gateway_address"

    ROUTE_COUNT [n]="1"

    ```


    # 4.2.6 Multihoming and Routing


    Windows 2000 and HP-UX differ in their concepts of multihoming. According to 2000
    documentation, any system with multiple IP addresses is a multihomed machine.
    There, multihoming can handle multiple IP addresses for a single NIC. HP-UX views
    multihoming as a system with multiple NICs, each of which has a separate IP address.
    On HP-UX, having multiple IP addresses on a single physical interface requires
    the use of a logical interface. Logical interfaces are configured at startup using
    the ifconfig command.


    To enable IP forwarding on Windows 2000, you must configure and start the Routing
    and Remote Access service. Among other things, this service enables you to convert
    your Windows 2000 Server into a router. Routing and Remote Access is installed
    by Windows 2000 Server but is not enabled until you Start→Programs→Administrative
    Tools→Routing and Remote Access. By default, HP-UX will automatically route across
    multiple NICs. Both Windows 2000 and HP-UX support RIP and OSPF.


    # 4.2.7 ICMP Redirects


    Both 2000 and HP-UX support ICMP redirects. For both systems, the ICMP redirect
    must come from the current first-hop router, and the new router must be directly
    attached to the network of the originating host. Also, the routing table entry
    created by an ICMP redirect must be a host, not a route. For Windows 2000, the
    new route has a 10-minute lifetime. For HP-UX, this lifetime is five minutes.
    To set a different value for HP-UX, use the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'ndd -set/dev/ip ip_ire_redirect_interval command. For example, to set the value
    to six minutes,

    type the following:


    ```

    # nd -set /dev/ip ip_ire_redirect_interval 360000

    ```


    # 4.2.8 Router Discovery


    4.2.8.1 Windows 2000


    Windows 2000 systems ICMP router discovery, a dynamic method of determining the
    best

    default gateway. Routers configured with ICMP router discovery periodically broadcast
    router

    adisements from which clients can choose the most appropriate default route. Hosts
    config-\ured to be router clients join the all-multicast group of 224.0.0.1 in
    order to list-

    ten to these advertisements upon system startup. Clients choose a default gateway
    among the

    advertisements it receives. In addition to listening for router advertisements,
    hosts can actually

    solic routers using the 224.0.0.2 multicast address. You can configure Windows
    2000 hosts for

    router discovery by setting the following registry entry to a value of 1:


    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\ParametersPerformRouterDiscovery


    # 4.2.8.2 HP-UX


    HP-UX implements ICMP router discovery on clients via rdp, the router discovery
    daemon.

    preferably calling it to the Router Discovery Protocol (RDP). RDP on client works
    the same as

    ICMP router discovery on Windows 2000 clients. Clients listen for router advertise-\ments
    over the all-multicast address of 224.0.0.1 or the NIC''s broadcast address. The
    cli-

    ent also sends solicitations to the all-routers multicast address of 224.0.0.2.


    You can start rdp either by setting the RDP variable in /etc/rc.conf/netconf to
    1 and

    reboot (or restarting the /sbin/init.d start command) or by configuring gated.
    Gated is a

    router daemon that handles multiple routing protocols, including Routing Information
    Protocol

    (RIP), Border Gateway Protocol (BGP), External Gateway Protocol (EGP), the Hello
    Protocol

    (HELLO), Shortest Path First (OSPF), and RDP. To configure gated, edit the /etc-

    gated.conf file and change the GATED variable in /etc/rc.conf/netconf 1. For more
    informa-

    run the following commands:


    ```

    # man gated

    # man 4 gated.conf

    ```


    Do not however, start RDP using both methods.


    # 4.2.9 MTU and Path MTU


    4.2.9.1 Windows 2000


    Windows 2000 systems have Path MTU enabled by default for all interfaces. If you

    disable it, Windows 2000 defaults to a Maximum Transmission Unit (MTU) of 576
    bytes.

    Change the value of the following Registry parameter to 0 to disable Path MTU
    discovery:


    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\EnablePMTUDiscovery'
