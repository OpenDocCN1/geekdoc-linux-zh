    choose Actions→Configure from the pull-down menu. Single-click the DHCP button,

    asas shown in Figure 7-2. Statically defined networking values will be overwritten
    if the system

    successfully obtains a lease from the DHCP server. If obtaining a lease is unsuccessful,
    the

    original networking values will be retained.


    You can also edit the /etc/rc.config/dnetconf file to set a DHCP client. Change
    the

    value of the DHCP_ENABLE value to 1, and reboot the system. Whatever method you

    use, if obtaining a lease is successful, change the values of the appropriate
    variables found

    in /etc/rc.config/dnetconf.


    # 7.1.2.1 The HP-UX DHCP Client and DDNS


    The current HP-UX DHCP client does not support Option 81, the FQDN option, in
    any of its

    messages. Therefore, a Windows 2000 DHCP server is unable to register an HP-UX
    client''s

    FQDN with DNS. Future versions of HP-UX 11, however, will have DHCP clients sending

    Option 12, the Host Name option, in its messages, Windows 2000 DHCP servers can
