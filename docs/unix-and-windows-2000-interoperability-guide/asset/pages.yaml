    # 3.1.4 Configuring Your Network Interface Card


    # 3.1.4.1 Windows 2000


    When you install Windows 2000, your network adapter is automatically detected.
    If you are doing an interactive install, you will have to supply network information
    like the IP address, subnet mask, and gateway. If you use Dynamic Host Configuration
    Protocol (DHCP), most of this information will be configured in the LAN automatically.
    As, the process will select the appropriate driver and then bind the adapter to
    TCP/IP if you later install another protocol, such as NWLink (IPX/SPX), it will
    then bind the adapter to both TCP/IP and NWLink. Some drivers will also load card-specific
    information when they install. If you want to change these settings, start the
    Device Manager, expand the Network adapters entries, right-click the icon representing
    your adapter, and choose Properties.


    If you change NICS or add additional hardware, Windows 2000 will automatically
    detect the new cards from the installation media or from a source you specify.
    Again, you may be asked to provide some additional configuration information.


    Most systems transmit Ethernet frames in LLC format, while Windows 2000 does by
    default. To set the default transmitting format to 802.3/II, edit the Registry
    and set the value to 1:


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces

    ```'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3.1.4.2 HP-UX


    HP-UX 11 supports multiple logical interfaces per NIC. IP addresses associated
    with the logical interfaces can be on the same or different subnets. If you require
    both Ethernet and IEEE 802.3 (SNAP) encapsulations on the same NIC, you must configure
    two logical interfaces with separate IP addresses in different subnets. The interface
    name for Ethernet is lan; for IEEE 802.3 it is snap. The loopback interface is
    always l0.


    If you had your NIC in place when you installed your HP-UX system, the operating
    system installation process installed its driver into the kernel, created device
    files for it, and installed the appropriate networking software. For Ethernet,
    this software is called LAN/9000. Because of its popularity, we will assume you
    are installing an Ethernet card. (Other HP working software includes Token Ring/9000,
    FDDI/9000, and 100VG-AnyLan Link.) If you use Switch cards or add additional ones,
    follow the procedure below.


    It is much easier to configure your NIC using Hewlett-Packard''s System Administrator
    (SAM) than to do everything with commands and startup files. The same is true
    about other forms of UNIX. Make sure the LAN card and driver are installed in
    the system before you use SAM to configure the software. (These steps come from
    Hewlett-Packard''s *Installing and Administering LAN/9000 Software*, pp. 32–34.)
    Log in as *root* and do the following:


    +   1. At the HP-UX prompt, **type sam**.

    2. Select the **Networking and Communications** item of the SAM main window.

    3. Select the **Network Interface Cards** item from the **Networking and Communications**
    window.

    4. Highlight the LAN card that you want to configure from the object list.

    5. Verify that the hardware path is correct for your LAN card.

    6. If you are configuring the first logical interface for a card type (also called
    the *initial interface*), choose **Configure** from the *Actions* menu to open
    the **Configure LAN Card**


    If you are adding logical interfaces to a card type, choose **Add IP Logical Interface**
    from the *Actions* menu to open the **Configure LAN Card** window.


    +   a. Enter the information about the LAN card. To do so, press the Tab key to
    move through the data entry fields.


    NOTE: SAM displays the Card Name, Hardware (H/W) Path, and Station Address fields
    with the appropriate values. These fields cannot be modified.


    +   b. Choose the **Card Type** of your LAN card. The default is Ethernet. SNAP802.3
    is for selected.


    NOTE: The **Enable DHCP** button specifies that the system is a DHCP client. If
    you activate this button, the IP parameters for this system will be set using
    DHCP.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   c. Enter the Internet address for your LAN card. Upon exiting the Internet
    Address field, SAM checks to make sure that the IP address you entered is correctly
    foratted and is not currently in use.


    +   d. Specify whether your LAN card will be on a subnet or supernet. The Subnet
    Mask field can contain a fixed-length subnet mask, a variable-length subnet mask,
    or a network mask. Enter the appropriate type of mask for your network-addressing
    scheme.


    +   e. Optionally, enter comments about your LAN card.


    +   f. choose Modify Host Name Aliases to open the Add Aliases window. You must
    complete this if you have more than one LAN card installed in your system.


    +   g. Add, or remove aliases host names for your logical interface.


    +   h. Activate the OK button to perform the task and return to the Configure
    LAN Card window.


    +   i. Optionally, activate the Advanced Options button. This will allow you to
    modify the Station Address and configure an Internet Broadcast Address. The Maximum
    Transmission Unit (MTU) field is display only.


    +   7. Activate the OK button at the Configure LAN Card window to enable your
    LAN card. If the software is correctly configured, SAM displays the Interface
    Cards object list with the status Enabled for your LAN card; otherwise, SAM displays
    an error message.


    +   8. Choose Exit from the File menu.


    +   9. At the Networking and Communications window, choose Exit SAM from the File
    menu.


    # 3.2 Conclusion


    The network interface layer performs the same function on both Windows 2000 and
    HP-UX. How they are actually implemented and configured differ, however. Two of
    the more important technologies at this layer are Ethernet and Fibre Channel.
    Whereas Ethernet is ubiquitous in today''s LANs, play an important role in the
    new SAN and NAS technologies.


    # References


    +   1. John Blomers, Architecting Enterprise Solutions with UNIX Networking. (Prentice
    Hall, 1998).


    +   2. Gilbert Held, Ethernet Networks: Design, Implementation, Operation, Management,
    3rd Ed. (John Wiley & Sons, 1998).


    +   3. Hewlett-Packard, Installing and Administering LAN/9000 Software. (Hewlett-Packard,
    1997).


    +   4. Microsoft, Microsoft Windows 2000 Server TCP/IP Core Networking Guide.
    (Microsoft Press, 2000).


    +   5. Ralph H. Thornbury, Fibre Channel for Mass Storage. (Prentice Hall, 1999).'
