- pgno: 182
  md: '# 10.3.4.2 Passwords


    Because the dylan account already existed in Active Directory, the UNIX password
    for that account was set to be the same as that on the HP-UX system. However,
    the Windows 2000 password for dylan did not change. To synchronize the password,
    I logged on as dylan on my Windows-2000 server and changed the password: (In the
    default Domain Controller Policy object, I had to grant the users group the right
    to log on locally to do this). The result was that both passwords were changed,
    and the NIS password was pushed to the HP-UX client.


    However, when I logged into hpux/ as dylan, I used ypasswd to change my NIS password:


    ```

    $ ypasswd

    Changing password for dylan on NIS server

    Old NIS password:

    New password:

    Re-enter new password:

    NIS (YP) passwd/attributes changed on w2kserv, the master NIS server.

    ```


    Indeed, the NIS password changed. The Windows 2000 password, however, did not.
    Two-way synchronization is possible only by installing and configuring the separate
    Password Synchronization tool in SFU.


    # 10.3.4.3 Creating a New User


    During migration, the Migration Wizard created a new Windows user because there
    was no equivalent user in place at the time of migration, the user''s UNIX password
    in Active Directory will be the same as the existing UNIX password. However, the
    user will be required to change his or password upon the next login to Windows.


    Since the Windows 2000 domain controller is now the NIS master server, you can
    create new users for both Windows and UNIX clients using the Active Directory
    Users and Computers tool. If you do, so, only the Windows password will be set;
    there will be no NIS password. In other words, logging on to Windows will require
    a password; logging on to a UNIX client will not. As we have seen, logging on
    to UNIX and using passwd will set the NIS password on the domain controller, the
    only way to synchronize the password (unless you are using the Password Synchronization
    tool) is to have the user log on to a Windows client system and change passwords
    there.


    # 10.3.4.4 Home Directories


    If you create a new user on the domain controller running Server for NIS, that
    user will have a UNIX home directory that defaults to the home of the migrated
    passwd map. For example, if your UNIX Home directory are are in /home. Active
    Directory will specify /home/username in its UNIX Home Directory attribute. So,
    where are these home directories to be found? Well, unless you centralize their
    location using NFS or Common Internet File System (CIFS), you must make sure they
    are created on each UNIX system. Centralizing data, including home directories,
    is what it''s all about. So, in coming chapters we will look at methods to make
    this possible.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 10.3.4.5 Map Management


    There is good news and bad news when it comes to map management. The good news
    is that you can edit the **passwd**, **group**, and **hosts** maps using Active
    Directory Users and Computers. (You can also use the *nisadmin* command.) The
    bad news is that for all other maps, you have to use the ADSI Edit utility in
    the Support Tools folder of the Windows 2000 media.


    To edit **passwd**, **group**, and **host** maps using Active Directory, just
    start Active Directory Users and Computers and select the domain you want to edit.
    Then, for **passwd** and **group** maps, click **Users**. For the *hosts* map,
    click **Computers**. Right-click on the user or computer you want to edit, choose
    **Properties**, and select the **UNIX Attributes** tab to make your changes. See
    Figure 10–11 for a picture of the UNIX Make sure the NIS Domain box contains the
    name of the correct NIS domain. When creating a new user account or computer entry,
    this box will specify <none> by default. Just click on the arrow to the right
    of that box to select the NIS domain.


    I would suggest not using the other maps. For my foray to ADSI Edit were fraught
    with frustration. Therefore, keep references to other information local until
    Microsoft comes up with an easier way to edit all other maps on Server for NIS.


    # 10.4 Conclusion


    If you are beginning to see potential for some real complexity developing here,
    you are right. In this and previous chapters we''ve seen a number of authentication
    schemes: local UNIX authentication, NIS, NTLM, Kerberos. In the next chapter,
    we turn to file sharing. File sharing involves authorization in addition to authentication.
    We can share files from UNIX systems to Windows systems using NFS or CIFS. We
    can do the same in the other direction. We have share permissions, NFS permissions,
    UNIX permissions, NTFS permissions. Whew!


    Did I say this was going to be easy?


    # References


    +   1. Hal Stern and Mike Loukides, *Managing NFS and NIS*. (O''Reilly, 1997)

    2. The Services for UNIX Help File'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# NFS File Sharing


    In late 1984, Sun Microsystems introduced the Network File System (NFS), a means
    of sharing files among computers connected to a network. Though it was designed
    to be operating system-independent. NFS originated in SunOS, a Berkeley-based
    UNIX operating system, and dominates file sharing in the UNIX world. However,
    NFS does not exist on other systems, including mainframes, minicomputers, and
    PCs. Windows Services for UNIX version 2 provides both an NFS server and client
    for Windows 2000 systems.


    # 11.1 Basic Concepts


    NFS is designed as a client-server technology. A system running an NFS server
    can export file systems to client systems. The NFS clients running on the client
    systems mount (gain access to) the server''s exported file systems. The mount
    process essentially “attaches” a remote file system to a local directory, making
    it appear to the local system and the user that the remote file system is actually
    local. Thus, with the appropriate permissions, a user can change directories to
    the mounted file system and list, create, and delete files there, with no indication
    (barring a ridiculously slow network) that he or she is actually working on remote
    files.


    While there are certainly many differences between NFS and CIFS (Common File System,
    the Windows file sharing system), those familiar with the latter can draw some
    parallels. Instead of exporting file systems, Windows systems makes directories
    available over the network in the form of shares. Clients connect to these shares
    either by mapping a network drive or by referring to a Universal Naming Convention,
    or UNC. The mapping process is somewhat analogous to mounting a file system. Windows
    users click on the icons representing network drives, and—depending on the permissions—add,
    delete, delete, edit, list, or print files.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 11.2 NFS and Windows 2000 Issues


    These basic concepts, then, are quite similar. The differences, are both numerous
    and substantial, as we shall see in the course of this and the next chapter. In
    order to share files between UNIX and Windows systems, we will have to either
    modify, or adjust the NFS protocol to make it compatible with Windows systems
    or adapt the CIFS protocol to make it compatible with UNIX. In this chapter, we
    concentrate on NFS, as provided by Windows Services for UNIX, and how to make
    it work on Windows systems.


    # 11.2.1 Local File Systems and NFS


    Between UNIX (including UNIX clones) and Windows 2000, there are a number of different
    file systems in existence. HP-UX has Hierarchical File System (HFS) and NTFS.
    Solaris has UFS. Linux has ext2. Windows 2000 has File Allocation Table (FAT),
    FAT32, and NTFS. Practically all operating systems support CD-ROM File System
    (CDFS). However, NFS was designed after UNIX file system semantics. All UNIX file
    systems store information about each file, the metadata, in inodes. Instead of
    inodes, NFS manipulates nodes, which contain similar information, such as the
    UID of the owner of the file, the GID associated with the file, and the permission
    bits. Other file systems, such as FAT and NTFS, have different structures. To,
    accommodate different file systems, NFS employs a file system interface as the
    Virtual File System (VFS)/Virtual File Node (VNODE), which separates the file
    system interface from the specific file system implementation. While the VFS interface
    works, some NFS operations, such symlink(), which creates a symbolic link to a
    file on a remote host, do not work—for example, if the remote file system is FAT.
    Also, since NTFS file attributes differ from those in UNIX file systems, there
    must be some mechanism to map these attributes.


    # 11.2.1 NTFS, FAT, and CDFS


    FAT and CDFS do not provide any security mechanism. CD-ROM file systems are readonly.
    To make FAT file systems writable over NFS, you must grant read/write access when
    mounting the file system. FAT file systems also have no concept of file ownership.
    Therefore, if you grant read/write access to a FAT file system exported by NFS,
    all users have full access to the file system. The only way to protect your exported
    FAT file system is to mount it as readonly.


    # 11.2.2 NTFS


    File and directory permissions differ between UNIX systems and NTFS. For example,
    UNIX does not have the Take Ownership permission. Somehow, NTFS permissions on
    a Server for NFS resource need to be mapped in such a way that the UNIX client
    can understand them. Fortunately, NFS handles this transparently.


    # 11.2.2 User Authentication and Authorization


    The NFS protocol utilizes the Remote Procedure Call (RPC) mechanism to perform
    operations. RPC is a mechanism whereby a client application passes a set of arguments
    to the local RPC library,'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Windows 2000 NFS Client/HP-UX NFS Server


    which packages the arguments and sends them to a server. The server processes
    the call and returns the results to the client. NFS-RPC procedures can obtain
    and set file attributes, read and write data from or to files, and create and
    remove directories. Each RPC request that a client sends to a server must include
    UNIX credentials—the UID and GIDs—of the user initiating the request. The NFS
    server uses these credentials to determine what level of file access, if any,
    the user has.


    The problem here is that Windows 2000 does not use UIDs and GIDs to authenticate
    and authorize users. It uses SIDs and security descriptors instead. Even if you
    install Server for NIS, which can incorporate UNIX attributes such as UIDs and
    GIDs into Active Directory, Windows running Server for NIS still need have some
    kind of mapping between UIDs/GIDs and security descriptors in order to determine
    access. To accomplish this mapping, you must use the User Name Mapping Service,
    a component of Windows Services for UNIX (SFU).


    Also, keep in mind that with NFS, user authentication actually takes place at
    the client when a user logs in. The RPC request contains the UID and GID of the
    user initiating the request. The user cannot initiate a request unless he or she
    has logged in, and after that, the client does the work. The NFS server simply
    accepts the UID and GID of the RPC request as value and uses them to determine
    file access.


    If you want to access NFS files systems from an HP-UX system on a Windows 2000
    system, you must configure the HP-UX system as an NFS server and install Client
    for NFS on Windows 2000. But first you set up User Name Mapping.


    # 11.3.1 Setting Up User Name Mapping


    In order for NFS to validate an RPC request containing a UNIX UID and GID, it
    needs to find the equivalent user in Active Directory. The only way to accomplish
    this is to use some form of mapping of UNIX and Windows users. The same is true
    for Client for NFS. Since this client runs on a Windows 2000 system, there must
    be a way to provide the UNIX NFS server with a UNIX-style UID and GID if anonymous
    users are not allowed.


    User Name Mapping provides the means for both Server for NFS and Client for NFS
    to obtain UIDs and GIDs for their use in their transactions. This service runs
    on only one system in the network (on a domain controller if you want to map domain
    accounts to UNIX accounts), providing a single mapping source for Windows components.
    When Server for NFS needs to find the equivalent Windows user for a given UID,
    it consults User Name Mapping before processing the request. When Client for NFS
    needs to insert a UID/GID combination into its RPC requests for a Windows user,
    it consults User Name Mapping before sending the request.


    If a user accounts in both a UNIX network and a Windows 2000 domain, and those
    names are identical, User Name Mapping maps the names automatically with no administrator'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Chapter 11 - NFS File Sharing


    intervention. This is known as simple mapping. If you have users with accounts
    in both the UNIX and Windows 2000 worlds those differ, you must manually map these
