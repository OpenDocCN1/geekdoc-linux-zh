- pgno: 204
  md: '# CIFS File Sharing


    The Common Internet File System (CIFS) is a file and print sharing protocol that
    runs natively on Windows-based computers. Originally called the Server Message
    Block (SMB) protocol—which many still refer to it as—CIFS is a NetBT application,
    enabling file and print sharing using the NetBIOS API running on top of the TCP/IP
    protocol suite. Because it is IP-based, CIFS can run across routers and WANs,
    making it a useful file sharing tool for the Internet. In functionality, it resembles
    NFS but differs considerably in its actual implementation.


    # 12.1 CIFS Versus NFS


    We looked at NFS in Chapter 11, "NFS File Sharing." As stated in The Design and
    Implementation of 4.4BSD Operating System (Musick, et. al.), pp. 312, 313


    +   * The protocol is designed to be stateless. Because there is no state to maintain
    or recover, NFS can continue to operate during periods of client or server failures.
    Thus, it is much more robust than a system that operates with state.

    * NFS is designed to support UNIX file system semantics. However, its design allows
    it to support the possibly less rich semantics of other file system types, such
    as MS-DOS.

    * The protection and access controls follow the UNIX semantics of having the process
    present a UID and set of groups that are checked against the file''s owner, group,
    and other access modes. The security check is done by file system-dependent code
    that can do more or fewer checks based on the capabilities of the file system
    that it is supporting. For example, the MS-DOS file system cannot implement the
    full UNIX security validation and makes access decisions solely based on the UID.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '• The protocol design is transport independent. Although it was originally
    built using

    UDP datagram protocol. It has was easily moved to the TCP stream protocol. It
    has also been

    ported to run over numerous other non-IP-based protocols.


    In contrast to these points, let''s start with the fact that Common Internet File
    System

    (CIFS) is both connection-oriented and state-full. It is connection-oriented in
    that it requires an

    SMB session to be set up before any file system command is issued. It is state-full
    in that the cli-

    entains sufficient state information to recover from a server at the point of
    failure.

    CIFS is designed to be a cross-platform protocol, but being the native file sharing
    mechanism for

    Windows-based systems, it meshes easily with Windows file systems. The protection
    and access

    controls follow the Windows schema of having the server issue a request for credentials
    from the

    client that can be used for the entire SMB session. This contrasts with NFS, where
    each request

    is independent of others, with credentials accompanying each request. (Also important
    is here

    the the fact that while CIFS requires a connection-oriented transport protocol,
    such as TCP, NFS com-

    runs over the connectionless User Datagram Protocol (UDP).


    Other differences include the simple fact that NFS supports file sharing only,
    while CIFS

    supports file sharing, print sharing, and messaging. Also, CIFS supports opportunistic
    locks

    opllocks). An SMB application can obtain an oplock on a file and then read and
    buffer the

    file''s contents, which can improve performance. NFS does not support oplocks.
    In fact, it

    does not work well with any kind of locking, for as stated in Hal Stern and Mike
    Loukides''

    Managing NFS and MIS. p. 134. "Locking is a stateful operation and does not mesh
    well with

    the stateless design of NFS.


    # 12.2 The Case for CIFS


    You can examine these and other technical differences to decide which of these
    technologies are

    "better." In fact, there are folks out there who would just do that. However,
    beyond the technical

    re, there is a lot of hype about the merits or deficiencies of NFS and CIFS. Those
    who

    sim''t like Microsoft (including the vendor who invented NFS, who will remain
    name-\less) often trash CIFS because of its Microsoft origins. Old technology
    and out of step with the needs of the Internet.

    However, I will make the case that a CIFS-based technology is a better way to
    go

    achieve interoperability with NFS. And I do so from an administrator''s point
    of view.


    In my experience, Windows-based systems completely dominate the business desktop.

    UNIX remains strong in the server market: application servers, file servers,

    Web servers. The only area where I''ve seen UNIX-based systems dominate the desktop
    is in

    scientific and engineering, graphics-intensive applications whose performance
    needs are met

    only by RISC-based UNIX systems. (But even here, more and more of such applic-

    ts are portant, or even rewriting, their applications for Windows NT and Windows
    2000.)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# CIFS Implementations


    So, from the administrator''s viewpoint, if you want to share files from a few
    UNIX servers, what do you do? Install an NFS client on all your Windows clients?
    Or do you install a CIFS server on your few UNIX servers? Which would require
    the least amount of administrative overhead? While there may be sites that would
    choose to standardize on NFS (and this would work well), I would install some
    kind of CIFS on the UNIX servers. Once you do so, UNIX systems can access their
    data via NFS, and the Windows-based clients can access the same data via CIFS,
    their native file sharing protocol. You have fewer installations than the way,
    and have fewer servers to administer. UNIX systems, because of their wonderful
    memory model, can easily accommodate multiple protocol stacks. In the case of
    CIFS, they simply have to accommodate the functionality of the layers above the
    transport layer: the session, presentation, and application layers.


    # 12.3 CIFS Implementations


    The SMB protocol, upon which CIFS is based, its first appearance in Microsoft''s
    Lan Manager in 1987. A year later, it appeared in IBM''s OS/2 LAN Server. In 1992,
    SMB became an Open standard and has been a part of Windows for Workgroups, Windows
    95, Windows 98, and Windows NT networking as each operating system made its appearance
    in the marketplace. In 1994, Microsoft released the SMB server code to AT&T; who
    in turn ported the code to UNIX and made it available to UNIX vendors. Known as
    Advanced Server for UNIX (ASU), this product was modified, renamed by various
    users, including Hewlett-Packard and Digital Equipment Corporation (DEC). In 1996,
    Microsoft changed the name of SMB to CIFS—the terms are frequently used interchangeably—and
    submitted its specification to the Internet Engineering Task Force (IETF) as an
    Internet-Draft.


    The Open Source movement has produced free software, called Samba, which is a
    CIFS product designed for UNIX systems. The origins of Samba also go the way back
    to 1991 as a project of Andrew Triddell, a graduate student at the time in the
    Computer Sciences Laboratory at Australian National University. Currently spearheaded
    by a small group called the Samba Team, this fre is available for all UNIX implementations.
    It is open source software, so its licensing is subject to the GNU General Public
    License. (See Chapter 1 for information on GNU).


    In 2000, Hewlett-Packard produced a new product, CIFS/9000, which implements both
    a CIFS server and a CIFS client on HP-UX 11. The CIFS/9000 Server is based on
    Samba, version 2.0.6, and provides file and print services to CIFS clients, including
    Windows 95, 98, NT, 2000, and HP-UX machines running CIFS/9000 Client software.
    The CIFS/9000 Client enables HP-UX users to mount as UNIX file shares from CIFS
    file servers, including Windows and HP-UX machines running CIFS/9000 Server. The
    CIFS/9000 client also offers an optional Pluggable Authentication Module (PAM)
    that implements the Windows NT LAN (NTLM) authentication protocols. When installed
    and configured within HP-UX facility, PAM NTLM allows HP-UX users to be authenticated
    against a Windows authentication'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 12.4 CIFS/9000 Server in a Windows 2000 Domain


    To illustrate connecting HP-UX systems with Windows 2000 systems, we will now
    describe a configuration using CIFS/9000. Given the close relationship this product
    has with Samba, much will come forth as a result of this overview. In this way,
    you can extrapolate what needs to be done to employ CIFS in other UNIX offspring.


    # 12.4.1 A Vision


    If you have a Windows 2000 domain and want to introduce a CIFS/9000 server into
    your domain, it makes sense to have the Windows 2000 domain controller authenticate
    requests for resources. The main purpose for doing so is to avoid having to maintain
    two separate password databases. A client requests a CIFS/9000 resource, and the
    CIFS/9000 server passes authentication to the domain controller. As we saw in
    Chapter 11 with NFS, it helps to have user account names match each other; otherwise,
    you to create a user-mapping file for account names that differ.


    It is common, then, for sites to configure their users so that their UNIX account
    names and their Windows account names match. However, even though authentication
    takes place at one location—that of the domain controller—you still maintain two
    separate databases: one for UNIX and for Windows 2000. If you add a user to the
    UNIX environment, you must add an equivalent user to the Windows 2000 domain.
    But, what if you run Server for NIS on the domain controller? That way, you can
    create new accounts for both environments in one location with Active Directory
    Users and Computers. (See Chapter 10, “Windows Services for UNIX,” for a description
    of Server for NIS.) By combining CIFS/9000 (configured to use domain security)
    with Server for NIS, you can effectively unify your HP-UX and Windows 2000 user
    datbases. Let''s see how.


    # 12.4.1.1 Configuring CIFS/9000 Server


    Complete instructions on setting up the CIFS/9000 server are in Hewlett-Packard’s
    document Installing and Administering the CIFS/9000 server. This document describes
