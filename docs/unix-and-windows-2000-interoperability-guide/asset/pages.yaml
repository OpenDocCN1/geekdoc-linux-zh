- pgno: 93
  md: '# Chapter 6 · Name Resolution


    /etc/hosts. The /etc/hosts file has the same syntax as the HOSTS file on Windows
    2000 systems. Its usefulness is primarily for small networks that have little
    or no to communicate beyond the local LAN. Unlike the Windows 2000 HOSTS file,
    a UNIX /etc/hosts file''s contents are not preloaded into a DNS cache.


    * NIS. The NIS map is available to all NIS clients of a particular domain. There
    is one copy per NIS domain, making maintenance of host name information easier.
    However, like /etc/hosts files, NIS maps do not scale well if your systems need
    to communicate with others outside your LAN. Many UNIX systems now support NIS+,
    though it is recommended that you use one or the other of NIS or NIS+


    * DNS. DNS, usually in the form of the Berkeley Internet Name Domain (BIND) service,
    is available for larger scale name resolution.


    # 6.2.2.1 The Name Service Switch


    The name service switches when a system will search for key pieces of information,
    including host names and their IP addresses. You configure this switch by editing
    the /etc/nsswitch.conf


    A default version of /etc/nsswitch.conf contains the following lines:


    ```

    passwd:          files nis

    group:           files nis

    hosts:           dns [NOTFOUND=return] nis [NOTFOUND=return] files

    networks:        nis [NOTFOUND=return] files

    protocols:       nis [NOTFOUND=return] files

    rpc:             nis [NOTFOUND=return] files

    publickey:      nis [NOTFOUND=return] files

    netgroup:        nis [NOTFOUND=return] files

    automount:       files nis

    aliases:         files nis

    services:        nis [NOTFOUND=return] files

    ```


    The first field indicates the information database to consult. To configure the
    name resolution process, you change the hosts line. The HP-UX default is to consult
    DNS. If the service is not configured, NIS is consulted. If DNS is not configured,
    /etc/hosts is consulted. If DNS does not find the host, then the lookup stops
    (indicated by NOTFOUND=return). This is the default behavior if /etc/nsswitch.conf
    does not exist.

    The syntax of /etc/nsswitch.conf is:


    ```

    database:       name_service [ status = action status = action ... ]

    ```


    ```

    hosts:          dns NIS files

    ```'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The status keyword is what is returned by a name service query, which can be
    one of the following values:


    +   - SUCCESS The requested information was found.


    +   - NOTFOUND The name service responded but did not find an entry for the request.


    +   - UNAVAIL The name service wasn''t available.


    +   - TRYAGAIN The name service was busy.


    The action keyword determines what action to take given the status of a response.
    The continue action means to try the next name service in the list. The return
    action means to end the lookup process.


    Therefore, as an example, if you want your system to consult /etc/hosts first,
    and then DNS if /etc/hosts does not find the requested information, then your
    hosts line in /etc/hosts.conf would look like this:


    ```

    hosts: files [NOTFOUND-continue] dns [NOTFOUND-return] UNAVAIL-return

    ```


    This line indicates that if the requested information is not found, or if the
    service is not configured, the lookup process stops.


    If this seems too complicated to figure out, use SAM. Select Networking and Communications→Name
    Service Switch. You will see a window like the one depicted in Figure 6–4. Just
    select the hosts line, choose Actions→Configure Name Service Switch, and use the
    interface to select the order and criteria for name lookups.


