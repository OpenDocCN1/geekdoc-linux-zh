    The first field in this file indicates the name that the application uses to identify
    itself to PAM, such as login. This name is usually the name of the command invoked
    by the user. The second field is the keyword for the type of authentication service,
    account for account management, auth for authentication, password for password
    management, and session for session management. The third field is a keyword specifying
    how to handle multiple definitions for the same application. If this keyword is
    required, as in this example, then the test for this module must succeed before
    moving on successive tests. If optional, the test for the module can fail. If
    sufficient, then further tests are performed if the first test succeeds.

    nThe "pluggable" portion of PAM is specified in the fourth field, the dynamically
    loadable object invoked to provide a particular type of authentication. In the
    example above, each application under service calls /usr/lib/security/libpam_unix1,
    the standard HP-UX model, to handle authentication. For PAM NTLM, this object
    is /usr/lib/security/libpam_ntlm. For PAM Kerberos, it is /usr/lib/security/libpam_krb5.
    For more information, see the following pages: pam(3), pam.conf(4), pam_upde(5),
    and pam_user_conf(4).


    # 8.2.4 PAM NTLM


    Using PAM NTLM, anyone logging into an HP-UX 11 system can be authenticated by
    Windows or Windows 2000 server. PAM NTLM is part of HP’s CIFS/9000 Client product.
    This product enables HP-UX users to manage shares from Windows servers using the
    Common File System (CIFS) protocol, an alternative to NFS on Windows servers.
    To access these shares, you must either run the cifslogin utility or use PAM for
    authentication. PAM NTLM authenticates users using encrypted passwords and supports
    the ability to change passwords on Windows 2000 using the HP-UX passwd command.

