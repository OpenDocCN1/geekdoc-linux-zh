    # 4.1.3 Adding a Static Entry to the ARP Cache


    # 4.1.3.1 Windows 2000


    In Windows 2000, use the arp -s command. You must supply both the IP address and
    the hard-ware address.


    ```

    C:\arp -a

    ```


    | Interface: 10.0.0.3 on Interface 0x2 |

    | Internet Address | Physical Address | Type |

    | 10.10.1.1 | 00-60-b0-6a-8e-9c | dynamic |


    ```

    C:\arp -s 10.10.1.1 00-60-b0-6a-8e-9c

    ```


    ```

    C:\arp -a

    ```


    | Interface: 10.0.0.3 on Interface 0x2 |

    | Internet Address | Physical Address | Type |

    | 10.10.1.1 | 00-60-b0-6a-8e-9c | static |


    # 4.1.3.2 HP-UX


    HP-UX also has the arp -s command.


    ```

    # arp -s w2kserv.book.local 00:60:b0:6a:8e:9c

    # arp -a

    w2kserv.book.local (10.10.1.1) at 00:60:b0:6a:8e:9c permanent

    houyhnhnm.book.local (10.0.0.3) at 8:0:a0:36:f7 ether

    aix1.book.local (10.0.0.5) at 8:0:5a:d8:1e:a9 ether

    ```


    Note that static entries in HP-UX are noted as permanent.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 4.1.4 Gratuitous ARP


    4.1.4.1 Windows 2000

    Windows 2000 supports gratuitous ARP, sending ARP requests upon system startup
    check to see if the IP address being configured already exists on the local network.
    The number of requests is sent in the following Registry entry:


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\ArpRetryCount

    ```


    If a duplicate exists, Windows 2000 disables the network interface of the booting
    machine.


    # 4.1.4.2 HP-UX


    HP-UX also supports gratuitous ARP. However, if upon booting ARP discovers a duplicate
    address, ARP sends a message like the following:


    > Duplicate IP address!! Sent from Ethernet address: x:x:x:x:x:x:


    where x:x:x:x:x is the hardware address of the offending system. Unlike Windows
    2000, HP-UX does not disable the network interface of the booting machine when
    it discovers a duplicate IP address.


    # 4.2 IP


    At the internet layer, IP is the key protocol. It sends and receives packets,
    known as datagrams, using a 32-bit addressing scheme. As a system administrator,
    you should already know something about IP addressing and subnet masking, so we
    won''t go into any details about such here. However, if you''d like more information
    about addressing, two excellent references are W. Rich-Stevens'', TCP/IP Illustrated,
    Volume I (Addison-Wesley Publishing Company, 1994) and Microsoft Corporation’s,
    Microsoft Windows 2000 Server TCP/IP Core Networking Guide (Microsoft Press, 2000).


    # 4.2.1 Configuring IP


    4.2.1.1 Windows 2000

    Windows 2000 Professional defaults to using DHCP when you install the system.
    DHCP typically provides each client with an IP address, subnet mask, and a default
    gateway, as well as other parameters. However, if you are not using DHCP—for example,
    when installing a domain controller—then you must enter the IP information in
    the Internet Protocol (TCP/IP) Properties box. (see Figure 4–1).'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Internet Protocol (TCP/IP) Properties


    ![](img/1c1e7552b53cca888836b6c6895bdb48_65_0.png)


    **Figure 4–1** Configuring IP on Windows 2000. To get this box, open the Network
    and Dial-up Connections window from the Control Panel, right-click on Local Area
    Connection, and choose Properties. In the Local Area Connection Properties window,
    select Internet Protocol (TCP/IP) and choose Properties.


    4.2.1.2 HP-UX


    You can do the following to configure IP on HP-UX:


    +   1. Use the command line. Command-line changes are not permanent.

    2. Edit system startup files. Changes you make to these files do not take effect
    until you reboot the system.

    3. Use SAM. This will make changes to the system and ensure the proper entries
    are placed in the startup file.

    4. Use the *set_parms* script.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The startup script /sbin/init.d/net runs a couple of the commands you would
    use on the command line: ifconfig route. the ifconfig command sets the IP address,
    subnet mask, and localback interface; route configures the routing table. You
    don''t edit the /sbin/init.d/net script; rather, you change the value of variables
    found in /etc/rc.config.d/netconf. These values include:


    ```

    HOSTNAME

    LOOPBACK_ADDRESS

    INTERFACE_NAME[0]

    IP_ADDRESS[0]

    SUBNET_MASK

    BROADCAST_ADDRESS

    INTERFACE_STATE[0]

    CP_ENABLE[0]

    ROUTE_DESTINATION[0]

    ROUTE_GATEWAY[0]

    ROUTE_COUNT[0]

    ```


    The values of the variables become the arguments of the ifconfig and route commands
    that are run at system startup.


    Because it is easy to make a mistake when editing files, it is usually best to
    use either SAM or set_parms to set the variables in /etc/rc.config.d/netconf.
    After starting SAM, select the Networking and Communications item from the main
    menu to configure your IP parameters. The set_parms command runs right after you
    install HP-UX, but you can run the script at any time. Running the set_parms ip_address
    command will set your IP address; set_parms add_network will set the subnet mask,
    default gateway, DNS name, DNS server, Network Information Service (NIS) domain
    name, and NIS server.


    You can set your system to be a DHCP client with the set_parms initial command
    or by using SAM. If you set your system up as a DHCP client, do not make any changes
    to /etc/rc.config.d/net or set new parameters with set_parms. Doing so will most
    likely hose your system''s connections.


    # 4.2.2 Viewing IP Configuration


    # 4.2.2.1 Windows 2000


    You can view all the essential IP configuration of a Windows 2000 system by typing
    the ipconfig /all command at the system prompt. For example:


    ```

    C:\>ipconfig /all

    ```


    Windows 2000 IP Configuration


    | Host Name ................................. . . . . . . : houhyhnhnm |

    | Primary DNS Suffix . . . . . . . . . . : : |

    | Node Type . . . . . . . . . . . . . . : Mixed |

    | IP Routing Enabled. . . . . . . . . . . . : No |

    | WINS Proxy Enabled. . . . . . . . . . . . : No |

    | DNS Search List. . . . . . . . . . . . : book.local |'
  merge: -1
  img_proc: true
