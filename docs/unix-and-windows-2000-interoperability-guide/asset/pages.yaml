- pgno: 144
  md: '# 9.3.4 The HP-UX ftpd


    HP-UX 11 has an ftppd different from that of previous releases of the operating
    system. The new ftppd supports logging of transfers, logging of commands, on-the-fly
    compression and archiving, classification of users on type and location, per-directory
    upload permissions, restricted guest accounts, systemwide and per-directory messages,
    directory aliases, cpath, virtual host support, and per-class limits. One of the
    most significant changes, as we will see is a new option: -K, which enforces Kerberos
    Authentication. For complete information on configuring ftppd on HP-UX 11, see
    the release notes at /usr/share/doc/RelNotes_newftp.txt.


    Unlike the Windows 2000 FTP Server, HP-UX by default does not allow anonymous
    logins. The easiest way to set up anonymous FTP on HP-UX is to use SAM. From the
    main SAM screen, select Networking and Communications→Network Services. Select
    Anonymous FTP and then choose Actions→Enable from the menu bar, as shown in Figure
    9–1.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_144_0.png)


    Figure 9–1 Configuring anonymous FTP on HP-UX using SAM.


    This process will place anonymous FTP files in the /home/ftp directory. If you
    log in as anonymous or ftp, you will be placed in this directory and see the following
    subdirectories: dist, etc, pub, and usr.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 9.3.5 The Windows 2000 FTP Server


    Even though the Windows 2000 installation process installs Internet Information
    Services by default, you must ensure that the FTP Server is installed as well.
    If you run Start->Settings->Control Panel->Add/Remove Programs and then select
    Add/Remove Windows Components->Internet Information Services, make sure your window
    has the File Transfer Protocol (FTP) Server box checked, as seen in Figure 9–2.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_145_0.png)


    Figure 9–2 Installing the FTP Server on Windows 2000. If you want the FTP Server,
    check Common Files, File Transfer Protocol (FTP) Server, and Internet Information
    Services Snap-In.


    By default, the Windows 2000 FTP Server stores files for distribution in the C:\inetpub\ftproot
    directory and allows anonymous logins. If you log in as “real” user (not anonymous),
    you are still placed in the ftproot directory. The FTP Server is also highly configurable.
    You can configure it by running the Internet Services Manager, found in the Administrative
    Tools folder.


    # 9.3.6 Transferring Files


    The general rule for transferring files is, if you transfer between systems with
    identical operating systems, use BINARY mode transfer. It’s more efficient. If
    your operating systems differ, use BINARY mode for binary files, ASCII mode for
    text files.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 9.3.7 Windows 2000 FTP Client


    If you run the FTP client at a Windows 2000 command prompt and connect to a Windows
    2000 FTP Server, you can login as anonymous (or ftp) or as a user that exists
    in the domain (if the server is a domain controller) or as a user that exists
    locally (if the server is a member server). The default transfer mode is ASCII.
    If you connect to an HP-UX system, you can login as anonymous only if anonymous
    FTP has been configured on that system. Otherwise login as either a local user
    or as a user in an NIS domain. Again, the default transfer mode is ASCII.


    If you run the FTP client from Internet Explorer by typing a URL, as http:ftp://w2ksvery
    or ftp://hpux1, then the FTP client will by default to log in as anonymous. If
    anonymous FTP is set up on the HP-UX system, then you will get a window that looks
    like Figure 9–3.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_146_0.png)


    Figure 9–3 Running FTP from Internet Explorer. Here the user is logged in as anonymous.
    Notice the HP-UX anonymous FTP subdirectories.


    You can drag-and-drop icons to transfer files. In this case, however, the default
    transfer mode is BINARY. If you want to log in as a different user, type in the
    FTP URL in the Address box (e.g., ftp://hpux1), and then select File→Login As...
    and fill in the box, as in Figure 9–4.'
