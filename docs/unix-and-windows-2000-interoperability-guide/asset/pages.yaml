    # 2.3.8 Networking


    In the beginning, there was LAN Manager. This product product provided part of
    the foundation of Windows NT 3.1 Advanced Server. (Taken from *Introducing Microsoft
    Windows 2000 Server*, p. iii³) Microsoft announced LAN Manager in 1987. This networking
    product ran natively over the NetBIOS Frames Protocol (NBF), which is actually
    a set of protocols also known as NetBEUI. The term NetBIOS refers to a networking
    API developed by Sytec, Inc., for IBM. LAN Manager provided a number of network
    services for the PC that used the NetBIOS API and ran over NetBEUI.


    RFC 1001, “Protocol Standard for a NetBIOS Service on a TCP/UDP Transport,” was
    published in 1987. When Microsoft released Windows NT 3.1 in 1993, its networking
    services were based on LAN Manager. In other words, there were NetBIOS services.
    These services ran over only NetBEUI, but IPX/SPX and TCP/IP as well. Because
    NetBEUI was designed for a LAN—it was not routable—and because of the growing
    interest in inter-LAN communication and the Internet, the default transport mechanism
    for Windows NT 4.0 networking services was TCP/IP.


    Windows 2000 offers something new with to NetBIOS over TCP/IP. According to the
    TCP/IP Core Networking Guide, “Windows 2000 uses NetBIOS over TCP/IP to communicate
    with prior versions of Windows NT and other clients, such as Windows 95. However,
    the Windows 2000 directory and server components support direct hosting for communicating
    with other computers running Windows 2000. With direct hosting, NetBIOS is not
    used for name resolution. DNS is used for name resolution and the Microsoft networking
    communication is sent directly over TCP without a NetBIOS header. . . By default,
    both NetBIOS and direct'
