- pgno: 162
  md: '# Windows Services for UNIX


    Microsoft provides an optional product called Windows Services for UNIX (SFU)
    to facilitate the interoperability of Windows and UNIX systems. Although version
    2.0 of this product was released to support Windows 2000 systems, it can be installed
    on Windows NT 4 with Service Pack 4 or higher. SFU can work with Solaris 2.6 and
    above, HP-UX 10.20 and above. Tru64 UNIX 5.0 and above, and Red Hat Linux 5.1
    and above. SFU includes the following-default components:


    +   * Telnet Client and Server. The Server provides access to Windows 2000 systems
    via Telnet. The Telnet client provided with SFU has a bit more functionality than
    bundled with the operating system.

    * Server for NIS. NIS (Network Information Services) has been widely used in the
    UNIX world to provide commonly used information over the network. Server for NIS
    turns a Windows 2000 Server into an Active Directory-enabled NIS server.

    * Password Synchronization. Password Synchronization provides users with the ability
    to change account passwords from one platform and have a corresponding change
    place on the other.

    * Korn Shell and UNIX Utilities. The Korn Shell is a command-line interpreter
    available on all UNIX systems and is now available for Windows 2000. It contains
    a number of built-in commands and is supplemented by commonly used UNIX utilities,
    such as *grep* and *vi*.

    * Server for NFS. Server for NFS (Network File System) enables a Windows 2000
    system to share its files with UNIX systems.

    * Client for NFS. Client for NFS lets a Windows 2000 system access files on a
    UNIX system.

    * Gateway for NFS. Gateway for NFS lets a Windows 2000 system mount UNIX file
    systems and then share them as if they were Windows shares.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 10 • Windows Services for UNIX


    **User Name Mapping.** This component maps Windows-based network user names to
    UNIX-based network user names. Server for NFS, Client for NFS, and Gateway for
    NFS use User Name Mapping for NFS authentication and access.


    There is a lot of stuff in SFU, so let''s look at some of what it has to offer,
    beginning with Telnet and Server for NFS. Since NFS concerns file sharing issues,
    we will defer discussion to the next chapter.


    SFU comes on a compact disc; inserting into your CD-ROM drive starts the Windows
    Installer program. If your system is installed with Windows 2000 Professional,
    the following standard products are installed: Telnet Client, Telnet Server, Client
    for NFS, Korn Shell, and Utilities. Standard installation on Windows 2000 Servers
    also allows Server for NFS. The Custom Install of SFU allows you to install other
    components. You cannot install Client for NFS and Gateway for NFS if you want
    to synchronize the passwords of your domain accounts, you must install Password
    Synchronization on a domain controller. Also, you must install Server for NFS
    on a domain controller. By default, the installer will place SFU in the *SFU*
    directory and create an environment variable SFUDIR. If you choose a different
    directory, be sure that directory does not contain a space (like Program Files).
    The space can cause problems with shortcuts and the function of NFS.


    SFU is administered through a Microsoft Management Console (MMC). Once you install
    your components, run Start→Programs→Windows Services for UNIX→Services Administration
    to get the MMC shown in Figure 10–1.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_163_0.png)


    **Figure 10–1** Services for UNIX Administration. The installed components you
    can administer here are Server for NFS, Client for NFS, Telnet Server, Password
    Synchronization, and Server for NIS.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 10.1 Telnet Client


    The SFU Telnet Client''s command has options the bundled client does not have.
    The syntax of the former is


    ```

    telnet [-a] [-e escapeChar] [-f logfile] [-l user] [-t term] [host [port]]

    ```


    The -a and -l options attempt an automatic login, which works only when the Telnet
    server supports the ENVIRON option. In my attempts to connect to either HP-UX
    11 or Solaris 8 using those options, I found that the Telnet servers on both systems
    did not recognize the ENVIRON option. You can set the escape character (the keyboard
    sequence that takes you to the Microsoft Telnet> prompt while connected) to something
    other than the default CTRL+ with the -e option. You can set up a connection log
    file with the -f option. The log file you specify records the input and output
    of your Telnet session. For this Telnet client is VT100. If you want to specify
    a different one, use the -l option with VT52, ANSI, and VTNT as the terminal type.
    You can specify a host name or an IP address to connect to the remote system,
    as well as a port number if you do not use the default port of 23.


    Telnet subcommands are also a bit different from the standard Telnet client. Listed
    in Table 10–1 are the subcommands documented by Microsoft. I''ve also indicated
    the command abbreviations in parentheses.


    | Table 10–1 SFU Telnet Client Subcommands |

    |---|---|

    | open (o) | Establishes a Telnet connection to a host. |

    | close (c) | Closes an existing Telnet connection. |

    | display (d) | Produces a list of current settings for the Telnet client. |

    | quit (q) | Exits from Telnet. |

    | set | Sets the terminal type for the connection, turns on local echo, sets authentication
    to NTLM, sets the escape character, and sets up logging. |

    | unset (u) | Turns off local echo or NTLM authentication. |

    | status | Determines whether the Telnet client is connected. |


    The display subcommand of the SFU Telnet Client provides the following output:


    ```

    Microsoft Telnet> d

    Escape Character is ''CTRL+''

    Will auth (ntlm Authentication)

    ```'
  merge: -1
  img_proc: true
