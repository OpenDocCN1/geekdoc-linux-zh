- pgno: 52
  md: '# Network Interface Cards and Drivers


    # 3.1.1 Ethernet


    It seems that today the network interface layer of choice for LANs is some form
    of Ethernet. Though adequate for most business desktop use, the 10-Mbs shared
    technology has been planted by various forms of 100-Mbs networking, commonly as
    BaseBase-TX4 (running on 4-pair UTP, Category 3, 4, or 5 at half-duplex), 100Base-TX
    (2-pair Category 5 UTP or Type 1 STP cable at full-duplex), and 100Base-FX (2
    strands 62.5/125 micron multimode fiber at full duplex). Gigabit Ethernet (100Base-SX)
    is also making a showing these days, commonly for use in servers. Most desktops,
    however come with a 10/100-Mbs auto-sensing Ethernet card so that you can upgrade
    from 10-Mbs to 100-Mbs networking without buying a new adapter.


    Digital Equipment Corp., Intel, and Xerox (DIX, for short) published the Ethernet
    II (sometimes called DIX) standard in 1982, based on Xerox''s original technology.
    A few years earlier, the IEEE published another Ethernet standard, commonly known
    as IEEE 802.3, which, combined with the 802.2 Logical Link Control standard, defined
    a different frame format for Ethernet. Both types of frames can exist on the same
    network, but if your systems'' network adapters cannot read both, then you will
    have to standardize on a frame format or separate your systems with an IP router.


    # 3.1.2 Fibre Channel


    Fibre Channel is a data communications technology that can interconnect storage
    devices with servers as well as provide high-speed networking. A Fibre Channel
    adapter can serve either as a disk I/O adapter or a network adapter because both
    SCSI and IP can run on top of it. Currently its most prevalent use is for connectivity
    to storage. Transfer rates are currently 133 Mbps, 266 Mbps, 530 Mbps, and 1 Gbps,
    with rates up to 4 Gbps coming soon. This technology is becoming increasingly
    important as the growth in Storage Area Networks (SANs) and Network-Attached Storage
    (NAS) continues.


    A SAN is a network of shared storage, connecting servers of different types to
    high-capacity disk arrays, either through the use of Arbitrated Loop technology
    (up to 126 nodes) or Switched Fabric technology (theoretically, more than 16 million
    nodes). A conceptual view of a SAN is shown in Figure 3–2. Client systems can
    in turn access the information stored in these arrays over an existing IP network
    using a file server running some kind of file-sharing protocol such as Network
    File System (NFS) or Common Internet File System (CIFS), or both.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Chapter 3 • The Network Interface Layer


    ![](img/1c1e7552b53cca888836b6c6895bdb48_53_0.png)


    **Figure 3–2** A conceptual view of SAN. Multiple servers can connect to high-capacity
    disk arrays using components like those used in networking. A popular way of connecting
    all these devices is through Fiber Channel technology running on fiber-optic cable.
    SANs and the use of network-attached storage will play an increasingly important
    role in operating system interoperability.


    NAS is currently based on specialized file servers hooked up to a storage array.
    These servers do nothing but share the volumes of the array (again using NFS,
    CIFS, or both) by connecting to a network using the currently popular technologies
    of Ethernet (from 10 Mbps to 1 Gbps), Fiber Distributed Data Interface (FDDI),
    and Asynchronous Transfer Mode (ATM). Fibre Channel can play an important role
    here as well, as shown in Figure 3–3. This figure shows a file server running
    EMC’s Multiplex File System (MPFS). Clients can connect to the file server using
    only the network via NFS or CIFS, or they can use both the network and a channel
    connection. In the latter, the client accesses a file’s metadata over the network,
    but gets the actual data over a SCSI or Fibre Channel.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Network Interface Cards and Drivers


