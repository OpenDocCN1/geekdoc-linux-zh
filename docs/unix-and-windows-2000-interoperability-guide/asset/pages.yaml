    \ SAM will ask you for such things as the\nprinter name and model. As I have said,\
    \ having an HP printer makes things simple, as you can\nsee it in the box that\
    \ pops up after pressing the Printer Model/Interface button (see Figure 13–6).\n\
    Just make sure you pick the right script for your printer. Once you add your printer,\
