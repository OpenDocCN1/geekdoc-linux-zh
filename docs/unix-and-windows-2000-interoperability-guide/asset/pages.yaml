    server names associated with them. Why that is the case, I''ll explain in a minute.
    Table 1–1 lists some of the more significant directories in HP-UX.


    # Table 1–1 Important HP-UX Directories


    | Directory | Contains |

    | /bin | Essential command binaries for all users. In HP-UX this is a link to
