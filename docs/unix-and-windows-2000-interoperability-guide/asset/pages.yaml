    # 5.2 UDP


    A number of prominent applications on both UNIX and Windows 2000 systems use User
    Data-gram Protocol. These applications include Trivial File Transfer Protocol
    (Tftp), Simple Network Management Protocol (SNMP), and DNS. On the UNIX side,
    NFS has used UDP as its transport mechanism, though TCP is becoming more popular
    to enable file sharing over WANs.'
