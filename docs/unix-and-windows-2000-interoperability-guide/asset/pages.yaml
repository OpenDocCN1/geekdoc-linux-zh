- pgno: 222
  md: '# Miscellaneous

    Interoperability Topics


    What remains is a look at some miscellaneous interoperability topics, namely,
    network attached storage, the X Window system and printing. So far, we have examined
    the most pressing issues system administrators face when confronted with a mixed
    environment: how systems communicate, how they find each other, how their naming
    systems work, how users are authenticated, and how to share files. With a brief
    look at other interoperability topics, realizing that these can also be worthy
    of extensive description. They are, perhaps, material for another book. So, let''s
    proceed, starting with a twist to an area of file sharing: Network-Attached Storage
    (NAS).


    # 13.1 Network-Attached Storage


    Since file sharing is such an important goal in UNIX and Windows interoperability,
    we must take a look at the concept of NAS. NAS is disk storage accessible via
    networking technologies such as Ethernet, Gigabit Ethernet, and ATM, rather than
    channel technologies like SCSI and Fibre Channel. Unrestricted by distance and
    connectivity NAS makes it possible for large numbers of clients to access files
    anywhere on the network. NAS is achieved by connecting a file server running a
    stripped-down operating system optimized for network I/O to some kind of storage.
    This operating system does nothing serve files over network. It does not run other
    services like Dynamic Host Configuration Protocol (DHCP), Domain Name System (DNS),
    Windows Internet Name Service (WINS), or Network Information Service (NIS). Therefore,
    fast performance is a prominent NAS.


    EMC Corporation was the first to coin the term network-attached storage, but Auspex
    was the first to actually implement the concept. Today, the leading vendors of
    NAS are EMC and Network Appliance. Both companies provide NAS for UNIX (via NFS),
    Windows (CIFS), and mixed environments. The goal for these and other vendors is
    to provide NAS that is easy to integrate in mixed environments, easy to manage,
    performs well, and is always available.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 13.1.1 An NAS Example


    To illustrate the NAS concept, let''s look at the EMC Celerra file server. There
    are two components to the Celerra: the file server itself and the storage. The
    storage consists of a disk array called the Symmetric, either contained in the
    same cabinet as the file server or existing in a separate cabinet. The file server
    connects to the disk array either over a SCSI or Fibre Channel connection. It
    connects to the network via 10/100BaseT Ethernet, Gigabit Ethernet, Fiber Distributed
    Data Interface (FDDI), or Asynchronous Transfer Mode (ATM). Clients connect to
    the file server over the network via NFS or CIFS. Figure 13–1 illustrates these
    components.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_223_0.png)


    Figure 13–1 Components of Network-Attached Storage. This diagram shows the file
    server connected to a separate disk array. There are other file servers that share
    their cabinets with the disks, creating a single enclosure.


    In addition to CIFS, the Celerra file server supports both version 2 and version
    3 of NFS and both UDP and TCP as NFS transports. It also supports FTP and WebNFS,
    which lets you access NFS file systems using Web browsers, Java applets, and the
    Internet.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Network-Attached Storage


    The file server components include data movers and at least one control station.
    The data movers run a small operating system called Data Access in Real Time (DART),
    while the control station runs a form of UNIX. The control station is used to
    configure the file server and provide management services. It plays no role in
    the actual delivery of data across the network. Each data mover runs DART and
    has an IP address for every interface it contains, as well as an IP address for
    each port in multiport NICs. You can also configure an Ethernet channel on multiport
    NICs, combining each port into a single trunk with a single IP address.


    The file system created by the control station and based by CIFS, NFS, and WebNFS
    is called UFS, based on Berkeley''s UFS. Conceptually, then, the way in which
    this file server works is illustrated in Figure 13–2.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_224_0.png)


    Figure 13–2 Functional layers of the Celerra file server.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'NFS clients make requests to the file server''s NFS server in the same manner
    as they always do: via Remote Procedure Calls (RPCs) containing the UID and GID
    of the user making the request. The file server''s NFS server validates each request,
    using either files or NIS. The CIFS server authenticates CIFS client requests
    with NTLM 0.12 authentication, not Kerberos, and must operate with Windows 2000
    servers authenticating in mixed mode, that is, both NTLM and Kerberos. The Cerra
    file server does not do any CIFS authenticating but instead forwards authentication
    requests to domain controllers. Thus the file server runs as a member server only.


    # 13.1.2 Benefits of NAS


    NAS makes it possible for both UNIX and Windows clients to access the same data
    without the use of general-purpose servers. This performance is quite high. NAS
    can provide a great deal more reliability and availability as well, particularly
    if the file servers connect storage arrays such as Symmetrix. NAS helps to eliminate
    data duplication by consolidating data on a single platform, making management
    and backup much easier. As long as the amounts of data used by users throughout
    the world continue to grow, and as long as there are heterogeneous clients needing
    to access this data, NAS is a very attractive form of UNIX and Windows 2000 interoperability.


    # 13.2 The X Window System


    One important way for UNIX and Windows 2000 systems to operate is to employ the
    X Window System. Originally developed for UNIX systems by MIT, the X Window System
    (X, for short) is a graphical window system that separates an application from
    the display server. In other words, applications, known as X clients, can run
    in one place but have their displays elsewhere on the network. These displays
    run X server software that accepts instructions from the clients, creating little
    traffic in so doing. Figure 13–3 illustrates the system. In this diagram we see
    what is known as X terminals, diskless systems dedicated to running X servers.
    By placing X server software on your workstation, you are effect installing X
    terminal emulator.


    With X, you can have true application servers in your environment. In other words,
    you can have more powerful server applications for you; they simply display the
    application at your desktop. Running an application via NFS or CIFS is not the
    same thing, because your local CPU is doing the work while you run the program.
    By using X, the remote system does the processing while the local system does
    the display. A rough parallel to this way of doing things can be found in the
    World Wide Web, where a browser sends instructions to applications on remote servers
    that process the input and display the results back to the browser.


    The main benefit of X in a mixed UNIX and Windows environment is that you don''t
    have to worry about porting key applications from one platform to another. In
    the case of UNIX systems, X applications have been around for a long time, and
    porting them to Windows 2000 is costly and time consuming. Therefore, users who
    still need access to these applications, but who'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The X Window System


    now have Windows 2000 workstations, can still get to them simply by installing
    an X server on their systems. These are available from vendors such as WRQ, developers
    of Reflection/X, and Hummingbird, makers of Exceed. For this book, I used a Windows
    2000 version of Exceed and found that it performed quite well.


    # Host terminals


    ![](img/1c1e7552b53cca888836b6c6895bdb48_226_0.png)


    **Figure 13-3** How X works.


    Once you have an X server running on your Windows 2000 system, you can start X
    clients running on a UNIX system in a number of ways. One is to execute them using
    the utilities we covered earlier in the book: Telnet, Rexec, Rsh, and so on. Usually,
    X server vendors will supply their own versions of these utilities. Another way
    is through the use of X Window Display Manager Control Protocol (XDMCP). When
    used in broadcast mode, this tool provides the user with a list of available UNIX
    systems that a person can log on to. Figure 13–4 shows a chooser listing the systems
    available for logon.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_226_1.png)


    **Figure 13–4** The XDMCP Display Manager Chooser.'
