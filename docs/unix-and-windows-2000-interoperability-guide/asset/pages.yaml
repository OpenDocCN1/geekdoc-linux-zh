- pgno: 173
  md: '# 10.3.1 Background


    Windows Services for UNIX includes software called NIS Server. So what is NIS?
    NIS is Network Information Services, developed by Sun Microsystems in the 1980s
    to centralize data in UNIX groups. As long as UNIX systems worked like mainframe
    systems, that, serving multiple users from terminals, there was no need for something
    like NIS. But with the advent of the UNIX workstation in the 1980s, you suddenly
    had multiple users of multiple systems. Each system had its own database, its
    own hosts file, its own services file. For a subgroup of such systems to function
    properly, administrators had to ensure that each machine had identical versions
    of each of the configuration files. Even a small subgroup of, say, 10 machines,
    made administration cumbersome. But as groups expanded in size, it became ever
    more likely that a few systems would not be “sync” with the others.


    NIS attempts to avoid this problem by providing uniform configuration information
    to all systems in a particular workgroup, called a domain. In this general sense,
    NIS domain demands Windows NT servers maintain key information such as user and
    group accounts in the form of maps. NIS client systems obtain such information
    by consulting either the master server or a slave server. An administrator can
    modify the master server’s maps, and master servers can replicate their maps to
    slave servers. There is only one master server and any number of slave servers
    per NIS domain.


    Windows NT domains maintain key configuration information in domain controllers.
    Clients obtain this information from either Primary Domain Controllers (PDCs)
    or Backup Domain Controllers (BDCs). Administrators can modify network information
    on PDCs, and BDCs replicate their information to BDCs. There is only one PDC and
    number of BDCs per NT domain. As we know, Windows 2000 domains maintain network
    information in Active Directory, maintained by domain controllers in a peer-to-peer
    fashion, so the analogy starts to break here. However, I think you get the idea.


    Rather than go into all the ins and outs of NIS, let’s use a basic example to
    illustrate how it works. The most common use of NIS is the centralization of user
    and group data. Without NIS, a system authenticates a user by consulting the /etc/passwd
    and /etc/group text files. With NIS, a system consults the user and group map
    made by an NIS master server on the network. The master server creates these maps
    using local /etc/passwd and /etc/group files. Therefore, the contents of these
    files on the master server are the domain’s user and group information. When you
    configure a master server, the contents of /etc/passwd and /etc/group are translated
    into databases (or maps) with names like passwd.byname.dir, passwd.byname.pag,
    and group.byname.dir. Therefore, an NIS client will authenticate a user by consulting
    these maps rather than /etc/passwd and /etc/group. (Administrators frequently
    query their clients to consult both.)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Server NIS


    When an administrator creates an NIS domain account, or she creates an entry in
    the NIS master server''s /etc/passwd and /etc/group files. The administrator then
    runs the shell script ypmap to update the maps. To replicate the changes of these
    maps to the slave servers, or she then uses a utility called ypush. The exact
    process can vary according to implementation and can be customized: Make a change
    to the configuration file, update the map, “push” to the slave servers.


    Network Information Service Plus (NIS+), is the next generation of NIS. Like NIS,
    it is a distributed database system that allows you to maintain commonly used
    configuration information on a master server and propagate the information to
    all the hosts in your network. However, it is not an enhancement to NIS; it is
    a whole new service. The Windows 2000 Server for NIS does not support NIS+. But
    this should not be a problem, since NIS implementations are for more common.


    # 10.3.2 What Server for NIS Can Do


    Server for NIS can make a Windows 2000 domain controller serve as an NIS master
    server for a domain (or multiple domains) with UNIX slave servers and clients.
    It can also turn a domain controller into a slave server, as long as the master
    is a Windows 2000 system running Server for NIS. The reason for this is that Server
    for NIS stores maps in Active Directory, and the information of which is automatically
    replicated in Active Directory. UNIX slave servers obtain copies of Server for
    NIS maps via the usual UNIX protocols.


    Storing maps in Active Directory is a key feature of Server for NIS. In addition
    to replication, you have strong security mechanisms in place. Perhaps most though,
    is the unification of Windows and UNIX user accounts in Active Directory. We have
    seen, and will see in later chapters, that interoperability schemes typically
    require duplicate user accounts: one for UNIX, one for Windows. These accounts
    must be identical to the letter and case for these schemes to work. Server for
    NIS will take any NIS object that has a corresponding Windows object, such as
    adds UNIX attributes to the Windows object. It does so by creating an auxiliary
    class for the Active Directory User group. In this auxiliary class are attributes
    corresponding to the fields of /etc/passwd. There are attributes for the user
    identifier (UID), the group identifier (GID), home directory, login shell, geccos
    information, as well as others. This effectively unites the UNIX and Windows 2000
    user databases.


    Server for NIS stores the user''s password in UNIX format in the msSFPassword
    attribute. When a user sets or changes his or her password while working on a
    Windows 2000 system, Server for NIS stores the UNIX-style encrypted password in
    this attribute. As long as the user makes a password change on a Windows 2000
    system, the Windows and NIS passwords are synchronized. If a user changes his
    or her password on a UNIX system using a utility like ypasswd, the password is
    changed only in this attribute, with no effect on the Windows password. Thus,
    we still have a dichotomy in user accounts, which can be resolved only with the
    separate Password Synchronization feature of SFU.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 10.3.3 Migrating an HP-UX NIS Master to Server for NIS


    You can migrate the data of an HP-UX NIS master server to Server for NIS and then
    use the Windows 2000 system as the new master server. You can either use a command-line
    utility called nis2ad to migrate your data, or can use the Migration wizard. This
    example will use the Migration wizard.


    # 10.3.3.1 First Step: Check the Name Service Switch


    You must be careful with the name service switch, which is configured by the /etc/nsswitch.conf
    file. By default, this file has the following contents:


    ```

    passwd         files nis

    group          files nis

    hosts           dns [NOTFOUND=return] nis [NOTFOUND=return] files

    networks        nis [NOTFOUND=return] files

    protocols       nis [NOTFOUND=return] files

    rpc             nis [NOTFOUND=return] files

    publickey      nis [NOTFOUND=return] files

    netgroup        nis [NOTFOUND=return] files .

    automount       files nis

    aliases         files nis

    services        nis [NOTFOUND=return] files

    ```


    If, for example, you have the name service switch consult NIS only for services,
    and the services map is empty, your system cannot communicate with your HP-UX
    system on the network. (I discovered this the hard way.) My recommendations:


    +   1. Leave the default /etc/nsswitch.conf file alone; it can accommodate most
    environments.

    2. Migrate only the password, group, and hosts maps. These are easily modified
    on Windows 2000.


    # 10.3.3.2 Second Step: Run the Migration Wizard


    To open NIS Server Migration, click Start, point to Programs, point to Windows
    Services for UNIX, and then click NIS Server Migration. You get the screen shown
    in Figure 10–6.'
  merge: -1
