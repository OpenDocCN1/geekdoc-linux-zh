- pgno: 60
  md: '# The Internet Layer


    We now proceed to the next level of the four-layer TCP/IP model, the internet
    layer, sometimes called the network layer. (If the word internet is not capitalized,
    it refers to the inter-networking of networks in a generic sense. The word Internet
    (with a capital I) refers to the now worldwide public internetwork.) The Internet
    layer enables pieces of data, usually called datagrams, to find their correct
    destination, even if the destination is several networks away. Within the TCP/IP
    protocol suite, IP, the Internet Protocol, is responsible for the routing of these
    datagrams. Because of the recent Internet phenomenon, TCP/IP is omnipresent these
    days, making it a key to system interoperability. TCP/IP runs on a wide variety
    of platforms: mainframes, Macs, VAXs, and of course UNIX and Windows 2000 systems.
    Therefore, your desktop computer may run Windows 2000, you can connect to a Web
    server running HP-UX 11 or Linux, since the Web relies on Hypertext Transfer Protocol
    (HTTP), a TCP/IP application. So let''s look at TCP/IP concentrating in this chapter
    on IP, the network layer.


    TCP/IP began as a part of the Defense Department''s Advanced Research Projects
    Agency in 1969. It was incorporated into BSD UNIX in the early 1980s and is part
    of every current implementation of UNIX. Microsoft released a completely rewritten
    TCP/IP suite with the release of Windows NT 3.5 in 1994. Whatever the source,
    any vendor claiming to prove TCP/IP must ensure that it adheres to the Internet
    Standards set forth in the Request for Comments (RFC) document series. According
    to RFC 2026, The Internet Standards Process – Revision 3, p. 3, “The Internet
    standards process is an activity of the Internet community by the Internet Architecture
    Board (IAB) and the Internet Engineering Steering Group (IESG)” are the official
    means of these bodies to regulate Internet standards. You can find the RFCs in
    a number of locations on the Internet, one of which is the Internet Engineering
    Task Force''s Web site at www.ietf.org.


    A first step in internetworking is to standardize on TCP/IP. Older network applications
    often used NetBEUI (NetBIOS Extended User Interface) to communicate with each'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 4 • The Internet Layer


    other. Similar applications on Windows NT and Windows 2000 can use NetBEUI, IPX/SPX,
    AppleTalk, and of course TCP/IP. All Windows network applications default to TCP/IP,
    and UNIX networking is practically synonymous with it.


    In Chapter 3, "The Network Interface Layer," we looked briefly at the network
    interface layer, mentioning Ethernet and Fibre Channel in the major, and talked
    about that layer''s drivers. Now we move up the "stack," if you will, to the major
    protocols that exist at or near the internet layer.


    # 4.1 ARP


    IP uses a 32-bit addressing scheme to send datagrams. However, these addresses
    are logical; in other words, they are not tied to a particular system. In fact,
    in Dynamic Host Configuration Protocol (DHCP) environments IP addresses for particular
    machines change all the time. (We will talk about DHCP later.) IP must respond
    on a protocol that sits between and the network interface layer to find the physical
    hardware address of a machine. That protocol is the Address Resolution Protocol,
    or ARP.


    Let''s assume your network is Ethernet. Ethernet sends frames to other systems
    using the 48-bit hardware address burned into the NIC (MAC address). When IP sends
    a datagram to Ethernet for delivery, that datagram contains the destination IP
    address. Since Ethernet does not understand IP addresses, it uses ARP to determine
    the appropriate hardware address of the machine owning the destination IP address,
    and once does so, delivers the frame. ARP then goes through the broadcast mechanism
    again. Cache entries for frequently destinations do not have to go through the
    broadcast last up to 10 minutes in Windows 2000, five minutes on HP-UX. Static
    entries do not expire.


    ARP sends an ARP request in the form of a broadcast to find the hardware address
    of the destination system. All systems on the network hear this request, but only
    the owner of the destination IP address will respond with an ARP request containing
    its hardware address. If the IP address belongs to a system on a remote network,
    then the first-hop router will reply to the ARP request, though the ultimate destination
    may be several routers away. This service is known as proxy ARP.


    # 4.1.1 Viewing the ARP Cache


    4.1.1.1 Windows 2000


    To view the ARP cache in Windows 2000, use the arp -a command. For example:


    ```

    C:\>arp

    ```


    Interface: 10.0.0.3 on Interface 0x2

    Internet Address Physical Address Type

    10.0.0.4 08-00-09-83-31-b1 dynamic

    10.0.0.5 08-00-5a-d8-1e-a9 dynamic

    10.10.1.1 00-60-b0-6a-8e-9c dynamic'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ARP


    Here you see that all four cache entries are labeled *dynamic*: that is, they
    are acquired automatically, without user intervention. Dynamic entries last for
    a maximum of 10 minutes. You can see the expiration time of unreferenced entries
    by changing the value of the following Registry entries in


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\ArpCacheLife\ArpCacheMinReferencedLife

    ```


    Notice that the hardware addresses are given as six hexadecimal bytes separated
    by dashes. HP-UX requires the use of colons:


    # 4.1.1.2 HP-UX


    HP-UX also has the *arp -a* command, but the output is different.


    ```

    # arp -a

    houyhhnmm.book.local (10.0.0.3) at 0:8:0:a36:f7 ether

    aix1.book.local (10.0.0.5) at 8:5a:d8:e1-a9 ether

    ```


    Notice that HP-UX provides the host name as well as the IP address for each entry.
    Also, note that the hardware addresses are given as six hexadecimal bytes separated
    by colons. By default, dynamic ARP cache entries stay in the cache for five minutes.
    To change this parameter, use the *ndd -set /dev/arp arp_cleanup_interval* command,
    specifying the interval in milliseconds. For example, the first command will set
    the ARP cleanup interval to six minutes; the second will display the new value:


    ```

    # ndd -set /dev/arp arp_cleanup_interval 360000

    # ndd -get /dev/arp arp_cleanup_interval

    ```


    # 4.1.2 Deleting ARP Cache Entries


    # 4.1.2.1 Windows 2000


    In Windows 2000, do *arp -a* to find the entry you want to delete and then supply
    only the IP address to the *arp -d* command. For example:


    ```

    C:\arp -a

    ```


    | Interface: 10.0.0.3 on Interface 0x2 Type |

    | Internet Address Physical Address dynamic |

    | 10.0.0.5 08-00-5a-d8-e1-a9 dynamic |

    | 10.0.0.4 08-00-09-83-31-b dynamic |

    | 10.0.10.1 00-60-b0-6a-8e-9c dynamic |


    ```

    C:\arp -d 10.0.0.4

    C:\>arp -a

    ```'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 4 • The Internet Layer


    | Interface: 10.0.0.3 on Interface 0x2 |

    | Internet Address | Physical Address | Type |

    | 10.0.0.5 | 08-00-5a-d8-1e-a9 | dynamic |

    | 10.10.1.1 | 00-60-b0-6a-8e-9c | dynamic |


    # 4.1.2.2 HP-UX


    HP-UX requires that you provide the host name of the entry to be deleted, not
    the IP address, as in Windows 2000.


    ```

    # arp -d w2kserv.book.local

    w2kserv.book.local (10.10.1.1) deleted

