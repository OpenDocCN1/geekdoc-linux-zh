- pgno: 231
  md: '# Chapter 13 • Miscellaneous Interoperability Topics


    Click Next, and then provide the IP address of the HP-UX print server and the
    name of the printer you want to print. You will then be instructed to install
    the appropriate printer driver. Many of HP''s print drivers are already on the
    installation CD. If the driver you''re looking for does not exist, then check
    Hewlett-Packard''s Web site. Once you install the driver, you are ready to begin
    printing from Windows 2000 to HP-UX.


    Print Services for UNIX supports printing only to UNIX computers the LP service
    (for example, Berkeley Software Distribution [BSD] UNIX computers). HP-UX is System
    V-based, but its implementation of lp connects BSD and System V features, making
    it compatible with LP requests.


    Sometimes, Printer Control Language (PCL) print jobs from Windows 2000 clients
    to HP-UX print servers fail after printing junk. This is because the Windows 2000
    PCL driver sends a raw PCL file to the HP-UX spooler queue, which by default is
    not set up to handle raw output. You can fix this by editing the interface file.
    For example, the interface file on my test system, hpux1, was /var/spool/lp/interface/dj648c,
    created when I added the printer using SAM and named after the printer. This is
    a simple text file. I changed the outputmode variable to raw instead of cooked.
    As a result, the Windows 2000 system printed PCL files just fine.


    # 13.3.2 Windows 2000 Print Server with Locally Attached Printer


    Printing in the other direction is even simpler. First, as in the previous configuration,
    you install Print Services for UNIX. Then, connect the printer to the Windows
    2000 print server. If your printer is Plug-and-Play compatible and the driver
    already exists on the system, you simply make sure the printer is turned on during
    reboot or hardware scan. Then, you configure the HP-UX system to print to the
    Windows 2000 server.


    When you run SAM→Printers and Plotters→LP Spool→Printers and Plotters, you select
    Add Remote Printer/Plotter from the Actions menu. Then you fill in the screen,
    something-like Figure 13–9.


    Something to watch out for is when you add a printer to Windows 2000, the default
    name is often long and contains spaces. Be sure to give the printer a nice, short
    name like dj648c. This will prevent any confusion for the HP-UX system. Once you
    add the remote printer, you can start printing from applications or the command
    line. There is no need to specify an interface script name, since the Windows
    2000 printer driver will do all the processing.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Conclusion


    ![](img/1c1e7552b53cca888836b6c6895bdb48_232_0.png)


    Figure 13–9 Configuring a remote printer on HP-UX SAM.


    # 13.4 Conclusion


    So, we end with a brief look at other interoperability tools. NAS will play an
    increasingly important role in mixed environments and will many server-based solutions.
    Managing X Window can be quite complex, but it offers a way to continue using
    UNIX-based systems even if you migrate your environment to Windows 2000. Inter-platform
    printing can take many forms, but the traditional method of attaching printers
    to a print server of some kind is easily assimilated in mixed environments. However,
    most sites have ways to print over the network to printers using JetDirect cards,
    regardless of the operating system in which the job arises.


    Thus, we end this book. Certainly, we did not look at every aspect of UNIX and
    Windows 2000 interoperability in all its details. Such would have produced a large,
    unwieldy book. However, I think we achieved the objective of providing some practical
    advice to administrators managing the most common tasks they face in a mixed environment.
    I hope you found this book useful.'
  merge: -1
  img_proc: true
