- pgno: 74
  md: 'You can set the MTU of a network adapter manually by changing the value of
    the follow-ing Registry parameter:


    ```

    HKLM\System\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\n<interface-name>=MTU

    ```


    Setting a value for this parameter will override anything discovered dynamically
    (provided, of course, that you have not disabled Path MTU discovery). But, according
    to the Windows 2000 Server Resource Kit, if you enter a value greater than the
    dynamically determined MTU, the system uses the value of the dynamically determined
    MTU instead. You can use this entry to reduce, not to increase, the size of the
    MTU.


    # 4.2.9.2  HP-UX


    By default, when a new routing entry is created for the local subnet, the Don''t
    Fragment bit is never turned on. If the route is for a remote destination, the
    Don''t Fragment bit is not initially set. Instead.


    +   1. An ICMP Echo Request of full MTU size is generated and sent out with the
    Don''t Fragment bit on.

    2. The datagram that created the routing table entry is sent immediately without
    the Don''t Fragment bit set.

    3. If no response to the Echo Request is received, the Don''t Fragment bit is
    never turned on for that route. If an ICMP Fragmentation Needed message is received
    from the Echo Request, the PMTU is reduced accordingly, and a new Echo Request
    with the new PMTU is sent. This process repeats as necessary. If a response to
    this Echo Request is received, the Don''t Fragment bit is set for all future packets.


    If you want the Don''t Fragment bit set on all outgoing datagrams, issue the following
    command:


    ```

    # ndd -set /dev/ip ip_pmtu_strategy 1

    ```


    If you want to disable PMTU discovery, use 0 instead of 1 for the above command.
    Using the route -p pmtu command. According set the PMTU for a static route in
    HP-UX The -p pmtu option is only useful if you know the network topology well
    enough to choose an appropriate PMTU for a host or network route. If fragment
    a datagram to the PMTU specified for the route on the local host before sending
    the datagram to the remote. If the PMTU specified in the route command is correct,
    it will avoid fragmentation by routers along the path. Using the -p pmtu option
    can simplify the maintenance of route when the same PMTU can be applied to all
    hosts on a network. However, this feature can result in poor network performance
    or connectivity problems if a network consists of multiple media with different
    PMTUs. Therefore, using the -p pmtu for a network route should be used with some
    caution. (For more information, see the Release Notes for HP-UX 11.0, Section
    7.18.1.)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 4.2.10 The Ping Command


    There are some significant differences in the ping command of the operating systems
    under discussion. The syntax of Windows 2000 ping is


    ```

    ping [-t] [-a] [-n count] [-l length] [-f] [-i ttl] [-v tos]

    [-r count] [-s count] [[-j] computer-list | [-k computer-list]

    [-w timeout] destination-list

    ```


    The syntax of HP UX ping is


    ```

    ping [-oprv] [-i address] [-t ttl] host [-n count]

    ping [-oprv] [-i address] [-t ttl] packet-size [-n count]

    ```


    Windows 2000 uses the -f option (sends a packet with a Don''t Fragment flag) and
    -l option (Echo Request packet with a specified data length) to determine the
    PMTU manually. For example, the following two commands demonstrate that the PMTU
    is set to the maximum for Ethernet:


    ```

    C:\> ping -f 1472 10.10.1.1

    ```


    Pinging 10.10.1.1 with 1472 bytes of data:


    ```

    Reply from 10.10.1.1: bytes=1472 time<10ms TTL=128

    Reply from 10.10.1.1: bytes=1472 time<10ms TTL=128

    Reply from 10.10.1.1: bytes=1472 time<10ms TTL=128

    Reply from 10.10.1.1: bytes=1472 time<10ms TTL=128

    ```


    Ping statistics for 10.10.1.1:


    ```

    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),

    Approximate round trip times in milliseconds:

    Minimum = 0ms, Maximum = 0ms, Average = 0ms

    ```


    ```

    C:\>ping -f 1473 10.10.1.1

    ```


    Pinging 10.10.1.1 with 1473 bytes of data:


    ```

    Packet needs to be fragmented but DF set.

    Packet needs to be fragmented but DF set.

    Packet needs to be fragmented but DF set.

    Packet needs to be fragmented but DF set.

    ```


    Ping statistics for 10.10.1.1:


    ```

    Packets: Sent = 4, Received = 4, Lost = 0 (100% loss),

    Approximate round trip times in milliseconds:

    Minimum = 0ms, Maximum = 0ms, Average = 0ms

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Conclusion


    In the first command, we specified 1472 as the data length because if we add the
    ICMP Echo Request (8 bytes) and the IP header (20 bytes), we get 1500, the MTU
    of Ethernet. By adding another byte in the second command (1473), we exceeded
    the Ethernet MTU and received ICMP error messages to that effect. You can specify
    the packet size in HP-UX with the packet_size parameter.


    +   - In Windows 2000, the -t option means the ping will continue without interruption.
    In HP-UX, -ttl sets the time-to-live in a multicast datacagram.

    - In Windows 2000, the -a option resolves addresses to computer names. There is
    no -a option in HP-UX. Windows 2000 has a -i option to set the time-to-live. HP-UX
    uses the -t option.

    - The -v option of Windows 2000 ping sets the type-of-service field to the value
    specified by tos; in HP-UX, it specifies verbose output, where ICMP packets other
    than Echo Responses are shown.

    - The -r count option in Windows 2000 ping records the route of the outgoing packet
    and the returning packet in the route field. In HP-UX, -r specifies to bypass
    the normal routing tables and send to a host on an attached network.

    - Windows 2000 ping has a -s count option, specifying the timestamp for the number
    of hops specified by count. HP-UX does not have a -s option.

    - In Windows 2000, -j computer-list routes in loose-source mode packets by way
    of the list of computers specified by computer-list, and -k computer-list routes
    in strict-source mode packets specified by computer-list. The closest HP-UX equivalent
    is -o, which inserts an IP Record Route option in outgoing packets, summarizing
    routes when the command terminates.

    - Windows 2000 has a -w timeout option, specifying a timeout interval in milliseconds.
    HP-UX does not have this option.

    - Finally, if you ping from an HP-UX system and do not specify the number of pings
    with the -n count option, ping keeps sending packets until interrupted (Ctrl-C).
    Windows 2000 ping will continue only four times unless you specify more with the
    -n count option.


    # 4.3 Conclusion


    The network layer revolves around IP. If Microsoft has rewritten the TCP/IP stack,
    it does interoperate with that of HP-UX. There are a number of differences in
    the behavior of commands like arp and ping, but Windows 2000 supports NetBEUI
    and IPX/SPX, real UNIX and Windows interoperability begins with standardizing
    on TCP/IP.'
  merge: -1
  img_proc: true
