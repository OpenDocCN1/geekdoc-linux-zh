- pgno: 86
  md: '# Name Resolution


    As stated in Chapter 5. "The Transport Layer." Windows 2000 networking services
    are NetBIOS-based. Traditionally, this has required using the NetBIOS name cache,
    LMHOSTS files, and WINS to resolve NetBIOS computer and service names to IP addresses.
    Beginning with Windows 2000, such entities are not necessary as long as you have
    Windows 2000 systems in your network. As of this writing, though, a Windows 2000-only
    network is unlikely, not to mention that this book assumes you have UNIX-based
    clients and servers running in your enterprise. Pre-Windows 2000 systems and the
    tools that make UNIX interoperable with Windows systems currently use NetBIOS.
    Therefore, it is highly likely that you will continue to have to manage both NetBIOS
    name resolution and TCP/IP host resolution.


    # 6.1 Windows 2000


    # 6.1.1 Computer Names


    A Windows 2000 full computer name is the same thing as a fully qualified domain
    name (FQDN). An FQDN consists of a host name plus the primary DNS suffix. These
    can be set when you install the system or by right-clicking on My Computer, choosing
    Properties, and then clicking on the Network Identification tab. Click on the
    Properties button and you will see the Identification Changes Box, like the one
    in Figure 6–1.'
