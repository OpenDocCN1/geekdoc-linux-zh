- pgno: 118
  md: '# User Authentication


    Before we look at the interoperability of applications, we need to look at the
    issue of user authentication. We do so because most, if not all, of these applications
    require some kind of verification that the users are who they say they are. For
    example, if you use the Telnet application on a Windows, 2000 computer to connect
    to a UNIX system, you are asked to provide a user name and password. You are already
    authenticated by Windows 2000, but you need authentication from the UNIX system.
    If you install a Telnet-server on a Windows 2000 system and wish to connect to
    it via Telnet, you will go through an authentication process there as well. So
    it is a good idea to examine how authentication takes place in both Windows 2000
    and UNIX (again using HP-UX as our example), so that we have some idea of what''s
    going on when you issue a user name and password.


    This chapter examines authentication only, not authorization. Authentication is
    the process of verifying the identity of a user to the system. From the system''s
    standpoint, authentication answers the question, “Do I know you?” If it does,
    you have access to the system. If not, you do not have access. Authorization is
    the process of determining what an authenticated user can do. The system knows
    who you are and grant you access, exactly what you can perform on the system is
    a matter of authorization.


    # 8.1 Windows 2000


    In Windows 2000, the Security Accounts Manager (SAM) stores local user accounts
    in the local registry. Domain accounts are stored in Active Directory, though
    a SAM for these accounts continues to exist for backward compatibility. Local
    accounts are just that: They exist only for the local computer. Domain accounts
    extend to all the computers that are members of the domain. A Windows 2000 domain
    controller has two user databases: Active Directory for domain'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Chapter 8 • User Authentication


    accounts and SAM for backward compatibility. You can start a domain controller
    in Directory Services Restore Mode, in which case the controller uses SAM instead
    of Active Directory for its user database. Workstations, member servers, and standalone
    servers still maintain a SAM database.


    # 8.1.1 Interactive Logon


    Interactive logon is getting access to your local system. It begins with the Secure
    Attention Sequence (the CTRL+ALT+DEL keys). Executing this sequence signals the
    Winlog process (winlog.exe), which has been running since system startup, to call
    the Graphical Identification and Authentication (GINA) DLL. GINA displays the
    Log On to Windows dialog box, collects the user information for log on, and sends
    it to the Local Security Authority (LSA). This dialog box provides you with the
    opportunity to log on to the local computer or to a domain. The LSA is responsible
    for verifying your user credentials, which include the user name and password.(See
    Figure 8-1 for a depiction of receipt of these credentials, LSA runs a module
    (or “package”) based on which authentication protocol is in use. Windows 2000
    supports two authentication protocols for network logins: NT LAN Manager and Kerberos
    v5. These protocols also support remote logons as well, but for now we concentrate
    on how they handle interactive logons.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_119_0.png)


    Figure 8-1 The Local Security Authority. From Microsoft Windows 2000 Server Distributed
    Systems Guide, p. 58.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Windows 2000


    # 8.1.1.1 NTLM


    NTLM is the default for pre-Windows 2000 systems and is still supported for mixed
    environments and for logging on using local accounts. It uses the MSV1_0 authentication
    package and the Net Logon service.


    MSV1_0 takes the clear text password issued by the user, encrypts it, and then
    converts it into a LAN Manager password and a Windows NT password. If the account
    is local, MSV1_0 queries the local SAM to validate the password. If the account
    is a domain account, MSV1_0 passes the password to the local Net Logon service.
    Net Logon then sets up a secure communication with the authenticating server''s
    Net Logon service. The authenticating server then takes over the task of validating
    the user against its SAM (which is also the domain''s SAM). The domain''s SAM
    sends a Security Identifier (SID) for the user to the LISA, with SIDs for the
    user''s groups, which then creates the access token based on this information
    for the logon session. The access token also contains the user''s privileges and
    is attached to every process the user creates.


    # 8.1.1.2 Kerberos


    For authenticating domain users, Windows 2000 uses the Kerberos v5 authentication
    protocol for default. However, users running pre-Windows 2000 systems will continue
    to be authenticated using NTLM.


    MIT developed the Kerberos authentication system, and its Web site is still one
    of the best sources on the protocol. We will describe Kerberos only in its most
    basic form in this chapter, it is possible to visit www.mit.edu/kerberos/ for
    more information. MIT Kerberos is available for free download. Kerberos on Windows
    2000 is an integral part of the operating system.


    The name Kerberos comes from Greek mythology: It was the name of the three-headed
    watchdog of Hades. In keeping with this heritage, the Kerberos authentication
    system consists of three main parts: the application client (e.g., ftp), the application
    server (e.g., ftpd), and the key distribution service running on a separate, physically
    secure server that acts as an intermediary between the application client and
    the application server. The key distribution service, as the name implies, dispenses
    keys to both clients and servers. These keys are used to encrypt and decrypt messages
    that verify the identity of the parties involved. The key distribution service
    runs on the Key Distribution Center (KDC). The KDC provides clients with tickets,
    which give them access to services.


    The KDC maintains a database of security principals. A security principal is anything
    that has an account in it: user, group, computer, or service. The database of
    security principals maintained by the KDC constitutes its realm, more or less
    the equivalent of a Windows 2000 domain. It should be no surprise, therefore,
    that the KDC runs as a Windows 2000 domain service on each domain controller,
    using Active Directory (not SAM) as its account. The account database contains,
    among other things, an encryption key for all users, derived from their logon
    passwords. This encryption key is often referred to as the long-term key.'
