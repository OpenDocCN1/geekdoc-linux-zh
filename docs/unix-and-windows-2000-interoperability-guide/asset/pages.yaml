- pgno: 16
  md: '# PREFACE


    There is a debate raging among many computer professionals over the merits (or
    demerits) of the UNIX operating system versus those of Microsoft''s Windows 2000
    (formerly NT). I address the fact that there is more than one version of UNIX
    in the first chapter, but for ease of communication I will simply say "the UNIX
    operating system" for now. This type of debate, often bordering on a religious
    war, is not a new phenomenon. Typically, they run both. Presumably, they concerning
    MVS and VMS, then VMS and UNIX, then UNIX and DOS, then UNIX and Windows NT. All
    the while, we have seen similar battles pitched over Windows, OS/2, and Mac OS.


    Quite frankly, I don''t care which of these operating systems and their variants
    is "better." Nor do a lot of businesses. The reality is that most businesses run
    either some form of UNIX or some form of Windows in their environments. Typically,
    each type of operating system offers something the other does not. Granted, much
    of what was once considered the domain of UNIX—the Internet, for example—Windows
    2000 is relatively new at. Also, Windows 2000''s legacy is that of the PC world,
    which most people associate with DOS, Windows, and Intel processor-based computers.
    So a dichotomy has naturally developed in the last several years, and many IT
    departments reflect this dichotomy: They maintain independent workers and staffs
    based upon operating systems. Administrators in these cases know little little
    the "other side" works


    The times, however are a-changin''. Increasingly it is the network that really
    matters, and for that, the world has standardized on TCP/IP and the applications
    that run on top it: FTP, Telnet, HTTP, DNS, NFS, CIFS, and SNMP. Web servers offer
    applications that clients can access with a browser, regardless of platform that
    runs on. NFS products are available for Windows systems; you can install CIFS
    servers on UNIX systems. IT departments typically deploy any number of platforms
    to support this and other network services. So the key is finding ways to minimize
    the impact of operating system differences so that administrators concentrate
    on higher-level technical issues.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'The goal of this book is to do that. It is aimed at experienced system administrators
    who already know concepts such as DNS, directory services, and file systems. It
    also assumes that they are already familiar with one or the other respective operating
    systems—UNIX or Windows 2000—and all they need is a jump start to do key tasks
    with the operating system that is new to them. Finally, it does indeed provide
    interoperability tips. It is important to note that “interoperability” is not
    just how the two operating systems work together, but how they can coexist. This
    book simply helps an administrator understand how things are done, where the files
    and directories (or folders) are, how similarly commands behave, where commands
    and utilities are equivalent. Ultimately, the book will help the administrator
    make peaceful coexistence and interoperability a reality.


    # Organization of This Book


    With the exception of the first two chapters, each chapter of this book contains
    material pertaining to Windows 2000, UNIX (usually with HP-UX examples), and interoperability.
    We use the four-layer TCP/IP model as the model of this book, starting with the
    network interface layer, the Internet layer, the transport layer, and then the
    application layer. Application layer issues the priority of chapters.


    +   - Chapter 1, “What Is UNIX?”, is a good Chapter for administrators with mostly
    Windows backgrounds to read. While not a comprehensive introduction to UNIX, it
    will help these administrators make sense of the examples in the book.

    - Chapter 2, “What Is Windows 2000?”, is for UNIX-oriented administrators. Again,
    it is designed to help UNIX administrators understand the Windows 2000 examples
    in this book rather than to be a definitive overview.

    - Chapter 3, “The Network Interface Layer,” examines network interface cards and
    drivers, and also briefly at Ethernet and Fibre Channel technologies.

    - Chapter 4, “The Internet Layer,” examines a few key topics at this layer, including
    ARP, ICMP, IP, routing, and ping.

    - Chapter 5, “The Transport Layer,” concentrates on comparing tunable TCP parameters
    between Windows 2000 and HP-UX. We also look at UDP and network application programming
    interfaces.

    - Chapter 6, “Name Resolution,” begins the application layer discussion. Name
    resolution is a key component to network application interoperability. We look
    at such as computer names, resolver DNS, BIND, and NetBIOS.

    - Chapter 7, “DHCP and DNS,” looks more closely at these two technologies. Of
    particular importance is whether HP-UX DHCP clients can have their IP addresses
    registered with Microsoft’s dynamic DNS.

    - Chapter 8, “User Authentication,” looks at topics such as NTLM, Kerberos, NIS,
    and pluggable modules.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   • Chapter 9. "Basic TCP/IP Utilities," compares the Windows 2000 and HP-UX
    versions of Finger, Ftp, Ttip, Rsh, Rcp, Rexec, and Telnet, and describes to what
    degree these utilities interoperate.


    +   • Chapter 10. "Windows Services for UNIX," describes this optional product
    for Windows 2000, concentrating on the Telnet client and server and Server for
    NIS.


    +   • Chapter 11. "NFS File Sharing," looks at employing NFS as a file sharing
    mechanism between Windows 2000 and HP-UX. The Windows 2000 NFS component is part
    of Windows Services for UNIX.


    +   • Chapter 12. "CIFS File Sharing," compares CIFS and NFS and looks at Hewlett-Packard''s
    CIFS/9000 product, available in both client and server versions.


    +   • Chapter 13. "Miscellaneous Interoperability Topics," briefly describes network-attached
    storage, X Window, and Lpr as interoperability tools.'
