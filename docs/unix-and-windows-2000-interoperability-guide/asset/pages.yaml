  md: '# 9.7.2 The Windows 2000 Telnet Client


    Microsoft provides a Telnet server with its optional Services for UNIX product;
    the client is automatically installed. If you run Start→Run... and then type telnet
    in the Open box, you get a command prompt running the Telnet client, as shown
    in Figure 9–9.


    ![](img/1c1e7552b53cca888836b6c6895bdb48_159_0.png)


    Figure 9–9 The Windows 2000 Telnet client. This client runs in a command prompt
    window.


    The Windows 2000 Telnet client is pretty basic, providing VT100, VT52, and ANSI
    (based on VT100) emulation and supporting only a few subcommands and options.
    The syntax of Windows 2000 Telnet is telnet [host [port]], where the optional
    host parameter is the host name of the destination system and the optional port
    parameter is the destination port if the default port of 23 is not used. Typing
    telnet starts the Telnet client, which prompts you for a subcommand. To connect
    to a remote computer, type the open command at the Microsoft Telnet> For example:


    ```

    Microsoft Telnet> open hpux1

    ```


    To view current Telnet client settings, use the display command. For example:

    Microsoft Telnet> display

    Escape Character is ''CTRL+]''

    WILL AUTH (NTLM Authentication)

    LOCAL ECHO off

    Sending both CR & LF

    WILL TERM TYPE

    Preferred Term Type is ANSI'
