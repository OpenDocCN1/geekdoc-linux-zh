    Non-authoritative answer:

    Name: hp.com

    Addresses: 192.151.11.32, 192.151.52.13, 192.151.52.10, 192.151.11.13


    You can also see the order of lookups by using the policy subcommand when nslookup
    in interactive mode. For example,


    ```

    # nslookup

    Using /etc/hosts on: hpux1


    > policy

    #Lookups = 2

    files [RCCR]  dns [RRRR]


    > exit

    ```


    HP-UX also allows you to keep your options for the nslookup command in a file
    in your home directory called .nslookup. Type man nslookup on the command line
    for more information.


    # 6.4 Name Resolution Issues in a Mixed Environment


    # 6.4.1 The HOSTS Versus the LMHOSTS File


    The format of the Windows 2000 HOSTS file and the UNIX /etc/hosts file is the
    same: IP address followed by host and alias names. If you employ DNS (as most
    sites do now), the question often asked is “Should I maintain a HOSTS file (Windows
    2000 or UNIX)?” The answer to that is, “It depends.” A hosts file is handy as
    a fallback mechanism, which your DNS server become unavailable for some reason.
    It can also be useful if you want to Telnet to UNIX systems on a network where
    IP addresses are not entered into DNS.


    If you have a system providing NetBIOS services and you have NetBIOS over TCP/IP
    enabled, the Windows 2000 HOSTS file will not help you. In this case, you might
    need to put its IP address and name into the LMHOSTS file and preload them with
    #PRE directive and/or make these systems (and your clients) are WINS clients.


    # 6.4.2 The NetBIOS Legacy


    There is a good chance that Windows 2000 systems will coexist with legacy Windows
    systems for a while. Also, your UNIX interoperability tools may continue to run
    NetBIOS. For these reasons it will be necessary to manage NetBIOS resolution and
    all that it entails: name cache, LMHOSTS, and WINS. However, you can greatly simplify
    your life by maintaining a WINS server in your organization and making all your
    clients WINS clients. This is also true of UNIX systems running NetBIOS. Such
    as Samba can make a WINS file and print a WINS client, which in turn will enable
    it to show up in browse lists.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 6.4.3 The DNS Server


    UNIX systems typically employ some version of BIND as their DNS server. Windows
    2000 DNS is a different piece of software. While both BIND and Windows 2000 DNS
    are RFC-compliant, there are some important differences between the two:


    +   * Dynamic updates support

    * WINS and DNS integration

    * Active Directory support


    6.4.3.1 Dynamic Updates

    Windows 2000 DNS supports dynamic updates, which is the ability to register new
    systems and their IP addresses automatically in the DNS database. BIND version
    8.1.2 or later also supports dynamic updates; however, many UNIX systems still
    run BIND 4.9.7, which does not. If your current implementation of DNS does not
    support dynamic updates, you should disable client-side registration by clearing
    the Register this connection''s addresses in DNS box in the Advanced TCP/IP Settings.
    (See Figure 6–5.) This will keep your DNS servers from being bombarded with registration
    requests from your clients.


    6.4.3.2 WINS

    Windows 2000 DNS can be configured to query a WINS server should it fail to find
    a client''s request. The DNS server then passes on the response to the client
    on behalf of the WINS server. The resource records that support this functionality—WINS
    and WINS-R—are found only in Windows 2000 DNS servers.


    6.4.3.3 Active Directory

    If your DNS service not run on a Windows 2000 server, then you must make sure
    that the service supports the SRV (service location) resource record in order
    to support Active Directory. BIND 4.9.6 and later support SRV resource records.
    According to Microsoft, if you use a third-party server, however, you cannot use
    the DNS console or Dnscmd.exe. Active Directory integration, secure dynamic update,
    aging and scavenging of stale records, or record administration. A complete description
    of how to integrate non-Windows 2000 DNS servers and Active Directory can be found
    in the Microsoft Windows 2000 Server TCP/IP Networking Guide, pp. 429–433.3'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Chapter 6 • Name Resolution


    # Advanced TCP/IP Settings


    ![](img/1c1e7552b53cca888836b6c6895bdb48_99_0.png)


    **Figure 6–5** Clearing Automatic Client DNS Registration. Get to this screen
    by right-clicking My Network Places, choosing Properties, right-clicking Local
    Area Connection, and choosing Properties→Internet Protocol→Properties→Advanced→DNS.


    # 6.4.4 DHCP


    DHCP was developed to ease the TCP/IP configuration process and to accommodate
    mobile computing and sites that frequently move their clients. As DHCP was deployed,
    it became apparent that there was a new problem to solve: how to keep DNS updated
    when clients kept their IP addresses.


    Actually, this problem wasn''t so bad for a lot of organizations. Typically, the
    pattern that all the UNIX systems used TCP/IP and had their configurations manually.
    The PC-based systems, at least initially, ran NetBEUI or IPX/SPX. As they converted
    to TCP/IP, their configuration was usually done through a DHCP server because
    it was so simple to do. Most sites saw no need for DNS to keep track of PC-based
    client systems and their IP addresses, since these systems usually did not provide
    shares or other services. (That''s the job of servers).'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# References


    However, as UNIX systems started becoming DHCP clients, the need to update DNS
    really became apparent, because things such as file transfers between clients
    was (and still is, in some places) commonplace in that community.


    Windows 2000 DHCP clients can either register their IP information directly with
    DNS or do it on their behalf. You can configure Windows 2000 DHCP servers to do
    this for non-Windows 2000 systems by selecting the Enable updates for DNS clients
    that do not support dynamic updates on the DNS tab of the DHCP console. Whether
    your UNIX DHCP server can do this depends on the vendor. The HP-UX 11 server does
    not support registering with DNS. The Internet Software Consortium (ISC) DHCP
    distribution 3.0, in beta, will support DNS.


    # 6.5 Conclusion


    In this chapter, we looked how name resolution takes place within Windows 2000
    and HP-UX. Windows 2000 computer names are based on DNS domain names. You can
    set both primary and connection-oriented suffixes in Windows 2000. For compatibility
    with other Windows systems, Windows 2000 systems still have NetBIOS computer names.
    In an all-Windows 2000 network, name resolution is done with DNS. In a mixed network
    with Windows 2000 and non-Windows 2000 systems, DNS is tried first, then NetBIOS.
    NetBIOS name resolution is the same as on Windows 2000 as it is on pre-Windows
    2000 systems. Windows 2000 continues to support Windows for mixed environments.


    HP-UX host names are using the hostname command or the set_params script. They
    do not use NetBIOS computer names unless you install something like AdvancedServer.
    The /etc/hosts file, NIS, DNS, or some combination of the three to resolve names.
    To configure which of these methods to use, and in what order, you configure the
    name service. The BIND resolver has a lookup process similar to the one on Windows
    2000, involving a number of system variables and the /etc/resolv.conf file.


    There are also differences in tools such as nslookup, and DHCP. Windows 2000 DNS
    is a dynamic DNS, whereas you must have BIND version 8.1.2 or later on UNIX systems
    to support dynamic updates. The Microsoft DHCP server can update a Microsoft DNS
    server on behalf of its clients.


