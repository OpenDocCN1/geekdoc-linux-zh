    not login.


    Using NTLM in this manner provides a single sign-on capability in that a single
    Windows 2000 domain controller maintains login and password management. However,
    it would be incorrect to think that you have a unified user account management
    system. In order for you to do anything on your HP-UX system (commands, utilities,
    applications), you have to have a user account on that system. To log in you have
    to have another account on your Windows 2000 domain controller. In other words,
    if you have a new user to your network, you will have to create an HP-UX account
