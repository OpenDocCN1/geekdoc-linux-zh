- pgno: 69
  md: '# Chapter 4 • The Internet Layer


    Each route consists of a destination host or network, a netmask, and a gateway
    (router address) to use in forwarding datagrams. These three items are displayed
    along with the interface used for the route and the hop count (metric). The hop
    count usually indicates the number of routers that must be crossed to reach the
    network ID.


    The first line, the Active Routes section of this command''s output, is the default
    route address, designated with a 0.0.0.0 network destination and a 0.0.0.0 netmask.
    The second line is the loopback network address, for IP addresses in form of 127.x.y.z.
    The next line is an entry for the directly attached network address for datagrams
    staying on the same local network. Following that is the local host address. All
    datagrams with the host''s IP address are forwarded to 127.0.0.1 (the loopback
    address). Next is the network broadcast address, which corresponds to the all-subnets
    broadcast address. Then comes the multicast address, which is used to route multicast
    datagrams. The last line contains the limited broadcast address


    # 4.2.3.2 HP-UX


    It is common to use the netstat -r command to display the routing table in HP-UX.
    Using the -n option with this command displays addresses instead of host names.
    (Use -v to display the network masks in the route entries.)


    ```

    # netstat -nr

    Routing tables

    Dest/Netmask Gateway Flags Refs Use Interface Pmtu

    127.0.0.1 127.0.0.1 UH 0 570 lo0 4136

    10.0.0.4 10.0.0.4 UH 0 905 lan0 4136

    10.0.0.0 10.0.0.0 U 2 0 lan0 1500

    127.0.0.0 127.0.0.1 U 0 0 lo0 4136

    ```


    In addition to displaying the destination host or network, netmask, and gateway
    addresses, this command has a few more fields. The Flags field shows whether the
    route is up (U), whether the route is to a gateway (G), or whether the route is
    a host or network route (with or without H). The Use field shows a count of packets
    sent using this route. The Interface identifies which network interface (logical
    name of IP address) is used for the route. The Pmtu field displays the path maximum
    transmission unit (PMTU).


    The first line indicates the route for the loopback host address. Notice the command
    displays the loopback interface''s logical name, not IP address. The next line
    is for the local host address, which has the system''s IP address instead of the
    loopback address as the gateway. Following that is the directly attached network
    address; this line is similar to the one displayed in Windows 2000. The fourth
    line is the loopback network address for IP addresses in the form of 127.x.y.z.,
    just as it is in the default gateway.


    # 4.2.4 IP Routing Processing


    On a given system, IP can receive datagrams from either other protocol running
    on the local host or from another system through the network through the NIC.
    In the first case, IP forwards'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'the datagram according to the local routing table. This is known as routing.
    In the second case, IP will discard datagrams not addressed to the local host
    unless the local host is config- ured be a router. In the former, IP sends routing
    error messages to the upper protocols. In the latter, it sends them in the form
    of Internet Control Message Protocol (ICMP) messages to the sending host.


    The routing algorithms for Windows 2000 and HP-UX are nearly the same. In both
    systems, IP performs a bit-wise AND between the netmask in the routing entry and
    IP datagram''s destination address and then compares it with the address in the
    entry. If they match, IP selects the route. If there is more than one route selected
    as a result of this process, IP selects the route with the longest netmask. This
    results in a more specific route because the longer netmask, the narrower range
    of IP addresses. With Windows 2000, if more than one route matches at this point,
    IP selects the route with the lowest metric. If there is still more than one,
    IP randomly selects the route.


    The default route is the least specific route and is selected only if there is
    none more specific. If the chosen route''s gateway is the same address as the
    interface, the destination is local and IP sends the datagram directly. If the
    route''s gateway is not the same as the interface, IP forwards the datagram to
    the gateway.


    Using the routing table, IP on HP-UX takes the following actions:


    +   1. Look for a matching complete-destination IP address. With the network and
    with the host ID. If the G flag set, IP forwards the datagram to the next-hop
    router. If the H flag is set, IP sends the datagram directly to a system on the
    local network.


    +   2. Find an entry that matches the network ID. If found, IP sends the datagram
    either to the next-hop router or the locally attached system. Again, IP checks
    for the appropriate flag for this.


    +   3. Use the default route, appropriately labeled "default." IP sends the datagram
    to the next-hop router.


    # 4.2.5 Configuring Routes


    # 4.2.5.1 Windows 2000


    If you are using DHCP, then the default route is automatically provided. If you
    use static information, then you specify the default gateway in the Internet Protocol
    (TCP/IP) Properties-box. (See Figure 4–2.) By clicking on the Advanced button
    of this box, you can enter additional default gateways.'
  merge: -1
  img_proc: true
