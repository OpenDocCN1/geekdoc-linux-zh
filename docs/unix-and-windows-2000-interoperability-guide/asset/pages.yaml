    you should keep the user names the same on both systems. Otherwise, you have to
    maintain a user map file. This maps HP-UX user names to Windows 2000 domain user
    names so that when you log in to HPUX, PAM NTLM knows what Windows 2000 user name
    to use when authenticating. You will probably need to have this file regardless
    of whether user names match in at least one case—the administrative account—you
    will have two different names: root for HP-UX and administrator for Windows 2000.


