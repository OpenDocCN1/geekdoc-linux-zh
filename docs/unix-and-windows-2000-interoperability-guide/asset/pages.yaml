- pgno: 259
  md: '# INTEROPERABILITY/UNIX AND WINDOWS


    # UNIX & WINDOWS 2000

    INTEROPERABILITY GUIDE


    # THE TASK-FOCUSED QUICK REFERENCE FOR EVERY UNIX/WINDOWS SYSADMIN


    If you''re a system administrator in a mixed UNIX and Windows 2000/NT environment,
    you need fast answers for *both* platforms: step-by-step techniques for performing
    key tasks and real-world solutions for integration. UNIX and Windows 2000 Interoperability
    Guide delivers all that, in a proven quick-reference format that''ll save you
    time, effort, and money.


    Long-time UNIX sysadmin and MCSE Alan R. Roberts focuses on practical techniques
    for experienced system administrators—not basic theory for beginners. Each chapter
    addresses one essential system administration task, offering UNIX "how-to" instructions
    and practical interoperability tips for heterogeneous environments.


    # COVERAGE INCLUDES:


    +   - Effective file and print sharing in UNIX/Windows environments

    - Multiplatform TCP/IP and DNS solutions

    - File systems, file and directory locations, and command behavior

    - Detailed coverage of HP-UX, with supplementary techniques for Linux*, Solaris*,
    and AI environments


    When you need interoperability solutions, you don''t have to search through piles
    of UNIX and Windows manuals. *With UNIX and Windows 2000 Interoperability Guide*,
    you won''t have to!


    > ALAN R. ROBERTS is a long-time UNIX system administrator who also holds a MCSE
    Certification. He has 15 years of system administration and research experience;
    first at the Boeing Company and later as a Solutions Specialist for Hewlett-Packard''s
    Americas Technical Computing Advanced Technology Center (ATC). He currently works
    at EMC Corporation, specializing in network attached storage.


    U.S. $34.99 Canada $53.00


