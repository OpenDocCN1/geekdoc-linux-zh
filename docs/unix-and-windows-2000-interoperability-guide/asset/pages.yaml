- pgno: 78
  md: '# CHAPTER 5


    # The Transport Layer


    At the transport layer we have the connection-oriented Transmission Control Protocol
    (TCP) and the connectionless User Datagram Protocol (UDP). While both HP-UX and
    Windows 2000 implementations of TCP/IP interoperate, they differ significantly
    in the tunable parameters. This chapter briefly describes those parameters.


    # 5.1 TCP


    The TCP connection establishment process between HP-UX and Windows 2000 works
    per the standard:


    +   1. The client sends a synchronize (SYN) segment to the server, specifying
    a destination port number and initial sequence number (ISN).

    2. The server responds with a SYN segment containing its ISN and an acknowledgment
    (ACK) containing the client''s ISN plus one.

    3. The client acknowledges the server''s SYN segment by acknowledging the server''s
    ISN plus one.


    TCP ports are well-defined and standardized. The common TCP ports are listed in
    Table 5–1. Windows 2000 networking services are often NetBIOS-based, making TCP
    port 139 an important one.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Table 5–1 Commonly Used TCP Ports


    | Service Name | Port |

    | FTP (Data Channel) | 20 |

    | FTP (Control Channel) | 21 |

    | Telnet | 23 |

    | HTTP | 80 |

    | NetBIOS session service | 139 |


    #  5.1.1 Tunable Parameters


    5.1.1.1 Maximum Segment Size (MSS) and Path MTU Discovery

    In Chapter 4, “The Internet Layer,” we talked about Path maximum transmission
    unit (MTU) discovery, in which the Don''t Fragment bit in the IP header is sent
    to see if any router along the path returns an Internet Control Message Protocol
    (ICMP) error. TCP handles Path MTU discovery during connection setup, when each
    side can announce its maximum segment size (MSS). If the receiving end does not
    announce its MSS, TCP on the sending station will use one of 536 bytes. By that
    point, TCP will send IP datagrams with the Don''t Fragment bit set. If a router
    returns ICMP Destination Unreachable-Fragmentation Needed, TCP will start adjusting
    its MSS until no more messages are received.


    By default, Windows 2000 sends TCP segments with the Don''t Fragment flag set
    in the IP header. Therefore, Windows 2000-initiated TCP sessions automatically
    participate in MTU discovery. Windows 2000 will adjust the TCP MSS to the MTU
    of the router indicated in the ICMP Destination Unreachable-Fragmentation Needed
    message.


    HP-UX TCP on HP-UX will also adjust its MSS from ICMP Destination Unreachable-Fragmentation
    Needed messages. This is the default. To disable this behavior, use the following
    command:


    ```

    # nd -set /dev/tcp tcp_ignore_path_mtu 1

    ```


    If you run the above command, TCP will default to an MTU of 576 bytes (536-byte
    MSS plus 40 bytes for the IP and TCP headers).


    # 5.1.1.2 Receive Window Size


    Windows 2000 TCP does not have a value for the receive window size; instead, it
    uses an algorithm to set it dynamically. This algorithm, taken from the Microsoft
    Server TCP/IP Core Networking Guide, p. 95, is as follows:'
  merge: -1
  img_proc: true
- pgno: 80
  md: '1. The first connection request to a remote host advertises a receive window
    size of 16 kilobytes (KB) or 16,384 bytes.


    2. Upon establishing the connection, the receive window size is rounded up to
    an integral multiple of the TCP MSS that was negotiated during connection setup.


    3. If the rounded-up value is not at least four times the MSS, then it is adjusted
    to 4 × MSS, with a maximum size of 64 KB, unless a window-scaling option (RFC
    1323) is in effect.


    To override this process and set the window size manually, edit the following
    Registry-entry:


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\nInterface\<interface>\TcpWindowSize

    ```


    HP-UX The default maximum size for the receive window of time is 32,768 bytes.
    To specify another value, use the following command, where window_size is in:


    ```

    # ndd -set /dev/tcp tcp_rec_hiwater_window_size

    ```


    You can also set the maximum size for the receive window of "long, fat pipes"
    (Lfp), as Fibre Channel, using the ndd -set /dev/tcp tcp_rec_hiwater_lfp command.
    The default for this value is 65,536 bytes. For receive windows of "long, narrow
    pipes" (Inp), as PPP, use the ndd-set /dev/tcp tcp_rec_hiwater_inp command. The
    default here is 8,192 bytes.


    # 5.1.1.3 TCP Keep-Alive Messages


    You can set it at Windows 2000 TCP sends keep-alive messages on an inactive connection
    with the following Registry parameter:


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\ParametersKeepAliveTime

    ```


    The default interval is 7,200,000 milliseconds (two hours). Often, applications
    like Telnet, rather than users, set up keep-alive messages.


    In HP-UX the following kernel parameters affect TCP behavior for keepalive packets:


    +   * tcp_keepalive_interval

    * tcp_ip_abort_interval

    * tcp_ip_abort_cinterval

    * tcp_keepalive_detached_interval


    The parameter tcp_keepalive_interval determines the amount of time that TCP waits
    for an idle connection with no unacknowledged data before sending keep-alive packets.
    The default is two hours. You can use the ndd command to reset the default. The
    argument to this command is in milliseconds. For example, to set the keep-alive
    interval to three hours, you would type:


    ```

    # ndd -set /dev/tcp tcp_keepalive_interval 108000000

    ```'
