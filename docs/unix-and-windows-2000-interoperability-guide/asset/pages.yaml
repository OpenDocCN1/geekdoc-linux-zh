- pgno: 36
  md: '# What Is Windows 2000?


    If you are a long-time UNIX system administrator, Windows 2000 may seem like a
    fortified version of Windows 98. Or, you may think that Windows 2000, installed
    mostly on Intel processor-based systems, is directly descended from the old DOS
    world. Windows 2000, built on NT technology, however, is a completely different
    beast from both DOS and Windows 98. So how did it come to be? Again, let''s look
    at a little history.


    # 2.1 A New Operating System


    For a long time (in computer-industry time), when someone thought of a PC, he
    or she usually thought of an Intel processor based running some form of DOS. Even
    Windows 95 and Windows 98 were based on DOS. However, to say that Windows 2000
    is a PC operating system is somewhat misleading. For one thing, it is not based
    on DOS. For another, Windows 2000 can run on more than just an Intel processor.
    In 1988, Microsoft began working on a new operating system that would have a number
    of highly desirable features:


    +   * The ability to run on different processors

    * Be multiuser and multitasking

    * Meet C2-level security

    * Be scalable for the enterprise

    * The ability to support legacy DOS and Windows applications


    It was designed to be an operating system for high-end workstations and servers
    where UNIX had dominated. (Today, Windows 2000 runs on "everyday" PCs and laptops.)
    To lead this effort, Microsoft recruited David Cutler from Digital Equipment Corporation
    (DEC). Cutler was an experienced system designer who knew a lot about things multitasking,
    but it took him and his team five years to release the first version of what was
    to become Windows NT.'
