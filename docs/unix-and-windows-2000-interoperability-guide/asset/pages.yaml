  md: '# 6.2.3 The BIND Resolver


    The /etc/resolv.conf file configures the BIND resolver and can contain one of
    four options:


    | domain default_domain | You need specify the host name is not an |

    | For example: | FQDN and you have not configured the search |

    | domain dev.emc.com | option. |

    | | You can have up to six domains listed, separated |

    | | spaces or tabs. If a name request does not end in |

    | | a dot, the resolver will append these domain names |

    | | in order, one at a time, before submitting the query to |

    | | DNS. |

    | search domain | You can specify up to three name server IP |

    | For example: | addresses, each on a separate line beginning with the |

    | search dev.emc.com it.emc.com | nameserver option name. |

    | nameserver name_server_IP_address | |

    | For example: | |

    | nameserver 132.22.0.4 | |\n| options ndots:n | Sets a threshold for the number
    of dots which must |

    | For example: | appear in a name before an initial FQDN query is |

    | options ndots:2 | made. The default value is 1.


    The resolver submits names to DNS in the following manner (taken from Hewlett-Packard''s
    Installing and Administering Internet Services, pp. 65–67).


    +   * If the target name ends with a dot, BIND looks it up as, without appending
    any domains to it.

    * If the name to be queried contains at least the number of dots specified by
    the ndots option in the /etc/resolv.conf file. BIND looks it up as, before appending
    any domains to it. (The default value of ndots is 1, so if the target name contains
    at least one dot, it will be looked up as, before any domains are appended to
    it.)

    * If the target name consists of a single component (no dots), and you have set
    up a host aliases file, BIND looks up in your aliases file to translate the alias
    to a fully qualified host name. You can create a host aliases file for frequently
    typed host names, like the following example:


    ```

    john zircon.chem.purdue.edu

    melody fermata.music.purdue.edu

    ```


    The aliases (the first field on each line) must all be one word, with no dots.
    To use the file, set the HOSTIALASES environment variable to the name of the file,
    as in in the following example:


    ```

    export HOSTIALASES=/home/andrea/myalaises

    ```'
  merge: -1
