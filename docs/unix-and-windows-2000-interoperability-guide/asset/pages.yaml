    # 12.6 Conclusion


    We''ve looked at CIFS file sharing in this chapter by focusing on HP''s CIFS/9000,
    the server portion which is based on Samba. We looked at both the server and found
    that a Windows 2000 domain controller can do all the authenticating. For the server,
    we can specify in /etc/opt/samba/smb.conf that the domain controller will do the
    authenticating. For the client, we can specify NTLM or Kerberos authentication.
    On top of all that, we see that Server for NIS can help us achieve a unified user
    database by combining NIS maps with Active Directory and can be used in conjunction
    with CIFS/9000. While there may be some details we haven''t covered here, we have
