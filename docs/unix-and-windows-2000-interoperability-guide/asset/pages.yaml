- pgno: 91
  md: '# 6.1.5 NetBIOS


    NetBT is Microsoft''s implementation of NetBIOS over TCP/IP, but we will assume
    you use TCP/IP and the more commonly used term NetBIOS instead. NetBIOS-based
    applications use NetBIOS to locate resources, establish connections, and receive
    data, and terminate connections. These services are the name service, the session
    service, and the datagram service. Because NetBIOS uses names to identify network
    resources, the name service is particularly important, since it manages the registration
    and resolution of names. The name service uses UDP port 137. The session service
    establishes, maintains, and terminates reliable, point-to-point connections between
    NetBIOS applications. A NetBIOS session must be established before any SMB (Server
    Message Block, the file-sharing protocol) transactions can take place. The session
    service uses TCP port 139. The datagram service, using UDP port 138, handles messages
    that does not require a session.


    NetBIOS identifies network resources by names, not addresses. These names are
    16 characters long and usually contain a computer name, a user name, or a domain
    name. You can specify the first 15 characters of these names, the sixteenth character
    is reserved to specify the specific network component addressed. For example,
    the NetBIOS name for the service (identified by 0 hex) for the computer JETHRO<00>.
    The domain master browser (identified by 1 hex) for the domain CLAMPETT is CLAM-PET<1B>.
    On Windows 2000 systems, you can view which names a computer has registered by
    typing nbtstat -n at a command prompt.


    # 6.1.6 NetBIOS Name Registration


    How are the names created? Usually, they are created when a service starts, like
    at system startup and when a service starts, its associated name is registered
    either by network broadcast or by consulting a NetBIOS name server (usually WINS).
    If a client is not configured to register its name with a name server, it will
    send a name broadcast called a Name Registration Request at startup on the local
    subnet. After a few tries, if no other client has contested the name, the client''s
    name is officially registered on the subnet (can be seen by running nbtstat -n
    command). If the system is a WINS client, it sends a Name Registration Request
    directly to the WINS server, which does the job of ensuring the uniqueness of
    the name before entering it into its database. Since broadcasts are normally confined
    to subnets, it is wise to use WINS to enable internetwork registration.


    # 6.1.7 NetBIOS Name Resolution


    How a system resolves NetBIOS names to IP addresses depends on its node type.
    Systems are one of five node types:'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# HP-UX\n\n| B-node | Broadcasts to resolve names. |\n| P-node | Queries WINS\
    \ to resolve names. |\n| M-node | Broadcasts first, then queries WINS if that\
    \ fails. |\n H-node | Queries WINS first, then broadcasts if that fails. |\n|\
    \ Enhanced | Uses the local LMHOSTS file DNS, in addition to the other types.\
    \ |\n\nBy default. Windows 2000 systems are configured as B-node unless you specify\
    \ a WINS server. in which case they become H-node. A Windows DHCP client can obtain\
    \ its node type from a DHCP server. As with name registration, name resolution\
    \ is greatly facilitated when you employ WINS in your environment.\n\nIf you configure\
    \ your Windows 2000 system to be a WINS client and it becomes an H-node, the following\
    \ name resolution process takes:\n\n+   1. The client checks the NetBIOS cache\
    \ to see if there is a matching entry for the target system. The cache can be\
    \ preloaded with contents of the LMHOSTS file. The comments in that file for more\
    \ information.\n2. If that fails, it contacts the WINS server via a directed datagram,\
    \ a routable message sent directly to the WINS server.\n3. If that fails, it resorts\
    \ to broadcasting on the local network.\n4. If that fails, it checks the LMHOSTS\
    \ file, if enabled.\n\nThis process generally reduces broadcast traffic and the\
    \ need for maintaining LMHOSTS files. Remember, beginning with Windows 2000, this\
    \ process takes place only after the DNS name resolution failures.\n\n# 6.2 HP-UX\n\
    \n# 6.2.1 Computer Names\n\nYou can set the name of an HP-UX system upon installation\
    \ or by running the /sbin/set_parms hostname command. This host name can be a\
    \ simple computer name of up to 64 characters, or it can be an FQDN. If it is\
    \ not an FQDN, you must provide the domain option in the /etc/resol.conf file\
    \ (See the next section, \"Lookup Process.\") UNIX systems do not have NetBIOS\
    \ computer names unless install a file-sharing package, if not all, such packages\
    \ allow you to make a UNIX system a WINS client. In some, such as Advanced Server/9000,\
    \ you also have the equivalent of a NetBIOS name cache.\n\n# 6.2.2 Lookup Process\n\
    \nHP-UX systems can consult any of the following to resolve host names and IP\
    \ addresses: a local /etc/hosts file, an NIS hosts map, or DNS. Which of these\
    \ sources is consulted, and in order, is determined by the name service switch."
