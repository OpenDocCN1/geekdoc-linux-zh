    \ mounts, generally referred to as automounts, occur only when you access an exported\
    \ directory and stay in effect while in use. After a period of inactivity, usually\
    \ five minutes, the mount goes away. For a long time, the Automounter utility\
    \ enabled automounts. More recently, a new utility called AutoFS improves on the\
    \ old Automounter. For one thing, it can mount directories using NFS protocol\
    \ version 3, as well as version 2. Automounter used only in version 2 the old\
    \ Automounter created mounts using the /tmp_mnt directory and make symbolic links\
    \ to the actual mount points, often confusing users. With AutoFS, the configured\
    \ mount points and the actual mount points are the same. HP-UX 11 by default employs\
    \ Automount, but you can migrate to AutoFS easily.\n\nConfiguring either Automounter\
    \ or AutoFS can get very complex, and for more information, consider HP's Configuring\
    \ and Administering NFS. One thing that makes it particularly confusing is the\
    \ use of the term map. Both NIS and the automounter utility uses the term map,\
    \ and you can integrate both NIS and automounter, you can use what is known as\
    \ the -hosts automounter map. The -hosts map causes the utilities to mount all\
    \ the exported directories from any NFS server on the network when someone accesses\
    \ any of those exported directories. To do this, you may add the following line\
    \ to the automounter map file:\n\n```\n/net -hosts nosuid\n```\n\nOr, the automounter\
    \ map file itself might be a NIS map! Hence confusion.\n tested the use of the\
