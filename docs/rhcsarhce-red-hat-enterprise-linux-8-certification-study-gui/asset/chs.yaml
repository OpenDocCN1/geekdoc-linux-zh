  \ GUI，它将接管第一个虚拟控制台。\n\n![Images](img/squ1.jpg) 你可以在 GUI 中打开多个命令行终端。\n\n![Images](img/squ1.jpg)\
  \ 壳通过三个数据流工作：`stdin`、`stdout` 和 `stderr`。\n\n![Images](img/squ1.jpg) 命令重定向允许你使用\
  \ `>`、`>>`、`<`、`|` 和 `2>` 等运算符管理数据流。\n\n### 标准命令行工具\n\n![Images](img/squ1.jpg) Linux\
  \ 中的一切都可以视为文件。\n\n![Images](img/squ1.jpg) 如 `pwd` 和 `cd` 等命令可以帮助导航目录。\n\n![Images](img/squ1.jpg)\
  \ 目录路径、`PATH` 和波浪号 (`~`) 等概念可以帮助你理解并在壳中使用命令。\n\n![Images](img/squ1.jpg) 基础命令允许你查找所需文件并读取内容。这些命令包括\
  \ `ls`、`find` 和 `locate`。\n\n![Images](img/squ1.jpg) 文件创建和删除命令包括 `touch`、`cp`、`ln`、`mv`\
  \ 和 `rm`；相应的目录创建和删除命令是 `mkdir` 和 `rmdir`。\n\n![Images](img/squ1.jpg) 命令可以使用 `alias`\
  \ 命令进行自定义。\n\n### 文件权限\n\n![Images](img/squ1.jpg) 标准 Linux 文件权限为读、写、执行，这些对于用户所有者、组所有者和其他用户可能有所不同。\n\
  \n![Images](img/squ1.jpg) 特殊权限包括 SUID、`SGID` 和粘滞位（sticky bits）。\n\n![Images](img/squ1.jpg)\
  \ 默认用户权限基于 `umask` 的值。\n\n![Images](img/squ1.jpg) 使用 `chown`、`chgrp` 和 `chmod` 命令更改所有权和权限。\n\
  \n![Images](img/squ1.jpg) 使用 `lsattr` 命令列出特殊属性，并通过 `chattr` 修改。\n\n### 管理文本文件\n\n\
  ![Images](img/squ1.jpg) Linux 通过一系列文本文件进行管理。\n\n![Images](img/squ1.jpg) 文本文件可以使用\
  \ `cat`、`less`、`more`、`head` 和 `tail` 等命令作为流读取。\n\n![Images](img/squ1.jpg) 使用 `touch`、`cp`、`mv`\
  \ 和 `rm` 创建、复制、移动和删除新文件。\n\n![Images](img/squ1.jpg) 命令可以使用 `alias` 命令进行自定义。\n\n\
  ![Images](img/squ1.jpg) 像 `sort`、`grep`、`wc`、`sed` 和 `awk` 等过滤器支持处理文本。\n\n![Images](img/squ1.jpg)\
  \ 理解 Vim 和 gedit 等编辑器是一项关键技能。\n\n### 获取文档\n\n![Images](img/squ1.jpg) 如果你需要命令的提示，请直接运行它；或者尝试\
  \ `-h` 和 `--help` 开关。\n\n![Images](img/squ1.jpg) `whatis` 和 `apropos` 可以搜索主题的 man\
  \ 页。\n\n![Images](img/squ1.jpg) 如果命令或文件有 info 手册，你可以在 `/usr/share/info` 目录下找到它。\n\
  \n![Images](img/squ1.jpg) 许多软件包在 `/usr/share/doc` 目录中包含大量的文档和示例。\n\n## 测试\n\n由于\
  \ Red Hat 考试没有单选题，因此书中也没有单选题。这些问题专门测试你对本章内容的理解。\n\n### 壳 (Shells)\n\n1. RHEL 9 默认壳的名称是什么？\n\
  \n2. 从 GUI 中，什么组合键可以切换到第三个虚拟控制台？\n\n### 标准命令行工具\n\n3. 使用哪个单一命令创建 `/abc/def/ghi/jkl`\
  \ 系列目录？\n\n4. 什么符号代表当前用户的家目录？\n\n5. 什么命令可以列出所有以 ab 开头、中间有一个字符、并跟着数字 1、2 或 3 之一的文件？\n\
  \n6. 什么命令可以列出 `/etc` 目录下所有以 .conf 结尾的文件？\n\n### 文件权限\n\n7. 使用哪个单一命令将本地文件 question2.txt\
  \ 的用户所有者更改为教授，组所有者更改为助？\n\n\n\n\n\n### 8. 什么命令列出 `/var/log/messages` 文件的最后 10 行？\n\
  \n### 9. 什么命令从 `/var/log/messages` 文件返回包含术语 `Linux` 的行？\n\n### 10. 什么样的命令序列可以提取\
  \ `/etc/passwd` 中所有包含字符串 `/bin/bash` 的行并按字母顺序排序？\n\n### 11. 什么样的命令序列可以返回默认 shell\
  \ 为 bash 的所有用户？\n\n### 访问文档\n\n### 12. 哪个命令在帮助页（man pages）数据库中搜索引用 `passwd` 命令和配置文件的手册？\n\
  \n### 13. 如果假设的 `abcde` 命令和文件在第 5 节和第 8 节有帮助页，什么命令可以确保调出第 5 节的帮助页？\n\n#### 实验题\n\
  \n红帽（Red Hat）以电子化形式考试。因此，本章的实验可以通过随书的配套网站获取。如果您尚未在系统中设置 RHEL 9，请参考第 1 章查看安装说明。每个实验的答案紧随自测答案之后。\n\
  \n## 自测答案\n\n##### Shells\n\n### 1. RHEL 9 的默认 shell 是 `bash`，也称为 Bourne-again shell。\n\
  \n### 2. 从图形用户界面（GUI）出发，移动到虚拟控制台 3 的组合键是 `CTRL-ALT-F3`。\n\n### 标准命令行工具\n\n### 3.\
  \ 创建 `/abc/def/ghi/jkl` 系列目录的单一命令是 `mkdir -p /abc/def/ghi/jkl`。\n\n### 4. 代表当前用户主目录的符号是波浪号\
  \ (`~`）。\n\n### 5. 命令 `ls ab?[123]` 列出所有以 `ab` 开头、包含一个额外字符、且后续紧跟数字 1、2 或 3 之一的文件。\n\
  \n### 6. 命令 `find /etc -name '*.conf'` 列出 `/etc` 目录下所有以 `.conf` 结尾的文件。\n\n### 文件权限\n\
  \n### 7. 将指定文件的所有者更改为 `professor` 组所有者更改为 `assistants` 的单一命令是：\n\n```bash\n# chown\
  \ professor.assistants question2.txt\n```\n\n使用冒号（:`）代替点（`.`）是可以接受的。\n\n### 管理文本文件\n\
  \n### 8. 列出 `/var/log/messages` 文件最后 10 行的命令是 `tail -n 10 /var/log/messages`。因为\
  \ 10 行是默认值，所以 `tail /var/log/messages` 也是一个有效的解决方案。\n\n### 9. 从 `/var/log/messages`\
  \ 文件返回包含术语 `Linux` 的命令是 `grep Linux /var/log/messages`。其他变体也是接受的，例如 `cat /var/log/messages\
  \ | grep Linux`。\n\n### 10. 命令 `grep /bin/bash /etc/passwd | sort` 提取 `/etc/passwd`\
  \ 中所有包含字符串 `/bin/bash` 的行并按字母顺序排序。\n\n### 11. 回答这个问题有多种方法。一种解决方案是：\n\n```bash\n\
  # awk -F: '{print $1\" \"$7}' /etc/passwd | grep /bin/bash | awk '{print $1}'\n\
  ```\n\n管道中的第一个 `awk` 命令从 `/etc/passwd` 的每一行提取第一和第七字段（用户名和 shell）。结果被传递给 `grep`，它只保留包含\
  \ `/bin/bash` 的行。最后，最后一个 `awk` 命令从输出中选择第一个字段（用户名）。最终结果是该管道返回了所有默认 shell 为 bash 的用户。\n\
  \n### 访问文档\n\n### 12. 在帮助页数据库中搜索引用 `passwd` 命令和配置文件的手册命令是 `whatis passwd`。`apropos`\
  \ 和 `man -k` 命令更，因为它们会列出命令或描述中包含“passwd”文本的帮助页。\n\n### 13. 确保调出第 5 节帮助页的命令是 `man\
  \ 5 abcde`。\n\n## 实验答案\n\n### 实验 1\n\nRHEL 9 的默认 shell 是 `bash`，也称为 Bourne-again\
  \ shell。从 GUI 出发，移动到虚拟控制台 3 的组合键是 `CTRL-ALT-F3`。\n\n### 实验 2\n\n创建 `/abc/def/ghi/jkl`\
  \ 系列目录的单一命令是 `mkdir -p /abc/def/ghi/jkl`。代表用户主目录的符号是波浪号 (`~`）。\n\n#### 实验 3\n\n\
  命令 `ls ab?[123]` 列出所有以 `ab` 开头、包含一个额外字符、且后续紧跟数字 1、2 或 3 之一的文件。命令 `find /etc -name\
  \ '*.conf'` 列出 `/etc` 目录下所有以 `.conf` 结尾的文件。\n\n#### 实验 4\n\n将指定文件的所有者更改为 `professor`\
  \ 所有者更改为 `assistants` 的单一命令是：\n\n```bash\n# chown professor.assistants question2.txt\n\
  ```\n\n使用冒号（:`）代替点（`.`）是可以接受的。\n\n#### 实验 5\n\n列出 `/var/log/messages` 文件最后 10 行的命令是\
  \ `tail -n 10 /var/log/messages`。因为 10 行是默认值，所以 `tail /var/log/messages` 也是一个有效的解决方案。\n\
  \n从 `/var/log/messages` 文件返回包含术语 `Linux` 的命令是 `grep Linux /var/log/messages`。其他变体也是接受的，例如\
  \ `cat /var/log/messages | grep Linux`。\n\n命令 `grep /bin/bash /etc/passwd | sort`\
  \ 提取 `/etc/passwd` 中所有包含字符串 `/bin/bash` 的行并按字母顺序排序。\n\n回答这个问题有多种方法。一种解决方案是：\n\n\
  ```bash\n# awk -F: '{print $1\" \"$7}' /etc/passwd | grep /bin/bash | awk '{print\
  \ $1}'\n```\n\n管道中的第一个 `awk` 命令从 `/etc/passwd` 的每一行提取第一和第七字段（用户名和 shell）。结果被传递给\
  \ `grep`，它只保留包含 `/bin/bash` 的行。最后，最后一个 `awk` 命令从输出中选择第一个字段（用户名）。最终结果是该管道返回了所有默认\
  \ shell 为 bash 的用户。\n\n#### 实验 6\n\n在帮助页数据库中搜索引用 `passwd` 命令和配置文件的命令是 `whatis passwd`。`apropos`\
  \ 和 `man -k` 命令进一步，因为它们会列出命令或描述中包含“passwd”文本的帮助页。\n\n如果假设的 `abcde` 命令和文件在第 5 节和第\
  \ 8 节有帮助页，确保调出第 5 节帮助页的命令是 `man 5 abcde`。\n\n\n\n\n\n# 3.03 IPv6 简介\n# 3.04 使用 Secure\
  \ Shell 和 Secure Copy 进行管理\n\nRHCSA 考试要求你了解如何配置网络接口以及配置主机解析。换句话说，你需要准备好在网络设备上配置\
  \ IPv4 和 IPv6 设置，并将系统配置为域名服务（DNS）客户端，以便其能够解析主机名。\n\n第 1 章介绍了安装过程的基础知识，第 2 章介绍了基本的命令行工具和文件编辑器。下一步是网络配置，这将在本书中介绍。一旦系统连接到网络，你就可以远程连接它、从存储库安装包并配置网络服务。\n\
  \n在你完成测试实验室环境的系统安装后，你将希望能够远程管理它们。理解用于远程管理的 SSH 连接不仅是 RHCSA 的要求，也是现实世界中的一项基本技能。\n\
  \n### 考试内容\n\n### IPv4 和 IPv6\n尽管有非常出色的 GUI 工具可以帮助你管理网络服务，但你应该对命令行工具和配置文件有深入的理解。命令行工具可以帮助你直接或通过相关的配置文件理解和管理网络服务。相关的目标是：\n\
  \n* 配置 IPv4 和 IPv6 地址\n* 配置网络服务在启动时自动启动\n* 启动、停止和检查网络服务的状态\n\n当然，这些目标需要对 IP 网络有基本的了解。\n\
  \n### 名称解析的配置\n名称解析取决于主机名或完全限定域名（FQDN）数据库（例如 `server1.example.com`）以及 IP 地址（例如 `172.16.0.100`）。Linux\
  \ 获取解析信息的来源通常是本地的 `/etc/hosts` 主机名和 IP 地址数据库，以及可用的 DNS 服务器数据库。这些是你为了以下 RHCSA 目标需要学习的内容：\n\
  \n* 配置主机名解析\n\n虽然网络排排除不再是红帽入门级考试的一部分，但你处理网络配置和主机名解析问题的方法可以帮助你更好地理解网络是如何工作的。\n\n\
  ### 安全地访问远程系统和传输文件\nRHCSA 目标规定你需要知道如何：\n\n* 使用 SSH 访问远程系统\n* 在系统之间安全地传输文件\n\n如果系统管理员必须与每个系统物理接触，他们生命的一半时间将花费在往于系统之间的途中。通过\
  \ Secure Shell (SSH) 等工具，管理员可以远程工作并安全地传输文件。虽然 SSH 在 RHEL 9 的标准配置中会自动安装，但诸如基于密钥的身份验证等自定义配置选项将在书的后部分介绍。\n\
  \n### 认证目标 3.01\n\n## 网络基础知识\nTCP/IP 是一系列按层组织的协议，称为协议簇。它是为 Unix 开发的，并最终被采用为互联网通信的标准。IP\
  \ 地址用于识别 IP 网络中的网络接口，IP 寻址是 TCP/IP 最重要的概念之一。有许多 TCP/IP 工具和配置可以帮助你管理网络。\n\n与第 2 章对命令行技能的解释一样，本节对\
  \ TCP/IP 网络的描述是简化的处理，旨在为你参加 RHCSA 考试做准备，而不是对 TCP/IP 网络进行详细介绍。如果你觉得这一部分内容过载或不完整，请参考第\
  \ 1 章引言中列出的 Jang 和 Soyinka 的书籍。Linux 是为网络构建的，如果你不详细了解网络，没有实可行的方法可以通过任何红帽考试。\n\n\
  尽管当前企业网络的重点仍然是 IP 版本 4 寻址，但某些组织已强制转向 IP 版本 6 (IPv6) 网络。本节的重点是 IPv4，而 IPv6 将在本章随后的独立章节中介绍。然而，用于\
  \ IPv4 的大多数配置文件和工具也适用于 IPv6。\n\n### IPv4 网络\n每个在网络上通信的网络接口都需要自己的 IP 地址。某些地址被永久分配给网络接口；这些被称为\
  \ `static`（静态）IP 地址。另一些是从动态主机配置协议（DHCP）服务器租赁的，；这些被称为 `dynamic`（动态）IP 地址。\n\nIPv4\
  \ 地址是 32 位二进制数，通常以“点点十进制”法表示（例如 `172.16.0.100`），每个十进制字节代表 8 位。IP 地址由两部分组成：网络（或 `subnet`）地址和主机部分。在\
  \ 1993 年互联网工程任务组（`https://www.ietf.org`）发布 RFC 1517 之前，IP 地址被分为不同的类。\n\n### 网络与路由\n\
  如前一节所述，IP 地址有两个部分：网络部分和主机标识符。为了确定网络部分和主机部分，IP 地址与子网掩码（`subnet mask`，也称为 `netmask`\
  \ 或前缀 `prefix`）关联。这是一个由一系列 1 后紧跟 0 组成的 32 位数。\n\n子网掩码可以使用与 IPv4 地址相同的点点十进制法表示。例如，`255.255.255.0`\
  \ 是一个由 24 个二进制 1 和 8 个 0 组成的子网掩码。另一种法被称为无类域间路由（CIDR）表示法，由一个斜杠字符（`/`）后跟一个指示掩码中 1\
  \ 位数的组成。例如，子网掩码 `255.255.255.0` 在 CIDR 表示法中可以写为 `/24`。\n\n给定 IP 地址和子网掩码，确定 IP 地址网络部分的方法就是在\
  \ IP 地址和掩码之间进行逻辑“与”运算。例如，给定掩码为 `/24` 的 IP 地址 `172.16.0.100`，地址的前三个字节（`172.16.0`）代表网络部分，而最后一个字节（`100`）是主机标识符。\n\
  \n\n\n\n\n# IP 地址划分\n\n你可以将网络地址和广播地址之间（不包含这些地址）的 IP 地址分配给网络上的任何计算机。例如，假设你正在为私有网络定义地址范围。从私有网络地址\
  \ `192.168.56.0` 开始，子网掩码为 `255.255.255.0`。根据这些信息，广播地址为 `192.168.56.255`，在该特定网络上可以分配的\
  \ IP 地址范围是从 `192.168.56.1` 到 `192.168.56.254`。该子网掩码也由相关的位数 `24` 定义。换句话说，该网络可以表示为\
  \ `192.168.56.0/24`。\n\nIP 地址分配给网络接口。具有多个网络接口并在不同网络之间转发流量的主机称为 `router`（路由器）。被路由器隔与其他组\
  \ IP 主机之间的 IP 主机必须位于不同的网络中。\n\n与网络和路由相关的概念是`默认网关`（default gateway）。它定义了本地网络与你的机器不知道如何到达的所有其他网络之间的交点。虽然网关\
  \ IP 地址属于本地网络，但该地址被分配给路由器，路由器可能在不同网络（如公共互联网）上拥有 IP 地址。默认网关 IP 地址通常配置在本地系统的路由表中，如下节描述的\
  \ `ip route` 命令所示。\n\n## 工具与命令\n\n有许多工具可以管理你 Linux 计算机上的 TCP/IP 协议族。在旧版本的红帽企业 Linux（Red\
  \ Hat Enterprise Linux）中，一些最重要的网络管理命令是 `ifconfig`、`arp`、`netstat` 和 `route`。这些命令已经弃用，取而代之的是支持更高级功能的\
  \ `ip` 工具。表 3-2 提供了弃用命令列表及其等效的 `ip` 命令。表 3-2 ifconfig、arp 和 netstat 命令及其等效 ip 命令\n\
  \n![Images](img/f0095-01.jpg)\n\n![Images](img/exam.jpg)\n\n尽管它们被认为是“过时的”，但 `ifconfig`、`arp`\
  \ 和 `netstat` 命令在系统工程师中仍然流行。你不需要为了 RHCSA 考试学习它们。然而，如果你是长期的 Linux 用户，并且觉得安装了 `ifconfig`、`arp`\
  \ 和 `netstat` 会更舒服，你可以在 `net-tools` RPM 包中找到它们，该包作为带 GUI 的安装的一部分默认安装（软件安装见第 4 章）。\n\
  \n### 关于接口名称的说明\n\n默认情况下，红帽企业 Linux 9 根据物理位置命名网络接口，例如板载以太网接口使用 `enoX`，PCI 插槽使用 `enpXsY`。表\
  \ 3-3 中给出了一些命名示例。（RHEL 9 仅将 `eth0`、`eth1` 等传统的枚举方法用回备选方案。）因此，你可能会发现第一个板载网络接口命名为\
  \ `eno1`，而位于 PCI 总线 3 槽 0 上的接口将命名为 `enp3s0`。表 3-3 以太网接口名称示例\n\n![Images](img/f0096-01.jpg)\n\
  \n在本章的示例中，测试系统中的网络接口命名为 `eth0`。在你的 RHEL 系统上，名称可能会不同。不要纠结于接口名称！它只是一个名字，不会影响任何网络配置命令的功能。旧的\
  \ `eth*X` 命名方式的缺点是不总是一致的，因为它依赖于启动时检测网络接口的顺序。RHEL 9 中的新命名规范通过在名称中引用接口的物理位置（如 PCI\
  \ 插槽）来帮助解决这个问题。\n\n### ping 和 traceroute\n\n`ping` 和 `traceroute` 命令通常用于诊断和排除网络问题。`ping`\
  \ 命令允许你测试连通性。它可以应用于本地系统、本地网络或不同网络（如互联网）上的 IP 地址。在本节的目的下，假设你的 IP 地址为 `192.168.56.100`，本地网络上的默认网关地址为\
  \ `192.168.56.1`。如果你遇到连接问题，请按顺序尝试以下 `ping` 命令。第一步是测试计算机自身的 TCP/IP 完整性：\n\n```\n\
  # ping 127.0.0.1\n```\n\n通常情况下，`ping` 在 Linux 上持续运行；你需要按 CTRL-C 停止此命令。如果你需要验证到局域网的连接，`ping`\
  \ 本地网络接口的 IP 地址：\n\n```\n# ping 192.168.56.100\n```\n\n如果有效，`ping` 网络上的另一台计算机。然后跟踪到互联网的路由。`ping`\
  \ 网络网关地址（在此情况下为 `192.168.56.1`）。如果可能，`ping` 网络到互联网的连接，这将位于网关的另一侧。可能是路由器在互联网上的公共\
  \ IP 地址。最后，`ping` 网络到互联网的连接。\n\n### 使用 ip 查看当前适配器\n\n`ip` 命令可以显示活动网络适配器的状态。它也可以用于分配网络地址。运行\
  \ `ip link show` 命令查看活动适配器的链路状态。如果你想显示有关网络性能的统计信息，可以选择包含 `-s` 关（`ip -s link show`）。要查看\
  \ IP 地址信息，尝试 `ip address show` 命令，它的输出与 `ip link show` 相同，但包含了 IP 地址及其属性。下列的 `ip\
  \ address show eth0` 命令反映了以太网适配器的当前配置：\n\n![Images](img/f0098-01.jpg)\n\n`ip` 命令是灵活的。例如，`ip\
  \ a s` 命令的功能等同于 `ip addr show` 或 `ip address show`。\n\n### 使用 ip 配置网络适配器\n\n你也可以使用\
  \ `ip` 分配 IP 地址信息。例如，以下命令为 eth0 网络适配器添加了指定的 IP 地址和网络掩码：\n\n![Images](img/f0098-02.jpg)\n\
  \n第一个参数 `172.16.0.50/24` 指定了新的 IP 地址和子网掩码。下一个参数 `dev eth0` 告诉你要配置哪个设备。要确保更改生效，再次运行\
  \ `ip addr show eth0` 命令。\n\n\n\n\n通过正确的选项，`ip` 命令可以修改额外的网络设置。其中一些选项如表 3-4 所示。\n\
  \n### 表 3-4 ip 命令选项\n\n![Images](img/f0099-01.jpg)\n\n然而，你希望确保更改在重启后仍然有效，无论是为了 RHCSA\
  \ 考试，还是为了你想要远程管理的服务器。`ip` 命令适用于故障排除，或临时配置 IP 地址以排查网络问题。它不是制作系统重启后持久更改的合适工具，因为根据定义，使用\
  \ `ip` 命令所做的任何更改都是临时的。要对网络配置进行永久更改，请使用 `nmcli` 或手动修改 `/etc/NetworkManager/system-connections`\
  \ 目录下的配置文件（稍后会描述）。\n\n#### 激活和禁用网络适配器\n\n可以使用 `ip` 命令来激活和禁用网络适配器。例如，以下命令会禁用并重新激活第一个以太网适配器：\n\
  \n![Images](img/f0099-02.jpg)\n\n#### 作为诊断工具的 ip\n\n地址解析协议 (ARP) 将网络接口的硬件地址 (MAC)\
  \ 与 IP 地址关联。`ip neigh` 命令显示本地计算机上的硬件地址和 IP 地址表。该命令可以帮助检测网络上的重复地址等问题。此类问题可能发生在配置不当的系统或克隆虚拟机上。如果需要，你可以使用\
  \ `ip neigh` 命令手动设置或修改 ARP 表条目。由于硬件地址是不可路由的，ARP 表局限于本地网络。以下是该命令的示例输出，显示了本地数据库中所有的\
  \ ARP 条目：\n\n![Images](img/f0099-03.jpg)\n\n输出的第一列列出了局域网 (LAN) 已知 IP 地址，随后是邻居连接的接口及其链路层地址\
  \ (MAC 地址)。最后条目显示邻居的硬件地址是否可达。STALE 条目可能表示自上次看到来自该主机的数据包以来，其 ARP 缓存已过期。如果 ARP 表为空，则与本地网络上的其他系统不存在最近的连接。\n\
  \n#### 使用 ip route 查看路由表\n\n`ip` 命令是多功能的。该命令的一个重要版本 `ip route` 用于显示路由表。它在功能上等同于已弃用的\
  \ `route` 命令。当带有 `-r` 选项运行时（`ip -r route`），该命令会查找 `/etc/hosts` 文件和 DNS 服务器以显示主机而不是数字\
  \ IP 地址。\n\n本地系统的路由表通常包含默认网关地址的引用。例如，查看 `ip route` 命令的以下输出：\n\n![Images](img/f0100-01.jpg)\n\
  \n已弃用的 `netstat -nr` 命令应该显示相同的表。对于此路由表，网关 IP 地址为 `172.16.0.2`。任何目标不是 `172.16.0.0/24`\
  \ 网络范围的网络数据包都会通过网关地址发送（换句话说，该网关的二层地址将被查询并作为目标 MAC 地址放入帧中）。位于网关地址的系统（通常是路由器）将根据其路由表将该数据包转发到下一个路由器，直到直接连接到目的地的路由器。\n\
  \n#### 使用 ss 显示网络连接\n\n`ss` 命令取代了已弃用的 `netstat` 工具来显示网络连接。通过正确的命令开关组合，它可以显示监听和非监听的\
  \ TCP 和 UDP 套接字。我们喜欢使用的一个命令是\n\n```\n# ss -tuna4\n```\n\n它显示所有使用 IPv4 (`-4`) 以及\
  \ TCP (`-t`) 和 UDP (`-u`) 协议的数字格式 (`-n`) 网络套接字 (`-a`)。如果指定了 `-p` 开，`ss` 还会显示每个套接字的进程\
  \ ID (PID)。图 3-1 展示了示例输出。\n\n图 3-1 ss -tuna4 命令的输出\n\n![Images](img/F03-01.jpg)\n\
  \n在输出末尾，注意 `192.168.122.1:47068` 的对端地址。`47068` 端口号只是远程服务器上的源端口。相应的本地地址 `192.168.122.100:22`\
  \ 指定了来自 `192.168.122.1` 连接的端口号为 `22`（本地 SSH 服务）。你可能看到另一个具有相同端口数的条目，它标识了监听连接的关联 SSH\
  \ 守护进程。此输出中的其他行标识了其他监听服务。\n\n### 认证目标 3.02\n\n### 网络配置与故障排除\n\n现在你已经回顾了 IP 地址及相关命令的基础知识，是时候查看配置文件了。这些配置文件决定了启动过程中是否启动网络。如果激活了网络，这些文件还决定了地址和路由是按照文档静态配置的还是通过\
  \ DHCP 客户端动态配置的。\n\n基础网络配置仅确认系统可以通过其 IP 地址进行通信。但这还不够。如果你指向的是如 `server1.example.com`\
  \ 等系统或如 [www.mheducation.com](http://www.mheducation.com) 等 URL，如果主机名解析无法工作，网络配置是不够的。\n\
  \n![Images](img/job.jpg)\n\n网络问题的一些常见原因是物理性的。本节假设你已经检查了所有网络连接。在虚拟机上，这意味着确保网络接口没有被删除或禁用。\n\
  \n#### 网络配置服务\n\n如果网络配置出现问题，要检查的之一是当前状态。要这样做，请运行以下命令：\n\n```\n# systemctl status\
  \ NetworkManager\n```\n\nRHEL 9 使用名为 Network Manager 的服务来监控和管理网络设置。使用 `nmcli` 命令行工具，你可以与\
  \ Network Manager 交互并显示网络设备的当前状态：\n\n```\n# nmcli dev status\n```\n\n该命令应该列出已配置和激活的设备。如果\
  \ `eth0` 等关键设备未列为已连接，则你的网络连接可能已中断。关键配置文件位于 `/etc/NetworkManager/system-connections`。\n\
  \n错误有时会发生。如果你禁用了适配器或只是丢失了无线连接，尝试简单的方法：重启网络。以下命令使用当前的配置文件重启网络：\n\n```\n# systemctl\
  \ restart NetworkManager\n```\n\n如果简单重启网络服务不起，那么是时候进入文件了。`/etc/NetworkManager/system-connections`\
  \ 目录是 Red Hat Enterprise Linux 存储和检索网络信息的地方。使用现有的 Red Hat 配置工具，你不需要接触这些文件，但了解它们的存在是有好的。每个安装的网络适配器（如\
  \ `ens3`）都会获得自己的 `name.nmconnection` 配置文件，其中 `name` 是设备名称或连接名称。例如，`eth0` 被赋予文件 `eth0.nmconnection`。该文件包含了标识此适配器所需的\
  \ IP 地址信息。\n\n你在 `.nmconnection` 文件中看到的内容取决于以太网网络适配器是如何配置的。例如，查看仅为了安装目的而设置网络的情况。如果你在\
  \ GUI 安装过程中设置主机名时没有配置网络，则网络接口将从 DHCP 服务器获取其 IP 设置。\n\n通常情况下，通过 DHCP 服务器配置的网络选项包括\
  \ IP 地址、网络子网掩码、访问外部网络的网关地址以及该网络任何 DNS 服务器的 IP 地址。\n\n\n\n\n当网络接口配置为从 DHCP 服务器获取\
  \ IP 设置时，相应的 `nmconnection` 文件将至少包含以下指令：\n\n![Images](img/f0102-02.jpg)\n\nNetwork\
  \ Manager 包含了 `nmcli` 工具，用于控制服务的状态并应用网络配置更改。与其通过 `nmcli` 修改配置，不如你可以直接更改设备配置文件。为了这一目的，图\
  \ 3-2 所示的配置文件提供了指导。\n\n图 3-2 eth0 的手动配置\n\n![Images](img/F03-02.jpg)\n\n这些指令中的大多数都是直观易懂的。它们定义了名为\
  \ `eth0` 的以太网网络接口的配置，使用了定义的 IP 地址、子网掩码、默认网关和 DNS 服务器。\n\n保存文件后，你仍然需要通知 Network Manager\
  \ 更改。这可以通过运行以下命令来实现（`con` 是 `connection` 的缩写）：\n\n![Images](img/f0102-03.jpg)\n\n\
  很快，你将看到如何使用 Network Manager 的命令行工具来修改网络设备的配置。\n\n## 网络配置工具\n\nRed Hat 包含了几种可以在 RHEL\
  \ 9 中配置网络设备的工具。第一个是上一节介绍的 Network Manager 命令行工具 `nmcli`。如果你更倾向于基于文本的图形化工具，可以从虚拟终端启动\
  \ `nmtui`。另一种方案是 Network Manager 连接编辑器（Connection Editor），这是一个 GTK+ 3 应用程序，你可以从\
  \ GNOME 终端通过 `nm-connection-editor` 命令启动它。\n\n所有提到的工具都与 Network Manager 系统服务交互。\n\
