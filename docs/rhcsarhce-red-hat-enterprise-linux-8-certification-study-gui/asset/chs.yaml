  \ 镜像关联的 ISO 文件。回顾一下，以下命令将指定的 RHEL 9 ISO 文件挂载到 `/mnt` 目录：\n\n![Images](img/f0292-01.jpg)\n\
  \n## 更多文件系统挂载选项\n\n许多 `mount` 命令选项都适用于 `/etc/fstab` 文件。该文件中最常见的选项之一是 `defaults`。尽管它是大多数\
  \ `/etc/fstab` 文件系统的适当挂载选项，但还有其他选项，例如表 7-9 中列出的那些。如果你想使用多个选项，请用逗号分隔。不要在选项之间留空格。表\
  \ 7-9 中的列表并不完整。你可以通过 `man mount` 命令查看 mount 手页以获取更多信息。\n\n表 7-9 mount 命令和 /etc/fstab\
  \ 选项\n\n![Images](img/0292-02.jpg)\n\n## 虚拟文件系统\n\n本节描述了 RHEL 9 使用的列在 `/mtab` 中的虚拟文件系统。以下是最常见的：\n\
  \n![Images](img/square.jpg) `tmpfs` 该文件系统存储在内存中。重启后数据会被擦除。\n\n![Images](img/square.jpg)\
  \ `devpts` 该文件系统与伪终端设备有关。\n\n![Images](img/square.jpg) `sysfs` 该文件系统提供有关系统的动态信息。探索\
  \ `/sys` 目录，你会发现与本地设备和驱动程序相关的各种信息。\n\n![Images](img/square.jpg) `proc` 该文件系统特别有用，因为它提供了更改内核行为的可配置选项。\n\
  \n![Images](img/square.jpg) `cgroup2` 该文件系统与 Linux 内核的控制组功能相关，该功能允许你对进程或进程组设置系统资源限制。\n\
  \n## 将你自己的文件系统添加到 /etc/fstab\n\n如果你需要设置一个特殊目录，有时将其设置在单独卷上是有意义的。虽然遵循 `/etc/fstab`\
  \ 文件的标准格式是好的，但这属于额外工作。在 RHCSA 考试中，请仔细阅读指令以确定新目录是否需要作为挂载点。\n\n因此，在大多数情况下，在 `/etc/fstab`\
  \ 中设置关联的设备文件即可。\n\n## 可移动媒体与 /etc/fstab\n\n通常情况下，不应自动挂载可移动媒体。尽管在 `/etc/fstab` 中可以实现，但该过程是基于\
  \ `/usr/lib/udev/rules` 的。如果 RHEL 检测到硬件，点击 Activities | Files；在出现的菜单中选择移动媒体项。\n\n\
  如果由于某些原因不起作用，你可以直接使用 `mount` 命令。例如，以下命令挂载 CD/DVD：\n\n```\nmount -t iso9660 /dev/sr0\
  \ /mnt\n```\n\n`-t` 切换指定文件系统类型。设备文件 `/dev/sr0` 代表第一个 CD/DVD 驱动器；`/mnt` 是挂载后你可以访问\
  \ CD/DVD 文件的目录。\n\n\n\n正如所需的，USB 闪盘等可移动介质也有类似的选项，但在有多个 USB 闪盘时可能会出现问题；例如，一个 USB\
  \ 闪盘可能被识别为 `/dev/sdc`，之后安装了第二个 USB 闪盘后又会被识别为 `/dev/sdd`。然而，如果配置适当，每个 USB 闪盘都应该有一个唯一的\
  \ UUID。还有另一种选择：与其对可移动设备使用静态挂载，你可以依赖自动挂载器（automounter），我们将在本章稍后说明。\n\n## 网络文件系统\n\
  \n`/etc/fstab` 文件可用于自动挂载网络文件系统。感兴趣的两个主要共享服务是 NFS 和 Samba。本节仅对如何在 `/etc/fstab` 文件中配置此类文件系统提供简要概述；要对本节描述的配置进行练习，请参阅章节末尾的实验。\n\
  \n通常，网络共享面临的可靠性问题比直接连接的存储更多。`/etc/fstab` 文件中的设置应该考虑到这一点。因此，如果网络连接出现问题，或者例如远程 NFS\
  \ 服务器发生掉电等问题，你可以指定客户端的行为。\n\n到共享 NFS 目录的连接基于其主机名或 IP 地址，以及服务器上目录的完整路径。因此，要连接到系统\
  \ `server1` 上共享 `/pub` 目录的远程 NFS 服务器，你可以使用以下命令挂载该共享（假设 `/share` 目录存在）：\n\n![Images](img/f0295-01.jpg)\n\
  \n以下 `/etc/fstab` 条目中显示了一些常用的挂载选项：\n\n![Images](img/f0295-02.jpg)\n\n`rsize` 和 `wsize`\
  \ 变量决定了每个请求中读取和写入的数据的最大尺寸（单位为字节）。通常，不需要这些设置，因为客户端和服务器应该能够协商出它们都支持的最大值。`hard` 指令指定客户端将无限重试失败的\
  \ NFS 请求，这可能会阻塞客户端请求，直到 NFS 服务器可用。相反，`soft` 选项将导致客户端在预定义的重传次数后失败，但代价是面临数据完整性受损。如果连接到\
  \ NFS 4 版本的服务器，请将第三列中的 `nfs` 替换为 `nfs4`。\n\n你可以在 `/etc/nfs.conf` 中配置一些 NFS 客户端和服务器设置。该文件的节选见图\
  \ 7-10。例如，要仅启用 NFSv4 并禁用 v2 和 v3，请在 `/etc/nfs.conf` 中设置以下配置参数：\n\nFIGURE 7-10 示例\
  \ /etc/nfs.conf\n\n![Images](img/F07-10.jpg)\n\n![Images](img/f0295-03.jpg)\n\n\
  ### 认证目标 7.06\n\n## 自动挂载器\n\n对于网络挂载和便携介质，如果连接丢失或介质移除，可能会出现问题。在服务器配置过程中，你可能会挂载来自多个远程系统的文件系统。你可能还需要临时访问\
  \ USB 闪盘等可移动介质。自动挂载守护进程（也称为 `autofs`）可以提供帮助。它可以根据需要自动挂载特定的文件系统，并在固定一段时间后自动卸载文件系统。\n\
  \n### 通过自动挂载器挂载\n\n一旦使用 `mount` 命令或通过 `/etc/fstab` 手动挂载分区，它将保持挂载状态，直到你卸载它或关闭系统。挂载的持久性可能会导致问题。例如，如果你挂载了\
  \ USB 闪盘然后物理上拔除闪盘，Linux 可能还没有机会将文件写入磁盘。数据将会丢失。同样的问题适用于数字存储 (SD) 卡或其他热插拔可移动驱动器。\n\
  \n另一个问题是：如果远程主机故障或连接丢失，挂载的 NFS 文件系统可能会导致问题。当本地系统查找挂载的目录时，系统可能会变慢甚至挂起。\n\n这就是自动挂载器大显身手。它依赖\
  \ `autofs` 守护进程根据需要临时挂载配置好的目录。在 RHEL 中，相关的配置文件有 `auto.master`、`auto.misc`、`auto.net`\
  \ 和 `auto.smb`，都在 `/etc` 目录下。如果你使用自动挂载器，请保持 `/misc` 和 `/net` 目录为空。Red Hat 默认在这些目录配置自动挂载，如果那里存储了本地文件或目录，它们将无法工作。后续的小节将涵盖这些文件。\n\
  \n![Images](img/job.jpg)\n\n**除非你正确配置了 `/etc/auto.master` 且 `autofs` 守护进程正在运行，否则你甚至看不到\
  \ `/misc` 和/或 `/net` 目录。**\n\n### /etc/auto.master\n\n标准的 `/etc/auto.master` 文件包含系列指令，默认有四行未注释的行。第一行将\
  \ `/etc/auto.misc` 文件作为 `/misc` 目录的配置文件。`/net -hosts` 指令允许你根据 `/etc/auto.net` 中的指定指定主机来自动挂载网络目录。\n\
  \n![Images](img/f0296-01.jpg)\n\n在任何情况下，这些指令都指向每个服务的配置文件。来自每个服务的共享目录会根据需要自动挂载到指定的目录（`/misc`\
  \ 和 `/net`）上。\n\n你可以在其他目录上设置自动挂载器。一个流行的选项是在 `/home` 目录上设置自动挂载器。通过这种方式，你可以配置让远程服务器上的用户主目录按需挂载。\n\
  \n![Images](img/f0297-01.jpg)\n\n只有当本地系统不存在 `/home` 目录时，这种方法才有效。由于 RHCSA 考试要求配置多个普通用户，你的系统应该包含一个供普通用户使用的\
  \ `/home` 目录。在这种情况下，你可以替换不同的目录，生成如下所示的行：\n\n![Images](img/f0297-02.jpg)\n\n只需记住，对于任何通过网络访问的系统，你都需要确保防火墙允许与给定相关的流量。\n\
  \n### /etc/auto.misc\n\nRed Hat 方便地在 `/etc/auto.misc` 文件的注释中提供了标准的自动挂载指令。详细分析此文件很有帮助。我们使用该文件的默认\
  \ RHEL 版本。前四行是注释，我们跳过它们。第一条指令是\n\n![Images](img/f0297-03.jpg)\n\n在 RHEL 中，此指令默认激活，假设你已经激活了\
  \ `autofs` 服务。换句话说，如果你在 `/dev/cdrom` 驱动器有一张光盘，即使作为普通用户，也可以通过 `ls /misc/cd` 命令通过自动挂载器访问其文件。自动挂载器使用\
  \ ISO 9660 文件系统访问它。它是只读的 (`ro`)，不允许设置所有者 ID 权限 (`nosuid`)，并且不使用文件系统上的设备文件 (`nodev`)。\n\
  \n许多其他指令被注释掉了，可以备用。当然，在使用这些配置行之前，你必须删除注释字符 (#)，并需要相应地调整名称和设备文件；例如，`/dev/hda1` 在最新的\
  \ Linux 系统上不再用作设备名。\n\n正如其中一条注释所建议，“以下条目是激发你想象力的示例。”这些被注释的行中的第一条允许从来自 `ftp.example.org`\
  \ 主机的共享 NFS 目录 `/pub/linux` 设置一个 `/misc/linux` 挂载点：\n\n![Images](img/f0297-04.jpg)\n\
  \n下一行假设文件系统存储在 `/dev/hda1` 分区上。通过此指令，你可以自动挂载 `/misc/boot` 中的文件系统。\n\n![Images](img/f0297-05.jpg)\n\
