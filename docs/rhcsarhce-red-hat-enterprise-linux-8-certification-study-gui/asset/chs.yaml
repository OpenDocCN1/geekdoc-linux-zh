  \ 驱动器与 Linux 系统上的第二个磁盘。你的电脑可能有不同的驱动器名称；你可以检查 `df` 和 `fdisk -l` 命令的输出来寻找线索。\n\n图\
  \ 7-5 parted 命令选项\n\n![Images](img/F07-05.jpg)\n\n正如你在图 7-5 中看到的，当运行 `parted` 时，它会打开自己的命令行提示符。输入\
  \ `help` 可查看可用命令列表。\n\n`parted` 界面提供了多种命令。与 `fdisk` 和 `gdisk` 相比，`parted` 在某些方面可以做得更多，你将在接下来的章节中看到。\n\
  \n### 使用 parted：简述\n\n在 `parted` 命令行提示符处，从 `print` 命令开始以列出当前分区表。假设有足够的未分配空间，你就可以创建一个新的\
