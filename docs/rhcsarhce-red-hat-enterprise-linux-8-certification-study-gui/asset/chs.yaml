  \n每个目标可能与多个 systemd 单元关联。每个单元都可以启动或停止 Linux 服务，例如打印（`cupsd`）、调度（`crond`）、Apache\
  \ Web 服务器（`httpd`）、Samba 文件服务器（`smbd`）等。配置完成后，启动过程将启动并停止你选择的 systemd 单元。这些单元被称为依赖项。要列出默认\
  \ `graphical.target` 单元的所有依赖项，运行以下命令：\n\n![Images](img/f0192-03.jpg)\n\n默认目标指定为符号链接，从\
  \ `/etc/systemd/system/default.target` 文件指向 `multi-user.target` 或 `graphical.target`。你也可以使用\
  \ `systemctl` 命令获取当前默认目标或更改当前设置，如下：\n\n![Images](img/f0192-04.jpg)\n\n如你从输出中所示，`systemctl\
  \ set-default multi-user.target` 命令创建了一个名为 `/etc/systemd/system/default.target`\
  \ 的符号链接，它指向相应的 `multi-user.target` 配置文件。\n\n### 切换目标\n\n现在你已经检查了 RHEL 9 上可用的不同目标，是时候探索如何在目标之间切换了。在早期的\
