  \ 文件中配置的服务器保持时间同步。\n\n## Q 自测\n\n以下问题将帮助衡量你对本章介绍材料的理解程度。由于红帽考试中不出现单选题，因此书中也没有出现单选题。这些问题专门测试你对本章节的理解。如果你有其他执行任务的方法，也是没问题的。在红帽考试中，重要的是获得结果，而不是记背琐碎知识。许多此类问题可能有多个答案。\n\
