  \ 5 中常用。\n\n![Images](img/square.jpg) **编辑挂载选项** 配置文件系统的挂载选项，例如挂载点和文件系统类型。\n\n![Images](img/square.jpg)\
  \ **创建分区镜像** 创建包含驱动器或分区内容的镜像文件。\n\n![Images](img/square.jpg) **恢复分区镜像** 从分区镜像恢复驱动器的内容。\n\
  \n![Images](img/square.jpg) **分区基准测试** 允许对读写性能进行测量。\n\n![Images](img/square.jpg)\
