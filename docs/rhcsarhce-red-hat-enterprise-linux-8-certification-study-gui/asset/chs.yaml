  \ RHEL 9，请参阅第 1 章 的安装说明。实验答案位于自测之后。\n\n## 自测答案\n\n### 启动过程\n\n1. 为了 BIOS/UEFI 将控制权交给\
  \ Linux，它需要识别驱动器的主引导记录 (MBR) 或 GUID 分区表 (GPT)。\n\n### 引导加载程序和 GRUB 2\n\n2. 从 `GRUB\
  \ 2` 菜单，修改配置的命令是 `e`，代表“编辑”。\n\n3. 从 `linux` 命令行启动到紧急目标，你需要附加字符串 `systemd.unit=emergency.target`。\n\
  \n4. `set root=(hd0,msdos1)` 指示 `/boot` 目录在第一个硬盘的第一个分区上。\n\n### GRUB 2 与登录之间\n\n\
  5. 从 `GRUB 2` 菜单加载的临时文件系统是初始 RAM 磁盘文件系统，也以其文件名 `initramfs` 命名。\n\n6. 你可以使用 `journalctl`\
