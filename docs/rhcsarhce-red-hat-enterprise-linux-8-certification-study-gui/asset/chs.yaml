  \n#### Podman 命令\n\n在本节中，你将了解更多关于 Podman 命令。你已经使用过其中一些命令，并将学习一些新命令。Podman 命令就像工具箱里的工具，每个工具都承担着特殊的工作。它们帮助我们创建和管理容器或镜像，并让我们查看容器或镜像的细节。\n\
  \n为了让各种 Podman 命令更容易理解，我们可以将它们分为五大类：\n\n![Images](img/square.jpg) **容器管理命令** 这些命令就像控制器。它们帮助我们创建、启动、停止和删除容器。\n\
  \n![Images](img/square.jpg) **容器检查命令** 这些命令就像侦探。它们帮助我们发现容器正在发生什么、它的配置是什么，以及它一直在执行什么。\n\
  \n![Images](img/square.jpg) **镜像管理命令** 这些命令是我们镜像库的组织者。它们帮助我们制作、获取、命名和删除镜像。\n\n![Images](img/square.jpg)\
  \ **镜像检查命令** 这些命令也像侦探，但是针对镜像的。它们帮助我们发现有关镜像的所有细节。\n\n![Images](img/square.jpg) **杂项命令**\
  \ 这一组用于不属于其他组别的命令。它们执行各种不同的工作，如管理整个系统或设置网络。\n\n图 10-9 显示了每个类别中的命令。\n\nFIGURE 10-9\
  \ Podman 命令的分类\n\n![Images](img/F10-09.jpg)\n\n接下来，我们将进入每组命令并学习它们执行的特定工作。\n\n![Images](img/exam.jpg)\n\
  \n**请记住，这种分类是理解 Podman 命令的指南。然而，在 RHCSA 考试期间，你手头有一个方便的资源——Podman 帮助页。只需输入 `man podman`\
  \ 即可获取广泛的文档，或使用如 `man podman-run` 等命令获取特定命令的细节。它是你考试期间无价的辅助。**\n\n##### 容器管理命令\n\
  \n表 10-1 中列出的命令对于管理容器至关重要。\n\n表 10-1 容器管理命令\n\n![Images](img/f0424-01.jpg)\n\n我们已经介绍了\
  \ `podman run` 命令，但让我们更深入一点。该命令本质上是 `podman create` 和 `podman start` 的组合。根据你使用的标志，行为可能会有所不同。例如，使用\
  \ `-d`（分离模式）允许容器在后台运行，而 `-it` 则启用带有终端的交互模式。\n\n让我们考虑一些例子。如果你想在后台运行容器，可以使用：\n\n```\n\
  $ podman run -d registry.access.redhat.com/ubi9/httpd-24\n```\n\n对于交互式终端会话，你可能使用：\n\
  \n```\n$ podman run -it registry.access.redhat.com/ubi9 /bin/bash\n```\n\n后一个命令将在容器内启动一个\
  \ bash 壳，允许你直接与其交互。`podman run` 命令还提供了其他几个常用的选项。例如，你可以使用 `--name` 为容器指定特定名称。如果未使用\
  \ `--name` 为容器分配名称，Podman 将生成一个随机字符串作为名称。你还可以利用 `-p` 建立端口映射，正如“运行你的第一个容器”节所示。此外，在本章的末尾，我们将深入研究一个新的选项\
