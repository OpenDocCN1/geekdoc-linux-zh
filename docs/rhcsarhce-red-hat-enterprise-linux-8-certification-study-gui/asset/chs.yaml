  \n### 7.1 存储管理与分区\n\nRHCSA 目标包括以下相关要求：\n\n![Images](img/square.jpg) 在 MBR 和 GPT\
  \ 磁盘上列出、创建、删除分区\n\n![Images](img/square.jpg) 添加新分区和逻辑卷并非破坏性地交换系统\n\n## 逻辑卷\n\n逻辑卷管理器（LVM）提供了一种抽象层，通过名为\
  \ `volume groups`（卷组）的特殊实体对分区和磁盘进行分组和管理。在卷组之上，你可以创建逻辑卷，并像普通磁盘分区一样对其格式化。以下 RHCSA\
  \ 目标描述了所需的技能：\n\n![Images](img/square.jpg) 创建和删除物理卷\n\n![Images](img/square.jpg)\
  \ 将物理卷分配给卷组\n\n![Images](img/square.jpg) 创建和删除逻辑卷\n\n当然，除非能够增加逻辑卷的大小，否则它无法充分发挥潜力，正如以下目标建议所示：\n\
  \n![Images](img/square.jpg) 扩展现有逻辑卷\n\n## 文件系统管理\n\n分区和逻辑卷在准备好存储文件之前必须进行格式化。为此，你需要了解如何满足以下\
  \ RHCSA 目标：\n\n![Images](img/square.jpg) 创建、挂载、卸载和使用 vfat、ext4 和 xfs 文件系统\n\n![Images](img/square.jpg)\
  \ 配置系统通过唯一标识符（UUID）或标签在启动时挂载文件系统\n\n![Images](img/square.jpg) 使用 NFS 挂载和卸载网络文件系统\n\
  \n## 自动挂载器\n\n自动挂载服务（`autofs`）是一种在访问文件系统时自动挂载并在空闲一段时间后卸载的工具。此功能对于基于网络的文件系统、可拆卸存储介质以及不需要持续挂载的资产非常有价值。\n\
  \n相关的 RHCSA 目标是：\n\n![Images](img/square.jpg) 配置 autofs\n\n虽然在安装过程中创建分区和逻辑卷比较容易，但并不是每个管理员都有该权限。因此，你必须学习如何在已安装的系统上创建和管理分区。配置完成后，分区或逻辑卷可以通俗称为\
  \ `volume`（卷）。在 Linux 中，需要创建和管理分区的管理员仍在使用三种工具：`fdisk`、`gdisk` 和 `parted`。虽然这些工具主要应用于本地硬盘，但也可以用于通过网络连接的驱动器等介质。\n\
  \n### 当前系统状态\n\n在使用 `fdisk`、`gdisk` 或 `parted` 工具创建或修改分区之前，请检查当前可用的可用空间以及已挂载的文件系统。`df`\
  \ 和 `mount` 命令可以轻松实现这一点。图 7-1 中的示例说明了 `df` 命令如何显示所有当前挂载文件系统的总空间、已用空间和可用空间。\n\n7-1\
  \ df 命令显示的磁盘空间使用\n\n![Images](img/F07-01.jpg)\n\n![Images](img/job.jpg)\n\n***filesystem*\
  \ 和 *file system* 术语是互换的。两者都用于官方 Linux 文档。**\n\n注意“1K-blocks”列下的数字。在这种情况下（除临时文件系统\
  \ `tmpfs` 和 `devtmpfs` 之外），它们的总和约为 17GiB 的分配空间。如果硬盘更大，未分配的空间可能用于另一个分区。分区可以与其他分区结合以在卷组和逻辑卷中配置额外空间，这在你需要扩展适当文件系统（如\
  \ `/home`、`/tmp` 和 `/var`）的可用空间时非常有用。\n\n![Images](img/job.jpg)\n\n**由于 tmpfs 和\
  \ devtmpfs 是存储在 RAM 中的临时文件系统，其内容在系统重启后会被移除。**\n\n为了更易读的格式打印分区大小，可以使用 `-h` 命令选项，如图\
  \ 7-2 所示。`-H` 命令选项的输出类似于 `-h` 输出，但 `-H` 以国际单位（如 KB、MB 和 GB）打印卷大小，而 `-h` 以 KiB（千二进制字节）、MiB（兆二进制字节）和\
  \ GiB（吉二进制字节）打印大小。\n\n7-2 人类可读格式的 df 命令输出\n\n![Images](img/F07-02.jpg)\n\n这种表示差异在第\
