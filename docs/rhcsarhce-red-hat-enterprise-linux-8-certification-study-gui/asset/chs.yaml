  \ 命令查看结果。\n\n![Images](img/exam.jpg)\n\n在 RH 考试中，你可能需要计算分区结束的位置。如果对数学生疏，可以使用 `bc`\
  \ 计算器进行计算。\n\n### 认证目标 7.02：文件系统格式\n\n文件系统的类型可能超过操作系统的数量。虽然 RHEL 可以处理许多此类系统，但默认是\
  \ XFS。尽管许多用户启用其他文件系统（如 Btrfs），但 Red Hat 可能不支持它们。\n\nLinux 支持丰富的文件系统。除了某些旧文件系统外，大多数文件系统都包含了日志记录、大存储支持、延迟分配以及优化读写性能的复杂算法。在接下来的章节中，我们将文件系统分为两个大类：标准和日志记录。虽然这是一种简化，但对于分类\
  \ Linux 重要的文件系统已经足够。\n\n本书中描述的文件系统只是 RHEL 系统上可以配置的子集。Linux 内核使得配置更多可能。\n\n#### 标准文件系统\n\
  \nLinux 是 Unix 的克隆。Linux 文件系统的开发是为了模拟当时存在的 Unix 文件系统。早期 Linux 操作系统使用扩展文件系统 (ext)。在二十世纪，Red\
  \ Hat Linux 的默认文件系统是第二扩展文件系统 (ext2)。从 RHEL 5 开始，Red Hat 转向第三扩展文件系统 (ext3)。对于 RHEL\
  \ 6，Red Hat 进展到了第四扩展文件系统 (ext4)。ext3 和 ext4 都是日志文件系统。从 RHEL 7 开始，Red Hat 将默认文件系统改为\
  \ XFS，这是一种由 Silicon Graphics 在 1993 年最初开发的可扩展日志文件系统。\n\n\n\n日志型文件系统有两个主要优势。首先，文件系统检查非常快。其次，如果发生崩溃，日志型文件系统有一个日志（也称为期刊），用于恢复相关分区上文件的元数据。\n\
  \n对于 RHEL 9，默认文件系统是 `XFS`，这是一种高度可扩展的、基于日志的文件系统。然而，这并不是唯一的可选日志型文件系统。表 7-3 列出了 RHEL\
  \ 中常用的几种备选项。从该列表中，红帽官方仅支持 `ext3`、`ext4` 和 `XFS`。在编写本文内容时，`Btrfs` 已不再受红帽的支持。\n\n\
  ### 表格 7-3 某些日志型文件系统\n\n![Images](img/f0276-01.jpg)\n\n红帽转向 `XFS` 证明了其作为服务器操作系统的地位。例如，格式化为\
  \ `XFS` 的卷在理论上可以达到 8 艾字节 (EB)。这与 `ext3` 分区的最大大小 16 太字节 (TB) 相比，是一个巨大的增长。\n\n`XFS`\
  \ 支持大量的并发操作，保证文件空间，保证更快的检查，以及更多功能。由于 `XFS` 自 2004 年以来一直是 Linux 内核的一部分，因此它是经过验证的技术。\n\
  \n#### 文件系统格式化命令\n\n有几个命令可以帮助您创建 Linux 文件系统。它们都基于 `mkfs` 命令，该命令作为 `mkfs.ext3`、`mkfs.ext4`\
  \ 和 `mkfs.xfs` 等特定文件系统命令的前端。\n\n如果您想重新格式化现有分区或逻辑卷，请采取以下预防措施：\n\n![Images](img/square.jpg)\
  \ 备份分区上的任何现有数据。\n\n![Images](img/square.jpg) 卸载分区。\n\n格式化卷有两种方法。（如在本章较早些部分所述，*卷*\
  \ 是一个可以描述分区或逻辑卷的通用名称。）例如，如果您刚刚在 `/dev/sdb5` 上创建了一个分区，可以使用以下命令之一将其格式化为 `XFS` 文件系统：\n\
  \n![Images](img/f0277-01.jpg)\n\n您可以将分区、逻辑卷和 RAID 数组格式化为其他文件系统。RHEL 9 中提供的某些选项包括：\n\
  \n![Images](img/square.jpg) `mkfs.ext2` 将卷格式化为 `ext2` 文件系统。\n\n![Images](img/square.jpg)\
  \ `mkfs.ext3` 将卷格式化为 RHEL 5 默认的 `ext3` 文件系统。\n\n![Images](img/square.jpg) `mkfs.ext4`\
  \ 将卷格式化为 RHEL 6 默认的 `ext4` 文件系统。\n\n![Images](img/square.jpg) `mkfs.fat`（或 `mkfs.vfat`、`mkfs.msdos`、`mkdosfs`）将分区格式化为兼容\
  \ Microsoft 的 文件 系统；它不会创建可引导的文件系统。（这些命令都是相同的，因为它们是 `mkfs.fat` 的符号链接。）\n\n![Images](img/square.jpg)\
  \ `mkfs.xfs` 将卷格式化为 RHEL 9 默认的 `XFS` 文件系统。\n\n![Images](img/square.jpg) `mkswap`\
  \ 设置 Linux 交换区域。这些这些命令假设您预先配置了适当的分区；例如，在将 `mkswap` 命令正确应用于分区之前，必须为该分区配置 Linux 交换分区\
  \ ID 类型。如果您按照本章后面的描述创建了逻辑卷，也适用类似的规则。\n\n#### 交换卷\n\n虽然 Linux 可以使用交换文件，但交换空间通常配置在格式化良好的分区或逻辑卷中。要查看当前配置的交换空间，请运行\
  \ `cat /proc/swaps` 命令。\n\n上一节建议，交换卷使用 `mkswap` 命令进行格式化。但还不够。交换卷必须使用 `swapon` 命令激活。如果新的交换卷被识别，您将在\
  \ `/proc/swaps` 文件和 `top` 命令的输出中同时看到它。其次，您需要按照本章稍后描述的方法在 `/etc/fstab` 文件中配置新的交换卷。\n\
  \n#### 文件系统检查命令\n\n`xfs_repair` 命令（其他文件系统使用 `fsck`）分析指定的 XFS 文件系统并根据需要执行修复。例如，假设您在\
  \ `/var` 目录中的文件出现问题，该目录恰好挂载在 `/dev/sda7` 上。如果您想运行 `xfs_repair`，请先卸载该文件系统。在某些情况下，您可能需要进入救援模式才能卸载文件系统。要卸载、分析并重新挂载本节所述的文件系统，请运行以下命令：\n\
  \n![Images](img/f0278-01.jpg)\n\n`fsck` 命令作为一个“前端”，取决于文件系统的格式。例如，如果您正在格式化 ext2、`ext3`\
  \ 或 `ext4` 文件系统，`fsck` 本身会自动调用 `e2fsck` 命令。事实上，`fsck.ext2`、`fsck.ext3`、`fsck.ext4`\
  \ 和 `e2fsck` 文件都是同一个命令的不同名称！它们具有相同的 inode 号。您可以通过应用 `ls -i` 命令确认这一点。\n\n#### 练习\
  \ 7-2：格式化、检查和挂载不同的文件系统\n\n在此练习中，您将使用格式化和检查命令 `mkfs` 和 `fsck`。此练习假设您已完成练习 7-1。\n\n\
  1. 使用 `parted /dev/nvme0n1 print` 命令查看驱动器的当前状态。（同样，如果您的驱动器名称不同，请替换为正确的名称）。\n2. 使用\
  \ `mkfs.ext2 /dev/nvme0n1p1` 命令格式化由第一个驱动器创建的分区。使用 `dumpe2fs -h /dev/nvme0n1p1 |\
  \ grep features` 命令查看 /dev/nvme0n1p1 的当前状态。您看到了哪些特性？\n3. 使用 `mount /dev/nvme0n1p1\
  \ /mnt` 命令挂载新格式化的分区。通过单独运行 `mount` 命令查看输出。如果挂载和格式化成功，您将看到以下输出：\n```\n/dev/nvme0n1p1\
  \ on /mnt type ext2 (rw,relatime,selabel)\n```\n4. 使用 `umount /mnt` 命令卸载分区。\n5.\
  \ 运行 `mkfs.ext4 /dev/nvme0n1p1` 命令。您将收到 /dev/nvme0n1p1 上已文件系统的警告。输入 **y** 格式化分区并重新运行上一步的\
  \ `dumpe2fs` 命令。现在的输出与格式化为 ext2 文件系统输出有什么区别？\n6. 现在在 7-1 创建的另一个分区上，应用 `mkfs.xfs\
  \ /dev/nvme0n1p2` 命令。运行 `xfs_info /dev/nvme0n1p2` 命令。显示了哪些信息？执行 `man xfs_info` 获取该命令的描述。\n\
  7. 将新格式化的分区挂载到 `/mnt` 目录，然后单独运行 `mount` 命令。`mount /dev/nvme0n1p2 /mnt`。您能通过 `mount`\
  \ 命令的输出确认 /dev/nvme0n1p2 分区的文件系统类型吗？\n\n### 认证目标 7.03\n\n### 基本 Linux 文件系统和目录\n\n\
  Linux 中的一切都是文件。分区与*文件系统设备节点*（如 `/dev/sda1`）关联。硬件组件与节点 dev/dev/` 文件关联。检测到的设备作为文件记录在\
  \ `/sys` 目录。文件系统层次结构 (FHS) 是组织 Unix 和 Linux 目录文件的官方方法。与其他章节一样，本介绍仅提供了 FHS 最基本的概述。更多信息可以从\
  \ FHS 官方首页获取：[`refspecs.linuxfoundation.org/fhs.shtml`](http://refspecs.linuxfoundation.org/fhs.shtml)。\n\
  \n![Images](img/job.jpg)\n\n\n\n\n在 Linux 中，`filesystem`（文件系统）一词具有不同的含义。它可以指 FHS（文件层次结构），也可以指如\
  \ `ext3` 这样的文件系统格式。文件系统挂载点（如 `/var`）代表挂载文件系统的目录。\n\n## 独立的 Linux 文件系统\n\n所有现代 Unix/Linux\
  \ 都关联几个主要的目录。文件、驱动程序、内核、日志、程序、实用程序等组织在这些目录中。这些组件在存储媒体上的组织方式被称为文件系统。FHS 使得 Linux\
  \ 发行版更容易遵循通目录结构。\n\n每个文件系统都从顶层根目录开始，该目录也称为其符号——单正斜杠（`/`）。在表 7-4 中显示的所有其他目录都是根目录的子目录。除非它们被单独挂载，否则你也可以在根目录所在的分区上找到它们的文件。如果没有安装相关的软件包，你可能看不到表中显示的某些目录。表中显示的所有目录并非\
  \ FHS 的官方组成。更重要的是，并不是所有列出的目录都可以或应该单独挂载。\n\n表 7-4 基础文件系统层次结构标准目录\n\n![Images](img/f0280-01.jpg)\n\
  \n![Images](img/f0281-01.jpg)\n\n挂载文件系统的目录被称为 `mount point`（挂载点）。虽然根目录（`/`）是 FHS\
  \ 中的顶层目录，但 root 用户的家目录（`/root`）只是一个子目录。\n\n## 可以单独挂载的目录\n\n如果有可用空间，表 7-4 中列出的几个目录是单独挂载的极佳候选。正如第\
  \ 1 章所示，将 `/`、`/boot`、`/home`、`/opt`、`/tmp` 和 `/var` 等目录挂载到单独卷是常见做法。有时，将较低的子目录挂载到单独卷是有意义的，例如用于\
  \ FTP 服务器的 `/var/ftp` 或用于 Web 服务器的 `/var/www`。\n\n但首先，几个目录应该始终作为顶层根目录文件系统的一部分进行维护。这些目录包括\
  \ `/dev`、`/etc` 和 `/bin`。这些目录中的文件对于 Linux 作为操作系统的平滑运行至关重要。虽然对 `/boot` 目录也有类似的理由，但它是一个特殊情况。在此目录中存储\
  \ Linux 内核、初始 RAM 磁盘和引导加载程序文件，可以在出现其他问题时帮助保护操作系统的核心。\n\n`/proc` 和 `/sys` 目录中的文件仅在系统启动过程中填充，并在系统关机时消失，因此它们被存储在特殊的内存中虚拟文件系统中。\n\
  \n在表 7-4 中列出的某些目录被设计为仅作为挂载点使用。换句话说，它们通常应该是空的。如果你在这些目录上存储文件，那么当（例如网络共享挂载到它们上时，这些文件将无法访问。典型的网络挂载点包括\
  \ `/media`、`/mnt`、`/net` 和 `/smb` 目录。\n\n## 认证目标 7.04\n\n## 逻辑卷管理器 (LVM)\n\n逻辑卷管理器（也称为\
  \ LVM）在物理设备（如磁盘和分区）与格式化为文件系统的卷之间创建了一个抽象层。\n\nLVM 可以简化磁盘管理。例如，假设 `/home` 文件系统配置在自己的逻辑卷上。如果与\
  \ `/home` 关联的卷组可用空间，你可以轻松地调整文件系统的大小。如果没有可用空间，可以通过添加新的物理磁盘并将其存储容量分配给卷组来留出空间。在 LVM\
  \ 上，卷组类似于存储池，它们聚合了多个存储设备的容量。逻辑卷存在于卷组上，并可以跨越多个物理磁盘。\n\n### LVM 中的定义\n\n要使用 LVM，你需要理解为该目的配置的分区是如何被使用的。首先，通过\
  \ `fdisk`、`gdisk` 和 `parted` 实用程序，你需要创建配置为 LVM 分区类型的分区。你也可以使用整个磁盘设备。\n\n一旦这些分区或磁盘设备可用，它们需要被设置为物理卷\
  \ (PVs)。该过程会初始化一个磁盘或分区供 LVM 使用。然后，你从一个或多个物理卷创建卷组 (VGs)。卷组将物理存储组织成一组可管理的磁盘块，称为物理区\
  \ (PEs)。通过正确的命令，你可以将这些 PE 组织成逻辑卷 (LVs)。逻辑卷由逻辑区 (LEs) 组成，这些 LE 映射到底层的 PE。然后你可以对 LV\
  \ 进行格式化和挂载。对于 LVM 的初学者来说，拆解每个定义可能非常重要：\n\n![Images](img/square.jpg) **物理卷 (PV)**：PV\
  \ 是初始化为供 LVM 使用的分区或磁盘驱动器。\n\n![Images](img/square.jpg) **物理区 (PE)**：PE 是磁盘空间的一个小均匀段。PV\
  \ 被划分为 PEs。\n\n![Images](img/square.jpg) **卷组 (VG)**：VG 是一个存储池，由一个或多个 PVs 组成。\n\n\
  ![Images](img/square.jpg) **逻辑区 (LE)**：每个 PE 都与一个 LE 关联，这些 PE 可以组合成逻辑卷。\n\n![Images](img/square.jpg)\
  \ **逻辑卷 (LV)**：LV 是 VG 的一部分，由 LEs 组成。LV 可以被格式化为文件系统，然后挂载到你选择的目录上。\n\n你将在后续章节看到这一过程的拆解。\n\
  \n\n\n但如果你不知道每个 PE 关联了多少空间，那么这些就没有用了。你可以使用 `vgdisplay` 命令来显示 PE 的大小，或者在初始化 VG 时通过\
  \ `vgcreate` 命令的 `-s` 选项指定大小。或者，你也可以使用 `-L` 切换以 MiB、GiB 或其他单位设置大小。例如，以下命令创建一个名为\
  \ `flex`、大小为 200MiB 的逻辑卷（LV）：\n\n```bash\n# lvcreate -L 200M volumegroup -n flex\n\
  ```\n\n但这并不是最后一步，正如后文所述。\n\n### 利用逻辑卷\n\n除非逻辑卷在系统重启时经过了格式化并挂载，否则你可能无法获得全分。这一过程将在本章稍后关于\
  \ `/etc/fstab` 配置文件的讨论中进行描述。\n\n### 更多 LVM 命令\n\n可以使用许多与 PV、LV 和 VG 相关的 LVM 命令。通常，它们位于\
  \ `/usr/sbin` 目录下，以 `pv*`、`lv*` 和 `vg*` 开头。物理卷命令包括表 7-5 列出的命令。\n\n**表 7-5 物理卷管理命令**\n\
  \n![Images](img/f0284-02.jpg)\n\n当你将 PV 分配给 VG 时，可能需要一些控制和配置 VG 的命令。表 7-6 包含了大多数相关卷组命令的概述。\n\
  \n**表 7-6 卷组命令**\n\n![Images](img/f0285-01.jpg)\n\n当你将 PV 分配给 VG 然后将 VG 细分为 LV 时，你可能需要控制和配置\
  \ LV 的命令。表 7-7 包含了相关 LVM 命令的概述。\n\n**表 7-7 逻辑卷命令**\n\n![Images](img/f0286-01.jpg)\n\
  \n尝试使用 `vgscan` 命令。你可以通过 `vgdisplay` 命令验证已配置的 VG。例如图 7-7 展示了 VG `rhel` 的配置。\n\n\
  **图 7-7 卷组配置**\n\n![Images](img/F07-07.jpg)\n\n虽然安装了许多 `lvm*` 命令，但只有四个是激活的：`lvm`、`lvmconfig`、`lvmdiskscan`\
  \ 和 `lvmdump`。其他的 `lvm*` 命令已经过时。`lvm` 命令会进入 `lvm>` 提示符。这很有趣，因为该提示符下的 `help` 命令提供了近乎完整的可用\
  \ LVM 命令列表。\n\n`lvmconfig` 命令可以修改相关配置文件 `/etc/lvm/lvm.conf` 中的默认设置。`lvmdiskscan`\
  \ 命令扫描所有可用驱动器以查找配置了 LVM 的物理卷。最后，`lvmdump` 命令创建一个诊断信息的配置报告。\n\n### 移除逻辑卷\n\n使用 `lvremove`\
  \ 命令移除现有的 LV 是非常的。这假设任何之前挂载在 LV 上的目录都已卸载。此时，基本步骤非常简单：\n\n1. 保存挂载在 LV 上的目录中的任何数据。\n\
  2. 卸载与 LV 关联的文件系统。例如，你可以使用类似下面的命令：\n   ```bash\n   # umount /dev/vg_01/lv_01\n \
  \  ```\n3. 使用类似下面的命令对 LV 执行 `lvremove` 命令：\n   ```bash\n   # lvremove /dev/vg_01/lv_01\n\
  \   ```\n4. 现在，你应该已经释放了该 LV 的 LE 供其他 LV 使用。\n\n### 调整逻辑卷大小\n\n如果你需要增加现有 LV 的大小，可以从新创建的\
  \ PV 中添加空间。这只需要恰当使用 `vgextend` 和 `lvextend` 命令。例如，要为挂载在 LV 上的 `/home` 目录所在的 VG 添加\
  \ PE，请采取以下基本步骤：\n\n1. 备份 `/home` 目录中存在的任何数据。（这是一个标准的预防措施，如果一切顺利，则没有必要。在 Red Hat\
  \ 考试中你甚至可以跳过这一步。但在实践中，你真的想冒用户数据的风险吗？）\n2. 扩展 VG 以包含配置为相应类型的新分区。例如，将 `/dev/sdd1`\
  \ 添加到 `vg_00` VG，运行以下命令：\n   ```bash\n   # vgextend vg_00 /dev/sdd1\n   ```\n3.\
  \ 使用以下命令确保新分区已包含在 VG 中：\n   ```bash\n   # vgdisplay vg_00\n   ```\n4. 现在你可以扩展给予当前\
  \ LV 的空间。例如，要将 LV 扩展到 2000MiB，运行以下命令：\n   ```bash\n   # lvextend -L 2000M /dev/vg_00/lv_00\n\
  \   ```\n5. `lvextend` 命令可以用 KiB、MiB、GiB 甚至 TiB 增加分配给 LV 的空间。例如，你可以可以通过命令指定一个 2GiB\
  \ 的 LV：\n   ```bash\n   # lvextend -L 2G /dev/vg_00/lv_00\n   ```\n6. 如果你于指定额外空间而不是总大小，使用以下语法：\n\
  \   ```bash\n   # lvextend -L +1G /dev/vg_00/lv_00\n   ```\n7. 使用 `xfs_growfs`（对于\
  \ ext2/3 使用 `resize2fs`）调整文件系统大小。例如：\n   ```bash\n   # xfs_growfs /dev/vg_00/lv_00\n\
  \   ```\n8. 最后，使用 `df` 命令验证新大小：\n   ```bash\n   # df -h\n   ```\n\n### 认证目标 7.05:\
