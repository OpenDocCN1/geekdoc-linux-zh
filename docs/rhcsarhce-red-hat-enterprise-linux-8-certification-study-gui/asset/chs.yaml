  \n### 认证目标 4.03\n\n### 依赖关系与 dnf 命令\n\n`dnf` 命令可以轻松地向系统添加和移除软件包。它维护了一个关于添加、升级和移除软件包的正确方法的数据库。这使得通过单一命令添加和移除软件变得相对简单。这个单一命令克服了所谓的“依赖地狱”。\n\
  \n`dnf` 命令扩展了 `yum` 的功能，`yum` 最初是为已停止维护的旧 Linux 发行版 Yellow Dog Linux 开发的。该命令名称基于\
  \ Yellowdog Updater。\n\n#### 依赖地狱示例\n\n`rpm --verify` 命令用于检查文件的完整性。然而，在安装软件包时，依赖关系可能会变得复杂。要了解更多关于\
  \ `dnf` 的需求，请查看图 4-3。\n\n图 4-3 `rpm --verify` 代码\n\n![Images](img/f0139-01)\n\n\
  要这样做，请执行以下步骤：\n\n1. 包含 RHEL 9 ISO。\n2. 除非已挂载，否则使用以下命令挂载 DVD：\n\n```bash\n# mount\
  \ /dev/cdrom /media\n```\n\n3. 导航到 DVD 挂载的目录（即 `/media` 或其子目录）。\n4. RHEL 9 的 RPM\
  \ 软件包位于 `BaseOS/Packages/` 和 `AppStream/Packages/` 子目录。导航到 `AppStream/Packages/`。\n\
  5. 输入 `rpm -ivh` 命令，然后输入图 4-3 中列出的软件包名称。使用命令补全可能会更容易；例如，如果你输入\n\n```bash\n# rpm\
  \ -ivh glibc-devel-\n```\n\n你可以按两次 Tab 查看所有以 `glibc-devel-` 开头的软件包。你可以输入额外的字母并再次按\
  \ Tab 完成包名。\n6. 经过一番努力，你会得到与图 4-4 所示类似的命令和结果。\n\n图 4-4 这些软件包有依赖关系。\n\n![Images](img/F04-04.jpg)\n\
  \n7. 下一步尝试将缺失的依赖项包含在安装列表中。当我们尝试这一步时，会导致图 4-5 所示的命令和结果。\n\n图 4-5 有更多依赖关系。\n\n![Images](img/F04-05.jpg)\n\
  \n在此处，我们没有更多需要安装的依赖项，但对于某些 RPM 软件包，可能存在更多层次的待依赖包。这种痛苦被称为依赖地狱。\n\n#### 摆脱依赖地狱\n\n\
  在 `yum` 和 `dnf` 之前，某些使用 `rpm` 命令的尝试会被前面描述的依赖关系阻止。当然，你可以通过同一命令安装这些依赖包，但如果这些依赖项本身也有依赖项呢？这也许是\
  \ `yum` 和 `dnf` 命令最大的优势。\n\n\n\n\n\n在 `yum` 出现之前，RHEL 将依赖解析集成到更新过程中。从 RHEL 4 开始，这是通过\
  \ `up2date`实现的。Red Hat 从 RHEL 5 开始引入了 `yum`。从 RHEL 8 开始，`yum` 是 `dnf` 的符号链接，`dnf`\
  \ 是下一代软件包管理器，支持所有的 `yum` 命令选项以及更多。\n\n要安装图 4-4 中列出的软件包，你只需要运行以下命令：\n\n```bash\n\
  # dnf install gcc\n```\n\n如果系统提示，请接受安装额外依赖包的请求，然后所有提到的依赖项将自动安装。（使用 `-y` 选项可以执行相同的功能。）如果连接的存储库中有可用更新，将安装每个软件包的最新可用版本。`dnf`\
  \ 命令将在本章稍后的部分进行详细描述。\n\n但如果你运行 RHEL 9 且没有连接到 Red Hat 订阅（Red Hat Subscription Management），则什么都不会发生。稍后，你将看到如何进行操作。\n\
  \nRHEL 有许多第三方仓库可用。它们包含了若干个 Red Hat 不支持的流行应用程序。例如，本书的作者之一使用外部仓库来安装与他的笔记本电脑无线网卡相关的软件包。\n\
  \n尽管这些仓库的所有者与某些 Red Hat 开发人员密切合作，但仍有报告显示，一个仓库所需的依赖项在其他仓库中无法可用，导致了另一种形式的“依赖地狱”。然而，更流行的第三方仓库是非常优秀的；在我们在使用这些仓库时，我们从未遇到过依赖地狱。\n\
  \n![Images](img/job.jpg)\n\n**Red Hat 不包含第三方仓库中大多数经过验证且流行的软件包主要有两个原因。某些软件包未以开源许可发布，另一些是\
  \ Red Hat 简单选择不支持的软件包。**\n\n## Red Hat 订阅（Red Hat Subscription Management）\n\n摆脱依赖地狱取决于\
  \ `dnf` 的正确配置。你不仅需要知道如何配置 `dnf` 连接到互联网存储库，还需要知道如何配置 `dnf` 连接到本地网络存储库。\n\nRHCSA 考试目标要求候选人能够“从\
  \ Red Hat 网络安装和更新软件包”。如前所述，虽然 Red Hat 网络已被 Red Hat 订阅取代，但考试目标继续使用其遗留名称指代该服务。访问 Red\
  \ Hat 订阅可以通过互联网或本地的 Red Hat Satellite 服务器提供。\n\n或许 Red Hat Satellite（或替代方案如 Spacewalk\
  \ 或 Katello）的关键优势在于能够在网络上的本地系统上存储软件包。一旦从客户端系统配置了适当的连接，Satellite 服务器甚至可以按照任何计划运行远程命令。如果你正在管理大量的系统，Red\
  \ Hat Satellite 支持对系统组进行配置。例如，如果有 10 台系统配置为基于 RHEL 9 的 Web 服务器，你可以将这些系统配置为一个组。然后，你可以调度一个命令，并将其远程应用于所有这些系统。有关\
  \ Red Hat Satellite 的更多信息，请参阅最新版本的文档，该文档可在 [`access.redhat.com/products/`](https://access.redhat.com/products/)\
  \ 获取。然而，这在 RHCSA 考试的范围之外。\n\n如果你参加了 Red Hat 开发者计划（如第 1 章所解释的），你有权使用 Red Hat 开发者订阅。练习\
  \ 4-2 解释了如何将你的系统订阅到 RHSM。\n\n### 练习 4-2\n\n### 将系统订阅到 Red Hat 订阅\n\n1. 如果你还没有这样做，请加入\
  \ Red Hat 开发者计划并在 [`developers.redhat.com`](https://developers.redhat.com) 注册。如果你没有账户，请创建一个新的。\n\
  2. 将浏览器指向 [`access.redhat.com/management/subscriptions/`](https://access.redhat.com/management/subscriptions/)。你应该会在清单列表中看到一个“个人开发者订阅”（Red\
  \ Hat Developer Subscription for Individuals）。此订阅允许你注册 RHEL 系统从 RHSM 下载更新。\n3. 登录你在第\
  \ 1 章中安装的 `server1.example.com` 系统。运行以下命令将系统注册到 RHSM。系统将提示输入你的 Red Hat 账户用户名和密码。如果系统已注册，使用\
  \ `--force` 命令选项重新注册机器。\n\n```bash\n# subscription-manager register\n```\n\n4. 将系统订阅到\
  \ Red Hat 产品。在以下命令中，`--auto` 选项寻找最合适的订阅（如果你没有其他订阅，将是 Red Hat 开发者订阅）：\n\n```bash\n\
  # subscription-manager attach --auto\n```\n\n5. 或者，列出所有可用的订阅。注意池 ID。\n\n```bash\n\
  # subscription-manager list --available\n```\n\n然后，使用从上一个命令获取的池 ID 将系统附加到订阅上：\n\n\
  ![Images](img/f0145-04.jpg)\n\n6. 检查当前设置。运行以下命令列出附加到系统的订阅：\n\n![Images](img/f0146-01.jpg)\n\
  \n命令输出应与此处所示：\n\n![Images](img/f0146-02.jpg)\n\n7. 显示系统可用的所有存储库：\n\n![Images](img/f0146-03.jpg)\n\
  \n8. 显示当前启用的仓库：\n\n```bash\n# subscription-manager repos --list-enabled\n```\n\n\
  命令输出应与下所示：\n\n![Images](img/f0146-04.jpg)\n\n9. 你可以使用以下命令启用额外的仓库：\n\n![Images](img/f0146-05.jpg)\n\
  \n10. 使用以下 `dnf` 命令确认系统已订阅到 BaseOS 和 AppStream 存储库：\n\n![Images](img/f0147-01.jpg)\n\
  \n命令输出应与下所示：\n\n![Images](img/f0147-02.jpg)\n\n11. 系统现在已准备好安装新软件包。尝试运行以下命令安装一个软件包：\n\
  \n![Images](img/f0147-03.jpg)\n\n结果应与下方所示。如你所见，在这个示例中，`dnf` 命令不仅下载并安装了 wireshark\
  \ RPM，还安装了依赖包以确保满足所有依赖。\n\n![Images](img/f0147-04.jpg)\n\n#### 基础 dnf 配置\n\n既然你已经订阅了\
  \ RHSM 上的存储库，你需要详细了解 `dnf` 是如何配置的。它从 `/etc/dnf/dnf.conf` 开始，并于 `/etc/dnf` 和 `/etc/yum.repos.d`\
  \ 目录下的文件。你可以看到，尽管 `dnf` 是当前的工具，目录名称仍包含 `yum`。获取 `dnf` 配置指令的完整列表及其当前值，运行以下命令：\n\n\
  ![Images](img/f0148-01.jpg)\n\n##### 基础 dnf 配置文件：dnf.conf\n\n本节逐行分析 `/etc/dnf/dnf.conf`\
  \ 文件的默认版本。虽然在大多数情况下你不会修改此文件，但如果出现问题，你至少需要理解文件中的标准指令。以下是该文件默认版本的直接摘录。第一个指令是标题；`[main]`\
  \ 标题表示后续所有指令全局适用于 `dnf`：\n\n```ini\n[main]\n```\n\n`gpgcheck` 布尔指令确保 `dnf` 命令实际检查下载软件包的\
  \ GPG 签名：\n\n```ini\ngpgcheck=1\n```\n\n`installonly_limit` 指令指定了 `installonlypkgs`\
  \ 选项列出的软件包（通常是内核）同时安装的数量：\n\n```ini\ninstallonly_limit=3\n```\n\n\n\n\n\n`clean_requirements_on_remove`\
  \ 布尔值指令指示 `dnf` 在删除软件包时检查每个包的依赖关系。如果此配置选项设置为 True，则任何其他包不再所需的依赖项也将被删除。\n\n`clean_requirements_on_remove=True`\n\
  \n如果启用，`best` 指令告诉 `dnf` 在升级期间始终尝试安装软件包的可用最高版本：\n\n`best=True`\n\n### `/etc/dnf/plugins`\
  \ 目录下的配置文件\n\n`/etc/dnf/plugins` 目录中的默认文件配置了 `dnf` 与红帽门户网站（Red Hat Portal）或本地 Satellite\
  \ 服务器之间的连接。如果你正在通过 AlmaLinux 等 RHEL 重新构建发行版进行学习，你会在该目录下看到一组不同的文件。然而，由于这是一本关于红帽的书中，因此重点将放在\
  \ RHEL 9 安装中的两个基础文件上。\n\n**Spacewalk 插件** 如果你通过旧版本的 Red Hat Satellite Server 订阅了\
  \ RHSM，那么该目录下的 `spacewalkplugin.conf` 文件尤为重要。下文所示的指令用于启用该插件并检查 RPM 包的 GPG 签名：\n\n\
  ![Images](img/f0149-01.jpg)\n\n**红帽订阅管理插件** `subscription-manager.conf` 和 `product-id.conf`\
  \ 文件设计用于通过订阅管理将 `dnf` 系统连接到红帽门户网站。如本章所述，订阅管理用于将系统订阅到 RHSM 以进行系统更新。`subscription-manager.conf`\
  \ 文件非常直观。第一条指令启用插件。最后一条指令如果设置为 1，则会禁用所有未受订阅管理的仓库。当系统运行 Fedora 且你不想使用默认系统仓库（因为系统由\
  \ Red Hat Satellite 或 Katello 运行）时，此功能非常有用。\n\n![Images](img/f0149-02.jpg)\n\n###\
  \ `/etc/yum.repos.d` 目录下的配置文件\n\n`/etc/yum.repos.d` 目录中的配置文件设计用于将系统连接到实际 `dnf` 仓库。如果你正在运行\
  \ AlmaLinux 等重新构建发行版，你会在该目录下看到 `.repo` 扩展的文件，这些文件配置了对互联网上公共仓库的访问。如果你正在运行 RHEL 9\
  \ 并通过红帽订阅管理注册了系统，你将看到一个 `redhat.repo` 文件，它列出了红帽门户网站上系统可用的所有仓库。\n\n`/etc/yum.repos.d`\
  \ 目录配置文件的共同元素包括文件扩展名（`.repo`）以及可以通过 `man dnf.conf` 命令查看文档。\n\n在 `/etc/yum.repos.d`\
  \ 目录中配置恰当的 `.repo` 文件可以为使用 `dnf` 命令安装软件包组提供极大便利。由于在新的 RHEL 9 系统上 `/etc/yum.repos.d`\
  \ 目录可能是空的，你应该知道如何使用安装服务器的数据和 `dnf.conf` 手帮助页中的可用信息从头创建该文件。\n\n**理解默认的 redhat.repo\
  \ 配置文件** 如果你已将系统订阅到红帽订阅管理，你应该应该在 `/etc/yum.repos.d` 目录中看到 `redhat.repo` 文件，其内容类似于图\
  \ 4-6 所示所示。尽管它包含了许多不同的仓库，但你可以从每个仓库配置的指令模式中进行学习。\n\n图 4-6 在文件中配置的多个仓库\n\n![Images](img/F04-06.jpg)\n\
  \n`redhat.repo` 文件中有多个段（stanzas），每个段对应一个红帽仓库。例如，图 4-6 所示的第一个段定义了 BaseOS 仓库的配置设置。括号中的第一行为提供了仓库名称。在这种情况下，`[rhel-9-for-x86_64-baseos-rpms]`\
  \ 仅代表 RHEL 9 使用的基础仓库名称。它并不代表相关软件包安装的目录。\n\n虽然后面跟着仓库的名称，但它仅用于文档目的，不会影响软件包或包数据库的读取或下载。事实上，包含\
