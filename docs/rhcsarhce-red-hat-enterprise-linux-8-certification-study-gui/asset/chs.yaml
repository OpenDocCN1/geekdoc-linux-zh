  \n## 使用 at 系统运行作业\n\n与 `cron` 类似，`at` 守护进程支持作业处理。然而，你可以设置 `at` 作业运行一次。`cron` 系统中的作业必须设置为定期运行。`at`\
  \ 守护进程的工作方式与打印进程类似；作业被堆叠在 `/var/spool/at` 目录中，并在指定时间运行。\n\n你可以使用 `at` 守护进程运行你选择的命令或脚本。在本节中，假设用户\
  \ michael 已经在其家目录下创建了一个名为 `797.sh` 的脚本，用于处理某些飞机销售数据库。\n\n从命令行，你可以运行 `at *time*`\
  \ 命令来启动一个在指定时间运行的任务。在这里，*time* 可以是现在（now）；指定的几分钟、几小时或几天数；也可以是你选择的时间。表 9-6 中展示了几个示例。\n\
