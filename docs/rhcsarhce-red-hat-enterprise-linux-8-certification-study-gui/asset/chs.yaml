  \n## 实验答案\n\n### 实验 1\n\n本实验假设你已经下载了 RHEL 9 的 DVD ISO 镜像，正如本章中“获取红帽企业级 Linux”节所解释。按照“在\
  \ VMware Workstation Player 上配置虚拟机”节中为 `server1.example.com` 系统创建虚拟机的步骤进行操作，但将系统名称设置为\
  \ `tester1.example.com`。接下来，按照“RHEL 9 安装”节中的说明安装 RHEL 9。参考表 1-1 中的分区方案，并确保配置了表 1-2\
  \ 中提供的网络设置。\n\n一旦完成安装，你将拥有一个与 `server1.example.com` 相同的 `tester1.example.com` 虚拟机，主主机名和\
  \ IP 地址设置除外。\n\n### 实验 2\n\n考虑到引用了另一个 Linux 认证的要求，这个实验可能看起来奇怪。然而，许多 Linux 管理员非常重视\
  \ Linux 专业协会（LPI）的考试。LPI 创建了优秀的认证。许多 Linux 管理员都在学习 LPIC 1 级认证。通过 LPIC-1 101 和 102\
  \ 考试为 RHCSA 考试提供了良好的基础。\n\n如果你觉得需要更深入地学习 Linux 基础，请参考本章开头描述的一本或两本书。\n\n红帽考试是一项高级挑战。RHCSA\
  \ 考试的一些要求可能看起来令人生畏。如果其中某些目前似乎超出了你的能力也没关系，因为这正是你阅读这本书的原因。但是，如果你对 `ls`、`cd` 和 `cp`\
  \ 等基础命令行工具不熟悉，你可能首先需要更深入地学习 Linux。大多数候选人都能通过一些自学和练习成功地填补知识漏洞。\n\n## 第 2 章\n\n##\
  \ 基础命令行技能\n\n### 认证目标\n\n2.01      Shell\n\n2.02      标准命令行工具\n\n2.03      文件权限\n\
  \n2.04      管理文本文件\n\n2.05      处理文本流\n\n\n\n\n大多数 Linux 配置文件都是文本文件。理解并分析文本发送到终端或通过不同命令进行“管道”传输的流程至关重要。诸如\
  \ `grep` 命令之类的工具可以帮助你关注所需的信息。在本章中，你将学习如何实现以下目标：\n\n![Images](img/square.jpg) 使用\
  \ `grep` 和正则表达式分析文本\n\n## 文本编辑器的使用\n\n要配置 Linux，你需要知道如何编辑文本文件。对于那些初学 Linux 的人来说，这需要一种不同的范式。尽管\
  \ `OpenOffice.org Writer` 和 `Microsoft Word` 等文字处理器可以以文本格式保存文件，但对关键配置文件的误操作可能会导致\
  \ Linux 系统无法启动，而且当使用这些编辑器进行简单的文本编辑时，可能会注入隐藏数据或引起其他问题。因此，你需要知道如何使用标准的非图形界面工具处理以下目标：\n\
  \n![Images](img/square.jpg) 创建和编辑文本文件\n\n## 本地文档的多样性\n\n在红帽考试期间无法访问互联网，但这没关系。Google\
  \ 不是你唯一的朋友。Linux 在大多数软件包中都安装了一些优秀的文档。命令手册也是可用的。以下目标非常直观；它描述了与大多数 Linux 在线文档相关的命令和目录：\n\
  \n![Images](img/square.jpg) 定位、读取和使用系统文档，包括 `man`、`info` 以及 `/usr/share/doc` 中的文件\n\
  \n### 认证目标 2.01\n\n### Shell（壳）\n\n`shell` 是一个用户界面。文本 shell 也用作命令行解释器。在 Linux 中，shell\
  \ 是允许你使用各种命令与操作系统交互的解释器。有了正确的权限权限，你可以在脚本中设置并在需要运行时，甚至在特定时间运行。Linux shell 可以根据你管理每个命令输入输出的方式，以不同的顺序处理命令。解释命令的方式在一定取决于与每个\
  \ shell 相关的变量和参数。\n\n如前介绍，Linux 的默认 shell 是 `bash`，因此书中命令的重点是基于它们在 `bash` 中的用法。然而，还有许多深受用户欢迎的其他\
  \ shell。只要安装了相应的 RPM 包，用户就可以启动这些 shell 中的任何一个。如果需要，你可以在 `/etc/passwd` 文件中更改用户的默认\
  \ shell。\n\n#### 其他 Shell\n\n用户可以在 RHEL 9 的四种命令行 shell 之间选择。尽管 `bash` 是默认 shell，资深\
  \ Linux 和 Unix 用户可能更偏好其他 shell。以下是最常用 shell 的部分列表：\n\n![Images](img/square.jpg)\
  \ `bash` 默认的 Bourne-again shell，基于 Stephen Bourne 最初开发的命令行解释器。\n\n![Images](img/square.jpg)\
  \ `ksh` Korn shell，由 David Korn 在 20 世纪 80 年代在贝尔实验室开发，旨在结合 Bourne-again 和 C shell\
  \ 的最佳特性。\n\n![Images](img/square.jpg) `tcsh` Unix C shell 的增强版本。\n\n![Images](img/square.jpg)\
  \ `zsh` 一种复杂的 shell，类似于 Korn shell。\n\n这些 shell 位于 `/bin` 目录。如果用户偏好将这些选项之一作为其默认\
  \ shell，很容易更改。最直接的方法是更改 `/etc/passwd` 文件中的默认 shell。例如，适用于其中一名作者普通账户的行是：\n\n`michael:x:1000:1000:Michael\
  \ Jang:/home/michael:/bin/bash`\n\n例如，要将默认 shell 更改为 `ksh`，请将 `/bin/bash` 改为 `/bin/ksh`。你还需要安装\
  \ Korn shell 相应的 RPM 包。软件包管理将在第 4 章中介绍。\n\n#### 虚拟控制台\n\n如果你有 RHEL 系统的控制台，可以使用六个虚拟控制台（或“虚拟终端”）打开六个独立的登录会话。然而，默认激活一个虚拟控制台。其他的登录提示会在切换到未使用的终端时动态启动。虚拟控制台由\
  \ `/etc/systemd` 目录下的 `logind.conf` 文件定义。如果你查看该文件，你会看到名为 `NAutoVTs` 的选项，它定义了可以激活的虚拟控制台的最大数量。虚拟控制台与设备文件\
  \ `/dev/tty1` 到 `/dev/tty6` 相关。配置 GUI 时，它占用 `/dev/tty1`。\n\n通常，要在虚拟控制台之间切换，请按 `ALT`\
  \ 和与该终端相关的键。例如，`ALT-F3` 键组合移动到第三终端。然而，在 RHEL GUI 中，`ALT-F*n*` 键组合用于其他功能，例如通过 `ALT-F3`\
  \ 启动“运行应用程序”工具。因此，你需要按下 `CTRL-ALT-F*n*` 从 GUI 移动到*第 n 个虚拟控制台*。\n\n![Images](img/exam.jpg)\n\
  \n尽管对于大多数 Linux 用户来说这应该是轻而易举的，但 RHCSA 的目标之一是“访问 shell 提示符”。现在你应该知道如何设置访问不同 shell\
  \ 提示符了。\n\n在文本控制台登录时，你会看到以下提示符，这取决于 RHEL 的发布版本、内核版本号和系统主机名：\n\n![Images](img/f0047-01.jpg)\n\
  \n需要安装 GNOME 显示管理器 (GDM) 的图形登录更加直观，如图图 2-1 所示。\n\n图 2-1 第一个 GUI 登录控制台\n\n![Images](img/F02-01.jpg)\n\
  \n#### GUI Shell \n\n一旦登录 GUI，访问 `bash` shell 很容易。如果你在默认的 GNOME 桌面环境中，选择“活动 | 终端”。传统上，管理员从控制台工作。但在许多情况下，从\
  \ GUI 进行命令行工作很有帮助，特别是你可以并排窗口。在 GUI 终端屏幕上右键点击支持在不同的窗口或标签页中打开终端。它还支持需要时的复制和粘贴。\n\n\
  书中的命令行截图是使用“浅色”主题的 GUI 命令行，部分原因是白色屏幕上的深色文字更容易阅读。要更改你的 GNOME 终端主题，选择“编辑 | 选项”并点击“常规”标签页，如图图\
  \ 2-2 所示。\n\n图 2-2 更改 GNOME 终端主题的选项\n\n![Images](img/F02-02.jpg)\n\n#### 普通用户与管理员的区别\n\
  \n命令行取决于登录账户相关的权限。提供了两种基本提示符。以下是以普通用户登录时可能看到的示例：\n\n`[michael@server1 ~]$`\n\n注意它包含了用户名、本地系统主机名、当前目录和\
  \ `$` 提示符。`$` 提示符是普通用户的标准。正如书中引言提到的，从普通用户运行的命令示例只显示：\n\n`$`\n\n相比之下，看看同一系统中 root\
  \ 管理用户的提示符。它看起来很熟悉。除了账户名称外，唯一区别是提示符。\n\n`[root@server1 ~]#`\n\n在书中，从 root 管理账户运行的命令示例只显示：\n\
  \n`#`\n\n除了所有权和权限，普通账户与管理员账户之间的其他差异将在第 6 章中讨论。\n\n#### 标准流与命令重定向\n\n\n\n\n\nLinux\
  \ 使用三种基本数据流。数据输入，数据输出，而错误则发送到不同的方向。这些流被称为标准输入 (`stdin`)、标准输出 (`stdout`) 和标准错误 (`stderr`)。每个进程都配置了指向某个设备的\
  \ `stdin`、`stdout` 和 `stderr`。通常情况下，输入来自键盘，而标准输出和标准错误则输出到屏幕终端。在下面的示例中，当你运行 `cat\
  \ /etc/fstab` 时，`/etc/fstab` 文件的内容将作为标准输出发送到屏幕（任何错误也是如此）：\n\n```\n# cat /etc/fstab\n\
  ```\n\n你可以将这些流中的每一个一个重定向到文件或从文件读取。例如，如果你有一个名为 `database` 的程序和一个包含大量数据的数据文件 `datafile`，可以使用左重定向箭头（`<`）将\
  \ `datafile` 的内容发送到 `database` 程序。所示，`datafile` 被用作标准输入：\n\n```\n# database < datafile\n\
  ```\n\n标准输入也可以来自另一个命令。例如，如果你需要滚动启动消息，可以使用管道将 `dmesg` 和 `less` 命令结合起来：\n\n```\n#\
  \ dmesg | less\n```\n\n![Images](img/job.jpg)\n\n**由管道符号分隔的命令序列被称为*管道 (pipeline)*。**\n\
  \n来自 `dmesg` 的输出被重定向为标准输入给 `less`，这允许你像处理独立文件一样滚动查看该输出。\n\n标准输出也同样容易重定向。例如，以下命令使用右重定向箭头（`>`）将\
  \ `ls` 命令的标准输出（该命令列出当前目录的内容）重到到名为 `filelist.txt` 的文件中：\n\n```\n# ls > filelist.txt\n\
  ```\n\n![Images](img/exam.jpg)\n\n**命令重定向符号如 `>`、`>>`、`2>` 和 `|` 与 RHCSA 考试目标中的“输入/输出重定向”相关。**\n\
  \n如果文件 `filelist.txt` 不存在，将被创建。如果它已存在，内容将被覆盖。你可以使用双重定向箭头配合如 `ls >> filelist.txt`\
  \ 的命令将标准输出添加到现有文件的末尾。\n\n如果你想将程序的错误消息保存到文件中，可以使用如下命令重定向它的错误流：\n\n```\n# program\
  \ 2> err-list.txt\n```\n\n有时你可能想丢弃所有错误。这可以通过将错误流重定向到特殊设备文件 `/dev/null` 来：\n\n```\n\
  # program 2> /dev/null\n```\n\n另一个有用的重定向运算符是和 符号加右箭头（`&>`），它将标准输出和错误都发送到文件或设备。示例如所示：\n\
  \n```\n# program &> output-and-error.txt\n```\n\n另一种实现相同结果的方法如下：\n\n```\n# program\
  \ > output-and-error.txt 2>&1\n```\n\n在这里，第一个运算符（`>`）将标准输出发送到指定的文件，而下一个运算符（`2>&1`）将标准错误流发送到与标准输出相同的文件中。\n\
  \nTable 2-1 总结了我们为止描述的重定向运算符。\n\n表 2-1 重定向运算符\n\n![Images](img/f0051-01.jpg)\n\n\
  ### 认证目标 2.02\n\n### 标准命令行工具\n\n虽然较新的 Linux 用户可能倾向于使用 GUI，但管理 Linux 最有效的方法是通过命令行界面。尽管有出色的\
  \ GUI 工具，但这些工具的外观和感受在不同发行之间差异巨大。相比之下，如果你熟悉标准的命令行工具，你能够在每个 Linux 发行版中生存。\n\n记住，在任何\
  \ bash 会话中，你都可以使用向上和向下箭头键查看以前命令的历史，并使用 `CTRL-R` 进行搜索。你还可以利用文本补全，这允许你将 `TAB` 键作为通配符来完成命令、文件名或变量（如果文本以\
  \ `$` 字符开头）。\n\n![Images](img/exam.jpg)\n\n**本节仅涵盖 Linux 中可用的最基本的命令。它仅描述了每个命令的少数功能。尽管如此，它允许你像\
  \ RHCSA 目标描述的那样“使用正确的语法发布命令”。**\n\n几乎所有的 Linux 命令都包含选项（或“开关”）和参数。命令选项允许你更改命令的行为，并且通常以一个或两个短划线开头（例如\
  \ `ls -a` 或 `ls --all`）。参数指定了命令应该操作的文件、设备或其他目标。本章仅涵盖了少数命令。如果你对其中某些命令不太熟悉，请查阅文档。学习命令选项。尝试它们！只有通过练习、练习、更多的练习，你才能真正理解某些命令背后的力量。\n\
  \n有两组基本命令用于管理 Linux 文件。一组帮助你在 Linux 文件和目录之间跳跃。另一组则实际上对文件进行某些创建性操作。这些命令将在后续章节中介绍，但首先我们将回顾一些基本的文件系统概念。\n\
  \n#### 文件和目录概念\n\n如之前所述，Linux 中的一切都可以归结为文件。目录是特殊类型的文件，充当其他文件的容器。为了导航并找到重要文件，你需要一些基本命令和概念来告诉你在哪里，以及如何在目录之间移动。最重要的命令之一是\
  \ `pwd`，它打印当前目录；一个始终指向用户主目录的变量是波浪号（`~`）；描述你在 Linux 目录树中所处位置的概念是路径（path）。与之紧密相关的是在输入命令时搜索的目录，它是基于名为\
  \ `PATH` 的环境变量的。一旦理解了这些概念，你就可以 `cd`（“change directory”的缩写）命令在目录之间导航。\n\n##### pwd\n\
  \n在命令行界面上，当前目录可能是顶层根目录（`/`）或子目录。`pwd` 命令识别当前目录。尝试一下。它将给你一个相对于 `/` 目录的名称。有了这些信息，你可以在需要时移动到不同的目录。顺便一下，`pwd`\
  \ 是“print working directory”的缩写（这与现代打印机无关，但尊重了输出在电打字机上的时代）。例如，当用户 michael 在他的主目录下运行该命令时，他得到了以下输出：\n\
  \n`/home/michael`\n\n##### 波浪号 (~)\n\n在标准登录后，每个 Linux 用户都会被带到一个主目录。波浪号（`~`）可以表示任何当前活动用户的主目录。例如，当用户\
  \ john 登录时，他被带到他的主目录 `/home/john`。相比之下，root 管理用户的主目录是 `/root`。\n\n因此，`cd ~` 命令的效果取决于你的主目录。例如，如果你以用户\
  \ mj 登录，`cd ~` 命令导航到 `/home/mj` 目录。如果你以 root 用户登录，此命令导航到 `/root` 目录。你可以在目录树的任何位置使用\
  \ `ls ~` 命令列出主目录的内容。`cd` 和 `ls` 命令稍后描述。当你以 root 管理用户登录并运行 `ls` 命令时，你应该看到以下文件名被列出：\n\
  \n`anaconda-ks.cfg`\n\n顺便一下，此文件描述了安装过程中发生了什么、安装了哪些包以及添加到本地系统的用户和组。`anaconda-ks.cfg`\
  \ 命令对于自动化 Kickstart 安装也很重要，但这超出了 RHCSA 考试的范围。\n\n##### 目录路径\n\n\n\n\n\n在处理 Linux\
  \ 目录时，你需要了解两种路径概念：绝对路径和相对路径。绝对路径以顶层目录——根目录（`/`）开始描述完整的目录结构。相对路径基于当前目录。相对路径不以斜杠开头，但它们可能会以“./”开头。在这种语境下，点符号表示当前目录。\n\
  \n绝对路径和相对路径之间的区别非常重要。使用相对路径引用错误目录的命令可能会导致意外的后果。例如，假设你处于顶层根目录 `/`，并且你使用了相对于根目录的相对路径\
  \ `home` 备份了 `/home` 目录（注意开头没有斜杠）。如果你在恢复该备份时恰好位于 `/home` 目录，那么例如用户 michael 的文件将被恢复到\
  \ `/home/home/michael` 目录。\n\n相比之下，如果使用绝对路径 `/home` 备份了 `/home` 目录（注意开头有斜杠），那么当你恢复这些文件时，无论当前工作目录在哪里都无紧要。该备份将恢复到正确的目录中。\n\
  \n## PATH 环境变量\n\n`PATH` 是一个特殊的环境变量，shell（如 `bash`）会通过它搜索可执行的命令。`PATH` 包含一个目录列表，用于搜索用户刚刚在命令行提示符处输入的命令。严格来说，最好使用命令的完整路径，例如使用\
  \ `/bin/ls` 而不是 `ls`。在实践中，这非常繁琐，这也就是为什么创建了 `PATH` 环境变量。唯一建议使用绝对路径的地方是在 shell 脚本中或者当\
  \ `PATH` 在不同机器之间未知或不一致时。在交互式 shell 中输入命令时，除非该命令恰好位于不在 `PATH` 中的目录中，否则通常不需要使用绝对路径。\n\
  \n要确定当前用户账户的 `PATH`，请运行 `echo $PATH` 命令。你会在输出中看到一系列目录。普通用户和 root 用户 `PATH` 之间的区别所示：\n\
  \n![Images](img/f0053-01.jpg)\n\n普通用户和 root 管理员用户的 `PATH` 变量中包含的目录略有不同。但这些差异非常重要，因为目录是按顺序搜索的。例如，`useradd`\
  \ 命令位于 `/usr/sbin` 目录。从普通用户和 root 用户的默认 `PATH` 可以看出该命令不在普通用户的 `PATH` 中，因为 `/usr/sbin`\
  \ 不在列表中。\n\n`PATH` 是通过 `/etc/profile` 文件中的当前设置或 `/etc/profile.d` 目录中的脚本全局确定的。\n\n\
  除了全局设置外，单个用户的 `PATH` 还可以通过用户家目录下隐藏文件 `~/.bash_profile` 或 `~/.profile` 中的相应条目进行自定义。\n\
  \n## cd\n\n在 Linux 中更改目录非常简单。只管使用 `cd` 并引用目标目录的绝对路径即可。如果你使用相对路径，只需记住目标取决于当前工作目录。\n\
  \n默认情况下，不带参数的 `cd` 命令会导航到你的家目录。该命令不需要波浪号。另一个常用快捷键是两个连续的点（`..`），表示层次结构上一级的目录。因此，`cd\
  \ ..` 会移动到当前工作目录的父目录。\n\n## 文件列表和 ls\n\n现在你已经回顾了可以在目录之间导航的命令，是时候查看目录中存在哪些文件了——这就是\
  \ `ls` 命令的领域。\n\nLinux 的 `ls` 命令（list 的缩写）在配合正确的开关时可以非常强大。正确的 `ls` 命令可以告诉你关于文件的所有信息，例如最后修改时间、最后访问时间和大小。它可以帮助你以任何所需的顺序组织文件列表。该命令的重要变体包括：`ls\
  \ -a` 显示隐藏文件（即以点 `.` 开头命名的文件）、`ls -l` 用于详细列表、`ls -t` 用于按修改时间排序的列表，以及 `ls -i` 显示\
  \ inode 节点（inode 是文件系统中存储文件信息的内部数据结构）。其他实用的命令选项还有 `-r` 用于反转列表顺序，以及 `-R` 用于递归列出所有子目录的内容。\n\
  \n你可以组合开关；我们经常使用 `ls -ltR` 命令来显示递归详细列表，并将最近更改的文件放在最后。`-d` 开关与其他开关结合使用时，可以为你提供关于当前目录或你作为参数参数传递给\
  \ `ls` 命令的目录的更多信息。\n\n返回 SELinux 上下文的一个重要功能是 `ls -Z` 命令。查看图 2-3 中的输出。`system_u`、`object_r`、`var_t`\
  \ 和 `s0` 输出演示了指定文件的当前 SELinux 上下文。在 RHCSA 考试（以及 RHCE 考试）中，你将被要求配置一个启用 SELinux 的系统。从第\
  \ 8 章开始，本书将介绍如何为每个已安装的服务配置 SELinux。\n\n图 2-3 当前 SELinux 上下文\n\n![Images](img/F02-03.jpg)\n\
  \n## 创建文件命令\n\n使用两个命令创建新文件：`touch` 和 `cp`。或者，你可以让 `vi` 等文本编辑器创建新文件。虽然 `ln`、`mv`\
  \ 和 `rm` 命令不创建文件，但它们以相关的方式管理文件。\n\n### touch\n\n创建新空文件最简单的方法可能是使用 `touch` 命令。例如，`touch\
  \ abc` 创建名为 abc 的空文件。`touch` 命令也用于更改文件的最后修改时间。例如，尝试以下操作：\n\n![Images](img/f0055-02.jpg)\n\
  \n注意 `ls -l` 输出列的时间戳，并将其与 `` 返回的结果进行比较。运行 `touch` 命令后，`/etc/passwd` 的时间戳将更新为当前时间。\n\
  \n### cp\n\n`cp`（copy）命令允许你将一个文件的内容并在选择的目录中放置相同或不同的副本。例如，`cp file1 file2`。`cp` 的危险之处之一是它可以覆盖不同目录中的文件，而不会提示你是否想这样做。\n\
  \n`cp` 命令的另一种用法是将多个源文件复制到目标目录。在这种情况下，语法为 `cp file1 file2 ... dir`。\n\n`cp` 命令配合\
  \ `-a` 开关支持递归更改并保留所有文件属性，如权限、所有者和戳。例如，以下命令将指定目录的所有子目录及其关联文件复制到 /mnt/backup：\n\n\
  ```bash\n# cp -a /home/michael/. /mnt/backup/\n```\n\n### mv\n\n虽然 Linux 中有一个“rename”命令，但你可以使用\
  \ `mv`（move 的缩写）。`mv` 命令为文件赋予一个新的标签。例如，`mv file1 file2` 将 file1 重命名为 file2。除非将其移动到不同的文件系统，否则文件的所有信息（包括\
  \ inode 节点）保持不变。\n\n`mv` 命令还可以用于将文件和目录移动到最后一个参数指定的目录。下面的示例在当前目录下创建两个名为“a”和“b”的文件，然后将它们移动到\
  \ /tmp 目录：\n\n![Images](img/f0056-02.jpg)\n\n### ln\n\n链接文件允许用户使用不同的名称引用同一个文件。当链接文件是设备时，它们可以代表更常见的名称，例如\
  \ `/dev/cdrom`。文件链接可以是硬链接或软链接。\n\n\n\n\n\n硬链接是指向同一个 inode 的目录项（或“dentries”）。它们必须在同一个文件系统中创建。你可以删除其中一个目录中的硬链接文件，而它在另一个目录中仍然存在（文件只有在指向其文件的\
  \ dentry 记录数量的计数变为 0 时才会被删除，这通过每个文件的计数器进行跟踪）。例如，以下命令从实际的 Samba 配置文件在 `/root` 目录下的\
  \ `smb.conf` 创建硬链接：\n\n```bash\n# ln /etc/samba/smb.conf /root/smb.conf\n```\n\n\
  另一方面，软链接（符号链接）充当重定向的作用；当你打开用软链接创建的文件时，该链接会将你重定向到原始文件。如果你删除了原始文件，该文件就会丢失。尽管软链接还在，但它已经无处可去了。以下命令是创建软链接文件的示例：\n\
  \n```bash\n# ln -s /etc/samba/smb.conf /root/smb.conf\n```\n\n## rm\n\n`rm` 命令具有一定的危险。在\
  \ Linux 命令行中，没有回收箱。因此，如果你使用 `rm` 命令删除一个文件，充其量是很难恢复该文件。\n\n`rm` 命令非常强大。例如，假设你在 `/root/rpmbuild/BUILD/kernel-5.14.0-162.el9_1`\
  \ 目录下下载了 Linux 内核源码。该目录下包含了数千个文件。如果你不再需要这些文件，显然逐个删除它们是不现实的。因此，`rm` 命令包含一些强大的开关。以下命令一次性删除所有这些文件：\n\
  \n```bash\n# rm -rf /root/rpmbuild/BUILD/kernel-5.14.0-162.6.1.el9_1\n```\n\n`-r`\
  \ 开关用于递归操作，而 `-f` 开关会覆盖任何安全措施，例如在 root 管理用户的 `alias` 命令输出中显示的 `-i` 开关（它会提示进行确认）。这仍然是一个非常危险的命令。例如，一个简单的输入错误，如在第一个正斜杠和目录名称之间加上一个空格（如下所示），会在查找\
  \ `/root/rpmbuild/BUILD/kernel-5.14.0-162.6.1.el9` 子目录之前，首先删除每一个以顶级根目录（`/`）开头的文件：\n\
  \n```bash\n# rm -rf / root/rpmbuild/BUILD/kernel-5.14.0-162.6.1.el9_1\n```\n\n这将删除系统上的每一个文件，你将不得不从备份中恢复所有内容。\n\
  \n## 目录的创建与删除\n\n`mkdir` 和 `rmdir` 命令用于创建和删除目录。这些命令的使用取决于之前讨论过的绝对路径和相对路径的概念。例如，以下命令在当前目录下创建\
  \ test 子目录。如果你当前位于 `/home/michael` 目录，完整路径将是 `/home/michael/test`。\n\n```bash\n\
  # mkdir test\n```\n\n或者，以下命令创建 `/test` 目录：\n\n```bash\n# mkdir /test\n```\n\n如果需要，可以使用以下命令创建一系列目录：\n\
  \n```bash\n# mkdir -p test1/test2/test3\n```\n\n该命令等同于以下命令：\n\n![Images](img/f0058-01.jpg)\n\
  \n相反，`rmdir` 命令仅在目录为空时才删除目录。如果你在清理之前的 `mkdir` 命令留下的目录，`-p` 开关在这里同样有用。以下命令删除指定的目录及其子目录，只要所有这些目录本身都是空的：\n\
  \n![Images](img/f0058-02.jpg)\n\n## alias\n\n`alias` 命令可以用于简化一些命令。对于 root 管理用户，默认别名提供了一定的安全性。要查看当前用户的别名，请运行\
  \ `alias` 命令。以下输出显示了 root 用户的一些默认 Red Hat 别名：\n\n![Images](img/f0058-03.jpg)\n\n\
  这些别名中的一些可以保护关键文件免受错误影响。`-i` 开关在 `cp`、`mv` 或 `rm` 命令删除或覆盖文件之前会提示用户进行确认。请注意，对于上述命令，`-f`\
  \ 开关会优于 `-i` 开关。\n\n### 通配符\n\n有时你可能不知道文件的确切名称或确切的搜索词。这时通配符就很有用了，特别是对于书中书中描述的命令。表\
  \ 2-2 显示了三种基本的通配符。\n\n表 2-2 Shell 中的通配符\n\n![Images](img/f0059-01.jpg)\n\n![Images](img/job.jpg)\n\
  \n**通配符的使用在 Linux 世界有时被称为通配匹配（globbing）。**\n\n### 文件搜索\n\n大多数学习 Linux 一段时间后的用户都会熟悉关键文件。例如，`named.conf`\
  \ 是基于 Berkeley 互联网命名域（BIND）的标准 DNS（域名服务）服务器的关键配置文件。但并没有多少人记得在 `/usr/share/doc/bind/sample/etc`\
  \ 目录下可以找到包含各种有用配置提示的示例 `named.conf` 文件。\n\n为此，有两种用于文件搜索的基本命令：`find` 和 `locate`。\n\
  \n### find\n\n`find` 命令遍历目录。例如，如果你想在根目录下查找 `named.conf`，可以使用：\n\n```bash\n# find\
  \ / -name named.conf\n```\n\n但如果你知道文件在 `/usr` 下，可以使用：\n\n```bash\n# find /usr -name\
  \ named.conf\n```\n\n### locate\n\n如果这很耗时，RHEL 允许你建立文件数据库。`locate` 的搜索几乎是瞬时的——缺点是\
  \ `locate` 数据库每天更新一次。\n\n![Images](img/exam.jpg)\n\n**当你参加 Red Hat 考试时，尽早运行 updatedb\
  \ 可以更快找到所需文件。**\n\n### 认证目标 2.03\n\n### 文件权限\n\nLinux 的基本安全性基于文件权限。默认文件权限由 `umask`\
  \ 命令定义。特殊权限可以赋予用户和/组额外的权限。这些被称为用户 ID (SUID)、设置组 ID (SGID) 和粘滞位。所有权基于创建文件的默认用户和组\
  \ ID。权限的管理涉及 `chmod`、`chown` 和 `chgrp` 等命令。在探索这些命令之前，理解与相关的权限是重要的。\n\n#### 文件权限与所有权\n\
  \nLinux 文件权限和所有权非常直观。正如相关的 RHCSA 目标所示，它们是读、写、执行，分为用户、组和其他。然而，权限对目录的影响更为微妙。表 2-3\
  \ 显示了每个权限位的确切含义。\n\n考虑来自 `ls -l /sbin/fdisk` 的输出：\n\n`-rwxr-xr-x. 1 root root 175376\
  \ Sep 21 10:45 /sbin/fdisk`\n\n权限显示在列表的左侧。共有十个字符。第一个字符决定它是普通文件还是特殊文件。在这个例中，第一个字符是连字符（-），表示这是一个普通文件。剩下的九个字符必须每三个一组读取，每组分别应用于文件所有者（用户）、组所有者以及该\
  \ Linux 系统上的其他人。这些权限在表 2-4 中描述。\n\n表 2-4 文件权限描述\n\n\n\n\n因此，在之前的示例中，root 用户对 `/sbin/fdisk`\
  \ 文件具有 `rwx` 权限，而 root 组和其他所有人仅具有 `rx` 权限。文件的用户所有者和组所有者相同是常见的。在这种情况下，root 用户是 root\
  \ 组的成员。但他们的名称并不一定相同。例如，为用户间协作而设计的目录可能由一个特殊组所有。正如第 6 章所解释，这涉及包含几个普通用户作为成员的组。\n\n\
  请记住，授予组的权限高于授予所有其他用户的权限。同样，授予所有者的权限高于所有其他权限类别。因此，在接下来的示例中，尽管其他人对该文件具有完全控制权，但“mike”组的成员没有被授予任何权限，因此他们无法读取、修改或执行该文件：\n\
  \n![Images](img/f0061-03.jpg)\n\n权限中有一个相对较新的元素——它非常微妙。注意到执行 `ls -l setup.sh` 命令的输出中最后一个\
  \ `x` 之后的点了吗？它指定了该文件具有 SELinux 安全上下文。如果你在文件上配置了 ACL 权限，该点会被加号 (+) 替换。但该符号不会覆盖 SELinux\
  \ 控制。\n\n你需要考虑另一种类型的权限：特殊权限位。这些包括 SUID 和 SGID 位以及另一种称为“粘滞位”（sticky bit）的特殊权限。特殊权限位对文件和目录的影响见表\
  \ 2-5。\n\n### 表 2-5 特殊权限位\n\n![Images](img/f0062-01.jpg)\n\nSUID 位的一个示例与 `/usr/bin`\
  \ 目录下的 `passwd` 命令相关。在该文件上执行 `ls -l` 命令将产生以下输出：\n\n![Images](img/f0062-02.jpg)\n\
  \n文件用户所有者执行位中的 `s` 是 SUID 位。这意味着其他用户可以以文件所有者（root 管理员用户）的权限执行该文件。但这并不意味着任何用户都可以更改其他用户的密码。对\
  \ `passwd` 命令的访问受到可插拔认证模块 (PAM) 的进一步监管，尽管这超出了 RHSCA 考试的范围。需要 SUID 权限是因为用户的密码存储在\
  \ `/etc/shadow` 中，而该文件只能由 root 用户访问。\n\nSGID 位的一个示例可以在 `/usr/bin` 目录下的 `locate`\
  \ 命令中找到。在该文件上执行 `ls -l` 命令将显示以下输出：\n\n![Images](img/f0062-03.jpg)\n\n文件组所有者（nobody\
  \ 组）执行位中的 `s` 是 SGID 位。`locate` 命令设置了 SGID 位，因为它在数据库 `/var/lib/mlocate/mlocate.db`\
  \ 中跟踪系统中的所有文件，而该数据库只有 root 和 slocate 用户可读。\n\n最后，粘滞位的示例可以在 `/tmp` 目录的权限中找到。这意味着用户可以将他们的文件复制到该目录，但除了各自的所有者外，其他人无法删除这些文件（这就是“粘滞”的含义）。在该目录上执行\
  \ `ls -ld` 命令显示以下输出：\n\n![Images](img/f0062-04.jpg)\n\n其他用户执行位中的 `t` 是粘滞位。注意，如果没有粘滞位，每个人都能够删除\
  \ `/tmp` 中其他人的文件，因为该目录已向所有用户授予了写权限。\n\n### 写权限的漏洞\n\n从文件中移除写权限非常简单。例如，如果你想让 `license.txt`\
  \ 文件变为只读，以下命令可以移除该文件的写权限：\n\n![Images](img/f0063-01.jpg)\n\n你可能会注意到，在某些情况下，如果在 `vi`\
  \ 文本编辑器中进行了更改，该文件的所有者可以使用感叹字符（bang character，看起来像感叹号 (!)）来覆盖写权限的缺失。换句话说，在 `vi` 编辑器中，文件所有者可以运行以下命令来覆盖缺失写权限：\n\
  \n```\nw!\n```\n\n尽管这看起来可能令人惊讶，但在实践中，`vi` 编辑器的 `w!` 命令并没有绕过 Linux 文件权限系统。`w!` 命令覆盖文件——也就是说，它删除现有文件并创建一个同名的新文件。正如你从表\
  \ 2-3 中所示，授予创建和删除文件权限的权限位是父目录的写权限，而不是文件本身的写权限。因此，如果用户对目录具有写权限，她就可以覆盖其中的文件，无论文件上设置了什么写权限位。\n\
  \n### 修改权限和所有权的命令\n\n帮助你管理文件权限和所有权的关键命令是 `chmod`、`chown` 和 `chgrp`。在接下来的子节中，你将检查如何使用这些命令来更改权限以及拥有特定文件（甚至一系列文件）的用户和组。\n\
  \n可以帮助你更改一系列文件权限的小技巧是使用 `-R` 选项。它是这三个命令的递归开关。换句话说，如果你对目录使用任何这些命令指定 `-R` 关，更改将递归应用。递归意味着更改也适用于子目录中的文件。\n\
  \n#### chmod 命令\n\n`chmod` 命令使用与所有者、组和其他相关的权限数值值。在 Linux 中，权限分配的数值如下：`r`=4，`w`=2，`x`=1。在数值格式中，权限由八进制数字表示，每个数字对应一个权限组。例如，权限数字\
  \ 640 表示所有者被分配了权限 6（4+2，读写），而组权限 4（读），其他人没有权限。`chown` 和 `chgrp` 命令调整与文件相关的用户和组所有者。\n\
  \n`chmod` 命令非常灵活。你并不总是需要使用数字。例如，以下命令为 `script.sh` 文件的所有者设置执行权限：\n\n```\n# chmod\
  \ u+x script.sh\n```\n\n注意 `u` 和 `x` 如何遵循相关目标指定的 ugo/rwx 格式。解释一下，此命令为文件所有者（`u`）添加（加号\
  \ +）执行权限（`x`）。\n\n这些符号可以组合使用。例如，以下命令为本地文件 `document.txt` 禁用（减号 -）组所有者（`g`）和所有其他用户（`o`）的写权限（`w`）：\n\
  \n```\n# chmod go-w document.txt\n```\n\n与其 `+` 和 `-` 运算符添加或移除权限，可以使用等号运算符 (=) 设置权限组的精确模式。作为一个示例，以下命令将\
  \ `document.txt` 文件的组权限更改为读和写，并清除已设置的执行权限：\n\n```\n# chmod g=rw document.txt\n```\n\
  \n\n\n对于 SUID、SGID 和粘滞位（sticky bits），有一些特殊选项可用。如果你选择使用数字位，这些特殊位也会分配数值，其中 `SUID =\
  \ 4`、`SGID = 2` 且 `sticky bit = 1`。然而，要定义这些特殊位，你需要在八进制表示中多加一位数字。例如，以下命令配置了 SUID\
  \ 位（权限模式下的前 4 位数字）。它对名为 `testfile` 的文件包含了用户所有者的 rwx 权限（使用 7）、组所有者的 rw 权限（使用 6）以及其他用户的\
  \ r 权限（使用最后 4 位）：\n\n```\n# chmod 4764 testfile\n```\n\n如果你更倾向于使用 ugo/rwx 格式，以下命令激活了本地\
  \ `testscript` 文件的 SGID 位：\n\n```bash\n# chmod g+s testscript\n```\n\n接下来的命令为 `/test`\
  \ 目录开启粘滞位：\n\n```\n# chmod o+t /test\n```\n\n对于 `chmod` 命令，更改不需要由 root 管理员执行。文件所有者被允许更改与其文件相关的权限。\n\
  \n### `chown` 命令\n\n`chown` 命令可用于修改文件的所有者。例如，查看我们为本章创建的第一个图的所有权情况，基于 `ls -l` 命令：\n\
  \n```\n-rw-r--r--. 1 michael examprep 855502 Oct 25 14:07 F02-01.tif\n```\n\n该文件的用户所有者是\
  \ `michael`；组所有者是 `examprep`。接下来的 `chown` 命令将用户所有者更改为 `elizabeth`，但必须以 root 身份执行：\n\
  \n```bash\n# chown elizabeth F02-01.tif\n```\n\n你可以使用 `chown` 执行更多操作；例如，以下命令将注记文件的用户和组所有者都更改为用户\
  \ `donna` 和组 `supervisors`（假设该用户和组已存在）：\n\n```bash\n# chown donna.supervisors F02-01.tif\n\
  ```\n\n只有 root 管理员可以更改文件的用户所有者，而组所有权可以由 root 修改，也可以由文件的所有者修改。\n\n### `chgrp` 命令\n\
  \n你可以使用 `chgrp` 命令更改文件的组所有者。例如，以下命令将注记文件 `F02-01.tif` 的组所有者更改为名为 `project` 的组（假设它存在）：\n\
  \n```bash\n# chgrp project F02-01.tif\n```\n\n### 特殊文件属性\n\n除了常规的 rwx/ugo 权限外，文件还有属性。这些属性可以帮助你控制任何人对不同文件可以做什么。`lsattr`\
  \ 命令列出当前的文件属性，而 `chattr` 命令可以帮助你更改这些属性。例如，以下命令保护 `/etc/fstab` 不被意外删除，即使是 root 管理员也不如此：\n\
  \n```\n# chattr +i /etc/fstab\n```\n\n有了该属性，如果你尝试以 root 管理员身份删除该文件，将得到如下响应：\n\n\
  ![Images](img/f0065-06.jpg)\n\n`lsattr` 命令显示 `/etc/fstab` 上有一个激活的“不可变”（immutable）属性：\n\
  \n![Images](img/f0066-02.jpg)\n\n当然，root 管理员可以使用以下命令取消该属性。尽管如此，最初对删除文件的拒绝至少应该让管理员在做出更改之前停下来。\n\
  \n```bash\n# chattr -i /etc/fstab\n```\n\n表 2-6 描述了几个关键属性。其他属性如 `c`（压缩）、`s`（安全删除）和\
  \ `u`（不可删除）对于存储在 ext4 和 XFS 文件系统中的无效。\n\n表 2-6 文件属性\n\n![Images](img/f0066-01.jpg)\n\
  \n### 用户和组概念的基础介绍\n\nLinux 与 Unix 一样，配置了用户和组。每个使用 Linux 的人都设置了用户名，即使只是“guest”。甚至还有一个名为“nobody”的标准用户。查看\
  \ `/etc/passwd`。该文件的摘录如图 2-4 所示。\n\n图 2-4 `/etc/passwd` 文件\n\n![Images](img/F02-04.jpg)\n\
  \n如所示，`/etc/passwd` 文件中列出了各种用户名。即使是如 `mail`、`news`、`ftp` 和 `apache` 等若干 Linux 服务也有它们自己的用户名。在任何情况下，`/etc/passwd`\
  \ 文件遵循特定的格式，第 6 章中会有更详细的描述。为了讨论起，请注意此文件中显示的唯一普通用户是 `alex` 和 `michael`；他们的用户 ID (UID)\
  \ 和组 ID (GID) 分别为 1000 和 1001；他们的主目录与其用户名匹配。下一个用户获得 UID 和 GID 为 1002，依此类推。\n\n这种\
  \ UID 和 GID 的匹配是基于红帽用户私有组方案。现在运行 `ls -l /home` 命令。输出应该类似于：\n\n![Images](img/f0066-04.jpg)\n\
  \n注意权限。根据本章前面的 rwx/ugo 概念，只有命名的所有者可以访问其主目录。\n\n#### umask\n\nLinux 与 Unix 一样，配置了用户和组。每个使用\
  \ Linux 的人都设置了用户名，即使只是“guest”。还有一个名为“nobody”的标准用户。查看 `/etc/passwd`。该文件的摘录如图 2-4\
  \ 所示。\n\n图 2-4 `/etc/passwd` 文件\n\n![Images](img/F02-04.jpg)\n\n如所示，`/etc/passwd`\
  \ 文件中列出了各种用户名。即使是如 `mail`、`news`、`ftp` 和 `apache` 等若干 Linux 服务也有它们自己的用户名。在任何情况下，`/etc/passwd`\
  \ 文件遵循特定的格式，第 6 章中会有更详细的描述。为了讨论起，请注意此文件中显示的唯一普通用户是 `alex` 和 `michael`；他们的用户 ID (UID)\
  \ 和组 ID (GID) 分别为 1000 和 1001；他们的主目录与其用户名匹配。下一个用户获得 UID 和 GID 为 1002，依此类推。\n\n这种\
  \ UID 和 GID 的匹配是基于红帽用户私有组方案。现在运行 `ls -l /home` 命令。输出应该类似于：\n\n![Images](img/f0066-04.jpg)\n\
  \n注意权限。根据本章前面的 rwx/ugo 概念，只有命名的所有者可以访问其主目录。\n\n##### 默认 umask\n\n每当你创建一个新文件，默认权限都基于\
  \ umask。例如，000 的 umask 影响了 777 (777 - 000 = 777)，对应于权限字符串：\n\n```\n-rwxrwxwx\n```\n\
  \n在过去，umask 的 000 影响了所有文件 666，因为新文件不再获得执行权限。目录需要执行权限。\n\n#### umask\n\n每当你创建一个新文件，默认权限都基于\
  \ umask。例如，002 的 umask 影响了 664 (666 - 002 = 664)，对应于权限字符串：\n\n```\n-rw-rw-r--\n\
  ```\n\n在过去，umask 的 000 影响了所有文件 666，因为新文件不再获得执行权限。目录需要执行权限。\n\n##### 默认 umask\n\n\
  每当你创建一个新文件，默认权限都基于 umask。例如，022 的 umask 影响了 644 (666 - 022 = 644)，对应于权限字符串：\n\n\
  ```\n-rw-r--r--\n```\n\n在过去，umask 的 000 影响了所有文件 666，因为新文件不再获得执行权限。目录需要执行权限。\n\n\
  ##### 默认 umask\n\n每当你创建一个新文件，默认权限都基于 umask。例如，027 的 umask 影响了 639 (666 - 027 = 639)，对应于权限字符串：\n\
  \n```\n-rw-r-----\n```\n\n在过去，umask 的 000 影响了所有文件 666，因为新文件不再获得执行权限。目录需要执行权限。\n\n\
  #### umask\n\n每当你创建一个新文件，默认权限都基于 umask。例如，022 的 umask 影响了目录 755 (777 - 022 = 755)，对应于权限字符串：\n\
  \n```\n-rwxr-xr-x\n```\n\n在过去，umask 的 000 影响了所有文件 666，因为新文件不再获得执行权限。目录需要执行权限。\n\n\
  ##### 默认 umask\n\n每当你创建一个新文件，默认权限都基于 umask。例如，027 的 umask 影响了目录 750 (777 - 027 =\
  \ 750)，对应于权限字符串：\n\n```\n-rwxr-x---\n```\n\n#### umask\n\n每当你创建一个新文件，默认权限都基于 umask。例如，002\
  \ 的 umask 影响了目录 775 (777 - 002 = 775)，对应于权限字符串：\n\n```\n-rwxrwxr-x\n```\n\n\n\n\
  之前，你已经查看了如 `cd`、`ls` 和 `pwd` 等命令，这些命令可以帮助你在 Linux 文件系统中穿行。通过 `find` 和 `locate` 等命令，你已经学习了如何识别所需文件的位置。\n\
  \n现在是时候读取并处理文件内容了。大多数 Linux 配置文件都是文本文件。Linux 编辑器是文本编辑器。Linux 命令的设计用于读取文本文件。要识别当前目录下的文件类型，请尝试使用\
  \ `file` 命令。\n\n### cat\n\n读取文件的最基础命令是 `cat`。`cat filename*` 命令会滚动显示 `filename`\
  \ 文件中的文本。它也适用于多个文件名；它会将你列出的多个文件名合并，作为一个连续的输出显示到你的屏幕上。正如之前的章节“标准流与命令重定向”中所描述的，你可以将输出重定向到选择的文件。\n\
  \n### less and more\n\n较大的文件需要一些命令行实用程序来帮助你悠闲地滚动查看文件文本。这些工具被称为*分页器*（pagers），最常用的是\
  \ `more` 和 `less`。通过 `more filename*` 命令，你可以一次一个屏幕地从头到尾滚动查看文件的文本。通过 `less filename*`\
  \ 命令，你可以使用 PAGE UP、PAGE DOWN 和方向键向两个方向滚动同一段文本。这两个命令都支持 vi 风格的搜索。\n\n由于 `less` 和\
  \ `more` 命令不会更改文件，它们是滚动和搜索大型文本文件（如错误日志）中内容的极佳方法。例如，要搜索基础 `/var/log/messages` 文件，请运行以下命令：\n\
  \n```\n# less /var/log/messages\n```\n\n随后，你就可以向上向下滚动日志文件以查找重要信息了。你可以使用正斜杠 `/` 和问号\
  \ `?` 在文件中正向或反向搜索。例如，一旦你运行了刚才显示的命令，你将进入一个与 图 2-5 所示类似的屏幕。\n\n图 2-5 less 分页器和 /var/log/messages\n\
  \n![Images](img/F02-05.jpg)\n\n要在文件中正向搜索“error”术语，在分页器中输入以下内容：\n\n```\n/error\n\
  ```\n\n若要反向搜索，请将 `/` 替换为 `?`。\n\n`less` 命令的 `zless` 变体多了一个 `more` 和 `cat` 等命令不具备的功能：它可以读取以\
  \ gzip 格式压缩的文本文件（通常显示为 `.gz` 扩展名）。例如，在 shell 中运行的许多标准命令相关的帮助页（man pages）可以在 `/usr/share/man/man1`\
  \ 目录下找到。该目录中的所有文件都是 `.gz` 格式压缩的。尽管如此，`zless` 命令仍然可以这些文件。\n\n这就涉及到 `man` 命令的操作。换句话说，这两个命令在功能上是等价的：\n\
  \n![Images](img/f0069-03.jpg)\n\n### head and tail\n\n`head` 和 `tail` 命令是独立的工具，工作方式本质上相同。默认情况下，`head\
  \ filename*` 命令查看文件的前 10 行；`tail filename*` 命令查看文件的最后 10 行。你可以通过 `-n xy*` 选项指定显示的行数。例如，`tail\
  \ -n 15 /etc/passwd` 命令会列出 `/etc/passwd` 文件的最后 15 行。\n\n`tail` 命令对于正在进行的问题特别有用。例如，如果存在登录失败的持续性问题，以下命令会监控指定的文件，并在记录新日志条目时在屏幕上显示新行：\n\
  \n```\n# tail -f /var/log/secure\n```\n\n### 处理文本流的命令\n\n文本流是数据的移动。例如，`cat filename*`\
  \ 命令将数据从 `filename` 文件流传输到终端。当这些文件变得很大时，拥有可以过滤及处理这些文本流的命令会非常方便。\n\nLinux 包含了简单的命令来帮助你搜索、检查或排序文件内容。此外，还有某些特殊文件包含其他文件；其中一些容器文件通俗称为“tar\
  \ 包”（tarballs）。我们将在第 9 章中探索 tar 包。\n\n![Images](img/job.jpg)\n\n**tar 包是分发 Linux\
  \ 软件包的常用方式。软件包通常以压缩格式分发，具有 .tar.gz 或 .tgz 文件扩展名，并合并为单个文件中的包。**\n\n### sort\n\n你可以通过多种方式对文件内容进行排序。默认情况下，`sort`\
  \ 命令根据每行的第一个字母按字母顺序对内容排序。例如，`sort /etc/passwd` 命令将根据用户名对所有用户（包括与特定服务关联的用户）进行排序。\n\
  \n### grep\n\n`grep` 命令使用搜索术语来查找文件。它返回包含搜索术语的完整行。例如，`grep 'Michael Jang' /etc/passwd`\
  \ 在 `/etc/passwd` 文件中查找该用户的名字。\n\n你可以在 `grep` 命令中使用正则表达式。正则表达式提供了一种指定复杂搜索模式的强大方法。正则表达式内部某些具有特殊含义的字符如表\
  \ 2-7 所示。如果你想让元字符丢失其特殊含义并被视为字面量，请在它前面加一个反斜杠（`\\`）。\n\n表 2-7 正则表达式中的特殊字符\n\n![Images](img/f0071-01.jpg)\n\
  \n`grep` 命令支持一些实用的选项。要忽略大小写，可以将 `-i` 选项传递给命令。`-E` 选项启用扩展语法。另一个有趣的选项是 `-v`，它反转匹配逻辑——即告诉\
  \ `grep` 选择不匹配正则表达式的行。\n\n例如，假设你想从 `/nsswitch.conf` 中选择非空且不包含注释（即不以 # 字符开头）的行。可以通过运行以下命令来实现：\n\
  \n```\n# grep -v '^$' /nsswitch.conf | grep -v '#'\n```\n\n注意第一个 `grep` 命令选择了所有非空行（匹配空行的正则表达式是\
  \ `^$`——即行首紧接行尾）。然后，输出传递给第二个 `grep` 命令，它排除所有以井开头的行。\n\n可以使用单个 `grep` 配合 `-e` 选项获得相同的结果，它允许指定多个模式：\n\
  \n```\n# grep -v -e '^$' -e '#' /nsswitch.conf\n```\n\n关于正则表达式的更多信息，请输入 `man 7 regex`。\n\
  \n### diff\n\n查找文件差异的一个有用选项是 `diff` 命令。如果你刚刚使用了第 3 章中描述的网络管理器连接编辑器，它会修改 `/etc/NetworkManager/system-connections`\
  \ 目录下的 `eth0.nmconnection` 文件。\n\n如果你备份了该 `eth0.nmconnection` 文件，`diff` 命令可以识别两个文件之间的差异。例如，以下命令识别了\
  \ `/root` 和 `/etc/NetworkManager/system-connections` 目录下的 `eth0.nmconnection` 文件之间的差异：\n\
  \n![Images](img/f0072-03.jpg)\n\n`diff` 命令的 `-u` 选项代表“统一格式”。这种格式不仅显示文件之间的差异，还会显示周围几行作为上下文。这种上下文视图有助于更清晰地理解相邻内容的变化。\n\
  \n\n\n\n`sed` 命令是“stream editor”（流编辑器）的缩写，它允许你在文件中搜索并更改指定的单词甚至整个文本流。例如，以下命令会将 `opsys`\
  \ 文件的每行中第一个出现的“Windows”单词替换为“Linux”，并将结果写入 `newopsys` 文件中：\n\n```bash\n# sed 's/Windows/Linux/'\
  \ opsys > newopsys\n```\n\n然而，这可能还不够。如果 `opsys` 文件中的某行中出现了多个“Windows”，它将不会更改该单词的第二个实例。但你可以通过添加“global”（全局）后缀来修复这个问题：\n\
  \n```bash\n# sed 's/Windows/Linux/g' opsys > newopsys\n```\n\n接下来的示例将确保所有配置了 `writable\
  \ = yes` 指令的 Samba 共享都被反转：\n\n```bash\n# sed 's/writable = yes/writable = no/g'\
  \ /etc/samba/smb.conf > ~/smb.conf\n```\n\n当然，在覆盖原始的 `/etc/samba/smb.conf` 文件之前，你应该先检查\
  \ `/root/smb.conf` 文件中的结果。\n\n### Awk\n\n`awk` 命令以其开发者（Aho, Weinberger 和 Kernighan）命名，它与其说是一个命令，不如说是一个完整的编程语言。它可以识别包含关键词的行，并从该行的指定列读取文本。一个常见的例子是处理\
  \ `/etc/passwd` 文件。例如，以下命令将读取出所有包含“mike”列表的用户的 `/etc/passwd` 中的第四个字段（组 ID）：\n\n\
  ```bash\n# awk -F : '/mike/ {print $4}' /etc/passwd\n```\n\n### 在控制台中编辑文本文件\n\n\
  RHCSA 目标的原始版本指定了使用 `Vim` 编辑器。严格来说，使用哪种文本编辑器来编辑文本文件并不重要。然而，我们认为你需要知道如何使用 `Vim` 编辑器，而且显然大多数系统管理员也是赞同这一点的。`Vim`\
  \ 编辑器是“vi, improved”（改进版 vi）的缩写。安装后，可以使用 `vi` 命令启动 `Vim` 编辑器。此后，我们将该文本编辑器称为 `vi`。\n\
  \n我们认为每位管理员至少都需要具备 `vi` 的基础知识。虽然 `emacs` 也是一个有效选择，但 `vi` 可能会帮助你拯救损坏的系统。如果你必须使用紧急启动媒体恢复关键配置文件，`vi`\
  \ 可能是你唯一可用的编辑器。\n\n虽然 RHEL 9 也包含了对更直观的 `nano` 编辑器的访问权限，但对 `vi` 命令的了解可以帮助你更快速地搜索和编辑文本文件的关键部分。尽管\
  \ RHEL 启动媒体支持更多基于控制的编辑器，但 `vi` 是 Linux 上可用功能最丰富且效率最高的编辑器之一。\n\n你应该知道如何使用 `vi` 的两种基本模式：命令模式（command）和插入模式（insert）。当你使用\
  \ `vi` 打开一个文件时，它是以命令模式打开的。某些命令可以进入插入模式。打开文件很简单：只需使用 `vi *filename` 命令即可。\n\n以下是对\
  \ `vi` 编辑器的极简要介绍。有关更多信息，有几本关于该主题的书可用，你也可以通过 `vimtutor` 命令开始学习教程。\n\n#### vi 命令模式\n\
  \n在命令模式下，你可以对文本文件进行任何操作，除了编辑之外。命令模式下的选项广泛且多样，是许多专著性著作的主题。总之，`vi` 命令模式的选项分为七类：\n\n\
  *   **打开 (Open)**：要在命令行界面从 `vi` 编辑器打开文件，运行 `vi *filename` 命令。\n*   **搜索 (Search)**：进行向前搜索，以反斜杠\
  \ (`/`)开头，后跟搜索词。记住，Linux 是区分大小写的，所以如果你在 `/etc/passwd` 中搜索“Michael”，请使用 `/Michael`\
  \ 命令。对于反向搜索，以问号 (`?`) 开头。\n*   **关闭 (Close)**：退出 `vi`，使用 `:q` 命令。\n*   **放弃 (Abandon)**：如果你想放弃任何更改，使用\
  \ `:q!` 命令。\n*   **写入 (Write)**：保存你的更改，使用 `w` 命令。你可以组合命令；例如 `:wq` 会写入文件并退出 `vi`。\n\
  *   **编辑 (Edit)**：你可以使用多个命令通过 `vi` 编辑文件，例如 `x` 删除当前高亮的字符；`dw` 删除当前高亮的单词；以及 `dd`\
  \ 删除当前行。记住，`yy` 将当前行复制到缓冲区，`p` 将缓冲区中的文本放置出来，`u` 恢复到之前更改的文本。\n*   **插入 (Insert)**：许多命令允许你开始插入模式，包括\
  \ `i` 在编辑器的当前位置开始插入文本，以及 `o` 在光标当前位置下方立即打开新行。要退出插入模式，按 ESC 键。\n\n#### 基础文本编辑\n\n\
  在现代 Linux 系统中，使用 `vi` 编辑文件很容易。只需使用普通的导航键（方向键、PAGE UP 和 PAGE DOWN），然后使用如 `i` 或 `o`\
  \ 等基本命令之一启动 `vi` 的插入模式，并直接将你的更改输入到文件中。\n\n当你完成插入模式后，按 ESC 键返回命令模式。然后你就可以保存更改或放弃更改。\n\
  \n### 表 2：Vim 命令\n\n如果你觉得 Vim 太晦涩了，请输入 `vimtutor`。这是一个简短的交互式教程，大约需要 25 分钟完成。`vi`\
  \ 有几种变体：\n*   `vipw` 编辑 `/etc/passwd`\n*   `vigw` 编辑 `/etc/group`\n*   `visudo`\
  \ 编辑 `/etc/sudoers`\n\n### 练习 2-1：使用 vi 创建新用户\n\n在练习中，你将通过 `vi` 编辑器编辑 `/etc/passwd`\
  \ 创建新用户。虽然有其他创建新用户的方法，但此练习有助于验证你的命令行技能。\n\n1. 打开 Linux 命令行界面。以 root 用户登录并输入 `vipw`\
  \ 命令。该命令使用 `vi` 编辑器打开 `/etc/passwd`。\n2. 导航到文件末尾。在命令模式下有多种方法，包括 DOWN 方向键、PAGE DOWN\
  \ 键和 `G` 命令。\n3. 识别关联普通用户的行。如果你刚刚创建了用户，它应该是最后一行。如果还没有普通用户，识别第一行，它与 root 管理用户关联，且第三、四列为\
  \ 0。\n4. 创建该行的一个副本。如果你已经熟悉 `vi`，你应该知道可以使用 `yy` 命令将整行复制到缓冲区。这会将该行“提取”到缓冲区。然后你可以使用\
  \ `p` 命令多次恢复或插入该行。\n5. 更改新用户的用户名、用户 ID、组 ID、用户注释和主目录。有关每个条目的详细信息，请参阅第 6 章。例如，在以下内容中，这对应于\
  \ tweedle、1001、1001、Tweedle Dee 和 `/home/tweedle`。确保用户名也对应主目录。\n6. 按 ESC 键返回命令模式。使用\
  \ `:w` 命令保存文件，然后使用 `:q` 命令退出。（你可以在 vi 中组合这两个命令；下次你做出更改并想保存退出时，运行 `:wq` 命令。）\n7.\
  \ 你应该看到以下消息：该消息可以忽略，因为下一步将向 `/etc/shadow` 文件中添加适当的信息。然而，你不需要直接修改 `/etc/shadow`。\n\
  \n\n\n\n\n8. 作为 root 用户，运行 `passwd *newuser` 命令。为新用户分配你选择的密码。在本例中，新用户是 `tweedle`。\n\
  \n9. 该过程尚未完成；每个用户都需要一个组。为此，运行 `vigr` 命令。重复之前的步骤，从文件末尾附近复制适当的行。请注意，组名和组 ID 号（GID）通常与用户名和用户\
  \ ID 号（UID）相同。\n\n10. 对于新条目，你只需要更改组名和组 ID 号。根据上一个插图显示的信息，组名应为 `tweedle`，组号为 `1001`。\n\
  \n11. 重复上述 `:wq` 命令以关闭 `vi` 并保存更改。\n\n12. 注意以下消息：\n\n![Images](img/f0077-01.jpg)\n\
  \n13. 如建议所示的，运行 `vigr -s` 命令打开 `/etc/gshadow` 文件。你会发现该文件中的信息较少。一旦复制了适当的行，你只需要更改组名即可。\n\
  \n14. 重复上述 `:wq` 命令以关闭 `vi 并保存更改。实际上，你会收到一条消息提示文件是只读的。在这种情况下，你必须运行 `:wq!` 来写入此“只读”文件，覆盖当前设置。\n\
  \n15. 还需要额外的步骤来正确设置新用户，涉及该用户的家目录以及来自 `/etc/skel` 目录的标准文件。然而，如果你正确完成了此练习，你应该能够使用新用户名登录。有关用户的更多信息，请参阅第\
  \ 6 章。\n\n### 如果你不喜欢 vi\n\n如果你绝对讨厌 `vi`，可以使用 `nano`，这是一种轻量且友好的编辑器。默认情况下，当你运行 `edquota`\
  \ 和 `crontab` 等命令时，它们会使用 `vi` 编辑打开配置文件。要将系统命令使用的默认编辑器更改为 `nano`，请运行\n\n```bash\n\
  # export EDITOR=/bin/nano\n```\n\n要更改所有用户的默认编辑器，请将上述行添加到 `/etc/environment` 文件中：\n\
  \n```bash\n# echo 'export EDITOR=/bin/nano' >> /etc/environment\n```\n\n由于 `nano`\
  \ 编辑器非常直观，如图 2-6 所示，本书将不再提供相关指令。完整手册可以在 [`www.nano-editor.org`](https://www.nano-editor.org)\
  \ 获取。\n\n图 2-6 用 nano 编辑器打开的 /etc/nsswitch.conf 文件\n\n![Images](img/F02-06.jpg)\n\
  \n如果你倾向于使用不同的编辑器（例如 `emacs`），也可以进行类似的更改。\n\n### 在 GUI 中编辑文本文件\n\n毫无疑问，红帽考试对 GUI\
  \ 用户来说变得更加友好了。`gedit` 文本编辑器甚至短暂包含在 RHCSA 目标中。更传统的 Linux 管理员可能会对此感到震惊。（`gedit` 编辑器后来已从目标中删除。）\n\
  \n一旦安装了 `gedit`，你可以通过选择“活动 (Activities) | 显示应用程序 (Show Applications) | 文本编辑器 (Text\
  \ Editor)”启动启动。因为它是一个直观的 GUI 文本编辑器，所以使用起来非常简单。不要纠结于编辑器；它们在考试和现实生活中都只是工具。\n\n然而，如果你在远程系统上编辑配置文件，可能无法访问该系统上的\
  \ `gedit`，特别是当那里没有安装 GUI 的时候。你可以启动 `gedit` 并使用名为 X 转发 (X forwarding) 的功能将应用程序显示到本地机器的\
  \ GUI 上。但许多管理员在设置虚拟机时不会安装 GUI，以节省磁盘空间和系统资源。\n\n### 认证目标 2.05\n\n### 访问文档\n\n虽然红帽考试期间不允许访问互联网，但\
  \ RHEL 9 系统上安装了许多文档。它从 `man` 页开始，这些页记录了与大多数命令和许多配置文件相关的选项和设置。接着是 `info` 文档。虽然具有此类文档的命令和文件较少，但在可用时，它们提供了更多信息。\n\
  \n许多软件包在 `/usr/share/doc` 目录下包含详尽的文档。只需对该目录运行 `ls` 命令。那里的每个子目录都包含有关关联软件包功能的信息。\n\
  \n### 当你需要帮助时\n\n当我们需要关于某个命令的帮助时，通常执行的第一件事是单独运行它。如果需要更多信息，命令会提示请求更多信息，包括各种选项。例如，查看以下命令的输出：\n\
  \n```bash\n$ dnf\n```\n\n如果这种方法不起作用，通常可以通过 `-h` 或 `--help` 切换获得一定数量的帮助。有时错误会导致一些提示；以下命令的输出建议了\
  \ `cd` 命令的合法选项：\n\n![Images](img/f0079-02.jpg)\n\n有时 `-h` 切换更有用；查看 `fdisk -h` 命令的输出。但\
  \ `-h` 选项并不总是显示帮助信息；在这种情况下，`--help` 切换可能起到作用。参考图 2-7 示例，它显示了 `--help` 命令的输出。\n\n\
  图 2-7 ls 命令的帮助\n\n![Images](img/F02-07.jpg)\n\n### 多种 man 页\n\n很少有人能记住每一个命令。这就是为什么文档如此重要的原因之一。大多数\
  \ Linux 命令都以 man 页（帮助页）的格式编写文档。如果你单独运行 `man`，RHEL 会返回以下内容：\n\n```\nWhat manual page\
  \ do you want?\n```\n\n例如，假设你需要设置逻辑卷但忘记了切换参数。要浏览该命令的 man 页，请运行 `man lvextend`。与其他许多命令一样，它有一个\
  \ EXAMPLES（示例）部分，如图 2-8 所示。\n\n图 2-8 man 页中的示例\n\n![Images](img/F02-08.jpg)\n\n\
  大多数文件和命令都有此类 man 页。然而，可能更多。如果你不确定 man 页的名称怎么办？在这种情况下，`whatis` 和 `apropos` 命令可以帮助。例如，要查找标题中包含“nfs”的\
  \ man 页，运行以下命令：\n\n```bash\n# whatis nfs\n```\n\n如果你想找到描述中包含 nfs 的 man 页，以下命令可以识别相关内容：\n\
  \n```bash\n# apropos nfs\n```\n\n然而，如果你刚刚安装了如 Apache Web 服务器的 `httpd` 服务，`whatis\
  \ httpd` 和 `apropos apachectl` 命令可能无法提供任何信息。这些命令从 `/var/cache/man` 中的数据库工作。你可以通过启动\
  \ `man-db-cache-update` 服务来更新该数据库。以下命令更新 man 页数据库：\n\n```bash\n# mandb\n```\n\n\
  如果你在某些情况下（例如红帽考试期间）遇到相关的 man 页，至少有三个原因。关联的功能软件包可能未安装。名为 `man-pages` 的 RPM 包可能也未安装。在某些情况下，专门用于文档的软件包必须单独安装。例如，有一个\
  \ `httpd-manual` 软件包与 Apache Web 服务器分开安装。\n\n在某些情况下，存在多个 man 页。查看 `whatis smbpasswd`\
  \ 命令的输出：\n\n![Images](img/f0081-02.jpg)\n\n数字 (5) 和 (8) 对应 man 页的不同章节。如果你对细节感兴趣，可以在\
  \ `man man` 命令的输出查看。默认显示的 man 页是与 `smbpasswd` 命令相关的 man 页。在这种情况下，如果你想要 `smbpasswd`\
  \ 加密密码文件的 man 页，请运行以下命令：\n\n```bash\n$ man 5 smbpasswd\n```\n\n要退出 man 页，请按 **q**。\n\
  \n\n\n\n\n可用的 info 手册列表相当有限。然而，某些主题（例如 `bash` 壳）的涵盖范围通常比相应的 man 页（帮助页）更详尽。要查看 info\
  \ 文档的完整列表，请运行 `ls /usr/share/info` 命令。当没有 info 手册时，请求将默认指向相关的 man 页。\n\n要了解更多关于\
  \ `bash` 壳的信息，请运行 `pinfo bash` 命令。`pinfo` 具有类似于 Lynx 浏览器的用户界面，它是传统 `info` 命令更具友好的替代方案。如图\
  \ 2-9 所示，info 手册被组织成章节。要访问某个章节，请将光标移动到带有星号的条目并按回车。\n\n图 2-9 示例 info 手册\n\n![Images](img/F02-09.jpg)\n\
  \n要退出 info 页面，请按 `q`。\n\n## /usr/share/doc 中的详细文档\n\n`/usr/share/doc` 目录下的可用文档列表看起来非常丰富。但文档的质量取决于开发人员的工作。子目录包含已安装包的名称和版本号。某些子目录仅包含一个文件，通常命名为\
  \ `COPYING`，它指定了该软件发布时的许可。\n\n有时，文档目录包含实用的示例。例如，`sudo/` 子目录包含了用于管理控制的示例配置文件和指令，这在为具有不同权限的管理员配置权限时大有帮助。\n\
  \n文档可能包含 HTML 格式的完整手册。例如，如果你安装了 `pam-docs` 软件包，`pam/` 子目录包含了一份针对可插认证模块（PAM）系统的完整在线手册。\n\
  \n## 认证摘要\n\n本章的重点是基础命令行工具，这些工具以前与 Red Hat 考试的先决条件相关。现在这些先决条件已整合到 RHCSA 目标的主体。\n\
  \n命令行是壳（shell）的界面，是一个解释器允许你使用各种命令与操作系统进行交互。尽管目标中没有指定特定的壳，但大多数 Linux 发行版（包括 RHEL\
  \ 9）的默认壳是 `bash`。你可以在其中一个默认控制台或 GUI 中的终端中启动命令行提示符。\n\n在 `bash` 提示符下，你可以通过管理用于配置和组织\
  \ Linux 的文件和目录。Linux 配置文件主要采用文本格式，允许使用各种命令进行配置、搜索和修改。使用 `chown` 和 `chmod` 命令管理文件所有权权限至关重要，以确保适当的用户和组能够访问文件和目录。文本文件可以作为数据流进行解释和处理。要编辑文本文件，你需要如\
  \ Vim、`nano` 或 `gedit` 等文本编辑器。\n\nLinux 文档非常详尽。它从 `-h` 和 `--help` 等命令开关开始，这些开关提供了关于命令的提示。接着是\
  \ man 页和 info 页。许多软件包在 `/usr/share/info` 目录中包含大量的文档文件。在许多（可能也许大多数）情况下，你不需要访问即可找到所需的提示。\n\
  \n## ![Images](img/right-a.jpg) 两分钟训练\n\n以下是第 2 章认证目标中的一些关键点。\n\n### 壳 (Shells)\n\
