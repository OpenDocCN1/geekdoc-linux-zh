  \ 基于红帽企业 Linux。**\n\n如果我们要拆解 `podman run`，我们将首先使用 `podman create` 创建容器，然后使用 `podman\
  \ start` 运行它。例如：\n\n![Images](img/f0424-02.jpg)\n\n当你发出 `podman stop` 命令时，容器将停止运行但仍然存在于系统中。你可以使用\
  \ `podman start` 轻松地重新启动它。例如：\n\n![Images](img/f0424-03.jpg)\n\n最后，要从系统中永久删除容器，你将使用\
  \ `podman rm`。需要注意的是这将删除所有与容器关联的数据。例如：\n\n![Images](img/f0424-04.jpg)\n\n##### 容器检查命令\n\
  \n表 10-2 引入了一系列容器检查命令，这些对于理解我们容器的内部原理是不可少的。\n\n表 10-2 容器检查命令\n\n![Images](img/f0425-01.jpg)\n\
  \n首先是 `podman inspect`，这是一个多功能命令，用于提供有关容器的详细信息。这包括但不限于其 ID、创建时间、路径、参数、状态等许多内容。此命令将输出容器当前状态的\
  \ JSON 表示，让你对其配置和状态有有价值的见解。你可以在 图 10-10 中看到输出的片段。\n\n图 10-10 `podman inspect` 命令的输出片段\n\
  \n![Images](img/F10-10.jpg)\n\n接下来，`podman ps` 命令显示所有运行中的容器。你将看到容器 ID、镜像、命令、创建时间、状态和名称等细节。但如果你想查看所有容器而不只是运行中的容器呢？这时\
  \ `-a` 选项发挥作用。运行 `podman ps -a` 将列出运行和停止的容器，提供所有容器的概述。\n\n最后，`podman logs` 是容器工具箱中必不可少的工具。它获取指定容器的日志，这在诊断问题时可能关关。例如，请参见\
  \ 图 10-11。\n\n图 10-11 `podman logs` 命令的输出\n\n![Images](img/F10-11.jpg)\n\n这些命令共同成了容器检查的基础，并为容器操作提供了有价值的见解。它们在调试问题或理解容器行为时可能是至关重要的。\n\
  \n##### 镜像管理命令\n\n表 10-3 回顾了各种镜像管理命令。这些命令是创建、检索、命名和删除容器镜像的本质工具。\n\n表 10-3 镜像管理命令\n\
  \n![Images](img/f0427-01.jpg)\n\n首先，让我们回顾一下 `podman build` 命令，它在“构建容器镜像：入门”节介绍过。该命令用于从\
  \ Containerfile（或 Dockerfile）构建容器镜像。例如，如果你在当前目录下有一个 Containerfile，你可以运行以下命令创建一个名为\
  \ my-image 的镜像：\n\n```\n$ podman build -t my-image.\n```\n\n`-t` 选项允许你为镜像打标签，而点\
  \ (.) 则表示构建上下文为当前目录。\n\n\n\n\n\n`podman tag`、`podman push` 和 `podman pull` 这三个命令对于在本地和远程存储库之间管理镜像至关重要。`podman\
  \ tag` 用于为现有镜像分配标签或另一个名称，提供了一种引用镜像的方便方法。例如，接下来的命令为镜像 `my-image` 标记了 `v1.0` 的版本标识：\n\
  \n```bash\n$ podman tag my-image:latest my-image:v1.0\n```\n\n接下来，`podman push`\
  \ 命令允许你将镜像从本地机器推送到远程仓库。如果你已经为镜像标记了 `my-image:v1.0`，可以通过运行以下命令将其推送到如 Quay.io 的仓库：\n\
  \n```bash\n$ podman push quay.io/username/my-image:v1.0\n```\n\n并将 “username” 替换为你的\
  \ Quay.io 用户名。请注意，在像 Quay.io 这样需要认证的私有仓库中，你需要先使用 `podman login` 命令进行登录。\n\n相比之下，`podman\
  \ pull` 命令用于从远程仓库获取镜像到你的本地机器。例如，以下命令将从 Red Hat 仓库拉取最新的 `nginx-122` 镜像：\n\n```bash\n\
  $ podman pull registry.access.redhat.com/ubi9/nginx-122\n```\n\n最后，`podman rmi`\
  \ 命令用于从本地存储中删除镜像。如果你完成了对镜像的操作，或者需要清理存储，`podman rmi my-image:v1.0` 将移除指定的镜像。保持镜像存储整洁是一个良好的习惯，移除不需要的镜像以节省空间。\n\
  \n### 镜像检查命令\n\n在接下来的讨论中，我们将根据表 10-4 概述的内容，回顾本章早些时候讨论的一些镜像检查命令。这些命令的目标是为你提供有关系统中存在的容器镜像的详尽信息。\n\
  \n#### 表 10-4 镜像检查命令\n\n![Images](img/f0428-01.jpg)\n\n与 Podman 工作时最基础但本质的命令之一是\
  \ `podman images`。它提供了存储在系统本地上的所有容器镜像的概览。它显示的信息包括仓库名称、镜像标签、镜像 ID、创建时间以及镜像大小。例如，如果你运行\
  \ `podman images`，你将看到一个包含你在机器上下载或构建的所有镜像详情的表格，如图 10-12 所示。\n\n#### 图 10-12 podman\
  \ images 显示的本地容器镜像列表\n\n![Images](img/F10-12.jpg)\n\n接下来是 `podman inspect` 命令。虽然此命令功能多变，既适用于容器也适用于镜像，但它在镜像上的用法提供了关于特定镜像的丰富细节。如果你运行\
  \ `podman inspect <image-name>`，其中 `image-name` 是镜像的名称（或 ID），你将看到包含镜像详细信息的 JSON\
  \ 输出，包括其 ID、配置和层等。\n\n有趣的地方在于：`podman inspect` 命令与之前在“镜像存储库”节中介绍的 `skopeo inspect`\
  \ 命令不同。区别在于 `skopeo inspect` 可以直接从远程仓库获取信息，而 `podman inspect` 仅检查已下载到系统上的镜像。例如，以下命令从\
  \ Red Hat 仓库检索 `nginx` 镜像的元数据，而无需下载镜像本身：\n\n```bash\n$ skopeo inspect docker://registry.access.redhat.com/ubi9/nginx\n\
  ```\n\n最后，`podman search` 命令允许你直接在终端搜索容器存储库上的镜像。`podman search <search-term>` 命令将返回所有名称匹配搜索词的镜像列表，并带有简要描述以及如果有的话星级评分。当你寻找特定镜像或探索特定服务的可用选项时，这是一个非常有用的工具。例如，`podman\
  \ search ubi9` 将从默认仓库返回可用的 Red Hat Universal Base Image 9 列表。\n\n#### 杂命令\n\n最后，我们深入研究一组命令，这些命令虽然不能完美归入我们之前的类别，但在管理容器方面提供了独特且实用的工具。这些杂命令在表\
  \ 10-5 中概述。\n\n#### 表 10-5 杂命令\n\n![Images](img/f0430-01.jpg)\n\n让我们从 `podman attach`\
  \ 和 `podman exec` 命令开始。虽然两者都用于与运行中的容器交互，但它们有显著差异。`podman attach` 命令连接到运行中容器的主进程，允许你像直接登录一样与其交互。例如，如果你使用\
  \ `podman run -d my-container` 以离线模式启动了容器，你可以通过 `podman attach my-container`（或使用容器\
  \ ID 而不是名称）附加它。\n\n另一方面，`podman exec` 在已运行的容器内执行新进程。这对于在容器内运行特定命令或脚本而不中断其主进程非常有用。例如，以下命令将列出你运行中容器的根目录（`/`）的内容：\n\
  \n```bash\n$ podman exec my-container ls /\n```\n\n与所有的 Podman 命令一样，你可以灵活地使用名称或容器\
  \ ID。接下来是 `podman cp`，该命令类似于 Linux 中熟悉的 `cp` 命令，允许你在主机和容器之间拷贝文件或目录。例如，要将文件从主机拷贝到运行中的容器，你将使用接下来的命令：\n\
  \n```bash\n$ podman cp /host/file.txt my-container:/container/path/\n```\n\n要进行反向操作，只需交换源和目的地即可。\n\
  \n`podman generate` 命令列在表 10-5 中，稍后详细介绍。\n\n最后，我们有 `podman info` 和 `podman version`\
  \ 命令。`podman info` 提供了 Podman 安装的全面概览，包括配置细节以及存储、存储库的状态。另一方面，`podman version` 仅返回你安装的\
  \ Podman 版本。这些命令在故障排除或验证你的设置时特别有用。\n\n#### 将容器作为 systemD 服务运行\n\n让我们深入研究将容器作为 systemd\
  \ 服务运行的过程，这对于需要跨重启持久的容器（例如 Web 服务器或数据库容器）非常有用。\n\n在第 5 章中，你学习了如何使用 `systemctl` 命令启用和管理服务。Podman\
  \ 扩展了这一功能，允许你使用 `podman generate systemd` 命令为容器服务创建 systemd 配置文件。\n\n假设我们有一个运行中的\
  \ Web 服务器容器，如前面的章节“运行你的第一个容器”所述，通过以下命令启动：\n\n![Images](img/f0430-02.jpg)\n\n在这里，`podman\
  \ generate systemd` 命令可以获取此运行中的容器并将其作为蓝图创建一个服务配置文件。这里示示例：\n\n```bash\n$ podman generate\
  \ systemd --name webserver --new\n```\n\n该命令将输出运行该容器作为服务所需的 systemd 配置文件，如图 10-13\
  \ 所示。通过使用 `--files` 选项，它将创建配置文件而不是输出到控制台。如果容器是以非特权用户运行，则需要将此文件移动到 `~/.config/systemd/user`\
  \ 目录。如果以 root 运行，它应该进入 `/etc/systemd/system`。\n\n#### 图 10-13 由 podman generate\
  \ systemd 生成的 systemd 单元配置\n\n![Images](img/F10-13.jpg)\n\n考试考点\n\n\n\n\n如果你觉得这一节的细节让你压力很大，`man\
  \ podman-generate-systemd` 命令在 RHCSA 考试期间将是一个非常有帮助的资源。\n\n观察图 10-13，systemd 服务被命名为\
  \ `container-webserver.service`。默认情况下，`podman generate systemd` 会在容器名称前加上“container-”以形成\
  \ systemd 单元名称，除非使用 `--container-prefix` 选项指定了不同的前缀。\n\n一旦配置文件就绪，你可以使用以下命令启动服务并检查其状态：\n\
  \n![Images](img/f0431-02.jpg)\n\n让我们简要分析一下此处 `--user` 选项的作用。它指定我们正在管理当前用户的服务，而不是系统级服务。\n\
  \n为了确保服务在启动系统时自动运行，请执行以下命令：\n\n![Images](img/f0432-01.jpg)\n\n如果你以普通用户身份运行 systemd\
  \ 服务，则需要额外的步骤。如果不执行这一步，你的容器可能会在你退出 SSH 会话后不久就会停止。为了防止这种情况并保持你的用户 systemd 服务持续运行，请运行以下命令：\n\
  \n![Images](img/f0432-02.jpg)\n\n如果容器以 root 身份运行，则不需要此步骤。\n\n为了更好地理解并实践本节中解释的概念，请进行练习\
  \ 10-3。\n\n## 练习 10-3\n\n#### 将容器作为服务运行\n\n在此练习中，你将学习将容器作为 systemd 服务运行的实际步骤，使用你之前在“运行你的第一个容器”节中设置的\
  \ Web 服务器容器。\n\n1. 以普通用户身份登录。为了管理 systemd 用户服务，重要的是直接登录，不要使用 `su` 或 `sudo` 命令来创建会话。\n\
  2. 执行以下命令启动 Apache Web 服务器（之前在“运行你的第一个容器”节中讨论过）：\n\n![Images](img/f0432-03.jpg)\n\
  \n如果你之前创建过此容器且它目前处于停止状态，你可以使用 `podman start` 命令让它重新运行。\n3. 检查容器是否正在活动运行：\n\n```\n\
  $ podman ps\n```\n4. 使用 `podman generate systemd` 命令为你你正在运行的 Web 服务器容器创建一个 systemd\
  \ 服务配置文件：\n\n```\n$ podman generate systemd --name webserver --new –files\n```\n\
  5. 将配置文件拷贝到 `~/.config/systemd/user` 目录；如果该目录不存在，则创建它：\n\n![Images](img/f0433-01.jpg)\n\
  6. 停止并删除活动中的容器：\n\n![Images](img/f0433-02.jpg)\n7. 重新加载 systemd 以其识别新的单元文件：\n\n\
  ![Images](img/f0433-03.jpg)\n8. 启动容器服务并设置为在启动启动时自动启用：\n\n![Images](img/f0433-04.jpg)\n\
  \n或者，以下命令可以一次完成这两项任务：\n\n![Images](img/f0433-05.jpg)\n9. 为了确保你的用户账户 systemd 服务在系统启动时启动，请运行：\n\
  \n![Images](img/f0433-06.jpg)\n10. 重启你的系统：\n\n![Images](img/f0433-07.jpg)\n11. 验证你的容器是否正在运行以及\
  \ Web 服务器是否可以访问：\n\n![Images](img/f0433-08.jpg)\n12. 最后，进行工作：\n\n![Images](img/f0433-09.jpg)\n\
  \n作为额外挑战，尝试以 root 用户身份进行此练习。这里的区别在于 `systemctl` 命令不需要 `--user` 选项，且不需要运行 `loginctl\
  \ enable-linger`。此外，systemd 配置文件应该移动到 `/etc/systemd/system` 而不是 `~/.config/systemd/user`\
  \ 目录。\n\n## 持久存储\n\n容器中的存储通常被描述为“临时性的”（ephemeral），意味着它是临时的，一旦容器被删除，其内容将不会保留。容器化应用的本质是，它们的操作假设总是以干净的存储状态启动。\n\
  \n让我们在容器镜像的背景下分解几个术语：\n\n![Images](img/square.jpg) *Ephemeral*（临时性）意味着临时的。对容器的任何更改（如添加文件或修改配置）除非这些更改被写入持久卷，否则一旦容器被删除将会丢失。\n\
  \n![Images](img/square.jpg) *Immutable*（不可变）意味着基于该镜像的容器将始终以镜像创建时的确切状态启动。\n\n![Images](img/square.jpg)\
  \ *Layered*（分层）意味着镜像的每次更改都会创建一个新层。这些层堆叠在一起，每层只包含来自上一层的更改。这种分层方法优化了存储，简化了更新和回滚，并加快了容器的启动速度。\n\
  \n虽然容器在临时和不可变存储的假设下运行，但在某些情况下需要持久存储。例如，数据库和其他数据密集型应用需要超出单个容器实例生命期的存储。当多个容器需要访问相同数据，或者数据必须在更新和重启之间保留时，也需要持久存储。\n\
  \nPodman 通过允许在运行的容器内部挂载主机目录提供了这一解决方案。容器化应用程序将这些主机目录视为容器存储的组成部分，类似于普通应用程序将远程网络卷视为整体。与容器的临时存储不同，在容器停止后，这些主机目录的内容仍然保持完整，以便挂载到新的容器。\n\
  \n让我们通过例子来说明。假设你想将主机上的 `~/app` 目录连接到名为 `my-container` 的容器的 `/app` 目录。为了实现这一点，你使用以下命令创建容器：\n\
  \n![Images](img/f0434-01.jpg)\n\n在此命令中，`-v` 选项启用卷挂载，实际上是将主机目录（在本例中为 `~/app`）链接到内部（`/app`）。结尾的\
  \ `Z` 指令 SELinux 对目录应用适当的文件上下文（container_file_t）。\n\n## 练习 10-4\n\n#### 将持久存储附加到容器\n\
  \n这个动手练习将引导你完成一个将持久存储附加容器的实用示例。\n\n1. 以普通用户身份登录你的 Linux 系统。\n2. 准备要挂载到容器的主机目录。创建一个名为\
  \ `~/html` 的目录：\n\n```\n$ mkdir ~/html\n```\n3. 进入 ~/html 目录并创建一个包含简单内容的文件。例如，使用以下\
  \ `echo` 命令创建一个包含“Welcome to our webserver!”消息的 `index.html` 文件：\n\n```\n$ echo\
  \ \"Welcome to our webserver\" > ~/html/index.html\n```\n4. 准备好目录和文件后，现在可以创建并启动容器了。在这里，我们将把本地主机的\
  \ `~/html` 目录挂载到容器内的 `/var/www/html` 目录。运行以下命令：\n\n![Images](img/f0435-03.jpg)\n\
  5. 创建并启动容器后，确保它正在活动运行：\n\n```\n$ podman ps\n```\n6. 接下来，验证你的网页是否正确显示。使用 `curl` 命令获取网页内容：\n\
  \n```\n$ curl http://localhost:8080\n```\n你应该能看到“Welcome to our webserver”消息。\n\
  7. 尝试更改主机上 ~/html 目录的权限。修改权限使其仅供你的用户访问。\n\n\n\n\n\n```\n$ chmod 700 ~/html\n```\n\
  \n8. 如果你现在尝试访问该网页，将会遇到一个权限错误。通过再次运行以下命令来验证这一点：\n\n```bash\n$ curl http://localhost:8080\n\
  ```\n\n9. 要纠正此问题，你需要调整目录权限以使其能够再次被访问。你可以通过将权限设回 755 来实现这一点：\n\n```bash\n$ chmod\
  \ 755 ~/html\n```\n\n10. 最后，是时候清理练习环境了：\n\n![Images](img/f0436-02.jpg)\n\n## 认证总结\n\
  \n本章深入探讨了容器这一变革性的世界。容器是一项创新的技术发展，已成为现代 DevOps 和云基础设施生态系统的基石。\n\n你可以将容器想象成安全的、相互隔离的“箱子”，它们封装了应用程序，其功能类似于虚拟机。然而，这种比较仅止于此。容器比虚拟机轻量得多，因为它们的运行不需要独立的操作系统。它们依赖并共享运行其所在的宿主机的操作系统。这种独特的特性允许容器使用更少的资源，因此它们可以快速地启动和终止操作。\n\
  \n在 RHEL 9 中，Podman 是管理容器的优选工具。Podman 操作的核心是 `podman run` 命令，它用于创建一个新容器。该命令可以使用许多子命令和选项进行自定义，以适应各种场景。\n\
  \n容器的起源于镜像（image），它类似于一个指定了结构和内容的蓝图。这些镜像充当模板，容器据此进行构建。它们被存储在被称为“注册表”（registries）的专用存储位置，随时准备在需要创建容器时被拉取和使用。\n\
  \n此外，镜像还可以使用 `Containerfile` 进行身定制。`Containerfile` 是一个文本文件，包含了用户可以在命令行上调用的用于组装镜像的所有命令。从\
  \ `Containerfile` 构建镜像开启了创建个性化容器的可能性，并可以根据特定需求进行微调。\n\nPodman 提供了一套全面的命令来管理和检查容器及镜像，使其可用性远超仅仅的创建。一些常用命令包括用于创建容器的\
  \ `podman create`、用于启动容器的 `podman start`、用于检查容器详情的 `podman inspect` 以及用于在远程注册表中搜索镜像的\
  \ `podman search`。然而，这只是冰山一角，还有更多命令等待探索。\n\nPodman 的显著特性之一是可以将容器作为 systemd 服务运行，并在系统启动时自动启动。`podman\
  \ generate systemd` 命令可以根据运行中的容器生成 systemd 服务配置文件，从而将容器无缝集成到由 systemd 驱动的系统中。\n\n\
  尽管容器功能强大，但重要的是记住容器在本质上是瞬态的（ephemeral）。它们的内容不会在生命周期之外继续存在。然而，Podman 提供了一种跨越容器生命周期来持久化数据的机制。可以使用\
  \ `podman run` 的 `-v` 将宿主机目录挂载到容器内部。\n\n\n\n\n\n## 7. 如果 Containerfile 位于当前目录，构建容器镜像并将其标签标记为\
  \ `dbserver` 的命令是什么？\n\n## 8. Containerfile 中的 `CMD` 和 `ENTRYPOINT` 指令之间有何区别？\n\n\
  ## 9. `skopeo inspect` 命令的作用是什么？\n\n### 管理容器\n\n### 10. 如何为名为 `ftpserver` 的运行中容器生成将其作为\
  \ systemd 服务运行的配置？对于无根（rootless）容器，单元配置文件（unit configuration file）应该放在哪里？\n\n###\
  \ 11. 如何确保由 `container-ftpserver.service` 的 systemd 单元管理的无根容器被配置为在引导启动时自动启动？\n\n\
  ### 12. 在容器镜像的语境下，“ephemeral（瞬时的）”、“immutable（不可变的）”和“layered（分层的）”这些术语含义什么？\n\n\
  ## 实验问题\n\nRed Hat 提供电子化考试。因此，本章的实验可以在随书的配套网站上获取。如果您尚未在系统中设置 RHEL 9，请参考第 1 章的安装说明。每个实验的答案将紧随填空题的自我测试答案之后。\n\
  \n#### 自我测试答案\n\n##### 容器技术基础\n\n### 1. 虚拟机和容器都是虚拟化的形式，但它们在功能和资源利用率上有所不同。虚拟机是完全隔离的，并拥有自己的操作系统，因此更消耗资源。相比之下，容器共享主机的操作系统内核，使得它们更轻量，启动和停止速度更快。因此，容器具有高度的可移植性，并为大多数用例提供了足够的隔离性，使得它们在现代软件开发中（特别是\
  \ DevOps 和云计算领域）非常流行。\n\n### 2. 容器架构由几个 Linux 特性组成，旨在提供进程和资源隔离，并结合标准的容器镜像和高效的容器仓库使用。Linux\
  \ 特性包括控制系统资源可见性的命名空间（namespaces）、管理系统资源分配的控制组（cgroups）以及增加强效安全机制的 SELinux。容器镜像作为容器的蓝图，将软件应用程序、依赖项以及某些配置细节封装到单一对象中。\n\
  \n### 3. 由 Red Hat 开发的 Podman 通过提供无守护进程（daemonless）和无根（rootless）的容器引擎，解决了 Docker\
  \ 的一些安全和设计问题。Docker 需要一个持续运行的高特权守护进程来管理容器，而 Podman 将容器和容器化服务作为子进程启动，增强了安全性并减小了攻击面。Podman\
  \ 的无根功能还允许非特权用户管理容器，进一步提升了安全性。\n\n##### 入门容器\n\n### 4. RHEL 9 中的 `container-tools`\
  \ 元软件包被用作安装一组相关包的方便方法，它本身不包含任何工具。与元包一同提供的关键命令包括 `podman`（无守护进程容器引擎）、一个名为 `docker`\
  \ 的脚本（模拟执行 Podman 命令的 Docker CLI）、`Skopeo`（用于容器镜像和仓库操作的命令行实用）以及 `Buildah`（用于构建 OCI\
  \ 容器镜像的工具）。\n\n### 5. 使用 Podman 运行容器涉及使用 `podman run` 命令。`-d` 标志指定分离模式，允许容器在后台运行，而不占用您当前的终端或\
  \ shell 会话。`-p` 标志暴露容器的特定端口使其可以访问。例如，`-p 80:8080` 指示 Podman 在主机上开启 80 端口，并将该端口的所有进入流量路由到容器内部的\
  \ 8080 端口。\n\n### 6. 无根容器由非特权用户运行，而有根（rootful）容器由特权用户运行。非 root 用户运行的无根容器提供了更受限和控制的环境，因此对主机系统的风险较小。它们通常因为更高的安全性而受到青睐。相反，由\
  \ root 用户运行的有根容器具有广泛的能力。例如，它们可以绑定到低于 1024 的网络端口。\n\n##### 构建和使用容器镜像\n\n### 7. 如果\
  \ Containerfile 位于当前目录，构建容器镜像并将其标签标记为 `dbserver` 的命令所示：\n\n```bash\n$ podman build\
  \ -t dbserver .\n```\n\n### 8. `CMD` 指令指定默认命令，当通过 `podman run` 启动容器时执行其参数。`ENTRYPOINT`\
  \ 指令设置容器启动时始终执行的命令，但可以通过 `podman run` 进行覆盖。这种覆盖也可以被覆盖，但需要提供 `--entrypoint` 标志。\n\
  \n### 9. `skopeo inspect` 命令提供关于详细详细信息。这对于评估是否符合要求至关重要。例如，以下命令提供了 `httpd-24` 镜像的信息：\n\
  \n```bash\n$ skopeo inspect registry.access.redhat.com/ubi9/httpd-24\n```\n\n#####\
  \ 管理容器\n\n### 10. 您可以使用以下命令为名为 `ftpserver` 的容器生成将其作为 systemd 服务运行的配置：\n\n```bash\n\
  $ podman generate systemd --name ftpserver --files\n```\n\n单元配置文件必须复制到 `~/.config/systemd/user`\
  \ 目录。\n\n### 11. 为了确保由 `container-ftpserver.service` 的 systemd 单元管理的无根容器在引导启动时自动启动，必须运行以下命令：\n\
  \n![Images](img/f0441-04.jpg)\n\n### 12. 在容器镜像语境下，“ephemeral（瞬时的）”意味着临时；对容器进行的任何更改将会丢失，除非这些更改写入了持久化卷。“immutable（不可变的）”意味着镜像一旦创建就不会更改。基于该镜像的任何容器都将以创建时的精确状态启动。“layered（分层的）”意味着镜像的每次更改都会创建一个新层，每层仅包含上上一层的更改。这种方法优化了存储，简化了更新和回滚，并加快了容器启动速度。\n\
  \n## 实验答案\n\n### 实验 1\n\nBusyBox 是执行各种工具或作为其他容器基础的重要镜像。\n\n**1.** 通过以下命令搜索镜像：\n\n\
  ```bash\n$ podman search busybox\n```\n\n**2.** 找到镜像后，使用以下命令拉取：\n\n```bash\n$ podman\
  \ pull docker.io/library/busybox\n```\n\n**3.** 要验证镜像的大小（其应小于 5MB 以证明其轻量级），请执行：\n\
  \n```bash\n$ podman images\n```\n\n**4.** 尝试使用 busybox 镜像以分离模式运行容器会导致容器立即终止：\n\n\
  ```bash\n$ podman run -d --name busybox busybox\n```\n\n**5.** 您可以使用 `podman ps`\
  \ 命令验证这种现象。第一个命令将不会显示 busybox 容器，因为它没有运行；而随后的命令带有 `-a` 选项将显示所有容器，包括停止状态的容器：\n\n\
  ```bash\n$ podman ps\n$ podman ps -a\n```\n\n\n\n\n![Images](img/f0442-05.jpg)\n\
  \n### 6. 通过删除当前容器并创建一个运行 `/bin/sh` shell 的新容器来继续：\n\n![Images](img/f0442-06.jpg)\n\
  \n### 7. 在此 shell 中，你可以执行 `ls /bin` 命令来探索镜像内可用的命令。请记住，此命令是在容器环境中执行的。你可以通过输入 `exit`\
  \ 退出此交互式 shell。\n\n### 8. 到最后一个任务，启动一个运行 ping 到 [www.google.com](http://www.google.com)\
  \ 的容器：\n\n```bash\npodman run busybox ping -c 5 www.google.com\n```\n\n### 实验 2\n\
  \n在本次活动中，你需要构建一个 Python 镜像，该镜像运行一个在被 ping 时返回“pong”的简单服务。\n\n#### 1. 使用此命令搜索 Python\
  \ 3.9 镜像：\n\n```bash\n$ podman search python-39\n```\n这将向你显示可使用的 Red Hat UBI 9 Python\
