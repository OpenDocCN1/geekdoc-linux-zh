  \n\n\n\n如前所述，磁盘分区提供了优秀的图形化前端。`GParted` 和 `QtParted` 选项基于 `parted`，分别为 GNOME 和 KDE\
  \ 桌面环境设计。由于它们无法从 Red Hat 网络（Red Hat Network）获取，因此不受到 Red Hat 的支持，并且不会出现在任何 Red Hat\
  \ 考试中。\n\nRHEL 9 可用的另一种图形化选项简单称为“磁盘实用程序”（Disk Utility），通过 `gnome-disk-utility` 软件包提供。一旦安装了相应的软件包，您可以使用\
