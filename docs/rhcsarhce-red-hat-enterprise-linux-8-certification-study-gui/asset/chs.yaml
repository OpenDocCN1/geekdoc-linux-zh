  \ RHEL 9 DVD）：\n\n![Images](img/f0141-05.jpg)\n8. 输入以下命令检查 `tmux` 软件包是否安装。在典型的 Red\
  \ Hat 安装中，你应该会发现该软件包不存在。\n\n![Images](img/f0141-06.jpg)\n9. 安装 `tmux` RPM 软件包：\n\
