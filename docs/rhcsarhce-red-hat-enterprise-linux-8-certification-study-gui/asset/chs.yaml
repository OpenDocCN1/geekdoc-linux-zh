  \ root 运行的容器，不需要 `loginctl enable-linger` 命令。\n\n### 实验 4\n\n本实验深入研究了容器化应用中临时存储和持久化存储的动态机制。理解这两种存储类型之间的区别至关重要，因为直接影响容器内数据的行为和寿命。临时存储（Ephemeral\
  \ storage）正如其名，是临时的，不会随着容器的重建而存在；而持久化存储（Persistent storage）则允许数据在单个容器生命周期之外生存。\n\
