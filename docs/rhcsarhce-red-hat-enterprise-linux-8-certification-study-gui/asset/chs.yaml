  \ `/dev/sdc` 上创建一个新的 500MiB 分区 (`n`) 的使用步骤：\n\n![Images](img/f0265-02.jpg)\n\n与\
  \ `fdisk` 一样，`gdisk` 工具在您输入写入 (`w`) 命令之前，不会将更改写入磁盘。在任何时候，您都可以使用退出 (`q`) 命令退出实用程序，而不保存任何更改。\n\
  \n## 使用 parted 工具\n\n`parted` 命令包含在 GNU `parted` 中，并正变得越来越流行。它是由自由软件基金开发的一个优秀工具。与\
  \ `fdisk` 一样，你可以使用它来创建、检查和销毁分区，但它还能完成更多。你还可以用它来调整分区大小、复制分区以及其中包含的文件系统。它是多个基于 GUI\
  \ 的分区管理工具的基础，包括 GParted 和 QtParted。更多信息请参阅 [www.gnu.org/software/parted](http://www.gnu.org/software/parted)。\n\
  \n![Images](img/job.jpg)\n\n在某些情况下，使用 `parted` 工具可能比使用 `fdisk` 危险。例如，本书的作者之一意外地在现有\
  \ RHEL 系统上从 (parted) 提示符运行了 `mklabel` 命令。它删除了所有现有分区。更改在 `parted` 运行时立即被写入了。幸运的是，该虚拟系统的备份，可以很顺利地恢复它。\n\
  \n在我们讨论 `parted` 期间，我们将逐节进行，假设 `parted` 仍然打开并显示以下提示符：\n\n```\n(parted)\n```\n\n\
