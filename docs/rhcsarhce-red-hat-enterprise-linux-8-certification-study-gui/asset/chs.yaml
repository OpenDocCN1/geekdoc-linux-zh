  \n### 从 RHEL 9 DVD 创建 dnf 仓库\n\n此练习需要访问 RHEL 9 DVD。你将使用在第 1 章中安装的 `tester1.example.com`\
  \ 系统。由于该系统未订阅 Red Hat 服务管理（如果已订阅，请运行 `subscription-manager unregister`），你将创建一个 `dnf`\
  \ 仓库，从 RHEL 9 DVD 本地安装软件包。\n\n1. 在 VMWare Workstation（或你的托管虚拟机）中，选择你的 `tester1`\
  \ 虚拟机并点击“设置”。\n2. 挂载你在第 1 章中下载的 RHEL 9 ISO 文件。在“设置”窗口选择 CD/DVD (SATA) 并点击“使用 ISO\
  \ 镜像”。浏览并选择 RHEL 9 ISO 镜像的路径。确保选中了“已连接”（Connected）选项。\n3. 登录系统并输入 `df` 命令。如果 DVD\
  \ 已自动挂载，你应该能在 `df` 输出中看到一个项，显示 DVD 位于 `/run/media/*yourusername*/RHEL-9-1-0-BaseOS-x86_64`\
  \ 等目录路径。如果由于原因没有看到 DVD 挂载，你可以通过以下命令（作为 root）手动挂载它：\n\n```bash\n# mount /dev/cdrom\
  \ /media\n```\n在此练习中，我们假设 DVD 已挂载到 `/run/media/*yourusername*/RHEL-9-1-0-BaseOS-x86_64`。如果情况如此，请相应调整你的命令。\n\
  4. 导航到 `/etc/yum.repos.d` 目录。\n5. 在文本编辑器中创建一个新文件并将其命名（例如）`rhel9.repo`。\n6. 编辑 `rhel9.repo`\
  \ 文件。创建一个新的指令节。使用适当的节标题，例如 `[rhel]`。\n7. 将 BaseOS 指定为仓库的 `name` 指令。\n8. 包含 `baseurl`\
  \ 指令，设置为 `file:///run/media/*yourusername*/RHEL-9-1-0-BaseOS-x86_64/BaseOS/`。\n\
  9. 包含 `enabled=1` 指令。\n10. 添加 `gpgkey=0`。\n11. 保存并关闭文件。\n12. 运行 `dnf clean all`\
  \ 和 `dnf update` 命令。\n13. 接下来，尝试以下命令：\n\n```bash\n# dnf install tmux\n```\n14. 如果成功，你将看到以下输出：\n\
  \n![Images](img/f0153-03.jpg)\n你现在已经在本地 DVD 上设置了仓库。\n15. 通过删除 `/etc/yum.repos.d`\
  \ 目录下的 `rhel9.repo` 文件来恢复原始配置。\n\n## 第三方仓库\n\n其他第三方开发者组为 RHEL 9 创建了软件包。它们包含了了一些\
  \ Red Hat 不支持的流行软件的软件包。其中一个第三方的网站可以在 [`docs.fedoraproject.org/en-US/epel/`](https://docs.fedoraproject.org/en-US/epel/)\
  \ 找到。\n\n要在系统中添加第三方仓库，你需要在 `/etc/yum.repos.d` 目录下创建一个自定义的 `.repo` 文件。\n\n某些仓库（例如\
  \ EPEL，企业 Linux 额外软件包）通过提供包含 `.repo` 配置和用于验证软件包的 GPG 密钥的 RPM 包来简化配置。要配置该仓库，你只需要安装该\
  \ RPM 文件即可：\n\n![Images](img/f0154-01.jpg)\n\n如果你想禁用 `/etc/yum.repos.d` 目录中的任何仓库，请向相应的仓库文件添加以下指令：\n\
  \n![Images](img/f0154-02.jpg)\n\n## 练习 4-4\n\n### 配置 EPEL 仓库的访问\n\n在此练习中，你将配置对 EPEL\
  \ 仓库的访问。与其像刚才那样安装 `epel-release-latest-9.noarch.rpm` 软件包，不如手动配置仓库。这将为你练习配置仓库提供一个绝佳的机会。\n\
  \n1. 登录 `server1.example.com` 系统。\n2. 运行以下命令：\n\n![Images](img/f0154-03.jpg)\n3.\
  \ 该命令在 `/etc/yum.repos.d/` 目录下创建了一个名为 `epel.repo` 的文件。\n4. 安装来自 EPEL 仓库的 `calc`\
  \ RPM 软件包：\n\n![Images](img/f0154-04.jpg)\n\n## 基础 dnf 命令\n\n如果你想了解更多关于 `dnf` 命令，可以使用以下命令：\n\
  \n![Images](img/f0154-02.jpg)\n\n如果你想了解更多关于 `dnf` 命令，可以使用以下命令：\n\n![Images](img/f0154-03.jpg)\n\
  \n如果你想了解更多关于 `dnf` 命令，可以使用以下命令：\n\n![Images](img/f0154-04.jpg)\n\n\n\n\n另一种，要搜索所有带有\
  \ `.repo` 扩展的文件实例，请运行以下命令：\n\n```bash\n# dnf provides \"*/*.repo\"\n```\n\n它会列出所有带有\
  \ `.repo` 扩展的文件的软件包实例以及相关的 RPM 软件包。之所以需要通配符，是因为 `provides` 选项需要文件的完整路径。它接受部分文件名；例如，`dnf\
  \ provides \"/etc/systemd/*\"` 命令会返回与 `/etc/systemd` 目录下的文件相关的 RPM 软件包。一旦确定了所需的软件包，就可以继续使用\
  \ `dnf install *packagename` 命令。\n\n![Images](img/job.jpg)\n\n在许多情况下，`dnf` 的问题可以通过\
  \ `dnf clean all` 命令来解决。如果 Red Hat 软件包（或第三方存储库）有最近更新，该命令会刷新当前的元数据缓存，允许你与配置的存储库同步元数据，而无需等待默认的\
  \ 24 小时让缓存自动刷新。\n\n## 安全性与 dnf\n\nGPG 数字签名可以验证 `dnf` 更新的完整性和真实性。这与本章之前描述的 RPM 软件包系统是相同的。例如，看看在\
  \ RHEL 9 上通过网络安装新软件包时的首次输出：\n\n```bash\n# dnf install samba\n```\n\n软件包下载后，你将看到类似下所示的消息：\n\
  \n![Images](img/f0157-02.jpg)\n\n如果你同时从其他存储库下载软件包，可能会呈现出额外的 GPG 密钥等待确认。如最后一行所示，`N`\
  \ 是默认响应；你实际上必须输入 `y` 才能继续下载和安装——不仅是针对 GPG 密钥，还针对涉及的软件包。\n\n你可能会注意到，使用的 GPG 密钥来自本章之前与\
  \ `rpm` 命令相关的同一个密钥目录。\n\n## 更新与安全修复\n\nRed Hat 在 [`access.redhat.com/errata-search/`](https://access.redhat.com/errata-search/)\
  \ 维护了一份公共的误差（errata，错误更正/更新公告）列表，并按 RHEL 发布版本进行分类。如果你有 RHEL 订阅，受影响的软件包通常通过 Red Hat\
  \ Portal 提供；对于连接到 RHSM 的机器，你只需要定期运行 `dnf update` 命令。此列表对于那些使用 RHEL 源代码的第三方（如 AlmaLinux\
  \ 甚至 Oracle Linux）非常有用；通常 RHEL 的重新构建会在 Red Hat 之后不久提供类似的误差公告。\n\n## 软件包组与 dnf\n\n\
  `dnf` 命令还可以完成更多。它可以按组安装和删除软件包。通过以下命令，你可以从配置的存储库中识别可用软件包组：\n\n```bash\n# dnf group\
  \ list\n```\n\n注意组是如何分为已安装组和可用组的。列出的某些组可能特别受关注，例如“虚拟化主机”（Virtualization Host），它会安装\
  \ KVM 虚拟机程序。要了解更多关于该组的信息，请运行以下命令。输出见图 4-8。\n\n图 4-8 虚拟化主机组中的软件包\n\n![Images](img/F04-08.jpg)\n\
  \n```bash\n# dnf group info \"Virtualization Host\"\n```\n\n`dnf` 中有两种组：普通组（包含标准\
  \ RPM 软件包）和由其他组组成的环境组。图 4-8 中的“虚拟化主机”被识别为“环境组”，实际上它是普通组的集合。\n\n要列出所有组，你可以输入\n\n\
  ```bash\n# dnf group list hidden\n```\n\n让我们获取有关其中一个普通组的信息：\n\n```bash\n# dnf group\
  \ info \"Remote Desktop Clients\"\n```\n\n注意所有软件包是如何被列为“可选软件包”（Optional Packages）的，如图\
  \ 4-9 所示。\n\n图 4-9 远程桌面客户端组中的软件包\n\n![Images](img/F04-09.jpg)\n\n句话说，它们通常不会随着软件包组一起安装。因此，假设你运行了以下命令：\n\
  \n```bash\n# dnf group install \"Remote Desktop Clients\"\n```\n\n没有任何东西被安装。此软件包组中的可选软件包可以使用以下命令选项安装：\n\
  \n```bash\n# dnf group install --with-optional \"Remote Desktop Clients\"\n```\n\
  \n但可选软件包不是唯一的类别。以下命令列出了“打印客户端”（Printing Client）软件包组中的所有软件包。输出见图 4-10。\n\n图 4-10\
  \ 打印客户端组中的软件包\n\n![Images](img/F04-10.jpg)\n\n```bash\n# dnf group info \"Printing\
  \ Client\"\n```\n\n打印客户端组中的软件包被分为另外两类。强制软件包（Mandatory packages）始终随软件包组安装。默认软件包（Default\
  \ packages）通常随软件包组安装；但此组中的特定软件包可以使用 `-x` 开关排除。例如，以下命令安装了三个强制软件包和七个默认软件包：\n\n```bash\n\
  # dnf group install \"Printing Client\"\n```\n\n相比之下，以下命令从待安装列表中排除了 `paps` 和 `gutenprint-cups`\
  \ 软件包：\n\n```bash\n# dnf group install \"Printing Client\" -x paps -x gutenprint-cups\n\
  ```\n\n如果没有一个可以反转该过程的命令，`dnf` 命令的选项是不完整的。如名称所示，`dnf group remove` 命令可以卸载软件包组：\n\n\
  ```bash\n# dnf group remove \"Printing Client\"\n```\n\n`dnf group remove` 命令无法排除。\n\
  \n## 更多 dnf 命令\n\n许多额外的 `dnf` 相关命令均可用。其中两个对于准备 Red Hat 考试的人可能特别感兴趣：`dnf config-manager`\
  \ 和 `dnf download` 分别显示所有配置设置和下载单个 RPM 包。另一个相关命令是 `createrepo`，它可以帮助你建立本地仓库。\n\n\
  ### 使用 dnf config-manager 查看所有指令\n\n在某种程度上，`dnf.conf` 中列出的指令仅可用指令的快照。要查看完整的指令列表，运行\
  \ `dnf config-manager --dump` 命令。通过管道交给 `less` 命令分页。它包含了近 100 行。图 4-11 所示的 `[main]`\
  \ 部分包含了适用于所有配置存储库的设置。\n\n图 4-11 dnf 指令的部分列表\n\n![Images](img/F04-11.jpg)\n\n某些指令没有默认值，例如\
  \ `exclude`；某些并不紧要，例如颜色指令。一些最重要的指令见表 4-5。这不是一个完整的列表。如果你对未显示的指令感兴趣，它在 `dnf.conf`\
  \ 文件的帮助页中有定义。\n\n表 4-5 来自 yum-config-manager 的配置参数\n\n![Images](img/f0161-01.jpg)\n\
  \n### 使用 dnf 下载软件包\n\n正如名称所示，`dnf download` 命令可以从 `yum` 类的存储库下载软件包。这是一个非常简单的命令。例如，以下命令检查配置存储库中是否存在名为\
  \ `cups` 的软件包：\n\n```bash\n# dnf download cups\n```\n\n要么 RPM 软件包下载到本地目录，要么命令返回以下错误消息：\n\
  \n```\nNo package cups available.\n```\n\n有时需要更具体的指定。如果存储库中存储了多个版本的软件包，默认下载该软件包的最新版本。这并不总是你想要的。例如，如果你想使用特定版本的\
  \ RHEL 9 内核，可以使用以下命令：\n\n```bash\n# dnf download kernel-5.14.0-284.11.1.el9_2\n\
  ```\n\n### 使用 createrepo 创建自己的仓库\n\n\n\n\nRHEL 6 考试目标的早期版本建议你应该了解如何“创建私有 yum 仓库”。尽管该目标后来已被移除，但对于红帽系统工程师来说，这是一项必要的工作技能。\n\
  \n自定义仓库可以提供额外的控制。希望控制其 Linux 系统上安装的软件包的企业可以创建自己的自定义仓库。虽然这些仓库可以基于为发行版开发的标准仓库，但它们也可以包含额外的软件包，例如组织特有的自定义软件。同样容易地，它们也可以省略可能违反组织策略（如游戏）的软件包。对某些功能（如浏览器）的选择限制可以减少相关的支持需求。\n\
  \n要创建一个自定义仓库，你需要在特定目录中收集所需的软件包。`createrepo` 命令可以处理该目录下的所有软件包。数据库会在 `repodata/` 子目录的\
  \ XML 文件中创建。这种软件包数据库的示例已存在 RHEL 9 DVD 的 `BaseOS/repodata/` 子目录中。\n\n红帽门户（Red Hat\
  \ Portal）通过相关产品支持自定义仓库，例如 Red Hat Satellite Server。有关仓库管理的更多信息，请参阅 Michael Jang\
  \ 编写、Prentice Hall 出版的 *Linux Patch Management*。\n\n### 认证目标 4.04\n\n### 模块流（Module\
  \ Streams）\n\n假设你需要安装一个服务或应用程序运行时（例如 Apache、Perl 或 NodeJS），并且你需要该软件的特定版本。通过 `rpm`\
  \ 或 `dnf`，你可以在命令行中指定想要安装的软件包的精确版本。假设该版本在你的软件仓库可用，那么一切都能正常工作，直到你运行 `dnf update`。如果该软件包有更新的主版本可用怎么办？软件包管理器会自动将其更新到最新版本。\n\
  \n这时*模块化（modularity）*就派上用场了。通过模块流，供应商可以发布同一个应用程序的多个版本，系统管理员可以在安装软件时锁定到特定版本。\n\n\
  例如，假设你需要安装 NodeJS 18。截至本文编写，RHEL 9 软件仓库包含了 NodeJS 16 和 NodeJS 18。像 `dnf install\
  \ nodejs` 这样的命令将安装版本 16。你可以指定要安装的软件包精确版本，例如 `dnf install nodejs-16.`，但当你下次运行 `dnf\
  \ update` 时，如果有新的主版本，NodeJS 可能会升级到新的主版本，这并不是你想要的。\n\n**注意：请注意，本节内容不会出现在考试中，但包含有用信息。**\n\
  \n幸运的是，红帽将 NodeJS 18 作为模块流发布。这样，你可以锁定到所需的版本并仍然获得该版本的补丁，但在运行 `dnf update` 时，永远不会升级到最新的主版本。\n\
  \n一些经验丰富的读者可能已经注意到，模块流试图解决 RHEL 7 中软件集合（software collections）解决解决的问题。事实上，软件集合提供了分发多个相同应用程序版本并安装在单独根树中的能力。然而，模块流之间有一个主要区别：软件集合允许*并发*安装同一个应用程序的多个版本，而模块流只允许在系统中安装一个版本的应用程序。\n\
  \n#### 获取有关模块流的信息\n\n正如本章之前描述，RHEL 9 带有两个仓库：`BaseOS` 和 `AppStream`。虽然 `BaseOS` 包含核心操作系统，但\
  \ `AppStream` 包含用户级应用程序。RHEL 9 引入了 `dnf` 命令来管理模块。要熟悉模块，请列出所有模块：\n\n```\ndnf module\
  \ list\n```\n\n输出显示：\n\n| Name | Stream | Status | Description |\n| :--- | :---\
  \ | :--- | :--- |\n| BaseOS | 40 | enabled | Core operating system |\n| AppStream\
  \ | 40 | enabled | User-level applications |\n| nodejs | 16 | disabled | Node.js\
  \ |\n| nodejs | 18 | disabled | Node.js |\n\n要查看特定模块的信息，使用：\n\n```bash\ndnf module\
  \ info nodejs\n```\n\n要查看模块可用的流，使用：\n\n```bash\ndnf module list nodejs\n```\n\n\
  #### 安装和删除模块流\n\n要安装一个流，必须先启用相应的模块流。可以通过运行以下命令完成：\n\n```bash\ndnf module enable\
  \ nodejs:18\n```\n\n接下来，安装模块：\n\n```bash\ndnf install nodejs\n```\n\n然而，`dnf module\
  \ install` 命令会自动启用模块，因此你可以用以下命令替换之前的两个命令：\n\n```bash\ndnf install nodejs:18\n```\n\
  \n可选，你可以使用此语法指定配置文件（例如，`minimal` 配置文件）：\n\n```bash\ndnf install nodejs:18/minimal\n\
  ```\n\n删除模块需要一条命令：\n\n```bash\ndnf module remove nodejs:18\n```\n\n接下来，你可以“重置”流，这会禁用该流并将配置重置为默认：\n\
  \n```bash\ndnf module reset nodejs\n```\n\n## 认证总结\n\n本章重点关注 RPM 软件包的管理。通过不同的命令选项，你还了解了\
  \ `rpm` 工具如何安装、删除和升级软件包，以及它如何在本地和远程环境中工作。当出现新版本的内核时，重要的一点是永远不要用 `rpm` 替换现有的内核。正确配置的后版本内核安装不会覆盖现有内核，而是将内核并列放置。随后，你就可以启动到任何一个内核了。\n\
  \n通过 `rpm` 命令，你还学习了如何查询软件包、检查文件属于哪个软件包、验证软件包签名以及查找当前已安装 RPM 的列表。你还看到了与依赖关系相关的困难，这些困难驱动了用户转向\
  \ `dnf` 命令。\n\n`dnf` 命令比 `rpm` 命令强大得多。当存在依赖关系时，它同时安装这些软件包。你学习了如何配置红帽和其他仓库以与 `dnf`\
  \ 命令配合。现在你应该能够配置自己的仓库，并使用 `subscription-manager` 命令将系统订阅到红帽门户。\n\n\n\n\n\n模块流（Module\
  \ streams）提供了一种分发相同应用程序多个版本的方法并在安装时锁定到特定的发布版本。`dnf module` 命令可列出、安装和卸载模块流。\n\n##\
  \ ![Images](img/right-a.jpg) 两分钟演练\n\n以下是第 4 章中认证目标中的一些关键点。\n\n### RPM 包管理器\n\n\
  ![Images](img/squ1.jpg) RPM 数据库跟踪软件包中每个文件的位置、其版本号等更多信息。\n\n![Images](img/squ1.jpg)\
  \ `rpm -i` 命令安装 RPM 包。\n\n![Images](img/squ1.jpg) `rpm -e` 命令卸载 RPM 包。\n\n![Images](img/squ1.jpg)\
  \ `rpm` 命令甚至可以直接从远程服务器安装 RPM 包。\n\n![Images](img/squ1.jpg) 通过 `/etc/pki/rpm-gpg`\
  \ 目录下的 GPG 密钥支持 RPM 包验证。\n\n![Images](img/squ1.jpg) 内核 RPM 应该始终安装，而绝不升级。\n\n![Images](img/squ1.jpg)\
  \ RPM 的升级模式用新版本的软件包替换旧版本的软件包。\n\n## 更多 RPM 命令\n\n![Images](img/squ1.jpg) `rpm -q`\
