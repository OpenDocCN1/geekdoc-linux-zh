  \ 安装说明。每个实验的答案紧随自测答案之后。\n\n## 自测答案\n\n### 存储管理与分区\n\n**1.** 列出所有已连接硬盘上配置分区的 `fdisk`\
  \ 命令选项是 `fdisk -l`。\n\n**2.** 创建交换分区后，你可以使用 `mkswap *devicename` 和 `swapon *devicename`\
  \ 命令来初始化并激活该卷；只需替换与卷相关的设备文件（例如 `/dev/sda1`）。\n\n### 文件系统格式\n\n**3.** 像 XFS 这样的日志文件系统的主要优势是数据恢复更快。\n\
