  \ 并以 root 用户身份打开终端。\n9. 运行 `fdisk -l /dev/nvme0n2` 命令查看 `/dev/nvme0n2` 驱动器的当前状态（如果你的第一个硬盘具有不同的设备名称，请替换为正确的名称，例如\
