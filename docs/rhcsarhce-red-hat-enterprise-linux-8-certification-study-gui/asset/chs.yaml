  ## mount 命令\n\n`mount` 命令可将本地和网络分区挂载到指定的目录。挂载点不是固定的；如果设置了适当的所有权和权限，你可以将 CD 驱动器甚至共享网络目录挂载到任何空目录。与之密切相关的是\
  \ `umount`（注意不是 unmount）命令，用于从关联的目录中卸载选定的卷。\n\n首先，尝试运行 `mount` 命令。它将显示所有当前挂载的文件系统以及重要的挂载选项。例如，以下输出表明\
  \ `/dev/mapper/rhel-root` 卷已以读写模式挂载在顶层根目录下，并格式化为 xfs 文件系统：\n\n![Images](img/f0291-03.jpg)\n\
