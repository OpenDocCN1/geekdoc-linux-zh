  \n问答自测测试\n\n### 考试内容\n\n**理解启动过程**\n\n与启动过程相关的目标已整合到 RHCSA 中。与启动过程最基本的技能可能是理解启动和停止过程的命令，例如\
  \ `systemctl poweroff` 和 `systemctl reboot`。\n\n在本章中，你将介绍 systemd 目标（targets），它们取代了传统的级别（runlevels）。从标准的\
  \ RHEL 9 菜单，你需要知道如何\n\n![Images](img/square.jpg)\n\n此外，你必须知道如何自动启动到不同的“目标”，例如非图形多用户模式或\
  \ GUI 桌面：\n\n![Images](img/square.jpg)\n\n由于 Linux 是一种网络操作系统，而且大多数用户在没有网络服务的情况下无法进行很多事情，因此了解如何非常重要\n\
  \n![Images](img/square.jpg)\n\n你还将学习如何修改系统启动引导程序。\n\n**网络时间服务**\n\n本章涵盖了使用 NTP 同步时间的客户端配置。相应的考试目标是\n\
  \n![Images](img/square.jpg)\n\n\n\n\n\n当计算机启动时，首先启动的是 `BIOS/UEFI` 固件。根据存储在稳定只读存储器中的设置，`BIOS/UEFI`\
  \ 系统会执行一系列诊断程序，以检测并连接 `CPU` 和关键控制器。这被称为开机自检（POST）。如果在在此过程中听到哔哔声，可能存在硬件问题，例如连接不当的磁盘驱动器。随后，`BIOS/UEFI`\
  \ 系统会寻找显卡等连接的设备。在检测到图形硬件后，你可能会看到一个类似于图 5-1 的屏幕，它显示了已检测、测试并验证的其它硬件。\n\n图 5-1 BIOS\
  \ 初始化菜单\n\n![Images](img/F05-01.jpg)\n\n如果你的系统具有受 UEFI` 菜单，它可能包含一个受可信平台模块（TPM）。尽管\
  \ `TPM` 技术是为了增强系统安全性设计的，但由于隐私和供应商锁定问题，它在开源社区中引起了争议。许多开源专业人士通过欧盟的开放可信计算（OpenTC）小组工作，尽可能减少此类问题。`RHEL\
  \ 9` 可以利用 `TPM` 硬件特性来增强系统安全性。\n\n完成后，`BIOS/UEFI` 将控制权移交给启动设备，通常是第一块驱动器。`GRUB 2`\
  \ 启动加载程序的第一阶段通常被复制到 `MBR` 或 `GPT` 中。它作为指向 `GRUB 2` 菜单其他信息的指针。此时，你应该能看到引导程序屏幕。\n\n\
  ### 启动菜单\n\n通常，访问 `BIOS/UEFI` 固件菜单的原因之一是从不同的介质（如 CD 或 USB 闪盘）启动。在许多情况下，你可以跳过此过程。\n\
  \n有时，在 POST 之后你只能看到空白屏幕。`BIOS/UEFI` 通常配置为这种方式。在这种情况下，你可能根据经验猜测如何访问启动或 `BIOS` 菜单。\n\
  \n在许多情况下，可以通过按下 `ESC`、`DEL`、`F1`、`F2` 或 `F12` 等键直接访问启动菜单。此类启动菜单可能包含类似下面的条目：\n\n\
  ![Images](img/f0176-01.jpg)\n\n从该菜单或类似菜单中，你应该能够使用 `ARROW` 和 `ENTER` 键选择所需的启动设备。\n\
  \n## Linux 启动加载程序\n\n如第 1 章所示，标准的 Linux 启动加载程序是 `GRUB 2`，它的第一部分（称为阶段 1）安装在默认驱动器的\
  \ `MBR` 或 `GUID` 表中。通常，`BIOS` 应该自动启动加载程序，并显示类似以下的消息：\n\n![Images](img/f0176-02.jpg)\n\
  \n如果你在五秒结束前按下任意键，`GRUB 2` 将呈现一个类似于图 5-2 所示的菜单。\n\n图 5-2 `GRUB 2` 菜单\n\n![Images](img/F05-02.jpg)\n\
  \n如果系统包含多个 Linux 内核或多个操作系统，可能会有多个可用选项，你可以使用 `UP ARROW` 和 `DOWN ARROW` 键高亮它们。要从高亮选项启动\
  \ Linux，请按 `ENTER`。\n\n在旧的 PC（21 世纪以前）上，某些 `BIOSes` 无法找到你的加载程序，除非它位于硬盘的前 1024 个柱面内。出于由于原因，配置\
  \ `/boot` 目录的分区通常是第一个可用的主分区。\n\n`RHEL 9` 支持传统的 `MBR` 分区布局和较新的 `GPT` 格式。虽然 `MBR`\
  \ 分区方案支持每个磁盘最大 2TB，但 `GPT` 没有此种限制。然而，要从具有 `GPT` 分区布局的磁盘启动 `RHEL`，你需要一个具有 `UEFI`\
  \ 固件接口而非传统 `BIOS` 固件的系统。你应该向硬件供应商确认系统是否支持 `UEFI`。\n\n### 认证目标 5.02\n\n### 启动加载程序和\
  \ GRUB 2\n\n与 Red Hat Enterprise Linux 关联的标准启动加载程序是 `GRUB 2`，即“大统一启动加载程序第 2 版本”。正如红帽考试要求的建议，对于\
  \ `RHCSA` 考试，你需要知道如何使用 `GRUB 2` 菜单启动到不同的目标，并诊断和纠正由加载程序错误引起的启动失败。在 `RHEL 6` 默认的 `GRUB`\
  \ 版本 1 中，相关的配置文件相对容易理解和自定义。然而，尽管 `GRUB 2` 菜单与在 `RHEL 6` 中看到的相似，但配置该加载程序所需的步骤非常不同，正如你将在在本章后面看到的那样。\n\
  \n#### GRUB，大统一启动加载程序\n\n红帽已将 `GRUB 2` 实现为其 Linux 发行版的唯一启动加载程序。它通常被配置为启动到配置好的默认内核。`GRUB\
  \ 2` 在 `/boot` 目录中查找配置并显示菜单，该菜单看起来类似于图 5-2。你可以使用 `GRUB 2` 菜单启动在 Linux 安装过程中检测到的任何操作系统，或任何添加到适当配置文件中的其他操作系统。\n\
  \n`GRUB 2` 是灵活的。配置不仅可以从 `CLI` 轻松生成，还可以直接从图 5-2 所示的菜单进行编辑。这种方法。本节将重点关注进入不同的 `systemd`\
  \ 目标。\n\n##### 进入紧急 Shell\n\n要通过 `GRUB 2` 向内核传递参数，请在菜单处按 `E`。定位到 `linux` 指令开头的行。如有必要，使用\
  \ `DOWN ARROW` 键向下滚动。你可能会看到类似的配置：\n\n![Images](img/f178-01.jpg)\n\n这很多内容，将在本章解释。对于\
  \ `RHCSA` 考试，重要的是理解如何在行尾添加内核参数。例如，如果你在行尾添加 `systemd.unit=emergency.target` 并按 `CTRL-X`，Linux\
  \ 将以紧急目标模式运行。从紧急目标，输入 root 密码然后输入 `exit`。系统将进入默认目标，通常是多用户目标或图形目标。如果你对任何分区进行了更改或修复，下一步是使用\
  \ `systemctl reboot` 命令重启计算机。在红帽考试的某些阶段，你应该通过重启来测试你的更改。\n\n![Images](img/job.jpg)\n\
  \n在 RHEL 9 上，`shutdown`、`reboot` 和 `halt` 命令是 `systemctl` 的符号链接。它们分别具有 `systemctl\
  \ poweroff`、`systemctl reboot` 和 `systemctl halt` 命令的效果。\n\n![Images](img/exam.jpg)\n\
  \n更改在 `RHCSA` 考试期间必须在重启后仍然有效，因此你可能至少重启系统一次，以验证重启后符合每个要求。\n\n在某种程度上，`systemd` 目标的概念与旧版\
  \ Linux 发行版的运行级别（runlevels）相似，将在本章详细介绍。现在，你只需要知道当 RHEL 9 被配置为启动到 GUI 时，它默认启动到图形目标。可以通过在内核命令行末尾附加\
  \ `systemd.unit.*name*.target` 字符串来更改该目标。\n\n\n\n\n紧急和救援目标（targets）需要 root 密码才能登录并获取完整的\
  \ root 管理员权限。如果你丢失了 root 密码，则需要在内核命令行末尾添加字符串 `rd.break`，并按照后续练习 5-2 所示的步骤进行操作。由于这提供了完整的管理员权限（包括更改\
  \ root 管理员密码），你可能希望对 GRUB 2 菜单设置密码保护。任何能够更改启动顺序的人都可以通过启动 USB 盘来实现同样的操作，因此，保护你的 BIOS\
  \ 或 UEFI 固件同样重要，以确保系统仅从本地磁盘启动且无需密码。然而，这超出了 RHCSA 考试的范围。\n\n现在，你应该已经了在启动过程中如何进入不同的启动目标。表\
  \ 5-1 总结了目前为止描述的启动选项。\n\n### 表 5-1 如何启动紧急 Shell\n\n![Images](img/f0179-01.jpg)\n\
  \n![Images](img/exam.jpg)\n\n**红帽考试是“闭卷”的。虽然你被允许使用在 RHEL 安装中可以找到的所有文档，但在恢复或紧急程序期间，你可能无法访问\
  \ man 页面或其他文档资源。因此，在不借助任何文档的情况下练习本章的练习是极其重要的。你应该记住进入紧急 shell 或恢复 root 密码的步骤；否则，你可能会遇到麻烦，不仅是在\
  \ RHCSA 考试期间，在现实生活中执行 Linux 系统管理员的工作职责时也是如此。**\n\n### 练习 5-1\n\n#### 进入不同的目标\n\n\
  其中一项关键技能是知道如何进入不同的 systemd 目标。本练习假设你已经按照第 1 章 配置了 RHEL 9，该配置将图形界面目标（graphical target）设置为默认目标。运行\
  \ `ls -l /etc/systemd/system/default.target` 命令进行验证。如果当前系统反映了默认值，此文件应该是 `/usr/lib/systemd/system`\
  \ 目录内 `graphical.target` 文件的符号链接。或者，运行以下命令：\n\n```bash\n# systemctl get-default\n\
  ```\n\n它应该返回字符串“graphical.target”。现在你可以开始练习了。\n\n1. 使用 `reboot` 命令重启系统。\n2. 当你看到以下消息时，确保按任意键以进入\
  \ GRUB 2 菜单：\n   `The selected entry will be started automatically in 5s.`\n3. 按\
  \ `E` 编辑当前的菜单项。\n4. 使用向下方向键向下滚动，找到以 `linux` 开头的行。首先，删除内核选项 `rhgb quiet`。然后，在行末尾输入\
  \ `systemd.unit=multi-user.target` 并按 CTRL-X 启动此内核。\n5. 观察启动信息。你看到了什么种登录界面？\n6.\
  \ 登录此系统。你可以使用任何现有的用户账户。\n7. 运行 `reboot` 命令重启此系统。\n8. 重复步骤 2 到 4，但通过向内核传递选项 `systemd.unit=rescue.target`\
  \ 将此系统引导到救援目标（rescue target）。\n9. 观察启动信息。你看到了什么种登录界面？哪些文件系统被挂载了？\n10. 重复步骤 2 到 4，但通过向内核传递选项\
  \ `systemd.unit=emergency.target` 将此系统引导到紧急目标（emergency target）。\n11. 观察启动信息。你看到了什么种登录界面？你必须登录吗？哪些文件系统被挂载了？\n\
  12. 重复步骤 2 到 4，但这次在内核命令行末尾附加 `rd.break`。\n13. 观察启动信息。你看到了什么种登录界面？你必须登录吗？root 文件系统是否是从硬盘挂载的？\n\
  14. 输入 `reboot` 注销并重启系统。\n\n### 练习 5-2\n\n#### 恢复 root 密码\n\n如果你将 RHEL 9 系统引导到救援目标或紧急目标，系统会提示你输入\
  \ root 密码。但如果你忘记了密码怎么办？本练习展示了重置 root 用户丢失密码所需的步骤。在密码恢复过程中，你很可能无法访问文档。因此，你应该练习以下步骤，直到你完全准备好在危机中使用它：\n\
  \n1. 使用以下命令将 root 密码更改为随机字符串。该命令会向你隐藏随机密码：\n   ```bash\n   # openssl rand -base64\
  \ 15 | passwd --stdin root\n   ```\n2. 退出会话。尝试再次以 root 用户身份登录。你不应该能够使用旧的已知 root\
  \ 密码登录系统。\n3. 重启服务器。\n4. 当你看到以下消息时，按任意键进入 GRUB 2 菜单：\n   `The selected entry will\
  \ be started automatically in 5s.`\n5. 按 `E` 编辑当前的菜单项。\n6. 使用向下方向键向下滚动，找到以 `linux`\
  \ 开头的行。按 END 移动到行尾，然后输入字符串 `rd.break`。\n7. 按 CTRL-X 启动系统。\n8. 观察启动信息。你看到了什么种登录界面？你必须登录吗？root\
  \ 文件系统是否是从硬盘挂载的？\n9. 将 `/sysroot` 重新挂载为读写并更改 root 密码：\n   ```bash\n   mount -o remount,rw\
  \ /sysroot\n   ```\n10. 进入 `/sysroot` 目录：\n    ```bash\n    chroot /sysroot\n  \
  \  ```\n11. 更改 root 密码：\n    ```bash\n    # passwd\n    ```\n12. 因为 SELinux 未运行，通过以下命令在下次启动时重新标记所有文件：\n\
  \    ```bash\n    touch /.autorelabel\n    ```\n13. 输入 `exit` 退出 chroot 环境，然后再次输入\
  \ `exit` 重启系统。\n\n#### 修改引导程序\n\nRHCSA 特别要求你需要知道如何“修改系统引导”。这意味着你需要详细了解配置 GRUB 2。配置位于\
  \ `/etc/grub.cfg` 文件，对于 BIOS 的 系统，它是指向 `/boot/grub2/grub.cfg` 的符号链接；对于使用 UEFI 引导器的服务器，它是\
  \ `/boot/efi/EFI/redhat/grub.cfg`。查看图 5-3 以 grub.cfg 的摘录。在本章剩余部分，我们假设你使用的是传统的 BIOS\
  \ 系统。我们将 `/boot/grub2/grub.cfg` 作为配置的标准路径。\n\n图 5-3 grub.cfg 的摘录\n\n![Images](img/F05-03.jpg)\n\
  \n虽然 grub.cfg 文件中的选项和指令数量可能看起来让人压力很大，但不要恐慌。你不需要直接碰这个文件。正确的方法是使用 `grub2-mkconfig`\
  \ 工具根据 `/etc/default/grub` 配置文件和 `/etc/grub.d/` 目录中的脚本生成该文件的新版本。`/etc/default/grub`\
  \ 文件比 grub.cfg 易于理解、更安全且更方便编辑。一旦你修改了 `/etc/default/grub`，通过运行以下命令生成新的 GRUB 配置文件：\n\
  \n以下是典型版本的 /etc/default/grub 文件的详细分析：\n\n![Images](img/f0183-02.jpg)\n\n![Images](img/job.jpg)\n\
  \n**不要手动编辑 /boot/grub2/grub.cfg 文件。使用** grub2-mkconfig **和 /etc/default/grub 文件对\
  \ grub.cfg 进行修改。**\n\n\n\n在第一行，`GRUB_TIMEOUT` 变量指定了 GRUB 2 自动启动默认操作系统之前的等待时间（秒）。你可以通过按下键盘上的任意键来中断倒计时。如果此变量设置为\
  \ 0，GRUB 2 将不会显示可启动内核列表，除非你在 BIOS 初始屏幕期间按住一个字母数字键。\n\n`GRUB_DISTRIBUTOR` 变量的值在标准\
  \ RHEL 安装中返回“Red Hat Enterprise Linux”，并显示在每个内核可启动条目之前。如果你愿意，可以将此项修改为你选择的任何字符串。\n\
  \n下一个变量是 `GRUB_DEFAULT`，它与 GRUB 2 在启动时加载的默认内核有关。值“saved”指示 GRUB 2 查看 `/boot/grub2/grubenv`\
  \ 文件中的 `saved_entry` 变量。每当安装新内核时，该变量都会更新为最新内核的名称。\n\n你可以通过 `grub2-set-default` 命令更新\
  \ `saved_entry` 变量，并指示 GRUB 2 启动不同的默认内核。例如，\n\n```\n# grub2-set-default 1\n```\n\
  \n将第二个菜单条目设置为默认内核。这可能会让人有些困惑，因为 GRUB 2 从 0 开始计数。因此，`grub2-set-default 0` 指向第一个可用菜单。同样，命令\
  \ `grub2-set-default 1` 指向第二个内核条目，依此类推。\n\n`/etc/default/grub` 中的下一行配置定义了变量 `GRUB_DISABLE_SUBMENU`。该变量默认设置为“true”，以在启动时禁用任何子菜单条目。紧随其后的是变量\
  \ `GRUB_TERMINAL_OUTPUT`，它告诉 GRUB 2 使用文本控制台作为默认输出终端。文件中定义的两个变量是 `GRUB_DISABLE_RECOVERY`（它禁用恢复菜单条目的生成）和\
  \ `GRUB_ENABLE_BLSCFG`（它告诉 GRUB 2 使用一种特殊的文件格式，即引导加载程序规范 BLS）。\n\n`GRUB_CMDLINE_LINUX`\
  \ 变量更有趣。它指定了传递给 Linux 内核的选项。例如，`rd.lvm.lv` 指定根文件系统和交换分区所在的逻辑卷名称。`crashkernel` 选项用于为\
  \ `kdump` 留一些内存，系统在崩溃时会调用它来捕捉内核核心转储。最后，在行末尾，`rhgb quiet` 指令默认启用红帽图形化启动并隐藏启动消息。如果你想启用详细启动消息，请从该行中删除\
  \ `quiet` 选项。\n\n### 如何更新 GRUB 2\n\n如果你需要重新安装 GRUB 2 引导加载程序，只需运行 `grub2-install`\
  \ 命令即可。如果它没有自动将 GRUB 2 指针写入 MBR，或者有多个硬盘可用，你可能需要包含硬盘设备，例如 `/dev/vda`。也可以在便携驱动器上设置\
  \ GRUB 2；只需用命令指定设备即可。\n\n当使用 `grub2-mkconfig` 生成 GRUB 2 配置文件时，不需要额外的命令。来自 MBR 的指针会自动读取\
  \ `/boot/grub2/grub.cfg` 文件的当前版本。\n\n### GRUB 2 命令行\n\n`grub.cfg` 中的错误可能导致系统无法启动。例如，如果\
  \ GRUB 2 将错误的卷识别为根分区（`/`），Linux 将在启动过程中挂起。`/boot/grub2/grub.cfg` 中的其他配置错误会导致启动过程中出现内核恐（kernel\
  \ panic）。\n\n现在你已经分析了 GRUB 2 配置文件，你可能已经可视化地看到此文件中错误的某些影响。如果某些文件名或分区错误，GRUB 2 将无法找到\
  \ Linux 内核等关键文件。如果 GRUB 2 配置文件完全丢失，你将看到类似下方的提示：\n\n```\ngrub>\n```\n\n在显示菜单时，按下\
  \ C 键可以访问 GRUB 2 命令行。要查看可用命令列表，在 `grub>` 提示符处按 TAB 键，或输入 `help` 命令。\n\n还支持命令补全。例如，如果你不记得内核文件的名称，输入\
  \ `linux /` 然后按 TAB 键来查看 `/boot` 目录下的可用文件。\n\n你应该能够通过 `ls` 命令从标准 PC 的 BIOS/UEFI\
  \ 菜单中找到所有检测到的硬盘。例如，让我们在这个特定系统中查找 `/boot` 分区和完 grub.cfg` 文件。默认情况下，`/boot` 目录挂载在单独的分区上。首先，在\
  \ `grub>` 命令行运行 `ls`：\n\n![Images](img/f0185-02.jpg)\n\n字符串 `hd0` 表示第一块硬盘，而 `msdos1`\
  \ 是用 MBR 格式（msdos）创建的分分区。如果服务器使用较新的 GPT 分区格式分区，GRUB 2 将第一个分区识别为 `gpt1` 而不是 `msdos1`。同样，`hd0,msdos2`\
  \ 表示第一块硬盘上的第二个分区。\n\n接下来，使用该信息查找 `grub.cfg` 文件：\n\n![Images](img/f0185-03.jpg)\n\
  \n如果文件不在所述分区上，你将看到“error: file '/grub2/grub.cfg' not found”的错误消息。如果所述分区不包含有效的文件系统，你可能看到“error:\
  \ unknown filesystem”。\n\n我们知道 `/boot` 目录在 `(hd0,msdos1)` 上。为了确认 `grub.cfg` 的位置，运行以下命令：\n\
  \n![Images](img/f0185-04.jpg)\n\n你应该会在输出中看到 `grub.cfg` 文件的内容。按键滚动查看文件内容，直到回到 GRUB\
  \ 2 命令行。\n\n还有一种识别带有 `/boot` 目录分区的方法。运行 `search.file` 命令查找 `grub.cfg`：\n\n![Images](img/f0186-01.jpg)\n\
  \nGRUB 2 应该返回带有 `/boot` 目录的分区。在这种情况下，它是第一块硬盘上的第一个分区：\n\n![Images](img/f0186-02.jpg)\n\
  \n现在你可以从 GRUB 2 配置文件中使用这些命令从 `grub>` 提示符启动 Linux。你可以通过以下命令确认 `/etc/fstab` 的内容：\n\
  \n![Images](img/f0186-02.jpg)\n\n### 练习 5-3\n\n#### 使用 GRUB 2 命令行\n\n在此练习中，你将手动启动\
  \ RHEL 9。按照以下步骤操作：\n\n1. 启动系统。当屏幕上出现以下行时，按任意键进入 GRUB 2 ：\n\n```\nThe selected entry\
  \ will be started automatically in 5s.\n```\n\n2. 按 c 进入命令行。你应该看到 `grub>` 提示符。\n\
  \n3. 加载 LVM 模块：\n\n```\ngrub> insmod lvm\n```\n\n4. 列出所有分区和逻辑卷：\n\n```\ngrub> ls\n\
  ```\n\n5. 识别根分区。它可能命名为 `lvm/rhel-root`。你可能需要尝试（例如，通过尝试显示 GRUB 2 之前列出的所有设备上的 etc/fstab\
  \ 文件）：\n\n```\ngrub> cat (lvm/rhel-root)/etc/fstab\n```\n\n6. 将 root 变量设置为识别为根文件系统的设备：\n\
  \n```\ngrub> set root=(lvm/rhel-root)\n```\n\n7. 输入 `linux` 命令，指定内核和根目录分区。是的，这是一个长行；但可以使用命令补全（按\
  \ TAB 键）来加速。此外，该行最重要的部分是内核文件和顶层根目录的位置。\n\n![Images](img/f0187-04.jpg)\n\n8. 输入 `init`\
  \ 命令，指定初始内存磁盘命令和文件位置。同样，你可以使用 TAB 键进行文件名补全。\n\n![Images](img/f0187-05.jpg)\n\n\n\
  \n\n# 9. 现在输入 `boot` 命令。如果此命令成功，Linux 现在应该启动所选内核和初始 RAM 磁盘（RAM disk），就像你从 GRUB 2\
  \ 配置菜单中选择该选项一样。\n\n## 从 GRUB 2 启动的选项：救援模式（Rescue Mode）\n\n之前版本的 RHCSA 考试备考指南中的故障排除目标表明，你需要能够从完全启动失败中恢复，例如\
  \ GRUB 2 配置文件损坏或丢失。换句话说，如果你尝试从前文描述的 `grub>` 提示符直接启动但失败了，你可能需要求助于被称为救援模式（rescue mode）的选项。这需要访问安装\
  \ DVD 或网络启动盘。\n\n![Images](img/exam.jpg)\n\n**RHCSA 目标已不再包含与救援模式相关的要求。然而，由于恢复无法启动的系统是一项重要技能，它可能会包含在未来的考试版本中。**\n\
  \n为此，请从其中一个介质选项启动。你应该能看到带有以下选项的安装界面：\n\n![Images](img/f0188-01.jpg)\n\n选择 Troubleshooting（故障排除）选项并按回车。你将看到第二个带有以下选项的屏幕：\n\
  \n![Images](img/f0188-02.jpg)\n\n选择 Rescue a Red Hat Enterprise Linux system（救援红帽企业\
  \ Linux 系统）选项并按回。救援模式在本地机器上运行 RHEL 9 操作系统的稳定最小化版本。它本质上是其他 Knoppix 或 Ubuntu Linux\
  \ 发行版中提供的“Live DVD”介质的文本版本。\n\n![Images](img/job.jpg)\n\n**对于 RHEL 9，最好使用 RHEL 9\
  \ 救援介质。此类介质使用 Red Hat 编译的内核，并针对支持的硬件进行了定制。尽管如此，像 Knoppix 等选项也是好的。**\n\n你可以使用救援环境恢复无法启动的系统。在大多数情况下，你看到的下一步将在图\
  \ 5-4 中显示。\n\n图 5-4 救援环境的选项\n\n![Images](img/F05-04.jpg)\n\n*Continue*（继续）选项如图 5-5\
  \ 所示，会将所有检测到的卷挂载为 `/mnt/sysroot` 目录的子目录。*Read-Only Mount*（只读挂载）选项将以只读模式挂载检测到的卷。*Skip\
  \ to Shell*（跳到 Shell）选项将直接进入命令行界面。选择 Continue。确认后，你将看到一个 shell 提示符。\n\n图 5-5 在救援环境中挂载根文件系统\n\
  \n![Images](img/F05-05.jpg)\n\n在 shell 提示符中，输入 `chroot /mnt/sysroot` 命令。由于系统的常规顶层根目录被挂载在\
  \ `/mnt/sysroot` 目录上，`chroot` 命令会更改根目录，就像 `/mnt/sysroot` 文件系统被挂载在 `/` 之下一样。\n\n\
  练习你在本节中学的关于 GRUB 2 的知识。这可能帮助你从现实世界的问题中恢复——而且红帽确实说过他们的考试充满了“现实世界的任务”。然而，不要假设在红帽考试期间可以访问\
  \ CD 或 DVD。如果没有可用的救援介质，那意味着至少有一种你可以使用的的替代方法来解决问题。\n\n### 认证目标 5.03\n\n### 在 GRUB\
  \ 2 和登录之间\n\n本节提供了 GRUB 2 引导加载程序找到内核后启动过程的基本概述。如果你理解这个过程，就可以诊断各种启动问题。与内核相关的消息提供了该过程的逐步视图。\n\
  \nLinux 的加载依赖于一个临时文件系统，称为初始 RAM 磁盘（initial RAM disk）。一旦启动过程完成，控制将交给 `systemd`，它被称为第一个进程。本节将通过单元（units）和目标（targets）的配置详细描述\
  \ `systemd` 的内容。\n\n![Images](img/job.jpg)\n\n**大多数 Linux 发行版（包括 RHEL 9）已经用 systemd\
  \ 服务管理器替换了 Upstart 和 SysVinit。**\n\n在本节中，你还回顾了允许你正常重启和关闭系统的命令。\n\n![Images](img/job.jpg)\n\
  \n**在 systemd 中，“万物皆文件”的 Unix 哲学可以表述为“万物皆单元”。单元是 systemd 的基本构建模块。**\n\n#### 内核和初始\
  \ RAM 磁盘\n\n当你从 GRUB 2 配置菜单中选择内核后，Linux 在初始 RAM 磁盘的帮助下将启动责任交给内核，该磁盘通过其在 `/boot`\
  \ 目录中的文件名 `initramfs` 得知。正如其名称所示，它实际上是一个文件系统，但它保存在文件中而不是磁盘分区上。\n\n在启动过程中，Linux 将该临时文件系统加载到你的\
  \ RAM 中。然后 Linux 加载硬件驱动程序并启动第一个进程 `systemd`。\n\n接下来，`systemd` 激活 `initrd.target`\
  \ 的所有系统单元，并将根文件系统挂载到 `/sysroot` 下。最后，`systemd` 在新的根目录中重启自己并激活默认目标的所有单元（我们将在下一节中详细查看单元和目标）。\n\
  \n要了解更多信息，请在 GRUB 配置文件中禁用所需内核的 `quiet` 指令。启动你的系统。观察消息如何快速掠过屏幕。登录后，你可以运行 `dmesg`\
  \ 命令来查看这些消息。\n\n你可以在 systemd journal 中找到更多日志信息。使用 `journalctl` 命令显示其内容。你看到的内容取决于硬件和配置。关键消息包括：\n\
  \n- 内核版本\n- SELinux 状态（如果已激活）\n- 内存\n- CPU\n- 内核命令行，指定逻辑卷或根文件系统\n- 与初始 RAM 磁盘 (initramfs)\
  \ 相关的内存释放\n- 硬盘和分区（通过其设备文件名定义，例如 `/dev/sda` 或 `/dev/vda1`）\n- 活动的文件系统\n- 交换分区\n\n\
  日志文件充满了丰富的信息。如果系统加载了错误的内核，你会看到证据。如果 Linux 没有使用配置的分区，你也会在这里看到（间接地）。如果 SELinux 加载异常，你会在文件末尾的消息中看到。\n\
  \n![Images](img/exam.jpg)\n\n**记住，红帽考试不是硬件考试。如果你发现关键硬件组件（例如网卡，无法通过某些 Linux 命令解决）存在问题，请告知你的导师/监考。如果她回答这不是硬件问题，不要惊讶。**\n\
  \n#### 第一个进程、目标和单元\n\nLinux 内核通过调用第一个进程 `systemd` 继续启动过程。在 RHEL 9 中，旧的 `init` 进程配置为指向\
  \ `systemd` 的符号链接。\n\n单元是 systemd 的基本构建模块。最常见的是*服务单元*（service units），它们具有 `.service`\
  \ 扩展并激活系统服务。要显示所有服务单元的列表，输入以下命令：\n\n```\n# systemctl list-units --type=service --all\n\
  ```\n\n`--all` 标志包含了所有单元，而不仅仅是激活的。还有其他类型的单元，例如管理挂载点的挂载和自动挂载单元；当文件系统路径发生变化（如溢出目录）时激活服务的路径单元；套接字单元（socket\
  \ units），它们仅在建立客户端连接时才启动服务（如果你使用过 `xinetd` 守护进程，这类似于 `xinetd` 按需启动服务的方式）；以及更多。\n\
  \n\n\n\n\n一种特殊的单元是`target unit`（目标单元），用于与其他系统单元组合并将系统切换到不同的状态。要列出所有目标，请输入以下命令：\n\
  \n```bash\n# systemctl list-units --type=target --all\n```\n\n最重要的目标描述在表 5-2 中。\n\
  \n表 5-2 systemd 目标\n\n![Images](img/f0191-03.jpg)\n\n在 systemd 中，目标的作用与之前 RHEL 发行版中的运行级别（runlevels）相同。在\
  \ RHEL 6 中，可用 0 到 6 的七个运行级别。Linux 服务按运行级别组织。每个运行级别对应一个功能级别。\n\n例如，在运行级别 1 中，只允许一个用户登录该\
  \ Linux 系统。X11 模式（也称为运行级别 5）用于在安装了适当软件包的情况下启动带有 GUI 登录界面的 Linux。表 5-3 比较了 systemd\
  \ 目标与 RHEL 6 中定义的运行级别。\n\n表 5-3 RHEL 6 运行级别与 RHEL 9 systemd 目标\n\n![Images](img/f0192-01.jpg)\n\
  \n运行以下命令：\n\n![Images](img/f0192-02.jpg)\n\n注意输出中的符号链接。看到`runlevel0.target`、`runlevel1.target`等文件是如何链接到\
  \ `poweroff.target` 和 `rescue.target` 等 systemd 目标的了吗？这些链接提供了与旧 SysV 运行级别的后兼容性。你甚至可以将\
  \ `graphical.target` 称为 `runlevel5.target`，将 `multi-user.target` 称为 `runlevel3.target`。\n\
