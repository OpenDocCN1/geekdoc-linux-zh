  \ `/etc/fstab` 中当前配置的所有文件系统的最简单方法是使用以下命令：\n\n![Images](img/f0291-04.jpg)\n\n然而，如果一个文件系统已经挂载，无论对\
  \ `/etc/fstab` 文件做了什么修改，该命令都不会改变它的状态。但如果系统随后重启，`/etc/fstab` 中配置的选项将自动被使用。\n\n如果你不确定对\
  \ `/etc/fstab` 文件的可能更改，可以使用 `mount` 命令进行测试。例如，以下命令以只读模式重新挂载与 `/boot` 目录关联的卷：\n\n\
  ![Images](img/f0291-05.jpg)\n\n你可以通过重新运行 `mount` 命令来确认结果。以下输出应反映了 `/boot` 目录的结果：\n\
