  \ 进行的所有更改在服务器重启后都不会保留。要使重启后保留更改，请为 `firewall-cmd` 增加 `--permanent` 参数。然后运行 `firewall-cmd\
  \ --reload` 以立即实施更改。\n\n![Images](img/exam.jpg)\n\n你希望防火墙更改在重启后依然存在。使用 `firewall-cmd`\
