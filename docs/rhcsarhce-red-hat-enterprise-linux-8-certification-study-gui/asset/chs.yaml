  \n## 认证总结\n\n作为 Linux 管理员，你应该知道如何创建和管理新的文件系统卷。要创建一个新的文件系统，你需要知道如何创建、管理和格式化分区，以及如何为这些分区设置逻辑卷。\n\
  \nRHEL 9 还支持逻辑卷的配置。\n\n\n\n\n![Images](img/squ1.jpg) 配置为 PV 的新分区空间可以通过 `vgextend`\
  \ 命令分配给现有的卷组；它们可以通过 `lvcreate` 和 `lvextend` 命令添加到逻辑卷（LV）中。\n\n![Images](img/squ1.jpg)\
  \ 分区上的额外空间可以使用 `xfs_growfs` 命令来扩展现有的 XFS 文件系统。\n\n## 文件系统管理\n\n![Images](img/squ1.jpg)\
  \ 标准文件系统按照 `/etc/fstab` 中的定义进行挂载。\n\n![Images](img/squ1.jpg) 文件系统卷通常通过其 UUID 标识；如需列列表，请运行\
  \ `blkid` 命令。\n\n![Images](img/squ1.jpg) `mount` 命令既可以使用 `/etc/fstab` 中的设置，也可以直接挂载文件系统卷。\n\
  \n![Images](img/squ1.jpg) 此外，还可以在在 `/etc/fstab` 中配置来自 NFS 和 Samba 服务器的共享文件系统的挂载。\n\
  \n## 自动挂载器 (Automounter)\n\n![Images](img/squ1.jpg) 通过自动挂载器，你可以配置可移动介质和共享网络驱动器的自动挂载。\n\
  \n![Images](img/squ1.jpg) 关键的自动挂载器配置文件位于 `/etc` 目录下的 `auto.master` 和 `auto.misc`\n\
  \n## 自测\n\n以下问题将帮助衡量你对本章介绍内容的理解。由于 Red Hat 考试中没有选择题，因此书中也没有出现选择题。这些问题专门测试你对本章的理解。在\
