  有关软件包安装过程的更多信息，请参阅第 4 章。\n\n# 考试内部详解\n\n## 基础防火墙控制\n\n`firewalld` 是一个功能丰富的、基于区域的状态检测防火墙，你可以用它来阻止或接受指向远程网络服务的流量。相关的\
  \ RHCSA 目标是：\n\n![Images](img/square.jpg) 使用 `firewall-cmd`/`firewalld` 配置防火墙设置\n\
  \n![Images](img/square.jpg) 使用 `firewall-cmd`/`firewall` 限制网络访问\n\n## 安全外壳服务器 (SSH)\n\
  \n如引言所示，本章特别关注了 `SSH` 服务，因为作为登录机器的常用服务，确保其安全性至关重要。相关的 RHCSA 目标是：\n\n![Images](img/square.jpg)\
  \ 为 `SSH` 配置基于密钥的认证\n\n通过密钥认证，你将能够使用私钥/公钥对远程系统进行登录。不再需要通过网络传输密码。与此类认证密钥相关的 1024\
  \ 位更多位比标准密码难猜得多。\n\n## 增强型 Linux (SELinux)\n\n这是无法逃避的。在红帽考试中，你被要求使用 `SELinux`。如果你不至少考虑到\
  \ `SELinux` 的考虑来配置某些服务，还不清楚你是否能通过红帽考试。为了帮助候选者理解所需内容，红帽对 `SELinux` 相关的目标进行了拆分。第一个目标是\
  \ `SELinux` 的基础，因为它涉及到系统上 `SELinux` 可用的三种模式（`enforcing/permissive/disabled`）：\n\n\
  ![Images](img/square.jpg) 为 `SELinux` 设置强制执行和允许模式\n\n下一个目标要求你理解为不同文件和进程定义的 `SELinux`\
  \ 上下文（contexts）。虽然相关命令很直观，但可用的上下文范围与 Linux 上可用服务的数量一样广泛：\n\n![Images](img/square.jpg)\
  \ 列出并识别 `SELinux` 文件和进程上下文\n\n当你尝试不同的 `SELinux` 上下文时，可能会出错。你可能不记得与重要目录相关的默认上下文。但有了正确的命令，你不需要记住一切；正如接下来的目标所示，恢复默认相对容易：\n\
  \n![Images](img/square.jpg) 恢复默认文件上下文\n\n`SELinux` 使用上下文不仅用于文件和进程，还用于网络端口。通过编辑端口标签，你可以允许服务运行在非标准端口，或者你可以限制服务能够监听的端口。相关的考试目标是：\n\
  \n![Images](img/square.jpg) 管理 `SELinux` 端口标签\n\n下一个目标一眼看上去很复杂，但其实并不，因为与 `SELinux`\
  \ 相关的布尔设置（boolean settings）具有描述性名称。从本质上说，这意味着要在 `SELinux` 下运行特定服务，你只需要开启一个或多个布尔设置即可（而不需要直接修改\
  \ `SELinux` 策略规则）。\n\n![Images](img/square.jpg) 使用布尔设置修改系统 `SELinux` 设置\n\n一旦 `SELinux`\
  \ 开始运行，你就应该监控系统是否存在策略违规行为。违规可能是配置不当或未经授权的入侵尝试的结果。因此，为了充分利用 `SELinux` 的作用，你应该知道如何审计策略违规并能够解决常见问题。相关的\
  \ RHCSA 目标是：\n\n![Images](img/square.jpg) 诊断并处理常规 `SELinux` 策略违规\n\n### 认证目标 8.01\n\
  \n### 基础防火墙控制\n\n传统上，防火墙仅在局域网（LAN）和互联网等外部网络之间配置。但随着安全威胁的增加，每个系统对防火墙的需求日益增长。RHEL\
  \ 9 在每个默认配置中都包含防火墙。\n\nLinux 内核带有一个强大的框架——`Netfilter` 系统，它允许其他内核模块提供数据包过滤、网络地址转换\
  \ (`NAT`) 和负载均衡等功能。在之前的 RHEL 版本中，`iptables` 命令是与 `Netfilter` 系统交互以提供数据包过滤和 `NAT`\
  \ 的主要工具。\n\n今天，`Netfilter` 的功能已通过新的数据包分类系统 `Nftables` 扩展。在 IP 网络上发送消息之前，消息会被分成称为“数据包”（packets）的小单元。额外信息（包括数据类型、源地址和目的地址）被添加到每个数据包中。数据包到达目标计算机时会被重组。`Nftables`\
  \ 规则检查每个数据包中的这些字段，以决定是否允许数据包通过。\n\n在 RHEL 9 中，旧的 `iptables` 工具已弃用，取而代之的是 `firewalld`。你可以使用图形化工具\
  \ `firewall-config` 或命令行客户端 `fire-cmd` 与 `firewalld` 交互。虽然 `iptables` 依赖内核中的 `Netfilter`\
  \ 系统来过滤数据包，但 `firewalld` 使用 `Nftables` 提供的更高级的功能。它是基于区域的，正如后续所示。\n\n对于 RHCSA 考试，你需要理解如何使用\
  \ `fire-cmd` 配置防火墙以阻止或允许网络通信。我们还将介绍如何使用 `firewall-config` GUI 工具和 Cockpit Web 控制台来实现。\n\
  \n#### 标准端口\n\nLinux 主要通过 TCP/IP 协议进行网络通信。不同服务默认使用某些端口，如 `/etc/services` 文件定义。记住其中某些端口是有用的，如表\
  \ 8-1、用户数据报协议 (UDP)，甚至是流控制传输协议 (SCTP) 进行通信。例如，如以下 `/etc/services` 摘录所示，FTP 服务已被分配了端口：\n\
  \n表 8-1 常见 TCP/IP 端口\n（注：此处应引用表 8-1 和 /etc/services）\n\n然而，你很快就会看到红帽防火墙配置工具为 FTP\
  \ 服务开放 TCP 通信。这是因为互联网数字分配机构 (IANA) 的默认策略是为每个服务都注册 TCP 和 UDP 端口号。\n\n#### firewalld\
  \ 服务\n\n你可以自动化配置防火墙的过程。为了这个目的，在 RHEL 9 中 `firewalld` 提供了控制台和 GUI 配置工具。虽然这两个应用程序的外观和感受不同，但你可以使用这两个工具来配置对信任服务的访问。在启动\
  \ `firewalld` 配置工具之前，请检查 `firewalld` 是否正在运行并在启动过程中自动启动：\n\n![Images](img/f0315-02.jpg)\n\
  \n`firewalld` 的功能之一是基于区域的防火墙。在基于区域的防火墙中，网络和接口被分为区域，每个区域配置有不同的信任级别。`firewalld` 定义的区域如表\
  \ 8-2 所示，以及它们对出站和入站连接的默认行为。\n\n表 8-2 firewalld 中的区域\n（注：此处应引用表 8-2）\n\n**一个区域由一组源网络地址和接口组成，加上用于匹配这些源地址和网络接口的数据包的规则。**\n\
  \n\n\n\n在某些系统中，你可能会看到一个名为“libvirt”的区域。这不是 `firewalld` 定义的默认区域之一，而是由 `libvirt` 创建的用于管理如\
  \ `virbr0` 等接口，该接口用于允许虚拟机客户端与主机之间的通信。\n\n### 图形化 firewall-config 工具\n\n你可以从基于图形界面的命令行通过\
  \ `firewall-config` 命令启动图形化 `firewalld` 配置工具。结果如图图 8-1 所示。\n\n图 8-1 图形化 firewall-config\
  \ 工具\n\n![Images](img/F08-01.jpg)\n\n所示，主窗口包含不同的菜单和标签。在左上区域，你可以找到哪个接口链接到了哪个区域。旁边有一个“配置（Configuration）”菜单，你可以在其中将防火墙设置为运行时（Runtime）模式或永久（Permanent）模式。如果设置为运行时，通过\
  \ `firewall-config` 应用的更改将立即生效，但在服务器重启后不会保留。或者，选择永久模式以使你的更改在服务器重启后依然有效。你可以随时点击“选项（Options）\
  \ | 重新加载 firewalld（Reload Firewalld）”使新的防火墙配置立即生效。\n\n![Images](img/exam.jpg)\n\n\
  如果没有安装 `firewall-config`，请运行 `dnf install firewall-config` 命令。\n\n![Images](img/job.jpg)\n\
  \n你只能在永久模式下修改区域和服务的定义。\n\n“区域（Zones）”标签包含了之前在表 8-2 中列出的所有区域。当入站数据包到达防火墙时，将检查源地址是否与属于现有区域的网络地址匹配。如果没有找到匹配项，将检查数据包的入站接口以验证它是否属于某个区域。一旦找到对应关系，将根据其匹配到的区域的规则处理数据包。\n\
  \n在主 `firewall-config` 窗口中，公共（public）区域以粗体字体显示，表示该区域是*默认区域（default zone）*。默认区域具有特殊含义：添加到系统的任何新网络接口都会自动分配给默认区域。此外，对于不匹配任何其他区域的所有入站数据包，将处理默认区域的规则。你可以点击“选项（Options）\
  \ | 更改默认区域（Change Default Zone）”来设置不同的区域作为默认区域。\n\n要允许或拒绝通过防火墙的入站流量，请选择一个区域，并在区域“服务（Services）”标签中为你授予或阻止的服务添加或取消勾选。作为替代方案，你也可以从“端口（Ports）”标签指定协议和端口。\n\
  \n在 `firewalld` 中，服务被定义为一个或多个协议和端口的组。服务还可以包含 Netfilter 辅助模块，以支持对那些动态打开多个连接的程序的过滤。\n\
  \n服务窗口中已经定义了多种网络服务。最常见的在表 8-3 中描述。\n\n表 8-3 常见的 TCP/IP 端口\n\n![Images](img/f0318-01.jpg)\n\
  \n如果你将 `firewall-config` 工具切换到永久模式，可以添加新的区域和服务，或编辑现有的。要管理服务，点击“服务”标签，选择一个服务，并点击面板底部相应的图标来删除、添加或编辑该服务。如果需要，可以通过选择右侧面板中现有服务的端口，然后点击“添加（Add）”或“编辑（Edit）”按钮来打开“端口和协议”对话框，如图图\
  \ 8-2 所示。\n\n图 8-2 在 firewall-config 工具中为服务添加自定义端口\n\n![Images](img/F08-02.jpg)\n\
