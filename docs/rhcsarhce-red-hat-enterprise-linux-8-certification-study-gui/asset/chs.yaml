  \n\n\n\n![Images 两分钟演练](img/#ch01.xhtml_lev1sec1)\n\n**问答** 自测\n\n在完成安装、系统安全加固、文件系统配置以及其他初始化设置任务后，你仍然有工作要处理。几乎可以肯定，在你的系统达到理想状态之前，你将需要安装或删除软件包。为了确保安装了正确的更新，你需要了解如何让系统通过\
  \ Red Hat 订阅管理 (RHSM) 或与重构发行版相关的仓库正常工作。\n\n为了完成这些任务，你需要详细了解如何使用 `rpm` 和 `dnf` 命令。虽然这“仅仅”是两个命令，但它们包含了丰富的细节。有整本书都专门介绍\
  \ `rpm` 命令，例如 Eric Foster-Johnson 编写的 *Red Hat RPM 指南*。但对于许多人来说，鉴于 `dnf` 命令的能力以及\
  \ RHEL 9 提供的额外包管理工具，对 `rpm` 命令进行那种深度的知识掌握已不再是必须。\n\n## 考试内部\n\n### 管理技能\n\n由于管理\
  \ RPM 包是 Red Hat 管理员的基本技能，你应该预期会在 RHCSA 考试中使用 `rpm`、`dnf` 以及相关命令。RHCSA 目标包含了本章涉及的一个特定要求：\n\
  \n![Images](img/square.jpg) 从 Red Hat 网络、远程仓库或本地文件系统安装和更新软件软件包\n\n针对 RHEL 8 的 RHCSA\
  \ 考试还包含以下目标：\n\n![Images](img/square.jpg) 处理软件包模块流（package module streams）\n\n尽管该目标不再被包含在\
  \ RHEL 9 的 RHCSA 考试目标中，但处理软件包模块流仍然是一个重要主题，并可能在未来考试目标的修订中恢复。出于此原因，我们在本章中包含了一个可选章节，来解释模块流是如何工作原理。不过，你可以随时跳过此章节或稍后返回，假设在本书出版后，它对你的备考仍然没有影响。\n\
  \n另一个密切相关的目标需要对 `tar` 归档工具的知识，这将在第 9 章 中介绍。在 Red Hat 引入 RPM 软件包之前，tar 归档是发行软件的标准方法。\n\
  \n现在让我们详细分解这些技能。首先，我们将介绍 `rpm` 命令。这是一个非常强大的软件管理工具，但它缺乏 `dnf` 提供的两个重要特性：依赖关系的管理和安装（即另一个软件包所需的软件），以及与仓库协作的能力（仓库是可以在本地文件系统或网络上访问的软件包集合）。要使用\
  \ `dnf`，你需要配置对 Red Hat 订阅管理 (RHSM) 的访问以下载软件软件包。你也可以使用相同的 `dnf` 命令从远程第三方仓库安装和更新软件包。自\
  \ RHEL 8 以来，Red Hat 还提供了一个新概念来支持同一应用程序的不同版本：这就是模块流（module streams）的目的。\n\n### 认证目标\
  \ 4.01\n\n### RPM 软件包管理器\n\n系统管理员的主要职责之一是软件管理。这包括安装新应用程序、更新服务以及内核内核补丁。如果没有正确的工具，很难确定系统中安装了哪些软件、哪些是最新更新以及哪些应用程序依赖于其他软件。更糟糕的是，你可能安装了一个新软件包，结果发现它覆盖了某个已安装软件包中的关键文件。\n\
  \n![Images](img/job.jpg)\n\n**如前所述，自 RHEL 8 以来，Red Hat 引入了一个新的默认包管理器 `dnf`，也称为“Dandified\
  \ YUM”或 DNF。在 RHEL 7 中默认包管理器 `yum` 命令在 RHEL 9 中仅仅是 `dnf` 的符号链接。然而，你不需要了解 `dnf` 和\
  \ `yum` 之间所有的差异就能通过 RHCSA 考试。关于 `dnf` 和 `yum` 之间变化的更多信息，请访问 [`dnf.readthedocs.io`](https://dnf.readthedocs.io)。**\n\
  \nRPM 是 RPM Package Manager 的递归缩写（称为 Red Hat Package Manager）。RPM 的设计是为了解决上述的软件管理问题。通过\
  \ RPM，软件以离散的*软件包*（packages）形式管理。一个 RPM 软件包包含了软件以及用于添加、删除和升级这些文件的指令。当使用得当时，RPM 工具可以在进行升级和删除之前备份关键配置文件。它还可以帮助你识别任何基于\
  \ RPM 的应用程序的当前安装版本。\n\nRPM 和 `rpm` 命令非常关注单个软件包，这在很多情况下是远非理想的，这也是为什么 `rpm` 使用 `dnf`\
  \ 命令 进行了补充。通过连接到如来自 RHSM 这样的仓库，你将能够使用 `dnf` 自动满足依赖关系。\n\n#### 什么是软件包？\n\n从广义上说，RPM\
  \ 软件包是一个文件的容器。它包含了二进制文件、安装脚本和文档文件。它还包含了关于如何以及何处安装和卸载这些文件的指令。\n\nRPM 软件包名称通常由版本、发布版本（release）以及构建它的架构组成。例如，`penguin-3.4.5-26.el9.x86_64.rpm`\
  \ 版本为 3.4.5，发布版本为 26.el9`x86_64` 表示它适用于 AMD/Intel 64 位架构的计算机。\n\n![Images](img/job.jpg)\n\
  \n**许多 RPM 软件包包含了为特定 CPU 类型（例如 x86_64）编译的软件。你可以使用 `uname -i` 或 `uname -p` 命令识别系统的\
  \ CPU 类型。关于处理器的更多信息可以在 /proc/cpuinfo 中找到。**\n\n#### 什么是 RPM 数据库？\n\n系统的核心是 RPM 数据库，它本地存储在每台机器的\
  \ `/var/lib/rpm` 目录下。该数据库跟踪每个 RPM 中每个文件的版本和位置。RPM 数据库还维护每个文件的 MD5 校验和。通过校验和，你可以使用\
  \ `rpm -V package*` 命令确定该 RPM 软件包的任何文件是否发生了变化。RPM 数据库使得添加、删除和升级单个软件包变得简单，因为它配置为知道处理哪些文件以及放在何处。\n\
  \nRPM 还管理软件包之间的冲突。例如，假设你有一个安装配置文件的软件包，你想从旧版本更新到新版本。假设原始配置文件为 `/etc/someconfig.conf`。你已经安装了软件包\
  \ X。如果你尝试安装更新版本的软件包 X，RPM 软件包可以配置为保留原始配置文件并将新文件安装为 `/etc/someconfig.conf.rpmnew`。\n\
  \n或者，RPM 创建者可以这样构建 RPM，使其在升级软件包 X 之前备份原始的 `/etc/someconfig.conf` 文件（文件名如 `/etc/someconfig.conf.rpmsave`），然后用新版本替换配置文件。这发生在旧配置文件的格式与软件新版本不兼容时。\n\
  \n**尽管 RPM 升级应该应该保留或保存现有的配置文件，但并没有保证，特别是当 RPM 不是由 Red Hat 创建时。在升级任何相关的 RPM 软件包之前，备份所有适用的配置文件是最好的做法。**\n\
  \n#### 什么是仓库？\n\n\n\n\n\nRPM 软件包通常被组织在仓库中（repositories）。通常，这些仓库包含具有不同功能的包组。例如，红帽客户门户（Red\
  \ Hat Customer Portal）提供了访问以下 RHEL 9 服务器仓库的权限：\n\n![Images](img/square.jpg)  **BaseOS**\
  \ 主仓库，包含了与 RHEL 9 核心相关的软件包以及更新。\n\n![Images](img/square.jpg)  **AppStream** 一个庞大的开源应用程序组，包含了数据库和运行时语言。\n\
  \n每个仓库在 `repodata/` 子目录中都包含一个软件包数据库。该数据库包含每个包的信息，并允许安装请求包含所有依赖项。如果您拥有 RHSM 订阅，则在\
  \ `/etc/dnf/plugins` 目录下的 `product-id.conf` 和 `subscription-manager.conf` 文件中启用对红帽仓库的访问。这些文件将在本章稍后部分进行讨论。\n\
  \n![Images](img/job.jpg)\n\n**依赖项是指为了确保目标包的所有功能按设计方式工作而需要安装的包。**\n\n### 安装 RPM 软件包\n\
  \n有三个基本命令可以安装 RPM。如果要安装的 RPM 需要任何依赖项，这些命令将无法工作。例如，如果您尚未安装 SELinux 策略 DBUS (`policycoreutils-dbus`)\
  \ 和开发工具包 (`policycoreutils-devel`)，并尝试安装 SELinux 配置 GUI (`policycoreutils-gui`)，您将收到以下消息（版本号可能有所不同）：\n\
  \n![Images](img/f0131-01.jpg)\n\n测试这种方法的方法是一种使用 `mount /dev/cdrom /media` 命令挂载 RHEL\
  \ 9 DVD。接下来，在 `AppStream/Packages/` 子目录下找到指定的 `policycoreutils-gui` 包。或者，您也可以通过\
  \ `dnf download policycoreutils-gui` 命令直接从红帽客户门户或配置的仓库下载该包。此命令和其他 `dnf` 命令将在本章稍后部分讨论。请注意，某些\
  \ Linux GUI 桌面环境会自动挂载插入相关驱动器的 CD/DVD 介质。如果是这样，您将在 `mount` 命令的输出中看到挂载目录。\n\n当显示依赖项消息时，`rpm`\
  \ 不安装给定的包。注意这些依赖消息：`policycoreutils-gui` 需要相同版本的 `policycoreutils-dbus` 和 `policycoreutils-devel`\
  \ 包。\n\n![Images](img/job.jpg)\n\n**确实，您可以使用 `--nodeps` 选项让 `rpm` 忽略依赖项，但这可能会导致其他问题，除非您尽快安装这些依赖项。最佳选项是使用适当的\
  \ `dnf` 命令，该命令在本章稍后部分描述。在这种情况下，使用 `dnf install policycoreutils-gui` 命令将自动安装其他依赖\
  \ RPM。**\n\n如果您没有被依赖项阻止，以下三个基本命令可以安装 RPM 软件包：\n\n![Images](img/f0132-01.jpg)\n\n\
  `rpm -i` 选项在包尚未安装的情况下安装该包。`rpm -U` 选项升级任何已安装的包，或者在尚未安装较早版本时对其进行安装。`rpm -F` 选项仅升级已存在的包。如果包之前没有安装，它不会安装该包。\n\
  \n我们喜欢在 `rpm` 命令中添加 `-vh` 选项。这些选项增加了详细模式（verbose mode）并使用哈希标记（hash marks），有助于监控安装进度。因此，当我们使用\
  \ `rpm` 安装包时，我们运行以下命令：\n\n![Images](img/f0132-02.jpg)\n\n还有一个与设计良好的 RPM 软件包有关的项。在解包软件包时，`rpm`\
  \ 命令会检查它是否会覆盖任何配置文件。`rpm` 命令尝试对这种情况做出明智决策。正如早些提到的，如果 `rpm` 命令选择替换现有的配置文件，它会提供一个（大多数情况下）类似这样的警告：\n\
  \n![Images](img/f0132-03.jpg)\n\n当使用 `-e` 选项删除包时，`rpm` 命令通常以相同的方式工作。如果配置文件被修改过，它还会以\
  \ `.rpmsave` 扩展名保存在相同的目录中。\n\n查看（look at）两个文件并确定需要进行哪些修改（如果有的话）取决于您的决定。当然，由于不是每个\
  \ RPM 软件包都是完美的，始终存在此类更新会覆盖该关键自定义配置文件的风险。在这种情况下，备份是非常重要的。\n\n通常情况下，升级软件包的 `rpm` 命令仅在正在安装的包是新版本时才有效。有时，软件包的旧版本是更理想的。只要旧版本的包没有安全问题，管理员可能更倾向于稍旧的发布。新版本包中可能存在\
  \ Bug 在该包的旧版本中可能不存在。因此，如果您想用 `rpm -i`、`-U` 或 `-F` 命令“降级”包，`--force` 切换可以很有帮助。\n\n\
  ![Images](img/job.jpg)\n\n**如果您已经对包进行了自定义，然后用 `rpm` 升级了它，请检查是否存在以 `.rpmnew` 扩展名结尾的配置文件。使用它作为指南来更改新配置文件中的设置。但请记住，在升级过程中，可能会有额外的强制更改。因此，您应该对每一个可能的生产环境测试结果。**\n\
  \n### 卸载 RPM 软件包\n\n`rpm -e` 命令卸载包。但首先，RPM 会检查几件事。它会执行依赖检查以确保没有包需要您尝试卸载的包。如果发现依赖包，`rpm\
  \ -e` 将失败并报错。对于配置妥的 RPM，如果您修改了配置文件，RPM 会创建文件的副本，并在文件名后添加 .rpmsave 扩展名，然后删除原始文件。处理完成后，它会从数据库中删除该包。\n\
  \n![Images](img/job.jpg)\n\n**从系统中删除包时要非常小心。像许多其他 Linux 工具一样，`rpm` 可能会悄悄地让你自毁。例如，如果您删除了运行内核的包，可能会导致系统在下次启动时无法使用。**\n\
  \n### 从远程系统安装 RPM\n\n通过 RPM 系统，您甚至可以使用类似于 Internet 地址的 URL 格式来指定包的位置。例如，如果您想将 `rpm`\
  \ 命令应用于 `ftp.rpmdownloads.com` FTP 服务器 `/pub` 目录下的 `foo.rpm` 包，可以使用如下命令安装此包：\n\n\
