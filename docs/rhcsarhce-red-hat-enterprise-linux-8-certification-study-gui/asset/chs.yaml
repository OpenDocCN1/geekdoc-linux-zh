  \ Linux 发行版。\n\n![Images](img/job.jpg)\n\n如果你在 VMware Workstation Player 的虚拟机显示窗口内点击鼠标指针，会导致虚拟机捕获主机的鼠标指针和键盘，以便你可以在虚拟机内部使用鼠标和打字。按下\
  \ `CTRL-ALT` 释放释放并将控制权交还给主操作系统。\n\n### 认证目标 1.05\n\n### RHEL 9 安装\n\n即使是大多数新的 Linux\
  \ 用户也可以从 CD/DVD 安装 RHEL 9。虽然本节涉及了与安装相关的某些选项，但它的重点是创建表 1-2 列出的两个系统中的第一个。\n\n此外，安装过程是一个学习更多\
  \ RHEL 9 的机会，不仅是引导媒体，还有安装完成后可以配置的逻辑卷。然而，由于预装物理系统现在已成为 Red Hat 考试的常态，关于逻辑卷的详细讨论已整合在第\
  \ 7 章中。\n\n本节描述的步骤假设你已经按照章节前面的介绍下载了 `RHEL 9 DVD` 镜像，并按照上一一节的步骤在 VMware Workstation\
  \ Player 中创建了虚拟机。\n\n#### 引导媒体\n\n当你安装 RHEL 9 时，最简单的选项是从 `RHEL 9 DVD` 引导。但这并不是唯一的安装选项。本质上，有五种方法可以启动\
  \ RHEL 9 安装过程：\n\n![Images](img/square.jpg) 从 `RHEL 9 Binary DVD` 引导。\n\n![Images](img/square.jpg)\
  \ 从包含 `RHEL 9 Binary DVD` 镜像的 USB 驱动器引导。\n\n![Images](img/square.jpg) 从最小化的 `RHEL\
  \ Boot CD` 引导。\n\n![Images](img/square.jpg) 从包含最小化 `RHEL Boot CD` 镜像的 USB 闪盘引导。\n\
  \n![Images](img/square.jpg) 使用 `PXE` 网络引导卡从 `Kickstart` 服务器引导。\n\n最后三个选项通常假设你将通过网络安装\
  \ RHEL 9，并且软件包存储库将在 Web 服务器、FTP 服务器或 NFS 共享上可用。对于订阅用户，可以从 Red Hat 客户门户获取安装和引导媒体。它们也可以从与“重构”（rebuild）发行版相关的服务器获取。\n\
  \n如果你按照上一一节的步骤操作，你可以从安装 DVD 引导 `server1.example.com` 虚拟机。几秒后，将出现 RHEL 安装屏幕，如图 1-3\
  \ 所示，其中至少包含以下三个选项：\n\nFIGURE 1-3 安装引导屏幕\n\n![Images](img/F01-03.jpg)\n\n![Images](img/square.jpg)\
  \ 安装 Red Hat Enterprise Linux 9.1\n\n![Images](img/square.jpg) 测试此媒体并安装 Red Hat\
  \ Enterprise Linux 9.1\n\n![Images](img/square.jpg) 故障排除\n\n第一个选项适用于大多数用户。如果你想在开始安装过程之前检查安装媒体的完整性，请选择第二个选项。\n\
  \nRed Hat 安装程序（也称为“Anaconda”）关联了两种模式：文本模式和图形模式。虽然图形模式是推荐的方法，但如果安装程序无法正确检测到你的显卡，你将被自动重定向到文本模式。幸运的是，这种情况在\
  \ VMware Workstation Player 上不会发生，因为宿主机虚拟化程序会模拟一个被 Linux 支持的显卡。\n\n如果你愿意，你也可以强制在文本模式下进行安装。要做到这一点，高亮\
  \ `Install Red Hat Enterprise Linux 9.1` 选项并按下 `TAB` 键。当你这样做时，屏幕上将以单行显示以下选项：\n\n\
  ![Images](img/f0023-02.jpg)\n\n要强制在文本模式下安装，请在该行末尾添加 `inst.text`。\n\n#### 基础安装步骤\n\
  \n基础 RHEL 安装非常直观，任何 Red Hat 认证候选人都应该已经充分理解。\n\n安装过程的步骤顺序取决于你是在文本模式还是图形模式下安装。如果你使用的是\
  \ RHEL 9 的重构发行版，顺序也可能有所不同。因此在阅读以下说明时请保持灵活：\n\n1. 从 `RHEL DVD` 启动你的电脑。通常会显示三个选项，如图\
  \ 1-3 所示。选择第一个选项并按下 `ENTER`（回车键）。\n\n2. 选择在安装过程中使用的语言，如图 1-4 所示。英语是默认语言；有 50 多个可用选项。\n\
