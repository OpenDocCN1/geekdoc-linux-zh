  \n如果 FTP 服务器需要用户名和密码，可以在以下格式中包含它们：\n\n![Images](img/f0133-02.jpg)\n\n其中 *username*\
  \ 和 *password* 是您登录此系统所需的用户名和密码，*port*（如果需要）指定远程 FTP 服务器上使用的非标准端口。\n\n根据前面的示例，如果用户名是\
  \ **mjang**，密码是 **Ila451MS**，您可以使用以下命令直接从远程服务器安装 RPM：\n\n![Images](img/f0133-03.jpg)\n\
  \n\n\n\n\n安全可能是一个令人担心的问题，特别是对于从互联网下载的 RPM 包。如果某个“黑帽”黑客通过某种方式修改了第三方存储库的内容，你该如何知道来自这些源的软件包是真实的？关键在于\
  \ GNU 隐私守护（GPG），它是 Pretty Good Privacy（PGP）的开源实现。如果一个 RPM 文件是使用私有 GPG 密钥签名的，就可以用相应的公共\
  \ GPG 密钥验证该包的完整性。有效的签名还确保了该包是由授权方签名的，而不是来自恶意黑客。\n\n如果你还没有导入或安装红 Hat 公共 GPG 密钥，在安装软件包时，你可能会注意到类似下面所示的消息：\n\
  \n![Images](img/f0134-01.jpg)\n\n如果你担心安全问题，这个警告应该引起你的警觉。在 RHEL 9 安装过程中，GPG 密钥存储在\
  \ `/etc/pki/rpm-gpg` 目录中。查看一下该目录的内容。你会发现诸如 `RPM-GPG-KEY-redhat-release` 等文件。要实际使用该密钥来验证软件包，必须对其进行导入——导入\
  \ GPG 密钥的命令非常简单：\n\n![Images](img/f0134-02.jpg)\n\n如果没有输出，说明 `rpm` 命令可能已成功导入 GPG\
  \ 密钥。GPG 密钥现在包含在 RPM 数据库中，可以使用 `rpm -qa gpg-pubkey` 命令进行验证。\n\n在 `/etc/pki/rpm-gpg`\
  \ 目录中，通常有两个 GPG 密钥可用，如表 4-1 所示。\n\n表 4-1 用于验证软件更新的 GPG 密钥\n\n![Images](img/f0134-03.jpg)\n\
  \n在本章后面的部分，你将看到在安装新软件包时，GPG 密钥是如何从远程存储库自动导入的。\n\n## 更新内核\n\n内核更新包含了新功能，解决了安全问题，并通常有助于\
  \ Linux 系统运行得更好。然而，内核更新可能会出错，导致系统无法启动或应用程序崩溃；如果安装了依赖于现有内核版本的特殊软件包，这种情况会尤为常见。\n\n\
  如果你知道某些软件依赖于自定义内核模块，只要你还没有准备好重复使用现有内核定制软件的每一个步骤，就不要升级内核，无论这些步骤是从供应商处获取新版本的闭源内核模块、为新内核重新构建特殊模块，还是执行其他手动工作。例如，某些没有内核树开源驱动程序的无线网卡和打印机驱动程序可能绑定到特定版本的内核上。某些虚拟机软件组件（不包括\
  \ KVM）可能是针对特定版本的内核安装的。\n\n如果你看到内核 RPM 有可用的更新，你可能会产生运行 `rpm -U *newkernel` 命令的冲动。不要这样做！它会覆盖你现有的内核，如果更新后的内核与系统不兼容，你就倒霉了。（好吧，并不是完全没没霉，但如果你重启并遇到问题，你将不得不使用救援模式（在第\
  \ 5 章 中讨论过）来启动系统并重新安装现有内核。在 RHCE 考试还设有独立的“故障排除”和“系统维护”章节的时代，这可能会构成一个有趣的测试场景。）升级到新内核的最佳选项是安装它，具体使用如下所示命令：\n\
  \n```\n![Images](img/f0135-01.jpg)\n```\n\n如果你连接到了适当的存储库，以下命令同样有效：\n\n```\n![Images](img/f0135-02.jpg)\n\
  ```\n\n这会安装新内核以及相关文件，并与当前工作的内核并列存在。结果的一个示例如图 4-1 所示，位于 `ls /boot` 命令的输出中。\n\n图 4-1\
  \ /boot 目录中的新旧内核文件\n\n![Images](img/F04-01.jpg)\n\n![Images](img/job.jpg)\n\n**通过运行\
  \ `dnf update kernel` 安装新内核也是安全的。事实上，默认情况下，`dnf` 配置为始终安装内核包并让任何旧内核留在原位。这适用于同时安装最多三个内核。**\n\
  \n表 4-2 简要描述了 `/boot` 目录中启动过程中不同部分的各种文件。\n\n表 4-2 /boot 目录下的文件\n\n![Images](img/f0136-01.jpg)\n\
  \n安装新内核会在 GRUB 配置文件（`/boot/grub2/grub.cfg`）中添加启动新内核的选项，而不会删除现有选项。默认情况下，系统将使用新安装的内核启动。因此，如果该内核无法工作，你可以重启系统，进入\
  \ GRUB 菜单，然后从较旧的、之前正常的内核启动。\n\n### 认证目标 4.02\n\n## 更多 RPM 命令\n\n`rpm` 命令包含了丰富的细节。这本书能做的只是涵盖\
  \ `rpm` 你管理 RHEL 的一些基本方法。你已经读过关于 `rpm` 如何以各种方式安装和升级软件包的内容。查询可以帮助你详细识别已安装的内容。验证工具可以帮助你检查软件包和单个文件的完整性。你可以使用相关工具帮助识别不同\
  \ RPM 的用途并编译完整列表。\n\n### 软件包查询\n\n最简单的 `rpm` 查询是验证特定的软件包已安装。以下命令验证 systemd 软件包（版本号可能不同）：\n\
  \n```\nrpm -q systemd\n```\n\n你可以通过 `rpm` 执行更多操作，如表 4-3 所示。注意查询通常使用 `-q` 或 `--query`。\n\
  \n表 4-3 rpm 查询选项\n\n```\n![Images](img/f0137-01.jpg)\n```\n\n如果你想查询 RPM 文件而不是本地数据库，只需添加\
  \ `-p` 并指定软件包的路径或 URL。例如，以下命令查询 `epel-release-latest-9.noarch.rpm`：\n\n```\nrpm\
  \ -qp epel-release-latest-9.noarch.rpm\n```\n\n![Images](img/f0137-03.jpg)\n\n###\
  \ 软件包签名\n\nRPM 使用几种方法检查软件包的完整性。你已经看到过如何导入 GPG 密钥。当你使用 `rpm --checksig *pkg.rpm`\
  \ 命令验证软件包时，可以看到某些可用方法。（`-K` 参数等同于 `--checksig`。）例如，如果你从第三方下载了假设的 `pkg-1.2.3-4.noarch.rpm`\
  \ 并想针对导入的 GPG 密钥进行验证，运行以下命令（`-v` 输出详细输出）：\n\n```\nrpm -checksig pkg-1.2.3-4.noarch.rpm\n\
  ```\n\n![Images](img/f0138-01.jpg)\n\n如果成功，你将看到类似下面的输出：\n\n![Images](img/f0138-02.jpg)\n\
  \n这保证了软件包的真实性，且 RPM 文件未被第三方修改。你可能已经认识用于验证软件包完整性的算法：\n\n```\n![Images](img/square.jpg)\
  \ RSA 以其创建者 Rivest、Shamir 和 Adleman 命名，是一种公钥加密算法。\n\n```\n![Images](img/square.jpg)\
  \ sha1 安全哈希算法-1，一种产生 160 位哈希值的函数。\n\n```\n![Images](img/square.jpg) sha256 一种产生\
  \ 256 位哈希值的函数。\n\n```\n![Images](img/square.jpg) md5 消息摘要 5，一种产生 128 位哈希值的函数。\n\
  ```\n\n### 文件验证\n\n对已安装软件包的验证是将软件包的信息与系统中 RPM 数据库中的信息进行比较。`--verify`（或 `-V`）开关会检查软件包中每个文件的大小、MD5\
  \ 和、权限、类型、所有者和组。可以通过多种方式验证。以下是一些示例：\n\n```\n![Images](img/square.jpg) 验证所有文件。自然地，这在你的系统上可能需要很长时间。（当然，`rpm\
  \ -Va` 命令执行相同的功能。）\n```\n\n```\n# rpm --verify –a\n```\n\n\n\n\n\n![Images](img/square.jpg)\
  \ 针对下载的 RPM 包验证包内的所有文件。\n\n```bash\n# rpm --verify -p vsftpd-3.0.3-49.el9.x86_64.rpm\n\
  ```\n\n![Images](img/square.jpg) 验证与特定软件包关联的文件。\n\n```bash\n# rpm --verify --file\
  \ /bin/ls\n```\n\n如果文件或软件包的完整性通过验证，你将看不到输出。任何输出都意味着文件或软件包与原始版本不同。如果出现某些更改，无需恐慌；毕竟管理员确实会编辑配置文件。这里共有九项测试。如果发生了变化，输出将是一个长达八个字符的失败代码字符串，每个字符都会告诉你你在每项测试期间发生了什么。\n\
  \n如果你看到点（`.`），则表示该测试通过了。下面的示例显示了 `/bin/vi` 的组 ID 分配错误的情况：\n\n![Images](img/f0139-02.jpg)\n\
  \n表 4-4 列出了失败代码及其含义。\n\n表 4-4 `rpm --verify` 代码\n\n![Images](img/f0139-01.jpg)\n\
