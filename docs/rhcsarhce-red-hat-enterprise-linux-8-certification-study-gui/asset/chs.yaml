  \n现在尝试其他。当执行以下命令时，你在想什么？\n\n![Images](img/f0192-01.jpg)\n\n### 正常重启和关机\n\n重启和关机命令非常简单。如上一节所示，使用\
  \ `systemctl`：\n\n![Images](img/f0192-02.jpg)\n\n要显示系统启动所需的时间，请运行以下命令：\n\n![Images](img/f0192-03.jpg)\n\
  \n### systemd 替换 Upstart\n\n`systemd` 进程包含一个强大的日志系统。虽然深入了解 systemd 的所有功能不在 RHCSA\
  \ 的范围之内，但系统管理员可以利用它的某些能力。一些 Linux 开发者认为 systemd 做得太多了，破坏了“程序只做一件事并将其做好”的 Unix 哲学。然而，尽管今天，systemd\
  \ 已被大多数主流发行版采用。\n\n`systemd` 进程主要用于跟踪进程，并确保在服务停止时所有属于服务的进程都已终止。`systemd-analyze`\
  \ 命令提供了启动时间的详细说明。图 5-6 中的数字显示了总用户空间时间。你可以通过运行 `systemd-analyze blame` 显示每个单元的详细时间。\n\
  \n![Images](img/f0194-01.jpg)\n\n### 日志\n\n`systemd` 进程包含一个强大的日志系统。你可以使用 `journalctl`\
  \ 命令显示所有收集的日志。默认情况下，日志文件临时存储在 `/run/log/journal` 目录内存中的环形缓冲区。要让 Linux 将日志文件持久写入磁盘，请运行以下命令：\n\
  \n![Images](img/f0195-01.jpg)\n\n一旦启用持久日志，你可以使用 `-b` 选项显示特定启动的日志消息：`journalctl -b\
  \ 0` 显示自上次启动以来的日志消息，`journalctl -b 1` 显示上上次启动，以此此类推。你不需要切换不同的日志文件，因为 `journalctl`\
  \ 会自动汇总当前和所有轮转日志文件的可用数据。\n\n你还可以使用 `-p` 命令选项根据其优先级过滤日志消息。例如，`journalctl -p warning`\
  \ 显示所有优先级为“warning”或更高的消息。优先级为“warning”的日志消息用黄色显示，而优先级为“err”及更高的消息用红色显示。\n\n###\
  \ 控制组\n\n控制组（或 cgroups）是 Linux 内核的一个特性，用于将进程分组在一起并控制或限制它们的资源使用（如 CPU、内存等）。在 systemd\
  \ 中，cgroups 主要用于跟踪进程，并确保在服务停止时所有属于服务的进程都已终止。\n\n\n\n\n\n在传统的 SysVinit 系统中，很难识别与进程关联的服务。事实上，服务通常会启动多个进程。当你停止一个\
  \ SysVinit 服务时，该服务可能无法终止所有的依赖（子）进程。你会被困于两地：要么手动停止所有依赖进程（使用 `ps` 和 `kill` 命令），要么接受系统存在处于未知状态的孤儿进程，直到下一次重启。\n\
  \n为了解决这一局限性，systemd 使用 cgroups（控制组）来标记与服务关联的进程。通过这种方式，systemd 在需要时可以使用 cgroups 杀死该组中的所有进程。\n\
  \n命令 `systemd-cgls` 以树状格式显示 cgroup 的层级结构，如图图 5-7 所示。从图 5-7 的片段中，你可以识别如 Network Manager\
  \ 和 `rsyslog.service` 等 cgroups，以及它们派生的进程。请注意 cgroups 与 systemd 服务单元之间的一一对应关系。\n\
  \n### 图 5-7 cgroup 层级结构\n\n![Images](img/F05-07.jpg)\n\n### 依赖\n\n传统的 SysVinit 系统按顺序启动服务。相比之下，systemd\
  \ 可以通过跟踪单元之间所有的依赖关系来并行激活服务。`systemctl list-dependencies` 命令会显示包含所有单元间依赖关系的树状。\n\n\
  你可以显示任何可用单元的依赖关系。依赖单元必须先启动。例如，以下命令显示了在启动 `rsyslog` 服务之前必须启动的单元：\n\n```\n# systemctl\
  \ list-dependencies rsyslog.service\n```\n\n命令输出的片段如图图 5-8 所示。\n\n### 图 5-8 systemd\
  \ 单元之间的依赖关系\n\n![Images](img/F05-08.jpg)\n\n### systemd 单元\n\n`systemd` 进程使用各种配置文件来启动其他进程。你可以在以下目录找到这些配置文件：`/etc/systemd/system`\
  \ 和 `/usr/lib/systemd/system`。\n\n默认配置文件存储在 `/usr/lib/systemd/system` 中。存储在 `/etc/systemd/system`\
  \ 中的自定义文件将覆盖这些文件。不要更改 `/usr/lib/systemd/system` 目录中的文件。任何软件更新可能会覆盖这些文件。\n\n我们已经讨论过*service*（服务）和*target*（目标）单元，但还有更多。表\
  \ 5-4 对所有可用单元类型进行了简要描述。\n\n### 表 5-4 systemd 单元类型\n\n![Images](img/f0198-01.jpg)\n\
  \n检查 `/usr/lib/systemd/system` 目录的内容。每个文件包含一个 systemd 单元的配置，其类型与文件扩展名匹配。例如，`graphical.target`\
  \ 文件定义了图形登录目标单元的配置，而 `rsyslog.service` 文件包含了 `rsyslog` 服务单元的配置。\n\n你可以使用以下命令列出所有活跃的\
  \ systemd 单元：\n\n```\n# systemctl list-units\n```\n\n`list-units` 是可选的，因为它是默认值。如果你想包含非活动（inactive）、维护（maintenance）和失败（failed）的单元，请添加\
  \ `--all` 命令开关。命令输出的片段如图图 5-9 所示。\n\n### 图 5-9 systemd 单元\n\n![Images](img/F05-09.jpg)\n\
  \n第一列列出单元名称，第二列（在图 5-9 中未显示）告知单元是否正确加载。第三列显示单元的状态：active（活跃）、inactive（非活动）、failed（失败）或\
  \ maintenance（维护）。下一列包含更多详细信息。最后，最后一列显示单元的简要描述。\n\n虽然 `systemctl list-units` 命令提供了每个单元状态的运行时快照，但以下命令显示了单元在启动时是启用还是禁用的：\n\
  \n```\n# systemctl list-unit-files\n```\n\n输出示例如图图 5-10 所示。如你所示，单元可以是“enabled”（启用）或“disabled”（禁用）。还有另一种状态，名为“static”（静态），这意味着该单元是启用的且无法手动禁用。\n\
  \n### 图 5-10 已安装的单元文件\n\n![Images](img/F05-10.jpg)\n\n### 虚拟控制台和登录屏幕\n\nLinux 中的登录终端是虚拟终端。大多数\
  \ Linux 系统（包括 RHEL 9）都配置了六个标准命令行虚拟控制台。这些控制台从 1 编号到 6。当配置了 GUI 和登录管理器时，RHEL 9 用图形登录界面替换第一个和第二个虚拟控制台。\n\
  \n这意味着什么？在 Linux 中，你可以通过 ALT 键组合在虚拟控制台之间切换。例如，`ALT-F2` 将你带到第二个虚拟控制台。你可以通过 `ALT-RIGHT\
  \ ARROW` 或 `ALT-LEFT ARROW` 在相邻的虚拟终端之间切换。例如，要从虚拟控制台 2 移动到 3，按下 `ALT-RIGHT ARROW`。如果你在\
  \ GUI 中，加上 `CTRL` 键。所以在 RHEL 9 中，如果安装了 GUI，按下 `CTRL-ALT-F3` 进入第三个虚拟控制台。\n\n当你登录到普通的虚拟控制台时，Linux\
  \ 会返回一个命令行 shell。用户的默认 shell 定义在第 6 章 的 `/etc/passwd` 文件中。\n\n### 认证目标 5.04\n\n\
  ### 通过目标控制\n\n通过 systemd，Red Hat Linux 的服务管理是通过目标（target）实现的。由于 systemd 包含了为了后兼容\
  \ SysVinit 的运行级别（runlevels），你仍然可以使用 `init` 等命令参考表 5-3 中的运行级别。然而，systemd 是高度自定义的。\n\
  \n### 按目标功能\n\n如之前所述，每个的功能列在 `/etc/systemd/system` 和 `/usr/lib/systemd/system` 中的配置文件中。例如，让我们从默认目标开始，带有图形界面的\
  \ RHEL 9 系统中，它是：\n\n![Images](img/f0200-01.jpg)\n\n系统知道 `graphical.target` 是默认目标，得益于从\
  \ `/etc/systemd/system/default.target` 文件到 `/usr/lib/systemd/system` 中 `graphical.target`\
  \ 文件的符号链接。查看这些文件中的一个：\n\n![Images](img/f0200-02.jpg)\n\n![Images](img/job.jpg)\n\
  \n**你也可以使用 `systemctl cat unitname` 命令显示系统单元文件的内容。**\n\n这意味着一个目标可以包含另一个目标。在这种情况下，`graphical.target`\
  \ 是 `multi-user.target` 的超集。在 `multi-user.target` 中的所有 systemd 单元启动后，`graphical.target`\
  \ 会激活 `display-manager.service`，如 `graphical.target` 配置中的 `Wants` 指令所示。\n\n由 `graphical.target`\
  \ 启动的其他服务可能位于 `/etc/systemd/system` 或 `/usr/lib/systemd/system` 中的 `graphical.target.wants`\
  \ 子目录下。在默认 RHEL 9 安装中，我们看到以下文件：\n\n![Images](img/f0201-01.jpg)\n\n### systemd 单元内部\n\
  \n每当系统移动到不同的目标，systemd 单元就会激活。因此，与默认目标相关的单元在启动过程中执行。当你更改目标时，相应的单元也会启动；例如，当从 `graphical.target`\
  \ 运行 `systemctl isolate multi-user.target` 命令时，Linux 会停止由图形目标启动的服务单元。\n\n但你可以直接控制\
  \ systemd 单元。例如，检查 `/usr/lib/systemd/system` 目录下的 `rsyslog.service` 文件内容，如图图 5-11\
  \ 所示。\n\n### 图 5-11 rsyslog 服务单元的配置文件\n\n![Images](img/F05-11.jpg)\n\n\n\n\n\n配置从\
  \ `Unit` 部分开始，该部分包含了服务的描述。接着是服务配置，它包括服务的类型、指向包含某些环境变量文件的指针（这些环境变量用于配置服务的行为）、用于激活服务的主可执行文件，以及一个将服务的所有标准输出发送到\
  \ `/dev/null` 的指令。\n\n最后，`WantedBy` 指令告诉我们，该服务将在系统进入 `multi-user`（多用户）目标时在自启动时被激活。\n\
  \n现在，运行以下命令：\n\n```\n# systemctl status rsyslog.service\n```\n\n如果你指定了一个不带扩展名的单元名称，`systemd`\
  \ 默认认为它是一个服务单元（service unit）。因此，上述命令的简短版本为：\n\n```bash\n# systemctl status rsyslog\n\
  ```\n\n此命令应返回与图 5-12 所示类似的输出，包括服务单元的状态、其主进程 ID（PID）以及最多最近的 10 行日志。如果某些日志行被截断，请使用\
  \ `-l` 选项显示完整内容。\n\n图 5-12 显示服务的状态\n\n![Images](img/F05-12.jpg)\n\n你可以通过运行此类命令停止服务：\n\
  \n```\n# systemctl stop rsyslog.service\n```\n\n或者，可以使用 `systemctl` 命令配合表 5-5 中所示的选项；例如，以下命令可以在不停止或启动服务的情况下重新加载\
  \ SSH 配置文件：\n\n表 5-5 systemctl 服务控制命令\n\n![Images](img/f0203-01.jpg)\n\n```\n# systemctl\
  \ reload sshd.service\n```\n\n### 服务配置\n\n`systemctl` 命令为你提供了一种为默认目标启用服务的简单方法。首先，尝试运行以下命令：\n\
  \n![Images](img/f0203-02.jpg)\n\n这将产生与图 5-10 相似的输出，但仅限于服务单元。你将看到系统中所有安装服务的完整列表，以及它们在自启动时的激活状态。\n\
  \n`systemctl` 命令还可以执行更多操作。通过该命令，你可以更改特定服务的启动状态。例如，在一个安装了 Postfix 邮件服务器的系统中，运行以下命令检查\
  \ Postfix 服务是否已配置为自启动：\n\n![Images](img/f0203-03.jpg)\n\n等效命令为：\n\n![Images](img/f0203-04.jpg)\n\
  \n这表示 Postfix 邮件服务器已配置为在默认目标中启动。如果你想确保 Postfix 服务不在默认目标中启动，请执行以下命令：\n\n![Images](img/f0203-05.jpg)\n\
  \n再次运行 `systemctl list-unit-files` 命令以确认更改。要恢复为默认目标启用，请运行相同的命令并将 `disable` 替换为 `enable`，如下所示：\n\
  \n![Images](img/f0204-01.jpg)\n\n当你启用一个服务时，`systemctl enable` 命令会在 `/etc/systemd/system/multi-user.target.wants`\
  \ 目录下创建一个符号链接，该链接指向 `/usr/lib/systemd/system` 中对应的单元配置文件。如果你需要，可以通过在适当的 systemd\
  \ 目录中创建符号链接来手动启用或禁用服务。然而，使用 `systemctl` 是首选方法，因为它不容易出错。\n\n当服务被禁用时，你仍然可以通过 `systemctl\
  \ start` 和 `stop` 命令手动启动和停止它。这意味着 `systemctl disable` 命令并不能防止用户意外启动服务。如果你想在自启动时禁用服务单元并确保它不再能被启动，你应该使用\
  \ `mask` 命令，如下所示：\n\n![Images](img/f0204-02.jpg)\n\n所示，该命令在 `/etc/systemd/system`\
  \ 中创建一个名为 `postfix.service` 的符号链接，该链接指向 `/dev/null`。`/etc/systemd/system` 中的配置文件始终高于\
  \ `/usr/lib/systemd/system` 中对应的文件。因此，结果是 `/usr/lib/systemd/system` 中的默认 `postfix.service`\
  \ 文件被 `/etc/systemd/system` 中指向 `/dev/null` 的符号链接“掩蔽”（masked）。\n\n### 认证目标 5.05\n\
  \n### 时间同步\n\n网络时间协议 (NTP) 客户端的配置非常直观。本节提供了配置文件和相关命令工具的概述。\n\n让不同的系统运行在同一时钟上有充分的理由。例如，Web\
  \ 服务器和客户端在不同的时间登录，将使故障排除变得极其困难。许多服务依赖于准确的时间戳。例如，时间偏移超过五分钟会导致 Kerberos 客户端身份验证失败。\n\
  \nRHEL 9 包含的时间同步守护进程是 `chronyd`。它取代了 RHEL 7 及之前包含的 `ntpd`。与 `ntpd` 相比，`chronyd`\
  \ 有一些独特之处，无论安装在始终连接网络的系统（如服务器）还是虚拟或移动系统中，都能保持准确的时间。在描述 `chronyd` 的配置之前，我们将先解释如何配置时区。\n\
  \n### 时区配置\n\n每个系统（无论是物理还是虚拟）都有一个内部时钟。RHEL 9 的安装过程通常会将硬件时钟设置为本地时间。然而，UTC（即格林尼治标准时间）通常是服务器的最佳设置，以避免夏令时切换的问题。\n\
  \n与其手动设置时区的符号链接，不如使用 `timedatectl` 工具。如果你不带参数运行该命令，它将显示时间、时区和 NTP 状态的摘要。示例输出见图 5-13。\n\
  \n图 5-13 日期和时间设置\n\n![Images](img/F05-13.jpg)\n\n你可以运行以下命令列出所有时区：\n\n```\n# timedatectl\
  \ list-timezones\n```\n\n然后，要切换到不同的时区，运行带有 `set-timezone` 参数的 `timedatectl`。例如：\n\
  \n```\n# timedatectl set-timezone America/Los_Angeles\n```\n\n### 使用 chronyd 同步时间\n\
  \n`chronyd` 的默认配置文件 `/etc/chrony.conf` 设置为连接到 NTP 项目的公共服务器池。协作使用守护进程可以减少时间误差。\n\n\
  ```\npool 2.rhel.pool.ntp.org iburst\n```\n\n某些 RHEL 版本（如部署在云环境中）可能会使用不同的 NTP 服务器。此处所示的\
  \ `iburst` 配置选项可以加快 chronyd 服务启动时的初始同步速度。\n\n要配置 `chronyd` 与不同的 NTP 服务器同步，只需修改 `/etc/chrony.conf`\
  \ 中的 `server` 指令并重启 `chronyd`：\n\n```\n# systemctl restart chronyd\n```\n\n不要忘记配置\
  \ `chronyd` 在自启动时启动：\n\n```\n# systemctl enable chronyd\n```\n\n你可以使用 `chronyc sources\
  \ -v` 命令显示有关当前时间源的信息。示例见图 5-14。\n\n图 5-14 NTP 服务器统计\n\n![Images](img/F05-14.jpg)\n\
  \n![Images](img/exam.jpg)\n\n使用默认配置启用并启动 `chronyd` 的快速方法是运行命令 `timedatectl set-ntp\
  \ true`。\n\n## 认证总结\n\n本章涵盖了 RHEL 系统的基础启动过程。它从硬件 POST 开始，继续到 BIOS 或 UEFI 系统。一旦找到启动介质，就会进入\
  \ GRUB 2 引导程序的第一阶段。GRUB 2 菜单允许你选择并自定义要启动的内核。\n\n\n\n\n\n一旦你选择了一个选项，`GRUB 2` 就会将控制权交给内核。内核加载一个名为初始\
  \ RAM 磁盘的临时文件系统。然后加载必要的驱动程序和文件系统，内核执行第一个进程，称为 `systemd`。\n\nLinux 服务由 `systemd`\
  \ 目标（targets）控制，这些目标将其他 `systemd` 单元组合在一起。默认目标被配置为 `/etc/systemd/system` 目录下的符号链接，而单元配置文件存储在该目录以及\
  \ `/usr/lib/systemd/system` 目录。你可以使用 `systemctl` 命令来配置和查询这些 `systemd` 单元的状态。`systemd`\
  \ 目标链接到其他目标以及单元配置文件。`systemctl` 还可以用于启动、停止、重启、重载 `systemd` 单元等等操作。\n\n你可能需要将本地系统配置为\
  \ NTP 客户端。RHEL 9 中的默认 NTP 服务是 `chronyd`。\n\n## ![Images](img/right-a.jpg) 两分钟演练\n\
