  \n![Images](img/f0375-03.jpg)\n\n如下所示，`atq` 命令用于检查当前 `at` 作业的状态。所有待处理的作业都会列在 `atq`\
  \ 命令的输出中。\n\n![Images](img/f0375-04.jpg)\n\n如果作业出现问题，你可以使用 `atrm` 命令将其删除。例如，你可以使用以下命令删除标记为\
  \ job 1 的指定作业：\n\n![Images](img/f0375-05.jpg)\n\n## 安全 cron 和 at\n\n你可能不希望每个人都能在半夜运行作业。你可能还出于安全考虑限制此操作。用户可以在\
  \ `/etc/cron.allow` 和 `/etc/cron.deny` 文件中配置。如果这两个文件都不存在，`cron` 的使用将限制为 root 用户。如果\
  \ `/etc/cron.allow` 文件存在，则只有文件中列出的用户允许使用 `cron`。如果没有 `/etc/cron.allow` 文件，则只有 `/etc/cron.deny`\
  \ 中列出的用户不能使用 `cron`。\n\n这些文件的格式为每个用户一行；如果你在 `/etc/cron.deny` 中包含以下条目，且 `/etc/cron.allow`\
  \ 文件不存在，则 elizabeth 和 nancy 不被允许设置自己的 cron 脚本：\n\n![Images](img/f0376-01.jpg)\n\n\
  然而，如果 `/etc/cron.allow` 文件存在且相同的用户列表，则其具有优先级。在这种情况下，elizabeth 和 nancy 都被允许设置自己的\
  \ cron 脚本。各种可能的结果总结在 表 9-7 中。\n\n### 表 9-7 cron.allow 和 cron.deny 的安全影响\n\n![Images](img/f0376-02.jpg)\n\
  \n`at` 系统的用户安全性几乎相同。相应的安全文件为 `/etc/at.allow` 和 `/etc/at.deny`。各种可能的结果总结在 表 9-8 中。\n\
  \n### 表 9-8 at.allow 和 at.deny 的安全影响\n\n![Images](img/f0376-03.jpg)\n\n如果你对安全非常敏感，那么在\
  \ `/etc/cron.allow` 和 `/etc/at.allow` 文件中仅包含需要的用户可能是合适的。否则，服务账户漏洞可能允许“黑帽”黑客从关联账户运行\
  \ `cron` 或 `at` 脚本。\n\n## 认证目标 9.04\n\n### Bash 脚本\n\n正如本章前面讨论的，RHEL 9 包含了一些由 `cron`\
  \ 守护进程调度的系统维护脚本。这些脚本位于 `/etc/cron/` 目录下的各种文件中。我们将分析其中一些脚本以引入 bash shell 的基础知识，并涵盖一些循环和条件结构。随后，你将拥有创建简单\
  \ shell 脚本所需的技能。Bash 是 Bourne-again shell 的缩写，是一种由 Brian Fox 为 GNU 项目开发的 Unix shell\
  \ 和命令语言，用作与 Unix 一分发的原始 Bourne shell (`sh`) 的免费替代品。它提供了一个命令行界面，用于控制和与你的 RHEL 操作系统进行交互，并允许你创建脚本来自动执行一系列复杂的命令。\n\
  \n#### 这里的“Hello, World”的脚本\n\n任何 bash 脚本的关键部分都是 shebang。shebang 是字符串 `#!/bin/bash`，它是一种特殊的注释，告诉操作系统应该使用哪种解释器来执行脚本。它必须是脚本的第一行。要编写一个简单的“Hello,\
  \ World”脚本，创建一个文件（例如 `my_script.sh`），并复制以下内容：\n\n![Images](img/f377-01.jpg)\n\n\
  在脚本中，`#!/bin/bash` 表示应使用 bash 运行脚本，而 `echo \"Hello, World\"` 则在终端打印“Hello, World!”。\n\
  \n在 RHEL 上，`/bin/sh` 路径符号链接到 `/bin/bash`。这意味着使用 `/bin/sh` 或 `/bin/bash` 将得到相同的结果。\n\
  \n![Images](img/job.jpg)\n\n某些 Unix 系统和 Linux 发行版将 `/bin/sh` 连接到 bash 的 shell。除非脚本中指定了\
  \ `#!/bin/bash`，否则它可能无法迁移。\n\n要运行脚本，首先需要使其具有可执行权限。你可以通过 `chmod` 命令来实现：\n\n```bash\n\
  $ chmod +x my_script.sh\n```\n\n然后，你可以这样执行：\n\n```bash\n$ ./my_script.sh\n```\n\n\
  如果你尝试运行一个不可执行的脚本，将得到下面的错误：\n\n![Images](img/f378-01.jpg)\n\n因此，如果你遇到上述错误，请为脚本添加执行权限：\n\
  \n```bash\n# chmod +x /usr/local/bin/myscript\n```\n\n每个 bash 脚本或命令在结束运行时返回一个退出值。这个数值表示脚本是执行成功还是遇到了错误。按照约定，退出值为\
  \ 0 表示成功，任何其他值都表示错误。你可以使用 `exit` 命令设置脚本的退出值。例如，`exit 0` 表示成功，`exit 1` 表示错误。如果没有提供\
  \ `exit` 命令，脚本的退出值将是最后一个命令的退出值。\n\n#### Bash 变量\n\n你可以在 bash 中使用变量来存储数据。虽然在 bash\
  \ 中通常使用大写字母编写变量名，但请记住变量名不能以数字开头。下面的示例说明了如何从命令行分配变量：\n\n```bash\n# today=4\n```\n\
  \n\n\n在赋值变量时，注意不要在等号（`=`）字符周围添加空格。要显示变量的值，请使用 `echo` 命令并在变量前加上美元符号（`$`）：\n\n![Images](img/f0378-04.jpg)\n\
  \n你也可以在变量名周围加上大括号以避免歧义的表达式。例如，如果不加大括号，以下命令将获取变量 `$todayth` 的值，而不是 `$today` 的值：\n\
  \n![Images](img/f0378-05.jpg)\n\n你可以将变量作为算术表达式的一部分。在 `bash` 中，算术表达式包含在 `$(((expression)))`\
  \ 语法中。这里有一个示例：\n\n![Images](img/f0378-06.jpg)\n\n但不仅如此。变量还可以存储命令的输出。有两种方法可以实现：使用\
  \ `$(command*)` 语法和使用反引号 `` `command` ``。以下是每种方法的示例：\n\n![Images](img/f0379-01.jpg)\n\
  \n## 变量的作用域\n\n在上一个示例中，我们看到在 `bash` 中声明的变量可以作为参数传递给其他命令。但这些变量对其他脚本可用吗？例如，创建一个包含以下行的脚本：\n\
  \n![Images](img/f0379-02.jpg)\n\n将内容保存到文件（例如，`testvar`），赋予其执行权限，为 `myvar` 赋值一个值，然后运行该脚本：\n\
  \n![Images](img/f0379-03.jpg)\n\n脚本的输出是空的，因此 `myvar` 的值对脚本是不可用的。要在任何命令中使用 shell\
  \ 变量，你需要将这些变量导出为*环境变量*，如下所示：\n\n![Images](img/f0379-04.jpg)\n\n然后，如果你再次运行该脚本，你会发现\
  \ `myvar` 变量的值现在被传递给了脚本：\n\n![Images](img/f0379-05.jpg)\n\n环境变量通常声明在用户主目录下的 `~/.bashrc`\
  \ 文件或 `~/.bash_profile` 文件中，或者在相应的全局文件 `/etc/basrhc` 或 `/etc/profile` 中。其中一个例子是\
  \ `LANG` 环境变量，它告诉程序使用哪种语言和本地设置。\n\n环境变量对于定义应该对所有程序全局可用的变量非常有用。然而，如果你想向程序传递经常变化的参数，它们就不那么实用了。为了这个目的，你可以使用命令行参数或位置参数。\n\
  \n## Bash 中的参数\n\n在 `bash` 中，*参数*（parameter）是可以存储值的东西。因此，变量就是一个参数。它实际上是一种由名称表示的参数类型。然而，还有两种类型的参数：\n\
  \n![Images](img/square.jpg)\n\n**特殊参数**：这些参数由特殊字符表示，每个字符都有特定的含义。例如，特殊参数 `$?` 存储上一次执行命令的退出状态。\n\
  \n![Images](img/square.jpg)\n\n**位置参数**：一系列从 `$0` 到 `$9` 的参数，用于存储命令行参数。\n\n一些最常见的特殊和位置参数列在表\
  \ 9-9 中。\n\n表 9-9 特殊和位置参数\n![Images](img/f0380-01.jpg)\n\n## 参数扩展\n\n变量的值可以使用某些称为*参数扩展*（parameter\
  \ expansion）的替换技术进行处理。为了说明这些概念，按所示定义一个变量：\n\n```\nch9=/home/mike/studyguide/ch9.gz\n\
  ```\n\n第一个参数扩展结构是 `${parameter:-word}`。如果参数已定义，则给出 `${parameter}` 的值；否则替换为 `word`：\n\
  \n![Images](img/f0380-03.jpg)\n\n另一个有用的参数扩展结构是 `${parameter/pattern/string}`。它将\
  \ `pattern` 的最长匹配项替换为 `string`。例如，假设你想将存储在 `ch9` 中的文件名从 `.gz` 扩展改为 `.tar.gz`：\n\n\
  ![Images](img/f0380-04.jpg)\n\n你可以使用参数扩展序列 `${parameter#word}` 和 `${parameter##word}`\
  \ 删除匹配的后缀。它们分别从 `parameter` 值的开头开始搜索，删除 `word` 的最短或最长出现情况。下所示是一个示例：\n\n![Images](img/f0381-02.jpg)\n\
  \n同样，参数扩展序列 `${parameter%word}` 和 `${parameter%%word}` 会删除最短或最长的 `word` 出现情况，但是从\
  \ `parameter` 值的末尾开始搜索。在这里说明了这一点：\n\n![Images](img/f0381-03.jpg)\n\n参数扩展的总结如表 9-10\
  \ 所示。\n\n表 9-10 参数扩展\n![Images](img/f0381-01.jpg)\n\n### Bash 控制结构\n\n脚本中充满了各种命令结构。某些命令组仅在满足条件时执行。另一些命令组织在循环中，只要满足条件就会继续运行。这些命令结构也称为*条件和控制结构*。常用命令包括\
  \ `for`、`if` 和 `test`。循环的结束可以使用 `done` 或 `fi` 等关键字标记。某些命令只存在于其他命令范围内，将在小节中描述。\n\n\
