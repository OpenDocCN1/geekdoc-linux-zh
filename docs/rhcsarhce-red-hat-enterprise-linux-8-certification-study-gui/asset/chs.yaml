  \n# 第 10 章\n\n## 容器简介\n\n### CERT 认证目标\n\n- 10.01 容器技术基础\n- 10.02 容器入门\n- 10.03\
  \ 构建和使用容器镜像\n- 10.04 管理容器\n\n![Images](img/tick1.jpg) 两分钟演练](#ch01.xhtml_lev1sec1)\n\
  \n问答自测\n\nIT 世界处于不断演变中，新技术不断涌现并重塑我们处理任务和解决问题的方式。其中一种变革性技术是使用容器，它是当今 DevOps 架构和云部署的基础组件。这种演变在\
  \ RHEL 9 的 RHCSA 考试中显而易见，最新的考试目标将管理容器作为一项重要的新知识和能力领域引入。\n\n从功能上，容器与虚拟机 (VMs) 相似之处在于它们都提供了具有独立网络接口、文件系统和资源控制的隔离环境。然而，根本区别在于容器不维护自己的操作系统。这导致容器显著轻量化且启动速度更快。此外，在给定的主机上，它们可以比传统虚拟机容纳更多的应用程序，使其成为一种高效且资源友好的选择。\n\
  \n本章通过讨论容器的一般概念并与虚拟机进行比较来提供概述。在建立了基础理解后，本章将引导你部署第一个容器。随后，你将探索镜像和仓库的工作原理。\n\n接下来，你将详细了解容器管理以及如何作为服务运行容器，这是部署中的重要技能。本章的最后部分深入探讨为容器挂载持久存储，以确保数据的性。让我们开始这段容器艺术之旅吧！\n\
  \n### 考试内部\n\n#### 容器技术基础\n\n初始部分虽然没有直接关联考试目标，但为理解容器这一核心概念奠定了重要基础。在这里，我们深入探讨容器兴起的原因。通过与虚拟机的类比和比较，本节提供了容器技术的全面介绍。\n\
  \n#### 容器入门\n\n考试目标强调 Podman 的基础和高级方面，Podman 是一种在 Red Hat Enterprise Linux 上开发、管理和运行容器的开源工具。启动第一个容器引入了基本的\
  \ Podman 命令，为后续主题的深入探索奠定了基础。\n\n这里相关的 RHCSA 考试目标包括：\n\n- ![Images](img/square.jpg)\
  \ 执行基础容器管理，如运行、启动、停止和列出运行中的容器\n- ![Images](img/square.jpg) 在容器内运行服务\n\n#### 构建和使用容器镜像\n\
  \n从远程仓库检索容器镜像和构建容器镜像是容器世界的必备技能。本节涵盖的 RHCSA 考试目标为：\n\n- ![Images](img/square.jpg)\
  \ 从远程仓库查找并检索容器镜像\n- ![Images](img/square.jpg) 容器镜像\n- ![Images](img/square.jpg)\
  \ 从 Containerfile 构建容器\n\n#### 管理容器\n\nRHCSA 考试目标还关注高级 Podman 命令，扩展了之前介绍命令的深入回顾。配置容器作为系统服务自动启动是自动化部署的一个关键方面，考试也涵盖了这一内容。\n\
  \n\n\n\n\n# 认证目标 10.01\n\n## 容器技术基础\n\n本节全面概述了为什么容器已成为简化开发周期、降低运营成本以及简化复杂 IT 环境的不可或缺的工具。通过与虚拟机（VM）的对比和区别，本节明确了容器的独特优势和功能。\n\
  \n### 容器技术的兴起\n\n在软件开发和 IT 运营的世界中，一直存在着难以维持的平衡：开发者总是渴望快速发布新功能或改进，而 IT 运营团队则需要确保他们所管理的系统保持稳定可靠。这种在快速变化与稳定运行之间的寻求平衡行动，导致了名为\
  \ `DevOps` 的方法的诞生。\n\nDevOps 是一种将开发人员和运营团队结合的工作方式。它的核心在于让软件的创建和发布过程变得更快、更高效，同时不会对运行软件的系统产生问题。然而，即使采用最佳的\
  \ DevOps 实践，也可能面临挑战。其中一些包括确保软件在不同系统中的行为一致、让目标不同的团队能够良好协作，以及思考如何安全、快速地发布新软件功能。\n\n\
  容器可以帮助解决其中的一些 DevOps 挑战。通过容器，开发者可以将应用程序及其运行所需的所有内容（如软件库）封装成一个整洁的包。这意味着应用程序可以在不同的地方以相同的方式运行，无论是在开发者的个人电脑上，还是数据中心的大型计算机系统上。\n\
  \n你可以将容器想象成小盒子，它们将应用程序安全地相互隔离，类似于虚拟机。但与需要独立操作系统运行的虚拟机不同，容器共享它们运行所在机器的操作系统，这意味着它们使用的资源更少，并且可以快速启动和关闭。\n\
  \n容器之所以至关重要的另一个原由于它们在微服务架构中的作用，微服务架构是一种设计软件应用程序的方法。在微服务架构中，应用程序被拆分为更小的、独立的各个，每个部分执行特定的任务。这些微小部分（即\
  \ `microservices`）可以独立地进行开发、更新和扩展，这使得整个应用程序更加灵活且易于管理。容器为微服务提供了完美的环境，因为容器可以被独立地封装和运行每个微服务，无论该微服务部署在何处。\n\
  \n因此，容器就像一个包含一个或多个软件进程的小泡泡。这些进程与系统中的其他所有内容保持隔离。容器提供了与虚拟机类似的某些优势，如安全性和隔离，但它们需要的硬件能力更少，启动和停止也更快。这使得它们成为现代软件开发的绝佳工具，因为速度和灵活性是关键。\n\
  \n以下是容器的一些关键优势：\n\n![Images](img/square.jpg) **敏捷性** 容器实现了应用的快速部署和扩展。可以在秒级创建、复制或删除。\n\
  \n![Images](img/square.jpg) **可移植性** 封装在容器中的应用程序可以在各种平台和环境中一致运行，减少了“在我的机器上可以运行”的问题。\n\
  \n![Images](img/square.jpg) **效率** 容器共享宿主机系统内核，使其比虚拟机轻得多。这使得在相同硬件上可以运行更多的应用程序，提高了效率。\n\
  \n![Images](img/square.jpg) **隔离性** 每个容器都独立于其他容器运行，降低了系统性故障的风险。\n\n![Images](img/square.jpg)\
  \ **版本控制和组件复用** 容器支持版本控制，你可以在不同团队之间共享或复用容器镜像，改进了整个开发流程。\n\n![Images](img/square.jpg)\
  \ **安全性** 每个容器都与其他容器及宿主机系统隔离，提供了额外的安全层。\n\n当我们在接下来的章节中进一步深入研究容器的复杂性时，这些优势将变得愈发明显。\n\
  \n### 虚拟化与容器\n\n虚拟化技术允许我们创建类似于其物理对应物的服务，但实际上绑定到任何特定的物理设备。虚拟机和容器都是虚拟化的形式，但它们在结构和功能上有显著差异。\n\
  \n虚拟机提供名为`硬件虚拟化`的虚拟化类型，如图 10-1 所示。这种形式的虚拟化抽象了物理主机资源（如 CPU、内存和存储），创建一个像真实计算机一样拥有自己操作系统的虚拟机。\n\
  \n图 10-1 虚拟机对比容器\n\n![Images](img/F10-01.jpg)\n\n这种抽象由被称为 `hypervisor`（虚拟机监控程序）或虚拟机监控器的专用软件管理。该软件直接运行在服务器的硬件上，负责管理每个虚拟机的资源。虚拟机监控程序有两种类型，如第\
  \ 1 章所示：第 1 型虚拟机监控程序直接运行在系统硬件（裸金属）上，而第 2 型虚拟机监控程序运行在宿主机操作系统上。\n\n每个虚拟机都运行着自己的操作系统实例，可以是\
  \ `Linux`、`Windows` 或其他。在每个虚拟机内部，库和应用程序本身被安装并运行，就像它们在一个独立的计算机系统上运行一样。\n\n相比之下，容器是一种更轻量级的虚拟化形式。如图\
  \ 10-1 所示，容器并不运行自己的操作系统。相反，它们共享宿主机的操作系统内核。\n\n容器的架构是多个关键 Linux 特性的奇妙结合，专门设计用于提供进程和资源隔离。这些特性——命名空间（namespaces）、控制组（control\
  \ groups）和 `SELinux`——协同工作，创建了如今许多开发者和组织赖的容器环境。\n\n\n\n\n\n`Namespaces`（命名空间）的核心是\
  \ Linux 内核的一项功能，用于管理各种系统资源的可见性。想象一个进程组只能“看到”系统的某些方面，例如进程 ID (PIDs)、文件系统和网络接口。通过在不同的进程组之间隔离这些资源，命名空间为每组进程创建了一个独特的“幻象”，让它们认为自己正运行在独立的隔离环境中。这是容器实现进程和文件系统相互隔离的基础性。\n\
  \n虽然命名空间侧重于资源的可见性，但 `control croups (cgroups)` 的引入则用于控制系统资源的实际使用情况。如果说命名空间关乎“看到”，那么\
  \ cgroups 则关乎“使用”。它们对不同进程组之间的 CPU、内存、网络带宽和磁盘 I/O 实施限制并管理分配。这在容器环境中至关重要，因为它确保了每个容器都能获得公平的资源份额，并防止单个贪婪的容器导致整个系统停滞。\n\
  \nSELinux 为该架构添加了另一层保障，构建了稳健的安全机制。SELinux 以其强制访问控制 (MAC) 的实现而闻名，它允许对系统中的每个进程和文件进行细粒度的权限控制。在容器语文中，这具有极大优势，因为它限制了每个容器可以执行的操作，并在发生容器逃逸时有助于限制“影响半径”。\n\
  \n跳出底层的 Linux 特性，让我们来看看在实际操作中让容器成为可能的因素：`container image`（容器镜像）。镜像就像容器的蓝图；它将软件应用程序、依赖项以及一些配置细节封装进单个对象中。当此镜像在容器运行时（如\
  \ Podman 或 Docker）上执行时，它就会“活”起来并变成一个运行中的容器。拥有这样的镜像至关重要，因为它保证了相同的环境可以在任何地方复制，无论是在开发者的笔记本电脑还是生产服务器上。\n\
  \n但这些镜像是如何标准化并实现可移植性的呢？这就是开放容器倡议 (OCI) 的用武之地。这是一个旨在为容器平台制定通用标准的开源项目。OCI 主要侧重于定义容器镜像和运行时的规范，促进互操作性并防止供应商锁定，让开发者更容易在不同环境中构建和部署容器。\n\
  \n最后，就像代码库需要仓库一样，容器镜像也需要一个存储位置，被称为 `container registry`（容器仓库）。仓库是一个在线库，可以在其中存储、检索和共享容器镜像，从而促进封装为容器的应用程序的分发。示例包括\
  \ Docker Hub、Google Container Registry 和 Quay.io。\n\n简而言之，容器架构是这些稳健的 Linux 特性、标准化容器镜像以及高效容器仓库的结合，它们共同工作提供了容器化应用程序的力量。\n\
  \n## Docker 和 Podman\n\nDocker 通常被归功于容器技术的普及推动者，尽管在 Docker 诞生之前，容器的概念在 Linux 世界已经存在了多年。Docker\
  \ 由一家名为 dotCloud 的公司于 2013 年首次发布，旨在简化并加速应用程序的开发、交付和运行过程。Docker 使用容器将应用程序及其整个运行时环境进行封装和隔离，使其能够在不同系统之间进行迁移。Docker\
  \ 的易用性和高效的工作流使其迅速赢得了人气和繁荣的用户社区。\n\n然而，Docker 的架构并非完美无缺。Docker 的一个关键设计特性是它依赖于一个中心化的守护进程\
  \ (daemon)。该守护进程以 root 权限运行，构成了潜在的安全风险。此外，Docker 守护进程处理所有与 Docker API 的交互，在分布式系统中创建了潜在的单点故障和复杂性。\n\
  \n针对这些挑战，红帽（Red Hat）开发了 Podman。Podman 引入于 2018 年左右，通过提供无守护进程 (daemonless) 和无根 (rootless)\
  \ 的容器引擎解决了 Docker 的某些安全和设计问题。换句话说，Podman 不需要持续运行的高权限后台进程来管理容器。相反，Podman 将容器和容器化服务启动为子进程，增强了安全性并减少了攻击面面。\n\
  \n此外，Podman 的 rootless 特性允许非权限用户管理容器，进一步降低了安全风险。此外，Podman 与系统级功能提供了更好的集成，例如用于服务管理的\
  \ systemd、用于资源限制的 cgroups 以及用于安全的 SELinux，这与传统的 Unix 哲学更加得更加契合。\n\n尽管存在这些差异，Podman\
  \ 的设计在命令上与 Docker 兼容，这意味着大多数 Docker 命令在 Podman 中的工作方式完全相同，这使得用户从 Docker 迁移到 Podman\
  \ 变得更容易。随着行业对安全和效率的日益关注，Podman 为 Docker 提供了一个可行且安全的替代方案，同时保持了 Docker 的易用性和灵活性。\n\
  \n## 认证目标 10.02\n\n## 容器入门\n\n在本节中，我们将引导你使用 Podman 启动第一个容器，Podman 是一个用于红帽企业 Linux\
  \ 上开发、管理和运行容器的开源工具。此初始章节介绍了几个基础的 Podman 命令，每个命令将在后续章节中进行更深入的探讨。\n\n### 安装容器工具\n\n\
  在 RHEL 9 上开始使用容器是从安装 `container-tools` 元软件包 (meta-package) 开始的。`元软件包` 本身不包含任何工具，而是作为安装一组相关软件包的方便方法。使用\
  \ `dnf` 命令安装 `container-tools` 元软件包：\n\n```bash\n# dnf install container-tools\n\
  ```\n\n`container-tools` 包含的关键软件包之一是 Podman，它是一个无守护进程的容器引擎，负责开发、管理和运行 OCI 容器和容器镜像。如果系统中尚未安装\
  \ Podman，安装 `container-tools` 元软件包将确保它被添加。\n\n`container-tools` 元软件包还会触发一个名为 `docker`\
  \ 脚本的安装。该脚本充当 `podman` 的包装器，允许你像使用 Docker 那样使用 `docker` 命令，而实际上是 Podman 在后台管理你的容器。\n\
  \n另一个伴随 `container-tools` 元软件包一起的重要工具是 Skopeo。Skopeo 是一个专为容器镜像和仓库的各种操作设计的命令行工具，无需拉取镜像或创建容器。这包括直接在\
  \ Docker 仓库上检查镜像、复制、删除或签名镜像。Skopeo 与 OCI 镜像和原始 Docker 镜像格式和谐工作。\n\n如果没有 Buildah，`container-tools`\
  \ 元软件包将是不完整的。Buildah 是一个用于构建 OCI 容器镜像的专用命令行工具。Buildah 提供了一种灵活的方法，可以在不需要完整的容器运行时或守护进程的情况下创建容器镜像。Podman\
  \ 在在后台使用 Buildah 来构建容器镜像。\n\n### 运行你的第一个容器\n\n现在已经安装了所有先决工具，是时候演示如何启动容器了。在演示中，我们将运行一个托管\
  \ Apache 2.4 Web 服务器的容器：\n\n![Images](img/f0413-01.jpg)\n\n\n\n\n执行命令后，你应该能看到与图\
  \ 10-2 所示类似的输出。如果一切运行正常，将浏览器指向[`localhost:8080`](http://localhost:8080)应该显示 Web\
  \ 服务器的测试页面，如图 10-3 所示。\n\n图 10-2 创建并运行容器\n\n![Images](img/F10-02.jpg)\n\n图 10-3\
  \ Apache Web 服务器的测试页面\n\n![Images](img/F10-03.jpg)\n\n上述命令执行了多项任务。首先，它检查本地环境中是否存在\
  \ `httpd-24` 镜像。如果本地没有该镜像，Podman 将从 Red Hat 注册表（registry）检索该镜像，该操作等同于以下命令：\n\n```\n\
  ![Images](img/f0414-01.jpg)\n```\n\n获取镜像后，`podman run` 命令根据 `httpd-24` 镜像启动一个名为“webserver”的新容器。`-d`\
  \ 标志指定离分离模式（detached mode），确保容器在后台运行，从而不占用当前的终端或 shell 会话。\n\n当容器内需要通过特定端口访问的服务时，你可以利用\
  \ `-p` 参数来暴露特定端口。通过使用 `-p 8080:8080`，你是在指示 Podman 在主机上开启 8080 端口，并将该端口上的所有入流量路由到容器内部的\
  \ 8080 端口。\n\n```\n![Images](img/job.jpg)\n```\n\n**较新版本的 Docker 和 Podman 引入了根据用法对特定命令进行分组。例如，`podman\
  \ container` 分组了所有与容器管理相关的命令，而 `podman container run` 等同于更简单的 `podman run`。尽管如此，Podman\
  \ 保持了后兼容性；因此，新版本的命令与其传统命令并存。**\n\n在下载 `httpd-24` 镜像并使其本地可用后（你可以通过 `podman images`\
  \ 命令确认这一点），通过 `podman ps` 命令可以查看所有处于运行状态的容器，如图 10-4 所示。\n\n图 10-4 查看运行中的容器\n\n![Images](img/F10-04.jpg)\n\
  \n`podman run` 命令的输出以 Podman 为管理容器而生成的唯一 ID 结尾。例如，你可以使用以下命令停止容器：\n\n```\n$ podman\
  \ stop a8b\n```\n\n其中“a8b”是唯一 ID 的前三个字符。为了方便起见，Podman 不需要整个 ID，只需要前几个字符即可。或者，你也可以通过给定的名称引用容器，如下所示：\n\
  \n```\n$ podman stop webserver\n```\n\n请记住，默认情况下 `podman ps` 命令仅列出运行中的容器。要显示已停止的容器，请使用\
  \ `-a` 标志：\n\n```\n$ podman ps -a\n```\n\n完成容器操作后，进行清理是一个良好的习惯。你可以使用 `podman rm\
  \ webserver` 停止的容器，并使用 `podman rmi httpd-24` 删除其对应的镜像。\n\n### 无根（Rootless）容器与有根（Rootful）容器\n\
  \n到目前为止，我们一直以非特权用户的身份运行容器。在容器技术术语中，这通常被称为运行“无根”容器。相反，当容器由 root 用户或具有同等权限的用户运行时，它们被称为“有根”容器。让我们深入探讨这些概念。\n\
  \n顾其名，有根容器是由 root 用户或同等特权的用户运行的。这种设置赋予了这些容器广泛的能力，使其能够充分利用宿主机系统的资源和功能。然而，这种强大的访问权限也带来了巨大的潜在风险。配置上的失误或容器漏洞可能会引发严重的安全漏洞。有根容器的无限制性质可能会让整个宿主机系统暴露在攻击之下。\n\
  \n相比之下，无根容器是更安全的方案，它们由非 root 用户运行，不具备任何特权。它们提供了一个更受限、受控的环境，限制了容器与宿主机系统交互的能力。这显著减少了破坏主机的潜在风险，使其成为优先安全的首选。\n\
  \n运行无根容器就像在沙箱中玩耍。你可以在沙箱内任何任何你想做，而不会影响周围的乐场。这就是为什么在大多数情况下，无根容器是最佳选择。它们在保持系统安全的同时提供了你所需的功能。\n\
  \n然而，在某些情况下，有根容器是必要且有利的。例如，当需要直接与特定系统资源交互，或者你需要监听低于 1024 的网络端口（这些端口对非 root 用户限制）时，有根容器可能是最可行的选择。\n\
  \n在无根和有根容器之间做出决定时，必须考虑操作的具体需求，并将其与潜在的安全影响之间取得平衡。通过这样做，你可以确保最佳结果，无论你的重点是利用功能、确保安全，还是在两者之间寻找平衡。\n\
  \n### 认证目标 10.03\n\n### 构建和使用容器镜像\n\n在本节中，我们将深入研究容器仓库和容器镜像的构建。容器仓库是容器生态系统中不可或的一部分，作为容器镜像的存储和分发中心。了解如何与这些仓库交互，包括如何推送（push）、拉取（pull）和定位镜像，是任何容器从业人员的基本技能。同时，构建自己的容器镜像可以让你对容器环境进行精确控制，从而创建完美符合你需求的定制解决方案。\n\
  \n#### 镜像仓库\n\n镜像仓库是基于容器的开发和部署的关键组件。它作为容器镜像的存储和分发系统，允许开发者发布他们的作品，让其他人拉取并使用这些镜像。镜像可以进行扩展和版本控制，便于有效管理。根据需求，仓库可以是公共的（任何人都可以访问）、私有的（限制于某些用户或组织）或两者的混合体。\n\
  \n`podman images` 命令显示所有已下载并当前存储在本地机器上的镜像。然而，这些镜像最初必须从仓库获取。当你调用 `podman info` 命令时，它会输出关于\
  \ Podman 的各种配置细节，包括当前配置的仓库，如图 10-5 所示。可以通过编辑文件 `/etc/containers/registries.conf`对其进行自定义。\n\
  \n图 10-5 `podman info` 命令输出的部分显示\n\n![Images](img/F10-05.jpg)\n\n列表中两个值得关注的仓库是 [registry.access.redhat.com](http://registry.access.redhat.com)\
  \ 和 [registry.redhat.io](http://registry.redhat.io)。这两个仓库主要托管相同的容器镜像，但某些镜像需要订阅，且这些镜像仅从\
  \ `registry.redhat.io` 获取。\n\n列表中另一个常用的公共仓库是 `docker.io`，俗称为 Docker Hub。Docker Hub\
  \ 拥有海量供全球用户共享的预构建 Docker 镜像库，适用于多种应用程序和服务。\n\n\n\n\n`podman search` 命令是一个用于在已配置的注册库列表中查找镜像的实用工具。例如，执行\
  \ `podman search python` 将指示 Podman 在所有配置的注册库中搜索名称或元数据中包含字符串“python”的镜像。搜索。默认情况下，Podman\
  \ 会搜索所有未限定的注册库。该命令生成的输出部分内容显示在图 10-6 中。\n\n图 10-6 `podman search python` 命令的输出摘录\n\
  \n![Images](img/F10-06.jpg)\n\n为了更深入地了解特定镜像，将可以使用 `skopeo inspect` 命令。例如，以下命令提供了关于\
