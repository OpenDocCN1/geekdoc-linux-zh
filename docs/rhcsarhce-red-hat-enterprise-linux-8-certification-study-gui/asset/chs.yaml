  \ 8.02\n\n### 使用基于密钥的认证保护 SSH\n\n第三章讨论了 SSH 客户端程序，包括 `ssh`、`scp` 和 `sftp`。本节的重点是使用基于密钥的认证保护\
  \ SSH 。\n\n由于 SSH 是远程管理系统的重要工具，了解它如何加密客户端与 SSH 服务器之间的通信的基础知识非常重要。然后你将看到如何创建公/私钥对，这样连接甚至不会让用户密码面临风险。但首先，回顾一些关于\
  \ SSH 配置命令和文件的基础信息可能会有所帮助。\n\n#### SSH 配置命令\n\n有几个你需要了解的面向 SSH 的实用工具：\n\n![Images](img/square.jpg)\
  \ `sshd` 守护进程；它必须运行以接收入站 Secure Shell 客户端请求。\n\n![Images](img/square.jpg) `ssh-agent`\
  \ 用于持有数字签名算法 (DSA)、椭圆曲线 DSA (ECDSA) 和 Rivest, Shamir, Adleman (RSA) 认证私钥的程序。其原理是在\
  \ X 会话或登录会话开始时启动 `ssh-agent` 命令，其他程序作为 `ssh-agent` 程序的启动。\n\n![Images](img/square.jpg)\
  \ `ssh-add` 将私钥身份添加到认证代理 `ssh-agent`。\n\n![Images](img/square.jpg) `ssh` 一种登录远程机器的安全方法，类似于\
  \ Telnet 但具有加密通信。该命令的基本用法已在第三章中讨论过。要使基于密钥的认证正常工作，你需要在客户端有一个私钥，并在服务器上有一个公钥。获取如 `id_rsa.pub`\
  \ 的公钥文件（在本节稍后将创建），将其复制到服务器，并将其放在授权用户家目录下的 `~/.ssh/authorized_keys` 文件中。\n\n![Images](img/square.jpg)\
  \ `ssh-keygen` 用于为 SSH 认证创建私/公钥对的实用工具。`ssh-keygen -t keytype` 命令根据 DSA、ECDSA 或 RSA\
  \ 协议创建密钥对。\n\n![Images](img/square.jpg) `ssh-copy-id` 一个将公钥复制到目标远程系统的脚本。\n\n####\
  \ SSH \n\n\n\n配置 SSH 的系统包含两个目录中的配置文件。对于本地系统，基本配置文件存储在 `/etc/ssh` 中。但同样重要的是每个用户家目录下\
  \ `~/.ssh/` 子目录中的配置文件。这些文件配置了允许该用户连接到远程系统的方式。当包含 DSA、ECDSA 和 RSA 密钥时，`~/.ssh/` 子目录包含以下文件：\n\
  \n![Images](img/square.jpg) `authorized_keys` 包含来自远程用户的公钥列表。此文件中具有公加密密钥的用户可以连接到远程系统。系统用户和名称列在每个复制到此文件的公钥末尾。\n\
  \n![Images](img/square.jpg) `id_dsa` 包含基于 DSA 算法的本地私钥。\n\n![Images](img/square.jpg)\
  \ `id_dsa.pub` 包含基于 DSA 算法的用户的本地公钥。\n\n![Images](img/square.jpg) `id_ecdsa` 包含基于\
  \ ECDSA 算法的本地私钥。\n\n![Images](img/square.jpg) `id_ecdsa.pub` 包含基于 ECDSA 算法的用户的本地公钥。\n\
  \n![Images](img/square.jpg) `id_rsa` 包含基于 RSA 算法的本地私钥。\n\n![Images](img/square.jpg)\
  \ `id_rsa.pub` 包含基于 RSA 算法的用户的本地公钥。\n\n![Images](img/square.jpg) `known_hosts` 包含来自远程系统的主机密钥。用户首次登录系统时，会被提示接受远程服务器的公钥。在\
  \ RHEL 9 上，默认使用 ECDSA 协议加密流量。远程服务器上相应的公钥存储在 `/etc/ssh/ssh_host_ecdsa_key.pub`，并由客户端添加到本地的\
  \ `~/.ssh/known_hosts` 文件。\n\n#### 基本加密通信\n\n计算机网络中的基本加密通常需要私钥和一个公钥。其原理与第四章中讨论的\
  \ GNU 隐私卫 (GPG) 通信相同。私钥由所有者存储，公钥发送给第三方。当密钥对配置妥当时，用户可以使用其私钥加密消息，而第三方可以使用相应的公钥解密消息。这反过来也起作用：第三方可以使用接收者的公钥加密消息，而接收者可以使用其私钥解密消息。在\
  \ SSH 协议中，服务器共享其公钥进行认证，并通过密钥交换算法相互建立对称会话密钥。该密钥用于保护通信信道。\n\n加密密钥基于随机数。这些数字非常大（RSA\
  \ 密钥通常为 2048 位或更多），因此有人（至少使用个人电脑）入侵服务器系统的可能性几乎是不可能的。私钥和公钥加密密钥基于这些随机数的匹配集。\n\n#####\
  \ 私钥\n\n私钥必须是安全的。基于密钥的认证依赖于私钥，该私钥仅供该用户家目录下 `~/.ssh` 子目录中的所有者访问。为了验证用户身份，服务器向客户端发送一个“挑战”，这是一个请求执行需要私钥知识的加密操作请求。一旦服务器收到客户端对其挑战的响应，它就能解密消息并证明用户身份是真实的。\n\
  \n##### 公钥\n\n公钥就是如此，是公开的。公钥的设计是复制到适当用户的 `~/.ssh/` 子目录中一个名为 `authorized_keys` 的文件中。\n\
  \n图 8-3 所示示例列出了与 SSH 使用相关的目录和文件。\n\n图 8-3 用户 `.ssh/` 子目录中的密钥\n\n![Images](img/F08-03.jpg)\n\
  \n![Images](img/exam.jpg)\n\n大多数 SSH 基于密钥认证的常见问题与文件权限有关。如图 8-3 所示，私钥的权限设置为 `600`\
  \ (rw-------)，公钥的权限设置为 `644` (rw-r--r--)。此外，`~/.ssh` 目录的权限应为 `700` (rwx------)。\n\
  \n\n\n\n\n密钥就像用于加密通信数据的密码。但它绝不是普通的密码。尝试记住这里所示的以十六进制格式表示的 1024 位数字：\n\n![Images](img/f0326-01.jpg)\n\
  \n私钥也类似，*但你必须保持它的私密性*，否则整个系统就会失效。保持私密性意味着除了所有者之外，任何人都不应该访问该密钥。如果你的电脑是公共电脑，请使用短语（密码）保护你的私钥。接下去将描述设置短语的过程。不要忘记短语，否则你将不得不创建一个新的密钥对，并再次将你的公钥复制到所有目标系统。\n\
  \n### 设置基于密钥的认证的公私对\n\n使用 `ssh-keygen` 命令设置公钥/私钥对。尽管它默认创建 RSA 密钥，但也可以用于创建 DSA 密钥或\
  \ ECDSA 密钥。例如，某些用户可能需要 DSA 密钥以符合某些美国政府标准。命令序列的示例见图 8-4。\n\n图 8-4 生成 SSH 密钥对的命令\n\
  \n![Images](img/F08-04.jpg)\n\n如图所示，命令会提示输入可选的短语以保护私钥。当确认了相同的短语后，私钥将保存存在 `id_rsa`\
  \ 文件中，相应的公钥存储在 `id_rsa.pub` 文件中。用户 michael 的两个文件都存储在 `/home/michael/.ssh` 目录下。\n\
  \n如果需要，你可以设置位数更大的 RSA 密钥。在我们的测试中，即使在只有一个虚拟 CPU 的虚拟机系统上，我们也能相当快速地设置高达 8192 密钥密钥。启动该过程的命令是：\n\
  \n```bash\n$ ssh-keygen -b 8192\n```\n\n或者，如果需要 DSA 密钥，可以使用以下命令。仅允许 1024 位的 DSA\
  \ 密钥。此命令后的过程与图 8-4 所示相同。\n\n```bash\n$ ssh-keygen -t dsa\n```\n\n下一步是将公钥传输到远程系统。它可能是你管理的服务器之一。如果你愿意通过网络传输该公钥（每个连接传输一次），可以使用以下命令：\n\
  \n![Images](img/f0328-01.jpg)\n\n严格来说，不带 `-i` 选项的 `ssh-copy-id` 命令默认传输最近创建的公钥。前面的命令会将指定的本地\
  \ RSA 密钥附加到*远程* `~/.ssh/authorized_keys` 文件的末尾。在这种情况下，该文件可以在 `/home/michael` 目录下找到。当然，你可以选择\
  \ IP 地址替换主机名。\n\n![Images](img/job.jpg)\n\n**有时在将密钥复制到远程系统后，当你尝试登录时可能会遇到“agent admitted\
  \ failure to sign using the key”错误，随后出现密码提示。要解决此问题，请注销控制台或 GUI 并重新登录。在大多数情况下，`ssh`\
  \ 命令会提示输入短语。**\n\n你应该能够立即连接到该远程系统。在前面的案例中，适当的命令是以下内容之一：\n\n![Images](img/f0328-02.jpg)\n\
  \n在控制台上运行时，`ssh` 命令使用以下提示符输入短语：\n\n```text\nEnter passphrase for key '/home/michael/.ssh/id_rsa'\n\
  ```\n\n在基于 GUI 的命令行中运行时，它会弹出一个与图 8-5 所示类似的窗口。\n\n图 8-5 短语提示\n\n![Images](img/F08-05.jpg)\n\
  \n### 认证目标 8.03\n\n### 安全增强型 Linux 入门\n\n安全增强型 Linux (SELinux) 是由美国国家安全局开发的，旨在为\
  \ Linux 提供一种强制性访问控制级别。它超越了与文件权限相关的自主访问控制。从本质上说，SELinux 在操作系统内核中执行安全规则。它限制了发生安全漏洞时的损害。例如，如果与\
  \ FTP 服务关联的系统账户被破解，SELinux 会使使用该账户破坏其他服务变得更加困难。\n\n#### SELinux 的基本特性\n\nSELinux\
  \ 安全模型基于主体（subjects）、对象（objects）和动作（actions）。*主体*是一个进程，例如正在运行的命令或运行中的 Apache Web\
  \ 服务器等应用程序。*对象*是一个文件、设备、套接字，或者泛指任何主体可以访问的任何资源。*动作*是主体对对象可能的操作。\n\nSELinux 为对象分配不同的上下文（contexts）。*上下文*只是一个标签，用于\
  \ SELinux 安全策略来确定主体对对象的动作是否被允许。例如，Apache Web 服务器进程可以获取网页文件等对象，并将其显示给全球客户端查看。在 RHEL\
  \ 9 的 SELinux 实现中，只要对象文件具有适当的 SELinux 上文，该动作通常是允许的。\n\n与 SELinux 关联的上下文是细粒度的。换句话说，如果黑客入侵并控制了你的\
  \ Web 服务器，SELinux 上文可以防止入侵者利用该漏洞进入其他服务。\n\n要查看特定文件的上下文，运行 `ls -Z` 命令。例如，查看图 8-6\
  \ 中该命令的作用，它显示了 `/` 目录下的安全上下文。\n\n图 8-6 不同文件的 SELinux 安全上下文\n\n![Images](img/F08-06.jpg)\n\
  \n正如本开头所示，RHCSA 考试中有六个目标与 SELinux 相关。你将在后续章节中探索如何实现这些目标。\n\n#### SELlinux 状态\n\n\
  正如 RHCSA 目标要求的，你需要知道如何“为 SELlinux 设置强制（enforcing）和许可（permissive）模式”。SELinux 有三种可用模式：*enforcing*（强制）、*permissive*（许可）和*disabled*（禁用）。强制和禁用模式是不言自明的。许可模式下的\
  \ SELinux 意味着任何违反 SELinux 规则的行为都会记录，但违规不会停止任何操作。\n\n如果你想更改默认 SELinux 模式，请更改 `/etc/selinux/config`\
  \ 文件中的 `SELINUX` 指令，如表 8-4 所示。下次重启系统时，更改将应用于系统。\n\n表 8-4 /etc/selinux/config 中的标准指令\n\
  \n![Images](img/f0330-02.jpg)\n\n如果 SELinux 配置为强制模式，它将通过两种方式之一保护系统：在*targeted*（目标）模式下或*mls*\
  \ 模式下。默认是目标策略，允许你以细粒度自定义 SELinux 保护的内容。相比之下，MLS 更进了一步，使用了为美国国防部开发的 Bell–LaPadula\
  \ 模型。该模型支持 c0 到 c3 级之间的安全层。虽然 c3 级被列为“绝密”，但可用级别范围一直延伸到 c1023。这种细粒度的机密级别尚未完全开发。如果你想探索\
  \ MLS，请安装 selinux-policy-mls RPM。\n\n![Images](img/job.jpg)\n\n**如果你只是想实验 SELinux，请将其配置为许可模式。它会记录任何违规行为而不停止任何操作。使用\
  \ SELinux 管理工具很容易设置，或者你可以在 `/etc/selinux/config` 中设置 SELINUX=permissive。如果 auditd\
  \ 服务正在运行，违规记录将记录在 /var/log/audit 目录下的 audit.log 文件中。只需记住，红帽可能希望候选人在考试期间将 SELinux\
  \ 配置为强制模式。**\n\n#### 命令行下的 SELinux 配置\n\n如今 SELinux 是一项成熟的软件，随着 RHEL 7 和 RHEL 8\
  \ 的发布，它变得有用得多。尽管如此，考虑到 SELinux 相关的复杂性，对于不是非常熟悉的系统工程师来说，使用 SELinux 管理工具来配置 SELinux\
  \ 设置可能更高效。\n\n\n\n\n以下章节将展示你如何从命令行界面配置和管理 SELinux。然而，由于使用 GUI 工具更容易演示 SELinux 的完整功能，本章稍后部分将对这些功能进行详细讨论。\n\
  \n## 配置基础 SELinux 设置\n\n有一些基本命令可以用于查看和配置基础 SELinux 设置。要查看 SELinux 的当前状态，请运行 `getenforce`\
  \ 命令；它会返回三个自言易懂的选项之一：enforcing（强制）、permissive（允许）或 disabled（禁用）。`sestatus` 命令提供更多信息，输出类似于所示：\n\
  \n![Images](img/f0331-01.jpg)\n\n你可以使用 `setenforce` 命令更改当前的 SELinux 状态；其选项非常直观：\n\
  \n![Images](img/f0331-02.jpg)\n\n这将更改 `/sys/fs/selinux/enforce` 布尔值。对于布尔值，你可以分别用\
  \ `1` 和 `0` 替换 enforcing 和 permissive。要使此更改永久生效，你必须修改 `/etc/selinux/config` 文件中的\
  \ `SELINUX` 变量。然而，对详细的 SELinux 布尔值的更改需要不同的命令。\n\n另一种，如果 SELinux 因为某些原因被禁用，输出将是：\n\
  \n![Images](img/f0332-01.jpg)\n\n![Images](img/exam.jpg)\n\n如果 SELinux 已被禁用，在将 SELinux\
  \ 设置为 enforcing 模式后，重启系统可能需要几分钟。然而，这个过程比之前的 RHEL 版本要节省时间得多。\n\n在这种情况下，`setenforce`\
  \ 命令将不起作用。相反，你必须在 `/etc/selinux/config` 文件中设置 `SELINUX=enforcing`。这需要重启系统以“重新标记”所有文件，即\
  \ SELinux 标签将应用到本地系统上的每个文件。\n\n## 为 SELinux 配置普通用户\n\n要查看当前 SELinux 用户的状态，请运行 `semanage\
  \ login -l` 命令。根据 RHEL 9 的默认安装，它将产生以下输出：\n\n![Images](img/f0332-02.jpg)\n\n换句话说，普通“默认”用户与\
  \ root 管理用户具有相同的 SELinux 用户上下文。要确认这一点，请以普通用户身份运行 `id -Z` 命令。在没有更改的情况下，它将产生以下输出，表明用户不受任何\
  \ SELinux 设置的限制：\n\n![Images](img/f0332-03.jpg)\n\n前面的字符串定义了 SELinux 术语中所谓的*label*（标签）。标签由多个上下文字符串组成，用冒号分隔：用户上下文（以\
  \ `_u` 结尾）、角色上下文（以 `_r` 结尾）、类型上下文（以 `_t` 结尾）、敏感性上下文以及类别集。目标策略（targeted policy）——即\
  \ RHEL 9 中的默认 SELinux 策略——的规则大部分与类型（`_t`）上下文相关。\n\n虽然这可能不是考试要求，但普通用户也可以被 SELinux\
  \ 限制。当用户账户被攻破时（它们终会被攻破的），你希望通过 SELinux 规则限制可能造成的损害。以下示例指定了一个限制规则，该规则添加（`-a`）普通用户\
  \ michael，并指定（`-s`）`user_u` 上文进行限制：\n\n![Images](img/f0332-04.jpg)\n\n`user_u` 角色没有运行\
  \ `su` 和 `sudo` 命令的能力，详见第 6 章。如果需要，你可以通过 `semanage login -d michael` 命令恢复该过程。最新的\
  \ Red Hat 文档中列出的可用用户上下文如表 8-5 所示。\n\n表 8-5 SELinux 用户角色选项\n\n![Images](img/f0333-01.jpg)\n\
  \n当用户角色发生更改时，它在下一次登录之前不会生效。例如，如果我们在基于 GUI 的命令行中将用户 michael 的角色更改为 `user_u`，该更改在执行注销并重新登录\
  \ GUI 之前不会生效。如果你在自己的系统上尝试此操作，你将无法启动任何管理配置工具，并且将无法访问 `sudo` 和 `su` 命令。\n\n在某些网络上，你可能希望将未来用户的角色更改为\
  \ `user_u`。如果你不想让普通用户摆弄管理工具，可以使用以下命令为未来的默认用户进行该更改：\n\n![Images](img/f0333-02.jpg)\n\
  \n该命令修改（`-m`）目标策略存储（`-S`），设置 SELinux 用户（`-s`）为 `user_u`，以及默认用户的 MLS s0 范围（`-r`）。在这里，“__default__”单词的两侧包含两个下划线。只要\
  \ `user_u` 对默认 SELinux 用户生效，普通用户就无法访问管理工具或如 `su` 和 `sudo` 等命令。以下命令将撤销该过程：\n\n![Images](img/f0333-03.jpg)\n\
  \n![Images](img/job.jpg)\n\nMLS 策略增加了 SELinux 的复杂性。带有适当布尔值和文件上下文的目标默认策略通常提供了充分的安全性。\n\
  \n需要完整的 MLS 范围 (s0-s0:c0.c1023)，是因为 `unconfined_u` 用户不受 MLS 限制。\n\n## 管理 SELinux\
  \ 布尔值设置\n\n大多数 SELinux 设置都是布尔值——换句话说，通过将它们设置为 `1` 或 `0` 来激活或禁用。可以使用 `getbool` 命令从\
  \ `/sys/fs/selinux/booleans` 获取这些设置，并使用 `setbool` 命令进行修改。例如，来自 `getbool user_exec`\
  \ 的以下输出确认 SELinux 允许在其主目录或来自 `/tmp` 运行脚本：\n\n![Images](img/f0334-01.jpg)\n\n该布尔值可以临时禁用，也可以通过重启持续的方式禁用。一种方法是使用\
  \ `setbool` 命令。例如，以下命令在系统重启前禁用上述的布尔值：\n\n![Images](img/f0334-02.jpg)\n\n你可以选择在命令用\
  \ `0` 替换 `off`。由于这是一个布尔设置，效果是相同的：标志被关闭。然而，需要 `-P` 关来使布尔值的更改在重启后持续。请注意，更改在受影响的用户下次登录时生效。\n\
  \n可用布尔值的完整列表可见 `getbool -a` 命令的输出。\n\n有关每个布尔值的更多信息，请运行 `semanage boolean -l` 命令。输出包含了所有布尔值的描述，可以使用\
  \ `grep` 命令辅助搜索。\n\n## 列出并识别 SELinux 文件上下文\n\n如果你启用了 SELinux，`ls -Z` 命令会列出当前的 SELinux\
  \ 文件上下文，如前文图 8-6 所示。以 `/root` 目录下的 `anaconda-ks.cfg` 文件的输出为例：\n\n![Images](img/f0334-03.jpg)\n\
  \n输出指定了该文件 SELinux 安全的四个元素：用户、角色、类型和 MLS 级别。通常，与文件关联的 SELinux 用户是 `system_u` 或 `unconfined_u`，这通常不会影响访问。在大多数情况下，文件与\
  \ `object_r`（文件的对象角色）相关联。未来的 SELinux 目标策略版本完全可能为用户和角色包含更细粒度的选项。\n\n关键的文件上下文是类型，在此例中为\
  \ `admin_home_t`。如果你配置了 FTP 和 HTTP 等服务，由 FTP 或 HTTP 服务的文件必须具有适当的 SELinux 上文。你可以使用\
  \ `chcon` 命令更改文件和目录的类型。\n\n例如，为 FTP 服务器配置非标准目录，请确保上下文与默认 FTP 目录匹配。考虑以下命令：\n\n![Images](img/f0335-01.jpg)\n\
  \n\n\n这些上下文是系统用户 (`system_u`) 和对象角色 (`object_r`)，用于与公共内容 (`public_content_t`) 共享类型。如果你为\
  \ FTP 服务创建了另一个目录，将需要为该目录分配相同的安全上下文。例如，如果你以 root 用户身份创建 `/ftp` 目录并运行 `ls -Zd /ftp`\
  \ 命令，你将看到与 `/ftp` 目录关联的上下文，如下：\n\n![Images](img/f0335-02.jpg)\n\n要更改上下文，请使用 `chcon`\
  \ 命令。如果有子目录，你可能希望确保使用 `-R` 切换递归进行更改。在这种情况下，为了将用户和类型上下文更改为匹配 `/var/ftp`，请运行以下命令：\n\
  \n![Images](img/f0335-03.jpg)\n\n如果你想支持向你的 FTP 服务器上传文件，必须分配一个不同的类型上下文，特别是 `public_content_rw_t`。这对应于命令：\n\
  \n![Images](img/f0335-04.jpg)\n\n你也可以使用 `chcon` 命令的不同变体。以下命令使用了来自 `/var/ftp` 目录的用户、角色和上下文，并递归应用这些更改：\n\
  \n![Images](img/f0335-05.jpg)\n\n但等等，如果文件系统被重新标记会发生什么？通过 `chcon` 进行的更改在文件系统重新标记后不会保留，因为所有文件上下文将被重置为\
  \ SELinux 策略中定义的默认值。因此，我们需要一种方法来修改定义每个文件默认上下文的规则。该主题将在下一节介绍。\n\n![Images](img/job.jpg)\n\
  \n使用 `restorecon` 是更改文件上下文的首选方法，因为它将上下文设置为 SELinux 策略中配置的值。`chcon` 命令可以将文件上下文修改为作为参数传递的任何值，但如果上下文与\
  \ SELinux 策略定义的默认值不同，则更改可能在文件系统重新标记后失效。因此，为了避免错误，你应该使用 `semanage fcontext` 修改 SELinux\
  \ 策略中的上下文，并使用 `restorecon` 更改文件上下文。\n\n### 恢复 SELinux 文件上下文\n\n默认上下文配置在 `/etc/selinux/targeted/contexts/files/file_contexts`\
  \ 中。如果你犯了错并想要恢复文件的原始 SELinux 设置，`restorecon` 命令将根据 `file_contexts` 配置文件恢复这些设置。然而，目录中的默认值可能有所不同。例如，以下命令（带有\
  \ `-F` 切换强制更改所有上下文，而不仅仅是类型上下文）会导致 `/ftp` 目录产生不同的上下文集：\n\n![Images](img/f0336-01.jpg)\n\
  \n你可能会注意到用户上下文与 `/ftp` 目录创建时不同。这是由于上述 `file_contexts` 文件的第一行，它应用了所注的上下文：\n\n![Images](img/f0336-02.jpg)\n\
  \n你还可以使用 `semanage fcontext -l` 命令列出 `file_contexts` 中所有的默认文件上下文规则。请参图 8-7 的输出节选。\n\
  \n图 8-7 SELinux 上下文定义\n\n![Images](img/F08-07.jpg)\n\n如你所示，SELinux 上下文定义使用了正则表达式，例如：\n\
  \n![Images](img/f0336-03.jpg)\n\n前面的正则表达式匹配 `/**` 字符，后跟任意数量的字符（`.*`）。`?` 字符意味着括号内的整个正则表达式可以匹配零次或一次。因此，整体结果是匹配\
  \ `/**` 后紧跟任意数量的字符，或者什么都没有。此正则表达式被广泛用于匹配目录及其内部的所有文件。\n\n作为一个示例，匹配 `/ftp` 目录及其内部所有文件的正则表达式如下：\n\
  \n![Images](img/f0336-04.jpg)\n\n使用此正则表达式，你可以定义一条 SELinux 策略规则，为 `/ftp` 目录及其内部所有文件分配默认类型上下文。你可以通过\
  \ `semanage fcontext -a` 命令实现此。例如，以下命令为 `/ftp` 目录及其内部所有文件分配了 `public_content_t`\
  \ 的默认类型上下文：\n\n![Images](img/f0337-01.jpg)\n\n一旦你为文件系统路径定义了新的默认策略上下文，就可以运行 `restorecon`\
  \ 命令将上下文设置为相应的默认策略值。以下命令递归（`-R`）将上下文恢复为之前定义的 `public_content_t` 值：\n\n![Images](img/f0337-02.jpg)\n\
  \n### 练习 8-3\n\n#### 配置具有适当 SELinux 上下文的新目录\n\n在本次练习中，你将设置一个新目录 `/ftp`，其 SELinux\
  \ 上文将匹配 FTP 服务器的标准目录。此练习演示了如何使用 `chcon` 命令，并展示了使用 `restorecon` 和 `semanage` 命令的效果。\n\
  \n1. 创建 `/ftp` 目录。使用 `ls -Zd /ftp` 命令识别该目录上的 SELinux 上文。将其与 `/var/ftp` 目录上的上下文进行对比。\n\
  2. 将 `/ftp` 目录上的上下文更改为匹配 `/var/ftp` 目录。最有效的方法是使用命令：\n```bash\n# chcon -R --reference\
  \ /var/ftp /ftp\n```\n虽然不需要 `-R` 切换，但我们包含它是帮你习惯递归更改上下文。\n3. 运行 `ls -Zd /ftp` 命令检查该目录更改后的上下文。它现在应该与\
  \ `/var/ftp` 目录的上下文匹配。\n4. 运行以下命令查看 SELinux 重新标记时会发生什么：\n```bash\n# restorecon -Rv\
  \ /ftp\n```\n此命令对 `/ftp` 目录的上下文做了什么？\n5. 要使 `/ftp` 目录的更改永久化，你需要 `semanage` 命令配合\
  \ `fcontext` 参数的帮助。由于没有类似于 `chcon --reference` 的切换，以下命令根据 `/var/ftp` 目录的默认设置指定了用户角色和文件类型：\n\
  ```bash\n# semanage fcontext -a -s system_u -t public_content_t \"/ftp(/.*)?\"\n\
  ```\n6. 查看结果。首先，`semanage` 命令不会更改 `/ftp` 目录的当前 SELinux 上文。接下来，检查 `/etc/selinux/targeted/contexts/files/`\
  \ 中 `file_contexts.local` 的内容。它应该反映刚刚执行的 `semanage` 命令。\n7. 重新运行步骤 4 中的 `restorecon`\
  \ 命令。现在它会更改 `/ftp` 目录的 SELinux 上文吗？\n\n### SELinux 迁移\n\nSELinux 策略控制进程对特定对象（如文件、设备或网络套接字）执行的每一个操作。打开\
  \ TCP 套接字并监听网络端口是你可以通过 SELinux 策略控制和限制的操作之一。\n\n如果上一节涵盖的服务之一被配置为监听非标准端口，默认情况下，SELinux\
  \ targeted 策略将拒绝此操作。事实上，SELinux 使用标签不仅控制对文件或设备的访问，还控制对网络端口。\n\n你可以通过运行 `semanage`\
  \ 命令列出所有 SELinux 端口标签：\n```bash\n# semanage port -l\n```\n过滤特定字符串有助于识别服务允许监听哪些端口。如下例所示，SSH\
  \ 服务被限制为监听端口 22：\n\n![Images](img/f0338-02.jpg)\n\n同样，`http_port_t` 标签规定了 Apache\
  \ 可以监听的端口，而 `http_cache_port_t` 标识了网络代理允许的端口：\n\n![Images](img/f0338-03.jpg)\n\n\
  如果你需要更改标签以允许服务监听非标准端口，请使用 `semanage` 命令。在以下示例中，修改了 SELinux 策略以允许 Apache 监听端口 444：\n\
  \n![Images](img/f0338-04.jpg)\n\n\n\n\n正如你将在第 9 章中看到的，`ps` 命令列出了当前正在运行的进程。在 SELinuxux\
  \ 系统中，每个运行的进程都有上下文（contexts）。要查看当前运行中所有进程的上下文，请运行 `ps -eZ` 命令，它会列出每个（`-e`）进程的 SELinuxux\
  \ 上下文（`-Z`）。图 8-8 包含了我们在系统中对该命令输出的一份变化摘录。\n\n图 8-8 不同进程的 SELinux 安全上下文\n\n![Images](img/F08-08.jpg)\n\
  \n虽然用户和角色并不经常变化，但进程类型的变化非常大，且通常与运行进程的用途相匹配。例如，从图中可以看到 Avahi 守护进程（avahi-daemon）是如何与\
  \ `avahi_t` SELinux 类型匹配的。你应该能够识别出至少其他一些 SELinux 类型是如何与关联的服务匹配的。\n\n换句话说，尽管 SELinux\
  \ 类型有很多，但它们与运行进程的名称是一致的。\n\n## 诊断和处理 SELinux 策略违规\n\n如果 SELinux 运行在强制（enforcing）模式下并出现问题，且你确定目标服务或应用程序没有问题，请不要禁用\
  \ SELinux！Red Hat 已让管理和排错变得更加容易。根据 Red Hat 的说法，与 SELinux 相关的问题前两个原因是上下文（contexts）和布尔值设置（boolean\
  \ settings）。\n\n### SELinux 审计\n\nSELinuxux 的问题应该记录在相关的日志文件 `audit.log` 中，该文件位于\
  \ `/var/log/audit` 目录。。该文件可能会让人感到困惑，尤其是当你第一次阅读它时。有许多工具可以帮助解读此日志。\n\n首先，`ausearch`\
  \ 命令可以帮助过滤特定类型的问题。例如，以下命令列出了所有与使用 `sudo` 命令相关的 SELinux 事件：\n\n```\n# ausearch -m\
  \ avc -c sudo\n```\n\n此类事件被称为访问向量缓存（Access Vector Cache，即 `-m avc`）消息；`-c` 允许你指定日志中常用的名称，例如\
  \ httpd 或 su。如果你尝试过本章之前描述的 `user_u` SELinux 用户，那么在 `audit.log` 文件中应该会有几条相关的消息。\n\
  \n即使对于大多数管理员来说，这些输出仍然是一堆乱码。然而，它应该包含标识性信息，例如已审计的用户 ID（显示为 `auid`），这可以帮助你识别违规的用户。也许该用户需要此类访问，或者该用户的账户已被攻破。无论如何，警报可能会导致你更加关注该账户。\n\
  \n相比之下，`sealert -a /var/log/audit/audit.log` 命令可能会提供更清晰的说明。\n\n### SELinux 布尔值问题\n\
  \n在禁用之前描述的 `user_exec_content` 布尔值后，我们为受 `user_u` 标签限制的用户创建了一个名为 `script1` 的简单脚本。在将该脚本设为可执行后，我们尝试使用\
  \ `/home/examprep/script1` 命令运行它。尽管该用户拥有该文件的所有权并设置了执行权限，该尝试仍导致了以下消息：\n\n```\n-bash:\
  \ /home/examprep/script1: Permission denied\n```\n\n这导致了图 8-9 所示所示来自 `/var/log/messages`\
  \ 的日志摘录。注意，该消息明确引用了解决该问题所需的命令。作为管理员，你需要决定是否应赋予此类用户执行其自己的脚本的能力。如果是的话，那么提到的命令将解决该问题。\n\
  \n图 8-9 一个 SELinux 警报和一个解决方案\n\n![Images](img/F08-09.jpg)\n\n## GUI SELinux 管理工具\n\
  \n如果你已经花时间从命令行学习了 SELinux，这一节应该只是复习。对于许多用户来说，更改 SELinux 设置最简单的方法是使用 SELinux 管理工具，你可以通过\
  \ `system-config-selinux` 命令启动它。如果命令不可，请运行以下命令安装该工具：\n\n```\n# dnf install policycoreutils-gui\n\
  ```\n\n如图 8-10 所示，该工具显示了本地系统 SELinux 状态的基本，反映了 `sestatus` 命令输出中显示的某些信息。\n\n图 8-10\
  \ 管理工具中的 SELinux 状态\n\n![Images](img/F08-10.jpg)\n\n如你所见，有标记为“系统默认强制模式”（System Default\
  \ Enforcing Mode）和“当前强制模式”（Current Enforcing Mode）的选项，你可以将其设置为强制（Enforcing）、允许（Permissive）或禁用（Disabled）。通常情况下，除非你更改了默认策略类型，否则你不需要激活“下次重启时重标记”（Relabel\
  \ On Next Reboot）选项。\n\nSELinux 管理工具窗口左格中显示的三个类别将在后续章节中描述。其他类别不在 RHCSA 考试的范围内。\n\
  \n### SELinux 布尔值设置\n\n在 SELinux 管理工具中，点击左面板中的“布尔值”（Boolean），如图 8-11 所示。浏览可用模块。如你所见，SELinux\
  \ 策略可以在许多不同的类别中修改，某些与管理功能有关，另一些与特定服务有关。这些选项中的选几个显示图 8-11 中。任何更改都会生效。\n\n\n\n\n\n\
  ![Images](img/squ1.jpg) 用户主目录包含自己的配置文件的 `.ssh` 子目录，其中有 SSH 私钥和公钥。\n\n![Images](img/squ1.jpg)\
  \ 使用 `ssh-keygen` 命令为私钥/公钥对配置密码短语。\n\n![Images](img/squ1.jpg) 使用 `ssh-copy-id` 命令将公钥传输到远程系统的用户主目录。\n\
  \n## 安全增强型 Linux 入门\n\n![Images](img/squ1.jpg) 借助 `setenforce` 命令可以将 SELinux 配置为强制（enforcing）、许可（permissive）或禁用（disabled）模式，并配合目标（targeted）或\
  \ MLS 策略。默认启动设置存储在 `/etc/selinux/config` 文件。\n\n![Images](img/squ1.jpg) SELinux\
  \ 标签包含不同的上下文，例如用户、角色、类型和 MLS 级别。\n\n![Images](img/squ1.jpg) 使用 `setsebool` 命令管理\
  \ SELinux 布尔值；持久性更改需要 `-P` 参数。\n\n![Images](img/squ1.jpg) 使用 `chcon` 命令更改 SELinux\
  \ 上下文，并使用 `restorecon` 命令恢复为默认值。\n\n![Images](img/squ1.jpg) `sealert` 命令可用于解释 `/var/log/audit`\
  \ 目录下的 `audit.log` 文件中记录的问题。\n\n## 自测\n\n以下问题将帮助你衡量对本章介绍内容的理解程度。由于红帽考试中不出现选择题，因此书中也没有出现选择题。这些问题专门测试你对该章节的理解。在红帽考试中，获得结果比背诵琐碎知识更重要。其中许多问题可能有多个正确答案。\n\
  \n### 基础防火墙控制\n\n**1.** 与 HTTPS 服务关联的 TCP/IP 端口号是多少？\n\n**2.** 永久允许默认 `firewalld`\
  \ 区域的 HTTPS 流量的完整 `firewall-cmd` 命令是什么？\n\n**3.** 如何在不重启 `firewalld` 服务的情况下重载防火墙规则？\n\
  \n### 使用基于密钥的认证保护 SSH\n\n**4.** 什么命令使用 DSA 配置私钥/公钥对？\n\n**5.** 用户主目录的哪个子目录包含 `authorized_keys`\
  \ 文件？\n\n### 安全增强型 Linux 入门\n\n**6.** 什么命令将 SELinux 配置为强制模式？\n\n**7.** 什么命令列出 SELinux\
  \ 的所有布尔值设置？\n\n**8.** 什么命令将 TCP 端口 4443 添加到 `http_port_t` 标签中？\n\n**9.** 如何将默认的\
  \ SELinux 安全上下文恢复到文件？\n\n## 实验题\n\n红帽以电子化方式考试。因此，本章的实验可以在随书的网站上获取。如果你尚未在系统中设置 RHEL\
  \ 9，请参考 第 1 章 的安装指南。实验答案紧随在自测答案之后。\n\n## 自测答案\n\n### 基础防火墙控制\n\n**1.** 与 HTTPS 服务关联的\
  \ TCP/IP 端口号是 443。\n\n**2.** 永久允许默认 `firewalld` 区域 HTTPS 流量的 `firewall-cmd` 命令是：\n\
  \n```\n# firewall-cmd --permanent --add-service=https\n```\n\n**3.** 使用 `firewall-cmd\
  \ --reload` 在不重启服务的情况下重载防火墙规则。\n\n### 使用基于密钥的认证保护 SSH\n\n**4.** 使用 DSA 配置私钥/公钥对的命令是：\n\
  \n```\nssh-keygen -t dsa\n```\n\n**5.** 每一个公钥存储在 `authorized_keys` 文件中的用户都可以在其主目录的\
  \ `.ssh` 子目录下找到该文件。\n\n### 安全增强型 Linux 入门\n\n**6.** 将 SELinux 配置为强制模式的命令是：\n\n```\n\
  # setenforce enforcing\n```\n\n**7.** 列出 SELinux 所有布尔值设置的命令是：\n\n```\n# semanage\
  \ boolean -l\n```\n\n**8.** 将 TCP 端口 4443 添加到 `http_port_t` 标签的命令是：\n\n```\n# semanage\
  \ port -a -t http_port_t 4443\n```\n\n**9.** 如何将默认的 SELinux 安全上下文恢复到文件？\n\n## 实验答案\n\
  \n### 实验 1\n该实验旨在提高对强制模式下 SELinux 的意识。\n\n### 实验 2\n在该实验中，你将学习如何配置防火墙。\n\n![Images](img/squ1.jpg)\n\
  \n### 实验 3\n在该实验中，你将在端口 81 上运行 Web 服务器，而不是端口 80。\n\n### 实验 4\n该实验与实验 3 类似，但由于你在非标准端口上运行\
  \ Web 服务器，因此你需要配置 SELinux 为新端口标记标签。\n\n\n\n\n\n重启 Web 服务后，你应该看到一个错误。错误信息建议运行 `journalctl\
  \ -xeu httpd.service` 命令。如果你执行了该命令并检查日志，你会发现服务器无法绑定 TCP 端口 82。在 `/var/log/messages`\
  \ 中也应该出现类似的错误，但在这种情况下你还应该注意到错误是由 SELinux 引起的。这是因为 TCP 端口 82 未包含在 `http_port_t`类型的端口列表中：\n\
  \n```bash\n# semanage port -l | grep http_port_t\n```\n\n要修复此问题，请运行以下命令：\n\n```bash\n\
  # semanage port -a -t http_port_t -p tcp 82\n```\n\n然后，启动 `httpd` 服务。这一次，你不应该看到任何错误：\n\
  \n```bash\n# systemctl start httpd\n```\n\n3. 从 GNOME 终端，在 server1 上运行 `firewall-config`。从配置下拉菜单中选择\
  \ `Permanent`（永久）。然后，选择 `Services`（服务）选项卡，向下滚动直到找到 `http` 服务，点击 `Add`（添加），并在窗口中为端口号输入\
  \ `82`。选择 `Options | Reload Firewalld`（选项 | 重载防火墙）来重新加载配置。\n\n4. 如果你正确执行了所有更改，你应该能够从\
  \ `tester1` 加载测试网页。\n\n### 实验 5\n\n本实验假设你已经完成了之前实验中配置的 Apache Web 服务器。\n\n1. 打开\
  \ `/etc/httpd/conf/httpd.conf` 文件，并将 `Listen` 指令更改为 `Listen 80`。\n\n2. 重启 `httpd`\
  \ 服务：\n\n```bash\n# systemctl restart httpd\n```\n\n3. 按照实验说明创建新的网页：\n\n```bash\n\
  # echo \"Hello world!\" > /var/www/html/index.html\n```\n\n4. 如果成功，你应该能从运行在 `tester1.example.com`\
  \ 上的浏览器看到新的测试网页，该网页指向 URL `http://172.16.0.100`（如果 server1 的 IP 地址不同，请进行替换）。\n\n\
  5. 创建目录 `/html`：\n\n```bash\n# mkdir /html\n```\n\n6. 你应该修改了 `DocumentRoot` 指令并在\
  \ `/etc/httpd/conf/httpd.conf` 文件中添加了一个新段，其外观所示：\n\n![Images](img/f0350-05.jpg)\n\
  \n7. 按照实验说明创建新的网页：\n\n![Images](img/f0350-06.jpg)\n\n8. 重启 `httpd` 服务：\n\n```bash\n\
  # systemctl restart httpd\n```\n\n9. 你应该无法从浏览器显示新的测试页面。如果你查看 `/var/log/messages`，你会发现一个来自\
  \ SELinux 的错误，说明 SELinux 阻止 `/usr/sbin/httpd` 对文件 `/html/index.html` 进行 `getattr`\
  \ 。这是因为该文件没有正确的 SELinux 上文。你可以通过复制 `/var/www/html` 的上下文作为参考来设置正确的上下文：\n\n![Images](img/f0351-01.jpg)\n\
  \n这将修复问题，但更改在文件系统重新标记后将不会保留。要使更改持久，请检查 `/var/www/html` 目录的文件上下文（`ls -dZ /var/www/html`），并定义一个新的文件上下文规则以对\
  \ `/html` 应用相同的上下文，如下：\n\n![Images](img/f0351-02.jpg)\n\n### 实验 6\n\n1. 在 `tester1.example.com`\
  \ 上，创建用户 `bob`：\n\n![Images](img/f0351-03.jpg)\n\n2. 在 `tester1` 上，为用户 `bob` 生成一个新的\
  \ SSH 密钥对：\n\n![Images](img/f0351-04.jpg)\n\n3. 在 `server1.example.com` 上，创建用户 `alice`：\n\
  \n![Images](img/f0351-05.jpg)\n\n4. 在 `tester1` 上以用户 `bob` 身份，将公 SSH 密钥复制到 server1\
  \ 上用户 `alice` 的家目录（如果 IP 地址不同，请进行替换）：\n\n```bash\n$ ssh-copy-id alice@172.16.0.100\n\
  ```\n\n5. 最后，`tester1`上的 `bob` 应该能够 SSH 到 `alice@172.16.0.100` 而无需提示密码（如果 server1\
  \ 实例的 IP 地址不同，请进行替换）。\n\n# 第 9 章\n\n# 系统管理任务\n\n### 认证目标\n\n- 9.01 资源管理与系统调优\n-\
  \ 9.02 存档与压缩\n- 9.03 计划任务运行：cron 和 at\n- 9.04 Bash 脚本\n- 9.05 本地日志文件\n\n\n\n\nRHCSA\
  \ 目标中的几个系统管理命令在之前的章节中尚未涵盖。它们与进程管理和系统调优有关。进程管理命令允许你查看正在运行的进程，检查它们正在使用的资源，并杀死或重启这些进程。系统调优配置（profiles）应用特殊的配置设置，以针对特定用途（如桌面或数据库服务器）优化系统性能。\n\
  \n## 系统资源管理命令\n\nLinux 包含了多种命令，可以帮助你识别系统上运行的进程。这些命令中最基础的是 `ps`，它提供了当前运行进程的快照。可以使用\
  \ `top` 命令对这些进程进行排序，它能够按资源使用情况显示正在运行的 Linux 任务。通过 `top`，你可以识别出占用 CPU 和 RAM 内存最多的进程。可以调整进程优先级的命令包括\
  \ `nice` 和 `renice`。有时仅仅调整进程优先级是不够的，这时可能可以使用 `kill` 和 `killall` 等命令向进程发送信号。如果你需要监控系统使用情况，`sar`\
  \ 和 `iostat` 命令也会很有帮助。\n\n![Images](img/exam.jpg)\n\n**与系统资源相关的目标是“识别 CPU/内存密集型进程并杀死进程”以及“调整进程调度”。**\n\
  \n### 使用 ps 命令进行进程管理\n\n了解 Linux 计算机上运行着什么是非常重要的。为了帮助完成这项任务，`ps` 命令有许多实用的开关（switches）。当你尝试诊断问题时，一种常见的做法是从运行进程的完整列表开始，然后查找特定的程序。例如，如果\
  \ Firefox 网页浏览器无响应并占用了大部分 CPU 周期，你可能想要杀死任何相关的进程。此时 `ps aux | grep [f]irefox` 命令可以帮助你识别出需要杀死的进程。注意“f”周围的方括号：这些括号可以防止在搜索\
  \ `firefox` 进程时，`grep` 命令本身出现在结果中。这是一种用于从输出结果中排除 `grep` 进程的技巧。\n\n![Images](img/job.jpg)\n\
  \n`pgrep` 命令也有用，因为它结合了 `ps` 和 `grep` 的功能。在这种情况下，`pgrep -a firefox` 命令在功能上等同于 `ps\
  \ aux | grep firefox`。\n\n单独的 `ps` 命令通常是不够的。它只是识别运行在当前终端的进程。该命令通常只返回与当前 shell 关联的进程以及\
  \ `ps` 命令进程本身。\n\n要识别与用户名关联的进程，`ps -u *username*` 命令可以提供帮助。有时某些特定用户由于各种原因可能会产生问题。因此，如果你怀疑用户\
  \ mjang，以下命令可以帮助你检查当前与该用户关联的每一个进程：\n\n```\nps -u mjang\n```\n\n作为管理员，你出于各种原因选择关注特定账户，例如下一节中描述的通过\
  \ `top` 命令发现的活动。或者，你可能想使用以下命令审核所有当前正在运行的进程：\n\n```\n$ ps aux\n```\n\n`ps aux` 命令提供了更完整的当前运行进程数据库，按其\
  \ PID 排序。`a` 选项列出所有运行进程，`u` 选项显示输出详情，`x` 选项显示未关联终端的进程。\n\n\n\n\n请注意，最后一个命令不仅启用了\
  \ sysstat 服务，还启用了两个依赖单元：`sysstat-collect.timer` 和 `sysstat-summary.timer`。\n\n从本质上说，`sar`\
  \ 可用于提供系统活动报告。例如，图 9-4 显示了 `sar` 命令的输出。如你所见，输出显示了不同时间点的各种 CPU 测量值。默认设置每 10 分钟测量一次\
  \ CPU 负载。该系统有两个逻辑 CPU，分别并作为一个整体进行测量。图中显示的较高 %idle 数值是 CPU 未过载的良好迹象；然而，该图显示的是不足一小时的负载。\n\
  \n图 9-4 `sar` 命令的输出\n\n![Images](img/F09-04.jpg)\n\n`sar` 命令输出相关的 10 分钟间隔由 `/usr/lib/systemd/system`\
  \ 目录下的 `sysstat-collect.timer` systemd 单元驱动。这些报告的输出收集在 `/var/log/sa` 目录下的日志文件中。文件名与月份的数字日期相关；例如，每月\
  \ 15 日的系统活动报告状态可以在上述目录中的 `sa15` 文件中找到。但是根据 `/etc/sysconfig/sysstat` 文件中的默认设置，此类报告通常至少存储最后\
  \ 28 天：\n\n```\nHISTORY=28\n```\n\n### 使用 `sa1` 和 `sa2` 变 `sar`\n\n`sa1` 和 `sa2`\
  \ 命令通常用于收集系统活动报告数据。在 `system-collect.service` 系统单元中，使用 `sa1` 命令每 10 分钟收集一次系统活动数据。在\
  \ `system-summary.service` 单元中，`sa2` 命令在 `/var/log/sa` 目录中写入每日报告。\n\n### 使用 `iostat`\
  \ 获取 CPU 和存储设备统计信息\n\n与 `sar` 相，`iostat` 命令报告更通用的输入输出统计，不仅针对 CPU，还针对连接的存储设备（例如本地驱动器和挂载的共享\
  \ NFS 目录）。图 9-5 所示显示了 `server1.example.com` 自系统启动以来 CPU 和存储设备的信息。\n\n图 9-5 CPU 和存储设备统计信息\n\
  \n![Images](img/F09-05.jpg)\n\n`sar` 和 `iostat` 命令都可以定期捕获统计信息。例如，以下命令每五秒显示一次 CPU\
  \ 和存储设备统计信息，并在分钟后停止（12 份报告）：\n\n```\n# iostat 5 12\n```\n\n### `nice` 和 `renice`\n\
  \n`nice` 和 `renice` 命令可用于进程不同进程优先级。`nice` 命令用于以不同启动进程，而 `renice` 命令用于更改正在运行进程的优先级。\n\
  \nLinux 中的进程优先级指定的数字似乎是反直的。可用的 nice 数范围可能从 –20 到 19 不等。进程的默认 nice 值继承自父进程，通常为 0。被赋予优先级\
  \ 19 的进程必须等待系统几乎完全空闲才能获取任何资源。相比之下，被赋予优先级 –20 的进程优先于所有其他进程。在实践中，这对于几乎所有进程都是如此，因为“实时”任务的优先级高于\
  \ –20 的最低 nice 值。但这超出了 RHCSA 考试的范围，因此暂忽略实时进程的存在，为了便于讨论，假设所有普通进程都可以分配从 –20 到 19 的\
  \ nice 值。\n\n`nice` 命令作为其他命令的前缀。例如，如果你有一个要在晚上运行的密集型脚本，你可能会选择使用如下命令启动它：\n\n```\n\
  # nice -n 19 ./intensivescript\n```\n\n注意，只有 root 用户可以分配小于 0 的 nice 优先级。前面的命令以最低可能的优先级启动上述脚本。\n\
  \n有时程序只是占用了太多的资源。如果你不想杀死某个进程，可以使用 `renice` 命令降低其优先级。通常情况下，识别占用过多资源进程最简单的方法是使用 `top`\
  \ 命令。识别占用过多资源的 PID。该 PID 数字位于输出的左侧列中。\n\n如果你的目标进程的 PID 是 1234，以下命令将该进程的 nice 值更改为\
  \ 10，这使得该进程的优先级低于默认的 0 值：\n\n```\n# renice -n 10 1234\n```\n\n如果你想降低进程的 nice 级别，必须以\
  \ root 身份运行 `renice`。尽管命令的输出提到了“优先级”，但它实际上只是在列出进程的旧和新“nice”值：\n\n```\n1234: old\
  \ priority 0, new priority, 10\n```\n\n新的 nice 值显示在 `top` 命令的输出中，NI 列下。\n\n### 杀死进程命令\n\
  \n有时，仅重新调整优先级是不够的。某些进程可能会压垮系统。在大多数情况下，你可以使用 `kill` 和 `killall` 命令停止此类困难进程。在许多情况下，你可以直接从\
  \ `top` 任务浏览器杀死进程。\n\n如果出现进程占用大量内存或 CPU 的情况，可能会降低该系统上运行的所有程序。如图 9-6 所示，Firefox 已经严重加载了该系统的\
  \ CPU。如果它无响应，我们将在 `top` 任务浏览器中按 `k`。\n\n图 9-6 Firefox 负载高载的 top 任务浏览器\n\n![Images](img/F09-06.jpg)\n\
  \n如图 9-6 所示，`k` 命令会显示“PID To Signal/Kill:”提示符，在此处输入 Firefox 进程的 PID，或接受默认值 4537（看起来是\
  \ Firefox）。它对具有该 PID 的进程应用默认信号（`SIGTERM`）。\n\n当然，你可以直接对 PID 数字应用 `kill` 命令。例如，以下命令等同于在\
  \ `top` 任务浏览器中描述的步骤：\n\n```\n# kill 4537\n```\n\n进程所有者可以运行 `kill` 命令。因此，用户 alex\
  \ 可以运行 `kill 4537` 命令。\n\n尽管名为 kill，但 `kill` 命令可以向不同进程发送多种信号。要查看完整列表，请运行 `kill -l`\
  \ 或输入 `man 7 signal`。表 9-3 列出了一些常用的信号。\n\n表 9-3 POSIX 信号列表\n\n![Images](img/f364-01.jpg)\n\
  \n在 systemd 和 `/etc/init.d` 目录脚本出现之前，`kill -1` 命令用于向守护进程发送重载信号。例如，如果 Apache Web\
  \ 服务器的主进程 PID 为 2059，以下命令在功能上等同于 `systemctl reload httpd` 命令：\n\n```\n# kill -1\
  \ 2059\n```\n\n如果没有 `-1` 关（即减号数字 1），`kill` 命令在正常情况下将终止进程。在这种情况下，它会终止 Apache Web\
  \ 服务器。但有时进程会卡死。在某些情况下，`kill` 命令本身不起作用。进程继续运行。这时，你可以尝试两种方法。\n\n首先，你可以尝试 `kill -15`\
  \ 命令，它发送 `SIGTERM` 信号尝试干净地杀死进程。如果进程无法干净退出，可以使用 `kill -9` 通过发送 `SIGKILL` 信号强制地停止进程。如果成功，其他相关进程可能仍在运行。\n\
  \n有时，多个进程以相同的名称运行。例如，Apache 服务器启动了多个同时运行的进程。杀死一个进程是低效的；以下命令将杀死所有当前运行的服务器进程（假设没有其他问题）：\n\
  \n```\n# killall httpd\n```\n\n\n\n\nLinux 内核有数百个可以进行调优以提高系统性能设置。某些参数可以通过 `sysctl`\
  \ 命令和 `/etc/sysctl.conf` 文件进行配置，其他则可以通过 `/sys` 文件系统，或通过向 Linux 内核添加特殊的启动选项来配置。\n\
  \n涵盖所有可能的调优设置本身就需要一本书了。幸运的是，RHEL 9 自带了 `tuned`，这是一个守护进程，简化了优化系统以获得最佳性能这一艰巨且复杂的过程。\n\
  \n`tuned` 服务在每个 RHEL 9 系统上都应该默认安装并启用。如果该包不存在，请运行：\n\n```bash\n# dnf -y install tuned\n\
  ```\n\n你可以使用以下命令启用并启动该服务：\n\n![Images](img/f0365-02.jpg)\n\n### 列出 tuned 配置文件\n\n\
  `tuned` 的配置基于预定义的配置文件（profiles）。当然，你可以添加并定义自己的配置，但这超出了 RHCSA 考试的范围。\n\n要与 `tuned`\
  \ 服务进行交互并进行配置，请使用 `tuned-adm` 命令。例如，`tuned-adm list` 显示所有可用配置的列表；输出如图 9-7 所示。\n\n\
  图 9-7 tuned 配置文件\n\n![Images](img/F09-07.jpg)\n\n如你所示，有十种不同的可用配置。输出还显示系统当前激活的配置是\
  \ virtual-guest。你可以通过以下命令获取相同的信息：\n\n![Images](img/f0365-03.jpg)\n\n表 9-4](#ch09.xhtml_ch9tab4)描述了每个配置的用途。请注意，你系统的配置列表可能略有不同，因为\
  \ Red Hat 在 RHEL 的新版本中不断审查并引入新的配置。\n\n表 9-3 默认 tuned 配置\n\n![Images](img/f0366-01.jpg)\n\
  \n### 切换 tuned 配置文件\n\n切换到不同的配置可以通过 `tuned-adm profile` 命令实现。例如，切换到 throughput-performance\
  \ 配置，运行：\n\n```bash\n# tuned-adm profile throughput-performance\n```\n\n新的调优优化立即生效，更改在系统重启后依然有效。要确认当前配置，运行：\n\
  \n![Images](img/f0367-01.jpg)\n\n安装后，`tuned` 守护进程会为你的系统确定最佳配置并将其选为默认。如果你切换到了另一个配置，但不记得\
  \ `tuned` 选择的哪个是默认配置，你可以运行：\n\n![Images](img/f0367-02.jpg)\n\n### 认证目标 9.02\n\n\
  ### 归档与压缩\n\nLinux 包含了多种用于文件组归档的命令。某些归档可以重新处理成 RPM 等包。其他归档仅用作备份。无论何种情况，归档都是非常方便的，特别是在压缩后。本节专门探讨了\
  \ RHCSA 目标中引用的归档和压缩命令。这些“本质工具”包括 `gzip`、`bzip2`、`tar` 和 `star` 命令。\n\n#### gzip\
  \ 和 bzip2\n\n`gzip` 和 `bzip2` 命令的功能相似，因为它们都用于压缩和解压缩文件，只是算法不同。`gzip` 命令使用 DEFLATE\
  \ 算法，而 `bzip2` 命令使用 Burrows-Wheeler 块排序算法。虽然它们运行良好，但 `bzip2` 命令具有更高的压缩率。例如，可以使用以下两个命令之一来压缩名为\
  \ big.doc 的大文档文件：\n\n![Images](img/f0367-03.jpg)\n\n这将为文件添加 `.gz` 或 `.bz2` 后缀，使用关联算法进行压缩。使用\
  \ `-d` 参数，你可以使用相同的命令反转过程：\n\n![Images](img/f0367-04.jpg)\n\n作为替代方案，可以使用 `gunzip`\
  \ 和 `bunzip2` 命令实现相同目的。\n\n#### tar\n\n`tar` 命令最初用于将数据归档到磁带驱动器。然而，现在通常用于将一系列文件（特别是来自目录）收集到一个归档文件中。例如，以下命令将\
  \ `/home` 目录的信息备份到 `home.tar.gz` 文件中：\n\n```bash\n# tar czvf home.tar.gz /home\n\
  ```\n\n与 `ps` 命令一样，这是少数不需要在开关前加连字符的命令之一。此特定命令创建 (`c`) 一个归档，压缩 (`z`) 它，并在详细模式 (`v`)\
  \ 下运行，并随其后的是文件名 (`f`)。或者，你可以使用以下命令从该文件中提取 (`x`)：\n\n```bash\n# tar xzvf home.tar.gz\n\
  ```\n\n指定的压缩格式 (`z`) 与 `gzip` 命令相关；如果你想使用 `bzip2` 压缩，请替换为 `j` 参数。`tar` 命令可以使用 `--selinux`\
  \ 选项存储和提取访问控制列表设置或 SELinux 属性。\n\n如果你没有没有 `--selinux` 选项 tar 归档，可以进行补偿。你可以使用第 8\
  \ 章](#ch08.xhtml) 中描述的 `restorecon` 等命令恢复归档的 SELinux 上文。\n\n#### star\n\n`star`\
  \ 命令获得普及是因为它是第一个支持在 SELinux 系统中归档文件的命令。由于通常没有安装 `star`，你需要安装它；一种方法是使用以下命令：\n\n```bash\n\
  # dnf install star\n```\n\n遗憾的是，`star` 命令的工作方式与 `tar` 不完全相同。如果你必须使用 `star` 命令，务必练习该命令。例如，以下命令将从当前\
  \ `/home` 目录创建一个包含所有 SELinux 上文的归档：\n\n```bash\n# star -xattr -H=exustar -c -f=home.star\
  \ /home/\n```\n\n `-xattr` 参数保存与 SELinux 相关的扩展属性。 `-H=exustar` 参数使用 exustar 格式记录归档，如果指定\
  \ `-acl` 参数则允许存储 ACL。 `-c` 创建新归档 `-f` 指定归档文件名。\n\n一旦创建归档，可以使用以下命令解包：\n\n```bash\n\
  # star -f=home.star\n```\n\n如果需要，可以使用上述 `gzip` 或 `bzip2` 命令压缩归档，或者通过 `star` 的 `-z`\
  \ 或 `-bz` 参数。`star -x` 命令可以检测并从配置了各种压缩方案的归档恢复文件，如日志信息所示：\n\n![Images](img/f0369-01.jpg)\n\
  \n### 认证目标 9.03\n\n### 定时运行任务：cron 和 at\n\n\n\n\n\n`/etc/crontab` 文件采用特定格式设置。每行可以是空行、注释（以\
  \ `#` 开头）、变量或配置行。自然地，空行和注释会被忽略。在某些 Linux 发行版中，该文件包含作业调度表。在 RHEL 9 中，默认的 `crontab`\
  \ 文件仅包含其他相关配置文件的格式。\n\n用户运行常规命令。任何运行新进程的人（无论是你还是守护进程）都会继承一个由各种环境变量组成的“环境”。要查看当前用户的环境变量，请运行\
  \ `env` 命令。如果该用户是你的账户，RHEL 中的一些标准变量包括：`HOME`（它应该与你的主目录匹配）、`SHELL`（它应该与默认 shell 匹配）以及作为用户名的\
  \ `LOGNAME`。\n\n你可以在 `/etc/crontab` 和其他 cron 文件（位于 `/etc/cron.d`、`/etc/cron.daily`\
  \ 等目录下）中设置其他变量：\n\n`Variable=Value`\n\n某些变量已经为你设置好了。例如，如果你的用户名是 michael，则 `MAIL`\
  \ 为 `/var/spool/mail/michael`，`LANG` 为 `en_US.UTF-8`，`PATH` 是 shell 查找命令的位置。你可以在各种\
  \ cron 配置文件中为这些变量设置不同的值。例如，默认的 `/etc/crontab` 文件包含以下变量：\n\n![Images](img/f0370-02.jpg)\n\
  \n注意，cron 配置文件的 `PATH` 变量可能与 shell 关联的 `PATH` 变量不同。事实上，这两个变量是独立的。因此，如果命令不在 `crontab`\
  \ 的 `PATH` 中，你需要在每个 cron 配置文件中都指定每个命令的精确路径。\n\n![Images](img/job.jpg)\n\n`MAILTO`\
  \ 变量可以帮助你管理多个 Linux 系统。`cron` 守护进程会通过电子邮件发送作业发送到 `stdout` 或 `stderr` 的任何输出。只需添加诸如\
  \ `MAILTO=me@example.net` 的行，将所有 cron 作业的输出路由到该电子邮件地址即可。\n\n`/etc/crontab` 中行的格式现在在注释中详细说明，如\
  \ 图 9-8 所示。这些列中的每一列都在 表 9-5 中进行了更详细的解释。\n\n图 9-8 crontab 格式\n\n![Images](img/F09-08.jpg)\n\
  \n表 9-5 cron 配置文件的列\n\n![Images](img/f0371-01.jpg)\n\n如果你在任何列中看到星号（*），`cron` 守护进程将为该列的所有可能值运行该命令。例如，分钟字段中的\
  \ `*` 意味着命令在指定的小时内每分钟运行一次。考虑此处显示的示例：\n\n![Images](img/f0370-03.jpg)\n\n此行代码会在每年\
  \ 4 月 3 日凌晨 5:01 运行 `ls` 命令。星期列中的星号仅意味着无论星期几并不重要；`crontab` 仍然会在指定时间运行 `ls` 命令。\n\
  \n与 `cron` 守护进程关联的条目是灵活的。例如，小时字段中的 `7–10` 条目将在上午 7:00、8:00、9:00 和 10:00 运行指定的命令。分钟字段中的条目列表，如\
  \ `0,5,10,15,20,25,30,35,40,45,50,55`，将每五分钟运行一次指定的命令。但有很多数字。分钟字段中的条目 `*/5` 将产生相同的结果。`cron`\
  \ 守护进程还能识别月份和星期的缩写。\n\n实际命令是第六个字段。你可以使用百分号（`%`）设置新行。第一个百分号之后的所有文本将作为标准输入发送给命令。这对于格式化标准输入非常有用。以下是一个\
  \ cron 文件的示例：\n\n![Images](img/f0371-02.jpg)\n\n### 小时 cron 作业\n\n现在是时候看示例 cron\
  \ 文件了。讨论的文件和脚本仅限于 server1.example.com 系统上看到的。许多不同的软件包添加它们自己的 cron 作业。根据 `/etc/cron.d`\
  \ 目录下的 `0hourly` 脚本，与 `cron` 守护进程关联的某些作业每小时运行一次。该文件包含了上述 `/etc/crontab` 文件相同的变量。对于小时作业，它包含一行：\n\
  \n![Images](img/f0372-01.jpg)\n\n根据上一节提供的信息，你应该能够读取这一行。`run-parts` 命令加载其后续目录中的每个脚本；该目录中的脚本以\
  \ root 用户身份执行。当然，前五列指定了时间；脚本会在每小时的后一分钟、每小时、每天、每月、每周的每一天运行。\n\n`/etc/cron.hourly`\
  \ 目录中感兴趣的脚本是 `0anacron`，它会检查 `/var/spool/anacron/cron.daily` 文件的内容，以查看当天是否已运行过 `anacron`\
  \ 命令。如果没有运行，并且系统没有在使用电池供电（例如，正在使用电源），则执行 `anacron` 命令。\n\n### 定期 acron 作业\n\n`/etc/cron.hourly`\
  \ 目录中的脚本是 `0anacron`，它检查 `/var/spool/anacron/cron.daily` 文件的内容，以查看当天是否已运行过 `anacron`\
  \ 命令。如果没有运行，并且系统没有在使用电池供电，则执行 `anacron` 命令。\n\n\n\n\n在此练习中，你将修改 crontab，以便在 1 月的每周一下午\
  \ 1:05 读取一个文本文件。要实现此操作，请使用以下步骤：\n\n1. 以普通用户身份登录。\n2. 创建 `~/bin` 目录。创建一个名为 `taxrem.sh`\
