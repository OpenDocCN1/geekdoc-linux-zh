  \n![Images](img/f0214-06.jpg)\n\n## 第 6 章\n\n## 用户管理\n\n### 认证目标\n\n- 6.01 用户管理\n\
  - 6.02 管理控制\n- 6.03 用户和 Shell 配置\n- 6.04 特殊组\n\n### 考试内容\n\n本章涉及若干 RHCSA 目标。简而言之，这些目标包括：\n\
  \n![Images](img/square.jpg) 在多用户目标中登录并切换用户\n\n这意味着你需要知道当 RHEL 9 运行在多用户或图形目标运行时如何使用普通账户登录。要切换用户，你需要知道如何使用\
  \ `su` 命令切换到不同的账户。\n\n![Images](img/square.jpg) 创建、删除和修改本地用户账户\n\n![Images](img/square.jpg)\
  \ 修改密码并调整本地用户账户的密码有效期\n\n![Images](img/square.jpg) 创建、删除和修改本地组及组成员。你可以使用 `useradd`、`usermod`、`groupadd`、`groupmod`\
  \ 和 `chage` 命令以及 Cockpit 来完成这些任务。虽然本章解释了如何使用这两种工具，但不能保证考试期间可以使用 Cockpit。\n\n![Images](img/square.jpg)\
  \ 配置超级用户访问\n\n你必须能够使用 `/etc/sudoers` 文件和 `wheel` 组分配 root 权限。\n\n![Images](img/square.jpg)\
  \ 创建并配置协作的 set-GID 目录\n\n该目标涉及如何为一组用户设置一个或多个协作目录。\n\n\n\n\n\n如果您按照第 1 章中的说明安装了 RHEL\
  \ 9，默认的 Red Hat 安装除了 root 管理员账户外，应该包含一个普通用户账户。虽然除了 root 之外不需要普通用户账户，但设置一些普通用户账户是非常重要的。即使您将是系统中唯一的用户，也请至少创建一个非管理员账户，以供日常工作使用。这样，您就可以只在需要管理系统时才使用\
  \ root 账户。您可以使用多种工具向 Red Hat Enterprise Linux 系统中添加账户，包括直接编辑密码配置文件（手动方法）、`useradd`\
  \ 命令（命令行方法）以及 Cockpit Web 控制台（图形化方法）。\n\n### 不同类型的用户\n\nLinux 用户账户有三种基本类型：超级用户（root）、普通用户和系统用户。超级用户\
  \ root 账户在安装 Linux 时会自动创建，它拥有对 Linux 系统上所有服务的管理权限。有机会接管此账户控制的“黑帽”黑客可以完全控制该系统。\n\n\
  在您需要以管理员身份登录时，RHEL 为 root 用户内置了安全保护措施。以 root 用户身份登录，然后运行 `alias` 命令。您将看到如下的条目：\n\
  \n```\nalias rm='rm -i'\n```\n\n由于这个特定的别名，当 root 用户运行 `rm` 命令时，shell 实际上执行的是 `rm\
  \ -i` 命令，这会在 `rm` 命令删除文件之前提示确认。请注意`rm` 中的 `-f` 选项（例如 `rm -f *filename`）会覆盖此安全设置。\n\
  \n普通用户拥有执行 Linux 计算机执行标准任务的必要权限。他们可以访问 bash、数据库或网络浏览器等程序。他们可以在自己的家目录中存储文件。由于普通用户通常不具备管理权限，他们无法意外删除关键的操作系统配置文件。您可以为大多数用户分配普通账户，放心地知道他们无法利用该账户拥有的权限破坏系统。\n\
  \nApache、邮件（mail）和打印等服务拥有各自的系统账户。这些账户的存在是为了允许这些服务中的每一项与 Linux 系统交互，并且不允许在系统中进行交互式登录。通常情况下，您不需要更改任何系统账户，但如果您发现有人正在通过这些账户之一运行命令\
  \ shell，请务必警惕。可能有人入侵了您的系统。\n\n![Images](img/job.jpg)\n\n**要查看最近的登录情况，请运行 `last |\
  \ less` 命令。如果登录是从远程位置进行的，它将与网络外的特定 IP 地址相关联。**\n\n要显示用户的身份，请输入 `id` 命令后跟用户名，或直接输入\
  \ `id` 显示当前用户的身份。`id` 命令显示的示例信息所示：\n\n![Images](img/f0217-02.jpg)\n\n忽略输出中的最后一行，该行定义了\
  \ SELinux 上文。`id` 命令显示了用户的数字用户 ID (UID) 以及括号内的名称。每个用户都属于一个主组，该组通过其组 ID (GID) 和名称显示。该命令显示了用户所属的所有组，以及它们的\
  \ GID 和名称。\n\n## 影子密码套件 (Shadow Password Suite)\n\n当 Unix 在 20 世纪 70 年代最初开发时，安全性并不是一个被严重考虑的问题。用户和组管理所需的一切都包含在\
  \ `/etc/passwd` 和 `/etc/group` 文件中。如名所示，密码最初存储在 `/etc/passwd` 文件中。问题是该文件是“世界可读”的。在影子密码套件引入之前，任何拥有该文件副本的人都拥有每个用户的加密密码副本。尽管密码不是以明文保存的，但它们可能容易受到破解攻击。例如，如果密码是基于常用字典词汇，字典攻击通常可以在几秒钟内破解密码。这就是开发影子密码套件的主要动力，它将更敏感的信息移动到只有\
  \ root 管理员用户才能读取的其他文件中。\n\n影子密码套件的四个配置文件是 `/etc/passwd`、`/etc/group`、`/etc/shadow`\
  \ 和 `/etc/gshadow`。用户账户的默认设置存储在 `/etc/login.defs` 文件中。\n\n### /etc/passwd 文件\n\n\
  `/etc/passwd` 文件包含每个用户的基本信息。在文本编辑器中打开该文件并简单浏览。在文件顶部，第一行定义了 root 登录账户（超级用户）。文件中的其他用户可能与邮件、ftp\
  \ 和 sshd 等服务相关。可能存在设计用于登录系统的普通用户。`/etc/passwd` 文件的节录所示图 6-1。\n\n图 6-1 /etc/passwd\
  \ 文件\n\n![Images](img/F06-01.jpg)\n\n`/etc/passwd` 文件中有七列信息，由冒号分隔。`/etc/passwd`\
  \ 中的每一列都包含特定信息。例如，下行定义的用户账户有七个字段，在表 6-1 中描述：\n\n表 6-1 /etc/passwd 结构\n\n![Images](img/f0219-02.jpg)\n\
  \n```\nmj:x:1000:1000:Michael Jang:/home/mj:/bin/bash\n```\n\nRHEL 9 版本的 `/etc/passwd`\
  \ 与某些 Linux 发行版相比包含了更安全的用户账户。具有真实登录 shell 的账户是用户账户。服务账户（如 mail 或 nobody）被分配了错误的\
  \ `/sbin/nologin` shell。\n\n### /etc/group 文件\n\n每个 Linux 用户分配到一个*主组*，该组对应 `/etc/passwd`\
  \ 中定义的 GID。默认情况下，RHEL 中的每个用户都有一个与其用户名同名的私有组。用户也可以其他组的成员，这些组通常被称为*附加组*。主组的主要目的是为新文件分配所有者。所有文件都由创建它们的\
  \ UID 和主组 GID 所有。\n\n在文本编辑器中打开 `/etc/group`。简单浏览。该文件的第一行指定了 root 管理员组的信息。某些组有特殊用途。例如，成为\
  \ wheel 组的成员可以通过 sudo 运行管理命令，这将在章节后文中解释。`/etc/group` 文件的节录所示图 6-2。\n\n图 6-2 /etc/group\
  \ 文件\n\n![Images](img/F06-02.jpg)\n\n`/etc/group` 文件中有四列信息，由冒号分隔。例如，下行定义的组四个字段，在表\
  \ 6-2 中描述：\n\n表 6-2 /etc/group 结构\n\n![Images](img/f0221-01.jpg)\n\n```\nreviewers:x:2000:mj,ao,sd\n\
  ```\n\n### /etc/shadow 文件\n\n`/etc/shadow` 文件是 `/etc/passwd` 的补充。它包含八列信息，第一列包含与\
  \ `/etc/passwd` 相同的用户名列表。只要 `/etc/passwd` 每个条目的第二列中有 *x*，Linux 就会去 `/etc/shadow`\
  \ 查看更多信息。在文本编辑器中打开该文件并简单浏览。你将看到相同的信息模式，从 root 管理员开始。`/etc/shadow` 文件的节录所示图 6-3。\n\
  \n图 6-3 /etc/shadow 文件\n\n![Images](img/F06-03.jpg)\n\n\n\n\n\n如表 6-3 所示，`/etc/shadow`\
  \ 的第二列包含加密后的密码，其余信息与密码管理方式有关。第二列的前两个字符指定了密码的加密哈希算法。如果你看到 `$1`，则密码使用消息摘要算法 5 (MD5)\
  \ 算法哈希，这是 RHEL 5 时代的标准。如果你看到 `$6`，则密码使用 512 位安全哈希算法 (SHA-512)保护，这是自 RHEL 6 以来的标准。\n\
  \n表 6-3 `/etc/shadow` 结构\n\n![Images](img/f0222-01.jpg)\n\n请注意图 6-3 中的某些用户在密码字段中具有\
  \ `*` 或 `!!` 字符。这意味着用户将无法使用密码登录。这是系统用户账户的标准配置。\n\n![Images](img/exam.jpg)\n\n如果你不记得本节描述的文件中某个字段的含义，请打开相应的帮助页（man\
  \ page）。请注意 `man passwd` 显示的是 `passwd` 命令的帮助页，而 `man 5 passwd` 是显示 `/etc/passwd`\
  \ 文件的正确命令。\n\n### /etc/gshadow 文件\n\n`/etc/gshadow` 文件是影子密码套件中的组配置文件。它包含了组管理员，管理员可以使用\
  \ `gpasswd` 命令添加其他组成员。如果需要，你甚至可以配置哈希密码。一旦设置了密码，组管理员可以使用 `gpasswd` 命令并输入所需的密码向组中添加或删除成员。`/etc/gshadow`\
  \ 文件的片段如图图 6-4 所示。例如，下行定义的组具有四个字段，如表 6-4 所示：\n\n图 6-4 `/etc/gshadow` 文件\n\n![Images](img/F06-04.jpg)\n\
  \n表 6-4 `/etc/gshadow` 结构\n\n![Images](img/f0223-02.jpg)\n\n```\n`reviewers:!:mj:mj,ao,sd`\n\
  ```\n\n### /etc/login.defs 文件\n\n`/etc/login.defs` 文件为影子密码套件中的许多参数提供了基准。本节对该文件默认版本中的某些活动指令进行了简要分析。如你所见，配置选项超出了认证范围。请记住，如果你更改了任何设置，这些设置仅对新用户有效，对现有用户无效。\n\
  \n`/etc/login.defs` 文件中的第一个配置参数指定了邮箱所在的目录：\n\n```\nMAIL_DIR /var/spool/mail\n```\n\
  \n在文件中，有三个与默认密码过期信息相关的指令。这些指令在文件内部的注释以及表 6-5 中进行了解释。\n\n表 6-5 `/etc/login.defs`\
  \ 密码老化配置参数\n\n![Images](img/f0224-01.jpg)\n\n如前所述，普通用户和组的用户 ID (UID) 和组 ID (GID)\
  \ 数字从 1000 开始。由于 Linux 支持超过 40 亿的 UID 和 GID 数字（实际上高达 $2^{32} – 1$），`/etc/login.defs`\
  \ 文件中定义的 60000 最大 UID 和 GID 看起来可能很奇怪。然而，这为其他用户数据库留下了更高的数字，例如与 OpenLDAP 或 Microsoft\
  \ Active Directory 关联的数据库。在以下几行中，`UID_MIN` 指定创建新普通用户时分配的最小 UID，`UID_MAX` 指定最大 UID，依此类推：\n\
  \n![Images](img/f0224-03.jpg)\n\n同样，带有 `-r` 选项的 `useradd` 和 `groupadd` 命令分别创建系统用户或系统组，其\
  \ ID 在以下范围内选择：\n\n![Images](img/f0224-04.jpg)\n\n通常，当运行 `useradd` 命令创建新用户时，它会自动创建家目录，这可以通过以下指令得到确认：\n\
  \n![Images](img/f0224-05.jpg)\n\n如本章后文所述，其他文件会设置 umask 的值。但如果这些其他文件不存在，该指令将规定普通用户的默认\
  \ umask：\n\n![Images](img/f0224-06.jpg)\n\n以下指令在实现用户私有组方案至关重要。在 във配置方案中，用户成为自己的私有组的成员，通常具有相同的\
  \ UID 和 GID 数字。以下指令意味着对于非 root 用户，umask 组位将与所有者位相同。此外，如果组中的所有用户都被删除，该组也将被删除。\n\n\
  ![Images](img/f0225-01.jpg)\n\n最后，以下指令用于确定加密密码时使用的算法，默认为 SHA 512：\n\n![Images](img/f0225-02.jpg)\n\
  \n![Images](img/exam.jpg)\n\n**本节讨论的工具可以帮助你创建、删除和修改本地用户账户。**\n\n#### 命令行工具\n\n通过命令行界面添加用户有两种基本方法。作为\
  \ root 用户，你可以直接通过在 vi 等文本编辑器编辑 `/etc/passwd` 文件来添加用户。为此，第 2 章描述了 `vipw` 和 `vigr`。或者，你可以使用为了该目的而定制的文本命令。\n\
  \n##### 直接添加用户\n\n在你选择的文本编辑器中打开 `/etc/passwd` 文件。如第 2 章所述，你可以通过 `vipw` 命令来实现。然而，如果你通过直接编辑影子密码套件的文件来添加用户，你还需要额外做两件事：\n\
  \n![Images](img/square.jpg) *添加用户家目录。* 例如，对于用户 donna，你必须添加 `/home/donna` 目录，并确保用户\
  \ donna 和组 donna 都拥有该目录的所有权。\n\n![Images](img/square.jpg) *填充用户家目录。* 默认选项是从 `/etc/skel`\
  \ 目录复制文件（该目录将在后文讨论）。你还必须确保用户 donna 和组 donna 拥有复制到 `/home/donna` 的文件的所有权。\n\n#####\
  \ 直接将用户添加到组\n\n每个 Linux 用户都被分配给一个组，至少是自己的私有组。`/etc/group` 文件中列出的用户主组的 GID 数字必须与\
  \ `/etc/passwd` 文件中显示的用户 GID 匹配。该用户通常是该组的唯一成员。\n\n\n\n\n\n另一种，你可以使用 `useradd` 命令来简化此过程。`useradd\
  \ michael` 命令会将用户 `michael` 添加到 `/etc/passwd` 文件中。此外，`useradd` 命令会创建 `/home/michael`\
  \ 主目录，从 `/etc/skel` 目录添加标准文件，并分配默认 shell `/bin/bash`。`useradd` 命令是 RHEL 上添加用户的推荐方法。它包含许多命令行选项，最常用的如\
  \ 表 6-6 所示。\n\n#### 表 6-6 useradd 命令选项\n\n![Images](img/f0227-01.jpg)\n\n#### 分配密码\n\
  \n一旦创建了新用户，你可以使用 `passwd *username` 命令为该用户分配密码。例如，`passwd pm` 命令会提示你为用户 `pm` 分配一个新密码。出于安全考虑，RHEL\
  \ 配置为避免使用基于字典单词、长度少于 8 个字符、过于简单、基于回文以及其他类似的密码。尽管如此，如果由 root 用户运行 `passwd` 命令，这些密码是合法的且被接受的。\n\
  \n#### 在命令行添加或删除组\n\n当适宜向影子密码套件添加特殊组时，你可能需要使用 `groupadd` 命令。通常，你会希望配合 `-g` 选项使用它。例如，以下命令将设置一个\
  \ GID 为 60001 的特殊项目组：\n\n```\n# groupadd -g 60001 project\n```\n\n如果你不使用 `-g` 选项，`groupadd`\
  \ 命令将采用下一个可用的 GID 数字。例如，如果系统中配置了两个普通用户，他们的 `UID` 和 `GID` 分别为 1000 和 1001。如果你在没有指定\
  \ GID 数字的情况下运行了 `groupadd project` 命令，则项目组将被分配 GID 1002。创建的下一个普通用户将获得 `UID` 1002\
  \ 和 `GID` 1003，这可能会导致混淆。\n\n幸运的是，删除组的命令更简单。如果项目组已完成工作，你可以使用以下命令从影子密码套件数据库中删除该组：\n\
  \n```\n# groupdel project\n```\n\n#### 删除用户\n\n删除用户账户是一个直接的过程。删除用户账户的最简单方法是使用 `userdel`\
  \ 命令。默认情况下，该命令不会删除该用户的主目录，因此管理员可以从该用户转移文件，或许交给接手删除用户任务的员工。另一种，`userdel -r *username`\
  \ 命令会删除该用户的主目录以及存储在该主目录中的所有文件。\n\n![Images](img/exam.jpg)\n\n**如果你同时知道 CLI 和 GUI\
  \ 方法来执行某任务，请使用 CLI 方法。它几乎总是能节省时间。**\n\n这比 GUI 方法快得多，使用 GUI 方法需要你打开 Cockpit Web 控制台，选择用户，然后点击删除。虽然对于经验较少的用户来说，记住\
  \ GUI 方法可能更容易，但文本命令可以为你节省时间。\n\n### 练习 6-1\n\n**使用 Cockpit Web 控制台添加用户**\n\n`useradd`\
  \ 和 `usermod` 等用户管理命令的另一种替代方案是 Red Hat Cockpit Web 控制台。\n\n1. 如果不存在 `cockpit` RPM\
  \ 包，请安装它：\n\n```\n# rpm -q cockpit || dnf install cockpit\n```\n\n2. 通过防火墙允许 Cockpit\
  \ 服务：\n\n![Images](img/f0228-02.jpg)\n\n3.  Cockpit 服务：\n\n```\n# systemctl enable\
  \ --now cockpit.socket\n```\n\n4. 打开 Firefox 并指向 URL [`localhost:9090`](https://localhost:9090)。接受服务器证书，使用\
  \ root 账户凭据登录，选择账户（Accounts）页面，并点击创建新账户（Create New Account）。这将打开一个窗口，如下：\n\n![Images](img/I06-01.jpg)\n\
  \n6. 填写表单。除了全名（Full Name）外，所有项目均为必填项。这些项目非常易懂。密码应至少有 8 个字符，且理想情况下包含大小写字母、数字和标点符号的混合，以更好地防止标准的密码破解程序。\n\
  \n7. 在确认（Confirm）字段中输入相同的密码，完成后点击创建（Create）。\n\n8. 选择你刚刚创建的账户。你将看到下面的屏幕。勾选服务器管理员（Server\
  \ Administrator）复选框赋予用户管理员权限。\n\n![Images](img/I06-02.jpg)\n\n9. 根据需要对任何可能需要的额外新用户重复此过程。确保在运行练习\
  \ 6-2 之前至少创建一个创建一个新用户。\n\n### 练习 6-2\n\n**真实与虚假 Shell**\n\n除非本地系统已创建了普通用户，否则请勿运行此练习。如果需要，请先运行练习\
  \ 6-1，因为那允许你在目标系统上创建一个新的普通用户。\n\n1. 打开 `/etc/passwd` 文件。找到一个 `UID` 为 1000 或以上的当前普通用户。\n\
  \n2. 识别默认 shell。它在 `/etc/passwd` 中指定。\n\n3. 修改 `/etc/passwd` 文件，将默认 shell 更改为 `/sbin/nologin`。\n\
  \n4. 尝试以修改后的用户登录。\n\n#### 修改账户\n\n作为 Linux 管理员，你可能想要修改现有账户。虽然 Cockpit Web 控制台用于创建或删除非常简单，但命令行选项提供了更多功能。\n\
  \n##### usermod\n\n`usermod` 命令修改 `/etc/passwd` 中的设置。此外，它允许你更改 `/etc/shadow` 中的设置（例如账户过期日期），或将用户添加到\
  \ `/etc/group` 中的附加组。例如，以下命令将 user1 账户设置为 2023 年 6 月 8 日过期：\n\n```\n# usermod -e\
  \ 2023-06-08 user1\n```\n\n以下命令使 user1 成为 accounting 组的成员：\n\n```\n# usermod -G\
  \ accounting user1\n```\n\nusermod 命令与 `useradd` 命令密切相关；事实上，`usermod` 命令支持 表 6-6\
  \ 中列出的所有 `useradd` 选项。`usermod` 命令包含一些额外的选项，如 表 6-7 所示。\n\n#### 表 6-7 usermod 命令选项\n\
  \n![Images](img/f0231-01.jpg)\n\n##### groupmod\n\n`groupmod` 命令相对简单。它有两个实际用途。以下命令更改名为\
  \ project 的组的 GID 数字（在此例为 60002）：\n\n```\n# groupmod -g 60002 project\n```\n\n相比之下，以下命令将名为\
  \ project 的组更名为 secret：\n\n```\n# groupmod -n secret project\n```\n\n##### chage\n\
  \n`chage` 命令主要用于管理密码的老期信息，通过修改 `/etc/shadow` 文件中的相应字段来实现。虽然某些参数也可以通过 `useradd` 和\
  \ `usermod` 命令设置，但大多数命令选项是不同的，如 表 6-8 所示。\n\n#### 表 6-8 chage 命令选项\n\n![Images](img/f0232-01.jpg)\n\
  \n### 认证目标 6.02\n\n\n\n\n\n# 管理控制\n\n让管理员以普通用户的身份执行大多数操作是非常重要的，因为 root 管理用户对系统拥有完全权限。对普通用户的限制可以帮助\
  \ Linux 系统免受意外事故。拥有 root 管理密码的普通用户可以使用 `su` 命令临时获取 root 权限。`su` 命令还可以允许用户变成另一个用户，只要指定了目标用户的正确密码即可。\n\
  \n`su` 和 `sudo` 命令都允许以另一个用户的身份运行命令，以及以另一个用户的身份打开 shell。对于管理任务，`sudo` 提供了更大的灵活性，因为配置可以精确指定用户允许运行哪些命令。通过\
  \ `/etc/sudoers` 文件，可以设置具有部分或完整 root 管理权限的专用管理员，或者以其他身份执行命令。\n\n## 登录能力\n\n`/etc/security/access.conf`调节所有用户的访问。虽然这个主题没有明确列在\
  \ RHCSA 考试目标中，但它是你作为系统管理员应该掌握的重要技能。\n\n默认情况下，在 RHEL 9 中，`/etc/security/access.conf`\
  \ 文件没有任何作用。要启用 `access.conf`，请向 `/etc/pam.d/password-auth` 和 `/etc/pam.d/system-auth`\
  \ 中添加以下行：\n\n```\naccount required pam_access.so\n```\n\n该文件的默认版本被完全注释掉了，但注释提供了实用的示例。第一个示例显示了如何禁止（使用\
  \ `-`）除 root 以外的*所有*用户登录第一个虚拟控制台 (`tty1`)：\n\n```\n-:ALL EXCEPT root:tty1\n```\n\
  \n在文件中继续向下滚动。以下几行（使用 `+`）显示了如何允许 root 用户从三个特定的远程 IP 地址以及本地地址访问系统：\n\n![Images](img/f0233-03.jpg)\n\
  \n如果你正在保护系统免受外部网络的影响，这种对直接 root 管理访问的限制是有意义的。只要 `su` 或 `sudo` 命令允许，以普通用户身份远程登录的用户仍然可以相应地提升其权限。\n\
  \n请注意，该文件中的指示指令是按顺序考虑的。因此，如果允许访问（使用 `+`）的指令排在前面，那么接下来的指令将拒绝所有其他用户通过所有其他本地和远程登录的访问：\n\
  \n```\n-:ALL:ALL\n```\n\n## su 命令\n\n在某些情况下（例如红帽考试），以 root 管理用户身份登录是恰当的。但在生产系统中，最好以普通用户身份登录。作为普通用户，你可以使用\
  \ `su` 命令临时打开一个具有 root 管理权限的 shell。通常，该命令会提示 root 管理用户的密码。完成管理任务后，最好退出 root 管理账户；使用\
  \ `exit` 命令将返回该用户的普通账户。\n\n`su -l` 命令略有不同，因为它为 root 管理账户打开了一个*登录 shell*（login shell）。这意味着\
  \ `su -l` 将当前目录更改为 root 用户的家目录 `/root`，并设置用户环境，就像 root 用户直接登录那样。\n\n如果你有第二个用户的密码，可以使用\
  \ `su -l *username*` 命令直接登录该账户。例如，如果你想切换到用户 `dickens` 的账户，你需要运行 `su -l dickens`\
  \ 命令。当你成功输入她的密码时，该命令将你带到 `/home/dickens` 目录。\n\n最后，`su -c` 命令可用于单条命令获取管理权限。例如，可以使用以下命令修改系统上的第一个虚拟驱动器（假设在提示处成功输入了\
  \ root 管理密码）：\n\n```\n$ su -c '/sbin/fdisk /dev/sda'\n```\n\n## 限制 su 访问\n\n如前所述，直接以\
  \ root 管理用户身份的能力是可以被监管的。对管理访问进行进一步限制是可能的。例如，你可以限制允许运行 `su` 命令的用户。这需要两个基本步骤。\n\n\
  首先，你需要列出应该能够访问 `su` 命令的用户。使他们成为 `wheel` 组的一员。默认情况下，`/etc/group` 中的该行看起来如下：\n\n```\n\
  wheel:x:10:\n```\n\n你可以直接使用 `usermod -G wheel *username*` 命令或通过 Cockpit Web 控制台将选定的用户添加到此行的末尾。\n\
  \n其次，这需要更改可插认证模块 (PAM) 的配置。虽然 PAM 不是 RHCE 的目标，但 `/etc/pam.d/su` 文件中有一个注释掉的指令可用于此目的：\n\
  \n![Images](img/f0234-03.jpg)\n\n如果激活了此行，只有 `wheel` 组的成员才被允许使用 `su` 命令。\n\n## sg\
  \ 命令\n\n通过 `sg` 命令，你可以以另一个组的身份执行命令。假设你是 `project` 组的成员。那么命令 `sg project -c *command*`\
  \ 允许你以名为 `project` 的组身份运行命令。例如，以下命令将 `important.doc` 文件复制到指定的目录：\n\n```\n$ sg project\
  \ -c 'cp important.doc /home/project'\n```\n\n目录 `/home/project` 中的文件 `important.doc`\
  \ 属于 `project` 组，因为 `cp` 命令是在项目组下运行的。\n\n## 使用 sudo 命令获取超级用户权限\n\n你可以限制对 `sudo`\
  \ 命令的访问。在 `/etc/sudoers` 中授权的普通用户可以使用自己的密码访问权限。与 `su` 不同，通常 `sudo` 命令要求输入你自己的密码，而不是你尝试访问的用户密码。\n\
  \n要访问 `/etc/sudoers`，运行 `visudo` 命令。`visudo` 命令会锁定 `/etc/sudoers` 文件防止同时编辑，并在退出前检查文件的语法。以下指令在文件的默认版本是激活的。它允许\
  \ root 用户以任何身份运行任何命令：\n\n![Images](img/f0235-01.jpg)\n\n`root` 关键字表示此配置适用于 root\
  \ 用户。益于此配置，root 用户可以从任何主机（由于第一个 `ALL`）以任何身份（由于第二个 `ALL`）运行任何命令（由于最后一个 `ALL`）。\n\n\
  可以给予其他用户管理权限。例如，如果你想允许用户 `boris` 完全管理权限，向 `/etc/sudoers` 添加以下指令：\n\n![Images](img/f0235-02.jpg)\n\
  \n在这种情况下，`boris` 运行管理命令所需的操作是在命令前加上 `sudo`。例如，如果 `boris` 运行以下命令，在启动指定服务之前他会被提示输入自己的普通用户密码：\n\
  \n![Images](img/f0235-03.jpg)\n\n或者，你可以允许特殊用户无需密码即可管理权限。正如文件中注释所示，`/etc/sudoers`\
  \ 中的以下指令将允许 `wheel` 组的所有成员无密码运行管理命令：\n\n![Images](img/f0235-04.jpg)\n\n但不必允许完全管理权限。例如，如果你想允许\
  \ `%users` 组的成员关闭本地系统，请激活以下指令：\n\n![Images](img/f0235-05.jpg)\n\n在许多 Linux 配置文件中，指令前的\
  \ `%` 符号表示一个组。例如，注释中的另一个指令指定了 `%sys` 组成员可以运行的命令组：\n\n![Images](img/f0235-06.jpg)\n\
  \n每条指令都可以与一组命令关联。例如，`sys` 组的用户被允许运行 `PROCESSES` 指令，可以运行与以下配置行关联的命令：\n\n![Images](img/f0235-07.jpg)\n\
  \n\n\n\n类似地，你可以通过以下指令设置一个允许运行这些命令的管理员组：\n\n![Images](img/f0236-01.jpg)\n\n这假设 `/etc/group`\
  \ 和 `/etc/gshadow` 文件中存在如 `admin` 这样的组。\n\n## 认证目标 6.03\n\n## 用户和 Shell 配置\n\n任何\
  \ Red Hat Enterprise Linux 上的上的每个用户在登录系统时都拥有一个环境。该环境定义了 Linux 查找运行程序的目录、登录提示符的外观、终端类型等。本节将解释你如何为本地用户配置默认环境。所有系统级的\
  \ Shell 配置文件都保存在 `/etc` 目录中。这些文件包括 `bashrc`、`profile` 以及 `/etc/profile.d` 目录下的脚本。这些文件和脚本还如前所述，由每个用户家目录下的隐藏文件进行补充。让我们来看这些文件。\n\
  \n### 家目录和 /etc/skel\n\n当使用 `useradd` 等标准命令或 Cockpit Web 控制台创建新用户时，会将一组默认配置文件从 `/etc/skel`\
  \ 目录复制到用户的家目录。\n\n### 家目录\n\n家目录是用户登录 RHEL 系统时的起始目录。大多数用户的家目录是 `/home/*username*`，其中\
  \ *username* 是用户的登录名。通常情况下，每个用户都应该对其自己的家目录拥有写权限，因此每个用户都可以自由地读写自己的文件。\n\n### /etc/skel\n\
  \n`/etc/skel` 目录包含新账户的默认环境文件。`useradd` 命令会将这些文件复制到新用户的家目录。`/etc/skel` 的内容可能有所不同。虽然该目录中的标准文件是隐藏的，但管理员可以自由地为新用户添加更多文件。副本\
  \ `/etc/skel` 中的标准文件见表 6-9。\n\n表 6-9 /etc/skel 目录中的标准文件\n\n![Images](img/f0237-01.jpg)\n\
  \n![Images](img/exam.jpg)\n\nLinux 包含许多以点（.）开头的隐藏文件。列出这些文件请运行 `ls -a` 命令。例如，如果你想列出\
  \ `/etc/skel` 目录下的所有文件，请运行 `ls -a /etc/skel` 命令。\n\n如果你在 RHEL 上安装了标准软件包之外的内容，`/etc/skel`\
  \ 目录中可能会出现额外的配置文件和子目录。例如，某些包的安装可能会在该目录下包含与 emacs 和 Z shell (zsh) 相关的配置文件。\n\n作为系统管理员，你可以编辑这些文件，或在\
  \ `/etc/skel` 中放置自定义文件。当创建新用户时，这些文件会被复制到新用户的家目录。\n\n![Images](img/job.jpg)\n\n`/etc/profile`\
  \ 和 `~/.bash_profile` 在启动交互式 Shell 之前执行，而 `/etc/bashrc` 和 `~/.bashrc` 则会在交互式和非交互式\
  \ Shell（如脚本）中运行。\n\n### /etc/bashrc\n\n`/etc/bashrc` 文件用于系统级的别名（aliases）和函数。用你喜欢的文本编辑器打开此文件。读取文件中的每一行。即使你不理解这些脚本命令，你也可以看到此文件为每个用户设置了以下\
  \ bash shell 参数：\n\n![Images](img/square.jpg) 它分配了一个 `umask` 值，该值设置了新创建文件的默认权限。它为\
  \ root 和系统用户（用户 ID 低 200）支持一组权限，为普通用户支持另一组权限。\n\n![Images](img/square.jpg) 它分配并定义了一个提示符（prompt），即你在命令提示符光标之前看到的内容。\n\
  \n![Images](img/square.jpg) 它包含了来自 `/etc/profile.d/` 目录下 `*.sh` 文件的设置。\n\n这里的设置由每个用户家目录下的\
  \ `.bashrc` 文件进行补充，对于登录 Shell，还由 `/etc/profile`、`.bash_profile` 和 `.bash_logout`\
  \ 文件补充。\n\n### /etc/profile 和 /etc/profile.d\n\n`/etc/profile` 文件用于系统级环境和启动文件，当\
  \ bash 作为交互式 Shell 调用时会被加载（sourced）。\n\n文件的第一部分设置了搜索命令的 `PATH`。通过 `pathmunge` 函数向\
  \ `PATH` 添加额外的目录。然后它导出了 `PATH`、`USER`、`LOGNAME`、`MAIL`、`HOSTNAME`、`HISTSIZE` 和 `HISTCONTROL`\
  \ 变量，最后运行 `/etc/profile.d` 目录中的脚本。你可以使用 `echo $*variable` 命令检查这些变量中任何一个的当前值。\n\n\
  ### /etc/profile.d\n\n`/etc/profile.d` 目录旨在包含在登录或交互式 Shell 中执行的脚本（即不是在脚本或通过 `bash\
  \ -c *command*` 运行的命令中）。如果你执行了“带 GUI 的服务器”安装，以下是部分列表；带有 `.sh` 扩展名的适用于默认 bash shell：\n\
  \n![Images](img/f0238-01.jpg)\n\n在大多数情况下，脚本有两个版本，针对不同的 Shell 环境进行了定制。查看 `/etc/profile.d`\
  \ 脚本目录中的文件。你可以看到该目录中任何以 `.sh` 结尾的脚本都会作为 `/etc/profile` 加载的配置的一部分。具有其他扩展名的脚本涉及 C\
  \ shell。\n\n### 练习 6-3\n\n**另一种安全系统的方法**\n\n另一种安全系统的方法是更改新用户的默认权限。在练习中，你将重新配置它们。\n\
  \n1. 备份当前的 `/etc/bashrc` 和 `/etc/login.defs`。\n2. 打开 `/etc/bashrc`。有两个行设置了 umask。其中一行在上方。尝试确定分配给普通用户的哪个值。\n\
  3. `if` 语句测试用户名和组名是否相同且 UID 大于 199。也就是说，非登录 Shell 赋予 002 umask 值。系统用户赋予 022 umask\
  \ 值。\n4. 修改第一个 `umask` 语句以排除组和其他用户的权限。也就是说，将 002 替换为 077。\n5. 保存并退出文件。\n6. 在 `/etc/login.defs`\
  \ 文件中找到 `UMASK` 指令并将其更改为 077。该 umask 用于登录 Shell。\n7. 以普通非权限用户登录。使用 `touch` 命令创建一个新文件。使用\
  \ `ls -l` 验证该文件的权限。\n8. 打开一个非登录 Shell（即输入 `bash`）。再次使用 `touch` 命令创建一个新文件并使用 `ls\
  \ -l` 验证该新文件的权限。\n9. 从第 1 步创建的备份中恢复原始的 `/etc/bashrc` 和相关文件。\n\n#### 用户家目录中的 Shell\
  \ 配置文件\n\n如前所述，每个用户都会获得 `/etc/skel` 目录中所有文件的副本，通常在创建账户时进行。其中大多数文件是隐藏的，只有通过 `ls -a`\
  \ 等命令才能显示。随着用户开始使用账户，他们的家目录可能会添加更多的配置文件。某些用户可能主要使用默认 bash shell 工作，而另一些用户将会有与其 GUI\
  \ 桌面环境（如 GNOME）相关的额外的配置文件。\n\n\n\n\n\n虽然对于只有几天经验的 Linux 用户来说，这似乎是一个“显而易见”的话题，但 RHCSA\
  \ 的主题之一就是“在多用户目标中登录和切换用户”。它包含了来自不同章节的概念。正如第 5 章所讨论，多用户目标是 `multi-user.target` 和\
  \ `graphical.target`。所有这些目标上都提供了虚拟终端。在 RHEL 9.1 版本中，会出现如下文本登录提示符：\n\n![Images](img/f0240-01.jpg)\n\
  \n主机名以及 RHEL 9 和内核的版本会有所不同。但这些与实际登录无关；你只需要输入用户名，按 `ENTER` 键，然后在提示时输入密码即可。\n\n从命令行注销甚至更简单；`exit`、`logout`\
  \ 和 `CTRL-D` 命令都可以从命令行执行注销。当然，一旦你从系统注销，就会出现刚才显示的登录提示符。\n\n正如本章前面讨论的那样，还有另一种切换用户账户的方法。例如，要从当前账户切换到用户\
  \ donna 的账户，请运行以下命令：\n\n```bash\n$ su -l donna\n```\n\n可以使用相同的 `exit`、`logout` 和\
  \ `CTRL-D` 命令退出用户 donna 的账户。当然，用户也可以登录和注销 GUI。虽然不同桌面环境的步骤略有不同，但它们与登录和注销任何其他系统的步骤一样简单。\n\
  \n### 认证目标 6.04\n\n### 特殊组\n\n在过去，许多 Linux 发行版通常会将所有用户分配到同一个主组，以便他们更容易共享文件。然而，这种方法在安全方面存在缺陷：如果没有仔细配置权限，那么该主组的所有成员都可以访问彼此的文件和目录。这通常是不受欢迎的，因为用户可能不想与组内的所有人共享他们的数据。红帽通过为每个用户分配唯一的组\
  \ ID（`GID`）数字解决了这个问题，增强了安全性和用户隐私。\n\n正如之前提到的，这被称为用户私有组方案。用户对其自己的主组拥有排他性访问权限，而不必担心其他用户读取他们目录中的文件。\n\
  \n#### 标准组和红帽组\n\n在 RHEL 中，每个用户默认都拥有自己的特殊私有组。正如前面提到的，`UIDs` 和 `GIDs` 通常从 1000 开始，分配匹配的数字，并按升序排列。此外，你还可以设置专用用户的特殊组，理想情况下具有较高的\
  \ `GIDs`。例如，管理员可能会为会计部门配置一个组，其 `GID` 可能设为 70000。\n\n#### 共享目录\n\n大多数人以小组形式工作，他们可能想要共享文件。然而，这些组中的人员可能有充分理由让他们的信息对他人隐藏。为了支持此类组，你可以设置一个共享目录，并将访问权限限制在组内成员中。\n\
  \n假设你想为一组会计师设置一个共享目录 `/home/accshared`。为此此，你可以按照以下基本步骤设置共享目录：\n\n1. 创建共享目录：\n```bash\n\
  # mkdir /home/accshared\n```\n\n2. 为会计师创建一个组，命名为 `accgrp`。给它分配一个不与现有组 ID 或用户 ID\
  \ 冲突的组 ID。实现此操作的一种方法是向 `/etc/group` 文件中添加如下的一行。请替换为所需的用户名。\n\n![Images](img/f0241-02.jpg)\n\
  \n3. 为新共享目录设置适当的所有权。以下命令防止任何特定用户控制该目录，并将组所有权分配给 `accgrp`：\n\n![Images](img/f0241-03.jpg)\n\
  \n任何 `accgrp` 组的成员现在都 `/home/accshared` 目录中创建文件并将文件复制到该目录。在该目录下生成或复制到该目录的任何文件将属于\
  \ `accgrp` 组。\n\n这是通过为 `/home/accshared` 目录分配 `2770` 权限实现的。让我们将其分解为各个部分。第一个数字 (2)\
  \ 是 `set group ID bit`，也称为 `SGID 位`。当目录设置了 `SGID 位`时，在该目录中创建的任何文件的组所有权将自动设置为与目录的所有者组相同。此外，从其他目录复制的文件组所有权将被重新分配（在这种情况下，分配给名为\
  \ `accgrp` 的组）。为 `/home/accshared` 目录设置 `SGID 位` 的另一种方法是：\n\n```bash\nchmod g+s\
  \ /home/accshared\n```\n\n剩余数字是任何经验丰富的 Linux 或 Unix 用户的基础知识。`770` 为拥有目录的用户和组设置了读、写、执行权限。其他用户对该目录没有任何权限。\n\
  \n回想第 2 章，目录的读权限允许用户列出其内容，而写权限则提供了在其中创建新文件的能力。目录的执行权限可能是最被误解的，因为那里没有可执行的内容：它只是提供了访问目录内容的权限（即\
  \ `cd` 进入该目录）。\n\n### 练习 6-4\n\n#### 使用 SGID 位控制组所有权\n\n在本次练习中，你将在设计供一组用户共享的目录中创建新文件。你还将看到设置\
  \ `SGID 位` 之前的后的差异。\n\n1. 在设计供一组用户共享的目录中创建新文件。你还将看到设置 `SGID 位` 之前的后的差异。切换回 test1\
  \ 账户，回到 /home/accshared 目录，并创建另一个文件。移除新创建文件对其他用户的权限。检查新创建文件的所有权。你认为用户 test2 现在能再访问此文件吗？（为了亲自验证，请在\
  \ test2 账户下尝试。）\n\n![Images](img/f0243-06.jpg)\n\n\n\n\n\n13. 现在以 `test2` 账户登录。进入\
  \ `/home/testshared` 目录。尝试访问 `testb.txt` 文件。创建一个不同的文件，然后再次使用 `ls -l` 检查权限和所有者。（为了验证操作成功，请尝试从\
  \ `test1` 账户访问此文件。）\n\n14. 切换到 `test3` 账户，并检查该用户是否可以在此目录下创建文件，以及该用户是否可以查看此目录下的文件。如所预期，该用户无法访问\
  \ `/home/testshared` 目录，因为他不属于 `tg1` 组。\n\n## 认证摘要\n\n你可以通过影子密码套件（shadow password\
  \ suite）文件来管理用户和组。这些文件可以通过 `useradd` 和 `groupadd` 等命令或 Cockpit Web 控制台的帮助进行直接修改。用户的配置方式基于\
  \ `/etc/login.defs` 文件。任何变量或系统级设置定义在 `/etc/bashrc`、`/etc/profile` 以及 `/etc/profile.d/`\
  \ 中的文件里。它们可以通过用户家目录下的 `.bashrc` 和 `.bash_profile` 文件进行修改。\n\n有多种方法限制限制权限的使用。登录权限可以通过\
  \ `/etc/security/access.conf` 文件进行规范。可以通过 PAM 的帮助限制对 `su` 命令的访问。可以在 `/etc/sudoers`\
  \ 文件中为 `sudo` 命令配置部分或管理员权限。\n\n默认情况下，红帽企业 Linux 为每个新用户分配唯一的用户 ID 和组 ID 数字。这种用户私有组方案支持为特定用户集配置特殊组。得益于\
  \ SGID 位，该组内的用户可以在专用目录中共享并修改彼此的文件。\n\n## 两分钟演练\n\n以下是来自第 6 章 认证目标中的一些要点。\n\n###\
  \ 用户账户管理\n\n安装后，系统可能只有一个登录账户：`root`。对于日常操作，最好创建一个或多个普通账户。\n\n影子密码套件配置在 `/etc/passwd`、`/etc/shadow`、`/etc/group`\
  \ 和 `/etc/gshadow` 文件中。\n\n管理员可以通过直接编辑影子密码套件文件，或使用 `useradd` 和 `groupadd` 等命令添加用户和组账户。用户账户的配置方式由\
  \ `/etc/login.defs` 文件定义。\n\n可以使用 Cockpit Web 控制台添加账户。\n\n### 管理员控制\n\n登录可以通过 `/etc/security/access.conf`\
  \ 文件进行规范。\n\n可以通过 `/etc/pam.d/su` 文件限制对 `su` 命令的访问。\n\n可以在 `/etc/sudoers` 文件中配置自定义管理员权限。\n\
  \n### 用户和 Shell 配置\n\n新登录账户的家目录是从 `/etc/skel` 目录填充的。\n\n每个用户登录系统时都会根据 `/etc/bashrc`、`/etc/profile`\
  \ 以及 `/etc/profile.d/` 中的脚本拥有一个环境。\n\n所有用户在他们的家目录下都有隐藏的 Shell 配置文件，例如 `.bash_profile`\
  \ 和 `.bashrc`。\n\n### 特殊组\n\n红帽的用户私有组方案为用户配置了各自唯一的的用户 ID 和组 ID 数字。\n\n通过适当 SGID\
  \ 权限，你可以为特定用户组配置共享目录。\n\n设置 SGID 位非常简单：在共享目录上运行 `chmod g+s` 命令即可。\n\n## 自测题\n\n\
  以下问题将帮助衡量你对本章所呈现内容的理解。由于红帽考试中不出现单选题，因此书中也没有出现单选题。这些问题专门测试你对本章的理解。如果你有执行任务的其他方法也是可以。在红帽考试中，获得结果比记住琐碎知识更重要。其中许多问题可能有多个答案。\n\
  \n### 用户账户管理\n\n**1.** 红帽发行版中普通用户的标准最小用户 ID 是？\n\n**2.** 哪个命令创建以 `/sbin/nologin`\
  \ 为 shell 的用户 `mike`？\n\n### 管理员控制\n\n**3.** 哪个文件限制了用户的访问？\n\n**4.** 哪个文件控制用户可以以\
  \ root 或另一个用户的权限运行哪些命令？\n\n**5.** 普通用户使用 `sudo` 命令时，使用什么密码？\n\n### 用户和 Shell 配置\n\
  \n**6.** 如果你想为每个用户账户添加文件，应该使用哪个目录？\n\n**7.** 与 bash shell 相关的系统级配置文件文件有哪些？\n\n###\
  \ 特殊组\n\n**8.** 哪个命令会在 /home/developer 目录上设置 SGID 位？\n\n**9.** 哪个命令会设置 /home/developer\
  \ 目录的所有者为 developer ？\n\n**10.** 哪个命令会将 `alpha` 添加到 developer 组？\n\n## 实验题\n\n红帽以电子方式提供考试。因此，本章的实验可以在网站获取。如果你尚未在系统中设置\
  \ RHEL 9，请参考第 1 章。这些实验的答案在自测之后。\n\n## 自测答案\n\n### 用户账户管理\n\n**1.** 红帽发行版中普通用户的最小用户\
  \ ID 是 1000。\n\n**2.** 命令 `useradd -s /sbin/nologin` 创建了以 `/sbin/nologin` 为 shell\
  \ 的用户 `mike`。\n\n### 管理员控制\n\n**3.** 限制用户访问的文件是 `/etc/security/access.conf`。\n\n\
  **4.** 控制用户以 root 或另一个用户的权限运行哪些命令的文件是 `/etc/sudoers`。\n\n**5.** 当普通用户使用 `sudo` 命令运行管理员命令时，需要该用户的普通密码，除非在\
  \ `/etc/sudoers` 中指定了 `NOPASSWD` 指令。\n\n### 用户和 Shell 配置\n\n**6.** 为每个用户账户添加文件，你应该使用\
  \ `/etc/skel` 目录。\n\n**7.** 与 bash shell 相关的系统级配置文件有 `/etc/bashrc`、`/etc/profile`\
  \ 以及 `/etc/profile.d/` 中的脚本。\n\n### 特殊组\n\n**8.** 在 /home/developer 目录上设置 SGID 命令是\
  \ `chmod g+s /home/developer`。数字选项如 `chmod 2770 /home/developer` 可能不正确，因为它们超出了设置\
  \ SGID 位范围。\n\n**9.** 设置 /home/developer 目录所有者为 developer 组的命令是 `chown :developer\
  \ /home/developer`。实现相同结果的命令（本章未涵盖）是 `chgrp developer /home/developer`。\n\n**10.**\
  \ 将 alpha 添加到 developer 组的命令是 `usermod -aG developer alpha`。注意需要 `-a` 命令选项防止用户从\
  \ `usermod` 命令未列出的其他附加组中移除。\n\n## 实验答案\n\n### 实验 1\n\n\n\n\n\n虽然有多种方法可以创建新用户和组，但它们的结果都应该是相同的。在接下来的步骤中，你将使用\
