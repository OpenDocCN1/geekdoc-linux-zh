  \n\n\n在许多情况下，像 SELinux、Apache 和 Samba 等服务都有自己的日志文件，这些文件定义在各自的配置文件中。细节将在相关服务的章节中介绍。\n\
  \n### 系统日志配置文件\n\n你可以通过 `/etc/rsyslog.conf` 配置文件配置记录的内容。如图 9-10 所示，它包含了一组针对不同设施（facilities）的规则：`authpriv`、`cron`、`kern`、`mail`、`news`、`user`\
  \ 和 `uucp`。\n\n图 9-10 rsyslog.conf \n\n![Images](img/F09-10.jpg)\n\n每个设施还关联多个日志级别，即优先级。按升序，日志优先级为\
  \ `debug`、`info`、`notice`、`warn`、`err`、`crit`、`alert`、emerg`。还有一个通用的 `none`优先级，不记录特定设施的任何消息；例如`authpriv.none`指令将忽略所有认证消息。\n\
  \n对于每个设施和优先级，日志信息会被发送到特定的日志文件。例如，考虑来自 `/etc/syslog.conf` 的以下行：\n\n![Images](img/f0389-01.jpg)\n\
  \n此行将来自所有给定设施的日志信息发送到 `/var/log/messages` 文件。这包含了所有 `info` 级及以上的设施消息，但 `mail`、`authpriv`（认证）和\
  \ `cron` 设施相关的日志除。\n\n你可以在 `/etc/syslog.conf` 中使用星号作为通配符。例如，以 `***.***` 开头的行告诉 `rsyslogd`\
  \ 记录所有内容。以 `authpriv.*` 开头的行意味着你想记录该设施的所有消息。\n\n默认情况下，`rsyslogd` 记录给定优先级或更高的消息。换句话说，`cron.err`\
  \ 行将包含来自 `cron` 守护进程的 `err`、`crit`、`alert` 和 `emerg` 级别日志消息。\n\n大多数来自 `rsyslogd`\
  \ 的消息被写入 `/var/log` 目录下的文件。你应该定期扫描这些日志，并寻找可能指示安全漏洞的模式。也可以设置 cron 任务来查找此类模式。\n\n\
  ### 日志文件管理\n\n日志很容易变得非常大且难以阅读。默认情况下，`logrotate` 工具每周创建一个新的日志文件，并使用 `/etc/logrotate.conf`\
  \ 文件中的指令，该文件还会引入来自 `/etc/logrotate.d` 目录中文件的指令。如图 9-11 所示，文件中的指令非常直观，并通过注释进行了详细解释。\n\
  \n图 9-11 /etc/logrotate.conf 配置的日志轮转\n\n![Images](img/F09-11.jpg)\n\n具体而言，默认设置每周轮转日志文件，存储过去四周的日志。在轮转期间会创建新的日志文件，旧文件以轮转日期作为后缀。\n\
  \n### 各种日志文件\n\n表 9-12 描述了各种日志文件及其功能。这些文件是根据之前描述的 `/etc/rsyslog.conf` 配置以及 `/etc/rsyslog.d`\
  \ 目录下的服务配置创建的。某些日志文件（例如 `/var/log/httpd` 中的文件）是由应用程序直接创建的。显示的所有文件都在 `/var/log` 目录中。如果你没有安装、激活或使用上述服务，相关的日志文件可能不会出现。相反，你可能会根据额外安装的服务看到此处未显示的日志文件。\n\
  \n表 9-12 标准 Red Hat 日志文件\n\n![Images](img/f0391-01.jpg)\n\n### 服务特定日志\n\n如前所述，许多服务控制自己的日志文件。例如，vsFTP\
  \ 服务器的日志文件配置在 `/etc/vsftpd` 目录下的 `vsftpd.conf` 文件中。如该文件所示，以下指令启用了对 `/var/log/xferlog`\
  \ 文件中上传和下载的记录：\n\n```\nxferlog_enable=YES\n```\n\n其他服务的记录可能更复杂。例如，在 `/var/log/httpd`\
  \ 目录为 Apache Web 服务器的访问和错误配置了单独日志文件。\n\n### 练习 9-3\n\n**学习日志文件**\n\n在此练习中，你将检查本地系统上的日志文件以尝试识别不同的问题。\n\
  \n1. 重启 Linux 计算机。通过 SSH 以 root 用户身份登录。使用一次错误的密码。\n2. 使用正确的密码以 root 用户身份正确登录。\n\
  3. 在控制台中，导航到 `/var/log` 目录并打开名为“secure”的文件。导航到离文件末尾最近的“Failed password”消息。查看发生了。关闭文件。\n\
  4. 查看 `/var/log` 目录中的其他日志。参考表 9-12 获取指导。寻找与硬件相关的消息。它们在哪些日志文件中？这合理吗？\n5. 大多数日志文件文件都是文本文件。尝试作为文本文件读取\
  \ `/var/log` 目录下的 `lastlog` 文件。发生了什么？尝试 `lastlog` 命令。你现在是在读取 `/var/log/lastlog`\
  \ 文件的内容吗？你能从相关的 man 页确认这一点吗？\n\n### 查看 systemd Journal 日志\n\n除了初始化系统和管理服务外，systemd\
  \ 还实现了一个强大的日志系统。在第 5 章中，我们简要介绍了 `journalctl` 并解释了如何启用持久日志。在本节中，我们将回顾 `journalctl`\
  \ 命令的一些基本功能，并展示如何执行高级搜索。\n\n默认情况下，日志存储在 `/run/log/journal` 目录内二进制格式的环形缓冲区中，它们不会在系统重启后持续。如果你希望在磁盘上持久化地写入\
  \ journal 日志，请编辑 `/etc/systemd/journald.conf` 文件并查找 `Storage` 配置选项：\n\n```\n#Storage=auto\n\
  ```\n\n此参数可以设置为 `volatile`、`persistent` 或 `auto`。如果设置为 `volatile`，journal 临时存储在\
  \ `/run/log/journal`。相反，`persistent` 将 journal 存储在 `/var/log/journal` 中（如果不存在则创建该目录）。`auto`\
  \ 设置在 `/var/log/journal` 存在时使用持久存储，否则回退到 volatile 模式。如果你修改了 `Storage` 参数，将需要重启 `systemd-journald`\
  \ 服务。\n\n因此，要启用持久存储，请取消 Storage 条目并将其设置为 `persistent`：\n\n```\nStorage=persistent\n\
  ```\n\n然后，使用以下命令重启 `systemd-journald` 服务：\n\n```\n# systemctl restart systemd-journald\n\
  ```\n\nsystemd journal 相比 rsyslog 的主要优势之一是，它不仅可以存储内核和 syslog 消息，还可以存储服务发送到标准输出或标准错误的任何其他输出。你不需要知道守护进程将日志发送到，因为所有内容都被\
  \ systemd 捕捉并记录到 journal 中。journal 有索引，因此可以使用不同的选项进行轻松搜索。\n\n默认情况下，`journalctl`\
  \ 命令按时间顺序以分页格式显示 journal 中的所有消息。它用黄色显示 `warning` 级别的消息，并用红色显示 err、`crit` `alert`\
  \ 以及 `emerg`、`alert`、`crit` 和 `err` 行。一个非常有用的命令开关是 `-f`，它的工作方式类似于 `tail -f` 命令，通过显示最后\
  \ 10 条日志目并持续打印追加到 journal 中的新日志目。\n\n你可以通过多种方式过滤 `journalctl` 的输出。你可以使用 `-p` 开关显示优先级与指定的相同或更高的消息。例如，以下命令仅显示优先级\
  \ `err` 及以上的条目：\n\n```\n# journalctl -p err\n```\n\n`--since` 和 `--until` 命令开关可以将输出限制在指定的时间范围内。接下来的示例应该是显而易见的：\n\
  \n![Images](img/f0393-05.jpg)\n\n\n\n\n\n你还可以通过 `-n` 查看最近的日志条目来过滤输出。例如，你可以运行下一个命令来显示日志中的最后\
  \ 20 行：\n\n```\n# journalctl -n 20\n```\n\n但不仅如此。systemd 日志中的每个条目都有一组元数据，你可以通过 `-o\
  \ verbose` 开关显示它们。图 9-12 显示了启用详细输出时日志条目的条貌。\n\n图 9-12 带有元数据的日志条目\n\n![Images](img/F09-12.jpg)\n\
  \n`journalctl` 命令可以使用图 9-12 列出的任何字段来过滤输出。例如，以下命令显示了与用户 ID 1000 相关的所有日志条目：\n\n```bash\n\
  # journalctl _UID=1000\n```\n\n同样，下一个示例显示了与 `nslcd` 进程相关的所有日志条目：\n\n```bash\n# journalctl\
  \ _COMM=nslcd\n```\n\n你还可以在同一行上指定多个条件。随着你使用 `journalctl` 命令的增加，你会发现 systemd 日志非常健壮且灵活，可以使用许多不同的选项进行查询。\n\
  \n![Images](img/f0395-01.jpg)\n\n## 认证摘要\n\nRHEL 9 包含了多种系统管理命令，可以帮助你监控和管理系统使用的资源。这些命令包括\
  \ `ps`、`top`、`kill`、`nice` 和 `renice`。此外，你还可以通过应用 `tuned` 性能配置为特定工作负载优化系统。\n\n文件存档是单个文件备份或分发文件系统的常用方法。备份具有特殊属性（如基于\
  \ ACL 和 SELinux 的属性）的文件需要特殊的命令选项。\n\n`cron` 和 `at` 守护进程可以帮助你管理在系统上按计划运行的任务。通过相关的配置文件，可以将这些守护进程的访问限制为某些用户。虽然\
  \ cron 配置文件遵循 `/etc/crontab` 中记录的特定格式，但这些配置指令已集成到 `anacron` 系统，该系统支持在定期关机的系统上进行任务管理。\n\
  \nLinux 管理员需要定期配置脚本。通常情况下，bash 脚本以 `#!/bin/bash` 行开头，用于设置解释器。脚本可以运行 Linux 命令，以及\
  \ `for`、`if` 和 `test` 等条件和控制结构。\n\nRHEL 9 包含两个日志系统——systemd journal 和 `rsyslog`\
  \ 守护进程——它们主要用于本地日志。日志条目通常由 systemd 收集在 `/run/log/journal` 目录（如果 systemd 服务配置为持久写入磁盘，则在\
  \ `/var/log/journal`），而 rsyslog 将日志文件永久存储在 `/var/log` 目录。rsyslog 守护进程还支持创建日志服务器，从各种系统中收集日志文件信息。\n\
  \n## 两分钟训练 ![Images](img/right-a.jpg)\n\n以下是第 9 章认证目标中的要点。\n\n### 资源管理与系统调优\n\n\
  ![Images](img/squ1.jpg) `ps` 命令可以识别当前运行的进程。\n\n![Images](img/squ1.jpg) `top` 命令启动任务浏览器，可以识别占用系统过多资源的进程。\n\
  \n![Images](img/squ1.jpg) `sar` 和相关命令提供系统活动报告。\n\n![Images](img/squ1.jpg) `iostat`\
  \ 命令可以提供 CPU 和存储设备统计。\n\n![Images](img/squ1.jpg) `nice` 和 `renice` 命令可以用于重新调整进程优先级。\n\
  \n![Images](img/squ1.jpg) `kill` 和 `killall` 命令可以向当前运行的进程发送信号。\n\n![Images](img/squ1.jpg)\
  \ 你可以使用 `tuned-adm` 命令列出性能配置并将其应用于系统。\n\n### 存档与压缩\n\n![Images](img/squ1.jpg) 使用\
  \ `gzip`、`bzip2`、`tar` 和 `star` 命令创建、提取和压缩存档。\n\n### 按计划运行任务：cron 和 at\n\n![Images](img/squ1.jpg)\
  \ `cron` 系统允许用户调度任务以便在给定的间隔运行。\n\n![Images](img/squ1.jpg) `at` 系统允许用户配置任务在指定的时刻运行一次。\n\
  \n![Images](img/squ1.jpg) `crontab` 命令用于处理 cron 文件。使用 `crontab -e` 编辑，`crontab -l`\
  \ 列出，`crontab -r` 删除 cron 文件。\n\n![Images](img/squ1.jpg) `/etc/cron.allow` 和 `/etc/cron.deny`\
  \ 文件用于控制 cron 任务调度器的访问；`/etc/at.allow` 和 `/etc/at.deny` 文件以类似的方式控制 `at` 任务调度器的访问。\n\
  \n### Bash 脚本\n\n![Images](img/squ1.jpg) 标准管理脚本可以为自定义脚本提供模型，以自动化系统维护任务。\n\n![Images](img/squ1.jpg)\
  \ Bash 脚本以 `#!/bin/sh` 或 `#!/bin/bash` shebang 行开头。\n\n![Images](img/squ1.jpg) 变量可以存储数据，如果作为环境变量导出，对其他脚本或命令可用。\n\
  \n![Images](img/squ1.jpg) 参数包括 `$?`（返回上一个命令的退出值）以及 `$1` 到 `$9`（传递给脚本的命令行参数）。\n\n\
  ![Images](img/squ1.jpg) 简单的循环和控制结构通过 `for`、`if` 和 `test` 等命令执行。\n\n### 本地日志文件\n\n\
  ![Images](img/squ1.jpg) RHEL 包含 `rsyslog` 守护进程，它根据 `/etc/rsyslog.conf` 的配置监控系统的内核消息和其他进程活动。\n\
  \n![Images](img/squ1.jpg) 你可以使用 `/var/log` 目录中生成的日志文件来跟踪系统的活动。\n\n![Images](img/squ1.jpg)\
  \ 其他日志文件可以通过服务配置文件创建和配置。\n\n![Images](img/squ1.jpg) 日志文件可以根据 `/etc/logrotate.conf`\
  \ 文件的配置定期轮转。\n\n![Images](img/squ1.jpg) systemd journal 在 `/run/log/journal` 目录内的环缓冲区记录所有启动、内核和服务消息。或者，它可以在\
  \ `/var/log/journal` 中持久存储日志。\n\n![Images](img/squ1.jpg) `journalctl` 命令用于显示和过滤日志条目。\n\
