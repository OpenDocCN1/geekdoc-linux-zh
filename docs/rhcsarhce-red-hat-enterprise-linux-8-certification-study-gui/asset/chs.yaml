  \ inspect` 命令的部分输出\n\n![Images](img/F10-07.jpg)\n\n## 构建容器镜像：入门\n\n在容器化环境中，灵活性和定制通常需要创建自定义容器镜像。虽然你可以手动修改运行中容器的镜像进行特定的更改或测试，但\
  \ Containerfile 的实用性提供了一种更系统且可复制的方法。\n\n### 考试要点\n\n尽管 RHCSA 考试目标并不要求你编写 Containerfile，但理解其内容以及从\
  \ Containerfile 构建镜像的过程是非常关重要的。\n\n一个典型的 Containerfile（如图 10-8 所示）始终以 `FROM` 指令开始。这指定了用于构建你的容器的基础镜像。\n\
