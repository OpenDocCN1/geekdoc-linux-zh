  \nFIGURE 1-5 安装摘要\n\n![Images](img/F01-05.jpg)\n\n4. 从安装摘要屏幕查看系统的日期和时区，必要时进行相应更改。\n\
  \n5. 同样，根据需要查看键盘配置和语言设置。\n\n6. 安装摘要屏幕中的下一个选项涉及安装源。由于你是从 DVD 安装，请将此设置为“Local media”（本地媒体）。\n\
  \n7. 查看安装摘要屏幕中的网络和主机名设置，如图 1-6 所示。左面板列出了检测到的接口。选择以太网接口，并将右上角的开关到开启位置。\n\nFIGURE\
  \ 1-6 网络和主机名配置屏幕\n\n![Images](img/F01-06.jpg)\n\n8. 点击 `Configure`（配置）按钮并选择 `IPv4`\
  \ 选项卡，以选择你如何配置 IP 地址。你将看到如图 1-7 所示的窗口。在 `Method` 字段中，将配置方法设置为 `Manual` 以输入静态 IP\
  \ 地址。然后点击 `Add`（添加）并输入设置。\n\nFIGURE 1-7 IPv4 网络设置\n\n![Images](img/F01-07.jpg)\n\
  \n9. 在图 1-6 左下角显示的 `Host Name` 字段中，将 `server1.example.com` 设置为系统的主机并点击 `Apply`（应用）。完成配置更改后，点击\
  \ `Done`（完成）按钮。\n\n10. 点击安装摘要屏幕上的 `Installation Destination`（安装目标）项目，你将看到如图 1-8\
  \ 所示的屏幕。在此屏幕上，你可以确定配置的磁盘驱动器（本地和远程）的使用情况。在这里，你可以选择自动分区或手动分区。对于自动分区，如果你想重新配置其他现有分区的空间，可以勾选“I\
  \ would like to make additional space available”（我想提供可用空间）复选框。可选，你可以选择“Encrypt my\
  \ data”（加密我的数据）。对于本次安装，选择 `Custom`（自定义）并点击 `Done` 继续。\n\nFIGURE 1-8 安装目标屏幕\n\n![Images](img/F01-08.jpg)\n\
  \n#### 安装视角下的分区\n\n\n\n\n磁盘分区是将磁盘驱动器划分为多个区域的方法。一旦创建了分区，你就可以配置 Linux 将分区挂载到目录（或称为“挂载点”）上。例如，一个分区可以挂载在\
  \ Linux 文件系统的顶层，即根分区（或 `/`），也可以挂载在不同的目录下，例如 `/home`。\n\n要定义一个分区，你可能需要一些关于命名规范、不同文件系统的配置，以及交换空间（swap\
  \ space）和逻辑卷用法的背景知识。这只是一个概述。详细信息请参阅第 7 章。\n\n## 命名规范\n\nLinux 对磁盘分区有一个简单的命名标准：三个字母后跟一个数字。第一个字母识别驱动器类型（`s`\
  \ 代表 SATA 或 SAS，而 `v` 代表基于 KVM 的虚拟机上的虚拟磁盘）。第二个字母是代表磁盘的 `d`，第三字母代表该磁盘的相对位置，从 `a`\
  \ 开始。例如，第一个 SATA 硬盘是 `sda`，随后是 `sdb`、`sdc` 和 `sdd`。（NVMe 驱动器，例如在图 1-8 中检测到的，命名为\
  \ `nvmeXnY`，其中 `X` 表示 NVMe 控制器的索引或数字，而 `nY` 指 NVMe 控制器内部的命名空间或逻辑单元。）\n\n三个字母后的数字是基于分区的相对位置。现代\
  \ PC 上有两种分区方案：传统的主引导记录（MBR）方案和较新的 GUID 分区表（GPT）方案。\n\n在 MBR 方案中，分区可以是三种类型之一：主分区、扩展分区或逻辑分区。主分区可以包含操作系统的引导文件。磁盘驱动器还可以配置一个扩展分区，该扩展分区随后可以包含多个逻辑分区。\n\
  \n磁盘驱动器被限制为四个主分区。当四个分区不够用时，可以用扩展分区替换最后一个主分区。该扩展分区可以进一步细划为逻辑分区。因此，在规划分区布局时，请确保扩展分区足够大。虽然可以创建更多分区，但你不应该在任何单个\
  \ SATA、SAS 或虚拟磁盘驱动器上创建超过 12 个逻辑分区。\n\nGPT 分区方案没有这种限制，并且在 RHEL 9 上，默认支持多达 128 个分区。如有必要，还可以进一步增加这个数字，尽管这种情况非常罕见且并不常用。\n\
  \n每个分区都与一个 Linux 设备文件关联。至少这一点是显而易见的；例如，与第一个 SATA 硬盘上的第三个分区关联的设备名为 `/dev/sda3`。（对于\
  \ NVMe 驱动器，`/dev/nvme0n1` 上的第三个分区将标识为 `/dev/nvme0n1p3`。）\n\n卷（Volume）是格式化空间段的通用名称，可用于包含数据。卷可以是分区，也可以是与逻辑卷管理（LVM）关联的逻辑卷。文件系统存在于卷内部并提供存储文件的能力。文件系统处理卷上的块到文件的转换。例如，红帽（Red\
  \ Hat）使用 XFS 文件系统作为卷的默认格式。在 Linux 中访问数据的标准方法首先将该文件系统挂载到目录上。例如，当 `/dev/sda1` 分区格式化为\
  \ XFS 文件系统时，就可以将其挂载到如 `/boot` 的目录上。通常会说：“`/dev/sda1` 文件系统挂载在 `/boot` 挂载点上。”你将在第\
  \ 7 章中更深入地回顾这些概念。\n\n## 独立的文件系统卷\n\n通常，你应该为 RHEL 9 创建几个卷。即使在默认配置下，RHEL 也配置了至少三个卷——顶层根目录（`/`）、一个\
  \ `/boot` 目录和 Linux 交换空间。额外的卷可能适用于 `/home`、`/opt`、`/tmp` 和 `/var` 等目录。它们也适用于任何自定义目录，例如用于网站、专用用户组等。\n\
  \n虽然在普通分区上配置 `/boot` 目录很重要，但其他目录可以轻松地配置在逻辑卷上。\n\n通过这种方式划分可用磁盘驱动器的空间，可以将系统、应用程序和用户文件相互隔离。这有助于保护系统服务和各种应用程序所使用的磁盘空间。文件无法跨卷增长。例如，一个包含大量文件的用户主目录不会挤占系统服务所需的空间。\n\
  \n虽然创建更多卷有许多优势，但它并不总是最佳解决方案。当磁盘空间有限时，应将分区数量保持到最低。例如，如果你有一个 12GiB 的磁盘驱动器并想安装 5GiB\
  \ 的软件包，拥有专用的 `/var` 和 `/home` 卷可能会导致磁盘空间过快耗尽。\n\n## Linux 交换空间\n\nLinux 交换空间通常配置在专用分区或逻辑卷上。此类空间被用作当前运行程序的虚拟内存，以扩展系统中有效\
  \ RAM 的量。但通常你不应该仅仅通过购买额外的 RAM 来消除交换空间。即使你有几 GB 的空闲 RAM，Linux 也会将不常用的程序和数据移动到交换空间。\n\
  \n红帽建议分配交换空间的方法基于系统的 RAM 量。对于最多 2GiB 的系统，建议的交换空间大小为安装 RAM 数量的两倍。对于 2GiB 到 8GiB 之间的系统，等于\
  \ RAM 的数量。8GiB 以上为 RAM 数量的一半。但这些并不是“硬性”规则。具有几 GB RAM 的工作站经常使用交换空间。然而，某些应用程序工作负载可能需要较大的交换分区，例如使用大型\
  \ tmpfs 文件系统的应用程序（tmpfs 是存储在内存中的临时文件系统，在内存压力下依赖交换空间作为后台存储）。无论如何，默认安装将交换空间配置为逻辑卷而非专用分区。\n\
  \n## 逻辑卷基础\n\n从分区创建逻辑卷需要以下步骤。有关这些概念的详细信息以及执行这些步骤所需的实际命令在第 7 章中描述。如果在安装过程中创建逻辑卷，其中某些步骤会自动运行。\n\
  \n1. 将分区标记为 Linux LVM 卷。\n2. 将标记的分区初始化为物理卷。\n3. 将一个或多个物理卷组合为卷组。\n4. 将卷组划分为逻辑卷。\n\
  5. 将逻辑卷格式化为 Linux 文件系统或交换空间。\n6. 将格式化的逻辑卷挂载到目录或交换空间。\n\n### 分区创建练习\n\n现在回到安装过程。如果你按照本章到目前为止的步骤进行操作，你应该看到如图\
  \ 1-9 所示的手动分区界面。\n\n图 1-9 手动分区界面\n\n![Images](img/F01-09.jpg)\n\n在此屏幕上，下拉菜单提供了在标准分区、LVM\
  \ 卷和精简配置 LVM 卷上配置文件系统的机会。无论你在此屏幕上选择了什么分区方案设置，/boot 挂载点将始终配置在标准分区上。\n\n1. 从分区方案下拉菜单中选择\
  \ `Standard Partition`（标准分区）。LVM 将将在第 7 章中讨论。\n\n\n\n\n2. 按照之前表 1-1 中的描述配置标准挂载点。如果你有空间，可以接受较大的分区。在屏幕左下角，`+`按钮支持创建新的挂载点，如图\
  \ 1-10 所示。\n\n图 1-10 添加挂载点\n\n![Images](img/F01-10.jpg)\n\n3. 回到手动分区界面，你现在应该能看到如图\
  \ 1-11 所示的设置。此窗口支持多种选择：\n\n图 1-11 `/boot` 分区的配置\n\n![Images](img/F01-11.jpg)\n\n\
  ![Images](img/square.jpg) **挂载点 (Mount Point)** 这是文件将存储在分区上的目录（例如 `/boot`）。\n\n\
  ![Images](img/square.jpg) **所需容量 (Desired Capacity)** 指定分区的所需容量；在这种情况下，为基准系统配置的分区定义在表\
  \ 1-1 中。\n\n![Images](img/square.jpg) **设备类型 (Device Type)** 这是设备类型，你之前在分区方案菜单中将其设置为标准分区（Standard\
  \ Partition）。\n\n![Images](img/square.jpg) **文件系统 (File System)** 选择文件系统类型；在这种情况下，选择了默认的\
  \ `xfs` 文件系统。\n\n![Images](img/square.jpg) **标签 (Label)** 你可以提供一个可选标签。\n\n现在是进行练习的时间了。首先，我们检查在安装过程中如何创建和配置分区。我们还将查看如何为分区或逻辑卷分配文件系统。\n\
  \n### 练习 1-2\n\n#### 安装过程中的分区\n\n此练习假设你已经遵循了本章上一节中的安装步骤。从错误中恢复很容易，因为你可以点击“重新加载存储配置”（Reload\
  \ Storage Configuration）按钮来丢弃任何配置更改。此练习从图 1-9 所示的手动分区界面开始，并继续显示图 1-10 和 1-11 所示的屏幕。\n\
  \n1. 如果对分区布局进行了任何配置更改，请点击“重新加载存储配置”按钮（图 1-9 左下角的旋转箭头按钮）以丢弃所有更改。\n\n2. 从图 1-9 左侧的下拉菜单中选择\
  \ `LVM` 分区方案。\n\n3. 在屏幕左下角，点击 `+` 按钮添加新的挂载点。\n\n4. 设置一个合适的挂载点（例如 `/boot`），将容量设置为\
  \ `1GiB`，并点击“添加挂载点”（Add Mount Point）按钮。\n\n5. 注意，尽管你选择了 `LVM` 分区方案，但 `/boot` 挂载点仍创建在标准分区上。这是因为\
  \ Anaconda 安装程序强制要求 `/boot` 卷位于标准分区上。\n\n6. 点击文件系统下拉菜单并检查可用选项。你会看到几种文件系统类型，例如 `xfs`、`vfat`、`ext4`\
  \ 等。\n\n7. 为交换空间（swap space）创建一个额外的卷。在“挂载点”下，选择 `swap`并将大小设置为 `1GiB`。\n\n8. 将交换空间保留在标准分区上。确保已选择交换分区，并将“设备类型”设置从\
  \ `LVM` 更改为“标准分区”（Standard Partition）。\n\n9. 使用刚才的步骤为根文件系统创建一个额外的挂载点。在“挂载点”输入框中选择\
  \ `/`并将大小设置为 `15GiB`。注意窗口左下角显示的“可用空间”（Available Space）和“总空间”（Total Space）数字已发生变化。\n\
  \n10. 重复前面的步骤，为 `/home` 文件系统创建一个挂载点，并将大小设置为 `1GiB`。\n\n现在练习已完成，分区配置至少反映了表 1-1 所示的最小值。其中一个版本如图\
  \ 1-12 所示。如果出错，请突出显示分区并编辑其配置设置。不要担心小错误；尺寸上的细微差异在实践中并不重要——而且红帽考试反映的是实际情况。\n\n图 1-12\
  \ 示例分区配置\n\n![Images](img/F01-12.jpg)\n\n完成此步骤操作后，点击“完成”（Done）。你将看到“更改摘要”（Summary\
  \ of Changes）屏幕。这是你在继续之前的最后机会。假设你满意，点击“接受更改”（Accept Changes）继续。\n\n#### 哇，看看这么多软件！\n\
  \n仅 RHEL 9 安装 DVD 就提供了超过 6600 个软件包。该数字还未包含许多仅通过红帽客户门户网站上其他订阅通道获取的包。由于有这么多软件包，将它们分组是非常重要的。在“安装摘要”屏幕上（如早前的图\
  \ 1-5 所示）点击“软件选择”（Software Selection）。\n\n#### 基准包\n\n在这一部分中，你将对 RHEL 9 安装期间提供的内容进行概述。在考试期间，你可以使用红帽添加/删除软件工具参考这些包组之一。你也可以通过\
  \ `dnf group list` 命令查找可用包组列表。更多信息请参第 4 章。\n\n#### 安装期间\n\n启动软件包的安装后，你将看到如图 1-14\
  \ 所示的屏幕。\n\n图 1-14 安装 RPM 包\n\n![Images](img/F01-14.jpg)\n\n安装完成后，你将看到相关的最终消息，以及一个重启系统的选项。不要忘记移除安装的\
  \ DVD 镜像；否则系统可能会再次从 DVD 介质启动。要这样做，选择“虚拟机”菜单，点击“可移动设备”（Removable Devices），并在 CD/DVD\
  \ 下点击“断开”（Disconnect）。\n\n#### 初始设置\n\n安装过程完成后，当 RHEL 9 首次启动图形用户界面时，将出现“初始设置”（Initial\
  \ Setup）屏幕，如图 1-15 所示。\n\n图 1-15 初始设置屏幕\n\n![Images](img/F01-15.jpg)\n\n\n\n\n\n\
  1. 在“初始设置”（Initial Setup）屏幕上，你可以启用或禁用位置服务，并连接你的在线账户（例如 Google 或 Microsoft）。点击 `Skip`\
  \ 进入下一页。\n2. 通过提供你喜欢的用户名和密码创建一个普通用户账户。\n3. 点击 `Start Using Enterprise Linux`（开始使用\
  \ Enterprise Linux）。\n4. 在 RHEL 9 系统上，系统会让你进行系统览。如果你是 RHEL 9 的新手，请点击 `Take Tour`（开始之旅）。\n\
  5. 系统提示你将系统连接到 Red Hat 订阅管理（Red Hat Subscription Management）。要进行注册，你需要一个拥有可用订阅的\
  \ Red Hat 账户，该账户应该已经在练习 1-1 中获取了。不过，你将在第 4 章中完成系统注册。\n\n## 认证总结\n\nRHCSA 考试并不是针对初者的。它是一项实操性测试，通过解决问题和系统配置任务，在真实的\
  \ RHEL 系统上评估你的能力。考试侧重于评估你的核心系统管理技能，并模拟真实世界的场景。\n\nRHEL 9 支持不同的架构。对于 RHCSA 考试，你需要一台配备\
  \ Intel/AMD 64 位 CPU（也称为 `x86_64 architecture`）的系统。\n\n本章帮助你获取并安装了基础 RHEL 系统，其软件包和设置适用于本书的其余部分。通过\
  \ Red Hat 客户门户的订阅，你可以从关联账户下载 RHEL 安装 ISO 文件。由于 RHEL 软件是以开源许可发布的，第三方（如 AlmaLinux\
  \ OS Foundation）已使用这些源代码构建了不包含 Red Hat 商标的新类型 Linux 发行版。你也可以使用 AlmaLinux 来准备 RHCSA\
  \ 考试。\n\n本章还帮助你创建并配置 RHEL 9 的安装，以练习在后续章节中学到的技能。你将在接下来的实验 1 中配置第二个系统。虽然许多用户没有空闲的物理计算机专门用于学习，但虚拟机（VM）使得在单台物理计算机上设置这些系统成为可能。\n\
  \n即使对于新的 Linux 用户，RHEL 9 的安装也相对简单，因此本章没有涵盖每一个细节。安装之后是“初始设置”屏幕。然而，这取决于你是否安装了图形界面（GUI）。\n\
