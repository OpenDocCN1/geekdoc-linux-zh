  \ `fdisk` 工具对连接到系统的物理或虚拟磁盘进行分区配置。例如，本书使用的基虚拟系统包含一个驱动器，在你的系统中它可能命名为 `/dev/nvme0n1`、`/dev/sda`\
  \ 或 `/dev/vda`。\n\n![Images](img/job.jpg)\n\nSATA、PATA 和 SAS SCSI 驱动器都由 `/dev/sda`、`/dev/sdb`\
  \ 等设备文件表示。\n\n如果新添加的驱动器尚未被 RHEL 安装程序（或其他磁盘管理程序）使用过，`fdisk` 在第一次尝试访问驱动器时将返回以下消息：\n\
  \n![Images](img/f0259-01.jpg)\n\n换句话说，即使你不创建分区，只要保存更改，`fdisk` 也会自动向驱动器写入 DOS 磁盘标签。\n\
  \n如果你在新的物理磁盘上需要四个以上的分区，请将前三个分区配置为主分区，然后将第四个分区配置为扩展分区。该扩展分区通常应该足够填充磁盘的剩余空间；所有逻辑分区都必须在该空间内。\n\
  \n### 使用 fdisk：概览\n\n在 `fdisk` 命令行提示符下，从打印命令 (`p`) 开始以检查分区表。这允许你查看分区表中的当前条目。假设有可用空间，你就可以创建一个新的\
  \ (`n`) 分区。\n\n通常情况下，分区分为主分区 (`p`) 或逻辑分区 (`l`)。如果它不存在，你还可以创建一个扩展分区 (`e`) 来包含逻辑分区。请记住，在使用\
  \ MBR 方案格式化的驱动器中，你最多拥有四个主分区，对应于数字 1 到 4。其中一个主分区可以配置为扩展分区。剩余的分区是逻辑分区，编号为 5 及以上。通过扩展分区，你可以在一个驱动器上最多创建\
  \ 12 个逻辑分区。\n\n如果有可用空间，`fdisk` 通常会从第一个可用扇区或磁道开始启动新分区。分区的实际大小取决于磁盘几何结构。\n\n### 使用\
  \ fdisk：创建分区\n\n下面的屏幕输出示例显示了创建新 (`n`) 分区 (`p`)、使其变为可引导 (`a`)，最后将分区信息写入 (`w`) 磁盘的步骤。（注意，尽管你可能指定一个\
  \ 500MiB 的分区，但磁盘的几何结构可能不允许该精确大小。）\n\n![Images](img/f0260-01.jpg)\n\n注意扇区的数量如何匹配\
  \ 500MiB 的二进制表示。重复命令以创建你可能需要的任何其他分区。\n\n当添加或更改分区时，你通常不需要重启即可让 Linux 读取新的分区表，除非该驱动器上的另一个分区已被格式化并挂载。如果是这样的话，尝试使用\
  \ `w` 命令写入分区表将临时失败，并显示以下消息：\n\n![Images](img/f0260-02.jpg)\n\n如果你运行 `partprobe /dev/sdb`，内核将读取新的分区表，你就可以使用新创建的分区了。\n\
  \n### 使用 fdisk：多种分区类型\n\n一个特别感兴趣的功能是基于 `t` 命令来更改分区系统标识符。如果你为逻辑卷甚至交换空间需要空间，`t` 命令就非常重要。按下\
  \ `t` 后，系统会提示你输入分区编号（如果配置了多个分区）。然后你可以使用 `L` 命令列出可用的分区类型，如下所示。（如果驱动器上只有一个分区，则会自动选中。）\n\
  \n![Images](img/f0261-01.jpg)\n\n可用分区标识符列表如 图 7-4 所示，令人印象深刻。注意它不仅限于 Linux 分区。然而，由于本书涵盖了\
  \ Linux，表 7-1 列出了相关的分区类型。\n\n图 7-4 fdisk 中的 Linux 分区类型\n\n![Images](img/F07-04.jpg)\n\
  \n表 7-1 fdisk 中的 Linux 分区类型\n\n![Images](img/f0262-01.jpg)\n\n除非你要进行更改，否则输入标识符 `83`。你将返回\
  \ `fdisk` 命令行提示符。\n\n### 使用 fdisk：删除分区\n\n下面的示例删除了唯一配置的分区。示例输出屏幕首先启动 `fdisk`。然后你可以打印\
  \ (`p`) 当前分区表、按编号删除 (`d`) 分区（在本例中为 `1`）、将更改写入 (`w`) 磁盘并退出 (`q`)）。不言而喻，不要在任何你需要保留数据的分区上执行此操作。\n\
  \n假设此驱动器上仅存在一个分区，运行 `d` 命令后它会被选中。\n\n![Images](img/f0262-02.jpg)\n\n这是在删除当前分区之前改变主意的最后机会。要避免写入更改，请使用\
  \ `q` 命令退出 `fdisk`。如果你对所做的更改满意并想将其永久化，请继续执行 `w` 命令：\n\n![Images](img/f0262-03.jpg)\n\
  \n你现在应该有一个空的硬盘了。\n\n![Images](img/job.jpg)\n\n如果你删除了分区，磁盘上的分区表将进行修改以反映该更改，但驱动器上的实际数据不会被删除。如果不小心使用\
  \ MBR 删除了分区。\n\n### 使用 fdisk：创建交换分区\n\n现在你已经学会了如何使用 `fdisk` 创建分区，只需要一个额外的步骤来设置交换空间。正如本章后面提到的，需要额外的工作来让\
  \ RHEL 使用新创建的分区。\n\n在这种情况下，在以下提示符处输入 `82` 用于 Linux 交换：\n\n![Images](img/f0263-01.jpg)\n\
  \n例如，你可以运行以下命令序列在第二个硬盘上设置新分区。你看到的内容取决于你可能创建的分区。它将在第一个分区 /dev/sdb 上建立 900MiB 的交换空间。\n\
  \n![Images](img/f0263-02.jpg)\n\n`fdisk` 工具在运行 `w` 命令之前不会将更改写入磁盘。或者，可以使用 `q` 命令取消这些更改。如果没有看到错误消息，更改将写入磁盘。\n\
  \n#### gdisk 工具\n\n如前节所示，MBR 分区方案最多支持 15 个数据分区（3 个主 12 个逻辑），加上一个扩展分区，后者只是逻辑分区的“容器”。相比之下，GPT\
  \ 分区方案可以容纳 128 个分区。\n\nMBR 的另一个局限是磁盘大小。MBR 方案使用 32 位逻辑地址，支持高达 2TB 的硬盘。另一方面，GPT 格式依赖于\
  \ 64 位地址，支持高达 800 万 TB 的硬盘！\n\n尽管你可以使用 `fdisk` 并选择 `g` 命令切换到 GPT 分区表格式，但 `gdisk`\
  \ 工具专为 GPT 分区设计的。当你在带有 MBR 分区表的磁盘上启动 `gdisk` 时，你会看到以下警告：\n\n![Images](img/f0264-01.jpg)\n\
  \n正如消息所示，输入 `q` 退出；否则你可能会丢失驱动器上的任何数据。在这种情况下，`gdisk` 警告我们磁盘是使用 MBR 分区表格式化的，因此我们应该使用\
  \ `fdisk` 来修改分区布局。\n\n一旦启动，`gdisk` 的工作方式与 `fdisk` 。输入问号 (`?`) 可以获取命令列表：\n```\n\n\
