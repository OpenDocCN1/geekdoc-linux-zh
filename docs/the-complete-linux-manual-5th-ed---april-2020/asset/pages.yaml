  md: '# Which Distro?


    ![](img/f8aca09bc266ba3d122c77a820ff023b_16_0.png)


    tools you preinstalled, that a user can run for penetration testing against their
    network. There was once even a Hannah Montana Linux distribution but the less
    we talk about it the better. The point being, there''s a distro out there for
    you.


    Oddly enough, most higher-end technical users find themselves back at square one,
    using a distro like Linux Mint. The main reason is usually because it''s an easy
    option, and it''s a stable environment. Just once you''ve mastered the system
    inside out, you realize you always want to be fixing problems lately. Most of
    us would prefer the easy life, especially where technology is concerned, so the
    logical choice would be to choose a distro that''s simple, yet still powerful
    enough to do everything you want to do, hence Linux.


    Needless to say, if you consider yourself to a relatively high degree, power user
    all, then you will want to expand your skills and begin to build your own Linux
    distro based on Arch, Debian or one of the many others available. Doing so involves
    a command line knowledge, as well as knowledge of how the Linux system works and
    interacts with the hardware in the computer. You will need to partition drives,
    install drivers and eventually install the apps and programs. Doing so takes time
    and again there are a lot of skills that you''re going to learn.


    However, in the end, it''s purely down to choice, your own personal choice. You
    may find that after going through the tutorials in this you don''t like Linux
