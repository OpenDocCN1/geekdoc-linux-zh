  md: '# Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many professional programmer has fallen foul of sloppy structure.


    # #INCLUDE <C++ STRUCTURE>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may be different from one language to the next you can start
    to see how the code works.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_123_0.png)


    C++ was invented by Danish student Bjarne Stroustrup in 1979, as a part of his
    Ph.D thesis initially called C with Classes, which added features to the already
    popular C programming language, while making it a more user-friendly environment
    through a new structure.


    > Bjarne Stroustrup,

    invent of C++.


    ```

    INT MAIN() main() initiates the declaration of a

    function, which is a group of code statements

    under the name ''main''. All C++ code begins at the main function,

    regardless of where it actually lies within the code.

    ```


    ```

    helloworld.cpp

    #include <iostream>

    int main()

    ```


    The structure of a C++ program is quite precise. Every C++ code has a directive:

    #include -> The directive instructs the pre-processor to include

    a section of the C++ code. For example: #include <iostream>

    includes the header to support input/output operations.


    The open brace (curly brackets) is something that

    y may not have come before, especially if

    y''re used to Python. The open brace indicates the beginning of

    main function and all the code that belongs to that function.


    ```

    helloworld.cpp

    #include <iostream>

    int main(){

    }

    ```'
