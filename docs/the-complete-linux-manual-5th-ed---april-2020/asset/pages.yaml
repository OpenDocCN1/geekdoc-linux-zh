    the best setup, with your personal tastes.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_40_1.png)


    STEP 9 If you click on the Add/remove button in the centre of the three available
    options, you can choose the default view from a few preinstalled themes. Click
