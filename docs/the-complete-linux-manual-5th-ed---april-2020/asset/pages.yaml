  md: '# INSTALLING LINUX


    Once the Live Environment has booted, you are opted to install the distro to your
    computer. Have a look around and when you''re ready, look for the Install option
    on the desktop.


    +   ### STEP 1 Providing you''re connected to the internet (if not, then do so)
    and you''re in the Live Environment, start the installation process by double-clicking
    on the Linux Mint icon on the desktop. Other distros display their name, of course,
    but the process is the same. Click Continue when you''re ready.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_0.png)


    +   ### STEP 4 Before the installation process begins, you''re asked if you chose
    to make sure the erasure of the hard drive is correct. This is your last chance
    to back out. If you''re not mind wiping everything and starting again with Linux
    Mint, click Continue. If you need to back up your files to the Linux disc/USB,
    reboot, and start again.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_1.png)


    +   ### STEP 2 While the installation process is very similar across most Linux
    distros, some offer different questions during the installation. The questions
    aren''t too difficult, nothing very technical, but some as ''Installing third-party
    software'' can be confusing. In case you can click Continue but if you''re unsure,
    have an internet-connected device available to ask any questions.


    +   ### STEP 5 Eventually you are asked to set up your Linux username and password.
    Enter your Name to begin, with the Computer Name, which is the name it is identified
    on the network. Next choose a Username, followed by a Password. You can click
    the Login Automation option but leave the Entry Folder option for now.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_2.png)


    +   ### Preparing to install Mint

    - Third-party software programs for Wi-Fi, Firefox, MP3 and other media

    - This checkbox is to install items with documentation free.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_3.png)


    +   ### STEP 3 When installing a new operating system it''s recommended that you
    wipe the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install Linux...'' option is selected. NOTE:
    This completely wipes Windows, 10 from your computer, make sure you have backups
    of your personal files and data.


    +   ### STEP 6 The installation process can be quick, and there may be more questions
    to answer, or it may simply start installing Linux based on your preferences.
    Every way, you will end up being able to Continue the Live Environment or Restart
    to the newly installed OS. If you''re ready to use Linux, click Restart Now.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_4.png)


