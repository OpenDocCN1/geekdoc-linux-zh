  md: '# # Linux Tips and Tricks


    As you''ve seen, the Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, however, a smidgen of command knowledge, incredible,
    and often strange, things can be accomplished.


    # ## TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s Unix heritage, while others are recent additions
    to Linux lore. Here are our favourite ten tricks.


    ### EASTER EGGS

    Emacs, the text editor, is a great piece of software, did you know it contains
    a hidden Easter Egg? With Emacs installed (sudo apt-get install emacs25), drop
    to a Terminal session and enter:

    emacs -batch -1 dunnet


    ### TERMINAL BROWSING

