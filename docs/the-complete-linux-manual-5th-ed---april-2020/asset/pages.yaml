  md: '# Creating Users


    When you install Linux Mint it is configured for use with a single user. While
    sharing a user account with the entire family is fine, there may come a time when
    you need to create separate users with their own unique Home Folders.


    # NEW USERS


    Having different users means each user has access to his or her own areas on the
    system. Documents, pictures, videos and so are on separate, with multiple users
    over other operating systems.


    +   **STEP 1** Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. Choose Users and Groups and enter your password. The
    Users and Groups console is quite basic looking, and thankfully easy to use. At
    first, you can just see your username when you installed Linux Mint.


    +   **STEP 3** Enter the user''s Name, followed by the Username they need when
    logging into Linux Mint. Make sure the username is all in lower case, a-z and
    0-9 characters only. You can have full stops, underscores or hyphens if you wish.
    Click the Add button when you are ready to continue.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_37_0.png)


    +   **STEP 2** To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the user needs to install new apps or access parts of the file system beyond their
    Home Folder, then use the Standard account type. Otherwise, use the Administrator
    account.


    +   **STEP 4** The new user appears in the list of current Linux Mint users, in
    alphabetical order. At present, there is no password set option to click the user
    in the list of current users, click the No Password Set option over the user''s
    username.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_37_1.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: "# STEP 5\n\nYou can enter a password for the new user or click the curved arrow\
    \ at the end of the New Password text box to generate a password for you, as well\
    \ as displaying it. Naturally, it’s a good idea to come up with a password as\
    \ strong as possible. When you’re done click the Change button.\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_38_0.png)\n\
    \n# STEP 7\n\nOnce logged in the new user is required to set up their desktop\
    \ wallpaper, icons, Panel and so on. Depending on what Account Type you set up\
    \ for them Standard or Administrator, they won't be able to install any new apps.\
    \ This screenshot is from a Standard user account type.\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_38_1.png)\n\
    \n# STEP 6\n\nYou can close the Users and Groups window now, as the new user has\
    \ been created. Click on the Mint Menu, followed by Logout, you are presented\
