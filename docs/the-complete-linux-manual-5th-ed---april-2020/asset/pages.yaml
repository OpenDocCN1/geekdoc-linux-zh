  md: '# # Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    # ## CREATING THE VM


    There are plenty of options to choose from creating a VM. For now, let''s set
    up a VM adequate to run Mint Cinnamon and perform.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_25_0.png)


    +   **STEP 1** With VirtualBox open, click on the New Icon in top right of the
    app. This opens the new VM Wizard.


    +   **STEP 3** The next section defines the amount of system memory, or RAM, the
    VM has allocated. Remember this amount is taken from the available memory on your
    computer, so don''t give the VM too much. For example, if we have 8GB of memory
    installed and we''re giving 2GB to the VM. When you''re ready, click Next to continue.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_25_1.png)


    +   **STEP 2** In the next box to Name, type Linux Mint and VirtualBox should
    automatically choose Linux and Ubuntu (64-bit) as the Version; if not then use
    the drop-down boxes to select the correct settings (remember Mint mainstream is
    based on Ubuntu). Click Next when you''re ready to proceed.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_25_2.png)


    +   **STEP 4** This section is where you start to create the virtual disk that
    the VM will install Mint on. The default option, ''Create a virtual hard disk'',
    is the one we''re using. Click Create to move on.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_25_3.png)'
