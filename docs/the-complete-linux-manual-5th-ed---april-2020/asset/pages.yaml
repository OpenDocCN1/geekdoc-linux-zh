  md: "# # Which Distro?\n\nUp to now we've looked at Linux Mint but there are other\
    \ Linux distributions out there to try. In truth there are thousands of Linux\
    \ distros available to download and install, so which one should you decide on\
    \ use?\n\n# DISTRO HOPPING\n\nDistro hopping is a term used by the community for\
    \ people who never stick to a single distribution. they hop from one to the other\
    \ and back again, using them for moving to another or a newly released distro.\n\
    \nThere's nothing wrong with distro hopping, it's a good way to get grips with\
    \ what's out and discover the elements of one distro that may or not appeal to\
    \ your tastes. The problem is which one do you use over?\n\nFor example, Linux\
    \ Mint is an ideal starting place. It's easy to install and use, distro has all\
