  md: '# Creating Bash Scripts – Part 3


    In the previous pages we looked at some very basic Bash scripting, which involved
    outputting text to the screen, getting a user''s input, storing it and outputting
    that to the screen; as well as including a system variable using the Date command.
    Now let''s combine what you''ve achieved so far and introduce Loops.


    # IF, THEN, ELSE


    With most programming structures there come a time when you need to loop through
    the commands you''ve entered to create better functionality, and ultimately a
    better program.


    +   * STEP 1 Let''s look at the If, Then and Else statements now, which executed
    correctly, compare a set of instructions and simply work out IF something is,
