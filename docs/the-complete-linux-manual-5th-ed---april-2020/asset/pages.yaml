  md: '# Python on Linux


    # # Conditions and Loops


    Conditions and loops are what make a program interesting; they can be or rather
    complex. how you use them depends greatly on what the program is trying to achieve;
    they could be the number of lives left in a game or just displaying a countdown.


    # ## TRUE CONDITIONS


    Keeping conditions simple to begin with makes learning to program a more enjoyable
    experience. Let''s start then by checking if something is true, doing something
    if it isn''t.


    +   - STEP 1


    Let''s create a New program that will ask a four-letter word to check, then do
    Start with File > New, and begin with the input variable:


    ```

    word=input("Please enter a four-letter word: ")

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_111_0.png)


    +   - STEP 3


    Now you can use an if statement to check if the word, length is equal to four
    and print a friendly confirmation if it applies to the rule:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print("is a four-letter word. Well done.")

    ```


    The double equal (==) means if something is equal to doing something.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_111_1.png)


    +   - STEP 2


    Now we can create a new variable, then len the function and pass the variable
    through it to get the total number of letters the user has entered:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    ```


    +   - STEP 4


    The colon at the end of if tells Python that if the statement is true after the
    colon is indented. Next, move the cursor to the beginning of the:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print("is a four-letter word. Well done.")

    else:

    print(", is not a four-letter word.")

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_111_2.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_111_3.png)'
