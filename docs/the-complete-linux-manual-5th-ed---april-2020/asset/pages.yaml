  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. basic user interaction is one of the most taught aspects\
    \ of any language and with it you're able to do much more than simply greet the\
    \ user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the standard output\
    \ stream, throughout our code. Now you're going to be using cin, the standard\
    \ input stream, to prompt a user response.\n\n+   * STEP 3 The cin command works\
    \ in the opposite way from the cut command. With the first cut line you output\
    \ 'What is your age ' to the screen, as indicated with the chevrons. cin uses\
    \ opposite Facing chevrons, indicating an input. The input is put into the integer\
    \ age and can up in the second command. Build and run the code.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    cout <<\
    \ \"What is your age: \";\n    cin >> age;\n    cout << \"nYou are \" << age <<\
    \ \" years old.\\n\";\n}\n```\n\n+   * STEP 2 The data type of the variable must\
    \ also match the type of input you want from the user. For example, to ask them\
    \ their name, you would use an input like this:\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int age;\n    cout << \"What is your\
    \ age: \";\n    cin >> age;\n    cout << \"\nYou are \" << age << \" years old.\\\
    n\";\n}\n```\n\n+   * STEP 4 If you're asking a question, you need to store the\
    \ input as a string; to ask the user name, you would use:\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    string name;\n    cout << \"What is\
    \ your name: \";\n    cin >> name;\n    cout << \"nHello, \" << name << \". I\
    \ hope you're well today!\\n\";n}\n```"
