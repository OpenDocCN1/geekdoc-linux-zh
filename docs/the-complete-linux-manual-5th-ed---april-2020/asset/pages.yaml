  md: '# # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it sounds.


    # ## FROM THE SOURCE


    The commands you need to be familiar with here are Configure, Make and Install.
    You''ll find a lot of apps using from source, so it''s quite worth investing time
    in.


    +   **STEP 1** Source code files for Linux usually come in the form of .TGZ or
    .TAR.BZ. Both are compressed files holding all the code needed to ''make'' the
    app. Start off this by creating a new folder in Home: `mkdir dir_vim`


    +   **STEP 3** The `wget` command retrieves content from the internet, in this
    case the BZ2 file for Vim. According to Mint''s file system colour, the compressed
    file should be displayed in.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_51_0.png)


    +   **STEP 2** Vim, by the way, is an advanced text editor which we''ll use as
    an example to install. Enter the folder, then from within the new Vim folder,
    enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/unix/vim-7.tar.bz`


    +   **STEP 4** We need to decompress the contents of the file, now so: you can
    type in `tar -xf vim-7.tar.bz2` and press the Tab to auto-fill the remaining file
    name.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_51_1.png)'
