  md: '# # Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with creating your own variables.


    # ## VARIABLES


    Just in every other programming language a Bash script can store and call certain
    variables from the system, either generic or user created.


    +   **STEP 1** Let''s start by creating a new script called hello.sh; xed Hello
    $1. Save the file and exit Ved. Bash `./bin/bash`, then, echo $1. Make the script
    executable with `chmod +x hello.sh`.


    +   **STEP 3** The output will now be Hello David. Bash automatically assigns
    variables for the user, which are then held and passed to the script. `$1` holds
    "David". You can change the variable by entering something different: `./hello.sh
    Mint`.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_69_0.png)


    +   **STEP 2** As the script is now executable, run it with `./hello.sh`. Now
    as you probably expected ''Hello'' is displayed in the Terminal. However, if you
    use the command with a variable, it begins to get interesting. For example, try
    `./hello.sh David`.


    +   **STEP 4** You can rename variables. Modify the script with the following:
    `surname=$1; Hello $surname`. Putting each statement on a new line. Save the script
    and exit back into the Terminal.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_69_1.png)'
