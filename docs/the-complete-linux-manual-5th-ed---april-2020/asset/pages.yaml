    ncursesw5-dev libbz2-dev tk-dev

    libdbm-dev libdb6-dev libbz2

    ```


    ### STEP 8 Within the Python folder,

    ./configure

    sudo make altinstall


    This could take a while depending on the speed of your computer. Once finished,
    use python3.7 --version to check the installed version. Now have Python 3.7 installed
    alongside Python 3.x and Python 2.


