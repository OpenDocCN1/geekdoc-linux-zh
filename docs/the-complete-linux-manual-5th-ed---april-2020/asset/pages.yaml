  md: '# Using Comments


    While comments may seem like a minor element to the many lines of code combine
    to make a game, application or even an entire operating system, in fact they''re
    probably one of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions of what detail
    the code is doing at that point. They don''t sound especially important but without
    comments is one of the frustrating affairs unless you''re a professional or just
    starting out.


    In short, all code should be commented in a manner as to effectively describe
    the purpose of a line, section or individual elements. You should get in the habit
    of commenting as much as possible so that someone who doesn''t know anything about
    programming can pick your code and understand what it''s going to do by reading
    your comments.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In an organisation, many programmers work
    alongside engineers, other developers and analysts. If you''re part of a team
    that''s writing a piece of software for the company, then your comments will save
    a lot of time when doing something wrong and another member has to pick up and
    follow the trail to pinpoint.


    The best comments are always concise and link the code logically, detailing what
    happens when the program hits a line or section. You don''t need to comment on
    every line. Along the lines of: if x==0 doesn''t require you to comment that something;
    it''s going to be obvious to the reader. If x equals value something that drastically
    changes the program for the user, such as when you run out of lives, it certainly
    needs to be commented on.


    Even if the code is yours, you should write comments if you are sharing it with
    others people. This way can return you to code and understand what it did or where
    it was went, or what worked brilliantly.


    Comments are good practice and you might want to add a comment when needed, so
    if it''s second nature.


    Place yourself in the shoes of someone who''s job is to find out what''s wrong
    with your program. The program has excess of lines, spread across different modules.
    You will soon appreciate the need for a little help from the original programmers
    in the form of a good comment.


