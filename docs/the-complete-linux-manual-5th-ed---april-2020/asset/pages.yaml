  md: '# # Using Comments


    When writing your code, the flow, what each variable does, how the overall program
    will operate and on is all inside your head. Another programmer could follow the
    code line by line but over time, it can become difficult to read.


    # ## #Comments!


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it''s supposed
    to do, for example. It''s just good practice.


    +   * **STEP 1** Start by creating a new instance of the IDLE Editor (File > New)
    and create a simple variable and print command:


    ```

    a=10

    print("The value of A is," a)

    ```


    Save the file and execute it.


    +   * **STEP 3** Resolve the code and execute it. You can see that the output
    in the IDLE Shell is still the same as before, despite the extra lines being added.
    Simply put, the hash symbol (#) denotes a line of text that the programmer can
    insert to inform them, and others, of what''s going on without the user aware.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_103_0.png)


    +   * **STEP 2** Running the code will return the line: The value of A is, 10
    to the IDLE Shell window, which is what we expected. Now, add some of the types
    of comments you''d normally see within code:


    ```

    # Set the value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is," a)

    ```


    +   * **STEP 4** Let''s assume that the variable A we created is the number of
    lives in a game. Every time the player dies, the value is decreased by 1. The
    programmer could insert a comment along the lines of:


    ```

    # You''ve just lost a life!

    a=a-1

    print("You now have," a, "lives left!")

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_103_1.png)'
