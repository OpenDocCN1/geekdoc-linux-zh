  md: '# CREATING A BACKUP TASK SCRIPT


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, one that automates the task as

    adding some customisations along the way.


    | STEP 1 | A very basic backup script would look something along the lines of:
    ~/bin/bash, then tar cvf ~/backups/my-backup.tgz ~ will create a compressed file
    from the /Documents folder, with everything in it, and put it in a folder of /backups
    with my name my-backup.tgz |


    | STEP 4 | Once the /backups folder is created, we can now create a new subfolder
    within it at the beginning. Add mkdir -p $Sdest/$Day $Month $Year - it''s in here
    that you put the backup file to that date/month/year. |


    ```

