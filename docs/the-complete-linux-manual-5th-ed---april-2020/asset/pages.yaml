    what the function is programmed to do and returns the end value. The data worked
    on inside the brackets, so if you wanted to know how many letters are in the word
    antidisabishmentarianism(), and the number 2 would return.


    Python has tens of functions built into it, far too to get into the limited space
    available here. However, to view the list of built-in functions although Python
    3, navigate to docs.python.org/3/library/functions.html. These are the predefined
    functions, but users have created many more, they''re not the only ones available.


