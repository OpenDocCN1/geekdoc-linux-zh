  md: '# VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distros. Linux Mint works exceedingly well when used in a virtual environment
    but more on later. There are many different virtual environment apps available;
    however, VirtualBox from Oracle, is one of the easiest to into. You can find the
    latest version at www.virtualbox.org.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_0.png)


    # INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_1.png)


    # MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac owners use a virtual environment, such as VirtualBox or Parallels;
    and why not macOS is a splendid operating system. If you''re wanting to breathe
    new life into an older Mac, make sure it''s an Intel CPU model and not the Power
    PC models. Beware though, it''s not as free as installing on to a PC.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_2.png)'
