  md: '# # Update Mint via the Terminal


    Up to now you''ve been using the shield icon launch Mint Update Manager in order
    to update the system and upgrade the currently installed apps, tools and other
    elements. However, you can also accomplish a complete system update and upgrade
    from the Terminal.


    # ## USING APT-GET


    To update and upgrade the Terminal you use the APT (Advanced Packaging Tool) is
    a powerful command and combines different elements depending on its use.


    +   **STEP 1** Start by opening a new Terminal or if you already have opened one
    clear its contents with the command. This starts off with a clean slate to work
    on.


    +   **STEP 3** Apt-get is used to upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new packages
    and updates the list of source. Upgrade downloads and installs to the latest versions
    of files. To start the Upgrade process, enter: `sudo apt-get` followed by your
    password.


    +   **STEP 2** Enter, `apt-get` into the Terminal. This brings up a list of the
    most used commands, along with a brief description of what the command does. It''s
    worth having a look if it doesn''t make sense of time.


    +   **STEP 4** Notice the addition of the sudo command. The sudo command once
    more as Substitute User Do: It means that the administrative user (super User)
    uses APT (Advanced Packaging Tool) to get Updates. Now use this: `sudo apt-get
    upgrade`.


