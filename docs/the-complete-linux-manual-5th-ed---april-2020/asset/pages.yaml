    # # TERMINAL VS UPDATE MANAGER?


    Using the Terminal to update and upgrade the Update Manager, regardless of the
    distro you''re using? Some users find great useful using the Terminal to update
    their Linux systems and accompanying apps, in the belief that it''s better. However,
    that''s not always true.


    Using the Terminal, apt-get doesn''t handle handling dependencies between versions
    of packages, or if package changed from one version to another, the update is
    held back.


    The Update Manager, or Software Manager (depending on the distro), often opens
    its updates and marks those packages


    with changed dependencies for updating. However, and this is if Linux can opt
    getting confusing, sometimes it doesn''t.


    It all boils down to the developer of the package being updated and the way the
    package is in the distro''s repositories and whether the update is stable or on
    edge. For us, if you update and upgrade Manager regularly, then you will be up
    to date as possible, using both the Terminal and the Update Manager to get the
    essential and stable versions of the package software.


