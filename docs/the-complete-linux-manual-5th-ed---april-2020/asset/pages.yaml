  md: '# Numbers and Expressions


    STEP 5 You can also use an operation to see the remainder left over division.
    For example:


    10/3

    Will display 3.333333333, which is of 3.3-recurring. If you nenter:


    10K3

    This will display 1, which is the remainder left over dividing 10 into 3.


    ```

    27590321121179024

    >> 1/2

    >> 0.5

    >> 3.0

    >> 2*3

    >> (1+2)*(3+4)

    >> 21

    >> 6/2

    >> 3

    >> 10/3

    >> 3.3333333333333335

    >> 2**3

    >> 8

    >> 10**8

    100000000

    ```


    STEP 8 This will be displayed as ''011'', converting the integer into binary and
    adding the prefix 0b to the front. If you want to remove the 0b prefix then you
    can use:

    format(3, ''b'')


    The Format converts a value, 3, to a formatted representation as controlled by
    the format specification, ''b''.


    ```

    >>2**2

    >> 4

    >>(1+2)*(3+4)

    >> 21

    >> 15

    >> 6/2

    >> 3

    >> 10/3

    >> 3.3333333333333335

    >> 2**3

    >> 8

    >> 10**8

    100000000

    ```


    STEP 6 Next up we have the power operator, or exponentiation if you want to be
    technical. You can use a double multiplication or double-star for the keyboard:


    2**3

    10**10

    It''s essentially 2^3 but you already know the basics behind math operators. This
    is how you would it it in Python.


    ```

    >> 6/2

    >> 3

    >> 2*3

    >> 6

    >> (1+2)*(3+4)

    >> 21

    >> 1/2

    >> 0.5

    >> 10/3

    >> 3.3333333333333335

    >> 2**3

    >> 8

    >> 10**8

    1000000000

    ```


    STEP 9 A Boolean Expression is a statement that will be true or false. We can
    compare data and see if it''s equal to, or greater than. This is in a New File:


    ```

    a = 6

    b = 7

    print(a == b)

    >> False

    print(a < b)

    >> True

    print(a == 6 and b == 7)

    >> True

    print(a == 4 and b == 7)

    >> False

    print(a != 7 or b == 7)

    >> True

    print(a == 7 or b == 6)

    >> True

    print(5, (a == 7 and b == 6))

    >> False

    print(7, not (a == 7 or b == 6))

    >> False

    print(9, not (a == 7 and b == 6))


    ```


    STEP 7 Numbers and expressions don''t stop there. Python has numerous built-in
    functions to work out sets of numbers, absolute values, complex numbers and a
    host of mathematical expressions and Pythagorean-twisters. To convert to binary,
    use:


    bin(3)


    ```

    >> 1/2

    >> 0.5

    >> 6/2

    >> 3

    >> 2*3

    >> 6

    >> (1+2)*(3+4)

    >> 21

    >> 15

    >> 6/2

    >> 3

    >> 10/3

    >> 3.3333333333333335

    >> 2**3

    >> 8

    >> 10**8

    1000000000

    >> bin(3)

    >> ''0b11''

    ```


    STEP 10 Execute the code from Step 9, and you can see a series of True or False
    statements, depending on the result values: 6 and 7. It''s an extension of what
    you''ve looked at, and an important part of programming.


    ```

    Python 3.4.2 (default, Jun 29 2015, 01:28:40) [GCC Windows] on Windows

    Type "help" for help, or "license" for more information.

    >>> a = 6

    >>> b = 7

    >>> a == b

    False

    >>> a < b

    True

    >>> a == 6 and b == 7

    True

    >>> a == 4 and b == 7

    False

    >>> a != 7 or b == 7

    True

    >>> a == 7 or b == 6

    True

    >>> 5, (a == 7 and b == 6)

    False

    >>> 7, not (a == 7 or b == 6)

    False

    >>> 9, not (a == 7 and b == 6)

    False

    ```


