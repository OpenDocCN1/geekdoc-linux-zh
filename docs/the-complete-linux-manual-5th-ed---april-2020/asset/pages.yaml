    TypeError: Can't convert 'int' to object by implicitly\n>>> int(age) + 10\n54\n\
    ```\n\n# STEP 6\n\nThis is a process called TypeC. The Python code is:\n\n```\n\
    print (char + \" is \" + str(age) + \" years old.\")\n```\n\nNotice that in the\
