  md: '# # Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    it has no choice in the matter.


    # ## COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s being installed and where.


    +   * **STEP 1** Installing apps from the Terminal is relatively simple. First,
    though you need to make sure the system is up to date. Do this by opening the
    Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your
    password and accept any necessary updates.


    ```

    File Edit View Search Terminal Help

    $ sudo apt-get update && sudo apt-get upgrade

    Reading package lists......

    Building dependency tree...

    Reading state information... Done

    0 packages upgraded, 0 newly installed, 0 to remove and 0 not upgrade

    ```


    +   * **STEP 3** You need to enter y to confirm the installation, which takes
    up around 5.5MB of storage in the system. Once Stella is installed, you can see
    that Mint has automatically created the Games category in the Menu as well as
    the app shortcut.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_49_0.png)


    +   * **STEP 2** Just as you''ve seen, sudo apt-get update/upgrade and so on are
    designed to upgrade the software that''s already installed on the system. You
    do install more apps though? It first you need an app to install, so let''s use
    Stella. Enter: `sudo apt-add-repository ppa:peterlevi/ppa && sudo apt-get install
    stella`.


    ```

    File Edit View Search Terminal Help

    $ sudo apt-add-repository ppa:peterlevi/ppa

    Adding PPA ppa:peterlevi/ppa

    Contains packages for the Variety package changer

    More info: https://launchpad.net/~peterlevi/ubuntu/ppa

    Press Enter to continue or Ctrl+C to cancel.

    ```


    +   * **STEP 4** Sometimes, when installing software, you need to add the app''s
    Repository, or repo, is simply the remote server where the software is installed,
    along with all its dependencies (the libraries and books it needs to function).
    Start by typing: `sudo apt-add-repository ppa:peterlevi/ppa`. Press Enter to add
    and add the GGA (Personal Package Archive).


    ![](img/f8aca09bc266ba3d122c77a820ff023b_49_1.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# STEP 5


    This adds the repo for the App Variety Wallpaper Changer, an Ubuntu-based app
    that works in Mint and changes the wallpaper automatically. When the repo is added,
    enter: **sudo apt-get update**, to update the information and add contents of
    the repo to the package manager.


    # STEP 6


    Now to install Variety, enter: **sudo apt-get install**. Press y to accept and
    continue to the installation. Once installed, you can type **variety** in the
    terminal to run it.


    ```

    sudo add-apt-repository ppa:variety-wallpaperproject/ppa

    sudo apt-get update

    sudo apt-get install variety

    ```


    # REMOVING APPS


    In addition to installing apps, the apt command can also be used to remove any
    apps and help keep your system fast and free up resources.


    # STEP 1


    To uninstall, remove the Variety app enter following: **sudo apt-get remove variety**.
    Enter y to continue with the uninstall of the app; notice that you''re informed
    of how much space you''re freeing up on the drive as a result of removing the
    app.


    ```

    File View Search Terminal

    daviddavid-mint $ sudo apt-get remove variety

    Reading dependenciesnBuilding dependency tree...

    Reading package information... Done

    The following packages were automatically installed and are no longer required

    variety-slideshow

    The following packages will be REMOVED

    variety

    After this operation, 1 package to remove, 0 not to upgrade,

    14.4 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    # STEP 3


    When you remove apps from the system some automatically installed are no longer
    required. You already saw in the process tutorial, that you can use the following
    command **sudo apt-get autoremove**, followed by y to accept the process.


    ```

    File View Search Terminal

    daviddavid-mint $ sudo apt-get autoremove

    Reading dependenciesnBuilding dependency tree

    Reading package information... Done

    The following packages were automatically installed and are no longer required

    lib-python3.8-python-py32-variety-slideshow

    0 packages to be REMOVED, 0 not to upgrade.

    After this operation, 1.06 MB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    # STEP 2


    While the apt-get command uninstalls an app, it doesn''t remove the extra stuff
    that comes with an app, such as configuration and files. To completely remove
    the clutter, enter: **sudo apt-get purge variety**.


    ```

    File View Search Terminal

    daviddavid-mint $ sudo apt-get purge variety

    Reading dependenciesnBuilding dependency tree

    Reading package information... Done

    Package: variety is not installed, so not removed

    The following packages were automatically installed and are no longer required

    variety-slideshow

    Use "purge" to upgrade 0 to newly installed, 0 to remove not to upgrade.

    daviddavid-mint $

    ```


    # STEP 4


    Finally, to tidy up all the unneeded packages in the system, and remove the elements
    that the autoremove command couldn''t: enter: **sudo apt-get autoclean**. These
    last few steps are for keeping your Mint setup in good working order and to trim
    off the unnecessary installations and unloads.


    ```

    File View Search Terminal

    daviddavid-mint $ sudo apt-get autoclean

    Reading dependenciesnBuilding dependency tree

    Reading package information... Done

    daviddavid-mint $

    ```'
