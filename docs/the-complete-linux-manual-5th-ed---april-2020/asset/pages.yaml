    // See if we''re aligned for writing in 64 bit

    if (bit_size(long) == 8)

    if (!(defined (amd64) || defined (x86_64

    ```


    # ## PLAN AHEAD


    While it''s great to wake up one morning and decide to code a classic text, it''s
    not practical without a good plan. Small snippets of code can be written without
    too much planning but learning more in depth requires a good working plan to stick
    to and iron out the bugs.


