  md: '# # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all.
    Understanding how to use the command line not only builds your understanding of
    Linux but also improves your knowledge of coding and programming in general. Our
    command line quick reference guide is designed to help you master Linux quicker.


    # ## TOP 10 COMMANDS


    These may be the most common commands used by everyone they will certainly feature
    frequently for many users of Linux and the command line.


    +   - **cd** is one of the commands you will use the most at the command line
    in Linux. It allows you to change your working directory. You use it to move around
    within the hierarchy of your file system. You can also use cd.


    +   **mv** moves a file to a different location or renames a file. example mv
    file sub renames the original file to sub, mv sub ~/Desktop moves the file ''sub''
    to your directory but does not rename it. You must specify a new filename to rename
    it.


    +   - **ls** shows the files in your current directory. With certain options,
    it lets see file sizes, when where created and permissions. example ls -l shows
    the files that are in your home directory.


    +   **chown** changes the user/ group ownership of each given file. If only one
    owner (a name or numeric ID) is given, that becomes the owner of each given file,
    and the file''s group is not changed.


    +   - **cp** is used to make copies of files and directories. For example, cp
    file sub makes an exact copy of the file you named and copies the name as sub.
    The first file will exist with its original name.


    +   **chmod** changes the permissions on the files listed. Permissions are based
    on a simple model. You can set permissions for user, group and world and you can
    set whether each can read, write, and execute it.


    +   - **pwd** prints the full pathname of the current working directory ("printing
    directory"). Note that the GNOME terminal also displays this in the title bar
    of its window.


    +   **rm** removes (deleted) files and directories. The remove process performs
    a unlink in a filesystem from the data storage device and marks that as usable
    by future writes. Other removing increases the amount of available space on your
    disk.


    +   - **clear** clears your screen if it is possible. It looks in the environment
    of the terminal and then the specified terminal into the terminfo database to
    figure out how to clear the screen. It is equivalent to typing Control-L when
    using the shell.


    +   **mkdir** for "make directory" is used to create directories in a file system,
    if the specified directory does not already exist. For example, mkdir creates
    a working directory. More than one directory may be specified when calling mkdir.'
