  md: '# Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user a choice of versions of the distro: Cinnamon, MATE
    and Xfice. While that may sound a little confusing for the newcomer, each of the
    versions contains the same core Linux structure and kernel, the kernel is the
    core of the operating system, handles all the instructions between the software.


    Each version is simply a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, as the file manager
    to browse the operating system''s file structure or the way it launches other
    apps. Again though, the core available productivity, video and graphic suites
    are the same, and function in the same way.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    # FAB FEATURE 1


    It performs excellently on more modern systems but is a lot more stable than it
    used to be, and not quite the resource hog it once was. Therefore, don''t put-off
    Cinnamon if you''re using an older computer to install and test Linux Mint.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_14_0.png)


    # FAB FEATURE 2


    Cinnamon features configurable Hot Corners, where each corner of the desktop can
    be clicked to perform a certain task, such as display the Workspaces, Show all
    Windows or Run a Command. The Hot Corners are easy to switch between different
    views and help make the desktop a more efficient environment.


    # BEST MATE


    MATE is simple to use and intuitive DE''s fast and stable. In comparison to Cinnamon
    it looks a little antiquated but that''s only on the surface. There''s plenty
    to like with MATE.


    # FAB FEATURE 2


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components than Cinnamon generally does but is
    just as capable of delivering a great looking desktop as well as advanced customizations.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_14_1.png)


    # FAB FEATURE 2


    Due to its highly configurable nature, MATE can be customised to a fine degree.
    There are plenty of options available to the user who demands a little more from
    their desktop environment, including Compiz Settings, where you''re able to configure
    all manner of desktop effects, even a 3D desktop cube.


    # CHOLESTEROL FREE DESKTOP


    Xfce started life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and now simply Xfce, with the nickname ''Cholesterol Free
    Desktop Environment''.


    # FAB FEATURE 1


    Xfce really is a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a new OS.
    Not bad.


    # FAB FEATURE 2


    Just because it''s quick and lightweight does not mean Linux Mint Xfce isn''t
    a complete desktop operating system. Just like the other environments on offer,
    you can get the latest Firefox, Libreoffice, VLC, Gimp, chat apps and even a bit
    torrent client.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_14_2.png)'
  merge: -1
