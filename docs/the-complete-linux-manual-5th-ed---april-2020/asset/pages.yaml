  md: '# Common Coding Mistakes


    When you start something you''re inevitably going to make mistakes, this is purely
    down to inexperience and those mistakes are great teachers in themselves. However,
    even experts make the occasional mishap. It is to learn from them as best as you
    can.


    # ## X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognise a mistake and fix it is when you start to
    move into more advanced territory, and become a better coder. Everyone makes,
    even coders over thirty years'' experience. Learning from these, common mistakes
    help build a better coding foundation.


    # ## SMALL CHUNKS


    It would be wonderful to work like Neo from The Matrix movies. Simply ask, your
    operator loads it into your memory and you instantly know everything about the
    subject. Sadly though we can''t do that. The major pitfall is trying to learn
    too much, too quickly. So taking coding in small pieces and take your time.


    # ## EASY VARIABLES


    Meaningful naming for variables is a must to eliminate common coding mistakes.
    Having letters of the alphabet is fine but what when the code states the problem
    with x variable. It''s not too difficult to name that lives, money, player1 and
    so on.


    ```

    var points = 1023;

    var lives = 5;

    var totalTime = 45;

    write("Points: " + points + ");

    nwrite("Lives: " + lives + ");

    nwrite("Total: " + totalTime + ");\nvar playerScore = 0;

    write("Your Total Score is: " + playerScore + ");

    ```


    # ## //MENTS


    Use comments, a simple concept but your code saves so many problems when you come
    next to over it. Inserting simple lines of code that are causing problems; also
    useful if you need to review an old piece of code.


    ```

    orig = 2;

    target = 2;

    n = 0;

    #endif

