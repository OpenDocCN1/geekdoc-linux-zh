  md: '# # Working with Variables


    We''ve seen some examples of variables in our Python code already it''s worth
    going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # ## Various VARIABLES


    You''ll be working with the Python 3 IDLE Shell in this tutorial. If you haven''t
    already, open Python 3 or close the previous IDLE Shell to clear up your area.


    In some programming languages you''re required to use a dollar sign to denote
    a string, which is a variable made up of multiple characters, such as a name of
    a person. In Python this isn''t necessary. In the Shell enter: `name="David Howard"`
    (or your own name, unless''re also called David Howard).


    You''ve seen previously that variables can be concatenated with the plus symbol
    between the variable names. In our example we can use: `print(name + ": " title)`.
    The middle part between the quotations allows us to add a colon and a space, as
    variables are connected without spaces, so we need to add them manually.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_105_0.png)


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Windows Help

    >>> Oct 19 2014, 13:31:11

    [3.4.2] on linux

    >>> type("str" or "license") for more information.

    >>> name="David Howard"

    >>> print(name)

    David Howard

    >>>

    ```


    You can check the type of variable in use by issuing the `type()` command, placing
    the name of the variable inside the brackets. In article this would be: `type(name)`.
    Add a new string variable: `title="Descended from Vikings"


    You can also combine variables within another variable. For example, combine both
