  md: '# The Best Linux Distributions


    # ARCH


    Arch is one of longest running Linux distributions and forms the basis of many
    other versions of Linux. Why install Mint or Ubuntu when you can? Arch? Many users
    do exactly that it''s not ideal for beginners. Ubuntu and Mint offer an easier
    installation path and come with software packages to help you get started.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_10_0.png)


    Arch is a distro for when you''re more experienced with Linux. You start with
    nothing but the command line and from there you have to manually partition your
    hard drive, set the OS locale create files, and finally install a desktop environment
    with the apps you need.


    Arch on the other hand, is a more ''bare bones'' affair. Arch is committed to
    free software and its repositories contain over 50,000 apps to install, including
    multiple different Desktop environments, and as you would with any other distro.


    The advantage though, for all this hard work, is a distro that you have created.
    Your Arch distro doesn''t come with all the unnecessary files and apps that you
    have preinstalled.it''s custom made for you, by you.


    archlinux.org


    # RASPBERRY PI DESKTOP


    # OPENSEUSE


    No doubt you''ve heard of Raspberry Pi. It''s not have to have, as this remarkable,
    tiny computer has the technology to take world for the last six years since it
    was introduced.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_10_1.png)


    There are several aspects to the Raspberry Pi that make it such a sought after
    piece of the computing world. For one it is cheap, around $25 for a fully working
    computer. it''s small, measuring not much bigger than a credit card. You can build
    electronics with it, a fully programmable interface; and it comes with Raspberry,
    its own custom-made, Debian-based operating system that includes an office suite
    alongside many different programming languages and educational resources.


    Most Linux distributions fall into two camps. There are ones with the latest features
    like Ubuntu and Mint with those few features but also solid reliability, it is
    Debian.


    Raspbian is exclusive to the Pi, since the Raspberry Pi uses an ARM processor
    to power it. However, the Raspberry Foundation has released a PC version of Raspian
    Raspberry Desktop.


    Meanwhile, openSUSE takes to cover both bases. openSUSE is the solid rock system,
    it developed by a community along with SUSE employees, who develop an enterprise-level
    operating system, SUSE: this uses the London Stock Exchange environment for critical
    missions where there''s no space for instability. If you find all that too sensible,
    openSUSE tumble release with all the latest features, and the occasional crash.


    Just like the Pi, Raspberry Pi Desktop comes with all the coding, education and
    other apps you will ever need. it''s quick, stable and works superbly. If you''re
    interested in stretching your Linux, this is certainly one of the top distros
    to consider.


    openSUSE is a highly respected Linux distribution and many of its core contributors
    work on the Linux Kernel, LibreOffice, Gnome and other key Linux areas. In short,
    openSUSE is what you''ll find the pros around


    www.raspberry.org/downloads/raspberry-pi-desktop


    ![](img/f8aca09bc266ba3d122c77a820ff023b_10_2.png)


    www.openSUSE.org'
