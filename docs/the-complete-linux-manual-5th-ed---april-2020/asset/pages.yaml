  md: '# Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install any other operating system on it without
    affecting the one already installed on your computer. It''s a great way to test
    and use Linux, while still having Windows 10 as your main OS.


    # GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so. Make sure you have enough of each before
    commencing.


    +   **STEP 1** We''re using VirtualBox in this instance, as it''s one of the easiest
    environments to get grips with. Enter virtualbox.org and click on ''Download VirtualBox''.
    This takes you to the main download page. Locate the correct host for your system
    (Windows, Mac or Linux, the Host being the currently installed operating system)
    and click the link to download.


    +   **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host a VM. To
    do this, reboot the computer and enter the BIOS. When the computer starts up,
    press F2 or ever to enter Setup.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_23_0.png)


    +   **STEP 2** Next, while on the VirtualBox download page, locate the VirtualBox
    Extension Pack. The Extension Packs support USB devices as well as numerous other
    extras that help make the VM environment more like a ''real'' computer.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_23_1.png)


