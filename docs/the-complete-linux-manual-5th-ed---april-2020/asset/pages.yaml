  md: '# Creating Bash Scripts - Part 3


    # MORE LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batching copying or running a script where a counter is needed.


    STEP 1 Create a new script called count.sh. Enter the text in the screenshot below,
    save and make it executable. The script creates the variable ''count'' which is
    at the beginning of the script equals zero. Then if the WHILE loop is less than
    (the LT part) 0 it will print the current value of the counter in the echo command.


    STEP 4 THE UNTIL loop works much the same as the WHILE loop does, more often than
    not, in reverse. So our counting to a hundred, using UNTIL, we be: [ count -gt
    100 ]; the difference being, until counter is greater than (the gt part) hundred,
    keep looping.


    ```

    File Edit View Search Documents Help

    count.sh

    #!/bin/bash

    count=0

    while [ $count -lt 100 ]; do

    echo $count

    count=$count+1

    ```


    STEP 2 Executing the script count.sh will result in the numbers 0 to 99 listing
    the Terminal screen; when it reaches 100 the script will end. Modify the script
    with the FOR statement, it works much the same way. To use it in our script, enter
    the text from the screenshot into count.sh.


    STEP 5 You''re not limited to numbers to one hundred. You can, within, have whatever
    set of commands you execute them as many times as you want the loop to run. Renaming
    files, creating fifty folders etc. For example, this script will create folders
    named Folder 1 through 10 using the FOR loop.


    ```

    File Edit View Search Documents Help

    count.sh

    #!/bin/bash

    for count in {0..100}; do

    echo $count

    count=$count+1

    done

    ```


    STEP 3 The have added here for: count in {0..100}; do means FOR the variable ''count''
    IN the numbers from zero to one hundred, then start the loop. The rest of the
    script is the same. Run this script, and the output appear in the Terminal.


    STEP 6 After the FOR statement once, we can execute by manipulating the sequence
    (0..100) part. This part of the code actually means (START..INCREMENT); if there''s
    no increment it''s just a single digit up to the END. For example, we couple the
    loop to count up to 100 with two''s: For count in {0..1000..2}; do


    ```

    File Edit View Search Documents Help

    count.sh

    #!/bin/bash

    for count in {0..1000..2}; do

    echo $count

    count=$count+1

    done

    ```'
