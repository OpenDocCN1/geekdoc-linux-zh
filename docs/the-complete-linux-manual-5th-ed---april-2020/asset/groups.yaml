    # # How to Set Up Python in Linux


    ### STEP 5 However, if you want the latest, cutting edge version, you need to
    build Python from source. Start by entering these commands into the terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libsqlite3-dev

    ncursesw5-dev libbz2-dev tk-dev

    libdbm-dev libdb6-dev libbz2

    ```


    ### STEP 8 Within the Python folder,

    ./configure

    sudo make altinstall


    This could take a while depending on the speed of your computer. Once finished,
    use python3.7 --version to check the installed version. Now have Python 3.7 installed
    alongside Python 3.x and Python 2.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_90_0.png)


    If you want a build with all stable optimizations (LTO, etc.), please run --enable
