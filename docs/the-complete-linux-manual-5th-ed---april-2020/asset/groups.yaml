    # Basics of the Terminal


    Most operating systems use two kinds of interface: the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into, and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop is within the Terminal. Let''s start by seeing how it
    works.


    - STEP 1 The Terminal can be accessed by either clicking on the Terminal icon
    on the Panel, located between the Firefox and Files icons, or by opening the Menu
    and selecting it from the left-hand quick launch strip.


    - STEP 3 What you currently see in the Terminal is your login followed by the
    name of the computer; as you ended during setup when you first installed Mint.
    The line ends with the current folder name; at first this is just a tilde ~, which
    means your Home folder.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_45_0.png)


    - STEP 2 The Terminal gives you access to the Linux Mint Shell, called Bash, which
    gives you access to the underlying operating system. Everything in Mint, including
    the desktop and GUI, is a module running from the command line.


    - STEP 4 The flashing cursor at the end of the line is where your text-based commands
    are entered. You can begin to experiment with a simple command, Print Working
    Directory (pwd), which outputs the current folder you''re in on the screen. Type
    pwd and press Enter.


    ```

    david@david-mint ~ $

    ```


    ```

    david@david-mint ~ $ pwd

    david@david-mint ~ $

    ```


    # STEP 5


    All the commands you enter work in the same manner: you enter the command, include
    any parameters to extend the use of the command and press Enter to execute the
    command you''ve entered. Type into Terminal: `uname` and press Enter. This displays
    some system information regarding Mint.


    # STEP 8


    View and Search options let you alter the sizing of the Terminal window and of
    course search within the Terminal for any particular keywords.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_46_0.png)


    # STEP 6


    Before we get into entering commands, let''s take a moment to see what menus the
    Terminal has to offer. File menu allows you to open a new Terminal, create a new
    profile, where you can alter the size, colours and behaviour of the Terminal,
    add a new tab, and close all current active sessions.


    # STEP 9


    The Edit entry extends the profile editing and sizing and allows you to also set
    it to a Read Only mode, which stops you from entering any commands into the Terminal.
    This is good for when you need to permanently display the contents.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_46_1.png)


    # STEP 7


    The Edit option lets you copy and paste commands to and from Terminal and other
    sources; handy if you want to copy a very long and complex command from a web
    page. It also allows you to edit your profile preferences.


    Finally, the Help option displays the contents and version number of the Terminal,
    or as we''ll refer to it as Terminal in Future. The Contents are worth having
    a quick read through, to help familiarise yourself with how the Terminal works.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_46_2.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_46_3.png)


    # Update Mint via the Terminal


    Up to now you''ve been using the shield icon to launch Mint Update Manager in
    order to update the system and upgrade the currently installed apps, tools and
    other elements. However, you can also accomplish a complete system update and
    upgrade from the Terminal.


    ## USING APT-GET


    To update and upgrade the Terminal you use the APT (Advanced Packaging Tool) is
    a powerful command and combines different elements depending on its use.


    - STEP 1 Start by opening a new Terminal or if you already have opened one, clear
    its contents with the command. This starts off with a clean slate to work on.


    - STEP 3 Apt-get is used to upgrade the software in Mint, as well as Ubuntu and
    other Debian-based distros. Using the Update element retrieves new packages and
    updates the list of source. Upgrade downloads and installs to the latest versions
    of files. To start the Upgrade process, enter: `sudo apt-get` followed by your
    password.


    - STEP 2 Enter, `apt-get` into the Terminal. This brings up a list of the most
    used commands, along with a brief description of what the command does. It''s
    worth having a look if it doesn''t make sense of time.


    - STEP 4 Notice the addition of the sudo command. The sudo command once more as
    Substitute User Do: It means that the administrative user (super User) uses APT
    (Advanced Packaging Tool) to get Updates. Now use this: `sudo apt-get upgrade`.


    ```

    david@david-mint: $ clear

    ```


