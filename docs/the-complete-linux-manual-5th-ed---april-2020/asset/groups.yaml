    Just as mentioned previously, you don''t need to have std::cout; if you''ve already
    declared the namespace at the start of the code. Now, let''s create a deliberate
    mistake, to see what happens. Remove the semicolon from the cout line, so it reads:


    ```

    cout << "Hello, world!\n"

    ```


