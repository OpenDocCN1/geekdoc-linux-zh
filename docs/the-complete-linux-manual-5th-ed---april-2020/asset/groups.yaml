    # VPNS AND TOR


    The previous steps can aid your online privacy but to become anonymous you need
    a Virtual Network and Tor.


    +   **STEP 1** A VPN is a remote server, or cluster of servers, that establishes
    a connection with your computer. The result is that your computer''s identity
    on the Internet is hidden behind the VPN remote server; so you could use it in
    the UK but have an IP address (computer online identity) belonging to Iceland.


    +   **STEP 4** When the download has finished, drop it into the Downloads folder.
    Enter it to check if the tar.xz file is present, then enter: `-xf tor-browser-linux64-8.0.4_en-US.tar.xz`
    (X is updated, so if your version is different press Tab to autocomplete the tor-browser*-filename).
    When it to enter your network.


    # How VPN works?


    ![](img/f8aca09bc266ba3d122c77a820ff023b_42_0.png)


    +   **STEP 2** Most VPNs cost a monthly or yearly fee but it''s worth the expense.
    We use CyberHost, cyberhostvpn.com, which provides VPN connections for Windows,
    Mac, Mint (as any other Linux distribution), Android and iOS devices. Details
    for each can be found at **www.cyberhostvpn.com/hz/en-us/articles/213190329-Read-me-first-.


    +   **STEP 5** A quick reveals a couple of entries: folder Browser and file ''start-tor-browser.desktop''.
    To start the setup, use `./start-tor-browser.desktop`. This command launches the
    setup, where you are offered two options: Connect or Configure. For more users,
    the Connect option will suffice. Click Connect when you''re ready.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_42_1.png)


    # Connect to Tor


    # Tör Browser


    Click "Connect" to connect to Tor


    Click "Configure" to adjust network settings if you are in a country that blocks
    Tor (such as China, Turkey) or if you are connecting from a private network requires
    a proxy.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_42_2.png)


    +   **STEP 3** Another option is to use Tor. Tor is an open network that you can
    attach to hide your IP address behind countless nodes around the world. It is
    very easy to install and use. Start by navigating to **www.torproject.org/download/linux-easy.html**
    and clicking on the Download for Linux 64-bit version.


    +   **STEP 6** After the connection is established, Tor launches. This is a customised
    version of Firefox and from here you can securely browse the Internet without
    fear of being viewed or tracked. Mixing both VPN and Tor makes for an extremely
    secure and private connection to the online world.


