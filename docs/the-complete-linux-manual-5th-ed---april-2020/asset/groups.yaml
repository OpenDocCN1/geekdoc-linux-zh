    \ 数据类型\n\n正如你所看到的，变量存储程序员可以调用和操作的信息。变量仅仅是存储程序员赋值值的内存位置。\n\n## 数据的值\n\nC++ 中有很多不同的数据类型，例如整数、浮点型、布尔型等。广泛接受有七种基本类型，通常称为内置类型；但你可以在代码中创建自己的数据类型。\n\
