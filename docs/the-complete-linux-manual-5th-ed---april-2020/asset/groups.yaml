    # 通过终端更新 Mint


    到目前为止一直在使用盾牌图标启动 Mint 更新管理器来更新系统和当前安装的应用程序、工具和其他元素。然而，你也可以从终端完成整个系统的更新和升级。


    ## 使用 APT-GET


    更新和升级终端你使用 APT（高级软件包工具）是一个强大的命令，并根据其使用组合不同的元素。


    - 步骤 1 通过打开一个新的终端，或者如果你已经打开了一个，通过命令清理内容来从干净的状态开始。


    - 步骤 3 `apt-get` 用于升级 Mint 以及其他基于 Debian 的发行版。使用 `apt-get` 获取新软件包并更新源列表。升级下载并安装最新版本。要启动升级过程，输入：`sudo
    apt-get` 然后输入你的密码。


    - 步骤 2 输入 `apt-get` 进入终端。这会带来最常用的命令列表，以及该命令作用的简要描述。


    - 步骤 4 注意 `sudo` 命令的添加。管理员用户（super User）使用 APT（高级软件包工具）来获取更新。现在使用：`sudo apt-get
    upgrade`。


