    不用说，如果你认为自己是一个相对高级的高级用户，那么你将想要扩展自己的技能，并开始基于 Arch、Debian 或其他许多可用发行版构建你自己的 Linux
    发行版。这涉及到命令行知识，以及对 Linux 系统如何工作以及如何与计算机硬件交互的了解。你需要划分分区、安装驱动程序并最终安装应用和程序。这需要时间，而且你将会学到很多技能。


    然而，归根结底，完全取决于选择，取决于你个人的选择。你可能会发现，在学习完本文中的教程后，你并不喜欢 Linux Mint 或 Cinnamon 桌面。没关系，你可能更喜欢
    Ubuntu、Debian 或 openSUSE——这就是 Linux 的魅力所在。你可以自由更改你想要的内容，在不同的发行版之间切换（distro hop），而不会受到成本或访问限制的惩。


    最终，你认为自己是一个技术型 Linux 用户，但从未认为自己是专家，毕竟我们始终在学习新东西。你可以从零开始构建自己的发行版，帮助其他 Linux 用户解决问题，甚至可能在发行版的测试阶段对其改进做出贡献，接下来呢呢？


    “选择哪个发行版”这个问题的答案是：任何你喜欢的都可以；它可以根据你的需要变得复杂或简单，只要它能实现你的需求，它就是完美的。


