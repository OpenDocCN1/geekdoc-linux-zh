    # Apollo 11


    DID YOU KNOW... July 20th 1969 is remembered as a turning point in human history,
    when mankind first stepped on the moon. The software that helped the crew make
    pivotal voyage didn''t exist at the time and had to be developed from scratch.
    Using a new method of storing programs called Rope Memory, the engineers at MIT
    Instrumentation Laboratory populated the memory with a special version of assembly.


    Incredibly, that code is freely available to view on GitHub. Uploaded by a researcher
    in 2003, you can view the code by visiting www.github.com/chrisgarry/Apollo-11/.
    Look out for code snippets, such as Burn, Baby_Burn, in particular 925 with the
    comment "Goodbye. Come soon."


