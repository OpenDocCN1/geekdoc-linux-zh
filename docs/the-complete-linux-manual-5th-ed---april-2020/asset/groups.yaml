    \ $class\"\necho -e \"Blue $class\"\necho -e \"Light cyan $class\"\necho -e \"\
    Light gray $class\"\necho -e \"Light green $class\"\necho -e \"Light blue $class\"\
    \necho -e \"Light magenta $class\"\necho -e \"Light magenta $class\"\n```\n\n\
    STEP 9 While're on making fancy scripts, how using Zenith to output a graphical\
