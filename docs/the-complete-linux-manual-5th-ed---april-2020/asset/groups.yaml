  - '[PAGE 31]


    # Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead for a
    clean, sharp look to keep everything running as fast as possible. Let''s see what
    the Cinnamon desktop has to offer.


    # A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to like about it, which is why it''s such a popular DE.


    +   **STEP 1** Begin exploring the Cinnamon desktop by double-clicking the Computer
    icon. This brings Nemo, the file manager used in Cinnamon. The Computer icon opens
    the root level file system, with access and views to the optical drive (if you
    have one installed), hard drive and core Linux file system.


    +   **STEP 3** Nemo has many different features, views and ways that you can view
    and manage files and Folders. For example, if you have any images in the Pictures
    folder, you can select the icon level for the images by using the slider located
    in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_31_0.png)


    +   **STEP 2** The Linux file system can appear confusing to a former Windows
    user, so you''re a little more knowledgeable about how it all works, we recommend
    you concentrate on the Home icon on the desktop. Here in is everything relating
    to your user account: where you store Pictures, Videos, Music, Documents, Downloads
    items etc.


    +   **STEP 4** Just like any good file manager, if you right-click any of the
    files or folders within you get a wealth of options. In the case of Cinnamon,
    the defaults allow you to view a file depending on what type of file it is and
    copy, cut, delete, compress, rename, send via email and view its properties.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_31_1.png)'
