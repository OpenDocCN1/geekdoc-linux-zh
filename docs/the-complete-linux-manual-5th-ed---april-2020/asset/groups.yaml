    \n```\nSELECT MENU\n1. Mint\n2. Awesome\n3. Vanilla\n4. Chocolate\n```\n\n## 创建备份脚本\n\
    \nBash 脚本最常用的示例之一是备份程序，它可以自动化任务。\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 步骤 1 | 一个基础备份脚本看起来像这样：`#!/bin/bash`，然后\
