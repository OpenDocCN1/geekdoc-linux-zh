    \ focal-security\nHit:10: http://repository.ubuntu.com stable\nAll packages are\
    \ up to date.\n```\n\n```\ndavidid-mint $ mkdir scripts\ndavidid-mint ~ $ cd scripts/\n\
    davidid-mint ~/scripts $ \n```\n\n+   **STEP 2** There are several text editors\
    \ we can use to create a Bash script: Xed, Vi, Nano, Vim, GNU Emacs and so on.\
    \ In the end it all comes down to personal preference. The use of Xed is purely\
