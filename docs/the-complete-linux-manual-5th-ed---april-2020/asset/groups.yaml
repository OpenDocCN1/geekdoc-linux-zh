    \    // 无需添加更多斜杠\n    cout << \"And greetings from C++!\";\n}\n```\n\n然而，你也可以在行尾添加注释，来描述你正在操作：\n\
    \ncout << \"Hello, world!\" << endl; // 这会输出单词 'Hello, world'. // endl 表示换行。\n\
    \n注意，你不需要在注释末尾加分号。这是因为 `//` 标记了编译器将忽略的行。\n\n```cpp\nhelloworld.cpp\n#include <iostream>\n\
