    using namespace std;\nint main() {\n    double area = 1.5;\n    area = radius\
    \ * radius;\n    cout << area;\n}\n```\n```cpp\ndouble area = 1.5;\narea = radius\
    \ * radius;\ncout << area;\n```\n\n## C++ on Linux\n\n## Data Types\n\nVariables,\
    \ as you've seen, store information that the programmer can then call up, and\
    \ manipulate if required. Variables are simply reserved memory locations that\
    \ store the values the programmer assigns, depending on the data type used.\n\n\
    ## THE VALUE OF DATA\n\nThere are many different data types available for the\
    \ programmer in C++, such as integer, float, Boolean and so on. It is widely accepted\
    \ that are seven basic types, often called Primitive Built-In; however you can\
    \ create your own data types should need arise within your code.\n\n| Type | Command\
    \ |\n|---|---|\n| Integer | int |\n| Floating Point | float |\n| Character | char\
    \ |\n| Boolean | bool |\n| Double Point | double |\n| Wide Character | wchar_t\
    \ |\n| No Value | void |\n\nThese basic types can be extended using the following\
    \ modifiers: Long, Short and Signed. Basically this means the modifiers can expand\
    \ the minimum and maximum range values for each data type. For example, the int\
    \ data type has a default value of -2147483648 to 2147483647, a fair value, would\
    \ you agree?\n\nNow, if you use one of the modifiers, the alters:\n\n- Unsigned\
    \ int = 0 to 4294967295\n- Signed int = -2147483648 to 2147483647\n- Short int\
    \ = -32768 to 32767\n- Unsigned short int = 0 to 65535\n- Signed short int = -32768\
    \ to 32767\n- Long int = ... (truncated) ...\n- Unsigned long int = 0 to 4294967295\n\
    \nNaturally you can use any of the basic type with the modifier, as there is plenty\
    \ range provided with each data type. However, it's considered C++ programming\
    \ practice to use the modifiers when possible.\n\nThere are issues when using\
    \ the modifiers. Double represents a double-floating point, which can yield incredibly\
    \ accurate numbers but these are only up to the fifteenth decimal place. This\
    \ is also the problem when displaying numbers in C++, in that function, can be\
    \ by only outputs the first few decimal places.\n\nadding a cout.precision() function\
    \ and adding a value inside the brackets then you're still limited by the accuracy\
    \ of the double data type. For example, this could be:\n\n```cpp\n#include <iostream>\n\
