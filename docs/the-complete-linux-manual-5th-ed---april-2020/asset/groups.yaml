    # # Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is to help you work, inspire or feature the company logo. Whatever
    your reasons for having your own desktop, here''s how it''s done.


    # YOUR DESKTOP


    Linux is probably one of the customisable operating systems there is. With just
    a few tweaks, one or two extras installed and so imagination, you can create something
    incredible.


    +   **STEP 1** The first aspect of desktop customisation is to change the wallpaper.
    Right-click the desktop and choose Desktop Background. This opens the Background
    in Linux Mint; remember, other distributions may present their background, wallpaper
    selection tools differently.


    +   **STEP 3** You just need to click the available images, from any desktop wallpaper.
    Incidentally, to have them as the wallpaper if you have images stored in another
    location on your system or network, you can add them by clicking on the Plus symbol
    at the bottom of the Backgrounds console, using the file manager to locate them.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_39_0.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_39_1.png)


    +   **STEP 2** More recent versions of Linux Mint display available backgrounds
    depending on the version the user is running. You normally get three categories
    followed by a fourth, Pictures, which are different from the others. The Pictures
    option is different because it reads the image content from the Pictures in your
    Home folder.


    +   **STEP 4** By clicking on the Settings tab you can, instead, play numerous
    images as a slideshow or change the aspect of the wallpapers to a variety of choices.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_39_2.png)'
