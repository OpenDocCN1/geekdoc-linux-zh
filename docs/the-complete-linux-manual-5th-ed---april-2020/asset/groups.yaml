- md: "\n# Creating Functions\n\nNow that you have mastered the use of variables and\
    \ user input, the next step is to tackle functions. You've already used a few\
    \ functions, such as the print command but Python enables you to define your own\
    \ functions.\n\n## FUNKY FUNCTIONS\n\nA function is a command that you enter into\
    \ Python to do something. It's a little piece of self-contained code that takes\
    \ data, works on it and then returns the result.\n\n- **STEP 1** It's not just\
    \ data that a function works on. They can do all manner of useful things: sort\
    \ data, change items from one format to another and check the length or type of\
    \ items. For example, `len()`, `list()` or `type()` is a function that's short\
