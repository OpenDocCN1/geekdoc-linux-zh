    \n- 步骤 2\n如果你遵循这个脚本的操作，根据我们已经涵盖的内容，你很快就能掌握其运行原理。WHILE、IF 和 ELSE 配合循环运行选项，并在你选择错误选项时将你回到起点。\n\
