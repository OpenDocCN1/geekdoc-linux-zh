  - '[PAGE 19]


    # # Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    #  DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC to transfer the ISO to a DVD. If you''re using Windows
    from 7 onward the process is extremely easy.


    +   * STEP 1 First locate the ISO image of Linux you''ve already downloaded. You
    will usually find it in the Downloads Folder in Windows 7, 8.1 and 10 computers,
    unless you specify a different location when saving it.


    +   * STEP 3 Right-click the Linux ISO and from the menu select Burn Disc image.
    Depending on the speed of the PC, it may take a few seconds before anything happens.
    Don''t worry much, unless it takes more than a minute, in which it might be worth
    restarting your PC and trying again. With luck, the Windows Disc image burner
    will launch.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_19_0.png)


    +   * STEP 2 Next insert a recordable DVD disc into your computer''s optical drive.
    After a few seconds, while the disc is read, Windows displays a pop-up message
    asking what to do with the newly inserted disc. Once this we''re going to use
    the built-in image burning function.


    +   * STEP 4 With the Windows Disc Image Burn dialogue box open, click on the
    ''Verify disc'' begin after burning box then. The process should take a few minutes,
    depending on the speed of your PC''s optical drive. Once it''s complete run it
    through the verification stage and when the optical drive should auto-ject the
    disc for.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_19_1.png)'
  - '[PAGE 20]


    # USB BOOTABLE MEDIA


    USB media is faster than a DVD and often more convenient, as most modern PCs don''t
    have an optical drive installed. The process of transferring the image is easy
    but you need a third-party app and a USB drive of 4GB or more.


    +   ### STEP 1

    First open a web browser and go to rufus.ie. Scroll down the page and go to a
    Heading: Download to find the latest version of Rufus. Click the link to start
    the download.


    +   ### STEP 4

    When you''re ready, click on the Start button at the bottom of the Rufus app.
    This may open a dialog box asking you to use a new version of SysLinux. SysLinux
    is a set of boot loaders, used to allow your PC to access and boot from a USB
    drive. It is click ''OK'' to continue.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_20_0.png)


    > This image uses SysLinux 6.03/201522 which also includes the features for SysLinux
    6.03/2014-10.


    As new versions of SysLinux conflict with one another, and it is worthwhile for
    Rufus to include additional files that must be downloaded from the ''Idlinux.iso''
    and ''syslinux.bin'':

    - Select ''No'' to continue


    > Note: The files will be downloaded in the current directory and will be reloaded
    if needed.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_20_1.png)


    +   ### STEP 2

    Double the downloaded Rufus executable. Select Yes to the Windows security question
    and Yes to checking for updates. With Rufus launched check that it has correctly
    identified your USB flash drive; if not, just remove and restart.


    +   ### STEP 5

    The next step is which image you want the ISO to write to the USB flash drive.
    In both methods work fine for different situations, but the recommended ISO Mode
    is the more popular. Make sure the ISO is present and click OK to continue, or
    by OK to confirm the action.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_20_2.png)


    > The image selected is an ''ISOHybrid'' image. This means it can be written either
    in ISO (copy) or DD (image) mode. Rufus will use the ISO mode, so that you have
    full access to the drive after writing.


    If you encounter issues during boot, you can try writing this image in DD mode.


    +   Please select the mode you want to use for this image:

    - Write in ISO mode (Recommended)

    - Write in DD mode


    ![](img/f8aca09bc266ba3d122c77a820ff023b_20_3.png)


    +   ### STEP 3

    At first Rufus interface can look a little confusing but dont worry, it''s quite
    simple. To begin with, click the SELECT button next to the ''Disk or ISO Image
    (select)'' pull-down menu. This launches a Windows explorer window where you can
    find and select the ISO.


    +   ### STEP 6

    The ISO is transferred to the USB flash drive. It shouldn''t take too long, depending
    on the speed of the USB drive you find. Rufus auto-opens the USB drive in Windows
    Explorer during the process; then you can worry or close it when you want. When
    the process is complete, click the Start button.


