    # 阿波罗11号


    你你知道吗……1969年7月20日被视为人类历史上的一个转折点，当时人类首次踏上了月球。那些帮助船员完成关键航行的软件当时并不存在，必须从零开始开发。麻省理工实验室的工程师们使用了一种名为“绳带内存”（Rope
    Memory）的新程序存储方法，在内存中填充了特殊版本的汇编代码。


    令人难以的是，这些代码可以在 GitHub 上免费查看。它们由一位研究人员在2003年上传，你可以通过访问 www.github.com/chrisgarry/Apollo-11/
    查看代码。留意某些代码片段，例如 `Burn`、`Baby_Burn`，特别是第 925 行，带有注释“Goodbye. Come soon.（再见，很快回来）”。


    浏览一下，看看你还能发现什么。


