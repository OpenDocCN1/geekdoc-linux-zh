- md: "\n# Creating Bash Scripts - Part 3\n\n## MORE LOOPING\n\nYou can loop over\
    \ data using the FOR, WHILE and UNTIL statements. These can be handy if you're\
    \ batching copying or running a script where a counter is needed.\n\nSTEP 1 Create\
    \ a new script called count.sh. Enter the text in the screenshot below, save and\
    \ make it executable. The script creates the variable 'count' which is at the\
    \ beginning of the script equals zero. Then if the WHILE loop is less than (the\
    \ LT part) 0 it will print the current value of the counter in the echo command.\n\
    \nSTEP 4 THE UNTIL loop works much the same as the WHILE loop does, more often\
    \ than not, in reverse. So our counting to a hundred, using UNTIL, we be: [ $count\
    \ -gt 100 ]; the difference being, until counter is greater than (the gt part)\
    \ hundred, keep looping.\n\n```bash\nFile Edit View Search Documents Help\ncount.sh\n\
    #!/bin/bash\ncount=0\nwhile [ $count -lt 100 ]; do\n  echo $count\n  count=$((count+1))\n\
    done\n```\n\nSTEP 2 Executing the script count.sh will result in the numbers 0\
    \ to 99 listing the Terminal screen; when it reaches 100 the script will end.\
    \ Modify the script with the FOR statement, it works much the same way. To use\
    \ it in our script, enter the text from the screenshot into count.sh.\n\nSTEP\
    \ 5 You're not limited to numbers to one hundred. You can, within, have whatever\
    \ set of commands you execute them as many times as you want the loop to run.\
    \ Renaming files, creating fifty folders etc. For example, this script will create\
    \ folders named Folder 1 through 10 using the FOR loop.\n\n```bash\nFile Edit\
    \ View Search Documents Help\ncount.sh\n#!/bin/bash\nfor count in {0..100}; do\n\
    \  echo $count\ndone\n```\n\nSTEP 3 The have added here for: count in {0..100};\
    \ do means FOR the variable 'count' IN the numbers from zero to one hundred, then\
    \ start the loop. The rest of the script is the same. Run this script, and the\
    \ output appear in the Terminal.\n\nSTEP 6 After the FOR statement once, we can\
    \ execute by manipulating the sequence (0..100) part. This part of the code actually\
    \ means (START..INCREMENT); if there's no increment it's just a single digit up\
    \ to the END. For example, we couple the loop to count up to 100 with two's: For\
    \ count in {0..1000..2}; do\n\n```bash\nFile Edit View Search Documents Help\n\
    count.sh\n#!/bin/bash\nfor count in {0..1000..2}; do\n  echo $count\ndone\n```\n\
    \n# Creating Bash Scripts – Part 4\n\nYou've encountered user interaction with\
    \ your scripts, asking what the user's name is and so on. You've also looked at\
    \ creating loops within the script to either count or simply do something ever.\
    \ Let's combine and expand some.\n\n## CHOICES AND LOOPS\n\nLet's bring in another\
    \ command, CHOICE, along with some nested IF and ELSE statements. Start by creating\
    \ a new script mychoice.sh.\n\n- STEP 1\nThe mychoice script is beginning to look\
    \ a lot complex. Now we have a list of four choices, three nested. The options:\
    \ Mint, and Awesome will be displayed if the user presses the correct option key.\
    \ If not, the menu will repeat, the fourth choice.\n\n```bash\n#!/bin/bash\nmychoice\n\
    echo \"Mint\"\necho \"Awesome\"\necho \"Please choose an option (1, 2 or 3)\"\n\
    read choice\nwhile [ $choice -ne 1 ] && [ $choice -ne 2 ]\ndo\n  if [ $choice\
    \ -eq 1 ]; then\n    echo \"Mint\"\n  elif [ $choice -eq 2 ]; then\n    echo \"\
    Awesome\"\n  else\n    echo \"Invalid choice $choice\"\n    echo \"Please choose\
    \ an option (1, 2 or 3)\"\n    read choice\n  fi\ndone\n```\n\n- STEP 3\nYou can,\
    \ of course, increase the number of choices but you need to make sure that you\
    \ match the number of IF statements. The script can quickly become a very busy\
    \ script to look at. This lengthy script is another way of designing a menu, this\
    \ time with a colour scheme.\n\n```bash\n#!/bin/bash\nchoice\necho \"Vanilla\"\
    \necho \"Chocolate\"\necho \"Please choose an option (1, 2, 3 or 4)\"\nread choice\n\
    while [ $choice -ne 1 ] && [ $choice -ne 2 ] && [ $choice -ne 3 ] && [ $choice\
    \ -ne 4 ]\ndo\n  if [ $choice -eq 1 ]; then\n    echo \"Mint\"\n  elif [ $choice\
    \ -eq 2 ]; then\n    echo \"Awesome\"\n  elif [ $choice -eq 3 ]; then\n    echo\
    \ \"Vanilla\"\n  elif [ $choice -eq 4 ]; then\n    echo \"Chocolate\"\n  else\n\
    \    echo \"Invalid choice $choice\"\n    echo \"Please choose an option (1, 2,\
    \ 3 or 4)\"\n    read choice\n  fi\ndone\n```\n\n- STEP 2\nIf you follow this\
    \ script you soon get the hang of what's going on, based on what we've already\
    \ covered. WHILE, IF, and ELSE, with the loop to run the options and bring you\
    \ back to the start if you pick the wrong option.\n\n- STEP 4\nYou can use the\
    \ arrow keys and Enter in the menu in this script. select is an external command\
    \ that provides feedback around the choices, and what can come up. It's a bit\
    \ beyond what we've looked at but a good idea.\n\n```\nSELECT MENU\n1. Mint\n\
    2. Awesome\n3. Vanilla\n4. Chocolate\n```\n\n## CREATING A BACKUP SCRIPT\n\nOne\
    \ of the most used examples of Bash scripting is the creation of a backup routine,\
    \ one that automates the task.\n\n| Step | Description |\n| :--- | :--- |\n| STEP\
    \ 1 | A basic backup script would look something along the lines of: ##!/bin/bash,\
    \ then tar -cvf ~/backups/backup.tgz will create a compressed file from the Documents\
    \ folder, with everything in it, and put it in |\n| STEP 2 | Preferably, we can\
    \ make the script a lot more interactive. Let's begin with defining some variables.\
    \ Enter the text in the screenshot to a new backup.sh. Note that you'll need 'source'\
    \ here instead of different options on our part |\n| STEP 3 | The previous scripts\
    \ allow you to create a Timestamp, so you know when the backup was made. You can\
    \ create a 'dest' variable, which is the folder where the backup file will be\
    \ created (~backups). You can then add a line of code to check if the ~/backups\
    \ folder exists, then it creates it |\n| STEP 4 | Once the ~/backups folder is\
    \ created, we can now create a subfolder within it at the beginning. Add mkdir\
    \ -p $dest it's in that you put the backup file to that date |\n| STEP 5 | With\
    \ everything in place, you can now enter the actual backup routine, based on the\
    \ tar command from Step 5. Combined with the variables, you have tar -cvf $dest/backup.tgz.\
    \ In the screenshot, we have added \"Now backing up...\" |\n| STEP 6 | Finally,\
    \ you can add a friendly message: echo \"Backup complete...\" The script isn't\
    \ too over-complex and can be easily included within your home, as is the home\
    \ itself |\n\n```bash\nbackup.sh\n#!/bin/bash\nclear\n# Time stamp\nday=$(date\
    \ +%d)\nmonth=$(date +%m)\nyear=$(date +%Y)\n\n# Folders\ndest=~/backups\n\nif\
    \ [ ! -d $dest ]; then\n  echo \"Backup folder does not exist! Creating it...\"\
    \n  mkdir -p $dest\nfi\necho \"Backup complete!\"\necho \"Backup done for $day$month$year\"\
    \n```\n\n```bash\nlook4.sh\n#!/bin/bash\ntarget=\nread name\nout=$(find \"$target\"\
    \ -name \"$name*\" 2>/dev/null)\nif [ \"$out\" ]; then\n  echo \"$out\"\nelse\n\
    \  echo \"No match found\"\nfi\n```\n\n# Creating Bash Scripts - Part 5\n\nSTEP\
    \ 5 When the executed script waits for input from the user, this is for the file\
    \ extension, such as jpg, mp4 and so on. It's not very friendly. Let's make it\
    \ a little friend. And echo, with echo \"Please enter the extension of the file\
    \ you're looking for: \" be read command.\n\n```bash\n#!/bin/bash\ntarget=\necho\
    \ \"Please enter the extension of the file you're looking for:\"\noutput=$(echo\
    \ $target | grep \"*$name\" 2>/dev/null)\nif [ -z \"$output\" ]; then\n  echo\
    \ \"No match found\"\nelse\n  echo $output\"\nfi\n```\n\nSTEP 8 The output from\
    \ colours.sh, of course, be mixed together, bringing different effects depending\
    \ on what you want the output to. For example, white in a red background (or blinking).\
    \ Sadly the blinking effect doesn't work on all Terminals, so you may need to\
