    # Command Line Quick Reference


    # USEFUL HELP/INFO COMMANDS


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with Linux. You might not need them every
    day, but when you do, they will be invaluable.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_80_0.png)


    +   free command displays the total amount of free used and swap memory in the
    system. For example, free -m gives the information using megabytes.


    +   sed command opens a stream editor. A stream editor is used to perform text
    transformations on an input stream: a file or input pipeline.


    +   df command displays filesystem disk usage for all partitions. The command
    df-h is probably the most useful (-h means human-readable).


    +   adduser command adds a new user to the system. Similarly, the addgroup command
    adds a new group to the system.


    +   the top command provides a real-time view of a running system. It can display
    system information, as well as a list of processes.


    +   the del command removes a user from the system. To remove the user''s files
    and home directory, you need to add the -remove-home option.


    +   uname command with the -a option provides all system information, including
    machine name, version and a few other details.


    +   the del command removes a group from the system. You cannot remove a group
    that is the primary group of users.


    +   ps command allows you to view all the processes running on the machine. Every
    operating system''s version of ps is slightly different but all do the same thing.


    +   the man command brings up the manual entry for the command, which is a great
    place to start using it.


    +   the grep command allows you to search inside a number of files for a particular
    pattern and then print matching lines. An example would be: grep blah file.


    +   the intro command is especially useful. It displays the Introduction to User
    Commands, which is a well written, fairly brief introduction to the Linux command.'
