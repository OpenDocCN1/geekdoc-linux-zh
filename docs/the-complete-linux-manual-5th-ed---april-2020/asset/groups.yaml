    # Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    ## EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - STEP 1: First, open the Python IDLE Shell and when it''s up, click on File ->
    New File. This will open a new window with Untitled as name. This is the Python
    Editor and within it you can enter the code to create your future programs.


    - STEP 2: The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and on; so, in the same vein as Sublime Editor. You
    enter the code as you would within the Shell, taking an Example from the previous
    tutorial, enter:


    - STEP 3: You can see that the same colour coding is in place in the IDLE Editor
    as is in the Shell, enabling you to understand what''s going on with your code.
    However, to execute the code you need to first save it. Press F5 and you get a
    Save... Check open.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_0.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_1.png)


    - STEP 4: Click on the OK button in the Save box and select a destination where
    you''ll save all your Python code. The destination can be a dedicated folder Python
    or just dump it wherever you like. Remember to keep a tidy drive though, help
    you out in the future.


    ```

    print("Hello everyone!")

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_2.png)

    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_3.png)


    # Saving and Executing Your Code


    STEP 5: Enter a name for your code, ''print hello'' for example, and click on
    the Button. Once the Python code is saved and executed it will be detailed in
    the IDLE Shell. In this case, the words ''Hello everyone!''


    STEP 8: Let''s extend the code and enter a few examples from the previous tutorial:


    ```python

    a=2

    b=2

    name="Dovid"

    surname="Hayward"

    print(name, surname)

    print (a+b)

    ```


    If you press F5 you will be asked to save the file, as it has been modified before.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_0.png)


    STEP 6: This is how the majority of your Python code will be conducted. Enter
    it into the Editor, F5, save the code and look at the output in the Shell. Sometimes
    things will differ, depending on whether you''ve requested a process window, but
    essentially this is the process you will use throughout this book, unless otherwise
    stated.


    If you click the OK button, the file will be overwritten with the new code entries,
    and it is not a problem with just these few lines, but if you edit a larger file,
    overwriting can become an issue. Use File > Save As Within the Editor to create
    a backup.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_1.png)

    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_2.png)

    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_3.png)


    STEP 7: If you open the file location of the saved Python code, you can see that
    it is in .py extension. Any code you create will be whatever.py and any code you
    download from the Internet Python resources will be .py. Just ensure that the
    code is written for Python 3.


    STEP 10: Now create a new code. Close the Editor, and open a new instance (File
    > New File from the Shell). Enter the following and save it as hello:


    ```python

    a="Python"

    b="15"

    c="hello!"

    print(a, b, c)

    ```

    You will use this code in the next tutorial.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_4.png)

    ![](img/f8aca09bc266ba3d122c77a820ff023b_96_5.png)


    # Executing Code from the Terminal


    Although we''re working on the GUI IDLE throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    Using the code we created in the previous tutorial, the one we named hello.py,
    let''s see how you can run code that was made in the GUI at the command line.
    Python, in Linux, comes with two possible ways of executing code via the command
    line. One of the ways is with Python 2, while the other uses Python 3 libraries
    and so on. First though, the command line or Terminal on your operating system.


    STEP 2: Just before, we''re using Raspberry Pi: Windows users need to click the
    Start button and search CMD, then click Command Line; and macOS users get access
    to their command line by clicking Go > Utilities > Terminal.


    STEP 3: Now you''re at the command line we can start Python. For Python 3 you
    need to enter the command python and press Enter. This will put you into the command
    line version of the Shell, with the right arrows as the cursor (>>).


    ## THE CODE


    STEP 4: From here you''re able to enter the code you''ve looked at previously,
    such as:


    ```python

    a=2

    print(a)

    ```

    You can see that it works exactly the same.


    ```

    File Edit Help

    pi@raspberry: $ python3

    >>> Hello World. Oct 2014, 13:31

    >>> Python (3.9.1) on linux

    >>> ''help'', ''copyright'', ''credits'' for more information.

    >>> print(a)

    2

    ```


    # Executing Code from the Terminal


    STEP 5: Now enter: exit() to leave the session and return you to the command prompt.
    Enter the file where you saved the code from the previous tutorial and list the
    available files within; hopefully you will see hello.py.


    STEP 8: The result of running Python 3 code from Python 2 is obvious. While it
    doesn''t error out in any way, the differences between the way Python 3 handles
    the Print command over Python 2, the result is not as expected. Using Sublime
    for the moment, open the hello.py


    ```

    python@raspberrypi:~/Documents/Code

    File Edit Tabs Help

    Python 3.4 (default) Oct 2014, 13:31

    [4.0.1] # "copyright", "credits" or "license" for more information.

    print(''hello'')


    exit

    exit()

    cd Documents/

    raspberrypi:~/Documents/Code/

    raspberrypi:~/Documents/Code python hello.py

    raspberrypi:~/Documents/Code hello.py

    raspberrypi:~/Documents/Code python hello.py

    raspberrypi:~/Documents/Code $

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_98_0.png)


    STEP 6: From within the same folder as the code you''re going to run, enter the
    following:


    ```

    python3 hello.py

    ```

    This will execute the code we created, which will remind you to:

    ```python

    a="Python"

    b="is"

    c="cool"

    print(a, b, c)

    ```


    STEP 9: Since Sublime Text isn''t available for the Raspberry Pi, you''re going
    to temporarily leave the Pi for the moment and use an example that you don''t
    need to use Python IDLE. With the hello.py file open, alter it to the following:


    ```python

    name=input("What is your name?")

    print("hello", name)

    ```


    C:\Users\Desktop\Documents\python-hello.py - Sublime Text (UNREGISTERED)

    File Edit Selection Find View Tools Project Preferences Help

    hello

    a="Python"

    b="is"

    c="cool"

    print(a, b, c)

    name=input("What is your name?")

    print("hello", name)

    ```


    STEP 7: Naturally, this is Python 3 code, using the syntax and layout that is
    unique to Python 3, works when you use the python3 command. If you try, same with
    Python 2 by entering:


    ```

    python hello.py

    ```


    STEP 10: Save the hello.py file and drop back to the command line. Now the newly
    saved:


    ```

    python3 hello.py

    ```

    The result will be the Original code! statement, with the added input command
    added for your name, and displaying in the content window.


    ```

    python@raspberrypi:~/Documents/Code

    File Edit Tabs Help

    Python 3.4 (default) Oct 2014, 13:31

    [4.0.1] # "copyright", "credits" or "license" for more information.

    print(''hello'')


    exit

    exit()

    cd Documents/

    raspberrypi:~/Documents/Code/

    raspberrypi:~/Documents/Code python hello.py

    raspberrypi:~/Documents/Code hello.py

    raspberrypi:~/Documents/Code python hello.py

    raspberrypi:~/Documents/Code $

    ```


