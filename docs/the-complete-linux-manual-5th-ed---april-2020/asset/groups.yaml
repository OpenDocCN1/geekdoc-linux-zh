    # 了解 Linux


    > “任何人都可以构建快速处理器。技巧是构建快速系统。”

    — Seymour Cray，工程师/超级计算机创始人


    我们在这里使用 Linux Mint 作为指南，因为它易于使用且非常适合 Windows 用户。它也是最完善、文档最好的发行版之一，并拥有丰富的配置选项。


    在本节中，我们将介绍 Linux Mint 菜单和桌面环境、它们如何工作以及你可以做什么。想创建另一个用户或发现如何在线操作？请继续阅读。


