  mdcn: '


    #在 PC 上安装 Linux


    大多数 Linux 发行版以 Live 环境（Live Environment）的形式提供。这意味着你可以从创建的 DVD 或 USB 中启动一个真实的、功能完备的发行。让我们来看看它是如何工作的，以及之后你从哪里安装
    Linux。


    ## UEFI BIOS


    统一可扩展固件接口（UEFI）用于在 PC 启动过程中识别和保护电脑。它取代了传统的 BIOS，但在安装 Linux 时可能会导致问题。


    - 步骤 1 将你的 DVD 或 USB 驱动器插入 PC，如果尚未关闭 Windows，请将其关闭。在本例中我们正在使用 USB 介质，但过程几乎完全相同。启动
    PC，并在提示时按下相应的键进入 BIOS 或设置（SETUP），例如：F2、Del 或 F12，然后。


    - 步骤 2 UEFI BIOS 有多个不同的版本，因此要涵盖所有版本可能是不可能的。你需要寻找一个详细说明“启动序列”（Boot Sequence）或“启动模式”（Boot
    Mode）的区域。在这里你可以选择关闭 UEFI 并选择“安全启动”（Secure Boot）。大多数发行版都支持 UEFI，但进入该设置的过程可能复杂。


    - 步骤 3 当 UEFI 切换到 Legacy（遗留）模式后，有两种方法进入 Live 环境。首先是通过你已经进入的 BIOS。找到“启动序列”，并将第一个启动设备从原始设置（通常是内部硬盘
    HDD 或介质）更改为：USB 介质对应“USB 存储设备”（USB Storage Device），介质对应“DVD 驱动器”（DVD Drive）。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_21_0.png)


    - 步骤 4 或者使用“启动菜单”（Boot Menu）选项。通过此（或类似功能）你可以按 F2 显示启动介质选项列表，从那里选择合适的介质。现在你可以导航到“保存并退出”（Save
    & Exit）并选择“保存更改并退出”（Save Changes and Exit）来保存 BIOS。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_21_1.png)


    # 安装 Linux


    一旦 Live 环境启动，你就可以将该发行版安装到你的电脑上。环顾四周，当你准备好时，寻找桌面上的“安装”（Install）选项。


    ### 步骤 1 只要你已连接到互联网（如果没有，请先连接）并处于 Live 环境中，双击桌面上的 Linux Mint 图标开始安装过程。其他发行版当然会显示它们的名称，但过程是一样的。准备好后点击“继续”（Continue）。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_0.png)


    ### 步骤 2 虽然大多数 Linux 发行版的安装过程非常相似，但某些版本在安装过程中会提供不同的问题。这些问题并不困难，没有什么深奥的技术，但某些如“安装第三方软件”的问题可能会让人困惑。你可以点击“继续”，但如果你不确定，请准备好连接了网络的设备以便咨询任何问题。


    ### 步骤 3 安装新操作系统时，建议擦除旧操作系统并替换为新系统。当你到达安装过程的这一阶段时，确保选择了“擦除磁盘并安装 Linux...”（Erase
    disk and install Linux...）选项。注意：这将完全清除你电脑上的 Windows 10，请确保你已备份个人文件和数据。


    ### 步骤 4 在安装过程开始之前，系统会询问你是否选择确保硬盘擦除是正确的。这是你最后一次退出的机会。如果你不介意擦除所有内容并重新开始 Linux Mint，请点击“继续”。如果你需要将文件备份到
    Linux 盘/USB，请重启并重新开始。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_1.png)


    ### 步骤 5 最终，你会被要求设置 Linux 用户名和密码。输入你的姓名（Name）开始，以及计算机名称（Computer Name，即在网络上的识别名称）。接下来选择一个用户名（Username），然后是密码（Password）。你可以点击“登录自动化”（Login
    Automation）选项，但暂时留留“进入文件夹”（Entry Folder）选项。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_2.png)


    ### 准备安装 Mint

    - 用于 Wi-Fi、Firefox、MP3 和其他媒体的第三方软件程序

    - 此复选框用于安装不带文档的项目。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_3.png)


    ### 步骤 6 安装过程可能很快，可能会有更多问题需要回答，也可能只是根据你的偏好开始安装 Linux。无论如何，你最终都可以“继续”Live 环境或“重启”到新安装的操作系统。如果你准备好使用
    Linux，请点击“立即重启”（Restart Now）。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_4.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_22_5.png)


    # 安装虚拟机环境


    虚拟机环境是一个模拟的计算机系统。通过虚拟机，你可以模拟一台标准 PC 并在上面安装任何其他操作系统，而不会影响电脑上已安装的系统。这是测试和使用 Linux
    的极佳方法，同时你仍保留 Windows 10 作为主操作系统。


    # 使用虚拟


    使用虚拟机（VM）会消耗电脑的资源：内存、硬盘空间、处理器使用等。在开始之前，确保你有足够的资源。


    - 步骤 1 在本例中我们使用 VirtualBox，因为它是最上手的环境之一。访问 virtualbox.org 并点击“下载 VirtualBox”。这将带你进入主下载页面。找到适用于你系统的主机（Windows、Mac
    或 Linux，主机即当前安装的操作系统）并点击链接下载。


    - 步骤 3 下载正确的安装包并在安装它们之前，你需要确保正在使用的电脑可以托管虚拟机。要做到这一点，重启电脑并进入 BIOS。当电脑启动时，按 F2 或相应的键进入设置（Setup）。


    '
