- md: "\n# Common Coding Mistakes\n\nWhen you start something you're inevitably going\
    \ to make mistakes, this is purely down to inexperience and those mistakes are\
    \ great teachers in themselves. However, even experts make the occasional mishap.\
    \ It is to learn from them as best as you can.\n\n## X=MISTAKE, PRINT Y\n\nThere\
    \ are many pitfalls for the programmer to be aware of, far too many to be listed\
    \ here. Being able to recognise a mistake and fix it is when you start to move\
    \ into more advanced territory, and become a better coder. Everyone makes them,\
    \ even coders over thirty years' experience. Learning from these, common mistakes\
    \ help build a better coding foundation.\n\n## SMALL CHUNKS\n\nIt would be wonderful\
