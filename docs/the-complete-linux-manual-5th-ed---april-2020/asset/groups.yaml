    \ Options > Configure IDLE 标签，你可以看到当前的命令。\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_92_1.png)\n\
    \n第 7 步 你可能注意了 IDLE 内的编码。颜色代表不同的 Python 代码元素：\n\n字体 黑色 数据\n- 绿色 字符串\n- 紫色 函数\n\
    - 橙色 命令\n\n第 10 步 Python IDLE 是一个强大的界面，如果你想知道更多关于 Shell 的信息，建议花几分钟访问 www.python.org/library/idle.html，介绍了\
