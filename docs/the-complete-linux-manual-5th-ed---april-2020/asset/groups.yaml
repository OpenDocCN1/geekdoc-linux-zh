    | 步骤 6 | 最后，你可以添加一条友好的消息：`echo \"Backup complete...\"`。脚本本身并不复杂，可以很容易包含进去。 |\n\
    \n```bash\nbackup.sh\n#!/bin/bash\nclear\n# Time stamp\nday=$(date +%d)\nmonth=$(date\
