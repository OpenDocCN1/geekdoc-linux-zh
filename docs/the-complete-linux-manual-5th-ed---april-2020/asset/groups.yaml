    # # Installing Linux on a PC


    Most Linux distributions come as a Live Environment. This means you can boot into
    an actual, fully-working distro from the DVD or USB that you created. Let''s see
    how that works and where you go installing Linux from there.


    # ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    +   STEP 1 Insert your DVD or USB drive into your PC, and if you haven''t already,
    shutdown Windows. In this instance we''re using the USB media but the process
    is virtually identical. Start the PC and when prompted the appropriate keys to
    enter the BIOS or SETUP, for example: F2, Del or F12, then.


    +   STEP 3 With UEFI turned to Legacy mode, there are two ways of booting into
    the Live Environment. First is via the BIOS you''re already in. Locate the Boot
    Sequence and change the first boot device from its original setting, usually Internal
    HDD or media, to: USB Storage Device for the usb media option, or DVD Drive for
    the media option.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_21_0.png)


    +   STEP 2 There are different versions of UEFI BIOS, so covering them all might
    be impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you have the option to turn off UEFI and choose Secure Boot.
    Most distros work with UEFI but it can be a tricky process to get into.


    +   STEP 4 Alternatively use the Boot Menu Option. With this (something similar)
    you can press F2 to display a list of boot media options, from there you can choose
    the appropriate media. Here you can now Save and Exit the BIOS by navigating to
    the Save & Exit and choosing ''Save Changes and Exit''


