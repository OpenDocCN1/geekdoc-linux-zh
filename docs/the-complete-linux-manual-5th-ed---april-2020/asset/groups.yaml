- md: "\n## C++ Comments\n\nCommenting in C++ involves using a double forward slash\
    \ '//' or a forward slash and an asterisk '*'. You've already seen some brief\
    \ examples but this is how it works.\n\nUsing the Hello World code as an example,\
    \ you can easily comment on different sections of the code using the forward slash:\n\
    \n```cpp\n//My First C++ program cout << \"Hello, world!\" << endl;\n```\n\n```cpp\n\
    helloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n  \
    \  // My First C++ program\n    cout << \"Hello, world!\" << endl;\n    cout <<\
    \ \"And greetings from C++!\";\n}\n```\n\nBe careful when commenting, especially\
    \ with block comments it's very easy to forget to add the asterisk and forward\
    \ slash and thus negate any code that falls inside the comment block.\n\n```cpp\n\
    helloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n  \
    \  // First C++ program\n    cout << \"Hello, world!\" << endl; // This outputs\
    \ the words 'Hello, world.'\n    // Comment lines\n    // without the need to\
    \ add more slashes\n    cout << \"And greetings from C++!\";\n}\n```\n\nHowever,\
    \ you can also add comments to the end of a line, to describe what you are doing:\n\
    \ncout << \"Hello, world!\" << endl; // This outputs the words 'Hello, world'.\
    \ The // endl denotes a new line.\n\nNote, you don't need to put a semicolon at\
    \ the end of a comment. This is because // marks a line that is ignored by the\
    \ compiler.\n\n```cpp\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    cout << \"Hello, world!\" << endl; // This outputs the words\
    \ 'Hello, world.' The // endl denotes a new line.\n}\n```\n\nYou can comment out\
    \ several lines by using the forward slash and asterisk:\n\n/*\n* This can comment\n\
    several lines\nwithout the need to add more slashes \n*/\n\nRemember to finish\
    \ the block comment with the opposite asterisk and slash.\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    /* My First C++\
    \ program\n    cout << \"Hello, world!\" << endl; // This outputs the words 'Hello,\
    \ world.' The // endl denotes a new line.\n    * This can comment\n    without\
    \ the need to add more slashes *\n    */\n    cout << \"And greetings from C++!\"\
    ;\n}\n```\n\nObviously if you try and build the code it errors out, complaining\
    \ of a missing curly bracket '}' to finish off the block of code. If you fix it,\
    \ it's time to go back and retry. The colour of commenting in Geany identifies\
    \ comments from code.\n\n| Symbol | helloworld.cpp |\n| --- | --- |\n| Functions\
    \ | #include <iostream> |\n| main (4) | using namespace std; |\n| Variables |\
    \ int main() { |\n| Mid (2) | // My First C++ program\ncout << \"Hello, world!\"\
    \ << endl; // This outputs the words 'Hello, world.'\n// Comment lines\n// without\
    \ the need to add more slashes\ncout << \"And greetings from C++!\"; |\n\nWith\
    \ comments, it's good practice in C++ to add an asterisk to each line of the comment\
    \ block. This also helps you remember to close the comment block before continuing\
    \ with the code:\n\n/*\n* This can comment\nseveral lines\nwithout the need to\
    \ add more slashes *\n*/\n\nThankful, Geany does this automatically but in other\
    \ IDEs.\n\n```cpp\n/* This can comment\nseveral lines\nwithout the need to add\
    \ more slashes */\n```\n\n## Variables\n\nVariables differ slightly when using\
    \ C++ as opposed to Python, you can simply state that 'a' equals 10 and a variable\
    \ is assigned. However, in C++ a variable must be declared with its type before\
    \ it can be used.\n\n## THE DECLARATION OF VARIABLES\n\nYou can declare a C++\
    \ variable by using statements within the code. There are several distinct types\
    \ of variable you can declare. Here is how it works.\n\n- STEP 1: Open up a new,\
    \ blank C++ file and enter the usual code headers:\n- STEP 2: Start creating two\
    \ variables, a and b, with having one value of 10 and the other 5. Use the data\
    \ type int to declare these variables. Within the curly brackets:\n```cpp\nint\
    \ a;\nint b;\na = 10;\nb = 5;\n```\n- STEP 3: You can build and run the code but\
    \ it won't do much, other than store the variables 10 and 5 to the integers a\
    \ and b. Ignore the variables set not used, the code still works. To output the\
    \ contents of the variables, add:\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n}\n```\n```cpp\ncout << a;\ncout << \"\\n\";\ncout << b;\n\
    ```\nThe cout << \"\\n\"; part simply a new line between the output of 10 and\
    \ 5.\n\n- STEP 4: Naturally you can declare a new variable, call it and output\
    \ some simple arithmetic:\n```cpp\nint result;\nresult = a + b;\ncout << result;\n\
    ```\nInsert the above code as per the screenshot.\n\n```cpp\nVariables.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    int a;\n    int b;\n   \
    \ a = 10;\n    b = 5;\n    cout << a;\n    cout << \"\\n\";\n    cout << b;\n\
    }\n```\n- STEP 5: You can assign a value to a variable as soon as you declare\
    \ it. The code you typed could look like this, instead:\n```cpp\nint a = 10;\n\
    b = 5;\nint result = a + b;\n```\n```cpp\ncout << result;\n```\n- STEP 6: Specific\
    \ to C++, you can also use the following to assign values to a variable as you\
    \ declare them:\n```cpp\nint a = 10;\nb = 5;\nint result = a + b;\n```\n- STEP\
    \ 7: You can create global variables, which are declared outside of any function\
    \ and used within the code. For example:\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint result = 3;\n```\n```cpp\nint main() {\n    result = 1;\n    cout\
    \ << result;\n}\n```\n- STEP 8: The previous steps create the variable, which\
    \ is a global variable. In a game, the variables go up or down on how well they\
    \ are doing. When the restarts the game, it returns to its default of 3. Here\
    \ we assigned lines, subtracting and adding.\n```cpp\nVariables.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    int result = 3;\n    cout\
    \ << result;\n}\n```\n- STEP 9: The modern C++ compiler is far more intelligent\
    \ than programmers give credit for. While there are many data types you can declare\
    \ for variables, you can in fact use its:\n```cpp\nint a = 10;\nb = 5;\nint result\
    \ = a + b;\n```\n```cpp\nVariables.cpp\n#include <iostream>\nusing namespace std;\n\
