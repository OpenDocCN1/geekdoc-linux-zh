  mdcn: "\n# 创建 Bash 脚本 - 部分 3\n\n## 更多循环\n\n你可以使用 FOR、WHILE 和 UNTIL 语句来遍历数据。当你需要批量复制或运行需要计数器的脚本时，这些语句会非常有用。\n\
    \n步骤 1 创建名为 `count.sh` 的新脚本。输入下方截图中的文本，保存并赋予其执行权限。该脚本在开头创建了一个变量 `count` 并将其赋值为零。然后，如果\
    \ WHILE 循环小于 0（LT 部分），它将在 `echo` 命令中打印计数器的当前值。\n\n步骤 4 UNTIL 循环的工作原理与 WHILE 循环非常相似，但在大多数情况下，它是反向的。因此，我们使用\
    \ UNTIL 计数到一百的写法是：`[ $count -gt 100 ]`；区别在于，在计数器大于（gt 部分）一百之前，保持循环。\n\n```bash\n\
    File Edit View Search Documents Help\ncount.sh\n#!/bin/bash\ncount=0\nwhile [\
    \ $count -lt 100 ]; do\n  echo $count\n  count=$((count+1))\ndone\n```\n\n步骤 2\
    \ 执行脚本 `count.sh` 将导致终端屏幕显示 0 到 99 的数字；当达到 100 时，脚本将结束。使用 FOR 语句修改脚本，其工作原理类似。要在我们的脚本中使用，请将截图中的文本输入\
    \ `count.sh`。\n\n步骤 5 你并不局限于数字到一百。你可以在循环中执行任何命令集，执行次数取决于你希望循环运行多少。重命名文件、创建五个文件夹等。例如，此脚本将使用\
    \ FOR 循环创建从 Folder 1 到 Folder 10 的文件夹。\n\n```bash\nFile Edit View Search Documents\
    \ Help\ncount.sh\n#!/bin/bash\nfor count in {0..100}; do\n  echo $count\ndone\n\
    ```\n\n步骤 3 在这里添加的 `for: count in {0..100}; do` 意味着对于变量 `count` 在从零到一百的数字中的每一个值，开始循环。脚本的其他部分相同。运行此脚本，输出将出现在终端中。\n\
    \n步骤 6 在使用过一次 FOR 语句后，我们可以通过操作序列 `(0..100)` 部分来执行。这部分代码实际上意味着 `(起始..增量)`；如果没有增量，它只是从单个数字增加到结束值。例如，我们将循环设置为计数到1000\
    \ 且步长为2：`For count in {0..1000..2}; do`\n\n```bash\nFile Edit View Search Documents\
    \ Help\ncount.sh\n#!/bin/bash\nfor count in {0..1000..2}; do\n  echo $count\n\
    done\n```\n\n# 创建 Bash 脚本 – 部分 4\n\n你已经遇到过脚本与用户交互的情况，例如询问用户的姓名等。你还查看了在脚本内部创建循环来计数或简单地执行某些操作。让我们结合并扩展一些内容。\n\
    \n## 选择与循环\n\n让我们引入另一个命令 `CHOICE`，以及一些嵌套的 IF 和 ELSE 语句。首先创建一个新脚本 `mychoice.sh`。\n\
