    ## WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user a choice of versions of the distro: Cinnamon, MATE
    and Xfce. While that may sound a little confusing for the newcomer, each of the
    versions contains the same core Linux structure and kernel, the kernel is the
    core of the operating system, handles all the instructions between the software.


    Each version is simply a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
