  - "[PAGE 130]\n\n# C++ Comments\n\nCommenting in C++ involves using a double forward\
    \ slash '//' or a forward slash and an asterisk '*'. You've already seen some\
    \ brief examples but this is how it works.\n\nUsing the Hello World code as an\
    \ example, you can easily comment on different sections of the code using the\
    \ forward slash:\n\n```\n//My First C++ program << \"Hello, world!\"\\n\n```\n\
    \n```\nhelloworld.cpp x\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    // My First C++ program\n    cout << \"Hello, world!\"\\n;\n    cout\
    \ << \"And greetings from C++!\";\n\nn\n```\n\nBe careful when commenting, especially\
    \ with block comments it's very easy to forget to add the asterisk and forward\
    \ slash and thus negate any code that falls inside the comment block.\n\n```\n\
    helloworld.cpp x\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    // First C++ program\n    cout << \"Hello, world!\"\\n; // This outputs the\
    \ words 'Hello, world.'\n    // Comment lines\n    // without the need to add\
    \ more slashes\n    cout << \"And greetings from C++!\";\n\n\n```\n\nHowever,\
    \ you can also add comments to the end of a line, to describe what you are doing:\n\
    \ncout << \"Hello, world!\"\\n; // This outputs the words 'Hello, world'. The\
    \ //n denotes a new line.\n\nNote, you don't need to put a semicolon at the end\
    \ of a comment. This is because // marks a line that is ignored by the compiler.\n\
    \n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"Hello, world!\"\\n; // This outputs the words 'Hello, world.'\
    \ The //n denotes a new line.\n}\n```\n\nYou can comment out several lines by\
    \ using the forward slash and asterisk:\n\n> * This can comment\nseveral lines\n\
    without the need to add more slashes *\n\nRemember to finish the block comment\
    \ with the opposite asterisk and slash.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    /* My First C++ program\n    cout <<\
    \ \"Hello, world!\"\\n; // This outputs the words 'Hello, world.' The //n denotes\
    \ a new line.\n    * This can comment\n    without the need to add more slashes\
    \ *\n    */\n    cout << \"And greetings from C++!\";\n}\n```\n\nObviously if\
    \ you try and build the code it errors out, complaining of a missing curly bracket\
    \ '}' to finish off the block of code. If you fix it, it's time to go back and\
    \ retry. The colour of commenting in Geany identifies comments from code.\n\n\
    | Symbol | helloworld.cpp |\n| --- | --- |\n| Functions | #include <iostream>\
    \ |\n| main (4) | using namespace std; |\n| Variables | int main() {\n| Mid (2)\
    \ | // My First C++ program\ncout << \"Hello, world!\"\\n; // This outputs the\
    \ words 'Hello, world.'\n// Comment lines\n// without the need to add more slashes\n\
    cout << \"And greetings from C++!\";\n\n\nWith comments, it's good practice in\
    \ C++ to add an asterisk to each line of the comment block. This also helps you\
    \ remember to close the comment block before continuing with the code:\n\n> *\
    \ This can comment\nseveral lines\nwithout the need to add more slashes *\n\n\
    Thankful, Geany does this automatically but in other IDEs.\n\n```\n/* This can\
    \ comment\nseveral lines\nwithout the need to add more slashes */\n```"
