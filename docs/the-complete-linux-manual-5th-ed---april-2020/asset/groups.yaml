    # # How to Set Up Python in Linux


    While the Raspberry Pi''s operating system contains the latest, stable version
    of Python, other linux distros don''t come with Python 3 preinstalled. If you''re
    not going down the Pi route, then here''s how to check and install Python for
    Linux.


    # ## PYTHON GENUIN


    Linux is such a versatile operating system that it''s often difficult to nail
    down one way of doing something. Different distributions go about installing software
    in different ways, so we''re sticking with Linux Mint for this particular tutorial.


    +   - STEP 1: First need to ascertain which version of Python is currently installed
    in your Linux system. To begin, with drop into a Terminal session from your distro
    or hit Ctrl+Alt+T keys.


    +   - STEP 3: In our case we have both Python 2 and 3 installed; as long as Python
    3.x.x is installed, then the code in our tutorials will be worth checking to see
    if it has been updated with the latest versions, so enter: `sudo apt-get update
    && sudo apt-get upgrade` to update the system.


    ```

    david@david-Mint: ~$

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_89_0.png)


    +   - STEP 2: Next enter `python --version` in the Terminal. You should have the
    output showing version 2.x of Python. By default, most linux distros come with
    Python 2 and 3, so there''s plenty of code out still available for Python 2. Now
    enter: `python3 --version`.


    +   - STEP 4: Once the update and upgrade completes, enter `python3 --version`
    to see if Python 3 is updated or even installed; as long as you have Python 3,
    you''re running the most recent version. The numbers after the 3 indicate patches
    and updates. If they''re unnecessary but check for new elements.


    ```

    david@david-Mint: ~$ python --version

    Python 2.7.15

    david@david-Mint: ~$ python3 --version

    Python 3.0.7

    david@david-Mint: ~$

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_89_1.png)


