    \ on the situation.\n\n+   **STEP 1** You're working within the Terminal and a\
    \ text editor throughout the coming pages. There are alternatives to the text\
    \ editor, we'll look at in a moment but for the sake of ease, we will be doing\
    \ examples ined. Before you begin, however, run through the custom update check:\
