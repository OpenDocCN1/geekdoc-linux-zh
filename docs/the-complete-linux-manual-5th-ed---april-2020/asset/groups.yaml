- md: "\n# Creating Bash Scripts – Part 1\n\nSTEP 5 Let's start with a simple script\
    \ to output something to the Terminal. Enter xed create a file called helloworld.sh.\
    \ In Xed, this will launch Xed and create a file called helloworld.sh. Enter the\
    \ following: #!/bin/bash, then on a new line: Hello World!\n\nSTEP 8 When you\
    \ enter ls again, you can see that the helloworld.sh has now turned from black\
    \ to green, meaning that it's not an executable file. For the script, in other\
    \ words it does the things you've typed into it, run ./helloworld.sh.\n\n```\n\
    File Edit View Search Terminal Help\ndaviddavid-mint --scripts xed helloworld.sh\n\
    daviddavid-mint --scripts []\n```\n\n```\nFile View Search Tools Documents Help\n\
    \  * helloworld.sh\n  #!/bin/bash\necho Hello World\n```\n\n```\nFile Edit View\
    \ Search Terminal Help\ndaviddavid-mint --scripts xed helloworld.sh\ndaviddavid-mint\
    \ --scripts chmod +x helloworld.sh\nhelloworld.sh\ndaviddavid-mint --scripts --ls\n\
    helloworld.sh\ndaviddavid-mint --scripts ./helloworld.sh\nHello Me World\n```\n\
    \nSTEP 6 #!/bin/bash line tells the system what you're going to be, in this case\
    \ Bash. The (#) denotes a comment line, which is ignored by the system, the (!)\
    \ (!) means permissions, and will force the script to execute the line as a command.\
    \ This is also known as a Hash-Bang.\n\nSTEP 9 Although it's not exciting, the\
    \ 'Hello World!' will now be displayed in the Terminal. The echo command is responsible\
    \ for responding with the other parts of the Terminal, as we move on you can use\
    \ the echo command output to other screens.\n\n```\nFile Edit View Search Tools\
    \ Documents Help\n  * helloworld.sh\n  #!/bin/bash\necho Hello World\n```\n\n\
    ```\nFile Edit View Search Tools Documents Help\n* helloworld.sh\n  #!/bin/bash\n\
    helloworld.sh\nhelloworld\nhelloworld World\necho Hello World! This is my first\
    \ script in Linux Mint\n```\n\nSTEP 7 You can save this file, clicking File >\
    \ Save, and exit back to the Terminal. Enter ls, will reveal the script in the\
    \ file. To make it executable, and able to run, you need to modify permissions.\
    \ Do this with chmod +x helloworld.sh. You should do this with every script you\
    \ create.\n\nSTEP 10 Think of echo as the BASIC PRINT command. It will display\
    \ either text, or variables that are stored in the system, such as the current\
    \ date. Try this: echo Hello World! Today is $(date +%A)\n\n```\nFile Edit Search\
    \ Terminal Help\ndaviddavid-mint --scripts xed helloworld.sh\ndaviddavid-mint\
    \ --scripts --ls\nhelloworld.sh\ndaviddavid-mint --scripts chmod +x helloworld.sh\n\
    daviddavid-mint --scripts []\n```\n\n```\nFile View Search Tools Documents Help\n\
    \  * helloworld.sh\nHello World Today is Monday\nhelloworld.sh []\necho Hello\
    \ World! Today is $(date)\n```\n\n# Creating Bash Scripts – Part 2\n\nPreviously\
    \ we looked at creating your first Bash script, Hello World, and adding a system\
    \ variable. Now you can expand these and see what you can do when you start to\
    \ play around with creating your own variables.\n\n## VARIABLES\n\nJust in every\
    \ other programming language a Bash script can store and call certain variables\
    \ from the system, either generic or user created.\n\n- **STEP 1** Let's start\
    \ by creating a new script called hello.sh; xed Hello $1. Save the file and exit\
    \ Xed. ##!/bin/bash, then, echo $1. Make the script executable with `chmod +x\
    \ hello.sh`.\n\n- **STEP 3** The output will now be Hello David. Bash automatically\
    \ assigns variables for the user, which are then held and passed to the script.\
    \ `$1` holds \"David\". You can change the variable by entering something different:\
    \ `./hello.sh Mint`.\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_69_0.png)\n\n\
    - **STEP 2** As the script is now executable, run it with `./hello.sh. Now as\
    \ you probably expected 'Hello' is displayed in the Terminal. However, if you\
    \ use the command with a variable, it begins to get interesting. For example,\
    \ try `./hello.sh David`.\n\n- **STEP 4** You can rename variables. Modify the\
    \ script with the following: `surname=$1; Hello $surname`. Putting each statement\
    \ on a new line. Save the script and exit back into the Terminal.\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_69_1.png)\n\
    \n# Creating Bash Scripts - Part 2\n\nSTEP 5 When you run the script you can use\
    \ custom variables: ./hello.sh David Hayward. Naturally we define two variables\
    \ with your name; unless you're also called David Hayward. And we're just printing\
    \ the contents, let's expand the two-variable use to\n\nSTEP 8 Let's expand things\
    \ further. Create a new script in the screenshot, save it and execute it with\
    \ the chmod command. You can see that there are a few new additions to the script.\n\
    \n```\nFile Edit View Search Terminal Help\ndavid-david-mint --scripts $ ./hello.sh\
    \ David Hayward\ndavid-david-mint --scripts $ ./hello.sh Linux Mint\nHello Linux\
    \ Mint\ndavid-david-mint --scripts $\n```\n\n```\nFile Edit View Search Tools\
    \ Documents Help\ngreetings.sh\n#!/bin/bash\necho -n \"hello, what is your name?\"\
    \nread firstname\necho -n \"thank you, and what is your surname?\"\nread surname\n\
    echo Hello $firstname $surname, how are you today?\n```\n\nSTEP 6 Create a new\
    \ script called addition.sh, using the same format as before. Here we will use\
    \ firstname and secondnumber, and the echo command to output simple arithmetic\
    \ by using echo: The sum is $((firstname+$secondnumber)). Save the script, and\
    \ make it executable (chmod +x addition.sh).\n\nSTEP 9 We added a -n to the echo\
    \ command which will leave the cursor on the same line as the new line. The read\
    \ command stores the users' inputs as variables firstname and surname, to return\
    \ back later in the last echo line. And the clear command clears screen.\n\n```\n\
    File Edit View Search Tools Documents Help\naddition.sh\n#!/bin/bash\nfirstname=1\n\
    secondnumber=2\necho The sum is $((firstname+$secondnumber))\n```\n\n```\nFile\
    \ Edit View Search Terminal Help\nHello David, how are you today?\ndavid-david-mint\
    \ --scripts $\n```\n\nSTEP 7 When you run the script script we can enter two numbers:\
    \ ./addition.sh 1 2. The result will show you in the terminal 'The sum is 3'.\
    \ Try it with a few numbers and see if you can alter the script and rename it\
    \ for multiplication.\n\nSTEP 10 As a final, let's include the date variable.\
    \ The output should display the current day of the week.\n\n```\nFile Edit View\
    \ Search Tools Documents Help\ndavid-david-mint --scripts ./addition.sh 1 2\n\
    david-david-mint --scripts ./addition.sh 3 4\ndavid-david-mint --scripts ./addition.sh\
    \ 5 6\ndavid-david-mint --scripts ./multiplication.sh 2\ndavid-david-mint --scripts\
    \ $\n```\n\n```\nFile Edit View Search Tools Documents Help\ngreetings.sh\n#!/bin/bash\n\
    echo -n \"hello, what is your name?\"\nread firstname\necho -n \"thank you, and\
    \ what is your surname?\"\nread surname\nclear\necho Hello $firstname $surname,\
    \ how are you today?\n```\n\n# Creating Bash Scripts – Part 3\n\nIn the previous\
    \ pages we looked at some basic Bash scripting, which involved outputting text\
    \ to the screen, getting a user's input, storing it and outputting that to the\
    \ screen; as well as including a system variable using the Date command. Now let's\
    \ combine what you've achieved so far and introduce Loops.\n\n## IF, THEN, ELSE\n\
    \nWith most programming structures there come a time when need need loop through\
    \ the commands you've entered to create better functionality, and ultimately a\
    \ better program.\n\n- **STEP 1** Let's look at the If, Then and Else statements\
    \ now, which executed correctly, compare a set of instructions and simply work\
    \ out IF something is, THEN do something different. Create a new script greeting.sh\
    \ and enter the text in the screenshot.\n\n- **STEP 2** Greeting.sh is a copy\
    \ of greeting.sh but with a slight difference. Here we've added a loop at the\
    \ if statement. If the variable is entered to equal David the next line, the reaction\
    \ is to what happens, in case it works out to the screen 'Awesome name', followed\
    \ by the which is David.\n\n- **STEP 3** The next line, ELSE, is what happens\
    \ if the variable doesn't equal 'David'. In this case simply outputs to the screen\
    \ now your familiar 'Hello...'. The last line, the FI statement, is what will\
    \ end the loop. If you have an if command then, you will get an error.\n"
