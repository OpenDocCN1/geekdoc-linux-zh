    ![](img/f8aca09bc266ba3d122c77a820ff023b_25_2.png)


    - **步骤 4** 这一部分是你开始创建虚拟机将安装 Mint 的虚拟磁盘。默认选项“创建虚拟硬盘”（Create a virtual hard disk）正是我们正在使用的。点击“创建”（Create）继续。


