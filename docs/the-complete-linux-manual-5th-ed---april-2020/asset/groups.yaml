    ```\n\n在注释时要小心，尤其是块注释，非常容易忘记添加星号和正斜杠，从而导致注释块内的任何代码失效。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // 第一个 C++ 程序\n\
