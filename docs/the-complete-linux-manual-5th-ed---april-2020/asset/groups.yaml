    choice\necho \"Vanilla\"\necho \"Chocolate\"\necho \"Please choose an option (1,\
    \ 2, 3 or 4)\"\nread choice\nwhile [ $choice -ne 1 ] && [ $choice -ne 2 ] && [\
    \ $choice -ne 3 ] && [ $choice -ne 4 ]\ndo\n  if [ $choice -eq 1 ]; then\n   \
    \ echo \"Mint\"\n  elif [ $choice -eq 2 ]; then\n    echo \"Awesome\"\n  elif\
