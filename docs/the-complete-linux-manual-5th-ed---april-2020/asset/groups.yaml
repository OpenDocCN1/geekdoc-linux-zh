    | 蓝色 | | |\n| 浅红色 | | SyntaxError: |\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_92_2.png)\n\
    \n## 你的第一段代码\n\n基本上，你已经使用之前的教程中的 ‘Hello!’ 函数写了你的第一段代码。然而，让我们扩展一下，输入你的代码并尝试其他示例。\n\
    \n## 玩转 Python\n\n对于大多数语言来说，无论是计算机还是人类，关键都在于记忆并在正确的情况下使用正确的词汇。你不认识这些词汇，所以你需要学习它们。\n\
    \n第 1 步 如果你选择了 Python 3，请在你偏好的操作系统中重新打开它。在 Shell 中，输入以下：\n\n```python\n>>> print(\"\
    Hello\")\n```\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_93_0.png)\n\n第 2 步 正如预期，单词\
    \ Hello 出现在 Shell 中并呈蓝色文本，表示字符串的输出。它非常直观，不需要太多解释。现在尝试：\n\n```python\n>>> print(\"\
    2+2\")\n```\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_93_2.png)\n\n第 3 步 你可以看到输出不是数字\
    \ 4，而是你要求打印到 Shell 的 2+2。问号定义了输出到引号中的内容：\n\n```python\n>>> print(2+2)\n```\n\n\
    ![](img/f8aca09bc266ba3d122c77a820ff023b_93_1.png)\n\n第 4 步 你可以继续这样做，在 Shell 中打印\
    \ 2+2、4+4 等。一种简单的方法是使用变量，我们稍后会深入介绍。现在：\n\n```python\nx=2\nb=2\n```\n\n## 你的第一段代码\n\
    \n第 5 步 你在这里执行的操作为字母 a 和 b 赋值了值：2 和 2。它们现在是变量，只要它们的数字保持不变，就可以调用 Python 进行输出、加法、减法等。尝试这个：\n\
    \n第 8 步 现在添加一个姓氏：surname=\"Hayward\"\n print(surname)\n\nprint(b)\n\n```python\n\
    Python 3.4.2 (Default, Oct 19 2014, 13:21:11)\n>>> on Linux\n>>> 'copyright',\
    \ 'credits' or 'license' for more information.\n>>> type(name)\n'str'\n>>> name=\"\
    Hayward\"\n>>> print(name)\n'Hayward'\n>>> a=2\n>>> print(a*2)\n4\n>>> b=3\n>>>\
    \ print(b*2)\n6\n>>> print(a+b)\n5\n>>>\n```\n\n你拥有两个变量，名字和姓，你可以独立地打印它们。\n\n第\
    \ 6 步 最后的输出独立显示了 a 和 b 的值，因为你要求它们分别打印。如果你想把它们相加，可以使用：\n\n第 9 步 如果我们像之前一样相同的程序，使用\
    \ + 符号，名字就不会在 Shell 中正确显示。尝试它：\n\n```python\nprint(a+b)\n```\n\n## 首次启动\n\n第 5\
    \ 步 虽然它很有趣，但并不特别令人。相反，尝试这个：\n\n```python\nprint(\"Hello everyone!\")\n```\n\n\
    像之前的步骤那样进入 IDLE。\n\n第 8 步 Python IDLE 是一个舒适的环境，如果你不喜欢它的显示方式，可以通过 Options > Configure\
    \ 并点击 Highlighting 标签进行更改。然而，我们不建议这样做，因为你看到的和截图不一样。\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_92_0.png)\n\
    \n第 7 步 你可以打印不同种类的变量和 Print 函数。例如，你可以为某人的名字赋值：\n\n```python\nname=\"David\"\n\
    print(name)\n\nprint(name, surname)\n```\n\n或者，你可以自己添加空格：\n\n```python\nprint(\"\
    +\"+surname)\n```\n正如你所见，逗号的使用要简单得多。恭喜你，你刚刚迈入了 Python 世界的第一步。\n\n"
