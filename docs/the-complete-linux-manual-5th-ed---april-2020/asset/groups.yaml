    并为虚拟硬盘分配 50GB 空间。


    - **步骤 10** 点击“启动”（Start）按钮，使用“启动”窗口带有绿色箭头的按钮加载下载的 Mint ISO，然后点击“启动”进入 Linux Live
    环境。现在你可以使用标准程序安装 Linux。


