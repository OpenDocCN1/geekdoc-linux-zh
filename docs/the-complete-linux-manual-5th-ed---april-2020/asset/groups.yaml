    \nSTEP 6 Expand the code to include other conditions. Eventually, it could become\
    \ complex. We've added a condition for three-letter words:\n\n```python\nword=input(\"\
    Please enter four-letter word: \")\nif len(word) == 4:\n    print(\"is a four-letter\
    \ word. Well done.\")\nelif len(word) == 3:\n    print(\"is a three-letter word.\
    \ Try again.\")\nelse:\n    print(\"is not a four-letter word.\")\n```\n\n```\n\
