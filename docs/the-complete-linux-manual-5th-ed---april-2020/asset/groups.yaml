  - '[PAGE 33]


    # # Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    ### STEP 1 The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, Found at the bottom right of the desktop
    next to time and date. This launches the Update Manager.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_33_0.png)


    ### STEP 3 Click the OK button and you can see a couple of updates ready for installation.
    Before you update, click on the blue bar OK to switch to a Local Mirror. This
    opens the Software Sources option. In the Mirrors section, click on Main and Base
    drop-down menus and select a server closest to your current location.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_33_1.png)


    ### STEP 2 Linux Mint offers the user a three level policy approach to updates.
    Don''t Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that do not impact critical elements of the OS. Read the
    descriptions below which describe the middle, and recommended options.


    ### STEP 4 Click the Update button to Cache the cache and download the Software
    Sources window. In the Update Manager, click on the Install Updates icon and enter
    your password. The updates automatically apply themselves and relaunch Update
    Manager, this with a lot more updates. Again, click Install Updates, OK any messages
    and wait for them to finish.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_33_2.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_33_3.png)'
  - "[PAGE 34]\n\n# STEP 5\n\nThe updates are graded by level, 1 being a low level\
    \ update, level 5 being a generic stick. This is our advice; click Refresh for\
    \ any messages regarding overwriting a configuration File. With regards to the\
    \ Software Rendering and lack of drivers for non-VirtualBox users, click the Menu\
    \ and type 'driver' into the search box.\n\n# STEP 8\n\nWhen asked to accept the\
    \ changes, press Y and also when asked to configure libvd. make sure OK is highlighted\
    \ and press Enter, then Yes to your next questions. Next up, still in the Terminal:\
    \ cat /proc/sys/vm/swappiness, the result should be 60. If your computer has less\
    \ than 4GB of RAM/memory, then enter: sudo xed /etc/sysctl.conf.\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_34_0.png)\n\
    \n# STEP 6\n\nClick the Driver Manager app that appears as the result of the search\
    \ and enter your. Mint takes a moment to analyse what's available and presents\
    \ you with a selection of drivers for your detected hardware. With those graphical\
    \ problems, such as Software Rendering, opt to use the latest, recommended driver.\n\
    \n![](img/f8aca09bc266ba3d122c77a820ff023b_34_1.png)\n\n# STEP 9\n\nThis tweaks\
    \ speeds up systems with less than 4GB RAM/memory. Scroll down to the bottom of\
    \ the file you just opened and add the following lines:\n\n> # Decrease swap usage\
    \ to a more reasonable level vm.swappiness=10\n\nClick File -> Save, then click\
    \ Quit. Reboot Linux Mint and you will notice a slight hike in performance.\n\n\
    ![](img/f8aca09bc266ba3d122c77a820ff023b_34_2.png)\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_34_3.png)\n\
    \n# STEP 7\n\nNow you probably need to restart Linux Mint, so click the Menu button,\
    \ followed by the Terminal. The Terminal is found in the left-hand corner Open\
    \ the Files icon. Then open the Terminal, enter: sudo apt-get install libdvd-pkg\
    \ press Enter and type in your password. This enables DVD playback.\n\n# STEP\
    \ 10\n\nSecurity is always concern in modern digital age. While Linux Mint is\
    \ a secure system, it is advisable to always try and improve it. Click the Menu\
