- md: '

    ## Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There''s a lot more to Linux than
    you may think though.


    ## FREE AND OPEN


    Linux is a fantastic fix for those who want something different. The efficiency
    of the system, the availability of applications and stability are just a few reasons.


    The first thing you need to know is that there is no such operating called Linux.
    Linux is in fact the operating system kernel, the core component of OS. When talking
    about Linux what we, are referring to one of the many distributions, distros,
    that use the Linux kernel. You''ve probably heard of at least one of them, Ubuntu,
    Debian, Slack. Each of these distros offer something different for the user. While
    each has the Linux kernel at its core, they provide the user with a different
    looking desktop, different ways in which to use the system and get apps installed
    and a slightly different look and feel throughout the entire system. However,
    at centre lies Linux, which is why we say Linux.


    Linux works consider differently to Windows or macOS. It''s free for a start;
    free to install on as many computers as you like, free for an unlimited amount
    of time and free to use This freedom is one of the biggest draws for the developer.
    Linux can run on a Mac considerably more, a user, be a developer, gamer or someone
    who wants to use an older computer to, quickly download a distro and get working
    in matter of minutes.


    Alongside the free to use comes a level of freedom to customise and model the
    system to your own uses. Each of the available distros available on the Internet
    have a certain ''spin''


    ![](img/f8aca09bc266ba3d122c77a820ff023b_7_0.png)


    Linux is a great operating system to start coding.


    ## Why Linux?


    ![](img/f8aca09bc266ba3d122c77a820ff023b_8_0.png)


    There are thousands of free packages available for programmers under Linux. In
    that other offers increased security, a fancy looking desktop, a gaming spec or
    something directed toward students. This extensibility makes Linux a more flexible
    environment to use, with many different kinds of IDEs for the likes of Python,
    web development, C++, Java and so on; or create a base for anonymity, as a Minecraft
    server, center media, and much more.


    Another remarkable advantage for those looking to learn down is that Linux comes
    with most of the popular environments built in. Both Python and C++ are preinstalled
    in a high percentage of Linux distros, which means you can start program as soon
    as you install the system and build it for the first time.


    Generally speaking Linux doesn''t take up as many resources as Windows or macOS;
    it uses resources we mean memory, hard drive space and CPU load. The Linux could
    is much less resource-intensive, which helps those systems resources. A more efficient
    system of use means more available resources for the coding and testing environment
    and the programs you eventually create. Less use of resources means you can use
    Linux on older hardware that would normally struggle or even refuse to run the
    latest versions of Windows or macOS; so rather throw away an old computer, it
    can be reused with Linux.


    It''s not all about C++, Python or any of the other more popular programming languages
    used. Using the command line of Linux, also called the Terminal, will you to create
    Shell scripts, which are programs designed to run from the command line and are
    are mainly used to automate the user form of input and output for a certain operation.


    Finally, although there are many more advantages we can list, there are thousands
    of free programs and apps available cover nearly every aspect of computing. Known
    as packages, applications there are (at the time of working) 8,700 specific program
    applications on Linux Mint and an incredible 62,000+ features covering everything
    from Ubuntu to WWW worlds.


    Linux is, then, a great environment for programming and it''s perfectly suited
    for beginners and is continually improving and evolving. If you''re serious about
    getting into coding, or you want try out something new, give Linux a try and see
    how it works for you.


    A programming environment can be as simple or as complex as you need it to be.


    ```

    $ sudo apt-get update

    $ sudo apt-get install build-essential

    ```


    ## The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    ## GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    read the instructions carefully.


    ## LINUX MINT


    By far the most popular Linux distro (distribution) is Linux Mint. Mint began
    life back in 2006, as an alternative to the most popular, Ubuntu. Although based
    on Ubuntu''s Long Term Support, Linux Mint took a different direction and offered
    the user a better overall experience.


    Linux Mint has three main desktop environments available with each new version
    of the OS it releases. This may sound confusing at first but it''s simple. Currently,
    Linux Mint uses the Cinnamon Environment as its flagship model, but offers more
    models too.


    Cinnamon is a graphically rich environment, MATE uses less fancy, and is more
    stable on a wider variety of desktop systems, and XFCE is an extremely streamlined
    desktop environment that''s built for speed and ultimate stability.


    Throughout this till we''ll be using the Cinnamon version; however you can try
    any of the other desktop environments as you wish. In fact, I recommend that you
    spend some time trying different environments, and even different distributions,
    to see which suits you and your computer best.


    www.linuxmint.com


    ![](img/f8aca09bc266ba3d122c77a820ff023b_9_0.png)


    ## UBUNTU


