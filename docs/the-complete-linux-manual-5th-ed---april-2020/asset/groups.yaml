    \ is indented. Next, move the cursor to the beginning of:\n\n```python\nword=input(\"\
    Please enter four-letter word: \")\nword_length=len(word)\nif word_length == 4:\n\
    print(\"is a four-letter word. Well done.\")\nelse:\nprint(\"is not a four-letter\
