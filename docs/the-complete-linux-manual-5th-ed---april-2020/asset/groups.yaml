    ## Equipment You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, so even a computer that''s several years old will happily run
    this distro. However, it''s worth checking you have everything in place before
    proceeding.


    ## MINTY INGREDIENTS


    Before we start working our way through this book, here''s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see what works best for you.


    ## SYSTEM REQUIREMENTS


    The minimum system requirements for Linux Mint are as follows:

    - CPU – 700MHz

    - RAM/Memory – 512MB

    - Hard drive space – 9GB (20GB recommended)

    - Display – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    ## USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a later on but if you''re already familiar with the process, or thinking of USB
    and just gathering the hardware you need, then you''re going to need a minimum
    4GB USB drive to store the Linux Mint ISO.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_11_0.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_11_1.png)


    ## DVD INSTALLATION


    DVD installation of Linux Mint simply requires a Blank disc. Of course, you also
    need an optical drive (a DVD Writer drive) before you''re able to transfer or
    burn the ISO image to the disc.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_11_2.png)


    ## VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distros. Linux Mint works exceedingly well when used in a virtual environment
    but more on later. There are many different virtual environment apps available;
    however, VirtualBox from Oracle, is one of the easiest to install into. You can
    find the latest version at www.virtualbox.org.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_0.png)


    ## INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_1.png)


    ## MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac owners use a virtual environment, such as VirtualBox or Parallels;
    and why not macOS is a splendid operating system. If you''re wanting to breathe
    new life into an older Mac, make sure it''s an Intel CPU model and not the Power
    PC models. Beware though, it''s not as free as installing on to a PC.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_12_2.png)


    ## Desktop Environments


