    \n![](img/f8aca09bc266ba3d122c77a820ff023b_144_0.png)\n\n## 重造轮子\n\n你可能会花费几天时间试图理解某些代码以实现给定的结果，这既沮丧又耗时。虽然解决问题本身同样有成就感，但相同的代码在互联网上可见。不要尝试重造轮子，看看别人是否先做过了。\n\
