    \       print(\"is a three-letter word. Try again.\")\n    else:\n        print(\"\
    is not a four-letter word.\")\n```\n```\n\n![](img/f8aca09bc266ba3d122c77a820ff023b_112_0.png)\n\
    \n# LOOPS\n\nA loop looks similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the block of code many times, usually\
    \ with the support of a condition.\n\nSTEP 1 Let's start with a simple While statement.\
    \ If this will check to see if something is TRUE, then the indented code:\n\n\
    STEP 3 For loop is another example. It is used to loop over a range of data, usually\
    \ a list stored as variables inside squares. For example:\n\n```python\nx = 10\n\
    while x < 10:\n    print(x)\n    x = x + 1\n```\n\n```python\nwords=[\"Cat\",\
    \ \"Dog\", \"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n```\nPython\
    \ 3.8.10 (default) [Oct 19 2021, 14:33:12] on Windows 10\nFile \"test.py\", line\
    \ 1\nx = 10\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n```python\nPython\
    \ 3.8.10 (default) [Oct 19 2021, 14:33:12] on Windows 10\nFile \"test.py\", line\
    \ 1\nwords=[\"Cat\", \"Dog\", \"Unicorn\"]\nfor word in words:\n    print(word)\n\
    ```\n```\n\nSTEP 2 The difference between if and while is when while gets to the\
    \ end of the indented code, it goes back and checks the statement is still true.\
    \ In an example x is less than 10. With each loop it prints the current value\
    \ of x, then adds to that value. When x does not equal it 10, it.\n\nSTEP 4 The\
    \ loop can also be used in the countdown by the range function:\n\n```python\n\
    for x in range(1, 10):\n    print(x)\n```\n\n```\nThe x=1 isn't needed here because\
    \ the range function creates a list with the first and last numbers used.\n\n\
    ```\nPython 3.8.10 (default) [Oct 19 2021, 14:33:12] on Windows 10\nFile \"test.py\"\
