    ## Pi x Linux = The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential
    it needs a remarkable operating system. Frankly, Linux is the default and recommended
    OS of choice for the Pi, and together they make a winning team.


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of hardware that could offer more than
    just a cheap, small, computer.


    The Pi needed to be flexible with what it could do, it needed to have room to
    grow into more ambitious project concepts and ideas, and it needed to do so in
    easy-to-use fashion as possible. The goal was to create a universal learning platform,
    that students of any age could interact with while learning new concepts such
    as programming, electronics, and computing. Naturally, once the hardware was developed,
    the only choice of operating system was Linux.


    The versatility of Linux is legendary. This incredible core is so malleable that
    it can be steered toward any aspect of computing, from supercomputing to robotics,
    the space industry to more terrestrial engineering: education and science, manufacturing
    and the Internet. Think of an industry, and you will likely find a Linux somewhere
    keeping it all together.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_77_0.png)


    Raspian is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes with a collection of useful tools for coding,
    electronics, and general desktop computing duties. Alongside the apps are preloaded
    modules to help you get the most from it: programming languages you can learn
    and use, and as well as hardware modules that will enable you to use and power
    the hardware-specific items unique to the Pi. For example, there are Python modules
    that interact with the Raspberry Pi''s 40-pin GPIO, allowing you to create content
    for any of the Hardware Attached on Top Devices.


    This combination is what makes the Raspberry Pi an excellent base for operations
    to not only be coding, but also Linux in general. Raspian, being Debian-based,
    will be able to run any of the Terminal commands listed in this book, as Linux
    Mint, Mint and Ubuntu are also Debian-based. And with very little setup, you''ll
    be able to have both your regular, Windows or Mac computers, and have a Raspberry
    Pi as a headless (a powered device that doesn''t need a keyboard, mouse or monitor
    attached, as you connect to remotely) computer from which you can connect and
    learn how to use Linux and how to code.


    ## Pi x Linux = The Perfect Combination


    ## WHICH PI?


    There are several Raspberry Pi models available, with each offering something
    different from the others. The most recent Pi released is the Raspberry Pi 3 Model
    B+, and while this is slightly more expensive than some of the other examples,
    it is the most powerful and feature-rich Pi.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_78_0.png)


    Overall, it''s probably best to start experimenting with the Pi using the Pi 3
    Model B+, then moving on to one of the other models as you develop your skills
    and focus on a particular project, such as [if] you need to use one of the Pi
    Zero, with a smaller footprint and WiFi connectivity.


    - Raspberry Pi 3 Model A+

    - Raspberry Pi 3 Model B+

    - Raspberry Pi 3 Model B

    - Raspberry Pi 1 Model A+

    - Raspberry Pi Zero

    - Raspberry Pi 2 Model B

    - Raspberry Pi 1 Model B+

    - Raspberry Pi 2 Zero W


    ## BEYOND RASPBIAN


    ## PI, LINUX AND CODING


    The flexibility of the Raspberry Pi''s ARM processor means it''s capable of running
    other operating systems. Still keeping with Linux, you can install Ubuntu, Mint,
    Raspidora (a Fedora-based), Lakka, PiPie (a retro emulation distribution) and
    Arch Linux. There are also systems based on the Linux kernel, such as Android,
    Debian, and Chromium OS.


    As mentioned, the Raspberry Pi is an excellent code base, and with Linux as the
    backbone you are able to learn how to use code in many different programming languages.
    Raspberry Pi is perfectly versatile, since it is Linux and Debian-based.


    There''s Windows 10 for ARM, Raspberry Pi OS, Pi Zero, and Pi Zero W, available.
    Once you''ve finished experimenting with one, you can just work with a desktop
    version of Linux, you can hop to another on Raspberry Pi and see how that one
    works, and whether it will work for you.


    You can expand your projects with its flexibility. You can also create backup
    scripts that can access the GPIO pins on the Pi, and you are able to create controllers,
    LEDs, and even web servers with it.


    Python is one of the most popular languages for beginners, and Raspberry Pi comes
