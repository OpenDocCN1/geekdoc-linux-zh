    # # Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    it has no choice in the matter.


    # ## COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s being installed and where.


    +   * **STEP 1** Installing apps from the Terminal is relatively simple. First,
    though you need to make sure the system is up to date. Do this by opening the
    Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your
    password and accept any necessary updates.


    ```

    File Edit View Search Terminal Help

    $ sudo apt-get update && sudo apt-get upgrade

    Reading package lists......

    Building dependency tree...

    Reading state information... Done

    0 packages upgraded, 0 newly installed, 0 to remove and 0 not upgrade

    ```


    +   * **STEP 3** You need to enter y to confirm the installation, which takes
    up around 5.5MB of storage in the system. Once Stella is installed, you can see
    that Mint has automatically created the Games category in the Menu as well as
    the app shortcut.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_49_0.png)


    +   * **STEP 2** Just as you''ve seen, sudo apt-get update/upgrade and so on are
    designed to upgrade the software that''s already installed on the system. You
    do install more apps though? It first you need an app to install, so let''s use
    Stella. Enter: `sudo apt-add-repository ppa:peterlevi/ppa && sudo apt-get install
    stella`.


    ```

    File Edit View Search Terminal Help

    $ sudo apt-add-repository ppa:peterlevi/ppa

    Adding PPA ppa:peterlevi/ppa

    Contains packages for the Variety package changer

    More info: https://launchpad.net/~peterlevi/ubuntu/ppa

    Press Enter to continue or Ctrl+C to cancel.

    ```


    +   * **STEP 4** Sometimes, when installing software, you need to add the app''s
    Repository, or repo, is simply the remote server where the software is installed,
    along with all its dependencies (the libraries and books it needs to function).
    Start by typing: `sudo apt-add-repository ppa:peterlevi/ppa`. Press Enter to add
    and add the GGA (Personal Package Archive).


    ![](img/f8aca09bc266ba3d122c77a820ff023b_49_1.png)'
