    VDI 并点击“下一步”：


    - **步骤 8** 完成虚拟机的初始设置后；你现在应该可以在 VirtualBox 应用程序中看到新创建虚拟机。在今天开始之前，点击“设置”（Settings）按钮，并在通用（General）部分点击“高级”（Advanced）选项卡。使用下拉菜单，将剪贴板（Clipboard）和拖放（Drag
    ''n Drop）设置为“双向”（Directional）。


