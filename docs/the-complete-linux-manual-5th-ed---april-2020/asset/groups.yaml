    int main() {\n    // My first C++ program\n    cout << \"Hello, world!\\n\";\n\
    }\n```\n\n```cpp\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    // My first C++ program\n    cout << \"Hello, world!\\n\";\n\
