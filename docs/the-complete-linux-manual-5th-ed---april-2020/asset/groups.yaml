    \n![](img/f8aca09bc266ba3d122c77a820ff023b_143_0.png)\n\n## 用户错误\n\n用户输入往往是代码中导致崩溃的错误。例如，当用户应该输入年龄数字时，他们输入了字母。通常用户输入的内容过多会导致内部缓冲区溢出，从而导致代码崩溃。留意这些用户输入，并清楚地说明需要他们提供什么。\n\
