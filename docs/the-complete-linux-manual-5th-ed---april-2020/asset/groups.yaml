    ## 为什么选择 Linux？


    对于许多用户来说，Linux 意味着自由。摆脱其他操作系统“围墙花园”式的自由，随心所欲更改和使用操作系统的自由，以及免于任何形式的许可或付费。不过，Linux
    的意义远比你想象的要多。


    ## 免费开源


    对于那些想要尝试新事物的人，Linux 是一个极佳的解决方案。系统的效率、应用程序可用性和稳定性只是其中的原因之一。


    你首先需要知道的是，并没有一种名为 Linux 的操作系统。Linux 实际上是操作系统内核，即操作系统的核心组件。当我们谈论 Linux 时，我们指的是使用
    Linux 内核的许多发行版（distributions，简称 distros）之一。你可能至少听过其中一个：Ubuntu、Debian、Slack。这些发行版中的每一个都为用户提供了不同的特性。虽然它们都以
    Linux 内核为核心，但它们为用户提供了不同的桌面界面、不同的系统使用方法、安装应用的方法，以及整个系统中略有不同的视觉感受。然而，核心都是 Linux，这就是为什么我们称之为
    Linux 的原因。


    Linux 的工作方式与 Windows 或 macOS 不同。它从开始就是免费的；可以安装在任意数量的计算机上，时间不受限制，且免费使用。这种自由是吸引开发者的最大动力之一。Linux
    可以在 Mac 上运行得更加顺畅，且用户可以是开发者、游戏玩家，或者是想要使用旧电脑的人，他们可以快速下载一个发行版并在几分钟内开始工作。


    除了免费使用外，还提供了根据你自己的需求对系统进行定制和建模的自由。互联网上现有的每个可用发行版都有其特定的“调性（spin）”。


    ![](img/f8aca09bc266ba3d122c77a820ff023b_7_0.png)


    Linux 是一个开始编程的优秀操作系统。


    ## 为什么选择 Linux？


    ![](img/f8aca09bc266ba3d122c77a820ff023b_8_0.png)


    在 Linux 下，程序员有数千个免费软件包可供选择。而其他系统提供了更高的安全性、华丽的桌面、游戏级配置或针对学生的特性。这种扩展性使得 Linux 成为一个更灵活的环境，拥有许多适用于
    Python、Web 开发、C++、Java 等的各种 IDE；或者为匿名性（如 Minecraft 服务器、多媒体中心等）创建基础。


    对于想要学习编程的人来说，另一个显著的优势是，Linux 内置了大多数流行的环境。在很大比例的 Linux 发行版中都预装了 Python 和 C++，这意味着你一旦安装好系统并首次构建，就可以开始编写程序了。


    总的来说，Linux 占用的资源并不像 Windows 或 macOS 那么多；我们指的资源是内存、硬盘空间和 CPU 负载。Linux 内核对资源的需求要少得多，这有助于这些系统资源。更高效的系统意味着为编码和测试环境以及你最终创建的程序提供了更多可用资源。资源消耗更少意味着你可以在旧硬件上运行
    Linux，而这些硬件通常难以运行、甚至拒绝运行最新版本的 Windows 或 macOS；所以，与其扔掉旧电脑，不如用 Linux 重新利用它。


    这不仅仅关乎 C++、Python 或任何其他更流行的编程语言。使用 Linux 的命令行（也称为 Terminal 终端），你可以创建 Shell 脚本，这些脚本是设计为从命令行运行的程序，主要用于实现某些操作的用户输入输出自动化。


    最后，尽管我们还可以列出许多优势，但仍有数千个免费程序和应用程序涵盖了计算的几乎每一个方面。这些被称为软件包（packages），在本文编写时，Linux
    Mint 有 8,700 个特定的程序应用，以及涵盖从 Ubuntu 到 WWW 世界一切内容的 62,000 多项功能。


    因此，Linux 是一个优秀的编程环境，它非常适合初学者，并且不断改进和进化。如果你认真想进入编程，或者想尝试新事物，请尝试一下 Linux，看看它是否适合你。


    编程环境可以根据你的需要变得简单，也可以复杂。


    ```

    $ sudo apt-get update

    $ sudo apt-get install build-essential

    ```


    ## 最佳 Linux 发行版


    有很多版本的 Linux可用，被称为发行版（Distributions）。每个版本都有不同的理念和方法。这里有五个值得尝试的发行版，以及你可以在哪里获取它们。


    ## 开始使用 Linux


    大多数发行版的安装过程都是相似的。你从网站下载磁盘镜像，将其刻录到光盘或创建 USB 闪盘安装程序。只需务必为你的硬件选择正确的发行版，并仔细阅读说明。


    ## LINUX MINT


    迄为止最流行的 Linux 发行版是 Linux Mint。Mint 起于 2006 年，作为最流行的 Ubuntu 的替代品。虽然它基于 Ubuntu 的长期支持（LTS），但
    Linux Mint 采取了不同的方向，为用户提供了更好的整体体验。


    Linux Mint 在发布的每个新版本中都提供三个主要的桌面环境。这起初听起来可能很困惑，但其实很简单。目前，Linux Mint 使用 Cinnamon
    环境作为其旗舰模型，但也提供了更多模型。


    Cinnamon 是一个图形丰富的环境；MATE 没那么华丽，但在更多种桌面系统上更稳定；而 XFCE 是一个极精简的桌面环境，专为速度和终极稳定性而构建。


    在整个教程过程中，我们将使用 Cinnamon 版本；但你可以根据意愿尝试任何其他桌面环境。事实上，我建议你花时间尝试不同的桌面环境，看看哪个最适合你。


    www.linuxmint.com


    ![](img/f8aca09bc266ba3d122c77a820ff023b_9_0.png)


    ## UBUNTU


