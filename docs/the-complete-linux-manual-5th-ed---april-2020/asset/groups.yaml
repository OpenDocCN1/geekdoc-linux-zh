    \ Red\nDefault Yellow\nDefault Magenta\nDefault light gray\nDefault light green\n\
    Default light blue\nDefault light cyan\nDefault Default\nDefault Black\nDefault\
    \ Green\nDefault Yellow\nDefault Magenta\nDefault light red\nDefault light magenta\n\
    Default light magenta -scripts\n```\n\nSTEP 6 Here's an interesting, kind of script\
    \ using an app install, Install then the text into a new script, speak.sh.\n\n\
    ```bash\n#!/bin/bash\necho \"What is your name?\"\necho \"Thank you, and what\
    \ is your surname?\"\necho \"Hello $firstname surname, how are you?\"\n```\n\n\
    STEP 7 We're briefly putting some colours in the output for our scripts. Here's\
