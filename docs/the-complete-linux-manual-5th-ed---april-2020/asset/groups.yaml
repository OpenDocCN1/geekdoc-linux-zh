    # Saving and Executing Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for entering longer program listings. In this section you''re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    # EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    +   - STEP 1 First, open the Python IDLE Shell and when it''s up, click on File
    -> New File. This will open a new window with Untitled as name. This is the Python
    Editor and within it you can enter the code to create your future programs.


    +   - STEP 3 You can see that the same colour coding is in place in the IDLE Editor
    as is in the Shell, enabling you to understand what''s going on with your code.
    However, to execute the code you need to first save it. Press F5 and you get a
    Save... Check open.


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_0.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_1.png)


    +   - STEP 2 The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and on; so, in the same vein as Sublime Editor. You
    enter the code as you would within the Shell, taking an Example from the previous
    tutorial, enter:


    +   - STEP 4 Click on the OK button in the Save box and select a destination where
    you''ll save all your Python code. The destination can be a dedicated folder Python
    or just dump it wherever you like. Remember to keep a tidy drive though, help
    you out in the future.


    ```

    print("Hello everyone!")

    ```


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_2.png)


    ![](img/f8aca09bc266ba3d122c77a820ff023b_95_3.png)'
