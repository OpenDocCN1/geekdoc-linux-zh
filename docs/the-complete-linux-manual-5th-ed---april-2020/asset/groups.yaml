    ## 为什么选择 Python？


    环境或用户。操作系统（如 Windows、macOS 和 Linux）通常是 C++、C#、汇编和某种形式的视觉语言的组合。通常使用 C++，而网页可以使用
    HTML、Java、Python 等大量可用语言。


    Python 创建于二十六多年前，已经演变成学习如何为计算机编程的理想语言。它非常适合爱好者、狂热者、学生、教师，以及那些只需要自己之间或外部硬件与计算机本身之间创建独特交互的人。


    更通用的编程被用于创建程序、应用、软件或他们想要完成的任何事情。它们被广泛应用于所有硬件平台和几乎每个方便的应用程序中。有些比其他的快，有些比其他的更容易学习。Python
    就是其中一种通用语言。


    Python 被称为**高级语言**（High-Level language），因其精髓在于，它通过各种变量、对象、属性、子程序、循环和无数次交互与硬件及操作系统进行通信。它不像**低级语言**（Low-Level
    language）那样精简（低级语言可以直接处理内存地址、调用和寄存器），但它是随处可用且易于学习的。


