    Figure 10.6 – Sigfox coverage map


    # Sigfox security vulnerabilities


    The most common vulnerabilities on Sigfox networks are the following:


    +   - Due to the low bandwidth, some communication may be sent unencrypted. This
    presents a risk to the data being transferred.


    +   - They are susceptible to availability attacks through signal jamming (this
    can be easily achieved due to the band used).


    Now, let''s take a look at a well-known protocol that has been adopted in some
    IoT implementations. We are talking about **Bluetooth**.


    # Bluetooth


    Due to its popularity, Bluetooth has become an interesting option for IoT manufacturers,
    because it is low cost and easy to integrate with other devices.


    There is also a version called **Bluetooth Low Energy (BLE)**. This is even better
    for IoT implementations because the power consumption is considerably low.'
