- pgno: 477
  md: '# Footprinting


    This attack can be considered a more intrusive type of fingerprinting. In this
    scenario, the attack is aimed at the application, and it tries to collect a plurality
    of data such as application parameters, values, process sequences, folder structure,
    and more. This can also be considered a type of application programming interface
    (API) scanning, but it is important to highlight that this is only about discovery
    and not about exploiting the information discovered.


    # Scalping


    This automated attack is about monitoring the availability of a given product
    or service online and then performing a purchase when a given condition is met
    (for example, buy all tickets to Lida’s concert when availability = 10).


    # Sniping


    This attack is similar to scalping, with the difference being that this type of
    attack is triggered by time (last minute)—for example, place the last bet when
    time = (deadline -1).


    # Scraping


    This automated attack is about gathering information from web pages and APIs either
    by accessing these as an authenticated user (using a compromised credential) or
    even doing this without posing as an authenticated user.


    # Skewing


    The objective of this attack is to manipulate site metrics (such as click count,
    visitors, and so on), polls, reviews, and likes in order to manipulate the real
    results and gain benefit from this (reputation, fame, followers, and more). You
    can see an example of skewing in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_477_0.png)


    Figure 17.5 – Example of skewing'
  merge: -1
  img_proc: true
- pgno: 478
  md: 'As illustrated in the preceding screenshot, with this attack, the reputation
    of a given article could be manipulated.


    # Spamming


    This is a well-known attack consisting of the massive submission of emails, either
    for marketing or to distribute malware.


    # Token cracking


    This attack is aimed at discovering tokens such as coupon codes, discounts, and
    offers that are active on a given site and that can be used by the attacker.


    # Vulnerability scanning


    We already talked in depth about this automated attack, which consists of the
    identification of known vulnerabilities on a given website, API, or any other
    web resource.

    Now, let''s discover how to apply automation in cybersecurity using Python.


