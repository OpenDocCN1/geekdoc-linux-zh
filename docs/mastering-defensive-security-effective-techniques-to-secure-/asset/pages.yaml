    in the world.


    Internationally known as one of the best sources of cybersecurity news is the
    following:

    https://krebsonsecurity.com/


    They have been producing high-quality video content about cybersecurity for the
    last 15 years, including tips, hardware hacks, and news.


    A must-have bookmark for every cybersecurity pro is the **Hak5 podcast**:\https://hak5.org/pages/videos


    One of the best forums to exchange knowledge about cybersecurity is the following:

    https://security.stackexchange.com/


    But wait, there is also very good content created in other languages, such as
    Spanish! For example, you can show the *Noches de Ciberseguridad*, which every
    week brings experts from Latin America to discuss different topics regarding cybersecurity:\https://www.facebook.com/nochesdeciberseguridad/


    # Cybersecurity tools


    Here, I am summarizing a list of must-have web resources to be handy and saved
    in your favorites. We already talked about some of the resources in the book;
    however, due to their importance, it is better to highlight them here too.


    A must-have playground to test cybersecurity vulnerabilities is the following:

    https://dvwa.co.uk/


    The official Kali Linux page, including downloads, is the following:

    https://www.kali.org/


    The official website of **Nethunter** (Kali Linux for mobile devices), is the
    following:

    https://www.kali.org/get-kali/#kali-mobile


    A database with more than 40,000 exploits is the following:

    https://www.exploit-db.com/


    A subsection of exploit-db dedicated to Google hacks (dorks) is the

    https://www.exploit-db.com/google-hacking-database


    The best source of known cybersecurity vulnerabilities is the following:

    https://cve.mitre.org/index.html'
  merge: -1
  img_proc: true
- pgno: 498
  md: '476 The Master''s Compilation of Useful Resources


    I know there are many tools; this was only a highlight of some of the best tools
    covered in this book. Let''s move on to some of the most used resources that are
    related to passwords.


    # Password-related tools


    Weak passwords or bad password management practices are the cause of a big portion
    of cybersecurity breaches, so here are the must-have resources related to password
    management.


    This site was developed to determine if a given email was found in a previous
    breach and before the password must be changed and never used again: https://haveibeenwned.com/


    This website is a great resource to highlight the danger of weak passwords. This
    is especially useful in cybersecurity presentations or awareness campaigns: https://www.grc.com/haystack.htm


    Google and Microsoft multifactor authentication solutions:


    +   - https://support.google.com/accounts/answer/1066476

    - https://www.microsoft.com/en-us/security/mobile-authenticator-app


    Now, let me share with you some links regarding best practices and frameworks
    regarding cybersecurity.


    # Industry-leading best practices


    Let''s summarize the following pages about industry best practices, frameworks,
    and standards regarding cybersecurity and data security.


    # Regulations and standards


    PCI-DSS is the standard that must used by companies that deal with credit card
    information and payment data. Their official site is as follows: https://www.pcisecuritystandards.org/


    HIPAA is a US regulation designed to protect sensitive medical records of patients:
    https://www.hhs.gov/hipaa/index.html


    GDPR is a regulation created by the European Union to protect the personal data
    of their citizens: https://gdpr.eu/'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'Industry-leading best practices 477


    As mentioned previously in the book, remember that you must always research to
    find application regulations regarding your company''s location, clients, and
    the market to avoid unnecessary penalties and sanctions.


    # Cybersecurity frameworks, standards, and more


    Now, let''s close with a list of the leading frameworks, standards, and other
    must-have resources in cybersecurity.


    # NIST Cybersecurity Framework


    The most famous cybersecurity framework available is NIST: `https://www.nist.gov/cyberframework`


    # ISO 27001


    The 27001 series is a family of ISO standards related to cybersecurity: `https://www.iso/isoiec-27001-information-security.html`


    # IoT Security Foundation


    A list of publications regarding cybersecurity (including an IoT security framework)
    is designed by the IoT Security Foundation: `https://www.iotsecurityfoundation.org/best-practice-guidelines/`


    # MITRE ATT&CK Matrix


    The matrix is a curated knowledge base of adversary tactics and techniques based
    on real-world cases and observations: `https://attack.mitre.org/`


    # OWASP Top 10


    The `Open Application Security Project` (OWASP) is a nonprofit foundation aimed
    to enhance the security of web resources and apps. It is well known for the publication
    of the top 10 web application security risks: `https://owasp.org/`


    # Cybersecurity Maturity Model


    The `Enterprise Cybersecurity Maturity Model (ECM2)` enables cybersecurity professionals
    to determine the current cybersecurity level of a company in a few simple steps
    and provides guidelines on the required steps to move to the next level. You can
    register on their site to become part of the next release as a contributor or
    editor: `www.ecm2.info`'
  merge: -1
  img_proc: true
