- pgno: 34
  md: '12 A Refresher on Defensive Security Concepts


    Now, let''s take a look at everything you need to know about the most popular
    DNS attacks today.


    # DNS hijacking


    In this attack, the computer is normally affected by malware that points the computer
    to the attacker''s DNS server instead of a trusted DNS, allowing the attacker
    to control and redirect all the traffic.


    Here are some defensive measures that can be taken:


    +   * Protect endpoints against malware attacks.

    * Always check the URL of the site.

    * When possible, type the URL instead of clicking on links (especially from emails)

    * Implement DNSSEC.

    * Check and monitor the Host file for modifications.

    * You can also use this web page to check whether your DNS is compromised: https://forms.fbi.gov/check-to-see-if-your-computer-is-using-rogue-DNS.


    # Man-in-the-middle


    This attack uses the same principle as the one mentioned previously. It is about
    intercepting a DNS request and replaying it with a bogus website in response.
    To achieve this, the attacker intercepts the request between the victim and the
    real DNS to provide the user with a response to a malicious site.


    Here are some defensive measures that can be taken:


    +   * Avoid connecting to open hotspots.

    * Avoid connecting to public networks.

    * Avoid connecting to free Wi-Fi.


    # DNS router attack


    In this case, the attacker leverages a vulnerability on the router to perform
    the redirection to the malicious site.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Here are some defensive measures that can be taken:


    +   - Change the default admin and connection passwords on your network devices
    (routers, access points, and so on).

    - Keep the firmware of your network devices up to date.

    - Try purchasing network devices of known reputation (a bad quality firmware device
    may be vulnerable).


    # DNS cache poisoning


    This is very similar to DNS hijacking, but in this case, the attacker modifies
    the DNS cache to send future requests to malicious sites.


    The following diagram depicts an exemplary embodiment of a cache poisoning attack:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_35_0.png)


    Figure 1.6 – Cache poisoning attack flow


    But don''t worry, here are some defensive measures that you can take against this
    threat:


    +   - Place your DNS resolvers inside your firewall.

    - Remove unnecessary DNS resolvers to reduce risks.

    - DNS servers must be hardened to ensure all unnecessary services are removed
    (reducing the points of failure and potential vulnerabilities).

    - Use a random source point, randomize the query ID, and use random case (uppercase/lowercase)
    in domain names.

    - Flush your DNS cache macOS (Catalina):


    ```

    sudo killall -HUP mDNSResponder

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# A Refresher on Defensive Security Concepts


    +   - Flush DNS cache Windows:

    - Clear your browser cache.


    ```

    ipconfig /Flushdns

    ```


    Additionally, if you have a case exposed to external users, it is recommended
    to implement a **reboot and restore** system, in case someone changes the DNS
    locally, those values will be deleted (and restored to their original values)
    once the computer is rebooted or the user is logged out.


    # ## Domain hijacking and redirection


    This attack is aimed at web resources (web pages, web apps, and so on). Here,
    the attacker will modify the DNS on your domain registrant to send all the traffic
    aimed at your page to another server. Here, the attackers use misspelled names
    or letters that look similar to the original to fool the user into believing that
    they are accessing the real site.


    Here are the defensive measures that can be taken:


    +   - Register your domains with a trusted company.

    - Avoid registering domains with several vendors.

    - Use long random passwords for your DNS admin account (based on a password manager).


    Let''s consider an example.


    Do you think these two domains are the same: I2Cx2.com and l2C2x.com?


    They look the same, but they are not, and that is one of the tactics used on these
    types of attacks (and also in some phishing attacks) to trick the victim intos
    to exfiltrate data without detection. This exfiltration mechanism allows the attacker
    to bypass most network controls. However, this attack is very complex as it requires
    the attacker to have control over the machine where the data resides (normally
    by using a command and control malware), the internal DNS server, an external
    DNS server, and a domain.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Normal DNS query:


    ```

    C:\Users\Cesar> Nslookup mysite.com

    Server: dns.google

    Address: 8.8.8.8

    ```


    DNS tunneled query:


    ```

    C:\Users\Cesar> Nslookup company_exfiltrated_data123.com

    Server: dns.google

    ```


    ```

    *** dns.google can''t find company_exfiltrated_data123.com:

    Non-existent domain

    ```


    Here are the defensive measures that can be taken:


    +   - Set up monitors to track anomalies on DNS traffic (many of these attacks
    exponentially increase the number of DNS queries to exfiltrate large amounts of
    data)

    - Analyze DNS queries to identify anomalies.


    > DNS tunneling tools

    There are several tools for exfiltrating the data, including dns2tcp and heyoka,
    and other tools designed to sniff the content of the DNS queries, including dnshunter
    and reassemble_dns.


    Remember that this is a sample list that you can use as a baseline, but there
    are many other types of attacks I won''t mention here but will be covered later,
    for example, IoT attacks, web-based attacks, and more. However, keep in mind that
    a master should continue researching to stay up to date and always be on the lookout
    for new threats and vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Managing cybersecurity''s legendary pain: Passwords


    Passwords are probably the biggest pain for us in our job. The interesting part
    is that for the last 14 years, many experts have been saying that passwords will
    disappear, despite all the new authentication technologies, passwords are still
    around and probably stay with us for a long time. Therefore, as security experts,
    we need to constantly look for innovative ways to protect against password-based
    attacks and that''s why, in this chapter, we will review the most common types
    of attack and how to protect you and your infrastructure against them.


    # Password breaches


    Nowadays, it is becoming a very common to see a new data breach (exposing the
    emails, usernames, and passwords of millions of users to the internet) almost
    every month or week. Therefore, if you cannot control the level of security that
    other companies put on your personal data, there are some extra steps that you
    can take to prevent being impacted by those attacks.


    > Note:

    If you haven''t already done so, check whether your account has already been compromised.
    You can do this on the famous site https://haveibepwned.com and https://dehashed.com.


    One of the cool features that you can find on those pages is the ability to search
    by email, user, or even by a password. Also, those sites will tell you some very
    interesting information, such as the name of the hacks in which your data was
    exposed, username details (in case the site uses a username instead of an email),
    and the hash of the compromised passwords.


    # Defensive measures


    I was struggling to decide whether I should add this step or not (because this
    may be for a prime like you); however, I don''t add this, some people may call
    me out on this, so here it is: If your password is found on any of those sites,
    then change your passwords (all of them):


    +   - Use or enable multi-factor or multi-step authentication when available.

    - Migrate to stronger password-less solutions when available (such as Microsoft
    Authenticator).'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Managing cybersecurity''s legendary pain point: Passwords 17


    But wait, Cesar, aren''t you going to recommend password vaults? Actually no,
    because a password vault will not help you in these kinds of accounts because
    it doesn''t matter if your password is CesarRocks or I_having_a_greattimereadingthis2021
    because both will be disclosed in the same way, as a hash that may look like this:
    31b54027a2ed2299b2bd7fda556d782.


    | Tip |

    | Do you want to decode a hash? You may use a page such as https://md5hashing.net/hash,
    which uses hash matching (dictionary tables) to decode a hash. |


    # Multi-factor versus multi-step authentication


    There are still people who use these terms interchangeably, but as a master in
    security, you must know the difference.


    Multi-factor means that you are using at least two different factors during the
    authentication process. This includes the original three (something I know, something
    I have, something I am), plus two more that researchers are introducing: somewhere
    I am (this is enabled by geoposition and geofencing technologies) and my personal
    favorite, something you do (this is enabled by IoT devices).


    An example of this will be your bank asking you to move your wrist to the right
    to authenticate. This movement will be captured by the accelerometers in your
    smartwatch and that data shared by using a secure API with the bank.


    # Social engineering attacks using compromised passwords


    This is an interesting attack because it requires no technical knowledge on the
    part of the attacker, which makes this a very common and dangerous threat.'
  merge: -1
  img_proc: true
