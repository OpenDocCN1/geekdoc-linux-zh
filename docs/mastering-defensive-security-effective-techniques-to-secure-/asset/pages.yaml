    Now, it''s time to create an enterprise patching strategy.


    # Creating a patching strategy


    How many times have you heard, "This attack could be prevented if the systems
    properly patched? And the cost of those attacks was between millions of dollars
    to every bankruptcy, so here, the question is: Why is this still happening?


    Well, the answer is because patching is not as simple as it sounds.


    # The complexity of patching


