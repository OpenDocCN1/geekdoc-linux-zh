    # USB lock


    This is a very basic solution based on placing a lock mechanism to physically
    prevent the connection of new USB devices. However, this device has several downsides,
    including the following:


    +   * It has a high cost.

    * A lot of effort is required to implement it.

    * A lot of effort is required to maintain it.

    * It is not suitable for remote workers or BYOD.

