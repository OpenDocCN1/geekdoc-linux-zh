- pgno: 243
  md: '# Enhancing the protection of the server by improving your access controls
    221


    Now that you are a master with permissions on Unix systems, let''s see how we
    expand all that knowledge by leveraging Access Control Lists (ACLs) to enhance
    the security of your Unix server.


    # Enhancing the protection of the server by improving your access controls


    ACLs enable Unix administrators to apply detailed fine-tuning of permissions that
    may not be possible to achieve with the commands specified in the previous section.
    Therefore, let''s explore how to work with ACLs so that you can take advantage
    of them to enhance the application and management of permissions.


    # Viewing ACLs


    First, you can use the `getfacl {file_name}` command to see the ACL of the specified
    file.


    The following figure shows an example of a file with and without an ACL. Notice
    that, when the file has an ACL, it adds a new line with the permissions of the
    user on the ACL, in this case, the caesar user and their associated permissions
    (rwx):


    # File with no ACL | File with ACL


    ```

    kali::$ getfacl bravo

    # file: bravo

    # owner: kali

    # group: kali

    user::rw-

    group::r-

    other::r--

    kali::$ getfacl bravo

    # file: bravo

    # owner: kali

    # group: kali

    user::caesar:rwx

    group::rw-

    mask::rwx

    other::r--

    ```


    Figure 7.19 – View of the getfacl command


    You can also identify whether a file has an ACL by looking a long listing (ls
    -l):


    ```

    kali::$ ls -l

    total 44

    d-rwx-- 2 kali kali 4096 Nov 29 18:01 akira

    drwxr-xr-x 2 kali kali 4096 Nov 29 16:22 bravito

    -rw-rw--+ 1 kali 0 Nov 30 00:01 bravo

    ```


    Figure 7.20 – Listing of a file with an ACL'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The preceding figure shows that the bravo file has a + sign at the end of the
    permissions, which indicates that the file has an ACL.


    # Managing ACLs


    To set an ACL on a file, you can use the setfacl command.


    In the following example, we show the syntax of the command in which we want to
    create an ACL for the bravo file to provide rwx permissions to the cesar user:


    ```

    setfacl -m u:caesar:rw bravo

    ```


    You can create ACLs for groups using g (groups) instead of u (user). In the following
    example, you can see how we are creating an ACL for the bravo file to add read
    and write permissions to the managers group:


    ```

    setfacl -m g:managers:rw bravo

    ```


    Now, let''s explore more uses of the setfacl command.


    # Default ACL on directories


    When creating ACLs on directories, any files created within that directory will
    have default ACL inherit automatically.


    To achieve this, we are going to use the same the setfacl command but with some
    different parameters. In this example, we are creating a default ACL for the bravito
    folder to provide read access to cesar:


    ```

    setfacl -m default:u:caesar:r bravo

    ```


    The following figure shows how the bravisimo inherits the permissions of the default
    ACL we just created for the bravisimo directory:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_244_0.png)


    Figure 7.21 – Default ACL on a directory'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Now, let''s see how you can also use this command to remove an ACL.


    # # Removing ACLs


    To remove a specific ACL, use the same setfacl command, but replace the -m parameter
    with -x:


    ```

    setfacl -x u:cesar bravisimo

    ```


    The following figure shows how the ACL for the cesar user was successfully removed:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_245_0.png)


    Figure 7.22 – Removing the ACL of a user


    However, you may notice that the mask is still there, so the ACL was not completely
    removed.


    As seen in Figure 7.23, to completely remove the ACL from the bravo file, you
    need to use the following command:


    ```

    setfacl -b bravo

    ```'
  merge: -1
