- pgno: 468
  md: '# Managing the evidence (from a legal perspective)


    "We must adapt to the digital age and the chain of custody must also be maintained
    when dealing with digital evidence."


    - Lawyer, Angelith Alfaro


    As we mentioned previously, the very first step when performing forensics is to
    ensure that the data that''s collected is handled and stored properly. Otherwise,
    the data may not be admissible in a trial or other legal procedure.


    Some countries may have different regulations or frameworks that must be followed
    to use digital evidence. However, let me share some of the most common guidelines
    and regulations in regards to digital evidence that are used around the world.


    # ISO 27037


    The ISO/IEC 27037:2012 provides guidelines about identifying, collecting, acquisition,
    and preserving digital evidence.


    The last version was revised in 2018 and it allows you to identify, collect, acquire,
    and preserve data from a plurality of devices, including but not limited to, the
    following:


    +   - Digital storage (non-volatile)


    +   - Mobile devices


    +   - GPS navigation devices


    +   - Digital cameras (including CCTV)


    +   - Network devices


    If you want to find out more about this standard, you can visit their official
    site at https://www.iso.org/standard/44381.html.


    # Digital Evidence Policies and Procedures Manual


    The US National Institute of Justice created this manual in 2020 to give law enforcement
    agencies a guide for developing policies and procedures for collecting, handling,
    and processing digital evidence:


    ```

    https://nij.ojp.gov/publications/digital-evidence-policies-and-procedures-manual.

    ```'
  merge: -1
  img_proc: true
- pgno: 469
  md: 'Managing the evidence (from a legal perspective) 447


    # FBI''s Digital Evidence Policy Guide


    This is the policy that''s used by the Federal Bureau of Investigation (FBI) for
    handling, reviewing, and processing digital evidence that''s been collected during
    investigations: https://vault.fbi.gov/digital-evidence-policy-guide.


    # Regional Computer Forensics Laboratory


    The Regional Computer Forensics Laboratory (RCFL) program is a partnership between
    the FBI and other US federal, state, and local law enforcement agencies that provides
    forensic services and expertise to support law enforcement agencies in collecting
    and examining digital evidence.


    They published a Digital Evidence Field Guide aimed to serve as a guide about
    handling digital evidence property. The guide can be found here:


    https://www.rcfl.gov/file-repository/fieldguide_sc.pdf.


    # US Cybersecurity & Infrastructure Security Agency


    The Cybersecurity & Infrastructure Security Agency (CISA) published a guide to
    forensics that includes references to applicable laws in the US, as well as a
    collection of useful links regarding forensics:


    https://us-cert.cisa.gov/sites/default/files/publications/forensics.pdf.


    # RFC 3227 – Guidelines for Evidence Collection and Archiving


    The Internet Engineering Task Force (IETF) published the RFC 3227 – Guidelines
    for Evidence Collection and Archiving, which can be found at the following link:
    https://datatracker.ietf.org/doc/html/rfc3227.'
  merge: -1
  img_proc: true
