    Additionally, upper management will also benefit from implementing this type of
    security model as this enables the company to perform a better allocation of cybersecurity
    resources.


    > Tip

    Layered models were designed to work in isolation, which means that there is no
    communication between the layers. However, the latest research studies confirm
    that interconnecting the layers will improve the system as they may learn from
    the one to other to better protect against an upcoming threat.


    Keep in mind (like everything in security) that a layered model that works today
