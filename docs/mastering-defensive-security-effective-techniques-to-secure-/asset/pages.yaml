- pgno: 233
  md: 'The other types are as follows:


    +   - Regular file with different extensions such as .txt, .php, .sh, .py, and
    so on

    - 1: Symbolic link (or symlink or soft link)

    - c: char file type

    - b: Block device file


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_233_0.png)


    Figure 7.8 - Permissions for Unix


    We then have the permissions. Here, we have three letters (plus a special char)
    to represent the permissions **(read, write, execute, or disable)** for the three
    different types of user **(User, Group, or Other)**:


    +   - User: Is the owner or creator of the file or folder. By default, this indicates
    who created the file, however, this can be modified.

    - Group: This shows the permissions of the users on the specified group (as seen
    in Figure 7.7).

    - Other: This specifies the permissions of the other users who are not the owner
    (user) and are not part of the specified group.


    # Examples of permissions


    As seen in the preceding section, Unix-like systems have four types of permissions:


    +   - Read: User can open the file.

    - Write: User can modify the content of the file.

    - Execute: User can execute or run the file from the shell.

    - Disable: No permissions.


    To better understand this, let''s see how the permissions are applied:


    +   - ---: No permissions

    - -x-: Execute-only permissions

    - -w-: Write-only permissions

    - -wx: Write and execute permissions'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Hardening a Unix Server


    +   - r--: Read permissions

    - r-x: Read and execute permissions

    - rw-: Read and write permissions

    - rwx: Read, write, and execute permissions


    Now, let''s see how this will look for the different users:


    +   - rwx-xr-x: User can read, write, and execute, the group and others can only
    read and execute.

    - rwx-xr--: User can read, write and execute, the group can read and execute,
    and others can only read.


    Remember when assigning permissions, you must do it based on the **Principle of
    Least Privilege (PoLP)**.


    # Permissions in numeric mode (octal representation)


    Unix systems have a very interesting feature in which permissions can also be
    represented using numbers, which enables the system to use math to calculate the
    permissions. To do that, the system has a value for each permission:


    +   - Read: 4

    - Write: 2

    - Execute: 1


    The following figure represents how values are added to calculate permissions
    in numeric mode:


    | Permission | Read | write | execute |

    |---|---|---|---||

    | -------- | 0 | 0 | 0 | 0 |

    | --x | 1 | 0 | 0 | 1 |

    | -w- | 2 | 0 | 2 | 0 |

    | -wx | 3 | 0 | 2 | 1 |

    | r-- | 4 | 4 | 0 | 0 |

    | r-x | 5 | 4 | 0 | 1 |

    | rw- | 6 | 4 | 2 | 0 |

    | rwx | 7 | 4 | 2 | 1 |


    Figure 7.9 – Permissions in numeric mode'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Based on the --- preceding table, the permissions will now look like this:


    +   * 0 (--): No permissions

    * 1 (-x): Execute-only permissions

    * 2 (-w-): Write-only permissions

    * 3 (-wx): Write and execute permissions

    * 4 (r--): Read permissions

    * 5 (r-x): Read and execute permissions

    * 6 (rw-): Read and write permissions

    * 7 (rwx): Read, write, and execute permissions


    Over time, using numbers may be easier. However, you must be familiar with both
    representations of permissions, as some commands may input one or the other.


    # Default permissions


    When creating files, Unix systems will assign the default permissions to the newly
    created file, and as a data security professional, you must understand how permissions
    are assigned. Also, you must understand how you can customize those settings in
    case you need to apply more restricted permissions for the newly created files.


    We can see the permissions of a file using the ls -1 {file_name} command, to see
    the default permissions let''s create a new file using the touch {file_name} command,
    and then use the previous (ls -1) command to see the permissions the system assigned
    by default.


    We created an example in the following figure that shows the default permissions
    of a file in our system. In this case, the default permissions are as follows:


    +   * User (kali): Read and write

    * Group (kali): Read

    * Others: Read


    ```

    kali@kali:~$ touch bravo

    kali@kali:~$ ls -l bravo

    -rw-r-r-- 1 kali kali 0 Nov 29 12:16 bravo

    ```


    Figure 7.10 - File with no execute permissions'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Hardening a Unix Server


    You can play with the commands to get up to speed with Unix systems (create files,
    delete the files that you created, list permissions, and so on), but you can also
    play with conversions to get more familiar with the numeric mode. For example,
    you can use the permissions shown in Figure 7.10 and convert them to numeric mode
    by the table in Figure 7.9. This should give you the numeric representation of
    those permissions, which is 644.


    > Tip

    Have you noticed a case in which not even root has execute (x) permissions? If
    yes, don''t panic, as that is normal and it may just indicate that the file is
    not an executable file.


    The following figure shows an example of a file owned by root with no executable
    permissions. This, as explained, is expected because a log file is not an executable
    file:


    ```

    -rw-r--r-- 1 root 0 Nov 23 09:54 alternatives.log

    ```


    Figure 7.11 – File with no execute permissions


    So far, we have seen how permissions are applied to files. Now, it''s time to
    see how permissions work for directories (folders).


    # Permissions in directories (folders)


    Files and directories are managed differently/separately in Unix systems, which
    means also that the default permissions are configured separately. So, keep this
    in mind, as this could represent a security vulnerability if both are not configured
    properly.


    As shown in the following figure, we created a mkdir {directory_name} directory
    and we use the ls -ld command to see the default permissions assigned by the system
    to the directory:


    ```

    kalikali~$ mkdir bravito

    kalikali~$$ ls -ld bravito

    ddrwxr-xr-x 2 kali kali 4096 Nov 29 16:22 bravito

    ```


    Figure 7.12 – Unix permissions in directories (folders)


    As you can see, the permissions are very different from the default permissions
    applied to the files. Let''s make a comparison.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'My current default permissions on files (rw-r--r--) are as follows:


    +   * **User (kali):** Read and write

    * **Group (kali):** Read

    * **Others:** Read


    My current default permissions on directories (rwx-xr-x) are as follows:


    +   * **User (kali):** Read, write, and execute

    * **Group (kali):** Read and execute

    * **Others:** Read and execute


    Another important item to clarify is that *permissions are a bit different on
    directories:


    +   * **Read:** User can list the content of the directory.

    * **Write:** User can delete or create files in the directory.

    * **Execute:** User can access the directory.


    > What would happen if a user has no access to a folder but full access to a file
    inside the folder?\Just securing the folder and not the files inside is *not*
    a best practice, as the user may still access the file by using a hard link. So,
    as a best practice, always apply the proper permissions to the folder and the
    files contained within.


    # Changing default permissions with umask


    We can change the default permissions over files and directories by using the
    umask command.


    As seen in the following figure, you can type the umask command and it will tell
    you the umask value for your session:


    ```

    kalikali:~$ umask

    0022

    ```


    Figure 7.13 – Checking default permissions with umask'
