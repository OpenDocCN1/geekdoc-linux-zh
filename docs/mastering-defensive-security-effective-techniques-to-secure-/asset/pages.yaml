    in this chapter: `https://hak5.org/`


    # # Understanding physical security and associated threats


    We often invest a huge amount of time to secure our virtual environment, however,
    an attacker with physical access to our systems can easily bypass any security
    mechanisms and systems to get easy access to our systems and data.


    Therefore, it would be great for you to be familiar with the most common vulnerabilities
    or threats related to physical security that may impact your organization.


    # # The powerful LAN Turtle


    This seemingly innocent object enables an attacker to get remote access toolkits
    and man-in-the-middle attacks on a single device. The device looks like a generic
    USB to Ethernet adapter, so once it is connected, it would be difficult to spot
    it.


    The attack is very simple but ingenious. As shown in the following figure, the
    device stays in the middle of the target computer and the network, enabling access
    to the attacker to perform a plurality of remote attacks against the network and
    the computer:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_296_0.png)


    Figure 9.1 – LAN Turtle attack'
