- pgno: 247
  md: '# Configuring host-based firewalls 225


    The installation, configuration, and settings of SELinux may vary between the
    different versions of Unix, in this case, it is better to check the specific settings
    for your Unix system by visiting their official site at http://selinuxproject.org/page/Main_Page.


    OK, now that you are an expert in managing Unix permissions, it''s time to see
    how you can enhance the security of your Unix machine by leveraging host-based
    firewalls.


    # Configuring host-based firewalls


    We are all familiar with firewalls to regulate incoming and outgoing network traffic
    to prevent the entry of malicious code or attacks and to prevent the exfiltration
    of data.


    Host-based firewalls are firewall rules that can be activated at the OS level
    so that you can apply incoming and outgoing network traffic protection for your
    system.


    One feature of host-based firewalls is that they are configured per system, offering
    a higher level of flexibility when needed.


    There are several host-based firewalls for Unix systems, such as iptables, fireald,
    netfilter, ipfw, and more.


    # Understanding iptables


    iptables is used to set up, maintain, and review the tables of the IPv4 and IPv6
    packet filter rules in the Linux kernel.


    To understand iptables, we need to first understand its components.


    # Chains


    Chains are the set of rules defined for a particular task.


    iptables uses three sets of rules (chains) to manage traffic: input chains, output
    chains, and forward chains:


    +   - **Input chains**: These are the rules applied to incoming traffic from the
    network to the local machine.


    +   - **Output chains**: These are the rules applied to outgoing traffic from
    the network to the local machine.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "226 Hardening a Unix Server\n\n+   - Forward chains: These are the rules applied\
    \ to packets that are neither emitted by the host nor directed to the host. They\
    \ are the packets that the host is merely routing.\n\n# Policies\n\niptables uses\
    \ three policies or actions: Accept, Drop, Reject:\n\n+   - Accept: Traffic is\
    \ accepted and transferred to the application or systems for processing.\n- Drop:\
    \ Traffic is blocked and not processed.\n- Reject: Similar to Drop, but it sends\
    \ a return error to the host that the package was blocked.\n\n> Tip\nRules in\
    \ iptables are checked from top to bottom. So, be careful when creating and inserting\
    \ rules to avoid any accidental bypass.\n\nOK, enough theory, let's see how you\
    \ can configure them.\n\n# Configuring iptables\n\nWe need to start by checking\
    \ the current iptables with the following command:\n\n```\nsudo iptables -L\n\
    ```\n\nWhen running this command, we can see the three chains (INPUT, FORWARD,\
