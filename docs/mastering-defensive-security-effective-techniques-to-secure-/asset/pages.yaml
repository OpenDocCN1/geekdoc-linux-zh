- pgno: 60
  md: 'In this second chapter, we will cover the following main topics:


    +   * What a vulnerability assessment is and how to create one

    * The most common types of vulnerabilities

    * An overview of USB HID vulnerabilities and devices

    * The best mechanisms to keep your infrastructure protected against vulnerabilities

    * Managing cybersecurity risks like a master

    * An overview of the NIST CyberSecurity Framework

    * Creating an effective Business Continuity Plan (BCP)

    * Implementing a best-in-class Disaster Recovery Plan (DRP)


    # Technical requirements


    You can enhance your reading by using a device with internet access to check some
    of the web resources provided. However, this chapter contains all that you need
    for a full learning experience.


    # Understanding cybersecurity vulnerabilities and threats


    All systems, processes, infrastructures, and environments have vulnerabilities.
    Those vulnerabilities are normally caused by design flaws, bugs, bad implementations,
    a lack of updates, and many other causes that attackers (or threat agents) will
    leverage in order to gain access to your systems and/or cause disruption.


    > The question is not whether a system has vulnerabilities, but who will discover
    them first?


    # Performing a vulnerability assessment


    As a cybersecurity expert, you must be on the constant search for new vulnerabilities
    in order to keep your infrastructure secure.


    The process of performing this search is called vulnerability assessment.


    There are two main ways to do it. The first is to use offensive techniques (such
    as penetration testing), and the second one is more like a defensive technique
    based on the identification of known vulnerabilities on your infrastructure by
    searching for all the vulnerabilities associated with the systems and products
    that you have.'
  merge: -1
  img_proc: true
