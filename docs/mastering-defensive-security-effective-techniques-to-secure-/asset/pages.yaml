- pgno: 252
  md: '# SSH brute-force protection with iptables


    You can use the following iptables rules to block IP addresses that attempt more
    than a given number of SSH connections in X seconds. Here is an example to block
    an IP address if there are more than eight SSH connections in 45 seconds:


    ```

    iptables -A INPUT -p tcp --dport ssh -m conntrack --ctstate NEW

    -m recent --set

    iptables -A INPUT -p tcp --dport ssh -m conntrack --ctstate NEW

    -m recent --update --seconds 45 --hitcount 8 -j DROP

    ```


    Notice the first command is used to track new connections coming in on port 22
    (SSH), while the second command tells iptables to drop packets from a given IP
    address that has sent eight or more requests in 45 seconds.


    > Note

    If you want to insert these two rules at the top of your INPUT chain (to trigger
    them before the rest of yours), use -I instead of -A as the first parameter.


    Another good option is to whitelisting as this enables you to allow one or more
    IPs to access your server while dropping everything else.


    Here is the command to use this technique:


    ```

    iptables -I INPUT -p tcp -s 10.10.10.10,192.168.1.14 --dport ssh

    ssh -j ACCEPT

    iptables -I INPUT -p tcp --dport ssh -j DROP

    ```


    The preceding example will allow SSH connections ONLY from those two IP addresses
    while blocking any access from any other IP address.


    # Protecting from port scanning with iptables


    There are several ways to protect from port scanning with iptables, however, this
    is my favorite:


    ```

    iptables -N PORT-PROTECT

    iptables -A PORT-PROTECT -p tcp --syn -m limit --limit 2000/

    hour -j RETURN

    iptables -A PORT-PROTECT -m limit --limit 200/hour -j LOG

    --log-prefix "DROPPED Port scan: "

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: '```

    iptables -A PORT-PROTECT -j DROP

    iptables -A INPUT -p tcp -syn -j PORT-PROTECT

    ```


    In this example, we are assuming that there is not valid reason for a host to
    send me 200 SYN requests in 1 hour, we can use this as the security trigger parameter.
    However, you can adjust that number based on your owe judgment.


    There are many more things you can do with iptables, such as implementing rules
    for a specific port to delete a given rule. You can explore these and configure
    your iptables as needed.


    A best practice is to perform a regular check of iptables to confirm that the
    settings were not changed. A common mistake is that system owners or administrators
    may remove rules during network troubleshooting. In those cases, the root cause
    must be investigated to fix the issue, and if an iptables rule must be removed
    or disabled, you need to make sure that another control, policy, or system is
    set in place to cover that potential security gap originated by the removal of
    the iptables rule.


    # Advanced management of logs


    As you may know, logs are records of the activities or actions on a given system,
    OS, or application. They are really important as a source of truth during investigations
    to determine what can be the cost of downtime, or any other incident.


    Best practices state that all logs must be enabled to ensure that you keep track
    of everything that is happening in your system. Remember, logs are the main source
    of information during audits and forensic analysis, therefore, you need to make
    sure they are available for them.


    Additionally, nowadays, the cost of storage is really low, so it would be hard
    for you to justify that a log was deleted to save space.


    Another good practice is to keep all logs centralized on an external device, so
    in case of a full system failure or hard drive crash, you will still be able to
    retrieve the logs. Furthermore, attackers normally cover their tracks by deleting
    the logs, but having an external copy of the logs will make it harder for the
    attacker to delete their tracks from them (because the attacker will have to also
    compromise the other system where the logs are backed up or centralized).'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Leveraging the logs


    A Security Information and Event Management (SIEM) system can collect and leverage
    all those logs (data) and, after some training, configuration, and correlation,
    transform that data into useful security insights (information and knowledge).


    The value of those systems is that they can analyze huge amounts of data from
    logs (which is normally wasted) to detect patterns and uncover vulnerabilities.
    They even have the power to detect ongoing attacks (including advanced persistent
    threats).


    Another good feature of SIEM systems is that they allow you to easily find known
    signs of attacks, for example, the following signs:


    +   - Repeated failed login attempts at the same hour, every X number of days

    - An abnormal number of login attempts

    - Logins at unusual hours from unknown addresses

    - Unknown addresses trying to log in several systems

    - Login attempts with default credentials (admin/admin)


    Also, remember that you can also collect logs from other devices such as routers,
    proxies, and firewalls. These are extremely important because some of them can
    alert you about some hard-to-detect attacks, such as a zombie machine infected
    to carry out mining, DDOS attacks, and more.


    You can collect valuable information from some IoT devices and SCADA systems.
    These can provide early warnings, less-protected systems are normally the doors
    that criminals use to get into your infrastructure. Detecting this on time may
    help you to prevent them from gaining access to more valuable assets and data
    in your infrastructure.


    # Summary


    Congratulations! You are now a master in securing Unix servers, and let me tell
    you why.


    First, you learned all about Unix services, including how they work and how they
    can be managed.


    We also covered a very complex topic, Unix permissions, in a very smooth and easy
    way, including how to handle them using octal representation.


    Then, we also learned about the different types of permissions on Unix systems,
    and how to properly manage them.'
  merge: -1
  img_proc: true
- pgno: 255
