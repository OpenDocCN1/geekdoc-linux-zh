- pgno: 225
  md: '# 7 Hardening a Unix Server


    > "A hardened server drastically reduces the attack surface area, therefore minimizing
    exposure to threats. It helps to get rid of weaker default settings and to meet
    compliance."


    – Faraz Ahmad, IT security consultant


    If you are used to managing Windows systems and servers, then managing Unix-based
    systems and servers may become a very complex task. But don''t worry, we have
    your back, and we will start from the basics so that you can easily follow this
    chapter.


    Here, we will be covering the commands used in most Unix-based systems (including
    Linux). Despite the fact that there might be some differences between Unix systems,
    the structures and examples in this chapter should apply to the most common Unix
    systems (including Linux).'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In this chapter, we are going to cover the following main topics:


    +   - A complete guide to Unix services (how they work and how to manage them)

    - Permissions work on Unix systems

    - A detailed overview of the different types of permissions on Unix systems (file,
    folder, user, and so on)

    - Advanced configuration of permissions using umask

    - Enhancing your defensive security by using access controls

    - Managing access control lists

    - Configuring your host-based firewall using iptables

    - Best practices to leverage log files


    # Technical requirements


    For this chapter, it is highly recommended that you have a Unix-like system (this
    could be Kali Linux, Debian, Ubuntu, and so on). This chapter contains a lot of
    screenshots that you can see the output of the commands used. However, it will
    be of great value if you can test these commands yourself while enjoying the book.


    A very good option is to create a Virtual Machine (VM) so you can run it through
    Kali easily on your computer. In fact, you will find at the end of this chapter
    the link to the Kali Linux download page. There you can download a preconfigured
    VM, ready to open in your favorite hypervisor (VirtualBox, VMware, and so on).


    # Securing Unix services


    Services are applications that run in the background to perform or support essential
    Operating System (OS) tasks. There are also services associated with apps or services
    such as Apache, Structured Query Language (SQL), Hypertext Preprocessor (PHP),
    Remote Procedure Call (RPC), and so on.


    A lot of services are loaded and enabled by default. However, every service enabled
    and running presents a potential vulnerability that needs to be considered and
    managed.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Therefore, to reduce those risks, let''s review some of the best practices
    related to Unix services (plus some additional setup considerations).


    # Defining the purpose of the server


    A Linux server should be dedicated to a single purpose. For example, a print server,
    FTP, web server, and so on. This simple task will make hardening efforts easier.


    In the past, having dedicated servers was costly and difficult to procure. However,
    with cloud technologies, having dedicated servers for each purpose is really easy
    to create and manage will not represent a significant increase in cost.


    # Secure startup configuration


    Now that you have defined the purpose of your server, the next step is to securely
    configure the OS by removing all unnecessary applications, features, and protocols
    to avoid unnecessary risks.


    This will also reduce the effort in terms of patching because there will be fewer
    apps to patch and harden while reducing the number of attack vectors.


    # Managing services


    The first step is to determine which services are running and the current status.


    To do this, we can issue the following command:


    ```

    service --status-all

    ```


    This command will run a System V init script that shows the list of services with
    the associated status. The status is represented in brackets [ + ] means that
    the service is running, [ - ] means that the service is stopped, and [ ? ] is
    returned for services that do not return a status.'
  merge: -1
  img_proc: true
