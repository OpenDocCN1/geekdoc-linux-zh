  md: '# 9


    # # Deep Diving into Physical Security


    "With the right tools and a few seconds of physical access, all bets are off..."


    – Darren Kitchen – founder of Hak5


    Physical security is often overlooked, and as cybersecurity professionals, we
    normally avoid this responsibility. However, the truth is that a breach in physical
    security can expose our systems, and poses a huge risk to our infrastructure and
    data.


    Therefore, in this chapter we are going to learn the most dangerous vulnerabilities
    of physical security, but also a set of controls and methods to reduce those risks.


    Here are the details of the topics that we will be covering in this chapter:


    +   - A deep dive into the most dangerous tools and attacks in physical security,
    including the following: the powerful LAN Turtle, the stealthy Plunder Bug LAN
    Tap, the dangerous Packet Squirrel, the portable Shark Jack, the amazing Screen
    Crab, the advanced Key Croc, and other USB threats

    - An exploration of the risks and costs associated with equipment theft (and why
    we must prevent them)

    - A definition of the types of physical control available

    - A list of best practices related to access controls'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   * An overview of a very cool technology for visitors control – auto-expiring
    badges

    * An introduction to your best ally in physical security: the clean desk policy

    * A review of the best practices when conducting physical security audits


    # # Technical requirements


    You don''t need any extra software or hardware to enjoy this chapter, however,
    it would be great if you can test the devices that we review here so can get familiar
    with them (the better you know the enemy''s tools, the better you can defend against
