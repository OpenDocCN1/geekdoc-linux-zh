    # Windows Server Security documentation


    Here, you can find additional documentation (including videos) about several layers
    of protection built into the OS to keep the servers protected against security
    breaches and malicious attacks, and to keep the data and infrastructure security:
    https://docs.microsoft.com/en-us/windows-server/security/security-and-assurance.


    Now that you have learned everything there is to know about Windows Server Security,
    it''s time to start learning how to enhance the security of all your Windows workstations
    in your infrastructure.


    # Mastering endpoint security


    Most of the best practices we reviewed for servers are also applicable to workstations,
    so instead of repeating them, let''s review some additional security mechanisms
    and tools that are specifically applicable to workstations.


    # Windows updates


    We already talked about the importance of patching the OS; however, I want to
    distribute updates to your workstations. There is a great step-by-step guide created
    by Microsoft that shows you how to configure it: https://docs.microsoft.com/en-us/windows/deployment/update/waas-manage-updates-wsus.'
  merge: -1
