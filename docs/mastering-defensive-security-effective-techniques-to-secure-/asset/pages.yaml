- pgno: 154
  md: '# Phishing in numbers


    Phishing is the most common type of social engineering. In fact, Verizon’s Data
    Breach Investigations Report 2019 showed that more than 30 percent of confirmed
    data breaches were associated with phishing attacks. On the other hand, global
    losses for vishing attacks are estimated at $46 billion.


    As you can see, attackers are good at finding new and clever ways to expand or
    evolve their attacks, so you must stay up to date to uncover any new and potential
    variation of phishing that could impact your employees.


    #  Scareware


    Scware is based on deceiving the victim into thinking that the computer was infected
    by a virus, whereas the reality is that the computer is fine. The aim of the attacker
    is to then convince the victim to install antivirus software to delete those viruses,
    but the antivirus software is fake.


    There are two main variations of this attack. The first one is based on a “free
    antivirus” that is, in fact, an actual virus that “opens the door” to additional
    viruses.


    The other variation is based on selling you “antivirus” software that will “remove”
    some viruses that do not even exist (so, it is essentially fraud).


    Normally, this will come in several ways, such as the following:


    +   * A popup from a malicious website

    * An add-on for a legitimate site (for example, YouTube)

    * A script that will be executed when Windows starts'
