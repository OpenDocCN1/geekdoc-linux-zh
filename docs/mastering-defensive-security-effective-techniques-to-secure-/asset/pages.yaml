- pgno: 407
  md: '# 14

    Malware Analysis


    "The target of a malware infection is to exploit a system, therefore malware analysis
    becomes very important as a mechanism to better understand the malware to reduce
    the probability and impact of future attacks."


    – Patricia Herrera, MSc in Cybersecurity


    Malware analysis is considered by many as an offensive security task. However,
    as a master in defensive security, you must know the basics of this process so
    that you can leverage it in your defensive security strategy.


    Therefore, while this chapter aims to cover the basics of malware analysis, we
    will also cover some advanced topics, including a hands-on activity to show you
    how to perform basic malware analysis, but more importantly, how to gather (and
    interpret) the most valuable information resulting from the analysis.


    Here are details of the main topics that we will cover in this chapter:


    +   - Importance of malware analysis

    - Malware basics, including functionality, objectives, and backdoors

    - Types of malware analysis (static, dynamic, and hybrid)

    - Categories of malware analysis (static, interactive, automated, and manual)

    - An overview of the best malware analysis tools

    - Hands-on experience performing basic malware analysis'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Technical requirements


    For this chapter, you will need a Windows machine to execute a hands-on analysis
    of the malware.


    # Why should I analyze malware?


    Let''s start by defining malware analysis as a process to analyze malware (software,
    script, Uniform Resource Locator (URL), and so on) to gather as much information
    as possible about the threat.


    This is considered a very technical task that demands highly skilled professionals,
    and these resources could be very expensive for companies to afford. Additionally,
    this could also be very time-consuming, which increases the cost of performing
    this analysis even more. However, even companies with strong budgets may not invest
    in malware analysis, and the reason is that they have not realized the benefits
    of this investment.


    Therefore, let''s start by describing the main benefits and outputs of performing
    malware analysis.


    # Malware functionality


    One of the main goals of malware analysis is to discover the inner functionality
    of the malware. This step is one of the utmost importance because it will support
    the containment after an infection. The main goals of this step are described
    here:


    +   * Discover which are the vulnerabilities used by the malware to infect the
    systems

    * Understand the mechanisms used by the malware to spread between systems

    * Determine whether the malware has any advanced features, such as self-destruction,
    morphing capabilities, propagation, artificial intelligence (AI), and so on


    # Malware objectives


    As part of this analysis, you will be able to determine the objective of the malware
    and this will help you to determine the best mitigation required for each case.
    Some examples are given here:


    +   * Data exfiltration

    * Data corruption

    * Data encryption (ransomware)

    * Data deletion'
  merge: -1
  img_proc: true
- pgno: 409
  md: '+   - System malfunction (cyberwarfare)

    - System disruption (hacktivism)

    - System damage


    # Malware connections


    Another key aspect of malware analysis is determining who created the malware
    and where the exiltrated data is going.


    This is important for two main reasons. The first is about the legal aspect, because
    in most countries, the distribution of malware is a crime, and therefore identifying
    the group that is trying to compromise your systems is vital.


    The second reason is about using this information to block and blacklist the Internet
    Protocol (IP) addresses used by the malware that will prevent further attacks.


    Additionally, this data (IPS, server names, and so on) can be used by open source
    (crowdsource) systems to prevent attacks in other companies and industries.


    Have a look at the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_409_0.png)


    Figure 14.1 - IP blacklisting


    As seen in the preceding screenshot, blacklisting IP addresses may help to stop
    an ongoing attack, but also may prevent future attacks from the same group. It
    is also important to remember that blacklisting will also prevent a command-and-control
    (C&C) attack.


    # Malware backdoors


    A common characteristic of malware is to create backdoors. While the usage and
    objectives of those backdoors may vary, it is very important to determine any
    trail of backdoors to reduce the possibility of further infections or data compromise.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Affected systems


    Another important factor to analyze concerns the systems (OS


    Now that you are aware of the benefits and importance of malware analysis, it''s
    time to understand the types of malware analysis, as well as their categories.


    # Types and categories of malware analysis


    There are a considerable number of tools that can be used for malware analysis,
    so to better understand them, let''s start by describing the three types (actually,
    two) of malware analysis tools.


    # Static malware analysis


    This type of analysis is based on a review of the code to determine the potential
    indication of threats. Those indicators can be hashes, IP addresses, code signatures,
    code patterns, strings, functions, and so on.


    The main characteristic of this analysis is that it does not execute the code,
    and while this is an advantage in terms of resources, the scope is also limited
    because it will not fully test the impact and actions executed by the malware.


    Another downside is that sophisticated malware may include advanced features aimed
    to bypass this static analysis.


    # Dynamic malware analysis


    This type of testing requires more resources in terms of skilled professionals,
    but also in terms of technology because it requires an isolated environment to
    run a test, called a sandbox.


    > Tip

    Sandboxes are very sensitive because they are not properly configured and isolated,
    they can cause a catastrophic event. Therefore, they must only be used by experienced
    and trained experts.


    In this type of testing, the malware is executed on the sandbox to discover almost
    all characteristics of the malware explained in the previous heading.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# Types and categories of malware analysis 389


    Therefore, the main advantage of dynamic malware analysis is that it provides
    better insights into the malware, which helps to discover additional information
    that will be impossible to obtain with static tests.


    However, there are advanced malware that can bypass dynamic analysis by adding
    some code that will only be executed when a certain condition is met—for example,
    only run if IP is .xxx . .xxx . .xxx . .xxx—making the dynamic test unreliable.


    To overcome that problem, organizations are now using a hybrid approach.


    # Hybrid malware analysis


    As seen in the following screenshot, a hybrid approach is based on a combination
    of the two methods already explained, to take advantage of their benefits while
    covering their weak spots:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_411_0.png)


    Figure 14.2 – Types of malware analysis


    As mentioned, an advanced malware may deceive a sandbox by using code to prevent
    full execution in the sandbox environment; however, static analysis using heuristics
    or signatures might be able to detect that behavior, allowing the analyst to modify
    the sandbox to execute those hidden features or actions of the malware.


    > What is heuristic malware analysis?

    Heuristics were introduced to detect new threats such as unknown malware, modified
    malware, and even polymorphic malware. They basically work by analyzing the code
    of a file to look for pieces of known viruses or common functions or code that
    are only present on malware, such as encrypting an entire drive, disabling the
    antivirus, and so on.


    I know you want to know more about malware tools, before jumping into them, we
    need to understand the stages of malware analysis, as this may serve as a way
    to categorize the different tools available.


    Now, let''s explore the different categories of malware analysis.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Static properties analysis


    This is a simple type of analysis, aimed at analyzing some basic characteristics
    of the malware (metadata) to understand more about the malware.


    Normally, this is the first step to determine additional analysis is needed, and
    even to determine which analysis is more suitable.


    # Interactive behavior analysis


    Interactive behavior analysis is a very complex type of analysis in which the
    analyst interacts with the malware to better understand it (impact, connections,
    and so on). This type of testing is performed in a protected and isolated environment
    created specifically to perform this. This enables the analyst to determine changes
    caused by the malware in the Operating System (OS), registry keys, processes,
    service interdependencies, backdoors, and so on.


    # Fully automated analysis


    This is a set of predetermined tests that can be executed over a given malware
    to gather some additional information. This test is normally cloud-based (as a
    service) and provided by a third party.


    One of the main advantages is that it will produce an easy-to-read report, which
    means no special skills are required to execute this type of testing. Additionally,
    this analysis is highly recommended when the company needs to analyze a big number
    of malware samples in a convenient and quick way.


    # Manual code reversing


    This is probably the most complex type of malware analysis as it requires reverse-engineering
    the code using debuggers, disassemblers, or compilers.


    In some cases, even advanced cryptographic skills may be required to perform this
    testing.'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'The different categories of malware analysis are shown in the following figure:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_413_0.png)


    Figure 14.3 – Categories of malware analysis


    As highlighted in the preceding figure, code reversing is the most complex and
    time-consuming analysis.


    OK—now that you are a pro on the concepts of malware analysis (including their
    categories and types of analysis), it''s time to move on to the next topic and
    finally see the tools used to perform malware analysis.


    # Best malware analysis tools


    Let''s do a review of the top five tools used for malware analysis. This compilation
    includes tools from all types and categories of malware analysis.


    # Process Explorer


    This tool is basically a super task manager that provides you with a lot of information
    about the processes running in your system.'
  merge: -1
