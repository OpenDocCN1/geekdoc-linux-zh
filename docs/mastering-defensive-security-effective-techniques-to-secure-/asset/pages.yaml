- pgno: 481
  md: '# Basic forensics


    You can also automate the gathering of metadata from files with simple Python
    code.


    To achieve that task, we will use the os library. In this example, we will use
    os.stat because it provides a lot of useful metadata available to the OS, including
    the following:


    +   - The last time the file was modified (st_mtime)

    - The last time the file was accessed (st_atime)

    - The creation time or the last metadata was changed (st_ctime)

    - The user identifier (ID) of the owner (st_uid)

    - The group ID of the owner (st_gid)

    - The file size (st_size)


    Let''s see an example.


    Go back to Python and write the following lines of code:


    ```

    >>> import os

    >>> stats = os.stat((''secret01''))

    ```


    The output should give you all the information just described (creation date,
    file owner, and so on), as illustrated in the following screenshot:


    ```

    >>> import os

    >>> stats = os.stat((''secret01''))

    >>> print(stats)

    os_stat_result(st_mode=33188, st_ino=2634995, st_dev=2050, st_nlink=1, st_uid=1000,
    st_gid=1000, st_size=0, st_atime=1630244244, st_ctime=1630244244)

    ```


    Figure 19 – Metadata obtained from file os stat


    If you want to discover more about this library, visit the following web pages:


    +   - https://docs.python.org/3/library/os.html

    - https://docs.python.org/3/library/stat.html


    > Tip

    The format of the dates not familiar to you? Don''t worry—you can use some libraries
    like time or datetime to convert the string from Unix time to human-readable time.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# Achieving Automation of Security Tools


    Many other cool libraries can be used to harvest information from files, as discussed
    next.


    # Pillow


    Pillow is an additional Python library that allows image manipulation. In our
    case, we can use it to gather metadata from the image, such as the Global Positioning
    System (GPS) coordinates of the location where the picture was taken.


    # Gathering metadata from PDF and Word files with Python


    In the case of Portable Document Format (PDF) files, you can use PDFDocument,
    PDFParser, PyPDF, and PdfFileReader.


    For Word documents, the most famous library is Python-Docx, which allows you to
    harvest more than 14 attributes from a Word document.


    # Web scraping


    Another common way to use Python for automation is through web scraping. So, let''s
    have an overview of the most common libraries, packages, and modules used to automate
    web scraping with Python.


    # Using pip


    If you are going to play around with Python, then is highly recommended that you
    install pip. pip is the package manager for Python, and it can be installed to
    be used on the command line to download and install Python packages and their
    requisite dependencies.


    Installation on Kali Linux is very simple, and it can be achieved with the following
    commands:


    ```

    sudo apt update

    sudo apt install python3-pip

    ```


    Now, to verify the version installed, you can use the following command:


    ```

    pip3 -V

    ```


    As seen in the following screenshot, we successfully installed pip3 on Kali Linux:


    ```

    $ pip3 -V

    pip 20.3.4 from /usr/lib/python3/dist-packages/pip (python 3.9)

    ```


