- pgno: 305
  md: '# Physical security mechanisms 283


    Let''s review some technologies to enhance our physical security:


    +   - **Access control:** Here are some of the best practices related to access
    control:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_305_0.png)


    Figure 9.12 – Best practices related to access control


    +   - **Visitor''s access control – auto-expiring badges:** This is a very interesting
    technology for the *secure management of visitors.*


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_305_1.png)


    Figure 9.13 – Auto-expiring badge sample


    The technology is based on a special paper that after 24 hours will show the word
