- pgno: 56
  md: '# Types of pentesting


    A pentest is classified based on the level of knowledge and access that you grant
    them prior to the test. The categories are as follows:


    # Black box


    In this type of testing, the red team is not provided with any information about
    the target. This is commonly used when testing an entire infrastructure to find
    global vulnerabilities. Here, the red team will have to start by performing an
    initial discovery phase and move across layers to find any vulnerable spots.


    This kind of testing is generic and normally involves no collaboration between
    the teams. This is regularly performed as some type of audit in which just senior
    management knows about the execution of the test. This is normally done to perform
    a real test and without the security team being alert.


    This is normally the most complex, resource-intense, and extensive test of the
    three.


    # Gray box


    Here you provide the red team with some details about the target while obscuring
    others. For example, you may ask to test a given application and provide the architecture
    of such application, but more detailed information, such as the source code and
    users, will be obscured.


    # White box


    In this type of testing, you provide the red team with a lot of data about the
    tested system/infrastructure, including blueprints, users, code, and any other
    document related to the system/infrastructure being tested.


    While this may seem as making easier for the red team, this type is more about
    a collaborative environment between the blue and red teams to perform more targeted
    testing.


    # Pentesting services


    You can pretty much test anything; however, here is a list of the most common
    types of pentesting offered:


    +   - Network services

    - Databases

    - Web applications'
