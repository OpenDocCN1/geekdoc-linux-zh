- pgno: 241
  md: '# Changing permissions and ownership of a single file


    Changing permissions on Unix is very simple. Here, you can use the chmod command,
    plus the new permissions in numbers as shown in Figure 7.17, where we changed
    the permissions to the akira directory to 700 equals to rwx---- -.


    The command syntax is as follows:


    ```

    chmod {new permissions} file name

    ```


    You can also use the chown command to change the ownership of a file.


    The command syntax is as follows:


    ```

    chown {new_owner} file name

    ```


    And lastly, we can also change the group owning the file by using the chgrp command.


    The command syntax is as follows:


    ```

    chgrp {new_group} file name

    ```


    Another interesting command is chattr, which enables the user to change a set
    of attributes on a file. To see more information about all the attributes that
    can be changed with this command, visit http://manpages.org/chattr.


    # Useful commands to search for unwanted permissions


    There may be cases in which you need to check the permissions to determine whether
    they were applied as expected or whether something needs to be corrected (restricted)
    to maintain the security of the files.


    The following is a list of useful commands that can leverage to perform this important
    task:


    +   Find all files readable by other: Display all files within the current directory
    that are readable by other. Many of these files are located in hidden directories
    and are generally harmless. However, if any confidential or sensitive files appear
    on this list (such SSH keys), then the permissions must be modified to ensure
    the confidentiality of data.


    ```

    find -perm /004 -type f -print0 | xargs -0 ls -1

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   Find all files accessible by other in any way: This will display all files
    within your home directory that have read, write, or execute permissions for other.
    This is useful for getting a general idea of what other users can access in your
    home directory and applying any restrictive actions if needed:


    ```

    find -perm /007 -type f -print0 | xargs -0 ls -1

    ```


    +   Find all files writable by other: Display all files in the specified directory
    that are writable by other.


    All the files on this list must be carefully analyzed to determine whether they
    need to be writable by other. Otherwise, the permissions must be adjusted to prevent
    any impact on the integrity of the data:


    ```

    find /{directory_name} -perm /002 -type f -print0 | xargs -0 ls -1

    ```


    +   Find all files executable by user or group, and writable by other: Display
    all files in the home directory that are both writable and executable by either
    the user or the group that owns the file.


    If you find a file that can be executed by other, then you must analyze whether
    there is a valid execution for behavior. Otherwise, the file permissions need
    to be changed immediately to prevent any impact on the integrity and availability
    of the files:


    ```

    find -perm -102 -type f -print0 | xargs -0 ls -1 #

    User

    find -perm -012 -type f -print0 | xargs -0 ls -1 #

    Group

    ```


    +   Find all files not owned by a specific group: Display all files in the current
    directory that are not owned by the specified group:


    ```

    find .not -group {group_name} -type f -print0 | xargs -0 ls -1

    ```


    +   Find all files owned by a specific group: Display all files in your home directory
    that are owned by the specified group:


    ```

    find ~ -group {group_name} -type f -print0 | xargs -0 ls -1

    ```'
