    # Weevely


    Weevely is a very interesting tool that provides a web shell to attack web applications.
    It has a lot of interesting features, including the following:


    +   - HTTP and HTTPS proxies to browse through the infected web application.

    - Ability to brute force SQL accounts on the targeted system.

