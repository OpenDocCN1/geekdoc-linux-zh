- pgno: 74
  md: '# Vulnerable USB dongles


    Researchers have found some vulnerabilities on a number of USB dongles, which
    will enable an attacker to inject keystrokes. This is a more dangerous scenario
    because the attacker will leverage a legitimate USB HID device to perform the
    attack. Please refer to CVE-2019-13052, CVE-2019-13053, CVE-2019-13054, and CVE-2019-13055.


    # USB Samurai


    Simply, you can combine the power of the WHID, the stealth of the USB Harpoon,
    and the vulnerabilities on USB dongles, and you will have a USB Samurai! This
    is a dangerous device that looks like a standard USB cable but enables an attacker
    to inject remote keystrokes to the victim''s computer (under $5):


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_74_0.png)


    Figure 2.9 – USB Samurai components


    Figure 2.9 shows the basic components of the USB Samurai: a normal USB type A
    cable along with a vulnerable USB universal keyboard dongle.'
