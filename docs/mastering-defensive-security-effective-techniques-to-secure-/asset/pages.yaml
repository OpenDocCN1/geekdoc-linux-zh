- pgno: 389
  md: '# # 13 Vulnerability Assessment Tools


    "In the midst of a disruptive and exponential rollout of the IV Industrial Revolution,
    more and more processes are being digitized and robotized, and there is an explosion
    of data increasingly managed by artificial intelligence. In tandem with this rollout
    of new and enhanced IT capabilities, there are increased risks posed by cybercrime.
    Increased cybersecurity capabilities thus become one of the challenges to allow
    society to reap the benefits from the IV Industrial Revolution."


    – Ennio Rodriguez, Ph.D. in Economics and President of the Association of Economists
    of Costa Rica


    We have talked a lot about vulnerabilities throughout this book; however, this
    chapter was created as a single-point reference to this topic so that you can
    reach all the information you need about Managing vulnerabilities in a single
    place.


    While Chapter 2, Managing Threats, Vulnerabilities, and Risks, described what
    vulnerabilities are and how to classify them, this chapter is more about how to
    identify those vulnerabilities once they are categorized.'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'Therefore, we can say that while Chapter 2, Managing Threats, Vulnerabilities,
    and Risks, was the theoretical part of vulnerability management, this chapter
    is more about the practical/technical side, including a deep dive into the tools
    used to find those vulnerabilities in our systems and infrastructure.


    To achieve these goals, we will cover the following topics through this chapter:


    +   - How to deal with vulnerabilities like a chief information security officer
    (CISO)

    - Types of vulnerability testing tools

    - Installing and configuring the most recognized vulnerability assessment scanner
    (Open Vulnerability Assessment System, also known as OpenVAS)

    - An overview of Nexpose and other vulnerability assessment scanners available


    # Technical requirements


    To fully leverage the content of this chapter, it is recommended to have installed
    a virtual machine (VM) with Kali Linux to properly follow the labs.


    # Dealing with vulnerabilities


    As we saw in Chapter 2, Managing Threats, Vulnerabilities, and Risks, there is
    a process to manage vulnerabilities at the company level that includes identification,
    analysis, assessment, and remediation.


    Now, that process is what we called the management side of the story. Now, it''s
    time to understand how that is achieved from the operational (day-to-day) point
    of view.


    # Who should be looking for vulnerabilities?


    If you have a large enough budget, you must assign this task to either internal
    or external (third-party) Red Teams (as explained in Chapter 1, A Refresher to
    Defensive Security Concepts).


    On the other hand, if your budget is limited, you can encourage your company to
    report any vulnerability on your infrastructure. To make this effective, you must
    establish and communicate a process for that purpose and, when possible, provide
    incentives to the people that find and report those vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Bug bounty programs


    **Bug bounty** is a clever idea to encourage others to tell you about your vulnerabilities
    instead of exploiting them against you.


    The goal of this program is to *offer economic incentives* to external people
    who find unknown vulnerabilities in your web resources (apps, pages, and so on).


    > > Tip

    > Bug bounty programs are more suitable for companies with high security standards
    and softwares that have already been tested and hardened by internal Red and Blue
    teams. Therefore, publishing a bug bounty of a recently created site that has
    not properly hardened is a waste of resources.


    As mentioned, bug bounty programs are normally offered by strong companies who
    invested a lot of resources on their platforms, so if you have very good pentesting
    skills, I highly encourage you to check these sites and learn more about these
    programs:


    +   * https://hackerone.com/bug-bounty-programs

    * https://hackproof.com/bug-bounty-solutions

    * https://bugcrowd.com/programs

    * https://www.facebook.com/BugBounty/

    * https://www.microsoft.com/en-us/msrc/bounty

    * https://ounty.github.com/

    * https://internetbugbounty.org/


    Payment of bug bounty programs is normally classified based on the impact of the
    vulnerability found, which is tied to payment categories, as shown in the following
    screenshot:


    | Critical | High | Medium | Low |

    |---|---|---|--|

    | $2,500 | $500 | $300 | $150 |


    Figure 13.1 – Bug bounty payment example'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'However, this may raise the following question:


    Should I only check for vulnerabilities on external (internet-facing) systems
    and services?


    # Internal vulnerabilities


    While external-facing systems are more vulnerable to attacks, you are still in
    charge of the overall security of your company data, which means you also need
    to take care of the availability and the integrity of that data, and those two
    factors are especially vulnerable to insider attacks (either malicious or unintentional).


    Therefore, Red Teams should also perform testing on internal systems to ensure
    that the confidentiality, integrity, and availability of the data are preserved.


    Have a look at the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_392_0.png)


    As seen in the preceding screenshot, vulnerability testing programs can be supplemented
    to enhance the security of your systems by leveraging even external sources.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Vulnerability testing tools


    There are a huge number of tools that can be used to perform vulnerability testing,
    and we can classify them into two main groups: manual vulnerability assessment
    and automated vulnerability scanners.


    # Manual vulnerability testing


    You can leverage many of the tools we have reviewed in the previous chapters to
    manually look for vulnerabilities—for example, Burp Suite, Nmap, Wordpress, Shodan,
    and Web Scrapers.


    These types of testing require more technical skills and are normally done by
    cybersecurity experts or Red/Purple Teams.


    # Automated vulnerability scanners


    These scanners are created with the objective of making our lives easier by allowing
    us to scan a given web resource or system against one or more vulnerabilities
    with just a few steps—in fact, for most of them, with a single click.


    This allows an organization to scan their systems for complex vulnerabilities
    without the need of a pentester to perform the vulnerability assessment, making
    these scanners a more suitable option for companies with little budget to hire
    pentes.


    Most of them contain a database of known vulnerabilities (Common Vulnerabilities
    and Exposures, CVE), plus an associated script to test each of them. In some cases,
    they group their vulnerabilities to allow users to determine whether the systems
    are compliant with a given compliance requirement such as the Payment Card Industry
    Data Security Standard (PCI DSS) or the Health Insurance Portability and Accountability
    Act (HIPAA).'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'The following screenshot shows the graphical user interface (GUI) of the Nessus
    vulnerability scanner:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_394_0.png)


    Figure 13.3 – GUI of the Nessus vulnerability scanner


    OK–now, let''s do a deep dive into two of the more famous vulnerability scanner
    tools: OpenVAS and Nexpose.


    # Using a vulnerability assessment scanner (OpenVAS)


    OpenVAS is the most famous open source vulnerability scanner available.


    The software is mainly maintained as an open source project by Greenbone networks
    (www.greenbone.net) as part of its commercial suite of a vulnerability management
    solution.


    This software is capable of testing an entire network to discover devices and
    then execute a plurality of actions to determine the Operating System (OS), ports,
    configurations, and software installed on the systems, as in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'Using a vulnerability assessment scanner (OpenVAS)


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_395_0.png)


    Figure 13.4 – OpenVAS network scan structure


    After that, OpenVAS can execute several checks to identify vulnerabilities on
    each of the identified components.


    # Authenticated tests


    Part of the powerful options of OpenVAS is the capability to perform two types
    of tests: unauthenticated and authenticated testing.


    An unauthenticated test is less invasive because it just tests general vulnerabilities
    based on the software, configuration, and ports found.


    On the other hand, an authenticated test is more powerful because it allows you
    to add another factor to the test—that is, the user''s session, authentication,
    and authorization.


    Here, OpenVAS will run valid credentials (provided by the tester) to run local
    security checks (LSCs) to gather more details about the vulnerabilities on the
    target systems.


    Examples of the tests that can be used in an authenticated test are given here:


    +   * **Server Message Block (SMB)**: To check the patch level and locally installed
    software on systems such as Adobe Reader or the Java suite


    +   * **Secure Shell (SSH)**: To check the patch level on Unix and Linux systems


    +   * **ESX integrated (ESXi)**: To test the VMware ESXi servers locally


    +   * **Simple Network Management Protocol (SNMP)**: To test network components
    such as routers and switches


    Now, let’s see how we can install this tool on our Kali Linux machine.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Installing OpenVAS


    OK—the first step will be to download and install OpenVAS with the following command:


    ```

    sudo apt-get install openvas

    ```


    Once the software is installed, it''s time to execute the configuration script
    with the following command:


    ```

    sudo gvm-setup

    ```


    Did you get an error?


    As seen in the screenshot, there is a common error related to postgresql, but
    we will see how to fix it:


    ```

    kali@~$ sudo gvm-setup

    ERROR: The default postgresql version is not 13 required by libgvmd

    Error: Use pg_upgradecluster to update your postgres cluster

    ```


    Figure 13.5 – postgresql error


    The error is caused because there are two versions of postgresql running at the
    same time and postgresql uses Transmission Control Protocol (TCP), and as you
    may know, it cannot use the same port for both versions.


    Therefore, to fix this issue, we just need to make sure that version 13 is running
