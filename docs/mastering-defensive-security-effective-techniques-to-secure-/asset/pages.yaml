  md: '# Environmental risks


    Just a reminder that you need to ensure your systems, servers, and backups are
    protected against any possible threat posed by environmental risks such as hurricanes,
    floods, earthquakes, and more.


    Now, let''s jump into some mechanisms and tools that you can leverage to improve
    the physical security of your company.


    # Physical security mechanisms


    There are several mechanisms and controls that you can leverage to reduce the
    risks related to physical security, and they are normally divided into the following
    categories:


    +   **Detective**: These are the types of controls used to detect intrusions –
    for example, a security camera, an alarm, movement sensors, and so on.


    +   **Preventive**: These are designed to prevent someone from entering a secure
    or restricted area – for example, fences, badge-controlled doors, pin-controlled
    doors, face recognition systems, and so on.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_304_0.png)'
  merge: -1
