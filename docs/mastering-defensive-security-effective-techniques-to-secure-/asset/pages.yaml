  md: '# Directory permissions:


    777 - 027 = 750


    Based on Figure 7.9, 750 equals rwxr-x---.


    The result of that by default, others will not be able to access or even list
    the content of directories, as shown in the following figure:


    ```

    kali@kali:~$ ls akira

    ls: cannot open directory ''akira'': Permission denied

