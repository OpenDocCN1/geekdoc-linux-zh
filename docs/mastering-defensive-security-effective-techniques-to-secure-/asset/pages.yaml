- pgno: 357
  md: '# Gathering intelligence about your site/web application


    The very first step when securing your web resources (website, web applications,
    Application Programming Interface (API), and so on) is to determine what kind
    of information is easily and freely available about them on the internet. If you
    wonder why you should do this, the response is very simple: because this is what
    attackers do first!


    And believe it or not, there are thousands of web resources exposing sensitive
    data such as passwords, database users, sensitive documents, and so on.


    # Importance of public data gathering


    Now, let''s start by understanding the key aspects that highlight the importance
    of this activity (and why you must invest time and resources doing it), as follows:


    +   * Public information can be used on a targeted social engineering attack (phishing,
    vishing, impersonation, and so on.)

    * Usernames can be used to execute targeted password attacks (dictionary attacks,
    brute-force attacks, and so on).

    * Server names and Internet Protocol (IP) addresses can be used to execute targeted
    Denial-of-Service (DOS) attacks.

    * Public information can be used by attackers to create better dictionary attacks.


    Now, let''s see how to crawl the internet to discover how much information about
    your sites is publicly available.


    # Open Source Intelligence


    Open Source Intelligence (OSINT) is about gathering intelligence or information
    from public (open) resources such as the internet. This term was normally used
    by intelligence services but is now very common in the cybersecurity area.


    In fact, there is a very good framework (https://osintframework.com/) that includes
    several resources available for you to gather all types of data from the internet,
    and next, we will see the most relevant tools that you can use for this data gathering.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# DNS lookup


    These tools allow you to gather Domain Name System (DNS) information about your
    web resources. Therefore, it is highly recommended to check your sites to see
    what others know about them.


    A good example is a site https://spyse.com/tools/dns-lookup, which gives you more
    than just DNS information, such as the:


    +   - DNS records (Mail Exchange (MX), Address (A), name server

    - DNS history

    - The technology used (operating system (OS), Internet Information Services (IIS),
    libraries, fonts, Content Management System (CMS), and so on

    - Subdomains

    - Other data (HyperText Transfer Protocol (HTTP)) headers, Cascading Style Sheets
    (CSS)), links, JavaScript (JS)

    - Certificate information (Secure Sockets Layer, or SSL)

    - Verified email addresses


    Depending on your business, some of this information must be obfuscated as you
    represent a security or privacy risk.


    The page presented in the following screenshot shows a security score based on
    vulnerabilities found from Common Vulnerabilities and Exposures (CVE):


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_358_0.png)


    Figure 12.1 – Vulnerabilities view from spyse.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Gathering intelligence about your site/web application 337


    As you may have already inferred, these types of pages are also a good source
    of information to evaluate the security of your hosting provider.


    # WHOIS records


    These records show information related to the owner of a given domain. The main
    risk here is that having those records associated with a single person may make
    that person a big target for cybercriminals.


    For example, if an attacker can see the email address of the owner of the domain
    of a big corporation, then the attacker can use that information to perform a
    plurality of attacks over that person, such as the following:


    +   * Social engineering attacks

    * Brute-force attacks

    * Impersonation attacks

    * Searching email on known data breaches to gather credentials


    To prevent those attacks, companies can pay an extra fee to the domain registrant
    to hide those records as a privacy measure, as seen in the following screenshot:


    | Normal Domain | Private Domain |

    | Registrar Data | Registrar Data |

    | Registrar Contact Information: | Registrar Contact Information: |

    | Name Tomi Beta | Name REDACTED FOR PRIVACY |

    | Organization Mikela Corp | Organization REDACTED FOR PRIVACY |

    | Address Desild Road | Address REDACTED FOR PRIVACY |

    | City Toscana | City REDACTED FOR PRIVACY |


    Figure 12.2 – WHOIS output of private versus normal domain


    Notice in the preceding screenshot that the registrant information has been obfuscated
    for security and privacy.


    # Hosting information


    Another piece of information that you may want to check is about shared hosting
    environments. For example, pages such as https://www.domainiq.com give you a list
    of all the domains hosted on a given server or subnet.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'This information can be used in two ways, as outlined next:


    +   - Firstly, it can be used by you to determine the server reputation if you
    are using a shared hosting environment.


    +   - Secondly, this can also represent a privacy issue about the ownership of
    the company. For example, you may have two companies registered under different
    corporations because you don''t want the public to associate with them, but having
    both domains hosted on the same server may give a clue about the real ownership
    of companies.


    The following screenshot shows a list of domains hosted on the same server:


    | Domains on IP | 192.20.10.15 | Domains on Subnet | 192.20.10.1-255 |

    |---|---|---|--|

    | 263 total. | Whose Explore Purchase List | 24,306 total. | Explore Purchase
    List |

    | originaldomain.com | | originaldomain.com | |

    | secretdomain.com | | competitiondomain.com | |

    | othersecretdomain.com | | fakedomain.com | |

    | superdomain.com | | otherdomain.com |


    Figure 12.3 – Output showing a list of domains hosted on the same server


    As a side note, this information may also be useful if you are using a third-party
    shared hosting environment to determine whether your site is at risk of being
    banned (blacklisted) due to a bad page hosted on the same server (which may impact
    the availability of your email server).


    # Web-scraping tools


    There are some tools designed to gather all public information from a given domain.


    You can leverage these tools to determine how much information can be harvested
    from your site or web application to ensure that your private data remains confidential.


    Some examples of web-scraping tools are listed here:


    +   - https://webscraper.io: A popular browser extension allows you to gather
    all public information from a given site.


    +   - https://www.scraperapi.com/: This site provides users with an API to perform
    scraping.


    +   - https://www.scraping-bot.io/: A user-friendly system to scrape web pages.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'As seen in the following screenshot, most scraper systems will output several
    types of documents, including .html, .doc, .pdf, .xls, and so on:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_361_0.png)


    Figure 12.4 – Web scraping


    Remember that you should only do scraping on your own servers as this may be illegal
    in some countries.


    # Preventing web scraping


    There are also some steps that you can take to prevent others from using web scraping
    against your web resources. The most effective ones are listed here:


    +   - Implement a Web Application Firewall (WAF).

    - Use antibot systems (such as the Completely Automated Public Turing test to
    tell Computers and Humans Apart (CAPTCHA).

    - Request user registration to access downloads and other information.

    - Use blacklists of IPs, servers, domains, and so on.

    - Use advanced systems such as browsing fingerprinting to detect potential bots.

    - Use honeypots to identify attackers who want to scrape your site (and block
    them).


    Those tips may help protect against some automated scraping tools, but your system
    may still be vulnerable to web scraping. This is why the beginning of this chapter
    on making sure that no sensitive information is externally available so if someone
    does web scraping, they will not collect any sensitive data from our web systems.


    # Checking data exposure with Google hacking (dorks)


    I know that many people hate this to be called hacking (mainly because this does
    not require any technical skill); however, a lot of people call Google dorks Google
    hacking, I decided to keep that name in the title just to create some attention.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Google dorks are based on the utilization of some search commands and parameters
    to harvest the internet for some private files and information in a more targeted
    way.


    As mentioned before, this is not a tool created by Google to hack; instead, it
    is about leveraging this search engine to find some sensitive information that
    was not properly secured and therefore exposed on the internet.


    Let’s review some Google dorks that you can use to ensure you are not exposed
    on the internet. You can see an example here:


    ```

    site:yoursite.com filetype:xls intext"phone"

    ```


    Check whether there is any .xls file on your site that contains phone numbers.
    You can improve it by changing the phone keyword for any other attribute that
    you want to search and the file type for .pdf, .doc, and so on. Here’s a code
    example to show you how to do this:


    ```

    site:yoursite.com filetype:sql "# dumping data for table" "PASSWORD" varchar

    ```


    Search for open databases in your web resource with the word password.


    As seen in the following screenshot, you need to carefully review the results
    of these dorks to see whether the results show just basic data (such as variable
    names) or more sensitive data (such as plain text passwords):


    ```

    `id int(11) NOT NULL auto_increment,

    `username` varchar(30) NOT NULL,

    `password` varchar(255) NOT NULL,

    `type` enum(''admin'',''user'') NOT NULL,

    `date` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,

    `addby` int(11) NOT NULL,

    PRIMARY KEY (`id`)

    ENGINE=MYISAM DEFAULT CHARSET=latin1 AUTO_INCREMENT=5;


    --

    Dumping data for table ''admin''


    INSERT INTO ''admin'' (''id'',''username'',''password'',''type'',''date'') VALUES

    (''1'',''Admin'',''mypassword'',''admin'',''2020-05-05'')

    ```


    Figure 12.5 – Google dork output'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'Even if this sounds incredible, there are times when you may even find passwords
    in a .txt file, as illustrated in the following code example:


    ```

    site:yoursite.com intitle:"index of" "Index of /" password.txt

    ```


    The code shown in the preceding example will search for misplaced files (such
    as a .txt file with usernames or passwords).


    > Tip

    Here, you can find more than 6,000 Google dorks that you can modify based on your
    needs. Some are specific to particular web services, so they may be really useful
    for you: https://www.exploit-db.com/google-hacking-database.


    There is another way to prevent outiders from using these Google dorks against
    your web systems by modifying the robots.txt file in your server, as follows:


    +   - Prevent indexing from Google by running the following code:


    User-agent: Googlebot

    Disallow: /


    - Prevent Google from indexing a specific file type by running the following code:


    User-agent: Googlebot

    Disallow: /*.sql$


    - Prevent indexing of a given folder by running the following code:


    User-agent: Googlebot

    Disallow: /directoryName/


    - Prevent indexing from other search engines by running the following code:


    User-agent: *

    Disallow: /


    All these are very basic (but feasible) attacks, but now you have learned how
    to set up the basics of web security, it''s time to move on to the next step and
    learn about the most common attacks on web applications.'
  merge: -1
  img_proc: true
