- pgno: 41
  md: "# Brute-force attacks\n\nOne of the most common attacks on passwords is brute-force\
    \ attacks. By far the most famous app to achieve this is John the reaper, in which\
    \ you can customize the attack to reduce the time required to expose a password.\n\
    \nIn these types of attacks, password complexity (and size) matters, so let me\
    \ use some math to prove it.\n\nWe have two variables: the spectrum of possibilities\
    \ (S) and the password length (L). In the alphabet, we have 26 characters, so\
    \ it means our spectrum of possibilities is 26, but that is considering just one\
    \ case, because if we use lowercase and uppercase, then it increases to 26+26=52.\n\
    \nThis means if we have an 8-character password (L) with just lowercase letters\
    \ (S), the number of possibilities will be SL, or in this case, 268, which means\
    \ around 200 billion combinations.\n\nSome of you may think that 200 billion is\
