- pgno: 452
  md: '# Introduction to digital forensics


    Digital forensics (also known as cyber forensics or just forensics) is the process
    used to collect, identify, gather, secure, and store data from digital systems
    that can be used as evidence.


    In our case, we will focus on forensics to detect the use, abuse, intrusion, damage,
    or modification of computer systems, servers, networks, infrastructures, or data.
    However, forensics is also used to recover deleted or modified data, so let''s
    take a few minutes to review how forensics can be used for that.


    # Forensics to recover deleted or missing data


    There is one part of forensics that is used to collect, identify, and recover
    deleted data from digital media.


    Usually, data is recovered from non-volatile media storage such as hard drives
    and USB drives, but it is also possible to gather data from volatile memory as
    Random Access Memory (RAM).


    Volatile versus non-volatile memory

    Volatile memory such as RAM is a type of memory that only saves the information
    while it is ON, while non-volatile memory such as hard drives can retain information
    over a very long time, even when they have no power. Therefore, gathering information
    from volatile memory is considered a more complex and specialized task.


    Now, let''s start by reviewing how to capture data from volatile memory.


    # Recovering data from RAM


    Due to the hardware nature of RAM, recovering data from RAM is considered a very
    complex task. However, there is one tool and one method we can use to achieve
    this goal. Let''s take a look.


    # Microsoft COFEE


    The Microsoft Computer Online Forensics Evidence Extractor (COFEE) toolkit was
    developed and distributed by Microsoft to police agencies to help them collect
    digital evidence from Microsoft systems.


    The tool is loaded as a live USB and is composed of a Graphical User Interface
    (GUI) with more than 150 forensics tools, including data stored on volatile memory
    (RAM).'
  merge: -1
  img_proc: true
- pgno: 453
  md: 'A copy of this tool was supposedly leaked on the internet in 2009 and if you
    are interested in reviewing it, a simple Google search will give you the link
    to the WikiLeaks page to download it.


    > Tip

    Remember that leaked versions of software may contain malicious content, so avoid
    running it on your main computer. Instead, try using a virtual sandbox environment
    and take all the necessary precautions if you decide to download and run this
    type of software.


    # Cold boot attack


    This is a super interesting way to gather data right from the RAM. Let me explain
    how it works:


    +   First, you need physical access to the computer.

    2. Open the computer.

    3. Cool down the RAM module (this can be done using a freeze spray).

    4. Cut off the power of the machine.

    5. Boot up the computer using a lightweight USB bootable Operating System (OS).

    6. Perform a memory dump using any available memory dump software or script.


    As illustrated in the following diagram, a limitation of this attack is that the
    amount of data that''s recovered is proportional to the time required. This means
    that the faster you perform the dump, the more data you can recover.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_453_0.png)


    Figure 16.1 – Correlation between time and data on a cold boot attack'
  merge: -1
  img_proc: true
- pgno: 454
  md: "As you can imagine, there is a risk of physically destroying the memory, so\
    \ it is highly recommended that you only use this method in a very controlled\
    \ space (a lab environment). Also, it only works if the computer you wish to examine\
    \ is already on.\n\n| What data can be recovered from RAM? |\n Data that can be\
    \ recovered from RAM includes unsaved documents, drafted emails, passwords, chats,\
    \ usernames, printed documents (print jobs), settings, network or connection settings\
    \ such as IP and Service Set Identifier (SSID), and more. |\n\nNow, let's look\
    \ at the tools and methods we can use to recover data from non-volatile memory.\n\
    \n# Recovering information from non-volatile memory\n\nThere are many tools we\
    \ can use to recover deleted data from non-volatile memory, such as hard drives.\
    \ Most of them are very easy to use and available with a very user-friendly interface\
    \ on Windows machines, such as Recuva.\n\nAdditionally, there are more advanced\
    \ tools such as Foremost, which is a tool that's loaded on Kali Linux. We covered\
    \ the configuration and execution of Foremost in Chapter 5, Cybersecurity Technologies\
    \ and Tools.\n\n# Digital recovery versus physical recovery\n\nTo explain how\
    \ data recovery works, let me start by explaining how Windows manages the files.\n\
    \nWindows uses something called Master File Table (MFT). This table is like the\
    \ index of a book that tells the operating system (OS) the location of each file\
    \ by pointing to it the hard drive sector where the file is located. This means\
    \ that you want to open a file, the OS checks the MFT for where the file is located\
    \ and retrieves the data from the disk.\n\nAs illustrated in the following diagram,\
    \ to make the computer faster, when you delete a file, the OS deletes the entry\
    \ on the MFT so that the sector becomes available to be used by another file.\
    \ However, the information remains on the hard drive until the OS overwrites that\
    \ sector with another file:"
  merge: -1
  img_proc: true
- pgno: 455
  md: 'Introduction to digital forensics 433


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_455_0.png)


    Figure 16.2 – Windows MFT table structure


    Therefore, most digital recovery software does is perform a deep scan of the hard
    drive sectors to recreate the MFT based on the content found on the drive. As
    an analogy, this is like reading a book to recreate its index (table of contents).


    There are also cases in which the partition or system becomes corrupted. In those
    cases, the files can easily be retrieved by connecting the hard drive as an external
    drive to another computer and running the recovery software from there.


    However, there are cases in which the hard drive becomes physically damaged due
    to all the moving parts that are in constant use due to rotation and friction,
    as illustrated in the following diagram. Examples of damage can be a bad head,
    a head crash, a scratch, or even damage to the rotor.


    > Tip

    In most cases, hard drive damage is progressive, so if you start noticing noises
    coming from the computer that sound like clicking or whirring, then it''s time
    to replace the hard drive and save your data before it is too late.'
  merge: -1
  img_proc: true
- pgno: 456
  md: 'In all cases, recovery is possible, but only by experts using special equipment
    and a properly setup lab. Also, note that physical recovery is normally expensive.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_456_0.png)


    Figure 16.3 – Moving parts of a hard drive


    In regards to **solid-state drives (SSDs)**, those risks of damage are lower because
    of the absence of moving parts. However, if physical damage does occur, the recovery
    process is more complicated.


    Now, let''s focus on computer forensics from the point of view of defensive security
    to detect the use, abuse, intrusion, damage, or modification of computer systems,
    servers, networks, infrastructures, or data.


    # Digital forensics on defensive security


    When talking about forensics in terms of defensive security, we must perform forensics
    in several fields, including the following:


    +   * Data analysis

    * Log analysis

    * Email forensics

    * Database forensics

    * Malware forensics

    * Memory forensics

    * Mobile forensics

    * Network forensics'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'Now, let''s dig deeper into how digital forensics is managed, including the
    process that''s involved.


    # Who should be in charge of digital forensics?


    There are two ways to manage all this forensics work. While some companies a forensics
    specialist to deal with all forensics-related tasks, other companies train an
    expert in each field to act as a forensic expert. There is also a forensics coordinator
    who acts as the leader of all forensics activities.


    # The digital forensics process


    Most companies customize their digital forensics process based on their needs
    and their level of maturity. However, let me present you with the steps that must
    be followed when performing digital forensics:


    +   **Data handling and custody**: Managing data during a forensics process is
    key to ensuring the success of the results. You need to keep in mind that the
    data''s collected during this process may be used for prosecution or to take any
    legal actions, so you *must* ensure that the data is collected based on a standard
    that''s approved by your justice system.


    Additionally, you need to apply the required tools and techniques to ensure the
    data''s integrity from when it''s collected until it''s presented (for example,
    presenting the data as evidence in a court of justice). One of the most common
    methods that''s used to demonstrate the integrity of the data is by hashing the
    data that''s collected, as mentioned in *Chapter 5, Cybersecurity Technologies
    and Tools*.


    +   **Data collection**: The first step in any forensics process is to *collect
    all* the data from all available sources. This step is incredibly important, so
    much that we will review this in the upcoming section.


    +   **Data analysis**: The analyst starts filtering the bulk of the information
    so that the analysis will be performed based on relevant information, reducing
    unnecessary efforts. Then, they must use a plurality of tools and methods to analyze
    the data''s that been collected. As mentioned previously, this analysis can be
    done on any type of media storage (volatile or non-volatile) and using techniques
    for digital and physical recovery. The results of the entire forensics process
    rely on the data and devices being analyzed, so this task must be performed by
    a certified professional.'
  merge: -1
  img_proc: true
- pgno: 458
  md: '> Tip

    If you are interested in getting a certification in forensics, I highly recommend
    that you visit this site: https://i2c2x.com/


    +   **Saving or archiving evidence:** A common error is to delete the evidence
    after the trial. However, data that may be of value during an appeals process,
    to identify repeat offenders (this could be key to determining whether someone
    is an inadvertent user or a malicious insider), or even in threat intelligence
    to correlate the data against new events to identify further attacks.


    Therefore, the best practice is to create a section in your data retention policy
    that determines the required time to archive digital evidence. Notice that in
    some cases, this policy may be influenced by some regulations or laws.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_458_0.png)


    Now, it is time to look at some of the platforms that are used to perform digital
    forensics and gather digital evidence.


    # # Forensics platforms


    As we mentioned previously, the forensics process is a very sensitive task that
    must be performed with extreme care to ensure the data’s gathered is preserved
    and that its integrity is guaranteed.


    However, this can''t be achieved with a single tool. Instead, a forensics specialist
    must select the best tool for each scenario based on a plurality of factors, such
    as the source of the data, the storage type, and the operating system.'
