- pgno: 215
  md: 'Mastering endpoint security 193


    +   * Microsoft even recommends avoiding the installation of Office on these systems.

    * They must run supported and fully patched OSes.

    * Universal Serial Bus (USB) ports should be disabled.

    * When possible, media readers (Digital Video Disc (DVD), Standard Definition
    (SD), and so on) must be removed or disconnected.

    * Autorun must be disabled.

    * Make sure that the security features of the secure administrative hosts are
