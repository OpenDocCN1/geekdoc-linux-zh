- pgno: 138
  md: '# The segregation of duties


    This is one of the core activities that you must do as part of your defensive
    security strategy, and it is based on two main actions or activities:


    +   - The first one is about the identification of the most critical tasks on
    your infrastructure. Here you need to ask yourself: what are the human actions
    that (if performed by a malicious insider) will cause a considerable impact on
    the systems and data?

    - Second, once you identify those activities, you need to set controls to ensure
    that a single person cannot perform those tasks by themselves.


    > The importance of segregating dutiesnResearchers agree that the biggest hack
    to a social media platform (for example, the Twitter hack of 2020) could be prevented
    by segregation of duties was put into place.


    Now, let''s take a look at some examples of how you can leverage and implement
    this strategy.


    # An example of the segregation of duties


    As you can see in Figure 4.2, allowing a system administrator to create privileged
    accounts allows a malicious insider the possibility to perform a dangerous attack.
    Instead, you must put some systems and processes in place to elaborate a flow
    for the creation of new users, which requires the involvement of several groups,
    reducing the probability of the attack.


    In the following example, you can see a flow in which the system administrator
    will have to create a ticket with the request. The request is then sent for approval,
    and once it is approved, it will be sent to the Identity Management Access (IAM)
    team to fulfill the request.


    Notice that filtering all the communications through the helpdesk (in both directions)
    is a great way to prevent direct communications between the malicious insider
    and the person in charge of creating the accounts, which greatly enhances the
    security of this method:'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/8c6a223c57e25ea0cc1593903a1b920f_139_0.png)


    Figure 4.4 – The segregation of duties


    Another great example is relate to backups because a malicious insider might know
    that deleting some files will not do harm. This is because they can be retrieved
    from the backups, and in those cases, they will target the backups to prevent
    any restoration attempt.


    To prevent this dangerous scenario, you can use the segregation of duties to ensure
    that a single user won''t be able to delete those backups because a flow is in
    place to perform that action (supported by a policy, a process, and enforced by
    the system).


    # # The use of mailboxes


    When the segregation of duties is implemented, a malicious insider might try to
    persuade or convince another person to do some actions to help the attack.


    To avoid this, you can use mailboxes for the communication of highly sensitive
    teams, such as approvers, the helpdesk, the IAM team, and more. This will avoid
    exposing the identity of the people on those jobs, preventing any direct attempt
    to persuade or blackmail them:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_139_1.png)


    Figure 4.5 – Using mailboxes


    As you can see in Figure 4.5, even if there is a direct channel of communication
    with support teams (which is normal in small companies), malicious insiders won''t
    be able to identify who is the person is working on the request.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Job rotation


    Another good practice is job rotation for IT support personnel. This consists
    of the creation of a policy that requires IT personnel to switch roles from time
    to time. This requires the implementation of cross-training, mentoring, and skill-development
    programs, which is also motivational for IT personnel.


    This simple policy gives you some extra advantages in your defensive security
    strategy, including the following:


    +   - Reduces the risk of downtime: You must ensure that you have people trained
    to avoid risks due to a lack of skills regarding a given technology. For example,
    "Oh, we will have to wait until next week because Maria is out, and she is the
    only one who knows about DB2"


    +   - Reduces the risk of fraud: When a person stays "fixed" in the same role,
    they might be able to cover their own tracks (in the case of any illegal activity).
    However, if you keep rotating them, there is a reasonable probability that the
    new person will discover some "anomalies" that could uncover that illegal activity.


    +   - Decrease the impact of the attack: By reducing the time for which a person
    is doing the same role, it will also reduce the time a person will have to perform
    an illegal activity; therefore, the impact of such an attack (on your data and
    systems) would be lower.


    # Mandatory vacations


    This is based on the same principle as job rotations, and it serves as a way to
    detect and stop frauds. The way this works is very simple: first, it is known
    that insiders who commit fraud tend to be paranoid of being discovered. Therefore,
    they avoid taking vacations to prevent someone from finding their malicious activity.


    Additionally, it will be easy to identify deltas in the activities between a new
    admin and the previous admin (who is now on vacation) that might lead to the discovery
    of malicious activities:'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Comparison of Bandwidth Consumption


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_141_0.png)


    Figure 4.6 – The detection of malicious activity with mandatory vacations


    Figure 4.6 shows a scenario in which a privileged user used to download more than
    4GB of data per week (which was considered to be normal) until the person was
    forced to take vacations and the use of bandwidth decreased by more than 400 percent,
