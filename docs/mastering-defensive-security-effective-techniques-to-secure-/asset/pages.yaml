- pgno: 337
  md: '# # 11nSecure Development and Deployment on the Cloud


    > > "Cybersecurity is key for our work supporting Cloud and Service Management.
    In fact, the ability to act with efficiency and speed against cyberthreats are
    vital and a key differentiator."

    - Dario Sarmiento, Manager, Infrastructure Services for Gulf and Levant region
    - Kyndryl


    Nowadays, most companies have their IT environments hosted on the cloud, because
    that normally means better uptime, more resilience, faster deployment, lower risk,
    and even better security standards.


    However, this migration to the cloud also brings a plurality of risks and vulnerabilities
    that need to be assessed to keep your infrastructure secure.


    Therefore, in this chapter, we are going to start by discussing the different
    types of clouds and data (and how to keep them secure).


    Then, we are going to get even more technical by reviewing how to make your Kubernetes
    implementation more secure.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'Additionally, we are going to go over some best practices to harden your cloud
    databases and also discuss the best systems to monitor your cloud infrastructure.


    Here are the main topics that we will cover in this chapter:


    +   - Secure deployment and implementation of cloud applications

    - Securing Kubernetes and APIs

    - Hardening database services

    - Testing your cloud security


    # Technical requirements


    There are no technical requirements for this chapter, however, you can create
    free accounts to test some of the tools that we will review. Also, most of the
    cloud services offer free trials (tiers) that you can leverage to put the concepts
    into practice.


    # Secure deployment and implementation of cloud applications


    Almost all companies have a least portion of their business on the cloud. However,
    each company is unique, and their implementation of cloud services could be a
    blend of the different cloud models available, as explained next.


    # Security by cloud models


    There are three types of cloud models: **Software as a Service (SaaS), Platform
    as a Service (PaaS), and Infrastructure as a Service (IaaS)**. Each of these models
    is very different from the others and therefore the security measurements that
    need to be applied for each of them. Therefore, let''s start by giving a quick
    introduction to the three types of cloud environments to better understand what
    we are aiming to protect.


    # Software as a Service (SaaS)


    This is basically a piece of software loaded on the cloud that can be easily accessed
    by the user through a web interface. Some examples are the following:


    +   - Web-based emails such as **Gmail** and **Outlook**

    - Web tools such as web-based billing systems or ticketing systems

    - Web-based productivity applications such as **Office 365** or **Google Workspace**'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Platform as a Service (PaaS)


    This provides a platform for developers to create their own apps. Some examples
    are as follows:


    +   - Containers such as Docker and Kubernetes


    +   - Software development repositories and versioning control systems as GitHub


    +   - Cloud-based platforms such as Windows Azure


    # Infrastructure as a Service (IaaS)


    This provides the base architecture for system administrators to create their
    own systems and infrastructure. Some examples are as follows:


    +   - Amazon Web Services (AWS)


    +   - DigitalOcean


    +   - Rackspace


    In these cloud environments, security responsibilities are shared between the
    cloud users and the cloud provider.


    The following figure highlights who is responsible for the implementation of some
    security mechanisms based on the type of cloud in:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_339_0.png)


    Figure 11.1 – Cloud security responsibilities


    Now, let''s have a look at how data security should be managed in cloud environments.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Data security in the cloud


    There are three types (or states) of data in cloud environments: **data at rest,
    data in transit**, and **data in use (memory)**. Therefore, you need to ensure
    that your data is always secure, regardless of the state. So, let''s see the best
    practices to secure your data in all the different states.


    # Securing data at rest


    Data at rest is basically all the data stored in your cloud or cloud systems.
    The best way to secure data at rest is by using encryption, however, the application
    of encryption varies between the types of cloud as illustrated in the following
    figure:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_340_0.png)


    > Figure 11.2 – Encryption implementations based on the type of cloud


    Notice that for **PaaS** and **SaaS**, encryption of data at rest is mostly managed
    by the provider. Therefore, before selecting a cloud provider, you *must* check
    with them whether they offer some kind of encryption for data at rest (remember
    that this also includes backups).


    # Securing data in transit


    Data in transit is basically the flow of data between endpoints (from your machine
    to the cloud and vice versa). Securing this data is a bit more complex because
    it often requires some coordination between the cloud provider and the user.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Secure deployment and implementation of cloud applications


    For example, securing data in transit for SaaS is normally achieved by using a
    secure protocol of transmission such as SSL (HTTPS). As illustrated in the following
    figure, HTTPS prevents man-in-the-middle attacks by encrypting data in transit:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_341_0.png)


    Figure 11.3 – Secure SSL connections versus HTTP


    Securing data in transit for PaaS normally requires the user to perform some configuration
    on the cloud side, plus using some secure settings on the computer (for example,
    using a secure API to transfer data between the endpoint and the cloud). As seen
    in the following figure, using an API key ensures end-to-end encryption between
    endpoint devices and the PaaS:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_341_1.png)


    Figure 11.4 – Example of secure API key implementation in cloud


    Securing data in transit for IaaS is mostly done by the user by setting up secure
    channels to connect to their systems and infrastructure in the cloud, for example,
    using SSH.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '320 Secure Development and Deployment on the Cloud


    The following figure shows the GUI of PuTTY, which is the most famous SSH client
    that you can use to ensure that the communication with your cloud server is secure:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_342_0.png)


    Figure 11.5 – PuTTY SSH client


    Now, let''s look at the data state that is normally overlooked but is super important
    to secure: data in use.


    # Securing data in use


    Data in use is basically the information in Random Access Memory (RAM). In the
    past, this data was not considered as vulnerable, however, attackers discovered
    ways to retrieve information from memory, so it is important to ensure that mechanisms
    are in place to protect this data.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'The main way to protect this type of data is at the OS level ensuring the server
    and applications are patched with the latest security updates to prevent any memory
    leak.


    SaaS users can apply some mechanisms to reduce the risks of these attacks, such
    as the following:


    +   - Close the cloud session when not in use.

    - Log out from the web tool (instead of just closing the browser).


    PaaS users can apply the same best practices as SaaS users, plus also ensure that
    they use the latest version of the platform available and avoid the use of platforms
    with known vulnerabilities that can lead to a memory leak.


    IaaS users need to go a step further by following these best practices:


    +   - Install the latest version of the OS.

    - Perform regular patching of the OS.

    - Keep all software up to date (especially with security updates).

    - Remove any vulnerable software from the servers.


    We just covered the basics of cloud security. Now, it''s time to move to a deeper
    topic to understand how we can enhance security when working with Kubernetes.


    # Securing Kubernetes and APIs


    Kubernetes is one of the most used platforms to deploy cloud applications. Due
    to its popularity, it is important that you understand the basics of securing
    Kubernetes to enhance the protection of your cloud environment.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Cloud-native security


    To better understand how Kubernetes security relates to cloud security, let''s
    look at the following figure, which explains the layered model of the **four Cs
    of cloud-native systems:**


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_344_0.png)


    As seen in the preceding figure, this is a layered model based on the **Defense
    in Depth (DiD)** model, designed to enhance the security of cloud-based developments.


    The first line of defense is the cloud itself (a topic that we just covered),
    however, there are specific aspects that you may take into consideration that
    are related to each cloud provider, so the best practice is to check the page
    of your cloud provider to better understand their security capabilities.


    As a bonus, the following figure provides links to the security pages of the main
    cloud providers:


    +   - Amazon](https://aws.amazon.com/security/)

    - Alibaba Cloud](https://www.alibacloud.com/trust-center)

    - Google Cloud](https://cloud.google.com/security/)

    - IBM](https://www.ibm.com/cloud/security)

    - Microsoft Azure](https://docs.microsoft.com/en-us/azure/security/azure-security)


    Figure 11.7 – Security links for cloud providers'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'You can find these links in the Further reading section, too. Now, the next
    layer is the cluster (in this case Kubernetes), so let''s take a deep dive into
    the best practices to secure our Kubernetes.


    # Controlling access to the Kubernetes API


    Here, the recommendation is to use Transport Layer Security (TLS) for all Application
    Programming Interface (API) traffic and make sure that authentication, authorization,
    and admission controls are properly enabled and configured.


    # Controlling access to kubelet


    Requests to the kubelet HTTPS endpoint (that are not rejected by other configured
    authentication methods) are treated as anonymous requests by default.


    Therefore, the best practice is to enable authentication and authorization on
    production clusters to prevent any security risk.


    # Preventing containers from loading unwanted kernel modules


    Attackers can load kernel modules by creating a socket of the appropriate type
    that will enable the attacker to exploit a vulnerability on a kernel mode that
    the administrator assumed was not in use.


    To prevent this, you can uninstall the modules from the node, or blacklist them,
    by creating a file such as /etc/modprobe.d/kubernetes-blacklist.conf with contents
    such as the following:


    ```

    blacklist dccp

    blacklist sctp

    ```


    If you want more information about this command, visit the following site: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/deployment_guide/blacklisting_a_module.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Restricting access to etcd


    Access to etcd must be restricted because it is giving root permissions in the
    cluster. Therefore, here are two recommendations to prevent unauthorized access
    to etcd:


    +   - Use strong credentials from the API servers to the etcd server. And by strong
    password we make a long and crazy password that you can create and manage with
    a password vault. I''ve seen many people creating 12-digit passwords for this,
    which makes sense because they will be stored in a password vault, so go wild
    and create the biggest and strongest password possible.

    - Use a separate etcd instance for non-master components.


    Additionally, considering the sensitivity of etcd, another best security practice
    is that only the API should have access to it, and only grant permissions to those
    nodes that must have access to the etcd.


    # Avoiding the use of alpha or beta features in production


    You may find very cool features for Kubernetes that are in an alpha or beta stage.
    In those cases, the recommendation is to wait until they are final before using.


    Alpha or beta features may have unresolved flaws that may put your entire cluster
    in danger. It is important to mention that this tip in fact applies to all software
    and hardware (not just Kubernetes).


    # Third-party integrations


    In a similar way to the previous tip, third-party integrations may sound very
    cool and give you the feature that you were looking to implement, however, as
    with any other integration, you need to test those integrations before installing
    them in a production environment.


    Also, remember to always do a search about integration on the internet to see
    what others say about them. Compatibility issues, vulnerabilities, and even crashes
    are some of the things that you will be glad to discover on the internet before
    they happen to you.


    Now, the two components of the four Cs of cloud-native security system are Code
    and Containers, which are normally the responsibility of the developers. However,
    as a cybersecurity professional, it would be good to ensure that the development
    teams are following at least some sort of framework for secure code development
    to reduce the risks in your cloud environment.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Hardening database services


    Getting access to the databases is probably the most wanted treasure for an attacker.


    And this is not just because of the data they can access, but because by getting
    access to those databases, the attacker may gain access to other systems, create
    new users, and more.


    Now, you have to consider when talking about databases, we are talking about a
    huge field in which each system and technology may have its own hardening steps.
    Therefore, it is better for you to understand basic best practices that apply
    to most databases, as presented here:


    +   - Basic security settings such as encryption and auditing must always be on.


    +   - Use advanced tools to monitor, detect, and deny access to data (if possible,
    look for new solutions that include AI components to enhance the detection of
    intrusions.


    +   - Administrative accounts (such as DBA accounts) must use a stronger password
    criteria (when possible, 60+-character passwords and a password manager).


    +   - Always basic security policies such as principle of least privilege (PoLP)
    and segregation of duties (they are explained in detail in Chapter 3, Comprehending
    Policies, Procedures, Compliance, and Audits).


    +   - Database segregation may help you better control the data and the associated
    controls. For example, segment databases based on regulatory controls.


    +   - Always determine whether the data will be accessed internally or externally
    and apply the controls appropriately.


    +   - Analyze and, and if possible, leverage the security features provided by
    the cloud provider.


    +   - Analyze and, if possible, leverage the security features provided by the
    database developer.


    +   - Leverage compliance standards to improve the security of your databases
    even if you don''t need to comply with them (for example, PCI-DSS).


    +   - Avoid the use of customer data in test environments.


    +   - When possible, use a policy manager to enforce your security policies.


    +   - Use enhanced solutions (such as Google Secret Manager) to store sensitive
    information such as API keys, passwords, certificates, and more.'
  merge: -1
  img_proc: true
