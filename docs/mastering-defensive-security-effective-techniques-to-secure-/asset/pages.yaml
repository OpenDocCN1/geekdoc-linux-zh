- pgno: 302
  md: '# USB threats


    As seen in Chapter 2, Managing Threats, Vulnerabilities, and Risks, there are
    many malicious USB HID devices that when connected can be used to execute a plurality
    of attacks.


    As mentioned in that chapter, most computer systems are vulnerable to these attacks
    because they leverage the inherent trust of HID drivers and are therefore not
    detected by most antivirus systems or even USB OS restrictions (as those apply
    to mass storage devices and not HIDs).


    Some examples of those USB devices are the following:


    +   - USB Rubber Ducky

    - Bash Bunny

    - O.MG Keylogger Cable


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_302_0.png)


    Figure 9.9 – The Bash Bunny


    In Chapter 2, Managing Threats, Vulnerabilities, and Risks, we learned how to
    protect our environment against those USB threats. However, let''s do a quick
    recap:


    +   - Use Windows Defender to detect USB HID threats.

    - Implement a script to detect scripted attacks (such as DuckHunt).

    - Install a USB physical blocker to prevent the connection of USB devices.

    - Create proprietary software to block suspicious USB devices based on USB descriptors
    or metadata such as manufacturer, model, type, and so on.

    - Avoid leaving USB ports exposed in customer service machines (easily accessible
    by external people).


    But above all these mechanisms, the very protection against these attacks is to
    prevent the access of external people to controlled corporate spaces (such as
    meeting rooms, cubicles, offices, and so on). We will cover these physical protection
    mechanisms in the next section – Physical security mechanisms.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Understanding physical security and associated threats 281


    # Equipment theft


    Sometimes when performing a high-level risk analysis, non-technical teams may
    think only in terms of the cost of replacing a compromised device, and therefore
    during a simple analysis, they may decide not to invest in physical security because
    it is higher than the cost of replacement. However, in these situations we need
    to show them it is not only about the value of the device (hardware), but also
    other, more expensive associated risks. These could be some of the following:


    +   - The cost of losing the data on that device (due to the lack of an up-to-date
    backup)

    - The cost of exposing confidential data

    - The cost of exposing client data

    - The impact on the availability of services (for example, if the device was hosting
    a system, or a system administrator may momentarily lose the ability to support
    a production system)

    - The impact on delivery dates (some project deliverables or code was lost with
    the device)

    - The cost of setting up a device (setting up devices with some specific tool
    may bring additional costs in time of hours required by IT and the loss of productivity
    of the device)

    - Vulnerability to offline cracking attacks (an attacker can perform offline attacks
    that are faster and easier over stolen devices)


