- pgno: 279
  md: '# Introducing Wireshark


    Wireshark is one of the best cybersecurity tools to monitor and secure networks.


    This chapter aims to give you an overview of the tool and the main things that
    you can achieve with it. However, if you want to learn more about Wireshark, look
    at the book Learn Wireshark by Lisa Bock, from Packt, which has more than 400
    pages of knowledge that will help you to become an expert with this tool.


    The main characteristic of Wireshark is the ability to gather all network traffic
    passing through a given network adapter and decode the captured bits into a human-readable
    format. This is achieved by using decoders or dissectors that are constantly updated
    by the community.


    Wireshark can be installed on any OS, but as you may know, it comes preinstalled
    on Kali Linux, so for example we are going to use the version on Kali, which in
    our case is 3.2.7.


    The very first step to capturing your first packets will be to select the network
    card that we want to "listen" to. As shown in the following figure, the Wireshark
    landing page already shows the available network cards that we can easily select
    one and start capturing the packets:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_279_0.png)


    Figure 8.15 – Wireshark''s initial screen'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Enhancing Your Network Defensive Skills


    However, if you have several network cards (interfaces), it could be confusing
    to know which one you need to select.


    The trick is to click on Interfaces, which will display a window with detailed
    information about all network interfaces. From there, you can determine which
    is your active interface by looking at the traffic column.


    If there is no activity on the traffic column, just ping a server, for example,
    ping www.google.com, and as shown in the following figure, you will start seeing
    the traffic column move on your active network interface. In this case you can
    determine that your active interface is eth0, so we can click on it and then click
    Start to begin the capture of packets:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_280_0.png)


    Figure 8.6 – Active interfaces on Wireshark


    OK, now that we started the monitoring, let''s see what happens when we open a
    web page.


    > TipnMost pages have a lot of ads that will make the scan very noisy, so in order
    to avoid the noise, we will open the page of a university for this example. Additionally,
    using a virtual machine with Kali is great because it does not have all the network
    overhead carried on Windows systems (if you run Wireshark on a Windows machine,
    you will see lot of ads if you are supposed using the network).'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Introducing Wireshark 259


    The following figure shows the output of a scan that we performed on a web page
    so you can become familiar with the capabilities of the tool and better understand
    them:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_281_0.png)


    Figure 8-17 – Wireshark scan results


    Let''s start by analyzing the outputs of the preceding figure. You will see that
    the very first packet is from your computer asking the DNS server for the IP of
    the web page. Here, you can validate that the request is going to the required
    DNS server – in our case it is going to 8. 8. 8. 8 (Google''s DNS). If you notice
    another DNS you may be in the presence of a DNS attack that may reroute your traffic
    to malicious sites.


    Once we get the IP from the DNS server, we start to see exchange of basic TCP
    packets. After that, we receive some HTTP packets (which is basically the web
    page that we requested), which is encrypted with an SSL certificate (HTTPS).


    > Tip

    You can easily sort the results by clicking on the column name of the column.
    For example, you can use the filter tab to sort all the packets captured by protocol.


    Now, let''s review more advanced details of Wireshark to enhance your security,'
  merge: -1
