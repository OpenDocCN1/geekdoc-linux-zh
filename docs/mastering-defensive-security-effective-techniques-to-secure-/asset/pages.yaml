- pgno: 62
  md: '# Managing Threats, Vulnerabilities, and Risks


    Now, let''s review the process that you need to follow to properly manage the
    vulnerabilities on your infrastructure like a pro!


    # The vulnerability assessment process


    Each company has its own unique way in which to perform a vulnerability assessment,
    however, most of them are based on the following stages.


    # Vulnerability identification


    This step is about how you identify the vulnerabilities on your systems and networks.
    Here, you can use well-known tools as vulnerability scanners or even a penetration
    test to perform an effective identification.


    # Vulnerability analysis


    Once you identify a vulnerability, it is time to analyze and gather as much information
    about it as possible. For example, you need to consider the following questions:
    how much will it cost me if vulnerability is exploited against my company?; how
    many people will be affected?; and what is the source of the vulnerability?


    It is very common to perform a Root Cause Analysis (RCA) to find the root cause
    of the vulnerability and the associated cost to fix it.


    # Risk assessment


    This is about performing a risk assessment to evaluate the risk in terms of probability
    and impact (both qualitative and quantitative). But it is also used to determine
    other factors such as cost analysis, mitigation analysis, and more.


    # Vulnerability remediation


    Once you have all of those analyses, you must proceed with the implementation
    of the best remediation (or, at the very least, the one selected by upper management)
    to reduce the risk associated with your vulnerability:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Understanding cybersecurity vulnerabilities and threats 41


    Notice that this process is iterative because any given remediation might introduce
    a new vulnerability into your infrastructure.


    # When should you check for vulnerabilities?


    You must constantly be on the lookout for new vulnerabilities; however, there
    are some events in which you must do an assessment to find new vulnerabilities.
    Here are some examples:


    +   - Before the purchase of any devices, systems, or software: Make sure that
    the manufacturer constantly releases patches for known vulnerabilities.


    +   - Every time a new system is acquired: There will be cases when a new system
    is acquired without your consent. So, in those cases, you will need to make sure
    that any vulnerability is fixed before implementation.


    +   - When a new business is acquired: This is to ensure your security policies
    match your security policies.


    +   - When a new office/branch location is opened: This is to check for vulnerabilities
    related to availability (the redundancy of services) as well as physical security


    +   - When moving to another physical location: This is similar to the previous
    example. You need to make sure the new location does not add any new vulnerabilities
    regarding availability and physical security.


    +   - The contract of a new contractor: This is to make sure they don''t bring
    equipment that could bring vulnerabilities to your environment; for example, a
    third party that is hired to perform a job in your company should not be using
    a non-supported operating system (such as Windows XP).


    Now, let''s do in-depth review of the most common types of vulnerabilities that
    you could face as a cybersecurity professional.


    # Types of vulnerabilities


    There are many types of vulnerabilities. However, here, I will try to summarize
    the most important ones.


    # Software vulnerabilities


    Bugs, design flaws, backdoors, and zero-day are among the most common software
    vulnerabilities that you will face. The good thing is that there are tools aimed
    at searching for those vulnerabilities, and we will review them in greater depth
    in Chapter 13, Vulnerability Assessment Tools.'
  merge: -1
  img_proc: true
