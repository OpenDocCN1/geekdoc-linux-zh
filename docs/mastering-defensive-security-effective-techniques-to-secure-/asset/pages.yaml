    regarding customer use or habits (very useful to improve future products). Additionally,
    companies can create connected ecosystems by sharing services, data, or features
    through devices, greatly enhancing user experience.


    But those implementations also bring a plurality of risks that you must know and
    understand in order to create a strategy to properly protect against them.


    # The risks


    Most IoT devices were created to enhance the user experience. However, in many
    cases, those devices were not designed to be secure by design. This could represent
    a risk to your network and data.


    Let''s look at the two main types of IoT implementations and the associated risks
    of each one.


    # Industrial IoT


    The main risks in industrial IoT environments are as follows:


    +   * Loss of data from sensors

    * Corruption of data from sensors

    * Jamming of sensors

    * Industrial espionage

    * Device hijacking'
