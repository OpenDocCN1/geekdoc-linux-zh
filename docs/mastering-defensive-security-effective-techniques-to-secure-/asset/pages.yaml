  md: '# Summary


    By now, you should have mastered all the aspects of securing your web applications.
    In this chapter, we have learned about active and passive data gathering of your
    web application and the best tools used to discover sensitive data about your
    web application on the internet. We also learned about the risk of not obfuscating
    public information about your web application.


    We also learned how to install, configure, and use the best virtual environment
    to become familiar with the most common vulnerabilities on web applications (the
    DVWA platform). Additionally, we explored how to install, configure, and use the
    best tool to assess the security of a given web application in real time (Burp
    Suite).


    And we also experienced a hands-on example to see how easily an attacker can take
    advantage of common vulnerabilities to exploit your web application.


    But there are many other tools to find vulnerabilities in your web application
    and even the entire infrastructure, let''s move to the next chapter, in which
    we will review the best tools used to perform vulnerability assessments like a
