- pgno: 169
  md: '# Defending from wireless attacks


    Wireless networks are far by the used connection types, making them a big target
    for cybercriminals. Therefore, you need to be ahead of them and make sure that
    wireless security is a fundamental part of your cybersecurity strategy.


    There is an entire section in Chapter 8, Enhancing Your Network Defensive Skills,
    dedicated to network tools. However, here, we will take a look at the most important
    tools that are used in wireless attacks so that you can be ahead of the attackers
    and plan your defensive strategy accordingly.


    # The almighty WiFi Pineapple


    This is a must-have for auditing Wi-Fi networks. Created by Hak5 back in 2008,
    this is probably the most recognized hardware pentesting tool in the world – maybe
    because of the power of this small box, its ease of use, and the huge variety
    of tools that it contains on a single device.


    > Tip The geniuses at Hak5 put tremendous effort into keeping this tool up to
    date with the latest Wi-Fi auditing tools (for example, the MarkV received 22
    firmware updates). However, there is a point where the hardware needs to be upgraded
    to include new tools (and improve the existing ones in terms of speed, range,
    and so on). Therefore, and considering the wide range of WiFi Pineapple versions,
    we decided to make this section as generic as possible to try to generally cover
    the tools available in most of the WiFi Pineapple versions.


    Now, let''s explore some of the features of this fantastic tool.


    # Rogue access point


    Have you ever noticed that your smartphone automatically connects to the wireless
    of your preferred café you connect to for the first time?


    Well, that feature was created to improve the user experience, but it also represents
    a serious security vulnerability.


    To exploit this vulnerability, the attacker needs to mimic one of those trusted
    Wi-Fi access points (AP) so that the victim device will automatically connect
    to it. But the question is, how does the attacker know the name of the trusted
    networks on the victim’s device? Well, here is where the clever attack starts.


    First, let’s take a look at the theory and concepts behind this attack.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 148 Cybersecurity Technologies and Tools


    When your device (laptop, smartphone, and so on) has Wi-Fi turned on and it is
    not connected to any network, it will broadcast Probe Request Frames (PRFs), which
    contain the list of SSIDs that your device trusts. These frames are captured by
    AP that review and see whether their SSID is on the list; if so, it will start
    the connection process:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_170_0.png)


    Figure 5.1 – Probe request/response structure


    The magic (or evil) of this device is that it takes advantage of the fact that
    probe requests are not encrypted, captures them, and reads the list of trusted
    and open SSIDs.


    Then the device automatically creates an open AP (with no password) and uses the
    name of one of the trusted and open SSIDs. At this point, the victim''s device
    will connect immediately to it.


    Now when the victim''s device is connected to the rogue access point, the attacker
    can execute a plurality of attacks, including the famous man-in-the-middle attack,
    which will be discussed in detail in Chapter 8, Enhancing Your Network Defensive
    Skills.


    > Tip

    Remember that the better you know the tools that will be used against you, the
    better you can prepare to reduce the probability and impact of these attacks.


    Let''s stop for a second to think about the danger of this attack and analyze
    how you can leverage this for your defensive security strategy.


    You can reduce the probability of this risk by updating two policies: the BYOD
    policy and the network policy. In this case, just make sure to include the following:


    Wi-Fi must be be off while traveling and just enable it on secure locations (office,
    home, secure hotel connections, and so on).'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'As we saw in Chapter 4, Patching Layer 8, training is one of the most basic
    and effective tools in defensive security, and you can leverage great tools such
    as the WiFi Pineapple to make your training more engaging, but also to raise awareness
    about the potential impact of this attack.


    > Tip

    You can raise awareness by performing yearly security campaigns, such as a cybersecurity
    week. Here, you can leverage this cool gadget to demonstrate that those attack
    vectors are real, easy to perform, and have devastating effects on your personal
    and professional data, systems, and devices.


    Additionally, keep in mind that most users think that this type of attack will
    not happen to them (because they look too sophisticated), but when they see how
    easy it is to carry out the attack, they will be more receptive to adapting any
    policy or strategy that you put in place to prevent this type of attack, transforming
    your users from encountering a cybersecurity threat into defensive agents.


    # Recognizing an unauthorized AP in your infrastructure


    The WiFi Pineapple has a cool module called Recon. This is a very clear interface
    that allows you to see the invisible. This because will show you about what is
    happening with the Wi-Fi (AP and devices) in your infrastructure.


    Let''s explore the valuable information that you can gather here:


    +   * Information about the SSID (broadcasted or hidden).

    * MAC address of the AP.

    * Security type (WPA, WPE, mixed, and so on).

    * Information about whether WPS is enabled.

    * Wi-Fi channel used by the AP.

    * Signal strength.

    * Clients connected to each AP.

    * Client information, including the MAC address and name of the manufacturer (gathered
    by analyzing the first three octets of the MAC address dynamically).

    * You can also discover clients that are not associated with any AP (including
    IoT devices, speakers, cameras, and so on).'
  merge: -1
  img_proc: true
- pgno: 172
  md: '150 Cybersecurity Technologies and Tools


    Now, you can leverage all this data to perform the following defensive actions:


    +   * Detect unauthorized APs.

    * Detect rogue APs (obfuscated by a hidden SSID).

    * Detect violations to network policies related to the security required for APs.

    * Detect vulnerable APs (a weak security type or WPS enabled).

    * Detect performance issues or interference from other systems due to saturation
    or utilization of a given Wi-Fi channel.

    * Determine vulnerabilities due to devices connected to an AP they should not
    connect to or an AP with unauthorized devices connected.

    * Detect potential attacks performed by another WiFi Pineapple.

    * Detect unauthorized devices in your infrastructure.


    > Tip

    As in this section, you can leverage this device to create your very own low-cost
    Wi-Fi monitoring tool, customize it based on your needs, and deploy it in no time.


    Additionally, there are some actions you can perform over those APs points, including
    the following:

    * **Add SSID to PineAP Pool**: This will make the WiFi Pineapple start mimicking
    the selected SSID. As we mentioned previously, this is a great tool that you can
    leverage during an event to *raise awareness* about how easy an attacker can perform
    this attack, and therefore the need to follow the policies, methods, systems,
    and tools to prevent it.

    * **Add SSID or clients to filter**: This is very useful when performing a *pentest*
    or audit to ensure that just a group of selected devices or APs connect to your
    WiFi Pineapple.

    * **De-authenticate clients**: With this option, the WiFi Pineapple will leverage
    another vulnerability in the 802.11 protocol. It will do so by pretending to be
    the AP and sending a command to the connected devices to immediately disconnect
    from the AP.


    This could be useful in a situation where you need all the devices to immediately
    disconnect from a given AP. In this case, instead of looking for each device owner
    and requesting them to disconnect, you can do this very easily with a single click
    of your mouse, reducing the time of being exposed to a possible threat.'
  merge: -1
  img_proc: true
