    # Detecting rogue access points


    Rogue access points are a huge threat to our networks, systems, and data.


    They are basically malicious access points designed to mimic one of your original
    access points and perform a plurality of attacks.


    # The threat


    A rogue access point represents a huge threat to your infrastructure and data
    because it can be used to launch a variety of dangerous attacks, such as the following:


    +   - Man in the middle

    - De-authentication attack

    - Probe request monitor

    - Intercept, inspect and replay web traffic

    - Credentials harvesting

    - DHCP starvation attack

    - Windows Update attack'
