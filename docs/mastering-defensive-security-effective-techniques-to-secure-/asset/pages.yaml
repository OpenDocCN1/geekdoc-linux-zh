- pgno: 158
  md: '# Shoulder surfing


    This might sound very basic, but a lot of information is leaked using this simple
    method. Essentially, it involves looking over the shoulder of the victim to gather
    sensitive information, such as usernames, passwords, and more.


    This is normally done by outsiders, so having a strong physical security system
    is key to prevent this type of attack.


    Another recommendation for employees who constantly travel the use of privacy
    screens that prevent others from reading your screen. Additionally, the use of
    password vaults reduces this risk, because passwords do not need to be typed,
    and therefore, there is no risk of disclosure.


    # Tailgating


    Now that we have mentioned physical security, it is time to talk about tailgating.


    This is one of the most common methods used by attackers to gain physical access
    to a restricted location.


    Here, the attacker will leverage the human characteristic of being polite or friendly
    to keep the door open for the person behind you.


    Attackers are very creative and, many a time, they will carry a big pizza box
    or a couple of delicious coffee as an excuse for not using a badge to access the
    building and hoping that a "good person" (that is, an inadvertent user) keeps
    the door open for them.


    Besides the application of user training, the best way to fight this type of threat
    is by using additional verification mechanisms such as cameras to detect outsiders.
    In fact, cameras can now be used to detect outsiders using other methods beyond
    face recognition. These include movement patterns, user counts (if two people
    enter the system just reads one badge), analytics (based on the detection of unusual
    paths), and more.


    # Dumpster diving


    One of the most famous hackers, Kevin Mitnick, who, in fact, was the first hacker
    to appear on the FBI''s most-wanted list, made this tactic famous (this is explained
    well in his books).


    He commented that he was able to obtain a lot of information by simply searching
    in the company''s trash, looking for unshredded documents with confidential information.
    In some cases, the attacker might be lucky to find sensitive information such
    as user credentials; however, in other cases, the attacker will use this to gather
    important information about the company, which can be successfully used to perform
    other attacks (such as impersonation).'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Mastering the art of social engineering 137


    To avoid this attack, you must create a data classification and management policy
    that clearly defines the following:


    +   - The different types of documents (such as sensitive, confidential, public,
    and more)

    - The appropriate way to dispose of each document type

    - The appropriate way to dispose of physical documents (for example, notes, books,
    sticky notes, and more)


    These policies are easier to enforce when users are at the office. However, with
    an increasing number of users now working from home, you must apply additional
    mechanisms to ensure these policies are being followed and that your users have
    the appropriate tools to carry them out. For example, provide a shredder machine
    to users with sensitive information or restrict the printing of sensitive documents
    at home.


    # Quid pro quo


    This is a very interesting attack in which the attacker provides some benefit
    to the victim for free.


    A classic example is when an attacker calls the employees of a given company impersonating
    an IT person doing a callback that is related to an open ticket. As you can see
    in the following example, the victims are very likely to “take advantage” of the
