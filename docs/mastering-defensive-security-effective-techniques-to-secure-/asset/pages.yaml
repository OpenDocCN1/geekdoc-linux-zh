  md: 'Managing cybersecurity''s legendary pain point: Passwords 23


    # # Hash attacks


    As mentioned previously, passwords are not stored in plain text (well, at least
    they shouldn''t be), normally they are stored as hashes. Hashes are normally called
    one-way hash functions, meaning that they were created to be mathematically impossible
    to create a reverse function to obtain the plain text based on the hashed value.


    This sounds very cool, clever, and secure, but it is NOT! (I think hackers are
    clever).

    To crack them, hackers use something called Rainbow tables. The concept is very
    simple. Basically, it is a database of hash/plain text combinations that can be
    used to determine the corresponding text of a given hash and this is possible
    because the hash value of a word or phrase will always be the same.


    Rainbow tables are huge (they may contain billions of combinations), making this
    kind of attack very dangerous.


    > If you want to play around with rainbow tables, you can visit this site you
    can download a collection of them: https://crackstation.net/crackstation-wordlist-password-cracking-dictionary.htm.


    However, do not worry! There is a way to defend against Rainbow table attacks;
    you just need to do what you do when you get a salad....Add Salt and Pepper!


    # # Defensive solution – Using salt and pepper


    Despite the funny name of this technique, this is actually a very powerful mechanism
    for protecting against Rainbow table attacks and it is actually simpler than what
    you may expect.


    # # The salt


    This entails adding randomly generated text to your password before being hashed.
    This salt is saved on the same password database to be used for further authentication:


    ```

    $Salt = random bytes [$Salt]

    $Hash = SHA [$password + $Salt]

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 24 A Refresher on Defensive Security Concepts


    Why should the salt be the same, then the attacker will be able to identify users
    using the same password as the salt used here:


    ```

    $Salt = random_bytes [$Salt]

    $Bob_Psswd = [$password + $Salt] Hash = 68586044d92547dc605b

    $Jake_Psswd = [$password + $Salt] Hash = 68586044d92547dc605b

    ```


    But if they use a different (randomly created) salt, the hash will be completely
    different and therefore an attacker won''t be able to determine which one they
    are:


    ```

    $BobSalt = random_bytes [$Salt]

    $JakeSalt = random_bytes [$Salt]

    $Bob_Psswd = [$password + $BobSalt] Hash = 10db4775dc38f4

    $Jake_Psswd = [$password + $JakeSalt] Hash = dc7411ef9525h

    ```


    So, as seen in the preceding example, even if Bob and Jake use the same password,
    the attacker won''t be able to determine that the salt used is different.


    # The pepper


    As mentioned, the hash and the salt are stored in the same database, so if an
    attacker can access the database, the hash can be compromised if ever salted.


    To reduce this risk, we can add another string of characters (just like the salt),
    but this time this value is saved as a secret to the attacker because even the
    main database is compromised, the pepper will remain secret:


    ```

    $Pepper = I.am.the.Pepper

    $BobSalt = random_bytes [$Salt]

    $JakeSalt = random_bytes [$Salt]

    $Bob_Psswd = [$password+$BobSalt+$Pepper] Hash = h1lk477g56

    $Jake_Psswd = [$password+$JakeSalt+$Pepper] Hash = o28414115h

    ```


    In the preceding example, we can see how the password is composed on the basis
    of three variables (the password, the salt, and the pepper), which increases the
    complexity exponentially to crack it.


    In terms of the implementation, it is up to you if you want the salt to be added
    in front of the password or at the end of the password. The important thing is
    that it is added before the hash is created. As my math teacher used to say: the
    order of the factors does not alter the product.'
  merge: -1
  img_proc: true
