- pgno: 282
  md: '# Finding users using insecure protocols


    As you know, users will always find creative ways to bypass your administrative
    and technical controls. In those cases, using a monitoring tool as Wireshark is
    a great way to find and stop those wrongdoers.


    # Telnet vulnerabilities


    Telnet is an old client/server protocol for machine-to-machine communications.


    The problem is that it does not offer encryption, therefore ALL communication
    is transmitted as cleartext.


    Due to risk, Telnet (both server and client) is disabled by default on most systems
    including Windows and even Kali Linux.


    Therefore, due to this risk, you must ensure that you have all technical and administrative
    controls in place to prevent the use of telnet for server login and communications.


    The good news is that you can easily detect if someone is using Telnet with Wireshark
    by simply filtering your results by protocol.


    # Capturing Telnet data in real time


    To perform this example, we first need to install the Telnet client on Kali Linux
    with the following command:


    ```

    sudo apt-get-install telnet

    ```


    Now that the Telnet client is installed, we can connect to a Telnet server, and
    for this example we are going to use an open (and funny) Telnet server.


    > But wait, didn''t you say Telnet was insecure?

    Yes, there are several vulnerabilities in Telnet servers and Telnet communications,
    however installing a Telnet client does not represent a vulnerability on your
    system.


    Let''s go back to Wireshark to set it up to capture all Telnet data, which is
    a super simple task. As you can see in the following figure, you just need to
    type telnet in the filter bar to see all Telnet connections in real time:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Introducing Wireshark 261


