    > Tip

    All interfaces are different (depending on the manufacturer), but the information
    should will be the same, so take some time to explore the interface and get familiar
    with it. Linksys has an emulator that you can use to get familiar with the interface
    at http://ui.linksys.com/E1200/1.0.


    Let’s see what attributes you want to make here for your wireless router more
    secure.


    # Admin password


    As you just, the password of your router may be very weak (and known to everyone),
    so the very first step is to secure the router by changing it. Depending on the
    router, it could be under tab called Management, Security, Login, or Users.


    > Tip – Use a passphrase

    The longer password, the harder it is for an attacker to crack it, so use a phrase
    that you can easily remember as your password, for example, I.Love my.wife.since.2014,
    or something motivational like I.am.sure.I.will.get.masters.in.2021. Of course,
    these are just examples, but create one that is unique to you with at least 25
    characters. As any other password, using special characters, slang, and popular
    phrases is better, because then your password will be strong against brute-force
    and dictionary attacks.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Admin user


    Attackers knows that the default username to connect to the router is normally
    admin, however some routers allow you to change that username. So, if you have
    option, it is highly recommended that you change that username as it will prevent
    most attacks as it will be targeted at a nonexistent user.


    # Wireless password


    As mentioned in the preceding section, the use of a strong (long) passphrase is
    recommended for your wireless network. Also, a good practice is to change it at
    least every 6 months.


    # Wireless security (security mode)


    Here you have three encryption options: WEP (highly insecure), WPA (vulnerable),
    WPA2 (recommended).


    # Wireless network name (SSID)


    By default, the SSID could be the brand of your wireless router plus some random
    numbers. This is not only ugly, but also dangerous because everyone will know
    the model of your router, attacking it will be easier. So, as a first step, change
    the name of your SSID to a name of your preference. Also avoid using your own
    name in the SSID that could make you an easier target. Therefore, an SSID like
    Harper Family should be avoided.


    > Tip–2.4 GHz and 5 GHz

    Most modern routers have two bands (2.4 GHz and 5 GHz) and in most cases, you
    need to configure them as if they are two different routers different SSIDs, different
    security modes, different passphrases, different guest accounts, and so on). Therefore,
    make sure that all settings are the same on both networks to avoid leaving holes
    in one of them.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Guest accounts


    Imagine your neighbor needs to connect to your Wi-Fi for a minute to send an urgent
    email. That means you need to reveal your ultra-secure passphrase, but now your
    passphrase is saved on their device, they can connect at any time they want. Now,
    if you change your passphrase to avoid that, then it means that you will have
    to re-enter the passphrase on all your devices. Therefore, to avoid all that,
    you can enable guest accounts. Guest accounts enable you to create an account
    for external people, which has a lot of advantages including the following:


    +   * They can be enabled temporarily and disabled to prevent any further access.

    * You can change the password any time you want without affecting your other devices.

    * Since you can use them as temporary accounts, you can create a new password
    every time you use them, making it almost impossible to crack.


    # Remote access


    Some routers have the option for you to access the management console from a remote
    location (through the internet). This is very insecure as it opens the doors to
    attackers to gain access to your router (and then your network and data). Therefore,
    always disable the remote access feature.


    # Disable WPS (both the button and PIN versions)


    As mentioned in the preceding section, WPS is a highly vulnerable protocol that
    must be disabled (and is normally enabled by default).


    To do so is very simple – just look for WPS settings on your router (as shown
    in the following figure) and click to disable WPS:


    | 2.4G/5G WPS Settings |

    | WPS Enable | |


    Figure 8.12 – WPS settings'
  merge: -1
  img_proc: true
- pgno: 277
