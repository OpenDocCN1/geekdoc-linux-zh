- pgno: 443
  md: 'While Metasploit is the most famous offensive security framework, there are
    other tools used by attackers to get into your systems, so let''s also look at
    other offensive security tools.


    # Other offensive hacking tools


    Let''s review the most famous offensive security tools currently available, both
    free and paid.


    # Searchploit


    We talked in previous chapters about https://www.exploit-db.com/, which is a great
    database with over 44,000 exploits available to download. The website is great
    and it shows a lot of useful information in a friendly way, but searching for
    an exploit on the page, downloading it, and then executing it could be a bit time-consuming.
    Here is where **Searchploit** comes into play. Searchploit is a command-line tool
    included in Kali Linux that allows us to search for exploits on exploit-db and
    run them directly from the terminal; yes, that''s easy!


    Let''s do a quick example. Imagine you added a Joomla server to your organization
    and you want to test it against known vulnerabilities. You can run the following
    command:


    ```

    searchploit -t joomla

    ```


    The -t option will just give us results in which word Joomla is the title of the
    exploit.


    Now, imagine your boss asked you to install a YouTube plugin on your Joomla server.
    Then, let''s see how we can find out about vulnerabilities related to that plugin:


    ```

    kalisploit -t joomla youtube

    ```


    As seen in the following figure, the tool found three vulnerabilities associated
    with YouTube plugins:


    | Exploit Title | Path |

    |---|---|

    | Joomla! Component Easy YouTube Gallery 1.0.2 - S | php/webapps/39590.txt |

    | Joomla! Component YouTube 1.5 - SQL Injection | php/webapps/14467.txt |

    | Joomla! Component YouTube Gallery 4.1.7 - SQL In | php/webapps/34087.txt |


    Figure 15.19 – Finding vulnerabilities using Searchploit'
  merge: -1
  img_proc: true
- pgno: 444
