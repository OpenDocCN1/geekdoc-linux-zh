    This is a great tool that you can leverage on your Python code interactively or
    as a library to manage packets gathered from network-sniffing software such as
    Wireshark.


    To install it, you can leverage the following command:


    ```

    pip3 install scapy

    ```


    Then, you can confirm scapy is installed with the following command:


    ```

    scapy

