    # # Applying secure file permissions


    Unix systems have a unique way to manage permissions, which is quite different
    from

    Windows systems, so let''s start with the basics about how permissions work in
    Unix

    systems.


    # # Understanding ownership and permissions


    Unix systems have three levels of file/folder ownership and this can be checked
    with the

    ls -l command.


    As seen in the following figure, the command shows a lot of information such as
    hard

    links, which created the file, the file size, the last modification, and the name
    of the file or

    folder, the most important part of ls is permissions:


    | kali | kali | 4096 | Jul 27 13:34 | Desktop |

    | drwxr-xr-x | 2 | kali | 4096 | Jul 27 13:34 | Documents |

    | drwxr-xr-x | 2 | kali | 4096 | Jul 27 13:34 | Downloads |

    | drwxr-xr-x | 2 | kali | 4096 | Jul 27 13:34 | ↓ |

    | Permissions links | Hard (Owner) User Group Size | Last modification | Folder
    name |


    Figure 7.7 – Results of the long listing of files (ls -l)


    Now, let''s take a look at the permissions section, as seen in the following figure.

    section is the type of the file (in this example we have for directory or folder).'
