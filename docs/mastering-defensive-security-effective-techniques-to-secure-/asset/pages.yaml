- pgno: 126
  md: '# Password compliance audits


    Most modern systems have tools in place to ensure user passwords are compliant
    with company policies; however, there are some legacy systems that lack this capability
    and therefore may enable users to select non-compliant passwords.


    Another risk is that privileged account (such as root) may be able to bypass those
    restrictions and set up a non-compliant password on other user accounts.


    Additionally, there is also a risk of devices being left with default passwords
    (very common on network and Internet of Things (IoT) devices).


    Therefore, many companies invest in having at least an annual review of their
    systems (servers, network devices, IoT devices, and others) to make sure that
    all passwords are compliant with current password policies.


    # What triggers an audit?


    There are several factors that may trigger an audit—for example, external audits
    are very expensive, so they are performed when required by a regulation such as
    PCI.


    Internal (corporate) audits are also expensive because of the resources that need
    to be dedicated to this effort, so these audits are normally scheduled by upper
    management based on budget.


    Now, you may wonder: Is there a mechanism that I can use to test my environment
    that is easier and faster but also enables me to know not just where I am in terms
    of security, but also how to achieve the next level?


    Yes—this is called a Cybersecurity Maturity Model.


    # Applying a CMM


    The main idea behind a CMM is to provide a standard mechanism for any organization
    to perform a self-assessment of their cybersecurity level.


    They are being used and implemented by many organizations all around the globe,
    from top multinational organizations to small businesses, and each can leverage
    all the advantages associated with the implementation of a CMM.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# The goals of a CMM


    A CMM is a great tool that allows cybersecurity professionals to achieve the following
    three goals:


    +   - Determine (by using a standardized mechanism) the level of cybersecurity
    of a given company.

    - Determine, based on company objectives (or regulations), the expected level
    of cybersecurity (based on a standardized mechanism).

    - A clear path to go from point #1 to point #2.


    # Characteristics of a good CMM


    A good CMM needs to have the following characteristics:


    +   - Easy to implement: We don''t want the complexity of an International Standards
    for Organization (ISO) system; we want something that can be self-explanatory
    and easy to follow so organizations can use their resources to implement it.

    - Integral view of cybersecurity: A good CMM is not just about assessing the servers
    and network but also assessing all the components that may affect the overall
    cybersecurity posture—for example, human resources (does the company have appropriate
    disciplinary processes in place?) or suppliers (controls; service-level agreements
    (SLAs); penalties).

    - Customizable: You should be able to easily tweak it based on the needs of the
    business. This means that you can add or remove sections without affecting the
    result of evaluation.

    - Scalable: A good CMM should be able to be used by a small company as well as
    a big international corporation.

    - Adaptable: It should be adaptable to any industry, any requirement, and any
    geography.

    - Clearly defined levels: The CMM must have the same levels (ratings) across all
    domains to ensure the results are realistic and can be successfully used as a
    benchmark.


    There are several kinds of CMM available—some of them are proprietary (used internally
    by some companies); some of them are private (you you need to pay first in order
    to see them, which I don''t think is a good idea); and some of them are public
    (those are the best because normally, they are open and receive feedback from
    the community).'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# The structure of a good CMM


    A good CMM must be modular so that the company implementing it can add or remove
    sections without impacting the final results—for example, not all companies have
    developers, so asking a company without developers to fill in those sections just
    to complete the model doesn''t make any sense.


    # Domains and controls


    When implementing the CMM, the IT person in charge of it (let''s say an analyst)
    will assess a plurality of items called controls.


    To make the implementation (including the analysis of the results) easier, the
    controls should be logically grouped with other related controls. These groups
    are called domains.


    As seen in the following, a good CMM evaluates other areas that have a direct
    impact on your cybersecurity strategy—for example:


    | Domain 03 - Cybersecurity and Human Resources |

    | Control 1 – Employee terms and Conditions |

    | Control 2 – Disciplinary Actions |

    | Control 3 – Cybersecurity training campaigns |


    Figure 3.11 – Domains and controls of ECM2


    ECM2 is modular and it contains a comprehensive list of 14 domains, from which
    you can select the ones that are relevant to your organization.


    # Maturity levels


    Now that you have the controls sorted by domain, it''s time to evaluate them.
    The evaluation should be done using a scale that clearly defines each level. The
    most common evaluation scales are 3-level, 5-level, and +7-level scale.


    A 3-level scale may be very simplistic and gives you very little room for rating
    and improvement, that is not the best option for you.


    On the other hand, a +7-level scale may be too complex to evaluate, analyze, and
    report, and since one of the goals of a CMM is to be simple to implement, then
    this is not a good option either.


    However, a 5-level scale is considered the best standard because it allows you
    to accurately rate a control or domain without unnecessary complications.'
  merge: -1
  img_proc: true
