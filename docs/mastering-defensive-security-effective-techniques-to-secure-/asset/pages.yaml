- pgno: 415
  md: '# ProcDOT


    As mentioned before, there are great tools, such as ProcMon and even Wireshark,
    that provide great insights to uncover potential malware; however, these two tools
    produce thousands of records, which makes the process of analysis of the data
    very complex and time-consuming.


    But here is ProcDOT comes in, as it enables you to correlate the data from those
    two sources (ProcMon and Wireshark) using interactive graphs, which greatly helps
    during the analysis process. Additionally, the tool has the following key features:


    +   * Animation mode (to easily understand timing aspects)

    * Smart following algorithms (help you focus on relevant items)

    * Detection and visualization of thread injection

    * Correlation of network activities (and the causing processes)

    * Activity timeline

    * Filters to clean up noise (global- and session-wise)


    The following screenshot shows the output of visual analysis and correlation from
    ProcDOT:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_415_0.png)'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Oh, this tool is also free and available at the following link: https://www.procdot.com/index.htm.


    # Ghidra


    Ghidra is a great software reverse engineering (SRE) suite developed by the National
    Security Agency (NSA) and distributed for free as open source since 2019. One
    of the main characteristics of the software is its ability to disassemble the
    code without executing it.


    Additionally, Ghidra also has the following features:


    Installation files and frequently asked questions (FAQ) can be found on the official
    page, at https://ghidra-sre/.


    # PeStudio


    PeStudio is a great tool for performing static malware analysis on Windows machines.


    A cool feature is that you don''t need to install it as it runs as a portable
    executable file for Windows. Also, consider that there is a basic version of the
    software available for free, while there is a premium version that can be purchased
    for a low price.


    Now, let''s do a deep dive into this tool by doing hands-on malware analysis.


    # Performing malware analysis


    First, let''s start by downloading the executable files from their site at https://winitor.com/download.


    Once you have the executable files, just double-click on them to run them. Then,
    you will be able to see the main interface, as shown in the following screenshot:'
