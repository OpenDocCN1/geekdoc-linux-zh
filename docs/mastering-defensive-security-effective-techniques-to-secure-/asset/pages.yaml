- pgno: 268
  md: '# Improving the protection of wireless networks


    To better explain this, let''s split this section in two.


    In the first part, we will do a *technical deep dive on the most dangerous wireless
    network vulnerabilities* that you need to know.


    The second part will focus on the user, so it will basically be *user guide to
    help them stay secure when using a wireless connection at home*. Remember that
    these kinds of guides are your best bet to reduce the biggest risk to your infrastructure
    and data, the inadvertent user.


    # Wireless network vulnerabilities


    As mentioned, we are going to look at the protocols, features, and practices that
    represent the top vulnerabilities to wireless networks. Due to the recent increase
    in the number of users working from home, this guide will include vulnerabilities
    that affect both enterprise and home systems.


    # Wi-Fi Protected Setup (WPS) – the problem


    This is the perfect example of a tradeoff between security and usability (or convenience).
    The reason is that WPS was created to make it easier for non-technical users to
    connect new devices such as smart TVs, game consoles, and laptops to the network.


    The problem is that the protocol is extremely insecure and has several vulnerabilities
    that lower the security of your network.


    There are two main WPS implementations: one is **PIN based** and the other is
    known as **Push Button Control (PBC)**.


    The **PBC implementation includes two methods**. One method is initiated by pressing
    the WPS button on both devices as seen in *Figure 8.7*. Normally, you have to
    press the WPS button on your Wi-Fi then you press the WPS button on your device
    to establish the connection.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Improving the protection of wireless networks


    There is also a hybrid mode in which you have to first open an app on your device
    to scan for WPS-enabled devices and then press the WPS button on the router to
    establish the connection, as shown in Figure 8.8.


    Some routers have the option to trigger WPS through the router''s web interface,
    but that is only available on a few models and is used by very few people (because
    it lacks the usability part of the solution).


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_269_0.png)


    Figure 8.8 – WPS hybrid connection mode


    The other WPS implementation is by using a PIN code, which is much easier to remember
    than your super-long secure password.


    But wait.... What is the point of having a super-secure password if we are also
    going to enable insecure PIN access? This is like having a super-secure one-million-dollar
    door that can be bypassed by an open window.


    > Why is the PIN method less secure?

    The PIN is an 8-digit number, which means that the entropy of possible password
    combinations is really small in contrast to an alphanumeric password in which
    you can introduce lower- and uppercase letters to significantly increase the entropy.
    In fact, using a modern cracking engine, an attacker can crack an 8-digit PIN
    in less than 8 hours.


    But this is not the only vulnerability present on WPS. Researchers also found
    couple of vulnerabilities in the cryptographic protocol. One is related to the
    fact that some of the digits of the PIN are checksums (which can be calculated),
    reducing the time needed to crack the password.


    The other vulnerability is related to the mechanism used by the protocol to validate
    the PIN, called a cryptodance, in which one of the steps of the validation is
    not properly encrypted, allowing an attacker to get easy access to the PIN.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Additionally, researchers also found some correlation between the MAC address
    and/or the serial number of the router, enabling an attacker to calculate the
    PIN based on those values.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_270_0.png)


    Figure 8.9 – WPS data pasted on the back of the router


    As seen in the preceding figure, those values can be located on a sticker on the
    back of the router, but an attacker can remotely gather them by leveraging the
    vulnerabilities of the probe request packets, which are unencrypted and broadcasted
    by the router, meaning anyone can receive and read them, and they may contain
    the MAC address as well as the serial number. If you want know more about probe
    request vulnerabilities, see Chapter 5, Cybersecurity Technologies and Tools,
    under the Advanced wireless tools for cybersecurity section.


    # WPS – the solution


    You may be surprised to know that WPS is enabled by default on most routers, so
    you may even have this vulnerability at home knowing it.


    So, the best recommendation here is to completely disable WPS from your router
    (step-by-step instructions will be provided in the User''s safety guide for wireless
    networks section).


    If some reason you need to have WPS enabled, leave the PCB enabled and make sure
    you disable the PIN option (as it is more vulnerable).


    Also make sure that you update your router''s firmware to ensure that your router
    contains the latest WPS fixes and security updates.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Improving the protection of wireless networks 249


    There are some legacy routers that will not allow you to disable WPS. In those
    cases, you have two options:


    +   1. Update the router''s firmware to see if the new update gives you the option
    to disable WPS.

    2. Change your router immediately.


    Now, let''s look at a little-known wireless feature that may bring some vulnerabilities
    to your network: Universal Plug and Play (UPnP).


    # ## UPnP – the problem


    UPnP was also created with the idea of making life easier for users, as it enables
    the sharing of data between devices on a given network.


    The problem is that this was created mostly for sharing data between trusted devices
    at a home network, therefore UPnP does not do authentication and attackers know
    how to exploit this.


    One of the features of UPnP is port forwarding, and attackers can leverage that
    vulnerability to take control of computers and use them as proxies during DDoS
    attacks. This was the case in the famous Mirai attack in which this technique
    prevented security systems from identifying the command and control servers, as
    thousands of infected machines around the world were used as proxies between the
    "bot" machines and the real command and controls servers.


    Other examples of malicious trojans that leverage UPnP vulnerabilities include
    the banking trojan Pinkslipbot, also known as QakBot or QBot. These trojans are
    very dangerous as they use a keylogger to capture keystrokes and send financial
    information and credentials to remote command and control servers.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# UPnP – the solution


    The best way to protect against all these vulnerabilities is by disabling UPnP
    in your router (step-by-step instructions will be provided in the User''s safety
    guide for wireless networks section). However, if you really need UPnP (to enhance
    the experience of a device), then you must follow these:


    +   - Check the model of your router on the internet and verify that the manufacturer
    has released a patch for the vulnerabilities related to UPnP. In fact, in 2020,
    researchers found a vulnerability called CallStranger that enabled an attacker
    to exfiltrate data from your systems; therefore, if you want to have UPnP enabled,
    you must keep checking for vulnerabilities and make sure you patch them. To find
    the list of current vulnerabilities, please visit https://cve.mitre.org.

    - Filter all external traffic trying to use UPnP.

    - Monitor network traffic to find abuses of UPnP.


    You may have a lot of technical and administrative controls at the office to secure
    your wireless network, but what about users working from home? Do they have the
    same level of security on their wireless connection at home?


    This should be a major concern for you because maybe most of your users are now
    working from home, therefore it is imperative to establish and distribute clear
    guidelines (administrative controls) to the users to ensure they have acceptable
    levels of security to avoid additional risks to business data and systems.


    # User''s safety guide for wireless networks


    The person in charge of security for your organization, you must provide guidance
    to the users to reduce the risks of attack.


    Taking into consideration that most users use Wi-Fi to connect to the internet,
    then it would be a great idea to create a manual of best practices when using
    wireless networks and distribute it to all employees.


    > Tip

    Also, remember that the key here is to ensure that all users are familiar with
    these guidelines, so some good ideas would be to create infographics by share
    by email or create some cool videos to call people''s attention to this campaign.
    Also, you can designate some influential employees as security champions to help
    you disseminate these strategies among all employees.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Most of the security settings are configured on the Wi-Fi router, so let''s
    start by showing the steps to log on to the administrative console of the Wi-Fi.


    # Accessing your router


    Here are the five simple steps required to access your router settings:


    +   1. Go to Google and enter the name of your router (brand and model) and the
    phrase admin password. For example, Linksys E1200 admin password.

    2. Then click on the relevant link from the manufacturer (in this case, linksys.com).

    3. As shown in the following figure, the link sent to the manufacturer support
    page, which confirms that the default username and password for your router are
    admin/admin:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_273_0.png)


    # Linksys E1200 N300 Wireless Router Frequently Asked Questions


    +   2. What are the default IP Address, username, and password of the Linksys
    E1200?


    The default IP Address is 192.168.1.1 and the username and password are both "admin".


    > Figure 8.10 – admin username and password


    +   4. To access the router, you just need to type the IP address of the router
    into your browser. In this case, the support page mentions the default IP address;
    however, that address may change. But don''t worry, this is very simple to confirm
    with the following steps:


    +   a. Press + R to launch the Run window, then type cmd and hit Enter to open
    Command Prompt.

    b. On Command Prompt, type ipconfig and hit Enter.'
  merge: -1
  img_proc: true
