- pgno: 212
  md: 'As seen in the preceding screenshot, when Feature Updates is installed, there
    will be a link where you can see details of the new features included in that
    update.


    +   - Service pack: Microsoft does a very good job of releasing updates for its
    systems, but that means over time, there could be a lot of updates available for
    its OS. Therefore, once there a certain number of tested hotfixes, updates, security
    updates, and critical updates, they are packed into a service pack.


    Service packs may also contain other updates, including customer-requested design
    changes or features.


    Service packs are a major update of the OS, so it is highly recommended to test
    it first on a testing environment before massively deploying them into production
    servers.


    Since they include critical updates for OS stability and security, they are considered
    critical updates.


    +   - Update rollup/monthly rollup: A collection of hotfixes, security updates,
    critical updates, and updates that are packaged together for easy deployment.
    This is basically a smaller version of a service pack. The Update rollup is normally
    a compilation based on the same feature, while the monthly rollup is based on
    the month when the updates were released. Since they include critical updates
    for OS stability and security, they are considered critical.


    Now you have mastered everything there is to know about Windows updates, it is
    time to move to the next topic to learn more about how to secure AD.


    # Applying security to AD


    While there is not an official guideline or standard for securing AD, here is
    a compilation of the industry best practices that you can leverage to enhance
    the security of your AD servers:


    +   - Never install additional software, roles, or services on domain controllers.


    +   - Never create local users on domain controllers (user management must be
    carefully handled on domain controllers).


    +   - Make sure accounts are created based on PoLP.


    +   - Maintain a record (list) of AD privilege accounts that includes owners,
    rights, and other relevant data about the account (to prevent ghost accounts).'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Ghost account is a term used for accounts in which the ownership or usage is
    unclear. While this may not be an issue on small infrastructures, it can become
    a huge problem in big environments in which best practices are not followed and
    you may have dozens of those accounts, which represents a significant risk to
    your infrastructure.


    +   - AD privilege accounts should not be used to log in to workstations (this
    increases the risk of the account being compromised).


    +   - Avoid keeping AD privilege accounts as disabled (the best practice is to
    remove privilege accounts if they are not in use).


    +   - All logs should be enabled.


    +   - Installation of security updates must be prioritized over domain servers.


    +   - As mentioned features, the latest version of Windows Server normally contains
    a set of security features, when possible, use the latest version of Windows Server
    to host the domain controller.


    +   - Enable multi-factor authentication (MFA) when possible.


    +   - Perform regular reviews (audits) of AD privilege accounts.


    > You must ensure you especially protect the three built-in groups in AD that
    possess the highest privilege groups in the directory (enterprise admins, domain
    admins, and administrators).


    +   - Perform regular backups.


    +   - Ensure high availability (HA) by configuring failover clustering. You can
    read more on this at https://docs.microsoft.com/en-us/windows-server/failover-clustering/failover-clustering-overview.


    +   - Avoid permanent membership in highly privileged groups. Instead, grant temporary
    membership only when needed.


    +   - When creating custom groups, make sure you label them with specific, self-explanatory
    names—for example, IT-Helpdesk instead of Group-x031.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Securing Windows Infrastructures


    +   * SMB version 1 must be disabled. This can be disabled using the Windows Registry
