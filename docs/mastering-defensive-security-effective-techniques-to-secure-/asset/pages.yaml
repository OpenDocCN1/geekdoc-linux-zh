- pgno: 462
  md: '# Finding evidence


    As soon as you discover an attack, there are a lot of things that need to be done
    with the utmost priority, including restoring the systems and services that have
    been impacted. However, another critical task is to find and secure all the evidence
    related to the attack. This task is critical as it allows you to do the following:


    +   - Determine whether the attack was executed by an insider or outsider.

    - Determine whether the insider was a malicious insider or an inadvertent insider.

    - Determine the vulnerability exploited by the attacker.

    - Determine the impact on business data in terms of the confidentiality, integrity,
    and availability (CIA) triad.

    - Determine the systems or services impacted by the attack.

    - Collect evidence to execute legal or corrective actions (from HR).


    Now that you know, there are a lot of places that you can harvest to gather digital
    evidence, let''s look at some practices regarding the collection process itself.


    # Sources of data


    As you may know, there are a lot of places that you can harvest to gather digital
    information during a forensics process. The most common type of files that you
    need to find are log files as they normally record all the events on the device
    (we covered this topic in Chapter 15, Leveraging Pentesting for Defensive Security).


    # Non-volatile memory


    As we mentioned earlier, it is possible to obtain data from RAM, so in the case
    of a digital investigation, you may want to do a dump of the RAM to get some extra
    information before executing other actions or shutting down the server.'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# Deleted data


    You should also search for traces of deleted data on the hard drive. This is especially
    important for detecting malicious insiders that may try to cover their their tracks
    by deleting logs or similar records. In these cases, you may not be able to retrieve
    the deleted information, but you may be able to prove that some logs were deleted
    or altered, and that could become evidence itself.


    # Routers and other network devices


    This is probably the second most common place to look for traces after an attack.

    Besides looking for unusual activity, you also need to look for signs of log alterations,
    as as deleted entries, as they may be indicators of attacks.


    # IoT devices


    Normally, IoT log files are overlooked, but they can be a great source of information,
    especially if they were used as the point of entry into your infrastructure.


    # Network printers


    Network printers are normally overlooked, but at the end of the day, they are
    network devices, which means they can potentially be launchpads for attacks. Additionally,
    the security of those devices is weak, and that is exactly why attackers are targeting
    more of those devices.

    You will be amazed at all the information that you can collect by checking those
    logs, including previous attempts to break into your network.


    # Mobile devices


    Mobile devices such as smartphones as minicomputers and, as such, they can also
    be as a point of entry into your corporate network.


    Therefore, it is important to use monitoring software that collects logs about
    the usage and interactions with mobile devices. If your company has a Bring Your
    Own Device (BYOD) policy, this becomes of extreme importance as the devices are
    more vulnerable to attacks, so having control over those devices is a must.

    Forensics on mobile devices is a big topic, so let''s review this topic in detail.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Mobile forensics


    Mobile Forensics has become one of the biggest areas of specialization in forensics
    – not just because almost everyone has a smartphone, but because smartphones can
    collect a huge amount of data.


    The cool thing about mobile forensics is that in some cases, you don''t even need
    the phone to gather some of the data''s been collected by your smartphone. Let
    me show you how.


    # Deviceless forensics


    Smartphones gather a lot of information, such as location, messages, searches,
    frequently visited places, app usage, browsing history, and more, the most interesting
    part is that Google (yes, Google) records all data on their cloud. Let''s learn
    how to access it:


    +   1. Go to https://takeout.google.com.

    2. Log in with your user credentials.

    3. Select the data you want to retrieve.

    4. Choose how you want the files to be delivered (to a drive, cloud storage, or
    via a link for a direct download).

    5. Select whether you want to export the files only this time or if you want to
    schedule future exports.

    6. Determine the file type and maximum size per file.

    7. Click on Export.


    The export depends on the amount of data that Google has collected about you,
    so take into consideration that in some cases, it could take several hours or
    even a day to export all your data.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_464_0.png)


    Figure 16.8 – Google Takeout page'
  merge: -1
  img_proc: true
- pgno: 465
  md: 'The type of information depends on the Google services that you use. However,
    while for iPhone users this could be optional, some of the information that''s
    collected here applies to all Android users. You may be surprised by the amount
    of data being collected about you. For example, in the exported file, you can
    see not only details about the app''s use but when it was used (along with a timestamp).


    The following are some examples of the data that can be exported:


    +   - Information about IoT devices through Google Home

    - Calendar entries (including when they were created and deleted)

    - Everything about your Google Chrome access (history, settings, and so on)

    - Information about the files you print (Google Print)

    - Information about purchases and reservations made using Google Search or Maps

    - Images and text published on Google communities

    - Contact pictures

    - Data about registration and activity on your Google account

    - All your biometric data that''s been compiled by Google Fit, including sleep
    data, training data, distance walked, and more

    - Metadata about your Google searches

    - History of purchases made with Google Pay

    - Information about the books you''ve read or purchased on Google Books (including
    notes and highlights)

    - Preferences about movies based on Google Play movies (including playlists and
    even the ratings you''ve provided for each movie)

    - History of shopping (including delivery addresses) based on Google Store

    - History of your chats in Google Hangouts (including attached pictures)

    - History of navigation (including preferences and reviews of visited sites) based
    on Google Maps

    - Device configuration, performance data, software version, and more (for Android
    devices)

    - Information about the games you''ve played (including scores) on Google Play

    - Installed apps, ratings, and purchases (Google Play)

    - Your location history (based on the data that''s been collected by your GPS)'
  merge: -1
