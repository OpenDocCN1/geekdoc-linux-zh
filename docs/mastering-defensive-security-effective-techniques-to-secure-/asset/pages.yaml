- pgno: 163
  md: '# Creating your training strategy


    As you know, patching is one of the most important strategies in defensive security,
    and this strategy can also be applied to people through education and training.
    Therefore, you MUST invest time and other resources to make sure you have a strong
    training strategy.


    Let''s take a look at the key points that you need to consider when creating your
    own training strategy:


    +   1. Personalize it based on your company culture, your threat landscape, and
    the type of data managed by the company.

    2. For smaller companies, you can create a single training session to cover all
    employees; however, mid-to-large-sized companies and corporations MUST have different
    types of customized training. This training can be segregated based on the type
    of employee, the organizational level, the data managed, or data access.


    +   3. Define the delivery method (for example, live training, webinar, videos,
    animations, web-based interactive learning, and more).


    +   4. Define the frequency of the training.


    +   5. Define the success criteria to "pass" the training, for example, by scoring
    at least 80 percent on the final assessment.


    +   6. Define a rewarding schema; for example, providing a digital badge that
    can be shared on social media.


    +   7. Get buy-in from HR and the senior management to make the training mandatory.


    > Tip

    Make the training as interactive as possible, use up-to-date real-life examples,
    include everything (never assume a topic is too basic to be included), and use
    the list of attacks that we''ve just reviewed as a baseline to make sure all major
    attack vectors are covered.


    You need to convince upper management that companies are not spending money on
    cybersecurity education; instead, they are investing in securing the most vulnerable
    cybersecurity factor.


    # Admin rights


    This is a controversial topic because there is no consensus regarding whether
    giving admin right to all employees is it a good practice or not. However, from
    a security standpoint, there is no question that giving administrative rights
    to all of your employees increases your threat landscape.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Patching Layer 8


    Therefore, you should always push to avoid giving admin right to all users; however,
    if your company decides to grant admin rights to all employees, then you you need
    to take the following countermeasures:


    +   1. Define a clear policy about software installation.

    2. Create a whitelist and blacklist of applications that can be installed.

    3. If possible, create a repository to host the whitelisted software (this reduces
    the risk of a user installing hacked versions of the software).

    4. Set alerts if a blacklisted software is installed on a corporate workstation.


    # Implementing a strong BYOD policy


    If you allow employees to use their personal devices for work, make sure that
    you have a strong BYOD policy in place.


    # Performing random social engineering campaigns


    The best way to evaluate the level of preparedness or exposure that users have
    against a social engineering attack is by testing them with real-life controlled
    attacks.


    Here is how you can do:


    +   * **Set up your environment:** Purchase a domain from where you will launch
    the attacks. Look for similar names as the ones that a real attacker will use,
    for example, `support-companyname.com`.

    * **Test one attack per cycle:** First, need to define the cycles, as well every
    3 months, 6 months, or 1 year. For example, phishing in early 2020, baiting in
    late 2020, pro quo in early 2021, and extortion in late 2021.

    * **Analyze the results:** The goal of this is not to chase your employees and
    put them on a “wall of shame”. Instead, this is gathering intelligence to determine
    areas of improvement for upcoming training and education.

    * **Set up rewards:** You can set up a rewarding system for those employees that
    found the attack and used the proper channels to report it to the cybersecurity
    team.


    > Rewards are not always about money

    You can also leverage free perks as digital badges, a wall of fame, a secure employee
    of the month (which you might want to use a catchier name as “Cybersecurity Rockstar”),
    a preferential parking spot for a month, or more.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - Announcements and communications: You might not want to spoil your assessments
    by communicating the start of it. However, it is a good idea to send a communication
    after the assessments are finished so that people are aware of these types of
    initiatives, but also to share relevant numbers with them (for instance, how many
    people fell victim to the attack, potential losses, and more).


    To avoid disruption of services, we recommend that you roll out campaigns to a
    randomly selected group of individuals (depending on the size of the company,
    this could be between 10 to 60 percent of employees). Additionally, you need to
    ensure that this random selection includes participants from all the organizations
    across the company (for instance, HR, sales, and IT).


    # Summary


    In this chapter, you learned about all users, including how they can impact your
    defensive security strategy, their vulnerabilities, and the plurality of attacks
    aimed at them, but also the tactics that you can apply to mitigate those risks.


    This chapter is extremely important because securing this attack vector, you will
    exponentially reduce the scope of the attacks against your infrastructure, systems,
    and data.


    Now, get ready for the next exciting chapter in which we will take a deep dive
    into more technical stuff. In the following chapter, you will learn about the
    best penetration testing tools, forensics, networking, and many other technologies
    that you need to master in order to create the best defensive security strategy.


    # Further reading


    Here is the complete report of *The Cost of Insider Threats*: 2020:


    https://www.ibm.com/security/digital-assets/services/cost-of-insider-threats/#.'
