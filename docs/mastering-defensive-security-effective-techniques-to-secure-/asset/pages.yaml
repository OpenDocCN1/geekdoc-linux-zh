- pgno: 471
  md: '# 17

    Achieving

    Automation of

    Security Tools


    – Desilda Toska, Dott Magistrale and Automation leader


    Most attackers leverage automation tools and techniques to enhance the reach of
    their attacks. Therefore, you must understand the importance of automation so
    that you can also take advantage of it to better secure your infrastructure.


    Additionally, you must understand the different types of automated attacks that
    compose the threat landscape so that you can plan your defenses against them.


    In fact, I am sure that you are familiar with several automated attacks such as
    *spam* and *distributed denial-of-service (DDoS)* attacks, but here, we will review
    the top 21 automated attacks to better understand this threat, which includes
    very interesting attacks such as credential stuffing, scalping, sniping, and more.'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'Here is a list of the main topics to be covered in this chapter:


    +   - Why bother with automation?

    - Types of automated attacks

    - Automation of cybersecurity tools using Python

    - Cybersecurity automation with Raspberry Pi


    # # Why bother with automation?


    > "In computing, the most efficient job is the one that doesn''t need to be performed."

    – Ignacio Trejos-Zelaya


    As mentioned before, cybercriminals leverage automation as their main tool to
    increase the reach of their attacks, so if you want to play on the same terms,
    then you should be using automation as a key factor in your defensive security
    strategy.


    # # Benefits of automation


    Let’s review some of the benefits that you can leverage by implementing automation
    as part of your defensive security strategy. They are listed here:


    +   - Optimization of resources (you can do more with less)

    - Relocation of resources to more advanced tasks (by automating time-consuming
    non-value-added tasks)

    - Cost reduction

    - Faster detection of threats

    - Faster application of countermeasures

    - Reduction of impact in the case of attacks

    - Support of compliance and compliance-related tasks


    Now, on the other hand, let’s review the risks of not applying automation.'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# The risks of ignoring automation


    Some companies may not be willing to invest in automation; however, here are some
    of the risks associated with that:


    +   - Waste of resources (by working on tasks that can be automated)

    - Increased probability of human error

    - Slower time to react (human speed versus computer speed)

    - Increased possibility of becoming vulnerable to automated attacks

    - Fewer resources available for research

    - Lower capability to discover threats


    Now, let''s review the different types of automated attacks that we may face.


    # Types of automated attacks


    Most attacks are automated, aimed to target a broader audience to increase the
    chances of success; therefore, it is important that you understand the types of
    automated attacks that you face, and to do that, we will do a review of the classification
    of automated attacks based on the Open Web Application Security Project (OWASP).


    # Account aggregation


    This attack is aimed at identifying and aggregating accounts based on a common
    factor—for example, gathering all credentials from a given system, gathering credentials
    from a single user (from a plurality of systems), and so on.


    # Account creation


    This attack is aimed at creating bulk accounts.


    The objectives of attackers are varied, including using new accounts for spam,
    account misuse, Denial of Service (DoS), and so on.'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# Ad fraud


    This automated attack is aimed at providing false clicks to commit fraud with
    advertisements, as illustrated in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_474_0.png)


    As illustrated in the preceding screenshot, cybercriminals may increase their
    earnings exponentially by using this type of automated attack to commit fraud.


    # CAPTCHA defeat


    Completely Automated Public Turing Test to tell Computers and Humans Apart (CAPTCHA)
    is a very basic way to prevent some types of automated attacks by creating a test
    that can be solved by humans and not by robots (scripts). However, with the current
    advances in image recognition technologies and optical character recognition (OCR),
    CAPTCHAs became harder for users and easier for computers. You can see a couple
    of examples of impossible CAPTCHAs in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_474_1.png)


    In fact, as illustrated in the preceding screenshot, some CAPTCHAs are impossible
    to decipher by humans.


    # Card cracking


    This kind of attack is aimed at identifying missing credit card data (such as
    security codes and expiration dates) by brute-forcing them on credit card processing
    sites.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# Carding


    This attack is used to validate a bulk of stolen or fraudulent credit card numbers.
    This is normally achieved by testing a bulk of cards on a credit card processing
    site.


    # Cashing out


    Purchasing goods or services using stolen or fraudulent payment information. This
    attack is automated in order to enable purchases on several sites or in a short
    period of time (before the card is blocked).


    # Credential cracking


    Here, the attacker tries to validate username and password combinations by using
    brute-force or dictionary-based attacks for both values.


    # Credential stuffing


    This attack is aimed at validating a plurality of username and password combinations
    (normally obtained on the black market or from a previous data breach) against
    a given site.


    # Denial of inventory


    A very interesting attack aimed at reducing the inventory of a product for a period
    of time by putting it on the cart, without paying for it. This attack may have
    a very negative impact on the sales of an e-commerce page, but it can also be
    triggered to negatively impact the release of a given product or to promote a
    product. You can see such an attack in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_475_0.png)'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'It is important to highlight that this attack can also be carried out against
    services as hotel room reservations, car rentals, and other services and products
    offered through e-commerce sites.


    # DoS


    This is probably the most common type of automated attack, which consists of exceeding
    the capacity of a web server to stay online by flooding the site with an overwhelming
    amount of requests, directly affecting the availability of the site and the services
    provided.


    # Expediting


    This attack is aimed at bypassing a series of steps of a process to reach the
    final steps of the process faster, as illustrated in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_476_0.png)


    As seen in the preceding screenshot, expediting could save an attacker time by
    reaching the last part of a given web process faster—for example, clicking **Next**
    on a web training form until the attacker reaches the final question.


    # Fingerprinting


    This automated attack is about gathering publicly available information about
    a given website to have a better understanding of the site. Most of the time,
    it gathers data as *HyperText Transfer Protocol (HTTP)* headers, error messages,
    *Uniform Resource Locator (URL)* paths, and so on. This attack can be performed
    without accessing the site by leveraging information indexed on search engines
    and other techniques, such as leveraging Google dorks.'
