    # Conventions used


    There are a number of text conventions used throughout this book.


    Code in text: Indicates code words in text


    A block of code is set as follows:


    ```

    //Identify USB HID PnPDevices

    let MalPnPDevices =

    MiscEvents

    | where ActionType == "PnpDeviceConnected"

    | extend parsed_parse_json(AdditionalFields)

    | sort by EventTime desc nulls last

    | where parsed.DeviceDescription == "HID Keyboard Device"

    | project PluginInTime=EventTime, ComputerName, parsed.

    ClassName, parsed.DeviceId, parsed.DeviceDescription,

    AdditionalFields;

    ```


    Any command-line input or output is written as follows:


    ```

    sudo apt-get install telnet

    ```


    **Bold:** Indicates a new term, an important word, or words that you see onscreen.
    For instance, words in menus or dialog boxes appear in **bold**. Here is an example:
    "Those settings can be accessed for configuration and verification (audit) on
    the **Windows Group Policy Editor** under **Advanced Audit Policy configuration.".


    > Tips or important notes

    Appear like this.'
