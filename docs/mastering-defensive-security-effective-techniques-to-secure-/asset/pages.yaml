- pgno: 175
  md: 'Now that you know these great Wi-Fi tools (hardware and software), it is time
    to move on and look at another exciting topic: pentesting.


    # Pentesting tools and methods


    There is a common misconception pentesting = networking testing, and that is a
    huge mistake.


    As a master in defensive security, you need to drive your defensive strategy in
    an integral way by including all the actors, factors, and actions that may impact
    your infrastructure.


    Therefore, in this section, we will be exploring all the different tools and methods
    that you need to leverage to create the most comprehensive and powerful cybersecurity
    strategy


    # Metasploit framework


    Metasploit is considered an exploitation framework, which means it''s a powerful
    pack of tools and utilities that you can leverage to test your infrastructure.


    It includes a variety of tools that can be used for the following purposes:


    +   * Information gathering (passive and active)

    * Vulnerability scanning

    * Exploitation

    * Post-exploitation


    +   * And many other additional modules including some to help the attacker to
    cover its tracks


    The intent of this book is not to focus on the offensive part, but it will be
    valuable for you to know the basics about this tool. Due to this, we will be covering
    this in depth in Chapter 15, Leveraging Pentesting for Defensive Security.


    # Social engineering toolkit


    This is a very powerful toolkit''s used most by attackers; however, you can also
    take advantage of this tool to develop the following:


    +   * Awareness campaigns.

    * Improved training.'
