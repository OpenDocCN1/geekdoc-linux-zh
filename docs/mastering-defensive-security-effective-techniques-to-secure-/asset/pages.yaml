- pgno: 466
  md: '# 444 Practicing Forensics


    +   - History of videos searched and watched on YouTube

    - And more


    Additionally, as shown in the following screenshot, you have extra parameters
    to choose from, such as the format of the data to be exported and the items to
    be included on the export:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_466_0.png)


    Figure 16.9 – Export settings of Google Takeout


    For iPhone users, things are a bit different because the privacy policy is more
    restrictive than that of Android. This means gathering information that''s been
    saved about the user is more complex. Apple does not have a page like this one
    where the user can request their data, so gathering this information from an iPhone
    may involve sending a legal request directly to Apple to get a warrant to share
    user information.


    # Important data sources on mobile devices


    As we mentioned previously, a mobile device collects a lot of data that can be
    harvested without having access to the phone. However, if you have access to the
    phone, you may be able to gather more information.


    While most books will tell you to gather files as pictures, calls, messages, and
    other easily identifiable data, there is lot more data that can be harvested from
    a mobile device. So, let''s look at my checklist of data to be harvested from
    mobile devices:


    +   - Wi-Fi connection data (including a list of known SSIDs): This could be very
    useful in confirming whether the user was at a given place or trying to connect
    to an unauthorized network.

    - Bluetooth connection data: This can help determine whether an unapproved device
    was connected.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '+   * OS installation details: This data is very useful for determining whether
    the device was recently restored to its factory defaults, which can be used as
    proof that the device data was wiped out


    +   * App list: This can be used to determine whether unauthorized software was
    installed on the device. For example, this could become especially useful for
    determining whether third-party software that was installed by an inadvertent
    user was vulnerable or used to leak any data from the device.


    +   * OS updates information: This is very useful for determining whether the
    device was breached or attacked due to a lack of security being updated in the
    OS, or even to demonstrate that the device is still vulnerable, (which may reveal
    the presence of a zero-day attack).


    +   * Rooting, jailbreaking, and other OS modifications: It is very important
    to look for traces of jailbreaking or any unauthorized OS modifications as this
    could represent a breach of corporate policy. This could also be the reason why
    the device was breached (and an explanation about why the device was unable to
    prevent the attack).


    +   * USB connection metadata: This can help you determine whether the device
    was connected to an authorized device and whether data exfiltration was performed
    or attempted.


    +   * Cloud storage apps and users: This information can be used during an investigation
    to determine whether data was exfiltrated to personal cloud storage services (Dropbox,
    box, OneDrive, and so on).


    This checklist is device-agnostic, but the tools and methods that are used to
    gather data between devices, OSes, brands, models, and so on.


    > Tip

    Depending on the device''s OS, this data can be stored by the user. So, it is
    important to ensure that this gathering activity is performed on all users of
    the device.


    # Transporting mobile devices


    Many solutions enable you to remotely delete files on a mobile device. Therefore,
    to avoid any manipulation of the device, it is recommended to use a faraday cage
    to block any incoming signals and avoid the data on the device being modified.


    Now it is time to look at some guidelines and international best practices regarding
    managing digital evidence to ensure it can be used in a legal process as valid
    evidence.'
  merge: -1
