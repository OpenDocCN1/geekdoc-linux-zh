- pgno: 75
  md: '# Smartphone-based USB attacks


    To make the USB HID vulnerability even more dangerous, attackers can now leverage
    USB OTG capabilities on smartphones to perform USB HID attacks.


    To achieve this, the attacker will use **Nethunter**, which is a Kali Linux distribution
    for Android devices (cellphones and tablets). To find out more about this attack,
    please visit the official repository at https://github.com/offensive-security/kali-nethunter/wiki/Nethunter-HID-Attacks.


    > **Important note**

    If you are familiar with Rubber Duck attacks, an attacker can use a tool on **Nethunter**,
    called **DuckHunter HID**, which will allow them to quickly and easily convert
    USB Rubber Duck Script into Nethunter HID Attacks format: https://www.kali.org/docs/nethunter/nethunter-duckhunter/


    There is even another tool that attackers can execute on the smartphone that leverages
    this HID vulnerability, called a **BadUSB MITM attack**. Here, the attacker can
    launch a man-in-the-middle attack by just connecting to the target machine using
    USB OTG cable.


    To learn more, please refer to https://www.kali.org/docs/nethunter/nethunter-badusb.


    > **Tip**

    There are many other attacks available on **Nethunter**. You can view their official
    site to learn more about them at https://www.kali.org/kali-linux-nethunter/


    As you can see, in the examples we have presented, there are far too many possibilities
    and far too many options available for an attacker to leverage this vulnerability.
    Therefore, being aware of this vulnerability is the very first step for you to
    effectively protect against them.'
