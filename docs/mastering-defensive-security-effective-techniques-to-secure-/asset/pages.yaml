- pgno: 306
  md: '# Mastering physical security


    As seen before, the main security mechanisms in physical security are based on
    preventing non-authorized users from gaining physical access to your systems.


    However, there are some additional mechanisms that you can leverage to enhance
    your physical defensive security. These additional mechanisms and strategies are
    discussed in the following sections.


    # Clean desk policy


    This policy is not about having the desk clean of dust and food, but about restricting
    what employees can leave unattended on their workstations. The following are some
    examples to take into consideration:


    +   - Cabinets must be locked at all times when the user is not at the desk.

    - No papers, notes, or other sources of data should be left unattended on the
    desk.

    - No removable devices (such as USB drives) should be left unattended (either
    connected or disconnected from the computer).

    - No sensitive personal information (SPI) or personal identifiable information
    (PII) should be left unattended on the desk.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_306_0.png)


    This policy is of great value for you and for the company as it serves as an additional
    layer of security against external attackers. In fact, companies that successfully
    implement this policy also reduce other company risks such as intrusions, theft,
    and more.


    > Tip

    Policies must be accompanied by heavy sanctions from HR to ensure everyone is
    complying. Additionally, if you assign auditors to perform daily checks, this
    policy will eventually become part of the organizational culture.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'In terms of ownership and implementation, the best practice is that this is
    implemented and owned by HR, because they may have more resources to ensure the
    proper implementation of the policy across the entire company. However, keep in
    mind that you may have to be the main evangelist to ensure the policy is created
    in the first place.


    # Physical security audits


    This mechanism is normally overlooked, however, this should be an essential part
    of your defensive strategy.


    Now, let''s review the best practices for physical security audits:


    +   - Perform physical inspections to find rogue devices (like the ones mentioned
    above).


    +   - Select random team members as auditors (is always good to have a fresh pair
    of eyes).


    +   - Rotate auditors periodically (Once a month or every 2 months).


    +   - Ensure all physical controls are up and running.


    +   - Ensure logs are being recorded.


    +   - Ensure laptops are locked and secured if unattended.


    Figure 9.15 – Best practices for physical security audits


    Some companies may perform these audits as part of their yearly audits. However,
    not all companies have the budget to do so, in this case the recommendation is
    to select a group of volunteers to perform the role of physical security auditor.
    You just need to ensure they are trained in how to carry out security audits,
    and have a deep understanding of the related policies. Also, since these are not
    official audits, you can perform them more frequently, for example, on all Fridays,
    or the last Monday of the month, and so on.


    Additionally, as mentioned in Chapter 3, Comprehending Policies, Procedures, Compliance,
    and Audits, you need to make sure you have approval from upper management, HR,
    and the legal department before rolling out any type of audit.'
  merge: -1
  img_proc: true
