    Now that we have reviewed the factors that need to be considered and how to manage
    them, it is time to move forward to understand how to determine which assets will
    be defended by our DiD model and how to prioritize them.


    # Asset identification


    In an ideal world, you would apply the strongest defense across the entire organization,
    but as you may know, that is not realistic because the stronger the security,
    the more expensive the cost.


    Therefore, before moving forward, you must analyze your systems and data and sort
    them to prioritize the defense strategy for each type.


    > Tip

    Once you have identified the different systems and data, create a Kanban-like
    board in which the columns are the levels of security (with an associated cost),
    and schedule a meeting with relevant upper management (CEO, CFO) and ask them
    to place the different systems and data in the desired security level (columns).
    This is a great tool for when it comes to supporting your budget request, but
    also when delegating the responsibility of the security level selected for each
    system/infrastructure or dataset.'
