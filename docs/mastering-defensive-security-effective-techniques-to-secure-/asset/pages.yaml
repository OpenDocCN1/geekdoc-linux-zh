- pgno: 423
  md: '# # 15

    # Leveraging Pentesting for Defensive Security


    > > "Companies have to invest time and resources in defensive security to identify
    new vulnerabilities that allow them to anticipate the movements of the adversary.
    As Sun Tzu says in The Art of War: ''To know your enemy, you must become your
    enemy.''"

    > - Dagoberto Herrera, University Dean


    While pentesting is a task normally reserved for offensive security teams (also
    called red teams), the truth is that as a master in defensive security, you also
    need to know at least the basics of pentesting.


    In fact, this chapter is not aimed to make you a pentester. Instead, the goal
    of this chapter is to show you the most popular tools used by pentesters (and
    attackers) to show you how easy and dangerous those attacks can be.'
  merge: -1
  img_proc: true
- pgno: 424
  md: '402 Leveraging Pentesting for Defensive Security


    The chapter starts with mandatory theory to be able to move on to some exacting
    labs in which you can experiment using your own hands with the simplicity and
    power of those offensive security tools.


    The main topics that we will cover in this chapter are:


    +   - Understanding the importance of logs

    - Knowing your enemy''s best friend: Metasploit

    - Other offensive hacking tools


    # Technical requirements


    A virtual machine with Kali Linux with Damn Vulnerable Web Application (DVWA)
    installed (could be the same as what we installed in Chapter 12, Mastering Web
    App Security.


    A machine with virtualization software such as VirtualBox will be used to create
    a virtual machine with Metasploitable.


    # Understanding the importance of logs


    Before talking about the importance of logs, let''s take a few minutes to understand
    some of the core attributes of logs, including their origins, types, and even
    some standards used in the industry.


    # Log files


    Logs were created as a way to record events in the operating system or applications.
    They started as a great debugging and troubleshooting tool, but now they are used
    for many other purposes, such as auditing, security, and compliance:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_424_0.png)


    Figure 15.1 – View of logs on a Windows system'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'Most log files are simple text files with common attributes such as log type,
    timestamp, ID, and user. Most operating systems and applications categorize the
    different types of logs for ease of analysis. The most common categories are as
    follows:


    +   - Error log

    - System log

    - Application log

    - Access log

    - Transaction log


    In theory, this sounds very simple, right? But in reality, it is not, and let''s
    see why. Imagine the following scenario.


    You have a server with Windows Server that by itself generates 500 logs per minute,
    you have a database that generates 400 logs per minute, plus 6 applications that,
    combined, generate another 300 logs per minute. This means that your server is
    generating an average of 1,000 logs per minute, which is about 24,000 logs a day
    or 720,000 logs in a month in only one server. Now, if you multiply this by the
    number of servers in your organization and even devices such as routers and IoT
    (which also generate logs), then this becomes unmanageable, and this is why you
    must apply log management techniques.


    # Log management


    As a cybersecurity expert, you must apply log management techniques to take advantage
    of logs. In fact, if they are not properly managed, logs can become useless and
    even a burden on your infrastructure, but if you properly manage them, they can
    become a powerful source of information.


    But don''t worry because here are the things you need to keep in mind to ensure
    you manage your logs like a master:


    +   - Log structure: There are many types of log formats but having logs in different
    formats will only increase the complexity of log management. That is why companies
    try to adhere to one standard to make sure the log structure is the same across
    systems.


    One of the most famous standards is Syslog, which was created as early as 1980
    and became almost a standard for Unix-like systems.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# Leveraging Pentesting for Defensive Security


    +   **Log collection:** A best practice is to have a centralized system to capture
    all logs. This can be done by a third-party system that collects logs from a plurality
    of systems to centralize all logs in a single place. In some cases, a company
    may want to create a server to collect logs from a critical business activity,
    for example, creating a server to collect all logs from a critical web application.


    +   **Log search:** Logs are not only to be stored; logs need to be analyzed,
    but before that, you need to make sure you can easily find them, and this task
    can become very complex. To simplify this, you need to first make sure you have
    your logs standardized as properly. Also, make sure that you tag them in a way
    that you can easily identify and categorize them, for example, by adding a prefix
    to the name of the file (such as, `IIS_log_334455`, `SQL_log_01_02_2021`).


    Depending on the size of your infrastructure, this activity can become impossible
    to be done manually, therefore it is highly recommended to use a log management
    solution that allows you to add custom tags to your logs based on the source.


    +   **Log analysis:** The real value of logs is the information that we can gather
    from them, and that information can only be obtained by performing a deep analysis
    of the logs. Log analysis will help you to generate metrics, find patterns, and
    even gather threat intelligence by correlating logs between systems.


    More advanced systems will even incorporate an artificial intelligence engine
    that will leverage machine learning techniques to provide better insights and
    even predictions based on your logs.


    +   **Log storage and archiving:** There are a lot of reasons to archive your
    logs. One of the main reasons is related to compliance and regulations that may
    require your company to keep logs archived for a given period of time. But even
    if your company is not regulated, it is a good practice to create a policy related
    to the archival of logs to determine how long you must keep your logs and even
    break down those times based on the type and importance of logs (to save some
    space).


    OK, now that we have reviewed the basics of logs and log management, it is time
    to recap the benefits and importance of logs in your role as cybersecurity master.'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# The importance of logs


    As mentioned before, let''s do a review of the most relevant topics that highlight
    the importance of logs and why you must invest time and resources into log management:


    +   - **Compliance and audit:** You must ensure that your logs are aligned with
    applicable regulations. In fact, missing logs could result in very high fines
    for your company, therefore you must ensure your logs policy is aligned with all
    local and international regulations, such as **Payment Card Industry Data Security
    Standard (PCI-DSS)**, **Healthcare Information Portability and Accountability
    Act (HIPAA)**, **General Data Protection Regulation (GDPR)**, and so on.

    - **Troubleshooting:** This task may be out of your scope (and may be performed
    by the **Information Technology (IT)** department), you should consider when creating
    your logs policy to ensure it is aligned with the IT department''s needs to perform
    troubleshooting. Additionally, you need to ensure that they have access only to
    the logs they need to reduce the risk of other logs being altered or deleted.

    - **Investigations:** Logs are a powerful tool to detect wrongdoers, including
    external and internal users. Therefore, you must ensure that critical systems
    are generating logs. Using **Internet of Things (IoT)** devices to also keep track
    of the activity on these devices.

    - **Sanctions and legal actions:** Logs are typically used as a legal weapon to
    prove that some activities were performed by a given user and, therefore, they
    are normally used as evidence to take legal or internal actions. Therefore, archiving
    and ensuring the integrity of logs are essential tasks.

    - **Key metrics validation:** Logs can help you confirm whether a **Service-Level
    Agreement (SLA)** or contract requirement was met or breached. For example, logs
    can confirm whether a service you provided was down and whether the uptime was
    reached or not based on contractual requirements.

    - **Support cybersecurity tools:** Many cybersecurity tools such as SIEM use logs
    as their main inputs, therefore good log management will enhance the functionality
    of said tools.

    - **Log integrity:** As we learned, logs are very important, their effectiveness
    relies on their integrity, so you must ensure that logs remain untouched. There
    are several attacks to alter log files; in fact, this is known as **log spoofing**.
    To learn more about this, please refer to the OWASP page about log injection at
    `https://owasp.org/www-community/attacks/Log_Injection`


    By now, we have reviewed everything you need to know about logs and log management.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'Now it''s time to move on to the core of this chapter and get into more technical
    topics to learn all you need to know about one of the best and most famous attack
    frameworks used by attackers: the great Metasploit.


    # Knowing your enemy''s best friend – Metasploit


    Let''s start by clarifying that Metasploit is a great framework that, like any
    other tool, can be used for good or bad. In fact, chances are that your company
    will receive at least one attack coming from this tool, but the good news is that
    you can leverage this same framework to test your infrastructure using offensive
    security techniques with Metasploit.


    But wait, wasn''t this about defensive security? Yes, as a master in defensive
    security, you also need to understand how to leverage some offensive security
    techniques to keep your infrastructure safe.


    # Metasploit


    If you have been around the cybersecurity area, then you will have at least heard
    about Metasploit, but what is exactly Metasploit?


    Metasploit is an open source framework developed in collaboration between the
    open source community and Rapid7.


    One of the great features of Metasploit is its functionality with modules that
    enables you to use this framework to launch exploits, payloads, scans, and more.


    In terms of exploits, Metasploit has more than 2,000 exploits that are applicable
    to almost all known operating systems, including Advanced Interactive eXutive
    (AIX), Solaris, Berkeley Standard Distribution (BSD), FreeBSD, Hewlett Packard
    Unix (HP-UX), Unix, and, of course, Windows.


    Additionally, Metasploit has more than 500 payloads, which includes static payloads,
    dynamic payloads. Command Shell, and Interpreter.


    But those numbers increase constantly because this is an open source project,
    exploits and payloads are being constantly uploaded by the community and normally
    reviewed by senior community members and Rapid7.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '> Note

    Metasploit will allow you to find, validate, and test vulnerabilities in your
    systems before others do! This is very important because it will allow you to
    see the real security status of your systems and infrastructure and act upon the
    findings.


    As mentioned, Metasploit is a very big project and at the beginning, it could
    be very confusing, so let''s continue by exploring the different versions of this
    tool.


    # Metasploit editions


    Since its conception in 2003, there have been several editions of Metasploit.
    Some of them are still active while some of them have been retired (as Metasploit
    Community Edition and Express). Now let look at the current active editions of
    Metasploit.


    # Metasploit Framework edition


    This can be called the classic version of Metasploit. This is a free command-line
    version that comes preinstalled on Kali Linux. This is by far the most popular
    version of Metasploit and there are countless books, videos, and tutorials about
    it. To get more information about this version, you can visit the official site
    at https://www.metasploit.com/get-started.


    # Metasploit Pro


    This is the paid version of Metasploit, supported by Rapid7, which basically adds
    a plurality of features such as wizards, integrations via a remote API, a plurality
    of automation tools, and a variety of infiltration tools, including a testing
    platform to test the top 10 OWASP vulnerabilities on web applications.


    Here, you can find a detailed comparison of this paid version and the free framework
    version: https://www.rapid7.com/products/metasploit/download/editions.


    # Armitage


    Armitage allows you to graphically visualize targets and execute a plurality of
    exploits against them using Metasploit in the background. This is a great tool
    to introduce Metasploit and to discover the benefits and powers of this tool.


    Armitage is also free and can be easily installed on Kali Linux. Next, we will
    show you how.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# Installing Armitage


    As mentioned, Armitage is a great way to start your first steps with Metasploit,
    let''s install it on our Kali Linux machine.


    Now, Kali Linux comes with Metasploit installed by default; however, you need
    to set it up to use for the first time, before installing Armitage, we need to
    set up Metasploit.


    # Configuring Metasploit for the first time


    Metasploit uses PostgreSQL as a database, however the latest versions of Kali
    have this service stopped by default, the first step will be to start PostgreSQL
    and set it up to run at boot:


    ```

    sudo systemctl enable --now postgresql

    ```


    As seen in the following figure, postgresql is now up and running:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_430_0.png)


    > Figure 15.2 – Running PostgreSQL


    Now, let''s use the following command to create the required databases:


    ```

    sudo msdb init

    ```


    Now, I highly recommend you check for available updates. In fact, in my case,
    my installation was quite recent and I got more than 120 MB of updates. To get
    them, type the following commands:


    ```

    sudo apt update

    ```


    ```

    sudo apt install metasploit-framework

    ```


    You can successfully launch Metasploit by using the following command:


    ```

    sudo msfconsole

    ```'
  merge: -1
  img_proc: true
