- pgno: 259
  md: '# Using the master tool of network mapping – Nmap


    First, let''s start by understanding the importance of network mapping tools.


    Cyber attacks are normally composed of five phases in which network mapping is
    the core of the second phase, known as scanning. To better understand this, let''s
    take a quick look at those five phases of a cyber attack.


    # Phases of a cyber attack


    These phases were not created as a set of best practices that attackers need to
    follow; instead, they were designed by cybersecurity professionals to categorize
    the most common steps that an attacker will be most likely to follow when performing
    a cyber attack.


    Let me explain these stages by telling the story of an attacker that wants to
    gather some data from a fictional company called Bravix.


    # Phase 1 – Reconnaissance


    First, the attacker needs to acquire some basic information about Bravix, such
    as page name, type of security, basic structure, web services in use, and so on.
    Additionally, the attacker may also want to get other public information about
    the company, such as its location and any information about their employees that
    can be used later in targeted social engineering attacks.


    Normally, all the data is collected manually using public sources such as a simple
    Google search.


    # Phase 2 – Scanning


    Now that the attacker knows the web pages associated with Bravix (bravix.com,
    store.bravix.com, and bravix.com), it is time to scan them to collect more technical
    information that will be used during the attack:


    +   - OS versions.

    - IP addresses.

    - Web services used.

    - Opened ports.

    - The version of the Content Management System (CMS). Most web pages now use a
    CMS as a platform to run their web pages.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'As mentioned, this stage is more technical than the previous one and the attacker
    will leverage tools such as vulnerability scanners and network scanners to gather
    this data (we will see how soon).


    # Phase 3 – Gaining access


    With all information, the attacker can determine the vulnerabilities on the victim''s
    web pages (or web resources) and exploit them to gain access to the data.


    # Phase 4 – Maintaining access


    This is an optional phase that is executed in more elaborate attacks in which
    the attacker wants to harvest more data from the victim; however, in this example,
    the attacker may just grab the information needed from Bravix''s web servers and
    run.


    # Phase 5 – Covering or deleting their tracks


    Of course, this intrusion was illegal, therefore to avoid jail, the attacker will
    try to delete any track of this exfiltration of data by deleting any logs that
    may serve as evidence of crime.


    The following figure shows the five stages of a cyber attack; however, it is very
    important to highlight that these phases are not always sequential, and in fact
    many times they overlap. For example, an attacker may start covering their tracks
    from the first phase by using a VPN to avoid detection:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_260_0.png)


    Figure 8.1 – Phases of a cyber attack


    OK; based on what we just learned, we can determine the importance of the scanning
    phase because the more information the attacker gathers here, the higher the risk
    of the attack.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Therefore, let''s understand how we can leverage the same tools that attackers
    will use against us to proactively protect our systems from attack.


    # Nmap


    Nmap is must-have tool for network discovery and security auditing that allows
    us to do the following:


    +   * Perform an inventory of our network.

    * Gather uptime data for services or hosts.

    * Determine the hosts on a given network.

    * Determine the services offered (or enabled) by those hosts.

    * Determine the OS version of said host machines.

    * Determine packet filters or firewalls in us.


    Basically, Nmap leverages IP packets to gather all of this data and presents it
    very cleanly using a command-line interface or a GUI like Zenmap.


    Nmap is available for most OSEs, including Windows, Linux, and macOS, and can
    be downloaded for free from https://nmap.org/.


    > Warning

    Scanning someone''s system or network without written authorization from the owner
    is illegal in many countries, so moving any further, make sure you only do these
    scans on systems that are authorized.


    The good news is that if you want to test your knowledge or simply practice with
    Nmap, you can use a system that the people behind Nmap have generously created
    for educational purposes. The page is http://scanme.nmap.org/.


    Now, let''s see how this works by executing the basic nmap command on that test
    server:


    ```

    nmap scanme.nmap.org

    ```


    As shown in Figure 8.2, the basic command provides provides very valuable information
    about the server.


    Here you can see the ports that are open, and the service associated with each
    port.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Enhancing Your Network Defensive Skills


    This is very useful when auditing your infrastructure to confirm that just the
    required ports and services are open and if there are discrepancies, apply immediate
    actions to remediate the vulnerability before the bad guys discover it.


    ```

    kali@kali:~ nmap scanme.nmap.org

    Starting Nmap 7.91 (https://nmap.org) at 2020-12-05 23:51 EST

    Nmap report for scanme.nmap.org (45.33.32.156)

    Host is open (0.22s latency).

    Other addresses for scanme.nmap.org (not scanned): 2600:3c01::ff03:91ff:fe18:bb2f

    Not shown: 996 filtered ports

    PORT STATE SERVICE

    22/tcp open ssl

    80/tcp open http

    9929/tcp open nping-echo

    31337/tcp open Elite

    Nmap done: 1 IP address (1 host) scanned in 23.95 seconds

    ```


    Figure 8.2 – nmap basic output


    Now, let’s be aggressive by adding the –A parameter:


    ```

    nmap -A scanme.nmap.org

    ```


    As shown in Figure 8.3, the –A parameter gives us some additional and useful information
    such as the following:


    +   - Name and version of the service running on the port: This is a very important
    auditing tool that enables you to easily identify outdated and vulnerable services,
    so that you can contact the server owner to get them patched ASAP. Additionally,
    depending on the criticality of the vulnerability (for example, a very old version
    that may jeopardize the entire infrastructure), you can create a policy that if
    the service is not patched in X days, the server will be removed from the network.
    This will keep you from having exposed services on your infrastructure also puts
    some pressure on the system administrators to ensure that they get the service
    in question ASAP.

    - OS version: This will help you to determine if an unsupported OS is present
    in your infrastructure.'
  merge: -1
  img_proc: true
