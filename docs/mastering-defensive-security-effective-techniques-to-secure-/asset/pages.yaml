- pgno: 77
  md: '# Understanding cybersecurity vulnerabilities and threats 55


    This happened very quickly. At first, he seemed shocked, then he looked at me,
    and before I had the opportunity to finish what I had happened, I was kicked out
    of the bank!


    The problem was that his lack of understanding USB vulnerabilities gave him a
    false sense of security, which made him (and the bank) even more vulnerable to
    USB HID attacks.


    I later discovered that he was, in fact, just using a Windows policy (as shown
    in the following screenshot) to block storage USB devices. Of course, that will
    not protect him against any USB HID attacks:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_77_0.png)


    Figure 2.11 – Disabling storage device classes on Windows systems


    To understand why this happened, we needed to understand how the USB protocol
    works.


    # Understanding the USB protocol


    Every time you connect a USB device, it will first identify the speed of the device.
    Then, it will get the device descriptors, which, essentially, help with the identification
    of the device.


    One of the descriptors is the USB class, which tells the computer what kind of
    device you are connecting to; for example, consider the following:


    +   - Class 01h → audio device (as speakers)

    - Class 03h → HID device (as a mouse, a keyboard, or a Rubber Ducky)

    - Class 08h → mass storage (as a USB drive or an external hard drive)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Managing Threats, Vulnerabilities, Risks


    This is where the magic happens because, based on the example of the bank, they
    were protecting against devices Class 03h, but all Class 03h devices were able
    to connect directly without even a warning message.


    > Tip

    If you want to know more about the USB protocol, I suggest you take a look at
    https://www.usb.org/sites/default/files/hid1_11.pdf. This document explains, in
    detail, all you need to know how this protocol works and how it interacts with
    the host machine.


    Therefore, we need to find a way to protect our systems against Class 03h (that
    is, USB HID devices).


    # Protecting against USB HID attacks


    By now, you should be aware (and more likely worried) of the danger of USB HID
    vulnerabilities. So, now, it''s time for me to give you some tools, techniques,
    and methods that you can implement to effectively defend your infrastructure against
    them.


    # Leveraging Windows security logs


    Every time an external device is connected, Windows will generate a Security Event
    entry with Event ID 6416 (https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-6416).


    Using this, you can look for traces of attacking devices (such as Rubber Ducky)
    to detect any attacks.


    To achieve that, we need to take into account that most of the devices used in
    those attacks are based on two microcontrollers: the famous atmega32u4 (which
    is present on the Arduino Nano, Arduino Micro, and Teensy) and the smalltiny8
    (which is present on the Digispark and the Beetle USB).


    The good thing is that both are created by the same company, ATMEL, and that information
    is key because it will allow us to detect whether the device is a real keyboard
    or a tiny evil device:


    | idVendor | 0x03EB Atmel Corp. |

    | idProduct | 0x2FF4 |

    | iManufacturer | 1 ATMEL AVR |

    | iProduct | 2 HID Keyboard |'
  merge: -1
  img_proc: true
