    > Tip

    You need to be very careful when using this command as it could leave your system
    ever exposed. For example, you should not use umask 000, as it will grant full
    permissions (rwx) to everyone for all newly created files and folders.


    # Permissions hierarchy


    In Unix, the more specific permission takes precedence over the less specific
    permission.


    This means that user permissions take priority over group permissions, and both
    user and group permissions take priority over other permissions.'
