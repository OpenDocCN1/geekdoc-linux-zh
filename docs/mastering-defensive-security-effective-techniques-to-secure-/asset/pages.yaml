- pgno: 52
  md: 'There are two ways to create your layers, by means of the functionality of
    the control or by technology, as explained next.


    # Creating layers by type or functionality of the control


    Here, you create the layers based on the functionality or type of controls.


    The idea is that you correlate what you are trying to secure against the controls
    applicable to it. For example, there will be cases in which corrective controls
    may not be relevant, while in other cases, it should be the priority. Remember
    that in security, everything needs to be tailor-made based on the business.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_52_0.png)


    Figure 1.12 shows a full layered model that includes the most popular controls
    layered by their function. For example, an electrified fence to prevent someone
    from entering the building, a Camera system to detect intruders, a security guard
    to deter potential intruders, biometric authentication or geolocation as an alternative
    method to compensate a more expensive mechanism, a backup to perform the recovery
    following a disaster, and a “Reboot to restore” software to correct any issue
    or misconfiguration on a given system.


    # Creating layers by technology


    Here you create layers of controls based on the technology used, despite the fact
    that they provide the same functionality. For example, you may implement several
    methods or technologies on a critical system to detect intruders (IDS, audits,
    logs, and so on).'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/8c6a223c57e25ea0cc1593903a1b920f_53_0.png)


    In the preceding diagram, you can see an example of how you can create layers
    based on the technology. For example, a camera and a sensor may both be a detective
    control, but both use different technologies to achieve it. This model is very
    useful when you want to increase the focus on a given functionality, for example,
    implementing a plurality of technologies to provide a special focus on detection
    or prevention.


    > > Tip

    To make things more interesting, remember that layers can also be further defined
    on three categories of controls: administrative, physical, and technical. I know
    that you are already familiar with those categories (so there is no need to waste
    ink in explaining them), but I just want you to keep in mind that you can add
    components from the three categories on the same layer.


    # Which approach is better?


    This will depend on your infrastructure, and that is why performing an in-depth
    analysis of the environment is key.


    Remember that the logic behind this is to make things harder for an attacker and
    you can achieve that with both methods.'
