- pgno: 48
  md: '# Mastering defense in depth


    Back in the old days, people relied on perimeter defense, which is erecting a
    virtual fence to prevent non-authorized people from getting into your systems.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_48_0.png)


    Figure 1.8 – Single-layer perimeter defense


    However, the threat landscape has evolved, and we must do the same!

    While perimeter defense is mostly based on a single layer of protection (normally
    a network layer), **Defense in Depth (DiD)** takes this further by applying a
    plurality of security layers in which each layer offers a new line of defense
    against an attack.


    Normally, those layers are independent and each provides a different security
    mechanism that increases the overall security. The benefit of this independence
    is that a vulnerability that affects one layer may be irrelevant to the other
    layer. This is a great advantage over a pyramidal model where, if the foundation
    is affected, the rest will fall.


    However, this independence also has its downside in terms of the complexity of
    the operations. In this case, managing all the different layers (configuration,
    updates, maintenance) is not an easy task, but those who say that DiD will be
    easy!


    # Factors to consider when creating DiD models


    Most DiD models create the layers based on technology; however, if you want to
    apply DiD as a master, you must also consider the following very important factors:
    **People and Processes**.


    > Tip

    nThe DiD model can be applied at a macro level (the entire organization) or at
    a micro level (to a single system or technology). This means that once you master
    this method, you can use it to create your overall security strategy, as well
    as use it to create the security strategy to secure your web apps.


    Now, let''s analyze these two factors in detail.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The people


    People are often pointed to as the biggest threat in cybersecurity...and they
    are! And we are not talking about the criminals; we are talking about your company
    employees who are responsible for many of the security breaches, either as a result
    of an inadvertent error or by being used by an attacker to gain access to some
    systems or data.


    Therefore, we must consider the human factor when developing your defense strategy.
    Ignore this and your strategy will be doomed.


    The very first step for you is to segment the company employees by access type.
    Users should be created on a need-to-know/need-to-do basis. This segmentation
    of employees should be performed as part of your identity and management process
    and while, in the beginning, it may be a time-consuming process, in the end, I
    assure you that the investment is well worth it.


    # Admin rights


    Some companies started to adapt a policy to provide admin rights to employees
    over their work computers. The justification is related to the huge cost associated
    with having a support team in change of helping the user every time they need
    to install software, hardware, update, or plugin.


    But about the cost of reinstalling a machine following a malware infection? What
    about the cost associated with the installation of corrupted drivers? What about
    the cost of a leak due to the installation of a trojan? What about the legal cost
    of the installation of unlicensed or restricted software? Those are some of the
    questions that you may ask senior management in case they want to provide admin
    rights to everyone. Remember, it is your responsibility to help your organization
    to understand that security will always be above usability and user experience.


    Are you saying this should not be done? No, I am saying that this needs to be
    carefully analyzed from the cybersecurity perspective to ensure that if applied,
    all appropriate controls are in place to reduce the risks mentioned earlier.


    # The processes


    You must have an in-depth understanding of the organization that you are tasked
    with defending. You can achieve this by understanding all the company''s processes
    (or least the core of them). Once you know them, it will be easier for you to
    identify vulnerabilities and risks where others don''t!


    I understand that as a technical person, you may hate processes and the associated
    (and mostly) outdated documentation that it brings, but trust me, if you know
    them, you will bring an exceptional value that very few are capable of providing
    to their organization.'
  merge: -1
  img_proc: true
