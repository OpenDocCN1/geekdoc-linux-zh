    # Enhanced access controls


    There are additional systems designed to enhance the access controls by implementing
    security policies. One of the systems is the well-known SELinux.


    Linux access controls are determined by a set of policies loaded on the system
    kernel that enable an improved security mechanism that prevents changes of permissions
    by careless users or misbehaving applications.'
