    Additionally, most organizations need to perform administrative tasks on AD but
    from another computer—for example, IT support people doing password resets, or
    network admins doing Domain Name System (DNS) changes.


    These systems are known as secure administrative hosts, and we will now look at
    security best practices that must be applied to them.


    # Secure administrative hosts


    As mentioned, secure administrative hosts are systems (workstations or servers)
    from which privileged accounts can perform administrative tasks in AD.


    Here are some best practices about how you can configure them as a secure platform:


    +   * MFA in those systems.

    * Review the physical security of these systems to ensure they are in a secure
    zone.

    * Restrict permissions and prevent the installation of any additional software.

    * Avoid the installation and usage of email on those systems.'
