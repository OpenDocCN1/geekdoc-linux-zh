    This will prevent someone from using an expired badge to get physical access,
    as it will clearly show that it is no longer valid.


    > Tip

    Avoid using a universal badge to access all areas of a building. Instead, sensitive
    rooms like IT rooms should have a different access mechanism – for example, a
    different badge, a keypad, biometrics, or a combination of these.


