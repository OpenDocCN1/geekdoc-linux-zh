- pgno: 417
  md: '# Performing malware analysis 395


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_417_0.png)


    Figure 14.6 – PeStudio GUI


    Now, as seen in the preceding screenshot, we just need to drag and drop the file
    that we want to analyze.


    > Note

    Malware analysis is a dangerous task that may harm your computer or even your
    network, before starting, you need to follow some security measures, as we highlight
    next.


    # Security measurements


    There are some security rules that must be followed to reduce the risk when performing
    malware analysis. Here is a compilation of them:


    +   - Never use your personal or work computer to perform malware analysis.

    - Make sure the machine used for testing is isolated from the network.

    - The use of an isolated virtual sandbox environment is recommended.

    - Use a new sandbox for each analysis wherever.

    - Use a virtual machine (VM) hosted on a machine isolated from the network that
    has a fresh OS installed and with no other data stored.

    - Delete the VM when the analysis is complete.

    - Create a new VM for each analysis.

    - Wipe out the disk of the host computer and perform a new OS installation when
    dealing with dangerous malware and performing dynamic analysis.'
  merge: -1
  img_proc: true
- pgno: 418
  md: '396 Malware Analysis


    +   * Once the malware is identified, check if the malware is capable of hiding
