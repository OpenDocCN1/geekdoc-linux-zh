- pgno: 31
  md: '# Deep dive into the core of cybersecurity


    This topic is normally overlooked, and criminals know that, so you must understand
    and apply all the strategies, mechanisms, and systems to avoid these types of
    attacks in your organization. In Chapter 4, Patching Layer 8, we will go in deep
    about how to defend against attacks including phishing, spear phishing, whaling,
    pharming, and more.


    # Man-in-the-middle attacks


    Imagine you are on a date in the mall, and you want to show a video, but Murphy''s
    law intervenes and your internet speed is extremely slow. However, there is a
    Wi-Fi network called Free Wi-Fi — sounds like a miracle, right? Well, let me tell
    you that it is not your lucky day. Chances are a cybercriminal knows that cellular
    reception is poor in that area and a trap to capture your data without even noticing
    it.


    While this is a simplistic case of a man-in-the-middle-attack, it shows how easy
    it is to achieve.


    > Important note

    In terms of techniques, the criminal may use one of the many available, such as
    session hijacking, IP spoofing, replay, or eavesdropping. These will be covered
    in depth in Chapter 8, Enhancing Your Network Defensive Skills.


    # Denial-of-service attack


    The all-time favorite attack employed by hacktists, the Distributed Denial-of-Service
    (DDoS) attack, is very interesting because it affect you in two ways, as an attacker,
    and as a target. As mentioned earlier, the impact of these kinds of attacks depends
    on the nature of business; however, your infrastructure can be used by an attacker
    to launch a Botnet-based attack on another company and will have serious implications
    for your company regardless of the type of business.


    > Botnets

    A Botnet is a network of infected devices that are remotely controlled by an attacker
    (normally using a command and control server) to perform a plurality of tasks
    without the consent and knowledge of the owner of the device.

    The controlled or infected machines are normally called zombies and,, as mentioned,
    they will perform background tasks as DDoS attacks, sending spam, and mining cryptocurrency
    (Bitcoins).


    One interesting variant of these attacks is the SYN flood attack. This attack
    is very interesting and clever, and it is based on the TCP three-way handshake.
    But wait, what is a TCP three-way handshake?'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# A Refresher on Defensive Security Concepts


    Let me do an analogy to explain it: Imagine that you (the client) need a cab (the
    server), so you decided to call the cab (SYN). When the cab arrives, it informs
    you that it is at the gate (SYN-ACK) and waits for your confirmation to pass (ACK).
    Now, imagine that you never confirm and keep calling more cabs. Eventually, your
    driveway will be full of cabs, preventing the arrival of any other car to your
    house.


    No ACK response


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_32_0.png)


    I know this SYN Flood Attack may sound technical, but that doesn''t make it less
    common. Additionally, there are many other ways to execute a DDOS attack, and
    another cool example is the teardrop attack.


    # Teardrop attack


    The teardrop attack leverages an old vulnerability in which the system tries to
    reassemble fragmented packets, but since they were corrupted, the system crashes
    (by taking the CPU to 100%). As mentioned, this is an old vulnerability and an
    up-to-date system should not be affected. However, there is a new version called
    FragmentSmack, which affects current OSES, including Windows 10 and Linux distributions
    (see CVE-2018-5391). The good thing is that there are already patches for both.


    > Important note

    As a walkaround in Windows systems, you can disable packet reassembly as follows:

    \Netsh int ipv4 set global reassemblylimit=0\Netsh int ipv6 set global reassemblylimit=0


    There are other types of DDoS attacks, including the Ping of Death and Smurf Attacks
    (using ICMP packets), but these are old attacks that you should already be familiar
    with, so I am not going to waste your time on them.'
  merge: -1
  img_proc: true
