- pgno: 143
  md: '# Understanding layer 8 – the insider threat 121


    Now, let''s take a look at one example of a very common practice in IT departments,
    which is a really bad practice for security.


    # Shared credentials


    By default, the best practice says that shared credentials should NOT be allowed
    in your infrastructure. However, in case you do have them, you need to set up
    additional controls in place such as Multifactor Authentication (MFA), Role-Based
    Access Control (RBAC), and Privileged Access Management (PAM).


    PAM works by locking shared credentials into a repository that can only be accessed
    by authenticated employee accounts (enabling accountability). The credential is
    used by the system administrator, the credential is reset for the next employee.
    Although PAM solves the challenge of shared accounts, it is very expensive to
    implement:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_143_0.png)


    Figure 4.7 – An example of a PAM system


    The preceding diagram is an example of a PAM system and shows how each user logs
    into a centralized system (to enable accountability), and then from there, inject
    the shared account into the server.


    # Audits


    This topic was already covered in detail in Chapter 3, Comprehending Policies,
    Procedures, Compliance, and Audits; however, I want to highlight that audits are
    one of the most effective ways to detect malicious insiders, so make sure your
    infrastructure is audited regularly (either internally or externally).'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Cybersecurity policies


    As discussed in Chapter 3, Comprehending Policies, Procedures, Compliance, and
    Audits, policies need to be well defined and communicated. Additionally, those
    policies must include the associated sanctions in case there are any violations
    of them. Those sanctions are a great mechanism to dissuade malicious insiders,
    and why it is so important to make sure that all employees are aware of your cybersecurity
    policies.


    We already talked about two types of insiders: the inadvertent users and the malicious
    insiders. In this attack, an outsider will use the power of influence and psychological
    manipulation to convince or persuade an employee to perform a set of actions aimed
    to disrupt the systems or gather/modify sensitive data. This technique is known
    as Social Engineering, which we will be discussing next.


    # Mastering the art of social engineering


    Social engineering is one of the most fascinating topics in security. In fact,
    many experts define social engineering as an art: an art that requires a lot of
    social skills that enables the attackers to gain access to the victim''s mind
    to gather personal information or even persuade the victim to perform certain
    actions that will benefit the attacker.


    This is like hacking into the human brain to read the user''s data or inject instructions
    for the human to perform.


    As I mentioned earlier, this is a very exciting and important topic, so I will
    try to summarize it as much as I can.


    > Important note

    As a professional in defensive security, you must master this topic because the
    better you understand how this works, the better you can defend against it.


    Next, let''s take a look at the attacks that are aimed to trick the user. Additionally,
    keep in mind that while not all authors agree on classifying these attacks as
    types of social engineering, the truth is that these attacks share the same concepts
    and strategies as social engineering attacks.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# The social engineering cycle


    There are many techniques that attackers can use to perform a social engineering
    attack, but they need to be orchestrated, as follows, to improve the efficiency
    of the attack:


    +   1. **Information gathering**: First, the attacker will gather as much information
    as possible about the target individual or organization. The more the attacker
    knows about the organization, the higher the chances to succeed. For example,
    an attacker would be very interested in knowing the organizational structure,
    the processes, and procedures for the next steps.

    2. **Building trust**: Here, the attacker will use the data gathered plus a combination
    of social techniques to gain trust. In more elaborate attacks, the attacker will
    need to gain trust from a plurality of individuals to bypass additional security
    layers before reaching the target or victim.


    As you can see in the following screenshot, the attacker might also leverage some
