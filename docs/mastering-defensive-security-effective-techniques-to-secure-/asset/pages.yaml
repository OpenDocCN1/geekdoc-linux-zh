- pgno: 369
  md: '# # Overlooking the most common attacks on web applications


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_369_0.png)


    Figure 12.11 – DVWA web interface


    One very interesting attack is the famous XSS attack, which we will review in
    the following section.


    # # Overlooking the most common attacks on web applications


    Now is the time to talk about the most common attacks against web applications
    that you may face, and of course, all the methods, techniques, and tools that
    you use to protect your systems against them.


    # # Exploring XSS attacks


    The logic behind this type of attack is very simple: to leverage some JavaScript
    or HTML to execute code on your web application.


    To better understand these types of attacks, let''s look at one of the most common
    types of XSS attacks: **the hijacking of user sessions.**'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Hijacking a user session


    Here, the attacker will try to inject malicious code into a web application that
    can be used to exfiltrate the session cookie that will be used to impersonate
    the victim.


    To illustrate this attack, let''s see an example based on a web application used
    to rent houses, as follows:


    +   1. The attacker will log in to the vulnerable site and create an entry to
    advertise the renting of a house but inside the description of the field (which
    a normal person will describe the goodies of the house for rent), the attacker
    will embed malicious code aimed at gathering the user''s session cookie and sending
    it to their server.

    2. When another user opens that hacked advertisement to rent a house, the malicious
    JavaScript will be executed and the victim''s session cookie will be copied and
    sent to the attacker.

    3. Now, the attacker can impersonate the victim by the stolen session cookie to
    identify themselves as the victim on the system, as shown in the following screenshot:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_370_0.png)


    Now, let''s see how you can prevent this attack. You could do the following:


    +   * Set php.ini directives, as follows:


    ```

    session.use_only_cookies = 1 -> for using only cookie based session ids

    session.use_trans_sid = 0 -> disable showing PHPSESSID in browser url

    ```'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Overviews the most common attacks on web applications


    +   * Use session_regenerate_id() every time you provide any important data (this
    will delete the old session number and generate a new one).

    * Save in $SESSION some fingerprinting about the user (such as IP address, browser-agent,
    and so on). Then, you can correlate that every cookie is received and if there
    is a mismatch, then you know something is not good.

    * Use an SSL certificate to encrypt your data in transit.

    * Educate your users to always log out instead of just closing the browser when
    using your web applications.

    * Use timeout to kill idle sessions (expire sessions).

    * Keep session Identifiers (IDs) out of the Uniform Resource Locator (URL).

    * Avoid reuse of session IDs for authentication.

    * Flag session ID cookies as HTTPOnly.

    * Request reauthentication when accessing a sensitive resource in your web application.


    It is also important to highlight that there are many other known XSS attacks,
    such as the following:


    +   * Execution of unauthorized activities

    * Phishing

    * Capturing keystrokes

    * Capturing sensitive information


    Now, let''s overview some additional tips that you can leverage to better protect
    your web applications against XSS attacks.


    # Additional mitigation steps against XSS attacks


    Here is a list of some best practices that can be used to reduce the risk of being
    impacted by an XSS attack:


    +   * Keep your web application up to date with security updates.

    * Sanitize inputs.

    * Rest JavaScript entries on input fields (input validation).

    * Ensure that all third-party modules of your web application are also up to date.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '+   Regularly check the CVE site to determine whether any of your systems are
    impacted by a newly discovered XSS vulnerability: https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=xss.


    Now, let''s talk about one of the best tools used to test vulnerabilities on web
    applications:

    Burp Suite!


    # Using Burp Suite


    Burp Suite is a great platform that allows us to look for vulnerabilities in our
    web applications. In fact, if you have web applications, you must have at least
    one person trained to use Burp Suite to test the security of your web applications.


    But don''t worry if you don''t have any experience with this tool—this section
    is for you!


    Here, you will learn how to set up Burp Suite to be ready for the next sections,
    in which you will see how to use Burp Suite and DVWA to test a web application
    against two very common attacks: SQL injection and brute-force attacks.


    # Burp Suite versions


    Let''s start talking about the three main versions of the tool (but to make it
    easier, we will separate it into two—the free and the paid versions).


    # Professional and Enterprise editions


    These versions come with more advanced tools, plus you can leverage them during
    your web application testing. Additionally, they also come with automation settings,
    which may be essential for large companies or corporations.


    # Community edition


    This is a basic version of the tool that is included on Kali Linux by default.


    With this version, you can perform many tests with the limitation that tests cannot
    be automated (they all have to be manually executed) but is good enough for medium-to-small
    companies.


    But that is enough theory, so, if you want to know more about the details of each
    version and its price, visit their site at https://portswigger.net/burp.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Now, let''s briefly explore the interface of the Community version of Burp
    Suite on Kali Linux before we jump into some real case scenarios that you can
    execute yourself of the most common testing operations for web applications, including
    SQL injections and brute-force attacks; but first, let''s get familiar with the
    tool.


    # Setting up Burp Suite on Kali


    To execute Burp Suite on Kali, just open the command line and type the following
    command:


    ```

    burpsuite

    ```


