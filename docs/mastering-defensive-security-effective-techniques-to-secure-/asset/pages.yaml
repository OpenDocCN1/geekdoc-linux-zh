- pgno: 168
  md: 'Finally, you will understand the importance of critical thinking in cybersecurity
    and look at a real-life example of how a cybersecurity threat can become an IT
    solution.


    In this chapter, we are going to cover the following topics:


    +   * Networking tools and technologies for cybersecurity

    * Pentesting tools and methods

    * Applying forensic tools and methods

    * Dealing with APT

    * Leveraging security threat intelligence

    * Converting a threat into a solution


    # Technical requirements


    To get the most out of this chapter, you will need to install Kali Linux. This
    way, you can play around the tools that we will overview. Kali Linux is very light,
    so you can install it pretty much any old computer with internet access.


    Another option is to use a virtual machine, but in that case, you may need to
    tweak some settings (especially your network settings) to ensure that all the
    tools will behave as expected.


    All the images, including pre-built virtual images, for virtual machines can be
    found here: https://www.kali.org/downloads/


    We will also be reviewing the outstanding WiFi Pineapple, so having one of them
    will help you take the experience and knowledge of this chapter to the next level.


    For more information about this must-have pentesting tool, go to https://shop.hak5.org/products/wifi-pineapple.


    # Advanced wireless tools for cybersecurity


    As masters in defensive security, we need to know about and understand how the
    latest tools work. It does not matter if they were developed as offensive tools;
    you need to learn how to take advantage of them. Let''s start by taking a look
    at some of the latest and coolest wireless tools.'
