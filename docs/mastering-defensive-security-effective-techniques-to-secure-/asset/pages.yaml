    # Sigfox


    Sigfox was developed to send small messages a few times a day. This keeps costs
    and power consumption as low as possible. With this technology, you can send up
    to 140 messages a day (12 bytes for uplink messages and 8 bytes for downlink messages).


    This is especially useful in transferring data from sensors over long distances
    at a low cost.


    This technology is becoming widely popular, and, as you can see in Figure 10.6,
