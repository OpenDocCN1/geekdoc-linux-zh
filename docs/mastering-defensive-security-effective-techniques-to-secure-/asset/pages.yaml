- pgno: 66
  md: '# Managing Threats, Vulnerabilities, and Risks


    > Tip

    nYou can use Shodan.io to look for vulnerabilities on your sites, systems, and
    devices exposed to the internet. The search engine allows you to look by

    URL, IP address, subnet, type of device, country, and more.


    I will expand this topic with many examples (including how to leverage IoT-enabled
    devices for security) in Chapter 10, Applying IoT Security.


    # Vulnerabilities on SCADA/ICS


    If your company does any type of manufacturing; has a smart building; uses smart
    systems to manage energy, waste, and water; or is in the business of smart cities,
    it is very possible that they have SCADA systems.


    Those systems are critical, and you need to ensure that they are protected as
    the impact of an attack on these systems is usually devastating for the company.
    One good example of the impact of this type of attack is Stuxnet. This state-backed
    attack was able to disrupt a nuclear power plant by targeting its SCADA systems.


    These systems are very complex, and depending on the vendor, they can be very
    different from each other, making the task of securing them quite complex. However,
    there are some steps or best practices you can apply to secure these systems:


    +   - If possible, schedule maintenance services performed by the vendor, and
    make sure those services include a vulnerability assessment.

    - Keep the devices up to date with the latest updates.

    - Understand the protocols used by the system and look for associated vulnerabilities.

    - Delete or disable users on the systems.

    - Disable the features that are not in use by your organization to reduce the
    number of risks and possible vulnerabilities.

    - Avoid the use of third-party plugins if not approved by the vendor.

    - Disable remote access connections or mobile applications if not in use.

    - Disable unused APIs.

    - Apply network segmentation and isolate those devices from other web-facing systems.

    - Restrict physical access to the management consoles of the devices.

    - Make sure that all default users and passwords are changed for strong credentials.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Understanding cybersecurity vulnerabilities and threats 45


    If your organization does not have any experience with these systems, the best
    practice is to hire a third-party company to either provide your team with training
    on how to secure those systems or have a contract with them in order to keep those
    systems secure.


    # Supplier vulnerabilities


    Remember that the availability of your systems relies on your suppliers, so you
    need to analyze them to uncover any possible vulnerabilities associated with those
    suppliers (such as the internet provider, cloud provider, hardware provider, and
    more).


    # Client vulnerabilities


    There be cases in which you will have to connect your systems to the network or
    infrastructure of a partner; in those cases, you need to perform a detailed vulnerability
    assessment of those foreign systems to ensure they do not add additional vulnerabilities
    to your infrastructure.


    # Dependencies


    One important aspect to consider when doing a vulnerability assessment is identifying
    your system or infrastructure dependencies and then analyzing those dependencies
    to uncover any potential vulnerabilities. One clear example of this is a system
    that might consume artificial intelligence (such as a chatbot) through an API
    connection that, if down, will not work properly or can be spoofed.


    # Process vulnerabilities


    Imagine that your company does not have a process regarding what to do when an
    employee leaves the company. In this scenario, one system administrator might
    just disable the user (which creates a residual risk), while another might delete
    the user (which could be a problem because you leave no traceability to that user).
    Therefore, both scenarios could cause a problem. This is why, incomplete, or poorly
    designed Identity and Access Management process is, itself, a big vulnerability.


    > **Tip**nStarting a vulnerability assessment is probably the hardest part of
    the process because you might not know where to start. Here, my recommendation
    will be to first outline the vulnerability types as categories and then start
    looking for vulnerabilities in those areas. That will serve you as a starting
    point, but it will also help you to avoid leaving an entire category unassessed.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Managing Threats, Vulnerabilities, and Risks


    Now, it is time to learn one of the biggest vulnerabilities that is being exploited
    by attackers with physical access to a system: USB HID Vulnerabilities.


    # USB HID vulnerabilities


    This vulnerability should, ideally, have been a subtopic of the Types of vulnerabilities
    section. However, I decided to create an entire section dedicated to these vulnerabilities
    because they are a common and dangerous vulnerability that is present in almost
    all companies and infrastructures. Therefore, it is key that you clearly understand
    them and be prepared to apply a plurality of methods, systems, strategies, and
    techniques to effectively protect your company against them.


    # A real and dangerous threat


    What makes this vulnerability so relevant that it is present in almost all systems
    regardless of the operating system. In fact, the chances are that all your systems
    (including computers, tablets, laptops, and ever servers) have this vulnerability:


    > "USB HID-based vulnerabilities are considered one of the worst IT threats ever
    discovered."

    – Rhonda Childress


    The reason is that it leverages two factors that are present in almost all systems:
    a USB connection and HID drivers.


    Another factor that makes this threat even more dangerous (and relevant) is the
    price of the hardware needed. In fact, to leverage this vulnerability, you just
    need a board with the ATMEGA 32U4 chipset, which (as shown in Figure 2.4) can
    be found on several cheap boards (below $5):


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_68_0.png)


    USB Teensy

    Arduino Micro

    ATMEGA 32U4

    CJMCU


    Figure 2.4 – ATMEGA 32U4 boards


    Now, let''s take a deeper look at the technical side of this attack and some examples.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Understanding cybersecurity vulnerabilities and threats 47


    # What are HID drivers?


    Almost all systems will allow human inputs (that is, interactions with the system),
    and that is done through a device such as a mouse or a keyboard. Therefore, to
    make our life easier, a set of generic drivers were created and loaded in all
    operating systems to make almost all keyboards and mice Plug and Play devices.
    This was very convenient for users until they were exploited by attackers to perform
    keystroke attacks.


    # The beginning of USB HID attacks


    When working as a system administrator, my friend and founder of Hak5 Darren Kitchen
    was tired of typing the same commands to fix devices. So, he programmed a development
    board to emulate the typing for him; thus, the keystroke injection attack was
    born.


    # How does the attack work?


    This is very simple; when the malicious USB device is connected, the device presents
    itself as an HID device (either a keyboard or a mouse), and since HID devices
    are trusted by default, the malicious device will now have full access to inject
    any code or commands into the target system. However, since this is a low-level
    attack, the code needed to inject the keystrokes was a bit complex, that was,
    until the arrival of the USB Rubber Ducky and Rubber Duck Scripts.


    # Types of USB HID attacks


    While the Rubber Ducky was the first commercial device that leverages this vulnerability,
    nowadays, many other devices can be used to leverage this vulnerability. Here,
    we will explore the most famous ones.


    # USB Rubber Ducky


    > "Looks like a flash drive – types like a keyboard".'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Managing Threats, Vulnerabilities, and Risks


    A few years ago, Darren Kitchen from Hak5 introduced the USB Rubber Ducky, a USB
    device that is capable of exploiting this USB vulnerability and allows you to
    inject almost any payload onto the target machine:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_70_0.png)


    Figure 2.5 – The USB Rubber Ducky specification


    While this tool was created for system administrators and penetration testers,
    the risk of this device being used by an attacker is very high:


    > As we know from experience, trust is difficult to build and easy to break. The
    USB Rubber Ducky – with its flash drive appearance – breaks trust by deceiving
    the human operator into thinking it’s innocuous. Likewise – by mimicking a keyboard
    – it deceives the computer into thinking it’s a human. A simple lie is so effective
    when computers, by design, are built to inherently trust humans – and to be perfectly
    honest, I don’t want to live in a world where they don’t.


    Darren Kitchen


    # USB Rubber Ducky scripts


    One of the best contributions to the penetration testing and system administrator
    community was the introduction of the Ducky Scripts, a super simple (and elegant)
    language that allows you to write payloads for a plurality of malicious USB HID
    devices using any text editor:'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Understanding cybersecurity vulnerabilities and threats 49


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_71_0.png)


    Figure 2.6 – Ducky Script Sample


    As you can see, in the preceding screenshot, creating Ducky Script is very easy
    and intuitive. In this example, you use REM to add a comment, then add a Delay
    of 3,000 milliseconds, which is a good practice on kinds of scripts because it
    waits 3 seconds before executing the actions. This allows enough time for Windows
    to load all of the drivers and make sure that the device is ready when executing
    the attack.


    Then, it opens Command Prompt (Windows + R) and adds another small delay (to make
    sure the system has enough time to open the run window). Then, it injects some
    keystrokes open a program with a given set of parameters. In this example, we
    open Internet Explorer in kiosk mode (full screen) and then open a page that emulates
    a system update, as shown in the following screenshot (an update from Steam):


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_71_1.png)


    Figure 2.7 – A fake update screen'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Managing Threats, Vulnerabilities, and Risks


    This is a harmless example that could just cause panic to the user, but without
    any real damage. However, an attacker can perform a lot of very dangerous attacks
    using this kind of device, such as exfiltrating your data to a remote server,
    executing a reverse shell, stealing user credentials, and more.


    > >Tip Do you want to know more about Ducky Script? Here is the link to the official
    Git Wiki where you can learn how to create your own script with many examples,
    including DNS poisoning attacks, OSX attacks, and more: https://github.com/hak5darren/USB-Rubber-Ducky/wiki/


    While the USB Rubber Ducky is the pioneer device that leveraged this vulnerability,
    there are many other devices that also leverage HID vulnerabilities.


    # Bash Bunny


    The Bash Bunny by Hak5 is one of the world''s most advanced USB attack platforms.
    This small and powerful USB enables the attacker to perform a plurality of attacks
    with a single device. So, while the USB Rubber Ducky just has capabilities to
    inject keystrokes, the Bash Bunny has additional capabilities such as USB ethernet
    control, mass storage, and a serial console (essentially, the device is a small
    Unix Box). To make this more dangerous, the Bash Bunny allows the attacker to
    combine all of the preceding capabilities, making this device a serious threat
    to your infrastructure. If you want to know more, please refer to http://www.bashbunny.com.


    # WHID Injector


    Previous examples have limitation because attacks need to be preloaded on the
    device, but if you want to inject your payloads remotely? Well, this is exactly
    what you can do with the WHID (https://github.com/whid-injector/WHID).


    The WHID is based on inexpensive (but powerful) hardware that works over the ESploitV2
    software to perform the injection of commands. To make the attackers'' lives easier,
    you can use an app to control the injections remotely. The app is available on
    https://store.nethunter.com/en/packages/whid.usb.injector/


    # P4wnpi


    This is a very cool project that uses a Raspberry Pi Zero (which is a wonderful
    IoT-enabled single-board computer) to perform a plurality of USB HID attacks:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/8c6a223c57e25ea0cc1593903a1b920f_73_0.png)


    Figure 2.8 – The Raspberry Pi Zero with a USB A port


    One of the characteristics that make this attack very dangerous is that the Raspberry
    Pi Zero W has Wi-Fi capabilities built-in, enabling the attacker to execute actions
    remotely and even exfiltrate data to an external server in real time.


    > **Important note**nWould you like to create your own cybersecurity device using
    an IoT-enabled Raspberry Pi? If yes, then I will show you how to do it in *Chapter
    10, Applying IoT Security.*


    If you want to increase your cybersecurity skills and become a cybersecurity researcher,
    then I highly encourage you to use IoT devices such as a Raspberry Pi or an ESP8266
    to perform your own testing.


    # USB Harpoon


    You might be thinking that connecting a USB drive could be very suspicious (which
    is true), but that can be solved with a few social engineering skills.


    However, to overcome that limitation, researchers embedded a *BadUSB* device into
    a charging cable to masquerade the attack and create this new threat called the
    **USB Harpoon.**


    Now you can start being paranoid every time you see a USB cable in your company
    because even the cable used to power up a USB fan can be a **USB Harpoon.**'
  merge: -1
