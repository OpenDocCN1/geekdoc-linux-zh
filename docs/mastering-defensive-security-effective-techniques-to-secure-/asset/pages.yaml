    You can visit their site at the following URL: https://github.com/cowrie/cowrie.


    # SNARE


    A smaller option is the super next generation advanced reactive honeypot (SNARE).
    This web application honeypot will help you to attract and track a log of bad
    actors from the wild zones of the internet.


    This type of honeypot allows you to host a page while being able to see all the
    traffic and activities that occur on that page.


    The official site is available at the following URL: https://github.com/mushorg/snare.


    # Advanced monitoring of web apps and networks


    Nagios Core is an open source system that offers network and application monitoring.
    It monitors hosts and sends alerts in the case of any error (and also when the
    service is back online).


    Nagios Core includes the following features:


    +   - Monitor network services (SMTP, POP3, HTTP, NNTP, PING).


    +   - Monitor resources (CPU load, disk usage, and so on).


    +   - Notifications and alerts (via email, pager, or as defined by the user).


    +   - A web interface to view network status, notifications, error history, logs,
