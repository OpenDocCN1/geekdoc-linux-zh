- pgno: 318
  md: '# Bluetooth security vulnerabilities


    BLE includes 128-bit encryption, plus authentication. These are two essential
    mechanisms in security. However, there are still some vulnerabilities related
    to BLE:


    +   - Devices are vulnerable to several attacks when in discoverable mode; therefore,
    this should only be used during setup and turned off after. However, some devices
    come with the discoverable option by default, and do not give you the option to
    change it. Such devices (normally very low-cost IoT devices) should be avoided.

    - There are some vulnerabilities listed on the CVE site about BLE. However, most
    of them are related to weak implementation by the manufacturer and not about the
    protocol itself. Refer to the following URL: https://cve.mitre.org/cgi-bin/cvekey.cgi?keywordble.


    In 2020, a Tesla Model X was hacked by a cybersecurity expert in 90 seconds by
    taking advantage of a massive Bluetooth vulnerability.


    There are other technologies, such as NFC, that are also used on IoT implementations
    to exchange data or trigger actions. Those technologies also need to be analyzed
    to ensure they will not represent a threat to our data or devices.


    # Security considerations


    As we just saw, many of these protocols offer enough security mechanisms for IoT
    networks. However, most of the vulnerabilities found are related to poor implementations.
    Therefore, the overall security considerations for IoT devices are as follows:


    +   - Always research about an IoT device before purchasing, as it may have poor
    security implementation or an outdated version of the protocol.

    - Perform a feature analysis to determine which is the best option for you in
    terms of speed, bandwidth, and distance (as seen in Figure 10.7).

    - Make sure that all implementations are carried out by an expert to avoid security
    holes.

    - Be aware of low-cost devices and sensors, as they may lack encryption or security
    mechanisms (to reduce cost).

    - Isolate the IoT network from your corporate network to avoid additional risks
    to your main infrastructure.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'The following graph shows a comparison of IoT network protocols:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_319_0.png)


    Figure 10.7 – Comparison of IoT network protocols


    As seen in Figure 10.7, there is no one-size-fits-all solution. Instead, every
    technology has its pros and cons that need to be evaluated in order to determine
    which is the best solution for you. Remember that availability is one of the factors
    that you need to evaluate as part of your cybersecurity strategy. Therefore, you
    also need to take into consideration which of these technologies gives you a higher
    fidelity and a lower risk of losing packets or connections.


    # Improving IoT security


    Now, let’s analyze some additional mechanisms and best practices that you can
    apply to improve the security of IoT devices.


    # Default passwords


    Change all the default passwords of all IoT devices upon installation.


    Also, make sure you select very strong passwords for those devices, consisting
    of the following properties:


    +   - 15 characters long.


    +   - Letters (lower and upper case), numbers, and special characters.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Applying IoT Security


    +   - Avoid the use of common words (also known as dictionary words) like names
    of countries, months of the year, and so on.

    - Change it at least twice a year for home devices and quarterly for business
    devices.

    - Use a password manager for secure and easy management of your passwords.


    However, using a super password is not enough. You should also obfuscate the username
    to make things even harder for the attacker. Let''s do this by changing the **default
    user**.


    # Default users


    Default users like **Admin** are easy to guess for attackers, so changing them
    will make it harder for an attacker.


    # Disable unnecessary features


    If an IoT device has options, such as remote connections to the admin panel or
    vulnerable services such as Telnet, enabled, then you **must** disable them.


    # Insecure systems


    Before purchasing any IoT devices, you **must** check for known vulnerabilities
    on the web (for example, at the following URL: https://cve.mitre.org/). If the
    vulnerabilities are solved (for example, by the company releasing a patch), then
    it means that the manufacturer takes security seriously. However, if the vulnerability
    has not been resolved by the manufacturer, you should look for an alternative,
    instead of adding a vulnerable device to your network.


    > **Important note**

    In2020, a group of researchers used Shodan.io to find vulnerable printers and
    used a script to force those vulnerable printers to print a *guide on printer*
    security.'
  merge: -1
  img_proc: true
