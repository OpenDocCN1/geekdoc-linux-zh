    # Comparing the blue and red teams


    The blue team is the defense team, the one in charge of the policies, processes,
    methods, and technologies aimed at preventing a cybersecurity incident (which
    is probably you).


    On the other hand, the red team is a team of professionals trained to find vulnerabilities.
    They will use their skills to find a way to access a given system or data.


    They will basically follow the same steps that an attacker would, but instead
    of exposing your data or selling it to the highest bidder, they will create a
    beautiful report that you can use to detect your vulnerabilities and create strategies
    to correct them.


    Some big companies may have their own red team, but this is very expensive, and
    resources may underutilized, most of the companies just hire them on a regular
    basis to test their infrastructure and gather valuable data to improve.


    Like other topics in cybersecurity, there is an open debate about red teams and
    pentesting, so to make things easier for the reader, pentesting will be defined
    as one of the tasks carried out by a red team.


