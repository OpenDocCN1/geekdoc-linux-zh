- pgno: 133
  md: '# 4 Patching Layer 8


    "Cybersecurity measures are frequently focused on threats from outside an organization
    rather than threats posed by untrustworthy individuals inside an organization.
    However, insider threats are responsible of many millions losses in critical infrastructure
    nowadays."


    – Ricardo Gazoli – Head of IT executive


    Users are, by far, the most vulnerable factor in cybersecurity. In fact, a recent
    study revealed that more than 50 percent of attacks are caused by insiders either
    by accident (inadvertent users) or intentionally (malicious insiders).


    One common mistake is to prepare cybersecurity specialists to deal with technical
    challenges such as servers and networks, and not prepare to address all the risks
    related to the human factor (inadvertent users and malicious insiders). In fact,
    many people agree that managing the users is far more complex than dealing with
    systems because, in the end, you cannot simply patch them!


    Therefore, managing users is an art; in this chapter, I am going to show you all
    the different attack vectors aimed at the user, but also how you can master a
    plurality of techniques, methods, and tools to prevent those kinds of attacks.


    In this chapter, we are going to cover the following main topics:


    +   - Understanding layer 8 – the insider threat

    - Mastering the art of social engineering'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - Defending against social engineering techniques

    - Defending against social engineering attacks (patching layer 8)


    # # Understanding layer 8 – the insider threat


    As you probably know, users are also called layer 8 (as a joke) because they are
    on top of the 7-layer OSI model.


    Another, more professional, to call users insiders. These insiders are a serious
    threat because they are already inside the network; therefore, many of our defensive
    systems and mechanisms (which are used to prevent users from accessing our network)
    will not apply to them.


    Now, we will cover the different types of users that you need to consider when
    considering your cybersecurity strategy.


    # # The inadvertent user


    Based on a study from the Ponemon Institute, around 24 percent of data breaches
    are caused by innocent human errors. We call them innocent errors because they
    are normally user mistakes in which there is no user intention to cause harm to
    the data or the systems.


    Many people believe that these kinds of incidents are rare or cause minimal impact.
    However, as you can see in the following diagram, a study from the Ponemon Institute,
    in 2020, as you see a different panorama:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_134_0.png)


    Figure 4.1 – The cost of insider threats


    I am going to summarize the most common mistakes or errors caused by inadvertent
    users, as follows:


    +   - The use of weak passwords

    - The repetition of passwords across systems

    - The use of the same password for personal systems

    - A lack of understanding of cybersecurity policies'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Understanding layer 8 – the insider threat 113


    +   * The misuse or abuse of privileged accounts

    * Unattended devices

    * The mishandling of data

    * The installation of unauthorized software

    * The inadvertent disruption of systems

    * Careless internet browsing

    * The use of free or open Wi-Fi

    * "Click before think" (that is, in email attachments or links)

    * The inadvertent disclosure of sensitive information


    As mentioned earlier, these are innocent victims with no intention from the user
    to harm the company. However, there is another type of threat in which users are
    motivated to perform an attack, and they are known as malicious insiders, which
    we will be discussing next.


    # The malicious insider


    First, let''s try to gain an understanding of what types of motivation might cause
    an employee to turn into a malicious insider:


    +   1. Offers from external attackers to provide data or perform actions in exchange
    for money

    2. A lack of cybersecurity regulations and corporate sanctions

    3. A lack of controls

    4. The concentration of power

    5. Bad management

    6. Poor performance appraisals

    7. Disagreements with corporate policies, strategies, and coworkers

    8. Layoffs'
  merge: -1
  img_proc: true
- pgno: 136
  md: '114 Patching Layer 8


    The following figure shows the difference in terms of motivation between a malicious
    insider and an inadvertent user:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_136_0.png)


    Figure 4.2 – Types of insider threats


    As you can see in Figure 4.2, understanding those motivations will help you to
    work with management to create strategies to avoid users turning into malicious.
    Additionally, implementing a training and education strategy will be your best
    ally to prevent mistakes from inadvertent users.


    # How do you spot a malicious insider?


    Here is a list of behaviors or actions that can help you to identify a malicious
    insider before it is too late:


    +   - The download of big amounts of data (or a dump of databases)

    *- After-hours access to systems and information

    *- Escalation of privileges

    *- The download of sensitive information without a business need

    *- The creation of accounts without following established processes and controls

    *- The increased upload of data to unknown external addresses

    *- Repeated access requests to sensitive systems or data

    *- Requests for exceptions of a given cybersecurity policy

    *- The increased usage of external storage devices

    *- Abnormal attachments on emails (by size or by the number of files)

    *- Evidence or signs of the execution of hacking tools

    *- Unexpected or increased connection of personal devices to the corporate network'
  merge: -1
  img_proc: true
