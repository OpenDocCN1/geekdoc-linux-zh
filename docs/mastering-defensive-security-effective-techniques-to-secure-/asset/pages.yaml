    advantage of:


    > Attacker: Hi, my name is Bob and I am calling from the IT department.

    Looks like you reported an issue, please tell me, How can I help you?


    > Victim: Hi, I did not report an issue, but can you help with an issue with network
    drive?


    Possible attacker responses:


    +   1. Sure, please click on the link that just sent you to open a remote connection
    to assist you.

    2. Sure, before proceeding, could you please provide your employee number and
    password?

    3. Sure, but in order to confirm your identity, please enter your credentials
    on the following link.


    Figure 4.18 – A quid pro quo attack'
