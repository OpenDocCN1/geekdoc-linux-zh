  md: '# Mastering the art of social engineering 127


    # Phishing


    As you probably already know, this concept is very simple. The attacker sends
    a fake email trying to impersonate a reputable person or company. To increase
    their chances of success, the attacker will first try to convince the victim that
    the email is legitimate (by using company logos or impersonating an email account
    or domain) and then request the user to take some action, normally to access a
    link or open an attached PDF.


    Let''s view some examples next.


    Everyone dreams of free money, and attackers know that. So, to leverage human
    desire, an attacker will impersonate a company that wants to transfer your money
    but claim that they were unable to do it because the number was incorrect. Then,
    to be able to gain that money, you just need to open a harmless PDF that, of course,
    will be packed with all kinds of viruses, from a keylogger to deadly ransomware.


    In Figure 4.11, we have highlighted the common aspects to help you identify these
    types of attacks:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_149_0.png)


    Figure 4.11 – A “free money” phishing example


    We sent several mails without getting any response from you.

    This is to that we have tried making payment to your bank and it was rejected.

    Kindly check the attached bank print out and confirm your banking details as the
    SWIFT code does not match with your company''s bank as attached on this email.

    Please check the attached bank print out and return with the correct details ASAP
    to enable our bank process the transfer ASAP.

    Awaiting your prompt confirmation.


    Everyone shops online these days, and the probability that you are expecting a
    package is very high, so attackers leverage and indiscriminately send these types
    of phishing emails, hoping that one who is expecting a real delivery falls into
    the trap.


    As shown in Figure 4.12, the attacker will impersonate a well-known delivery company,
    but there are still several items that you can use to confirm that the address
    is Hotmail.


    The first one (which might look very obvious) is to confirm that the address is
    from Hotmail.


    The second one that your email is listed in To field.'
