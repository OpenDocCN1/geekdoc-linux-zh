  md: '# Enhancing Your Network Defensive Skills


    As we saw before, you can use the >> {file_name} option at the end of the preceding
    command to export the result to a .txt file to make it easier to send to the server
    owner (to get vulnerabilities fixed ASAP). Also, having the file exported as .txt
