- pgno: 257
  md: '# 8

    Enhancing Your Network Defensive Skills


    > "The digital economy and the knowledge society is supported by immense masses
    of data that navigate in cyberspace, enabling the interaction between systems,
    humans and companies. Thus, the future of connected humanity depends on the investment,
    robustness and cybersecurity of telecommunications networks."


    - Luis Adrian Salazar, Former Minister of Science Technology and Telecommunication
    of Costa Rica


    The foundation of a network security strategy should be based on knowledge of
    the data that is passing through this network.


    You will be amazed by the huge amount of overhead that is passing through this
    network.

    But most importantly, you will be surprised with the amount of network traffic
    that flows through your network even when you are not using it. Programs requesting
    updates, programs sending encoded data to their servers (something that we agree
    to when we install social media apps such as TikTok and Facebook), and many other
    things are the cause of this constant flow of data.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Let''s take a look at all the juicy content that is waiting for you in this
    chapter:


    +   * Understanding the phases of a cyber attack.


    +   * A deep dive on one of the best tools for your defensive security arsenal:
    Nmap.


    +   * A collection of guided examples to get hands-on experience on Nmap.


    +   * A walk through the biggest security flaws and vulnerabilities on wireless
    networks.


    +   * We will create the best-in-class safety guide for wireless users.


    +   * We will also review another tool for network analysis: the mighty Wireshark.


    +   * We will look at some vulnerable protocols, plus some guided demos show how
    easy it would be for an attacker to capture sensitive data if those protocols
    were used in.


    +   * You will also learn the basics about IPS and IDS, and their similarities
    and differences, and have a quick look at the best free IPS and IDS available
    to you.


    +   * Plus, this chapter has a bonus – a bonus! in which you will learn how to
    play old-school games, visit an ancient virtual museum, and even watch an ASCII
    movie for free using Telnet.


    # Technical requirements


    To make the best of this chapter, you need to install Kali Linux. This way, you
    can play around with the tools that we will oversee.


    Kali Linux is very light so you can install it on pretty much any computer with
    internet access.


    Another option is to use a virtual machine, but in that case, you may need to
    tweak some settings (especially network settings) to ensure that all tools will
    behave as expected.


    All images, including pre-built virtual images for virtual machines, can be found
    here: https://www.kali.org/downloads/'
