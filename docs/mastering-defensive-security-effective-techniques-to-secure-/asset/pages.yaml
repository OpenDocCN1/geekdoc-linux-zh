- pgno: 25
  md: '# # 1

    A Refresher on Defensive Security Concepts


    Cybersecurity is no longer an exclusive matter of the IT department, it is increasingly
    an issue that needs to be understood by the company’s leadership and a challenge
    that involves the awareness and knowledge of each of the members of the organization.


    - Rogelio Umaña - Senior Partner | Digital Transformation for RDP Consulting


    Understanding the core cybersecurity concepts is key to becoming a master. A master
    is not just defined by their experience in relation to a given technology, but
    also by their deep understanding of the topics and the proper use of the technological
    jargon and concepts.


    As a cybersecurity expert, you may be engaged by the media who want to know more
    about the latest attack, or called by the government to be part of a team of advisors
    in cybersecurity. In both cases, you will have to be prepared to speak up and
    provide your expert opinion, and this chapter will prepare you to be so well-grounded
    in cybersecurity concepts that you are able to speak as a master!'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# A Refresher on Defensive Security Concepts


    As part of this journey, we''re going to cover the following main topics:


    +   - A deep dive into the core of cybersecurity

    - Managing cybersecurity''s legendary pain point: *Passwords*

    - How to master defense-in-depth

    - A comprehensive explanation of the Blue and Red teams


    # Technical requirements


    There are no technical requirements for this chapter, but you may need a cup of
    Java (to prepare your brain for the tons of knowledge that you are about to receive).


    Now, let''s get ready for our learning adventure.


    # Deep dive into the core of cybersecurity


    A master possesses a higher knowledge and understanding of their domain. In this
    case, you should understand all the concepts, terminology, and attacks to confidently
    speak as a cybersecurity expert. It is not about repeating what you are; it is
    about acquiring a level of understanding in which you can explain all these topics
    to the point that everyone will understand them (even if they are not familiar
    with IT concepts).


    # The cybersecurity triad


    A CISO once told me: If you want to see whether the person talking about an attack
    really knows their business, just ask: What element of the CIA trial is being
    impacted by their attack? If no response is forthcoming, then person is a newbie.
    If the answer is not clear or lacking in arguments, that person is a junior, but
    if the response clearly outlines elements of the triad will be affected by the
    attack and why, then you are talking with an expert.


    This triad is especially important when working on defense security because it
    will help you to prioritize the risks based on the impact and how impact correlates
    with the business.


    This is especially important for organizations as this helps them identify priority
    areas to invest in (and provide more resources) to reduce the impact or damage
    to the company in the event of a cyber attack. For example, an attack on the availability
    of the informational web page of an HR company may result in a minimal impact
    on the business, while an attack on the confidential information that they manage
    could be catastrophic.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/8c6a223c57e25ea0cc1593903a1b920f_27_0.png)


    Figure 1.1 shows the three components of the CIA triad: Confidentiality, Integrity,
    and Availability. Now, let''s take an in-depth look at each of these concepts.


    # Confidentiality


    The attacks affecting confidentiality are based on access by an unauthorized person
    to the company''s data. But how do you know who can access which kinds of data?
    The best way to respond to this question is by following the best practice that
    says all companies must have their data classified and labeled based on its sensitivity.
    That way, you can effectively determine how to put in place the appropriate controls.
    The data can be classified as follows:


    +   - **Restricted**: This is the most important data the company possesses as
    it may include trade secrets that, if disclosed, could have a catastrophic impact
    on the company.


    +   - **Confidential**: This is data that companies must keep confidential (on
    a need-to-know basis). Many times, this type of data is associated with some external
    regulations, and sanctions and fines may apply if disclosed.


    +   - **Private**: This is less sensitive data. However, it is not intended for
    public consumption and should be maintained within the organization.


    +   - **Public**: This is data that is intended for public distribution (most
    of the time, it is available and indexed online).


    # Integrity


    Besides keeping the data confidential, we also need to ensure that the data is
    not altered by a malicious actor. In fact, we need to ensure that appropriate
    mechanisms are in place to ensure that the data will only be changed by authorized
    parties.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'This is especially relevant if your company runs a transactional website (such
    as an e-commerce website) because an attacker may attack your database and create
    or modify discount codes, and by the time you discover the issue, your merchandise
    may already be sold and delivered for a fraction of the original price.


    What makes these attacks more dangerous is that the attacker will not just apply
    this discount to their purchase but everyone. Therefore, you may find 1,000 orders
    discounted by 99%, making it harder for you to identify who performed the attack.


    The most famous hacks to banks were caused because the integrity of the data was
    compromised.


    Therefore, due to the impact of these kinds of attacks, companies must proactively
    and constantly invest time and resources to prevent them.


    # Availability


    These attacks aim to disrupt the availability of a given system, network, or web
    resource. Except for online stores, these are the less dangerous type of attack;
    however, such attacks are also the most common type of attack. In fact, the majority
    of the attacks performed by Hacktivist groups aim to disrupt system availability.


    # Types of attacks


    To implement a good defensive strategy, you must understand the current threat
    landscape and the most common types of attacks—you cannot be protected against
    the unknown. Some sources separate the attacks by type based on the area of impact;
    for example, network attacks and physical attacks. However, such a high-level
    categorization is too simple for a master like you, instead, I am going to provide
    you with an extensive and up-to-date list of the most common types of attacks
    that you may encounter today, as seen in Figure 1.2:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Threat Landscape


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_29_0.png)


    Figure 1.2 – Cybersecurity threat landscape


    Now, let''s explore each of these categories of attack so as to have a better
    understanding of the current threat landscape.


    # Malware


    Everyone is familiar with this type of attack. In fact, almost everyone will be
    affected by this type at least once in their life. However, while most of them
    can be prevented with good and up-to-date antivirus software, it is worthwhile
    keeping an eye on new threats to ensure that our protection mechanisms are capable
    of dealing with new threats.


    To enhance the efficacy of these types of attacks, normally they are used in conjunction
    with other tactics to spread it, for example, by using social engineering.


    > **Important note**nThere are several types of malware, including RAT, Trojans,
    Worms, Ransomware, Spyware, and more. Each of them is different and you must understand
    their unique characteristics to be able to appropriately defend against them.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# A Refresher on Defensive Security Concepts


    As a fun fact, I recall when I discovered that the reason for me having to re-install
    the OS of my mom''s computer every week was due to my brother believing in his
    good luck when surfing the internet:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_30_0.png)


    Figure 1.3 – Samples of “You Won” malware


    Now, let''s look at the biggest threat to the security of any corporation, infiltration
    through social engineering:


    # Social engineering


    As technology enthusiasts, we often focus on securing our systems and networks.
    In fact, we may invest a lot of time, effort, and resources in building a robust
    cybersecurity environment, but that will not be complete until you include the
    weakest actor, the user.


    I have seen many cases when a company suffers a catastrophic attack, not because
    their expensive systems were breached, but because they were attacked by a sophisticated
    zero-day vulnerability, but because an employee inadvertently provided their credentials
    to an attacker.'
  merge: -1
