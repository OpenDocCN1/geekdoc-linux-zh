- pgno: 76
  md: '# A false sense of security


    I am shocked at how companies have not realized the danger of USB HID vulnerabilities.
    In fact, most companies have the USB ports of their employees who give face to
    face services to external customers completely exposed! Even more crazy is that
    I witnessed many banks having the computers of customer service agents on a desktop,
    which completely exposes the USB port to the public:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_76_0.png)


    Therefore, I decided to talk with the CTO of the bank to understand the reasoning
    (if any) for exposing the USB ports of the computers of client-facing employees
    by having them over the desktop. His response was astonishing: "Having the computer
    over the desktop helps in maintenance because the computers get less dust." At
    first, I thought that his response was a joke, but after few seconds of uncomfortable
    silence, I realized that it was not.


    My next question was to ask whether he was aware of the risk that it represents,
    and his reply was: "Do not worry about the USB, they are disabled, so there is
    no risk if someone connects a USB drive." Then, I realized that his vulnerability
    assessment was based on USB mass storage attacks but not against USB keystroke
    attacks.


    Knowing that there was a good chance that those computers were vulnerable to USB
    HID attacks, I asked for permission to connect my USB drive, and he agreed with
    a smile on his face (although he knew that I was wasting my time). At that point,
    I always carry a USB Rubber Ducky with a simple script that does two simple tasks:


    +   1. Change the background to an image that looks like it was infected by a
    virus.

    2. Kill explorer.exe to make it look as though all of the infected files have
    gone.'
  merge: -1
