- pgno: 197
  md: '# #6

    Securing Windows Infrastructures


    > "As an inventor and rearcher, I realize that the degree of vulnerability of
    an organization depends on how the infrastructure was implemented, managed, and
    designed,"


    – Sarbajit Rakshit, IBM Master Inventor


    Almost all companies have Windows systems in their infrastructure, either as workstations,
    servers, or directory services. Therefore, to master the art of cybersecurity,
    you need to know which strategies, techniques, and tools to apply, but also how
    and when to apply them to achieve the desired level of security in your infrastructure.


    To achieve those goals, we are going to cover the following main topics:


    +   - How to apply the best hardening strategies on Windows servers

    - Creation of your own hardening checklist for Windows servers

    - Designing a world-class patching strategy

    - An overview of all the different types of patches for Windows systems'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - Best cybersecurity practices for Active Directory (AD)

    - A guide to best practices for endpoint security

    - An overview of how to leverage encryption to keep your data secure


    #  Technical requirements


    There are no hard requirements for this chapter; however, it would be useful to
    have access to a Windows 10 machine to test some of the concepts that we will
    cover through the book (patching, encryption, policies, and so on).


    # Applying Windows hardening


    > Nothing is impossible to break; just make it hard enough to make them want another
    target.


    As you know, hardening is a fancy name for all the techniques used to protect
    a given server from attacks. While hardening is not a bullet-proof solution, its
    aim is to increase the security of a server to an acceptable level to prevent
    the majority of attacks.


    In general, a properly hardened server should be protected against all scripted
    or automated attacks.


    There are normally two ways to apply hardening, as outlined here:


    +   - Applied by a separate team (information technology (IT) infrastructure

    - Another applied by the security team (you)


    Let''s take a look at your responsibilities when hardening is performed by the
    infrastructure team.


    # Hardening by the infrastructure team


    In this case, the hardening is performed (executed) by another team; however,
    you may still be accountable for ensuring that the server is secure, in that case,
    you need to at least perform the following actions:


    +   - Provide the team with a checklist of the minimal hardening required.

    - Perform regular audits to ensure the servers have the minimal hardening requirements.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Let''s look at how to create a comprehensive hardening checklist that you can

    provide to the infrastructure team to ensure that at least the minimum required
    steps are

    performed.


    # Creating a hardening checklist


    A hardening checklist will be influenced by several factors, including corporate
    risk

    appetite, cybersecurity policies, and applicable regulations. Here, we are going
    to review

    t most common items that must be included to create the ultimate Windows hardening

    checklist.


    Regardless of who is responsible for performing Windows hardening, this checklist
    will

    contain the basic items that need to be performed to ensure that your Windows
    servers

    have the basic protections in place.


    Let''s take a look at the required elements of your hardening checklist.


    # Supported OS versions


    This is a very important factor to take into consideration while newer versions
    have

    lot of security features, as the introduction of Windows Defender Advanced Threat

    Protection (ATP) on Windows 2019, older versions have lower levels of security
    and

    ou should therefore try to encourage the use of newer versions on builds.


    Here are some of the rules that should be included in this section of the checklist:


    +   * Never allow unsupported versions of Windows servers in your infrastructure.

    * Keep an inventory of the server infrastructure, which should include end-of-support
    dates.

    * Create a plan to start the migration of future end-of-support servers at at
    least a year

    before the effective end-of-support date.

    * Create a policy to enforce that all servers must include all updates, patches,
    and

    service packs before being set in production.


    In case you cannot upgrade the servers due to a lack of budget, the recommendation
    is

    to create a risk letter that includes all the cybersecurity risks associated with
    having that

    old server in your infrastructure (with the associated costs) and present to upper

    management. That way, they will give you the budget for the new servers or accept

    risk, and in that case, you will have your back covered.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Windows services and features


    Windows servers have a set of default services that start automatically at startup.
    While many of those services are required by the OS to function properly, some
    of them are optional and may represent a potential vulnerability.


    While newer versions load just the minimal required services, old OS server versions
    may need additional tuning to disable non-essential services.


    Here are some items to include in the checklist regarding this topic:


    +   * Ask each server owner to create a list of the enabled services, including
    a justification for each particular service.

    * Ask the server owners to perform at least a quarterly validation of the services
    to ensure that unused services are disabled.

    * Ask the server owners to create a risk justification letter in case any of the
    services running are listed as high risk in the corporate cybersecurity policies.


    An example justification list is shown in the following screenshot:


    | Service | Server | Required | Justification | Owner |

    |---|---|---|---|---|

    | RDP | Prod-16-001 | YES | Nice and clear justification goes here | Bravo@example.com
    |


    Figure 6.1 – Services justification list


    Additionally, take into consideration that Windows services run in the security
    context of a specific user (local system, local service, or network service accounts).
    However, for application and user services, the recommendation is to set up specific
    accounts, (locally or in AD) to handle these services with the minimum rights.


    # Ports and protocols


    Similar to services, ports and protocols should be maintained at a minimum to
    reduce potential attack vectors.


    Checklist items include the following:


    +   * Ask each server owner to create a list of open ports (including a justification).

    * Ask the server owners to perform at least a quarterly validation of the opened
    ports to ensure that all open ports are in use.

    * Ask the server owners to create a risk justification letter in case any of the
    open ports are listed as high risk in the corporate cybersecurity policies.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'A common technique used by criminals is to scan ports; therefore, following
    those simple steps will considerably enhance the security of your servers.


    # User management


    Also known as Identity and Access Management (IAM), this is normally handled by
    a separate team that follows IAM processes to create, delete, and disable user
    identifiers (IDs).


    Here are the relevant points for our checklist:


    +   * All user management should be created by the IAM team.

    * All local users must be created by the IAM team.

    * All server owners must follow the IAM process (create, delete, disable, and
    update user accounts).

    * All accounts must have an associated person as the owner.

    * Accounts should be created based on the principle of least privilege (PoLP).

    * Password policies must be enforced by the system (server or Active Directory).

