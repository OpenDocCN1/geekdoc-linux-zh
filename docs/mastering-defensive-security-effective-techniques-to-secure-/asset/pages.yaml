    Then, as seen in the following figure, you will get a response with the full path
    of the script. Just copy and paste that path and you will be able to run the exploit!


    ```

    kali@kali:~$ searchsploit -p 34087

    Exploit: Joomla! Component Youtube Gallery 4.1.7 - SQL Injection

    URL: https://www.exploit-db.com/exploits/34087

