- pgno: 187
  md: 'This tool was supposed to be installed by default on Kali Linux. However, if
    you cannot find it, just use the following command to install it:


    ```

    sudo apt-get install foremost

    ```


    If you have Windows, you can use the Recuva. This tool (which has a basic version)
    works great when it comes to recovering recently deleted files.


    The reason for this is when you delete a document in Windows, you are just deleting
    its pointer, but the data is still on the hard drive. So, what type of software
    does search for files on the hard drive and then recreate the Windows index table
    to make the file reappear on the operating system. However, to make computers
    faster, the data is written in the first available spot of the hard drive. So,
    the more you use the computer, the higher risk that the data you want to recover
    gets overwritten by another file.


    Now, let''s learn about probably the most complex attack vector: APTs.


    # Dealing with APTs


    The tactics covered in this book aim to defend your infrastructure against the
    common types of attacks and threat vectors. However, there is one type of threat
    that we have not covered yet - a type of attack that, due to the complexity involved,
    is believed to be backed by the government and various organizations. This attack
    is called APTs.


    In this type of attack, the attackers use a variety of tactics, techniques, and
    resources to gain sustained access over an extended period of time to disrupt
    or spy on a given set of systems to achieve a given goal, such as the following
    examples:


    +   * Steal intellectual property or trade secrets.

    * Obtain a continuous flow of sensitive information.

    * Sabotage a given infrastructure, system, or process.

    * Reroute funds.


    As mentioned previously, these are very organized attacks, normally performed
    by a coordinated group in which the main goal is not to gain access, but to remain
    undetected, which means that some actions will be slowly performed over time to
    avoid some triggers that will review their presence.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Cybersecurity Technologies and Tools


    To achieve this, the attackers normally follow five phases:


    +   **Discovery**: Here, the attackers will gather as much information as possible
    from the victim and employees, providers, partners, and so on.


    This phase normally includes a combination of technical research activities (performed
    with recognition tools) and physical research activities such as dumping info,
    physical location recognition, social engineering, and so on.


    +   **Infiltration**: This stage is about gaining access to the systems and infrastructure.
    As we mentioned previously, in this type of attacks, the attacker will use customized
    attacks to prevent detection (script kiddies are not allowed here). The use of
    zero-day exploits is very common


    +   **Expansion**: Here, the attacker is trying to gain access to additional systems
    (lateral movement) or escalate privileges over the current systems.


    At this point, the attacker will leave some backdoors to ensure future access
    in case they get caught.


    +   **Extraction**: Once the attacker has navigated through the infrastructure
    and the target information has been identified, the next step is to start extracting
    data.


    Here, the attacker will use advanced methods (such as DNS tunneling) to exfiltrate
    the desired information.


    +   **Diversion**: We have seen cases in where very complex and coordinated attacks
    use another attacker vector (such as a DDOS) to mask the real attacks and deviate
    resources to do that while leaving the real attack undetected.


    ```

    Script Kiddies

    This is the name given to attackers with limited knowledge about cybersecurity
    and whose only skill is to run scripts (even without understanding what the script
    is doing, and sometimes leaving their devices infected).

    ```


    Now, let''s learn how to defend our infrastructure against these types of threats.


    # Defensive techniques


    Being able to apply all the defensive techniques that we have been learning about
    will reduce the possibility of an ATP attack. However, let''s take a look at some
    specific techniques that you can apply to prevent ATPs:


    +   Monitor traffic (in and out) to detect leads of infiltration or exfiltration.


    +   Increase the application of multi-factor authentication.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Leveraging security threat intelligence 167


    +   * Analyze logs to detect patterns of compromise.

    * Keep a good identity and access management strategy and ensure that unused or
    disabled users are deleted.

    * Set monitors to detect tampering attempts (in this type of attack, logs can
    be deleted to prevent tracking).

    * Use Honeypots to detect and confuse attackers (we will show you how to create
    your own Honeypot on Chapter 10, Applying IoT Security).


    The good news is that we also have advanced systems and tools that can be used
    against criminals, and one of them is threat intelligence. We will look at this
    next.


    # Leveraging security threat intelligence


    A simple Google search will tell you that there are too many different definitions
    of threat intelligence, so to make things easy, let''s define it as gathering,
    analyzing, and understanding threats, threat actors, and the associated behaviors
    of the attacks.


    Simply put, threat intelligence is about creating knowledge (intelligence) based
    on correlated data.


    Several solutions are available, most of which are offered as a service, in which
    a third-party vendor provides you with access to knowledge for a monthly fee.


    Now, let''s move to the next section to understand what threat intelligence is.


    # Threat intelligence 101


    Attackers are known for sharing data about their attacks with others, spreading
    the data of becoming a victim.


    With threat intelligence, we can achieve even better results because it is about
    sharing data related to attacks and performing a smart analysis of data. This
    helps create knowledge that can be used by others to defend against those kinds
    of attacks.


    Companies are now leveraging cognitive technologies to analyze data and create
    insights. However, those cognitive systems are as good as the training they have
    received, the research capabilities and the expertise of the company in the field
    should be two of the most important factors you consider.


    Regarding data feeds, which also vary between vendors, some use private datasets,
    while others promote sharing data with open communities to create a bigger pool
    of data to improve how their systems are ingested.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The following diagram shows an example of some of the data inputs that are
    used by threat intelligence systems:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_190_0.png)


    Figure 5.13 – Threat intelligence inputs


    # # Implementing threat intelligence


    Threat intelligence outputs are normally used as input to improve several cybersecurity
    systems and processes. Some examples are as follows:


    +   - **Improving cybersecurity systems:** Some tools, such as IPS, IDS, and firewalls,
    have the option to ingest threat intelligence data to improve how threats are
    detected.

    - **Incident response:** Threat intelligence is a great tool for incident response
    teams as it allows them to reduce false positives, enhance their skills, improve
    their analysis process, and reduce response times.

    - **Security Operations Centers (SOCs):** By bringing this new knowledge to the
    team, a SOC can greatly improve all the necessary metrics by leveraging and applying
    all the knowledge gathered from the threat intelligence.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Converting a threat into a solution 169


    One of the biggest advantages of this approach is that it helps the SOC stay relevant
    and up to date with the latest threats and available remediations.


    +   * Risk analysis: Your team can leverage threat intelligence data to perform
    a better risk analysis, not just to help them identify new risks, but also to
    adjust and update the probability and impact of already identified risks.


    Also, you can leverage this information to create new risks and mitigation strategies.


    Now, before we close this chapter, let''s look at an example of how to leverage
    your expertise and knowledge to analyze some security vulnerabilities and transform
    them into solutions. At the end of the day, mastering is not just about repeating
    what is in a book but using that knowledge to create new stuff.


    # Converting a threat into a solution


    As you have seen throughout this book, there are a lot of hacking tools that an
    attacker can use against your infrastructure. However, as in defensive security,
    you need to leverage those threats and use them for your benefit – use your opponent''s
    weapon against them.


    Let''s look at an example. Remember the USB HID vulnerabilities that we reviewed
    in Chapter 2, Managing Threats, Vulnerabilities, and Risks? Well, let me show
    how those vulnerabilities were leveraged to create a solution that solves another
    cybersecurity issue: passwords!


    To start, let''s begin looking at the well-known problem of passwords.


    # The problem


    Currently, you can use password managers to inject your passwords into applications
    inside your operating system, but you cannot use it to inject passwords to log
    into a computer. So, to log into the operating system, you will have to open the
    password manager application, read the password, and manually type it in, which
    is a user experience but also carries the risk of shouldering. There is one solution
    that allows you to inject a password, but that solution needs you to install an
    application on your operating system, so this is not a true plug-and-play solution.
    Also, sysadmins need to log into a variety of servers, so they need a solution
    that is true plug and play but also works with all operating systems so that the
    solution can be used across the infrastructure.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# The solution


    Here, we can leverage the capabilities of the USB HID drivers (the same ones the
    criminals used for USB attacks) to create a unique plug-and-play solution that
    enables sysadmins to log onto any server, regardless of the operating system,
    without the need of any prior installation, making it a high-value and easy-to-implement
    solution.


    Now, sysadmins can securely use crazy-secure passwords (up to 250 characters)
    with no effort because they will be transmitted to the server with the press of
    a button.


    If you want to read more about this patent, please visit the following link: https://patents.google.com/patent/US10762188B2


    I hope this motivates you to look at vulnerabilities once more but with a different
    mindset. Start thinking about not how to prevent them, but also how you can leverage
    them as an innovative defensive solution.


    # Summary


    In this chapter, you learned how to leverage one of the best hacking devices (the
    WIFI Pineapple) in your defense security strategy, as well as how to protect against
    the latest attacks performed with that device.


    Additionally, you learned about pentesting and forensics and some of the best
    tools in those fields so that you can leverage them.


    Then, you learned about possibly the most dangerous threat in cybersecurity, the
    infamous APT, and more importantly, how to protect your infrastructure against
    them.


    Now, it is time to move on to the next chapter, where you will become a master
    of securing Windows infrastructures (Windows servers, patching, Active Directory,
    endpoint security, and more).


    There, you will be exposed to the best hardening strategies for Windows servers,
    including creating your own hardening checklist!'
