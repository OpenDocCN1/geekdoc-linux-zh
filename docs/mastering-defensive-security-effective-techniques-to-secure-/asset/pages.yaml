    When dealing with digital evidence, data integrity is key to demonstrating that
    the evidence has not been altered in any way.


    The best way to do this is using hashes even when the minimal change will make
    the hash change. However, if the hash remains the same, then you will be 100%
    certain that the file hasn''t been altered.


