- pgno: 313
  md: '# The vulnerabilities


    Most of the competition in the IoT market revolves around cost. Therefore, companies
    need to reduce it and, sometimes, this means a lack of security testing, or even
    of basic security settings on the devices.


    Therefore, there are hundreds (maybe thousands) of IoT devices that are already
    connected to the internet, with the owners not being aware of the vulnerabilities
    they have.


    Now, let''s look at the top 10 vulnerabilities found on IoT devices:


    | Weak or predictable hardcoded (admin) password |

    | Vulnerable Network services enabled |

    | Insecure Interfaces (API, Backends, etc.) |

    | Lack of security updates |

    | Use of Insecure or outdated components |

    | lack of privacy protection mechanisms |

    | Unencrypted data storage and transmission |

    | Poor device management settings |

    | Insecure Default Settings |

    | Lack of Phiscal hardening |


    Figure 10.3 – Top 10 IoT vulnerabilities


    Now, let''s look at the most common network protocols used for IoT devices and
    their associated advantages, risks, and vulnerabilities.


    # Understanding IoT networking technologies


    While some IoT implementations use Wi-Fi, the truth is that Wi-Fi has several
    limitations, especially in terms of energy consumption and network coverage (range).
    Therefore, a new set of technologies has been developed to overcome that limitation
    and increase the reach up to 10 kilometers.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Now, let''s take a look at some of those IoT network technologies and the vulnerabilities
    associated with them.


    # LoRaWAN


    LoRaWAN, also known as LoRa, is an open standard for the implementation of low-power
    wide area networks (LPWANs).


    One of the main advantages of this technology is the ability to transfer data
    over long distances (more than 10 kilometers) with very low power consumption.
    This makes LoRa a great alternative for connecting IoT devices and sensors. Additionally,
    as seen in the following figure, LoRa devices are really small. This is great
    for prototyping (and even to integrate into production systems):


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_314_0.png)


    Figure 10.4 – LoRa sender and receiver


    So, long-range coverage and small devices (with low power consumption) sound like
    the perfect solution to implement IoT networks, but there are also a plurality
    of vulnerabilities that you need to take into consideration if you plan to have
    these types of networks in your infrastructure.


    # LoRaWAN security vulnerabilities


    By design, LoRa is very secure. In fact, authentication and encryption are mandatory.
    However, devices and networks can still be compromised if the implementation is
    not performed properly.


    Therefore, it is very important to look for LoRaWAN CertifiedCM devices to ensure
    the device has been tested against the standard and works as expected.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Understanding IoT networking technologies 293


    The following is a list of some vulnerabilities reported for these devices:


    +   * Some devices may come with hard-coded encryption keys.

    * Some devices may use easy-to-guess encryption keys, such as AppKey = device
    identifier + app identifier, or AppKey = app identifier + device identifier.

    * Vulnerable to denial-of-service attacks.

    * Vulnerable to ACK spoofing attacks.

    * Vulnerable to replay attacks.

    * Additionally, there are two CVE vulnerabilities associated with LoRa: https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-4060
    and https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-28349.


    Remember that new CVEs are uploaded daily, so always check them before any implementation.


    # Zigbee


    Zigbee is a standard for personal area networks (PANs) developed by the Zigbee
    Alliance, targeted to provide a low-cost, low-power, wireless communications solution
    for short-range applications (such as communication between sensors).


    > Important note

    Why is IoT communications protocol security important? In 2017, a group of researchers
    were able to compromise a network and inject malware by leveraging a vulnerability
    on a Zigbee implementation of a smart bulb.


    # Zigbee security vulnerabilities


    The most common vulnerabilities on Zigbee networks are the following:


    +   * They are susceptible to availability attacks through signal jamming (this
    can be easily achieved due to the band used).

    * The security is based on the secrecy of this key exchange; therefore, they are
    susceptible to attacks that sniff the network during the repairing of the keys.'
  merge: -1
