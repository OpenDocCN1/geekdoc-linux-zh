- pgno: 249
  md: 'Now, let''s explore the meaning of each of the columns shown in the preceding
    figure:


    +   - target: Defines the actions (or policies) to be performed (ACCEPT, DROP,
    REJECT).

    - prot: Determines which protocol this will be applied.

    - source: Address of the source of the packet.

    - destination: Address of the destination of the packet.


    As you saw in Figure 7.24, the default policy for all chains (INPUT, FORWARD,
    and OUTPUT) is ACCEPT. Now, let''s explore how you can change it.


    # Changing the default policy


    You can easily change the default policy for all chains (INPUT, FORWARD, and OUTPUT)
    to apply more restrictive policies to a specific chain by using the following
    command:


    ```

    sudo iptables -P FORWARD DROP

    ```


    The following figure shows the result of the command, and now you can see how
    the default permissions for the FORWARD chain is:


    | kalali:$ sudo iptables -P FORWARD DROP

    |kali:$ sudo iptables -L

    Chain INPUT (policy ACCEPT)

    target destination opt source |

    Chain FORWARD (policy DROP)

    target destination opt source |

    Chain OUTPUT (policy ACCEPT)

    target destination opt source |


    Figure 7.25 – Default iptables


    Now it''s time to see how to block incoming traffic with iptables.


    # Blocking incoming traffic with iptables


    Imagine that you identify an IP address that is known for sending DDOS attacks
    (14.14.14.14).


    We can easily block all incoming traffic from that IP address with the following
    command:


    ```

    sudo iptables -A INPUT -s 14.14.14.14 -j DROP

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Hardening a Unix Server


    Now, let''s explore the parameters of the command:


    +   - -A: This is used to append the rule at the end of the chain (you can use
    - I to append the rule to the top of the chain).

    - -s: Specifies the source of the packet (in this case, the IP address of the
    attacker).

    - -j: Specifies the action or policy to be applied to the packet.


    ```

    kalikali:$ sudo iptables -A INPUT -s 192.168.1.9 -j DROP

    kalikali:$ sudo iptables -L

    Chain INPUT (policy ACCEPT)

    target     opt source               destination

    DROP       all            192.168.1.9

    Chain FORWARD (policy DROP)

    target     prot opt source         destination

    Chain OUTPUT (policy ACCEPT)

    target     prot opt source         destination

    ```


    Figure 7.26 - Blocking incoming traffic with iptables


    The preceding figure shows the newly created rule on iptables.


    # Whitelisting an IP with iptables


    We can also use iptables to whitelist or accept traffic from a given source by
    using the following command:


    ```

    sudo iptables -I INPUT -s 192.168.1.14 -j ACCEPT

    ```


    The following figure shows the results of the preceding command and how the I
    parameter placed the rule on top of chain:


    ```

    kalikali:$ sudo iptables -I INPUT -s 192.168.1.14 -j ACCEPT

    kalikali:$ sudo iptables -L

    Chain INPUT (policy ACCEPT)

    target     prot opt source               destination

    ACCEPT     all            192.168.1.14    anywhere

    DROP       all            192.168.1.9

    Chain FORWARD (policy DROP)

    target     prot opt source         destination

    Chain OUTPUT (policy ACCEPT)

    target     prot opt source         destination

    ```


    Figure 7.27 - Whitelisting an address with iptables'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Removing all policies from iptables


    Now, let''s see how to remove policies from iptables.


    There are many situations in which you may need to remove all policies from iptables,
    for example, if you inherited a new server and the current rules are confusing
    and you want to use your own super-secure rules. Or, maybe you just want to clear
    all the mess you made to write a book. The good news is that achieving that is
    very easy with the following command:


    ```

    sudo iptables -F

    ```


    Now, as seen in the following figure, the iptables were flushed and look like
    new:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_251_0.png)


    Figure 7.28 – Flushing the iptable rules


    Flushing iptables is also a common troubleshooting step when facing network issues.
    However, you must set the required controls to avoid this being performed indiscriminately.
    Additionally, any change to iptables should be logged and approved by a security
    analyst to ensure that another security mechanism is set in its place.


    > Did you notice something in Figure 7.28?

    I am sure you did – this command just removed the policies that you created, but
    it did not change the default chain for FORWARD that we established earlier (we
    changed it from ACCEPT to DROP). So, make sure you pay attention to this when
    flushing the iptables.


    Now, let''s see how you can also use iptables to protect against some threats.'
  merge: -1
