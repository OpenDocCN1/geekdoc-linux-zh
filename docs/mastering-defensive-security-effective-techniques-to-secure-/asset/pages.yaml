  md: '# Enhancing Your Network Defensive Skills


    Now Wireshark will present us a window like in Figure 8.24, showing all the communication
    between the client and the server. We can effectively see the password in cleartext.


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_286_0.png)


