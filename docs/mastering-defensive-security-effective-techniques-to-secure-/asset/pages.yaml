- pgno: 82
  md: '# Protecting against vulnerable USB dongles


    This is a very serious threat. So, first, make sure that you don''t have vulnerable
    USB dongles on your personal devices (or even on your family and friends'' devices).


    On the other hand, on a corporate level, you can take the following steps:


    +   - Create a list of the vulnerable devices (that is, just search for a vulnerable
    dongle to get the latest list).

    - Some vendors release a patch to fix the vulnerability. However, it will be very
    hard for you to ensure that all of the connected dongles are patched, so you should
    consider that when creating your policies.

    - Make sure your company does not purchase vulnerable devices.

    - Check whether there are vulnerable devices in your company assets and replace
    them.

    - Additionally, create (and distribute) a policy to restrict employees from using
    vulnerable devices on corporate assets (including the list of vulnerable devices
    and models).


    By now, you should clearly understand the concept of cybersecurity vulnerabilities.
    However, identifying the vulnerabilities is just the first step in the game. Now,
    it''s time to go ahead and understand how to manage, evaluate, respond, and monitor
    those vulnerabilities to improve the security of our infrastructure.


    # Managing cybersecurity risks


    Risk management is a very interesting topic, and there are hundreds of books and
    certifications about this topic. However, instead of giving you a lot of overwhelming
    information, I will try to summarize all the available knowledge regarding risk
    management, tropicalize it to the cybersecurity environment, and present you with
    just the right information in order to manage your risks like a pro!


    To make this simple, let''s define a risk as an event that will have an impact
    on your systems or infrastructure if a given condition is met. These events are
    normally triggered by a threat (or a threat agent) that leverages a given vulnerability.


    Now, the process of identifying and analyzing the impact and the probability of
    that event happening is called risk management.


    All systems and infrastructures have a plurality of associated risks, so it is
    crucial that you identify and mitigate them as early as possible.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Managing cybersecurity risks 61


    There are many methodologies and frameworks to manage risks, and while most of
    them are very similar, the name of the concepts differ slightly; however I will
    focus on the most recognized approaches to make this easier for you.


    Now, let''s view the details of each of the four steps (**risk identification,
    risk assessment, risk response,** and **risk monitoring**) to manage your cybersecurity
    risks like a *master*.


    # Risk identification


    First, you need to *identify* the risks associated with your infrastructure or
    systems. Now, let me share some tips that will help you here:


    +   **Make a detailed and extensive inventory of your assets:** Most of the time,
    risks are not discovered because *ghosts* or legacy systems have not been identified,
    so it is key that you start by doing a thorough discovery of your assets to make
    sure that all your infrastructure and systems are covered.


    +   **The ongoing discovery of new assets:** Remember that this is an ongoing
    task that you need to regularly scan your environment and network to uncover any
    new devices that have been added to your infrastructure.


    +   **Asset evaluation:** A good practice is to evaluate your assets to determine
    which are critical for your organization (that is, your crown jewels) so that
    you can justify a higher investment to defend them. This will also help you in
    terms of prioritization and risk analysis.


    > Tip Don''t do this alone; ask for help and support! It will be hard for you
    to come up with a complete list of risks from your desk, so instead, take advantage
    of the experience of the system administrators, IT personnel, and end users to
    you discover potential risks.


    During this identification process, you will have to create a **risk register**,
    which is a database of all of the identified risks. There are hundreds of templates
    that you can use, and all of them vary in terms of their size and the number of
    columns used. However, you can create your own risk register using Excel. Just
    make sure you include the minimal factors, as follows:


    +   **Risk_ID:** The unique identifier of the risk.


    +   **Description:** A clear and concise description of the risk.


    +   **Risk_Owner:** The person who is in charge of monitoring the risk.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Managing Threats, Vulnerabilities, and Risks


    +   * **Risk_Trigger**: The event(s) that will convert the risk into an issue.

    * **Risk_Category**: To help you manage all risks, it is recommended that you
    create groups of risks; for example, physical access, network, software, web apps,
    and more.

    * **Probability (Qualitative)**: Here, you can use 3 or 5 ratings (such as insignificant,
    low, medium, high, and critical).

    * **Impact (Qualitative)**: Rate the impact to the business if the risk is materialized.

    * **Response**: Describe the kind of response you implemented to reduce the probability
    and/or impact of the risk (such as mitigate, transfer, and so on):


    | Risk ID | Description | Risk Owner | Risk Category | Probability (Qualitative)
    | Impact (Qualitative) | Risk Response |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | Unauthorized access to the data center due to lack of biometric controls.
    | Mikela Moter (IT) | A person with access to the main building can use tailgate
    to get access to the data center | Physical Access | Low | High | A camera placed
    to monitor the entrance to the data center using CCV |


    Figure 2.13 – An example of a risk register


    There are many other fields that you can include, such as *Risk_Source*, in which
    you can specify whether the risk is coming from an internal or external threat
    (either man-made or environmental).


    Now you have the risks identified, you need to assess them.


    # Risk assessment


    As the name suggests, this step is about assessing the risk in terms of *probability*
    of occurrence and business *impact*.


    There are two ways in which to do this type of assessment: qualitative and quantitative.


    # Quantitative analysis


    Let’s pause for a second to let me ask you a question:


    If you have an asset that costs $500,000, would you invest $75,000 to protect
    that asset?


    That is a tricky question, regardless of whether your answer is yes or no, what
    really matters is here that you support your answer with *numbers* as this will
    tell you whether you will be getting that budget or not.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Managing cybersecurity risks 63


    The good news is that there are several tools and methodologies that you can use
    to give you those numbers. However, even better than this is knowing that you
    can use three simple formulas to gather those numbers.


    First, you need to determine the value of the asset that will be affected if the
    risk materializes. Second, you also need to determine how much of the asset will
    be impacted. For example, let''s imagine that, in the case of an earthquake, 25%
    of your company''s data center is affected, so if the value of the data center
    is $100,000, the damage caused by an earthquake would be $25,000. This can be
    expressed with the following formula:


    Single Loss Expectancy (SLE) = Asset Value * Exposure Factor


    However, if you are trying to determine how you should invest by year in response
    to that risk, then you will need to perform two calculations:


    +   1. Determine how likely it is that risk to materialize every 12 months, where
    1 means once per year, and once every 5 years is equal to 1/5 (0.2). The resulting
    value is known as the annualized rate of occurrence (ARO).

    2. Now that you know the cost of the risk and the probability of the risk occurring
    every 12 months, you can multiply these two values to determine the average cost
    of the risk by year: Annual Loss Expectancy (ALE) = SLE * ARO.


    > Important note

    Remember my tricky question from earlier? Well, now you can use the preceding
    formulas to determine in which scenarios it will make sense to invest $75,000
    on the remediations or controls (for instance, you don''t want to apply a risk
    response that is more expensive than the cost of the materialization of the risk).


    Now, let''s examine how you can categorize the risk not with numbers but with
    words, which is an easier and faster analysis.


    # Qualitative analysis


    This is a more subjective analysis, as it is based on the opinion of an expert
    (or group of experts) who provide a rating based on a scale. Normally, those scales
    are on 3 or 5 levels, but some companies use customized values.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 64 Managing Threats, Vulnerabilities, and Risks


    The most common way to do this analysis is by using a 5 x 5 matrix to correlate
    the probability and impact to get the average criticality of the risk. As you
    can see, in the following table, a risk with a low probability but a high impact
    will be considered a moderate risk, while a risk with a high probability and a
    moderate impact will be considered a major risk:


    | Probability | Minimal | Low | Moderate | High | Catastrophic |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Very High | Moderate | Major | Major | Severe | Severe |

    | High | Moderate | Moderate | Major | Major | Severe |

    | Medium | Minor | Moderate | Moderate | Major | Major |

    | Low | Minor | Minor | Moderate | Moderate | Major |

    | Unlikely | Minor | Minor | Minor | Moderate | Moderate |


    Figure 2.14 - A 5 x 5 matrix


    The value of the correlation (Minor, Moderate, Major, or Severe) is the one that
    will be used to rank the risk.


    As mentioned earlier, this is a subjective assessment. So a good practice would
    be to analyze groups in order to gather their inputs, as might help to reduce
    the bias of the result.


    # Risk response


    At this point, you know your risks and have them prioritized based on the probability
    of occurrence and business impact. Now, it is time to determine the best mechanism,
    strategy, or control for that risk and to make your life easier. The responses
    can be divided into four categories:


    +   * Mitigate: This is the most common response; in the word "mitigation" is
    often used synonymously with risk because it is the default action that is considered
    when responding to a risk. Mitigation is based on the application of a control,
    system, mechanism, or strategy that is aimed to reduce the probability or impact
    of the risk. Examples of mitigation are the installation of Biometric Access Control,
    the installation of an Intrusion Prevention System, and performing a security
    test before releasing a system.

    * Transfer: There will be cases where the mitigation is too expensive or difficult
    to implement (due to a lack of knowledge or resources). In those cases, you might
    want to transfer the risk to a third party. One example is to apply insurance
    (to recover the cost of the device) or to subcontract a service with a third party
    (for example, sometimes, it is cheaper to host your servers on a secure data center,
    rather than applying level of security to your own data center).'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   - **Avoid**: Now, imagine that there is a new client-facing app with a
    beautiful GUI. However, you have done some research and found that the system
    has several unfixed vulnerabilities identified that could expose client data.
    In this case, the best way to deal with this risk is to *avoid* purchasing the
    system.


    +   - **Accept**: This is the least recommended option, and it should only be
    used as a last resort when the other three options are not suitable. For example,
    if the risk of someone accessing a legacy server is very low and the impact is
    also very low because it is a testing server and the hosted data is not sensitive,
    and the cost of the mitigation is $100,000, you might just decide to accept the
    risk and use your budget to support the response of more critical risks.


    > **Important note**nWe talked about using insurance for hardware; however, you
    can also apply insurance to non-tangible assets, such as the loss of data, and
    to cover other risks, such as data breaches or the liabilities that have originated
    from it.


    Let, let''s view the last step of this process, which is normally overlooked,
    but it is key to ensure that risks are current and managed on an ongoing basis.


    # Risk monitoring


    Risk management should be an iterative process, and this final step is aimed to
    ensure that risks are constantly **identified**, **evaluated**, and **addressed**.
    A risk evaluated as *minor* might become to **severe** over time, so the response
    should also be adjusted based on that change.


    # The NIST Cybersecurity Framework


    The NIST Cybersecurity Framework was designed to help cybersecurity professionals
    better assess and improve their capabilities to **identify**, **protect**, **detect**,
    **respond**, and **recover** from a cyber attack. This framework is based on the
    following five domains.


    # Identify


    The goal here is to understand our environment, including our assets, the business
    environment, governance, the risk management strategy, and more.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'As you might have noticed, asset identification is key in regard to cybersecurity.
    However, I would like to highlight that while this might sound obvious, many companies
    have suffered attacks due to a lack of understanding and awareness of their own
    infrastructure, systems, and devices.


    # Protect


    Now that you know your environment, it''s time to protect it. The framework proposes
    the following mechanisms (these are self-explanatory, so there is no need to deep
    dive into them):


    +   - Access control

    - Awareness and security

    - Data security

    - Information protection processes and procedures

    - Maintenance

    - Protective technology


    # Detect


    There will be many cases in which an attacker will be able to bypass your protection
    systems and layers, so, in those cases, you should be able to detect those threats.
    To achieve this, the framework suggests the following:


    +   - **Detecting anomalies and events:** Detect all malicious activity in a timely
    manner, including the potential impact associated.

    - **Security continuous monitoring:** Maintain the monitoring of your IT systems
    and assets to identify any events and the effectiveness (or weaknesses) of the
    protective measures.

    - **Detection processes:** Make sure you develop, update, and share all the processes
    and procedures aimed to detect cybersecurity events.


    # Respond


    This domain is about the application of appropriate actions to take against a
    given cybersecurity event:


    +   - **Response planning:** Make sure that you have all the processes and procedures
    in place to ensure a timely and effective response to cybersecurity events.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Creating an effective Business Continuity Plan (BCP)


    +   - **Communications**: This is a critical (and, normally, forgotten) task regarding
    how you communicate any cybersecurity event with internal and external stakeholders.

    - **Analysis**: This is an analysis of the responses to measure their effectiveness.

    - **Mitigation**: This refers to activities aimed to mitigate the impact of the
    cybersecurity event.

    - **Improvements**: This uses the lessons learned to support a continuous improvement
    model.


    # # Recover


    This domain is about the activities required to restore the business capabilities
    and services that have been impacted by a cybersecurity event:


    +   - **Recovery planning**: All of the planning events are required to ensure
    the timely restoration of the systems and assets affected.

    - **Improvements**: This refers to the improvement of all the planning events
    based on the lessons learned.

    - **Communications**: This involves managing communications with internal and
    external stakeholders associated with the impacted systems (for instance, vendors,
    providers, victims, and more).


    The first four domains are very similar to what we reviewed during the risk management
    process, so there is no need to expand on them. However, the last domain is very
    interesting and important because all companies should be prepared to face a disaster
    and ensure the continuity of their business after that, and that is what we will
    review in the next section.


    # # Creating an effective Business Continuity Plan (BCP)


    The question is not whether a disaster will happen, not even when it will happen,
    but if you will be prepared when it happens.


    By nature, human beings tend to think that negative situations will happen to
    everyone themselves. The problem with that way of thinking is when they know the
    histories of other companies that have lost everything after a cyber attack, only
    a few companies will invest in a plan to ensure the continuity of their business
    after a cyber incident.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The three main drivers for companies to create a BCP are as follows:


    +   * Those that are based on regulatory requirements from governments or international
    agencies

    * A contractual requirement from the clients

    * Self-awareness of the value of the BCP


    Now, I know how hard it is to get the funding and resources required to create
    an effective BCP, so here are key points gathered by market research experts (such
    as the Gartner group, the US National Archives and Records Administration in Washington,
    the US Federal Emergency Management Agency (FEMA), Bloomberg, and the University
    of Texas), which highlight the results of companies becoming victims of security
    attacks and not having an effective continuity plan:


    +   * 93% of companies that lose their data center for more than 10 days filed
    for bankruptcy within one year after the disaster.

    * 94% of companies suffering from a catastrophic data loss do not survive – 43%
    never reopen and 51% close within two years.

    * 50% of all tape backups fail to restore.

    * Companies that are not able to resume operations within 10 days of the disaster
    are not likely to survive.

    * Between 40% and 60% of small businesses never reopen their doors after a disaster.


    Also, let me share some additional statistics regarding the BCP on big corporations:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_90_0.png)


    Figure 2.15 – BCP statistics'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Creating an effective Business Continuity Plan (BCP) 69


    The numbers don''t lie: you can leverage these numbers to highlight the global
    cybersecurity landscape in order to get support and resources from executive stakeholders
    and sponsors to create/maintain your BCP/DRP.


    Now, the first step toward creating a BCP is to have a deep understanding of the
    company (that is, its processes, departments, hierarchy, functions, and roles)
    and how any potential disruption can impact the capability of the company to continue
    its core business; this is called Business Impact Analysis (BIA).


    # Creating a Business Impact Analysis (BIA)


    Again, there are many templates available on the internet that you can use to
    create a BIA. Some of them are very complex and may be overkill for medium-sized
    companies. On the other hand, there are very simplistic templates that might be
    a good fit for small to medium-sized companies, they will not be granular or detailed
    enough for a big corporation. However, the important thing here is not the template,
    but how to fill it properly. Let''s review all of the concepts that you need to
    understand to create a world-class BIA.


    # Mission essential functions


    All processes are important; however, you need to identify which are supporting
    processes and which are the processes required to run the business. For example,
    if your company manufactures cars, then the manufacturing process is essential
    and must be up and running to avoid losing money. In contrast, there are other
    supporting functions such as accounting, although very important, a disruption
    of such process might not have the same impact.


    # The identification of critical systems


    You must identify the systems that are critical for your company. For example,
    an email server is important for your company, but the company might still be
    able to run the core business even when the email server is down. However, on
    the other hand, if your company business is selling clothes online, then you will
    lose money and clients every minute (or second) that the web page is down.


    # The recovery time objective (RTO)


    The RTO represents the time that a company must spend to restore those processes,
    activities, or operations after suffering a disaster.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 70 Managing Threats, Vulnerabilities, and Risks


    Defining the RTO is not a simple task because executives will always want to have
    this close to zero, but ultimately, the higher the cost associated. So, be realistic
    when defining this number to avoid shooting yourself on the foot.


    Keep in mind that some executives will try to look for an overall RTO for the
    entire company. However, you should define RTOs at a lower level (by process,
    activity, department, or task) that will help you identify gaps or points in which
    more resources will be required to support it. For example, the RTO to restore
    the manufacturing line after a disaster must be the RTO to restore email services.
    In the following table, you can see how to map a service to the criticality of
    the data managed and the associated RTO and RPO:


    | Service | Data Type | RPO | RTO |

    |---|---|---|--|

    | Transactional website | Critical for Business | 45 minutes | 1 to 2 minutes
    |

    | VoIP | Required for Business | N/A | 10 minutes |

    | Email | Important for Business | 1 to 5 minutes | 360 minutes |


    Figure 2.16 – The RPO/RTO by the criticality of the data


    Now, let''s look at the other important metric, the recovery point objective (RPO).


    # The recovery point objective (RPO)


    This refers to how much data is acceptable after a disaster. In other words, how
    much data you need to recover after a disaster. However, here is the tricky part;
    even if we talk about data, that data is not measured in size but in time, so
    it is not about how many bits you recover, to which point in time you must recover
    the data. For example, if you have an email server, losing the emails received
    in the last hour may be acceptable, so an RPO of 1 hour is fine. In contrast,
    if you lose 1 hour of payment records, then that might not be acceptable. In that
    situation, the RPO will be between 1 and 10 seconds. In the following diagram,
    you can see the correlation between the RPO and the RTO:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_92_0.png)


    Figure 2.17 – An example of RPO and RTO'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'These two metrics are based on downtime and data loss. However, there is another
    important metric to determine the reliability of your systems and that by measuring
    how frequently a system is expected to be down: the **mean time between failures
    (MTBF).**


    # Mean time between failures (MTBF)


    This metric is normally used by a manufacturer to determine the average product
    lifetime, however, this metric is very useful when you want to justify an investment
    to replace a faulty legacy system. For example, imagine you have 20 wireless access
    points that were installed on the same day. Then, you realize that one failed
    after 200 days, the second one after 400 days, and the third after 600 days. That
    means that in 1,200 days, you got three failures, by dividing that, you will get
    an MTBF for the wireless access points of 400 days.


    > **Important note**nIf you are in charge of cybersecurity, then it is your responsibility
    to detect faulty systems and provide alternatives to replace them before they
    cause a major disaster. This is because if system causes an outage, then all fingers
    will point to you. So, be proactive!


    Another useful metric is to determine the *average time it takes to perform a
    given maintenance activity*, such as reboot a server or replacing hardware. This
    is important because you can use it in time, in the future, to better forecast
    the time needed for said activity. This metric is called the **mean time to repair
    (MTTR).**


    # Mean time to repair (MTTR)


    As its name suggests'
  merge: -1
  img_proc: true
- pgno: 94
  md: '72 Managing Threats, Vulnerabilities, and Risks


    # Availability


    Are you still wondering about the value of knowing the MTBF and the MTTR? Well
    besides the benefits mentioned earlier, you can also use them to calculate the
    availability of your service.


    This is a very interesting metric that you can use to report the status of your
    systems to the upper management and justify any previous and future investments.
    For example, let''s imagine that your web server went down twice in the last 400
    days (MTBF = 200 days) and that the MTTR was 3 hours (MTTR = 0.125 days). Therefore,
    if the device failed every 200 days and it took 0.125 days to get restored, then
    it means that availability is equal to 200 / (200 + 0.125), which means that,
    in this case, the availability of our web server is 99.375%.


    Availability = MTBF / (MTBF + MTTR)


    Now, is your 99.9375 good? Well, that determines your business. However, data
    centers use a Tiers approach to determine their level of availability, so you
    can use those values as a point of reference:


    +   * Tier 1: 99.671% availability (this is equal to 28.8 hours of downtime annually).


    +   * Tier 2: 99.741% availability (this is equal to 22 hours of downtime annually).


    +   * Tier 3: 99.982% availability (this is equal to 1.6 hours of downtime annually).


    +   * Tier 4: 99.995% availability (this is equal to 26.3 minutes of downtime
    annually).


    > Tip

    are you looking for a way to objectively support the decision about having solution
    hosted in-house or with a third party? Well, you can analyze the current availability,
    and contrast against the availability offered by the vendor to determine which
    solution is best for your business.


    A good way to enhance the availability of your infrastructure is by finding the
    devices that could jeopardize the uptime of your systems and infrastructure. Those
    devices are known as single points of failure.


    # A single point of failure


    As mentioned earlier, a key aspect to enhance the availability of your systems
    and infrastructure is by identifying the critical devices that could impact the
    uptime of systems. Once identified, you must ensure that these systems have the
    highest level of security to reduce the risk associated with them, and as you
    probably guessed, devices must have the lowest MTBF and MTTR.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Additionally, you need to take the necessary steps to ensure redundancy is
    in place for those single-point-of-failure devices to avoid unplanned downtimes:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_95_0.png)


    Figure 2.18 – An example of a single point of failure


    Figure 2.18 is an example of how network devices are a common single point of
    failure.


    # Who creates the BIA?


    The creation of the BIA is a joint effort in which each leader of the department
    or unit is in charge of assessing their organization and creates the BIA. However,
    there should be someone leading and coordinating the creation of them, as well
    as providing guidance and support in terms of how to create it. Depending on the
    company structure, normally, that task relies on the risk manager or the BCP manager.
    However, if this role is not present in your organization, I suggest you take
    over this role because, ultimately, you will be the one to benefit from its creation.


    # Business Continuity Planning (BCP)


    The guide to the beginning of the end!


    The goal of the BCP is to have a set of policies, processes, procedures, mechanisms,
    and tools that are ready to be used to reduce the impact of a disruptive event.
    Now, let''s take a look at what you need to do to create a BCP.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Defining the scope and objectives


    A good plan is a well-defined plan. So, here, we will start by laying the ground
    for a good BCP:


    +   - Scope: Determine the scope of the BCP (for instance, departmental, corporate,
    country base, and more).

    - Objectives: Highlight the objective of the BCP based on corporate guidelines.

    - Assumptions: Add any relevant assumptions that could be useful for readers.

    - Document owner: Outline who owns the document.

    - Document version: Outline the current version of the document.

    - Distribution list: Outline to whom should this document should be distributed.

    - Identify key stakeholders: Outline a list of stakeholders with their roles and
    responsibilities.


    # Risk assessment


    You don''t have to create another risk assessment. Instead, this is leveraging
    your risk assessment as one of the inputs for the BCP; just make sure it includes
    the following items:


    +   - Risk description: Make sure the listed risks include clear descriptions
    that can be understood by others outside of the IT team.

    - Residual risks and secondary risks: List any residual or secondary risks.

    - Risks source: Make sure the risks are categorized by the source (for example,
    environmental, man-made, and more).


    # Business impact analysis


    We already know how to create a BIA (so, there is no need to review it again).
    However, there is a lot of debate what needs to be created first: the BCP or the
    BIA (this is similar to the chicken and the egg dilemma).


    The general consensus from experts is that it is better to have the BIA created,
    as that is an input for the BCP. Another way to do this is to make them in parallel;
    however, the effort to make both at the same time could be overwhelming.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Business continuity strategies


    This is probably the biggest aspect of the BCP, as this will will contain all
    the strategies, processes, procedures, and other relevant information that supports
    the continuity of the business:


    +   - **Definitions of the processes and procedures:** Define all the processes
    and procedures in place to ensure the continuity of the business after a cyber
    incident

    - **Team responsibilities:** Determine the roles and responsibilities of the different
    teams related to business continuity.

    - **Law and regulation requirements:** List all of the laws and regulations applicable
    and the associated impact in the case of a cyber incident.

    - **Preventive controls and mitigations:** Mention what controls and mitigations
    are in place to ensure the continuity of the business.

    - **Definition of the triggers:** Outline when to trigger the controls and mitigations
    to avoid business disruption.

    - **Alternative sites (data):** List all the information related to alternative
    sites in the case of a disruption on the main systems.

    - **Alternative locations (employees):** Include all the information related to
    an alternative location in which to move operations in the case of a service disruption.

    - **Alternative providers and procurement:** Provide a list of available alternative
    providers of goods and services in the case of issues with current providers.


    # Employee safety


    The priority of every company should always be the safety of their employees,
    so as a good practice, a BCP must include a section that contains, at the very
    least, the following items:


    +   - **Evacuations:** All information related to the evacuation plan locations

    - **Emergency kits:** Information related to emergency kits (for instance, availability,
    contents, expiration dates, and more)

    - **Roles and responsibilities:** The roles and responsibilities of the emergency
    response teams

    - **Emergency contacts:** The contact information of the members of the emergency
    response teams'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Communications


    The management of communications in the case of a cybersecurity incident is one
    of the most important aspects of how a company deals with an event. The lack of
    good planning here could damage one of the most precious assets of all organizations:
    their reputation and brand. Therefore, make sure you, at the very least, include
    the following in your plan:


    +   - Internal communications: These are guidelines regarding how to manage communications
    if there is a cyber incident.


    +   - Stakeholder communications: These are guidelines regarding how to manage
    communications with corporate stakeholders if there is a cyber incident.


    +   - Media communications: These are guidelines regarding how to manage communications
    with external entities (such as the media, social media channels, and more) if
    there is a cyber incident.


    # Testing and reviews


    A company might invest a lot of resources to create a BCP. The plan might look
    great, and the boss might love it, but how do you know whether it will work? Well,
    here you need to consider the following:


    +   - Testing guidelines: How the BCP will be tested and how the testing will
    be measured.


    +   - Testing schedule: Determine when the testing will be performed (for example,
    how often) or what events will trigger a test.


    +   - Testing manager: Who will be responsible for the test?


    # Updates and maintenance


    Risks changes and threats evolve, so the BCP should also evolve. Therefore, make
    sure you include this section to keep the plan relevant and up to date:


    +   - Update policy: Outline how, when, what, and who will be in charge of updating
    this BCP.


    +   - Revision history: Include a version history of the changes to each version
    of the BCP.


    If you include all the preceding steps, then you will have a very detailed and
    powerful BCP that will help you to ensure that your company will survive after
    a service disruption or cyber incident. The following diagram shows the main causes
    of IT service disruption or downtime:'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Implementing a best-in-class DRP


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_99_0.png)


    Figure 2.19 – Common causes of downtime


    But what happens if the BCP fails? For example, what would happen if the power
    generator fails? What if the alternate site is not accessible? That would be a
    disaster, and you need to be prepared for that. You can do that by having a Disaster
    Recovery Plan (DRP).


    # Implementing a best-in-class DRP


    Are you confused about the scope of the DRP and the BCP? Well, don''t worry because
    that is common. In fact, a quick search on the topic will show you that even authors
    don''t agree on the boundaries of those two terms; however, let me try to make
    it as simple as possible.


    The differences between the BCP and the DRP are follows:


    +   - The DRP can be considered a subset of the overall BCP.


    +   - The DRP is about restoring a critical server in the case of a disaster (reactive).


    +   - The BCP is about preventing business downtime (proactive).


    +   - The BCP is business-related (processes), while the DRP is more IT-related
    (systems and data).


    +   - The BCP can be applied during normal operations to prevent disruptions,
    while DRP is just executed if there is a disaster.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Creating a DRP


    Here is an overview of the items that you must include when creating a DRP:


    +   **Scope:** you must define the scope of the DRP. While, normally, companies
    just create an overall DRP, there are cases where you will find benefits in creating
    segmented DRPs; for example, for systems, for networks, and for data.

    - **Assumptions:** Identify all the assumptions that are relevant to this DRP.
    One example of a common assumption is that certain items are covered in the BCP
    (such as backups, redundancies, and failovers).

    - **Activation criteria:** Identify the triggers to consider if an event is a
    disaster. For example, if there is a power outage and the mitigation strategy
    (such as secondary power generators) is not working.

    - **Scenarios and response strategies:** Here, you need to include a set of scenarios
    that can be considered as disasters and outline how to mitigate them to restore
    your business operations. For example, the local server is down and the secondary
    server on the cloud is not accessible.


    Be creative! In fact, it''s better to consider some unusual scenarios such as
    a pandemic or a war (even if they might never happen) than not considering them
    and becoming affected by them. In the following diagram, you can view some example
    sources of disasters:


    # Possible Disasters


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_100_0.png)


    Figure 2.20 – Possible triggers of disasters


    +   **Disaster recovery requirements:** What do you need if there is a disaster?
    For example, this could include technical requirements, operational requirements,
    communication requirements, backup requirements, redundancy requirements, documentation
    requirements, regulation requirements, and client requirements.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   Disaster recovery procedures: What procedures need to be followed if there
    is a disaster? For example, they could include communication management, remote
    access procedures, access control (both physical and logical), and more.


    +   Roles and responsibilities: Who is responsible or accountable for various
    tasks there is a disaster (that is, who will be in charge of networks? Who will
    be in charge of servers? And who will be in charge of VoIP?)


    # Implementing the DRP


    A DRP is useless if you don''t know how to implement it. So, let''s take a look
    at some best practices when implementing a DRP:


    +   Periodically review the contracts and agreements with backup providers, as
    services change over time and you might not get what you need.


    +   Make sure you have an Order of Restoration to determine which systems will
    be restored first based on the business impact (RTO).


    +   Remember that the cost of a recovery site varies depending on the service
    type (for example, hot, warm, or cold), so make sure you distribute them to reduce
    costs (you don''t want to host a test server on a hot site)


    +   Analyze the providers of your providers. I remember one situation in which
    the DRP stated that the secondary ISP was down, then move to ISP X. What we discovered
    during a test that ISP X was subcontracting the services from our secondary ISP.
    This meant that a problem on the infrastructure of the secondary ISP would also
    impact ISP X, rendering our DRP useless.


    +   Perform scheduled DRP tests to validate the effectiveness of it.


    +   Perform tests to validate whether the actions can support the number of people
    or services required. For example, during a test, you might check that you can
    connect to a secondary server, but does that server give you the required level
    of performance? Can it accept the number of connections that you need to restore
    the business?'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - Perform security tests to ensure that the minimum acceptable security
    level can be obtained with the DRP.


    +   - If you have multiple locations, test access to the secondary servers/systems
    from all locations (you need to make sure that your employees working from a beach
    in Costa Rica can also access the secondary systems/servers).


    +   - Test the durability (proposed on the DRP) over an extended period of time
    and during different seasons. For example, you might test a satellite internet
    connection, and it could work if the sky is clear, but it might not provide you
    with the required level of service during cloudy weather or a storm.


    +   - Get the required approvals (from the CEO, CTO, and CFO) before publishing
    the DRP. CTO approval is key to ensure they agree with the technical decisions,
    CEO approval is key to ensure the DRP effectively covers the business, and CFO
    approval ensures that you have the budget to implement and execute.


    # # Summary


    In this chapter, we covered a lot of very interesting and important topics that
    you can apply to your defense strategy.


    First, we learned how to create a vulnerability assessment, including an overview
    of the most common types of vulnerabilities to help you create the best assessment.
    Then, we expanded into one of the core aspects of cyber defense: risk management.
    Here, we learned how to manage cybersecurity risks, and also looked at one of
    the most famous frameworks in cybersecurity: the NIST Cybersecurity Framework.


    Additionally, as discussed in the previous chapter, availability is one of the
    core principles in cybersecurity. Therefore, to avoid downtime, we learned how
    to create a BCP, including a deep dive into its most important components: the
    BIA and the DRP.


    We also learned the details behind one of the most common and dangerous vulnerabilities,
    that is, famous (or infamous) USB HID vulnerabilities. Here, we learned about
    the most common attack vectors that leverage this vulnerability, and also the
    tools and techniques we can use to prevent these types of attacks.


    In the next chapter, we will expand this further and show you all the vulnerabilities
    associated with the weakest chain in cybersecurity, the user, and all the mechanisms,
    tools, and techniques that you can leverage to patch the user.'
  merge: -1
  img_proc: true
