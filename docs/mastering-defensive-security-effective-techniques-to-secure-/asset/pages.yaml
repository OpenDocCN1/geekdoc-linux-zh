    your lives easier. In addition, their cost make them very accessible to the consumer
    market. However, these cheap devices bring a lot of opportunities for cybercriminals
    who are eager to leverage the devices to exploit vulnerabilities.


    Therefore, in this chapter, you will learn how to get ahead of the criminals.
    You will also learn how to leverage these technologies to create your very own
    cybersecurity tools, such as the following:


    +   - Your own device to detect rogue access points

    - A Raspberry Pi firewall and intrusion detection system

    - A powerful honeypot for less than $10'
