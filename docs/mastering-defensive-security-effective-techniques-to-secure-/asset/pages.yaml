- pgno: 105
  md: '# # 3 Comprehending Policies, Procedures, Compliance, and Audits


    "All industries are facing the necessity to have subject matter experts on Cybersecurity;
    while the current reality has demonstrated a deficit of this profile in the market.
    This means an opportunity for us to get specialized on the matter and help industries
    to mitigate current and future Cybersecurity related risks."


    - Joel González Saldivar – Human resources and skills development expert México


    Policies, procedures, compliance, and audits are topics that may sound boring
    for technical specialists. However, they are of utter importance in the field
    of cybersecurity.


    In fact, policies and procedures are the backbone of all organizations’ cybersecurity
    strategy and posture, while compliance and audits are the best mechanisms to ensure
    they are being followed; therefore, these are critical topics to be addressed
    by all cybersecurity professionals.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Comprehending Policies, Procedures, Compliance, and Audits


    You also need a tool to measure your level of cybersecurity as this will help
    you to understand where you are, where you want to be, and the path to get there.
    The best tool to enable that you can achieve is a Cybersecurity Maturity Model
    (CMM).


    In this chapter, we are going to cover the following topics:


    +   - Understanding the value and importance of cybersecurity policies and procedures

    - Implementing the Create, Update, Distribute, Socialize, Enforce (CUDSE) method
    to create and manage cybersecurity policies and procedures

    - Understanding the impact of compliance and how to ensure you are always aligned

    - Understanding the different types of audit and how to effectively manage them

    - The benefits, characteristics, and structure of a good CMM

    - An overview of the best CMM: the Enterprise Cybersecurity Maturity Model (ECM2)


    # Creating world-class cybersecurity policies and procedures


    When we work in cybersecurity, we used to think about the technical side of it:
    how to secure our networks, how to develop better code, how to be more resilient,
    and so on. However, there is a very important layer that supports all those efforts,
    and is the backbone of enterprise-level security: the cybersecurity policies and
    procedures.


    However, creating them is not an easy task, and most people were never trained
    to do this. In fact, as IT professionals, we are used to following a tutorial
    or recipe to install a new system or server, but there is no such a thing as cybersecurity
    policies and procedures.


    Therefore, to make this task as simple as possible, I will show you the CUDSE
    method (www.cudse.com), which has been successfully used by several companies
    around the world as a guideline for creating best-class cybersecurity policies
    and procedures.


    # Cybersecurity policies


    The main goal of defensive security is to keep your data and systems secure (available,
    confidential, and integral).'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Creating world-class cybersecurity policies and procedures


    To do that, we implement **systems** (such as an **intrusion prevention system
    (IPS)** and an **intrusion detection system (IDS)**), *strategies* (such as a
    *Defense in Depth (DiD)* strategy), and *plans* (such as a *business continuity
    plan (BCP)* and a *disaster recovery plan (DRP)*); however, you also need to create
    the *rules* that will govern all the factors around your infrastructure.


    Those rules can be related to a system (for example, an access policy), to a user
    (a password policy), or to data (a privacy policy).


    It is important to remember that *all policies* must be custom-made for each company.
    In fact, there are cases where a company may have different policies based on
    geography, and normally they are driven by the culture, local laws, regulations,
    and markets.


    However, there are some policies that are almost **standard** and present in most
    organizations. Some examples of these are shown in the following figure:


    | Identity and Access Management policy |

    | Change management policy |

    | Data retention policy |

    | Remote access policy |

    | Internet access policy |

    | Encryption policy |

    | Clean desk policy |

    | Password policy |

    | Privacy policy |


    Figure 3.1 – Correlation of policies and procedures


    > **Tip**nIf you need a hand to start creating your policies, you can download
    a template from the internet and use it as a guide; for example, here is a good
    repository from the **SysAdmin, Audit, Network, and Security (SANS)** Institute:

    https://www.sans.org/information-security-policy/.

    However, as mentioned earlier, you need to make sure that you create policies
    that adhere to your organization, culture, and local regulations.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Cybersecurity procedures


    Procedures are step-by-step instructions that guide users on how to achieve a
    result that ensures compliance with a given policy.


    Usually, policies contain (or make reference to) a plurality of procedures that
    guide users on how to perform a task to comply with the policy. The following
    figure illustrates this correlation of policies and procedures:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_108_0.png)


    For example, an Identity and Access Management (IAM) policy may make reference
    to the following procedures:


    +   - How to remove users from Active Directory (AD)

    - How to delete disabled IDs

    - How to archive access logs

    - How to elevate privileges on UNIX servers

    - How to elevate privileges on Windows servers

    - User notification procedure


    Those invisible layers are normally overlooked by cybersecurity professionals;
    however, it is of the utmost importance to invest time, knowledge, and resources
    to ensure they are properly created, updated, distributed, socialized, and enforced.


    # The CUDE method


    A common mistake in cybersecurity is the lack of a clear guideline on how to address
    the creation of policies and procedures.


    This may be caused because we don''t like to deal with non-technical stuff (it
    seems boring), because nobody seems to care about policies or procedures, or just
    because this is such forgotten topic that almost no cybersecurity book talks about
    it.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Creating world-class cybersecurity policies and procedures 87


    So, to fill this gap, I designed the CUDSE method (www.cudse .com), which covers
    all the important aspects you need to take into consideration when creating your
    cybersecurity policies and procedures. Let''s take a look at this method now.


    # Create


    First, you need to make sure you create meaningful policies that make sense to
    you and your organization, and to achieve that you need to follow these simple
    rules:


    +   - **Easy to understand:** Reason people hate reading policies because they
    seem to be written to be boring and complex. So, instead, write them using simple
    language to make them more appealing to the reader.  *Keep it simple and keep
    it short.* As seen in the following table, a bad policy is complex, uses a lot
    of technicisms (which are irrelevant and confusing for most users), does not provide
    clear guidelines on how to be compliant, and refers to an unknown resource (no
    link provided). On the other hand, a good policy is clear, briefly talks about
    the problem it addresses, and provides a clear way to fix the problem and be compliant
    with the policy:


    | Bad Policy ❌ | Good Policy ✅ |

    |---|---|

    | All emails must use a secure encryption algorithm to obfuscate data from MITM
    attacks. | Emails must be encrypted as it ensures that no one reads your important
    emails. |

    | S/MIME encryption must be used when sending emails as it is based on the de
    facto industry standard PKCS7#. If you need more information, please visit the
    IT knowledge center. | **Encryption is enabled** on the email settings. |


    Figure 3.3 – Example of a good policy and a bad policy


    +   - **Easy to implement:** Make sure that what you write can be implemented
    and enforced, otherwise you are wasting your time. A good tip is to work closely
    with **Human Resources (HR)** to ensure that all policies can be enforced and
    that there are no conflicts with local regulations, laws, or rights.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '+   **Integrated:** As you surely know, technologies need to be integrated
    to close any possible gaps, and policies are no different. They need to be smartly
    integrated to ensure there are no gaps to bypass them. For example, as in the
    following figure, you may have a plurality of policies that together will be the
    baseline of your defensive security:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_110_0.png)


    +   **Inclusive and cooperative:** Remember, you are not alone in this. In fact,
    if you sit at your desk to write all policies by yourself, you will be making
    a grave mistake. Instead, work with each area or department in your company to
    develop those guidelines together. This will help you to create better policies
    and to gain buy-in from the people concerned. As mentioned earlier, HR is one
    of your biggest allies in this endeavor.


    +   **Use dummy-proof examples:** Use examples that people can easily understand
    and relate to that illustrate the point you are trying to make. A good way to
    achieve this is by using a *Dos and Don''t* as table, as follows:


    # # Identity and Access Management Policy


    | DOES | DON''Ts |

    |---|---|n| Contact support to request access | Borrow someone''s account |

    | Delete unused IDs | Disable unused IDs |

    | Create account based on the least privilege principle | Create all account with
    Admin Rights |


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_110_1.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Creating world-class cybersecurity policies and procedures 89


    +   * **Get approvals:** Find out who needs to review and approve these policies
    before moving to the next step. Most of the time, HR or the legal department can
    help you identify the individuals, teams, or groups that need to review and approve
    your cool policies.


    # # Update


    In the same way you keep your servers up to date (to protect against new threats),
    you must also do this with your policies.


    But this is harder because *this is not about adding a check to ensure your policies
    get daily updates*;; instead, you need to determine a time when every policy needs
    to be reviewed and analyzed to ensure they are still relevant in the current threat
    landscape (normally a yearly review is acceptable).


    However, there are some events that may trigger an early review of your policies,
    as follows:


    +   * Changes to the corporate policies

    * Acquisitions of new companies

    * New laws and regulations

    * Opening of businesses/offices in new geographies


    > > Tip

    Make sure that all updates and revisions made to policies and procedures are properly
    tracked in the version history of the document.


    # # Distribute


    A common mistake observed is that policies are distributed once they are created
    and then abandoned in an almost *unknown* location. I have seen cases where not
    even the **chief information security officer** (CISO) knows the location of those
    policies, so it is imperative that you make sure that cybersecurity policies are
    distributed to all employees in an organized manner.


    As confirmed by the attorney and cybersecurity expert Roberto Lemaitre, "you cannot
    enforce any penalties or sanctions for violating a policy if you don''t have proof
    that it was properly shared or distributed."'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Therefore, this is not only about distribution but also securing confirmation
    from the employees that the policy was received.


    > Tip

    Marking a checkbox online is a very easy way to get confirmation from a user in
    a legally enforceable way. However, always check with your legal department to
    ensure adherence to corporate policies and local regulations and laws.


    Now, you need to create a distribution strategy, and this can be as simple as
    defining when policies need to be distributed (or redistributed). Example scenarios
    are shown here:


    +   * When the policy is created or updated

    * During the onboarding of new employees

    * As part of annual required training

    * When a person changes their current role


    # Socialize


    Some companies only go as far as distributing the policies without any further
    follow-up activity. However, *that is not enough!*


    To be successful, you need to make sure that those policies and their associated
    procedures become part of the organizational culture.


    *This is not easy to achieve, but once a policy becomes part of the organizational
    culture, then everyone will naturally support and enforce the policy.*


    Additionally, this will also help you ensure that new employees adhere to the
    policies or adopt them faster. For example, if *everyone* locks the computer even
    to wake up for a second, new employees will naturally do the same, even if they
    have not read the policy.


    > Tip

    As you may have already guessed, making cybersecurity policies part of the organizational
    culture will allow you to significantly reduce future costs in policy training
    and education.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Understanding and achieving compliance


    Here are some tips to help you with this step:


    +   - Develop constant educational campaigns that include training, flyers, emails,
    and so on.

    - Identify influencers and assign them as champions of one policy (to help in
    promoting compliance).

    - Get buy-in from upper management and request their support to communicate the
    importance of having cybersecurity policies.

    - Get buy-in from HR and request their support to communicate the consequences
    of not following cybersecurity policies.


    # Enforce


    As the owner of the policy, you must determine who is in charge of making sure
    that the policy is being followed, as well as who is in charge of the application
    of sanctions in the case of violations.


    In most cases, you will be the one with access and knowledge to the tools that
    may detect any violation to such policies, therefore you must define a procedure
    on how you are going to manage these interactions (normally with upper management,
    HR, and the legal department).


    Another way to enforce this is by leveraging some technical tools—for example,
    you can enforce the password policy on the Active Directory, make encryption mandatory
    on emails, and so on.


    Another—less technical—way to do this is by updating corporate templates to make
    sure users don''t forget to fill in some mandatory fields—for example, include
    a footnote in all corporate templates to ensure that *data classification* is
    properly labeled (Public, Private, Confidential, and Restricted).


    # Understanding and achieving compliance


    Companies may be required to adhere to a plurality of laws and regulations governing
    how data should be stored, managed, and processed. As with any other law, failure
    to comply may result in fines or others legal consequences that may culminate
    in the shutdown of the business, therefore they need to be taken very seriously.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Types of regulations


    Before we look at how to achieve compliance, let''s look at the types of regulations
    based on the source.


    # Country regulations


    These are laws and regulations created by governments to regulate how data should
    be stored, managed, and processed by private companies.


    These regulations can be tricky because they may protect the individuals of the
    country regardless of the location of the company, so you need to understand the
    regulations associated with the geographical location of your users or clients.


    # Regional regulations


    These regulations are very similar to country regulations, but they cover several
    countries. Those countries are normally tied by some international cooperation
    treaty, such as the General Data Protection Regulation (GDPR) created by the European
    Union (EU).


    # GDPR


    A famous example of a regional regulation is the GDPR, whose logo is shown in
    the following figure:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_114_0.png)


    Figure 3.6 – EU flag representing the GDPR logo


    This is an EU regulation about data protection and privacy, aimed primarily at
    giving individuals control over their data and how companies handle it.


    This regulation is complex as it also applies to companies outside of the EU that
    manage the data of EU citizens.


    While there is a lot of criticism about the costs associated with complying with
    this regulation, some experts embrace this as a legal mechanism, to encourage
    companies to have a better cybersecurity posture and to prevent misuse of personal
    information.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Understanding and achieving compliance


    Another good reason to comply is the astronomical cost of the associated fines.
    As an example, British Airways had to pay more than 200 million US Dollars (USD)
    due to poor security practices that caused a massive breach of client information.


    > Tip

    In some cases, regional or international regulations are above local regulations,
    so the recommendation is to work with your legal department to analyze them carefully.


    # Market/industry regulations


    There are some regulations associated with certain markets or industries. Some
    of those regulations are very rigorous and may also apply to suppliers and vendors,
    so it is imperative that you know your business to make sure you are compliant.


    In case your company is in the services sphere, it could be a good strategy to
    be compliant with these sorts of regulations that is a great way to attract top-tier
    customers.


    Some examples of these regulations are outlined here:


    +   * Health Insurance Portability and Accountability Act of 1996 (HIPAA)

    * Sarbanes-Oxley (SOX) Act of 2002

    * Payment Card Industry Data Security Standard (PCI DSS)


    # Client regulations


    Some clients may demand that their service providers adhere to a set of regulations
    in order to do business with them. Most of the time, those regulations are a subset
    of the regulations mentioned previously (country, regional, or market), and companies
    use them to ensure their providers have a given level of security in their environment.
    So, while your organization may not be legally required to comply with those regulations,
    they must do so to maintain business with those clients.


    # Internal regulations


    Big international corporations may have their own cybersecurity regulations aimed
    at maintaining a given level of security across all divisions and geographies.


    These regulations are very similar to company policies, but large corporations
    prefer to use the term regulation, especially when they have big operations in
    different countries. This term is also widely used in franchises, to ensure that
    each franchisee is aligned with their internal cybersecurity regulations.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '> Create a matrix with the regulations that apply to your infrastructure to
    make sure you keep them in your radar at all times, and ensure that they are accounted
    for when you create your security strategies and policies (see an example of this
    in Figure 3.5).


    # Achieving compliance


    As explained earlier, achieving compliance is a very complex task that may require
    a considerable investment of time and resources. However, there are some clear
    incentives that you can provide to senior management to justify an investment
    in compliance, as illustrated in the following:


    +   * Avoid fines and penalties (including a temporary close of the business)


    +   * Increase the markets in which your company can do businesses


    +   * Reduce Cybersecurity risks


    +   * Being compliant with regulations is a good selling point to attract new
    customers


    +   * Increase the reputation of the company


    +   * Improve the handling of customer data


    +   * Increase the company presence on new markets


    Figure 3.7 – Benefits of achieving compliance with external regulations


    These points should be strong enough to ensure buy-in from upper management (in
    fact, just the first point should be more than enough). Let’s now focus on some
    good practices that you can apply to achieve compliance with most regulations.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Creating a plan


    Let''s honest—compliance is a very complex task, so in this case the best way
    to deal with the pain is to invest some time in planning. Remember that compliance
    has a binary result—you are either compliant or not; as my grandpa used to say:
    If you got to do it, you better do it!


    Now, don''t see planning as a waste of time—instead, think of it as a tool to
    ensure that you have a clear path to follow to achieve the required compliance
    level.


    To make this as simple as possible, I will summarize the items that you need to
    include to create a great compliance plan:


    +   - **Title**: Name of the regulation or regulations

    - **Stakeholders**: Names of the people associated with this regulation—for example,
    the HR manager, legal counsel, chief financial officer (CFO), and so on.

    - **Regulation details**: A detailed list of the requirements to comply with said—for
    example, encryption requirements, data handling requirements, and so on.

    - **Penalties and sanctions**: Here, you need to include all the penalties and
    sanctions related to each regulation. Also, remember that this is mostly a legal
    topic, so you must work with your legal department to properly create this section
    of the plan.

    - **Scope**: The scope of action of the regulation. This could be defined by geography,
    industry, and so on.

    - **Impact**: A detailed list of the systems, servers, services, data, and any
    other IT components that will be impacted by this regulation. Also, make sure
    you include the name of the owners so that you have them handy.

    - **Relevant dates**: Here, you need to add two different set of dates—firstly,
    the dates related to when the regulation will come into effect, and secondly,
    the dates by which you plan to be compliant.


    > One plan or two? Normally, you will create a single plan for compliance, but
    if you work for a big organization or your company needs to comply with too many
    regulations, then it may be a good idea to have several plans. A good option is
    to break the regulations (based on the types explained earlier) into groups and
    create a plan for each group.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Comprehending Policies, Procedures, Compliance, and Audits


    # Creating a compliance team


    As I already mentioned in this book, a good cybersecurity professional is not
    the one that does everything by themselves, but the one who knows how to get things
    done.


    Therefore, you need to learn with other professionals to achieve your goals.


    A good way to do this is by creating support teams—and in this case—creating a
    compliance team who will help you to get things moving faster and better.


    Now, this is not about randomly asking who want to be part of a team; instead,
    it is about selecting a group of people who have some interest in this regulation.
    For example, the e-commerce (sales) department may be a good stakeholder for Payment
    Card Industry (PCI) certification, while the HR, legal, and medical departments
    will be the ideal stakeholders for HIPAA.


    # Leveraging your existing information


    You can leverage your business information—such as a business impact analysis
    (BIA) or risk assessment—to determine the current efforts that you can leverage
    to comply with a given regulation.


    As mentioned in Chapter 2, Managing Threats, Vulnerabilities, and Risks, risk
    assessment is an iterative process, and this review may trigger a change in the
    previously specified response to a risk—for example, a risk that a company decided
    to accept may need to be remediated, as accepting it is not an appropriate response
    when dealing with regulations.


    # Reviewing your current controls


    Remember—we need to work smarter, not harder, and one way to be smarter is to
    leverage current systems and controls to achieve new goals.


    Do an inventory of your current controls and correlate them against the regulation
    to determine which controls can be used to comply with that regulation.


    You will find that many times, you just need to do some adjustments in your current
    systems in order to be aligned with the regulations.


    # Aligning compliance requirements with cybersecurity policies


    Not all regulations can be addressed with systems because there are many regulations
    related to users and, in those cases, you need policies.


    However, as mentioned earlier, you want to keep your policies simple, so try to
    leverage your existing cybersecurity policies instead of creating new ones.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'I know that there will be cases in which you may have to create new policies,
    but that will only happen when you confirm current policies do not apply.


    A good solution is to create a policy matrix, as seen in the following table,
    in which you can map your current policies against the applicable regulations:


    | Policy | HIPAA | PCI |

    | --- | --- | --- |

    | Password Policy | Not Applicable | Applicable |

    | Encryption Policy | Applicable | Applicable |

    | BYOD Policy | Applicable | Not Applicable |


    Figure 3.8 – Cybersecurity policy matrix


    A matrix will help you to easily identify any change that needs to be made on
    the policy (based on a change in the regulations) or confirm that there will be
    no compliance impact if a policy is updated.


    # Establishing mechanisms to validate compliance


    As now, we have developed a framework to ensure you are aligned with any given
    regulation, but this is not a one-time effort. Instead, compliance is something
    that needs to be sustained over time, you need to put a mechanism in place to
    make sure that you are compliant and that you stay compliant over time.


    The mechanisms used to test and verify compliance are called audits.


    # Exploring, creating, and managing audits


    At this point, we have reviewed concepts such as policies, regulations, and also
    a very cool defensive security strategy: Defense in Depth; however, all these
    policies, systems, strategies, and controls need to be tested to ensure they are
    giving the required results and that they are being implemented followed.


    In simple words, an audit is a process to test the compliance level of a set of
    policies, regulations, or requirements.


    Audits can be internal or external, let''s take a quick look at both.


    # Internal cybersecurity audits


    Normally, these audits are designed by an organization to ensure their systems,
    users, and data are compliant with a set of policies and regulations.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '98 Comprehending Policies. Procedures, Compliance, and Audits


    Large corporations may have a corporate-wide audit that includes data security
    as part of the audit.


    In most cases, corporate auditors report directly to C-level management to ensure
    their results are objective as possible.


    Due to the level of visibility of these audits, it is recommended that you perform
    internal (departmental) cybersecurity audits of your systems to make sure your
    environment is audit-ready.


    As seen in the following diagram, you may have departmental audits (Wintel team;
    UNIX Team; IAM team), organizational audits (networks; development; support),
    and having both covered will ensure that your IT department remains in audit-ready
    mode:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_120_0.png)


    Figure 3.9 – Internal audit structure


    If your company does not perform audits, then you must create your own security
    audits as that is one of the best mechanisms to ensure that your policies and
    controls are in place and are being followed as expected.


    # External cybersecurity audits


    In many cases, companies are required to be audited by a third party in order
    to verify their level of compliance with a law or regulation.


    There are also cases in which a company may want a third party to validate that
    cybersecurity policies are being followed.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Exploring, creating, and managing audits 99


    > Tip

    You must ensure that the company performing the audit is not the same company
    that provides you some cybersecurity services, as that may create some conflicts
    of interest and impact the neutrality and objectivity of the results.


    In some cases, the third party will announce the audit to give you some time to
    prepare the evidence required (logs, reports, and so on), but in other cases an
    auditor may show up to verify compliance right on the spot, requesting access
    to servers, validating access, and more.


    Normally, the result of the audit (called findings) will be provided to C-level
    management and then it will cascade down to you, and that highlights the importance
    of having your environment audit-ready at all times.


    > The auditor

    There is a big debate about whether a cybersecurity auditor should or not be a
    cybersecurity expert. However, that depends on the goal of the audit.

    If the chief executive officer (CEO) wants a basic audit of policies based on
    a checklist, then I do not see a reason for hiring a cybersecurity professional.
    On the other hand, if the goal of the audit is to perform a real test of the level
    of data security in the organization, then I would say that a cybersecurity professional
    is must.


    Now that we have seen both types of audits (internal and external), let''s move
    on to some best practices for how systems and data need to be managed during an
    audit.


    # Data management during audits


    You need to pay special attention to the way you manage data and systems during
    an audit.


    In general, it is recommended to put—on hold—any change to the infrastructure
    to avoid impacts during an audit. Additionally, there are some specific items
    that you need to consider during an audit, and these are different depending on
    if you are the auditor or the person (owner of the systems being audited).


    # As the person being audited


    In this case, you will be responsible for providing all the data and access required
    by the auditor.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Comprehending Policies, Procedures, Compliance, and Audits


    However, giving this level of access to a third party (or even everyone outside
    of your organization) is very risky, so I compiled the list of tips that may help
    you to reduce that risk:


    +   Always do a backup before someone touches your systems and data. This is very
    important as it lets you do a quick recovery in case any data gets accidentally
    corrupted (or modified/deleted) during the audit.


    +   Use the principle of least privilege (PoLP) when giving access to an auditor.


    +   Avoid gaining external access to your systems for audit purposes. Instead,
    request that the auditor performs the audit on-site to reduce risks.


    +   Make sure you check with your data retention policy to ensure that all required
    logs are available for the audit.


    Also, make sure you check with your HR and legal department to ensure that the
    external auditor signs all documentation, to reduce the risk of exfiltration of
    data (such as signing a non-disclosure agreement (NDA), confidentiality clauses,
    and so on).


    # As an auditor


    Auditors have a huge responsibility because the results of their findings may
    have legal, monetary, or professional consequences. Therefore, as an auditor you
    must adhere not only to high ethical standards but also to technical standards,
    to ensure that the data gathered is not tampered with. Here are the best practices:


    +   Adhere to best practices when gathering evidence. A good example is to hash
    the files before extracting them from the source. That way, you can demonstrate
    that the data you have was not altered.


    +   If you foresee any conflict of interest—for example, a family relation with
    the CISO of the company being audited—then speak before you start to avoid the
    audit questions questioned.


    +   Sometimes, you may find errors that can be fixed with a simple click on a
    checkbox, but as an auditor your job is to report and not fix, do not fall into
    the temptation to apply quick fixes.


    +   Remember that your access may be monitored, so do not abuse your access. Something
    as simple as accessing a folder or files that were not strictly necessary as part
    of your audit may result in fines or legal action against you and your company,
    so remember: with great power comes great responsibility.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Exploring, creating, and managing audits 101


    Some companies use generic auditors to perform all type of audits (including security
    audits). However, an auditor without basic cybersecurity knowledge may overlook
    some situations or can be easily tricked, so the best practice is that cybersecurity
    audits must be done by auditors with at least basic knowledge in cybersecurity.


    # Types of cybersecurity audit


    You can audit almost anything; however, that doesn''t mean you are going to waste
    time and resources on auditing, so next is a list of the most common audits performed
    in the area of cybersecurity.


    # Systems audit


    Depending on the scope, this may also include the following: IAM, passwords, and
    data retention.


    # Policy audit


    This is normally an extensive audit that tests the level of compliance of all
    cybersecurity policies in a company.


    # IAM audit


    This audit is about making sure that all IAM processes are aligned with a given
    policy or regulation. This may include the creation of users, disabling users,
    the deletion of users, and so on.


    # Data-handling audit


    This is one of the most complex audits because data can be associated with a plurality
    of factors that may impact the regulation or policies related—for example, owner
    of the data, location of the data, classification of the data, purpose of the
    data, and so on.


    International regulations such as HIPAA, PCI, and GDPR are highly focused on auditing
    data.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Comprehending Policies, Procedures, Compliance, and Audits


    # Network audit


    This is often attested with pentesting because it is aimed at the level of compliance
    of a network, and many times, you need to perform a pentest to successfully audit
    the level of compliance of a network.


    The most frequently used tools for this purpose are Nmap and Wireshark (both will
    be covered in Chapter 8, Enhancing Your Network Defense Skills).such as Nessus,
    Open Vulnerability Assessment System (OpenVAS), Acunetix, SolarWinds and ManageEngine—are
    also used on these types of audits.


    The following screenshot shows Nessus interface:


    ![](img/8c6a223c57e25ea0cc1593903a1b920f_124_0.png)


    > Figure 3.10 – Nessus interface


    Additionally, these tools can also be used as a low-cost and convenient solution
    to test our infrastructure against a given threat or vulnerability such as Spectre
    Meltdown, or to determine if we are compliant against a given standard such as
    PCI DDS.


    # Physical access audit


    This audit is testing all your mechanisms and controls related to physical access,
    and this is not just about physical access to the server room, but all systems
    to control and restrict physical access to the company.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'In fact, physical security (which we will see in depth in Chapter 9, Deep Diving
    into Physical Security) must be at the core of your defense strategy because the
    associated risks (for example, the Universal Serial Bus (USB) vulnerabilities
    reviewed in Chapter 2, Managing Threats, Vulnerabilities, and Risks) may cause
    a catastrophic impact to a company.


    Additionally, intruder may have access to the most vulnerable asset—the users,
    and could gain access to valuable information just by talking with them (we will
    see more about this type of social engineering attack in Chapter 4, Patching Layer
    8).


    > Note

    One of the biggest hacks of a social network was targeting Twitter, in which an
    attacker was able to compromise the top 100 accounts (influencers with +2 million
    followers) by using social engineering techniques against some Twitter employees.


    # Code audits


    These audits can be focused on a plurality of factors, such as the following:


    +   - Identification of bugs

    - Auditing the functionality of the code

    - Auditing the security of the code (to make sure best practices were applied)

    - Adherence to a given development framework (such as the Software Development
    Life Cycle and Agile development)

    - General best practices (such as comments and indentation)

    - Version management

    - Secure code repositories and deployment rules


    There is a common misconception that these audits are exclusively applied on software
    development companies; however, if a company modifies some of their apps, then
    code audits are still applicable.'
