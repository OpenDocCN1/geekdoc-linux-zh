- pgno: 205
  md: '# Legacy systems


    Almost all companies have a degree of legacy systems in production. Most of the
    time, this is because some applications were designed to run only on a specific
    OS, and migrating it to a supported OS may cause compatibility issues, so companies
    decided just to accept the risk.


    The problem is in those cases, you may have some unsupported OSes (or even apps,
    services, and protocols) that bring additional risks to your infrastructure.


    The recommendations to patch legacy systems are outlined here:


    +   - Perform testing to determine whether is is possible to migrate to a supported
    OS.

    - Research alternatives that can replace legacy apps.

    - If the first two options are not achievable, make sure that the system has the
    latest available updates (patches and hotfixes) installed.

    - Remove all unnecessary apps from the system.

    - Reduce the enabled ports to the minimum required by the app and disable the
    rest of them.

    - Disable all unused services.

    - Disable all unused apps.

    - Disable Remote Desktop (RDP).

    - Avoid making these servers internet-facing, and if required, apply additional
    security mechanisms such as requiring a virtual private network (VPN) to connect.

    - Schedule regular maintenance (at least quarterly) to check the server status.


    Additionally, it is a good practice to perform regular validation of your server
    environment (at least twice per year) to ensure which of them are still in use
    (and remove any ghost or unused servers).


    # Dependencies and compatibility issues


    Most apps have a lot of dependencies such as .NET Framework, the Java Runtime
    Environment (JRE), PHP: Hypertext Preprocessor (PHP), and so on, which means that
    to run those apps properly, you need to have those frameworks installed and running
    in the OS.


    Most of the time, those frameworks are backward compatibility, meaning they will
    also support apps created for old frameworks. However, this is not always true
    and there are cases in which you need to keep an old framework to keep your legacy
    app running.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'In those cases, the following is recommended:


    +   1. Evaluate the possibility of newer apps to replace legacy ones.


    +   2. Evaluate, document, and present the risks to upper management to consider
    whether they are willing to accept this risk.


    +   3. Evaluate the data managed by said app and use that as input to determine
    the impact of the risk.


    +   4. If there is a high risk involved, search for known vulnerabilities (related
    to that version of said dependency at https://cve.mitre.org/) to determine and
    apply workarounds to reduce the risk of attacks.


    +   5. Isolate the machine to just host said application to reduce the scope of
    the risk.


    Now, it''s time to show how to begin creating your patching strategy.


    # Distribution of tasks (patching roles and assignments)


    In most companies, patching is performed by IT infrastructure teams. However,
    in terms of cybersecurity, you may be responsible for ensuring that all servers
    are properly patched, here are some recommendations to ensure a smooth operation
    between you and the infrastructure team:


    +   Work together in the creation of a patching chronogram.


    +   Create a RACI matrix to determine who is responsible, accountable, consulted,
    and informed about the installation and deployment of updates on the servers.


    +   Establish a process to request urgent patches and hotfixes.


    +   Create a communications plan that includes contact information for the whole
    IT team.


    +   Create a responsibility matrix that includes all relevant information about
    the servers and the teams that support them. You can see an example of a responsibility
    matrix in the following screenshot:


    | Server name | OS | Supported | Responsible team | contact |

    |---|---|---|---|--|

    | Prod-Win-22 | Windows Server 2016 | YES | Wintel Prod | wintel@support.com |

    | QA-Win-14 | Windows Server 2019 | YES | Wintel QA | QA@support.com |


    Figure 6.5 – OS support responsibility matrix'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The preceding OS support responsibility matrix has five columns; however, you
    may extend it as required to include all relevant information.


    Also, make sure to define who is responsible for updating those documents, where
    they will be stored, and how often they must be updated.


    # # Distribution and deployment of patches


    On small infrastructures, this may be a straightforward task, but when you have
    several farms of servers with thousands of servers running a plurality of OSes,
    then this becomes very complex.


    While this task will be normally performed by the platform team, it''s the key
    that you understand how it works for the following reasons:


    +   - There will be cases where you will have to be in charge of managing the
    updates.

    - This knowledge will allow you to better adjust your defensive strategy accordingly.


    Now, let''s take a look at how updates can be deployed.


    # # Windows Server Update Services


    **Windows Server Update Services (WSUS)** enables you to manage and distribute
    the latest Microsoft product updates through a management console.


    Basically, the WSUS server will enable you to do the following:


    +   - Centralize update management

    - Update management automation'
