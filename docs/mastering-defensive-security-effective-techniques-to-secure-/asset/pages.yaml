    To download it, visit the official site at https://docs.microsoft.com/en-us/sysinternals/downloads/process-explorer.


    # Process Monitor


    Process Monitor (ProcMon) is another great tool by Microsoft (formerly Sysinternals)
    that allows you to monitor in real time all activity related to filesystems, processes,
    and thread activity. The executable file can be downloaded for free through this
    link: https://docs.microsoft.com/en-us/sysinternals/downloads/procmon.


    However, this tool can record thousands of events in a second, so there is a risk
    that you may bypass an event. However, to overcome this, you can export the results
    to a comma-separated values (CSV) file that you can use to visualize offline,
    such as ProcDOT.'
