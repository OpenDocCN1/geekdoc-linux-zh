- pgno: 180
  md: '# exe2hex


    This is a very interesting tool that helps encode binary files into ASCII text
    format to make the transfer process to the target machine easier. It helps the
    attacker bypass many of your security controls.


    Then, the attacker will leverage built-in tools in Windows (debug.exe and PowerShell)
    to transform the text into an executable file and perform the attack.


    The ability to bypass most of your security controls and place a malicious file
    in the target computer is very scary. However, the good news is that there is
    an easy way to prevent this attack vector.


    As mentioned previously, this attack leverages two built-in tools to complete
    its execution. debug.exe is not included in current Windows systems, so unless
    you have an unsupported version of Windows, you don''t have to worry about this
    (and if you have an unsupported version of Windows on your computer, then this
    will be another reason to migrate to that machine soon as possible).


    The other one is PowerShell, which, as you may know, can be exploited by a variety
    of attacks. So, here, the recommendation is to disable PowerShell on your Windows
    systems.


    If you have a big infrastructure, you can do this as a Group Policy Object (GPO)
    on Active Directory. Additionally, you can even create a GPO to enable access
    to PowerShell to a group of super admins (if needed).


    There are many more pentesting tools available on the market, but since pentesting
    is handled by offensive security specialists, our goal was to provide a quick
    review that you are familiar with them. Now, it''s time to talk about our next
    exciting topic, which is forensics.


    # Applying forensics tools and methods


    There will be cases where you will be required by management or the HR department
    to gather some data from a computer evidence as a procedure, policy, law, or regulation
    has been violated.


    Therefore, you need to have a variety of tools at hand that allow you to do this
