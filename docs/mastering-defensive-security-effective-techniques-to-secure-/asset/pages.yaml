    * An opportunity to close security gaps before they are exploited by criminals

    * Objective evaluation

    * Support of your continuous improvement initiatives

    * External validation of your hard work!!!


    > > Tips

    Hiring a dedicated red team may be expensive; however, if you have someone in
    your team with offensive skills, you can leverage that experience to perform mini
    testing (like a mini purple team).

    Having a purple team does not replace the need for a red team as from an external
    "unbiased" tester provide additional insights and value.

    Be careful when hiring a red team as they will handle very sensitive information
    about the company. Here, the rule is that you should always work with a partner
    that you can trust.

    Involve your legal team and make sure that a confidentiality and data privacy
    contract is signed with the red team.'
  merge: -1
