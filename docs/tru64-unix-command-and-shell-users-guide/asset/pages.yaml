- pgno: 116
  md: '# Using Processes


    This chapter explains the operating system processes. After completing this chapter,
    you will be able to:


    +   - Understand programs and processes

    +   - Redirect process input, output, and errors

    +   - Run processes in the foreground and background

    +   - Check the status of processes

    +   - Cancel processes

    +   - Display information about users and their processes


    A good way to learn about the preceding topics is to try the examples in this
    chapter. You should do each example so that the information on your screen is
    consistent with the information in this book.


    # 6.1 Understanding Programs and Processes


    A **program** is a set of instructions that a computer can interpret and run.
    You may think of most programs as belonging to one of two categories:


    +   - Application programs such as text editors, accounting packages, or electronic
    spreadsheets

    +   - Programs that are components of the operating system such as commands, the
    shell (or shells), and your login procedure


    While a program is running, it is called a **process**. The operating system assigns
    every process a unique number known as a **process identifier** (PID).


    The operating system can run a number of different processes at the same time.
    When more than one process is running, a scheduler built into the operating system
    gives each process its fair share of the computer''s time, based on established
    priorities.


    # 6.2 Understanding Standard Input, Output, and Error


    When a process begins executing, the operating system opens three files for the
    process: `stdin` (standard input), `stdout` (standard output), and `stderr` (standard
    error). Programs use these files as follows:'
  merge: -1
  img_proc: true
- pgno: 117
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 118
  md: 'keyboard. In this example, however, input for wc comes from the file named
    file3.


    In the preceding example, you could have entered the following, and displayed
    the same output:


    ```

    wc file3

    ```


    This is because most commands allow the input file to be specified without the
    left-angle bracket (<).


    However, there are a few commands like mail that require the use of the left-angle
    bracket (<) for special functions. For example, note the following command:


    ```

    $ mail juan < report

    ```


    This command mails to the user juan the file report. For more information about
    mail, see the mail(1) reference page.


    # 6.2.1.2 Redirecting Output


    All shells let you redirect the standard output of a process from the screen (the
    default) to a file. As a result, you can store the text generated by a command
    into a new or existing file.


    To send output to a file, use either a right-angle bracket (>) or two right-angle
    brackets (>>).


    The right-angle bracket (>) causes the shell to:


    +   - Replace the contents of the file with the output of the command, if the
    file exists.

    +   - Create the file, if the file does not exist and place the output of the
    command into the file.


    Two right-angle brackets (>>) add (append) the output of the command to the end
    of a file that exists. If you use two right-angle brackets (>>) to write output
    to a file that does not exist, the shell creates the file containing the output
    of the command.


    In the next example, the output of ls goes to the file named file:


    ```

    $ ls > file

    $

    ```


    If the file already exists, the shell replaces its contents with the output of
    ls. If file does not exist, the shell creates it.


    In the following example, the shell adds the output of ls to the end of the file
    named file:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '```

    $ ls >> file

    $

    ```


    If file does not exist, the shell creates it.


    In addition to their standard output, processes often produce error or status
    messages known as diagnostic output. For information about redirecting diagnostic
    output, see the following section.


    # 6.2.2 Redirecting Standard Error to a File


    When a command executes successfully, it displays the results on the standard
    output. When a command executes unsuccessfully, it displays error messages on
    the default standard error file, the screen. However, the shell lets you redirect
    the standard error of a process from the screen to a file.


    Redirection symbols and syntax vary among shells. The following sections describe
    standard error redirection for the Korn and POSIX shells and the C shell.


    # 6.2.2.1 Bourne, Korn, and POSIX Shell Error Redirection


    The general format for Bourne, Korn, or POSIX shell standard error redirection
    is the following:


    ```

    command 2> errorfile

    ```


    The command entry is an operating system command. The errorfile entry is the name
    of the file to which the process writes the standard error. The 2> is a file descriptor
    digit combined with the right-angle bracket (>), the output redirection symbol.
    The file descriptor digit tells the shell what standard file to access so that
    its contents may be redirected. The file descriptor digit 2 indicates that the
    standard error file is being redirected.


    In fact, for the Bourne, Korn, and POSIX shells, a file descriptor digit is associated
    with each of the files a command ordinarily uses:


    +   - File descriptor 0 (same as the left-angle bracket [<]) specifies standard
    input (the keyboard).

