  md: '# 7.6 Login Scripts and Your Environment


    A login script is a file that contains commands that set up your user environment.
    There are two kinds of login scripts:


    +   - System login scripts for all users of a particular shell

    +   These scripts create a default environment for all users and are maintained
    by your system administrator. The Bourne, Korn, and POSIX shells use a system
    login script called `/etc/profile`. The C shell uses a script called `/etc/csh.login`.
    See Table 7-6 for the pathnames of system login scripts.

    +   When you log in, the commands in this file are executed first.


    +   - Local login scripts in your default login directory

    +   These scripts let you tailor your environment, and you maintain the appropriate
    file. For example, you could change the default search path or shell prompt. If
    your default shell (see Section 7.3) is the Bourne, Korn, or POSIX shell, the
    login script file is called `.profile`. The C shell uses the file called `.login`.
    A local login script is executed after the system login script.


    If the C shell is your default, your environment can be further tailored with
    the `.cshrc` file. It executes when you log in (before `.login`) and whenever
    you spawn a subshell. The `.cshrc` file is the C shell mechanism that automatically
    makes variables available to subshells.


    On startup, the Korn and POSIX shells will also execute any file pointed to by
    the ENV environment variable. This variable is typically set in the `.profile`
    file and is set to another file, usually in the $HOME directory. Some users prefer
    to call this file `.kshrc` or `.envfile`. To use such a file, place a line like
    this in your `.profile` file:


    ```

    ENV= ~/.kshrc

    ```


    Such a file typically contains shell variables, alias definitions, and function
    definitions. This file will be referred to as `.kshrc` for the remainder of this
    document.


    Creating your own login script is not mandatory as the system login script for
    your shell provides a basic environment. Your system administrator may have created
    a local login script that you can modify with a text editor.


    When you are new to the system, you may want to use the default environment established
    for you. However, as you become more familiar with the system, you may want to
    create or modify your own login script.


    Table 7-6 lists the system login and local login scripts for each operating system
    shell. All scripts for a given shell run whenever you log in to your'
  merge: -1
  img_proc: true
