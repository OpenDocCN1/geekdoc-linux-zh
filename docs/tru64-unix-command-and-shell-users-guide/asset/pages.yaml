- pgno: 149
  md: '# 7.7 Using Variables


    All operating system shells use environment and shell variables to define user
    environment characteristics. As part of the set-up process, your system administrator
    has provided default environment and shell variable values in the appropriate
    login scripts.


    For most users, the default environment and shell variable values are sufficient.
    As you become more familiar with the system, however, you may want to modify some
    values. For example, you may want to reset the variable that defines your shell
    prompt so that it is more personalized. You also may want to set a shell variable
    that specifies a very long directory pathname so that you can save time keying
    commands that use the directory (see the examples in Section 7.7.1). You also
    may find setting variables useful when writing shell procedures. You will find
    that you may use variables creatively to enhance your work environment.


    Some environment variables may be reset and some are read-only and cannot be reset.
    That is, these variables can be used, but not modified. For more information on
    this topic, see the appropriate shell reference page; sh(1b), sh(1p), csh(1),
    or ksh(1).


    To reset environment variables as well as define your own shell variables, do
    one of the following:


    +   - Edit the appropriate local login script if you want these values set for
    you whenever you log in. For more information, see Section 7.6.

    +   - Set the environment variables on the command line if you want these values
    set only for the current login session.


    At any time, you may reference the value of any variable as well as display its
    value. You also may clear the value of any variable.


    # 7.7.1 Setting Variables


    The following sections describe how to set, reference, display, and clear variable
    values.


    # 7.7.1.1 Bourne, Korn, and Posix Shell Variables


    In the Bourne, Korn, and POSIX shells, you set variables with an assignment statement.
    The general format for setting variables is the following:


    ```

    `name = value`

    ```


    The name entry specifies the variable name. The value entry specifies the value
    assigned to the variable. Be sure you do not enter spaces on the command line.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "If you want to make the shell variable available to subshells, enter the export\
    \ command:\n\n**export** _name_\n\nWhen you export a shell variable, it becomes\
    \ an environment variable.\n\nWith the Bourne shell, two statements are required.\
    \ The Korn and POSIX shells allow the two statements to be combined into one command,\
    \ as follows:\n\n**export** _name_ = _value_\n\nFor example, you can create a\
    \ variable called _place_ by assigning it a value of U. S. A. with the following\
    \ statement:\n\n```\n```sh\n$ place='U. S. A.'\n$ \n```\n```\n\nFrom then on,\
    \ you can use the variable _place_ just as you would use its value.\n\nFor a more\
    \ useful example, assume that you are using the Bourne shell and that you temporarily\
    \ want to personalize your shell prompt. The default Bourne shell prompt is a\
    \ dollar sign ($) set by the _PS1_ environment variable. To set it to What Shall\
    \ I Do Next?   >, enter the following command:\n\n```\n```sh\n$ PS1='What Shall\
    \ I Do Next? >'\nWhat Shall I Do Next? >\n```\n```\n\nIf you want to make the\
    \ shell prompt available to subshells, enter the following command:\n\n```\n```sh\n\
    $ export PS1\n```\n```\n\nThis What Shall I Do Next?   > prompt will be in effect\
    \ throughout your session. If you want to make the new prompt more permanent,\
    \ enter the same assignment statement and the export command in your `.profile`\
    \ file.\n\nAs another example, to save keying time you want to define a variable\
    \ for a long pathname that you use often. To define the variable `reports` for\
    \ the directory `/usr/sales/shoes/women/retail/reports`, enter the following:\n\
    \n```\n```sh\n$ reports=/usr/sales/shoes/women/retail/reports\n```\n```\n\nTo\
    \ reference the variable after setting it, enter a dollar sign ($) before the\
    \ variable name. For more information on referencing variables, see Section 7.7.2.\n\
    \nYou now can use the variable _reports_ in any commands you enter during this\
    \ session. If you want to make this variable permanent, enter the same assignment\
    \ statement in your `.profile` file."
