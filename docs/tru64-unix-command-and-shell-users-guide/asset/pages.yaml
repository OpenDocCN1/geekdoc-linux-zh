  md: 'Example 12–1 shows how user alice on local host earth logs on to remote host
    moon, and uses ftp subcommands to check the current working directory, list its
    contents, copy a binary file, and end the session.


    # Example 12–1: Using ftp to Copy a File


    ```

    earth% ftp moon

    Connected to moon

    220 moon FTP server (Version . . .) ready

    Name (moon:alice): Return

    Password:

    230 User alice logged in

    ftp> binary

    200 Type set to I

    ftp> pwd

    257 "/alice" is current directory

    ftp> ls -l

    200 PORT command successful.

    150 Opening data connection for /bin/ls (192.9.200.1,1026) (0 bytes)

    total 2


    -rw-r--r--  1 alice  system   101 Jun  5 10:03 file1


    -rw-r--r--  1 alice  system   171 Jun  5 10:03 file2


    -rw-r--r--  1 alice  system  1201 Jun  5 10:03 sales

    ftp> get sales

    200 PORT command successful.

    150 Opening data connection for sales (192.9.200.1,1029) (1201 bytes)

    226 Transfer complete.

    local: sales remote: newsales

    ftp> quit

    221 Goodbye.

    earth%

    ```


    +   1. User alice enters the ftp command at the prompt of local host, earth to
    begin an ftp session with remote host, moon.

    +   2. A message verifying the connection is displayed on the local host.

    +   3. User alice presses Return at the prompt because her login name is the same
    on the remote host.

    +   4. At the Password: prompt, user alice enters a valid password that is not
    displayed.

    +   5. The login to the remote host is verified and the ftp> prompt appears, establishing
    the ftp session with the remote host.

    +   6. User alice enters the binary subcommand at the ftp> prompt to set the file
    transfer type to binary and FTP verifies it with the message `200 Type set to
    I.`

    +   7. User alice enters the pwd subcommand to identify the current working directory,
    and FTP verifies it with the message `u/alice is current directory.`'
