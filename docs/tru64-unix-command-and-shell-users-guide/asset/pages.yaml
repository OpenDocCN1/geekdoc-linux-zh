    To move up the directory structure more than one level, you can use a series of
    relative directory names, as shown in the following example. The response to the
    following pwd command, the slash (/) entry, represents the root directory.


    ```

    ```shell

    $ cd ../../

    $ pwd

    /

    $

    ```

    ```


    In the Korn or POSIX shell and the C shell you may use a tilde (~) to specify
    a user''s login directory. For example, to specify your own login directory, use
    the tilde alone as follows:


    ```

    ```shell

    $ cd ~

    ```

    ```


    The above tilde notation does not save you keystrokes because in all operating
    systems you may get the same results by merely entering cd from any place in the
    file system.


    However, if you want to access a directory below your login directory, tilde notation
    can save you keystrokes. For example, to access the reports directory from anywhere
    in the file system, enter the following:


    ```

    ```shell

    $ cd ~/reports

    ```

    ```


    Tilde notation is also very useful when you want to access a file or directory
    either in or below another user''s login directory. You may not know the precise
    location of that user''s login directory, but assuming you have the appropriate
    permissions, you could get there with a minimum of keystrokes.'
