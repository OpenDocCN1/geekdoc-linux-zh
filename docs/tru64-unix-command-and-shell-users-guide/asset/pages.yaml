    amy     console/        Jun  4 14:41

    Tue Jun  4 14:42:51 CDT 1999

    /u/amy

    $

    ```

    ```


    If any one command fails, the others still execute.


    To make the command line easier to read, separate commands from the semicolon
    (`;`) with blanks or tabs. The shell ignores blanks and tabs used in this way.


    # 7.4.1.2 Running Commands Conditionally


    When you connect commands with two ampersands (`&&`) or vertical bars (`||`),
    the shell runs the first command and then runs the remaining commands only under
    the following conditions:


    +   - `&&`: The shell runs the next command only if the current command completes
    (a command indicates successful completion when it returns a value of zero).

    +   - `||`: The shell runs the next command only if the current command does not
    complete.


    The syntax for the two-ampersand (`&&`) operator follows:'
