    \n# 11.6.1 Creating Mail Aliases\n\nYou can use the alias command in mailx to\
    \ create alternate names for users or user groups.\n\n> Note\n> The mailx alias\
    \ is not the same alias command used by the shell: you cannot use it to modify\
    \ mail commands.\n\nTo define a permanent mail alias, enter the alias command\
    \ in the .mailrc file, specifying the alias name and one or more login names.\
    \ The following .mailrc file defines two aliases:\n\n```\nalias sue susannah\n\
    alias wombats tom, jeff, craig, jim, ken\n```\n\nThe first alias defines the name\
    \ sue to mean user susannah. This enables you to send mail to susannah by using\
