    +   - The POSIX shell (sh)


    This shell conforms to the IEEE POSIX standard. It is very similar to the Korn
    shell. In this book, the discussion of the Korn shell and the POSIX shell are
    combined. See the sh(1) and the standards(5) reference pages for information on
    this standard.


    The POSIX shell is another designator for the Korn shell.


    # 7.2.1 More Information on C and Korn or POSIX Shell Features


    The C shell and the Korn or POSIX shells offer the following interactive features:


    +   - Command history


    The command history buffer stores the commands you enter and lets you display
    them at any time. As a result, you can select a previous command, or parts of
    previous commands, and then reexecute them. This feature may save you time because
    it lets you reuse long commands instead of retyping them. In the C shell, this
    feature requires some setup in the .cshrc file; in the Korn and POSIX shells this
    feature is automatically provided.


    +   - Command aliases


    The command aliases feature lets you abbreviate long command lines or rename commands.
    You do this by creating aliases for long command lines that you frequently use.
    For example, assume that you often need to move to the directory /usr/chang/reports/status.
    You could create an alias status that could move you to that directory whenever
    you enter status on the command line. In addition, aliases let you make up more
    descriptive names for operating system commands. For example, you could define
    an alias named rename for the mv command.


    +   - File name completion


    In the C shell, the file name completion feature saves typing by allowing you
    to enter a portion of the file name. When you press the Escape key, the shell
    will complete the file name for you. See Section 8.2.4 for more information about
    file name completion in the C shell.


    In the Korn or POSIX shell, you can ask the shell to display a list of file names
    that match the partial name you entered. You then may choose'
