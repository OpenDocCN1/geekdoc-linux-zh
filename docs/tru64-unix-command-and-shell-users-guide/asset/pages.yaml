    This command displays a single question mark (?) character.


    # 7.4.4.2 Using Single Quotes ('' '')


    When you enclose a string of characters in single quotes, the shell takes every
    character in the string (except the '' itself) literally. Single quotes are useful
    when you do not want the shell to interpret:


    +   - Reserved characters such as the dollar sign ($), the grave accent (`), and
    the backslash (\ )

    +   - Variable names


    The following example shows how single quotes are used when you want to display
    a variable name without having it being interpreted by the shell:


    ```

    $ echo ''The value of $USER is'' $USER

    The value of $USER is amy

    $

    ```


    The echo command displays the variable name $USER when it appears within single
    quotes, but interprets the value of $USER when it appears outside the single quotes.


    For information on variable assignments, see Section 7.7.1.


    # 7.4.4.3 Using Double Quotes (" ")


    Double quotes (" ") provide a special form of quoting. Within double quotes, the
    reserved characters dollar sign ($), grave accent (`), and backslash (\ ) keep
    their special meanings. The shell takes literally all other characters within
    the double quotes. Double quotes are most frequently used in variable assignments.


    The following example shows how double quotes are used when you want to display
    brackets (usually reserved characters) in a message containing the value of the
    shell variable:


    ```

    echo "<<Current shell is $SHELL>>"

    <<Current shell is /usr/bin/csh>>

    $

    ```


    For information on variable assignments, see Section 7.7.1.


    # 7.5 The Shell Environment


    Whenever you log in, your default shell defines and maintains a unique working
    environment for you. Your environment defines such characteristics as your user
    identity, where you are working on the system, and what commands you are running.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Your working environment is defined by both environment variables and shell
    variables. Your default login shell uses environment variables and passes them
    to all processes and subshells that you create. Shell variables are valid only
    for your current shell and are not passed to subshells.


    The following sections discuss the shell environment, how it is configured, and
    how you can tailor it.


    # 7.5.1 The login Program


    Whenever you log in, the login program is run. This program actually begins your
    login session using data stored in the /etc/passwd file, which contains one line
    of information about each system user. The /etc/password file contains your user
    name, your password (in encrypted form), your home directory, and your default
    shell. For more information on the /etc/passwd file, see Chapter 5.


    The login program runs after you enter your user name at the login: prompt. It
    performs the following functions:


    +   - Displays the Password: prompt (if you have a password).

    +   - Verifies the user name and password you entered against what is contained
    in the /etc/passwd file.

    +   - Assigns default values to the shell environment.

    +   - Starts running the shell process.

    +   - Runs system login scripts and your personal login scripts. See Section 7.6
    for more information.


    # 7.5.2 Environment Variables


    Your shell environment defines and maintains a unique working environment for
    you. Most of the characteristics of your working environment are defined by environment
    variables.


    Environment variables consist of a name and a value. For example, the environment
    variable for your login directory is named HOME, and its value is defined automatically
    when you log in.


    Some environment variables are set by the login program, and some can be defined
    in the login script that is appropriate for your shell. For example, if you use
    the C shell, environment variables typically will be set in the .cshrc login script.
    For more information on login scripts, see Section 7.6.


    Table 7-5 lists selected environment variables that can be used by all operating
    system shells. Most of the values of these variables are set during the login
    process, and are then passed to each process that you create during your session.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Table 7–5: Selected Shell Environment Variables


    | Environment Variable | Description |

    |---|---|

    | `HOME` | Specifies the name of your login directory, the directory that becomes
    the current directory upon completion of a login. The `cd` command uses the value
    of `HOME` as its default value. The login program sets this variable, and it cannot
    be changed by the individual user. |

    | `LOGNAME` | Specifies your login name. |

    | `MAIL` | Specifies the pathname of the file used by the mail system to detect
    the arrival of new mail. The login program sets this variable based upon your
    user name. |

    | `PATH` | Specifies the directories and the directory order that your system
    uses to search for, find, and execute commands. This variable is set by your login
    scripts. |

    | `SHELL` | Specifies your default shell. This variable is set by `login` using
    the shell specified in your entry in the `/etc/passwd` file. |

    | `TERM` | Specifies the type of terminal you are using. This variable usually
    is set by your login script. |

    | `TZ` | Specifies the current time zone and difference from Greenwich mean time.
    This variable is set by the system login script. |

    | `LANG` | Specifies the locale of your system, which is comprised of three parts:
    language, territory, and character code set. The default value is the C locale,
    which implies English for language, U.S. for territory, and ASCII for code set.
    `LANG` can be set in a login script. |

    | `LC_COLLATE` | Specifies the collating sequence to use when sorting names and
    when character ranges occur in patterns. The default value is the ASCII collating
    sequence. The `LC_COLLATE` variable can be set in a login script. |

    | `LC_CTYPE` | Specifies the character classification rules used in the ctype
    functions for the current locale. The default value is the classification for
    ASCII characters. The `LC_TYPE` variable can be set in a login script. |

    | `LC_MESSAGES` | Specifies the language used for yes/no prompts. The default
    value is American English, but your system may specify another language. |

    | `LC_MONETARY` | Specifies the monetary format for your system. The default value
    is the American format for monetary figures. The `LC_MONETARY` variable can be
    set in a login script. |'
  merge: -1
