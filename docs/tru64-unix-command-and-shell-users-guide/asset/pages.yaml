- pgno: 326
  md: '# Using Internationalization Features


    This appendix describes the internationalization features of the operating system.
    These features let users process data and interact with the system in a manner
    appropriate to their native language, customs, and geographic region (their locale).


    After reading this appendix, you will be able to do the following:


    +   - Understand the concept of locale

    +   - Understand what functions are affected by locale

    +   - Determine whether a locale has been set (if necessary)

    +   - Set your locale (if necessary)

    +   - Change your locale or aspects of your locale (if necessary)


    If your site is in the United States and you plan to use the American English
    language and its conventions, there is no need to set a locale because the system
    default is American English.


    If your site is outside the United States, the locale will most likely have already
    been specified by the system administrator. If the locale has already been set,
    you may want to only skim this appendix for background information on internationalization.
    If the locale has not been set, the information in this appendix is essential
    to you.


    # C.1 Understanding Locale


    Because Tru64 UNIX is an internationalized operating system, it can present information
    in a variety of ways. Users tell the operating system how to process and present
    information in a way appropriate for their language, country, and cultural customs
    by specifying a locale. See Section C.4 for information about how to specify a
    locale.


    A locale generally consists of three parts: language, territory, and codeset.
    All three are important for specifying how information is processed and displayed:


    +   - Language specifies the native language (for example, German, French, English).'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - Territory specifies the geographic area (for example, Germany, France,
    Great Britain).

    +   - Codeset specifies the coded character set that is used for the locale (for
    example, ISO 8859/1, the ISO Latin-1 codeset).


    At this point, some background information about codesets may be helpful.


    The ASCII codeset has traditionally been used on UNIX systems to express American
    English. Each letter of the English alphabet (A to Z, a to z) as well as digits,
    control characters, and symbols are uniquely identified using only 7 of the 8
    bits in a standard byte. However, the introduction of new codesets or expansion
    of old ones has been necessary to include non-English characters. Because so many
    programs rely on ASCII characters in one way or another, the most commonly used
    codesets begin with ASCII and build from there.


    By using all 8 bits of a standard byte, a single codeset can uniquely identify
    characters in several alphabetic languages. The most popular codesets are a series
    called ISO 8859. The first in the series is called ISO 8859/1, the second is ISO
    8859/2, and so on through ISO 8859/10. The ISO 8859/1 codeset, often called Latin-1,
    supports English and other Western European languages.


    To identify all ideographic symbols in Asian languages, such as Chinese and Japanese,
    character encoding requires more than one byte. Numerous codesets using multibyte
    character encoding, which is not supported by the ISO 8859 series of codesets,
    have been developed for Asian languages.


    The Unicode and ISO/IEC 10646 standards specify the Universal Character Set (UCS),
    a character set that allows characters to be processed for all languages, including
    Asian languages, by the same set of rules. The UCS-4 encoding format, based on
    32-bit values, is gaining in popularity as the codeset of choice for locales,
    because it can support almost all languages and is used on Windows NT as well
    as UNIX systems.


    # C.2 How Locale Affects Processing and Display of Data


    As previously mentioned, the locale specified on your system influences how information
    is processed and displayed. Specifically, locale affects how the software:


    +   - Collates (sorts) data

    +   - Formats date and time expressions

    +   - Formats monetary and other numeric expressions'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   - Displays messages

    +   - Prompts for yes/no responses


    The following sections describe the items in this list.


    # C.2.1 Collation


    Collation is the action of arranging elements of a set into a particular order.
    Collation always follows a set of rules. Some languages require collation rules
    that are not used in English.


    +   - Multilevel


    Some languages include groups of characters that all sort to the same primary
    location. Additional sort rules apply to order characters within the same group.
    For example, the French characters a, á, â, and à; all sort to the same primary
    location. Words that begin with these characters collate the same location, at
    which point words are sorted within the group. These words are in correct French
    order:


    a

    á

    abord

    àpre

    après

    âpreté

    azur


    +   - One-to-two character mapping


    In some languages, certain single characters are treated as if they were two characters.
    For example, the German sharp s (ß) is sorted as if it were "ss".


    +   - Multiple-to-one character mapping


    Some languages treat a string of characters as if it were a single element. For
    example, the Spanish ch and ll sequences are treated as unique characters in the
    traditional Spanish alphabet. The following words are in correct Spanish order:


    canto

    construir

    curioso

    chapa

    chocolate

    dama


    +   - Ignored characters'
  merge: -1
  img_proc: true
- pgno: 329
  md: "Some collation rules ignore certain characters. For example, if the hyphen\
    \ (-) is defined as a character to be ignored, the strings `re-locate` and `relocate`\
    \ sort to the same position.\n\n> **Note**\n> \n> This means that you cannot assume\
    \ that the range (A to Z, a to z) includes every letter of an alphabet. For example,\
    \ the Danish alphabet includes three characters that sort after z.\n\n# C.2.2\
    \ Date and Time Formats\n\nUsers around the world express dates and times with\
    \ different formatting conventions. When specifying day and month names, people\
    \ in the United States generally express dates with an expression like the following\
    \ one:\n\n```\nTuesday, May 22, 1996\n```\n\nThe French, on the other hand, express\
    \ dates this way:\n\n```\nmardi, 22 mai 1996\n```\n\nThe following examples show\
    \ alternative formats for the date, March 20, 1996. A given format is not the\
    \ only way to write the date in the listed country:\n\n+   - `3/20/96` (United\
    \ States)\n+   - `20/3/96` (Great Britain)\n+   - `20.3.96` (France and Germany)\n\
    +   - `20-III-96` (Italy)\n+   - `96/3/20` (Japan)\n+   - `2/3/20` (Japan, Emperor\
    \ format)\n\nIn Japan’s Emperor format, the year (2, in the preceding example)\
    \ is expressed as the number of years that the current emperor has reigned.\n\n\
    As with dates, there are many conventions for expressing the time of day. In the\
    \ United States, people often use the 12-hour clock with its a.m. and p.m. designations.\
    \ People in most other countries use the 24-hour clock to express the time."
