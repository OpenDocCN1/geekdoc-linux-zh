- pgno: 166
  md: "# 8.2.3 Command History\n\nThe command history buffer stores the commands you\
    \ enter and lets you display them at any time. As a result, you can select a previous\
    \ command, or parts of previous commands, and then reexecute them. This feature\
    \ may save you time because it lets you reuse long commands instead of reentering\
    \ them.\n\nYou may want to enter the following three commands in your `.cshrc`\
    \ file:\n\n+   - `set history=n`\n+   \n+     Creates a history buffer that stores\
    \ the command lines you enter. The *n* entry specifies the number of command lines\
    \ you want to store in the history buffer.\n\n+   - `set savehist=n`\n+   \n+\
    \     Saves the command lines you entered during the current login session and\
    \ makes them available for the next login session. The *n* entry specifies the\
    \ number of command lines you want to store in the history buffer when you log\
    \ out.\n\n+   - `set prompt=[\\!]`\n+   \n+     Causes your C shell prompt to\
    \ display the number of each command line.\n\nTo see the contents of the history\
    \ buffer, use the `history` command. The displayed output will be similar to the\
    \ following (your output will vary):\n\n```\n[18] % history\n3 set history=15\n\
    4 pwd\n5 cd /usr/sales\n6 ls -l\n7 cp report report5\n8 mv /usr/accounts/new .\n\
    9 cd /usr/accounts/new\n10 mkdir june\n11 cd june\n12 mv /usr/accounts/new/june\
    \ .\n13 ls -l\n14 cd /usr/sales/Q1\n15 vi earnings\n16 cd /usr/chang\n17 vi status\n\
    18 history\n[19] %\n```\n\nTo reexecute any command in the command history buffer,\
    \ use the commands listed in Table 8-5. Each command starts with an exclamation\
    \ point (!), which tells the C shell that you are using commands in the history\
