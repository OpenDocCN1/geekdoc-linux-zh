- pgno: 160
  md: '# Shell Features


    This chapter functions as a reference source for C shell and Bourne, Korn, or
    POSIX shell features. Unlike other chapters of this guide that present conceptual
    or tutorial information, or both, the purpose of this chapter is to provide very
    brief reference information about each shell.


    To get the most out this chapter, you already should be familiar with the introductory
    shell overview information in Chapter 7.


    After completing this chapter, you should be able to:


    +   - Understand the main differences between operating system shells

    +   - Understand specific features of each operating system shell

    +   - Understand the specifics of local login scripts for each shell


    # 8.1 Comparison of C, Bourne, Korn, and POSIX Shell Features


    Table 8-1 compares selected features of the C shell and the Bourne, Korn, and
    POSIX shells.


    | Feature | Description | C | Bourne | Korn or POSIX |

    |---|---|---|---|---|

    | Shell programming | A programming language that includes features such as loops,
    condition statements, and variables. | Yes | Yes | Yes |

    | Signal trapping | Mechanisms for trapping interruptions and other signals sent
    by the operating system. | Yes | Yes | Yes |

    | Restricted shells | A security feature that provides a controlled shell environment
    with limited features. | No | Yes | No |

    | Command aliases | A feature that lets you abbreviate long command lines or to
    rename commands. | Yes | No | Yes |

    | Command history | A feature that stores commands and lets you edit and reuse
    them. | Yes | No | Yes |'
  merge: -1
  img_proc: true
- pgno: 161
  md: '**Table 8–1: C, Bourne, Korn, and POSIX Shell Features (cont.)**


    | Feature | Description | C | Bourne | Korn or POSIX |

    |---|---|---|---|---|

    | File name completion | A feature that lets you enter a portion of a file name
    and the system automatically completes it or suggests a list of possible choices.
    | Yes | No | Yes |

    | Command line editing | A feature that lets you edit a current or previously
    entered command line. | Yes | No | Yes |

    | Array | The ability to group data and call it by a name. | Yes | No | Yes |

    | Integer arithmetic | The ability to perform arithmetic functions within the
    shell. | Yes | No | Yes |

    | Job control | Facilities for monitoring and accessing background processes.
    | Yes | No | Yes |


    For detailed information on shell features, see the appropriate shell reference
    pages sh(1b), sh(1p), csh(1), or ksh(1).


    # ## 8.2 C Shell Features


    This section describes the following C shell features:


    +   - Sample .cshrc and .login scripts

    +   - Metacharacters

    +   - Command history and aliases

    +   - Built-in variables and commands


    # ### 8.2.1 Sample .cshrc and .login Scripts


    The .cshrc login script sets up your C shell environment by defining variables
    and operating parameters for the local shell process. The .login script defines
    variables and operating parameters that you want executed at the beginning of
    your session, and that you want to be valid for all shell processes during the
    current login session.


    When you log in, the operating system executes the .cshrc file in your home directory
    first, and the .login file second. The .login script is executed only when you
    log in. However, the .cshrc file is executed each time you create a subshell.


    In the following .cshrc script, shell variables, command aliases, and command
    history variables are set. Table 8–2 explains each part of the script.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "```\n# Set shell variables\nset noclobber\nset ignoreeof\nset notify\n\n# Set\
    \ command aliases\nalias h 'history \\!* | more'\nalias l 'ls -l'\nalias c clear\n\
    \n# Set history variables\nset history=40\nset savehist=40\n\n# Set prompt\nset\
    \ prompt = \"!\" $ \n```\n\n# Table 8-2: Example .cshrc Script\n\n| Command |\
    \ Description |\n|---|---|\n| Shell Variables | |\n| set noclobber | Stops files\
    \ from being overwritten. If set, places restrictions on output redirection >\
    \ to ensure that files are not accidentally destroyed, and that >> redirections\
    \ refer to existing files. |\n| set ignoreeof | Specifies that you cannot use\
    \ Ctrl/D to end your login session. Instead, you must use either the exit or the\
    \ logout commands. |\n| set notify | Informs you when background processes have\
    \ completed. |\n| Command Aliases | |\n| alias h 'history \\!* | more' | Defines\
    \ the contents of the command history buffer through the more command. The \\\
    !* string specifies that all the history buffer should be piped. |\n| alias l\
    \ 'ls -l' | Defines a short name, l, for the ls -l command that lists directory\
    \ files in the long format. |\n| alias c clear | Defines a short name, c, for\
    \ the clear command that clears your screen. |\n| History Variables | |\n| history=40\
    \ | Instructs the shell to store the last 40 commands in the history buffer. |"
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Table 8-2: Example .cshrc Script (cont.)


    | Command | Description |

    |---|---|

    | savehist=40 | Instructs the shell to store the last 40 commands and use them
    as the starting history for the next login session. |

    | Prompt Variable | |

    | set prompt = "\! $ " | Changes your prompt so that it tells you the command
    number of the current command. |


    In the following .login script, the permissions for file creation are set, the
    PATH environment variable is set, and the editor and printer are specified. Table
    8-3 explains each part of the script.


    ```

    # Set file creation permissions

    umask 027


    # Set environment variables

    set path=/usr/bin:/usr/local/bin:

    set cdpath=.:..:$HOME

    setenv EDITOR emacs

    setenv MAILHOST boston

    setenv PRINTER sales

    ```


    # Table 8-3: Example .login Script


    | Command | Description |

    |---|---|

    | File Permissions | |

    | umask 027 | Specifies the permissions to be subtracted from the default permissions
    set by the creating program for all new files created. The umask value is subtracted
    from 777 (for executable programs) or from 666. For an executable program, a umask
    value of 027 results in all permissions for the owner, read and execute permissions
    for members of the same group, and no permissions for all others. |

    | Environment Variables | |

    | set path \ /usr/bin:/usr/lo- cal/bin: | Specifies the search path. In this case,
    /usr/bin is searched first, and /usr/local/bin is searched second. |

    | set cdpath=.:..:$HOME | The cdpath variable sets the search path for the cd
    command. This variable assignment specifies that the cd command should search
    for the named directory in the current directory (.) first, in the parent directory
    (..) second, and the home directory ($HOME) third. |'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Table 8-3: Example .login Script (cont.)


    | Command | Description |

    |---|---|

    | setenv EDITOR emacs | Specifies the emacs editor as the default editor when
    running a program that lets you edit a file. For example, various mail programs
    let you use an editor to compose and edit messages. |

    | setenv MAILHOST boston | Specifies boston as your mail handling system. |

    | setenv PRINTER sales | Specifies the printer sales as your default printer.
    |


    # 8.2.2 Metacharacters


    Table 8-4 describes C shell metacharacters (characters that have special meaning
    to the shell). The meaning of these metacharacters are grouped by interpretation
    when they appear in a shell script, in a Filename specification, when used to
    quote other characters, in an Input/Output specification, or when used to indicate
    variable substitution.


    # Table 8-4: C Shell Metacharacters


    | Metacharacter | Description |

    |---|---|

    | Syntactic | |

    | : | Separates commands that should be executed sequentially. |

    | | | Separates commands that are part of a pipeline. |

    | && | Runs the next command if the current command succeeds. |

    | || | Runs the next command if the current command fails. |

    | ( ) | Groups commands to run as a separate process in a subshell. |

    | & | Runs commands in the background. |

    | File Name | |

    | / | Separates the parts of a file''s pathname. |

    | ? | Matches any single character except a leading dot (.). |

    | * | Matches any sequence of characters except a leading dot (.). |

    | [ ] | Matches any of the enclosed characters. |'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Table 8–4: C Shell Metacharacters (cont.)


    | Metacharacter | Description |

    |---|---|

    | `~` | Specifies a home directory when used at the beginning of pathnames. |


    **Quotation**


    | Metacharacter | Description |

    |---|---|

    | `''...''` | Specifies that any of the enclosed characters should be interpreted
    literally; that is, without their special meaning to the shell. |

    | `"..."` | Provides a special form of quoting. Specifies that the `$` (dollar
    sign), `''` (grave accent), and `\` (backslash) characters keep their special
    meaning, while all other enclosed characters are interpreted literally; that is,
    without their special meaning to the shell. Double quotes are useful in making
    variable assignments. |


    **Input/Output**


    | Metacharacter | Description |

    |---|---|

    | `<` | Redirects input. |

    | `>` | Redirects output to a specified file. |

    | `<<` | Redirects input and specifies that the shell should read input up to
    a specified line. |

    | `>>` | Redirects output and specifies that the shell should add output to the
    end of a file. |

    | `>&` | Redirects both diagnostic and standard output and appends them to a file.
    |

    | `>>&` | Redirects both diagnostic and standard output to the end of an existing
    file. |

    | `>!` | Redirects output and specifies that if the `noclobber` variable is set
    (prevents overwriting of files), it should be ignored so that the file can be
    overwritten. |


    **Substitution**


    | Metacharacter | Description |

    |---|---|

    | `$` | Specifies variable substitution. |

    | `!` | Specifies history substitution. |

    | `^` | Precedes substitution modifiers. |

    | `:̂` | Used in special kinds of history substitution. |

    | `` ` `` | Specifies command substitution. |'
  merge: -1
