    # B.4 Displaying and Changing the Current Line


    The ed program is a line editor. This means that ed lets you work with the contents
    of the buffer one line at a time. The line you can work with at any given time
    is called the current line, and it is represented by the dot (.). To work with
    different parts of a file, you must change the current line.


    To display the current line, enter the following subcommand:


    ```

    p

    ```


    To display the line number of the current line, enter the following subcommand:


    ```

    .

    =

    ```


    Note


    > You cannot use the Cursor Up and Cursor Down keys to change the current line.
    To change the current line, use the ed subcommands described in the following
    sections.


    To change your position in the buffer, do one of the following. These steps are
    described in detail in the following sections.'
