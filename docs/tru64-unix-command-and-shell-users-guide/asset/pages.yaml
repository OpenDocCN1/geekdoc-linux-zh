    ```


    From the results of the ruptime command using the -a and -l options (in the preceding
    example), you can determine that both hosts have nearly the same number of users,
    but the current usage on host travel is calculated from only the 7 (from a total
    of 32) users whose sessions have been active in the last hour. By contrast, usage
    on host jackal is less, but is calculated from 26 of the total of 29 users. You
    could conclude that, over a period of time, usage on host travel may increase
    as more users become active, but that usage on host jackal may either decrease
    or stay nearly the same, because most of its users are currently active.


    The remaining options (except for -r) sort by different output fields, and in
    descending alphabetical order. To reverse this order, put the -r option after
    the other option on the command line. You should not combine other ruptime command
    options; if you do, only the last option on the command line will be used. Table
    10–2 describes each option.


    **Table 10–2: Options to the ruptime Command**


    | Option | Description |

    |---|---|

    | `-a` | Provides information for all users, including those whose sessions have
    been idle for an hour or longer |

    | `-l` | Sorts output by load average over 5-, 10-, and 15-minute intervals |

    | `-r` | Reverses the sort order |

    | `-t` | Sorts output by length of time host is on line |

    | `-u` | Sorts output by number of users |


    For more information, see the `runtime(1)` reference page.


    # 10.4 Obtaining Information About Users on Remote Hosts


    Before using a command that sends a message or transfers a file, you often need
    to know if the recipient user is logged in. To determine whether a user is logged
    in to a remote host on the local network, you can use the `rwho` command, specifying
    the name of one or more users. The rwho command operates only for hosts running
    the rwhod daemon. See your system administrator if necessary.'
