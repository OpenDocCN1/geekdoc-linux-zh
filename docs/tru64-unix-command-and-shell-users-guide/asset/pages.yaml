- pgno: 246
  md: '# The UUCP Networking Commands


    This chapter describes the UNIX-to-UNIX Copy Program (UUCP). Using UUCP enables
    you to:


    +   - Perform tasks on a remote host

    +   - Transfer files between a local and remote host

    +   - Work in background mode

    +   - Switch back and forth between the local and remote host, performing tasks
    on either or both, concurrently


    For additional information on UUCP, see the uucp_intro(7) reference page. For
    an overview of UUCP system management and tasks, see Network Administration.


    With UUCP, you can connect over a hardwired asynchronous line, a network, or a
    telephone line (using modems at both ends) to:


    +   - Another workstation

    +   - Another computer running a UNIX based operating system

    +   - A computer running an operating system that is not UNIX based (this requires
    certain hardware and software)


    # 14.1 UUCP Pathname Conventions


    UUCP pathnames follow the same conventions as the operating system with the following
    exceptions:


    +   - Relative pathnames may not work with all UUCP commands. If not, reenter
    the command and use the full pathname.

    +   - On hosts that support UUCP, the /usr/spool/uucppublic directory is set up
    for transferring data among other hosts. The brief form of this directory is ~uucp.

    +   - The pathname for a file on a remote host requires an exclamation point,
    (!) after the host name. For example, sea!/research/new specifies the file new
    in the directory /research on host sea.

    +   - Sometimes to specify a file, you must provide the names of the remote hosts
    along the network path. To do so in the Bourne, Korn, or POSIX shell, put an exclamation
    point (!) after each host name. For example,'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'gem!car!sea!/research/cells specifies the file cells in directory /research
    on host sea, which is reachable through host car; car is reachable through host
    gem. In the C shell, the exclamation point (!) will be mistranslated unless you
    precede it with a backslash (\), for example:


    gem!\car!\sea!/research/cells


    # 14.2 Finding Hosts that Support UUCP


    To communicate with a remote host by using UUCP commands from your local host,
    you must determine which other hosts support the UUCP protocol. The UUCP uuname
    utility displays a list of all hosts with which you can communicate using UUCP
    from your local host. The following example shows the uuname command with output.


    ```

    % uuname

    elvis

    fab4

    Y107

    ```


    This example shows that three remote hosts are accessible to the local host through
    UUCP. To identify the local host, use the -l option to the uuname command. For
    example:


    ```

    % uuname -l

    music

    ```


    By using UUCP commands among compatible hosts, a user on host music can send to
    or receive files from hosts elvis, fab4, or Y107.


    For more information, refer to the uuname(1) reference page.


    # 14.3 Connecting to a Remote Host


    Before you can use UUCP commands, you must connect your local host to the remote
    host. There are three commands you can use to connect to a remote host:


    +   - The cu and tip commands establish a full-duplex connection, giving the appearance
    of being directly logged in to the remote host. This connection enables the simultaneous
    transfer of data between the hosts.


    +   - The ct command establishes a remote connection by letting you dial an attached
    terminal and log in through a modem and telephone line.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Note


    A remote connection is subject to the security features on the local and remote
    host. See your system administrator for more information.


    # 14.3.1 Using cu to Connect to a Remote Host


    The cu command and its options enable you to connect to a remote host, log in
    to it, and perform tasks there from your local host. You can perform tasks on
    each host by switching back and forth between the two. If both hosts use the operating
    system, you can enter commands on the remote host from your local host.


    # 14.3.1.1 Using cu to Connect by Name to a Remote Host


    The following steps show how to use the cu command to connect from local host
    earth to remote host moon, log in to moon, and enter a command there:


    +   1. Enter the following cu command at the local system prompt; a message verifies
    the connection:

    +   ```

    +   earth% cu moon

    +   Connected

    +   ```

    +   The login prompt for the remote host will be displayed.

    +   When connecting to some remote hosts, you may need to press the Return key
    several times before a login prompt is displayed.


    +   2. Log in to host moon at the login prompt. The system prompt for host moon
    is displayed.


    +   3. Enter any command that host moon supports. For example, to list the contents
    of the /usr/geog/crater/earthside directory, enter the following command at the
    system prompt:

    +   ```

    +   moon% ls /usr/geog/crater/earthside

    +   copernicus.dat

    +   tycho.dat

    +   moon%

    +   ```


    # Note


    The preceding example may not work for all cu connections. It is used here as
    a brief, general example. See your system administrator for more information.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'After logging in to the remote host, you can switch back and forth between
    it and the local host because they run concurrently. To return to your local host
    and enter a command there, type a tilde and an exclamation point (~!) followed
    directly by the command, or wait for the local host prompt to display and then
    enter the command. To return to the remote host, press Ctrl/D.


    # 14.3.1.2 Using cu to Specify a Directly-Connected Remote Host


    To connect to a directly-connected remote host, use the cu command with the -l
    option to name the hardwired line that connects the two computers. Most of these
    communication lines have names that are variations of the standard device name,
    tty.


    To use the cu command with the -l option to connect to a remote host with an unknown
    name, but which uses hardwired device ttyd0, enter the following command:


    ```

    earth% cu -l ttyd0

    Connected

    ```


    After the connection is made, you can log in to and execute commands on remote
    host moon. Refer to the steps in Section 14.3.1.1.


    To return to the local host, type a tilde and an exclamation point (~!) followed
    directly by the command or wait for the local system prompt to display before
    entering the command. To return to the remote host, press Ctrl/D.


    # Note


    > If you use the -l option, but still enter the name of a remote host, no error
    message will be generated. Instead, cu will try to connect to the first available
    line for the requested host name, ignoring the specified line. If it makes the
    connection, it may not be the one you intend.


    # 14.3.1.3 Using cu to Connect by Telephone to a Remote Host


    You can use cu to connect by telephone to a remote host whenever the remote host
    has not been set up to communicate with the local host through UUCP. To do so,
    the following conditions must be met:


    +   - Both the local and the remote host are connected to modems.

    +   - You know the telephone number of the remote modem and have a valid login
    on that host.


    The following example shows how to use the cu command to connect to a remote host
    that has a long-distance telephone number of 1-612-555-6789.'
  merge: -1
  img_proc: true
