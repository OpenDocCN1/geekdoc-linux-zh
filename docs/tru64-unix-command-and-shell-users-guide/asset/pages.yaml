- pgno: 94
  md: '# Controlling Access to Your Files and Directories


    This chapter shows you how to control access to your system as well as your files
    and directories. After reading this chapter, you will be able to:


    +   - Understand password, group, and system security issues

    +   - Understand file and directory permissions

    +   - Display and set file and directory permissions

    +   - Change owners and groups

    +   - Change your identity to access files

    +   - Understand superuser concepts

    +   - Find information about enhancements to security that may be installed on
    your system


    A good way to learn about the topics in this chapter is to do the examples so
    that the information on your screen is consistent with the information in this
    book.


    Before you can work through the examples, you must be logged in and your login
    directory should contain:


    +   - The files file1, file2, file3, record1, and record6

    +   - The subdirectory reports that contains the file1, file2, file3, and notes
    files and the subdirectory newstatus

    +   - The project subdirectory that contains the files file1, file2, file3, and
    notes as well as the subdirectory status


    If you are using files with different names, make the appropriate substitutions
    as you work through the examples.


    # 5.1 Understanding Password and Group Security Files


    Before a user can log in successfully, the user must be made known to the system
    by the creation of a user account. Adding a user account is a routine but critical
    activity that is usually performed by the system administrator.


    When a user account is created, information about the new user is added to the
    following two files:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '/etc/passwd　　 This file contains individual user information for all users
    of the system.


    /etc/group　　 This file contains group information for all groups on the system.


    These files define who can use the system and each user’s access rights. In addition,
    all other system security controls depend upon password and group security. The
    following sections describe the `/etc/passwd` and `/etc/group` files.


    # 5.1.1 The /etc/passwd File


    The `/etc/passwd` file contains records that define login accounts and attributes
    for all system users. This file can be altered only by a user with **superuser**
    privileges. See Section 5.7 for more information.


    Each record in the `/etc/passwd` file defines a login account for an individual
    user. The fields are separated by colons and the last field ends with a newline
    character. The following text shows the format of an `/etc/passwd` file entry
    and describes the meaning of each field:


    ```

    username:password:UID:GID:gecos:login_directory:login_shell

    ```


    +   - **username** — Your login name.

    +   - **password** — Your password stored in encrypted form. Encryption prevents
    unauthorized users or programs from discovering your actual password. If no password
    has been specified for a user, this field will be blank.

    +   - **UID** — (User ID) A unique number identifying you to the system.

    +   - **GID** — (Group ID) A number identifying your default group. You can belong
    to one or more groups.

    +   - **gecos** — This field usually contains general information about you, stored
    in some installation specific format. Historically, this is a comma separated
    list of the following:

    +     - **name** — Your full name'
