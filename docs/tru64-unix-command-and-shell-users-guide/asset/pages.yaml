    # 11.3 Receiving a Mail Message


    When you receive a mail message, you have the following options:


    +   - Delete or read any message waiting for you.

    +   - Reply to the sender and any other recipients to whom the mail was sent.

    +   - Save the message in a file.

    +   - Organize the message by topic in a file of saved messages called a folder.


    The mailx program notifies you if you have new mail when you log in, enter any
    operating system command, or press the Return key. You can also enter the mailx
    command at the system prompt to see if you have new mail.


    In Example 11-3 user Jones on host orange enters mailx and finds two messages
    waiting.


    # Example 11-3: Entering the mailx Environment


    ```

    orange$ mailx

    Mail SRevision: 1.1.4.7 $ Type ? for help.

    "/usr/spool/mail/jones": 2 messages 1 new 1 unread

    U 1 root Mon Jul 20 10:39 14/438 "System news"

    >N 2 root Mon Jul 20 11:30 11/292 "Welcome"

    ?

    ```


    In this example, two messages are waiting from the system administrator (root);
    one is unread (denoted by U in column 1) from a previous mailx session and the
    other is new (denoted by N). The question-mark (?) at the end of the message is
    the mailx prompt. You can type another question-mark at this prompt to display
    a list of available mailx commands, as indicated in the header and as described
    in Section 11.4.'
  merge: -1
  img_proc: true
