  md: '# Example 13-1: Using the telnet Command (cont.)


    15 The q subcommand is entered to quit the Telnet session from the telnet: subcommand
    prompt. Pressing Ctrl/D could also have been used.


    16 The local telnet utility closes the connection.


    You can enter the telnet command without any arguments to access the telnet subcommand
    mode, indicated by the telnet> prompt.


    The telnet subcommands are described in Table 13-1. Before entering a subcommand,
    you must enter the escape sequence, Ctrl/]. This sequence notifies the telnet
    program that the following information is not text; otherwise, telnet would interpret
    subcommands as text.


    For each subcommand, you only need to type enough letters to uniquely identify
    the command. For example, q is sufficient for the quit command. For a complete
    list of telnet subcommands, see the telnet(1) reference page.


    # Table 13-1: The telnet Subcommands


    | Subcommand | Description |

    |---|---|

    | ? [subcommand] | Displays help information. If a subcommand is specified, information
    about that subcommand is displayed. |

    | close | Closes the connection and returns to telnet command mode. |

    | displa [argument] | Displays all of the set and toggle values if no argument
    is specified; otherwise, lists only those values that match argument. |

    | open host [port] | Opens a connection to the specified host. The host specification
    can be either a host name or an Internet address in dotted decimal form. If no
    port is given, telnet attempts to contact a telnet server at the default port.
    |

    | quit | Closes a connection and exits the telnet program. Pressing a Ctrl/D in
    command mode also closes the connection and exits. |

    | status | Shows the status of telnet, including the current mode and the currently
    connected remote host. |

    | z | Opens a shell on the local host as specified by the SHELL environment variable.
    When you exit the shell by pressing Ctrl/D, telnet returns to the remote session.
    |'
  merge: -1
  img_proc: true
