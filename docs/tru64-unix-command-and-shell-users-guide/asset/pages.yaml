    file before you leave the ed program.


    The q subcommand returns you to the shell prompt ($).


    If you have changed the buffer but have not saved a copy of its contents, the
    q subcommand responds with ?, an error message. At that point, you can either
    save a copy of the buffer with the w subcommand, or enter q again to leave the
    ed program without saving a copy of the buffer.


    # B.3 Loading Files into the Edit Buffer


    Before you can edit a file, you must load it into the edit buffer. You can load
    a file either at the time you start the ed program or while the program is running.


    To load a file into the edit buffer when you start the ed program, enter the following
    command:


    ```

    ed filename

    ```


    This command starts ed and loads the filename file into the edit buffer.


    To load a file into the edit buffer while ed is running, you can enter one of
    the following commands:


    +   - e filename

    +     This loads the filename file into the buffer, erasing any previous contents
    of the buffer.


    +   - nr filename'
