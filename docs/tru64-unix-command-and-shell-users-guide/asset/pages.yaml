- pgno: 239
  md: 'To copy a directory recursively from a remote host to your local host, follow
    the rcp syntax statement shown below. The command syntax is the same as copying
    a directory recursively from a local to a remote host with the exception that
    localdirectory is the destination file, so it is placed last on the command line:


    ```

    rcp -r hostname:directory localdirectory

    ```


    # 12.3 Copying Files Between Two Remote Hosts


    From your local host, rcp can copy a file on one remote host to a file on another
    remote host. To do this, use the following rcp syntax:


    ```

    rcp remhost1:filesend remhost2:file-recv

    ```


    The remhost1 variable identifies the remote host containing the file you want
    to send, followed by a colon (:) and the file, filesend that you want to send.
    The last part of the statement identifies the second remote host, remhost2, and
    the file name, file-recv, to which the file from remhost1 will be copied. If only
    a directory name is given in file-recv (as in the example below), filesend will
    be copied there with the same file name.


    The following example uses rcp to copy the file spark from the directory /u/cave/fred
    on remote host flint to the directory /u/hut/barney on remote host stone:


    ```

    % rcp flint:/u/cave/fred/spark stone:/u/hut/barney

    ```'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Working on a Remote Host


    The chapter explains how to use commands which enable you to:


    +   - Log in to a remote host from your local terminal.


    +   - Execute a specified command at a remote host.


    +   - Log in to a remote host using the Telnet protocol. If rlogin is not supported,
    use telnet as an alternative.


    > Note

    > Any remote login is subject to the security features on the remote host. If
    you have difficulty logging in to a remote host, see your system administrator.


    Before using any of these commands you might need to know the correct host name
    or whether a remote host is currently reachable. Use the finger, who, rwho, uptime,
    and ping commands, described in Chapter 10 to find this information.


    # 13.1 Using rlogin to Log in to a Remote Host


    You can log in to a remote host with rlogin, using the following command syntax:


    ```

    rlogin [-user] host_name

    ```


    The -l option enables you to specify a remote user name other than your local
    user name. The host_name variable specifies the remote host.


    The following steps show how to log in to a remote host boston where the login
    name is the same as that on the local host:


    +   1. Enter the following rlogin command followed by the name of the remote host.
    For example:


    ```

    $ rlogin boston

    ```


    Password:


    +   2. Enter your password.


    When the system prompt is displayed, you are logged in to the remote host and
    can enter any command.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '3. Press Ctrl/D to close the connection and return to your local host.


    If you have an account on a remote host where your login name is different from
    that on the local host, you should use the -l option to log in to the remote host,
    as shown in the following steps.


    +   1. Enter the rlogin -l command followed by the remote login name and the name
    of the remote host. For example:


    ```

    % rlogin -l celtic boston

    Password:

    ```


    +   2. Enter the password corresponding to the login name, celtic.

    +   When the system prompt is displayed, you are logged in to the remote host
    and can enter any command.


    +   3. Press Ctrl/D to close the connection and return to your local host.


    In the following situations, rlogin will not prompt for a password:


    +   - If your local host is listed in the /etc/hosts.equiv file on the remote
    host

    +   - If the name of your host (and optionally, your user name) is listed in the
    .rhosts file in your home directory on the remote host


    For more information on rlogin, see the rlogin(1) reference page.


    # 13.2 Using rsh to Run Commands on a Remote Host


    The rsh command enables you to run a single command on a remote UNIX based host
    without logging in there. If you need to run several commands successively, you
    must log in to the remote host using either rlogin or telnet.


    The rsh command has the following syntax:


    ```

    rsh [-l user] host_name command

    ```


    The -l option enables you to log in to a remote host where your login name, user,
    is different from that on the local host. If you do not specify the -l option,
    rsh assumes that your login name is the same on both the local and remote hosts.
    The host_name variable specifies the name of the remote host. The command variable
    specifies the command you want to run.


    Note


    If you do not specify a command to run remotely, rsh prompts you for login information
    to the remote host.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'To use rsh, one of the following must be true:


    +   - Your local host is listed in the /etc/hosts.equiv file on the remote host.

    +   - Your host is listed in the .rhosts file in your home directory on the remote
    host.


    In the following example, rsh appends a file located on a remote host to a file
    on the local host. The remote file, remfile2, on host remhost2 is appended to
    a local file called locfile:


    ```

    % rsh remhost2 cat remfile2 >> locfile

    ```


    # 13.3 Using telnet to Log in to a Remote Host


    You can log in to a remote host by using the telnet command, which implements
    the Telnet protocol.


    Using telnet you can:


    +   - Log in to a remote host

    +   - Execute any operating system command on the remote host

    +   - Enter telnet subcommands (see Table 13-1) for managing the remote session


    The telnet command has the following syntax:


    ```

    telnet [host_name[port]]

    ```


    The host_name variable specifies the remote host. If you omit the host name, you
    can use the open subcommand to create a connection after you activate the Telnet
    utility. Example 13-1 shows how to use the telnet command to log in to a remote
    host named star, use the telnet subcommand status, and close the connection.


    If you do not specify a port, the Telnet protocol attempts to contact a Telnet
    server at the default port.'
  merge: -1
  img_proc: true
