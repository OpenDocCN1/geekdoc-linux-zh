  md: 'For example, assume that you have previously defined the variable sales for
    the long pathname /user/reports/q1/march/sales, and that you want to use this
    variable with the cd command. To do so, enter the cd command with the sales variable:


    ```

    $ cd $sales

    $

    ```


    Then, enter the pwd command to verify that the directory is changed:


    ```

    $ pwd

    /user/reports/q1/march/sales

    $

    ```


    In this example, the shell substitutes the actual pathname of the directory /user/reports/q1/march/sales
    for the variable name sales.


    # 7.7.3 Displaying the Values of Variables


    You can display the value of any variable currently set in your shell. Variable
    values can be displayed either singly or as a group.


    To display the value of a single variable, use the echo command in the following
    general format:


    ```

    echo $variable

    ```


    The variable entry identifies the variable you want to display.


    For example, assume that you use the Korn shell and want to display the value
    of the SHELL environment variable. To do so, enter the following command:


    ```

    $ echo $$SHELL

    /usr/bin/ksh

    $

    ```


    For the Bourne, Korn, and POSIX shells, to display the value of all currently
    set variables, use the set command without any options. For example, the following
    example lists the currently set values in the Bourne shell (your output will vary):


    ```

    $ set

    EDITOR=emacs

    HOME=/users/chang

    LOGNAME=chang

    MAIL=/usr/mail/chang

    PATH=:/usr/bin:/usr/bin/X11

    PS1=$

    SHELL=/usr/bin/sh

    TERM=xterm

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'For the C shell, to display the value of all currently set shell variables,
    use the set command without any options. To display the value of all currently
    set environment variables, use the setenv command or the printenv command without
    any options.


    # 7.7.4 Clearing the Values of Variables


    You may remove the value of most any current variable. Please note, however, that
    the following variables cannot be cleared:


    +   - PATH

    +   - PS1 (Bourne, Korn, and POSIX shells)

    +   - PS2 (Bourne, Korn, and POSIX shells)

    +   - MAILCHECK (Bourne, Korn, and POSIX shells)

    +   - IFS (Bourne, Korn, and POSIX shells)


    For more information on these variables, see the appropriate shell reference pages:
    sh(1b), sh(1p), csh(1), or ksh(1).


    In the Bourne, Korn, and POSIX shells, you can clear both environment and shell
    variables with the unset command. The format of the unset command is:


    ```

    unset name

    ```


    The name entry specifies the variable name.


    In the C shell, you clear environment variables with the unsetenv command. The
    format of the unsetenv command is:


    ```

    unsetenv name

    ```


    The name entry specifies the variable name.


    You clear shell variables with the unset command. The format of the unset command
    is:


    ```

    unset name

    ```


    The name entry specifies the variable name.


    For an example, assume that you use the Korn shell and have created a variable
    called place and have assigned it a value of U. S. A.. To clear the variable,
    enter the following:


    ```

    $ unset place

    $

    ```


    For more detailed information about setting and referencing variables, see the
    appropriate shell reference page.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 7.8 How the Shell Finds Commands


    Every time you enter a command, your shell searches through a list of directories
    to find the command. This list of directories is specified by the PATH environment
    variable.


    At many installations, system administrators specify default PATH directories
    for new users. However, more experienced users may need to change these PATH directories.


    The PATH variable contains a list of directories to search, separated by colons
    (:). The order in which the directories are listed is the search order that the
    shell uses to search for the commands that you enter.


    To determine the value of PATH, use the echo command. For example, assume that
    you are using the C shell and have entered the following:


    ```

    % echo $PATH

    /usr/bin:/usr/bin/X11

    %

    ```


    This output from the echo command (your output may vary) tells you that the search
    order of the preceding example is the following:


    +   - The /usr/bin directory is searched first.

    +   - The /usr/bin/X11 directory is searched second.


    Typically, PATH is set as an environment variable in the appropriate login script.
    In the Bourne, Korn, and POSIX shells, the PATH variable usually is set in the
    .profile script. In the C shell, it usually is set in the .login script.


    If you want to change the search path, you can assign a new value to the PATH
    variable. For example, assume that you use the Bourne shell and that you have
    decided to use your own versions of some operating system commands. As a result,
    you want to add $HOME/usr/bin/ to the search path. To do so, enter the following
    on the command line if you want the new PATH variable value to be in effect for
    the current login session:


    ```

    $ export PATH=$HOME/usr/bin:/usr/bin:/usr/bin/X11

    $

    ```


    If you want this new PATH variable value to be in effect for all future sessions,
    modify the PATH variable in your .profile script. When you next log in, the changes
    you have made in your .profile script will take effect.


    # 7.9 Using Logout Scripts


    You can create a logout script that automatically runs every time you end your
    session. Just like login scripts, the .logout file must reside in your home directory.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'You can use logout scripts for the following purposes:


    +   - To clear your screen

    +   - To display a logout message

    +   - To run long background processes after you log out

    +   - To run a file cleanup routine


    To create a logout script, do the following:


    +   1. Create a file called `.logout` in your home directory with a text editor.

    +   2. Place the commands you want in the file. See Section 1.2 for ideas.

    +   3. Save the text and exit the editor.

    +   4. Enter the following command to ensure that the `.logout` file has the appropriate
    executable permissions:


    ```

    ```sh

    $ chmod u+x .logout

    $

    ```

    ```


    Using a `.logout` file is not mandatory; it is a convenience that may enhance
    your work environment.


    # 7.9.1  Logout Scripts and the Shell


    If you are using the C shell, the `.logout` script executes automatically when
    you log out.


    If you are using the Korn or POSIX shell and want to use a logout script, you
    must ensure that a special trap is set in your `.profile` script. A **trap** is
    a command sequence that looks for a specified signal from a terminal, and then
    runs a specified command or set of commands.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'If the following line is not set in your `.profile` script, you must add it
    with a text editor:


    ```

    trap $HOME/.logout 0

    ```


    This statement tells your system to run the `.logout` script whenever it receives
    a zero (0) signal, which occurs automatically when you log out.


    # 7.9.2 A Sample .logout File


    The following example `.logout` file does the following:


    +   - Clears the screen

    +   - Displays a logout message that provides the name of your system, your user
    name, and the logout time

    +   - Displays a parting message

    +   - Runs a file cleanup routine in the background after you log out


    Lines beginning with the number sign (#) are comment lines that describe the commands
    below them.


    ```

    # Clear the screen

    clear


    # Display the name of your system, your user name,

    # and the time and date that you logged out

    echo `hostname` : `whoami` logged out on `date`


    # Run the find command in the background. This command

    # searches your login directory hierarchy for all

    # temporary files that have not been accessed in

    # 7 days, and then deletes them.

    find ~ -name ''*.tmp'' -atime +7 -exec rm {} \; &


    # A parting message

    echo "Good Day. Come Back Soon"

    ```


    # 7.10 Using Shell Procedures (Scripts)


    In addition to running commands from the command line, the shell can read and
    run commands contained in a file. Such a file is called a **shell procedure**
    or **shell script**.


    Shell procedures are easy to develop, and using them can help you work more efficiently.
    For example, you may find shell procedures useful because you can place frequently
    used commands in one file, and then execute them by entering only the name of
    the procedure. As a result, they are useful for doing repetitious tasks that would
    usually require entering many commands on the command line.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Because shell procedures are text files that do not have to be compiled, they
    are easy to create and to maintain.


    Each shell has its own native programming language. The following are some programming
    language features that apply to all shells:


    +   - Storing values in variables

    +   - Testing for predefined conditions

    +   - Executing commands repeatedly

    +   - Passing arguments to a program


    For more information on specific programming features of your shell, see Chapter
    8.


    # 7.10.1 Writing and Running Shell Procedures


    To write and run a shell procedure, do the following:


    +   1. Create a file of the commands you need to accomplish a task. Create this
    file as you would any text file: with vi or another editing program. The file
    can contain any system command or shell command (described in the sh(1b), sh(1p),
    csh(1), or ksh(1) reference pages).

    +   2. Use the chmod +x command to give the file x (execute) status. For example,
    the command chmod g+x reserve gives execute status to the file named reserve for
    any user in your group (g). See Chapter 5 for information on using the chmod command.

    +   3. Run the procedure by entering its name. Enter the pathname if the procedure
    file is not in your current directory.


    The following example shows a simple shell procedure named lss that sorts ls -l
    command output by file size:


    ```

    #! /usr/bin/csh

    # lss: sort and list

    ls -l | sort -n +4

    ```


    Table 7-7 describes each line in lss.


    Table 7-7: Description of Example Shell Script

    | Shell Command | Description |

    |---|---|

    | #! /usr/bin/csh | Specifies the shell where the shell procedure should run.ª
    |'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Table 7-7: Description of Example Shell Script (cont.)


    | Shell Command | Description |

    |---|---|

    | #lss: list and sort | Comment line that describes the purpose of the shell procedure.
    |

    | ls -l | sort -n +4 | These are the commands in the shell procedure. This procedure
    lists the files in a directory (ls -l). Output from the ls -l command is then
    piped to the sort command ( sort -n +4). This command skips over the first four
    columns of the ls -l output, sorts the fifth column (the file size column) numerically,
    and writes the lines to the standard output. |


    a See Section 7.10.2 for more information.


    To run the lss procedure, enter lss. Sample system output looks similar to the
    following:


    ```

    $ lss

    -rw-rw-rw- 1 larry system 65 Mar 13 14:46 file3

    -rw-rw-rw- 1 larry system 75 Mar 13 14:45 file2

    -rw-rw-rw- 1 larry system 101 Mar 13 14:44 file1

    $

    ```


    # 7.10.2 Specifying a Run Shell


    At times, you may want to specify the shell where a shell procedure should run.
    This is because of possible syntactic differences between the shells, but is especially
    true of differences between the C shell and the other shells.


    By default, the operating system assumes that any shell procedure you run should
    be executed in the same shell as your login shell. For example, if your login
    shell is the Korn shell, by default your shell procedures will run in that same
    shell.


    The ability to override the default is very useful for shell procedures that many
    users run because it ensures that the procedure executes in the correct shell,
    regardless of the user''s login shell. To change this default run shell, include
    the following command as the first line of the shell procedure:


    ```

    #!shell_path

    ```


    The shell_path entry specifies the full pathname of shell where you want the procedure
    to run.'
  merge: -1
  img_proc: true
