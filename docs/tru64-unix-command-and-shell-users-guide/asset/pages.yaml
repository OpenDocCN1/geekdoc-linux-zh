    # 5.5.1 Setting the umask


    You may activate the umask command in two ways:


    +   - Include the umask command in your login script. This is the most common
    and efficient way to specify your user mask because the specified value is set
    automatically for you whenever you log in. For a discussion of login scripts,
    see Chapter 7. For examples of umask commands in login scripts, see Chapter 8.

    +   - Enter the umask command at the shell prompt during a login session. The
    user mask value you set is in effect for that login session only.


    For a more detailed example of how the user mask works in restricting permissions
    for files you create with a text editor, follow the steps in this procedure:


    +   1. Enter the following command to find out what the current value of your
    user mask is:


    ```

    $ umask

    ```


    If the user mask value is 000, there are no restrictions on the permissions established
    by file-creating programs. Go to step 3.


    If the user mask value is set, write it down. Go to step 2.


    +   2. Set the user mask value to 000 so that there will be no restrictions on
    the permissions established by file-creating programs. Before resetting the user
    mask, make sure you have written down the current value in case you need to reset
    it.


    Enter the following command:


    ```

    $ umask 000

    ```'
