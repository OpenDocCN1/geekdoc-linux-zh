- pgno: 334
  md: '# Table C-2: Environment Variables That Influence Locale Functions


    | Variable | Description |

    |---|---|

    | LC_COLLATE | Specifies the collating sequence to use when sorting strings and
    when character ranges occur in patterns. |

    | LC_CTYPE | Specifies the character classification (codeset) information. |

    | LC_MONETARY | Specifies monetary formats. |

    | LC_NUMERIC | Specifies numeric formats. |

    | LC_MESSAGES | Specifies the language in which messages will appear if translations
    are available. In addition, this variable specifies strings for affirmative and
    negative responses. |

    | LC_TIME | Specifies date and time formats. |

    | LC_ALL | Overrides all preceding variables and the LANG environment variable.
    |


    As is true for the LANG variable, all of the variables in Table C-2 can be assigned
    locale names. Consider the case where your company is located in the United States
    but the prevalent language spoken by employees is Spanish. The LANG environment
    variable could be set to the name of a Spanish language locale and the LC_NUMERIC
    and LC_MONETARY variables set to the name of a United States English locale. The
    explicit setting of the LC_NUMERIC and LC_MONETARY variables overrides what they
    were implicitly set to by LANG. The LC_CTYPE, LC_MESSAGES, LC_TIME, and LC_COLLATE
    variables would still be implicitly set to the Spanish locale. The following are
    the variable assignments for the C shell to implement this example:


    ```

    setenv LANG es_ES.ISO8859-1

    setenv LC_NUMERIC en_US.ISO8859-1

    setenv LC_MONETARY en_US.ISO8859-1

    ```


    The following are the same variable assignments for the Bourne, Korn, and POSIX
    shells:


    ```

    LANG=es_ES.ISO8859-1

    export LANG

    LC_NUMERIC=en_US.ISO8859-1

    export LC_NUMERIC

    LC_MONETARY=en_US.ISO8859-1

    export LC_MONETARY

    ```


    Sometimes different versions of the same locale are available locally to meet
    the needs of certain languages or software applications. The names of such locales
    end with the at sign (@) plus a modifier field. For example, the collating sequence
    used for the telephone book in some languages is different from the collating
    sequence used for dictionaries. If the standard locale for a language defined
    the dictionary collating sequence, another'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'version of the locale might exist to support the telephone book collating sequence.
    In this case the alternative locale version might have a name like en_FR.ISO8859-1@phone.


    # C.4.2 Limitations of Locale Settings


    The ability to set locale lets you tailor your environment, but it does not protect
    you from making mistakes. The following sections discuss problems that can arise
    when you define locale variables.


    # C.4.2.1 Locale Settings Are Not Validated


    There is nothing to prevent you from defining implausible combinations of locale
    names for different aspects of a locale. For example, you could set the LANG environment
    variable to a French locale and the LC_CTYPE variable to a Norwegian locale. The
    results would probably be undesirable; for example, French message translations
    would likely contain characters not specified in the Norwegian locale. If you
    define locale variables in addition to LANG, you are responsible for ensuring
    a valid combination of locale settings.


    # C.4.2.2 File Data Is Not Bound to a Locale


    The system has no way of knowing what locale was set when a file was created.
    Therefore, the system cannot prevent you from processing the file''s data using
    a different locale. For example, suppose you copy to your system a file that was
    created when the LANG variable was set to a German locale. If, on your system,
    LANG is set to a French locale and you use the grep command to search for a string
    in the file, the grep command will use French collation and pattern matching rules
    on the German data. It is therefore your responsibility to know what kind of language
    data a file contains and to set the locale accordingly.


    # C.4.2.3 Setting LC_ALL Overrides All Other Locale Variables


    The LC_ALL variable overrides all other locale-dependent environment variables,
    even if you set it before setting category-specific variables, such as LC_COLLATE.
    The only way to cancel the influence of LC_ALL is to undefine the variable. For
    example, in the C shell, enter the command unsetenv LC_ALL.


    The LC_ALL variable is available for users familiar with the System V environment.
    In that environment, users set locale either by setting LC_ALL or by setting all
    the locale category variables individually.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Customizing Your mailx Session


    You can customize your mailx session permanently by including in your .mailrc
    file any of the settings described in Table D-1. See the unset command in Appendix
    F for information about temporary settings.


    # Table D-1: Variables for Customizing Your mailx Session


    | Variable | Type | Description |

    |---|---|---|

    | allnet | Binary | Treats all network names with the same login name the same.
    |

    | append | Binary | Saves messages in your mbox file in the order of arrival;
    the earliest message is the first message in the file. When this variable is unset,
    messages are saved in reverse order; the first message in the file is the most
    recent. The mailx program runs faster if append is set. |

    | ask | Binary | Prompts you for a subject line when you send a message. Enter
    a blank line to send a message with no subject. |

    | askcc | Binary | Prompts you for carbon-copy recipients for each message you
    send. |

    | autoprint | Binary | Automatically displays the next message when you delete
    the current message. When autoprint is unset, mailx does not display the next
    message when you delete a message. In either case, the next message becomes your
    new current message. |

    | bang | String | Enables the special-case treatment of the exclamation point
    (!) in escape command lines as in vi. |

    | cmd | String | Lets the user specify the default command to be used when using
    the vertical bar or pipe (|) command. |

    | conv | String | Lets the user specify how to convert UUCP style addresses for
    sendmail. |'
