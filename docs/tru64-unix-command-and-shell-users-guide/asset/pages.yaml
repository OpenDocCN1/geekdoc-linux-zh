    # 14.3.2.2 Using tip to Connect by Telephone to a Remote Host


    You can use the tip command to connect by telephone to a remote host if the following
    conditions are met:


    +   - Both the local and the remote host are connected to modems.


    +   - You know the telephone number of the remote modem or there is an entry for
    the remote host in /etc/remote.'
