    # 11.3.3.2 Saving a Message in a Folder


    To organize messages for easier reference and to minimize the size of the mbox
    file (which is a folder itself) you can save messages in files called folders.
    Before using a folder other than mbox, you must create a folder subdirectory in
    your home directory and add a pointer to the folder in your .mailrc file. For
    example, if you make a directory named sys-config in your home directory, you
    must add the following line to your .mailrc file:

    set folder=sys-config.


    To add a message to a folder, use the mailx command, s and the folder name. For
    example, to save a message about host configuration with other messages on that
    topic, write it to a folder named sys-config, as follows:'
