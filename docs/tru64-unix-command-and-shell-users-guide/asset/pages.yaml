    \  e <num>    Edit message <num> (default editor is e).\n  d {msg_list}  Delete\
    \ messages in <msg_list> or current message.\n  u {msg_list}  Recall deleted messages.\n\
    \  s {msg_list} <file>  Append messages (with headings) to <file>.\n  w {msg_list}\
    \ <file>  Append messages (text only) to <file>.\n  pre {msg_list}  Keep messages\
    \ in system mailbox.\nCreating New Mail:\n  m <addrlist>  Create/send new message\
    \ to addresses in <addrlist>.\n  r {msg_list}  Send reply to senders and recipients\
    \ of messages.\n  R {msg_list}  Send reply only to senders of messages.\n  a \
    \          Display list of aliases and their addresses.\n---------------------------\
    \ Mailbox Commands ---------------------------\n```\n\n# 11.5 Exiting Mail\n\n\
    There are three commands you can use to exit from mailx:\n\n+   - The q command\
    \ returns you to the shell prompt and saves in the mbox file in your home directory,\
    \ any messages you read but did not delete.\n\n+   - The x and exit commands are\
    \ the same. Each returns you to the shell prompt without changing your mailbox.\n\
    \n# 11.6 Customizing Mail Sessions\n\nWhen setting up an account for a new user,\
    \ the system manager defines certain mailx default settings in the /usr/share/lib/Mail.rc\
    \ file. As supplied by the operating system, this file contains the following\
    \ mailx settings, which a user can override:\n\n+   - The set ask setting activates\
