    \ ftp Subcommands for Connecting to a Host and Copying Files**\n\n| Subcommand\
    \ | Description |\n|---|---|\n| `account [password]` | Sends a supplemental password\
    \ that a remote host other than a host may require before granting access to its\
    \ resources. If the `password` is not specified, the user is prompted for it.\
