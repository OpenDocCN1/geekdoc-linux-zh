    To make substitutions, do one of the following:


    +   - To substitute *newstring* for *oldstring* at the first occurrence of *oldstring*
    in the current line, enter the following subcommand:

    +     `s/ oldstring / newstring /`


    +   - To substitute *newstring* for *oldstring* at the first occurrence of *oldstring*
    on line number *n*, enter the following subcommand:

    +     `n s/ oldstring / newstring /`


    +   - To substitute *newstring* for *oldstring* at the first occurrence of *oldstring*
    in each of the lines *n* through *m*, enter the following subcommand:

    +     `n,m s/ oldstring / newstring /`


    The following sections describe these methods of substitution in detail.


    # B.6.1 Substituting on the Current Line


    To make a substitution on the current line, first make sure that the line you
    want to change is the current line. In the following example, the /appending/
    (search) subcommand locates the line to be changed. Then the s/appending/adding
    text/p (substitute) subcommand substitutes the string "adding text" for the string
    "appending" on the current line. The p (print) subcommand displays the changed
    line.


    ```

    /appending/

    appending is to enter a

    s/appending/adding text/p

    adding text is to enter a

    -

    ```


    Note


    > For convenience, you can add the p (print) subcommand to the s subcommand (for
    example, s/appending/adding text/p). This saves you from having to enter a separate
    p subcommand to see the result of the substitution.


    The s subcommand changes only the first occurrence of the string on a given line.
    To learn how to change all occurrences of a string on the line, see Section B.6.4.'
