    # 8.3.3 Built-In Variables


    The Bourne shell provides variables that can be assigned values. The shell sets
    some of these variables, and you can set or reset all of them.


    Table 8-10 describes selected Bourne shell built-in variables that are of most
    interest to general users. For complete information on all Bourne shell built-in
    variables, see the sh(1) reference page.


    # Table 8-10: Bourne Shell Built-In Variables


    | Variable | Description |

    |---|---|

    | HOME | Specifies the name of your login directory, the directory that becomes
    the current directory upon completion of a login. The cd command uses the value
    of HOME as its default value. HOME is set by the login command. |

    | PATH | Specifies the directories through which your system should search to
    find and execute commands. The shell searches these directories in the order specified
    here. Usually, The PATH variable is set in the .profile file. |

    | CDPATH | Specifies the directories that the cd command will search to find the
    specified argument to cd. If the cd command argument is null, or if it begins
    with a slash (/), dot (.), or dot dot (..), then CDPATH is ignored. Usually, CDPATH
    is set in your .profile file. |

