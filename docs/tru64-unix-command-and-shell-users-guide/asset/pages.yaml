- pgno: 16
  md: '# About This Book


    The *Command and Shell User''s Guide* introduces users to the basic use of commands
    and shells in Compaq Tru64™ UNIX (formerly DIGITAL UNIX). This book also documents
    how to communicate with other network users.


    This preface covers the following topics:


    +   - Audience

    +   - New and Changed Features

    +   - Scope

    +   - Organization

    +   - Related Documents

    +   - Conventions


    # Audience


    This book is written for those who do not have extensive knowledge of UNIX compatible
    operating systems. This book explains important concepts, provides tutorials,
    and is organized according to task.


    # New and Changed Features


    The following features are new or changed in this book:


    +   - The POSIX shell facilities are included in the descriptions of shell capabilities.

    +   - The description of the `passwd` file is changed to include the general user
    information structure.

    +   - A revised description of login processing to reflect the use of the `.cshrc`
    file is provided.

    +   - The `gonext` variable is added to Table D-1.

    +   - The term i-number is replaced with file serial number to be consistent with
    the Single UNIX Specification.

    +   - The `ps` command examples are updated to be consistent with the Single UNIX
    Specification.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Scope\n\nThis book introduces you to the use of commands and shells. After\
    \ reading this book, you should be able to:\n\n+   - Gain access to your system\
    \ and issue commands\n+   - Understand file and directory concepts\n+   - Manage\
    \ files and directories\n+   - Control access to your files and directories\n\
    +   - Manage processes\n+   - Understand and manage your shell environment\n+\
    \   - Use the vi and ed text editors\n+   - Use network applications to communicate\
    \ with network users and access remote systems and processes\n\nThis book discusses\
    \ the entry and execution of commands from the command line. There are numerous\
    \ graphical user interfaces (GUIs) available to perform many of these functions,\
    \ or to perform additional tasks. See the users instructions that accompany your\
    \ window manager, the particular application, or your system administrator.\n\n\
    # Organization\n\nThis book is organized into 14 chapters and 6 appendices:\n\n\
    +   ### Chapter 1\n+   Shows how to log in and out of your system, enter commands,\
    \ set your password, and obtain online help.\n+   \n+   ### Chapter 2\n+   Provides\
    \ an overview of the file system, consisting of files and directories that are\
    \ used to store text, programs, and other data. This chapter also introduces you\
    \ to the vi text editor, a program that lets you create and modify files.\n+ \
    \  \n+   ### Chapter 3\n+   Shows how to manage files. You will learn how to list,\
    \ display, copy, move, link, and remove them.\n+   \n+   ### Chapter 4\n+   Explains\
    \ how to manage directories. You will learn how to create, change, display, copy,\
    \ rename, and remove them."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 5


    Shows how to control access to your files and directories by setting appropriate
    permissions. It also describes standard password and group security issues as
    well as provides an overview of additional security considerations.


    # Chapter 6


    Describes how the operating system creates and keeps track of processes. This
    chapter explains how to redirect process input, output, and error information,
    run processes simultaneously, display process information, and cancel processes.


    # Chapter 7


    Introduces features common to the shells available with the operating system:
    the C, Bourne, Korn, and POSIX shells. You learn how to change your shell, use
    command entry aids, understand some features of your shell environment (login
    scripts, environment and shell variables), set and clear variables, write logout
    scripts, and write and run basic shell procedures.


    # Chapter 8


    Provides detailed reference information about the C, Bourne, Korn, and POSIX shells,
    comparing their features. It details the commands and environment variables of
    each program and shows how to set up your login script.


    # Chapter 9


    Shows how to access the System V habitat, a subset of commands, subroutines, and
    system calls that conforms to the System V Interface Definition (SVID).


    # Chapter 10


    Provides information on how to get information about other users and remote hosts
    on the network.


    # Chapter 11


    Provides information about how to send a message to another user.


    # Chapter 12


    Provides information about how to copy files to or between remote hosts.


    # Chapter 13


    Provides information about how to log in to or execute commands at a remote host.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 14 Provides information about the UNIX-to-UNIX Copy Program (UUCP)
    for performing communication tasks concurrently on both a local and remote host.


    The appendices in this book provide the following information:


    Appendix A Teaches you how to use the basic features of the vi text editor.


    Appendix B Teaches you how to use the ed text editor. Detailed information about
    ed is provided because all systems have this editor, and ed can be used in critical
    system management situations when no other editor can be used.


    Appendix C Describes the internationalization features that allow users to process
    data and interact with the system in a manner appropriate to their native language,
    customs, and geographic region.


    Appendix D Provides a list of variables that can be used in the .mailrc file to
    customize a mailx session.


    Appendix E Provides a list of escape commands that can be used to perform certain
    tasks from within a mailx session.


    Appendix F Provides a list of commands that can be used to send, read, delete,
    or save messages using mailx.


    # Related Documents


    The following Tru64 UNIX user documents are available in HTML format on your CD-ROM
    and optionally in hardcopy:


    +   - Network Administration

    +   - Documentation Overview

    +   - Reference Pages Section 1

    +   - Reference Pages Sections 8 and 1m

    +   - Security

    +   - System Administration

    +   - Security'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - *ULTRIX to DIGITAL UNIX Migration Guide*

    +   - *Quick Reference Card*


    # Icons on Tru64 UNIX Printed Books


    The printed version of the Tru64 UNIX documentation uses letter icons on the spines
    of the books to help specific audiences quickly find the books that meet their
    needs. (You can order the printed documentation from Compaq.) The following list
    describes this convention:


    | Icon | Description |

    |---|---|

    | G | Books for general users |

    | S | Books for system and network administrators |

    | P | Books for programmers |

    | D | Books for device driver writers |

    | R | Books for reference page users |


    Some books in the documentation help meet the needs of several audiences. For
    example, the information in some system books is also used by programmers. Keep
    this in mind when searching for information on specific topics.


    The *Documentation Overview* provides information on all of the books in the Tru64
    UNIX documentation set.'
  merge: -1
  img_proc: true
