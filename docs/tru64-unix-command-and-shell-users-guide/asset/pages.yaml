- pgno: 209
  md: '# 11.2.1 Editing a Message


    To edit a mail message before sending it, after replying to the Subject: prompt,
    enter one of the following escape commands to activate an editor within mailx:


    +   - Enter ~v to activate the screen editor that you set with the set VISUAL
    entry in your .mailrc file.

    +   - Enter ~e to activate the text editor that you set with the set EDITOR entry
    in your .mailrc file.


    To use the ~e command from within mailx to activate a text editor, enter ~e as
    the first two characters on a new line — you may need to type the tilde (~) a
    few times before it is displayed. For example:


    ```

    Subject: network documentation meeting at 2 PM

    Everyone, please bring the Table of Contents

    for your book so that we can look for areas

    of overlapping subject matter and

    ~e

    ```


    If your .mailrc file contains set EDITOR=/usr/ucb/vi, you can now use the vi editor
    to correct the spelling mistake in the first line and finish writing the message.
    When you end the editing session, you are back in mailx. You can end the message
    and exit mailx or reinvoke vi and continue writing.


    # 11.2.2 Aborting a Message


    You may decide not to send a message that you have started. There are two ways
    to abort a message before sending it.


    # 11.2.2.1 Aborting a Message with Ctrl/C


    You can abort a mail message by pressing Ctrl/C twice, anywhere within a message.
    When you first press Ctrl/C, the following message is displayed:


    ```

    (Interrupt -- one more to kill letter)

    ```


    You can now reconsider your decision to abort the message. If you decide not to
    abort it, continue entering text. If you decide to abort the message, press Ctrl/C
    again, and the following message will be displayed:


    ```

    (Last Interrupt -- letter saved in dead.letter)

    ```


    The message is aborted, you exit mailx, and the system prompt is displayed.


    By default, the aborted message is saved in the dead.letter file in your home
    directory. If you choose not to save aborted messages, you can enter'
  merge: -1
  img_proc: true
