    # 5.6 Changing Your Identity to Access Files


    The su command lets you alter your identity during a login session. A reason for
    altering your identity is to be able to access files that you do not own. To protect
    system security, you should not assume another identity without the owner''s or
    the system administrator''s permission.


    The su command lets you log in to another user''s account only if you know that
    user''s password. The su command authenticates you and then resets both the process''s
    user ID and the effective user ID to the value of the newly'
