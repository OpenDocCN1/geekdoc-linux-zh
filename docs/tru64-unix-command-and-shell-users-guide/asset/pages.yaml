    # 3.5 Copying Files (cp)


    This section provides information about how to copy files on a local system. For
    information about copying files to and from remote systems, see Chapter 12 and
    Chapter 14.


    The cp (copy) command copies a file from one file name to another file name in
    your current directory or copies the file from one directory to another directory.


    The cp command is especially useful to make backup copies of important files.
    Because the backup and the original are two distinct files, you can'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'make changes to the original while still maintaining an unchanged copy in the
    backup file. This is helpful in case something happens to the original version.
    Also, if you decide you do not want to save your most recent changes to the original
    file, you can begin again with the backup file.


    Compare the cp command, which actually copies files, with the ln command, which
    creates multiple names for the same file. Section 3.4 explains the ln command
    in detail. Refer also to the cp(1) and ln(1) reference pages.


    The format of the cp command is:


    ```

    cp  source destination

    ```


    The source entry is the name of the file to be copied. The destination entry is
    the name of the file to which you want to copy source. The source and destination
    entries can be file names in your current directory or pathnames to different
    directories. This statement is true when you are copying files from one directory
    to another. To copy the contents of an entire directory to another directory (recursively,
    using the -r option), see Section 4.4.


    To copy files to a different directory, use the general format of the cp command.
    In this case, source is a series of one or more file names and destination is
    a pathname that ends with the name of the target directory. In the source entry
    you may also use pattern-matching characters.


    # 3.5.1 Copying Files in the Current Directory


    The cp command creates the destination file if it does not already exist. However,
    if a file with the same name as the destination file does exist, cp copies the
    source file over the existing destination file.


    # Caution


    If the destination file exists, your shell may allow the cp command to erase the
    contents of that file before it copies the source file. As a result, be certain
    that you do not need the contents of the destination file, or that you have a
    backup copy of the file, before you use it as the destination file for the cp
    command. If you use the C shell, see Table 8-6 for the noclobber variable that
    can be set to prevent the erasure of the destination file.


    In the following example, the destination file does not exist, so the cp command
    creates it. First, list the contents of your login directory:


    ```

    $ ls

    file1    file2    file3    project

    $

    ```'
