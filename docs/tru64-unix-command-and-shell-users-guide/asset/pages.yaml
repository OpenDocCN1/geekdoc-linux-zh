    # A.1 Getting Started


    This section shows you how to create a file with vi, save the file, move the cursor
    around in the file, add text, delete text, and modify text.


    # A.1.1 Creating a File


    To create the file, my.file, that will be used in the examples throughout this
    appendix, enter the vi command as shown below:


    ```

    $ vi my.file Return

    ```


    Your screen will look like this:


    ```

    ~

    ~

    ~

