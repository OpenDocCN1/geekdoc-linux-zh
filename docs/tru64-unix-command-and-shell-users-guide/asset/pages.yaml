  img_proc: true
- pgno: 133
  md: "In addition to interpreting commands, the shell also can be used as a programming\
    \ language. You can create shell procedures that contain commands. Shell procedures\
    \ are executed in the same way that you execute a program — on the command line\
    \ after the shell prompt.\n\nWhen you run a shell procedure, your current shell\
    \ creates or **spawns** a subshell. A subshell is a new shell your current shell\
    \ creates to run a program. Thus, any command the shell procedure executes (for\
    \ example, cd) leaves the invoking shell unaffected.\n\nShell procedures provide\
    \ a means of carrying out tedious commands, large or complicated sequences of\
    \ commands, and routine or repetitive tasks.\n\nSee Section 7.10 for more information\
    \ on shell programming.\n\n# 7.2 Summary of C, Bourne, Korn, and POSIX Shell Features\n\
    \nThe operating system provides the following shells that have both command execution\
    \ and programming capabilities:\n\n+   - The Bourne shell (sh)\n+   \n+     This\
    \ is a simple shell that is easily used in programming. It usually is represented\
    \ by a dollar sign ($) prompt. This shell does not provide either the interactive\
    \ features or the complex programming constructs (arrays and integer arithmetic)\
    \ of the C shell or the Korn and POSIX shells.\n+   \n+     The Bourne shell also\
    \ provides a restricted shell (Rsh). For more information, see Section 7.2.2.\n\
    \n+   - The C shell (csh)\n+   \n+     This shell is designed for interactive\
    \ use. It usually is represented by a percent sign (%) system prompt. The C shell\
    \ provides some features for entering commands interactively:\n+   \n+     - A\
    \ command history buffer\n+     - Command aliases\n+     - File name completion\n\
    +     - Command line editing\n+   \n+     For more information on these features,\
    \ see Section 7.2.1.\n\n+   - The Korn shell (ksh)\n+   \n+     This shell combines\
    \ the ease of use of the C shell and the ease of programming of the Bourne shell.\
    \ The system prompt is usually a dollar sign ($) prompt. The Korn shell provides\
    \ these features:\n+   \n+     - The interactive features of the C shell\n+  \
    \   - The simple programming syntax of the Bourne shell"
