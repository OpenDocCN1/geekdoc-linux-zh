    # A.3.4 Customizing Your Environment


    The ex editor provides two mechanisms for customizing your vi environment. You
    can use the :set command to set environment variables, and the :map command to
    map a key sequence to a vi command key.


    Environment variables are set either by assigning them as option or no option
    for Boolean variables, or by assigning them as option=value. The full set of environment
    variables is described in the ex(1) reference page. Table A-5 lists some common
    variables.


    # Table A-5: Selected vi Environment Variables


    | Variable | Description |

    |---|---|

    | errorbells | Specifies that when an error is made, a bell sounds. This is the
    default setting. |

    | ignorecase | Specifies that when performing searches, the case of characters
    should be ignored. The default variable setting is noignorecase. |

    | number | Specifies that line numbers are to be displayed at the left margin.
    The default variable setting is nonumber. |

    | showmatch | Specifies that when you enter a matching parenthesis or brace, the
    cursor moves to the matching character and then returns. The default variable
    setting is noshowmatch. |

    | tabstop | Specifies the amount of space between tab stops. The default setting
    is tabstop=8. |'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Table A–5: Selected vi Environment Variables (cont.)


    | Variable | Description |

    |---|---|

    | `wrapscan` | Specifies that searches should wrap around the beginning or end
    of the file. The default variable setting is wrapscan. |

    | `wrapmargin` | Creates an automatic right margin located a specified number
    of characters from the right side of your screen. Whenever your cursor reaches
    the specified right margin, an automatic new line is generated, and the word you
    are typing is brought to the next line. The default setting is `wrapmargin=0`.
    You should set the wrapmargin variable to a value with which you are comfortable.
    Otherwise, vi will use the default setting of 0. Using the default setting means
    that your cursor jumps to the next line when it reaches the end of your screen;
    however, parts of the word you are keying may be on separate lines. |


    To display the line numbers of your example file enter the following command:


    ```

    :set number  Return

    ```


    To remove the line numbers, enter the following command:


    ```

    :set nonumber  Return

    ```


    The :map command sets a single vi command key to a vi command sequence. The syntax
    for the :map command follows:


    ```

    :map key sequence  Return

    ```


    This command sequence replaces any existing command for that key. The command
    sequence should be identical to the keystrokes you want to map, except that special
    keys such as the Return key, the Escape key, and keys modified with the Ctrl key
    must be quoted first with Ctrl-V. Because the q and v keys do not have commands
    associated with them, they are good keys to map.


    For example, to map a key sequence that inserts a line into your text that says
    "This space held for new text", you could use the following command:


    ```

    :map q oThis space held for new text  Ctrl/V  Escape  Return

    ```


    Note the use of Ctrl/V to quote the Escape character.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# A.3.5 Saving Your Customizations


    You can make your environment customizations permanent by placing the appropriate
    ex commands in a file named .exrc in your home directory. Commands in this file
    will take effect every time you enter vi or ex. In this file, you do not need
    to use the vi command :, because these commands are read directly by the underlying
    ex editor.


    For example, to customize your environment to always display line numbers for
    your files, to use the map sequence shown in the previous section, and to set
    an automatic right margin of five spaces, you would first open the .exrc file
    with vi in your home directory, and add the following lines of text:


    ```

    set number

    map q oThis space held for new text Ctrl/V Escape

    set wrapmargin=5

    ```


    After you write this file, verify that it works by opening your example file.'
  merge: -1
  img_proc: true
