    ```


    # 11.2.2.2 Aborting a Message with an Escape Command


    You can abort a mail message by entering either the ~q or the ~x escape command
    on a blank line. Unlike aborting a message by pressing Ctrl/C, these commands
    abort the message immediately, without prompting you to reconsider. The ~q escape
    command saves the aborted text in the dead.letter file in your home directory,
    but ~x does not, even if you have set save in your .mailrc file.


    The following example shows how to abort a mail message by using the ~x escape
    command:


    ```

    orange$ mailx sally

    Subject: Update to reference page files

    What should the mailx(1) reference page include

    ~x

    orange$

    ```


    You may need to enter the beginning tilde character (~) a few times before it
    appears.


