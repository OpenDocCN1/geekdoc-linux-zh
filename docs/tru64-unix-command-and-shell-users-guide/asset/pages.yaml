    login directory is /users/lee and the POSIX shell (/usr/bin/posix/sh) is defined
    as the command interpreter. The password field contains Lee''s password in encrypted
    form.


    # 5.1.2 The /etc/group File


    The /etc/group file defines login accounts for all groups using the system. This
    file can be altered only by a user with superuser privileges. See Section 5.7
    for more information.


    Each record in the group database defines the login account of one group. Groups
    provide a convenient way to share files among users with a common interest or
    who are working on the same project.


    Each entry in the /etc/group file is a single line that contains four fields.
    The fields are separated by colons, and the last field ends with a newline character.
    The following text shows the format of each entry and describes the meaning of
    each field:


    ```

    groupname:password:GID:user1[,user2,...userN]

    ```


    groupname A unique character string that identifies the group to the system.


    password This field is always empty. Entries in this field are ignored.'
