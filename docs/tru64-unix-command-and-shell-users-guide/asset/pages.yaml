- pgno: 293
  md: "# A.3 Using the Underlying ex Commands\n\nThe vi text editor is based upon\
    \ the ex line editor. The underlying ex line editor can bring the power of global\
    \ changes to your entire text file or any large piece of it. You can access ex\
    \ commands from within vi by using the colon (:) command. You were introduced\
    \ to ex commands earlier in this appendix with the :wq and :q! commands for writing\
    \ and quitting an editing session.\n\nThe colon (:) command causes ex to prompt\
    \ for a command line at the bottom of the editor screen with a colon (:). Each\
    \ ex command is ended by pressing the Return key. You can also enter ex more permanently\
    \ with the vi command Q. This command turns processing over to ex until you explicitly\
    \ return to vi. This often happens accidentally. If it should happen to you, you\
    \ can return to vi by typing vi at the colon (:) prompt followed by the Return\
    \ key as follows:\n\n```\n:vi Return\n```\n\nAn ex command acts on a block of\
    \ lines in your text file according to the following general syntax:\n\n```\n\
    : [address[,address]] command\n```\n\nThe command, along with any of its arguments,\
    \ acts on the lines between and including the first and second address. If one\
    \ address is specified, the command acts only on the specified line. If no address\
    \ is specified, the command acts only on the current line. Addresses can be specified\
    \ in a number of ways. Some of the more common address specifications are the\
    \ following:\n\n+   line number\tAddress by absolute line number.\n+   /pattern/\t\
    Next line that contains the pattern.\n+   .\tLine that the cursor is on.\n+  \
    \ $\tLast line of the file.\n+   address+lines\tRelative offset from the addressed\
    \ line.\n+   %\tAll the lines in the file, and is used once in place of both addresses.\n\
    \nThe following sections show some of the most generally useful ex commands, and\
    \ some of the customization features offered by ex. You should read the ex(1)\
    \ reference page for a more detailed list of commands."
