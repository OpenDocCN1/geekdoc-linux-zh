    # 3.3 Printing Files (lpr, lpq, lprm)


    Use the lpr command to send one or more files to the system printer. The lpr command
    actually places files in a print queue, which is a list of files waiting to be
    printed. Once the lpr command places your files in the queue, you can continue
    to do other work on your system while you wait for the files to print, or you
    may terminate your session.


    The general format of the lpr command is:


    ```

    lpr filename

    ```


    The filename entry can be the name of the file, the relative pathname of the file,
    the full pathname of the file, or a list of file names separated by spaces. The
    format you use depends on where the file is located in relation to your current
    directory. You may also use pattern-matching characters to specify files. See
    Chapter 2 for information on pattern matching.


    If your system has more than one printer, use the following format to specify
    where you want the file to print:


    ```

    lpr -P printername filename

    ```


    The -P flag indicates that you want to specify a printer. The printername entry
    is the name of a printer. Printers often have names that describe the location
    of the printer (for example, southmailroom), the custodian or nearest monitor
    (for example, leslie), or some other descriptive nomenclature. If your system
    has several types of printers available, they may be assigned names such as slide
    or color that describe their function or capability. See your system administrator
    for information on the printer configuration available on your system.


    If your system has more than one printer, one of them is the default printer.
    When you do not enter a specific printername, your print request goes to the default
    printer. Use the lpstat -s command to find the names of available printers on
    your system.'
