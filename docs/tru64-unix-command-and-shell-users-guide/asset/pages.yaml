  md: '# 6.4.4  Suspending and Resuming a Foreground Process (C Shell Only)


    Stopping a foreground process and resuming it can be helpful when you have a long-duration
    process absorbing system resources and you need to do something quickly.


    Rather than waiting for process completion, you can stop the process temporarily
    (suspend it), perform your more critical task, and then resume the process. Suspending
    a process is available for C shell users only.


    To suspend a process, press Ctrl/Z. A message will display listing the job number,
    the status suspended, and the command executed.


    Once you are ready to resume the process, as a foreground task, enter the job
    number *n* in the following format::


    ```

    ```text

    % n

    ```

    ```


    To resume the process in the background, enter the job number *n* in the following
    format:


    ```

    ```text

    % n &

    ```

    ```


    The following example starts a find process, suspends it, checks its status, resumes
    it, and then terminates it:


    ```

    ```text

    % find / -type f -print > dir.paths &

    [4] 41

    % jobs -l

    [4] +41 Running  find / -type f -print > dir.paths &

    % Ctrl/Z

    Suspended

    % jobs -l

    [4] +Stopped  find / -type f -print > dir.paths

    % 4 &

    [4] find / -type f -print > dir.paths &

    % kill %4

    [4] +Terminated  find / -type f -print > dir.paths

    ```

    ```


    Once a process is suspended, you may also resume it by entering the fg command.
    If a currently running process is taking too long to run and is tying up your
    keyboard, you can use the bg command to place the process in the background and
    enter other commands.


    The following example starts a find process, suspends it, puts the process in
    the background, copies a file, and then resumes the process in the foreground:


    ```

    ```text

    % find / -type f -print > dir.paths

    Ctrl/Z

    Suspended

    % bg

    ```

    ```'
