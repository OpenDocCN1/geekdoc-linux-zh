    \ were standard input. You should set up a command on the remote host to accept\
    \ this input before executing the `~>` command. For example, `remote$ cat > destination-file`.\
    \ |\n\n> **Note**\n> \n> The `tip` command uses system prompts and character sequences\
    \ that match a system’s interrupt sequence to signal the end of file transfers\
    \ through the `~<` or `~>` command. These values are configured in the `/etc/remote`\
    \ file. See the `remote(4)` reference page for more information.\n\n# ### 14.3.3\
    \ Using ct to Connect to a Remote Terminal with a Modem\n\nThe ct command enables\
    \ a user on a remote ASCII terminal with a modem to communicate with a local host\
    \ with a modem over a telephone line. The remote terminal user can then log in\
    \ and work on the local host. If there are no available telephone lines, the ct\
    \ command displays a message and asks if you want to wait for one.\n\nThe ct command\
    \ is useful in the following situations:\n\n+   - When secure communications are\
    \ necessary.\n+   \n+     Because the local host contacts the remote terminal,\
    \ the remote user does not need to know the telephone number of the local host.\
    \ The local user entering ct can monitor the work of the remote user.\n+   \n\
    +   - When the cost for the telephone connection should be charged either to the\
    \ local site or to a specific account on the remote terminal (like a collect call).\n\
    +   \n+     The `-h` option can be omitted to emulate making a collect call. The\
    \ user on a remote terminal enters the ct command without the `-h` option.\n\n\
    The following ct features are useful under certain circumstances:"
