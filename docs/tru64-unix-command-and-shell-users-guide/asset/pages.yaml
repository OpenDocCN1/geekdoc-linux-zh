  md: '# Overview of Files and Directories


    This chapter provides an introduction to files, file systems, and text editors.
    A file is a collection of data stored together in the computer. Typical files
    contain memos, reports, correspondence, programs, or other data. A file system
    is the useful arrangement of files into directories.


    A text editor is a program that lets you create new files and modify existing
    ones.


    After completing this chapter, you will be able to:


    +   - Create files with the vi text editor. These files will be useful for working
    through the examples later in this book.


    +   - Understand the file system components and concepts.


    This knowledge can help you design a file system that is appropriate for the type
    of information you use and the way you work.


    # 2.1 Overview of Text Editors


    An editor is a program that lets you create and change files containing text,
    programs, or other data. An editor does not provide the formatting and printing
    features of a word processor or publishing software.


    With a text editor, you can:


    +   - Create, read, and write files


    +   - Display and search for data


    +   - Add, replace, and remove data


    +   - Move and copy data


    +   - Run operating system commands


    Your editing takes place in an edit buffer that you can save or discard.


    The vi and ed text editing programs are available on the operating system. Each
    editor has its own methods of displaying text as well as its own set of subcommands
    and rules.


    For information about vi, read Section 2.2 and Appendix A. For information about
    ed, see Appendix B.'
