  md: 'See the ct(1) reference page for more information.


    Table 14–5 summarizes ct command options and required entries.


    **Table 14–5: Options to the ct Command**


    | Option | Description |

    |---|---|

    | `-wminutes` | Specifies the maximum length of time in minutes that the ct command
    waits for a line. The ct command dials the remote modem at one-minute intervals
    until the connection is established or the specified number of minutes has passed.
    Using the `-w` option suppresses the messages that ct usually displays if it cannot
    make the connection. |

    | `-xnumber` | Produces detailed information about the command''s execution on
    standard error output on the local host, to be used for debugging. The debugging
    level, number, is a single digit in the range from 0–9; the recommended default
    is 1. |

    | `-v` | Enables the ct command to send a running narrative to standard error
    output. |

    | `-h` | Prevents ct from breaking the current connection. |

    | `-sspeed` | Specifies the data transmission rate of ct; the default is 1200-baud.
    Set the baud rate to the baud rate of the terminal to which you are connecting.
    |

    | `telno` | Specifies the phone number of the remote modem. You can enter a local
    or a long-distance number, and specify secondary dial tones such as 9 for an outside
    line, or an access code. Use an equal sign (=) following a secondary dial tone
    (9=), and a hyphen (-) for delays, as in 555-5092. Telephone numbers may contain
    up to 31 characters, including any of the following: the digits 0–9; a hyphen
    or dash (-); an equal sign (=); an asterisk (*); a number or pound sign (#). |


    # 14.4 Using uux to Run Commands on Remote Hosts


    The uux command enables you to run commands on a remote host while you work on
    your local host. If the command does not exist on the remote host, uux does not
    execute, and the remote host will notify you by mail. If the command executes
    and produces output (for example, cat or diff), you can specify that uux place
    that output in a file on any specified host.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Note


    For security reasons, certain sites may restrict the use of some commands through
    uux. Also, enhanced security features on the local host may affect whether certain
    commands can be run on remote hosts through uux. See your system administrator
    for more information.


    The uux command syntax depends on how the command interpreter of a given shell
    treats special characters. The syntax is the same for the Bourne, Korn, and POSIX
    shells, but different for the C shell.


    Regardless of the shell from which you use uux, there are two ways to specify
    the destination:


    ```

    `uux [option...] "commandstring > destination"`

    ```


    ```

    `uux [option...] commandstring \{ destination \}`

    ```


    In the first syntax statement, the right-angle bracket (the redirection symbol)
    (>) directs the output of the remote command to a destination directory or file.
    A pair of double quotation marks (" ") encloses the entire command because the
    redirection symbol, the right-angle bracket (>) , is a special character. Whenever
    you use any of the following characters in a command line, you must enclose that
    character or the entire command in double quotation (" ") marks:


    +   - Left-angle bracket (<)

    +   - Right-angle bracket (>)

    +   - Semi-colon (;)

    +   - Vertical bar or pipe (|)

    +   - Plus sign (+)

    +   - Left-bracket ([)

    +   - Right-bracket (])

    +   - Question-mark (?)


    In the second syntax statement, enclose the destination name within braces ({
    }). You must type a backslash (\) before each brace because braces are special
    characters to the shell command interpreter. Without backslashes, the braces would
    be misinterpreted.


    When specifying the pathname of a destination file, you can use a full name, or
    a pathname preceded by ~user where user is the name of the user’s login directory.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Output files must be writable. If you are uncertain about the permission status
    of a specific target output file, direct the results of the command to the /usr/spool/uucppublic
    directory; ~uucp is a brief way of specifying this directory from a shell.


    # 14.4.1 Using uux from the Bourne, Korn, or POSIX Shells


    The following example shows how the uux command uses the operating system cat
    command to concatenate the /u/doc/F1 file located on host gem, with the /usr/doc/F2
    file located on host sky. The result is placed in the /u/doc/F3 file on host gem.


    ```

    uux "gem!cat gem!/u/doc/F1 sky!/usr/doc/F2 > gem!/u/doc/F3"

    ```


    In the following example, the task is the same as in the previous command, but
    braces ({ }) are used instead of the redirection symbol to specify the destination
    in the uux command line. The task is the same as in the previous command, but
    the destination output is implicit:


    ```

    uux gem!cat gem!/u/doc/F1 sky!/usr/doc/F2 \{gem!/u/doc/F3\}

    ```


    # 14.4.2 Using uux from the C Shell


    To perform the same operation as in the previous section, but in the C shell,
    enter one of the following uux commands:


    ```

    uux "gem\!cat gem\!/u/doc/F1 sky\!/usr/doc/F2 > gem\!/u/doc/F3"

    ```


    The following example uses an implicit destination output file:


    ```

    uux gem\!cat gem\!/u/doc/F1 sky\!/usr/doc/F2 \{gem\!/u/doc/F3\}

    ```


    In the two following examples, uux uses the cat command to send the acct6 file
    from remote host boston, as output to the acct6 file in the public directory on
    your local host:


    ```

    uux "cat boston\!/reports/acct6 > ~uucp/acct6"

    ```


    The following example uses an implicit destination output file:


    ```

    uux cat  boston\!/reports/acct6 \{~uucp/acct6\}

    ```


    # 14.4.3 Other uux Features and Suggestions


    The uux command assumes your local host is the default, so you do not need to
    specify it in the command line. For example, to run the diff command to compare
    the /u/F1 file on host car with the /u/F2 file on host sea, and place the result
    in the /u/F3 file on the local host, use the following command:


    ```

    uux "diff  car!/u/F1  sea!/u/F2  >  /u/F3"

    ```'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'You can also represent the local host by using just an exclamation point, as
    in the following example:


    ```

    uux "!diff car1/u/F1 seal/u/F2 > !/u/F3"

    ```


    When you specify the pathname source file in commands such as diff or cat, you
    can include the following shell pattern-matching characters which the remote host
    will interpret:


    +   - Question-mark (?)\n- Asterisk (*)\n- Left-bracket ({\n- Right bracket (})


    Enclose these characters either within two backslashes (\ ... \) or within quotation
    marks (" ... ") so that the local shell does not interpret the characters before
    uux sends the command to the remote host. Do not use pattern-matching characters
    in destination names.


    If you use the left-angle bracket (<), the right angle-bracket (>), the semi-colon
    (;), and the pipe (|) shell characters, place them within backslashes (\ ... \),
    quotation marks (" ... "), or place the entire command line within backslashes
    or quotation marks.


    # Note


    The shell redirection characters, two left-angle brackets (<<) and two right-angle
    brackets (>>), do not work in UUCP.


    Table 14–6 summarizes uux command options and required entries. See the uux(1)
    reference page for more information.


    # Table 14–6: Options to the uux Command


    | Option | Description |

    | --- | --- |

    | -n | Cancels notification through mailx that usually occurs when a command fails
    to execute on the designated host. The -n and -z options are mutually exclusive.
    |

    | -z | Sends a message through mailx when command execution fails on the designated
    host. The -n and -z options are mutually exclusive. |

    | -j | Displays the job identification number of the uux request that runs the
    remote command; use this number with the uustat command. See Section 13.8.1 for
    more information. |'
  merge: -1
  img_proc: true
- pgno: 265
  md: "**Table 14–6: Options to the uucp Command (cont.)**\n\n| Option | Description\
    \ |\n|---|---|\n| `cmd_string` | Specifies any command accepted by the designated\
    \ host. For more information on the command formats, see Section 13.4. |\n| `dest_name`\
    \ | Specifies the host and file for storing the output of the command run on a\
    \ remote host. For example, if you want to list all the files in a directory on\
    \ a remote host, you can use `uxp` to place the listing in a file on your own\
    \ host by entering the appropriate destination name. For more information on the\
    \ destination formats, see Section 13.4. |\n\n# 14.5 Using UUCP to Send and Receive\
    \ Files\n\nOn UNIX based computers that support the UUCP protocol, you can use\
    \ the uucp command to copy one or more files from one computer to another. You\
    \ can use uucp to copy files as follows:\n\n+   - Between local and remote hosts\n\
    +   - Between two remote hosts\n+   - Between two hosts through an intermediate\
    \ host\n+   - Within your local host\n\nTo facilitate file transfers, many sites\
    \ make the public UUCP directory, `/usr/spool/uucppublic`, available. This directory\
    \ provides read and write access to all users and bypasses security restrictions.\
    \ The brief way to specify this directory is `~uucp` or `~/` in a uucp command.\n\
    \n> **Note**\n> \n> File transfer through uucp is subject to security features\
    \ on either host. The uucp utility does not display error messages for failed\
    \ file transfers. For more information, see your system administrator.\n> \n>\
    \ The system administrator defines security restrictions to prevent unwarranted\
    \ use by remote users, so only certain directories and files may be accessible\
    \ for sending or receiving files.\n\n# 14.5.1 Using UUCP to Copy Files in the\
    \ Bourne, Korn, and POSIX Shells\n\nFrom the Bourne, Korn, or POSIX shell, you\
    \ can specify uucp file names without using a backslash (`\\`) before the exclamation\
    \ point (`!`) that precedes the host name of the destination file. For example,\
    \ to copy the star file"
  merge: -1
  img_proc: true
- pgno: 266
  md: 'from local host **earth** to the `/sun/stats` file in the public directory
    on the remote host **sky**, enter the following command:


    ```

    earth% uucp star sky!~/sun/stats

    ```


    To copy the same file and explicitly identify the `/usr/spool/uucppublic` directory,
    enter the following command:


    ```

    earth% uucp star sky!/usr/spool/uucppublic/sun/stats

    ```


    If you need to copy a file to a remote host whose address is unknown to your local
    host, you can do so by means of another host that knows the remote host’s address.
    You can copy a local file to a remote host by first sending it to one or more
    intermediate hosts, separating each host name by an exclamation point (!). For
    example, to copy the local file star to the `/sun/stats` file on the remote host
    sky by first sending it through the intermediate host, mlkway, enter the following
    command:


    ```

    earth% uucp star mlkway!sky!~uucp/sun/stats

    ```


    You can use `uucp` from your local host to copy a file from a remote host to your
    local host. For example, to copy the `/cells/type1` file from remote host **biochem**
    to the local file, `/dna/sequence`, enter the following command from local host
    **earth**:


    ```

    earth% uucp  biochem!/cells/type1  /dna/sequence

    ```


    You can copy multiple files from a remote host to a local host by using a pattern-matching
    character to specify files. For example, to copy all files with names beginning
    with report from the `/geog/survey` directory on remote host moon to the ~uucp
    public directory on local host earth, enter the following command:


    ```

    earth% uucp  moon\!/geog/survey/report*  ~uucp

    ```


    # 14.5.2 Using UUCP to Copy Files in the C Shell


    In the C shell, the exclamation point (!) has a special meaning. To prevent the
    command interpreter from mistranslating it, you must precede it with a backslash
    (\) in a pathname.


    For example, to copy the `/usr/NASA/ctrl-specs` file from local host earth to
    the ~uucp public directory on remote host luna7, enter the following command from
    the local host:


    ```

    earth% uucp  /usr/NASA/ctrl-specs  luna7\!~uucp

    ```


    To copy the plan9 file from the `/usr/reports/exobio` directory on remote host
    luna7 to the ~uucp public directory on local host earth, enter the following command:


    ```

    earth% uucp  luna7\!/usr/reports/exobio/plan9  ~uucp

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'To copy all files with names beginning with msg from the /sensory/visual/earthrise
    directory on the remote host luna7 to the ~uucp public directory on local host
    earth, you can enter the following command:


    ```

    earth$ uucp luna7!//sensory/visual/earthrise/msg''*'' ~uucp

    ```


    Here, the pattern-matching character, the asterisk (*) in the source file names
    is enclosed within single quotation marks to prevent misinterpretation.


    In the next example, the same files are copied to ~uucp, but the entire pathname
    of the source files is enclosed in double quotation marks to prevent misinterpretation:


    ```

    earth$ uucp "luna7!//sensory/visual/earthrise/msg*" ~uucp

    ```


    Table 14-7 summarizes uucp command options and required entries. See the uucp(1)
    reference page for more information.


    # Table 14-7: Options to the UUCP Command


    | Option | Description |

    |---|---|

    | -d | Creates intermediate directories needed when copying a source file to a
    destination file on a remote host. Entering uucp with the destination pathname
    creates the required directory. The -d option is the default. |

    | -f | Do not create intermediate directories during the file transfer. |

    | -j | Displays the job identification number of the transfer operation; use with
    the uustat command to check transfer status, or with uustat -k to terminate the
    transfer. See Section 13.8.1 for more information. |

    | -m | Specifies that uucp send mail to the requester to verify copying of destination
    file on a remote host; no mail is sent for a local transfer. |

    | -nusername | Notifies the recipient, username on the remote host, that a file
    has been sent; no mail is sent for a local transfer. |

    | source_file | Specifies the pathname of the file that you want to send or receive.
    For more information about UUCP pathnames, see Section 13.1. |

    | destination_name | Specifies the pathname of the file (or directory) that receives
    the copy. For more information about destination file pathnames, see Section 13.5.1
    and Section 13.5.2. |'
  merge: -1
  img_proc: true
- pgno: 268
  md: "# 14.6 Using uuto with uupick to Copy Files\n\nThe uuto command copies the\
    \ file you specify to the public directory on the destination host where it is\
    \ obtained by the recipient through uupick. The rmail program notifies the recipient\
    \ when the file arrives.\n\n> **Note**\n> \n> Any file transfer is subject to\
    \ the security features on the local and remote hosts. See your system administrator\
    \ for more information.\n\nFor example, to send the `/usr/bin/data/junk` file\
    \ from local host moe to user curly on remote host stooge, enter the following\
    \ command:\n\n```\nmoe% uuto  /usr/bin/data/junk  stoogecurly\n```\n\nThe uuto\
    \ command copies the file to the `/usr/spool/uucppublic/receive/curly/moe` file\
    \ on host stooge. Next, the rmail utility sends user curly a mail message stating\
    \ that the file has arrived. User curly can then enter the uupick command to access\
    \ the file and save, move, or delete it. In the following example, user curly\
    \ enters the uupick command on host stooge; the response from uupick follows:\n\
    \n```\nstooge% uupick\nFrom system moe: file junk\n?\n```\n\nAt the uupick question\
    \ mark (?) prompt, user curly enters the d and q options to delete the file and\
    \ exit from uupick:\n\n```\n? d\n? q\n```\n\nTable 14–8 summarizes the uupick\
    \ file handling options, entered at the ? prompt.\n\n**Table 14–8: Options to\
    \ the uupick Command**\n\n| Option | Description |\n|---|---|\n| `*` | Displays\
    \ available uupick file-handling options. |\n| Return | Signals uupick to get\
    \ the next file. |\n| `a [dir]` | Moves all uuto files from the public directory\
    \ to the specified directory on the local host; specify the directory by using\
    \ a full or relative pathname. The default is the current directory. |\n| `d`\
    \ | The d option deletes the current file obtained by uupick. |\n| `m [dir]` |\
    \ Moves a file to a directory specified by either full or relative pathname; the\
    \ default is the current directory. |"
  merge: -1
  img_proc: true
- pgno: 269
  md: "**Table 14–8: Options to the uupick Command (cont.)**\n\n| Option | Description\
    \ |\n|---|---|\n| `p` | Displays the file. |\n| `q`<br>`Ctrl/D` | Exits uupick\
    \ without displaying, moving, or deleting any file in the public directory. You\
    \ can also press Ctrl/D to quit. |\n| `! command` | Returns to the operating system\
    \ to run a command. After `command` executes, control returns to uupick. |\n\n\
    See the uupick(1) reference page for more information.\n\n# 14.7 Using uuto to\
    \ Send a File Locally\n\nYou can also use uuto to send a file to another user\
    \ on your local host. However, the recipient does not receive a mail message indicating\
    \ the file transfer. For example, user shemp can send the file `/usr/bin/data/status`\
    \ to user larry on local host stooge, where each is logged in:\n\n```\nstooge%\
    \ uuto /usr/bin/data/status larry\n```\n\nTable 14–9 summarizes uuto command options\
    \ and required entries. See the uuto(1) reference page for more information.\n\
    \n**Table 14–9: Options to the uuto Command**\n\n| Option | Description |\n|---|---|\n\
    | `-m` | Notifies sender when uuto copies a source file to the specified user\
    \ name and host. |\n| `-p` | Usually, uuto copies the source file to:\n\n`/usr/spool/uucppublic/receive/\n\
    \  /username/host/file`\n\nThe `-p` option sends the source file to the spool\
    \ directory on the local host before transferring a copy of it to the public directory\
    \ on the specified host. |\n| `file_name` | The pathname of the source file. |\n\
    | `destination_name` | The pathname to the location where you want to copy the\
    \ source file. The `destination_name` must include the user name of the person\
    \ receiving the file, and has the form, `host!username`, where `host` is the name\
    \ of the remote computer and `username` is the user name of the recipient. When\
    \ copying a file on your local host, the `destination_name` can be simply the\
    \ name of the user to whom you are sending the file. |"
  merge: -1
  img_proc: true
- pgno: 270
  md: "# 14.8 Displaying Job Status of UUCP Utilities\n\nThe UUCP utilities include\
    \ three commands, uustat, uulog, and uuminitor for displaying status information\
    \ about UUCP jobs, as described in the following sections.\n\n# 14.8.1 The uustat\
    \ Command\n\nThe uustat command supports UUCP jobs by providing the following:\n\
    \n+   - Status information of file transfers requested by uucp and uuto\n+   -\
    \ Status information of command executions requested by uux\n+   - Limited control\
    \ of jobs queued to run on a remote computer\n+   - Cancellation of copy requests\
    \ from uucp\n\nStatus reports from uustat display on your workstation screen in\
    \ this basic form; variations depend on the uustat option.\n\n```\njobid date/time\
    \ status system_name username size file\n```\n\n> **Note**\n> \n> Any status display\
    \ operation is subject to the security features on the local and remote hosts.\
    \ See your system administrator for more information.\n\nEntering uustat without\
    \ options displays the status information for all the UUCP commands that you have\
    \ entered since the last time the holding queue was cleaned up.\n\nTo report the\
    \ status of jobs requested by a specific user, use the -u option, as shown here,\
    \ for user hugh:\n\n```\n% uustat -u hugh\n```\n\nTwo types of output information,\
    \ each produced by a uustat option, are the current queue and the holding queue.\
    \ The output of the uustat -q command is the **current queue**, which lists the\
    \ UUCP jobs either queued to run or currently executing on one or more remote\
    \ hosts. The output of the uustat -a command is the **holding queue**, which lists\
    \ all jobs that have not executed during a set period of time.\n\n> **Note**\n\
    > \n> After the set time period has elapsed, delete the entries in the holding\
    \ queue manually with the uucleanup command or automatically through the uudemon.cleanu\
    \ command."
  merge: -1
  img_proc: true
