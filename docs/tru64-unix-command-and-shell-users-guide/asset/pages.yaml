    # 5.8 Changing Owners and Groups (chown and chgrp)


    In addition to setting permissions, you can control how a file or directory is
    used by changing its owner or group. Use the chown command to change the owner
    and the chgrp command to change the group.


    # Note


    > In order to use the chown command, you must have superuser privileges. For more
    information on this topic, see Section 5.7.


    Enter the chown command in the following form:


    ```

    chown owner filename

    ```


    The owner entry is the user name of the new owner of the file. The filename entry
    is a list of one or more files whose ownership you want to change. You may also
    use pattern-matching characters to specify files. See Section 5.4.1.3 for more
    information.


    Enter the chgrp command in the following form:


    ```

    chgrp group file

    ```


    The group entry is the group ID or group name of the new group. To change the
    group ownership of a file, you must be a member of the group to which you are
    changing the file. The file entry is a list of one or more files whose ownership
    you want to change.


    For more information, see the chown(1) and chgrp(1) reference pages.'
  merge: -1
  img_proc: true
- pgno: 114
  md: "# 5.9 Additional Security Considerations\n\nThe security guidelines enforced\
    \ at your site protect your files from unauthorized access. See your system administrator\
    \ for complete information about security guidelines.\n\nIn addition, it is wise\
    \ to avoid running untrusted software (software that is from an unknown source\
    \ or that has not been validated for system security). When you run a program,\
    \ that program has all of your access rights, and nothing prevents the program\
    \ from being used to illicitly access, observe, or alter sensitive files.\n\n\
    You should be aware of three types of programs that compromise security:\n\n+\
    \   - Trojan horse\n+     A Trojan horse is a program that performs, or appears\
    \ to perform, its defined task properly; however, it also performs hidden functions\
    \ that may be malicious. A Trojan horse program emulates the program that you\
    \ intended to run, but may perform an unwanted action. It might vandalize your\
    \ files by altering or deleting them, or compromise the files by making illegal\
    \ copies of them.\n+   \n+     A typical Trojan horse is the login Trojan horse,\
    \ which mimics the system's login prompt on the display and waits for you to enter\
    \ a user name and password. The program mails or copies this information to the\
    \ user responsible for the Trojan horse. As the Trojan horse exits, it displays\
    \ Login incorrect. The real login program then runs. Most users assume they typed\
    \ the password incorrectly, and are unaware that they were deceived.\n\n+   -\
    \ Computer worm\n+     A computer worm is a program that moves around a computer\
    \ network, making copies of itself. For example, a login computer worm can log\
    \ in to a system, copy itself onto the system, start running, log in to another\
    \ system, and then continue this process indefinitely.\n\n+   - Computer virus\n\
    +     A computer virus program is really a type of Trojan horse. Usually, a Trojan\
    \ horse waits passively for the right user to run it (usually a privileged user).\
    \ Viruses spread by inserting themselves in other executable files, thus increasing\
    \ the threat and extent of compromise of privacy or integrity.\n\nBe careful of\
    \ programs that were not installed by the person who administers your system.\
    \ Programs that are obtained from bulletin boards and other unknown origins are\
    \ particularly suspect. Even if the program includes source code, it is not always\
    \ possible to examine the program carefully enough to determine if it is trustworthy."
  merge: -1
  img_proc: true
