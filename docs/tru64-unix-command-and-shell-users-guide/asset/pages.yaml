    For example, suppose that the command mysort is a sorting program that creates
    a temporary file (mysort.tmp) in the course of its sorting process. When the sorting
    program finishes successfully, it cleans up after itself, deleting the temporary
    file. If, on the other hand, the program fails, it may neglect to clean up. To
    ensure deletion of mysort.tmp, enter the following command line:


    ```

    $ mysort || rm mysort.tmp

    $

    ```


    The second command executes only if the first command fails.


    # 7.4.2 Using Pipes and Filters


    A pipe is a one-way connection between two related commands. One command writes
    its output to the pipe, and the other process reads its input from the pipe. When
    two or more commands are connected by the pipe (|) operator, they form a pipeline.


    Figure 7-1 represents the flow of input and output through a pipeline. The output
    of the first command (cmd1) is the input for the second command (cmd2); the output
    of the second command is the input for the third command (cmd3).


    Figure 7-1: Flow Through a Pipeline


    ![](img/47f3b48f0999ddf70574ce85cbaaf942_139_0.png)


    A filter is a command that reads its standard input, transforms that input, and
    then writes the transformed input to standard output. Filters are used typically
    as intermediate commands in pipelines – that is, they are connected by a pipe
    (|) operator. For example, to cause the ls command to list recursively the contents
    of all directories from the current directory'
