- pgno: 100
  md: '# Figure 5-1: File and Directory Permission Fields


    ![](img/47f3b48f0999ddf70574ce85cbaaf942_100_0.png)


    When you create a file or directory, the system automatically supplies a predetermined
    permission code. The following is a typical file permission code:


    ```

    -rw-r--r--

    ```


    This file permission code specifies that the owner has read and write permissions
    while the group and all others have read permission. The dashes (-) in some positions
    following the file-type notation indicate that the specified class of user does
    not have permission for that operation.


    The following is a typical directory permission code:


    ```

    drwxr-xr-x

    ```


    This directory permission code specifies that owner has read, write, and search
    permissions, while the group and all others have read and search permissions.


    The default permission codes that your system provides relieve you from the task
    of specifying them explicitly every time you create a file or directory. If you
    want to create your own default permission codes, you must change your user mask
    with the umask command. For an explanation of the umask command, see the description
    of the command in Section 5.5.'
  merge: -1
