  md: '# Example 11-5: Reading Another mailx Message


    ```

    ? h

    U 1 root  Mon Jul 20 10:39 14/438  "System news"

    > 2 root  Mon Jul 20 11:30 11/292  "Welcome"

    ? 1

    Message 1:

    From root Mon Jul 20 11:30:07 1999

    Date: Mon, 20 Jul 1999 11:30:04 -0400

    From: root (system administrator)

    To: jones

    Subject: System news


    The newest release of the text processing

    software will be installed after 5 o''clock

    today.  Send mail if you have questions or

    concerns before or after the installation.


    ?

    ```


    The message you are reading is called the **current message**. To reread the message,
    press the Return key. To read the next message, press n. This message becomes
    the current message. You can read all your messages in succession by pressing
    n after each message. You may change this by modifying the variable gonext as
    described in Appendix D.


    # 11.3.1 Deleting a Message


    Your messages stay in mailx until you delete them before or after storing them
    in a file or in a folder. To delete the current message after reading it, enter
    the d (delete) command at the mailx prompt. To delete a different message, enter
    the d command at the mailx prompt, followed by the message number. You can delete
    several messages by listing their numbers after the d command. For example, enter
    the following command at the mailx prompt to delete messages 7 and 9:


    ```

    ? d 7 9

    ```


    You can also delete a range of messages by using a hyphen between the first and
    last message. For example, to delete messages 7 through 11, enter the following
    command at the mailx prompt:


    ```

    ? d 7-11

    ```


    If you accidentally delete a message, you can recover it with the u (undelete)
    command. For example, to undelete message 7, enter the following command at the
    mailx prompt:


    ```

    ? u 7

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'If you exit mailx by entering q or quit instead of x, any previously read messages
    that you do not delete are added to the end of a file of previously undeleted
    messages named mbox, in your home directory.


    # 11.3.2 Replying to a Message


    Replying to a mail message is similar to sending a mail message. You have the
    same options to edit, abort, or include a file in a message, as described in Section
    11.2.


    To reply to the sender of a message that you have just finished reading, enter
    an uppercase R (reply) command at the mail prompt, as shown in Example 11-6.


    # Example 11-6: Replying to a Message


    ```

    Message 3:

    From: deede e Mon Jul 20 14:13:32 1999

    Date: Mon, 20 Jul 1999 14:13:05 -0400

    From: deede e (DeeDee Smith)

    To: jones, mays@sf24.usernet, susannah@artwrk

    Subject: Testing text-processing software


    I think we should test the new text processing

    software on the older machines as well as the

    newer. Remember that many customers still have

    the older models.


    ? R

    To: deede e

    Subject: Re: Testing text-processing software


    I agree. Also, we should test different machine

    configurations to determine if, for example,

    it performs satisfactorily when run remotely.

    .

    EOT

    ?

    ```


    After you enter R, the recipient and subject line display, enabling you to verify
    that you are replying to the intended recipient.


    If you enter a lowercase r, the reply will be sent to the recipients of the original
    mail as well as to the sender; in Example 11-6, to mays@sf24.usernet and susannah@artwrk,
    as well as to deede e.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Note


    To reply only to the sender of a mail message, enter an uppercase R at the mail
    prompt. To reply to the sender and all recipients of a mail message, enter a lowercase
    r at the prompt.


    In Example 11-6, the Cc: prompt does not appear because user jones'' .mailrc file
    does not contain the set askcc command.


    # 11.3.3 Saving a Message


    If you leave mailx by entering the q command (instead of the x or exit command),
    the messages that you have just read are stored in the mbox file in your home
    directory.


    To store mail messages in a more useful way, you can save them in individually-named
    files or in folders as described in the following sections.


    # 11.3.3.1 Saving a Message in a File


    There are several kinds of mail that you might want to save in a file:


    +   - A brief but important message that you read

    +   - An incorrectly-addressed mail message that mailx returns to you

    +   - A long message that you want to print and read later


    To save a brief message that you read or a mail message that mailx returned to
    you, enter the s command at the mailx prompt and supply a name for the file.


    A returned message is shown in the second item in the following output from the
    mailx command:


    ```

    orange% mailx

    Mail $Revision: 1.1.4.7 $ Type ? for help.

    "/usr/spool/mail/jones": 2 messages 1 new 1 unread

    U 1 root Mon Jul 20 10:39 14/438 "System news"

    >N 2 MAILER-DAEMON Wed Aug 5 09:39 19/498 "Returned mail: User unknown"

    ?

    ```


    As shown in the following example, user Jones decides to save the returned message
    from the previous example in the file, verify-resend, as a reminder to find the
    correct address before resending it.


    ```

    :

    >N 2 MAILER-DAEMON Wed Aug 5 09:39 19/498 "Returned mail: User unknown"

    ? s verify-resend

    ```'
  merge: -1
  img_proc: true
- pgno: 217
