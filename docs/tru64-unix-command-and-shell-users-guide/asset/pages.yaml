  md: '# 7.4.3.2 Using Braces { }


    Using braces is valid only in the Bourne, Korn, and POSIX shells.


    When commands are grouped in braces, the shell executes them without creating
    a subshell. In the following example, the shell runs the date command, writing
    its output to the today.grp file, and then runs the who command, writing its output
    to today.grp:


    ```

    $ { date; who; } > today.grp

    $

    ```


    If the commands were not grouped together with braces, the shell would write the
    output of the date command to the display and the output of the who command to
    the file.


    The shell recognizes braces in pipelines and command lists, but only if the left
    brace is the first character on a command line.


    # 7.4.4 Quoting


    Reserved characters are characters such as the left-angle bracket (<), the right-angle
    bracket (>), the pipe (|), the ampersand (&), the asterisk (*), and the question
    mark (?) that have a special meaning to the shell. See Chapter 8 for lists of
    reserved characters for each operating system shell.


    To use a reserved character literally (that is, without its special meaning),
    quote it with one of the three shell quoting conventions, as shown in Table 7-4.


    # Table 7-4: Shell Quoting Conventions


    | Quoting Convention | Action |

    |---|---|

    | \ | Backslash – Quotes a single character. |

    | '' '' | Single quotes – Quotes a string of characters (except the single quotation
    marks themselves). |

    | " " | Double quotes – Quotes a string of characters (except $, `, and \). |


    The following sections describe the quoting conventions of Table 7-4 in greater
    detail.


    # 7.4.4.1 Using the Backslash (\ )


    To quote a single character, place a backslash (\ ) immediately before that character,
    as in the following:


    ```

    $ echo \?

    ?

    ```'
  merge: -1
  img_proc: true
