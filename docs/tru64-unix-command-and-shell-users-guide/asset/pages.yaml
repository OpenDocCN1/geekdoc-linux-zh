- pgno: 190
  md: '# ## Using the System V Habitat


    This chapter describes the System V habitat, commands, subroutines and system
    calls. The commands described in this chapter will enable you to:


    +   - Set up your System V habitat environment

    +   - Access the System V habitat

    +   - Use System V habitat commands


    The System V habitat consists of alternate versions of commands, subroutines,
    and system calls that support the source code interfaces and runtime behavior
    for all components of the Base System and Kernel Extension as defined in the System
    V Interface Definition (SVID). This implementation of the System V habitat supports
    all SVID 2 functions and SVID 3 functions. The System V habitat does not contain
    alternate versions of default system commands, subroutines, and system calls that
    already meet the SVID requirement.


    Using the System V habitat lets you override the default system commands and functions
    with corresponding System V commands and functions (system calls and subroutines).
    You can access the habitat in two ways:


    +   - Specify the absolute paths of the System V commands and libraries.

    +   - Define the PATH environment variable to search the System V habitat for
    commands before it searches the default system locations. To set your PATH environment
    variable, modify your `.profile` or `.login` and `.cshrc` files as described in
    Section 9.1.


    Because the System V system calls are not layered over the system calls in the
    default system, applications that are built using the system calls in the System
    V habitat run with virtually no performance overhead. Figure 9–1 illustrates the
    System V habitat placement within the default operating system and shows that
    the System V system calls reside at the kernel level.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Figure 9–1: System V Habitat


    ![](img/47f3b48f0999ddf70574ce85cbaaf942_191_0.png)


    The following sections describe how to set up your environment to access the System
    V habitat and how it works.


    # 9.1 Setting Up Your Environment


    To automatically access the System V habitat when you log on, you must add a command
    line to your .profile file if you use the Bourne, Korn, or POSIX shell, or to
    your .login and .cshrc files if you use the C shell. The command line modifies
    the PATH environment variable, which causes the System V habitat to be searched
    before the standard default locations on the system are searched, such as /bin
    or /usr/bin. The System V habitat scripts are available as follows:


    +   - Files /etc/svid2_profile (for the Bourne, Korn, or POSIX shell) and /etc/svid2_login
    (for the C shell)'
  merge: -1
  img_proc: true
- pgno: 192
  md: "Specifies SVID 2 behavior when placed in either your .profile or .login and\
    \ .cshrc files, respectively.\n\n+   - Files /etc/svid3_login (for the Bourne,\
    \ Korn, or POSIX shell) and /etc/svid3_profile (for the C shell)\n\nSpecifies\
    \ SVID 3 behavior when placed in either your .profile or .login and .cshrc files,\
    \ respectively.\n\nFor example, if you use the Bourne, Korn, or POSIX shell and\
    \ you want to specify SVID 2 behavior, edit the .profile file and add the following\
    \ command line:\n\n```\nif [ -f /etc/svid2_profile ]\nthen\n    . /etc/svid2_profile\n\
    fi\n```\n\nIf you use the C shell and you want to specify SVID 2 behavior, edit\
    \ the .login and .cshrc files and add the following command line:\n\n```\nif (\
    \ -e /etc/svid2_login ) then\n    source /etc/svid2_login\nendif\n```\n\nThe dot\
    \ (.) and source commands are shell specific. See the appropriate reference page\
    \ for more information.\n\n# 9.2 How the System V Habitat Access Works\n\nWhether\
    \ you choose the script that specifies SVID 2 behavior or the script that specifies\
    \ SVID 3 behavior, both establish the System V habitat as follows:\n\n+   - Defines\
    \ SVID2PATH, a System V only variable, to be the contents of /etc/svid2path or\
    \ /etc/svid3path. The /etc/svid2path and /etc/svid3path files contain the path\
    \ definition for SVID 2 and SVID 3, respectively.\n\n+   - Adds SVID2PATH/bin\
    \ and SVID2PATH/sbin to the beginning of your current PATH.\n\n+   - Exports both\
    \ SVID2PATH and PATH.\n\n+   - Sets the TZ variable to the appropriate value.\
    \ If you select SVID 2 behavior, it also sets the TZc variable to the appropriate\
    \ value. See System Administration for more information on time zone formats.\n\
    \nHence, if you need to determine the location of the System V habitat on your\
    \ system, run the cat(1) command on the /etc/svid2path or /etc/svid3path file."
  merge: -1
  img_proc: true
- pgno: 193
  md: "By using the System V habitat scripts to alter the PATH environment variable,\
    \ the System V habitat path can be changed without an administrator updating each\
    \ user's .profile or .login and .cshrc files. The administrator simply updates\
    \ the /etc/svid2path and /etc/svid3path files to enable global definitions.\n\n\
    To further illustrate how the System V habitat script sets a PATH, look at the\
    \ following .profile file which specifies the System V habitat script for SVID\
    \ 2:\n\n```\nstty erase DEL kill ^U intr ^C quit ^X echo\nTERM=vt100\nPATH=$HOME/bin:/usr/lib:/bin\n\
    MAIL=/usr/mail/$LOGNAME\nEDITOR=vi\nexport MAIL PATH TERM EDITOR\nif [ -f /etc/svid2_profile\
    \ ]\nthen\n    . /etc/svid2_profile\nfi\n```\n\nIn this example, assume that the\
    \ path of the System V habitat is /usr/opt/s5 as reflected by the contents of\
    \ /etc/svid2path and that your login directory is /usr/users/xxx. When you display\
    \ the PATH after logging in with the preceding .profile file, the result would\
    \ show that the path to the System V habitat has been prepended to the PATH set\
    \ in the third line of the .profile file as follows:\n\n```\n% echo $PATH  Return\n\
    /usr/opt/s5/bin:/usr/opt/s5/sbin:/usr/users/xxx/bin:/usr/lib:/bin\n```\n\nHence,\
    \ when you issue a shell command, the System V habitat is searched first. If the\
    \ command is not found, the specified paths are searched.\n\n# 9.3 Compatibility\
    \ for Shell Scripts\n\nCompatibility for your shell scripts is achieved by altering\
    \ your shell's PATH environment variable (as explained in Section 9.1). Therefore,\
    \ the System V habitat is searched before the default system locations. If your\
    \ PATH variable is set for the System V habitat, your scripts are System V compatible\
    \ regardless of whether you use the C shell or the Bourne, Korn, or POSIX shell.\n\
    \n# 9.4 System V Habitat Command Summary\n\nTable 9-1 summarizes the behavior\
    \ of user commands in the System V habitat that have options or features that\
    \ differ from the default system versions. For a complete explanation of the commands\
    \ in the habitat, refer to the reference page for each command."
  merge: -1
  img_proc: true
- pgno: 194
  md: '**Table 9-1: User Commands Summary**


    | Command | System V Behavior |

    |---|---|

    | chmod(1) | Ignores the umask value when the who string is omitted, behaving
    as though a is the who value when you use the symbolic form of this command. |

    | df(1) | Accepts the -t option, which prints space totals, and accepts an optional
    file system name or device name. |

    | ln(1) | Accepts the -f option, which silently removes existing destination pathnames
    before creating the specified link. |

    | ls(1) | Produces multicolumn output only if the -C option is specified. Also,
    the -s option causes file sizes to be reported in 512 byte units instead of 1024
    byte units. |

    | mailx(1) and Mail(1) | Includes the capabilities of the System V mailx command.
    |

    | sum(1) | Uses the word-by-word algorithm by default; uses the byte-by-byte algorithm
    if the -r option is specified. The default use of the checksum algorithms for
    the System V sum command is the reverse of the default system version of the sum
    command. |

    | tr(1) | Includes the -A option whenever you specify the -c option. The -A option
    causes only the characters in the octal range of 1 to 377 to be complemented.
    |'
  merge: -1
  img_proc: true
