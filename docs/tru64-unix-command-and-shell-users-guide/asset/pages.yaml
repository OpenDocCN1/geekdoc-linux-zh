- pgno: 294
  md: '# A.3.1 Making Substitutions


    The most common substitution task, possibly the most common ex task, is a global
    substitution of one word or phrase for another. You can do this with the s command.
    If you have closed the my.file file, reopen it. To change every occurrence of
    "is" to "was", use the following command:


    ```

    :%s/is/was/g Return

    ```


    This substitution command is applied to all lines in the file by the % address.
    The slash (/) is used as a separator. The g argument at the end of the command
    causes the substitution to occur globally, that is, on each instance of the pattern
    within each line. Without the g argument, substitution occurs only once on each
    line.


    You should be careful when making substitutions to ensure that you get what you
    want. In the previous command line, the word this has changed to thwas because
    every occurrence of is was changed to was.


    You can add a c argument along with the g argument to prompt for confirmation
    before each substitution. The format of the confirmation is a bit complex; however,
    it is well worth using when you want to be scrupulous about making global changes.


    As an example of confirming a substitution, change the word thwas back to this
    by issuing the following command:


    ```

    :%s/thwas/this/gc Return

    ```


    The following prompt appears at the bottom of the screen:


    ```

    You, too, use thwas new text file

    ^^^^^

    ```


    As shown in the next example, type y and press the Return key. You are then prompted
    for the second substitution:


    ```

    You, too, use thwas new text file

    ^^^^^y Return

    You, too, use thwas new text file

    ^^^^^

    ```


    Type y and press the Return key, and in response to the Hit return to continue
    prompt, press the Return key once again as follows:


    ```

    You, too, use thwas new text file

    ^^^^^y

    You, too, use thwas new text file

    ^^^^^y Return

    [Hit return to continue] Return

    ```


    You will find that the two occurrences of the word thwas have been changed back
    to this. In addition, vi is back in the command mode with the cursor positioned
    at the first character of the line with the last substitution.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Now try another substitution on your example file. Add three lines of new text
    to the file by using the $ (go to beginning of last line), o (create new line),
    yy (yank), and p (paste) commands as follows:


    ```

    :$ Return

    o

    Some new text with a misepelling. Escape

    yy

    p

    p

    p

    ```


    You now should have four lines of new text, all containing the incorrectly spelled
    word misepelling.


    To fix the spelling error, enter one of the following commands:


    ```

    :1,$s/misepelling/misspelling/ Return

    ```


    or


    ```

    :5,8s/misepelling/misspelling/ Return

    ```


    In the first example, the address 1,$ indicates that the substitution should begin
    on line one (1) and end at the last line of the file ($). In the second example,
    5,8 indicates that the substitution should being on line five and end on line
    eight. You do not need to use the g operator in either case because the change
    is only necessary once on each line.


    # A.3.2 Writing a Whole File or Parts of a File


    The :wq command is a special ex command that writes the whole file. It combines
    the features of the write command w and the quit command q. The only argument
    that the quit command can take is the exclamation point (!). It forces the session
    to quit even if changes made to the file would be lost by quitting.


    The w command can also take addresses and a file name argument, which lets you
    save part of your text to another file. For example, to save the first three lines
    of your text to the new file my.new.file, use the following command:


    ```

    :1,3w my.new.file Return

    ```


    ```

    "my.new.file" [New file] 3 lines, 130 characters

    ```


    # A.3.3 Deleting a Block of Text


    The delete command in ex is d, just as in vi. To delete from the current line
    to the end of the file, use the following command:'
