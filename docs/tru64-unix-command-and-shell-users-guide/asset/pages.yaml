- pgno: 235
  md: '# Table 12–1: The ftp Subcommands for Connecting to a Host and Copying Files
    (cont.)


    | Subcommand | Description |

    |---|---|

    | `mput locfile [remfile]` | Copies one or more specified files (`locfile`) from
    the local host to `remfile` on the remote host (supports wildcard or pattern-matching
    metacharacter expansion). |

    | `open host [port]` | Establishes a connection with the specified `host`, if
    you did not specify it on the command line. If `port` is specified, FTP attempts
    to connect to a server at that port. If the autologin feature is set (the default),
    FTP tries to log the user in to the remote host. |

    | `put locfile [remfile]` | Stores a file, `locfile` on the local host, in the
    file `remfile` on the remote host. If you do not specify `remfile`, FTP uses the
    local file name to name the remote file. See also the `sunique` subcommand. |

    | `quit` | Ends the file copying session and exits FTP; same as `bye`. |

    | `recv remfile [locfile]` | Copies the remote host file, `remfile` to the file,
    `locfile` on the local host; `recv` works like `get`. |

    | `runique` | Toggles, creating unique file names for local destination files
    during get operations. If the unique local file name feature is off (the default),
    FTP overwrites local files. Otherwise, if a local file has the same name as one
    specified for a local destination file, FTP appends a `.1` extension to the specified
    name of the local destination file. If a local file already has the new name,
    FTP appends a `.2` extension to the specified name, and so on up to a value of
    99. If FTP still cannot find a unique name, it reports an error and the file is
    not copied. Note that `runique` does not affect local file names generated from
    a shell command. |'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Table 12–1: The ftp Subcommands for Connecting to a Host and Copying Files
    (cont.)


    | Subcommand | Description |

    |---|---|

    | send locfile [remfile] | Stores a local file, locfile in the file, remfile on
    the remote host; send works like put. |

    | sunique | Toggles, creating unique file names for remote destination files during
    put operations. If the unique remote file name feature is off (the default), FTP
    overwrites remote files. Otherwise, if a remote file has the same name as specified
    for a remote destination file, the remote FTP server modifies the name of the
    remote destination file in the same way that runique does, and it must be supported
    on the remote host. |


    Table 12–2 describes the ftp subcommands that enable you to verify, change, or
    create the current directory and list its contents before you copy files, if necessary.
    The pwd and ls subcommands were used in Example 12–1.


    # Table 12–2: The ftp Subcommands for Directory and File Modification


    | Subcommand | Description |

    |---|---|

    | cd remotedir | Changes the working directory on the remote host to remotedir.
    |

    | cdup | Changes the working directory on the remote host to the parent of the
    current directory. |

    | delete remfile | Deletes the specified remote file. |

    | dir [remdir] [locfile] | Lists the contents of remote directory remdir to the
    file, locfile on the local host. |

    | lcd [directory] | Changes the working directory on the local host. If you do
    not specify a directory, FTP uses your home directory. |

    | ls [remdir] [locfile] | Writes an abbreviated file listing of a remote directory,
    remdir to a local host file, locfile. |

    | mkdir [remdir] | Creates specified directory on remote host. |

    | pwd | Displays the name of the current directory on the remote host. |

    | rename from to | Renames a file on the remote host. |

    | rmdir remdir | Removes the remote directory remdir from the remote host. |'
  merge: -1
