    The Korn and POSIX shells provide an inline editing feature that allows you to
    retrieve a previously entered command and edit it. To use this feature, you must
    know how to use a text editor such as vi or emacs.


    For more information about these shell features, see Chapter 8.


    # 7.2.2 The Restricted Bourne Shell


    The operating system enhances system security by providing specified users a limited
    set of functions with a restricted version of the Bourne shell (Rsh). When these
    specified users log in to the system, they are given access to the Restricted
    Bourne shell only. Your system administrator determines who has access to the
    Restricted Bourne shell.


    A restricted shell is useful for installations that require a more controlled
    shell environment. As a result, the system administrator can create user environments
    that have a limited set of privileges and capabilities. For example, all users
    that are guests to your system might be allowed access under the user name guest.
    When logging in to your system, user guest would be assigned a restricted shell.


    The actions of Rsh are identical to those of sh, except that the following actions
    are not allowed:


    +   - Changing directories. The cd command is deactivated.

    +   - Specifying pathnames or command names containing a slash (/).

    +   - Setting the value of the PATH or the SHELL variables. For more information
    on these variables, see Section 7.5.2.

    +   - Redirecting output with the right-angle brackets (> and >>).


    For more detailed information on Rsh, see the sh(1b) reference page. For information
    on how system administrators create restricted shells, see your system administrator.


    # 7.3 Changing Your Shell


    Whenever you log in, you automatically are placed in a shell specified by your
    system administrator. However, depending upon the security features in effect
    on your system, you can enter commands that will let you do the following:


    +   - Determine which shell you are running

    +   - Temporarily change your shell

    +   - Permanently change your shell'
