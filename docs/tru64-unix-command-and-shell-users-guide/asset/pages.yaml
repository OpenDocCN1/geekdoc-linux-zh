    wphone Your office phone number


    hphone Your home phone number


    login_directory Your current directory after logging in to the system. It is usually
    a directory you own and use to store private files.


    login_shell The program run by the login program after you successfully log in
    to the system. It is usually a shell program used to interpret commands. For more
    information on shells, see Chapter 7 and Chapter 8.


    The following example is a sample entry in the /etc/passwd file:


    ```

    lee:NebPaa9qXmKbd:201:20:Lee Voy, Sales, x1234:/users/lee: \ /usr/bin/posix/sh

