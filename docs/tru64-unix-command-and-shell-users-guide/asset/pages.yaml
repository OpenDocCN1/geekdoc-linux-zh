  md: '# A.2.3 Yanking and Moving Text


    You copy text in the same manner as you move it, except that instead of using
    the delete text command d, you use the yank text command, y. The y command copies
    (or yanks) the specified text into the paste buffer without deleting it from the
    text. It follows the same syntax as the d command. You can also use the yy command
    to yank an entire text line into the paste buffer, in the same way as dd.


    For example, to copy the first two lines of the file to a position immediately
    underneath them, enter the following command sequence from the first line of the
    file:


    ```

    2yy

    j

    p

    ```


    You must move the cursor down one line using j or the two lines will be pasted
    after the first line rather than after the second.


    # A.2.4 Other vi Features


    You may want to try some of the other features of vi. The vi(1) reference page
    lists all of the available commands. You may want to pay particular attention
    to the following:


    | J | Joins the next line of text to the current line of text. |

    | . | Repeats the last command. |

    | s | Substitutes the current character with the following entered text. |

    | x | Deletes the current character. |

    | ~ | Changes the alphabetic case of the current character. |

    | ! | Executes an operating system command on the current line of text and replaces
    the text with the output. |

    | Ctrl/L | Refreshes the screen when problems with the screen display occur. Any
    time your screen is displaying confusing output, press Ctrl/L. |'
