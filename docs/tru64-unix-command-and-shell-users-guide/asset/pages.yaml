    # 3.4.4 How Links Work – Understanding File Names and File Serial Numbers


    Each file has a unique identification number, called a **file serial number**.
    The file serial number refers to the file itself – data stored at a particular
    location – rather than to the file name. The file serial number distinguishes
    the file from other files within the same file system.


    A directory entry is a link between a file serial number that represents a physical
    file and a file name. It is this relationship between files and file names that
    enables you to link multiple file names to the same physical file – that is, to
    the same file serial number.


    To display the file serial numbers of files in your current directory, use the
    `ls` command with the `-i` (print file serial number) flag in the following format:


    ```

    ```sh

    ls -i

    ```

    ```


    Examine the identification numbers of the files in your login directory. The number
    preceding each file name in the listing is the file serial number for that file.


    ```

    ```text

    $ ls -i

    1079 checkfile  1077 file1  1078 file2  1079 file3

    $

    ```

    ```


    The file serial numbers in your listing will differ from those shown in this example.
    However, the important thing to note is the identical file serial numbers for
    `file3` and `checkfile`, the two files linked in the previous example. In this
    case, the file serial number is 1079.


    Because a file serial number represents a file within a particular file system,
    hard links cannot exist between separate file systems.


    The situation is entirely different with symbolic links, where the link becomes
    a new file with its own, new file serial number. The symbolic link is not another
    file name on the original file’s file serial number, but instead is a separate
    file with its own file serial number. Because the symbolic'
  merge: -1
