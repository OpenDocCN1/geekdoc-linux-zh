    # 5.4.2 Specifying Permissions with Octal Numbers


    You can also use octal numbers to change file and directory permissions.


    To use octal number permission codes with the chmod command, enter the command
    in the following form:


    ```

    chmod octalnumber filename

    ```


    The octalnumber entry is a 3-digit octal number that specifies the permissions
    for owner, group, and others. The filename entry is the name of the file whose
    permissions you want to change. It can be the name of the file or a list of file
    names separated by spaces. You may also use pattern-matching characters to specify
    files. See Section 5.4.1.3 for more information.


    An octal number corresponds to each type of permission:


    +   4 = read

    +   2 = write

    +   1 = execute'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'To specify a group of permissions (a permissions field), add together the appropriate
    octal numbers (r, w, and x denote read, write, and execute respectively):


    ```

    3 = -wx (2 + 1)

    6 = rw- (4 + 2)

    7 = rwx (4 + 2 + 1)

    0 = --- (no permissions)

    ```


    Table 5–2 lists the eight possible permission combinations.


    **Table 5–2: Permission Combinations**


    | Octal Number | Binary Number | Permissions | Description |

    |---|---|---|---|

    | 0 | 000 | None | No permissions granted |

    | 1 | 001 | --x | Execute |

    | 2 | 010 | -w- | Write |

    | 3 | 011 | -wx | Write/execute |

    | 4 | 100 | r-- | Read |

    | 5 | 101 | r-x | Read/execute |

    | 6 | 110 | rw- | Read/write |

    | 7 | 111 | rwx | Read/write/execute |


    The entire permission code for a file or directory is specified with a 3-digit
    octal number, one digit each for owner, group, and others. Table 5–3 shows some
    typical permission codes and how they relate to the permission fields.


    **Table 5–3: How Octal Numbers Relate to Permission Fields**


    | Octal Number | Owner Field | Group Field | Others Field | Complete Code |

    |---|---|---|---|---|

    | 777 | rwx | rwx | rwx | rwxrwxrwx |

    | 755 | rwx | r-x | r-x | rwxr-xr-x |

    | 700 | rwx | --- | --- | rwx------ |

    | 666 | rw- | rw- | rw- | rw-rw-rw- |


    For example, you could use the following commands to change the permission of
    file3 using octal numbers:


    ```

    $ ls -l file3

    -rw-rw-rw-  1 larry  system  130 Jun 5 10:06 file3

    $ chmod 754 file3

    $ ls -l file3

    ```'
