  md: '# Figure 4–1: Relationship Between Directories and Subdirectories


    ![](img/47f3b48f0999ddf70574ce85cbaaf942_82_0.png)


    Like file names, the maximum length of a directory name depends upon the file
    system used on your computer. For example, your file system may allow a maximum
    directory name length of 255 bytes (the default), or it may allow a maximum directory
    name length of only 14 bytes. Knowing the maximum directory name length is important
    to help you give meaningful names to your directories. See your system administrator
    for details.


    The operating system does not have a symbol or notation that automatically distinguishes
    between a file name and a directory name, so you may find it useful to establish
    your own naming conventions to designate files and directories. However, you can
    use the ls -F command to distinguish between file names and directory names when
    the contents of your current directory are displayed. For more information on
    this command, see Section 4.3.


    # 4.2 Changing Directories (cd)


    The cd (change directory) command lets you switch from your current (working)
    directory to another directory. You can move to any directory in the file system
    from any other directory in the file system by executing cd with the proper pathname.'
