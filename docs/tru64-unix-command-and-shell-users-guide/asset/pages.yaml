  md: '# A.1.6.1 Deleting Words


    Using the general form of commands, you can delete the last five words of this
    text file. Move the cursor to the beginning of the last line by pressing the Return
    key several times and enter:


    ```

    5dw

    ```


    ```

    :w

    ```


    It takes five words to delete the whole line rather than four because the period
    at the end of the line counts as a word. All punctuation counts as one word when
    you are using the delete word command. As a reminder that you should save a file
    often, this example also had you write the file (save it) using the :w command.


    Suppose you only want to delete a portion of a word? The x command deletes one
    character at a time. To see how this command works, move the cursor to the letter
    s in the word examples. Press the x key once to delete the letter s.


    # A.1.6.2 Deleting Lines


    The dd command is a shortcut for deleting whole lines at a time. The dd command
    can be used with a number to delete multiple lines as well. For example, position
    the cursor at the sixth line in the file (at the line beginning with the word
    New) and type:


    ```

    2dd

    ```


    The sixth and seventh lines (even though the seventh line is empty) of the file
    are deleted simultaneously. The dd command can be used without specifying a number
    to delete one line at a time.


    The D command clears the current line of text from the current cursor position
    to the end of the line but does not delete the line itself. If the cursor is positioned
    at the beginning of the line, the entire line is cleared. This command speeds
    up your work because you do not have to know how many words are in the line to
    be able to delete them (as you would, for example, if you were using the dw command).
    This command is useful if you want to rewrite an entire line. With the cursor
    positioned at the beginning of the line, the D command followed by one of the
    text insertion commands (i, I, a, or A) lets you clear the current line of text
    and reenter new text with a minimum of keystrokes.


