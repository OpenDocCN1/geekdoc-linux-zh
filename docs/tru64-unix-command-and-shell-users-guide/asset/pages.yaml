- pgno: 282
  md: 'In the command mode, the Return key acts as a cursor movement key. Pressing
    the Return key moves the cursor to the first character of the next line. This
    movement differs from the j movement key because the Return key positions the
    cursor at the first character of the next line whereas the j moves the cursor
    to the same character position on the next line.


    In the command mode, the hyphen (-) moves the cursor to the first character of
    the previous line. This feature is useful to move backward through files. This
    movement differs from the k movement key because the hyphen (-) positions the
    cursor at the first character of the previous line whereas the k moves the cursor
    to the same character position on the previous line.


    If you tested any of the cursor movement keys described above, make sure your
    cursor is positioned at the first letter of the word experiment before continuing
    to the next section.


    # A.1.4.2 Moving the Cursor by Word, Line, Sentence, and Paragraph


    You can use the w command to move the cursor by whole word boundaries. The w command
    moves the cursor forward to the beginning of the next word. Move the cursor to
    the beginning of the word with by typing:


    ```

    w

    ```


    You can use the b command to move backward to the beginning of the previous word.
    For example, move to the beginning of the word experiment by typing:


    ```

    b

    ```


    Now see what happens when you do not use the b command from the beginning of a
    word by typing:


    ```

    1111b

    ```


    The cursor returns to the beginning of the word experiment.


    The word motion commands will wrap to the next or previous text line when appropriate.
    Move the cursor to the beginning of the word text by typing:


    ```

    bbb

    ```


    Notice how the cursor moved backward and wrapped around to the previous line.


    There are a few other interesting movement commands you should know about. The
    zero (0) moves the cursor to the beginning of the current line, and the dollar
    sign, ($) moves the cursor to the end of the current line.


    The close parenthesis ]) moves the cursor to the beginning of the next sentence,
    and the open parenthesis [( moves the cursor to the beginning of the previous
    sentence.'
