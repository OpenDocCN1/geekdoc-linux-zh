- pgno: 51
  md: 'For more information on the cd and mkdir commands, see Section 4.2 or the cd(1)
    reference page and Section 4.1 or the mkdir(1) reference page, respectively.


    # 3.1 Listing Files (ls)


    You can display a listing of the contents of one or more directories with the
    ls command. This command produces a list of the files and subdirectories (if any)
    in your current directory. You can also display other types of information, such
    as the contents of directories other than your current directory.


    The format of the ls command is:


    ```

    ls

    ```


    The ls command has a number of options, called flags that enable you to display
    different types of information about the contents of a directory. Refer to Section
    3.1.3 for information about these flags.


    # 3.1.1 Listing Contents of the Current Directory


    To list the contents of your current directory, enter:


    ```

    $ ls

    ```


    Used without flags in this format, the ls command lists the names of the files
    and directories in your current directory:


    ```

    $ ls

    file1  file2  file3  project

    $

    ```


    You may also list portions of your current directory''s contents by using the
    command format:


    ```

    ls  filename

    ```


    The filename entry can be the name of the file or a list of file names separated
    by spaces. You may also use pattern-matching characters to specify files. See
