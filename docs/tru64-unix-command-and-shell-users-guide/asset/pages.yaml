- pgno: 330
  md: 'In addition to the 12-hour/24-hour clock differences, punctuation for written
    times can vary, for example:


    3:20 p.m. (United States)


    15h20 (France)


    15.20 (Germany)


    15:20 (Japan)


    See the date(1) reference page for a discussion of the date and time formats available,
    and their usage.


    # C.2.3 Numeric and Monetary Formats


    The characters used to format numeric and monetary values vary from place to place.
    In the United States, the convention is to use a period (.) as the radix character
    (the character that separates whole and fractional quantities), and a comma (,)
    as the thousands separator. In many European countries, these conventions are
    reversed. For example:


    1,234.56 (United States)


    1.234,56 (France)


    Here are some sample formats for monetary items:


    $1,234.56 (United States, dollars)


    kr1.234,56 (Norway, krona)


    SFrs.1,234.56 (Switzerland, Swiss francs)


    Some formats for monetary amounts include more than two places for fractional
    digits.


    # C.2.4 Messages


    Programs are sometimes written with English messages embedded in the program itself.
    In an internationalized program, messages are kept in a separate file and replaced
    in the program with calls to a messaging system. Messages kept in a separate file
    can be translated and made available to the program. When translated messages
    are available, users can interact with the system in their local language.


    # C.2.5 Yes/No Prompts


    Many programs ask questions that need a positive or negative response. Those programs
    typically look for the English string literals y or yes, n or no. An internationalized
    program lets users enter the characters or words'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'that are appropriate to their language. For example, a French user should be
    able to enter `o` or `oui`.


    # C.3 Determining Whether a Locale Has Been Set


    If your system is functioning in accordance with the language and conventions
    of your country, you can assume that the locale has been set correctly. If you
    are not sure whether or not your locale has been set, enter the locale command
    to display current settings of the locale environment variables, for example:


    ```

    ```text

    % locale

    LANG=fr_FR.ISO8859-1

    LC_COLLATE="fr_FR.ISO8859-1"

    LC_CTYPE="fr_FR.ISO8859-1"

    LC_MONETARY="fr_FR.ISO8859-1"

    LC_NUMERIC="fr_FR.ISO8859-1"

    LC_TIME="fr_FR.ISO8859-1"

    LC_MESSAGES="fr_FR.ISO8859-1"

    LC_ALL=

    ```

    ```


    The locale environment variables, described in Section C.4.1, define the locale
    names used for messages, collation, codeset, numeric formats, monetary formats,
    date and time formats, and yes/no responses:


    +   - `LANG`

    +   - `LC_COLLATE`

    +   - `LC_CTYPE`

    +   - `LC_NUMERIC`

    +   - `LC_MONETARY`

    +   - `LC_TIME`

    +   - `LC_MESSAGES`

    +   - `LC_ALL`


    If only the `LANG` variable has been set to a locale, then the `LANG` setting
    applies by default to the locale category variables `LC_COLLATE`, `LC_CTYPE`,
    `LC_NUMERIC`, `LC_MONETARY`, `LC_TIME`, and `LC_MESSAGES`. In this case, the locale
    category variables can be set on an individual basis to a locale different from
    the one set for `LANG`. When the `LC_ALL` variable is set, however, it overrides
    the settings of all other locale variables.


    # C.4 Setting a Locale


    When you specify a locale, you specify a locale name that indicates language,
    territory, and codeset. On systems, locale names adhere to the following format:


    `lang_terr.codeset`'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'lang

    Is a 2-letter, lowercase abbreviation for the language name. The abbreviations
    are specified in ISO 639 Code for the Representation of Names of Languages, for
    example: en (English), fr (French), de (German, from German Deutsch), ja (Japanese).


    terr

    Is a 2-letter, uppercase abbreviation for the territory name. The abbreviations
    are specified in ISO 3166 Codes for the Representation of Names of Countries,
    for example: US (United States), NL (the Netherlands), FR (France), DE (Germany,
    from the German Deutschland), JP (Japan).


    codeset

    Is a string that identifies the codeset, for example: ISO8859-1 (ISO 8859/1),
    SJIS (Shift Japanese Industrial Standard), AJEC (Advanced Japanese EUC).


    Full locale names include: en_US.ISO8859-1 (English, incorporating customs for
    the United States), fr_FR.ISO8859-1 (French, incorporating customs for France),
    de_DE.ISO8859-1 (German, incorporating customs for Germany).


    A locale can be set by the system administrator or an individual user. If your
    system administrator sets the locale at your site, it is likely that a default
    locale has been specified for all systems, including yours. You can override the
    default locale if you want to do that.


    To set a locale, you assign a locale name to one or more environment variables.
    The easiest way to do this is to assign a locale name to the LANG environment
    variable because this variable covers all the pieces of a locale (codeset, collating
    sequence, numeric, monetary, and date and time formats, messages, and so forth).


    Table C-1 lists the locales available when you install the subset. Single-byte
    European Locales. Additional locales may be available if language-variant software
    for the operating system is installed on your system. See the i10n_intro(5) reference
    page for the available locales.'
  merge: -1
  img_proc: true
