- pgno: 228
  md: 'The write command can be used interactively, but it is difficult for both sender
    and receiver to determine when the other has finished and is waiting for a reply.
    For example, wang can enter the following command:


    ```

    dancer$ write chung

    ```


    Wang will then wait for chung to reply, but chung might also wait, thinking that
    wang intends to continue the message.


    To minimize problems, it is a good idea to establish a simple, temporary protocol
    each time you want to use write interactively. For example, user wang can start
    his message to chung as follows:


    ```

    dancer$ write chung

    I''ll mark the end of each message with ''ZZZ'' Return

    and wait for a reply. Please do the same. Return

    I''ll install a driver for the new printer. Return

    Do you want to test it? ZZZ Return

    ```


    For more information, see the write(1) reference page.


    # 11.9 Sending and Receiving Messages with talk


    The talk command enables a user to send a message to another user on the same
    or on a remote host, interactively and more easily than through write. However,
    talk works only on video display terminals.


    Like write, you can use talk to send a message immediately to someone who you
    cannot reach by telephone. Also, like write, the talk command may disrupt the
    receiver because it sends a notification message directly to a terminal and continues
    doing so until a reply is entered.


    To disable incoming messages (except from those with superuser privileges) from
    talk (and from write, as described earlier) you can put the command, mesg n in
    your login file. To determine whether a user has done this, use the finger command
    as described in Section 10.2.1 or in the finger(1) reference page.


    During an online talk session, a send window and a receive window are opened on
    each user''s terminal. Each user can type into the send window while talk displays
    in the receive window what the other user is typing.


    For example, to send a message to user hoover on the same local host apple, user
    coolidge enters the following talk command:


    ```

    apple$ talk hoover

    ```


    The program then divides the terminal screen of coolidge into two parts: the top
    half assigned to coolidge and the bottom half assigned to hoover.


    Next, the following message is displayed in the top of the screen:'
