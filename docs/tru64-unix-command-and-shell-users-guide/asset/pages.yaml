    # 1.6.2 Locating Commands Using Descriptive Keywords


    The apropos command and the man -k command are useful tools if you forget a command
    name.


    Note


    > The apropos and the man -k commands require access to the whatis database. This
    database is available if your system manager loaded the default whatis database
    when the operating system was installed or created the database later using the
    catman command.


    The apropos and man -k commands perform the same function. These commands let
    you enter a command description in the form of keywords. The commands then list
    all the reference pages that contain any of the keywords.


    As shown in the example, if a command description contains more than one word,
    the words must be enclosed in single quotes ( '' ) or double quotes ( " ). If
    the command description contains only one word, it is not necessary to enclose
    the descriptive word in quotes.


    Assume that you cannot remember the name of the command that displays who is logged
    in to the system. To display the names and descriptions of all reference pages
    that have something to do with displaying users who are logged in, enter one of
    the following:


    ```

    $ apropos "logged in"

    ```'
