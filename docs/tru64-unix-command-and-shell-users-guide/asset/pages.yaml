  md: '# B.7 Deleting Lines – The d (delete) Subcommand


    Use the d (delete) subcommand to remove one or more lines from the buffer. The
    general form of the d subcommand is the following:


    starting line,ending line d


    After you delete lines, ed sets the current line to the first line following the
    lines that were deleted. If you delete the last line from the buffer, the last
    remaining line in the buffer becomes the current line. After a deletion, ed renumbers
    the remaining lines in the buffer.


    To delete lines from the buffer, do the following:


    +   - To delete the current line, enter the following subcommand:

    +     d


    +   - To delete line number n from the buffer, enter the following subcommand:

    +     n d


    +   - To delete lines numbered n through m from the buffer, enter the following
    subcommand:

    +     n,m d


    The following sections describe these methods of deleting lines in detail.


    # B.7.1 Deleting the Current Line


