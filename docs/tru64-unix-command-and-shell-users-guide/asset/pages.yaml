    # 2.3 Understanding Files, Directories, and Pathnames


    A file is a collection of data stored in a computer. A file stored in a computer
    is like a document stored in a filing cabinet because you can retrieve it, open
    it, process it, close it, and store it as a unit. Every computer file has a file
    name that both users and the system use to refer to the file.


    A file system is the arrangement of files into a useful pattern. Any time you
    organize information, you create something like a computer file system. For example,
    the structure of a manual file system (file cabinets, file drawers, file folders,
    and documents) resembles the structure of a computer file system. (The software
    that manages the file storage is also known as the file system, but that usage
    of the term does not occur in this chapter. On some systems, this software is
    also called the file manager.)


    Once you have organized your file system (manual or computer), you can find a
    particular piece of information quickly because you understand the structure of
    the system. To understand the file system, you should first become familiar with
    the following three concepts:


    +   - Files and file names

    +   - Directories and subdirectories

    +   - Tree structures and pathnames


    # 2.3.1 Files and File Names


    A file can contain the text of a document, a computer program, records for a general
    ledger, the numerical or statistical output of a computer program, or other data.


    A file name can contain any character except the following because these characters
    have special meaning to the shell:


    +   - Slash (/)

    +   - Backslash (\)

    +   - Ampersand (&)

    +   - Left- and right-angle brackets (< and >)

    +   - Question mark (?)'
