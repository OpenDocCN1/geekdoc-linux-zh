    # 4.2.2 Using Relative Pathname Notation


    You can use the following relative pathname notation to change directories quickly:


    +   - Dot notation (`.` and `..`)

    +   - Tilde notation (`~`)


    Every directory contains at least two entries that are represented by dot (`.`)
    and dot dot (`..`). These entries refer to directories relative to the current
    directory:


    | Entry | Description |

    |---|---|

    | `dot (.)` | This entry refers to the current directory. |

    | `dot dot (..)` | This entry refers to the parent directory of your working directory.
    The parent directory is the directory immediately above the current directory
    in the file system tree structure. |


    To display the `.` and `..` entries as well as any files beginning with a period,
