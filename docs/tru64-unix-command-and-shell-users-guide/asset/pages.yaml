    # 3.1.3 Flags Used with the ls Command


    In its simplest form, the *ls* command displays only the names of files and directories
    contained in the specified directory. However, *ls* has several flags that provide
    additional information about the listed items or change the way in which the system
    displays the listing.


    When you want to include flags with the *ls* command, use the following format:


    ```

    ls  -flagname

    ```


    The *-flagname* entry specifies one or more flags (options) that you are using
    with the command. For example, the *-l* flag produces a long listing of the directory
    contents.


    If you want to use multiple flags with the command, enter the flag names together
    in one string:


    ```

    $ ls -lta

    ```


    Table 3-1 lists some of the most useful *ls* command flags.


    # Table 3-1: The ls Command Flags


    | Flag | Action |

    |------|--------|

    | -l | Lists in **long** format. An -l listing provides the type, permissions,
    number of links, owner, group, size, and time of last modification for each file
    or directory listed. |

    | -t | Sorts the files and directories by the **time** they were last modified
    (latest first), rather than collated by name. |'
