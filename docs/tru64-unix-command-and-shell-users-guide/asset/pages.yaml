    The text you entered in the file will be displayed at the top of the screen. The
    lines beginning with tildes (~) represent the blank lines in your file. The text
    at the bottom of the screen shows the name of the file, the number of lines in
    the file, and the number of characters in the file.


    # A.1.3 Saving a File and Quitting vi


    In the previous example, you learned that the :wq command saved the file and quit
    the vi editor. However, there are several other options available to save and
    quit a file:


    +   - Save a file and continue working in it

    +   - Save the file and quit (exit) vi

    +   - Quit vi without saving the changes made to the file


    If you are working on a large text file and have been adding, changing, and deleting
    a lot of information, it is suggested to save the file often (perhaps every 10
    minutes) to protect against potential data loss. The write'
