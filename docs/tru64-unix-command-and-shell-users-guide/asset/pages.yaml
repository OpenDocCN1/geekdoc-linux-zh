  md: "# Copying Files to Another Host\n\nThis chapter explains how to use operating\
    \ system commands to perform the following tasks:\n\n+   - Copy files between\
    \ a local and a remote host\n+   - Copy entire directories (including subdirectories)\
    \ of files between a local and a remote host\n+   - Copy files between two remote\
    \ hosts\n\nTo determine the host name or online status of a remote host before\
    \ copying files, use the finger, who, rwho, ping, or ruptime commands described\
    \ in Chapter 10.\n\nIn addition to the information in this chapter, Chapter 14\
    \ provides information on using the UNIX-to-UNIX Copy Program (UUCP) to copy files\
    \ to and from remote systems.\n\n> **Note**\n> \n> The security features on the\
    \ remote host determine whether or not you can copy a file. See your system administrator\
    \ if you cannot copy a file.\n\n# 12.1  Copying Files Between a Local and a Remote\
    \ Host\n\nYou can use the following commands to copy files between a local and\
    \ a remote host:\n\n+   - `rcp`, described in Section 12.1.1; see Section 12.2\
    \ to copy entire directories of files. A host running the operating system can\
    \ use rcp with a host running any other UNIX based operating system.\n+   - `ftp`,\
    \ described in Section 12.1.2.1. You can use ftp to copy files between hosts using\
    \ operating systems that also support ftp.\n+   - `mailx`, described in Section\
    \ 12.1.3.\n+   - `write`, described in Section 12.1.4."
