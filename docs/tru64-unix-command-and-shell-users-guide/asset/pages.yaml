  md: "+   8. User alice enters the `ls -l` subcommand to list the contents of the\
    \ current working directory, `file1`, `file2`, and `sales`.\n+   9. User alice\
    \ copies the file `sales` from the remote host to a file called `newsales` on\
    \ the local host through the `get` subcommand.\n+   10. User alice enters the\
    \ `quit` subcommand to end the ftp session and returns to the local system prompt.\n\
    \n> **Note**\n> \n> File transfers are subject to the security features on the\
