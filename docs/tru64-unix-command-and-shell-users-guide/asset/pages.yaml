    # Note


    > Many examples in the rest of this appendix use 1 , $p to display the buffer’s
    contents. In these examples, the 1 , $p subcommand is optional and convenient
    – it lets you verify that the subcommands in examples work as they should. Another
    convenient ed convention is ,p, which is equivalent to 1 , $p – that is, it displays
    the contents of the buffer.


    # B.2.4 Saving Text – The w (write) Subcommand


    The w (write) subcommand writes, or copies, the contents of the buffer into a
    file. You can save all or part of a file under its original name or under a different
    name. In either case, ed replaces the original contents of the file you specify
    with the data copied from the buffer.


    # B.2.4.1 Saving Text Under the Same File Name


    To save the contents of the buffer under the original name for the file, enter
    the w subcommand. For example:


    ```

    w

    78

    -

    ```


    The ed program copies the contents of the buffer into the file named afile and
    displays the number of characters copied into the file (78). This number includes
    blanks and characters such as Return (sometimes called newline), which are not
    visible on the screen.'
