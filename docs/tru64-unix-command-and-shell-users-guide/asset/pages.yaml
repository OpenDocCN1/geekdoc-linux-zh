  md: "In the C shell and the Korn or POSIX shell, you may also use a tilde (~) at\
    \ the beginning of relative pathnames. The tilde character used alone specifies\
    \ a user’s login (home) directory. The tilde character followed by a user name\
    \ specifies the login (home) directory of another user on the same system.\n\n\
    For example, to specify your own login directory, use the tilde alone. To specify\
    \ the login directory of user chang, specify ~chang.\n\nFor more information on\
    \ using relative pathnames, see Chapter 4.\n\n> **Note**\n> \n> If there are other\
    \ users on your system, you may or may not be able to get to their files and directories,\
    \ depending upon the permissions set for them. For more information about file\
    \ and directory permissions, see Chapter 5. In addition, your system may contain\
    \ enhanced security features that may affect access to files and directories.\
    \ If so, see your system administrator for details.\n\n# 2.4 Specifying Files\
    \ with Pattern Matching\n\nCommands often take file names as arguments. To use\
    \ several different file names as arguments to a command, you can type out the\
    \ full name of each file, as the following example shows:\n\n```\n`$ ls file1\
    \ file2 file3`\n```\n\nHowever, if the file names have a common pattern (in this\
    \ example, the file prefix), the shell can match that pattern, generate a list\
    \ of those names, and automatically pass them to the command as arguments.\n\n\
    The asterisk (*), sometimes referred to as a **wildcard**, matches any string\
    \ of characters. In the following example, the ls command finds the name of every\
    \ text file in the current directory that includes the file prefix:\n\n```\n`$\
    \ ls file*`\n```\n\nThe file* matches any file name that begins with file and\
    \ ends with any other character string. The shell passes every file name that\
    \ matches this pattern as an argument for the ls command.\n\nThus, you do not\
    \ have to enter (or even remember) the full name of each file in order to use\
    \ it as an argument. Both commands (ls with all file names typed out and ls file*)\
    \ do the same thing — they pass all files with the file prefix in the directory\
    \ as arguments to the ls command.\n\nThere is one exception to the general rules\
    \ for pattern matching. When the first character of a file name is a period, you\
    \ must match the period"
  merge: -1
  img_proc: true
- pgno: 48
  md: 'explicitly. For example, ls * displays the names of all files in the current
    directory that do not begin with a period. The command ls -a displays all file
    names, those that begin with a period and all others.


    This restriction prevents the shell from automatically matching the relative directory
    names. These are . (dot, standing for the current directory) and .. (dot dot,
    standing for the parent directory). For more information on relative directory
    names, see Chapter 4.


    If a pattern does not match any file names, the shell displays a message informing
    you that no match has been found.


    In addition to the asterisk (*), operating system shells provide other ways to
    match character patterns. Table 2-1 summarizes all pattern-matching characters
    and provides examples.


    # Table 2-1: Pattern-matching Characters


    | Character | Action |

    |---|---|

    | * | Matches any string, including the null string.

    For example, th* matches th, theodore, and theresa. |

    | ? | Matches any single character.

    For example, 304?b matches 304Tb, 3045b, 304Bb, or any other string that begins
    with 304, ends with b, and has one character in between. |

    | [...] | Matches any one of the enclosed characters.

    For example, [AGX]* matches all file names in the current directory that begin
    with A, G, or X. |

    | [..] | Matches any character that falls within the specified range, as defined
    by the current locale. For more information on locale, see Appendix C.

    For example, [T-W]* matches all file names in the current directory that begin
    with T, U, V, or W. |

    | [!...] | Matches any single character except one of those enclosed.

    For example, [!abyz]* matches all file names in the current directory that begin
    with any character except a, b, y, or z.

    This pattern matching is available only in the Bourne, Korn, and POSIX shells.
    |


    An internationalized operating system provides the additional pattern-matching
    features described in Table 2-2.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Table 2-2: Internationalized Pattern-matching Characters


    | Character | Action |

    |---|---|

    | [[::class:]] | A character class name enclosed in bracket-colon delimiters matches
    any of the set of characters in the named class.

    The supported classes are alpha, upper, lower, digit, alnum, xdigit, space, print,
    punct, graph, and cntrl.

    For example, the alpha character class name specifies that you want to match any
    alphabetic character (uppercase and lowercase) as defined by the current locale.
    If you are running an American-based locale, alpha matches any character in the
    alphabet (A-Z, a-z). |

    | [[=char=]] | A character enclosed in bracket-equal delimiters matches any equivalence
    class character.

    An equivalence class is a set of collating elements that all sort to the same
    primary location. It is generally designed to deal with primary-secondary sorting;
    that is, for languages such as French that define groups of characters as sorting
    to the same primary location, and then having a tie-breaking, secondary sort.
    |


    For more information on internationalized pattern-matching characters, see the
    grep(1) reference page. For more information on internationalization features,
    see Appendix C.'
  merge: -1
  img_proc: true
