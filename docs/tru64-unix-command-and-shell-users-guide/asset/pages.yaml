    If cmd1 succeeds, the shell runs cmd2. If cmd2 succeeds, the shell runs cmd3,
    and on through the series until a command fails or the last command ends. (If
    any command fails, the shell stops executing the command line).


    The syntax for the two-vertical-bar (||) operator follows:


    ```

    cmd1 || cmd2

