    +   - Left bracket ({)

    +   - Asterisk (*)

    +   - Tilde (~)

    +   - Vertical bar or pipe symbol (|)


    You may use a period or dot (.) in the middle of a file name, but never at the
    beginning of the file name unless you want the file to be hidden when doing a
    simple listing of files. For information about characters with special meanings
    to your shell, refer to Section 8.2.2 and Section 8.3.2. For information about
    listing hidden files, see Section 3.1.3.


    Note

    Unlike some operating systems, this operating system distinguishes between uppercase
    and lowercase letters in file names (that is, it is case sensitive). For example,
    the following three file names represent three distinct files: filea, Filea, and
    FILEA.


    Use file names that reflect the actual contents of your files. For example, a
    file name such as memo.advert might indicate that the file contains a memo about
    advertising. On the other hand, file names such as filea, fileb, or filec tell
    you nothing about the contents of that file.


    It is also a good idea to use a consistent pattern to name related files. For
    example, suppose you have an advertising report that is divided into chapters,
    with each chapter contained in a separate file. You might name these files in
    the following way:


    ```

    chap1.advert

    chap2.advert

    chap3.advert

    ```


    Note

    Many programs that you invoke use the portion of the file name following the dot
    (.), called the extension, as an indicator of the file''s purpose.


    The maximum length of a file name depends upon the file system used on your operating
    system. For example, your file system may allow a maximum file name length of
    255 characters (the default), or it may allow a maximum file name length of only
    14 characters. Because knowing the maximum file'
