    # 8.3 Bourne Shell Features


    This section describes the following Bourne shell features:


    +   - A sample .profile login script

    +   - Metacharacters

    +   - Built-in variables

    +   - Built-in commands


    # 8.3.1 Sample .profile Login Script


    If your login shell is the Bourne shell, the operating system executes the .profile
    login script to set up your environment.


    The .profile login script variables that are exported are passed to any subshells
    and subprocesses that are created. Variables that are not exported are used only
    by the login shell.


    In the following .profile login script, shell variables are set and exported,
    a trap is set for the logout script, and the system is instructed to display information.
    Table 8-8 explains each part of the script.


    ```

    # Set PATH

    PATH=/usr/bin:/usr/local/bin:

    # Export global variables

    export PATH

    # Set shell variables

    PS1=''$LOGNAME $ ''

    CDPATH=.:..:$HOME

    # Set up for logout script

    trap "echo logout; $HOME/.logout" 0

    # Display status information

    date

    echo "Currently logged in users:" ; users

    ```'
