    When the background process starts, the system assigns it a PID (Process Identification)
    number (24 in this example), displays it, and then prompts you for another command.
    Your process number will be different from the one shown in this and following
    examples.


    If you use the Korn or POSIX shell or the C shell, job numbers are assigned as
