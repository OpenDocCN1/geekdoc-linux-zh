- pgno: 185
  md: 'For more detailed information on file name completion, see the ksh(1) and sh(1p)
    reference page.


    # 8.4.6  Aliases


    The command aliases feature lets you abbreviate command lines or rename commands.
    You do this by creating `aliases` for command lines that you frequently use.


    For example, assume that you often need to move to the directory `/usr/chang/reports/status`.
    You can create an alias `status`, which will move you to that directory whenever
    you enter it on the command line.


    In addition, aliases let you make up more descriptive names for commands. For
    example, you could define an alias named `rename` for the `mv` command.


    To create aliases, use the alias command. The general format of the alias command
    is the following:


    ```

    alias aliasname=command

    ```


    The `aliasname` entry specifies the name you want to use. The `command` entry
    specifies either the original command or a series of commands. If the command
    has more than one part (has spaces), enclose the whole expression in single quotes.


    For example, to create the alias `status` that moves you to the directory `/usr/chang/reports/status`,
    enter the following command:


    ```

    alias status=''cd /usr/chang/reports/status''

    ```


    The usual way to define aliases is to place them in your `.kshrc` file so that
    you can use them whenever you log in or start a new shell. See Section 8.4.1 for
    an example.


    To display all alias definitions, enter the following command:


    ```

    $ alias

    ```


    To display the definition of a particular alias, enter the following command:


    ```

    $ alias aliasname

    ```


    The `aliasname` entry specifies the particular alias for which you are requesting
    a definition.


    The Korn or POSIX shell lets you export the aliases you create. Aliases that are
    exported are passed to any subshells that are created so that when you execute
    a shell procedure or new shell, the alias remains defined. (Aliases that are not
    exported are used only by the login shell.)'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'To export an alias, use the following form of the alias command:


    ```

    alias -x aliasname=command

    ```


    The -x flag specifies that you want to export the alias. The aliasname entry specifies
    the name you want to use. The command entry specifies either the original command
    or a series of commands. If the command has more than one part, enclose the whole
    expression in single quotes.


    For example, to export an alias definition for the rm command, enter the following:


    ```

    alias -x rm=''rm -i ''

    ```


    You can enter the preceding command in one of two ways:


    +   - Edit the .kshrc or .profile file if you want an alias exported whenever
    you log in

    +   - Export an alias on the command line if you want the alias exported only
    for the current login session


    To remove an alias for the current login session, use the unalias command.


    The general format of the unalias command is the following:


    ```

    unalias aliasname

    ```


    The aliasname entry specifies the alias you want to remove.


    To remove an alias for the current and all future login sessions, do the following:


    +   1. Enter the following command:

    +      $ unalias aliasname

    +      The aliasname entry specifies the alias you want to remove.

    +   2. Edit the .kshrc file (or the file on your system that contains alias definitions)
    and remove the alias definition. Then, save the file.

    +   3. Enter the following command to reexecute the .kshrc file:

    +      $ . ./ .kshrc


    The Korn or POSIX shell provides additional aliasing features. For complete information
    on using aliases with the Korn or POSIX shell, see the ksh(1) or sh(1) reference
    pages.


    # 8.4.7 Built-In Variables


    The Korn and POSIX shells provide variables that can be assigned values. The shell
    sets some of these variables, and you can set or reset all of them.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Table 8-16 describes selected Korn or POSIX shell built-in variables that are
    of the most interest to general users. For complete information on all Korn or
    POSIX shell built-in variables, see the ksh(1) or sh(1p) reference pages.


    # Table 8-16: Built-In Korn or POSIX Shell Variables


    | Variable | Description |

    |---|---|

    | HOME | Specifies the name of your login directory. The cd command uses the value
    of HOME as its default value. In Korn or POSIX shell procedures, use HOME to avoid
    having to use full pathnames — something that is especially helpful if the pathname
    of your login directory changes. The HOME variable is set by the login command.
    |

    | PATH | Specifies the directories through which your system should search to
    find and execute commands. The shell searches these directories in the order specified
    here. Usually, PATH is set in the .profile file. |

    | CDPATH | Specifies the directories that the cd command will search to find the
    specified argument to cd. If the cd argument is null, or if it begins with a slash
    (/), dot (.), or dot dot (..), then CDPATH is ignored. Usually, CDPATH is set
    in your .profile file. |

    | MAIL | The pathname of the file where your mail is deposited. Usually, MAIL
    is set in your .profile file. |

    | MAILCHECK | Specifies in seconds how often the shell checks for mail (600 seconds
    is the default). If the value of this variable is set to 0, the shell checks for
    mail before displaying each prompt. Usually, MAILCHECK is set in your .profile
    file. |

    | SHELL | Specifies your default shell. This variable should be set and exported
    by your .profile file. |

    | PS1 | Specifies the Korn or POSIX shell prompt. Its default value is the dollar
    sign ($). The PS1 variable is usually set in your .profile file. |

    | PS2 | Specifies the secondary prompt string – the string that the shell displays
    when it requires more input after entering a command line. The standard secondary
    prompt string is a > symbol followed by a space. The variable PS2 is usually set
    in your .profile file. |

    | HISTFILE | Specifies the pathname of the file that will be used to store the
    command history. This variable is usually set in your .profile file. |

    | EDITOR | Specifies the default editor for command line editing at the shell
    prompt and for file name completion. This variable is usually set in your .profile
    file. |

    | FCEDIT | Specifies the default editor for the fc command. This variable is usually
    set in your .profile file. |

    | HISTSIZE | Specifies the number of previously entered commands that are accessible
    by this shell. The default is 128. This variable is usually set in your .ksrc
    file. |'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 8.4.8 Built-In Commands


    Table 8-17 describes selected Korn or POSIX shell commands that are of the most
    interest to general users. For a complete list of shell built-in commands, or
    for more information on the commands listed, see the ksh(1) or sh(1p) reference
    pages. Most of these commands also have a reference page that you can access as
    described in Section 1.6.1.


    # Table 8-17: Korn or POSIX Shell Built-In Commands


    | Command | Description |

    |---|---|

    | alias | Assigns and displays alias definitions. For more information about the
    alias command, see Section 8.4.6. |

    | cd | Lets you change directories. If no directory is specified, the value of
    the HOME shell variable is used. The CDPATH shell variable defines the search
    path for this command. For more information about the cd command, see Chapter
    4 and the csh(1) reference page. |

    | echo | Writes arguments to the standard output. |

    | export | Marks the specified variable for automatic export to the environments
    of subsequently executed commands. For more information about the export command,
    see Section 8.4.1. |

    | fc | Lets you display, edit, and reexecute the contents of the command history
    buffer. For more information about the fc command, see Section 8.4.4. |

    | history | Displays the contents of the command history buffer. For more information
    about the history command, see Section 8.4.6. |

    | jobs | Displays the job number and the PID number of current background processes.
    For more information about the jobs command, see Section 6.4.1. |

    | pwd | Displays the current directory. For more information about the pwd command,
    see Chapter 2. |

    | set | Assigns and displays variable values. For more information about the set
    command, see Chapter 7. |

    | times | Displays the accumulated user and system times for processes run from
    the shell. |

    | trap | Runs a specified command when the shell receives a specified signal.
    For more information about the trap command, see Chapter 7. |

    | umask | Specifies the permissions to be subtracted from the default permissions
    set by the creating program for all new files created. For information about the
    umask command, see Chapter 5 and Section 8.4.1. |'
