    # 4.2.3 Accessing Directories Through Symbolic Links


    When directories are connected through a symbolic link, the parent directory you
    access with the cd command differs depending upon whether you are specifying the
    actual directory name or the relative directory name. In particular, using the
    full pathname to find the parent of a symbolically linked directory results in
    accessing the actual parent directory.


    For example, suppose user2 is working on a file in the /u/user2/project directory,
    which is the symbolic link to /u/user1/project. To change to the actual parent
    directory (/u/user2), user2 types the following:


    ```

    $ cd /u/user2

    $ pwd

    /u/user2

    $

    ```


    If user2 specified the relative directory name (..), the parent directory of the
    symbolic link would be accessed. For example, suppose user2 is working on the
    same file in the /u/user2/project directory, which is the symbolic link to /u/user1/project.
    To access the parent directory of the symbolic link, user2 enters the following:


    ```

    $ cd ..

    $ pwd

    /u/user1

    $

    ```


    Instead of being in the /u/user2 directory, user2 is now in the directory called
    /u/user1.


    For background information on symbolic links, see Section 3.4.


