- pgno: 280
  md: 'command is used to save an entire file to the current directory. The format
    of the write command is:


    ```

    :w filename

    ```


    The entry of filename is optional and is used only when you want to save a file
    under a different file name. Omitting filename from the command automatically
    saves a file to it''s current file name. When you enter the :w command, the current
    file name, number of lines, and number of characters is displayed at the bottom
    of your screen. If you entered a new file name, the new file name will be displayed.


    # Note


    If you specify a new file name with the :w command, you will have two files saved
    in your directory: the new file name you just entered and the original file name.


    If you are finished making changes to a file, you can save the file and quit vi
    at the same time. The format of the write and quit command is:


    ```

    :wq

    ```


    The :wq command saves a file to the same file name, quits vi, and brings you back
    to your shell prompt.


    You also have the option to quit a file and vi simultaneously without saving the
    changes you may have made. This option is useful if, for example, you have deleted
    many lines of information by mistake and you want to start all over again. Quitting
    vi will restore your file to its original state. However, quitting vi to restore
    a file to its original state will only work if you have not saved the file previously
    during the current editing session. To quit your file and vi without saving your
    changes enter:


    ```

    :q!

    ```


    Quitting a file with the :q! command will not delete the file from your directory.
    Your file will still reside in the directory, but it will not contain any of the
    changes you may have made.


    Table A-1 summarizes the commands used to save files and quit the vi editor.'
