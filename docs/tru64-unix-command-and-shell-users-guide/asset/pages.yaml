    # 5.5 Setting Default Permissions with the User Mask


    Every time you create a file or a directory, default permissions are established
    for it. These default permissions are initially established either by the operating
    system or the program you are running (both will be considered to be the creating
    program in the umask description that follows). Setting default permissions relieves
    you from the task of specifying permission codes explicitly every time you create
    a file or directory. The operating system assigns the default permission values
    of 777 for executable files and 666 for all other files.


    If you want to further restrict the permissions established by a program when
    it creates a file or directory, you must specify a user mask with the umask command.


    The user mask is a numeric value that determines the access permissions when a
    file or directory is created. As a result, when you create a file or directory,
    its permissions are set to what the creating program specifies, minus what the
    umask value forbids.


    The umask command has the following format:


    ```

    umask octalnumber

    ```


    The octalnumber entry is a 3-digit octal number that specifies the permissions
    to be subtracted from the default permissions (777 or 666).


    Setting the user mask is very similar to setting the permission bits discussed
    in Section 5.4.2. The permission code for a file or directory is specified with
    a 3-digit octal number. Each digit represents a type of permission. The position
    of each digit (first, second, or third) represents 3 bits that correspond to the
    following:


    +   - The first digit is for the owner of the file (you).

    +   - The second digit is for the group of the file.

    +   - The third digit is for others.


    When you set the umask, you actually are specifying which permissions are not
    to be granted regardless of the permissions requested by the file creating program.


    Table 5-4 lists the eight possible umask permission combinations for easy reference.
    The umask permission values are the inverse of those specified for regular permission
    codes. These permission values are applied to those set by the creating program.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Table 5-4: The umask Permission Combinations


    | Column Head | Allowed Permissions | Description |

    |---|---|---|

    | 0 | rwx | Read/write/execute |

    | 1 | rw- | Read/write |

    | 2 | r-x | Read/execute |

    | 3 | r-- | Read |

    | 4 | -wx | Write/execute |

    | 5 | -w- | Write |

    | 6 | --x | Execute |

    | 7 | --- | No permissions granted |


    For example, if you specify a user mask of 027 (and the file is executable):


    +   - The owner is allowed all permissions requested by the program creating the
    file.

    +   - The group is not allowed write permission.

    +   - The others are not allowed any permissions.


    A good user mask value to set for your own files and directories depends upon
    how freely information resources are shared on your system. The following guidelines
    may be useful:


    +   - In a very open computing environment, you might specify 000 as a user mask
    value, which allows no restrictions on file/directory access. As a result, when
    a program creates a file and specifies permission codes for it, the user mask
    imposes no restrictions on what the creating program has specified.

    +   - In a more secure computing environment, you might specify 066 as a user
    mask value, which allows you total access but prevents all others from being able
    to read or write to your files. As a result, when a file is created, its permissions
    are set to what the creating program specifies, minus the user mask restrictions
    that prevent read/write access for everyone but you.

    +   - In a very secure computing environment, you might specify 077 as a user
    mask value, which means that only you have access to your files. As a result,
    when a file is created, its permissions are set to what the creating program specifies,
    minus the user mask restrictions that prevent anyone else from reading, writing,
    or executing your files.


    To show you how umask works, assume that you have entered the following command:'
  merge: -1
  img_proc: true
