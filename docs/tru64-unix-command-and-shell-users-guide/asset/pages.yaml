    usernames A list of users who belong to the group.


    # 5.2 Protecting Files and Directories


    The operating system has a number of commands that enable you to control access
    to your files and directories. You can protect a file or directory by setting
    or changing its permissions, which are codes that determine the way in which anyone
    working on your system can use the stored data.


    Setting or changing permissions is also referred to as setting or changing the
    protections on your files or directories. You generally protect your data for
    one or both of the following reasons:


    +   - Your files and directories contain sensitive information that should not
    be available to everyone who uses your system.

    +   - Not everyone who has access to your files and directories should have the
    permission to alter them.


    > Caution

    > Your system may allow two or more users to make changes to the same file at
    the same time without informing them. If this is so, the system saves the changes
    made by the last user to close the file; changes made by the other users are lost
    (some text editors warn users of this situation). It is therefore a good idea
    to set file permissions to allow only authorized users to modify files. The specified
    users should then communicate about when and how they are using the files.


    Each file and each directory has nine permissions associated with it. Files and
    directories have the following three types of permissions:


    +   - r (read)

    +   - w (write)

    +   - x (execute)


    These three permissions occur for each of the following three classes of users:


    +   - u (user/owner)

    +   - g (group)

    +   - o (all others; also known as world)'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The r permission lets users view or print the file. The w permission lets users
    write to (modify) the file. The x permission lets users execute (run) the file
    or search directories.


    The user/owner of a file or directory is generally the person who created it.
    If you are the owner of a file, you can change the file permissions with the chmod
    command, which is described in Section 5.4.


    The group specifies the group to which the file belongs. If you are the owner
    of a file, you can change the group ID of the file with the chgrp command, which
    is described in Section 5.8.


    > Note

    > If you do not own a file, you cannot change its permissions or group ID unless
    you have superuser authority. See Section 5.7 for more information.


    The meanings of the three types of permissions differ slightly between ordinary
    files and directories. See Table 5-1 for more information.


    # Table 5-1: Differences Between File and Directory Permissions


    | Permission | For a File | For a Directory |

    |---|---|---|

    | r (read) | Contents can be viewed or printed. | Contents can be read, but not
    searched. Usually r and x are used together. |

    | w (write) | Contents can be changed or deleted. | Entries can be added or removed.
    |

    | x (execute) | File can be used as a program. | Directory can be searched. |


    # 5.3 Displaying File and Directory Permissions (ls)


    To display the current file permissions, enter the ls command with the -l flag.
    To display the permissions for a single file or selected files, enter the following
    command:


    ```

    $ ls -l filename

    ```


    The filename entry can be the name of the file or a list of file names separated
    by spaces. You may also use pattern-matching characters to specify files. See
    Section 5.4.1.3 for more information.


    To display the permissions for all of the files in your current directory, enter
    the ls -l command:


    ```

    $ ls -l

    total 7

    ```'
  merge: -1
  img_proc: true
- pgno: 99
  md: '```

    -rw-r--r-- 1 larry system 101 Jun 5 10:03 file1

    -rw-r--r-- 1 larry system 171 Jun 5 10:03 file2

    -rw-r--r-- 1 larry system 130 Jun 5 10:06 file3

    drwxr-xr-x 2 larry system 32 Jun 5 10:07 project

    -rw-r--r-- 1 larry system 0 Jun 5 11:03 record1

    -rw-r--r-- 1 larry system 0 Jun 5 11:03 record6

    drwxr-xr-x 2 larry system 32 Jun 5 10:31 reports

    $

    ```


    The first string of each entry in the directory shows the permissions for that
    file or directory. For example, the fourth entry, drwxr-xr-x, shows the following:


    +   - This is a directory (the d notation)

    +   - The owner can view it, write in it, and search it (the rwx sequence)

    +   - The group can view it and search it, but not write in it (the first r-x
    sequence)

    +   - All others can view it and search it, but not write in it (the second r-x
    sequence)


    The third field shows the file''s owner, (in this case, larry), and the fourth
    field shows the group to which the file belongs, (in this case, system).


    To list the permissions for a single directory, use the ls -ld command:


    ```

    $ ls -ld reports

    drwxr-xr-x 2 larry system 32 Jun 5 10:31 reports

    $

    ```


    Taken together, all the permissions for a file or directory are called its permission
    code. As Figure 5-1 shows, a permission code consists of four parts:


    +   - A single character shows the file type. The dash (-) indicates an ordinary
    file, d a directory, and l a symbolic link. Any other character indicates an I/O
    (Input/Output) device.

    +   - A 3-character permission field shows user (owner) permissions, which may
    be any combination of read, write, and execute.

    +   - Another 3-character permission field shows group permissions.

    +   - Another 3-character permission field shows permissions for all others.'
  merge: -1
