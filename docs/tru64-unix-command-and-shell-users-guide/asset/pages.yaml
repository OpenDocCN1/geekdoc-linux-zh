- pgno: 101
  md: "# 5.4 Setting File and Directory Permissions (chmod)\n\nYour ability to change\
    \ permissions gives you a great deal of control over the way your data can be\
    \ used. Use the chmod (change mode) command to set or change the permissions for\
    \ your files and directories.\n\nFor example, you obviously permit yourself to\
    \ read, modify, and execute a file. You generally permit members of your group\
    \ to read a file. Depending upon the nature of your work and the composition of\
    \ your group, you often let them modify or execute it. You generally prohibit\
    \ all other system users from having any access to a file.\n\n> Note\n> \n> You\
    \ must be the owner of the file or directory (or have superuser authority) before\
    \ you can change its permissions. This means that your user name must be in the\
    \ third field in an ls -l listing of that file.\n\nIt is important to realize\
    \ that whatever restrictions you impose on file and directory access, the superuser\
    \ can always override them. For example, if you use the chmod command to specify\
    \ that only you can have access to the report20 file, the superuser can still\
    \ access this file. For more information on this topic, see Section 5.7.\n\nThere\
    \ are two ways to specify the permissions set by the chmod command:\n\n+   - You\
    \ can specify permissions with letters and operation symbols.\n+   - You can specify\
    \ permissions with octal numbers.\n\nThe following sections describe how to specify\
    \ permissions with letters and operation symbols, as well as with octal numbers.\n\
    \n# 5.4.1 Specifying Permissions with Letters and Operation Symbols\n\nYou can\
    \ use letters and operation symbols to change file and directory permissions.\n\
    \nThe following is the format of the chmod command when using letters and operation\
    \ symbols:\n\n```\nchmod userclass-operation-permission filename\n```\n\nThe userclass-operation-permission\
    \ entry actually represents three codes that specify the user class, group, operation,\
    \ and permission code that you want to activate. The filename entry is the name\
    \ of the file or files whose permissions you want to change. You may also use\
    \ pattern-matching characters to specify files. See Section 5.4.1.3 for more information."
  merge: -1
  img_proc: true
- pgno: 102
  md: 'User classes, operations, and permissions are defined as follows:


    +   - Use one or more of these letters to represent the *userclass*:

    +     u  User (owner)

    +     g  Group

    +     o  All others (besides owner and group)

    +     a  All (user, group, and all others)

    +   - Use one of these symbols to represent the *operation*:

    +     +  Add permission

    +     -  Remove permission

    +     =  Assign permission regardless of previous setting

    +   - Use one or more of these letters to represent the type of *permission*:

    +     r  Read

    +     s  Set user or group ID

    +     w  Write

    +     x  Execute


    # 5.4.1.1 Changing File Permissions


    In the following example, first enter the ls -l command to display the permissions
    for the file1 file:


    ```

    $ ls -l file1

    -rw-r--r-- 1 larry system 101 Jun 5 10:03 file1

    $

    ```


    The owner (larry) has read/write permissions while the group and others have only
    read permissions.


    Now, enter the chmod command with the flags go+w. This command expands the permissions
    for both the group (g) and for others (o) by giving them write access (+w) to
    file1 in addition to the read access they already have:


    ```

    $ chmod go+w file1

    $

    ```


    Next, list the new permissions for the file:


    ```

    $ ls -l file1

    -rw-rw-rw- 1 larry system 101 Jun 5 10:03 file1

    $

    ```


    You have given your group and all other system users write permission to file1.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# ### 5.4.1.2 Changing Directory Permissions


    The procedure for changing directory permissions is the same as that for changing
    file permissions. However, to list the information about a directory, you use
    the `ls -ld` command:


    ```

    ```text

    $ ls -ld project

    drwxr-xr-x  2 larry  system  32 Jun 5 10:07 project

    $

    ```

    ```


    Now change the permissions with the `chmod g+w` command so that the group (g)
    has write permission (+w) for the directory project:


    ```

    ```text

    $ chmod g+w project

    $ ls -ld project

    drwxrwxr-x  2 larry  system  32 Jun 5 10:07 project

    $

    ```

    ```


    # ### 5.4.1.3 Using Pattern-Matching Characters


    If you want to make the same change to the permissions of all entries in a directory,
    you can use the pattern-matching character (*) with the chmod command. For information
    on pattern-matching characters, see Chapter 2.


    In the following example, the command `chmod g+x *` gives execute (x) permission
    to the group (g) for all files (*) in the current directory:


    ```

    ```text

    $ chmod g+x *

    $

    ```

    ```


    Now enter the `ls -l` command to show that the group now has execute (x) permission
    for all files in the current directory:


    ```

    ```text

    $ ls -l

    total 7

    -rw-rwxrw-  1 larry  system  101 Jun 5 10:03 file1

    -rw-r-xr--  1 larry  system  171 Jun 5 10:03 file2

    -rw-r-xr--  1 larry  system  130 Jun 5 10:06 file3

    drwxrwxr-x  2 larry  system   32 Jun 5 10:07 project

    -rw-r-xr--  1 larry  system    0 Jun 5 11:03 record1

    -rw-r-xr--  1 larry  system    0 Jun 5 11:03 record6

    drwxr-xr-x  2 larry  system   32 Jun 5 10:31 reports

    $

    ```

    ```


    # ### 5.4.1.4 Setting Absolute Permissions


    An absolute permission assignment (=) resets all permissions for a file or files,
    regardless of how the permissions were set previously.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'In Example 5-1, the ls -l command lists the permissions for the file3 file.
    Then the chmod a=rwx command gives all three permissions (rwx) to all users (a).


    # Example 5-1: Setting Absolute Permissions


    ```

    $ ls -l file3

    -rw-r-xr--  1 larry  system  130 Jun 5 10:06 file3

    $ chmod a=rwx file3

