    # 3.4 Linking Files (ln)


    A link is a connection between a file name and the file itself. Usually, a file
    has one link – a connection to its original file name. However, you can use the
    ln (link) command to connect a file to more than one file name at the same time.


    Links are convenient whenever you need to work with the same data in more than
    one place. For example, suppose you have a file containing assembly-line production
    statistics. You use the data in this file in two different documents — in a monthly
    report prepared for management, and in a monthly synopsis prepared for the line
    workers.


    You can link the statistics file to two different file names, for example, mgmt.stat
    and line.stat, and place these file names in two different directories. In this
    way, you save storage space because you have only one copy of the file. More importantly,
    you do not have to update multiple files. Because mgmt.stat and line.stat are
    linked, editing one automatically updates the other, and both file names always
    refer to the same data.


    # 3.4.1 Hard Links and Soft Links


    There are two kinds of links available for your use: hard links and soft, or symbolic,
    links.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - Hard links let you link only files in the same file system. When you
    create a hard link, you are providing another name for the same file. All the
    hard link names for a file, including the original name, are on equal footing.
    It is incorrect to think of one file name as the real name, and another as only
    a link.


    +   - Soft links or symbolic links let you link both files and directories. In
    addition, you may link both files and directories across different file systems.
    A symbolic link is actually a distinct file that contains a pointer to another
    file or directory. This pointer is the pathname to the destination file or directory.
    Only the original file name is the real name of the file or directory. Unlike
    a hard link, a soft link is actually only a link.


    With both hard and soft links, changes made to a file through one name appear
    in the file as seen through another name.


    A major difference between hard and soft links occurs when removing them. A file
    with hard-linked names persists until all its names have been removed. A file
    with soft-linked names vanishes when its original name has been removed; any remaining
    soft links then point to a nonexistent file. See Section 3.4.5.


    # 3.4.2 Links and File Systems


    The term file system as used in this discussion of links differs from its earlier
    usage in this book. Previously, a file system was defined as a useful arrangement
    of files into a directory structure. Here, the same term acquires a more precise
    meaning: the files and directories contained within a single disk partition. A
    disk partition is a physical disk, or a portion of one, that has been prepared
    to contain file directories.


    You can use the df command to discover the name of the disk partition that holds
    any particular directory on your operating system. Here is an example in which
    df shows that the directories /u1/info and /etc are in different file systems,
    but that /etc and /tmp are in the same file system:


    ```

    $ df /u1/info

    Filesystem 512-blks  used avail capacity Mounted on

    /dev/rz2c   196990  163124  14166    92%   /u1

    $ df /etc

    Filesystem 512-blks  used avail capacity Mounted on

    /dev/rz3a   30686   19252   8364    70%   /

    $ df /tmp

    Filesystem 512-blks  used avail capacity Mounted on

    /dev/rz3a   30686   19252   8364    70%   /

    $

    ```


    For more information on the df command, see the df(1) reference page.'
