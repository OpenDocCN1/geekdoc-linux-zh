  md: '# 8.4 Korn or POSIX Shell Features


    The POSIX shell is another designator for the Korn shell that signifies compliance
    with the IEEE POSIX.2 standard. This section describes the following Korn or POSIX
    shell features:


    +   - Sample .profile and .kshrc login scripts

    +   - Metacharacters

    +   - Command history

    +   - Editing command lines

    +   - File name completion

    +   - Aliases

    +   - Built-in variables and commands


    # 8.4.1 Sample .profile and .kshrc Login Scripts


    If your login shell is the Korn or POSIX shell, the operating system processes
    the .profile login script in your home directory. The .profile login script defines
    environment variables. These variables are used by your login shell as well as
    any subshells and subprocess that are created. The .profile login script is executed
    only when you log in.


    The .kshrc login script sets up your Korn or POSIX shell environment by defining
    variables and operating parameters for the local shell process. It is executed
    each time you create a subshell.


    > Note

    > Before creating a .kshrc file in your home directory, make sure that the ENV=$HOME/.kshrc
    environment variable is set and exported in your .profile. Once this is done,
    the .kshrc login script will execute each time you log in and each time you create
    a subshell.


    In the following .profile login script, global environment variables are set and
    exported, and shell variables are set. Table 8-12 explains each part of the script.


    ```

    # Set environment variables

    PATH=/usr/bin:/usr/local/bin:

    ENV=$HOME/.kshrc

    EDITOR=vi

    FCEDIT=vi

    PS1="''hostname'' [!] $ "

    ```'
