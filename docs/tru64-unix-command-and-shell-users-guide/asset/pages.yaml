  md: 'For example, assume that you often need to move to the directory /usr/chang/reports/status.
    You can create an alias status, which will move you to that directory whenever
    you enter it on the command line.


    In addition, aliases let you make up more descriptive names for commands. For
    example, you could define an alias named rename for the mv command.


    To create aliases, use the alias command. The format of the alias command is:


    ```

    alias aliasname command

    ```


    The aliasname entry specifies the name you want to use. The command entry specifies
    either the original command or a series of commands. If the command has more than
    one part (has spaces), enclose the whole expression in single quotes ('' '').


    For example, to create the alias status that moves you to the directory /usr/chang/reports/status,
    enter the following command:


    ```

    % alias status ''cd /usr/chang/reports/status''

    ```


    The usual way to define aliases is to make them a permanent part of your environment
    by including them in your .cshrc file. As a result, you can use the aliases whenever
    you log in or start a new shell. See Section 8.2.1 for an example.


    To display all alias definitions, enter the following command:


    ```

    % alias

    ```


    To display the definition of a particular alias, enter the following command:


    ```

    % alias aliasname

    ```


    The aliasname entry specifies the particular alias for which you are requesting
    a definition.


    To remove an alias for the current login session, use the unalias command. The
    general format of the unalias command is the following:


    ```

    unalias aliasname

    ```


    The aliasname entry specifies the alias you want to remove.


    To remove an alias for the current and all future login sessions, do the following:


    +   1. Enter the following command:

    +      % unalias aliasname

    +      The aliasname entry specifies the alias you want to remove.

    +   2. Edit the .cshrc file and remove the alias definition. Then, save the file.

    +   3. Enter the following command to reexecute the .cshrc file:'
