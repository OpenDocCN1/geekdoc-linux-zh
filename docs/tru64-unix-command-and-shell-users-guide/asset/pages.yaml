    You can use the relative directory name dot dot (..) to refer to files and directories
    located above the current directory in the file system tree structure. That is,
    if you want to move up the directory tree one level, you can use the relative
    directory name for the parent directory rather than using the full pathname.


    In the following example, the cd .. command changes the current directory from
    reports to your login directory, which is the parent directory of reports. Remember
    that the /u/urname entry represents your login directory.


