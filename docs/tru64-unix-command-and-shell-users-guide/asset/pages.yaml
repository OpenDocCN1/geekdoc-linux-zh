- pgno: 346
  md: '# Table E–1: Escape Commands in mailx (cont.)


    | Command | Description |

    |---|---|

    | `-rfile` | Reads the named file into the mail message. |

    | `<<file` | If the argument begins with an exclamation point (`!`), the rest
    of the string is taken as an arbitrary system command and is executed with the
    standard output inserted into the mail message. |

    | `~ssubject` | Makes *subject* the new subject heading, replacing the previous
    heading. |

    | `~tname...` | Adds the names to the To: list of your message. |

    | `~v` | Invokes the editor specified by the VISUAL mail variable to edit the
    message. |

    | `~wfile` | Writes the message to the named file. |

    | `~\|command`<br>`~^command` | Pipes the message through the named command. This
    is useful to make global changes in the message; for example, if you are including
    a message in your new message you can use the sed editor to prefix each line with
    an angle bracket and a space by using the following command:<br><br>`~\|sed ''s/^/>
    /''`<br><br>You can then add your own text; the result will look like this:<br><br>>
    This is the text of the message<br>> you have included.<br><br>This is the text
    you add yourself. |'
  merge: -1
  img_proc: true
