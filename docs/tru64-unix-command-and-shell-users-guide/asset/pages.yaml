    This command establishes a permission code of 740 (if the file is executable)
    and produces the following results:


    +   - You (the owner) are allowed all permissions.

    +   - Members of your group are not allowed write and execute permissions.

    +   - All others are not allowed any permissions.


    Further, assume that you have just created a file. By default, your editor always
