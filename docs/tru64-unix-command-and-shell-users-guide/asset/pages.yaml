- pgno: 300
  md: '# B


    # Creating and Editing Files with ed


    This appendix explains how to create, edit (modify), display, and save text files
    with ed, a line editing program. If your system has another editing program, you
    may want to learn how to do these tasks with that program.


    A good way to learn how ed works is to try the examples in this appendix on your
    system. Since the examples build upon each other, it is important for you to work
    through them in sequence. Also, to make what you see on the screen consistent
    with what you see in this guide, it is important to do the examples just as they
    are given.


    In the examples, everything you should enter is printed in boldface. When you
    are told in the text to enter something, you should enter all of the information
    for that line and then press Return.


    Because ed is a line editor, you can work with the contents of a file only one
    line at a time. Regardless of what text is on the screen, you can edit only the
    current line. If you have experience with a screen editing program, you should
    pay careful attention to the differences between that program and ed. For example,
    with the ed program, you cannot use the Cursor Up and Cursor Down keys to change
    your current line.


    # B.1 Understanding Text Files and the Edit Buffer


    A file is a collection of data stored together in the computer under an assigned
    name. You can think of a file as the computer equivalent of an ordinary file folder
    – it may contain the text of a letter, a report, or some other document, or the
    source code for a computer program.


    The edit buffer is a temporary storage area that holds a file while you work with
    it – the computer equivalent of the top of your desk. When you work with a text
    file, you place it in the edit buffer, make your changes to the file (edit it),
    and then transfer (copy) the contents of the buffer to a permanent storage area.


    The rest of this appendix explains how to create, display, save, and edit (modify)
    text files with the ed editor.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# B.2 Creating and Saving Text Files


    To create and save a text file, perform the following steps. The following sections
    describe these steps in detail.


    +   1. At the shell prompt, enter the following command:

    +   $ ed filename

    +   The filename argument is the name of the file you want to create or edit.


    +   2. When you receive the ? filename message, enter the following append command:

    +   a


    +   3. Enter your text.


    +   4. Enter a dot (.) at the start of a new line to stop adding text.


    +   5. Enter the following command to copy the contents of the edit buffer into
    the filename file:

    +   w


    +   6. Enter the following command to end the ed program:

    +   q


    # B.2.1 Starting the ed Program


    To start the ed program, enter a command of the form ed filename after the shell
    prompt ($).


    In the following example, the ed afile command starts the ed program and indicates
    that you want to work with a file named afile:


    ```

    $ ed afile

    ?afile

    _

    ```


    The ed program responds with the message ?afile, which means that the file does
    not exist. You can now use the a (append) subcommand (described in the next section)
    to create afile and put text into it.


    # B.2.2 Entering Text – The a (append) Subcommand


    To put text into your file, enter a. The a subcommand tells ed to add, or append,
    the text you enter to the edit buffer. If your file had already contained text,
    the a subcommand would add the new text to the end of the file.


    Type your text, pressing Return at the end of each line. When you have entered
    all of your text, enter a dot (.) at the start of a new line.'
  merge: -1
  img_proc: true
