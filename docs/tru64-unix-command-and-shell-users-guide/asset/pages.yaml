- pgno: 344
  md: '# Using Escape Commands in Your mailx Session


    There is a special set of commands, called **escape commands** or **escapes**,
    that perform functions while you are in the process of writing a message.


    You use an escape command by entering it on a line by itself, with a tilde (~)
    as the very first character. The tilde is called an escape character because it
    signals mailx to escape from the current editing environment to perform the command
    that follows. You may change the escape character by setting the escape mail variable.
    If you want to type a real tilde as the very first character on a line in your
    message, you must type two tildes.


    Table E-1 describes the escape commands.


    **Table E-1: Escape Commands in mailx**


    | Command | Description |

    |---|---|

    | ~~ | Enters the tilde (~) character in the body of the mail message. |

    | ~! command | Executes the shell command you enter. |

    | ~? | Prints a brief summary of escape commands. |

    | ~: command

    ~_command | Executes the specified mail command. This is useful for performing
    housekeeping tasks such as redisplaying a message.

    For example, entering ~:10 selects and displays message number 10 just as if you
    had entered its number at the mailx prompt. |

    | ~a | Inserts the string set in sign into the mail message. |

    | ~A | Inserts the string set in Sign into the mail message. |

    | ~baddress_list | Inserts the specified names in address_list into the Bcc: (blind
    carbon copy) list. |

    | ~caddress_list | Adds the specified names to the Cc (carbon copy) list. |

    | ~C | Dumps core. |'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Table E-1: Escape Commands in mailx (cont.)


    | Command | Description |

    |---|---|

    | -a | Includes the file named `dead.letter`, in your home directory, into the
    message. The mail variable DEAD may be used to point to a different file. |

    | -e | Invokes the editor specified by the EDITOR mail variable to edit the message.
    |

    | -f [msg_list] | Reads the current message or the specified messages into your
    message. |

    | -F[msg_list] | Similar to -f with the difference that all headers will be included
    regardless of any discard, ignore, or retain commands. |

    | -h | Edits the message header fields. This command displays the fields one at
    a time so you can alter them by adding text to the end, by using the Delete key,
    or by pressing Ctrl/U to erase the entire field and then retyping it. Use this
    command with caution. |

    | -i string | Inserts the value of the named variable into the mail message.

    For example: the command -a is equivalent to the command -i sign to insert your
    signature into the message. |

    | -m[msg_list] | Includes the current message or the specified messages, shifted
    one tab stop to the right. If the indentprefix mail variable is set, this value
    is inserted before the tab stop. This is useful to set off messages you are forwarding
    as part of your new message. |

    | -M[msg_list] | Similar to -m with the difference that all headers will be included
    regardless of any discard, ignore, or retain commands. |

    | -p | Displays the message you are composing on your terminal. This is useful
    to see that the message looks the way you want it to and that it includes the
