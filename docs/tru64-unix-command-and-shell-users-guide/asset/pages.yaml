- pgno: 272
  md: 'This output is the same as the output produced by the command uustat -a -s
    sky.


    # 14.8.1.2 Displaying the Current Queue Output with uustat Options


    To examine the status of all UUCP jobs currently executing or queued to run on
    each host (the current queue) enter the uustat -q command as shown here with example
    output:


    ```

    % uustat -q

    sea 3C Mon Jul 13 09:14:35 1999 NO DEVICES AVAILABLE

    sun 2C Mon Jul 13 10:02:22 1999 SUCCESSFUL

    gem 1C (2) Mon Jul 13 10:12:48 1999 CAN''T ACCESS DEVICE

    ```


    This example output consists of the following five fields:


    +   - Field 1 – host name

    +   - Field 2 – number of files, either command (C), or executable (X), in the
    holding queue for that host

    +   - Field 3 – number of days (if one or more) that the file has been in the
    holding queue

    +   - Field 4 – date and time when UUCP last tried to communicate with the host
    in field 1

    +   - Field 5 – status message of the interaction


    See the uustat(1) reference page for more information.


    Table 14–10 summarizes uustat command options and required entries.


    # Table 14–10: Options to the uustat Command


    | Option | Description |

    |---|---|

    | -a | Displays information for all jobs in the holding queue, regardless of the
    user who entered the original UUCP command. |

    | -k jobid | Cancels the UUCP process specified by jobid. You can cancel a job
    only if you entered the UUCP command specified by jobid. Anyone with superuser
    privileges also can cancel UUCP requests. |

    | -m | Reports on the status of your most recent attempt to communicate with another
    computer through UUCP. For example, the status is reported as successful if the
    UUCP request executed. If the job was not completed, UUCP reports an error message,
    such as Login failed. |

    | -p | Runs a ps -flp (process status: a full, long list of specified process
    IDs) command for all PID numbers in the lock files. You must have superuser privileges
    to use this option. |'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Table 14–10: Options to the uustat Command (cont.)


    | Option | Description |

    |---|---|

    | -q | Lists the jobs currently queued for each host. These jobs are either waiting
    to execute, or in the process of executing. If a status file exists for the host,
    UUCP reports its date, time, and the status information. Once the process is completed,
    UUCP removes the job from the current queue. |

    | -r jobid | Rejuvenates the UUCP process specified by the job identification
    number. This option enables you to mark files in the holding queue with the current
    date and time, to ensure that the cleanup operation does not delete these files
    until the allotted job modification time ends. |

    | -shost | Reports the status of all UUCP requests that users have entered to
    run on the specified host. |

    | -uusername | Reports the status of all UUCP requests entered by the user username.

    You can use both the -shost and the -uusername options with the uustat command
    to get a status report on all UUCP requests entered by a particular user on a
    particular host. |


    # 14.8.2 Using the uulog Command to Display UUCP Log Files


    Whenever the local host uses the uucp, uuto, or uux commands, UUCP log files are
    created. There is a log file for each remote host and for each daemon. The uulog
    command displays these log files. Use uulog to display a summary of uucp, uuto,
    and uux command requests or by host.


    The uulog command displays the contents of the log file activity of either of
    the following daemons:


    +   - The uucico daemon, called by uucp and uuto

    +   The activity of this daemon is logged in /usr/spool/uucp/.Log/uucico/host.

    +   - The uuxqt daemon, called by uux

    +   The activity of this daemon is logged in /usr/spool/uucp/.Log/uuxqt/host.


    To display just the uuxqt log file, use the -x option of uulog, as follows:


    ```

    % /usr/lib/uucp/uulog -x

    ```


    The uulog command also enables you to display the uucico log file or the file
    transfer log for any host, or only a specified number of lines at the end of either
    log file. For example, to display the uucico log file for host sky, use the -s
    option as follows:'
  merge: -1
  img_proc: true
- pgno: 274
  md: '```

    % /usr/lib/uucp/uulog -s sky

    ```


    To display the last 40 lines of the file transfer log for host sky, use the -f
    option and the number option as shown:


    ```

    % /usr/lib/uucp/uulog -f sky -40

    ```


    Table 14-11 summarizes uulog command options and required entries.


    # Table 14-11: Options to the uulog Command


    | Option | Description |

    |---|---|

    | -f host | Performs a tail -f on the file transfer log for the specified host,
    displaying the end of the log file. Use the Interrupt key sequence to leave the
    file and return to the prompt. |

    | -s[host] | Prints information about copy requests involving the specified host.
    If no host is specified, information is displayed for all hosts. |

    | -x[host] | Displays the uuxqt log file for the the specified host. If no host
    is specified, information is displayed for all hosts. |

    | -number | Displays the last number lines of the log file. See the tail(1) reference
    page for the application of this parameter. |


    # 14.8.3 Monitoring UUCP Status


    The uumonitor command is helpful for detecting a host whose status has changed
    due to a backlog of jobs, a temporary shutdown, or a change of either the phone
    number or login password.


    The uumonitor output consists of the following six fields:


    +   - Field 1 – host name

    +   - Field 2 – number of command files queued for the remote host; if too large
    (for example, 100-1000, depending on the host), then the cause of the backlog
    should be determined

    +   - Field 3 – number of requests for remote execution from the remote host

    +   - Field 4 – result of the most recent attempt to connect to the remote host

    +   - Field 5 – number of remote host login failures, not including failed dial
    attempts; if greater than 20, no further attempts are made

    +   - Field 6 – time of last status entry


    For more information, see the uumonitor(8) reference page.'
  merge: -1
  img_proc: true
