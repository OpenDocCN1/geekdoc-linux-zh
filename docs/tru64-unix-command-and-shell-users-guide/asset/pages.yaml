    If you make errors as you enter your text, you can correct them before you press
    Return. Use the Backspace key to erase the incorrect characters. Then enter the
    correct characters in their place.


    # B.2.3  Displaying Text – The p (print) Subcommand


    Use the p (print) subcommand to display the contents of the edit buffer.


    To display a single line, use the np subcommand, where n is the number of the
    line. For example:


    ```

    2p

