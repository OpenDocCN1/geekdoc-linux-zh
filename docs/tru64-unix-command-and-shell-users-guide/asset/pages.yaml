    # 7.4.1.1 Running Commands in Sequence with a Semicolon (`;`)


    You can enter more than one command on a line if you separate commands with the
    semicolon (`;`).


    In the following example, the shell runs `ls` and waits for it to finish. When
    `ls` is finished, the shell runs `who` and so on through the last command:


    ```

