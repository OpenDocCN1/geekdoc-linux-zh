- pgno: 196
  md: '# 10


    # Obtaining Information About Network Users and Hosts


    This chapter describes how to find information about local and remote users and
    hosts before you begin communication or file transfer tasks. The commands described
    in this chapter will enable you to:


    +   - Learn about your own network connection (who am i command, Section 10.1)

    +   - Determine who is currently logged in to the local system and from where
    they are logged in (who command, Section 10.1)

    +   - Find additional information about another user, if available; for example,
    full name, office location, phone number, projects, or plans (finger command,
    Section 10.2.1)

    +   - Determine whether a user can be reached using either the talk or write commands
    (finger command, Section 10.2.1 and Section 10.2.2)

    +   - Analyze and sort information about remote host usage (uptime command, Section
    10.3)

    +   - Determine who is currently logged in to a remote host (rwho command, Section
    10.4)

    +   - Determine whether a remote host is on line (ping command, Section 10.5)


    # Note


    > The commands described in this chapter are, like all TCP/IP operations, subject
    to the security features on the local and remote hosts. If they do not work as
    stated here or in the related reference pages, see your system administrator.


    # 10.1 Identifying Users on the Local Host


    When you log in to a host computer by providing a user name and password, you
    have a unique identity. To verify this information for your own network connection,
    you can use a version of the who command called who am i to display the following
    information about you:'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - Login name

    +   - Terminal name (line)

    +   - Time of login

    +   - Computer from which the network connection came


    For example, user lennon might enter the who am i command at the system prompt
    ($) and read the following output:


    ```

    % who -M am i

    lennon     tty p0     Jul 15 14:17     (walrus)

    ```


    In this example, user lennon logged in from host walrus at 2:17 in the afternoon
    of July 15. The line is tty p0, and walrus is the name for this line, from which
    the network connection came.


    The who am i command can help you keep track of the sessions you have running
    on your workstation. Some sessions may be remote logins to another host by yourself
    or by someone with whom you are working. See the who(1) reference page for more
    information about the who am i command.


    To find out if other users are logged in to the same local host, use the who command.
    In the following example, lennon enters the who command at the prompt of local
    host london, and learns that three other users are currently logged in to london
    from different nodes:


    ```

    london$ who -M

    lennon     tty p0     Jul 15 08:17     (walrus)

    elvis      tty p2     Jul 15 07:55     (velvet)

    burdon     tty p1     Jul 15 09:02     (animal)

    sarjan     tty p4     Jul 14 16:47     (pepper)

    ```


    The output from the who command is the same as that from the who am i command.


    # 10.2 Obtaining Information About Network Users


    The finger command and its options enable you to display information about users
    with accounts on local or remote hosts. The specified host must be running a fingerd
    daemon server or have the inetd daemon configured to start fingerd. See your system
    administrator if the finger command does not work as described in the finger(1)
    reference page.


    The finger command has the following syntax:


    ```

    finger [ [ option... ] [ user... ] [ user@host_name... ] ]

    ```


    If you use the finger command without specifying an option or a user name, it
    lists the following information about all users on the local host where you are
    logged in, if the information is in the /etc/passwd file for a given user:'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - Login name

    +   - Full name

    +   - Terminal line name and whether it can receive messages from other users
    through write (see Section 11.8) or talk (see Section 11.9)

    +   - Idle time

    +   - Login time

    +   - User’s office location


    # 10.2.1  Obtaining Information About a Specific User


    If you specify the login name of a user on your local host, the finger command
    displays more information than if you entered the finger command without specifying
    a user name. The following additional information about the user is displayed:


    +   - User’s home directory and login shell

    +   - Contents (if any) of the .plan and .project files in the user’s home directory


    The following example shows how to use the finger command to find information
    about user smith, who has an account on your local host:


    ```

    ％ finger smith

    Login name: smith      (messages off)  In real life: John Smith

    Office: LV05-3/724

    Directory: /usr/netd/r2/smith             Shell: /bin/csh

    On since Apr 9 16:20:56 on ttypb from wombat-lv5.dec.c

    18 seconds Idle Time

