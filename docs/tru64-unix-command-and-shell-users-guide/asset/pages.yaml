    is also the pathname) of your working directory. You then use the cd command to
    change your current directory.


    First return to your login directory, if necessary, by entering the cd command
    without a pathname. Next, enter the pwd command to verify that your login directory
    is your current directory. Remember that the system substitutes the name of your
