- pgno: 231
  md: '# 12.1.1 Using rcp to Copy Files Between Local and Remote Hosts


    When using rcp to copy files from a local to a remote host or from a remote to
    a local host, name the file to be copied first, followed by the destination file,
    as shown in this rcp syntax statement:


    ```

    `rcp [option...] localfile hostname:file`

    ```


    The `localfile` variable identifies the local file you want to copy. The `hostname:file`
    variable identifies the remote host (`hostname`) followed by a colon (`:`) and
    the name of the file (`file`) to which the local file is copied.


    The following example uses rcp to copy the local file, YTD_sum from the directory
    `/usr/reports` on the local host to the file `year-end` in the directory `/usr/acct`
    on the remote host moon:


    ```

    `% rcp /usr/reports/YTD_sum moon:/usr/acct/year-end`

    ```


    You can also send a file on the local host to a user at a remote host. The following
    example shows how to copy the file YTD_sum from the directory `/usr/reports` on
    the local host to the file `acct_summaries` in the home directory of user jones
    on the remote host moon:


    ```

    `% rcp /usr/reports/YTD_sum jones@moon:acct_summaries`

    ```


    As used in the preceding examples, the rcp command assigns a new creation date
    and time to the file created from the original. It also assigns file read-write-execute
    permissions according to the host or user directory containing the newly created
    file.


    You may need to preserve the original creation date and access permission mode
    of the copied file in the new file. As shown in the following example, the `-p`
    option enables you to preserve the original creation date and time and file access
    permission of YTD_sum in the file, year-end:


    ```

    `% rcp -p /usr/reports/YTD_sum moon:/usr/acct/year-end`

    ```


    If the -p option was not entered, a new date and time would have been assigned,
    and the file access permission would be set to the default assigned by the system
    administrator for remote host, moon.


    In the next example, the -p option preserves the same file creation and access
    permissions in the file acct_summaries as in the original file, YTD_sum:


    ```

    `% rcp -p /usr/reports/YTD_sum jones@moon:acct_summaries`

    ```


    If the -p option was not entered, a new date and time would have been assigned,
    but unlike the previous example, the file access permission would be the default
    set by user jones through the umask command (if any) in the `.login` or `.profile`
    file. If the umask is not set in the `.login` or `.profile`


    # 12–2 Copying Files to Another Host'
  merge: -1
  img_proc: true
