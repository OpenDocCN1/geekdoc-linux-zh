  md: '# How to Order Tru64 UNIX Documentation


    To order Tru64 UNIX documentation in the United States and Canada, call **800-344-4825**.
    In other countries, contact your local Compaq subsidiary.


    If you have access to Compaq''s intranet, you can place an order at the following
