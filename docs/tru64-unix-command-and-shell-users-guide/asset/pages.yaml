    11 cd june

    12 mv /usr/accounts/new/june .

    13 ls -l

    14 cd /usr/sales/q1

    15 vi earnings

    16 cd /usr/chang

    17 vi status

    [19] $

    ```


    To reexecute any command in the command history buffer, use the commands listed
    in Table 8-15. Each command starts with the letter r.


    # Table 8-15: Reexecuting History Buffer Commands


    | Command | Description |

    |---|---|

    | r | Reexecutes the previous command. |

    | r n | Reexecutes the command specified by n. For example, using the history
    buffer shown in the previous display, r 5 reexecutes the cd /usr/sales command.
    |

    | r -n | Reexecutes a previous command relative to the current command. For example,
    using the history buffer shown in the previous display, r -2 invokes command number
    16, cd /usr/chang. |

    | r string | Reexecutes the most recent command that has first characters matching
    those specified by string. For example, using the history buffer shown in the
    previous display, r cp invokes command number 7, cp report report5. |


    For more information on reexecuting history buffer commands, see the ksh(1) reference
    page.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'If you want to increase or decrease the number of commands stored in your history
    buffer, set the HISTSIZE variable in your .profile file. This variable has the
    following format:


    ```

    HISTSIZE= n

    ```


    The n entry specifies the number of command lines you want to store in the history
    buffer.


    For example, to store 15 commands in the history buffer, use the following command:


    ```

    HISTSIZE=15

    ```


    The Korn or POSIX shell also lets you edit current command lines as well as reuse
    those already entered in the command history buffer. To use this feature, you
    must know how to use a text editor such as vi or emacs. For information on these
    features, see the following section.


    # 8.4.4 Command Line Editing Using the fc Command


    The Korn or POSIX shell lets you list or edit or both the command lines in your
    command history buffer. As a result, you may modify any element of a previous
    command line and then reexecute the command line.


    The command line editing functions for the Korn or POSIX shell are extensive.
    This section covers only the most basic functions. For more detailed information,
    see the ksh(1) or sh(1p) reference pages.


    To display the command history buffer or to edit its contents, or both, use the
    built-in command fc (fix command). The fc command has the following two formats:


    ```

    fc [ -e editor ] [ -nlr ] [ first ] [ last ]

    ```


    This command format lets you display and edit any number of command lines in your
    buffer.


    +   - The -e editor entry specifies the editor (usually vi or emacs) you want
    to use in editing the command line. If you do not specify -e, the fc command displays
    the lines, but does not let you edit them.


    +   - The -n flag specifies that you want to list the command lines in the buffer
    without numbers. The -l flag specifies that you want to list the command lines
    in the buffer with numbers. If you do not specify a line number or a range of
    line numbers, the last 16 lines you entered will be listed.


    +   - The -r flag specifies that you want to list the command in the buffer in
    reverse order.


    +   - The first and last entries specify a range of command lines in the buffer.
    You may specify them either with numbers or with strings.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'If you want to specify a default editor for the -e flag, define the FCEDIT
    variable in your .profile script. For example, if you want to make emacs your
    default editor, enter the following variable definition:


    ```

    FCEDIT=emacs

    ```


    ```

    fc -e - [old=new] [string]

    ```


    This command lets you immediately replace an old string with a new string within
    any previous command line.


    +   - The -e - entry specifies that you want to make a replacement.

    +   - The old=new entry specifies that you want to replace the old string with
    the new string.

    +   - The string entry specifies that the Korn or POSIX shell should make the
    edit to the most recent command line in the buffer containing the string.


    The following section contains some examples of fc use.


    The Korn or POSIX shell also lets you edit individual command lines at the shell
    prompt by using a command set similar to the vi or the emacs editors. For more
    information on this feature, see the ksh(1) or sh(1p) reference pages.


    # 8.4.4.1 Examples of Command Line Editing


    To display command lines 15 to 18, enter the following command:


    ```

    $ fc -l 15 18

    15 ls -la

    16 pwd

    17 cd /u/ben/reports

    18 more sales

    $

    ```


    You also may list the same command lines by specifying command strings instead
    of line numbers, as in the following example:


    ```

    $ fc -l ls more

    15 ls -la

    16 pwd

    17 cd /u/ben/reports

    18 more sales

    $

    ```


    To display and edit command lines 15 to 18 with the vi editor, enter the following
    command:


    ```

    $ fc -e vi 15 18

    ls -la

    pwd

    ```'
  merge: -1
  img_proc: true
