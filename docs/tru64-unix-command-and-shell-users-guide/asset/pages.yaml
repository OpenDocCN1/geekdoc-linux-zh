    The completion message displays the job number and the PID, the status Done, and
    the command executed.


    # 6.4 Monitoring and Terminating Processes


    Use the ps (process status) command to find out which processes are running and
    to display information about those processes. In the Korn and POSIX shells and
    C shell, you also can use the jobs command to monitor background processes.


    If you need to stop a process before it is finished, use the kill command.


    The following sections describe how to monitor and terminate processes.


