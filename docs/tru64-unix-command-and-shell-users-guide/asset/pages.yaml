    This is usually done in your .profile file. |

    | MAILCHECK | Specifies in seconds how often the shell checks for mail (600 seconds
    is the default). If the value of this variable is set to 0, the shell checks for
    mail before displaying each prompt. Usually MAILCHECK is set in your .profile
    file. |

