    ```

    ```text

    rm  filename

    ```

    ```


    The `filename` entry can be the name of the file, the relative pathname of the
    file, the full pathname of the file, or a list of file names. The format you use
    depends on where the file is located in relation to your current directory. See
    the rm(1) reference page for a complete description of the command.


