  md: 'link refers to the original file by name, rather than by file serial number,
    symbolic links work correctly between separate file systems.


    # 3.4.5 Removing Links


    The rm (remove file) command does not always remove a file. For example, suppose
    that a file is linked to more than one file name; that is, several names refer
    to the same file serial number. In this case, the rm command removes the link
    between the file serial number and that file name, but leaves the physical file
    intact. The rm command actually removes a physical file only after it has removed
    the last link between that file and a file name, as shown in Figure 3-1. When
    a symbolic link is removed, the file name specifying the pointer to the destination
    file or directory is removed.


    For detailed information about the rm command, refer to Section 3.9 or the rm(1)
    reference page.


