    I will be on vacation for the next two weeks after

    this week, starting Monday, August 10.  I’ll be

    stdin Space

    back on Monday, August 24.

    ?

    ```


    In Example 11–4, stdin displays because the PAGER variable has been set to more
    (the default). If the PAGER variable had been set to pg nothing would have been
    displayed. Also, stdin appears after the 15th line of the message because user
    Jones has customized the mailx environment by adding set crt=15 to the .mailrc
    file. In the .mailrc file, set crt= specifies the number of lines to display at
    one time before invoking the pager (either pg or more) to display the remainder
    of the message. As shown in the example, because the message is more than 15 lines
    long, set crt instructs mailx to invoke the pager after 15 lines. By pressing
    the Space bar, the next screen full of the message is displayed. You should customize
    your mailx environment by using set crt=. Otherwise, long mail messages will scroll
    rapidly, requiring you to quickly press the Hold Screen key. See Section 11.6.2
    and Appendix D for more information on customizing mailx.


    To read another message, enter the message number at the mailx prompt. To list
    the messages again, enter h at the mailx prompt. In Example 11–5, user Jones uses
    the h command to list the mail messages, sees that the first message is still
    unread, and enters a 1 at the ? prompt to read it.'
