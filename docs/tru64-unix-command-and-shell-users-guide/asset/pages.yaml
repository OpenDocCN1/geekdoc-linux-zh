    The context search begins on the first line before the current line, and locates
    the first line that contains the string appending. That line becomes the current
    line. If ed searches the entire buffer without finding the string, it stops the
    search at the current line and displays the message ?.


    Once you have searched backward for a string, you can search backward for the
    same string again by entering ??. This is because ed remembers search strings.


    # B.5.3 Changing the Direction of a Search


    You can change the direction of a search for a particular string by using the
    slash (/) and question mark (?) search characters alternately:


