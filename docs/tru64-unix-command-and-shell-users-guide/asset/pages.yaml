  md: '# 10.2.2 Obtaining Information About Users on a Remote Host


    In the following example, the `finger` command displays information about users
    on the remote host `boston`:


    ```

    % finger @boston

    [boston]

    Login      Name           TTY  Idle   When        Office

    amy        Amy Wilson     p0   4      Thu 10:00   345

    chang      Peter Chang    *p1  2:58  Thu 10:16   103

    ```


    The first output line lists the remote host name, `boston`, and the second line
    describes the type of information in each column of the remaining output, each
    line allocated to one user. The asterisk (*) indicates that user `chang` has put
    the command, `mesg n` in his `.login` file to prevent his terminal from receiving
    messages from other users through the `write` or `talk` commands.


    # 10.2.3 Obtaining Information About an Individual User on a Remote Host


    To display information about user `luis` on remote host `havana` use the following
    `finger` command:


    ```

    % finger luis@havana

    Login name: luis                     In real life: Luis Aguilera

    Directory: /users/luis               Shell: /bin/csh

    On since May 24 10:16:07 on tty p2 from :0.0

    58 minutes Idle Time

    Project: baseball game simulation software

    Plan:

    Distribute with linked statistics module.

    ```


    # 10.2.4 Customizing Output from the finger Command


    There are several options to the `finger` command that enable you to modify the
    output according to the data you need. Table 10-1 lists and describes each option.


    # Table 10-1: Options to the finger Command


    | Option | Description |

    |--------|-------------|

    | -b     | Produces a brief version of output |

    | -f     | Suppresses display of titles of each field |

    | -h     | Suppresses printing of users'' `.project` files |

    | -i     | Displays list of users with idle times |

    | -l     | Produces long format of output despite other options |

    | -m     | Assumes that `user` is an account name |'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Table 10-1: Options to the finger Command (cont.)


    | Option | Description |

    | --- | --- |

    | -p | Suppresses printing of users'' .plan files |

    | -q | Displays only users'' login and terminal names and login time |

    | -s | Produces brief format of output despite other options |

    | -w | Produces narrow, brief format of output despite other options |


    For more information on the finger command, see the finger(1) reference page.


    # 10.3 Obtaining Information About Remote Hosts and Users


    Before you send messages or transfer files over the network using the commands
    described in this book, you should know whether or not the recipient host is currently
    on line. To do this, use the uptime command which works for hosts that are running
    the rwho daemon on the local network.


    The uptime command displays the following information:


    +   - Host name

    +   - On line status (up for on line or down for off line)

    +   - The length of time the host has been on line (or off line) in days, if more
    than one whole day, hours and minutes

    +   - The number of users currently logged in to the host (optionally including
    those whose sessions have been idle for an hour or longer)

    +   - Load average statistics in 5-, 10-, and 15-minute intervals prior to the
    uptime request


    The syntax of the uptime command is:


    ```

    uptime [ [ option... ] [ sort_option ] ]

    ```


    If you use the uptime command without options, a status report about the hosts
    on your local network, sorted alphabetically by host name, is displayed. In this
    report the length of time the host has been on line (or off line) is shown in
    the format hours:minutes. If a plus sign (+) is included, the time exceeds one
    day (24 hours). For example:'
  merge: -1
