    # 3.7 Comparing Files (diff)


    You can compare the contents of text files with the diff command. Use the diff
    command when you want to pinpoint the differences in the contents of two files
    that are expected to be somewhat different.


    The format of the diff command is:


    ```

    diff  file1 file2

    ```


    The diff command scans each line in both files looking for differences. When the
    diff command finds a line (or lines) that differ, for each line that is different
    the following information is reported:


    +   - Line numbers of any changes

    +   - Whether the difference is an addition, a deletion, or a change to the line'
