- pgno: 24
  md: '# 1

    Getting Started


    This chapter introduces the basic tasks for using the operating system. Before
    reading this chapter, familiarize yourself with your system''s hardware components.


    If you are familiar with the UNIX operating system or other operating systems,
    you may want to just skim this chapter. This book discusses the use of the operating
    system from the command line. The system now has a number of Graphical User Interface
    (GUI) capabilities. These are discussed in separate books.


    After completing this chapter, you will be able to:


    +   - Log in to and log out of the operating system

    +   - Set and change your password

    +   - Execute commands

    +   - Stop command execution

    +   - View and display reference (man) pages


    To use the operating system to its full capabilities, you must learn how to create
    and modify files with a text editing program. See Chapter 2 for an overview of
    text editors, and Appendix A and Appendix B for information on the vi and ed text
    editors, respectively. Once you learn how to use a text editor, you should have
    the basic skills necessary to start using the operating system.


    # Security Note


    If your system is running the optional enhanced security, your login and password
    procedures may be different from the procedures documented in this book. See the
    Security documentation for more information.


    # 1.1 Logging In


    To use the operating system, your operating system must be installed and running
    and you must be logged in. Logging in identifies you as a valid system user and
    creates a work environment that belongs to you alone.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "Before logging in, obtain your **user name** and **password** from the system\
    \ administrator. A user name (typically your surname or initials) identifies you\
    \ as an authorized user. A password (a group of characters that is easy for you\
    \ to remember but difficult for others to guess) verifies your identity.\n\nThink\
    \ of your user name and password as electronic keys that give you access to the\
    \ system. When you enter your user name and password during the login process,\
    \ you identify yourself as an authorized user.\n\nYour password is an important\
    \ part of system security because it prevents unauthorized use of your data. For\
    \ more information on passwords, see Section 1.5.1.\n\nThe first step in the login\
    \ process is to display the login prompt. When your system is running and your\
    \ workstation is on, the following login prompt appears on your screen:\n\n```\n\
    login:\n```\n\nOn some systems, you may have to press the Return key a few times\
    \ to display the login prompt.\n\nYour system’s login prompt screen may be somewhat\
    \ different. For example, in addition to the login prompt, the screen may display\
    \ the system name and the version number of the operating system.\n\nTo log in,\
    \ perform the following steps:\n\n+   1. Enter your user name at the login prompt.\
    \ If you make a mistake, use the Delete key or Backspace key to correct it.\n\
    +   \n+      For example, if your user name is larry, enter:\n+   \n+      `login:\
    \ larry`\n+   \n+      The password prompt appears:\n+   \n+      ```\n+     \
    \ login: larry\n+      Password:\n+      ```\n\n+   2. Enter your password. For\
    \ security reasons, the password does not display on the screen when you type\
    \ it.\n+   \n+      If you think you made a mistake while typing your password,\
    \ press the Return key. If your password is incorrect, the system displays a message\
    \ and prompts you to enter your user name and password again. On some systems,\
    \ you may use the Delete key or the Backspace key to correct errors while typing\
    \ your passwords.\n+   \n+      After you enter your user name and password correctly,\
    \ the system displays the shell prompt, usually a dollar sign ($) prompt or a\
    \ percent sign (%) prompt. Your system’s shell prompt may be different."
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Note


    In this book, the shell prompt display is a dollar sign ($).


    The shell prompt display tells you that your login is successful, and that the
    system is ready to go to work for you. The shell prompt is your signal that the
    shell is running. The shell is a program that interprets all commands you enter,
    runs the programs you have asked for, and sends the results to your screen. For
    more information about commands and the shell prompt, see Section 1.3 and Chapter
    7.


    When you first log in, you automatically are placed in your login directory. This
    directory is often referred to as your home directory. See Chapter 2 for information
    about your login directory.


    If your system does not display the shell prompt, you are not logged in. You may,
    for example, have entered your user name or your password incorrectly. Try to
    log in again. If you still cannot log in, see your system administrator. On some
    systems, for security reasons, the system rejects all attempts at logging in after
    some number of consecutive incorrect attempts. If your attempt at logging in is
    rejected, the only indication you receive, for security reasons, is the following:


    ```

    Login incorrect

    ```


    # Note


    Your system may not require you to have a password, or you may have been assigned
    a password that is common to all new users. To ensure security in these cases,
    set your own password. For information on how to create or change a password,
    see Section 1.5.


    Many systems display a welcome message and announcements whenever users log in.
    Example 1–1 is a typical login screen (your screen may vary).


    # Example 1–1: Typical Login Screen


    ```

    Welcome to the Operating System

    Fri Dec 7 09:48:25 EDT 19nn


    Messages from the administrator


    You have mail

    $

    ```


    The preceding announcement contains the following pieces of information:


    +   1. A greeting'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Example 1-1: Typical Login Screen (cont.)


    2 The date and time of your last login.


    Note this information whenever you log in, and tell your system administrator
    if you have not logged in at the time specified. A wrong date and time might indicate
    that someone has been breaking into your system.


    3 Messages from the administrator


    Your system administrator may set messages that each user receives each time a
    login is accomplished. These messages may describe planned system updates, operational
    schedules, or other information of general interest. These messages are called
    the message of the day and are stored in the file /etc/motd. You may redisplay
    these messages at any time by displaying this file.


    4 Whether you have mail messages waiting to be read.


    Briefly, mail is a program that lets you send and receive electronic mail. The
    system displays the message You have mail when there are mail messages for you
    that are waiting to be read. If you have no mail messages, this line does not
    appear.


    # 1.2 Logging Out


    When you are ready to end your work session, log out of the system. Logging out
    leaves the operating system running for other users and also ensures that no one
    else can use your work environment.


    To log out, perform the following steps:


    +   1. Make sure that the shell prompt is displayed.

    +   2. Press Ctrl/D. If Ctrl/D does not work, enter the exit command.


    The system displays the login prompt or login screen. On some systems, a message
    may also be displayed.


    At this point, you or another user may log in.


    # 1.3 Using Commands


    Operating system commands are programs that perform tasks on the operating system.
    The operating system has a large set of commands that are described in the remaining
    chapters of this book and in the related reference pages.


    Entering a command is an interactive process. When you enter a command, the shell
    interprets that command, and then gives an appropriate response — that is, the
    system either runs the program or displays an error message.


    A shell reads every command you enter and directs the operating system to do what
    is requested. Therefore, the shell is a command interpreter.'
  merge: -1
  img_proc: true
- pgno: 28
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 29
  md: '```

    $ man date

    ```


    Commands can have options that modify the way a command works. These options are
    called flags and immediately follow the command name. Most commands have several
    flags. If you use flags with a command, arguments follow the flags on the command
    line.


    For example, suppose that you use the -f flag with the man command. This flag
    displays a one-line description of a specified command. To display a one-line
    description of the date command, you would enter:


    ```

    $ man -f date

    ```


    While a command is running, the system does not display the shell prompt because
    the control passes to the program you are running. When the command completes
    its action, the system displays the shell prompt again, indicating that you can
    enter another command.


    In addition to using the commands provided with the system, you can also create
    your own personalized commands. Refer to Section 7.10.1 for information about
    creating these special commands.


    # 1.4 Stopping Command Execution


    If you enter a command and then decide that you do not want it to complete executing,
    enter Ctrl/C. The command stops executing, and the system displays the shell prompt.
    You can now enter another command.


    Depending upon the command, partial completion of the command may have varied
    results (referred to as an unknown state). To see the result of stopping a command
    during execution, enter Ctrl/C after executing commands such as ls -l to list
    files in a directory or cat filename to view a file on the screen.


    # 1.5 Setting Your Password


    Your user name is public information and generally does not change. Your password,
    on the other hand, is private.


    In most instances, when your system account is established, the system administrator
    assigns a password that is common to new users. On some systems, this new user
    password is valid for only one login to allow you access to the system to establish
    your own password. After getting familiar with the system, select your own password
    to protect your account from unauthorized access. In addition, change your password
    periodically to protect your data from unauthorized access.


    To set your password, use the passwd command. If your account does not have a
    password, use the passwd command to set one. For information on passwd procedures,
    see Section 1.5.2. If your system is part of a networked'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'system, you must use the yppasswd command to establish or change your password.
    Your system administrator can advise you on the specific procedures for your system.


    # 1.5.1 Password Guidelines


    The following guidelines are useful in selecting a password:


    +   - *Do not* choose a word found in a dictionary.

    +   - *Do not* use personal information as your password, or as a substring of
    it, such as your user name, names or nicknames (yours, your family''s, your company''s,
    your pet''s), initials, or the make or model of your car.

    +   - *Do not* use birthdays, Social Security or bank account numbers, employee
    identification numbers, telephone numbers, or other similar information as a password
    or as the numeric portion of a password.

    +   - *Do not* use the default password you received with your account.

    +   - *Do not* use old passwords or the same prefix or suffix you used in previous
    passwords. This rule also applies to any passwords you may have used in previous
    jobs.

    +   - *Do not* use the same password on all systems when you have access to several
    different systems.

    +   - *Do not* choose a password that is easy to guess (includes all of the above
    options) even if you reverse their spelling. Choose a password that is hard to
    guess, not hard to remember.

    +   - *Do not* choose passwords shorter than six characters in length. The maximum
    length of your password depends on the security conventions in force on your system.
    (Password length is measured in bytes, rather than characters, but we can regard
    these terms as the same, for now.)

    +   - *Do not* write your password on paper or place it in a file on the system.

    +   - *Do not* put your password in e-mail.

    +   - Use a mixture of uppercase and lowercase letters in your password if possible.
    You also should include any combination of numbers, punctuation marks, or underscores
    (_) in your password.

    +   - Change your password frequently, especially if you think it might have been
    compromised.


    On most systems, you can change your password as often or seldom as you like.
    However, to protect system security, your system administrator may set limits
    on how often you should change your password, the length of time your password
    remains valid, or the nature of changes you can make. Some typical password restrictions
    could be the following:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - Character restrictions

    +     - Minimum number of alphabetic characters

    +     - Minimum number of other characters, such as punctuation or numbers

    +     - Minimum number of characters in a new password that must be different
    from the old password

    +     - Maximum number of consecutive duplicate characters allowed in a password

    +   - Time restrictions

    +     - Maximum number of weeks before your password expires

    +     - Number of weeks before you can change a password


    See your system administrator for more information about password restrictions.
    There are several levels of security and access control that may be installed
    or activated on your system. See the Security manual for additional information
    about access control.


    # 1.5.2 Password Procedures


    To set or change your password, follow these steps:


    +   1. Enter the passwd command:

    +      $ passwd

    +      The system displays the following message (identifying you as the user)
    and prompts you for your old password:

    +      Changing password for username

    +      Old password:

    +      If you do not have an old password, the system does not display this prompt.
    Go to step 3.

    +   2. Enter your old password. For security reasons, the system does not display
    your password as you enter it.

    +      After the system verifies your old password, it is ready to accept your
    new password, and displays the following prompt:

    +      New password:

    +   3. Enter your new password at the prompt.

    +      Remember that your new password entry does not appear on the screen. Finally,
    to verify the new password (since you cannot see it as you enter), the system
    prompts you to enter the new password again:

    +      Retype new password:'
  merge: -1
  img_proc: true
- pgno: 32
  md: "4. Enter your new password again. As before, the new password entry does not\
    \ appear on the screen. When the shell prompt returns to the screen, your new\
    \ password is in effect.\n\nIf you attempt to change your password and the new\
    \ password does not conform to password regulations, you receive a message stating\
    \ the specific problem and the restrictions in effect for the system. The exact\
    \ messages and the level of detail in the descriptions provided are determined\
    \ by the security and access control mechanisms in effect on your system.\n\n\
    > **Note**\n> \n> Try to remember your password because you cannot log in to the\
    \ system without it. If you forget your password, see your system administrator.\n\
    \n# 1.6 Getting Help\n\nThis book discusses the entry and execution of commands\
    \ from the command line. If you are using any of the numerous graphical user interfaces\
    \ (GUIs) that are available, see the users instructions that accompany your window\
    \ manager, or see your system administrator.\n\nMany of the basic operating system\
    \ commands needed for your work are described in this book. If you want to learn\
    \ more about these and other commands, see the reference pages. The reference\
    \ pages are provided in several formats:\n\n+   - On line (see Section 1.6.1)\n\
    +   - In hard copy (see Related Documents)\n+   - In Hypertext Markup Language\
    \ (HTML) format\n\nAsk your system administrator what optional formats are installed\
    \ on your system. When the hard copy documents and HTML are unavailable, you quickly\
    \ can access online command documentation by using the following commands:\n\n\
    +   - The man command displays online reference pages.\n+   - The apropos command\
    \ displays a one line summary of each command pertaining to a specified subject.\n\
    \nThe following sections describe these features.\n\n# 1.6.1 Displaying and Printing\
    \ Online Reference Pages (man)\n\nOnline reference pages contain information about\
    \ commands. To view a reference page on line, use the man command. Example 1–2\
    \ shows how to"
