  img_proc: true
- pgno: 203
  md: 'The rwho command displays the following information:


    +   - User name

    +   - Host name

    +   - Start date and time

    +   - Number of minutes a user''s session has been inactive.


    The rwho command has the following syntax:


    ```

    rwho [ [-a] [ user ... ] ]

    ```


    Without options, the rwho command lists all users currently logged in to hosts
    on the local network, except those who have been idle for an hour or longer. A
    typical local network has several dozen users, so you should specify only the
    users about whom you need information.


    Although the -a option displays all users, including those idle for more than
    an hour, you can still use it while specifying only certain users. This enables
    you to determine whether or not a remote user is logged in, regardless of whether
    that user has been inactive for an hour or longer. The following example uses
    rwho with the -a option to determine this information for users wally, becky,
    and smith:


    ```

    % rwho -a wally becky smith

    becky    cygnus:pts0    Jan 17 11:20 :12

    smith    aquila:ttyp0   Jan 15 09:52 :22

    wally    lyra:pts7      Jan 17 13:15 1:32

    wally    lyra:pts8      Jan 17 14:15 1:01

    ```


    As shown, the output from the rwho command displays in alphabetical order by user
    name, then by host name. The amount of idle time greater than one hour is shown
    in the last column, after the starting time and date of each session. Because
    the -a flag was specified, the output also includes users idle for more than one
    hour. Without the -a flag, the information for user wally would not have displayed.


    For more information on the rwho command, see the rwho(1) reference page.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 10.5 Determining Whether a Remote Host Is On Line


    The ping command is used by system administrators to fix network transmission
    problems and works for any host configured in a TCP/IP network. As a network user,
    you can use it to determine whether a remote host is currently on line. For example,
    to determine whether remote host moon is on line, enter the ping command at your
    local system prompt. The output, which verifies that the remote host is on line,
    will continue to display until you press Ctrl/C, as shown in the following example:


    ```

    $ ping moon

    PING moon (130.180.4.108): 56 data bytes

    64 bytes from 130.180.4.108: icmp_seq=0 ttl=255 time=42 ms

    64 bytes from 130.180.4.108: icmp_seq=1 ttl=255 time=0 ms

    64 bytes from 130.180.4.108: icmp_seq=2 ttl=255 time=0 ms

    64 bytes from 130.180.4.108: icmp_seq=3 ttl=255 time=0 ms

    Ctrl/C

    ---moon PING Statistics---

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip (ms) min/avg/max = 0/11/42 ms

    ```'
  merge: -1
  img_proc: true
