    # 12.1.2 Using ftp to Copy Files Between Local and Remote Hosts


    The ftp command is the interface to the File Transfer Protocol (FTP) and has an
    extensive set of subcommands (described in Table 12-1, Table 12-2, and Table 12-3)
    that support the main task of copying files. You can use the ftp command to copy
    files between any two hosts that support ftp.


    See the ftp(1) reference page for a description of the ftp command options, which
    are used primarily for network administration tasks.


    Copying files through FTP consists of the following steps:


    +   1. Establishing a session on the remote host

    +   2. Copying the files

    +   3. Disconnecting the session


    The ftp command has the following syntax:


    ```

    ftp host_name

    ```


    The host_name variable specifies the name of the host you want to reach. If you
    do not specify a host_name on the command line, you must use the ftp subcommand,
    open (described in Table 12-1) to connect with a remote host.


    After you type ftp, the ftp> prompt is displayed and you are logged in to the
    remote host. You can then use ftp subcommands to perform the following tasks:


    +   - Copy files (See Table 12-1)

    +   - Append a local file to a remote file (See Table 12-1)

    +   - Copy multiple files (See Table 12-1)

    +   - List the contents of a remote directory (See Table 12-2)

    +   - Change the current directory on the remote host (See Table 12-2)

    +   - Delete files on remote hosts (See Table 12-2)

    +   - Escape to the local shell to run commands (See Table 12-3)'
  merge: -1
  img_proc: true
