    # A.1.4 Moving Within a File


    If you have closed my.file, reopen it by using the command:


    ```

    $ vi my.file

    ```


    The cursor should be on the first character in the file: the Y in the word You.


    As mentioned previously in this appendix, vi is in command mode at start up. In
    command mode, the characters you enter are treated as commands rather than as
    text input to the file.


    # A.1.4.1 Moving the Cursor Up, Down, Left, and Right


    Certain keys on the keyboard have been designated to be movement keys when vi
    is in the command mode. The following letters on the keyboard control cursor movement:


    +   - h (move the cursor one character to the right)

    +   - j (move the cursor down one line staying in the same position)

    +   - k (move the cursor up one line staying in the same position)

    +   - l (move the cursor one character to the left)


    Using the movement keys, move the cursor to the first letter of the word experiment
    by typing:


    ```

    111j

    ```


    If your keyboard is equipped with arrow keys, you may be able to use the arrow
    keys to move left, right, up, or down as well. However, using the h, j, k, and
    l keys lets you keep your fingers on the main section of the keyboard for faster
    typing. On some keyboards, the h, j, k, and l keys are repetitive keys. That is,
    holding the key down will repeat the key action until you release the key. For
    instance, holding down the j key will scroll rapidly through the lines in a file.'
