- pgno: 146
  md: '# Table 7-5: Selected Shell Environment Variables (cont.)


    | Environment Variable | Description |

    |---|---|

    | LC_NUMERIC | Specifies the numeric format for your system. The default value
    is the American format for numeric quantities. The LC_NUMERIC variable can be
    set in a login script. |

    | LC_TIME | Specifies the date and time format for your system. The default value
    is the American format for dates and times. The LC_TIME variable can be set in
