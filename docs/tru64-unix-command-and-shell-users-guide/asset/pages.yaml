    Many of these environment variables can be set during the login process by the
    appropriate login script (see Section 7.6). However, you may reset them as well
    as set those for which no default values have been provided. See Section 7.7.1
    for more information.


    For more information on the LANG, LC_COLLATE, LC_CTYPE, LC_MESSAGES, LC_MONETARY,
    LC_NUMERIC, and LC_TIME variables, refer to Appendix C which explains the variables
    in the context of other system features that support the languages and customs
    of different countries.


    You may also create your own environment variables. For example, some systems
    have more than one mail program available to users. Assume that mail and mh are
    available on your system and that each has its own pathname. As a result, you
    could define a variable for the pathname of each mail program.


    For more information about environment variables specific to each operating system
    shell, see Chapter 8. For a complete list of operating system shell environment
    variables, see the sh(1b), sh(1p), csh(1), and ksh(1) reference pages.


    # 7.5.3 Shell Variables


    Shell variables are valid only for your current shell and are not passed to subshells.
    Consequently, they can be used only in the shell in which they are defined. In
    other words, they may be thought of as local variables.


    Shell variables can be accessed outside of the current shell by becoming environment
    variables. For more information about environment variables, see Section 7.7.1.


    You may also create your own shell variables. For example, some mail programs
    use the PAGER variable to define the program that displays mail. Suppose that
    your mail program is mailx. You could define the PAGER variable to use the more
    program to display your mail.


    For information on how to set shell variables, see Section 7.7.1.'
