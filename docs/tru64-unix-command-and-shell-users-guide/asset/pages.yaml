    # 6.2.2.2  C Shell Error Redirection


    The general format for C shell standard error redirection is the following:


    ```

    (( command > outfile) >& errorfile

    ```


    The `command` entry is any operating system command. The `outfile` entry is the
    name of the file to which the process writes the standard output. The right-angle
    bracket (`>`) redirects the standard error to a file. The `errorfile` entry is
    the name of the file to which the process writes the standard error. In this command
    format, the parentheses are mandatory.


    # 6.2.3  Redirecting Both Standard Error and Standard Output


    In the preceding sections, you learned how to redirect standard output and standard
    error separately. Usually, however, you would redirect both standard output and
    standard error at the same time. Standard output and standard error can be written
    to different files or to the same file.


    For the Bourne, Korn, and POSIX shells, the general format for redirecting both
    standard output and standard error to different files is the following:


    ```

    command > outfile 2> errorfile

    ```


    The `command` entry is an operating system command. The `outfile` entry is the
    file to which the process writes the standard output. The `2>` symbol redirects
    the error output. The `errorfile` entry is the file where the process writes the
    standard error. For the C shell, the general format for redirecting both standard
    output and standard error to different files is the following:


    ```

    (( command > outfile) >& errorfile

    ```


    The `command` entry is an operating system command. The `outfile` entry is the
    file to which the process writes the standard output. The right-angle bracket
    and ampersand (`>&`) symbol redirects the error output. The `errorfile` entry
    is the file where the process writes the standard error. In this command format,
    the parentheses are mandatory. See Section 6.2.2.2 for more information.'
