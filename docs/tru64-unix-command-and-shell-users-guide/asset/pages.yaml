- pgno: 222
  md: 'The backslash (\ ) enables you to write a single long command on several lines.


    While in mailx, you can see what aliases are defined by using the alias command
    without arguments. You can also define temporary aliases at the mailx prompt that
    are in effect during that mailx session.


    # 11.6.2 Setting Mail Variables


    Mail variables are similar to variables in your .login file. They can be binary,
    string, or numeric.


    To set a binary mail variable in your .mailrc file, enter the set command followed
    by the option name. The sample .mailrc file includes these binary variables:


    ```

    set ask

    set askcc

    unset dot

    ```


    +   - Setting ask makes mailx prompt you for the subject line of messages you
    send.

    +   - Setting askcc makes mailx prompt you for carbon-copy recipients.

    +   - Unsetting dot makes mailx refuse to end a message when you type a line with
    just a period on it; you would have to end a message by pressing Ctrl/D instead.


    String mail variables accept characters or numbers as values. The sample .mailrc
    file includes the following three string variables:


    ```

    set folder=folder

    set record=/usr/users/hale/folder/outgoing

    set crt=20

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 11.7 The Message Handling (MH) Program


    An alternative to the mailx program is the Message Handling program (MH). The
    MH program is a set of small mail-handling programs that you use by entering the
    command you want to execute from the shell prompt.


    The MH program is optional; it may not be installed on your host. To determine
    if MH is available, look for the /usr/bin/mh directory.


    To use MH, you must add the /usr/bin/mh directory to your path by editing the
    set path line in your .cshrc or .login file. Then, notify the shell about the
    change in your path by logging out and logging back in, or by entering the following
    command (for the C shell):


    ```

    orange$ source .login

    ```


    If your path is set in .cshrc, use .cshrc instead of .login in this command.


    For either the Bourne, Korn, or POSIX shell, you would add this information to
    the .profile file and notify the shell by entering the following command:


    ```

    orange$ . .profile

    ```


    With the MH program, folders are organized differently from mailx folders. New
    and unread mail is kept in a folder called inbox, into which you move the mail
    that arrives in your system mailbox by using the inc command. You must enter the
    inc command every time you want to include new mail.


    You select a folder with the folder command. If you enter it without a folder
    name, folder displays the currently selected folder.


    You can enter the folder command with the -all option to display a list of your
    folders and the number of messages in each.


    You use the show, prev, and next commands to read the current, previous, and next
    messages in your current folder. If you enter a message number with the show command,
    that message becomes your current message. For example:


    ```

    orange$ show 7

    Message 7:

    From deede Mon Jul 23 10:02:10 1999

    Date: Mon, 23 Jul 1999 10:01:25 edt

    To: hale

    Subject: Cafeteria hours

    Cc:

    Status: R


    I’m sorry you didn’t ask that sooner. The cafeteria

    closes its breakfast service at 10. Lunch starts

    at 11:30.

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The rmm command removes messages from your current folder. If you use the rmm
    command with no argument, it deletes the current message. If you specify one or
    more message numbers, the messages you specify are removed. For example, to remove
    messages 2, 5, and 7, enter the following command:


    ```

    orange$ rmm 2 5 7

    ```


    Table 11-1 lists most of the MH commands. For a complete list, see the mh(1) reference
    page. For more information about each MH command, see the reference page for each.


    # Table 11-1: Commands for the MH Message-Handling Program


    | Command | Description |

    |---|---|

    | ali | Searches the specified alias files and displays the addresses corresponding
    to the specified aliases. |

    | anno | Annotates messages to keep track of distribution, forwarding, and replies
    for your messages. |

    | burst | Extracts the original messages from a forwarded message, discards the
    forwarding header, and places the original messages at the end of the current
    folder. |

    | comp | Creates a new mail message, providing a template for you to fill in and
    invoking an editor to finish the message. |

    | dist | Redistributes the current message to addresses that are not on its original
    distribution list. |

    | folder | Selects a folder or displays the contents of your current folder. |

    | folders | Lists all your folders and the number of messages each one contains.
    |

    | forw | Forwards messages to recipients who were not the original addressees.
    The message is encapsulated (included with a Forwarded Message notice) and a header
    is added. |

    | inc | Incorporates mail from your system mailbox into your inbox folder. |

    | mark | Assigns a name to a sequence of messages in your current folder. You
    can then use the pick command to select messages marked in this way. |

    | mhl | Lists formatted MH messages. You can use this command as a replacement
    for the more command to display messages. |

    | mshmail | Sends mail to the specified users. If you do not specify any users,
    mshmail works like the inc command. |

    | msgchk | Checks your system mailbox and any other files that can receive new
    mail for you, looking for new messages. If any new messages are found, msgchk
    reports. |'
  merge: -1
  img_proc: true
