  md: '# 3


    # Managing Files


    This chapter describes how to manage files on your system. After completing this
    chapter, you will be able to:


    +   - List files

    +   - Display and print files

    +   - Link files

    +   - Copy, rename, and move files

    +   - Compare and sort files

    +   - Remove files from the system

    +   - Determine file type


    To learn about managing files, follow the examples in this chapter. Do each example
    in order so that the information on your screen is consistent with the information
    in this book.


    Before you can work through the examples, you must be logged in and your login
    directory must contain the following three files created in Chapter 2: `file1`,
    `file2`, and `file3`. To produce a listing of the files in your login directory,
    enter the `ls` command, which is explained in Section 3.1. If you are using files
    with different names, make the appropriate substitutions as you work through the
    examples.


    In the following examples, when you are asked to return to your login directory,
    enter the `cd` (change directory) command as follows:


    ```

    ```shell

    $ cd

    ```

    ```


    In the preceding example, the dollar sign ($) represents the shell prompt. Your
    shell prompt may vary.


    In addition, before working on the examples in this chapter, create a subdirectory
    called `project` in your login directory. To do so, enter the following `mkdir`
    (make directory) command from your login directory:


    ```

    ```shell

    $ mkdir project

    ```

    ```'
