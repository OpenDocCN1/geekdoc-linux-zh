    # # Mortal Combat


    The main drawback of ATA/SATA interfaces, which hasn’t been eliminated yet, is
    the limited number of devices that can be connected. As long as you are content
    with one hard disk and one CD/DVD-ROM drive, no problems arise. However, if you
    want to connect two hard disks, one CD-ROM, one CD-RW, and one DVD-ROM, then your
    goal cannot be achieved.


    Disk arrays make up of several hard disks are principally impossible to implement
    on ATA controllers, because every device requires its own controller and every
    controller requires its own DMA and interrupt request. In addition, the lack of
    a fully-functional scheduler has a strong negative effect on the performance of
    the disk subsystem (especially in random queries). Even a minor bug causes the
    entire queue to reset, which means that the initiator of the query must store
    its copy, carefully tracing all changes. Briefly, there are no decent RAID controllers
    on ATA or on SATA, and such RAID controllers are unlikely to appear in the future.
    The RAID models available on the market are amateurish constructions and contain
    a vast number of fatal errors that often result in irrecoverable data corruption.
    They cannot be recommended even for home use. Naturally, no physical laws prevent
    a correct RAID controller with ATA/'
