- pgno: 60
  md: '# Chapter 2: Essential Tools


    # # File System Debuggers


    File system debuggers are utilities that provide access to the holy of holes of
    the file system and allow you to manipulate the key data structures as you like.
    What is the difference between them and simple editors? A disk editor operates
    at a lower level—the level of blocks or sectors. Principally, it can provide certain
    structures in a more readable format; however, it doesn''t interpret their “physical”
    meaning.


    File system debuggers operate through the driver; therefore, the risk of damaging
    the partition is less probable. It implements high-level operations, such as setting
    or resetting the block-busy flag and creating a new symbolic reference. Debuggers
    do not contain a sector-level hex editor; therefore, both categories of programs
    are mutually complementary.


    Practically all Linux distributions include the debugfs file system debugger supporting
    ext2 and partially, ext3s (Fig. 2.18).


    ![](img/1ce3cead9a6814cc94d1e00101c20220_60_0.png)


    Fig. 2.18. The debugfs file system debugger at work'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Required Equipment


    The availability of a "clean room" is a mandatory requirement for any serious
    data recovery company. Such rooms correspond to the Class 100 clean environment-,
    which means that the number of 0.5-mm specs of dust in 1 cubic foot must not exceed
    100. This plain formulation designates an enormous engineering structure that
    costs more than $30,000. Smaller businesses that repair hard drives usually limit
    themselves to a "clean chamber," which is approximately 10 times cheaper. However,
    for amateurs even this is too expensive. It is possible to do without a clean
    room or to construct it on your own?


    In contrast to common opinion and fears, this is possible. It is enough to have
    a normal room that is not dust-laden and is equipped with an air conditioner (sometimes,
    it is possible to do without an air conditioner). Also, it is highly desirable
    to purchase an ionizer, which causes specs of dust to coagulate. Instead of flowing
    over the room, they accumulate on the floor, from which they can be easily removed
    by a plain ventilation system. A high-quality ionizer costs from $500 to $1000;
    however, if desired, you can design it on your own, using descriptions found on
    the Internet. Before carrying out repair operations, it is necessary to power
    down the ionizer.


    The design of a typical clean room is shown in Fig. 2.19.


    If you repair hard disks regularly, it is expedient to construct something like
    a clean chamber. You''ll need a rectangular glass aquarium, an air filter, and
    a compressor that delivers the air into the aquarium and prevents dust from penetrating
    it through the open front wall. Yes, the front wall must be open! The aquarium
    is installed sideways so that the open side faces you. A glass plate up to two-thirds
    of the surface is fastened from above, and the air filter is installed inside.
    The compressor remains outside. The remaining one-third of the surface is closed
    by another plate, and the filter is switched on for several hours (the exact time
    depends on filter throughput and the volume of the aquarium). Then, before starting
    the repair, this plate is removed, providing space for hands. This is unbelievably
    cheap but clean enough. In any case, it is cleaner than a normal living room.
    Taking into account that the hermetic zone is opened only for a short time, too
    much dust does not accumulate on the disk plates. Thus, the disk has a good chance
    of reading all data before its death.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'After performing all operations, it is necessary to close the disk, having
    previously removed all dust that happened to fall on it using a compressed-air
    flask, which is designed for cleansing combustion engines and can be purchased
    in a car supply store. The first portion of air be let go sideways, not to the
    disk, because in the course of flask storage condensation is generated. After
    that, the air flow is directed to the disk. Do not shake the flask; otherwise,
    you''ll pour foam on the disk, ruining it altogether. To view a movie illustrating
    how to proceed when carrying out this operation, visit http://pc3k.sru.ru/video/video03_N40P_disk_swap.avi
    (157 MB). This movie was prepared by Sergey Yatsenko, the chief engineer of ACE
    Lab (http://www.acelab.ru).


    Prolonged operation with an open hermetic zone is highly undesirable even in a
    clean chamber (although if the required cleanness grade is ensured, it is possible).'
