  md: 'If you can make nkrernel.exe operate in a foreign environment, such as Linux
    or BSD, you''ll be able to run any Windows NT driver without modifications to
    its binary code. This not only simplifies the porting procedure but also solves
    the copyright problem. Any owner of a legitimate copy of Windows (or any other
    program) has the right to call a ready-to-use driver from any environment, without
    any permissions or additional payments. It is unlikely that users would be allowed
    to modify the binary code.


    However, I''m not urging you to modify anything. Just ntoskrnl.exe. All other
    operations are trivial. It is enough to map it to addresses in the PE file header
    (recall that ntoskrnl.exe is a normal PE file) and learn the particulars of the
    export table used by the drivers. In other words, it is necessary to implement
    a custom PE loader and build it into the loadable kernel model or into the kernel.
    To avoid extra work, it is possible to rely on the Windows emulator (Wine) and
    use its loader.


    Interactions between the ntoskrnl.exe file and the Linux/BSD kernel will take
    place through the "stub", which is the code emulating HAL. This code you must
    implement on your own. However, there isn''t anything difficult here; HAL doesn''t
    have lots of functions, and the ones that are included are simple. The more difficult
    task is organizing communications between the system manager and the external
    world (which in this case will be Linux/BSD). The main problem is that the interface
    of this manager is undocumented and subject to constant changes. Therefore, it
    is necessary to use not only ntoskrnl.exe but also ntdll.dll. Why use such an
    approach? How does ntdll.dll relate to drivers and the kernel? Drivers do not
    call it; furthermore, ntdll.dll is simply a set of stubs to ntoskrnl.exe.


    The ntdll.dll interface is documented, and it remains unchanged for years. Therefore,
    it can be taken as a base without any doubts. After that, it remains to make ntdll.dll
    communicate with the Linux/BSD world — in other words, to write a translator for
    the queries to the drivers. This task is not particularly easy, because you''ll
    have to write a large amount of code, and the job will require several weeks or
    months, including debugging. However the result is worth it.


    As a result, you''ll organize normal communications between Linux/BSD and NTFS,
    as well as with other input/output drivers. The situation is considerably more
    complicated for video adapters, because they interact with the Win32 subsystem
    instead of the input/output manager (which resides inside ntoskrnl.exe), as shown
    in Fig. 8.3. In Windows 2000, it is implemented in the win2k.sys file. The win2k.sys
    driver is only a small part of what is required, and it is impossible to easily'
