- pgno: 291
  md: '# 278 Part III: Backup-Media Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_291_0.png)


    Fig. 10.6. Alcohol 120% settings


    Ancient StarForce versions could be easily fooled and obediently worked with the
    virtual drive, taking it for a physical one. However, this is no longer so with
    newer versions. If there is at least one IDE drive in the system, then the protection
    refuses to work with all other drives and requires the user to insert the original
    disc into the IDE drive. It behaves in this way if all other drives are regular
    SCSI devices. It is possible to disconnect the IDE cable from the CD drive (or
    simply power down the device), after which the virtual image will work excellently.
    All such manipulations must be carried out when the computer is powered down (the
    only exception is drives with hot plug support). As a variant, it is possible
