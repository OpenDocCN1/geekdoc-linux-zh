    # Linux Disk Editor


    Programs suitable for recovering data under Linux are considerably fewer in comparison
    to similar programs for Windows NT. Furthermore, available ones are far from perfect.
    Thus, you''ll either develop required tools on your own or use the available toolset,
    seeking consolation in how hackers of earlier generations had an even tougher
    time working to deconstruct the machines of the dinosaur era.


    Under Linux, the most popular disk-editing tool is lde (which stands for Linux
    disk editor). In, this isn''t perfect as Norton Disk Editor; however, it is better
    than Microsoft Disk Probe. This is a professionally-oriented console providing
    a reasonable set of functional capabilities (Fig. 2.11). It recognizes ext2fs,
    minix, and xafs, and it provides a partial FAT support. Its developers promise
    to implement NTFS (in our humble opinion, no one needs it under Linux, in contrast
    to UFS and FFS, which would be highly desirable).


    Lde supports the following capabilities: displaying and editing the contents in
    hex format; viewing the superblock, inodes, and directories in a readable format;
    context searching; searching for file records referencing the current block (a
    useful feature but, unfortunately, poorly implemented so that it never always
    works); allowing recovery mode with the possibility of manually editing the list
    of direct and indirect blocks; saving a dump on a disc; and other auxiliary operations.'
  merge: -1
  img_proc: true
