  md: '# Chapter 8: Data Recovery under Linux/BSD 223


    After the end of the superblock, at a certain offset, there resides the first
    group of cylinders. In the beginning of each group, there is an auxiliary structure
    named cg, which describes the group of cylinders. It contains the 55h 02h 09h
    magic sequence, by which all surviving groups can be found even if the superblock
    is destroyed (the starting addresses of all subsequent groups are computed by
    multiplying the group number by its size, contained in the fs_cgsize field).


    The list of other important parameters includes the following fields:


    +   - cg_cgx — Ordinal number of the group, counted from zero

    - cg_old_niblk — Number of inodes in a given group

    - cg_ndblk — Number of blocks in a given group

    - csum — Number of free inodes and data blocks in this group

    - cg_iusedoff — Offset of the occupied inodes bitmap, measured in bytes and counted
    from the start of the given group

    - cg_freeoff — Offset of the free space in bytes, counted from the start of the
    group


    The cg structure is defined in the /src/ufs/fs/fs.h file and appears as in Listing
    8.8.


