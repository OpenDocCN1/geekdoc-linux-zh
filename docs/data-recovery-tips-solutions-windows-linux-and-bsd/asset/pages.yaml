- pgno: 63
  md: 'Specks of dust, present in the air, collide with the wildly rotating plate
    and can quickly destroy the magnetic layer (Fig. 2.20). If the disk has a glass
    substrate (for instance, on IBM DTLA disks), even the illuminator might appear.
    You might object that when the hermetic case is opened the dust falls there anyway.
    It is going to disappear after you close the case? In reality, there is a recycling
    filter in the hermetic case, which actively adsorbs the dust, quickly reducing
    its level to acceptable values. If you work with the opened disk, the dust concentration
    remains constant. There, another reason is possible: the closed cover slightly
    deforms the hermetic case; therefore, without it disk reading may be unstable
    and require multiple repetitions. Installing the cover is a matter of special
    importance. Having started the utility that outputs the speed rate to the screen,
    try to adjust the bolts to achieve the most uniform reading curve.


    The hours left for a disk opened outside a clean room are numbered, and the time
    required for reading the data is lengthy, especially if you are using software
    and hardware that do not support direct memory access/ultra direct memory access
    (DMA/UDMA) modes. Therefore, it is better to immediately connect the disk to the
    computer and read vitally important data first. Do not forget to set the repeat
    counter to the value 3x. This means that it is necessary to read everything can
    be read on the first attempt and only then read the blocks that haven''t been
    read.


    Another trump card of serious companies is the availability of specialized hardware
    and software combinations, such as PC-3000 (Fig. 2.21) from ACE Lab.


