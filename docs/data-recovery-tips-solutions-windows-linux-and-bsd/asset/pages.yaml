    SCSI devices have the unified scheme of logical addressing, independent of the
    physical geometry of the device, and a high-level system of commands (such as
    read a sector or group of sectors and start the playback of an audio disc). Having
    received the command, the device places it into the queue and releases the bus;
    the request initiator (which might be the central computer or another SCSI device)
    switches to solving another problem. Having processed the query, the device captures
    the bus and sends the data to the initiator, informing the initiator about this
    event using the interrupts mechanism. In this way, the bus is efficiently used
    by several devices simultaneously, and idle time of the central processor is reduced
    to a minimum.


    Electrically, SCSI is either a standard multicore core or an optical fiber cable.
    In general, there are lots of competing standards, and it doesn''t make sense
