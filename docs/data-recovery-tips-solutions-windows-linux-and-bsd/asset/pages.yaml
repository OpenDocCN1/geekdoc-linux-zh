  md: '# Sleuth Kit


    This is a freeware set of utilities for manual recovery of the file system, which
    can be downloaded from http://www.sleuthkit.org/. The site also contains a brief
    manual (http://www.sleuthkit.org/sleuthkit/docs/ref_fs.html). Unfortunately, miracles
    are rarely encountered in this world. In this case, the entire technique of data
    recovery is reduced to scanning the free space and searching for files with known
    contents.


    # Foremost


    This is another freeware utility for recovering deleted files on the basis of
    their header formats and specific features of the structure. It works only with
    files whose structure it knows. Nevertheless, in comparison to its predecessors,
    this is a considerable advance. This utility does not interact with the file system
    directly; rather, it processes the files obtained using the `dd` command or the
    Sleuth Kit tool. Therefore, it is capable of “supporting” all file systems. The
    last version available for downloading can be found at the following address:
    http://foremost.sourceforge.net/


    # CrashUndo 2000


    This utility, available at http://www.frolov.pp.ru/projects/recovery.html#crashundo,
    is the most powerful data recovery tool for NTFS of all that I have ever seen.
    It works even with disks that Windows refuses to mount under any circumstance.
    It uses a minimal amount of system information, reconstructing reference structures
    by their signatures and recovering files even if MFT damage is significant. It
    reconstructs the directory tree even if one or more branches that contain parent
    directories turn out to be destroyed.


    # AnalizHD/DoctorHD


    These are two Russian programs intended for remote data recovery over the Internet,
    in case there are no serious companies specializing in hard disk drive repair
    near you.


    # EraseUndo for NTFS


    This program recovers deleted files that have not been physically erased from
    the disk yet.'
