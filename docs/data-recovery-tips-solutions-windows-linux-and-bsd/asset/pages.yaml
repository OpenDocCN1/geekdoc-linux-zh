- pgno: 210
  md: '# Chapter 8: Data Recovery under Linux/BSD 197


    supported. In addition, NTFS developers are not sleeping; consequently, the file
    system as such is constantly evolving (in other words, it is subject to changes).
    The question is: Is it possible, in theory, to write a fully-compatible NTFS driver
    that would correctly interpret newer NTFS versions without programmer''s participation?
    This question isn''t as stupid as it might seem at first. Why do we need to spend
    time and effort, when there is a ready-to-use driver — nfs.sys? If you make it
    work under Linux, all problems will be solved automatically.


    The objection to this approach, that Linux/BSD is considerably different from
    Windows at the kernel level, is not applicable here. There are considerable differences;
    however, there are also common features. Windows, Linux, and BSD all operate on
    x86 processors in protected mode, use virtual memory access, and interact with
    the hardware to strictly-defined mechanisms (through a hierarchy of physical and
    virtual buses). High-level drivers, such as ntfs, contain only the required minimum
    of system-dependent code and never communicate with the hardware. Why, then, doesn''t
    the driver written for one system operate in others? Mainly because the interface
    between the driver and the operating system is different in each case, and because
    the driver uses libraries of functions exported by the system (and these functions
    are different for different systems).


    Porting Windows to Linux/BSD is a realistic task. To achieve this, it''s not necessary
    to write a simple "stub" between the driver and the operating system, which would
    accept queries, translate them according to the system-specific rules, and port
    the library of functions needed for the driver to operate. It is necessary to
    have the programming skills to achieve this goal. For most users, this is not
    suitable, and nothing can be done about it. For programmers, however, porting
    an existing driver is much easier than writing a new one from scratch. To achieve
    this goal, you won''t need to tediously disassemble the original code (which usually
    replaces the search for technical documentation). As a rule, technical documentation
    is either unavailable or provided only after you sign an agreement prohibiting
    you from distributing the source code. In addition, when newer versions of the
    Windows driver are released, the procedure of updating the Linux/BSD driver is
    considerably simplified and often reduced to overwriting an original file. However,
    this is only in theory. Now, it is time to model this issue in detail.


    The kernel model of Windows NT and all its successors, including Windows 2000,
    XP, 2003, and Longhorn, is quite simple (Fig. 8.3). The kernel communicates with
    the "outside" world through the system service manager "connected"


    ![](img/1ce3cead9a6814cc94d1e00101c20220_210_0.png)'
