  md: 'partition fields of the following partitions using context searching. Look
    for the sectors containing the 55h AAh signature in the end. It is easy to distinguish
    a boot from a partition (the boot sector stores the manufacturer''s identifier,
    such as NTFS or MSWIN4.1, at the 2-byte offset from its beginning). The size of
    the current partition is smaller by one sector; knowing the size and geometry
    of the disk, it is possible to compute the ending CHS.


    Bear in mind that Windows stores a copy of the boot sector, depending on the version,
    can be located in the middle or in the end of the partition. Other copies can
    be found in backup files and in the swap file. By the way, it is recommended that
    you look at these to check whether they contain something digestible. How do you
    distinguish a sector copy from its original? Obvious, my dear Watson! If it is
    the original, it will be followed by the internal file system structures (for
    NTFS, this will be MFT, in which every record starts from the easily recognizable
    FILE* string). Internal structures of the file system are located at more or less
    predictable offsets from the partition start, based on their dislocation it is
    possible to restore the size of every logical disk, even if all boot or partition
    entries are destroyed.


    What happens if the partition boundaries are determined incorrectly? If you go
    too far by increasing the partition size more than necessary, everything will
    operate normally, the map for free space is stored in a special structure (for
    NTFS, this is the Sbitmap file, and for FAT16/32 it is the FAT itself) and sectors
    that go beyond the boundary will be added only after you reformat the partition.
    If you only need to copy the data from the disk being recovered to another media,
    then you do not need to tune the parameters in the partition table. Simply expand
    it to the entire physical disk.


    This method is suitable only for recovering the first partition of the disk. For
    all other partitions, you will need to determine the starting sector. This must
    be done correctly, because all structures of the file system are addressed from
    the beginning of the logical disk. Thus, if you err by a single sector, the entire
    mechanism will become unusable. Fortunately, some of these structures refer to
    themselves, providing some clues. In particular, the Sm/$mft files contain the
    number of their first cluster. If you find only the first FILE* record, you will
    find the number of the current sector (provided that you can determine the number
    of sectors per cluster, but this is another topic that will be covered in the
    “Boot Sector Basics” section later in this chapter).'
