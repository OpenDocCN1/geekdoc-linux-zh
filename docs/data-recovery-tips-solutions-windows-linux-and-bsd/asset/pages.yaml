  md: '# Chapter 8: Data Recovery under Linux/BSD 241


    # To Update or Not To Update


    Some applications, in particular, the previously-mentioned Squid Web Proxy server,
    require special customization of the file system. To improve the performance,
    it is recommended that you disable updates of the last access time to the file
    (mount -o noatime). The most impressive performance growth was noticed on UFS,
    which, in contrast to other file systems, doesn''t retard INODE (lazy write) but
    does do this immediately after the change (write through). On ext3fs of its logging
    nature, the atime update makes such a small contribution into the total performance
    that there is practically no difference whether or not the last access time is
    updated.


    # The Problem of Tails


    By default, ReiserFS saves short files (and their tails) on the leaves of binary
    trees. In general, this increases performance multiple times, especially if you
    are not short of disk space (Figs. 8.17 and 8.18). Nevertheless, when working
    with certain applications,


    ![](img/1ce3cead9a6814cc94d1e00101c20220_254_0.png)


    Fig. 8.17. ReiserFS performance on write operations, depending on the free space
    available (tail packing is enabled)'
