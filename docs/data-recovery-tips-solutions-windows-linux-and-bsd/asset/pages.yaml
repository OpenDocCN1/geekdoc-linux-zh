- pgno: 297
  md: '# Universal Disk Format: Forfeit for Carelessness


    Once upon a time, when CD recorders were only starting their expansion on the
    market, an enraged purchaser phoned the customer service of a computer company,
    complaining that they sold him an unusable CD recorder. When the technical support
    specialist asked that customer, which program he used for recording, he answered,
    without hesitation, that he used Norton Commander.


    This anecdote won''t make anyone even smile. Contemporary optical media have become
    so intellectual, that practically any program can be used to copy information
    to CDs, be it Windows Explorer, FAR Manager, or even Norton Commander. This convenience
    has been achieved at the expense of reduced reliability, decreased capacity, a
    slowed operating system, and other unpleasant side effects, but that doesn''t
    really matter.


    Beginners have a tough time grasping all of these intricacies. Information obtained
    from forms is inconsistent, and technical specifications that deserve to be trusted
    are too difficult to understand. What could be done to improve this situation?


    The mechanism of transparent writing to CD or DVD, where most users associate
    with the DirectCD trademark, is based on two mutually complementary technologies
    — packet writing and a dynamic file system, the role of which is usually delegated
    to the universal disk format (UDF). These two concepts are often confused, although
    they are on different levels of the hierarchy.


    Packet writing is the burning mode, supported by the drive at the hardware level.
    There are other burning modes: session at once (SAO), disc at once (DAO), and
    track at once (TAO). Without dipping into technical details, it is necessary to
    mention that the burning mode defines the size of the data portion written by
    the drive at once (in other words, without stopping the laser).


    DAO, which is the most wasteful of all available modes, burns the entire disc
    image in one pass, from the first sector to the last one, and doesn''t allow you
    to add further information. SAO is a more economical mode because it allows you
    to add further information multiple times, one session at a time. However, each
    session takes at least 15 MB of disc space, which is too much. TAO, which requires
    only 300 KB per track, is unfortunately, applicable only to CD-... (In my opinion,
    implementing such a support is a worthy task for enthusiasts). Furthermore, all
    three modes do not allow you to delete the data written previously because they
    were designed exclusively for CD-Rs. In the best case, only an imitation of erasing
    is implemented,'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Chapter 10: Recovering CDs 285


    which removes references from the directory. However, the data are not physically
    removed. Furthermore, such a deletion doesn''t increase the available disc space.


    The packet writing mode is free from all these drawbacks. It reduces the space
    overhead to 14 KB per packet. The burning process is carried out in a block of
    constant or variable size (block size can vary from 2 KB to 2 MB). The maximum
    allowed packet size is limited by the specific design features of the individual
    drive. It varies from model to model. However, it must be no less than 64 KB;
    otherwise, this won''t be a drive that satisfies the standard. The packets sequentially
    fill the disc, proceeding from its external edge to the center. Optical discs
    do not allow random writing. The spiral track must be continuous and cannot jump
    over the entire medium surface. The nature of the CD requires the information
    to be spread over the spiral track, skipping bits of different sectors. This allows
    better reliability and the possibility of data recovery in case of radial scratches
    and local defects. Therefore, it is principally impossible to write a single sector
    at a time. It is also impossible to write a packet to the middle of the disc,
    leaving at least one unburned sector behind (Fig. 10.9), the packets that have
    been written earlier can be rewritten multiple times; thus, the possibility of
    file deletion is ensured.


    The packet writing mechanism alone is not enough to achieve the desired goal.
    It is also necessary to choose a proper file system to support it. Standard file
    systems, such as ISO 9660 and Joliet, developed for CD-ROM and unaware of fragmentation,
    expect to see a continuous block of free space on the disc, which cannot always
    be available.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_298_0.png)


    Fig. 10.9. Incremental writing examples'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 286 Part III: Backup-Media Data Recovery


    The UDF file system was developed by the Optical Storage Technology Association
    (OTA) with DVD in mind and was far from an idea for media domination. However,
    the project was so advantageous that it didn''t take much effort to adopt it for
    CD-RWs, taking into account all details of its structure. UDF doesn’t operate
    with physical disc formatting. Rather, it requires a logical format, so it doesn’t
    matter on which medium it is used.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_299_0.png)


    A disc written in using UDF need not be written in the packet mode, and vice versa—
    not every packet mode uses UDF services. The possibility of selective writing
    and deletion of individual files at the hardware level is ensured by the packet
    writing mode, and at the software level it is ensured by a specialized driver
    snap-in. UDF only reduces the overhead to a reasonable minimum.


    Several UDF specifications exist, the most reliable of which are the following
    releases:


    +   - 1.02 — Describes data placement (including video) on various media, including
    UDF-ROMs; supports fragmentation and other useful features

    - 1.50 — Includes media defects manager, which prevents data from being written
    to defective locations of the medium, and adds the possibility of working with
    a CD-R or CD-RW

    - 2.00 — Supports streaming files, access control lists, laser calibration, and
    other auxiliary features

    - 2.01 — Supports real-time files, ensuring preservation of the specified reading
    for the entire disc


    Windows 98 supports UDF 1.02, Windows 2000 works with version 1.02, and Windows
    XP ensures support for versions 1.02, 1.50, and 2.01. To work with other releases,
    it is necessary to install appropriate drivers because further releases do not
    include all previous ones. UDF support is one large problem here. To solve this
    problem, it is often necessary not to install an additional driver but also to
    update the kernel.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Components Required for Working with UDF


    To fully enjoy all features of working with discs formatted for UDF, you’ll require
    the following:


    +   - CD/DVD recorder that supporting the packet writing mode. Note that this
    must be fully-featured support, not just an unsubstantiated manufacturer’s declaration
    (usually, such declarations are marketing tricks). The recorder must be designed
    and implemented for all stringent requirements of packet mode support. Test labs
    of various magazines supply fairly complete information about the characteristics
    of the most popular drives, so choosing an appropriate model usually isn’t a problem.

    - UDF driver would translate the internal language of the UDF service structure
    to the language of the operating system. This driver is usually called a UDF reader.

    - UDF monitor that traps all requests to the CD and ensures “transparent” disc
    formatting and writing. The monitor usually is the entire hierarchy of drivers,
    for which it is possible to distinguish at least two levels — drivers for abstracting
    specific hardware features and drivers for a specific operating system. In addition,
    it is necessary to indicating software that displays the state of the drive in
    the system tray. If you do not plan to burn CDs from FAR Manager, but would like
    to use the packet writing mode to minimize the drive overhead, it is possible
    to do without a UDF monitor. In this case, the monitor can be replaced by CD-burning
    software, such as that Nero.


    To start accumulating your first experience with this type of formatting, I recommend
    that you purchase some retail drive, which is supplied with all required software
    automatically installed by the installation utility; otherwise, you’ll most likely
    encounter difficulties. It is necessary to make sure that the packet writing program
    (to be precise, its system driver) supports the latest UDF version. I mention
    this es because most contemporary, and quite advanced, recorders are supplied
    with obsolete software supporting only UDF 1.5 and unaware of the further versions.
    This information can be easily found on the Internet in the specification for
    the chosen drive.


    It is always possible to update an older version (for example, through the Internet);
    however, the situation is not that simple. First, such updates are not always
    free.'
