- pgno: 185
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    Unfragmented files can be recovered easily. It is enough to select a group of
    sectors and write it to the disk (never write it on the volume being recovered).
    The only problem is determining the original length. Some types of files allow
    the presence of garbage in their tail (in which case it is possible to include
    several sectors, to be on the safe side). However, some files do not tolerate
    this. If you cannot determine the end of file visually (for example, PDF files
    are terminated by the EOF signature), then analyze the file header. The file size
    is usually present there, along with other useful information. In this case, everything
    depends on the structure of individual file, so it is impossible to give any universal
    recommendations.


    If the file is fragmented, the situation is hopelessly hopeless. To assemble the
    scattered chains of clusters, it is necessary to know the content of the deleted
    file well. In this case, NTFS is much more difficult to restore in comparison
    to FAT. The sequence of the file fragment stored in FAT in the form of a unidirectional
    list is highly enduring. If the list is not damaged, it is enough to find its
    first element (which is extremely easy to do, because it will point to the file
    header with predicate content). Even if the list is split into several parts,
    they continue a life of their own, and it only remains to choose the right combination,
    which can be combined. This list is ruined only if FAT is overwritten completely.
    In NTFS, the order of file fragments is often stored in tiny lists, which are
    often destroyed. If this happens, you''ll have to deal with randomly scattered
    clusters. The situation with text files is not as disastrous as with spreadsheets,
    graphics, or archives. Without knowing the strategy of disk space allocation it
    is impossible to succeed. The order, in which the file system driver finds suitable
    fragments, is undefined and varies depending on lots of circumstances. However,
    some regular patterns are present here


    In the course of analysis of highly fragmented disks, I have discovered the following
    pattern: first the “holes” are filled, proceeding from the end of the MFT zone
    to the end of the disk. Then, the file driver goes back and starts filling smaller
    holes. It proceeds this until the entire file is saved to the disk. The holes
    that are only one cluster in size are the last to be filled. When viewing the
    disk map presented by $BITMAP, it is possible to exactly reconstruct the order,
    in which fragments of the deleted file were placed into the disk, after which
    it is possible to combine them, at least in theory. In practice, you''ll encounter
    lots of pitfalls when proceeding this way. From the moment the file being recovered
    was created, the map of free disk space can radically change. Every deletion of
    one or more files frees one or more holes that are randomly mixed with'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Chapter 7: NTFS Data Recovery 173


    the holes of the file being recovered, thus distorting the pattern. How is it
    possible to overcome this? Scan MFT to search for records marked deleted but not
    overwritten. Decode run lists and remove the corresponding candidates for recovery.
    This considerably narrows the range of the search, although the number of possible
    combinations, with which it is possible to assemble the fragmented file, remains
    impressive. This, however, is only part of the problem.


    The most "interesting" events start when several files are simultaneously written
    to the disk (for instance, assume that you simultaneously download several files
    from the Internet with ReGet) or when a file is steadily increasing in size and
    other files are simultaneously being written to the disk. When a tiny portion
    of data is added to the existing file, the file system finds the smallest possible
    hole, then the next smallest hole, and so, until the small holes are exhausted.
    Then the file system starts using larger holes. As a result, the file becomes
    strongly fragmented. This time, the file is filled in the reverse order—from small
    holes to larger ones (in contrast to the allocation strategy). Small fragments
    of one file are mixed with fragments of other files.


    The documents created in Microsoft Office are the most difficult to recover, because
    the application creates lots of backup copies of the file being edited, both in
    the current directory and in the %temp% directory. It will be difficult to find
    out, which fragment belongs to which file.


    Zip archives are the easiest to recover. To achieve this, it is not necessary
    to use the disk editor. Open a temporary file for writing, search for free disk
    space, and close the file. Now, process it with the pkzipfix.exe utility (or start
    the standard pkzip.exe with the Fix command-line option). The "corrected" file
    will magically display all surviving archives. The internal structure of the Zip
    allows pkzipfix.exe to easily recognize reordered blocks, so a high level of fragmentation
    doesn''t present any obstacle for it.


    Defragmentation also occurs in an interesting way. The standard defragmentation
    API, for some unknown reason, operates over blocks instead of individual clusters.
    The minimum size of the block is 16 clusters, and the start of the block must
    be a multiple of 16 clusters. The number of small holes only increases after defragmentation,
    and contiguous areas of free space become few.


    Do not forget that nothing can be placed into the MFT zone. It is common to see
    the message informing you that for efficient operation the disk defragmenter requires
    at least 15% of available disk space. Even though you might have 17% of the disk
    space available on your drive, only 5% could be available for the de'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 174 Part II: Automated and Manual Hard-Disks Data Recovery


    fragmenter. Why is the rest of that disk space unavailable? This is because this
    space is located inside the MFT zone. (Recall that in disk formatting 10% of the
    volume is reserved for the MFT file. As the disk space becomes exhausted, the
    SMART reduces in size approximately 2 times, and the released space is populated
    with user files.) In other words, for guaranteed operation the defragmenter requires
    10% + 15% == 25% of free disk space. Isn''t this payment too high for defragmentation?
    If you have more than 25% of free disk space available, it is recommended that
    you create a temporary file on the disk and seek to fill large gaps to prevent
    the defragmenter (after defragmentation this file must be deleted). Frankly, the
    16-cluster limitation doesn''t relate to compressed files; therefore, I highly
    recommend that you store files in compressed form, because this considerably reduces
    volume fragmentation. Fragment your disk as possible! This not only improves performance
    but also simplifies the recovery of a file with an overwritten file record.


    In the general opinion, file recovery is not a difficult operation; however; if
    you have to recover deleted files, you can automate this process by writing several
    simple utilities. To access the logical drive under Windows NT, it is enough to
    open the file with the same name using the Create("\\X:\", GENERIC_READ, FILE_SHARE_READ,
    0, OPEN_EXISTING, 0) function, where X is the logical drive name (for more details,
    see Microsoft''s SDK documentation).


    Do not think that all utilities have been written without your participation.
    Utilities suitable for professional data recovery from NTFS volumes are readily
    available on the market. The existing tools have drawbacks and ridiculous limitations
    (for example, they cannot limit the sector search range by free or occupied space).
    Only you can venture to write such tools on your own.


    # Studying the Fragmentation Mechanisms


    There are at least two techniques of investigating disk space allocation: static
    and dynamic. In the first case, it is necessary to start the disk editor (the
    preferred one is DiskExplorer from Runtime Software) and analyze run lists of
    files written at different times and using different methods (Fig. 7.3). For example,
    it is possible to copy a file from one location to another or sequentially increase
    the size of several files — the allocation strategies will be different in these
    cases. The static approach is useful in that it allows you collect priceless statistics
    for the entire volume; however, it determines only the final result, not how it
    was achieved.'
  merge: -1
  img_proc: true
