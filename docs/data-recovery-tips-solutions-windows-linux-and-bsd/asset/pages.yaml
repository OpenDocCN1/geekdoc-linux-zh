    # Manual Recovery of the Hard Disk after Formatting


    This section describes how to manually recover the entire formatted partition
    without using any additional storage media and expensive third-party utilities.
    All that will be needed is any disk editor (the best choice would be DiskExplorer
    from Runtime Software); however, in the worst case the free Disk Probe and Sector
    Inspector from Microsoft, in combination with ChDisk, will do.


    Most key data structures are irreversibly destroyed by code of formatting. Manually
    recovering them is too troublesome a process. Fortunately, this is not needed!
    The main idea is that it is necessary to recover all list files; all remaining
    work can be delegated to ChDisk.


    Disassembling has shown that the data structure, however when ChDisk cannot operate,
    is the $DATA attribute of $MFT file. Therefore, the only thing that you need to
    recover is the original MFT:$DATA and it over the original records. In the simplest
    case (if MFT:$DATA is not fragmented), this can be achieved by a speculative inference
    of its length. Is it possible to achieve this?


    Start DiskExplorer, go to the start of MFT (Goto | Mft), click the $MFT file,
    find the $DATA attribute ($80), and increase the Allocated Size, Real Size, and
    Compressed Size by the required value, simultaneously correcting the run list
    (Fig. 7.10). It is not necessary to correct the Last VCN file, because ChDisk
    will recover it accurately. How would you determine the length of the unfragmented
    MFT file? It is equal to the difference of the numbers of the first and the last
    sectors starting with the FT signature, multiplied by 512 bytes (excluding the
    sectors that belong to $MFTMirr). Most disk editors know to me not support a search
    for the last occurrence; therefore, it is necessary to write such a utility on
    your own. Fortunately, it is not necessary to determine the exact MFT length.
    It is possible to take it with some reserve, because ChDisk will discard everything
    that isn''t needed.'
