- pgno: 78
  md: '# Chapter 4: Repairing Hard Disks


    ![](img/1ce3cead9a6814cc94d1e00101c20220_78_0.png)


    Before trying to repair logical damage, such as unintentional formatting or deletion
    of files (the types of damage mainly discussed in this book), it is necessary
    to describe the techniques of recovering hard disks after hardware failures. This
    is a must, because this is a question of life or death for your hard disk drive.


    # Introduction


    Hard disks are sharply increasing in size; however, their reliability is dropping
    no less sharply. On one hand it is data density, but on the other is competition.
    Most manufacturers use cheap spare parts and implement engineering solutions that
    are far from mature and reliable. Consequently, these solutions must be tried
    by the users (in other words, people like you and me). Why? Regardless, manufacturers
    and customers rarely come to mutual understanding. The main guarantee that can
    be provided to the user is daily backup. This is especially true if you recall
    that contemporary removable media allow this possibility. Nevertheless, even advanced
    professionals often neglect this possibility, which is sad.'
