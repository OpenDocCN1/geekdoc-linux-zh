- pgno: 178
  md: '# # Chapter 7: NTFS Data Recovery


    As mentioned earlier, despite the reliability of NTFS, it doesn’t insure against
    loss of data. This chapter concentrates on techniques of recovering data on NTFS
    disks, both using automated tools and manually. Because disk doctors often strike
    a finish-

    -ing blow instead of providing a cure, I strongly recommend using manual techniques.


    # ## Undeleting Files in NTFS


    NTFS reliability is one thing, but dealing with erroneously deleted files is a
    different matter. Any file system, even one as powerful as NTFS, is unable to
    protect users against their own errors. Nevertheless, it provides rollback possibilities
    for recent actions. This is especially true if you recall that it implements transactions
    and log-

    -ing. At first glance, it seems that to achieve perfection it only remains to
    take a sin-

    gle step. However, Microsoft has made no headway and still hesitates before taking
    this step (or this is held in reserve for the future versions?). All "protection"
    against unintentional deletion is implemented at the GUI level, which is both
    inconvenient and unreliable.


    If the deleted file is present in the Recycle Bin, you are lucky. However, what
    should you do if there is no such file there? In this section, I’ll describe techniques'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'of manual file recovery, including cases, in which an appropriate file record
    is missing. In these situations, you''ll have to restore the file cluster by cluster.


    # The FILE_DISPOSITION_INFORMATION Packet


    IRP_MJ_SET_INFORMATION or FILE_DISPOSITION_INFORMATION is a packet sent to the
    NTFS driver when a file is deleted (bear this in mind when disassemble something).
    To learn how to recover deleted files, it is necessary to understand the processes
    that take place when a file is deleted from an NTFS partition. A brief description
    of these processes is provided here:


    +   - The /SMFT:$BITMAP file is corrected. Every bit of this file defines whether
    the appropriate file record is occupied (the zero value means that the record
    is not used).


    +   - Every bit of the /$BITMAP file defines whether the cluster that corresponds
    to it is occupied (the zero value means that cluster is not used).


    +   - File records that correspond to the file are marked as deleted. This means
    that the FLAG field located at the offset 16h from the beginning of the file record
    is reset to zero.


    +   - The reference to the file being deleted is removed from the indexes'' binary
    tree. I won''t provide a detailed description of this issue, because only true
    wizard can manually recover the table of indexes. Furthermore, this is not necessary.
    Indexes play an auxiliary role in NTFS. It is much easier to repeat the directory
    indexing than to restore the balanced binary tree.


    +   - The $STANDARD_INFORMATION attribute (such as the last access time) of the
    directory that stored the file is refreshed.


    +   - The sequence number in /$LogFile is updated (the modifications introduced
    into the transaction log are not considered here).


    +   - The attribute for update sequence number is increased by one for further
    file records: the file being deleted, the current directory, /$SAF, /$SMFT:$BITMAP,
    /$BITMAP, /$BOOT, and /$TRACKING.LOG.


    Directories are deleted in practically the same way as files. Recall that from
    the file system''s point of view, directories represent a specific kind of files
    that contain a binary tree of indexes inside.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Chapter 7: NTFS Data Recovery 167


    Neither files nor directories are deleted physically. Any file can be recovered,
    provided that the file record belonging to it and storing the resident file body
    or the run list of nonresident content has not been overwritten. The loss of a
    file record is extremely undesirable, because in this case you''ll have to reconstruct
    the file manually, by cluster by cluster. The higher the file fragmentation, the
    more complicated this task will be. In contrast to FAT, NTFS doesn''t overwrite
    the starting character of the file name, considerably simplifying the recovery
    procedure.


    # Automated Recovery of Deleted Files


    Utilities that recover deleted files are not supplied as part of the Windows operating
    system, and users must purchase them with MS-DOS, which provided such a tool.
    The GetDataBack utility for NTFS is one of such tools (Fig. 7.1). Being aware
    of the possibility of ruining the file system, most users avoid writing any data
    to the disk directly. Instead, they should read


    ![](img/1ce3cead9a6814cc94d1e00101c20220_180_0.png)


    > Fig. 7.1. The GetDataBack utility is recovering deleted files'
