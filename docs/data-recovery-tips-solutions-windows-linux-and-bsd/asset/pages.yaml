    # Hex Editors


    UNIX is different from Windows. With particular, with UNIX it is possible to do-

    out editors. For example, you can use any hex editor, open an appropriate disk

    device (such as /dev/sdb1), and edit it as you please. Hackers of earlier generations

    might recall in the youth of MS-DOS, when neither HIEW nor QVIEW was

    available, they corrected executable files to “cut off” unneeded 7xh using Norton

    Disk Editor. In other words, a hex editor was used to get the point? In

    UNIX, on the contrary, hex editors are used to edit the code.


