    # # Master Boot Recovery Basics


    The first hard disks had small capacity (even for that time), and they were formatted
    in a similar way to formatting of diskettes. However, their size grew sharply,
    and soon MS-DOS became unable to provide enough address space to fully the physically
    available disk space. To overcome this limitation, the *partitions* mechanism
    was introduced, which divided one physical disk into several logical drives. Each
    logical drive had its own file system and was formatted independently of the other
    drives. How did the developers achieve this?


    The first sector of a physical disk (cylinder 0/head 0/sector 1) stores a special
    data structure called the master boot record (MBR). It is composed of two main'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    parts — the master boot code and the partition table, which describes the partitioning
    method and geometry of every logical disk. A schematic representation of a partitioned
    disk is shown in Fig. 5.1. In the end of the sector, at the 1FE offset, there
    is the 55AAH signature, which BIOS determines whether the sector is bootable.
    Even if you do not want to split your disk into partitions and you format it as
    a single drive, the presence of the MBR is required.


    At start-up, BIOS chooses the bootable disk. As a rule, this is the primary disk;
    however, most BIOS implementations allow you to change the boot order, and the
    most advanced ones display an interactive menu when the user presses the <ESC>
    key to enter the BIOS Setup program in the course of power-self test (POST). Then
    BIOS reads the first sector, loads it into the memory at 0000h:7C00h address,
    checks whether the 55AA signature is present in the end of the sector, and if
    a signature is found, passes control to 0000h:7C00h. If this is not the case,
    BIOS analyzes further boot devices in the boot sequence list. If there are no
    other bootable devices in the system, BIOS displays an error message.


    The bootstrap loader, having received control, scans the partition table (which
    has already been loaded into the memory). It finds the active partition (the one,
    of that partition (also known as boot sector), and loads it into the memory at
    0000h:7C00h:7C00h address (having previously relocated its body before rewriting).
    After that, it makes sure that the 55AA signature is present and passes control
    to 0000h:7C00h. If this is not the case, an error message is displayed, and the
    computer is rebooted after the user presses any key. There are some loaders that
    support more than one active partition, sequentially testing them; however, this
    entirely depends on the developers, because it doesn’t correspond to the standard
    Microsoft specifications. However, this doesn’t disturb anyone.


    | C | D: | E: | F: |

    |---|---|---|---|


    +   - Partition table

    - Partition


