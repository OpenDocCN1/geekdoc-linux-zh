- pgno: 326
  md: '# Chapter 11: Repairing CD/DVD Drives under Home Conditions 313


    of unfavorable operating conditions. Self-respecting manufacturers individually
    tune the parameters of each laser, setting the required modes either by trimming
    resistors (in cheap models) or by writing them directly into the firmware (in
    expensive models). Generic manufacturers set all parameters to the average level,
    for which some heads is too low and for other heads is too high. By the way, unlocking
    CD/DVD drives and replacing their firmware with hacked versions, all previous
    settings are lost, if the hacker doesn''t save them first, the first laser will
    fail or its operation will be unstable.


    Reduction of laser brightness increases the reading and positioning errors (some
    disks might cease to be recognized). The drive might refuse to recognize all disks,
    sometimes even without trying to increase the speed of rotation. Usually, the
    drive''s motor increases the rotation speed only when the sensor registers the
    reflected signal. If there is no signal, it is considered that there is no disc
    in the drive.


    You can accurately disassemble the drive, connect it to the computer, and see
    whether the laser lights when the tray is closed. Provided that the emission is
    normal, you will see the beam — even in a sunlight room. The laser that starts
    to lose emission can be distinguished in a darkened room. If you cannot distinguish
    any traces of the laser beam in complete darkness, then the possible reason of
    laser failure is failure of the electronic components (bear in mind that the laser
    is not visible at any angle). Be careful when watching the light, because the
    laser beam might damage the eye and even cause blindness. However, this risk is
    not too great.


    A laser head replacement costs approximately half of the price of a new drive.
    With steady technical progress and newer models of drives that are considerably
    better than old ones, a replacement is in expedient. As a variant, it is possible
    to reanimate the laser by simply increasing the power supply. Trace the wires
    connected to the laser emitter. Among them, there must be a resistor. Soldier
    an additional resistor to that one, choosing its resistance to make the drive
    recognizes with confidence. A better repairing method is as follows: Discover
    the model of the chipset that controls the laser (as a rule, this is the largest
    chip), and search the Internet to find its technical specification. Among other
    useful information, the specification must contain the mechanism for regulating
    the power of the laser beam. As rule, this task is carried out by one or more
    resistors connected to the chipset (not to the laser head). Some models allow
    you to tune the laser through SCSI or ATAPI using special commands described in
    technical documentation, or through a technological connector.'
