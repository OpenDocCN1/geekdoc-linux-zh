- pgno: 47
  md: '# Part I: Data Recovery Tools


    all main NTFS data structures in readable format, mount virtual disks, work with
    hard disk and CD images, restore deleted files from any MFT record, and copy files
    and entire directories, having previously viewed them in text or hex format. This
    list of functional capabilities is far from complete. The editor has a convenient
    forward–backward navigation system (approximately the same as in a browser or
    IDA Pro, even supporting hyperlinks). Also, DiskExplorer provides an abundance
    of hotkeys, supports jumps history, and is equipped with a powerful search system
    main structures (INDEX, MFT, Partition). Also supported are the capabilities of
    searching for references to the current sector and of recovering a disk remotely
    through a TCP/IP connection, a local area network connection, or a direct cable
    connection. All numeric data are displayed in two numerals systems — decimal and
    hex.


    This is my main and favorite instrument for investigating the file system and
    recovering lost data. Even superficial acquaintance with this powerful tool can
    make rejoice. Hackers finally have their tool of choice, which long seemed an
    unattainable dream. Naturally, ever really good thing must be paid for. DiskExplorer
    is a commercial product, and the trial version available for free downloading
    lacks the possibility of writing to the disk. There are two different versions
    of the editor: one version supporting NTFS (http://www.runtime.org/ntexpl.zip),
    and another one supporting FAT. In addition, there are several plug-ins for Bart
    PE Builder that can be downloaded from the Runtime software.


    # Sector Inspector


    This instrument is supplied as part of the resource kit products for different
    versions of Windows, freely distributed by Microsoft. This is a noninteractive
    utility for reading and writing individual sectors from and to the file (Fig.
    2.10). This utility supports logical block addressing (LBA) and cylinder–head–sector
    (CHS) addressing. When started without parameters, it displays the decoded partition
    table, along with extended partitions and boot sectors. Disk editing is carried
    out by correcting the sector dump using any suitable hex editor and writing the
    corrected version to the disk. This is a slow and inconvenient method; however,
    far as I know, Sector Inspector is the only editor that supports operation under
    Recovery Console. Because of this, sometimes it might be indispensable.'
  merge: -1
  img_proc: true
