    Exceptions from this rule are rare. They occur only if the original MFT was replaced
    by the fragmenter or if a different cluster was specified for formatting. In all
    other cases, approximately the first 24 records are destroyed irreversibly. Records
    contain the following: $MFT, $MFTMirr, the root directory, /$LogFile (the transaction
    file), /$BITMAP (the map of free space), /$Secure (security descriptors), and
    other system files.


    +   5. The $MFT:DATA file is initialized. The new length ($MFT:$30.AllocatedSize,
    $MFT:$30.RealSize, $MFT:$80.RealSize, $MFT:$80.CompressionSize, $MFT:$80.Initialized,
    $MFT:$80.LastVCN) and the date of creation or modification ($MFT:$10.CreationTime,
    $MFT:$10.FileReadTime, $MFT:$30.FileCreationTime, $MFT:$30.FileAlertedTime, $MFT:$30.ChangeTime,
    $MFT:$30.FileAndTime) are assigned. Most important, the new list of runs is created.
