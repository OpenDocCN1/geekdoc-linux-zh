    # Choosing the File System


    There are two types of the file systems — file systems with logging support (journaling)
    and ones that do not support logging. File systems of the first type include ext3fs,
    ReiserFS, and XFS, and examples of without logging support are Minix, ext2fs,
    and UFS. File systems with logging are more tolerant to system freeze and unexpected
    power failures during intense disk operations. They automatically return the system
    to the stable state; however, they do not protect the system against other types
    of destruction, including controller failure, surface defects, and virus attacks.
    At the same time, they considerably decrease the performance.


    For home computers and most workstations, logging is not necessary and the reliability
    of the ext2fs file system is enough, especially if the computer is equipped with
    an uninterruptible power supply. When the highest reliability is necessary,'
  merge: -1
