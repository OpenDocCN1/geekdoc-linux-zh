  md: "# Part II: Automated and Manual Hard-Disks Data Recovery\n\n![](img/1ce3cead9a6814cc94d1e00101c20220_125_0.png)\n\
    \n# Dynamic Disks\n\nDynamic disks, which were introduced with Windows 2000, are\
    \ software RAID intended to overcome the limitations of standard partitioning\
    \ mechanisms. They take into account all the errors of their direct predecessor\
    \ — software RAID implemented in Windows NT, which stored configuration information\
    \ in the system registry. This drawback prevented RAID from being migrated from\
    \ machine to machine and made RAID vulnerable to registry damage.\n\n# Types of\
    \ Dynamic Disks Supported in Windows 2000\n\n+   * Simple — These are practically\
    \ no different from normal partitions except that the need to reboot the computer\
    \ after repartitioning the hard disk is eliminated.\nThis is the basic type of\
    \ all other dynamic disks.\n  * Redundancy: none\n  * Efficiency: low"
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery 113


    Spanned — These are composed of one or more simple disks located on different
    partitions or even devices but are represented as a single logical disk. The data
    on simple disks are written sequentially (classic linear RAID).


    +   - Redundancy: none

    - Efficiency: low


    Striped — These are the same as spanned except that the data are written in parallel
    to all simple disks, provided that they are connected to different channels of
    the IDE controller. This considerably increases the data exchange rate. In short,
    this is a classical level 0 RAID.


    +   - Redundancy: none

    - Efficiency: medium


    Mirrored — These are two simple disks located on different devices. The data are
    duplicated on both media (level 1 RAID).


    +   - Redundancy: medium

    - Efficiency: medium


    Striped — These correspond to level 5 RAID. They are composed of three or more
    disks and represent a striped volume with parity control. The data are written
    to two disks into blocks; the third disk contains the third block, into which
    error-correction codes (ECCs) are written, using which the contents of any blocks
    can be recovered on the basis of the second block.


    +   - Redundancy: high

    - Efficiency: high


    Mirrored striped — These correspond to RAID 1+0.


    +   - Redundancy: medium

    - Efficiency: high


    By default, Windows creates the basic disks (term definitions can be found in
    Table 5.6); however, any basic disk can be updated to a dynamic disk at any time.
    This won''t require rebooting the machine. Dynamic disks do not use the partition
    table; therefore, they do not experience any problems related to the limitation
    on CH bit width, which provides the possibility of creating volumes of an unlimited
    size. However, dynamic disks created by updating basic partitions remain in the
    partition table, and their Boot ID changes to 42h. If information happens to be
    deleted, the system would refuse to connect such a dynamic disk. By the way, Windows
    can be installed only on an updated dynamic disk, because BIOS can boot the system
    only from those partitions listed in the partition table and dynamic disks created
    on the fly are not stored there.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    Table 5.6. Terminological correspondence for dynamic and basic disks

    | Basic partitions | Dynamic partitions |

    |---|---|n| Primary partition | Simple volume |

    | System and boot partitions | System and boot volumes |

    | Active partition | Active volume |

    | Extended partition | Volume and unallocated space |

    | Logical drive | Simple volume |

    | Volume set | Spanned volume |

    | Stripe set | Stripe set |


    The partitioning method of dynamic disks is stored in the LDM database. This is
    a logged, fault-tolerant database supporting transactions. In the course of manipulations
    of volumes a power failure occurs unexpectedly when the computer is next powered
    up, transactions will be rolled back. If the hard disk containing one or more
    dynamic disks is migrated to another system, dynamic disks will be automatically
    recognized and mounted like normal disks.


    The LDM is stored in the last megabyte of the hard disk. For dynamic disks obtained
    by updating a basic partition to a dynamic one, this information is stored in
    the last megabyte of that partition and Boot ID of the appropriate partition table
    takes values 42h. This happens in the course of standard disk partitioning, there
    is simply no free space in its end and the operating system has to save this information
    directly in the disk being updated (naturally, there must be at 1 MB of free space
    available on that disk).


    Directly after the partition table, at the 0/0/2 address, the private header —
    PRIVHEAD, containing the references to the main LDM structures (Fig. 5.8). If
    PRIVHEAD is damaged, Windows will be unable to detect and mount dynamic disks.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery 115


    Unfortunately, it is damaged all too often. The overwhelming majority of boot
    viruses and disk managers consider sector 0/0/2 free and use it for storing bodies,
    irreversibly overwriting the original contents. Being aware of the importance
    of PRIVHEAD, Microsoft''s developers have saved two copies of it, the first of
    which is stored in the LDM tail and the second in the last sector of the physical
    disk. Because of this redundancy, you''ll practically never need to recover PRIVHEAD
    manually. However, if this disaster happens, view the Linux-NTFS project for more
    details about its structure (http://www.linux-ntfs.org/). This description won''t
    be provided here because of the limited volume of this book.


    The internal structure of the LDM database is undocumented, and even the first
    glance at it shows that is powerful and sophisticated (Fig. 5.9). On the top of
    this hierarchy is the database table of contents — consists of two sections —
    config and log (in the future, this will probably be extended). The config section
    contains information about the current partitioning of dynamic disks and about
    existing volumes. The log section, as implied by its name, stores the transaction
    log that registers the changes of the partitioning method. This is a powerful
    tool! If you delete one or more dynamic volumes, log, and the lost volumes can
    be easily recovered. Being an important data structure, TOCBLOCK is protected
    against accidental damage by three backup copies, one of which is directly adjacent
    to the original TOCBLOCK located in the beginning of the LDM base; the two other
    copies are placed in the end of the disk, between PRIVHEAD backup copies.


    The internal structure of the config section includes the header VMDB and one
    or more VBLK structures — special 128-byte data structures, each of which describes
    the corresponding volume, container, partition, and disk or group of disks. The
    VMDB header is not duplicated anywhere; however, all changes introduced into its
    structures are registered in the log (KLOG) and therefore can be recovered when
    necessary.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_128_0.png)'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'The structure of VMDB and VBLK are documented in “LDM Documentation,” which
    can be found on the site of the Linux-NTFS project (http://linux-ntfs.sourceforge.net/ldm/).
    Therefore, there is no need to describe it here; the document is bulky, and it
    is extremely unlikely that you will need to recover the config section manually.


    For viewing LDM and archiving its contents, it is possible to use the LDM-dump
    utility by Mark Russinovich, the freeware copy of which is available at his site
    (http://www.sysinternals.com/files/ldmdump.zip). As a variant, you can backup
    the last megabyte of the physical disk, along with the last megabyte of all partitions,
    which Boot ID is equal to 42h. Any suitable disk editor can be used for this purpose
    (for example, Sector Inspector), and you can save this information on reliable
    media (Zip diskette or CD-R/RW). Also, do not create a backup copy of the TOCDBLOCK
    structure.


    When recovering deleted dynamic disks, bear in mind that, first, the transaction
    log is not available at the interface level. Therefore, it is impossible to roll
    back the transaction using standard, built-in operating system tools. Second,
    the boot sector of the disks being removed is automatically cleared; therefore,
    you’ll have to recover it manually. This topic will be covered in this chapter.


    If you know the size and type of the removed dynamic disk (on NTFS disks *) it
    can be retrieved from the copy of the boot sector), simply start Disk Manager
    and recreate the disk, answer “no” when the system prompts you to format the partition,
    and recover the cleared boot sector using the technique that will describe later
    in this chapter.


    As you can see, Microsoft took care of its users and tackled the task of designing
    dynamic disks with a clear mind, which isn’t typical.


    # Boot Sector Basics


    The first sector of a logical disk is called a boot sector. It contains the bootstrap
    code and the most important information about disk geometry, without which the
    partition will not be mounted. The structure of the boot sector depends on the
    architectural features of the specific file system. The NTFS boot sector structure
    is outlined in Table 5.7.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery 117


    Table 5.7. Structure of NTFS boot sector


    | Offset | Size | Description |

    | 0x00 | 3 bytes | Jump instruction |

    | 0x03 | 8 bytes | OEM ID |

    | 0x0B | 25 bytes | BPB |

    | 0x24 | 48 bytes | Extended BPB |

    | 0x54 | 426 bytes | Bootstrap code |

    | 0x01FE | WORD | 55 AA |


    In the beginning of every boot sector is a 3-byte machine command that jumps to
    the bootstrap code (usually, EB 52 90, although other variants are possible).
    This happens when the boot sector is loaded into the memory, control is passed
    to its first byte and the bootstrap code, for some shadowy historical considerations,
    is moved to the end of the sector (for NTFS, the upper boundary is 54h); therefore,
    the jump instruction is necessary.


    Bytes 3 to 11 (counting from zero) store the original equipment manufacturer''s
    identifier (OEM ID), defining the type and version of the file system being used
    (for example, MSDOS.5 for FAT16, MSWIN4.1 for FAT32, NTFS for NTFS). If this field
    proves to be damaged, the driver will be unable to mount the disk and even consider
    it unformatted.


    Windows 2000 will work with FAT disks even if the OEM ID field contains an invalid
    value. For NTFS, however, this is not true.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_130_0.png)


    Directly after the OEM ID field is the 25-byte BIOS parameter block (BPB), which
    stores information about the disk geometry (number of cylinders, heads and sectors;
    sector size; number of sectors per cluster; and so on). If this information is
    lost or damaged, normal existence of the file system becomes impossible. In contrast
    to the number of CHS, which duplicates information contained in the MBR and in
    case of loss can be easily recovered using the previously-described method, the
    cluster size is not easy to determine. Later in this chapter, I will cover this
    topic in more detail. For the moment, it is sufficient to use Table 5.8, which
    lists the default NTFS cluster size chosen by the built-in formatting utility.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Table 5.8. Cluster sizes chosen by Windows 2000 by default


    | Disk size | Cluster size |

    |---|--|

    | < 512 MB | 1 sector |

    | < 1 GB | 2 sectors |

    | < 2 GB | 4 sectors |

    | > 2 GB | 8 sectors |


    When choosing the cluster size manually, Windows 2000 supports the following options:
    1 sector, 2 sectors, 4 sectors, 8 sectors, 16 sectors, 32 sectors, 64 sectors,
    and 128 sectors. The larger the cluster size, the lower the fragmentation and
    the higher the maximum addressable disk size. However, the granularity losses
    are also increasing. Regardless, the cases, in which cluster size is specified
    manually, are rare.


    Directly after the BIOS parameter block is its continuation — the extended BPB,
    which stores the number of the first MFT cluster, the MFT size in clusters, the
    number of cluster with the MFT mirror, and some other information. In contrast
    to FAT16/32, the MFT can be located anywhere on the disk (which is important for
    overcoming bad sectors). Under normal conditions, the MFT is located practically
    in the beginning of the disk (somewhere near the fourth cluster). If it isn''t
    relocated, it can be easily found by a global search (the `FTLE` string by the
    0 offset from the start sector). If the extended BPB has been destroyed or contains
    incorrect values, the file system driver refuses to mount the partition and reports
    that it is not formatted.


    The extended BPB is directly followed by the bootstrap code, which looks for the
    operating system loader on the disk (for Windows NT-based operating systems, this
    is the ntldr file). Having locating the operating system loader, bootstrap code
    loads it into the memory and passes control to it. If the bootstrap code is missing,
    it becomes impossible to boot the operating system; however, if you connect the
    second disk, the partition will be visible. Corruption of the bootstrap code causes
    either reboot or hang-up of the system.


    Finally, the boot is terminated by the 55h AAh signature, without which the sector
    won''t be interpreted as a boot sector. Detailed information about the fields
    of the NTFS boot sector is provided in Table 5.9.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Table 5.9. Fields of the NTFS boot sector


    | Offset | Size | Description |

    |---|---|---|

    | 0x00 | 3 bytes | Jump instruction |

    | 0x03 | 8 bytes | OEM ID |

    | 0x0B | WORD | Bytes per sector; for hard disks, always 512 |

    | 0x0D | BYTE | Sectors per cluster |

    | 0x0E | WORD | Number of reserved sectors; apparently, always equal to 0 |

    | 0x10 | 3 bytes | Not used by NTFS and must always be equal to 0 |

    | 0x13 | WORD | Not used by NTFS and must always be equal to 0 |

    | 0x15 | BYTE | Media descriptor; for hard disks, always equal to 0xF8 |

    | 0x16 | WORD | Not used by NTFS and must always be equal to 0 |

    | 0x18 | WORD | Number of sectors per track |

    | 0x1A | WORD | Number of heads |

    | 0x1C | DWORD | Number of hidden sectors |

    | 0x20 | DWORD | Not used by NTFS and must always be equal to 0 |

    | 0x24 | DWORD | Not used by NTFS and must always be equal to 0 |

    | 0x28 | 8 bytes | Total number of sectors (total sector) |

    | 0x30 | 8 bytes | Logical number of the cluster, from which the MFT starts |

    | 0x38 | 8 bytes | Logical number of the cluster, from which the MFT mirror starts
    |

    | 0x40 | DWORD | Number of clusters per segment (file record segment) |

    | 0x44 | DWORD | Number of clusters per index block |

    | 0x48 | 8 bytes | Volume serial number |

    | 0x50 | DWORD | Checksum; do not compute if 0 |

    | 0x54 | 426 bytes | Bootstrap code |

    | 0x01FE | WORD | 55 AA |'
