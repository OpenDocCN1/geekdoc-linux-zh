- pgno: 68
  md: '# # Chapter 3: How to Choose Hard Disks


    ![](img/1ce3cead9a6814cc94d1e00101c20220_68_0.png)


    You entrust hard disks the most valuable item you have — your data. My friends
    and colleagues often ask me, which manufacturer to choose. Which model would be
    the best choice? The disk reliability is the most important criterion, other factors
    do not matter much (except, perhaps, for noise). The disk must not die without
    warning. Slow decay, accompanied by strange sounds and accelerated growth of the
    number of bad sectors, does not count, because under these circumstances it is
    immediately clear to everyone that it is necessary to replace the disk. However,
    I often try to solve the problem of disk reliability in vain. Hard disks have
    no reliability. Instead, they have a warranty certificate. That''s all. You should
    not base your considerations on the hundreds of hours specified in documentation
    as mean before failure (MTBF), because the manufacturer doesn''t take responsibility
    for the correctness of this value.


    In reality, there are no good and poor manufacturers. Every brand has unfortunate
    models. Regardless of manufacturer, in every 1000-disk lot there are from one
    to ten disks that crash long before the expiration of the warranty term, even
    if the disk is positioned as a high-end server model. The life cycle of individual
    disks depends on probability — some specimens survive and endure, and die.


    It would be more correct to speak about poor models prone to crashes. For example,
    the notorious Fujitsu MPG series, in which the Cirrus Logic chip with the'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'modified substrate was used, generated parasitic leaks with time. Practically
    all disks of this series died within 2 years. As another example, consider IBM
    DTLA with its infamous design of the hermetic block, which periodically caused
    a lack of contact that resulted in premature termination of write operations.
    Part of the sector was written, and another part wasn''t. As a result, the disk
    developed virtual bad sectors (no physical defects, but the checksums didn''t
    match). Virtual bad sectors are readable; however, they cannot be recovered, because
    the data hasn''t been written completely. I had three such disks. The first one
    died within 2 months; I repaired and discarded it as unreliable. My other two
    disks of the same model are still operating successfully. Nevertheless, it is
    impossible to count how many disks of my friends and colleagues crashed. The life
    or death of each disk depends on blind probability. Lots of factors also influence
    the disk''s fate, such as the quality of the power block and the presence or lack
    of vibrations.


    It is difficult to collect disk failure statistics. The absolute number of failures
    in it itself isn''t useful. It is necessary to take into account the popularity
    of a specific model and the operating conditions. SCSI disks are more reliable
    than IDE disks only because they are installed on servers and are practically
    never powered off. Lots of malfunctions take place when the disk is powered on
    or off. Furthermore, SCSI disks are practically never overheated or used as a
    portable device.


    The Moscow Derstein Data Recovery Center, which is involved in data recovery,
    provides interesting statistical information about officially registered disk
    failures. Tables 3.1 and 3.2 provide an excerpt of this information.


