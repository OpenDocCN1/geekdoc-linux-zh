- pgno: 280
  md: '# Chapter 10: Recovering CDs 267


    even after multiple attempts will be skipped. Now, copy the “reanimator” CCD file
    to the recover.ccd file and return the starting address of the first track to
    its initial position. Write the newly-formed disc image to the new disc. If everything
    has been done correctly, any drive will read it without any problems. The test
    session of animation has been successfully completed. Now, having acquired the
    necessary experience, you can embark on more serious tasks — for instance, start
    your own small business dealing with the recovery of accidentally cleared CDs.
    Just kidding.


    What should you do if the cleared disc was a multisession disc? After all, the
    preceding techniques were intended for working with only one session. Multisession
    discs can also be restored, and this task is only slightly more difficult. To
    achieve this, however, you must first become acquainted with the other fields
    of the TOC.


    But what if something was written to the disc after it was cleared? Recovery possible
    in this case? It depends. Locations erased directly are lost. But the remaining
    information can still be restored. If it was a multisession disc before clearing,
    you won’t need to labor over the recovery of the file system, because the file
    system of each next session usually duplicates that of the previous one (“usually”
    meaning in all cases other than those with erased files). At the same time, the
    last disc session proves to be far from the beginning of the disc. Consequently,
    the risk of erasing it is at a minimum (provided that you worry about this in
    time and don’t remember it suddenly after having rewritten the entire disc). The
    recovery of single-session discs with an erased file system is a more difficult
    task, although it is also possible. First, a typical disc has two types of file
    systems: ISO9660 and Joliet. Unfortunately, because of their close “geographic”
    location, both of them are ruined in the course of erasing the disc. Second, these
    file systems do not support fragmentation, and any file written to CD represents
    a continuous information block. All you need for restoring it is determine its
    entry point and length. The entry point of the file always coincides with the
    starting point of the sector, and the vast majority of file types allow you to
    identify their headers by a unique signature (in particular, characteristic for
    Zip files: 50 4B 03 04). The end of a file cannot be detected so definitely; the
    only clue is the structure of the file. Nevertheless, most applications tolerate
    a collection of assorted garbage at the file trailer, so, in practice, the precision
    of one sector when determining the file length is sufficient. Because files reside
    on the disc sequentially and without gaps, the terminating sector of any file
    can be recognized reliably by decreasing the starting address of the next file
    by one.


