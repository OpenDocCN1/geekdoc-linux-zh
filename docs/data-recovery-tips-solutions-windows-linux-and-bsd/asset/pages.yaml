    # Zip Diskettes


    Zip diskettes are reliable enough. They do not cause any particular troubles,
    and bad sectors on such media are encountered rarely. The cause of such uncommon
    might be electromagnetic fields generated by monitors or system units and surface
    defects (which mainly can be encountered on low-class media such as (Fujifilm).
    As a rule, it is possible to rescue an unreadable disk if you repeat the read
    operation multiple times. Practically any disk doctor utility can handle this
    task. In contrast to “classical” diskettes, where the read/write head scratches
    the magnetic surface,'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Chapter 9: Repairing Various Types of Backup Media 251


    in Zip drives the heads float over the surface, so multiple reads do not negatively
    affect the medium’s health. In other words, in this case multiple reads won''t
    do any harm. The only exception is in drives with a damaged head that scratches
    disks. This case, however, is not considered here. Have you ever seen a warning
    near a passenger elevator, stating that it is prohibited to use it if malfunctions?
    The situation isn''t different for drives.


    By the way, after each series of failed read attempts it is recommended that you
    reposition the heads to the remote sectors and then return them back to the position
    where read attempt has failed. The main idea of this operation is to move the
    heads to make them approach the problematic sector at different angles and hope
    that at position the block will happen to be readable. Standard disk doctors,
    such as Scandisk and ChkDsk, included as part of a standard Windows distribution,
    are unable to do this enough. Norton Disk Doctor (called “disk destroyer”) by
    qualified folks) also isn''t intellectual enough. Thus, the only utility oriented
    toward recovery of damaged Zip diskettes has always been and remains the SpinRate
    utility by Steve Gibson, which can be found and downloaded in the eDonkey. It
    recovers about 90% of unreachable media, or according to some enthusiastic assessments,
    even more.


    The situation becomes considerably more complicated with “killer” diskettes, which
    cannot be inserted into the drive. The same relates to diskettes with a tucked
    up or down edge (Fig. 9.2). How does this defect appear? For instance, imagine
    a careless user moving the protective cover and inserting a finger into the drive
    to extract the diskette, or the diskette impacting the damaged head. Consequently,
    such a killer diskette belongs to ruin all drives, into which it happens to be
    inserted. Fortunately, track zero is is located close to the center; therefore,
    the file system of a ruined diskette isn''t damaged and remains readable.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_264_0.png)


    Fig. 9.2. A killer diskette with tucked edge'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Part III: Backup-Media Data Recovery


    To overcome this problem, you''ll require a medical scalpel or a razor to open
    the diskette without damaging the cover and/or magnetic surface. This task isn''t
    too difficult. After arming yourself with demagnetized scissors, you will cut
    off the tucked edge so that there are no ragged edges (demagnetize the scissors,
    just rotate the impedance coil connected to the power supply, or if you have no
    impedance coil, just contact any radio amateur to help you). After that, reassemble
    the diskette. Do not try to insert it into the drive! The construction of a Zip
    drive is such that the heads, having been moved from the parking zone, expect
    to “see” the magnetic zone below. If there is no magnetic zone where it was expected,
    the drive will die, along with the diskette. To avoid this, it is necessary to
    insert some item, such as a pen, between the “arms,” and remove it after the heads
    reach the disk surface. In addition, it is not recommended that you read the last
    sectors of the diskette; otherwise, the heads will enter the “cut off” zone and
    die, causing additional damage to the diskette.


    It is necessary to emphasize that the risk of severely damaging the drive is high
    when carrying out these manipulations. You''ll have to disassemble the drive,
    thus making the warranty void. However, there is no other way to solve the problem.


    # Magnetic Tapes


    Cartridges for streamers are long-enduring and extremely reliable. As a rule,
    no problems are encountered when dealing with them; however, tapes might torn
    occasionally. The causes for such events might be both low-quality streamers and
    human errors. Curiously, individuals try to tinker with magnetic tapes with knives
    or pencils.


    There is some good news regarding this problem. The torn tape can be glued using
    any universal glue. I prefer the Polish Supercement (which is rarely available).
    However, Super Glue, which is now sold practically everywhere, is also quite good.
    In contrast to general opinion, there are no data losses in this case. Streamers
    use an error-correction code (a kind of cyclic Reed-Solomon code) and easily tolerate
    long sections of the tape being cut off (up to 5 cm, although individual values
    vary from model to model).


    Also, it is possible to encounter cartridge jamming. Owners of tape recorders
    know what this means. How is it possible to overcome this problem? Slightly unscrew
    the mounting bolts (most cartridges are dismountable) to allow the tape to easily
    rewind, and rewind it several times back and forth. This operation must'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Chapter 9: Repairing Various Types of Backup Media 253


    be done manually. You are not recommended to rely on the streamer when doing this.
    Then tighten the bolts, the cartridge will become functional again.


    Under certain circumstances, faulty streamers might crumple the tape, which causes
    a more serious problem. The crumpled tape doesn'' adjoin the magnetic head. This
    causes lots of read errors, which cannot be corrected by error-correction codes.
    Would it be done to recover the data in this case? Fortunately, in contrast to
    a tape recorder, where the write operations are carried out perpendicular to the
    direction of tape movement, in streamers the read/write head is inclined toward
    the tape. This reduces the influence of local defects. Thus, to read a crumpled
    tape, in most cases it is enough to clamp it more tightly to the head. To achieve
    this, it is possible to use a small piece of foam-rubber or any other similar
    material. Multiple attempts at reading the damaged fragments produce fairly good
    results, and a considerable part of the information still can be returned from
    nonexistent.


    Some individuals try to smooth the tape manually, using fingernails or other “instruments.”
    I strongly recommend that you do not do this! With such action, the tape is stretched;
    therefore, the time required to read it increases, and the streamer is designed
    for a strictly defined speed of reading. The change of the signal frequency creates
    an additional workload for error-correction codes. It should be pointed out, however,
    most users of streamers never encounter such problems.


    # Flash Memory


    The term flash memory designates an entire range of devices that have mini drives
    on one edge, which represent miniature hard disks. Each type of device requires
    an individual approach, and the principles of their recovery are different.


    In this section, I will cover flash drives made of a reprogramable, nonvolatile
    RAM chip and a USB controller (which is typically encountered). The memory chip
    is reliable, and its failure is a rare event. The USB controller, however, can
    be easily damaged by static electricity and is quite vulnerable. If the memory
    is not integrated with the USB controller, it can be easily unsoldered and replaced.
    To do so, it is enough to purchase another flash drive of the same or similar
    model. To successfully carry out this task, you must have soldering skills; otherwise,
    the data will be ruined without any hope of recovery. Contemporary chips are extremely
    sensitive to overheating, so if you are not careful enough, they will be irreversibly
    damaged.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Nevertheless, hardware malfunctions of flash cards are rare. Logical destruction
    such as erroneously deleted files or driver malfunctions is encountered more often.
    Such errors are a serious problem. For example, they caused the Mars Rover to
    crash (http://www.esolpartners.com/shared/pdf/Spirit_Rover_8.23.04.pdf). Vast
    amounts of data can be lost for this reason, too. Part of the memory is reserved
    for system purposes; however, access to it is not blocked. Therefore, this area
    can be read and written programmatically. If the driver accidentally or intentionally
    overwrites this area, access to the flash card usually becomes impossible. The
    card cannot even be formatted, to speak nothing about reading the data. Several
    years ago, when flash cards were expensive, this was a true disaster. Nevertheless,
    it is always possible to find a device that ignored the auxiliary area and worked
    with the card. This means that low-level access to flash memory still works. Because
    of this, it is possible to read all data and decode them on your own.


    There are lots of utilities specializing in the recovery of flash cards. I prefer
    the PhotoRescue utility (http://www.photorescue.net/) developed by the creators
    of the legendary IDA Pro disassembler. Although it is positioned as a tool for
    recovering digital photos, it is equally successful when recovering other types
    of data. This is a commercial product that costs $30 or even $40 (for the expert
    edition); however, the evaluation version can be downloaded for free.


    To avoid the tedious procedure of data recovery, always duplicate all critically
    important data so that if one medium fails you have another one available. Believe
    me, the time spent creating a backup copy is incomparable to the time and money
    required to recover lost data.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Chapter 10: Recovering CDs


    ![](img/1ce3cead9a6814cc94d1e00101c20220_268_0.png)


    CD-R and CD-RW media are ideal backup media for saving moderate amounts of information
    (and all serious programmers periodically back up the information entrusted to
    them). Unfortunately, no one is perfect, and no job can be completed without some
    danger of errors (errare humanum est: is human). Therefore, the accidental deletion
    of files from CD-Rs and CD-RWs, as well as the clearing of these discs, sometimes
    happens. Experience suggests that this happens far too often.


    To my knowledge, special utilities for restoring lost information from CDs have
    yet to be widely available on the market; therefore, recovering information from
    corrupted CDs is something you will have to tackle on your own. In this chapter,
    I''ll explain what can be done and how to accomplish it.


    # Restoring Deleted Files from CD-Rs and CD-RWs


    Having announced support for multisession CDs, Microsoft has maintained its silence
    about how this support is only partial for its operating systems, including Windows
    9x and all versions of Windows NT (up to Windows 2000). Each session is a standalone
    volume (a logical disc, in Windows terminology), which has its own file system
    and its own files. Because of the pass-through numbering of CD sectors,'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'the file system of one session can reference files physically located in any
    other session. To ensure the possibility of working with the disc the same way
    as a unified volume, the file system of the last session must include the contents
    of the file systems of all previous sessions. If this condition isn''t met, then
    the tables of contents (TOCs) of all other sessions will be lost when viewing
    the disc using standard equipment. This is the case because Windows mounts only
    the last session of the disc and ignores all others. Programs for burning CD-Rs
    and CD-RWs, by default, add the contents of the file systems from the previous
    sessions to the current one. However, this doesn''t necessarily mean that the
    last session always contains everything present in the previous sessions.


    For example, look at how files are deleted from CD-Rs or CD-RWs. No, this isn''t
    a misprint (or an error or joke). The contents of CD-Rs can, in principle, can
    be deleted, despite the impossibility of rewriting them. To imitate deletion,
    CD burners simply do not include a reference to the file that has "deleted" in
    the file system of the last session. (Not all programs are capable of doing so.
    For example, Roxy Easy CD Creator provides this possibility, while Stomp RecordNow
    doesn''t.) The "deleted" file is still present on the disc. It is physically present
    because it takes up some space. Still, this file won''t be displayed in the directory
    when viewing the disc contents using Windows'' built-in tools. What is the meaning
    of "deleting" files from the CD-R if the available disc space isn''t increased
    but *reduced*? The sense of this operation (if I can use the term "sense") lies
    in hiding the "deleting" files from normal users. Deleted files aren''t visible
    when viewing the disc contents using standard tools, they are formally unavailable
    to the normal user. As a result, they are not available with Windows'' built-in
    tools. On the other hand, Macintosh allows users to mount any disc session as
    a separate volume; therefore, all "deleted" files immediately recover themselves
    when viewing missolution discs under Mac OS.


    The situation is similar when deleting information from CD-RWs. Despite the theoretical
    possibility of physically destroying their contents, programs for writing discs
    support only a function for clearing the entire disc and are unable to delete
    individual files. Thus, all that was said previously about CD-Rs is applicable
    to CD-RWs.


    Therefore, if you write information to a disc to pass it to a third party, never
    use discs that have contained confidential data. The deletion of data previously
    written to a disc doesn''t mean complete removal.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Chapter 10: Recovering CDs 257


    When viewing the contents of a CD that you have received from a friend or colleague,
    or even just recovered from the garbage, it makes sense to try viewing previous
    sessions. Sometimes, it is possible to find a lot of hidden information. On the
    other hand, you might need to restore incidentally deleted files from your own
    disc or recover an entire session that has been destroyed by accident. (Some programs
    for writing CDs allow users to choose: they can either add the previous session
    when creating a new session or include only new files in the new session. Choosing
    incorrect settings when preparing to write a CD will result in loss of the contents
    of all previous sessions. Fortunately, this loss is reversible.)


    To recover deleted files, it is possible to use any program capable of retrieving
    the contents of the chosen disc session and writing it into an ISO image. For
    distinctness, let this be Roxio Easy CD Creator. Insert the disc to be recovered
    into the drive and choose the CD Information command from the CD menu. After a
    short time, the dialog in Fig. 10.1 will appear.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_270_0.png)


    Fig. 10.1. Analysis of the disc contents when recovering the deleted files'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'As you can see, this dialog displays the list of all sessions existing on the
    disc, along with the number, starting address (in sectors), and length (in megabytes).
    Now, try to determine whether or not are there hidden files on the disc. Using
    the dir command, display the contents of the entire disc. The output of the dir
    command might appear, for example, as shown in Listing 10.1. Then memorize (or
    write down) the total size of the files visible to the operating system.


    # Listing 10.1. Displaying the disc directory


    ```

