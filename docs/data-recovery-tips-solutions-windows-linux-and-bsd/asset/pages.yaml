- pgno: 241
  md: "File names are stored in directories (Fig. 8.12). There are no file names in\
    \ inodes. UFS views directories as files of a specific type, which can be stored\
    \ in any location belonging to the cylinder group. UFS supports several types\
    \ of directory hashing; however, this has no effect on the storage structure.\
    \ Names are stored in blocks called DIRBLKSZ in structures of the direct structure\
    \ aligned by the 4-byte boundary.\n\nThe direct structure is defined in the /src/ufs/ufs/dir.h\
    \ file (see Listing 8.11). It contains the following information: the number of\
    \ the inode describing the given file, its type, name, and the length of the direct\
    \ structure used for finding the next direct structure in the block.\n\nListing\
    \ 8.11. The direct structure responsible for storing file names and directories\n\
    \n```\nstruct direct (\n    /* 0x00 */ u int32_t dino;           /* Inode number\
    \ of entry */\n    /* 0x04 */ u int16_t dclen;         /* Length of this record\
    \ */\n    /* 0x06 */ u int8_t dtype;          /* File type; see below */\n   \
    \ /* 0x07 */ u int8_t damlen;         /* Length of the string in d_name */\n \
    \   /* 0x08 */ char d_name[MAXNAMLEN + 1]; /* Name with length <= MAXNAMLEN */\n\
    );\n```\n\nAt this stage, the description of UFS can be considered complete. The\
    \ information provided here is enough to proceed with manual data recovery.\n\n\
    # On the Remains of the Empire\n\nWhen a file is being deleted, the following\
    \ events take place on the UFS partition (these events are listed in the order,\
    \ in which appropriate structures follow each other within the partition; this\
    \ order may not match the order, in which the events take place):\n\n+   * The\
    \ fs_time superblock (the time of last access to the partition) is modified."
