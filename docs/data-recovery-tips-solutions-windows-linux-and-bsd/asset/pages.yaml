    # Working Regulations


    When you install a new CD-RW into the drive, the UDF monitor automatically detects
    it and prompts you to format the disc. CD-Rs usually are ignored, so users have
    to format it manually. Depending on the specific features of the driver snap-in,
    formatting is carried out either through the standard context menu of Windows
    Explorer (**Properties | Format**) or using the interface of the CD burner.


    Depending on the speed and on the specific features of the drive, formatting can
    take 20 minutes or even an entire hour. With Mount Rainier, formatting is carried
    out in the background mode, and the possibility of writing files is available
    only several seconds after the start of the formatting operation. The effective
    capacity of the formatted disc is about 550 MB. The remaining space is occupied
    by auxiliary data; so do not worry if you discover their presence on the disc.
    The packet structure is schematically shown in Fig. 10.10. As you can see, auxiliary
    information (run-in, run-out, pre-gap, post-gap, and so on) occupy a considerable
    amount of available disc space. In certain cases, this overhead is excessively
    high. Just try to copy a full-length movie in the packet mode.


    Using the mouse of FAR Manager, try to move several files to the CD-R or CD-RW.
    The files will be copied, and available disc space will decrease stepwise by a
    value that considerably exceeds the total size of the files being copied. This
    excessive overhead is the price of the convenience of the packet writing technology.


