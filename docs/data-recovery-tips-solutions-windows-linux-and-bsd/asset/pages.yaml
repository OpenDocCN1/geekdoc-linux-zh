  md: '# 302 Part III: Backup-Media Data Recovery


    and there is no need to wait until the entire track is grabbed before the file
    playback. Because Windows and UNIX are multitasking operating systems, track grabbing
    and file playback can be executed in parallel.


    As a variant, it is possible to record discs in the Video CD format. To achieve
    this goal, you''ll need a CD-recording program that isn''t too exacting about
    the requirements of the standard. The program must obediently record data of all
    kinds. If the format of the files that you are going too exacting is different
    from MPEG-1 or MPEG-2, serious problems will arise when attempting to burn them
    on a CD because Windows forcibly supplies them with the MPEG-1 header. The enforced
    header confuses the standard media player, which might even cause the system to
    freeze. There are at least two ways out from this situation. The simplest approach
    is to install a special DirectShow filter in the system that supports RIFF/CDXA
    parsing. An example of such a filter is XCD DirectShow filter (NSIS installer)
    by Alex No and DeXT. This filter can be downloaded from http://es.geocities.com/deststuff/mode2cdmaker.
    Another approach is to use software that tolerates the "extra" header and simply
    ignores it. An example of such software is the Freebeam CD/MP3 Player, found at
    http://www.vnunet.com/Print/1129594.


    # Session of Practical Magic in Mode 2


    Among the programs supporting disc recording in mode 2, there is an indisputable
    leader — the CDRW utility, popular among professionals. The capabilities of this
    powerful instrument are mainly limited by your imagination. The newest version
    of this program can be downloaded from http://www.goldenhawk.com/download_body.htm,
    among other sites. In addition, you''ll need the console version of this program,
    which is available for downloading from http://www.goldenhawk.com site.


    The process of CD burning starts with preparation of the source file. The only
    requirement for the file is the alignment of its length to an integer number of
    sectors. Assume the file length is 777,990,272 bytes. To fit within an integer
    number of 2,336-byte sectors, it is necessary to cut 1,824 bytes from the end
    of the file or pad the file with 512 zeros. Audio and video files painfully tolerate
    truncation of the file body and padding of the tail with garbage. Both operations
    can be carried out using any hex editor, such as HIEW (http://www.softedia.com/get/Programming/Hiew.html).
    File truncation is trivial. Open the file, start the standard Windows calculator,
    switch to the Scientific mode, with'
