  md: '# 292 Part III: Backup-Media Data Recovery


    # Volume space


    ![](img/1ce3cead9a6814cc94d1e00101c20220_305_0.png)


    Fig. 10.11. The virtual allocation table, the key element of the UDF, freely migrates
    over the entire disc, preventing multiple overwriting of the same sectors


    In addition, sectors storing the file system operate in an extremely intense mode
    of packet writing. They are overwritten during every copying or deletion operation.
    To avoid multiple overwriting of the same sectors, special measures have been
    taken. For example, the virtual allocation table (VAT), one of the key elements
    of UDF that allows you to write incrementally, freely migrates over the entire
    disc, preventing multiple overwriting of the same sectors (Fig. 10.11). However,
    no matter what efforts are undertaken to overcome this drawback, auxiliary structures
    are the first to die, sometimes even after 100 overwrite loops. The disc becomes
    un, and unskilled users would never be able to recover it.


    It is necessary to remind you about mechanical damage. UDF discs are over-scrupulous
    about this. The greatly praised and promoted defects control mechanism doesn''t
    work in this case, because it doesn''t elimates errors but only prevents damaged
    sectors from being used.


    Therefore, you should never copy valuable files that you''d be sorry to lose in
    the packet mode. If you do, it is strongly recommended that you create several
