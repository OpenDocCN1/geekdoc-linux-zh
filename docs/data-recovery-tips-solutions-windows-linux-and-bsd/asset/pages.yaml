    # Enumerating Streams


    How is it possible to determine, which streams could be inside a file? Built-in
    Windows tools provide no such capability. Functions for working with streams are
    undocumented and are available only through native APIs. These are NtCreateFile,
    NtQueryAFile, and NtSetEFile, descriptions of which can be found, in particular,
    in "Undocumented Functions for Microsoft Windows NT/2000" by Tomasz Nowak. The
    electronic version of this article can be downloaded for free from http://documented.internals.net/title.html.
    It is also advisable to read the "Win2k.Stream" article from issue 5 of the 29
    virus machine. Articles on this topic are also available in other e-zines.


    New streams are created by calling the NtCreateFile function, which, with other
    arguments, accepts the pointer to the FILE_FULL_INFORMATION structure passed using
    EBuffer. As a variant, it is possible to use the NtSetFile function by passing
    to the descriptor returned by NtCreateFile when opening the file in a normal way.
    The NtQueryAFile function evaluates and reads all entries streams. The prototypes
    of all functions and the definitions of all structures are in the ntddk.h file,
