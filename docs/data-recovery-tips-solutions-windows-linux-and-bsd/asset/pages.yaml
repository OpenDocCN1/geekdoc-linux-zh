  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    The -a command-line option sets the number of read-ahead sectors that will automatically
    read by the controller in hopes that they will be needed by the user. By default,
    the kernel reads eight sectors (4 KB). In the course of sequential reading of
    large files with a low fragmentation level, this value is recommended to be-increased
    several times. On the contrary, in the case of random access and working with
    small, highly-fragmented files, it is recommended that you decrease this value
    to one or two sectors. The -P option activates the hardware prefetching mechanism,
    informing the controller about the number of sectors to read. Roughly speaking,
    this option is the same as -a but has more powerful capabilities. At the same
    time, bear in mind that not all drives support hardware prefetching.


    The -m option specifies the number of sectors processed by the drive per change
    operation (the-called multiple sector input/output or block mode). Depending on
    the hard disk design features, it can process from 2 to 64 (sometimes even more)
    sectors per operation. To discover the specific value of this parameter, use the
    -i command-line option (it is specified in the MaxMult Sect field). In general,
    the data processing speed is directly proportional to the number of sectors; however,
    some drives (such as Western Digital Caviar) slow considerably at large -m values.
    To evaluate the real situation, use the -t command-line option, which measures
    the disk subsystem throughput in the read mode.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_249_0.png)


    Excessively large values of -m may result in data corruption, so do not risk these
    without actual necessity.


    IMPORTANT


    The -m option is responsible for the drive noise parameters (acoustic management,
    AAM for short). The value of 128 corresponds to the slowest mode, and 254 corresponds
    to the fastest one. Intermediate values are generally undefined (some drives support
    them, but some don''t). It is necessary to point out that the value 128, in addition
    to noise reduction, reduces drive wear. However, the performance drop might be
    significant, so it is difficult to produce an exact recommendation in this respect.


    The -c command-line option controls the data transmission mode. The zero stands
    for 16-bit transmission, one sets 32-bit transmission, and three establishes 32-bit
    transmission mode with special synchronizing signal. By default, the kernel uses
    the three value (possibly, not kernels), because it is the most reliable mode
    (although it is slower than the mode set by one). Most contemporary'
