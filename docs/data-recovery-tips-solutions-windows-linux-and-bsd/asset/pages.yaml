    # Useful Tip


    If, despite all efforts, you still fail to recover the deleted file, try to find
    its backup copy. Most applications create such copies; however, they do not make
    a show of their presence. Also, do not forget the swap file, temporary files,
    memory dump, and other sources that store more fragments of the file being recovered
    (or even the entire file, if you are lucky). Even if they have been deleted, the
    file record according to them may not have been overwritten yet, in which case
    the recovery won''t take long.


    # Unformatting the Disk in NTFS


    Assume the worst has happened: You have lost the entire NTFS partition because
    of accidental formatting or devastating disk failure. Billions of bytes making
    up your data are no longer available to the operating system. Is it possible to
    return this information to life? Until this moment, I considered only disk faults
    and data corruption, which as erroneously deleted files. Now, it is time to consider
    serious damage, which makes the original content unavailable to the operating
    system. The reasons this happen are different: unintentional formatting, a damaged
    MFT, and so on. However, do not despair! NTFS is capable of surviving any disaster
    with minimal losses because of its legendary reliability. In all these cases,
    it is possible to recover the data completely, provided that you have the required
    knowledge and skills.


    To study data recovery, start with formatting. To carry out all experiments described
    here you''ll need the format.com utility, which is an integral part of Windows
    NT/2000/XP, and some disk partition that doesn''t contain anything useful. Also,
    it would be advisable to install some PC emulator, such as Virtual PC or VMware,
    that emulates the hard disk and speeds up the formatting procedure several hundred
    times (Fig. 7.5). Bear in mind that time is precious, and hours that you spend
    peering at the progress indicator are simply wasted.'
