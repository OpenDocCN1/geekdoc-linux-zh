  md: '# Chapter 8: Data Recovery under Linux/BSD 203


    Consider the contents of the first diskette, which is a boot one because NTFS
    for MS-DOS operates only from a “black screen”; however, system files are not
    provided here to make the example more illustrative. The first diskette contains
    only one executable file, called nftspro.exe, which is the query translator linked
    to the protected mode extension — the WDOSX 0.96 DOS extender by Michael Tippach.


    NTFS is a native ntfs.sys driver taken from the Windows system directory and for
    space economy packed with the gzip archiver. To unpack it, you’ll require either
    Linux or pkzip for Windows or MS-DOS. Comparing it to the original driver, you
    won’t find any changes. Ntoskrnl.exe is the system kernel extracted and packed
    the same way. It also doesn''t contain any changes.


    The second diskette contains the ntdll.gz file (you shouldn''t have any problems
    guessing where it came from) and another file called ntfschck.exe. The latter
    is a completely rewritten variant of the built-in chkdsk utility, because to make
    the console application work under MS-DOS, it would be necessary to emulate all
    of other functions, which Mark Russovich didn''t plan. By then, there exists another
    extender created by the legendary Yuri Haron. This extender is capable of running
    Windows applications under naked DOS, without any access to Windows. Everything
    necessary for this can fit within a single diskette. This extender is available
    from http://www.doswin32.com:8080/index_en.html, and for noncommercial use it
    is freeway.


    In addition, the diskettes contain other files, such as c_866.gz, autoch.gz, c_437.gz,
    c_1252.gz, and l_intl.gz, that hold code pages and other service information,
    without which, in principle, it is possible to do.


    Thus, the foundation of the NTFS for MS-DOS project is formed by three files:
    ntoskrnl.exe, ntdll.dll, and ntfss.sys, which are placed into a shell of kind
    — the ntfspro.exe file, which switches the processor to the protected mode and
    translates MS-DOS queries into the “language” understandable by ntfss.sys and
    vice versa. As you can see this,


    Linux/BSD and pure MS-DOS are different matters. The kernel controls interrupts
