    company would answer with immutable refusal, referring to the improper conditions
    under which you stored the product. Does your storage have climate control? What
    is the precision of the temperature and air humidity control? In my experience,
    as well as that of my friends and colleagues, even Verbatim discs after 18 to
    24 months develop considerable readability degradation because of the decay of
    the active layer. Therefore only the suicidal fool would store their archives
