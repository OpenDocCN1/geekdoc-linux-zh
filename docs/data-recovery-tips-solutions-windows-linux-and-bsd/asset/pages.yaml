    # Secrets of CD Burning


    Do you remember the times of MS-DOS, when there was a driver that allowed you
    to write up to 800 KB of information on a standard diskette 740 KB in size? Do
    you remember 900.com? Nowadays, diskettes have have been moved practically out
    of use, and storage media have long cleared the hurdle of 650 MB. However, old
    ideas produce new offspring.


    The capacity of CD-Rs and CD-RWs declared by their manufacturers is always much
    less than the capacity of the specific medium. It is equal to the amount of information
    that can be written in mode 1. There are other data-recording modes, which differ
    from one another in the amount of data that can be written, and in their reliability.


    If data integrity is not the factor of prime importance, the capacity of CDs can
    be increased considerably, gaining about 15% of additional space at the expense
    of abandoning all of redundant Reed-Solomon codes. The use of subcode channels
    provides an additional capacity of 4%, and it is possible to gain an additional
    2% by abandoning the use of the lead-out area. Finally, there is a useful overflowing
    possibility.


    Thus, if it is possible to write 800 MB to 900 MB of data to a standard 700 MB
    and 900 MB to 1 GB of data to a 90-minute disc. Recall that 1 byte contains 8
    bits. How many bits are there in 700 MB? Do not rush to answer, because this depends
    on the circumstances. For example, a standard CD-R or CD-RW can hold at least
    23 billion bits, or, in other words, about 3 GB of raw information, which is occupied
    by service data structures that ensure disc usability. The method illustrating
    distribution of the available storage space of the CD among different types of
    data is shown in Fig. 10.13. As you can see, only slightly more than the half
    of the total disc space is allocated to user data.


    Excessive redundancy of the adopted encoding system occurs because of the physical
    properties of the laser beam. Physically, a CD is a thin plate of polycarbonate
    plastic with a thin, reflective aluminum (or, in some cases, golden) layer (Fig.
    10.14, a and b). The reflective layer, in turn, is covered by a special protective
    layer. The normal reflective surface of the CD-ROM, called a land, is imprinted
    with microscopic etched depressions, called pits. The pits break up the reflective
    surface so that pits and lands are arranged in a long, continuous spiral track.'
