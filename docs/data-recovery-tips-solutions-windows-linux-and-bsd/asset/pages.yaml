    # NTFS Versions


    NTFS key structures are not invariable. On the contrary, they are modified by
    every new release of Windows NT-based operating systems (see Table 6.1). This
    must be taken into account when using automated disk doctors. If such a doctor
    isn''t equipped with powerful artificial intelligence, it might be confused by
    the structural changes when it encounters a newer NTFS version. The result might
    be deplorable; it is highly probable that the doctor would destroy a healthy volume.


    # Table 6.1. Defining the NTFS version by operating system


    | NTFS version | Operating system | Designation |

    | --- | --- | --- |

    | 1.2 | Windows NT | NT |

    | 3.0 | Windows 2000 | W2K |

    | 3.1 | Windows XP | XP |'
