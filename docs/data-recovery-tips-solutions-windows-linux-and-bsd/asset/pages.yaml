    number specifying the starting cluster of the data run can equal zero, which means
    that no clusters are allocated for this data run. The length field contains the
    number of clusters entirely filled with zeros. These clusters mustnt be read from
    the disk.


    On the contrary, you must create them in memory on your own. By the way, not every
    disk doctor is aware of the existence of sparse attributes (if the attribute is
    sparse, its flag is set to 8000h); consequently, some might interpret the zero
    length of the number field in a strange way. The consequences of such a "correction"
    might be disastrous.


    # Namespaces


    NTFS initially was designed as a system-independent file system capable of working
    with a large variety of subsystems, including Win32, MS-DOS, and the portable
    operating system interface (POSIX). Because every subsystem places its own limitations
    on the character set valid for use in a file name, NTFS must support several independent
    namespaces.


    # POSIX


    With the POSIX subsystem, all Unicode characters (taking into account their case)
    are valid except for NULL, \ (backslash), and : (colon). By the way, the latter
    limitation isn''t set by the POSIX subsystem. It is imposed by NTFS, because the
    file'
