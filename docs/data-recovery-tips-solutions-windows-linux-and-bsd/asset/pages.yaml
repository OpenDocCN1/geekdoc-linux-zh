  md: 'finds a deleted copy of ntoskrnl.exe (or if there are more copies of the file
    on the disk), this method will misfire; therefore, the obtained result must be
    checked using other files.


    The logical number of the first MFT cluster is equal to the first cluster in the
    beginning of which the FILE string was encountered (provided that the MFT was
    not relocated). By default, Windows allocates 12.5% of the partition size for
    the MFT and places its mirror into the middle of the disk. Furthermore, the reference
    to the mirror is present within the MFT itself. If the MFT has been destroyed,
    go to the middle of the disk, then go slightly backward and repeat the global
    search for the FILE string. Make sure that you don''t go beyond the partition
    limits to the next partition. The first match will probably be the mirror.


    The number of clusters per segment is usually equal to F6h, and the number of
    clusters per index block is 01h (at least, I haven''t encountered other values).
    The volume serial number can take any value because it is of no importance.


    To recover the missing or corrupted bootstrap code, start Recovery Console and
    issue the FIXBOOT command.


    # Summary


    As you can see, there is no mystic in data recovery, and recovering most types
    of corruptions doesn''t require expert-level skills. However, if you didn''t quite
    catch some ideas covered in this chapter, re-read it, investigating the file system
    structure with the disk editor. I have been covering quite simple and well-known
    topics. Now, having mastered the basic concepts, you can dig deeper into the NTFS
    interior. The next chapter will concentrate on the recovery of NTFS structures.'
