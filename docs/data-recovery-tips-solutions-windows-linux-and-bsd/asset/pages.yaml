    # RESERVE-6 or Extra Capacity Reserves


    Whether you believe this or not, 800–900 MB per disc is not a limit. In addition
    to the main data channel, in which raw sectors are stored, there are eight subcode
    channels. One of them is used for the optical head positioner, and the remaining
    seven are free. In general, about 64 bytes per sector, or about 20 MB per standard
    700-MB disc, are wasted.


    Unfortunately, it is impossible to store user data directly in subcode channels,
    because operating systems of the Windows family refuse to support this possibility.
    Suitable utilities from third-party developers are not available. However, it
    is possible'
