  md: '# Chapter 11: Repairing CD/DVD Drives under Home Conditions 317


    ruin the optics). If the lens is covered with an oily film, do not try to remove
    it manually. Make a solution of laundry soap, drip it onto the lens, wait 15–20
    minutes, and then bring tissue paper to the lens without touching its surface.
    After that, drip several drops of distilled water onto the lens to cleanse it
    of the soap.


    The main symptoms of CD/DVD drive failure, along with possible causes of trouble,
    are briefly outlined in Table 11.1.


    Table 11.1. Main symptoms and causes of CD/DVD drive failure


    | Symptom | Cause of trouble |

    |---|---||

    | The drive is not recognized by the computer. | The drive doesn''t issue any
    sounds, and no indicator is blinking. | Possible failure of electronic components,
    possible rupture of a track, or a burnt fuse.

    | | The indicator is constantly blinking or steadily burning. | Failure of electronic
    components and possibly failure of the interface unit or chipset; also, check
    the interface connector, integrity of wires, and power supply voltage.

    | The drive is recognized by the computer. | The tray doesn''t move out. | Failure
    of mechanical components, rupture of the connector in the eject button, failure
    of the motor or elements serving it (chipset, for example).

    | The drive doesn''t see the disc. | The disc doesn''t move the tray in, or it
    does, immediately moves it out again. | Failure of mechanical components.

    | | The disc doesn''t spin up, and the carriage do not move. | Failure of a mechanical
    part, motor, or chipset.

    | | The disc spins up to normal speed then stops. | The laser has lost emission.

    | | The disc spins up at a lower speed. | Mechanical components have failed, or
    the settings are out of tune.

    | | The disc spins up to extreme speeds. | The chipset has failed, or the settings
    are out of tune.

    | The drive sees the disc. | The disc is unreadable. The disc is read with many
    errors. | Electronic parts have failed.

    Laser emission has been reduced, optical parts are soldered, settings are out
    of tune, or electronic components have failed.

    | | When the eject button is pressed, the drive ejects the spinning disc. | Electronic
    parts have failed. |'
