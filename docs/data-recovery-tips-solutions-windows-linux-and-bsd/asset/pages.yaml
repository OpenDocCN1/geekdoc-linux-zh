- pgno: 260
  md: '# Chapter 9: Repairing Various Types of Backup Media


    ![](img/1ce3cead9a6814cc94d1e00101c20220_260_0.png)


    The backup copy is the last line of defense against chaos. However, that backup
    copy can also die. There are lots of companies involved in data recovery; however,
    they don''t always succeed in accomplishing their task.


    This chapter provides an overview of the techniques of recovering removable media.


    Who will be troubled by someone else''s grief? If there are such people in our
    cruel world, they certainly are not specialists from service centers. They simply
    do their job — in other words, acquire their money by trying to spend less effort
    for more profit. And things won''t change. That''s the market! If you take everyone
    else''s problems into your heart, you''d soon die from a heart attack.


    Professionals have everything they need for successful recovery: practical experience,
    required equipment, and all other required components. Attempts at “self-healing”
    lead to a deplorable result in nine cases out of ten — namely, in total failure
    and irreversible destruction of data that otherwise were possible to rescue. Nevertheless,
    contacting specialists after a catastrophe isn''t always justified. This is especially
    true when it is necessary to recover confidential information.


    In some cases, it is possible to recover the lost data on your own. This chapter
    mainly covers physical destruction (scratches, surface defects) without considering
    erroneously deleted files or unintentional partition formatting. Those topics
    have been covered already.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Optical Media


    First, consider CD and DVD recovery. These are the most common storage media nowadays.
    Manufacturers declare that these media are characterized by increased survivability.
    This isn''t true; such discs die frequently, often without surviving a single
    season. Employees of the test lab of the Danish magazine PC-Active have carried
    out an interesting investigation. Having selected several brands of discs from
    well-known manufacturers, they studied the decay processes in the active layer
    and obtained shocking results. In the illustration provided in Fig. 9.1, you can
    see a photo of a CD-R, obtained using specialized equipment. The image to the
    left is the disc immediately after burning, and the right image shows the same
    disc 20 months later. White symbolizes ideal sectors, light gray marks sectors
    with minor read errors, and darker shades of gray seriously damaged sectors. Although
    such discs are usually readable (because Reed-Solomon correcting codes do their
    job), this disc will steadily become less readable with time.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_261_0.png)


    Fig. 9.1. Degradation of the active layer of a CD-R increased with time


    To avoid unpleasant surprises, test your CD archive at least once every 6 months.
    Any program would be suitable for this purpose (I prefer the Nero quality test).
    If there is no such program at your disposal, you can approximately evaluate the
    medium quality by the sounds emitted by the drive. The disc is OK if it can be
    read at maximum speed without typical repetitions and slowdowns. If this isn''t
    the case, I recommend that you copy the data to a newer disc.


    What should you do if the need for the backup copy arises after the disc has become
    unbearable? The simplest approach is driving the disc to (if possible) and repeat
    your attempt at reading the data. There are lots of utilities aimed at slowing
    CD drives. Unfortunately, not every CD drive supports programmatic'
