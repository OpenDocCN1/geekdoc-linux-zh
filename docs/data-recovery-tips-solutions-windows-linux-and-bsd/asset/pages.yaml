    # Porting Drivers from Windows and Linux/BSD


    Consider a simple question, which hasn''t been answered yet. It is well known
    that support of NTFS partitions is a serious problem. The drivers capable of writing
    data to NTFS partitions appeared quite recently, only to stand out in their beauty
    and splendor at various conferences and exhibitions. They are hardly suitable
    for real-world operation because their operation isn''t stable and they have limitations.
    For example, compressed files, transactions, and lots of other issues haven''t
    been'
