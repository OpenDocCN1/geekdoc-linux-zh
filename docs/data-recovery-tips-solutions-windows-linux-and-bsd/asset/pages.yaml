    selectively.


    The XFS file system is the only one that allows you to INODE the auxiliary data
    of the file (attributes, order of blocks on the disk); however, if the file can
    not fit entirely within the INODE, the system will store it there. Additional
    disk space is not allocated, which releases the disk read/write head from need
    for extra moves. As a result, the file access time is reduced considerably. File
    systems such as ReiserFS, NTFS, and others proceed in exactly the same way; however,
    they are unable to change the INODE size, and that is a pity. If you plan to work
    with small files, it is desirable to increase the INODE size, because this would
    produce a positive effect on the performance and the disk space. When working
    with large files, it is desirable to reduce the INODE size; otherwise, the losses
    of disk space would be significant. The preferred INODE size is chosen using the
    mkfs.ufs -i size=value command. The minimum INODE size is 512 bytes, and the maximum
    is 2048 bytes.


