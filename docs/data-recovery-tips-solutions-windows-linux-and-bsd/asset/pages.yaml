- pgno: 327
  md: '# 314 Part III: Backup-Media Recovery


    Principally, you can disassemble the laser head and replace the emitting element
    directly. The spare emitter can be taken from another drive. However, it is necessary
    to mention that cases, in which users correctly reassemble the laser head, are
    rare.


    # # Chipset


    The chipset is the heart of the CD/DVD drive. It not only ensures information
    processing but also controls the positioning and rotating motors, the laser head,
    and tracking coils. Economic manufacturers integrate the entire chipset into a
    single chip and do not worry about cooling it. As a result, the chipset quickly
    fails, linearly burning through. As a result, the drive fails partially or completely.


    The behavior of the failed chipset might differ. It might either fail to recognize
    the drive or simply reduce the reading speed. The chipset that has preserved the
    minimal functionality level so that it is capable of recognizing the drive and
    moves the optical head to the disc start when powered on, after which it starts
    dragging the focusing lens. If these events do not take place, this means that
    either the chipset or the electrical components that serve the chipset have failed
    (however, electrical components serving the chipset rarely fail).


    Replacing the burnt chipset under home conditions is an unrealistic task. First,
    it is impossible to purchase spare chipsets. Second, the price of a chipset is
    comparable to the price of an entire drive. Third, replacing the chipset is similar
    to a jeweler''s art, and it is practically impossible to carry it out under home
    conditions without specialized equipment.


    On the other hand, it is possible to prevent the chipset from failing. Using double-sided
    adhesive tape or glue, stick even a tiny heat sink to the largest chip (glue is
    better, but adhesive tape is cheaper). Also, it is desirable to cool the drive
    with a fan. To achieve this, drill holes on the rear side of the case, and install
    a fan there. To avoid the chipset failure, it is best not to place the drive over
    the hard disk. This is because drives, especially high-speed ones, are characterized
    by high heat emission, which will overheat the CD/DVD drive.


    Formally, cache memory is not the part of the chipset; however, it is closely
    related to the chipset. The cache memory also often fails. If the defect involves
    one or slightly more cells, this usually has no effect on the operation of the
    entire drive because of the error-correction codes. However, in cases of large-scale
    destruction (to speak nothing about complete failure of the cache memory), the
    drive'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Chapter 11: Repairing CD/DVD Drives under Home Conditions


    either ceases to read discs or reads them too slowly and with many errors. Because
    a CD/DVD drive uses the same cache memory as a dual in-line memory module chip,
    it can be replaced — at least, in theory. In practice, successful replacement
    of the CD/DVD drive cache memory is a matter of high-quality soldering.


    # Mechanical Damage


    CD/DVD drives are excellent dust collectors. This is especially true if a CD/DVD
    drive is installed directly above a hard disk drive cooler or fans. The dust passes
    through the slots in the CD/DVD drive case and forms a layer of sediment on mechanical
    parts. This speeds up the wear of the drive''s mechanical parts, resulting in
    a complete wreck. The drive can fail to close the tray, eject the disc immediately
    after closing the tray, fail to rotate the disc, or rotate it but emit strange
    sounds. The same relates to the positioning mechanism.


    To eliminate problems with mechanical components, disassemble the drive, remove
    all of the dust, and lubricate the bearings. Bear must be used sparingly and that
    plastic gear wheels do not need to be lubricated. If necessary, adjust the gaps
    to ensure that all parts rotate without effort yet are not loose. Make sure that
    all gear wheels and wheel gears are not overworn. They must not have crumbled
    cogs, and no extraneous items must be present there (mainly, this relates to grit
    from discs that have been split in the drive, as well as to loose cables).


    First, check all mechanical contacts, including jacks, trimming resistors, buttons
    and switches, and tray closure sensors, as well as the integrity of the power
    cords. If the power supply short (interface connector) is disconnected carelessly,
    the thin wires might be broken, and this rupture might not be noticeable visually
    or even using the ohmeter. However, at large frequencies (normal operating conditions
    for the drive), the presence of this rupture will be immediately noticeable.


    Also, a careful and close look at all rubbing cables. Sometimes, rubbing wears
    holes into them, making the cables short circuit, or the wire breaks. Sometimes,
    both kinds of rupture occur simultaneously, which is especially typical for New
    Teac drives sold under the Teac trademark but assembled by third-rate companies
    because Teac abandoned the CD drive market and sold its trademark to inferior
    manufacturers.


    Do not forget fuses. If some cable is connected incorrectly, during a power failure
    it might burn out. Contemporary fuses are not similar to the customary glass tube
    with a thin wire inside. When briefly viewing the fuse, fuses are hardly'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'noticeable. By the way, as a rule there are multiple fuses, so I recommend
    that you check all fuses that you can find.


    Pay attention to the other components. Swollen varnish, traces of cinders, and
    physical defects (like fractures) are clear evidence of the source of trouble.
    Unfortunately, most failures of electronic components cannot be noticed visually.


    To check whether the motors are usable, disconnect them from the drive and then
    connect them to the 5-V power supply (the black wire corresponds to minus). Because
    all drives usually are standard, they can be easily replaced. In other words,
    I recommend that you check everything that can be checked, including electrolytes,
    resistors, diodes, stabilizers, and key transistors.


    Small logical circuits rarely fail; however, failures are typical for power elements.


    # Optics


    If you are not a chain smoker and never breathe smoke directly into the drive,
    then there is no need to clean the optics. One of my drives has worked more than
    10 years and never required cleaning.


    Forget about cleaning sets, because nothing could be easier than crippling the
    lens using such sets. By the way, the lens is usually made of standard Plexiglass,
    which removes any hope of its recovery. Also, never try to clear the lens with
    a brush (Fig. 11.2). It is not advisable to wipe optical surfaces. Try to remove
    the dust with an air puff (if you use a rubber balloon, make sure that there is
    no talcum powder there, and never blow on the lens with your mouth, because this


    ![](img/1ce3cead9a6814cc94d1e00101c20220_329_0.png)


    Fig. 11.2. By clearing a lens with a brush, you can only ruin it'
  merge: -1
  img_proc: true
