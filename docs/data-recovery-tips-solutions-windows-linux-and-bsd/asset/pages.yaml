    # Creating the Boot Record


    In this section, I will demonstrate how to write a custom multiboot manager. The
    multiboot manager is the code that resides in the boot sector and if you choose,
    any of the operating systems installed on your computer. When implementing this
    task, you''ll become acquainted with the INT 13h interrupt, partition table, and
    many other interesting things. The standard loader installed by most operating
    systems by default is too primitive to be taken seriously. On the other hand,
    nonstandard third-party loaders are often bulky and unreliable. Thus, the hackers
    approach is to write a custom loader. When writing it, you''ll learn the Tao and
    Zen of Assembly language, learn how to debug programs without a debugger, and
    get a taste of disk hardware.


    # The INT 13h Interface


    It is possible to control hard disks both through input/output ports and through
    BIOS. Techniques of controlling disks through port ports are more powerful and
    interesting; however, programming BIOS is easier. In addition, BIOS supports various
    drives, abstracting the specific features of design typical for each individual
    model. Therefore, I have chosen to use BIOS or, to be precise, the INT 13h interrupt
    interface.'
