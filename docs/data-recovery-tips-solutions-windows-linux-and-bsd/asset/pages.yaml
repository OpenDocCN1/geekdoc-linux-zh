- pgno: 273
  md: 'The File name field specifies the name of the image (the name Track is assigned
    to the image by default), and the Save as field specifies the file format. It
    is useless to try any tricks with this field, because the freeware version of
    the program doesn''t support any other formats; the possibility of choosing the
    target file format is pure illusion.


    The settings included in the Read Data Track Settings are more interesting. The
    Start block contains the LBA of the first sector of the chosen session, and the
    Length in Blocks field specifies the session length in sectors. By default, these
    fields contain information from the TOC. Provided the TOC hasn''t been intentionally
    modified to protect the disc against copying, these data can be relied upon. However,
    as you''ll see later, TOC corruption is not a rare event. At the same time, the
    capabilities of Easy CD Creator in the field of recovering tracks with invalid
    addresses are more limited, because it is too suspicious when checking the "correctness"
    of the starting and ending addresses. Thus, if the TOC states that the starting
    address is greater than the ending address, Easy CD Creator will blindly believe
    that to TOC information, and all attempts at convincing it that this is not inevitably
    fail. Thus, if you are going to work with protected CDs, I recommend that you
    choose a more intellectual tool.


    The Block Size field contains the size of the sector part containing user data
    (bytes). The freedom of choice here is purely symbolic, because you won''t be
    able to change this value. However, there is no need to change it; Easy CD Creator
    doesn''t support sectors sectors. The size of the sector part containing user
    data is unambiguously defined by the type of sector, so modification of this value
    is meaningless.


    Briefly, all you need to do is click the Save button and wait for the chosen session
    to be written into the newly-created ISO file. When this process completes, it
    will be possible to burn the image to a new CD using Easy CD Creator (choose the
    Record CD from CD image command from the File menu and specify the image file
    as the file type). As an alternative, it is possible to start Alcohol 120% and


    Either way, you''ll regain access to the deleted files and it will be possible
    to do whatever you like with them.


    When viewing the contents of the grabbed session, always bear in mind that physically
    belonging to different sessions won''t be available from the current session,
    even though references to them might be present in abundance. If you access a
    file that doesn''t exist, the system would either display an error message or
    output


    ![](img/1ce3cead9a6814cc94d1e00101c20220_273_0.png)


    IMPORTANT'
