  md: '# Chapter 6: New Technology File System — Inside and Out 149


    system uses this character for accessing named attributes. The maximum allowed
    length of a name is 255 characters.


    # Win32


    All Unicode characters (regardless of the case) are allowed except for the following:
    /, :, " (quotation marks), *, < (less than), > (greater than), ? (question mark),
    \ and | (pipeline). In addition, file names cannot be terminated by dots or blank
    characters. The maximum allowed name length is 255 characters.


    # MS-DOS


    All characters of the Win32 namespace (regardless of the case) are available except
    for the following: + (plus sign), , (comma), . (dot), ; (semicolon), = (equal
    sign). The file name length must not exceed eight characters followed by optional
    name extension with the length from one to three characters.


    # Aims of Some Auxiliary Files


    NTFS contains lots of auxiliary files (metafiles) of a strictly predefined format,
    the most important of which is the MFT file that you have already considered.
    Other metafiles play auxiliary roles, knowing their structure isn’t necessary
    for data recovery. Nevertheless, if they are damaged, the native file system driver
    is unable to work with these volumes. Therefore, you should have at least some
    idea about the aims of these metafiles.


    Brief information about the most important metafiles is provided in Table 6.11.
    Unfortunately, it is not possible to cover the structure of all metafiles within
    a single chapter. For more information on this topic, refer to the Linux-NTFS
