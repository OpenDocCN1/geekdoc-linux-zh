- pgno: 133
  md: '# Technique of Boot Sector Recovery


    Because the boot sector is vitally important, Windows NT creates its mirror copy
    when formatting the disk (on NTFS partitions only). Windows NT 4.0 places it in
    the middle of the logical drive, and Windows 2000 put it in the last sector of
    the partition. If the partition table has not been damaged, simply go back one
    sector of the next partition, (Windows 2000) or divide the number of sectors of
    the logical drive by two (round the result to the lower value) and say GO to the
    disk editor (Windows NT 4.0).


    If the partition table has been destroyed, you can find the boot sector copy using
    a global search (look for the NTFS string at offset 3 from the sector beginning).
    Because the position of the copy is fixed and is counted from the beginning of
    the logical disk, it is possible to define the partition boundaries with certainty.
    For example, assume that the copy of the boot sector has been found in sector
    1289724 and that the NumberSectors field contains 1289661. Thus, the sector number
    of the partition is 1289724, and the starting number is 1289724 - 1289661 == 63.
    Because the boot sector is located at a distance of one head from the partition
    table, it is possible to recover it, too.


    If no copies are available, the boot sector must be reconstructed manually. This
    is not difficult. Fill the identifier (OEM ID) field with the NTFS string (without
    quotation marks but with four trailing blank characters). For fields of sectors
    per track and number of heads are filled according to the current disk geometry.
    The number of heads (for example, sectors located between the sector beginning
    and the boot sector) is equal to the number of heads. The total number of sectors
    in the partition is computed according to its size (provide some reserve if you
    do not know the exact value).


    The number of sectors per cluster is more difficult to determine, especially if
    the disk was formatted using a value other than the default one. However, the
    situation is not hopeless. Scan sequentially file records in the MFT and find
    the file with the signature number beforehand. As an example, assume that this
    is the ntoskrnl.exe file. Open its authentic copy using a hex editor, locate the
    unique sequence that is guaranteed not to be encountered in any other file and
    is within the limits of the first 512 bytes from the file start, and then find
    it on the disk using a global search. Because you know the number of the starting
    cluster (it is contained in the MFT) and the logical sector number (it was found
    by the disk editor), the only thing that remains is to correlate these two values.
    If the disk editor'
