    ATA stands for advanced technology attachment, and its history is closely related
    to the history of IBM and IBM computers. To overcome the limitations characteristic
    of the interface with modified frequency modulation (MFM) drives that were used
    in IBM XT, the company delegated the responsibility for development of the new
    industrial standard to the T10 committee (http://www.t10.org). The committee successfully
    solved this problem, although it didn''t suggest any revolutionary ideas, having
    limited itself to integrating the hard disk controller directly with the device,
    connecting with a daisy chain to the industry standard architecture (ISA) bus.
    That''s why ATA controllers are so cheap and uncomplicated. They include the buffer
    memory chip and address descriptor. Naturally, the contemporary ATA controller
    is more sophisticated; however, advances are not enough to considerably raise
    its price.


    Even the first version of the standard had lots of features in common with SCSI.
    The list of these common features includes an integrated controller, a unified
    set of commands (although not with the reach of that of SCSI), and the possibility
    of simultaneous operation of devices connected to the bus. However does not have
    a "transparent" addressing mode, and it lacks the mechanism of deferred command
    execution and queue of requests. The maximum number of devices on the bus is only
    two. Furthermore, only one device can operate at any given moment; the other device
    is forced to wait for the bus to be released, which happens after completion of
    the data exchange cycle. Having passed a command for sector reading, the processor
    continuously polls the status port, where the device sets the ready flag. The
    data, word by word, are read by the processor through the input/output port. Nevertheless,
    in the single-tasking systems of those days this didn''t seem a serious limitation,
    because the processor couldn''t switch to another task anyway.


