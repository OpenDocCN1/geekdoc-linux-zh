  md: '# Zero Track Problem


    The MBR is strictly bound to the first sector. Typical MBR sector content is shown
    in Listing 5.5. Thus, if the first sector happens to be destroyed, it will be
    impossible to work with such a disk. Until recently, the problem was solved using
    sector-by-sector copying of the disk, migrating the data to a healthy hard disk
    with identical geometry, and then recovering the MBR.


    The situation has changed. Contemporary hard disks support the possibility of
    forcibly replacing bad sectors from a reserve fund (some disks even do this automatically);
    therefore, the zero track problem that had haunted programmers since the time
    of floppy disks and 8-bit machines has ceased to exist.


    The sector replacement mechanism has not standardized yet is implemented by units
    supplied by the manufacturer of a specific disk model. Usually, they are distributed
    for free and come from the Internet.


