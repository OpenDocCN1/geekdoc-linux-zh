    **Fig. 6.2. NTFS volume structure**


    To prevent fragmentation of the MFT file, the MFT zone is reserved until the volume
    runs out of free space. After that, the unused “tail” of the MFT zone is truncated
    by 50%, thus freeing space for new user files. This process can be repeated multiple
    times until all reserved disk space is exhausted. This solution, although elegant,
    isn''t new. Many file systems popular in the 1980s allowed you to reserve a specified
    amount of disk space in the tails of active files, thus reducing their fragmentation
    (note that this related to all files, not auxiliary ones). In particular, DOS
    3.0 developed for Agath PCs provided such a possibility. Perhaps, you remember
    such PC?


    When the MFT file reaches the limit of the MFT zone, it inevitably fragmented
    in the course of its further growth, causing catastrophic performance degradation
    of the file system. This being, so most defragers do not process the MFT file,
    although the defragmentation program interface (API) built into the NTFS drivers
    provides this capability. All details related to this, along with a better defragmentation
    utility, can be found at the site of Mark Russovich (http://www.sysinternals.com).
    Anyway, I recommend that you do not fill the volume to more than 88% of its capacity.


    If necessary, the MFT file can be moved to any disk location. In this case, it
    will no longer reside in the starting area of the volume. The starting address
    of the MFT file is stored in a boot sector at the offset 30h from its starting
    point (the “Boot Sector Basics” section in Chapter 5). In most cases, this address
    references the fourth cluster.


    The MFT file is an array of records the FILE type (inodes in UNIX terminology),
    each describing the corresponding file or subdirectory (for more details, see
    the “File Records” section later in this chapter). In most cases, a single file
    or subdirectory is described by a single file record, although in theory several
    records might be needed.'
