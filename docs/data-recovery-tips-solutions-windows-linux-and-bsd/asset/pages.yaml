- pgno: 323
  md: '# Why You Need This


    The low price of CDs depreciates the advantages of mode 2. At the same time, mode
    2 considerably reduces the data storage reliability, which for cheap media is
    is low enough without mode 2. Even if you record 100 GB of data, you''ll only
    need about 20 discs, likely spending less than $10. Is it worth using mode 2?


    Everything depends on the kind of data recorded. In particular, in the course
    of reencoding a DVD to a CD-R the video quality inevitably degrades. But writing
    a movie to two CD-Rs involves too much overhead, so the extra gain of 100 MB comes
    in handy. Furthermore, when choosing the compression coefficient, it is impossible
    to predict the exact length of the reencoded file. So you might become vexed if
    the file you spent so much time and effort to form exceeds the volume of a CD-R
    by some 30–50 MB. Under such circumstances, you have to delete the file from the
    disc and repeat the compression procedure, which requires from 3 to 12 hours,
    depending on the speed of your processor. Writing such a file in mode 2 helps
    you economize more on time than on money.'
