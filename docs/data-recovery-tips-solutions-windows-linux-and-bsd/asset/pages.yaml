    +   13. Surface integrity is checked and all detected bad clusters are saved into
    the /$Badcls file.


    +   14. The new root directory is formed.


    +   15. If before the volume was formatted it contained the /System Volume Information
    file, then this file is updated; otherwise, a new /System Volume Information file
    is created only after rebooting.


