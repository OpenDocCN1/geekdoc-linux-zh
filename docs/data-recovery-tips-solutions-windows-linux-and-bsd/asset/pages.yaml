  md: '38 Part I: Data Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_51_0.png)


    Fig. 2.13. The hexedit editor


    Which editor should you choose? Generally, this is a matter of personal preference
    (note that I mean not only your personal preference but also those of the individuals
    who have composed the distribution). Some people prefer the hexed console application
    (Fig. 2.12), other users like the khexedit GUI application (Fig. 2.13), and still
    others choose BIEW (a clone of the well-known HIEW editor with limited capabilities).


    # # Automated Doctors


    It is extremely hard to invent a larger utterly than ChkDsk the built-in “doctor”
    as part of the Windows distribution (Fig. 2.14). Even writers from Hollywood would
    probably be unable to tackle this task. In the case of this “tool” the error-reporting
    system is reduced to the minimum, because the doctor only reports detection but
    refuses to inform users about the nature and cause of the detected error and what
    it is going to fix. Thus, the consequences of such a fix might be deplorable.'
