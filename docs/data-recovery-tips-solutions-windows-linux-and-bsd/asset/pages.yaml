    From the hardware point of view, this is a normal IDE controller, supporting programmed
    input/output (PIO) and partially DMA/UDMA modes. It is supplied with an electronic
    key (as a rule, based on a powerful field transistor) that allows you to connect
    and disconnect hard disks without powering down the computer, which is convenient.
    The problem is that if the disk is installed on the standard port, then when this
    interface is powered down, the noise arising in it freezes the computer, among
    other things. However, the possibility to connect the disk on the fly can be achieved
    if you connect the disk to a standalone power unit and, before switching it off,
    supply the 94h command (standby immediate).


    Technological commands that control the hard disk internals are passed using the
    ATA interface or through the COM terminal. Lots of hard disk models are equipped
    with the integrated COM port, and connecting to this allows you to control the
    disk initialization process and control the drive (not all disks have this port
    on the connector). For the goals described here, a normal COM port built in a
    computer plus a couple of adapters that radio fans would easily construct on their
    own would be enough. In addition, hardware and software for hard disk repair provide
    the possibility of passing the reset signal anytime, which helps if the hard disk
    freezes. Standard IDE controllers are not able to do this. However, in principle'
