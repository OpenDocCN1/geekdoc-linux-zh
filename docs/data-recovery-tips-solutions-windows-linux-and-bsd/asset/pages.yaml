- pgno: 29
  md: 'Errors related to data transmission through Ultra ATA CRC Error Rate are extremely
    perfidious. If this parameter falls outside the limits of correcting capabilities
    ensured by redundant error correction codes, the file system will crash. If the
    value of this parameter is above normal, make sure that the interface cable is
    not kinked and, if necessary, shorten it.


    Carefully trace the temperature and avoid disk overheating. As a rule, the maximum
    allowed temperature is provided in the disk specification. Most contemporary hard
    disks normally withstand the ambience temperature of 50°C–60°C (do not confuse
    this temperature with the readings of the built-in heat sensor). If this temperature
    limit is not exceeded, no additional cooling is required. However, if this temperature
    is exceeded, make sure that you have provided additional cooling.


    Do not overclock the processor, peripheral component interconnect (PCI) bus, and
    RAM. Doing so might result in irreversible corruption of the internal file system
    structures. The expenses of data recovery will neutralize all economy achieved
    by overclocking. You should know that on hard disks with 8 MB of cache memory
    all versions of the Windows operating system, until Windows XP, do not behave
    well and often cause serious disk damage. This happens because in the course of
    system shutdown Windows powers down the hard before it flushes the cache. The
    problem can be solved either by migrating to Windows XP or by installing an appropriate
    service pack. Generally, it is not recommended that you purchase hard disks with
    a large cache. It is rumored they are not sufficiently reliable and are characterized
    by lots of unsolved engineering problems.


    If you care for your data, use built-in capabilities for file encryption, and
    never “upgrade” your basic volumes to dynamic ones. All of these features store
    important information in the operating system registry. After a system crash they
    become unavailable. Never run any programs that you do not trust; at least, run
    them with administrative privileges! The best practice is to use the minimum privilege
    level required for specific tasks and log on as administrator only if necessary.
    All files you do not intend to modify in the future must be protected against
    modification. Remove this attribute from all users whose names log on to the system.


    If you follow all recommendations provided in this section, you can considerably
    reduce the risk of irreversible data loss and significantly simplify the procedure
    of data recovery if the worst happens.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Chapter 1: Introduction to Data Recovery 17


    # Security Holes


    The common opinion is that operating systems of the Windows NT family reliably
    protect data against destruction. Microsoft states that its operating systems
    block direct access to computer hardware and provide discretionary access capabilities
    that no one has bypassed it yet (at least, using a universal technique).


    This opinion is incorrect. Do you have a CD-RW drive? Do you use CD burners? Are
    they not working on the basis of the advanced SCSI programming interface (ASPI)?
    And did you know the ASPI driver allows any application, no matter what privilege
    level it be, with all integrated device electronics IDE and the low level, which,
    in particular, allows all sectors to be erased? If even you delete this lapse
    ANSI, the SCSI pass-through interface (SPTI) would remain. SPTI is an integral
    part of the operating system that allows the same thing ASPI allows to do, although
    it requires administrative privileges. Do you think an intruder would encounter
    any difficulties in the privilege level? Reading the hard disk at the sector level
    is default available to all users without exception and it isn''t simple to disable
    it. At this level, there are no such things as “privileges,” and all files containing
    confidential information (including authentication data) are available to all
    users. Strictly speaking, at the sector level there are no “files.” However, this
    doesn’t create a serious obstacle for a hacker.


    As relates to drivers, their privileges are not limited; consequently, they can
    do whatever they please to the system. Drivers often contain critical errors that
    crash Windows and turn the file system into a mess. This is especially true of
    drivers from amateur developers who write their drivers carelessly and have a
    devilmaycare mentality about programming culture. Is it possible to prevent applications
    from installing their drivers in the system? In general, this is possible. It
    is enough to install the application with normal user privileges. However, what
    would you achieve by doing so? The application won’t operate without its driver,
    and it isn’t always possible to find a decent alternative. And they dare say about
    security.


    # Disk Defects and Methods of Eliminating Them


    The most common disk defects and methods of eliminating them are briefly outlined
    in Table 1.1.'
