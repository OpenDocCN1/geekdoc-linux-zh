    If you consider the surface of a CD under an electronic microscope (Fig. 10.15),
    you''ll see the alternating chains of pits and lands. Lands reflect most of the
    incident beam from the laser, and pits, because of their distance from the focal
    point, reflect almost nothing.


    Because of its wave properties, the beam simply skirts solitary pits and lands.
    The minimal data formation that can be recognized by the laser beam with confidence
    is a sequence of three pits or lands. Thus, pits and lands form chains, each chain
