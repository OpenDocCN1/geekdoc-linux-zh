- pgno: 181
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    the deleted file and write it to some location other than the partition This is
    not a happy decision. What if there is not enough free space on all other disks?
    What if the disk being recovered has only one logical partition? For example,
    assume that you need to recover a database of several gigabytes. It is possible
    to install a disk, recover the database, and then copy it back. However, this
    will be a lengthy process! Furthermore, it is not recommended that you power down
    the server,Another drawback of such automated undelete utilities is slow operation.
    Instead of finding a single file, the name which is known, the automated undelete
    would scan the entire partition. This means several hours of wasted time, if the
    disk is large enough.


    On the other hand, utilities that directly modify NTFS expose the entire disk
    to the severe risk of corruption. If this happens, a disk becomes irreparably
    damaged, even for experienced professionals. True hackers would rely on any third-party
    code, especially if the source code is unavailable and documentation is ambiguous
    and poorly understandable. Furthermore, different NTFS versions are supported
    by different operating systems from the Windows family. The last system that introduced
    radical changes into NTFS was Windows XP (NTFS 3.1). The attribute that updates
    the sequence number and array was moved 6 bytes forward, and the space that it
    occupied earlier was allocated for alignment and the field of the recent file
    record (the number of this MFT record). Therefore, make sure that the recovery
    utility you use supports your version of the file system and distinguishes it
    from all other versions without fail. Recall that if you upgrade Windows 2000
    to Windows XP, the file system is not updated until you reform the disk. This
    is not immediately obvious, and most users would run into this pitfalls. The consequences
    of such “recovery” will be disastrous.


    Finally, consider the situation that you have no recovery utilities available
    when you need to recover some file. In such a situation, you will have to rely
    on your skills alone.


    # Manual Recovery of Deleted Files


    Consider the simplest case. Assume that the file has been deleted recently and
    the file record belonging to it has not been overwritten yet. How is it possible
    to find such a file on the disk? There are two approaches to solving this task
    — theoretical and practical. The theoretical method is extremely reliable; however,
    it requires lots of extra operations, which usually can be avoided if you base
    your recovery on several practical assumptions.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The theoretical method includes the following operations: Extract the pointer
    to MFT from the boot sector, retrieve the first record from it (this record describes
    $MFT), and find the $DATA (80h) attribute. Then decode the list of data runs and
    sequentially read all files from MFT, analyzing the contents of the $FILE_NAME
    (30h) attribute, which stands for the file name (and the file might have more
    than one attribute of this type). This attribute also stores the reference to
    the parent directory, if several files with the same name were deleted from different
    directories, it is necessary to distinguish which of them you need to recover.


    The practical approach is based on the following: In cases out the SFT file is
    not fragmented and resides practically in the beginning of the disk. File names
    are stored at the offset EAH from the sector start, in the beginning of which
    the FILE* signature (FILEO in NTFS 3.1) is located. Thus, it is possible to start
    any disk editor (for example, Disk Probe supplied as part of Microsoft’s support
    tools), enter the name of the file to be recovered in Unicode encoding, and search
    for this file at the offset EAH (FH in NTFS 3.1) from the sector start (Fig. 7.2).


    ![](img/1ce3cead9a6814cc94d1e00101c20220_182_0.png)


    Fig. 7.2. Manual file recovery using Disk Probe'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    When you find the required entry, check whether the FILE* or FILE0 signature is
    located in the beginning of the sector. If there is no such signature, then continue
    the search. The 2-byte field at the offset 16h from the start contains the record
    flags: 00h means that the record is not used or is deleted, 01h means that the
    record is used, and 02h means that the record is used and is a directory. Other
    values might be encountered—for example, 04h and 08h. However, their meaning is
    unknown and undocumented. You''d probably find out what they mean.


    Replace 00h with 01h, and save the changes. Did you succeed? Of course, after
    doing this you won''t achieve any positive result. This is because in addition
    to these actions it is necessary to carry out the following steps:


    +   1. Inform /SMFT:$BITMAP that the MFT record is in use again.

    2. Remove from /$BITMAP file numbers of clusters that belong to the file being
    recovered.

    3. Rebuild the indexes'' binary tree that stores the directory contents.


    The first two steps do not present any serious problems, in contrast to the last
    step, which requires serious effort. As a variant, it is possible to issue the
    ChkDDS /F command. The ChkDDS utility would find the "lost" file and introduce
    all required changes into the file system (see Listing 7.1). Thus, you''ll only
    need to set the flag located at the 16h offset to one; the remaining work would
    be carried out by ChkDDS. After these sophisticated manipulations, the recovered
    file will be placed to its original location.


    # Listing 7.1. Recovery of the deleted file using ChkDDS


    ```

    C:\ChkDS D:/F

    The type of the file system is NTFS.

    File verification completed.

    Index verification completed.

    CHKDSK is recovering lost files.

    CHKDSK is recovering the lost file test.txt in directory file 5.

    CHKDSK is replacing incorrect security descriptor for file 29.

    Security descriptor verification completed.

    CHKDSK is correcting errors in the BITMAP attribute of the master file table.

    ```'
