  md: '# File System Structure


    The structure of the disk volume formatted for ext2fs is outlined in Listing 8.4.
    In the beginning of the hard disk is the boot sector (on partitions that are not
    bootable, it might be empty). After it, at the 1024-byte offset, lies the superblock
    containing key information about the file system. (On FAT and NTFS partitions,
    this information is stored directly in the boot sector.) The area of main interest
    is the s_log_block_size 32-bit field located at the offset 18 bytes from the start
    of the superblock. This field stores the block size (or, in MS-DOS and Windows
    terminology, the cluster size) expressed in the form of the pointer to the position,
    to which the 200h number must be moved. Expressed in natural units, as follows:
    block_size = 200h << s_log_block_size (bytes). This means that if s_log_block_size
    is equal to zero, then the size of one block is 400h bytes, or two sectors.


    # Listing 8.4. The structure of the disk volume formatted for ext2fs


    | Offset | Size | Description |

    | --- | --- | --- |

    | 0 | 1 boot record | ; Boot sector |

    | -- block group 0 -- | ; Block group 0 |

    | (1024 bytes) | 1 superblock | ; Superblock |

    | 2 | 1 group descriptors | ; Group descriptor |

    | 3 | 1 block bitmap | ; Map of free blocks |

    | 4 | 1 inode bitmap | ; Map of free inodes |

    | 5 | 214 inode table | ; Inode array (information about files) |

    | 219 | 7974 data blocks | ; Data blocks (files, directories) |

    | -- block group 1 -- | ; Block group 1 |

    | 8193 | 1 superblock backup | ; Copy of superblock |

    | 8194 | 1 group descriptors backup | ; Copy of group descriptor |

    | 8195 | 1 block bitmap | ; Map of free blocks |

    | 8196 | 1 inode bitmap | ; Map of free inodes |

    | 8197 | 214 inode table | ; Inode array |'
  merge: -1
