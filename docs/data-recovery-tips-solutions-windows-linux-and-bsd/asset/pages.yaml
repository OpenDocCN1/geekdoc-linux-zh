- pgno: 28
  md: '# # Chapter 1: Introduction to Data Recovery 15


    installing the operating system, never try to partition it later, because the
    risk of losing all data it stores is extreme.


    Carefully track the readings provided by the S.M.A.R.T. system. There are lots
    of utilities capable of reading this information. A good example of such a tool
    is AIDA (Fig. 1.7). Sharp growth in the number of reallocated sectors (Reallocated
    Sector Count) is a symptom of imminent disaster, and it is strongly recommended
    that you replace the disk as soon as possible. It is the *gradient* value that
    should be taken into account. Growth of the Raw Read Error Rate is also a symptom
    of serious disk problems. If this happens, you should copy all valuable data from
    such a disk and get rid of it as soon as possible. An increase of the Seek Error
    Rate and Retry Count indicate that there are growing discordances in the operation
    of the hard disk mechanics, which usually indicate disk failure. On the other
    hand, an increase of the Spin Up Time is a normal phenomenon caused by specific
    features of the construction of certain hard disk models; there is no reason to
    wait until this parameter reaches the threshold.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_28_0.png)


