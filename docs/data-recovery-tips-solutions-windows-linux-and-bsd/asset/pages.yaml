    # # Recovering Deleted Files under Ext2fs or Ext3fs


    Everyone has at least one deleted a valuable file (or even the root directory).
    Assume that you did this but that there is no backup copy and no time to search
    for suitable recovery utilities. What should you do? Fortunately, everything that
    you could need to carry out the recovery has already been included in your favorite
    dis-ribution set and is always close at hand. Briefly, these are debugfs, isdl,
    stat, cat, dump, and undef. If you need some explanations and clarifications in
    relation to this topic, read this section, which explains the processes of data
    recovery on ext2fs and partially on ext3 partitions.


    Information related to data recovery over Linux is scarce. It might seem that
    its fans never lose data. This is not so. Erroneous file deletion is a common
    occur-rence; in Linux world, it might occur more often than that under Windows.
    In Windows, most file operations are carried out manually using Windows Explorer
    or other interactive tools, such as FAR Manager. Linux also provides interactive
    en-vironments, such as KDE, GNOME, and Midnight Commander. However, com-mand line
    files are more numerous in this world. The command line reg-ular expressions and
    scripts — in other words, automated control tools — are convenient and powerful
    yet destructive. A slightest fault or carelessness in their design, and kiss your
    files goodbye.


    Files die occasionally and tend to do this unexpectedly. This can never be pre-dicted;
    therefore, the administrator must be vigilant. Situations, in which only a few
    seconds ago everything was OK and then hundreds of gigabytes of vital information
    are lost, are not rare. After that, it will be necessary to do everything in your
    power attempt to recover everything that can saved.


    The availability of the source code of file system drivers considerably simplifies
    investigation of their internals. Data recovery on ext2fs or ext3fs is a trivial
    task because of simplicity of the file system structure. FreeBSD file systems,
    such as the UNIX file system and the fast file system, are considerably more sophisticated'
  merge: -1
