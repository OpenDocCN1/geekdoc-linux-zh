  md: '# 234 Part II: Automated and Manual Hard-Disks Data Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_247_0.png)


    **Fig 8.15.** Four disks, four channels


    A disk array made up of 12 hard disks connected to EPOX 4PCA3+ is as fast as a
    supersonic destroyer; however, it is practically as noisy. In addition, it is
    necessary to purchase a powerful 350-W power supply unit and install special filters
    to the splitter to suppress the noise, which hard disks are sensitive. The performance
    gain can be worth it, especially if the computer is used for video editing or
    processing high-quality images. However, if your requirements to performance are
    as high as this, it would be better to consider SCSI disks from the beginning.
    In this chapter, I''ll mainly describe IDE as the most common and inexpensive
    interface.


    # Performance Tuning Using Hdparm


    To achieve the highest performance, each hard disk installed into the system must
    be tuned according to its goals. Standard settings specified by default are oriented
    toward an average user and rarely satisfy individual requirements. If you tune
