    # Mount Rainier


    The much-talked-of Mount Rainier technology is nothing but a marketroid''s hoax,
    and it doesn’t promote anything new. However, everything is discussed in due order.
    What is Mount Rainier? It’s an organization named after a picturesque national
    park (http://www.nps.gov/mora). This organization controls and coordinates various
    issues related to the interaction between operating systems and optical media
    and recorders. Practically all the cream of computer society participates in its
    proceedings: Philips, Microsoft, Compaq Computer, Sony, and so on.


    Mount Rainier Writer (or simply MRW), which praised by most journalists as the
    de facto standard of packet writing, is nothing but... standard packet writing
    plus UDF 2.0.1. The software is required to format the disc in the background
    and correctly process the interrupt from the latter by pressing the eject ton
    (after you insert the disc, the formatting will continue).


    Exalted declarations praising Mount Rainier and stating that this technology ensures
    the increase of the disc capacity and the number of possible rewriting cycles
    of CD-RWs, compatibility of the written media with all contemporary drives and'
