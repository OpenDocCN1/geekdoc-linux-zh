  md: '# Virus Operation Algorithm


    Close the manual on the PE format, because you won''t need it for the moment.
    The method of insertion considered here is as follows: The virus creates an additional
    stream within the target file, copies the main file body to it, and overwrites
    the original file body with the shellcode that passes control to the main body.
    Such a virus will operate only under Windows NT/2000/XP and only on NTFS disks.
    For FAT partitions, the original contents of the infected files will be lost,
    and that a disaster. The same will happen if the file is archived with Zip or
    any other compression utility that doesn''t support streams. WinRAR provides support
    for streams — when you are archiving files, do not forget to go to the Advanced
    tab of the Archive name and parameters and set the Save file streams checkbox
    if you want to save streams (Fig. 6.5).


    There is another problem: Windows blocks access to all currently-opened files,
    so if the virus attempts to insert itself into explorer.exe or firefox.exe, it
    will inevitably fail. From the virus''s point of view, that''s too bad. However,
    a cunning virus will find a way out. The blocked file cannot be opened, but it
    can be renamed. For example, the virus might take explorer.exe and rename it to
    foo. Then the virus creates a new file, names it it, places the virus body into
    the main stream of the newly-


