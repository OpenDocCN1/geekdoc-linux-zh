    # How Can You Crack StarForce?


    It is impossible to create an exact copy of the physical structure of the spiral
    track, at least for the moment. Certain advances have been reached. For example,
    CD drives with variable writing density, such as Plexor’s PleX Premium have appeared
    on the market. However, for the moment no CD copiers support this feature. I have
    created an experimental copier that imitates the structure of original track by
    reordering sector numbers; however, this copier has not been finalized into a
    quality product. There are other ideas; they are not expected to be of great vitality
    in the long term. I expect that StarForce developers will easily bypass them.


    This doesn''t matter. Before checking the key characteristics of the spiral track,
    the protection profiles the drive to evaluate the stability of all timing characteristics.
    The higher the drive quality, the more restrictive check, and vice versa. On old
    and loose drives, the protection must reduce the requirements; otherwise, even'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Chapter 10: Recovering CDs 277


    a licensed disc be recognized as an unauthorized copy, which cannot be tolerated.
    Hence, the following conclusion can be drawn: Copy the disc to a poor quality
    medium and try to run it on an old drive (it is possible to unsett the automated
    speed regulator by detuning the special trimming resistor). There will be a chance
    that the copied disc would be recognized as an original. In case of failure, it
    is possible to repeat the trick with another lot of media from another manufacturer.
    Lots of users report that they have protected discs to CD-RW. Because of the low
    reflectance, CD-RW is considerably less readable and not stable as CD-R. In addition,
    it might be useful to employ the drives that do not allow intentional slowing
    (which means that utilities such as CDSlow refuse to operate with them). In the
    course of the disc profiling the dispersion of measurements exceeds a certain
    value, StarForces to switch to the lower speed.


    In my experience, for guaranteed copying of a disc to a CD-R, it is necessary
    to waste no less than ten discs from different manufacturers. These media have
    different spiral track geometry. For measuring the spiral track geometry, it is
    possible to use my custom utility, supplied on companion CD for this disc. As
    relates to normal hackers, they can unbind a game from the CD within a day (provided
    that they are already acquainted with StarForces). Nevertheless, for the moment
    no one has written a universal cracker, and crackers crack each program individually.


    If this is the case, start the Alcohol 120% program (Fig. 10.6), choose the Create
    image command, and specify the StarForces 1.x/2/3.x or the Securum *NEW (V4.x)
    option as the data type. When this option is chosen, the Data positioning measurement
    (High precision) checkbox will be set automatically. The Read subchannel checkbox
    will be cleared. All others are not critical (sometimes, however, the Quick skip
    of error blocks option might result in errors when working with lowquality discs.
    The positioning measurement speed should be at the minimum. Also, I recommend
    that you do not use the computer to carry out other tasks during the entire operation.
    However, you''ll probably have to conduct some experiments here. For example,
    my Teac 52x from a generic manufacturer normally measures the spiral track geometry
    at 52x; however, when the speed is reduced it starts to misbehave.


    The resulting image should not be written directly to the CD. Rather, it is intended
    for the emulator. Some users prefer the built-in emulator supplied as part of
    Alcohol 120%, and other individuals choose Daemon Tools. In Alcohol 120%, it is
    enough to choose the Settings Virtual drive menu commands, specify any reasonable
