- pgno: 170
  md: '# Chapter 6: New Technology File System — Inside and Out 157


    created file, and copies the original contents of explorer.exe into an additional
    stream. After the next system start-up, the explorer.exe file created by the virus
    will leave control, and it will be possible to delete the foo file; however; it
    might attract the attention of a vigilant user of an antivirus monitor.


    Now, it is time to explain the problem with antivirus monitors. Insertion into
    the file is only half of the job, and not the most difficult half. A virus writer
    must also figure out how to neutralize various antivirus scanners and monitors.
    Nothing can be simpler. It is enough to block the file immediately after start-up,
    and maintain it in this condition during the entire session until the reboot.
    Antivirus software will be unable to open the file and, consequently, will be
    unable to detect its modification. This locking can be carried out using various
    approaches — calling the CreateFile function with resetting the dwSharedMode flag
    to the LockFile or LockEx function. More detailed information on this topic can
    be found in the platform software development kit (SDK).


    The main error of viruses is that, having inserted their body into a file, they
    humbly wait until antivirus software opens the file and, having detected their
    presence, removes them. Nevertheless, contemporary hard disks are huge and scanning
    them takes considerable time, often several hours. Antivirus scanners check one
    file at a time. This means that if the virus leads a nomadic life, migrating from
    file to file, its chances of detection drop rapidly.


    The lab virus considered in this chapter inserts its body into the file, waits
    30 seconds, and then removes its body from the file and immediately inserts it
    into another one. The shorter wait, the higher the probability it will remain
    unnoticed by antivirus software. However, disk activity will become considerably
    more intense. Regular blinking of the disk activity light-emitting diode (LED)
    without any visible cause must immediately alert experienced users; the virus
    must behave more cunningly. For example, it is possible to monitor the disk activity
    and carry out infection only when some file is accessed. It is not difficult to
    write a program that would carry out this task. An example of such a utility is
    File Monitor by Mark Russinovich (http://www.sysinternals.com), which is supplied
    with the source code.


