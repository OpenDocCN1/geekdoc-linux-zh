    # Fragmentation


    Fragmentation inevitably increases as you work with the hard disk. File systems
    such as ext2fs, ext3fs, and ReiserFS are the most vulnerable to it. On UFS and
    XFS, the fragmentation influence is considerably reduced through the support of
    small blocks. On the other hand, the common opinion that Linux file systems are
    not subject to fragmentation is nothing but an absurd myth, which can be deflated
    by any experienced user.


    When several files are sequentially written to the disk, the system places them
    one after another that the first file is directly followed by the second, and
    so on. Thus, there is no free space for further file growth (the short “tail”
    near the end of the block is not taken into account), and the system must allocate
    blocks-where beyond the end of the next file. If there are no free blocks, the
    system searches for free blocks in the start of the disk. As a result, the file
    becomes “spread” over the entire disk surface. Consider another case. Assume that
    you have written five files, 100 blocks each, and then deleted the first, the
    third, and the fifth files, releasing 300 blocks in three fragments. When writing
    a 300-block file, the system would first try to locate a contiguous region of
    free space; however, if there is no such region, it will be forced to “spread”
    the file over the surface. To correct this situation, it is necessary to assemble
    all free blocks, joining them into one contiguous fragment; in other words, it
    is necessary to defragment the volume.


    In my opinion, the standard defragmenter as part of most Linux clusters is among
    the best free defragmentation utilities. If your distribution doesn''t contain
    a tool, you can download the source code of the defragmenter from http://metalab.unc.pub/Linux/system/filesystems/defrag-0.70.tar.gz.


    O&O Software, known by the famous defragmenter with the same name intended for
    Windows NT, has released an excellent console defragmenter for Linux, which is
    undergoing beta test and is available for free downloading at http://www.oo-software.com/cgi-bin/download/download-e-pl?product=OODXLIXBN.


    Regular defragmentation is a good method of overcoming the performance degradation
    of the file system.'
