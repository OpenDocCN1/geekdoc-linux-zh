- pgno: 122
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery


    (otherwise, you''ll render the disk unbootable). Now, it only remains to write
    the updated MBR to its original location and close the device handle. All changes
    will come into force after rebooting (they won''t if you have made an error).
    The revenge of the loader for the slightest design errors is horrible. So, if
    you want to avoid losing all contents of your existing partitions, it would be
    much better to practice on VMware or any other PC emulator.


    Under Windows 9x, the trick with CreateFile doesn''t work. However, under systems
    it is possible to restore to emulation of DOS protected mode interface (DPMI)
    interrupts or use an ASPI driver. Both methods were covered in detail in the “CD
    Cracking Uncovered” by Kris Kaspersky. Although this book dealt with CDR rather
    than hard disks, hard disk drives are programmed in a similar way.


    Before starting to develop your own custom loader, I advise you to carefully study
    ones. The source code of some loaders, specially chosen for this purpose, is supplied
    on the CD with this book. All loaders are distributed with restrictions to general
    public or BSD licenses:


    +   - ge2000.asm — This is a carefully commented Stealth virus that replaces the
    system loader with its own. Note that this virus is not dangerous and therefore
    can be used for educational purposes.


    +   - mbr.asm — This is an extremely simple but fully-functional loader supporting
    partitions larger than 8 GB.


    +   - boot.asm — This is an excellent multiboot manager, supplied with detailed
    comments. It switches to the protected mode and can boot from a diskette, CD Zip,
    hard disk, and so on. It supports partitions larger than 8 GB, displays a boot
    indicator, and provides lots of interesting functional capabilities, which I strongly
    recommend that you study and use.


    +   - cd-hack.SCSI.zip — This is a fragment from my book on CD protection against
    copying, describing various methods of low-level control over the drive from the
    Windows application level. Although it mainly relates to CD drives, a lot of this
    information is suitable for hard disks.


    # Debugging the Loader Code


    Debugging of the loader code is extremely difficult. The loader gains control
    long before operating system start-up, when no debuggers are capable of working.
    Several years ago, this was a tremendous problem. When creating advanced loaders'
