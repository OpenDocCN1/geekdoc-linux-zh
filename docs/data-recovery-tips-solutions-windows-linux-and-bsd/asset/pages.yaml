- pgno: 322
  md: '# Chapter 10: Recovering CDs 309


    To obtain trustworthy results, it is not necessary to investigate discs recorded
    using mode 2. From the physical point of view, mode 1 and mode 2 are practically
    identical. All you need to know is whether or not the recovering capabilities
    of CIRC codes are sufficient.


    Using Nero CD Speed or any similar utility, test your collection of CD-Rs and
    CD-RWs for data destruction. The CD SpeedScanDisc utility (Fig. 10.22) would display
    good sectors, damaged sectors, and unreadable sectors. For good sectors, any read
    errors are recovered at the level of the CIRC decoder. Damaged sectors are unrecoverable
    at the mode 1 level; however, at the CIRC such errors are unrecoverable and a
    disc containing damaged sectors is unsuitable for recording in mode 2. Unreadable
    sectors are destroyed and cannot be recovered at any level. The presence of at
    least one unreadable sector of the disc means the situation is not normal. Therefore,
    either you need to use media of better quality or the CDROM or CD-RW drive is
    malfunctioning. At the same time, the presence of damaged sectors near the end
    of the disc can be tolerated, because in this area there are 150 sectors of lead-out
    area that do not contain any data.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_322_0.png)


    > Fig. 10.22. A Verbatim disc (a), burned on Teac 552E, demonstrates the highest
    burning quality and is ideal for burning in mode 2; the generic medium (b), burned
    on the same drive, has many damaged sectors and isn''t suitable for burning in
    mode 2'
  merge: -1
