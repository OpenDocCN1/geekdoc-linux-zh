  md: '# Chapter 10: Recovering CDs 301


    Using DivX (MPEG-4) provides considerably greater capacity gain, because it compresses
    two Video CDs into one CD-ROM. So why not write MPEG-4 or MP3 in the Video CD
    format? Unfortunately, the situation is not that simple. Most CD burning programs,
    including Nero Burning ROM, carefully check the contents to be written to the
    disc. Having encountered MPEG-4, they either forcibly reencode it to MPEG-1 or
    MPEG-2 or simply refuse to burn a disc. The reasons for such behavior are straightforward:
    A Video CD must correspond to the standard; otherwise, this is no Video CD. Standalone
    Video CD players support discs of strictly defined types. Their intelligence and
    hardware resources are not sufficient for decoding MPEG-4. A personal computer
    is a different matter. Provided that the appropriate codecs are present, PCs can
    play any multimedia format, no matter how this multimedia information was written.


    However, even if you make Nero Burning ROM write disks without unnecessary questions
    and force it to write MPEG-4 and MP3 as a Video CD, this won''t produce any positive
    result because the Windows operating system provides lame Video CD support. A
    "raw" video stream in the "true" MPEG-1 or MPEG-2 format does not satisfy Windows.
    Therefore, the operating system forcibly adds the resource interface format (RIFF)
    header, which explicitly specifies the file format. After such treatment, no format
    would be reproduced, and any attempts at playing MPEG-4 as MPEG-1 or MPEG-2 are
    unlikely to be successful.


    This is a dead end? Not at all. From any difficult situation there is at least
    one way out and sometimes, even several.


    # Solution


    The solution to the mode 2 problem is reduced to writing disks in modes other
    than ISO 9660. The easiest way is to present each file in the form of a standalone
    track and abandon use of the file system. Such disks won''t be readable by the
    built-in functionality of the operating system; however, it is possible to grab
    the contents of such tracks to place them on the hard disk and read them from
    there. The only drawback of such a solution is the impossibility of playing the
    recorded file directly from the disc. This creates certain problems and makes
    Windows users nervous, because they are accustomed to opening every file with
    a click of the mouse without carrying out additional actions. Experienced UNIX
    users, who skillfully work with the command line, batch files, and scripts, take
    the necessary steps without any complaints. Track grabbing can be easily automated
    (later I will explain how),'
