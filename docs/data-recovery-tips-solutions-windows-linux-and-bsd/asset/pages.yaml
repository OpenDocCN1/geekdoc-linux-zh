    | 26 | 2 i_links_count | Number of references to the file |

    | | | (0 - deleted) |

    | 28 | 4 i_blocks | Number of blocks belonging to the file |

    | 32 | 4 i_flags | Various flags |

    | 36 | 4 i_osdl | Operating system-dependent value |

    | 40 | 12 x 4 i_block | 12 DIRECT BLOCKS |

    | | | (references to the first 12 blocks of the file) |

    | 88 | 4 i_iblock | 1x INDIRECT BLOCK |

    | 92 | 4 i_2iblock | 2x INDIRECT BLOCK |

    | 96 | 4 i_3iblock | 3x INDIRECT BLOCK |

    | 100 | 4 i_generation | File generation (used NFS) |

    | 104 | 4 i_file_acl | External attributes |

    | 108 | 4 i_dir_acl | Greater size |

    | 116 | 12 i_osd2 | Operating system-dependent structure |


    The first 12 blocks occupied by the file are stored directly in the inode in the
    DIRECT BLOCKS array (direct blocks are in bold to make the listing more illustrative).
    Each array element is a 32-bit block number. With the average value of the BLOCK
    SIZE equal to 4 KB, DIRECT BLOCK can address up to 4*12=48 bytes of data. If the
    file exceeds this size, one or more indirect addressing blocks are created (INDIRECT
    BLOCK). The hierarchy of indirect blocks is illustrated in Fig. 8.6. The first
    indirect block (1x INDIRECT BLOCK or simply INDIRECT BLOCK) stores the references
    to other indirect blocks. Its address store in the i_indirect_block field in the
    inode. As can be computed, it addresses about BLOCK SIZE/sizeof(DWORD) * BLOCK
    SIZE = 4096/4*MB of data. If this is not enough, the second indirect block is
    created (2x INDIRECT BLOCK or DOUBLE INDIRECT BLOCK), storing the pointers to
    indirect blocks, which allows you to address (BLOCK_SIZE/sizeof(DWORD))**2*BLOCK_SIZE=4096/4**=44
    GB of data. If even this is not enough, the triple indirect block is created (3x
    INDIRECT BLOCK or TRIPLE INDIRECT BLOCK), which contains references to double
    indirect blocks.'
