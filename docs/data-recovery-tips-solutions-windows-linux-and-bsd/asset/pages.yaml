- pgno: 24
  md: '# Chapter 1: Introduction to Data Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_24_0.png)


    **Fig. 1.5.** Another hard disk that was irreversibly damaged (published with
    the kind permission of the owners of the http://www.hdd-info.ru site)


    Every hard disk has a special tuning register that, among other things, specifies
    the number of read attempts, if the sector could not be read at the first attempt.
    It is recommended that you reset it to zero (do not repeat read attempts) or to
    one (if zero is the default value). To discover the settings for an individual
    case, consult technical documentation downloaded from the manufacturer’s Web site.
    A long read returns the entire sector, both the user data and the checksum (on
    small-computer system interface, or SCSI, disks even the the correction codes
    are returned). Different models of hard disks have their own features of implementation
    of this command. Unfortunately, these features are not always documented, and
    it is often necessary to accumulate nuggets of information from the Internet.
    As a variant, it is possible to disassemble the firmware; however, this approach
    requires high qualifications.


    Usually, the sector isn''t destroyed entirely. As a rule, only about 10–20 bytes
    positioned most unfavorably in terms of the correction code are damaged. Even
    part of the sector is better than nothing.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Logical Damages


    All existing file systems, like FAT16/FAT32 or HPFS cannot even be compared to
    NTFS; therefore, I will concentrate on NTFS. This is an extremely reliable file
    system; however, absolute protection is impossible. Catastrophic events of diverse
    types happen now and then.


    In contrast to FAT, NTFS anatomy is undocumented, which means when recovering
    internal data structures you''ll have to rely on information obtained from independent
    hacker sources, such as the source code of NTFS drivers written for Linux and
    disassembled listings of NTFS utilities by Mark Russinovich. However, all of these
    methods are unreliable, and third-party drivers are only partially compatible
    with the newer Windows operating system, with localized zones. Unfortunately,
    alternatives are nonexistent.


    To recover a hard disk containing one or more NTFS partitions, install it as a
    "slave" on the computer where Windows NT/2000/XP, along with all required software,
    has already been installed. In addition, you''ll require Recovery Console. To
