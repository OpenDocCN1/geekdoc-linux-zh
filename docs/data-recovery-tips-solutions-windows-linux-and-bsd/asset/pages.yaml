- pgno: 18
  md: '# Chapter 1: Introduction to Data Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_18_0.png)


    Contemporary operating systems from the Windows NT family and hard disks implementing
    self-monitoring analysis and reporting technology (S.M.A.R.T.) support several
    protective mechanisms aimed at preventing unintentional data corruption. However,
    these mechanisms often turn out to be unable to recover damaged data. The key
    to understanding why this might happen lies in the word unintentional. As a rule,
    users are able to blame for data destruction. They turn their computers into virus
    breeders, carelessly install “no name” software, and manipulate settings they
    do not understand. In other words, they reap what they have sown.


    Is it possible to recover destroyed data? Yes, without a doubt! Joking aside,
    even catastrophic destructions are reversible, either partially or completely.
    It is only a matter of time and qualification (or money if the user is not qualified
    enough). Most normal users are capable of overcoming only minor damage that does
    not involve service structures. In reality, such damage occurs most often. Therefore,
    the techniques of data recovery described here would be enough, at least at the
    beginning.


    However, do not confuse theoretical knowledge with practical skills. I strongly
    recommend that you start accumulating practical data-recovery skills by experimenting
    with hard disks that do not contain anything valuable — that is, anything you
    would be sorry to lose. Never begin your hands-on practice by experimenting'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Part I: Data Recovery Tools


    with valuable and unique data. Like a combat engineer, you have no right to err
    with such data. There are no strictly defined rules in data recovery, and the
    right strategy is not known beforehand. You have lots of ways you can choose;
    hence, only one of them is the right, and all others would result in fatal consequences.
    Data recovery is similar to advancing to your goal in complete darkness. It requires
    you to combine theoretical knowledge, practical experience, and intuition. You
    can master the manual skill, but you cannot purchase the talent; you either have
    it or you don''t. The main goal of contemporary computer science is to reduce
    mastery to the level of a handicraft — in other words, reduce any intuitive operation
    to a predictable sequence of actions that can be carried out by anyone. In recent
    years, computer science and technologies have made considerable advances. Inexperienced
    users have obtained powerful data-recovery tools; however, most users do not know
    how to work with such tools correctly. Hence, most inexperienced users achieve
    deplorable results and ruin their data instead of recovering their information.

    to prevent you from suffering the same result, I will begin from the beginning.


    # Shoveling the Debris


    If your hard disk emits strange sounds, the operating system doesn''t boot, or
    the contents of one or more logical disks has turned into a mess, the best thing
    you can do is immediately turn the computer off and hand it to true professionals.
    If you are inexperienced and try to repair the damaged data on your own, you expose
    your data to a tremendous risk that cannot be justified. This is especially true
    if you attempt the recovery using various automated utilities, blindly relying
    on their intellectual behavior, instead of recovering the data manually.


    On the other hand, unskilled individuals pretending to be professionals using
    the same utilities; therefore, it is in expedient or worse to allow them to torment
    your disk. In this case, you will lose not only valuable data but also money.
    True datarecovery professionals must have a clean room, high-precision equipment
    for replacing the magnetic heads, the ability to expertly answer questions like
    “What is MFT and its difference from $MFT?” and more.


    If there are no professional data-recovery services in your location, you can
    contact a remote data-recovery services. There are two remote data-recovery technologies.
    In the first case, specialists of the chosen company send you an email message
    with an attachment. This holds a special utility that forms the start-up boot
    diskette containing an autonomous terminal service (a kind of telnet). After'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Chapter 1: Introduction to Data Recovery


    booting the computer from this diskette, you can connect to the repair service
    via a modem and pass the remote operator full control of your machine. The main
    disadvantage of this approach is that you''ll have to remain on-line during the
    operator would send and receive the data when trying to recover the mess on your
    machine. The throughput of modern connections is, to put it mildly. Although the
    data recovered are processed locally, and are not sent to the operator directly,
    the traffic still appears mening. Therefore, another approach is mainly used.
    In this case, the operator sends you a program, and this program forms a diagnostic
    test that analyzes the situation and generates the report that must be returned
    to the operator. After that, the operator would send you either a fully-automated
    recovery tool or another diagnostic program. If an Internet connection is not
    available, the data can be passed using either a mail service or a direct modem
    connection.


    In both cases, only the data that has logical damage can be recovered. If the
    hard disk has been damaged physically, it is impossible to repair it over the
    Internet. Nevertheless, because logical damage is encountered more often than
    physical, remote data recovery flourishes.


    If, despite all warnings, you intend to repair the hard disk on your own, there
    are several important recommendations:


    +   - Use faulty hard disks. If you have a shadow of a doubt about some electrical
    or mechanical part of the hard disk, never attempt to recover the data until you
    physically repair that disk.

    - Never install any utilities to the disk to be recovered, and never try to load
    Windows from that disk. Particularly, never run Chkdsk and a defragmenter.

    - Never attempt to read bad sectors more than two or three times per continuous
    bad block until you have read and saved all healthy sectors.

    - Undertake the recovery only when you are of sound mind. In other words, never
    undertake this job immediately after the damage. Wait until the initial shock
    and stress caused by the data loss are over. Calm your feelings and wait until
    you recover from the stress.


    # Physical Damage


    Hard disks are extremely reliable components that care for their own health. As
    a rule, hard disks automatically mark suspicious sectors as bad long before their
    actual destruction. Provided that you treat them with care and observe all recommendations'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'of the disk manufacturer, the chances of encountering physical destruction
    of your information are negligibly small: about 0.1%–1% depending on the quality
    of the disk specimen. However, under the contemporary scale of bulk production,
    no brand has avoided vexing blunders. For example, Cirrus Logic, the subcontractor
    of Fujitsu, once changed the chemical composition of the chip substrate; as a
    result, it began to absorb moisture, promptly disabling the electronics. Two examples
    of damaged hard disk controllers are shown in Figs. 1.1 and 1.2.


    Hard disks from Samsung are famous for their sensitivity to static electricity,
    resulting in rupturing the cache memory chips. After this happens, garbage is
    written to the disk, which irreversibly ruins the service structures of the file
    system, leaving no hope for their recovery.


    If electronic components fail, the controller usually cannot be repaired. As a
    rule, recovery experts purchase a disk of exactly the same model and replace the
    entire controller board. In this case, it is necessary to take into account that
    some manufacturers load the calibration data into the read-only memory (ROM) chip.
    To succeed in the repair, it is necessary to carefully unsolder this chip from
    the faulty controller and solder it to the replacement board. If this has not
    been done, the data will be either unreadable or irreversibly destroyed when the
    disk is first started on the computer, on which it is installed. (More details
    on this topic will be provided in Chapter 4.)


    Under no circumstance should you open the sealed case! Even a single speck of
    dust falling under the read/write head will ruin the disk (Fig. 1.3). As relates
    to the heads, one absurd but popular opinion is widespread among ordinary users.
    They think that the heads are “sealed” and to “unseal” it is necessary to accurately
    shock the disk or sharply rotate it around the axis. When the disks start to rotate,
    the sticky heads are ripped out with the plate. The bearings become wedged so
    rib joint pliers. No rotation in the horizontal plane can help.


    Nevertheless, things rarely come to total failure. As a rule, the damage is limited
    to bad sectors. If you detected such bad blocks, never try to run diagnostic utilities,
    including the ones obtained from the disk manufacturer. For some unknown reason,
    all such utilities, having encountered a bad sector, torture it until final victory,
    inevitably expanding the defect to other sectors and deep into the magnetic layer.
    What’s worse, this might damage the magnetic head, which causes jagged lines in
    the defective zone (Figs. 1.4 and 1.5). Remember that the cure is often worse
    than the defective zone.'
  merge: -1
  img_proc: true
