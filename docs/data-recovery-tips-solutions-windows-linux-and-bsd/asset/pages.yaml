    instead. If AL is zero, the standard write verification

    operation is carried out by default.


    Now, having considered disk interrupts, it is necessary to describe other pro-

    gming issues.


    # Creating the Loader Code


    The choice of programming tool is a matter of personal preference, but in my

    opinion FASM is the best tool for this purpose. From the Assembly language point

    view, the loader is a normal binary file, the maximum allowable size of which
    is

    1BBh (443) bytes. It is too small? Do not rush to premature conclusions. Every
    par-

    tition always starts from the cylinder beginning, which means that there are always

    free sectors per track until the end of the MBR and the start of the partition.

    Practically all contemporary hard disks have 64 sectors per track. This makes

    443 + (63 * 512) = 32.69 KB, or approximately 32 KB. This volume allows

    en to create a great graphical user interface providing mouse support and wallpa-

    ers. However, true hackers are not enticed by this possibility and prefer to work
    in

    t text mode with the command line.


    As mentioned, BIOS loads the MBR at the 7C00h address. Therefore,

    The Assembly code of the loader must start with the CRG 7C00h directive or better,

    still, with USE16, because the loader executes in a 16-bit real mode. Later, if
    desired,

    it can switch to the protected mode; for the moment, do not dig deep.


    Having located the boot partition (it can be detected by the 80h flag located

    at the offset from the partition start), the loader must read the first sector
    of the

    partition and load it into the memory at the 0000:7C00h address — in other

    words, exactly over its body. To avoid a system crash, the

    loader must move its body to another place beforehand. As a rule, this task is
    car-

    ried using the MOVSB command. The target location might be any location in the

    memory, from 0080:0067h to 9FE00h. It is not recommended that you touch the

    memory located below 0080:0067h, because interrupt vectors and BIOS system-

    ram are stored. As relates to addresses A000h and higher, this is the start

    of the area where the ROM is mapped. Thus, the maximum allowed address is

    A000h - 200h (sector size) == 9FE00h.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery 107


    Do not forget that you should not touch the DL register under any circumstances,
    because it is used to pass the number of the boot drive. Some loaders are implemented
    so awkwardly that they load from the first hard disk. What shame their developers
    did not know this. About ten years have passed since BIOS started to allow changes
    to the boot order so that any drive can be the boot.


    As I know, FASM is the only assembler that directly perceives the JMP 0000:7C00h
    far command. All other assemblers require the programmer to use command combinations
    appearing approximately as follows: PUSH offset_target/PUSH segment_of_target/RET.
    These commands push the segment and offset of the target address into the stack
    and then carry out far RET, which jumps to the required location. Also, it is
    possible to use self-modifying code by “manually” assembling the JMP FAR command
    or simply by locating the target address in the segment with the source address
    (for example, 0000:7C00h → 0000:7E00h). However, these approaches are inconvenient
    and tedious.


    In general, the “skeleton” of the loader might appear as shown in Listing 5.8.


    # Listing 5.8. The skeleton of the simplest loader written in FASM


    ```

    use16

    ORG 7C00h

    CLD                 ; Copy from left to right (addresses are growing).

    MOV SI,7C00h      ; Source location

    MOV DI,7E00h       ; Target location

    MOV CX,200h        ; Sector length

    REP MOVSB           ; Copy


    ; Choose the partition from which to boot.

    ; Read it into the memory at the 0000:7C00h address

    ; (see Listings 5.7 and 5.6).


    JMP 0000:7C00h      ; Pass control to the boot sector.

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Writing the Loader into the Master Boot Record


    Under MS-DOS, writing a custom loader into the MBR was a trivial task. To achieve
    this goal, it was enough to use the INT 13h interrupt and call the 03h function
    (sector write). However, under Windows NT this technique doesn''t work; therefore,
    it is necessary to use the CreateFile function. If you specify the name of the
    file to open (for example, \PHYSICALDR0 is the first hard disk), this would allow
    you to easily read and write its sectors using ReadFile and WriteFile calls, respectively.
    At the same time, the dwCreationDisposition flag must be set to OPEN_EXISTING,
    and dwShareMode must be set to FILE_WRITE. In addition, you''ll be required to
    have root privileges; otherwise, you''ll fail.


    An example illustrating the CreateFile call appears as shown in Listing 5.9.


    # Listing 5.9. Obtaining direct access to the hard disk under Windows NT


    ```

    XOR EAX, EAX

    PUSH EAX                               ; tTemplate

    PUSH dword FILE_ATTRIBUTE_NORMAL      ; dwFlagsAndAttributes

    PUSH dword OPEN_EXISTING             ; dwCreationDisposition

    PUSH EAX                               ; lpSecurityAttributes

    PUSH dword FILE_SHARE_WRITE          ; dwShareMode

    PUSH dword (GENERIC_WRITE OR GENERIC_READ) ; dwDesiredAccess

    PUSH DEVICE_NAME                       ; Device name

    CALL CreateFile                        ; Open the device

    INC EAX

    TEST EAX, EAX

    JZ  error

    DEC EAX

    ...

    DEVICE_NAME DB "\\.\.PHYSICALDRIVE0", 0

    BUF RB 512                           ; Buffer

    ```


    Having opened the physical disk, it is necessary to make sure that this operation
    was successful, read the original MBR sector into the buffer, and overwrite the
    first 1Bh bytes without touching the partition table and the 55 AAh signature'
