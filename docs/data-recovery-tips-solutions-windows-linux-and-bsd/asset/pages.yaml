- pgno: 281
  md: 'Generally, the technique for recovering CDs is considerably easier than the
    art of recovering their “relatives” — diskettes and hard disks. On the other hand,
    the Russian proverb “measure seven times before cutting once” still applies. One
    of the most unpleasant features of working with CD-RWs is that you are unable
    to control the writing process as it progresses. Diskettes and hard disks are
    fully transparent in this respect — you get what you write. CD-RWs, on the contrary,
    are a kind of “black box.” You can never be sure that a specific drive will correctly
    interpret the commands passed to it. The recovery of CD-RWs is not a standard
    operation, and any nonstandard manipulation can be interpreted by different drives.
    The only advice that can be given here is as follows: Do not let things take their
    own course. Experiment, experiment, and experiment again. This will allow you
    to accumulate valuable experience that will sometimes be of inestimable help.


    # Invalid File Sizes


    In the time of monochrome terminals and first magnetic disks, there was already
    an ugly but easy protection technique to prevent media from being copied at the
    file level. By changing file structures, protection developers could “ruin” a
    diskette to that point that working with it was only possible provided that the
    introduced changes were taken into account. The protection program, being aware
    of the system errors, could operate with it without encountering any problems.
    Standard built-in utilities of the operating system, on the other hand, failed
    to do so. Note that, at that time, “hacking” copiers were not yet widely available.


    The protection often consisted of several files referring to common clusters.
    In this case, writing data into the same file resulted in its immediate appearance
    in another, which the protection mechanism could use to achieve its purpose. After
    copying the files to another disk, the common clusters were written to different
    locations and the cunning mechanism of implicit data exchange ceased to operate.
    The protected program also ceased to operate. This only happened provided that
    the user managed to copy the disk contents. Copying files with overlapping clusters
    duplicated them in each copied file. Therefore, the file size grew to such an
    extent that the capacity of the entire hard disk was insufficient to store it.
    If the last cluster of the file happened to be “glued” to its starting point (that
    is, the file was looped), both its size and the time required for its copying
    became infinite. “Disk doctors” were already available, but they produce the desired
    result because correction of the file system rendered the protection system unusable'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Chapter 10: Recovering CDs 269


    (for example, in the preceding case with the file looping, if the protection relied
    on the file start following after its end, this technique became inapplicable
    after pressing the disc with the disk doctor utility, with all of the resulting
    consequences).


    The file systems of CDs are different from those used on diskettes. The general
    principles of introducing errors, however, are similar. By increasing the fictitious
    lengths of the protected files by ten times or more, the developer of a protection
    mechanism can raise their total size to hundreds of gigabytes. Thus, to copy a
    protected disc, you''d need at stack of DVDs or a large hard drive. A protection
    mechanism that “remembers” the original lengths of all files can operate with
    without encountering any problems. However, most file copiers won''t understand
    this and will go crazy.


    Going outside of the file limits, in principle, shouldn''t cause any problems.
    CD file systems do not support file fragmentation and, consequently, don''t require
    FAT. Files take a continuous sequence of sectors, and only the two most important
    characteristics are related to any file: the number of the first sector of the
    file, specified in the LBA format, and its length, specified in bytes. All other
    attributes, such as file name and creation time, are of no importance when dealing
    with sectors.


    An increase in the file length captures several sectors adjacent to its tail.
    Provided that the number of the last sector belonging to the file doesn''t exceed
    the number of the last sector of the disc, file copying, will be carried out normally.
    By “in principle” I mean that all other files encountered in the copying process
    will be included into the file being copied. If the number of the file goes beyond
    the limits of the disc, the CD-ROM drive reports an error and stops reading. Standard
    copiers built into the operating system, as well as most third-party tools, automatically
    remove the “tail” of the incompletely copied file from the disk. As a result,
    the user achieves no result.


    The iso960dir.exe utility is advantageous because it allows you to copy not the
    entire file but also part of a file. The problem is deciding how many bytes to
    copy. In other words, how is it possible to determine where the useful data start
    and where the garbage begins begins? To make this decision, it is expedient to
    recall that, according to the standard, the files are stored sequentially on the
    disc, which means that the last sector of one file is directly followed by the
    starting sector of another file. Because starting sectors of all files are known,
    determining actual lengths of all files, except for the last one, won''t be too
    difficult. Because the length of one sector on a CD is 2048 bytes, the actual
    size of any file can be expressed'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'as follows: (starting address of the next file - starting address of the current
    file) * 2048. Everything is simple, isn''t it? Using the iso9660.dir.exe utility,
    I have copied lots of MP3 discs protected by this way.


    # StarForce Turns to Dust


    The forces of evil are encroaching! StarForce protection attacks from all directions,
    and new games cannot be copied any longer. The protection appears as forbidding
    as a rock. It has already become famous for being impossible to crack. However,
    the situation isn''t as hopeless as it seems at first glance. In addition to the
    high road there are alternative, unguarded routes. To achieve the required goal,
    it is possible to use one of them.


    # What Is StarForce?


    Star Force (Fig. 10.3) is a family of protection mechanisms intended to protect
    CDs against unauthorized copying. It binds to the physical structure of the spiral
    track and is equipped with complex antihacking mechanisms. Instead of a primitive
    "friend-or-foe" check, which can be easily cracked by replacing a single JMP,
    this protection converts the topological disc parameters into a number used for
    decryption of the main program body. At the same time, specialized protection
    components ensure that no one can save a dump after decryption.


    Part of the protection code is contained within a protect.dll file of several
    megabytes, part of the code is distributed over the drivers, and another part
    is compiled into the p-code executed under the custom interpreter. All of these
    components implement lots of anti-debugging techniques that prevent both study
    of the protection code and emulation of the original disc.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_283_0.png)


    Fig. 10.3. The StarForce logo, by which this protection can be easily distinguished
    from any other protection'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Chapter 10: Recovering CDs 271


    The protection is constantly evolving and actively enhanced. With the release
    of each new version, the developers make it more sophisticated. The latest releases
    of StarForce are deeply-integrated with the Windows operating system and even
    modify its kernel, as a result of which system becomes unstable. In some cases,
    users lose data, and in other cases the system regularly displays the infamous
    BSOD. Some users complain that after installing updates from Microsoft licensed
    unexpectedly fail to execute, requiring the to install the StarForce update (http://www.star-force.ru/support/sdfruv.zip).
    Sometimes, protected discs fail to be recognized by the system. Developers intend
    to declare that everything is OK with the protection and that users have no one
    to blame themselves.


    Furthermore, requiring the protected CD to run from an IDE drive if one is present
    in the system should be illegal, StarForce requires this for in. I work from the
    SCSI drive; however, there is an ancient 2x-speed IDE CDROM installed in my computer,
    simply to play audio CDs (this drive is no longer capable of playing anything
    else). Who dares to say that I have no right to use such a configuration?


    Any security mechanism for protecting media against copying is extremely unpopular.
    As a rule, self-respecting developers use serial numbers or other reliable algorithms,
    even though they are easy to crack. This is because it is better to suffer financial
    losses from the piracy than to maintain a special support service to respond to
    the complaints of enraged users and immediately correct the problem or return
    money. The cause of the trouble doesn not matter — hardware incompatibility, protection
    defect, or human error. The slogan of every self-respecting developer is “client
    satisfaction above all.” Therefore, no serious software products should ever be
    protected by the StarForce.


    # How Does StarForce Work?


    Banding to the disc is based on the measurement of the angle between sectors.
    A similar technique was used in the time of 8-bit computers. There are other protection
    mechanisms that work in a similar way, as CD-COps and SecureROM, so the StarForce
    idea can hardly called revolutionary. However, this didn''t prevent the developers
    from taking out a patent for it, or at least declare that they have done so. Well,
    instead of legal issues and lyrical digressions, it would be better to discuss
    technical details.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'The CD spiral track is similar to a phonograph record except that it starts
    from the inner edge of the disc instead of the outer one of the record, which
    means that playback proceeds from the inner edge to the outer one. The laser read/write
    head, suspended in the magnetic field (similar to the way a voice coil is supported
    in acoustic systems), moves on slide rails across the spiral track. The track
    consists of sectors containing data and subcode channels spread over the spiral
    track. The number of sectors are located both in the headers of the sectors and
    in the subcode channels. For rough positioning of the head over the required sector,
    the slide rails and subcode channels are used, and for fine adjustment the sector
    headers and deviation in the magnetic field are employed.


    It is impossible to simply measure the structure of the spiral track; however,
    it is possible to employ the following approach (Fig. 10.4). Assume that the head
    reads sector X and then sector Y. If the XOY angle, formed by the two rays originating
    from the disc center (O) and passing through the X and Y sectors, is approximately
    15 degrees, and the sectors in question are located in neighboring turns of the
    spiral track. In this case, it would be enough for the drive to deviate the head;
    after a fraction of a second, the Y sector would become immediately unavailable
    to it because the disc is rotating. If the angle between sectors is smaller than
    15 degrees, then during the time required to move the head the Y sector will move
    far away and the drive will have to wait for the CD to spin around.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_285_0.png)


    Fig. 10.4. If the angle between the X and Y sectors is approximately 15 degrees,
    the Y sector will be immediately available to the head when moving to the next
    turn (left); however, if the angle is smaller, the drive must wait for the CD
    to spin around'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Chapter 10: Recovering CDs 273


    ![](img/1ce3cead9a6814cc94d1e00101c20220_286_0.png)


    Fig. 10.5. The Bus Hound utility at work


    Thus, by measuring the read time for different pairs of sectors it is possible
    to approximately determine their positional relationship on the spiral track.
    This relationship differs for different disc lots (because the density of sectors
    per millimeter and the spiral steepness differs from lot to lot). To avoid prefetching,
    characteristic for most drives, the protection must read sectors in descending
    order. It must also measure the drive rotation speed to determine whether the
    time measurement is stable and correct the formula for computing the angle because,
    as can be easily shown, the faster the disc speed, the sooner the sector will
    be out of reach.


    StarForce behaves exactly this way. Figure 10.5 shows the protection operation
    log, traced by the Bus Hound utility. Note that in this example, the SCSI drive
    was used; programmatic tracing is of no use when working with IDE because the
    protection works with it directly.


    First the protection profiles the surface and determines the time required for
    one turn. Then it evaluates the measurement dispersion, based on which it would
    determine the deviation tolerance for the key disc characteristics. The results'
  merge: -1
