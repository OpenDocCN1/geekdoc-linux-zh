    Between the descriptor of the cylinder group and the descriptor of the inode group
    is a bitmap of occupied inodes and the map of the free disk space. These are ordinary
    bitmap fields, the same as in NTFS. When recovering deleted files, it is impossible
    to do without these bitmaps. They separate the wheat from the chaff and considerably
    narrow the search range. This is especially noticeable on disks that are more
    than 50% full.


    The bitmaps are followed by the array of inodes, the offset of which is contained
    in the cg_iusedf field (the address of the first group of inodes is duplicated
    in the superblock). In essence, the inode structure in UFS doesn''t considerably
    differ from the similar structure in ext2fs; only the field order is different.
    In addition, there is only one direct addressing block instead of the three blocks
    existing in ext2fs. However, these are minor technical details. I won''t consider
    them here for the declared goals are of little importance. Consider the fundamental
    fields, the list of which includes the following:


    +   - Number of references to the file (0 means that the file has been "deleted")'
