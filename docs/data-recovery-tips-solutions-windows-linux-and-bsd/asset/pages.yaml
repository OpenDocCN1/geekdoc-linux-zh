    In the course of scanning, the program will find all surviving files (deleted
    and not) and recover the directory structure including the root directory (Fig.
    7.8). How would it do this? Recall that in the course of formatting the root directory
    was destroyed and recreated. Here is one of the advantages of NTFS, famous for
    its reliability. In contrast to FAT, NTFS directories are only auxiliary data
    structures to speed up displaying of their contents. Each file record, no matter
    what its origin be, contains the reference to the parent directory, which represents
    the number of the MFT record. The location of the root directory record is always
    the same.


