- pgno: 311
  md: 'time, EFM words cannot follow closely one after another — just consider what
    would happen if an EFM word terminated by logical one is followed by another EFM
    word starting with one. Therefore, EFM words must be separated by three merging
    bits. Thus, to store every 4 bits of the source data it is necessary to have 9
    physical bits. The standard modulation method is not an ideal one, and it leaves
    a considerable reserve for further improvement (see "RESERVE-6 or Extra Capacity
    Reserves" later in this chapter).


    The minimal portion of data directly addressed at the software level is a sector
    (or block, in audio CD terminology). One block is made up of 98 frames, each of
    which, in turn, contains 24 bytes of user data, 8 bytes of Reed-Solomon codes,
    often called cross-interleaved Reed-Solomon codes (CIRC), 3 sync bytes, and 8
    bits of subchannel channels — 1 bit per subcode, conventionally designated by
    the P, Q, R, S, T, U, V, and W characters. The Q channel stores information about
    the disc layout, the P channel is used for quick search for pauses, and all other
    channels are free.


    Thus, effective capacity of a single block is 2352 bytes, or even 2400 bytes when
    taking into account subchannel channels (34 bytes of every 98 of subchannel channels
    are allocated for internal needs). Reed-Solomon error-correction codes correct
    up to 4 damaged bytes per frame, which makes 392 bytes per block.


    Data discs (CD-Data) that originated from audio discs support two main data-processing
    modes: mode 1 and mode 2.


    In mode 1, 2048 bytes of the 2352 of the raw sector capacity are allocated directly
    for storing user data. Other bytes are distributed among the header (16 bytes),
    the sector checksum (4 bytes), and additional correction codes that increase the
    disc''s resistance to physical defects (276 bytes). The remaining 8 bytes are
    not used and normally are initialized to zeros.


    In mode 2, of the 2352 bytes of the raw sector capacity, only 16 bytes are located
    for the service structure (header); the remaining 2336 bytes store user data.
    As can be seen, when the disc is written in mode 2, its effective capacity becomes
    approximately 15% greater; however, the data storage reliability also lowers by
    approximately 33%. Nevertheless, if you use high-quality media, such as from LG
    Electronics, TDK, or Verbatim, and store them carefully, the risk of irreversible
    data destruction is relatively low (see the "Testing Discs for Reliability" section
    later in this chapter). In addition, lots of data formats tolerate even damage
    to a medium or tolerate high levels of damage. These are DivX, MP3, JPEG, and
    many other types of files. With a certain level'
