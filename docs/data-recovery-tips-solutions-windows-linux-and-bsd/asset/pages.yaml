    changes to the speed, and not all of them are capable of reading problematic discs.
    Thus, you''ll have to experiment with different drives. Try to read the disc on
    some-one''s drive.


    The chance of success is low. What should you do in case of failure? Practice
    has shown that there are two main reasons become unreadable: decay processes in
    the active layer and surface scratches. Consider the first active layers, whereas
    contrast irreversibly decays with time. What can be done to solve this problem?
    The way out is barbaric and simple—increase the laser power. This method is brutal,
    but there are no other ways. The laser won''t last long in this mode of operation;
    nevertheless, before dying it might succeed in reading something. Drives of previous
