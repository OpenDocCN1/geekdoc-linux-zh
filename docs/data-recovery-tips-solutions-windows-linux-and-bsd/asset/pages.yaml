    distributions available for downloading.


    +   - KNOPIX 3.7 — From my point of view, this distribution is the best one. It
    is based on GNU/Debian. The distribution set requires only one disc to burn, yet
    it includes everything that might be needed: disk utilities and compilers to office
    software and multimedia applications. It is fast and requires less than 128 MB
    of RAM (the amount of RAM at your disposal is smaller, you can rely on the swap
    file). In 2004, O''Reilly published an excellent book — KNOPIX Hacks — that contains
    chapters concentrating on data recovery issues. KNOPIX can be downloaded from
    the Internet (for example, from http://www.knopix.net/get.php).


    +   - Fenzy 0.3 — This distribution is set on FreeBSD. It includes a small number
    of disk utilities oriented toward ext2fs, although the main file system used by
    BSD is Unix file system/fast file system (UFS/FFS) and support for ext2fs is limited.
    Nevertheless, this disc is suitable for recovery operations and can be recommended
    to every BSD fan.


    +   - SuSE 9.2 — This is a poor distribution (in my humble opinion). It takes
    two discs (one with the K Desktop Environment, or KDE, and another with the GNU
    Network Object Model Environment, or GNOME). It requires no less than 256 MB of
    RAM (although the KDE version starts with 220 MB). It is slow and doesn''t contain
    anything useful except for some bits of office applications.


    # Choosing Media for Copying


    The days when the hard disk to be recovered could be copied into a pack of diskettes
    have long gone. The procedure of data recovery has become considerably more complicated.
    Today, CD and especially DVD recorders are good options, and a package containing
    a dozen discs is enough to copy the contents of any hard disk of a reasonable
    size. Unfortunately, there are currently no decent MS-DOS programs for CD and
    DVD burning, and it is unlikely that they will appear in the future. The existing'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Chapter 2: Essential Tools 27


    utilities (including their console implementations) require Windows PE or Bart
    PE Builder, which is unable to mount destroyed NTFS disks. On some of them, the
    NTFS driver hangs or ever crashes into the BSOD.


    The standard Recovery Console, NTFSDS Professional, and Active@Data Recovery Boot
    Disk only support diskettes and IDE drives. What''s more, demo versions of the
    two latter tools require the target disk to be formatted for FAT16/FAT32, and
    its maximum size must not exceed 8 GB. If you need to recover a larger disk, you
    have to copy its contents sequentially onto several hard disks. Needless to say,
    this is an expensive solution. Unfortunately, there are no cheap so-l in the field
    of data recovery.


    # Disk Editors


    True professionals recover the destroyed disk structures directly in a disk editor,
    instead of relying on automated utilities (except for custom ones they have developed
    on their own). This is because no one can tell what dirty trick commercial recovery
    tools might play on the user. Thus, I recommend that you proceed the same way,
    paying the most attention to manual recovery. Because the disk editor is going
    to be your main tool, this must be an excellent editor with a convenient interface;
    otherwise, data recovery will become a torture of being an interesting and absorbing
    job.


    The famous Norton Editor, or DiskEdit (see Figs. 2.2 and 2.3), from Symantec is
    the best editor created in the history of the IBM PC, and it hasn''t been outperformed
    by any other tool. Convenient navigation, viewing internal service structures
    in their readable form, and powerful text-search capabilities have extremely simplified
    the recovery procedure and relieved recovery professionals from all routine tasks.
    The veteran remains in the ranks of the Army. Of course, it doesn''t start under
    Windows NT; however, it works excellently under MS-DOS and Windows 9x, inheriting
    all limitations imposed by BIOS on the maximum allowed disk size (8 GB). It should
    be mentioned, however, that any attempts at recovering the disk from a multitasking
    environment such as Windows 9x might cause results quite opposite of the expected
    ones. Nevertheless, this doesn''t relate to NTFS partitions. Windows 9x doesn''t
    support NTFS and doesn''t write anything on partitions formatted for this file
    system.'
  merge: -1
  img_proc: true
