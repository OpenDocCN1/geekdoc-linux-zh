    indirect blocks


    In comparison to the storage method of NTFS, such a method of information storage
    is considerably simpler; however, its space requirements are considerably greater.
    Nevertheless, it has an indisputable advantage over NTFS. Because all references
    are not packed, for each block of the file it is easy to quickly find the corresponding
    indirect block, even if the inode is destroyed.


    The file name is not stored in the inode. To find it, search for the required
    name in directories that represent an array of records appearing as shown in Listing
    8.6.


    # **Listing 8.6.** The format of the directory array representation


    | Offset | Size | Description |

    | --- | --- | --- |

    | 0 | 4 inode | ; Reference to the inode |

    | 4 | 2 rec_len | ; Length of the current record |

    | 6 | 1 name_len | ; Length of the file name |

    | 7 | 1 file_type | ; File type |

    | 8 | ... name | ; File name |'
