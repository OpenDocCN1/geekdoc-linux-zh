- pgno: 190
  md: '# Chapter 7: NTFS Data Recovery 177


    ![](img/1ce3cead9a6814cc94d1e00101c20220_190_0.png)


    Fig. 7.5. Formatting a virtual disk in the VMware environment


    I do not recommend that you experiment on a “live” hard disk (at least until you
    gain the required skills in the field of recovery). If you do not have a virtual
    machine, it is possible to use a Zip drive (which, by the way, is often more reliable
    than a CD drive) and format Zip diskettes for NTFS (fortunately, the built-in
