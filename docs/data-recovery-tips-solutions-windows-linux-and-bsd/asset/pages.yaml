    # Sources of Menace


    Why do disk partitions become lost? The following is a list of the most common
    reasons, given in descending order according to their “popularity":


    +   - Human errors, viruses, Trojans, and other malware

    - Unexpected power failures, system freezes in the course of intense disk operations
    accompanied by MFT updates (such as adding or removing files or directions)

    - Incorrect behavior of various disk utilities, such as Partition Magic, Ahead
    Nero, and Norton Disk Doctor

    - Physical defects of RAM, resulting in violation of disk cache integrity and,
    consequently, in damage to the disk

    - Incorrect behavior of privileged-level drivers, intentionally or unintentionally
    damaging the auxiliary structures of the NTFS driver


    # Useful Tips


    To prevent volume destruction and simplify the data recovery procedure, you are
    recommended to carry out the following steps before:


    +   - Move the *SMFT* file as far as possible from the start of the partition.
    The starting sectors of the partition (Fig. 7.12), in effect, are the most dangerous
    place on the entire'
