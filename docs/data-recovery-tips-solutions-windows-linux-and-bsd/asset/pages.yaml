  md: '# Bootable Windows CDs and Diskettes


    Diagnostic and recovery tools located on the basic hard disk are suitable for
    educational purposes only. For real-world data recovery, they are practically
    useless. Even if the failure is not enough to prevent Windows from booting, attempts
    at healing the disk in multitasking environments might produce unpredictable results.
    Thus, by writing anything on your disk that bypasses the file system driver, you
    expose your data to a serious risk. Assume that you are recovering deleted file
    and simultaneously updating MFT the inner sanctum of NTFS. At the same time, the
    system is creating or deleting another file, accessing the same sector. And What
    would be the result? The file you are recovering and, probably, the entire volume
    would be ruined. The system would block active executable files and data files,
    which makes their recovery impossible even if you have a backup copy. The same
    is true for such operations as removing viruses. Most viruses, having infected
    the system, block the start-up of antivirus programs or expertly conceal their
    presence, thus preventing antivirus scanners from detecting or deleting them.
    Furthermore, if Windows ceased to boot as a result of the failure, you will be
    left with nothing.


    The main advantage of FAT16/FAT32 over NTFS is the possibility of booting from
    the system disk. MS-DOS 7.0 supports long file names, allowing you to copy from
    the disk being recovered all files available to the standard file system driver
    of the operating system. This approach won''t work with NTFS. Nevertheless, you
    can install the disk being recovered as a slave into a computer that runs usable
