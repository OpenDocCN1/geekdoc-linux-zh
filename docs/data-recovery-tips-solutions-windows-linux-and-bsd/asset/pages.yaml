    Fig. 5.1). Clearly, this was not sufficient; however, it was impossible to extend
    the partition table because the last record was adjacent to the end of the sector.
    Developers did not want to use the next sector because it was actively used by
    many viruses and nonstandard drivers. Besides this, such an approach did not solve
    the problem; it only delayed an inevitable end. Therefore, another solution was
    found. Engineers introduced the concept of extended partitions. If the Boot ID
    value of a certain partition is equal to 05h or 0FH, it is interpreted as a “virtual
    physical disk” with its own partition table located in its beginning and pointed
    to by the starting sector of an extended partition (Fig. 5.2). In other words,
    the partition table becomes, and the nesting level is limited only to the available
    disk space and the amount of stack memory of the loader (that it uses the recursive
    scanning algorithm). The partition table is “spread” over the entire disk (Fig.
    5.3). Most backup utilities use only the first sector, which is obviously not
    enough. The first sector, however, is damaged more often than the others one;
    therefore, the bad backup policy is better than nothing.


    Standard partitioning utilities, such as fdisk.exe and Disk Manager, create one
    primary and extended partition in every partition table. Thus, if you need to
    partition your disk into four logical drives, you will have four partition tables
    (Listing 5.4), although in this case it is possible to do with one. The standard
    loader of fdisk.exe requires the active partition to be located in the first sector
    of the partition table; therefore, the operating system can be booted only from
    the C: disk. Nonstandard managers that allow the chain of partitions allow you
    to boot from any partition. The most honest ones create another partition in the
    first partition table (if the disk was partitioned using fdisk.exe, there is always
    free space there), mark it active, and place their body there. Others implant
    themselves directly into the MBR, thus replacing the master boot code, which results
    in compatibility problems.


