- pgno: 230
  md: '# Chapter 8: Data Recovery under Linux/BSD 217


    # Recommended Reading


    +   - "Design and Implementation of the Second Extended Filesystem" — A detailed
    description of the ext2fs file system from the project developers. Available for
    downloading at http://e2fsprogs.sourceforge.net/ext2intro.html.


    +   - "Linux Ext2fs Undeletion Mini-Howto" — Brief but clear instructions related
    to the recovery of deleted files on ext2fs partitions, available at http://www.tld.org/HOWTO/Ext2fs-Undeletion.html.


    +   - "Ext2fs Undeletion of Directory Structures Mini-Howto" — A brief manual
    on recovering the deleted directories on ext2fs partitions, available at http://www.faqs.org/docs/Linux-mini/Ext2fs-Undeletion-Dir-Struct.html.


    +   - "How-Undelete" — Another manual related to the recovery of deleted files
    on ext2fs partitions using ide: http://lde.sourceforge.net/UNERASE.txt.


    # Recovering Deleted Files under the UNIX File System


    The UNIX system (UFS) is the main file system for BSD and is installed by default.
    Most commercial UNIX versions also use UFS or something much like it. In contrast
    to ext2fs, which is well documented, UFS is superbly described in available literature.
    The only source code is a reliable source of information about this file system,
    and knowing to its particulars is not an easy task. There are lots of utilities
    that recover destroyed data (or at least attempt to do so); however, in practice
    all such tools turn out to be unusable. It''s no wonder: Automated recovery of
    deleted files is principally impossible on UFS. Nevertheless, this goal can be
    achieved manually, provided that you know how.


    # History


    UFS is the descendant of s5 — the first file system written for UNIX as early
    as 1974. The s5 file system was extremely easily organized and slow (according
    to some sources, its performance was only about 2% to 5% above the raw performance
    of the naked disk). Nevertheless, it already contained the concepts of superblock,
    inodes, and data blocks.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    During work on the 4.2 BSD distribution set, which was released in 1983, the original
    file system was slightly improved. The list of extensions included long file names,
    symbolic links, and so on. This is how UFS was born.


    In 4.3 BSD, released the next year, the improvements were more radical and revolutionary.
    There appeared the concepts of fragments and cylinder groups. The operating speed
    of the file system was improved considerably, because of which it obtained its
    name — fast file system (FFS).


    All further releases of the 4.x BSD product line included FFS. The file system
    was modified again. To support larger disks, it became necessary to increase the
    width of all address fields: 32-bit fragment numbering was replaced by 64-bit
    numbering. Other improvements were introduced, although they were less significant.


    In effect, there are three different file systems that are incompatible with each
    other at the level of the basic data structures. Nevertheless, for example, the
    “Little UFS2 FAQ” states that UFS (and UFS2) define on-disk layout. UFS sits on
    top of UFS (1 or 2) provides directory structure information and a variety of
    disk-based optimizations. The point is that if you look into the source code of
    the file system, you’d discover two subdirectories — /ufs and /fs. The /fs subdirectory
    contains the definition of the superblock, the basic structure responsible for
    data layout, and /ufs contains definitions of the inode and directory structure,
    which refutes the preceding statement (according to which, the situation should
    be the opposite).


    To avoid terminological confusion, I will interpret UFS and UFS2 as the main 4.5
    BSD file system.


    # UNIX File System Structure


    In general, UFS is much like ext2fs. It has the same inodes, data blocks, files,
    and directories. However, there are also differences. In ext2fs, there is only
    one group of inodes and one group of blocks for the entire partition. In contrast,
    UFS divides the partition to the several zones of approximately equal size, called
    cylinder groups. Each zone has its own group of inodes and its own group of data
    blocks in all other zones. In words, inodes describe the blocks of only one zone,
    namely, the one to which they belong. This improves file system performance, because
    the head of the hard disk makes shorter movements. In addition, this'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'simplifies the procedure of data recovery in case of minor damage, as practice
    has shown, only the first group of inodes is destroyed as a rule. It is hard to
    imagine what might happen to the hard disk to ruin all groups. Possibly, this
    could be achieved only by placing the disk under a hydraulic press.


    The diagram comparing the s5 file system and UFS is presented in Fig. 8.9. In
    UFS, every block is divided into several fixed-size fragments, preventing the
    loss of free space in the tails of files. As a result, using large blocks doesn''t
    seem wasteful. On the contrary, it improves performance and prevents fragmentation.
    If a file uses more than one fragment in two discontinuous blocks, it is automatically
    moved to another position, into a less-fragmented region of free space. Thus,
    file fragmentation in UFS is either negligible or there is no fragmentation. This
    considerably simplifies the recovery of deleted files and destroyed data.


