  md: '# Chapter 5: Basic Concepts of Manual Data Recovery


    After you issue the FDISK MBR command or install an operating system that automatically
    replaces the standard master boot loader with a custom one, this loader will not
    detect any active partition for booting. It will then burst into a stream of swear
    words. Such behavior is typical for Windows 98 in particular. To solve the problem,
    either restore the original loader or install the operating system on a primary
    partition and mark it using fdisk.exe.


    Boot from the system diskette (from another hard disk or from a bootable CD) and
    check whether your logical disks are visible. If yes, you can easily proceed with
    the further steps; otherwise, summon your courage and prepare to work with your
    hands and use your gray cells.


    In most cases, the primary partition created by fdisk.exe or Disk Manager is easily
    recovered. Other partitions usually not even require recovery, because the MBR
    is damaged most often. Extended partitions distributed over the disk usually lost
    only when someone explicitly deletes partitions using fdisk.exe or Disk Manager.


    The address of the starting sector of the first logical disk is always equal to
    0/1/1 (CHS). The relative sector is the number of hard disk heads minus one (information
    about disk geometry is available from any disc editor, including Sector Inspector).
    The task of determining the last sector is more difficult. If the boot sector
    is not damaged (see “Technique of Boot Sector Recovery”), then it is possible
    to determine the total number of sectors in the partition by increasing the value
    of the BootRecord.NumberSectors field by. Then the final cylinder will be equal
    to LastCyl := TotalSectors/(Heads*SecTrack), where Heads is the number of heads
    on the physical disk and SecTrack is the number of sectors per track. The last
    head number is equal to


    ```

    LastHead := (Total Sector - (LastCyl*Heads SecTrack))/SecTrack,

    and the last sector is equal to ==

    ```


    ```

    LastSec := (Total Sector - (LastCyl*Heads SecTrack)) % SecTrack.

    ```


    Write the obtained values into the MBR and check whether another partition follows
    the computed end of the partition. This must be an extended partition table or
    a boot sector. If this is the case, create another record in the partition table
    and fill it as appropriate.


