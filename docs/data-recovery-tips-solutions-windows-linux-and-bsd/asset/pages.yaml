- pgno: 95
  md: '82 Part II: Automated and Manual Hard-Disks Data Recovery


    reported by the device and printed on a label are always virtual. It is not possible
    to obtain information about the true state of affairs.


    IDE disks have a built-in integrated controller, making them less dependent on
    the external world and easy to migrate from computer to computer. Such migration
    is possible only if BIOS behavior is correct (this topic will be covered later).
    Some disks support a special ATA command — Initialize device parameters. This
    command determines the current geometry of the disk, the chosen number of heads
    and number of sectors per track. The controller computes the number of cylinders
    on its one, based on the total disk size. By the way, the disk size can be changed
    programmatically using the SET MAX ADDRESS ATA command. Some drivers and BIOS
    implementations change geometry so that it becomes strictly bound to them. Such
    disks won''t work in any environment — at least, until the correct geometry is
    set.


    The situation with SCSI devices is considerably worse, because the disk will work
    only with the controller, under which it was formatted. Different controllers
    use different translation methods; therefore, connecting the disk to an incompatible
    controller will "mix" the sector in an unpredictable manner. The disk editor will
    still work with such disk, with built-in tools of the operating system, as well
    as disk doctors, will inevitably fail to do so.


    Advanced controllers automatically replace sectors, either storing information
    in their nonvolatile RAM or saving it in the spare sectors on the disk, which
    are reserved for this purpose. This binds the disk to its controller even more
    strongly, although some SCSI disks carry out sector partitioning on their own.
    Thus, the failure of a SCSI controller is equal to the failure of the entire hard
    disk. Never purchase controllers from unknown manufacturers, because such companies
    go bankrupt any time and new controllers will be supplied. SCSI controllers integrated
    into motherboards are the worst things that can be encountered. They are unreliable
    and incompatible — but what did you expect for such a price?


    The most difficult situation is with RAIDs, where the translation method is entirely
    defined by the controller. RAID 1 arrays, also known as mirror sets, typically
    be moved to any other controller or connected to bypass it. Arrays of all other
    levels (especially RAID 3 and RAID 5) usually refuse to work on controllers of
    other types. Software implementations of RAID mounted in Windows NT contain information
    on their geometry in the system registry. Consequently, they cannot be moved into
    other systems directly. Windows NT reinstallation, as well as a system crash,
    destroys the software RAID. Fortunately, this loss is reversible.'
