- pgno: 139
  md: '# Useful Tip


    How is it possible to quickly recognize the file system type of the current partition
    — FAT or NTFS? This is easy: Just try to create a file named SMFT in its root
    directory. If the file system type is FAT, you''ll succeed; if it is not, you''ll
    fail. If you can successfully create a file named EXTEND, then the NTFS version
    is 3.0 or higher.


    # NTFS from a Bird''s-Eye View


    The volume is the main element of any file system. In FAT, it is the same as a
    partition, which was described in the previous chapter. NTFS supports volumes
    that comprise several partitions (Fig. 6.1). The method of mapping volumes to
    partitions will be covered in detail in the next chapter. For the moment, simply
    consider a volume to be a formatted partition (which means it contains service
    structures of the file system).


    Most file systems interpret a volume as a set of files, free disk space, and auxiliary
    file system structures. In NTFS, however, all auxiliary structures are represented
    by files, which typically can reside in any location of the volume and can even
    be fragmented if necessary.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_139_0.png)'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Chapter 6: New Technology File System — Inside and Out 127


    The most important auxiliary file is $MFT — the master file table — a specialized
    database storing information about all files of the volume, including name, attributes,
    and location on the disk. Directories are also special files, containing lists
    of files and subdirectories stored within them. It is important to point out that
    MFT files contained in all directories and subdirectories of a volume; therefore,
    the presence of the $MFT file is sufficient to recover a damaged disk.


    All other files, called metafiles, or metadata, are intended for auxiliary tasks
    only for the file system. The most important metafiles include $LogFile (a transaction
    log), $Bitmap (a map of free and occupied disk space), and $BadClus (a list of
    bad clusters). More details about these metafiles will be provided later in this
    chapter, in the “Aims of Auxiliary Files” section. Current Windows versions access
    to auxiliary files from the application level (even for users with administrative
    privileges). Any attempting at creating or opening such a file in the root directory
    will inevitably fail.


    The classical definition of a file, a record stored on a disk. Most file systems
    introduces the concept of file attributes — auxiliary characteristics providing
    information such as file creation time and access rights. In NTFS, the file name,
    its data, and its attributes have equal rights. It is possible to say that every
    NTFS file is a set of attributes, each stored as a stream of bytes. Therefore,
    to avoid confusion, attributes storing file data are often called streams.


    Every attribute contains a body and a header. Attributes are classified as resident
    and nonresident. Resident attributes are stored directly in $MFT, which reduces
    disk space and access time. Nonresident attributes store in $MFT only the header,
    describing the location of that attribute on the disk (see the “Data Runs” section
    later in this chapter).


    The goal of each specific attribute is defined by its type — a 4-bit hex value.
    If desired, an attribute can be assigned a name, consisting of characters valid
    for the appropriate namespace (see the “Namespaces” section later in this chapter).
    Most files have at least three attributes consisting of standard information about
    that file (creation time, modification time, last access time, access rights,
    and so on) stored in a 10h-type attribute canonically called $STANDARD_INFORMATION.
    Early versions of Windows NT allowed attributes to be accessed by their conventional
    designations; however, Windows 2000 and Windows XP lack this possibility. The
    full file name (not to be confused with the path name) is stored in a 30h-type
    attribute ($FILE_NAME). If the file has one or more alternative names (for example,'
