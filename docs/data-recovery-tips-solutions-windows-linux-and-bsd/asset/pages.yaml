  md: '# Chapter 6: New Technology File System — Inside and Out 155


    beginner will have spend several months gaining the skills and knowledge required
    to create something. Is it possible to get a jump start? It is NTFS, the main
    file system under Windows XP, contains streams, also known as extended attributes.
    Within a file, there may exist several independent data streams (Fig. 6.4).


    The name of the stream is divided from the file name by a colon: my_file:stream.
    The main body of the file is stored in an unnamed stream; it is also possible
    to create new streams. Start FAR Manager, press <Shift>+F4>, enter the file name
    and stream from the keyboard (for example, xxx:yyy), and feed some text to the
    editor. Exit the editor, and you will see the file name xxx with zero length.
    Why is this so? Where is the text that you have entered? Press <F4>, and you won''t
    see anything. Everything is correct! If the name of the stream is not specified,
    the file system displays the main stream, and in this case the main stream is
    empty. The sizes of other streams are not displayed; to reach their contents,
    the stream name must be explicitly specified. Enter from the command line the
    more < xxx:yyy command, and you will see the text that you have entered.


    Because the creation of additional streams doesn''t change the apparent size of
    the file, a virus inserted into an additional stream probably will not be noticed.
    To pass control to that stream, the main stream has to be modified. The checksum
    will inevitably change, and antivirus monitors will not like this. The problem
    with checksums and antivirus monitors will be covered later in this chapter. For
    the moment, it is necessary to concentrate on the insertion strategy.


