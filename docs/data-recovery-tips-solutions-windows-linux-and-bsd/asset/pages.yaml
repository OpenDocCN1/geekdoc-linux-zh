  md: '# Chapter 6: New Technology File System — Inside and Out 133


    The best practice comes from experimenting with a disk containing a small number
    of files and directories. To avoid formatting a logical disk, create a virtual
    one (for-tunerately, the amount of RAM on contemporary computers provides this
    possibility.


    # File Records


    With the DiskExplorer utility from Runtime Software, you will rarely need to work
    with file records manually. Nevertheless, knowledge of their structure will be
    useful.

    The structure of a file record includes the header and one or more attributes
    of an arbitrary length, followed by the end marker — the 4-byte hex value FFFFFFFF
    (see Listing 6.1). Although the number of attributes and their lengths vary from
    record to record, the size of the FILE Record structure is fixed — in most cases,
    at 1 KB (this value is stored in the Boot file, which shouldn''t be confused with
    the boot sector). This being so, the first byte of the file record always coincides
    with the start of the sector.


    If the actual length of attributes is smaller than the size of the file record,
    its tail remains unused. If the attributes do not fit within the space allocated
    for them, then an extra file record is created, which refers to its predecessor.


    # Listing 6.1. The FILE record structure


    ```

    FILE Record

    Header ; Header

    Attribute 1 ; Attribute 1

    Attribute 2 ; Attribute 2

    ... ; ...

    Attribute N ; Attribute N

    End Marker (FFFFFFFF) ; End marker

    ```


    The starting 4 bytes of the header are occupied by a magic FILE sequence, signaling
    that you are dealing with the file record. When recovering a strongly fragmented
    SMFT file, this circumstance plays an important role because it allows you to
    distinguish sectors belonging to MFT from all other sectors.


    This signature is followed by a 16-bit pointer containing the offset of the update
    sequence (see the “Update Sequences” section later in this chapter). In this section,'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 134 Part II: Automated and Manual Hard-Disks Data Recovery


    the term pointer should be interpreted as the offset from the sector in bytes,
    counted from zero. In Windows NT and Windows 2000, this field is always equal
    to 002AH; therefore, to search for file records, it is possible to use the FILE\x00
    signature, which reduces the probability of false negatives. However, in Windows
    XP and later operating systems, update sequences are stored at the 002Dh offset;
    therefore, the signature looks as follows: FILE-\x00.


    The header size (which varies from system to system) isn''t explicitly stored
    anywhere. Instead, the header contains the pointer to the first attribute, specifying
    its offset from the start of the file record, located at the offset 14h bytes
    from the sector. Offset of all further attributes (if there are any) are determined
    by adding the sizes of all previous attributes (the size of every attribute is
    specified in its header) to the offset of the first attribute. The end of the
    last attribute is indicated by the end marker — FFFFFFFF.


    In addition, the file record length is stored in two fields. The first is the
    32-bit real size field located at the offset 1bh bytes from the sector, containing
    the total size of the header, all its attributes, and the end marker, rounded
    by the 8-byte boundary. The second is the 32-bit allocated size field, which is
    located at the offset 1ch bytes from the sector and contains the actual size of
    the file record in bytes, rounded by the sector size. The Linux-NTFS Project documentation
    (version 0.4) states that the allocated size must be a multiple of the cluster
    size. In reality, however, this isn''t so. On my computer, the allocated size
    is a quarter of a cluster.


    The 16-bit flags field located at the offset 16h bytes from the sector takes one
    of the following three values: 00h, meaning this file record isn''t used or its
    associated file or directory has been deleted; 01h, meaning this file record is
