    one. Nevertheless, the original /$BITMAP file can be restored using ChkdSk.


    +   8. The new transaction file, /$LogFile, is created. I won''t describe its
    structure in detail because its detailed description can be found in the NTFS-Linux
    Project.


    +   9. The new $LogFile sequence number is added to the header of the $MFT file
    record.


    +   10. $MFT is assigned a new sequence number.


    +   11. A new $MFTmir file is created, irreversibly overwriting the original one
    (in the newer versions of Windows, it is located in the middle of the NTFS partition).
