- pgno: 79
  md: '# Part I: Data Recovery Tools


    After the catastrophic failure of a hard disk, in most cases it is still possible
    to recover the data stored there, provided that you follow the right plan. If
    you haven''t developed such a plan, then it would be much better to immediately
    refuse to heal or correct the disk. Unskilled recovery attempts can often only
    complicate the recovery procedure, sometimes making it practically impossible.
    Specialists of service centers do not recommend that users undertake recovery
    and repair operations. If unskilled users do not follow this advice, they''ll
    have to pay doubled or even tripled prices. In the worst case, a service center
    might refuse to carry out a repair. Note that this policy is not adopted because
    service centers are merely wary of users doing without their help. Hard disks
    are sophisticated devices, in contrast to radio sets or other home appliances,
    which sometimes can be repaired without special knowledge. Employees of service
    centers have all required equipment, knowledge, and experience. They fully repair
    thousands of hard disks; therefore, the chance for successful data recovery in
    the service center is considerably higher for programmers or system administrators
    who try to repair disks on their own — at least in theory. In practice, the price
    for recovery often exceeds all reasonable limits, without guarantee of a favorable
    result. I know lots of cases, where “amateurs” successfully repaired hard disks
    ruined by so-called specialists and did so free of charge. In particular, those
    who live out-of-the-way places, where there are no service centers nearby, must
    rely on their own skills.


    In this chapter, I will concentrate on the rescue of lost data. Total repair of
    hard drives (except for rare exceptions) is either impossible or economically
    unjustified. Thus, my main goal is to explain how it is possible to temporarily
    recover the hard disk, sufficient only for copying the most valuable data (or,
    ideally, the entire hard disk). In this chapter, I will cover only the most common
    issues of hard disk repair and won''t consider the step-by step technique of the
    hard disk drive diagnostics. This is a separate topic, which requires different
    approaches for different disk models. Some of the necessary documentation for
    diagnostics is available even to unregistered users at the following address:
    http://www.acelab.ru/products/pc-en/support.html. The main idea of this chapter
    is as follows: temporary hard disk drive repair is possible even in the home environment,
    and I''ll show you how!'
