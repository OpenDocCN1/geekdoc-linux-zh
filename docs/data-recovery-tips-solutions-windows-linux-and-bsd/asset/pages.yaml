- pgno: 85
  md: '# Part I: Data Recovery Tools


    Only the block of heads must be replaced. The native magnet of the voice coil
    of the acceptor remains the same. To move the heads to the parking zone, carry
    out the same steps in the inverse order. Now it only remains to tighten the positioning
    screw and close the hermetic block with the cover. After you power on the disk,
    it might issue a weird sound, and the speed of reading drop by several dozen times.
    This is a consequence of the foreign block of read/write heads, with foreign adaptives.
    By regulating the screws that fasten the cover, it is possible to slightly stabilize
    the read graph. However, for long; therefore, it is necessary to start reading
    the data, beginning with the most important and valuable files.


    Some hard disks have only one read/write head, in which case it is more convenient
    to replace the platter, as shown in the video at http://pc3k.rsu/ru/video/video03_N40P_disk_swap.avi.


    Sometimes, magnetic heads literally become sealed to the magnetic surface because
    of intermolecular attraction forces. In this case, some authors recommend rotating
    the disk on the horizontal plane. However, the "advantage" of this technique is
    doubtful, and sometimes it might cause considerable or even irreversible damage
    (for example, it could mechanically damage the heads and scratch the magnetic
    surface). Disassembling the the block and carefully repairing the heads using
    previously-mentioned plastic ribbon and then returning them to the parking zone
    is a much better practice. More details can be found in the article "Recovering
    the hermetic block of DJI a fall" by Sergey Yatsenko (http://www.acelab.ru/pcTechSupport/DOSvers/MFFeatures/IBM/VGPP.html).


    Unfortunately, this article is available to registered PC-3000 users only.


    Sometimes, the switch/preamplifier might be damaged or the flexible ribbon connector
    might be broken. If the switch is placed directly on the block of heads (especially
    in the chip component), then it would be necessary to replace the entire block
    of heads according to the previously-described technique.


    The voice coil, because of its unsophisticated design, has no components likely
    to fail; however, the output contacts break off. These can be easily soldered.


    The spindle drive is extremely reliable and rarely fails. However, a hydrodynamic
    bearing wreck is encountered often. If this happens, it must be released using
    the technique described at http://www.acelab.ru/pcTechSupport/DOSvers/TechDoc/Barracuda4.html
    (available to registered PC-3000 users only).'
