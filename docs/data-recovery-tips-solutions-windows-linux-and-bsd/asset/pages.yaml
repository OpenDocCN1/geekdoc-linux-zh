    mode. To introduce changes, it is necessary to switch to the hex mode and search
    for the offsets of all values manually. Finding the $DATA attribute header is
    easy, because the 80 00 00 00 00 00 00 01 sequence is located in its beginning.
    In NTFS 3.0, it is located at the offset F8h from the start sector. The Real Size
    attribute in all NTFS versions is located at the 30h offset relative to the header,
    and the Allocated Size and Initialized Size fields are located at the 28h-byte
    and 3bh-byte offsets, respectively. The Allocated Size value must be a multiple
