    to demonstrate how cool the company is. Despite these arguments you still decide
    to use, only EasyRecovery and GetDataBack. These tools were developed by real
    professionals in collaboration with the developers of the original NTFS driver.
    Believe me, they know their internal structure and the specific features of their
    behavior to the slightest detail. These utilities are the best available on the
    market. They are beyond comparison (in relation to the automated recovery).


    Do not write anything on the disk to be recovered, and prevent all applications
    from doing so. If you have accidentally deleted a file from the system disk, do
    not shut down Windows in an officially recommended way. It is much better to press
    the reset button. Why do I give such an “illegal” recommendation? When shutting
    down properly, the system saves on the disk current configuration, which considerably
    increases the risk that the deleted file will be irreversibly overwritten.


    Do not torture bad sectors by repeatedly trying to read them; this only extends
    the bad area to adjacent sectors and damages the magnetic read head. After such
    an operation, good sectors will also become unreadable. A much better practice
    is to take a long road from the disk with disabled control codes, because controller
    will return everything that has remained from the damaged sector (note that the
    failure often affects only a few bytes).


    If the hard disk emits suspicious noise like clicks or scratching sounds, immediately
    power down the computer. Again, to prevent the system from writing anything to
    the disk, because the disk can die at any moment once and for all. In this case,
    no specialist in the field of electronics will be able to recover it.


    Recover SCSI disks (especially RAIDs) only on the native controller, because different
    controllers use different address translation methods. If the controller has'
