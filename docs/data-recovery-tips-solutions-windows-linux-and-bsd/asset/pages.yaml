  md: '# Chapter 8: Data Recovery under Linux/BSD 205


    and poorly documented. With all that being so, FreeBSD plays one of the most important
    roles in the world of UNIX-compatible operating systems, and data destruction
    under it occurs often. Fortunately, in most cases lost information can be fully
    recovered.


    # Preparing to Recover Data


    First, it is necessary to unmount the disk partition, or at least remount it in
    the read-only mode. Attempts at repairing an active partition often only increase
    the scale of destruction. If the files to be recovered are located on the main
    system partition, there are two ways, in which you can proceed — either boot from
    the Live Linux CD or install the disk being recovered as the second hard drive
    on a Linux machine.


    To avoid further destruction, never edit the disk with its copy. Work with such
    a copy can be created using the `cp /dev/sdb1 my_dump command`, where sdb1 is
    the device name and my_dump is the name of the dump file. The dump file can be
    placed on any free partition or even copied to another machine through the network.
    All disk utilities (lde, debugfs, fshck) won''t know the trick and will work with
    the file as if it is on a "normal" partition. If necessary, it is even possible
    to mount it to the file system, using the `mount dump_point -o loop command`,
    make sure that the recovery was successful. The `cp my_dump /dev/sdb1` command
    copies the recovered dump back to the partition — although it is not necessary
    to do so. It is much easier and safer to copy only the files being recovered.


    # Recovering Deleted Files under Ext2fs


    The ext2fs file system remains the base file system for most Linux versions; therefore,
    will be considered first. The concepts that it is based upon are similar to NTFS
    in many respects, so no cultural shock will be experienced when migrating from
    NTFS to ext2fs. A detailed description of the data storage structure can be found
    in the "Design and Implementation of the Second Extended Filesystem" paper (see
    "Recommended Reading" in this section), as well as in the book Operating Systems:
    Design and Implementation by Andrew Tanenbaum, the electronic copy of which can
    be found on e-Donkey. The source code of disk utilities, such as the file system
    driver, lde, and debugfs, will also be helpful.'
  merge: -1
  img_proc: true
