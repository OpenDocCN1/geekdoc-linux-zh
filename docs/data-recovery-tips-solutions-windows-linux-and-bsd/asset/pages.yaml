- pgno: 350
  md: '# Make Your Books A-LIST


    # Hacker Debugging Uncovered


    by Kris Kaspersky (ISBN 1-931769-40-0, $44.95, 624 pp, June, 2005)


    # How To Analyze Programs and Minimize Errors Using a Debugger


    This book concentrates on debugging concepts, disclosing secrets that will aid
    practical use of debuggers (such as NuMega SoftIce, Microsoft Visual Debugger,
    and Microsoft Kernel Debugger) with minimum binding to a specific environment.
    What are the advantages of using debuggers? From an economic perspective, they
    prevent unexpected losses. Conversely, without debuggers, no company would be
    able to profit from software product sales. Society will be unable to do without
    debuggers for at the next two decades. This book shows how debugger operates,
    what is under its hood, and how to overcome obstacles and repair the debugger
    in the process. The main topic covered in this book is the use of debugging applications
    and drivers under the operating systems of the Windows and Unix families on Intel
    Pentium/DEC Alpha-based processors. This book not only extends the opportunities
    for job hunters and improve skill level; it stimulates thoughts of abandoning
    these traditional concepts and favoring personal satisfaction and enjoyment. Simply
    speaking, the surrounding world contains so many wonderful and interesting things
    that the petty problems of the workday routine regress to the background. The
    everyday needs of hackers become insignificant. The purpose of this book is to
    make readers love their jobs and find pleasure in debugging. The companion CD
    for this book contains the source code of all listings provided in the book, high-quality
    color illustrations, and useful utilities. This book covers all aspects of debugging,
    including the sources of bugs and methods of minimizing them. Various debugging
    techniques (from the origin of debugging to the present) and hardware and software
    tools that support debugging technologies by the processor and operating systems
    are explained. The book covers techniques for efficient debugging strategies,
    secrets of investigating programs distributed without source code, and more.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_350_0.png)


    Brief Table of Contents: Introduction; Part 1. Goals and Tasks of Debugging; Part
    2. Practical Debugging; Part 3. No Source Code, or Face-to-Face with Alien Code;
    Part 4. How To Make Your Programs More Reliable; Part 5. The Debugger Works.


    A-LIST Publishing

    Swesford Rd, PMB #285, Wayne, PA 19087

    e-mail: mail@alistpublishing.com

    www.alistpublishing.com

    Fax: 702-977-5337'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# # Make Your Books A-LIST


    # # Shellcoder''s Programming Uncovered


    by Kris Kaspersky (ISBN 1-931769-46X, 52 pp, October, 2005)


    Software used all over the world contains lots of blunders, vulnerabilities and
    security holes. This book uncovers how these holes are exploited by hackers, viruses,
    and worms attacking from imaginable locations in the Net. It outlines how antivirus
    software, patches, and firewalls try to win without the system of attacks. Effectiveness
    exists only in the imaginations of developers, because they prove to be practically
    useless and unable to prevent the propagation of worms. The book also examines
    where security holes come from, how to protect systems (Windows and Unix), and
    how to away with these security holes. It includes many C and Assembly languages
    related to advanced exploits and intrigue.


