- pgno: 332
  md: '# # Chapter 12: Distributed Information Storage


    ![](img/1ce3cead9a6814cc94d1e00101c20220_332_0.png)


    The best way to save information is to share it with the others. This is a well-known
    fact. Try to automate the entire process by making your computer distribute data
    over the LAN automatically.


    Long ago, when there were no CDs and diskette damage was common, the loss of all
    information was commonplace. Thus, programmers had to visit their friends and
    copy programs back and forth. Source codes and office documents were also kept
    on the computers of friends and colleagues, naturally, in encrypted form. Do you
    get the idea?


    When such an approach is used, a well-known occurrence takes place. Botanists
    call it cross-pollination, and among hackers it is called a virus epidemic. Viruses
    spread at a terrific rate, like a forest fire. Having once infected files during
    such a file exchange, they settle into a computer so that it becomes practically
    impossible to delete them of multiple infections and reinforcements. Nowadays,
    it is possible to pack distribution sets using archivers with the option of protection
    against modifications or controlling the checksums. Fortunately, these operations
    are routine and bulky, especially if you do them manually. Furthermore, distributed
    data storage is usually too unbalanced: Some files (programs, music, or movies)
    are available to anyone. Some files might exist as a single copy, the loss of
    which is irreplaceable.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'However, the times when programmers had to fuss with packs of diskettes and
    hard disks have long gone. Nowadays, it is possible to exchange files without
    leav-ing the house. Why not to use the advantages of progress?


    # How To Protect Information


    To create distributed data storage, it is highly desirable to have a LAN with
    unanim-ited traffic, ensuring a data exchange rate of at least 10 Mbps. Modems
    also might be useful.


    Wireless technologies considerably simplify network organization. In the worst
    case, it is possible to use an Internet service provider, most of which provide
    this service for little cost.


    Now, it is time to consider the software to organize the distributed data storage.
    Fans of minimalism (including myself) can limit themselves to the built-in Windows
    functionality for file sharing. Starting with Windows 2000, the system began to
    sup-port a disk quota, allowing you to limit the maximum disk space allocated
    to each user. With the introduction of a disk quota, it became possible not to
    worry that someone would fill your disk entirely. For instance, it is possible
    to allocate 10 GB for common storage and assign appropriate access rights so that
    users of the network would be able to see others'' files but would not be able
    to modify or delete them. Under Windows XP, nothing can be easier. It is enough
    to assign the user rights to enable folder owners to do whatever they like and
    other users only to read the files stored there. Everyone would be able to back
    up the most valuable files or even entire disks on the computers of their neighbors
    (Fig. 12.1). Thus, something like a file-exchange network will be formed, to which
    other users will be able to connect.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_333_0.png)


    Fig. 12.1. A notebook equipped with a wireless adapter also deserves to be backed
    up'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Chapter 12: Distributed Information Storage 321


    File sharing works excellently in networks containing no more than ten hosts.
    However, with network growth problems start to appear. For example, sometimes
    users just cannot remember, which files have been backed up to and which haven''t,
    let alone which file they have backed up to which computer. Furthermore, home
    computers are not always available, in contrast to dedicated servers. The archive
    of music, movies, and software distributed over a hundred of hosts is practically
    immune (if all computers fail at simultaneously, this means that something catastrophic
    has happened, like an earthquake or tsunami);; however, it will take a long time
    to retrieve all of your files. After you collect everything, it will likely turn
    out that the most important file is missing because there was a single backup
    copy, which was accidentally deleted. However, there is no time to cry. It is
    time to create a creative approach and use emule — the client of the large file-exchange
    network, eDonkey, where it is possible to find practically everything. The system
    automatically controls file integrity, displays the number of available sources,
    and downloads from all available hosts simultaneously, uniformly distributing
    the workload among the hosts. You can divide users into groups, specify a flexible
    system of priorities, control incoming and outgoing traffic, and so on. In the
    classical variant of eDonkey, there is no possibility of forced upload. All that
    you can do is upload the files into a common directory and wait until someone
    downloads them. This approach works well when exchanging video and music; unfortunately,
    it isn''t suitable for backup unless you agree to make available and regularly
    (at least daily or weekly) view the contents of the common folders of all network
    members, find new, and download them, provided that no one else has done already.
    It is possible to establish any threshold, for example, download only files present
    on ten sources (the exact number depends on the network size — the greater the
    threshold). There is no need to do this manually! It is enough to slightly modify
    download eMule, the source code of which can be downloaded from http://www.emule-project.net/home/perl/general.cgi?l=1,
    or write a plugin. Lots of hackers, including myself, are doing exactly this.


    The most obvious drawback of emule is that it is bound to its servers, which are
    excessively overloaded and therefore work poorly and slowly. In addition, this
    solution doesn''t allow you to selectively configure the bandwidth. Thus, lots
    of users from all recesses of the network will try to connect. Every firewall
    will easily eliminate these connections. However, this won''t solve all problems,
    the most important of which is that your small private network becomes visible
    from the outside.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 322 Part III: Backup-Data Recovery


    It is much better to use peer-to-peer file-exchange networks running without dedicated
    servers, such as Gnutella (http://www.gnutella.com/connect/). The protocol was
    decrypted long ago, and lots of clients are distributed freely with the source
    code. Having slightly modified these clients, you''ll obtain an excellent tool
    for automated distributed backup, after which there won''t be cause for worry
    about the safety of your data.


    True programmers can do without customizing existing software for their purposes
    and run such a program on their own. As far as I know, for the moment there are
    no such programs; therefore, a tool has a great chance of becoming popular. This
    is even truer if you recall that the throughput of communications links is growing
    steadily, the traffic is becoming every day, and only lazy individuals do not
    have home networks nowadays. In other words, there are all of the prerequisites
    for the creation of file-exchange networks; only specialized software is missing.
    I wonder what we programmers are waiting for. For the new Windows release, which
    will include this capability as a built-in feature and deprive us of the possibility
    of earning some money?


    # File Transfer Protocol Server or Bulletin Board Rebirth


    File exchange systems justify their existence only in large networks. In medium-size
    networks including several dozens of hosts, they are too burdensome. Therefore,
    it is much better to use file transfer protocol (FTP) servers as distributed storage.


    It is necessary to bear in mind that even in a peer-to-peer network, not all hosts
    have equal rights and power. Some users can afford to keep their computers running
    24 hours a week, and some cannot. Some users have large hard disks, powerful processors,
    and a high-speed network connection; other users have nothing of the sort. File-exchange
    networks provide equal rights to all their participants, in which case 10% of
    clients bear 90% of the workload. Just answer honestly: Do you want to provide
    service to everyone without receiving something in exchange? In large networks,
    the situation is stabilized at the expense of the arrival of new enthusiasts —
    good guys trying to do something for others without expecting any profit in exchange.
    However, this goodwill tends to fade with time.


    Large and powerful hosts of a small private network can support their own FTP
    servers, making them available for uploading and downloading for all other users.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Chapter 12: Distributed Information Storage 323


    This is distributed storage; however, it is faster and more reliable than the
    previously-described ones. The users can back up their data only to servers equipped
    with an uninterruptible power supply, fault-tolerant RAID, and so on. Because
    quotas on such servers are usually large enough, there is no need to spread the
    files over dozens of servers. Under such conditions, it is enough to create two
    or three backup copies, and there wouldn''t be any confusion.


    After that, it only remains to answer a simple question: Why should you install
    and support FTP servers? Making this service commercial doesn''t seem to be an
    idea that is going to bring you profit. Your enthusiasm also isn''t too promising.
    Still, your own FTP server is the best way of obtaining rare and valuable music,
    movies, and warez. What files are most frequently backed up by most users? As
    a rule, these are valuable files that take users a long time to find and download
    from the network (expensive ones if you bought them). They will gladly upload
    all stuff to your FTP server if you provide sufficient disk space to store. Long
    ago, when there was no Internet and software was considered the property of all
    people (and had to be assembled by piece and piece, literally, bit by bit), the
    main sources of this wealth were bulletin board systems (BBS). A typical BBS was
    a computer equipped with a modem, configured to receive incoming calls and store
    the uploaded files. A system operator selected the most valuable files and discarded
    all others.


    In my opinion, this is a viable idea, and FTP servers can be used for information-exchange.


    # Redundant Arrays of Inexpensive Discs


    Everyone knows what a RAID controller is, because nowadays it can be purchased
    in any computer store. This device allows you to write to several disks simultaneously.
    If different data are written to disks, then the data exchange grows proportionally.
    If the same data are duplicated, then storage reliability is improved. RAIDs might
    be implemented at the software and the hardware level, and the storage media that
    form the array needn''t to be concentrated in the same location.


    To the software RAID driver, it doesn''t matter whether the disk is connected
    to the local machine through SCSI or the IDE interface or if it exchanges the
    data across the network. Having joined logical disks into a virtual RAID, you''ll
    develop a practical and easy-to-use fault-tolerant system. For this purpose, it
    is possible to use disks of different geometry and even different sizes. Furthermore,
    it isn''t necessary to allocate the entire disk for the RAID. It is enough to
    allocate any part that you might desire.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# 324 Part III: Backup-Media Data Recovery


    How is it possible to use these possibilities? The first idea that comes to mind
    is using part of the hard disk''s capacity to store redundant information such
    as Reed-Solomon codes, which help recover damaged information after failures.
    In this case, relatively small overhead would allow you to recover any hard disk,
    even in case of its total destruction. Note that this result would be achieved
    only at the expense of redundant information distributed over all other computers.
    It is simply impossible to invent more reliable information storage. For example,
    I have implemented a system in several small-business LANs, and these systems
    were flexible, reliable, and extremely viable. Furthermore, the regular backup
    in this case is no longer a matter, which is convenient for home users.


    The only drawback of software RAID implementations is low performance. You won''t
    gain anything in performance if you install software RAID to a server processing
    thousands of queries per second. However, the concept of performance is extremely
    reliable. For instance, if your server is equipped with a processor fast enough,
    encoding and decoding information on the fly will not degrade the throughput considerably.
    On the other hand, if read operations dominate write operations, it is extremely
    profitable to install software RAID because out the integrity of the read operation
    from the storage media is carried out at the hardware level by the drive. If systematic
    encoding is used (with other bytes, information are separated by parity bytes),
    a Reed-Solomon decoder doesn''t need to intervene in this process. Its help is
    needed only if part of the information is damaged badly, which happens rarely.
    Thus, there is no need to overpay the manufacturers of hardware RAIDs. This is
    even true if you recall that they do not pay much attention to home and small-office
    customers.


    By varying the size of correcting blocks, it is possible to obtain adequate data
    protection with a higher or lower level of information redundancy. To illustrate
    this statement, I suggest that you consider the following example: Assume you
    have N sectors on your disk. Having grouped them into blocks containing 174 sectors
    and each allocated 3 sectors per block for storing the checksum, you will be able
    to recover N/174 sectors of the disk. Assuming that average capacity is 100 GB
    (which corresponds to 107,374,182,400/209,715,200), you''d be able to recover
    209,715,200/174=1,205,259 sectors even if they are destroyed at the physical level,
    using only 2% of the available disk space to store checksums. It is hard to disagree
    that hard disks rarely fail so swiftly that the capacities of Reed-Solomon codes
    are not sufficient to recover the information stored there — provided that you
    notice the first symptoms of the imminent disaster and provided that the interleave
    factor has been chosen correctly. In relation to the choice'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Chapter 12: Distributed Information Storage 325


    of the interleave factor, it is necessary to mention that sectors belonging to
    the same disk platter must be serviced by different error control blocks; otherwise,
    with physical surface defects on one of the platters, the errors would be combined,
    which causes another group error irrecoverable by the given program.


    Could be done if the entire hard drive fails irreversibly? The most reasonable
    approach to solving the data-rescue problem is to create an array of several disks
    using information mixed with error-correction codes. The main drawback of this
    approach is its inefficiency on arrays made up of a few hard disks. The reasonable
    minimum is as follows: four disks for information storage and one disk for error
    correction. In this case, the loss of any information disk would be compensated
    by the surviving error control disk. If the disk containing error-correction information
    is lost, it can be replaced with the new one and all error correction codes will
    be recomputed. However, simultaneous failure of two disks means catastrophic.
    An array of 15 disks, 12 of which store information and the remaining 3 of which
    hold error-correction codes, is more tolerant. It survives the simultaneous crash
    of any 2 disks or, under favorable circumstances, even 3 disks.


    The source code of the simplest encoder and decoder that can be used for creating
    a custom RAID driver can be downloaded from ftp://nezumi.org.ru.


    # Reed-Solomon Codes


    Reed-Solomon codes are nonbinary systematic linear block codes that relate to
    a class of cyclic codes over a numeric field. Reed-Solomon codes are a subset
    of Bose-Chaudhuri-Hocquenghem codes. Correcting capabilities of Reed-Solomon codes
    directly on the number of check bytes. Adding r check bytes allows detection of
    arbitrarily corrupted bytes, with a guarantee of recovering r/2 bytes of them.
    More details on Reed-Solomon codes can be found in my book on CD cracking.


    # Summary


    In this chapter, several of the most popular types of distributed backup systems
    were covered. In total, such systems are considerably more numerous. Furthermore,
    new types of distributed data backup systems appear every day, although often
    only in the form of ideas. Ready-to-use implementations are few, and most of them
    are based on existing programs (such as a plug-in for eDonkey). Thus, it doesn''t
    make sense to just sit and wait until someone implements those ideas for you.'
  merge: -1
  img_proc: true
