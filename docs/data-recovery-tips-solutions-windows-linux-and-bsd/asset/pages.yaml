    # Shoveling the Debris


    Now, consider the more difficult case of file recovery, when the file record has
    already been overwritten. If the deleted file was a resident one (in other words,
    it stored its body in MFT), then there is nothing to recover. Even if a nonresident
    file was created in its place the operating system would fill the “tail” with
    zeros. That, to restore the original content will be necessary to use expensive
    equipment that reads the surface of the hard disk drive platters at the physical
    level.


    With nonresident files that store their bodies outside MFT, the situation is somewhat
    better, although even in this case there are lots of serious problems. The order,
    in which files are located on the disk, is stored in the run list inside the MFT
    file record, which has already been overwritten. Therefore, only a context search
    by the content is available. Start a disk editor, enter the sequence of characters
    guaranteed to be present in the deleted file but not present in all other ones,
    and start the context search. To speed up the search, it is possible to search
    free disk space only the (/BITMAP file is responsible for this information). Unfortunately,
    all disk editors known to me neglect this possibility; however, it is not difficult
    to write a custom “advanced” search utility.'
