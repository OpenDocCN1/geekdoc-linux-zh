- pgno: 312
  md: 'of risk, it is also possible to write archives and executable files whose loss
    won''t distress you too much or can be easily recovered from the main storage
    (for example, when moving files from computer to computer or duplicating borrowed
    discs).


    Mode 2 in its pure form is rarely encountered; however, other modes derived from
    it are everywhere. The list of such modes is long, and it includes CD-ROM XA mode
    2 (used in multisisioned discs), Video CD/Super Video CD, and CD-I.


    The CD-ROM XA mode, which appeared on the foundation of mode 2, favorably differs
    from its predecessor by the possibility of dynamically changing the type of track
    over its entire length. Part of the track can be written in the form 1 mode, which
    is identical to mode 1 except that it uses 8 spare bytes for the special header.
    Another part can be written in the form 2 mode, which is an improved version of
    mode 2: 2324 bytes of user data, 16 bytes of the main header, 8 bytes of auxiliary
    header, plus 4 bytes of the checksum for controlling the integrity of (not recovering)
    sector content.


    Form 1 was developed with data, for which it is critical to avoid destruction,
    such as executable files and archives, and form 2 was intended for audio and video
    data. Unfortunately, these plans were not implemented, and form 2 didn''t gain
    the expected popularity. The only popular format based on mode 2 is Video CD/Super
    Video CD, which allows you to write up to 800 MB to a standard 700-MB CD and up
    to 900 MB to a 90-minute CD (plus overburn), which is approximately 4 MB less
    than mode 2; however, such losses can be neglected. In contrast to mode 2, the
    Video CD/Super Video CD format is supported by operating systems from the Windows
    and Linux families.


    # Problems


    Mode 2 as such doesn''t cause any problems. This is a standard mode supported
    by all drives, media, and drivers. The problem is that ISO 9660 and all of its
    successors imply strict limitations on the sector size, requiring it to be a power
    of two (in other words, the sector size must be 512, 1024, 2048, 4096, and so
    on, bytes). The size of the user data area sectors within sectors mode 1 must
    meet this requirement (2¹¹ = 2048). This is not so for mode 2, because of which
    a tail of 288 unused bytes (2¹¹ + 288 = 2336) remains in the end of the sector.


    Professional CD-burning programs can burn discs both in XA mode form 1 and in
    XA mode form 2. However, this doesn''t increase the disc capacity, because'
