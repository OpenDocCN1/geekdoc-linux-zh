    The superblock is followed by group descriptors and a map of free space, or simply
    bitmaps (a block bitmap and an inode bitmap), which are of little or no interest
    for current purposes. The inode table that follows them must be covered in more
    detail. In ext2fs (like in most other file systems from the UNIX world), the inode
    plays the same role as the file record in NTFS. The inode representation format
    is shown in Listing 8.5. An inode contains all information about the file: file
    type (normal file, directory, symbolic link, and so on); the logical size and
    physical size; the method of disk allocation; times of creation, modification,
    deletion, and last access; access rights; and the number of references to the
    file.


    # Listing 8.5. The inode representation format


    | Offset Size Description |

    | --- --- --- |

    | 0 2 i_mode ; Representation format |

    | 2 2 i_uid ; User ID (UID) |

    | 4 4 i_size ; File size in bytes |

    | 8 4 i atime ; Last access time |

    | 12 4 i ctime ; File creation time |

    | 16 4 i mtime ; File modification time |

    | 20 4 i dtime ; File deletion time |

    | 24 2 i_gid ; Group ID (GID) |'
