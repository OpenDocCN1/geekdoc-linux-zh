- pgno: 324
  md: '# # Chapter 11: Repairing CD/DVD Drives under Home Conditions


    ![](img/1ce3cead9a6814cc94d1e00101c20220_324_0.png)


    CD/DVD drives are among the most sophisticated electronic, optical, and mechanical
    devices, yet they are the least reliable computer components. The reasons for
    failure vary. Typically, the laser fails or loses its emission. The chipset fails
    even more often, especially if both motors and the laser-focusing coil are connected
    to the same chip. Then there are the mechanical failures and soiling of optical
    surfaces.


    Is it realistic to repair a failed drive under home conditions, or is it better
    not to spend time and effort and simply purchase a new one?


    Not every drive is fatal. Often, it is possible to repair the drive even under
    home conditions, without special electronic equipment or skills that exceed the
    competence of a normal electronics engineer (Fig. 11.1). Do not be afraid to experiment
    with the failed drive! Nothing worse can happen to it (as long as the warranty
    for the failed drive has already expired). It is possible to take it to a service
    center; however, this takes time and money. Furthermore, this simply isn''t interesting.


    For repair, you''ll require spare parts. It is usually possible to obtain them
    from friends or colleagues or to purchase them on the second-hand radio market.
    Pay special attention to drives built on the same component base as yours (mainly,
    this relates to the laser head and the chipset, which can be found marked on the
    drive case. Assume that the PCB has failed, and a drive of the same type is unusable'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 312 Part III: Backup-Media Data Recovery


    ![](img/1ce3cead9a6814cc94d1e00101c20220_325_0.png)


    because of the failure of mechanical parts. Thus, the entire failed PCB can be
    replaced without even investigating the cause of its failure. All other models
    are also useful because, if necessary, it is possible to use some individual spare
    parts from them (such as fuses).


    The methodology of troubleshooting is not provided here, because this topic deserves
    a separate book. My goal is modest — to inspire you to make investigations by
    specifying directions and listing all main types of failures and methods of overcoming
    them.


    # Laser


    Laser emitters used in CD-ROM and, especially, in CD-RW/DVD-RW drives are short-living
    devices that often fail fail after several years of operation. Why does this happen?
    First, because of natural loss of emission by emitters; second, because'
