- pgno: 27
  md: '# Part I: Data Recovery Tools


    because of conflicts with other drivers or violation of the cache buffer integrity
    — the transactions mechanism ceases to help and the disk structure becomes damaged.
    The first four records of MFT are stored in a special backup file, pointed at
    by the Cluster to MFT mirror field. These can be easily recovered.


    What should you do with the remaining ones? Given contemporary sizes of hard disks
    and vast numbers of files, the number of records in MFT is considerably greater
    than four. Therefore, the damaged records are lost and cannot be recovered. Nevertheless,
    provided that the disk has not been processed by ChkdSk, Norton Disk Doctor (NDD),
    or some other “doctor”, there is some chance that you’ll be able to restore the
    data manually. It should be mentioned, however, that even a superficial description
    of data recovery techniques requires several hundred pages printed in small font.
    Most normal users will have a tedious reading this description to the end. The
    only utility that I trust is CrashUndo2000. This tool retrieves as much information
    as possible after processing the remaining debris, and the quality of its operation
    is on par with manual recovery carried out by an expert. Nevertheless, no one
    can guarantee that after the “healing” the situation won''t become worse. This
    conclusion isnt a cheery one; however, it is true.


    # How to Avoid Catastrophe


    No one is insured against data loss. However, if you have carefully and correctly
    planned a backup strategy, the entire recovery procedure will be reduced to replacing
    the damaged hard disk and restoring important data from the backup media. Note
    that it is not recommended that you restore the data to the old disk, even if
    you suffered only logical damage, because, if in the course of the recovery process
    you discover the backup medium is damaged, you will lose both the original and
    the copy. After that, you will have to commit hara-kiri.


    If there is no backup copy or if the existing one is obsolete, then immediately
    abandon all current activities and start to create an up-to-date one. I am afraid
    that I am wasting time when giving this advice. Most users never create backups.
    If you but know, if age but could... Well, even if you create a backup, at least
    fragment your hard disk regularly, because unfragmented files are easier to recover
    than fragmented files.


    Of all partitions, the first one is typically destroyed, so do not store anything
    valuable there. The disk must be partitioned; however, if you didn''t partition
    it before'
