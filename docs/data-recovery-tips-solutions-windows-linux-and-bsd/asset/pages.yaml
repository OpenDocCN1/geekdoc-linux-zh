- pgno: 194
  md: '# Chapter 7: NTFS Data Recovery 181


    Which medium would you choose? CDs are not suitable for this purpose, mainly because
    to restore the contents of a hard disk 80–120 GB in size you need a truck to carry
    such a number of disks. In addition, direct write to CD-R/RW media is not always
    possible, because after a system crash the recovery utilities must be loaded from
    CD-ROM, and most standard computers have only one optical drive. Finally, as far
    as I know, such utilities do not allow large files to be cut into several ones.


    It is possible to send the data through a local area network (although this is
    not always available) or install an additional hard disk drive (provided that
    the computer case is not sealed and there are free controller channels). Isn''t
    the latter approach troublesome? To rescue hundreds of vitally important files,
    such a technique is suitable.


    Consider the technique of automated data recovery on the example of the R-Studio
    utility from R-Tools Technology (http://www.r-tt.com). This is a powerful instrument
    that you can rely upon. Immediately after starting this utility, the Drive view
    will appear. This window lists all physical devices and logical drives. Find the
    required drive and choose the Scan from the right-click menu.


    The program will prompt you to specify the starting sector for scanning (the default
    value is zero, which is usually left unchanged) and the size of the area to be
    scanned (which by default is the entire partition). Scanning the entire partition
    guarantees that the scanner will locate all surviving file records, although the
    search might require considerable time. Is it possible to speed up this process?
    Carry out a simple computation. Assume that the partition to be recovered contains
    100,000 files. A typical size of a file record is 1 KB. Provided that NTFS is
    not fragmented, it would be enough to scan about 10 MB from the beginning of the
    partition. If this value does not exceed 10% of the entire disk capacity (the
    space reserved for MFT and the disk was never more than 90% full, then the assumption
    is probably correct. Otherwise, NTFS is guaranteed to be fragmented and randomly
    scattered over the entire disk. Anyway, you do not expose yourself to risk in
    case of error. Enter the value of N KB, where N is the number of files (recall
