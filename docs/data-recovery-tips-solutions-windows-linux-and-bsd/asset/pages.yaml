    # Techniques of Recovering Master Boot Record


    There are lots of utilities intended for automated recovery of the master boot
    code and partition table (GetDataBack, EasyRecovery, Active Data Recovery Software,
    and so on). Until, they were successfully coping with their task recovering even
    totally destroyed partition tables. However, with the arrival of large disks that
    broken the 2 GB barrier using various extensions, these utilities became fused.
    Therefore, you should not rely on them. If you do not want to lose your data,
    recover the damaged MBR manually, particularly because this is a simple operation
    that doesn''t require expert skills. The recovery procedure will be considerably
    simplified if you have a copy of partition table created by Sector Inspector or
    a similar utility. However, users often lack such a copy.


    If the operating system refuses to boot, and the BIOS complains by displaying
    error messages like disk boot failure or non-system disk or disk error... Enter
    to restart, this means that the 55h AAh signature is damaged or destroyed. As
    a rule, this kills the bootstrap loader.


    > It is vitally important to distinguish BIOS messages displayed by the bootstrap
    loader and boot sector. Start BIOS Setup and disable all boot devices except for
    the A: drive. Then reboot without inserting a diskette into the drive and memorize
    the message that appears on the screen. This will be the error message of the
    BIOS.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    The 55h AAH signature can be restored using any disk editor. However, when doing
    so, make sure that in the start of the disk there is a master boot code (if you
    cannot disassemble it mentally, use either IDA or HIE). You are unable to disassemble
    even with these? Then try to evaluate the bootstrap rationality level visually
    (you will still require some experience of working with the code). The beginning
    of any standard loader must contain approximately 100 bytes of machine code in
    which the following sequences can be found: 00 7C, 1B 7C, BE 07, CD 13, CD 18,
    CD 10, and 55 AA. These are followed by typical text messages, such as Invalid
    partition table, Error operating system, and Missing operating system. If the
    loader is damaged but the 55 AA signature remains intact, then any attempt at
    booting from such disk will result in a system hang-up.


    You can restore the lost or damaged master boot loader using fdisk utility, started
    with the /MBR command-line option. This will write the standard boot code into
    the MBR of the first disk. By the way, the undocumented /MBR command-line option
    that was introduced with MS-DOS 7.0 allows you to choose any of the connected
    hard disks. It is also possible to use the FIXMBR command of the Windows 2000
    Recovery Console.


    > If you used a nonstandard loader (like LILILO)


    As already mentioned, some loaders change the translation method for the hard
    disk addresses. Therefore, if you employ the standard loader, this disk will be
    unusable. If this is the case, try to reinstall the loader from distribution disks;
    perhaps, this will help. Otherwise, nothing remains to write a custom loader and
    determine the disk geometry and translate sector addresses in an appropriate way.
    This job is quite difficult and requires serious programming skills and technical
    knowledge. Therefore, it will not be covered here.


    If the loader informs you about an Invalid partition table, this doesn''t necessarily
    mean that the partition table is damaged. This may mean that neither of the primary
    partitions has been marked as active. This may happen if you are using nonstandard
    loaders that boot the operating system from the extended partition.'
