  md: '# Chapter 10: Recovering CDs 307


    to use subcode channels to store confidential information that is not intended
    for outsiders.


    Using CloneCD (http://www.elby.ch/) or any other CD copier, create the image of
    the disc to be burned, having previously placed it on a CD-RW. After this operation,
    three files will appear on your hard disk: image.ccd, storing the disc TOC: image.img,
    storing the contents of the main data channel; and image.sub, with subchannel
    data inside. Open the image.sub file using any hex editor (HIEW, for example).


    The first 12 bytes of the P channel intended for fast searching for. Do not touch
    this channel, even though most contemporary drives ignore the P channel. The next
    12 bytes are occupied by the service information of the Q channel that contains
    the layout data. Never modify this channel; otherwise, one or more sectors will
    become unreadable. 24 to 96 belong to unused (spare) subcode channels. They can
    be used at your discretion. These bytes are followed by 12 bytes of P and Q channels
    and 72 bytes of blank subchannel data, and so on, alternating to the end of the
    file.


    Press <F3>, move the cursor to any free space, and write confidential information
    there, having previously encrypted it as necessary. To save modifications, press
    <F9>. Now, it only remains to start CloneCD and burn the modified image to the
    disc. When you view the disc contents using built-in Windows tools, it is impossible
    to view the confidential information. To view this information, it is necessary
    to use CloneCD in the image reading mode (File | Read CD into image, then start
    HIEW to read image.sub).


    For example, consider the message that I have inserted into the subchannel data
    (Fig. 10.21).


