  md: "# Chapter 5: Basic Concepts of Manual Data Recovery\n\nTry to read a sector\
    \ from the disk in the CHS mode. When doing so, it is necessary to act from MBR\
    \ or from under \"naked\" MS-DOS; otherwise, you'll fail, because Windows NT blocks\
    \ direct access to the disk even from the MS-DOS emulation.\n\nThe number of function\
    \ is loaded into the AH register. In case of reading, it is equal to two. The\
    \ AL register is responsible for the number of sectors to process. Because it\
    \ is necessary to read one sector at a time, set this register to one. The DH\
    \ register stores the head number, and DL holds the drive number (80h stands for\
    \ the first disk, 81h for the second, and so on). The 5 least significant bits\
    \ of the CL register specify the sector number, and the remaining bits of the\
    \ CH register determine the number of the cylinder that must be read. The ES:BX\
    \ pair of registers specifies the target buffer address. That's all. After executing\
    \ the INT 13h command, the data being will be loaded into the buffer. In case\
    \ of an error (for example, if the read/write encounters a bad sector), BIOS would\
    \ set the carry flag, and the loader would either repeat the read attempt or display\
    \ an error message.\n\nThe code in Assembly language appears as shown in Listing\
    \ 5.6.\n\n# Listing 5.6. The code that reads the boot sector or extended partition\
    \ table\n\n```\nMOV SI, 1BEH             ; Go to the first partition.\nMOV AX,\
    \ CS               ; Set ES.\nMOV ES, AX               ; \nMOV BX, buf       \
    \      ; Buffer offset\n...\nread_all_partitions:\n  MOV AX, 0201h          ;\
    \ Read sector 1 from the disk.\nMOV DL, 80h             ; Read from the first\
    \ disk.\nMOV DH, [SI+1]           ; Starting head number\nMOV CX, [SI+2]     \
    \      ; Starting sector and cylinder\nINT 13h\nJC error                ; Read\
    \ error\n\n; Process the read boot sector or extended partition table.\n; ==================================================\n\
    ;\n```"
