    # Data Runs


    Bodies of nonresident attributes are stored on the disk in one or more cluster
    chains called *runs*. A run is a sequence of adjacent clusters characterized by
    the number of the starting cluster and by the length. The set of runs is called
    the data run or run list.


    The format of internal run list representation isn''t exceedingly complicated;
    however, it isn''t simple enough. It became known as the brain damage format.
    To economize on space, the run length and the number of the starting cluster are
    stored in variable-length fields. This means that if the run size fits within
    1 byte (its value doesn''t exceed 255), exactly 1 byte is allocated to store it.
    Accordingly, if the run size requires a double word, a double word is allocated
    to store it.


    The length fields are stored in 4-bit cells or half-bytes. Hex notation allows
    easy translation of nibbles to bytes and vice versa. The least significant nibble
    is equal to X & 15, and most significant nibble is equal to X/16. As can be easily
    seen, the least significant nibble corresponds to the least significant digit'
