  md: '# 308 Part III: Backup-Media Data Recovery


    Not all drives supporting reading and writing of subcode channel data. Make sure
    that the Read subchannels from data tracks option is set in the Profile Parameters
    in CloneCD, and that the Do not restore subchannel data checkbox is cleared; otherwise,
    you''ll fail.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_321_0.png)


    It is possible to gain an additional 13.5 MB at the expense of the disc lead-out
    area, which generally must not necessarily be closed. Discs with a missing lead-out
    area are successfully read by most contemporary drives. The risk of encountering
    a drive that does not do this is minimal. To obtain this additional space, simply
    clear the Always close the last session checkbox in your CD-burning tool.


    This is not all. Drawbacks of the standard ECM encoding are obvious and were mentioned
    earlier. However, it is impossible to force the drive to use better modulation
    methods, at least for the moment. The situation might change dramatically in the
    foreseeable future. Recorders that allow you to manually merge bits (which considerably
    simplifies copying of protected discs) have already appeared. However, drives
    that allow you to read merging bits from the interface level of hierarchy still
    are not available. Nevertheless, practically any existing CD-ROM or CD-RW drive
    can be enhanced to provide this capability. To achieve this, it is enough to slightly
    modify its firmware. By experimenting with my Philips CD-RW 2400 drive that indeed
    operates at the 42x speed, reading without errors only high-quality discs), I
    increased the physical data storage density more than 12%. This result was achieved
    practically without reducing storage reliability. The effective capacity of the
    standard 700-MB disc was raised to 1 GB. That''s everything!


    The only drawback of this method of disc recording is its incompatibility with
    standard equipment and, consequently, its lack of portability. Nevertheless, this
    technology seems quite promising and has good prospects.


    # Testing Discs for Reliability


    Using mode 2 imposes quite restrictive requirements on the quality of the media,
    as well as on the technological characteristics of the reading and recording CD
    drives. Otherwise, the risk of irreversible data loss becomes too great, and mode
    2 becomes inexpient.


    Testing recently-recorded media is senseless. First, it is necessary to know the
    nature of the defects growth with the time. Second, it is necessary to accumulate
    certain statistics of media reliability from several lots of the same media.'
  merge: -1
