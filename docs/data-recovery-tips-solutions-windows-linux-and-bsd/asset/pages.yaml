  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    Disk Monitor (DiskMon) by Mark Russovich (http://www.sysinternals.com) allows
    the investigator to look into the file system sanctuary and see how it allocates
    the disk space for files (Fig. 7.4). The most interesting technique of investigation
    is running this monitor in parallel with a defragmenter or ChkDSk, because in
