    land, as an inverse transition from land to pit, corresponds to logical one. Because
    the diameter of a focused laser beam is equal to three pits, shorter chains are
    not recognized by the laser. Thus, two adjacent binary ones (each corresponding
    to the transition from pit to land or land to pit) must always be separated by
    at least three zeros; otherwise, the drive simply wont notice that something is
    present there (recall that the length of one pit or land is considerably smaller
    than the diameter of a focused laser beam). The upper limit of the chains'' length
