    LBAs. Now, everything located between the end of the lead-in area and the starting
    point of the first sector will become the pre-gap. In the course of CD burning,
    the pre-gap area will remain intact. Later it will be possible to read it at the
    sector level (exactly what you need). To be honest, an excessive increase in the
    size of the pre-gap area of the first track is not the best idea because all drives
