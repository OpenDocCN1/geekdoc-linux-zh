- pgno: 81
  md: '# Principles of Repairing Hard Disks


    Ancient hard disks were expensive, used lots of chips with a low integration level,
    and needed many spare parts, which required a support specialist to spend a lot
    of time peering into the oscilloscope in search for a malfunctioning element.
    Later, the level of integration began its sharp growth, manufacturers began to
    use standard chips, and the prices for their products dropped sharply. For the
    moment, repairing the hard disk electronics requires too much effort, and the
    prices for such repair are not justified.


    Nowadays, the main method of restoring disk usability is replacement of the entire
    controller board. You take another disk of the same model (the donor) and replace
    the controller board on the hermetic block of the disk being repaired (the acceptor).
    The only exclusion is for minor repairs such as replacement of a burned-out fuse
    or transistor, which can be carried out directly on the disk being repaired without
    replacing the entire controller board.


    One question remains without an answer — if repair technicians only replace malfunctioning
    boards, why pay them instead of carrying out this operation on your own?


    First, it is necessary to find a suitable donor. For different hard disk models,
    the compatibility of the controller boards differs significantly. Some disks require
    an exact match of all digits in the model number; no one agrees to operate with
    an "allied" controller. Some disks refuse to operate even if all characters and
    digits of the model number match. In this case, it is necessary to try one donor
    after another, hoping to find one suitable. Specific features of the behavior
    of each individual model can be found in the documentation supplied as part of
    the specialized toolkit, or on the Internet. The search for a suitable donor is
    seriously complicated because the period, during which some disk models are manufactured,
    is considerably shorter than the average period of their existence. Computer stores
    constantly update their stock, and the chances of purchasing a model similar to
    the one you purchased several years ago are minimal. Only companies selling secondhand
    equipment remain; however, even there the assortment is small.


    > A controller that is not a native one can damage the controller/preamplifier
    chip located within the hermetically-sealed block, destroying auxiliary information.
    This might seriously complicate all further repair operations. Therefore, do not
    replace controller boards if you are not sure of their compatibility!


    ![](img/1ce3cead9a6814cc94d1e00101c20220_81_0.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Chapter 4: Repairing Hard Disks 69


    Second, in addition to electronic components, the controller board contains the
    ROM chip, which might store more custom settings. The disk won''t easily agree
    to operate with a foreign board. There are two ways of bypassing this problem.
    First, if the acceptor is still alive, it is possible to read its original firmware
    and use it with the donor''s controller board. If this doesn''t work, it might
    be helpful to resolder the ROM.


    Third, if the disk is initialized and doesn''t refuse to work with a foreign board,
    the numbering system of its sectors might be violated, in which case the entire
    file system will turn into senseless garbage. To shovel this garbage, you''ll
    have to use your intuition (or, perhaps, gray cells and clever hands) and specialized
    software (the best is Data Extractor, supplied as part of PC-3000 capable of working
    with the standard IDE controller).


    Generally, you do not need anything for successful repair. This task can be accomplished
    even by ordinary specialists. Failure of electronic components doesn''t present
    any serious danger. The situation is worse if some of the service information
    stored on magnetic platens is corrupted (“Hard Drive Firmware and Adaptives”).
    This might happen for different reasons, such as firmware errors, power failures,
    shocks, vibrations, or hermetic block deformation. In this case, the disk isn''t
    initialized or responds with errors to all commands. Some hard disks switch into
    the service mode intended for writing service information, which can be passed
    either through the standard ATA interface or through the COM terminal.


    PC-3000 includes numerous service modules for the most popular hard disk models,
    and all registered users have free access to the FTP server, where it is possible
    to find whatever you might need. As a variant, it is possible to use specialized
    utilities supplied by disk manufacturers, having chosen the firmware update mode.
    To tell the truth, not all modules can be modified by such utilities; such utilities
    are not available for every module. In addition, this method will be useless if
    there are physical defects in the engineering zone or if the drive “freezes” at
    start-up and refuses to switch to the technological mode.


    Just for this situation, there is the hot-swap technique. In this case, you need
    two drives — donor and acceptor. The acceptor must be powered down, after which
    the electronic board can be removed. The donor is connected to the IDE interface,
    after which it is powered up. After completion of the initialization process,
    and receiving the “ready” signal, the ATA Sleep command (95h) is issued, which
    stops the spindle drive. All other components remain powered up. Then it is necessary'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 70 Part I: Data Recovery Tools


    to carefully remove the donor''s controller and install it on the hermetic block
    of the acceptor. Finally, it is necessary to issue any command that would “wake
    up” the acceptor. Because the controller has been initialized already, the engineering
    zone will not be accessed and you''ll be able to read all information from the
    disk recovered that survived the catastrophe. Note that you are using the standard
    IDE controller, it is necessary to disable all S.M.A.R.T. settings in BIOS Setup;
    otherwise, the disk will carry out S.M.A.R.T. logging and write all its data into
    the engineering zone. The compatibility requirements in this case are the same
    as in the case of replacement of the electronics board. Principally, it isn''t
    necessary to move the board to the hermetic block of the acceptor. You can take
    the acceptor''s board, initialize it on the donor''s hermetic block, and return
    it to its initial place. This method is even preferred because the acceptor would
    work with its native ROM.


    Some malfunctions require the hermetic block to be opened, which can be carried
    out successfully only if you have clever hands. The commonly encountered failure
    is damage to one or more magnetic heads (Fig. 4.2). This might happen because
    of production defects, electronic breakdown, or mechanical shock. If the head
    remains physically undamaged, then one of the surfaces becomes unreachable, and
    a bad sector is generated after every N sector, where N is the number of heads.
    Some models have six heads, but some are equipped with a single head, in which
    case the disk would become unusable because of an inability to read even the engineering
    zone. And even if a single head out of six fails, all information turns into garbage.
    All files larger than 3 KB (512×6) will be full of holes. What should you do under
    these circumstances? The only option is to replace the entire block of magnetic
    heads. This operation is extremely complicated, and most beginners end up in ruining
    the hard disk. Therefore, it is strongly recommended that you never practice on
    the working disk that you need to recover. Gain hands-on practice on hard disks
    with different levels of damage that do not contain anything interesting.


    You''ll need a donor of a closely-related model. An exact match of all digits
    in the model number is not required. Nevertheless, the blocks of the magnetic
    heads must be similar. Some disks park their heads outside the border of the magnetic
    platters, and some disks use the specialized zone near the spindle for this purpose.
    This case is the most difficult one, because to remove the heads you move them
    over the entire disk surface. But contact between the heads and the disk surface
    must be avoided; otherwise, the magnetic layer will be destroyed.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Chapter 4: Repairing Hard Disks 71


    ![](img/1ce3cead9a6814cc94d1e00101c20220_84_0.png)


    **Fig. 4.2.** The block of magnetic heads with the switch/preamplifier chip


    ![](img/1ce3cead9a6814cc94d1e00101c20220_84_1.png)


    **Fig. 4.3.** The homemade instrument for moving the block of magnetic heads,
    made up of a narrow plastic ribbon (1) pressed onto a heated metal rod (2)


    To safely remove the heads, take a thin strip of degreased plastic and carefully
    place it under each head so that the plastic raises the head over the disk surface,
    without touching the surface itself. Then move the heads outside the limits of
    the external edge. To prevent the heads from touching and scratching each other,
    it is necessary to insert a small polyethylene ribbon between them, which you
    can cut from the antistatic packing, in which the hard disk was supplied with
    (Fig. 4.3).'
