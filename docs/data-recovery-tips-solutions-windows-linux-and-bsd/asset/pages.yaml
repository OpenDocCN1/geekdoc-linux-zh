- pgno: 228
  md: '# Chapter 8: Data Recovery under Linux/BSD 215


    automated recovery of deleted files. It has an intuitive user interface, it is
    easy to control, and provides all other benefits of technical progress. It is
    possible to recover files with several mouse clicks. Naturally, they are recovered
    without names; furthermore, the utility doesn''t provide any guarantee that it
    will recover them. Manual recovery mode is not supported. Files with a destroyed
    inode are irrecoverable even though, in contrast to NTFS, ext2fs is this much
    easier to do.


    In general, R-Studio is catastrophically unsuitable for professional use.


    # Recovering Deleted Files under Ext3fs


    The ext3fs file system is ext2fs with logging support (in NTFS terminology, with
    transactions support). In contrast to ext2fs, it handles the directories array
    care-fully, and when a file is deleted, the reference to the inode is not destroyed.
    This should considerably simplify automated recovery of the original file names.
    Never, in ext3fs before file deletion the list of blocks belonging to that file
    is carefully cleared. As a result, recovery becomes practically impossible (Fig.
    8.8). Unfragmented files with meaningful contents (for example, the source code
    of some program) still can be reassembled by piece by piece; however, would require
    considerable time. Fortunately, indirect blocks are not cleared, which means that
    only the starting BLOCK SIZE bytes of each file are lost. On a typical 10-GB partition,
    BLOCK SIZE is usually 4 or 8 KB, which means that maximum losses will be about
    100 KB. According to contemporary interpretation, this is just a trifle. Most
    executable files simply won''t start without this 100 KB; however, finding the
    missing 12 blocks on the disk is a realistic job. If you are lucky, this is unlikely.
    Nevertheless, even on fragmented partitions continuing chains of 6-12 blocks are
    encountered enough often.


    How is it possible to act under these conditions? It is necessary to locate at
    least one block that is guaranteed to belong to the file and is located beyond
    the 100-KB boundary from its start. This might be a text string, the manufacturer''s
    copyright, or any other information. In brief, the block number is needed. For
    distinctness, let it equal to 0x1234. Write it in the inverse order so that the
    least significant bit is located at the smaller address, and search for 34h 12h
    00h 00h — the number that will be present in the indirect block. Indirect blocks
    are easily distinguished from all other (for example, from blocks belonging to
    data files) because an indirect block is an array of 32-bit blocks, increasing
    more or less steadily. Double and triple indirect blocks are found according to
    the same algorithm.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_228_0.png)'
