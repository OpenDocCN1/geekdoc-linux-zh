    # Initial Failure Diagnostics


    To proceed with manual data recovery, it is vitally important to first diagnose
    the possible cause of disk failure. The main symptoms of hard disk failure are
    briefly outlined in Table 5.1.


    Table 5.1. Main symptoms of hard disk failures


    | Symptom | Diagnosis | Corrective actions |

    | --- | --- | --- |

    | Hard disk is not recognized by the BIOS. | Electronic circuitry of the hard
    disk has failed. | |

    | Operating system doesn''t boot and BIOS displays an error message | Logical
    disks are not visible when booting from the diskette (the C: command results in
    an error message). | Either the partition table or the 55h Aa signature has been
    damaged. | Recover the MBR manually or using the GetDataBack utility. |

