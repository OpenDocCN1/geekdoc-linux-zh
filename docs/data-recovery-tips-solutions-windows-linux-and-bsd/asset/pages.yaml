- pgno: 102
  md: '# Chapter 5: Basic Concepts of Manual Data Recovery 89


    If the bootstrap loader is damaged, BIOS will be unable to start the operating
    system from such a disk; however, if you connect this disk as a slave (or boot
    from the diskette), all logical disks will be available. At least, they will be
    visible, because commands as C;, D;: and E are executed normally, although the
    dir command is not guaranteed to work. For that it, it is necessary to ensure
    that the following conditions are observed: First, the file system of an appropriate
    partition must be undamaged and known to the currently-running operating system.
    Second, the boot sector must not be damaged (this topic will be covered later
    in this chapter).


    The partition table — analyzed first by the master boot code and then by the logical
    driver of the operating system consists of four 10h records located at offsets
    1BEH, 1CEH, 1DE, 1EE bytes from the disk start. Each of them describes a logical
    partition, specifying its starting and ending sectors in CHS format. (Even if
    the disk operates in LBA mode, partitions are addressed through CHS mode.) The
    field storing the offset of the partition in relation to the partition table is
    an auxiliary, and its redundancy is obvious, which also relates to the field containing
    the total number of sectors on the disk, because it can be computed on the basis
    of the starting and the ending sectors. Some operating systems and loaders ignore
    auxiliary fields, but uses them actively because they must reflect the reality.


    The disk identifier field contains a unique 32-bit sequence that helps the operating
    system distinguish one disk from another. This sequence is automatically copied
    into the following registry key: HKLM\SYSTEM\Devices. Actually, Windows can do
    it therefore; the contents of this file are not critical.


    The Boot 1D ID field contains the identifier of the file system installed on the
    partition. For NTFS, this value is 07h. According to official specification, dynamic
    disks are assigned the 42h identifier value. Actually, this is true only for dynamic
    disks created by updating a normal partition to a dynamic one. Information about
    other dynamic disks is not stored in the partition table. Instead, this information
    is contained in the last megabyte of the physical disk, in the logical disk manager
    (LDM) database, and is invisible for standard disk managers. If you install any
    operating system of the Windows 9x family or any version of UNIX on the disk that
    contains dynamic volumes, which may be irreversibly lost because, according to
    the partition table, the space occupied by it is marked as free. Nevertheless,
    a bootable logical disk, whether or not it is a dynamic disk, must be present
    in the partition table; otherwise, BIOS will be unable to load it.'
