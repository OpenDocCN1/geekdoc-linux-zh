    and loss. In general, only a suicidal individual would try to install a SCSI device
    without proper knowledge and experience.


    # Summary


    If the number of devices that you are going to connect is not excessive, then
    ATA/SATA is the best choice for home use. The same relates to servers in small
    local area networks (LANs) serving the needs of small businesses. SCSI is arguably
    the best choice for high-performance workstations and servers with impressive
    disk arrays.'
