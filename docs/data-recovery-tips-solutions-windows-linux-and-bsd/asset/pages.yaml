  md: 'First, it is necessary to restore the original contents of the update sequence.
    The 16-bit pointer to the update sequence is located at the offset 04h from the
    sector start. In the preceding example, this pointer is equal to 2Ah (this means
    that you are dealing with NTFS 3.0 or an earlier version). Now consider what is
    located at the offset 2Ah. This is the 03 00 word — the update sequence number.
    Compare it to the contents of the last 2 bytes of the current and next sectors
    (offsets 1FEh and 3FEh, respectively). They are equal! This means that file record
    is intact (at least, it appears to be), and it is possible to start retrieving
    data. At the offset 2Ch, the array containing original update sequence values.
    The number of elements in this array is equal to the contents of a 16-bit field
    located at the offset of 06h minus one, counted from the sector start (in this
    case, 03h - 01h == 02h). Retrieve two words starting from the 2Ch offset (in this
    case, they equal 00 00 and 00) and write them to the end of the first and the
    last sectors.


    Now, you need to find out whether this file record is in use or the directory
    associated with it has been deleted. The 16-bit field located at the 16h offset
    contains the value 01h. Consequently, this is a directory that hasn''t been deleted
    yet. You also need to find out this is a base file record for the given file or
    it is a continuation. The 64-bit field located at the 20h offset is equal to zero,
    which means that this is a base file record.


    Now, it is time to investigate the attributes. The 16-bit field located at the
    14h offset is equal to 30h; consequently, the header of the first attribute starts
    from the offset 30h from the sector start.


    The first double word of the attribute is equal to 10h, which means that you are
    dealing with the $STANDARD_INFORMATION attribute. The 32-bit field of the attribute
    length located at the offset of 04h and, in this case, equal to 60h allows you
    to compute the offset of the next attribute in the attribute: 30h (offset of the
    current attribute) + 60h (length of the current attribute) == 90h (offset of the
    next attribute). The first double word of the next attribute is equal to 30h,
    which means that this is the $FILE_NAME attribute. The next 32-bit field stores
    its length, which in this case is equal to 70h. Adding the attribute offset to
    its length, you obtain the offset of the next attribute: 90h + 70h == 100h. The
    first double word of the third attribute is equal to 80h; consequently, this is
    the $DATA attribute storing the main data of the file. Add its offset to its length:
    100h + 32h == 132h. Oops! You have encountered FFFFFFFF (see Listing 6.4), which
    signals that the $DATA attribute is the last attribute in the list.'
