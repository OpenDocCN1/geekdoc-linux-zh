- pgno: 242
  md: '# Chapter 8: Data Recovery under Linux/BSD 229


    +   - The fs_cstotal superblock structure (the number of free inodes and data
    blocks within the partition) is modified.


    +   - In the cylinder group, bitmaps of occupied inodes and data blocks are modified.
    Inode and all data blocks of the file deleted are marked as released.


    +   - In the inode of the parent directories, the fields of last access and modification
    times are modified.


    +   - In the inode of the parent directory, the last modification time field is
    changed.


    +   - In the inode of the file deleted, the di_mode (IPMT, permissions), di_link
    (number of references to the file), and di_size (file size) fields are reset to
    zero.


    +   - In the inode of the file deleted, the di_db (array of pointers to the first
    12 blocks of the file) and di_ib (pointer to the indirect blocks) fields are brutally
    overwritten with zeros.


    +   - In the inode of the file deleted, the last modification and inode change
    fields are reset to zero; the last access time field remains intact.


    +   - The di_sparse field in the inode of the file deleted is updated. In the
    source code, it is marked as Reserved; currently unused; however, if you view
    the dump, you''ll discover that this is not so. To all appearances, this field
    stores something like an update sequence used for controlling inode integrity;
    however, this is only an assumption.


    +   - In the directory of the file deleted, the size of the preceding direct structure
    is increased by the d_recl value. As a result, it "merges" with the name of the
    file deleted. Nevertheless, at least immediately. The file name is overwritten
    only when it becomes necessary.


    # File Recovery Tools


    After unintentional deletion of one or more files, dismount the volume immediately
    and start the sector-level disk editor. For example, it is possible to use the
    well-known lde editor ported to BSD. Unfortunately, its operation is unstable
    on my system (4.5 BSD) and doesn''t display the main data structures in easily
    readable form, although UFS support is declared. Provided that you have a sufficient
    amount of free space, it is possible to copy the volume into a file and work with
    it using any hex editor (BIEW, for example) or open the partition device directly'
  merge: -1
  img_proc: true
- pgno: 243
  md: '(for example, as follows: /dev/ad0s1). As a variant, it is possible to insert
    any bootable CD-ROM with Windows PE into the CD drive and use any Windows editor,
    such as Microsoft Disk Probe or Runtime DiskExplorer. The same is true for Norton
    Disk Editor started from the bootable MS-DOS diskette (although it doesn''t support
    large disks and SCSI devices). Finally, it is possible to start KNOPPIX or any
    other Live Linux CD oriented toward data recovery (although, most recovery distributions
    — Frenzy 0.3, in particular — do not contain disk editors).


    As you can see, there are lots of recovery tools from which to choose.


    # Technique of File Recovery


    I''ll start the description of the file-recovery technique with the bad news.
    Because in the course of file deletion the references to the first 12 direct blocks
    and 3 indirect blocks are irreversibly overwritten, automated data recovery is
    impossible. The deleted file can be found only by its contents. The search must
    be conducted within the free space. This is where the bitmaps located after the
    end of the descriptor of the cylinder group come on the scene.


    If you are lucky and the file turns out to be unfragmented (recall that on UFS,
    as already mentioned, either the fragmentation is negligible or there is no fragmentation),
    the recovery will be a matter of your skills. Simply select the chosen group of
    sectors and write it to the disk (however, not to the partition being recovered).
    For example, you can transmit the file to another computer through the network.
    Unfortunately, the length field of the file is ruthlessly overwritten in the course
    of file deletion; therefore, the actual size of the file must be guessed. This
    sounds more frightening than it is. The unused tail of the last fragment is overwritten
    by zeros, which serves as a good guiding line. The only problem is that some types
    of files contain a certain number of zeros in their tails, and if these are discarded,
    some files might become unusable; therefore, you''ll have to conduct some experiments
    here.


    What if the file is fragmented? You''ll have to manually reassemble the first
    13 blocks (note that these are blocks, not fragments). In the ideal case, this
    will be one contiguous region. The situation is much worse if the first fragment
    is located in a "foreign" block (in other words, the one that is partially occupied
    by another file and the remaining 12 blocks are located in one or more regions).
    It is difficult to imagine a situation, in which the starting 13 blocks would
    be highly fragmented (UFS supports background defragmentation). This can happen
    only if many files'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'are “regrouped,” which almost never occurs in real life (perhaps, only when
    you decide to establish the order on your hard disk). In other words, assume that
    the 13th block of the file has been found. It won''t fit within the array of direct
    addressing (only 12 blocks are contained there); the reference to it, as well
    as references to all further blocks of the file, must be contained in the indirect
    blocks, which in the course of file deletion are marked as free but are not overwritten.
    Most files have only one indirect block, which considerably simplifies the task
    of recovery.


    How is it possible to find this block on the disk? Compute the offset of 13th
    block from the file start of the cylinder proper, translate it into fragments,
    write the resulting number in invers order (so that the least significant bytes
    occupy the smaller addresses), and carry out a context search over the free space.


    It is easy to distinguish an indirect block from all the other data types, because
    it is an array of pointers to a block, terminated with zeros. It only remains
    to retrieve these blocks from the disk and write to a file, truncating the file
    to the required length. Pay attention! If you have found several candidates of
    the deleted file from different files at different times (which probably will
    be the case), the 13th block of the deleted file been overwritten, but not all
    indirect blocks were overwritten. How do you distinguish “your” block from the
    “foreign” ones? If at least one of the references points to the already-occupied
    data block (which can be easily determined using the bitmap), such a block can
    be discarded immediately. The remaining blocks are sorted manually until you obtain
    a usable copy of the recovered file. The file name can be retrieved from the directory,
    provided that it hasn’t been overwritten yet. When recovering several files, it
    is impossible to unambiguously state, which name belongs to which file. However,
    this is better than nothing. Directories are recovered in the same way as normal
    files, although to the truth, there is nothing to recover except for file names.


    It is generally agreed that the preceding method of data recovery has lots of
    limitations. In particular, when deleting many highly-fragmented binary files
    it fails. You'' waste lots of time, but it is unlikely that you would find anything
    useful among the heap of file system wreckage. However, there is no other way
    out (except for the backup copy, which might also be missing). Therefore, this
    technique is useful.


    # Tuning the File System for the Best Performance


    In contrast to Windows, Linux supports an entire range of file systems, differing
    in their properties, performance, and goals: Minix, ext2fs, ext3fs, ReiserFS,
    XFS, JFS, UFS, FFS, and so on. Which file system would you choose? How would you
    tune'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'the chosen file system for the best performance? The standard settings suggested
    by the compilers of distribution set are not always optimal. System performance
    can be considerably improved if you change the default settings.


    A hard disk is a sophisticated and reliable device. It is fast, but the processor
    is still faster. The disk subsystem, despite efforts of engineers, remains the
    slowest component, which restrains the performance of the entire computer system.
    With all that being so, the amounts of data being processed are growing steadily.


    Most motherboards released after 2000 have an integrated RAID controller, supporting
    two RAID modes: RAID-0 (the "stripe" mode, in which the data are written simultaneously
    to several hard disks) and RAID-1 (the "mirror" mode, in which hard disks serve
    as "mirror" copies of each other). The stripe mode increases performance, because
    two disks operate approximately 1.5 times faster and four disks approximately
    3.5 times faster than a single disk.


    Owners of kernels version 2.4 or higher can use the software RAID, which is practically
    as fast as the hardware RAID but slightly increases the processor workload. Older
    kernels (which are practically out of nowadays) will probably require you to install
    additional software. More details on this topic can be found at the following
    address: http://www.tldp.org/HOWTO/Software-RAID-RA-HOWTO.html.


    Most manuals strongly recommend connecting software RAID to different IDE channels;
    in other words, move the disks apart, connecting them to different cables. The
    problem is that a typical motherboard has only two IDE channels, and least one
    optical drive is needed in addition to hard disks. To achieve the highest performance,
    it is necessary to purchase a motherboard with several IDE channels. Nothing can
    be done about it, because optimization requires additional expenses. In particular,
    EPOX 4PCA3+ has as many as six IDE channels; however, not every user can afford
    to purchase it. In practice, it is possible to combine two hard disks on the same
    cable. This doesn''t represent a serious problem, because they can work in parallel
    (although the operating speed will still drop by approximately 15%). Contemporary
    drives release the bus for the time required for executing slow operations. Nevertheless,
    a single bus must be shared between two drives, which have to compete for this
    resource. The combination of a hard disk and an optical drive on the same bus
    is not recommended, because in some cases the operating speed will decrease several
    times (if this is the case, to disable the DMA mode for the CD drive — this probably
    would help your hard disk drive operate faster). Several examples illustrating
    variants of configurations for implementing software RAIDs are shown in Figs 8.13
    through 8.15.'
