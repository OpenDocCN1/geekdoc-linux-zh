    # Disk Structure Basics


    Physically, the hard disk is a hermetically-sealed case containing one or more
    single-or double-sided plates, rotated on a spindle. Data are read and written
    by a block of magnetic heads, each serving one of the platter surfaces. Information
    is stored in the form of concentric rings called *tracks*. Tracks located at an
    equal distance from the center of all platters form a cylinder. A track fragment
    obtained by radial division is called a sector. In contemporary disks, the number
    of sectors per track is not constant. On the contrary, it grows directly with
    the distance from the platter center to support constant linear sector sizes.
    Tracks and heads are numbered starting from zero, and sector numbering starts
    from one. For hard disks, the sector size is equal to 512 bytes.


    The first sector-addressing method that hard disks inherited from diskettes is
    CHS addressing. CHS stands for cylinder–head–sector and appeared for economical
    reasons. Formerly, coordinates of the addressed sector directly corresponded to
    physical reality. This simplified the structure of the disk controller, reducing
    its price, because no intellectual behavior of the controller was required. However,
    low price is the only advantage of this method. All other features of CHS are
    disadvantages. This addressing method is horribly inconvenient for programmers,because
    sequential disk reading requires three nested loops. In addition, it is notoriously
    sluggish. The number of sectors in track must be constant for the entire disk,
    and for new disks this is not so. Therefore, to preserve backward compatibility
    with existing software, the disk controller virtualizes the disk geometry. This
    makes you depend on the chosen translation method and the translation method an
    internal matter, because of which it hasn''t been standardized. Disk parameters'
