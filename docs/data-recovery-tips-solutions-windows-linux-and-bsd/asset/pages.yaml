    a fresh copy of a Windows NT-based operating system on it. When proceeding with
    this way, bear in mind that all information related to redundant array of independent
    disks (RAID) software created by Windows NT 4.0 or earlier versions is contained
    in the system registry. Therefore, this information will not be available when
    the disk is moved to another system. Dynamic disks introduced with the release
    of Windows 2000 store their attributes in the fixed disk locations; therefore,
    they are not bound to their “native” system. However, the situation is worse for
    encrypted files. The encryption key is deeply nested within the user profile,
    and retrieving files under another system becomes impossible. Note that if you
    create a user with the same name and password, this problem won''t be solved because
    the encryption key is randomly generated by the operating'
