  md: '# Chapter 2: Essential Tools


    ![](img/1ce3cead9a6814cc94d1e00101c20220_32_0.png)


    Even if you have skilful hands and bright mind, it is impossible to succeed in
    the difficult job of data recovery without a specialized toolset. Ideally, you
    must be prepared to develop everything that you require on your own. Data recovery
    is assiduous, tedious work, so if you need to reanimate a large disk (approximately
    80–120 GB in size) you cannot do without automation. The main drawback of all
    automated tools known as disk doctors is the lack of a built-in language or at
    least an advanced system of macro commands. Naturally, before you start automating
