    I have seen in practice, the situation is such as I have described.


    # SCSI versus SATA


    Some hard and optical drives support ATA interfaces and ATA packed interfaces
    (ATAPI) — that is, IDE; other models support SCSI. The arrival of serial ATA (SATA)
    change the balance of forces in this field? It is impossible to predict the future;
    however, in this section I''ll try to provide an answer to this question by comparing
    the functional capabilities of these two interfaces.


    The long-running “star wars” between SCSI and the ATA interface continue. The
    last revisions of the ATA standard approach SCSI closely closely in functional
    capabilities; however, the standard has a long way to go before achieving final
    victory. SCSI was initially designed according to the rule that required the developers
    to choose the goods, no matter what the price might be. It has occupied strong
    positions on the high-end server market and isn''t going to lose these positions.
    ATA, on the other'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Chapter 3: How to Choose Hard Disks 59


    hand, was designed as a low-end solution for single-user machines. Despite technological
    advances and improvements, it remains an ideologically flawed interface.


    Still, if the functionality provided by ATA satisfies your requirements, why overpay
    for SCSI?


    # The Technological Tower of Babel


    SCSI, ATA, ATAPI, IDE, EIDE — even experienced specialists have difficulties understanding
    the details of this heap of technologies. I''ll try to explain them in simple
    terms.


    SCSI stands for small-computer system interface. By design, it is an intellectual
    controller integrated directly into the peripheral device and supporting a unified
    set of control commands common for all devices of this type. SCSI is a minicomputer,
    but its power is comparable to Intel 80486. When SCSI was just coming into being,
    this was a considerable technological advance and an adventurous step. Before
    the arrival of SCSI, each device had its own system of commands, and this system
