    with an apparently similar hardware configuration, are not rare. Writing a driver
    is not enough; it is necessary to debug and test it on many hard-configurations,
    as well as provide technical support to potential users. Other-wise, it will not
    be a fully-functional driver; rather, it will be a hacker''s toy. These actions
    require time and effort. Thus, if a custom driver was developed for individual
    use only, and not for commercial purposes, then its reliability and compatibility
    are far from perfect.


    The specialists that compose distribution sets carry out tremendous amounts of
    work, collecting various drivers and compiling them. However, the quality of testing
    is far from perfect, and even if the list of supported hardware contains an entry
    for a specific device, this does not necessarily mean that this device would work
    on your machine. The driver from some other model might be suitable. However,
    it is equally possible that no driver would work. Life without drivers is sad.


    # Emulators


