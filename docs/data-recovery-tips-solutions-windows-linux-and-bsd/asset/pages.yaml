- pgno: 223
  md: '# 210 Part II: Automated and Manual Hard-Disks Data Recovery


    When a file is deleted, the operating system finds the corresponding record in
    the directory, resets the inode field to zero, and increases the size of the preceding
    record (the `n_len field`) by the value of the record being deleted. In other
    words, the deleted record is merged into the previous record. Although the file
    name remains intact for now, the reference to the inode corresponding to it is
    deleted. Thus, it becomes necessary to understand, which names belong to which
    file.


    Considerable changes also take place in the inode when the file is deleted. The
    number of references (`i_links_count`) is reset to zero, and the time of last
    deletion is updated (`i_dtime`). All blocks belonging to the file are marked unused
    in the map of the free space (block bitmap), after which this inode also is released
    (inode bitmap).


    # Technique of Recovering Deleted Files


    In ext2, complete recovery of deleted files is impossible, even if the file was
    deleted recently. In this respect, it is beaten by FAT and NTFS. At the least,
    the file name is lost. To be more precise, the relation between file names and
    their contents is lost. When a small number of well-known files are deleted, this
    can be tolerated (because the names have been saved). However, what should you
    do if you have deleted several auxiliary subdirectories, which you have never
    viewed?


    Quite often, inodes are assigned in the order, in which the records in the directory
    table are created. In addition, there are file name extensions (C, GZ, MPG, and
    so on); the number of possible combinations of mappings is typically not too large.
    Nevertheless, recovery of the deleted root directory in the automated mode is
    possible. Note that NTFS, in contrast, allows you to do this with few troubles.


    In general, the recovery strategy appears approximately as follows: Scan the inode
    table and select all records, for which the `i_links_count` field is zero. Sort
    all these files by the deletion date so that the files were last to be deleted
    have the highest positions in the list. As a variant, it is possible to use the
    filter (if you remember the approximate time of deletion). If the respective inodes
    were not overwritten by newly-created files, retrieve the list of direct and indirect
    blocks and write them into the dump, correcting the dump size to take into account
    “logical” file size, for which the `i_size` field is responsible.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Chapter 8: Data Recovery under Linux/BSD 211


    # Recovery Using Linux Disk Editor


    Open the partition being edited or its file copy: `lde my_dump` or `lde /dev/sdb1`.
    The editor automatically determines the type of the file system (ext2fs, in this
    case) and prompts you to press any key to continue. After you proceed as prompted,
    the editor would automatically switch to the superblock mode and prompt you to
    press the <I> key to switch to the inode mode, or the <B> key to switch to the
    block mode. Press <I>, and you''ll find yourself in the first inode describing
    the root directory. To view the next inode, press <Page Down>. If you need to
    return to the previous inode, press <Page Up>. View all nodes from top to bottom,
    paying special attention to the LINKS field. For deleted files, this field is
    equal to zero, and the DELETION field specifies the time of the deletion (note
    that you must remember, or write down, the deletion time for the required files).
    Having a suitable inode, move the cursor to the first block in the DIRECT blocks
    list and press <F2>. Choose the Block mode, viewing block under cursor command
    from the menu (or immediately press the <Shift+B> keyboard shortcut).


    The editor will move to the first block of the deleted file. Viewing its contents
    in the hex mode, try to define whether this file is the required one. To return
    to the next inode, press <I>. To recover the file, press <Shift+R>, press <R>,
    and then specify the dump file name for recovery.


    It is also possible to recover files by their contents. For example, you might
    know that the deleted file contains the `hello, world` string. Press <F>, then
    press <> to search all blocks. Then including deleted ones. (As a variant, it
    is possible to start the editor with the --all command-line option.) Press <B>,
    when the editor switches to the block mode, press </> and specify the American
    Standard Code for Information Interchange (ASCII) string for searching. Having
    found the required block, scroll from top to bottom and make sure that it actually
    belongs to the required file. If it does, press <Ctrl+R> to make the editor view
    all inodes containing the link to this block. The number of the current inode
    is displayed at the bottom of the screen. (Note that the top of the screen displays
    the number of the last inode viewed in the inode mode.) Switch to the inode mode
    by pressing the <I> key, then press <#> and supply the number of the inode that
    you need to view. If the deletion data corresponds to what you need, press <Shift+R>
    and then <R> to save the dump on the disk. If this is not the case, then return
    to the block mode and continue the search.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Part II: Automated and Manual Hard-Disks Data Recovery


    In complicated cases, when the list of direct and/or indirect blocks is destroyed,
    it becomes necessary to reassemble the file recovered piece by piece, based on
    its contents and partially on the disk-space allocation strategy adopted in the
    given file system. When doing this, use the <W> key, which instructs the editor
    to add the current block to the dump file. View all free blocks by one (the free
    blocks marked by the NOT string); having located a suitable one, add it to the
    end of the file. It is impossible to recover a highly-fragmented binary file this
    way. However, this technique might be helpful when recovering program listings.


    The conclusion that can be drawn on the basis of these considerations is as follows:
    Manual file recovery using Ide is a tedious and slow process. However, this, the
    process is the most "transparent" and reliable. As relates to recovery of original
    file names, this is the best technique uses debugs.


    # Recovery Using Debugfs


    Load the partition edited or its copy into the debugger by issuing the commands
    debugs my_dump or debugs /dev/sdb1. If you plan to write to the disk, it is necessary
    to specify the -w command-line option (debugs -w my_dump or debugs -w /dev/sdb1).


    To view the list of deleted files, issue the lsdel (or lsdel_sec, where t_sec
    is the number of seconds elapsed since the time of the deletion). The screen will
    be filled with the list of deleted files. The files will be listed without names.
    Files that were deleted earlier than t_sec ago (if you have specified the deletion
    time) won''t be listed.


    The cat <N> command displays the contents of the text file on the terminal. Here,
    <N> is the inode name enclosed in the angle brackets. When displaying files, the
    screen displays a message, and such files must be flushed into the dump using
    the dump <N> new_file_name command, where new_file_name is the fully-qualified
    name of the file, under which it will be written to the native file system - in
    other words, into the file system, under which the debugfs debugger was started.
    The --w command-line option is not needed to achieve this goal.


    If desired, you can restore the file directly on the file system being recovered
    (which is especially convenient when recovering large files). In this case, the
    undel <N> undel_file_name command will be useful, where undel_file_name is the
    name that will be assigned to the file after recovery.'
