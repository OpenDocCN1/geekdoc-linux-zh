  md: '# Chapter 6: New Technology File System — Inside and Out


    # The $ATTRIBUTE_LIST Attribute


    The attribute list attribute is used when not all file attributes can fit within
    the base file record, and the file system must place them in extended file records.
    Indexes of extended file records are contained in the attribute list attribute,
    which is placed into the base file record.


    Under which circumstances does this happen? Such a situation arises if one of
    the following is true:


    +   - The file contains lots of alternative names or hard links.

    - The file is strongly fragmented.

    - The file contains an overly complicated security descriptor.

    - The file has too many data streams (for example, $DATA attributes).


    The structure of the $ATTRIBUTE_LIST attribute structure is briefly outlined in
    Table 6.8.


