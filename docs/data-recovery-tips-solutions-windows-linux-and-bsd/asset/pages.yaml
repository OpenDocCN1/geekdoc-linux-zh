  md: '# Chapter 10: Recovering CDs 265


    Change the PMin:PSec:PFrame fields belonging to point A2h so that they point to
    the end of the disc (A2h represents the lead-out). The changed lead-out may appear
    as follows: 74:30:00. The lead-out address must be chosen so that a gap of at
    least 30 seconds remains between it and the external disc edge. It is even better
    if the width of the lead-out is around 90 seconds. However, in this case the last
    tracks of the disc being restored will be lost.


    The contents of the PMin:PSec:PFrame fields belonging to point 01h (the starting
    address of the first track) must be increased by the same value that was added
    to the corresponding lead-out fields. For example, the modified variant might
    appear as follows: 74:01:42. (74:30:00 / * new lead-out address / - 00:29:33 /
    * old lead-out address*/ + 00:01:00 / * starting address of the first track *
    / = 74:01:42 / * new starting address of the first track *). The new version of
    the CD file must appear as shown in List 10.3.


    # Listing 10.3. A key fragment of the "reanimating file" for 75-minute CD-RWs


    [Entry 2] [Entry 3]

    Session = 1 Session = 1

    ...

    PMin = 74 PMin = 74

    PSec = 30 PSec = 01

    PFrame = 00 PFrame = 42


    To be accurate, it would be desirable to edit the LBA (the LBA is related to the
    absolute address by the formula: LBA == ((Min*60) + Sec)*75 + Frame). However,
