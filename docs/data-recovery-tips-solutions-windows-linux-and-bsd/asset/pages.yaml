  md: '# # Chapter 6: New Technology

    File System — Inside and Out


    ![](img/1ce3cead9a6814cc94d1e00101c20220_136_0.png)


    This chapter will consider the main data structures of NTFS, which determine its
    basic underlying concepts — MFTs, file records, update sequences or fixups, attributes
    or streams, and data runs.


    Without a sound understanding of these basic concepts, working with disk editors
    is impossible, to speak nothing about manual or semiautomatic data recovery.


    # ## Introduction


    A generally-adopted approach describes NTFS as a complicated relational database,
    overwhelming entire generations of investigation beginners with the grandeur of
    its architecture. NTFS is similar to a vast labyrinth covered in darkness, where
    it is so easy to get lost. Hackers, however, long ago demystified its main data
    structures and shed the light of many torches on the corridors that are the backbone
    of the vast labyrinth. Side paths are less known and still are covered with darkness.
    They are keeping their deadly traps (the processing of seemingly well-known data
    structures), awaiting bold investigators. Generally, a simple utility for reading
    NTFS volumes can be written and debugged within a single evening. It won''t take'
