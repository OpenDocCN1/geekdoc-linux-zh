    Fig. 8.10. Sequential groups of cylinders


    Addressing is implemented either in physical offsets measured in bytes and counted
    from the start of the group of cylinders (or, rarely, from the start of the UFS
    partition) or in the number of fragments duplicated from the same point. Assume
    that the block size is 16 KB, split into eight fragments. In this case, sector
    69 will have an offset equal to 512 * 69 = 35328 bytes or 1024 * ((16/8)/512)
    * 69 = 276 fragments.


    The boot sector is located in the beginning of the partition. after which there
    are one or more groups of cylinders (Fig. 8.10). To be on the safe side, the copy
    of the superblock is duplicated in each group. The boot sector is not duplicated,
    however, because of unification considerations. Space is allocated for it; as
    a result, relative block addressing in each group remains unchanged.


    In UFS, the superblock is located at the offset 8192 bytes from the start of the
    partition, which corresponds to 16th sector. In UFS2, it has been moved 65,536
    bytes (128 sectors) from the start, releasing space for the disk label and the
    operating system initial loader. For truly large systems (in the source code,
    they are called piggy), there is a possibility of moving the superblock to the
    262,144-byte address (as far as 512 sectors).'
