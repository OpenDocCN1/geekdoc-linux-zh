- pgno: 191
  md: '# What Happens in the Course of Formatting


    Disk formatting is a complex operation comprising multiple stages. It is more
    complicated and has more stages than it might appear at first glance. If you have
    ever written custom diskette formatters (by the end of the 1980s, practically
    all pro-grammers wrote such tools), you understand me. To begin the investigation
    of the formatting process, consider the NTFS volume structure (the technique of
    recovering NTFS volumes formatted for FAT16/32 will be provided later in this
    section).


    When you use the format X: /U FS:NTFS command, the following changes are introduced
    into the file system of disk X: (a GUI utility called from the Windows Explorer
    context menu formats the disk using a similar method):


    +   1. The NTFS boot sector is formed.


    +   2. The new disk serial number is generated and written into the boot sector
    at the offset 48h bytes from its start.


    +   3. The next checksum is computed for the boot sector and stored at the offset
    50h bytes from its start (see “Boot Sector Basic Concepts” in Chapter 5 for more
