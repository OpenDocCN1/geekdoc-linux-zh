- pgno: 143
  md: 'To reference a file record from another file record, its ordinal number (or
    index) within the $MFT file is used, counting from zero. The file reference comprises
    two parts (see Table 6.2) — a 48-bit index and a 16-bit sequence number.


    When a file or directory is deleted, its respective file sequence is marked as
    unused. When new files are created, records marked as unused can be employed again,
    in which case the counter of the sequence numbers is incremented by one. This
    mechanism allows you to to trace "dead" links to files that have already been
    deleted. The sequence number stored within the file reference will be different
    from the sequence number of the appropriate file record (checked by the ChkDSk
    utility but, as far I know, not automatically).


    # Table 6.2. File reference structure


    | Offset | Size (bytes) | Description |

    |---|---||

    | 00h | 6 | File record number, counted from zero |

    | 06h | 2 | Sequence number |


    The first 12 records in MFT are always occupied by auxiliary metabases: $MFT,
    $MFTMirror ($MFT mirror), $LogFile (transaction log file), $Volume (information
    about the volume), $AttrDef (defined attributes), (root directory), $Bitmap (map
    of available free space), $Boot (system loader), $BadClus (list of bad clusters),
    and so on. More details about these metabases are provided in Table 6.11.


    The first four records are very important; therefore, they are duplicated in the
    special $MFTMirror file, which is stored approximately in the middle of the disk
    (see Fig. 6.2). The exact position of the $MFTMirror file is stored in the boot
    sector at the offset 38h name from its start. Despite its name, $MFTMirror is
    not a mirror of the entire $MFT file. It is only a copy of its four starting elements.


    Records 12 to 15 are marked as unused, although, in reality they are empty. As
    you can easily see, they are reserved for future use. Records 16 to 23 are not
    used and are honestly marked as unused.


    Starting from record 24, there are records for user files and directories. Four
    metabases introduced with Windows 2000 $ObjId, $Quota, $Reparse, and $UsnJrnl
    — reside in any record with a number equal to or greater than 24 (recall that
    numbering of file records starts from zero).


