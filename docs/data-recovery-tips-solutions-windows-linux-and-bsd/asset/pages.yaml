  md: '# Chapter 4: Repairing Hard Disks


    # Hard Disk Internals


    The hard disk is made up of the hermetically sealed block and a printed circuit
    board (PCB). The hermetically-sealed block contains the spindle drive rotating
    a pack of one or more magnetic platters (which earlier was controlled by a step
    motor that has been replaced by the device called a voice coil) as well as a read/write
    preamplifier switch mounted on the chip, directly on the platters block, or on
    a separate board near it. If it is on a separate board, the switch can be replaced
    without dismounting the block of platters, which considerably simplifies repair
    procedures.


    The electronic board (Fig. 4.1) includes the following components: spindle drive
    controller; read/write channel; microcontroller, which is the “heart” of the hard
    disk; and disk controller, responsible for serving the ATA interface.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_80_0.png)


    Fig. 4.1. The flowchart of a typical hard disk'
