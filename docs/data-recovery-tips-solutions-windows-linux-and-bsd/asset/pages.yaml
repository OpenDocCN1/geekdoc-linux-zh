    ```


    Perfidious Windows displays the contents of the last session. The contents of
    all other disc sessions are unknown (at least, for the moment). Well, the total
    size of nine files available to the operating system is 72 MB (76,082,156 bytes),
    and the total size of all disc sessions is 47.66 + 6.50 + 8.21 + 8.04 + 6.91 +
    10.62 + 9.04 + 9.10 + 9.22 + 9.46 = 124.76 MB, which is 55 MB longer.


    The Written Sectors field, containing the length of the written disc area, which
    in this example is almost 255 MB, is useless for your count, because the area
    of the disc contains not only useful data but also auxiliary data for each session.
    As a result, the actual disc capacity is always smaller than its effective capacity,
    even if the disc doesn''t contain deleted files.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_271_0.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'For the moment, it is impossible to tell, which session contains the deleted
    files. They can be present in any of the sessions or even in several sessions
    simultaneously. Thus, in general, all sessions present on the disc may be viewed
    sequentially. However, sometimes it is possible to find faster and easier ways.
    In the example being considered, the number of sessions present on the disc is
    larger than the number of files displayed by the dir command one by one and the
    sizes of the last nine sections are practically equal to the sizes of the files
    that correspond to them. The first session of the disc is 48 MB, which does not
    correspond to any visible files. What does it contain? To discover the contents
    of this session, mount it to a separate volume. Unfortunately, built-in Windows
    tools do not allow mounting directly. You can bypass this limitation by writing
    the session into an ISO image and burning it to a new CD-R or CD-RW. (It is better
    to use a CD-RW for such experiments, because discs can be used multiple times.)
    A more convenient way of achieving this is to use Alcohol 120%, which dynamically
    mounts ISO images to a virtual CD-ROM, saving lots of time. Unfortunately, Alcohol
    120% doesn''t provide the possibility of choosing the sessions being saved and
    always places the contents of the entire disc into the image being created. Because
    of this drawback, this utility is not enough to carry out all experiments described
    here.


    Return to Roxio Easy CD Editor. Double-click the first session or select it with
    the cursor and click the Read Track button. The Save As dialog will appear immediately
    (Fig. 10.2).


    ![](img/1ce3cead9a6814cc94d1e00101c20220_272_0.png)


    Fig. 10.2. The dialog allowing you to retrieve the session with the default settings'
  merge: -1
