- pgno: 14
  md: '# Preface


    Data destruction is the worst thing that could happen to your computer. This might
    be caused by different problems. An operating system crash, viruses, unintentional
    data deletion, disk formatting, media defects, and many other events might lead
    to these deplorable results. Fortunately, in many cases it is possible to recover
    your data, provided that you know how to do this.


    This book is a step-by-step guide to data recovery, with lots of useful tips and
    a large amount of reference information. The book covers hard disks, and Windows
    and Linux file systems (NTFS, ext2fs, ext3fs, ISO9660, and UFS).


    The book is mainly oriented toward professionals in the field of emergency data
    recovery and toward system administrators. However, this doesn''t mean that users
    won''t find anything interesting here. Especially for users, I have provided many
    ready-to-use solutions, which can be easily applied even by beginners or kids.


    When writing this book, I aimed at achieving three main goals: first, comprehensive
    reference information about the structure and operating principles of the most
    popular file systems; second, demonstrate techniques of automated data recovery
    using specialized utilities intended for correcting minor damage; and, finally,
    explain techniques of manual recovery, indispensable in cases of total data destruction
    when automated tools cease to help.


    This book is based on my experience and on the experience of specialists from
    ACE Lab, one of the world leaders in the field of data recovery. The techniques
    described here haven''t been published in the literature yet, and they are now
    available only to the narrow community of specialists. Material published in this
    book is oriented toward two categories of readers: advanced users capable of intuitively
    navigating interfaces of automated data recovery utilities and true professionals
    who'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Preface:


    constantly or episodically encounter the need to recover damaged data. Program-mers,
    system administrators, and other categories of users will also find lots of use-ful
    information here.


    It is necessary to point out that special literature covering the urgent topic
    of data recovery is needed badly. Thousands of businesses, from small ones to
    large corporations, offer their services in this sector of the market. Even in
    small towns, there are lots of users who constantly lose their data and would
    pay any sum to get them back. However, qualified specialists are few. At the same
    time, automated utilities do more damage than help in unskilled hands, but techniques
    of manual data recovery are not known to everyone. So proceed with gaining knowledge!


    The CD supplied with this book contains free versions of utilities intended for
    data recovery, a vast amount of reference information, and color illustrations
    and source code for all freeware programs provided in the book. Feel free to use
    this code.'
  merge: -1
  img_proc: true
