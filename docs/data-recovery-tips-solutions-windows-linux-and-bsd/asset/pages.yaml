  md: '# Chapter 7: NTFS Data Recovery 179


    +   6. The new /$MFT:$BITMAP file is created, which is responsible for the use
    of file records in MFT. All existing records are labeled as available; however,
    they are not deleted physically, because the FileRecord.flags remains intact.
    Because of this circumstance, the recovery process is considerably simplified.
    Usually, the $MFT:$BITMAP file is placed in its original location (in other words,
    between the boot sector and the MFT), and its original content is filled with
