  md: '# Update Sequences


    As vitally important components of the file system, $MFT, INDEX, and $LogFile
    need some mechanism of controlling the integrity of their contents. Traditionally,
    error correction and detection codes are used; however, when NTFS was under construction,
    processors weren''t as fast as those available nowadays. Consequently, computation
    and analysis of correcting codes took considerable time, which significantly reduced
    file system performance. Therefore, NTFS developers had to abandon this approach.
    Instead, they had to employ so-called update sequences, also known as fixups.


    The end of each sector makes up a file record (INDEX Record, RCRD Record, or RSTR
    Record) contains a 16-byte update sequence number, duplicated in the header of
    the file record. In the course of every read operation, the header of the sector
    are compared with the appropriate header field. If the NTFS driver detects any
    difference, this file record is considered invalid.


    The main goal of the update sequence is to detect write interruptions. For example,
    if the supply voltage is interrupted unexpectedly in the course of a operation,
    part of a file record might be updated and another part might retain its previous
    value (recall that a file record completes two sectors). After the power is restored,
    the file system driver will be unsure whether or not the write operation completed
    successfully. This is the situation, in which update sequences are helpful. When
    the sector is overwritten, the update sequence increases by one, so if the write
    operation is interrupted, the update sequence value in the file record header
    does not match the update sequence in the end of the sector.


    Original content located "under" the update sequence is stored in a special sequence
    array, which is located in the file sequence header directly after the end of
    the update sequence number. To restore the file record, it is necessary to retrieve
    from the header pointer to the sequence number (stored at the offset 04h bytes
    from the header start) and compare the 16-byte value located at that address to
    the last word of every sector that makes up the file record (INDEX Record, RCRD
    Record, or RSTR Record). If these values do not match, the respective data structure
    is damaged and be used with care and caution (if at all).


    At the offset 06h bytes from the sector start, there is a 16-bit field storing
    the total size of the update sequence number, with the update sequence array,
    (sizeof(update sequence number) + sizeof(update sequence array)), expressed in
    words (not in bytes). Because the size of the update sequence number'
  merge: -1
  img_proc: true
