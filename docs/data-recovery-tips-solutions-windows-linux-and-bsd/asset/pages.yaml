    has survived this disaster, then utilities like R-Studio, GetDataBack, and EasyRecovery
    would recover them without fail.


    Analysis shows that the main reason ChkDisk might refuse to check the volume is
    corruption of the file record describing MFT. Such a result is highly probable
    if the computer is powered down in the course of updating MFT, especially if the
    hard disk has a large hardware cache. As a rule, such disks fail to finish saving
    sectors using the energy accumulated in capacitors—in contrast to predecessors.
    The same happens when MFT file relocation is not successful or if the MFT file
