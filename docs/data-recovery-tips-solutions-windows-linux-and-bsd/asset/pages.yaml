  md: '# Chapter 8: Data Recovery under Linux/BSD 199


    The kernel is the foundation, upon which all previously-mentioned components are
    based. It is a set of low-level functions concentrated in ntoskrnl.exe. Below
    the kernel, there is only the hardware abstraction level (HAL). Once upon a time,
    Microsoft planned to divide the kernel into system-dependent and systemindependent
    parts to simplify the processing of porting Windows to other platforms. However,
    by the time of Windows NT 4.x the situation had become a pretty mess, and many
    system-dependent functions were moved to ntoskrnl.exe. HAL is gradually being
    moved out of use, slowly but inevitably. Now only a small number of truly low-level
    functions remain that directly communicate with the hardware, for example, with
    ports and DMA. However, in Linux/BSD kernels there are specific functions for
    working with DMA; thus, there is no need to port HAL directly. If you recall that
    Windows drivers do not communicate to DMA directly. All such communications are
    carried out through the Plug and Play manager located in ntoskrnl.exe.


    As relates to input/output ports, consider the example in Listing 8.1. This listing
