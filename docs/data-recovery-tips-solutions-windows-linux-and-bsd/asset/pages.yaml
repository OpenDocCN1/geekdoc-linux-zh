  md: '# Chapter 5: Basic Concepts of Manual Data Recovery


    Table 5.2. MBR format


    | Offset | Size | Description |

    |---|---|---|

    | 0x000 | Variable | Master boot loader |

    | 1x1BB | 4h | Disk identifier |

    | 0x1BE | 10h | Partition 1 |

    | 0x1CE | 10h | Partition 2 |

    | 0x1DE | 10h | Partition 3 |

    | 0x1EE | 10h | Partition 4 |

    | 0x1FE | 0x2 | Partition identifier — the 55h Aah signature |


    The first 1BBh bytes are occupied by the loader code and data, among which the
    text strings are clearly visible. (By the way, Microsoft makes a blatant error
    by localizing the loader messages. BIOS doesn''t contain fonts for local languages;
    thus, the localized strings would appear as senseless garbage.


    At the 1BB offset there is the 4-byte disk identifier, forcibly assigned by Windows
    when starting Disk Manager. The early IBM PC computers (these were IBM PC XT),
    the loader owned the first 1BEh bytes of the MBR sector, and most loaders (as
    well as viruses) made extensive use of these bytes. It isn''t difficult to guess
    what would happen if the identifier were suddenly written into the loader. This
    would surely kill it. Thus, it is better not to touch bytes 1BBh–1BEh.


    Starting from the 1BE offset is the partition table, which is an array made up
    of four records of the partition type. The format of a partition table record
    is shown in Table 5.3. Each partition describes a logical disk of its own, which
    allows you to create up to four partitions on each hard disk drive. Dynamic disks
    introduced with Windows 2000 are stored in the LDM database and need not be present
    in the partition table.


    Table 5.3. Partition record format


    | Offset | | | | | Description |

    |---|---|---|---|---|---|

    | 000 | 1BE | 1CE | 1DE | 1EE | Boot indicator

    80h — active partition; 00h — partition is not bootable |

    | 001 | 1BF | 1CF | 1DF | 1EF | Starting head of the partition |


    continues'
