  md: 'First and foremost — do not panic! To proceed with the recovery of the lost
    data, you must have a sound mind. Unreasoned, feverish activity will only make
    the situation worse.


    Do not use any automated doctors if you are not sure that you can absolutely rely
    on them. The consequences of such “healing” can be catastrophic, and the results
    of “recovery” might be irreversible. The same relates to “professionals” dwelling
