- pgno: 97
  md: 'The Windows operating system that replaced it works with the disk through its
    built-in driver. Thus, limitations imposed by BIOS do not affect it. Well, practically
    do not affect it — after all, BIOS carries out the primary booting of the operating
    system. If the system components reside in sectors beyond the limits of 1024,
    the operating system will fail to boot. Note that this relates to all operating
    systems, not only to off-critized Windows.


    To overcome this, an additional translation level (the large mode) was introduced
    into BIOS, which allows 8 bits for head addressing, allowing an increase in the
    number of heads. in contrast to 4 bits allocated by the disk controller. Consequently,
    the maximum allowed disk size in bytes is $512 \times 2^{10} \times 2^6 \times
    2^8 = 8589934592$, or 8 GB. However, this is a theoretical limit; in practice,
    it is a different matter. Most BIOS implementations contained severe bugs; therefore,
    when working with disks larger than 2 GB they either hang up or started to lose
    the most significant bits of all key structures, because BIOS begins to address
    the starting sectors of the disk. Many contemporary BIOS implementations do not
    allow more than 64 virtual heads to be addressed, which limits the maximum allowed
    disk size by the same 2-GB value. Therefore, if you reinstall Windows on a logical
    disk larger than 2 GB, the system may cease to boot. Why does this happen?


    Pen? If you consider this situation carefully, you''ll understand that when the
    system is installed on a newly-formatted disk, it places all its files in the
    beginning. As the disk fills with information, the area of free space moves closer
    to the disk end. Even defragmentation software can move the initial boot files.
    Such a move can also be caused by installation of a service pack. Frankly, owners
    of large hard disks are recommended to divide their disks into several partitions
    and set the size of the first (system) partition no larger than 8 GB (2 GB seems
    more reliable).


    SCSI devices, from their birth, support a transpired logical addressing mechanism
    called logical block addressing (LBA), which sequentially numbers all sectors
    from zero and to the last sector of the disk. IDE drives were set to support LBA
    only with the arrival of ATA-3, but this addressing mechanism quickly became popular.
    In SCSI, LBA is inherently 32-bit addressing. IDE devices supported 28-bit LBA
    until the adoption of the ATA-6 specification. These 28 bits were distributed
    as shown in Listing 5.3.'
