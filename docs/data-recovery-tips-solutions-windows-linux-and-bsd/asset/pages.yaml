- pgno: 274
  md: '# Chapter 10: Recovering CDs


    meaningless garbage. The operating system might even freeze. If this happens,
    simply eject the disc, after Windows will cheerfully report that the "device is
    not ready." Furthermore, because of the pass-through addressing of sectors, each
    "grabbed" session will be written to the same disc location that it occupied earlier;
    otherwise, all references to the starting addresses of files within that session
    will become invalid. The required result is usually achieved by changing the starting
    address of the first track. This technique will be described in the next section
    of this chapter that concentrates on recovering information from cleared CD-RWs.


    # Restoring Cleared CD-RWs


    There are two principally different methods of clearing CD-RWs: quick and full.
    When carrying out quick erasing, only the TOC area is removed from the disc. As
    a result, the disc appears to be blank even though its main contents remain intact.
    Conversely, when carrying out full erasing, the last "burns" the entire disc surface,
    from the first pit (a microscopic indentation) to the last. This process takes
    about 10 minutes, whereas quick erasing can be done in a couple of minutes.


    The recovery of fully-erased discs is only possible using special equipment capable
    of detecting even the slightest changes in the reflective character of the reflecting
    layer. This kind of equipment is not available to most users. On the other hand,
    discs that have been erased using quick methods can be restored on a standard
    recorder, although not every model is suitable for this purpose.


    I won''t concentrate on the ethical aspects of this problem. For simplicity, suppose
    that you need to recover your own CD-RW that you have accidentally erased. Or
    suppose that this will be a legal operation requested by your employer.(Bear in
    mind that restoring confidential information from erased CD-RWs belonging to someone
    else can be classified as unauthorized access to information and can bring with
    it legal consequences.) To carry out experiments related to the recovery of information
    from cleared CD-RWs, you''ll need the following:


    +   A CD-RW drive that doesn''t check the correctness of TOC too carefully, supports
    the raw disc-at-once mode, and can read the pre-gap content of the first track.
    Bear in mind that not every CD-RW drive is suitable for this purpose; therefore,
    be prepared to test a lot of different devices. For example, of the two devices
    that I have at my disposal, only the NEC drive is suitable for this purpose; Philips
    is unable to do this.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Recording software with advanced capabilities, allowing manipulation of the
    service areas of the disc as necessary. For instance, you can use CloneCD, CDRWin,
    Alcohol 120%, or any similar utility. However, all material that is oriented exclusively
    towards the use of CloneCD. If you choose another utility, you might encounter
    some problems. If you''re not able to solve these problems on your own, use CloneCD;
    later, as you acquire the required experience and professional skills, you''ll
    become able to restore discs using other programs.


    Some tool for working with the disc at the sector level. This must be a utility
    that allows you to read any specified sector (provided that this sector can be
    read by the drive equipment) and doesn''t attempt to skip sectors that, in its
    own reading, do not contain anything of interest. The copiers of protected discs
    listed previously are not suitable for this purpose because they refuse to read
    sectors that are useless from the disc''s point of view. There may be some copies
    that behave differently, but I am unaware of any. Instead of testing one after
    another, I have written the required utility.


    Before starting your experiments, try to understand why the disc becomes unreadable
    after being cleared. This question isn''t as silly as it seems. After all, the
    information for positioning the head and searching for the required sectors remains
    intact after disc clearing. Control information is distributed along the entire
    spiral track. Thus, for reading the disc at the sector level, the TOC is generally
    not required. Admittedly, a missing TOC significantly complicates the analysis
    of the disc geometry, and the drive generally has to read the entire disc to determine
    the mine of disc tracks or sessions. However, when recovering information, the
    time factor isn''t of primary importance and can be neglected.


    So, after any attempt at reading any sector of the cleared disc, the drive persistently
    returns an error. Why is this? The answer is straightforward: this is simply to
    protect against reading information that is certain to be incorrect. Not one of
    the drives, with which I am familiar, could read a single sector the lead-out
    area (at the software level, the contents of lead-in and lead-out areas are also
    unavailable). Nevertheless, this isn''t a principal or conceptual limitation.
    Removing "extra" checks from the drive firmware will allow you to read such discs
    easily. I''m not suggesting that you disassemble the firmware code. This is a
    difficult, labor-intensive task and, most importantly, is potentially dangerous.
    If you hack the firmware incorrectly, you''ll ruin the entire drive without hope
    of repairing it. So go another way!'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 10: Recovering CDs 263


    The method for recovering information that I suggest writing a fictitious TOC
    to the disc. The lead-in and lead-out addresses of this TOC must point to the
    first and the last sectors of the disc, respectively, and the starting address
    of the first track must coincide exactly with the end of the pre-gap area. This
    area, according to the standard, must occupy no less than 150 sectors (or 2 seconds,
    if converted to absolute addresses). After this easy operation, the drive will
    obediently read the original content of the cleared disc, provided that you can
    tune the CD-burning software so that makes no attempts to interpret the pointers
    to the lead-in and lead-out areas supplied to it as instructions to burn the entire
    disc surface after writing a fictitious TOC.


    Experience has shown that CloneCD refuses to write such a TOC, complaining about
    the mismatched sizes of the disc and the image file. Alcohol 120% carries out
    this stuffed the entire disc with inimaginable garbage, without any complaint
    but does so in an undesirable manner. It informs you that writing errors have
    occurred and, perhaps, you must check the equipment''s usability.


    Try another approach. Write one real track to the disc, taking up the maximum
    number of sectors (300 is standard, although some drives accept smaller values),
    but extend the pre-gap from 2 seconds to the entire disc. As a result, you''ll
    lose only 300 trailing sectors; in exchange, you will gain access to the entire
    remainder of the disc. Taking into account that there are slightly more than 300,000
    sectors on the disc, it isn''t difficult to determine that the successfully recovered
    information will be 99.999% of the total disc capacity, provided that the entire
    disc was filled with useful info (a rarity in itself). If you are not satisfied
    with this, it makes sense to develop a custom program that can correctly write
    a fictitious TOC. The TOC area is written by the disc on any occasion; however,
    it is possible to do without lead-out if you treat the disc carefully. The main
    goal in this case is to attempt to correctly read the sectors that fall beyond
    the disc limits. Otherwise, the drive''s behavior will become unpredictable. I
    should point out, however, that I have never encountered a situation, in which
    it was necessary to recover a completely filled disc.


    The recovery procedure comprises three parts: preparing the source image of the
    track with a normal pre-gap, increasing the pre-gap to the size of entire disc,
    and writing the corrected image to the disc that needs to be restored. The first
    two steps can be carried out in one operation because the resulting image (I will
    call it the correcting image later on) can be used for all discs (to be, for all
    discs of the same capacity); for obvious reasons, it will be impossible to recover
    a 23-minute disc correctly using an image intended for 80-minute disc, and vice
    versa.


    ![](img/1ce3cead9a6814cc94d1e00101c20220_276_0.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 264 Part III: Backup-Media Data Recovery


    Take a blank CD-RW. ("Blank") in this case means not "one that has never written"
    but "one that has been cleared by quick or full erasing." CD-Rs are also suitable.)
    Use any standard utility for CD burning and writing to a file exceeding 500 KB
    (larger files won''t fit within the planned 300 sectors). It isn''t necessary
    to finalize the disc.


    Start CloneCD (or Alcohol 120%) and grab the disc image. After a couple of minutes,
    two files will appear on the hard disk: one with the IMG extension and other with
    the CCD extension. If you instruct CloneCD to save subchannel information, there
    will be a third file with the SUB extension. However, subchannel information will
    be more of a bane than help. It is advisable to disable the Read subchannel info
    from data tracks option or delete the file with the SUB extension from the disc.
    The cue sheet that CloneCD proposes that you create for compatibility with other
    programs, specifically with CDRWin, is also unnecessary.


    Open the file with the CCD extension using any text editor (Notepad, for example).
    Then search the file using the Point = Ox2 and Point = O01 keywords. The search
    results are shown in Listing 10.2.


    # Listing 10.2 The original starting address of lead-out (left) and the starting
    address of the first track (right)


    | [Entry 2] | [Entry 3] | TOC entry |

    |---|---||

    | Session = 1 | Session = 1 | Session number |

