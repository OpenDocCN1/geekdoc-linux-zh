  md: '# Chapter 10: Recovering CDs 303


    and convert the file length from a decimal value to a hex one: 777990272-1824
    <ENTER> 777988448 <F5> 2E5F2960 (the output of the calculator application is in
    bold). Now return to HIEW, <Enter>, and enter the resulting number from the keyboard
