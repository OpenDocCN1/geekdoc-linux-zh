    # Thought-Provoking Information


    No matter what the manufacturers might say, packet writing technology is considerably
    less reliable than the classical SAS technique. When the laser lights and blinks
    multiple times, this generates a fairly chaining effect, of which poorly join
    together. Therefore, it takes a lot of effort by the optical head not to stray
    from the spiral track and support the bit stream. When the laser goes on, its
    characteristics are unstable, which drops the burning quality considerably. In
    the normal burning mode, the drive has to stabilize, because the writing process
    starts by burning the lead-in area that duplicates auxiliary information multiple
    times and several of its starting sectors practically always are defective. In
    contrast to this mode, in the course of packet writing the laser has no time for
    stabilization and has to start the burning process immediately.'
