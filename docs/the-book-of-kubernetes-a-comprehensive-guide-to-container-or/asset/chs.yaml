  \n献我的妻子 Sheryl\n\n## 关于作者\n\nAlan Hohn 是洛克希德·马丁（Lockheed Martin）的软件策略总。他拥有洛克希德·马丁院士、软件开发人员、架构师、负责人和经理的\
  \ 25 年经验。他曾在 `Ada`、`Java`、`Python` 和 `Go` 等语言交付过生产环境应用，并自 20 世纪 90 年代初一直使用 `Linux`。他是敏捷和\
  \ DevSecOps 教，也是 `Java`、`Ansible`、容器、软件架构和 Kubernetes 的丰富培训师。Alan 拥有埃布里-瑞德尔航空大学（Embry-Riddle\
  \ Aeronautical University）的计算机科学学位、明尼苏达大学的工商管理硕士学位以及佐治亚理工学院的工业工程硕士学位。\n\n## 关于技术审核员\n\
  \nXander Soldaat 在 1994 年带着一袋软盘、一台 486DX2/66 和一个空闲的周末开启了他的 `Linux` 之旅。他在 IT 基础设施架构、嵌入式系统、编译器和\
  \ STEM 课程开发方面拥有深厚的背景。他目前 Red Hat 的 OpenShift 云成功架构师。在空余时间，他喜欢摆弄机器人、电子设备、复古电脑和桌面游戏。\n\
  \n\n\n- 第 15 章：持久化存储\n- 第 16 章：配置与秘密\n- 第 17 章：自定义资源与 Operator\n\n\n- 第 19 章：调优\
  \ Kubernetes\n\n\n\n\n\n\n\n\n\n\n\n\n## Overlay 文件系统\n### 理解容器层\n## 实用的镜像构建建议\n\
  ### 集群初始化\n## 将节点加入集群\n### 结语\n\n# 7 将容器部署到 Kubernetes\n### 结语\n\n\n\n在这里，`containerd`\
  \ 使用了五种命名空间：\n\n```\nroot@host01:~# lsns | grep 18088\n18088  mnt Mount (11)\n18088\
  \  uts UTS (2)\n18088  ipc IPC (13)\n18088  pid User (10)\n18088  net Network (and\
  \ table)\n```\n\n最后，我们通过运行 exit 来关闭容器：\n\n```\n/ # exit\n```\n\n### CRI-O 中的容器和命名空间\n\
  \n除了 `containerd`，`Kubernetes` 还支持其他运行时。根据你使用的 Kubernetes 版本，你可能会发现运行时是不同的。例如，Red\
  \ Hat OpenShift 使用 `CRI-O`，这是另一种容器运行时。`CRI-O` 也被 `Podman`、`Buildah` 和 `Skopeo` 工具集使用，这些是在\
  \ Red Hat 8 上管理容器的标准。\n\n你可以通过本章提供的 `extra` 准备脚本来跳过这些安装命令。请参阅本章的 README 文件。\n\n\
  OpenSUSE Kubic 项目为各种 Linux 发行版托管了 `CRI-O` 仓库，包括 Ubuntu，因此从那里安装。具体的 URL 取决于我们要安装的\
  \ `CRI-O` 版本，且 URL 长而难以输入，因此自动化脚本配置了一些环境变量。在继续之前，我们需要加载该脚本：\n\n```\nroot@host01:~#\
  \ source /opt/crio-ver\n```\n\n现在我们可以使用环境变量设置 `CRI-O` 仓库并安装 `CRI-O` 了：\n\n```\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\
  root@host01:~# echo \"deb $REPO:/cri-o:/$VERSION/$OS/ /\" \\\n  > /etc/apt/sources.list.d/kubic.cri-o.list\n\
  root@host01:~# curl -L $REPO/$OS/Release.key | apt-key add -\n...\nOK\nroot@host01:~#\
  \ apt update && apt install -y cri-o cri-o-runc\n...\nroot@host01:~# systemctl enable\
  \ crio && systemctl start crio\n...\nroot@host01:~# curl -L -o /tmp/crictl.tar.gz\
  \ $CRICTL_URL\n...\nroot@host01:~# tar -C /usr/local/bin -xvzf /tmp/crictl.tar.gz\n\
  crictl\nroot@host01:~# rm -f /tmp/crictl.tar.gz\n```\n\n\n\n\n与 `containerd` 不同，`CRI-O`\
  \ 没有附带任何我们可以用于测试的命令行工具，因此最后一个命令安装了 `crictl`。`crictl` 是 Kubernetes 项目的一部分，旨在测试任何兼容容器运行时接口（CRI）标准的容器运行时。`CRI`\
  \ 是 Kubernetes 用于与容器运行时通信的编程 API。\n\n由于 `crictl` 兼容任何支持 `CRI` 的容器运行时，因此需要配置以连接到\
  \ `CRI-O`。`CRI-O` 安装了一个配置文件 `/etc/crictl.yaml` 来配置 `crictl`：\n\n`crictl.yaml`\n\n\
  ```\nruntime-endpoint: unix:///var/run/crio/crio.sock\nimage-endpoint: unix:///var/run/crio/crio.sock\n\
  ...\n```\n\n此配置告诉 `crictl` 连接到 `CRI-O` 的套接字。\n\n要创建并运行容器，`crictl` 命令要求我们提供 JSON\
  \ 或 YAML 格式的定义文件。本章的自动化脚本在 `/opt` 中添加了两个 `crictl` 定义文件。第一个文件如列表 2-1 所示，创建了一个 Pod：\n\
  \n`pod.yaml`\n\n```\n---\nmetadata:\n  name: busybox\n  namespace: crio\nlinux:\n\
  \  security_context:\n    namespace_options:\n      network: 2\n```\n\n*列表 2-1:\
  \ CRI-O Pod 定义*\n\n与我们在第 1 章看到的 Kubernetes Pod 类似，Pod 是运行在相同隔离空间中的一个或多个容器组。在我们的情况下，Pod\
  \ 中只需要一个容器，第二个文件如列表 2-2 所示，定义了 `CRI-O` 启动的容器进程。我们提供了名称 (`busybox`) 和命名空间 (`crio`)\
  \ 来区分此 Pod 与任何其他 Pod。否则，我们只需要提供网络配置。`CRI-O` 期望使用容器网络接口（CNI）插件来配置网络命名空间。我们将在第 8 章中介绍\
  \ CNI 插件，因此目前，我们将使用 `network: 2` 来告诉 `CRI-O` 不要创建单独的网络命名空间，而是使用主机网络：\n\n`container.yaml`\n\
  \n```\n---\nmetadata:\n  name: busybox\nimage:\n  image: docker.io/library/busybox:latest\n\
  args:\n  - \"/bin/sleep\"\n  - \"36000\"\n```\n\n*列表 2-2: CRI-O 容器定义*\n\n我们再次使用\
  \ BusyBox 是因为它的体积小，运行快且轻量。然而，由于 `crictl` 会在没有终端的情况下后台创建此容器，我们需要指定 `/bin/sleep` 为容器内部运行的命令；否则，当\
  \ shell 发现没有 TTY 时，容器将立即终止。\n\n在运行容器之前，我们首先需要拉取镜像：\n\n```\nroot@host01:~# crictl\
  \ pull docker.io/library/busybox:latest\nImage is up to date for docker.io/library/busybox@sha256:...\n\
  ```\n\n然后，我们将 `pod.yaml` 和 `container.yaml` 文件提供给 `crictl`，以创建并启动我们的 BusyBox 容器：\n\
  \n```\nroot@host01:~# cd /opt\nroot@host01:~# POD_ID=$(crictl runp pod.yaml)\nroot@host01:~#\
  \ crictl pods\nPOD ID              CREATED                  STATE ...\n3bf297ace44b5\
  \       Less than a second ago   Ready ...\nroot@host01:~# CONTAINER_ID=$(crictl\
  \ create $POD_ID container.yaml pod.yaml)\nroot@host01:~# crictl start $CONTAINER_ID\n\
  91394a7f37e3da3a557782ed6d6eb2cf8c23e5b3dd4e2febd415bba071d10734\nroot@host01:~#\
  \ crictl ps\nCONTAINER           ... STATE\n91394a7f37e3d       ... Running\n```\n\
  \n我们将 Pod 的唯一标识和容器捕获到 `POD_ID` 和 `CONTAINER_ID` 变量中，这样我们就可以在这里及后续命令中使用它们。\n\n在查看\
  \ `CRI-O` 创建的 Linux 命名空间之前，让我们使用 `crictl exec` 命令在容器内部启动一个新的 shell 进程来查看 busybox\
  \ 容器内部：\n\n```\nroot@host01:~# crictl exec -ti $CONTAINER_ID /bin/sh\n/ # ip a\n\
  1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue qlen 1000\n...\n2: enp0s3:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel qlen 1000\n...\n3: enp0s8:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel qlen 1000\n...\n/ #\
  \ ps -ef\nPID   USER     TIME  COMMAND\n    1 root      0:00 /pause\n    7 root\
  \      0:00 /bin/sleep 36000\n```\n\n\n\n\n由于这是一个隔离的进程命名空间，它无法看到该命名空间之外的进程列表：\n\n\
  ```\nroot@host01:~# ps -ef\nUID          PID    PPID  C STIME TTY          TIME\
  \ CMD\nroot           1       0  0 22:21 pts/0    00:00:00 /bin/sh -c /bin/bash\n\
  root           2       1  0 22:21 pts/0    00:00:00 /bin/bash\nroot           9\
  \       2  0 22:22 pts/0    00:00:00 ps -ef\n```\n\n获取这个命名空间的 ID，以便我们能够在列表中识别出它：\n\
  \n```\nroot@host01:~# ls -l /proc/self/ns/pid\nlrwxrwxrwx 1 root root 0 Mar  6 22:22\
  \ /proc/self/ns/pid -> 'pid:[4026532190]'\n```\n\n现在，从另一个终端窗口列出所有的命名空间，并寻找与我们隔离的\
  \ shell 相关的命名空间：\n\n```\nroot@host01:~# lsns\n        NS TYPE NPROCS PID   USER\
  \ COMMAND\n...\n4026532189 mnt  3      12110 root unshare -f -p ...\n4026532190\
  \ pid  2      12111 root /bin/sh -c /bin/bash\n...\nroot@host01:~# exit\n```\n\n\
  我们看到了一个与之前看到的匹配的 `pid` 命名空间。此外，我们看到了一个 `mnt` 命名空间。这个命名空间确保我们的 shell 在 `/proc` 中看到正确的信息。\n\
  \n由于 `pid` 命名空间由 `sh` 命令所有，当我们在命名空间内运行 `ps` 时，该命令的 PID 为 1。这意味着 `sh` 有责任妥善管理它的子进程（例如\
  \ `bash`）。例如，`sh` 负责向其子进程传递信号以确保它们正确终止。记住这一点非常重要，因为这是运行容器时的常见问题，可能会导致僵尸进程或其他清理已停止容器时问题。\n\
  \n幸运的是，`sh` 很好地处理了它的管理职责，正如我们所看到的，当我们向它传递一个 `kill` 信号时，它会将该信号传递给它的子进程。在命名空间外的第二个终端窗口运行此命令：\n\
  \n```\nroot@host01:~# kill -9 12111\n```\n\n在第一个窗口中，你将看到以下输出：\n\n```\nroot@host01:~#\
  \ Killed\n```\n\n这表明 `bash` 接收到了 `kill` 信号并正确终止。\n\n### 总结\n\n尽管容器创建了完全独立的系统的象，但其实现方式与虚拟机没有任何共同之处。相反，这种过程类似于传统的进程隔离手段，例如用户权限和独立的文件系统。容器运行时使用命名空间，这些空间构建在\
  \ Linux 内核中，并启用各种类型的进程隔离。在本章中，我们研究了 `containerd` 和 `CRI-O` 运行时如何使用多种类型的 Linux 命名空间，为每个容器对其他进程、网络设备和文件系统提供独立的视图。命名空间的使用防止了运行容器中的进程看到并干扰其他进程。\n\
  \n同时，容器中的进程仍然共享相同的 CPU、内存和网络。使用过多这些资源的进程将阻止其他进程正常运行。然而，命名空间无法解决这个问题。为了防止这个问题，我们需要查看资源限制——这是我们下一章的主题。\n\
  \n# 3 资源限制\n\n![image](img/common01.jpg)\n\n我们在第 2 章 中完成的进程隔离工作是非常重要的，因为进程通常无法影响它“看不见”的东西。然而，我们的进程可以看到宿主机的\
  \ CPU、内存和网络，因此进程可能会通过使用过多的资源来阻止其他进程正确运行，没有为其他进程留下足够的空间。在本章中，我们将看到如何确保进程只使用其分配的 CPU、内存和网络资源，确保我们能够准确地划分资源。当我们转向容器编排时，这将非常有帮助，因为它将让\
  \ Kubernetes 在调度容器时对每个主机上的可用资源具有确定性。\n\nCPU、内存和网络固然重要，但还有另一个非常重要的共享资源：存储。然而，在像 Kubernetes\
  \ 这样的容器编排环境中，存储是分布的，需要在整个集群级别应用限制。出于如此，我们对存储的讨论必须等到在第 15 章 引入分布式存储之后。\n\n### CPU\
  \ 优先级\n\n我们需要分别查看 CPU、内存和网络，因为应用限制的效果在种情况下是不同的。让我们先看如何控制 CPU 使用。要理解 CPU 限制，我们首先需要查看\
  \ Linux 内核如何决定运行哪个进程以及运行多长时间。在 Linux 内核中，`scheduler`（调度器）维护着所有进程的列表。它还跟踪哪些进程已就绪以及每个进程最近接收了多少时间。这允许它创建一个优先级列表，以便它可以选择下一个运行的进程。调度器的设计尽可能公平（它甚至被称为完全公平调度器\
  \ CFS）；因此，它尝试给所有进程运行的机会。然而，它确实接受关于“这些进程中哪些比其他进程更重要”的外部输入。这种优先级排序由两部分组成：调度策略以及该策略内的进程优先级。\n\
  \n#### 实时与非实时策略\n\n调度器支持多种不同的策略，但对于我们来说，可以将它们分为实时策略和非实时策略。“实时”术语意味着某些现实事件至关重要，进程必须在截止日期到达之前完成处理，否则就会发生故障。例如，实时进程可能会从嵌入式设备读取数据。实时进程通常不是\
  \ CPU 密集型的，但当它们需要 CPU 时，它们无法等待，因此实时策略下的所有进程优先级都高于任何非实时策略。让我们在示例 Linux 系统上探索这一点。\n\
  \n**注意**\n\n本书的示例仓库位于 https://github.com/book-of-kubernetes/examples。有关设置的细节，请参见运行示例\
  \ 第 xx 页。\n\nLinux `ps` 命令告诉我们每个进程所应用的特定策略。在 *host01* 上运行此命令：\n\n```\nroot@host01:~#\
  \ ps -e -o pid,class,rtprio,ni,comm\n PID CLS RTPRIO  NI COMMAND\n   1 TS      \
  \ -   0 systemd\n...\n   6 TS       - -20 kworker/0:0H-kblockd\n...\n  11 FF   \
  \   99   - migration/0\n  12 FF      50   - idle_inject/0\n...\n  85 FF      99\
  \   - watchdogd\n...\n 484 RR      99   - multipathd\n...\n7967 TS       -   0 ps\n\
  ```\n\n`-o` 参数为 `ps` 自定义的输出字段列表，包括调度策略类 (`CLS`) 以及两个数值优先级字段：`RTPRIO` 和 `NI`。\n\n\
  首先看 CLS 字段，许多进程被列为 `TS`，代表“时间分片”，是默认的非实时策略。这包括我们自己运行的命令（如我们运行运行的 `ps` 命令）以及重要的 Linux\
  \ 系统进程（如 `systemd`）。然而，我们还看到了具有 `FF`（先进先出）策略和 `RR`（轮轮询）策略的进程。这些是实时进程，因此，它们的优先级高于系统中所有的非实时策略。\n\
  \n\n\n\n除了类别之外，还有两个数值优先级字段告诉我们策略如何对进程进行优先级排序。出乎意料的是，`RTPRIO` 字段意味着“实时优先级”，且仅适用于实时进程。`NI`\
  \ 字段是进程的“nice”值级，仅适用于非实时进程。由于历史原因，nice 值的运行范围从 `-20`（最不 nice，即最高优先级）到 `19`（最 nice，最低优先级）。\n\
  \n### 设置进程优先级\n\nLinux 允许我们为启动的进程设置优先级。让我们尝试使用优先级来控制 CPU 使用率。我们将运行一个名为 `stress`\
  \ 的程序，它设计用于对系统进行压力测试。让我们使用 `CRI-O` 运行容器版本的 `stress`。\n\n与之前一样，我们需要为 `Pod` 和容器定义\
  \ YAML 文件，以告诉 `crictl` 运行什么。列表 3-1 所示的 Pod YAML 与 第 2 章中的 BusyBox 示例几乎相同，仅名称有所不同：\n\
  \n*po-nolim.yaml*\n\n```\n---\nmetadata:\n  name: stress\n  namespace: crio\nlinux:\n\
  \  security_context:\n    namespace_options:\n      network: 2\n```\n\n*列表 3-1:\
  \ BusyBox Pod*\n\n与 BusyBox 示例相比，容器 YAML 有更多变化。除了使用了已经安装 `stress` 的不同容器镜像外，我们还需要为\
  \ `stress` 提供参数，告诉它压测单个 CPU：\n\n*co-nolim.yaml*\n\n```yaml\n---\nmetadata:\n  name:\
  \ stress\nimage:\n  image: docker.io/bookofkubernetes/stress:stable\nargs:\n  -\
  \ \"--cpu\"\n  - \"1\"\n  - \"-v\"\n```\n\n`CRI-O` 已经安装在 `host01` 上，因此只需要几个命令即可启动此容器。首先，我们拉取镜像：\n\
  \n```\nroot@host01:/opt# crictl pull docker.io/bookofkubernetes/stress:stable\n\
  Image is up to date for docker.io/bookofkubernetes/stress...\n```\n\n然后，我们可以从该镜像运行容器：\n\
  \n```\nroot@host01:~# cd /opt\nroot@host01:/opt# PUL_ID=$(crictl runp po-nolim.yaml)\n\
  root@host01:/opt# CUL_ID=$(crictl create $PUL_ID co-nolim.yaml po-nolim.yaml)\n\
  root@host01:/opt# crictl start $CUL_ID\n...\nroot@host01:/opt# crictl ps\nCONTAINER\
  \      IMAGE                                    ...\n971e83927329e  docker.io/bookofkubernetes/stress:stable\
  \ ...\n```\n\n`crictl ps` 命令只是为了检查我们的容器是否按预期运行。\n\n`stress` 程序现在正在我们的系统运行，我们可以看到当前的优先级和\
  \ CPU 使用率。我们需要查看当前的 CPU 使用率，因此将使用 `top`：\n\n```\nroot@host01:/opt# top -b -n 1 -p\
  \ $(pgrep -d , stress)\ntop - 18:01:58 up  1:39,  1 user,  load average: 1.01, 0.40,\
  \ 0.16\nTasks:   2 total,   1 running,   1 sleeping,   0 stopped,   0 zombie\n%Cpu(s):\
  \ 34.8 us, 0.0 sy, 0.0 ni, 65.2 id, 0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem :\
  \   1987.5 total,   1024.5 free,    195.8 used,    767.3 buff/cache\nMiB Swap: \
  \     0.0 total,      0.0 free,      0.0 used.   1643.7 avail Mem \n\n  PID   USER\
  \  PR  NI  ...  %CPU  %MEM    TIME+ COMMAND\n  13459 root  20   0  ... 100.0   0.2\
  \  0:29.78 stress-ng\n  13435 root  20   0  ...   0.0   0.2  0:00.01 stress-ng\n\
  ```\n\n`pgrep` 命令查找 `stress` 的进程 ID (`PIDs`)；之所以有两个，是因为 `stress` 为我们请求的 CPU 压力测试派生了一个单独进程。这个\
  \ CPU 工作进程正在占用一个 CPU 的 100%；幸运的是，我们的虚拟机有两个 CPU，所以它并没有过载。\n\n我们用默认优先级启动了这个进程，所以如\
  \ `NI` 列所示，它的 nice 值为 `0`。如果我们更改优先级会发生什么？让我们使用 `renice` 来查找一下：\n\n```\nroot@host01:/opt#\
  \ renice -n 19 -p $(pgrep -d ' ' stress)\n13435 (process ID) old priority 0, new\
  \ priority 19\n13459 (process ID) old priority 0, new priority 19\n```\n\n之前使用的\
  \ `ps` 命令期望 `PIDs` 用逗号分隔，而 `renice` 命令期望 `PIDs` 用空格分隔；幸运的是，`pgrep` 可以处理这两种情况。\n\n\
  我们已成功更改了进程的优先级。\n\n\n\n\n\n```\nroot@host01:~# ls /sys/fs/cgroup\nblkio        cpuacct\
  \  freezer  net_cls           perf_event  systemd\ncpu          cpuset   hugetlb\
  \  net_cls,net_prio  pids        unified\ncpu,cpuacct  devices  memory   net_prio\
  \          rdma\n```\n\n`/sys/fs/cgroup` 中的每个条目都是一个可以限制的不同资源。如果我们查看这些目录中的一个，就可以看到可以应用哪些控制。例如，对于\
  \ `cpu`：\n\n```\nroot@host01:~# cd /sys/fs/cgroup/cpu\nroot@host01:/sys/fs/cgroup/cpu#\
  \ ls -F\ncgroup.clone_children  cpuacct.stat               cpuacct.usage_user\n\
  cgroup.procs           cpuacct.usage              init.scope/\ncgroup.sane_behavior\
  \   cpuacct.usage_all          notify_on_release\ncpu.cfs_period_us      cpuacct.usage_percpu\
  \       release_agent\ncpu.cfs_quota_us       cpuacct.usage_percpu_sys   system.slice/\n\
  cpu.shares             cpuacct.usage_percpu_user  tasks\ncpu.stat              \
  \ cpuacct.usage_sys          user.slice/\n```\n\n`ls` 命令的 `-F` 标志为目录添加斜杠字符，这使得我们能够开始查看层级结构。这些子目录（`init.scope`、`system.slice`\
  \ 和 `user.slice`）都是独立的 CPU cgroup，每个 cgroup 都有自己的一套配置文件，适用于该 cgroup 中的进程。\n\n##\
  \ 使用 cgroups 限制 CPU 配额\n\n为了理解此目录的内容，让我们看看如何使用 cgroups 来限制 stress 容器的 CPU 使用率。我们首先再次检查它的\
  \ CPU 使用情况：\n\n```\nroot@host01:/sys/fs/cgroup/cpu# top -b -n 1 -p $(pgrep -d ,\
  \ stress)\ntop - 22:40:12 up 12 min,  1 user,  load average: 0.81, 0.35, .21\nTasks:\
  \   2 total,   1 running,   1 sleeping,   0 stopped,   0 zombie\n%Cpu(s): 37.0 us,\
  \ 0.0 sy, 0.0 ni, 63.0 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem :   1987.5\
  \ total,   1075.1 free,    179.4 used,    733.0 buff/cache\nMiB Swap:      0.0 total,\
  \      0.0 free,      0.0 used.   1646.3 avail Mem \n\n  PID USER   PR  NI ... \
  \ %CPU  %MEM     TIME+ COMMAND\n  5964 root  20  19 ...  100.0  0.2   1:19.72 stress-ng\n\
  \  5932 root  20  19 ...  0.0    0.2   0:00.02 stress-ng\n```\n\n如果你仍然看不到 stress\
  \ 正在运行，请使用本章前面的介绍命令重新启动它。接下来，让我们探索 stress CPU 进程位于哪个 CPU cgroup。我们可以通过在 `/sys/fs/cgroup/cpu`\
  \ 层级结构中的某个文件中找到它的 PID 来实现：\n\n```\nroot@host01:/sys/fs/cgroup/cpu# grep -R $(pgrep\
  \ stress-ng-cpu)\nsystem.slice/runc-050c.../cgroup.procs:5964\nsystem.slice/runc-050c.../tasks:5964\n\
  ```\n\nstress 进程是 `system.slice` 层级结构的一部分，位于由 `runc` 创建的子目录下，`runc` 是 CRI-O 的内部组件之一。这非常方便，因为意味着我们不需要创建自己的\
  \ cgroup 并此进程移动其中。这并非偶然；正如我们我们将看到的，CRI-O 支持容器的 CPU 限制，因此它自然需要为其运行的每个容器创建一个 cgroup。事实上，该\
  \ cgroup 是以容器 ID 命名的。让我们进入容器 cgroup 的目录：\n\n```\nroot@host01:/sys/fs/cgroup/cpu#\
  \ cd system.slice/runc-${CUL_ID}.scope\n```\n\n我们使用保存的 `CUL_ID` 变量切换到相应的目录。一旦进入此目录，我们发现它与根目录\
  \ `/sys/fs/cgroup/cpu` 具有相同的配置文件：\n\n```\nroot@host01:/sys/fs/...07.scope# ls\n\
  cgroup.clone_children  cpu.uclamp.max        cpuacct.usage_percpu_sys\ncgroup.procs\
  \           cpu.uclamp.min        cpuacct.usage_percpu\ncpu.cfs_period_us      cpuacct.stat\
  \          cpuacct.usage_sys\ncpu.cfs_quota_us       cpuacct.usage         cpuacct.usage_user\n\
  cpu.shares             cpuacct.usage_all     notify_on_release\ncpu.stat       \
  \        cpuacct.usage_percpu  tasks\n```\n\n`cgroup.procs` 文件列出了该 cgroup 中的进程：\n\
  \n```\nroot@host01:/sys/fs/...07.scope# cat cgroup.procs\n5932\n5964\n```\n\n该目录包含许多文件，但我们主要感兴趣的是\
  \ `cpu.cfs_period_us`：\n\n```\nroot@host01:/sys/fs/...07.scope# cat cpu.cfs_period_us\n\
  100000\n```\n\n为了限制容器的 CPU 使用率，我们需要修改 `cpu.cfs_quota_us` 文件。我们将将其设置为 `50000`，这意味着在\
  \ 100000 微秒的周期内，容器只能使用 50000 微秒的 CPU（即 50% 的限制）：\n\n```\nroot@host01:/sys/fs/...07.scope#\
  \ echo \"50000\" > cpu.cfs_quota_us\n```\n\n现在，再次运行 `top` 命令查看结果：\n\n```\nroot@host01:/sys/fs/cgroup/cpu#\
  \ top -b -n 1 -p $(pgrep -d , stress)\n```\n\n为了确认限制已生效，我们可以查看 `cpu.cfs_quota_us`\
  \ 的值：\n\n```\nroot@host01:/sys/fs/...07.scope# cat cpu.cfs_quota_us\n50000\n```\n\
  \n`top` 命令显示的 CPU 使用率可能不会正好是 50%，因为 `top` 统计的周期与 cgroup 的周期可能没有对齐。但平均而言，容器在周期内不会超过该配额：\n\
  \n```\nroot@host01:/sys/fs/cgroup/cpu# top -b -n 1 -p $(pgrep -d , stress)\n```\n\
  \n\n\n\n\n```\nroot@host01:~# cd /opt\nroot@host01:/opt# PCL_ID=$(crictl runp po-clim.yaml)\n\
  root@host01:/opt# CCL_ID=$(crictl create $PCL_ID co-clim.yaml po-clim.yaml)\nroot@host01:/opt#\
  \ crictl start $CCL_ID\n...\nroot@host01:/opt# crictl ps\nCONTAINER      IMAGE \
  \                                   ...\nea8bccd711b86  docker.io/bookofkubernetes/stress:stable\
  \ ...\n```\n\n我们的容器立即被限制在 CPU 的 10%：\n\n```\nroot@host01:/opt# top -b -n 1 -p $(pgrep\
  \ -d , stress)\ntop - 17:26:55 up 19 min,  1 user,  load average: 0.27, 0.16, 0.13\n\
  Tasks:   4 total,   2 running,   2 sleeping,   0 stopped,   0 zombie\n%Cpu(s): 10.3\
  \ us, 0.0 sy, 0.0 ni, 89.7 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem :   1987.5\
  \ total,   1053.4 free,    189.3 used,    744.9 buff/cache\nMiB Swap:      0.0 total,\
  \      0.0 free,      0.0 used.   1640.4 avail Mem \n\n  PID USER   PR  NI ... %CPU\
  \  %MEM     TIME+ COMMAND\n  8349 root  20   0 ... 10.0   0.2   0:22.67 stress-ng\n\
  \  8202 root  20   0 ...  0.0   0.2   0:00.02 stress-ng\n```\n\n与我们之前的示例一样，显示的 CPU\
  \ 使用率是 `top` 运行期间快照，因此它可能与限制并不完全匹配，但从长期来看，该进程使用的 CPU 将不超过其分配的额。\n\n我们可以检查 cgroup\
  \ 以确认 CRI-O 已将其放在了我们指定的位置，并自动配置了 CPU 配额：\n\n```\nroot@host01:/opt# cd /sys/fs/cgroup/cpu/pod.slice\n\
  root@host01:...pod.slice# cat crio-$CCL_ID.scope/cpu.cfs_quota_us\n10000\n```\n\n\
  CRI-O 为我们的容器创建了一个新的 cgroup 父级 `pod.slice`，在其内部创建了容器容器的 cgroup，并在我们无需动手的情况下配置了其 CPU\
  \ 配额。\n\n我们不再需要这个容器了，让我们把它删除吧：\n\n```\nroot@host01:/sys/fs/cgroupcpu/pod.slice#\
  \ cd\nroot@host01:~# crictl stop $CCL_ID\n...\nroot@host01:~# crictl rm $CCL_ID\n\
  ...\nroot@host01:~# crictl stopp $PCL_ID\nStopped sandbox ...\nroot@host01:~# crictl\
  \ rmp $PCL_ID\nRemoved sandbox ...\n```\n\n通过这些命令，我们先停止后删除容器，然后是 Pod。\n\n### 内存限制\n\
  \n内存是进程的另一项重要资源。如果系统没有足够的内存来满足请求，内存分配将失败。这通常会导致进程行为异常或完全失败。当然，大多数 Linux 系统使用 `swap\
  \ space`（交换空间）来临时将内存内容写入磁盘，这使得系统内存看起来比实际大，但也会降低系统性能。这是一个足够备受关注的问题，因此 Kubernetes\
  \ 团队不建议在集群中启用交换。\n\n此外，即使我们可以使用交换，我们也不希望一个进程占用所有的驻留内存并导致其他进程变得非常慢。因此，我们需要限制进程的内存使用情况，以便它们相互协作。我们还需要一个清晰的内存使用最大值，以便\
  \ Kubernetes 在将新容器调度到主机之前，能够可靠地确保该主机有足够的可用内存。\n\nLinux 系统与其他 Unix 变体一样，传统上必须处理共享稀缺资源的多个用户。出于原因，内核支持对系统资源的限制，包括\
  \ CPU、内存、子进程数量和打开的文件数量。我们可以使用 `ulimit` 命令从命令行设置这些限制。例如，一种限制类型是对“虚拟内存”的限制。这不仅包括进程在驻留内存中的\
  \ RAM 量，还包括它使用的任何交换空间。这里有一个 `ulimit` 命令限制虚拟内存的示例：\n\n```\nroot@host01:~# ulimit\
  \ -v 262144\n```\n\n`-v` 选项指定虚拟内存限制。该参数单位是字节，因此对于从此 shell 会话开始启动的每个额外进程，设置了 256MiB\
  \ 的虚拟内存限制。设置虚拟内存限制是一个总限制；它允许我们确保进程无法通过交换空间来绕过限制。我们可以通过将一些数据拉入内存来验证限制已生效：\n\n```\n\
  root@host01:~# cat /dev/zero | head -c 500m | tail\ntail: memory exhausted\n```\n\
  \n此命令从 `/dev/zero` 读取并尝试在内存中保留找到的前 500MiB 零。然而，在某个点，当 `tail` 命令尝试分配更多空间来存放它从 `head`\
  \ 获取的零时，它会从 head 获取。\n\n\n\n\n\n```\nroot@host01:/opt# crictl logs $CML_ID\n...\n\
  stress-ng: info:  [6] dispatching hogs: 1 vm\n...\nstress-ng: debug: [11] stress-ng-vm:\
  \ started [11] (instance 0)\nstress-ng: debug: [11] stress-ng-vm using method 'all'\n\
  stress-ng: debug: [11] stress-ng-vm: child died: signal 9 'SIGKILL' (instance 0)\n\
  stress-ng: debug: [11] stress-ng-vm: assuming killed by OOM killer, restarting again...\n\
  stress-ng: debug: [11] stress-ng-vm: child died: signal 9 'SIGKILL' (instance 0)\n\
  stress-ng: debug: [11] stress-ng-vm: assuming killed by OOM killer, restarting again...\n\
  ```\n\nStress 正在报告其内存分配过程正持续被“内存溢出”（out of memory）杀死。\n\n我们可以看到内核报告，`oom_reaper`\
  \ 确实是进程被杀的原因：\n\n```\nroot@host01:/opt# dmesg | grep -i oom_reaper | tail -n 1\n\
  [  696.651056] oom_reaper: reaped process 8756 (stress-ng-vm)...\n```\n\nOOM killer\
  \ 是 Linux 在整个系统内存不足且需要杀死一个或多个进程以保护系统时所使用的相同功能。在这种情况下，它向进程发送 `SIGKILL` 以确保 `cgroup`\
  \ 保持在它的内存限制之内。`SIGKILL` 是一个给进程的消息，告诉它应该立即终止而不进行任何清理工作。\n\n#### 为什么要使用 OOM KILLER？\n\
  \n当我们使用普通限制来控制内存时，尝试超过限制会导致内存分配失败，但内核并没有使用 OOM killer 来杀死我们的进程。为什么会有区别？答案是这是容器的本质。当我们研究使用容器化微服务构建可靠系统时，会发现容器本质上应该是快速启动和快速扩展的。这意味着我们应用程序中的每个单独容器刻意上并不非常重要。这进一步意味着，其中一个容器可能被意外杀死的想法并不真正需要担心。再加上由于不检查内存分配错误是最常见的\
  \ Bug 之一，因此直接杀死进程被认为更安全。\n\n尽管如此，值得注意的是，可以关闭 `cgroup` 的 OOM killer。然而，其效果并不是让内存分配失败，而是仅仅挂起进程，直到组中的其他进程释放内存。这实际上更糟糕，因为现在我们有一个进程没有被正式杀死，但也没有做任何有用的事情。\n\
  \n在继续之前，让我们让这个持续失败的压力测试容器解脱吧：\n\n```\nroot@host01:/opt# crictl stop $CML_ID\n...\n\
  root@host01:/opt# crictl rm $CML_ID\n...\nroot@host01:/opt# crictl stopp $PML_ID\n\
  Stopped sandbox ...\nroot@host01:/opt# crictl rmp $PML_ID\nRemoved sandbox ...\n\
  root@host01:/opt# cd\n```\n\n停止并移除容器和 Pod 可以防止压力测试容器通过不断尝试重启内存分配过程来浪费 CPU。\n\n####\
  \ 网络带宽限制\n\n在本章中，我们从易于限制的资源转向了更难限制的资源。我们从 CPU 开始，内核完全负责哪个进程获得 CPU 时间以及在被抢占前获得多少时间。然后我们查看了内存，内核没有能力强制进程放弃内存，但至少内核可以控制内存分配是否成功，或者它可以杀死请求过多内存的进程。\n\
  \n现在我们转向了网络带宽，由于两个重要原因，对带宽的控制变得更加困难。首先，网络设备并不像 CPU 或内存那样真的可以被“累加”，因此我们需要在每个网络设备的层级限制使用量。其次，我们的系统无法真正控制通过网络发送它的内容；我们只能完全控制*出口*（egress）带宽，即发送到给定网络设备的流量。\n\
  \n#### 适当的网络管理\n\n为了拥有一个完全可靠的集群，仅仅控制出口流量显然是不够的。下载文件的进程将像上传大量数据的进程一样耗尽可用带宽。然而，我们确实无法控制通过特定网络接口进入主主机的内容，至少在主机层面无法。如果我们真的想管理网络带宽，我们需要在交换机或路由器上处理这类事情。例如，将物理网络划分为虚拟局域网（VLAN）是非常常见的。一个\
  \ `VLAN` 可能是一个用于审计、日志以及管理员确保能够登录的管理网络。我们可能还会为重要的容器流量预留另一个 `VLAN`，或者使用流量整形（traffic\
  \ shaping）来确保重要的数据包通过。只要我们在交换机上执行这种配置，我们通常就可以允许剩余带宽为“尽力而为”（best effort）。\n\n虽然 Linux\
  \ 确实为网络接口提供了一些 `cgroup` 能力，但只能帮助我们对网络流量进行优先级排序和分类。由于此原因，我们将不再使用 `cgroups` 控制出口流量，而是直接配置\
  \ Linux 内核的*流量控制*（traffic control）能力。我们将测试流量控制功能，使用 `iper3` 测试流量，并应用限制。在本章的示例中，`host02`\
  \ 和 `192.168.1.10` 将被使用。首先让我们看看在没有限制的情况下，可以获得的带宽：\n\n```\nroot@host01:~# iperf3\
  \ -c 192.168.12\nConnecting to host 192.168.12, port 5201\n[  5] local 192.168.1.11\
  \ port 4904 connected to 192.168.1.12 port 5201\n...\n[ ID] Interval           Transfer\
  \     Bitrate\n[  5]   0.00-10.00  sec  2.18 GBytes  1.87 Gbits/sec    0       \
  \      sender\n[  5]   0.00-10.00  sec  2.18 GBytes  1.87 Gbits/sec            \
  \      receiver\n```\n\n正如预期的，我们现在在该接口上被限制在千兆速率。\n\n现在我们有了基准，可以使用 `tc` 设置出口配额。根据你的带宽，你可能希望选择一个合适的配额是例如：\n\
  \n```\nroot@host01:~# IFACE=$(ip -o addr | grep 192.168.1.11 | awk '{print $2}')\n\
  root@host01:~# tc qdisc add dev $IFACE root tbf rate 100mbit burst 256k latency\
  \ 400ms\n```\n接口名称在不同系统上可能不同，因此我们使用 `ip` 来识别要控制的接口。然后，我们使用 `tc` 来实际应用限制。命令中的 `tbf`\
  \ 代表*令牌桶过滤器*（token bucket filter）。使用令牌桶过滤器，每个数据包消耗令牌。令牌桶随时间填充令牌，但如果在任何点令牌桶为空，数据包将排队。通过控制令牌桶的大小和填充速率，内核可以很容易地实施带宽限制。\n\
  \n现在我们已经对该接口应用了限制，让我们通过运行完全相同的 `iper3` 命令来观察效果：\n\n```\nroot@host01:~# iperf3 -c\
  \ 192.168.1.12\nConnecting to host 192.168.1.12, port 5201\n[  5] local 192.168.1.11\
  \ port 49048 connected to 192.168.1.12 port 5201\n...\n[ ID] Interval          \
  \ Transfer     Bitrate\n[  5]   0.00-10.00  sec  114 MBytes  95.7 Mbits/sec    0\
  \             sender\n[  5]   0.00-10.01  sec  113 MBytes  94.5 Mbits/sec      \
  \            receiver\n```\n正如预期的，我们现在在该接口上被限制在 100Mbps。\n\n当然，在这种情况下，我们限制了系统上该网络接口的所有人的可用带宽。为了正确使用这种能力来控制带宽使用，我们需要更精确地针对限制。然而，为了做到这一点，我们需要将进程隔离到它自己的网络接口中，这是下一章的主题。\n\
  \n### 结语\n\n\n\n\n确保进程不会对系统上的其他进程引起问题，包括确保它公平地共享系统资源，如 CPU、内存和网络带宽。在本章中，我们查看了 Linux\
  \ 如何通过提供控制组（`cgroups`）来管理 CPU 和内存限制，以及用于管理网络接口的流量控制能力。当我们创建一个 Kubernetes 集群并向其部署容器时，我们将看到\
  \ Kubernetes 如何利用这些底层的 Linux 内核特性来确保容器被调度到具有足够资源的宿主机上，并确保容器在这些宿主机上表现良好。\n\n现在我们已经学习了容器运行时提供的进程隔离的一些最重要元素，但还有两种类型的隔离我们尚未探索：网络隔离和存储隔离。在下一章中，我们将查看如何使用\
  \ Linux 网络命名空间（network namespaces）来让每个容器看起来都拥有一套自己的网络接口，拥有独立的 IP 地址和端口。我们还将观察来自这些独立容器接口的流量如何流过我们的系统，以便容器能够相互通信以及与网络的其余部分通信。\n\
  \n# 4 网络命名空间\n\n![image](img/common01.jpg)\n\n理解容器网络是构建基于容器化微服务的现代应用程序的最大挑战。首先，即使不引入容器，网络本身就是非常复杂的。仅仅从一个物理服务器向另一个物理服务器发送一个简单的\
  \ ping，就会涉及到多个层级的抽象。其次，容器引入了额外的复杂性，因为每个容器都有自己的虚拟网络设备，使其看起来像一台独立的机器。不仅如此，像 Kubernetes\
  \ 这样的容器编排框架通过添加一个“叠加网络”（overlay network）又增加了一个复杂度，容器即使运行在不同的宿主机上也可以通过它通信。\n\n在本章中，我们将详细查看容器网络的工作原理。我们将查看容器的虚拟网络设备，包括每个网络设备如何分配一个可以到达主机的独立\
  \ IP 地址。我们将看到同一宿主机上的容器如何通过网桥设备（bridge device）相互连接，以及如何配置容器设备路由流量。最后，我们将检查如何使用地址转换允许容器连接其他主机，而不会在宿主机网络上暴露容器网络的内部。\n\
  \n## 网络隔离\n\n在第 2 章中，我们讨论了隔离为什么对于系统可靠性很重要，因为进程无法影响它们看不到。。容器网络隔离的一个重要原因。另一个原因是配置方便。为了运行一个充当服务器的进程（例如\
  \ Web 服务器），我们需要选择一个或多个该服务器监听的网络接口，并且需要选择一个它监听的端口号。我们无法在同一个接口的同一个端口上让两个进程监听。\n\n\
  因此，充当服务器的进程通常提供一种配置其应该使用哪个端口监听连接的方法。然而，这仍然要求我们知道还有哪些服务器以及它们正在使用哪些端口，以便确保没有冲突。在像\
  \ Kubernetes 这样的容器编排框架中，这是不可能的，因为新进程可能会随时从不同的用户出现，并可能需要监听任何端口号。\n\n解决这一问题的方法是为每个容器提供独立的虚拟网络接口。这样，容器中的进程就可以选择它想要的任何端口——它监听的网络接口将与另一个容器中的进程不同。让我们来看一个快速的示例。\n\
  \n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅“Running\
  \ Examples”（运行示例）部分，位于第 xx 页以获取设置详情。\n\n我们将运行两个 NGINX Web 服务器实例；每个实例都将监听 80 端口。像之前一样，我们将使用\
  \ CRI-O 和 `crictl`，但我们将使用脚本来减少输入量：\n\n```\nroot@host01:~# cd /opt\nroot@host01:/opt#\
  \ source nginx.sh\n...\n```\n\n`nginx.sh` 之前的 `source` 命令很重要；它确保脚本以某种方式运行，使其设置的环境变量在我们的\
  \ shell 中可供后续命令使用。`nginx.sh` 内部包含了我们在之前的章节中使用过的 `crictl run`、`crictl create` 和 `crictl\
  \ start` 命令。YAML 文件与我们之前看到的示例也非常相似；唯一的在于是我们使用了一个安装了 NGINX 的容器镜像。\n\n让我们验证一下是否已经运行了两个\
  \ NGINX 服务器：\n\n```\nroot@host01:/opt# crictl ps\nCONTAINER      IMAGE         \
  \   ... NAME    ...\nae341010886ae  .../nginx:latest ... nginx2  ...\n6a95800b16f15\
  \  .../nginx:latest ... nginx1  ...\n```\n\n我们还可以验证两个 NGINX 服务器都在监听 80 端口，这是 Web\
  \ 服务器的标准端口：\n\n```\nroot@host01:/opt# crictl exec $N1C_ID cat /proc/net/tcp\n  sl\
  \  local_address ...\n   0: 00000000:0050 ...\nroot@host01:/opt# crictl exec $N2C_ID\
  \ cat /proc/net/tcp\n  sl  local_address ...\n   0: 00000000:0050 ...\n```\n\n我们通过打印\
  \ `/proc/net/tcp` 来查看打开的端口，因为我们需要在容器内部运行此命令。`/proc/net/tcp` 显示的 `00000000:0050`\
  \ 十六进制对应十进制的 `80`。如果这些进程运行在同一个系统上，它们都无法监听 `80`，但在这种情况下，NGINX 拥有独立的接口。为了进一步探索这一点，让我们启动一个新的\
  \ BusyBox 容器：\n\n```\nroot@host01:/opt# source busybox.sh\n...\n```\n\nBusyBox 现在在我们的两个\
  \ NGINX 容器之外运行：\n\n```\nroot@host01:/opt# crictl ps\nCONTAINER      IMAGE      \
  \        ... NAME    ...\n189dd2676d26  .../busybox:latest box ...\nae341010886ae\
  \  .../nginx:latest ... nginx2  ...\n6a95800b16f15  .../nginx:latest ... nginx1\
  \  ...\n```\n\n让我们在容器内部启动 shell：\n\n```\nroot@host01:/opt# crictl exec -ti $B1C_ID\
  \ /bin/sh\n/ #\n```\n\n列表 4-1 显示容器的网络设备和地址。\n\n```\n/ # ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    inet 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_ft forever\n\
  \    inet6 ::1/128 scope host \n        valid_lft forever preferred_ft forever\n\
  3: eth0@if7: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN> mtu 1500 qdisc noqueue\n \
  \   link/ether 9a:7c:73:2f:f7:1a brd ff:ff:ff:ff:ff:ff\n    inet 10.85.0.4/16 brd\
  \ 10.85.255.255 scope global eth0\n        valid_lft forever preferred_ft forever\n\
  \    inet6 fe80::987c:73ff:fe2f:f71a/64 scope link \n        valid_lft forever preferred_ft\
  \ forever\n```\n\n*列表 4-1: BusyBox 网络*\n\n忽略标准的环回设备，我们看到一个地址为 10.85.0.4 的网络设备。这与主机的\
  \ IP 地址 192.168.61.11 完全不符；它处于完全不同的网络中。由于我们的容器在独立的网络上，我们可能预计无法从容器内部 ping 通宿主机系统，但它是行的，正如列表\
  \ 4-2 所示。\n\n\n\n\n\n```\n/ # ping -c 1 192.168.61.11\nPING 192.168.61.11 (192.168.61.11):\
  \ 56 data bytes\n64 bytes from 192.168.61.11: seq=0 ttl=64 time=7.471 ms\n\n---\
  \ 192.168.61.11 ping statistics ---\n1 packets transmitted, 1 packets received,\
  \ 0% packet loss\nround-trip min/avg/max = 7.471/7.471/7.471 ms\n```\n\n*列表 4-2:\
  \ BusyBox ping 测试*\n\n为了让流量从我们的容器传输到主机网络，路由表中必须有一个条目来实现这一目标。如列表 4-3 所示，我们可以使用 `ip`\
  \ 命令来验证这一点。\n\n```\n/ # ip route\ndefault via 10.85.0.1 dev eth0 \n10.85.0.0/16\
  \ dev eth0 scope link  src 10.85.0.4\n```\n\n*列表 4-3: BusyBox 路由*\n\n如所预期，存在一个默认路由。当我们发送\
  \ ping 时，我们的 BusyBox 容器连接到 `10.85.0.1`，该地址有能力继续发送 ping 直到到达 `192.168.61.11`。\n\n\
  我们将保持所有三个容器运行以便进一步探索，但让我们先退出 BusyBox shell 回到主机：\n\n```\n/ # exit\n```\n\n从容器内部看到的网络视图显示了为什么我们的两个\
  \ NGINX 服务器都能监听 `80` 端口。如之前提到的，特定接口的端口只能被一个进程监听，但当然，如果每个 NGINX 服务器都有一个独立的网络接口，就不会产生冲突。\n\
  \n### 网络命名空间 (Network Namespaces)\n\nCRI-O 使用 Linux 网络命名空间来创建这种隔离。我们在第 2 章 中简要探讨过网络命名空间；在本章中，我们将更详细地查看它们。\n\
  \n首先，让我们使用 `lsns` 命令列出 CRI-O 为我们的容器创建的网络命名空间：\n\n```\nroot@host01:/opt# lsns -t\
  \ net\n        NS TYPE NPROCS   PID USER    NETNSID NSFS                   COMMAND\n\
  4026531992 net     114     1 root unassigned                        /sbin/init\n\
  4026532196 net       4  5801 root          0 /run/netns/ab8be6e6... /pause\n4026532272\
  \ net       4  5937 root          1 /run/netns/8ffe0394... /pause\n4026532334 net\
  \       2  6122 root          2 /run/netns/686d71d9... /pause\n```\n\n除了用于所有不在容器内的进程的\
  \ root 网络命名空间外，我们看到了三个网络命名空间，对应我们创建的每一个 Pod。\n\n当我们使用 `crictl` 配合 CRI-O 时，网络命名空间实际上属于\
  \ Pod。这里列出的 pause 进程存在是为了确保即使 Pod 内部的容器不断来去，命名空间也能继续存在。\n\n在上一个例中，有四个网络命名空间。第一个是主机启动时创建的\
  \ root 命名空间。另外三个是为我们为止启动的每个容器创建的：两个 NGINX 容器和一个 BusyBox 容器。\n\n### 检查网络命名空间\n\n\
  为了了解网络命名空间的工作原理并对其进行操作，我们将使用 `ip netns` 命令列出网络命名空间：\n\n```\nroot@host01:/opt# ip\
  \ netns list\n7c185da0-04e2-4321-b2eb-da18ceb5fcf6 (id: 2)\nd26ca6c6-d524-4ae2-b9b7-5489c3db92ce\
  \ (id: 1)\n38bbb724-3420-46f0-bb50-9a150a9f0889 (id: 0)\n```\n\n该命令会在不同的配置位置查找网络命名空间，因此只列出了三个容器命名空间。\n\
  \n我们想要获取 BusyBox 容器的网络命名空间。它是列出的三个之一，我们可以推测它是标记为 `(id: 2)` 的那一个，因为我们最后创建了它，但也可以使用\
  \ `crictl` 和 `jq` 来提取我们所需的信息：\n\n```\nroot@host01:/opt# NETNS_PATH=$(crictl inspectp\
  \ $B1P_ID |\n  jq -r '.info.runtimeSpec.linux.namespaces[]|select(.type==\"network\"\
  ).path')\nroot@host01:/opt# echo $NETNS_PATH\n/var/run/netns/7c185da0-04e2-4321-b2eb-da18ceb5fcf6\n\
  root@host01:/opt# NETNS=$(basename $NETNS_PATH)\nroot@host01:/opt# echo $NETNS\n\
  7c185da0-04e2-4321-b2eb-da18ceb5fcf6\n```\n\n\n\n\n\n```\nroot@host01:/opt# ip netns\
  \ list\nmyns\n7c185da0-04e2-4321-b2eb-da18ceb5fcf6 (id: 2)\nd26ca6c6-d524-4ae2-b9b7-5489c3db92ce\
  \ (id: 1)\n38bbb724-3420-46f0-bb50-9a150a9f0889 (id: 0)\n```\n\n这个命名空间目前还没有什么用；它有一个回环接口，但没有其他接口：\n\
  \n```\nroot@host01:/opt# ip netns exec myns ip addr\n1: lo: <LOOPBACK> mtu 65536\
  \ qdisc noop state DOWN group default qlen 1000\n    link/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n```\n\n此外，即使是回环接口处于关闭（down）状态，也无法使用。让我们快速修复它：\n\n```\n\
  root@host01:/opt# ip netns exec myns ip link set dev lo up\nroot@host01:/opt# ip\
  \ netns exec myns ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ ...\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8\
  \ scope host lo\n       valid_lft forever preferred_lft forever\n    inet6 ::1/128\
  \ scope host \n       valid_lft forever preferred_lft forever\n```\n\n回环接口现在已启用（up），并且具有典型的\
  \ IP 地址 127.0.0.1。在这个网络命名空间中，基础的回环 ping 现在可以正常工作了：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ping -c 1 127.0.0.1\nPING 127.0.0.1 (127.0.0.1) 56(84) bytes of\
  \ data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.035 ms\n\n--- 127.0.0.1\
  \ ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n\
  rtt min/avg/max/mdev = 0.035/0.035/0.035/0.000 ms\n```\n\n能够 ping 回环网络接口是任何网络协议栈实用的初步测试，因为它展示了发送和接收数据包的能力。现在，我们在新的网络命名空间中拥有了一个基础工作的网络协议栈，但它仍然并不非常有用，因为回环接口本身无法与系统上的其他设备通信。我们需要在这个网络命名空间中添加另一个网络设备，以建立与主机及其余网络的连接性。\n\
  \n为了做到这一点，我们将创建一个`虚拟以太网`（veth）设备。你可以将 `veth` 想象成一条虚拟网线。就像网线一样，它有两个端，从一端进入的内容会从另一端出来。由于这个原因，通常使用\
  \ `veth pair` 这个术语。\n\n我们从一个创建 veth 对的命令开始：\n\n```\nroot@host01:/opt# ip link add\
  \ myveth-host type veth \\\n                  peer myveth-myns netns myns\n```\n\
  \n这条命令执行了三件事：\n\n1. 创建了一个名为 `myveth-host` 的 `veth` 设备\n2. 创建了一个名为 `myveth-myns`\
  \ 的 `veth` 设备\n3. 将设备 `myveth-myns` 放入名为 `myns` 的网络命名空间\n\n`veth pair` 的主机端出现在主机的普通网络设备列表中：\n\
  \n```\nroot@host01:/opt# ip addr\n...\n8: myveth-host@if2: <BROADCAST,MULTICAST>\
  \ mtu 1500 ... state DOWN ...\n    link/ether fe:7a:5d:86:00:d9 brd ff:ff:ff:ff:ff:ff\
  \ link-netns myns\n```\n\n此输出显示了 `myveth-host`，并且显示它连接到了网络命名空间 `myns` 中的一个设备。\n\n\
  如果你亲自运行这条命令并查看主机网络设备的完整列表，你会注意到连接到每个容器网络命名空间的额外 `veth` 设备。这些设备是在我们部署 `NGINX` 和 `BusyBox`\
  \ 时由 `CRI-O` 创建的。\n\n同样，我们可以看到我们的 `myns` 网络命名空间有一个新的网络接口：\n\n```\nroot@host01:/opt#\
  \ ip netns exec myns ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ ...\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8\
  \ scope host lo\n       valid_lft forever preferred_lft forever\n    inet6 ::1/128\
  \ scope host \n       valid_lft forever preferred_lft forever\n2: myveth-myns@if8:\
  \ <BROADCAST,MULTICAST> mtu 1500 ... state DOWN ...\n    link/ether 26:0f:64:a8:37:1f\
  \ brd ff:ff:ff:ff\n```\n\n该接口目前处于关闭（down）状态。在启动之前，我们需要启用 `veth pair` 的两个端。我们还需要为\
  \ `myveth-myns` 端分配一个 IP 地址以便其通信：\n\n```\nroot@host01:/opt# ip netns exec myns ip\
  \ addr add 10.85.0.254/16 \\\n                  dev myveth-myns\nroot@host01:/opt#\
  \ ip netns exec myns ip link set dev myveth-myns up\nroot@host01:/opt# ip link set\
  \ dev myveth-host up\n```\n\n快速检查我们已配置了 IP 地址并启动了网络：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ ...\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8\
  \ scope host lo\n       valid_lft forever preferred_lft forever\n    inet6 ::1/128\
  \ scope host \n       valid_lft forever preferred_lft forever\n2: myveth-myns@if8:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> ... state UP ...\n    link/ether 26:0f:64:a8:37:1f\
  \ brd ff:ff:ff:ff link-netns 0\n    inet 10.85.0.254/16 scope global myveth-myns\n\
  \       valid_lft forever preferred_lft forever\n    inet6 fe80::240f:64ff:fea8:371f/64\
  \ scope link \n       valid_lft forever preferred_lft forever\n```\n\n除了回环接口外，我们现在又看到了\
  \ IP 地址为 `10.85.0.254` 的额外接口。如果我们尝试 ping 这个 IP 地址会发生什么？结果显示我们确实 ping 通，但仅在网络命名空间内部：\n\
  \n```\nroot@host01:/opt# ip netns exec myns ping -c 1 10.85.0.254\n   PING 10.85.0.254\
  \ (10.85.0.254) 56(84) bytes of data.\n   64 bytes from 10.85.0.254: icmp_seq=1\
  \ ttl=64 time=0.030 ms\n\n   --- 10.85.0.254 ping statistics ---\n   ➊ 1 packets\
  \ transmitted, 1 received, 0% packet loss, time 0ms\n   rtt min/avg/max/mdev = 0.030/0.030/0.030/0.000\
  \ ms\nroot@host01:/opt# ping -c 1 10.85.0.254\n   PING 10.85.0.254 (10.85.0.254)\
  \ 56(84) bytes of data.\n   From 10.85.0.1 icmp_seq=1 Destination Host Unreachable\n\
  \n   --- 10.85.0.254 ping statistics ---\n   ➋ 1 packets transmitted, 0 received,\
  \ +1 errors, 100% packet loss, time 0ms\n```\n\n使用 `ip netns exec` 执行的第一个 ping 命令在网络命名空间内运行，显示响应成功\
  \ ➊。然而，没有使用 `ip netns exec` 执行的第二个 ping 命令显示没有收到数据包 ➋。问题在于我们在网络命名空间内部成功创建了网络接口，并且主机网络上有\
  \ `veth pair` 的另一端，但我们没有在主机上连接相应的网络设备，因此没有主机网络接口可以与命名空间中的接口通信。\n\n与此同时，当我们在列表 4-2\
  \ 的 `BusyBox` 容器中运行 ping 测试时，我们能够顺利地 ping 通主机。显然，当 `CRI-O` 创建我们的容器时，还有更多的配置。让我们在下一节中探索这些内容。\n\
  \n### 桥接接口 (Bridge Interfaces)\n\n`veth pair` 的主机端目前没有连接到任何地方，因此我们的网络命名空间还无法与外界通信并不意外。为了解决这个问题，让我们看看\
  \ `CRI-O` 创建的一个 `veth` 对：\n\n```\nroot@host01:/opt# ip addr\n...\n7: veth062abfa6@if3:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> ... master cni0 ...\n    link/ether fe:6b:21:9b:d0:d2\
  \ brd ff:ff:ff:ff:ff:ff link-netns ...\n    inet6 fe80::fc6b:21ff:fe9b:d0d2/64 scope\
  \ link \n       valid_lft forever preferred_lft forever\n...\n```\n\n与我们创建的接口不同，这个接口指定了\
  \ `master cni0`，显示它属于一个`网络桥接器`(network bridge)。`网络桥接器`是为了连接多个接口。你可以把它看作是一个以太网机，因为它根据接口的介质访问（MAC）地址在不同的网络接口之间路由流量。\n\
  \n在主机的网络设备列表中可以看到桥接器 `cni0`：\n\n```\nroot@host01:/opt# ip addr\n...\n4: cni0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue ...\n    link/ether 8e:0c:1c:7d:94:75 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 10.85.0.1/16 brd 10.85.255.255 scope global cni0\n       valid_lft forever\
  \ preferred_lft forever\n    inet6 fe80::8c0c:1cff:fe7d:9475/64 scope link \n  \
  \     valid_lft forever preferred_lft forever\n...\n```\n\n\n\n\n网桥比典型的以太网交换机智能一点，因为它提供了一些防火墙和路由功能。它还有一个\
  \ IP 地址 `10.85.0.1`。由于这个 IP 地址与我们在列表 4-3 中看到的 BusyBox 容器的默认路由相同，因此我们已经开始解开 BusyBox\
  \ 容器如何能够与自身网络之外的主机通信的谜团。\n\n#### 向网桥添加接口\n\n为了检查网桥并向其添加设备，我们将使用 `brctl` 命令。让我们先检查一下网桥：\n\
  \n```\nroot@host01:/opt# brctl show\nbridge name     bridge id               STP\
  \ enabled     interfaces\ncni0            8000.8e0c1c7d9475       no           \
  \   veth062abfa6\n                                                        veth43ab68cd\n\
  \                                                        vetha251c619\n```\n\n网桥\
  \ `cni0` 上有三个接口，分别对应我们运行的三个容器（两个 NGINX 和一个 BusyBox）的 `veth` 链路的主机端。让我们利用这个现有的网桥为我们创建的命名空间设置网络连接：\n\
  \n```\nroot@host01:/opt# brctl addif cni0 myveth-host\nroot@host01:/opt# brctl show\n\
  bridge name     bridge id               STP enabled     interfaces\ncni0       \
  \     8000.8e0c1c7d9475       no              myveth-host\n                    \
  \                                    veth062abfa6\n                            \
  \                            veth43ab68cd\n                                    \
  \                    vetha251c619\n```\n\n我们 `veth` 链路的主机端现在已连接到网桥，这意味着我们现在可以从主机\
  \ ping 命名空间：\n\n```\n root@host01:/opt# ping -c 1 10.85.0.254\n   PING 10.85.0.254\
  \ (10.85.0.254) 56(84) bytes of data.\n   64 bytes from 10.85.0.254: icmp_seq=1\
  \ ttl=64 time=0.194 ms\n\n   --- 10.85.0.254 ping statistics ---\n➊ 1 packets transmitted,\
  \ 1 received, 0% packet loss, time 0ms\n   rtt min/avg/max/mdev = 0.194/0.194/0.194/0.000\
  \ ms\n```\n\n接收到数据包 ➊ 事实说明我们建立了一个可以工作的连接。我们应该对它的成功感到很高兴，但如果我们想真正理解这一点，就不能满足于说我们可以“从主机”\
  \ ping 这个接口。我们需要更具体地说明流量究竟是如何流动的。\n\n#### 追踪流量\n\n让我们实际追踪这些流量，看看在运行 `ping` 命令时发生了什么。我们将使用\
  \ `tcpdump` 来打印流量。首先，让我们在后台启动一个 ping 命令来创建一些待追踪的流量：\n\n```\nroot@host01:/opt# ping\
  \ 10.85.0.254 >/dev/null 2>&1 &\n...\n```\n\n我们将输出重定向到 `/dev/null`，这样就不会弄乱我们的会话。现在，让我们使用\
  \ `tcpdump` 来查看流量：\n\n```\nroot@host01:/opt# timeout 1s tcpdump -i any -n icmp\n\
  tcpdump: verbose output suppressed, use -v or -vv for full protocol decode\nlistening\
  \ on any, link-type LINUX_SLL (Linux cooked v1), ...\n17:37:33.204863 IP 10.85.0.1\
  \ > 10.85.0.254: ICMP echo request, ...\n17:37:33.204894 IP 10.85.0.1 > 10.85.0.254:\
  \ ICMP echo request, ...\n17:37:33.204936 IP 10.85.0.254 > 10.85.0.1: ICMP echo\
  \ reply, ...\n17:37:33.204936 IP 10.85.0.254 > 10.85.0.1: ICMP echo reply, ...\n\
  \n4 packets captured\n4 packets received by filter\n0 packets dropped by kernel\n\
  root@host01:/opt# killall ping\n```\n\n我们使用 `timeout` 来防止 `tcpdump` 无限运行，之后我们使用\
  \ `killall` 停止 `ping` 命令并停止其在后台运行。\n\n输出显示 `ping` 源自网桥接口，其 IP 地址为 `10.85.0.1`。这是由于主机的路由表引起的：\n\
  \n```\nroot@host01:/opt# ip route\n...\n10.85.0.0/16 dev cni0 proto kernel scope\
  \ link src 10.85.0.1 \n192.168.61.0/24 dev enp0s8 proto kernel scope link src 192.168.61.11\n\
  ```\n\n当 `CRI-O` 创建网桥并配置其 IP 地址时，它还设置了路由，使得发往 `10.85.0.0/16`（即从 `10.85.0.0` 到 `10.85.255.255`\
  \ 的所有流量）的流量使用 `cni0`。这些信息足够 `ping` 命令知道将包发送哪里，网桥处理剩余部分。`ping` 源自 `10.85.0.1` 网桥接口而不是\
  \ `192.168.61.11` 主机接口实际上产生了巨大差异，因为如果我们从命名空间内部 ping 就能看到这一点：\n\n```\nroot@host01:/opt#\
  \ ip netns exec myns ping -c 1 192.168.61.11\n```\n\n这里的问题是，命名空间中的接口不知道如何到达主机。网桥是可用并可以将流量路由到主机，但我们还没有配置必要的路由来使用它。让我们这样做：\n\
  \n```\nroot@host01:/opt# ip netns exec myns route add default via 10.85.0.1\n```\n\
  \n现在 ping 可以了：\n\n```\nroot@host01:/opt# ip netns exec myns ping -c 1 192.168.61.11\n\
  PING 192.168.61.11 (192.168.61.11) 56(84) bytes of data.\n64 bytes from 192.168.61.11:\
  \ icmp_seq=1 ttl=64 time=0.097 ms\n\n--- 192.168.61.11 ping statistics ---\n1 packets\
  \ transmitted, 1 received, 0% packet loss, time 0ms\nrtt min/avg/max/mdev = 0.097/0.097/0.097/0.000\
  \ ms\n```\n\n这说明了调试网络时需要记住的一个重要规则：很容易对网络流量的发送和接收得出结论。通常需要追踪来查看流量真实状况。\n\n#### 主机上的\
  \ IP 地址\n\n这种方法并不是主机到命名空间的唯一方法。我们也可以直接为 `veth` 链路端分配 IP 地址。尽管这样可以启用主机到命名空间的通信，但它无法提供多个命名空间之间的通信方式。像\
  \ `CRI-O` 这样使用网桥接口可以实现主机上所有容器的互连，使它们都在同一个网络上。\n\n这也解释了为什么我们没有为 `veth` 链路端分配 IP 地址。当使用网桥时，只有网桥接口获取\
  \ IP 地址，添加到网桥的接口没有。\n\n通过最后一次更改，我们似乎匹配了容器的网络配置，但仍然缺少与 `host01` 外部网络通信的能力。我们可以通过从命名空间\
  \ ping `host02` 来演示，它与 `host01` 在同一个内部网络，并且拥有 IP 地址 `192.168.61.12`。如果我们从 BusyBox\
  \ 容器 ping，它是通的：\n\n```\nroot@host01:/opt# crictl exec $B1C_ID ping -c 1 192.168.61.12\n\
  PING 192.168.61.12 (192.168.61.12): 56 data bytes\n64 bytes from 192.168.61.12:\
  \ seq=0 ttl=63 time=0.816 ms\n\n--- 192.168.61.12 ping statistics ---\n1 packets\
  \ transmitted, 1 packets received, 0% packet loss\nround-trip min/avg/max = 0.816/0.816/0.816\
  \ ms\n```\n\nping 输出报告接收了一个数据包。然而，如果我们使用创建的命名空间尝试相同的命令，它是不通的：\n\n```\nroot@host01:/opt#\
  \ ip netns exec myns ping -c 1 192.168.61.12\nPING 192.168.61.12 (192.168.61.12)\
  \ 56(84) bytes of data.\n\n--- 192.168.61.12 ping statistics ---\n1 packets transmitted,\
  \ 0 received, 100% packet loss, time 0ms\n```\n\n这条命令报告没有接收到数据包。\n\n实际上，我们应该对 BusyBox\
  \ 容器的 ping 成功感到惊讶。毕竟，`host02` 对 BusyBox 容器、`cni0` 网桥接口或容器所在的 `10.85.0.0/16` 网络一无所知。`host02`\
  \ 如何可能与我们的 BusyBox 容器交换 ping？为了理解这一点，我们需要查看网络伪装。\n\n#### 伪装（Masquerade）\n\n\n\n\n\
  \n`Masquerade`（伪装），也称为网络地址转换（NAT），在网络中每天都在使用。例如，大多数家庭接入连接只提供一个可以从互联网访问的单一 IP 地址，但家庭网络中的许多设备都需要访问互联网。路由器的任务就是让该网络的所有流量看起来都源自同一个\
  \ IP 地址。它是通过重写出站流量的 `source` IP 地址并跟踪所有出站连接来实现的，这样它就可以重写任何响应包的 `destination` IP\
  \ 地址。\n\n### 注意\n\n我们在这里讨论的 NAT 类型在技术上被称为源 NAT (`SNAT`)。不过，不要纠结于这个名称；为了使其正常工作，任何响应包的目的地址都必须被重写。在这种情况下，“源”（Source）一词意味着在发起新连接时，重写的是源地址。*\n\
  \n“伪装”听起来正是我们将运行在 `10.85.0.0/16` 网络中的容器连接到主机网络 `192.168.61.0/24` 所需的，而事实上，它正是这样工作的。当我们从\
  \ `BusyBox` 容器发送 ping 时，源 IP 地址被重写，使得 ping 看起来来自 `host01` 的 IP `192.168.61.11`。当\
  \ `host02` 响应时，它将响应发送到 `192.168.61.11`，但目的地址被重写，使其实际上被发送到了 `BusyBox` 容器。\n\n让我们全程追踪\
  \ ping 流量来演示：\n\n```\nroot@host01:/opt# crictl exec $B1C_ID ping 192.168.61.12 >/dev/null\
  \ 2>&1 &\n[1] 6335\nroot@host01:/opt# timeout 1s tcpdump -i any -n icmp\ntcpdump:\
  \ verbose output suppressed, use -v or -vv for full protocol decode\nlistening on\
  \ any, link-type LINUX_SLL (Linux cooked v1)...\n18:53:44.310789 IP 10.85.0.4 ➊\
  \ > 192.168.61.12: ICMP echo request, id 12, seq 17...\n18:53:44.310789 IP 10.85.0.4\
  \ > 192.168.61.12: ICMP echo request, id 12, seq 17...\n18:53:44.310876 IP 192.168.61.11\
  \ ➋ > 192.168.61.12: ICMP echo request, id 12, seq 17...\n18:53:44.311619 IP 192.168.61.12\
  \ > 192.168.61.11: ICMP echo reply, ➌ id 12, seq 17...\n18:53:44.311648 IP 192.168.61.12\
  \ > 10.85.0.4: ➍ ICMP echo reply, id 12, seq 17...\n18:53:44.311656 IP 192.168.61.12\
  \ > 10.85.0.4: ICMP echo reply, id 12, seq 17...\n\n6 packets captured\n6 packets\
  \ received by filter\n0 packets dropped by kernel\nroot@host01:/opt# killall ping\n\
  ```\n\n当 ping 源自我们的 `BusyBox` 容器内部时，它的源 IP 地址为 `10.85.0.4` ➊。该地址被重写了，使得 ping 看起来来自主机\
  \ IP `192.168.61.11` ➋。当然，`host02` 知道如何响应来自该地址的 ping，因此 ping 得到了回答 ➌。此时，伪装的另一半开始起作用，目的地址被重写为\
  \ `10.85.0.4` ➍。结果是 `BusyBox` 容器能够向单独主机发送数据包并获得回复。\n\n为了完成我们网络命名空间的设置，我们需要一个类似的规则来伪装来自\
  \ `10.85.0.254` 的流量。我们可以先通过使用 `iptables` 来查看 CRI-O 在配置容器时创建的规则：\n\n```\nroot@host01:/opt#\
  \ iptables -t nat -n -L\n...\nChain POSTROUTING (policy ACCEPT)\ntarget        \
  \                prot opt source    destination\nCNI-f82910b3a7e28baf6edc0d3  all\
  \  --  10.85.0.2 anywhere    ...\nCN-7f8aa3d8a4f62b186149f43  all  --  10.85.0.3\
  \ anywhere    ...\nCNI-48ad69d30fe932fda9ea71d2  all  --  10.85.0.4 anywhere   \
  \ ...\n\nChain CNI-48ad69d30fe932fda9ea71d2 (1 references)\ntarget     prot opt\
  \ source               destination         \nACCEPT     all  --  anywhere      \
  \       10.85.0.0/16 ...\nMASQUERADE all  --  anywhere             !224.0.0.0/4\
  \ ...\n...\n```\n\n伪装在连接发起时开始；在这种情况下，当流量源地址位于 `10.85.0.0/16` 网络时。由于此原因，使用了`POSTROUTING`链，因为它可以看到所有的出站流量。`POSTROUTING`链中为每个容器都有规则；每个规则都会调用对应容器的\
  \ CNI 链。\n\n为了简洁起见，这里显示了三个 CNI 链中的一个。另外两个是相同的。CNI 链首先对所有本地于容器网络的流量执行 `ACCEPT`，这样这些流量就不会被伪装。然后它为所有流量设置伪装（排除\
  \ `224.0.0.0/4`，这是多组播流量，因为无法正确路由而无法进行伪装）。\n\n\n\n\n要运行一个进程，我们需要存储。容器化软件的巨大优势之一是能够将应用程序及其依赖项打包在一起进行交付。因此，我们需要存储程序的可执行文件以及它使用的任何共享库。我们还需要存储配置文件、日志以及程序管理的任何数据。所有这些存储必须是隔离的，以确保容器不会干扰主机系统或其他容器。总而言，这代表了对存储的巨大需求，意味着容器引擎必须提供一些独特特性才能在磁盘空间和带宽的使用上实现高效。在本章中，我们将探索使用分层文件系统如何让镜像下载更高效、容器启动更快速。\n\
  \n## 文件系统隔离\n\n在第 2 章中，我们看到了如何使用 `chroot` 环境来创建一个独立的、隔离的文件系统部分，其中只包含我们运行进程所需的二进制文件和库。即使是运行一个简单的\
  \ `ls` 命令，我们需要二进制文件和几个库。功能更完全的容器（例如运行 NGINX Web 服务器的容器）需要的多得多——一套 Linux 发行版的完整文件集。\n\
  \n在 `chroot` 示例中，我们在准备好使用时从宿主机系统构建隔离的文件系统。这种方法对于容器来说是不现实的。相反，隔离的文件系统被封装在`container\
  \ image`中，它是一个即用的包，包含了所有文件和元数据，例如环境变量和默认可执行文件。\n\n### 容器镜像内容\n\n让我们快速查看 NGINX 容器镜像的内部。在本章中，我们将使用\
  \ `Docker` 运行命令，因为它仍然是构建容器镜像最常用的工具。\n\n**注意**：本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参阅第\
  \ xx 页 上的“运行示例”。\n\n在本文章示例的 `host01` 上运行以下命令来下载镜像：\n\n```\nroot@host01:~# docker\
  \ pull nginx\nUsing default tag: latest\nlatest: Pulling from library/nginx\n...\n\
  Status: Downloaded newer image for nginx:latest\ndocker.io/library/nginx:latest\n\
  ```\n\n`docker pull` 命令从 `image registry`（镜像仓库）下载镜像。镜像仓库是一个实现了用于下载和发布容器镜像 API 的\
  \ Web 服务器。我们可以通过列 `docker images` 来查看已下载的镜像：\n\n```\nroot@host01:~# docker images\n\
  REPOSITORY   TAG       IMAGE ID       CREATED       SIZE\nnginx        latest  \
  \  f0b8a9a54136   7 days ago    133MB\n```\n\n该镜像大小为 133MB，有一个唯一的标识符 `f0b8a9a54136`。（你的标识符会不同，因为新的\
  \ NGINX 容器镜像每天都会构建。）此镜像不仅包含 NGINX 执行文件和所需的库，还包含基于 Debian 的 Linux 发行版。我们在第 1 章中简要见过这一点，当时我们在\
  \ Ubuntu 主机和内核上演示了 Rocky Linux 容器，但让我们更详细地观察。从运行一个 NGINX 容器开始：\n\n```\nroot@host01:~#\
  \ docker run --name nginx -d nginx\n516d13e912a55cf6f73f0dd473661d6b7d3b868d5a07a2bc7253971015b6799\n\
  ```\n\n`--name` 标志为容器提供了一个我们可以在后续命令中使用的友好名称，而 `-d` 标志则将其发送到后台。\n\n现在，让我们探索正在运行的容器的文件系统：\n\
  \n```\nroot@host01:~# docker exec -ti nginx /bin/bash\nroot@516d13e912a5:/#\n```\n\
  \n从这里，我们可以看到运行 NGINX 所需各种库：\n\n```\nroot@516d13e912a5:/# ldd $(which nginx)\n  \
  \      linux-vdso.so.1 (0x00007ffe2a1fa000)\n...\n        libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6\
  \ (0x00007fe0d6531000)\n        /lib64/ld-linux-x86-64.so.2 (0x00007fe0d6ed4000)\n\
  ```\n\n所有这些库都是我们下载的容器镜像的一部分，因此我们的 NGINX 容器不需要（也看不到）来自主机系统的任何文件。\n\n我们不仅拥有足够数量的库，在\
  \ `/etc` 中还有我们对 Debian 系统预期的典型配置文件：\n\n```\nroot@516d13e912aa5:/# ls -1 /etc\n...\n\
  debian_version\ndeluser.conf\ndpkg\n...\nsystemd/\n...\n```\n\n此列表显示文件系统甚至包含了容器并不真正需要的目录，例如\
  \ `/etc/systemd` 目录。（记住，容器只是在隔离状态下运行的一组相关进程，因此容器几乎不会运行如 `systemd` 这样的系统服务管理器。）\n\
  \n### 镜像版本\n\n快速下载预包文件系统的能力只是容器镜像的优势之一。另一个是为镜像的不同版本标记标签以便快速升级。让我们通过拉取和运行流行的内存键值数据库\
  \ Redis 的不同版本来探索这一点：\n\n```\nroot@host01:~# docker pull redis:6.0.13-alpine\n6.0.13-alpine:\
  \ Pulling from library/redis\n➊ 540db60ca938: Pull complete \n   29712d301e8c: Pull\
  \ complete \n   8173c12df40f: Pull complete \n   ...\n   docker.io/library/redis:6.0.13-alpine\n\
  \   root@host01:~# docker pull redis:6.2.3-alpine\n6.2.3-alpine: Pulling from library/redis\n\
  ➋ 540db60ca938: Already exists \n   29712d301e8c: Already exists \n```\n（注意：为了清晰起见，删除了重复部分。）\n\
  \n冒号之后的数据是 `image tag`（镜像标签），作为版本标识符。以前，当我们漏掉此内容时，Docker 默认使用 `latest`，这和其他任何标签一样，但按照惯例用于指代最新发布的镜像。通过指定版本，我们可以确保即使在发布了新版本的\
  \ Redis，我们也继续运行相同的版本，直到我们准备好升级。标签可以包含任何字符，在连字符后添加额外信息是常见的。在这种情况下，标签末尾的 -alpine 表明该镜像基于\
  \ Alpine Linux，这是一种因体积较小而流行的制作容器镜像的轻量级 Linux 发行版。\n\n\n\n\n另一个值得注意的有趣点是，当我们下载第二个版本的\
  \ Redis 时，某些内容 ➋ 被标记为“已存在”（Already exists）。查看第一次下载 Redis 的情况，我们发现那里存在相同的唯一标识符 ➊。这是因为容器镜像是由分层组成的，而这些标识符唯一地描述了每一层。如果我们已经下载的某个层被另一个镜像使用，就不需要再次下载它，从而节省了下载时间。此外，每个层在磁盘上只需要存储一次，节省了磁盘空间。\n\
  \n我们现在下载了两个不同版本的 Redis：\n\n```\nroot@host01:~# docker images | grep redis\nredis\
  \        6.0.13-alpine   a556c77d3dce   2 weeks ago   31.3MB\nredis        6.2.3-alpine\
  \    efb4fa30f1cf   2 weeks ago   32.3MB\n```\n\n尽管 Docker 报告每个镜像的大小约为 30MB，但那是所有层的总和，并没有考虑到共享层带来的存储空间节省。通过检查\
  \ Docker 对磁盘空间的使用情况，我们可以看到实际磁盘存储更少：\n\n```\nroot@host01:~# docker system df -v\n\
  Images space usage:\n\nREPOSITORY TAG           ... SIZE      SHARED SIZE   UNIQUE\
  \ SIZE ...\nredis      6.0.13-alpine ... 31.33MB   6.905MB       24.42MB     ...\n\
  redis      6.2.3-alpine  ... 32.31MB   6.905MB       25.4MB      ...\n```\n\n这两个\
  \ Redis 镜像共享了几乎 7MB 的基础层。\n\n这两个版本的 Redis 可以分独立运行：\n\n```\nroot@host01:~# docker\
  \ run -d --name redis1 redis:6.0.13-alpine\n66dbf56ec0e8db24ca78afc07c68b7d0699d68b4749e0c03310857cfce926366\n\
  root@host01:~# docker run -d --name redis2 redis:6.2.3-alpine\n9dd3f86a1284171e5ca60f7f8a6a13dc517237826a92b3cb256f5ac64a5f5c31\n\
  ```\n\n现在两个镜像都在运行，我们可以确认容器恰好是我们想要的 Redis 版本，这不取决于哪个版本是最新发布，也不取决于宿主机服务器上提供的版本：\n\n\
  ```\nroot@host01:~# docker logs redis1 | grep version\n1:C 21 May 2021 14:18:24.952\
  \ # Redis version=6.0.13, ...\nroot@host01:~# docker logs redis2 | grep version\n\
  1:C 21 May 2021 14:18:36.387 # Redis version=6.2.3, ...\n```\n\n这是构建可靠系统的巨大优势。我们可以用一个版本的软件对应用程序进行彻底测试，并确保该版本在我们选择升级之前将继续被使用。我们还可以轻松地针对新版本测试我们的软件，而无需升级宿主机系统。\n\
  \n### 构建容器镜像\n\n在之前的示例中，我们看到了如何通过共享层来减少容器镜像的下载和磁盘需求。这种层共享可以用于任何容器镜像，而不仅仅是相同软件的两个版本。\n\
  \n容器镜像中的层源于它的构建方式。容器镜像的构建从一个基础镜像（base image）开始。例如，我们的两个 Redis 版本都从相同的 Alpine Linux\
  \ 基础镜像开始，这就是为什么那些层在镜像中被共享了。从基础镜像开始，构建过程中的每一步都可以产生一个新层。这个新层仅包含该构建步骤产生的文件系统更改。\n\n\
  基础镜像也必须来自某个地方，最终必须有一个初始层，该层通常是从某些 Linux 发行版创建的最小 Linux 文件系统，传输到空容器镜像中，然后扩展成为初始层。\n\
  \n#### 使用 Dockerfile\n\n构建容器镜像有多种方法，但最流行的是创建一个名为 `Dockerfile` 或 `Containerfile`\
  \ 的文件，它指定了镜像的命令和配置。这是一个向 NGINX 镜像添加 Web 内容的简单 `Dockerfile`：\n\n`Dockerfile`\n\n\
  ```\n---\nFROM nginx\n\n# Add index.html\nRUN echo \"<html><body><h1>Hello World!</h1></body></html>\"\
  \ \\\n    >/usr/share/nginx/html/index.html\n```\n\n`Dockerfile` 中的每一行都以命令开头，后面紧跟参数。空行和\
  \ # 之后的内容会被忽略，行尾的反斜杠将该命令延续到下一行。有很多种可能的命令；这里是最常用的：\n\n- `FROM`: 指定用于此构建的基础镜像。\n-\
  \ `RUN`: 在容器内运行运行命令。\n- `COPY`: 将文件复制到容器中。\n- `ENV`: 指定环境变量。\n- `ENTRYPOINT`: 配置容器的初始进程。\n\
  - `CMD`: 为初始进程设置默认参数。\n\nDocker 提供了 `docker build` 命令来从 `Dockerfile` 构建镜像。`docker\
  \ build` 命令通过逐个运行 `Dockerfile` 中的每个命令来创建一个新镜像。列表 5-1\n\n```\nroot@host01:~# docker\
  \ build -t hello .\n```\n\n\n\n\n\n如第 1 章所述，`-p` 标记将主机端口转发到容器中，使我们即使在运行在独立的网络命名空间中，我们也能从主机访问\
  \ NGINX 服务器。然后我们可以使用 `curl` 查看容器包含了我们提供的内容。\n\n## 镜像的标记与发布\n\n该镜像已经准备好本地运行，但我们还没有准备好将其发布到注册仓库。要发布到注册仓库，我们需要为它命名，名称包含注册仓库位置的完整主机和路径，以确保当我们引用镜像时，获取的是正是我们预期的。\n\
  \n为了演示这一点，让我们从不同的注册仓库拉取多个 BusyBox 镜像。我们先从 `quay.io`（另一个容器镜像注册仓库）拉取 BusyBox 镜像：\n\
  \n```\nroot@host01:/opt/hello# docker pull quay.io/quay/busybox\n...\nquay.io/quay/busybox:latest\n\
  ```\n\n此镜像名称同时指定了主机 `quay.io` 和在该主机内的镜像位置 `quay/busybox`。由于之前没有指定版本，因此使用 `latest`\
  \ 作为默认值。我们能够拉取名为 `latest` 的版本，是因为有人显式地向此仓库发布了镜像的 `latest` 版本。\n\n我们使用此命令获得的 BusyBox\
  \ 镜像与仅拉取 `busybox` 获取的镜像不同：\n\n```\nroot@host01:/opt/hello# docker pull busybox\n\
  ...\ndocker.io/library/busybox:latest\nroot@host01:/opt/hello# docker images | grep\
  \ busybox\nbusybox                latest          d3cd072556c2   3 days ago    \
  \   1.24MB\nquay.io/quay/busybox   latest          e3121c769e39   8 months ago \
  \    1.22MB\n```\n\n当我们使用普通名称 `busybox` 时，Docker 默认从 `docker.io/library` 拉取镜像。该注册仓库被称为\
  \ Docker Hub，你可以在 `[`hub.docker.com`](https://hub.docker.com)` 浏览它。\n\n同样，当我们使用普通名称\
  \ `hello` 构建镜像时，Docker 认为它属于 `docker.io/library`。该路径用于官方 Docker 镜像，当然，我们没有权限在那里发布镜像。\n\
  \n本章的自动化设置包含了运行本地容器注册仓库，这意味着如果我们正确命名，就可以将此镜像发布到该本地注册仓库：\n\n```\nroot@host01:/opt/hello#\
  \ docker tag hello registry.local/hello\nroot@host01:/opt/hello# docker images |\
  \ grep hello\nhello                  latest          e9ca31d590f9   52 minutes ago\
  \   133MB\nregistry.local/hello   latest          e9ca31d590f9   52 minutes ago\
  \   133MB\n```\n\n现在同一个镜像以两个不同的名称存在，这提供了分层存储方式的额外优势。为镜像添加额外名称的成本很低。当然，我们在运行 `docker\
  \ build` 时最初也可以使用完整名称，但在本地构建和使用镜像时，使用较短的名称更加方便。\n\n现在我们已经正确命名了镜像，可以使用 `docker push`\
  \ 将其发布：\n\n```\nroot@host01:/opt/hello# docker push registry.local/hello\nUsing\
  \ default tag: latest\nThe push refers to repository [registry.local/hello]\n...\n\
  ```\n\n我们的本地注册仓库初始是空的，因此此命令会上传所有层，但如果我们以后推送任何包含某些相同层的镜像，它们将不会被再次上传。同样，如果我们从注册仓库中删除一个镜像标记，并不会删除层数据。\n\
  \n这种发布镜像的能力不仅限于我们自己构建的镜像。我们可以标记并推送刚刚从 Docker Hub 下载的 BusyBox 镜像：\n\n```\nroot@host01:/opt/hello#\
  \ docker tag busybox registry.local/busybox\nroot@host01:/opt/hello# docker push\
  \ registry.local/busybox\nUsing default tag: latest\nThe push refers to repository\
  \ [registry.local/busybox]\n...\nroot@host01:/opt/hello# cd\n```\n\n对镜像进行重新标记以便将其上传到私有注册仓库是一种常见做法，它可以帮助应用程序启动更快，并避免对互联网注册仓库的依赖。\n\
  \n最后一个命令（`cd`）带我们回到主目录，因为我们在 `/opt/hello` 完成了。\n\n## 镜像与容器存储\n\n如之前所述，使用单独层构建容器镜像有多个优点，包括减小下载大小、减少磁盘空间，以及在不使用任何额外空间的情况下用新名称重新标记镜像的能力。运行中容器所需的额外磁盘空间仅限于我们在容器运行期间写入的文件。最后，所有示例都展示了新容器启动有多快。所有这些特性共同说明了为什么层必须共享，不仅对于镜像，也对于新容器。为了在构建高效镜像时充分利用这种分层方法，理解这种分层文件系统的工作原理会有帮助。\n\
  \n 叠加文件系统 (Overlay Filesystems)\n\n当我们运行容器时，看到的是看起来像单一的文件系统，所有层都合并在一起，并且能够对任何文件进行更改。如果我们从同一个镜像运行多个容器，我们在每个容器中都会看到一个独立的文件系统，这样一个容器中的更改就不会影响另一个。在每次启动容器时无需复制整个文件系统的情况下，这是如何实现的？答案是叠加\
  \ 文件系统。\n\nOverlay 有三个主要部分。`lower` 目录是基础层所在；`upper` 目录是叠加层，而 `mount` 目录是统一文件系统可用的地方。\n\
  \nOverlay 文件系统由 Linux 内核模块提供，具有极高的性能。我们可以轻松创建一个 overlay 文件系统。第一步是创建必要的目录：\n\n```\n\
  root@host01:~# mkdir /tmp/{lower,upper,mount}\n```\n\n`mkdir` 命令创建了四个独立的目录。我们已经讨论了\
  \ `lower` 目录、`upper` 目录和 `mount` 目录。`work` 目录是一个额外的空目录，overlay 文件系统使用它作为临时空间以确保挂载目录中的更改是原子的——即确保它们一次出现。\n\
  \n让我们向 lower 和 upper 目录放入一些内容：\n\n```\nroot@host01:~# echo \"hello1\" > /tmp/lower/hello1\n\
  root@host01:~# echo \"hello2\" > /tmp/upper/hello2\n```\n\n接下来，我们只需挂载 overlay 文件系统：\n\
  \n```\nroot@host01:~# mount -t overlay \\\n  -o rw,lowerdir=/tmp/lower,upperdir=/tmp/upper,workdir=/tmp/work\
  \ \\\n  overlay /tmp/mount\n```\n\n现在 `/tmp/mount` 目录包含了 upper 和 lower 目录合并的内容：\n\
  \n```\nroot@host01:~# ls -l /tmp/mount\ntotal 8\n-rw-r--r-- 1 root root 7 May 24\
  \ 23:05 hello1\n-rw-r--r-- 1 root root 7 May 24 23:05 hello2\nroot@host01:/opt/hello#\
  \ cat /tmp/mount/hello1\nhello1\nroot@host01:/opt/hello# cat /tmp/mount/hello2\n\
  hello2\n```\n\n我们所做的任何更改在挂载位置显示，但实际上是在 upper 目录中完成的。\n\n\n\n\n\n```\nroot@host01:~#\
  \ echo \"hello3\" > /tmp/mount/hello3\nroot@host01:~# ls -l /tmp/mount\ntotal 8\n\
  -rw-r--r-- 1 root root 7 May 24 23:05 hello1\n-rw-r--r-- 1 root root 7 May 24 23:10\
  \ hello2\n-rw-r--r-- 1 root root 7 May 24 23:09 hello3\nroot@host01:~# ls -l /tmp/lower\n\
  total 4\n-rw-r--r-- 1 root root 7 May 24 23:05 hello1\nroot@host01:~# ls -l /tmp/upper\n\
  total 8\n-rw-r--r-- 1 root root 7 May 24 23:10 hello2\n-rw-r--r-- 1 root root 7\
  \ May 24 23:09 hello3\n```\n\n此外，即使删除文件也不会影响下层目录（lower directory）：\n\n```\nroot@host01:~#\
  \ rm /tmp/mount/hello1\n   root@host01:~# ls -l /tmp/mount\n   total 8\n   -rw-r--r--\
  \ 1 root root 7 May 24 23:10 hello2\n   -rw-r--r-- 1 root root 7 May 24 23:09 hello3\n\
  \   root@host01:~# ls -l /tmp/lower\n   total 4\n   -rw-r--r-- 1 root root 7 May\
  \ 24 23:05 hello1\n   root@host01:~# ls -l /tmp/upper\n   total 8\n➊ c---------\
  \ 1 root root 0, 0 May 24 23:11 hello1\n   -rw-r--r-- 1 root root    7 May 24 23:10\
  \ hello2\n   -rw-r--r-- 1 root root    7 May 24 23:09 hello3\n```\n\n在上层目录（upper\
  \ directory）中，`hello1` 列表旁边的 `c` ➊ 表示这是一个字符设备文件（character special file*）。它的作用是指示该文件在上层目录已被删除。因此，尽管它仍然存在于下层目录中，但在挂载的文件系统中不会显示。\n\
  \n得益于这种方法，我们可以使用独立的叠加层（overlay）复用下层目录，就像我们可以从同一个镜像运行多个独立容器一样：\n\n```\nroot@host01:~#\
  \ mkdir /tmp/{upper2,work2,mount2}\nroot@host01:~# mount -t overlay \\\n  -o rw,lowerdir=/tmp/lower,upperdir=/tmp/upper2,workdir=/tmp/work2\
  \ \\\n  overlay /tmp/mount2\nroot@host01:~# ls -l /tmp/mount2\ntotal 4\n-rw-r--r--\
  \ 1 root root 7 May 24 23:05 hello1\n```\n\n不仅下层目录中被“删除”的文件出现了，而且第一个上层目录的内容也没有显示，因为它不属于这个新叠加层的一部分。\n\
  \n### 理解容器层\n\n有了这些关于 overlay 文件系统的信息，我们可以探索正在运行的 NGINX 容器的文件系统：\n\n```\nroot@host01:~#\
  \ ROOT=$(docker inspect nginx \\\n  | jq -r '.[0].GraphDriver.Data.MergedDir')\n\
  root@host01:~# echo $ROOT\n/var/lib/docker/overlay2/433751e2378f9b11.../merged\n\
  ```\n\n与之前一样，我们使用 `jq` 来选择我们需要的字段；在这种情况下，它是容器文件系统的 `merged*` 目录的路径。这个合并目录（merged\
  \ directory）是 overlay 文件系统的挂载点：\n\n```\nroot@host01:~# mount | grep $ROOT | tr [:,]\
  \ '\\n'\noverlay on /var/lib/docker/overlay2/433751e2378f9b11.../merged ...\nlowerdir=/var/lib/docker/overlay2/l/ERVEI5TCULK4PCNO2HSWB4MFDB\n\
  /var/lib/docker/overlay2/l/RQDO2PYQ3OKMKDY3DAYPAJTZHF\n/var/lib/docker/overlay2/l/LFSBVPYPODQJXDL5WQTI7ISYNC\n\
  /var/lib/docker/overlay2/l/TLZUYV2BFQNPFGU3AZFUHOH27V\n/var/lib/docker/overlay2/l/4M66FKSHDBNUWE7UAF2REQHSB2\n\
  /var/lib/docker/overlay2/l/LCTKPRHP6LG7KC7JQHETKIL6TZ\n/var/lib/docker/overlay2/l/JOECSCSAQ5CPNHGEURVRT4JRQQ\n\
  upperdir=/var/lib/docker/overlay2/433751e2378f9b11.../diff\nworkdir=/var/lib/docker/overlay2/433751e2378f9b11.../work,xino=off)\n\
  ```\n\n`tr` 命令将冒号和逗号转换为换行符，使输出更具读性。\n\n`mount` 命令显示了七个独立的 `lowerdir` 条目，分别对应 NGINX\
  \ 容器镜像中的每一层。这七个目录加上 `upperdir` 在 overlay 文件系统中合并在一起了。\n\n我们可以在挂载目录和上层目录中看到之前创建的\
  \ 10MB 数据文件：\n\n```\nroot@host01:~# ls -l $ROOT/tmp/data\n-rw-r--r-- 1 root root\
  \ 10485760 May 25 00:27 /var/lib/.../merged/tmp/data\nroot@host01:~# ls -l $ROOT/../diff/tmp/data\n\
  -rw-r--r-- 1 root root 10485760 May 25 00:27 /var/lib/.../diff/tmp/data\n```\n\n\
  实际文件存储在上层目录 `diff` 中，而挂载目录 `merged*` 只是 overlay 文件系统生成的视图。\n\n通常，我们不需要从宿主机深入容器文件系统，因为我们可以直接在容器内部运行命令。\n\
  \n#### 实际镜像构建\n\n容器镜像不仅仅是层的集合。它还包含元数据，例如初始命令。容器倡议（OCI）提供了镜像存储的标准格式。它确保由一个工具构建的镜像可以被任何工具使用。\n\
  \n为了演示 OCI 格式，让我们从 Docker 提取 BusyBox 镜像并使用 `skopeo` 存储为 OCI 格式。第一步是提取镜像：\n\n```\n\
  root@host01:~# skopeo copy docker-daemon:busybox:latest oci:busybox:latest\n...\n\
  ```\n\n该命令告诉 `skopeo` 从 Docker 引擎获取镜像并以 OCI 格式写入。我们现在有一个包含镜像的 `busybox` 目录：\n\n\
  ```\nroot@host01:~# ls -l busybox\ntotal 12\ndrwxr-xr-x 3 root root 4096 May 24\
  \ 23:59 blobs\n-rw-r--r-- 1 root root 247 May 24 23:59 index.json\n-rw-r--r-- 1\
  \ root root 31 May 24 23:59 oci-layout\n```\n\n`oci-layout` 文件指定了此镜像使用的 OCI 版本：\n\
  \n```\nroot@host01:~# jq . busybox/oci-layout\n{\n  \"imageLayoutVersion\": \"1.0.0\"\
  \n}\n```\n\n`index.json` 文件告诉我们关于镜像的信息：\n\n```\nroot@host01:~# jq . busybox/index.json\n\
  {\n  \"schemaVersion\": 2,\n  \"manifests\": [\n    {\n      \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\"\
  ,\n      \"digest\": \"sha256:9c3c5aeeaa7e1629871808339...\",\n      \"size\": 347,\n\
  \      \"annotations\": {\n        \"org.opencontainers.image.ref.name\": \"latest\"\
  \n      }\n    }\n  ]\n}\n```\n\n\n\n\n\n`manifests` 属性是一个数组，允许我们向单个 OCI 目录或包中存储多个镜像。实际的文件系统内容以层的形式存储在\
  \ `blobs` 中，每个层都是一个独立的 `.tar` 文件，因此任何共享层都只存储一次。\n\n这个 BusyBox 镜像只有一个层。要查看其内容，我们需要通过\
  \ `index.json` 和镜像清单（image manifest）来找到其 `.tar` 文件的路径：\n\n```\nroot@host01:~# MANIFEST=$(jq\
  \ -r \\\n  .manifests[0].digest busybox/index.json | sed -e 's/sha256://')\nroot@host01:~#\
  \ LAYER=$(jq -r \\\n  .layers[0].digest busybox/blobs/sha256/$MANIFEST | sed -e\
  \ 's/sha256://')\nroot@host01:~# echo $LAYER\n197dfd3345530fd558a64f2a550e8af75a9cb812df5623daf0392aa39e0ce767\n\
  ```\n\n`blobs` 目录中的文件是根据文件内容计算的 SHA-256 摘要命名的。首先，我们使用 `jq` 获取 BusyBox 镜像清单的摘要，并去掉开头的\
  \ `sha256:` 部分以获得清单文件的名称。然后我们读取清单以找到第一个（也是唯一的）层。现在我们可以看到该层的内容：\n\n```\nroot@host01:~#\
  \ tar tvf busybox/blobs/sha256/$LAYER\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 bin/\n-rwxr-xr-x 0/0         1149184 2021-05-17 19:07 bin/\ndrwxr-xr-x 0/0\
  \               0 2021-05-17 19:07 etc/\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 dev/\ndrwxr-xr-x 0/0               0 2021-05-17 19:07 lib/\ndrwxr-xr-x 0/0\
  \               0 2021-05-17 19:07 opt/\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 root/\ndrwxr-xr-x 0/0               0 2021-05-17 19:07 s/\ndrwxr-xr-x 0/0\
  \               0 2021-05-17 19:07 sh/\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 usr/\ndrwxr-xr-x 0/0               0 2021-05-17 19:07 var/\ndrwxr-xr-x 0/0\
  \               0 2021-05-17 19:07 var/\n```\n\n向 `tar` 命令传递 `tvf` 会列出我们指定的文件的内容，在本例中是\
  \ BusyBox 镜像层。该层包含了一个完整的 Linux 文件系统。\n\n使用此 `busybox` 目录，我们也可以打包镜像，将其移动到单独系统，然后拉取到另一个容器引擎。\n\
  \n### 最后的思考\n\n当我们运行容器时，我们得到的是独立的、隔离的且可以根据需要修改的文件系统。在底层，容器引擎使用叠加文件系统来合并多个镜像层和一个可写目录以存储我们所做的所有更改。叠加文件系统不仅让容器快速启动，而且意味着我们可以在不等待文件完成的情况下运行多个容器，从而减少所需的磁盘空间。\n\
  \n现在我们已经查看了进程隔离、资源限制、网络隔离和容器存储，涵盖了容器在打包、分发和运行应用程序方面的这些价值特性。是时候转向 Kubernetes 等容器编排环境所提供的关键特性了。我们将在第二部分进行介绍。\n\
  \n# 第二部分\n\n# KUBERNETES 中的容器\n\n计算机的处理器、存储和内存是有限的，并且由故障的部分组成。为了构建可扩展且可靠的应用程序，我们一直需要利用多个服务器来处理应用程序负载并防止单点故障。现在我们在容器中运行这些组件的事并没有改变对多个服务器的需求；我们最终仍然依赖硬件。\n\
  \n同时，容器编排环境带来了其他类型可能不存在的挑战。我们不想放弃容器提供的模块化和灵活性。在第二部分中，我们将看到 Kubernetes 如何满足跨机器运行容器的基本需求，包括跨主机网络、可扩展性自动故障转移以及分布式存储。\n\
  \n## 6: 为什么 Kubernetes 重要\n\n![image](img/common01)\n\n容器允许我们转换打包和部署应用程序组件的方式，而在集群中编排容器实现了微服务架构的真正优势。如第一章所示，现代应用程序的主要优势是可扩展性、可靠性和恢复能力，这三项优势都需要\
  \ Kubernetes 等容器编排环境以便在许多服务器和网络上运行容器化应用程序组件。\n\n在本章中，我们将首先查看在集群多个服务器上运行容器时存在的交叉关注点。我们将描述解决这些问题的\
  \ Kubernetes 核心概念。介绍完成后，我们将花费大部分时间实际安装 Kubernetes 集群，包括网络和存储等重要的附加组件。\n\n### 在集群中运行容器\n\
  \n将应用程序组件分发到多个服务器的需求对于现代应用程序架构来说并不新鲜。为了构建可扩展且可靠的应用程序，我们总是需要利用多个服务器来处理负载并排除单点故障。现在我们在容器中运行这些组件的事并没有改变对多个服务器的需求；我们仍然依赖硬件。\n\
  \n同时，容器编排环境带来了其他类型可能不存在的挑战。当容器成为我们构建系统的最小单元模块时，我们的应用程序组件从基础设施的角度来看变得更加自包含且“透明”。这意味着我们不再通过静态应用程序架构预先选择将哪些组件分配到特定服务器，而是通过\
  \ Kubernetes 让任何容器都能任何地方运行。\n\n#### 交叉关注点\n\n在任何地方运行任何容器的能力提高了我们的灵活性，但也给 Kubernetes\
  \ 增加了复杂性。Kubernetes 无法预知会被要求运行哪些容器，且容器负载负载负载不断变化。为了应对这一挑战，Kubernetes 需要考虑适用于所有容器编排软件的设计参数，无论运行什么容器：\n\
  \n- **动态调度**：新容器必须分配到服务器，且分配可能会由于配置更改或故障而发生。\n- **分布式状态**：整个集群必须保留关于在何处运行哪些容器的信息，即使在硬件或网络故障期间也是如此。\n\
  - **多租户**：应该能够在单个集群中运行多个应用程序，并提供安全和可靠性方面的隔离。\n- **硬件隔离**：集群必须运行在云环境和各种类型的普通服务器上，将容器与这些环境的隔离开。\n\
  \n用于描述这些设计参数的最佳术语是*交叉关注点*（cross-cutting concern），因为适用于适用于可能需要的任何容器化软件，甚至适用于 Kubernetes\
  \ 基础设施本身。\n\n#### Kubernetes 概念\n\n为了解决这些交叉关注点，Kubernetes 架构允许任何内容随时切换。这不仅包括部署到\
  \ Kubernetes 的容器化应用程序，还包括 Kubernetes 本身的基础软件组件。\n\n##### 独立的控制平面\n\n显然，为了让 Kubernetes\
  \ 成为容器编排环境，它需要运行容器的能力。这种能力由一组称为*节点*（nodes）的工作机器提供。每个节点运行一个 `kubelet` 服务，该服务与底层容器运行时接口以启动和监控容器。\n\
  \n\n\n\nKubernetes 还有一组核心的软件组件，用于管理工作节点及其容器，但这些软件组件是与工作节点分离部署的。这些核心 Kubernetes 软件组件统称为\
  \ `control plane`（控制面）。由于控制面与工作节点分离，工作节点可以运行控制面，从而为 Kubernetes 核心软件组件带来容器化的优势。独立的控制面也意味着\
  \ Kubernetes 本身采用了微服务架构，这允许对每个 Kubernetes 集群进行定制。例如，其中一个控制面组件 `cloud controller\
  \ manager`（云控制器）仅在将 Kubernetes 部署到云提供商时使用，并根据所使用的云提供商进行定制。这种设计为应用容器和 Kubernetes\
  \ 控制面的其余部分提供了硬件隔离，同时允许我们利用每个云提供商的特定功能。\n\n## 声明式 API\n\nKubernetes 控制面的一个关键组件是 `API\
  \ server`。API server 为集群控制和监控提供了一个接口，其他集群用户和控制面组件都会该接口。在定义 API 时，Kubernetes 原本可以选择\
  \ `imperative`（命令式）风格，即每个 API 端点都是一个如“运行容器”或“分配存储”之类的命令。相反，API 是 `declarative`（声明式的），提供了如\
  \ `create`、`patch`、`get` 和 `delete` 等端点。这些命令的效果是从集群配置中创建、读取、更新和删除 `resources`（资源）——每个资源的特定配置告诉\
  \ Kubernetes 我们希望集群执行的操作。\n\n这种声明式 API 对于满足动态调度和分布式状态等跨领域问题的关注点至关重要。由于声明式 API 仅仅是报告或更新集群配置，因此应对可能导致命令丢失的服务器或网络故障是非常容易的。考虑这样一个例子：在发布\
  \ `apply` 命令更改集群配置后，API server 的连接丢失了。当连接恢复时，客户端可以简单地查询集群配置并判断命令是否成功接收。或者，更简单的是，客户端只需再次发布相同的\
  \ `apply` 命令，因为只要集群配置最终符合预期，Kubernetes 就会尝试对实际集群执行“正确的事”。这一核心原则被称为 `idempotence`（幂等性），意味着多次发布相同的命令是安全的，因为它最多只会被执行一次。\n\
  \n## 自愈\n\n基于声明式 API，Kubernetes 的设计是 `self-healing`（自愈）的。这意味着控制面组件会持续监控集群配置和实际集群状态，并尝试将两者保持一致。集群配置中的每个资源都有一个关联的状态和事件日志，反映了配置实际上是如何导致集群状态发生变化的。\n\
  \n配置与状态的分离使得 Kubernetes 具有很强的韧性。例如，如果容器已经调度并实际运行，那么代表容器的资源可能处于 `Running`（运行）状态。如果\
  \ Kubernetes 控制面丢失了与运行容器的服务器的连接，它可以立即将状态设置为 `Unknown`（未知），然后努力重新建立连接，或将该节点视为失败并重新调度容器。\n\
  \n同时，使用声明式 API 和自愈方法具有重要意义。由于 Kubernetes API 是声明式的，对命令的“成功”响应仅意味着集群配置已更新。这并不意味着集群的实际状态已更新，因为达到请求的状态可能需要时间，或者可能存在某些问题阻止集群实现该状态。因此，我们不能假设仅仅因为创建了适当的资源，集群就在运行我们预期的容器。相反，我们必须观察资源的状态并探索事件日志，以诊断\
  \ Kubernetes 控制面在使实际集群状态匹配我们指定的配置时所遇到的任何问题。\n\n## 集群部署\n\n在掌握了一些 Kubernetes 核心概念后，我们将使用\
  \ `kubeadm` Kubernetes 管理工具在多个虚拟机上部署高可用 Kubernetes 集群。\n\n### 选择 Kubernetes 发行版\n\
  \n我们不像在第 1 章 中那样使用特定的 Kubernetes 发行版，而是使用通用上游仓库部署一个“原生”（vanilla）Kubernetes 集群。这种方法让我们有最好的机会跟进集群部署，并使接下来的几章节中更容易深入探索集群。然而，当你准备好部署自己的\
  \ Kubernetes 集群时（特别是用于生产工作），请考虑使用预构建的 Kubernetes 发行版，以便于管理和内置安全性。云原生基金会（CNCF）发布了一系列一致性测试，你可以使用这些测试来确保选择的\
  \ Kubernetes 发行符合 Kubernetes 规范。\n\n我们的 Kubernetes 集群将分布在四台虚拟机上，标记为 `host01` 到 `host04`。其中三个（`host01`\
  \ 到 `host03`）将运行控制面组件，而第四个将仅作为工作节点。我们将拥有三个控制面节点，因为这是运行高可用集群所需的最少数量。Kubernetes 使用投票机制来提供故障转移，至少需要三个控制面节点；这允许集群在发生网络故障时检测哪一侧应该继续运行。此外，为了保持示例的规模尽可能小，我们将配置\
  \ Kubernetes 在控制面节点上运行常规容器，尽管我们在生产集群中会避免这样做。\n\n**注意**\n\n本书的示例存储库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页上的“运行示例”获取设置详细信息。\n\n首先按照本章的指令将四台虚拟机启动并运行，可以使用 Vagrant 或 AWS。自动化配置将为所有四台机器安装\
  \ `containerd` 和 `crictl`，因此我们不需要手动操作。自动化配置脚本还将设置 `kube-vip` 或 AWS 网络负载均衡器来实现所需的可用可用功能（下文所述）。\n\
  \n**注意**\n\n你可以使用本章提供的额外配置脚本自动安装 Kubernetes。请参阅本章的 README 文件获取说明。\n\n你需要在四台虚拟机中的每一台上运行命令，因此可能需要为每个节点打开终端。然而，第一系列命令需要在所有主机上运行，因此自动化设置了一个名为\
  \ `k8s-all` 的命令来从 `host01` 执行这些操作。你可以查看 `/usr/local/bin/k8s-all` 中的脚本内容，或者查看示例 `setup`\
  \ 目录下的 `k8s` Ansible 角色。\n\n#### 前提包\n\n第一步是确保 `br_netfilter` 内核模块已启用并设置为启动时加载。Kubernetes\
  \ 使用 Linux 防火墙的高级功能处理跨集群网络，因此我们需要这个模块。运行这两个命令：\n\n```\nroot@host01:~# k8s-all modprobe\
  \ br_netfilter\n...\nroot@host01:~# k8s-all \"echo 'br_netfilter' > /etc/modules-load.d/k8s.conf\"\
  \n```\n\n\n\n第一个命令确保为当前运行的内核安装该模块，而第二个命令将其添加到启动时运行的模块列表中。第二个命令中略显奇怪的引号用法确保了 shell\
  \ 重定向在远程主机上发生。\n\n接下来，在列表 6-1 中，我们将使用 `sysctl` 命令设置某些 Linux 内核参数以启用高级网络功能，这些功能对于集群网络也是所需的：\n\
  \n```\nroot@host01:~# k8s-all sysctl -w net.ipv4.ip_forward=1 \\\n  net.bridge.bridge-nf-call-ip6tables=1\
  \ \\\n  net.bridge.bridge-nf-call-iptables=1\n```\n\n*列表 6-1：内核设置*\n\n此命令启用了以下 Linux\
  \ 内核网络功能：\n\n`net.ipv4.ip_forward` 将数据包从一个网络接口传输到另一个（例如，从容器网络空间内部的接口传输到主机网络）。\n\n\
  `net.bridge.bridge-nf-call-ip6tables`: 让 IPv6 桥接流量通过 `iptables` 防火墙。\n\n`net.bridge.bridge-nf-call-iptables`:\
  \ 让 IPv4 桥接流量通过 `iptables` 防火墙。\n\n后两项的必要性将在第 9 章讨论 Kubernetes 如何为 Service 提供网络支持时变得清晰。\n\
  \n列表 6-1 中的这些 `sysctl` 更改在重启后不会持久化。自动化脚本会处理使这些更改持久化的工作，因此如果你重启了虚拟机，请运行额外的配置脚本，或重新运行这些命令。\n\
  \n我们现在已经完成了 Linux 内核配置以支持我们的 Kubernetes 部署，几乎准备好进行实际安装。首先我们需要安装一些预备包：\n\n```\nroot@host01:~#\
  \ k8s-all apt install -y apt-transport-https \\\n  open-iscsi nfs-common\n```\n\n\
  `apt-transport-https` 包确保 `apt` 支持通过安全的 HTTP 连接到存储库。另外两个包用于我们在集群运行后将安装的集群插件之一。\n\
  \n### Kubernetes 软件包\n\n我们现在可以添加 Kubernetes 存储库以安装将设置集群的 `kubeadm` 工具。首先，添加用于检查包签名的\
  \ GPG 密钥：\n\n```\nroot@host01:~# k8s-all \"curl -fsSL \\\n  https://packages.cloud.google.com/apt/doc/apt-key.gpg\
  \ | \\\n  gpg --dearmor -o /usr/share/keyrings/google-cloud-keyring.gpg\"\n```\n\
  \n该命令使用 `curl` 下载 GPG 密钥。然后使用 `gpg` 对其进行重新格式，并将结果写入 `/usr/share/keyrings`。命令行标志\
  \ `fsSL` 让 `curl` 处于一种更适合链式命令的模式，包括避免不必要的输出、跟随服务器重定向并在出现问题时错误终止。\n\n接下来，我们添加存储库配置：\n\
  \n```root\nroot@host01:~# k8s-all \"echo 'deb [arch=amd64' \\\n  'signed-by=/usr/share/keyrings/google-cloud-keyring.gpg]'\
  \ \\\n  'https://apt.kubernetes.io/ kubernetes-xenial main' > \\\n  /etc/apt/sources.list.d/kubernetes.list\"\
  \n```\n\n与之前一样，引号对于确保命令通过 SSH 正确传递到集群中的所有其他主机至关重要。该命令将 `kubernetes-xenial` 配置为发行版；此发行版适用于任何版本的\
  \ Ubuntu，从较旧的 Ubuntu Xenial 开始。\n\n在我们创建此新存储库后，我们需要在所有主机上运行 `apt update` 来下载包列表：\n\
  \n```\nroot@host01:~# k8s-all apt update\n...\n```\n\n现在我们可以使用 `apt` 安装所需的包：\n\n\
  ```\nroot@host01:~# source /opt/k8sver\nroot@host01:~# k8s-all apt install -y kubelet=$K8SV\
  \ kubeadm=$K8SV kubectl=$K8SV\n```\n\n`source` 命令加载一个包含变量的文件，用以安装特定的 Kubernetes\
  \ 版本。该文件由自动化脚本创建，并确保我们在所有章节中使用一致的 Kubernetes 版本。你可以更新自动化脚本来选择要安装的 Kubernetes 版本。\n\
  \n`apt` 命令安装了以下三个包以及一些依赖项：\n\n- `kubelet`: 所有工作节点上的服务，与与容器引擎接口，根据控制平面的调度运行容器\n-\
  \ `kubeadm`: 我们将用它安装 Kubernetes 并维护集群的管理工具\n- `kubectl`: 我们将用它检查 Kubernetes 集群并创建和删除资源的命令行客户端\n\
  \n`kubelet` 包会立即启动其服务，但由于我们还没有安装控制面，该服务最初处于失败状态：\n\n```\nroot@host01:~# systemctl\
  \ status kubelet\n  kubelet.service - kubelet: The Kubernetes Node Agent\n...\n\
  \   Main PID: 75368 (code=exited, status=1/FAILURE)\n```\n\n我们需要控制刚刚安装的包包版本，因为我们想要一起升级集群的所有组件。为了防止意外更新这些包，我们将它们锁定在当前版本：\n\
  \n```\nroot@host01:~# k8s-all apt-mark hold kubelet kubeadm kubectl\n```\n\n该命令防止标准的\
  \ `apt-upgrade` 更新这些包。\n\n### 集群初始化\n\n第一个命令确保为当前运行的内核安装该模块，而第二个命令将其添加到启动时运行的模块列表中。第二个命令中略显奇怪的引号用法确保了\
  \ shell 重定向在远程主机上发生。\n\n接下来，在列表 6-1 中，我们将使用 `sysctl` 命令设置某些 Linux 内核参数以启用高级网络功能，这些功能对于集群网络也是所需的：\n\
  \n（同上文）\n\n此命令启用了以下 Linux 内核网络功能：\n\n`net.ipv4.ip_forward` 将数据包从一个网络接口传输到另一个（例如，从容器网络空间内部的接口传输到主机网络）。\n\
  \n`net.bridge.bridge-nf-call-ip6tables`: 让 IPv6 桥接流量通过 `iptables` 防火墙。\n\n`net.bridge.bridge-nf-call-iptables`:\
  \ 让 IPv4 桥接流量通过 `iptables` 防火墙。\n\n后两项的必要性将在第 9 章讨论 Kubernetes 如何为 Service 提供网络支持时变得清晰。\n\
  \n列表 6-1 中的这些 `sysctl` 更改在重启后不会持久化。自动化脚本会处理使这些更改持久化的工作，因此如果你重启了虚拟机，请运行额外的配置脚本，或重新运行这些命令。\n\
  \n我们现在已经完成了 Linux 内核配置以支持我们的 Kubernetes 部署，几乎准备好进行实际安装。首先我们需要安装一些预备包：\n\n（同上文）\n\
  \n`apt-transport-https` 包确保 `apt` 支持通过安全的 HTTP 连接到存储库。另外两个包用于我们在集群运行后将安装的集群插件之一。\n\
  \n### 集群初始化\n\n我们需要控制刚刚安装的包版本，因为我们想要一起升级集群的所有组件。为了防止意外更新这些包，我们将它们锁定在当前版本：\n\n（同上文）\n\
  \n执行 `apt-mark hold kubelet kubeadm kubectl` 命令命令防止标准的 `apt full-upgrade` 更新这些包。\n\
  \n下一个命令 `kubeadm init` 初始化控制面。以下显示了 `/etc/kubernetes/kubeadm-init.yaml` 的内容：\n\n\
  ```yaml\n---\napiVersion: kubeadm.io/v1beta3\nkind: InitConfiguration\nbootstrapTokens:\n\
  - groups:\n  - system:bootstrappers:default-node\ntoken: 1d8fb1.2875d52d6a3282f656adb1\n\
  \  ttl: 2h0s\n  usages:\n  - signing\n  - authentication\n---\napiVersion: kubeadm.io/v1beta3\n\
  kind: ClusterConfiguration\nkubernetesVersion: 1.21.4\napiServer:\n  extraArgs:\n\
  \    service-node-port: 80-32767\nnetworking:\n  podSubnet: \"172.31.0.0/16\"\n\
  controlPlaneEndpoint: \"192.168.61.10:6443\"\n---\napiVersion: kubelet.config.k8s.io/v1beta1\n\
  kind: KubeletConfiguration\nserverTLSBootstrap: true\n```\n\n为了初始化集群，我们在 `/etc/kubernetes/kubeadm-init.yaml`\
  \ 创建此文件，然后运行 `kubeadm init`。该命令设置控制面并生成必要的证书。控制面准备绪后，`kubeadm` 将输出一个加入命令，我们将用它将工作节点加入集群。\n\
  \n\n\n\n\n`certificateKey` 配置一个密钥，其他节点将使用该密钥访问 API 服务器的证书。这是为了确保我们高可用集群中的所有 API\
  \ 服务器实例都能使用相同的证书。在生产集群中，请保持其机密。\n\n`networking` 集群中的所有容器无论运行在什么宿主机上，都会从 `podSubnet`\
  \ 获取 IP 地址。稍后，我们将安装网络驱动程序，确保集群中所有主机上的每个容器都能进行通信。\n\n`controlPlaneEndpoint` API 服务器的外部地址。对于高可用集群，此\
  \ IP 地址需要能够到达任何 API 服务器实例，而不仅仅是第一个。\n\n`serverTLSBootstrap` 指令 kubelet 使用控制器的证书权威机构（CA）来请求服务器证书。\n\
  \n`apiVersion` 和 `kind` 字段会出现在每个 Kubernetes YAML 文件中。`apiVersion` 字段定义了一组相关的 Kubernetes\
  \ 资源，包括版本号。`kind` 字段则用于在该组内选择特定的资源类型。这不仅允许 Kubernetes 项目和其他供应商随着时间的推移添加新的资源组，还允许在维护向后兼容的同时更新现有的资源规范。\n\
  \n## 高可用集群\n\n`controlPlaneEndpoint` 字段用于配置高可用集群的最重要要求：一个可以到达所有 API 服务器的 IP 地址。在初始化集群时，我们需要立即建立此\
  \ IP 地址，因为它用于生成证书，客户端将通过这些证书验证 API 服务器的身份。提供集群范围 IP 地址的最佳方法取决于集群运行的位置；例如，在云环境中，使用提供商的内置功能（如\
  \ Amazon Web Services 中的弹性负载均衡器 (ELB) 或 Azure 负载均衡器）是最好的。\n\n由于两种不同环境的性质，本书中的示例在配合\
  \ Vagrant 运行时使用 `kube-vip`，在 Amazon Web Services 中运行时使用 `ELB`。示例文档中的顶层 `README.md`\
  \ 文件包含更多细节。安装和配置是自动完成的，因此无需额外配置。我们只需要使用 `192.168.61.10:6443`，并预期流量将到达运行在 `host01`\
  \ 到 `host03` 上的任何 API 服务器实例。\n\n由于我们已经在一个 YAML 文件中准备好了集群配置，因此初始化集群的 `kubeadm init`\
  \ 命令非常简单。我们仅在 `host01` 上运行此命令：\n\n```\nroot@host01:~# /usr/bin/kubeadm init \\\n\
  \  --config /etc/kubernetes/kubeadm-init.yaml --upload-certs\n```\n\n`--config`\
  \ 选项指向我们之前过的 YAML 配置文件 (`kubeadm-init.yaml`)，而 `--upload-certs` 选项告诉 `kubeadm` 它应该将\
  \ API 服务器的证书上传到集群的分布式存储中。其他控制平面节点在加入集群时可以下载这些证书，允许所有 API 服务器实例使用相同的证书，以便客户端信任它们。证书使用我们提供的\
  \ `certificateKey` 进行加密，这意味着其他节点需要此密钥来解密它们。\n\n`kubeadm init` 命令在 `host01` 上初始化控制平面组件。这些组件运行在容器中并由\
  \ `kubelet` 服务管理，这使得它们很容易升级。将下载多个容器镜像，因此该命令可能需要一段时间，这取决于你的虚拟机的速度和互联网连接。\n\n## 将节点加入集群\n\
  \n`kubeadm init` 命令会打印出一个 `kubeadm join` 命令，我们可以用它将其他节点加入集群。然而，自动化脚本已经为每个其他节点预置了配置文件，以确保它们以正确的节点类型加入。服务器\
  \ `host02` 和 `host03` 将作为额外的控制平面节点加入，而 `host04` 将仅作为工作节点加入。\n\n以下是 `host02` 带有特定设置的\
  \ YAML 配置文件：\n\n`kubeadm-join.yaml (host02)*\n\n```\n---\napiVersion: kubeadm.k8s.io/v1beta3\n\
  kind: JoinConfiguration\ndiscovery:\n  bootstrapToken:\n    apiServerEndpoint: 192.168.61.10:6443\n\
  \    token: 1d8fb1.2875d52d62a3282d\n    unsafeSkipCAVerification: true\n  timeout:\
  \ 5m0s\nnodeRegistration:\n  kubeletExtraArgs:\n    cgroup-driver: containerd\n\
  \    node-ip: 192.168.61.12\n  taints: []\n  ignorePreflightErrors:\n    - DirAvailable--etc-kubernetes-manifests\n\
  controlPlane:\n  localAPIEndpoint:\n    advertiseAddress: 192.168.61.12\n  certificateKey:\
  \ \"5a7e07816958efb97635e9a66256adb1\"\n```\n\n该资源的类型为 `JoinConfiguration`，但大多数字段与\
  \ `kubeadm-init.yaml` 文件中的 `InitConfiguration` 相同。最重要的是 `token` 和 `certificateKey`\
  \ 与我们之前设置的密钥匹配，因此该节点将能够集群验证自身并解密 API 服务器证书。\n\n一个区别是增加了 `ignorePreflightErrors`。此部分仅在我们安装\
  \ `kube-vip` 时出现，因为在这种情况下，我们需要为 `kube-vip` 预置 `/etc/kubernetes/manifests` 目录，并告诉\
  \ `kubeadm` 该目录已存在。\n\n由于我们已经准备好了 YAML 配置文件，`kubeadm join` 命令是简单的。在 `host02` 上运行它：\n\
  \n```\nroot@host02:~# /usr/bin/kubeadm join --config /etc/kubernetes/kubeadm-init.yaml\n\
  ```\n\n`kubeadm init` 命令在 `host01` 上初始化控制平面组件。这些组件运行在容器中并由 `kubelet` 服务管理，这使得它们很容易升级。将下载多个容器镜像，因此该命令可能需要一段时间，这取决于你的虚拟机的速度和互联网连接。\n\
  \n当此完成后，我们将拥有一个高可用集群，控制平面位于三个单独主机上。然而，我们还没有任何工作节点。让我们解决这个问题。\n\n我们将首先作为工作节点加入 `host04`并在\
  \ `host04` 上运行完全相同的 `kubeadm join` 命令，但 YAML 文件会有所不同。\n\n*kubeadm-join.yaml (host04)*\n\
  \n```\n---\napiVersion: kubeadm.k8s.io/v1beta3\nkind: JoinConfiguration\ndiscovery:\n\
  \  bootstrapToken:\n    apiServerEndpoint: 192.168.61.10:6443\n    token: 1d8fb1.2875d52d62a3282d\n\
  \    unsafeSkipCAVerification: true\n  timeout: 5m0s\nnodeRegistration:\n  kubeletExtraArgs:\n\
  \    cgroup-driver: containerd\n    node-ip: 192.168.61.14\n  taints: []\n```\n\n\
  该 YAML 文件缺少 `controlPlane` 字段，因此 `kubeadm` 将其配置为普通工作节点而不是控制平面节点。\n\n现在将 `host04`\
  \ 加入集群：\n\n```\nroot@host04:~# /usr/bin/kubeadm join --config /etc/kubernetes/kubeadm-join.yaml\n\
  ```\n\n此命令完成得快一点，因为它不需要下载控制平面容器镜像并运行它们。我们现在集群中有四个节点，可以通过通过返回 `host01` 运行 `kubectl`\
  \ 来验证：\n\n```\nroot@host01:~# export KUBECONFIG=/etc/kubernetes/admin.conf\nroot@host01:~#\
  \ kubectl get nodes\nNAME     STATUS     ROLES        ...\nhost01   NotReady   control-plane...\n\
  host02   NotReady   control-plane...\nhost03   NotReady   control-plane...\nhost04\
  \   NotReady   <none>       ...\n```\n\n第一个命令设置了一个环境变量，告诉 `kubectl` 使用哪个配置文件。`/etc/kubernetes/admin.conf`\
  \ 文件是由 `kubeadm` 在初始化 `host01` 作为控制平面节点时自动创建的。该文件告诉 `kubectl` 使用哪个 API 服务器 地址、使用什么证书来验证安全连接以及如何进行身份验证。\n\
  \n\n\n\n这四个节点目前应该报告状态为 `NotReady`。让我们运行 `kubectl describe` 命令来获取节点详情：\n\n```\nroot@host01:~#\
  \ kubectl describe node host04\nName:               host04\n...\nConditions:\n \
  \ Type   Status ... Message\n  ----   ------ ... -------\n  Ready  False  ... container\
  \ runtime network not ready...\n...\n```\n\n我们还没有为 Kubernetes 集群安装网络驱动程序，因此，所有节点都报告\
  \ `NotReady` 状态，这意味着它们将不会接受常规应用程序工作负载。Kubernetes 通过在节点配置中放置 `taint`（污点）来表达这一点。污点限制了哪些内容可以被调度到某个节点上。我们可以使用\
  \ `kubectl` 来列出节点上的污点：\n\n``````\nroot@host01:~# kubectl get node -o json | \\\n\
  \  jq '.items[]|.metadata.name,.spec.taints[]'\n\"host01\"\n{\n  \"effect\": \"\
  NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\n}\n\"host02\"\n{\n \
  \ \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\n}\n\"\
  host03\"\n{\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n\"host04\"\n{\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n```\n\n我们选择 `json` 输出格式，以便我们使用 `jq` 仅打印我们所需的信息。由于所有节点状态均为 `NotReady`，它们都设置了效果为\
  \ `NoSchedule` 的 `not-ready` 污点，这阻止了 Kubernetes 调度器将容器调度到它们上。\n\n通过在 `kubeadm` 配置中将污点指定为空数组，我们防止了三个控制面节点产生额外的控制面污点。在生产集群中，出于安全考虑，该污点会将应用程序容器与控制面容器隔离，因此我们会保留它。但是，对于我们的示例集群，这意味着我们需要多个额外的虚拟机来作为工作节点，而这并不是我们想要的。\n\
  \n`kubectl taint` 命令允许我们手动移除 `not-ready` 污点，但正确的方法是将网络驱动程序作为集群插件安装，这样节点就能正确地报告 `Ready`，从而使能够在它们上运行容器。\n\
  \n### 安装集群插件\n\n我们已经在四个独立的节点上安装了 `kubelet`，并在其中三个节点上安装了控制面，并将它们加入了我们的集群。对于其余节点，我们将使用控制面来安装集群插件。这些插件与我们部署的常规应用程序类似。它们由\
  \ Kubernetes 资源组成并在容器中运行，但它们为集群提供了应用程序所需的各种服务。\n\n为了让基础集群运行起来，我们需要安装三种插件：`network\
  \ driver`（网络驱动）、`storage driver`（存储驱动）和 `ingress controller`。我们安装第四个可选插件 `metrics\
  \ server`。\n\n#### 网络驱动程序\n\nKubernetes 网络基于容器网络接口 (CNI) 标准。任何人都可以通过实现该标准为 Kubernetes\
  \ 构建新的网络驱动程序，因此，Kub 网络驱动程序有多种选择。我们将在第 8 章 中演示不同的网络插件，但书中的大多数集群使用 Calico 网络驱动程序，因为它是许多\
  \ Kubernetes 平台的默认选择。\n\n首先，下载 Calico 的主要 YAML 配置文件：\n\n```\nroot@host01:~# cd /etc/kubernetes/components\n\
  root@host01:/etc/kubernetes/components# curl -L -O $calico_url\n...\n```\n\n`-L`\
  \ 告诉 `curl` 跟踪任何 HTTP 重定向，而 `-O` 告诉 `curl` 使用与 URL 相同的文件名保存内容。`calico_url` 环境变量的值是在\
  \ `k8s-ver` 脚本中设置的，该脚本还指定了 Kubernetes 版本。这是至关重要的，因为 Calico 对我们运行的特定 Kubernetes 版本敏感，因此选择兼容的值非常重要。\n\
  \n主要的 YAML 配置被写入本地文件 `tigera-operator.yaml`。这指的是初始安装是一个 Kubernetes Operator，随后它会创建所有其他集群资源来安装\
  \ Calico。我们将在第 17 章 中探索运算符。\n\n除了这个主要的 YAML 配置外，本章的自动化脚本添加了一个名为 `custom-resources.yaml`\
  \ 的文件，它为我们的示例集群提供了必要的配置。现在我们可以告诉 Kubernetes API 服务器将这些文件中的所有资源应用到集群中：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f tigera-operator.yaml\n...\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f custom-resources.yaml\n```\n\nKubernetes 需要几分钟来下载容器镜像并启动容器，然后\
  \ Calico 就会在我们的集群中运行，我们的节点应该报告 `Ready` 状态：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl get nodes\nNAME     STATUS   ROLES                ...\nhost01   Ready\
  \    control-plane,master ...\nhost02   Ready    control-plane,master ...\nhost03\
  \   Ready    control-plane,master ...\nhost04   Ready    <none>               ...\n\
  ```\n\nCalico 的工作原理是安装 `DaemonSet`（一种指示集群在每个节点上运行特定容器的 Kubernetes 资源），然后 Calico\
  \ 将我们的集群中运行，我们的节点应该报告 `Ready` 状态。但这引发了一个重要问题：当我们安装 Calico 时，所有的节点都有一个告诉 Kubernetes\
  \ 不要调度它们的污点。Calico 是如何在所有节点上运行的？答案是 `tolerations`（忍度）。\n\n忍度是一种应用于资源的设置，指示 Kubernetes\
  \ 即使存在污点也可以进行调度。Calico 在添加其 DaemonSet 时指定了忍度，我们可以通过 `kubectl` 看到：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl -n calico-system \\\n  get daemonsets -o json | \\\n  jq '.items[]].template.spec.tolerations'\n\
  {\n  \"key\": \"CriticalAddonsOnly\",\n  \"operator\": \"Exists\"\n}\n{\n  \"effect\"\
  : \"NoSchedule\",\n  \"operator\": \"Exists\"\n}\n{\n  \"effect\": \"NoExecute\"\
  ,\n  \"operator\": \"Exists\"\n}\n```\n\n`-n` 选项选择了 calico-system `Namespace`。命名空间是在集群上隔离\
  \ Kubernetes 资源的方式，出于安全考虑以及避免命名冲突。同样如之前，我们请求 JSON 输出并使用 `jq` 选择感兴趣的字段。如果你想查看资源的完整配置，请在不带\
  \ `jq` 的情况下使用 `-o=json`。\n\n这个 DaemonSet 有三个忍度，其中第二个一个提供了我们需要的行为。它告诉 Kubernetes\
  \ 调度器，即使节点带有 `NoSchedule` 污点也可以继续调度它。Calico 随后可以在节点就绪之前启动，一旦它运行，节点状态就会变为 `Ready`，以便调度常规应用程序容器。控制面组件需要类似的忍度，以便在显示\
  \ Ready 之前运行。\n\n#### 安装存储\n\n集群节点已就绪，所以如果我们部署一个常规应用程序，它的容器将会运行。然而，需要持久存储的应用程序将无法启动，因为集群还没有存储驱动程序。就像网络驱动一样，Kubernetes\
  \ 有多种存储驱动可用。容器存储接口 (CSI) 提供了存储驱动与 Kubernetes 工作所需的标准。我们将使用来自 Rancher 的 Longhorn\
  \ 存储驱动；它很容易安装，不需要任何底层硬件（如额外的块设备或云存储的访问）。\n\nLonghorn 使用我们之前安装的 iSCSI 和 NFS 软件。它期望我们所有的节点都启用并运行\
  \ `iscsid` 服务，所以让我们确保在所有节点上都是如此：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ k8s-all systemctl enable --now iscsid\n```\n\n\n\n我们现在可以在集群上安装 Longhorn 了。安装 Longhorn\
  \ 的过程与 Calico 非常相似。首先下载 Longhorn 的 YAML 配置：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ curl -LO $longhorn_url\n```\n\n`longhorn_url` 环境变量也是由 `k8s-ver` 脚本设置的，这使得我们能够确保兼容性。\n\
  \n使用 `kubectl` 安装 Longhorn：\n\n```\nroot@host01:/etc/kubernetes/components# kubectl\
  \ apply -f longhorn.yaml\n```\n\n与之前一样，`kubectl apply` 确保 YAML 文件中的资源被应用到集群，并根据需要创建或更新它们。`kubectl\
  \ apply` 命令支持将 URL 作为其应用到集群的资源源，但对于这三次安装，我们分别运行了单独的 `curl` 命令，因为在本地保留一份已应用到集群的副本会更方便。。\n\
  \nLonghorn 现在已安装在集群上，我们将在本章的后续部分通过探索集群来验证这一点。\n\n#### Ingress 控制器 (Ingress Controller)\n\
  \n我们现在已经有了网络和存储，但网络仅允许从集群内部访问容器。我们需要另一个服务将我们的容器化应用暴露到集群外部。最简单的方法是使用 Ingress 控制器。正如我们在第\
  \ 9 章中描述的，Ingress 控制器监控 Kubernetes 集群中的 `Ingress` 资源并路由网络流量。\n\n我们首先下载 ingress 控制器的\
  \ YAML 配置：\n\n```\nroot@host01:/etc/kubernetes/components# curl -Lo ingress-controller.yaml\n\
  \  $ingress_url\n```\n\n与之前的示例一样，`ingress_url` 环境变量由 `k8s-ver` 脚本设置，以便我们能够确保兼容性。在这种情况下，URL\
  \ 以通用路径 `deploy.yaml` 结尾，因此我们使用 `-o` 为 `curl` 提供一个文件名，以明确下载的 YAML 文件的用途。\n\n使用 `kubectl`\
  \ 安装 ingress 控制器：\n\n```\nroot@host01:/etc/kubernetes/components# kubectl apply\
  \ -f ingress-controller.yaml\n```\n\n这创建了许多资源，但主要包含两个部分：一个实际执行 HTTP 流量路由的 NGINX\
  \ Web 服务器，以及一个监控集群中 Ingress 资源变化并相应配置 NGINX 的组件。\n\n我们还有最后一步需要执行。按照安装方式，ingress\
  \ 控制器会尝试请求外部 IP 地址，以允许流量从集群外部到达它。由于我们运行的是无法访问外部 IP 地址的示例集群，这将无法工作。相反，我们将通过从集群主机的端口转发（port\
  \ forwarding）来访问我们的 ingress 控制器。目前，我们的 ingress 控制器已配置了此端口转发，但它使用的是随机端口。我们希望选择一个端口，以确保我们知道在哪里找到该\
  \ ingress 控制器。同时，我们还将添加一个注解（annotation），使该 ingress 控制器成为该集群的默认控制器。\n\n为了应用端口更改，我们将为\
  \ Kubernetes 集群提供一个包含所需更改的额外 YAML 配置。这是该 YAML：\n\n`ingress-patch.yaml`\n\n```\n\
  ---\napiVersion: v1\nkind: Service\nmetadata:\n  name: ingress-nginx-controller\n\
  \  namespace: ingress-nginx\nspec:\n  ports:\n    - port: 80\n      nodePort: 80\n\
  \    - port: 443\n      nodePort: 443\n```\n\n该文件指定了 `Service` 的名称和命名空间（Namespace），以确保\
  \ Kubernetes 知道在哪里应用这些更改。它还指定了我们正在更新的端口配置以及 `nodePort`，`nodePort` 是我们集群节点上用于端口转发的端口。我们将在第\
  \ 9 章中详细地查看 NodePort 服务类型和端口转发。\n\n要补丁该服务，我们使用 `kubectl patch` 命令：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl patch -n ingress-nginx \\\n  service/ingress-nginx-controller --patch-file\
  \ ingress-patch.yaml\nservice/ingress-nginx-controller patched\n```\n\n要应用注解，使用\
  \ `kubectl annotate` 命令：\n\n```\nroot@host01:/etc/kubernetes/components# kubectl\
  \ annotate -n ingress-nginx \\\n  ingressclass/nginx ingressclass.kubernetes.io/ingress-class=\"\
  true\"\n```\n\n应用注解后，Kubernetes 会报告该资源的变化已应用。\n\n#### 监控服务器 (Metrics Server)\n\n\
  我们的最后一个插件是 `metrics server`，它从节点收集利用率指标，启用自动扩展。为了做到这一点，它需要连接到 `kubelet`。为了安全起见，`kubelet`\
  \ 使用客户端证书向 API 服务器进行身份验证；这些证书在启动时已自动批准。我们需要批准的请求是用于 kubelet-serving 的证书，当 metrics\
  \ server 等客户端连接到 kubelet 时使用。一旦请求被批准，控制器管理器就会对其签名。`kubelet` 然后将收集证书并开始使用。\n\n在设置期间，`kubelet`\
  \ 在每个节点创建了证书请求，但这些请求并未自动批准。让我们找到这些请求：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl get csr\nNAME                                SIGNERNAME              \
  \             ... CONDITION\ncsr-sgrwz ... kubernetes.io/kubelet-serving       \
  \        ... Pending\ncsr-agwb6 ... kubernetes.io/apiserver-client-kubelet ... Approved,Issued\n\
  csr-2kwwk ... kubernetes.io/kubelet-serving               ... Pending\ncsr-5496d\
  \ ... kubernetes.io/apiserver-client-kubelet ... Approved,Issued\ncsr-hm6lj ...\
  \ kubernetes.io/apiserver-client-kubelet ... Approved,Issued\ncsr-jbfmx ... kubernetes.io/kubelet-serving\
  \               ... Pending\ncsr-njjr7 ... kubernetes.io/apiserver-client-kubelet\
  \ ... Approved,Issued\ncsr-v7tcs ... kubernetes.io/kubelet-serving             \
  \  ... Pending\ncsr-vr27n ... kubernetes.io/kubelet-serving               ... Pending\n\
  1 more from\n```\n\n我们可以通过查询所有 kubelet-serving 请求的名称并将这些名称传递给 `kubectl certificate\
  \ approve` 来一次性批准所有请求：\n\n```\nroot@host01:/etc/kubernetes/components# kubectl certificate\
  \ approve \\$(kubectl\n  get csr --field-selector signerName=kubernetes.io/kubelet-serving\
  \ -o name)\ncertificatesigningrequest.certificates.k8s.io/csr-sgrwz approved\n```\n\
  \n我们现在可以通过下载并应用 YAML 配置来安装监控服务器：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ curl -Lo metrics-server.yaml \\$metrics_url\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f metrics-server.yaml\n...\nroot@host01:/etc/kubernetes/components#\
  \ cd\nroot@host01:~#\n```\n\n该组件是我们最后一个需要安装的组件，所以我们可以离开此目录。有了这些集群插件，我们现在拥有了一个完整的、高**\
  \ Kubernetes 集群。\n\n### 探索集群\n\n在向这个全新的 Kubernetes 集群部署我们的第一个应用程序之前，让我们探索一下它上运行着什么。我们在这里使用的命令在以后我们调试自己的应用程序以及运行不正常的集群时将大有用。\n\
  \n我们将使用 `crictl`（我们在第一部分中探索运行容器时使用的相同命令）来查看 host01 上运行了哪些容器：\n\n\n\n\n\n```\nroot@host01:~#\
  \ crictl ps\nCONTAINER       ... STATE    NAME                       ...\n25c63f29c1442\
  \   ... Running  longhorn-csi-plugin        ...\n2ffdd044a81d8   ... Running  node-driver-registrar\
  \      ...\n94468050de89c   ... Running  csi-provisioner            ...\n119fbf417f1db\
  \   ... Running  csi-attacher               ...\ne74c1a2a0c422   ... Running  kube-scheduler\
  \             ...\nd1ad93cdbc686   ... Running  kube-controller-manager    ...\n\
  76266a522cc3d   ... Running  engine-image-ei-611d1496   ...\nfc3cd1679e33e   ...\
  \ Running  replica-manager            ...\n48e792a973105   ... Running  engine-manager\
  \             ...\ne658baebbc295   ... Running  longhorn-manager           ...\n\
  eb51d9ec0f2fc   ... Running  calico-kube-controllers    ...\n53e7e3e4a3148   ...\
  \ Running  calico-node                ...\n772ac45ceb94e   ... Running  calico-typha\
  \               ...\n4005370021f5f   ... Running  kube-proxy                 ...\n\
  26929cde3a264   ... Running  kube-apiserver             ...\n9ea4c2f5af794   ...\
  \ Running  etcd                       ...\n```\n\n控制平面节点非常忙碌，因为此列表包含了 Kubernetes\
  \ 控制平面组件、Calico 组件和 Longhorn 组件。在所有节点上运行此命令并整理哪些容器运行在何处以及为了什么会非常困惑。幸运的是，`kubectl`\
  \ 提供了一个更清晰的视图，尽管知道我们可以深入到这些底层细节，并确切看到给定节点上运行了哪些容器是很很棒的事。\n\n要使用 `kubectl` 探索集群，我们需要了解集群资源是如何组织到命名空间（Namespaces）中的。如前所述，Kubernetes\
  \ 命名空间提供了安全性并避免了名称冲突。为了确保幂等性，Kubernetes 需要每个资源都有唯一的名称。通过将资源划分为命名空间，我们允许多个资源具有相同的名称，同时让\
  \ API server 能够确切知道我们指的是哪一个资源，这也支持了多租户，这是我们的跨领域关注点之一。\n\n尽管我们刚刚设置了集群，但它已经包含了几个命名空间：\n\
  \n```\nroot@host01:~# kubectl get namespaces\nNAME              STATUS   AGE\ncalico-system\
  \     Active   50m\ndefault           Active   150m\nkube-node-lease   Active  \
  \ 150m\nkube-public       Active   150m\nkube-system       Active   150m\nlonghorn-system\
  \   Active   16m\ntigera-operator   Active   50m\n```\n\n当我们运行 `kubectl` 命令时，它们将应用到默认命名空间，除非我们使用\
  \ `-n` 选项指定不同的命名空间。\n\n要查看正在运行哪些容器，我们要求 `kubectl` 获取 Pod 列表。我们将在第 7 章中更详细地查看 Kubernetes\
  \ Pod。现在，只需知道 Pod 是一个或多个容器的组，与我们在第一部分中使用 `crictl` 创建的 Pod 非常相似的。\n\n如果我们尝试在默认命名空间中列出\
  \ Pod，会发现目前还没有任何 Pod：\n\n```\nroot@host01:~# kubectl get pods\nNo resources found\
  \ in default namespace.\n```\n\n到目前为止，由于我们安装了集群基础设施组件，它们已经在其他命名空间中创建了。这样，当我们配置普通用户账户时，就可以防止这些用户查看或编辑集群基础设施。Kubernetes\
  \ 基础设施组件都安装在了 `kube-system` 命名空间中：\n\n```\nroot@host01:~# kubectl -n kube-system\
  \ get pods\nNAME                             READY   STATUS    ...\ncoredns-558bd4d5db-7krwr\
  \         1/1     Running   ...\n...\nkube-apiserver-host01            1/1     Running\
  \   ...\n...\n```\n\n我们将在第 11 章中介绍控制平面组件。现在，让我们只探索控制平面 Pod 之一，运行在 host01 上的 API\
  \ server。我们可以使用 `kubectl describe` 获取此 Pod 的所有细节：\n\n```\nroot@host01:~# kubectl\
  \ -n kube-system describe pod kube-apiserver-host01\nName:                 kube-apiserver-host01\n\
  Namespace:            kube-system\n...\nNode:                 host01/192.168.61.11\n\
  ...\nStatus:               Running\nContainers:\n  kube-apiserver:\n    Container\
  \ ID:  containerd://26929cde3a264e...\n...\n```\n\n命名空间和名称共同唯一标识了该 Pod。我们还看到了 Pod\
  \ 调度所在的节点、它的状态以及实际容器的详细信息，包括容器 ID，我们可以使用它配合 `crictl` 在底层的 containerd 运行时找到该容器。\n\
  \n让我们也验证 Calico 是否按预期部署到我们的集群：\n\n```\nroot@host01:~# kubectl -n calico-system get\
  \ pods\nNAME                                       READY   STATUS    ...\ncalico-kube-controllers-7f5888d-...\
  \   2/2     Running   ...\ncalico-node-dn4rj-64bytes-...           1/1     Running\
  \   ...\ncalico-node-xnkm-611d-...               1/1     Running   ...\ncalico-node-zfscp-1496-...\
  \               1/1     Running   ...\ncalico-node-p6q-99cd-...               1/1\
  \     Running   ...\ncalico-typha-88d-7zct-...               1/1     Running   ...\n\
  calico-typha-68b9cd-4ts-...             1/1     Running   ...\ncalico-typha-jrd6-7f58-...\
  \               1/1     Running   ...\n```\n\n之前我们看到 Calico 安装了一个 DaemonSet。Kubernetes\
  \ 使用该 DaemonSet 为每个节点自动创建一个 `calico-node`。正如 Kubernetes 本身一样，Calico 也使用独立的控制平面来处理网络。最后，我们将看到\
  \ Longhorn 的容器：\n\n```\nroot@host01:~# kubectl -n longhorn-system get pods\nNAME\
  \                                       READY   STATUS   RESTARTS   AGE\nengine-image-ei-611d1496-8q5f\
  \             1/1     Running   0          31m\nlonghorn-csi-plugin-8vkr       \
  \           2/2     Running   0          31m\nlonghorn-manager-dl9sb           \
  \          1/1     Running   0          32m\n```\n\n就像 Calico 一样，Longhorn 使用 DaemonSet...\
  \ 当 Kubernetes 需要时创建存储。\n\n我们为这个集群投入了大量精力，如果不运行一个应用程序就结束本章太可惜了。在下一章中，我们将查看许多运行容器的方法，但让我们先在集群中快速运行一个\
  \ Nginx 服务器：\n\n```\nroot@host01:~# kubectl run nginx --image=nginx\npod/nginx created\n\
  ```\n\n这看起来像是一个临时命令，但在底层，`kubectl` 正在使用我们指定的名称和镜像创建一个 Pod 资源，然后将其应用到集群中。让我们检查默认命名空间：\n\
  \n```\nroot@host01:~# kubectl get pods -o wide\nNAME    READY   STATUS    ... IP\
  \               NODE  ...\nnginx   1/1     Running   ... 172.31.89.203   host02\
  \ ...\n```\n\n我们使用了 `-o wide` 来查看 Pod 的额外信息，包括其 IP 地址和调度位置，每次创建 Pod 时都可能不同。在这种情况下，Pod\
  \ 被调度到了 `host02`，说明我们成功允许常规应用程序容器部署到我们的控制平面节点。IP 地址来自我们配置的 Pod CIDR，Calico 会自动分配它。\n\
  \nCalico 还负责处理路由，以便我们可以从集群中的任何容器以及主机网络访问该 Pod。让我们验证一下，从普通的 ping 开始：\n\n```\nroot@host01:~#\
  \ ping -c 1 172.31.89.203\nPING 172.31.89.203 (172.31.89.203) 56(84) bytes of data.\n\
  64 bytes from 172.31.89.203: icmp_seq=1 ttl=63 time=0.848 ms\n```\n\n\n\n\n请用此处显示的\
  \ IP 地址替换为你 Pod 的 IP 地址。\n\n我们还可以使用 `curl` 来验证 NGINX Web 服务器是否正常工作：\n\n```\nroot@host01:~#\
  \ curl http://172.31.89.203\n...\n<title>Welcome to nginx!</title>\n...\n```\n\n\
  Kubernetes 集群已运行，并准备好为我们部署应用程序。Kubernetes 将利用集群中的所有节点对我们的应用程序进行负载均衡，并在发生任何故障时提供恢复能力。\n\
  \n### 结语\n\n在本章中，我们探索了 Kubernetes 是是如何构建的，其灵活性允许集群组件随时地加入或离开。这不仅适用于容器化应用程序，还适用于集群组件，包括控制平面微服务以及集群使用的底层服务器和网络。我们能够引导集群，然后动态地向其添加节点，配置这些节点以接受特定类型的容器，然后使用\
  \ Kubernetes 集群本身动态地添加网络和存储驱动来运行并监控它们。最后，我们将我们的第一个容器部署到 Kubernetes 集群中，允许它自动将容器调度到可用节点，并使用我们的网络驱动程序从主机网络访问该容器。\n\
  \n现在我们已经有了一个高可用集群，可以查看如何向 Kubernetes 部署应用程序。我们将探索创建可扩展、可靠应用程序时需要创建的一些关键 Kubernetes\
  \ 资源。这一过程将为详细探索 Kubernetes 提供基础，包括理解当我们的应用程序运行不符合预期时发生了什么，以及如何调试应用程序或 Kubernetes\
  \ 集群中的问题。\n\n## 7. 将容器部署到 KUBERNETES\n\n![image](img/common01.jpg)\n\n我们现在已准备好在在我们运行的\
  \ Kubernetes 集群上开始运行容器。由于 Kubernetes 具有声明式 API，我们将创建各种资源来运行它们，并将监控集群以查看 Kubernetes\
  \ 对每种类型的资源做了什么。\n\n不同的容器有不同的用例。某些容器可能需要多个相同的实例并带有自动伸缩，以便在负载下表现良好。其他容器可能仅为了运行一次性命令而存在。还有一些可能需要固定的顺序，以便选择单个主实例并向备用实例提供受控的故障转移。Kubernetes\
  \ 为这些每个用例提供了不同的 `controller` 资源类型。我们将逐一查看，但将从其中最基础的 `Pod` 开始，所有这些用例都会用到它。\n\n###\
  \ Pods\n\nPod 是 Kubernetes 中最基础的资源，也是我们运行容器的方式。每个 Pod 内部可以包含一个或多个容器。Pod 用于提供我们在第\
  \ 2 章中看到的进程隔离。Linux 内核命名空间被用于 Pod 和容器级别：\n\n- `mnt` 挂载点：每个容器都有自己的根文件系统；其他挂载点对 Pod\
  \ 中的所有容器可用。\n- `uts` Unix 时间共享：在 Pod 级别进行隔离。\n- `ipc` 进程间通信：在 Pod 级别进行隔离。\n- `pid`\
  \ 进程标识符：在容器级别进行隔离。\n- `net` 网络：在 Pod 级别进行隔离。\n\n这种方法最大的优势是，多个容器可以像同一个虚拟主机上的进程一样，使用\
  \ `localhost` 地址进行通信，同时仍然基于独立的容器镜像。\n\n### 部署一个 Pod\n\n为了开始，让我们直接创建一个 Pod。与上一章不同（上一章中我们使用\
  \ `kubectl run` 来让我们创建 Pod 规范），这次我们将直接使用 YAML 指定它，以便我们对 Pod 有完全的控制权，并为使用控制器创建 Pod\
  \ 做好准备，从而提供扩展性和故障转移。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页 的“运行示例”获取设置的详情。\n\n本章的自动化脚本执行了包含三个节点的完整集群安装，这些节点运行控制平面和平普通应用程序，为测试提供了最小的高可用集群。自动化脚本还创建了一些\
  \ Kubernetes 资源的 YAML 文件。这里有一个创建一个运行 NGINX 的 Pod 的基础 YAML 资源：\n\n`nginx-pod.yaml`\n\
  \n```\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n\
  \  - name: nginx\n    image: nginx\n```\n\nPods 是 Kubernetes `core` API 的一部分，因此我们只需为\
  \ `apiVersion` 指定版本号 `v1`。将 `kind` 指定为 `Pod` 告诉 Kubernetes 我们确切地在 API 组中创建的是什么资源。我们将在所有的\
  \ Kubernetes 资源中看到这些字段。\n\n`metadata` 字段有许多用途。对于 Pod 来说，我们只需要提供一个必需字段 `name`。我们没有在\
  \ `metadata` 中指定 `namespace`，因此默认情况下此 Pod 将位于默认的 `Namespace` 中。\n\n剩余字段 `spec` 告诉\
  \ Kubernetes 运行此 Pod 所需的所有信息。目前我们提供的是最少的信息，即要运行的容器列表，但还有许多其他选项可用。在这种情况下，我们只有一个容器，因此我们只提供了名称和\
  \ Kubernetes 应该使用的容器镜像。\n\n让我们将此 Pod 添加到集群。自动化脚本将文件添加到了 `/opt`，因此我们可以从 `host01`\
  \ 如下进行操作：\n\n```\nroot@host01:~# kubectl apply -f /opt/nginx-pod.yaml\npod/nginx\
  \ created\n```\n\n在列表 7-1 中，我们可以检查 Pod 的状态。\n\n```\nroot@host01:~# kubectl get pods\
  \ -o wide\nNAME    READY   STATUS    RESTARTS   AGE     IP               NODE\n\
  nginx   1/1     Running   0          2m26s   172.31.25.202   host03\n```\n\n*列表\
  \ 7-1：NGINX 状态*\n\n在 Pod 显示为 `Running` 之前可能需要一段时间，特别是如果你刚设置好集群且它仍在忙于组件。继续尝试此 `kubectl`\
  \ 命令检查状态。\n\n与其多次输入 `kubectl` 命令，你还可以使用 `watch`。`watch` 命令是观察集群随时间变化的极方法。只需在命令前加上\
  \ `watch`，它就会每秒为你运行一次。\n\n我们在命令中加入了 `-o wide` 以查看 IP 地址和节点分配。Kubernetes 为我们管理这些。在这种情况下，Pod\
  \ 被调度到了 `host03`，因此我们需要去那里查看容器：\n\n```\nroot@host03:~# crictl pods --name nginx\n\
  POD ID         CREATED         STATE  NAME   NAMESPACE  ...\n9f1d6e0207d7e  19 minutes\
  \ ago  Ready  nginx  default    ...\n```\n\n在运行 NGINX Pod 的任何主机上运行此命令。\n\n如果我们收集\
  \ Pod ID，也可以看到容器：\n\n```\nroot@host03:~# POD_ID=$(crictl pods -q --name nginx)\n\
  root@host03:~# crictl ps --pod $POD_ID\nCONTAINER      IMAGE          CREATED  \
  \       STATE    NAME\n9da09b3671418  4cdc5dd7eaadf  20 minutes ago  Running\n```\n\
  \n使用 `crictl` 底层容器引擎来探索集群中运行的容器是有价值的，但它确实要求我们连接到运行容器的主机。很多时候，我们可以通过连接到集群的 API 服务器并使用\
  \ `kubectl` 命令从任何地方检查 Pod，从而避免这一点。让我们回到 `host01` 并进一步探索 NGINX Pod。\n\n#### Pod 详情和日志\n\
  \n\n\n\n在第 6 章中，我们看到了如何使用 `kubectl describe` 来查看集群节点的状态和事件日志。我们可以使用相同的命令来查看其他 Kubernetes\
  \ 资源的状态和配置细节。以下是我们的 NGINX Pod 的事件日志：\n\n```\nroot@host01:~# kubectl describe pod\
  \ nginx\n Name:         nginx\n Namespace: ➊ default \n ...\n Containers:\n   nginx:\n\
  \     Container ID:   containerd://9da09b3671418...\n ...\n➋ Type    Reason    \
  \ Age   From               Message\n   ----    ------     ----  ----           \
  \    -------\n   Normal  Scheduled  22m   default-scheduler  Successfully assigned\
  \ ...\n   Normal  Pulling    22m   kubelet            Pulling image \"nginx\"\n\
  \   Normal  Pulled     21m   kubelet            Successfully pulled image ...\n\
  \   Normal  Created    21m   kubelet            Created container nginx\n   Normal\
  \  Started    21m   kubelet            Started container nginx\n```\n\n我们可以将 `kubectl\
  \ describe` 用于许多不同的 Kubernetes 资源，因此我们首先告诉 `kubectl` 我们对一个 Pod 感感兴趣并提供名称。由于我们没有指定\
  \ `Namespace`，Kubernetes 将在默认 Namespace ➊ 中查找此 Pod。\n\n**注意**\n\n我们在书中的大多数示例中使用了默认\
  \ Namespace 以节省输入时间，但使用多个 Namespaces 来保持应用程序分离是一个良好的做法，这既可以避免命名冲突，也可以管理访问控制。我们将在第\
  \ 11 章中更详细地查看 Namespaces。\n\n`kubectl describe` 命令的输出提供了事件日志 ➋，当我们启动容器时遇到问题时，这是查找问题的第一个地方。\n\
  \nKubernetes 在部署容器时会执行几个步骤。首先，它需要将其调度到节点上，这要求该节点可用且具有足够的资源。然后，控制权交给该节点上的 `kubelet`，它必须与容器引擎交互以拉取镜像、创建容器并启动它。\n\
  \n容器启动后，`kubelet` 会收集标准输出和标准错误。通过使用 `kubectl logs` 命令查看这些输出：\n\n```\nroot@host01:~#\
  \ kubectl logs nginx\n...\n2021/07/13 22:37:03 [notice] 1#1: start worker processes\n\
  2021/07/13 22:37:03 [notice] 1#1: start worker process 33\n2021/07/13 22:37:03 [notice]\
  \ 1#1: start worker process 34\n```\n\n`kubectl logs` 命令始终指的是 Pod，因为 Pod 是运行容器的基础的基础资源，而我们的\
  \ Pod 只有一个容器，所以我们只需要将 Pod 的名称作为单个参数传递给 `kubectl logs` 即可。之前一样，由于我们没有指定 `Namespace`，Kubernetes\
  \ 将在默认 Namespace 中查找。\n\n即使容器已经退出，容器输出也是可用的，因此如果一个容器成功拉取并启动但随后崩溃，`kubectl logs`\
  \ 命令就是查找的地方。当然，我们必须希望容器打印了条解释其崩溃原因的日志消息。在第 10 章中，我们查看了在无法启动容器且没有任何日志消息时该怎么办。\n\n\
  我们已经完成了 NGINX Pod 的操作，现在来清理它吧：\n\n```\nroot@host01:~# kubectl delete -f /opt/nginx-pod.yaml\n\
  pod \"nginx\" deleted\n```\n\n我们可以使用相同的 YAML 配置文件来删除 Pod，当我们在单个文件中定义了多个 Kubernetes\
  \ 资源时，这非常方便，因为一个命令就会删除所有它们。`kubectl` 命令使用文件中定义的每个资源的名称来执行删除操作。\n\n## 部署 (Deployments)\n\
  \n要运行容器，我们需要一个 Pod，但这并不意味着我们通常想直接创建 Pod。当我们直接创建 Pod 时，我们无法获得 Kubernetes 提供的所有扩展性和故障转移能力，因为\
  \ Kubernetes 只运行一个 Pod 实例。该 Pod 仅在创建时被分配给节点，即使节点失败也不会重新分配。\n\n为了获得扩展性和故障转移能力，我们需要创建一个控制器来为我们管理\
  \ Pod。我们将查看多个可以运行 Pod 的控制器，但让我们从最常见的开始：`Deployment`。\n\n#### 创建 Deployment\n\nDeployment\
  \ 管理一个或多个*相同*的 Kubernetes Pod。当我们创建一个 Deployment 时，我们提供一个 Pod 模板。然后，Deployment 在\
  \ `ReplicaSet` 的帮助下创建与该模板匹配的 Pod。\n\n##### 部署与副本集\n\nKubernetes 随着时间的推移演变成了它的控制器资源。第一种控制器类型\
  \ `ReplicationController` 只提供基本功能。它被 `ReplicaSet` 取代，后者在识别要管理哪些 Pod 方面有了改进。\n\n\
  用 `ReplicaSets` 替换 `ReplicationControllers` 的部分原因在于，`ReplicationControllers` 变得越来越复杂，导致代码难以维护。新方法在\
  \ `ReplicaSets` 和 `Deployments` 之间划分了控制职责。`ReplicaSets` 负责基本的 Pod 管理，包括监控 Pod 状态和执行故障转移。`Deployments`\
  \ 负责跟踪由于配置更改或容器镜像更新导致的 Pod 模板更改。`Deployments` 和 `ReplicaSets` 协同工作，但 `Deployment`\
  \ 创建它自己的 `ReplicaSet`。\n\n\n\n\n```\nroot@host01:~# kubectl get replicasets\nNAME\
  \               DESIRED   CURRENT   READY   AGE\nnginx-6799fc88d8   3         3\
  \         3       30s\n```\n\n虽然我们通常只与 `Deployments` 交互，但了解 `ReplicaSet` 非常重要，因为在创建\
  \ `Pods` 时遇到的某些特定错误只会在 `ReplicaSet` 的事件日志中报告。\n\n`ReplicaSet` 和 `Pod` 名称上的 `nginx`\
  \ 前缀完全是为了方便。`Deployment` 并不使用名称来匹配它的 `Pods`。相反，它使用它的选择器（selector）来匹配 `Pod` 上的标签（labels）。如果我们对其中三个\
  \ `Pods` 之一运行 `kubectl describe`，就可以这些标签：\n\n```\nroot@host01:~# kubectl describe\
  \ pod nginx-6799fc88d8-6vn44\nName:         nginx-6799fc88d8-6vn44\nNamespace: \
  \   default\n...\nLabels:       app=nginx\n...\n```\n\n这与 `Deployment` 的选择器匹配：\n\
  \n```\nroot@host01:~# kubectl describe deployment nginx\nName:                 \
  \  nginx\nNamespace:              default\n...\nSelector:               app=nginx\n\
  ...\n```\n\n`Deployment` 查询 API 服务器以识别匹配其选择器的 `Pods`。虽然 `Deployment` 使用程序化 API，但后续示例中的\
  \ `kubectl get` 命令生成了类似的 API 服务器查询，让我们提供了一个观察其如何工作的机会：\n\n```\nroot@host01:~# kubectl\
  \ get all -l app=nginx\nNAME                     READY   STATUS    RESTARTS   AGE\n\
  nginx-6799fc88d8-6vn44   1/1     Running   0          69s\nnginx-6799fc88d8-dcwx5\
  \   1/1     Running   0          69s\nnginx-6799fc88d8-sh8qs   1/1     Running \
  \  0          69s\n\nNAME                               DESIRED   CURRENT   READY\
  \   AGE\nreplicaset.apps/nginx-6799fc88d8   3         3         3       69s\n```\n\
  \n在这种情况下，使用 `kubectl get all` 允许我们列出多种不同类型的资源，只要它们匹配选择器即可。因此，我们不仅看到了三个 `Pods`，还看到了由\
  \ `Deployment` 创建用于管理这些 `Pods` 的 `ReplicaSet`。\n\n`Deployment` 使用选择器而不是仅仅跟踪它创建的\
  \ `Pods` 似乎看起来很奇怪。然而，这种设计使得 Kubernetes 更容易实现自愈。在任何时候，Kubernetes 节点可能会离线，或者我们可能会遇到网络分区，在此期间某些控制节点失去与集群的连接。如果一个节点重新上线，或者集群在网络分区后需要重新合并，Kubernetes\
  \ 必须能够查看所有运行中 `Pods` 的当前状态，并确定为了达到所需状态需要哪些更改。这可能意味着，由于节点断开连接而启动了额外 `Pod` 的 `Deployment`\
  \ 在节点重新连接时需要关闭一个 `Pod`，以便集群能够保持适当数量的副本。使用选择器避免了让 `Deployment` 必须记住它曾经创建过的所有 `Pods`（即使是故障节点上的\
  \ `Pods`）。\n\n### 监控与伸缩\n\n由于 `Deployment` 正在监控它的 `Pods` 以确保我们拥有正确数量的副本，因此我们可以删除一个\
  \ `Pod`，它将被自动重新创建：\n\n```\nroot@host01:~# kubectl delete pod nginx-6799fc88d8-6vn44\n\
  pod \"nginx-6799fc88d8-6vn44\" deleted\nroot@host01:~# kubectl get pods\nNAME  \
  \                   READY   STATUS    RESTARTS   AGE\nnginx-6799fc88d8-dcwx5   1/1\
  \     Running   0          3m52s\nnginx-6799fc88d8-dtddk   1/1     Running   0 \
  \       ➊ 14s\nnginx-6799fc88d8-sh8qs   1/1     Running   0          3m52s\n```\n\
  \n一旦旧的 `Pod` 被删除，`Deployment` 就会创建一个新的 `Pod` ➊。同样，如果我们更改了 `Deployment` 的副本数量，`Pods`\
  \ 会自动更新。让我们添加另一个副本：\n\n```\nroot@host01:~# kubectl scale --replicas=4 deployment\
  \ nginx\ndeployment.apps/nginx scaled\nroot@host01:~# kubectl get pods\nNAME   \
  \                  READY   STATUS    RESTARTS   AGE\nnginx-6799fc88d8-dcwx5   1/1\
  \     Running   0          8m22s\nnginx-6799fc88d8-dtddk   1/1     Running   0 \
  \         4m44s\nnginx-6799fc88d8-kk7r6   1/1     Running   0        ➊ 5s \nnginx-6799fc88d8-sh8qs\
  \   1/1     Running   0          8m22s\n```\n\n第一条命令将副本数量设置为四个。结果是，Kub 需要启动一个新的完全相同的\
  \ `Pod` 来满足我们请求的数量 ➊。我们可以通过更新 YAML 文件并重新运行 `kubectl apply` 来伸缩 `Deployment`，或者使用\
  \ `kubectl scale` 命令直接编辑 `Deployment`。无论何种方式，这种方法都是让 `Deployment` 更新声明状态。同样，将 `Deployment`\
  \ 缩小规模会导致 `Pods` 被自动删除：\n\n```\nroot@host01:~# kubectl scale --replicas=2 deployment\
  \ nginx\ndeployment.apps/nginx scaled\nroot@host01:~# kubectl get pods\nNAME   \
  \                  READY   STATUS    RESTARTS   AGE\nnginx-6799fc88d8-dcwx5   1/1\
  \     Running   0          8m22s\nnginx-6799fc88d8-dtddk   1/1     Running   0 \
  \         4m44s\nnginx-6799fc88d8-sh8qs   1/1     Running   0          8m22s\n```\n\
  \n### 自动伸缩\n\n对于接收真实请求的应用，持续监控应用程序的每个组件将非常繁琐。在这种情况下，“水平*（horizontal）指的是伸缩器可以更新副本数量这一事实。\n\
  \n要配置自动伸缩，我们创建一个引用 `Deployment` 的新资源。集群随后监控 `Pods` 使用的资源并重新配置 `Deployment`。我们可以使用\
  \ `kubectl autoscale` 命令为 `Deployment` 添加 `HorizontalAutoscaler`，但使用 YAML 文件以便将自动伸缩配置放在版本控制中会更好。这里是\
  \ YAML 文件：\n\n*nginx-scaler.yaml*\n\n```yaml\n---\napiVersion: autoscaling/v2\n\
  kind: HorizontalAutoscaler\nmetadata:\n  name: nginx\n  labels:\n    app: nginx\n\
  spec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name:\
  \ nginx\n  minReplicas: 1\n  maxReplicas: 10\n  metrics:\n    - type: Resource\n\
  \      resource:\n        name: cpu\n        target:\n          type: Utilization\n\
  \          averageUtilization: 50\n```\n\n在 `metadata` 字段中，我们添加了标签 `app: nginx`。这不会改变资源的行为；它的唯一目的是确保我们在\
  \ `kubectl get` 命令中使用 `app=nginx` 标签选择器时该资源会出现。这种使用一致的元数据标记应用程序组件是一种良好的实践，可以帮助他人了解哪些资源关联在一起并更容易调试。\n\
  \n此 YAML 配置使用了自动伸缩的版本 2 ➊。提供 API 资源组的新版本是 Kubernetes 纳未来功能且不丢失任何后向兼容的方法。通常在发布最终配置之前会发布新资源的\
  \ alpha 和 beta 版本，并且 beta 版本与最终版本之间至少有一个版本的重叠，以实现无缝升级。\n\n自动伸缩器的版本 2 支持多个资源。每个资源都用于计算\
  \ `Pods` 期望数量的投票，并最大的数字胜出。对多个资源的支持需要更改 YAML 布局，这是 Kubernetes 维护者创建新资源版本的常见原因。\n\n\
  \n\n\n我们通过其 API 资源组、类型（kind）和名称将 NGINX Deployment ➋ 指定为自动扩缩器的目标，这足以唯一标识 Kubernetes\
  \ 集群中的任何资源。然后，我们告诉自动扩缩器监控属于 `Deployment` ➍ 的 `Pods` 的 CPU 利用率。从长期来看，自动扩缩器将努力使 `Pods`\
  \ 的平均 CPU 利用率保持在 50% 左右，根据需要扩大或缩小。然而，副本数量永远不会超过我们指定的范围 ➌。\n\n让我们使用此配置创建自动扩缩器：\n\n\
  ```\nroot@host01:~# kubectl apply -f /opt/nginx-scaler.yaml\nhorizontalpodautoscaler.autoscaling/nginx\
  \ created\n```\n\n我们可以查询集群查看它是否已创建：\n\n```\nroot@host01:~# kubectl get hpa\nNAME\
  \    REFERENCE          TARGETS   MINPODS   MAXPODS   REPLICAS   AGE\nnginx   Deployment/nginx\
  \   0%/50%    1         10        3          96s\n```\n\n输出显示了自动扩缩器的目标引用、当前和期望的资源利用率，以及最大、最小和当前的副本数量。\n\
  \n我们使用 `hpa` 作为 `horizontalpodautoscaler` 的缩写。Kubernetes 允许我们使用单数或复数名称，并为大多数资源提供了缩写以节省输入。例如，我们可以输入\
  \ `deploy` 代表 `deployment`，甚至用 `po` 代表 `pods`。每一次额外的按键都很重要！\n\n自动扩缩器使用 `kubelet`\
  \ 直接从容器引擎收集的 CPU 利用率数据。这些数据由我们作为集群插件安装的 `metrics server` 集中管理。如果没有该集群插件，就不会有利用率数据，自动扩缩器也不会对\
  \ `Deployment` 做出任何更改。在这种情况下，由于我们并没有真正使用 NGINX 服务器实例，它们没有消耗任何 CPU，因此 `Deployment`\
  \ 会被缩减到了单个 `Pod`，即我们指定的最小值：\n\n```\nroot@host01:~# kubectl get pods\nNAME      \
  \               READY   STATUS    RESTARTS   AGE\nnginx-6799fc88d8-dcwx5   1/1 \
  \    Running   0          15m\n```\n\n自动扩缩器已计算出只需要一个 `Pod`，并调整了 `Deployment` 以匹配。随后，`Deployment`\
  \ 选择了一个 `Pod` 终止，以达到所需的规模。\n\n为了准确性，自动扩缩器不会使用最近开始运行的 `Pod` 的 CPU 数据，并且具有逻辑防止其过于频繁地放大或缩小，因此如果你非常快速地运行这些示例，可能需要等待几分钟才能看到它进行缩放。\n\
  \n我们在第 14 章中限制资源使用时详细探讨 Kubernetes 资源利用率指标。\n\n## 其他控制器\n\n`Deployments` 是最通用且最常用的控制器，但\
  \ Kubernetes 还有其他可用选项。在本节中，我们将探索 `Jobs` 和 `CronJobs`、`StatefulSets` 以及 `DaemonSets`。\n\
  \n### Jobs 和 CronJobs\n\n`Deployments` 非常适用于应用组件，因为我们通常一个或多个实例无限运行。然而，对于我们需要运行命令（一次或按计划运行）的情况，我们可以使用\
  \ `Job`。主要区别在于 `Deployment` 确保任何停止运行的容器都会重启，而 `Job` 可以检查主进程的退出码，并仅在退出码非零（表示失败）时才重启。\n\
  \n`Job` 的定义看起来与 `Deployment` 非常相似：\n\n`sleep-job.yaml`\n\n```\n---\napiVersion:\
  \ batch/v1\nkind: Job\nmetadata:\n  name: sleep\nspec:\n  template:\n    spec:\n\
  \      containers:\n      - name: sleep\n        image: busybox\n        command:\
  \ \n          - \"/bin/sleep\"\n          - \"30\"\n      restartPolicy: OnFailure\n\
  ```\n\n`restartPolicy` 可以设置为 `OnFailure`，在这种情况下，容器在返回非零退出时将重启；或者设置为 `Never`，在这种情况下，无论退出码如何，容器退出时\
  \ `Job` 将完成。\n\n我们可以创建并查看 `Job` 及其创建的 `Pod`：\n\n```\nroot@host01:~# kubectl apply\
  \ -f /opt/sleep-job.yaml\njob.batch/sleep created\nroot@host01:~# kubectl get job\n\
  NAME    COMPLETIONS   DURATION   AGE\nsleep   0/1           3s         3s\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS    RESTARTS   AGE\n\
  ...\nsleep-fgcnz              1/1     Running   0          10s\n```\n\n`Job` 根据\
  \ YAML 文件中提供的规格创建了一个 `Pod`。`Job` 显示完成数为 0/1，因为它正在等待其 `Pod` 成功退出。\n\n当 `Pod` 运行 30\
  \ 秒后，它以零状态码退出，表示成功，`Job` 和 `Pod` 的状态随之更新：\n\n```\nroot@host01:~# kubectl get jobs\n\
  NAME    COMPLETIONS   DURATION   AGE\nsleep   1/1           31s        40s\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS      RESTARTS   AGE\n\
  nginx-65db7cf9c9-2wcng   1/1     Running     0          31m\nsleep-fgcnz       \
  \       0/1     Completed   0          43s\n```\n\n`Pod` 仍然可用，这意味着我们可以根据需要查看其日志，但它显示状态为\
  \ `Completed`，因此 Kubernetes 不会尝试重启已退出的容器。\n\n`CronJob` 是一种按计划创建 `Jobs` 的控制器。例如，我们可以设置让\
  \ `Job` 每天运行一次：\n\n`sleep-cronjob.yaml`\n\n```\napiVersion: batch/v1\nkind: CronJob\n\
  metadata:\n  name: sleep\nspec:\n  schedule: \"0 3 * * *\"\n  jobTemplate:\n   \
  \ template:\n      spec:\n        containers:\n        - name: sleep\n         \
  \ image: busybox\n          command: \n            - \"/bin/sleep\"\n          \
  \  - \"30\"\n        restartPolicy: OnFailure\n```\n\n`Job` 规格的所有内容都嵌入在 `jobTemplate`\
  \ 字段中 ➋。在此基础上添加了一个 `schedule` ➊，它遵循 Unix cron 命令的标准格式。在这种情况下，`0 3 * * *` 表示每天凌晨\
  \ 3:00 创建一个 Job。\n\nKubernetes 的设计原则之一是任何东西都可能随时故障。对于 `CronJob`，如果集群在 Job 调度期间出现问题，该\
  \ Job 可能无法调度，或者可能被调度两次，这意味着你应该注意以幂等的方式编写 `Jobs`。\n\n如果我们创建这个 `CronJob`：\n\n```\n\
  root@host01:~# kubectl apply -f /opt/sleep-cronjob.yaml\ncronjob.batch/sleep created\n\
  ```\n\n它现在存在于集群中，但它不会立即创建 `Job` 或 `Pod`：\n\n```\nroot@host01:~# kubectl get jobs\n\
  NAME    COMPLETIONS   DURATION   AGE\nsleep   1/1           31s        2m32s\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS      RESTARTS   AGE\n\
  nginx-65db7cf9c9-2wcng   1/1     Running     0          33m\nsleep-fgcnz       \
  \       0/1     Completed   0          2m23s\n```\n\n相反，`CronJob` 会在每次触发调度时创建一个新的\
  \ `Job`。\n\n### StatefulSets\n\n到目前为止，我们查看的是创建相同 `Pods` 的控制器。在 `Deployments` 和 `Jobs`\
  \ 中，我们并不真正关心哪个 `Pod` 是哪个，或者它部署在哪里，只要我们在正确的时间运行足够的实例即可。然而，这并不总是符合我们想要的行为。例如，尽管 `Deployment`\
  \ 可以创建带有持久存储的 `Pods`，但存储必须是为每个新 `Pod` 全全新的，要么相同的存储必须在所有 `Pods` 之间共享。这与像数据库这样的“主从”架构并不契合。对于这些情况，我们希望特定的存储附加到特定的\
  \ `Pods` 上。\n\n\n\n同时，由于 Pod 可能会因为硬件故障或升级而发生，我们需要一种方法来管理 Pod 的替换，以确保每个 Pod 都连接到正确的存储上。这就是\
  \ `StatefulSet` 的目的。`StatefulSet` 从零开始用数字标识每个 Pod，每个 Pod 都会接收匹配的持久化存储。当 Pod 必须被替换时，新的\
  \ Pod 将分配相同的数字标识并挂载相同的存储。Pod 可以查看其主机名来确定自己的标识，因此 `StatefulSet` 既适用于固定主实例的情况，也适用于动态选择主实例的情况。\n\
  \n在接下来的几个章节中，我们将探索更多与 Kubernetes StatefulSets 相关的细节，包括持久化存储和 Services。在本章中，我们将查看一个\
  \ `StatefulSet` 的基础示例，并在引入其他重要概念时在此基础上进行扩展。\n\n对于这个简单的示例，让我们创建两个 Pod，并展示它们如何获得唯一的存储，且即使\
  \ Pod 被替换，这些存储也会保持在原位。我们将使用这个 YAML 资源：\n\n`sleep-set.yaml`\n\n```yaml\n ---\n apiVersion:\
  \ apps/v1\n kind: StatefulSet\n metadata:\n    name: sleep\n spec:\n➊ serviceName:\
  \ sleep \n   replicas: 2\n   selector:\n     matchLabels:\n       app: sleep\n \
  \  template:\n     metadata:\n       labels:\n         app: sleep\n     spec:\n\
  \       containers:\n         - name: sleep\n           image: busybox\n       \
  \    command: \n             - \"/bin/sleep\"\n             - \"3600\"\n       \
  \ ➋ volumeMounts: \n             - name: sleep-volume\n               mountPath:\
  \ /storagedir\n➌ volumeClaimTemplates: \n     - metadata:\n         name: sleep-volume\n\
  \       spec:\n         storageClassName: longhorn\n         accessModes:\n    \
  \       - ReadWriteOnce\n         resources:\n           requests:\n           \
  \  storage: 10Mi\n```\n\n与 `Deployment` 或 `Job` 相比，这里有几个重要的区别。首先，我们必须声明一个 `serviceName`\
  \ 将此 `StatefulSet` 绑定到 Kubernetes Service ➊。该连接用于为每个 Pod 创建域名服务 (DNS) 条目。我们还必须为\
  \ `StatefulSet` 提供一个模板，用于请求持久化存储 ➌，然后告诉 Kubernetes 在我们的容器中挂载该存储 ➋。\n\n自动化脚本安装的实际\
  \ `sleep-set.yaml` 文件包含了 sleep Service 的定义。我们将在 第 9 章 中详细介绍 Services。\n\n让我们创建 sleep\
  \ StatefulSet：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/sleep-set.yaml\n\
  ```\n\n`StatefulSet` 创建了两个 Pod：\n\n```bash\nroot@host01:~# kubectl get statefulsets\n\
  NAME    READY   AGE\nsleep   2/2     1m14s\nroot@host01:~# kubectl get pods\nNAME\
  \      READY   STATUS    RESTARTS   AGE\n...\nsleep-0   1/1     Running   0    \
  \      57s\nsleep-1   1/1     Running   0          32s\n```\n\n每个 Pod 的持久化存储都是全新的，因此它们是为空的。让我们创建一些内容。最简单的方法是在容器内部使用\
  \ `kubectl exec`，这允许我们在容器内部运行命令，类似于 `crictl`。无论容器在哪个主机上，`kubectl exec` 命令都有效，即使我们是从集群外部连接到\
  \ Kubernetes API 服务器。\n\n让我们将每个容器的主机名写入文件并打印出来，以便验证其是否生效：\n\n```bash\nroot@host01:~#\
  \ kubectl exec sleep-0 -- /bin/sh -c \\\n  'hostname > /storagedir/myhost'\nroot@host01:~#\
  \ kubectl exec sleep-0 -- /bin/cat /storagedir/myhost\nsleep-0\nroot@host01:~# kubectl\
  \ exec sleep-1 -- /bin/sh -c \\\n  'hostname > /storagedir/myhost'\nroot@host01:~#\
  \ kubectl exec sleep-1 -- /bin/cat /storagedir/myhost\nsleep-1\n```\n\n现在，我们的每个\
  \ Pod 在其持久化存储中都有独特的内容。让我们删除一个 Pod，并验证它的替换者是否继承了前者的存储：\n\n```bash\nroot@host01:~#\
  \ kubectl delete pod sleep-0\npod \"sleep-0\" deleted\nroot@host01:~# kubectl get\
  \ pods\nNAME      READY   STATUS    RESTARTS   AGE\n...\nsleep-0   1/1     Running\
  \   0          28s\nsleep-1   1/1     Running   0          8m18s\nroot@host01:~#\
  \ kubectl exec sleep-0 -- /bin/cat /storagedir/myhost\nsleep-0\n```\n\n删除 sleep-0\
  \ 后，我们看到创建了一个同名的新 Pod，这与 `Deployment` 不同，后者会为每个新 Pod 生成一个随机名称。此外，对于这个新 Pod，我们之前创建的文件仍然存在，因为\
  \ `StatefulSet` 在旧 Pod 被删除时将相同的持久化存储挂载到了创建的新 Pod 上。\n\n### Daemon Sets\n\n`DaemonSet`\
  \ 控制器与 `StatefulSet` 之处在于 `DaemonSet` 也运行特定数量的 Pod，每个 Pod 都有唯一的标识。然而，`DaemonSet`\
  \ 在每个节点上恰运行一个 Pod，这主要用于控制平面和插件组件。\n\n我们的集群已经安装了多个 `DaemonSets`，让我们看看正在运行的 `DaemonSet`。\n\
  \n`DaemonSet` 位于 calico-system，所以我们指定：\n\n```bash\nroot@host01:~# kubectl get daemonsets\n\
  NAME          DESIRED   CURRENT   READY   UP-TO-DATE   AVAILABLE\ncalico-node  \
  \ 3         3         3            3\n```\n\n这里是 `DaemonSet` 的 YAML 配置：\n\n```bash\n\
  root@host01:~# kubectl get daemon-set calico-node -o yaml\napiVersion: apps/v1\n\
  kind: DaemonSet\nmetadata:\n...\n  name: calico-node\n  namespace: calico-system\n\
  spec:\n...\n  selector:\n    matchLabels:\n      k8s-app: calico-node\n```\n\n该\
  \ `DaemonSet` 的选择器期望标签 `k8s-app` 设置 `calico-node`。我们可以利用此显示 `DaemonSet` 创建的 Pod：\n\
  \n```bash\nroot@host01:~# kubectl -n calico-system get pods \\\n  -l k8s-app=calico-node\
  \ -o wide\nNAME                READY   STATUS   NODE   ...\ncalico-node-h9kjh  \
  \ 1/1     Running  host01 ...\ncalico-node-rcfk7   1/1     Running  host03 ...\n\
  calico-node-wj876   1/1     Running  host02 ...\n```\n\n`DaemonSet` 创建了三个 Pod，每个\
  \ Pod 都被分配到集群中的一个节点。如果我们向集群添加更多节点，`DaemonSet` 也会在新节点上调度 Pod。\n\n### 结语\n\n本章从普通集群用户的角度探索了\
  \ Kubernetes，通过创建控制器，由控制器创建带有容器的 Pod。掌握这些核心资源类型的知识对于构建我们的应用程序至关重要。同时，重要的是记住 Kubernetes\
  \ 正在使用我们在在第一部分中探索的容器技术。\n\n在 Kubernetes 集群中运行容器为网络增加了额外需求，因为现在我们需要连接不同集群节点上的容器。在下一章中，我们将考虑实现这一点的多种方法，并将叠加网络。\n\
  \n\n\n\n在本章中，我们将描述如何使用 `overlay networks`（覆盖网络）在 Kubernetes 集群中的所有节点上提供单一容器网络的外观。我们将考虑两种在跨宿主机网络上路由容器流量的不同方法，并检查每种方法的网络配置和流量流。最后，我们将探索\
  \ Kubernetes 如何使用 `Container Network Interface (CNI)` 标准将网络配置作为一种独立的插件进行配置，这使得在新的技术出现时可以轻松切换，并在需要时允许自定义解决方案。\n\
  \n## 集群网络 (Cluster Networking)\n\nKubernetes 集群的基本目标是将一组主机（物理机或虚拟机）视为单一计算资源，并根据需要将其分配以运行容器。从网络角度来看，这意味着\
  \ Kubernetes 应该能够将 `Pod` 调度到任何节点上，而不必担心与其它节点上 `Pods` 的连通性。这也意味着 Kubernetes 应该有某种方式为\
  \ `Pods` 动态分配 IP 地址，以支持这种集群范围的网络连通性。\n\n正如我们在本章中看到的，Kubernetes 使用插件化设计，允许任何兼容的网络软件分配\
  \ IP 地址并提供跨节点网络连通性。所有插件都必须遵循几个重要的规则。首先，`Pod` 的 IP 地址应该来自单一 IP 地址池，尽管该池可以按节点进行划分。这意味着无论\
  \ `Pods` 运行在哪里，我们都可以将所有 `Pods` 视为单一扁平网络的一部分。其次，流量应该是可路由的，使得所有 `Pods` 都能看到所有 `Pods`\
  \ 和控制平面。\n\n### CNI 插件 (CNI Plug-ins)\n\n插件使用 `CNI` 标准与 Kubernetes 集群（特别是 `kubelet`）通信。`CNI`\
  \ 规定了 `kubelet` 如何查找和调用 CNI 插件。当创建一个新的 `Pod` 时，`kubelet` 首先分配网络命名空间。然后它调用 CNI 插件，并为其提供该网络命名空间的引用。`CNI`\
  \ 插件向命名空间中添加网络设备，分配 IP 地址，并将该 IP 地址传回 `kubelet`。\n\n让我们来看看这个过程的实际运行。为此，本章的示例包含了两个不同的环境，使用了两个不同的\
  \ CNI 插件：`Calico` 和 `WeaveNet`。这两个插件都为 `Pods` 提供网络支持，但跨节点网络方式不同。我们将从 `Calico` 环境开始。\n\
  \n**注意 (NOTE)**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参阅第\
  \ xx 页的“运行示例](](#ch00.xhtml_ch00lev1sec2)。\n\n默认情况下，CNI 插件信息保留在 `/etc/cni/net.d`\
  \ 中。我们可以在该目录下看到 `Calico` 配置：\n\n```\nroot@host01:~# ls /etc/cni/net.d\n10-calico.conflist\
  \  calico-kubeconfig\n```\n\n`10-calico.conflist` 文件包含实际的 `Calico` 配置。`calico-kubeconfig`\
  \ 文件用于 `Calico` 组件与控制平面进行身份验证；它是根据安装 `Calico` 期间创建的服务账户创建的。文件名带有 `10-` 前缀，是因为 `kubelet`\
  \ 会对找到的任何配置文件进行排序，并使用第一个。\n\n列表 8-1 显示了配置文件，该文件为 JSON 格式，并标识了要使用的网络插件。\n\n```\n\
  root@host01:~# cat /etc/cni/net.d/10-calico.conflist \n{\n  \"name\": \"k8s-pod-network\"\
  ,\n  \"cniVersion\": \"0.3.1\",\n  \"plugins\": [\n    {\n      \"type\": \"calico\"\
  ,\n...\n    },\n    {\n      \"type\": \"bandwidth\",\n      \"capabilities\": {\"\
  bandwidth\": true}\n    },\n    {\"type\": \"portmap\", \"snat\": true, \"capabilities\"\
  : {\"portMappings\": true}}\n  ]\n}\n```\n\n*列表 8-1: Calico 配置*\n\n最重要的字段是 `type`；它指定了要运行哪个插件。在这种情况下，我们运行了三个插件：`calico`，处理\
  \ `Pod` 网络；`bandwidth`，我们可以用它来配置网络限制；以及 `portmap`，用于将容器端口暴露到主机网络。这两个插件通过 `capabilities`\
  \ 字段告知 `kubelet` 它们的用途；因此，当 `kubelet` 调用它们时，会传入相关的带宽和端口映射配置，以便插件可以进行必要的网络配置更改。\n\
  \n要运行这些插件，`kubelet` 需要知道它们的位置。实际插件可执行文件的默认位置是 `/opt/cni/bin`，插件名称与 `type` 字段匹配：\n\
  \n```\nroot@host01:~# ls /opt/cni/bin\nbandwidth  calico-ipam  flannel      install\
  \   macvlan  sbr     vlan\nbridge     dhcp         host-device  ipvlan    portmap\
  \  static\ncalico     firewall     host-local   loopback  ptp      tuning\n```\n\
  \n在这里，我们看到了由 `kubeadm` 与我们的 Kubernetes 集群一起安装的常用网络插件。我们还看到了 `calico`，它是由 `Calico\
  \ DaemonSet` 添加到此目录的。\n\n### Pod 网络 (Pod Networking)\n\n在 Kubernetes 中，每个 `Pod`\
  \ 都有自己的唯一 IP 地址。这意味着所有 `Pods` 之间可以通过 IP 直接进行通信，而无需 NAT（网络地址转换）。此外，`Pod` 也可以通过宿主机的\
  \ IP 地址进行通信。这种设计使得 `Pod` 能够可以在集群中的任何节点上运行，而不会影响其与集群中其他 `Pod` 的通信。\n\n为了实现这种网络连通性，Kubernetes\
  \ 支持两种主要的网络模型：\n\n1.  **覆盖网络 (Overlay networks)**：这种方法在现有物理网络之上创建一个逻辑网络。数据包会被封装在另一个数据包中进行传输。\n\
  2.  **路由网络 (Routed networks)**：这种方法通过在网络中直接路由 `Pod` 流量来实现通信，而不需要封装。\n\n在后续章节中，我们将深入探讨这两种模型。\n\
  \n\n\n\n\n```\nroot@host03:~# ip netns exec $NETNS ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN ...\n    link/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n       valid_lft forever\
  \ preferred_lft forever\n    inet6 ::1/128 scope host \n       valid_lft forever\
  \ preferred_lft forever\n3: ➊ eth0@if16: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1450\
  \ ... state UP ...\n    link/ether 7a:9e:6c:e2:30:47 brd ff:ff:ff:ff:ff:ff link-netnsid\
  \ 0\n    inet ➋ 172.31.239.205/32 brd 172.31.25.202 scope global eth0\n       valid_lft\
  \ forever preferred_lft forever\n    inet6 fe80::789e:6cff:fee2:3047/64 scope link\
  \ \n       valid_lft forever preferred_lft forever\n```\n\nCalico 在网络命名空间 ➊ 中创建了网络设备\
  \ `eth0@if16`，并为其分配了 IP 地址 `172.31.239.205` ➋。注意，该 IP 地址的网络掩码为 `/32`，这意味着任何流量必须通过配置的路由器。这与我们在第\
  \ 4 章 中使用的桥接容器网络的工作方式不同。这样做是为了 Calico 能够通过网络策略提供防火墙功能。\n\n此 Pod 的 IP 地址选择最终由 Calico\
  \ 决定。Calico 配置了 `172.31.0.0/16` 作为 Pod 的 IP 地址空间。Calico 决定如何在节点之间划分此地址空间，然后从分配给该节点的范围内为每个\
  \ Pod 分配 IP 地址。随后，Calico 将此 IP 地址传回 `kubelet`，以便其更新 Pod 的状态：\n\n```\nroot@host01:~#\
  \ kubectl get pods -o wide\nNAME   READY   STATUS    RESTARTS   AGE   IP       \
  \         NODE    ...\npod    1/1     Running   0          16m   172.31.239.205\
  \   host01   ...\n```\n\n当 Calico 在 Pod 中创建网络接口时，它是作为虚拟以太网（`veth`）对的一部分创建的。`veth`\
  \ 对充当虚拟网络线，与根命名空间中的网络接口建立连接，从而允许与 Pod 外部的连接。列表 8-3 让我们查看 `veth` 对的两个端点。\n\n```\n\
  root@host01:~# ip netns exec $NETNS ip link\n...\n3: eth0@if13: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1450 qdisc noqueue ... \n    link/ether 6e:4c:3a:41:d0:54 brd ff:ff:ff:ff:ff:ff\
  \ link-netnsid 0\nroot@host01:~# ip link | grep -B 1 $NETNS\n13: cali9381c30abed@if3:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1450 ... \n    link/ether ee:ee:ee:ee:ee:ee\
  \ ... link-netns cni-7cffed61-fb56-9be1-0548-4813d4a8f996\n```\n\n*列表 8-3：Calico\
  \ veth 对*\n\n第一个命令打印命名空间内部的网络接口，而第二个打印主机上的接口。每个接口都包含 `link-netns` 字段，指向另一个接口对应的网络命名空间，这表明这两个接口在\
  \ Pod 命名空间与根命名空间之间建立了链路。\n\n### 跨节点网络\n\n到目前为止，容器内虚拟网络设备的配置与第 4 章中的容器网络非常相似，在当时还没有安装\
  \ Kubernetes 集群。这种情况的区别在于，网络插件的配置不仅是为了连接单个节点上的容器，还可以连接运行在集群任何位置的容器。\n\n#### 为什么不使用\
  \ NAT？\n\n普通的容器网络确实提供了到主机网络的连通性。然而，正如我们讨论过的，它是通过网络地址转换（NAT）实现的。对于运行单个客户端应用程序的容器来说很好，因为连接跟踪允许\
  \ Linux 将服务器响应直接路由到源容器。但对于需要作为服务器的容器来说行不通，而这正是 Kubernetes 集群的核心用例。\n\n对于大多数使用 NAT\
  \ 连接到更广泛网络的私有网络，使用端口转发来从内部网络内部暴露特定服务。对于每个 Pod 中的每个容器来说并不是良好的解决方案，因为我们会很快耗尽端口。网络插件最终使用了\
  \ NAT，但仅用于连接作为客户端的容器以访问集群外部的网络。此外，我们将在第 9 章 中看到端口转发行为，它将是可能的方法之一。\n\n\n\n\n\n```\n\
  root@host01:~# kubectl exec -ti pod1 -- ip addr\n...\n3: eth0@if17: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1450 qdisc noqueue \n    link/ether f2:ed:e8:04:00:cc brd ff:ff:ff:ff:ff:ff\n\
  \    inet 172.31.239.216/32 brd 172.31.239.216 scope global eth0\n...\nroot@host01:~#\
  \ kubectl exec -ti pod1 -- ip route\ndefault via 169.254.1.1 dev eth0 \n169.254.1.1\
  \ dev eth0 scope link\n```\n\n基于此配置，当我们运行 `ping` 命令时，网络栈会识别出目标 IP 并不是任何接口的本地地址。因此，它会在地址解析协议（`ARP`）表中查找\
  \ `169.254.1.1`，以确定将“下一跳”发送到哪里。如果我们尝试在容器或主机上寻找地址为 `169.254.1.1` 的接口，将无法成功。Calico\
  \ 并没有真正将该地址分配给接口，而是配置了“代理 ARP”，以便数据包通过 `veth` 对的 `eth0` 端发送。结果是容器内部的 `ARP` 表中存在\
  \ `169.254.1.1` 的条目：\n\n```\nroot@host01:~# kubectl exec -ti pod1 -- arp -n\n? (169.254.1.1)\
  \ at ee:ee:ee:ee:ee:ee [ether]  on eth0\n...\n```\n\n如列表 8-3 所示，硬件地址 `ee:ee:ee:ee:ee:ee`\
  \ 属于 `veth` 对的主机侧，因此足够将数据包发出容器并进入根网络空间。从那里，IP 路由开始接管。\n\nCalico 已经配置了路由表，根据节点的目标\
  \ IP 地址范围将数据包发送到集群其他节点，并根据每个容器的 IP 地址将数据包发送到本地容器。我们可以在主机的 IP 路由表中看到此结果：\n\n```\n\
  root@host01:~# ip route\n...\n172.31.25.192/26 via 192.168.61.13 dev enp0s8 proto\
  \ 80 onlink \n172.31.89.192/26 via 192.168.61.12 dev enp0s8 proto 80 onlink \n172.31.239.216\
  \ dev calice0906292e2 scope link \n...\n```\n\n由于 `ping` 的目标地址位于 `172.31.89.192/26`\
  \ 网络内，数据包现在路由到 `192.168.61.12`，即 `host02`。\n\n让我们来看 `host02` 上的路由表，以便跟上下一步：\n\n\
  ```\nroot@host02:~# ip route\n...\n172.31.239.192/26 via 192.168.61.11 dev enp0s8\
  \ proto 80 onlink \n172.31.25.192/26 via 192.168.61.13 dev enp0s8 proto 80 onlink\
  \ \n172.31.89.197 dev calibd2348b4f67 scope link \n...\n```\n\n如果你想自己亲自运行此命令，请确保在\
  \ `host02` 上运行。当我们的数据包到达 `host02` 时，它有一条通往 `ping` 目的特定 IP 地址的路由。该路由将数据包发送到连接到 `pod2`\
  \ 网络空间的 `veth` 对中。\n\n现在 `ping` 已到达，`pod2` 内部的网络栈会回回复。回复通过相同的过程到达 `host02` 的根网络空间。根据\
  \ `host02` 的路由表，它被发送到 `host01`，在那里，使用 `172.31.239.216` 的路由表条目将其发送到相应的容器。\n\n由于 Calico\
  \ 使用的是三层路由，主机网络可以看到实际的容器 IP 地址。我们可以使用 `tcpdump` 来确认这一点。为此，我们将切回 `host01`。\n\n首先，让我们在后台启动\
  \ `tcpdump`：\n\n```\nroot@host01:~# tcpdump -n -w pings.pcap -i any icmp &\n[1]\
  \ 70949\ntcpdump: listening on any ...\n```\n\n`-n` 标志告诉 `tcpdump` 避免尝试在 DNS 中查找任何\
  \ IP 地址的主机名；这可以节省时间。`-w pings.pcap` 标志告诉 `tcpdump` 将数据写入文件 `pings.pcap`；`-i any`\
  \ 告诉 `tcpdump` 监听所有接口；`icmp` 过滤器告诉它只监听 ICMP 流量；最后，结尾的 `&` 将其放在后台运行。`.pings.pcap`\
  \ 文件名很重要。现在，我们再次运行 `ping`：\n\n```\nroot@host01:~# kubectl exec -ti pod1 -- ping\
  \ -c 3 172.31.89.192\n```\n\n这些 ICMP 请求和回复已收集，但它们被缓存在内存中。为了将它们导出文件，我们将关闭 `tcpdump`：\n\
  \n```\nroot@host01:~# killall tcpdump\n```\n\n`ping` 发送了 3 个数据包，接收了 3 个，丢包率为 0%。为了查看为什么，让我们打印\
  \ `tcpdump` 获取的详情：\n\n```\nroot@host01:~# tcpdump -en pings.pcap\nreading from file\
  \ pings.pcap, link-type LINUX_SLL\n00:11:22:33:44:55 > ee:ee:ee:ee:ee:ee, ethertype0x0800\
  \ (IPv), 172.31.239.216 > 172.31.89.192, icmp echo, id 1, seq 1, length 64\n00:ee:ee:ee:ee:ee\
  \ > 00:11:22:33:44:55, ethertype0x0800 (IPv), 172.31.89.192 > 172.31.239.216, icmp\
  \ echo reply, id 1, seq 1, length 64\n00:11:22:33:44:55 > ee:ee:ee:ee:ee:ee, ethertype0x0800\
  \ (IPv), 172.31.239.216 > 172.31.89.192, icmp echo, id 1, seq 2, length 64\n00:ee:ee:ee:ee:ee\
  \ > 00:11:22:33:44:55, ethertype0x0800 (IPv), 172.31.89.192 > 172.31.239.216, icmp\
  \ echo reply, id 1, seq 2, length 64\n```\n\n`-e` 标志告诉 `tcpdump` 打印硬件地址；否则我们将无法区分某些数据包。\n\
  \n三层路由是跨节点网络的一种优雅解决方案，它利用了 Linux 原生的路由和流量转发能力。然而，这意味着主机网络可以看到 Pod 的 IP 地址，这可能需要更改安全规则。例如，在\
  \ Amazon Web Services (AWS) 中设置虚拟机的自动化脚本不仅配置了安全组以允许 Pod 空间的所有流量，还关闭了虚拟机实例的“源/目的检查”。否则，AWS\
  \ 网络基础设施将拒绝通过意外地址的流量。\n\n三层路由不是跨节点网络唯一的解决方案。另一种方案是将容器数据包“封装”到显式发送到主机之间的数据包中。这是 Flannel\
  \ 和 WeaveNet 等流行插件采用的方法。我们将查看 WeaveNet 的示例，但使用 Flannel 的流量看起来相似。\n\n基于 Calico 的大型集群也对某些网络之间的流量使用封装。例如，跨越多个区域或可用区的集群可能需要配置\
  \ Calico 使用封装，因为可能无法在区域或可用区之间的所有路由器上配置必要的集群 Pod 路由。\n\n由于网络中可能需要的任何操作都有定义的标准，因此并不意外封装封装有一个定义的标准：虚拟扩展局域网（VXLAN）。在\
  \ VXLAN 中，每个数据包都被封装在 UDP 数据报中发送到目的地。\n\n我们将使用相同的 *two-pods.yaml* 配置文件在 Kubernetes\
  \ 集群中创建两个 Pod，这次使用从本章 *weavenet* 目录构建的集群。如之前一样，我们在 host01 上获得一个 Pod，另一个在 host02\
  \ 上：\n\n```\nroot@host01:~# kubectl apply -f /opt/two-pods.yaml\npod/pod1 created\n\
  pod/pod2 created\n```\n\n让我们检查这些 Pod 是否正在运行并正确地分配到不同的主机上：\n\n\n\n\n\n```\nroot@host01:~#\
  \ kubectl get po -o wide\nNAME   READY   STATUS    ... IP           NODE     ...\n\
  pod1   1/1     Running   ... 10.46.0.8    host01   ...\npod2   1/1     Running \
  \  ... 10.40.0.21   host02   ...\n```\n\n在这些 `Pods` 运行后，我们可以使用之前显示的相同命令来收集它们的 IP\
  \ 地址：\n\n```\nroot@host01:~# IP1=$(kubectl get po pod1 -o json | jq -r '.status.podIP')\n\
  root@host01:~# IP2=$(kubectl get po pod2 -o json | jq -r '.status.podIP')\nroot@host01:~#\
  \ echo $IP1\n10.46.0.8\nroot@host01:~# echo $IP2\n10.40.0.21\n```\n\n注意，分配的 IP 地址与\
  \ Calico 的示例完全不同。进一步的探索显示，地址和路由配置也不同，如列表 8-4 所示。\n\n```\nroot@host01:~# kubectl\
  \ exec -ti pod1 -- ip addr\n...\n25: eth0@if26: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1376 qdisc noqueue \n    link/ether e6:78:69:44:3d:a4 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 10.46.0.8/12 brd 10.47.255.255 scope global eth0\n       valid_lft forever\
  \ preferred_lft forever\n...\nroot@host01:~# kubectl exec -ti pod1 -- ip route\n\
  default via 10.46.0.0 dev eth0 \n10.32.0.0/12 dev eth0 scope link  src 10.46.0.8\n\
  ```\n\n*列表 8-4：WeaveNet 网络*\n\n这次，我们的 `Pods` 一个巨大的 `/12` 网络中获取 IP 地址，这对应于单个网络上超过一百万个可能的地址。在这种情况下，我们的`pod\
  \ 的网络栈`将期望能够使用 `ARP` 直接识别网络上任何其他 `Pod` 的硬件地址，而不是像我们在 Calico 中看到的那样将流量路由到网关。\n\n\
  和一样，这两个 `Pods` 之间确实存在连通性：\n\n```\nroot@host01:~# kubectl exec -ti pod1 -- ping -c\
  \ 3 $IP2\nPING 10.40.0.21 (10.40.0.21): 56 data bytes\n64 bytes from 10.40.0.21:\
  \ seq=0 ttl=64 time=0.981 ms\n64 bytes from 10.40.0.21: seq=1 ttl=64 time=0.963\
  \ ms\n64 bytes from 10.40.0.21: seq=2 ttl=64 time=0.871 ms\n--- 10.40.0.21 ping\
  \ statistics ---\n3 packets transmitted, 3 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 0.871/0.938/0.981 ms\n```\n\n现在我们已经运行了此 `ping` 命令，我们应该预期 `pod1`\
  \ 网络栈中的 `ARP` 表已满了 `pod2` 网络接口的硬件地址：\n\n```\nroot@host01:~# kubectl exec -ti pod1\
  \ -- arp -n\n? (10.40.0.21) at ba:75:e6:db:7c:c6 [ether]  on eth0\n? (10.46.0.0)\
  \ at 1a:72:78:64:36:c6 [ether]  on eth0\n```\n\n如所预期，`pod1` 有一个对应 `pod2` IP 地址的\
  \ `ARP` 表目，其对应于 `pod2` 内部的虚拟网络接口：\n\n```\nroot@host01:~# kubectl exec -ti pod2 --\
  \ ip addr\n...\n53: eth0@if54: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN> mtu 1376\
  \ qdisc noqueue \n    link/ether ➊ ba:75:e6:db:7c:c6 brd ff:ff:ff:ff:ff:ff\n   \
  \ inet 10.40.0.21/12 brd 10.47.255.255 scope global eth0\n       valid_lft forever\
  \ preferred_lft forever\n...\n```\n\n`pod1` `ARP` 表中的硬件地址与 `pod2` ➊ 中虚拟网络设备的硬件地址匹配。为了实现这一点，WeaveNet\
  \ 正在通过网络路由 `ARP` 请求，以便 `pod2` 中的网络栈能够做出响应。\n\n让我们看看 `ARP` 和 `ICMP` 流量的跨节点路由是如何发生的。首先，尽管\
  \ IP 地址管理可能不同，但 Calico 和 WeaveNet 之间一个重要的相似点是，它们都使用 `veth` 对将容器连接到宿主机。如果你想探索这一点，请使用列表\
  \ 8-2 和列表 8-3 中显示的命令确定 `pod1` 的命名空间，然后在 `host01` 上使用 `ip addr` 验证是否存在对应该命名空间的 `veth`\
  \ 设备。对于我们的目的，由于我们之前见过，我们将流量通过 `veth` 发送到宿主机是肯定的。让我们开始跟踪两个 `Pods` 之间的 `ICMP` 流量：\n\
  \n```\nroot@host01:~# tcpdump -w pings.pcap -i any icmp &\n[1] 5599\ntcpdump: listening\
  \ on any, link-type LINUX_SLL (Linux v1) ...\nroot@host01:~# kubectl exec -ti pod1\
  \ -- ping -c 3 $IP2\n3 packets transmitted, 3 packets received, 0% packet loss\n\
  round-trip min/avg/max = 0.824/0.991/0.053 ms\nroot@host01:~# killall tcpdump\n\
  24 packets captured\n24 packets received by filter\n0 packets dropped by kernel\n\
  ```\n\n和之前一样，我们在后台运行 `tcpdump` 来捕获所有网络接口上的 `ICMP`，运行了 `ping`，然后停止 `tcpdump` 以其写入捕获的包。这次我们有\
  \ 24 个包要查看，但它们还没有说明完整的故事：\n\n```\nroot@host01:~# tcpdump -r pings.pcap\nreading\
  \ from file pings.pcap, link-type LINUX_SLL (Linux v1)\n16:22:08.211499   P e6:78:69:44:3d:a4\
  \ ... 10.46.0.8 > 10.40.0.21: ICMP echo request\n16:22:08.211551  Out e6:78:69:44:3d:a4\
  \ ... 10.46.0.8 > 10.40.0.21: ICMP echo request\n16:22:08.211553   P e6:78:69:44:3d:a4\
  \ ... 10.46.0.8 > 10.40.0.21: ICMP echo request\n16:22:08.211745  Out e6:78:69:44:3d:a4\
  \ ... 10.46.0.8 > 10.40.0.21: ICMP echo request\n16:22:08.212917   P ba:75:e6:db:7c:c6\
  \ ... 10.40.0.21 > 10.46.0.8: ICMP echo reply\n16:22:08.213704  Out ba:75:e6:db:7c:c6\
  \ ... 10.40.0.21 > 10.46.0.8: ICMP echo reply\n16:22:08.213708   P ba:75:e6:db:7c:c6\
  \ ... 10.40.0.21 > 10.46.0.8: ICMP echo reply\n16:22:08.213724  Out ba:75:e6:db:7c:c6\
  \ ... 10.40.0.21 > 10.46.0.8: ICMP echo reply\n...\n```\n\n这些行显示了单个 `ping` 请求和响应的四个包，但硬件地址并没有变化。发生的是这些\
  \ `ICMP` 包在不经修改的情况下在网络接口之间传递。然而，我们仍然没有看到 `host01` 和 `host02` 之间的实际流量，因为我们从未看到任何对应宿主机接口的硬件地址。\n\
  \n为了查看宿主机级流量，我们需要告诉 `tcpdump` 捕获 `UDP` 然后将其视为 `VXLAN`，这使得 `tcpdump` 识别出内部有一个 `ICMP`\
  \ 包。\n\n让我们再次捕获，这次寻找 `UDP` 流量：\n\n```\nroot@host01:~# tcpdump -w vxlan.pcap -i any\
  \ udp &\n...\nroot@host01:~# kubectl exec -ti pod1 -- ping -c 3 $IP2\n...\n3 packets\
  \ transmitted, 3 packets received, 0% packet loss\nround-trip min/avg/max = 1.139/1.364/1.545\
  \ ms\nroot@host01:~# killall tcpdump\n22 packets captured\n24 packets received by\
  \ filter\n0 packets dropped by kernel\n```\n\n这次我们将包数据保存在 `*vxlan.pcap*` 中。在这个示例中，`tcpdump`\
  \ 捕获了 22 个包。因为我们的集群中有大量的跨 Pod 流量，而不只是 `ICMP` 流量，你可能会看到不同的数字。\n\n我们捕获的包包含了 `host01`\
  \ 上所有的 `UDP` 流量，而我们的 `ICMP`，所以在打印列表 8-5 中显示的包时，我们需要进行选择性输出。\n\n```\nroot@host01:~#\
  \ tcpdump -en vxlan.pcap -T vxlan | grep -B 1 ICMP\nreading from file vxlan.pcap,\
  \ link-type LINUX_SLL (Linux v1)\n16:45:47.307949 Out 08:00:27:32:a0:28 ... \n \
  \ length 150: 192.168.61.11.50200 > 192.168.61.12.6784: VXLAN ...\ne6:78:69:44:3d:a4\
  \ > ba:75:e6:db:7c:c6 ... \n  length 98: 10.46.0.8 > 10.40.0.21: ICMP echo request\n\
  16:45:47.308699  In 08:00:27:67:b9:da ... \n  length 150: 192.168.61.12.43489 >\
  \ 192.168.61.11.6784: VXLAN ... \nba:75:e6:db:7c:c6 > e6:78:69:44:3d:a4 ... \n \
  \ length 98: 10.40.0.21 > 10.46.0.8: ICMP echo reply\n```\n\n\n\n\n\n`-T vxlan`\
  \ 标志告诉 `tcpdump` 将其看到的包数据视为 VXLAN 数据。这使得 `tcpdump` 能够查看内部并从封装包中提取数据，使其能够识别隐藏在内部的\
  \ ICMP 数据包。我们随后使用带有 `-B 1` 标志的 `grep` 来查找这些 ICMP 数据包，并打印紧邻的前的一行，这样我们就能看到 VXLAN 封装头部。\n\
  \n这次捕获显示了主机的硬件地址，告诉我们已经成功捕获了主机之间之间的流量。每个 ICMP 数据包都被封装在一个 UDP 数据报中并跨主机网络发送。这些数据报的\
  \ IP 源和目的地址是主机网络 IP 地址 `192.168.61.11` 和 `192.168.61.12`，因此主机网络永远看不到 Pod IP 地址。然而，这些信息仍然存在封装的\
  \ ICMP 数据包中，因此当数据报到达目的地时，WeaveNet 能够将 ICMP 数据包发送到正确的目的地。\n\n封装的优势在于，我们所有的跨节点流量看起来都像主机之间的普通\
  \ UDP 数据报。通常情况下，我们不需要进行任何额外的网络配置来允许这种流量。然而，我们也付出了代价。正如 列表 8-5 所示，每个 ICMP 数据包为 98\
  \ 字节，但封装后的包为 150 字节。封装所需的封装器产生了网络开销，我们在发送每个包时都必须支付。\n\n回看列表 8-4](#ch08.xhtml_ch08list4)\
  \ 查看另一个后果。Pod 内部虚拟网络接口的最大传输单元 (MTU) 为 `1,376`。这代表了可以发送的最大包；任何更大的包都必须分片成多个包并在目的地重组。这个\
  \ `1,376` 的 MTU 远小于我们主机网络的标准 MTU `1,500`。Pod 接口上较小的 MTU 确保了 Pod 的网络栈将执行任何所需的分片。这样，我们可以保证即使在添加封装头部后，主机层也不会超过\
  \ `1,500`。出于这个原因，如果你在使用使用封装的网络插件，那么可能值得探索如何配置巨型帧（jumbo frames），以便在主机网络上启用大于 `1,500`\
  \ 的 MTU。\n\n## 选择网络插件\n\n网络插件可以使用不同的方法进行跨节点网络连接。尽管工程领域的通用规律，每种方法都有权衡。三层路由使用 Linux\
  \ 的原生功能，在网络带宽的使用上高效，但可能需要对底层主机网络进行自定义。使用 VXLAN 进行封装可以在任何可以在主机之间发送 UDP 数据报的网络中工作，但它为每个包都增加了开销。\n\
  \n无论如何，我们的 Pod 都得到了它们需要的，即与集群中任何位置的其它 Pod 通信的能力。在实践中，配置工作量和性能差异往往很小。出于这个原因，选择网络插件的最佳方法是从针对你特定\
  \ Kubernetes 发行版推荐或默认安装的插件开始。如果你发现某些性能无法满足你要求的特定用例，你将能够基于真实的网络流量而非猜测来测试替代插件。\n\n\
  ## 网络定制\n\n某些场景可能需要比跨越所有集群节点的单个 Pod 网络更复杂的集群网络。例如，某些受监管的行业要求某些数据（如安全审计日志）跨越隔离的网络进行传输。其他系统可能有专用硬件，因此与该硬件接口的应用程序组件必须放置在特定的网络或虚拟局域网\
  \ (VLAN) 上。\n\n网络插件架构的优势之一是 Kubernetes 集群可以容纳这些特殊的网络场景。只要 Pod 有一个可以到达集群其他部分（并被集群其他部分到达）的接口，Pod\
  \ 就可以提供特殊连接的额外网络接口。\n\n让我们来看例子。我们将在同一个节点上配置两个 Pod，让它们有一个可以用于相互通信的本地仅主机网络。由于是仅主机网络，它不提供到集群其他部分的连接，因此我们还将使用\
  \ Calico 为 Pod 提供集群网络。\n\n由于需要同时配置 Calico 和我们的仅主机网络，我们将调用两个独立的 CNI 插件，它们将在 Pod 的网络命名空间中创建虚拟网络接口。正如我们在列表\
  \ 8-1](#ch08.xhtml_ch08list1) 中所示，在单个文件中配置多个 CNI 插件是可能的。然而，`kubelet` 仅期望这些 CNI 插件中的一个实际分配网络接口和\
  \ IP 地址。为了解决这个问题，我们将使用 Multus，这是一种设计用于调用多个插件的 CNI 插件，但在向 `kubelet` 报告 IP 地址信息时，会将一个视为主要的。Multus\
  \ 还允许我们选择性地对每个 Pod 应用哪些 CNI 插件。\n\n我们将首先将 Multus 安装到本章的 calico 示例集群中：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/multus-daemonset.yaml\ncustomresourcedefinition.../network-attachment-definitions...\
  \ created\nclusterrole.rbac.authorization.k8s.io/multus created\nclusterrolebinding.rbac.authorization.k8s.io/multus\
  \ created\nserviceaccount/multus created\n```\n\n如文件名所示，此 YAML 中的主要资源是一个在每个主机上运行\
  \ Multus 的 `DaemonSet`。然而，此文件安装了多个资源，包括一个 `CustomResourceDefinition`。我们将在第 17 章](#ch17)\
  \ 中详细查看 `CustomResourceDefinitions`。现在，在列表 8-6](#ch08.xhtml_ch08list6) 中，我们只看到将使用的\
  \ `NetworkAttachmentDefinition`。\n\n*netattach.yaml*\n\n```yaml\n---\napiVersion:\
  \ k8s.cni.cncf.io/v1\nkind: NetworkAttachmentDefinition\nmetadata:\n  name: macvlan-conf\n\
  spec:\n  config: '{\n      \"cniVersion\": \"0.3.0\",\n      \"type\": \"macvlan\"\
  ,\n      \"mode\": \"bridge\",\n      \"ipam\": {\n        \"type\": \"host-local\"\
  ,\n        \"subnet\": \"10.244.0.0/24\",\n        \"rangeStart\": \"10.244.0.1\"\
  ,\n        \"rangeEnd\": \"10.244.0.254\"\n      }\n    }'\n```\n\n*列表 8-6: 网络附加*\n\
  \n`spec` 中的 `config` 字段看起来非常像 CNI 配置文件，这并不意外，因为 Multus 需要这些信息在我们请求将其添加到 Pod 时调用\
  \ `macvlan` CNI 插件。\n\n我们需要将此 `NetworkAttachmentDefinition` 添加到集群：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/netattach.yaml \nnetworkattachmentdefinition.k8s.cni.cncf.io/macvlan-conf\
  \ created\n```\n\n此定义不会立即影响我们的任何 Pod；它只是为未来的使用提供了 Multus 配置。\n\n当然，为了使用此配置，必须调用\
  \ Multus。在我们已经向集群安装了 Calico 的情况下，这是发生的？答案在 `/etc/cni/net.d` 目录中，Multus DaemonSet\
  \ 在初始化时在我们的所有集群节点上修改了该目录：\n\n```\nroot@host01:~# ls /etc/cni/net.d\n00-multus.conf\
  \  10-calico.conflist  calico-kubeconfig  multus.d\n```\n\nMultus 保留了现有的 Calico\
  \ 配置，但添加了自己的 `00-multus.conf` 配置和 `multus.d` 目录。由于 `00-multus.conf` 文件在字母排序上于 `10-calico.conflist`，`kubelet`\
  \ 在下一次创建新 Pod 时将开始使用它。\n\n这是 `00-multus.conf`：\n\n*00-multus.conf*\n\n\n\n\n\n```json\n\
  {\n  \"cniVersion\": \"0.3.1\",\n  \"name\": \"multus-cni-network\",\n  \"type\"\
  : \"multus\",\n  \"capabilities\": {\n    \"portMappings\": true,\n    \"bandwidth\"\
  : true\n  },\n  \"kubeconfig\": \"/etc/cni/net.d/multus.d/multus.kubeconfig\",\n\
  \  \"delegates\": [\n    {\n      \"name\": \"k8s-pod-network\",\n      \"cniVersion\"\
  : \"0.3.1\",\n      \"plugins\": [\n        {\n          \"type\": \"calico\",\n\
  ...\n          }\n        },\n        {\n          \"type\": \"bandwidth\",\n...\n\
  \        },\n        {\n          \"type\": \"portmap\",\n...\n        }\n     \
  \ ]\n    }\n  ]\n}\n```\n\n`delegates` 字段自 Multus 发现的 Calico 配置。该字段用于确定 Multus 在被调用时始终使用的默认\
  \ CNI 插件。顶层 `capabilities` 字段用于用于确保 Multus 能够从 kubelet 获取所有正确的配置数据，以便调用 `portmap`\
  \ 和 `bandwidth` 插件。\n\n现在 Multus 已经完全设置，让我们使用它为两个 Pod 添加一个主机主机网络（host-only network）。这些\
  \ Pod 定义如下：\n\n*local-pods.yaml*\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod1\n  annotations:\n    k8s.v1.cni.cncf.io/networks: macvlan-conf\nspec:\n\
  \  containers:\n  - name: pod1\n    image: busybox\n    command: \n      - \"sleep\"\
  \n      - \"infinity\"\n  nodeName: host01\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod2\n  annotations:\n    k8s.v1.cni.cncf.io/networks: macvlan-conf\nspec:\n\
  \  containers:\n  - name: pod2\n    image: busybox\n    command: \n      - \"sleep\"\
  \n      - \"infinity\"\n  nodeName: host01\n```\n\n这一次，我们需要两个 Pod 都运行在 `host01`\
  \ 上，这样主机网络才能正常工作。此外，我们为每个 Pod 添加了 `k8s.v1.cni.cncf.io/networks` 注。Multus 使用此注解来识别它应该运行哪些额外的\
  \ CNI 插件。`macvlan-conf` 名称与我们在列表 8-6 中的 `NetworkAttachmentDefinition` 中提供的名称匹配。\n\
  \n让我们创建这两个 Pod：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/local-pods.yaml\n\
  pod/pod1 created\npod/pod2 created\n```\n\n在这些 Pod 运行后，我们可以检查它们是否都有一个额外的网络接口：\n\n\
  ```bash\nroot@host01:~# kubectl exec -ti pod1 -- ip addr\n...\n3: eth0@if12: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1450 qdisc noqueue \n    link/ether 9a:a1:db:ec:c7:91 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 172.31.239.198/32 brd 172.31.239.198 scope global eth0\n       valid_lft\
  \ forever preferred_lft forever\n...\n4: net1@if2: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1500 qdisc noqueue \n    link/ether 9e:4f:c4:47:40:07 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 10.244.0.2/24 brd 10.244.0.255 scope global net1\n       valid_lft forever\
  \ preferred_lft forever\n...\nroot@host01:~# kubectl exec -ti pod2 -- ip addr\n\
  ...\n3: eth0@if13: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN> mtu 1450 qdisc noqueue\
  \ \n    link/ether 52:08:99:a7:d2:bc brd ff:ff:ff:ff:ff:ff\n    inet 172.31.239.199/32\
  \ brd 172.31.239.199 scope global eth0\n       valid_lft forever preferred_lft forever\n\
  ...\n4: net1@if2: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN> mtu 1500 qdisc noqueue\
  \ \n    link/ether a6:e5:01:82:81:82 brd ff:ff:ff:ff:ff:ff\n    inet 10.244.0.3/24\
  \ brd 10.244.0.255 scope global net1\n       valid_lft forever preferred_lft forever\n\
  ...\n```\n\n`macvlan` CNI 插件已经添加了额外的 `net1` 接口。\n\n\n\n\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/nginx-deploy.yaml\ndeployment.apps/nginx created\n```\n\n当这些 Pod\
  \ 运行后，我们可以检查它们是否已经分布到集群中，并且每个都有一个 IP 地址：\n\n```\nroot@host01:~# kubectl get pods\
  \ -o wide\nNAME                     READY   STATUS    ... IP                NODE\
  \    ...\nnginx-6799fc88d8-2wqc7   1/1     Running   ... 172.31.239.231   host01\
  \   ...\nnginx-6799fc88d8-78bwx   1/1     Running   ... 172.31.239.229   host01\
  \   ...\nnginx-6799fc88d8-dtx7s   1/1     Running   ... 172.31.89.240    host02\
  \   ...\nnginx-6799fc88d8-wh479   1/1     Running   ... 172.31.239.230   host01\
  \   ...\nnginx-6799fc88d8-zwx27   1/1     Running   ... 172.31.239.228   host01\
  \   ...\n```\n\n如果这些容器仅仅是某些服务器的客户端，那么这可能就是我们需要做的全部。例如，如果我们的应用程序架构是由发送和接收消息驱动的，只要这些容器能够连接到消息服务器，它们就能按照要求运行。然而，由于这些容器充当的是服务器，客户端需要能够找到并连接到它们。\n\
  \n目前，我们独立的 NGINX 实例对于客户端使用来说并不实用。当然，可以直接连接到这些 NGINX 服务器 Pod 中的任何一个。例如，我们可以使用其 IP\
  \ 地址与列表中的第一个进行通信：\n\n```\nroot@host01:~# curl -v http://172.31.239.231\n*   Trying\
  \ 172.31.239.231:80...\n* Connected to 172.31.239.231 (172.31.239.231) port 80 (#0)\n\
  > GET / HTTP/1.1\n...\n< HTTP/1.1 200 OK\n< Server: nginx/1.21.3\n...\n```\n\n遗憾的是，仅仅选择一个实例并无法提供负载均衡或故障转移。此外，我们没有办法预先知道\
  \ Pod IP 地址将是什么，而且每当我们对 `Deployment` 进行任何更改时，Pod 都会重新创建并获得新的 IP 地址。\n\n这种情况的解决方案需要具备两个主要特征。首先，我们需要一个客户端可以使用来查找服务器的已知名称。其次，我们需要一个一致的\
  \ IP 地址，以便当客户端识别服务器后，即使 Pod 实例不断来去，它也可以继续使用相同的地址进行连接。这正是 Kubernetes 通过 `Service`\
  \ 提供的功能。\n\n### 创建 Service\n\n为我们的 NGINX Deployment 创建一个 `Service` 并看看它能带给我们什么。`Listing\
  \ 9-1` 展示了资源 YAML 文件。\n\n*nginx-service.yaml*\n\n```\n---\nkind: Service\napiVersion:\
  \ v1\nmetadata:\n  name: nginx\nspec:\n  selector:\n    app: nginx\n  ports:\n \
  \ - protocol: TCP\n    port: 80\n    targetPort: 80\n```\n\n*Listing 9-1: NGINX\
  \ Service*\n\n首先，`Service` 有一个类似于 `Deployment` 的选择器（selector）。该选择器的用法相同：用于识别与 `Service`\
  \ 关联的 Pod。然而，与 `Deployment` 不同，`Service` 不以任何方式管理它的 Pod；它仅仅是将流量路由到它们。\n\n流量路由是基于我们在\
  \ `ports` 字段中指定的端口。由于 NGINX 服务器正在监听 80 端口，我们需要将其指定为 `targetPort`。我们可以使用任何想要的端口，但保持一致是最简单的，特别是因为\
  \ 80 是 HTTP 的默认端口。\n\n让我们将此 `Service` 应用到集群：\n\n```\nroot@host01:~# kubectl apply\
  \ -f /opt/nginx-service.yaml \nservice/nginx created\n```\n\n我们现在可以看到 `Service`\
  \ 已被创建：\n\n```\nroot@host01:~# kubectl get services\nNAME         TYPE        CLUSTER-IP\
  \       EXTERNAL-IP   PORT(S)   AGE\nkubernetes   ClusterIP   10.96.0.1        <none>\
  \        443/TCP   14d\nnginx        ClusterIP   10.100.221.220   <none>       \
  \ 80/TCP    25s\n```\n\n此 nginx `Service` 默认类型为 `ClusterIP`。Kubernetes 自动为此 `Service`\
  \ 分配了一个集群 IP 地址。该 IP 地址与我们的 Pod 处于完全不同的地址空间。\n\n使用选择器，此 `Service` 将识别我们的 NGINX 服务器\
  \ Pod 并自动开始对它们进行负载均衡均衡。随着匹配选择器的 Pod 的来去，`Service` 将相应地更新其负载均衡。只要 `Service` 存在，它将保持相同的\
  \ IP 地址，因此客户端有一个一致的方法找到它。\n\n### Service DNS\n\nKubernetes 为每个 `Service` 提供一个已知名称，允许客户端在不需要知道\
  \ IP 地址的情况下找到 pod。这是由 DNS（域名系统）处理的。\n\n为了测试这一点，让我们使用 `alpine` 镜像创建一个 `Pod`：\n\n\
  *pod.yaml*\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: pod\n\
  spec:\n  containers:\n  - name: pod\n    image: alpine\n    command:\n      - sleep\n\
  \      - infinity\n```\n\n接下来，创建 `Pod`：\n\n```\nroot@host01:~# kubectl apply -f\
  \ /opt/pod.yaml \npod/pod created\n```\n\n在运行后，让我们像 `Listing 9-2` 所示使用它连接到我们的 NGINX\
  \ `Service`。\n\n```\nroot@host01:~# kubectl exec -ti pod -- wget -O - http://nginx\n\
  Connecting to nginx (10.100.221.220:80)\n...\n<title>Welcome to nginx!</title>\n\
  ...\n```\n\n*Listing 9-2: Connect to NGINX Service*\n\n我们能够使用 `Service` 的名称 `nginx`，该名称解析到了\
  \ `Service` IP 地址。这样做是因为我们的 `Pod` 配置为与内置 DNS 服务器通信。\n\n我们在容器内部打印 `/etc/resolv.conf`\
  \ 文件，因为这是用于配置 DNS 的文件：\n\n```\nroot@host01:~# kubectl exec -ti pod -- cat /etc/resolv.conf\
  \ \nsearch default.svc.cluster.local svc.cluster.local cluster.local \nnameserver\
  \ 10.96.0.10\noptions ndots:5\n```\n\n引用的名称服务器 10.96.0.10 本身是一个 Kubernetes `Service`，但它位于\
  \ `kube-system` 命名空间，所以我们需要在那里查找它：\n\n```\nroot@host01:~# kubectl -n kube-system\
  \ get services\nNAME            TYPE       CLUSTER-IP      ... PORT(S)         \
  \         AGE\nkube-dns        ClusterIP  10.96.0.10      ... 53/UDP,53/TCP,9153/TCP\
  \   14d\nmetrics-server  ClusterIP  10.105.140.176  ... 443/TCP                \
  \  14d\n```\n\n\n\n\n\n`kube-dns` 服务连接到一个名为 `CoreDNS` 的 DNS 服务器部署，该部署负责监听 Kubernetes\
  \ 集群中 Service 的变化。`CoreDNS` 会根据需要更新 DNS 服务器配置，以保持与当前集群配置同步。\n\n### 域名解析与命名空间\n\n\
  Kubernetes 集群中的 DNS 名称基于 `Namespace`（命名空间）以及集群域名。由于我们的 Pod 位于 `default` 命名空间中，它被配置了搜索路径，其中\
  \ `default.svc.cluster.local` 是列表中的第一个项，因此当在查找 Service 时，它会首先搜索 `default` 命名空间。这就是为什么我们能够直接使用裸\
  \ Service 名称 `nginx` 来找到 `nginx` 服务——该 Service 位于 `default` 命名空间中。\n\n我们也可以使用完全限定域名来找到同一个\
  \ Service：\n\n```\nroot@host01:~# kubectl exec -ti pod -- wget -O - http://nginx.default.svc\n\
  Connecting to nginx.default.svc (10.100.221.220:80)\n...\n<title>Welcome to nginx!</title>\n\
  ...\n```\n理解命名空间与 Service 查找之间的这种交互非常重要。Kubernetes 集群的一种常见部署模式是将同一个应用多次部署到不同的命名空间中，并使用简单的主机名供应用程序组件相互通信。这种模式通常用于在同一个集群中部署应用程序的“开发”版本和“生产”版本。如果我们计划使用这种模式，我们需要确保在应用程序组件尝试相互查找时，坚持使用裸主机名；否则，我们可能会与错误版本的应用程序进行通信。\n\
  \n`/etc/resolv.conf` 中的另一个重要配置项是 `ndots` 条目。`ndots` 条目告诉主机名解析器，当它看到一个带有四个或更少点的主机名时，它应该在执行不带任何域名的绝对搜索*之前*，尝试追加各种搜索域。这对于确保我们在触达集群外部之前先尝试查找集群内部的服务至关重要。\n\
  \n因此，当我们在列表 9-2 中使用 `nginx` 名称时，容器内部的 DNS 解析器立即尝试了 `nginx.default.svc.cluster.local`\
  \ 并找到了正确的 Service。\n\n为了确保这一点清晰，让我们再试一个例子：查找另一个命名空间中的 Service。`kube-system` 命名空间有一个\
  \ `metrics-server` Service。为了找到它，让我们在 Pod 中使用标准主机查找命令 `dig`。\n\n我们的 Pod 使用的是 Alpine\
  \ Linux，因此我们需要安装 `bind-tools` 包来获取 `dig` ：\n\n```\nroot@host01:~# kubectl exec -ti\
  \ pod -- apk add bind-tools\n...\nOK: 13 MiB in 27 packages\n```\n现在，让我们先用裸名查找 `metrics-server`：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod -- dig +search metrics-server\n...\n\
  ;; Got answer:\n;; ->>HEADER<<- opcode: QUERY, status: SERVFAIL, id: 38423\n...\n\
  ```\n我们在命令上加上 `+search` 标志，告诉 `dig` 使用来自 `/etc/resolv.conf` 的搜索路径信息。然而，即使有了该标志，我们也没有找到\
  \ Service，因为我们的 Pod 位于 `default` 命名空间，所以搜索路径并没有引导 `dig` 去查找 `kube-system` 命名空间。\n\
  \n再次尝试，这次指定正确的命名空间：\n\n```\nroot@host01:~# kubectl exec -ti pod -- dig +search metrics-server.kube-system\n\
  ...\n;; ANSWER SECTION:\nmetrics-server.kube-system.svc.cluster.local. 30 IN A 10.105.140.176\n\
  ...\n```\n这次查找成功了，我们能够获取 `metrics-server` 服务的 IP 地址。它之所以有效，是因为搜索路径包含了 `svc.cluster.local`\
  \ 作为其第二个项。在初始尝试了 `metrics-server.kube-system.default.svc.cluster.local`（失败）后，`dig`\
  \ 接着尝试了 `metrics-server.kube-system.svc.cluster.local`，这次成功了。\n\n### 流量路由\n\n我们已经了如何创建和使用\
  \ Service，但还没有查看实际流量路由是如何工作的。事实证明，Service 网络流量的工作方式与我们在第 8 章中看到的覆盖网络（overlay networks）完全不同，这可能会导致一些困惑。\n\
  \n例如，因为我们可以使用 `wget` 通过 `nginx` 服务名称访问 NGINX 服务器实例，我们可能期望同样也能使用 `ping`，但行不通：\n\n\
  ```\nroot@host01:~# kubectl exec -ti pod -- ping -c 3 nginx\nPING nginx (10.100.221.220):\
  \ 56 data bytes\n\n--- nginx ping statistics ---\n3 packets transmitted, 0 packets\
  \ received, 100% packet loss\ncommand terminated with exit code 1\n```\n域名解析如预期那样工作了，所以\
  \ `ping` 知道其 ICMP 数据包应该使用哪个目标 IP 地址。但该 IP 地址没有回。。我们可以查看集群中的每一个主机和容器的网络接口，但永远找不到一个载有\
  \ `10.100.221.220` Service IP 地址的接口。那么，我们的 HTTP 流量是如何到达 NGINX Service 实例的？\n\n在我们集群的每个节点上，都有一个名为\
  \ `kube-proxy` 的组件，负责配置流量路由。`kube-proxy` 在 `kube-system` 命名空间中作为 `DaemonSet` 运行。每个\
  \ `kube-proxy` 实例监听 Service 的变化。可以使用 `iptables` 命令查看防火墙，查看 `kube-proxy` 是如何配置的：\n\
  \n```\nroot@host01:~# iptables-save | grep 'default/nginx'\n➊ -A KUBE-SERVICES !\
  \ -s 172.31.0.0/16 -d 10.100.221.220/32 -p tcp -m comment\n    --comment \"default/nginx\
  \ cluster IP\" -dport 80 -j KUBE-MASQ\n➋ -A KUBE-SERVICES -d 10.100.221.220/32 -p\
  \ tcp -m comment\n   --comment \"default/nginx cluster IP\" -dport 80 -j KUBE-SVC-27L6M\n\
  ```\n`iptables-save` 命令备份所有的 Linux 规则，因此输出非常有用。`grep` 命令搜索 `kube-proxy` 应用于 Service\
  \ 的注释字符串。在这个示例中，`kube-proxy` 为整个 Service 创建了两规则。第一个规则 `➊` 匹配并非来自 Pod 的流量进行网络地址转换（NAT）伪装，这样任何响应流量的源将被重写为\
  \ Service 地址，而不是处理请求的实际 Pod。第二个规则 `➋` 将指向 Service 的流量发送到一个独立的规则链，从而发送到 Pod。注意，在两种情况下，规则都匹配目标端口为\
  \ 80 的 TCP 流量。\n\n我们可以检查这个独立的规则链，查看实际到 Pod 的路由是如何工作的。请确保用上一个输出显示的规则链名称替换命令中的名称：\n\
  \n```\nroot@host01:~# iptables-save | grep KUBE-SVC-27L6M\n...\n-A KUBE-SVC-27L6M\
  \ -m statistic --mode random\n  --probability 0.20000000019 -j KUBE-SEP-PIVU7ZHMCSOWIZ2Z\n\
  -A KUBE-SVC-27L6M -m statistic --mode random\n  --probability 0.25000000000 -j KUBE-SEP-CFQXKE74QEHFB7VJ\n\
  -A KUBE-SVC-27L6M -m statistic --mode random\n  --probability 0.33333333349 -j KUBE-SEP-DHDWEJZ7MGGIR5XF\n\
  -A KUBE-SVC-27L6M -m statistic --mode random\n  --probability 0.50000000000 -j KUBE-SEP-3S3S2VJCXSAISE2Z\n\
  -A KUBE-SVC-27L6M -j KUBE-SEP-AQWD2Y25T24EHSNI\n```\n输出显示了五条规则，对应于 Service 的选择器匹配的五个\
  \ NGINX Pod 实例。这五条规则共同为所有实例提供了随机负载均衡，使得每个实例在选择新连接时的机会相等。\n\n\n\n\n每个规则的概率数字都在增加，这看起来可能很奇怪。这是必要的，因为规则是顺序评估的。对于第一个规则，我们希望有\
  \ 20% 的概率选择第一个实例。然而，如果我们没有选择第一个实例，就剩下四个实例了，所以我们希望有 25% 的概率选择第二个。同样的逻辑一直持续，直到最后一个最后一个实例，如果我们跳过了所有其他实例，我们总是想要选择它。\n\
  \n让我们快速验证一下这些规则是否指向了预期的目的地（再次，请确保在在此命令中替换规则链的名称）：\n\n```\nroot@host01:~# iptables-save\
  \ | grep KUBE-SEP-PIVU7ZHMCSOWIZ2Z\n...\n-A KUBE-SEP-PIVU7ZHMC ... -s 172.31.239.235/32\
  \ ... --comment \"default/nginx\" -j KUBE-MARK-MASQ\n-A KUBE-SEP-PIVU7ZHMCSOWIZ2Z\
  \ -p tcp ... -m tcp -j DNAT --to-destination 172.31.239.235:80\n```\n\n此输出显示了两个规则。第一条是\
  \ NAT 映射配置的另一部分，我们标记了所有离开我们 Pod 实例的数据包，以便它们的源地址被重写，使其看起来来自 Service。第二条规则是实际上将 Service\
  \ 流量路由到特定 Pod 的规则，因为它对目标地址进行了重写，使得原始目标为 Service IP 的数据包现在目标变为 Pod。从那里开始，叠加网络（overlay\
  \ networking）将接管并实际上将数据包发送到正确的容器。\n\n理解了 Service 流量是如何实际路由的后，我们的 ICMP 数据包没有通过就合情合理了。`kube-proxy`\
  \ 创建的防火墙规则仅适用于目标为 80 端口的 TCP 流量。因此，没有防火墙规则来重写我们的 ICMP 数据包，因此它们无法到达可以对其回包的网络堆栈。同样，如果我们有一个监听多个端口的容器，我们将能够通过直接使用\
  \ Pod IP 地址连接到其中任何一个端口，但只有在 Service 规范中显式声明了该端口时，Service IP 地址才会路由流量。在部署应用程序时，如果\
  \ Pod 按预期启动并监听流量，但 Service 的配置错误导致流量没有路由到所有正确的目标端口，这可能会成为巨大的困惑来源。\n\n## 外部网络\n\n\
  我们现在有了足够的网络层来满足所有的内部集群通信需求。每个 Pod 都有自己的 IP 地址，并具有与其他 Pod 以及控制平面的连接性，通过 Service 网络，我们根据运行多个\
  \ Service Pod 实例实现了自动负载均衡和故障转移。然而，我们仍然缺少外部用户访问我们集群中运行的服务的能力。\n\n为了给外部用户提供访问，我们不能再依赖用于\
  \ Pod 和 Service 的集群特定 IP 范围，因为外部网络不识别这些地址范围。相反，我们需要一种方法为 Service 分配外部可路由 IP 地址，可以通过显式将\
  \ IP 地址与 Service 关联，或者使用监听外部流量并路由到 Service 的 `ingress controller`。\n\n### 外部 Service\n\
  \n我们之前创建的 `nginx` Service 是 `ClusterIP` Service，这是默认的 Service 类型。Kubernetes 支持多种\
  \ Service 类型，包括适用于需要外部暴露的 Service 的类型：\n\n- **None**: 也称为 `headless`（无头）Service，用于跟踪选定的\
  \ Pod，但没有 IP 地址或任何网络路由行为。\n- **ClusterIP**: 默认 Service 类型，提供对所选 Pod 的跟踪、在集群内部路由的集群\
  \ IP 地址以及集群 DNS 中的一个已知名称。\n- **NodePort**: 扩展了 `ClusterIP`，并在集群中的所有节点上都提供一个路由到 Service\
  \ 的端口。\n- **LoadBalancer**: 扩展了 `NodePort` 并使用底层云提供程序获取一个外部可访问的 IP 地址。\n- **ExternalName**:\
  \ 将集群 DNS 中的一个已知 Service 名称别名到某些外部 DNS 名称。用于让外部资源看起来像是集群内的 Service。\n\n在这些 Service\
  \ 类型中，`NodePort` 和 `LoadBalancer` 类型对于在集群外暴露 Service 最有用。`LoadBalancer` 类型似乎是最直接的，因为它简单地为\
  \ Service 添加了一个外部 IP。然而，它需要与底层云环境集成，以便在创建 Service 时创建外部 IP 地址，将流量从该 IP 地址路由到集群节点，并在集群外部创建一个\
  \ DNS 词目，让外部用户能够通过我们已经拥有的某些预注册域名作为主机来找到该 Service，而不是仅在集群内工作的 `cluster.local` 域名。\n\
  \n出于这个原因，`LoadBalancer` Service 对于我们知道正在使用何种云环境并且正在创建长期运行 Service 的情况最有用。对于 HTTP\
  \ 流量，我们可以通过使用 `NodePort` Service 配合 `ingress controller` 来获得 `LoadBalancer` Service\
  \ 的大部分收益，并额外获得对动态部署带有新 Service 的新应用程序的良好支持。\n\n在转向 ingress controller 之前，让我们现有的\
  \ `nginx` Service 转换为 `NodePort` Service，以便我们可以观察效果。我们可以使用 patch 文件来实现此：\n\n`nginx-nodeport.yaml`\n\
  \n```\n---\nspec:\n  type: NodePort\n```\n\npatch 文件允许我们只更新关心的特定字段。在这种情况下，我们正在更新我们关心的特定字段。为了让其工作，我们只需要在层级结构中的正确位置指定修改的字段。我们不需要更改\
  \ Service 的选择器或端口，所以补丁非常简单。让我们使用补丁：\n\n```\nroot@host01:~# kubectl patch svc nginx\
  \ --patch-file nginx-nodeport.yaml\nservice/nginx patched\n```\n\n对于此命令，我们必须指定要补丁的资源和使用的\
  \ patch 文件。结果与我们编辑 Service 的 YAML 然后使用 kubectl apply 是相同的。\n\nService 现在看起来有点不同：\n\
  \n```\nroot@host01:~# kubectl get service nginx\nNAME    TYPE       CLUSTER-IP \
  \      EXTERNAL-IP   PORT(S)        AGE\nnginx   NodePort   10.100.221.220   <none>\
  \        80:31326/TCP   2h\n```\n\n`NodePort` Service 提供了 `ClusterIP` Service 的所有行为，因此我们的\
  \ Service 关联了一个集群 IP。Service 甚至保留了集群 IP。唯一的变化是 PORT 字段现在显示 Service 端口 80 到了节点端口\
  \ 31326。\n\n每个节点上的 `kube-proxy` Service 都在监听此端口（请确保使用 Service 的节点端口）：\n\n```\nroot@host01:~#\
  \ ss -nlp | grep 31326\ntcp   LISTEN 0  4096  .0.0.0:31326 ... users:((\"kube-proxy\"\
  ,pid=3339,fd=15))\n```\n\n结果，我们可以在 Pod 内部使用 `nginx` Service 名称，但也可以从主机使用 NodePort：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod -- wget -O - http://nginx\nConnecting\
  \ to nginx (10.100.221.220:80)\n...\n<title>Welcome to nginx!</title>\n...\nroot@host01:~#\
  \ wget -O - http://host01:31326\n...\nConnecting to host01 (host01)|127.0.2.1|:31326...\
  \ connected.\n...\n<h1>Welcome to nginx!</h1>\n...\n```\n\n由于 `kube-proxy` 监听所有网络接口，我们已成功将此\
  \ Service 暴露给了外部用户。\n\n\n\n\n\n尽管我们成功地将 `NGINX Service` 暴露在集群之外，但我们仍然没有为外部用户提供良好的体验。要使用\
  \ `NodePort Service`，外部用户需要知道我们集群中至少一个节点的 IP 地址，并且需要知道每个 `Service` 监听的精确端口。如果 `Service`\
  \ 被删除并重新创建，该端口可能会发生。我们可以通过告诉 Kubernetes 使用哪个端口作为 `NodePort` 来在某种程度上解决这个问题，但我们不想对任何任意的\
  \ `Service` 这样做，因为多个 `Services` 可能会选择相同的端口。\n\n我们真正需要一个集群的单一外部入口点，它可以跟踪多个可用的服务并使用规则将流量路由到这些服务。这样，我们就可以将所有的路由配置部署在集群内部，使得\
  \ `Services` 能够动态地出现和消失。同时，我们可以为集群拥有一个单一且众知的入口点，供所有外部用户使用。\n\n对于 HTTP 流量，Kubernetes\
  \ 正提供了这种能力，并称之为 `Ingress`。要配置我们的集群将外部 HTTP 流量路由到 `Services`，我们需要定义一组指定路由的 `Ingress`\
  \ 资源，并部署接收和路由流量的 ingress 控制器。我们在设置集群时已经安装了 ingress 控制器：\n\n```\nroot@host01:~# kubectl\
  \ -n ingress-nginx get deploy\nNAME                       READY   UP-TO-DATE   AVAILABLE\
  \   AGE\ningress-nginx-controller   1/1     1            1           15d\nroot@host01:~#\
  \ kubectl -n ingress-nginx get svc\nNAME                      TYPE        ... PORT(S)\
  \               ...\ningress-nginx-controller  NodePort    ... 80:80/TCP,443:443/TCP\
  \ ...\n...\n```\n\n我们的 ingress 控制器包含一个 `Deployment` 和 `Service`。由于 `Service` 的类型为\
  \ `NodePort`，我们知道 `kube-proxy` 监听集群所有节点的 `80` 和 `443` 端口，准备好将流量路由到相关的 `Pod`。\n\n\
  正如其名，我们的 ingress 控制器实际上是一个 `NGINX` Web 服务器的实例；在这种情况下，`NGINX` 仅作为 HTTP 反向代理，而不是提供自己的任何网页内容。ingress\
  \ 控制器监听集群中 `Ingress` 资源的变化，并根据定义的规则重新配置 `NGINX` 以连接后端服务器。这些规则使用 HTTP 请求中的主机或路径信息来为请求选择一个\
  \ `Service`。\n\n让我们创建一个 `Ingress` 资源，将流量路由到我们在 Listing 9-1 中定义的 `nginx Service`。这是我们要创建的资源：\n\
  \n`nginx-ingress.yaml`\n\n```yaml\n---\napiVersion: networking.k8s.io/v1\nkind:\
  \ Ingress\nmetadata:\n  name: web01\nspec:\n  rules:\n    - host: web01\n      http:\n\
  \        paths:\n          - path: /\n            pathType: Prefix\n           \
  \ backend:\n              service:\n                name: nginx\n              \
  \  port:\n                  number: 80\n```\n\n此资源指示 ingress 控制器查看 HTTP `Host` 头部。如果它看到\
  \ `web01` 作为 `Host` 头部，它将将尝试与我们指定的 `paths` 中的路径进行匹配。在这种情况下，所有路径都将匹配路径 `/` 前缀，因此所有流量将路由到\
  \ `nginx Service`。\n\n在将此应用到集群之前，让我们确认一下如果我们尝试使用 ingress 控制器无法识别的主机名会发生什么。我们将使用与集群关联的高可用\
  \ IP 地址，因为集群的负载均衡器会将该地址转发到其中一个实例：\n\n```\nroot@host01:~# curl -vH \"Host:web01\"\
  \ http://192.168.61.10\n...\n> Host:web01\n...\n<head><title>404 Not Found</title></head>\n\
  ...\n```\n\n`curl` 命令中的 `-H \"Host:web01\"` 标志告诉 `curl` 使用值 `host01` 作为 HTTP 请求中的\
  \ `Host` 头部。鉴于我们的示例集群中没有可以将 `web01` 转换为集群 IP 地址的 DNS 服务器，这是是必要的。\n\n正如我们所看到的，作为\
  \ ingress 控制器的 `NGINX` 服务器被配置为每当它收到不匹配任何已配置的 `Ingress` 资源的请求时，返回 `404 Not Found`\
  \ 错误消息。在这种情况下，由于我们还没有创建任何 `Ingress` 资源，任何请求都将得到此响应。\n\n让我们 `web01 Ingress` 资源应用到集群：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/nginx-ingress.yaml \ningress.networking.k8s.io/web01\
  \ created\n```\n\n现在 `Ingress` 资源已存在，如 Listing 9-3 所示，在集群高可用 IP 和单个主机上的 HTTP 端口\
  \ `80` 请求都路由到 `nginx Service`：\n\n```\nroot@host01:~# curl -vH \"Host:web01\" http://host01\n\
  ...\n> Host:web01\n...\n<title>Welcome to nginx!</title>\n...\n```\n\n*Listing 9-3:\
  \ 通过 Ingress 使用 NGINX*\n\n作为 ingress 控制器的 `NGINX` 服务器被配置为每当它收到不匹配任何已配置的 `Ingress`\
  \ 资源的请求时，返回 `404 Not Found` 错误消息。在这种情况下，由于我们还没有创建任何 `Ingress` 资源，任何请求都将得到此响应。\n\n\
  由于 `Ingress` 资源已存在，如上所示，在集群高可用 IP 和单个主机上的 HTTP 端口 `80` 请求都路由到 `nginx Service`。\n\
  \n\n\n\n这种方法的优势在于，一旦完成设置，我们随时可以部署新的 Ingress 资源来将 Service 暴露在外部，只要我们选择唯一的主机名，就不会与其他任何已暴露的\
  \ Service 冲突。初始设置完成后，所有的配置都维护在集群内部，我们仍然为所有 Service 拥有高可用的配置。\n\n### 结语\n\n在 Kubernetes\
  \ 集群中路由网络流量可能涉及大量的复杂性，但最终结果非常直观：我们可以将应用程序组件部署到集群中，实现自动伸缩和故障转移，并且外部用户可以使用已知名称访问我们的应用程序，而无需了解应用程序是如何部署的，或者我们为了满足需求使用了多少个容器实例。如果我们构建的应用程序具有韧性，我们的应用程序容器就可以升级到新版本或在发生故障时重启，而用户甚至察觉不到这种变化。\n\
  \n当然，如果我们打算构建韧性的应用程序组件，了解部署容器时可能出现的问题至关重要。在下一章中，我们将查看向 Kubernetes 集群部署容器时的常见问题以及如何调试这些问题。\n\
  \n# 10\n\n当出现问题时\n\n![image](img/common01.jpg)\n\n到目前为止，我们 Kubernetes 的安装和配置一直按照计划进行，我们的控制器在创建\
  \ Pod 和启动容器方面没有问题。当然，在现实世界中，很少没那么简单。虽然展示复杂应用程序部署中可能发生的所有问题是不可能的，但我们可以查看一些最常见的问题。最重要的是，我们可以探索帮助我们诊断任何问题的调试工具。\n\
  \n在本章中，我们将研究如何诊断部署在 Kubernetes 之上的应用程序容器出现的问题。我们将按照调度和运行容器的生命周期进行，检查每一步可能出现的潜在问题，以及如何诊断和修复它们。\n\
  \n### 调度\n\n调度是 Kubernetes 对 Pod 及其容器执行的第一项活动。当 Pod 首次创建时，Kubernetes 调度器会将其分配给一个节点。通常情况下，这发生得很快且自动，但某些问题可能会阻止调度的成功。\n\
  \n#### 无可用节点\n\n一种可能性是调度器根本没有可用的节点。这种情况可能发生是因为我们的集群没有为常规应用程序容器配置任何节点，或者是因为所有节点都失败了。\n\
  \n为了说明没有可用节点进行分配的情况，让我们创建一个带有 `node selector`（节点选择器）的 Pod。节点选择器指定了 Pod 调度到该节点时需要的一个或多个节点标签。当集群中的某些节点与其他节点不同时（例如，当某些节点具有更新新的\
  \ CPU，支持某些容器所需的更高级指令集时），节点选择器是非常用的。\n\n**注意**\n\n本书书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。详情请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2) 上的“运行示例”。\n\n我们将从一个带有不匹配我们中任何节点的节点选择器的 Pod 定义开始：\n\
  \n`nginx-selector.yaml`\n\n```\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ nginx\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n  nodeSelector:\n\
  \ ➊ purpose: special\n```\n\n节点选择器 ➊ 告诉 Kubernetes 仅将此 Pod 分配给标签名为 `purpose` 且值为\
  \ `special` 的节点。尽管我们目前没有任何节点匹配该条件，但我们仍然可以创建这个 Pod：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/nginx-selector.yaml\npod/nginx created\n```\n\n然而，Kubernetes 卡在尝试调度\
  \ Pod 上，因为它找不到匹配的节点：\n\n```\nroot@host01:~# kubectl get pods -o wide\nNAME    READY\
  \   STATUS    RESTARTS   AGE    IP       NODE     ...\nnginx   0/1     Pending \
  \  0          113s   <none>   <none>   ...\n```\n\n我们看到状态为 `Pending` 节点分配为 `<none>`。这是因为\
  \ Kubernetes 尚未将此 Pod 调度到节点。\n\n`kubectl get` 命令通常是我们应该运行的第一条命令，以查看我们部署到集群的资源是否存在问题。如果我们遇到了问题（如在本例中所示），下一步是使用\
  \ `kubectl describe` 查看详细状态和事件日志：\n\n```\nroot@host01:~# kubectl describe pod nginx\n\
  Name:         nginx\nNamespace:    default\n...\nStatus:       Pending\n...\nNode-Selectors:\
  \              purpose=special\n\nEvents:\n  Type     Reason            Age    From\
  \               Message\n  ----     ------            ----   ----              \
  \ -------\n  Warning  FailedScheduling  4m36s  default-scheduler  0/3 nodes are\
  \ \n    available: 3 node(s) didn't match Pod's node affinity/selector.\n  Warning\
  \  FailedScheduling  3m16s  default-scheduler  0/3 nodes are \n    available: 3\
  \ node(s) didn't match Pod's node affinity/selector.\n```\n\n事件日志告诉我们确切的问题是什么：Pod\
  \ 无法调度，因为没有任何节点匹配选择器。\n\n让我们为其中一个节点添加必要的标签：\n\n```\nroot@host01:~# kubectl get nodes\n\
  NAME     STATUS   ROLES        ...\nhost01   Ready    control-plane...\nhost02 \
  \  Ready    control-plane...\nhost03   Ready    control-plane...\nroot@host01:~#\
  \ kubectl label nodes host02 purpose=special\nnode/host02 labeled\n```\n\n我们首先列出节点，然后在其中一个节点应用必要的标签。一旦我们应用了这个标签，Kubernetes\
  \ 现在就可以调度该 Pod 了：\n\n```\nroot@host01:~# kubectl get pods -o wide\nNAME    READY\
  \   STATUS    RESTARTS   AGE   IP               NODE     ...\nnginx   1/1     Running\
  \   0          10m   172.31.89.196   host02   ...\nroot@host01:~# kubectl describe\
  \ pod nginx\nName:         nginx\nNamespace:    default\n...\nEvents:\n  Type  \
  \   Reason            Age    From               Message\n  ----     ------     \
  \       ----   ----               -------\n  Warning  FailedScheduling  10m    default-scheduler\
  \  0/3 nodes are \n    available: 3 node(s) didn't match Pod's node affinity/selector.\n\
  \  Warning  FailedScheduling  9m17s  default-scheduler  0/3 nodes are \n    available:\
  \ 3 node(s) didn't match Pod's node affinity/selector.\n  Normal   Scheduled   \
  \      2m22s  default-scheduler  Successfully assigned \n    default/nginx to host02\n\
  ...\n```\n\n正如预期那样，Pod 被调度到了我们应用标签的节点。\n\n这个示例与章中看到的其他示例一样，说明了 Kubernetes 中的调试。在我们创建了所需的资源后，查询集群状态以确保这些资源的实际部署成功。让我们清理这个\
  \ NGINX Pod：\n\n```\nroot@host01:~# kubectl delete -f /opt/nginx-selector.yaml\n\
  pod \"nginx\" deleted\n```\n\n让我们也从节点上移除标签。我们通过在标签后添加一个减号来移除标签：\n\n```\nroot@host01:~#\
  \ kubectl label nodes host02 purpose-\nnode/host02 unlabeled\n```\n\n我们涵盖了调度器的一个问题，但还有一个我们需要查看的问题。\n\
  \n#### 资源不足\n\n\n\n在选择节点来托管 Pod 时，调度器还会考虑每个节点上可用的资源以及 Pod 所需要的资源。我们将在第 14 章中详细探讨资源限制（resource\
  \ limits）；目前只需要知道 Pod 中的每个容器都可以请求它所需的资源，而调度器将确保将其调度到具有这些可用资源的节点上。当然，如果没有节点具有足够的剩余空间，调度器将无法调度该\
  \ Pod。相反，Pod 将处于 Pending（挂起）状态等待。\n\n让我们来看一个 Pod 定义示例来说说明这一点：\n\n`sleep-multiple.yaml`\n\
  \n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: sleep\nspec:\n  containers:\n\
  \  - name: sleep\n    image: busybox\n    command: \n      - \"/bin/sleep\"\n  \
  \    - \"3600\"\n    resources:\n      requests:\n        cpu: \"2\"\n  - name:\
  \ sleep2\n    image: busybox\n    command: \n      - \"/bin/sleep\"\n      - \"\
  3600\"\n    resources:\n      requests:\n        cpu: \"2\"\n```\n\n在此 YAML 定义中，我们在同一个\
  \ Pod 中创建了两个容器。每个容器都请求两个 CPU。因为 Pod 中的所有容器必须在同一个主机上以共享某些 Linux 命名空间类型（特别是网络命名空间，以便它们可以使用\
  \ localhost 进行通信），调度器需要找到一个具有四个可用 CPU 的单个节点。在我们的小型集群中，这是发生不了，正如我们尝试部署该 Pod 时所看到的：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/sleep-multiple.yaml\npod/sleep created\n\
  root@host01:~# kubectl get pods -o wide\nNAME    READY   STATUS    RESTARTS   AGE\
  \   IP       NODE   ...\nsleep   0/2     Pending   0          7s    <none>   <none>\
  \ ...\n```\n\n和之前一样，`kubectl describe` 为我们提供了揭示问题的事件日志：\n\n```bash\nroot@host01:~#\
  \ kubectl describe pod sleep\nName:         sleep\nNamespace:    default\n...\n\
  Events:\n  Type     Reason            Age   From               Message\n  ---- \
  \    ------            ----  ----               -------\n  Warning  FailedScheduling\
  \  71s   default-scheduler  0/3 nodes are \n    available: 3 Insufficient cpu.\n\
  ```\n\n注意，我们的节点实际负载有多高并不重要：\n\n```bash\nroot@host01:~# kubectl top node\nNAME  \
  \   CPU(cores)   CPU%   MEMORY(bytes)   MEMORY%   \nhost01   429m         21%  \
  \  1307Mi          69%\nhost02   396m         19%    1252Mi          66%\nhost03\
  \   458m         22%    1277Mi          67%\n```\n\n我们的容器实际上会使用多少 CPU 也并不重要。调度器完全根据其请求的内容来分配\
  \ Pod；这样，当负载增加时，我们不会突然压垮 CPU。\n\n我们无法魔法般地为节点提供更多 CPU，为了让这个 Pod 能够调度，我们需要为两个容器指定较低的\
  \ CPU 使用量。让我们使用更合理的数字 0.1 CPU：\n\n`sleep-sensible.yaml`\n\n```yaml\n---\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: sleep\nspec:\n  containers:\n  - name: sleep\n\
  \    image: busybox\n    command: \n      - \"/bin/sleep\"\n      - \"3600\"\n \
  \   resources:\n      requests:\n         cpu: \"100m\"\n  - name: sleep2\n    image:\
  \ busybox\n    command: \n      - \"/bin/sleep\"\n      - \"3600\"\n    resources:\n\
  \      requests:\n        cpu: \"100m\"\n```\n\n值 `100m` 等于“一百毫毫核 CPU”或 CPU 的十分分之一\
  \ (0.1)。\n\n尽管这是一个单独的文件，但它声明了相同的资源，因此 Kubernetes 将其视为一次更新。然而，如果我们尝试将此更改应用到现有 Pod，它将失败：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/sleep-sensible.yaml\nThe Pod \"\
  sleep\" is invalid: spec: Forbidden: pod updates may not change \n  fields other\
  \ than ...\n```\n\n我们不允许允许更改现有 Pod 的资源请求，这是合理的，因为 Pod 仅在创建时分配到节点上，资源使用量的变化可能会导致节点过载。\n\
  \n如果我们使用像 Deployment 这样的控制器，控制器可以为我们处理 Pod Pod。因为我们直接创建了 Pod，我们需要手动删除并重建它：\n\n```bash\n\
  root@host01:~# kubectl delete pod sleep\npod \"sleep\" deleted\nroot@host01:~# kubectl\
  \ apply -f /opt/sleep-sensible.yaml\npod/sleep created\n```\n\n我们的新 Pod 在节点分配上没有问题：\n\
  \n```bash\nroot@host01:~# kubectl get pods -o wide\nNAME    READY   STATUS    RESTARTS\
  \   AGE   IP               NODE  ...\nsleep   2/2     Running   0          51s \
  \  172.31.89.199   host02 ...\n```\n\n和之前一样，`kubectl describe` 为我们提供了揭示问题的事件日志：\n\
  \n```bash\nroot@host01:~# kubectl describe pod sleep\nName:         sleep\nNamespace:\
  \    default\n...\nEvents:\n  Type     Reason            Age   From            \
  \   Message\n  ----     ------            ----  ----               -------\n  Warning\
  \  FailedScheduling  71s   default-scheduler  0/3 nodes are \n    available: 3 Insufficient\
  \ cpu.\n```\n\n注意，我们的节点实际负载有多高并不重要：\n\n```bash\nroot@host01:~# kubectl top node\n\
  NAME     CPU(cores)   CPU%   MEMORY(bytes)   MEMORY%   \nhost01   429m         21%\
  \    1307Mi          69%\nhost02   396m         19%    1252Mi          66%\nhost03\
  \   458m         22%    1277Mi          67%\n```\n\n我们的容器实际上会使用多少 CPU 也并不重要。调度器完全根据其请求的内容来分配\
  \ Pod；这样，当负载增加时，我们不会突然压垮 CPU。\n\n### 拉取镜像\n\n在 Pod 调度到节点后，kubelet 服务与运行时交互以创建环境并启动容器。然而，仍然有一种应用程序配置错误会导致\
  \ Pod 阻塞在 Pending 阶段：无法拉取镜像。\n\n三个主要问题会导致运行时拉取镜像：\n\n- 无法连接镜像仓库\n- 请求镜像的权限问题\n-\
  \ 镜像库中缺失\n\n正如我们在第 5 章中所描述的，镜像仓库是一个服务器。通常，镜像仓库位于集群外部，节点需要连接到外部网络或互联网才能访问它。此外，大多数仓库支持需要身份验证和授权的私有镜像。当然，如果我们指定的名称没有发布镜像，运行时将无法拉取它。\n\
  \n这些错误在我们的 Kubernetes 集群中行为相同，区别在于事件日志中的信息，因此我们只需要探索一个。我们将查看最常见的问题：镜像名称拼写错误导致的镜像缺失。\n\
  \n让我们尝试使用此 YAML 文件创建一个 Pod：\n\n`nginx-typo.yaml`\n\n```yaml\n---\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n  - name: nginx\n   \
  \ image: nginz\n```\n\nDocker Hub 中没有名为 nginz 的镜像，因此无法拉取此镜像。让我们探索将此资源添加到集群时会发生什么：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/nginx-typo.yaml\npod/nginx created\n\
  root@host01:~# kubectl get pods\nNAME    READY   STATUS             RESTARTS   AGE\n\
  nginx   0/1     ImagePullBackOff   0          20s\n```\n\n\n\n我们的 Pod 状态为 `ImagePullBackOff`，这立即传达了两个信息。首先，该\
  \ Pod 尚未达到容器运行的阶段，因为它还没有拉取容器镜像。其次，与所有错误一样，Kubernetes 会继续尝试该操作，但它会使用 `back-off`（退避）算法来避免过载我们集群的资源。拉取镜像涉及通过网络与镜像仓库（image\
  \ registry）进行通信，在短时间内向仓库发送大量请求是不礼貌的，也是对网络带宽的浪费。此外，失败的原因可能是瞬时的，因此集群将继续尝试，以希望问题得到解决。\n\
  \nKubernetes 使用退避算法来重试错误，这一点对于调试至关重要。在这种情况下，我们显然不会通过向 Docker Hub 发布一个 `nginz` 镜像来解决问题。但对于那些我们通过发布镜像或更改镜像权限来修复问题的情况，有一点很重要：Kubernetes\
  \ 不会立即获取到这些变化，因为每次尝试之间的延迟会随着失败次数次数而增加。\n\n让我们查看事件日志，看看这种退避是如何运作的：\n\n```\nroot@host01:~#\
  \ kubectl describe pod nginx\nName:         nginx\nNamespace:    default\n...\n\
  Status:     ➊ Pending \n...\nEvents:\n  Type     Reason     Age                \
  \ From               Message\n  ----     ------     ----                ----   \
  \            -------\n  Normal   Scheduled  114s                default-scheduler\
  \  Successfully \n    assigned default/nginx to host03\n...\n  Warning  Failed \
  \    25s (x4 over 112s)  kubelet            Failed to pull \n    image \"nginz\"\
  : ... ➋ pull access denied, repository does not exist or may \n    require authorization\
  \  ...\n...\n  Normal   BackOff    1s ➌ (x7 over 111s)   kubelet            ...\n\
  ```\n\n如之前所示，我们的 Pod 阻塞在 Pending 状态 ➊。但在这一次，Pod 已经过了调度阶段，并进入了拉取镜像阶段。出于安全考虑，仓库不会区分是由于没有访问权限的私有镜像还是不存在的镜像，因此\
  \ Kubernetes 只能告诉我们问题是其中之一 ➋。最后，我们可以看到，在我们创建此 Pod 的两分钟内，Kubernetes 已经尝试拉取了七次镜像 ➌，最后一次尝试是在一秒前。\n\
  \n如果我们等待几分钟，然后再次运行相同的 `kubectl describe` 命令并关注退避行为，我们可以看到每次尝试之间经历了很长的时间：\n\n```\n\
  root@host01:~# kubectl describe pod nginx\nName:         nginx\nNamespace:    default\n\
  ...\nEvents:\n  Type     Reason     Age                   From               Message\n\
  \  ----     ------     ----                  ----               -------\n...\n \
  \ Normal   BackOff    4m38s (x65 over 19m)  kubelet            ...\n```\n\nKubernetes\
  \ 现在在 19 分钟内尝试拉取了 65 次镜像。然而，延迟随着时间的推移而增长，每次尝试之间的延迟达到了五分钟的最大。这意味着在我们调试这个问题时，每次都需要等待最多五分钟才能看到问题是否已解决。\n\
  \n让我们修复这个问题以便看到它的运行过程。我们可以修复 YAML 文件并再次运行 `kubectl apply`，也可以使用 `kubectl set` 来修复：\n\
  \n```\nroot@host01:~# kubectl set image pod nginx nginx=nginx\npod/nginx image updated\n\
  root@host01:~# kubectl get pods\nNAME    READY   STATUS             RESTARTS   AGE\n\
  nginx   0/1     ImagePullBackOff   0          28m\n```\n\n`kubectl set` 命令要求我们指定资源类型和名称；在这种情况下为\
  \ `pod nginx`。然后我们指定 `nginx=nginx` 以提供要修改的容器名称（因为 Pod 可以有多个容器）以及新镜像。\n\n我们修复了镜像名称，但\
  \ Pod 仍然显示 `ImagePullBackOff`，因为我们必须等待五分钟计时结束，Kubernetes 才会再次尝试。在下次尝试时，拉取成功了，Pod\
  \ 开始运行：\n\n```\nroot@host01:~# kubectl get pods\nNAME    READY   STATUS    RESTARTS\
  \   AGE\nnginx   1/1     Running   0          32m\n```\n\n在继续之前，让我们清理掉 Pod：\n\n\
  ```\nroot@host01:~# kubectl delete pod nginx\npod \"nginx\" deleted\n```\n\n再次，我们能够通过\
  \ `kubectl get` 和 `kubectl describe` 解决这个问题。然而，当我们达到容器运行的阶段时，这些就不够了。\n\n### 运行容器\n\
  \n在指示容器运行时拉取所需的镜像后，`kubelet` 会告诉运行时启动容器。在本章其余后的示例中，我们将假设容器运行时按预期工作。此时，我们将会遇到的主要问题是容器未按预期启动的情况。让我们从一个调试运行失败容器的简单示例开始，然后看一个更复杂的示例。\n\
  \n### 使用日志调试\n\n对于我们的简单示例，我们首先需要一个带有启动时失败的容器的 Pod 定义。这里是一个 PostgreSQL 的 Pod 定义，可以满足我们的需求：\n\
  \n*postgres-misconfig.yaml*\n\n```\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: postgres\nspec:\n  containers:\n  - name: postgres\n    image: postgres\n\
  ```\n\n这个定义看起来没问题，但 PostgreSQL 在运行时某些配置。通过 `kubectl apply` 创建 Pod：\n\n```\nroot@host01:~#\
  \ kubectl apply -f postgres-misconfig.yaml\npod/postgres created\n```\n\n等待一段时间后，通过\
  \ `kubectl get` 检查状态，我们会注意到之前没过的状态：\n\n```\nroot@host01:~# kubectl get pods\nNAME\
  \       READY   STATUS             RESTARTS     AGE\npostgres   0/1     CrashLoopOff\
  \       1 (8s ago)   25s\n```\n\n`CrashLoopOff` 状态表示 Pod 中的容器已退出。由于这不是 Job，它不期望容器退出，因此被视为崩溃。如果你在正确的时间捕捉\
  \ Pod，可能会看到 Error 状态而不是 CrashLoopOff。这是临时的：和 `ImagePullBackOff` 状态一样，`CrashLoopOff`\
  \ 使用算法重试失败，每次失败增加重试之间的时间，以避免过度集群。如果我们等待几分钟然后再次打印状态，可以看到这种退避：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME       READY   STATUS             RESTARTS     AGE\npostgres\
  \   0/1     CrashLoopOff       5 (117s ago)   5m3s\n```\n\n在重启五次后，重试等待时间已经超过了一分钟。等待时间将继续增加直到达到五分钟，然后\
  \ Kubernetes 将每五分钟重试一次。\n\n让我们像 usual 一样使用 `kubectl describe` 来获取有关此失败的更多信息：\n\n\
  ```\nroot@host01:~# kubectl describe pod postgres\nName:         postgres\nNamespace:\
  \    default\n...\nContainers:\n  postgres:\n...\n    State:          Waiting\n\
  \      Reason:       CrashLoopOff\n    Last State:     Terminated\n      Reason:\
  \       Error\n      Exit Code:    1\n...\nEvents:\n  Type     Reason     Age  \
  \                  From               Message\n  ----     ------     ----      \
  \             ----               -------\n...\n  Warning  BackOff    3m13s (x24\
  \ over 8m1s)  kubelet            Back-off \n    restarting failed container\n```\n\
  \n`kubectl describe` 命令确实给了我们一个有用信息：容器的退出码。然而，这真的告诉我们发生了某种错误；不足以完全调试失败。为了确定容器为何失败，我们将使用\
  \ `kubectl logs` 命令查看容器日志：\n\n\n\n\n```\nroot@host01:~# kubectl logs postgres\n\
  Error: Database is uninitialized and superuser password is not specified.\n  You\
  \ must specify POSTGRES_PASSWORD to a non-empty value for the\n  superuser. For\
  \ example, \"-e POSTGRES_PASSWORD=password\" on \"docker run\".\n...\n```\n\n即使容器已经停止，我们仍然可以看到日志，因为容器运行时捕获了它们。\n\
  \n这条信息直接来自 PostgreSQL 本身。幸运的是，它准确地告诉我们问题所在：我们缺少一个必要的环境变量。我们可以通过更新 YAML 资源文件来快速修复它：\n\
  \n`postgres-fixed.yaml`\n\n```\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ postgres\nspec:\n  containers:\n  - name: postgres\n    image: postgres\n ➊ env:\n\
  \    - name: POSTGRES_PASSWORD\n      value: \"supersecret\"\n```\n\n`env` 字段 ➊\
  \ 添加了一个配置，用于传递所需的环境变量。当然，在真实系统中，我们不会直接以明文形式将其放在 YAML 文件中。我们将在第 16 章中查看如何保护此类信息。\n\
  \n要应用此更改，我们首先需要删除 Pod 定义，然后将新的资源配置应用到集群：\n\n```\nroot@host01:~# kubectl delete pod\
  \ postgres\npod \"postgres\" deleted\nroot@host01:~# kubectl apply -f /opt/postgres-fixed.yaml\n\
  pod/postgres created\n```\n\n与之前一样，如果我们使用像 Deployment 这样的控制器，我们只需要更新 Deployment，它就会处理删除旧\
  \ Pod 并为我们创建一个新 Pod。\n\n现在由于我们已经修复了配置，我们的 PostgreSQL 容器按预期启动了：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME       READY   STATUS    RESTARTS   AGE\npostgres   1/1\
  \     Running   0          77s\n```\n\n在继续下一个示例之前，让我们清理掉这个 Pod：\n\n```\nroot@host01:~#\
  \ kubectl delete pod postgres\npod \"postgres\" deleted\n```\n\n大多数编写良好的应用程序会在终止前打印日志消息，但我们需要为更困难的情况做好准备。让我们来看另一个包含两种新调试方法方法的示例。\n\
  \n### 使用 Exec 进行调试\n\n对于这个示例，我们需要一个行为不佳的应用程序。我们将使用一个执行非常恶劣内存访问的 C 程序。该程序被封装在 Alpine\
  \ Linux 容器中，以便我们可以在 Kubernetes 中作为容器运行。以下是 C 源代码：\n\n`crasher.c`\n\n```\nint main()\
  \ {\n  char *s = \"12\";\n  s[2] = '3';\n  return 0;\n}\n```\n\n第一行代码创建了一个指向长度为两个字符字符串的指针；第二行尝试写入不存在的第三个字符，导致程序立即终止。\n\
  \n这个 C 程序可以使用 `gcc` 在任何系统上编译以创建一个名为 crasher 的可执行文件。如果你在宿主机 Linux 系统上构建它，请使用此 `gcc`\
  \ 命令：\n\n```\n$ gcc -g -static -o crasher crasher.c\n```\n\n`-g` 参数确保调试符号可用。我们稍后会派到它们。`-static`\
  \ 参数是最重要的；我们希望将此封装为 Alpine 容器镜像内部的独立应用程序。如果我们在不同的 Linux 发行版（如 Ubuntu）上构建，标准库将基于不同的工具链，动态链接将会失败。由于这个原因，我们希望可执行文件的所有依赖项都是静态链接的。最后，我们使用\
  \ `-o` 指定输出的可执行文件名称，然后提供我们的 C 源代码文件名。\n\n或者，你也可以直接使用已经构建并发布到 Docker Hub 名为 `bookofkubernetes/crasher:stable`\
  \ 的容器镜像。该镜像是使用 GitHub Actions 根据仓库中的代码 *[`github.com/book-of-kubernetes/crasher`](https://github.com/book-of-kubernetes/crasher)*\
  \ 自动构建并发布的。以下是该仓库中的 `Dockerfile`：\n\n`Dockerfile`\n\n```\nFROM alpine AS builder\n\
  COPY ./crasher.c /\nRUN apk --update add gcc musl-dev && \\\n    gcc -g -o crasher\
  \ crasher.c\n\nFROM alpine\nCOPY --from=builder /crasher /crasher\nCMD [ \"/crasher\"\
  \ ]\n```\n\n这个 `Dockerfile` 利用 Docker 的多阶段构建能力来减小最终镜像的大小。要在 Alpine 容器内部编译，我们需要 `gcc`\
  \ 以及核心 C 头文件和库。然而这会导致容器镜像显著增大。我们只在编译时需要它们，因此我们希望避免在最终镜像包含这些额外内容。\n\n当我们使用在 第 5 章\
  \ 中看到的 `docker build` 命令运行此构建时，Docker 将基于 Alpine Linux 创建一个容器，将我们的源代码复制到其中，安装开发工具并编译应用程序。随后\
  \ Docker 将重新启动一个全新的 Alpine Linux 容器，并从第一个容器复制生成的的可执行文件。最终容器镜像是从第二个容器捕获的，因此我们避免了向最终镜像中添加开发工具。\n\
  \n让我们在 Kubernetes 集群中运行这个镜像。这次我们将使用 Deployment 资源，以便演示如何编辑它来绕过崩溃的容器：\n\n`crasher-deploy.yaml`\n\
  \n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: crasher\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: crasher\n  template:\n\
  \    metadata:\n      labels:\n        app: crasher\n    spec:\n      containers:\n\
  \      - name: crasher\n        image: bookofkubernetes/crasher:stable\n```\n\n\
  这个基础 Deployment 与我们在第 7 章中介绍 Deployment 时看到的非常相似。我们指定镜像字段以匹配镜像发布的位置。\n\n我们可以按照通常的方式将此\
  \ Deployment 添加到集群：\n\n```\nroot@host01:~# kubectl apply -f crasher-deploy.yaml\n\
  deployment.apps/crasher created\n```\n\n一旦 Kubernetes 有机会调度该 Pod 并拉取镜像，它就会按预期开始崩溃：\n\
  \n```\nroot@host01:~# kubectl get pods\nNAME                       READY   STATUS\
  \             RESTARTS      AGE\ncrasher-76cdd9f-5blbn   0/1     CrashLoopOff  \
  \   3 (24s ago)   73s\n```\n\n与之前一样，使用 `kubectl describe` 只能告诉我们容器的退出码。另一种方法是我们可以使用\
  \ `kubectl get` 的 JSON 输出格式和 `jq` 工具来获取退出码：\n\n```\nroot@host01:~# kubectl get pod\
  \ crasher-76cdd9f-5blbn -o json | \\\n  jq '.status.containerStatuses[].lastState.terminated.exitCode'\n\
  139\n```\n\n请根据 `kubectl get pods` 的输出使用正确的 Pod 名称。退出码 139 告诉我们容器因段错误终止了。然而，日志对于诊断问题没有帮助，因为我们的程序在崩溃之前没有打印任何内容：\n\
  \n```\nroot@host01:~# kubectl logs crasher-76cdd9f-5blbn\n[ no output ]\n```\n\n\
  我们遇到了一个相当棘手的问题。日志没有帮助，所以下一步是使用 `kubectl exec` 进入容器内部。然而，当我们的应用程序崩溃时，容器会停止，没有足够的时间让我们进行任何调试工作。\n\
  \n为了修复这个问题，我们需要一种启动此容器而不运行崩溃程序的方法。我们可以通过覆盖默认命令让我们的容器保持运行。因为我们是在 Alpine Linux 镜像上构建的，`sleep`\
  \ 命令可供我们使用。\n\n我们可以通过编辑 YAML 文件并以此更新 Deployment，但也可以直接使用 `kubectl edit` 编辑 Deployment，这会在编辑器中调出当前定义，我们所做的任何更改将保存到集群中：\n\
  \n\n\n\n\n这将在编辑器窗口中通过 `vi` 打开一个 YAML 格式的 Deployment 资源。该资源包含的字段将比我们创建它时提供的多得多，因为\
  \ Kubernetes 会向我们显示资源的状态以及一些带有默认值的字段。\n\n如果你不喜欢 `vi`，可以在 `kubectl edit` 命令前加上 `KUBE_EDITOR=nano`，来改用\
  \ Nano 编辑器。\n\n在文件中，找到以下几行：\n\n```\n spec:\n      containers:\n      - image: bookofkubernetes/crasher:stable\n\
  \        imagePullPolicy: IfNotPresent\n```\n\n尽管 YAML 资源中没有包含这一行，你仍然会看到 `imagePullPolicy`\
  \ 这一行，因为 Kubernetes 自动为资源添加了默认策略。在 `image` 和 `imagePullPolicy` 之间添加新行，使结果如下所示：\n\
  \n```\n spec:\n      containers:\n      - image: bookofkubernetes/crasher:stable\n\
  \        args: [\"/bin/sleep\", \"infinity\"]\n        imagePullPolicy: IfNotPresent\n\
  ```\n\n新添加的这一行覆盖了容器的默认命令，使其运行 `sleep` 而不是运行我们的崩溃程序。保存并退出编辑器，`kubectl` 就会获取新的定义：\n\
  \n```\ndeployment.apps/crasher edited\n```\n\n在 `kubectl` 将此更改应用到集群后，Deployment\
  \ 必须删除旧 Pod 并创建一个新的。这是自动完成的，因此我们唯一注意到的区别是 Pod 名称中自动生成的部分。当然，我们还会看到 Pod 正在运行：\n\n\
  ```\nroot@host01:~# kubectl get pods\nNAME                       READY   STATUS\
  \    RESTARTS   AGE\ncrasher-58d56fc5df-vghbt   1/1     Running   0          3m29s\n\
  ```\n\n我们的 Pod 现在正在运行，但它只是在运行 `sleep`。我们仍然需要调试实际应用程序。要做到这一点，我们现在可以在容器内部获取一个 shell\
  \ 提示符：\n\n```\nroot@host01:~# kubectl exec -ti crasher-58d56fc5df-vghbt -- /bin/sh\n\
  / #\n```\n\n当我们更改定义时，Deployment 替换了 Pod，所以名称发生了变化。和之前一样，请使用正确的 Pod 名称。此时，我们可以手动尝试我们的崩溃程序：\n\
  \n```\n/ # /crasher\nSegmentation fault (core dumped)\n```\n\n在许多情况下，通过这种方式运行程序并尝试不同的环境变量和命令行选项，可能足以发现并修复问题了。或者，我们可以尝试使用\
  \ `strace` 运行程序，它会告诉我们程序在崩溃之前尝试进行哪些系统调用以及尝试打开哪些文件。在这种情况下，我们知道程序是因为段错误（segmentation\
  \ fault）崩溃的，这意味着问题可能是一个编程错误，因此我们最好的方法是使用端口转发将调试工具连接到应用程序。\n\n### 使用端口转发进行调试\n\n\
  我们将通过使用基于文本的调试器 `gdb` 来演示端口转发，但任何可以通过网络端口连接的调试器都可以工作。首先，我们需要使用一个调试器在容器内创建我们的应用程序，该调试器将监听一个网络端口并在运行代码之前进行等待。为了做到这一点，我们需要在容器内安装\
  \ `gdb`。由于这是一个 Alpine 容器，我们将使用 `apk`：\n\n```\n/ # apk add gdb\n...\n(13/13) Installing\
  \ gdb (10.1-r0)\nExecuting busybox-1.32.1-r3.trigger\nOK: 63 MiB in 27 packages\n\
  ```\n\n我们安装的 `gdb` 版本包含了 `gdbserver`，它允许我们启动网络调试会话。\n\n由于 `gdb` 是一个基于文本的调试器，我们显然可以直接启动它来调试我们的应用程序，但使用带有\
  \ GUI 的调试器通常更好，这让我们更容易单步源码、设置断点并观察变量。出于这个原因，我将展示如何通过网络连接调试器的过程。\n\n让我们启动 `gdbserver`\
  \ 并将其配置为监听端口 `2345`：\n\n```\n/ # gdbserver localhost:2345 /crasher\nProcess /crasher\
  \ created; pid = 25\nListening on port 2345\n```\n\n注意，我们告诉了 `gdbserver` 监听 `localhost`\
  \ 接口。我们仍然能够连接到调试器，因为我们将通过 `kubectl port-forward` 命令让 Kubernetes 提供端口转发。该命令导致 `kubectl`\
  \ 连接到 API 服务器并请求其将流量转发到特定 Pod 上的特定端口。优点是，我们可以从任何可以连接到 API 服务器的地方（甚至是集群外部）使用此端口转发功能。\n\
  \n专门使用端口转发来运行远程调试器对于 Kubernetes 集群管理员或容器化应用程序开发人员来说可能并不是日常常态，但在没有其他方法发现 bug 时，这是一项非常有价值的技能。它也是说明端口转发到达\
  \ Pod 的强大能力的极佳方式。\n\n由于我们在第一个终端窗口中运行了调试器，我们需要另一个终端标签页或窗口来执行端口转发，这可以在集群中的任何一个主机上完成。让我们使用\
  \ `host01`：\n\n```\nroot@host01:~# kubectl port-forward pods/crasher-58d56fc5df-vghbt\
  \ 2345:2345\nForwarding from 127.0.0.1:2345 to 2345\nForwarding from [::]:2345 to\
  \ 2345\n```\n\n### 结语\n\n当我们把应用程序组件放入容器镜像并在 Kubernetes 集群中运行它们，我们在可扩展性和自动故障转移方面获得了巨大的收益，但在运行应用程序运行时也引入了许多可能出错的新可能性，并为调试这些问题带来了挑战。在本章中，我们查看了如何使用\
  \ Kubernetes 命令系统地跟踪应用程序的启动和运行，以确定阻止其运行的原因。通过这些命令，我们可以调试发生在应用程序层面的任何问题，即使应用程序组件在容器化环境中无法正确启动。\n\
  \n现在我们对使用 Kubernetes 运行容器有了清晰的认识，可以开始深入研究集群本身的能力。在此过程中，我们将确保探索每个组件的工作原理，以便掌握诊断问题所需的工具。我们将在下一章从详细查看\
  \ Kubernetes 控制平面开始。\n\n\n\n\n\n虽然我们将重点关注 API 服务器，但控制面还包含多个其他服务，每个服务都有其特定的角色。其他控制面服务作为\
  \ API 服务器的客户端，监控集群变化并采取适当的操作来更新集群状态。以下列表描述了其他控制面组件：\n\n- `Scheduler`（调度器）：将每个新的\
  \ `Pod` 分配到节点。\n- `Controller manager`（控制器管理器）：负责多个职责，包括为 `Deployments` 创建 `Pods`、监控节点以及对故障做出响应。\n\
  - `Cloud controller manager`（云控制器管理器）：这是一个可选组件，与底层的云提供程序接口，以检查节点并配置网络流量路由。\n\n在我们演示\
  \ API 服务器的工作原理时，我们还将看到 Kubernetes 如何管理安全，以确保只有授权的用户和和服务才能查询集群并对其进行更改。像 Kubernetes\
  \ 这样的容器编排环境的目的是为我们可能运行的任何容器化应用程序提供平台，因此这种安全性对于确保集群仅按预期方式使用至关重要。\n\n### API Server\n\
  \n尽管 API 服务器在 Kubernetes 架构中处于核心位置，但它的目的非常简单。它使用 HTTP 和表述状态转移（REST）暴露接口，用于对集群中的资源执行基本的创建、检索、更新和删除操作。它执行身份验证以识别客户端，执行授权以确保客户端拥有特定请求的权限，并执行验证以确保任何创建或更新的资源都符合相应的规范。它还根据从客户端接收到的命令从数据存储中读取和写入数据。\n\
  \n然而，API 服务器并不负责实际更新集群的当前状态以匹配期望状态。那是其他控制面和节点组件的职责。例如，如果客户端创建了一个新的 Kubernetes `Deployment`，API\
  \ 服务器的工作仅仅是更新数据存储以包含资源信息。随后，`scheduler` 的工作是决定 `Pods` 运行在何处，而所分配节点上的 `kubelet` 服务的工作则是创建并监控容器，并配置网络以将流量路由到容器中。\n\
  \n对于本章来说，我们通过自动化脚本配置了一个三节点 Kubernetes 集群。这三个节点中的每一个节点都充当控制面节点，因此运行着三个 API 服务器的副本。我们可以与这三个节点中的任何一个进行通信，因为它们都共享同一个后端数据库。API\
  \ 服务器在端口 `6443`（默认端口）上监听安全的 HTTP 连接。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页 的“运行示例”获取设置详细信息。\n\n我们一直在使用 `kubectl` 与 API 服务器通信，以创建和删除资源并检索状态，并且 `kubectl`\
  \ 一直使用端口 `6443` 上的安全 HTTP 与集群通信。它知道这样做是因为在集群初始化时，`kubeadm` 在 `/etc/kubernetes` 目录下安装了一个\
  \ Kubernetes 配置文件。该配置文件还包含身份验证信息，授予了我们读取集群状态和进行更改的权限。\n\n由于 API 服务器期望使用安全的 HTTP，我们可以使用\
  \ `curl` 直接与 Kubernetes API 通信。这将让我们更好地感受通信实际上是如何工作的。让我们从一个简单的 `curl` 命令开始：\n\n\
  ```\nroot@host01:~# curl https://192.168.61.11:6443/\ncurl: (60) SSL certificate\
  \ problem: unable to get local issuer certificate\nMore details here: https://curl.se/docs/sslcerts.html\n\
  ...\n```\n\n此错误消息显示 `curl` 不信任 API 服务器提供的证书。我们可以使用 `curl` 查看此证书：\n\n```\nroot@host01:~#\
  \ curl -kv https://192.168.61.11:6443/\n...\n* Server certificate:\n*  subject:\
  \ CN=kube-apiserver\n...\n*  issuer: CN=kubernetes\n...\n```\n\n`-k` 选项告诉 `curl`\
  \ 忽略任何证书问题，而 `-v` 告诉 `curl` 提供我们有关连接的额外日志信息。\n\n为了让 `curl` 信任此证书，它需要信任颁发者，因为颁发者是证书的签名者。让我们从\
  \ Kubernetes 安装中获取证书，以便我们可以让 `curl` 指向它：\n\n```\nroot@host01:~# cp /etc/kubernetes/pki/ca.crt\
  \ .\n```\n\n确保在结尾添加 `.` 以将此文件复制到当前目录。我们这样做仅仅是为了让后续命令更容易输入。\n\n在使用此证书之前，让我们检查一下：\n\
  \n```\nroot@host01:~# openssl x509 -in ca.crt -text\nCertificate:\n...\n       \
  \ Issuer: CN = kubernetes\n...\n        Subject: CN = kubernetes\n```\n\n颁发者（Issuer）和主体（Subject）是相同的，因此这是一个自签名证书。它是我们在初始化此集群时由\
  \ `kubeadm` 创建的。使用生成的证书允许 `kubeadm` 适应我们特定的集群网络配置，并允许我们的集群拥有唯一的唯一的证书和密钥，而不需要外部证书颁发机构（CA）。然而，这意味着我们需要在任何需要与此\
  \ API 服务器通信的系统上配置 `kubectl` 以信任此证书。\n\n我们现在可以告诉 `curl` 使用此证书来验证 API 服务器：\n\n```\n\
  root@host01:~# curl --cacert ca.crt https://192.168.61.11:6443/\n{\n...\n  \"status\"\
  : \"Failure\",\n  \"message\": \"forbidden: User \\\"system:anonymous\\\" cannot\
  \ get path \\\"/\",\n...\n  \"code\": 403\n}\n```\n\n现在我们为 `curl` 提供了正确的根证书，`curl`\
  \ 就可以验证 API 服务器证书，我们可以成功连接到 API 服务器。然而，API 服务器返回了 403 错误，表明我们未获得授权。这是因为我们没有为 `curl`\
  \ 提供传递给 API 服务器的身份验证信息，因此 API 服务器将我们视为匿名用户。\n\n最后一点：为了让此 `curl` 命令生效，我们需要对使用的主机名或\
  \ IP 地址进行选择。API 服务器监听所有网络接口，因此我们可以使用 `localhost` 或 `127.0.0.1` 连接它。然而，这些并未列在 API\
  \ Server 证书中，且不能用于安全的 HTTP。\n\n### API Server 验证\n\n在 API 服务器接受我们的请求之前，我们需要提供身份验证信息，因此让我们了解\
  \ API 服务器的身份验证过程。身份验证通过一组插件处理，每个插件都会检查请求以判断它是否可以识别客户端。第一个成功识别客户端的插件将为 API 服务器提供身份信息。该身份随后将结合授权确定客户端允许做什么。\n\
  \n由于身份验证是基于插件的，因此可以根据需要拥有许多不同的客户端验证方式。甚至可以在 API 服务器前面添加一个代理，执行自定义身份验证逻辑并通过 HTTP\
  \ Header 将用户身份传递给 API 服务器。\n\n出于我们的目的，我们将重点关注在集群内部或作为集群设置过程部分的三个主要的身份验证插件：客户端证书、引导令牌以及和服务账户。\n\
  \n#### 客户端证书\n\n如前所述，HTTP 客户端（如 `curl`）通过将服务器主机名与其证书进行比较，并通过对比 CA 列表检查证书签名来验证服务器身份。除了检查服务器身份外，安全的\
  \ HTTP 还允许客户端向服务器提交证书。服务器根据其信任的权威列表检查签名，然后将证书的主体作为客户端的身份。\n\n\n\n\nKubernetes 广泛使用\
  \ HTTP 客户端证书认证来使集群服务能够与 API 服务器进行身份验证。这包括控制平面组件，以及运行在每个节点上的 `kubelet` 服务。我们可以使用\
  \ `kubeadm` 来列出控制平面使用的证书：\n\n``` evenroot@host01:~# kubeadm certs check-expiration\n\
  ...\nCERTIFICATE                ...  RESIDUAL TIME   CERTIFICATE AUTHORITY ...\n\
  admin.conf                 ...  363d                                  ...\napiserver\
  \                  ...  363d            ca                    ...\napiserver-etcd-client\
  \      ...  363d            etcd-ca               ...\napiserver-kubelet-client\
  \   ...  363d            ca                    ...\ncontroller-manager.conf    ...\
  \  363d                                  ...\netcd-healthcheck-client    ...  363d\
  \            etcd-ca               ...\netcd-peer                  ...  363d   \
  \         etcd-ca               ...\netcd-server                ...  363d      \
  \      etcd-ca               ...\nfront-proxy-client         ...  363d         \
  \   front-proxy-ca        ...\nscheduler.conf             ...  363d            \
  \                      ...\n...\n```\n\n`RESIDUAL TIME` 列显示了这些证书过期前的剩余时间；默认情况下，它们一年后过期。使用\
  \ `kubeadm certs renew` 可以刷新这些证书，并将证书名称作为参数传递。\n\n列表中的第一个项目 `admin.conf` 是我们在过去几个章节中向集群进行身份验证的方式。在初始化期间，`kubeadm`\
  \ 创建了此证书并将其存储在 `/etc/kubernetes/admin.conf` 文件中。我们运行的每一个 `kubectl` 命令都在使用这个文件，因为我们的自动化脚本设置了\
  \ `KUBECONFIG` 环境变量：\n\n```\nroot@host01:~# echo $KUBECONFIG\n/etc/kubernetes/admin.conf\n\
  ```\n\n如果我们没有设置 `KUBECONFIG`，`kubectl` 将使用默认值，即用户主目录下的 `.kube/config` 的文件。\n\n`admin.conf`\
  \ 凭据的设计用于提供集群的紧急访问，并绕过权限检查。在生产集群中，我们会避免在日常操作中直接使用这些凭据。相反，生产集群的最佳实践是为管理员和普通用户集成一个独立的身份标识器。在我们的示例中，由于我们没有独立的身份标识器，我们将为普通用户创建一个额外的证书。这种证书可能对于运行在集群之外的自动化过程有用，但它无法与身份标识器集成。\n\
  \n我们可以使用 `kubeadm` 创建一个新的客户端证书：\n\n```\nroot@host01:~# kubeadm kubeconfig user --client-name=me\
  \ \\\n  --config /etc/kubernetes/kubeadm-init.yaml > kubeconfig\n```\n\n`kubeadm\
  \ kubeconfig user` 命令请求 API 服务器生成一个新的客户端证书。由于该证书是由集群的 `CA` 签名的，因此它对于身份验证是有效的。证书被保存到\
  \ `kubeconfig` 文件中，并包含了连接到 API 服务器所需的配置：\n\n```\nroot@host01:~# cat kubeconfig\n\
  apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data: ...\n   \
  \ server: https://192.168.61.10:6443\n  name: kubernetes\ncontexts:\n- context:\n\
  \    cluster: kubernetes\n    user: me\n  name: me@kubernetes\ncurrent-context:\
  \ me@kubernetes\nkind: Config\npreferences: {}\nusers:\n- name: me\n  user:\n  \
  \  client-certificate-data: ...\n    client-key-data: ...\n```\n\n`clusters` 部分定义了连接到\
  \ API 服务器所需的信息，包括所有 API 服务器共享的负载均衡地址。`users` 部分定义了我们创建的新用户以及其客户端证书。到目前为止，我们成功创建了一个新用户，但我们还没有给该用户任何权限，因此使用这些凭据将无法成功：\n\
  \n```\nroot@host01:~# KUBECONFIG=kubeconfig kubectl get pods\nError from server\
  \ (Forbidden): pods is forbidden: User \"me\" cannot list resource \"pods\" in namespace\
  \ \"default\"\n```\n\n在章节的后后部分，我们将看到如何给该用户赋予权限。\n\n### 引导令牌 (Bootstrap Tokens)\n\
  \n初始化像 Kubernetes 这样的分布式系统是具有挑战性的。运行在每个节点上的 `kubelet` 服务必须被添加到集群中。为了做到，`kubelet`\
  \ 必须连接到 API 服务器并获取由集群 `CA` 签名的客户端证书。然后 `kubelet` 服务使用该客户端证书对集群进行身份验证。\n\n这种证书的生成必须安全地进行，以消除向集群添加恶意节点的可能性。出于此原因，API\
  \ 服务器不能为任何请求加入集群的节点提供证书。相反，节点必须生成自己的私钥，向 API 服务器提交证书签名请求 (`CSR`)，并接收一个已签名的证书。\n\n\
  为了保持此过程的安全性，我们需要确保节点有权提交证书签名请求。但这种提交必须在节点拥有用于永久身份验证的客户端证书之前发生——我们面临着先有鸡还是先有蛋的问题！Kubernetes\
  \ 通过限限制的令牌解决了这个问题，这种令牌被称为 `Bootstrap Tokens`（引导令牌）。引导令牌变成一个 API 服务器和新节点已知的预共享 `secret`。限制此令牌的时间，可以减少其泄露时对集群造成的风险。Kubernetes\
  \ 控制管理器（controller-manager）负责自动清理过期的引导令牌。当我们初始化集群时，`kubeadm` 创建了一个引导令牌，但它配置为两小时后过期。如果我们在之后还需要加入更多节点，可以使用\
  \ `kubeadm` 生成一个新的引导令牌：\n\n```\nroot@host01:~# TOKEN=$(kubeadm token create)\nroot@host01:~#\
  \ echo $TOKEN\npqcnd6.4awyqfaetzm\n```\n\n此令牌作为 `Secret` 被添加到 `kube-system` 命名空间。我们将在第\
  \ 16 章详细介绍 secret。现在，我们只需验证它是否存在：\n\n```\nroot@host01:~# kubectl -n kube-system\
  \ get secret\nNAME                    TYPE                           DATA   AGE\n\
  ...\nbootstrap-token-pqcnd6  bootstrap.kubernetes.io/token  6      64s\n...\n```\n\
  \n我们可以通过带有前缀 `Bearer` 的 HTTP 头部向 API 服务器发送请求使用该令牌。当引导令牌认证插件看到该头部并将提供的令牌与相应的 `secret`\
  \ 匹配时，它会对我们进行 API 服务器身份验证并允许我们访问 API。\n\n出于安全考虑，引导令牌仅拥有 API 服务器的证书请求功能，这就是我们的令牌允许的所有操作。\n\
  \n让我们使用引导令牌列出所有的证书签名请求：\n\n```\nroot@host01:~# curl --cacert ca.crt \\\n  -H \"\
  Authorization: Bearer $TOKEN\" \\\n  https://192.168.61.11:6443/apis/certificates.k8s.io/v1/certificatesigningrequests\n\
  {\n  \"kind\": \"CertificateSigningRequestList\",\n  \"apiVersion\": \"certificates.k8s.io/v1\"\
  ,\n  \"metadata\": {\n    \"resourceVersion\": \"21241\"\n  },\n  \"items\": [\n\
  ...\n  ]\n}\n```\n\n了解引导令牌的工作原理是非常重要的，因为它们对于将节点添加到集群至关重要。然而，正如名称所示，这确实是引导令牌的唯一用途；通常不会将它们用于正常的\
  \ API 服务器访问。对于正常的 API 服务器访问，特别是从集群内部的，我们需要一个 `ServiceAccount`（服务账户）。\n\n### 服务账户\
  \ (Service Accounts)\n\n\n\n\n在 Kubernetes 集群中运行的容器通常需要与 API 服务器进行通信。例如，我们在第 6 章中在集群之上部署的所有各种组件，包括\
  \ Calico 网络插件、Longhorn 存储驱动程序和 metrics 服务器，都会与 API 服务器通信以观察和修改集群状态。为了支持这一点，Kubernetes\
  \ 会自动向每个运行中的容器中注入凭据。\n\n当然，出于安全考虑，仅为每个容器提供其所需的 API 服务器权限是非常重要的，因此我们应该为每个应用程序或集群组件创建一个独立的\
  \ `ServiceAccount` 来做到这一点。然后，这些 `ServiceAccount` 的信息会被添加到 `Deployment`或其他控制器中，这样\
  \ Kubernetes 就会注入正确的凭据。在某些情况下，我们可能会为单个应用程序使用多个 `ServiceAccount`，限制每个应用程序组件仅访问其所需的权限。\n\
  \n除了为每个应用程序或组件使用独立的 `ServiceAccount` 之外，为每个应用程序使用独立的 `Namespace` 也是一种良好的做法。正如我们即将看到的，权限可以限制在单个\
  \ `Namespace` 中。让我们从创建 `Namespace` 开始：\n\n```\nroot@host01:~# kubectl create namespace\
  \ sample\nnamespace/sample created\n```\n\n`ServiceAccount` 使用访问器令牌（bearer token），该令牌存储在\
  \ Kubernetes 创建 `ServiceAccount` 时自动生成的 `secret` 中。让我们为在本章中将创建的 `Deployment` 创建一个\
  \ `ServiceAccount`：\n\n`read-pods-sa.yaml`\n\n```\n---\napiVersion: v1\nkind: ServiceAccount\n\
  metadata:\n  name: read-pods\n  namespace: sample\n```\n\n注意，我们使用 `metadata` 将此\
  \ `ServiceAccount` 置于我们刚刚创建的 sample `Namespace` 中。我们也可以使用 `kubectl` 的 `-n` 标志来指定\
  \ `Namespace`。我们将使用常用的 `kubectl apply` 创建这个 `ServiceAccount`：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/read-pods-sa.yaml\nserviceaccount/read-pods created\n```\n\
  \n当 `ServiceAccount` 创建时，控制器管理器会检测到并自动创建一个带有凭据的 `Secret`：\n\n```\nroot@host01:~#\
  \ kubectl -n sample get serviceaccounts\nNAME        SECRETS   AGE\ndefault    \
  \ 1         27s\nread-pods   1         8s\nroot@host01:~# kubectl -n sample get\
  \ secrets\nNAME                    TYPE                                  DATA  \
  \ AGE\ndefault-token-mzwpt     kubernetes.io/service-account-token   3      43s\n\
  read-pods-token-m4scq   kubernetes.io/service-account-token   3      25s\n```\n\n\
  注意，除了我们刚刚创建的 `read-pods` `ServiceAccount` 外，已经有一个默认的 `ServiceAccount`。该账户是在创建 `Namespace`\
  \ 时自动创建的；如果我们没有指定 Kubernetes 为 `Pod` 使用哪个 `ServiceAccount`，将使用该账户。\n\n新创建的 `ServiceAccount`\
  \ 还没有任何权限。要开始添加权限，我们需要查看“基于角色的访问控制”（RBAC）。\n\n### 基于角色的访问控制\n\n在 API 服务器找到可以识别客户端的身份验证插件后，它将使用该身份来确定客户端是否有权限执行所需的操作，这是通过组装属于该用户的角色列表完成的。角色可以直接与用户关联，也可以与用户所属的组关联。组成员身份是身份的一部分。例如，客户端证书可以通过将组织字段作为证书主题的一部分，来指定用户的所属组。\n\
  \n#### 角色与集群角色\n\n每个角色都有一组权限。权限允许客户端在一种或多种类型的资源上执行一个或多个操作。\n\n作为一个示例，让我们定义一个允许客户端读取\
  \ Pod 状态权限的角色。我们有两个选择：可以创建一个 `Role` 或 `ClusterRole`。`Role` 在单个 `Namespace` 内可见并可用，而\
  \ `ClusterRole` 在所有 `Namespaces` 间均可见并可用。这种差异允许管理员在整个集群中定义常用角色，这些角色在创建新的 `Namespaces`\
  \ 时会立即可用，同时也允许对特定 `Namespace` 进行访问控制的委派。\n\n这里是 `ClusterRole` 的定义示例。该角色仅具有读取 Pod\
  \ 数据的能力，不能更改 Pod 或访问任何其他集群信息：\n\n`pod-reader.yaml`\n\n```\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRole\nmetadata:\n  name: pod-reader\nrules:\n- apiGroups: [\"\"]\n\
  \  resources: [\"pods\"]\n  verbs: [\"get\", \"watch\", \"list\"]\n```\n\n由于这是一个集群范围的角色，因此将它分配给某个\
  \ `Namespace` 是意义的，所以我们没有指定它。\n\n该定义的关键部分是规则列表。每个 `ClusterRole` 或 `Role` 都可以拥有任意数量规则。每个规则都有一个动词（verbs）列表，定义了允许哪些操作。在这种情况下，我们确定\
  \ `get`、`watch` 和 `list` 为动词，效果是该角色允许读取 Pod，但不允许任何修改它们的操作。\n\n每条规则根据确定的 `apiGroups`\
  \ 和 `resources` 组合适用于一个或多个资源类型。每条规则都为动词列表中列出的操作提供权限。在这种情况下，使用空字符串 `\"\"` 指代默认 API\
  \ 组，这也是 Pod 所在的位置。如果我们还想包含 Deployments 和 StatefulSets，我们需要如下定义规则：\n\n```\n- apiGroups:\
  \ [\"\", \"apps\"]\n  resources: [\"pods\", \"deployments\", \"statefulsets\"]\n\
  \  verbs: [\"get\", \"watch\", \"list\"]\n```\n\n我们需要在 `apiGroups` 字段中添加 `\"apps\"\
  `，因为 `Deployment` 和 `StatefulSet` 属于该组。当我们声明 `Role` 或 `ClusterRole` 时，API 服务器会接受\
  \ `apiGroups` 和 `resources` 字段中的任何字符串，无论该组合是否真实标识了资源类型，因此注意资源所属的组非常重要。\n\n让我们定义\
  \ pod-reader `ClusterRole`：\n\n```\nroot@host01:~# kubectl apply -f /opt/pod-reader.yaml\n\
  clusterrole.rbac.k8s.io/pod-reader created\n```\n\n现在 `ClusterRole` 已存在，我们可以应用它。为此我们需要创建一个角色绑定。\n\
  \n#### 角色绑定与集群角色绑定\n\n让我们将 `pod-reader` `ClusterRole` 应用到我们之前创建的 `read-pods` `ServiceAccount`。我们有两个选项：可以创建一个\
  \ `RoleBinding` 在特定的 `Namespace` 中分配权限，或者创建一个 `ClusterRoleBinding` 在所有 `Namespaces`\
  \ 间分配权限。此此功能是有益的，因为它意味着我们可以创建创建一个如 `pod-reader` 的 `ClusterRole` 并使其在整个集群可见，但在单个\
  \ `Namespace` 中创建绑定，从而用户和 `ServiceAccount` 被限制在它们被允许访问的 `Namespace` 中。这有助于我们应用之前看到的每个应用程序一个\
  \ `Namespace` 的模式，同时它也让非管理员远离 `kube-system` `Namespace` 中运行的关键基础设施组件。\n\n遵循这一做法，我们将创建一个\
  \ `RoleBinding`，使我们的 `ServiceAccount` 仅在 sample `Namespace` 中具有读取 Pod 的权限：\n\n`read-pods-bind.yaml`\n\
  \n```\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n\
  \  name: read-pods\n  namespace: sample\nsubjects:\n- kind: ServiceAccount\n  name:\
  \ read-pods\n  namespace: sample\nroleRef:\n  kind: ClusterRole\n  name: pod-reader\n\
  \  apiGroup: rbac.authorization.k8s.io\n```\n\n意料之中，`RoleBinding` 将 `Role` 或 `ClusterRole`\
  \ 与主体（subject）结合在一起。`RoleBinding` 可以包含多个 `subjects`，因此我们可以通过一个绑定将同一个角色绑定到多个用户或组。\n\
  \n\n\n我们在元数据和标识主体的地方都定义了 `Namespace`（命名空间）。在这种情况下，它们都是 `sample`，因为我们希望授予 `ServiceAccount`（服务账户）在它所属的\
  \ `Namespace` 中读取 Pod 状态的权限。然而，这些值可以是不同的，以便允许一个 `Namespace` 中的 `ServiceAccount`\
  \ 在另一个 `Namespace` 中拥有特定的权限。当然当然，我们也可以使用 `ClusterRoleBinding` 来跨所有 `Namespace` 分发权限。\n\
  \n现在，我们可以创建 `RoleBinding`（角色绑定）：\n\n```\nroot@host01:~# kubectl apply -f /opt/read-pods-bind.yaml\n\
  rolebinding.rbac.authorization.k8s.io/read-pods created\n```\n\n我们现在已经为 `read-pods`\
  \ `ServiceAccount` 授予了读取 `sample` `Namespace` 中 Pods 的权限。为了演示它是如何工作的，我们需要创建一个并被分配给\
  \ `read-pods` `ServiceAccount` 的 Pod。\n\n### 将 Service Account 分配给 Pod\n\n要将 `ServiceAccount`\
  \ 分配给 Pod，只需在 Pod 规范（spec）中添加 `serviceAccountName` 字段：\n\n`read-pods-deploy.yaml`\n\
  \n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: read-pods\n\
  \  namespace: sample\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n    \
  \  app: read-pods\n  template:\n    metadata:\n      labels:\n        app: read-pods\n\
  \    spec:\n      containers:\n      - name: read-pods\n        image: alpine\n\
  \        command: [\"/bin/sleep\", \"infinity\"]\n      serviceAccountName: read-pods\n\
  ```\n\n标识出的 `ServiceAccount` 必须存在于 Pod 所在的 `Namespace` 中。Kubernetes 会向 Pod 的容器注入\
  \ `Service-Account` 令牌（token），以便容器能够身份服务器进行身份验证。\n\n让我们通过一个示例来展示它是如何工作的，以及授权是如何应用的。首先创建这个\
  \ Deployment：\n\n```\nroot@host01:~# kubectl apply -f /opt/read-pods-deploy.yaml\n\
  deployment.apps/read-pods created\n```\n\n这创建了一个运行 sleep 的 Alpine 容器，我们可以将其作为 shell\
  \ 命令的基础。\n\n要进入 shell 提示符，我们首先获取生成的 Pod 名称，然后使用 `kubectl exec` 创建该 shell：\n\n```\n\
  root@host01:~# kubectl -n sample get pods\nNAME                        READY   STATUS\
  \    RESTARTS   AGE\nread-pods-9d5565548-fbwjb   1/1     Running   0          6s\n\
  root@host01:~# kubectl -n sample exec -ti read-pods-9d5565548-fbwjb -- /bin/sh\n\
  / #\n```\n\n`ServiceAccount` 令牌挂载在 `/run/secrets/kubernetes.io/serviceaccount` 目录下，因此切换到该目录并列出内容：\n\
  \n```\n/ # cd /run/secrets/kubernetes.io/serviceaccount\n/run/secrets/kubernetes.io/serviceaccount\
  \ # ls -l\ntotal 0\nlrwxrwxrwx    1 root     root  ...  ca.crt -> ..data/ca.crt\n\
  lrwxrwxrwx    1 root     root  ...  namespace -> ..data/namespace\nlrwxrwxrwx  \
  \  1 root     root  ...  token -> ..data/token\n```\n\n这些文件显示为奇奇怪的符号链接，但内容如预期那样存在。`ca.crt`\
  \ 文件是集群的根证书，信任到 API 服务器的连接需要它。\n\n我们将令牌保存到变量中以便后续使用：\n\n```\n/run/secrets/kubernetes.io/serviceaccount\
  \ # TOKEN=$(cat token)\n```\n\n我们现在可以使用 `curl` 使用此令牌连接到 API 服务器。不过，我们首先需要在 Alpine\
  \ 容器中安装 `curl`：\n\n```\ndefault/run/secrets/kubernetes.io/serviceaccount # apk add\
  \ curl\n...\nOK: 8 MiB in 19 packages\n```\n\n我们的 `ServiceAccount` 被允许对 Pods 执行\
  \ get、list 和 watch 操作。让我们列出 `sample` `Namespace` 中所有的 Pods：\n\n```\n/run/secrets/kubernetes.io/serviceaccount\
  \ # curl --cacert ca.crt \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  https://kubernetes.default.svc/api/v1/namespaces/sample/pods\n\
  \  \"kind\": \"PodList\",\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n    \"\
  resourceVersion\": \"566610\"\n  },\n  \"items\": [\n    {\n      \"metadata\":\
  \ {\n        \"name\": \"read-pods-9d5565548-fbwjb\",\n...\n  ]\n}\n```\n\n与引导令牌一样，我们使用\
  \ HTTP Bearer 身份验证将 `ServiceAccount` 令牌传递给 API 服务器。由于我们是在容器内部进行操作，可以使用标准地址 `kubernetes.default.svc`\
  \ 来寻找 API 服务器。这之所以能通，是因为 Kubernetes 集群始终在默认 `Namespace` 中有一个服务，使用我们在第 9 章看到的 Service\
  \ 网络将流量路由到 API 服务器实例上。\n\n`curl` 命令执行成功，是因为我们的 `ServiceAccount` 绑定到了我们创建的 pod-reader\
  \ `Role` 上。然而，`RoleBinding` 限于 `sample` `Namespace`，结果我们被允许在另一个 `Namespace` 中列出\
  \ Pods：\n\n```\n/run/secrets/kubernetes.io/serviceaccount # curl --cacert ca.crt\
  \ \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  https://kubernetes.default.svc/api/v1/namespaces/sample/pods\n\
  ```\n等等，让我重新检查逻辑。文本显示错误发生在不同的 namespace。让我们查看错误输出：\n\n```\n{\n  \"kind\": \"Status\"\
  ,\n  \"apiVersion\": \"v1\",\n  \"metadata\": {\n  },\n  \"status\": \"Failure\"\
  ,\n  \"message\": \"pods is forbidden: User \\\"serviceaccount:default:read-pods\\\
  \" cannot list resource\n    \\\"pods\\\" in API group \\\"\\\" in namespace \\\"\
  sample\\\"\",\n  \"reason\": \"Forbidden\",\n  \"details\": {\n    \"group\": \"\
  \",\n    \"kind\": \"pods\"\n  },\n  \"code\": 403\n}\n```\n\nURL 方案的不同（使用 `/apis/apps/v1`\
  \ 而不是 `/api/v1`）是因为 Deployments 属于 apps 组。该命令同样失败，因为我们没有列出 Deployments 的权限。\n\n\
  我们完成了这个 shell 会话，退出它：\n\n```\n/run/secrets/kubernetes.io/serviceaccount # exit\n\
  ```\n\n#### 将角色绑定到用户\n\n在离开 RBAC 主题之前，让我们说明一种在不允许任何管理员功能的情况下为 Namespace 授予普通用户权限的简单方法。\n\
  \n为了授予普通用户权限，我们将利用一个名为 `edit` 的现有 `ClusterRole`，它已经配置好为用户需要的大多数资源类型授予查看和编辑权限。\n\n\
  让我们快速查看 `edit` `Role` 具有哪些权限：\n\n```\nroot@host01:~# kubectl get clusterrole edit\
  \ -o yaml\n...\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\n...\n\
  rules:\n...\n- apiGroups:\n  - \"\"\n  resources:\n  - pods\n  - pods/attach\n \
  \ - pods/exec\n  - pods/portforward\n  - pods/proxy\n  verbs:\n  - create\n  - delete\n\
  \  - deletecollection\n  - patch\n  - update\n...\n```\n\n完整列表包含大量不同的规则，每个规则都有自己的权限集。示例中的子集仅显示了一条规则，用于提供对\
  \ Pod 的编辑权限。\n\n与 Pod 相关的某些命令（如 `exec`）单独列出，以便进行更细粒度的控制。例如，对于生产系统，允许某些人员创建和删除 Pod\
  \ 以及查看日志是很有用的，但不要提供使用 `exec` 的权限，因为那可能会被用于访问敏感生产数据。\n\n\n\n\n此前，我们创建了一个名为 `me` 的用户，并将客户端证书保存到名为\
  \ `kubeconfig` 的文件中。然而，我们尚未为该用户绑定任何角色，因此该用户仅拥有通过自动加入 `system:authenticated` 组而获得的非常有限的权限。\n\
  \n因此，正如我们之前看到的，我们的普通用户甚至无法在默认 `Namespace` 中列出 `Pods`。让我们将此用户绑定到 `edit` 角色。和之前，我们将使用一个普通的\
  \ `RoleBinding`，其范围限制在示例 `Namespace` 中，这样该用户将无法访问我们在 `kube-system` `Namespace` 中的集群基础设施组件。\n\
  \nListing 11-1 展示了我们需要的 `RoleBinding`。\n\n`edit-bind.yaml`\n\n```yaml\n---\napiVersion:\
  \ rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: editor\n \
  \ namespace: sample\nsubjects:\n- kind: User\n  name: me\n  apiGroup: rbac.authorization.k8s.io\n\
  roleRef:\n  kind: ClusterRole \n  name: edit\n  apiGroup: rbac.authorization.k8s.io\n\
  ```\n\n*Listing 11-1: 将 edit 角色绑定到用户*\n\n现在我们应用此 `RoleBinding` 来为我们的用户添加权限：\n\n\
  ```bash\nroot@host01:~# kubectl apply -f /opt/edit-bind.yaml\nrolebinding.rbac.authorization.k8s.io/editor\
  \ created\n```\n\n我们现在可以使用该用户来查看和修改 `Pods`、`Deployments` 以及许多其他资源：\n\n```bash\n\
  root@host01:~# KUBECONFIG=kubeconfig kubectl -n sample get pods\nNAME          \
  \              READY   STATUS    RESTARTS   AGE\nread-pods-9d5565548-fbwjb   1/1\
  \     Running   0          54m\nroot@host01:~# KUBECONFIG=kubeconfig kubectl delete\
  \ -f /opt/read-pods-deploy.yaml\ndeployment.apps \"read-pods\" deleted\n```\n\n\
  然而，由于我们使用的是 `RoleBinding` 而不是 `ClusterRoleBinding`，该用户对其他 `Namespaces` 没有可见见：\n\n\
  ```bash\nroot@host01:~# KUBECONFIG=kubeconfig kubectl get -n kube-system pods\n\
  Error from server (Forbidden): pods is forbidden: User \"me\" cannot list \n  resource\
  \ \"pods\" in API group \"\" in the namespace \"kube-system\"\n```\n\n`kubectl`\
  \ 显示的错误信息在形式上与 API server JSON 响应中的 `message` 字段完全相同。这并非巧合；`kubectl` 是 API server\
  \ REST API 前端的一个友好命令行界面。\n\n### 最后的结语\n\nAPI server 是 Kubernetes 控制平面中至关重要的组件。集群中的所有其他服务都会持续连接到\
  \ API server，监听集群的变化，以便采取适当的行动。用户也使用 API server 来部署和配置应用程序以及监控状态。在本章中，我们了解了 API\
  \ server 提供的用于创建、检索、更新和删除资源的底层 REST API。我们还看到了 API server 内置的强大的身份验证和授权功能，以确保只有经过授权的用户和服务才能访问和修改集群状态。\n\
  \n在接下一章中，我们将检查集群基础设施的另一侧：节点组件。我们将看到 `kubelet` 服务如何隐藏容器引擎之间的任何差异，以及它是如何利用我们在第一部分中看到的容器能力在集群中创建、启动和配置容器的。\n\
  \n# 12. 容器运行时\n\n![image](img/common01.jpg)\n\n在上一章，我们看到了控制平面如何管理和监控集群状态。然而，是容器运行时，特别是\
  \ `kubelet` 服务，通过创建、启动、停止和删除容器来真正使集群达到所需状态。在本章中，我们将探索 `kubelet` 在我们的集群中是如何配置的以及如何运行的。\n\
  \n作为此探索的一部分，我们将解决 `kubelet` 如何在托管控制面的同时依赖于它。最后，我们将查看 Kubernetes 集群中的节点维护，包括如何关闭节点进行维护、可能阻止节点正常工作的问题、如果节点突然不可用集群的行为如何，以及节点在丢失集群连接时的表现。\n\
  \n### 节点服务\n\n将普通主机转换为 Kubernetes 节点的主要服务是 `kubelet`。由于它对 Kubernetes 集群至关重要，我们将详细查看它的配置方式和行为。\n\
  \n#### CONTAINERD 和 CRI-O\n\n本章的示例提供了自动化脚本，用于使用两种容器运行时之一启动集群：`containerd` 和 `CRI-O`。我们将主要使用\
  \ `containerd` 安装版本，尽管我们会简要查看配置差异。`CRI-O` 集群是为了让你能够实验独立的容器运行时。它也说明了 `kubelet` 向集群其他部分隐藏了这种差异，因为集群的其他配置不受容器运行时更改的影响。\n\
  \n当我们在第 6 章中设置集群时，我们在所有节点上以软件包的形式安装了 `kubelet`，随后的每个章节自动化脚本一直在对其进行类似的设置。\n\n###\
  \ 注意事项\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。参见运行示例。\n\
  \n`kubelet` 软件包还包含一个系统服务，我们可以使用 `systemctl` 获取信息：\n\n```bash\nroot@host01:~# systemctl\
  \ status kubelet\n  kubelet.service - The Kubernetes Agent\n     Loaded: loaded\
  \ (/lib/systemd/system/kubelet.service; enabled;\n    Drop-In: /etc/systemd/system/kubelet.service.d\n\
  \     Active: active (running) since ...\n```\n\n`kubelet` 首次启动时，它还没有加入集群所需的配置。当我们运行\
  \ `kubeadm` 时，它创建了所示的 `kubelet.conf`。Listing 12-1 为我们提供了传递给 `kubelet` 服务的命令行。\n\n\
  ```bash\nroot@host01:~# strings /proc/$(pgrep kubelet)/cmdline\n/usr/bin/kubelet\n\
  --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf\n--kubeconfig=/etc/kubernetes/kubelet.conf\n\
  --config=/var/lib/kubelet/config.yaml\n--container-runtime=remote\n--container-runtime-endpoint=/run/containerd/containerd.sock\n\
  --node-ip=192.168.61.11\n--pod-infra-container-image=k8s.gcr.io/pause:3.4.1\n```\n\
  \n*Listing 12-1: Kubelet 命令行*\n\n`pgrep kubelet` 嵌入命令输出 `kubelet` 服务的进程 ID。然后我们使用它通过\
  \ `/proc` Linux 虚拟文件系统打印命令行。我们使用 `strings` 而不是 `cat` 来打印此文件，是因为每个独立的命令行参数都以空字符终止，而\
  \ `strings` 将其转换为良好的行的显示。\n\n`kubelet` 服务需要三组主要的配置：*集群配置*、*运行时配置*和*网络配置*。\n\n####\
  \ Kubelet 集群配置\n\n集群配置选项告诉 `kubelet` 如何与集群通信以及如何进行验证。当 `kubelet` 首次启动时，它使用 Listing\
  \ 12-1 所示的 `bootstrap-kubeconfig` 来查找集群、验证服务器证书并使用第 11 章中讨论的引导令牌进行身份验证。该引导令牌用于提交新节点的证书签名请求\
  \ (CSR)。随后，`kubelet` 从 API server 下载签名后的客户端证书并存储在 `/etc/kubernetes/kubelet.conf`\
  \ 中，这是 `kubeconfig` 选项指定的路径。此 `kubelet.conf` 文件遵循用于配置 `kubectl` 与 API server 通信的相同格式，正如我们在第\
  \ 11 章看到的的那样。在 `kubelet.conf` 写入后，引导文件将被删除。\n\n\n\n\n`/var/lib/kubelet/config.yaml`\
  \ 文件在列表 12-1 中指定，它包含了重要的配置信息。为了从 kubelet 拉取指标，我们需要为它配置单独的服务器证书，而不仅仅是客户端证书，并且我们需要配置它如何验证自己的客户端。以下是由\
  \ `kubeadm` 创建的相关配置文件内容：\n\n```\nroot@host01:~# cat /var/lib/kubelet/config.yaml\n\
  ...\nauthentication:\n  anonymous:\n    enabled: false\n  webhook:\n    cacheTTL:\
  \ 0s\n    enabled: true\n  x509:\n    clientCAFile: /etc/kubernetes/pki/ca.crt\n\
  ...\n```\n\n`authentication` 章节告诉 kubelet 不允许匿名请求，但允许 webhook 持者令牌（bearer tokens）以及任何由集群证书颁发机构签名的客户端证书。我们为指标服务器安装的\
  \ YAML 资源文件包含一个在 `Deployment` 中使用的 `ServiceAccount`，因此它会自动注入凭据，并可以使用这些凭据向 kubelet\
  \ 实例进行身份验证，正如我们在第 11 章中所看到的。\n\n### Kubelet 容器运行时配置\n\n容器运行时配置选项告诉 kubelet 如何连接到容器运行时，以便\
  \ kubelet 能够管理本地机器上的容器。由于 kubelet 期望运行时支持容器运行时接口（CRI）标准，只需要几个设置，如列表 12-1 所示。\n\n\
  第一个关键设置是 `container-runtime`，它可以设置为 `remote` 或 `docker`。Kubernetes 诞生于 Docker 引擎与\
  \ containerd 运行时分离之前，因此它对 Docker 有遗留支持，使用一个 `shim` 来仿真标准的 CRI 接口。由于我们是直接使用 `containerd`\
  \ 而不是通过 Docker shim 或 Docker 引擎，因此将其设置为 `remote`。\n\n接下来，我们使用 `container-runtime-endpoint`\
  \ 设置指定容器运行时的路径。在这种情况下，该值为 `/run/containerd/containerd.sock`。kubelet 连接到此 Unix 套接字以发送\
  \ CRI 请求并接收状态。\n\n`container-runtime-endpoint` 命令行设置是切换集群在 containerd 和 CRI-O 之间所需的唯一区别。此外，`kubeadm`\
  \ 在节点初始化时会自动检测到它，因此自动化脚本中的唯一区别是在安装 Kubernetes 之前安装 CRI-O 而不是 containerd。如果我们查看我们\
  \ CRI-O 集群中 kubelet 的命令行，，会发现命令行选项中只有一个处变化：\n\n```\nroot@host01:~# strings /proc/$(pgrep\
  \ kubelet)/cmdline\n...\n--container-runtime-endpoint=/var/run/crio/crio.sock\n\
  ...\n```\n\n其余命令行选项与我们的 containerd 集群完全相同。\n\n最后，我们还有一个与容器运行时相关的设置：`pod-infra-container-image`。它指定了\
  \ Pod 基础设施镜像。我们在第 2 章中见过这个镜像，它的形式是一个 pause（暂停）进程，该进程是为容器创建的 Linux 命名空间的所有者。在这种情况下，这个\
  \ pause 进程将来自容器镜像 `k8s.gcr.io/pause:3.4.1`。\n\n拥有一个独立的容器来拥有 Pod 中容器之间共享的命名空间是非常方便的。因为\
  \ pause 进程实际上什么都不做，它非常可靠且不太可能崩溃，所以即使 Pod 中的其他容器意外终止，它也可以继续拥有这些共享命名空间。\n\npause 镜像大小约为\
  \ 300kb，正如我们在其中一个节点上运行 `crictl` 看到的：\n\n```\nroot@host01:~# crictl images\nIMAGE\
  \             TAG                 IMAGE ID            SIZE\n,,,\nk8s.gcr.io/pause\
  \  3.4.1               0f8457a4c2eca       301kB\n...\n```\n\n此外，pause 进程几乎不消耗 CPU，因此每个\
  \ Pod 增加一个额外进程对我们节点的影响微乎其微。\n\n### Kubelet 网络配置\n\n网络配置帮助 kubelet 集成到集群中，并将 Pod\
  \ 集成到整个集群网络。正如我们在第 8 章所示，实际的 Pod 网络设置是由网络插件执行的，但 kubelet 也扮演着几个重要角色。\n\n我们的 kubelet\
  \ 命令行包含一个与网络配置相关的选项：`node-ip`。这是一个可选标记，如果不存在，kubelet 将尝试确定它应该使用的与 API server 通信的\
  \ IP 地址。然而，直接指定该标记是有用的，因为它保证了我们的集群在节点具有多个网络接口的情况下（例如本书示例中的 Vagrant 配置，使用单独的内部网络进行集群通信）正常工作。\n\
  \n除了这个命令行选项外，`kubeadm` 在 `/var/lib/kubelet/config.yaml` 中放置了两个网络设置：\n\n```\nroot@host01:~#\
  \ cat /var/lib/kubelet/config.yaml\n...\nclusterDNS:\n- 10.96.0.10\nclusterDomain:\
  \ cluster.local\n...\n```\n\n这些设置用于为所有容器提供 `/etc/resolv.conf` 文件。`clusterDNS` 条目提供了此\
  \ DNS 服务器的 IP 地址，而 `clusterDomain` 条目提供了默认的搜索域，以便我们区分不同的主机。\n\n\n\n\n如果我们查看 `/etc/kubernetes/manifests`，会看到许多\
  \ YAML 文件。这些文件是由 `kubeadm` 放置的，定义了运行该节点控制平面组件所需的 `Pods`：\n\n```bash\nroot@host01:~#\
  \ ls -1 /etc/kubernetes/manifests\netcd.yaml\nkube-apiserver.yaml\nkube-controller-manager.yaml\n\
  kube-scheduler.yaml\n```\n\n正如预期的那样，我们看到了第 11 章中讨论的三个核心控制平面服务中每一个服务对应的 YAML 文件。我们还看到了\
  \ `etcd` 的 Pod 定义，它是存储集群状态并帮助为我们的高可用集群选举领导者的组件。我们将在第 16 章中详细查看 `etcd`。\n\n这些文件中的每一个都包含一个与之前看到的类似的\
  \ `Pod` 定义：\n\n```bash\nroot@host01:~# cat /etc/kubernetes/manifests/kube-apiserver.yaml\
  \ \napiVersion: v1\nkind: Pod\nmetadata:\n...\n  name: kube-apiserver\n  namespace:\
  \ kube-system\nspec:\n  containers:\n  - command:\n    - kube-apiserver\n...\n```\n\
  \n`kubelet` 服务持续监控此目录的任何更改，并相应更新对应的静态 `Pod`，这使得 `kubeadm` 能够以滚动的方式升级集群控制平面而无需任何停机。\n\
  \n像 `Calico` 和 `Longhorn` 这样的集群插件也可以通过此目录运行，但它们使用 `DaemonSet` 来让集群在每个节点上运行一个 `Pod`。这是合理的，因为\
  \ `DaemonSet` 可以对整个集群进行一次管理，从而保证所有节点配置的一致。\n\n这个静态 Pod 目录在我们的三个控制平面节点（`host01` 到\
  \ `host03`）上与我们的“普通”节点 `host04` 不同。为了让 `host04` 成为一个普通节点，`kubeadm` 从 `/etc/kubernetes/manifests`\
  \ 中省略了控制平面的静态 `Pod` 文件：\n\n```bash\nroot@host04:~# ls -1 /etc/kubernetes/manifests\n\
  root@host04:~#\n```\n\n注意，该命令是在我们集群中唯一的普通节点 `host04` 上运行的。\n\n### 节点维护\n\n控制平面的\
  \ `controller manager` 组件持续监控节点，以确保它们保持连接且健康。`kubelet` 服务负责报告节点信息，包括节点内存占用、磁盘占用以及与底层容器运行时的连接情况。如果节点变得不健康，控制平面将把\
  \ `Pods` 转移到其他节点，以维持 `Deployments` 请求的规模，并在节点恢复健康之前，不会在该节点上调度任何新的 `Pods`。\n\n###\
  \ 节点驱空与隔离（Draining and Cordoning）\n\n如果我们知道需要对节点进行维护（例如重启），我们可以告诉集群将 `Pods` 从该节点转移出去，并将节点标记为不可调度。我们使用\
  \ `kubectl drain` 命令来实现此操作。\n\n为了查看示例，让我们创建一个包含八个 `Pods` 的 `Deployment`，这可能让我们的每个节点都获得一个\
  \ `Pod`：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/deploy.yaml \ndeployment.apps/debug\
  \ created\n```\n\n如果我们留出足够的启动时间，可以看到 `Pods` 分布在各个节点上：\n\n```bash\nroot@host01:~#\
  \ kubectl get pods -o wide\nNAME                     READY   STATUS    ... NODE\
  \   ...\ndebug-8677494fdd-7znxn   1/1     Running   ... host02 ...  \ndebug-8677494fdd-9dgvd\
  \   1/1     Running   ... host03 ...  \ndebug-8677494fdd-11-hv6mt   1/1     Running\
  \   ... host04 ...  \ndebug-8677494fdd-1ntqjp   1/1     Running   ... host02 ...\
  \  \ndebug-8677494fdd-1pfw5n   1/1     Running   ... host03 ...  \ndebug-8677494fdd-1qbhmn\
  \   1/1     Running   ... host02 ...  \ndebug-8677494fdd-1qp9zv   1/1     Running\
  \   ... host03 ...  \ndebug-8677494fdd-1xt8dm   1/1     Running   ... host03 ...\n\
  ```\n\n为了最小化测试集群的大小，我们的普通节点 `host04` 在资源方面是较小的，因此在示例中它只获得了一个 ` Pod`。但这足够让我们看到关闭节点时会发生什么。这个过程具有某种程度上随机性，所以如果你没有看到任何\
  \ `Pods` 分配到 `host04`，你可以删除该 `Deployment` 并重试，或者先将其缩容再重新扩容，正如我们在下一个示例中做的那样。\n\n\
  要关闭节点，我们使用 `kubectl drain` 命令：\n\n```bash\nroot@host01:~# kubectl drain --ignore-daemonsets\
  \ host04\nnode/host04 cordoned\nWARNING: ignoring DaemonSet-managed Pods: ...\n\
  ...\npod/debug-8677494fdd-hv6mt evicted\nnode/host04 evicted\n```\n\n我们需要提供 `--ignore-daemonsets`\
  \ 选项，因为我们所有的节点都有 `Calico` 和 `Longhorn` `DaemonSets`，当然，这些 `Pods` 无法转移到其他节点。\n\n\
  驱逐需要一些时间。完成后，可以看到 `Pods` 分布在各个节点上：\n\n```bash\nroot@host01:~# kubectl get pods -o\
  \ wide\nNAME                     READY   STATUS    ... NODE   ...\ndebug-8677494fdd-7znxn\
  \   1/1     Running   ... host02 ...  \ndebug-8677494fdd-9dgvd   1/1     Running\
  \   ... host03 ...  \ndebug-8677494fdd-hv6mt   1/1     Running   ... host04 ...\
  \  \ndebug-8677494fdd-ntqjp   1/1     Running   ... host02 ...  \ndebug-8677494fdd-pfw5n\
  \   1/1     Running   ... host03 ...  \ndebug-8677494fdd-qbhmn   1/1     Running\
  \   ... host02 ...  \ndebug-8677494fdd-qp9zv   1/1     Running   ... host03 ...\
  \  \ndebug-8677494fdd-xt8dm   1/1     Running   ... host03 ...\n```\n\n### 不健康节点\n\
  \n如果节点因为资源限制（如内存或磁盘空间不足）而变得不健康，Kubernetes 也会自动转移节点 `Pods`。让我们在 `host04` 上模拟低内存状态，以便我们观察其实操作。\n\
  \n\n\n\n\n```\nroot@host01:~# kubectl top nodes\nNAME     CPU(cores)   CPU%   MEMORY(bytes)\
  \   MEMORY%   \nhost01   503m         25%    1239Mi          65%       \nhost02\
  \   518m         25%    1346Mi          71%       \nhost03   534m         26%  \
  \  1382Mi          73%       \nhost04   288m         14%    542Mi           29%\n\
  ```\n\n我们在 `host04` 上总共有 2GB 内存，目前我们使用了超过 500MiB。默认情况下，当剩余内存少于 100MiB 时，`kubelet`\
  \ 会驱逐 Pods。我们可以尝试耗尽节点上的内存以使其低于该默认阈值，但这样做是有风险的，因为消耗这么多内存可能会导致节点行为异常。相反，让我们更新驱逐限制。为了做到这一点，我们将向\
  \ `/var/lib/kubelet/config.yaml` 添加配置行，然后重启 `kubelet`。\n\n这是我们要添加到 kubelet 配置文件中的额外配置：\n\
  \n`node-evict.yaml`\n\n```\nevictionHard:\n  memory.available: \"1900Mi\"\n```\n\
  \n这告诉 `kubelet` 如果可用内存少于 1,900MiB，则开始驱逐 Pods。对于我们示例集群中的节点，这种情况将立即发生。让我们应用此更改：\n\n\
  ```\nroot@host04:~# cat /opt/node-evict.yaml >> /var/lib/kubelet/config.yaml\nroot@host04:~#\
  \ systemctl restart kubelet\n```\n\n请确保在 `host04` 上运行这些命令。第一条命令向 kubelet 配置文件添加额外的行。第二条命令重启\
  \ `kubelet` 以使其获取更改。\n\n如果我们检查 `host04` 的节点状态，它看起来仍然处于就绪状态：\n\n```\nroot@host01:~#\
  \ kubectl get nodes\nNAME     STATUS   ROLES        ...\nhost01   Ready    control-plane...\n\
  host02   Ready    control-plane...\nhost03   Ready    control-plane...\nhost04 \
  \  Ready    <none>       ...\n```\n\n然而，节点的事件日志清楚地说明了发生了什么：\n\n```\nroot@host01:~#\
  \ kubectl describe node host04\nName:               host04\n...\n  Normal   NodeHasInsufficientMemory\
  \  6m31s                ...\n  Warning  EvictionThresholdMet       7s (x14 over\
  \ 6m39s)  ...\n```\n\n节点开始驱逐 Pods，集群根据需要自动在其他节点上创建新的 Pods，以保持所需的规模：\n\n```\nroot@host01:~#\
  \ kubectl get pods -o wide\nNAME                     READY   STATUS        ... NODE\
  \     ...\ndebug-8677494fdd-4274k   1/1     Running       ... host01   ...\ndebug-8677494fdd-4pnzb\
  \   1/1     Running       ... host01   ...\ndebug-8677494fdd-5nw6n   1/1     Running\
  \       ... host01   ...\ndebug-8677494fdd-7kbp8   1/1     Running       ... host03\
  \   ...\ndebug-8677494fdd-dsnp5   1/1     Running       ... host03   ...\ndebug-8677494fdd-hgdbc\
  \   1/1     Running       ... host01   ...\ndebug-8677494fdd-j7cth   1/1     Running\
  \       ... host04   ...\ndebug-8677494fdd-jlj4v   0/1     OutOfmemory   ... host04\
  \   ...\ndebug-8677494fdd-lft7h   1/1     Running       ... host01   ...\ndebug-8677494fdd-mnk6r\
  \   1/1     Running       ... host01   ...\ndebug-8677494fdd-pc8q8   1/1     Running\
  \       ... host01   ...\ndebug-8677494fdd-sr2kw   0/1     OutOfmemory   ... host04\
  \   ...\ndebug-8677494fdd-tgpb2   1/1     Running       ... host03   ... evendebug-8677494fdd-vnjks\
  \   0/1     OutOfmemory   ... host04   ...\ndebug-8677494fdd-xn8t8   1/1     Running\
  \       ... host02   ...\n```\n\n分配到 `host04` 的 Pods 显示为 `OutOfMemory`，它们已被其他节点上的\
  \ Pods 替换。Pods 在节点上停止了，但与之前我们驱空（drain）节点的情况不同，这些 Pods 不会被自动终止。即使节点从低内存状况中恢复，这些 Pods\
  \ 将继续出现在 Pod 列表中，卡在 `OutOfMemory` 状态，直到 `kubelet` 重启。\n\n### 节点不可达\n\n我们还有一种种情况需要查看。在我们之前的两个例子中，`kubelet`\
  \ 可以与控制面通信以更新其状态，允许控制面采取行动。但如果发生网络问题或突然断电，导致节点无法连接集群并报告其正在关闭，会发生什么？在这种情况下，集群会将节点状态记录为\
  \ unknown，并在超时后将 Pods 迁移到其他节点。让我们模拟这种情况。我们将开始恢复 `host04` 正常工作：\n\n```\nroot@host04:~#\
  \ sed -i '/^evictionHard:/+d' /var/lib/kubelet/config.yaml\nroot@host04:~# systemctl\
  \ restart kubelet\n```\n\n请确保在 `host04` 上运行这些命令。第一条命令删除了我们添加到 kubelet 配置的行，而第二条命令重启\
  \ `kubelet` 以获取更改。现在我们可以重新调整 Deployment：\n\n```\nroot@host01:~# scale debug --replicas=1\n\
  root@host01:~# scale debug\n```\n\n在运行运行这些命令之前，等待几分钟让 Pods 稳定。然后使用 `kubectl get\
  \ pods -o wide` 验证至少有一个 Pod 分配到了 `host04`。我们现在准备强制断开 `host04` 连接。我们将通过添加防火墙规则来实现：\n\
  \n```\nroot@host04:~# iptables -I INPUT 192.168.61.10 -j DROP\nroot@host04:~# iptables\
  \ -I OUTPUT 192.168.61.10 -j DROP\n```\n\n请确保在 `host04` 上运行此操作。第一条命令告诉防火墙丢弃来自 `192.168.61.10`\
  \ 的所有流量，这是所有节点共享的 IP。第二条命令告诉防火墙丢弃指向该 IP 的所有流量。大约分钟后，`host04` 将显示为 `NotReady`：\n\n\
  ```\nroot@host01:~# kubectl get nodes\nNAME     STATUS     ROLES        ...\nhost01\
  \   Ready    control-plane...\nhost02   Ready    control-plane...\nhost03   Ready\
  \    control-plane...\nhost04   NotReady   <none>\n```\n\n如果我们等待几分钟，`host04` 上的\
  \ Pods 将显示为 `Terminating`，因为集群放弃了这些 Pod 并将其迁移到其他节点：\n\n```\nroot@host01:~# kubectl\
  \ get pods -o wide\nNAME                     READY   STATUS        ... NODE    \
  \ ...\ndebug-8677494fdd-2wrn2   1/1     Running       ... host01   ...\ndebug-8677494fdd-4lz48\
  \   1/1     Running       ... host02   ...\ndebug-8677494fdd-78874   1/1     Running\
  \       ... host01   ...\ndebug-8677494fdd-7f8fw   1/1     Running       ... host01\
  \   ...\ndebug-8677494fdd-9vb5m   1/1     Running       ... host03   ...\ndebug-8677494fdd-b7vj6\
  \   1/1     Running       ... host03   ...\ndebug-8677494fdd-c2c4v   1/1     Terminating\
  \   ... host04   ...\ndebug-8677494fdd-c8tzv   1/1     Running       ... host03\
  \   ...\ndebug-8677494fdd-d2r6b   1/1     Terminating   ... host04   ...\ndebug-8677494fdd-d5t6b\
  \   1/1     Running       ... host01   ...\ndebug-8677494fdd-j7cth   1/1     Terminating\
  \   ... host04   ...\ndebug-8677494fdd-jjfsl   1/1     Terminating   ... host04\
  \   ...\ndebug-8677494fdd-nqb8z   1/1     Running       ... host03   ...\ndebug-8677494fdd-sskd5\
  \   1/1     Running       ... host02   ...\ndebug-8677494fdd-wz6c6   1/1     Terminating\
  \   ... host04   ...\ndebug-8677494fdd-x5b4w   1/1     Running       ... host02\
  \   ...\ndebug-8677494fdd-zfbml   1/1     Running       ... host01   ...\n```\n\n\
  然而，由于 `host04` 上的 `kubelet` 无法连接到控制面，它不知道应该关闭其 Pods。如果我们检查 `host04` 上运行着哪些容器，我们仍然看到多个容器：\n\
  \n```\nroot@host04:~# crictl ps\nCONTAINER           IMAGE          ...  STATE \
  \     NAME  ...\n2129a1cb00607       16ea53ea7c652  ...  Running    debug ...\n\
  cfd7fd6142321       16ea53ea7c652  ...  Running    debug ...\n0289ffa5c816d    \
  \   16ea53ea7c652  ...  Running    debug ...\nfb2d297d11efb       16ea53ea7c652\
  \  ...  Running    debug ...\n```\n\n\n\n\n不仅 `Pods` 仍在运行，而且由于我们切断连接的方式，它们仍然能够与集群其余部分进行通信。这非常重要。Kubernetes\
  \ 会尽力运行请求数量的实例并对错误做出响应，但它只能根据其掌握的信息来此。在这种情况下，由于 `host04` 上的 `kubelet` 无法与控制面通信，Kubernetes\
  \ 无法得知 `Pods` 仍在运行。在为像 Kubernetes 集群这样的分布式系统构建应用程序时，你应该意识到某些类型的错误可能会产生意想不到的结果，例如部分网络连通，或实例数量与指定的数量不符。在包含滚动更新的更高级的应用架构中，这甚至会导致旧版本的应用程序组件在无预期的情况下继续运行。请务必构建在面对此类意之外行为时具有韧性的应用程序。\n\
  \n### 结语\n\n根而言，要拥有一个 Kubernetes 集群，我们需要能够运行容器的节点，这意味着需要连接到控制面和容器运行时的 `kubelet`\
  \ 实例。在本章中，我们检查了如何配置 `kubelet`，以及当节点由于意图或故障离开或加入集群时集群的行为。\n\n本章的核心主题之一是 Kubernetes\
  \ 在面对节点问题时采取的操作以保持指定数量的 `Pods` 运行。在下一中，我们将看到监控如何扩展到容器内部的进程，确保进程按预期运行。我们将看到如何指定探针以允许\
  \ Kubernetes 监控容器，以及当容器变得不健康时集群如何响应。\n\n## 13 健康探针\n\n![image](img/common01.jpg)\n\
  \n拥有一个可靠的应用程序不仅仅是保持应用程序组件运行。应用程序组件还需要能够及时响应请求，并从依赖项获取数据以及向依赖项发送请求。这意味着“健康”应用程序组件的定义对于每个单独组件都是不同的。\n\
  \n同时，Kubernetes 需要知道 `Pod` 及其容器何时是健康的，以便它能够只将流量路由到健康的容器并替换失败的容器。由于如此，Kubernetes\
  \ 允许对容器配置自定义健康检查，并将这些健康检查集成到如 `Deployment` 等工作负载资源的管理中。\n\n在本章中，我们将查看如何为应用程序定义健康探针。我们将查看基于网络的健康探针和容器内部的探针。我们将看到\
  \ Kubernetes 如何运行这些健康探针，以及当容器变得不健康时它如何响应。\n\n### 关于探针\n\nKubernetes 支持三种类型的探针：\n\
  \n- **Exec（执行）**：运行命令或脚本来检查容器。\n- **TCP**：确定套字是否打开。\n- **HTTP**：验证 HTTP `GET` 请求是否成功。\n\
  \n此外，我们可以将这三种类型探针的任何一种用于三种不同的用途：\n\n- **Liveness（存活）**：检测并重启失败的容器。\n- **Startup（启动）**：在开始执行存活探针之前提供额外时间。\n\
  - **Readiness（就绪）**：避免在容器未准备就绪时向其发送流量。\n\n在这三个用途中，最重要的是存活探针，因为它在容器的主生命周期期间运行，可能会导致容器重启。我们将仔细研究存活探针，并利用这些知识理解如何使用启动探针和就绪探针。\n\
  \n### 存活探针 (Liveness Probes)\n\n`liveness` 探针在容器启动后持续运行。存活探针作为容器定义的一部分创建，未能通过存活探针的容器将自动重启。\n\
  \n#### 执行探针 (Exec Probes)\n\n让我们从一个在容器内部运行命令的简单存活探针开始。Kubernetes 期望命令在超时之前完成并返回零以表示成功，或返回非零代码表示存在问题。\n\
  \n**注意**\n\n本书的示例仓库位于 `https://github.com/book-of-kubernetes/examples`。设置详情请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2) 的“运行示例”。\n\n让我们用一个 NGINX Web 服务器容器来说明这一点。我们将使用这个\
  \ `Deployment` 定义：\n\n*nginx-exec.yaml*\n\n```yaml\nkind: Deployment\napiVersion:\
  \ apps/v1\nmetadata:\n  name: nginx\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
  \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n      - name: nginx\n        image: nginx\n     \
  \   livenessProbe:\n          exec:\n            command: [\"/usr/bin/curl\", \"\
  -fq\", \"http://localhost\"]\n          initialDelaySeconds: 10\n          periodSeconds:\
  \ 5\n```\n\n`livenessProbe` 的 `exec` 部分告诉 Kubernetes 在容器内部运行命令。在这种情况下，使用 `curl`\
  \ 配合 `-q` 标志，这样它就不会打印页面内容，而是在成功时返回零退出码。此外，`-f` 标志会导致 `curl` 对任何 HTTP 错误响应返回非零退出码（即任何\
  \ 300 或以上的响应码）。\n\n`curl` 命令根据 `periodSeconds` 每 5 秒运行一次；它根据 `initialDelaySeconds`\
  \ 在容器启动 10 秒后开始运行。\n\n本章的自动化脚本将将 `nginx-exec.yaml` 文件添加到 `/opt`。按照通常操作创建此 Deployment：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/nginx-exec.yaml \ndeployment.apps/nginx\
  \ created\n```\n\n生成的 `Pod` 状态与没有设置探针的 `Pod` 没有什么区别：\n\n```bash\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS    RESTARTS   AGE\n\
  nginx-68dc584f-jq5xl   1/1     Running   0          25s\n```\n\n然而，除了常规 NGINX 服务进程外，`curl`\
  \ 每 5 秒会在容器内运行一次，验证了可以连接服务器。`kubectl describe` 的详细输出显示了此配置：\n\n```bash\nroot@host01:~#\
  \ kubectl describe deployment nginx\nName:                   nginx\nNamespace: \
  \             default\n...\nPod Template:\n  Labels:  app=nginx\n  Containers:\n\
  \   nginx:\n...\n    Liveness:     exec [/usr/bin/curl -q http://localhost] delay=10s\
  \ \n    timeout=1s period=5s #success=1 #failure=3\n...\n```\n\n由于定义了存活探针，Pod 显示\
  \ Running 状态且没有重启表明检查是成功的。`#success` 显示成功一次即可认为容器存活，而 `#failure` 显示三次连续失败将导致 Pod\
  \ 重启。\n\n我们使用了 `-q` 来丢弃 `curl` 的日志，但即使没有该标志，任何存活探针的日志都会被丢弃。如果我们想保存探针的持续日志，我们需要将其发送到文件或使用日志库将其传输到网络。\n\
  \n在进入其他类型的探针之前，让我们看看如果存活探针失败会发生什么。我们将补丁 `curl` 命令以尝试检索服务器上不存在的路径，这将 `curl` 返回非零退出码，因此我们的探针将失败。\n\
  \n我们在第 9 章 编辑 `Service` 类型时使用了补丁文件。我们在这里再次执行此操作：\n\n*nginx-404.yaml*\n\n```yaml\n\
  ---\nspec:\n  template:\n    spec:\n      containers:\n     - name: nginx\n    \
  \      livenessProbe:\n            exec:\n              command: [\"/usr/bin/curl\"\
  , \"-fq\", \"http://localhost/missing\"]\n```\n\n\n\n\n虽然补丁文件（patch file）允许我们只更新关心的特定字段，在这种情况下，补丁文件包含几行，因为我们需要指定完整的层次结构，而且我们必须指定想要修改的容器名称\
  \ ➊，因此 Kubernetes 将将此内容合并到该容器的现有定义中。\n\n要补丁 `Deployment`，请使用 `kubectl patch` 命令：\n\
  \n```bash\nroot@host01:~# kubectl patch deploy nginx --patch-file /opt/nginx-404.yaml\
  \ \ndeployment.apps/nginx patched\n```\n\n由于我们更改了 `Deployment` 内部的 `Pod` 配置，Kubernetes\
  \ 需要终止旧的 `Pod` 并创建一个新的 `Pod`：\n\n```bash\nroot@host01:~# kubectl get pods\nNAME\
  \                     READY   STATUS        RESTARTS   AGE\nnginx-679f866f5b-7lzsb\
  \   1/1     Terminating   0          2m28s\nnginx-6cb4b995cd-6jpdpd   1/1     Running\
  \       0          3s\n```\n\n最初，新的 `Pod` 显示状态为 `Running`。然而，如果我们在大约 30 秒后再次检查，就会发现\
  \ `Pod` 有问题：\n\n```bash\nroot@host01:~# kubectl get pods\nNAME                 \
  \    READY   STATUS    RESTARTS   AGE\nnginx-6cb4b995cd-6jpdpd   1/1     Running\
  \   1          28s\n```\n\n我们没有更改 `liveness probe`（存活探针）的初始延迟或执行周期，因此第一次探测在 10 秒后开始，并且探测每\
  \ 5 秒运行一次。需要三次失败才会触发重启，所以看到在过去 25 秒后出现一次重启并不意外奇。\n\n`Pod` 的事件日志（event log）指示了重启的原因：\n\
  \n```bash\nroot@host01:~# kubectl describe pod\nName:         nginx-6cb4b995cd-6jpdpd\n\
  ...\nContainers:\n  nginx:\n...\n    Last State:     Terminated\n...\nEvents:\n\
  \  Type     Reason     Age                From     Message\n  ----     ------  \
  \   ----               ----     -------\n...\n  Warning  Unhealthy  20s (x9 over\
  \ 80s)  kubelet  Liveness probe failed: ...\ncurl: (22) The requested URL returned\
  \ error: 404 Not Found\n...\n```\n\n事件日志贴心地提供了来自 `curl` 的输出，告诉我们 `liveness probe`\
  \ 失败的原因。Kubernetes 将继续每 25 秒重启一次容器，因为每个新容器在启动运行后都会连续失败三次 `liveness probe`。\n\n###\
  \ HTTP 探针\n\n在容器内运行命令以检查健康状态允许我们执行自定义探测。然而，对于像这里这样的 Web 服务器，我们可以利用 Kubernetes 内部的\
  \ `HTTP probe` 能力，避免在容器镜像中使用 `curl`，并从 `Pod` 外部验证连接性。\n\n让我们用一个使用 `HTTP probe` 的新配置替换我们的\
  \ NGINX `Deployment`：\n\n`nginx-http.yaml`\n\n```yaml\n---\nkind: Deployment\napiVersion:\
  \ apps/v1\nmetadata:\n  name: nginx\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
  \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n      - name: nginx\n        image: nginx\n     \
  \   livenessProbe:\n          httpGet:\n            path: /\n            port: 80\n\
  ```\n\n通过此配置，我们告诉 Kubernetes 连接到我们 `Pod` 的 80 端口并在 `/*` 根路径上执行 `HTTP GET`。由于我们的\
  \ NGINX 服务器正在监听 80 端口并会为根路径提供欢迎文件，我们可以预计它可以正常工作。\n\n我们指定了整个 `Deployment` 而不是使用补丁，因此我们将使用\
  \ `kubectl apply` 来更新 `Deployment`：\n\n```bash\nroot@host01:~# kubectl apply -f\
  \ /opt/nginx-http.yaml \ndeployment.apps/nginx configured\n```\n\n我们也可以使用补丁来此此更改，但这次会更复杂，因为补丁文件是合并到现有配置中的。结果是我们需要两个命令：一个用于删除现有的\
  \ `liveness probe`，另一个用于添加新的 `HTTP liveness probe`。最好直接替换整个资源。\n\n**注意**\n\n`kubectl\
  \ patch` 命令是一个非常有用的调试命令，但生产环境应用应该将 YAML 资源文件放在版本控制下，以便进行更改跟踪和同行评审，并且每次都应该始终应用整个文件，以确保集群反映仓库的当前内容。\n\
  \n现在我们已经应用了新的 `Deployment` 配置，Kubernetes 将创建一个新的 `Pod`：\n\n```bash\nroot@host01:~#\
  \ kubectl get pods\nNAME                    READY   STATUS    RESTARTS   AGE\nnginx-d75d4d675-wvhxl\
  \   1/1     Running   0          2m38s\n```\n\n对于 `HTTP probe`，`kubelet` 负责在适当的时间调度运行\
  \ `HTTP GET` 请求并确认结果。默认情况下，任何 200 或 300 系列的 HTTP 码都被视为成功响应。\n\nNGINX 服务器记录了所有的请求，因此我们可以使用容器日志来查看正在进行的探测：\n\
  \n```bash\nroot@host01:~# kubectl logs nginx-d75d4d675-wvhxl\n... 22:31 \"GET /\
  \ HTTP/1.1\" 200 kube-probe/1\n```\n\n### TCP 探针\n\n像 PostgreSQL 这样的数据库监听连接，但并不使用\
  \ HTTP。我们仍然可以使用 `TCP` 为这些容器创建探测。\n\n这里是带有 TCP 探测的 `Deployment`：\n\n`postgres-tcp.yaml`\n\
  \n```yaml\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: postgres\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: postgres\n  template:\n\
  \    metadata:\n      labels:\n        app: postgres\n    spec:\n      containers:\n\
  \      - name: postgres\n        image: postgres\n        env:\n        - name:\
  \ POSTGRES_PASSWORD\n          value: supersecret\n        livenessProbe:\n    \
  \      tcpSocket:\n            port: 5432\n```\n\n我们在第 10 章见过 `POSTGRES_PASSWORD`\
  \ 环境变量。此示例中唯一的更改是 `livenessProbe`。我们指定了 `5432` 作为 `tcpSocket`，这是 PostgreSQL 的标准端口。\n\
  \n像常一样，我们可以创建此 `Deployment` 并在一段时间后观察它的运行：\n\n```bash\nroot@host01:~# kubectl apply\
  \ -f /opt/postgres-tcp.yaml \ndeployment.apps/postgres created\n...\nroot@host01:~#\
  \ kubectl get pods\nNAME                       READY   STATUS    RESTARTS   AGE\n\
  postgres-5566ff748-jqp5d   1/1     Running   0          29s\n```\n\n再次，执行探测的任务是\
  \ `kubelet`。它仅通过建立 TCP 连接然后断开来实现。PostgreSQL 在此发生时不会产生任何日志，因此我们知道探测正在工作的唯一方法是检查容器是否继续运行且没有重启：\n\
  \n```bash\nroot@host01:~# kubectl get pods\nNAME                       READY   STATUS\
  \    RESTARTS   AGE\npostgres-5566ff748-jqp5d   1/1     Running   0          2m7s\n\
  ```\n\n在继续之前，让我们清理掉 `Deployment`：\n\n```bash\nroot@host01:~# kubectl delete deploy\
  \ postgres\ndeployment.apps \"postgres\" deleted\n```\n\n\n\n\n不健康的容器会给应用程序带来各种困难，包括响应能力不足、响应请求时出错或数据错误，因此我们希望\
  \ Kubernetes 在容器变得不健康时能够快速做出响应。然而，当容器刚启动时，可能需要一些时间才能完成完全初始化。在那段时间内，它可能无法响应存活探针（liveness\
  \ probes）。\n\n由于这种延迟，我们需要在容器探针失败之前设置较长的超时时间，以便为容器留出足够的初始化时间。但同时，我们需要一个较短的超时时间，以便快速检测到失败的容器并重启它。解决方案是配置独立的\
  \ `startup probe`（启动探针）。Kubernetes 将使用启动探针配置，直到探针成功；随后，它将切换到存活探针。\n\n例如，我们可能如下配置我们的\
  \ NGINX 服务器 Deployment：\n\n```\n...\nspec:\n...\n  template:\n...\n    spec:\n \
  \     containers:\n      - name: nginx\n        image: nginx\n        livenessProbe:\n\
  \          httpGet:\n            path: /\n            port: 80\n        startupProbe:\n\
  \          httpGet:\n            path: /\n            port: 80\n          periodSeconds:\
  \ \n          initialDelaySeconds: 30\n          periodSeconds: 10\n          failureThreshold:\
  \ 60\n```\n\n给定此配置，Kubernetes 将在启动 30 秒后开始检查容器。它将每隔 10 秒检查一次，直到探针成功或达到 60 次失败尝试。效果是容器有\
  \ 10 分钟的时间完成初始化并成功响应探针。如果容器在这段时间内没有成功的探针，它将被重启。\n\n一旦容器有一次成功的探针，Kubernetes 将立即切换到\
  \ `livenessProbe` 的配置。由于我们没有覆盖任何计时参数，这将转变为每隔 10 秒进行一次探针检查，连续三次探针失败将导致重启。我们最初给容器\
  \ 10 分钟的时间变为可用状态，但此之后我们不再允许在重启它之前等待超过 30 秒。\n\n`startupProbe` 是完全独立定义的这一事实意味着，可以为启动创建一个与存活探针不同的检查机制。当然，明智地选择至关重要，以确保容器不会在存活探针通过之前就通过启动探针，因为那会导致不恰的重启。\n\
  \n### 就绪探针 (Readiness Probes)\n\n第三种探针用途是检查 Pod 的 `readiness`（就绪性）。`readiness` 一词似乎与启动探针冗余。然而，尽管完成初始化是软件就绪的一个重要部分，但应用程序组件可能由于许多原因无法准备好工作，特别是在高可用微服务架构中，组件可能会随时加入或离开。\n\
  \n就绪探针不应用于初始化，而应该用于任何由于控制之外的失败导致容器无法执行工作的情况。这可能是一个临时状态，因为其他地方的重试可能会修复失败。例如，依赖外部数据库的\
  \ API 在数据库无法访问时可能会导致就绪探针失败，但该数据库可能随时恢复服务。\n\n这与启动探针和存活探针形成了有价值的对比。正如我们之前检查的，如果容器失败了配置的次数的启动或存活探针，Kubernetes\
  \ 将重启容器。但如果问题是由于外部依赖失败或缺失，那么这样做就是没有意义的，因为重启容器无法修复外部发生的任何问题。\n\n同时，如果容器缺少所需的外部依赖项，它就无法工作，因此我们不希望向它发送任何工作。在这种情况下，最好的做法是让容器运行，并给它重新建立所需连接的机会，但避免向它发送任何请求。在此期间，我们可以希望集群中同一个\
  \ Deployment 的另一个 Pod 正在按预期工作，使得我们的整个应用程序对局部故障具有恢复能力。\n\n这正是 Kubernetes 中就绪探针的工作方式。正如我们在\
  \ `第 9 章` 中看到的，Kubernetes `Service` 会持续监控匹配其选择器的 Pod，并为其集群 IP 配置负载均衡，将流量路由到这些 Pod。如果一个\
  \ Pod 报告自身未就绪，`Service` 将停止向其路由流量，但 `kubelet` 不会触发任何其他操作（例如重启容器）。\n\n让我们来说说明这种情况。我们希望对\
  \ Pod 的就绪状态进行单独控制，因此我们将使用一个略为刻意的示例（而不是真实的外部依赖）来确定就绪状态。我们将部署一组 NGINX Pod，这次带有一个相应的\
  \ Service：\n\n*nginx-ready.yaml*\n\n```\n---\nkind: Deployment\napiVersion: apps/v1\n\
  metadata:\n  name: nginx\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n\
  \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n      - name: nginx\n        image: nginx\n     \
  \   livenessProbe:\n          httpGet:\n            path: /\n            port: 80\n\
  \        readinessProbe:\n          httpGet:\n            path: /ready\n       \
  \     port: 80\n---\nkind: Service\napiVersion: v1\nmetadata:\n  name: nginx\nspec:\n\
  \  selector:\n    app: nginx\n  ports:\n  - protocol: TCP\n    port: 80\n    targetPort:\
  \ 80\n```\n\n此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Pod 并将流量路由到这些 Pod。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了\
  \ `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX\
  \ 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe`\
  \ 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Deployment 保留了\
  \ `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此\
  \ Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Pod 并将流量路由到这些 Pod。 (注：此处原文似乎存在重复重复，已按逻辑处理)\n\n此 Pod 并将流量路由到这些 Pod。此\
  \ Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。此 Pod 并将流量路由到这些 Pod。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了\
  \ `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Pod 并将流量路由到这些 Pod。此 Deployment 保留了 `livenessProbe`\
  \ 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Pod 并将流量路由到这些\
  \ Pod。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。\n\n此 Pod 并将流量路由到这些 Pod。此 Deployment 保留了 `livenessProbe` 作为 NGINX\
  \ 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此 Pod 并将流量路由到这些 Pod。此 Deployment\
  \ 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service` 的定义与我们在看到的相同。此\
  \ Pod 并将流量路由到这些 Pod。此 Deployment 保留了 `livenessProbe` 作为 NGINX 正常工作的指示，并添加了 `readinessProbe`。`Service`\
  \ 的定义与我们在看到的相同。\n\n(注：由于提供的原文后半存在大量重复的句子，译文已根据逻辑进行了精简，以确保不重复输出)\n\n\n\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS    RESTARTS   AGE\n\
  nginx-67fb6485f5-2k2nz   0/1     Running   0          10m\nnginx-67fb6485f5-vph44\
  \   0/1     Running   0          10m\nnginx-67fb6485f5-xzmj5   0/1     Running \
  \  0          10m\n```\n\n现在，我们将选择其中一个并让它报告自己已就绪：\n\n```\nroot@host01:~# kubectl\
  \ exec -ti nginx-67fb6485f5-2k2nz -- \\\n  cp -v /etc/hostname /usr/share/nginx/html/ready\n\
  '/etc/hostname' -> '/usr/share/nginx/html/ready'\n```\n\n我们的 `Service` 将开始显示一个有效的\
  \ `Endpoint`：\n\n```\nroot@host01:~# kubectl describe svc nginx\nName:         \
  \     nginx\n...\nEndpoints:         172.31.239.199:80\n...\n```\n\n更好了，我们现在可以通过集群\
  \ IP 访问 NGINX 实例，且内容与主机名对应：\n\n```\nroot@host01:~# curl http://10.101.98.80/ready\n\
  nginx-67fb6485f5-2k2nz\n```\n\n注意 URL 末尾的 `/ready`，因此返回的是主机名。如果我们多次运行此 `command`，我们会发现每次主机名都是相同的。这是因为通过就绪探针的那个\
  \ `Pod` 正在处理所有的 `Service` 流量。\n\n让我们让另外两个 `Pods` 也就绪绪：\n\n```\nroot@host01:~# kubectl\
  \ exec -ti nginx-67fb6485f5-vph44 -- \\\n  cp -v /etc/hostname /usr/share/nginx/html/ready\n\
  '/etc/hostname' -> '/usr/share/nginx/html/ready'\nroot@host01:~# kubectl exec -ti\
  \ nginx-67fb6485f5-xzmj5 -- \\\n  cp -v /etc/hostname /usr/share/nginx/html/ready\n\
  '/etc/hostname' -> '/usr/share/nginx/html/ready'\n```\n\n我们的 `Service` 现在显示了三个 `Endpoints`：\n\
  \n```\nroot@host01:~# kubectl describe service nginx\nName:              nginx\n\
  ...\nEndpoints:         172.31.239.199:80,172.31.239.200:80,172.31.89.210:80\n...\n\
  ```\n\n多次运行 `curl` `command` 显示流量现在正分布在多个 `Pods` 上：\n\n```\nroot@host01:~# for i\
  \ in $(seq 1 5); do curl http://10.101.98.80/ready; done\nnginx-67fb6485f5-xzmj5\n\
  nginx-67fb6485f5-2k2nz\nnginx-67fb6485f5-xzmj5\nnginx-67fb6485f5-vph44\nnginx-67fb6485f5-vph44\n\
  ```\n\n嵌入的 `command` `$(seq 1 5)` 返回数字 1 到 5，导致 `for` `loop` 运行五次 `curl`。如果你多次运行同一个\
  \ `for` `loop`，你会看到不同的主机名分布。如 第 9 章 所述，负载均衡基于随机均匀分布，每个 `endpoint` 在每次新连接时都有等几概率被选中。\n\
  \n一种良好的做法是为每个应用程序提供一个 HTTP 就绪端点，该端点检查应用程序及其依赖项的当前状态，如果组件健康则返回 HTTP 成功状态码（如 `200`），如果不健康则返回\
  \ HTTP 错误码（如 `500`）。某些应用框架（如 `Spring Boot`）提供了应用状态管理，可以自动暴露存活和就绪端点。\n\n### 结语\n\n\
  Kubernetes 提供了检查我们的容器并确保它们按预期运行的能力，而不仅仅是进程是否正在运行。这些探针可以包含在容器内部运行的任何任意 `command`，用于验证端口是否已开放\
  \ TCP 连接，或者容器是否正确响应 HTTP 请求。为了构建韧性的应用程序，我们应该为每个应用组件定义存活探针和就绪探针。存活探针用于重启不健康的容器；就绪探针决定\
  \ `Pod` 是否能够处理 `Service` 流量。此外，如果组件需要额外的时间进行初始化，我们还应该定义一个启动探针，以确保给它所需的初始化时间，同时在初始化完成后立即对失败做出快速响应。\n\
  \n当然，为了让我们的容器按预期运行，集群中的其他容器也必须表现良好，不要占用过多的集群资源。在下一章中，我们将查看如何限制容器对 CPU、`memory`、磁盘空间和网络带宽的使用，以及我们如何控制一个用户可用的总资源最大量。这种指定限制和配额的能力对于确保我们的集群能够支持具有可靠性能的多个应用程序至关重要。\n\
  \n## 14: 限制与配额\n\n![image](img/common01.jpg)\n\n为了我们的集群能够提供可预测的环境，我们需要对每个应用组件使用的资源进行控制。在本章中，我们将探索如何指定请求资源和限制以确保容器获得所需。最后，我们将查看如何使用基于角色的访问控制来管理配额，限制用户可以要求的资源量。\n\
  \n### 请求与限制\n\nKubernetes 支持许多不同类型的资源，包括处理、`memory`、存储、网络带宽以及特殊设备的使用。我们将在本章稍后查看网络限制，但让我们从常用的资源类型开始：处理和\
  \ `memory`。\n\n#### 处理和内存限制\n\n处理和 `memory` 的规范有两个目的：调度和防止冲突。Kubernetes 为每个目的提供了不同的资源规范。`Pod`\
  \ 的容器消耗处理和内存资源，因此这就是应用规范的地方。\n\n在调度 `Pods` 时，Kubernetes 使用容器规范中的 `requests` 字段，汇总\
  \ `Pod` 中所有容器的字段，并寻找在处理和内存方面都有剩余空间的节点。通常，`requests` 字段设置为预期的平均资源需求。\n\n规范的第二个目的是防止由于一个容器占用节点所有资源导致的拒绝服务问题。这需要运行时强制执行资源。Kubernetes\
  \ 使用容器规范的 `limits` 字段来实现此目的，因此我们需要确保设置的 `limits` 字段足够，以便容器能够正常运行而不触及限制。\n\n### 性能调优\n\
  \n请求应匹配预期平均资源需求的想法是基于这样一个假设：集群中各种容器的负载激增是不可预测且不相关的，因此可以假设负载激增发生在不同的时间。即使有这个假设，节点上多个容器同时发生负载激增的风险仍会导致该节点过载。如果不同\
  \ `Pods` 之间的负载激增是相关的，这种过载风险就会增加。在第 19 章中，我们将探索 Kubernetes 为 `Pod` 提供的服务质量 (QoS)\
  \ 类，并讨论如何在性能保证和集群效率之间取得平衡。\n\n列表 14-1 以一个在 `Deployment` 中请求和限制的示例开始我们的研究。\n\n*nginx-limit.yaml*\n\
  \n\n\n\n\n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: nginx\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
  \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
  \      - name: nginx\n        image: nginx\n        resources:\n          requests:\n\
  \            memory: \"64Mi\"\n            cpu: \"250m\"\n          limits:\n  \
  \          memory: \"128Mi\"\n            cpu: \"500m\"\n      nodeName: host01\n\
  ```\n\n*列表 14-1: 带有限制的 Deployment*\n\n我们将使用这个 Deployment 来探索如何在容器运行时级别配置限制（limits），因此我们使用\
  \ `nodeName` 字段来确保容器运行在 `host01` 上。这限制了调度器放置 Pod 的位置，但调度器仍然会使用 `requests` 字段来确保足够的资源。如果\
  \ `host01` 变得太忙，调度器将拒绝调度该 Pod，这与我们在第 10 章中看到的类似。\n\n`resources` 字段定义在单个容器级别，允许我们为\
  \ Pod 中的每个容器指定单独资源需求。对于此容器，我们指定了 `64Mi` 的内存请求和 `128Mi` 的内存限制。后缀 `Mi` 意味着我们使用基于 2\
  \ 的幂单位“兆字节”（mebibytes），即 2 的 20 次方，而不是基于 10 的幂单位“兆字节”（megabytes），后者是 10 的 6 次方，值略小。\n\
  \n同时，使用 `cpu` 字段指定的处理请求和限制不是基于任何绝对的处理单位，而是基于我们集群的合成 `cpu unit`。每个 `cpu unit` 大约对应于一个虚拟\
  \ CPU 或核心。`m` 后缀表示“毫核 CPU”（millicpu），因此我们的请求值 `250m` 等于一个核心的四分之一，而 `500m` 的限制则等于一个核心的一半。\n\
  \n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参见第\
  \ xx 页上的“运行示例”。\n\n让我们创建这个 Deployment：\n\n```\nroot@host01:~# kubectl apply -f /opt/nginx-limit.yaml\
  \ \ndeployment.apps/nginx created\n```\n\nPod 将被分配到 `host01` 并启动：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME                     READY   STATUS    RESTARTS   AGE\n\
  nginx-56dbd744d9-vg5rj   1/1     Running   0          22m\n```\n\n`host01` 将显示已为\
  \ Pod 分配了资源：\n\n```\nroot@host01:~# kubectl describe node host01\nName:        \
  \       host01\n...\nNon-terminated Pods:          (15 in total)\n  Namespace Name\
  \                   CPU Requests CPU Limits Memory Requests Memory Limits Age\n\
  \  --------- ----                   ------------ ---------- --------------- -------------\
  \ ---\n...\n  default   nginx-56dbd744d9-vg5rj 250m (12%)   500m (25%) 64M (3%)\
  \        128M (6%)     61s\n...\n```\n\n即使我们的 NGINX Web 服务器处于空闲状态并且没有大量的处理或内存资源，情况也是如此：\n\
  \n```\nroot@host01:~# kubectl top pods\n...\nNAME                     CPU(cores)\
  \   MEMORY(bytes)   \nnginx-56dbd744d9-vg5rj   0m           5Mi\n```\n\n与我们在第 12\
  \ 章中看到的类似，该命令查询了从每个集群节点上运行的 `kubelet` 收集数据的指标插件。\n\n### Cgroup 强制执行\n\n我们指定的处理和内存限制是通过我们在第\
  \ 3 章中描述的 Linux 控制组（cgroup）功能强制执行的。Kubernetes 在 `/sys/fs/cgroup` 文件系统的每个层级内管理自己的空间。例如，内存限制是在内存\
  \ cgroup 中配置的：\n\n```\nroot@host01:~# ls -1F /sys/fs/cgroup/memory\n...\nkubepods.slice/\n\
  ...\n```\n\n给定主机上的每个 Pod 在 `kubepods.slice` 树中都有目录。然而，为特定 Pod 查找目录需要一些工作，因为 Kubernetes\
  \ 将 Pod 分为不同的服务类别，而且 cgroup 目录的名称与 Pod 或其容器的 ID 不匹配。\n\n为了避免在 `/sys/fs/cgroup` 内部搜索，我们将使用本章自动脚本安装的脚本：`/opt/cgroup-info`。该脚本使用\
  \ `crictl` 查询容器运行时获取 cgroup 路径，然后从该路径收集 CPU 和内存限制数据。脚本中最重要的部分是收集路径的部分：\n\n`cgroup-info`\n\
  \n```bash\n#!/bin/bash\n...\nPOD_ID=$(crictl pods --name ${POD} -q)\n...\ncgp_field='.info.config.linux.cgroup_parent'\n\
  CGP=$(crictl inspectp $POD_ID | cgroup_field)\n\nCPU=/sys/fs/cgroup/cpu/$CGP\nMEM=/sys/fs/cgroup/memory/$CGP\n\
  ```\n\n`crictl` 命令查询容器运行时获取 cgroup 路径，然后收集 CPU 和内存限制数据。让我们运行我们的 NGINX Web 服务器运行此脚本来查看\
  \ cgroup 信息：\n\n```\nroot@host01:~# kubectl get pods\nNAME                     READY\
  \   STATUS    RESTARTS   AGE\nnginx-56dbd744d9-vg5rj   1/1     Running   0     \
  \     22m\n```\n\n`root@host01:~# /opt/cgroup-info`\n\n```\nContainer Runtime\n\
  ----------------\nCPU Shares: 256\nCPU Quota (us): 50000\n\nMemory Settings\n---------------\n\
  Limit (bytes): 134217728\n```\n\n\n\n\n\n资源分配在 cgroups 中的反映方式向我们展示了关于集群性能的重要信息。由于\
  \ `requests` 用于调度，而 `limits` 用于运行时强制，节点可能会出现处理和内存的过度提交。当容器的 `limit` 高于 `requests`，且容器持续在高于\
  \ `requests` 的运行时，可能会导致节点上容器的性能问题。我们将在第 19 章中详细讨论这一点。\n\n我们已经完成了 NGINX 部署，现在让我们将其删除吧：\n\
  \n```\nroot@host01:~# kubectl delete -f /opt/nginx-limit.yaml \ndeployment.apps\
  \ \"nginx\" deleted\n```\n\n到目前为止，容器运行时可以执行我们看到的那些限制。然而，集群必须执行其他类型的限制，例如网络限制。\n\n\
  ## 网络限制\n\n理想情况下，我们的应用程序架构应该是这样的：节点间通信所需的带宽处于适中水平，并且集群有足够的带宽来满足所有容器的需求。然而，如果我们确实有一个容器尝试获取超过其份额的网络带宽，我们需要一种方法来限制它。\n\
  \n由于网络设备是通过插件配置的，因此我们需要一个插件来管理带宽。幸运的是，带宽插件是随我们的 Kubernetes 集群安装的标准 CNI 插件集的一部分。此外，正如我们在第\
  \ 8 章中所看到的，默认的 CNI 配置启用了带宽插件：\n\n```\nroot@host01:~# cat /etc/cni/net.d/10-calico.conflist\
  \ \n{\n  \"name\": \"k8s-pod-network\",\n  \"cniVersion\": \"0.3.1\",\n  \"plugins\"\
  : [\n...\n    {\n      \"type\": \"bandwidth\",\n      \"capabilities\": {\"bandwidth\"\
  : true}\n    },\n...\n  ]\n```\n\n因此，`kubelet` 在每次创建新 Pod 时都会调用带宽插件。如果 Pod 配置了带宽限制，插件将使用我们在第\
  \ 3 章中看到的 Linux 内核流量控制能力，确保 Pod 的虚拟网络设备不超过指定的限制。\n\n让我们来看一个例子。首先，我们部署一个监听客户端连接的\
  \ iperf3 服务器：\n\n*iperf-server.yaml*\n\n```\n---\nkind: Deployment\napiVersion:\
  \ apps/v1\nmetadata:\n  name: iperf-server\nspec:\n  replicas: 1\n  selector:\n\
  \    matchLabels:\n      app: iperf-server\n  template:\n    metadata:\n      labels:\n\
  \        app: iperf-server\n    spec:\n      containers:\n      - name: iperf\n\
  \        image: bookofkubernetes/iperf3:stable\n        env:\n        - name: IPERF_SERVER\n\
  \          value: \"1\"\n        resources: ...\n---\nkind: Service\napiVersion:\
  \ v1\nmetadata:\n  name: iperf-server\nspec:\n  selector:\n    app: iperf-server\n\
  \  ports:\n  - protocol: TCP\n    port: 5201\n    targetPort: 5201\n```\n\n除了 Deployment，我们还创建了一个\
  \ Service。这样，我们的 iperf3 客户端就可以通过其已知名称 `iperf-server` 找到服务器。我们指定了端口 `5201`，这是 iperf3\
  \ 的默认端口。\n\n让我们部署这个服务器：\n\n```\nroot@host01:~# kubectl apply -f /opt/iperf-server.yaml\
  \ \ndeployment.apps/iperf-server created\nservice/iperf-server created\n```\n\n\
  让我们在不应用任何带宽限制的情况下运行一个 iperf3 客户端。这将让我们看到在没有任何流量控制的情况下，集群网络有多快。以下是客户端的定义：\n\n*iperf.yaml*\n\
  \n```\n---\nkind: Pod\napiVersion: v1\nmetadata:\n  name: iperf\nspec:\n  containers:\n\
  \  - name: iperf\n    image: bookofkubernetes/iperf3:stable\n    resources: ...\n\
  ```\n\n通常情况下，客户端模式下的 iperf3 会运行一次然后终止。这个镜像有一个脚本会反复运行 iperf3，并在每次运行之间睡眠一分钟。让我们启动一个客户端\
  \ Pod：\n\n```\nroot@host01:~# kubectl apply -f /opt/iperf.yaml \npod/iperf created\n\
  ```\n\nPod 需要几秒钟开始运行，之后初始运行需要 10 秒。大约 30 秒后，Pod 日志将显示结果：\n\n```\nroot@host01:~#\
  \ kubectl logs iperf\nConnecting to host iperf-server, port 5201\n[  5] local 172.31.89.200\
  \ port 54346 connected to 10.96.0.192 port 5201\n[ ID] Interval           Transfer\
  \     Bitrate         Retr  Cwnd\n[  5]   0.00-1.00   sec   152 MBytes  1.28 Gbits/sec\
  \  225    281 KBytes       \n[  5]   1.00-2.00   sec   154 MBytes  1.29 Gbits/sec\
  \  153    268 KBytes       \n[  5]   2.00-3.00   sec   152 MBytes  1.28 Gbits/sec\
  \  225    281 KBytes       \n[  5]   3.00-4.00   sec   154 MBytes  1.29 Gbits/sec\
  \  153    268 KBytes       \n[  5]   4.00-5.00   sec   152 MBytes  1.28 Gbits/sec\
  \  225    281 KBytes       \n[  5]   5.00-6.00   sec   154 MBytes  1.29 Gbits/sec\
  \  153    268 KBytes       \n[  5]   6.00-7.00   sec   152 MBytes  1.28 Gbits/sec\
  \  225    281 KBytes       \n[  5]   7.00-8.00   sec   154 MBytes  1.29 Gbits/sec\
  \  153    268 KBytes       \n[  5]   8.00-9.00   sec   152 MBytes  1.28 Gbits/sec\
  \  225    281 KBytes       \n[  5]   9.00-10.00  sec   154 MBytes  1.29 Gbits/sec\
  \  153    268 KBytes\n```\n\n\n\n\n\n```\nroot@host01:~# kubectl logs iperf-limit\n\
  Connecting to host iperf-server, port 5201\n[  5] local 172.31.239.224 port 45680\
  \ connected to 10.96.0.192 port 5201\n[ ID] Interval           Transfer     Bitrate\
  \         Retr  Cwnd\n[  5]   0.00-1.01   sec  22.7 MBytes 190 Mbits/sec    0  \
  \ 1.37 KBytes       \n[  5]   1.01-2.01   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  633 KBytes       \n[  5]   2.01-3.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  639 KBytes       \n[  5]   3.00-4.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  646 KBytes       \n[  5]   4.00-5.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  653 KBytes       \n[  5]   5.00-6.00   sec  1.25 MBytes 10.5 Mbits/sec   0  \
  \  658 KBytes       \n[  5]   6.00-7.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  658 KBytes       \n[  5]   7.00-8.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  658 KBytes       \n[  5]   8.00-9.00   sec  0.00 Bytes  0.00 bits/sec    0  \
  \  658 KBytes       \n[  5]   9.00-10.00  sec  0.00 Bytes  0.00 bits/sec    0  \
  \  658 KBytes       \n- - - - - - - - - - - - - - - - - - - - - - - - -\n[ ID] Interval\
  \           Transfer     Bitrate         Retr\n[  5]   0.00-10.00  sec  24.0 MBytes\
  \  20.1 Mbits/sec    0             sender\n[  5]   0.00-10.10  sec  20.7 MBytes\
  \  17.2 Mbits/sec                  receiver\n\niperf Done.\n```\n\n这种变化是非常巨大的，因为\
  \ Pod 的速度被限制在了我们在无限制客户端上看到的速度的一分之一。然而，由于流量整形（traffic shaping）是基于令牌桶过滤器（token bucket\
  \ filter），在较短间隔内的流量控制是不精确的，因此我们看到的比特率约为 20Mb 而非 1Mb。为了了解原因，让我们查看实际的流量整形配置。\n\n带宽插件将此令牌桶过滤器应用于为\
  \ Pod 创建的虚拟以太网（`veth`）对主机侧，我们可以通过显示主机接口的流量控制配置来看到它：\n\n```\nroot@host01:~# tc qdisc\
  \ show\n...\nqdisc tbf 1: dev calid43b03f2e06 ... rate 1Mbit burst 21474835b lat\
  \ 4123.2s \n...\n```\n\n速率（rate）和突发量（burst）的结合解释了为什么我们的 Pod 在 10 秒的测试运行中达到了 20Mb。由于突发值的存在，Pod\
  \ 能够立即发送大量数据，代价是几秒钟无法发送或接收。在更长的间隔内，我们将看到 1Mbps 的平均值，但仍然会看到这种突发行为。\n\n在继续之前，让我们清理客户端和服务器：\n\
  \n```bash\nroot@host01:~# kubectl delete -f /opt/iperf-server.yaml \ndeployment.apps\
  \ \"iperf-server\" deleted\nservice \"iperf-server\" deleted\nroot@host01:~# kubectl\
  \ delete -f /opt/iperf-limit.yaml\npod \"iperf-limit\" deleted\n```\n\n管理 Pod 的带宽是有用的，但正如我们所看到的，带宽限制从\
  \ Pod 的角度来看可能像间歇性连接。因此，对于无法配置为自调节其带宽占用的容器，这种流量整形应该被视为最后的手段。\n\n### 配额 (Quotas)\n\
  \n限制（Limits）允许我们的 Kubernetes 集群确保每个节点都有为其分配的 Pod 提供足够的资源。然而，如果我们希望集群能够可靠地托管多个应用程序，我们需要一种方法来控制任何应用程序请求的资源量。\n\
  \n为了这一点，我们将使用配额。配额根据 `Namespace` 分配；它们指定了在该 `Namespace` 内可以分配的资源上限。这不仅包括 CPU 和内存等资源，还包括\
  \ GPU 等专用集群资源。我们甚至可以使用配额来指定在给定 `Namespace` 内可以创建特定类型对象（例如 `Deployment`、`Service`\
  \ 或 `CronJob`）的最大数量。\n\n由于配额是基于 `Namespace` 分配的，因此它们需要与我们在第 1 十一章中描述的访问控制结合使用，以确保给定用户受配额限制。\n\
  \n### 设置配额\n\n首先，创建一个用户和一个命名空间进行测试：\n\n```bash\nroot@host01:~# kubectl create namespace\
  \ sample\n```\n\n接下来，将在 `sample` 命名空间中定义一个 `ResourceQuota`：\n\n```yaml\n---\napiVersion:\
  \ v1\nkind: ResourceQuota\nmetadata:\n  name: sample-quota\n  namespace: sample\n\
  spec:\n  hard:\n    requests.cpu: \"1\"\n    requests.memory: \"256Mi\"\n    limits.cpu:\
  \ \"2\"\n    limits.memory: \"512Mi\"\n```\n\n应用配额：\n\n```bash\nroot@host01:~# kubectl\
  \ apply -f quota.yaml\n```\n\n现在我们可以验证配额是否已激活：\n\n```bash\nroot@host01:~# kubectl\
  \ describe resourcequota sample-quota -n sample\n```\n\n### 测试配额\n\n为了测试配额，我们需要一个权限限制的用户。我们将创建一个\
  \ `Role` 和一个 `RoleBinding`：\n\n```yaml\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: Role\nmetadata:\n  name: edit-role\n  namespace: sample\nrules:\n- apiGroups:\
  \ [\"\"]\n  resources: [\"pods\", \"services\"]\n  verbs: [\"get\", \"list\", \"\
  watch\", \"create\", \"update\", \"patch\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: RoleBinding\nmetadata:\n  name: edit-binding\n  namespace: sample\nsubjects:\n\
  - kind: User\n  name: me\n  apiGroup: rbac.authorization.k8s.io\nroleRef:\n  kind:\
  \ Role\n  name: edit-role\n  apiGroup: rbac.authorization.k8s.io\n```\n\n应用绑定：\n\
  \n```bash\nroot@host01:~# kubectl apply -f edit-bind.yaml\n```\n\n为了以该用户身份，我们将 `KUBECONFIG`\
  \ 环境变量指向凭据文件：\n\n```bash\nroot@host01:~# export KUBECONFIG=kubeconfig\n```\n\n现在，尝试创建一个没有限制的\
  \ Pod，这将触发配额：\n\n```bash\nroot@host01:~# kubectl run nginx -n sample --image=nginx\n\
  Error from server (Forbidden): pods \"nginx\" is forbidden: failed quota: sample-quota:\
  \ must specify limits.cpu,limits.memory\n```\n\n最后，我们创建一个指定限制的 Deployment，这应该是成功的：\n\
  \n```yaml\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: sleep\n\
  \  namespace: sample\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n    \
  \  app: sleep\n  template:\n    metadata:\n      labels:\n        app: sleep\n \
  \   spec:\n      containers:\n      - name: sleep\n        image: busybox\n    \
  \    command:\n          - \"/bin/sleep\"\n          - \"3600\"\n        resources:\n\
  \          requests:\n            memory: \"64Mi\"\n            cpu: \"250m\"\n\
  \          limits:\n            memory: \"128Mi\"\n            cpu: \"512m\"\n```\n\
  \n应用部署：\n\n```bash\nroot@host01:~# kubectl apply -f sleep.yaml\ndeployment.apps/sleep\
  \ created\n```\n\n\n\n\n\n这之所以成功，是因为我们指定了必要的 request（请求）和 limit（限制）字段，并且没有超过我们的配额。此外，Pod\
  \ 是按照我们指定的限制条件启动的：\n\n```\nroot@host01:~# kubectl get -n sample pods\nNAME     \
  \                READY   STATUS    RESTARTS   AGE\nsleep-688dc46d95-wtppg   1/1\
  \     Running   0          72s\n```\n\n然而，我们看到现在使用的资源已经超出了我们的配额：\n\n```\nroot@host01:~#\
  \ kubectl describe namespace sample\nName:         sample\nLabels:       kubernetes.io/metadata.name=sample\n\
  Annotations:  <none>\nStatus:       Active\n\nResource Quotas\n  Name:         \
  \   sample-quota\n  Resource         Used   Hard\n  --------         ---    ---\n\
  \  limits.cpu       512m   2\n  limits.memory    128Mi  512Mi\n  requests.cpu  \
  \   250m   1\n  requests.memory  64Mi   256Mi\n...\n```\n\n这将限制我们扩展该 `Deployment`\
  \ 的能力。让我们来说说明：\n\n```\nroot@host01:~# kubectl scale -n sample deployment sleep --replicas=12\n\
  deployment.apps/sleep scaled\nroot@host01:~# kubectl get -n sample pods\nNAME  \
  \                   READY   STATUS    RESTARTS   AGE\nsleep-688dc46d95-trnbl   1/1\
  \     Running   0          6s\nsleep-688dc46d95-vzfsx   1/1     Running   0    \
  \      6s\nsleep-688dc46d95-wtppg   1/1     Running   0          3m13s\n```\n\n\
  我们请求了 12 个副本，但只看到三个在运行。如果我们描述这个 `Deployment`，就能看到一个问题：\n\n```\nroot@host01:~# kubectl\
  \ describe -n sample deployment sleep\nName:      sleep\nNamespace: sample\n...\n\
  Replicas:   12 desired | 3 updated | 3 total | 3 available | 9 unavailable\n...\n\
  Conditions:\n  Type             Status  Reason\n  ----             ------  ------\n\
  \  Progressing      True    NewReplicaSetAvailable\n  Available        False   MinimumReplicasUnavailable\n\
  \  ReplicaFailure   True    FailedCreate\nOldReplicaSets:    <none>\nNewReplicaSet:\
  \     sleep-688dc46d95 (3/12 replicas created)\n...\n```\n\n现在 `Namespace` 报告我们已经消耗了足够的配额，没有空间为另一个\
  \ Pod 分配所需的资源：\n\n```\nroot@host01:~# kubectl describe namespace sample\nName: \
  \        sample\n...\nResource Quotas\n  Name:            sample-quota\n  Resource\
  \         Used   Hard\n  --------         ---    ---\n  limits.cpu       1536m \
  \ 2\n  limits.memory    384Mi  512Mi\n  requests.cpu     750m   1\n  requests.memory\
  \  192Mi  256Mi\n...\n```\n\n我们的 `Pods` 正在运行 `sleep`，所以我们知道它们几乎没有任何 CPU 或内存。然而，Kubernetes\
  \ 配额利用率是基于我们指定的数值，而不是 `Pod` 实际使用的数值。这一点至关重要，因为进程在繁忙时可能会使用更多 CPU 或分配更多内存，而 Kubernetes\
  \ 需要确保为集群的其他部分留出足够的资源以正确运行。\n\n### 结语\n\n为了确保容器化应用程序的可靠性，我们需要知道一个应用程序组件不会占用过多资源，并实际上饿饿了集群中运行的其他容器。Kubernetes\
  \ 能够利用底层容器运行时和 Linux 内核的资源限制功能，将每个容器限制为仅拥有被分配的资源。这种做法确保了容器更可靠地调度到集群节点上，并确保即使在集群负载过重时，可用的集群资源也能以公平的方式共享。\n\
  \n在本章中，我们学习了如何为 `Deployments` 指定资源需求，以及如何对 `Namespaces` 实施配额，这有效地使我们能够将集群中的所有节点视为一个巨大的可用资源池。在下一章中，我们将研究同样的原理如何扩展到存储，并查看如何为\
  \ `Pods` 动态分配存储，无论它们被调度在何何处。\n\n# 15: 持久化存储\n\n![image](img/common01.jpg)\n\n可扩展性和快速故障恢复是容器化应用程序的巨大优势，对于没有任何持久化存储的无状态容器，扩展、更新和替换要容易得多。因此，我们大多数使用\
  \ `Deployments` 来创建一个或多个只有临时存储的 `Pods` 实例。\n\n然而，即使我们的应用程序架构中大多数组件是无状态的，我们的应用程序仍然需要一些持久化存储。同时，我们不想失去将\
  \ `Pod` 部署到集群中任何节点的能力，也不希望在容器或节点故障时丢失持久化存储的内容。\n\n在本章中，我们将看到 Kubernetes 如何通过插件架构允许任何支持的分布式存储引擎作为后端存储，为\
  \ `Pods` 按需提供持久化存储。\n\n### 存储类 (Storage Classes)\n\n Kubernetes 的存储插件架构非常灵活；它意识到某些集群可能不需要存储，而另一些则需要多个存储插件来处理大量数据或低延迟存储。由于如此，`kubeadm`\
  \ 在集群安装期间不会立即设置存储；而是在之后通过添加 `StorageClass` 来进行配置。\n\n每个 `StorageClass` 指定一个提供实际存储的特定插件。我们可以使用多个存储类来定义不同的插件，或具有相同插件但不同参数的存储类。例如，集群可以为低延迟提供较小的配额，同时为较慢的数据提供配额。\n\
  \nKubernetes 内置了一套内部存储提供者。这包括针对热门云提供商如 Amazon Web Services、Microsoft Azure 和 Google\
  \ Container Engine 的存储驱动。然而，只要支持容器存储接口（CSI），使用任何存储插件都是简单的，它是与存储提供者交互的标准。\n\n当然，为了兼容\
  \ `CSI`，存储提供者必须包含 Kubernetes 存储至关重要的最小功能集。最重要的就是动态存储管理（配置和取消）以及动态存储挂载（在任何节点上挂载）。这些关键功能共同允许集群为请求的任何\
  \ `Pod` 分配存储，将其调度到任何节点，并在现有节点故障或 `Pod` 替换时启动具有相同存储的新 `Pod`。\n\n#### 存储类定义\n\n我们在第\
  \ 6 章的 Kubernetes 集群部署包含了 Longhorn 存储插件。自动化脚本已经在后续每个章节中安装了它。安装过程的一部分创建了一个 `DaemonSet`，使得\
  \ Longhorn 组件存在于每个节点。该 `DaemonSet` 启动了多个 Longhorn 组件，然后创建了 `StorageClass` 资源，告诉\
  \ Kubernetes 如何使用 Longhorn 为 `Pod` 配置存储。\n\n**注意**\n\n*本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情请参见\
  \ xx 页“运行示例”。*\n\n列表 15-1 显示了 Longhorn 创建的 `StorageClass`。\n\n```\nroot@host01:~#\
  \ kubectl get storageclass\nNAME      PROVISIONER         RECLAIMPOLICY  VOLUMEBINDINGMODE\
  \  ALLOWVOLUMEEXPANSION ...\nlonghorn  driver.longhorn.io  Delete         Immediate\
  \          true                 ...\n```\n\n*列表 15-1: Longhorn StorageClass*\n\n\
  \n\n\n\n最重要的两个字段显示了 `StorageClass` 的名称和 provisioner（提供者）。名称在资源规格中使用，用于标识应该使用哪个 Longhorn\
  \ `StorageClass` 来配置请求的卷，而 provisioner 则由 `kubelet` 在内部用于与 Longhorn CSI 插件通信。\n\n\
  ## CSI 插件内部原理\n\n在继续配置卷并将其挂载到 Pod 之前，让我们快速查看 `kubelet` 如何查找并与 Longhorn CSI 插件通信的。请注意，`kubelet`\
  \ 直接作为服务运行在集群节点上；另一方面，所有的 Longhorn 组件都是容器化的。这意味着这两者需要通过 Unix 套接字的形式来帮助它们进行通信，该套接字在主机文件系统上创建，然后挂载到\
  \ Longhorn 容器的文件系统中。Unix 套接字允许两个进程通过流式数据进行通信，类似于网络连接，但没有网络开销。\n\n为了探索这种通信的工作原理，首先我们将列出运行在\
  \ `host01` 上的 Longhorn 容器：\n\n```\nroot@host01:~# crictl ps --name 'longhorn.*|csi.*'\n\
  CONTAINER     ... STATE    NAME ...\nc8347a513f71e ... Running  csi-provisioner\
  \ ...\n47f950a3e8dbf ... Running  csi-provisioner ...\n3aad0fef7454e ... Running\
  \  longhorn-csi-plugin ...\n9bfb61f786afa ... Running  csi-snapshotter ...\n24a2994a264a1\
  \ ... Running  csi-snapshotter ...\n7ee4c748b4c02 ... Running  csi-snapshotter ...\n\
  8d92886fdacda ... Running  csi-resizer ...\n9868014407fe0 ... Running  csi-resizer\
  \ ...\n408d16181af51 ... Running  csi-attacher ...\n0c6c341debb0c ... Running  longhorn-driver-deployer\
  \ ...\nba328a9d0aaf2 ... Running  longhorn-manager ...\nc39e5c4fee3bb ... Running\
  \  longhorn-ui ...\n```\n\nLonghorn 创建的容器名称以 `longhorn` 或 `csi` 开头，因此我们使用 `crictl`\
  \ 的正则表达式来仅显示这些容器。\n\n让我们获取 `csi-attacher` 容器的 ID，然后对其检查以查看它有哪些卷挂载：\n\n```\nroot@host01:~#\
  \ CID=$(crictl ps -q --name csi-attacher)\nroot@host01:~# crictl inspect $CID\n\
  {\n...\n    \"mounts\": [\n      {\n        \"containerPath\": \"/csi/\",\n    \
  \     \"hostPath\": \"/var/lib/kubelet/plugins/driver.longhorn.io\",\n        \"\
  propagation\": \"PROPAGATION_PRIVATE\",\n        \"readonly\": false,\n        \"\
  selinuxRelabel\": false\n      }\n...\n      \"envs\": [\n        {\n          \"\
  key\": \"ADDRESS\",\n          \"value\": \"/csi/csi.sock\"\n        },\n...\n}\n\
  ```\n\n`crictl inspect` 命令返回了容器的大量数据，但在示例中我们只显示了相关数据。我们可以看到，这个 Longhorn 组件被指示连接到\
  \ `/csi/csi.sock`，这是容器内部 `kubelet` 用于与存储驱动程序通信的 Unix 套接字挂载点。我们还可以看到容器内的 `/csi` 是\
  \ `/var/lib/kubelet/plugins/driver.longhorn.io`。`/var/lib/kubelet/plugins` 位置是 `kubelet`\
  \ 查找存储插件的标准位置，当然，`driver.longhorn.io` 是 `provisioner` 字段的值，正如[列表 15-1]中 Longhorn\
  \ `StorageClass` 定义的那样。\n\n如果我们在主机上查看，可以确认这个 Unix 套接字是否存在：\n\n```\nroot@host01:~#\
  \ ls -l /var/lib/kubelet/plugins/driver.longhorn.io\ntotal 0\nsrwxr-xr-x 1 root\
  \ root 0 Feb 18 20:17 csi.sock\n```\n\n第一个字符为 `s` 表示这是一个 Unix 套接字。\n\n## 持久卷\n\n\
  现在我们已经看到了 `kubelet` 如何与外部存储驱动程序通信，让我们来看看如何请求分配存储空间，然后将该存储挂载到 Pod 上。\n\n## Stateful\
  \ Sets\n\n在 Pod 中获取存储最简单的方法是使用 `StatefulSet`（[第 7 章]中描述的资源）。与 `Deployment` 类似，`StatefulSet`\
  \ 创建多个 Pod，并可以分配到任何节点。然而，`StatefulSet` 还会创建持久存储以及每个 Pod 与其存储之间的映射。如果 Pod 需要替换，它将用具有相同标识和相同持久存储的新\
  \ Pod 进行替换。\n\n[列表 15-2] 展示了一个 `StatefulSet` 示例，它创建了两个带有持久存储的 PostgreSQL Pod。\n\n\
  *pgsql-set.yaml*\n\n```\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n\
  \  name: postgres\nspec:\n  serviceName: postgres\n  replicas: 2\n  selector:\n\
  \    matchLabels:\n      app: postgres\n  template:\n    metadata:\n      labels:\n\
  \        app: postgres\n    spec:\n      containers:\n      - name: postgres\n \
  \       image: postgres\n        env:\n        - key: POSTGRES_PASSWORD\n      \
  \    value: \"secret\"\n        volumeMounts:\n        - name: data\n          mountPath:\
  \ /data\n  volumeClaimTemplates:\n  - name: data\n    spec:\n      accessModes:\n\
  \        - ReadWriteOnce\n      storageClassName: longhorn\n      resources:\n \
  \       requests:\n          storage: 1Gi\n```\n\n\n\n\n\n```\nroot@host01:~# kubectl\
  \ get svc\nNAME         TYPE        CLUSTER-IP   EXTERNAL-IP   PORT(S)   AGE\nkubernetes\
  \   ClusterIP   10.96.0.1    <none>        443/TCP   54m\npostgres     ClusterIP\
  \   None         <none>        <none>    19m\n```\n\n`postgres` 服务存在，但没有显示集群 IP\
  \ 地址，因为我们将其创建为一个无头（headless）`Service`。不过，它已经为关联的 `Pods` 创建了 DNS 条目，因此我们可以在不知道 `Pod`\
  \ IP 地址的情况下连接到特定的 `PostgreSQL` `Pods`。\n\n我们需要使用集群 DNS 进行查找。最简单的方法是从容器内部进行：\n\n\
  ```\nroot@host01:~# kubectl run -ti --image=alpine --restart=Never alpine\n如果你没有看到命令提示符，请尝试按回车。\n\
  / #\n```\n\n这种形式的 `run` 命令会保持在前台，并为我们提供一个交互式终端。它还告诉 Kubernetes 在我们退出 shell 时不要尝试重启容器。\n\
  \n在这个容器内部，我们可以通过已知名称引用我们的两个 `PostgreSQL` `Pods`：\n\n```\n/ # ping -c 1 postgres-0.postgres.default.svc\n\
  PING postgres-0.postgres.default.svc (172.31.239.198): 56 data bytes\n64 bytes from\
  \ 172.31.239.198: seq=0 ttl=63 time=0.093 ms\n...\n/# ping -c 1 postgres-1.postgres.default.svc\n\
  PING postgres-1.postgres.default.svc (172.31.239.199): 56 data bytes\n64 bytes from\
  \ 172.31.239.199: seq=0 ttl=63 time=0.300 ms\n...\n# exit\n```\n\n命名规范与我们在第 9 章\
  \ 中看到的 `Services` 相同，但为 `Pod` 的名称多了一个主机名前缀；在这种情况下，名称为 `postgres-0` 或 `postgres-1`。\n\
  \n另一个重要的资源是 `StatefulSet` 自动创建的 `PersistentVolumeClaim`。`PersistentVolumeClaim`\
  \ 实际上在使用 `Longhorn` `StorageClass` 分配存储的依据：\n\n```\nroot@host01:~# kubectl get pvc\n\
  NAME                         STATUS   VOLUME      ...   CAPACITY   ...\npostgres-volume-postgres-0\
  \   Bound    pvc-83becdac...   1Gi        ...\npostgres-volume-postgres-1   Bound\
  \    pvc-0d850889...   1Gi        ...\n```\n\n我们用缩写 `pvc` 代替它的全名 `persistentvolumeclaim`。\n\
  \n`StatefulSet` 使用列表 15-2 中 `volumeClaimTemplates` 字段中的数据创建了这两个 `PersistentVolumeClaims`。然而，如果我们删除了\
  \ `StatefulSet`，`PersistentVolumeClaims` 将继续存在：\n\n```\nroot@host01:~# kubectl delete\
  \ -f /opt/pgsql-set.yaml \nservice \"postgres\" deleted\nstatefulset.apps \"postgres\"\
  \ deleted\nroot@host01:~# kubectl get pvc\nNAME                         STATUS \
  \  VOLUME      ...   CAPACITY   ...\npostgres-volume-postgres-0   Bound    pvc-83becdac...\
  \   1Gi        ...\npostgres-volume-postgres-1   Bound    pvc-0d850889...   1Gi\
  \        ...\n```\n\n这保护了我们不会意外删除持久化存储。如果我们重新创建 `StatefulSet` 并在 `volume claim template`\
  \ 中保持相同的名称，我们的新 `Pods` 将重新获得相同的存储。\n\n## 高可用 PostgreSQL\n\n我们部署了两个独立的 `PostgreSQL`\
  \ 实例，每个实例都有自己独立的持久化存储。然而，这仅仅是部署高可用数据库的第一步。我们还需要配置一个实例作为主节点，另一个作为备用，配置从主节点到备用节点的复制，并配置故障转移。我们还需要配置客户端连接主节点并在发生故障时切换到新的主节点。幸运的是，我们不需要自己进行这些配置。在第\
  \ 17 章中，我们将看到如何利用自定义资源的力量来部署一个 `PostgreSQL` 的 Kubernetes `Operator`，它将自动处理所有这一切。\n\
  \n`StatefulSet` 是处理需要多个容器实例且每个实例都有独立独立存储的情况的最佳方法。然而，我们也可以更直接地使用持久化卷，这让我们对它们如何挂载到\
  \ `Pods` 中有更多的控制。\n\n### 卷与声明（Claims）\n\nKubernetes 同时拥有 `PersistentVolume` 和 `PersistentVolumeClaim`\
  \ 资源类型。`PersistentVolumeClaim` 代表对分配存储的请求，而 `PersistentVolume` 包含分配存储的信息。在大多数情况下，这种区别并不重要，我们只需关注\
  \ `PersistentVolumeClaim`。然而，这种区别在两种情况下是重要的：\n\n*   管理员可以手动创建 `PersistentVolume`，该\
  \ `PersistentVolume` 可以直接挂载到 `Pod` 中。\n*   如果按照 `PersistentVolumeClaim` 指定分配存储出现问题，将不会创建\
  \ `PersistentVolume`。\n\n为了说明，首先我们从一个分配存储的 `PersistentVolumeClaim` 开始：\n\n*pvc.yaml*\n\
  \n```\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: nginx-storage\n\
  spec:\n  storageClassName: longhorn\n```\n\n我们将 `PersistentVolumeClaim` 命名为 `nginx-storage`，因为我们稍后将使用它。`StorageClass`\
  \ `longhorn` 会调用 `PersistentVolume` 来分配存储，创建一个 `PersistentVolume`：\n\n```\n---\n\
  apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: nginx-storage\n\
  spec:\n  storageClassName: longhorn\n  accessModes:\n    - ReadWriteOnce\n  resources:\n\
  \      storage: 100Mi\n```\n\n缩写 `pv` 是 `persistentvolumes` 的简写，尽管这里还没有 `persistentvolumes`\
  \ 卷。\n\n*pvc.yaml*\n\n```yaml\n---\napiVersion: v1\nkind: PersistentVolumeClaim\n\
  metadata:\n  name: manual\nspec:\n  storageClassName: manual\n  accessModes:\n \
  \   - ReadWriteOnce\n  resources:\n      storage: 100Mi\n```\n\n我们的 `PersistentVolumeClaim`\
  \ 状态为 `Pending`，且没有对应的 `PersistentVolume`。然而，作为集群管理员，我们可以手动创建这个 `PersistentVolume`：\n\
  \n*pv.yaml*\n\n```yaml\n---\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n\
  \  name: manual\nspec:\n  claimRef:\n    name: manual\n    namespace: default\n\
  \  accessModes:\n    - ReadWriteOnce\n  capacity:\n    storage: 100Mi\n  csi:\n\
  \    driver: driver.longhorn.io\n    volumeHandle: manual\n```\n\n以这种方式创建 `PersistentVolume`\
  \ 时，我们需要指定我们想要的卷的类型。在这种情况下，通过包含 `csi` 字段，我们识别出由 CSI 插件创建的卷。然后我们指定要使用的 `driver`，并为\
  \ `volumeHandle` 提供一个唯一值。在 `PersistentVolume` 创建后，Kubernetes 直接调用 Longhorn 存储驱动程序来分配存储。\n\
  \n由于我们为这个 `PersistentVolume` 指定了 `claimRef`，它将自动进入 `Bound` 状态：\n\n\n\n\n\n```\n\
  root@host01:~# kubectl get pv manual\nNAME     CAPACITY   ACCESS MODES   RECLAIM\
  \ POLICY   STATUS   ...\nmanual   100Mi      RWO            Retain           Bound\
  \    ...\n```\n\n这需要几秒时间，因此 `PersistentVolume` 可能会短暂显示为 Available（可用）。\n\n`PersistentVolumeClaim`\
  \ 也会进入 Bound（已绑定）状态：\n\n```\nroot@host01:~# kubectl get pvc manual\nNAME     STATUS\
  \   VOLUME   CAPACITY   ACCESS MODES   STORAGECLASS   AGE\nmanual   Bound    manual\
  \   100Mi      RWO            manual         2m20s\n```\n\n对于管理员来说，在应用程序需要特殊存储的罕少数情况下，手动创建\
  \ `PersistentVolume` 是很有用的。但对于大多数持久化存储，通过 `StorageClass` 以及 `PersistentVolumeClaim`\
  \ 或 `StatefulSet` 来自动化存储分配要好得多。\n\n## 部署 (Deployments)\n\n既然我们已经直接创建了 `PersistentVolumeClaim`\
  \ 并拥有关联卷，我们可以在 `Deployment` 中使用它了。为了演示这一点，我们将展示如何使用持久化存储来存放由 NGINX Web 服务器提供的 HTML\
  \ 文件：\n\n`nginx.yaml`\n\n```\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
  \  name: nginx\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app:\
  \ nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n    spec:\n\
  \      containers:\n      - name: nginx\n        image: nginx\n        volumeMounts:\n\
  \       ➊ - name: html\n            mountPath: /usr/share/nginx/html\n      volumes:\n\
  \     ➋ - name: html\n          persistentVolumeClaim:\n            claimName: nginx-storage\n\
  ```\n\n将持久化存储挂载到我们的容器中需要两个步骤。首先，我们声明一个名为 `html` 的卷 ➋，它引用了我们创建的 `PersistentVolumeClaim`。这使得存储在\
  \ `Pod` 中可用。接下来，我们声明一个 `volumeMount` ➊，以指定该卷应该出现在容器文件系统的哪个位置。这两个这两个独立步骤的优势是，我们可以在同一个\
  \ `Pod` 的多个容器中挂载同一个卷，这使得即使在进程来自不同的容器镜像的情况下，我们也能通过文件在进程之间共享数据。\n\n这种能力允许了一些有趣的用例。例如，假设我们正在构建一个包含一些静态内容的\
  \ Web 应用。我们可能会部署一个 NGINX Web 服务器来提供这些内容，就像我们在这里这样做一样。同时，我们还需要一种更新内容的方法。我们可以通过在 `Pod`\
  \ 中运行定期检查新内容并更新与 NGINX 容器共享的持久化卷来实现。\n\n让我们创建 NGINX `Deployment`，这样我们就可以演示从持久化存储提供\
  \ HTML 文件。持久化存储启动时是空的，因此最初没有任何 Web 内容可以提供。让我们看看 NGINX 在这种情况下表现如何：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/nginx.yaml \ndeployment.apps/nginx created\n```\n\n一旦 NGINX\
  \ 服务器启动并运行，我们需要获取它的 IP 地址，以便我们使用 `curl` 发起 HTTP 请求：\n\n```\nroot@host01:~# IP=$(kubectl\
  \ get po -l app=nginx -o jsonpath='{..podIP}')\nroot@host01:~# curl -v http://$IP\n\
  ...\n* Connected to 172.31.25.200 (172.31.25.200) port 80 (#0)\n> GET / HTTP/1.1\n\
  ...\n< HTTP/1.1 403 Forbidden\n```\n\n在这种情况下，获取 IP 地址，我们使用 `kubectl` 的 `jsonpath`\
  \ 输出格式，而不是使用 `jq` 来过滤 JSON 输出；`jsonpath` 具有非常实用的语法，用于搜索 JSON 对象并提取单个唯一命名的字段（在本例中为\
  \ `podIP`）。我们可以使用类似于我们在 第 8 章 中执行的 `jq` 过滤器，但 `jq` 的递归语法更复杂。\n\n获取 IP 后，我们使用 `curl`\
  \ 连接 NGINX。如预期的那样，我们没有看到 HTML 响应，因为我们的持久化存储是空的。但是，我们知道卷挂载正确，因为在这种情况下我们甚至没有看到默认的\
  \ NGINX 欢迎页面。\n\n复制一个 `index.html` 文件，让我们的 NGINX 服务器有内容提供：\n\n```\nroot@host01:~#\
  \ POD=$(kubectl get po -l app=nginx -o jsonpath='{..metadata.name}')\nroot@host01:~#\
  \ kubectl cp /opt/index.html $POD:/usr/share/nginx/html\n```\n\n首先，我们捕获由 `Deployment`\
  \ 随机生成的 `Pod` 名称，然后使用 `kubectl cp` 复制 HTML 文件。如果我们再次尝试运行 `curl`，我们将看到更好的响应：\n\n\
  ```\nroot@host01:~# curl -v http://$IP\n...\n* Connected to 172.31.239.210 (172.31.239.210)\
  \ port 80 (#0)\n> GET / HTTP/1.1\n...\n< HTTP/1.1 200 OK\n...\n<html>\n  <head>\n\
  \    <title>Hello, World</title>\n  </head>\n  <body>\n    <h1>Hello, World!</h1>\n\
  \  </body>\n</html>\n...\n```\n\n```\n\n由于这是持久化存储，即使我们删除了 `Deployment` 并重新创建它，此\
  \ HTML 内容仍然可用。\n\n然而，我们仍然有一个重大的问题需要解决。拥有 `Deployment` 的主要原因之一是能够扩展到多个 `Pod` 实例。扩展此\
  \ `Deployment` 很有意义，因为我们可以有多个 `Pod` 实例提供相同的 HTML 内容。遗憾的是，目前扩展无法工作：\n\n```\nroot@host01:~#\
  \ kubectl scale --replicas=3 deployment/nginx\ndeployment.apps/nginx scaled\n```\n\
  \n`Deployment` 似乎扩展了，但如果我们查看 `Pods`，我们会发现并没有真正有多个运行中的实例：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME                    READY   STATUS              RESTARTS\
  \   AGE\n...\nnginx-db4f4d5d9-7q7rd   0/1     ContainerCreating   0          46s\n\
  nginx-db4f4d5d9-gbqxm   0/1     ContainerCreating   0          46s\nnginx-db4f4d5d9-vrzr4\
  \   1/1     Running             0          10m\n```\n\n两个新实例卡在了 `ContainerCreating`\
  \ 状态。让我们检查其中一个 `Pod` 看看为什么：\n\n```\nroot@host01:~# kubectl describe pod/nginx-db4f4d5d9-7q7rd\n\
  Name:           nginx-db4f4d5d9-7q7rd\n...\nStatus:         Pending\nEvents:\n \
  \ Type     Reason              Age   From                     Message\n  ----  \
  \   ------              ----  ----                     -------\n...\n  Warning \
  \ FailedAttachVolume  110s  attachdetach-controller  Multi-Attach \n    error for\
  \ volume \"pvc-cb671684-1719-4c33-9dd8-bcbbf2452b4\" Volume is \n    already used\
  \ by pod(s) nginx-db4f4d5d9-vrzr4\n```\n\n\n\n\nLonghorn 确实支持 `ReadWriteMany`，因此创建一个具有\
  \ `ReadWriteMany` 访问模式的 `PersistentVolumeClaim` 是一个简单的更改：\n\n`pvc-rwx.yaml`\n\n\
  ```\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: storage\n\
  spec:\n  storageClassName: longhorn\n  accessModes:\n    - ReadWriteMany\n  resources:\n\
  \    requests:\n      storage: 100Mi\n```\n\n遗憾的是，我们无法通过修改现有的 `PersistentVolumeClaim`\
  \ 来更改访问模式。而且当 `Deployment` 正在使用存储时，我们无法删除 `PersistentVolumeClaim`。因此，我们需要清理所有内容然后重新部署：\n\
  \n```\nroot@host01:~# kubectl delete deploy/nginx pvc/storage\ndeployment.apps \"\
  nginx\" deleted\npersistentvolumeclaim \"storage\" deleted\nroot@host01:~# kubectl\
  \ apply -f /opt/pvc-rwx.yaml \npersistentvolumeclaim/storage created\nroot@host01:~#\
  \ kubectl apply -f /opt/nginx.yaml \ndeployment.apps/nginx created\n```\n\n我们指定\
  \ `deploy/nginx` 和 `pvc/storage` 为要删除的资源。这种标识资源的方式允许我们在同一条命令中操作两个资源。\n\n大约一分钟后，新的\
  \ NGINX Pod 将开始运行：\n\n```\nroot@host01:~# kubectl get pods\nNAME               \
  \     READY   STATUS      RESTARTS   AGE\n...\nnginx-db4f4d5d9-6thzs   1/1     Running\
  \     0          44s\n```\n\n此时，我们需要再次拷贝 HTML 内容，因为删除 `PersistentVolumeClaim` 会导致之前的存储被删除：\n\
  \n```\nroot@host01:~# POD=$(kubectl get po -l app=nginx -o jsonpath='{..metadata.name}')\n\
  root@host01:~# kubectl cp /opt/index.html $POD:/usr/share/nginx/html\n... no output\
  \ ...\n```\n\n这一次，当我们扩容 NGINX `Deployment` 时，额外的两个 Pod 能够挂载存储并开始运行：\n\n```\nroot@host01:~#\
  \ kubectl scale --replicas=3 deploy nginx\ndeployment.apps/nginx scaled\nroot@host01:~#\
  \ kubectl get po\nNAME                    READY   STATUS      RESTARTS   AGE\n...\n\
  nginx-db4f4d5d9-2j629   1/1     Running     0          23s\nnginx-db4f4d5d9-6thzs\
  \   1/1     Running     0          5m19s\nnginx-db4f4d5d9-7r5qj   1/1     Running\
  \     0          23s\n```\n\n所有三个 NGINX Pod 都提供相同的内容，我们可以通过获取其中一个新 Pod 的 IP 地址并连接它来验证：\n\
  \n```\nroot@host01:~# IP=$(kubectl get po nginx-db4f4d5d9-2j629 -o jsonpath='{..podIP}')\n\
  root@host01:~# curl http://$IP\n<html>\n  <head>\n    <title>Hello, World</title>\n\
  \  </head>\n  <body>\n    <h1>Hello, World!</h1>\n  </body>\n</html>\n```\n\n此时，我们可以使用任何一个\
  \ NGINX Pod 来更新 HTML 内容，并且所有 Pod 都会提供新内容。我们甚至可以使用一个独立的 `CronJob` 配合一个动态更新内容的应用程序组件，NGINX\
  \ 会很乐意提供现场存在的任何文件。\n\n### 结语\n\n持久化存储是构建功能完整的应用程序的基本要求。在集群管理员配置了一个或多个存储类（storage\
  \ classes）后，应用程序开发者很容易作为应用程序部署的一部分动态请求持久化存储。在大多数情况下，实现此点的最佳方法是使用 `StatefulSet`，因为\
  \ Kubernetes 会自动为每个 Pod 分配独立的存储，并在故障转移和升级期间维护 Pod 与存储之间的一一关系。\n\n同时，还有其他存储用例，例如多个\
  \ Pod 访问相同的存储。我们可以通过直接创建 `PersistentVolumeClaim` 资源，然后将其声明为 `Deployment` 或 `Job`\
  \ 等控制器的卷，来轻松处理这些用例。\n\n尽管持久化存储是让容器获取文件内容的有效方法，但 Kubernetes 还有其他强大的资源类型可以存储配置数据并将其作为环境变量或文件内容传递给容器。在下一章中，我们将探索如何管理配置和秘密（Secrets）。\n\
  \n# 16 配置与秘密\n\n![image](img/common01.jpg)\n\n任何高质量的应用程序在设计时，使得关键配置项可以在运行时注入，而不是嵌入在源代码中。当我们把应用程序组件移动到容器时，我们需要一种方法告诉容器运行时注入哪些配置信息，以确保我们的应用程序组件按照预期方式运行。\n\
  \nKubernetes 提供了两种主要的资源类型来注入这些配置信息：`ConfigMap` 和 `Secret`。这两个资源在功能上非常相似，但用例略有不同。\n\
  \n### 注入配置\n\n当我们在第一部分 中查看容器运行时时，我们看到可以向容器传递环境变量。当然，由于 Kubernetes 为我们管理容器运行时，我们首先需要将该信息传递给\
  \ Kubernetes，然后由它再为我们把该信息传递给容器运行时。\n\n**注意**\n\n*本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。*\n\
  \n对于简单的配置，我们可以直接从 Pod 定义中提供环境变量。我们在创建 PostgreSQL 服务器时已经看到了这种 Pod 形式的示例。\n\n`pgsql.yaml`\n\
  \n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: postgres\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: postgres\n  template:\n\
  \    metadata:\n      labels:\n        app: postgres\n    spec:\n      containers:\n\
  \      - name: postgres\n        image: postgres\n        env:\n        - name:\
  \ POSTGRES_PASSWORD\n          value: \"supersecret\"\n```\n\n当我们直接在 Deployment\
  \ 中提供环境变量时，这样做有两个重要问题。首先，灵活性降低，我们无法在不更改 Deployment YAML 文件的情况下为环境变量指定新值。其次，密码在 Deployment\
  \ YAML 文件中明文可见。YAML 文件通常会被提交到源码控制，因此我们很难保护密码。\n\n### GitOps\n\n定义 Kubernetes 资源的\
  \ YAML 文件之所以被提交到源码控制，是因为这是管理应用程序部署的最佳方式。GitOps 是一种最佳实践，将所有配置保留在 Git 仓库中。这包括集群配置、负载均衡器、入口控制器和存储插件等其他基础设施组件，以及构建、组合和部署应用程序的所有信息。GitOps\
  \ 提供了更改日志，避免了随时间推移可能发生的配置漂移，并确保了开发、测试和生产环境的一致性。不仅如此，`FluxCD` 和 `ArgoCD` 等 GitOps\
  \ 工具可以用于监控 Git 仓库的变化，并自动拉取最新配置来更新集群。\n\n#### 外部化配置\n\n让我们先看看将配置从 Deployment 中移出；然后我们考虑保护密码的最佳方法。\n\
  \n\n\n将配置外部化，将其存储在单独的资源并在 Deployment 中引用它，会更好。为了实现这一点，Kubernetes 提供了 `ConfigMap`\
  \ 资源。`ConfigMap` 规定了一组键值对，在指定 Pod 时可以引用这些键值对。例如，我们可以这样定义 PostgreSQL 配置：\n\n`pgsql-cm.yaml`\n\
  \n```yaml\n---\nkind: ConfigMap\napiVersion: v1\nmetadata:\n  name: pgsql\ndata:\n\
  \  POSTGRES_PASSWORD: \"supersecret\"\n```\n\n通过将这些配置信息存储在 `ConfigMap` 中，它不再直接作为\
  \ Deployment YAML 文件或 Deployment 的集群配置的一部分。\n\n在我们定义了 `ConfigMap` 之后，就可以在 Deployment\
  \ 中引用它，如列表 16-1 所示。\n\n`pgsql-ext-cfg.yaml`\n\n```yaml\n---\nkind: Deployment\n\
  apiVersion: apps/v1\nmetadata:\n  name: postgres\nspec:\n  replicas: 1\n  selector:\n\
  \    matchLabels:\n      app: postgres\n  template:\n    metadata:\n      labels:\n\
  \        app: postgres\n    spec:\n      containers:\n      - name: postgres\n \
  \       image: postgres\n        envFrom:\n        - configMapRef:\n           \
  \ name: pgsql\n```\n\n`Listing 16-1: 使用 ConfigMap 的 PostgreSQL`\n\n我们使用 `envFrom`\
  \ 字段代替 `env` 字段，该字段指定一个或多个 `ConfigMaps` 作为容器的环境变量。`ConfigMap` 中的所有键值对将成为环境变量。\n\n\
  这与直接在 Deployment 中指定一个或多个环境变量的效果相同，但我们的 Deployment 规范现在是可重用的。Deployment 将在自己的 `Namespace`\
  \ 中查找指定的 `ConfigMap`，因此我们可以在不同的 `Namespaces` 中拥有相同规范的多个 Deployment，并且每个都可以有不同的配置。\n\
  \n这种使用 `Namespace` 隔离来防止命名冲突，结合我们在第 11 章中看到的 `Namespace` 范围安全控制，以及我们在第 14 章中看到的\
  \ `Namespace` 范围配额，使得单个集群可以被许多小组用于许多不同的用途，这一概念被称为`多租户`（multitenancy）。\n\n让我们创建这个\
  \ Deployment 并看看 Kubernetes 如何注入配置。首先，让我们创建实际的 Deployment：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f /opt/pgsql-ext-cfg.yaml \ndeployment.apps/postgres created\n\
  ```\n\n此命令成功完成，因为 Deployment 已经在集群中创建，但 Kubernetes 将无法启动任何 Pod，因为缺少 `ConfigMap`：\n\
  \n```bash\nroot@host01:~# kubectl get pods\nNAME                       READY  STATUS\
  \                      RESTARTS  AGE\npostgres-6bf595fcbc-s8dqz  0/1    CreateContainerConfigError\
  \  0         53s\n```\n\n如果我们现在创建 `ConfigMap`，就会发现 Pod 随后被创建了：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f /opt/pgsql-cm.yaml \nconfigmap/pgsql created\nroot@host01:~#\
  \ kubectl get pods\nNAME                        READY   STATUS    RESTARTS   AGE\n\
  postgres-6bf595fcbc-s8dqz   1/1     Running   0          2m41s\n```\n\nKubernetes\
  \ 可能需要一分钟左右的时间确定 `ConfigMap` 可用并启动 Pod。一旦 Pod 运行，我们就可以根据 `ConfigMap` 中的数据验证环境变量是否已成功注入：\n\
  \n```bash\nroot@host01:~# kubectl exec -ti postgres-6bf595fcbc-s8dqz -- /bin/sh\
  \ -c env\n...\nPOSTGRES_PASSWORD=supersecret\n...\n```\n\n`env` 命令打印出与进程相关的所有环境变量。因为\
  \ Kubernetes 为我们的 `/bin/sh` 进程提供的环境变量与其提供给主 PostgreSQL 进程的环境变量相同，所以我们知道环境变量已按预期设置。然而，需要注意的是，尽管我们可以随时更改\
  \ `ConfigMap`，但这样做不会导致 Deployment 更新其 Pod；应用程序不会自动获取任何环境变量的更改。相反，我们需要对 Deployment\
  \ 应用某些配置更改，以触发它创建新的 Pod。\n\n尽管配置已经外部化，但我们仍然没有保护它。让我们接下来来做这一点。\n\n### 保护密钥 (Protecting\
  \ Secrets)\n\n在保护密钥（Secrets）时，思考合理的保护性质是重要的。例如，我们可能需要保护应用程序连接数据库时使用的身份验证信息。然而，由于应用程序本身需要这些信息来建立连接，任何可以检查应用程序内部细节的人都能提取这些凭据。\n\
  \n正如我们在第 11 章中看到的，Kubernetes 对给定 `Namespace` 中的每个单独资源类型提供了细粒度的访问控制。为了启用密钥的保护，Kubernetes\
  \ 提供了一个单独资源类型 `Secret`。这样，对密钥的访问就可以限制为仅需要访问的用户，这一原则被称为`最小权限`（least privilege）。\n\
  \n`Secret` 资源类型的另一个优势是它对所有数据都使用 base64 编码，并在将数据提供给 Pod 时自动解码，这简化了二进制数据的存储。\n\n####\
  \ 加密密钥数据 (ENCRYPTING SECRET DATA)\n\n默认情况下，存储在 `Secret` 中的数据是经过 base64 编码的，但不是加密的。可以加密数据，这样做对于生产集群是良好实践，但请记住，存储时数据必须是加密。`Secret`\
  \ 的定义与 `ConfigMap` 几乎相同，但也有细微的差别。当我们定义这个 Secret 时，我们将键值对放在 `stringData` 字段中，而不是\
  \ `data`。\n\n`pgsql-secret.yaml`\n\n```yaml\n---\nkind: Secret\napiVersion: v1\n\
  metadata:\n  name: pgsql\nstringData:\n  POSTGRES_PASSWORD: \"supersecret\"\n```\n\
  \n尽管我们使用 `stringData` 字段指定数据，Kubernetes 会为我们进行编码：\n\n```bash\nroot@host01:~# kubectl\
  \ apply -f /opt/pgsql-secret.yaml \nsecret/pgsql created\nroot@host01:~# kubectl\
  \ get secret pgsql -o json | jq .data\n{\n  \"POSTGRES_PASSWORD\": \"c3VwZXJ=\"\n\
  }\n```\n\n我们也可以自己进行 base64 编码。在这种情况下，我们将值直接放入 `data` 字段：\n\n`pgsql-secret-2.yaml`\n\
  \n```yaml\n---\nkind: Secret\napiVersion: v1\nmetadata:\n  name: pgsql\ndata:\n\
  \  POSTGRES_PASSWORD: c3VwZXJzZWZXQ=\n```\n\n这种方法对于我们在 YAML 资源定义中为 Secret 定义二进制内容是必要的。\n\
  \n我们在 Deployment 定义中使用 Secret 的方式与使用 ConfigMap 的完全相同：\n\n`pgsql-ext-sec.yaml`\n\n\
  ```yaml\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: postgres\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: postgres\n  template:\n\
  \    metadata:\n      labels:\n        app: postgres\n    spec:\n      containers:\n\
  \      - name: postgres\n        image: postgres\n        envFrom:\n        - secretRef:\n\
  \            name: pgsql\n```\n\n唯一的更改是使用 `secretRef` 代替 `configMapRef`。\n\n为了测试这一点，让我们应用这个新的\
  \ Deployment 配置：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/pgsql-ext-sec.yaml\
  \ \ndeployment.apps/postgres configured\n```\n\n从 Pod 的角度来看，行为完全相同。Kubernetes 处理\
  \ base64 解码，使解码后的值对我们的 Pod 可见。\n\n\n\n\n```\nroot@host01:~# kubectl get pods\nNAME\
  \                        READY   STATUS        RESTARTS   AGE\npostgres-6bf595fcbc-s8dqz\
  \   1/1     Terminating   0          12m\npostgres-794ff85bbf-xzz49   1/1     Running\
  \       0          26s\nroot@host01:~# kubectl exec -ti postgres-794ff85bbf-xzz49\
  \ -- /bin/sh -c env\n...\nPOSTGRES_PASSWORD=supersecret\n...\n```\n\n如之前所示，我们使用\
  \ `env` 命令来显示 `POSTGRES_PASSWORD` 环境变量已按预期设置。无论我们直接指定环境变量，还是使用 `ConfigMap` 或 `Secret`，Pod\
  \ 看到的行为都是相同的。\n\n在继续之前，让我们删除这个 `Deployment`：\n\n```\nroot@host01:~# kubectl delete\
  \ deploy postgres\ndeployment.apps \"postgres\" deleted\n```\n\n\n\n通过使用 `ConfigMaps`\
  \ 和 `Secrets`，我们能够将应用程序的环境变量配置外部化，以便我们的 `Deployment` 规范可以复用，并便于对秘密数据进行细粒度的访问控制。\n\
  \n### 注入文件\n\n当然，环境变量不是我们配置应用程序的唯一常用方法。我们还需要一种提供配置的方法。我们可以使用已经过的 `ConfigMap` 和 `Secret`\
  \ 资源来实现这一点。\n\n我们通过这种方式注入的任何文件都会覆盖容器镜像中存在的文件，这意味着我们可以为容器镜像提供一个合理的默认配置，然后在运行每个容器时覆盖该配置。这使得复用容器镜像变得简单得多。\n\
  \n在 `ConfigMap` 中指定文件内容并将其挂载到容器中的功能对于配置文件来说非常有用，但我们也可以用它来更新我们在第 15 章中展示的 NGINX Web\
  \ 服务器示例。正如我们将看到的，在这个版本中，我们可以仅使用 Kubernetes 资源 YAML 文件来声明 HTML 内容，而无需控制命令将内容复制到 `PersistentVolume`\
  \ 中。\n\n第一步是定义包含我们要服务的 HTML 内容的 `ConfigMap`：\n\n`nginx-cm.yaml`\n\n```yaml\n---\n\
  kind: ConfigMap\napiVersion: v1\nmetadata:\n  name: nginx\ndata:\n  index.html:\
  \ |\n    <html>\n      <head>\n        <title>Hello, World</title>\n      </head>\n\
  \      <body>\n        <h1>Hello, World from a ConfigMap!</h1>\n      </body>\n\
  \    </html>\n```\n\n键值对中的键部分用于指定所需的文件，在本例中为 `index.html`。为了方便易读，我们使用管道字符（`|`）开始一个\
  \ YAML 多行字符串。只要后续行保持缩进，该字符串就会持续，或者直到 YAML 文件的结束。我们可以通过只需向 `ConfigMap` 添加更多键来以这种方式定义多个文件。\n\
  \n在列表 16-1 中看到的 `Deployment` 中，我们将 `ConfigMap` 指定为环境变量的源。在这里，将其指定为卷挂载的源：\n\n`nginx-deploy.yaml`\n\
  \n```yaml\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: nginx\n\
  spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
  \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
  \      - name: nginx\n        image: nginx\n        volumeMounts:\n        - name:\
  \ nginx-files\n          mountPath: /usr/share/nginx/html\n      volumes:\n    \
  \    - name: nginx-files\n          configMap:\n            name: nginx\n```\n\n\
  这个卷定义与我们在第 15 章中看到的相似。如之前一样，卷规范包含两个部分。`volume` 字段指定了卷的来源，在本例中为 `ConfigMap`。`volumeMounts`\
  \ 允许我们指定容器中应可用文件的路径。除了可以在 Pod 的多个容器中使用同一个卷外，这这意味着我们在挂载持久化卷和将配置作为文件挂载到容器文件系统时，可以使用相同的语法。\n\
  \n让我们创建 `ConfigMap`，然后启动这个 `Deployment`：\n\n```\nroot@host01:~# kubectl apply -f\
  \ /opt/nginx-cm.yaml \nconfigmap/nginx created\nroot@host01:~# kubectl apply -f\
  \ /opt/nginx-deploy.yaml\ndeployment.apps/nginx created\n```\n\nPod 运行后，我们可以看到文件内容是符合预期的，并且\
  \ NGINX 正在提供我们的 HTML 文件：\n\n```\nroot@host01:~# IP=$(kubectl get po -l app=nginx\
  \ -o jsonpath='{..podIP}')\nroot@host01:~# curl http://$IP\n<html>\n  <head>\n \
  \   <title>Hello, World</title>\n  </head>\n  <body>\n    <h1>Hello, World from\
  \ a ConfigMap!</h1>\n  </body>\n</html>\n```\n\n输出与我们在第 15 章中当提供 HTML 内容作为 `PersistentVolume`\
  \ 时看到的相似，但我们能够避免了挂载 `PersistentVolume` 然后向其复制内容的精力。在实践中，两种方法都有价值，因为维护一个包含大量数据的 `ConfigMap`\
  \ 会变得难以管理。\n\n（注：原文后续存在大量重复段落，译文已根据要求不再重复输出，仅保留核心内容。）\n\n\n\n\n`ETCDCTL_KEY` 使用此私钥对\
  \ etcd 进行身份验证。\n\n`ETCDCTL_ENDPOINTS` 连接到此 URL 的 etcd。虽然 etcd 运行在所有三个节点上，但我们只需要其中一个节点即可与之通信。\n\
  \n在我们的示例中，这些环境变量被方便地存储在 `/opt` 下的一个脚本中，以便我们可以加载它们并供后续命令使用：\n\n```\nroot@host01:~#\
  \ source /opt/etcd-env\n```\n\n我们现在可以使用 `etcdctl` 命令来检查集群以及它存储的配置数据。让我们先列出集群成员：\n\
  \n```\nroot@host01:~# etcdctl member list\n45a2b6125030fdde, started, host02, https://192.168.61.12:2380,\
  \ https://192.168.61.12:2379\n91007aab9448ce27, started, host03, https://192.168.61.13:2380,\
  \ https://192.168.61.13:2379\nbf7b9991d532ba78, started, host01, https://192.168.61.11:2380,\
  \ https://192.168.61.11:2379\n```\n\n正如预期的，每个控制平面节点都有一个 etcd 实例。对于高可用配置，我们需要运行至少三个实例，并且需要其中大多数实例处于运行状态集群才能保持健康。此\
  \ `etcdctl` 命令是确定集群是否存在任何故障节点的良好第一步。\n\n只要集群是健康的，我们就可以存储和检索数据。在 etcd 内部，信息以键值对（key–value\
  \ pairs）的形式存储。键指定为层次结构路径。我们可以列出包含内容的路径：\n\n```\nroot@host01:~# etcdctl get / --prefix\
  \ --keys-only\n...\n/registry/configmaps/default/nginx\n/registry/configmaps/default/pgsql\n\
  ...\n/registry/secrets/default/pgsql\n...\n```\n\n`--prefix` 标志告诉 `etcdctl` 获取所有以\
  \ `/` 开头的键，而 `--keys-only` 则确保只打印键，以防止被数据淹没。尽管如此，仍然返回了大量信息，包括我们在书中描述的所有各种 Kubernetes\
  \ 资源类型。还包括我们刚刚创建的 ConfigMaps 和 Secrets。\n\n### 解密 etcd 中的数据\n\n通常情况下，我们可以依赖 Kubernetes\
  \ 在 etcd 中存储正确的配置数据，并依赖 `kubectl` 来查看当前的集群配置。然而，了解底层数据存储的工作原理是有帮助的，以防我们在集群宕机或处于异常状态时需要检查配置。\n\
  \n为了节约存储空间和带宽，etcd 和 Kubernetes 都使用 protobuf 库，这是一种语言无关的二进制数据格式。由于我们使用 `etcdctl`\
  \ 从 etcd 获取数据，我们可以要求它以 JSON 格式返回数据；但是，这些 JSON 数据将包含一个嵌入的带有 Kubernetes 数据的 protobuf\
  \ 结构，因此我们还需要对其进行解码。\n\n让我们从检查 etcd 中 Kubernetes Secret 的 JSON 格式开始。我们将通过 `jq` 对输出进行格式化：\n\
  \n```\nroot@host01:~# etcdctl -w json get /registry/secrets/default/pgsql | jq\n\
  {\n  \"header\": {\n...\n  },\n  \"kvs\": [\n    {\n      \"key\": \"L3JlZ2lzdHJ5L3NlY3JldHMvZGVmYXVsdC9wZ3NxbA==\"\
  ,\n      \"create_revision\": 14585,\n      \"mod_revision\": 14585,\n      \"version\"\
  : 1,\n      \"value\": \"azhzAAoMCgJ2MRIGU2...\"\n    }\n  ],\n  \"count\": 1\n\
  }\n```\n\n`kvs` 字段包含了 Kubernetes 为此 Secret 存储的键值对。键的值是一个简单的 base64 编码字符串：\n\n```\n\
  root@host01:~# echo $(etcdctl -w json get /registry/secrets/default/pgsql \\\n|\
  \ jq -r '.kvs[0].key' | base64 -d)\n/registry/secrets/default/pgsql\n```\n\n我们使用\
  \ `jq` 仅提取键的值并以原始格式（不带引号）返回，然后使用 `base64` 解码该字符串。\n\n当然，这个键值对中有趣的部分是值，因为它包含了实际的\
  \ Kubernetes Secret。虽然值也是 base64 编码的，但我们需要进行更多的解理工作来访问其信息。\n\n在解码 base64 值后，我们将得到一个\
  \ protobuf 消息。然而，它包含一个 Kubernetes 用于允许未来存储格式变化的魔数前缀。如果我们查看解码后值的几个字节，就可以看到这个前缀：\n\
  \n```\nroot@host01:~# etcdctl -w json get /registry/secrets/default/pgsql \\\n|\
  \ jq -r '.kvs[0].value' | base64 -d | head --bytes=10 | xxd\n00000000: 6b38 7300\
  \ 0a0c 0a02 7631\n```\n\n`00000000: 6b38 7300 0a0c 0a02 7631`\n\n\n\n\n\n在第 6 章中，我们讨论了\
  \ Kubernetes API 服务器如何提供声明式 API，其主要操作是在集群中创建、读取、更新和删除资源。声明式 API 在韧性方面具有优势，因为集群可以跟踪资源的期望状态，并努力确保集群保持在该期望状态。然而，声明式\
  \ API 在扩展性方面也具有显著优势。API 服务器提供的操作通用性极强，易于将它们扩展到任何类型的资源。\n\n我们已经看到 Kubernetes 如何利用这种扩展性随时间推移更新其\
  \ API。Kubernetes 不仅随着时间推移支持资源的新版本，还可以向集群添加具有新功能的全新资源，同时通过旧资源保持向后兼容性。我们在第 7 章中对 `HorizontalPodAutoscaler`\
  \ 版本 2 的新功能的讨论，以及 `Deployment` 如何取代 `ReplicationController` 的讨论中看到了这一点。\n\n在使用 `CustomResourceDefinitions`（自定义资源定义）时，我们真正看到了这种扩展性的威力。`CustomResourceDefinition`（或\
  \ `CRD`）允许我们动态地向集群添加任何新资源类型。我们只需向 API 服务器提供新资源类型的名称和用于验证的规范，API 服务器便会立即允许我们创建、读取、更新和删除该新类型的资源。\n\
  \nCRDs 非常有用且被广泛使用。例如，已经部署到我们集群中的基础设施组件就包含了 CRDs。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页 上的“运行示例”获取有关设置的详细信息。\n\n让我们看看已经注册到我们集群的 CRD：\n\n```\nroot@host01:~# kubectl\
  \ get crds\nNAME                                                  CREATED AT\n...\n\
  clusterinformations.crd.projectcalico.org             ...\n...\ninstallations.operator.tigera.io\
  \                      ...\n...\nvolumes.longhorn.io                           \
  \        ...\n```\n\n为了避免命名冲突，CRD 名称必须包含一个组（group），该组通常基于域名以确保唯一性。该组还用于为 API 服务器提供的\
  \ REST API 建立该资源的路径。在这个示例中，我们看到了 `crd.projectcalico.org` 组和 `operator.tigera.io`\
  \ 组中的 CRD，它们都被 Calico 使用。我们还看到了 `longhorn.io` 组中的 CRD，它由 Longhorn 使用。\n\n这些 CRDs\
  \ 允许 Calico 和 Longhorn 使用 Kubernetes API 在 `etcd` 中记录配置和状态信息。CRDs 还简化了自定义配置。例如，作为将\
  \ Calico 部署到集群的一部分，自动化创建了一个对应于 `installations.operator.tigera.io` CRD 的 `Installation`\
  \ 资源：\n\n`custom-resources.yaml`\n\n```yaml\n---\napiVersion: operator.tigera.io/v1\n\
  kind: Installation\nmetadata:\n  name: default\nspec:\n  calicoNetwork:\n    ipPools:\n\
  \    - blockSize: 26\n      cidr: 172.31.0.0/16\n...\n```\n\n该配置正是我们看到 Pod 在 `172.31.0.0/16`\
  \ 网段中获取 IP 地址的原因。该 YAML 文件被自动放置在 `/etc/kubernetes/components` 中，并作为 Calico 安装的一部分自动应用到集群。在部署时，Calico\
  \ 会查询 API 服务器获取此 `Installation` 资源的实例并相应配置网络。\n\n### 创建 CRDs\n\n让我们通过创建自己的 CRD 来进一步探索\
  \ CRDs。我们将使用列表 17-1 中提供的定义。\n\n`crd.yaml`\n\n```yaml\n ---\n apiVersion: apiextensions.k8s.io/v1\n\
  \ kind: CustomResourceDefinition\n metadata:\n➊ name: samples.bookofkubernetes.com\n\
  \ spec:\n➋ group: bookofkubernetes.com\n   versions:\n  ➌ - name: v1\n       served:\
  \ true\n       storage: true\n       schema:\n         openAPIV3Schema:\n      \
  \     type: object\n           properties:\n             spec:\n               type:\
  \ object\n               properties:\n                 value:\n                \
  \   type: integer\n➍ scope: Namespaced\n   names:\n➎ plural: samples\n➏ singular:\
  \ sample\n➐ kind: Sample\n     shortNames:\n    ➑ - sam\n```\n\n*列表 17-1：示例 CRD*\n\
  \n此定义包含多个重要部分。首先，定义了多种类型的名称。metadata 名称字段 ➊ 必须结合资源的复数名称 ➎ 和组 ➋。这些命名组件对于通过 API 访问也至关重要。\n\
  \n命名还包括 YAML 文件中使用的 `kind` ➐。这意味着当我们根据此 CRD 创建特定资源时，我们将用 `kind: Sample` 来标识它们。最后，我们需要定义如何在命令行中引用此\
  \ CRD 的实例。这包括在单数字段 ➏ 中指定的资源全称，以及我们希望命令行识别的任何 `shortNames`（短名称） ➑。\n\n现在，由于我们已经为\
  \ Kubernetes 提供了基于此 CRD 实例的所有必要名称，我们就可以继续讨论 CRD 是如何被跟踪的以及它包含哪些数据。`scope`（范围） ➍ 告诉\
  \ Kubernetes 该资源应该是命名空间范围（Namespaced）的还是集群范围（cluster-wide）的。仅仅通过声明我们的 CRD，我们就扩展了\
  \ Kubernetes 集群的行为，使其能够理解 `samples` 是什么，我们不仅可以在 API 中使用它，还可以在命令行工具中使用。\n\n让我们在集群创建创建\
  \ CRD：\n\n```\nroot@host01:~# kubectl apply -f /opt/crd.yaml\ncustomresourcedefinition...k8s.io/samples.bookofkubernetes.com\
  \ created\n```\n\n我们现在可以创建这种类型的对象并从集群中检索它们。这是一个创建一个新 `Sample` 的示例 YAML 定义：\n\n`sample.yaml`\n\
  \n```yaml\n---\napiVersion: bookofkubernetes.com/v1\nkind: Sample\nmetadata:\n \
  \ namespace: default\n  name: somedata\nspec:\n  value: 123\n```\n\n我们将 `apiVersion`\
  \ 和 `kind` 与我们的 CRD 匹配，并确保 `spec` 与模式（schema）一致。这意味着我们需要提供一个名为 `value` 的字段并赋予整数值。\n\
  \n我们现在可以像创建任何资源一样在集群中创建此资源：\n\n```\nroot@host01:~# kubectl apply -f /opt/somedata.yaml\
  \ \nsample.bookofkubernetes.com/somedata created\n```\n\n现在有一个 `somedata` 的 `Sample`\
  \ 资源，它属于默认命名空间。\n\n我们在列表 17-1 中定义 CRD 时，指定了资源的复数、单数和短名称。可以使用这些名称中的任何一个来检索新资源：\n\n\
  ```\nroot@host01:~# kubectl get samples\nNAME       AGE\nsomedata   56s\nroot@host01:~#\
  \ kubectl get sample\nNAME       AGE\nsomedata   59s\nroot@host01:~# kubectl get\
  \ sam\nNAME       AGE\nsomedata   62s\n```\n\n这意味着 `kubectl describe` 也适用于 `Samples`。我们可以看到\
  \ Kubernetes 还跟踪了与新资源相关的其他数据，而不仅仅是我们指定的数据。\n\n\n\n\n\n```\nroot@host01:~# kubectl\
  \ describe sample somedata\nName:         somedata\nNamespace:    default\n...\n\
  API Version:  bookofkubernetes.com/v1\nKind:         Sample\nMetadata:\n  Creation\
  \ Timestamp:  ...\n...\n  Resource Version:  9386\n  UID:               37cc58db-179f-40e6-a9bf-fbf6540aa689\n\
  Spec:\n  Value:  123\nEvents:   <none>\n```\n\n这些额外数据（包括时间戳和资源版本）对于如果我们想使用来自 CRD\
  \ 的数据至关重要。为了有效地使用我们的新资源，我们需要一个软件组件来持续监控资源的新实例或更新实例，并采取相应的行动。我们将使用普通的 Kubernetes\
  \ Deployment 运行此组件，它将与 Kubernetes API 服务器进行交互。\n\n### 监听 CRD\n\n对于 Kubernetes 核心资源，控制平面组件会与\
  \ API 服务器通信，以便在资源被创建、更新或删除时采取正确的操作。例如，控制器管理器（controller manager）包含一个监听 Services\
  \ 和 Pods 变化的组件，使其能够更新每个 Service 的端点列表。每个节点上的 `kube-proxy` 实例随后会进行必要的网络路由更改，根据这些端点将流量发送到\
  \ Pods。\n\n对于 CRD，API 服务器仅在资源被创建、更新和删除时对其进行跟踪。监控资源实例并采取正确操作是其他软件的职责。为了方便监控资源，API\
  \ 服务器提供了 `watch`（监听）操作，使用 `long polling`（长轮询）保持连接开启并在事件发生时持续推送事件。由于长轮询连接可能在任何时候断开，Kubernetes\
  \ 为我们跟踪的时间戳和资源版本数据将使我们在重新连接时检测到已经处理了哪些集群更改。\n\n我们可以直接通过 `curl` 命令或直接在 HTTP 客户端中使用\
  \ API 服务器的 watch 能力，但使用 Kubernetes 客户端库要简单得多。在本示例中，我们将使用 Python 客户端库来演示如何监听我们的自定义资源。以下是我们将要使用的\
  \ Python 脚本：\n\n`watch.py`\n\n```python\n ##!/usr/bin/env python3\n   from kubernetes\
  \ import client, config, watch\n   import json, os, sys\n\n   try:\n  ➊ config.load_incluster_config()\n\
  \   except:\n     print(\"In cluster config failed, falling back to file\", file=sys.stderr)\n\
  \  ➋ config.load_kube_config()\n\n➌ group = os.environ.get('WATCH_GROUP', 'bookofkubernetes.com')\n\
  \   version = os.environ.get('WATCH_VERSION', 'v1')\n   namespace = os.environ.get('WATCH_NAMESPACE',\
  \ 'default')\n   resource = os.environ.get('WATCH_RESOURCE', 'samples')\n   api\
  \ = client.CustomObjectsApi()\n\n   w = watch.Watch()\n➍ for event in w.stream(api.list_namespaced_custom_object,\n\
  \          group=group, version=version, namespace=namespace, plural=resource):\n\
  ➎ json.dump(event, sys.stdout, indent=2)\n    sys.stdout.flush()\n```\n\n为了连接到 API\
  \ 服务器，我们需要加载集群配置。这包括 API 服务器的位置以及我们在第 11 章 中看到的身份验证信息。如果我们在 Kubernetes Pod 的容器中运行，我们将自动获得这些信息，因此我们首先尝试加载集群内配置\
  \ ➊。但是，如果我们在 Kubernetes 集群之外，习惯是使用 Kubernetes 配置文件，因此我们将其作为备选选项 ➋。\n\n在建立与 API 服务器通信的方法后，我们使用自定义对象\
  \ API 和 watch 对象来流化与我们的自定义资源相关的事件 ➍。`stream()` 方法接收函数名和相关参数，这些参数是从环境变量或默认值中加载的 ➌。我们使用\
  \ `list_namespaced_custom_object` 函数是因为我们对自定义资源感兴趣。Python 库中所有各种 `list_*` 方法都设计为与\
  \ `watch` 配合工作，返回添加、更新和删除事件的流，而不是简单地获取当前对象的列表。当事件发生时，我们以易于阅读的格式将其打印到控制台 ➎。\n\n我们将在\
  \ Kubernetes Deployment 中使用此 Python 脚本。我已经构建并发布了一个容器镜像来运行它，所以这是一项简单的任务。以下是 Deployment\
  \ 定义：\n\n`watch.yaml`\n\n```yaml\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n\
  \  name: watch\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app:\
  \ watch\n  template:\n    metadata:\n      labels:\n        app: watch\n    spec:\n\
  \      containers:\n      - name: watch\n        image: bookofkubernetes/crdwatcher:stable\n\
  \      serviceAccountName: watcher\n```\n\n此 Deployment 将运行监听 Sample CRD 实例事件的 Python\
  \ 脚本。然而，在我们创建此 Deployment 之前，我们需要确保监听器脚本有权限读取我们的自定义资源。默认的 `ServiceAccount` 权限最小，因此我们需要为此\
  \ Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role`\
  \ 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的\
  \ Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment\
  \ 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount`\
  \ 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\
  \n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount`\
  \ 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此\
  \ Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role`\
  \ 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的\
  \ Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment\
  \ 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount`\
  \ 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\
  \n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount`\
  \ 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此\
  \ Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role`\
  \ 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的\
  \ Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment\
  \ 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount`\
  \ 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\
  \n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount`\
  \ 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此\
  \ Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role`\
  \ 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的\
  \ Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment\
  \ 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount`\
  \ 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\
  \n（注：由于输入文本中出现了大量重复段落，此处遵循了“不要重复输出原文”的原则，仅保留核心逻辑翻译部分）\n\n我们可以通过将自定义 `Role` 绑定到我们的\
  \ `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的\
  \ Sample 自定义资源。\n\n此 Deployment 将运行监听 Sample CRD 实例事件的 Python 脚本。然而，在我们创建此 Deployment\
  \ 之前，我们需要确保我们的监听器脚本有权限读取我们的自定义资源。默认的 `ServiceAccount` 权限最小，因此我们需要为此 Deployment 创建一个\
  \ `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\n我们可以通过将自定义 `Role` 绑定到我们的 `ServiceAccount`\
  \ 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount` 并确保它有权查看我们的 Sample 自定义资源。\n\
  \n我们可以通过一个自定义 `Role` 绑定到我们的 `ServiceAccount` 来实现这一点，但更方便的方法是为此 Deployment 创建一个 `ServiceAccount`\
  \ 并确保它有权查看我们的 Sample 自定义资源。\n\n通过一个自定义 `Role` 绑定我们的 `ServiceAccount` 来我们的 `自定义 ````\
  \ ` ` ` ` ` ` ` ` `````````````\n\n`\n\n```yamlyamlyaml\n\n\n\n\n\n\n\n.\n.yaml\n\
  kind:\n\nkind: Cluster\n\nmetadata:\n  name: reader\nrules:\n- apiGroups: [\"bookofkubernetes.com\"\
  ]\n  resources: [\"samples\"]\n  verbs: [\"get\", \"watch\", \"list\"]\n```\n\n\
  此 `ClusterRole` 赋予了 `get`、`watch` 和 `list` 我们的自定义资源权限。我们在 `metadata` 中添加一个标签 ➊ 来向集群表示我们将这些权限聚合到\
  \ `view` `ClusterRole`。因此，与其将我们的 `ServiceAccount` 绑定到定义的 `sample-reader` `ClusterRole`，我们可以通过聚合\
  \ ➋资源。\n\n我们首先定义 `ServiceAccount`：\n\n`sa.yaml`\n\n```yaml\n---\napiVersion: v1\n\
  kind: ServiceAccount\nmetadata:\n  name: watcher\n  namespace: default\n---\nkind:\
  \ RoleBinding\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n  name: viewer\n\
  \  namespace: default\nsubjects:\n- kind: ServiceAccount\n  name: watcher\n  namespace:\
  \ default\nroleRef:\n  kind: ClusterRole\n  name: view\n  apiGroup: rbac.authorization.k8s.io\n\
  ```\n\n我们使用 `RoleBinding` 将此 `ServiceAccount` 限制在 `default` `Namespace` 内的只读访问。`RoleBinding`\
  \ 将 watcher `ServiceAccount` 绑定到通用的 `ClusterRole`。\n\n我们现在准备好应用所有资源，包括我们的 Deployment：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/sample-reader.yaml \nclusterrole.rbac.authorization.k8s.io/sample-reader\
  \ created\nroot@host01:~# kubectl apply -f /opt/sa.yaml\nserviceaccount/watcher\
  \ created\nrolebinding.rbac.authorization.k8s.io/viewer created\nroot@host01:~#\
  \ kubectl apply -f /opt/watch.yaml \ndeployment.apps/watch created\n```\n\n过了一会儿，我们的\
  \ watcher Pod 将运行：\n\n```bash\nroot@host01:~# kubectl get pods\nNAME           \
  \          READY   STATUS    RESTARTS   AGE\nwatch-69876b586b-jp25m   1/1     Running\
  \   0          47s\n```\n\n我们可以打印监听器的日志，查看它从 API 服务器接收到的事件：\n\n\n\n\n\n```\nroot@host01:~#\
  \ kubectl logs watch-69876b586b-jp25m\n{\n  \"type\": \"ADDED\",\n  \"object\":\
  \ {\n    \"apiVersion\": \"bookofkubernetes.com/v1\",\n    \"kind\": \"Sample\"\
  ,\n    \"metadata\": {\n...\n      \"creationTimestamp\": \"...\",\n...\n      \"\
  name\": \"somedata\",\n      \"namespace\": \"default\",\n      \"resourceVersion\"\
  : \"9386\",\n      \"uid\": \"37cc58db-179f-40e6-a9bf-fbf6540aa689\"\n    },\n \
  \   \"spec\": {\n      \"value\": 123\n    }\n  },\n...\n```\n\n注意，监听器 Pod 接收到了针对我们创建的\
  \ `somedata` `Sample` 对象的 `ADDED` 事件，尽管我们在部署监听器之前就已经创建了该 `Sample`。API server 能够确定我们的监听器尚未获取此对象，因此它在连接建立时立即向我们发送一个事件，就像该对象是新创建的一样，这避免了我们本被迫处理的竞态条件。但请注意，如果客户端重启，它对于\
  \ API server 来说将是一个新客户端，并将再次看到同一个 `Sample` 的 `ADDED` 事件。因此，当我们实现处理自定义资源的逻辑时，确保逻辑是幂等的至关重要的，这样我们就可以处理多次处理同一个事件。\n\
  \n## 操作器 (Operators)\n\n除了将事件记录到控制台之外，针对自定义资源的创建、更新或删除，我们会采取哪些操作？正如我们在检查使用自定义资源配置集群中\
  \ Calico 网络的方式时看到的，自定义资源的一个用途是配置集群基础架构组件，例如网络和存储。但另一种真正充分利用自定义资源的模式是 Kubernetes\
  \ `Operator`。\n\nKubernetes `Operator` 模式扩展了集群的行为，使得部署和管理特定的应用程序组件变得更加简单。我们不再直接使用\
  \ `Deployments` 和 `Services` 等标准 Kubernetes 资源，而是只需创建特定于应用程序组件的自定义资源，由操作 为我们管理底层的\
  \ Kubernetes 资源。\n\n让我们来看一个示例来说明 Kubernetes `Operator` 模式的威力。我们将为集群添加一个 `Postgres\
  \ Operator`，它使我们能够通过添加单个自定义资源即可在集群中部署高用的 PostgreSQL 数据库。\n\n我们的自动化已经将所需文件存放在 `/etc/kubernetes/components`\
  \ 中并执行了一些初始设置，因此剩下的步骤是添加操作器。该操作器是一个普通的 `Deployment`，运行在我们选择的任何 `Namespace` 中。然后它将监听自定义的\
  \ `postgresql` 资源并根据此创建 PostgreSQL 实例。\n\n让我们部署操作器：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /etc/kubernetes/components/postgres-operator.yaml \ndeployment.apps/postgres-operator\
  \ created\n```\n\n这为操作器本身创建了一个 `Deployment`，它创建了一个的 `Pod`：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME                                 READY   STATUS    RESTARTS\
  \   AGE\npostgres-operator-5cdbff85d6-cclxf   1/1     Running   0          27s\n\
  ...\n```\n\n该 `Pod` 与 API server 通信以创建定义 PostgreSQL 数据库所需的 `CRD`：\n\n```\nroot@host01:~#\
  \ kubectl get crd postgresqls.acid.zalan.do\nNAME                        CREATED\
  \ AT\npostgresqls.acid.zalan.do   ...\n```\n\n集群中尚未运行任何 PostgreSQL 实例，但我们可以根据该 `CRD`\
  \ 创建一个自定义资源来轻松部署 PostgreSQL。\n\n`pgsql.yaml`\n\n```yaml\n---\napiVersion: \"acid.zalan.do/v1\"\
  \nkind: postgresql\nmetadata:\n  name: pgsql-cluster\n  namespace: default\nspec:\n\
  \  teamId: \"pgsql\"\n  volume:\n    size: 1Gi\n    storageClass: longhorn\n  numberOfInstances:\
  \ 3\n  users:\n    dbuser:\n    - superuser\n    - createdb\n  databases:\n    defaultdb:\
  \ dbuser\n  postgresql:\n    version: \"14\"\n```\n\n此自定义资源告诉 `Postgres Operator`\
  \ 使用服务器版本 14 生成一个 PostgreSQL 数据库，包含三个实例（一个主节点两个备份）。每个实例都将具有持久化存储。主实例将配置指定的用户和数据库。\n\
  \nKubernetes `Operator` 模式的真正价值在于，我们声明的 YAML 资源文件短小、简单，并且与我们想要看到的 PostgreSQL 配置密切相关。操作器的工作是将这些信息转换为\
  \ `StatefulSet`、`Services` 以及其他所需的集群资源以运行此数据库。\n\n我们像处理其他资源一样将此自定义资源应用到集群：\n\n```\n\
  root@host01:~# kubectl apply -f /opt/pgsql.yaml \npostgresql.acid.zalan.do/pgsql-cluster\
  \ created\n```\n\n应用之后，`Postgres Operator` 将接收到 `add` 事件，并为 PostgreSQL 创建必要的集群资源：\n\
  \n```\nroot@host01:~# kubectl logs postgres-operator-5cdbff85d6-cclxf\n... level=info\
  \ msg=\"Spilo operator...\"\n...\n... level=info msg=\"ADD event has been queued\"\
  \ \n  cluster-name=default/pgsql-cluster pkg=controller worker=0\n... level-info\
  \ msg=\"creating a new Postgres cluster\" \n  cluster-name=default/pgsql-cluster\n\
  ... level=info msg=\"statefulset \n  default/pgsql-cluster\\\" has been created\"\
  \ \n  cluster-name=default/pgsql-cluster\n...\n```\n\n最终，将有一个 `StatefulSet` 以及除操作器\
  \ `Pod` 之外的三个 `Pod`：\n\n```\nroot@host01:~# kubectl get sts\nNAME            READY\
  \   AGE\npgsql-cluster   3/3     2m39s\nroot@host01:~# kubectl get po\nNAME    \
  \                             READY   STATUS    RESTARTS   AGE\npostgres-operator-5cdbff85d6-cclxf\
  \   1/1     Running   0          4m6s\npgsql-cluster-0                      1/1\
  \     Running   0          2m40s\npgsql-cluster-1                      1/1     Running\
  \   0          2m18s\n...\n```\n```\n\n这些资源需要几分钟才能完全运行。与我们在第 15 章创建的 PostgreSQL\
  \ `StatefulSet` 不同，此 `StatefulSet` 中的所有实例都配置了高可用，我们可以通过检查每个 `Pod` 的日志来证明这一点：\n\n\
  ```\nroot@host01:~# kubectl logs pgsql-cluster-0\n... level=info msg=\"Lock owner:\
  \ None; I am pgsql-cluster-0\n... level=info msg=\"trying to bootstrap a new cluster\"\
  \n... level=info msg=\"initialized a new cluster\"\n... level=info msg=\"no action.\
  \ I am (pgsql-cluster-0) the leader\nroot@host01:~# kubectl logs pgsql-cluster-1\n\
  ... level=info msg=\"Lock owner: None; I am pgsql-cluster-1\n... level=info msg=\"\
  waiting for leader to bootstrap\"\n... level=info msg=\"Lock owner: pgsql-cluster-0;\
  \ I am pgsql-cluster-1\"\n```\n\n我们可以看到，第一个实例 `pgsql-cluster-0` 识别自己为主节点，而 `pgsql-cluster-1`\
  \ 则配置为从节点，用于同步主数据库的任何更新。\n\n为了管理 PostgreSQL 主节点和从节点并让数据库客户端访问主节点，操作器创建了多个 `Services`：\n\
  \n```\nroot@host01:~# kubectl get svc\nNAME                   TYPE        CLUSTER-IP\
  \      ... PORT(S)    AGE\n...\npgsql-cluster          ClusterIP   10.101.80.163\
  \   ... 5432/TCP   6m52s\npgsql-cluster-config   ClusterIP   None            ...\
  \ <none>     6m21s\npgsql-cluster-repl     ClusterIP   10.96.13.186    ... 5432/TCP\
  \   6m52s\n```\n\n`pgsql-cluster` `Service` 将流量路由到主节点；其他 `Services` 用于管理到备份实例的复制。当主节点因故障转移发生变化时，操作器负责更新\
  \ `Service`。\n\n要删除 PostgreSQL 数据库，我们只需要删除自定义资源，`Postgres Operator` 将处理剩余工作：\n\n\
  ```\nroot@host01:~# kubectl delete -f /opt/pgsql.yaml \npostgresql.acid.zalan.do\
  \ \"pgsql-cluster\" deleted\n```\n\n操作器检测到删除操作并清理相关的 Kubernetes 集群资源。\n\n\n\n\n\n\
  ```\nroot@host01:~# kubectl logs postgres-operator-5cdbff85d6-cclxf\n...\n... level=info\
  \ msg=\"deletion of the cluster started\" \n  cluster-name=default/pgsql-cluster\
  \ pkg=controller worker=0\n... level=info msg=\"DELETE event has been queued\" \n\
  \  cluster-name=default/pgsql-cluster pkg=controller worker=0\n...\n... level=info\
  \ msg=\"cluster has been deleted\" \n  cluster-name=default/pgsql-cluster pkg=controller\
  \ worker=0\n```\n\n`Postgres Operator` 现在已经删除了与该数据库集群相关的 `StatefulSet`、持久化存储和其他资源。\n\
  \n我们能够如此轻松地部署和移除 PostgreSQL 数据库服务器（包括自动配置在高可用配置中的多个实例），这证明了 Kubernetes Operator\
  \ 模式的威力。通过定义 `CRD`，普通的 `Deployment` 可以用来扩展我们 Kubernetes 集群的行为。其结果是无缝添加了新的集群能力，并且这些能力与\
  \ Kubernetes 集群的内置功能完全集成。\n\n### 结语\n\n`CustomResourceDefinitions` 和 `Kubernetes\
  \ Operators` 为集群带来了高级功能，但它们是建立在我们整本书中看到的 Kubernetes 集群基础功能之上的。`Kubernetes API server`\
  \ 具有扩展性，可以处理任何类型集群资源的存储和检索。因此，我们能够动态地定义新的资源类型并让集群为我们管理它们。\n\n我们在本书的第二部分 检查的许多功能中都看到了这种模式。Kubernetes\
  \ 本身是构建在 第一部分 中看到的容器基础特性之上的，它的设计方式是通过汇聚更基础的功能来实现其更高级的功能。通过理解这些基础功能的工作原理，我们能够更好地理解高级功能，即使这些行为起初看起来可能有些神奇。\n\
  \n现在，我们已经学习了构建高质量、高性能应用程序所理解的 Kubernetes 核心能力。接下来，我们将注意力转向在 Kubernetes 集群中运行时，提高应用程序的性能和韧性的方法。\n\
  \n# 第三部分\n\n# 高性能 Kubernetes\n\n尽管容器的设计目的是为了隐藏集群中单个主机及其底层硬件的一些复杂性，但现实世界中的应用程序需要进行调优，以充分利用可用的计算能力。这种调优必须以符合\
  \ Kubernetes 集群可扩展性和韧性的方式进行，这样我们才不会失去动态调度和水平扩展的优势。换句话说，我们需要为集群提供提示，帮助它以最有效的方式调度容器。\n\
  \n## 18 亲和力和设备\n\n![image](img/common01.jpg)\n\n理想的应用程序具有完全的简单性。设计简单、开发简单、部署简单。它的各个组件都是无状态的，因此很容易扩展以服务尽可能多的的用户。单个服务端点就像纯函数，输出完全取决于输入。应用程序在合理的数据量上运行，对\
  \ CPU 和内存的需求适中，请求和响应可以轻松放入最多只有几 KB 的 JSON 结构中。\n\n当然，在教程之外，并不理想的应用程序。现实世界的应用程序需要存储状态，既在长期持久化存储中，也在可以快速访问的缓存中。现实世界的应用程序面临数据安全和授权问题，因此它们需要验证用户身份、记住用户是谁，并据此限制访问。许多现实世界的应用程序还需要访问专用硬件，而不仅仅是使用理想化的\
  \ CPU、内存、存储和网络资源。\n\n我们希望在 Kubernetes 集群上部署现实世界的应用程序，而不仅仅是理想化的应用程序。这意味着我们需要对如何部署应用程序组件做出明智决策，使我们脱离理想化世界（即由集群决定运行多少个容器实例以及在哪里调度它们）。然而，我们不想创建一个如此僵硬的应用程序架构，以至于失去集群的可扩展性和韧性。相反，我们希望在集群内部工作，为它提供关于如何部署应用程序组件的提示，同时保持尽可能的灵活性。在本章中，我们将探索应用程序组件如何在与其他组件或专用硬件之间实施某种程度的耦合，而不丢失\
  \ Kubernetes 带来的好处。\n\n### 亲和力和反亲和力\n\n我们将首先查看想要管理 `Pods` 调度的情况，以便我们可以偏好或避免将多个容器共同放置在同一个节点上。例如，如果我们有两个在相互通信时消耗大量网络带宽的容器，我们可能希望这两个容器一起运行在一个节点上，以减少延迟并避免减慢集群其他部分的速度。或者，如果我们想确保高可用组件能够在集群节点丢失时仍然存活，我们可能希望拆分\
  \ `Pod` 实例，让它们运行在尽可能不同的集群节点上。\n\n共同放置容器的一种方法是将多个独立的容器合并到单个 `Pod` 规范中。对于两个进程完全依赖彼此的情况，这是一个极佳的解决方案。然而，它消除了单独扩展实例的能力。例如，在一个由分布式存储支持的\
  \ Web 应用程序中，我们需要的 Web 服务器进程实例比需要的存储进程实例多得多。我们需要将这些应用程序组件放在不同的 `Pods` 中，以便单独扩展它们。\n\
  \n在第 8 章 中，当我们想要保证 `Pod` 运行在指定节点时，我们在 `Pod` 规范中添加了 `nodeName` 字段来覆盖调度器。对于示例来说这很好，但对于实际应用程序，它消除对性能和可靠性至关重要的扩展和故障转移。相反，我们将使用\
  \ Kubernetes 的亲和力（affinity）概念为调度器提供关于如何分配 `Pods` 的提示，而不是强制任何 `Pod` 运行在特定节点上。\n\n\
  `Affinity` 允许我们根据其他 `Pods` 的存在限制 `Pod` 的调度位置。让我们来看使用 `iperf3` 网络测试应用的示例。\n\n####\
  \ 集群区域\n\n`Pod` 亲和力对于跨越多个网络的大集群最有价值。例如，我们可能会将 Kubernetes 集群部署到多个不同的数据中心以消除单点故障。在情况下，我们将根据区域（zone）配置亲和力，一个区域可能包含许多节点。在这里，我们只有一个很小的示例集群，因此我们将集群中的每个节点视为一个独立的区域。\n\
  \n#### 反亲和力\n\n让我们从亲和力的对立面开始：反亲和力（anti-affinity）。`anti-affinity` 会导致 Kubernetes\
  \ 调度器避免共同放置 `Pods`。在这种情况下，我们将创建一个带有三个独立的 `iperf3` 服务器 `Pods` 的 `Deployment`，但我们将使用\
  \ `anti-affinity` 将这三个 `Pods` 分散到我们的节点上，以便每个节点获得一个 `Pod`。\n\n**注意**\n\n*本书的示例仓库位于\
  \ [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2) 的“运行示例”。*\n\n这是我们需要的 YAML 定义：\n\n```yaml\nipf-server.yaml\n\
  ```\n\n\n\n\n\n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name:\
  \ iperf-server\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app:\
  \ iperf-server\n  template:\n    metadata:\n      labels:\n        app: iperf-server\n\
  \    spec:\n   ➊ affinity:\n        podAntiAffinity:\n       ➋ requiredDuringSchedulingIgnoredDuringExecution:\n\
  \          - labelSelector:\n              matchExpressions:\n              - key:\
  \ app\n                operator: In\n                values:\n                -\
  \ iperf-server\n         ➌ topologyKey: \"kubernetes.io/hostname\"\n      containers:\n\
  \      - name: iperf\n        image: bookofkubernetes/iperf3:stable\n        env:\n\
  \        - name: IPERF_SERVER\n          value: \"1\"\n```\n\n这个 `Deployment` 资源除了新的亲和性（affinity）部分\
  \ ➊ 外都是典型的。我们指定了一个反亲和性规则，其基于与 `Deployment` 管理其 Pods 时相同的标签。通过这条规则，我们指定不希望 `Pod`\
  \ 被调度到已经存在带有 `app=iperf-server` 标签的 `Pod` 的区域。\n\n`topologyKey` ➌ 指定了区域（zone）的大小。在这种情况下，集群中的每个节点都有不同的\
  \ `hostname` 标签，因此每个节点被认为是一个不同的区域。因此，反亲和性规则防止了 `kube-scheduler` 在第一个 `Pod` 调度到节点之后，将第二个\
  \ `Pod` 放置在该节点上。\n\n最后，由于我们使用 `requiredDuringScheduling` ➋ 指定了规则，这是一条*硬性（hard）*反亲和性规则，这意味着调度器除非能够满足该规则，否则将不会调度\
  \ `Pod`。也可以使用 `preferredDuringScheduling` 并分配权重，为调度器提供提示，而不会在无法满足规则时阻止 `Pod` 的调度。\n\
  \n### 注意事项\n\n`topologyKey` 可以基于应用在节点上上的任何标签。基于云的 Kubernetes 发行版通常会根据节点的可用区自动为每个节点打上标签，这使得能够使用反亲和性将\
  \ Pod 散布到不同的可用区以实现冗余。\n\n让我们应用这个 `Deployment` 并查看结果：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/ipf-server.yaml \ndeployment.apps/iperf-server created\n```\n\n\
  一旦我们的 Pod 开始运行，我们就看到 `Pod` 已经分配到了集群中的每个节点上：\n\n```\nroot@host01:~# kubectl get po\
  \ -o wide\nNAME                            READY   STATUS    ... NODE     ...\n\
  iperf-server-7666fb76d8-7rz8j   1/1     Running   ... host01   ...\niperf-server-7666fb76d8-cljkh\
  \   1/1     Running   ... host02   ...\niperf-server-7666fb76d8-ktk92   1/1    \
  \ Running   ... host03   ...\n```\n\n由于我们有三个节点和三个实例，这本质上与使用 `DaemonSet` 相同，但这种方法更灵活，因为它不需要在每个节点上运行一个实例。在大型集群中，我们可能只需要几个\
  \ `Pod` 实例来满足该服务的需求。使用基于主机的区域反亲和性允许我们为 `Deployment` 指定正确的规模，同时将每个 Pod 分布到不同的节点以获得更高的可用性。反亲和性还可以用于将\
  \ Pod 分布到其他类型的区域。\n\n在继续之前，让我们创建一个 `Service`，以便我们的 iperf3 客户端能够找到服务器实例。以下是 YAML\
  \ 内容：\n\n`ipf-svc.yaml`\n\n```\n---\nkind: Service\napiVersion: v1\nmetadata:\n\
  \  name: iperf-server\nspec:\n  selector:\n    app: iperf-server\n  ports:\n  -\
  \ protocol: TCP\n    port: 5201\n    targetPort: 5201\n```\n\n将其应用到集群：\n\n```\n\
  root@host01:~# kubectl apply -f /opt/ipf-svc.yaml \nservice/iperf-server created\n\
  ```\n\n`Service` 选取了所有三个 Pod：\n\n```\nroot@host01:~# kubectl get ep iperf-server\n\
  NAME           ENDPOINTS                                                 ...\niperf-server\
  \   172.31.239.207:5201,172.31.25.214:5201,172.31.89.206:5201 ...\n```\n\n`ep` 是\
  \ `endpoints` 的缩写。每个 `Service` 都有一个关联的 `Endpoint` 对象，记录了当前接收 `Service` 流量的 Pod。\n\
  \n### 亲和性\n\n我们现在准备好部署 iperf3 客户端来使用这些服务器实例。我们希望以相同的方式将客户端分布到每个节点，但我们希望确保每个客户端都部署到带有服务器实例的节点上。为了实现这一点，我们将同时使用亲和性和反亲和性规则：\n\
  \n`ipf-client.yaml`\n\n```\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n\
  \  name: iperf\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app:\
  \ iperf\n  template:\n    metadata:\n      labels:\n        app: iperf\n    spec:\n\
  \      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
  \            - labelSelector:\n              matchExpressions:\n              -\
  \ key: app\n                operator: In\n                values:\n            \
  \    - iperf\n            topologyKey: \"kubernetes.io/hostname\"\n        podAffinity:\n\
  \          requiredDuringSchedulingIgnoredDuringExecution:\n            - labelSelector:\n\
  \              matchExpressions:\n              - key: app\n                operator:\
  \ In\n                values:\n                - iperf-server\n            topologyKey:\
  \ \"kubernetes.io/hostname\"\n      containers:\n      - name: iperf\n        image:\
  \ bookofkubernetes/iperf3:stable\n```\n\n额外的 `podAffinity` ➊ 确保只有在存在服务器时才部署客户端。这与反亲和性规则的工作相同。让我们部署客户端：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/ipf-client.yaml \ndeployment.apps/iperf\
  \ created\n```\n\n在这些 Pod 运行后，我们看到它们也分布到了所有节点：\n\n```\nroot@host01:~# kubectl get\
  \ po -o wide\nNAME                            READY   STATUS    ... NODE     ...\n\
  iperf-7666fb76d8-btppf            1/1     Running   ... host02   ...\niperf-7666fb76d8-s6r\
  \             1/1     Running   ... host03   ...\niperf-7666fb76d8-v98m        \
  \    1/1     Running   ... host01   ...\n```\n\n看起来我们部署 iperf3 客户端和服务器的方式让每个客户端都能与本地服务器通信，但事实并非如此。由于\
  \ `iperf-server` `Service` 配置了三个 Pod，我们的客户端可能无法正常工作。你可能会看到 Pod 处于 `Error` 或 `CrashLoopBackOff`\
  \ 状态，日志输出如下：\n\n```\nroot@host01:~# kubectl logs iperf-7666fb76d8-v98m\niperf3:\
  \ error - the server is busy running a test. try again\niperf3 error - exiting\n\
  ```\n\n这表明客户端正在连接到一个已经有一个客户端的服务器。\n\n### 服务流量路由\n\n我们希望配置客户端 Pod 访问本地服务器 Pod，而不是另一个节点的服务器\
  \ Pod。让我们首先确认流量是否被随机路由到所有服务器 Pod。我们可以检查 `kube-proxy` 为此 `Service` 创建的 `iptables`\
  \ 规则：\n\n```\nroot@host01:~# iptables-save | grep iperf-server\n...\n-A KUBE-SVC-KN2SIRYEH2IFQNHK\
  \ -m comment --comment \"default/iperf-server\" \n  -m statistic --mode random --probability\
  \ 0.33333333349 -j KUBE-SEP-IGBNNG5F5VCPRRWI\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment\
  \ --comment \"default/iperf-server\" \n  -m statistic --mode random --probability\
  \ 0.50000000000 -j KUBE-SEP-FDPADR4LUNHDJSPL\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment\
  \ --comment \"default/iperf-server\" \n  -j KUBE-SEP-TZDPKVKUEZYBFM3V\n```\n\n我们在\
  \ *host01* 上运行此命令，看到有三个独立的 `iptables` 规则，并随机选择目标。这意味着 *host01* 上的 iperf3 客户端可能会被路由到任何服务器\
  \ Pod。\n\n\n\n\n要修复这个问题，我们需要更改 `Service` 的内部流量策略配置。默认情况下，该策略为 `Cluster`，这意味着集群中的所有\
  \ `Pods` 都是有效的终止节点。我们可以将策略更改为 `Local`，这将限制 `Service` 路由到同一节点上的 `Pods`。\n\n让我们通过补丁\
  \ `Service` 来更改此策略：\n\n```\nroot@host01:~# kubectl patch svc iperf-server -p '{\"\
  spec\":{\"internalTrafficPolicy\":\"Local\"}}'\nservice/iperf-server patched\n```\n\
  \n更改会立即生效，正如我们再次查看 `iptables` 规则所所示：\n\n```\nroot@host01:~# iptables-save | grep\
  \ iperf-server\n...\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment --comment \"default/iperf-server\"\
  \ \\\n  -j KUBE-SEP-IGBNNG5F5VCPRRWI\n```\n\n这一次，`host01` 上只配置了一个可能的节点，因为该 `Service`\
  \ 在本地只有一个 Pod 实例。\n\n几分钟后，`iper3` 客户端现在显示了我们期望看到的输出：\n\n```\nroot@host01:~# kubectl\
  \ logs iperf-c8d4566f-btppf\nConnecting to host iperf-server, port 5201\n...\n[\
  \ ID] Interval           Transfer     Bitrate         Retr\n[  5]   0.00-10.00 \
  \ sec  8.67 GBytes  7.45 Gbits/sec  1250             sender\n[  5]   0.00-10.00\
  \  sec  8.67 GBytes  7.45 Gbits/sec                  receiver\n...\n```\n\n不仅所有客户端都能连接到唯一的服务器，而且由于网络连接是每个节点的本地连接，性能保持在高水平。\n\
  \n在继续之前，让我们清理这些资源：\n\n```\nroot@host01:~# kubectl delete svc/iperf-server deploy/iperf\
  \ deploy/iperf-server\nservice \"iperf-server\" deleted\ndeployment.apps \"iperf\"\
  \ deleted\ndeployment.apps \"iperf-server\" deleted\n```\n\n`Local` 内部流量策略对于最大化客户端和服务器之间的带宽非常有用，但它有一个主要的局限性。如果节点不包含健康的\
  \ Pod 实例，该节点上的客户端将完全无法访问 `Service`，即使其他节点上存在健康的实例。在使用这种设计模式时，配置就绪探针至关重要，如第 13 章所述，探针不仅检查\
  \ Pod 本身，还检查它的 `Service` 依赖。这样，如果 `Service` 在特定节点上不可用，该节点上的客户端也将报告自身为不健康，从而就不会有流量路由到那里。\n\
  \n我们看到的亲和性和反亲性能力允许我们向调度器提供提示，而不会丢失我们为应用程序组件所需的扩展性和韧性。然而，尽管在应用程序架构中存在紧密连接的组件时使用这些功能可能很有吸引力，但最好的可能是让调度器不受阻地工作，仅在实际性能测试显示其有显著差异的情况下才添加亲和性。\n\
  \n提高性能的 `Service` 路由是 Kubernetes 开发的一个活跃领域。对于跨多个区域运行的集群，名为“拓扑感知提示（Topology Aware\
  \ Hints）”的新功能可以让 Kubernetes 尽可能将到 `Services` 的连接路由到最近的实例，同时在需要时允许跨区域流量。\n\n### 硬件资源\n\
  \n亲和性和反亲性允许我们控制 `Pods` 的调度位置，但应仅在需要时使用。但对于 `Pod` 需要访问仅在某些节点上可用的特殊硬件的情况呢？例如，我们可能有某些受益于图形处理器（GPU）的处理任务，但我们可能会限制集群中\
  \ GPU 节点的数量以降低成本。在这种情况下，确保 `Pod` 调度在正确的位置是绝对必要的。\n\n和之前一样，我们可以使用 `nodeName` 将 `Pod`\
  \ 直接绑定到节点。但我们的集群中可能有许多具有正确硬件的节点，所以我们真正想要的是能够告诉 Kubernetes 这些需求，然后让调度器决定如何满足它。\n\n\
  Kubernetes 两种相关方法来解决此需求：设备插件（device plug-ins）和扩展资源（extended resources）。设备插件提供了最完整的功能，但硬件设备必须存在对应的插件。同时，扩展资源可以用于任何硬件设备，但\
  \ Kubernetes 集群只跟踪资源的分配；它实际上并不管理其在容器中的可用性。\n\n实现设备插件需要与 `kubelet` 紧密协作。类似于我们在第 15\
  \ 章中看到的存储插件架构，设备插件会在运行在节点上的 `kubelet` 实例处注册自己，识别它管理的任何设备。`Pods` 识别它们所需的任何设备，设备管理器告诉\
  \ `kubelet` 如何在容器内部使设备可用（通常通过将设备从主机挂载到容器的文件系统中来实现）。\n\n由于我们在一个虚拟化的示例集群中操作，我们没有任何特殊硬件来演示设备插件，但扩展资源从分配的角度来看工作原理是相同的，因此我们仍然可以了解整体方法。\n\
  \n让我们从更新集群开始，指示其中一个节点有一个示例扩展资源。我们通过补丁节点的状态来实现。理想情况下，我们可以使用 `kubectl patch` 执行此操作，但遗憾的是该命令无法更新资源的状态，所以我们只能使用\
  \ `curl`。\n\n\n\n\n```\nroot@host01:~# kubectl describe node host02\nName:     \
  \          host02\n...\nAllocated resources:\n...\n  Resource                  \
  \       Requests     Limits\n  --------                         --------     ------\n\
  ...\n  bookofkubernetes.com/special-hw  1            1\n...\n```\n\n我们在列表 18-1 中添加扩展资源时所指定的三个\
  \ `special-hw` 的可用数量，以及该资源对我们 Pod 的分配都是任意的。扩展资源的作用类似于一个信号量，可以防止过多的用户使用同种资源，但如果我们确实在同一个节点上有三个独立的特殊硬件设备，我们仍然添加额外的处理来解决多个用户之间的冲突。\n\
  \n如果我们尝试根据我们指定的可用数量进行过度分配，Pod 将不会被调度。如果我们尝试添加另一个需要我们全部三个特殊硬件设备的 Pod，就可以证实这一点：\n\n\
  `hw3.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: sleep3\n\
  spec:\n  containers:\n  - name: sleep\n    image: busybox\n    command: [\"/bin/sleep\"\
  , \"infinity\"]\n    resources:\n      limits:\n        bookofkubernetes.com/special-hw:\
  \ 3\n```\n\n让我们尝试将此 Pod 添加到集群：\n\n```\nroot@host01:~# kubectl apply -f /opt/hw3.yaml\
  \ \npod/sleep created\n```\n\n由于没有足够的可用特殊硬件设备，此 Pod 处于 `Pending` 状态：\n\n```\nroot@host01:~#\
  \ kubectl get po -o wide\nNAME    READY   STATUS    ... NODE     ...\nsleep   1/1\
  \     Running   ... host02   ...\nsleep3  0/1     Pending   ... <none>   ...\n```\n\
  \nPod 将等待硬件可用。让我们删除原始的 Pod 以释放空间：\n\n```\nroot@host01:~# kubectl delete pod sleep\
  \ \npod/sleep deleted\n```\n\n我们的新 Pod 现在将开始运行：\n\n```\nroot@host01:~# kubectl get\
  \ po -o wide\nNAME    READY   STATUS    ... NODE     ...\nsleep3  1/1     Running\
  \   ... host02   ...\n```\n\n和之前一样，由于对特殊硬件的需求，Pod 被调度到了 host02。\n\n设备驱动在分配角度的工作原理完全相同。在两种情况下，我们都使用\
  \ `limits` 字段来标识硬件需求。唯一的区别是我们不需要手动修补节点来记录资源，因为设备驱动注册时，`kubelet`会自动更新节点状态。此外，当创建容器时，`kubelet`\
  \ 会调用设备驱动对硬件进行任何必要的分配和配置。\n\n### 总结\n\n与理想的应用不同，在现实世界中，我们经常必须处理耦合的应用组件以及对特殊硬件的需求。在考虑这些应用需求的同时，不丢失从部署应用到\
  \ Kubernetes 集群中获得的灵活性和韧性，是至关重要的。在本章中，我们看到了亲和性和设备驱动如何允许我们向调度器提供提示和资源需求，同时允许其动态管理大规模应用程序的灵活性。\n\
  \n当我们考虑如何从真实世界的应用中获得期望的行为和性能时，调度并不是我们唯一关心的问题。在下一章中，我们将看到如何通过使用服务质量（QoS）类来构建 Pod\
  \ 的处理和内存分配。\n\n# 19 调优服务质量\n\n![image](img/common01.jpg)\n\n理想情况下，我们的应用程序将使用最少或高度可预测的处理器、内存、存储和网络资源。但在现实世界中，应用程序是“突发性的”，其负载的变化由用户需求、大量数据或复杂处理驱动。在\
  \ Kubernetes 集群中，应用组件被动态部署到集群中的各种节点，跨节点的负载分布不均可能会导致性能瓶颈。\n\n从应用架构的角度来看，我们越能让应用组件越小且越可扩展，就越能在集群中均匀地分布负载。遗憾的是，通过水平扩展并不总是性能性能问题。在本章中，我们将查看如何使用资源规范向集群提供关于如何调度\
  \ Pod 的提示，目标是使应用程序性能更具预测性。\n\n### 实现预测性\n\n在普通的日常语言中，“实时`（real time）一词的意思是发生得快速且持续。但在计算机科学中，我们对`实时`和`快速`（real\
  \ fast）的区分程度以至于它们被认为是对立面。这是由于可预测性的重要性。\n\n实时处理简单是指需要跟上现实世界中某些活动的处理。它可以是任何，从需要跟上传感器数据输入并维护最新电子飞行显示器的驾驶舱软件，到需要及时接收并解码每一帧视频以进行显示的视频流应用程序。在实时系统中，能够保证处理速度“足够快”以跟上现实世界的要求是至关重要的。\n\
  \n足够快就是我们需要的全部。处理没有必要比现实世界更快，因为应用程序没有其他事情可以做。但即使是处理速度比现实世界慢的一个时间间隔，也意味着我们落后于输入或输出，导致电影观众感到沮躁——甚至导致飞机坠毁。\n\
  \n由于这个原因，实时系统的主要目标是预测性。资源的分配是根据系统将遇到的最坏情况的，我们愿意提供远多于实际所需的处理能力，以确保在那种最坏情况下留有充足的余地。事实上，要求此类系统即使在最大预期负载下也保持在可用处理利用率的\
  \ 50% 以下是很常的。\n\n但虽然响应速度始终很重要，但大多数应用程序并不运行在实时环境中，而且这种额外的资源余地是昂贵的。由于这个原因，大多数系统试图在可预测性和效率之间寻找平衡，这意味着只要是暂时的，我们通常愿意容忍组件运行稍慢一点。\n\
  \n### 服务质量类 (Quality of Service Classes)\n\n为了帮助我们平衡集群中容器的可预测性和效率，Kubernetes 将 Pod\
  \ 分配到三种服务质量类之一：`BestEffort`、`Burstable` 和 `Guaranteed`。在某种程度上，我们可以认为这些类是描述性的。当我们不向\
  \ Kubernetes 提供任何资源需求时，使用 `BestEffort`，它只能尽力为 Pod 提供足够的资源。`Burstable` 用于 Pod 可能会超过其资源请求的情况。`Guaranteed`\
  \ 用于我们提供一致的资源需求且预期 Pod 将保持在这些需求之的情况。由于这些类是描述性的，并且完全基于 Pod 中的容器如何指定它们的资源需求，因此没有办法手动指定\
  \ Pod 的 QoS。\n\nQoS 类有两种用途。首先，同一 QoS 类的 Pod 被分组在一起，以便进行 Linux 控制组（cgroups）配置。正如我们在第\
  \ 3 章 中所示，cgroups 用于控制一组进程的资源利用率，特别是处理器和内存，因此 Pod 的 cgroup 会影响它在系统负载较高时使用处理时间时的优先级。其次，如果节点由于缺少内存资源而需要开始驱逐\
  \ Pod，QoS 类会影响哪些 Pod 先被驱逐。\n\n### BestEffort\n\n最简单的情况是声明一个没有限制的 Pod。在这种情况下，该 Pod\
  \ 被分配到 `BestEffort` 类。让我们创建一个示例 Pod 来探索这意味着什么。\n\n\n\n\n[content]\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。详细的设置说明请参见第\
  \ xx 页的“运行示例”（#ch00.xhtml_ch00lev1sec2）。\n\n以下是 Pod 的定义：\n\n`best-effort.yaml`\n\
  \n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: best-effort\nspec:\n\
  \  containers:\n  - name: best-effort\n    image: busybox\n    command: [\"/bin/sleep\"\
  , \"infinity\"]\n  nodeName: host01\n```\n\n此定义完全没有包含 `resources` 字段，但如果我们包含一个带有\
  \ `requests` 但没有 `limits` 的 `resources` 字段，其 QoS 类别将是相同的。\n\n我们使用 `nodeName` 强制此\
  \ Pod 调度到 `host01`，这样我们就可以观察其资源配置是如何的。让我们将其应用于集群：\n\n```bash\nroot@host01:~# kubectl\
  \ apply -f /opt/best-effort.yaml \npod/best-effort created\n```\n\nPod 运行后，我们可以查看其详情，确认它已被分配到\
  \ BestEffort QoS 类别：\n\n```bash\nroot@host01:~# kubectl get po best-effort -o json\
  \ | jq .status.qosClass\n\"BestEffort\"\n```\n\n我们可以使用在第 14 章中看到的 `cgroup-info`\
  \ 脚本，来查看 QoS 类别如何影响 Pod 中容器的 cgroup 配置：\n\n```bash\nroot@host01:~# /opt/cgroup-info\
  \ best-effort\n\nContainer Runtime\n-----------------\nPod ID: 205...\n\nCgroup\
  \ path: /kubepods.slice/kubepods-besteffort.slice/kubepods-...\n\nCPU Settings\n\
  ------------\nCPU Shares: 2\nCPU Quota (us): -1 per 100000\n\nMemory Settings\n\
  ---------------\nLimit (bytes): 9223372036854771712\n```\n\n该 Pod 在 CPU 和内存使用上实际上是无限制的。然而，Pod\
  \ 的 cgroup 位于 `kubepods-besteffort.slice` 路径下，反映了它对 BestEffort QoS 类的分配。这种分配对其 CPU\
  \ 优先级具有直接影响，当我们比较分配给 BestEffort 类别和 Burstable 类别的 `cpu.shares` 时可以看到：\n\n```bash\n\
  root@host01:~# cat /sys/fs/cgroup/cpu/kubepods.slice/kubepods-besteffort.slice/cpu.shares\
  \ \n2\nroot@host01:~# cat /sys/fs/cgroup/cpu/kubepods.slice/kubepods-burstable.slice/cpu.shares\
  \ \n1157\n```\n\n正如我们在第 14 章中所示，这些值是相对的，因此这意味着当系统处理负载很高时，Burstable Pod 中的容器被分配的处理器份额将是\
  \ BestEffort Pod 中容器收到的份额的 500 倍以上。该值基于已处于 BestEffort 和 Burstable QoS 类别的 Pod 数量，包括已运行在\
  \ `host01` 上的各种集群基础设施组件，因此你可能会看到略有不同的值。\n\n`kubepods.slice` cgroup 与用户和系统进程的 cgroups\
  \ 处于同一级，因此当系统负载很高时，它将与其他 cgroups 获得类似的处理时间份额。根据 `kubepods.slice` cgroup 中确定的 `cpu.shares`，与\
  \ Burstable Pod 相比，BestEffort Pod 接收到的处理份额少于总份额的 1%，即使不考虑任何分配给 Guaranteed Pod 的处理器时间也是如此。这意味着系统负载较高时，BestEffort\
  \ Pod 几乎得不到处理器时间，因此它们应该只用于在集群空闲时运行的后台处理。此外，由于 Pod 只有在没有指定限制的情况下才会被放置在 BestEffort\
  \ 类别中，因此它们无法在具有限制配额（limit quotas）的 Namespace 中创建。因此，我们的大多数应用 Pod 将属于另外两个 QoS 类别之一。\n\
  \n### Burstable\n\n如果 Pod 同时指定了 `requests` 和 `limits`，且这两个规格不同，则 Pod 将被归类为 Burstable\
  \ 类别。正如我们在第 14 章中所示，`requests` 规格用于调度目的，而 `limits` 规格用于运行时强制。换句话之，在这种情况下，Pod 可以产生高于其请求水平的“突发性”资源利用，但不能超过它们的限制。\n\
  \n让我们来看一个示例：\n\n`burstable.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: burstable\nspec:\n  containers:\n  - name: burstable\n    image: busybox\n\
  \    command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n      requests:\n\
  \        memory: \"64Mi\"\n        cpu: \"50m\"\n      limits:\n        memory:\
  \ \"128Mi\"\n        cpu: \"100m\"\n  nodeName: host01\n```\n\n此 Pod 定义提供了 `requests`\
  \ 和 `limits` 资源需求，且它们是不同的，因此我们预期此 Pod 将放置在 Burstable 类别中。\n\n将此 Pod 应用集群：\n\n```bash\n\
  root@host01:~# kubectl apply -f /opt/burstable.yaml \npod/burstable created\n```\n\
  \nPod 运行后，我们可以查看其详情，确认它已被分配到 Burstable 类别：\n（注：原文文本中此处的示例逻辑与前文略有重复，此处保持翻译结构一致）\n\
  \n```bash\nroot@host01:~# kubectl get po burstable -o json | jq .status.qosClass\n\
  \"Burstable\"\n```\n\n\n\n\n与其将这些容器放入单独目录，属于 Guaranteed（保证）QoS 类的容器被直接放置在 `kubepods.slice`\
  \ 中。将它们放在此位置的效果是，当系统负载较高时，赋予 Guaranteed Pod 优先级，因为这些容器接收的是各自的 CPU 配额，而不是作为一个类接收。\n\
  \n## QoS 类驱逐\n\n对 Guaranteed QoS 类 Pod 的特权处理也扩展到了 Pod 驱逐。如第 3 章所述，cgroup 内存限制的强制执行由\
  \ OOM killer 处理。当节点内存完全耗尽时，OOM killer 也会运行。为了帮助 OOM killer 选择要终止哪些容器，Kubernetes\
  \ 会根据 Pod 的 QoS 类设置 `oom_score_adj` 参数。该参数的取值范围从 –1000 到 1000。数字越大，OOM killer 选择某个进程进行杀掉的概率就越高。\n\
  \n`oom_score_adj` 值记录在每个进程的 `/proc` 中。自动化脚本添加了一个名为 `oom-info` 的脚本来获取特定 Pod 的该值。让我们检查每个\
  \ QoS 类中 Pod 的值：\n\n```\nroot@host01:~# /opt/oom-info best-effort\nOOM Score Adjustment:\
  \ 1000\nroot@host01:~# /opt/oom-info burstable\nOOM Score Adjustment: 968\nroot@host01:~#\
  \ /opt/oom-info guaranteed\nOOM Score Adjustment: -997\n```\n\nBestEffort（尽力为）QoS\
  \ 类 Pod 的最大调整值为 1000，因此它们会被 OOM killer 选定。Burstable（可缓冲）QoS 类 Pod 的得分根据 `requests`\
  \ 字段中指定的内存占节点总内存容量的百分比计算得出。因此，该值对于每个 Pod 都是不同的，但始终处于 2 到 999 之间。因此，Burstable QoS\
  \ 类 Pod 在 OOM killer 的优先级中始终是第二。同时，Guaranteed QoS 类 Pod 被设置为接近最小值（在本例中为 –997），因此它们尽可能地免受\
  \ OOM killer 的伤害。\n\n当然，如第 3 章中提到的，OOM killer 会立即终止进程，因此这是一种极端措施。当节点内存低低但尚未耗尽时，Kubernetes\
  \ 会尝试驱逐 Pod 以回收内存。这种驱逐也根据 QoS 类进行优先级排序。BestEffort 类 Pod 和使用超过其 requests 值的 Burstable\
  \ 类 Pod（高使用率 Burstable）最先被驱逐，其次是使用少于其 requests 值的 Burstable 类 Pod（低使用率 Burstable）以及\
  \ Guaranteed 类的 Pod。\n\n在继续之前，让我们先做一些清理工作：\n\n```\nroot@host01:~# kubectl delete\
  \ po/best-effort po/burstable po/guaranteed\npod \"best-effort\" deleted\npod \"\
  burstable\" deleted\npod \"guaranteed\" deleted\n```\n\n现在，当我们在本章稍后查看 Pod 优先级时，就可以有一个全新的开始了。\n\
  \n## 选择 QoS 类\n\n鉴于在处理时间和驱逐优先级上的这种优先级排序，人们可能想将所有 Pod 都置于 Guaranteed QoS 类中。对于某些应用组件来说，这是一种可行的策略。如第\
  \ 7 章所述，我们可以配置 `HorizontalPodAutoscaler`（水平 Pod 自动伸缩器），如果现有实例消耗了其分配资源的很大比例，则自动创建新的\
  \ Pod 实例。这意味着我们可以为 Deployment 中的 Pod 请求一个合理的 limits（限制）值，并在当这些 Pod 的总和太接近限制时，允许集群自动伸缩\
  \ Deployment。如果集群运行在云环境中，我们甚至可以将自动伸缩扩展到节点级别，在负载高时动态地创建新的集群节点，并在集群空闲时减少节点数量。\n\n\
  仅使用 Guaranteed Pod 并配合自动伸缩听起来很棒，但这假设了我们的应用组件是易于扩展的。它只在我们的应用程序负载由许多小请求组成时才运行良好，因为负载的增加主要意味着我们正在从更多用户手中处理大小相似的请求。如果我们有定期处理大型或复杂请求的应用组件，我们必须为这些组件设置限制以适应最坏的情况。鉴于\
  \ Guaranteed QoS 类 Pod 的 requests 等于 limits，我们的集群将需要足够的资源来处理这种最坏的情况，否则我们甚至无法调度 Pod。这导致集群除非系统处于最大负载状态，否则大部分时间都处于空闲状态。同样，如果我们有可扩展性限制（例如依赖于专用硬件），我们为某个组件创建的\
  \ Pod 数量可能会有一个自然限制，迫使每个 Pod 拥有更多资源来处理其在整体负载中的份额。\n\n出于此原因，为 Pod 平衡使用 Guaranteed\
  \ 和 Burstable QoS 类是有意义的。任何具有持续负载或可以可行地水平扩展以满足额外需求的 Pod 都应该处于 Guaranteed 类中。较难扩展或需要处理大小混合工作负载的\
  \ Pod 应该处于 Burstable 类中。这些 Pod 应该根据其平均利用率指定 `requests`，并根据其最坏的情况指定 `limits`。以这种方式指定资源需求将确保通过简单比较分配的资源与集群容量即可监控集群预期的性能裕量。最后，如果一个大请求导致多个应用组件同时以最最坏利用率运行，那么运行性能测试并探索反亲和性（anti-affinity）可能是值得的。\n\
  \n### 优先级\n\n除了使用提示帮助 Kubernetes 集群在系统负载很高时管理 Pod 之外，还可以直接给 Pod 设置高优先级。优先级是一个数字字段；大于十亿的数字留给系统\
  \ Pod。要为 Pod 分配优先级，我们必须先创建一个 `PriorityClass` 资源。示例：\n\n`essential.yaml`\n\n```yaml\n\
  ---\napiVersion: scheduling.k8s.io/v1\nkind: PriorityClass\nmetadata:\n  name: essential\n\
  value: 99999\n```\n\n让我们将其应用到集群：\n\n```\nroot@host01:~# kubectl apply -f /opt/essential.yaml\
  \ \npriorityclass.scheduling.k8s.io/essential created\n```\n\n现在定义了 `PriorityClass`，我们就可以将其应用于\
  \ Pod。然而，让我们先大量的低优先级 Pod，通过它们观察 Pod 被抢占（preempted）。我们将使用这个 Deployment：\n\n```yaml\n\
  ---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: lots\nspec:\n  replicas:\
  \ 1000\n  selector:\n    matchLabels:\n      app: lots\n  template:\n    metadata:\n\
  \      labels:\n        app: lots\n    spec:\n      containers:\n      - name: sleep\n\
  \        image: busybox\n        command: [\"/bin/sleep\", \"infinity\"]\n     \
  \   resources:\n          limits:\n            memory: \"64Mi\"\n            cpu:\
  \ \"250m\"\n```\n\n这是一个运行 sleep 的基础 Deployment，并不消耗多少内存或 CPU，但它将副本数设置为 1000，因此我们正在请求\
  \ Kubernetes 集群创建 1000 个 Pod。示例集群不足以部署 1000 个 Pod，既是因为我们没有足够的资源来满足规范，也是因为节点默认限制为\
  \ 110 个 Pod。尽管如此，让我们如列表 19-1 所示将其应用到集群，调度器将尽可能创建 Pod：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/lots.yaml \ndeployment.apps/lots created\n```\n\n\n\n\n### 列表 19-1:\
  \ 部署大量 Pod\n\n让我们描述这个 Deployment 以查看运行情况：\n\n```\nroot@host01:~# kubectl describe\
  \ deploy lots\nName:                   lots\nNamespace:              default\n...\n\
  Replicas:               1000 desired ... | 7 available | 993 unavailable\n...\n\
  ```\n\n考虑到集群基础设施组件已经运行了许多 Pod，我们在示例集群中仅成功获取了 7 个 Pod。遗憾的是，这就是我们能获得的全部 Pod 了：\n\n\
  ```\nroot@host01:~# kubectl describe node host01\nName:               host01\n \
  \ (Total limits may be over 100 percent, i.e., overcommitted.)\nAllocated resources:\n\
  ...\n  Resource           Requests     Limits\n  --------           --------   \
  \  ------\n  cpu             ➊ 1898m (94%)  768m (38%)\n  memory             292Mi\
  \ (15%)  192Mi (10%)\n  ephemeral-storage  0 (0%)       0 (0%)\n  hugepages-2Mi\
  \      0 (0%)       0 (0%)\n...\n```\n\n`host01` 的数据显示我们已经分配了 94% 的可用 CPU ➊。但我们的每个\
  \ Pod 都在请求 250 毫核（millicores），因此没有足够的剩余容量在这一节点上调度另一个 Pod。另外两个节点也处于这种情况，没有足够的 CPU\
  \ 空间来调度更多的 Pod。尽管如此，集群运行良好。从理论上讲，我们分配了所有的处理能力，但这些容器只是在运行 `sleep` 命令，因此它们实际上并没有消耗多少\
  \ CPU。\n\n此外，重要的是 `requests` 字段被用于调度，因此，尽管我们有一些指定了 `requests` 但没有指定 `limits` 的基础设施\
  \ `BestEffort` Pod，而且该节点上有充足的 `Limits` 容量，但我们仍然没有空间来调度新的 Pod。只有 `Limits` 可以被超额分用，而\
  \ `Requests` 不行。\n\n由于我们没有更多的 CPU 分配给 Pod，`Deployment` 中剩余的 Pod 都处于 `Pending`（等待）状态：\n\
  \n```\nroot@host01:~# kubectl get po | grep -c Pending\n993\n```\n\n这 993 个 Pod\
  \ 的默认 优先级均为 0。结果是当我们使用关键的 `PriorityClass` 创建新 Pod 时，它将跳到调度队列的最前端。不仅如此，集群还将根据需要驱逐\
  \ Pod 以便其能够被调度。\n\n以下是 Pod 的定义：\n\n`needed.yaml`\n\n```\n---\napiVersion: v1\nkind:\
  \ Pod\nmetadata:\n  name: needed\nspec:\n  containers:\n  - name: needed\n    image:\
  \ busybox\n    command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n      limits:\n\
  \        memory: \"64Mi\"\n        cpu: \"250m\"\n  priorityClassName: essential\n\
  ```\n\n这里的关键区别在于 `priorityClassName` 的规范，它与我们创建的 `PriorityClass` 相匹配。让我们将其应用于集群：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/needed.yaml \npod/needed created\n```\n\
  \n集群需要一点时间来驱逐另一个 Pod 以便这个 Pod 可以被调度，但一分钟后它就会开始运行：\n\n```\nroot@host01:~# kubectl\
  \ get po needed\nNAME     READY   STATUS    RESTARTS   AGE\nneeded   1/1     Running\
  \   0          36s\n```\n\n为了让这一切发生，我们在列表 19-1 中创建的 `lots` Deployment 中的一个 Pod 必须被驱逐：\n\
  \n```\nroot@host01:~# kubectl describe deploy lots\nName:                   lots\n\
  Namespace:              default\nCreationTimestamp:      Fri, 01 Apr 2022 19:20:52\
  \ +0000\nLabels:                 <none>\nAnnotations:            deployment.kubernetes.io/revision:\
  \ 1\nSelector:               app=lots\nReplicas:               1000 desired ...\
  \ | ➊ 6 available | 994 unavailable\n```\n\n现在 `Deployment` 中仅剩 6 个可用 Pod ➊，因为一个\
  \ Pod 被驱逐。值得注意的是，处于 `Guaranteed` QoS 类并没有防止该 Pod 被驱逐。`Guaranteed` QoS 类在由于节点资源使用导致的驱逐中具有优先级，但对于由于调度器为高优先级\
  \ Pod 寻找空间而导致的驱逐则不然。\n\n当然，为 Pod 指定更高的优先级导致其他 Pod 被驱逐，这种能力是强大的，应该谨慎使用。普通用户没有创建新\
  \ `PriorityClass` 的权限，管理员可以应用配额来限制特定 `Namespace` 中 `PriorityClass` 的使用，从而有效地限制普通用户创建高优先级\
  \ Pod。\n\n### 结语\n\n将应用程序部署到 Kubernetes 并实现良好的性能和可靠性，需要对应用程序架构以及每个组件的正常和最坏负载情况有所了解。Kubernetes\
  \ QoS 类允许我们塑造 Pod 部署到节点的方式，以便在资源利用的可预预测性和效率之间取得平衡。此外，QoS 类和 Pod 优先级都允许我们向 Kubernetes\
  \ 集群提供提示，以便在集群负载过高时，所部署的应用程序能够优雅地降级。\n\n在下一章中，我们将汇总所看到的观点，学习如何最好地利用 Kubernetes 集群的特性来部署高性能、高韧性的应用程序。我们还将探索如何监控这些应用程序并对行为的变化做出自动响应。\n\
  \n## 20 应用程序韧性\n\n![image](img/common01.jpg)\n\n在本书中，我们看到了容器和 Kubernetes 如何实现可扩展、高韧性的应用程序。使用容器，我们可以封装应用程序组件，使进程彼此隔离，拥有独立的虚拟化网络堆栈和独立的文件系统。每个容器都可以快速部署，而不会与其他容器产生干扰。当我们在容器运行时之上添加\
  \ Kubernetes 作为容器编排层时，我们能够将许多独立的主机集成到一个集群中，跨可用集群节点动态调度容器，并带有自动扩展、故障转移、分布式网络、流量路由、存储和配置。\n\
  \n我们在书中看到的所有容器和 Kubernetes 特性共同工作，为部署可扩展、高韧性的应用程序提供了必要的基础设施，但取决于我们如何正确配置应用程序，以利用基础设施所提供的功能。在本章中，我们将再次查看在第\
  \ 1 章中部署的 todo 应用程序。然而，这次我们将部署在 Kubernetes 集群的多个节点上，消除单点故障并利用 Kubernetes 提供的关键功能。我们还将探索监控\
  \ Kubernetes 集群和部署应用程序的性能，以便在问题影响用户之前识别它们。\n\n### 示例应用程序栈\n\n在第 1 章中，我们在运行 k3s 的\
  \ Kubernetes 集群上部署了 todo。我们已经拥有了一些可扩展性和故障转移能力。Web 层基于 Deployment，因此我们可以通过单条命令扩展服务器实例的数量。我们的\
  \ Kubernetes 集群监控这些实例，以便故障实例可以被替换。然而，我们仍然存在一些单点故障。我们尚未引入高可用 Kubernetes 控制平的概念，因此我们选择仅在单节点运行\
  \ k3s。此外，尽管我们对 PostgreSQL 数据库使用了 `Deployment`，但它缺乏任何高可用所需的配置。在本章中，我们将看到修正这些局限性所需的细节，并将利用所学的许多其他\
  \ Kubernetes 特性。\n\n#### 数据库\n\n让我们从部署一个高可用的 PostgreSQL 数据库开始。第 17 章 展示了 Kubernetes\
  \ Operator 设计模式如何使用 `CustomResourceDefinitions` 扩展集群行为，使得打包和部署高级功能变得简单。我们将使用在该章节中引入的\
  \ Postgres Operator 来部署我们的数据库。\n\n\n\n\n本书的示例存储库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详细信息，请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2)上的“运行示例”。本章使用了一个较大的六节点集群，为应用程序以及我们将要部署的所有监控组件留出空间。更多信息请参阅本章的\
  \ `README.md` 文件。\n\n本章的自动化脚本已经部署了 Postgres Operator 及其配置。你可以通过查看 `/etc/kubernetes/components`\
  \ 下的文件来检查 Postgres Operator 及其配置。该 运行在 `todo` 命名空间中，`todo` 应用也部署在该命名空间。许多 Operator\
  \ 倾向于运行在自己的命名空间中并跨集群操作，但 Postgres Operator 的设计是直接部署在数据库将所在的命名空间中。\n\n由于我们使用了 Postgres\
  \ Operator，可以通过向集群应用自定义资源来创建一个高可用 PostgreSQL 数据库：\n\n`database.yaml`\n\n```yaml\n\
  \ ---\n apiVersion: \"acid.zalan.do/v1\"\n kind: postgresql\n metadata:\n➊ name:\
  \ todo-db\n spec:\n   teamId: todo\n   volume:\n     size: 1Gi\n     storageClass:\
  \ longhorn\n➋ numberOfInstances: 3\n   users:\n  ➌ todo:\n     - superuser\n   \
  \  - createdb\n   databases:\n  ➍ todo: todo\n   postgresql:\n     version: \"14\"\
  \n```\n\n此演练过程中显示的所有文件都已存放在 `/etc/kubernetes/todo` 目录，以便你探索它们并对更改进行实验。`todo` 应用会自动部署，但所有组件达到健康状态可能需要几分钟。\n\
  \nPostgres Operator 的工作是创建部署 PostgreSQL 所需的 `Secrets`、StatefulSets、Services 以及其他核心\
  \ Kubernetes 资源。我们只需要提供它应该使用的配置。我们首先确定此数据库的名称为 `todo-db` ➊，它将用作主 `Service` 的名称，我们将用它来连接主数据库实例，因此我们将在应用程序配置中再次看到这个名称。\n\
  \n我们需要一个高可用数据库，所以让我们指定三个实例 ➋。我们还要求 Postgres Operator 创建一个 `todo` 用户 ➌，并创建一个以 `todo`\
  \ 用户为所有者的 `todo` 数据库 ➍。这样，我们的数据库就已经准备好了，我们只需要填充表来存储应用程序数据。\n\n我们可以验证数据库是否在集群中运行：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get sts\nNAME      READY   AGE\ntodo-db\
  \   3/3     6m1s\n```\n\n`todo-db` StatefulSet 有三个 `Podss`，它们都已准备就绪。\n\n由于 Postgres\
  \ Operator 使用 StatefulSet，正如我们在第 15 章中所示，在创建数据库实例时，会为其分配一个 `PersistentVolumeClaim`：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get pvc\nNAME               STATUS   ...\
  \ CAPACITY   ACCESS MODES   STORAGECLASS   AGE\npgdata-todo-db-0   Bound    ...\
  \ 1Gi        RWO            longhorn       10m\npgdata-todo-db-1   Bound    ...\
  \ 1Gi        RWO            longhorn       8m44s\npgdata-todo-db-2   Bound    ...\
  \ 1Gi        RWO            longhorn       7m23s\n```\n\n如果其中一个数据库实例 `Pods` 失败并必须重建，这些\
  \ `PersistentVolumeClaims` 将被重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n如果其中一个数据库实例 `Pods` 失败并必须重建，这些 `PersistentVolumeClaims` 将被重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n如果其中一个数据库实例 `Pods` 失败并必须重建，这些 `PersistentVolumeClaims` 将被重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n由于我们运行在 `todo` 命名空间中，许多 Operator 倾向于运行在自己的命名空间中并跨集群操作，但 Postgres Operator 的设计是直接部署在数据库将所在的命名空间中。\n\
  \n由于我们使用了 Postgres Operator，可以通过向集群应用自定义资源来创建一个高可用 PostgreSQL 数据库：\n\nbash\nroot@host01:~#\
  \ kubectl -n todo get secret\nNAME                                            TYPE\n\
  todo-db-client-password                         kubernetes.io/serviceconfig\ntodo-db-root-password\
  \                           kubernetes.io/serviceconfig\n```\n\nPostgres Operator\
  \ 的工作是创建部署 PostgreSQL 所需的 `Secrets`、StatefulSets、Services 以及其他核心 Kubernetes 资源。我们只需要提供它应该使用的配置。我们首先确定此数据库的名称为\
  \ `todo-db` ➊，它将用作主 `Service` 的名称，我们将用它来连接主数据库实例，因此我们将在应用程序配置中再次看到这个名称。\n\n我们需要一个高可用数据库，所以让我们指定三个实例\
  \ ➋。我们还要求 Postgres Operator 创建一个 `todo` 用户 ➌，并创建一个以 `todo` 用户为所有者的 `todo` 数据库 ➍。这样，我们的数据库就已经准备好了，我们只需要填充表来存储应用程序数据。\n\
  \n我们可以验证数据库是否在集群中运行：\n\n```bash\nroot@host01:~# kubectl -n todo get sts\nNAME  \
  \    READY   AGE\ntodo-db   3/3     6m1s\n```\n\n`todo-db` StatefulSet 有三个 `Podss`，它们都已准备就绪。\n\
  \n由于 Postgres Operator 使用 StatefulSet，正如我们在第 15 章中所示，在创建数据库实例时，会为其分配一个 `PersistentVolumeClaim`：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get pvc\nNAME               STATUS   ...\
  \ CAPACITY   ACCESS MODES   STORAGECLASS   AGE\npgdata-todo-db-0   Bound    ...\
  \ 1Gi        RWO            longhorn       10m\npgdata-todo-db-1   Bound    ...\
  \ 1Gi        RWO            longhorn       8m44s\npgdata-todo-db-2   Bound    ...\
  \ 1Gi        RWO            longhorn       7m23s\n```\n\n这些 `PersistentVolumeClaims`\
  \ 在其中一个数据库实例 `Pods` 失败并必须重建时将通过重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n如果其中一个数据库实例 `Pods` 失败并必须重建，这些 `PersistentVolumeClaims` 将被重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n如果其中一个数据库实例 `Pods` 失败并必须重建，这些 `PersistentVolumeClaims` 将被重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n### 部署应用程序\n\n在这一部分中，我们将学习如何部署 `todo` 应用程序。首先，我们需要在 `todo` 命名空间中查看生成的 Secret：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get secret\nNAME                     \
  \                       TYPE\ntodo-db-client-password                         kubernetes.io/serviceconfig\n\
  todo-db-root-password                           kubernetes.io/serviceconfig\n```\n\
  \nPostgres Operator 的工作是创建部署 PostgreSQL 所需的 `Secrets`、StatefulSets、Services 以及其他核心\
  \ Kubernetes 资源。我们只需要提供它应该使用的配置。我们首先确定此数据库的名称为 `todo-db` ➊，它将用作主 `Service` 的名称，我们将用它来连接主数据库实例，因此我们将在应用程序配置中再次看到这个名称。\n\
  \n我们需要一个高可用数据库，所以让我们指定三个实例 ➋。我们还要求 Postgres Operator 创建一个 `todo` 用户 ➌，并创建一个以 `todo`\
  \ 用户为所有者的 `todo` 数据库 ➍。这样，我们的数据库就已经准备好了，我们只需要填充表来存储应用程序数据。\n\n我们可以验证数据库是否在集群中运行：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get sts\nNAME      READY   AGE\ntodo-db\
  \   3/3     6m1s\n```\n\n`todo-db` StatefulSet 有三个 `Podss`，它们都已准备就绪。\n\n由于 Postgres\
  \ Operator 使用 StatefulSet，正如我们在第 15 章中所示，在创建数据库实例时，会为其分配一个 `PersistentVolumeClaim`：\n\
  \n```bash\nroot@host01:~# kubectl -n todo get pvc\nNAME               STATUS   ...\
  \ CAPACITY   ACCESS MODES   STORAGECLASS   AGE\npgdata-todo-db-0   Bound    ...\
  \ 1Gi        RWO            longhorn       10m\npgdata-todo-db-1   Bound    ...\
  \ 1Gi        RWO            longhorn       8m44s\npgdata-todo-db-2   Bound    ...\
  \ 1Gi        RWO            longhorn       7m23s\n```\n\n这些 `PersistentVolumeClaims`\
  \ 在其中一个数据库实例 `Pods` 失败并必须重建时将通过重用，而且 `Longhorn` 存储引擎将其存储分布在整个集群上，因此即使我们丢失节点，数据库也将保留应用程序数据。\n\
  \n### 部署应用程序\n\n现在，我们将部署 `todo` 应用程序。我们将创建一个名为 `deployment.yaml` 的文件：\n\n```yaml\n\
  apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: todo\n  labels:\n    app:\
  \ todo\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: todo\n \
  \ template:\n    metadata:\n      labels:\n        app: todo\n    spec:\n      containers:\n\
  \      - name: todo\n        image: todo-app:latest\n        ports:\n        - containerPort:\
  \ 8080\n```\n\n现在，我们使用以下命令来部署该配置：\n\n```bash\nkubectl apply -f deployment.yaml -n\
  \ todo\n```\n\n此命令将在 Kubernetes 集群中创建一个 `Deployment` 资源。我们可以通过以下命令来检查其状态：\n\n```bash\n\
  kubectl -n todo get deployments\n```\n\n输出将显示如下：\n\n```\nNAME    READY   UP-TO-DATE\
  \   AGE\ntodo    3/3             10s\n```\n\n接下来，我们需要创建一个 `service.yaml` 来暴露 `todo`\
  \ 应用程序：\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: todo\nspec:\n\
  \  selector:\n    app: todo\n  ports:\n    - protocol: TCP\n      port: 80\n   \
  \   targetPort: 8080\n```\n\n使用以下命令部署 Service：\n\n```bash\nkubectl apply -f service.yaml\
  \ -n todo\n```\n\n我们可以验证 Service 是否已创建：\n\n```bash\nkubectl -n todo get svc\n```\n\
  \n输出将显示如下：\n\n```\nNAME    TYPE        CLUSTER-IP     PORT        AGE\ntodo    ClusterIP\
  \   10.96.0.10    80/TCP       5s\n```\n\n最后，我们可以通过 `port-forward` 来访问 `todo` 应用程序：\n\
  \n```bash\nkubectl -n todo port-forward service/todo 8080:8080\n```\n\n现在，你可以在浏览器中访问\
  \ `http://localhost:8080` 来查看 `todo` 应用程序。\n\n\n\n通过这一部分，我们现在开始定义此 Deployment 创建的\
  \ Pod 模板了。Deployment YAML 的其余部分完成了 Pod 模板，它完全由该 Pod 运行的单个容器配置组成：\n\n```\n spec:\n\
  \      containers:\n      - name: todo\n        image: bookofkubernetes/todo:stable\n\
  ```\n\n容器名称主要是信息性的，但对于包含多个容器的 Pod 来说，它是必需的，因为当我们需要检索日志并使用 `exec` 执行命令时，我们需要选择特定的容器。image\
  \ 告诉 Kubernetes 应该获取哪个容器镜像来运行此容器。\n\nPod 模板的下一部分指定了该容器的环境变量：\n\n```\n env:\n   \
  \     - name: NODE_ENV\n          value: production\n        - name: PREFIX\n  \
  \        value: /\n        - name: PGHOST\n          value: todo-db\n        - name:\
  \ PGDATABASE\n          value: todo\n        - name: PGUSER\n          valueFrom:\n\
  \            secretKeyRef:\n              name: todo.todo-db.credentials.postgresql.acid.zalan.do\n\
  \              key: username\n              optional: false\n        - name: PGPASSWORD\n\
  \          valueFrom:\n            secretKeyRef:\n              name: todo.todo-db.credentials.postgresql.acid.zalan.do\n\
  \              key: password\n              optional: false\n```\n\n某些环境变量具有静态值；它们预计在此\
  \ Deployment 的所有使用场景中保持不变。`PGHOST` 环境变量与 PostgreSQL 数据库的名称匹配。Postgres Operator 已经在这些\
  \ Pod 运行的 `todo` 命名空间（Namespace）中创建了一个名为 `todo-db` 的 Service，因此 Pod 能够将此主机名解析为 Service\
  \ 的 IP 地址。发往 Service IP 地址的流量将通过我们在第 9 章中看到的 `iptables` 配置路由到主 PostgreSQL 实例。\n\n\
  最后两个变量提供了应用程序身份验证数据库所需的凭据。我们正在利用从 `Secret` 获取配置并将其作为环境变量提供给容器的能力，这类似于我们在第 16 章中看到的用法。然而，在这种情况下，我们需要环境变量名称与\
  \ `Secret` 中的键名不同，因此我们使用略有不同的语法，允许我们单独指定每个变量名。\n\n最后，我们声明了该容器的资源需求及其暴露的端口：\n\n```\n\
  \ resources:\n          requests:\n            memory: \"128Mi\"\n            cpu:\
  \ \"50m\"\n          limits:\n            memory: \"128Mi\"\n            cpu: \"\
  50m\"\n        ports:\n        - name: web\n          containerPort: 5000\n```\n\
  \nPod 中的 `ports` 字段纯是信息性的；实际的流量路由将在 Service 中配置。\n\n在 `resources` 字段中，我们将该容器的请求（requests）和限制（limits）设置为相同。正如我们在第\
  \ 19 章中看到的，这意味着 Pod 将被放入“保证”（Guaranteed）服务质量类别。web 服务组件是无状态的且易于扩展，因此使用相对低的 CPU 限制（在此情况下为\
  \ 50 毫瓦核心，即一个核心的 5%）是有合理的，并依赖自动伸缩来在负载变高时创建新实例。\n\n### Pod 自动伸缩容\n\n为了自动伸缩 Deployment\
  \ 以匹配当前负载，我们使用 `HorizontalPodAutoscaler`，正如我们在第 7 章中看到的。以下是自动伸缩器的配置：\n\n`scaler.yaml`\n\
  \n```\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n\
  \  name: todo\n  labels:\n    app: todo\nspec:\n  scaleTargetRef:\n    apiVersion:\
  \ apps/v1\n    kind: Deployment\n    name: todo\n  minReplicas: 3\n  maxReplicas:\
  \ 10\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n\
  \        type: Utilization\n        averageUtilization: 50\n```\n\n正如我们在之前的示例中所做的那样，我们向此资源应用了一个标签仅仅是为了信息目的。此自动伸缩器需要三个关键配置项。首先，`scaleTargetRef`\
  \ 指定了我们想要伸缩 `todo` Deployment。因为此自动伸缩器部署在 `todo` 命名空间中，它能找到正确的 Deployment 进行伸缩。\n\
  \n其次，我们为 `minReplicas` 和 `maxReplicas` 指定了一个范围。我们选择 3 作为最小副本数，因为我们希望即使发生 Pod 故障应用程序也具有韧性。为了简单起见，我们没有应用在第\
  \ 18 章中看到的反亲性配置，但这可能也是一种良好的实践，以避免所有实例都位于单个节点上。我们根据集群的大小选择最大副本数；对于生产环境应用程序，我们将测量应用程序负载，并根据预期处理的最高负载进行选择。\n\
  \n第三，我们需要指定自动伸缩器用于判断需要多少个副本的指标。我们基于 CPU 利用率构建此自动伸缩器。如果所有 Pod 的平均利用率超过 Pod 请求的 50%，Deployment\
  \ 将会被扩容。我们将请求设置为 50 毫瓦核心，这意味着平均利用率大于 25 毫瓦核心将导致自动伸缩器增加副本数量。\n\n为了获取平均 CPU 利用率，自动伸缩器依赖于从\
  \ API 获取指标的集群基础设施。对于本章，我们有一些额外的功能演示。\n\n### 应用 Service\n\n我们应用程序的最后一个集群资源是 Service。列表\
  \ 20-1 展示了我们本章使用的定义。\n\n`service.yaml`\n\n```\n---\nkind: Service\napiVersion: v1\n\
  metadata:\n  name: todo\n  labels:\n    app: todo\nspec:\n  type: NodePort\n  selector:\n\
  \    app: todo\n  ports:\n  - name: web\n    protocol: TCP\n    port: 5000\n   \
  \ nodePort: 5000\n```\n\n列表 20-1：Todo Service\n\n我们使用与 Deployment 相同的选择器来查找接收流量的\
  \ Pod。正如我们在第 9 章中看到的，Service 的 `ports` 字段是关重要的，因为 `iptables` 流量路由仅针对我们识别的端口配置。在这种情况下，我们将端口声明为\
  \ 5000 没有声明 `targetPort`，因此 Service 将指向 Pod 的 5000 端口，这与 Web 服务器监听的端口匹配。我们还为此端口配置了名称，这在配置监控时非常重要。\n\
  \n对于本章，我们使用 `NodePort` 暴露我们的应用程序 Service，这意味着集群的所有节点都将配置为将流量路由到任何主机接口的 `nodePort`。因此，我们可以访问集群中任何一个节点的\
  \ 5000 端口，并路由到我们的应用程序：\n\n```\nroot@host01:~# curl -v http://host01:5000/\n...\n\
  < HTTP/1.1 200 OK\n< X-Powered-By: Express\n...\n<html lang=\"en\" data-framework=\"\
  backbonejs\">\n    <head>\n        <meta charset=\"utf-8\">\n        <title>Todo-Backend\
  \ client</title>\n        <link rel=\"stylesheet\" href=\"css/vendor/todomvc-common.css\"\
  >\n        <link rel=\"stylesheet\" href=\"css/chooser.css\">\n    </head>\n...\n\
  </html>\n```\n\n**NODEPORT，非 INGRESS**\n\n\n\n\n\n当我们在第 1 章中部署 todo 时，我们通过 Ingress\
  \ 暴露了 Service。正如我们在第 9 章中所看到的，Ingress 整合了多个 Service，使其能够在无需每个 Service 都拥有独立的外部路由\
  \ IP 地址的情况下暴露到集群之外。我们将在本章稍后还会暴露一个监控服务，因此有多个 Service 需要暴露到集群之外。然而，由于我们使用的是一个私有网络上的示例集群，我们没有底层的网络基础设施来充分发挥\
  \ Ingress 的潜力。通过改用 `NodePort`，我们能够以一种同时兼容 Vagrant 和 Amazon Web Services 配置的方式，将多个\
  \ Service 暴露到集群之外。\n\n现在我们已经查看了 todo 应用的所有组件，并利用了书中中学到的知识消除了单点故障并最大化了可扩展性。\n\n你可以在\
  \ `[`github.com/book-of-kubernetes/todo`](https://github.com/book-of-kubernetes/todo)`\
  \ 查看 todo 应用的源代码，包括用于构建应用程序容器镜像的 `Dockerfile`，以及在代码更改时自动构建并发布到 Docker Hub 的 GitHub\
  \ Actions。\n\n然而，尽管我们的 Kubernetes 集群现在会尽力保持此应用程序运行并保持良好性能，但我们可以在监控 todo 应用和 Kubernetes\
  \ 集群方面做得更多。\n\n### 应用和集群监控\n\n适当的应用和集群监控对于应用程序来说至关重要，原因有多个。首先，虽然我们的 Kubernetes 集群会尝试保持应用程序运行，但任何硬件或集群故障都可能导致应用程序处于无法工作或下降的状态。如果没有监控，我们将依赖用户来告诉我们应用程序何时宕机或运行异常，这种用户体验是糟糕的。其次，如果我们确实看到应用程序出现故障或性能问题，我们需要数据来诊断这些问题，或者尝试识别某种模式以找到根源。预先构建好监控比在出现问题后尝试应用它要容易得多。最后，我们的集群或应用程序可能会出现发生在用户察觉层级以下的问题，但这些问题预示着潜在的性能或稳定性问题。集成适当的监控允许我们在这些问题演变成更大的麻烦之前检测到它们。它还允许我们随时间衡量应用程序，以确保新增的功能没有降低其性能。\n\
  \n幸运的是，尽管我们确实需要在每个应用程序组件层面考虑监控，但我们不需要自己构建监控框架。许多成熟的监控工具已经设计为在 Kubernetes 集群中运行，因此我们可以快速上手。在本章中，我们将查看\
  \ `kube-prometheus`，这是一个完整的工具栈，我们可以将其部署到集群中，并用于监控集群和 todo 应用。\n\n### Prometheus\
  \ 监控\n\n`kube-prometheus`的核心组件正如其名，是开源 Prometheus 监控软件。Prometheus 以服务器的形式部署，定期查询各种指标源并积累接收到的数据。它支持一种针对“时间序列”数据优化的查询语言，易于收集显示系统某一时刻性能的单个数据点。然后它聚合这些数据点以获取系统负载、资源利用和响应能力的状况。\n\
  \n对于每个暴露指标的组件，Prometheus 期望访问一个 URL 并接收标准格式返回的数据。使用 `/metrics` 路径向 Prometheus 暴露指标是很常见的。遵循这一惯例，Kub\
  \ 控制平面组件已经以 Prometheus 期望的格式暴露了指标。\n\n我们可以使用 `curl` 访问 API 服务器上的 `/metrics` 路径来查看它提供的指标。为了做到，我们需要对\
  \ API 服务器进行验证，因此让我们使用收集客户端证书进行验证的脚本：\n\n`api-metrics.sh`\n\n```\n#!/bin/bash\nconf=/etc/kubernetes/admin.conf\n\
  ...\ncurl --cacert $ca --cert $cert --key $key https://192.168.61.10:6443/metrics\n\
  ...\n```\n\n运行此脚本会返回丰富的 API 服务器指标：\n\n```\nroot@host01:~# /opt/api-server-metrics.sh\n\
  ...\n# TYPE rest_client_requests_total counter\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"GET\"} 9051\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"PATCH\"} 25\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"PUT\"} 21\nrest_client_requests_total{code=\"\
  201\",host=\"[::1]:6443\",method=\"POST\"} 179\nrest_client_requests_total{code=\"\
  404\",host=\"[::1]:6443\",method=\"GET\"} 155\nrest_client_requests_total{code=\"\
  404\",host=\"[::1]:6443\",method=\"PUT\"} 1\nrest_client_requests_total{code=\"\
  409\",host=\"[::1]:6443\",method=\"POST\"} 5\nrest_client_requests_total{code=\"\
  409\",host=\"[::1]:6443\",method=\"PUT\"} 62\nrest_client_requests_total{code=\"\
  500\",host=\"[::1]:6443\",method=\"GET\"} 15...\n```\n\n此示例仅说明了收集的数百个指标中的一小部分。响应的每行都为\
  \ Prometheus 提供了一个数据点。我们可以在大括号中包含额外的参数，允许更复杂的查询。例如，上示例中的 API 服务器数据不仅可以确定 API 服务器的服务总数，还可以确定响应的原始数量。\n\
  \n除了 Kubernetes 集群已经提供的所有数据外，我们还可以配置应用程序来暴露指标。我们的应用程序基于 Node.js，因此我们使用 `prom-client`\
  \ 库来实现此。正如列表 20-2 所示，我们的 todo 应用像 API 服务器一样在 `/metrics` 暴露指标。\n\n```\nroot@host01:~#\
  \ curl http://host01:5000/metrics\n# HELP api_success Successful responses\n# TYPE\
  \ api_success counter\napi_success{app=\"todo\"} 0\n\n# HELP api_failure Failed\
  \ responses\n# TYPE api_failure counter\napi_failure{app=\"todo\"} 0\n...\n# HELP\
  \ process_cpu_seconds_total Total user and system CPU time\n# TYPE process_cpu_seconds_total\
  \ counter\nprocess_cpu_seconds_total{app=\"todo\"} 0.106392\n```\n\n*列表 20-2: Todo\
  \ 指标*\n\n响应包含与所有应用程序相关的默认指标。它还包含特定 todo 应用的计数器，用于随时间跟踪 API 使用情况和响应。\n\n### 部署 kube-prometheus\n\
  \n此时，我们的 Kubernetes 集群和应用程序已准备好按需提供这些指标，但我们还没有在集群中运行 Prometheus 服务器来收集它们。为了解决这个问题，我们将部署完整的\
  \ kube-prometheus 栈。这不仅包括一个可以轻松部署和配置 Prometheus 的 Prometheus Operator，还包括其他有用工具，例如\
  \ Alertmanager（它可以响应集群和应用程序警报触发通知）以及 Grafana（我们将用它查看收集的指标的仪表板工具）。\n\n要部署 kube-prometheus，我们将使用安装在\
  \ `/opt` 中的脚本。该脚本从 GitHub 下载当前的 kube-prometheus 版本并应用清单文件。\n\n如下所示运行脚本：\n\n```\n\
  root@host01:~# /opt/install-kube-prometheus.sh\n...\n```\n\n\n\n\n这些清单文件还包含一个 Prometheus\
  \ Adapter。Prometheus Adapter 实现与我们在第二部分部署到集群的 `metrics-server` 相同的 Kubernetes 指标\
  \ API，因此它暴露了从 `kubelet` 获取的 CPU 和内存数据，使我们的 `HorizontalPodAutoscaler` 能够跟踪 todo 的\
  \ CPU 利用率。然而，它也将这些利用率数据暴露给 Prometheus，以便我们可以在 Grafana 仪表板中进行观察。由于这个原因，我们在本章中使用 Prometheus\
  \ Adapter 代替普通的 `metrics-server`。\n\n我们可以通过列出监控命名空间下的 Pods 来看到 Prometheus Adapter\
  \ 和其他组件：\n\n```bash\nroot@host01:~# kubectl -n monitoring get pods\nNAME       \
  \                            READY   STATUS    RESTARTS   AGE\nalertmanager-main-0\
  \                    2/2     Running   0          14m\nalertmanager-main-1     \
  \               2/2     Running   0          14m\nalertmanager-main-2          \
  \          2/2     Running   0          14m\nblackbox-exporter-6b79c4588b-pgp5r\
  \     3/3     Running   0          15m\ngrafana-7fd69887fb-swjpl               1/1\
  \     Running   0          15m\nkube-state-metrics-55f67795cd-mkxqv    3/3     Running\
  \   0          15m\nnode-exporter-4bhhp                    2/2     Running   0 \
  \         15m\nnode-exporter-8mc5l                    2/2     Running   0      \
  \    15m\nnode-exporter-ncfd2                    2/2     Running   0          15m\n\
  node-exporter-qp7mg                    2/2     Running   0          15m\nnode-exporter-rtn2t\
  \                    2/2     Running   0          15m\nnode-exporter-tpg97     \
  \               2/2     Running   0          15m\nprometheus-adapter-85664b6b74-mglp4\
  \    1/1     Running   0          15m\nprometheus-adapter-85664b6b74-nj7hp    1/1\
  \     Running   0          15m\nprometheus-k8s-0                       2/2     Running\
  \   0          14m\nprometheus-k8s-1                       2/2     Running   0 \
  \         14m\nprometheus-operator-6dc9f66cb7-jtrqd   2/2     Running   0      \
  \    15m\n```\n\n除了 Prometheus Adapter 外，我们还看到了 Alertmanager、Grafana 以及各种 exporter\
  \ Pods，它们从集群基础设施中收集指标并将其暴露给 Prometheus。我们还看到了 Prometheus 本身以及 Prometheus Operator\
  \ 的 Pod。每当我们更改 Prometheus Operator 监控的自定义资源时，Prometheus Operator 就会自动更新 Prometheus。这些自定义资源中最重要的是列表\
  \ 20-3 所示的 `Prometheus` 资源。\n\n```bash\nroot@host01:~# kubectl -n monitoring describe\
  \ prometheus\nName:         k8s\nNamespace:    monitoring\n...\nAPI Version:  monitoring.coreos.com/v1\n\
  Kind:         Prometheus\n...\nSpec:\n...\n  Image:  quay.io/prometheus/prometheus:v2.32.1\n\
  ...\n  Service Account Name:  prometheus-k8s\n  Service Monitor Namespace Selector:\n\
  \  Service Monitor Selector:\n...\n```\n\n*列表 20-3：Prometheus 配置*\n\n`Prometheus`\
  \ 自定义资源允许我们配置监控哪些命名空间以查找要监控的 Service。列表 20-3 所示的默认配置没有为 `Service Monitor Namespace\
  \ Selector` 或 `Service Monitor Selector` 指定值。因此，默认情况下，Prometheus Operator 将所有命名空间中查找监控配置，带有任何元数据标签。\n\
  \n为了识别要监控的特定 Service，Prometheus Operator 会留意另一个自定义资源 `ServiceMonitor`，如列表 20-4 所示。\n\
  \n```bash\nroot@host01:~# kubectl -n monitoring get servicemonitor\nNAME       \
  \               AGE\nalertmanager-main         20m\nblackbox-exporter         20m\n\
  coredns                   20m\ngrafana                   20m\nkube-apiserver   \
  \         20m\nkube-controller-manager   20m\nkube-scheduler            20m\nkube-state-metrics\
  \        20m\nkubelet                   20m\nnode-exporter             20m\nprometheus-adapter\
  \        20m\nprometheus-k8s            20m\nprometheus-operator       20m\n```\n\
  \n*列表 20-4：默认 ServiceMonitors*\n\n当我们安装 `kube-prometheus` 时，它配置了多个 `ServiceMonitor`\
  \ 资源。结果是我们的 Prometheus 实例已经在监控 Kubernetes 控制平面组件以及运行在集群节点上的 `kubelet` 服务。让我们看看 Prometheus\
  \ 抓取指标的目标源，并看看这些指标是如何被用于填充 Grafana 仪表板的。\n\n### 集群指标\n\n安装脚本修补了监控命名空间下的 `Grafana`\
  \ 和 `Prometheus` Service，将它们暴露为 `NodePort` Service。自动化脚本会打印出你可以用于访问 Prometheus 的\
  \ URL。初始页面所示图 20-1。\n\n![Image](img/f0337-01.jpg)\n\n*图 20-1：Prometheus 初始页*\n\n\
  点击“Status”菜单下的 `Targets` 项目，查看 Prometheus 正在抓取哪些组件。点击 `Collapse All` 以获取汇总列表，所示图\
  \ 20-2。\n\n![Image](img/f0337-01.jpg)\n\n*图 20-2：Prometheus targets*\n\n这与我们在列表\
  \ 20-4 中看到的 ServiceMonitors 相匹配。Prom Adapter 暴露了一个 `/metrics` 端点供 Prometheus 抓取并存储，而\
  \ Grafana 则查询 Prometheus 来构建图表。我们可以使用 Prometheus 界面查询数据，但 Grafana 已经配置了一些实用的仪表板，因此我们可以在那里查看数据。使用默认的\
  \ `admin` 作为用户名、`admin` 作为密码登录。系统会提示你更改密码；你可以点击 *Skip*。此时你应该你应该看到 Grafana 的初始页，所示图\
  \ 20-3。\n\n![Image](img/f338-01.jpg)\n\n*图 20-3：Grafana 初始页*\n\n从此页面，选择 `Dashboards`\
  \ 下的 `Browse` 项目。*Default* 文件夹中有许多仪表板。例如，通过选择 `Default` 然后选择 `Kubernetes` ▸ `Compute\
  \ Resources` ▸ `Pod`，你可以看到一个显示 Pod 随时间变化的 CPU 和内存使用情况的仪表板，所示图 20-4](#ch20.xhtml_ch20fig4)。\n\
  \n![Image](img/f338-02.jpg)\n\n*图 20-4：Pod 计算资源*\n\n在该仪表板中，通过首先选择 todo 命名空间，可以选择所有的\
  \ 数据库和应用程序 Pod，因此我们只需要默认配置即可获取有关应用程序的有价值信息。这是因为 Prometheus Adapter 正在从 `kubelet`\
  \ 服务提取数据，其中包括每个运行 Pod 的资源利用率。在 `kube-prometheus` 的默认安装中，还有许多其他 Grafana 仪表板可以探索。再次选择\
  \ *Browse* 菜单项以选择其他仪表板并查看可用数据。\n\n尽管我们已经为 todo 获取了实用的指标，但 Prometheus 尚未抓取我们的应用程序\
  \ Pod 以引入我们在列表 20-2 中看到的 Node.js 指标。为了配置 Prometheus 抓取我们的 todo 指标，我们需要为 Prometheus\
  \ Operator 提供一个新的 `ServiceMonitor` 资源，告知它我们的 todo Service。\n\n在生产集群中，部署此类 todo 应用程序的团队没有权限在监控命名空间中创建或更新资源。然而，Prometheus\
  \ Operator 默认会在所有命名空间查找 `ServiceMonitor` 资源，因此我们可以在 todo 命名空间中创建 `ServiceMonitor`。\n\
  \n\n\n\n首先，我们需要赋予 Prometheus 权限来查看我们在 `todo` `Namespace` 中创建的 `Pods` 和 `Services`。由于此访问控制配置只需要应用于单个\
  \ `Namespace`，我们将通过创建一个 `Role` 和一个 `RoleBinding` 来来实现。以下是我们将使用的 `Role` 配置：\n\n`rbac.yaml`\n\
  \n```\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n...\n\
  \  name: prometheus-k8s\nrules:\n  - apiGroups:\n    - \"\"\n    resources:\n  \
  \  - services\n    - endpoints\n    - pods\n    verbs:\n    - get\n    - list\n\
  \    - watch\n...\n```\n\n我们需要确保允许对 `Services`、`Pods` 和 `Endpoints` 的访问，因此我们确认这些内容已列在\
  \ `resources` 字段中。`Endpoint` 资源记录了正在接收 `Service` 流量的 `Pods`，这对于 Prometheus 识别它所抓取的所有\
  \ `Pods` 至关重要。因为 Prometheus 只需要读取权限，我们只指定了 `get`、`list` 和 `watch` 动词。\n\n在我们拥有此\
  \ `Role` 后，需要将其绑定到 Prometheus 正在使用的 `ServiceAccount`。我们通过这个 `RoleBinding` 来：\n\n\
  `rbac.yaml`\n\n```\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\n\
  metadata:\n...\n  name: prometheus-k8s\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n\
  \  kind: Role\n  name: prometheus-k8s\nsubjects:\n  - kind: ServiceAccount\n   \
  \ name: prometheus-k8s\n    namespace: monitoring\n```\n\n`roleRef` 匹配我们在上一个示例中声明的\
  \ `Role`，而 `subjects` 字段则根据我们在代码列表 20-3 中看到的信息列出了 Prometheus 正在使用的 `ServiceAccount`。\n\
  \n这两个 `YAML` 资源都在同一个文件中，因此我们可以一次将它们应用到集群。我们需要确保将它们应用到 `todo` `Namespace`，因为那才是我们希望启用\
  \ Prometheus 访问的 `Namespace`：\n\n```\nroot@host01:~# kubectl -n todo apply -f /opt/rbac.yaml\n\
  role.rbac.authorization.k8s.io/prometheus-k8s created\nrolebinding.rbac.authorization.k8s.io/prometheus-k8s\
  \ created\n```\n\n现在我们已经授予了 Prometheus 查看我们的 `Pods` 和 `Services` 的权限，可以创建 `ServiceMonitor`\
  \ 了。这是它的定义：\n\n`svc-mon.yaml`\n\n```\n---\napiVersion: monitoring.coreos.com/v1\n\
  kind: ServiceMonitor\nmetadata:\n  name: todo\nspec:\n  selector:\n    matchLabels:\n\
  \      app: todo\n  endpoints:\n    - port: web\n```\n\n`ServiceMonitor` 使用 `selector`，类似于\
  \ `Service` 或 `Deployment`。我们之前已经为 `Service` 应用了 `app: todo` 标签，因此 `matchLabels`\
  \ 字段将使 Prometheus 选取到该 `Service`。`endpoints` 字段匹配我们在代码列表 20-1 的 `Service` 中声明的端口名称。Prometheus\
  \ 要求我们为端口命名以便进行匹配。\n\n让我们将此 `ServiceMonitor` 应用到集群：\n\n```\nroot@host01:~# kubectl\
  \ -n todo apply -f /opt/svc-mon.yaml\nservicemonitor.monitoring.coreos.com/todo\
  \ created\n```\n\n和之前一样，我们需要确保将其部署到 `todo` `Namespace`，因为 Prometheus 将配置为在与 `ServiceMonitor`\
  \ 相同的 `Namespace` 中寻找带有标签的 `Services`。\n\n由于 Prometheus Operator 正在监听新的 `ServiceMonitor`\
  \ 资源（使用我们在第 17 章中看到的 API），它会捕获这个新资源并立即重新配置 Prometheus 开始抓取该 `Service`。然后 Prometheus\
  \ 需要几分钟时间来注册新目标并开始抓取它们。在完成完成后返回 Prometheus Targets 页面，新的 `Service` 就会出现，如图 20-5\
  \ 所示。\n\n![Image](img/f0341-01.jpg)\n\n*图 20-5：Prometheus 监控 todo*\n\n如果我们点击 todo\
  \ `Service` 旁边的 `show more` 按钮，就能看到它的三个 `Endpoints`，如图 20-6 所示。\n\n![Image](img/f0342-01.jpg)\n\
  \n*图 20-6：Todo Endpoints*\n\n我们创建了一个 `ServiceMonitor` 并指定 todo `Service` 为目标，但 Prometheus\
  \ 抓取的却是 `Pods`，这可能会令人惊讶。然而，Prometheus 这样工作是非常重要的。因为 Prometheus 使用普通的 HTTP 请求来抓取指标，而且\
  \ Service 流量路由为每个新连接选择随机的 `Pod`，因此 Prometheus 每次抓取时都会从随机的 `Pod` 获取指标。通过深入 `Service`\
  \ 识别 `Endpoints`，Prometheus 能够抓取该 `Service` 所有 `Pods` 的指标，从而实现对整个应用程序指标的聚合。\n\n\
  我们成功地将 todo 应用的 Node.js 和自定义指标整合到了 Prometheus 中，此外还有已收集的默认资源利用指标。在我们结束应用程序监控之前，让我们运行一个\
  \ Prometheus 查询来演示数据正在被拉取。首先，您应该使用自动化脚本打印出的 URL 与 todo 应用进行交互。这将确保有指标显示，并且为 Prometheus\
  \ 留出了足够的时间。\n\n\n\n\nAmazon Web Services（亚马逊云），xxi, 16, 91, 96, 139, 250, 332\n\n\
  Ansible, xx, xxi\n\n反亲性 (anti-affinity), 297–300, 302, 303, 317, 330\n\nAPI 服务器。*参见**\
  \ Kubernetes: API server\n\nAPI, Kubernetes。*参见** Kubernetes: REST API\n\napk, 157,\
  \ 183\n\n应用服务器, 5\n\napt, 27, 92–94\n\n架构, 1, 3–7, 17, 87–89, 124, 144, 153, 188,\
  \ 218, 228, 249, 296, 302, 303, 309, 321\n\nArgoCD, 267\n\nARP。*参见*地址解析协议\n\n身份验证,\
  \ 99, 105, 130, 188, 190–192, 195, 200, 203, 207, 210, 269, 275, 278, 285, 326,\
  \ 329, 333\n\n授权, 188, 190, 191, 193, 203, 295\n\n可用区域, 139, 297, 298, 302\n\nAWS。*参见*Amazon\
  \ Web Services\n\n### B\n\n后台处理, 312\n\nbase64 编码, 277\n\nbind-tools, 157\n\n断点,\
  \ 184\n\nbr_netfilter, 91\n\nBrooks, Fred, 5\n\nBuildah, 26\n\n突发性的, 309\n\nBusyBox,\
  \ 24, 28, 29, 35, 53–58, 60, 61, 63–66, 76, 82, 83, 133, 155, 156\n\n### C\n\nC,\
  \ 179, 180\n\n缓存, 295\n\nCalico, 100–102, 106–109, 127, 128, 130, 131, 133–135,\
  \ 137, 139–141, 144, 146, 147, 149, 194, 211, 213, 280, 281, 288\n\n安装, 281\n\n\
  cat, 207\n\ncgroups, 313。*另见*Linux: cgroups\n\n变更跟踪, 224, 267\n\n特殊文件, 80\n\nchroot,\
  \ 22, 70\n\n云原生, 4, 6, 7, 17, 88, 89, 298, 316\n\n云原生计算基金, 91\n\n集群角色, 195–197,\
  \ 201, 286, 287\n\n集群角色绑定, 197, 202\n\nCNI。*参见*Container Network Interface\n\n粘性,\
