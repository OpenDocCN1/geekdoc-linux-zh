    # Networking and Protocols


    One of the most important subjects for the aspiring hacker to study is that of
    network architecture and protocols. Computers can be networked in many different
    configurations and sizes, and with different technologies that govern their interconnection.
    From copper wire, to fiber optics, to wireless and satellite connections, as well
    as combinations of all of these media, we have built a vast network of computers
    across the globe. This network can be understood in its entirety on a large scale
    as well as viewed as a connection of smaller self-contained networks.


    In terms of size, computer networks have been traditionally categorized as Local
    Area Networks (LAN) and Wide Area Networks (WAN). WANs typically connect multiple
    LANs. There are multiple designations for different sizes of networks, and the
    terminology is always changing as new technologies and conductivities develop.
    Keeping up with these changes is one of the ongoing tasks of a hacker.


    Networks also have different architectures. The architecture is determined not
    only by the configuration of the different nodes but also on the medium that connects
    them. Originally, networked computers were always connected by copper wire. Commonly
    used copper network cables, often known as ethernet cables, consisting of twisted
    pairs of copper wire. Although the most common of these cables is the category
    five, or CAT-5, cable, which is beginning to give way to a new standard, CAT-6,
    which has a greater capacity for transmission of signals. For very high speed
    applications and longer distances, fiber-optic cables are usually chosen. Fiber
    optics use light instead of electricity and have a very high capacity for carrying
    information. They are used to carry most modern cable television and high speed
    internet services. Fiber optics serve as the backbone for the internet. Within
    smaller areas, wireless networks are very common. Using a Wireless Fidelity (Wi-Fi)
    protocol, wireless networks exist in a large number of personal, private, and
    commercial LANs. Hackers are often particularly interested in hacking into Wi-Fi
    networks, resulting in the evolution of Wi-Fi security standards.


    Regardless of the architecture or medium of transmission, when two terminals are
    communicating across a network they must do using a'
