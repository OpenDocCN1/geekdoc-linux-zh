    john@mybank.com 与 john@my-bank.com 的区别）。有时，高级黑客能够伪造回信邮件地址，使其看起来与合法地址完全相同，但邮件头文件中包含了可以指示恶意意图的信息。邮件中提供的任何链接都应该带有一定的怀疑态度。你应该确保这些链接来自你信任的人，并问问自己那个人是否会发送那种种的链接。一点点常识将大有益处。在打开任何邮件附件（尤其是可执行文件）之前，应该对该邮件运行病毒或恶意软件扫描。


    ## 计算机软件安全


    计算机安全专家有时对杀毒软件的效能存在分歧。有人认为，昂贵的病毒和恶意软件防护软件是浪费钱，因为高级黑客擅长规避这些防护。然而，有多种免费的计算机软件套件可用，只要安全软件保持更新，就能保护大多数用户的计算机系统免受大多数基础且常见的恶意侵害。


    无论如何，大多数软件都通过补丁和更新提供自身的安全性。这就是为什么用户更新其软件和操作系统，或允许这些程序自动更新非常重要。这对于修复操作系统和网络浏览器的漏洞尤为关键。Microsoft
    Windows、Java 和 Adobe Flash 经常成为黑客攻击的目标，应该不断保持最新更新。


    ## 网络安全与加密


    Wi-Fi 路由器的加密协议应设置为其特定硬件支持的最高加密级别。将你的路由器设置为公开广播网络名称也是一种良好的做法（尽管大多数黑客可以轻易绕过这一招数）。密码安全在
    Wi-Fi 网络上尤为重要，因为足够长且复杂的密码可以显著增加黑客破解你网络密码的时间。在许多情况下，使用具有最大长度和足够复杂度密码的 WPA-2 加密，会让黑客破解网络变得极其困难且耗时，以至于他们会直接转向另一个安全性较低的目标。


    ## Web 应用程序安全


    网站应用程序中的漏洞非常多，特别是 Web 代码中存在的 SQL 及其他脚本语言中的漏洞。提供用户访问信息和服务的网站程序员需要针对一些常见的攻击建立某些保护措施。许多
    SQL 注入攻击可以通过在用户输入附加到任何 SQL 命令之前对其进行清理来轻松击败。换句话说，在用户在 Web 界面上输入的字符串作为变量插入 SQL 语句之前，应该由一个子程序检查该字符串是否有可疑内容。此程序也可以用于其他类型的注入攻击，包括跨站脚本攻击（XSS）和跨站请求伪造（CSRF）。


    ## 伦理黑客


    必须明确，黑客并不是小偷、恐怖分子、破坏者和顽皮青年的专属领域。学习和实践黑客对于理解如何防御有意伤害的黑客至关重要。虽然黑客通常并不昂贵，但黑客所需的知识和技能并非容易获得，需要自律和投入才能掌握。这使得黑客社区——至少对于成功的黑客来说——是一个相当排外的群体。它也让有才华的黑客比普通人具有优势，而那些怀有恶意的人很容易利用这种优势。


    个人的伦理和道德准往往会渗透到他们从事的任何活动中。然而，某些明智人士可以轻易针对他们缺乏知识的同伴执行黑客攻击，这可能给本守法的公民带来难以抗拒的诱惑。某些攻击发布时具有的潜在匿名性进一步增加了这种诱惑。


    此外，很容易说服自己认为攻击的最终目标证明了任何破坏手段的合理性。这在黑客或黑客团体为政治或社会目的服务的情况下尤为如此。每个个人都应该决定自己的活动是否值得承担逮捕和罚罚的风险（包括监禁），并思考他们对自身安全和隐私的重视是否也延伸到了他们攻击的目标。


