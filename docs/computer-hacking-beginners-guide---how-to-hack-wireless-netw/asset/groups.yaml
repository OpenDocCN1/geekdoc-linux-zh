    have their own language that is used within the code of other programming languages
    when accessing the data. If a web application, for example, needs to access or
    change the profile information of one of its users, it will need to send a command
    to the database that is written in that database’s appropriate language. These
    commands are known as queries. One of the most common database languages used
    for online applications is the Structured Query Language, or SQL. Exploiting vulnerabilities
    in SQL has over the years, one of the most common methods that hackers have used
    to access websites and the data contained within them.


    As programmers have become wise to the vulnerabilities in SQL, they have made
