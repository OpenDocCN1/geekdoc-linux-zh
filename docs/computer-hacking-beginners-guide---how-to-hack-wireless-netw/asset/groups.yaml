    ## Exploits


    Finding and exploiting vulnerabilities to gain access to systems is both an art
    and a science. Because of the dynamic nature of information security, there is
    a constant game of “cat and mouse” going on between hackers and security professionals,
    and even between nation-state adversaries. In order to stay ahead (or at least
    not let too far behind), one must not stay apprised of the latest technology and
    vulnerabilities, but must also be able to anticipate how hackers and security
    personnel will react to changes in the overall landscape.


    ## Access


    The common goal of exploitation is to gain access to, and some level of control
    of, a target system. Since many systems have multiple levels of access for the
    purposes of security, it is often the case that each level of access has its own
    slate of vulnerabilities and are typically more difficult to hack as a hacker
    is to reach the superuser or root (a UNIX term) level - known as “getting root”
    in hacker language. This highest level affords the user control of all systems,
    files, databases, and settings in a given self-contained system.


    It can be quite difficult to break the root of a secure computer system in a single
    exploit. More often, hackers will exploit easier vulnerabilities or take advantage
    of less experienced users to first gain level access. From that point, further
    methods can be employed to reach higher levels from administrators up root. With
    root access, a hacker can view, download, and overwrite information at will, and
    in some cases remove traces that they were even in the system. For this reason,
    getting root in a target system is a point of pride as the utmost achievement
    among black hat and white hat hackers.


    ## Denying Access


    In many cases, gaining access to a particular target system is impossible, exceedingly
    difficult, or not even desired by a hacker. At times, the goal of a hacker is
    simply to prevent legitimate users from accessing a website or network. This type
    of activity is known as denial-of-service (DoS). Since it is relatively simple
    to execute, it is often a beginner exercise for an inexperienced hacker (“newbie”,
    “scriptie”, or “novophyte”) in the parlance to earn some bragging rights. More
    experienced hackers can execute sustained DoS attacks that disrupt commercial
    or government servers for an extended period of time. Thus, organized groups of
    hackers often hold a website “hostage” and demand a ransom from the owners in
    exchange for halting the attack, all without ever having to gain access.


    ## Chapter 3. Getting Started


    Hackers have a reputation for being highly intelligent individuals and prodigious
    in many ways. It can therefore seem to be an overwhelming and uphill task to start
    from scratch and reach any level of practical proficiency. One must remember that
    everyone must start somewhere when learning a subject or skill. With dedication
