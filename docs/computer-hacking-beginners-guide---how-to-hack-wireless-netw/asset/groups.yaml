    ## Chapter 1. What is Hacking?


    It is important to lay the groundwork for a proper introduction to computer hacking
    by first discussing some commonly used terms and to clear any ambiguities with
    regard to their meanings. Computer professionals and serious hobbyists tend to
    use a lot of jargon that has evolved over the years in what had traditionally
    a very closed and exclusive clique. It isn''t always clear what certain terms
    mean without an understanding of the context in which they developed. Although
    by no means a complete lexicon, this chapter introduces some of the basic language
    used among hackers and computer security professionals. Other terms will appear
    in later chapters within the appropriate topics. None of these definitions are
    in any way “official”, but rather an understanding of their common usage.


    This chapter also attempts to clarify what hacking is as an activity, what it
    is, and what hackers are. Depictions and discussions of hacking in popular culture
    can tend to paint an overly simplistic picture of hackers of hacking as a whole.
    Indeed, an accurate understanding is lost in the translation of buzzwords and
    popular misconceptions.


    ## Hacking & Hackers


    The word hacking normally conjures images of a lone cyber-criminal, hunched over
    a computer and transferring money at will from an unsuspecting bank, or downloading
    sensitive documents with ease from a government database. In modern English, the
    term hacking can take on several different meanings depending on the context.
    As a matter of general use, the word typically refers to the act of exploiting
    computer security vulnerabilities to gain unauthorized access to a system. However,
    with the emergence of cybersecurity as a major industry, computer hacking is no
    longer exclusively a criminal activity and is often performed by certified professionals
    who have been specifically requested to assess a computer system''s vulnerabilities
    (see the next section on "white hat", "black hat", and "gray hat" hacking) by
    testing various methods of penetration. Furthermore, hacking for the purposes
    of national security has also become sanctioned (whether acknowledged or not)
    activity by many nation-states. Therefore, a broader understanding of the term
    should acknowledge that hacking is often authorized, even if the intruder in question
    is subverting the normal process of accessing the system.


    Even broader use of the word hacking involves the modification, unconventional
    use, or subversive access of any object, process, or piece of technology - not
