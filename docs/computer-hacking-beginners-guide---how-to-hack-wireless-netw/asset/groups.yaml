    # 第 6 章 恶意活动与代码


    拉丁语根词“mal”简单来说的意思是“坏”。因此，恶意活动的特征是具有伤害的意图。在黑客攻击中，这种伤害可能表现为盗取金钱、财产或声誉。它也可能仅仅是为了破坏而破坏，或者为了某些其他目的。由于现在许多关键系统已经数字化、互联化并在线化，黑客有能力造成小规模或大规模的破坏。


    # 拒绝服务攻击


    当我们在街上看到某人（无论是朋友还是陌生人）并希望与他们交谈时，我们通常不会直接走过去并开始谈论脑海中出现的任何话题。人类交流的通用协议是先执行某种问候。人们可能会说“你好”（或其变体）并说出对方的名字，也许还会快速握手——然后当对方回应时，对话就开始了。在发起电话通话时，也期望同样的程序顺序，在这种情况下，它具有更实际的意义，因为对话的双方通常都想确定自己正在和谁说话。对话中的开头几个字用于确认双方的身份。这种协议也用于计算机网络通信。网络中的一个节点不会简单地胡乱发送请求、命令或数据，而是尝试首先确认其正试图通信的节点是否存在以及是否就绪。


    在正常的网络对话中（通常通过 TCP 协议），预计会发生三次握手。在这次握手期间，首先由对话的发起者向接收者发送一个同步（SYN）包。该数据包包含了发送者的
    IP 地址，且包中的一个标志位指示接收者这确实是一个 SYN 包。如果 SYN 包成功送达，接收方已准备好通信，它将向发送者回传一个确认（ACK）包，该包包含自己的
    IP 地址以及一个指示其为 ACK 包的标志位。最后，原始发送者将向接收者发送一个 ACK 包，随后正常通信即可开始。有时，由于各种原因，数据包在网络节点之间的传输过程中会丢失。这可能是因为高流量、网络硬件故障、电或电磁干扰以及其他原因造成的。因此，如果发送者在规定时间内没有从预期的接收者处收到
    ACK 包，它将发送另一个同步请求。同样，接收者将无限期传输 ACK 包，直到收到来自原始发送者的确认。一个没有因丢包导致中断的正常握手总结如下：


    - 1) 发送者：SYN → 接收者

    - 2) 接收者：ACK → 发送者

    - 3) 发送者：ACK → 接收者

    - 4) 发送者 → 接收者


    任何网络节点只能与有限数量的其他节点通信。当黑客能够通过反复传输 SYN 和 ACK 包来破坏握手过程时，合法通信可能会被大幅降低甚至完全停止。这种攻击被称为拒绝服务（DoS）攻击。


    # 基础 DoS


    拒绝服务攻击背后的本质是伪造 IP 数据包头中的标志位，以引导服务器发送重复的 ACK 请求。简单的方法是破坏上述步骤二和三之间的传统握手过程。当接收者向原始发送者回传
    ACK 请求时，它期望收到另一个 ACK 包作为回复，以便开始通信。然而，如果发送者用另一个 SYN 请求作为响应，接收方将被迫响应另一个 ACK 包。如果这种往复持续下去，就会占用服务器机器上的网络资源和端口。这种情况类似于一个永不结束的“敲门””笑话……（“敲门”、“是谁在吗？”敲门”、“是谁在吗？”等）。这种
    DoS 攻击被称为 SYN 泛洪。执行 DoS 攻击有多种方法，其中大多数利用了 TCP/IP 协议本身的漏洞。


    # 分布式 DoS


    分布式拒绝服务（DDoS）攻击是指一个黑客或一组黑客能够从大量机器执行协调的 DoS 攻击。传输攻击包的机器共同工作，简单地压垮目标系统，导致合法用户无法访问服务器，或者对用户请求的响应缓慢到几乎无法使用。在大多数情况下，传输攻击相关数据包的机器并不由执行攻击的黑客所有。当黑客准备进行大规模
    DDoS 攻击时，他们会在尽可能多属于不知情攻击参与者的用户的机器上植入恶意代码。通常，这些机器分布在广大的地理区域和多个网络中，有时遍布全球，使得当局或受害系统的安全人员难以切断攻击。


    # 恶意软件


    “Malware”（恶意软件）一词是描述“malicious software”的合成词。该术语涵盖了黑客可能植入目标机器的各种软件，用以造成损害或获取对目标全部或部分的控制。恶意软件是整个互联网范围内普遍且严重的问题。恶意软件在主机上激活后有无数种行为方式。有些设计用于扩散到其他机器，并隐蔽地留在主机上，以为黑客收集机密信息、占用计算机资源或对系统造成破坏。有时，恶意软件被放置在机器上，是为了日后控制该机器以参与攻击（例如
    DDoS），并与其他被接管的机器协同工作。


    # 病毒


    病毒是最古老且最为人知的恶意软件类型。就像它们生物学上的名称一样，病毒被设计为从机器传播到机器，在过程中感染大量用户，有时甚至是整个自包含的网络。这些恶意设备是代码段，它们将自己（就像生物病毒一样）附着在其他具有用途的程序上。当用户激活这些程序时，病毒代码就会执行且不会被察觉。当病毒被激活时，它会创建自己的副本并尝试附着在它可以访问的系统或域内的其他程序上。这允许病毒在单个节点以及网络其他节点之间传播。然而，黑客编写病毒通常不是为了让自己传播。通常，黑客希望病毒在到达目标时完成某个特定的任务。


    由于病毒被设计为保持隐藏，它可以在主机上执行任何操作。它可以收集个人和财务信息，并隐蔽地利用计算机自身的通信将信息回传给黑客。其他病毒被设计用于删除信息或干扰计算机的运行或通信。病毒甚至可以被编写为对计算机系统造成物理损坏。例如，20世纪代广泛流行的一种特定病毒被设计为导致主机光驱硬盘上的电机驱动执行臂快速往复移动，直到电机故障。这种病毒会对具有网络连接的计算机控制机械造成巨大的破坏。


    '
