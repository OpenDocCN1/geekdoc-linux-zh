    # Chapter 19. Hide Keylogger console window


    Basically, we have incorporated a lot in our Keylogger and we can say that we
    are done however, there are still two important things left for us to do before
    we say we have completed our Keylogger. The first is: creating a release version
    of the Keylogger so it can be installed on a CD or sent as a file and the second:
    hiding the file. We will also see one problem the Keylogger has which we cannot
    see while running it from within the eclipse environment.


    Here are the steps to creating a release version of our Keylogger:


    +   Being that the program is well written within the editor, go to the “Hammer”
    in the upper left corner of eclipse environment. From the drop down menu that
    appears, select “debug” and then “release.”'
