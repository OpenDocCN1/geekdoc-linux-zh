    ## Web 漏洞


    有很多种 Web 漏洞和相关的攻击手段——随着旧漏洞的修复，新的漏洞也随之涌现。几十种语言以各种组合组合在一起创建一个网站或 Web 应用程序，漏洞可能存在于该结构的任何地方。这里列出了一些常见攻击的示例，说明了黑客如何利用漏洞为自己牟利。


    ## SQL 注入


    SQL 查询数据库语言在广域网上无处不在。它最经常被用于其他 Web 代码中，以管理用户登录和数据库访问请求。由于数据库查询不可避免地包含源自用户输入的字符串，因此自然容易受到操纵。SQL
    注入是一种利用 SQL 语言语法本身的 Web 攻击手段。SQL 使用 AND 和 OR 等布尔逻辑操作来连接语句段，包括由用户输入的字符串。一个典型的用户登录
    SQL 语句可能如下所示：


    ```

    SELECT * FROM database WHERE user = '' '' + username + '' ''

    ```


    上述语句将用户输入的对应 `user` 字段的字符串插入语句中的 `username` 变量中。该语句预期用户输入一个简单的、典型的用户名字符串。与黑客寻求利用的大多数漏洞一样，对用户输入字段的非预期使用可能导致意外之外的行为。聪明的黑客学会了利用
    SQL 语法，通过在用户字段中输入特殊字符串导致执行某些所需的 SQL 命令，从而获取用户账户权限。例如，以下字符串在作为用户名输入时，可能看起来是乱码或无趣的内容：


    ```

    '' OR ''1''=''1

    ```


    然而，如果 SQL 解释器字面地处理生成的命令，它将读取为：


    ```

    SELECT * FROM database WHERE user = '''' OR 1=1;

    ```


    当此命令执行时，它将被解释为（用大白话来说）：


    “从数据库中选择所有用户名为 '''' 或 1=1 的记录”


    可能没有任何用户名是空字符串，但 `OR` 关键字的存在意味着，只要 `OR` 两侧的子句（user = '''' OR 1=1）中任何一个为真，命令就会执行。由于
    `1=1` 始终为真，命令必须执行。任何为真的语句都可以放在 `OR` 之后，但 `1=1` 是一个高效的选择。通过用户字符串插入命令段，正是这种程序之所以被称为“注入”的原因。这是一个简单的例子，现在大多数网站都有基础攻击防护等措施，但注入攻击（SQL
    之外的其他脚本也可能受到注入攻击）仍然是一个常见的威胁，并作为利用软件漏洞的说明性示例。许多网站允许黑客针对具有已知 SQL 漏洞的模拟站点练习注入攻击。


    ## URL 操纵


    网站的网络地址，或通用资源定位符（URL），不仅包含网站资源文件的网络位置信息，通常还包含在某种用户交互后传递给 Web 应用程序的其他信息。这些信息可能是编码的，或者遵循某种语义方案。作为一个简单的例子，考虑一个具有以下
    URL 的虚构搜索引擎：


    http://www.acmesearch.com/


    当用户在表单中输入搜索词并点击提交按钮时，网站可能会根据某种格式自动在 URL 末尾附加搜索词。这是通过 Web 脚本和数据库查询传递信息以满足用户请求的一种方法。因此，如果这个假设搜索引擎的用户正在搜索“beginner
    hacking（入门破解）”，网站可能会提交以下 URL（或类似的内容）：


    http://www.acmesearch.com/search?=beginner+hacking


    如果用户注意到了这种模式，他们很容易发现可以绕过用户界面的 Web 表单，直接将搜索词输入到观察到的 URL方案中。这种 URL 操纵在用于搜索引擎等服务时显然是相当无害的。然而，在
    Web 商的早期，这些简单的语义实际上被用于提交产品订单。不久后，黑客就学会了如何操纵支付金额以及他们订购的产品类型和数量。尽管大多数在线商家现在已经有了更安全的流程，但仍有许多类型的网站和服务存在可以通过
    URL 操纵利用的漏洞。


    ## 跨站脚本与请求伪造


    某些网站允许用户互动，使得用户的输入成为网站内容的一部分。这些网站最好的例子之一是允许用户评论（针对照片、文章等）的网站。这些评论通常由用户通过 Web 表单或类似的接口提交。如果攻击者能够输入评论以外的内容——无论是通过
    URL 操纵还是直接向表单字段输入——它就可能成为其他用户访问的网站代码的一部分。黑客已经学会了如何利用不防御此类攻击的服务器，通过这些表单字段向网站注入恶意代码。注入的代码可以被写成，使得其他用户不知道自己的浏览器正在运行注入的代码。这种活动被称为跨站脚本（XSS），黑客可以利用它在用户机器上植入恶意代码，或劫持用户身份以登录目标机器。


    当用户登录一个安全网站时，该网站授予其访问服务器上资源的权限。通常，这种访问仅授予该特定用户单个登录会话。一旦用户注销或关闭网站，他们必须重新登录并开启新会话才能访问。会话信息通过
    Cookie 存储用户系统中，Cookie 是包含特定会话状态有用信息的小文件。会话 Cookie（或身份 Cookie）让服务器知道用户当前处于登录状态。如果黑客能够拦截一个不安全的会话
    Cookie，他们可以在自己的机器上复制它，并在用户处于会话期间用来访问目标系统。例如，如果用户登录了银行账户，服务器放置在计算机上的会话 Cookie 知道继续允许用户访问账户。如果黑客能够在自己的机器上获取那个特定的会话
    Cookie，他们就可以欺骗服务器允许他们访问账户。黑客通过建立他们认为许多用户想要访问的虚假网站来实现这一点。由于用户经常同时打开多个标签页或浏览器窗口使用
