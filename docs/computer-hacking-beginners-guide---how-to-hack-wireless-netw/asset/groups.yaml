    \ 201 | 233 |\n| 10 | LF (Line Feed) | 42 | 74 | J | 106 | 138 | 170 | 202 | 234\
    \ |\n| 11 | VT (Vertical Tab) | 43 | 75 | K | 107 | 139 | 171 | 203 | 235 |\n\
    | 12 | FF (Form Feed) | 44 | 76 | L | 108 | 140 | 172 | 204 | 236 |\n| 13 | CR\
    \ (Carriage Return) | 45 | 77 | M | 109 | 141 | 173 | 205 | 237 |\n| 14 | SO (Shift\
    \ Out) | 46 | 78 | N | 110 | 142 | 174 | 206 | 238 |\n| 15 | SI (Shift In) | 47\
    \ | 79 | O | 111 | 143 | 175 | 207 | 239 |\n| 16 | DC1 (Device Control 1) | 48\
    \ | 80 | P | 112 | 144 | 176 | 208 | 240 |\n| 17 | DC2 (Device Control 2) | 49\
    \ | 81 | Q | 113 | 145 | 177 | 209 | 241 |\n| 18 | DC3 (Device Control 3) | 50\
    \ | 82 | R | 114 | 146 | 178 | 210 | 242 |\n| 19 | DC4 (Device Control 4) | 51\
    \ | 83 | S | 115 | 147 | 179 | 211 | 243 |\n| 20 | DC5 (Device Control 5) | 52\
    \ | 84 | T | 116 | 148 | 180 | 212 | 244 |\n| 21 | NAK (Negative Acknowledge)\
    \ | 53 | 85 | U | 117 | 149 | 181 | 213 | 245 |\n| 22 | ETB (End of Block) | 54\
    \ | 86 | V | 118 | 150 | 182 | 214 | 246 |\n| 23 | ET (End of Transmission) |\
    \ 55 | 87 | W | 119 | 151 | 183 | 215 | 247 |\n| 24 | FS (File Separator) | 56\
    \ | 88 | X | 120 | 152 | 184 | 216 | 248 |\n| 25 | EM (End of Medium) | 57 | 89\
    \ | Y | 121 | 153 | 185 | 217 | 249 |\n| 26 | SUB (Substitute) | 58 | 90 | Z |\
    \ 122 | 154 | 186 | 218 | 250 |\n| 27 | ESC (Escape) | 59 | 91 | [ | 123 | 155\
    \ | 187 | 219 | 251 |\n| 28 | FS (File Separator) | 60 | 92 | ] | 124 | 156 |\
    \ 188 | 220 | 252 |\n| 29 | GS (Group Separator) | 61 | 93 | ~ | 125 | 157 | 189\
    \ | 221 | 253 |\n| 30 | US (Unit Separator) | 62 | 94 | | | 126 | 158 | 190 |\
    \ 222 | 254 |\n\nEach number represents a number of characters. The header file\
    \ that we enable in our Keylogger, Line 14 contains characters within 8 and 222\
    \ from the ASCII table. The statement on 16 is a statement new to us, however\
    \ it's nothing complex. It is called a system interrupt function. What it does\
    \ is observe if a user types something on his keyboard. If so, the keys in our\
    \ variable c and then based on Line 18 and 19, send it to our file.\n\nOn the\
    \ same Line (18), in parenthesis, the ios::app specifies that we don't want it\
    \ to be re-written every time presses a key. If we don't specify this, the file\
    \ will open again and whatever was previously written will be overwritten by the\
    \ new content.\n\nIt seems like we are done with our primitive Keylogger and are\
