    ## Web Exploits


    There are many kinds of web vulnerabilities and associated exploits - and new
    ones arise as quickly as old ones are closed. There are dozens of languages that
    are pieced together in various combinations to create a website or web application
    and vulnerabilities can exist anywhere within the structure. Listed here are a
    few examples of common exploits that illustrate how hackers use vulnerabilities
    to their advantage.


    ## SQL Injection


    The SQL query database language is widely ubiquitous on the World Wide Web. It
    is most used often within other web code to manage user logins and database access
    requests. Since a database query inevitably contains strings which originate from
    user input, it is naturally vulnerable to manipulation. SQL injection is a web
    exploit that takes advantage of the syntax of the SQL language itself. SQL uses
    Boolean logic operations like AND and OR to connect statement segments, including
    strings that were input by the user. A typical SQL statement for a user login
    might look similar to the following:


    ```

    SELECT * FROM database WHERE user = '' '' + username + '' ''

    ```


    The above statement will insert the user-inputted string corresponding to the
    user field into the "username" variable in the statement. This statement is expecting
    the user to input a simple, typical user name string. Like most vulnerabilities
    that hackers seek to exploit, unintended usage of the user input field can result
    in unanticipated behavior. Clever hackers learned to exploit SQL syntax to gain
    access to user accounts by entering special strings into user fields that cause
    certain desired SQL commands to be executed. For example, the following string
    might appear to be gibberish or otherwise uninteresting when entered as a username:


    ```

    '' OR ''1''=''1

    ```


    However, if the SQL interpreter takes the resulting command literally, it will
    read:


    ```

    SELECT * FROM database WHERE user = '''' OR 1=1;

    ```


    When this command is executed, it will be read as (to paraphrase in plain English):


    “select all records from database where the user is '' '' OR 1=1”


    There will likely not be any usernames that are a blank string, but the presence
    of the ‘OR’ keyword means that the command will execute if either clause on each
    side of the OR (user = '''' OR 1=1) is true. Since 1=1 is always true, the command
    must execute. Any statement that true can be placed after the OR, but 1=1 is an
    efficient option. The insertion of a command segment through the user string is
    why this procedure is called “injection”. This is a simple example, and most sites
    now have safeguards such as a basic attack, but injection (other scripts besides
    SQL can be vulnerable to injection) attacks continue to be a common threat and
    serve as an illustrative example of exploiting a software vulnerability. There
    are multiple websites that allow hackers to practice injection attacks against
    mock sites with known SQL vulnerabilities.


    ## URL Manipulation


    The web address, or Universal Resource Locator (URL), of a website not only contains
    information about the network location of a site’s resource files, but often contains
    other information that is passed to the web application after some sort of user
    interaction. This information might be encoded, or follow some sort of semantic
    scheme. As a simple example, consider a fictional search engine with the following
    URL:


    http://www.acmesearch.com/


    When a user enters a search term into the form and clicks the submit button, the
    site may automatically append the url with the search terms according to some
    format. This is a way to pass information along web scripts and database queries
    in order to fulfill the request of the user. So if the user of this hypothetical
    search engine is searching for “beginner hacking”, the site may submit the following
    URL (or something similar):


    http://www.acmesearch.com/search?=beginner+hacking


    If a user notices the pattern, they can easily figure out that they can circumvent
    the web form for user interface and simply type their search terms into the URL
    scheme that they observed. This sort of URL manipulation is, of course, fairly
    innocuous when used on services like search engines. However, in the early days
    of web commerce, these sorts of simple semantics were actually used to submit
    product orders. It wasn''t long before hackers figured out how to manipulate the
    payment amount as well as the type and number of products that they were ordering.
    Although most online merchants now have a more secure process, there are still
    many types of websites and services that have vulnerabilities which can be exploited
    through URL manipulation.


    ## Cross-Site Scripting and Request Forgery


    Some websites allow users to interact with the site in such a way that the user''s
    input becomes part of the website content. One of the best examples of these websites
    that feature comments (on photos, articles, etc.) from users. Those comments are
    normally submitted by users through the use of a web form or similar interface.
    If an attacker is able to enter something other than a comment - either by URL
    manipulation or direct input into the form fields - it could become part of the
    website code that is accessed by other users. Hackers have learned how to inject
    malicious code into websites through these form fields by exploiting servers that
    do not safeguard against this type of attack. The injected code can be written
    in such a way that other users don''t know their browser is running the injected
    code. This activity has become known as cross-site scripting (XSS), and can be
    used by hackers to implant malicious code onto user machines or to co-opt user
    identities in order to log to a target machine.


    When a user logs in to a secure website, that website grants access to resources
    on its server. Typically, this access is only granted to that particular user
    for single login session. Once the user logs out or closes the website, they will
    have to log again and begin a new session for access. Session information is stored
    on the user’s system through the use of cookies, which are small files containing
    useful information about the state of a particular session. Session cookies, or
    authentication cookies, let the server know that a user is currently logged in.
    If a hacker is able to intercept an insecure session cookie, they can duplicate
    it on their own machine and use it to gain access to a target system while the
    user is in their current session. For example, if a user is logged into their
    banking account, a session cookie placed on their computer by the bank server
    know that it is okay to continue allowing the user access to the account. If a
    hacker is able to obtain that particular session cookie on their own machine,
    then they can fool the bank server into allowing them access to account. Hacker
    achieve this by setting up a fake website that they believe many users will want
    to visit. Since users often use the web with multiple tabs or browser windows
    open simultaneously, the hacker is hoping that users will be logged in some secure
    account while also logged in to their malicious website. When users are interacting
    with the hacker website, they are unknowingly executing scripts through their
    own browser that send commands to the secure website. Since the secure site (for
    instance, the bank) is allowing access during that session it has no way of knowing
    that the request is legitimate. This attack is known as cross-site request forgery
    (CSRF). A common way to execute a CSRF attack is to inject a false server request
    into something relatively innocent such as a link to an image or some other website
    element. This keeps the code hidden from the view of the user.


    In the cases illustrated above, for SQL injection, URL manipulation, cross-site
    scripting, and cross-site request forgery, the vulnerabilities which are being
    exploited fairly easily by checking user input for suspicious content before executing
    it. Website programmers may have caught on many of these attack methods, and are
    trying to make their sites less vulnerable while at the same time providing access
    and services to users. This is why it is so important to understand the nature
    of hacking and the different types of attacks.

