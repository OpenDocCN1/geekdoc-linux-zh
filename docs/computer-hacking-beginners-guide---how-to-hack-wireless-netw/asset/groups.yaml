    for the development of native MS-Windows applications, and which is available
    on many operating systems, including Windows, Linux and OS X. It includes the
    C C++ library. Additionally, threaded applications made with it run using native
    Windows threads.


    MinGW provides provide access to the functionality of the Microsoft runtime and
    wine binary specification. MinGW, being a native Windows compiler environment,
    allows you to develop native Windows applications and POSIX applications on MS-Windows.
    You can also run POSIX applications on this platform, using Cygwin instead.


