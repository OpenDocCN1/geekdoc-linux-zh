    recognize the state of the shift key and if the shift key is pressed and the value,
    which follows after, is the ASCII value of the number 1 on the keyboard, please
    don’t record 1, “exclamation mark” instead.


    Let’s go about solving this problem. Utilizing the if statement solely not the
