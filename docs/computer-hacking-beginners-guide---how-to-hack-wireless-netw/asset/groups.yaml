    - 1. monitor and view all Wi-Fi traffic in the range of the adapter while "monitor
    mode" (set by a program called airmon-ng) using a program called airodump-ng),


    ![](img/eb3517bc8b212720f2254aa5b46526b4_43_0.png)


    # Live W-Fi Traffic on Several Routers (aircrack-ng.org)


    - 2. choose a target Wi-Fi network that is using WEP encryption and make a note
    of the name (ESSID) and network address (BSSID in the form XX:XX:XX:XX:XX:XX)


    - 3. restart airodump-ng to begin capturing network traffic from the specific
    network that you are targeting


    - 4. wait for a sufficient number of packets to be captured (this may take longer
    on networks with less traffic)


    - 5. use a program called aircrack-ng to piece together the captured network packets
    into a coherent password


    ![](img/eb3517bc8b212720f2254aa5b46526b4_44_0.png)


    A Successfully Decrypted Wi-Fi Key (aircrack-ng.org)


    If network traffic is too slow to capture a sufficient number of packets for decrypting
    the password in a reasonable period of time, some choose to use a program called
    aireplay-ng to inject artificial packets into the network and create the necessary
    traffic to crack it more quickly. However, this activity requires the hacker''s
    machine to actually broadcast signals from its Wi-Fi adapter, making it more conspicuous.


    WPA encryption cannot be cracked passively and requires the additional step of
    packet injection. Cracking WPA can take longer and is a more invasive procedure,
    but it is not much more difficult than cracking WEP. A program called reaver,
    normally available on the Kali distribution is typically used by hackers to crack
    WPA. WPA-2 hacking is a much more advanced concept for more experienced practitioners.
    (Note: the software tools above are pre-installed on Kali Linux, or can be downloaded
    from www.aircrack-ng.org)


    ## Chapter 8. Your First Hack


    The neophyte hacker shouldn''t even think about attempting an attack on a real
    target as their first foray into hacking. Sufficient tools and technologies exist
    which are easily obtained and with which various methods can be rehearsed in a
    virtual environment. This type of practice is essential for the hacker and is
    more valuable than all of the reading and study one could accomplish. To build
    confidence and gain appreciation for the nuances and practical pitfalls, the beginning
    hacker should aspire to accomplish the simple attacks suggested in this chapter.
    The details of the attacks will vary and currently applicable instructions should
    be researched by the reader, but the general principles of the setup and execution
    should be fairly universal.


    ## Hacking Your Own Wi-Fi


    The purpose of this practice attack is to successfully obtain the password of
    a WEP-encrypted Wi-Fi network. To minimize risk, the network and any connected
    devices should be owned or controlled by you, or by someone who has given you
    explicit permission to perform penetration testing.


    What you need:


    - 1) A computer

    - 2) A wireless network adapter that supports “monitor mode”

    - 3) Access to a Wi-Fi router with WEP encryption (does not have to have internet
    access)

    - 4) The latest version of Kali Linux (installed as the primary OS or in a virtual
    machine)


    Setting up:


    - 1) Ensure that the router is set to WEP and a password of your choice

    - 2) Turn off the internal Wi-Fi adapter on your laptop if you have one

    - 3) Connect the “monitor mode” adapter to your attack machine install all necessary
    drivers

    - 4) Be sure the attack computer is in wireless range of the target network


    Procedure:


    - 1) Follow the “Wi-Fi Hacking” steps from Chapter 7

    - 2) Confirm that the cracked password matches the one you set for the network

    - 3) Repeat the hack using airplay-ng for packet injection and compare execution
    times

    - 4) Change the length or complexity of the password and repeat the hack, comparing
    execution times


    ## A Virtual Windows Vulnerability Assessment


    Operating systems contain multiple software vulnerabilities that hackers are ready
    and willing to exploit. When a hacker discovers an un-patched version of an OS,
    there are a number of commonly available exploits with ich to gain access. The
    first step in deploying those exploits is to analyze the OS for the most glaring
    vulnerabilities. Kali Linux features natively installed tools that will scan a
    system and provide a list of vulnerabilities. This exercise will require two virtual
    machines running within the same system (regardless of the host OS). It will also
    require an installation image for an older, unsupported, and un-patched version
    of Microsoft Windows (Windows ’95 or ’98 are good choices). These images can be
    obtained online (uscgb.nist.gov) or from an old CD.


    What you need:


    - 1) A computer with any OS

    - 2) Virtualization software

    - 3) The latest version of Kali Linux

    - 4) An unsupported, un-patched version of Microsoft Windows


    Setting up:


    - 1) Install Kali Linux on a virtual machine

    - 2) Install the target Windows distribution on a virtual machine (on the same
    host system as Kali)


    Procedure:


    - 1) Execute a network scan from the Kali virtual machine using a program called
    nmap

    - 2) Practice changing various settings in nmap so that OS vulnerabilities will
    be detected and displayed

    - 3) Make note of the listed Windows vulnerabilities and begin researching exploits!


    ## Chapter 9. Defensive Security & Hacker Ethics


    Looking at the world through the eyes of the hacker can be a scary thing. When
    you realize how vulnerable your home network is, the first thing you want to do
    is change your Wi-Fi encryption. You look at emails more closely and with an edge
    of suspicion. Knowing what you know about scripting attacks, you start to be mindful
    not to leave many browser windows or tabs open simultaneously. Understanding the
    tools and motives of malicious hackers gives people a new appreciation for information
    and computer security. This knowledge should also give the beginning hacker pause
    to reflect on the reasons that they are choosing to learn hacking.


    ### Protecting Yourself


    From simple measures like choosing a password, to more advanced concepts like
    encryption, most aspects of day-day security involve common sense. It is helpful
    to get into a regular routine for periodic tasks like updating changing passwords,
    and downloading current virus definitions. In order to avoid becoming a victim
    of the attacks security should become a part of daily life.


    ### Password and Email Practices


    The days of using your dog’s name and the last four digits of your Social Security
    number as your email password are over. Using a properly configured password is
    one of the easiest ways for people to prevent simple brute force attacks. The
    first thing that password-guessing hackers and automated password cracking software
    do is common for names, words commonly found in a dictionary, and simple sequences
    of numbers. A surprising number of people continue to use these types of passwords
    because they are much easier to remember. It is important to note that the practice
    of replacing certain letters in common words with numbers or symbols that have
    appearance (for example: p@5w0rd instead of password), although it is more secure
    than using a common word in its original form, is no longer fooling hackers. Most
    hackers have caught onto this trick and are using scripts which will cycle through
    the replacement characters during a brute attack.


    It is not uncommon for a modern individual to have dozens of passwords for various
    machines, email accounts, and websites. It is frustrating to have to keep track
    of so many passwords, and to reset them when they are forgotten. However, the
    inconvenience of proper password practice is ultimately preferable to being victimized
    by a malicious hacker. Longer passwords with sufficient complexity and a mix of
    letters, numbers, and special characters at least extend the amount of time hackers
    have to spend attempting to crack a password. An extra layer of security, as frustrating
    as it may be, is not to use the same password for all of your accounts. If a hacker
    is somehow able to successfully crack one of your passwords, they will then have
    access to all of your other accounts if you are constantly recycling the same
    password.


    It is sometimes considered acceptable password security to write down passwords,
    as long as they are stored securely. However, individuals that write down passwords
    on sticky notes that are attached to their computer monitors are just asking for
    the next “shoulder surfing” hacker to make them regret that decision. In addition,
    the longer a password stays around, the more likely it is to be cracked, so it
    is recommended to change passwords occasion (no need to overdo it, in most cases
    few months or even every year is sufficient.)

