    ## Programming Languages


    It may seem daunting to learn a programming language from scratch having never
    done it before, but many people find that once they become proficient at one programming
    language, it is much easier and faster to learn others. Hackers not only have
    to understand programming languages to be able to exploit software vulnerabilities,
    but many hackers need to write their own code to be able to execute a particular
    attack. Reading, understanding, and writing code is fundamental to hacking.


    Programming languages range from very obscure machine code, which is in binary
    and hexadecimal format and is used to communicate directly with a processor, to
    high-level object-oriented languages that are used for software development. Common
    high-level object-oriented languages are C++ and Java. The code written in high-level
    languages is compiled into the appropriate machine code for a particular processor,
    which makes high-level languages very portable between different types of machines.
    Another category is a scripted language, where commands are executed line-by-line
    instead of being compiled into machine code.


    Learning programming languages takes time and practice - there is no other way
    to become proficient. Long evenings and overnight marathons of writing, debugging,
    and recompiling code are a common rite-of-passage among beginning hackers.


