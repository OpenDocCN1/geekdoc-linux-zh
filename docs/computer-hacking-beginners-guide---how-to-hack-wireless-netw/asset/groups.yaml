    WPA-2。由于其安全性比之前的标准有了显著提高，AES 加密已成为可用无线路由器的推荐设置。破解 WPA 和 WPA-2 需要比攻击受 WEP保护的网络更具侵入性的黑客技术。


    ## Wi-Fi 攻击


    黑客进行 Wi-Fi 攻击至少需要一台计算机（通常是笔记本电脑），其能够运行用于破解 Wi-Fi 密码的脚本。他们还必须获得一个相对便宜的特殊 Wi-Fi
    适配器。可以在黑客资源网站上找到合适的 Wi-Fi 适配器列表，但通常情况下适配器必须具有被称为“监听模式”的功能才能执行 Wi-Fi 攻击。需要注意的是，并不是在零售商店找到的所有
    Wi-Fi 适配器都具有此功能，而且大多数内部适配器并不适用。通常，黑客倾向于使用某些 Linux 发行版（通常是 Kali）来进行 Wi-Fi 攻击，大多数现可用工具都是为
    Linux 编写的并预装在 Kali 中。也可以通过某些配置在另一个操作系统的虚拟机中运行 Linux 来发起攻击。虽然从其他操作系统进行攻击是可能的，但对于初学者来说，从原生
    Linux 发行版或实施要容易得多。

