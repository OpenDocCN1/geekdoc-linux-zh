    # Object-Oriented Languages


    Object-oriented languages are high-level computer programming languages that are
    compiled upon completion into executable machine code. Programmers use some sort
    of text editing program to develop their code. They also need a compiler that
    is appropriate to the computer platform on which the executable program will be
    run. Some software development tools also contain debugging functions that allow
    the programmer to discover syntax and other errors before the program is compiled.
    Object-oriented languages


    are centered around the idea that different components in a computer program can
    be treated as objects with certain properties. The properties can be manipulated
    by procedures known as methods, and objects can be placed into various classes.
    Learning object-oriented programming is a vital part of the learning process for
    an aspiring hacker. A great deal of software, both online and off-line, is developed
    using object-oriented languages like C++ and Java. Understanding the vulnerabilities
    in programs that are written in these languages, and subsequently exploiting them,
    becomes possible when a hacker is familiar with the languages. In addition, hackers
    often find themselves needing to write their own software to automate attacks
    or to help gain control or transfer data once they have access to a system.


    # Interpreted Languages


    Object-oriented languages are highly structured and modularized. A single statement
    in the code of an object-oriented language cannot run on its own without the context
    of the rest of the program. This is why object-oriented languages must use a compiler
    to translate the program into machine code before it can be understood by the
    computer. Although this is useful for larger, more complex programs, it can be
    overkill and unnecessarily time-consuming for shorter programming tasks. An interpreted
    language, conversely, is executed (for the most part) on a line-by-line basis
    by the computer, allowing for quick corrections and more intuitive debugging.


    One of the most popular interpreted languages is Python. A free, open-'
