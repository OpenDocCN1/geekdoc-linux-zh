    ## MinGW


    Windows 下 MinGW 和 MSYS 项目的家园，一个用于原生 Microsoft Windows 应用程序的最小化开发环境。


    MinGW 提供了一个开源软件编程工具，适用于原生 MS-Windows 应用程序的开发，并可在 Windows、Linux 和 OS X 等许多操作系统运行。它包含了
    C C++ 库。此外，用它创建的多线程应用程序将使用原生 Windows 线程运行。


    MinGW 提供了对微软运行时和 wine 二进制规范的功能访问。MinGW 作为原生 Windows 编译器环境，允许你在 MS-Windows 上开发原生
    Windows 应用程序和 POSIX 应用程序。你也可以使用 Cygwin 在此平台上运行 POSIX 应用程序。


    主要针对在原生 MS-Windows 平台上工作的开发人员，但也适用于托管使用（见下文注释 - 正确配置可能很棘手）。


    - GNU 编译器集合 (GCC) 的一部分，包括 C、C++ 和 Fortran 编译器；

    - 包含 Windows 版 Binutils（汇编器、链接器、gdb）；

    - 包含部署在 MS-Windows 上的 MinGW 和 MSYS 的 GCC4 前端（make、grip 等其他）；

    - 一个首次运行设置脚本 (mingw-get)，让你能够开始使用 mingw-get 运行。


    MSYS 是一个类 POSIX 环境，是 MinGW-dll 的替代方案，它提供了一个通用的环境，特别适合配合 MinGW 使用于许多开源项目。它为 Windows
    平台提供了工具（Cygwin 的轻量级分支），并包含了一些为了方便操作而选择的小工具。


    点击右上角的下载按钮开始下载编译器。再次强调，编译器将是压缩格式，就像我们之前下载的 JDK 一样，通过将任何内容提取到你选择的位置来解压。最后，安装编译器。


    现在，有了变量路径、JDK 和编译器，我们可以舒服地启动 Eclipse 环境而不会出现任何错误消息，并放心地编写代码，确定它们会被计算机解释，我们将


