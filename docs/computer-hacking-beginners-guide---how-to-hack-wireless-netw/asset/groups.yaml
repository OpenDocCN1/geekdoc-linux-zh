    \ message. At a glance, what do you think might result in an error?\n\nThe header\
    \ file failed to attach the header that will enable program run/perform a function\
    \ that was specified within our code i.e. function to send received input to a\
    \ file. The header file for this (which lets us utilize the ofstream function)\
