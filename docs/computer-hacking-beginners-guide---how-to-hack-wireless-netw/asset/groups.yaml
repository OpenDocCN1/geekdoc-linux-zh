    在大多数情况下，黑客的目标是获取未经授权的系统访问权限。实现这一目标最好的方法是利用身份验证系统的漏洞。这些漏洞在大多数情况下要么存在授权用户的习惯中，要么存在目标服务器运行软件的代码中。黑客非常擅长快速发现并学习如何利用漏洞，而新漏洞似乎在旧漏洞被修复的同时同样迅速出现。特别是大型且复杂的系统，可能甚至存在多个尚未被发现的漏洞。优秀的安全专业人员学习如何像黑客一样思考，以便在黑黑客利用之前预判他们所保护的系统可能出现的问题。本章将阐述人类用户和软件中一些常见的传统漏洞的利用示例。


    ## 社会工程学


    人类用户往往是计算机安全“杀伤链”中最薄弱的环节。许多用户对他们正在使用的系统了解甚少，但他们也对网络威胁的本质缺乏足够的认识，并且没有花时间和精力去保护自己。尽管人们正开始意识到这一点，但周围仍然有足够的人类目标供黑客利用。社会工程学是指利用简单的侦察或欺骗直接从毫无防备的用户获取密码或访问权限的活动。社会工程学对技术专长的要求很少，黑客更喜欢涉及侵入性方法的更困难且风险更高的攻击。


    ## 被动获取密码


    最简单的社会工程学类型可能是猜测个人的登录密码。尽管有警告，用户仍继续使用包含常见或易猜字符序列的密码。这种做法之所以如此普遍，主要原因是人们倾向于想要他们容易记住的密码。大多数人在家庭和工作中都有好几个邮箱和用户账户，很难跟踪所有的账户，因此可能对多个账户使用相同（或相似）密码。当黑客成功获取密码时，这种做法使他们所有的账户陷入危险。常见的密码错误包括：使用自己的名字或家庭成员、宠物的名字、使用字典中常见的单词、使用与自己或亲人生日相对应的数字序列、包括居住地址的部分内容、使用喜爱的运动队名称以及其他容易记忆的主题。在现代社会，这种做法特别为糟糕的理由之一是，互联网上存在大量可以轻松获取的公开信息。只需看一眼个人的社交媒体页面，通常就能发现大量关于他们的宝贵信息。当某人允许其社交媒体简介公开可见时，它就成了黑客完善密码猜测的完美来源。用于猜测密码的个人数据也可以通过“翻找垃圾”（dumpster
    diving）的手段获得，即黑客在目标用户的垃圾中翻找含有敏感信息的纸质文件。密码安全已成为一个如此严重的问题，以至于越来越多需要密码的（注：此处原文可能漏词）的网站、在线账户、邮箱服务和其他系统已开始对密码的格式和内容实施严格限制。


    更具互动性的社会工程学涉及黑客进行的某种程度的监控或侦察。如果黑客可以物理接触目标系统的所在地，他们可能会尝试在用户输入登录信息时观察他们。这在口语中被称为“窥肩偷”（shoulder
    surfing），因为涉及从背后窥视用户的肩膀。


    ## 钓鱼、鱼叉式钓鱼与大捞鱼


    互联网的通用匿名性会让人们产生一种虚假的安全感，让他们参与一些在面对面时绝不会参与的行为。如果一个陌生人敲门，声称是其银行的代表并索要保险箱的钥匙，这个人很可能会被迅速关在门外。尽管如此，每天都有成千上万的人通过网络、电子邮件、电话和短信向欺诈黑客泄露他们的个人和登录信息。


