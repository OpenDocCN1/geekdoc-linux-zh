    their biological namesakes, viruses are designed to spread from machine to machine,
    infecting large number of users, and sometimes entire self-contained networks
    in the process. These malicious devices are segments of code that attach themselves
    (just like biological viruses) to other programs that have otherwise legitimate
    purposes. When the legitimate program is activated by an unsuspecting user, the
    virus code is executed and can run without ever being noticed. When a virus is
    activated it makes a copy of itself and attempts to attach itself to other legitimate
    programs within the system or domain to which it has access. This allows the virus
    to spread throughout an individual node and also to other nodes on the network.
    A virus is not usually written by a hacker to simply spread itself around, however.
    Typically, the hacker has a specific task in mind for the virus to complete when
    it reaches its destination.


