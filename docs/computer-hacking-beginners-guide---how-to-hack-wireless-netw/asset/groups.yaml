    ## Social Engineering


    Human users are often the weakest link in the "kill chain" of computer security.
    Many users have only little understanding of the systems they are using, but they
    also tend to have little appreciation for the nature of cyber threats, and have
    little desire to take the time and effort to protect themselves. Although people
    are starting to become aware, there are still enough human targets around for
    hackers to exploit. Social engineering is the activity of using simple reconnaissance
    or deception to obtain passwords or access directly from unsuspecting users. Social
    engineering requires little technical expertise and is preferred by hackers to
    the more difficult and risky attacks that entail intrusive methods.


    ## PASSIVE PASSWORD ACQUISITION


    Perhaps the simplest type of social engineering is that of guessing an individual’s
    login password. Despite warnings, users continue to use passwords that contain
    common or easily guessed sequences of characters. The main reason that this practice
    is so common is that people tend to desire passwords that they can easily recall.
    Most people have several email and user accounts for both home and work, making
    it difficult to keep track of them all, and thus may use the same - or a similar
    – password for multiple accounts. This practice puts all of their accounts in
    danger when hacker successfully obtains the password. Common password mistakes
    are using one''s own name or that of a family member or pet, using words commonly
    found in a dictionary, using sequences of numbers corresponding to their birthday
    or that of a loved one, including parts of their residential address, using names
    of favorite sport teams, and other themes that are easily remembered. One of the
    biggest reasons why this is an especially poor practice in the modern age is that
    there is so much information that is readily and publicly available on the internet.
    A simple glance at an individual''s social media page usually reveals a treasure
    of information about them. When someone allows their social media profile to be
    publicly viewed, it becomes a perfect source for hacker to refine their password
    guesses. Personal data useful for guessing passwords can also be obtained through
    the practice of dumpster diving, whereby a hacker rummages through a target user''s
    trash for paperwork containing sensitive information. Password security has become
    such a problem that more and more websites, online accounts, email services, and
    other systems require passwords are beginning to enact strict restrictions on
    the format and content of passwords.


    More interactive types of social engineering involve a certain degree of surveillance
    or reconnaissance on the part of the hacker. If a hacker has physical access to
    the location of their target system, they might attempt to view a user while they
    are actually typing their login information. This is colloquially known as shoulder
    surfing because it involves covertly peering over the shoulders of users.


