    thousands of people every day readily reveal their personal and login information
    to fraudulent hackers through the Web, email, phone, and text messaging.


    A common method that hackers use to obtain user information is the process of
    phishing. In the tradition of the quirky nomenclature of hacking jargon, phishing
    is a homonym of “fishing”, and gets its name from the idea that practice is similar
