    ```\n\n# Hiding the Keylogger\n\nOn Clicking on the Keylogger.exe (the execution\
    \ file), a black window, which saves the Keystrokes of the user, appears on the\
    \ home screen and it looks like it does in the figure below:\n\n![](img/eb3517bc8b212720f2254aa5b46526b4_143_0.png)\n\
