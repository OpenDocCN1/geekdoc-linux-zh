  mdcn: "\n现在，让我们来过一下实际的代码行，其中比较语句与一些条件语句一起使用。\n\n```cpp\nint main() {\n    int a,\
    \ b;\n    double c = 10.3, d = 60.234;\n\n    if (a == b && c != d) {\n      \
    \  cout << \"I will not sleep\";\n    }\n    else {\n        cout << \"I will\
    \ fight against sleep\";\n    }\n\n    return 0;\n}\n```\n\n你已经看到上面代码的逻辑了吗？\n\n\
    基本上，第 9 行表示，如果变量 `a` 中包含的值与 `b` 中的值相同，且 `c` 中的值不等于 `b`，则将显示“I will not sleep”语句。然而，如果这些条件中有任何一个为假（例如\
    \ `a` 不等于 `b` 或 `c` 等于 `d`），那么第 15 行的“I will fight against sleep”语句将被打印出来。\n\n\
    第 15 行编写的 `else` 是一个条件语句，就像在现实世界中一样，意味着如果第 9 行的条件求值为假，则跳过第 11 行的语句，并考虑后面的另一个条件。\n\
    \n如果用 `OR` 语句代替 `else` 语句，将意味着第 9 行的条件中只要有一个为真（要么 `a == b`，要么 `c != d`），第 11 行的语句就会被考虑，而第\
    \ 15 行则被忽略。\n\n通过学习不同程序的一系列代码将增强理解，从长远来看，会让你熟悉这些操作符、它们的各种功能以及如何使用它们。\n\n通过在我们之前分析的程序中添加一些新语句并逐逐步解释它们，我们对\
    \ C++ 编码的理解将大大提高。一旦实现这一点，制作键盘记录器（Keylogger）的过程对你来说将毫不费力。\n\n让我们分析下面的程序：\n\n| 行号\
    \ | 代码 |\n| :--- | :--- |\n| 7 | double c = 10.3, d = 60.234; |\n| 8 | |\n| 9\
    \ | cout << \"Enter value for a: \"; |\n| 10 | cin >> a; |\n| 11 | cout << \"\
    Enter value for b: \"; |\n| 12 | cin >> b; |\n| 13 | | |\n| 14 | if( a > b ) |\n\
    | 15 | { |\n| 16 | cout << \"A is greater than B\"; |\n| 17 | } |\n| 18 | else\
    \ if( a == b ) |\n| 19 | { |\n| 20 | cout << \"A is equal to B\"; |\n| 21 | }\
    \ |\n\n从第 1 行到第 7 行是熟悉的代码，因此已被省略。\n\n在第 9 行和第 11 行中使用了 `cout` 函数，并将打印语句“Enter\
    \ value for a: ”和“Enter value for b: ”（注意两个句子末尾、冒号与结束语句的引号之间的空格。请记住它的用途）。在第 10\
    \ 行和第 12 行中使用了 `cin` 函数，它需要计算机用户输入一个值。一旦程序要求用户输入了两个值，程序将根据第 14 行的条件语句进行求值，如果结果为真，程序将按照第\
    \ 16 行的指示打印“A is greater than B”。\n\n在第 18 行，条件语句 `else if` 是一种用在 `if` 和 `else`\
    \ 语句之间的条件语句。它用于添加几个其他条件，如果所有条件求值均为假，则将打印 `else` 语句下的行。正如在这个程序中使用那样，如果条件 `a > b`\
    \ 为假，则将打印 `else` 语句下的行——“A is less than B”；除非 `else if` 条件为真，此时将打印“A is equal\
    \ to B”。\n\n```cpp\nif( a > b ) {\n    cout << \"A is greater than B\";\n} else\
    \ if( a == b ) {\n    cout << \"A is equal to B\";\n} else {\n    cout << \"A\
    \ is less than B\";\n}\nreturn 0;\n```\n\nEnter value for a: 1\nEnter value for\
    \ b: 3\n\n# A is less than B\n\n从上面写的代码可以看出，用户为变量 `a` 输入了值 1，为变量 `b` 输入了值 3。这些值不满足第\
    \ 14 行的条件，也不满足第 18 行的条件，因此考虑了 `else` 语句。第 24 行的语句“A is less than B”被打印。\n\n# 循环（Loops）：\n\
    \nC++ 中的循环可以看作是一个圆形路径，条件语句在其中循环评估，直到满足所需的条件或提供了逃生路径。让我们分析一个使用循环的程序。有几种循环，如 `While`\
    \ 循环、`For` 循环。让我们从 `While` 循环开始。\n\n```cpp\n{\n    cout << \"Enter value for a\
    \ or enter -1 to exit: \";\n    cin >> a;\n    cout << \"Enter value for b or\
    \ enter -1 to exit: \";\n    cin >> b;\n}\n\nif( a > b) {\n    cout << \"A is\
    \ greater than B\";\n} else if( a == b ) {\n    cout << \"A is equal to B\";\n\
    } else if( a == -1 || b == -1) {\n    break;\n} else {\n    cout << \"A is less\
    \ than B\";\n}\n```\n\n（注：由于原始文本存在大量重复和碎片化的片段，以上翻译根据逻辑流进行了整合与修正。）\n"
