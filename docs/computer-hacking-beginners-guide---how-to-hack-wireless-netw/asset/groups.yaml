    Computers vary in size, shape, and purpose, but most have a unique design. For
    instance, the three largest manufacturers are Intel, American Micro Devices (AMD),
    and Motorola. Some processors are programmable by the end user. These are known
    as Field-Programmable Gate Arrays (FPGA) and are being used more and more.


    ## Networking and Protocols


    One of the most important subjects for the aspiring hacker to study is that of
    network architecture and protocols. Computers can be networked in many different
    configurations and sizes. From copper wire, to fiber optics, to wireless and satellite
    connections, as well as combinations of all these media, we have built a vast
    network across the globe. This network can be understood in its entirety on a
    large scale as well as viewed as a connection of smaller networks.


    In terms of size, computer networks have been traditionally categorized as Local
    Area Networks (LAN) and Wide Area Networks (WAN). WANs typically connect multiple
    LANs. There are multiple designations for different sizes of networks, and the
    terminology is always changing as new technologies develop.


