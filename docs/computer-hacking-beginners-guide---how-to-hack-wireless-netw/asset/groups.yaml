    secure walls, there was a contingent of Greek soldiers hiding inside the hollow
    belly of the horse. The soldiers emerged that night under the cover of darkness
    to open the gates for the rest of the Achaean army who entered and subsequently
    sacked the city. For thousands of years, whether true or not, this story has served
