    \ | 49 | 81 | Q | 113 | 145 | 177 | 209 | 241 |\n| 18 | DC3 (设备控制3) | 50 | 82\
    \ | R | 114 | 146 | 178 | 210 | 242 |\n| 19 | DC4 (设备控制4) | 51 | 83 | S | 115\
