    is important as in most cases, people tend to type in certain characters such
    as: asterisk signs, exclamation mark, symbol for a British pound etc. as passwords
    and these symbols in most cases are obtained by the combination of two or more
    cases. Filtering will enable our Keylogger recognize when such keys are pressed
    by a user.


