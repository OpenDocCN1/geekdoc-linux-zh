    ## Computer Software Security


    Computer security professionals occasionally disagree on the efficacy of antivirus
    software. Some argue that expensive software for virus and malware protection
    can be a waste of money because advanced hackers are adept at circumventing those
    protections. However, there are multiple free computer software suites available
    that will protect the computer systems of most home users against the majority
    of the most basic and prevalent nefarious, provided that the security software
    is kept up to date.


    In any event, most software provides its own security through patches and updates.
    This is why it is very important for users to either update their software and
    operating system, or to allow these programs to update themselves automatically.
    This is especially critical for patching vulnerabilities in operating systems
    and web browsers. Microsoft Windows, Java, and Adobe Flash are commonly targeted
    by hackers and should be constantly kept up to date.


    ## Network Security and Encryption


    A Wi-Fi router’s encryption protocol should be set to the highest level of encryption
    available to its particular hardware. It is also good practice to set your router
    to publicly broadcast the name of the network (although most hackers can easily
    get around this trick). Password security is especially important on Wi-Fi networks
    because a sufficiently lengthy and complex password can extend the amount of time
    it takes a hacker to crack your network password by a significant amount of time.
    In many cases, using WPA-2 encryption with a password of maximum length and sufficient
    complexity will make it so difficult and time-consuming for a hacker to crack
    into the network that they will simply move on to another, less secure target.


    ## Web Application Security


    Vulnerabilities in website applications, especially with in SQL and other scripted
    languages that are present within web code, are numerous. Programmers of websites
    that provide user access to information and services need to institute certain
    safeguards against some of the more common attacks. Many SQL injection attacks
    are easily thwarted by sanitizing user input before it is attached to any SQL
    commands. In other words, before the string that a user has entered into a web
    interface is inserted as a variable into an SQL statement, a subroutine should
    check the string for suspicious content. This procedure can be used for other
    types of injection attacks as well, including cross-site scripting and cross-site
    request forgery.


    ## The Ethical Hacker


    It should be clear that hacking is not the exclusive realm of thieves, terrorists,
    saboteurs, and mischievous teenagers. The study and practice of hacking is essential
    for understanding of how to protect against hackers that intend to do harm. Although
    hacking is not generally expensive, the knowledge and skills required for hacking
    are not easily acquired and take discipline and dedication to master. This makes
    the hacking community – at least in terms of the successful ones – a fairly exclusive
    group. It also gives talented hackers an advantage over the general population
    that those with ill intentions readily exploit.


    The personal ethics and moral compass of individuals tend to bleed into any activity
    they undertake. However, the ease with which some intelligent individuals can
    execute hacking attacks against their lessinformed peers may present a tantalizing
    temptation to otherwise law-abiding citizens. The potential anonymity with which
    some attacks can be launched only adds to that temptation.


    Additionally, it can be easy to convince oneself that the end goals of an attack
