    传说中，亚基肯人（古希腊人）与特洛伊人之间的史诗级战争结束，是因为狡猾的奥德修制造了一匹巨大的木马，并将其留在特洛伊城门外，作为送给这座城市的明面贡品。感激的特洛伊人将这份大礼物推入城并带入他们臭名昭著的坚固围墙之后，并不知道有一支希腊士兵躲在木马的空腹中。士兵们在深夜黑暗的掩护下出现，为剩下的亚基肯军队打开了大门，大军随后进入并洗劫了这座城市。几千年来，无论这个故事是否真实，它一直被当作警戒故事——提醒我们，有时看似无害或无辜的东西会导致我们的灭亡。在计算机黑客领域，特洛伊木马是一种看似合法或理想软件的恶意软件。它甚至可能在用户下载它的任何用途上正常运行。特洛伊木马（通常被称为“特洛伊”）的典型目的是为黑客提供对目标系统的远程访问和控制。任何编写用于让黑客秘密控制用户机器进程的恶意软件被称为
    **rootkit**（根根包）。


    病毒、蠕虫和特洛伊木马，以及它们传递到目标系统的各种载荷，其创建都需要良好的编程技能才能成功。计算机安全专业人士以及反病毒产品投入了大量精力阻止这些恶意程序。从事恶意软件的黑客不断磨练技能，他们的创作也变得越来越复杂。


    ## 第 7 章 无线攻击


    现可用 Wi-Fi 网络的普及使得 Wi-Fi 成为最常见的网络媒介之一。在许多方面，Wi-Fi 优于物理连接的传统铜线网络。除了无线网络为用户提供的连接便利性和网络配置灵活性外，由于缺少完成网络所需的物理基础设施，使其实施比以太网廉得多，也更容易。然而，这种便利性也带来了一些与传统硬线网络不相关的安全隐忧。对于基于铜线或光纤的网络，新机器加入网络需要物理连接。黑客通常很难访问目标网络的物理空间，并且在尝试将自己的硬件连接到网络电缆时可能会引起怀疑。尽管
    Wi-Fi 的范围有限，但它是全向的，服务器和无线网络上的各种节点所接收的射频信号可以穿墙墙和其他障碍，并可以被任何范围内的设备拦截。这为黑客提供了更大的自由，可以在不被发现的情况下进行网络入侵。


    ## 攻击 Wi-Fi


    大多数 Wi-Fi 网络由一个无线路由器或一组无线路由器组成，这些路由器连接到调制器，调制器为某些物理位置提供互联网访问。路由器在特定通道上广播和接收无线信号，这些信号在具有类似无线连接的其他机器和设备之间传输相应的
    TCP/IP 数据包。在与该位置调制器连接的路由器或路由器相关的通道上，任何时间通信的所有节点都构成了一个 Wi-Fi 网络。从本质上说，Wi-Fi 网络是非常动态且流动的。特别是在咖啡馆或提供无线访问的办公楼等商业环境中，特定网络上的节点数量和性质在不断变化。在这些公共场所，黑客很容易隐身于市，并尝试入侵到网络上的任何节点中。一旦黑客成功进入网络，他们就可以扫描网络以找到所有连接的机器，并探测漏洞。许多网络同时具有相互连接的无线和子网。当黑客获得无线网络的访问权限后，理论上可以利用此访问网络有线部分的所有节点。这使得
    Wi-Fi 攻击成为现代黑客非常受欢迎的目标。


    ## Wi-Fi 加密协议


    由于 Wi-Fi 信号是广播到空气中而不是限制在电线内，因此对信号进行加密非常重要。否则，任何人都可以接收并查看无线网络中传输的信息。随着 Wi-Fi 变得普及，对网络信息进行加密变得越来越重要。此外，随着技术的进步和数据速率的增加，Wi-Fi
    加密协议已经不断演变，以确保信息在无线网络中不落入黑客手中。


    最老且最常见的 Wi-Fi 加密协议是无线等效隐私（WEP）。WEP 标准的目标正如其名所意，是为用户提供与物理连接网络相同水平的安全性。遗憾的是，随着时间的推移，WEP
    已变得非常不安全，以至于即使是初级黑客也能轻松破解密码。尽管加密水平从 64 位增加到 128 位再到 256 位，但 WEP 的底层缺陷仍然易于利用。WEP
    的最大问题是，可以通过简单的被动嗅探（接收和查看网络流量）快速地破解密码。


    相比 WEP 的一个重大进步是无线保护访问（WPA）。这种新协议解决了 WEP 的许多问题，但由于它仍然基于某些底层加密算法，仍然容易受到攻击。此外，WPA
    保护的路由器配备了一个旨在方便家庭用户连接新设备的功能，该功能被证明是 WPA 系统的一个额外漏洞。


