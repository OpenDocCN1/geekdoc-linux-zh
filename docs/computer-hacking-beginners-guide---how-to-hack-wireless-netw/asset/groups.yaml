    为了制作你自己的自己的键盘记录器（Keylogger），你需要准备好某些特定的程序包。其中一些程序包包括：


    ## 1. 虚拟机


    在编写代码并需要进行测试时，并不总是建议直接在你的电脑上运行它们。这是因为代码可能具有破坏性，运行它们可能会导致你的系统受损。在测试编写好的程序时，虚拟机的利用就派上用场。


    虚拟机是一个程序，它拥有与你的计算机系统相似的环境，你可以在其中测试可能具有破坏性的程序，而不会对系统产生任何微小的伤害——即使这些程序应该是破坏性的。


    如果你说——虚拟机内部发生的任何事情都只留在虚拟机内部，那么你是正确的。虚拟机可以很容易地下载。


    ## 2. Windows 操作系统


    我们将制作的键盘记录器将只能感染 Windows 电脑。我们选择制作这种键盘记录器是因为大多数桌面用户都使用 Windows 平台。然而，除此之外，与制作可以在
    Mac 电脑上运行的键盘记录器相比，制作一个可以在 Windows 系统上运行的键盘记录器要容易得多。因此，我们从简单的方法开始，稍后在我们的下一书中进阶更复杂的方法。


    ## 3. IDE – 集成开发环境


    IDE 是一套软件组合，它整合了开发者编写和测试软件所需的基础工具。


    通常，IDE 包含一个代码编辑器、一个调试器和一个编译器，开发者通过单一图形用户界面（GUI）访问它们。我们将为此项目利用一个名为“eclipse”的 IDE。


    ## 4. 编译器


    编译器是一种特殊的程序，它处理用特定计算机语言编写的语句，并将其转换为计算机处理器可以理解的机器语言或“代码”。


    在我们开始编写键盘记录器之前，我们需要设置环境，并学习一些关于 C++ 的基础知识。学习 C++ 是因为大多数针对 Windows 的代码都是用它编写的，而且我们的键盘记录器目标平台是
    Windows。


    你绝对希望你的键盘记录器具备在所有使用 Windows 操作系统的系统上通用运行的能力。


    预先告知你，由于其语法的性质，C++ 并不是最容易学习的编程语言。尽管如此，不要就放弃，我们将从简单的内容开始，逐渐过渡到更高级的内容，采取全面的循步进的方法。


    我同时也建议你使用关于 C++ 的外部材料来扩展你在项目过程中将涉及的领域的知识，因为这将提高你的效率。


    希望在本章节结束时，你将能够制作出你自己的键盘记录器，并对其进行修改以适应你的用途。


    ## 第 11 章. 设置环境


    就像我们在使用计算机系统之前需要对其进行设置一样，同样，我们需要设置一个环境，使我们能够用 C++ 编写代码，并最终制作出一个键盘记录器。


    我们首先需要的是一个集成开发环境（IDE），正如前面所述，我们将使用 Eclipse。我们选择的 IDE（Eclipse）是基于 Java 的，因此我们需要访问
    Java 网站（www://www.eclipse.org）来下载。


    ![](img/eb3517bc8b212720f2254aa5b46526b4_57_0.png)


    当我们进入 Java 网站时，我们会发现有很多可下载的 Eclipse 插件选项。然而，由于我们意图使用 C++ 编程语言，并考虑到我们正在 Windows
    平台上工作，我们选择了“针对 C/C++ 开发者的 Eclipse”。因此，虽然有适用于 Linux、Solaris、Mac 系统等其他系统的 Eclipse
    版本，但我们将下载适用于 Windows 平台的 Eclipse。


    ![](img/eb3517bc8b212720f2254aa5b46526b4_58_0.png)


    我们还需要在 32 位或 64 位操作系统选项之间进行选择，取决于你的电脑运行的是哪种系统，右键点击“此电脑”或“我的”，然后点击“属性”。这些步骤将显示你的系统规格。在确定系统运行的位数后，继续下载与之兼容的
    Eclipse 文件。


    下载完成后，下载的文件将默认位于你的下载文件夹中，除非你更改了它的位置。我们需要解压该文件，因为它是 zip 压缩格式的。


    在解压并安装 Eclipse 文件后，尝试运行它将显示一条错误消息，说明 Eclipse 在没有 Java 运行时（JRE）或 Java 开发工具包（JDK）的情况下无法工作。这完全不是问题，因为我们只需要回到互联网并下载一个
    JDK。最新版本的 JDK 通常带有 JRE。


    ## 我们可以直接在 Google 上搜索“Java development kit”并点击指向 Oracle 网站的链接，在其中我们可以进行所需的下载。


    ![](img/eb3517bc8b212720f2254aa5b46526b4_59_0.png)


    在网站上，我们拥有许多不同操作系统和不同系统位数的 JDK 程序，从适用于 Linux 系统的 JDK 到适用于 Mac OS Solaris 的 JDK
    等。然而，正如我们所知，我们感兴趣的是适用于 Windows 操作系统的 JDK。因此我们继续下载，并确保它符合我们的系统位数（32 位或 64 位）。


    ## Java Development Kit 7u9


    你必须接受 Oracle 二进制代码许可才能下载此。


    | 产品 / 描述 | 文件大小 | 下载 |

    | :--- | :--- | :--- |

    | Linux x86 | 123.45 MB | jdk-7u9-linux-x86-bin |

    | Linux x64 | 131.68 MB | jdk-7u9-linux-x64-bin |

    | Windows x86 | 146.10 MB | jdk-7u9-windows-x86-bin |

    | Windows x64 | 199.89 MB | jdk-7u9-windows-x64-bin |

    | Mac OS X | 256.00 MB | jdk-7u9-mac-bin |

    | Solaris x64 (archive package) | 96.10 MB | jdk-7u9-solaris-x64-bin |

    | Solaris SPARC (archive package) | 24.98 MB | jdk-7u9-solaris-sparc-bin |

    | Solaris SPARC 64 (archive package) | 235.24 MB | jdk-7u9-solaris-sparc64-bin
    |

    | Solaris SPARC | 118.05 MB | jdk-7u9-solaris-sparc-bin |

    | Windows | 138.11 MB | jdk-7u9-windows-bin |

    | Windows (archive package) | 166.11 MB | jdk-7u9-archive |

