    # Web Exploits


    There are many kinds of web vulnerabilities and associated exploits - and new
    ones arise as quickly as old ones are closed. There are dozens of languages that
    are pieced together in various combinations to create a website or web application
    and vulnerabilities can exist anywhere within the structure. Listed here are a
    few examples of common exploits that illustrate how hackers use vulnerabilities
