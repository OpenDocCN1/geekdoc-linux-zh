  md: '# Why You Should Read This Book


    Like any other technological advancement in human history, the benefits gained
    from mankind from the computerization and digitization of our world come at a
    price. The more information we can store and transmit, the more it becomes vulnerable
    to theft or destruction. The more dependent our lives become on technology and
    on rapid, instantaneous communication, the greater are the consequences of losing
    access to those capabilities. It is not only possible, but in fact routine for
    billions of dollars to be transferred overseas in the blink of an eye. Entire
    libraries can be stored on devices no bigger than a human thumb. It is common
    to see toddlers playing rather mundane games on smartphones or tablets that have
    more computing power than machines that just 50 years ago would have filled entire
    rooms.


    This unprecedented concentration of data and digital wealth, coupled with society’s
    increasing reliance on digital means of storage and communication, has been a
    bonanza for savvy and malicious opportunists eager to take advantage of every
    vulnerability. From individuals committing petty theft and fraud, to political
    activists, large and highly organized criminal cabals, terrorist groups, and nation-state
    actors, computer hacking has become a multi-billion dollar industry - not only
    in the commission of crimes themselves, but in the time, effort and capital dedicated
    to protecting information and resources. It is impossible to exaggerate the implications
    of computer security in our current time. The critical infrastructure of cities
    and nations is inextricably tied to computer networks. Records of daily financial
    transactions are digitally stored whose theft or deletion could wreak havoc on
    entire economies. Sensitive email communications can sway political elections
    or court cases when released to the public. Perhaps the most concerning of all
    potential vulnerabilities is in the military realm, where increasingly networked
    and computerized instruments of war must be kept out of the wrong hands at all
    cost. These high-profile threats are accompanied'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'by the lesser, but cumulative effects of smaller scale transgressions like
    identity theft and leaks of personal information that have devastating consequences
    for the lives of everyday people.


    Not all hackers have necessarily malicious intent. In nations with hampered freedom
    of speech or oppressive laws, hackers serve to spread vital information among
    the populace that might normally be suppressed or sanitized by an authoritarian
    regime. Although their activity is still illegal by their own country''s laws,
    many are considered to be serving a moral purpose. Ethical lines are therefore
    often blurred when it comes to hacking for the purpose of political activism or
    for the dissemination of information that could be of value to the public or oppressed
    populations. In order to limit the damage that can be done by individuals and
    groups with less-honorable intentions, it is necessary to keep up with the tools,
    procedures and mindsets of hackers. Computer hackers are highly intelligent, resourceful,
    adaptive and extremely persistent. The best among them have always been, and will
    likely continue to be, a step ahead of efforts to thwart them. Thus, computer
    security specialists endeavour to become just adept and practiced at the art of
    hacking as their criminal adversaries. In the process of gaining knowledge, the
    “ethical hacker” is expected to make a commitment not to use their acquired skills
    for illegal or immoral purposes.


    This book is intended to serve as an introduction to the language, landscape,
    tools, and procedures of computer hacking. As a beginner’s guide, it assumes that
    the reader has prior knowledge of computer hacking per, other than what they have
    been exposed to media or casual conversation. It does assume a general layperson’s
    familiarity with modern computer terminology and the internet. Detailed instructions
    and specific hacking procedures are out of the scope of this book and are left
    for the reader to pursue further as they are more comfortable with the material.


    The book begins in Chapter 1: What is Hacking? with some basic definitions so
    that the reader can become familiar with some of the language and jargon used
    in the realms of hacking and computer security, as well as to clear up any ambiguities
    in terminology. Chapter 1 also distinguishes the different types of hackers with
    regard to their ethical and legal intentions and the ramifications of their activities.'
  merge: -1
  pgno: 6
- img_proc: true
