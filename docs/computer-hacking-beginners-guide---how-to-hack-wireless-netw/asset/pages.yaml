  md: '# Chapter 9. Defensive Security & Hacker Ethics


    Looking at the world through the eyes of the hacker can be a scary thing. When
    you realize how vulnerable your home network is, the first thing you want to do
    is change your Wi-Fi encryption. You look at emails more closely and with an edge
    of suspicion. Knowing what you know about scripting attacks, you start to be mindful
    not to leave many browser windows or tabs open simultaneously. Understanding the
    tools and motives of malicious hackers gives people a new appreciation for information
    and computer security. This knowledge should also give the beginning hacker pause
    to reflect on the reasons that they are choosing to learn hacking and an understanding
    that the power they may eventually gain come along with an equal degree of responsibility.
    This chapter explores how individuals and organizations can protect themselves
    from some of the most common types of attacks and discusses some of the ethical
    issues associated with operating as a white hat or gray hacker.


    # Protecting Yourself


    From simple measures like ensuring a secure password, to more advanced concepts
    like choosing the proper encryption protocols and installing protective network
    software, computer security is an everyday process for people who live in our
    connected world. Most aspects of day-to-day security simply involve common sense
    and vigilance. It is helpful to get into a regular routine for periodic tasks
    like updating or changing passwords, ensuring the latest versions or patches for
    installed software and operating systems, and downloading current virus and malware
    definitions. In order to avoid becoming a victim of the attacks you are learning
    as a beginning hacker, security should become a part of your daily life and your
    thought process.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Password and Email Practices


    The days of using your dog’s name and the last four digits of your Social Security
    number as your email password are over. Using a properly configured password is
    one of the easiest ways for people to prevent themselves from some simple “brute
    force” attacks on logins. The first thing that password-guessing hackers and automated
    password cracking software do is common for proper names, words commonly found
    in a dictionary, and simple sequences of numbers. A surprising number of people
    continue to use these types of passwords because they are much easier to remember.
    It is important to note that the practice of replacing certain letters in common
    words with numbers or symbols that have appearance (for example: p@55w0rd instead
    of password), although it is more secure than using a common word in its original
    form, is no longer fooling hackers. Most hackers have caught onto this trick and
    are using scripts which will cycle through the replacement characters during a
    brute force attack.


    It is not uncommon for a modern individual to have dozens of passwords for various
    machines, email accounts, and websites. It is frustrating to have to keep track
    of so many passwords, and to reset them when they are forgotten. However, the
    inconvenience of proper password practice is ultimately preferable to being victimized
    by a malicious hacker. Longer passwords with sufficient complexity and a mix of
    letters, numbers, and special characters at the least extend the amount of time
    hackers have to spend attempting to crack a password. An extra layer of security,
    as frustrating as it may be, is not to use the same password for all of your accounts.
    If a hacker is somehow able to successfully crack one of your passwords, they
    will then have access to all of your other accounts if you are constantly recycling
    the same password.


    It is sometimes considered acceptable password security to write down passwords,
    as long as they are stored securely. However, individuals that write down passwords
    on sticky notes that are attached to their computer monitors are just asking for
    the next “shoulder surfing” hacker to make them regret that decision. In addition,
    the longer a password stays around, the more likely it is to be cracked, so it
    is recommended to change passwords on occasion (no need to overdo it, in most
    cases few months or even every year is sufficient.)'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Many viruses, Trojans, and other malware are frequently delivered to a target
    machine through email - either as direct attachments or through links to infected
    websites. It is important to thoroughly inspect the sender of an email to be certain
    that they are who they say they are. Hackers will often use fake email addresses
    that are very similar in appearance to legitimate senders. Users should look out
    for subtle differences in the format of an email (for example john@mybank.com
    vs. john@my-bank.com). Sometimes, advanced hackers are able to forge their return
    email address to look identical to a legitimate address, but there is information
    in the email headers that indicate ill intent. Any links provided in an email
    should also be viewed with a certain suspicion. You should be sure that the links
    are from someone you trust, and ask yourself if that person would sent that sort
    of link. A little bit of common sense will go a long way. Before opening any email
    attachment, especially one that is an executable file, a virus or malware scan
    should be run on the email.


    # Computer Software Security


    Computer security professionals occasionally disagree on the efficacy of antivirus
    software. Some argue that expensive software for virus and malware protection
    can be a waste of money because advanced hackers are adept at circumventing those
    protections. However, there are multiple free computer software suites available
    that will protect the computer systems of most home users against the majority
    of the most basic and prevalent nefarious, provided that the security software
    is kept up to date.


    In any event, most software provides its own security through patches and updates.
    This is why it is very important for users to either update their software and
    operating system, or to allow these programs to update themselves automatically.
    This is especially critical for patching vulnerabilities in operating systems
    and web browsers. Microsoft Windows, Java, and Adobe Flash are commonly targeted
    by hackers and should be constantly kept up to date.


    # Network Security and Encryption


    A Wi-Fi router’s encryption protocol should be set to the highest level of encryption
    available to its particular hardware. It is also good practice to set'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'your router to publicly broadcast the name of the network (although most hackers
    can easily get around this trick). Password security is especially important on
    Wi-Fi networks because a sufficiently lengthy and complex password can extend
    the amount of time it takes a hacker to crack your network password by a significant
    amount of time. In many cases, using WPA-2 encryption with a password of maximum
    length and sufficient complexity will make it so difficult and time-consuming
    for a hacker to crack into the network that they will simply move on to another,
    less secure target.


    # Web Application Security


    Vulnerabilities in website applications, especially with in SQL and other scripted
    languages that are present within web code, are numerous. Programmers of websites
    that provide user access to information and services need to institute certain
    safeguards against some of the more common attacks. Many SQL injection attacks
    are easily thwarted by sanitizing user input before it is attached to any SQL
    commands. In other words, before the string that a user has entered into a web
    interface is inserted as a variable into an SQL statement, a subroutine should
    check the string for suspicious content. This procedure can be used for other
    types of injection attacks as well, including cross-site scripting and cross-site
    request forgery.


    # The Ethical Hacker


    It should be clear that hacking is not the exclusive realm of thieves, terrorists,
    saboteurs, and mischievous teenagers. The study and practice of hacking is essential
    for understanding of how to protect against hackers that intend to do harm. Although
    hacking is not generally


    expensive, the knowledge and skills required for hacking are not easily acquired
    and take discipline and dedication to master. This makes the hacking community
    – at least in terms of the successful ones – a fairly exclusive group. It also
    gives talented hackers an advantage over the general population that those with
    ill intentions readily exploit.


    The personal ethics and moral compass of individuals tend to bleed into any activity
    they undertake. However, the ease with which some intelligent individuals can
    execute hacking attacks against their lessinformed peers may present a tantalizing
    temptation to otherwise law-abiding citizens.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'The potential anonymity with which some attacks can be launched only adds to
    that temptation.


    Additionally, it can be easy to convince oneself that the end goals of an attack
    justify any subversive means. This is especially true in cases where hackers or
    groups of hackers are serving a political or social purpose. It is up to each
    individual to determine whether their activities warrant the risk of arrest and
    punishment (including incarceration) and to think about whether the value they
    place on their own security and privacy extend to the targets of their attacks.'
  merge: -1
  pgno: 52
