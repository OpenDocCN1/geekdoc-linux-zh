  md: 'source project, Python has gained worldwide popularity for its simplicity,
    flexibility, and portability. Hackers often use Python to help them automate certain
    tasks that are often performed on the command line. Python, like open-source software,
    comes in multiple distributions depending on the intended application. These different
    distributions contain various sets of prewritten modules, or packages, that can
    be pieced together in a Python script.


    Other interpreted languages that are important to the hacker include scripting
    languages such as HTML, JavaScript, Perl, PHP, and Ruby. These languages are used
    to develop web applications. It is vulnerabilities within web applications, in
    part, that allow hackers to gain access to target websites.


    # Database Query Languages


    A common goal of hackers is to gain access to private or confidential data. Servers
    store high volumes of data in organized structures known as databases. Databases
    have their own language that is used within the code of other programming languages
    when accessing the data. If a web application, for example, needs to access or
    change the profile information of one of its users it will need to send a command
    to the database that is written in that database’s appropriate language. These
    commands are known as queries. One of the most common database languages used
    for online applications Is the Structured Query Language, or SQL. Exploiting vulnerabilities
    in SQL has over the years, one of the most common methods that hackers have used
    to access websites and the data contained within them.


    As programmers have become wise to the vulnerabilities in SQL, they have made
    great efforts to correct those vulnerabilities, so some of the more simple attacks
    are less common. Understanding SQL and other database query languages is another
    essential tool for the hacker. An SQL server can be set up on a hacker’s test
    machine in order to practice various methods of attack.'
