  md: '# # Chapter 5. Gaining Access


    In most cases, the goal of the hacker is to gain access to a system for which
    they are not authorized. The best way to do this is to exploit vulnerabilities
    in the system of authentication. These vulnerabilities, in most cases, lie either
    in the habits of authorized users or in the coding of the software running on
    the target server. Hackers are very adept at discovering and learning how to exploit
    vulnerabilities very quickly, and new ones seem to emerge just as quickly as old
    ones are mitigated. especially large and complex ones, likely even have multiple
    vulnerabilities that have not been discovered yet. A good security professional
    learns how to think like a hacker so that they can anticipate problems with the
    systems they are protecting before black hackers can exploit them. This chapter
    illustrates some exploits of a few of the more common in traditional vulnerabilities
    in both human users and software.


    # ## Social Engineering


    Human users are often the weakest link in the "kill chain" of computer security.
    Many users have only little understanding of the systems they are using, but they
    also tend to have little appreciation for the nature of cyber threats, and have
    little desire to take the time and effort to protect themselves. Although people
    are starting to become aware, there are still enough human targets around for
    hackers to exploit. Social engineering is the activity of using simple reconnaissance
    or deception to obtain passwords or access directly from unsuspecting users. Social
    engineering requires little technical expertise and is preferred by hackers to
    the more difficult and risky attacks that entail intrusive methods.


    # ## PASSIVE PASSWORD ACQUISITION


    Perhaps the simplest type of social engineering is that of guessing an individual’s
    login password. Despite warnings, users continue to use'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'passwords that contain common or easily guessed sequences of characters. The
    main reason that this practice is so common is that people tend to desire passwords
    that they can easily recall. Most people have several email and user accounts
    for both home and work, making it difficult to keep track of them all, and thus
    may use the same - or a similar – password for multiple accounts. This practice
    puts all of their accounts in danger when hacker successfully obtains the password.
    Common password mistakes are using one''s own name or that of a family member
    or pet, using words commonly found in a dictionary, using sequences of numbers
    corresponding to their birthday or that of a loved one, including parts of their
    residential address, using names of favorite sport teams, and other themes that
    are easily remembered. One of the biggest reasons why this is an especially poor
    practice in the modern age is that there is so much information that is readily
    and publicly available on the internet. A simple glance at an individual''s social
    media page usually reveals a treasure of information about them. When someone
    allows their social media profile to be publicly viewed, it becomes a perfect
    source for hacker to refine their password guesses. Personal data useful for guessing
    passwords can also be obtained through the practice of dumpster인지, whereby a hacker
    rummages through a target user''s trash for paperwork containing sensitive information.
    Password security has become such a problem that more and more websites, online
    accounts, email services, and other systems require passwords are beginning to
    enact strict restrictions on the format and content of passwords.


    More interactive types of social engineering involve a certain degree of surveillance
    or reconnaissance on the part of the hacker. If a hacker has physical access to
    the location of their target system, they might attempt to view a user while they
    are actually typing their login information. This is colloquially known as shoulder
    surfing because it involves covertly peering over the shoulders of users.


    # PHISHING, SPEAR-PHISHING, AND WHALING


    The general anonymity of the Internet can lull people into a false sense of security,
    allowing them to engage in behavior that they would never engage in face-to-face.
    If a stranger knocked on and individual''s door claiming to be a representative
    of their bank and asking for the key to their safety deposit box, it is likely
    that the person will have a door quickly'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'slammed in their face. Nevertheless, thousands of people every day readily
    reveal their personal and login information to fraudulent hackers through the
    Web, email, phone, and text messaging.


    A common method that hackers use to obtain user information is the process of
    phishing. In the tradition of the quirky nomenclature of hacking jargon, phishing
    is a homonym of “fishing”, and gets its name from the idea that practice is similar
    to dangling a hook in the water, waiting for a fish to bite. A typical phishing
    email is written to resemble a legitimate communication from a bank, from an online
    shopping or service account, or even from a department within a victim''s own
    organization. Often, the email will present itself to the user as a request to
    confirm or reset a password. Sophisticated phishing messages will use forged email
    headers, convincing language, and nearly identical formatting to legitimate emails.
    If a target user falls for the trap, they will respond to the email with their
    username and password or click on a web link that accepts the information in a
    legitimate-looking form. Normally, thousands of emails will be deployed in a single
    phishing attack in the hopes that at least a small percentage of recipients respond.


    In contrast to phishing, where a high volume of identical emails is sent to multiple
    users like dangling bait among many fish, spear-phishing targets specific users
    – just as a spear-fisherman is aiming at an individual fish. Although spear-phishing
    does not produce a high volume of accounts like a phishing attack, it can have
    a higher rate of success because more individualized emails are generally more
    convincing. A well-executed spearphishing email will often address the target
    user by name, and contain other personal details to make it appear more authentic.
    Thus, there is typically some research or social engineering that precedes a spear-phishing
    attack. In most cases, this type of attack is conducted because the hacker has
    identified the individuals being targeted as possessing information, assets, or
    computer access that is of particular interest. The ultimate spear-phishing attacks
    are leveled against high-value targets in an organization – typically executives
    or information officers with top access. Because these individuals are the “big
    fish”, this type of attack has become known as harpoons or whaling. Phishing,
    spear-phishing, and harpooning attacks are not only conducted for the purpose
    of obtaining passwords. Sometimes they are used to gather other'
