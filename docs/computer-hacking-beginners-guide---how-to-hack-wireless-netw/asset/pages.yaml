  md: '# Chapter 2. Vulnerabilities And Exploits


    The essence of hacking is the exploitation of flaws in the security of a computer,
    device, software component, or network. These flaws are known as vulnerabilities.
    The goal of the hacker is to discover the vulnerabilities in a system that will
    give them the easiest access or control that serves their purposes. Once the vulnerabilities
    are understood, exploitation of those vulnerabilities can begin, whereby the hacker
    takes advantage of the system to gain access. Generally, black hat and white hat
    hackers intend to exploit the vulnerabilities, albeit for different purposes,
    whereas gray hats will attempt to notify the owner so that action can protect
    the system.


    # Vulnerabilities


    Vulnerabilities in computing and network systems always have and always will exist.
    No system can be made 100% airtight because someone will always need to be able
    to access the information or services being protected. Moreover, the presence
    of human users represents a vulnerability in and of itself people are notoriously
    poor at practicing good security. As vulnerabilities are discovered and corrected,
    new ones instantly take their place. The back-and-forth between hacker exploitation
    and the implementation of security measures represents a veritable arms race,
    with each side becoming more sophisticated in tandem.


    # Human Vulnerabilities


    One seldom-discussed vulnerability is that of the human user. Most users of computers
    and information systems are not computer experts or cybersecurity professionals.
    The majority of users know very little about what goes on between their points
    of interface and the data or services they are accessing. It is difficult to get
    people on a large scale to change their habits and to use recommended practices
    for setting passwords, carefully vetting emails, avoiding malicious websites,
    and keeping their software up to'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'date. Businesses and government agencies spend a great deal of time resources
    training employees to follow proper information security procedures, but it only
    takes one weak link in the chain to give hackers the window they are looking for
    to access an entire system or network.


    The most sophisticated and expensive firewalls and network intrusion prevention
    of systems are rendered useless when a single internal user clicks on a malicious
    link, opens a virus in an email attachment, plugs in a compromised flash drive,
    or simply gives away their password over the phone or email. Even when repeatedly
    reminded of best security practices, common users are the easiest and most consistent
    vulnerability to discover and exploit. Sometimes human vulnerabilities are as
    simple as practicing bad security by leaving passwords written on notes in plain
    site, sometimes even attached to hardware being used. Using easily-guessed passwords
    is another common mistake. One particular corporate system was compromised when
    a clever hacker intentionally left a USB flash drive in a company''s parking lot.
    When an unsuspecting employee found, they put the drive into computer and subsequently
    unleashed a virus. Most individuals don''t take computer security seriously until
    an incident occurs, and even then, they fall back into the same habits. Hackers
    know this and take advantage of it as often as possible.


    # Software Vulnerabilities


    All computers rely on software (or "firmware", in some devices) to translate input
    or use commands into action. Software manages user logins, performs database queries,
    executes website form submissions, controls hardware and peripherals, and manages
    other aspects of computer and network functionality that could be exploited by
    a hacker. Aside from the fact that programmers make mistakes and oversights, it
    is impossible for software developers to anticipate every feasible vulnerability
    in their code. The most developers can hope for is to patch and amend their software


    as vulnerabilities are discovered. This is why it is so important to keep software
    up to date.


    As software vulnerabilities are due to errors in programming, but most are simply
    due to unanticipated flaws in design. Software is often secure'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'when used as designed, but unforeseen and unintended combinations of inputs,
    commands, and conditions often result in unanticipated consequences. Without strict
    controls on how users interact with software, many software vulnerabilities are
    discovered by mistake or at random. Hackers make it business to discover these
    anomalies as quickly as possible.


    # Exploits


    Finding and exploiting vulnerabilities to gain access to systems is both an art
    and a science. Because of the dynamic nature of information security, there is
    a constant game of “cat and mouse” going on between hackers and security professionals,
    and even between nation-state adversaries. In order to stay ahead (or at least
    not let too far behind), one must not stay apprised of the latest technology and
    vulnerabilities, but must also be able to anticipate how hackers and security
    personnel will react to changes in the overall landscape.


    # Access


    The common goal of exploitation is to gain access to, and some level of control
    of, a target system. Since many systems have multiple levels of access for the
    purposes of security, it is often the case that each level of access has its own
    slate of vulnerabilities and are typically more difficult to hack as a hacker
    is to reach the superuser or root (a UNIX term) level - known as “getting root”
    in hacker language. This highest level affords the user control of all systems,
    files, databases, and settings in a given self-contained system.


    It can be quite difficult to break the root of a secure computer system in a single
    exploit. More often, hackers will exploit easier vulnerabilities or take advantage
    of less experienced users to first gain level access. From that point, further
    methods can be employed to reach higher levels from administrators up root. With
    root access, a hacker can view, download, and overwrite information at will, and
    in some cases remove traces that they were even in the system. For this reason,
    getting root in a target system is a point of pride as the utmost achievement
    among black hat and white hat hackers.


    # Denying Access'
  merge: -1
  pgno: 17
- img_proc: true
  md: In many cases, gaining access to a particular target system is impossible, exceedingly
    difficult, or not even desired by a hacker. At times, the goal of a hacker is
    simply to prevent legitimate users from accessing a website or network. This type
    of activity is known as denial-of-service (DoS). Since it is relatively simple
    to execute, it is often a beginner exercise for an inexperienced hacker (“newbie”,
    “n\u003b”, or “\u00eophyte”) in the parlance to earn some bragging rights. More
    experienced hackers can execute sustained DoS attacks that disrupt commercial
    or government servers for an extended period of time. Thus, organized groups of
    hackers often hold a website “hostage” and demand a ransom from the owners in
    exchange for halting the attack, all without ever having to gain access.
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 3. Getting Started


    Hackers have a reputation for being highly intelligent individuals and prodigious
    in many ways. It can therefore seem to be an overwhelming and uphill task to start
    from scratch and reach any level of practical proficiency. One must remember that
    everyone must start somewhere when learning a subject or skill. With dedication
    and perseverance, it is possible to go as far in the world of hacking as your
    will can take you. One thing that will help in the process of becoming a hacker
    is to set some goals. Ask why you want to learn hacking and what you intend to
    accomplish. Some just want to learn the basics so they can understand how to protect
    themselves, their family, or their business from malicious attacks. Others are
    looking to set themselves up for a career in white-hat hacking or information
    security. Whatever your reasons, you should prepare to learn quite a bit of new
    knowledge and skills.


    # Learning


    The most important weapon in a hacker''s arsenal is knowledge. Not only is it
    important for a hacker to learn as much as possible about computers, networks,
    and software - but in order to stay competitive and effective they must stay up
    to date on the constant and rapid changes in computers and computer security.
    It is not necessary for a hacker to be an engineer, computer scientist, or to
    have intimate knowledge of microprocessor or computer hardware design, but they
    should understand how a computer works, the chief components and how they interact,
    how computers are networked both locally and through the internet, how users typically
    interact with their machines, and most importantly - how software dictates computer
    function. An excellent hacker is fluent and practiced in several computer languages
    and understands the major operating systems. It is also very useful for a hacker
    to be familiar with the history, mathematics, and practice of cryptography.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'It is possible, and increasingly common, for a layperson with little hacking
    experience and only slight or intermediate knowledge about programming to conduct
    an attack against a system. People often do this using scripts and following procedures
    that were developed by more experienced operators. This happens most commonly
    with simpler types of attacks, like denial of service. These inexperienced hackers
    are known in the hacking community as script kiddies. The problem with this type
    of activity is that the perpetrators have little experience for what''s going
    on the code they are running, and may not be able to anticipate side effects or
    other unintended consequences. It is best to fully understand what you are doing
    before attempting an attack.


    # Computers and Processors


    Computers vary in size, shape, and purpose, but most of them essentially have
    the same design. A good hacker should study how computers evolved from the earliest
    machines in the 20th century to the vastly more sophisticated machines that we
    use today. In the process, it becomes evident that computers have the same basic
    components. To be an effective hacker, you should know the different types of
    processors that exist on the majority of modern computers. For instance, the three
    largest microprocessor manufacturers are Intel, American Micro Devices (AMD),
    and Motorola. These processors comprise most of the personal computers that a
    hacker will encounter, each has their own unique instruction set. Although most
    hackers rarely have to deal with programming languages on the machine level, more
    sophisticated attacks may require an understanding of the differences between
    processor instruction sets.


    Some processors are programmable by the end user. These are known as Field-Programmable
    Gate Arrays (FPGA) and are being used more and more for embedded systems, particularly
