  md: '# Chapter 4. The Hacker’s Toolkit


    Even armed with knowledge, resourcefulness, and just the right amount of stubborn
    perseverance, the hacker still needs a certain set of physical tools to conduct
    an attack. However, hacking does not have to be an expensive profession or hobby.
    Most of the software tools that a hacker needs can be obtained freely because
    they are open-source products. Nor does a hacker need thousands of dollars in
    high-powered computing equipment - for most attacks, a simple laptop or desktop
    computer with a reasonable amount of memory, storage, and processor speed will
    suffice. Over the decades, hackers have become notorious for accomplishing a great
    deal on relatively low budgets. Although each individual will need to decide for
    themselves what combination of hardware and software they need for their particular
    goals, this chapter will serve as a guide to help understand what different options
    are available and preferred in the hacking community.


    # Operating Systems & Distributions


    An operating system (OS) is the intermediary between a computer’s hardware and
    software. OS typically manages the file system, peripheral communication, and
    user accounts among other responsibilities. There are several brands of operating
    systems, both commercial and open source, that can be installed on any given computer
    platform. Microsoft Windows is the most commonly known and installed commercial
    OS for “PC” style systems. Apple has its own OS that comes installed on its computer
    and mobile systems. Google’s open source Android is rapidly gaining popularity.


    The Linux operating system, named for and developed by Linus Torvalds - a legendary
    figure in hacker culture - is an open-source offshoot of the UNIX (Apple’s OS
    is also based on UNIX) operating system. Linux gained popularity among hackers
    and hard-core computer enthusiasts over the years'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'for its flexibility and portability. Various distributions of Linux have evolved
    for different purposes through constant tinkering by its users. Distributions
    are typically distinguished from each other by their size, user interface, hardware
    drivers and the software tools that come pre-installed. Some popular Linux distributions,
    like Red Hat and Ubuntu, are for general use. Others have been developed for specific
    tasks and platforms. The operating system on a hacker’s“attack” platform is the
    heart of his her toolkit.


    # Kali Linux


    Formerly known as Backtrack, Kali is a popular open source operating system for
    hackers. Kali (the most recent distributions of Kali Linux can be found at www.kali.org/downloads)
    or run from a virtual machine within another operating system. Over the years
    Kali has evolved to contain a large array of the most useful vulnerability assessment
    and exploitation programs. It is one of the first tools that a beginning hacker
    should obtain. Kali not only provides practice using a Linux platform, but also
    contains everything a hacker needs to perform some of the most basic lower-level
    attacks in order to gain valuable experience.


    ![](img/eb3517bc8b212720f2254aa5b46526b4_24_0.png)


    A Screenshot of Kali Linux With a Menu of Tools


    # Forensic Distributions


    the Linux OS is also available in several free distributions that are intended
    to be used for forensic computer analysis. These distributions'
