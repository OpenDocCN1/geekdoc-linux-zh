    # Programming Languages


    Computers are the servants of mankind, but they don’t know what to do without
    clear instructions. Since the binary language of machines is very difficult for
    human to conceptualize, we developed programming languages that are closer to
    human language, which can then be translated for the machine to understand. Computer
    languages have evolved from simple line-by-line scripts, to more modular structured
    languages, to the advanced object-oriented languages that are used to develop
    software today. Scripted languages, however, still play a major part in computer
    and network operations. Since programs are written by people, they are of course
    subject to error. These errors are not only unintended mistakes in the actual
    coding, but oversights in the planning of the program itself. These errors are
    what hackers look for when attempting to gain unauthorized access to their target
    systems. It is therefore fundamental for hackers to obtain the compilers and interpreters
    necessary to become fluent in a few important programming languages, and at least
    minimally familiar with several others. Most of these'
  merge: -1
